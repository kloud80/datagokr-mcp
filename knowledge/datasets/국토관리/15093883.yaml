summary_user: 충청남도 계룡시 관내 아파트·연립주택 등 공동주택 단지를 한 행씩 담은 목록 파일로, 단지 명칭·위치·건축 유형(분류)·동수·세대수·최고 층수와 허가일·착공일·준공일을 기록한다(CSV 약 2.3KB의 소규모 파일). 계룡시에 어떤 단지가 언제 준공돼 몇 년 된 건물인지, 세대 규모는 얼마인지 확인하려는 주민·중개사·분석가가 쓴다. 전역 조인 키나 K-apt 단지코드가 없으므로 실거래·공시가격·K-apt 관리 정보와는 단지명·주소를 직접 맞춰서 연결해야 한다.
description_portal: 충청남도 계룡시의 '공동주택' 데이터는 관내에 건설되거나 등록된 모든 아파트, 연립주택 등 다세대 주택 단지의 종합적인 건축 및 현황 정보를 담고 있는 자료입니다. 이 자료에는 단지의 명칭과 정확한 위치를 비롯하여, 해당 주택의 건축 유형을 구분하는 분류 정보가 포함됩니다. 더불어, 단지의 규모를 나타내는 동수와 총 세대수, 그리고 건물의 높이를 나타내는 최고 층수와 같은 양적인 정보가 상세히 기록되어 있습니다. 주택 건설의 진행 단계를 알 수 있는 허가일, 실제 건설이 시작된 착공일, 그리고 사용 승인이 이루어진 준공일 등 시간 정보를 함께 제공함으로써, 해당 공동주택의 건축 경과와 연령을 정확히 확인할 수 있게 하는 중요한 부동산 및 건축 행정 데이터입니다.
