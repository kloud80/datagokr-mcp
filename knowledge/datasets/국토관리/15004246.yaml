description_portal: (개요) 정부에서는 토지의 적정가격을 평가공시하여 일반적인 토지거래의 지표가 되고, 국가 및 지방자치단체 등이 업무와 관련하여 지가를 산정하거나 감정평가법인등이 개별적으로 감정평가를 하는 경우 지가산정의 기준으로 제공하기위해 1898년에 '지가공시 및 토지등의 평가에 관한 법률(현 부동산 가격공시에 관한 법률)'을 제정하여 공시지가제도를 새로이 도입. 이에 따라 국토교통부장관은 매년 1월1일을 기준으로 전국에 일정토지를 표준지로 선정하고, 이들 표준지에 대한 가격을 감정평가사가 조사평가하여 그 결과를 중앙부동산가격공시위원회의 심의를 거쳐 단위면적당 가격을 공시함으로써 공시지가에 대한 공정성과 신뢰성을 제고하고 있음.(개념) 표준지공시지가란 부동산 가격공시 및 감정평가에 관한 법률 제3조에 따라 국토교통부장관이 결정공시하는 표준지의 단위면적당 적정가격을 말함. 적정가격이라 함은 당해 토지에 대하여 통상적인 시장에서 정상적인 거래가 이루어지는 경우 성립될 가능성이 가장 높다고 인정되는 가격을 말함. (효력) 표준지공시지가의  효력은 토지시장의 지가정보를 제공하고, 일반적인 토지거래의 지표가 되며, 국가와 지방자치단체 등의 기관이 그 업무와 관련하여 지가를 산정하는 경우에 그 기준이되며, 감정평가법인등이 개별적으로 토지를 감정평가하는 경우에 그 기준이 됨.(근거) 국토교통부장관은 토지이용상황이나 주변 환경, 그 밖의 자연적, 사회적 조건이 일반적으로 유사하다고 인정되는 일단의 토지 중에서 선정한 표준지에 대하여 매년 공시기준일 현재의 단위면적당 적정가격을 조사평가하고 중앙부동산가격공시위원회의 심의를 거쳐 이를 공시함
