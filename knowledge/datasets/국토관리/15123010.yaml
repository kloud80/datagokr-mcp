description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 건축물 총괄표제부 정보를 제공합니다. 각 건축물의 전체 규모와 건축 관련 주요 지표를 종합한 정보를 담고 있어 건축물의 기본 현황을 파악할 수 있습니다. 건축물대장은 건물을 식별하는 정보이며, 대지면적은 건축물이 위치한 토지의 면적을 나타냅니다. 건축면적은 건물이 차지하는 바닥 면적이고, 건폐율은 대지면적 대비 건축면적의 비율을 표시합니다. 연면적은 모든 층의 바닥 면적 합계이며, 용적율 산정용 연면적과 용적율은 대지면적 대비 건축 규모를 나타냅니다. 기타용도는 건축물의 사용 목적을 표시하고, 사용승인일은 건축 완료 시점을 기록합니다.
