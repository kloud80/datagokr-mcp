summary_user: 경기도 데이터분석시스템이 만든 출산·혼인 상관분석 기본정보로, 연령별출산율·모 평균연령·조혼인율·아내 평균연령 같은 지표를 항목명(item_nm)과 연도(yr)별 상관계수 값으로 담은 집계 자료이며 범위는 시도 단위·비공간이다. 분석가나 정책 담당자가 혼인 연령 상승과 출산 지연이 얼마나 함께 움직이는지 확인하려 할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 지표 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 출산·혼인 상관분석 기본정보로, 연도별 출산율과 혼인율 지표 간의 상관관계를 수치화한 자료입니다. 주요 항목에는 연령별출산율, 모 평균연령, 가임여성대비 출산율, 첫출산·재출산 연령비, 동거기간, 조혼인율, 연령별혼인율, 아내 평균연령 등이 포함되어 있으며, 각 항목은 특정 연도 기준으로 상관계수 형태로 제공됩니다. 이를 활용하면 출산율 변화와 혼인율 추세 간의 연관성을 분석할 수 있으며, 혼인 연령 상승과 출산 지연 현상, 가임여성 규모에 따른 출산율 변동 등을 데이터 기반으로 탐색할 수 있습니다.
