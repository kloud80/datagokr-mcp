summary_user: 충청남도 홍성군의 재난대응용 배수펌프장을 펌프장 한 곳당 한 행으로 담은 시설 현황 파일로, 소재지 주소·설치년도·모터펌프 규모와 대수·한전 전원공급 회선·비상발전기·계약전력·연간 사용전력량과 전기요금을 포함한다(파일 크기 840바이트의 소규모 목록). 홍성군 안의 배수펌프장이 정전 때 비상발전기와 2회선 전원을 갖췄는지, 연간 전기요금이 얼마인지 확인하려는 방재 담당자나 분석가가 시설 보강 검토에 쓴다. 전역 조인 키나 하천코드가 없어 다른 하천·수문 데이터와는 펌프장명이나 소재지 주소를 이름·주소 매칭해 이어 쓴다.
description_portal: 본 데이터는 충청남도 홍성군 내 재난대응을 목적으로 설치된 배수펌프장의 시설 현황을 제공합니다. 데이터에는 펌프장명, 소재지 주소, 설치년도, 설치목적, 모터펌프 규모(kW), 모터펌프 대수, 한전 전원공급방식(1회선 또는 2회선), 비상발전기(kW(HP)), 비상발전기 대수, 한전 계약전력(kW), 전압크기, 연간 사용전력량(KWH), 연간 전기요금, 전기요금 최대치 및 최소치 등의 항목을 포함하고 있습니다. 본 자료는 재해 예방 및 수해 대응 시설의 에너지 운용 현황을 파악하고, 향후 시설 보강 및 전력공급 체계 개선을 위한 기초 자료로 활용됩니다.
