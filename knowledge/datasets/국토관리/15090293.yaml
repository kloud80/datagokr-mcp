description_portal: 이 정보는 안산시에서 추진 중인 공공주택사업 현황을 정리한 자료입니다. 총 3건의 공공주택 지구가 포함되어 있으며, 시군명, 시군코드, 지구명, 면적, 세대수, 수용인구, 사업시작일, 사업종료예정일, 시행자, 추진현황 등 10개 항목으로 구성되어 있습니다. 수록된 지구는 고잔(행복주택), 장상, 신길2이며, 각각의 사업 면적은 최소 48천㎡부터 최대 2,213천㎡까지 다양하며, 세대수는 최대 13,000세대, 수용인구는 최대 29,084명 규모입니다. 사업 추진 주체로는 한국토지주택공사(LH), 경기도시공사, 안산도시공사 등이 참여하고 있으며, 각 지구의 추진현황은 ‘지구계획수립중’, ‘대체부지 검토중’ 등으로 기재되어 있습니다. 본 정보는 공공주택 공급계획, 도시개발 전략, 인구 유입 예측, 기반시설 조성계획 등 행정 목적의 활용은 물론, 민간 부동산 개발 전략 수립, 교통 및 상권 분석, 지역 개발 타당성 평가 등 다양한 분야에서 유용하게 활용될 수 있습니다.
