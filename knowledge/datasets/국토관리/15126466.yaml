summary_user: 신고된 토지 매매 실거래를 건별로 담은 API로, 지역코드(법정동 앞 5자리)와 계약년월로 조회하며 거래금액(만원)·거래면적·지목·용도지역·해제 여부 등을 제공한다. 내 동네 토지가 얼마에 거래됐는지, 어떤 지목과 용도지역의 땅이 얼마에 팔렸는지 알아보려는 국민·사업자·분석가가 쓴다. 시군구 코드(sggCd, 조인 키 sgg_cd)로 같은 실거래 부문의 다른 거래 유형 API나 법정동 코드 기반 자료와 이어 쓴다.
limits: 지번은 개인정보 보호를 위해 일부만 제공되므로 특정 필지를 정확히 찾아내는 용도에는 맞지 않는다. 계약 후 30일 내 신고와 해제·정정 소급이 있어 최근 월 자료는 나중에 바뀔 수 있고, 해제 여부(cdealType)를 함께 확인해야 한다. 검증 호출에서는 10행만 수신해 전체 규모는 확인되지 않았다.
