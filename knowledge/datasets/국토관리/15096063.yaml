summary_user: 계룡시 관내에 설치된 일반 현수막 게시대를 시설 한 곳씩 담은 건별 현황으로, 위치 명칭과 도로명주소, 규격, 일반·행정 면수, 형식, 설치 개수, 비고를 담는다. 현수막을 걸려는 사업자나 시민이 계룡시에서 일반 광고용 면이 있는 게시대가 어디에 몇 개 있는지 확인할 때 쓴다. 전역 조인 키가 없어 도로명주소(RDNMADR)를 기준으로 주소·좌표 데이터와 맞추거나 같은 기관의 다른 시설 데이터와 이름으로 이어 쓴다.
description_portal: 충청남도 계룡시의 '현수막 게시대 API' 데이터는 관내에 설치되어 운영 중인 일반 현수막 게시대 시설물의 상세 현황 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 현수막 게시대 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 시설의 위치 명칭과 정확한 도로명주소가 포함됩니다. 또한, 현수막의 크기인 규격, 일반 광고용과 행정 홍보용으로 나뉜 일반 면수 및 행정 면수, 시설의 형식, 그리고 설치 개수 등 상세한 물리적 정보가 제공됩니다. 특이사항을 기록하는 비고 항목도 있습니다.
