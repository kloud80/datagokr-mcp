summary_user: 대구도시개발공사가 공급하는 분양주택의 타입(평형)별 정보를 한 행씩 담은 원천 파일(CSV, 약 412KB)로, 주택 방향·방 수·전용·공용·분양·계약 면적, 공급가액·부가세·대지비·건축비, 국민주택기금·융자한도, 발코니 확장 항목 등을 담는다. 분양을 고려하는 수요자나 분석가가 "이 단지의 84㎡ 타입은 공급가액과 대지비·건축비 구성이 어떻게 되고 전용면적 대비 분양면적은 얼마인가" 같은 질문에 쓴다. 전역 조인 키는 없으며, 주택코드·주택타입코드로 같은 기관의 다른 분양주택 데이터와 코드 매핑으로만 이어 쓴다.
description_portal: 해당 데이터는 대구도시개발공사가 공급하는 분양주택의 주택유형 정보를 제공하며, 주택코드, 주택타입코드, 주택타입명, 타입평수, 주택방향, 평수, 방수, 주택형태, 공급가액, 부가세, 주민건축비용, 주민부가세, 임대료, 국민주택기금, 융자한도금액, 대지비용, 건축비용, 주택전용면적 등을 포함하고 있습니다. 이를 통해 수요자별 맞춤형 주택정보 제공이 가능하며, 분양 계획 수립과 시장 분석, 공급 조정 등 다양한 행정 및 정책 결정에 활용됩니다. 주택 유형 다양성 확보 및 효율적 분양 전략 수립에 기여합니다.
