summary_user: 실제 하천(수치지형도상 하천)인데 연속지적도에서는 하천으로 등록되지 않은 토지, 즉 하천지역의 지적불부합 의심 지역을 전국 범위에서 필지·건물 단위로 추출해 담은 공간 분석 결과 파일입니다. 지적재조사 담당자나 하천 관리 분석가가 '우리 시도에서 실제로는 하천인데 지적상 하천이 아닌 필지가 어디인가'를 확인하고 정비 대상을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지명·코드 매핑이나 같은 기관 코드로만 이어 쓸 수 있다.
description_portal: 지적불부합지라 함은 실제와 지적공부 상에 등록된 각종 토지 관련 정보가 일치하지 않는 것을 말한다. 2012년 시작된 지적재조사사업은 종이 지적도를 디지털화하여 우리 땅의 가치를 높이고, 공간정보산업의 토대를 닦는 사업이다. 지적재조사 사업이 시행됨에 따라 새로운 디지털 지적정보를 구축하고 있는 가운데 지적불부합지를 구축하기 위한 활용 데이터 표준화 및 분석 과정 정형화 통해 지적불부합지 표준분석모델을 구축한다.지적불부합지 표준분석모델은 실제 지적상 등록된 토지 관련 정보가 일치하지 않는 지역을 빅데이터 분석 플랫폼을 통해 전국을 한 번에 비교 분석하여 미일치 지역을 도출하는 것에 목적을 두고 있다. 사실상 하천(수치지형도 하천)과 연속지적도상 하천이 아닌 지적정보 추출
