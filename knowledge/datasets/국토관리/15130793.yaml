summary_user: 경기도 경기부동산포털이 제공하는 옥외대피장소 목록으로, 학교 운동장·체육공원·근린공원·마을회관 같은 대피 시설을 시설 한 곳당 한 행으로 담고 시설명, 주소, 면적, 위도·경도를 포함한다. 주민이 우리 동네에서 가장 가까운 옥외대피장소가 어디인지 찾거나, 분석가가 시군구별 대피장소 수와 면적이 충분한지 비교하는 데 쓴다. 다른 데이터와 공통으로 쓸 전역 조인 키는 실측에서 확인되지 않아, 시군구명이나 법정동·행정동 코드(legaldong_cd, admdong_cd)를 매핑해 행정구역 단위 통계와 잇거나 좌표로 공간 결합한다.
description_portal: 이 데이터는 경기도 경기부동산포털에서 제공하는 옥외대피장소 정보로, 재난·재해 발생 시 주민들이 대피할 수 있는 시설 현황을 담고 있습니다. 주요 항목에는 지역코드, 시설일련번호, 시군구명, 시설명, 도로명주소 및 법정·행정동 코드, 상세주소, 시설면적, 위도·경도 좌표, 지번코드가 포함됩니다. 대피장소는 초·중·고등학교 운동장, 종합운동장, 체육공원, 근린공원, 마을회관 등 다양한 유형이 있으며, 면적과 위치 정보가 함께 제공되어 재난 대응 계획 수립, 안전 시설 관리, GIS 기반 공간 분석, 주민 안내 서비스에 활용할 수 있습니다.
