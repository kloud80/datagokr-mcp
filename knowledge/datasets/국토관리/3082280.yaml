summary_user: 인천광역시 연수구 안의 목욕장 업소를 업소 한 곳당 한 줄로 담은 목록 파일로, 업종명·업소명·도로명 주소·지번 주소·전화번호가 들어 있다(csv 약 4.6KB 규모). 주민이 '우리 동네 가까운 목욕탕은 어디이고 전화번호는 무엇인가'를 찾거나, 분석가가 연수구 안에서 목욕장이 어떻게 분포하는지 살펴보는 데 쓴다. 전역 조인 키나 코드표는 없으므로, 다른 데이터와는 주소를 지오코딩해 위치로 맞추거나 업소명·주소 문자열로 대조해 잇는다.
limits: 연수구 한 곳만 다루므로 인천 전체나 다른 시군구와 비교하려면 다른 구의 자료를 따로 모아야 한다. 인허가번호나 표준 코드 같은 공통 키가 없어서, 공중위생 인허가 자료 등과 연결할 때는 이름·주소 매칭에 기대야 하고 이 과정에서 오차가 생길 수 있다.
