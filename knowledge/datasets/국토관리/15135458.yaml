summary_user: 안산시의 유동인구를 일자·시간대(00~23시, 1시간 단위)별로 집계한 데이터로, 내외국인 구분과 성별·5세 단위 연령대(0~69세)별 인구수를 담으며 이동통신 기지국 기반 추정치를 50m×50m 셀로 분배해 소수점 값이 나온다. 상권 분석가나 창업 예정자가 '안산시에서 20~30대 여성 유동인구가 많은 시간대는 언제인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드·시군구명(signgu_cd) 같은 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 안산시 지역을 대상으로 수집된 시간대별 유동인구 정보를 포함하고 있으며, 00시부터 23시까지 1시간 단위로 구성되어 있습니다. 유동인구는 성별 및 연령대(0~69세)를 기준으로 남자0009수, 여자2529수 등으로 세분화되어 있으며, 외국인 여부도 구분되어 분석됩니다. 유동인구 수치는 이동통신 기지국을 기반으로 측정되며, 수집된 데이터를 50m×50m 셀 단위로 분배하는 방식으로 인해 소수점 값이 나타날 수 있습니다. 주요 항목으로는 시군구코드, 시군구명, 시간코드, 외국인구분, 성별 및 연령대별 인구수, 연도_월_일이 포함되어 있습니다.
