summary_user: 광주광역시 북구에서 2022년 7월 1일 이후 허가된 건축 현장을 건별로 담아 주용도(건설내용), 대지위치(지번), 허가일, 착공처리일, 사용승인예정일을 기록한 CSV 파일(약 22KB)이다. 주민이나 부동산·건설 사업자가 '우리 동네 어느 필지에 어떤 용도의 건물이 착공됐고 언제 준공될 예정인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 지번 주소를 매칭하거나 같은 기관 데이터끼리만 연결한다.
description_portal: 광주광역시 북구 내 건설(건축)허가현황 데이터입니다.2022년 7월 1일 이후의 광주광역시 북구 건설허가현황의 주용도(건설내용), 대지위치, 허가일, 착공처리일, 준공예정일(사용승인예정일) 항목에 대한 정보를 공공데이터포털을 통해 CSV 파일로 제공하고 있습니다.현재 미사용 승인 현장, 사용승인예정일은 착공 당시 제출 날짜로 변동 가능합니다.* 대지위치는 건물이 위치하지 않은 대지 특성상 도로명주소가 부여되지 않아 모든 값이 지번주소로 기재되어 있습니다. 또한, 다수 필지에 걸쳐 있는 경우 대표 필지만 기재되고 "외N필지" 로 기재되어 있습니다.
