summary_user: 서울특별시 건축물대장 표제부를 건축물 동 단위로 담은 건별 원천 데이터로, 시도 범위의 필지·건물별 대지위치와 지번, 도로명주소, 대장 구분(일반·집합), 대지면적·건축면적·연면적·건폐율·용적률, 구조·주용도·지붕, 세대·가구·호수, 지상·지하 층수, 높이, 승강기·주차 대수 등을 기재한다. 분석가나 사업자가 '이 지번의 건물은 몇 층이고 용도와 용적률은 얼마인가', '자치구별 노후·고층 건물 분포는 어떤가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구·법정동 이름과 주번·부번 지번, 도로명 같은 이름·코드 매핑으로만 연결한다.
description_portal: 서울특별시 건축물대장 표제부입니다. 건축물대장의 표제부로 건축물의 동을 기준으로 일반과 집합건축물로 구분되며, 대지 및 건축물의 현황이 기재되어 있습니다. 원천시스템은 서울 건축주택 종합정보시스템입니다. 해당 데이터는 대지위치, 시군구코드명, 법정동코드명, 대지구분코드명, 주지번, 부지번, 새주소도로코드명, 새주소법정동코드명, 새주소지상지하구분코드명, 건축물대장일련번호, 대장구분코드명, 주부속구분코드명, 대지면적 및 건축면적, 주용도코드명 등으로 구성되어 있습니다.
accrual_periodicity: 수시
