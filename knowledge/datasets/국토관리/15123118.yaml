summary_user: 경기도 시군구별 주민등록 인구를 기준연월(crtr_ym)마다 집계해 총인구·남녀 인구, 15~29세·30~49세·50세 이상·15세 이상 인구와 성별·연령대별 연앙인구를 담는다. 분석가나 지자체 담당자가 '우리 시군의 15~49세 여성 연앙인구가 몇 명이고 해마다 어떻게 바뀌었나' 같은 질문에 답하거나 출산율·발생률 같은 비율 지표의 분모를 구하는 데 쓴다. 시군 코드(sigun_cd)와 시군명이 있지만 실측에서 전역 조인 키로 확인되지 않아, 다른 데이터와는 시군 이름 매핑이나 같은 기관의 시군 코드로 잇는다.
description_portal: 이 데이터는 경기도의 각 시군구별 주민등록 기준 인구 통계를 연령대 및 성별로 분류하여 제공하는 자료입니다. 주요 항목으로는 총인구수, 남녀 인구수, 15세 이상 인구, 1529세 및 3049세 인구, 50세 이상 인구, 연앙인구 등을 포함하며, 연앙인구는 연령별 및 성별로 세분화되어 있습니다. 데이터는 연도별로 구성되어 있어 시계열 인구 변화 분석이 가능하며, 지역별 인구 구조를 분석하거나 정책 수립의 기초 자료로 활용될 수 있습니다. 특히, 연앙인구 항목은 특정 연령대 인구의 중간값 개념으로 인구 구조 연구에 유용합니다. 이 데이터는 행정계획 수립, 인구 추이 분석, 고령화 평가 등 다양한 공공정책 수립에 활용될 수 있으며, 사회복지나 교육, 의료 수요 예측 등에도 활용 가능합니다.
