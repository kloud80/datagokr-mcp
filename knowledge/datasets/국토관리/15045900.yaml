summary_user: 전국 필지 단위로 지번별 용도지역·용도지구 지정 현황과 저촉 여부(포함·저촉 등)를 담은 원천 목록으로, vworld에서 시도별 CSV 파일로 내려받는다. 부동산 거래나 건축을 앞둔 사람이 '이 땅에 어떤 용도지역·지구가 걸려 있어 무엇을 지을 수 있나'를 확인하거나, 분석가가 지역별 용도지역 분포를 집계하는 데 쓴다. 실측 조인 키는 법정동코드(bjd_cd)이며, 고유번호(필지고유번호, PNU)를 통해 공시지가·건축물대장·실거래 데이터와 필지 단위로 이어 쓴다.
description_portal: 국토교통부 토지이용계획정보는 지번별로 용도지역·용도지구와 관련 조례에 따른 토지이용계획 사항을 제공하는 데이터이다. 주요 항목에는 행정구역코드, 법정동코드, 본번, 부번, 저촉여부, 용도지역·용도지구 지정 현황 등이 포함되어 있으며, 개별 필지 단위의 토지이용 현황을 확인할 수 있다. 이를 통해 토지이용의 적정성 검토, 개발행위 관리, 정책 수립 및 행정업무 지원 등 다양한 분야에서 활용된다.이 데이터는 CSV 형식으로 제공되며, 범용성이 높아 엑셀과 같은 오피스 프로그램은 물론 데이터베이스, GIS 소프트웨어, R·Python 등의 분석 도구에서 손쉽게 가공·분석할 수 있다. 구조가 단순해 대량 데이터를 효율적으로 처리할 수 있으며, 다른 공간정보와 결합하여 필지 단위의 토지이용 패턴 분석이나 시계열적 변동 추적에도 활용 가능하다.
