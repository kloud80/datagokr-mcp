summary_user: 공장설립온라인지원시스템에 등록된 공장 민원 데이터를 바탕으로 전국 시도별 공장 고용현황을 집계한 CSV 파일이며, 기준 년월과 등록현황 구분을 행으로, 시도를 열로 둔 가로형 표이고 파일 크기는 445바이트입니다. 지역 제조업 분석가가 '어느 시도에 등록된 공장의 고용 규모가 큰가'를 비교하거나 지역 제조업 경기를 가늠하는 데 씁니다. 전역 조인 키가 없어 시도 이름을 행정구역 코드표에 직접 맞추거나, 같은 기관의 공장등록현황 통계·산업단지 원장과 시도 단위로 이어 씁니다.
description_portal: 공장등록현황통계의 시도별 고용현황 csv 파일로, 한국의 17개 시도에 대한 고용현황을 데이터 기준일자로 제공하고 있습니다.공장고용현황은 공장설립 당시 사업계획서에서 작성한 민원 데이터를 토대로 작성하였습니다.17시도의 경우 광역시도에 대한 기준으로 서울, 인천, 경기, 강원, 충북, 충남, 대전, 전남, 전북, 광주, 경북, 대구, 경남, 부산, 울산, 제주, 세종 등으로 구분되어 있습니다.해당 데이터는 공장설립온라인지원시스템(www.factoryon.go.kr)을 통해 전국 지자체 및 관리기관에서 등록한 민원 데이터를 토대로 작성하였습니다.
