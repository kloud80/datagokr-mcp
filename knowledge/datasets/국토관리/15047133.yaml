description_portal: '○ 통계개요* 통계명 : 연면적별 주택현황* 통계종류 : 서울시 주택현황을 주택종류별ㆍ연면적별로 제공하는 지정ㆍ조사통계* 근거법령 :「인구주택총조사 규칙」(기획재정부령 제173호)* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책입안의 기초자료 제공하고, 각종 가구관련 경상조사 표본틀(SamplingFrame)의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 통계청(주관기관), 지방자치단체 및 6개 중앙행정기관(실시기관)- 일반조사구 : 시도 ⇔ 시군구 ⇔ 읍면동(총관리자) ⇔ 조사관리자 ⇔ 조사원* 공표주기 : 정기(5년, 11월1일 0시 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 주택종류별(단독주택, 아파트, 연립주택 등)ㆍ연면적별 주택현황 등○ 용어설명* 단독주택 : 한가구가 생활할 수 있도록 건축된 일반단독주택과 여러 가구가 살수 있도록설계된 다가구 단독주택을 말함* 아파트 : 한 건물내에 여러 가구가 거주할 수 있도록 건축되어진 5층이상의 영구건물로서구조적으로 한 가구씩 독립하여 살 수 있도록 건축된 주택을 말함* 연립주택 : 한 건물내에 여러가구가 살 수 있도록 건축된 4층이하의 영구건물로서 건축당시 연립주택으로 허가받은 주택을 말함* 다세대주택 : 한 건물내에 여러 가구가 살 수 있도록 건축된 4층 이하의 영구건물로서건물의 연면적이 200평 이하이면서 건축당시 다세대 주택으로 허가받은 주택을 말함* 비거주용건물내 주택 : 영업용 목적으로 건축된 건물내에 사람이 거주할 수 있도록구획된 부분으로서 주택의 요건을 갖추고 있는 것을 말함. 단, 사람이 살고 있으나주택의 요건을 갖추지 못한 거처는 주택이외의 거처로서 주택에서 제외함'
