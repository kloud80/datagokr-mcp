summary_user: 경상남도 거제시 관내 토석(골재) 채취 허가를 사업장 1건 단위로 담은 원천 목록으로, 사업자명·허가주소와 위경도·골재원·채취용도·허가기간·면적(천㎡)·총허가량(㎥)을 담으며 파일 크기가 680바이트라 건수는 몇 건 수준이다. 거제시에서 지금 허가를 받아 토석을 채취하는 곳이 어디이고 허가가 언제 끝나는지를 확인하려는 주민·건설업체·행정 담당자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업자명·주소 같은 이름 매칭이나 위경도 좌표로 지도·토지 정보에 겹쳐 쓰는 방식으로만 잇는다.
limits: 거제시 한 시군구 범위만 담으므로 다른 지역이나 전국 골재 채취 현황 비교에는 쓸 수 없다. 공통 코드 키가 없어 다른 허가·사업자 데이터와 정확히 연결하기 어렵다.
