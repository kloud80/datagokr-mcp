summary_user: 전북특별자치도 진안군 도시계획정보시스템(UPIS)의 토지 주제도를 필지 단위로 담은 CSV 파일(약 21MB)로, 필지마다 공간정보관리번호, 범위 좌표(X·Y 최솟값·최댓값), 개별필지등록번호, 면적, 지가, 도호, 소유구분이 들어 있다. 진안군 안에서 특정 필지의 면적과 지가, 국공유지인지 사유지인지 같은 소유 구분을 확인하려는 주민·사업자·도시계획 분석가가 쓴다. 포털 설명상 개별필지등록번호는 19자리 PNU라서 필지 단위 다른 토지 자료와 맞춰 볼 여지가 있지만, 실측에서는 전역 조인 키가 확인되지 않아 이름 매핑이나 같은 기관 자료끼리 연결하는 방식으로 쓴다.
description_portal: '전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 토지 주제도에 대한 공공데이터 자료입니다. 이번 자료에서는 공간 정보 관리 번호, X좌표 최솟값, Y좌표 최솟값, X좌표 최댓값, Y좌표 최댓값, 개별 필지 등록번호(PNU 의미: 토지에 부여되는 고유한 19자리 숫자), 면적, 지가, 도호, 소유 구분 정보를 제공합니다. 소유 구분 정보를 통해 개별 필지 등록번호에 해당하는 지역이 누가 소유를 하는지 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2024년 7월 19일입니다.'
