summary_user: 전북특별자치도 진안군에 등록된 제조업 공장을 업체 한 곳당 한 행으로 담은 목록 파일로, 회사명·공장대표주소·업종명·생산품·데이터기준일자를 담는다. 진안군에 어떤 업종의 공장이 있고 무엇을 생산하는지 확인하려는 사업자나 지역 산업 현황을 파악하려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 공장대표주소를 문자열로 맞춰 이어 쓴다.
description_portal: 전북 특별자치도 진안군의 제조업 공장등록 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 순번, 등록업체명, 대표자 이름, 전화번호, 공장대표주소, 업종명, 생산품, 데이터 기준일자 정보를 제공합니다. 이 정보 중 회사명과 업종명, 생산품을 통해 어떤 업체가 어느 업종을 가지고 있으며, 어떤 생산품을 만드는지 확인할 수 있습니다. 또한 이 내용을 통해 나중에 관련 업무를 진행할 때 참고할 수 있습니다. 대표자명과 전화번호의 빈칸은 개인정보에 해당하므로 비식별화와 제외 처리하였습니다. 이 자료는 매년 12월 초에 현행화하여 제공합니다.
