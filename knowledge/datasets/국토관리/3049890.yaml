summary_user: 전국의 토지이용상황을 도시, 농업(논·밭), 산림, 공업, 자연 및 문화재, 유보지역 등 6개 유형으로 나눠 필지 단위로 표시한 공간 데이터로, 브이월드(vworld.kr)에서 시도별 파일로 내려받는다. 도시계획·농업·산림 담당자나 분석가가 "우리 시도에서 농지나 산림으로 쓰이는 필지가 어디에 얼마나 분포하는가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 토지·지적 데이터와는 지역명 등 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 국토교통부 토지이용현황도는 토지이용상황을 도시, 농업(논·밭), 산림(성립·미성립), 공업, 자연 및 문화재, 유보지역 등 6단계로 구분하여 필지별로 상세히 표시한 지도 데이터이다. 이를 통해 토지의 실제 이용 현황을 한눈에 파악할 수 있으며, 도시계획, 농업정책, 산림관리, 공업단지 개발, 문화재 보존, 유보지 관리 등 다양한 행정·정책 분야에서 활용된다.이 데이터는 SHP(Shapefile) 형식으로 제공되며, 좌표와 속성을 동시에 포함하고 있어 GIS 소프트웨어(ArcGIS, QGIS 등)에서 바로 불러와 시각화 및 공간분석에 활용할 수 있다. 다른 공간데이터와의 연계성이 높아 토지이용 변화 분석, 정책 효과 검증, 연구 및 민간 서비스 개발 등에서도 기초 자료로 폭넓게 쓰인다.
