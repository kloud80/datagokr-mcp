summary_user: 인천광역시 미추홀구 안의 아파트 단지를 한 행씩 담은 단지 목록 파일로, 관할 동·도로명 주소·아파트명과 동수·최고층수·세대수를 담는다. 미추홀구의 동별 아파트 분포와 세대 규모를 파악하려는 분석가나 주민이 "우리 동에 몇 세대 규모의 아파트가 몇 곳 있나" 같은 질문에 쓴다. 실측 컬럼에 K-apt 단지코드 같은 전역 조인 키가 없어, 다른 주택 데이터와는 아파트명·도로명 주소를 맞추는 방식으로만 이어 쓴다.
limits: 단지코드가 없어 실거래·공시가격·관리비 데이터와 자동으로 정확히 연결되지 않으므로 이름·주소 매칭 시 표기 차이를 확인해야 한다. 범위는 미추홀구 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
