summary_user: 부산광역시가 지정한 마을기업을 한 곳당 한 행으로 담은 목록 파일(CSV, 약 5.9KB)로, 유형 구분·명칭·위치·사업내용을 담는다. 주민이나 창업 지원 담당자가 '우리 동네 근처에 어떤 마을기업이 있고 무슨 사업을 하는가'를 확인하거나, 분석가가 부산 마을기업의 사업 분야 분포를 볼 때 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 명칭이나 위치(주소 문자열)를 직접 맞춰서만 이어 쓴다.
description_portal: 부산광역시에서 지정하는 마을기업에 대한 정보로 유형, 명칭, 위치, 사업내용 등의 정보를 제공합니다."마을기업"이란 지역주민 또는 단체가 해당 지역의 인력, 향토, 문화, 자연환경 등 각종 자원을 활용하여 생활환경을 개선하고 지역공동체를 활성화하며 소득 및 일자리를 창출하기 위하여 운영하는 기업을 말합니다. (도시재생활성화 및 지원에 관한 특별법 2조)부산광역시는 2010년부터 매년 마을기업을 지정하고 있으며 2025년 5월 기준 총 129개소가 지정되었고 이중 63개소가 마을기업으로 지정되어 운영되고 있습니다.마을기업의 지정요건은 다음과 같습니다.  1. 조직형태가 법인(주식회사, 협동조합 등)  2. 지역주민이 5인 이상, 전체 회원 중 70%이상 포함  3. 마을기업 회원(출자자)과 법인 회원(출자자)가 동일해야 하며, 모든 회원은 법인에 출자하여야 함
