summary_user: SH공사가 매입한 매입임대주택 호수를 자치구·법정동별 행으로, 2002년부터 2024년까지 연도별 열로 정리한 집계 파일로, 건별 주택 정보는 없다. 주거복지 연구자나 분석가가 '서울 어느 동에 매입임대주택이 많이 공급됐고, 연도별로 매입 지역이 어떻게 바뀌었나'를 확인하는 데 쓴다. 실측 컬럼에 법정동 코드 같은 전역 조인 키가 없어, 다른 데이터와는 자치구·법정동 이름을 코드로 매핑해 이어 쓴다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)가 2002년부터 2024년까지 연도별로 매입한 매입임대주택의 현황을 법정동 단위로 정리한 자료입니다. 각 법정동별로 몇 호의 주택이 매입되었는지를 확인할 수 있으며, 이를 통해 지역별 매입임대주택 공급 규모와 분포를 파악할 수 있습니다. 매입임대주택은 기존 주택을 SH공사가 직접 매입하여 무주택 서민에게 저렴하게 임대하는 주거복지 사업의 일환으로, 본 데이터는 서울시 내 주거취약계층을 위한 공간적 접근성과 정책 집중 지역 등을 분석하는 데 활용도가 높습니다. 또한 연도별 추이를 분석하면 공사의 매입 전략 변화나 지역별 수요 대응 방식도 파악할 수 있어 주거복지정책 연구나 주택시장 분석 자료로도 유의미합니다.
