summary_user: 국토교통부가 도시관리계획으로 결정하는 용도지구 중 특정용도제한지구를 vworld.kr 외부 API로 제공하는 전국 단위 비공간 데이터이다. 국민이나 분석가가 특정 지역에 특정용도제한지구가 지정되어 있는지, 시도·시군구별로 어떻게 분포하는지 확인하는 데 쓴다. 전역 조인 키가 없어 시도명(sido_name)·시군구명(sigg_name) 같은 이름 매핑이나 같은 기관 코드로만 다른 토지이용규제 데이터와 잇는다.
limits: vworld.kr 인증키(query 파라미터 key)가 포털 활용신청과 별개로 필요하다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와 연결할 때 이름·코드 매핑이 필요하다. 필드 명세상 의미와 코드표가 없어 각 필드의 정확한 뜻은 확인되지 않았다.
