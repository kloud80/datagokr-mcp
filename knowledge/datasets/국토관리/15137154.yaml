summary_user: 무안군 도시계획정보시스템(UPIS)의 도로현황 테이블에서 뽑은 도시계획 도로를 도로 한 건씩 담은 CSV 파일(약 33KB)로, 도로 라벨명·면적·길이와 규모 등급·류별·번호 심볼을 담는다. 군 도시계획 담당자나 분석가가 '무안군 도시계획 도로는 규모 등급별로 몇 개이고 총연장과 면적은 얼마인가'를 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로 라벨명 같은 이름 매핑이나 같은 기관(무안군) 단위로만 이어 쓴다.
description_portal: 전라남도 무안군 도시계획 도로현황 데이터는 무안군 도시계획정보시스템(UPIS)에 등록된 도로현황 테이블의 정보를 기반으로 제공되는 자료입니다.데이터에는 도로의 라벨명, 면적, 길이, 규모 등급 심볼, 규모 류별 심볼, 규모 번호 심볼 등의 항목이 포함되어 있습니다.이를 통해 도로의 위치와 물리적 특성, 규모 구분 정보를 파악할 수 있으며, 도시계획 수립, 도로망 관리, 교통 인프라 개선 등 다양한 행정 및 정책적 활용이 가능합니다.또한 해당 데이터는 무안군의 장기적 도시 개발 전략 수립과 도로 시설물 유지 및 보수 계획 마련에 필요한 기초 자료로 활용될 수 있습니다.
