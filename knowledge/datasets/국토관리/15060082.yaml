description_portal: ｢빈집 및 소규모주택 정비에 관한 특례법｣에 따라 2026년 3월 4일에 에 수립 및 고시 된 부산광역시 제2기 수영구 빈집정비계획에 포함된 빈집들의 수입니다.빈집실태조사의 대상은 1년이상 거주하지 않고 비어져 있는 주택이고, 빈집으로 추정되는 주택의 물리적·권리적 현황, 소유자 의견 등을 조사하여 빈집을 확인하고 등급을 산정합니다.빈집정비계획상 빈집의 수와 실제 빈집의 수는 상이 할 수 있습니다.(신규 빈집, 무허가 건축물, 등)빈집정비계획은 빈집정비실태조사를 거쳐 법에 따라 5년마다 수립해야하며 부산광역시 제3기 수영구 빈집정비계획은 2030년 수립될 예정입니다.
