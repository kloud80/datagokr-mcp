description_portal: '주택도시보증공사 분양보증 발급 현황에 대한 데이터로 지역별, 분기별 분양보증금액 및 세대수에 대한 정보를 제공합니다.2009년부터 데이터를 제공하고 있으며, 2016년부터 분기별로 구분하여  데이터를 제공하고 있습니다. - 분양보증 정의 : 사업주체가 파산 등의 사유로 분양계약을 이행할 수 없게 되는 경우 당해 주택의 분양의 이행 또는 납부한 계약금 및 중도금의 환급을 책임지는 보증 - 보증대상 : 주택법 제15조에 의하여 사업계획승인을 받은 주택 및 복리시설 - 보증기간 : 당해 주택사업의 입주자모집공고 승인일부터 건물소유권보존등기일까지'
