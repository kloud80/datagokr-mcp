description_portal: 본 데이터는 인천광역시 미추홀구의 지하도상가 정보를 담고 있습니다. 연번, 상호명, 위치, 개설일자, 면적(제곱미터), 점포수, 전화번호, 설립유형, 운영유형, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 지하도상가의 위치와 운영 현황을 파악할 수 있으며, 주안역, 제물포, 주안시민, 석바위 지하도상가의 규모와 점포 수를 확인할 수 있습니다. 1970년대부터 1990년대까지 개설된 지하도상가로 오랜 역사를 가지고 있으며, 모두 민간이 설립하고 개인이 운영하는 형태입니다. 각 지하도상가의 위경도 좌표를 통해 정확한 위치를 파악할 수 있습니다. 이 데이터는 지역 내 지하상가 분포 현황 파악, 상권 구조 분석, 전통상가 활성화 정책 연구 등에 활용될 수 있습니다.
