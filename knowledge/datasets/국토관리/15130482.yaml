summary_user: 도시·관리·농림·자연환경보전 지역에서 도시·군관리계획 수립·변경 등을 이유로 일정 기간 개발행위허가를 제한한 구역을 전국 범위로 담은 원천 데이터로, 포털은 도형(SHP) 제공이라 설명하지만 실제로는 vworld.kr에서 시도별 파일로 내려받는다. 토지 매수자나 사업자가 특정 지역에서 건축·형질변경·토지분할이 일시적으로 막혀 있는지, 그 사유와 제한기간이 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역 이름이나 같은 기관 코드를 매핑해야만 이어 쓸 수 있다.
