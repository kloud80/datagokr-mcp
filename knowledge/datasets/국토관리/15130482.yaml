description_portal: '개발행위허가제한지역은 도시 지역, 관리 지역, 농림 지역, 자연환경보전 지역 안에서 도시·군관리계획을 수립하거나 변경할 때해당 계획의 원활한 수립 또는 집행을 위해 국토교통부장관, 시·도지사, 시장 또는 군수가 도시계획위원회의 심의를 거쳐일정기간 동안 개발 행위 허가를 제한하는 구역을 나타내는 정보로 도형(SHP) 파일로 제공합니다.* 개발 행위 허가 제한 지역 지정 사유:  - 도시·군기본계획이나 도시·군관리계획을 수립하거나 변경하는 경우   - 지구단위계획구역으로 지정하거나 변경하려는 경우   - 조례 또는 도시·군관리계획으로 정하는 용도지역, 용도지구, 용도구역 등을 변경하려는 경우   - 공공시설 또는 도시계획사업을 시행하려는 경우 * 제한 대상 행위:  - 건축물의 건축 또는 공작물의 설치  - 토지의 형질변경 (경작을 위한 형질변경 제외)  - 토석 채취 (토지 형질변경 목적으로 하는 경우 제외)  - 토지 분할 (건축물이 있는 대지 제외)  - 녹지지역, 관리지역, 자연환경보전지역 안에서 물건을 1개월 이상 쌓아놓는 행위 개발행위허가지역은 제한지역·제한사유·제한대상행위 및 제한기간을 미리 고시하여야 하며, 제한사유가 없어진 경우에는 그 제한기간이 끝나기 전이라도 지체 없이 개발행위허가제한을 해제하고 해제지역 및 해제시기를 고시하여야 한다.'
