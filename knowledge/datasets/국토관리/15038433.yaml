summary_user: 파주시 정수장을 시설 한 곳당 한 행으로 담은 파일로, 정수장명·도로명/지번 주소·위도·경도와 상수원·수원구분·여과방법, 최초설치일자, 부지면적·처리용량·배수지용량·여과지면적 같은 설비 규모를 담는다(파일 크기 446바이트로 행 수는 매우 적다). 주민이나 분석가가 '파주시 정수장은 어디에 있고 하루 처리용량과 원수 종류는 무엇인가', '설치된 지 얼마나 됐나'를 확인하거나 정수장 위치를 지도에 표시할 때 쓴다. 전역 조인 키나 정수장코드는 없으므로 다른 데이터와는 정수장명이나 주소·좌표, 같은 관리기관명으로 맞춰 이어 써야 하며, 정수장별 수질검사 데이터와 연결할 때도 이름 매핑이 필요하다.
limits: 파주시 한 시군구의 시설 현황만 담으므로 다른 지자체나 전국 비교에는 쓸 수 없다. 공통 시설 코드가 없어 수질검사·급수구역 등 다른 데이터와는 정수장명·주소로 직접 맞춰야 한다.
