summary_user: 대전광역시 중구 관내 현수막지정게시대를 게시대별로 시설명(행정·상업용 등 구분과 명칭), 소재지, 게시대수·게시면수, 신청방법과 담당 문의처로 기록한 시군구 범위의 개별 시설 목록이다. 중구에서 현수막을 걸려는 사업자나 단체가 어느 위치의 게시대에 몇 면을 걸 수 있고 어떻게 신청하는지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 소재지 주소나 시설명 매칭, 또는 같은 기관 데이터로만 잇는다.
