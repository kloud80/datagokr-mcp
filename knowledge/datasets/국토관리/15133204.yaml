description_portal: '부산도시공사에서 관리 중인 청년 매입임대주택 현황("25년 8월 기준)을 제공하는 데이터로 주택명, 주택 위치(구군단위), 세대수를 제공합니다.청년매입임대주택은 부산도시공사에서 매입한 오피스텔, 다가구 등을 주거지원이 필요한 청년들에게 시중 시세의 40%~50% 수준으로 임대하는 주택입니다.본 데이터는 청년매입임대주택의 총 세대수, 공급가능세대수, 공가수 등을 체계적으로 파악할 수 있으며, 원활한 주택 공급을 지속적으로 지원합니다.본 자료는 공공임대주택 수요자와 정책 및 업무 담당자 간의 정보격차를 해소하고, 사업의 투명성과 신뢰성을 높이기 위해 사용됩니다.본 자료는 실수요자 중심의 주택공급을 위해 활용됩니다.임대조건 : 시중 임대료의 40~50% 수준으로 순위에 따라 차등(1순위- 시중 임대로 40% 수준, 임대보증금 100만원/2,3순위 - 시중 임대료 50% 수준, 임대보증금 200만원)임대기간 : 최초 2년, 재계약 4회 가능(입주자격 유지 시 최장 10년까지 거주 가능)임대보증금, 월 임대료 상호 전환 : 임대보증금을 100만원 단위로 증액하여 월 임대료를 낮출 수 있음'
