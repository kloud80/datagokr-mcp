description_portal: 주택도시보증공사의 연도별 전세금안심대출보증(임차인에게 전세보증금반환(전세보증금반환보증)과 금융기관에 전세자금대출의 원리금 상환(전세자금대출특약보증)을 함께 책임지는 보증상품) 중 전세자금대출특약보증의  발급건수 및 발급금액과 관련된 데이터를 제공합니다.세부 데이터의 경우, 2014년부터 연도별 실적을 포함하고 있으며, 향후 연간 단위로 현행화하여 공공데이터 포털을 통해 제공드릴 예정입니다.추가로, 보증한도 등 주요 보증요건의 경우, 공사 홈페이지(https://khug.or.kr/index_hug_in.jsp)의 "전세금안심대출보증" 상품개요 사이트를 참고하시기 바랍니다. 감사합니다.
