summary_user: 부산광역시 금정구의 일반건축물에 대해 과세년도별로 건물(필지의 본번·부번, 동·호) 단위 시가표준액과 연면적을 담은 파일 데이터로, 범위는 금정구 한 개 시군구입니다. 금정구에 건물을 가진 사람이나 세무·부동산 분석가가 특정 건물의 취득세·재산세 과세 기준금액이 얼마인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 법정동·본번·부번으로 주소를 맞추거나 자치단체코드로 같은 기관 데이터와 이어 붙여야 합니다.
description_portal: '일반건축물 대한 지방세 부과기준인 시가표준액을 제공합니다.활용업무: 시가표준액을 통해 물건별로 재산가액이 확인 가능합니다.자치단체코드, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 시가표준액, 연면적 데이터를 제공합니다.자치단체코드는 한 국가의 행정구역(시,군,구 등)이나 지방자치단체를 체계적으로 식별하고 관리하기 위해 부여된 고유코드입니다.과세년도는 세법상 세금을 부과,계산하는 기준이 되는 기간을 의미합니다.시가표준액은 지방세 과세표준을 산정할 때 쓰이는 기준금액으로, 취득세,재산세 등 지방세 부과에 활용됩니다.'
