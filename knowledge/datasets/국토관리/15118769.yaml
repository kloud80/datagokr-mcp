summary_user: 경상남도 거창군에서 인허가를 받은 신축 건축물을 허가번호 단위로 한 건씩 담은 파일(csv, 약 83KB)로, 건축지역·연면적·지상/지하 층수·주용도·부속용도·시공사명을 기록한다. 거창군에서 최근 어떤 용도와 규모의 건물이 새로 지어지는지, 어느 시공사가 많이 맡는지를 보려는 지역 분석가나 건설 사업자가 지역 개발 흐름의 선행 지표로 쓴다. 전역 조인 키(법정동코드·PNU 등)는 없어 다른 데이터와는 건축지역 이름 매칭이나 거창군이라는 기관 단위로만 이어 쓰며, 건축물대장 등과 맞추려면 주소·허가번호를 직접 대조해야 한다.
