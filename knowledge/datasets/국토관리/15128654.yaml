summary_user: 경상북도 영천시에서 담배 소매인으로 지정된 업소를 한 곳씩 기록한 건별 목록으로, 소매인 구분·업소명·지번 및 도로명 주소·지정일자를 담는다(CSV 파일 약 45KB). 사업자나 분석가가 영천시 안 어느 동네에 담배 소매점이 얼마나 있는지, 언제 지정됐는지 확인하고 신규 소매인 지정 시 주변 업소 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소를 지오코딩하거나 행정동 이름으로 매칭해 이어 쓰고, 다른 시군의 담배 소매인 현황과는 같은 항목끼리 나란히 붙여 비교한다.
description_portal: 이 데이터는 경상북도 영천시의 담배 소매인 지정 현황을 상세하게 기록한 자료입니다. 영천시 내에서 허가받은 담배 소매업소의 업소명, 주소, 지정일자, 담배사업법에 의가하여 법령 조항 등을 포함하고 있으며, 각 업소별로 지정일자와 위치 정보를 구체적으로 제공하고 있습니다. 이를 통해 영천시 내 담배 판매업소의 현황 파악과 관리, 정책 수립에 활용할 수 있으며, 관련 법령 준수 여부를 검증하는 데 중요한 자료로 활용됩니다. 해당 데이터와 관련하여 궁금하신 사항이 있으신 경우 영천시 일자리노사과로 연락주시기 바랍니다.지번과 도로명 주소간에 연동 불가로 공란 데이터가 존재할 수 있으며 상호명이 존재하지 않는 곳도 있습니다.
