description_portal: 충청남도 도시계획 정보 관련 데이터는 도내 전 지역을 대상으로 지정된 **용도지역(도시지역·비도시지역)**과 용도지구, 용도구역의 현황을 체계적으로 정리한 자료이다. 주거·상업·공업지역 등 도시지역과 관리지역·농림지역·자연환경보전지역 등 비도시지역의 구분 현황을 포함하며, 경관지구·보호지구 등 용도지구와 개발제한구역·도시자연공원구역 등 용도구역 정보도 함께 제공한다. 이를 통해 충청남도 토지이용 구조와 공간계획 현황을 한눈에 파악할 수 있으며, 도시계획 수립, 개발행위 검토, 정책 분석 및 GIS 기반 공간 분석을 위한 기초 자료로 활용할 수 있다.
