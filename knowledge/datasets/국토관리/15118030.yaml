summary_user: 충청남도에 지정된 용도지역(도시·관리·농림·자연환경보전지역)과 경관·보호지구 같은 용도지구, 개발제한구역 같은 용도구역의 현황을 도형 대분류·중분류 코드와 면적 단위로 담은 파일 자료이며, 포털에서 zip 파일(약 452KB)로 활용신청 없이 받는다. 도시계획 담당자나 분석가가 '충남에서 관리지역과 농림지역이 각각 얼마나 되는가'처럼 용도별 지정 면적 구조를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 분류코드·명칭을 직접 매핑하거나 같은 기관 자료와 맞춰서만 이어 쓴다.
limits: 필지 주소나 법정동코드 같은 공통 키가 없어 토지·건축물 데이터와 바로 결합할 수 없고, 대분류·중분류 코드의 뜻을 풀이한 코드표가 명세에 없어 별도로 확인해야 한다. 범위는 충청남도 한 시도이며 비공간 자료로 분류되어 있어, 이 파일만으로 특정 필지의 용도지역을 조회하는 데 쓰기 어렵다.
