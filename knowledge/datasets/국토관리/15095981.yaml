summary_user: 대구광역시 북구 안의 교통섬을 한 곳씩 명칭·소재지 주소와 함께 담고, 조성 연도, 면적, 심은 나무의 수종과 교목·관목 본수를 기록한 건별 현황이다. 북구 도로변 녹지를 관리하는 담당자나 도시녹지 분석가가 어느 교통섬에 어떤 나무가 몇 그루 있고 언제 조성됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 명칭을 맞춰 붙이거나 같은 기관(북구) 자료끼리만 연결한다.
limits: 범위가 대구 북구 한 시군구에 한정되어 다른 구·시와 비교하려면 별도 자료를 모아야 한다. 공통 코드 키가 없어 주소·명칭 매칭 과정에서 연결 누락이나 오매칭이 생길 수 있다.
