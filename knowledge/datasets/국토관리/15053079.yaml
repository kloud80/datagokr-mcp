summary_user: 경기도 내 정보화마을을 마을 한 곳당 한 행으로 담은 현황 목록으로, 시군명·마을명·연락처·특산품·체험상품과 지번·도로명 주소, 우편번호, WGS84 위도·경도를 포함한다. 여행자나 관광·지역경제 분석가가 "경기도 어느 시군의 정보화마을에서 어떤 특산품을 사고 어떤 체험을 할 수 있나"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·주소 같은 이름 매핑이나 위경도 좌표 기준으로만 연결한다.
description_portal: 이 데이터는 정보 소외지역인 농촌, 어촌, 산촌 등을 대상으로 정보화 기반을 조성하여 운영되고 있는 경기도 내 정보화마을의 현황을 수록한 자료입니다. 시군명, 마을명, 연락처, 특산품 정보, 체험상품 정보, 소재지 주소(지번 및 도로명), 우편번호, WGS84 위도·경도 좌표 등의 항목으로 구성되어 있으며, 각 마을은 초고속 인터넷 기반의 정보 환경을 구축하고 전자상거래 및 정보 콘텐츠를 통해 지역주민의 정보 활용을 유도함과 동시에 실질적인 소득 창출을 도모하고 있습니다. 마을별 특산품과 체험 프로그램은 지역경제 활성화와 관광 콘텐츠 개발의 주요 자원이 되며, 본 데이터는 디지털 격차 해소 정책 성과 분석, 지역 특산물 유통 기반 조사, 체험형 관광 프로그램 개발, 지역주도형 경제 활성화 정책 수립 등에 폭넓게 활용될 수 있습니다.
