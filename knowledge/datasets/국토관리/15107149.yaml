description_portal: '이 데이터는 광주광역시 서구 금호동 지역의 2010년부터 2021년까지 연도별 개별공시지가에 관한 정보를 포함하고 있습니다. 개별공시지가는 부동산 공시가격 중 하나로, 국세 및 지방세 과세기준, 개발부담금 산정, 기초생활보장 선정기준 등 행정적·재정적 판단 기준으로 활용되는 매우 중요한 정보입니다.데이터는 총 27,217건으로 구성되어 있으며, 주요 항목은 다음과 같습니다:연도: 공시된 기준 연도변경동: 행정구역상 지번이 속한 법정동구분: 일반지번인지, 산지번인지 구분본번/부번: 개별 토지의 고유 식별을 위한 지번 정보결정지가: ㎡당 단가(원)이 데이터는 각 토지의 본번·부번을 통해 정밀한 위치 식별이 가능하며, 토지 가격 변동 추이를 분석하거나 특정 지역의 부동산 정책 효과를 평가하는 데 활용될 수 있습니다. 또한 국토교통부의 표준지 공시지가와 비교하여 지역 간 토지 가치 차이를 분석하거나, 부동산 관련 민원 처리 및 각종 행정업무의 기초자료로도 쓰입니다.정제된 텍스트형(csv) 형식으로 제공되며, 1회성 수시 등록 데이터로서 2021년 12월 31일을 기준으로 최종 업데이트되었습니다. 데이터는 무료로 이용 가능하며, 제3자 저작권 문제 없이 제한 없이 활용할 수 있습니다.'
