summary_user: 여주시 관내에 등록된 제조업 공장을 한 곳당 한 행으로 담은 건별 명부로, 회사명·대표자·도로명/지번 주소·업종번호와 업종명·등록일·종업원수·생산품을 포함한다. 여주시에 어떤 업종의 공장이 어디에 몇 명 규모로 있는지 확인하려는 사업자나 지역산업 분석가가 업종별 공장 분포를 파악할 때 쓴다. 전역 조인 키(사업자번호·필지번호 등)는 없어서, 업종번호를 한국표준산업분류 코드로 매핑하거나 주소를 지오코딩·주소 매칭해 다른 데이터와 잇는다.
description_portal: 여주시 공장등록 현황에 대한 데이터로 회사명, 대표자명,  공장주소(도로명),  업종번호, 생산품 등의 정보를 제공합니다. 해당 정보는 산업집적활성화 및 공장설립에 관한 법률 제16조(공장의 등록)에 따라 등록된 제조업 공장 현황 자료로 여주시 관내 제조업 활성화와 지역경제활성화 , 일자리 창출에 기여할 수 있습니다. 해당 정보는 여주시 사이트 "사전정보공표" 현황에서도 확인 가능합니다. 업종코드는 한국표준산업분류에 따른 분류코드입니다.(10차시) 2025년 기준 여주시 관내 등록공장은 약 792개소 입니다. 기타 세부사항은 여주시청(www.yeoju.go.kr)에서도 확인 가능합니다.
