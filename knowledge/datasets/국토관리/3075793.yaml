summary_user: 부산광역시 해운대구 관내에서 영업 중인 옥외광고업자(간판·현수막 제작, 광고대행 등)를 업소 한 곳당 한 행으로 담은 파일(csv, 약 10KB)로, 업소명·전화번호·도로명주소·영업내용이 들어 있다. 해운대구에서 간판이나 현수막을 맡길 업체를 찾는 주민·사업자, 또는 구 단위 옥외광고업 분포를 살피는 분석가가 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 업소명이나 도로명주소를 문자열로 맞추거나 주소를 좌표로 바꿔 이어 써야 한다.
description_portal: 부산광역시 해운대구 관내에 정상영업 중인 옥외광고업자 (간판제작, 현수막제작, 광고대행 등)에 대한 데이터로 업소명, 전화번호, 도로명주소, 영업내용에 대한 정보를 제공합니다. 업소명은 옥외광고업자의 공식명칭으로 정확한 식별 및 검색을 위한 기준이 됩니다. 전화번호는 대표 연락처로 운영여부 등을 사전에 확인하고 궁금한 점을 바로 문의하거나 상담할 때 유용합니다. 소재지는 각 업체가 실제 어디에 있는지를 알려주는 정보로 도로명 주소를 기본으로 제공하며, 정확한 위치 파악이 가능해집니다.  현재 데이터는 신규 신고, 폐업, 휴업, 소재지변경 등 다양한 사유로 인해 지속적으로 변동될 수 있음을 알려드립니다.
