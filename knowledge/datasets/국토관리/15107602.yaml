description_portal: 주택보급률은 특정 지역의 가구 수 대비 주택 수의 비율을 나타내는 핵심 주거지표로, 지역별 주택 공급 수준과 주거 안정성을 판단하는 데 활용된다.주택 수에는 일반적으로 **거주용 주택(단독·다세대·아파트 등)**이 포함되며, 가구 수는 주민등록 가구 기준 또는 인구총조사 가구 기준을 사용한다.본 데이터는 지역별 주택보급률 변화 추세 분석, 주택 수급계획 수립, 주거복지정책 평가, 주택시장 모니터링 등 다양한 정책·행정 목적에 활용된다.
