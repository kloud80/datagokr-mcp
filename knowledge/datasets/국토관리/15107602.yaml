legal_basis_portal: 주택보급률 데이터는 「통계법」 제3조·제17조에 따라 국가와 지자체가 정책수립에 필요한 통계를 작성·관리할 수 있는 국가승인통계로서 생산된다. 「주택법」 제5조는 주택 수급, 주거복지, 시장 안정 등을 위한 통계 조사·관리를 규정하여 주택보급률 산출의 법적 근거가 된다. 또한 국토교통부의 「주택통계 작성지침」은 주택·가구 산정 기준과 산출방법을 제시해 행정적 기준을 제공하며, 「공공데이터법」 제21조는 이러한 주택 관련 데이터를 공공데이터로 정비·관리·제공할 수 있는 근거를 마련하고 있다.
