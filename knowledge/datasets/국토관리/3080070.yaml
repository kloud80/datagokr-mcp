summary_user: 여수시 관내 아파트·연립·다세대 등 공동주택을 단지 한 건씩 담은 목록으로, 단지명·행정동·법정동·지번·도로명 주소와 층수·동수·세대수·사용검사일·관리방법·관리사무소 연락처를 담는다. 여수시에서 특정 동에 어떤 단지가 몇 세대 규모로 있는지, 준공(사용검사)이 오래된 단지가 어디인지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 법정동·지번·도로명 주소나 단지명을 이름으로 맞춰 연결해야 한다.
description_portal: 공동주택현황 데이터는 관내 아파트, 연립주택, 다세대주택 등 공동주택의 현황을 체계적으로 관리하기 위하여 구축한 자료입니다. 단지명, 소재지, 사용검사일, 세대수, 동수, 층수 등 공동주택의 기본정보와 관리형태, 의무관리대상 여부 등 관리현황 정보를 포함하고 있습니다. 이를 통해 지역 내 공동주택의 분포와 규모, 관리 실태를 종합적으로 파악할 수 있으며, 공동주택 관련 정책 수립과 제도 운영을 위한 기초자료로 활용됩니다. 또한 공동주택 지원사업 추진, 안전점검 및 유지관리 계획 수립, 통계 작성, 민원 처리, 각종 행정자료 제공 등 다양한 행정업무 수행에 활용되는 공공데이터입니다. 데이터의 지속적인 현행화를 통해 공동주택 관리의 효율성을 높이고 행정서비스의 품질 향상에 기여하고 있습니다.
