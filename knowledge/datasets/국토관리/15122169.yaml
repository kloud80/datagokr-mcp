summary_user: 경기주택도시공사가 사업시행자로서 관계법령에 따라 직접 산정한 법정보상비를 해당연도·분기·보상비 항목별로 금액(원)과 참고사항(산정근거·유의사항)으로 정리한 집계성 현황 자료입니다. 토지보상이나 공공개발사업을 앞둔 토지소유자·사업자·분석가가 "이번 분기 이전비 같은 특정 보상비 항목이 얼마로 산정됐고, 연도별로 어떻게 달라졌나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·분기나 보상비명을 이름으로 맞춰 연결해야 하며, 도시개발법·공공주택특별법 등 개별 개발사업법 체계의 보상 자료와 함께 볼 때 의미가 있습니다.
description_portal: 이 데이터는 경기주택도시공사에서 제공하는 법정보상비 산정금액 현황으로, 산정된 보상비 관련 참고할 내용과 금액 정보를 연도별, 분기별로 제공합니다. 관계법령에 따라 사업시행자가 통계자료를 활용해 직접 산정하여 보상합니다. 주요 항목은 해당연도, 분기, 보상비명, 금액(원), 참고사항으로 구성되어 있으며, 보상비명에는 다양한 보상비 항목이 포함되어 각 항목별 산정된 금액이 제시됩니다. 이 데이터는 공공기관의 토지보상, 공공개발사업, 도시개발 및 기반시설 설치 시 산정되는 법정보상비의 기준 수립에 활용될 수 있습니다. 또한, 보상금 산정의 투명성과 일관성을 확보하고, 법령이나 정책 변경 시 보상비 기준의 변화를 분석하는 데 유용합니다. 참고사항 항목은 산정근거 또는 유의사항 등의 보충 정보를 제공합니다.
