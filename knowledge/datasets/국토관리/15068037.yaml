summary_user: 경기도 부천시에 등록된 민간임대주택을 주택 한 건씩 담은 파일로, 사업자 구분(매입·건설임대 등), 임대주택 구분, 도로명주소, 임대 종류(장기일반민간임대 10년·8년, 단기임대 등), 주택 유형(아파트·다세대·오피스텔 등), 면적을 담는다. 전세 계약을 앞둔 세입자가 계약하려는 집이 부천시 등록임대주택인지 확인하거나, 분석가가 부천시 등록임대의 유형·종류별 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소를 맞춰 붙이는 식으로만 이어 쓰며, 전월세 실거래 자료와 주소 기준으로 함께 보는 용도가 대표적이다.
description_portal: 안녕하십니까.공공데이터 목록등록관리에 업데이트 되어 있는 이 데이터는 경기도 부천시 민간임대주택사업 관련 데이터입니다.2026년 6월 24일 수요일 기준으로 업데이트 했습니다.해당 내용에는 임대사업자 구분, 등록된 임대주택 구분, 등록된 임대주택의 도로명 주소, 임대주택의 종류, 임대주택의 유형, 임대주택의 면적 등이 기재되어 있습니다.사업자 구분에는 매입임대사업자, 일반형임대사업자, 임대사업자, 허가건설임대사업자 등 구분되어 있으며, 임대주택 구분에는 민간매입임대주택, 민간건설임대주택 등 구분되어 있으며, 종류에는 10년임대주택(민간), 5년임대주택(공공), 5년임대주택(민간), 공공지원민간임대주택(8년), 국민임대주택, 기타, 단기민간임대주택, 단기임대, 매입임대주택, 장기일반민간임대주택(10년) 장기일반민간임대주택(8년), 준공공임대 등 구분되어 있으며 유형에는 다가구주택, 다세대주택, 단독주택, 도시형생활주택, 아파트, 아파트(도시형생활주택), 연립주택, 준주택(오피스텔) 등으로 구분되어 있습니다.보다 더 자세한 사항은 첨부된 파일을 확인하여 주시기 바랍니다.해당 자료의 다음 업데이트는 1년 뒤에 예정되어 있음을 알려드립니다.감사합니다.
