description_portal: 본 자료는 전북특별자치도 익산시 내 골재채취업 등록 현황을 다룬 자료로, 골재채취업은 주로 건설 자재로 사용되는 모래, 자갈, 쇄석 등 골재를 자연에서 채취하는 산업을 말한다. 해당 자료는 골재채취업으로 등록한 신청업체명, 신청업체의 업종, 지번주소 등의 데이터를 제공하고 있으며, 골재자원의 효율적 관리와 산업안전, 환경보호를 위한 기본자료로 활용될 수 있다. 데이터는 정기적으로 갱신되며 설명과 키워드를 통해 최신성과 이해성을 높이고 있다. 또한 csv 파일로 업로드되어 분석하기에 용이하다.
