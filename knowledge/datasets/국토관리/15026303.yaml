summary_user: 부산 동래구 관내에 등록되어 영업 중이거나 과거 영업 이력이 있는 저수조청소업체를 업체 한 곳당 한 행으로 담은 파일(약 4KB의 CSV)로, 영업소명·신고번호·신고일자·영업상태·도로명/지번 주소·전화번호를 담는다. 아파트·건물 관리자나 민원인이 '동래구에서 지금 영업 중인 저수조 청소업체는 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 구의 같은 현황이나 지방행정 인허가 자료와는 업체명·주소·신고번호를 맞춰 연결해야 한다.
description_portal: '해당 데이터는 동래구 행정구역 내에서 정식으로 등록되어 영업 중이거나 과거에 영업한 이력이 있는 저수조청소업체를 대상으로 하며,각 업체별 기본 식별 정보와 연락처, 소재지 등의 항목을 포함하고 있습니다.제공되는 주요 항목은 다음과 같습니다:업체명: 정식 등록된 저수조청소업체의 상호명연락처: 민원이나 문의를 위한 전화번호 등 주요 연락수단소재지 주소: 사업장의 실제 운영 주소(도로명 주소 기준)영업상태 구분: 현재 영업 중인지 여부(영업 중 / 폐업 / 말소 등)본 데이터는 공공의 안전 및 위생 확보를 위한 저수조 관리의 일환으로 수집된 행정자료를 기반으로 하며,동래구 관내 저수조 청소업체 현황에 대한 현업자, 민원인, 정책수립자 등의 정보 이용 편의를 높이기 위해 정리·제공된 것입니다.※ 개인정보보호 및 관련 법령에 따라, 일부 항목(예: 대표자명, 주민등록번호 등)은 비공개 또는 마스킹 처리되어 제공되며,데이터의 항목별 코드 및 세부내용은 별도로 제공되는 **"저수조청소업 등록현황 데이터 항목 설명서"**를 참고해주시기 바랍니다.'
