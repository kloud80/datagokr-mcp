description_portal: '수용가의 고의가 아닌 옥내배관 노후로 인한 누수로 과다부과된 수도요금에 대해 시민부담을 경감코자 시행하는 제도입니다.감면근거「수도급수조례 제37조제1항제3호 및 조례 시행규칙 제23조」감면대상자누수지점이 지하 · 벽체 속으로 발견이 곤란하고, 수용가의 고의 또는 과실이 아닌 경우감면금액상수도 : 정상 사용한 직전 4개월의 평균사용량에 해당하는 금액을 공제하고 남은 금액의 1/2 감면.하수도 : 옥내누수로 인한 하수량은 조정량에서 제외한다. 사용량 조정은 전 4개월 평균사용량 또는 전년동기 사용량(목욕업 등 계절별 증감이 많은 경우에 한함)으로 산출물이용부담금 : 상수도 감면방법 준용구비서류옥내누수 감면 신청서 1부누수임을 입증하는 서류(누수수리관련 사진, 수리 영수증 등)'
