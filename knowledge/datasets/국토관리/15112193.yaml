description_portal: '1. 개요본 데이터는 「장애인·노인·임산부 등의 편의증진 보장에 관한 법률(장애인등편의법)」 제17조 및 동법 제27조에 의거하여, 경기도 구리시 관내 장애인 전용 주차구역에서 발생한 법규 위반 행위에 대해 행정처분(과태료 부과)을 실시한 현황 데이터입니다.장애인 전용 주차구역의 올바른 이용 문화를 정착시키고, 교통 약자의 이동권을 보장하기 위한 공익적 목적으로 수집 및 관리되는 자료입니다.2. 주요 내용 및 구성 항목본 데이터셋은 연도별로 집계된 과태료 부과 현황을 담고 있으며, 상세 항목은 다음과 같습니다.부과연도: 해당 위반 행위에 대해 과태료 부과 처분이 이루어진 연도부과유형: 위반 행위의 세부 성격에 따른 분류주차위반: 장애인 전용 주차구역 주차표지를 붙이지 않은 자동차를 주차한 경우 등주차방해: 장애인 전용 주차구역 앞이나 뒤, 양 측면에 물건을 쌓거나 진입로를 가로막는 등 주차를 방해하는 행위부과액: 해당 위반 건수에 대해 부과된 과태료의 총액 (단위: 원)'
