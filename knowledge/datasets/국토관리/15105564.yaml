description_portal: 이 데이터는 서울주택도시공사(SH공사)가 보유한 아파트 자산 내역을 지역별로 정리한 자료로, 공공자산의 재무적 가치를 파악할 수 있는 중요한 지표입니다. 주요 항목에는 지역명, 재산세 부과 대상 호수, 취득가액(토지/건물 각각, 억 원 단위), 장부가액(토지/건물 각각, 억 원 단위), 그리고 해당 자산의 공시가격(억 원 단위)이 포함되어 있습니다. 취득가액은 공사가 자산을 매입할 당시 실제로 지출한 금액을 나타내며, 장부가액은 회계기준에 따라 평가된 현재 자산가치를 의미합니다. 공시가격은 국세·지방세 등 과세기준으로 사용되는 공식 평가 금액입니다. 이를 통해 지역별 아파트 자산의 규모, 가치 변동, 세금 부과 기준 등을 비교·분석할 수 있으며, SH공사의 부동산 자산 운용 효율성, 회계적 건전성, 공공자산의 투명한 관리 여부를 판단하는 데 활용할 수 있습니다.
