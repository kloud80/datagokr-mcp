description_portal: '부산광역시 동래구에 소재한 「건축법」에 따라 등록된 공개공지 현황 자료입니다.구군명, 건축물명, 소재지, 허가일자, 사용승인일자, 연면적, 층수, 용도, 개수, 위치, 편의시설 개수,  위도, 경도 기본 정보를 포함하고 있으며 정기적으로 변경사항을 반영하여 최신 정보를 제공합니다.정보제공의 목적1. 부산시민들에게 편의시설에 관한 사항 제공2. 인근 부지에 쉼터에 대한 정보를 공개하여 이용자 편의성 강화3. 관내 등록 공개공지 현황을 제공하여  유지 관리 용이업데이트 주기: 연 1회(또는 관내 업체 변동 있을 시 수시 갱신)'
