summary_user: 부산광역시 동래구에 있는 건축법상 공개공지를 건축물 한 건씩 담은 파일로, 건축물명·도로명/지번 주소·허가일과 사용승인일·연면적·층수·용도와 함께 공개공지 면적·개소·위치·편의시설, 위도·경도를 포함한다. 동래구 주민이 집이나 일터 근처에서 쉴 수 있는 공개 쉼터가 어느 건물에 있고 편의시설이 있는지 찾거나, 구청이 관내 공개공지 관리 대상을 점검할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 건축물명을 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
limits: 동래구 한 곳만 담으므로 부산 전체나 다른 구와 비교하려면 각 구군 자료를 따로 모아야 한다. 건축물대장 등과 바로 연결되는 고유 코드가 없어 주소 문자열 매칭에 의존해야 한다.
