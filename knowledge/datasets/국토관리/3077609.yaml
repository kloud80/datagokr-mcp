summary_user: 인천광역시 남동구에 등록된 옥외광고업체를 업체 한 곳당 한 행으로 담은 파일로, 업소명과 영업장 주소, 데이터기준일자를 담는다(CSV 약 12KB). 남동구에서 영업 중인 옥외광고업체가 어디에 있는지 찾으려는 주민·사업자나, 지역 옥외광고업 분포를 살피는 행정 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업장 주소를 지오코딩하거나 업소명을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 인천광역시 남동구에 등록된 옥외광고업체 현황을 상세히 제공하며, 순번, 업소명, 영업장주소, 데이터기준일자 등의 정보를 포함하고 있습니다. 이 데이터는 지역 내 옥외광고 산업의 현황 파악과 행정적 관리에 중요한 기초 자료로 활용되며, 광고업체들의 체계적 관리와 소비자 보호에 기여합니다. 또한, 향후 데이터를 활용한 불법 광고물 단속 강화, 광고 환경 개선, 스마트 광고 정책 수립 등에 활용되어 남동구의 도시미관 향상과 광고산업의 건전한 발전을 도모할 수 있을 것으로 기대됩니다.
