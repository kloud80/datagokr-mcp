summary_user: 국가하천 하천범람 지도를 바탕으로 전국 단위 침수면적(km²)을 홍수 빈도(100년·200년·500년·기왕최대)별로 나누고, 침수심 5단계(0.5m 이하부터 5.0m 초과까지)로 집계한 통계를 담는다. 방재 담당자나 분석가가 '200년 빈도 홍수로 국가하천이 넘치면 전국에서 2m 넘게 잠기는 면적이 얼마인가'처럼 빈도별 침수 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 빈도 구분(fldlvFreq) 값을 이름으로 맞추거나 같은 기관의 홍수위험지도 자료와 대조하는 방식으로만 이어 쓴다.
limits: 전국 합계만 있는 비공간 통계라서 시도·시군구나 하천별 침수면적은 알 수 없다. 실시간 홍수 예보가 아니라 지도 작성 때 만들어진 뒤 바뀌지 않는 이벤트성 자료다. 개발계정은 하루 3,000회까지 호출할 수 있다.
