description_portal: '이 데이터는 2017년부터 2021년까지 서울시 주요 정수장에서 발생한 **정수슬러지 발생량(톤/년)**과 **정수처리량(톤/년)**을 연도별·정수장별로 정리한 자료다. 광암·구의·뚝도·영등포·암사·강북 등 6개 정수장의 운영 현황을 비교할 수 있으며, 슬러지 발생 추이와 정수처리량 규모의 변화도 파악할 수 있다. 이를 통해 정수장별 처리 효율성, 시설 규모의 차이, 슬러지 발생량 대비 처리량의 비율 등 환경·운영관리에 필요한 정보를 제공한다. 특히 생산량은 억 톤 단위의 대규모 수치로, 서울시 상수도 공급의 규모를 보여주며, 슬러지 관리 정책 수립, 처리시설 용량 계획, 장기적 운영 효율성 분석 등에 활용 가능하다.문의 : 상수도사업본부 생산관리과 (02-3146-1311)'
