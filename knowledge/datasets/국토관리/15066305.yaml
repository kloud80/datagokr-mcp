description_portal: '인천광역시가 사회조사를 통해 제공하는 이 데이터는 인천 시민들이 희망하는 주택의 유형 및 규모를 군/구별, 성별, 연령별 등 다양한 특성에 따라 세분화하여 집계한 통계 자료입니다. 이 데이터는 지역 주택 수요의 질적 구조를 파악하고, 주택 공급 계획, 도시 재생 사업, 주거 복지 정책 수립의 기초 자료로 활용되는 것을 목적으로 합니다.<주요 구성 항목>-특성별 분류: 데이터는 군/구별 (예: 중구, 동구, 연수구), 성별, 연령별 (13~19세부터 60세 이상), 학력별, 직업별, 월평균 가구소득별, 현재 주택 형태별, 가구원수별로 세분화됩니다.-희망 주택 유형: 시민들이 희망하는 주택 유형을 아파트, 단독주택, 다세대/연립주택, 기타로 구분하고 그 비율(%)을 제공합니다'
