summary_user: 부산광역시 도시공원 안에 설치된 놀이시설을 시설 한 곳 단위로 담으며, 구군명·시설명·도로명/지번주소·위경도·검사일자·관리부서·전화번호를 함께 제공한다. 부산에 사는 보호자가 우리 구·군 공원 놀이터가 어디 있고 마지막 검사가 언제였는지 확인하거나, 분석가가 구·군별 놀이시설 분포로 여가시설 형평성을 진단하는 데 쓴다. 전역 조인 키는 없으므로 구군명으로 행정구역 자료와 맞추거나 위경도·주소로 공원·인구 등 공간 자료와 겹쳐 쓴다.
description_portal: 위 데이터는 부산광역시 도시공원 내 놀이시설(구군명, 시설명, 전화번호 ,도로명주소 등)에 대한 안내 및 정보를 제공하고 있습니다. 도시공원 내 놀이시설이란 어린이와 청소년이 신체활동, 창의적 놀이, 사회적 상호작용을 할 수 있도록 설치된 기구 및 공간을 말하며 미끄럼틀, 그네 등이 이에 해당됩니다. 도시공원 내 놀이시설은 시민, 특히 어린이와 가족을 위한 휴식·여가·놀이공간으로 조성되며, 공원의 주요 기능 중 하나인 여가·건강·사회적 상호작용을 실현하는 핵심 요소입니다. 위 데이터는 부산광역시의 놀이시설 현황을 파악할 수 있게 해주어 정책 추진, 공공서비스 형평성 진단 등에 활용될 수 있습니다.
