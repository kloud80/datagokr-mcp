summary_user: 경기도 안양시 관내 지식산업센터를 건물 한 곳당 한 행으로 담은 파일로, 명칭·지번/도로명 주소·용도지역·부지·건축·공장·지원시설 면적·층수·유치가능업체수·분양형태·공사진행상황과 허가·착공·준공·사용승인 일자를 포함한다(csv 약 11.7KB). 안양시에 입주할 지식산업센터를 찾는 사업자나 지역 산업시설 공급 현황을 보는 분석가가 '안양 어디에 어떤 규모의 지식산업센터가 준공됐거나 공사 중인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 명칭 매칭으로 이어 써야 하며, 주소를 건물관리번호로 바꾸면 건축물대장과 연결할 수 있다.
description_portal: 본 데이터는 경기도 안양시 관내에 위치한 지식산업센터 (지식센터 공장명,  지식센터 설치회사 주소, 지식센터 면적,  지식센터준공일자,  지식센터입주업체수 등) 건립 현황 데이터  정보입니다.지역별 산업시설 현황을 파악하고 기업 유치 및 정책 수립에 활용할 수 있도록 구성되어 있습니다.이를 통해 산업시설의 공간적 특성과 행정적 진행 상태를 종합적으로 확인할 수 있으며, 기업 입주 가능성 및 지역 개발 현황을 분석하는 데 유용할 수 있습니다.또한, 분양 및 승인 관련 정보는 민간 및 공공기관의 의사결정에 참고자료로 활용될 수 있습니다.
