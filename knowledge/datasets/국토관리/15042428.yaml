summary_user: 하남시의 상·하수도 요금 부과 내역을 부과연도·월·행정동 단위로, 상수·하수·지하수 업종별 사용량(톤)과 부과금액을 함께 담은 집계 파일이다(CSV 약 9.8MB, 시군구 범위·읍면동 단위). 분석가나 시 관계자가 '하남시 어느 행정동에서 가정용·업소용 물 사용량과 요금이 월별로 어떻게 달라지는가'를 따질 때 쓴다. 전역 조인 키는 없어 행정동 이름을 매핑해 인구·사업체 등 읍면동 단위 통계와 잇거나 같은 기관 자료와만 연결한다.
description_portal: 경기도 하남시 상수도과에서 부과년도 및 월, 상수도 사용량, 상수업종, 부과금액 등의 정보를 제공하여 상수도 요금 과징 현황을 보여주는 자료입니다.하남시의 상·하수도 요금 부과 내역을 연도·월·행정동 단위로 기록한 상·하수도 요금부과 현황 자료로, 지역별 물 사용량과 요금 산정 구조를 정밀하게 분석할 수 있습니다. 상수업종·하수업종·지하업종은 가정용, 업소용, 공업용 등 업종별 수용가 분류를 구체적으로 제시하여, 업종별 물 사용행태와 부과기준을 명확히 파악할 수 있습니다. 상수사용량(톤)과 하수사용량(톤)은 실제 물 소비량과 배출량을 나타내며, 월별 요금 산정의 핵심 지표로 활용됩니다. 특히 행정동 항목은 지역별 수요 차이를 확인할 수 있어 행정동별 물사용 패턴 또는 인구·상권·산업 구조에 따른 물 사용 특성을 분석하는 데 유용합니다.
