description_portal: 시간별 강수량 데이터는 특정 지점(관측소)의 시각 단위 강수량(mm)을 정시간 간격으로 측정한 자료로, 관측일자·관측지점 정보, 강수량 수치 등이 포함됩니다. 이 데이터는 기상 패턴 분석, 시간대별 강우 집중 구간 파악, 도시 침수 위험 예측, 배수 설비 계획, 농업·방재·도로 관리 정책 수립에 유용하며, 시공간 시각화와 결합하면 강수 분포 밀도 및 변화 추이를 효과적으로 탐지하는 기반이 됩니다. 또한 폭우 예보 및 기후 변화 대응 분석의 기초자료로 활용 가능함자세한 사항은 창원시재난안전대책본부 홈페이지(https://bangjae.changwon.go.kr/portal/subpage/sub06_02_03.do?mId=0602030000&token=1758627366833)를 통해 확인가능합니다.
