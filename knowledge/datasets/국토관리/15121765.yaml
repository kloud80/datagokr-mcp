description_portal: 본 데이터는 경상남도 남해군 내 미준공 신축 건축물의 인허가 현황을 건축행정시스템(eAIS)을 출처로 하여 2018년부터 2023년 8월까지의 정보를 집계한 자료입니다. 주요 제공 항목으로는 건축물의 종류를 나타내는 '건축구분', 정확한 '대지위치', 건축 규모를 파악할 수 있는 '연면적', '최대지상층수' 및 '최대지하층수', 건물의 주된 활용 목적을 의미하는 '주용도'와 '부속용도', 그리고 실제 공사를 담당하는 '시공자사무소명' 등이 상세히 포함되어 있습니다. 이 자료는 남해군의 최근 건축 활동 동향과 도시 개발의 진행 상황을 파악하고, 관련 공공정책 수립 및 학술적·산업적 분석에 필요한 기초 자료로 활용될 수 있습니다.
