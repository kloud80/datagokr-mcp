summary_user: 행정중심복합도시(세종 행복도시) 안 주택의 분양계획과 실적을 블록 단위로 담은 CSV 파일(약 18KB)로, 주택구분·분양계획연도·생활권 위치·블록·공급유형·세대수·사업주체·입주자모집공고일·입주시기를 담는다. 분석가나 수요자가 '행복도시 어느 생활권에 언제, 분양·임대 몇 세대가 공급됐고 실제 모집공고는 계획 연도와 맞았는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 생활권·블록 이름이나 사업주체 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 주택 분양계획 및 실적 현황을 제공합니다. 주택구분, 분양계획연도, 위치(생활권·블록), 공급유형, 세대수, 사업주체, 입주자모집공고일, 입주시기 등의 정보를 포함하고 있어, 연도별·유형별 주택 공급 계획과 실제 분양 성과를 비교·분석할 수 있습니다.이를 통해 행복도시의 주택 공급 정책 이행 현황, 공공·민간 공동 참여 구조, 분양·임대주택의 공급 규모를 한눈에 확인할 수 있으며, 향후 주거정책 수립, 주택시장 분석, 인구 이동 연구, 생활권별 인프라 계획 등에 활용 가능합니다.
