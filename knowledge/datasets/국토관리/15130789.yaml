summary_user: 경기부동산포털이 제공하는 경기도 내 학교별 기본 현황 자료로, 학교 한 곳마다 학교구분·설립구분, 남녀 학생·교사 수, 학년별 학급·학생 수, 졸업생 진학·취업 현황, 주소·좌표·연락처를 담는다. 분석가나 주택 수요자가 특정 시군이나 동네 학교의 학급 규모와 교사 1인당 학생 수가 어느 정도인지 비교할 때 쓴다. 시군구코드·읍면동코드·학교코드 필드가 있지만 실측에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 학교명·행정구역 이름이나 코드를 직접 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 경기도 내 학교 정보로, 각 학교의 기본 현황과 학생·교사 관련 통계를 포함합니다. 주요 항목으로는 시군구코드, 학교구분, 학교코드, 학교명, 설립구분(공립/사립), 설립형태, 학생수(남학생수·여학생수), 교사수(남교사수·여교사수), 학급수와 학년별 학생 수가 있습니다. 또한 학교 주소, 위도·경도 좌표, 홈페이지, 전화번호 등 학교 위치 및 연락 정보도 제공됩니다. 이 자료는 교육 인프라 현황 분석, 지역별 학령인구 변화 파악, 학급 규모 비교, 교사 1인당 학생 수 분석 등에 활용할 수 있습니다.
