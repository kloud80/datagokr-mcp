description_portal: '이 데이터는 서울특별시 서울주택도시공사(SH공사)가 시행하는 분양주택의 공급계획을 담고 있는 공공데이터로, 세대 수와 공급 시기 등을 면적별로 세분화하여 제공하는 자료입니다. 항목에는 단지명, 사업유형(예: 공공분양, 신혼희망타운 등), 총 분양예정 세대 수(합계), 주택형별 분양예정 세대 수(49㎡, 59㎡, 64㎡, 66㎡, 70㎡, 74㎡, 75㎡, 80㎡, 84㎡), 사전청약 및 본청약 세대수, 공급시기 예정 월과 예정 연도 등 상세한 공급 계획 정보가 포함되어 있습니다. 이 데이터는서울주택도시개발공사가 중장기적으로 계획 중인 주택공급 일정을 파악하는 데 유용하며, 면적별 수요 대응 전략, 지역별 주택공급 균형, 중산층 및 청년층 대상 공급 비중 분석 등에 활용될 수 있습니다. 특히 전용 84㎡ 이하 중소형 평형이 중심이 되는 분양 공급 구조를 이해하고, 실수요자 중심의 맞춤형 정책 수립 및 시장 예측에 기초자료로 활용 가능합니다. 공급 시기 및 물량은 행정 절차나 사업 여건에 따라 변동될 수 있습니다.'
