summary_user: 제주특별자치도 내 도시공원을 시군구와 공원 구분(근린공원·어린이공원·소공원 등)별로 공원 수와 면적(천㎡)으로 집계한 통계 자료로, 건별 공원 목록이 아닌 집계표이며 포털 설명상 2021년 기준이다. 제주시·서귀포시의 공원 유형별 녹지 규모를 비교하거나 어린이공원·근린공원 확충이 필요한 지역을 가늠하려는 도시계획·녹지정책 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름이나 공원 구분 명칭을 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도가 2021년 기준으로 집계한 제주 지역 내 도시공원 현황을 정리한 자료로, 공원 종류(근린공원, 어린이공원, 소공원 등)별 공원 수와 각 공원의 면적 정보를 포함한 통계 데이터입니다. 도시 내 남아 있는 녹지공간의 분포 현황을 파악할 수 있도록 공원별 분류, 면적 규모, 총합 면적 등을 구조화해 제공되며, 도시계획, 녹지정책, 도시공간 분석, 복지 및 여가 인프라 평가, 공원 확충 또는 관리 정책 수립 등에 유용하게 활용될 수 있습니다. 데이터는 CSV 형식으로 공개되어 있으며, 누구나 무료로 다운로드하여 분석하거나 재가공할 수 있도록 제공됩니다.
