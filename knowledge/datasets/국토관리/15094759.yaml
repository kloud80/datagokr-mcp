summary_user: 제주특별자치도 내 외식업체 매출을 연월(base_year_month)·메뉴 유형별로 집계한 통계로, 포털 설명상 2019년 1월부터 2020년 12월까지 구이류, 국·탕·찌개·전골류, 과일·샐러드류 등 메뉴 유형별 매출액을 백만 원 단위로 담는다. 외식업 창업자나 지역경제 분석가가 '제주에서 어떤 메뉴 유형의 매출이 어느 달에 많았는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 연월이나 메뉴명을 이름으로 맞추어 잇거나 같은 기관(제주특별자치도) 자료끼리만 연결한다.
description_portal: 이 데이터셋은 2019년 1월 1일부터 2020년 12월 31일까지 제주특별자치도 내에서 외식업체들이 제공한 메뉴 유형별 매출액을 집계한 통계자료입니다. 메뉴 유형은 구이류, 국/탕/찌개/전골류, 과일/샐러드류, 기타 등으로 구분되어 있으며, 각 월별·메뉴별 매출액을 집계하여 어떤 음식 메뉴가 얼마만큼 소비되었는지를 보여줍니다. 제공기관은 제주특별자치도청이며, 관리부서는 디지털혁신과입니다. 데이터는 CSV 형식으로 누구나 무료로 다운로드할 수 있으며, 지역 외식산업 소비 패턴 분석, 메뉴별 인기 조사, 외식업자 판매 전략 수립, 관광객 및 주민 소비 성향 파악, 지역경제·소비 트렌드 연구 등에 유용합니다. 다만 수집 기간이 2019~2020년으로 한정되어 있어 이후 변화된 외식 소비 트렌드나 업체 구성 변화, 메뉴 구성 변화 등은 반영되어 있지 않을 수 있다는 점을 유의해야 합니다.
