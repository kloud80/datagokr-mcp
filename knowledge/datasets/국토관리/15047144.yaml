description_portal: '○ 통계개요* 통계명 : 공동주택관리 현황(유형별)* 통계종류 : 서울시 공동주택관리 현황을 유형별로 제공하는 일반ㆍ보고 통계* 근거법령 : 주택법에 의거한 주거실태조사* 작성목적 : 공동주택관리 현황을 파악하여, 공동주택을 효율적으로 관리하고 건설 및 주거환경관련정책수립을 위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 유형별(아파트, 주상복합, 연립, 다세대) 공동주택 현황○ 용어설명○ 기 타* 해당연도 12월31일 기준 산정* 25개 자치구 "공동주택 업무" 부서에서 관리하는 의무관리+임의관리 공동주택 기준** 의무관리: 「공동주택관리법」 제2조제1항제2호에 따른 공동주택** 임의관리: 의무관리 외 자치구(주택과)에서 관리하는 공동주택'
