description_portal: '지역지구별 토지이용규제정보는 특정 토지에 대한 이용제한 사항으로 토지이용규제 관련 지역·지구별로 토지이용과 관련된 법령정보 및 해당 조항, 관할지역 코드, 지역지구 코드 및 관련 제한규정 등을 제공합니다.토지의 용도, 건폐율, 용적률, 높이 제한 등 토지이용에 대한 제한 사항을 담고 있으며,국토교통부 토지이음 서비스나 환경공간정보서비스를 통해 확인할 수 있습니다.* 주요 정보  - 용도지역: 도시지역, 관리지역, 농림지역, 자연환경보전지역 등  - 지구: 개발제한구역, 취락지구, 경관지구 등  - 건폐율 및 용적률: 건축물의 바닥면적과 연면적 제한  - 높이 제한: 건축물의 높이 제한  - 행위 제한: 건축, 개발 등에 대한 제한 사항 따라서, 국토의 효율적인 관리를 위해 각각의 지역지구는 관련 법령에 의거하여 토지이용행위 제약 사항을 명시하고 있습니다.'
