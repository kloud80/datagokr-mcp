summary_user: 용도지역·지구·구역별로 적용되는 법령과 조항(법률명, 조·항 번호, 별표 구분), 관할지역, 제한규정과 그 상세 내용을 한 행씩 담은 전국 단위 파일이며, 검증 때 23,427행을 받았다. 부동산 거래나 건축을 앞둔 국민·사업자가 '이 땅이 속한 용도지역·지구에서는 어떤 행위가 제한되고 근거 조항은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어서 관할지역코드·관할지역명, 용도지역지구명, 법률코드 같은 이름·코드를 맞춰 필지별 토지이용계획(지역지구 지정 정보)과 연결하고, 그 필지를 다시 PNU로 공시지가·건축물대장·실거래 자료와 잇는다.
limits: 파일 안에 필지번호(PNU) 같은 전역 조인 키가 없다. 그래서 특정 필지의 규제를 바로 조회할 수 없고, 먼저 그 필지가 어느 지역지구에 속하는지 다른 자료로 확인한 뒤 지역지구명·관할지역코드로 맞춰야 한다. 포털 파일(csv)로 받는 방식이며, 갱신 주기는 확인된 근거가 없다.
