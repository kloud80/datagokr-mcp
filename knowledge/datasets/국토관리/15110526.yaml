summary_user: 대구광역시 서구의 주택건설사업을 사업(승인 건) 단위로 담으며, 승인번호·사업명·대지 위치와 면적, 건폐율·용적률, 층수·동수·세대수, 사업주체·설계자·시공자·감리자, 접수·승인·착공·준공예정 일자, 공정률과 착공 여부를 제공한다. 서구에 어떤 주택 사업이 승인됐고 언제 착공·준공 예정인지, 몇 세대가 공급될지를 확인하려는 주민·부동산 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지 위치(PLOT_LC)나 사업명 같은 이름 매칭, 또는 같은 기관 코드로만 이어 쓴다.
