summary_user: 경기도 하남시의 개별공시지가를 필지 단위로 담은 원천 파일로, 법정동·본번·부번·지목별 결정지가(단위면적당 가격)와 결정공시일자를 수록한다. 토지 소유자나 매수 검토자가 하남시 특정 필지의 공시지가가 얼마인지, 세금·부담금 산정 기준가를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(PNU 등)가 없어 법정동 이름과 본번·부번을 조합해 지적·건축물대장 등 다른 필지 자료와 맞춰야 한다.
description_portal: 경기도 하남시의 개별공시지가를 필지별로 수록한 자료로, 법정동, 본번, 부번, 결정지가 등으로 구성됩니다. 개별공시지가는 국토교통부장관이 매년 공시하는 표준지 공시지가를 기준으로 하남시가 조사한 개별토지의 특성과 비교표준지의 특성을 비교하여, 토지가격비준표상의 가격배율을 곱해 산정하고, 감정평가업자의 검증과 토지소유자 의견청취, 하남시 부동산가격공시위원회 심의를 거쳐 하남시장이 결정·공시한 토지 단위면적당 가격입니다. 이는 국세 및 지방세 부과, 개발부담금 산정, 재개발 보상, 용도지역 변경 평가 등 행정·정책의 핵심 기준으로 사용됩니다.
