summary_user: 전라남도 인재개발원 자료실(도서실)이 보유한 행정자료·영상자료(DVD)·일반도서를 자료 한 건당 한 행으로 담은 소장 목록이며, 등록번호·서명·저작자·발행자·발행년도를 담고 약 3MB 크기의 CSV 파일로 활용신청 없이 받는다. 공무원이나 교육 담당자가 '특정 주제나 저자의 자료가 인재개발원 자료실에 있는지'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 서명·저작자·발행자 같은 문자열을 맞춰 대조하는 방식으로만 이을 수 있다.
description_portal: '- 전라남도 인재개발원 자료실(도서실)에서 보유하고 있는 자료들의 목록입니다. 자료 구성은 행정자료_영상자료(DVD)_일반도서로 구분되어 있습니다.- 전라남도 인재개발원(LOTI, Jeonnam Local Officials Training Institute)은 전라남도 공무원 및 지방자치단체 직원을 대상으로 전문성과 역량 강화를 위한 다양한 교육과정을 운영하는 기관입니다. 주요 교육 프로그램으로는 신규 공무원 대상 사이버 교육, 감염병 대응 교육, 공직자 행동강령 교육 등이 있으며, 실시간 방송을 통해 교육도 제공하고 있습니다.- 기관의 연간 교육 일정, 열린강좌, 자료실 등 다양한 학습 지원 기능도 제공하고 있어, 공무원들의 지속적인 학습과 역량 강화를 지원하고 있습니다.'
