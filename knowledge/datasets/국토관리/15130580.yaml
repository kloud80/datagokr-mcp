summary_user: 전라남도 산업단지정보시스템에 게재된 도내 주요 산업단지를 단지 한 곳당 한 행으로 정리한 파일로, 시군·단지유형(국가·일반·농공 등)·조성상태와 조성기간, 지정·관리면적, 공사비·보상비·총사업비, 입주업종, 도로 입지를 담는다(CSV 약 26KB). 투자·입지 검토를 하는 사업자나 분석가가 '전남 어느 시군에 어떤 업종을 받는 산업단지가 어느 규모로 조성돼 있나'를 확인하는 데 쓴다. 실측 컬럼에 산업단지코드 같은 전역 조인 키가 없어서, 전국산업단지및공장정보표준데이터·국토부 산업단지 일반현황 같은 산업단지코드 원장과는 단지명·시군 이름을 맞춰서만 이어 쓴다.
description_portal: '- 전라남도 산업단지정보시스템에 게재된 도내 주요 산업단지의 상세정보(조성상태, 조성기간, 위치, 지정면적, 총사업비, 입주업종 등)에 대해 조회하실 수 있습니다.- 전라남도(전남)의 산업단지는 국가산업단지, 일반산업단지, 농공단지  등으로 다양하게 조성되어 있습니다.- 각 산업단지에 따라 설치 인프라, 분양 가능 여부, 입주 업종 조건 등 세부사항이 상이합니다.- 현황 지도나 분양 정보는 전남도 산업단지 정보관리시스템, 산단코리아, 해당 시·군 투자청 자료 등을 통해 확인 가능합니다.- 일반산업단지는 각 시군에 분포한 중규모 일반산단으로, 입주기업 수요에 대응합니다.'
