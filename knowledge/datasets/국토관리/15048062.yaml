description_portal: 기후에너지환경부 영산강홍수통제소 수문관측일람표는 영산강홍수통제소에서 관할하는 수문관측시설에 대한 제원 정보입니다.영산강홍수통제소 행정 관할 지역은 전라북도, 전라남도, 광주광역시, 경상남도 일부(하동군), 제주도 입니다.영산강홍수통제소 수계 관할 유역은 영산강, 섬진강, 동진강, 만경강, 탐진강 및 제주도에 위치하고 있는 하천입니다.설치목적은 수위 및 강수량 측정을 하여 국가수문자료 생성, 홍수 및 갈수예보 등에 활용하고 있습니다.제공되는 정보는 수위 및 강수량 측정을 위해 설치하여 운영하고 있는 수문관측소에 대한 행정 지역 위치, 측정 개시일, 위도, 경도, 측정 방법 등에 관한 정보입니다.
