summary_user: 영산강홍수통제소가 관할하는 영산강·섬진강·동진강·만경강·탐진강과 제주도 하천의 수위·강수량 관측소 제원을 관측소 한 곳당 한 행으로 담는다. 홍수 예보 지점 주변의 관측소 위치, 관측 개시일, 관측·전송 방법, 수위표 영점표고와 유역면적을 확인하려는 분석가나 하천 관리 실무자가 쓴다. 전역 조인 키는 없으므로 관측소 코드나 관측소명으로 같은 기관의 수위·강수량 관측자료와 맞추고, 위도·경도로 지도나 행정구역 자료에 얹어 쓴다.
limits: 관측값 자체는 없고 관측소 제원만 담은 파일이며, 명세상 갱신 주기는 연간이다. 다른 기관 자료와 바로 이어 붙일 공통 키가 없어 관측소 코드·이름 매핑이 필요하다. 범위는 '전국'으로 분류되어 있지만, 포털 설명상 실제 대상은 전라북도·전라남도·광주·하동군·제주도의 관할 유역이다.
