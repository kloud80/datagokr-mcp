description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 건축지정선현황으로 규제관리번호 , 현황도형 관리번호 , 길이_도형 등의 항목을 제공합니다.건축지정선현황은 특정 지역에서 건축물 건축 시 준수해야 할 건축선의 위치와 관련된 정보를 의미합니다. 이는 건축물의 배치, 형태, 도로와의 관계 등을 규제하여 도시 미관, 안전, 통행 편의 등을 확보하기 위한 것입니다데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
