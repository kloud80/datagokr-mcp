summary_user: 대구광역시 동구 안의 어린이공원을 공원 한 곳당 한 행으로 담고, 공원명·도로명주소·면적과 함께 조합놀이대·그네·놀이기구·음수대·체육시설·정자·벤치 수, 교목·관목 같은 시설·수목 현황을 싣는다. 동구에 사는 보호자가 집 근처에서 그네와 조합놀이대가 갖춰진 어린이공원이 어디인지 찾을 때 쓰고, 분석가는 공원별 놀이·휴게시설 구성과 규모를 비교할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 공원명이나 도로명주소(RDNMADR)를 맞추거나 같은 기관 자료끼리만 이어 쓸 수 있다.
limits: 범위가 대구 동구 한 곳이라 다른 구·시와 비교하려면 별도 데이터가 필요하다. 공통 코드나 좌표 키가 없어 도시공원 정보 같은 전국 데이터와 붙일 때는 이름·주소 매칭에 기대야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
