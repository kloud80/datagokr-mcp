summary_user: 제주특별자치도의 민간 미분양주택 수를 기준년월별로 제주시·서귀포시 두 행정시로 나누어 담은 집계 파일(CSV)이며, 미분양주택은 분양승인을 받아 일반 분양했으나 분양되지 않은 주택을 뜻한다. 제주 주택시장을 보는 분석가나 분양 사업자가 '최근 제주시와 서귀포시의 미분양 물량이 어떻게 늘거나 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 주택 공급·인허가·실거래 데이터와는 기준년월과 행정시 이름을 맞춰 붙여 쓴다.
