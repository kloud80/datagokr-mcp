description_portal: 이 자료는 충청남도개발공사의 공사계약 현황으로, 각 계약 건별 계약명, 금액, 일정 및 계약상대자 정보를 제공한다. 단, 개별 세부 공정 내역이나 계약 변경 사유 등은 제공하지 않는다.컬럼별 상세설명○ 계약명 → 해당 공사의 정식 계약명을 의미하며, 공사 목적이나 사업 성격을 확인할 수 있는 항목으로 동일 사업 내 세부 공종별로 중복 기재될 수 있음○ 최초계약금액 → 계약 체결 시점에 확정된 최초 금액을 원 단위로 표시하며, 추후 계약 변경이나 설계 변경 시 실제 최종 금액과 상이할 수 있음○ 계약일자 → 계약이 법적으로 성립된 날짜를 의미하며, 계약 효력 발생일로 관리됨○ 착공일자 → 계약된 공사가 실제로 시작된 날짜를 의미하며, 현장 투입 기준으로 산정됨○ 준공일자 → 공사가 최종적으로 완료된 날짜를 의미하며, 준공검사 완료 시점 기준으로 기록됨○ 계약상대자 → 공사 수행을 맡은 업체(시공사)의 명칭을 의미하며, 주식회사·법인명 등으로 기재됨○ 공사기간 → 착공일자부터 준공일자까지의 기간을 의미하며, 일정 지연이나 연장에 따라 실제 공사기간은 변동될 수 있음○ 계약금액 변동 → 최초계약금액과 실제 준공 시점 금액 간 차이를 의미하며, 설계변경·물가변동·계약조건 조정 등에 따라 발생할 수 있음
