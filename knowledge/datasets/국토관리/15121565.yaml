description_portal: 본 데이터는 경기도 광주시의 지적전자문서시스템(구 토지대장)의 지적도 현황 정보를 제공합니다. 토지의 경계와 지번을 표시한 지적도의 전자문서 관리 정보를 담고 있어 지적 업무와 토지 정보 관리에 활용됩니다. 롤번호와 프레임은 전자문서의 보관 위치를 나타내며, 소재지는 해당 지적도가 표시하는 지역을 나타냅니다. 문서명은 지적도의 명칭이고, 도호는 지적도의 고유 번호를 표시합니다. 순번은 문서의 관리 순서를 나타내며, 축척은 지도의 축소 비율을 제공합니다.본 데이터는 지적 관리, 토지 경계 확인, 부동산 거래, 측량 업무, 지적 민원 처리, 토지 정보 제공 등에 활용됩니다.
