description_portal: 제방월류, 제방파제, 내수침수 등 홍수시나리오에 따라 예상되는 최대 범람지역을 표시하는 홍수위험지도에 대하여 권역을 구분하는 수계를 표현.* 홍수위험지도란? 하천제방의 설계빈도를 초과하는 홍수가 발생하여 제방붕괴, 제방월류 등 극한의 상황이 발생한다는 가정하에 하천 주변지역의 침수범위, 침수깊이를 나타낸 지도. 이를 통해 최악의 홍수상황을 사전에 대비하고 인명 및 재산피해를 최소화하며, 지자체의 재해지도 제작, 홍수 관련 보험의 기초자료를 제공 및 수해방지대책 수립 등에 활용이 가능한 홍수 대비를 위한 기초정보. 홍수위험지도의 제방붕괴 등의 홍수 예상 시나리오는 실제 하천제방의 안정성과 무관하며, 구조물적 대책이 실패한다는 최악의 경우를 가정한 것으로서 홍수 시 가상의 최대 범람 범위 산정을 위한 것임* 수자원단위지도란? 국가 자원의 수자원개발, 계획 및 관리업무의 효율적 추진을 위하여 수자원 업무에 활용되는 자료의 수집, 분석과 관련된 기관 간 자료와 공동활용을 목적으로 지형공간 상에 대권역, 중권역 및 표준유역의 가상의 구역을 설정한 지도
