summary_user: 대전광역시 주요 산업단지(대덕특구·대덕산업단지·대전산업단지·하소친환경산업단지 등)에 입주한 기업의 업체명·주소 등을 업체별로 담은 엑셀 파일(xlsx)이다. 구직자나 영업 담당자가 '대전산업단지에 어떤 업체가 어디에 입주해 있나'를 확인하거나, 분석가가 단지별 입주기업 구성을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 공장 등록 등 다른 자료와는 업체명·주소 매핑으로만 이어 쓴다.
description_portal: 대전광역시 산업단지 입주 기업 현황 자료는 대덕특구, 대덕산업단지, 대전산업단지, 하소친환경산업단지 등 대전광역시 주요 산업단지 내에 입주한 기업체의 정보를 종합적으로 제공합니다. 이 자료에는 각 산업 단지 별 입주 기업의 명칭, 주소 등 기업 별 주요 속성이 체계적으로 포함되어 있습니다. 또한 전체 입주 기업 수, 산업단지 별 업종 분포 등 다양한 항목이 수록돼 지역 내 기업 생태계 구조와 산업단지 별 특성을 파악하는 데 활용될 수 있습니다. 본 자료는 산학연 연계 활성화, 정책 수립, 투자유치 전략 마련, 신규 산단 조성, 산업단지 고도화, 입주 기업 유치 및 관리 등 행정적·정책적 업무의 기초 데이터로 중요하게 사용됩니다.
