summary_user: 순천시 도시재생 활성화 구역 안 주차장을 한 행씩 담은 건별 파일로, 주소·좌표와 함께 기본·추가 단위 요금, 1일권·정기권 요금, 지불방식, 장애인·경차 할인 여부를 담는다(파일 약 8.9KB). 주민이나 방문객이 원도심 재생구역에서 경차나 장애인 차량으로 할인받을 수 있는 주차장이 어디인지, 요금이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 도로명·지번 주소나 위도·경도 좌표, 주차장 이름으로 맞춰 이어 쓴다.
