summary_user: 구리시 안의 현수막 지정게시대를 게시대 한 곳씩 담은 목록으로, 읍면동·용도(행정용/상업용)·도로명/지번 주소·위도경도·현수막 규격·게시면수·부착일수와 부착금액(수수료·도로점용료)을 포함한다. 현수막을 걸려는 사업자나 단체가 '우리 동네 어느 게시대에 어떤 규격으로 며칠, 얼마에 걸 수 있나'를 확인하거나, 분석가가 게시대 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 읍면동명·주소 이름 매칭이나 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 현수막 지정 게시대 현황에 대한 정보입니다. 현수막의 용도와 위치, 현수막 규격 등 현수막의 정보를 포함하여 제공하고 있습니다.공란이 있는 경우 행정용과 상업용의 구분이므로 확인하여 주시기 바랍니다.
