summary_user: 전국의 도시·군계획시설 가운데 공간시설에 해당하는 결정 사항을 건별로 담고, 필드명으로 보아 시설 분류(대·중·소분류), 시군구, 도면명·면적·연장, 고시·집행 구분 등이 함께 들어 있다. 분석가나 사업자가 특정 시군구에 어떤 공간시설이 얼마의 면적으로 결정·고시됐는지, 집행 여부는 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 도시계획시설(도로·교통시설 등) 데이터와는 시군구명·시설 분류명 같은 이름·코드를 맞춰 연결한다.
limits: 포털 활용신청과 별개로 브이월드(vworld.kr) 인증키를 받아 key 파라미터로 넣어야 호출된다. 공통 조인 키가 없어 다른 데이터와 붙일 때 이름 매핑에 의존하며, 범위는 전국이지만 행정단위가 비공간으로 분류돼 있어 좌표·경계 결합 가능 여부는 따로 확인해야 한다.
