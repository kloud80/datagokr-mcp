description_portal: '금천구 관내 법정동별 빈집 현황을 개소, 단독주택, 다가구, 다세대, 연립, 아파트, 기타 주택 유형별로 구분해 제공합니다.※ "빈집"이란 : 거주 또는 사용여부를 확인한 날로부터 1년 이상 아무도 거주 또는 사용하지 않는 주택으로, 노후도 및 불량 상태, 주변에 미치는 영향 정도 등을 고려하여 1~4등급으로 구분됩니다. 상태가 비교적 양호한 1~2등급은 정비를 통해 활용을 유도하고, 붕괴·화재·범죄 발생 우려가 높은 3~4등급은 철거 및 안전조치가 필요한 상태입니다. (자세한 내용은 빈집 및 소규모주택 정비에 관한 특례법 참고)각 동별 빈집 수와 위치, 데이터 기준일자 정보가 포함되어 있어 도시 재생, 주거환경 개선, 빈집 활용 정책 수립 등에 유용하게 활용할 수 있으며, 빈집 분포와 유형별 현황을 파악함으로써 지역 내 주택 자원 관리 및 사회적 문제 예방에 기여할 수도 있습니다. 본 데이터는 매년 주기적으로 갱신됩니다.'
