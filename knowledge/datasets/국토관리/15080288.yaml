summary_user: 인천광역시 영종구 관내 일반건축물의 시가표준액을 건물별로 담은 파일로, 납부년도·물건지·연면적(제곱미터)·시가표준액(원)·결정일자가 함께 들어 있으며 범위는 시군구, 단위는 필지·건물이다. 재산세 등 세금이나 부담금, 보상 평가의 기준 금액을 확인하려는 주민·사업자·분석가가 '이 건물의 올해 시가표준액은 얼마인가', '면적 대비 금액이 비슷한 건물들과 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 물건지(주소) 문자열 매핑이나 자치단체코드 같은 기관 코드로만 이어 쓴다.
description_portal: 본 데이터는 인천광역시 관내 일반건축물에 대해 매년 산정되는 시가표준액 정보를 제공합니다.시가표준액은 세금 부과, 각종 부담금 산정, 공공사업 보상 평가 등의 기준으로 활용됩니다.본 데이터는 건축물의 소재지, 구조, 용도, 면적, 건축 연도 등 다양한 항목을 포함하고 있으며, 각 건축물별로 개별 산정된 시가표준액을 확인할 수 있도록 구성되어 있습니다.관련 법령과 산정기준에 따라 매년 갱신되며, 부동산 관련 정책 수립 및 연구, 행정 업무, 민원 처리 등에 활용될 수 있습니다.사용자들은 본 데이터를 통해 중구 관내 건축물의 자산 가치를 파악하거나 비교 분석하는 데 유용하게 활용할 수 있습니다.
