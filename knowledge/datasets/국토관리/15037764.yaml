summary_user: 한국농어촌공사가 관리하는 전국 농업용 저수지·담수호별로 조사일자마다 측정한 수질 값을 건별로 담으며, 시설명·주소·관리기관과 함께 pH·전기전도도·용존산소·COD·TOC·총질소·총인·부유물질·염소이온·클로로필a와 시안·비소·수은·납·카드뮴 등 중금속 농도가 들어 있다(CSV 약 1MB). 농업인이나 지자체·분석가가 우리 지역 저수지 물이 농업용수 수질기준에 맞는지, 녹조(클로로필a)·영양염이 어느 시기에 높아지는지 확인하는 데 쓴다. 전역 조인 키는 없어 같은 기관의 시설코드나 시설명·주소를 맞춰 농어촌공사 저수지 저수율·제원 데이터와 이어 쓴다.
description_portal: -농업용수 수질 데이터는 국가 물환경 측정망 중 농업용수 부문의 수질 데이터로, 한국농어촌공사가 관리하는 전국 주요 저수지 및 담수호에서 주기적으로 수집된 수질 측정 정보입니다. -각 농업용 호소(저수지, 담수호)의 주소, 조사일자, 담당 관리기관 등의 기본정보와 함께 수소이온농도(pH), 전기전도도(EC), 용존산소량(DO), 화학적 산소요구량(COD), 총유기탄소(TOC), 총질소(T-N), 총인(T-P), 부유물질(SS), 클로로필a(Chl-a), 시안(CN), 비소(As) 및 일부 중금속 등 주요 수질 항목의 농도가 포함되어 있습니다. -이 데이터는 농업용수 수질개선사업 추진계획, 친환경 농산물 인증 등에 활용됩니다.
