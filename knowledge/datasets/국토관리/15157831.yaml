description_portal: 본 데이터는 대전광역시 대덕구 관내에 소재한 빈집의 현황을 행정동 단위로 세분화하여 제공하는 통계 자료입니다. 대덕구는 「빈집 및 소규모주택 정비에 관한 특례법」 제5조에 의거하여 5년단위 실태조사를 실시하고 있으며, 조사된 빈집의 노후도 및 위해성 정도에 따라 등급을 분류하여 체계적으로 관리하고 있습니다.데이터의 주요 구성 항목은 대덕구 내 각 행정동별 1등급(활용 대상), 2등급(관리 대상), 3등급(정비 대상) 빈집의 개수 정보를 포함합니다. 여기서 1등급은 상태가 양호하여 즉시 거주나 활용이 가능한 주택을 의미하며, 2등급은 안전조치 등 일정 수준의 수선이 필요한 상태를 나타냅니다. 마지막으로 3등급은 건축물의 노후도가 심각하여 철거 또는 강력한 정비가 요구되는 불량 빈집을 의미합니다.본 자료는 대덕구의 주거지 정비 사업 계획 수립 및 지역 재생 전략 마련을 위한 기초 자료로 활용될 수 있습니다. 이용자는 본 데이터를 통해 동별 주거 환경의 취약 지점을 파악하고, 빈집 정비 사업의 우선순위를 분석하는 데 유용한 시사점을 얻을 수 있습니다. 대덕구는 앞으로도 투명한 정보 공개를 통해 쾌적하고 안전한 도시 환경 조성에 최선을 다하겠습니다.
