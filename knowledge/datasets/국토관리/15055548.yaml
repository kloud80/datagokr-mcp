summary_user: "전북특별자치도에서 지역 고유자원으로 조성한 향토산업마을을 마을 단위로 정리한 파일로, 시군 구분·읍면동·마을명과 조성연도, 지원받은 사업내용, 주요 생산품을 담는다(CSV 약 6.7KB). 지역별 6차 산업 현황을 보려는 분석가나 특정 특산품(예: 한과·된장)을 만드는 체험 마을을 찾는 소비자·관광객이 '어느 시군 어느 마을에서 무엇을 생산하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군·읍면동 이름을 행정구역 코드로 매핑해 이어 써야 한다."
description_portal: "전북특별자치도 내에서 지역 고유자원을 활용하여 부가가치를 창출하는 '향토산업마을'의 조성 현황을 정리한 데이터입니다. 이 자료는 각 시군별로 지정된 마을의 위치, 조성 연도, 그리고 정부 지원을 받은 핵심 사업 내용(예: 한과 가공시설, 체험 교육관)과 이를 통해 생산되는 주요 특산품(예: 된장, 한과, 두부) 정보를 상세히 담고 있습니다. 이 데이터는 지역별 6차 산업의 현황을 파악하고 성공 사례를 분석하는 데 유용하며, 소비자와 관광객에게는 특색 있는 농촌 체험 마을이나 믿을 수 있는 로컬푸드를 찾는 길잡이가 될 수 있습니다."
