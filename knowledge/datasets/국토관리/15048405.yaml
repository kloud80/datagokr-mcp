summary_user: 경기도 가평군 관내 주택 외 건물(근린생활시설·창고 등)의 시가표준액을 건물 한 건씩 소재지 지번주소, 기준연도, 용도·구조, 연면적·전용면적·공용면적, 준공일자와 함께 담은 CSV 파일(약 2.8MB)이다. 가평군에 비주거용 건물을 가진 사업자나 분석가가 "같은 용도·구조의 건물은 면적당 과세 기준 금액이 얼마인가"를 비교하거나 재산세·취득세 부담을 가늠할 때 쓴다. 전역 조인 키는 없어 다른 건축물·공시가격 데이터와는 소재지 지번주소나 시군명을 맞춰 연결해야 한다.
description_portal: '해당 데이터는 경기도 가평군 관내의 주택 외 건물에 대한 시가표준액 현황을 정리한 자료로, 건축물의 용도와 구조, 면적 등에 따라 산정된 건물 자산 가치를 파악할 수 있는 정보를 제공합니다. 시가표준액은 「지방세법」 등에 근거하여 재산세, 취득세 등의 과세 기준이 되는 금액으로, 공정한 과세와 부동산 가치 산정을 위해 매년 고시됩니다. 본 데이터는 시군명, 기준연도, 건물용도(예: 근린생활시설, 창고 등), 건물구조(철근콘크리트, 일반목구조 등), 소재지 지번주소, 연면적, 전용면적, 공용면적 등의 항목으로 구성되어 있으며, 다양한 유형의 비주거용 건물의 가치를 비교·분석하는 데 활용할 수 있습니다. 이 자료는 지방세 부과, 부동산 통계 분석, 재산 평가 및 행정계획 수립 등 다양한 행정 및 정책적 용도로 사용될 수 있습니다.'
