summary_user: '부산진구에 있는 아파트·주상복합·임대주택 등 공동주택을 단지 한 곳당 한 행으로 담은 현황 파일이며, 단지명, 지번·도로명 주소, 층수, 동수, 세대수, 준공일이 들어 있다(csv 약 15KB). 주민이나 부동산 분석가가 "부산진구에서 준공된 지 오래된 대단지 아파트는 어디인가"처럼 구 안 공동주택의 규모와 노후도를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 단지명이나 주소를 직접 매칭해 잇는다(예: 공동주택 관리·실거래 자료와 주소 기준 결합).'
description_portal: 부산진구 소재 아파트, 주상복합시설 등 공동 및 임대주택현황에 대한 데이터로 단지명, 주소, 세대수, 준공일정보 등을 제공합니다.공동주택이란 여러 세대가 한 건물 또는 단지 내에서 각각의 전용 공간을 소유하면서, 계단·복도·엘리베이터·지붕·지하주차장 등 공용부분을 공동으로 사용하는 주택을 말합니다. 한국의 「주택법」 제2조 제2호에 정의공동주택이란 둘 이상의 세대가 하나의 건축물 또는 단지 내에서 **각자의 전유 공간(전용부분)**을 가지면서, 계단·복도·승강기·옥상·주차장·기계설비 등 공용부분을 공동으로 사용하는 주택을 말합니다. 이러한 공동생활 구조는 도시화와 고밀도 주거를 가능하게 하며, 효율적인 토지 이용을 통해 많은 인구가 제한된 공간 안에서 안정적으로 거주할 수 있도록 합니다.대한민국 「주택법」 제2조 제2호에서는 공동주택을 다음과 같이 정의하고 있습니다.
