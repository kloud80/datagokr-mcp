summary_user: 신안군 관내에 지정된 용도지구를 도형(현황도형 관리번호) 단위로 정리한 파일로, 지구유형·지구유형상세·면적·길이·도면번호·도형생성일자를 담으며 범위는 시군구(신안군) 하나다. 신안군에서 건축이나 토지 투자를 검토하는 사람이 '이 지역에 어떤 용도지구(경관·취락·보호 등)가 얼마만큼 지정돼 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 지구유형 이름을 맞추거나 같은 기관(신안군) 자료끼리 묶는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 전라남도 신안군 관내 용도지구 지정 현황을 정리한 자료로, 도시계획 수립 및 지구단위 개발사업 검토에 활용됩니다. 각 행정구역별로 지정된 용도지구의 위치와 특성을 파악할 수 있으며, 지황도형 관리번호, 지구유형, 지구유형상세, 면적, 길이, 도면번호, 도형생성일자  등의 정보를 포함합니다. 본 자료는 건축행위 제한, 경관 보호, 토지이용 규제 등과 관련된 계획 행정에 필요한 기초정보로서, 지구현황 분석 및 변경 이력 관리, 도시관리계획도 검토, 민원 대응, 투자 검토 등 다양한 분야에서 활용 가능합니다.용도지구는 해당 지역의 지리적·환경적 특성을 고려해 토지이용을 세분화한 규제 구역으로, 본 데이터는 효율적인 공간 관리와 지속가능한 도시계획 수립에 기여합니다.
