summary_user: 전라남도 화순군 관내에 지정된 도시계획 용도지구를 지구별 도형(SHAPE)과 명칭·면적·연장·고시 정보 같은 속성으로 담은 공간정보 파일이며, 범위는 화순군 한 개 시군구입니다. 주민·사업자·부동산 거래자가 특정 토지가 경관·고도·방재·취락 같은 용도지구에 걸려 개발이나 건축 제한을 받는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공간 중첩(도형 겹침)이나 시군구 구분값(SIGNGU_SE)·명칭 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 전라남도 화순군 관내에서 행정적으로 지정·관리 중인 도시계획 용도지구에 관한 현황 정보를 수록한 것이다. 용도지구란 특정 용도나 목적에 부합하도록 토지의 이용 및 개발을 제한하거나 유도하기 위해 행정기관에서 지정한 공간 단위이다. 해당 데이터에는 각 용도지구의 명칭, 위치(법정동·지번), 지정 목적, 면적, 지정일자, 적용 규정 등 세부 사항이 포함되어 있다. 이를 통해 주민과 사업자가 토지의 개발 가능 여부나 건축 행위 제한 사항을 파악할 수 있으며, 부동산 거래 시에도 토지의 규제 현황을 참고할 수 있다. 본 자료는 도시 및 군계획시설 사업, 인허가 심사, 공공시설 입지 선정, 각종 행정 계획 수립 업무 등에 다양하게 활용되고 있다. 또한 지자체에서 주기적으로 현행화하여 최신 도시관리 정책에 맞는 정보를 제공함으로써, 사용자들이 화순군 내 용도지구별 현황을 쉽고 명확하게 이해하고 적용할 수 있도록 한다. 데이터 포맷은 표준 공간정보 체계에 맞춰 구축된다.
