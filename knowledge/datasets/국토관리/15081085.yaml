summary_user: 충청남도 아산시 관내 아파트 관리사무소를 단지별 한 행으로 담은 파일로, 아파트명·도로명주소·위도·경도·관리사무소 전화·팩스번호와 데이터 기준일자를 담는다(약 27KB CSV). 아산시 주민이나 관리업무 관계자가 '우리 단지 관리사무소 연락처는 무엇이고 어디에 있나'를 찾거나, 분석가가 관내 관리사무소 분포를 지도에 올릴 때 쓴다. 전역 조인 키(K-apt 단지코드 등)가 없어 다른 공동주택 데이터와는 아파트명·도로명주소 문자열 매칭이나 위경도 근접으로만 이어 쓴다.
description_portal: '※ 의무관리대상 아파트: 해당 아파트를 전문적으로 관리하는 자를 두고 자치 의결기구를 의무적으로 구성하여야 하는 등 일정한 의무가 부과되는 아파트를 말하며, 그 범위는 다음과 같습니다(규제「공동주택관리법」 제2조제1항제2호 및 규제「공동주택관리법 시행령」 제2조).1. 300세대 이상의 아파트2. 150세대 이상으로서 승강기가 설치된 아파트3. 150세대 이상으로서 중앙집중식 난방방식(지역난방방식을 포함함)의 아파트4. 규제「건축법」 제11조에 따른 건축허가를 받아 주택 외의 시설과 주택을 동일건축물로 건축한 건축물로서 주택이 150세대 이상인 건축물5. 1.부터 4.까지에 해당하지 않는 공동주택 중 전체 입주자등의 3분의 2 이상이 서면으로 동의하여 정하는 아파트※ 입주자: 아파트의 소유자 또는 그 소유자를 대리하는 배우자 및 직계존비속을 말합니다(규제「공동주택관리법」 제2조제1항제5호).※ 사용자: 아파트를 임차하여 사용하는 자(임대주택의 임차인은 제외한다) 등을 말합니다(규제「공동주택관리법」 제2조제1항제6호).※ 관리주체: 아파트를 관리하는 규제「공동주택관리법」 제6조제1항에 따른 자치관리기구의 대표자인 아파트의 관리사무소장, 「공동주택관리법」 제13조제1항에 따라 관리업무를 인계하기 전의 사업주체, 주택관리업자 및 임대사업자, 규제「민간임대주택에 관한 특별법」 제2조제11호에 따른 주택임대관리업자(시설물 유지·보수·개량 및 그 밖의 주택관리 업무를 수행하는 경우에 한정함)를 말합니다(「공동주택관리법」 제2조제1항제10호).본 데이터는 충청남도 아산시 관내 아파트관리사무소 현황에 대한 데이터로서 아파트명, 도로명주소, 전화번호, 팩스번호를 포함합니다.'
