summary_user: 경기도 부동산포털의 토지 피합병지 정보로, 다른 필지와 합병되며 소멸된 지번을 필지 단위로 토지고유번호·소재지·연혁순번과 함께 담은 지적 이력 데이터다. 재개발·재건축 사전 조사나 지적 정리를 하는 분석가가 "이 필지는 과거 어떤 지번들이 합쳐져 만들어졌는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 토지고유번호(land_idntfy_no)나 소재지명을 이름·코드 매핑으로 맞춰 경기도의 다른 토지 데이터와 연결해야 한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 토지 피합병지 정보로, 과거 개별 필지로 존재하던 토지가 다른 필지와 합병되며 소멸된 지번 정보를 확인할 수 있는 지적 이력 데이터입니다. 주요 항목은 '토지고유번호', '토지소재지', '토지연혁순번', '피합병지'로 구성되어 있으며, 이는 기존 토지가 어느 시점에서 어떤 토지에 통합되었는지를 나타냅니다. 토지의 소유권 이력 확인, 지번 정리 및 필지 경계 변경 이력 추적, 과거 지적도와의 비교 분석 등에 활용됩니다. 특히 지적 재조사, 재개발·재건축 사전 조사, 세무·공간정보 서비스에서 중요한 기초 자료로 활용될 수 있습니다.
