description_portal: '이 공공데이터는 경상남도 사천시의 공간정보시스템 데이터베이스에 구축된 중앙분리대 시설물에 대한 현황 정보입니다. 중앙분리대는 차로를 물리적으로 분리하여 중앙선 침범으로 인한 대형 사고를 예방하고, 운전자의 시선을 유도하여 교통 안전을 확보하는 데 필수적인 교통 안전 시설물입니다. 이 자료는 사천시의 도로 안전 관리시설물 유지보수계획 수립에 중요한 기반을 제공합니다.데이터셋은 중앙분리대 시설의 관리 및 특성에 관한 다음과 같은 중요한 속성들을 포함하고 있습니다설치일자: 해당 시설물이 설치된 시점을 기록하여, 시설의 노후도를 판단하고 정기적인 안전 점검 및 교체 주기를 결정하는 데 중요한 역할을 합니다.중앙분리대 종류: 시설물의 물리적 형태나 재질을 분류합니다 (예: 콘크리트 방호벽, 가드레일, 가로수 식재형 등). 이는 충돌 시 충격 흡수 성능분석 및 설치 장소 적합성평가에 활용됩니다.연장: 중앙분리대의 총 길이를 미터(m) 단위로 나타내는 정량적 정보로, 시설물의 규모 파악 및 보수 공사 범위산정에 사용됩니다.폭원: 중앙분리대의 너비를 나타내는 정보로, 도로 공간 활용 효율성설치 기준 적합성을 분석하는 데 도움을 줍니다.'
