summary_user: 경기도 구리시에 등록된 공장을 한 곳씩 담은 파일로, 공장명·공장 위치·규모(제곱미터)·업종·공장과 대표자 연락처를 담는다(CSV 약 28KB). 구리시에서 어떤 업종의 공장이 어디에 어느 규모로 있는지 확인하려는 사업자나 지역 산업 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 공장등록 데이터와는 공장명·주소 문자열 매칭으로만 이어 쓴다.
