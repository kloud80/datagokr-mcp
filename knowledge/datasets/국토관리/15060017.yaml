summary_user: 용인도시공사가 관리하는 용인시 관내 공중화장실을 한 곳씩 시설명·시설주소·시설유형·처리방식·비상벨 유무로 정리한 소규모 CSV 파일(약 3KB)이다. 시민·방문객이나 생활편의 지도를 만드는 분석가가 '용인시 어느 공중화장실에 비상벨이 있고 위치는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설주소를 지오코딩하거나 시설명을 맞춰 이어 써야 한다.
description_portal: 용인시 공중화장실 위치 및 주소 등 현황 자료는 시민과 방문객이 공중화장실을 보다 편리하게 이용할 수 있도록, 관내 공중화장실의 기본 정보를 정리해 제공하는 데이터입니다. 본 자료는 공중화장실의 시설명과 시설주소를 통해 실제 위치를 확인할 수 있도록 구성되어 있으며, 화장실의 성격을 구분하는 시설유형명, 운영·관리 특성과 연관될 수 있는 처리방식, 이용 안전과 관련된 비상벨 유무 항목을 포함하고 있습니다. 정보가 일부 변동될 수 있으므로, 최신 정보 확인이 필요한 경우 용인도시공사 공식 홈페이지를 참고하시거나 환경사업팀에 문의해 주시기 바랍니다. 이 자료는 생활편의 증진과 안전한 공중시설 이용을 돕는 기초 정보로 활용될 수 있습니다.
