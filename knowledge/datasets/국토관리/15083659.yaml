description_portal: '부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 조례위반 정보(무단점유 정보) 자료입니다.무단점유 정의: 정당한 권한 없이 부산광역시 소유의 정수장, 수도용지, 급수설비 등을 무단으로 점유하거나 시설을 무단으로 설치·사용하는 행위조례 위반 조치: 부산광역시 수도 급수 조례 및 관련 법령에 따라 무단점유한 자에게 변상금 부과 및 철거 명령 등 행정처분 가능변상금 산정: 공유재산법 등에 따라 무단점유 기간 동안 사용료 또는 대부료의 120%에 해당하는 변상금을 징수철거 및 폐쇄: 시유재산이나 수도시설을 무단 점유·설치한 경우 강제 철거하거나 원상복구 명령을 내릴 수 있음법적 책임: 무단점유자는 변상금 납부 외에도 수도법 위반에 따른 벌칙 또는 행정상 불이익을 받을 수 있음'
