summary_user: 충청남도 홍성군 광천원동시장의 상점을 한 곳씩 담은 데이터로, 시장명·상점명·상점 유형과 함께 도로명·지번 주소, 위경도, 영업시간, 판매품목, 결제 방식, 배달·주차·공중화장실 여부 같은 항목을 상점 단위로 담는다. 광천원동시장을 찾는 방문객이나 지역 상권을 보는 분석가가 "이 시장에 어떤 업종 상점이 있고, 온누리상품권 사용이나 배달이 되는 곳은 어디인가" 같은 질문에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시장명·주소 같은 이름 매칭이나 위경도 좌표로만 붙여 쓴다.
