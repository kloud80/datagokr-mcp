summary_user: 주택분양보증을 받아 분양한 민간 신규아파트의 분양가격지수를 월(시점)·주택 규모별로 전국과 17개 시도 열에 담은 집계표로, 2014년 평균 분양가격을 100으로 환산한 값이다. 분석가가 "최근 몇 년간 특정 시도의 민간아파트 분양가가 기준연도 대비 얼마나 올랐나" 같은 지역별 추세나 분양 인기도를 가늠하는 질문에 쓴다. 전역 조인 키가 없어 시점(월)과 시도 이름을 맞춰 다른 주택가격 지수·미분양 통계 등과 이름 매핑으로 이어 쓴다.
description_portal: '주택분양보증을 받아 분양한 전체 민간 신규아파트 분양가격지수 자료를 제공합니다.*주택분양보증은 주택법 제15조에 의하여 사업계획승인을 얻어 건설하는 주택사업 중 일반에게 분양하는 주택이 30세대 이상인 경우 의무적으로 가입하는 보증*월별 분양가격지수는 기준시점인 2014년 평균 분양가격을 100인 수치로 환산하여 산출한 값을 의미함*분양가격지수 절대수치를 이용하여 지역 간 분양가격을 직접 비교하는 것은 불가*지역 간 가격비교는 불가하나, 지역 간 민간아파트 분양 인기도를 가늠하는 하나의 척도로 이용 가능해당 데이터는 주택도시보증공사 홈페이지 및 통계청 KOSIS에서도 확인가능하오니 참고하시기 바랍니다.※ 2025.12월 공표일부터 국가승인통계 변경승인 내용(분양가격지수 삭제)을 반영하여 공표하니 참고하시기 바랍니다. 변경사항 및 사유 - 분양가격지수 삭제(신뢰도 저하) 참고: 국가데이터처 고시 제 2025-91호'
