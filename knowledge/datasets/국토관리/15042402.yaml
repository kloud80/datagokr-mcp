summary_user: 경기도 광주시 공간정보시스템에 등록된 업소를 한 건씩 담은 파일로, 업소명·읍면동·도로명주소로 광주시 안 개별 사업장의 위치를 보여준다. 분석가나 창업 예정자가 "광주시 어느 읍면동에 업소가 몰려 있는가" 같은 사업장 분포·상권 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동 이름이나 도로명주소를 매칭하거나 주소를 좌표로 바꿔 연결한다.
description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 업소의 위치 정보를 제공합니다. 광주시 내 각종 사업장과 상업시설의 기본 정보를 담고 있어 지역 경제 분석과 공간 계획에 활용됩니다. 업소명은 사업장의 명칭이며, 읍면동명은 업소가 위치한 행정구역을 나타냅니다. 도로명주소는 업소의 정확한 위치를 제공하여 방문과 배송 등에 활용할 수 있습니다. 본 데이터는 상권 분석, 지역 경제 현황 파악, 사업장 분포 조사, 공간 정보 시스템 구축, 생활 편의 정보 제공 등에 활용되며 지역 경제 활성화와 시민 편의 서비스를 지원합니다.
