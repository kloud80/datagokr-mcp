summary_user: 경기도 이천시 안에 있는 장례식장을 시설 한 곳당 한 행으로 담은 파일(csv, 약 714바이트)로, 시설명·시설유형·도로명/지번 주소·관리기관명·연락처를 담는다. 시민이 "이천시에서 가까운 장례식장이 어디이고 어디로 문의하나"를 확인하거나, 분석가가 시 단위 장례 인프라 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 같은 기관(이천시) 기준으로만 이어 쓴다.
description_portal: 경기도 이천시 내 장례식장의 현황 정보를 제공하는 데이터입니다. 시설명, 시설유형, 도로명주소 및 지번주소, 연락처, 관리기관명 등의 항목으로 구성되어 있으며, 장례식장의 위치, 운영 주체, 용도 등을 확인할 수 있습니다. 시민들은 이를 통해 가까운 장례식장의 위치를 쉽게 확인하고 이용 문의가 가능하며, 행정기관은 공공보건계획, 응급상황 대응체계 마련, 지역 기반 장례 인프라 분석 등의 기초자료로 활용할 수 있습니다. 주소는 도로명과 지번 두 형식으로 병기되어 공간정보 분석에도 활용이 가능합니다.
