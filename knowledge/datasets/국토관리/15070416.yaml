summary_user: 진안군 상하수도요금관리시스템에 등록된 요율표로, 자원구분(상수도·하수도 등)과 업종별로 기본요금 부과 여부·기본요금, 최대 8단계 누진 구간의 시작·종료 사용량과 단계별 요금, 적용 시작·종료일자와 현재 적용 여부를 행 단위로 담는 소규모 CSV 파일(약 7.7KB)이다. 진안군 주민이나 사업자가 '우리 업종은 한 달에 몇 톤을 쓰면 수도·하수도 요금이 얼마인가'를 계산하거나, 분석가가 다른 지자체와 업종별 누진 요율을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종명·자원구분명 같은 이름 매핑이나 같은 기관(진안군) 기준으로만 이어 쓴다.
limits: 요율 기준표일 뿐 실제 가구·업소별 사용량이나 부과액은 담지 않는다. 범위는 진안군 한 곳이고 공간 정보가 없으며, 표준 코드 같은 공통 키가 없어 타 지자체 요율과 비교할 때는 업종명을 직접 맞춰야 한다.
