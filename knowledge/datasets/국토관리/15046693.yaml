description_portal: '○ 통계개요* 통계명 : 하수처리 현황* 통계종류 : 서울시 하수처리 능력을 인구기준으로 산정하여 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 하수관련 현황을 조사ㆍ분석하여 시설의 적정 설치 및 관리를 위한정책수립의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 및 자치구 → 시도 → 환경부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당시설 및 자치구내용 - 서울시 하수처리 대상인구 및 처리(물리적ㆍ생물학적ㆍ고도)인구, 보급율 등○ 용어설명* 비처리인구 : 관공서 하수처리장이 아닌 개인배수설비 또는 인근 타 시도에서처리하는 인구* 하수처리인구 : 공공하수도(마을하수도 포함) 처리구역 내에 거주하는 인구. 하수처리장이 설치된 지역이나 또는 관할 행정구역내에 처리장은 없지만 타지역에설치된 처리장으로 유입. 처리되는 경우의 처리인구- 물리적(1차) : 침전만 시키는 수준- 생물학적(2차) : 약품처리- 고도(3차) : 질소, 인을 뽑아내어 방류수질을 높여주는 것'
