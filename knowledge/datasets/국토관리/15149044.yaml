summary_user: 경상북도 봉화군에 등록된 제조업체를 업체 한 곳당 한 행으로 정리한 명부로, 업체명·주력 업종·산업분류코드·사업장 주소·전화·팩스·직원 수를 담는다(약 15KB 분량의 CSV 파일). 봉화군 안에 어떤 업종의 제조업체가 어디에 몇 명 규모로 있는지 파악하려는 지역 산업정책 담당자나 거래처·협력업체를 찾는 사업자가 쓴다. 실측 컬럼에 사업자번호나 필지번호 같은 전역 조인 키가 없어서, 다른 데이터와는 산업분류코드(KSIC)로 업종 통계와 맞추거나 업체명·주소를 매핑해 이어 쓴다.
description_portal: '이 데이터는 지역 내 등록된 제조업체의 기본 현황을 정리한 자료로, 업체명, 업종 구분, 산업분류코드, 소재지, 전화·팩스 번호, 직원 수 등의 정보를 포함하고 있습니다. 복합비료 제조, 콘크리트 제품, 목재 가공, 금속 구조물 등 다양한 제조업 분야의 사업체가 포함되어 있으며, 산업별 분포, 인력 규모, 입지 현황 등을 파악하고 제조업 정책 수립 및 기업지원 계획 수립 등에 활용될 수 있습니다. 일부 업체의 전화번호·팩스번호는 개인정보 보호를 위해 비공개 처리되었으며, 본 데이터는 총 9개 항목으로 구성되어 있고, 기준일은 2025년 9월 10일입니다.순번: 데이터에 기록된 업체의 일련번호입니다.업체명: 사업체의 등록된 공식 명칭입니다.업종구분: 사업체의 주력 제조 품목 또는 업종 내용입니다.산업분류코드: 해당 업종에 부여된 표준 산업분류 코드입니다.소재지 주소: 제조업체의 사업장 주소입니다.전화번호: 업체의 대표 전화번호입니다. (일부는 비공개)팩스번호: 업체의 팩스 번호입니다. (일부는 비공개)직원 수(명): 해당 제조업체에 재직 중인 총 직원 수입니다.비고: 기타 정보 및 비공개 사유가 기재된 항목입니다.'
