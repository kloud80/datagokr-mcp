description_portal: '이 데이터는 지방상수도 급수공사를 지자체 대신 수행하는 대행 업체 명부를 표준화해 제공하는 자료입니다. 업체 식별(연번·업체명), 연락(주소·전화번호), 그리고 대행 계약의 효력 범위를 나타내는 계약기간으로 구성되어 있어 민원·설치·이설·수선 등 급수공사 처리 시 신속한 배정과 안내에 활용됩니다. 특히 주소 필드는 권역별 분포 파악·지도 시각화·현장 출동 동선 수립에 유용하며, 계약기간은 행정 점검(갱신·만료·재지정)과 부정 시공 예방, 업체 성과 관리의 기준으로 쓰입니다. 본 명부는 대행업체 변경 시 갱신되는 운영성 데이터이므로, 정기 점검과 주소·연락처 정합성 검증과 함께 활용하는 것이 좋습니다.-연번: 데이터 내 업체 식별을 위한 일련번호입니다.-업체명: 급수공사 대행으로 지정된 사업체의 상호입니다.-주소: 사업장(사무소) 소재지의 도로명 주소입니다.-전화번호: 민원·공사 문의를 위한 대표 연락처입니다.-계약기간: 대행 지정의 유효 기간(시작~종료)을 나타냅니다.'
