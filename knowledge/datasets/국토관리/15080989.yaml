summary_user: LH가 건설·공급한 전국 아파트 단지와 LH가 매입해 전세로 재공급하는 아파트 단지를 단지 단위로 담은 파일 데이터로, 6,217행이 있고 지역본부·세대수·동수·임대유형·준공일 등을 포함한다. 임대주택 입주를 알아보는 국민이나 공공임대 단지 분포를 분석하는 사람이 특정 지역에 LH 단지가 몇 세대 규모로 있는지 확인하는 데 쓴다. 단지코드(apt_complex_cd)와 주소(address)를 키로 삼아 전월세 실거래나 공동주택 관련 데이터와 이어 쓴다.
description_portal: 본 데이터는 한국토지주택공사에서 건설하여 공급하는 전국의 아파트 형태의 공공주택 단지 정보와 민간이 건설한 아파트를 한국토지주택공사가 매입하여 전세로 재공급하는 아파트 단지에 대한 정보를 제공합니다. 여기에는 임대주택 단지와 임대주택과 분양주택이 혼합된 단지가 모두 포함됩니다. 제공되는 데이터는 지역본부, 단지코드, 단지명, 세대수, 동수, 임대유형, 주택유형, 주소, 준공일, 입주지정시작일, 입주지정종료일이 있습니다. 준공된 지 오래된 단지의 경우에는 주소, 준공일, 입주지정시작일, 입주지정종료일 데이터가 없을 수 있으니 이용에 참고하시기 바랍니다.
