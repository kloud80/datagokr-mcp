summary_user: 제주 어영소공원~용두암 해안도로의 '비행기 이·착륙 포토스팟' 주변 음식점·카페·편의점·숙박·관광지를 시설 한 곳당 한 행으로 담고, 포토스팟과의 거리, 주소, 전화번호, 휠체어 진입 여부, 장애인화장실 여부를 함께 적은 목록이다. 휠체어 이용자나 노약자·영유아 동반 가족이 '포토스팟 근처에서 휠체어로 들어갈 수 있고 장애인화장실이 있는 식당이나 숙소가 어디인가'를 찾을 때 쓰고, 무장애 관광지도 제작이나 접근성 개선 검토에도 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설 명칭이나 주소를 직접 맞춰서만 연결할 수 있다.
description_portal: '"제주특별자치도 내 어영소공원~용두암(비행기이착륙포토스팟)_무장애주변관광지 데이터를 제공합니다.* 제주특별자치도 어영소공원과 용두암 인근 해안도로에 위치한 ‘비행기 이·착륙 포토스팟’ 구간을 중심으로, 장애인·노약자·영유아 동반 가족 등 관광약자의 무장애 여행을 위한 주변 관광시설 정보를 체계적으로 정리한 통계자료입니다. 본 자료에는 음식점, 카페 및 편의점, 숙박시설, 주요 관광지 등 다양한 유형의 시설에 대해 명칭, 거리, 주소, 전화번호, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등의 접근성 정보를 제공하고 있어, 이동 및 이용에 제약이 있는 관광약자의 방문 여건을 객관적으로 파악할 수 있습니다. 또한 이 정보는 무장애 관광 지도 제작, 관광서비스 접근성 개선 및 지역 관광정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
