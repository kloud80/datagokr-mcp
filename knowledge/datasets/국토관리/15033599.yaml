summary_user: 경기도 오산시 관내 공장등록 기업체를 업체별로 한 행씩 담은 파일(csv, 약 58KB)로, 회사명·입주 산업단지명·대표주소·업종명·생산품·데이터기준일자를 수록한다. 오산시에 어떤 업종의 제조업체가 어느 산업단지에 모여 있는지, 특정 생산품을 만드는 지역 업체가 어디인지 찾는 기업유치·산업정책 담당자나 거래처를 찾는 사업자가 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어 다른 데이터와는 회사명·주소 문자열이나 산업단지명 매칭으로만 이어 쓰며, 팩토리온 공장등록 정보와 대조할 때도 이름·주소 기준으로 맞춰야 한다.
limits: 사업자번호·KSIC 코드·PNU가 없어 기업·토지 데이터와 정확한 키 조인이 안 되고, 회사명·주소 매칭에 의존해야 한다. 범위는 오산시 한 곳에 한정되어 다른 시군구와 비교하려면 별도 데이터가 필요하다.
