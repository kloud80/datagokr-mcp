description_portal: '한국토지주택공사 홈페이지 내 공급 관련 선납할인율, 할부이자율, 지연손해금율 등 현황에 관한 데이터를 제공합니다.  이를 통해 수요자는 공급 관련 금융 조건을 사전에 파악하고, 자금 계획을 수립하는 데 활용할 수 있습니다.지연손해금 : 지연손해금은 금전채무를 불이행하여 발생하는 지연배상금입니다.할부이자율 : 할부 결제 시 부과되는 수수료율입니다.선납할인율 : 대금을 약정일보다 미리 납부할 때, 미리 낸 일수만큼 할인해주는 금액을 계산하는데 적용되는 할인율입니다.한국토지택공사는 자료 변경 발생시에 "공급 관련 이자율 현황 "을 갱신하여 제공하고 있습니다.'
