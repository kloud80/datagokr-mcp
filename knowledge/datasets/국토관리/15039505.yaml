summary_user: 인천광역시 연수구 안의 봉안당(납골당)을 시설 한 곳당 한 행으로, 연도별 명칭·주소·위도·경도·관리주체·전화번호·설치년도·기봉안구수·안치가능기수를 담은 소규모 파일(csv 925바이트)이다. 연수구 주민이 가까운 봉안당 위치와 남은 안치 여력을 확인하거나, 분석가가 구 내 봉안시설의 수용 규모를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설 명칭·주소로 맞추거나 위도·경도 좌표로 지도 위에 겹쳐 쓴다.
description_portal: 본 자료는 인천광역시 연수구 내 봉안당(납골당)의 현황을 종합적으로 제공하는 데이터로, 연도별로 각 봉안당의 명칭, 주소, 위도·경도 좌표, 전화번호, 관리주체, 설치년도, 기존 봉안기 수(기봉안구수), 현재 안치 가능한 기수(안치가능기수) 등의 정보를 포함하고 있습니다. 이를 통해 연수구 지역 내 봉안시설의 위치를 확인하고, 운영 현황이나 수용 가능 규모 등을 파악할 수 있어 시민, 연구자, 정책 입안자, 장사시설 관련 종사자 등 다양한 수요자들이 효율적으로 활용할 수 있습니다. 예를 들어 시민들은 가까운 봉안당 위치나 안치 가능 여부를 확인할 수 있고, 행정기관은 장사시설 정책 수립 및 자원 배분 등에 활용할 수 있습니다. 또한 위도·경도 정보는 GIS 기반 분석이나 위치 기반 서비스에 유용하게 활용될 수 있습니다.
