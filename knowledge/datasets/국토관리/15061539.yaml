summary_user: 경기주택도시공사가 공급하는 경기도 행복주택을 사업지구 단위로 정리한 현황 자료로, 사업지구명·위치·공급세대수·준공일자·유형·데이터기준일자를 담는다. 청년·신혼부부나 주거정책 분석가가 "우리 시군 근처 어느 지구에 행복주택이 몇 세대, 언제 준공됐나"를 확인하거나 지역별 공공임대 공급 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 주택 공급·청약 데이터와는 사업지구명이나 위치(주소) 문자열을 매핑해 이어야 한다.
description_portal: 이 데이터는 경기주택도시공사에서 공급하는 경기도 행복주택 현황을 기록한 자료로, 각 사업지구별 행복주택의 공급 및 운영 현황을 제공합니다. 경기행복주택이란 대학생, 청년, 신혼부부등 청년 주거비 부담 경감을 위해 대중교통이 편리하여 직주근접이 가능한 부지를 활용하여 저렴하게 공급하는 주택으로서 경기도형 행복주택이 지어지는 곳에는 다양한 편의시설 및 주민공동시설이 함께 제공됩니다.주요 항목으로는 사업지구명, 위치정보, 공급세대수, 준공일자, 유형, 데이터기준일자 등이 포함되어 있으며, 이를 통해 행복주택의 공급규모, 위치, 준공 시점 및 공급유형을 파악할 수 있습니다. 본 데이터는 공공임대주택 정책 수립, 청년·신혼부부·사회초년생 등 주거지원 대상자 선정, 주거복지 계획 수립, 주택공급 실적 평가, 지역별 주택수급 분석 등 다양한 행정·정책적 목적으로 활용됩니다. 특히 공급세대수 및 유형별 구분을 통해 주거복지 수요에 따른 행복주택 공급 현황을 종합적으로 파악할 수 있습니다.
