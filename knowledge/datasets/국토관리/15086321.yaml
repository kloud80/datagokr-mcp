description_portal: 한강홍수통제소에서 홍수예측 등에 활용하기 위해 사용하는 수리모형조도계수정보입니다. 예보유역명, 적용시작/종료일자 단면 명칭  데이터를 제공합니다.홍수예보시스템에서 수리학적모형으로는 FLDWAV 모형을 사용중입니다.FLDWAV(Flood Wave) 모형에서 조도계수(Roughness Coefficient, Manning's n)는 물이 흐를 때 하천 바닥이나 벽면과의 마찰로 인해 발생하는 에너지 손실(저항)을 수치화한 매개변수입니다.FLDWAV는 댐 붕괴나 돌발 홍수 같은 부정류(Unsteady Flow)를 해석하는 모형이기 때문에, 이 조도계수가 수위와 유량 계산의 정확도를 결정하는 매우 중요한 요소입니다.여기서는 유량, 조도계수로 구성됩니다.
