summary_user: 건축 인허가 대장 단위로 대지위치·지번, 대지·건축·연면적, 건폐율·용적률, 주용도, 세대·호·가구수, 주차수와 건축허가일·착공예정일·실제착공일·사용승인일 같은 인허가 속성을 전국 범위의 필지·건물 단위로 담는다. 분석가가 특정 시군구에서 최근 건축허가와 착공이 얼마나 늘었는지 보고 지역 개발 흐름의 선행 지표로 삼는 질문에 쓴다. 시군구코드(sigunguCd)와 법정동코드·번·지로 건축물대장 등 다른 필지·건물 데이터와 잇고, 관리허가대장PK로 같은 서비스의 동별·층별 개요와 연결한다.
description_portal: 건축인허가 정보에서 기본개요, 동별개요, 층별개요, 호별개요, 대수선, 전유공용면적, 공작물관리대장, 철거멸실관리대장, 가설건축물, 오수정화시설, 주차장, 부설주차장, 호별전유공용면적, 지역지구구역, 도로명대장, 대지위치, 주택유형 등 속성정보를 제공합니다.기존 ‘건축데이터 민간개방시스템’에서 제공하던 유형별 건축데이터 정보를 ‘건축서비스산업 정보체계(건축HUB)’에서 서비스 제공함에 따라 건축데이터 PK가 변경이 되었습니다.이에 따른 기존 건축데이터 PK 전환 규칙을 첨부파일로 제공해 드리오니 참고하여 주시기 바랍니다.
