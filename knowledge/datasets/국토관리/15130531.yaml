description_portal: 대구광역시 상수도사업본부의 고산, 매곡, 문산정수장에 대해 2010년 1월 1일부터 2014년 12월 31일까지 견학신청 접수된 내역에 대해 구군, 읍면동, 신청일자 및 견학일자를 제공합니다. 정수장 견학 신청은 일반적으로 정수장의 운영 주체(지자체 또는 수도사업소 등)에서 제공하는 프로그램으로, 시민들이 정수 처리 과정을 직접 보고 물의 소중함을 체험할 수 있도록 마련된 교육 프로그램입니다. 정수장 견학은 시민들이 수돗물이 만들어지는 과정을 직접 체험하고 물의 소중함을 느끼도록 하는 환경교육 프로그램입니다. 목록에 포함된 정수장은 매곡정수사업소, 고산정수사업소, 문산정수사업소가 있습니다.
