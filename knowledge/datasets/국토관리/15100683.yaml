summary_user: 부산진구에 등록된 제조업(표준산업분류 대분류 C) 공장을 한 행에 한 곳씩 담은 등록 현황 파일로, 공장관리번호·회사명·도로명주소·업종명·주생산품·고용인원·외국인 근로자 수·공장등록일자 등을 담는다. 지역 산업 분석가나 구청 담당자가 '부산진구에 어떤 업종의 제조공장이 어디에 몇 명 규모로 있는가'를 파악하거나 산업단지별 입주 현황을 볼 때 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어, 다른 데이터와는 회사명·도로명주소·업종명 같은 이름 매칭이나 공장관리번호를 통한 같은 체계 대조로만 잇는다.
limits: 전역 조인 키가 없어 기업·토지 데이터와 정확히 연결하려면 이름·주소 매칭이 필요하다. 범위는 부산진구 한 곳의 등록 공장에 한정되며, 용지 분양·임대나 산단 개발 정보는 담지 않는다.
