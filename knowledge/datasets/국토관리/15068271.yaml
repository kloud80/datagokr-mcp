summary_user: 경상북도 내 태양광 전기사업 허가를 발전소 한 건씩 담은 파일로, 처리현황·허가년도·허가일자·설치장소·용량(kW)·면적·발전사업 개시일을 포함한다(CSV 약 32KB). 지역 주민이나 분석가가 "우리 시군에 허가된 태양광 발전소가 어디에 얼마나 있고, 실제 발전을 시작했는가"를 확인하거나 도내 신재생에너지 보급 현황을 파악하는 데 쓴다. 전역 조인 키(행정구역 코드·사업자번호 등)가 없어 다른 데이터와는 설치장소 주소나 발전소명을 문자열로 맞춰 이어야 한다.
limits: 표준 행정코드나 고유 식별자가 없어 다른 허가·발전량 데이터와 정확히 결합하기 어렵고, 주소·발전소명 매칭에 의존해야 한다. 범위는 경상북도에 한정되며 태양광 외 발전원은 담지 않는다.
