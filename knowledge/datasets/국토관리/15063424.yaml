summary_user: 전국 법정동(법률로 지정된 행정구역)의 코드와 시도·시군구·읍면동·리 명칭, 생성일자를 한 행씩 담은 CSV 파일로, 전체 20,561행이다. 주소나 지역 단위로 데이터를 묶어 보려는 분석가나 사업자가 법정동코드로 지역명을 확인하거나 지역 목록을 만드는 데 쓴다. 법정동코드(bjd_cd)를 조인 키로 삼아 같은 코드를 쓰는 다른 지역 단위 데이터와 이어 쓰며, 별도 코드표는 없다.
description_portal: '대한민국의 법률로 지정된 일정한 명칭과 영역을 지닌 행정구역으로, 국가공간정보통합플랫폼(K-GeoP)의 토지행정 서비스에서  사용하는 법정동(코드, 명칭 등) 데이터임.전남광주통합특별시 출범에 따라 데이터 갱신 및 현행화- 법정동코드 : 법률을 기반으로 대한민국의 행정구역으로 지정된 지역 코드- 시도명 : 대한민국의 시도 명칭- 시군구명 : 대한민국의 시군구 명칭- 읍면도명 : 대한민국의 읍면동 명칭(명칭이 없을 경우 공백 혹은 NULL 발생)- 리명 : 대한민국의 리 명칭(명칭이 없을 경우 공백 혹은 NULL 발생)- 생성일자 : 법정동이 생성된 일자(YYYY-MM-DD)'
