summary_user: 경기도 이천시 도시계획시설(도로·공원·녹지 등 기반시설)의 결정·변경 내용을 시설 결정조서 건별로 담은 파일로, 도면번호·시설명·위치명, 변경 후 면적·연장, 폭원, 기점·종점이 들어 있다. 이천시 도시계획 담당자나 개발사업자가 특정 도로·공원 시설이 어디에 어떤 규모로 결정돼 있고 면적·선형이 어떻게 바뀌었는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도면번호·위치명 같은 이름 매칭이나 같은 기관(이천시) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 도시계획시설의 결정 및 변경 내용을 기록한 결정조서 자료로, 조사관리코드, 도면번호, 시설명(지역명), 위치명, 면적 및 선형 변경 여부, 규모, 기점·종점 좌표, 시스템 생성일시 등의 항목으로 구성되어 있습니다. 도시계획도로, 공원, 녹지, 기반시설 등 다양한 도시계획시설에 대해 공간적 위치와 행정적 결정 내역을 체계적으로 관리할 수 있도록 제공됩니다. 특히 선형·면적 변경 정보는 사업 추진 시 행정계획의 변경 이력을 확인하는 데 필수적이며, 위치명 및 도면번호는 GIS 도면과 연계한 시설 위치 추적에 활용됩니다. 본 데이터는 도시계획 수립, 시설 정비, 인허가 검토, 도시개발사업 관리 등 다양한 공간계획 행정업무에서 기초자료로 사용될 수 있습니다.
