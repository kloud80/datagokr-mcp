description_portal: '- 광양만권경제자유구역청 관리 산업단지 내 각 산단별 입주기업 현황(산단명, 회사명, 공장소재지, 부지면적 등)에 대한 정보를 제공합니다.- 광양만권경제자유구역청(GFEZ)은 전라남도 광양시와 여수시, 순천시, 고흥군, 구례군, 보성군, 화순군 등 전라남도 광양만권에 걸쳐 조성된 경제자유구역을 관리·운영하는 기관입니다. 이 지역은 산업, 물류, 관광, 바이오, 에너지 등 다양한 분야의 융합 산업 중심지로 발전하고 있습니다.- 주요 기능 및 역할- 투자유치 및 기업지원: 입주 기업에 대한 다양한 지원 시책을 통해 지역 경제 활성화를 도모합니다.- 산업단지 개발 및 관리: 산업단지의 개발, 운영, 관리 등을 통해 효율적인 산업 환경을 조성합니다.- 행정 서비스 제공: 입주 기업 및 주민들에게 필요한 행정 서비스를 제공합니다.- 홍보 및 국제 교류: E-홍보관 운영, 해외 투자유치 활동 등을 통해 광양만권경제자유구역의 이미지를 제고합니다.'
