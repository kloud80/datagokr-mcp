summary_user: 지방자치단체가 구축하고 국토교통부가 취합한 도시관리계획상 문화예술진흥 용도지구의 구역 정보를 시도별 공간파일(SHP)로 담는 전국 범위의 원천 자료다. 토지 소유자나 개발 사업자, 도시계획 분석가가 특정 지역이 문화예술진흥 용도지구로 지정돼 있는지, 언제 고시됐는지(NTFDATE) 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 행정구역 이름·코드 매핑(COL_ADM_SE 등)이나 같은 기관 코드로만 이어 쓴다.
limits: 포털 활용신청과 별개로 vworld.kr에 로그인해 시도별 파일을 내려받아야 하며 API 호출 방식이 아니다. 전역 조인 키가 없어 필지·건축물 데이터와 바로 결합하려면 공간 연산이나 행정코드 매핑이 따로 필요하다.
