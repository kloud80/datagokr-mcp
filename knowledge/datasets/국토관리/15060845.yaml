summary_user: 인천 미추홀구 관내 분뇨수집·운반 허가업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·도로명주소·전화번호와 위도·경도를 포함한다(포털 설명 기준 15개 업체). 주민이 정화조 청소나 분뇨 수거를 맡길 때 "우리 구에서 허가받은 업체가 어디이고 연락처는 무엇인가"를 확인하는 데 쓰고, 구청은 민원 대응이나 지도점검 대상을 확인하는 데 쓴다. 전역 조인 키는 없어서 업체명이나 주소로 다른 데이터와 맞추거나, 위도·경도로 지도·공간 데이터에 겹쳐 쓴다.
limits: 사업자등록번호 같은 공통 식별 코드가 없어 다른 기관 데이터와 정확히 연결하기 어렵고, 업체명·주소 매칭에 의존해야 한다. 범위는 미추홀구 한 곳뿐이어서 인천시 전체나 다른 구의 업체 현황은 이 파일로 알 수 없다.
