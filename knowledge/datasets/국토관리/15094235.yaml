description_portal: '서울특별시 서초구_분뇨수집운반업 인허가 정보에 대해 인허가 일자, 영업상태, 폐업 일자, 전화번호, 주소, 사업장명에 대한 정보를 제공합니다. 분뇨를 수집(개인하수처리시설 및 분류식 하수관로 중 오수가 흐르는 하구관로의 내부청소 포함)·운반하는 영업(이하 분뇨수집 운반업이라 한다)을 하려는 자는  대통령령으로 정하는 기준에 따른 시설 장비 기술인력 등의 요건을 갖추어 서초구청의 허가를 받아야 하며, 허가의 신청을 하기 전에 환경부령으로 정하는 바에 따라 사업계획서를 서초구청에 제출하여 허가의 적합 여부를 미리 검토하여 줄 것을 요청할 수 있습니다. 서초구청은 제출 받은 사업계획서를 검토하여 요청 받은 날로부터 1개월 이내에 그 허가의 적합 여부를 통보하여야 합니다. 분뇨를 효율적으로 수집·운반하기 위하여 필요한 경우에는 대통령령으로 정하는 바에 따라 영업구역을 정하거나 필요한 조건을 붙일 수 있습니다. 분뇨수집·운반업자는 해당 지방자치단체의 조례로 정하는 기준을 초과하여 수수료를 받아서는 아니 됩니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
