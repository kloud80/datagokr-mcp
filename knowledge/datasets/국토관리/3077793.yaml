summary_user: 용산구가 보유한 수방용 배수펌프(수중펌프·엔진 양수기)를 품명·보관장소별로 마력과 대수로 정리한 작은 현황 파일(csv 약 360바이트)이다. 집중호우 때 침수 피해를 입은 주민이 가까운 동주민센터나 펌프장에서 어떤 펌프를 빌릴 수 있는지 확인하거나, 구의 수방장비 확보 수준을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 보관장소 이름이나 같은 기관 기준으로만 맞춰 쓴다.
description_portal: 현재 용산구 보유 수방장비 배수펌프(양수기)는 수방 기간 침수 등의 재해 등에 사용하는 기계로써, 물을 퍼올리는 역할을 합니다.배수펌프(양수기)는 물속에 잠긴 상태로 작동하는 수중펌프와 전기가 없는 곳에서도 사용가능한 엔진펌프로 구성되어 있습니다.현재 용산구 보유 수중펌프는 455대(0.5마력 367대, 1마력 88대)이고, 양수기106대(5마력 96대, 13마력 3대, 15마력 7대)입니다. [2025년 8월 기준]수중펌프와 양수기는 동주민센터, 원효펌프장(원효로 138-11), 보광펌프장(서빙고로 375)에서 대여 가능합니다.
