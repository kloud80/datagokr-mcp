description_portal: 대구광역시 상수도사업본부에서 운영중인 상수도사업본부 홈페이지의 사이버민원센터를 구성하고 있는 세부 메뉴 목록을 포함하고 있습니다. 대구광역시 상수도사업본부 사이버민원센터는 시민들이 상수도 관련 업무를 온라인으로 간편하게 처리할 수 있도록 제공되는 종합 민원 서비스 플랫폼이며,  수돗물 사용에 따른 다양한 행정 절차를 비대면으로 지원하여, 시간과 장소에 구애받지 않고 필요한 서비스를 이용할 수 있도록 돕고 있습니다. 또한 요금조회, 자동이체신청, 수질검사 신청, 요금감면신정, 옥내누수탐사신청 등 다양한 민원을 신청할수 있어, 시민들은 상수도 관련 업무를 보다 편리하게 처리할 수 있습니다
