summary_user: 전북개발공사가 추진하는 사업지구별 토지 분양·미분양 필지의 공급유형 정보를 필지 단위로 담는 API로, 필지별 지번·토지명·소유자·공급방법·공급용도·면적 등을 제공한다. 공공택지나 산업용지 매입을 검토하는 사업자가 '전북개발공사 사업지구에서 어떤 용도의 필지가 어떤 방식으로 공급되는가'를 확인하거나, 분석가가 지구별 미분양 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지번·토지명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 표준 행정코드나 필지 고유번호 같은 전역 조인 키가 없어 다른 토지·부동산 데이터와 자동으로 연결하기 어렵다. 필드 명세에 의미 설명이 비어 있어 확인 관련 항목(confirmmain, confirmsub) 등은 실제 응답을 보고 해석해야 한다.
