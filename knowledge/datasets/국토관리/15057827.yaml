description_portal: 전북개발공사에서 추진하는 사업지구별 토지 분양  및 미분양 필지의 공급유형 정보를 조회할 수 있는 서비스입니다.이 서비스는 토지의 면적, 용도, 평가금액, 계약금액 등 주요 정보를 제공합니다. 이를 통해 사용자는 사업지구별 분양현황을 세부적으로 확인하고 토지 계약의 진행 단계 및 납부 현황을 파악할 수 있습니다.본 데이터는 토지 분양 관리, 미분양 현황 분석, 사업지구별 분양 정책 수립 등 행정 업무에 활용될 수 있으며 부동산 시장 분석 및 공공분양 효율화 연구에도 기초자료로 활용이 가능합니다.
