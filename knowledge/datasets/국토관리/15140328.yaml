summary_user: 대전광역시 중구 관내에서 사용승인을 받은 건축물을 한 건씩 담은 파일로, 대지위치·주용도·건축구분·대지면적·건축면적·연면적·구조·지상/지하 층수와 허가신고일·착공처리일·사용승인일을 함께 싣는다. 중구에서 어떤 용도(공동주택, 근린생활시설, 업무시설 등)의 건물이 언제 얼마나 준공됐는지 확인하려는 주민·사업자·지역 개발 분석가가 쓴다. 전역 조인 키(건축물대장 관리번호, 법정동코드 등)가 없어 다른 데이터와는 대지위치 주소 문자열을 맞추거나 같은 기관 자료끼리 이어 써야 한다.
description_portal: 본 공공데이터는 대전광역시 중구 관내 사용승인 건축물의 용도별 분류 현황에 대한 데이터로 대지위치주소, 주용도, 사용승인일자 등의 항목을 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 주용도는 공동주택, 주택, 노유자시설, 단독주택, 문화및집회시설, 방송통신시설, 업무시설, 의료시설, 자동차관련시설, 근린생활시설 등으로 구분되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
