summary_user: 한국토지주택공사가 조성 중인 하남교산 지구의 토지이용계획을 용도별(공원녹지, 공동주택, 도로, 도시지원시설 등) 면적(제곱미터)과 구성비(퍼센트)로 정리한 소규모 집계표(CSV 약 1.5KB)를 담는다. 하남교산 신도시에 공원·아파트·자족시설 용지가 각각 얼마나 배정됐는지 확인하려는 주민·사업자·도시계획 분석가가 지구 용도 구성 파악에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지구명·용도명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 한국토지주택공사에서 개발 조성중인 하남교산 지구 토지이용계획표로 전체 토지이용계획의 면적, 구성비 및 주택건설용지, 단독주택, 공동주택등 부분별 면적, 구성비 정보 제공합니다. 토지이용계획표는 특정 토지의 이용 목적과 규제 사항을 한눈에 확인할 수 있도록 표 형태로 정리한 정보입니다. 면적의 단위는 미터제곱으로 총 면적은 6,465,595 입니다. 공원녹지 공원 1,452,127 (23%), 공동주택 아파트 1,140,790 (18.1%), 도로 1,013,335 (16%), 도시지원시설 자족시설 682,073 (10.8%) 입니다.
