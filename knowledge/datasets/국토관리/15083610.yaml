summary_user: 서울 안에서 특정 시점에 특정 지역에 머무는 내국인·장기체류 외국인 수를 기준일·시간대·행정동·집계구 단위로 집계한 생활인구 데이터로, 총생활인구와 남녀 5세 단위 연령대별 인구, 장기체류외국인수를 담는다. 상권 분석가나 자치구 담당자가 '평일 오후 이 행정동에 어떤 성별·연령대 사람이 얼마나 머무는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 확인되지 않아, 다른 데이터와는 행정동코드(ADSTRD_CODE_SE)·집계구코드를 이름·코드 매핑으로 맞춰 연결해야 한다.
description_portal: '서울특별시 관내 지역에서 거주하며, 통근/통학, 쇼핑. 관광 등 특정시점에 서울의 특정 지역에 존재하는 내국인과 장기 체류 외국인 정보를 제공합니다. ※ 개인정보 비 식별화를 위하여 ‘3명’ 이하인 경우 “ * ” 처리※ Sheet와 OpenAPI는 5일전 당일자료만 제공합니다.2018년~2024년 월별 자료는 파일내려받기 탭을 통해서 별도로 다운로드 받을 수 있습니다.- 주요내용 : 기준일ID, 시간대구분, 행정동코드, 집계구코드, 총생활인구수, 남/여 연령대별 생활인구수, 장기체류외국인수*갱신주기 : 매일제공부서는 서울특별시 디지털도시국 데이터전략과(02-2133-4273)입니다."해당 데이터의 원본시스템은 "빅데이터 분석 활용시스템 입니다."※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
