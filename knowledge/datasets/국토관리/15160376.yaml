summary_user: LH 건설임대 공고별로 단지·공급유형·신청유형 단위의 당첨 합격점수(커트라인)를 담는다. 함께 담는 항목은 기본 임대보증금·월임대료, 경쟁률, 공급호수, 신청자수이며 전국 범위이다. 공공임대 청약을 준비하는 사람이 "우리 시군구 국민임대 단지는 지난 공고에서 몇 점이 커트라인이었고 경쟁률은 얼마였나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 단지명·시도·시군구 이름 매핑이나 같은 기관(LH) 코드로만 잇는다. 필수 파라미터(CNP_NM)는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 한국토지주택공사(LH)에서 제공하는 공공임대주택 유형 중 건설임대 당첨자 합격 점수(커트라인) 조회 서비스입니다.□(주요내용) 공고명, 단지명, 시군구명, 시도명, 모집공고일을 기준으로 공고명, 공급유형, 단지명, 시도명, 시군구명, 추첨형명, 기본 임대보증금, 기본 월임대료, 당첨합격점수내용, 경쟁률, 신청유형명, 공급호수, 신청자수 등의 정보를 조회하는 기능□(조회 범위) 조회일 기준 최대 5년 범위 내의 데이터 조회 가능,  한번 조회 시 최대 1년 범위 데이터 조회 가능□ API 응답 파라미터 설명 ㅇ (커트라인) 공공임대 당첨자 선정 기준에는 정량적 기준(배점) 외에 정성적 기준도 존재하여 텍스트 형태로 커트라인 제공.    - 공급호수가 5호 미만일 경우에는 커트라인 데이터를 통해 소득 등이 특정될 수 있으므로 커트라인 데이터 미제공. (커트라인 외의 정보는 모두 제공)     - 건설임대 공급 유형 중 행복주택은 100% 추첨으로 당첨자를 선정하여 커트라인이 부존재하므로 미제공. (커트라인 외의 정보는 모두 제공)     - 다른 공급유형은 모두 커트라인 포함 데이터 제공. ㅇ (임대조건) 임대 신분과 계약시기에 따라 임대보증금과 임대료에 차이가 있음. 각 공급 유형별로 보편적이라 생각되는 자격의 임대료와 임대보증금을 제공.    - 단, 임대신분과 신청유형이 일치하는 행복주택은 신청유형별 임대료 및 임대보증금 정보 제공.    - 계약일이 아닌 모집공고일 기준 임대보증금 및 임대료 정보 제공.
