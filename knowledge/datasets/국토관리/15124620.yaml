description_portal: 해당 데이터는 2025년12월 31일 기준 광주광역시 공공임대주택 현황에 대해 정리를 해 놓은 공공데이터입니다. 해당 데이터 내용은 영구임대, 국민임대, 행복주택, 공공임대(10년임대), 공공임대(50년임대) 등 광주광역시 공공임대주택 유형별로 분류하고 있으며, 공공임대주택 유형별 단지명, 소재지(주소), 준공일자, 세대수, 임대사업자, 주택형 등을 제공하고 있습니다. 해당 데이터로 광주광역시의 공공임대주택 위치, 규모, 노후도 및 공급량 등을 파악할 수 있으며, 관련 통계자료로써 활용 가능합니다.
