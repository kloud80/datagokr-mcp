summary_user: 한국토지주택공사가 최초 공고일 기준 2020~2025년에 공급한 공공분양주택을 단지(사업지구·블록) 단위로 담고, 공급유형(공공분양·신혼희망타운·지구주민)별 세대수와 사전청약·특별공급(다자녀·신혼부부·생애최초·노부모·신생아 등)·일반공급 호수를 행마다 나눠 적은 CSV 파일(약 16KB)이다. 청약 준비자나 주택 공급 분석가가 'LH가 연도·시도별로 신혼부부·생애최초 특별공급 물량을 얼마나 배정했나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공급·청약 데이터와는 시도명·주소·사업지구명을 이름으로 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국토지주택공사에서 최초 공고일 기준으로 2020~2025년에 공급한 공공분양주택의 일반, 특별공급 유형별 공급호수를 제공합니다. 공급유형은 공공분양, 신혼희망타운, 지구주민으로 나뉘는데 신혼희망타운은 신혼부부를, 지구주민은 해당 지역 원주민 만을 대상으로 하는 공급유형을 말하고, 공공분양은 크게 사전청약과 본청약으로 구분하고 본청약은 특별공급(다자녀, 신혼부부, 생애최초, 노부모, 신생아, 협의양도인, 국가유공자 등, 기관추천 등)과 일반공급으로 구분됩니다. 데이터를 해석함에 있어 각 유형별 공급 호수는 최초 공고 시점에 의도한 수치로서 일부 단지의 경우 각 공급유형의 총합이 총 세대수와 다를 수 있고, 최초입주시기 역시 최초 공고 시점에 예상하여 입력된 데이터로서 공고 이후 건축 공사 진행 상황에 따라 실제 입주시점과는 달라질 수 있음을 유의하시기 바랍니다.
