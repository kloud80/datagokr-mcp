summary_user: 정수장 원수·정수에서 조사·관리하는 수질 모니터링 항목 목록을 항목 단위로 담은 기준표 성격의 파일로, 항목별 단위·물질구분·대상시료·검사주기를 정리한 전국 범위 자료다. 수질 분석가나 서비스 개발자가 '정수장에서 이 물질을 원수와 정수 중 어디서, 어떤 단위와 주기로 검사하는가'를 확인하거나 수질 데이터 사전·항목 코드를 표준화할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 정수장별 수질검사 결과 같은 다른 데이터와는 항목명을 맞추는 이름 매핑으로만 연결한다.
description_portal: 본 데이터는 정수장 원수·정수에서 조사 및 관리하는 수질 모니터링 항목(300항목) 현황을 제공하는 자료입니다. 본 데이터는 수질 관리 기준 검토, 검사 계획 수립, 항목별 단위·대상시료 정의 확인, 데이터 사전 구축에 활용됩니다. 또한 원수·정수별 모니터링 범위 파악, 항목 코드 표준화, 분석 지표 설계 등 연구·서비스 개발의 기초 자료로 유용합니다.정수장 운영 과정에서 발생하는 급수 차질에 대한 투명한 정보 공개는 국민의 알권리를 보장하고, 수돗물 서비스 품질 향상과 신뢰성 제고에 기여하는 기초자료로 활용됩니다.(대상) 전국 160개 지자체(제공정보) 번호, 항목, 단위, 물질구분, 대상시료, 검사주기, 구분 등
