summary_user: 국토교통부 도시정책관이 낸 도시업무편람 자료의 목록 파일로, 편람 파일별로 순번·파일명·다운로드 경로·자료명·연도를 한 행씩 담는다(전국·비공간, CSV 약 1KB 규모의 작은 목록). 도시계획 담당 공무원이나 관계자가 "연도별 도시업무편람 파일을 어디서 내려받나"를 찾을 때 쓰며, 편람 본문(법규·절차·서식)은 이 목록이 가리키는 원문 파일에 들어 있다. 다른 데이터와 잇는 전역 조인 키는 없어 자료명이나 연도로 사람이 직접 맞춰 보는 방식으로만 연결한다.
description_portal: 도시업무편람은 도시계획 관련 업무를 담당하는 공무원이나 관계자들이 업무를 수행하는 데 필요한 지침, 기준, 절차 등을 담은 책자 또는 자료이며,도시업무편람에는 도시계획 관련 법규, 정책, 사업 절차, 검토 기준, 관련 서식 등 실무에 필요한 정보가 포함되어 있습니다.도시업무편람은 도시계획 업무의 효율성을 높이고, 일관성 있는 업무처리를 위해 제작합니다.* 주요내용  - 도시계획 관련 법규 및 제도  - 도시계획 수립 및 집행 절차  - 도시계획 시설 설치 및 관리 기준  - 각종 인허가 절차 및 관련 서식  - 도시계획 관련 최신 동향 및 정보* 활용목적  - 업무담당자의 전문성 향상 및 역량 강화  - 업무처리의 효율성 및 투명성 제고  - 도시계획 업무의 일관성 유지 및 오류 방지  - 시민들에게 도시계획 관련 정보 제공국토교통부 도시정책관 도시업무편람 자료는 각 파일명, 다운로드 URL, 제목, 연도 등으로 구성하여 발견연도별 데이터로 제공합니다.
