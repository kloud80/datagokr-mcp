summary_user: 충청북도 증평군 관내에 공장등록을 마친 공장을 한 곳씩 담은 시군구 단위 명부 파일로, 회사명·업종명·종업원수·지번 주소·전화번호·데이터기준일을 담는다. 분석가나 창업·입지 검토자가 '증평군에는 어떤 업종의 공장이 어디에 얼마나 모여 있고 고용 규모는 어떤가'를 파악하는 데 쓴다. 실측 컬럼에 사업자등록번호·업종코드(KSIC)·필지번호(PNU) 같은 전역 조인 키가 없으므로, 다른 데이터와는 회사명이나 지번 주소(공장대표주소)를 이름·주소 매칭해 잇는다.
description_portal: 증평군_공장등록현황은 증평군 관내에 사업장을 두고 있는 공장의 등록 현황 정보를 정리한 데이터로, 기업의 명칭, 업종, 위치, 연락처, 종업원 수 등의 항목으로 구성되어 있습니다.이 데이터는 공장등록요건을 충족한 정식 등록 기업을 기준으로 하며, 증평군의 지역경제 동향, 산업구조 분석, 입지 전략 수립 등에 활용될 수 있습니다.※ 주의사항 및 제한사항본 데이터는 공장등록 완료 기업 기준으로, 소규모 미등록 사업체는 제외되어 있습니다.개인 식별 가능 정보(대표자명, 주민등록번호 등)는 포함되어 있지 않으며, 데이터의 모든 정보는 공공활용 목적에 맞춰 익명성 처리 되어 있습니다.
