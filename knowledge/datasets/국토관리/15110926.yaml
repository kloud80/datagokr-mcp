status: active
summary_user: 경상북도 영주시 관내에서 추진된 도시재생 뉴딜사업과 새뜰마을사업을 사업 건별로 담은 API로, 구분·선정연도·선정지역·사업명·사업내용·사업 시작·종료 기간·비고를 제공한다. 영주시 주민이나 도시재생 관련 기업·연구자가 "우리 동네에서 어떤 재생사업이 언제부터 언제까지 추진됐는가"를 확인하고 사업 간 내용과 시점을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 선정지역명·사업명 같은 이름 매칭이나 같은 기관(영주시) 기준으로만 연결한다.
limits: 표준 행정코드나 좌표가 없어 사업지를 지도나 다른 통계와 자동 결합하기 어렵고, 범위가 영주시 한 시군구에 한정된다. 포털 활용신청은 자동승인되며 serviceKey가 필요하고 개발계정은 일 10,000회로 호출이 제한된다.
