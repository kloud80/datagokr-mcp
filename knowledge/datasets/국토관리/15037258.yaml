description_portal: 골재란 골재채취법 제2조(정의)에 의거, 하천, 산림, 공유수면이나 그 밖의 지상ㆍ지하 등 자연상태에 부존(賦存)하는 암석, 모래 또는 자갈로서 콘크리트 및 아스팔트콘크리트의 재료 또는 그 밖에 건설공사의 기초재료로 쓰이는 것을 말합니다.골재의 무분별한 채취는 자연환경 파괴와 생태계에 위험을 초래할 수 있기에, 골재채취는 법에 근거하여 시장,군수,구청장의 허가 제도를 통해 입지, 채취량, 복구계획 등을 엄격히 관리하고 있습니다. 이에 따라 안산시에 등록되어 있는 골재업(골재채취업) 현황으로 등록업종명, 업체명, 주소, 전화번호 등 정보를 제공합니다.
