summary_user: 경기도 단독·다가구 주택 매매 실거래를 거래 건별로 담은 원천 자료로, 시군구명, 주택유형(단독/다가구), 도로조건, 총면적·대지면적, 계약연월·계약일, 거래금액, 건축년도, 도로명을 기록한다. 경기도 어느 시군에서 단독·다가구 주택이 면적과 건축연도 대비 얼마에 거래되는지 비교하려는 매수자·중개업자·정책 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구명이나 도로명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 단독·다가구 주택의 매매 실거래가 원천정보로, 실제 거래된 주택의 특성과 가격을 기록한 자료입니다. 주요 항목은 시군구명, 주택유형(단독/다가구), 도로조건, 총면적·대지면적, 계약연월·계약일, 거래금액, 건축년도, 도로명 등으로 구성됩니다. 이를 통해 지역별 주택유형과 도로 접근성에 따른 거래 특성을 비교하거나, 건축연도와 면적 대비 거래금액을 분석할 수 있습니다. 또한 장기적인 가격 추이와 주거지 변화를 추적하여 부동산 정책 수립, 주택시장 안정화 대책, 도시계획 연구에 활용할 수 있으며, 민간 부동산 서비스와 투자 의사결정 기초자료로 쓰일 수 있습니다.
