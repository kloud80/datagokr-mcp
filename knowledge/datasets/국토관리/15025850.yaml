summary_user: 부산광역시 동래구 관내에 등록된 공장을 한 줄에 한 곳씩 담은 명부 파일로, 회사명·공장대표주소(도로명)·업종명·생산품을 담는다(CSV 약 20KB). 동래구에서 특정 업종이나 생산품을 다루는 제조공장이 어디에 있는지 찾는 사업자나 지역 산업 분포를 보는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 도로명주소를 맞춰 이어 쓴다.
description_portal: 부산광역시 동래구 관내에 소재한 산업집적활성화 및 공장설립에 관한 법률 제16(공장의 등록)에 따라 등록된 공장의 회사명, 공장대표주소(도로명), 업종명, 생산품에 대한 항목을 제공합니다.데이터 항목 설명1. 회사명2. 공장대표주소3. 업종명4. 생산품본 파일 데이터는 부산광역시 동래구 관내 등록된 공장 현황으로 업체 사정에 따라 데이터 항목이 변경되거나 삭제됨에 유의하시길 바랍니다.사정 상 직접 확인이 어려우신 경우에는 부산광역시 동래구 일자리경제과 산업계 공장 담당자(☎ 051 550 4922)에게 직접 문의 하시길 바랍니다.감사합니다
