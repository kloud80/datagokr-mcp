description_portal: 대전광역시 안전도시종합계획정보 자료는 2019년부터 2020년까지 대전시에서 수립한 안전도시 조성을 위한 종합계획의 전반적인 내용을 담고 있습니다. 이 자료는 각종 재난 및 안전사고 예방, 시민 안전 증진, 도시 내 위험요소 관리, 안전 인프라 확충 등 다양한 정책과 실행계획을 포함하고 있습니다. 또한, 도시계획과 연계된 안전관리 방안, 부문별 추진전략, 연차별 목표 및 주요 사업 내역, 관련 행정조직 및 협력체계 등도 상세히 기록되어 있습니다. 2022년 공공데이터 기업매칭지원사업을 통해 구축되었습니다.
