summary_user: 서울시 건축물대장 전유부를 집합건물의 동·호·층 단위로 담은 건별 데이터로, 대지위치·시군구·법정동·본번/부번 지번, 도로명 주소, 건축물대장 일련번호, 대장 구분·종류, 동명칭, 호명칭, 층 구분과 층번호를 포함한다. 부동산 실무자나 분석가가 특정 아파트·오피스텔 단지의 몇 동 몇 층에 어떤 호수가 있는지 확인하거나 구별 전유부 구성을 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 건축물대장(표제부·총괄표제부)이나 공간 데이터와는 시군구·법정동 이름과 본번·부번 지번 또는 도로명 주소를 맞춰 연결해야 한다.
description_portal: 이 데이터는 서울특별시 각 지역의 건축물 전유부에 대한 위치 및 속성 정보를 제공한다. 각 항목에는 소재지 주소, 행정구역명, 지번, 도로명 주소, 도로명 상세, 지상·지하 구분, 건물 관리번호, 등기 구분, 동명칭, 호수, 층 구분, 층수 등의 정보가 포함되어 있다. 이를 통해 건물의 물리적 위치와 소유·구성 형태를 파악할 수 있으며, 부동산 관리, 도시계획, 건축물 현황 조사, 행정업무 지원 등 다양한 분야에서 활용 가능하다. 특히 집합건물 내 특정 전유부의 층 위치와 호수 정보를 포함하고 있어 세부 단위 공간 분석 및 관리에도 유용하다.
