description_portal: 이 데이터는 서울 둘레길의 코스별 정보(1~5코스)를 보여주며, 각 코스의 번호, 이름, 부제목, 난이도, 설명, 세부 경유지, 출발·종료 위치, 스탬프함 위치, 길이(km), 소요 시간, 지도 URL 및 상세 페이지 링크를 포함하고 있습니다. 예를 들어, 1코스 ‘수락산’은 상급 난이도로 오르막과 내리막이 반복되며, 전망대에서 서울 전경을 감상할 수 있습니다. 2코스 ‘덕릉고개’는 도시와 자연을 연결하는 생태길로 다양한 바위와 꽃을 즐길 수 있습니다. 3코스 ‘불암산’은 비교적 편안한 숲길로 여유롭게 걷기 좋으며, 4코스 ‘망우·용마산’은 정비가 잘 되어 전망이 좋은 코스입니다. 5코스 ‘아차산’은 역사·문화자원이 풍부하고 아차산 생태공원 등 볼거리가 많습니다. 모든 코스는 지하철역과 가까워 접근성이 뛰어나며, 길이와 소요 시간이 다양해 체력과 취향에 맞춰 선택할 수 있습니다.
