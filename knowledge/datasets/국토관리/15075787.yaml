summary_user: 광양시가 조성한 도시숲을 사업 한 건씩 담은 목록으로, 조성년도·숲 조성 사업명·위치·사업량·사업내용·도시숲 분류를 기록한다(CSV 약 10KB 규모의 시군구 단위 파일). 주민이나 녹지 정책 담당자가 "광양시에 어느 해에 어떤 종류의 도시숲이 어디에 얼마나 조성됐나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치 문자열이나 사업명으로 직접 맞추거나, 같은 기관의 공원·녹지 자료와 나란히 놓고 보는 방식으로만 잇는다.
limits: 표준 행정코드나 좌표 같은 공통 키가 없어 다른 지자체 도시숲 자료나 공간 데이터와 자동으로 결합하기 어렵다. 공간 정보가 없는 비공간 자료여서 지도 위 면적 분석에는 위치 문자열을 따로 지오코딩해야 한다.
