summary_user: 전국 유인섬을 섬 하나당 한 행으로 시도·시군구, 섬 이름, 인구 등 일반현황과 지리정보를 담은 연말 기준 엑셀 파일이다. 섬 정책 담당자나 연구자가 "우리 시군구에 사람이 사는 섬이 몇 개이고 인구는 얼마인가" 같은 질문에 쓴다. 전역 조인 키(행정코드 등)가 없어 시도·시군구 이름이나 섬 이름을 맞춰 다른 인구·지역 통계와 이어 써야 한다.
description_portal: 전국 유인섬 일반현황 자료 제공 - 행정안전부와 한국섬진흥원은 섬 발전 촉진법에 따라 우리나라 유인섬에 대한 효율적인 정책 추진과 체계적인 관리 등을 위해 매년 유인섬 현황을 조사하고 있음 - 행정안전부 주민등록인구통계 등을 활용하여 각 섬에 대한 지자체별(시·도, 시·군·구), 섬 이름, 인구, 세대, 면적, 해안선 길이 등 섬 지역의 일반적인 현황을 붙임 자료로 제공하여 섬 지역에 대한 국민 이해도 제고를 목적으로 함 - 매년 말 기준으로 자료를 업데이트함에 따라 오차나 변동사항이 발생할 수 있음을 참고하여 주시기 바람
