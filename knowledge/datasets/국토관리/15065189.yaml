summary_user: 울산광역시 도시계획시설 중 공원을 근린·어린이·소공원 등 생활권공원과 묘지·체육·역사·수변·문화·해안공원 등 주제공원, 도시자연공원구역으로 나눠 유형별로 정리한 집계표이며, 파일 크기가 206바이트에 불과한 소규모 요약 자료다. 울산시 공원 정책을 검토하는 분석가나 시민이 '울산에는 공원 유형별로 계획된 공원이 얼마나 있나'를 개략적으로 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공원 유형 이름을 맞추거나 같은 기관(울산광역시) 자료끼리 이어 쓰는 방식으로만 연결한다.
description_portal: 이 자료는 울산광역시 도시계획시설 중 공간시설에 해당하는 공원 현황을 정리한 자료입니다.도시지역에서 도시자연경관을 보호하고 시민의 건강.휴양 및 정서생활을 향상시키는 데에 이바지하기 위하여 설치 또는 지정된 도시공원을 그 기능 및 주제에 따라 생활권공원(근린공원, 어린이공원, 소공원) 및 주제공원(묘지공원, 체육공원, 역사공원, 수변공원, 문화공원, 해양공원 등)으로 나뉘며, 도시관리계획으로 용도구역으로 결정된 도시자연공원구역의 현황을 포함합니다. 본 자료는 도시계획현황통계를 기초로 하는 자료로 세부적인 사항들을 포함하지 않으므로 참고 자료로 활용하시기 바랍니다.
