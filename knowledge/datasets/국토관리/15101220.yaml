description_portal: '"도시군계획시설현황은 다음과 같은 자료를 제공합니다.1. 각 지자체의 교통시설(도로, 철도, 항만, 공항, 주차장, 자동차정류장, 궤도, 차량검사 및 면허시설)에 대한 분류별 개소수, 연장 및 면적2. 각 지자체의 공간시설(광장, 공원, 녹지, 유원지, 공공공지)에 대한 분류별 개소수 및 면적3. 각 지자체의 유통공급시설(유통업무설비, 수도공급설비, 전기공급설비, 가스공급설비, 열공급설비, 방송·통신시설, 공동구, 시장, 유류저장 및 송유설비)에 대한 분류별 개소수 및 면적4. 각 지자체의 공공·문화체육시설(학교, 공공청사, 문화시설, 체육시설, 연구시설, 사회복지시설, 공공직업훈련시설, 청소년수련시설)에 대한 분류별 개소 및 면적5. 각 지자체의 방재시설(하천, 유수지, 저수지, 방화시설, 방풍설비, 방수설비, 사방설비, 방조설비)에 대한 분류별 개소수, 연장 및 면적6. 각 지자체의 보건위생시설(장사시설, 도축장, 종합의료시설)에 대한 각 분류별 개소수 및 면적7. 각 지자체의 환경기초시설(하수도, 폐기물처리 및 재활용시설, 빗물저장 및 이용시설, 수질오염방지시설, 폐차장)에 대한 개소수, 연장 및 면적"'
