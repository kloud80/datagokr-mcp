summary_user: 경기민원24에 게시된 행정·민원 안내 콘텐츠를 한 건씩 담은 목록으로, 콘텐츠별 제목·본문 텍스트·키워드·조회수와 등록·수정·적용 일시, 전시·삭제 여부를 기록한다. 도민이 자주 찾는 민원 안내가 무엇인지, 특정 민원 안내문이 언제 바뀌었는지 확인하려는 행정 분석가나 서비스 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 콘텐츠 제목·키워드 같은 이름 매핑이나 같은 기관(경기도) 단위로만 이어 쓴다.
description_portal: 이 데이터는 경기민원24 시스템에서 제공되는 행정·민원 콘텐츠 현황을 정리한 자료입니다. 각 콘텐츠별로 콘텐츠 ID, 제목, 텍스트 내용, 문서 및 이미지 아이디, 조회수, 키워드, 등록·수정·적용 일시, 전시 여부 등의 관리 정보가 포함되어 있습니다. 이를 통해 민원 서비스 제공 현황 분석, 이용자 선호 콘텐츠 파악, 조회수 기반 인기 콘텐츠 분석, 정책·규정 문서의 변경 추적 등이 가능하며, 행정 콘텐츠 품질을 모니터링하여 대민 행정서비스 개선에 활용할 수 있습니다. 또한, 전자정부 행정정보 제공 체계의 운영 현황을 데이터 기반으로 검토하는 데도 유용합니다.
