summary_user: 국토안전관리원이 관리하는 댐시설물 수를 종별(행)과 17개 시도(열)로 교차 집계한 통계표로, 건별 시설 목록이 아니라 2025년 12월 31일 기준 전국 시도 단위 집계이며 파일 크기는 327바이트에 불과하다. 분석가나 지자체 담당자가 '어느 시도에 어떤 종별의 댐시설물이 몇 개 있는가'를 비교하거나, 가뭄·홍수 대비 지역별 시설 분포를 개략 파악할 때 쓴다. 실측 컬럼에 댐코드 같은 전역 조인 키가 없어, 다른 데이터와는 시도명을 이름으로 맞추거나 같은 기관의 시설물 통계와 나란히 놓는 방식으로만 이어 쓴다.
