description_portal: '국토안전관리원에서 제공하는 데이터이며 댐시설물, 시도별, 종별 통계현황의 CSV형식의 파일데이터를 제공합니다. 25년 12월 31일 기준입니다.지역별 댐시설물 통계현황을 알려드립니다.댐시설물이란 하천을 막아 물을 가두거나 조절하기 위해 만든 모든 구조물을 말하며, 댐 본체 외에도 수력 발전 시설, 취수탑, 여수로, 수문, 갤러리 등이 포함됩니다.이들은 용수 공급, 수력 발전, 홍수 조절, 생태계 보전 등 다양한 목적으로 기능하는 국가의 중요 기간시설물입니다.주요 구성 요소댐 본체: 하천의 흐름을 차단하거나 늦추는 가장 기본적인 구조물입니다.수력 발전 시설: 댐에 저장된 물을 이용하여 터빈을 돌려 전기를 생산합니다.취수탑: 댐에 저류된 물을 하류로 보낼 수 있도록 하기 위해 설치된 구조물입니다.여수로: 댐의 저수 용량을 초과하는 홍수량을 안전하게 내보내는 시설로, 주 여수로와 보조 여수로로 나뉩니다.수문: 여수로를 통해 흐르는 물의 양을 조절하기 위해 설치된 장치입니다.갤러리: 댐 제체 내부에 만들어진 공간으로, 점검 및 관리를 위한 통로 역할을 합니다.'
