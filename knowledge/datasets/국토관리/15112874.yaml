summary_user: 경기도 내 시군이 관리하는 공공건축물을 건물 단위로 정리한 현황으로, 시군명·건축물명·면적·취득일·도로명/지번 주소·우편번호·WGS84 위경도를 담는다. 지역 주민이나 분석가가 "우리 시군에 어떤 공공건축물이 어디에 있고 언제 취득됐나"를 확인하거나 공공시설 분포를 지도로 그리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: '이 데이터는 경기도 내 각 시군이 관리하는 공공건축물의 현황을 정리한 자료로, 건축물명, 면적, 취득일, 주소, 좌표정보 등을 포함하고 있습니다.도 및 시군 관리현황에 따라 제공 공공건축물 현황에 차이가 있을 수 있습니다.* 경기도 : 건축시설과로 발주 접수된 10억 이상 공사 준공 현황만 제공(건축시설과 관리대상이 아닌 소규모 공공건축물은 제외 개방)* 평택시 : 공공청사 현황만 관리함으로 해당 데이터만 제공* 김포시 : 공공건축물 관리 총괄 부서 부존재로 김포시 자산관리과에서 관리하는 공공건축물 정보만 제공'
