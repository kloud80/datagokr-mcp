description_portal: 경상북도개발공사의 사업지구별 미분양현황입니다. 사업명, 소재지, 지번 등이 포함되어 있습니다. 금년 "필지수" 정보를 추가로 개방합니다. 경상북도개발공사에서 진행한 사업 중에 미분양 사업은 신도시건설사업 및 경산 산업단지 조성사업이 주류를 이루고 있습니다. 임대 공동주택, 지원시설용지, 근린생활시설, 주차장, 주유소 등의 용지가 미분양 상태입니다. 유관기관의 신도시와 산업단지에 대한 미분양 사업명과 소재지, 용지, 면적 등을 함께 분석하면 사업 추진 시 미분양을 최소화 할 수 있을 데이터로 판단합니다.
