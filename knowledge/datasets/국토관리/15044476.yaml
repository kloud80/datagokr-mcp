summary_user: 경상북도개발공사가 추진한 사업지구별로 미분양 상태인 용지를 사업명, 소재지, 지번, 용도 분류(대·중·소분류), 필지수, 면적(제곱미터) 단위로 담은 파일(CSV, 약 17KB)이다. 신도시나 산업단지에서 어떤 용도의 땅이 얼마나 남아 있는지 확인하려는 사업자나 개발계획 분석가가 '경산 산업단지에 남은 근린생활시설 용지는 몇 필지, 몇 제곱미터인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와 이으려면 소재지·지번을 주소로 매핑하거나 사업명으로 맞춰야 한다.
