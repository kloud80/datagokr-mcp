summary_user: 시흥시 도시계획정보시스템(UPIS)에 등록된 도시계획 시설을 한 건씩 담은 파일로, 시설마다 대·중·소분류, 도면번호, 도형 면적, 데이터 기준일이 붙어 있으며 범위는 시흥시 한 개 시군구다. 분석가나 도시계획·건축 실무자가 '시흥시에 어떤 유형의 도시계획 시설이 얼마나 넓게 지정돼 있는가'를 유형별 면적으로 따져 볼 때 쓴다. 전역 조인 키는 없고 시군구코드로 같은 지역의 다른 도시계획·토지이용 자료와 묶거나, 분류코드·도면번호를 이름 매핑으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 시흥시의 도시계획정보시스템을 기반으로 수집된 각종 도시 시설 현황 정보를 포함하고 있습니다. 데이터에는 시군구코드, 대·중·소분류 코드, 도면번호, 면적 정보(도형), 데이터 기준일이 포함되어 있어 도시계획의 체계적 분석과 공간관리, 행정계획 수립 등에 활용될 수 있습니다. 다양한 분류 체계를 통해 시설 유형별 현황을 파악할 수 있으며, 면적 기반 공간 분석을 통해 도시 성장 패턴, 시설 배치의 적정성, 기반시설 수급 현황 등을 종합적으로 검토할 수 있는 기초자료로 활용됩니다. 또한 공공·민간의 도시계획 및 건축 설계, 연구기관의 공간 빅데이터 분석, 스마트시티 개발 등 다양한 분야에서 데이터 융합 기반으로 활용될 수 있습니다. 도시계획의 효율적 운영과 예측 가능한 도시관리 정책 수립에도 기여할 수 있는 자료입니다.
