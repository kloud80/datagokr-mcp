summary_user: 전남 무안군의 구지적도 보유 현황을 법정동(동리) 단위로 정리한 파일 데이터로, 법정동별 토지·임야 구분, 축척, 옛 읍면 이름, 도면 파일 수량을 담는다(CSV 약 18KB, 범위는 시군구, 행정단위는 읍면동). 토지 소유권 변동이나 개발사업 조사를 하는 공무원·연구자가 "이 동리의 옛 지적도가 어떤 축척으로 몇 장 남아 있나"를 확인하는 데 쓴다. 법정동코드(bjd_cd)를 키로 토지·임야대장, 연속지적도 같은 다른 지적 데이터나 행정구역 자료와 이어 쓴다.
description_portal: 전라남도 무안군 구지적도 정보 데이터는 토지 행정의 기초 자료로 활용되는 구지적도에 관한 정보를 수록한 공공데이터입니다. 순번, 법정동코드, 토지·임야 구분, 축척, 구읍면, 동리, 파일수량 등의 항목으로 구성되어 있으며, 과거 지적 측량 결과와 행정구역 변천 내역을 확인할 수 있습니다. 이 데이터는 토지 소유권 변동, 도시계획 수립, 문화재 및 개발사업 조사 등 다양한 행정·연구 분야에서 참고 자료로 활용되며, 공공데이터포털에서도 유사한 지적·토지 관련 자료를 제공하고 있어 비교 검증 및 추가 분석이 가능합니다.
