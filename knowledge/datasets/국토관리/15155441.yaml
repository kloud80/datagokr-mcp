description_portal: 본 데이터는 한국토지주택공사에서 공급하는 공공분양 주택 중 사전청약 제도를 통해 청약한 대상자들에 대한 배점 기준표를 제공합니다. 사전청약은 일반청약과의 주택공급 시점보다 더 이른 시점에 주거안정 및 부동산시장 안정을 도모하기 위하여 추진하였던 제도입니다. 사전청약 대상 주택 공급 유형은 크게 일반분양, 신혼희망타운, 선택형, 이익공유형이 있고 당첨자를 가리기 위하여 필요한 평가 유형으로는 청년, 다자녀, 신혼부부, 노부모부양 등이 있습니다. 각 배점기준은 정책적으로 수립되었다가 폐지되기도 하기 때문에 기준별로 적용 시작일자와 종료일자를 따로 두고 있는데 항목에 따라서는 시작 및 종료일자가 미정이라서 공란이 있을 수 있습니다. 상세설명은 각 배점 항목에서 이해가 필요한 사항이 있는 경우에 보충 설명을 위하여 추가되는 코멘트로서 따로 설명이 필요하지 않은 일상적 의미의 배점은 상세설명이 공란으로 제공될 수 있습니다.
