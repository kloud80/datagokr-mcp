description_portal: '○ 통계개요* 통계명 : 지하수 이용 현황(법정동별)* 통계종류 : 서울시 지하수 이용 현황을 용도별로 제공하는 일반ㆍ보고통계* 근거법령 :「지하수법」제17조, 동법 시행령 제28조 및 시행규칙 제21조* 작성목적 : 지하수의 용도별 이용실태를 분석하여 지하수관리의 기본계획을 수립보완하기 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국가지하수정보센터* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 지하수 용도별(생활용, 공업용, 농업용, 기타) 이용량 및 개소수 등○ 용어설명* 생활용 : 가정용, 일반용, 학교용, 공동주택용, 간이상수도용, 상수도용, 기타용* 공업용 : 국가공단, 지방공단, 농공단지, 자유입지업체, 기타용* 농업용 : 전작용, 답작용, 원예용, 기타용* 기 타 : 온천수, 먹는샘물, 기타용* 개소수 : 현재 개발,이용중인 지하수 우물의 공수를 말함* 이용량 : 지하수 개발.이용 시설에서 1년간 이용하는 양으로서 실제 측정하는 시설은극히 일부이며 대부분 양수능력 등을 기초로 추정하여 산정한 값○ 기 타* 행정동단위가 아닌 법정동 단위로 이용시 주의 필요* 소수점 처리로 인하여 총계의 차이가 발생할 수 있음'
