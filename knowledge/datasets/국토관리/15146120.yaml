summary_user: 서울시 건축물대장 총괄표제부를 대지(필지) 단위로 담은 원천 자료로, 대지위치·지번·도로명 정보와 대지면적·건축면적·연면적·건폐율·용적률, 주용도, 주건축물·부속건물 수, 세대·가구·호 수, 승용·비상용 승강기 수, 옥내·옥외 주차 현황, 건축허가일·착공일을 기록한다. 재건축·재개발 검토자나 부동산 분석가가 특정 단지의 용적률·연면적과 세대 수, 주차대수, 허가 시점을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 건축물대장(표제부·전유부)이나 토지 자료와는 시군구·법정동 이름과 본번·부번(지번), 도로명 정보를 맞춰 연결해야 한다.
description_portal: 이 데이터는 건축물의 총괄표제부 정보를 요약한 자료로, 각 부동산의 위치, 지번, 도로명 주소 등 기본 행정구역 정보를 포함하고 있습니다. 또한 대지면적, 건축면적, 연면적, 용적률, 건폐율 등 주요 건축물 규모 지표와 함께 건물의 주용도 및 기타 용도를 기록합니다. 건물동 수, 부속건물 수와 면적, 가구 수, 세대 수, 호 수, 주차대수(옥내·옥외), 승용·비상용 엘리베이터 수 등의 시설 현황도 확인할 수 있습니다. 건축허가일, 착공일, 사용승인일 등 인허가 일정 정보도 포함되어 있어, 건축물의 개발·이용 현황과 행정 절차 이력을 한눈에 파악할 수 있습니다. 이 자료는 도시계획, 부동산 개발, 건축물 관리, 공공정책 수립, 인허가 통계 분석, 재개발·재건축 타당성 검토 등에 활용됩니다.
