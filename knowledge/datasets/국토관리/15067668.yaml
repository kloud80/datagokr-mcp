description_portal: '항공사진을 도화하기 위한 지상기준점 측량점의 조서 관리 정보지상기준점은 항공사진 개별 낱장에서 명확하게 식별이 가능한 임의의 지형지물(예: 건물모서리, 도로상 도색한 표지, 댐-저수지 배수문모서리 등) 또는 촬영시 설치한 항공표지에 GNSS로 측량하여 제작▷ 식별정보 : 측량조서구분코드코드, 측량지구코드, 점일련번호, 점번호, 조서사진번호, 행정구역(시도,시군구, 읍면동, 리) ▷ 속성정보 : 지상원점, 지상기준점직각좌표(X,Y)/표고/타원체고, 경로, 작성일자, 관측일, 사진기준점직각좌표(X,Y)/표고/타원체고, GPS측량직각좌표(X,Y), 시진/수치지도/GPS원점 등* 항공사진 : 항공기나 드론 등의 항공 플랫폼에서 지표면을 촬영한 사진으로, 지도 제작, 지형 분석, 도시계획, 환경 모니터링 등 다양한 분야에서 활용- 전국을 촬영하여, 국토 변화상황을 모니터링 하고 정사영상 제작 및 국가기본도 수정 등에 활용- 전국을 도시지역(해상도 12cm) 및 비도시지역(해상도 25cm)으로 구분하여 도시지역, 비도시지역 1년 주기 촬영'
