description_portal: 해당 데이터는 한국공간정보산업협회가 측량업체로부터 제출받은 최근 3개년 사업 실적을 바탕으로, 측량업 영위기간, 기술인력의 등급 및 자격, 재무 건전성, 신용 등급, 교육 이수 현황, 영업 정지 등 다양한 항목을 종합적으로 분석한 결과입니다. 「공간정보의 구축 및 관리 등에 관한 법률」 제10조의3에 따라 수행실적, 기술능력, 신인도, 신용도, 교육이행, 감점 등 평가 항목을 기준으로 업체의 사업 수행능력을 객관적으로 산정한 종합 점수 형태로 제공되며, 공정한 용역 발주와 업계 경쟁력 강화를 위한 기초 자료로 활용됩니다.
