description_portal: '○ 통계개요* 통계명 : 오피스빌딩 임대료·공실률 및 수익률(2013년 이후)* 통계종류 : 서울시 오피스빌딩의 공실률 및 임대료, 수익률을 제공하는 일반ㆍ조사통계* 작성목적 : "오피스 빌딩의 공실률 및 임대료 등 현황을 파악하여 부동산 및 건설정책마련의 기초자료를 제공하는 것을 목적으로 함* 조사대상 : 건축물대장상의 주용도가 오피스(업무시설) 6층이상이며 임대면적비율이50%이상인 건물* 조사체계 : 국토교통부 → 한국감정원* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시 및 주요 상권지역내용 - 오피스빌딩 임대료, 공실률, 수익률 현황○ 용어설명* 임대료 : 임차인이 일정공간을 점유하기 위해 지불하는 총 비용의 추정을 목적으로 하여,계약임대료를 이용하여 산정** 오피스 : 1~2층은 주로 로비나 매장용으로 이용되고 있어 업무용 공간의 임대료 수준을파악하기 위해 3층~최고층 기준** 임차인이 지불하는 보증금과 월세액을 전환율을 이용하여 완전월세액으로 환산한 후,임대가능면적(전용면적+공용면적)의 총합으로 나누어 단위면적(㎡)당 수준을 산출** 임차인인 납부하는 관리비 등의 수입은 포함하지 않은 금액임* 공실률 : 임대계약이 체결되지 않았거나 자가, 분양 등의 방법으로도 이용되지 않는오피스 및 매장용빌딩의 빈 공간을 의미하는 것으로 공실률은 해당지역공실면적의 합을 지역의 총 연면적으로 나누어 산출* 투자수익률 : 당해 분기간 투하된 자본에 대한 전체수익률로서 임대료 등 빌딩운영에따른 소득수익률과 부동산가격 증감에 의한 자본수익률을 합산한 것* 소득수익률 : 당해 분기간 발생한 순영업소득을 기초 자산가치(당해 분기초)로 나눈것으로 지역별 소득수익률은 지역 내 빌딩의 소득수익률을 구한 후연면적을 가중치로 사용하여 산출* 자본수익률 : 당해 분기간 부동산자산가치의 증감으로 인한 수익률로 토지가격의증감과 건물가격의 증감을 고려하여 기초 자산가치(당해 분기초)로나눈 것으로 지역별 자본수익률은 지역 내 빌딩'
