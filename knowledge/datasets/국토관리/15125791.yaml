description_portal: 이 자료는 서울두드림길의 각 지점(점형) 위치 정보를 담고 있으며, 좌표계는 ITRF2000(X, Y)로 제공됩니다.  각 지점의 공간좌표를 활용해 둘레길 전체 경로 상의 주요 지점, 교차로, 쉼터, 이정표 등을 GIS나 위치기반 분석에 활용할 수 있도록 설계되어 있습니다. 총 117개의 점 데이터가 포함돼 있으며, 공간분포를 통해 둘레길 접근성, 지형·녹지 연계성, 주민 이동동선 분석 등에 활용 가능성이 높습니다.  또한, 이 데이터를 기반으로 도보·자전거 이용자의 흐름 예측, 관광 코스 설계, 도시 녹지망과의 연결성 분석 등의 응용이 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
