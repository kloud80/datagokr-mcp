summary_user: 한강·금강·영산강·낙동강 주요 하천 다기능보의 운영 현황(강우량·유입량·방류량·수위·저수량·저수율)을 보 단위로 담는 API이며, 검증 시 전국 16건이 수신되었다. 홍수·가뭄철에 보의 수위와 방류 상황을 확인하려는 지자체 담당자나 연구자, 일반 국민이 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 보 이름·코드 매핑이나 같은 기관 코드로만 댐·저수지 등 다른 수자원 데이터와 이어 쓴다.
description_portal: 'ㅁ 개     요 :  한국수자원공사_다기능보 운영정보* 한국수자원공사가 제공하는 다기능보 운영 정보는 주요 하천에 설치된 보의 운영 현황을 종합적으로 정리한 데이터입니다. 해당 자료는 보별 실시간 운영 현황을 파악할 수 있어 재해 예방과 효율적인 수자원 활용에 기초 자료로 사용됩니다. 또한 지자체, 연구기관, 일반 국민이 수자원 정책 수립, 학술 연구, 교육 자료로 폭넓게 활용할 수 있으며, 공공 정보 공개를 통해 물 관리의 신뢰성과 투명성을 강화하는 데 기여합니다.ㅁ 데이터 항목으로 강우량(mm), 유입량(㎥/sec), 방류량(㎥/sec), 수위(EL.m), 저수량(백만㎥), 저수율(%) 등의 정보가 포함됩니다.ㅁ 제공지점 : 한강 3, 금강 3, 영산강 2,  낙동강 8추후 기본정보 수정 예정'
