summary_user: 경기도 파주시 안의 공동주택을 단지 하나당 한 행으로 담은 파일 데이터로, 관리구분·임대/분양 구분·단지명·주택종류·사용검사일자·층수·동수·세대수와 도로명·지번 주소, 위도·경도를 포함한다. 파주시에서 어느 행정구역에 언제 사용검사를 받은 임대·분양 단지가 몇 세대 규모로 있는지 확인하려는 주민·부동산 분석가·정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단지명·주소 문자열 매칭이나 위경도 좌표로 붙여야 한다.
