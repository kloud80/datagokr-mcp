summary_user: 지적재조사 사업을 맡는 책임수행기관(본사·지역본부·지사)별로 상위 기관, 기관 코드·명칭·약어, 기관장명, 전화번호, 조직 구분을 한 행씩 담은 기관 목록 CSV 파일(약 17KB)이다. 지적재조사 민원이 생겼을 때 국민이나 담당 공무원이 "우리 지역 사업은 어느 지사가 맡고, 연락처는 무엇인가"를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없고, 상위 기관 코드와 기관 코드로 본부–지사 소속 관계를 파일 안에서 잇거나 기관명으로 다른 자료와 맞춰 쓴다.
description_portal: '지적재조사 사업을 수행하는 지적공사기관의 조직체계, 소속관계, 책임자 및 연락처 정보를 담고 있는 자료로, 국민과 행정기관이 기관별 업무 분장을 파악하고 적절히 소통할 수 있도록 돕습니다.1. 형식: CSV2. 내용 요약■ 상위지적공사기관코드: 상위 기관의 고유 코드■ 상위지적공사기관명: 상위 기관의 명칭 (예시: 서울지역본부)■ 지적공사기관코드: 개별 책임수행기관의 고유 코드■ 지적공사기관명: 기관의 공식 명칭 (예시: 강동송파지사)■ 지적공사기관약어: 간략 명칭 또는 약어 (예시: 강동송파구)■ 기관장명: 기관의 대표자 이름 (예시: 한종기)■ 전화번호: 기관 연락처 (예시: 02-6937-2150)■ 지적공사기관구분코드: 조직구조상의 구분 코드 (1: 본사, 2: 본부, 3: 지사 등)■ 지적공사기관구분명: 해당 기관의 분류명 (예시: 지사)3. 활용 예제■ 지적재조사 관련 민원 발생 시 해당 책임기관 신속 파악 및 연락■ 지역별 업무 분장 파악을 통한 행정 효율화 및 협업 구조 개선■ 기관별 조직 체계 분석을 통한 지적행정 서비스 품질 향상■ 중앙–지역 간 협업 및 보고 체계 정비의 기초자료로 활용'
