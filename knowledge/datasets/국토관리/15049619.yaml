summary_user: 광주 광산구의 장기미집행 도시계획시설 중 공공문화체육시설을 시설별로 담은 파일로, 시설명·시설종류·결정일자·결정위치·결정면적·집행면적·착공일·준공일·보상비·사업비와 국공유지·사유지별 미집행 면적을 시군구 단위로 기록한다. 다만 포털 설명에 따르면 2020~2024년에는 해당 시설이 없으며, 실제 파일 크기도 611바이트로 사실상 비어 있는 자료다. 주민이나 도시계획 분석가가 '광산구에 오래 집행되지 않은 문화·체육시설 결정이 남아 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 같은 기관의 다른 장기미집행 시설 자료와 시설명·시군구명으로만 맞대어 본다.
description_portal: 광주광역시 광산구의 장기미집행 국토계획 현황에 관한 상세한 데이터를 제공합니다. 이 자료에는 각 시설의 명칭, 시설 종류, 결정일자, 위치, 결정 면적 및 집행 면적, 착공일과 준공일 등의 다양한 항목이 포함되어 있습니다.도시계획 및 토지 이용 관리, 공공시설 확충 계획 수립, 개발 사업의 진행 점검 등에 중요한 기초 자료로 활용될 수 있습니다또한, 지역 주민과 행정 기관 모두에게 도시 발전 및 공공시설 확충에 대한 신뢰도를 높이는 데 기여하며, 향후 국토 계획의 효율적인 집행과 지속 가능한 도시 관리를 위한 중요한 참고 자료로 활용될 것입니다.※ 2020년 ~ 2024년 장기미집행 국토계획(공공문화체육시설)은 없음.
