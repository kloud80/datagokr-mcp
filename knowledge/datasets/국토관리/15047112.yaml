description_portal: '○ 통계개요* 통계명 : 부동산 소유권 취득현황* 공표주기 : 분기* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 소유자별 건수○ 용어설명* 부동산 등기 제도 - ‘부동산’에 관한 ‘물권’을 ‘등기’를 통하여 공시하는 제도* 재외국민 - 대한민국에 현재하지 아니한 자로서 국외로 이주를 하여 주민등록이말소되거나 처음부터 주민등록이 없는 자○ 기타* 해당 기간내 접수된 신청사건 중 교합완료된 사건 기준임(정보추출일 기준 작성)* 소유권등기(소유권보존, 소유권이전, 소유권변경, 소유권정정, 소유권이전 가등기에기한 본등기) 신청사건에 한함* 행정구역 정리가 되지 않는 경우는 통계데이터에 집계되지 않았음* 1분기 : 01.01~03.31. 2분기 : 04.01~06.30. 3분기 : 07.01~09.30. 4분기 : 10.01~12.31.○ 출 처 : 대한민국법원 인터넷 등기소'
