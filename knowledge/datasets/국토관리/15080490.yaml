summary_user: 부산광역시 도시공간정보시스템에 등록된 지하상가 시설물을 한 곳씩 담은 건별 원천 자료로, 지하상가명·소재지·도로구간명·관리기관·천정·측벽·바닥·출입구 재질·출입구 개수·가설일자를 담는다(CSV 파일 약 1.2KB 규모). 시민이나 분석가가 부산 시내 어느 도로 구간 아래에 어떤 지하상가가 있고 출입구가 몇 개인지, 언제 지어졌는지 확인하는 데 쓴다. 전역 조인 키는 없어서 도로구간명·행정동·소재지 같은 이름이나 같은 기관의 다른 도시공간정보시스템 시설물 자료와 이름 매핑으로만 이어 쓴다.
description_portal: 부산광역시 및 구.군에서 관리하는 도시기반시설인 도로, 상수도, 하수도 등의 시설물 정보를 GIS기반으로 데이터베이스화 하여 관리하는 도시공간정보시스템을 구축 운영하고 있습니다.본 자료는 부산 도시공간정보시스템에서 관리되고 있는 시설물인  지하상가의  지형지물번호, 지하상가명, 천정, 측벽, 바닥재질, 출입구개수 등 지하상가 시설 현황 자료를 추출한 자료 이며, 시설물 공사 등으로 변경사항 발생 시 시스템 DB를 현행화 하고 있며, 이를 바탕으로 추출된 자료 입니다.(지하상가명, 지하상가 위치의 도로구간명, 소재지, 지하상가 출입구개수, 관리기관, 지하상가의 천정 바닥 등의 재질 등)
