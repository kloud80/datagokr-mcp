summary_user: 경상남도 남해군 관내에 등록된 제조업 공장을 한 행에 한 곳씩 담은 파일(csv, 약 10KB)로, 회사명·대표자명·공장 대표 주소·전화·팩스·업종명·생산품을 담는다. 남해군에서 특정 품목을 만드는 공장이나 거래·협력 상대를 찾는 사업자, 군내 제조업 업종 구성을 살피는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어, 다른 공장등록 자료나 기업 데이터와는 회사명·주소 문자열 매칭으로만 연결한다.
description_portal: 경상남도 남해군 관내에 등록된 제조업공장 현황자료 입니다. 개방할 데이터 항목으로는 회사명, 대표자명, 공장대표주소지, 연락처(전화번호, 팩스번호), 업종명, 생상품의 정보를 포함하고 있습니다. 회사명, 대표자명, 공장 대표 주소를 통해 사업체 위치와 운영 주체를 확인할 수 있으며, 전화번호와 팩스번호는 연락 수단으로 활용됩니다. 업종명과 생산품 정보는 해당 공장의 주요 산업 분야와 생산 품목을 파악하는 데 도움을 주어 산업 분석, 기업 네트워크 구축, 정책 수립 등에 활용 가능합니다. 이 데이터는 경제과 일자리지원팀에서 관리하고 있는 데이터 입니다.
