summary_user: 부산광역시 사하구가 옥외광고물 적법 여부를 확인하려고 실시한 전수조사의 대상 사업장·시설을 한 건씩 담은 원천 목록으로, 업체명과 읍면동 단위 행정구역, 지번(주번지·부번지)·도로명주소(도로명·건물번호)를 담는다. 구청 광고물 담당자나 분석가가 사하구 어느 동, 어느 도로에 전수조사 대상 광고 업소가 몰려 있는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소(도로명+건물번호 또는 읍면동+번지)를 주소 체계에 맞춰 매칭하거나 업체명으로 맞춰 이어 쓴다.
