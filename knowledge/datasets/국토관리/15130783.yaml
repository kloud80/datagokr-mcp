summary_user: 경기도 공유재산 중 토지 형태의 행정재산을 재산 한 건씩 담은 목록으로, 재산번호·재산 형태와 종류·행정재산 구분·지번코드·재산관리관과 위임관리관·대부 여부와 대부 면적·지목·토지면적을 포함한다. 경기도 내 공공용 토지가 어디에 얼마나 있고 대부되어 활용 중인지 확인하려는 분석가나 재산 관리 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 지번코드(lotno_cd)나 지목 이름·코드를 매핑하거나 같은 기관 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 공유재산 중 토지 형태의 행정재산 정보를 수록한 자료로, 경기부동산포털에서 제공됩니다. 각 항목은 재산의 고유번호, 재산형태 및 종류, 행정재산의 세부 구분, 지번코드, 관리 주체(재산관리관, 위임관리관), 대부 여부 및 총면적, 지목, 토지면적 등의 내용을 포함합니다. 이 데이터는 특히 공공용도로 사용되는 토지를 중심으로 하며, 대부 여부와 면적 정보가 포함되어 있어 공공재산의 활용 상태와 공간 자산 현황 파악에 유용합니다. 재산 관리 및 정책 수립 시 필요한 기초자료로 활용될 수 있습니다.
