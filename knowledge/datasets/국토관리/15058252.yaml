summary_user: 경기도 시군별로 선정된 정보화마을을 마을 한 곳당 한 행으로 담고, 마을명·특산품·체험상품·연락처·홈페이지·도로명·지번주소·위경도 좌표를 포함한다. 농촌 관광이나 체험 프로그램을 기획하는 사람이 "우리 시군 근처에 어떤 특산품과 체험상품을 내놓는 정보화마을이 있나"를 확인하는 데 쓴다. 실측상 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)나 주소 문자열, 위경도 좌표로 다른 경기도 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 2024년 6월 12일 기준으로 경기도 내 시군별로 선정된 정보화마을의 현황을 제공하는 자료입니다. 정보화마을은 정보기술 인프라에서 상대적으로 소외된 농촌, 어촌, 산촌 등을 대상으로 초고속 인터넷 환경을 구축하고, 지역 특산품의 전자상거래 활성화, 정보콘텐츠 개발 등을 통해 지역주민의 정보 활용 능력을 높이고 실질적인 소득 창출을 유도하는 사업입니다. 주요 항목에는 마을명(VILAGE_NM), 시군명(SIGUN_NM), 특산품정보(SPECLPROD_INFO), 체험상품정보(EXPRN_GOODS_INFO), 연락처(CONTCT_NO), 홈페이지주소(HMPG_ADDR), 소재지 도로명주소 및 지번주소, 위경도 좌표 등이 포함되어 있습니다.이 자료는 정보화마을의 지역 특성과 콘텐츠를 파악하여 정책 지원 방향을 설정하거나 농촌 관광 및 체험형 콘텐츠 기획, 로컬 브랜드 육성 전략 수립 등 다양한 분야에 활용할 수 있습니다. 특히 특산품 및 체험상품 정보는 지역 고유의 산업과 문화를 반영하며, 이를 기반으로 온라인 유통 활성화, 체험형 관광 콘텐츠 개발, 교육 및 체험 프로그램 운영 등과 같은 지역경제 활성화 전략의 기초자료가 됩니다. 공공기관, 지역활성화단체, 관광 관련 기관, 창업 예비자 등이 활용할 수 있으며, 데이터는 Open API 방식으로 제공되어 정기적인 모니터링과 활용이 가능하고, 지역 디지털 격차 해소 및 정보접근성 증진이라는 행정 목적에도 부합합니다.
