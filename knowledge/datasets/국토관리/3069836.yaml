summary_user: 전국 산업단지별로 유치가 허용된 업종의 배치를 도면으로 담은 자료로, 단지코드와 한국표준산업분류 10차 중분류 기준 유치업종코드, 업종별 위치·면적 도형을 포함하며 vworld에서 시도별 파일로 내려받는다. 기업이 특정 업종으로 어느 산업단지의 어느 구역에 입주할 수 있는지 검토하거나, 분석가가 단지 안 업종 집적 분포를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 산업단지 일반현황·경계도면 같은 산업단지코드 원장과는 단지 이름이나 단지코드를 매핑해 잇는다.
limits: 포털 활용신청과 별개로 vworld.kr에 로그인해 시도별 파일을 받아야 하고, 실측 파일은 XLSX였다. 다른 데이터와 바로 붙는 공통 키가 확인되지 않아 이름·코드 매핑 작업이 필요하다. 이 세부 부문은 산업단지 현황·입주기업 중심이며 용지 분양·미분양, 개발·조성 정보는 다루지 않는다.
