description_portal: 산업단지 유치업종도면은 산업단지 내에 유치가 허용된 업종의 공간 배치를 지도 도면(Shape 파일) 형태로 제공하는 공공데이터입니다. 이 데이터는 각 산업단지의 고유 식별자인 단지코드, 유치 가능한 업종을 한국표준산업분류(KSIC) 10차 중분류 기준으로 나타낸 유치업종코드, 그리고 업종별 실제 위치와 면적을 지도상에 표현한 유치업종 도형 정보를 포함하고 있습니다. 사용자는 GIS(지리정보시스템) 프로그램을 통해 산업단지 내 업종별 공간 배치를 시각적으로 확인하고 분석할 수 있으며, 유치업종 간의 연계성, 분포 특성, 개발 가능성 등을 평가할 수 있습니다. 이 도면은 산업입지 정책 수립, 기업의 입주 타당성 검토, 업종 간 집적 분석, 지자체의 산업단지 관리 및 전략 수립 등에 활용도가 높습니다. 특히 업종별 집적도와 산업 간 시너지 효과를 고려한 산업단지 공간계획 수립에 유용한 자료입니다.
