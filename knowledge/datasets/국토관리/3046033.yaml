description_portal: '이 데이터는 2026년 1월 26일을 기준으로 충청남도 부여군 내에 조성된 주요 **농공단지(산업단지)**의 운영 및 관리 실태를 집약하고 있습니다. 데이터에는 은산, 임천, 장암, 홍산 등 부여군의 핵심 산업 구역별로 단지 명칭, 구체적인 위치(도로명 일원), 전체 면적($m^2$) 정보가 포함되어 있습니다.특히 각 단지가 언제 처음 승인되었는지를 나타내는 승인일자와 더불어, 해당 단지에 입주할 수 있는 **주요 업종(예: 활성탄 제조, 건축자재, 금속 조립 등)**이 명확히 구분되어 있습니다. 또한, 관리 주체인 충청남도 부여군의 담당 부서 연락처와 함께, 계획된 입주 가능 업체 수 대비 현재 입주 업체 수를 비교할 수 있는 수치 정보가 담겨 있습니다. 이 데이터를 통해 부여군이 전략적으로 육성하는 산업 분야와 각 단지의 활성화 정도(입주율)를 한눈에 파악할 수 있으며, 기업 유치 전략 수립이나 지역 경제 분석을 위한 핵심 지표로 활용될 수 있습니다.'
