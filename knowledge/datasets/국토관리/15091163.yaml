summary_user: 경상북도 경주시가 도로·지하시설물관리시스템에 등록한 시설물을 시설 구분, 관리번호, 설치일자 단위로 정리한 CSV 파일(약 64KB)로, 활용신청 없이 내려받는다. 경주시 도로 유지보수 담당자나 분석가가 "설치된 지 오래된 도로·지하시설물이 어떤 구분에 얼마나 몰려 있는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설 구분 이름을 맞추거나 같은 경주시 자료끼리 대조하는 방식으로만 이어 쓴다.
