description_portal: 대구광역시 상수도사업본부에서 2023년 1월 1일부터 2023년 12월 31일까지 접수된 민원건수를 시스템별, 접수방법별, 사업소별로 집계한 자료입니다. 대구광역시 상수도사업본부는 시민들의 상수도 관련 불편사항을 신속하게 해결하기 위해 민원 접수 채널을 운영하고 있습니다. 상수도 사이버민원센터(https://cyber.dgwater.go.kr)를 통하여 급수공사신청, 급수중지/해제/폐전 신청, 명의변경신청, 수도요금 이의신청, 계량기교체신청, 옥내누수감면신청, 옥내누수 탐사신청, 수도요금 자동이체 신청/변경/해지, 전자고지 신청, 수질검사신청 등 다양한 민원을 신청할수 있습니다.
