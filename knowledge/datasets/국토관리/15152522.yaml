summary_user: 한강홍수통제소 AI 홍수예보시스템이 중기 침수위험 예측을 위해 전국 시군구별로 13개 시나리오(멤버 0~12)에 따라 계산한 예측 유량을 기준 일시별로 담은 모델 산출 자료이며, 한 행에 여러 시점의 유량값(유량0~유량40)이 가로로 이어진다. 홍수 대응 분석가나 지자체 담당자가 '우리 시군구에 며칠 뒤 유출량이 시나리오별로 얼마나 커질 수 있는가'를 비교하는 질문에 쓴다. 전역 조인 키가 없어 시군구명칭을 행정구역 코드표나 다른 시군구 단위 자료와 이름으로 매핑해 이어 쓴다.
