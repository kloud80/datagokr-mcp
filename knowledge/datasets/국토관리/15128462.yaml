summary_user: 경기도 시군구 간 유출 인구를 기준연월(crtr_ym)·요일 구분·출발 시간대·이동수단·성별·연령대별로 나눠 인구수로 집계한 자료로, 출발 시군구의 중심 좌표를 함께 담는다. 교통·도시계획 분석가가 '어느 시군구에서 평일 출근 시간대에 어떤 이동수단으로 어느 연령층이 많이 빠져나가는가' 같은 생활권 유출 흐름을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 코드·이름 매핑이나 같은 기관 코드로만 잇고, 중심 좌표로 GIS 경계 자료와 공간 결합하며, 코드 컬럼의 뜻은 경기도 민간데이터 규격서 데이터셋에서 확인한다.
description_portal: 이 데이터는 경기도 시군구 간 유출 인구를 이동수단별·성별·연령대별·시간대 기준으로 세분화해 집계한 자료입니다. 특정 지역에서 외부로 이동한 인구 규모를 월 단위·요일 구분과 함께 확인할 수 있고, 좌표값이 포함되어 GIS 기반 공간분석과 생활권 흐름 파악이 가능합니다.대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.다운로드 받으신 파일의 컬럼명에 대한 정보와 컬럼 중 코드에 해당하는 설명은 경기도 민간데이터 규격서 데이터셋에서 확인하실 수 있습니다.
