summary_user: 전국 토지에 지정된 용도지역·지구 현황을 일 단위로 갱신해 시도별 SHP 공간파일로 내려받는 자료로, 컬럼명은 A0~A11처럼 의미 없이 제공된다. 부동산 개발이나 건축 인허가를 검토하는 사업자·분석가가 '이 토지가 어떤 용도지역·지구에 속해 개발행위 제한을 받는가'를 확인하거나 도시계획 연구의 기초자료로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역명·코드 매핑이나 같은 기관(국토교통부) 코드로만 이어 쓰며, 해석 근거는 국토계획법의 용도지역·지구·구역 규정이다.
limits: vworld.kr 로그인 후 다운로드 페이지에서 시도별 파일로 받아야 하며 포털 활용신청이나 인증키로 호출하는 API가 아니다. 공통 조인 키가 없어 필지·건축물 데이터와 바로 결합되지 않고, 컬럼 의미가 명세에 없어 내용을 직접 확인해야 한다.
