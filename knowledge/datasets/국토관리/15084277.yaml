summary_user: 제주국제자유도시개발센터(JDC)가 운영하는 문화공간 '낭'의 2018년 기준 도서 구매목록으로, 도서 한 권(종)마다 도서명·저자·ISBN·출판사·발행연도·책수·단가·금액과 분야(비고)를 담은 건별 목록이며 연번은 1번부터 1058번까지다. 공공 문화공간의 장서를 어떤 분야 중심으로 얼마의 예산을 들여 구성했는지 확인하려는 도서관·문화공간 운영자나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, ISBN을 기준으로 다른 도서 서지 데이터와 대조하는 정도로 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 세미양 빌딩 내 문화공간 ‘낭’의 도서 보유 현황을 2018년 기준으로 정리한 자료입니다. 각 데이터 항목은 연번, 도서명, 저자1, 저자2, ISBN, 발행자(출판사), 발행연도, 종수, 책수, 단가, 금액, 견적금액, 비고로 구성되어 있으며, 총 연번은 1번부터 1058번까지로 다양한 주제의 도서가 수록되어 있음을 보여줍니다. 도서명, 저자명, ISBN 등은 각 책의 식별 정보를 제공하며, 발행자는 출판사 이름, 발행연도는 출간 시점을 나타냅니다. 종수는 도서 종류 수를, 책수는 해당 도서의 실제 보유 부수를 의미하며, 단가와 금액, 견적금액 항목은 도서 구매 단가와 전체 금액을 기반으로 예산 집행 내역을 확인할 수 있게 합니다. 비고 항목에는 에세이, 종합 베스트, 건강, 요가/체조 등 도서의 분류나 주제가 기재되어 있어, 장르별 분포나 도서 유형별 관심도 분석에 활용될 수 있습니다. 본 데이터는 문화공간 내 도서 구성의 다양성, 예산 운영 내역, 분야별 보유 비중 등을 파악하는 데 유용하며, 향후 도서 재구성, 주제별 프로그램 기획, 지역문화공간 운영 전략 수립 등에 기초 자료로 활용될 수 있습니다.
