summary_user: 울산광역시 관내 일반산업단지를 단지 한 곳당 한 행으로 정리한 소규모 집계 파일(csv 약 4KB)로, 위치·면적·사업기간·사업비·유치업종과 함께 공장 가동·비가동 입주업체 수와 가동률을 담는다. 기업 유치 담당자나 입지를 찾는 사업자, 지역 분석가가 "울산에서 어떤 업종을 유치하는 일반산업단지가 어디에 있고 가동률은 얼마인가"를 확인하는 데 쓴다. 산업단지코드 같은 전역 조인 키가 없어 전국산업단지 표준데이터나 국토부 산업단지 일반현황·경계도면과는 단지명 매핑으로만 이어 쓴다.
