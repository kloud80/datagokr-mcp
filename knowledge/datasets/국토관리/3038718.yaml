summary_user: 구리시 안에 설치·운영 중인 강우량계의 지점명·설치 위치·주소·위도·경도·관리기관을 지점 한 곳당 한 행으로 담은 시설 현황 파일이며, 강수량 측정값 자체는 들어 있지 않다. 구리시 풍수해 대비나 배수펌프장 운영을 검토하는 담당자나 분석가가 "우리 동네 근처 강우량계는 어디에 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지점명 매칭이나 위도·경도 기반 공간 결합으로 잇는다. 관측소코드(WAMIS 표준) 기반의 강수 시계열과 이을 때도 같은 방식으로 맞춘다.
description_portal: 강우량계현황 데이터는 구리시 내 설치되어 운영되고 있는 강우량계의 현황에 대한 데이터로, 강우량계는 빗물을 모아 높이를 읽거나 떨어지는 물방울의 양을 기계적으로 계수해 강수량을 산출합니다. 중복되지 않은 지점에 설치된 강우량계의 측정값을 토대로 구리시 내 풍수해 재난에 대비하기 위하여 설치되었으며,  강우량계의 측정값을 참고하여 배수펌프장을 운영하는 데에도 활용하는 등 재난 대비의 기초자료로 활용됩니다. 따라서 정확한 측정값을 산출하기 위하여 건물 옥상 등 방해요소가 적은 곳에 설치되어있습니다.또한 강우량계의 측정값은 구리시 재난 예경보시스템을 활용하여 정책과 행정에 활용하고 있으며, 설치 위치별 강우량 편차에 대한 데이터도 확인하는데 사용됩니다.
