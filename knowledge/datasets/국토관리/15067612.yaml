summary_user: 국토지리정보원이 항공사진을 촬영할 때 비행 한 번마다 남긴 세부 기록을 담은 전국 단위 CSV 파일(약 1.2MB)이다. 촬영일자·항공기번호·렌즈번호로 기록을 구분하고, 이착륙 시간·기지, 비행고도, 축척, 촬영 매수, 날씨·기류·풍향·풍속·기온 같은 촬영 조건을 담는다. 연구자나 공간정보 분석가가 특정 시기 항공사진이 어떤 고도·축척·기상 조건에서 찍혔는지 확인할 때 쓴다. 전역 조인 키는 없어서 다른 항공사진·정사영상 데이터와는 촬영일자나 항공기·렌즈 번호를 이름 그대로 맞춰 연결해야 한다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 촬영일자 등 값 매칭이나 같은 기관 코드로만 이을 수 있다. 촬영 위치 좌표가 없는 비공간 자료여서 기록만으로 어느 지역을 찍었는지 지도에 표시하지 못한다.
