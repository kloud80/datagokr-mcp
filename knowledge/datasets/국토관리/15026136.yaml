summary_user: 부산광역시 강서구 관내 등록 임대주택을 한 건씩 담은 파일로, 등록번호·최초등록일·임대물건지 주소와 임대주택의 구분·종류·유형, 영업구분을 개별 주소 단위로 제공한다. 임차인이 계약하려는 집이 등록 임대주택인지, 언제 처음 등록됐는지 확인하거나, 분석가가 강서구 안 등록임대 물량이 어느 지역에 몰려 있는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 임대물건지 주소나 관리 시군구명을 이름 기준으로 맞춰 이어야 하며, 이런 방식으로 전월세 실거래 자료와 함께 보는 것이 현실적이다.
limits: 공통 코드나 고유 식별자가 없어 다른 데이터와 자동으로 결합하기 어렵고, 주소 문자열을 정제해 맞춰야 한다. 범위는 부산 강서구 한 곳뿐이므로 다른 시군구와 비교하려면 별도 자료를 모아야 한다.
