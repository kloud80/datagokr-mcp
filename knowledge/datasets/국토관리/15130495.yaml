description_portal: 본 데이터는 한국가스공사 제주LNG본부의 월간 상수도 사용량을 지역별로 체계적으로 정리한 시설 운영관리 자료입니다. 통합본관동, 봉개GS, 한림GS, 상창GS, 광령VS, 제주BV 등 제주도 내 총 6개 LNG 공급시설의 월별 상수도 사용량을 계량기 검침 기준으로 정확하게 산정하여 제공합니다. 데이터 항목으로는 연월, 지역 및 시설명, 전월지침, 당월지침, 월간 사용량 등이 포함되며, 사용량 단위는 세제곱미터를 사용합니다. 2024년 7월부터 매월 정기적으로 업데이트되는 최신 자료로서 CSV 파일 형식으로 제공됩니다. 이 데이터를 통해 제주LNG본부 시설물의 월별 및 계절별 용수 사용 패턴을 분석하고, 절수 계획 수립 및 시설 운영 효율화 방안 도출에 활용될 수 있습니다.
