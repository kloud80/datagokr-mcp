description_portal: '이 데이터는 해외 주요 국가들의 수도 이전 사례 현황을 정리한 자료입니다.국가명, 기존 수도 도시, 이전 수도 도시, 이전 시기, 이전 사유, 이전 기관 정보를 포함하고 있으며, 미국·캐나다·호주·독일·브라질 등 다양한 국가의 수도 이전 배경과 과정, 행정기관 분산 현황을 확인할 수 있습니다.자료는 수도 이전의 역사적 맥락과 정책적 이유(예: 독립국가 상징성 확보, 안보 강화, 내륙개발 및 균형발전, 통일 국가 상징성 강화 등)를 제공하며, 각국이 수도를 이전하면서 어떠한 행정기관을 이전했는지도 함께 보여줍니다.이 데이터는 수도 이전의 정책적 효과와 한계를 비교·분석하는 연구, 국가 균형발전 및 수도 정책 수립, 세종시 행복도시 건설과 같은 행정수도 이전 정책의 국제적 비교 사례 연구 등에 활용 가능합니다.'
