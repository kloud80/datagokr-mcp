summary_user: 한국부동산원 청약홈에서 일반공급 접수를 대행한 아파트 분양 단지를 모집공고일 기준으로 모아, 전국 17개 시도별·기간별로 전용면적 3개 구간(60㎡ 이하, 60~85㎡, 85㎡ 초과)의 제곱미터당 평균 분양가를 담은 집계 파일입니다. 내 집 마련을 준비하는 국민이나 분석가가 '우리 시도의 중소형 아파트 분양가가 최근 몇 년 사이 얼마나 올랐나'를 비교할 때 쓴다. 전역 조인 키가 없어 지역명(시도)과 연도·기간을 기준으로 부동산원 가격지수나 HUG 분양가격 같은 다른 시도 단위 통계와 이름을 맞춰 연결한다.
limits: 시도 단위 평균값만 담아 단지별·시군구별 분양가는 알 수 없고, 실측 컬럼에서 표준 지역코드 같은 조인 키가 확인되지 않아 연결할 때 지역명을 직접 맞춰야 합니다. 명세상 월간 갱신이지만 실측 파일의 시간 컬럼은 연도·분기로 되어 있어 포털 설명(연월)과 단위가 다를 수 있으니 확인 후 쓴다.
