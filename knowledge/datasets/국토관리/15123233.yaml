summary_user: 경기도 광주시 도시계획정보시스템의 건축물 층별개요를 건축물대장 단위로 층마다 한 행씩 담은 파일로, 각 층의 구조(철근콘크리트·철골조 등), 용도(주거·상업·업무 등), 바닥면적(㎡)을 기록하며 CSV 파일 크기는 약 6MB이다. 광주시 안 특정 건물의 지하·지상 층별 용도와 면적을 확인하려는 부동산 평가 담당자, 용도변경 심사자, 건축 통계 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 건축물대장·토지 데이터와는 건축물대장 식별 정보(건축물 대장)나 같은 기관 코드를 이름으로 맞춰 이어야 한다.
description_portal: 본 데이터는 경기도 광주시의 도시계획정보시스템의 건축물 층별 개요 정보를 제공합니다. 각 건축물의 층별 구조, 용도, 면적 등 상세 정보를 담고 있어 건축물의 세부 현황을 파악할 수 있습니다. 건축물대장은 해당 건물을 식별하는 정보이며, 층은 지하층, 지상층 등 층수를 나타냅니다. 기타구조는 철근콘크리트, 철골조 등 건축물의 구조 형식을 표시하고, 기타용도는 주거용, 상업용, 업무용 등 각 층의 사용 용도를 나타냅니다. 면적은 해당 층의 바닥 면적을 제곱미터 단위로 제공합니다. 본 데이터는 건축물 관리, 부동산 평가, 용도 변경 심사, 건축 통계, 재산세 산정, 안전 점검 계획 등에 활용됩니다.
