summary_user: 서귀포시 각 마을이 추진하는 소득사업(가공식품·체험·카페 등)을 사업 한 건당 한 행으로 담은 작은 파일(약 1.4KB CSV)로, 읍면동·사업명·주소·연락처·판매방식·위도·경도를 포함한다. 주민이나 관광객이 '이 근처 마을에서 직접 사거나 체험할 수 있는 마을 사업이 어디 있나'를 찾거나, 지자체·분석가가 마을 소득사업의 읍면동별 분포를 지도로 보는 데 쓴다. 공통 조인 키는 없어서 읍면동 이름이나 주소·좌표를 기준으로 다른 서귀포시 마을·관광 데이터와 맞춰 이어 쓴다.
