description_portal: 이 데이터는 서귀포시 각 지역의 마을 단위에서 추진되는 소득 창출 사업 내역을 담고 있습니다. 항목에는 읍·면·동, 사업명, 주소, 판매 방식, 연락처, 위도·경도 등이 포함되어 있어 공간 기반 분석이 가능합니다 예시로 남원읍 ‘수망리물영아리고사리·동백방앗간’, 안덕면 ‘청정 콩이네 두부·양춘선 두부’, 표선면 ‘깊은 맛 된장’, 효돈동 ‘귤향과즐·수상레저체험’, 서홍동 ‘백년의 귤향기·Cafe 솜반내’ 등이 있습니다 이 자료는 지역 농산물 기반의 마을 경제 활성화, 소득 다양화 정책 설계, 마을 브랜드 개발, 직거래 기반 플랫폼 구축, 관광 체험 상품 연계 전략 수립에 활용될 수 있으며, GIS 시각화를 통해 공간적 입지 분석에도 유용합니다. 또한 주민 역량 강화와 민관 협력 사업 기획의 기초자료로도 활용 가능합니다.
