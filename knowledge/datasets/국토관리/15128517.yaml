summary_user: 중앙토지수용위원회 재결정보시스템에 등록된 수용재결·이의재결·사업인정 사건을 건별로 담으며, 사건번호·재결사업명·재결구분·재결일시·처리상태·시행자 코드를 전국 범위로 제공한다. 사업시행자나 토지소유자, 보상 분석가가 특정 개발사업의 토지수용 재결이 언제 어떤 상태로 처리됐는지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 공통 조인 키는 확인되지 않아, 사업명 문자열 매칭이나 시행자코드 같은 기관 내부 코드로만 개발사업·보상 관련 데이터와 연결한다.
limits: 전역 조인 키가 없어 다른 데이터셋과 정확히 결합하기 어렵고, 사업명 등 이름 매칭에 의존해야 한다. 지역 단위 정보 없이 전국·비공간 데이터라 지도나 행정구역별 분석에는 바로 쓰기 어렵다. 개발계정 호출은 일 10,000회로 제한된다.
