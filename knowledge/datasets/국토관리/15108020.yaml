description_portal: '서울특별시 마포구 관내 민간 건축공사 착공신고 현황에 대한 정보입니다.이 데이터에는 각 착공신고가 이루어진 실제 위치를 나타내는 대지위치(도로명주소)가 포함되어 있습니다.또한, 건축구분(예: 대수선, 신축, 증축 등), 착공처리일, 대지면적과 건축면적 및 연면적(단위: ㎡), 최대지상층수 및 최대지하층수, 주용도(예: 제1종 및 제2종 근린생활시설, 공동주택, 업무시설, 공동주택 등), 부속용도(예: 일반목욕장, 도시형생활주택, 일반음식점, 소매점 등)대한 세부사항도 제공됩니다. 이 데이터를 통해 주민들과 관련 기관은 마포구 내에서 진행 중인 민간 건축공사의 현황을 손쉽게 파악하고, 건축 활동에 따른 지역 변화를 신속하게 확인할 수 있습니다.'
