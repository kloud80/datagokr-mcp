summary_user: 전국 시군구별로 주거권역마다 적정 주택가격대(중위단위가격의 70~150%)에 들어가는 주택 공급 물량을 분석해 담은 집계 자료이며, 시도별 XLSX 파일로 제공된다. 시군구 주거정책 담당자나 분석가가 '우리 지역 권역별로 적정 가격대 주택이 얼마나 공급돼 있고, 민간주택 임차지원 소요는 어느 정도인가'를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시군구 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 파일 내 컬럼명이 '테이블정의서', 'Unnamed' 형태로 읽혀 명세상 필드 의미가 확인되지 않으므로 파싱할 때 헤더 행을 직접 확인해야 한다. 공공데이터포털 활용신청과 별개로 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일을 받아야 하며, 인증키는 필요 없다. 행정단위가 시군구이므로 읍면동 이하 단위 분석에는 쓰지 못한다.
