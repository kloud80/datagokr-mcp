summary_user: 김포시 관내 배수펌프장을 시설 한 곳당 한 행으로 담은 원천 목록으로, 소재지 지번, 설치일자·목적, 모터·엔진 펌프 규모와 대수, 한전 전원 공급방식·계약전력, 비상발전기 정보를 포함한다(csv 약 2KB). 집중호우 때 김포 어느 지역의 내수 배제를 어떤 펌프장이 맡고, 정전에 대비한 비상발전기가 갖춰져 있는지를 확인하려는 주민·방재 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 이름·주소 매칭하는 방식으로만 잇는다. 주소를 지오코딩해 침수흔적·하천 시설 자료와 겹쳐 보는 방식이 그 예다.
description_portal: 경기도 김포시의 배수펌프장현황에 대한 정보를 제공합니다. 제공 항목으로는 시군명, 시설명, 소재지지번, 설치일자, 설치목적, 모터펌프규모, 모터펌프대수, 엔진펌프규모, 엔진펌프대수, 한전전원공급방식, 비상발전기정보, 비상발전기대수, 한전계약전력정보, 데이터기준일자로 구성되어있습니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 안전기획관으로 연락주시기 바랍니다.
