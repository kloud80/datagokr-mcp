summary_user: 전국 하천을 하천 한 건 단위로 담은 목록 데이터로, 하천관리번호·하천명·본류와 지류(최대 6단계)·수계코드·하천등급과 함께 기점·종점 위치, 계획홍수량, 하폭, 연장, 유역면적을 담는다. 개발 예정지 주변 하천이 국가하천인지 지방하천인지, 어느 수계·본류에 속하는지 확인하려는 사업자나 재난·수자원 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 하천 시설·관측 데이터와는 하천명이나 수계코드 같은 이름·코드 매핑으로만 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 하천 정보로, 하천관리번호, 하천명, 본류, 지류, 수계코드, 하천등급코드, 하천기점값, 하천기점경계내용 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
