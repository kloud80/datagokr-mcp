description_portal: 본 데이터는 충청남도 도시계획정보(UPIS) 시스템에서 관리·제공하는 공공문화체육시설 현황 정보로, 현황도형관리번호, 라벨명, 면적_도형 등 공공 문화·체육시설의 공간적 특성과 관리 정보를 포함하고 있습니다. 현황도형관리번호는 각 시설 도형을 고유하게 식별하기 위한 관리용 번호로, 도시계획시설의 이력 관리와 변경 사항 추적에 활용됩니다. 라벨명은 시설의 명칭 또는 용도 정보를 나타내어 지도 상에서 시설 식별을 용이하게 하며, 면적_도형 정보는 시설의 공간적 규모를 정량적으로 파악할 수 있도록 지원합니다. 본 데이터는 문화·체육시설의 분포 현황 분석, 도시계획 수립, 주민 편의시설 확충 계획, 생활SOC 정책 추진, 공간 기반 행정 의사결정 지원 등을 위한 핵심 기초자료로 활용됩니다.
