summary_user: 충청남도 도시계획정보(UPIS)에서 관리하는 공공 문화·체육시설 도형을 한 건씩 담은 파일로, 도형마다 관리번호·시설 명칭(라벨명)·면적(제곱미터)·길이(미터)가 들어 있다(CSV 약 50KB). 도시계획 담당자나 분석가가 "충남에서 공공 문화·체육시설 면적이 어느 정도이고 어떤 시설이 있는가"를 따져 생활SOC 확충이나 도시·군계획시설 검토 자료로 쓴다. 실측 컬럼에 시군 코드 같은 전역 조인 키가 없어서 다른 데이터와는 라벨명 속 시설 이름을 맞추는 방식으로만 이을 수 있다.
