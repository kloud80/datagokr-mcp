summary_user: DMZ 및 인근 지역에 있는 카페를 한 곳당 한 건으로 정리한 파일로, 이름·주소·전화번호·위도·경도·법정동코드를 담으며 포털 설명상 총 1,785건이다. 관광객이나 지역 연구자가 '파주·연천·철원 등 접경지역 방문 때 들를 카페가 어디에 얼마나 있나'를 지도에서 확인하거나 지역별 분포를 세는 데 쓴다. 법정동코드(bjd_cd)로 행정구역 경계·인구·관광 통계 등 다른 지역 데이터와 잇고, 위도·경도로 관광지·숙박 등 위치 데이터와 공간 결합한다.
description_portal: '통일부에서 제공하는 ‘통일부_DMZ인근 지역 카페 정보 데이터’는 비무장지대(DMZ) 및 그 인근 지역에 위치한 카페들의 주요 정보를 정리한 데이터입니다. 이 데이터는 관광객, 현지 주민, 연구자 등 다양한 사용자들이 DMZ 인근 지역의 카페를 손쉽게 찾고 이용할 수 있도록 지원하는 것이 목적입니다.데이터는 총 1,785건으로, 이름, 주소, 전화번호, 위도, 경도 항목으로 구성되어 있습니다.이름: 카페의 공식 명칭을 제공하여, 사용자가 원하는 카페를 쉽게 식별할 수 있습니다.주소: 카페의 실제 위치 정보를 포함하여, 내비게이션이나 지도 서비스에서 목적지까지의 경로를 안내받을 수 있습니다.전화번호: 카페에 대한 문의 및 예약을 위한 연락처를 제공합니다.위도/경도: 카페의 정확한 위치 정보를 지도 기반 서비스와 연계해 제공함으로써, 사용자가 지도상에서 손쉽게 카페의 위치를 확인할 수 있도록 지원합니다.단, 전화번호 컬럼의 경우, 데이터 미집계, 개인정보 보호 등의 사유로 일부 정보가 누락될 수 있습니다.이 데이터는 지역개발 및 도시 분야에 해당하며, 관광지 방문, 지역 경제 활성화, 연구 및 통계 분석 등 다양한 목적에 활용될 수 있습니다.'
