summary_user: 경상남도 거제시에 등록된 공장을 한 건씩 담은 파일로, 소속 산업단지명·회사명·지번 대표주소·생산품·업종명·데이터기준일자를 담는다(CSV 약 20KB). 거제시 어느 산업단지에 어떤 업종의 공장이 모여 있고 무엇을 생산하는지 파악하려는 분석가·사업자·주민의 질문에 쓴다. 실측 컬럼에 사업자번호·업종코드·필지고유번호 같은 전역 조인 키가 없어, 다른 데이터와는 회사명·단지명·지번주소를 이름 매칭하거나 주소를 지오코딩해 이어 쓴다.
