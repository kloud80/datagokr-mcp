summary_user: 한국서부발전이 복합발전소를 건설하면서 거친 인허가·신고 사항을 관계법, 조항, 인허가관청, 신청시기, 처리기간과 함께 한 행씩 정리한 목록이며, 약 11KB 분량의 CSV 파일로 제공된다. 발전소나 대형 플랜트 건설을 준비하는 사업자·실무자가 "어떤 법에 따라 어느 관청에 언제 무엇을 신청해야 하고 처리에 얼마나 걸리나"를 미리 파악하는 체크리스트로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관계법 이름이나 인허가관청 이름을 문자열로 맞춰 법령 정보·기관 정보와 이어 쓰는 수준에 그친다.
limits: 특정 발전소 사업에서 추진한 인허가 목록을 정리한 것으로, 지역 구분이 없는 비공간 자료라 지역별·사업장별 비교에는 쓰기 어렵다. 공통 코드나 키가 없어 다른 데이터와 자동으로 결합하려면 법령명·기관명을 직접 맞춰야 한다.
