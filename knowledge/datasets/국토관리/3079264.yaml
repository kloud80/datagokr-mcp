summary_user: 경기도 광주시에 등록된 제조업 공장을 한 곳당 한 행으로 담은 파일로, 회사명·공장 대표주소·전화번호·주요 생산품·데이터 기준일자를 담는다. 광주시 안에서 특정 품목을 만드는 공장이 어디에 몰려 있는지 찾거나, 협력업체·납품처 후보를 고르려는 사업자와 지역 제조업 현황을 보려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 공장등록·기업 데이터와는 회사명이나 주소를 맞춰 붙여야 한다.
description_portal: 본 데이터는 경기도 광주시에 등록된 공장의 현황 정보를 제공합니다. 제조업을 영위하는 공장의 등록 정보를 담고 있어 지역 산업 현황 파악과 관리에 활용됩니다. 회사명은 공장을 운영하는 기업의 명칭이며, 공장 대표주소는 공장이 위치한 주소를 제공합니다. 전화번호는 공장 연락처를 안내하고, 생산품은 해당 공장에서 제조하는 주요 제품을 나타냅니다. 데이터 기준일자는 정보의 최신성을 확인할 수 있습니다. 본 데이터는 지역 산업 분석, 제조업 현황 파악, 공장 관리 감독, 산업 통계 작성, 경제 정책 수립, 기업 지원 사업 등에 활용됩니다.
