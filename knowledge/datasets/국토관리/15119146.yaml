summary_user: 진안군 도시계획정보시스템(UPIS)의 건축물 주제도 가운데 층수 구분을 건물 단위로 담은 원천 파일(csv, 약 866KB)로, 공간정보 관리번호, 건물의 좌표 범위(X·Y 최솟값·최댓값), 건물군 관리번호, 필지고유번호, 층수를 담는다. 진안군 안에서 특정 필지에 몇 층짜리 건물이 있는지 확인하려는 토지·건축 실무자나, 군 단위 건물 높이 분포를 보려는 도시계획 분석가가 쓴다. 명세상 필지고유번호(PNU) 필드가 있지만 실측 컬럼에서는 전역 조인 키가 확인되지 않아, 다른 데이터와는 이름·코드 매핑이나 같은 기관(진안군) 자료끼리만 연결할 수 있다.
limits: 진안군 한 개 시군구의 필지·건물만 담으므로 다른 지역과 비교하려면 별도 자료가 필요하다. 수시·이벤트 주기로 만들어진 뒤 바뀌지 않는 자료이고 포털상 기준일자가 2023년 8월 18일이라, 이후 신축·증축은 반영되지 않았을 수 있다. 실측에서 전역 조인 키가 확인되지 않았으므로 PNU로 다른 데이터와 붙일 때는 값 형식을 먼저 점검해야 한다.
