summary_user: 영산강홍수통제소 관할(영산강·섬진강·동진강·만경강·탐진강 유역과 제주 하천) 수위관측소의 월별 최고·최저·연평균 수위와 강수관측소의 1일·2일·3일 최대 강수량, 유역별 강수량을 관측소별로 묶은 연간 통계 파일(zip, 약 1.3MB)이다. 분석가나 지자체 담당자가 '2024년 영산강 특정 지점의 최고 수위는 언제 얼마였나', '섬진강 유역의 최대 2일 강수량은 얼마였나' 같은 하천 수문 이력과 홍수·가뭄 기준을 확인하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 홍수통제소 수문통계나 관측소 목록과는 관측소 이름을 맞춰 연결해야 한다.
description_portal: 환경부 영산강홍수통제소 수문통계자료는 영산강홍수통제소에서 측정하는 수문자료에 대한 통계 정보입니다.영산강홍수통제소 관할 행정 구역은 전라북도, 전라남도, 광주광역시, 경상남도 일부(하동군), 제주도 입니다.영산강홍수통제소 관할 수계 유역은 영산강, 섬진강, 동진강, 만경강, 탐진강 및 제주도에 위치하고 있는 하천입니다.주요 수문자료는 수위, 강수량 등이며, 국가수문자료 생성, 홍수예보 및 갈수예보 등에 활용하고 있습니다.제공되는 정보는 영산강홍수통제소 관할 수위 관측소에서 측정한 월별 최고, 최저, 년별 평균 수위 통계 자료, 강수관측소에서 측정한 관측소별 1일최대, 2일 최대, 3일최대 및 유역별 강수량 통계자료입니다.
