summary_user: 여수시 관내 건축 인허가를 행위(신축, 증축·개축·이전·대수선, 용도변경)와 구조(콘크리트, 철골, 조적, 철골철근, 목구조, 기타)별로 나눠 '구분' 항목마다 집계한 표로, 건별 원천이 아닌 시군구 단위 집계 파일(csv, 약 3.4KB)이다. 지역 분석가나 건설·부동산 사업자가 여수시에서 어떤 구조의 신축과 용도변경이 얼마나 일어나는지 보며 지역 개발 흐름을 가늠하는 선행 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군구 건축허가 현황이나 건축물대장 자료와는 지역명·구분 항목 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 전라남도 여수시 관내에서 2025년 상반기 기준으로 집계된 건축 인허가 현황을 제공합니다. 건축 행위는 신축, 개축, 이전, 증축, 대수선, 용도변경으로 구분되며, 각 항목에 대해 건축물의 구조와 용도별로 세분화된 정보를 포함하고 있습니다. 데이터는 '신축/대수선', '이전', '개축', '증축/용도변경'의 항목별로 정리되어 있어 건축 유형별 현황을 직관적으로 파악할 수 있습니다. 본 자료는 2025년 5월 31일을 기준으로 작성되었으며, 매년 1회 업데이트를 통해 최신 자료로 갱신됩니다. 다음 갱신 예정일은 2026년 6월 1일입니다. 이 데이터는 여수시 내 건축물 현황을 이해하고 분석하는 데 유용한 기초자료로 활용될 수 있습니다.
