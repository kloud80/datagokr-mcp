summary_user: 경기도 데이터분석시스템이 제공하는 연립·빌라 매매 실거래 원천 자료로, 거래 한 건마다 주소·지번, 단지명, 전용면적, 대지권면적, 계약연월·계약일, 거래금액, 층, 건축년도, 도로명을 담는다. 경기도 안 특정 시군이나 동네의 빌라 매매가가 연도·월별로 어떻게 움직였는지, 비슷한 면적·건축년도의 빌라가 얼마에 거래됐는지를 확인하려는 실수요자와 주거정책·시장 분석가가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 주소·지번(본번·부번)이나 도로명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 연립빌라 매매 실거래가 원천 기본정보로, 실제 거래된 부동산의 계약 내역을 집계한 자료입니다. 주요 항목은 주소, 단지명, 전용면적, 대지권면적, 계약연월, 거래금액, 층명, 건축년도, 도로명 등이 포함되어 있으며, 특정 연도와 월별 거래 특성을 확인할 수 있습니다. 이 데이터는 주거정책 수립, 지역별 부동산 시장 동향 분석, 투자 연구, 주택 가격 예측 모델 개발 등에 활용될 수 있으며, 특히 연립빌라 거래 현황을 체계적으로 파악할 수 있는 기반 자료로 활용할 수 있습니다.
