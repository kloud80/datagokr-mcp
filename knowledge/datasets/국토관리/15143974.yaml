summary_user: 한국산업기술시험원이 2024년 8~9월 식물공장(컨테이너 2개 동)에서 측정한 인입 3상 전류 중 S상 전류를 측정일시별로, 동별 메인값과 에어컨·공조기·양액기·조명·LED 등 설비별 값으로 담은 측정 원천 CSV 파일(약 33MB)이다. 스마트팜 연구자나 에너지 분석가가 "식물공장에서 어떤 설비가 언제 전류를 많이 쓰고, 상 간 부하 불균형이나 이상 전류가 있는가"를 분석하거나 대기전력·소비 예측 모델을 만드는 데 쓴다. 전역 조인 키가 없어 공장등록·기업 데이터와 직접 연결되지 않으며, 같은 기관이 낸 R상·T상 전류 데이터와 측정일 기준으로 맞춰 3상 분석에 이어 쓰는 방식이 현실적이다.
limits: 사업자번호·지번 같은 전역 조인 키가 없어 공장등록 원부나 다른 행정 데이터와 키로 연결할 수 없다. 특정 식물공장 컨테이너 2개 동의 측정값이라 전국 단위 통계나 공장 현황으로 해석하면 안 된다.
