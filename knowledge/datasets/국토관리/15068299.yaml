description_portal: '한국부동산원(구.한국감정원)에서 제공하는 부동산거래현황 중 주택매매 거래현황의 연도별 주택유형별 데이터입니다.* 주택매매 거래현황 : 건축물거래통계 중 건축물 대분류가 일반단독,다가구단독,다세대, 연립, 아파트이고 거래원인이 매매인 건축물의 동(호)수 및 건축물면적* 동(호)수 : 단독, 다가구(동수) + 아파트, 연립, 다세대(호수)* 면적 : 단독주택, 다가구주택( 연면적 ) + 아파트,연립,다세대(전용면적)<부동산거래현황 개요>ㅇ 국가통계 승인번호 : 제315003호ㅇ 법적근거 : 부동산 거래신고 등에 관한 법률 제 25조 및 시행령 제 19조의 4ㅇ 통계목적 : 토지, 건축물 등 부동산거래에 대한 정확한 정보를 수집·작성하여 부동산정책의 기초자료로 활용ㅇ 통계주기 : 월ㅇ 조사지역 : 전국ㅇ 조사방법 : 전국 시·군·구 신고자료 취합 및 집계ㅇ 공표주기 : 매월ㅇ 공표시기 : 토지 : 익월 25일경 / 주택 : 익월 말일경'
