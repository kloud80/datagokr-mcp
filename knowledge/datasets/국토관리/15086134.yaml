summary_user: 국토지리정보원이 운영하는 상시관측소의 관측데이터(RINEX)를 GAMIT-GLOBK로 정밀 분석한 좌표 결과를 관측일자·관측소별로 담은 CSV 파일(약 32MB)이며, 지구중심좌표(X·Y·Z), 위도·경도, 타원체고, 평면직각좌표(TM)와 투영원점을 포함한다. 측량·측지 분석가가 특정 상시관측소의 좌표가 날짜에 따라 어떻게 변했는지(지각 변동, 관측소 안정성)를 확인하는 데 쓴다. 전역 조인 키는 없어 상시관측소 RINEX ID나 관측소 명으로 다른 측량기준점·관측소 자료와 이름 매칭해 이어 쓴다.
limits: 다른 데이터와 바로 붙일 공통 코드가 없어 관측소 ID·이름 매핑이 필요하다. 갱신 주기는 확인되지 않았다.
