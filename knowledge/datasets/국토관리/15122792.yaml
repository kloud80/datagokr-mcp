summary_user: 충청남도 청양군 관내 용도지구 현황을 담은 시군구 단위 파일(zip, 약 60KB)로, 포털 설명상 현황도형 관리번호와 도형 대분류코드 등이 들어 있다. 청양군에서 땅을 사거나 개발을 검토하는 사람이 경관·취락·보호지구 같은 용도지구가 어디에 어떻게 지정됐는지 살피거나, 분석가가 군 단위 용도지구 분포를 정리하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지구 이름·분류코드를 맞춰 붙이거나 같은 기관 코드로만 연결한다.
description_portal: 해당 데이터는 충청남도 청양군 관내에 소재하는 용도지구 현황을 나타내는 자료로,용도지구 현황 데이터 활용 수요 증가에 따라 주목받고 있는 용도지구 현황 데이터의 상세 정보를 제공합니다.데이터 항목에는 현황도형 관리번호, 도형 대분류코드 등이 포함되어 있으며,이를 통해 각 용도지구 현황의 상세 정보를 파악할 수 있고, 관련 자원 연계에도 활용할 수 있습니다.이 자료는 지역 활성화 정책 수립, 용도지구 현황 개발 등의 기초 자료로 활용될 수 있으며,도시와 농촌 간의 교류를 확대하고 용도지구 현황 활성화를 도모하는 데 기여할 수 있습니다.청양군의 용도지구 현황을 한눈에 파악할 수 있는 유용한 자료입니다.
