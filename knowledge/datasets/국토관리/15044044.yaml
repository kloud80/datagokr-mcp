description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 2018년 4월 30일 기준으로 관리한 제주영어교육도시 내 토지 분양 현황을 정리한 자료입니다. 각 데이터 항목은 구분, 전체토지 필지수, 전체토지 면적, 공급토지 필지수, 공급토지 면적, 미공급 토지 필지수, 미공급 토지 면적으로 구성되어 있으며, 구분 항목에는 단독주택, 공동주택, 근린생활시설, 상업시설, 업무시설, 국제학교, 기타교육, 문화시설, 방송통신, 주차장 등이 포함되어 다양한 용도별 토지 분양 현황을 파악할 수 있도록 되어 있습니다. 전체토지 항목은 계획된 총 필지 수와 면적을 나타내며, 공급토지는 실제로 분양된 필지 수와 면적, 미공급토지는 아직 분양되지 않은 잔여 필지 수와 면적을 의미합니다. 이 데이터는 제주영어교육도시의 용도별 개발 진행률, 분양 실적, 미분양 현황 등을 종합적으로 파악할 수 있어 토지 이용계획 수립, 공급 전략 조정, 투자유치 대상지 선별, 도시개발 단계별 성과 분석 등에 유용한 기초자료로 활용될 수 있습니다.
