description_portal: 기계설비성능점검업은 「기계설비법」에 따라 일정 규모 이상의 건축물에 설치된 기계설비의 성능을 점검하여 안전하고 효율적인 운전을 유도하기 위한 전문 업종입니다. 이 업종을 영위하려면 국토교통부에 등록해야 하며, 일정 자격을 갖춘 기술인력과 장비를 보유해야 합니다. 등록 요건에는 자본금 1억 원 이상, 특급·고급·중급 이상의 책임기계설비유지관리자 각 1명 이상, 적외선 열화상카메라 등 21종의 장비 보유가 포함됩니다. 이러한 점검을 통해 건축물의 기계설비가 적절히 유지·관리되어 에너지 효율성과 안전성을 확보할 수 있습니다.
