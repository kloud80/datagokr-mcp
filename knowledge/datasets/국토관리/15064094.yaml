summary_user: 경기도시장상권진흥원이 정한 경기도 내 골목상권을 상권 단위로 담은 집계 데이터로, 상권명·상권 영역 다각형(multi_region_info)·업종 정보·점포 수·위경도를 제공한다. 창업을 준비하는 사업자나 지역 상권 분석가가 '우리 동네 주변 골목상권은 어디까지이고 어떤 업종 점포가 몇 개나 모여 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상권명 같은 이름 매핑이나 위경도·영역 다각형을 이용한 공간 대조로만 연결한다.
description_portal: '경기도시장상권진흥원에서 제공하는 경기도 내 골목상권 현황입니다. 다중지역정보(polygon)를 통해 상권 별 영역 정보를 함께 제공합니다.상권명, 다중지역정보, 업종정 등에 대한 항목을 제공합니다.★골목상권이란?- 사전적 정의 : 대로변이 아닌 거주지 인근의 좁은 도로를 따라 형성되는 상업 세력의 범위를 의미함- 개념적 정의1. 대형 유통시설이 포함되지 않는 범위2. 주택이 밀집된 곳에 형성된 상권3. 왕복 4차로 이상의 대로변 뒷골목4. 도소매업, 음식점업, 서비스업을 영위5. 30개 이상의 도소매, 용역서비스업 밀집 지역'
