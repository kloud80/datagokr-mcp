summary_user: 천안시 도시계획정보시스템(UPIS)의 도로 현황 테이블을 도형 관리번호별로 라벨명, 면적, 길이로 담은 파일 데이터이다(CSV 약 207KB). 도시계획 실무자나 분석가가 천안시 도로 현황도형의 면적·길이 규모를 파악하는 데 쓴다. 실측 컬럼에서 다른 데이터와 맞출 전역 조인 키는 찾지 못했다. 그래서 라벨명 같은 이름을 매핑하거나 같은 기관(천안시) 자료끼리만 이어 쓴다.
description_portal: 청남도 천안시 도시계획정보시스템(UPIS)의 도로 현황으로 현황도형 관리번호, 라벨명, 면적 도형, 길이 도형의 항목을 제공합니다.도시계획정보시스템(UPIS)은 도시·토지·시설·경관 등 도시계획 전반의 정보를 통합 관리하기 위해 구축된 시스템입니다. 도시의 공간 구조와 이용 실태를 분석할 수 있도록 다양한 계획·관리 요소를 담은 정보시스템이며, 각종 공간정보와 행정정보를 체계적으로 기록하여 도시관리·정비·개발계획 수립을 지원합니다. 이의 중장기개방계획에 따라서 도로 현황 테이블을 데이터 개방하였습니다.
