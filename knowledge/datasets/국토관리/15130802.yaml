summary_user: 경기도 아파트 단지별·조사년월별로 난방·급탕·가스·전기·수도의 공용분과 개별분 비용, 정화조오물·생활폐기물 수수료, 입주자대표회의·선거관리위원회 운영비, 건물보험료 같은 공용관리비 항목을 담는다. 입주 예정자나 관리 분석가가 "우리 단지의 전기·난방 공용비가 비슷한 단지보다 많은가"처럼 단지 간 관리비 구조와 항목별 비중을 비교하는 데 쓴다. 단지코드(apt_cd)가 있으나 실측에서 전역 조인 키로 확인되지 않아, 실거래·공시·청약 등 다른 데이터와는 단지명 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 이 데이터는 경기도 아파트 단지의 공용관리비 내역을 다룬 자료로, 아파트코드와 단지명, 조사년월을 기준으로 난방·급탕·가스·전기·수도 등 에너지 관련 비용뿐만 아니라 정화조오물수수료, 생활폐기물수수료, 입주자대표회의 운영비, 건물보험료, 선거관리위원회 운영비와 같은 관리 항목별 지출 현황을 제공합니다. 이를 통해 단지별 관리비 지출 구조를 비교하거나 항목별 비용 비중을 분석할 수 있으며, 장기적으로는 에너지 효율성 평가, 관리비 절감 정책 마련, 입주자 의사결정 지원 등 다양한 활용이 가능합니다.
