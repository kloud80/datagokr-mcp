status: active
summary_user: 한국농어촌공사가 관리하는 전국 농업용 저수지를 저수지 한 곳당 한 행으로 두고, 저수지명·위치·유효저수량과 함께 날짜별 저수율을 열(2025-01-01부터 날짜마다 한 열)로 펼쳐 담은 CSV 파일(약 5.4MB)이다. 지자체 농정 담당자나 가뭄 분석가가 '올겨울 우리 시군 저수지 저수율이 얼마나 떨어졌나'처럼 지역별 저수 상황과 가뭄 위험을 확인하는 데 쓴다. 실측 컬럼에는 저수지코드 같은 전역 조인 키가 없어 다른 데이터와는 저수지명·위치 문자열 매핑이나 같은 기관(농어촌공사) 자료로만 이어 쓴다.
limits: 공통 저수지코드·행정코드가 없어 댐 운영 자료나 기상·가뭄 자료와 붙일 때는 이름·위치 매칭을 직접 해야 하며 동명 저수지에 주의한다. 위치는 좌표 없이 비공간 정보로만 제공되고, 날짜가 열로 펼쳐진 넓은 형태라 시계열 분석 전에 행 형태로 바꿔야 한다.
