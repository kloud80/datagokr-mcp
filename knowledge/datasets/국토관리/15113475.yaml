description_portal: '- 한국농어촌공사는 깨끗한 농업용수를 안정적으로 공급하여 안전한 농업환경을 조성하고 있습니다.- 영농에 필요한 양질의 용수를 적기에 공급함으로써 농업생산성 향상에 기여하고 대농업인의 영농편의를 지원하고 있으며,- 한국농어촌공사에서 관리하고 있는 전국 저수지의 저수율을 일별로 관리하고 있습니다.- 본 개방데이터는 전국(시군구별 분류) 농업용 저수지의 일별 저수율, 유효저수량 현황을 제공합니다.-본 데이터는 수자원 관리 및 정책 수립, 환경 및 생태 모니터링, 기후변화 등의 연구 및 학술 자료로 활용될 수 있습니다.'
