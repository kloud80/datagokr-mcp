summary_user: 충청남도 내 공장(제조업체)을 한 곳씩 담은 목록으로, 업종명·업체명·주소·주생산품·전화번호·제공기관·기준일자를 업체 단위로 제공한다. 충남에서 특정 품목을 만드는 제조업체를 찾거나 시군별로 어떤 업종 공장이 모여 있는지 살펴보려는 사업자·분석가가 업종명·업체명·주소·주생산품을 조건으로 조회해 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 업체명·주소 문자열 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 팩토리온 공장등록이나 기업·토지 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 따른 오연결을 감안해야 한다. 범위는 충청남도에 한정된다.
