summary_user: 전국 공공 택지개발 사업지구별로 고시·공고된 토지이용계획의 변경 이력을 지구·이력 차수·용도 분류(대·중·소·상세분류) 단위로 담고, 용도별 면적 소계를 함께 제공한다. 개발사업 분석가나 부동산 사업자가 특정 택지지구에서 주택용지·상업용지·공공시설용지 면적이 계획 변경에 따라 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키는 없어 지구명이나 지구지정번호를 기준으로 같은 택지정보시스템의 다른 택지 데이터와 이름·코드 매핑으로 연결해야 한다.
limits: 표준 행정구역 코드나 필지 식별자 같은 전역 조인 키가 없어 다른 기관 데이터와 직접 결합하기 어렵다. 외부 사이트 인증키가 따로 필요하며, 이 인증키는 포털 활용신청과 별개로 발급받아야 한다.
