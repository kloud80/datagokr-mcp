summary_user: 진안군 하수처리장에서 내보내는 물의 수질을 날짜별 한 행으로 담은 건별 측정 파일로, 포털 설명상 2009년부터 2024년까지 BOD·TOC·SS·총질소·총인 값을 시군구 단위로 기록한다. 주민이나 환경 분석가가 '진안 하수처리장 방류수의 총인·총질소 농도가 해마다 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군구명이나 날짜를 기준으로 같은 지역의 강수·하천 수위 같은 관측 자료와 맞춰 이어 쓴다.
limits: 관측소코드 같은 표준 조인 키가 없어 다른 수질·수문 자료와는 이름이나 날짜로만 맞출 수 있다. 포털 설명에 따르면 2020년까지는 COD가 관리지표였고 2021년부터 TOC로 바뀌었으므로, 유기물 지표를 기간 전체에 걸쳐 그대로 비교하면 안 된다. 진안군 한 곳의 처리장 자료라 다른 시군과 비교하려면 별도 자료가 필요하다.
