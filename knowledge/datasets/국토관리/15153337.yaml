description_portal: '세종특별자치시시설관리공단은 은하수공원 장사시설을 이용하는 시민이 봉안당 사용 및 관리비 부과 현황을 투명하게 확인할 수 있도록, 봉안 관리비 관련 데이터를 제공합니다.이 데이터는 봉안시설 이용 현황과 관리비 변동 내역을 체계적으로 관리하기 위한 자료로, 다음과 같은 항목으로 구성되어 있습니다.봉안접수일: 봉안 신청이 접수된 날짜사용시작일: 실제 사용이 시작된 날짜변경사용종료일: 연장 또는 변경된 사용 종료일안치구분: 개인형, 부부형 등 봉안 방식 구분국내·해외 구분: 고인의 국적이 국내 또는 해외인지  여부최종관리비: 해당 봉안 건에 부과된 최종 관리비 금액이 데이터를 통해 시민은 봉안당 사용 기간과 관리비 산정 현황을 한눈에 확인할 수 있으며, 공단은 이를 기반으로 효율적인 장사시설 운영과 요금 체계의 투명성 강화를 추진하고 있습니다.세종특별자치시시설관리공단은 앞으로도 시민의 신뢰를 바탕으로, 공정하고 투명한 장사행정 구현과 봉안시설 관리 서비스 향상을 위해 관련 데이터를 지속적으로 공개·갱신해 나가겠습니다.'
