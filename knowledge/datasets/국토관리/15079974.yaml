summary_user: 대전광역시 중구 일반건축물의 지방세 부과기준인 시가표준액과 연면적을 과세연도별·물건지별(법정동·본번·부번·동·호)로 담은 건별 파일 데이터로, 범위는 중구 한 개 시군구의 필지·건물 단위입니다. 건물 소유자나 부동산 분석가가 '중구의 특정 건물 시가표준액이 연도별로 어떻게 바뀌었나'를 확인하거나 재산세 부담을 가늠하는 데 쓴다. 전역 조인 키는 없어서, 자치단체코드와 법정동·본번·부번 같은 지번 구성 요소를 맞춰 건축물대장이나 공시지가 등 다른 지번 기반 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구의 일반건축물에 대한 지방세 부과기준인 시가표준액을 확인할 수 있으며, 각 연도별 · 물건지 별로 데이터를 비교해서 볼 수 있습니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)해당 자료는 법정동, 본번, 부번, 동, 호수 등으로 구분하여 물건지별 시가표준액,연면적 등을 과세연도별로 확인하실 수 있습니다.주소는 도로명주소 또는 지번으로 기재되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
