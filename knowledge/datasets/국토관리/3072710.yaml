summary_user: 부산광역시 중구 관내 착공신고 건을 건축물별로 담은 건별 원천 파일로, 대지위치 주소, 대지·건축·연면적, 건폐율·용적률, 구조, 최고지상층수, 주용도와 건축허가·착공처리·사용승인 일자를 담는다. 중구에서 최근 어떤 용도와 규모의 건물이 착공에 들어갔는지, 허가부터 착공까지 얼마나 걸렸는지를 보려는 주민·사업자·지역개발 분석가가 개발 흐름의 선행 지표로 쓴다. 전역 조인 키는 없어서 대지위치 주소나 허가번호를 이름·코드 매칭해 건축물대장이나 다른 구의 인허가 데이터와 잇는다.
limits: 표준 행정코드나 건축물 고유번호 같은 전역 조인 키가 없어서, 다른 데이터와는 주소·허가번호 매칭이나 같은 기관 코드로만 연결된다. 범위가 부산 중구 한 곳이라 시 전체나 전국 비교에는 다른 시군구 자료를 따로 모아야 한다.
