description_portal: 전국 지하수 관련 데이터 제공 서비스에서 활용가능한 지자체(시군구별)의 명칭 및 코드 정보를 제공합니다. 해당 정보는 지자체명(시군구명), 시군구코드의 데이터를 포함하고 있습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있으며, 민간 기업 및 공공기관의 기술적 활용을 촉진하기 위해 제공합니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.
