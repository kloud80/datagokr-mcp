summary_user: 2022년 K-water 빅데이터 콘테스트 대상 수상작의 최종보고서와 분석 참조 데이터를 한 묶음(zip 파일 약 50MB)으로 담은 자료로, 관측소별 시계열이 아니라 관망해석 모델(EPANET·WNTR)과 유전알고리즘으로 배수관망 누수 의심 위치를 추정한 결과와 누수테스트 검증 결과 표를 담는다. 상수도 관망 분석가나 연구자가 '실측 수압과 해석 수압을 비교해 어느 절점에서 누수가 의심되는가'를 따져 보는 방법론 참고와 재현에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름 매핑이나 같은 기관 코드로만 연결할 수 있으며, WAMIS 관측소코드 같은 표준 키로 이어 붙이기는 어렵다.
description_portal: '2022년 K-water 빅데이터 콘테스트 대상 수상자 최종보고서 및 분석 참조 데이터를 1식으로 개방합니다.과제명 : 수압 데이터를 활용한 관로 누수위치 탐지 모델 구축요약 : EPANET 관망해석 모델의 Python 패키지인 WNTR(Water Network Tool for Resilience)과           유전알고리즘(Genetic Algorithm)을 연계하여 배수관망내 누수 의심 위치 탐지 프로그램 개발         - 관망해석모델의 해석수압(estimated)과 실측수압(measured)의 상관성이 최대가 되는 최적의 절점별 누수량 해를 GA를 이용하여 추정첨부자료를 활용한 데이터 기반의 관망 분석에 많이 활용되길 바랍니다.'
