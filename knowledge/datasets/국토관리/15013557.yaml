summary_user: 광주광역시 서구에 있는 개별(단독)주택의 공시가격을 주택 한 채(필지·건물) 단위로 담은 시군구 범위의 파일 데이터로, 지번·도로명주소·읍면동코드·기준월과 토지대장면적·산정대지면적·실제연면적·산정건물연면적, 공시가격이 들어 있다. 서구 단독주택 소유자나 분석가가 "우리 동네 단독주택 공시가격은 대지·연면적 대비 얼마이며 보유세·건보료 산정 기준이 어느 수준인가"를 확인하거나 동별 가격 분포를 비교하는 데 쓴다. 실측 컬럼에 전국 단위 조인 키(PNU 등)가 없어 다른 데이터와는 지번·도로명주소 같은 주소 매칭이나 읍면동코드를 통한 같은 기관 코드 기준으로만 이어 쓴다.
description_portal: 이 데이터는 광주광역시 서구에 소재한 개별주택에 대해 산정된 개별주택 공시가격과 관련 항목을 종합적으로 제공하는 공공데이터입니다. 각 주택별로 지번, 도로명주소, 읍면동코드, 기준월, 토지대장면적, 산정대지면적, 실제연면적, 산정건물연면적 공시가격등의 항목이 포함되어 있습니다.이러한 항목은 부동산 시세 분석, 과세표준 산정, 주택가격 통계 분석, 공시제도 검증 등의 행정 및 민간 활용에 있어 핵심적이며, 매년 기준일에 따라 정기적으로 갱신되는 특성을 갖고 있습니다. 특히 지목·지번 기반의 위치 식별성과 가격정보의 정량성을 동시에 담고 있어 부동산·주택시장 모니터링, 공시가격 현실화 정책 수립, 국세 및 지방세 산정 참고자료로 폭넓게 활용 가능합니다.
