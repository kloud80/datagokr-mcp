summary_user: 청약홈에서 일반공급 접수를 대행한 일반분양 단지를 모집공고일 기준으로 묶어, 연월·시도(전국 17개 시도)별 특별공급과 일반공급의 공급세대수·접수건수·경쟁률을 담은 집계 파일이다. 청약 대기자나 분석가가 '최근 몇 달 사이 우리 시도의 일반공급 경쟁률이 다른 시도보다 높았나'를 비교하거나 특별공급과 일반공급 수요를 견주는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 미분양·인허가·실거래 같은 다른 주택 통계와는 연월과 시도 이름을 맞춰 붙여 쓴다.
description_portal: 한국부동산원(구 한국감정원)의 청약홈에서 제공하는 지역별 청약 경쟁률  현황입니다.청약홈에서 일반공급 접수를 대행한 일반분양 단지를 기준으로 작성되었습니다.공공데이터 제공범위는 한국부동산원이 주택청약 업무를 수행한 2020년 2월부터 데이터 작성 기준 전월 말일까지로 모집공고일을 기준으로 집계하였습니다.* 컬럼별 상세설명- 연월→ 모집공고일이 포함된 연월- 시도 → 전국 17개 시도 기준- 특별공급 공급세대수  → 특별공급 공급세대수의 합- 특별공급 접수건수 → 특별공급 신청자수의 합- 특별공급 경쟁률 → 특별공급 접수건수/특별공급 공급세대수- 일반공급 공급세대수  → 일반공급 공급세대수의 합- 일반공급 접수건수 → 일반공급 신청자수의 합- 일반공급 경쟁률 → 일반공급 접수건수/일반공급 공급세대수※ 매월 25일, 전월까지의 데이터를 제공하며 전월 데이터는 향후 변동될 수 있습니다.
