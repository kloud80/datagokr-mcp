description_portal: '○ 통계개요* 통계명 : 주택현황(기존산정방식)* 통계종류 : 서울시 주택현황을 제공하는 일반ㆍ가공통계* 작성목적 : 생활을 같이하는 가구가 거주하는 공간으로써 종류별 주택현황을파악하여 주택관련 정책수립의 기초 자료로 활용하는 것을 목적으로 함* 조사체계 : 통계청 인구주택총조사 결과를 활용* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 주택현황(종류별 주택수) 등○ 용어설명* 단독주택 : 한가구가 생활할 수 있도록 건축된 일반단독주택과 여러 가구가 살 수있도록 설계된 다가구 단독주택을 말함* 아파트 : 한 건물내에 여러 가구가 거주할 수 있도록 건축되어진 5층이상의 영구건물로서 구조적으로 한 가구씩 독립하여 살 수 있도록 건축된 주택을 말함* 연립주택 : 한 건물내에 여러가구가 살 수 있도록 건축된 4층이하의 영구건물로서건축 당시 연립주택으로 허가받은 주택을 말함* 다세대주택 : 한 건물내에 여러 가구가 살 수 있도록 건축된 4층 이하의 영구건물로서 건물의 연면적이 200평 이하이면서 건축당시 다세대 주택으로 허가받은주택을 말함* 비거주용건물내 주택 : 영업용 목적으로 건축된 건물내에 사람이 거주할 수 있도록구획된 부분으로서 주택의 요건을 갖추고 있는 것을 말함. 단, 사람이 살고 있으나주택의 요건을 갖추지 못한 거처는 주택이외의 거처로서 주택에서 제외함'
