summary_user: 전용상수도 가운데 호소수를 수원으로 쓰는 시설의 연간 먹는물 법정수질검사 결과를 시설·채수일자 단위로 담은 파일(csv, 약 5KB)로, 전국 범위에서 시설별 소재지와 수원·시설용량, 일반세균·대장균·중금속·농약·휘발성유기화합물·경도·냄새·맛 등 검사항목 값을 담는다. 분석가나 주민이 '우리 지역 호소수 전용상수도 시설에서 대장균이나 납·비소가 검출됐는지, 해마다 수질이 어떻게 달라졌는지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 상수도·수질 데이터와는 시설명이나 소재지 주소를 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 매년 실시하는 전용상수도에서 호소수를 사용하는 먹는물 법정수질 검사 결과 입니다. 검사항목은 수도법을 기준으로 따르며 음용수 안전성 및 취약성 분석을 확인하기 위해 시행된 결과입니다. 이를 통해 호소수 기반 상수도의 수질 상태와 공급 안정성을 점검하고 대책을 마련할 수 있습니다. 본 자료는 취수원 관리가 취약한 지역의 음용수 안전 확보와 주민 신뢰 제고에 기여합니다.<제공항목>검사년도, 수도사업자, 시설구분, 시설명, 소재지, 수원, 시설용량, 채수일자 외 60여가지 항목 제공
