summary_user: 경상남도 창원시가 지정·관리하는 발달상권을 한 줄에 하나씩 연번과 위치로만 정리한 소규모 목록 파일(CSV 약 3KB)이다. 창업을 준비하는 사업자나 지역 분석가가 "창원시에서 발달상권으로 분류된 곳이 어디인가"를 확인할 때 쓴다. 실측 컬럼에는 행정코드 같은 전역 조인 키가 없어서, 다른 데이터와는 위치 문자열을 주소·지명으로 직접 맞추거나 같은 창원시 자료끼리 이어 써야 한다.
description_portal: 경상남도 창원시의 발달상권에 대한 목록입니다.연번과 위치에 대한 항목을 제공하고 있습니다.발달상권에 대한 위치가 필요하실 경우 참고하시기 바랍니다.발달상권 목록 데이터는 일정 기간 내에 경제·유동인구·상업 시설의 성장 측면에서 발전이 확인된 상권의 위치, 주요 업종 유형, 상권 규모, 유입 인구 특성, 상권 활성 지표 및 상권 성장 정도를 종합적으로 정리한 자료입니다. 이 데이터는 지역 내 상권 성장 패턴 분석, 상권 활성화 및 지원 정책 수립, 상업 인프라 투자 계획, 공공 상권 개선사업 설계, 민원 대응, 이벤트 또는 축제 영향 평가 등에 다양하게 활용될 수 있습니다. 특히 GIS 기반 시공간 분석과 결합하면 상권 확장 흐름을 시각화하거나 상권 비교 분석 시 기초자료로 기능합니다.
