description_portal: '이 데이터는 서울특별시 및 서울주택도시공사(SH공사)가 공동 소유한 공공한옥 중 일부에 대해 구축한 BIM(Building Information Modeling) 라이브러리 정보를 수록한 자료입니다. 2021년 기준으로 정리된 이 파일에는 한옥별 가옥명, 건축물 용도, 파일유형 및 파일명(예: IFC, RVT 등), 데이터 용량, 그리고 BIM 모델 내 부재(部材) 라이브러리 구성 정보가 포함됩니다. 구체적으로는 부재에 부여된 BIM 요소 ID 개수, 부재 개체 수량, 기타 참고 정보(비고)가 함께 제공됩니다. 이 데이터는 한옥의 구조와 구성 요소를 디지털 자산으로 정밀하게 관리하고, 복원·보수·교육용 3D 모델링, 디지털 아카이빙 등에 활용할 수 있도록 설계된 것입니다. 전통건축의 현대적 해석과 디지털 기반 자산관리를 실현하는 대표 사례로, 스마트 건축관리, 문화유산 보존, 건축 설계 자동화 등 다양한 분야에서 응용 가능성이 큽니다.'
