description_portal: '"서울특별시 용산구 옥상공원현황(연번 구분 옥상공원대상지 옥상공원위치 옥상공원소유구분 옥상공원면적(㎡) 옥상공원준공년도 비고)에 대한 데이터를 제공합니다.<참고 사항>옥상녹화는 건축물 옥상에 식물을 심어 녹지 공간을 조성하는 기술로, 단열성 향상, 경관 개선, 도시 녹지 확충등의 효과가 있기 때문에 도심지내 녹지률 산정 데이터로 활용 가능합니다.옥상공원은 도시 내 부족한 녹지를 확충하고, 열섬현상을 완화하며 주민들의 휴식과 여가공간을 제공하기 위해 조성되는 사항으로 공공데이터를 활용하면 지역별 옥상공원 분포 현황을 파악할 수 있어 도시계획, 환경정책 수립, 기후변화 대응 전략등에 기초자료로 활용될 수 있습니다. 또한 연구자나 기업은 옥상녹화 효과분석, 에너지 절감 연구, 생태적 가치 평가 등에 참고할 수 있으며, 시민들은 생활권 내 접근 가능한 옥상공원 정보를 손쉽게 확인하여 이용편의를 높일 수 있습니다. 결국 해당 데이터는 지속가능한 도시 환경 조성과 주민 삶의 질 향상에 중요한 역할을 하는 기반 자료라 할 수 있습니다.'
