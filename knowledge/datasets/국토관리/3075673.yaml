summary_user: 충청북도(청주시 소재 업체 제외)에 등록된 측량업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 업종(일반·공공·지적측량업)과 업체명·주소·전화번호가 들어 있다. 측량을 맡길 사업자나 주민이 도내 특정 시군에서 지적측량업으로 등록된 업체와 연락처를 찾을 때 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 주소의 시군명이나 업체명을 맞춰 연결해야 한다.
limits: 청주시 소재 업체는 청주시청이 관리하므로 이 파일에 없고, 도 전체 현황을 보려면 청주시 자료를 따로 합쳐야 한다. 사업자등록번호 같은 공통 키가 없어 다른 업체 데이터와 정확히 매칭하기 어렵다.
