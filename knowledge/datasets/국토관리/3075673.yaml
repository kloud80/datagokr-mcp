description_portal: 충청북도청에서는 도내(청주시 업체 제외)에서 활동하는 측량업체를 등록하고 관리하고 있습니다.(청주시 소재 업체는 청주시청에서 관리)측량업이란 땅이나 건물, 도로 등 위치와 경계를 정확하게 측정하는 일을 하는 업종을 말합니다.우리 도에서 관리하는 측량업의 종류는 3가지(일반측량업, 공공측량업, 지적측량업) 입니다.측량업 등록업체들은 "공간정보의 구축 및 관리 등에 관한 법률" 제44조(측량업의 등록)에 따른 등록 기준을 충족해야만 영업이 가능합니다.자료에는 각 업체별 업종, 상호, 전화번호 등이 포함되어 있으며, 모든 정보는 K-GeoP시스템을 통해 관리되고 있습니다.
