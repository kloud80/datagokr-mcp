summary_user: 경상남도 김해시 제조업체 가운데 주력 생산품이 건설과 관련된 업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 회사명·주소·읍면동·전화번호·주력 생산품·근로자 수를 제공한다(포털 설명상 기준일 2024년 12월 31일). 건설사나 시공업체가 김해시 안에서 특정 건축자재를 만드는 업체와 연락처를 찾거나, 분석가가 읍면동별 건축자재 제조업체 분포와 고용 규모를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 회사명·주소·읍면동 같은 이름 매칭으로만 잇고, 같은 기관의 '제조업체 현황' 파일과 겹쳐 보는 방식이 현실적이다.
