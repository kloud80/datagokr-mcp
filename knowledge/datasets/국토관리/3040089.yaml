summary_user: 부산광역시 동구에서 나간 건축허가(신축·증축·개축·대수선·용도변경 등)를 허가 건별로 담은 파일로, 대지위치·지목·대지면적·건축면적·연면적·건폐율·용적률·구조·허가일·착공처리일·주용도와 설계·감리·시공 사무소명을 행으로 가진다. 동구에서 최근 어떤 용도의 건물이 어디에 얼마 규모로 허가·착공되는지를 보려는 주민·건설업자·지역 개발 동향 분석가가 지역 개발 흐름의 선행 지표로 쓴다. 실측 컬럼에 전역 조인 키(건축물대장 번호·PNU 등)가 없어, 다른 데이터와는 대지위치 주소 문자열을 매핑하거나 같은 기관(동구) 자료끼리만 이어 쓴다.
limits: 전역 조인 키가 없어 건축물대장·공시지가 등과 바로 결합되지 않고 주소 정제·매핑이 필요하다. 범위는 부산 동구 한 시군구에 한정되며, 받은 파일이 1,931바이트로 작아 특정 기간의 허가분만 담긴 것으로 보이므로 장기 추세 분석에는 여러 시점 파일을 모아야 한다.
