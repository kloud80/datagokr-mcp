summary_user: 경기도 내 지방상수도 취수장을 시설 한 곳씩 담은 현황으로, 집계연도·사업자명·용수 구분·취수장명·취수원·설계 시설용량을 담으며 가동 중인 시설과 폐쇄된 시설이 함께 기록된다. 상수도 담당자나 분석가가 "우리 시·군의 취수장은 어느 취수원에서 하루 얼마만큼의 용량으로 물을 끌어오는가"를 확인하거나 지역별 용수 공급 능력을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 정수장 현황·수질검사 등 다른 상수도 데이터와는 취수장명이나 사업자(지자체)명을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 지방상수도 취수장의 현황을 집계한 자료로, 취수장명, 취수원, 설계 시설용량, 가동 상태 등의 정보를 포함하고 있습니다. 취수장은 생활용수와 산업용수 공급을 위한 핵심 기반시설로, 본 자료는 지역별 용수 공급 능력과 시설 운영 상태를 파악하는 데 활용됩니다. 가동 중인 시설과 폐쇄된 시설이 함께 기록되어 있어 수자원 인프라의 변동 상황을 확인할 수 있으며, 설계 용량은 각 취수장의 공급 역량을 수치로 보여줍니다. 이 데이터는 수자원 정책 수립, 상수도 운영 관리, 지역 간 용수 공급 불균형 해소, 환경 변화에 따른 용수 수급 안정성 평가 등에 기초 자료로 활용될 수 있습니다.
