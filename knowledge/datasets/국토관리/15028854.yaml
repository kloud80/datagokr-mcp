summary_user: 부산광역시 건물별 도로명주소를 한 행씩 담은 CSV 파일로, 시군구·읍면동, 도로명, 지하 여부와 건물 본번·부번, 건물명, 건축물 용도, 관할 행정동, 위도·경도를 함께 제공한다. 분석가나 사업자가 '부산의 특정 행정동에 어떤 용도의 건물이 어디에 몇 곳 있는가'처럼 주소를 좌표로 바꾸거나 건물 분포를 지도에 올리는 데 쓴다. 전역 조인 키(법정동코드·도로명코드 등)는 없어서, 다른 데이터와는 시군구명·읍면동명·도로명+건물번호 같은 이름을 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
limits: 행정구역 코드나 도로명 코드가 없어 다른 데이터와 바로 키로 묶을 수 없고, 이름 표기 차이를 맞춰야 한다. 범위는 부산광역시 한 시도의 건물 단위로 한정된다.
