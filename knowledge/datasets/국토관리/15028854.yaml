description_portal: 도로명주소는 도로명과 건물번호로 구성된 주소정보체계로 차량 및 보행자의 위치(길, 건물) 찾기에 편리성을 고려하여 도로마다 도로명을 부여하고 그 도로구간을 따라 좌·우 건물마다 10m 간격으로 왼쪽에는 홀수, 오른쪽에는 짝수 번호를 체계적 과학적으로 부여하는 제도로, 2011. 7. 29. 전국 일제고시를 통해 법정주소로 확정, 도로명주소 본격 사용,  2013년 말까지 지번주소와 도로명주소를 병행 사용을 거쳐 2014년부터는 도로명주소를 법정주소로 전면 사용하게 되었으며, 부산광역시 도로명주소에 대한 데이터로 시도명, 시군구명, 읍면동명, 도로명주소(지하구분)(건물본번), 도로명주소(건물부번), 건물명, 건물용도분류, 관할행정동, 위도, 경도 항목정보를 제공합니다.
