summary_user: 전북특별자치도 시군에서 시행한 '간판이 아름다운 거리' 시범 사업을 사업 건별로 정리한 소용량 파일(csv 약 2KB)로, 연도·시군·사업명·거리 길이·참여 업소 수·정비 광고물 수와 국비·시도비·시군비·자부담 재원 분담을 담는다. 지자체 공무원이나 도시 경관 분석가가 "도내 어느 시군에서 언제 간판 정비 사업을 했고, 재원을 누가 얼마씩 냈는가"를 확인하는 데 쓴다. 전역 조인 키나 행정코드는 없어 시군 이름을 행정구역 코드에 매핑해야 다른 시군구 단위 통계와 이을 수 있다.
