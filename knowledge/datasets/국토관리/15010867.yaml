description_portal: 이 데이터는 전북특별자치도 내 시군에서 시행된 '간판이 아름다운 거리' 시범 사업의 현황을 정리한 자료입니다. 각 사업별로 연도, 사업명, 대상 거리의 길이, 참여 업소 수, 그리고 정비된 광고물(간판)의 수와 같은 사업 규모를 상세히 보여줍니다. 또한, 총 사업비에 대한 국비, 시도비, 시군비, 자부담の内訳을 명시하여 재원 구조를 명확히 파악할 수 있게 해줍니다. 이 자료는 도시 경관 개선을 위한 공공디자인 사업의 추진 실적과 예산 집행 내역을 분석하는 데 유용한 행정 데이터로 정책제언 및 수립에 활용할 수 있습니다
