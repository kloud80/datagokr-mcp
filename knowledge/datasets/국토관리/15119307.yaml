summary_user: 경기도 이천시 지구단위계획에 따라 설정된 지구별 공간구획을 한 행씩 담은 파일로, 지구마다 관리번호·라벨명·도형 면적·길이·생성일을 기록한다(CSV 약 3.9KB의 소규모 자료). 도시계획 담당자나 분석가가 이천시 안에 어떤 지구가 지정돼 있고 각 지구의 면적이 얼마인지 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키가 없어, 지구 라벨명 같은 이름을 맞추거나 같은 기관(이천시) 자료끼리만 연결한다.
description_portal: 경기도 이천시 지구지역별 공간구획 현황을 나타내는 데이터입니다. 지구단위계획에 따라 설정된 각 지구의 관리번호, 라벨명, 도형면적, 길이, 생성일자 등의 항목으로 구성되며, 지리적 경계와 규모를 수치적으로 표현합니다. 본 데이터는 도시계획 수립, 지역 단위 개발 관리, 건축규제 기준 설정, 공간분석 등에 활용되며, 행정구역 내부의 세부 공간구획을 체계적으로 관리하고 분석할 수 있는 기반 자료로 쓰입니다. 특히, 지구 단위의 토지이용계획 수립, 기반시설 배치 검토, 정책 효과 분석 등 실무에 직접적으로 활용됩니다.
