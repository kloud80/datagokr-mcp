summary_user: 전북특별자치도 시군구별로 도로·주차장·공원·녹지 등 도시·군계획시설의 종류와 세분마다 결정된 시설수·면적·연장과 그중 미집행 시설수·면적을 담은 집계 파일(CSV)이다. 시군별 장기미집행 도시계획시설이 어느 종류에 얼마나 남아 있는지 확인하려는 지자체 담당자·연구자·주민의 질문에 쓴다. 전역 조인 키가 없어서, 다른 데이터와는 시도·시군구 이름을 행정구역 코드에 매핑해 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도의 도시 및 군 계획에 따라 결정된 기반 시설의 현황을 상세히 보여주는 자료입니다. 도로, 주차장, 공원, 녹지 등 다양한 종류의 공공시설에 대하여 각 시군별로 계획상 결정된 시설의 수와 면적, 그리고 그중 아직 집행되지 않은 미집행 시설의 규모를 구체적으로 명시하고 있습니다. 이 자료는 지역의 인프라 구축 현황과 장기적인 도시 발전 계획의 이행 과정을 파악하는 데 필수적입니다. 도시 계획의 투명성을 높이고, 장기미집행 시설 문제를 관리하며, 체계적인 국토 개발을 추진하기 위한 중요한 기초 데이터로 활용됩니다.
