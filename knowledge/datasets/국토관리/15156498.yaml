description_portal: 부산광역시 동구 지역의 하천 정보는 「하천법」 및 「소하천정비법」에 따라 지방자치단체(부산광역시 및 동구청)에서 관리하는 하천의 공식 등록 정보로 구성된 데이터입니다.하천 관리 데이터는 각 하천별로 다음과 같은 필수 관리 항목을 포함하여 구성됩니다.하천코드, 하천명, 하천구분명, 시점위치, 종점위치, 하천길이, 관리기관명, 데이터기준일자 등의 공식 등록 정보입니다.이 데이터는 일차적으로 관할 동구청에서 등록 및 갱신을 수행합니다. 등록된 정보는 *하천정보관리시스템(RIMGIS)*을 통해 통합 관리되므로, 시스템을 통해 누구나 접근 가능합니다.파일 내 항목별 코드 설명 및 좌표 체계 등 상세 정보는 하천정보관리시스템(RIMGIS)에 등록된 매뉴얼을 참고해 주시기 바랍니다.하천 데이터는 대규모 지리정보를 포함하고 있으므로, RIMGIS에서 제공하는 웹 서비스를 통해 정보를 조회하거나, 데이터 파일을 다운로드하여 활용해 주시기 바랍니다.
