summary_user: 광진구 관내에서 승인된 건축(주택)사업계획을 사업 건별로 담은 파일로, 대지위치·건축물명칭·주택형태와 대지면적·연면적·용적률·건폐율·동수·총세대수·사업승인일을 수록하며 파일 크기는 약 2KB(csv)로 소규모다. 주택 공급을 분석하는 분석가나 주민이 '광진구에서 언제 어디에 몇 세대 규모의 아파트·다세대주택 사업이 승인됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 대지위치(주소)를 다른 건축물·필지 데이터의 주소와 맞추거나, 같은 기관(광진구) 단위로만 이어 쓴다.
description_portal: 서울특별시 광진구_건축사업계획승인현황 데이터는 광진구 관내에서 승인된 건축사업계획의 주요 현황을 제공하며, 도시개발 및 주택정책 수립의 기초 자료로 활용됩니다. 주요 항목에는 주택형태, 면적, 용적률, 총세대수 등이 포함됩니다. 주택형태 항목은 아파트, 다세대주택 등 건축물의 유형을 구분하여 주거 형태별 공급 현황을 분석할 수 있도록 지원하며, 면적은 건축물의 규모와 개발 용량을 파악하는 핵심 데이터입니다. 용적률은 토지의 이용 효율성을 평가하고 도시계획 적합성을 검토하는 데 활용됩니다. 총세대수 항목은 해당 건축사업에서 공급되는 세대 수를 나타내며, 인구 수용력 분석과 주택 수급 계획 수립에 중요한 지표가 됩니다. 본 데이터는 도시개발 계획 수립, 주거정책 개선, 건축 인허가 관리, 인구 유입 분석 및 공간 데이터 기반의 주택 공급 현황 지도 작성 등 다양한 행정 및 정책 분야에서 활용됩니다. 광진구의 지속 가능한 도시 성장과 균형 있는 주택 공급 체계 구축을 위한 필수 공공데이터입니다.
