summary_user: 광주광역시(현 전남광주통합특별시)의 결정고시 후 10년 이상 집행되지 않은 장기미집행 도시계획시설을 시설 종류별로 묶어 미집행 개소수·면적과 연도별 단계별 집행계획(1단계 2026~2028년, 2단계 2029~2031년 이후)을 담은 집계표로, 403바이트 규모의 작은 CSV 파일이다. 토지 소유자나 도시계획 분석가가 '어떤 종류의 도시계획시설이 얼마나 오래 미집행 상태로 남아 있고 언제 집행될 예정인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설 종류 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 도시기반 시설 확충을 통한 지역발전과 교통편익 증진 및 시민재산권 보호를 위하여 장기미집행 도시계획시설을 효율적으로 관리하고 있습니다.시설결정 후 미집행된 모든 도시계획시설은 매년 단계별 집행계획을 수립하여 시홈페이지와 공보에 공고하고 10년 이상 20년 미만의 장기미집행 시설은 단계별 집행계획을 2년마다 지방의회에 보고하고 있습니다.해당 데이터는 국토의 계획 및 이용에 관한 법률에 근거하여 도시계획시설을 도시관리계획으로 결정.고시하며 결정고시일로부터 10년이상 광주광역시 미집행(장기미집행) 도시계획시설 현황에 대한 정보입니다.20년 이상 미시행된 도시계획시설은 시설결정 고시일로부터 20년이 되는 날의 다음날 효력이 상실 됩니다.
