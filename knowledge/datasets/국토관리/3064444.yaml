summary_user: 충청북도 음성군 안의 산업단지를 단지별 한 행으로 정리한 파일(csv, 약 3KB)로, 단지명·위치·사업 시작·종료일·입주업종·입주업체 수·면적(㎡)·준공 여부·관리사무소 연락처·데이터 기준일자를 담는다. 음성군에 공장 입지를 찾는 사업자나 지역 경제 분석가가 '음성군의 어느 산업단지가 준공됐고, 어떤 업종이 몇 개 업체 입주해 있으며 관리사무소 연락처는 무엇인가'를 확인하는 데 쓴다. 산업단지코드 같은 전역 조인 키가 없어서, 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황·경계도면과는 산업단지명을 맞춰 이어 써야 한다.
description_portal: 음성군 산업단지 현황 데이터는 지역 내 산업단지의 조성 및 운영 상황을 종합적으로 파악할 수 있도록 구성된 자료입니다. 주요 컬럼에는 각 단지를 식별하는 산업단지명과 지리적 위치를 나타내는 위치, 사업 추진 과정을 보여주는 사업시작일과 사업종료일이 포함됩니다. 또한 단지 내 입주 기업의 성격을 알 수 있는 입주업종과 실제 입주한 업체 수가 기록되어 있어 산업 구조와 규모를 확인할 수 있습니다. 관리 측면에서는 관리사무소 전화번호와 팩스번호가 제공되어 행정적 소통을 지원하며, 단지의 물리적 규모를 나타내는 **면적(㎡)**과 완공 여부를 확인할 수 있는 준공여부가 포함됩니다. 마지막으로 데이터 기준일자는 최신성을 보장하여 행정 활용과 정책 수립에 신뢰성을 더합니다. 이 데이터는 산업단지 운영 관리, 기업 유치 전략, 지역 경제 분석 등 다양한 분야에서 기초 자료로 활용될 수 있습니다.
