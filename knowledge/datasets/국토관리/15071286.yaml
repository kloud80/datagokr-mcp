summary_user: 서울시 도시계획 도면 가운데 취락지구로 지정된 구역을 도형 단위로 담은 공간정보로, 구역마다 도면 관리번호·결정고시 관리코드·명칭·시군구코드·면적·둘레 길이가 붙는다. 토지 소유자나 개발 검토자가 특정 필지가 서울시 취락지구 안에 드는지, 각 지구의 면적이 얼마인지 확인하는 데 쓰며, 국토계획법의 용도지구 체계 안에서 참고자료로 본다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 용도지역·지구 자료와는 시군구코드(SGG_CD)를 코드 매핑하거나 결정고시 관리코드·명칭을 맞춰 연결한다.
description_portal: 서울특별시 취락지구 공간정보 입니다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울특별시 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
