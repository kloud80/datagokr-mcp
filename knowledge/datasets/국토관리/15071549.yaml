summary_user: 서울시에서 인허가를 받은 배출가스전문정비사업자(확인검사대행자)를 사업장 한 곳당 한 건으로 담으며, 인허가일자·영업상태·휴폐업일자·지번/도로명 주소·전화번호·좌표를 포함한다. 시민이나 차량 소유자가 '우리 동네에서 지금 영업 중인 배출가스 정비업체가 어디인가'를 확인하거나, 분석가가 업체의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭, 좌표를 이용한 지도 결합, 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: '서울시에서 인허가를 받은 배출가스전문정비사업자(확인검사대행자)에 관한 정보로, 각 사업장의 인허가 일자, 영업상태, 소재지 주소, 연락처, 좌표 정보 등이 포함되어 있습니다. 해당 자료는 사업장의 운영 현황을 파악하고 관리·감독을 위한 행정적 근거로 활용됩니다. 특히 사업장명, 영업상태명, 소재지 주소, 좌표정보 등을 제공하여 시민 및 기관이 배출가스 정비업체의 위치와 운영 여부를 확인할 수 있도록 지원합니다. 또한 데이터는 주기적으로 갱신되며, 최종 수정일자와 데이터 갱신 구분 항목을 통해 최신성을 검증할 수 있습니다.ㅇ 관리번호 : 사업자별 고유 식별 번호ㅇ 인허가일자 : 해당 사업장이 인허가를 받은 날짜ㅇ 영업상태명 : 영업/정상, 폐업, 휴업 등 운영 상태ㅇ 소재지 주소 : 지번주소 및 도로명주소로 위치 정보 제공ㅇ 전화번호 : 사업장 연락처ㅇ 사업장명 : 등록된 정비업체의 명칭ㅇ 좌표정보(X, Y) : 공간좌표를 통해 지도 기반 확인 가능ㅇ 데이터갱신일자 : 최신 데이터 갱신 여부 확인 가능'
