summary_user: 경기도 내 산업단지에 설치된 공공폐수처리시설을 시설 한 곳당 한 행으로 담으며, 시군명, 산업단지명, 시설용량(㎥/일), 평균유입량, 유입율, 준공일, 지번·도로명 주소, WGS84 좌표가 들어 있다. 환경 분석가나 지자체 담당자가 "어느 산업단지 폐수처리시설이 용량 대비 유입량이 높아 확충을 검토해야 하는가"를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 산업단지명을 맞춰 이름·코드로 매핑하거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 경기도의 공공폐수 처리 시설 현황입니다. 산업단지명, 소재지주소, 시설용량, 평균유입량, 유입율 등의 정보를 제공합니다.이 데이터는 경기도 내 산업단지에 설치된 공공폐수처리시설의 운영 현황을 정리한 자료입니다. 주요 항목은 시군명, 산업단지명, 시설용량(㎥/일), 평균유입량, 유입율(%), 준공일, 소재지 주소(지번 및 도로명), 우편번호, WGS84 위도·경도 정보로 구성되어 있습니다. 각 시설의 폐수 처리 능력과 실제 유입량을 비교할 수 있어 환경기초시설의 효율성 분석, 산업단지별 환경부하 관리, 시설 확충 여부 판단 등에 유용하게 활용됩니다. 또한 위치정보는 공간적 분포 분석, 주변 환경 영향 평가, 인프라 계획 수립 시 중요한 자료로 활용될 수 있습니다.
