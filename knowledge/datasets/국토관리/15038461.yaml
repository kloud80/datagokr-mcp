summary_user: 한전KDN(주)이 운영하는 사무실·창고·안테나 설치부지 등 수익시설물을 시설 1건씩 담은 목록으로, 명칭·임차인·시설물 종류·임대유형(정기/수시)·소재지·이용료 산정기준을 적고 있으며 파일 크기가 242바이트로 몇 건 되지 않는 작은 표입니다. 한전KDN 시설을 빌리려는 소상공인이나 사업자가 어느 지역에 어떤 시설이 어떤 임대방식과 이용료 기준으로 나와 있는지 확인하거나, 공공기관 유휴자산 임대 현황을 비교하는 분석가가 참고 자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 기관명으로만 맞춰 이어야 하며, 주소를 행정구역으로 바꿔 지역별 공공자산 임대 자료와 묶는 정도가 현실적이다.
description_portal: 공공자산의 효율적 활용과 재정 건전성 확보를 위해 다양한 수익시설물을 운영하고 있습니다. 시설물은 사무실, 창고, 안테나 설치부지 등으로 구성되며, 임대유형은 정기임대와 수시임대로 구분되어 있습니다. 각 시설물은 수도권 및 지역거점에 위치해 있으며, 위치와 용도에 따라 이용료 산정기준이 상이합니다. 이러한 자산은 투명하고 공정한 계약절차를 통해 민간과 공유되며, 특히 지역 소상공인과 사회적기업에게도 기회를 제공하여 지역균형발전과 ESG 경영 실천에도 기여하고 있습니다. 앞으로도 우리는 공공자산의 사회적 가치 극대화, 유휴자산의 디지털 기반 관리체계 도입 등 지속가능한 자산운영을 통해 공공성과 수익성을 동시에 추구할 예정입니다.
