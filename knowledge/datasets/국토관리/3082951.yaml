summary_user: 서귀포시 관내에 조성된 숲길·산책로를 한 줄에 하나씩 담은 현황 파일로, 명칭·구간·연장(km)·조성완료년도·데이터기준일자를 담는다(CSV 약 2KB의 소규모 목록). 걷기·트레킹을 계획하는 시민이나 관광객이 '서귀포에 어떤 숲길이 있고 길이는 얼마인가'를 확인하거나, 행정·분석가가 숲길 조성 시기와 연장 규모를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 숲길 명칭이나 구간 문자열을 직접 맞춰 잇거나 같은 기관(서귀포시) 자료끼리만 연결해야 한다.
