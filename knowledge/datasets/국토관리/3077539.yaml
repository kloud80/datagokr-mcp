summary_user: 서울 성북구에 등록된 공장을 업체 단위로 한 줄씩 담은 파일로, 회사명·주소·업종과 업종코드·생산품·전화번호가 들어 있으며 포털 설명상 기준일자는 2020년 10월 1일입니다. 지역 분석가나 구청 담당자가 '성북구에는 어떤 업종의 소규모 제조업체가 어느 동네에 몰려 있는가'를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했습니다. 따라서 업종코드를 표준산업분류 코드표나 타 시군구 공장현황과 맞춰 보거나, 주소를 지오코딩해 지도·필지 자료와 잇는 식으로 연결해 쓴다.
description_portal: 이 데이터는 서울특별시 성북구 내 공장 등록업체의 현황 정보를 제공합니다.각 사업체의 회사명, 주소, 업종, 업종코드, 생산품, 전화번호, 데이터 기준일자(2020년 10월 1일) 등의 정보를 포함하고 있습니다.이 자료를 통해 성북구 지역의 산업 구조 및 제조업 분포 현황을 파악할 수 있으며,특히 소규모 제조업체, 공장 밀집도, 업종별 산업 특성 분석, 산업정책 수립 등에 유용하게 활용할 수 있습니다.데이터는 **표준 산업분류(업종코드)**를 포함하고 있어,통계청 산업분류 데이터 및 타 지역 공장현황 데이터와 결합·비교분석이 가능합니다.또한, 산업시설 지도화(GIS)나 도시산업 분석·경제활성화 정책 기획 등 다양한 연구 및 행정 활용에도 적합합니다.
