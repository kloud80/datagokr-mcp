description_portal: 본 데이터는 「하수도법」에 따라 경기도 고양시  관내에 등록된 정화조 청소업체 현황에  대한 공공데이터로 정화조 청소 업체 관련 업체명, 등록일, 전화번호 등을 알 수 있습니다.시민들에게 신뢰할 수 있는 영업자의 정보를 제공하여 건물의 정화조 내부 청소 진행 시, 관내 분뇨수집운반업을 득한 업체를 이용할 수 있도록 정보를 제공합니다.- 정화조의 소유자 또는 관리자는 「하수도법」 제39조 및 같은 법 시행규칙 제33조에 따라 1년에 1회(일부 연 2회) 내부청소를 진행하여야 합니다.- 고양시 하수도 사용 조례 제28조에 따라 분뇨수집·운반의 능률적인 처리와 주민편의 증진을 위하여 분뇨수집·운반업 허가를 받은 자에게 그 수집·운반을 대행하게 할 수 있다.
