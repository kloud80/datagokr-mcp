description_portal: 매입임대주택은 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 제37조제1항 각 호의 어느 하나에 해당하는 주택 또는 건축물(이하 “기존주택등”이라 한다)을 매입하여 「국민기초생활 보장법」에 따른 수급자 등 저소득층과 청년 및 신혼부부 등에게 공급하는 공공임대주택입니다.위 목적에 따라 매입임대주택에 입주할 수 있는 입주자 자격이 있으며 일반적으로1. 주택이 공급하는 계층에 해당할 것2. 해당 세대원이 주택을 소유하고 있지 않을 것3. 해당 세대원의 월평균소득 합계가 전년도 도시근로자 가구당 월평균 소득의 일정 비율 이하일 것4. 해당 세대원의 총자산 합계가 일정 기준 이하일 것5. 해당 세대원의 자동차 중 가장 비싼 자동차가액이 일정 기준 이하일 것위 다섯가지 자격에 부합하여야 합니다.
