summary_user: 경상북도 칠곡군 내 토지의 개별공시지가를 필지 단위로 담은 건별 원천 파일로, 시군구·법정동·리·구분·본번·부번 등 소재지와 기준년도, 지가(원), 공시일을 담는다. 칠곡군에 땅을 가진 주민이나 부동산·세무 분석가가 특정 필지의 올해 공시지가가 얼마이고 언제 공시됐는지 확인하는 데 쓴다. 실측 컬럼에 PNU 같은 전역 조인 키가 없어, 다른 토지·건축물 데이터와는 법정동·리 이름과 본번·부번을 조합해 맞추는 방식으로만 연결한다.
