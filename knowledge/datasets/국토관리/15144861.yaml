description_portal: 인천도시공사_임대주택 유형별 현황(가명데이터 제공)인천도시공사에서 임대주택 계약자에 대한 가명데이터로 가공하여 제공하는 자료입니다.기준일자, 주택타입명, 소재지, 성명, 성별, 나이, 부양가족수 등으로 구성된 데이터입니다.○ 컬럼별 상세설명  - 기준일자 → 임대주택 유형별 현황을 자료를 가공한 날짜정보  - 주택타입명 → 아파트, 다세대주택, 다가구 주택 등 타입별 명칭  - 소재지 → 임대주택별 소재지(인천도시공사에서 관리중인 임대주택 지역정보)  - 성명, 성별,  나이, 부양가족 수 정보를 제공인천지역의 구별 입주 수요 및 임대 수요 추세 분석 등에도 활용할 수 있습니다
