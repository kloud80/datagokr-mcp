summary_user: 인천광역시 남동구에 등록된 공장을 한 곳씩 담은 건별 명부로, 단지명·회사명·연락처·종업원수·업종번호와 업종명·생산품·공장 주소(도로명·지번)를 담는다. 구직자나 협력업체를 찾는 사업자가 '남동구 산업단지 안에서 특정 업종이나 생산품을 다루는 공장이 어디 있고 규모는 어떤가'를 확인하거나, 분석가가 업종별 기업 분포와 고용 규모를 보는 데 쓴다. 사업자번호나 필지 고유번호 같은 전역 조인 키는 없어서, 다른 데이터와는 회사명·주소 매칭이나 업종번호(산업분류 코드로 추정되는 값)를 통한 이름·코드 매핑으로만 잇는다.
description_portal: 해당 데이터는 인천광역시 남동구의 공장등록현황에 관한 자료로, 지역 내 제조업체와 산업단지 운영 현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 제공 항목은 순번, 단지명, 회사명, 전화번호, 팩스번호, 종업원수, 대표업종번호, 업종번호, 업종명, 생산품, 공장대표주소(도로명), 공장대표주소(지번) 등입니다. 이를 통해 기업 분포, 업종별 현황, 고용 규모, 생산품 특성 등을 분석할 수 있으며, 기업 유치 정책 수립과 산업지원 사업 추진의 기초자료로 활용됩니다. 또한 구직자와 협력업체에는 지역 산업정보를 제공하고, 연구기관과 민간기업에는 산업 동향 분석 자료로 활용 가치가 높아 지역경제 활성화와 스마트 산업행정 구현에 기여할 것으로 기대됩니다.
