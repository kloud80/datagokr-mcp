summary_user: 통영시가 보유한 공간정보 레이어의 목록을 레이어 한 건당 한 행으로 담은 CSV 파일(27,568바이트)로, 정보시스템명, 레이어 한글·영문 명칭과 설명, 축척·해상도·측지계·투영법, 공개구분과 수수료 구분 같은 메타정보를 담는다. 분석가나 사업자가 통영시에 어떤 도로·상하수도·정사영상·수치지형도 레이어가 있고, 어떤 좌표계와 축척으로 만들어졌으며 공개되는지를 확인한 뒤 실제 공간자료를 신청할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 레이어 명칭이나 BRM 분류(대분류·중분류) 이름을 맞추거나 같은 기관 기준으로만 이어 쓴다.
description_portal: 통영시는 효율적인 도시계획과 시설 관리를 위해 다양한 종류의 공간정보를 체계적으로 보유하고 있습니다. 주요 자료에는 도로, 상수도, 하수도 등 도시 기반시설 정보가 포함되며, 여기에 전기·통신·가스 등 유관기관에서 제공하는 시설물 정보도 함께 연계되어 관리됩니다. 또한 도시 전역을 촬영한 항공사진을 정밀하게 보정한 정사영상과 지형의 높낮이와 형태를 상세히 표현한 수치지형도 역시 중요한 자료로 활용됩니다. 이러한 공간정보들은 행정업무, 재난 대응, 시설물 유지관리, 도시개발 등 다양한 분야에서 신뢰성 있는 의사결정을 지원하는 핵심 자료로 사용됩니다.
