summary_user: 주요 국가산업단지별로 음식료·섬유의복·석유화학·철강·기계·전기전자·운송장비·비제조 등 업종별 입주업체 수(개사)와 총계를 담은 집계 파일로, 전국 범위의 비공간 자료다. 분석가가 "특정 국가산단은 어떤 업종 기업이 많이 모여 있나, 제조업 구성이 단지마다 어떻게 다른가"를 비교하는 데 쓴다. 산업단지코드 같은 전역 조인 키가 없어, 산단 생산·수출·고용 통계나 단지 원장과는 산업단지 이름을 맞춰 연결해야 한다.
