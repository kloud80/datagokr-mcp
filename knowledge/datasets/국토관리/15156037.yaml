description_portal: 이 데이터는 국내 주요 공공건축물의 친환경 건축 성능 및 인증 현황을 체계적으로 정리한 자료입니다.기후변화 대응 및 탄소중립 실현 등 시대적 흐름에 발맞춰, 우리 부서에서 추진하는 건축물의 친환경 인증 현황을 종합적으로 파악하는 데 유용합니다.해당 데이터는 공공 건축사업의 에너지 절감 효과, 친환경 건축기준 준수수준, 지속가능성 성과를 파악하는 데 활용될 수 있으며, 정책수립·연구·사업평가 등 다양한 분야에서 활용 가치가 높습니다.특히, 해당 정보에 대한 시민들의 관심과 수요가 증가하고 있는 상황에서 관련 데이터를 공개함으로써 친환경 건축에 대한 사회적 공감대 형성에도 기여할 수 있습니다.
