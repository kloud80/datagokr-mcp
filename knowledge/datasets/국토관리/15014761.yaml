summary_user: 증평군에서 건축물 유지관리 점검대상으로 선정된 건축물을 한 건씩 담은 파일로, 주소·점검구분(정기점검 등)·사용승인일·선정일자·제출부서·진행구분(계획·완료 등)을 기록한다. 증평군 안의 어느 건물이 유지관리 점검대상이고 점검이 계획 단계인지 완료됐는지 확인하려는 주민·건물 관리자·안전 분석가가 쓴다. 전역 조인 키(건물관리번호·법정동코드 등)가 없어 건축물대장 같은 다른 데이터와는 주소 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 충청북도 증평군_건축물유지관리 점검대상 건축물현황 데이터는 「건축법」 및 관련 규정에 따라정기적 유지관리 점검이 필요한 건축물의 현황을 관리하는 자료입니다.데이터에는 건축물의 소재지(주소), 점검구분(정기점검/정밀안전점검 등),사용승인일, 점검대상으로 선정된 일자, 점검계획을 제출한 부서,그리고 점검의 현재 상태를 나타내는 진행구분(계획, 완료 등) 항목이 포함됩니다.이 정보는 위험시설물 사전 식별, 점검이력 관리, 민간 건축물 안전관리 의무 이행 여부 확인 등건축물 유지관리 체계를 효율화하는 데 활용됩니다.또한, 건축물 노후화 대응, 안전등급별 우선 관리 대상 선정, 행정 점검 일정 자동화 등지자체의 건축 안전 행정과 연계되어 운영됩니다.특히 사용승인일과 점검구분을 기준으로 정기점검 대상 필터링이 가능하며,지속적인 관리가 필요한 시설물(다중이용시설, 일정 규모 이상 건축물 등)에 대해정책 기반 점검주기 적용의 투명성 확보에 기여합니다.
