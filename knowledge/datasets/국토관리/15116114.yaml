summary_user: 전남 신안군에 지정된 도시계획시설(도로·공원·학교·하수도·주차장 등)을 시설 도형 한 건씩 담은 파일로, 시설유형·상세유형, 도로등급·도로류별·도로번호, 면적·길이, 도면번호를 함께 기록한다. 개발행위 허가나 민원 검토 담당자가 신안군 안에 어떤 유형의 도시계획시설이 얼마나 지정돼 있는지, 특정 도로가 어느 등급·류별인지를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설유형 같은 이름 매핑이나 같은 기관(신안군) 기준으로만 이어 쓰며, 같은 기관 안에서는 현황도형 관리번호와 도면번호로 도면·도형 자료와 맞춰 볼 수 있다.
description_portal: 이 데이터는 전라남도 신안군의 도시계획시설 지정 현황을 정리한 자료로, 도시기반시설의 계획적 설치와 관리에 필요한 기초정보를 제공합니다. 도로, 공원, 학교, 하수도, 주차장 등 다양한 시설유형이 포함되며,  현황도형 관리번호, 시설유형, 시설유형상세, 도로등급, 도로류별, 도로번호등의 항목으로 구성되어 있습니다. 도시의 기능성과 정주 여건을 향상시키기 위한 시설현황을 체계적으로 파악할 수 있어, 개발행위 허가, 도시관리계획 수립, 민원 검토, 인허가 판단 등 다양한 행정 업무에 활용됩니다. 본 데이터는 도시계획의 실현 가능성과 공공시설 확충의 적정성을 검토하는 데에도 유용한 자료입니다.
