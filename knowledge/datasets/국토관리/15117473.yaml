description_portal: 대구광역시 상수도사업본부에 2015년부터 2024년까지 민원접수된 옥내누수감면신청건수를 년도별로 제공합니다. 참고로 대구광역시의 옥내 누수탐사 서비스는 수용가(일반 가정이나 사업장 등) 내에서 발생하는 상수도 누수를 조기에 발견하고, 그로 인한 수돗물 손실과 요금 부담을 줄이기 위해 제공되는  서비스입니다. 단, 실제 배관 수리나 교체와 같은 보수공사는 사용자의 부담으로 별도로 진행해야 합니다. 누수로 인해 과다 부과된 수도요금에 대해서는 확인된 탐사 결과와 누수 수리 증빙서류(사진 및 영수증 등)를 제출하면 감면을 신청할 수 있습니다. 감면은 시가 정한 기준에 따라 사용량 일부를 인정받는 방식으로 진행됩니다.결론적으로, 대구시의 옥내 누수탐사 서비스는 시민의 불편과 누수로 인한 재정적 손해를 줄이고, 수자원의 낭비를 예방하기 위한 효과적인 제도로, 이상 징후가 있을 경우 빠르게 신청하여 점검을 받는 것이 중요합니다.
