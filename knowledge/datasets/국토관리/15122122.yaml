description_portal: '* 이 데이터는 충청북도 제천시 수도사업소에서 진행한 급수공사에 대한 현황을 정리한 자료입니다.2025년 11월 26일 기준으로 최신 정보로 업데이트(현행화)된 내용입니다.수도사업자가 일반의 수요자에게 원수 또는 정수를 공급하기 위해 다른 급수관으로부터 분기하여 설치한 급수관, 그 밖의 급수를 위하여 필요한 기구의 신설, 개조, 수선 및 철거 등의 공사 진행한 데이터를 보여줍니다.* 데이터 구성 항목으로는 연번, 공사접수년도, 공사주소(법정동), 연장M, 준공일, 데이터기준일로 구성되어 있습니다.* 해당 데이터의 담당 부서는 충청북도 제천시 수도사업소 이므로 데이터 담당부서에 문의하셔도 원하시는 답을 드릴 수 없습니다.'
