summary_user: 광양시 내 가로수를 한 그루씩 담은 원천 목록으로, 가로수길명·번호·수종명·직경·하층식재 여부와 경도·위도 좌표, 데이터기준일을 담는다(CSV 파일, 약 4.5KB). 시민이나 도시녹지 담당자가 '우리 동네 어느 길에 어떤 가로수가 심겨 있나'를 확인하거나, 지도 위에 가로수 분포를 그리는 데 쓴다. 다른 데이터와 맞물릴 공통 조인 키는 없고, 좌표(경도·위도)로 지도상 위치를 겹치거나 가로수길명을 이름으로 맞춰 연결한다.
description_portal: 이 데이터는 지역 내 가로수의 현황을 체계적으로 제공하는 자료로, 가로수길명, 기로수번호, 가로수명, 가로수 직경, 가로수 수분, 하층식재 여부 등 세부 정보를 포함하고 있습니다. 또한 경도와 위도 좌표를 함께 제공하여 가로수의 정확한 위치를 확인할 수 있어 GIS(지리정보시스템) 활용에도 적합합니다. 이를 통해 행정기관은 도시 녹지 관리, 환경 개선, 미관 증진 등의 정책 수립에 기초 자료로 활용할 수 있으며, 시민은 생활환경 속 녹지 자원의 분포 현황을 쉽게 파악할 수 있습니다. 데이터 기준일을 명시하여 최신성과 신뢰성을 확보하고, 공공데이터 개방을 통해 도시 환경 관리의 투명성과 효율성을 높이는 데 기여합니다.
