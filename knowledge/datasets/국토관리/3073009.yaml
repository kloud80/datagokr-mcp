description_portal: 본 데이터는 경기도 용인시의 지적공부 등록현황을 종합적으로 제공한다. 주요 항목은 토지소재지, 전, 답, 과수원, 목장용지 등 각 지목별 면적과 지번수로 구성되어 있다. 이를 통해 용인시 내 토지의 용도별 분포, 지목별 총 면적, 지번 현황을 체계적으로 파악할 수 있다. 자료는 토지이용 계획 수립, 도시 개발, 농업정책, 지적 재조사, 부동산 분석, 공시지가 산정 등 다양한 행정 및 정책 목적에 활용된다. 또한, 각 지목별 토지 현황을 지역별로 비교하거나 용도지역별 변화를 분석하는 데에도 유용하다. 시민, 정책 담당자, 연구자 등 다양한 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 지적공부 현황을 반영하여 정기적으로 갱신된다. 공공데이터 개방을 통해 정보의 신뢰성과 활용도를 높이고, 투명한 토지행정 및 효율적인 공간관리 정책 수립에 기여하는 것을 목표로 한다.
