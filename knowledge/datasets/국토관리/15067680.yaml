summary_user: 과거 위성영상(포털 설명상 1973-10-08~2004-09-30 촬영분)을 촬영 씬 한 장면당 한 행으로 담은 구축현황 목록으로, 위성일련번호·촬영일·PATH/ROW와 함께 촬영시각, 해상도·처리 수준, 태양 각도, 중앙·네 모서리 위경도, 투영·타원체 정보를 담는다. 지형·토지 변화를 연구하는 분석가가 '특정 지역을 1990년대에 찍은 위성영상 씬이 있는가, 어떤 해상도와 투영으로 남아 있는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키는 없으므로, 모서리·중앙 위경도로 다른 공간데이터와 위치를 겹쳐 보거나 같은 기관의 항공사진·정사영상 현황과 촬영일·위치를 기준으로 맞춰 쓴다.
limits: 영상 자체가 아니라 씬별 메타데이터 목록이며(영상·썸네일 존재 여부만 표시), 행정구역 코드가 없어 시군구 단위 집계는 좌표로 직접 매핑해야 한다. 파일은 활용신청 없이 CSV로 받는다.
