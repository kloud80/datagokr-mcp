summary_user: 국토교통부가 vworld.kr을 통해 제공하는 가축사육제한구역 외부 API로, 용도지역·용도지구·용도구역 등 토지이용규제 정보 가운데 가축 사육을 제한하는 구역을 전국 범위의 비공간 데이터로 담는다. 축산 사업자나 지자체 담당자가 특정 시도·시군구에 가축사육 제한이 걸려 있는지 확인하는 질문에 쓴다. 실측 컬럼(시도명, 시군구명, 연도 등)에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시도·시군구 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: '#. 용도지역토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등을 제한함으로써 토지를 경제적·효율적으로 이용하고 공공복리의 증진을 도모하기 위하여 서로 중복되지 않게 도시관리계획으로 결정하는 지역으로  도시지역, 관리지역, 농림지역, 자연환경보전지역으로 구분#용도지구토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역의 제한을 강화 또는 완화하여 적용함으로써 용도지역의 기능을 증진시키고 미관·경관·안전 등을 도모하기 위하여 도시관리계획으로 결정하는 지역으로 경관지구, 미관지구, 방화지구, 방재지구, 고도지구, 보존지구, 시설보호지구, 취락지구, 개발진흥지구, 특정용도제한지구로 구분 #. 용도구역토지의 이용과 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역 및 용도지구의 제한을 강화 또는 완화하여 따로 정함으로써 시가지의 무질서한 확산방지, 계획적이고 단계적인 토지이용 도모, 토지이용의 종합적 조정·관리 등을 위하여 도시관리계획으로 결정하는 지역으로 개발제한구역, 시가화조정구역, 도시자연공원구역, 수산자원보호구역으로 구분'
