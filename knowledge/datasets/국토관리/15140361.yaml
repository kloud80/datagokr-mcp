summary_user: 의정부시에 있던 주한미군 반환 공여구역(캠프 라과디아·카일·시어즈·잭슨·레드클라우드 등)을 기지 하나당 한 행으로 정리해 소재 동, 기지반환일, 면적, 현재 활용 현황 또는 계획을 담은 시군구 단위의 작은 파일(CSV 891바이트)이다. 의정부시의 어느 옛 미군기지가 언제 반환되어 지금 공원·주거·공공시설 등 무엇으로 쓰이거나 계획되어 있는지 알고 싶은 주민, 연구자, 개발사업 검토자가 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 동 이름(해당동)이나 기지 이름을 맞춰서만 이어 쓸 수 있다.
limits: 행정동·법정동 코드나 지번 같은 공통 키가 없어 다른 데이터와 연결하려면 이름을 직접 매핑해야 한다. 범위는 의정부시 한 곳뿐이라 다른 시군의 반환 공여구역은 담겨 있지 않다.
