summary_user: 평택시 대표 홈페이지 DB에 등록된 음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·업태·주소·주메뉴·영업시간·휴무일·좌석수·주차 정보·위생 등급을 포함한다(시군구 범위, 약 200KB CSV). 시민이 "평택에서 주차 가능하고 위생 등급을 받은 한식당은 어디인가"를 찾거나, 분석가가 지역별 업태 분포로 상권을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소(우편번호) 문자열 매칭으로만 잇고, 식품위생 인허가 데이터나 주소 기반 좌표 변환과 붙여 쓴다.
description_portal: '평택시 음식점 등록 현황 데이터는 평택시 대표 홈페이지 DB의 데이터로서 지역 내 음식점에 대한 등록정보를 체계적으로 관리하여 식품위생 안전을 확보하고, 시민의 외식 편의성을 높이며, 상권 분석 및 지역경제 활성화 정책에 활용하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 음식점의 위치, 업종, 영업형태, 위생관리 상태 등 기본 정보를 손쉽게 확인할 수 있으며, 민간·연구기관은 창업지원 서비스, 상권 분석, 관광안내 플랫폼, 배달·지도서비스 개발 등 다양한 분야에서 데이터를 활용할 수 있습니다. 본 데이터에는 음식점명, 주소, 업종 분류, 좌석 규모, 주차장 등의 주요 항목이 포함되어 있어 음식업 현황을 객관적으로 파악하는 데 도움이 됩니다. 이러한 자료는 지역 외식문화 개선, 소상공인 지원정책 수립, 관광자원 발굴, 배달 및 외식 플랫폼 고도화 등 공공·민간 영역 모두에서 활용할 수 있는 기반 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
