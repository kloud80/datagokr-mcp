description_portal: 이 자료는 충청남도개발공사의 임대주택(행복주택) 경쟁률 현황으로, 공급 세대수와 신청 세대수, 예비순위 등을 통해 지역별 수요 수준을 확인할 수 있다. 단, 개인별 청약자의 개인정보나 심사 결과는 미제공된다.키워드별 상세설명○ 임대주택 → 충청남도개발공사가 공급하는 임대형 주택으로, 주거 안정을 목적으로 운영됨○ 행복주택 → 청년·신혼부부·사회초년생 등을 대상으로 공급되는 공공임대주택 유형으로, 충남형 행복주택(꿈비채) 등이 포함됨○ 주택유형 → 아파트 등으로 구분된 주택의 형태를 의미하며, 전용면적 36㎡, 44㎡, 59㎡ 등으로 나뉨○ 모집세대수 → 해당 지역·주택유형별로 공급 가능한 세대수를 의미하며, 예비세대까지 포함해 산정됨○ 신청세대수 → 모집공고에 따라 청약 신청한 세대수를 의미하며, 실제 경쟁률 산정의 기반이 됨○ 경쟁률 → 신청세대수를 모집세대수로 나누어 계산한 값으로, 공급 대비 수요 수준을 보여주는 핵심 지표임○ 예비순위 → 본 청약에서 탈락한 경우 예비입주자로 선정될 순번을 의미하며, 전체 예비대기자의 순위를 포함함○ 지역별 현황 → 아산시·홍성군 등 각 지역별로 공급된 주택 경쟁률 현황을 나타내며, 지역 간 주거 수요 차이를 확인할 수 있음
