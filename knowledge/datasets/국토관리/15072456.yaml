summary_user: 한국토지주택공사가 수의계약으로 공급하는 용지의 공고를 건별로 담은 파일로, 관할 지역본부·공고 게시 시작일시·공고명·공고 상태·공고 종류(일반·정정·취소)를 기록하며 범위는 전국입니다. 토지를 매입하려는 사업자나 분석가가 "어느 지역본부에서 언제 수의계약 용지 공고가 많이 나왔고, 정정·취소된 공고는 얼마나 되나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 LH 공고 데이터와는 지역본부 코드나 공고명을 이름으로 맞춰서만 이어 쓴다.
description_portal: 한국토지주택공사에서 공급하는 수의계약 가능 용지 공고 내역(관할 지역본부, 공고일, 공고명 등) 정보를 제공합니다. 공고를 지역별로 살펴볼 때, 경기남부지역본부 387건(24%), 인천지역본부 283건(18%), 서울지역본부 169건(11%), 경기북부지역본부(10%)에 해당합니다. 공고종류는 일반공고가 1308건(81.7%), 정정공고가 175건(10.9%), 취소공고가 117건(7.31%)로 분류되고 있습니다. 24년이 280건 (17.5%), 2019년 193건(12.1%), 25년(11.8%)로 순으로 가장 많은 공고를 기록하고 있는 연도순입니다.
