summary_user: 완주군 관내 일반산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일(csv 약 108KB)로, 단지명·회사명·공장 주소(도로명·지번)·대표업종·종업원수·생산품·연락처를 담는다. 구직자나 영업 담당자가 '완주 산업단지 중 어느 단지에 어떤 업종 기업이 몇 명 규모로 있나'를 확인하거나, 분석가가 단지별 업종 분포와 고용 규모를 볼 때 쓴다. 전역 조인 키는 없어서 회사명·주소 문자열 매칭이나 대표업종번호(업종 분류)를 통해 공장 등록 현황이나 산업단지 통계와 맞춰 써야 한다.
limits: 사업자등록번호 같은 공통 키가 없어 다른 기업·공장 데이터와 붙일 때는 회사명·주소로 맞춰야 하고 오매칭을 점검해야 한다. 범위는 완주군 일반산업단지로 한정되며, 용지 분양·임대나 단지 조성 정보는 담지 않는다.
