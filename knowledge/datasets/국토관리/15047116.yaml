description_portal: '○ 통계개요* 통계명 : 주택가격지수(전세)* 통계종류 : 서울시 주택전세가격지수 현황을 제공하는 지정·조사통계* 근거법령 :「주택법」제86조 및 동법 시행령 118* 작성목적 : 주택매매 및 전세가격을 조사하여 주택시장의 평균적인 가격변화를 측정하고,주택시장 판단지표 또는 주택정책수립에 기초자료로 활용* 조사체계 : 조사대상 주택 → 한국감정원 전문조사자 → 한국감정원 주택통계부* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 및 자치구의 월별 주택전세가격지수○ 용어설명* 주택가격지수 : 기준시점과 매기 조사되는 조사시점의 가격비를 이용하여 기준시점이100인 수치로 환산한 값을 의미조사의 기준시점과 조사시점의 가격은 표본을 선정하고, 선정된 동일한 표본에 대하여매 시점 가격을 산정* 주택가격지수는 표본의 가격 비율로 산정되는 통계이기 때문에 이 지수를 이용하여지역간의 직접적인 가격차이를 비교할 수는 없음.* 기준시점 : 2015년 6월 (2015.06=100.0)○ 기 타* 2013년부터 국가통계위원회의 결정에 따라 전국주택가격동향조사의 통계작성기관이KB국민은행에서 한국감정원으로 변경됨* 2003년 11월부터 2011년 12월까지의 변동률은 KB국민은행으로부터 기존의 표본가격을협조받아 개선된 지수산식(기하평균)에 의해 작성된 것으로, 기 공표된 KB지수의변동률과 다를 수 있음(KB지수의 변동률이 반영된 (구)시계열통계표는 http://www.r-one.co.kr 참조)* 연도별 자료는 12월 기준'
