summary_user: 하동군의 관리지역(보전·생산·계획관리지역 등) 현황을 도시계획정보 시스템에 등록된 도형 한 건 단위로 담은 파일로, 도형 관리번호·속성코드·결정고시 관리코드·라벨명·면적·길이·생성일시를 포함하며 범위는 하동군 한 시군구다. 하동군 안에서 관리지역이 어디에 얼마만큼 지정돼 있는지, 특정 결정고시로 생긴 관리지역 도형의 면적이 얼마인지 확인하려는 토지 소유자·개발 사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 시군구코드나 결정고시관리코드 같은 같은 기관 코드, 또는 라벨명 매핑으로만 잇는다.
