summary_user: 한국토지주택공사가 공급하는 행복주택의 공급계획을 사업지구 단위로 담은 전국 범위 파일로, 지역·유형·지구명·전용면적별 공급호수와 공급시기·입주예정 시점, 담당 본부를 행으로 담는다. 대학생·사회초년생·신혼부부 등 입주 희망자가 "우리 지역에 언제 몇 호의 행복주택이 공급되고 언제 입주할 수 있나"를 확인하거나, 분석가가 지역별·면적대별 공공임대 공급 물량을 집계하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 주택 공급·청약 데이터와는 지역명·지구명 같은 이름을 맞춰서만 연결한다.
description_portal: 한국토지주택공사가 건설한 행복주택의 사업지구명, 공급면적, 공급호수, 공급일정 등 공급계획에 관한 데이터를 제공합니다. 행복주택은 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 대학생, 사회초년생, 신혼부부 등 젊은 층의 주거안정을 목적으로 공급하는 공공임대주택입니다. 21년도 기준으로 경기도 3,342건(36.2%), 경상북도 2,595건 (28.1%) 로 집계됩니다. 면적의 단위는 제곱미터로 20-30 이 4143호(44.9%), 40-50이 1891호(20.5%) 를 차지합니다. 공급시기와 입주예정일의 차이는 8~16개월 사이로 구분됩니다.
