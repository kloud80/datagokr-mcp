summary_user: 전국 지역별 지가변동률과 지가지수를 기준 연도·월 단위로 담고, 법정동 경계도면과 합친 WMS/속성정보를 외부 API로 제공한다. 분석가나 부동산 사업자가 특정 시도·시군구·읍면동의 땅값이 얼마나 오르내렸는지 확인하는 질문에 쓴다. 시도·시군구·읍면동 법정동 코드 필드(ldCtprvnCode, ldCpsgCode, ldEmdLiCode)가 있어 같은 기관의 법정동 코드 기반 데이터와 이어 쓸 수 있으나, 전역 조인 키는 확인되지 않았다.
description_portal: 일반적인 지가수준의 변동을 측정하기 위한 지표 정보를 지역별로 제공하는 지가변동률정보와 법정동 경계도면과 융복합한 공간정보OGC(Open Geospatial Consortium) 표준 API는 공간 데이터의 공유와 상호운용성을 위해 개발된 국제 표준으로, 웹 기반에서 지도, 피처, 래스터 등 다양한 지리정보를 효율적으로 제공·활용할 수 있게 합니다. 최신 OGC API는 RESTful 구조를 채택해 개발 편의성과 확장성을 높였으며, WMS, WFS 등 기존 표준을 현대적으로 계승합니다
