summary_user: 부산광역시 수영구 관내 하천의 점용 허가를 건별로 담은 파일(csv, 약 3.8KB)로, 유형·하천명·소재지·점용자·면적(제곱미터)·용도·점용 시작·연장신청·종료일을 기록한다. 주민이나 사업자가 수영구 어느 하천 구간이 누구에게 어떤 용도로 언제까지 점용 허가돼 있는지 확인하거나, 분석가가 하천별 점용 면적·용도 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 하천명·소재지 주소를 기준으로 하천 목록·하천구역 등 다른 하천 자료와 이름 매핑으로 이어 써야 한다.
description_portal: 이 데이터는 특정 지역(부산광역시 수영구 관내)의 하천을 공공 목적 또는 사적 용도로 점용하기 위한 허가 현황을 정리한 자료입니다. 유형, 하천명, 소재지, 점용자, 면적, 용도, 점용시작일, 연장신청일, 점용종료일 등의 항목으로 구성되어 있습니다. 이를 통해 지역 내  하천 점용 현황과 특성을 체계적으로 파악할 수 있으며, 하천 관리 및 환경 보호 정책 수립에 활용됩니다. 시민들은 하천 이용 및 점용 관련 정보를 확인할 수 있고, 하천 점용 허가 관리와 점검, 지속 가능한 수자원 관리에 필요한 기초 자료로 활용할 수 있습니다. 해당 자료는 정기적으로 갱신되어 최신성과 정확성을 유지하며, 쾌적한 자연환경 보전과 주민 생활 안전 확보에도 기여할 수 있습니다.
