summary_user: 대구광역시 달성군 내 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 주소·전화번호·객실수·업종명·허가일자·데이터기준일자를 담는다(csv 약 5KB 규모). 관광객이나 숙박 관련 사업자, 지역 분석가가 달성군 어느 지역에 어떤 업종의 숙박업소가 몇 객실 규모로 분포하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소를 기준으로 맞춰 이어 써야 하며, 주소를 지오코딩하면 관광지 등 위치 데이터와 겹쳐 볼 수 있다.
description_portal: 숙박업소의 기본 현황 정보를 정리한 자료로, 업소 명칭, 위치, 업종 유형 등 숙박업 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 숙박업소의 분포 현황과 운영 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 숙박업 현황에 대한 체계적인 관리를 통해 관광 기반 시설의 현황을 분석하고, 관광 정책 수립 및 지역 관광 활성화를 위한 행정적 의사결정을 지원한다. 본 자료는 숙박업에 대한 행정 관리, 지도·점검, 관련 민원 대응과 함께 관광 관련 통계 산출 및 관광 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 관광객 수요에 대응한 숙박 인프라 관리와 관광 서비스 품질 향상을 위한 정책 추진의 기초자료로 활용되며, 지속 가능한 관광 행정 및 지역 관광 산업 육성을 지원하는 행정자료로 활용된다.
