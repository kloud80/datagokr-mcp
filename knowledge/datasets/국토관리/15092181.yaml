description_portal: 한국토지주택공사 렌트홈 홈페이지 내 임대차계약, 민간임대주택 양도, 임대사업자 등록 등에 관한 민원법정서식 데이터를 제공합니다. 렌트홈은 국민의 주거복지와 직결된 임대차시장의 정보 인프라를 확충하고, 임대사업자의 편익 증진과 임차인의 권리를 보호하고자 만들어진 민간임대 민원 One-Stop처리 대국민 서비스입니다. 민간임대주택의 양도신고서 및 신청서, 임대사업자의 등록증, 임대보증금 보증에 대한 동의서, 임대차계약서에 대한 서식 및 법률사항을 다운로드 받을 수 있습니다.
