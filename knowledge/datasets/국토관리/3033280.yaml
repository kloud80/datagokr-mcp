summary_user: 진도군 관내 농공단지에 입주한 업체를 한 행씩 담은 건별 명단으로, 단지명·회사명·대표자·업종(중분류 코드)·생산품·입주형태·가동현황과 도로명·지번 주소, 위도·경도를 담는다(CSV 약 5.5KB 규모). 구직자나 영업 담당자가 '진도 농공단지에 어떤 업종 업체가 있고 실제 가동 중인 곳은 어디인가'를 확인하거나, 분석가가 단지별 업종 분포와 미가동 업체를 파악하는 데 쓴다. 전역 조인 키는 없어 업종코드(중분류)로 업종 분류 통계와, 주소·좌표로 지도·공간정보와, 업체명으로 공장 등록 자료와 맞춰 이어 쓴다.
description_portal: 전남광주통합특별시 진도군 농공단지 입주업체 현황 공공데이터는 진도군 관내 농공단지에 입주한 기업의 기본 현황과 운영정보를 확인할 수 있도록 농공단지명, 회사명, 대표자, 업종, 업종코드, 생산품, 입주형태, 도로명주소, 소재지주소, 가동현황, 위도, 경도, 데이터기준일자 등의 항목을 제공하는 자료입니다. 본 데이터는 농공단지별 입주기업의 분포와 업종 특성, 주요 생산품, 실제 가동 여부 등을 종합적으로 파악할 수 있도록 구성되어 있어 진도군의 산업 및 기업 현황을 이해하는 데 활용할 수 있습니다. 특히 업종과 생산품 정보를 통해 농공단지에 어떤 분야의 기업이 입주하고 있는지 확인할 수 있으며, 입주형태와 가동현황을 함께 활용하면 기업의 운영 상태와 농공단지 활용 정도를 분석하는 데 도움이 됩니다. 또한 도로명주소와 소재지주소, 위도·경도 정보를 제공하여 기업의 위치를 지도상에서 확인하거나 공간정보와 연계한 분석에도 활용할 수 있습니다. 해당 데이터는 농공단지 관리, 기업지원 정책 수립, 산업구조 분석, 기업 유치 및 투자유치 업무, 지역경제 활성화 정책 추진 등을 위한 기초자료로 활용할 수 있으며, 미가동 업체 현황 파악이나 농공단지 내 업종별 분포 분석에도 활용 가능합니다. 아울러 관련 기관과 연구자, 사업자는 진도군 농공단지의 입주기업 및 생산활동 현황을 확인하고 지역 산업의 특성과 기업 입지 여건을 분석하는 데 참고할 수 있습니다. 진도군 농공단지 관련 정보를 지속적으로 공개함으로써 기업정보 접근성을 높이고, 산업정책 및 기업지원 업무의 효율적인 추진과 공공데이터 활용 활성화에 기여할 수 있습니다.
