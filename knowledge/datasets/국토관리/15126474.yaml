summary_user: 신고된 아파트 전월세 계약을 건별로 담은 원천 데이터로, 단지명·전용면적·층·보증금(만원)·월세(만원)·계약기간·종전 계약 금액을 포함하고 범위는 전국이다. 세입자나 임대인, 분석가가 특정 시군구·계약년월의 아파트 전월세 보증금과 월세 수준이 어느 정도인지 확인하는 데 쓴다. 시군구 코드(sggCd, roadnmsggcd)와 단지 일련번호(aptSeq)가 조인 키라서 같은 키를 가진 다른 실거래·주택 데이터와 지역·단지 단위로 이어 쓴다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료 및 「주택임대차보호법」에 따라 부여된 확정일자 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월 6자리(예시 : 201801)로 해당 지역, 해당 기간의 아파트 전월세 실거래가 상세자료를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 아파트 전월세 자료를 제공하는 아파트 전월세 실거래가 상세 자료 조회* 공개내용 중 개인정보보호를 위해 아파트 전월세의 동/호정보는 제공되지 않습니다'
team:
  dept: 부동산소비자보호기획단
services:
  - op: /getRTMSDataSvcAptRent
    name: 아파트 전월세 실거래가 공개 자료
    endpoint: https://apis.data.go.kr/1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: LAWD_CD
        required: true
        example: '11110'
        desc: 지역코드, 각 지역별 코드 행정표준코드관리시스템(www.code.go.kr)의 법정동코드 10자리 중 앞 5자리
      - name: DEAL_YMD
        required: true
        example: '201512'
        desc: 계약월, 실거래 자료의 계약년월(6자리)
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
