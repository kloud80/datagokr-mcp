description_portal: 이 데이터는 경상남도 내에서 경남개발공사가 시행하거나 참여한 주요 일반산업단지의 조성현황을 종합적으로 정리한 자료입니다. 각 산업단지별로 위치, 조성면적, 사업기간, 사업비와 같은 사업 개요를 포함하고 있으며, 세부적으로는 각 단계별 행정절차 이력(지정 고시, 실시계획 승인, 착공, 준공 등)이 연도별로 명시되어 있습니다.또한, 일부 산업단지의 경우 조감도, 위치도, 토지이용계획도, 위성사진 등 시각 자료도 함께 수록되어 있어 공간적 이해도를 높이는데 유용합니다. 이 데이터는 경남지역 산업기반 개발의 과거 추진성과와 향후 계획을 파악하는 데 필수적인 기초자료로 활용될 수 있으며, 지역경제 활성화 및 기업 유치를 위한 산업 인프라 정책 수립의 기반 자료로도 의미가 큽니다.총 7개 단지를 대상으로 하며, 각 단지별 추진 연혁이 포함되어 있어 타산단과의 비교나 정책 효과성 분석에도 적합합니다. 산업단지 관련 민간사업자, 지자체, 연구기관, 학계 등 다양한 수요자에게 실무적·연구적 활용 가치를 제공합니다.
