summary_user: 한국수자원공사가 광역·지방 상수도 정수장에서 하천복류수를 원수로 쓰는 경우 월별로 실시한 법정 수질검사 결과를 취수장·측정지점·채수일자 단위의 건별 기록으로 담으며, 포털 설명상 2024년 7월부터 12월까지의 결과이고 측정지점은 주소 수준으로 전국에 걸친다. 정수장 원수의 수소이온농도·생물화학적 산소요구량·총유기탄소·총인·부유물질량·용존산소량·대장균군 수치를 확인해 특정 취수원의 원수 수질이 어떤지 살피는 분석가나 상수도 위생 점검 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 정수장명·취수장명 같은 이름이나 측정지점주소로 다른 수질·상수도 자료와 맞춰 이어 써야 한다.
limits: 표준 코드 형태의 조인 키가 없어 다른 데이터와는 이름·주소 매칭에 의존하므로 표기 차이에 주의해야 한다. 정수 후 수돗물 수질이 아니라 원수(하천복류수) 검사 결과만 담는다.
