description_portal: '○ 통계개요* 통계명 : 하수관거* 통계종류 : 서울시 하수관거 연장 및 보급율 등의 설치현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 하수관련 현황을 조사ㆍ분석하여 시설의 적정 설치 및 관리를 위한정책수립의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 및 자치구 → 서울시 → 환경부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 해당시설 및 자치구내용 - 서울시 하수관거의 용도별(합류식ㆍ분류식(오수/우수))설치현황,맨홀ㆍ우/오수받이 개소수 등○ 용어설명* 하수관거 : 여러 하수구에서 하수를 모아 하수처리장으로 내려보내는 큰 하수도관* 합류식 계획면적 : 하수도정비기본계획에 의해 계획된 합류식 배수구역 면적* 합류식 계획연장 : 하수도정비기본계획에 의하여 계획된 합류식 연장으로서 기존시설연장과 신설예정인 연장을 합산한 값 기재 (차집관거의 계획연장 포함)* 합류식 시설연장 : 차집관거 시설연장을 포함한 합류식으로 설치된 시설연장(암거+개거+측구)'
