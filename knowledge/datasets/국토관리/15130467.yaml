summary_user: 충청남도 홍성군 도시계획정보시스템(UPIS)에 등록된 도로 현황을 도형 단위로 담은 시군구 범위의 원천 파일(CSV 약 143KB)로, 도로마다 규모 등급·류별·번호, 도로기능, 면적·길이, 집행상태, 결정고시 관리코드를 기록한다. 홍성군에서 땅을 살피는 주민·사업자나 분석가가 "이 지역에 도시계획도로가 결정돼 있고 아직 집행되지 않았는가"를 확인해 개발 가능성을 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 시군구코드나 결정고시관리코드를 매개로 같은 기관의 UPIS 결정조서·고시 데이터와 이름·코드를 맞춰 연결한다.
