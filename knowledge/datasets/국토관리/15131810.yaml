summary_user: 경남개발공사가 시행한 택지개발·도로건설·하천재해예방 등 공공사업의 사업지구별로 기준일자, 면적구간(시작·종료 면적과 구간 명칭), 구간별 기준 보상금액(원)을 정리한 기준표 파일(CSV, 약 12KB)입니다. 보상 실무자나 분석가가 '이 사업에서 33㎡ 미만 구간과 99㎡ 이상 구간의 보상 기준금액은 각각 얼마인가'를 확인하고, 보상금 예산 수립이나 사업 간 단가 비교에 씁니다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 사업 구분 코드를 같은 기관 자료의 사업명과 이름·코드로 맞춰야만 이어 쓸 수 있습니다.
description_portal: 본 데이터는 경남개발공사에서 시행한 택지개발사업, 도로건설, 하천재해예방사업 등 공공사업에 따른 기준면적별 보상단가 현황을 정리한 것입니다. 각 사업지구별로 기준일자, 면적구간(㎡), 구간별 명칭, 해당 면적범위 시작·종료값, 그리고 **기준 보상금액(원)**이 수록되어 있습니다.주요 활용 목적은 토지보상 및 건축물 보상 기준 산정의 참조, 보상금 예산 계획 수립, 유사용역 단가 산정, 사업별 보상금액 비교 분석 등입니다.해당 데이터는 보상 대상 면적을 33㎡ 미만부터 99㎡ 이상까지 구간으로 나누고, 각 구간에 맞는 단가 기준을 제공하여 정책의 투명성 확보와 시민 안내 자료로 활용할 수 있습니다.이 데이터는 사업명, 기준일자, 기준면적코드 및 명칭, 면적범위, 기준금액만을 포함하고 있으며, 개인 식별 정보는 전혀 포함되어 있지 않아 공개에 제한이 없습니다.
