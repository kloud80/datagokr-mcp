description_portal: 기계설비유지관리자 선임신고 대상 건축물 현황은 「기계설비법」에 따라 일정 규모 이상의 건축물에 대해 기계설비유지관리자를 선임해야 하는 의무 대상 정보를 제공합니다. 본 데이터는 부천시 관내 대상 건축물의 건물명, 주소, 연면적, 공동주택 면적을 제외한 연면적, 선임 기준일 등의 항목으로 구성되어 있으며, 건축물의 에너지 효율성 및 기계설비 안전관리 강화를 위한 정책 수립, 시설물 안전관리, 기후위기 대응 관련 분석 자료로 활용될 수 있습니다. 건축물 유지관리자의 선임 기준은 연면적 및 세대 수에 따라 구분되며, 관련 내용은 「기계설비법」 및 관련 시행령·고시에 따릅니다. 데이터 건수가 많을 경우, Excel 등의 일반 프로그램에서 일부 정보가 누락될 수 있으므로 부천시 홈페이지  방문을 권장합니다.
