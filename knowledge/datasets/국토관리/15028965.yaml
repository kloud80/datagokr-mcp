summary_user: 대전광역시 서구 관내에서 시공 중인 아파트형 공동주택을 공사 건별로 담은 파일로, 공사명·착공일·준공예정일·공사위치·세대수·시공업체명과 전화번호·데이터기준일자를 포함하며 파일 크기는 828바이트로 소량이다. 서구에 짓고 있는 신규 아파트가 어디에 몇 세대 규모로 언제 준공 예정인지 알고 싶은 주민이나, 지역 주택 공급 시점을 살피는 분석가가 쓴다. 전역 조인 키가 없어 K-apt 단지코드나 실거래·청약 데이터와는 공사명(단지명)·공사위치 주소를 이름 매칭해 이어 써야 한다.
limits: 단지코드 같은 공통 키가 없어 다른 주택 데이터와의 연결은 이름·주소 매칭에 의존한다. 범위가 대전 서구 한 시군구로 한정되고, 좌표가 없는 비공간 데이터라 지도 시각화에는 주소 변환이 필요하다.
