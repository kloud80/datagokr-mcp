summary_user: 경상남도 남해군 관내에 설치된 현수막 게시대를 한 곳씩 담은 목록 파일로, 설치 읍면·설치장소·주소·게시면수·현수막 규격(미터)·종류를 담는다. 현수막을 걸려는 주민·사업자가 우리 읍면 어디에 게시대가 있고 몇 면을 쓸 수 있는지 확인하거나, 분석가가 읍면별 게시대 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 주소나 읍면 이름을 매칭해 다른 남해군 시설·행정구역 데이터와 이어 쓴다.
description_portal: '경상남도 남해군 관내의 현수막 게시대 설치 현황입니다. 개방되고 있는 데이터 항목으로는 설치 읍면, 게시면수, 설치장소, 주소, 현수막 규격(미터), 종류와 용도 구분 등 현수막 게시대의 정보를 포함하고 있습니다. 설치 읍면별 현수막 게시대 현황을 파악할 수 있고, 종류별, 용도별로도 파악할 수 있습니다. 현재 개방 기준일로 설치된 곳은 총 57곳이며,  용도로는 상업용, 행정용, 정치&행정용 3종류로 운영되고 있습니다. 연간 단위로 업데이트 되는 데이터로 (담당 부서 : 도시건축과)에서 관리하는 데이터이니 참고하여 활용하시기 바랍니다.'
