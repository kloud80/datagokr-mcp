summary_user: 마이홈포털의 기존 10년임대 주택 단지 목록으로, 단지별로 세대수·주택유형·임대사업자·공급면적·임대보증금·월임대료·전환보증금 등을 담은 981행 전국 파일이다. 임차 희망자나 분석가가 특정 지역에 어떤 10년임대 단지가 있고 보증금과 월임대료가 얼마인지 확인하는 질문에 쓴다. 도로명주소(address)를 키로 다른 주소 기반 주택 데이터와 이어 쓰며, 전월세 실거래와 병합해 보는 관계로 분류돼 있다.
description_portal: 한국토지주택공사에서 위탁관리중인 마이홈포털의 기존 10년임대 주택 정보로, 광역시도및 시군구, 단지명, 세대수, 주택유형, 임대사업자, 공급면적(전용, 공용), 준공일자, 난방방식, 주차대수, 승강기 설치여부, 임대보증금, 월임대료, 전환보증금 등의 정보를 제공합니다. 10년임대 주택은 최초 입주 개시일로부터 최대 10년까지 임대주택의 형태로 거주가 가능하고 10년이 지나면 그 시점의 임차인에게 분양전환을 받을 수 있는 기회를 제공하는 주택을 말합니다. 본 데이터는 공급주체가 한국토지주택공사가 아닌 위탁 관리 중인 주택 정보를 포함하고 있으므로 유의하시기 바랍니다.
