summary_user: 충청남도 공주시에 설치된 재난대응용 배수펌프장을 시설 한 곳당 한 행으로 담은 파일로, 펌프장명·주소·설치년도·설치목적·모터와 엔진 출력·한전 전원공급방식과 계약전력·연간 사용전력·전기요금이 들어 있으며 CSV 크기는 522바이트로 작다. 공주시 담당자나 방재·에너지 분석가가 "우리 시 배수펌프장은 언제 설치됐고 연간 전력을 얼마나 쓰며 전기요금이 얼마인가"를 확인하거나 시설 보강·전력공급 개선 대상을 고를 때 쓴다. 전역 조인 키가 없으므로 다른 하천·배수 시설 데이터와는 펌프장명이나 주소를 맞춰 잇거나 같은 기관(공주시) 기준으로만 연결한다.
limits: 하천코드 같은 공통 키가 없어 국가 하천 시설 원장이나 공간정보와 자동으로 결합되지 않고, 이름·주소 매칭이 필요하다. 범위는 공주시 한 곳뿐이라 다른 시군과 비교하려면 별도 자료가 필요하다.
