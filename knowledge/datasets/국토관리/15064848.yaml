summary_user: 제주시 관내 지역주택조합 아파트 사업을 조합 한 건씩 담은 파일로, 조합명·건설예정지역·주택규모(호_세대당주택규모)와 조합원모집신고일부터 사업승인일·착공일·사용검사일까지 인허가 단계별 날짜를 기록한다(CSV 약 1.3KB의 소규모 파일). 제주시에서 어느 지역주택조합이 어느 단계까지 진행됐는지, 앞으로 언제쯤 아파트가 준공·입주될지를 가늠하려는 주민·조합 가입 검토자·주택 공급 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 주택 인허가·분양 데이터와는 조합명이나 건설예정지역 주소를 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 제주특별자치도 제주시 관내에서 추진 중인 '지역주택조합' 아파트 건설 사업의 전반적인 진행 상황과 인허가 현황을 파악할 수 있는 행정 통계 자료입니다.지역 주민들이 직접 조합을 결성해 주택을 공급하는 지역주택조합 사업의 특성을 반영하여, 각 사업 주체인 '조합명'과 실제 아파트가 지어질 '건설예정지역'의 상세 위치를 제공합니다. 또한 공급되는 주택의 평형별 면적과 세대수를 나타내는 '호_세대당주택규모'를 통해 단지의 물리적 규모를 확인할 수 있습니다.특히 이 자료는 복잡한 사업 추진 과정을 투명하게 보여주기 위해 '조합원모집신고일'부터 행정관청의 '사업승인일', 실제 공사 시작인 '착공일', 그리고 입주가 가능해지는 '사용검사일'까지 각 인허가 단계별 날짜를 상세히 기록하고 있습니다. 이를 통해 제주시 내 민간 주도 신규 아파트 공급의 진행 속도를 확인하고, 향후 공동주택 공급 시기를 예측하는 지표로 활용할 수 있습니다.
