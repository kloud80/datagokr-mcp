summary_user: 부산광역시에서 시행된 도로굴착 공사를 허가 건별로 담은 원천 데이터로, 등록구·행정동, 공사명, 주소, 공사기간, 신청자, 허가번호·허가일, 점용목적, 공작물 구조, 폭·연장을 포함하며 범위는 시도, 행정단위는 읍면동이다. 시민이나 사업자가 '우리 동네 도로에서 지금 어떤 굴착공사가 언제까지 진행되나'를 확인하거나, 분석가가 구·동별 굴착 빈도와 점용목적을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 주소 같은 이름 매핑, 또는 부산시 내부 코드로만 연결한다.
description_portal: 부산시청, 건설업, 공사공단, 통신업체 등에서 시행하는 각종 도로굴착 정보 데이터를 개방합니다.개방되는 데이터는 등록구, 행정동, 공사명, 주소, 공사기간, 신청자, 허가번호, 허가일, 점용목적, 공작물 구조, 폭, 연장 정보를 포함합니다.2017년부터 굴착정보를 개방하고 있으며 중구 1,082건, 서구 2,227건, 동구 950건, 영도구 544건, 부산진구 4,133건, 동래구 1,508건, 남구 2,532건, 북구 835건, 해운대구 3,559건, 사하구 3,644건, 금정구 1,208건, 강서구 329건, 연제구 3,64건, 수영구 622건, 사상구 ,64건, 기장군 1,494건 등 총 29,595건 입니다*기준일 2025.5.21 현재
