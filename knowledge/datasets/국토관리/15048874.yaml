summary_user: '강원특별자치도 홍천군에 등록된 제조업 공장을 한 줄에 한 곳씩 담은 명부로, 2024년 9월 23일 기준 175개 공장의 회사명·대표자·연락처·생산품·공장 주소를 담는다. 홍천군에서 특정 품목(예: 플라스틱 수납용품, 건설재료)을 만드는 공장이 어디에 있고 연락처가 무엇인지 찾는 사업자나 지역 제조업 분포를 보는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 데이터와는 회사명이나 공장 주소(주소 정제·지오코딩 후)로만 맞춰 이어 쓴다.'
