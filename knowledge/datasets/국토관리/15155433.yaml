description_portal: 본 데이터는 한국토지주택공사에서 공급 계획이 수립된 공공분양주택의 상세 정보를 제공합니다. 상세 정보에는 공급유형, 공급지역명, 사업지구명, 총 세대수, 주택 전용면적, 총 공급호수, 공급 예정시기, 관힐 지역본부, 그리고 기타 비고 사항이 포함되어 있습니다. 분양주택의 공급유형에는 일반적으로 일반 공공분양과 신혼희망타운이 있습니다. 주택 전용면적이 60제곱미터 이하인 경우에는 보통 전용면적 59제곱미터가 많습니다. 전용면적이 60~85제곱미터인 경우에는 보통 국민 전용면적인 84제곱미터가 대부분을 이루고 74제곱미터나 그 외 기타 면적이 일부분을 차지하고 있습니다. 공급예정시기는 일반적으로 최초 공고일을 의미합니다. 본 사항은 모두 계획이므로 향후 사업추진 및 공사 여건에 따라 변경될 수 있음을 유의하시기 바랍니다.
