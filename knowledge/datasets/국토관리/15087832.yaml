description_portal: 이 데이터는 거제시에서 추진 중인 도시개발사업의 기본 정보와 진행 현황을 정리한 자료입니다.‘지구명’은 개발사업의 대상 지역 명칭을, ‘시행자’는 사업을 추진하는 기관 또는 업체를 의미합니다.‘위치’는 개발지구의 행정구역상 위치를, ‘면적(제곱미터)’은 사업 구역의 총 면적을 나타냅니다.‘사업방식’은 공영개발·민영개발·환지방식 등 추진 형태를 구분하며, ‘세대수(호)’와 ‘수용인구(명)’은 개발 완료 후 예상 규모를 제공합니다.‘구역지정개발계획일자’, ‘시행자지정일자’, ‘실시계획인가일자’, ‘환지계획인가일자’는 주요 인가 및 승인 일자를 기록한 항목입니다.‘감보율’은 토지 환지사업에서의 감보 비율을, ‘진행사항’은 현재 사업의 추진 단계를 나타냅니다.‘기준일자’는 데이터의 기준 시점을 명시하여 정보의 최신성을 확인할 수 있도록 합니다.
