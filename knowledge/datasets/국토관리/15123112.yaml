summary_user: 경기도 시군별·연도별로 일반주택·아파트·빌라의 매매와 전월세 거래건수와 평균 실거래가격을 묶은 집계 데이터로, 건별 거래 원천이 아니라 시군 단위 요약이다. 분석가나 지자체 담당자가 '우리 시의 아파트 매매·전월세 거래가 연도별로 어떻게 변했고 빌라와 비교하면 어떤가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드(sigun_cd)·시군명으로 같은 경기도 데이터나 행정구역 이름 매핑을 거쳐 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군의 주거용 부동산 실거래 정보를 연도별로 구분하여 제공하며, 일반주택, 아파트, 빌라의 매매 및 전월세 거래수와 거래가격을 포함하고 있습니다. 주요 항목으로는 시군명, 거래유형별 거래건수(매매 및 전월세), 실거래 평균가격, 데이터 생성일자 등이 있으며, 거래금액은 단위 면적당 가격을 기준으로 제공됩니다. 이 데이터는 경기도 내 주거용 부동산 시장의 지역별 동향을 분석하거나, 주택유형별 가격 추이를 살펴보고 부동산 정책 수립, 투자 판단 등에 활용될 수 있습니다. 또한 주거유형 간 비교 분석, 시장 수요 예측 등 다양한 부동산 관련 연구와 행정계획에 유용한 자료입니다.
