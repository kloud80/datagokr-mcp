summary_user: 세종특별자치시의 상하수도 요금표를 업종별·구분별로 담은 API로, 요금 기준사용량(㎥) 구간과 ㎥당 요금, 요금 데이터 제공일자를 행 단위로 제공한다. 세종시에서 가정이나 영업장을 운영하는 시민·사업자가 "우리 업종은 사용량 구간별로 ㎥당 상하수도 요금이 얼마인가"를 확인하거나, 분석가가 월 사용량으로 요금을 추정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종명 같은 이름 매핑이나 같은 기관(세종시) 기준으로만 이어 쓴다.
