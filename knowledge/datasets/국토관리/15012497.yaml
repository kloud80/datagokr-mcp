description_portal: '제주특별자치도에서 운영 관리하고 있는 도내 도시개발 추진 현황 관련 데이터를 제공합니다.항목: 구분,위치정보,면적(㎡),사업비(억원),사업시작년도 등*「도시개발법」에 의거 도시개발구역에서 주거, 상업, 산업, 유통, 정보통신, 생태, 문화, 보건 및 복지 등의 기능이 있는 단지 또는 시가지를 조성하기 위하여 시행하는 사업*계획적이고 체계적인 도시개발을 도모하고 쾌적한 도시환경의 조성과 공공복리의 증진에 이바지함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1581'
