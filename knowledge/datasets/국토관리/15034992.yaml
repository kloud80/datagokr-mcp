description_portal: '이 공공데이터는 경상남도 사천시에 소재한 제조업체들의 주요 정보를 종합적으로 수록한 자료입니다.  산업이 발달한 지역 특성을 반영하여, 지역 경제 활성화와 산업 생태계 파악에 필수적인 정보를 제공합니다.회사명: 각 제조업체의 정식 명칭을 명시합니다.전화번호 및 팩스번호: 기업 간 연락 및 업무 제휴를 위한 필수 연락 정보를 제공합니다.주소: 업체가 위치한 정확한 사업장 소재지를 나타냅니다.업종명: 해당 기업이 영위하는 주요 산업 분야 (예: 항공기 부품 제조업, 금속 가공업 등)를 분류하여 산업 통계 및 분석의 기초를 제공합니다.생산품: 해당 업체에서 주력으로 생산하는 제품의 종류를 구체적으로 명시합니다.이 현황 자료는 투자 유치, 산업 지도 제작, 공급망 분석, 그리고 지역 제조업의 경쟁력과 규모를 파악하는 데 매우 중요한 자료로 활용됩니다.'
