summary_user: 포천시 관내 가구 제조업체를 업체(공장) 한 건씩 회사명, 공장 위치(읍면동), 생산품, 데이터 기준일자로 정리한 시군구 단위 명부 파일(csv, 약 31KB)이다. 가구 납품처나 협력업체를 찾는 사업자가 포천 어느 읍면동에 어떤 가구를 만드는 업체가 있는지 확인하거나, 분석가가 읍면동별 가구업체 분포를 볼 때 쓴다. 사업자번호·산업분류코드·필지번호 같은 전역 조인 키가 없어 팩토리온 공장등록 정보 등 다른 데이터와는 회사명이나 읍면동 이름으로 맞춰 이어야 한다.
description_portal: 포천시 가구제조업체 현황 데이터는 포천시 관내에 위치한 가구 제조업체들의 기본 정보를 수록한 자료로, 연번, 회사명, 공장 위치, 종업원 수, 주요 생산품 등의 항목으로 구성되어 있습니다. 해당 데이터는 포천시에 등록된 가구 제조업체를 기준으로 수집되며, 지역 내 제조업체의 규모와 업종별 분포, 인력 구성 등의 현황을 파악할 수 있도록 정리된 표 형식의 정량적 자료입니다. 공장 단위로 정리되어 있으며, 각 업체의 생산활동 정보가 포함되어 있어 지역 산업 구조를 파악하는 데 필요한 기초 정보입니다.
