summary_user: 경상북도개발공사가 공급한 도청신도시 1단계 토지의 분양현황을 필지(확정지번) 단위로 담은 파일로, 사업지구·소재지(예천군·안동시)·면적·공급용도(공동주택용지, 근린생활시설용지, 단독주택, 이주자용 등)를 행마다 기록한다. 도청신도시에 땅을 사려는 사업자나 개인, 신도시 개발 현황을 보는 분석가가 '어느 지번이 어떤 용도로 얼마만큼의 면적으로 분양됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 확정지번을 기준으로 같은 공사의 도청신도시 미분양현황 파일과 맞대어 쓰거나 소재지·지번 문자열로 주소 기반 자료와 이어야 한다.
description_portal: 경상북도개발공사의 도청신도시 1단계 분양현황입니다. 사업지구, 소재지, 확정지번, 면적 등 내용을 포함하고 있습니다. 공사의 도청신도시 분양데이터는 도청이전 신도시 건설사업과 도청신도시 사업으로 구분하여 관리하고 있습니다. 소재지는 예천군과 안동시에 소속되어 있습니다. 도청신도시 분양현황의 지번데이터와 미분양현황의 지번데이터를 연결하여 이용할수 있습니다. 공급용도는 공공업무시설용지, 공동주택용지, 근린생활시설용지, 단독주택 등으로 관리하고 있으며, 이주자를 위한 용도를 별도로 지정해 분양하고 있습니다.
