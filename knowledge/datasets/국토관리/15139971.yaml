summary_user: 신안군 내 돼지사육시설별로 상호·대표자·주소·전화번호와 가축분뇨 폐수량, 폐수처리시설 연계 여부, 적용 처리공법을 한 행씩 담은 시설 단위 원천 목록으로, 파일 크기가 약 1.3KB에 불과한 소규모 자료다. 지자체 환경 담당자나 분석가가 "신안군 양돈농가 가운데 분뇨를 처리시설에 연계하지 않은 곳은 어디이고, 어떤 처리공법을 쓰는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 축산·하수 데이터와는 상호나 주소를 맞춰 붙이거나 같은 신안군 자료끼리만 연결한다.
description_portal: 본 데이터는 돼지사육시설에서 발생하는 가축분뇨의 발생량과 처리공법을 체계적으로 파악하기 위해 구축된 자료로, 각 시설의 상호, 대표자, 주소, 전화번호 등 기본 정보와 함께 가축분뇨 폐수 발생량, 폐수처리시설 연계 여부, 처리시설에서 적용 중인 처리공법 등이 포함되어 있습니다. 이는 지역 내 축산시설의 환경관리 수준을 진단하고, 가축분뇨의 적정 처리 여부를 확인하는 데 중요한 기초자료로 활용될 수 있습니다. 또한 지자체의 환경 행정 지원, 축산 악취 저감 정책 수립, 분뇨 자원화 기술 적용 가능성 검토 등 다양한 공공 목적에 유용하게 활용되며, 연구기관 및 관련 산업에서도 자료 분석과 정책 제안의 근거 자료로 활용할 수 있도록 구성된 공공 데이터입니다.
