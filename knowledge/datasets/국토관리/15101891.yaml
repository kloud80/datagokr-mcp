description_portal: '"도시계획현황 통계 중 부록부분은 다음과 같은 자료를 제공합니다.1. 시군구별 도시군기본계획수립(변경)에 대한 경위(공고일자, 목표연도, 면적, 주요변경내용)2. 시군구별 당해연도 기준 도시군관리계획 고시문 현황(결정일자, 고시근거, 주요변경내용)3. 시군구별 각 용도지역에 대한 건폐율 및 용적률 현황4. 시군구별 토지 총면적과 지목별 토지면적 현황5. 시군구별 개발규제(개발밀도관리구역, 기반시설부담구역, 개발행위허가제한지역)에 대한 개소 및 면적6. 시군구별 지구단위계획구역에 대한 구역명, 유형, 면적, 구역결정일 및 변경일, 계획수립일 및 변경일"'
