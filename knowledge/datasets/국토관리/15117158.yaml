summary_user: 인천광역시 계양구 관내 근린공원을 공원 한 곳당 한 행으로 정리한 파일로, 공원명·도로명주소·지번주소·위도·경도·면적을 담는다(CSV 약 1.3KB 규모). 주민이나 분석가가 '우리 동네 가까운 근린공원은 어디이고 면적은 얼마인가'를 확인하거나 계양구 안 근린공원 분포를 지도에 그릴 때 쓴다. 공원 코드 같은 공통 조인 키는 없어서 다른 데이터와는 공원명·주소를 맞춰 붙이거나 위도·경도 좌표로 공간 결합해 이어 쓴다.
limits: 전역 조인 키가 없어서 다른 공원·시설 데이터와 연결하려면 이름이나 주소를 직접 매칭해야 한다. 범위가 계양구 한 곳의 근린공원뿐이라 다른 시군구나 다른 공원 유형과 비교하려면 별도 자료가 필요하다.
