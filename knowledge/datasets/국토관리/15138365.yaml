summary_user: 전남광주통합특별시의 도시계획시설 결정 내용을 시설별 한 행씩 담은 파일(csv 약 12KB)로, 구분·주소·지역명과 기정·변경·변경후 면적, 최초 결정일자를 기록한다. 토지 소유자나 개발 사업자가 특정 주소 일대에 어떤 도시계획시설이 결정돼 있고 면적이 어떻게 바뀌었는지, 언제 처음 결정됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·지역명 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
description_portal: 도시계획시설 결정조서는 도시계획시설 설치·변경·폐지 과정에서 도시계획위원회 심의와 지방자치단체장의 결정 내용을 공식적으로 문서화한 자료입니다. 이 문서에는 시설의 명칭, 위치, 면적, 설치 목적, 관련 법적 근거, 관계 기관 협의 결과, 주민 의견 수렴 사항 등이 포함되어 도시계획의 투명성과 합법성을 확보합니다. 또한, 결정조서는 해당 시설의 시행과 관리, 토지보상, 후속 행정처리 등 다양한 절차에서 기본이 되는 핵심 자료로 활용됩니다. 따라서 결정조서는 도시공간의 합리적 이용과 체계적 개발을 지원하며, 계획 변경 시 이해관계자와 행정 간 분쟁 예방에 중요한 역할을 수행합니다. 이처럼 도시계획시설 결정조서는 도시 발전과 공공복리 증진을 위한 필수 문서로서, 관련 부서에서 철저히 관리·보존해야 합니다.
