summary_user: 경기부동산포털이 관리하는 경기도 내 건축물별 세대수 자료로, 시군구·읍면동 코드와 지번(대지구분·본번·부번), 포털 고유 ID에 세대수(hshld_cnt)를 붙여 건물 단위로 담는다. 도시계획·주거 분석가가 '이 읍면동에 세대가 몰린 건물이나 단지는 어디인가'처럼 지역별 세대 밀집과 단지별 세대 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시군구·읍면동 코드와 지번을 이름·코드 매핑하거나 같은 기관(경기도) 코드로 맞춰 잇는다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 경기도 내 주택 세대 현황 자료입니다. 각 데이터는 시군구코드, 대지구분, 본번·부번 등 지번 정보와 함께 해당 건축물의 세대수를 기록하고 있으며, 읍면동코드와 부동산포털 고유 ID를 통해 공간 단위별로 구체적인 식별이 가능합니다. 이를 통해 특정 지역 내 세대 밀집 현황, 주거 단지별 세대 분포, 행정구역별 주택 수급 구조를 분석할 수 있습니다. 주거 환경 분석, 도시계획, 인구 주거밀도 연구, 정책 수립 등에 유용한 기초 자료로 활용될 수 있으며, 대규모 단지부터 소규모 건축물까지 다양한 주택 현황을 포함합니다.
