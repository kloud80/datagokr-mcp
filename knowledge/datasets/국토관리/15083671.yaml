description_portal: 부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 고지집계 정보(당초 고지집계) 자료입니다.지방세법, 부산광역시 수도요금 등 부과·징수 사무처리 규정 등수도요금 = 구경별 기본요금 + 상⦁하수도요금⦁물이용부담금※ 복지감면(장애인, 기초생활수급자(생계,의료,주거,교육급여 수급자), 국가유공자, 세자녀, 조손) 대상자는 매월 가정용 10㎥에 해당하는 수도요금을 감면 후 부과하오니, 감면대상자 수도요금에서 감면 금액 공제후 부과하시기 바랍니다.사용량까지 단계별 요금을 합산하는 것이 원칙이나, 단계별 공제액을 적용함으로써 하수도요금을 신속, 간편하게 계산할 수 있음.
