summary_user: 인천광역시 미추홀구 일반건축물의 과세년도별 건물 시가표준액과 연면적을 물건지(소재지) 단위로 담은 건별 원천 파일입니다(CSV 약 6MB). 미추홀구에 건물을 가진 납세자나 분석가가 "이 건물의 재산세 과세 기준이 되는 시가표준액은 얼마이고, 면적 대비 수준은 어떤가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(법정동코드·지번 코드 등)가 없어, 건축물대장이나 공시지가 같은 다른 데이터와는 물건지 주소 문자열을 맞추거나 시군구명으로만 연결한다.
description_portal: 본 데이터는 인천광역시 미추홀구의 일반건축물 시가표준액 정보를 담고 있습니다. 시도명, 시군구명, 자치단체코드, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 건물호, 물건지, 건물시가표준액, 연면적 등의 데이터를 포함하고 있습니다. 미추홀구 내 일반건축물의 과세 기준이 되는 시가표준액과 건물 정보를 파악할 수 있으며, 법정동별, 번지별로 상세한 건축물 현황을 확인할 수 있습니다. 각 건물의 동호수별 시가표준액과 연면적 정보를 통해 부동산 가치와 규모를 분석할 수 있습니다. 건물 위치를 도로명주소로 확인할 수 있어 지역별 부동산 시장 분석이 가능합니다. 이 데이터는 재산세 과세 기준 파악, 부동산 시장 분석, 지역별 건축물 가치 평가 연구 등에 활용될 수 있습니다.
