summary_user: 부산광역시 도시재생종합정보관리시스템에 등록된 행복마을을 마을(사업) 단위로 담으며, 소재지주소, 사업면적(㎡), 거점시설명을 제공하고 범위는 부산 시 전역의 개별 주소 단위다. 주민이나 도시재생 분석가가 '우리 동네 근처 행복마을은 어디에 있고, 사업 규모와 거점시설은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 소재지주소(lctnAddr)를 주소 정제·지오코딩한 뒤 행정구역이나 다른 부산시 도시재생 데이터와 이름·주소로 맞춰 이어 쓴다.
limits: 공통 코드나 식별자 같은 조인 키가 없으므로 다른 데이터와 연결하려면 주소·명칭 매칭에 의존해야 한다. 담긴 항목은 주소·사업면적·거점시설명뿐이다. 사업비, 사업기간, 추진 상태는 이 데이터로 알 수 없다.
