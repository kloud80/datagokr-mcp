summary_user: 인천 연수구 관내 재개발·재건축 정비구역을 구역 한 건씩 담은 파일로, 구역명·대지위치·용도지역·정비면적·계획세대수와 기본계획고시·정비구역고시·조합설립·사업시행·관리처분 인가일을 담으며 파일 크기는 398바이트로 작다. 주민·토지등소유자·투자자가 '우리 동네 정비구역이 조합설립·사업시행·관리처분 중 어느 단계까지 왔는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구역명·대지위치(주소)를 이름으로 맞춰 잇거나 같은 연수구 자료끼리 연결해야 한다.
limits: 구역 코드나 필지 고유번호 같은 공통 키가 없어 실거래가·건축물대장 등과 자동으로 붙이기 어렵고 주소·이름 매칭이 필요하다. 명세상 연간·이벤트성 갱신이라 인가 단계가 바뀌어도 바로 반영되지 않을 수 있다. 연수구 한 곳만 다루므로 인천 전체나 다른 시군구 정비사업 비교에는 따로 자료가 필요하다.
