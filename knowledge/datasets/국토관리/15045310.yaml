summary_user: SH공사가 공급하는 국민임대주택의 단지별 공급계획을 담은 작은 파일(약 815바이트)로, 단지마다 공급 유형, 총 공급 세대수, 전용면적대별(29·39·49㎡ 이상) 예정 물량, 소재지, 공급 예정 연도·월을 한 행씩 담는다. 무주택 서민이나 상담·분석 담당자가 '언제 어느 지역 단지에서 몇 ㎡형 국민임대가 몇 세대 나오는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 단지명이나 소재지 주소를 이름·주소 매칭해 이어 쓴다.
description_portal: 이 데이터는 서울주택도시개발공사(SH공사)가 제공하는 국민임대주택의 공급계획 정보를 담고 있으며, 주거안정이 필요한 무주택 서민층을 대상으로 한 공공임대주택 정책의 실행 내용을 보여주는 자료입니다. 주요 항목으로는 공급 유형, 단지명, 총 공급 세대수(계), 전용면적, 단지 소재지, 공급 예정 월, 그리고 비고란이 포함되어 있습니다. 본 계획은 2020년도 ~ 2025년도의 신규 공급 및 잔여공가 물량을 기준으로 하며, 공급량은 사업계획 변경이나 행정적 절차에 따라 증감될 수 있으며, 공급 시기도 일부 조정될 수 있습니다. 특히 일부 물량은 철거민 특별공급을 포함하고 있으나, 이 항목은 신청 현황에 따라 추후 변동될 수 있습니다. 이 데이터는 국민임대주택의 공급 전략, 지역별 수요 대응, 면적대별 분포 등을 파악하고, 정책 방향 설정이나 수요자 맞춤형 분석 등에 활용될 수 있습니다.
