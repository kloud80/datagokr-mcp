description_portal: '한국부동산원(구.한국감정원)에서 제공하는 상업용부동산 임대동향조사 중 통합상가의 지역별 임대가격지수(시계열) 데이터입니다.* 임대가격지수 : 임차인이 일정공간을 점유하기 위해 지불하는 총 비용의 두 시점 간의 변화 추정을 위해 기준시점(2024년 2/4분기) 대비 표본건물 기준층의 시장임대료를 이용하여 산정<상업용부동산 임대동향조사 개요>ㅇ 국가통계 승인번호 : 제408001호ㅇ 법적근거 : 부동산 가격공시에 관한 법률 제15조 및 동법 시행령 제25조ㅇ 조사목적 : 전국의 상업용부동산(오피스, 상가)의 자산가치 산정 및 임대정보 조사를 통해 상업용부동산 투자성과 측정 및 시장동향 파악하여 시장정보를 제공하고,표준지 공시지가 조사·평가 시 수익방식 평가 방법에 활용하며, 건전한 부동산 거래질서 확립에 기여할 수 있도록 부동산 정책 수립의 참고자료로 활용ㅇ 조사주기 : 분기ㅇ 조사지역 : 전국ㅇ 조사방법 : 표본조사, 현장조사'
