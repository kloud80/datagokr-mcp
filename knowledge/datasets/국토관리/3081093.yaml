summary_user: 서울 금천구에 등록된 공장을 한 건씩 담은 명부로, 회사명·지식산업센터명·입지·등록일·도로명 주소·종업원수·생산품·업종명 등을 개별 주소 단위로 담는다(CSV 파일, 약 200KB). 분석가나 기업지원 담당자가 'G밸리 지식산업센터에 어떤 업종의 제조업체가 얼마나 모여 있고 종업원 규모는 어떤가'를 파악하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 데이터와는 회사명·주소·지식산업센터명 같은 이름 매칭으로만 연결한다.
limits: 전역 조인 키가 없어 팩토리온 공장등록 정보나 기업·토지 데이터와 정확히 연결하려면 회사명·주소 매칭이 필요하다. 범위가 금천구 한 곳에 한정되므로 서울 전체나 다른 시군구와 비교하려면 별도 데이터가 필요하다. 업종은 코드가 아닌 업종명 문자열로 담겨 있다.
