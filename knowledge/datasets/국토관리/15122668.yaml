summary_user: 전북특별자치도 임실군 안의 건물을 한 건물씩 담은 공간정보 속성 파일로, 건물 구분·종류·용도, 지상·지하 층수, 건물명, 지번과 건물번호, 우편번호, 고시·작업일자 등을 시군구 범위에서 담는다(CSV 약 5.6MB). 지역 분석가나 시설 담당자가 '임실군 어느 지번에 어떤 용도의 몇 층 건물이 있는가'를 확인하거나 건물 분포를 지도화할 때 쓴다. 전역 조인 키가 없어서 지번 본번·부번이나 건물 본번·부번, 우편번호를 이름·코드로 맞춰 건축물대장이나 도로명주소 자료와 연결한다.
limits: 임실군 한 곳만 담고 있어 다른 시군이나 전국 단위 비교에는 따로 자료를 모아야 한다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 지번·건물번호 매핑이나 같은 기관 코드로만 연결된다.
