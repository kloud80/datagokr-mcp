summary_user: 부산광역시 중구 관내에 신고된 저수조 청소업 사업장을 한 곳씩 담은 건별 목록으로, 사업장명·업종명·도로명주소·전화번호·신고일을 담는다(파일 크기 799바이트의 소규모 CSV). 중구 주민이나 건물 관리자가 "우리 동네에서 물탱크(저수조) 청소를 맡길 수 있는 신고 업체는 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 전역 조인 키는 없으므로 다른 구·군의 같은 현황이나 사업자 정보와는 사업장명이나 주소를 기준으로 맞춰 이어 쓴다.
