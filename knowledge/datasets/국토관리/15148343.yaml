description_portal: 이 데이터는 서울주택도시개발공사(SH공사)가 공급하는 전세임대주택 4가지 유형에 해당하는 공급계획을 다룬 자료입니다. 전세임대형 주택은 기존주택, 신혼부부Ⅰ,Ⅱ 유형, 든든주택이 있으며 기존주택은 공사에서 전세로 확보한 주택을 임대해주는 방식으로 신속한 주거지원 기능한 장점이 있습니다. 신혼부부유형은 주거 안정이 시급한 젊은 층을 대상으로 한 주거복지 정책의 일환이며 전세금이 지원 한도액을 초과할 경우에는 초과분을 입주자가 부담하면 지원이 가능하나, 전세금 총액은 호당 대출한도의 250% 이내여야 하며, 세대원 수가 5인 이상인 경우에는 예외가 인정됩니다. 신혼부부Ⅰ 유형은 전년도 도시근로자 가구당 월평균 소득의 70% 이하인 가구를 대상으로 하며, 배우자가 소득이 있는 경우에는 합산 소득이 90% 이하인 경우까지 지원이 가능합니다. 신혼부부 Ⅱ 유형은 보다 넓은 소득계층을 대상으로 하며, 전년도 도시근로자 가구당 월평균 소득의 100% 이하인 자가 기본 대상입니다. 배우자가 소득이 있는 경우, 합산 소득이 120% 이하까지 지원 가능합니다. 전세임대형 든든주택은 소득 및 자산 기준이 없으며 서울특별시 거주자 중 신생아가구, 다자녀가구, 신혼부부, 예비신혼부부가 기본 대상입니다. 공급계획에는 2025년도에 공급 예정인 유형별 공급 호수가 담겨있습니다. 공급 일정은 예산이나 정책 변화에 따라 수시로 조정될 수 있으며 이 데이터는 청년 및 신혼가구를 위한 정책 수립, 주거 수요 예측, 지역별 지원 집중도 분석 등에 활용될 수 있습니다.
