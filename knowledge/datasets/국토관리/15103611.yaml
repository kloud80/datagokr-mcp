summary_user: 대전도시공사가 매입해 공급하는 소규모 다가구 매입임대주택을 동·호 단위로 담은 파일로, 각 호의 주소, 임대·전용·공용면적, 임대구분, 보증금과 월임대료를 기록한다. 대전에서 저렴한 공공임대를 찾는 저소득층이나 주거복지 담당자가 '어느 동네 매입임대주택이 면적 대비 보증금·월세가 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(주소 필드)를 지오코딩하거나 이름으로 매칭해 전월세 실거래 등과 비교하는 방식으로만 이어 쓴다.
description_portal: '대전도시공사는 저소득층의 주거 안정을 지원하기 위해 기존 소규모 다가구주택 등을 매입하여 임대주택으로 공급하고 있습니다. 경제적 여건으로 인해 주거 확보가 어려운 시민들이 도심 지역에서 안정적으로 거주할 수 있도록 지원하는 사업입니다.입주대상은 소득과 주거 여건에 따라 사회적 배려계층을 중심으로 선정되며, 세대별 소득수준과 자산요건을 기준으로 세부 자격이 구분됩니다. 장애인, 고령자, 한부모가정 등은 별도 기준을 적용받아 지원받을 수 있습니다.임대기간은 2년 단위로 입주 자격을 검증하며, 요건 충족 시 최대 20년까지 거주가 가능합니다. 이를 통해 주거 취약계층의 장기적이고 안정적인 생활 기반을 마련하고자 합니다.∎주요 입주자격 기준1.생계·의료급여 수급자 : 해당 기준 충족 시 입주 가능2.한부모가정 : 여성가족부 기준에 따른 지원 대상3.차상위계층 : 최저 주거기준 미달 또는 소득 대비 임차료 30% 이상4.고령자 : 수급권자 또는 차상위계층에 해당하는 65세 이상 고령자5.장애인 : 장애인등록증 보유, 평균소득 100% 이하, 자산요건 충족6.기타 : 평균소득 50~70% 이하, 자산요건 충족, 시장·지자체장 선정 시※ 자세한 사항은 홈페이지(https://www.dcco.kr/web/contents/view.do?mId=240)를 참고하시기 바랍니다.'
