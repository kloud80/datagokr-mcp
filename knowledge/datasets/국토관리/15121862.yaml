description_portal: 경상남도 남해군 도시계획정보시스템(UPIS)에서 추출된 정형 데이터로 남해군의 도시계획시설별 현황 파일입니다. 도시계획시설현황 데이터는 도시계획에 따라 지정·관리되는 각종 기반시설의 현황을 정리한 자료입니다. 본 데이터는 시도명, 시군구명 등 행정구역 정보를 비롯해 시설구분, 시설명, 시설종류 대·중분류 등 시설의 유형과 특성을 포함하고 있습니다. 또한 위치 정보와 함께 결정 연장(미터), 결정 면적(제곱미터) 등 물리적 규모를 확인할 수 있으며, 폐지 여부 및 기타 참고사항을 나타내는 비고 항목도 제공합니다. 해당 데이터는 도시계획 수립, 시설 관리 및 정책 활용에 필요한 기초 자료로서 행정업무의 효율성 제고와 공공서비스 품질 향상에 활용될 수 있습니다.
