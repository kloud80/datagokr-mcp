summary_user: 서울특별시 건축 인허가 대상 부지별로 용도지역·용도지구·용도구역 지정 내역을 담은 필지 단위 원천 데이터로, 대지위치·시군구·법정동·지번(본번·부번)과 지역지구 구분, 지구명, 대표 여부를 함께 기록한다. 부동산 투자자나 개발사업 검토자가 "이 인허가 부지는 어떤 용도지역·지구에 걸려 있어 어떤 규제를 받는가"를 확인할 때 쓴다. 전역 조인 키는 없어서 같은 서울시 건축인허가 계열 데이터와는 허가대장 일련번호(PRMSN_LDGR_SN)로, 다른 데이터와는 시군구·법정동 이름과 본번·부번 같은 지번 조합으로 맞춰 이어 쓴다.
