summary_user: 충청남도 계룡시 관내에서 건축허가를 받은 건축물을 허가 건별로 담으며, 건축 구분·허가번호·대지 위치와 지목·대지면적·건축면적·연면적·지상/지하 최대 층수·주용도와 허가일·착공처리일·사용승인일을 함께 제공한다. 계룡시에서 어떤 용도의 건축물이 언제 허가·착공·사용승인됐는지 살펴 지역 개발 흐름을 가늠하려는 분석가나 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지 위치(PLOT_LC) 같은 주소·이름 매핑이나 같은 기관(계룡시) 기준으로만 이어 쓴다.
description_portal: 충청남도 계룡시의 '건축허가현황 API' 데이터는 관내에서 건축 허가를 받은 모든 건축물에 대한 상세한 건축 행정 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 건축허가 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 건축물의 유형을 나타내는 건축 구분, 고유 식별자인 허가 번호, 대상지의 대지 위치 및 지목, 그리고 대지 면적, 건축 면적, 연면적 등 규모 정보가 포함됩니다. 또한, 허가 일, 착공 처리 일, 사용 승인 일 등 주요 진행 단계별 날짜와 최대 지상/지하 층 수, 건축물의 주요 용도까지 제공됩니다.
