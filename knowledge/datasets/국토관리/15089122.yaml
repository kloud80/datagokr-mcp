summary_user: 제주특별자치도개발공사가 공급하는 행복주택의 입주자격을 공급 계층 구분별로 정리한 기준표 파일(csv, 약 9.5KB)로, 계층마다 입주자격·소득기준·자산기준·자동차기준을 한 행에 담는다. 대학생·사회초년생·신혼부부 등 청약 준비자가 '내 소득·자산·차량가액으로 제주 행복주택에 신청할 수 있는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 청약 공고·경쟁률 데이터와는 계층 구분 이름을 맞추거나 같은 기관의 데이터끼리만 이어 쓴다.
description_portal: 행복주택은 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 대학생, 사회초년생, 신혼부부 등 젊은 층의 주거안정을 목적으로 공급하는 공공임대주택입니다.위 목적에 따라 행복주택에 입주할 수 있는 입주자 자격이 있으며 일반적으로 아래 조건을 충족하여야 합니다.1. 주택이 공급하는 계층에 해당할 것2. 해당 세대원이 주택을 소유하고 있지 않을 것3. 해당 세대원의 월평균소득 합계가 전년도 도시근로자 가구당 월평균 소득의 일정 비율 이하일 것4. 해당 세대원의 총자산 합계가 일정 기준 이하일 것5. 해당 세대원의 자동차 중 가장 비싼 자동차가액이 일정 기준 이하일 것.위 다섯가지 자격에 부합하는지 확인 절차를 거치고 있습니다.
