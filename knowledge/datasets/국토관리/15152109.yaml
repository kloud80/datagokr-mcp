description_portal: 본 자료는 의성군 내 상수도 급수 및 유지관리 업무를 대행하는 업체별로 회사명, 회사주소, 지정기간을 항목별로 정리한 목록입니다. 각 업체는 군에서 지정한 대행자로서 상수도 급수공사·누수복구 등의 업무를 일정한 지정기간 동안 수행합니다.  동부와 서부 급수구역권으로 나뉘어져 각 업체는 할당된 급수구역권 내에서 우선적으로 업무를 시행합니다.추가적인 설명으로 대행업체는 3년마다 지정되며, 선정 전 의성군 홈페이지에 공고문이 기재됩니다. 관련법으로는 의성군 상수도급수공사대행규칙이 있습니다.
