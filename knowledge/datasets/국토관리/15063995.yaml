description_portal: '본 통계는 통계 기준년도, 행정구역(시‧군‧구), 소유권 변경 원인, 대장 구분, 정리 지번 수를 집계한 자료입니다. 통계 변동은 주로 상속·증여 구조 변화, 공익사업 보상·수용 진행, 지적재조사에 따른 경계 정비 및 대장 정리, 정비사업(재건축·재개발) 구역의 소유권 분쟁·집중 처리 등의 요인을 반영합니다.아울러 최신 사회적 이슈를 함께 고려해 해석합니다: 토지거래허가구역 확대/재지정, 3기 신도시 보상, 반도체 국가산단 보상 본격화, 농지법 개정에 따른 농지취득 심사 강화, 유산취득세 입법 추진, 경매·공매 물량 증가, 공시가격 변동, 빈집 정비 강화, 가덕도 신공항 등 대형 공익사업 보상 착수 등.'
