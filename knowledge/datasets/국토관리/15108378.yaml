summary_user: 마이홈포털의 공공임대주택(국민임대·영구임대·행복주택 등) 예비입주자 대기현황을 단지별로 담는 API로, 공급기관·시도·시군구·도로명주소·단지명과 주택유형·공급유형·형별, 대기자 수(waitCo) 등을 제공하며 범위는 전국이다. 공공임대 입주를 기다리는 국민이 '우리 동네 국민임대 단지의 이 평형에 예비입주자가 몇 명 대기 중인가'를 확인하거나, 분석가가 지역·유형별 공공임대 대기 수요를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단지명·시도·시군구 이름이나 도로명주소 매칭으로만 연결하며, 단지 일련번호(hsmpSn)는 같은 마이홈 계열 단지 정보와 맞춰 보는 용도로 쓴다.
description_portal: 국토교통부에서 제공하는 마이홈포털 공공임대주택 예비입주자 대기현황 조회 서비스입니다. 오퍼레이션 파라미터를 기준으로 공공임대주택 예비입주자 대기현황 조회하는 서비스 (유의)조회하는 시점에 따라 ‘응답 메시지’가 달라질 수 있습니다. API는 활용신청을 통해 받은 인증키를 사용하여 접속할 수 있습니다. 데이터는 시도 등의 지역 정보를 포함하고 있으며, 공공임대주택 정보를 제공하고 있습니다. 공공임대주택으로는 국민임대, 영구임대, 행복주택 등의 유형을 구분하여 제공중입니다. 자세한 파라미터는 참고문서 파일을 참고해주십시오.
