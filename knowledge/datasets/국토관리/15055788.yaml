summary_user: 전북특별자치도의 2015~2017년 기업 유치 실적을 연도별로 신설·이전·증설 기업 수로 나눠 집계한 통계로, 실제 투자와 양해각서(MOU) 체결 단계를 따로 담는다(csv 125바이트 규모의 소형 집계표). 지역정책 분석가나 투자유치 담당자가 "전북에 새로 들어온 기업과 증설 기업이 연도별로 얼마나 되며, MOU가 실제 투자로 얼마나 이어졌나"를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 기관(전북특별자치도) 기준으로만 맞춰 이어 쓴다.
description_portal: 2015년부터 2017년까지 전북특별자치도의 연도별 기업 유치 실적을 투자 유형에 따라 상세히 분류한 통계 데이터입니다. 이 자료는 도내에 새롭게 설립된 기업뿐만 아니라 타 지역에서 이전해 온 기업, 그리고 기존 사업장을 증설한 기업의 수를 연도별로 집계하고 있습니다. 또한, 실제 투자와 양해각서(MOU) 체결 단계를 구분하여 제공함으로써, 확정된 투자 성과와 잠재적인 투자 유치 가능성을 함께 파악할 수 있도록 돕습니다. 이는 지역 경제의 활력과 성장 동력을 평가하고, 효과적인 투자 정책을 수립하기 위한 핵심적인 기초 자료로 활용될 수 있습니다.
