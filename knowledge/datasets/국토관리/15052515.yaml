summary_user: 새만금 유역 동진강 하류 동진대교 한 지점의 수위를 연·월·일·시 행마다 10분 간격 값과 그 시간의 최대·최소·평균으로 담은 관측소 단위 시계열 파일(csv 약 597KB)이다. 새만금으로 들어가는 동진강 하류 수위가 홍수기나 특정 강우 때 시간대별로 어떻게 올랐는지 확인하려는 방재·수자원 분석가가 쓴다. 관측소코드 같은 전역 조인 키가 없으므로 다른 새만금 수위 지점이나 WAMIS 수문 자료와는 날짜·시각(년·월·일·시)과 지점명으로 맞춰 이어 쓴다.
description_portal: '- 한국농어촌공사에서 관리하고 있는 새만금 유역 동진대교에 대한 수위 데이터 입니다.- 동진대교는 전북 김제시, 부안군 경계 동진강 하류에 설치된 다리로 새만금으로 흘러 들어가는 주요 하천 중 하나입니다.- 본 데이터는 동진대교 수위 계측 정보로 월별, 10분단위, 최대, 최소, 평균값을 제공하고 있으며- 계측자료가 없는 일자(시간)데이터는  계측장비의 정비, 점검, 통신이상 등의 현장 사정에 따라 누락 될 수 있습니다.- 수위계측 자료는 홍수 및 재해 대응에 활용 가능하며- 새만금 수자원 관리, 환경 모니터링, 정책 수립 등에 활용 가능합니다.'
