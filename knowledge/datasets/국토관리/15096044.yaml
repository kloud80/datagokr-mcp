summary_user: 계룡시 관내 도시공원을 공원(시설) 한 건씩 담은 현황 데이터로, 집계 연도·시설 종류와 세부 구분·공원 이름·위치, 최초 결정일과 최종 변경일·고시번호, 결정 면적을 담는다. 계룡시 주민이나 도시계획 분석가가 '이 공원은 언제 처음 결정·고시됐고 마지막으로 언제 변경됐으며 결정 면적은 얼마인가'를 확인하는 데 쓴다. 다른 데이터와 바로 맞물리는 전역 조인 키는 없어서, 공원 이름(FCLTY_NM)이나 위치 문자열, 고시번호를 기준으로 다른 시군의 도시공원 현황이나 도시계획시설 데이터와 맞춰 이어 쓴다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 데이터와 붙일 때는 이름·위치를 직접 대조해야 한다. 범위는 계룡시 한 곳뿐이므로 다른 시군과 비교하려면 각 기관의 데이터를 따로 모아야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
