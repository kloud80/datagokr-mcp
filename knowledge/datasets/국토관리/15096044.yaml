description_portal: 충청남도 계룡시의 '도시공원 현황 API' 데이터는 관내에 지정 및 관리되는 도시공원 시설물의 상세한 계획 및 현황 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 도시공원 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 집계 년도와 시도 명, 시설의 시설 종류 및 시설 상세 정보, 그리고 공원의 공식 시설 명이 포함됩니다. 특히, 공원 조성과 관련된 최초 결정 일과 최종 변경 일 등 시간 경과 정보와 결정 면적, 그리고 시설의 정확한 위치 정보까지 제공됩니다.
