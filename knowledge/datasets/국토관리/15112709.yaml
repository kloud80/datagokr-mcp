summary_user: 광주 동구 안의 재개발·가로주택정비사업을 구역 하나당 한 행으로 정리한 현황 파일로, 행정구역·사업 유형·구역명·위치·면적·세대수·추진 단계·데이터기준일자를 담는다(내려받은 CSV는 약 1.9KB의 소규모 목록). 동구 주민이나 부동산 투자자가 '우리 동네 정비구역이 추진위·조합설립·관리처분 중 어느 단계에 있고, 규모는 몇 세대인가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와 이으려면 구역명·위치(주소)·행정구역 이름을 맞춰 매핑해야 한다.
description_portal: '광주광역시 동구의 재개발 및 가로주택정비사업 데이터는 도시 주거환경 개선과 노후화 지역 정비를 위한 주요 사업들의 추진 현황을 체계적으로 관리하기 위해 구성된 핵심 행정 자료입니다. 이 데이터는 동구 내 정비사업의 공간적 분포, 사업 규모, 진행 단계 등을 한눈에 파악할 수 있도록 연번, 행정구역, 구분, 구역명, 위치, 면적, 세대수, 추진현황, 데이터기준일자로 구성되어 있습니다.각 항목의 의미는 다음과 같습니다.연번은 데이터 정렬과 관리를 위해 부여된 순차 번호로, 다양한 사업을 식별하고 관리하는 기본 키 역할을 합니다.행정구역은 해당 사업이 속한 법정동 또는 행정동을 의미하며, 지역별 정비사업 분포 분석 및 행정 책임 구역 파악에 활용됩니다.구분은 재개발·재건축·가로주택정비 등 사업의 유형을 명시하여 사업 성격을 구분하는 필수 항목입니다.구역명은 정비사업이 추진되는 지역의 명칭으로, 주민 안내 및 행정문서 작성 시 활용됩니다.위치는 구체적인 지리 정보(도로명주소 또는 지번)를 나타내어 사업 범위와 공간적 특성 파악에 도움을 줍니다.면적은 정비 구역의 총 규모를 의미하며, 사업비 산정·계획 수립·개발 밀도 분석 등에 중요한 기초 자료입니다.세대수는 정비사업 완료 시 예상되는 또는 현재 포함된 세대 수로, 주거 수급 분석 및 기반시설 계획과 밀접하게 연관됩니다.추진현황은 사업의 단계(예: 추진위원회 구성, 조합 설립, 관리처분인가, 공사 중 등)를 나타내며, 정책 모니터링과 사업 속도 평가에 핵심적인 정보입니다.데이터기준일자는 정보의 최신성을 나타내어 행정적 활용 시 신뢰도를 높이는 역할을 합니다.이 데이터는 동구의 주거환경 개선 정책 수립, 정비사업 우선순위 결정, 민원 대응, 도시계획 분석 등 여러 행정 분야에서 활용될 수 있는 중요한 기반 데이터로서 큰 가치를 지닙니다.'
