summary_user: 경상남도 하동군에 있는 공동주택을 단지 한 건씩 담은 파일로, 단지명·법정동과 본번·부번·도로명주소, 대지면적·연면적, 동수·세대수·최상층, 사용승인일과 경과연수, 의무·비의무 관리 구분, 임대 여부, 위탁관리·승강기·난방 방식을 담는다. 하동군에서 지은 지 오래된 공동주택 단지가 어디에 몇 세대 규모로 있는지 파악하려는 주민·관리업체·주택정책 분석가가 쓴다. 전역 조인 키가 없어 법정동과 본번·부번 또는 도로명주소로 건축물대장·공동주택 관리 정보 등과 맞춰 붙이고, 시군 법정동코드로 같은 지역의 다른 통계와 연결한다.
