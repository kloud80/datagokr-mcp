summary_user: 경상북도 영덕군의 개별주택 공시가격을 필지·건물 단위로 담은 건별 조회 API로, 법정동·지번·건축물대장 고유번호, 기준연도·월, 토지대장면적·산정대지면적·연면적, 주택가격, 표준지 여부를 담는다. 영덕군 단독주택 소유자나 분석가가 "이 주택의 올해 공시가격이 얼마이고 보유세·건강보험료·복지 기준 산정에 어떤 값이 쓰이나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 법정동코드(landCode)·지번·건축물대장고유번호를 이름·코드로 맞춰 건축물대장이나 실거래가 자료와 연결해야 한다.
description_portal: 경상북도 영덕군 개별주택가격조회 데이터는 특정 주택의 위치, 면적, 건물 정보, 주택가격 등을 포함하여 개별 단위의 부동산 가격 정보를 확인할 수 있도록 구성된 자료입니다.주요 항목에는 주택을 식별하는 고유번호, 법정동코드 및 명칭, 특수지구 분류 코드 및 명칭, 지번 주소, 건축물대장 고유번호가 있으며, 기준연도와 기준월, 동코드를 통해 시점 정보를 확인할 수 있습니다.또한 토지대장면적, 산정대지면적, 건물 전체 연면적, 산정 연면적 등의 면적 정보와 함께, 주택가격, 표준지 여부, 데이터 기준일자 등이 포함되어 있어 가격 산정의 기초 자료로 활용됩니다.이 데이터는 부동산 통계 분석, 과세 자료 확인, 주택 시장 동향 파악 등 다양한 행정·분석적 목적에 활용될 수 있습니다.
