summary_user: 서울특별시 주택 건축 인허가 과정에서 세대(호)별로 전유면적과 공용면적을 구분해 기록한 건별 원천 자료로, 대지위치·시군구·법정동·지번, 전유/공용 구분, 주/부속 구분, 층 구분과 층번호, 구조·용도, 면적(AREA)을 담는다. 분석가나 사업자가 '인허가된 특정 주택 단지의 호별 전용면적과 공용면적 구성은 어떻게 되는가'처럼 세대별 면적 구성이나 공급 주택의 면적 분포를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 시군구·법정동 이름과 본번·부번 지번을 맞춰 매핑하거나 같은 기관(서울시) 데이터끼리만 연결한다.
description_portal: 이 데이터는 ‘주택 인허가 전유·공용 면적표’로, 주택 건축 인허가 과정에서 각 세대별 전유면적과 공용면적을 상세히 기록한 자료다. 항목에는 주택의 행정구역, 지번, 도로명 주소, 지상·지하 구분, 건물 관리번호, 동·호수, 층수 정보 등이 포함된다. 전유면적은 해당 세대가 단독으로 사용하는 공간의 면적을 나타내며, 공용면적은 건물의 복도, 계단, 엘리베이터홀 등 입주자들이 함께 사용하는 부분의 면적을 의미한다. 이 데이터는 주택 거래, 세금 부과, 관리비 산정, 건축물 관리, 도시계획 등에서 중요한 근거자료로 활용되며, 특히 세대별 면적 구성과 권리 비율 산정에 핵심적인 역할을 한다.
