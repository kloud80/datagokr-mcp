summary_user: 경기도 시군구 간 이동량을 출발 시군구와 도착 시군구 쌍별로 성별·연령대·이동 목적에 따라 나눈 집계 OD 자료로, 기준연월과 요일 구분, 출발·도착지 중심 좌표, 인구수(popltn_cnt)를 담는다. 교통 분석가나 지자체 담당자가 '특정 시군구로 출근·통학하러 들어오는 20~30대는 어느 시군구에서 얼마나 오는가'처럼 목적별·인구집단별 통행 수요를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 출발·도착 시군구 코드나 시도·시군구 이름으로 매핑해야 다른 시군구 단위 통계와 이을 수 있다. 이동 목적·연령 코드의 뜻은 경기도 민간데이터 규격서 데이터셋에서 확인한다.
description_portal: 이 데이터는 경기도 시군구 간 이동을 성별·연령별·이동 목적별로 구분한 OD(Origin–Destination) 자료입니다. 출발지와 도착지 간의 이동량을 인구 특성과 이동 목적에 따라 분류하여 제공하고 있어, 지역 간 교통수요와 생활 이동 패턴을 정밀하게 파악할 수 있습니다.대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.다운로드 받으신 파일의 컬럼명에 대한 정보와 컬럼 중 코드에 해당하는 설명은 경기도 민간데이터 규격서 데이터셋에서 확인하실 수 있습니다.
