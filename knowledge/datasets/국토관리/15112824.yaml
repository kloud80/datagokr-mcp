summary_user: 인천광역시의 군·구별 용도지역 면적(제곱킬로미터)을 도시지역(주거·상업·공업·녹지의 세부 종별과 미지정)과 비도시지역(계획·생산·보전관리, 농림, 자연환경보전)으로 나눠 담은 집계 파일입니다. 도시계획 분석가나 부동산 사업자가 '인천의 어느 군·구에 일반주거지역이나 준공업지역이 얼마나 지정돼 있는가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 군·구 이름(군구별)을 행정구역 코드표에 매핑해야 다른 인천시 통계와 이을 수 있다.
description_portal: '인천광역시 용도지역 면적에 대한 정보입니다.* 세부 현황: 도시지역(주거,상업,공업,녹지), 비도시지역(관리지역,농림지역, 자연환경보전지역)* 데이터 제공 요청에 대한 2006년, 2009년 데이터 제공<활용 목적>이 자료는 도시 기본 계획, 토지 이용 계획, 용도 지역 변경 심의 등 인천시의 장기적인 도시 개발 및 관리 정책을 수립하는 데 가장 중요한 기초 자료입니다. 또한, 부동산 시장 분석, 개발 행위 허가 기준 설정, 환경 보전 계획 수립 등 광범위한 분야에서 활용됩니다.인천시의 토지 이용 현황 분석 및 도시 계획 수립을 위한 핵심 기반 정보입니다.'
