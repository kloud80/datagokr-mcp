description_portal: '항공사진 촬영 코스에 포함된 개별 낱장 사진에 대하여 육안검사 결과정보, 통과된 사진에 대하여 성과 코스번호, 사진번호 부여▷ 식별정보 : 코스일련번호,코스번호, 필름번호, 사진번호 ▷ 속성정보 : 렌즈번호, 촬영일자, 검사일자, 채택여부, 확인표시* 항공사진 : 항공기나 드론 등의 항공 플랫폼에서 지표면을 촬영한 사진으로, 지도 제작, 지형 분석, 도시계획, 환경 모니터링 등 다양한 분야에서 활용- 전국을 촬영하여, 국토 변화상황을 모니터링 하고 정사영상 제작 및 국가기본도 수정 등에 활용- 전국을 도시지역(해상도 12cm) 및 비도시지역(해상도 25cm)으로 구분하여 도시지역, 비도시지역 1년 주기 촬영- 각종 행정업무(세무, 보상, 민원, 판독, 국유재산관리)에 활용되고 있으며, 소송, 단속(불법건축물, 수사자료, 판독) 및 홍보자료, 지형확인, 도시계획 업무 등에도 활용'
