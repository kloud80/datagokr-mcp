summary_user: 항공사진 촬영 코스에 포함된 낱장 사진마다 육안검사 결과(채택여부·검사일자)와 코스번호·필름번호·사진번호, 렌즈번호, 촬영일자를 건별로 담은 전국 범위 검사표 파일이다(CSV 약 48MB). 공간정보 분석가나 항공사진 이용자가 특정 코스·사진번호의 사진이 검사를 통과해 성과로 채택됐는지, 언제 촬영·검사됐는지 확인하는 데 쓴다. 전역 조인 키는 없으며, 다른 항공사진 데이터와는 코스번호·사진번호 같은 식별 번호를 이름 그대로 맞춰 연결해야 한다.
limits: 좌표나 행정구역 코드가 없는 비공간 표라 사진이 찍힌 위치를 이 데이터만으로 알 수 없다. 표준 조인 키가 없어 다른 데이터와 묶을 때는 코스·사진번호 매핑에 의존한다.
