summary_user: 충청남도 공주시 안의 하천(소하천)을 한 줄에 한 하천씩 담은 목록 파일로, 하천 구분·지정고시번호·하천명·길이(km)·구간 시작·종료 위치·읍면동·관리기관을 담는다. 공주시 주민이나 개발 사업자가 '이 읍면동에 어떤 소하천이 지나고, 어디서 어디까지이며 누가 관리하나'를 확인하거나, 분석가가 하천 정비·재해 대응 계획의 기초 목록을 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 하천명이나 읍면동 이름으로 맞춰 붙여야 하고, 하천코드(WAMIS)나 하천구역 공간정보와 이으려면 이름 매핑이 필요하다.
limits: 하천코드 같은 공통 키가 없어 국가 하천 원장이나 공간정보와 자동으로 연결되지 않고, 이름 대조에 기대야 한다. 범위는 공주시 한 곳이며 읍면동 단위까지만 나뉜다. 하천구역 경계 같은 공간 정보는 이 파일에 없다.
