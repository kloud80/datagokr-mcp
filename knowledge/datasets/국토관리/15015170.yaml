summary_user: 광주광역시도시공사가 공급한 공동주택을 단지 한 곳당 한 행으로 정리한 목록으로, 단지명·주소·착공일·준공일·사용승인일·동수·세대수·관리소 연락처를 담는다(CSV 파일 약 1.6KB 규모). 공사 공급 단지가 어디에 몇 세대 규모로 언제 지어졌는지 확인하려는 시민이나, 지역 주거환경과 인구 수용력을 검토하는 분석가가 쓴다. 전역 조인 키가 없으므로 다른 공동주택·건축물 데이터와는 주소나 단지명을 맞춰 연결해야 한다.
description_portal: 광주광역시도시공사에서 공급한 공동주택의 세부 현황을 정리한 데이터입니다. 본 데이터는 구분, 단지명, 주소, 착공일, 준공일, 사용승인일, 동수, 세대수, 관리소 연락처, 데이터기준일자 항목으로 구성되어 있습니다. 단지명과 주소를 통해 주택의 위치를 확인할 수 있으며, 착공일, 준공일, 사용승인일 항목은 건설 및 입주 관련 주요 일정 파악에 활용됩니다. 동수와 세대수는 단지 규모를 나타내며, 관리소 연락처는 입주민 또는 민원인의 주택 관련 문의에 활용할 수 있습니다. 데이터기준일자는 정보의 최신성과 기준 시점을 확인하는 항목으로, 지속적 업데이트를 통해 공사의 주택공급 및 관리 현황을 시민에게 투명하게 제공하는 데 목적이 있습니다. 본 데이터는 지역 내 주거환경 분석, 인구 수용력 평가, 시설 배치 계획 등 도시계획 및 정책 수립을 위한 기초자료로 활용됩니다.
