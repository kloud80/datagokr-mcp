description_portal: '이 데이터는 제주특별자치도 관할 지역에서 2017년부터 2019년까지, 축종별 발생한 가축 분뇨의 처리량 현황을 정리한 공공데이터입니다. 축종(예: 소, 돼지, 가금류 등)별 분뇨 발생 및 처리 실적이 연단위로 집계되어 있어, 제주 지역의 축산업 규모 파악, 환경 영향 평가, 분뇨 관리 정책 수립, 오염물 배출량 산정 및 폐기물 관리 체계 설계 등에 활용할 수 있습니다. 이 자료를 통해 축산-환경 관리, 지속 가능한 축산업 계획, 지역 수질 및 토양 오염 관리, 동물복지 및 환경정책 수립 등을 위한 기초 통계로 사용 가능하며, 데이터는 CSV 형식으로 무료 제공됩니다.'
