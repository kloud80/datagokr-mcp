summary_user: 제주특별자치도의 가축 분뇨 처리량(톤)을 시군구·축종·연도별로 집계한 CSV 파일로, 포털 설명상 2017~2019년 연단위 실적을 담는다. 축산 환경 담당자나 분석가가 "제주시와 서귀포시에서 돼지 분뇨가 해마다 얼마나 처리됐나"처럼 축종별 분뇨 부담을 비교할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군구명·축종 이름을 맞춰 연결하며, 같은 지역의 가축 사육두수나 하수·분뇨처리시설 자료와 이름 기준으로 이어 본다.
