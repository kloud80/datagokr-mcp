summary_user: 서울특별시 하천 주변 공공 이용시설(체육시설·화장실·주차장 등)의 시설명, 조사년도, 경위도 좌표를 시설 한 곳당 한 행으로 담은 원천 파일이며, 검증 시 5,047행이 수신됐다. 시민이나 분석가가 '우리 동네 하천변에 화장실·주차장이 어디에 있나', '시설 접근성이 낮은 구간은 어디인가'를 확인할 때 쓴다. 경도·위도(EPSG4326) 좌표 키로 다른 공간 데이터와 겹쳐 보며, 같은 세부 부문의 하천 구역·제방 등 하천 시설·공간 데이터와 위치로 이어 쓴다.
description_portal: 서울특별시 하천이용시설 현황 데이터는 서울특별시 관내 하천 주변에 조성된 다양한 공공 이용시설의 위치 및 현황 정보를 제공하는 공공데이터입니다. 본 데이터는 하천을 이용하는 시민들의 편의와 여가 활동을 지원하기 위해 체육시설, 화장실, 주차장 등 주요 편의시설의 분포를 체계적으로 정리한 자료입니다. 데이터는 시설명, 조사년도, 경도, 위도 항목으로 구성되어 있어 각 시설의 위치를 정확하게 확인하고 공간적으로 분석할 수 있도록 되어 있습니다. 이를 통해 하천 이용 환경 개선, 시설 접근성 분석, 생활권 기반 공공서비스 계획 수립, 도시 공간 활용 연구 등에 활용할 수 있으며, 시민 여가 공간의 효율적 관리 및 정책 수립에도 기여하는 자료입니다.
