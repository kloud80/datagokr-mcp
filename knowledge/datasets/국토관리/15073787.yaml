summary_user: 대전하수처리시설의 방류수 수질을 월별로 측정한 값(BOD, TOC, 부유물질, 총질소, 총인, 대장균군수 등)을 담은 대전광역시 단위 엑셀 파일(xlsx, 약 17KB)이다. 시민·환경 분석가가 '대전하수처리시설 방류수의 총인·총질소가 달마다 어떻게 변했고 방류수 기준을 지켰나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 하수처리장 수질 자료나 하천 수질 측정 자료와는 시설명·측정월을 직접 맞춰 이어 써야 한다.
limits: 파일의 컬럼이 이름 없이(Unnamed) 읽혀 머리글 행을 따로 확인해 항목을 맞춰야 한다. 관측소코드 같은 표준 키가 없어 수문 관측 시계열과 자동으로 연결되지 않고, 대전하수처리시설 한 곳의 월별 값이라 다른 시설·지역 비교에는 쓰지 못한다.
