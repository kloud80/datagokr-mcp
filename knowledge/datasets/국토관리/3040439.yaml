summary_user: 경기도 양평군 내 아파트를 단지 한 건씩 담은 목록 파일로, 아파트명·도로명주소·동수·층수·세대수·의무관리 여부·관리형태·관리사무소 연락처와 기준일을 담는다. 주민이나 분석가가 양평군에서 어떤 단지가 의무관리대상인지, 위탁·자치 등 관리형태가 어떤지 확인하거나 관리사무소 연락처를 찾을 때 쓴다. 실측 컬럼에 단지코드 같은 전역 조인 키가 없어, K-apt 단지 정보나 실거래 자료와는 아파트명·도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 양평군 아파트에 대한 데이터로 아파트명, 의무관리 여부, 도로명주소, 동수, 층수, 세대수, 관리형태, 관리사무소 연락처 등 공동주택의 기본 정보를 제공합니다.아파트의 인허가 현황은 주택법 및 건축법에 의거하여 처리된 사항으로 사용검사(사용승인)이 완료된 사항이며, 의무관리 및 관리형태 등은 공동주택 관리법에 의거하여 관리하는 사항입니다.의무관리대상이란  공동주택을 전문적으로 관리하는 자를 두고 자치 의결기구를 의무적으로 구성하여야 하는 등 일정한 의무가 부과되는 공동주택으로서  - 300세대 이상의 공동주택  - 150세대 이상으로서 승강기가 설치된 공동주택  - 150세대 이상으로서 중앙집중식 난방방식(지역난방방식을 포함한다)의 공동주택  - 「건축법」 제11조에 따른 건축허가를 받아 주택 외의 시설과 주택을 동일 건축물로 건축한 건축물로서 주택이 150세대 이상인 건축물인 공동주택이 해당됩니다.
