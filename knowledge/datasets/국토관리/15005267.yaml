description_portal: (개념) 표준주택가격이라 함은 부동산 가격공시에 관한 법률 제16조제1항에서 규정한 절차에 따라 국토교통부장관이 조사산정하여 공시한 표준주택의 적정가격을 말함. 적정가격이라 함은 해당 주택에 대하여 통상적인 시장에서 정상적인 거래가 이루어지은 경우 성립될 가능성이 가장 높다고 인정되는 가격을 말함.(근거) 부동산가격공시에 관한 법률 제16조에 의해 국토교통부장관은 용도지역, 건물구조 등이 일반적으로 유사하다고 인정되는 일단의 단독주택 중에서 선정한 표준주택에 대하여 매년 공시기준일(1월1일) 현재의 적정가격을 조사산정하고 중앙부동산가격공시위원회의 심의를 거쳐 이를 공시함(효력) 국가, 지방자지단체 등의 기관이 과세 등의 업무와 관련하여 개별주택의 가격을 산정하는 경우에 그 기준으로 활용됨(주택가격 공시제도) 정부는 종전의 주택 보유세 과세방식에 따른 세부담의 불형평 문제를 시정하과 시장가치에 기초하여 통합평가, 통합과세하는 주택(단독, 공동)가격공시제도를 "05년부터 도입하였으며, 공시된 주택가격은 주택시장의 가격정보를 제공하고, 국가, 지방자치단체 등의 기관이 과세 등의 업무와 관련하여 주택의 가격을 산정하는 경우에 그 기준으로 활용될 수 있도록 함.
