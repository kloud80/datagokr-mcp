summary_user: 연속지적도를 바탕으로 건물 공간정보(도형)와 세움터 건축물대장 속성을 건물 단위로 묶은 전국 범위의 건별 공간 데이터로, 브이월드에서 시도별 SHP 파일로 내려받는다. 분석가나 지자체 담당자가 '우리 시군구 안 건물들은 어디에 있고, 대장상 용도·규모는 어떤가'를 지도 위에서 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했고 컬럼명도 A0~A30처럼 의미가 드러나지 않아, 다른 건축물대장·지적 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 포털 활용신청이나 API 인증키로 받는 데이터가 아니다. 브이월드에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일을 직접 받아야 한다. 컬럼 의미가 명세에 비어 있고 공통 조인 키가 확인되지 않아, 다른 데이터와 붙이려면 별도 매핑이 필요하다.
