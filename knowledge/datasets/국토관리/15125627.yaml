summary_user: 제주특별자치도의 건축허가 현황을 연도별(대상연도)·구분별로 주거용·상업용·공업용·문교/사회용·기타 용도별로 집계한 소규모 CSV 파일(약 1.2KB)이다. 제주에 어떤 용도의 건축허가가 해마다 늘거나 줄었는지, 예컨대 주거용 허가가 최근 몇 년간 어떻게 변했는지를 보고 지역 개발 흐름의 선행 지표로 살피는 분석가·사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 지역 이름(제주) 기준으로만 맞춰 이어 쓴다.
description_portal: '제주특별자치도에서 제공하는 건축허가현황 관련 데이터를 제공합니다.항목: 분류별 (주거용, 상업용, 공공용 등), 연도별 현황*「건축법」 제11조(건축허가) 건축물을 건축하거나 대수선하려는 자는 특별자치도지사의 허가를 받아야 한다. - 건축: 건축물을 신축ㆍ증축ㆍ개축ㆍ재축(再築)하거나 건축물을 이전하는 것- 대수선: 건축물의 기둥, 보, 내력벽, 주계단 등의 구조나 외부 형태를 수선ㆍ변경하거나 증설하는 것으로서 대통령령으로 정하는 것- 리모델링: 건축물의 노후화를 억제하거나 기능 향상 등을 위하여 대수선하거나 건축물의 일부를 증축 또는 개축하는 행위자세한 사항은 제주도청 분야별 건축/토지 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/city/house/statistics.htm'
