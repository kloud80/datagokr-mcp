description_portal: 대구광역시 상수도사업본부에서 낙동강홍수통제소와 연계하여 보유중인 댐(4개소, 안동댐, 임하댐, 군위댐, 운문댐)에 대한 2020년~2024년 12월 월별 수위, 유입량, 총방류량 정보입니다. 매월 1일~말일까지의 수위, 유입량, 총방류량의 평균값을 월별로 제공합니다. 대구광역시의 주요 상수원인 안동댐, 임하댐, 운문댐, 군위댐은 낙동강 수계에 위치하여 대구시민의 생활용수와 산업용수를 안정적으로 공급하는 핵심 시설입니다. 이들 댐의 월별 수문 현황은 한국수자원공사(K-water)의 My Water 물정보포털에서 실시간으로 확인할 수 있습니다. 이러한 데이터는 My Water 물정보포털의 댐/보 수문자료에서 조회할 수 있습니다. 포털에서는 일별, 시간별, 10분별 데이터 조회가 가능하며, 그래프 형태로 시각화된 정보도 제공합니다.
