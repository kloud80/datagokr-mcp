summary_user: 지자체에 등록된 민간임대주택을 주택 한 채 단위로 담은 건별 원천 파일로, 전국 954,647행에 시도·시군구, 유형·종류, 전용면적, 임대의무기간과 개시일, 관할 지자체를 싣는다. 세입자나 분석가가 살려는 집 또는 특정 지역의 주택이 등록임대인지, 임대의무기간이 얼마나 남았는지 확인하는 질문에 쓴다. 도로명주소(address)를 키로 전월세 실거래 같은 주소 기반 자료와 이어 쓰며, 전월세 실거래와 병합하는 관계로 활용된다.
description_portal: 부동산 시장 투명성 제고 및 임대주택 관련 정보 서비스 제공 확대를 위하여,  자료를 제공하오니 관련 업무에 참고하시기 바랍니다.<유의사항>1. 제공자료는 2026년 6월말 기준 「민간임대주택에 관한 특별법」에 따라 지자체에 등록되어 있는 민간임대주택 정보이며, 현 시점의 정보와 차이가 있을 수 있습니다.2. 건축물대장 정보 미연결(준공 전) 등 일부 기재사항이 미비한 주택은 본 제공자료에 포함되지 않습니다.3. 상기 안내와 관련된 자세한 내용은 해당 임대사업자의 주소지를 관할하는 지자체(시군구)로 문의하여 주시기 바랍니다(주택소재지와 다를 수 있음).4. 제공 자료는 참고용이므로 임대차계약 시에는 제반사항을 반드시 확인하신 후 진행하시기 바랍니다.
