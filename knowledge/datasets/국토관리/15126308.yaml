description_portal: '- 도내 시군별 근린, 어린이, 체육, 소공원 등 도시공원 현황에 대한 정보를 제공합니다. 시설명, 위치, 최종변경일, 전체결정면적 등의 정보를 조회하실 수 있습니다.- 도시공원은 주민의 여가·휴식, 정서적 안정, 도시환경 개선을 위한 공공공간으로, 「도시공원 및 녹지 등에 관한 법률」에 따라 도시·군관리계획 시설로 지정된 녹지공간입니다.- 도시공원 기능과 중요성- 도시민 건강·휴식 증진: 녹지 공간이 도시 환경을 개선하며 정서적·신체적 안정을 돕습니다.- 생활권 접근성 강화: 최근 생활 반경 10분 내 공원 이용이 가능한 사업이 활발 - 불균형 해소 및 재생 모델: 공원기지 재생, 유휴지 활용, 무장애·세대별 맞춤형 공원 조성 확대'
