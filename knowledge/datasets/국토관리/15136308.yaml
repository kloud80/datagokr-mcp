description_portal: (데이터 수집목적 및 과정) 경남빅데이터허브플랫폼 지가변동률 데이터는 경남빅데이터허브플랫폼 내에서 관리하고 있는 지가변동률 데이터로, 출처는 통계청입니다. 경상남도 내 행정동 코드에 따른 지가변동률을 나타내고 있으며 지역별 지가변동에 대한 분석을 하실 때 활용할 수 있습니다.(데이터 구성 및 세부항목) 경남빅데이터허브플랫폼 지가변동률은 행정동코드별 지가변동률로 구성되어 있으며 총 246건입니다.(데이터 현행화 시기) 지가변동률 데이터는 1회성 데이터로 현행화 되지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼을 참고하여 주시기 바랍니다.
