summary_user: 경기도 고양시 일반건축물을 건물(물건지) 단위로 한 건씩 담아 건축물별 시가표준액과 연면적, 기준일자를 제공하는 시군구 범위의 원천 파일이다. 고양시에 건물을 가진 사람이나 분석가가 특정 건물의 시가표준액이 얼마인지, 면적 대비 과세 기준가가 어느 수준인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 물건지(주소) 문자열이나 자치단체코드·시군구명 같은 이름·기관 코드 매핑으로만 이어 쓴다.
