summary_user: 광주광역시 5개 자치구(동구·서구·남구·북구·광산구)별로 토지대장과 임야대장에 등록된 면적 합계와 지번(필지) 수를 폐쇄 대장까지 나눠 담은 집계표이며, 필지별 건별 원장이 아니라 470바이트 크기의 작은 CSV 파일이다. 지역 분석가나 시민이 '우리 자치구에 등록된 토지·임야 필지는 몇 개이고 총 면적은 얼마인가'를 확인하거나 자치구 간 토지 규모를 비교할 때 쓴다. 전역 조인 키(행정코드·PNU 등)가 없어 다른 데이터와는 토지소재지(자치구 이름)를 이름으로 맞춰 연결해야 한다.
description_portal: 광주광역시 5개 자치구(동구, 서구, 남구, 북구, 광산구)에 등록된 ‘지적공부’ 현황에 관한 자료입니다. ‘지적공부’란 토지와 임야에 대한 공식 기록으로, 토지대장과 임야대장으로 구분됩니다. 각 자치구별 토지 면적의 총 합계와 등록된 필지 수, 그리고 필지별 면적 합계를 보여줍니다. 이 정보는 시도부동산종합공부시스템의 ‘지적현황’ 메뉴 내 ‘업무기초자료추출’ 기능을 활용해 추출된 것입니다. 다만, 자치구에서 지적공부에 변경사항이 발생할 경우, 이를 처리하고 시스템에 반영하는 데 시간이 걸리기 때문에 실시간으로 변경 내용이 반영되지 않을 수 있다는 점을 참고해 주시기 바랍니다. 이 자료는 토지 관리와 관련된 공공 업무에 활용되며, 시민들이 토지 현황을 이해하고 확인하는 데 도움이 됩니다. 토지의 위치나 면적을 확인하거나, 개발 계획 수립 시 참고하는 중요한 데이터입니다. 시민들도 이 자료를 통해 자신이 거주하는 지역의 토지 상황을 쉽게 파악할 수 있으며, 토지 거래나 활용 시 참고할 수 있습니다.
