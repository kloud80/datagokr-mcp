summary_user: 대구광역시 북구와 자매·우호 관계를 맺은 국내외 도시를 도시별로 한 행씩 담은 소규모 목록 파일(csv, 1187바이트)로, 교류기관명·도시명·결연일자·인구·면적·주요인사·교류실적과 담당부서 연락처를 담는다. 북구 주민이나 지역 연구자가 '북구는 어느 나라 어느 도시와 언제 결연했고 어떤 교류를 해 왔나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 지자체의 국제교류 현황 등과는 도시명 같은 이름 매칭으로만 이어 붙일 수 있다.
