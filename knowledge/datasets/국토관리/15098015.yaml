description_portal: 이 데이터는 2026년2월 19일 기준으로 서울특별시 성북구 관내 공구대여소의 운영 현황을 정리한 자료입니다. 각 대여소의 명칭, 도로명주소, 전화번호, 비치 공구 종류, 운영시간, 대여료, 대여기간, 위도·경도 좌표 및 행정동 정보가 포함되어 있습니다. 이를 통해 성북구 주민센터를 중심으로 운영되는 공구대여 서비스의 위치와 이용 조건을 한눈에 파악할 수 있으며, 지역 주민의 생활 편의 증진과 도시형 공유경제 활성화를 위한 기초 자료로 활용할 수 있습니다. 또한 대여 품목과 운영시간, 비용 구조 등을 비교하여 사용자 접근성을 분석하거나 공공서비스 개선 방향을 도출하는 데에도 유용합니다.
