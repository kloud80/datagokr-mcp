summary_user: 경기도 평택시 도시계획정보시스템(UPIS)에서 뽑은 개발행위허가 제한지역을 도형 단위로 담은 CSV 파일로, 도형 관리번호·도형 분류·라벨명·면적·길이를 담으며 파일 크기는 약 700바이트로 작다. 평택시에서 개발행위허가가 일정 기간 제한된 구역이 어디이고 면적이 얼마인지 확인하려는 토지 소유자·개발사업자·도시계획 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드나 라벨명 같은 이름·코드 매핑으로만 맞춰 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 개발행위허가제한지역현황으로 현황도형 관리번호, 시군구코드, 면적, 길이 등의 항목을 제공합니다.개발행위허가제한지역 현황은 국토의 계획 및 이용에 관한 법률에 따라 도시·군관리계획상 필요한 지역에 대해 일정 기간 개발행위 허가를 제한하는 구역을 말합니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
