summary_user: 용인시 지역화폐 와이페이카드를 받는 가맹점을 한 곳씩 담은 건별 목록으로, 가맹점명·업종 분야와 소분류·우편번호·주소를 제공하며 범위는 용인시 한 곳의 시군구 단위다. 시민이 집 근처에서 와이페이로 결제할 수 있는 음식점이나 학원을 찾거나, 분석가가 용인시 안에서 업종별·지역별 가맹점 분포를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소(addr)나 우편번호를 매칭하거나 가맹점명으로 이어 붙여야 한다.
description_portal: 본 데이터는 용인시 와이페이카드 가맹점 정보 조회 API를 통해 제공되는 지역 내 가맹점 현황을 확인하기 위한 자료이다. 결과코드, 결과메시지, 한 페이지 결과 수, 페이지 수, 데이터 총 개수는 API 호출의 정상 처리 여부와 응답 구조를 파악하는 데 활용된다. 번호별로 분야와 소분류 정보를 제공하여 가맹점의 업종 특성을 분류할 수 있으며, 가맹점명은 상호 식별을 위한 기본 정보로 사용된다. 또한 우편번호와 주소는 위치 기반 서비스 제공, 지역경제 분석, 이용자 안내 등 행정 업무에 활용될 수 있는 핵심 공간정보이다. 본 데이터는 지역 상권 구성 현황 파악, 와이페이 정책 운영의 효율성 제고, 시민의 이용 편의 향상에 기여하는 기반 자료로 기능한다.
