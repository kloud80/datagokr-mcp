summary_user: 마이홈포털에 올라온 기존 5년임대 주택을 단지·형(평형)별로 담은 전국 파일로, 시도·시군구·도로명주소·단지명과 세대수·주택유형·임대사업자·준공일자·난방방식·승강기·주차수, 전용·공용 공급면적, 임대보증금·월임대료·전환보증금을 담는다. 5년 뒤 분양전환을 노리는 무주택자나 분석가가 "우리 시군구의 5년임대 단지는 어디이고 면적별 보증금·월세는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 도로명주소·단지명이나 시도·시군구 이름을 맞춰 전월세 실거래·공동주택 단지 자료와 이어 쓴다.
description_portal: 한국토지주택공사에서 위탁 관리 중인 마이홈포털의 기존 5년임대 주택 정보로, 광역시도 및 시군구, 단지명, 세대수, 주택유형, 임대사업자, 준공일자, 난방방식, 승강기 설치여부, 주차대수, 공급면적(전용, 공용), 임대보증금, 월임대료, 전환보증금 등의 정보를 제공합니다. 5년임대 주택은 최초 입주시점 이후 최대 5년까지 임대주택의 형태로 운영하고 5년이 지나면 그 시점의 거주자에게 분양전환 받을 수 있는 기회를 부여하는 주택 공급 유형을 말합니다. 위탁 관리 중인 주택은 공급주체가 한국토지주택공사가 아니지만 관리 업무만 위탁 받은 주택을 말하는 것으로서 데이터 내 주택의 공급 주체를 유의하여 확인하시기 바랍니다.
