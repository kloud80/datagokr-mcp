summary_user: 전국의 준공·개발 중인 산업단지(국가·일반·도시첨단·농공단지) 위치를 단지별 경계선으로 나타낸 도면 데이터로, 단지 고유코드·단지명·단지 유형을 함께 담고 시도별 파일로 제공된다. 공장 부지를 찾는 사업자나 입지 분석가가 '이 후보지가 어느 산업단지 경계 안에 있고 그 단지가 국가산단인지 농공단지인지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 단지명이나 산업입지정보시스템 단지코드(Dan_ID)를 매핑해 전국산업단지및공장정보표준데이터·산업단지 일반현황과 이어 쓴다.
description_portal: '이 데이터는 전국에 있는 산업단지 중 이미 준공되었거나 현재 개발 중인 산업단지의 위치를 지도 위에 경계선으로 표시한 도면입니다. 도면에는 다음과 같은 산업단지가 포함되어 있습니다. 국가산업단지, 일반산업단지, 도시첨단산업단지, 농공단지도면파일에는 몇 가지 주요 정보가 함께 담겨 있습니다.필드명 Dan_ID : 각 산업단지에 고유하게 부여된 코드입니다. 이 코드는 산업입지정보시스템에서만 사용되는 식별번호이며, 관련 정보가 필요하신 경우 산업입지정보시스템 에 문의하시면 확인하실 수 있습니다.필드명 Dan_name : 해당 산업단지의 이름입니다.필드명 Dan_Type : 산업단지의 종류를 숫자로 구분한 값으로 국가산업단지는 1, 일반산업단지는 2, 도시첨단산업단지는 3, 농공단지는 4로 구부하였습니다.'
