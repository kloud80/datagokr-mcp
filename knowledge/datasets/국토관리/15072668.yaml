summary_user: 대전광역시에서 추진하는 도시재생 뉴딜사업 15개소를 사업 단위로 한 행씩 정리한 현황 파일로, 사업명·위치·사업면적(제곱미터)·사업기간·사업비(억원)를 담는다. 시민이나 분석가가 "우리 구에서 진행되는 도시재생 뉴딜사업은 어디이고 사업비와 기간은 얼마인가"를 확인하거나 자치구별 투자 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 도시재생·행정구역 데이터와는 사업명이나 위치(주소) 문자열을 맞춰 연결해야 한다.
limits: 표준 코드나 공통 조인 키가 없어 다른 데이터와 자동으로 결합할 수 없고, 사업명·위치 이름으로 수작업 매핑해야 한다. 좌표가 없는 비공간 자료여서 지도 위 경계나 면적 분석에는 별도 위치 정보가 필요하다.
