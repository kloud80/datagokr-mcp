summary_user: 전북개발공사가 시행하는 사업의 용지보상 정보를 필지·건물 단위 건별로 담으며, 보상 산정 일정, 감정평가 의뢰·납품일, 평가단가·평가금액, 확정 여부 등을 포함하고 전체 26,521건, 기간은 2010-01-01~2010-10-25로 확인됐다. 토지 소유자나 분석가가 특정 사업 필지의 감정평가 금액과 보상 산정·확정 시점을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업구분코드(businesscode) 같은 같은 기관 코드나 사업·구역 이름 매핑으로만 잇는다.
description_portal: 전북개발공사의 용지보상 조회 서비스는 사업구분코드, 본번, 부번 등 필지 정보를 기준으로  토지분양 관련 상세 정보를 조회할 수 있는 OpenAPI 서비스입니다.본 서비스는 보상 산정 및 평가 결과, 보상 공고 내역, 주거이전비, 분묘이장비, 고시단가 등 보상 항목에 대한 상세 정보를 제공하며 보상 일정별 인허가 계획 및 실적, 보상 추진현황, 재결신청 내역 등 보상 절차 전반에 대한 데이터를 함께 제공합니다.이를 통해 보상 진행 상황을 파악할 수 있으며 보상 절차 관리 등의 분야에 활용할 수 있습니다.
