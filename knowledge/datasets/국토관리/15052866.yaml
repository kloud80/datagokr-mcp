description_portal: 인천광역시가 제공하는 인재개발원 자료실 도서목록 현황 공공데이터는 인재개발원 자료실이 보유하고 있는 도서들의 상세 목록을 정리한 자료입니다. 이 데이터는 직원 및 시민들의 학습 및 연구 활동을 지원하고, 보유 도서의 체계적인 관리, 도서 검색 시스템 구축, 도서 구매 및 폐기 계획 수립 등의 기초 자료로 활용됩니다. 이 자료는 인재개발원의 학습 자원 현황을 파악하고, 이용자들의 도서 검색 편의성을 높이는 데 필수적입니다. 해당 데이터는 공공데이터포털에서 CSV파일로 다운로드 할 수 있습니다.
