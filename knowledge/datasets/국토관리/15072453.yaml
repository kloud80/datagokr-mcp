summary_user: 한국토지주택공사가 2016~2020년에 입찰 방식으로 공급한 상가 공고를 상가 호실 단위로 담은 파일로, 지역본부·사업지구·블록·층·호, 전용·분양면적, 예정가격, 입찰·계약 일정, 계약금·중도금·잔금 비율 등 29개 항목으로 구성되며 범위는 전국이다. LH 단지 내 상가 입찰을 검토하는 사업자나 분석가가 "특정 사업지구 상가의 면적당 예정가격은 어느 수준이었나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지구명·소재지 같은 이름이나 주소 매핑으로만 이어 쓴다.
description_portal: 한국토지주택공사에서  2016년~2020년 간 입찰 방식으로 공급한 상가 공고 내역(지역, 사업지구, 위치 및 면적, 공급금액 등) 데이터를 제공합니다. 이 자료는 한국토지주택공사가 시행한 상가 입찰 및 분양 공고 내역을 담고 있으며, 공고명, 위치, 일정, 면적, 예정가격, 계약 조건 등 총 29개 항목으로 구성됩니다. 입찰 신청 및 계약 체결 일정과 함께 상가별 공급 조건이 명시되어 있어, 지역별 상가 분양 현황 분석 및 투자 판단에 유용한 기초 자료입니다. 참고로 "지역본부" 컬럼은 상가입찰을 담당한 한국토지주택공사의 지역본부를 의미합니다.
