description_portal: 인천광역시 중구 주민자치센터 현황입니다.  총 12개동 21개소 입니다.항목은  동명(신포동, 연안동, 신흥동, 도원동, 율목동, 동인천동 등), 위치, 개소일로 구성되어 있습니다.   주민이 지역문제 해결의 주체로 참여하는 주민자치회 추진으로 실질적 생활자치를 실현하고, 민간단체 지원을 통한 구정 파트너십의 강화와 주민 중심의 마을만들기 사업 지원을 통해 지역공동체 활성화를 도모하고자 한다. 주민자치회 전 동 전환을 통해 주민주도의 정책을 추진하고, 주민 수요에 부응하는 주민자치센터 운영으로 주민의 삶의 질 향상과 실질적 주민자치를 실현하고자 한다.
