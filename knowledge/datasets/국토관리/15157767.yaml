summary_user: 경상북도 영천시에 있는 공장을 한 건씩 담은 등록 현황으로, 회사명·단지명·지번 주소·대표업종·생산품·용지면적·건축면적을 공장 단위로 담는다. 영천시에 자동차 부품이나 금속 가공 공장이 어느 단지와 지역에 얼마나 모여 있는지 알고 싶은 기업유치 담당자, 입지 검토 사업자, 지역 산업 분석가가 쓴다. 실측 컬럼에는 사업자번호나 필지 고유번호 같은 전역 조인 키가 없으므로, 지번 주소(lotAddr)나 업종번호·업종명, 회사명으로 매칭해 팩토리온 공장등록이나 산업단지 현황과 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와 붙일 때 주소·회사명·업종 문자열 매칭에 의존하므로 매칭 오류를 따로 점검해야 한다. 범위는 영천시 한 곳의 필지·건물 단위이며, 대표자명과 전화번호는 일부 가림 처리돼 연락처나 개인 식별에는 쓸 수 없다. 개발계정 호출은 하루 10,000회로 제한된다.
