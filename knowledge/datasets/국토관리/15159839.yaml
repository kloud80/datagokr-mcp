summary_user: 경기주택도시공사가 보유한 건설형·매입형 임대주택과 공동주택 부속상가를 자산(사업지구·주소) 단위로 담고, 자산유형·주택유형·호수와 취득가액·장부가액·공시가액, 준공(매입)일·등기일을 함께 싣는 파일(CSV 약 14.6KB)이다. 공공주택 연구자나 재무 분석가가 'GH가 지역별로 보유한 임대주택 자산의 취득가 대비 장부가·공시가 차이는 어느 정도인가' 같은 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·사업지구명 같은 이름 매핑으로만 이어 쓰며, 공시가격·전월세 실거래 데이터와 주소 기준으로 대조하는 식이다.
description_portal: 경기주택도시공사에서 보유한 건설형 임대주택, 매입형 임대주택, 공동주택 부속상가 등의 자산 현황 데이터로써 자산유형, 사업지구명, 주택유형, 지역구분, 주소, 호수, 취득가액, 장부가액, 공시가액, 준공(매입)일, 등기일, 산출 기준 등의 정보를 포함하고 있습니다. 취득가액은 자산 매입 당시 실제 지출한 금액을 의미하며 장부가액은 회계기준에 따라 평가된 현재 자산가치를 의미합니다. 공시가격은 과세 기준으로 활용되는 공식 평가 금액입니다. 해당 데이터는 공공자산의 재무적 가치 분석, 자산 운영 효율성 검토, 공공주택 정책 연구, 회계 및 재무 분석 등에 활용 가능합니다.
