summary_user: 부산 해운대구가 관내 고정옥외광고물(벽면이용간판·돌출간판·지주이용간판·옥상간판 등)을 현장 전수조사해 광고물 한 건마다 업소명, 읍면동·번지·도로명 주소, 건물명, 광고물 종류를 기록한 건별 현황 파일(CSV)이며, 범위는 해운대구 한 시군구이고 읍면동 단위까지 구분한다. 구청 담당자나 분석가가 '특정 동이나 도로에 어떤 종류의 간판이 몇 개 설치돼 있는가'를 확인해 광고물 관리, 불법 광고물 정비, 안전 점검 대상을 추리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동명이나 도로명·번지 주소를 문자열로 맞추거나 업소명으로 매칭해서 이어 쓴다.
description_portal: '부산광역시 해운대구 옥외광고물 전수조사해운대구 내에 설치된 고정옥외광고물(벽면이용간판, 돌출간판, 지주이용간판, 옥상간판 등)의 현황을 체계적으로 파악하기 위해 2년에 한 번 예산 범위 내에서 전수조사를 실시합니다.활용 목적 : 광고물 관리, 불법 광고물 정비, 안전 점검 등 행정자료로 활용[조사 및 관리]- 조사된 결과는 신규 설치, 철거, 이전 등 변동사항에 따라 주기적으로 갱신- 모든 정보는 현장조사 과정을 거쳐 관련 법령 및 조례에 따라 정확히 관리'
