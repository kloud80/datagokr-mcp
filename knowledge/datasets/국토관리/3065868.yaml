summary_user: 경상남도 양산시에 소재한 등록 공장을 한 행에 한 곳씩 담은 시군구 단위 현황 파일로, 회사명·대표자명·도로명 공장주소·전화번호·생산품·대표업종번호와 업종명을 담는다. 양산시 안에서 특정 업종이나 생산품을 다루는 제조 공장이 어디에 얼마나 있는지 찾는 사업자나 지역 산업 분포를 보는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 대표업종번호(업종 코드)나 회사명·주소 같은 이름 매핑으로 이어 쓴다.
description_portal: 경상남도 양산시 기업체현황(공장)에 대한 자료로, 양산시에 소재한 공장(기업체) 정보를 제공합니다.회사명, 대표자명, 공장대표주소(도로명주소), 전화번호, 생산품, 대표업종번호, 업종명 등을 현황을 확인할 수 있습니다.데이터 출처는 경상남도 양산시 원스톱허가과입니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 1월 28일입니다. 다음 업데이트는 2027년1~2월 중 제공됩니다.본 자료는 업종별·지역별 공장 분포 파악, 산업 현황 분석 등의 기초자료로 활용할 수 있습니다.
