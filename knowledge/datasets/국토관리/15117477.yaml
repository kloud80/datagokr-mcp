description_portal: 대구광역시 상수도사업본부에서 7개 지역사업소별로 분류하여 검침 등을 관리하고 있는 동과 분구의 건수를 제공합니다. 중부와 남부는 중남부사업소에서 관할합니다. 참고로 대구광역시의 상수도 검침은 시민이 실제로 사용한 수돗물의 양을 정확하게 측정하여 상수도 요금을 공정하게 부과하기 위한 중요한 절차입니다. 이 검침은 각 가정이나 사업장에 설치된 수도계량기를 통해 이루어지며, 상수도사업본부는 검침을 통해 확인된 사용량을 바탕으로 수도요금을 산정하고, 이를 고지서나 전자고지 형태로 시민에게 통보합니다. 검침 결과는 각 가정의 수도요금뿐 아니라 하수도요금, 물이용부담금 등의 부과 기준이 되며, 이로 인해 시민이 부담하는 공공요금의 근거가 됩니다. 시민은 자신의 수도 사용량과 요금을 대구시 사이버민원센터를 통해 확인할 수 있으며, 검침 수치에 이상이 있다고 판단되는 경우에는 해당 지역의 수도사업소에 문의하실수 있습니다.
