summary_user: 경기도 이천시 일반건축물의 시가표준액을 과세연도별로 건물 동·호 단위로 담은 시군구 범위 파일 데이터로, 법정동·법정리·본번·부번 지번과 연면적·기준일자를 함께 싣는다. 이천시 건물 소유자나 분석가가 특정 건물의 재산세 과세기준 금액이 얼마인지, 지역별로 시가표준액이 어떻게 다른지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 자치단체코드나 법정동명·본번·부번 같은 이름·지번 매칭으로만 이어 쓴다.
description_portal: 경기도 이천시 내 일반건축물의 시가표준액 산정에 필요한 기초 정보를 제공하는 데이터입니다. 항목은 과세연도, 행정구역(법정동·법정리), 도로명주소, 건물의 동·호, 연면적, 시가표준액, 기준일자 등으로 구성되어 있으며, 개별 건축물의 위치와 구조, 면적, 과세기준금액을 확인할 수 있습니다. 본 데이터는 재산세, 종합부동산세 등 부동산 관련 세금의 과세기준 자료로 활용되며, 과세평가 적정성 검토, 건축물 통계 구축, 자산가치 분석, 공시가격 비교 등 행정 및 부동산 시장 분석에 널리 활용됩니다. 세부 주소와 구조 정보는 공간기반 정책 설계 및 지역별 재산 격차 분석 자료로도 활용됩니다.
