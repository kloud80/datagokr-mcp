description_portal: '○ 통계개요* 통계명 : 도시정비형재개발사업* 통계종류 : 서울시 시행 주택재개발사업의 시행현황을 제공하는 일반ㆍ보고통계* 근거법령 :「도시 및 주거환경정비법」에 의한 도시환경정비사업* 작성목적 : 서울시에서 시행하는 주택재개발사업 진행 현황를 파악하여, 토지의 효율적이용과 도시 및 주거환경 개선을 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 도심재창조과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 서울시 도시환경정비사업의 진행상황별(완료, 시행중, 미시행, 존치)지구수 및 면적 등○ 용어설명* 도시환경정비사업 : 상업지역ㆍ공업지역 등으로서 토지의 효율적 이용과 도심 또는부도심 등 도시기능의 회복이나 상권활성화 등이 필요한 지역에서 도시환경을 개선하기위하여 시행하는 사업- 완 료 : 당해연도의 준공인가된 구역- 시행중 : 당해연도에 사업시행인가 또는 관리처분 계획인가된 구역- 미시행 : 당해연도에 정비구역으로 지정된 구역- 존 치 : 일정규모 이상의 물리적 상태가 양호한 지구로 필요시 정비사업 및리모델링이 가능한 구역○ 기 타* 하단 수치는 연누계임'
