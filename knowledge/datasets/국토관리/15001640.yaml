summary_user: 광주광역시 5개 자치구에 설치된 지적삼각점·지적삼각보조점·지적도근점 등 지적기준점을 한 점씩 담은 파일로, 종류·기준점명·소재지 주소·좌표구분·설치일자·최종조사 내용과 일자를 기록한다. 측량업체나 토지 소유자가 '우리 땅 근처에 어떤 지적기준점이 있고 언제 마지막으로 조사됐나'를 확인하거나, 분석가가 자치구별 기준점 분포와 관리 이력을 살피는 데 쓴다. 전역 조인 키는 없어서 토지소재지 주소나 기준점명을 이름으로 맞춰 필지·지번 데이터 등과 연결해야 한다.
description_portal: 광주광역시에서 관리하는 ‘지적기준점’은 토지 측량을 정확하게 하기 위해 설치된 기준점들입니다. 측량이란 땅의 위치와 경계를 정밀하게 재는 작업인데, 이때 기준점이 매우 중요합니다. 지적기준점은 「공간정보의 구축 및 관리 등에 관한 법률」에 따라 정해진 공식 측량 기준점으로, 광주광역시 5개 자치구(동구, 서구, 남구, 북구, 광산구)에 걸쳐 관리되고 있습니다. 지적기준점은 크게 세 가지 종류가 있습니다. 첫째, ‘지적삼각점’은 국가기준점을 기준으로 하여 만든 주요 기준점으로, 수평 위치를 측정할 때 기본이 됩니다. 둘째, ‘지적삼각보조점’은 국가기준점과 지적삼각점을 바탕으로 만든 보조 기준점으로, 측량의 정확도를 높이는 역할을 합니다. 셋째, ‘지적도근점’은 앞서 설명한 기준점들과 다른 도근점을 참고하여, 각 필지의 정확한 위치를 측정할 때 사용하는 기준점입니다. 이러한 지적기준점들은 토지의 위치와 경계를 명확히 해 부동산 거래, 개발, 토지 관리 등 여러 분야에서 신뢰할 수 있는 기준 역할을 합니다. 시민들은 이 기준점 덕분에 자신의 땅 위치를 정확히 알 수 있고, 불필요한 경계 분쟁을 줄이는 데 도움을 받을 수 있습니다. 광주시는 이 기준점들을 체계적으로 관리하며, 공간 정보의 정확성과 신뢰성을 높이기 위해 노력하고 있습니다.
