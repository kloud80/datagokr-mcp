summary_user: 서울특별시 도시관리계획으로 결정된 경관지구를 도형(지구 경계) 단위로 담은 공간정보로, 도형별 분류코드·결정고시 관리코드·명칭·면적·길이·작성일자를 포함하며 범위는 서울 한 시도이다. 토지 소유자나 건축·개발 사업자가 특정 부지가 경관지구에 들어가는지 확인하거나, 분석가가 서울 경관지구의 분포와 면적을 파악하는 데 쓴다. 시군구 코드(SGG_CD) 필드가 있지만 실측상 전역 조인 키는 확인되지 않아, 다른 용도지역·지구 자료와는 지구 이름·코드 매핑이나 같은 기관 코드로 이어 쓴다.
description_portal: '서울시 경관지구 공간정보 입니다.경관지구는 「국토의 계획 및 이용에 관한 법률」에 의한 용도지구의 하나로, 그 지정 및 변경은 도시관리계획의 결정을 통해 이루어진다. 여기서 경관(景觀)이란 도시경관을 의미하며 이는 도시 공간에서 지형, 수목, 건축물, 도로 따위의 구성물이 어우러져만들어 내는 지역 경치의 특색을 뜻합니다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.문의: 도시계획과(02-2133-8339)'
