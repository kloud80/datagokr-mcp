summary_user: 인천광역시 미추홀구에서 추진 중인 주거환경개선사업을 정비구역 단위로 한 줄씩 담은 소규모 현황 파일(csv 약 1KB)로, 구역명·도로명주소·구역면적·건폐율·용적률·예상세대수·정비구역 지정일·사업시행 인가일·시공자·현 추진사항과 위도·경도를 담는다. 주민이나 부동산 분석가가 '미추홀구 주거환경개선구역은 지금 어느 단계이고 시공사는 어디인가'를 확인하거나, 구역 위치를 지도에 찍어 보는 데 쓴다. 전역 조인 키는 없어서 구역명이나 도로명주소, 위도·경도로 다른 정비사업·부동산 자료와 맞춰 이어 써야 한다.
limits: 공통 코드 키가 없어 다른 데이터와는 이름·주소·좌표 매칭으로만 연결된다. 범위가 미추홀구 한 곳이라 다른 시군구와의 비교에는 별도 자료가 필요하다. 명세상 연간 단위로 생성되므로 추진 단계의 수시 변화는 바로 반영되지 않을 수 있다.
