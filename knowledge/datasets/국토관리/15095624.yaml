summary_user: 충청남도 서산시 산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일(CSV, 약 40KB)로, 단지명·회사명·공장 주소(도로명·지번)·전화번호·생산품을 담는다. 서산 지역에서 일자리를 찾는 구직자나 영업처를 찾는 사업자가 '어느 산업단지에 어떤 품목을 만드는 회사가 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 회사명·단지명 같은 이름 매칭이나 공장 주소를 기준으로만 이어 쓰며, 공장 등록 자료와 겹쳐 대조할 때도 이름·주소로 맞춰야 한다.
description_portal: 이 데이터는 서산시 산업단지에 입주한 기업의 정보를 수록한 자료이다. 항목은 단지명, 회사명, 공장대표주소, 전화번호, 생산품으로 구성되며, 지역 내 산업단지 현황과 입주 기업의 생산 활동 파악을 목적으로 한다. 단지명은 입주 산업단지의 명칭이며, 회사명은 등록된 공식 기업명이다. 공장대표주소는 사업장의 실제 위치를 나타내고, 전화번호는 문의 및 행정 연락을 위한 수단이다. 생산품 항목은 각 기업이 제조하거나 취급하는 주요 품목을 의미한다. 이 자료는 산업 정책 수립, 기업 지원, 투자 유치, 지역 경제 분석, 기업 정보 제공 등 다양한 분야에서 활용된다. 데이터는 행정 절차에 따라 주기적으로 점검 및 갱신되어 최신성을 유지한다.
