summary_user: 진안군이 관리하는 산업단지(농공단지 포함)별 입주업체를 업체 한 곳당 한 행으로 담은 건별 명단 파일로, 산업단지명·업체명·전화번호·도로명주소·상태·데이터 기준일자를 담는다. 구직자나 영업 담당자가 '진안의 어느 산업단지에 어떤 업체가 입주해 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 산업단지명·업체명 이름 매칭이나 도로명주소로만 이어 쓰며, 공장 등록 현황이나 산단 통계와는 이 방식으로 대조한다.
description_portal: 전북 특별자치도 진안군이 관리하는 산업단지 내 입주기업 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 진안군에 있는 산업 단지명, 여러 산업단지에서 운영하는 업체명, 전화번호(개인 휴대전화 번호 제외), 업체가 위치한 장소의 도로명주소 정보, 데이터 기준일자 등의 정보를 제공합니다. 이 자료 중 전화번호 정보에서 빈칸은 개인 휴대전화 번호로 개인정보에 해당하여 제외 처리하였습니다. 그리고 업체명을 통해 어떤 업체들이 진안의 어느 산업단지에서 운영하고 있는지 파악할 수 있습니다.
