description_portal: 이 데이터는 청년매입임대주택 입주자 모집 시 신청자의 자격 요건을 정량적으로 평가하기 위한 배점 기준을 제공합니다.평가항목에는 기초생활수급자 여부, 장애 여부, 청년 본인 및 부모의 무주택 여부, 지역 외 거주자 여부, 주거 형태(고시원, 반지하 등) 등 다양한 사회·경제적 요인이 포함되어 있으며, 항목별 점수 기준에 따라 총점을 산정합니다.해당 데이터는 청년층의 주거 실태와 취약 정도를 수치화하여 공정하고 투명한 입주자 선발에 활용되며,공공임대주택 정책 수립 및 주거복지 증진을 위한 분석 자료로도 활용이 가능합니다.민간이나 연구기관에서도 청년 주거복지 개선 연구의 기초자료로 활용할 수 있습니다.
