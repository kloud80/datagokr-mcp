summary_user: 청약홈에 올라온 분양 공고를 단지(공고) 단위로 담는 API로, APT·오피스텔·도시형·민간임대·생활숙박시설·무순위/잔여세대·공공지원 민간임대·임의공급의 모집공고일, 청약 접수 기간, 계약 기간, 당첨자 발표일, 입주 예정월을 포함한다. 청약 대기자가 관심 지역에서 언제 어떤 단지의 청약 접수가 열리는지 확인하는 질문에 쓴다. 조인 키는 공급 주소(HSSPLY_ADRES) 하나뿐이라 주소 기준으로 실거래가나 공급·미분양 같은 다른 주택 데이터와 이어 쓰며, 법적 근거 층은 주택법(공급·청약)에 해당한다.
description_portal: 한국부동산원 '청약홈'에서 제공하는 분양정보 조회 서비스로 APT(민간사전청약 및 신혼희망타운 포함), 오피스텔/도시형/민간임대/생활숙박시설, APT 무순위/잔여세대, 공공지원 민간임대, 임의공급의 분양정보 데이터를 제공합니다.※ 관련 기술문서는 아래 URL을 통해 확인하시기 바랍니다.https://www.reb.or.kr/reb/na/ntt/selectNttInfo.do?mi=10251&bbsId=1268&nttSn=79889
