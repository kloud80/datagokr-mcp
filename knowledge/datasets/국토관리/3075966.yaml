summary_user: 경상남도 남해군 10개 읍면(남해읍·이동면 등)별 강우량을 월 단위로 누적한 집계표로, 단위는 밀리미터(mm)이며 포털 설명상 2017~2025년 자료를 담는다. 남해군 계측기 9개소와 기상청 계측기 1개소의 AWS 원시 자료이며, 농어업 종사자나 재해 분석가가 '지난 몇 년간 우리 면의 장마철 월 강우량이 어땠나'를 확인하는 데 쓴다. 전역 조인 키는 없고 읍면 이름이 열 이름으로 들어 있어, 다른 데이터와는 읍면 이름이나 기관 단위 매핑으로만 이어 쓴다.
description_portal: 기후변화로 인한 집중호우와 가뭄 등 극한 기상현상이 빈발하고, 재해 예방 및 대응을 위한 정확한 기상 데이터 수집과 분석 필요성이 급증하며, 농업·어업 등 1차 산업의 생산 계획 수립과 피해 예방을 위한 장기간 강우량 통계 자료 제공 필요성이 증가함에 따라 경상남도 남해군의  강우량 현황을 제공합니다. 남해군의 월별, 10개 읍면별 누적된 강우량 데이터로 강우량 단위는 밀리미터(mm) 입니다.  2017년부터  2025년까지의 데이터로 (AWS)계측기기에서 수집한 원시 자료로 보정하지 않은 자료입니다.  데이터는 남해군의 계측기 9개소와 기상청 계측기 1개소에서 수집된 데이터입니다.
