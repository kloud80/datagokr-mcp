summary_user: 단양군 매포하수처리장 한 곳의 수질을 측정일자별로 담은 원천 기록으로, 하루 유입량(반류수 포함)과 수온, 유입수·방류수 각각의 pH·BOD·TOC·SS·총질소·총인·총대장균군 값을 담는다. 연구자나 지역 주민이 '매포하수처리장의 방류수 BOD·총인이 계절이나 유입량 변화에 따라 어떻게 달라지는가', '유입 대비 처리 효율은 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 측정일자나 처리장 이름, 같은 기관(단양군) 기준으로만 맞춰 이어 쓴다.
limits: 단양군 매포하수처리장 한 곳만 다루므로 다른 처리장이나 지역과 비교하려면 별도 데이터를 이름으로 매핑해야 한다. 처리장·행정구역 코드 같은 공통 키가 없어 하수처리장 원장이나 방류수 TMS 자료와 자동으로 결합되지 않는다.
