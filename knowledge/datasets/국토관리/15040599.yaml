summary_user: 관악구의 등록 임대주택 물건을 건별로 담은 파일 데이터로, 영업상태·사업자구분·임대주택 구분·종류·유형과 임대물건지 주소를 싣고 검증 시 20,775행이 수신됐다. 관악구 안에 건설임대·매입임대 같은 등록임대가 어느 주소에 얼마나 있는지 확인하려는 분석가나 임차인이 쓴다. 임대물건지 주소(address)를 조인 키로 삼아 전월세 실거래 자료와 병합해 보는 용도로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 관악구에서 운영 중인 임대주택 관련 현황을 정리한 자료로, 영업상태명, 사업자구분, 임대물건지 주소, 임대주택 구분, 임대주택종류, 임대주택 유형, 데이터 기준 일자 정보를 포함하고 있습니다. 이를 통해 임대주택이 어떤 형태(건설임대·매입임대·단기임대·준공공임대 등)로 공급되고 있는지, 그리고 주택 유형이 아파트인지 다세대주택인지 등 기본적 특성을 파악할 수 있으며, 관악구 내 임대주택 분포와 관리 현황을 행정적으로 확인하는 데 활용할 수 있습니다. 해당 데이터는 각 임대사업자의 영업상태가 전입영업중인 물건을 중심으로 위치 정보가 제공되는 기초 현황 자료로, 세부 임대조건이나 거주자 정보 등은 포함되지 않은 점에서 기본 주소 기반의 현황 파악용 데이터라는 특징을 가집니다.
