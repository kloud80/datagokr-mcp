summary_user: 전국 지적재조사 사업지구별로 사업 진행 단계(진행상태 세부코드)마다 예정 계획 시작·종료 일시와 등록·갱신 일시를 담은 계획 정보 파일이며, 포털에서 활용신청 없이 약 10MB 크기의 CSV로 받는다. 지자체·사업대행자나 토지소유자가 "우리 지구의 경계확정이나 사업완료공고는 언제 예정되어 있나"처럼 사업지구의 단계별 추진 일정을 확인하는 데 쓴다. 진행상태 세부코드(실시계획수립부터 등기촉탁까지 24단계)는 포털 설명의 코드표로 풀어 읽으며, 실측 컬럼에 필지고유번호(PNU)나 행정구역 코드 같은 전역 조인 키가 없어 다른 지적·필지 데이터와는 사업지구 일련번호를 이름·코드로 매핑하거나 같은 기관 데이터와 맞춰야 이어진다.
limits: 실측 컬럼에 전역 조인 키가 없어 필지·행정구역 단위 데이터와 바로 결합할 수 없고, 사업지구 일련번호만으로는 지구의 위치나 이름을 알 수 없다. 포털 설명에 나오는 면적·대상 필지수·예산 등은 실제 필드 목록에 보이지 않으므로 파일을 확인한 뒤 써야 한다.
