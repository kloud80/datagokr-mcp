summary_user: 충청남도개발공사가 시행하는 공공사업별로 인허가 건의 사업명·인허가명·인허가기관·신청일·결정일·심의결과를 한 행씩 담은 CSV 파일(약 7KB)이다. 공사 사업에 관심 있는 주민이나 분석가가 "이 사업은 어떤 인허가를 어느 기관에 언제 신청해 언제 어떤 결과를 받았나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·인허가기관 이름을 맞추거나 같은 기관의 다른 데이터로만 이어 쓴다.
