description_portal: '안양시  지역주택조합 사업 현황입니다.데이터 설명: 안양시_지역주택조합 사업 현황이 데이터는 「주택법」 제11조 및 관련 법령에 따라 경기도 안양시 관내에서 추진 중인 지역주택조합 사업의 현황을 수록한 자료입니다. 지역주택조합은 무주택자 또는 1주택 소유자가 조합을 구성해 공동으로 주택을 건설하는 제도로, 본 데이터는 조합 설립 및 사업 진행 현황을 파악할 수 있도록 다음과 같은 15개 속성 정보를 제공합니다 - 시군명,조합명,조합장명,설립인가일자,사업계획승인일,착공신고일,사업지위치,세대수(조합원),세대수(총분양),대지면적,연면적,시공사명,관리기관명,관리기관전화번호,데이터기준일자이 데이터는 주택 수요 분석, 도시계획 수립, 부동산 시장 동향 파악, 시민 정보 제공 등 다양한 목적으로 활용될 수 있으며, 특히 지역 내 주택공급 계획과 조합 추진 현황을 한눈에 파악할 수 있는 기초자료로 유용합니다.'
