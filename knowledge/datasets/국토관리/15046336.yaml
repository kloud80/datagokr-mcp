description_portal: '○ 통계개요* 통계명 : 건축허가* 통계종류 : 서울시 및 자치구가 허가한 건축규모 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 및 자치구로부터 허가받은 건축규모 현황을 파악하여 건설경기예측 및 건설관련 정책수립의 기초 자료로 활용하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 건축허가 받은 건축물의 건축형태별ㆍ재료별ㆍ용도별 동수및 연면적 현황○ 용어설명* 주거용 : 단독주택(단독, 다중, 다가구주택등), 공공주택(아파트, 연립, 다세대주택등)* 상업용 : 판매 및 영업시설, 위락시설, 근린생활시설, 숙박시설, 업무시설 등* 농림수산업용 : 동물 및 식물관련 시설(축사, 가축시설, 온실 등)* 공업용 : 공장, 위험물제조소* 공공용 : 교도소, 발전소, 방송국, 전신전화국 등* 문교용 : 교육연구 및 복지시설* 사회용 : 운동, 의료, 문화 및 집회, 관광ㆍ휴게, 묘지관련시설 등* 기타 : 위험물저장 및 처리시설, 자동차관련시설 등○ 기 타* 허가연면적은 허가동수 총 건물연면적을 의미* 주택건축물의 용도별 내역은 주용도(신청내용중 가장 큰용도)로 구분하여 집계○ 출 처 : 서울특별시 건축기획과'
