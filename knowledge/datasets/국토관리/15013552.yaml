summary_user: 구례군 내 개별단독주택의 공시가격을 필지·건물 단위로 담은 파일(csv)로, 기준연도·지번·동번호별 대지면적과 건물연면적, 산정면적, 개별주택가격(원)을 행마다 기록한다. 구례군에 단독주택을 가진 주민이나 보유세·건보료 산정을 검토하는 분석가가 '이 주택의 올해 공시가격은 얼마이며 산정 면적은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 PNU 같은 전역 조인 키가 없어, 다른 데이터와는 지번 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: '"개별주택가격" 공공데이터는 구례 지역 내에 위치한 개별 주택의 가격에 관한 정보를 제공합니다. 이 데이터는 주로 개별 주택의 위치, 크기, 건축 연도, 거래 일자, 거래 가격 등을 포함합니다. 이를 통해 지역 주택 시장의 동향을 파악하고 부동산 시장의 흐름을 이해할 수 있습니다. 또한, 이 데이터는 부동산 투자, 주택 구매 결정, 부동산 시장 분석 등에 활용될 수 있습니다.'
