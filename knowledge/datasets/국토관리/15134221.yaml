summary_user: 주택도시보증공사 전세보증금반환보증의 사고현황을 시·도·구 지역별로 묶어 최근 3개월 평균 사고건수·사고금액·사고율로 담은 전국 단위 집계 파일(xlsx)이다. 임차인이나 분석가가 "우리 지역의 전세보증 사고율이 다른 지역보다 높은가"를 확인하거나 전세 사기 위험 지역을 비교하는 데 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어, 전월세 실거래 등 다른 데이터와는 시·도·구 이름을 맞춰 연결해야 한다.
limits: 건별 사고 원천이 아니라 지역별 최근 3개월 평균 집계라서 개별 주택·임대인 단위 분석이나 장기 시계열 추적은 이 파일만으로 하기 어렵다. 파일 첫 행이 제목('전국 보증사고 현황')이고 나머지 열 이름이 비어 있어(Unnamed), 파싱할 때 실제 머리행을 따로 지정해야 한다.
