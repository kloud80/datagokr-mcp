description_portal: 공사 보증상품인 전세보증금반환보증의 지역별(시/도/구) 최근 3개월 평균 사고현황 데이터를 제공합니다.전세보증금반환보증이란 전세 계약이 종료되었을 때, 임대인이 임차인에게 보증금을 반환하지 못하는 경우 우리 공사에서 임차인에게 보증금을 대신 지급해주는 상품입니다.전세보증사고는 임대차 계약이 끝난 후 임차인이 전세금을 돌려받지 못하거나, 경매 등으로 인해 전세금 반환이 어려워지는 상황을 말합니다.이러한 정의를 바탕으로 2025년도 8월 31일 기준의 데이터이며, 최근 3개월에 대한 공시자료입니다. - 최근 3개월 평균 사고건수 - 최근 3개월 평균 사고금액 - 최근 3개월 평균 사고율
