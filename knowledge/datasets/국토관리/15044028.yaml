description_portal: '한국부동산원(구.한국감정원)에서 제공하는 전국주택가격동향조사 월간동향 중 아파트의 전월세통합지수 데이터입니다.<전국주택가격동향조사 개요>ㅇ 국가통계 승인번호 : 제304004호ㅇ 법적근거 : 「주택법」제88조 1항 및 제89조 제2항 제4호 동법 시행령 제91조 제2항 제3호ㅇ 조사목적 : 전국 주택시장의 매매, 전세, 월세가격을 조사하여 주택시장의 평균적인 가격변화를 측정, 주택시장 판단지표 또는 주택정책수립의 참고자료 제공ㅇ 조사방법 : 표본조사ㅇ 공표주기 : 월간 및 주간ㅇ 공표시기  - 월간 : 익월 15일(발표일이 휴일인 경우 그 다음날)  - 주간 : 매주 목요일(공표일이 휴일인 경우 사전 안내 예정)※ 유의사항 : 전국주택가격동향조사는 주택가격지수를 산출하여 제공하는 것이 주된 목적이며, 조사항목, 표본추출방법, 지수산출방법 등이 이에 맞게 설계되었음. 본 조사는 주택가격 지수산출에 맞게 설계되었기 때문에 평균/중위 주택가격 결과는 참고 사항으로 이용하기 바람.'
