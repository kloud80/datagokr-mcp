description_portal: '부산광역시 도시재생종합정보관리시스템의 부산광역시에 추진되고 있는 다양한 도시재생사업의 사업관리번호,사업년도,사업명,입력일자,수정일자,레이어ID,주관부서 등의 정보를 제공합니다.- 행복마을 만들기사업 : "사람중심 창조도시" 구현을 위하여 마을 단위의 공동체 복원을 통한 서민 밀집지역의 물리적, 사회·문화적, 경제적 통합재생사업- 산복도로르네상스 사업 : 산복도로 일원 의 다양한 계층을 포용하고 산복도로가 가지고 있는 공간·문화·경관·역사적 자산을 보전하면서 정주환경 개선과 마을경제 회복을 위한 새로운 방식의 종합재생사업- 국토교통부형 도시재생사업 : 도시재생활성화 및 지원에 관한 특별법에 따라 국토교통부의 예산 지원 등을 통해 추진되는 사업-도시재생 전략계획 : 부산광역시의 10년 단위 도시재생계획으로 도시재생사업을 추진할 수 있는 활성화구역을 지정'
