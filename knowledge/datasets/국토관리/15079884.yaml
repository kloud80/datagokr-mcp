summary_user: 대구광역시 서구 내 일반건축물의 과세년도별 시가표준액을 건축물(동·호) 단위로 담은 파일 데이터로, 소재지(법정동·리, 본번·부번), 연면적, 기준일자가 함께 들어 있다. 세무 담당자나 부동산 분석가가 서구의 특정 지번 건물의 과세 기준가액이 얼마인지, 또는 동별 건축물 평가액 분포를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 건축물·토지 자료와는 자치단체코드와 법정동·본번·부번을 이어 만든 지번 주소를 매칭하는 방식으로만 연결한다.
description_portal: 본 자료는 대구광역시 서구 지역 내 일반 건축물에 대한 세무 평가 정보를 수록한 자료이다. 주요 항목으로는 시도명, 시군구명, 자치단체코드, 과세년도, 법정동·리, 특수지 여부, 본번 및 부번, 동·호수, 물건지 주소, 시가 표준액, 연면적, 기준일자 등이 포함되어 있다. 시가 표준액은 부동산 과세 및 평가의 기초 자료로 활용되며, 연면적 정보는 세율 산정의 참고 지표로 제공된다. 해당 자료는 2024년 기준으로 작성되었으며, 동일 기준일자 내 복수의 건축물 정보를 포함하고 있다. 이는 세무 행정, 도시계획, 부동산 거래 분석 등에 활용 가능하며, 해당 지역 부동산의 시세 흐름 파악에도 기초 자료로 사용된다. 모든 데이터는 공공기관의 과세자료를 기반으로 수집·정리되었다.
