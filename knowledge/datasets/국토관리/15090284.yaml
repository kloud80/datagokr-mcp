summary_user: 서귀포시 관내 소규모 도시공원별로 공원명, 사물주소(도로명 기준 주소), 위도·경도, 데이터기준일자를 한 행씩 담은 개별 위치 파일(CSV, 약 6KB)이다. 시민이나 분석가가 '우리 동네에서 가장 가까운 소공원은 어디인가', '공원이 부족한 구역은 어디인가'를 지도에 찍어 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 공원 현황 데이터와는 공원명이나 주소로 맞추고, 위도·경도로 다른 시설·인구 공간자료와 겹쳐 쓴다.
description_portal: 이 데이터는 서귀포시 관내 소규모 도시공원의 **사물주소(도로명 기준 주소)**와 공원명, 그리고 위도·경도 좌표를 포함하여 시각적으로 위치를 확인할 수 있도록 한 자료입니다.행정기관은 이를 기반으로 GIS 지도 시각화, 공원 접근성 분석, 휴식 공간 배치 계획, 도시 녹지 네트워크 구축, 공원 간 거리 분석, 어린이 안전 확보, 노후공원의 리모델링 또는 신규 조성 계획 등을 효율적으로 추진할 수 있습니다.시민에게는 가까운 공원을 쉽게 찾거나 휴식 장소를 결정하는 데 도움을 줄 수 있고, 관광객 대상 안내 앱이나 환경교육 콘텐츠에도 유용한 기초 GIS 데이터 자료로 활용될 수 있습니다.
