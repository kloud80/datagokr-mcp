description_portal: '경상남도 사천시 사출성형기 제조업체 현황으로 상호명, 주소(도로명, 지번), 연락처, 팩스번호, 생산품, 업종명에 대한 정보를 제공합니다.경상남도 사천시 관내에 소재한 사출성형기 제조업체들의 상세 현황 정보를 공공데이터로 제공합니다.이 정보는 관련 산업 종사자 및 관심 있는 분들의 비즈니스 및 연구 활동을 지원하기 위해 마련되었습니다. 제공되는 주요 항목은 다음과 같습니다:상호명: 각 제조업체의 공식 명칭주소: 업체 위치 파악을 위한 도로명 주소 및 지번 주소연락처: 문의 및 소통을 위한 전화번호팩스번호: 문서 송수신을 위한 팩스번호생산품: 해당 업체에서 주로 생산하는 사출성형기 및 관련 제품 명칭업종명: 한국표준산업분류에 따른 정확한 업종 구분이러한 데이터를 통해 사천시 사출성형기 제조 산업의 규모와 특성을 파악하고, 지역 경제 활성화에 기여할 수 있는 기반을 마련하고자 합니다.'
