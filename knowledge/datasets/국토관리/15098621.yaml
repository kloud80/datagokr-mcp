summary_user: 경기도 과천시에 있는 공장을 업체 한 곳당 한 행으로 담은 파일 데이터로, 회사명·주소·전화번호·업종명·생산품을 담는다(파일 크기 약 6KB 수준의 소규모 목록). 과천시 안에 어떤 제조업체가 어디서 무엇을 생산하는지 알고 싶은 주민·사업자나, 지역 제조업 분포를 보려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 데이터와는 회사명·주소를 문자열로 맞춰 이어야 한다.
description_portal: 공공데이터 포털에 등록되어 있는 경기도 과천시에 위치한 공장 현황 데이터 자료로 키워드는 공장, 제조업, 생산품, 산업, 생산 총 5개로 구성되어 있습니다. 이 자료는 각 업체별 업체명, 주소, 대표 전화번호, 업종명, 주 생산품에 대한 정보를 포함하고 있으며, 이를 통해 지역 내 제조업체 분포 및 특성을 파악하는 데 활용할 수 있습니다. 해당 데이터를 통해 산업 밀집 지역 분석, 기업 유치 전략 수립, 도시계획 및 지역경제 활성화 정책 수립 등에 필요한 기초자료로 활용 가능하며, 나아가 제조업 기반 산업 구조 분석 및 정책 수립에도 중요한 자료로 사용될 수 있습니다.
