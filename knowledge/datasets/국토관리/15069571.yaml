summary_user: 중앙토지수용위원회가 재결정보시스템(LTIS)에 등록한 토지 재결 관련 대법원 판례를 판례 한 건씩 제목·내용·등록일자와 함께 담은 전국 단위 비공간 파일이다(실측 csv 1,705바이트의 소규모 파일). 토지수용 재결을 앞둔 사업시행자나 토지소유자, 실무자가 '비슷한 보상·수용 쟁점에서 대법원이 어떻게 판단했나'를 찾아볼 때 쓴다. 다른 데이터와 묶을 전역 조인 키는 없어, 판례 제목·내용의 이름 매칭이나 같은 기관의 재결 관련 데이터와 내용 기준으로만 이어 쓴다.
description_portal: 이 데이터는 토지 재결과 관련된 과거 판결문을 신속하고 간편하게 참고하고자 재결정보시스템( LTIS)에 등록시킨 대법원 판례모음 입니다. 이 데이터에는 판례일련번호, 판례제목, 판례내용, 판례등록일자, 삭제여부, 등록일시, 수정일시 등의 내용이 포함되어 있습니다. 이 데이터를 통하여 국토교통부 중앙토지수용위원회 사무국에서 수행하는 토지재결업무를 공정하고 명확하게 수행할 수 있습니다. 이 데이터에는 개인휴대전화번호, 주민등록번호 등 어떠한 개인정보도 포함되어 있지 않습니다.
