description_portal: 부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에서 사용하는 상수도기본요금표입니다.매월 요금계산에 적용되며, 홈페이지를 통해 공개되고 있습니다. 상수도, 하수도, 물이용부담금으로 세가지로 단가가 책정됩니다.하수도요금은 단계별 요율제로 적용됩니다.물이용부담금은 낙동강수계위원회를 통해 책정됩니다.요금고지서 뒷면을 통해서도 확인 가능합니다.사용량 단위는 톤을 사용합니다.매월 14일에 요금계산됩니다. 만약 휴일일 경우 익일에 계산됩니다.기본요금은 수도관 구경에 따라 책정됩니다. 물이용부담금 세입월집계표입니다.
