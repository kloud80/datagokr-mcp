summary_user: 경기도에 접수된 공동주택 관리 민원(유선·서면·방문)을 연도별로 유형에 따라 나눠 발생건수를 담은 집계 통계로, 입주자대표회의·선거관리위원회·관리업자 및 사업자 선정·장기수선계획·층간소음 등 항목별 건수와 합계를 담는다. 정책 담당자나 연구자가 "공동주택 갈등은 어떤 유형에서 가장 많이 생기고 해마다 어떻게 변하는가"를 파악해 관리제도 개선이나 주민갈등 예방 방안을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 K-apt 단지코드 기반 데이터와 직접 결합되지 않으며, 연도(agrt_yr) 기준으로 다른 연도별 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 공동주택 관리 과정에서 발생하는 민원(유선, 서면, 방문) 유형을 구분하여 연도별 발생건수를 정리한 통계자료입니다.입주자대표회의, 선거관리위원회, 주택관리업자 및 사업자 선정 등 공동주택 운영과정에서 발생하는 주요 민원 현황을 포함합니다.공동주택 관리과정의 갈등 유형과 민원발생 구조를 파악하고 관리제도개선, 주민갈등예방, 공동주택 정책수립을 위한 기초자료로 활용될 수 있습니다.“관리규약 개정”, “전유부분 및 공용부분의 범위”, “관리주체의 업무”, “층간소음관리”, “공동체 활성화” 항목은 2025년부터 세분화되어 집계된 항목으로 2024년 데이터에서는 별도 구분되어 집계되지 않고 “기타” 항목에 포함되어 있으니 이용에 참고해 주시기 바랍니다.
