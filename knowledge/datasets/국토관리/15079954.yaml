summary_user: 화순군 관내 일반건축물의 시가표준액을 건물(물건지)별로 담은 파일로, 납부년도·연면적·결정일자·데이터기준일이 함께 들어 있다(CSV 약 2.2MB). 화순군 주민이나 분석가가 특정 건물의 재산세 과세 기준금액이 얼마인지, 연면적 대비 시가표준액이 어느 수준인지 확인하는 데 쓴다. 전역 조인 키는 없어서 자치단체코드나 물건지 주소 문자열을 매핑해 건축물대장·공시지가 같은 다른 국토 정보와 이어야 한다.
description_portal: 본 데이터는 전라남도 화순군 관내 각종 일반건축물의 시가표준액 현황을 종합적으로 제공하는 자료이다. 시가표준액은 건축물에 대한 재산세 등 각종 지방세의 과세 기준으로 삼기 위해 산정된 표준금액으로, 건축물의 위치, 용도, 구조, 연면적, 건축년도 등 다양한 요소를 반영하여 결정된다. 본 데이터에는 건축물별 주소, 물건지, 시가표준액, 연면적, 과세 년도 등 주요 항목이 포함되어 있다. 이를 통해 행정기관은 과세의 공정성을 확보하고 주민의 재산권 보호, 부동산 관련 정책 수립 및 평가, 자산관리와 투자분석 등의 업무를 효율적으로 지원할 수 있다. 주민과 공공기관, 전문가들은 해당 자료를 참고하여 건축물 가치 분석, 세부담 예측, 거래 및 이전 시 참고자료로 활용이 가능하다. 데이터는 정기적으로 최신 시가표준액이 반영되어 공시된다.
