summary_user: 인천광역시 남동구의 도시형생활주택 인허가 건을 필지·건물 단위로 담은 원천 목록으로, 대지위치·지번·용도지역, 대지·건축·연면적, 동수·세대수·세대별 전용면적, 건축허가/사업계획승인 구분과 인허가 신청일·인허가일·착공일·사용승인일을 포함한다. 남동구 안에서 어느 동네에 소형 공동주택이 얼마나 인허가·착공·준공됐는지 확인하려는 주민·분석가·주택사업자가 쓴다. 전역 조인 키나 법정동 코드는 없어 다른 인허가·건축물 데이터와는 대지위치·지번 같은 이름·주소 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 인천광역시 남동구 내 도시형 생활주택의 인허가 현황을 상세히 담고 있습니다. 주요 항목으로는 고유번호, 행정구역명, 대지 위치 및 지번, 토지 용도, 면적 정보, 용도지역과 관련된 세부구역, 건축 관련 면적, 동 수, 건축 유형과 용도, 세대 수, 세대별 전용 면적, 그리고 건축 허가 및 사업계획 승인 여부 등이 포함됩니다. 또한 인허가 신청일, 최종 인허가일, 착공일, 사용검사 혹은 사용승인일 등의 일정 정보도 제공하여 건축 과정 전반을 추적할 수 있습니다. 이 데이터를 활용하면 지역별 주택 공급 현황과 개발 동향을 분석할 수 있어 도시계획과 주거 정책 수립에 중요한 기초 자료로 활용될 전망입니다. 향후 지속적인 데이터 업데이트와 연계 분석으로 스마트 시티 구축 및 주택 시장 안정화에도 크게 기여할 것입니다.
