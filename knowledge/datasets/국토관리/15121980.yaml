summary_user: 전국의 지적 좌표를 세계측지계로 바꾼 변환지구별로 시군구, 기준년도, 지구명(수치·도해 등 유형 포함), 변환된 필지 수, 기준점(원점) 수를 한 행씩 담은 집계 파일이다. 지역별로 지적도가 언제 어떤 방식으로 세계측지계로 바뀌었는지 확인하려는 공간정보 사업자나 분석가가 '우리 사업 대상 시군구는 언제 변환됐고 필지가 몇 개인가'를 따질 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 시군구코드나 시군구명을 매핑해 다른 행정구역 단위 데이터와 연결한다.
