summary_user: 주택도시보증공사 분양보증 사업장(임대·도시형생활주택·오피스텔 제외) 가운데 30세대 이상 아파트를 대상으로, 지역별 신규 민간분양아파트의 총 분양가 대비 총 대지비 비율을 월말 기준으로 집계한 표다. 행은 전국의 지역, 열은 2023년 1월부터 2026년 4월까지의 월말 시점이다. 분양을 앞둔 수요자나 분석가가 우리 지역 신규 아파트 분양가에서 땅값이 차지하는 몫이 어떻게 변했는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 주택 통계와는 지역 이름을 맞춰서만 이어 쓴다.
description_portal: '*작성기관 : 주택도시보증공사*조사목적: 공사에서 발급하는 보증상품의 발급내역과 잔액의 정보를 제공하여 대국민 정보서비스 및 각종 연구의 기초 데이터로 활용*조사대상 : 공사 분양보증(임대, 도시형생활주택, 오피스텔 제외) 사업장*조사주기 : 매월*조사방법 : 분양세대수 30세대 이상 아파트 전수조사*공표- 공 표 일 : 익월 15일(단, 공표일이 법정 공휴일인 경우 그 익일)- 작성기준 : 매월 말일 기준- 공표방법 : 홈페이지(www.khug.or.kr) 게시* 지역별 분양가 대비 대지비 비율 산정시, 해당 지역의 신규 민간분양아파트의 총 분양가격 대비 총 대지비로 산출*지역 내 분양이 적은 경우 편차가 크게 발생할 수 있음* 같은 지역이라도 지역 내(구별, 동별) 분양가 및 대지비가 상이하고, 신규 분양사업장의 입지여건(학군, 역세권 등)에 크게 좌우되므로, 특정 지역에서만 신규로 분양되면 편차 발생 가능성 높음'
