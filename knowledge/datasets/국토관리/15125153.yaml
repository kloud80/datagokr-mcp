summary_user: 한국산업단지공단이 주요 국가산업단지 산업동향 통계를 산업단지별·업종별로 나눠 누계로 집계한 xlsx 파일로, 입주업체수·생산액·수출액·고용인원을 담고 실측 열 머리에 2022년 12월 기준 시점이 보인다. 지역 제조업 경기를 보는 분석가가 "특정 국가산단에서 어느 업종이 생산·수출·고용을 가장 많이 차지하는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 산업단지 원장이나 다른 산단 통계와는 단지명 문자열 매핑으로만 이어 쓴다.
