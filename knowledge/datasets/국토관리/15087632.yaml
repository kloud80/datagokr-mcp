description_portal: '제주특별자치도 내 상하수도 요금산정 기준 정보와 관련한 데이터를 제공합니다.항목: 구분, 업종, 사용량(세제곱미터), 세제곱미터당요금(원)*「수도법」에 의거하여 관리됨- 수돗물의 요금이 정하여지면 3개월 이내에 수도요금 생산원가, 요금부과 단가, 재원부족액, 부족 예산 충당 계획 등을 환경부령으로 정하는 바에 따라 공고하여야 함- 지방자치단체인 수도사업자로부터 수돗물을 공급받은 자는 수돗물의 요금 또는 그 부담금을 해당 지방자치단체의 조례로 정하는 바에 따라 「여신전문금융업법」에 따른 신용카드ㆍ직불카드 또는 정보통신망을 이용한 전자화폐ㆍ전자결제 등의 방법으로 납부할 수 있음 자세한 사항은 제주상하수도본부 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jejuwater/square/rates/rate-standard/standard01.htm'
