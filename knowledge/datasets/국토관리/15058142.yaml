summary_user: 경기도 시군별로 지정된 자연생태 우수마을을 마을 한 곳당 한 행으로 담은 건별 지정 현황으로, 시군명·마을명·지정구분·지정사유·지정기간과 소재지 주소·위경도 좌표를 포함한다. 환경단체나 생태관광 기획자가 '우리 시군에 어떤 생태우수마을이 있고 왜 지정됐는가'를 확인하거나 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 시군명이나 시군코드(SIGUN_CD) 같은 이름·코드 매핑으로만 다른 데이터와 잇고, 위경도 좌표로 공간 데이터에 겹쳐 쓴다.
description_portal: 이 데이터는 2017년 12월 31일을 기준으로 경기도 내 시군별로 선정된 자연생태 우수마을의 지정 현황을 제공하는 자료입니다. 자연생태 우수마을은 생태 보존 상태가 우수하고 생물다양성 및 자연경관이 뛰어난 마을 중 주민 참여와 지역 환경 보호 노력을 바탕으로 선정되며, 생태관광 자원화 및 지속가능한 지역 생태보전 활동을 유도하기 위한 목적을 가지고 있습니다. 주요 항목으로는 집계년도(SUM_YY), 시군명(SIGUN_NM), 마을명(VILAGE_NM), 지정구분명(APPONT_DIV_NM), 지정사유(APPONT_RESN), 지정기간(APPONT_PERD), 그리고 소재지 주소 및 위경도 좌표 정보가 포함됩니다.본 데이터는 지정 시점 이후 지속적인 갱신 없이 제공되고 있으며, 2018년 이후에는 새로운 지정 내역이 없는 상태입니다. 이 자료는 환경 정책 수립, 생태자원 분포 파악, 지역 환경 교육 자료 제작, 자연생태 체험 관광 기획 등 다양한 목적에 활용될 수 있으며, 특히 생태우수지역의 현황을 지도화하여 시각적으로 분석할 때 유용합니다. 또한 지정사유와 지정기간 정보는 마을의 생태적 가치 및 지속성 평가에 참고자료로 활용되며, 생태 관련 시민단체, 연구기관, 공공기관 등에서 지역별 생태보전 정책 수립의 기초자료로 활용이 가능합니다. Open API 형태로 제공되어 활용의 접근성과 연계성이 높으며, 경기도의 생태환경 보호 기반을 점검하고 보존활동의 필요성을 환기시키는 데 기여할 수 있는 공공데이터입니다.
