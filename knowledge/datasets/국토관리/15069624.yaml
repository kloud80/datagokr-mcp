description_portal: '국토교통부 중앙토지수용위원회에서 관리하는 ‘조서별 소유자·관계인 현황’ 자료는 공익사업 시행 시 토지·물건의 재결과 관련된 소유자 및 관계인 정보를 체계적으로 정리한 행정기록 데이터입니다. 2016년 이전, 2017~2018년, 2019~2020년으로 구분되어 있으며, 재결·보상·소유관계 변동 이력을 포함하고 있습니다.1. 형식: XLSX (엑셀)2. 내용 요약   ■ 조서관계인소유자일련번호: 재결기록 내 소유자·관계인 개체를 구분하기 위한 고유 식별번호   ■ 조서일련번호: 개별 재결조서(보상기록) 단위를 식별하는 고유 번호   ■ 재결일련번호: 중앙토지수용위원회 또는 지방토지수용위원회에서 부여한 재결 식별번호   ■ 소유자관계인여부: ‘O’(소유자 포함) 또는 ‘X’(관계인만 존재)로 표시, 보상권리자 여부 구분   ■ 소유자일련번호: 토지나 물건의 법적 소유자 식별을 위한 고유번호   ■ 관계인일련번호: 공동소유자, 임차인, 권리자 등 관계인의 구분번호   ■ 관계인권리명: 해당 관계인의 권리유형(예: 임차권, 저당권, 지상권 등)   ■ 지분: 해당 토지·물건에 대한 소유비율(예: 1/1, 3/9 등)   ■ 소유자등기번호: 등기부상의 소유자 관리번호(부동산 등기번호와 연계 가능)   ■ 관계인등기번호: 권리관계자 등기번호(등기정보시스템과 연계됨)   ■ 사업시행자조서관계인소유자일련번호: 사업시행기관 내부 시스템에서 사용하는 조서·소유자 연계번호로, 기관 간 자료연동을 위한 식별값3. 활용 예제   ■ 토지수용재결 과정에서 소유자 및 관계인 권리관계를 자동 검증하여 보상대상자 명단을 정제   ■ 이의재결 및 행정심판 등에서 소유자·관계인의 권리비율(지분) 검토 및 정당보상 여부 확인   ■ 중앙토지수용위원회, 한국토지주택공사(LH), 지자체 등 기관 간 조서데이터 상호연계 및 데이터 정합성 검증   ■ 사업시행자별, 연도별 소유자·관계인 변동 이력 분석을 통한 보상 절차 개선 연구'
