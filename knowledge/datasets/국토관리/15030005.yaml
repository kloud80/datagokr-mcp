summary_user: 경기도 남양주시 안의 지식산업센터를 한 건물당 한 행으로 담은 원천 목록으로, 명칭·지번/도로명 주소·위도·경도·용도지역·부지와 건축면적·층수·공장/지원시설 면적·공사진행상황·허가·착공·사용승인일을 담는다(파일 약 3KB). 남양주에서 어떤 지식산업센터가 어디에 있고 공사가 어디까지 진행됐는지, 공장시설과 지원시설 규모가 어느 정도인지 알아보려는 입주 희망 사업자나 산업용 부동산 분석가가 쓴다. 전역 조인 키가 없어 다른 시군구 지식산업센터 파일과는 명칭·주소로 맞춰 합치고, 건축물대장과는 주소나 좌표로 대조해 연결한다.
description_portal: 남양주시 지식산업센터 데이터로 명칭, 주소, 위도, 경도, 용도지역, 부지면적, 건축면적, 층수 등의 항목을 제공합니다.해당 데이터는「산업집적활성화 및 공장설립에 관한 법률에 따라 동일 건축물에 제조업, 지식산업, 정보통신산업, 지원시설 등이 복합적으로 입주할 수 있도록 설립된 다층형 집합 건축물인 지식산업센터(과거 아파트형 공장)의 현황 정보를 담고 있는 공공데이터입니다. 이 자료는 산업시설의 집적화 및 효율적인 관리, 그리고 관련 산업 정책 수립에 활용됩니다. 또한 도시형 제조업과 첨단 산업의 육성 및 지원을 위해 조성된 지식산업센터의 입주 현황, 시설 규모, 위치 등을 파악하여 산업용 부동산 시장 분석 및 정책 개발의 기초 자료로 활용될 수 있습니다.
