description_portal: 부산도시공사 임대주택 재계약 및 구비서류 관련 사항입니다.- 재계약은 2년마다 체결됩니다.해약관련 안내는 다음과 같습니다.- 입주자는 해약하기 1개월전에 관리사무소에 사전신청하여야 합니다.- 입주 후 3개월 이내에 해약을 할 경우에는 위약금이 발생합니다. 단, 다음의 경우에는 위약금이 면제될 수 있습니다. ① 근무, 생업 또는 질병치료 등을 이유로 부산광역시가 아닌 다른 곳으로 전출하는 경우 ② 상속에 의하여 취득한 주택으로 이전하는 경우 ③ 계약자가 사망한 경우 ④ 해외로 이주하거나 2년이상 해외에 체류하고자 하는 경우
