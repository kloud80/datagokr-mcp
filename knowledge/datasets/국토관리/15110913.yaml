description_portal: 해당 API는 필지의 속성 정보를 제공하는 API로 각 토지의 등록번호, 지번, 토지지목코드, 면적 등의 항목을 포함합니다. 개인이 특정 필지의 면적이나 용도(지목)을 확인하는 데 활용될 수 있습니다. 뿐만아니라 공공기관에서는 도시계획 수립, 지적재조사, 국토이용계획 등의 업무에 연계할 수 있으며, 일반 기업에서는 위치기반서비스, 부동산 평가 솔루션, 스마트시티 관련 플랫폼 구축, 입지분석 등의 다양한 분야에서 활용할 수 있습니다.본 API는 REST 방식으로 JSON 포맷으로 제공됩니다.
