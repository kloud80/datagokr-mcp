summary_user: 경상북도 영주시가 관리하는 토지재산을 필지 한 건씩 담은 원천 데이터로, 등록번호·소재지 지번·지목코드·면적을 포함하며 범위는 영주시 한 곳, 단위는 개별 주소입니다. 영주시 소유 토지 가운데 특정 지번의 면적과 지목을 확인하려는 주민·부동산 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 소재지 지번 문자열(LOCPLC)이나 지목 코드를 이름·코드로 맞춰 연결해야 한다.
limits: 표준 필지 고유번호 같은 전역 조인 키가 없어 지적·공시지가 데이터와 바로 결합하지 못하고, 주소 문자열을 맞추는 작업이 필요하다. 영주시 한 곳만 담으므로 다른 시군구와 비교하려면 데이터를 따로 구해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
