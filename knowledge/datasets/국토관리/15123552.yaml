summary_user: '국토교통부 GIS건물통합정보와 세움터 건축물대장 속성을 합친 건물 일반·집합 정보를 지도 이미지(WMS)와 도형·속성 피처(WFS)로 담으며, 범위는 전국입니다. 분석가나 개발자가 특정 지역 건물의 위치와 대장 속성을 지도 위에 띄워 보거나 공간 분석에 쓴다(예: 이 동네 집합건물이 어디에 어떤 모양으로 분포하는가). 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 건축물대장·공시지가 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.'
