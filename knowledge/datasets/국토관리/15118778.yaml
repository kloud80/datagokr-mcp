summary_user: 서울주택도시공사의 보상 대상 토지를 장소(자치구)별로 토지구분, 지목, 면적(㎡)으로 정리한 파일형 목록으로, 활용신청 없이 약 2MB 크기의 CSV로 받는다. 분석가나 정책 담당자가 "어느 자치구에서 어떤 실지목의 토지가 얼마나 넓게 보상 대상이 되었는가"를 비교해 지역 간 보상 편차를 보는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 장소에 적힌 자치구 이름이나 지목 이름을 맞춰 연결한다.
description_portal: '이 데이터는 서울특별시 각 자치구별로 정리된 보상 대상 토지의 실지목 리스트 현황을 담고 있는 파일형 자료입니다. 주요 항목으로는 토지 구분(예: 대지, 임야 등), 지목(토지의 법적 용도 구분), 해당 토지의 면적(㎡)이 포함되어 있으며, 이를 통해 구체적인 보상 대상 토지의 종류와 규모를 확인할 수 있습니다. 실지목은 토지의 실제 이용 상태를 반영하는 것으로, 보상 금액 산정이나 공공개발 사업의 계획 수립 시 중요한 기준이 됩니다. 이 데이터는 자치구별로 어느 유형의 토지가 어느 정도 규모로 보상 대상이 되었는지를 파악할 수 있어, 지역 간 보상 편차 분석, 지가 추정, 도시개발 계획 수립 등 다양한 행정 및 정책적 용도로 활용될 수 있습니다.'
