summary_user: 분양보증사고 가운데 주택도시보증공사가 '피보증인계속사업'(회생 결정 후 사고 업체가 공사를 계속하는 방식)으로 보증이행을 정한 사업장을 한 건씩 담은 파일로, 사고업체·사업장명·세대수·사고일자·이행상황·공사이행주체를 담으며 전국 범위이고 용량 1.6KB 남짓의 작은 목록이다. 아파트 분양계약자가 '내가 계약한 단지의 시행사가 보증사고 후 기업회생을 거쳐 공사를 이어가는 곳인가'를 확인하는 데 쓴다. 사고 사업장명(hug_guarantee_site)을 키로 주택도시보증공사의 다른 보증사고·분양보증 사업장 자료와 이어 쓰며, 별도의 지역·법정동 코드는 없다.
description_portal: '1) 내용: 분양보증사고 중 "피보증인계속사업" 이라는 방법으로 보증이행을 결정한 사업장 및 업체 내역입니다.★ 피보증인계속사업은 사업 주체의 부도,파산 등으로 보증사고가 난 후 법원의 법정관리를 거쳐 회생 결정이 난후 그 사고 업체가 계속해서 공사를 진행하는 이행방법2) 효과: 피보증인계속사업으로 결정된 아파트 사업장의 업체가 기업회생이라는 절차를 거친것으로 볼 수 있으므로 아파트 분양계약자 입장에서는 참고할 수 있는 정보가 될것으로 판단됨.3) 기타: 하자보수보증과 분양보증은 다른 성격의 보증으로 각각 보증별로 자료를 공개하는 것이 효율적임'
