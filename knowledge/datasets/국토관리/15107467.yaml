summary_user: 서울특별시 중랑구의 2021년도 용도지역 현황을 대분류(주거·상업·공업·녹지지역)와 중분류(제1종전용주거지역, 준공업지역, 보전녹지지역 등)별로 행정동마다 면적(제곱미터)과 합계로 집계한 작은 표(csv, 2357 bytes)입니다. 중랑구 어느 동에 주거지역이나 녹지지역이 얼마나 넓게 지정돼 있는지 비교하려는 주민·분석가가 동별 토지이용 구성을 파악하는 데 쓴다. 행정동이 열 이름으로 들어가 있고 전역 조인 키나 행정코드가 없으므로, 다른 동 단위 통계와 이으려면 동 이름을 행정동 코드에 직접 매핑해야 한다.
description_portal: 서울특별시 중랑구의 2021년도 용도지역 현황을 제공합니다. 이 데이터의 카테고리는 지역개발, 지역및도시에 해당합니다. 중랑구 용도지역 현황의 주요제공 항목으로는 대분류,중분류,행정동 자료입니다. 대분류로는 주거지역, 상업지역, 공업지역, 녹지지역이 있습니다. 중분류로는 제1종전용주거지역, 제2종전용주거지역, 전용주거지역 미분류, 준주거지역, 일반공업지역, 준공업지역, 보전녹지지역 등이 있습니다. 자세한 사항은 데이터를 다운로드 받아서 내용을 확인하여 주시기 바랍니다. 감사합니다.
