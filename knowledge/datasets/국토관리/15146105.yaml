summary_user: 서울특별시 폐쇄말소된 건축물대장에 딸린 오수정화시설 기록을 건별로 담으며, 대지위치·자치구·법정동·지번·도로명주소 요소와 함께 처리 방식(부패탱크방법, 하수종말처리장연결 등), 1인당 처리 용량, 총 용량, 폐쇄·말소 구분과 일자를 포함한다. 분석가나 환경·건축 담당자가 '이 지번의 폐쇄된 건물은 어떤 방식과 규모의 오수 처리 설비를 갖추고 있었나'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 건축물대장 데이터와는 자치구·법정동명과 본번·부번 같은 주소 요소를 이름으로 맞춰 연결해야 한다.
description_portal: 서울특별시 폐쇄말소대장에 등록된 정보입니다. 각 구·동에 위치한 특정 부지의 하수처리 및 오수정화 시설 현황을 나타냅니다. 각 레코드는 부지의 주소, 구(자치구)명, 동명, 지번, 대표 여부, 하수 처리 방식, 1인당 처리 용량(리터 단위), 총 용량(㎥ 또는 리터 단위)을 포함하고 있습니다. 하수 처리 방식에는 ‘부패탱크방법’, ‘하수종말처리장연결’ 등이 있으며, 일부 데이터는 1인당 처리 용량이 비어 있거나 총 용량만 기록되어 있습니다.  이 정보는 건물·부지의 하수 처리 설비 규모 파악, 환경 관리, 시설 유지보수 계획 수립, 환경오염 예방 대책 마련 등에 활용될 수 있습니다.
