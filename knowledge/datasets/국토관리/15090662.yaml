summary_user: 시흥시 지역화폐의 월별 이용 현황을 기준년월 단위로 모바일·지류형으로 나누어 판매금액과 환전액을 담은 집계 파일입니다(csv, 약 6KB). 지역경제 담당자나 분석가가 "시흥시 지역화폐에서 모바일 비중이 해마다 얼마나 늘었고, 판매 대비 환전 규모는 어떻게 바뀌었나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 시군의 지역화폐 현황이나 소상공인·상권 통계와는 기준년월과 시군구 이름을 맞춰 이어 쓴다.
description_portal: 본 데이터는 시흥시 내 지역화폐의 이용 현황에 대한 정보를 제공합니다. 수록된 정보는 기준년월을 기준으로 모바일 및 지류형 지역화폐의 판매금액과 환전액으로 구성되어 있습니다. 이를 통해 지역화폐의 유통 규모, 사용 추이, 소비자 이용 형태 등을 파악할 수 있으며, 지역경제 활성화 정책 수립 및 효과 분석에 기초자료로 활용이 가능합니다. 모바일과 지류형 간의 이용 비율 변화, 월별 판매 및 환전 동향을 비교함으로써 디지털 결제 도입 확대에 대한 실증적 분석도 가능합니다. 본 데이터는 소상공인 지원 정책 수립, 유통관리 방안 마련, 주민 참여 확대 전략 수립 등 지역 경제 선순환 구조 구축을 위한 실효성 있는 자료로 활용될 수 있습니다.
