summary_user: 곡성군 도시계획정보시스템(UPIS)의 개발행위허가 현황을 담은 파일로, 개발행위허가 필지와 허가제한지역 도형별로 테이블명·라벨·면적·길이·도형 생성일시를 기록한 건별 자료이며 범위는 곡성군 한 시군구다. 곡성군에서 토지를 개발하려는 사업자나 분석가가 어느 필지에 개발행위허가가 났는지, 어디가 허가제한지역으로 묶였는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(필지번호·법정동코드 등)가 없어 다른 데이터와는 라벨 이름 매칭이나 같은 기관 자료끼리만 이어 쓴다.
limits: 필지 고유번호나 행정코드가 없어 지적·토지이용 데이터와 바로 결합하지 못하고, 실측 범위는 곡성군 한 곳이다. 명세상 주기는 연간·이벤트성이므로 현재 허가 상태를 실시간으로 반영한다고 보면 안 된다.
