summary_user: 서울시 도로를 굴착해 공사할 계획이 잡힌 구간(전기·가스·수도·통신·하수도·난방관 등 지하 매설물 설치·보수·교체용)의 위치를 공간정보로 담으며, 좌표계는 EPSG:5186, 인코딩은 windows-949이고 서울 열린데이터광장(data.seoul.go.kr)에서 제공된다. 시민·사업자·분석가가 '우리 동네나 공사 예정 부지 주변에 언제 도로 굴착 공사가 계획돼 있는가'를 확인하거나 매설물 공사 일정을 조율할 때 쓴다. 실측 컬럼에는 예정지 일련번호(EXCA_PLDS_SN)와 연도(YR) 정도만 있고 전역 조인 키가 없어, 다른 데이터와는 공간 중첩이나 이름·기관 코드 매핑으로만 연결한다.
