description_portal: 부산도시공사에서는 시민 주거안정을 위해 다양한 유형의 공공임대주택을 공급 및 관리하고 있습니다.부산도시공사에서 제공하는 임대주택 유형으로는 영구임대, 50년 공공임대, 국민임대, 통합공공임대, 행복주택, 재개발임대, 매입임대가 있습니다.해당 데이터는 다음과 같이 제공합니다  1. 통합공공임대주택, 행복주택, 재개발임대 주택 상세 정보와 표준보증금, 표준임대료  [2026년 글로벌 데이터 해커톤 행사 준비 데이터]   ※ 임대조건에 따라 보증금과 임대료는 상이할 수 있습니다2. 매입임대 주택의 상세정보와 평균 표준 보증금과 평균 표준 임대료 [2026년 글로벌 데이터 해커톤 행사 준비 데이터]   ※ 매입임대 주택의 경우, 보증금 및 임대료는 평균치, 유사치로 변경하였으며, 매입주택의 경우도 임대조건에 따라 상이할 수 있습니다.3. 영구임대주택, 50년공공임대, 국민임대의 일반 주택정보 [기존 등록된 데이터]해당 데이터를 통해 공공임대 보증금과 임대료 관련 연구 및 임대주택 관련 서비스 개발에도 활용 할 수 있습니다.
