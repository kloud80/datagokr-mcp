description_portal: '이 공공데이터는 경상남도 사천시의 주택보급률과 관련된 핵심 통계를 연도별로 집계하여 제공하는 자료입니다. 이는 사천시의 주거 안정 수준을 파악하고, 주택 공급 및 주거 복지 정책 수립을 위한 기초 자료로 활용됩니다.연별: 데이터가 측정된 기준 연도를 나타내어 시계열적인 변화 추이를 분석할 수 있게 합니다.일반가구수: 주택을 소유하거나 점유하고 있는 일반 가구의 총수를 나타냅니다.주택수 합계: 사천시 내에 존재하는 모든 형태의 주택 총수를 집계합니다.단독주택 및 다가구주택: 단독 형태 주택의 수를 분류합니다.아파트, 연립주택, 다세대주택: 공동주택의 종류별 세부 주택 수를 분류하여 주거 형태별 구성을 보여줍니다.주택보급률: 주택수 합계를 일반가구수로 나누어 계산한 비율로, 주거 안정 수준을 나타내는 핵심 지표입니다.이 현황 자료는 사천시의 주택 시장 동향 파악, 주거 환경 개선 사업, 그리고 미래 주택 수요 예측에 매우 중요한 기반 정보로 활용됩니다.'
