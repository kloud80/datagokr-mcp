description_portal: '부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 민원 신청 정보(급수공사_신청승낙) 자료입니다.급수공사비 선납 후 공사시행이 가능합니다.신규,구경 변경 : 정액급수공사비이동 : 실공사비공동주택(오피스텔) : 세대별 적용(세대별 정액제 적용)일반주택 : 구경별 정액제 적용모든 온라인 민원신청은 공인인증서가 있어야 이용가능합니다.처리기간 : 5일신청 -> 지역사업소 접수 -> 현장조사 -> 관련부서협의 -> 설계 -> 결재 ->급수공사통지 및 공사비납부통보'
