summary_user: 여수시에서 착공신고가 처리된 건축물을 건별로 담은 파일로, 신축·증축·대수선·용도변경·가설건축물 같은 건축 구분과 대지위치, 연면적·증축연면적, 허가일·착공처리일, 주용도·부속용도를 기록한다. 지역 개발 흐름의 선행 지표로서 분석가나 사업자가 '여수시에서 최근 어떤 용도의 건물이 어디서 얼마나 착공됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 건축물대장·인허가 정보 등 다른 데이터와는 대지위치 주소를 이름으로 맞춰 연결해야 한다.
limits: 고유 식별 키(건축물관리번호·필지 코드 등)가 없으므로 다른 데이터와 정확히 연결하려면 주소 문자열 매칭에 의존해야 한다. 범위는 여수시 한 곳이라 다른 시군구와 비교하려면 별도 데이터를 모아야 한다.
