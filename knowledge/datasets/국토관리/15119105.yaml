summary_user: 수원시에서 도시·군관리계획으로 결정된 용도지구(경관·고도·방화·취락지구 등)를 지구 종류와 세분별로 묶어 지구 수와 결정면적을 담은 시 단위 집계표이며, 파일 크기가 421바이트에 불과한 소규모 CSV입니다. 도시계획 분석가나 연구자가 '수원시에 경관지구·고도지구가 몇 곳, 얼마의 면적으로 지정돼 있나'를 확인하거나 다른 시와 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 용도지구 이름이나 기준연도를 맞춰 붙이거나, 같은 수원시의 용도지역·지구단위계획 현황과 나란히 놓고 보는 방식으로 이어 쓴다.
description_portal: 도시ㆍ군 관리 계획으로 결정된 수원시 내 용도지구(경관지구,취락지구,방화지구,고도지구 등) 별 현황 정보입니다. 국토의 계획 및 이용에 관한 법률 제2조에서는  정의하는 용도지구는 "토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역의 제한을 강화하거나 완화하여 적용함으로써 용도지역의 기능을 증진시키고 미관·경관·안전 등을 도모하기 위하여 도시관리계획으로 결정하는 지역"으로 정의하고, 국토의 계획 및 이용에 관한 법률 제37조를 근거로 결정합니다. 제공하는 데이터는 데이터기준일자, 결정면적, 지구의 개수 그리고 세분현황 등의 정보를 제공합니다.
