summary_user: 구리시 내 건축물 중 「기계설비법」에 따른 기계설비 성능점검 대상 시설을 건물 단위로 정리한 목록으로, 건축용도·건물명(소유자명)·도로명주소·연면적을 담는다. 건물 관리자나 시설관리 사업자가 "우리 건물이 기계설비 성능점검 대상인가"를 확인하거나, 분석가가 구리시 내 점검대상 건물의 용도별·규모별 분포를 볼 때 쓴다. 전역 조인 키는 없으므로, 건축물대장 등 다른 데이터와는 도로명주소나 건물명을 맞춰 연결해야 한다.
description_portal: 「기계설비법」 제17조 및 「기계설비 유지관리기준」 제11조에 따라, 건축물 내 기계설비의 성능점검 실시 대상이 되는 시설들의 현황 정보를 제공합니다. 즉, 기계설비 성능 점검 대상 건축물 및 설비 목록을 정리한 데이터입니다.데이터 자체 파일에는 통상적으로 다음과 같은 항목들이 포함되어 있을 것으로 보이며, 공공데이터포털의 다른 시·군 유사 데이터 구조와 비교하면 다음과 같을 가능성이 큽니다 (실제 구리시 파일을 다운로드하면 정확한 항목 확인 가능):대상 건축물명주소, 기계설비 종류, 면적 또는 규모 기준 정보, 점검 대상 여부 및 관련 표준 정보
