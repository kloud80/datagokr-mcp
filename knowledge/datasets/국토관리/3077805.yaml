summary_user: 서울특별시 용산구에 등록된 공장을 한 건씩 담은 명부 파일로, 공장마다 회사명·도로명 대표주소·업종명·등록일·사업유형을 담는다(CSV 약 7KB 규모의 시군구 단위 자료). 용산구 안에 어떤 업종의 공장이 어디에 언제 등록됐는지 알고 싶은 주민·사업자·지역 산업 분석가가 업종 구성과 입지 분포를 살피는 데 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어서, 다른 데이터와는 회사명·도로명주소 문자열 매칭이나 주소 지오코딩으로만 연결한다.
description_portal: '서울특별시 용산구의 등록공장 현황에 대한 데이터입니다. 이 데이터는 각 공장의 구체적인 위치 정보를 포함하고 있으며, 시도명, 시군구명, 행정동명 등 세부 행정 구역이 포함되어 있습니다. 또한, 각 공장의 회사명, 업종명(예: 화장품 제조업, 컴퓨터 제조업, 방송장비 제조업 등)과 같은 기본 정보도 함께 제공되어 공장의 성격과 산업 분야를 파악할 수 있습니다.이 데이터를 통해 시민과 기업은 지역 내 산업시설의 현황과 분포를 파악할 수 있으며, 행정기관은 이 정보를 바탕으로 공장의 입지 특성, 업종 구성, 산업 활동의 밀도와 특성 등을 분석함으로써 도시계획 수립, 산업 육성 전략 개발, 환경 관리 정책 수립 등 다양한 분야에 정책적으로 활용할 수 있습니다'
