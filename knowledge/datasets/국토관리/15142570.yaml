summary_user: 여수국가산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일(CSV, 약 36KB)로, 회사명·업종명·공장 지번주소·전화번호와 데이터기준일을 담는다. 구직자나 영업 담당자가 '여수산단에 어떤 업종의 회사가 어디에 입주해 있고 연락처는 무엇인가'를 확인하거나, 분석가가 단지 내 업종 분포를 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어서, 공장 등록 자료나 산단 통계와는 회사명·공장 지번주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전라남도 여수시에 위치한 여수국가산업단지 내 입주한 기업의 현황 정보를 제공하는 데이터입니다. 본 데이터는 입주업체의 회사명, 업종명, 공장 주소, 전화번호 등의 정보를 포함하고 있으며, 산업단지 내 기업 분포와 업종 현황을 파악할 수 있습니다. 기업 정보 검색, 산업 분석, 지역 산업 생태계 연구, 기업 데이터베이스 구축, 투자 및 비즈니스 발굴 등 다양한 목적으로 활용할 수 있습니다. 또한 여수국가산업단지 입주기업의 기본 현황을 제공함으로써 산업단지 운영 현황 파악과 기업 간 협력 네트워크 구축, 지역경제 및 산업 정책 수립을 위한 기초자료로 활용될 수 있습니다.
