description_portal: 한국토지주택공사가 공급하는 상가에 대한 공고명, 공고종류, 공급종류, 상가명, 면적, 예정가격 등의 상가 공급 및 대금납부정보를 제공합니다.첫 컬럼인 "지역본부"는 상가를 공급하는 한국토지주택공사의 지사(지역본부)의 이름입니다. 계약금납부기한내용은 알반적으로 계약 체결시 납부하도록 안내되며중도금납부기한내용 입점시, 계약일로부터 3개월 이내, 계약체열기간 종료로부터 3개월 이내로 구성됩니다.잔금납부기한내용 중도금에 납부기한에 따라 입점지정기간 내 혹은 입점시로 구분됩니다.
