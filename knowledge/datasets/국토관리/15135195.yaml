description_portal: '이 데이터는 광주광역시 서구에서 발급한 건축 허가 건수 및 면적(단위: m²)에 대한 연도별 현황을 제공합니다. 구체적으로는 ▲신축 건축물의 허가 건수 및 연면적, ▲증축·개축·이전·대수선 건축물의 허가 건수 및 면적, ▲용도변경된 건축물의 허가 건수 및 면적 등이 포함되어 있습니다.해당 데이터는 건축행정 절차에서 필수적인 근거 자료로 활용되며, 지역 내 건축 활동의 규모, 개발 성격, 도시계획의 방향성, 용도별 개발 패턴 등을 파악하는 데 유용합니다. 특히 건축허가 건수는 도시개발 활력도를 반영하는 핵심 지표로, 주거 수요 예측, 상업지역 개발 가능성 평가, 기반시설 수립 계획 등과 연계해 행정·정책적 의사결정의 기초자료로 활용됩니다.또한 분류별 허가 현황을 통해 신축과 용도변경, 개보수 등의 건축행위 유형별 비율을 비교·분석할 수 있으며, 연도별 변화 추이를 통해 도시의 성장 경향 및 재개발·정비 수요를 예측하는 데에도 활용 가능합니다.'
