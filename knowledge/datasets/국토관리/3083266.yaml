summary_user: 서귀포시 마을회관을 한 곳씩 담은 파일 데이터로, 읍면동·마을회관명·주용도·소유자·도로명주소·위도·경도를 시설별로 기록한다(CSV 약 18KB). 주민이나 지역 활동가가 "우리 동네 마을회관은 어디 있고 누가 소유하며 어떤 용도로 쓰이나"를 확인하거나, 분석가가 읍면동별 공동체 시설 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 읍면동 이름이나 도로명주소 매칭, 위도·경도 좌표 기반 공간 결합으로 잇는다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘마을회관 정보’ 데이터는 지역 공동체의 사회적 기반을 확인하고 주민 복지를 증진하기 위한 공공자원입니다.이 데이터는 읍·면·동 단위의 마을회관명과 주요 용도, 소유 주체, 도로명 주소, 위도·경도 좌표 등을 포함합니다.이 정보를 통해 커뮤니티 활동 공간 분석, 지역 행사·교육 프로그램 기획, 공공시설 접근성 평가, 교통 및 인프라 연계 정책 수립 등 다양한 목적에 활용할 수 있습니다.행정기관, 연구단체, 커뮤니티 조직 등에서 공간 기반의 지역개발 전략을 수립하거나 마을 복지 증진 프로젝트에 활용하기 적합한 실무 중심의 데이터입니다.
