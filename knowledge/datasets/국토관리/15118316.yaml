summary_user: 전라남도(전남광주통합특별시) 안에 있는 공공측량업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·대표자명·사무소 주소·사무소 전화번호를 담는다. 도로·택지개발 같은 공공사업의 측량을 맡길 수 있는 지역 업체가 어디에 있고 어떻게 연락하는지 찾는 발주 담당자나 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 사무소 주소를 이름·주소 매칭으로 이어 써야 한다.
description_portal: "- 전라남도 내 공공측량 업체의 업체명, 사무소 전화번호, 사무소 주소, 대표자 명 등을 조회할 수 있는 공공데이터 파일입니다.- \"공공측량업체\"는 **국가나 지자체가 발주한 공공사업(도로, 철도, 택지개발, 도시계획 등)**에 필요한 측량을 수행할 수 있도록 국토교통부에 등록된 업체를 말합니다.- 이는 일반측량업체와는 구별되며, 보다 엄격한 등록 기준을 충족해야 공공측량을 수행할 수 있습니다.- 공공측량업체란?- 「측량·수로조사 및 지적에 관한 법률」 제26조에 따라 국토교통부장관에게 등록한 측량업체- 국가 및 공공기관이 시행하는 공공측량을 수행할 수 있는 자격을 가진 업체- 보통 '일반측량업' 등록 이후, 공공측량성과심사능력 등록까지 완료한 상태"
