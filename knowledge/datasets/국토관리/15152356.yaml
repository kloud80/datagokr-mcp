summary_user: 한강홍수통제소의 예측 강우량을 바탕으로 행정구역(행정구역코드)·시각(년월일시분)별 현재, 10분, 30분, 60분, 180분 누적 강우량을 담은 파일로, 포털에는 업로드 용량 제한 때문에 샘플 100건만 올라 있다(약 5KB csv). 분석가나 지자체 재난 담당자가 "앞으로 1~3시간 동안 우리 시군구에 비가 얼마나 쌓일 것으로 예측되는가"를 확인하거나 단기 강우 예측 추이를 분석하는 데 쓴다. 전역 조인 키는 없고, 행정구역코드를 행정구역 코드표나 같은 기관의 다른 홍수 예보 자료와 이름·코드로 맞춰 이어 쓴다.
description_portal: '한강홍수통제소 단기 예측 강우량 누적은 예측 강우량을 토대로 행정구역별 누적 강우량(현재, 10분, 30분, 60분, 180분)을 제공하며, 각 행정구역별 강우 추이를 분석해 일별 강우량 및 누적 강우량을 체계적으로 관리할 수 있다. 또한 예측 강우량 정보를 지속적으로 업데이트하여 변화 가능성을 신속히 파악 할 수 있다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
