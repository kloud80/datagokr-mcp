description_portal: 창원시 상수도사업소에서는 깨끗하고 안전한 수돗물 생산·공급, 공정별 철저한 수질관리로 고품질 수돗물 생산을 위한 정보를 제공하고 있습니다. 공공데이터 열람 신청에 의한 창원시 상수도사업소에서 취수한 낙동강 본류의 2011~2020년도 10년간 칠서취(정)수장, 대산취(정)수장, 석동취(정)수장 월별 취수량 자료(생활용수, 농업용수, 공업용수 모두 포함)와 해당 취(정)수장의 주소입니다.취수장별 비교를 통해 취수원별 수량 차이를 분석할 수 있고, 연도별·월별 취수량 데이터를 분석해 계절적 수요 패턴을 파악하여 물 수요 예측에 활용하고 물 공급 안정화에 기여할 수 있습니다.
