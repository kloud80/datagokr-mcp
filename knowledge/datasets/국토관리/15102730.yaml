summary_user: 충청남도 지역 공사에서 발생하거나 필요한 건설토석 정보를 공사(항목)별로 담은 API로, 공사명·위치·발주자·시공자·토석 종류와 용도·좌표, 배출 내역(배출량·일자·사유), 첨부 사진·파일 정보를 건별로 제공한다. 건설사업자나 현장 담당자가 '우리 현장 근처 충남 공사장에서 쓸 수 있는 흙·돌이 나오는가'를 찾아 토석 재활용·반입처를 정하는 데 쓴다. 다른 데이터와 묶을 전역 조인 키는 없어 공사명·주소 같은 이름 매칭이나 좌표(X·Y)로만 연결하고, 같은 API 안에서는 건설항목 일련번호(BUILD_ITEM_SEQ)로 배출·첨부 정보를 공사 기본정보에 붙인다.
limits: 범위가 충청남도에 한정되어 다른 시도의 토석 정보는 없고, 외부 데이터와는 공통 코드 없이 이름·주소·좌표로만 맞춰야 한다. 개발계정은 하루 10,000회 호출로 제한된다.
