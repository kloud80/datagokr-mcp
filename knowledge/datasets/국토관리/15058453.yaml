summary_user: 공동주택관리정보시스템(K-apt)에 가입한 전국 아파트 단지별로 법정동주소·분양형태·난방방식·연면적·동수·세대수 같은 기본정보와 경비·청소·소독 관리방식, 주차·승강기·CCTV·전기차 충전기, 지하철·버스 거리와 주변 편의·교육시설 같은 상세정보를 단지 한 건씩 담는다. 이사를 고민하는 국민이나 부동산 분석가가 '이 단지는 몇 세대에 지하주차가 몇 대이고 역까지 얼마나 걸리나', '경비를 위탁하는지 직영하는지'를 확인하는 데 쓴다. 단지코드(kaptCode)를 K-apt 관리비·장기수선·입찰 데이터와 실거래·공시가격·청약 단지를 잇는 매핑 키로 쓰고, 법정동코드와 법정동주소로 행정구역·주소 기반 데이터와 연결한다.
limits: 가입 단지만 담으므로 K-apt에 가입하지 않은 공동주택은 빠진다. 검증 호출에서 2행만 받아 전체 규모와 갱신 주기는 확인되지 않았고, 개발계정은 하루 5,000회로 호출이 제한된다.
