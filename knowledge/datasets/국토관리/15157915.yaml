summary_user: 강릉 오봉저수지의 일자별 저수위·저수율과 게이트·하천 방류량, 농업용수·생활용수 공급량을 담은 단일 저수지 운영 기록 파일이다(포털 설명상 2008~2025년, CSV 약 257KB). 가뭄철 강릉 지역 저수율이 과거 같은 시기보다 얼마나 낮았는지, 생활용수 공급이 방류와 함께 어떻게 변했는지 살피는 분석가·주민의 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자 기준으로 강수·기상 자료 등과 맞추거나 저수지 이름으로 농어촌공사 저수지 저수율 자료와 연결한다.
description_portal: 오봉저수지 방류량 데이터를 제공합니다.(저수위, 저수율, 방류량, 농업용수, 생활용수 공급량 등)[제공된 데이터 관련 안내]1. 오봉저수지 방류량 자료는 2008년부터 보존되어 있기에 이후 시점의 데이터를(2008년~2025년) 공공데이터 등록을 통해 제공합니다.2. 공공데이터 활용 목적에 부합하도록 영리가 아닌 참고 목적으로 활용하시기 바랍니다.3. 기타 문의사항이 있는 경우 한국농어촌공사 강릉지사(070-4484-7660, 033-650-3271)로 연락하여 주시기 바랍니다.
