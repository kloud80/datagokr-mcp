summary_user: 서울특별시 관악구에서 건축허가가 난 건축물을 건별로 담은 파일로, 대지위치·연면적·주용도·부속용도와 허가일·착공일·사용승인일 및 각 예정일을 담는다(CSV 약 511KB). 관악구에서 최근 어느 동네에 어떤 용도의 건물이 허가·착공됐는지, 허가부터 사용승인까지 얼마나 걸리는지 보려는 주민·부동산 사업자·지역 개발 분석가가 지역 개발 흐름의 선행 지표로 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소) 문자열 매칭이나 같은 구 단위로만 이어 쓸 수 있다.
description_portal: 본 데이터는 서울특별시 관악구에서 건축허가가 이루어진 대상의 행정 절차 정보를 체계적으로 정리한 자료로, 건축물이 어느 위치에서 허가되었는지, 공사가 언제 착공되고 사용승인에 이르렀는지 등 주요 진행 일정을 확인할 수 있도록 구성되어 있습니다. 또한 주용도와 부속용도 정보를 통해 건축 목적의 기본적 성격을 파악할 수 있어 지역 내 건축동향을 이해하는 데 참고자료로 활용할 수 있습니다. 행정처리 흐름을 날짜 단위로 제공하고 있어 건축 절차의 단계별 진행 현황을 비교·분석하는 데에도 의미가 있습니다.
