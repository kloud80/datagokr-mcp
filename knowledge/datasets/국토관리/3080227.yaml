summary_user: 경기도 양주시에 등록된 공장을 한 건씩 담은 명부로, 회사명·지번 소재지·법정동·종업원 수·생산품·전화·팩스번호와 데이터 기준일자를 담는다(CSV 파일 약 36만 바이트). 양주시에서 어떤 품목을 만드는 공장이 어느 동에 몰려 있고 종업원 규모가 어떤지 확인하려는 지역경제 분석가나 협력처를 찾는 사업자가 쓴다. 사업자번호·산업분류코드·필지고유번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 법정동·지번 주소를 맞춰서만 이어 쓴다.
description_portal: 본 데이터는 경기도 양주시 내 등록된 공장의 현황을 담고 있으며, 「산업통상자원부 고도화」 사업의 일환으로 제공된다. 데이터에는 각 공장별 회사명, 주소, 종업원 수, 주요 생산품, 전화번호, 팩스번호 등의 기본 정보가 포함되어 있어 산업 구조 및 기업 활동을 체계적으로 관리할 수 있다. 특히 생산품과 종업원 수 데이터를 통해 산업별 인력 분포와 생산 현황을 파악할 수 있으며, 이를 기반으로 산업 발전 계획 수립과 기업 지원 정책 마련에 활용 가능하다. 양주시 내 공장의 분포 현황은 지역 경제 분석, 투자 유치 전략, 일자리 창출 정책 등에 중요한 자료가 되며, 공공기관뿐 아니라 민간 기업과 연구자에게도 유용하다. 또한 전화번호 등 기본 연락처 정보는 기업 간 협력이나 행정적 관리에 활용될 수 있으며, 정기적인 갱신을 통해 최신성을 유지하여 신뢰도 높은 데이터베이스로 기능한다. 이 데이터는 산업 연구, 경제 정책, 기업 경영 분석 등 다양한 분야에서 핵심적인 기초 자료로 쓰일 수 있다.
