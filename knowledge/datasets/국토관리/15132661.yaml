description_portal: 충청남도 천안시 도시계획정보시스템(UPIS)의 불허용도 현황으로 현황도형 관리번호, 용도설명, 비고의 항목을 제공합니다.도시계획정보시스템(UPIS)은 도시·토지·시설·경관 등 도시계획 전반의 정보를 통합 관리하기 위해 구축된 시스템입니다. 도시의 공간 구조와 이용 실태를 분석할 수 있도록 다양한 계획·관리 요소를 담은 정보시스템이며, 각종 공간정보와 행정정보를 체계적으로 기록하여 도시관리·정비·개발계획 수립을 지원합니다. 이의 중장기개방계획에 따라서 불허용도 테이블을 데이터 개방하였습니다.
