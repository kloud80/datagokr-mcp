summary_user: 서울시가 게시하는 도시계획 시행계획 열람공고를 공고 한 건 단위로 담으며, 공고기간·열람장소·담당부서·연락처·안건명·공고내용과 첨부파일 정보(파일명·크기·내려받기 주소)를 함께 제공한다. 주민이나 사업자가 '우리 동네 도로·공원 같은 도시계획시설이 언제 집행되고, 의견은 어디서 언제까지 낼 수 있나'를 확인하는 데 쓴다. 다른 데이터와 맞물리는 공통 조인 키는 없어서, 안건명이나 담당부서 이름으로 서울시의 다른 도시계획 결정·고시 자료와 직접 맞춰 이어 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr)에서 받는 별도 인증키가 있어야 호출되며, 공공데이터포털 활용신청과는 따로 받아야 한다. 위치 좌표가 없는 비공간 데이터이고 전역 조인 키가 없어 지도나 필지 단위 데이터와 바로 연결되지 않는다.
