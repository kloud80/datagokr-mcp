description_portal: '도시계획관련 의견청취 등을 위한 열람공고정보를 제공합니다.*용어설명도시계획 시행계획은 이미 결정·고시된 도시관리계획(예: 도로, 공원, 주차장, 녹지, 학교 부지 등)을 실제로 집행·구현하기 위해 수립하는 구체적 실행계획, 즉  도시계획이 ‘설계도’라면, 시행계획은 ‘시공 도면 및 공사 실행 계획’에 해당- 법적 근거  : 「국토의 계획 및 이용에 관한 법률」 제88조~제92조 등 도시관리계획으로 결정된 사항(예: 기반시설 설치, 도시개발사업, 도시환경정비사업 등)에 대해 실제 시행 단계에서 필요한 절차를 규정※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
