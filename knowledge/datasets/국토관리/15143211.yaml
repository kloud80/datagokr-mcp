description_portal: 충청남도 서산시에서 제공하는 본 데이터는 도시계획정보시스템 내 용도지구에 관한 메타데이터이다. 본 자료는 시스템명, 논리데이터베이스명, 물리데이터베이스명, 영문테이블명, 한글테이블명, 영문컬럼명, 한글컬럼명 등 7개 항목으로 구성된다. 용도지구는 토지의 효율적 이용과 공공 목적 실현을 위해 특정 규제가 적용되는 지역이며, 경관지구, 방재지구, 개발진흥지구 등이 있다. 본 데이터는 지구별 규제와 목적을 이해하는 데 도움이 되며, 도시계획 수립과 행정업무에 활용할 수 있다. 메타데이터 형식으로 제공되어 도시계획정보시스템 구조 파악과 정보 활용에 기여한다. 정책 수립, 공간정보 분석, 민간 활용 등 다양한 분야에서 기초자료로 사용될 수 있다.
