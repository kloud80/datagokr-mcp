description_portal: '"생활권 정보"는 주민 누구나 지역에 상관없이 기본적인 삶의 질을 보장받을 수 있도록 설계된 공간 개념으로, 주민 일상생활의 중심이 되는 도시, 농어촌 중심지(읍·면), 그 배후 마을까지 포괄하는 통합적 정보체계를 말합니다. 이는 기초 인프라, 일자리, 교육, 문화, 복지 등의 핵심 서비스가 주민에게 불편 없이 제공될 수 있도록 설정된 권역 단위로, 주민과 지자체가 협력하여 중심도시-농어촌중심지-마을 간의 유기적인 연계를 바탕으로 구성됩니다. 생활권은 인구 규모, 지리적 특성, 공공 및 상업 서비스의 분포 등을 고려하여 △중추도시생활권 △도농연계생활권 △농어촌생활권 △수도권시범생활권의 네 가지 유형으로 구분됩니다. 각 유형은 지역의 특성과 기능에 따라 차별화된 발전 전략이 적용되며, 이를 통해 지역 간 균형 발전을 촉진하는 것이 목적입니다. 제공되는 자료에는 해당 생활권의 명칭(행복생활권명), 각 생활권의 상세 설명, 생활권에 포함되는 도시 목록, 그리고 그 생활권이 속한 유형 분류 등의 정보가 포함되어 있어 정책 수립, 지역개발 사업, 주민참여형 지역계획 등에 유용하게 활용될 수 있습니다. 이러한 생활권 정보는 특히 지역주도형 발전을 지원하고, 주민 삶의 질 향상과 지속가능한 지역사회 구축에 핵심적인 기초자료로 기능합니다.'
