summary_user: 서울시 문화재지정구역의 경계를 좌표가 이어진 선형 공간정보로 담은 파일로, 구역별 객체 단위(객체 ID·명칭·관리번호)로 제공되며 좌표계는 EPSG:5174, 인코딩은 windows-949다. 개발·건축을 검토하는 사업자나 도시계획 분석가가 "이 필지 주변에 문화재지정구역 경계가 어디까지 걸쳐 있는가"를 지도에서 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 명칭(NAME)·관리번호(MNG_NO) 매핑이나 공간 중첩으로만 이어 쓴다.
description_portal: 서울시 문화재지정구역(선형) 공간정보 입니다.*용어설명문화재지정구역 선형 공간정보의 의미문화재지정구역을 지도로 표시할 때, 그 구역의 경계를 선형 데이터로 관리한다는 뜻입니다.즉, “문화재지정구역이 어디까지인지”를 좌표값이 연결된 선(Polygon 경계선)으로 저장·관리합니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
