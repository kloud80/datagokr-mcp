description_portal: '부산도시공사에서는 시민의 주거안정을 위한 다양한 유형의 공공주택사업을 지속적으로 추진하고 있습니다. 주요 사업 정보는 각 사업의 명칭을 비롯하여 주택유형(행복주택, 분양주택, 통합공공임대주택 등), 공사 위치(행정구역 기준 구·동 단위), 공급 세대수, 연면적·건축규모 등 규모, 사업기간(사업협약서 기준 년·월), 주택타입 등의 항목으로 구성됩니다. 이를 통해 각 사업의 추진 현황과 세부 내용을 체계적으로 파악할 수 있으며, 향후 공급 예정인 주택의 정보 또한 사전에 확인이 가능합니다. 본 자료는 공공주택 수요자와 정책 담당자 간의 정보 격차를 해소하고, 사업의 투명성과 신뢰성을 높이기 위한 목적으로 제공됩니다. 아울러 주택유형별 특징과 입주 자격, 생활 인프라 여건 등을 함께 고려하여 실수요자 중심의 주택공급이 이루어질 수 있도록 활용될 수 있습니다.부산도시공사_공공주택사업정보부산도시공사에서 추진 중인 공공주택 사업의 주요 정보를 제공합니다.(사업명, 주택유형, 공사위치, 공급세대수, 규모, 사업기간 년월(예정), 주택타입)[데이터 구성 안내]사업명: 해당 공공주택 사업의 고유 명칭사업유형: 행복주택, 분양주택, 통합공공임대주택위치: 행정구역 기반(구·동 단위)공급세대수: 해당 사업의 총 주택 세대 수사업기간: 사업협약서 기반한 기간주택타입추가 궁금하신 사항 또는 문의사항이 있을 경우 부산도시공사 홈페이지를 참고하여 주시기 바랍니다.'
legal_basis_portal: 본 자료는 부산도시공사와 민간사업자 간 체결된 사업협약서를 근거로 수집·정리된 데이터입니다. 사업협약서는 사업의 위치, 규모, 공급 세대수, 추진 일정 등 공공주택사업의 핵심 사항이 명시된 공식 문서로, 해당 정보를 바탕으로 각 사업의 주요 내용을 체계적으로 구성하였습니다. 이로써 공신력 있는 자료를 기반으로 사업현황을 객관적이고 일관성 있게 전달할 수 있습니다.
