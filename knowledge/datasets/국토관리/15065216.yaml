summary_user: 전국 시도·구군에서 운영 중인 공공하수처리시설의 찌꺼기(슬러지) 처리시설을 시설 1곳당 한 행으로 정리한 현황 파일로, 처리방식(소각·건조·자원화 등), 시설용량(톤/일), 연간처리량(톤/년), 일평균 가동시간, 연중 가동일, 가동률을 담는다. 지자체·환경 분야 분석가가 "우리 지역 하수찌꺼기 처리시설은 용량 대비 얼마나 가동되고 있으며 어떤 방식으로 처리하는가"를 지역별로 비교하는 데 쓴다. 전역 조인 키가 없어 하수처리장 원장이나 방류수 수질 데이터와는 시도·구군 이름과 시설명을 맞춰 연결해야 한다.
description_portal: 공공하수처리시설 찌꺼기처리시설 현황 데이터는 전국 시도 및 구군에서 운영 중인 찌꺼기 처리시설의 현황을 정리한 자료입니다. 시설명, 처리방식(소각·건조·자원화 등), 시설용량(톤/일), 연간 처리량(톤/년), 일평균 가동시간, 연중 가동일, 가동률(%) 등의 항목이 포함되어 있어 지역별 하수찌꺼기 처리시설의 규모와 운영 실태를 파악할 수 있습니다. 본 자료는 지역별 하수찌꺼기 처리시설의 규모와 운영 수준을 종합적으로 제공합니다. 이를 통해 공공하수처리시설 찌꺼기처리시설 설치 현황과 가동 수준을 확인하고, 향후 유지관리 및 정책적 검토에 참고할수 있습니다.
