summary_user: 보령시 보령사랑상품권(지역화폐) 가맹점을 한 곳당 한 행으로 상호명·업종명·소재지주소·가맹점유형과 함께 담은 건별 목록이며, 범위는 보령시 한 개 시군구이고 CSV 파일(약 940KB)로 받는다. 보령 시민이나 방문객이 '내 동네에서 보령사랑상품권을 쓸 수 있는 음식점·마트가 어디인가'를 찾거나, 분석가가 업종별·지역별 가맹점 분포를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 소재지주소를 지오코딩하거나 상호명·업종명을 매핑해 붙여야 한다.
description_portal: 지역경제 선순환 구조 구축과 소상공인 매출 증대를 위한 지역상품권 활성화 정책 확산, 코로나19 등 경제위기 상황에서 지역 소비 촉진과 자영업자 지원을 위한 지역화폐 도입 확대, 그리고 대형마트와 온라인 쇼핑몰 이용 증가로 침체된 전통상권 회복과 골목상권 활성화 필요성 증대에 따라 보령시는 보령사랑상품권 가맹점 현황을 체계적으로 관리하고 있습니다. 보령사랑상품권은 지역 내에서만 사용 가능한 지역화폐로서 지역 소비를 촉진하고 지역경제 활성화에 직접적으로 기여하는 정책수단입니다. 다양한 업종의 가맹점 참여를 통해 시민들의 생활 편의성을 높이고, 소상공인과 자영업자의 매출 증대와 경영안정을 지원하고 있습니다. 가맹점별 업종 분포와 지역별 현황을 분석하여 상품권 이용 활성화 방안과 가맹점 확대 전략 수립에 활용하며, 지역상권 발전과 상생협력 생태계 조성에 중요한 역할을 하고 있습니다. 가맹점의 상세 정보를 원하시는 경우 보령시 누리집(https://brcn.go.kr/prog/franchise/kor/sub05_04_08_03/list.do)을 참고해주시기 바랍니다.
