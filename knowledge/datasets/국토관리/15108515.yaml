description_portal: '충청남도 당진시 공중위생업 현황 안내(데이터 기준일자: 2026년 7월 1일)충청남도 당진시는 시민의 건강과 위생 수준 향상을 위해 관내 공중위생업소의 영업 현황을 체계적으로 관리하고 있습니다.본 자료는 당진시 관내에서 운영 중인 숙박업 등 공중위생업소의 기본 정보를 정리한 것으로, 다음 항목을 포함하고 있습니다.연번업종명업소명영업소 주소(도로명)영업소 주소(지번)관할부서기준일자본 자료는 공중위생업소 현황 파악, 위생관리 및 지도·점검, 관련 행정업무 수행, 지역별 업소 분포 분석, 대시민 정보 제공 등의 기초자료로 활용될 수 있습니다.'
