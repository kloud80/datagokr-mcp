summary_user: 서울특별시 종로구에 등록된 공장을 한 건씩 담은 파일로, 회사명·도로명 공장주소·업종명(생산품)이 공장별로 들어 있다(csv 약 17.8KB). 종로구 안에 어떤 업종의 소규모 제조·가공업체가 어디에 모여 있는지 알고 싶은 분석가나 기업지원·점검 담당자가 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 회사명이나 도로명주소를 맞춰 보는 방식으로만 잇는다.
description_portal: 본 데이터는 서울특별시 종로구에 소재한 공장의 현황을 정리한 자료로, 제조업 기반 산업체의 기본 정보를 제공합니다. 수록 항목에는 회사명, 주소, 업종명(생산품) 등이 포함되어 있으며, 지역 내 생산시설의 입지 분포와 업종 특성을 파악하기 위해 활용됩니다. 해당 자료는 종로구에 등록된 소규모 제조업체, 가공업체 등의 정보를 통해 산업구조 특성, 공간적 밀집도, 지역경제 기여도를 분석하는 데 기초자료로 제공됩니다. 또한 도시계획, 공장 등록 관리, 환경·안전 점검, 기업지원 정책 수립 등 공공행정 전반에 필요한 기초 정보를 포함하고 있어, 행정기관 및 유관기관의 실무 활용도가 높습니다. 산업활동 공간에 대한 정책 설계와 소상공인 산업 기반 파악에도 도움이 됩니다
