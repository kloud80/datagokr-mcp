summary_user: 광주광역시 각 도로관리청이 관리하는 도로현황을 2025년 12월 말 기준으로 모은 엑셀 파일로, 포털 설명에 따르면 도로와 지하차도·교량·터널의 명칭, 기·종점, 연장, 폭, 차로 수, 준공 연도, 설계 하중 같은 제원을 담는다. 분석가나 물류·안전 업무 담당자가 '광주 시내 어느 교량·지하차도에 높이 제한이 있고 내진 설계가 되어 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 도로명·시설물명 같은 이름 매핑이나 같은 기관 코드로만 잇는다.
limits: 공통 조인 키가 없어 다른 도로·시설물 데이터와 정확히 결합하기 어렵다. 범위는 시도 단위의 비공간 자료여서 좌표로 지도에 바로 올릴 수 없고, 2025년 12월 말 한 시점의 현황이다.
