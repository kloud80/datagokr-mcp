summary_user: NABIS(국가균형발전종합정보시스템)가 2005~2024년에 선정·공개한 지역발전사업 우수사례를 사례 1건당 한 행(연도·지자체·제목·상세 URI)으로 담은 전국 단위 파일이다. 지자체 정책 담당자나 연구자가 '도시재생이나 농촌 활력 분야에서 어느 지자체가 언제 우수사례로 뽑혔나'를 찾아 벤치마킹하거나 시기별 우수사업 흐름을 볼 때 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 지자체 이름을 행정구역 코드로 매핑해야 이어 쓸 수 있다.
limits: 파일이 약 3KB로 작고 사례 제목과 URI만 담아, 사업 예산·성과 지표 같은 세부 내용은 URI의 원문을 따로 봐야 한다. 공통 코드가 없어 지자체 이름으로만 연결되므로 명칭 표기 차이에 주의해야 한다.
