summary_user: 경기도 파주시에서 난 건축허가를 허가 건별로 담은 원천 목록으로, 허가번호·소재지·지목·대지면적·건축면적·연면적·건폐율·용적률·구조·주용도·용도지역·주차대수와 허가일·허가취소일을 기록한다(CSV 약 145KB). 파주시에서 어느 지역에 어떤 용도의 건축이 얼마나 허가되었는지를 보고 지역 개발 흐름을 미리 가늠하려는 분석가나 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소(소재지명)나 용도지역 이름을 맞춰 붙이거나 같은 기관 자료끼리 연결해야 한다.
description_portal: '경기도 파주시 건축물허가현황에 대한 공공데이터로, 건축구분, 허가번호, 대지위치, 지목, 대지면적, 건축면적, 연면적, 증축연면적, 건폐율, 용적률, 구조, 취소구분, 허가취소일, 허가일, 주용도, 용도지역, 용도구역, 총주차대수, 총주차장면적 등으로 구성되어 있습니다. 이 데이터셋은 지진, 화재 등 재난 발생 시 위험 건축물 분포 파악 및 안전 점검 및 긴급 대응 계획 수립, 건물 에너지 사용량 예측 및 친환경 건축 인증 제도(예: 그린빌딩) 평가, 주민 의견 수렴 및 커뮤니티 활성화 도구로 지역 주민들이 직접 참여하는 도시재생, 건축물 관리 앱 개발, 도시계획 및 정책 수립, 환경영향 평가, 스마트 시티 및 GIS 기반 서비스 개발 등에 활용될 수 있습니다.'
