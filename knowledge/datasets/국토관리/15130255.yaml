description_portal: '대구광역시 상수도사업본부의 업무추진비 집행 현황은 시민의 알권리 보장과 행정의 투명성 강화를 위해 정기적으로 공개되고 있습니다. 대구광역시 상수도사업본부의 2024년 1월부터 7월까지 본부 및 각 지역사업소와 정수사업소의 업무추진비 집행내역을 엑셀파일로 제공합니다.공개대상은 상수도사업본부 본부 및 각 지역사업소(예: 동부사업소, 중남부사업소, 달성사업소 등), 정수사업소(예: 매곡정수사업소, 죽곡정수사업소 등)입니다. 업무추진비 집행내역은 집행일자, 집행부서, 집행금액, 집행목적, 사용처에 대한 항목들로 구성되어 있습니다.'
