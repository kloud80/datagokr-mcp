summary_user: 서울 행정동(읍면동 단위)별로 기준일·시간대마다 그 지역에 머문 내국인 생활인구 수를 총계와 남녀·5세 단위 연령대별로 담은 집계 데이터이며, 서울시 공공데이터와 통신데이터로 추정한 값이다. 상권 분석가나 창업자가 '특정 동에 평일 저녁 시간대에 20~30대 여성이 얼마나 머무는가'처럼 시간대별 유동 규모와 연령 구성을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 행정동 코드(ADSTRD_CODE_SE)를 행정동 이름·코드 매핑으로 맞추거나 같은 서울시 데이터의 코드로 연결해 쓴다.
description_portal: "서울시가 보유한 공공데이터와 통신데이터로 측정한 특정시점에 서울의 특정 지역에 존재하는 모든인구수 정보 ※ Sheet, Open API는 최근 2개월 데이터만 제공합니다.- 주요내용 : 기준일ID, 시간대구분, 행정동코드, 집계구코드, 총생활인구수, 남/여 연령대별 생활인구수\"해당 데이터의 원본시스템은 '빅데이터 분석 활용시스템 입니다.\"제공부서는 서울특별시 디지털도시국 데이터전략과(02-2133-4273)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다."
