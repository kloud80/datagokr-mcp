summary_user: 청약홈이 일반공급 접수를 대행한 일반분양 단지를 기준으로, 모집공고일이 속한 연월·17개 시도별 청약 신청자 수를 연령대(만 40세 미만, 40대, 50대, 60세 이상)로 나눠 집계한 파일이다. 분석가나 주택 정책 담당자가 "어느 시도에서 30대 이하 청약 수요가 언제 몰렸는가"처럼 지역·연령별 청약 대기 수요의 흐름을 볼 때 쓴다. 전역 조인 키는 없으므로, 다른 청약·분양 통계와는 시도 이름과 연월을 맞춰 연결한다.
limits: 단지별·주택형별 신청 내역이나 경쟁률·당첨 정보는 담지 않고, 시도 단위 연령대별 합계만 있다. 전월 데이터는 이후 변동될 수 있으므로 최근 월 수치는 잠정치로 다룬다.
