summary_user: 서울특별시 건축인허가 대장에 딸린 오수정화시설 정보를 부지(지번)별 건 단위로 담으며, 대지위치·자치구·법정동·본번/부번과 함께 오수정화 방식(부패탱크방법, 하수종말처리장연결 등), 1인당 처리용량, 총 처리용량을 기록한다. 건축물이나 부지의 하수 처리 설비 규모를 확인하려는 분석가·관리자가 '이 지번의 건물은 정화조를 쓰는가, 하수처리장에 바로 연결되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 건축물 데이터와는 자치구명·법정동명·본번·부번 같은 이름·지번 매핑으로만 이을 수 있고, 인허가대장 일련번호(PRMSN_LDGR_SN)는 같은 서울시 건축인허가 계열 데이터 안에서만 연결 후보로 볼 수 있다.
limits: 서울 열린데이터광장(data.seoul.go.kr)에서 받는 외부 데이터라 포털 활용신청과 별개로 별도 인증키(KEY)가 필요하다. 전역 조인 키가 없어 행정구역 코드나 건물 식별번호로 정확히 결합하기 어렵다. 일부 행은 1인당 처리용량이 비어 있고 총 용량만 있으며, 공간좌표는 없다.
