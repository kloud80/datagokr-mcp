description_portal: 이 데이터는 ‘주택 인허가 행위 전유·공용 면적표’로, 주택 건축 인허가 시 각 건축 행위별 전유면적과 공용면적을 구분하여 기록한 자료다. 전유면적은 세대 또는 특정 소유자가 단독으로 사용하는 공간의 면적을 의미하며, 공용면적은 복도, 계단, 엘리베이터홀 등 여러 사용자가 공동으로 이용하는 공간의 면적을 나타낸다. 데이터에는 행위의 구분, 위치 정보(행정구역, 지번, 도로명), 건물 정보(동·호수, 층수), 면적 수치 등이 포함되어 있다. 이 자료는 건축물 설계, 인허가 심사, 사용승인 절차, 재산세 및 취득세 산정, 관리비 부과, 소유권 비율 계산 등에 중요한 역할을 하며, 부동산 거래 시 면적 검증 및 행정 절차의 기초 자료로도 활용된다.
