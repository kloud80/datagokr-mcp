summary_user: 서울시 주택 인허가 건의 행위별로 호·층 단위 전유면적과 공용면적을 구분해 담은 건별 원천 자료로, 대지위치·시군구·법정동·본번/부번 같은 위치 정보와 층 구분·구조·용도·면적(AREA)을 함께 기록한다. 분석가나 사업자가 '특정 지번의 인허가 주택에서 호별 전유면적과 공용면적 비율이 어떻게 되는가'를 확인하거나 관리비·지분 산정의 기초 면적을 검증할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구·법정동 이름이나 본번·부번 지번을 맞추는 방식, 또는 같은 서울시 주택인허가 계열 자료와만 연결한다.
limits: 표준 코드 기반 조인 키가 없어 건축물대장·실거래 등과 정확히 연결하려면 지번·이름 매핑이 필요하다. 호출은 포털 활용신청과 별개로 서울 열린데이터광장(data.seoul.go.kr) 인증키를 경로 파라미터로 넣어야 한다.
