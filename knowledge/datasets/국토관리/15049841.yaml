summary_user: 전국 공업단지별로 공업단지코드·단지명·구분(일반산업단지 등)·주소·행정동코드·지정일자·입주 업체수·분양상태를 한 행씩 담은 시설 제원 파일(csv, 약 159KB)로, 범위는 전국이고 위치는 개별 주소 단위다. 가뭄 분석이나 산업용수 수요 검토에서 특정 지역에 어떤 공업단지가 언제 지정됐고 업체가 몇 곳 입주해 있는지 확인하는 데 쓴다. 공업단지코드(ind_complex_cd)로 같은 기관의 공업단지 관련 다른 데이터와 잇고, 행정동코드로 행정구역 단위 통계와 묶어 볼 수 있다.
description_portal: 'ㅁ 개요 : 가뭄 분석 정보 제공을 위한 공단코드정보, 공단명정보, 관련 업체수 등 전국 공업단지에 대한 시설 제원정보 데이터 항목을 제공합니다.본 데이터는 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어 사회 전반의 혁신과 가치 창출에 도움이 됩니다.ㅁ 제공속성- 공업단지코드 / 샘플 : 245070- 공업단지명 / 샘플 : 전주제2일반산업단지- 공업단지구분 / 샘플 : 일반산업단지- 공업단지주소 / 샘플 : 전라북도 전주시 덕진구 팔복동 3가 일원- 행정동코드 / 샘플 : 4511360000- 지정일자 / 샘플 : 1984-03-14 00:00:00- 업체수 / 샘플 : 27- 분양상태 / 샘플 : 완료'
