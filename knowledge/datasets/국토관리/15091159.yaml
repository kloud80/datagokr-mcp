summary_user: 전북 정읍시 장명배수구역의 급수 시스템을 대상으로 한 수도관망 학습 자료로, 배수지 개요·위성지도·관망해석용 EPANET 파일과 블록별 압력, 가압장 유입·유출 압력 등 시간별 계측값(저장시간 기준) CSV를 하나의 zip(약 136MB)으로 묶어 담는다. 수리모형 검증이나 디지털 트윈·AI 기반 수압·유량 예측 모델을 만드는 분석가가 '장명 블록별 압력이 시간대에 따라 어떻게 변하고 관망 모델이 이를 재현하는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 상수도 데이터와는 배수구역·시설 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 본 데이터는 한국수자원공사에서 제공하는 수도관망 해석 및 예측 모델 학습 자료로, 전라북도 정읍시 장명배수구역의 급수 시스템 운영 정보를 포함합니다. 주요 구성은 장명배수지 개요, 위성지도(백드롭), 관망해석용 EPA.NET 파일, 유량·수압·수위·적산 등 시간별 계측값을 담은 CSV 파일로 이루어져 있습니다. 또한 블록단위 급수계통도와 태그정보도 포함되어 있어, 관망 상태 해석, 시뮬레이션, 수리모형 검증 등에 활용이 가능합니다. 본 자료는 GIS 기반으로 정비되었으며 관로는 배수관로 수준까지 구축되어 있습니다. 해당 데이터는 물관리 정책 수립, 디지털 트윈 구축, 인공지능 기반 예측 모델 개발 등 다양한 공공 및 민간 분야에서 유용하게 활용될 수 있습니다.
