summary_user: 공무원연금공단이 관리하는 공무원 임대주택의 단지·주택형별로 분기(1~4분기)마다 모집세대수, 신청세대수, 경쟁률, 최저 선정순위, 최저 가점을 담은 집계 파일이며 CSV 한 건(약 10KB)으로 제공된다. 임대주택 입주를 신청하려는 공무원이 '내가 희망하는 단지·평형에서 지난 분기 커트라인 순위와 가점이 얼마였고 내 점수로 예비입주자에 들 수 있는가'를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단지명·주택형 이름 매칭으로만 연결한다.
limits: 단지 주소나 코드가 없어 위치 기반 결합은 이름 매핑에 의존한다. 명세상 연간 단위로 생성된 뒤 바뀌지 않는 자료라 분기 이후의 최신 경쟁 상황은 담기지 않으며, 개별 신청자 단위 자료가 아닌 집계값이다.
