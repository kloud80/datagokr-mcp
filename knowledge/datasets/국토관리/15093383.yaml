description_portal: 공무원연금공단에서 관리하는 공무원 임대주택의 예비입주자 선정을 위한 경쟁률 및 최저점(커트라인) 정보를 정리한 데이터로, 신청 공무원들의 입주 가능성 판단을 위한 참고자료로 제공합니다.데이터는 임대주택 유형별로 분류되며, 각 유형에 대해 신청자 수 대비 예비입주자로 선정된 비율(경쟁률)과 선정 커트라인 점수를 포함합니다.신청자는 공단의 선정 순위 기준에 따라 1순위(전국무주택·비수혜), 2순위(소재지무주택·비수혜), 3순위(전국무주택·기수혜), 4순위(소재지무주택·기수혜)로 분류되며, 동일 순위 및 점수인 경우에는 무주택 기간이 긴 세대, 생년월일이 빠른 신청자 순으로 우선권이 부여됩니다.임대주택 입주 신청 시 희망 단지별 당첨 가능성 예측, 가점 전략 수립, 신청자 유형별 접근성 평가 등에 활용 가능하며, 지역별 입주 수요의 상대적 집중도 및 임대자격 충족자 수요 추세 분석 등에도 활용할 수 있다.
