summary_user: 광주광역시 서구 내 원룸·오피스텔을 건축물(허가 건) 단위로 한 줄씩 담은 원천 목록으로, 건축구분·허가번호·대지위치·허가일·사용승인일·주용도·부속용도와 세대수·호수·가구수를 포함한다. 서구에서 1~2인 가구용 소형 주거가 어느 동에 얼마나, 언제 공급됐는지 확인하려는 주택정책 담당자나 소규모 임대시장 조사자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)나 허가번호를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 광주광역시 서구 지역 내 원룸 및 오피스텔의 현황 정보를 담고 있으며, 건축구분, 허가번호, 대지위치, 허가일, 사용승인일, 주용도, 부속용도 등 행정·법적 속성부터 세대수, 호수, 가구수 등 거주 규모 관련 정보까지 폭넓게 포함하고 있습니다. 각 시설의 위치정보와 더불어 용도별 분류 및 승인일 정보가 포함되어 있어 해당 건축물의 허가 및 사용 상태를 한눈에 파악할 수 있으며, 지역 내 소형 주거 형태에 대한 공간 분포 및 공급량 분석에도 활용 가능합니다. 특히 1~2인 가구 증가 및 주거 트렌드 변화에 따른 행정 수요 대응, 주택정책 수립, 소규모 임대시장 조사 등에 유용하게 쓰일 수 있습니다. 수집 방식은 수시(1회성 데이터)이며, csv 형식으로 제공되어 가공과 활용이 용이합니다. 공공저작물로 분류되어 자유롭게 재사용이 가능하며, 공간 정보는 포함되어 있지 않지만 주소 기반 분석이 가능합니다.
