summary_user: 경상북도 김천시의 상수도·하수도 요금 산정 기준을 업종(가정용·일반용·대중탕용·전용공업용·산업용)과 월 사용량 구간별로 정리한 기준표로, 구간마다 월 상수도요금과 하수도요금(원)을 담은 작은 CSV 파일(1,227바이트)이다. 김천시 주민이나 사업자가 '우리 업종이 한 달에 몇 m3를 쓰면 상하수도요금이 얼마인가'를 가늠하거나, 분석가가 다른 시군과 요금 체계를 비교할 때 쓴다. 다른 데이터와 묶을 공통 조인 키는 없어서, 업종명이나 기관명(김천시)을 직접 맞춰 이어 써야 한다.
