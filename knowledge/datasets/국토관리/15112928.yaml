description_portal: '금천구 관내 공공건축물의 현황을 체계적으로 정리한 데이터입니다. 건축물명, 도로명주소, 지번주소, 면적 등 주요 항목을 포함하고 있어 공공건축물별 기본 정보를 한눈에 확인할 수 있습니다. 해당 데이터는 공공시설 관리 및 운영, 관내 공공시설 현황 파악, 공공자산 관리를 위해서 사용할 수 있습니다. 또한 시설 분포 분석, 공간정보 기반 서비스 개발,  행정 업무 지원 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다. 이는 민간 활용 뿐만 아니라 행정 내부 활용분야에도 유용한 자료로 사용될 수 있습니다. (담당부서 : 건축과)'
