summary_user: 제주 어영소공원에서 용두암까지 이어지는 해안 산책 구간(비행기 이·착륙 포토스팟)의 무장애 여행 코스를 지점별로 담은 데이터로, 순서·위도·경도·구분·설명·상세정보와 전체·추천 코스 여부가 함께 들어 있다. 휠체어 이용자나 교통약자, 동행 가족이 "이 구간을 어떤 동선으로 걸으면 전망 지점과 화장실·휴게시설을 무리 없이 들를 수 있나"를 확인하거나, 지자체가 열린관광지 개선 지점을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 장소 이름을 맞춰 연결해야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_어영소공원~용두암(비행기이착륙포토스팟)_무장애여행코스 데이터를 제공합니다.*본 데이터셋은 제주특별자치도 어영소공원에서 용두암까지 이어지는 해안 산책 구간을 대상으로 구축된 무장애 여행 코스 정보를 제공한다. 해당 구간은 비행기 이·착륙을 근거리에서 관찰할 수 있는 포토스팟으로 알려져 있으며, 교통약자와 휠체어 이용자의 접근성을 확보하기 위한 동선, 전망 지점, 휴게 및 편의시설 현황 등이 포함되어 있다. 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 현장 기반 데이터가 반영되어 있으며, 열린관광지 조성, 무장애 관광 인프라 구축, 정책 수립 및 관광 서비스 개선을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
