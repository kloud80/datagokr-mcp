summary_user: 대전광역시 대덕구 관내 공중위생업소(숙박·목욕장·이용·미용·세탁·건물위생관리업 등)를 업소 한 곳당 한 행으로 담은 건별 목록으로, 업종명·업소명·도로명 주소·전화번호·데이터기준일을 포함한다. 주민이나 사업자가 '대덕구에 미용실이나 목욕탕이 어디에 몇 곳 있나'를 확인하거나, 분석가가 업종별·지역별 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 업소명으로 맞춰 잇거나, 같은 기관의 자료끼리만 연결한다.
description_portal: 본 데이터는 대전광역시 대덕구 관내에서 영업 중인 공중위생업소의 현황을 종합적으로 정리한 자료입니다. 공중위생업소에는 숙박업, 목욕장업, 이용업, 미용업, 세탁업, 건물위생관리업 등이 포함되며, 업종 구분, 업소명, 소재지 주소, 소재지 연락처 등의 정보를 제공합니다. 본 자료는 생활환경 개선, 위생관리 정책 수립, 상권 분석, 업종별 분포 파악 등 다양한 분야에서 활용이 가능하며, 위생 점검이나 지도·단속 계획 수립 시 기초자료로 활용됩니다. 또한 주기적으로 최신 정보로 갱신하여 정확성과 신뢰성을 유지하며, 이용자가 행정동별·업종별 검색을 통해 필요한 정보를 신속히 확인하고 내려받을 수 있도록 구성되어 있습니다.
