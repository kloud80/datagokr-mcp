summary_user: 경상남도에서 2018년에 수집한 시공 중인 공동주택 공사 정보를 공사 1건당 1행으로 담은 1회성 파일로, 공사명·공사기간·공사장 주소·세대수·입주예정일·시공사명·전화번호가 들어 있고 포털 설명상 총 2건(약 267바이트 CSV)이다. 2018년 당시 경남에서 짓고 있던 아파트의 세대 규모와 입주 예정 시기, 시공사를 확인하려는 주민이나 분석가가 참고 자료로 쓴다. 전역 조인 키나 코드표가 없어 K-apt 단지코드·실거래·청약 데이터와는 공사장 주소나 단지·공사명을 기준으로 이름 매칭해야만 이을 수 있다.
description_portal: (데이터 수집목적 및 과정) 경상남도 공동주택 시공중 현황 데이터는 2018년에 수집한 경상남도 공동주택 시공중 정보입니다. 공사명과 공사기간, 공사장 주소, 세대수, 입주예정일, 시공사명, 전화번호로 구성되어 있습니다.  데이터는 총 2건입니다.* 공사는 민원신청에 의한 공통주택 시공공사며 해당 공사에 대한 정보를 제공합니다.* 세대수는 건설될 공동주택의 세대수를 의미합니다.* 입주예정일은 건설될 공동주택의 입주예정일자를 의미합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화 하지 않습니다.
