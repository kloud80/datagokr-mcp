summary_user: 학교 주변에서 보건·위생에 지장을 주는 행위와 시설을 제한하는 교육환경보호구역을 전국 범위로 제공하는 외부 API(vworld.kr)이며, 필드로는 시도명(sido_name)·시군구명(sigg_name)·구역명(uname)·연도(dyear) 등이 있다. 학교 인근에 건물이나 시설을 지으려는 사업자나 주민이 해당 부지가 교육환경보호구역에 속하는지 확인하는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름 매핑이나 같은 기관 코드로만 잇고, 토지이용규제 계열 데이터와 함께 보는 쪽으로 이동이 제안되어 있다.
limits: vworld.kr 인증키(query 파라미터 key)가 필요하며 포털 활용신청과는 별개다. 실측 컬럼에서 전역 조인 키를 찾지 못해 이름·코드 매핑 없이는 다른 데이터와 자동 연결되지 않는다. 필드 명세상 의미와 코드표가 없어 각 필드 해석은 확인이 필요하다.
