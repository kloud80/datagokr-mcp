description_portal: '- 전라남도 내 지적측량업체의 업체명, 사무소 전화번호, 사무소 주소, 대표자 명 등을 조회할 수 있는 공공데이터입니다.- 지적측량은 토지의 경계, 면적, 위치를 정확히 측정하여 **지적공부(토지대장, 지적도)**에 반영하는 법적 행위입니다. 토지 소유권 보호, 경계 분쟁 예방, 개발 허가 등에 필수적인 절차입니다.- 경계복원측량 : 기존 토지의 경계점을 복원 (울타리 설치, 분쟁 예방 등)- 지적현황측량 : 실제 경계와 공부상 경계를 비교 (측량성과도 발급 가능)- 분할측량 : 1필지를 2필지 이상으로 나누기 위해 실시- 합병측량 : 여러 필지를 하나로 합치기 위해 필요- 등록전환측량 : 미등록 토지(임야 등)를 지적공부에 등록- 지번변경측량 : 도로 개설 등으로 지번 체계 변경 시 사용'
