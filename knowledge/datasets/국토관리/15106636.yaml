summary_user: 경기도 내 지역주택조합 사업을 조합 한 건씩 담은 현황 자료로, 시군명·조합명·대표자, 조합원 모집신고·설립인가·사업계획승인·착공신고 일자, 사업지 위치, 조합원 세대수와 총 세대수, 대지·연면적, 시공사·업무대행사와 연락처를 포함한다. 조합 가입을 검토하는 국민이 특정 조합이 설립인가나 사업계획승인 단계까지 진행됐는지 확인하거나, 분석가가 시군별 지역주택조합 사업 진행 속도를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)이나 조합·사업지 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 지역주택조합 사업의 전반적인 추진 현황을 정리한 자료입니다. 각 사업의 위치, 추진 단계, 조합원 구성, 분양 및 공급 계획 등이 포함되어 있어, 조합 사업의 진행 상황과 특성을 한눈에 파악할 수 있습니다. 이 데이터는 지역주택조합의 사업 진행 속도, 조합원 모집 현황, 분양 시점 분석 등에 활용될 수 있으며, 지방자치단체의 도시개발 정책 수립, 주택 공급계획 관리, 주거 안정성 확보에도 기초 자료가 됩니다.*지역주택조합 관련 법 개정 전후 등록된 자료 양식의 차이로 일부 값이 공란으로 제공되며, 날짜가 2059-12-31 으로 표기되어 있는 경우 공백값입니다.
