summary_user: 대전광역시 유성구 관내 도시형 생활주택을 건물 단위로 한 행씩 담은 목록으로, 건물명칭·대지위치·사용승인일·주용도·세대수·동수·층수·연면적을 기록한다(포털 설명 기준 83행, 시군구 범위). 유성구에서 어느 지역에 언제 사용승인된 도시형 생활주택이 몇 세대 규모로 공급됐는지 살펴보려는 주민·임대사업자·주택공급 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)나 건물명칭을 맞춰 붙여야 하며, 같은 유성구의 다른 주택·건축 현황과 이을 때도 이 방식으로 연결한다.
