description_portal: '○ 통계개요* 통계명 : 빈집 현황(구별)* 통계종류 : 조사, 지정통계* 근거법령 : 인구주택총조사 규칙* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악하여 각종정책입안의 기초자료로 활용, 각종 가구관련 경상조사 표본틀로 활용* 조사체계 : 2010년이전 : 조사원 →동.읍.면→구.시.군→시.도→통계청(전통적 방식)2015년이후 : 행정자료를 활용한 등록센서스 방식 조사** 등록센서스 방식 : 행정자료를 활용하여 현장조사 없이 통계를 생산하는 방식* 공표주기 : 5년(2015년이전), 1년(2016년이후)* 공표범위 : 지역 - 서울시 및 자치구내용 - 주택종류별 빈집○ 용어설명* 빈집 : 11월 1일 기준 사람이 살지 않는 주택을 말하며, 신축주택 및 매매,임대,이사,미분양 등 사유로 인한 일시적 빈집 포함○ 기 타* 빈집을 대상으로 집계* 개인정보 보호와 자료 노출 위험성을 최소하기 위하여 5미만 자료는 x로 표기함* 2015년까지는 5년주기, 2016년부터 1년주기로 공표* 2015년과 2016년 자료는 행정자료를 활용한 등록센서스 방식의 집계결과임* 조사기준 및 자료시점은 매년 11.1. 0시 기준○ 출 처 : 통계청, 인구주택총조사'
