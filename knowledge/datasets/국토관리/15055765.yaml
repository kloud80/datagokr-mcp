summary_user: 전북특별자치도 시군구별로 인구·행정구역 면적과 함께 주거·상업·공업·녹지 세부 용도지역, 관리·농림·자연환경보전지역, 해면부 용도지역의 지정 면적을 담은 집계 표(csv 약 3KB)이다. 도시계획 담당자나 부동산·개발 분석가가 '전북 시군 중 계획관리지역이나 일반공업지역 면적 비중이 큰 곳은 어디인가'처럼 시군별 토지이용 구성을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름을 행정구역 코드에 매핑해 이어 쓰며, 용도지역 지정의 법적 틀은 국토계획법의 용도지역 조항(§36~§42)을 참고한다.
description_portal: 이 데이터는 전북특별자치도 내 시군별 용도지역 지정 현황을 총망라한 자료입니다. 각 지역의 총인구 및 행정구역 면적을 시작으로, 토지를 주거, 상업, 공업, 녹지 지역 등으로 어떻게 구분하여 관리하고 있는지를 보여줍니다. 특히, 제1종 전용주거지역, 중심상업지역, 일반공업지역 등 법률에 따른 세부 용도지역별로 지정된 면적을 구체적인 수치로 제공하는 것이 특징입니다. 이 자료는 지역의 토지이용 실태를 파악하고, 도시 계획 수립, 부동산 개발, 환경 정책 분석 등 국토 계획과 관련된 모든 분야에서 활용되는 핵심적인 데이터입니다.
