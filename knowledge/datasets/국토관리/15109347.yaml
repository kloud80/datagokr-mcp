summary_user: 서울 동대문구 관내 가로수를 한 그루씩 담은 건별 원천 파일로, 수목명·식재일·흉고직경·근원직경·수령·식재간격과 도로명·도로폭·보도폭, 보호틀 파손·뿌리융기 여부, 위경도와 주소를 담는다. 구청 녹지 담당자나 분석가가 '보호틀이 파손됐거나 뿌리가 솟은 가로수가 어느 도로에 몰려 있는가', 주민이 '우리 동네 길에 어떤 나무가 언제 심어졌나' 같은 질문에 쓴다. 전역 조인 키는 없어 수목 위경도로 지도·공간 데이터와 겹치거나 도로명·행정동·주소 이름을 매칭해 다른 자료와 잇는다.
description_portal: 서울특별시 동대문구 관내에 식재된 수목의 위경도 및 주소, 흉고직경, 근원직경, 식재간격, 수령 등의 정보를 제공합니다.나무의 높이(수고) 및 수관폭과 같은 정밀한 생육 지표와 함께 식재 간격 정보를 포함하고 있어 수목의 건강 상태와 성장 추이를 과학적으로 분석할 수 있도록 돕습니다. 나아가 보도폭, 보호 덮개 등의 주변 상태 정보와 이미지 데이터를 함께 제공함으로써 태풍 등 재해로 인한 전도 위험성 예측이나 병충해 방제 작업 시 적절한 유지보수 타이밍을 결정하는 정책적 근거로 활용됩니다. 결과적으로 이 데이터는 동대문구의 탄소 흡수원 현황을 정확히 파악하고 구민들에게는 쾌적하고 안전한 쉼터를 제공하여 도심 속 지속 가능한 녹색 생태계를 보전하는 데 중추적인 역할을 수행하는 가치 있는  데이터셋입니다.
