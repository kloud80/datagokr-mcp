summary_user: 전라남도 해남군 내 원룸과 오피스텔을 한 곳씩 상호명·주소·층수·세대수·건축년도·유형(원룸/오피스텔)으로 담은 건물별 목록으로, 포털 설명 기준 2023년 6월 시점 52개소 720세대이며 대부분 해남읍에 있다. 해남으로 전입하거나 근무지를 옮기는 사람이 읍면별로 어떤 원룸·오피스텔이 있고 얼마나 오래됐는지 확인하거나, 분석가가 군 단위 소형 임대주택 공급 규모를 파악하는 데 쓴다. 공통 조인 키(법정동코드·건물관리번호 등)가 없어 다른 데이터와는 주소 문자열을 지오코딩하거나 건축물대장의 주소와 대조해 이어 쓴다.
limits: 전역 조인 키가 없어 실거래·임대차 자료와 바로 결합되지 않고 주소 매칭이 필요하다. 해남군 한 곳만 담은 개별 건물 목록이므로 다른 시군과 비교하거나 임대료·공실 같은 시장 정보를 얻을 수 없다.
