summary_user: 경기도 내 사업체를 한국표준산업분류 대분류부터 세세분류까지 나눠 사업체 한 곳씩 시군·행정구역, 지번·도로명 주소, 우편번호, 위경도 좌표와 함께 담은 개별 단위 자료다. 지역경제 분석가나 시군 담당자가 "우리 시의 특정 동에 어떤 제조업종 사업체가 얼마나 모여 있는가"처럼 업종 구조와 공간 분포를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 시군·행정구역 이름이나 코드, 산업분류 코드(주업종 산업분류코드 등), 좌표를 매개로 다른 산단·지역 통계와 맞춰 쓴다.
description_portal: 업종별 사업체 현황 데이터는 경기도 내 사업체를 한국표준산업분류 기준에 따라 분류한 자료로, 시군명, 행정구역명, 소재지지번주소, 도로명주소, 산업분류명(대분류~세세분류), 위도 및 경도 좌표 등의 항목으로 구성되어 있습니다. 이 데이터는 산업별 사업체 분포를 분석하거나 특정 지역 내 업종 구조를 파악하는 데 활용됩니다. 산업분류는 대분류부터 세세분류까지 세분화되어 있어 고도화된 산업 분석이 가능합니다. 또한 위치정보가 포함되어 있어 공간 기반 산업통계 분석, 지역경제 전략 수립, 도시계획 및 인프라 조성 자료로 활용될 수 있습니다.※ 해당 데이터의 경우 경기통계(stat.gg.go.kr)를 운영하는 인구정책담당관에서 관리하고 있으며, 취합·정리 후 갱신까지 약 2년의 기간이 소요됩니다.
