summary_user: 주택도시보증공사 분양보증 사업장(임대·도시형생활주택·오피스텔 제외) 중 30세대 이상 신규 민간분양 아파트를 지역별로 묶어, 총 분양가격에서 건축비가 차지하는 비율(1-대지비 비율)을 월말 기준으로 담은 집계표이며, 실측 파일은 지역 행에 2023년 1월부터 2026년 4월까지 월별 열이 붙은 형태다. 분석가나 수요자가 '우리 지역 신규 아파트 분양가에서 땅값과 건축비 중 어느 쪽 비중이 커지고 있나'를 지역·시점별로 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명 매핑으로 연결해야 하며, 같은 기관의 분양가격·대지비 비율 통계와 지역·월을 맞춰 함께 보는 방식이 현실적이다.
limits: 지역 단위 집계라 구·동별 차이나 개별 단지의 분양가 구성은 알 수 없다. 지역 내 분양이 적은 달에는 특정 입지(학군·역세권 등) 사업장 몇 곳에 따라 비율 편차가 크게 생길 수 있다. 표준 행정코드 같은 조인 키가 없어 지역명으로 직접 맞춰야 한다.
