description_portal: '"하수처리장"은 생활하수, 공장폐수, 빗물 등의 오염된 물을 정화하여 자연에 다시 방류하거나 재이용할 수 있도록 처리하는 시설입니다.하수처리장의 주요 기능1. 1차 처리 (기계적 처리)  -  쓰레기, 모래, 기름 등을 걸러내는 과정  - 스크린, 침사지, 유수분리기 등을 사용2. 2차 처리 (생물학적 처리)  - 미생물을 이용하여 유기물 제거  - 활성슬러지법, 산화구법, 생물막법 등 사용3. 3차 처리 (고도 처리)  - 질소, 인, 미세오염물질 제거  - 막여과(MBR), 화학적 침전, 오존 처리 등 활용4. 슬러지 처리  - 처리 후 남은 오니(슬러지)를 탈수, 소화, 건조하여 폐기 또는 자원화창녕군시설관리공단 하수처리장 관련정보를 구분, 년월, 방류유량, 화학적 산소 요구량, 부유물질 등을 기준으로 작성된 데이터를 제공합니다.'
