summary_user: 서귀포시 관내 단란주점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·주소·위도·경도와 데이터기준일자가 들어 있다(약 12KB CSV). 지역 주민이나 상권 분석가가 '서귀포시 어느 동네에 단란주점이 몰려 있나'를 지도에 찍어 보거나 학교·주거지 주변 유흥업소 분포를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소 문자열이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 서귀포시 관내 운영 중인 단란주점의 위치 정보를 사물주소 체계로 제공합니다. 업소명, 소재지 주소, 위도와 경도 좌표 등의 항목이 포함되어 있어, 행정기관은 이를 활용해 시설 위치 기반 GIS 지도화, 밀집도 분석, 사후 관리 및 단속 계획 수립 등에 활용할 수 있습니다. 또한, 공간정보가 포함된 이 자료는 지역 상권 분석, 관광객 유치 전략 수립, 교통 안내 시스템 개발에도 유용합니다. 시민이 신뢰할 수 있는 정보를 바탕으로 접근성을 높이고, 유흥 밀집 지역의 변화 추이 모니터링에도 기여합니다.
