summary_user: 경주시에 등록된 착한가격업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·주소·연락처·가격 항목을 담는다(csv 약 3.6KB 규모). 시민이나 관광객이 "경주에서 가격이 저렴한 한식당이나 미용실이 어디 있나"를 찾거나, 분석가가 지역 착한가격업소의 업종 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(경주시) 기준으로만 이어 쓴다.
description_portal: 경상북도 경주시에서 제공하는 본 데이터는 지역 내 착한가격업소 등록 현황에 대한 정보를 포함하고 있다. 본 데이터는 한식, 중식, 이·미용 등 다양한 업종에 해당하는 저렴한 가격과 우수한 서비스를 제공하는 업소의 명칭, 주소, 연락처 등의 항목으로 구성되어 있으며, 시민 및 방문객에게 합리적인 소비처를 안내하는 데 목적이 있다. 착한가격업소는 물가안정을 위한 정부지원 정책의 일환으로 운영되고 있으며, 지역 내 소비 촉진과 소상공인의 경쟁력 향상에 기여하고 있다. 본 정보는 경제통계 자료, 소비자 정보 제공, 정책 수립, 관광 서비스 등 다양한 분야에서 활용 가능하다
