description_portal: '○ 통계개요* 통계명 : 하수, 분뇨발생량 및 처리현황* 통계종류 : 서울시 하수ㆍ분뇨의 발생량 및 처리현황을 제공하는 지정ㆍ조사통계* 근거법령 :「오수ㆍ분뇨 및 축산폐수의 처리에 관한법률」에 의한 분뇨 발생 및 처리* 작성목적 : 하수 및 오수.분뇨 발생, 처리현황 등을 조사.분석하여 처리시설 확충 등을위한 투자계획 및 하수도 정책수립의 기초자료로 활용* 조사체계 : 자치구 → 시도 → 환경부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구,내용 - 서울시 하수, 분뇨발생량 및 처리시설, 수집ㆍ운반업체 현황○ 용어설명* 하수 : 사람의 생활이나 경제활동으로 인하여 액체성 또는 고체성의 물질이 섞이어오염된 물(이하 "오수"라 한다)과 건물·도로 그 밖의 시설물의 부지로부터하수도로 유입되는 빗물·지하수* 분뇨 : 수거식 화장실에서 수거되는 액체성 또는 고체성의 오염물질(개인하수처리시설의 청소과정에서 발생하는 찌꺼기를 포함한다)'
