summary_user: 경기도시장상권진흥원이 정한 경기도 내 발달상권을 상권 1건 단위로 담으며, 상권명(bizdist_nm)·상권 영역 폴리곤·업종 정보·점포 수·위경도를 함께 제공한다. 창업을 준비하는 사업자나 지역 분석가가 "우리 동네 근처에 점포가 밀집한 발달상권이 어디이고 어떤 업종이 몇 개 있나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 상권명·위경도·폴리곤을 기준으로 다른 상가·상권 데이터와 이름 매칭이나 공간 중첩으로 이어 쓴다.
description_portal: '경기도시장상권진흥원에서 제공하는 경기도 내 발달상권 현황 정보입니다. 다중지역정보(polygon)를 통해 상권 별 영역 정보를 함께 제공합니다.★발달상권이란?- 유통산업발전법 제5조의 법조항에 따라 2천 제곱미터 이내 50개(인구 30만 이하인 시·군·자치구의 경우에는 30개) 이상의 상점이 분포하는 경우 “상점가”라 하고, 배후지를 고려하지 않은 도보이동이 가능한 범위내의 상가업소밀집지역을 발달상권으로 정의- 타 상권에 비해 점포의 밀도가 높고 거래량이 많은 상업 세력의 범위를 의미- 구축과정 : 2015년, 2016년 소상공인진흥공단에서 제공한 상권영역을 기준으로 2017년 블록(통계청조사,집계구,도로망을 반영한 전국36만개 블록을 기준으로 작업) 기반으로 상권영역 설정 기준 변경'
