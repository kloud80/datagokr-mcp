summary_user: 공간정보관리법에 따른 지목(땅의 용도 구분)별로 지목명, 지도에 쓰는 부호, 법적 정의, 간략 설명, 근거 법령을 한 행씩 담은 코드표 성격의 CSV 파일(약 12KB)이다. 토지이음에서 필지의 토지이용계획을 열람하는 국민·중개사·분석가가 '이 땅의 지목이 답·전·대라는데 각각 무슨 뜻이고 어느 법에 근거하나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 다른 토지·필지 데이터의 지목 코드나 지목명을 이 표의 지목코드·지목명과 맞춰 뜻풀이용 참조표로 붙여 쓴다.
description_portal: 공간정보의 구축 및 관리 등에 관한 법률 제2조 및 제67조, 동법 시행령 제58조 등에 따른 부동산의 지목을 대상을 선정하였습니다. 본 자료가 제공하는 정보는 위 지목 목록을 기준으로 토지이음(www.eum.go.kr)의 토지이용계획 열람 서비스 화면에서 확인할 수 있는 필지별 지목에 대해서 제공하는 간략 정보를 텍스트 파일(CSV)로 제공합니다. 그 내용에는 지목의 명칭과 부호 및 간략 설명과 그에 따른 근거 법령 등 토지이용계획을 확인할 때 참고할 필지 지목에 대한 간략한 요약 설명입니다.
