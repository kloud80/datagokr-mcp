summary_user: 부산광역시 상수도사업본부 수용가정보시스템에 쌓인 옥내누수 탐지비 지원 민원 신청 정보를 건별로 담으며, 사업소·신청부서·건물형태와 전문업체 누수탐지에 든 금액(누수탐지소요액)·실제 지원된 금액(누수탐지지급액)을 기록한 파일(CSV 약 100KB)이다. 사업소별·건물형태별로 누수탐지비가 얼마나 들고 그중 얼마가 지원되는지 보려는 분석가나, 옥내누수 탐지비 지원 실태를 확인하려는 시민·담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소코드·사업소명 같은 같은 기관 내부 코드나 이름 매핑으로만 이어 쓴다.
description_portal: '부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 민원신청 정보(누수탐지비) 자료입니다.옥내누수중 상수도본부 가정수돗물 무료점검서비스팀으로는 탐지가 불가하여 전문 누수탐지 업체를 통한 옥내누수 탐지시소요비용의 일부를 지원하여 신속한 누수 발견으로 주민편의 제공급수조례 제27조의2(옥내누수의 탐지 지원) : 옥내누수 탐지비 지원 근거급수조례 시행규칙 제13조의2(옥내누수의 탐지 지원) - 2010. 9. 29일 공포(공포일로부터 시행)'
