summary_user: 경기도 광주시 관측 지점별로 측정일시마다 기록한 강수량을 담은 건별 관측 파일(CSV, 약 6.1MB)이며, 각 행은 위치·측정일시·강수량으로 이루어진다. 시민이나 재난 담당자가 "집중호우 때 광주시 어느 지점에 비가 얼마나 왔는가"를 확인하거나 침수 위험을 판단하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않았고 관측소코드도 없어, 다른 수문 자료(WAMIS 등)와는 지점 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
limits: 관측소 표준코드나 좌표 같은 공통 키가 없어 전국 수문 관측 시계열과 바로 결합할 수 없고, 지점 이름을 직접 맞춰야 한다. 범위는 광주시 한 시군구에 한정되며, 제목과 달리 실측 필드에는 수위 값이 없고 강수량만 있다.
