description_portal: 본 데이터는 국가가뭄정보포털에서 제공하는 조선시대 측우기에 관한 역사·과학 자료를 수록한 것입니다. 측우기는 세계 최초의 강우량 측정기구로, 정기적인 강우량 관측에 활용되었습니다. 지역 고성, 대구, 진주에서의 강우량과 우택을 관측하여 관측일(양력)과 보고일(양력), 강우량 및 이에 대한 상세내용을 기재한 내용을 알아보기 쉽도록 편찬한 자료를 나타내며, 해당 자료는 기상학 및 수문학의 발달 과정과 전통 과학기술의 우수성을 이해하는 데 활용 가능합니다. 교육·연구·전시·문화재 보존 분야에서 참고자료로 쓰일 수 있으며, 공공데이터포털을 통해 열람할 수 있습니다.
