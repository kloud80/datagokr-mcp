summary_user: 항공사진 도화(벡터지도 제작)를 위한 지상기준점 측량지구의 목록으로, 측량지구별로 지구명·측량사업명·책번호·사업구분·제작년도·제작업체·작업방식을 담은 전국 범위의 비공간 CSV 파일(약 25KB)이다. 공간정보 분석가나 측량업체가 특정 지역의 항공사진 측량이 언제, 어느 사업으로, 어느 업체에 의해 이뤄졌는지 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 측량지구명·측량사업명 같은 이름 매칭이나 같은 기관(국토지리정보원)의 측량지구코드로만 연결한다.
limits: 좌표나 경계 등 공간 정보가 없는 비공간 목록이라 측량지구 위치를 지도에 바로 올릴 수 없다. 행정구역 코드 같은 전역 키가 없어 다른 기관 데이터와 붙일 때는 이름 매칭에 의존해야 한다.
