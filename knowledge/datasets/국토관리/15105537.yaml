summary_user: 전북개발공사가 관리하는 공공임대주택 가운데 임대 계약이 해지된 세대를 건물명·동·호·해지일자 단위로 한 건씩 담는 API입니다. 임대주택 운영 담당자나 주거정책 분석가가 "어느 단지의 어느 호실이 언제 해지돼 비었는가"를 파악해 공실 관리나 신규 입주자 모집 계획에 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어, 같은 기관의 다른 임대주택 데이터와 건물명(name)·동·호 이름을 맞추는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 기관 데이터와는 단지명·주소 문자열 매핑으로만 연결되며, 데이터에 공간 좌표가 없다. 포털 활용신청은 자동승인이고 개발계정은 하루 1,000회로 호출이 제한된다.
