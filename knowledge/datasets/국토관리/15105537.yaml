description_portal: 전북개발공사가 관리하는 공공임대주택 중 해지 완료된 세대 정보를 조회할 수 있는 서비스입니다.이 API를 통해 건물명, 동, 호, 해지일자 등 주요 정보를 확인할 수 있으며 임대 계약 종료 이후 공실 상태에 대한 모니터링과 관리에 활용할 수 있습니다.본 서비스는  퇴거 세대 현황 파악을 통해 임대주택의 운영 효율성을 높이고 신규 입주자 모집, 공공임대주택 공급계획 수립 등에 도움이 됩니다. 또한 주거복지정책 추진, 청년·신혼부부 주거 지원, 임대 자원 관리 등 다양한 행정 및 연구 분야에서 참고자료로 활용할 수 있습니다.
