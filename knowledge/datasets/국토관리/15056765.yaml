summary_user: LH 분양·임대 공고 중 선택한 공고 하나의 공급정보(주택형·필지·상가호 목록)를 돌려주는 공고별 조회 API로, 검증 호출에서는 전국 범위 필지·건물 단위 2행이 수신됐다. 청약을 준비하는 국민이나 분석가가 특정 LH 공고에서 어떤 주택형이나 필지가 공급되는지 확인할 때 쓴다. 전역 조인 키가 확인되지 않아 같은 기관 코드나 이름·코드 매핑으로만 공고 목록 등 LH 다른 데이터와 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 검증 수신은 2행뿐이라 전체 공급 규모나 갱신 주기는 이 자료로 알 수 없고, 필드 명세에 의미·코드표가 없어 응답 항목의 해석은 별도 확인이 필요하다.
