description_portal: 서울특별시 강남구 행정동별 노후주택(공동주택) 현황입니다. 2020년~2020년까지의 자료를 포함하고 있습니다. 이 데이터는 행정동, 연도, 준공 후 20년 경과 공동주택 수, 준공 후 30년 경과 공동 주택 수, 데이터관리부서, 데이터 관리부서 전화번호, 데이터 기준일로 구성되어 있습니다.행정돔 별로 준공 후20년 경과 공통주택수와 준공 30년 경과 공동주택 수를 기재해 놓았습니다. 이와 관련하여 기타 문의사항은 서울특별시 강남구청 주택과(02-3423-6056)로 문의 주시기 바랍니다.
