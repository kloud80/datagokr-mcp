summary_user: 서울 강남구의 행정동별로 준공 후 20년과 30년이 지난 공동주택 수를 연도 단위로 집계한 파일(csv, 약 7KB)이며, 포털 설명상 2020년 자료를 담는다. 구청·연구자·주민이 '강남구에서 노후 아파트가 가장 많은 동은 어디인가'처럼 재건축·리모델링 수요나 노후도 분포를 동 단위로 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름을 매핑하거나 같은 강남구 자료끼리만 이어 쓴다.
limits: 행정동 코드 같은 표준 키가 없어 다른 시군구·전국 데이터와 붙이려면 동 이름을 코드로 직접 매핑해야 한다. 범위는 강남구 한 곳의 읍면동 단위뿐이고, 단지·동별 건별 정보는 담지 않는다.
