summary_user: 광주 남구 관내 공동주택(아파트 등)을 단지 한 건씩 담은 파일로, 단지명·주소·세대수·사업계획승인일자·사용검사일자·관리사무소 연락처를 담는다. 주민이나 분석가가 남구에 어떤 단지가 언제 준공(사용검사)됐고 세대수가 얼마인지, 노후 단지가 어디 몰려 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 단지명을 맞춰 연결하거나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: 광주광역시 남구 관내 공동주택 현황및 정보(명칭, 세대수, 주소, 사용승인일자, 사용검사일자, 연락처 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 주택과(☎062-607-4151)에서 제공합니다. 관리사무소 전화번호, 팩스번호가 부존재하거나, 개인정보가 포함되어 있는 경우 미기재하였으니 데이터 이용 시 참고하시기 바랍니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 공동주택은 여러 세대가 한 건물 또는 단지 안에서 생활하는 형태의 주거시설로, 아파트, 연립주택, 다세대주택 등이 포함됩니다. 각 세대는 독립된 주거 공간을 가지지만, 복도, 계단, 주차장, 놀이터 등 공용시설을 함께 사용합니다.
