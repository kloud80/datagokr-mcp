summary_user: 부산광역시 기장군 안의 공동주택을 단지 한 곳당 한 행으로 정리한 현황 파일로, 단지명·소재지·층수·동수·세대수·연면적·사업승인일·사용검사일·관리사무소 연락처를 담는다(CSV 약 11KB, 범위는 기장군 한 시군구). 기장군 주민이나 부동산·주거 분석가가 "기장군에 세대수가 많은 아파트 단지는 어디이고 언제 사용검사를 받았나" 같은 질문을 확인하는 데 쓴다. 전역 조인 키(단지코드·법정동코드 등)는 없으므로, 다른 공동주택·실거래 데이터와는 단지명이나 소재지 주소를 맞춰 이어 쓴다.
description_portal: 부산광역시 기장군 공동주택 현황으로 단지명, 소재지, 층수, 동수, 세대수, 연면적, 사업승인일, 사용검사일, 관리사무소 전화번호 등의 항목을 제공합니다.공동주택은 주택법 제2조(정의) 규정에 따라 건축물의 벽, 복도, 계단이나 그 밖의 설비 등의 전부 또는 일부를 공동으로 사용하는 각 세대가 하나의 건축물 안에서 각각 독립된 주거생활을 할 수 있는구조로 된 주택을 말하며, 그 종류와 범위는 주택법 시행령 제3조(공동주택의 종류와 범위)에 따르며, 자세한 사항은 건축법 시행령 [별표1] 에 있으며 아파트, 연립주택, 다세대주택 등이 있습니다.건축법 시행령 [별표1]에 따르면 용도별 건축물의 종류에 의거 공동주택[공동주택의 형태를 갖춘 가정어린이집, 공동생활가정, 지역아동센터, 공동육아나눔터, 작은도서관, 노인복지시설(노인복지주택은 제외한다) 및 주택법 시행령 제10조 제1항 제1호에 따른 아파트형 주택을 포함한다.] 다만, 가목이나 나목에서 층수를 산정할 때 1층 전부를 필로티 구조로 하여 주차장으로 사용하는 경우에는 필로티 부분을 층수에서 제외하고, 다목에서 층수를 산정할 때 1층의 전부 또는 일부를 필로티 구조로 하여 주차장으로 사용하고 나머지 부분을 주택(주거 목적으로 한정한다) 외의 용도로 쓰는 경우에는 해당 층을 주택의 층수에서 제외하며, 가목부터 라목까지의 규정에서 층수를 산정할 때 지하층을 주택의 층수에서 제외한다.
