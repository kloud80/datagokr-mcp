summary_user: 충청북도 단양군 안의 국가하천·지방하천을 하천 한 건씩 담은 목록으로, 구분·명칭·지정고시일과 고시번호·소재지·기점과 종점·관리주체·연장(미터)·기본계획수립일을 담은 작은 CSV 파일(약 2.9KB)이다. 단양군에 어떤 하천이 국가하천·지방하천으로 지정돼 있고 어디서 어디까지 몇 미터인지, 누가 관리하는지 확인하려는 연구자나 하천 인근 토지·건축을 검토하는 사업자가 쓴다. 전역 조인 키(하천코드 등)가 없어 다른 하천 데이터와는 하천 명칭이나 같은 기관(단양군) 기준으로만 맞춰 이어 써야 한다.
description_portal: 충청북도 단양군의 국가하천 및 지방하천 현황을 정리한 데이터입니다. 관리번호, 구분, 명칭, 지정고시일, 지정고시번호, 소재지, 기점, 종점, 관리주체, 개소수, 연장(미터), 기본계획수립일, 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 국가하천 및 지방하천 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 12일입니다. 담당부서는 단양군청 관광건설국 안전건설과이며 문의주시면 최신의 충청북도 단양군 국가하천 및 지방하천 현황을 열람하실 수 있게 도와드립니다.
