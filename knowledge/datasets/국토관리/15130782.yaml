summary_user: 경기도 내 공장·창고 실거래를 거래 건별로 담으며, 시군구·읍면동, 계약일, 거래금액, 전용·대지권면적, 층, 건축연도, 건물 주용도, 용도지역, 지분거래·중개 여부, 계약 해제 여부와 사유를 포함한다. 공장 부지나 물류창고를 알아보는 사업자나 분석가가 "화성·평택 일대 창고의 최근 면적당 거래가는 얼마인가" 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았고, 시군구·읍면동 코드(signgu_cd, emd_cd)와 지역명으로 다른 실거래·공시가격 데이터와 맞춰 붙여 쓴다.
description_portal: 이 데이터는 경기도 내 공장 및 창고에 대한 실거래 정보를 제공하며, 경기부동산포털에서 수집한 자료입니다. 거래일자, 거래금액, 전용면적, 대지권면적, 건물용도 및 해제 여부 등의 상세 항목이 포함되어 있어 부동산 거래의 투명성 확보와 시장 분석에 활용될 수 있습니다. 또한, 거래가 중개업소를 통한 것인지 여부, 지분거래인지 여부, 계약 해제 사유까지 함께 포함되어 다양한 형태의 거래를 분석할 수 있습니다. 공장 및 창고 거래 실태를 시군구별로 정밀하게 파악할 수 있는 데이터로, 부동산 투자와 정책 수립에 유용하게 활용될 수 있습니다.
