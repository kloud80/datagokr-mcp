summary_user: 경기주택도시공사가 낸 아파트 분양·임대 입주자 모집 공고를 공고 한 건당 한 행으로 담은 파일(csv, 약 50KB)로, 공고명과 공고 시작일·종료일·등록일이 들어 있다. 청약 대기자나 분석가가 '경기주택도시공사가 언제, 어떤 유형(행복주택·국민임대·공공분양 등)의 모집 공고를 얼마나 자주 냈는가'를 공고명과 날짜로 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 청약·공급 데이터와는 공고명 같은 이름 매칭이나 같은 기관 데이터로만 이어 쓴다.
description_portal: 경기주택도시공사에서 추진하는 아파트 분양 및 임대 공고에 관한 2006년 이후의 현황 데이터로써 공고명, 공고시작일, 공고종료일, 공고등록일 등의 정보가 포함됩니다. 공공분양주택, 장기전세주택, 경기행복주택, 통합공공임대주택, 청년매입임대주택, 국민임대주택, 영구임대주택, 일자리 연계주택, 주거약자용주택 등 다양한 주택 유형의 공급 현황을 확인할 수 있으며, 입주자 모집 일정, 지역별 공급 패턴 분석 등에 유용하게 활용될 수 있습니다. 주거정책 수립, 주택수요 예측, 수요자 맞춤형 정보 제공에도 도움이 되는 핵심 주거공급 자료입니다.
