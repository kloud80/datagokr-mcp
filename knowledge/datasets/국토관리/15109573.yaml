summary_user: 울산광역시도시공사가 시행한 택지조성사업을 사업 한 건당 한 행으로 담은 파일로, 사업명·위치·사업규모·사업비(백만원)·추진현황·관련 법령과 사업승인·계약·분양공고·준공 일자를 포함하며 파일 크기는 약 1KB로 작은 규모이다. 울산 지역에서 도시공사가 어떤 택지사업을 언제 승인·준공했고 사업비가 얼마였는지 확인하려는 주민·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 택지·도시개발 데이터와는 사업명이나 위치를 이름으로 맞춰 연결해야 한다.
description_portal: '이 데이터는 울산광역시도시공사에서 시행한 택지조성사업의 주요 현황을 체계적으로 관리하기 위한 데이터셋으로, 각 사업의 기본 정보, 추진 단계, 법적 근거, 재정 및 일정 정보를 종합적으로 포함하고 있습니다.도시공사가 추진하는 택지조성사업은 울산 지역 내 주거·산업 기반 확충, 도시 균형발전, 기반시설 확충 등을 목적으로 시행되며, 본 데이터는 이러한 사업의 행정적·공학적 추진 정보를 표준화하여 기록하고 있습니다.주요 항목으로는 사업명(BIZ_NM), 위치(PSTN), 사업규모(BIZ_AR) 등 사업의 기본 속성 외에, 사업준공연도(CMCN_YR), 준공일자(CMCN_YMD), 계약시작일자(CTRT_BGN_YMD), 계약종료일자(CTRT_END_YMD) 등 공정관리 및 일정관리 관련 정보가 포함되어 있습니다. 또한, 사업비(백만원)(TPCO) 항목을 통해 사업의 총 투자비 규모를 확인할 수 있으며, 사업추진현황(BIZ_STATE) 필드는 사업의 진행 단계(예: 승인, 착공, 준공, 분양 중 등)를 명확히 구분합니다.'
