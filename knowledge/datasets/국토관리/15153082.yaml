summary_user: 배수펌프장 한 곳을 한 행으로, 시군·시설명·주소·위경도와 설치일·설치목적, 전동기/엔진 펌프 규모·대수, 한전 수전용량·비상발전기·계약전력·전기요금 같은 설비 정보를 담는 시설 목록이다. 지자체 방재 담당자나 분석가가 집중호우 때 우리 시군의 배수펌프장이 어디에 몇 대의 펌프와 비상발전기를 갖췄는지 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소 이름 매칭, 위경도로 하천·침수 관련 데이터와 공간적으로 겹쳐 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 경기도(지자체)에서 제공하는 배수펌프장현황 관련 정보입니다.\""
