summary_user: 경기주택도시공사가 공급한 경기도 건설형 공공임대주택을 단지 한 건씩 담은 파일(csv, 약 6.7KB)로, 임대 유형·시군·주택명·주소·세대수·입주 시작일이 들어 있다. 주거복지 분석가나 임차 희망자가 '우리 시군에 행복주택이나 국민임대 단지가 어디에 몇 세대 있는가', '시군 간 공공임대 공급 편차는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 시군 이름이나 도로명·지번 주소, 우편번호를 매핑해 전월세 실거래나 다른 임대주택 단지 자료와 이어 쓴다.
description_portal: 경기주택도시공사에서 제공한 경기도 시군구별 건설형 공공임대주택 현황 데이터로써 지역별 공공임대주택 공급 규모와 유형별 주택 수 정보를 포함하고 있습니다. 공급유형에는 공공임대, 국민임대, 장기전세, 영구임대, 행복주택, 통합공공임대주택 등이 포함되어 있으며 시군구별 공급 현황을 통해 유형별 비율, 지역 간 공급 편차 등의 정보를 확인할 수 있습니다. 해당 데이터는 주거복지 정책 수립, 지역별 임대주택 공급 분석, 공공주택 수요 예측, 주거 취약계층 지원 정책 연구 및 공공임대주택 공급 균형성 검토 등에 활용 가능합니다.
