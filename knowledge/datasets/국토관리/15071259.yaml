summary_user: 서울특별시 도시계획상 보호지구로 지정된 구역을 도형 단위의 공간정보로 담으며, 도형별 분류 코드·결정고시 관리코드·명칭·면적·길이와 시군구 코드를 함께 싣는다. 부동산 사업자나 도시계획 분석가가 특정 필지나 개발 예정지가 서울시 보호지구에 걸리는지 미리 확인할 때 쓴다. 전역 조인 키가 확인되지 않아 다른 데이터와는 시군구 코드(SGG_CD)나 명칭을 대조해 붙이고, 같은 서울시 용도지역·지구 공간정보와는 같은 기관 코드 체계로 잇는다.
