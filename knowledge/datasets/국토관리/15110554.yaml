summary_user: 대구광역시 동구 안에서 진행 중인 정비사업을 등록번호별로 한 건씩 담아 구역 번호, 주소, 구역 면적(㎡), 사업 유형(재개발·재건축 등)을 제공하는 API입니다. 동구 주민이나 부동산 분석가가 우리 동네 어느 주소에 어떤 유형의 정비구역이 얼마나 넓게 지정돼 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 구역 이름을 매핑하거나 같은 기관 코드로만 이어 쓸 수 있다.
limits: 범위가 대구 동구 한 시군구에 한정되어 다른 지역 정비사업은 담지 않는다. 데이터는 이벤트 때 생성된 뒤 바뀌지 않는 주기로 분류되어 있어, 추진위·조합·관리처분 같은 사업 단계 변화를 실시간으로 추적하는 용도로는 확인이 필요하다. 법정동코드 같은 공통 키가 없어 다른 데이터와 붙일 때는 주소 문자열 매칭에 의존해야 한다.
