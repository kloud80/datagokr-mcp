description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 특정용도제한지구 현황 정보를 제공합니다. 특정 용도의 건축물 건축을 제한하여 주거 환경을 보호하거나 도시 기능을 유지하기 위해 지정된 지구의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 지구를 고유하게 식별하며, 라벨명은 지구의 명칭을 나타냅니다. 면적은 지구가 차지하는 면적을 제공하고, 길이는 선형 지구의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 건축 인허가 심사, 토지 이용 계획, 부동산 개발 검토, 용도 제한 관리, 도시 계획 수립 등에 활용됩니다.
