summary_user: 경기도 광주시 도시계획정보시스템에 등록된 특정용도제한지구를 지구(도형) 한 건씩 담은 시군구 단위 파일로, 관리번호·지구 명칭(라벨명)·면적·길이·등록일시를 담으며 실측 파일 크기가 372바이트로 매우 작다. 건축 인허가나 부동산 개발을 검토하는 사업자·분석가가 광주시 안에 특정 용도 건축이 제한되는 지구가 어디에 얼마 규모로 지정돼 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구코드나 지구 명칭으로만 광주시의 다른 도시계획(용도지역·지구) 현황 데이터와 맞춰 쓴다.
limits: 전역 조인 키가 없어 필지·건축물 단위 데이터와 직접 결합할 수 없고, 범위는 광주시 한 시군구에 그친다. 명세상 이벤트 때 생성된 뒤 바뀌지 않는 연간 주기 자료라 현재 지정 상태와 다를 수 있다.
