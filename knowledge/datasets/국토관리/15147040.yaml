summary_user: 낙동강수계 수변구역으로 지정된 용도지역지구 구역 정보를 담은 연속주제도이며, 각 지방자치단체가 구축한 자료를 국토교통부가 취합해 시도별 파일(SHP)로 제공한다. 사업자나 분석가가 특정 토지·하천 인근이 낙동강수계 수변구역에 들어가 개발·이용에 제약이 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시군구 식별값(SGG_OID)·행정구역 구분 같은 이름·코드 매핑이나 공간 중첩으로만 연결한다.
