summary_user: 인천광역시 계양구에서 내준 개발행위허가를 허가 건별로 담은 파일(csv)로, 허가일·개발행위 구분·행정동과 지번·지목·용도지역·허가 목적과 용도·허가면적을 필지 단위로 기록한다. 계양구 안에서 어느 동, 어떤 용도지역에서 형질변경 같은 개발행위 허가가 얼마나 났는지 개발 추이를 보려는 분석가나 사업 부지를 검토하는 사업자가 쓴다. 전역 조인 키(법정동코드·PNU 등)가 없어 다른 데이터와는 동명과 지번 문자열을 매핑하거나 같은 기관 자료로만 이어 쓴다.
limits: 계양구 한 곳만 다루므로 다른 시군구나 인천 전체 비교에는 다른 기관 자료가 필요하다. 필지 고유번호가 없어 토지·건축물 대장과 붙이려면 동명·지번을 직접 정제해 맞춰야 한다. 명세상 연간 주기로 갱신된다.
