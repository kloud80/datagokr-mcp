description_portal: 'NABIS에서 제공하는 지역균형발전 관련 교육영상은 지자체 공무원, 주민 리더, 연구자, 현장 실무자 등을 대상으로 지역 정책 역량 강화를 위해 제작된 콘텐츠입니다. 제공 데이터는 다음 항목으로 구성되어 있습니다. 분야( ‘도시재생’, ‘스마트시티’, ‘지역경제 활성화’, ‘사회적경제’, ‘디지털 전환’, ‘지방재정’ 등 주제별로 분류 등,), 출처기관(지방자치단체, 국책연구기관, 전문교육기관 등이 제작하여 NABIS에 제공), 제목( 교육영상의 공식 제목으로, 워크숍, 세미나, 강연 등의 명칭 포함), 제작년도/영상이 실제로 제작된 연도(예: 2021, 2022년 등)), 게시일 ( NABIS에 영상이 게시된 날짜(예: “2023-06-15” 등)), 영상 길이 및 형식 정보 (영상의 분량(분 단위), 슬라이드 병행 여부 등 참고사항 포함 가능), 요약 또는 설명 링크(URL)(영상 주제와 핵심 내용을 한눈에 확인할 수 있는 소개 정보).이 영상자료는 시청 대상자들이 온라인으로 접속해 정책 사례 분석, 현장 적용 사례, 경험 공유 형식으로 학습할 수 있도록 구성돼 있으며, 지역 정책 전략 수립과 사업 기획, 워크숍 교육 자원으로 활용하기에 적합합니다. 검색 및 필터 기능을 통해 원하는 주제와 지역, 제작기관별로 영상 목록을 확인하고, 필요한 교육 콘텐츠를 즉시 시청하거나 공유할 수 있습니다.'
