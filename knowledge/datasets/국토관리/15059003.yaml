summary_user: 경기도 시군별로 개인하수처리시설의 설치·관리를 대행하는 업체를 사업장 한 곳당 한 행으로 담고, 사업장명·인허가일자·영업상태·폐업일자·주소·전화번호·업종·위경도 좌표를 포함한다. 주민이나 정화조 관리가 필요한 건물주가 '우리 시군에서 지금 영업 중인 개인하수처리시설 관리업체는 어디인가'를 확인하거나, 분석가가 시군별 업체 분포와 폐업 추이를 살피는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 데이터나 하수처리 구역 자료에 이름·위치 기준으로 붙여 쓴다.
description_portal: 이 데이터는 경기도 31개 시군에서 개인하수 처리시설의 설치 및 관리를 대행하는 업체(소)에 대한 정보를 제공합니다. 주요 항목에는 사업장명, 시군명, 인허가일자 및 취소일자, 영업상태, 소재지 주소(도로명 및 지번), 면적, 전화번호, 환경업무구분, 업종구분, 종별, 주생산품, 배출 및 방지시설 조업시간과 연간가동일수, 위치좌표(WGS84 위도·경도, X/Y좌표) 등이 포함됩니다. 이 데이터는 비공공 하수처리시설의 위생관리 실태 분석, 환경오염 관리 행정의 기반 자료, 민간 환경서비스 시장 현황 파악 등에 활용될 수 있으며, 특히 배출시설 및 방지시설의 운영정보는 오염물질 관리 이행실태를 파악하는 데 중요한 지표로 작용합니다. 데이터는 Open API로도 제공되어 환경부, 지자체, 민간 연구기관 등 다양한 주체가 실시간으로 활용할 수 있습니다.
