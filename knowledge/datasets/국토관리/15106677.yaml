summary_user: 경기도 내 발달상권·골목상권별로 한국표준산업분류(10차) 업종의 분기별 추정 매출금액과 매출건수, 점포 수를 담은 모델 기반 집계 데이터다. 창업 예정자나 상권 분석가가 '이 상권에서 미용업이나 노래연습장의 분기 매출 규모가 어느 정도인가'를 업종끼리 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 행정동 코드(ADMDONG_CD)나 산업분류코드, 상권명으로 매핑해 다른 상권·인구 데이터와 잇는다.
description_portal: 경기도 시장상권 진흥원에서 제공하는 경기도내 발달/골목상권 점포의 산업분류코드(10차) 기준 업종별 추정매출(금액, 건수) 데이터 입니다.이 데이터는 경기도 내 발달된 골목상권에서 발생한 업종별 매출 추정치를 분기 단위로 정리한 자료입니다. 주요 항목으로는 기준연도, 기준분기, 상권ID, 상권명, 산업분류코드, 산업분류코드명, 매출금액, 매출건수 등이 포함되어 있으며, 이를 통해 특정 상권 내 다양한 업종의 경제활동 규모를 비교 분석할 수 있습니다. 예를 들어, '정부과천청사역_11번출구' 상권 내 미용업, 노래연습장, 당구장 등의 분기별 매출 데이터를 바탕으로 소상공인 지원정책 수립, 상권 활성화 전략 마련, 지역 맞춤형 창업 유망업종 파악 등에 활용할 수 있습니다. 산업분류코드는 한국표준산업분류(KSIC)를 기반으로 하며, 상권ID는 각 상권을 고유하게 식별하는 값으로 행정적 또는 분석적 목적에 따라 사용됩니다. 데이터는 경기도 상권분석 시스템 등을 통해 수집되었으며, 실제 매출자료가 아닌 모델 기반의 추정값이므로 분석 시 참고 자료로 활용해야 합니다.
