summary_user: 한국수자원공사가 관리하는 지자체별 지방상수도 정수장의 수질 정보를 일별(맛·냄새·색도·pH·탁도·잔류염소 6항목), 주별(7항목), 월별(60항목)로 담는 API이다. 시민이나 분석가가 우리 동네 정수장의 수돗물 수질검사 결과가 어떤지 확인하는 질문에 쓴다. 필드에는 지자체 코드(sgccd)와 지자체명(sgcnm)이 있어 같은 기관 코드나 이름 매핑으로 다른 상수도 자료와 이을 수 있지만, 전역 조인 키는 확인되지 않았다.
description_portal: 'ㅁ K-water에서 관리하는 지자체별 지방상수도 수질정보(일간, 주간, 월간) 제공ㅁ 제공항목 : 일별, 주별, 월별 수질 데이터  * 일별 : 6항목(맛, 냄새, 색도, pH, 탁도, 잔류염소)  * 주별 : 7항목(일반세균, 총대장균군, 대장균/분원성대장균, 암모니아성질소, 질산성질소, 과망간산칼륨소비량, 증발잔류물)  * 월별 : 60항목(미생물, 건강상 유해영향 유기물질에 관한 항목, 건강상 유해영향 무기물질에 관한 항목, 소독제 및 소독부산물질에 관한 항목, 심미적 물질)ㅁ 제공지점 : 지자체별 정수장ㅁ 보유기간 : 2010.1월~   * 지점별로 보유기간 상이함ㅁ 자료제공주기 : 일간, 주간, 월간ㅁ 제공형식 : 파일(XLS, CSV), 오픈API(XML, JSON)'
