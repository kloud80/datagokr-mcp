summary_user: 전산화된 지적도·임야도의 필지 경계를 이어 붙인 전국 단위 연속지적 도면(SHP)으로, 필지마다 지번과 필지고유번호(PNU)를 담고 시도별 파일로 내려받는다. 분석가가 "이 필지의 경계와 위치는 어디이고 주변 필지와 어떻게 맞닿아 있는가"를 지도 위에서 확인하거나, 필지 단위 통계를 공간에 표시할 때 쓴다. 필지고유번호(PNU)를 조인 키로 토지대장·공시지가·건축물 등 필지 단위 데이터와 이어 쓰며, 모든 필지 단위 데이터의 공간 기준 역할을 한다.
limits: 참고용 도면정보이므로 법적 경계 확정이나 측량 근거로 쓰지 않는다. API가 아니라 vworld.kr 로그인 후 시도별 SHP 파일을 내려받는 방식이며, 포털 활용신청·인증키와는 별개다.
