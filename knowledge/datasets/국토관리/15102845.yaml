description_portal: 2022년 7월 말 기준으로 경상북도 청도군 관내에 설치된 스마트워터미터기(원격검침 계량기)에 대한 위치 정보를 제공합니다. 해당 자료는 청도군이 상수도 검침의 효율성과 정확성을 높이고, 누수 및 이상사용 감지 등 수용가별 급수 현황을 실시간으로 모니터링하기 위해 도입한 스마트 계량기기의 설치 현황을 정리한 것입니다. 자료는 각 계량기의 고유 식별번호인 수용가번호, 계량기 설치 주소, 순번으로 구성되어 있으며, 스마트워터미터기가 청도군의 어느 지역에 얼마나 설치되어 있는지, 계량기 관리 대상이 어디에 분포하고 있는지 등을 체계적으로 파악할 수 있도록 설계되어 있습니다.
