summary_user: 한국산업단지공단 팩토리온에 등록된 공장을 건별로 담은 현황 파일로, 회사명·단지명·생산품·공장주소를 싣고 전국 220,705행 규모이다. 지역에 어떤 제조 공장이 어떤 산업단지에 있고 무엇을 생산하는지 찾아보려는 분석가나 사업자가 쓴다. 공장주소(address)를 조인 키로 삼아 주소 기준의 다른 자료와 이어 쓰며, 사업자번호나 산업분류 코드 같은 키는 이 파일 필드에 없다.
description_portal: '해당 공공데이터는 한국산업단지공단 공장설립온라인지원시스템(factoryon.go.kr) 내 등록된 기업체의 현황자료입니다. 공장설립온라인지원시스템에 등록된 공장의 회사명, 산업단지명, 생산품, 공장주소를 포함하고 있습니다. 월 마지막 일을 기점으로 현황 데이터를 출력합니다.- 개인정보 식별 가능성이 있는 항목(예: 사업자등록번호 등)은 불포함되어있습니다.데이터 건수가 많아 일반적인 엑셀, 메모장 등에서는 전체 내용이 표출되지 않을 수 있으므로,전용 데이터 분석 소프트웨어(R, Python, SPSS, Stata 등)를 활용하여 분석하시기 바랍니다.'
