description_portal: '한국수자원공사가 위탁 운영중인 하수처리장의 유입수 및 방류수의 일일 수질현황입니다. 본 자료를 통해 하수처리장의 수질 관리 현황을 점검할 수 있고, 연구자와 산업계는 수질 변동 특성과 오염 저감 효과를 분석하는 데 활용할 수 있습니다. 또한 본 데이터는 수질 개선 정책 수립, 연구 분석, 시설 운영 관리의 기초 자료로 제공되며, 일별 단위의 정보는 공정 안정성 평가와 환경보전에 중요한 근거가 됩니다.변경전 : 하수처리장 일일수질(http://opendata.kwater.or.kr/openapi-data/service/pubd/sewerage/waterQuality/day/list)변경후 : 하수처리장 일일 수질(http://apis.data.go.kr/B500001/sewerage/waterQuality/day/daylist)'
