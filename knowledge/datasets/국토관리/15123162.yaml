summary_user: 경기도 광주시 도시계획정보시스템에 등록된 농림지역 현황도형을 도형 한 건 단위로 담은 파일(csv, 약 23KB)로, 도형별 관리번호·라벨명·면적·경계 길이·등록 일시를 담는다. 토지 매입이나 개발행위 허가를 검토하는 사업자·분석가가 광주시 안에서 농림지역으로 지정된 구역이 어디이고 면적이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어서 시군구코드·시군구명으로 같은 광주시의 다른 용도지역(도시·관리·자연환경보전) 현황과 묶어 비교하는 정도로 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 농림지역 현황 정보를 제공합니다. 농업과 산림 자원의 보전과 육성을 위해 지정된 농림지역의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 지역을 고유하게 식별하며, 라벨명은 농림지역의 명칭이나 구분을 나타냅니다. 면적은 농림지역이 차지하는 면적을 제공하고, 길이는 경계선의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 용도지역 관리, 농업 정책 수립, 산림 보전 계획, 개발 행위 허가 심사, 토지 이용 규제 등에 활용됩니다.
