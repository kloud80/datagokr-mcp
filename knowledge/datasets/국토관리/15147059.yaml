summary_user: 산업집적활성화 및 공장설립에 관한 법률에 따라 지정된 용도지역 정보를 각 지방자치단체가 구축하고 국토교통부가 취합한 전국 범위의 공간 자료로, 시도별 SHP 파일로 내려받는다. 공장을 세우려는 사업자나 입지 분석가가 특정 지역이 산업집적·공장설립 관련 용도지역에 해당하는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 지역 이름·코드 매핑(행정구역 코드로 보이는 필드 등)이나 같은 기관 코드로만 이어 쓴다.
limits: 포털 활용신청으로 API를 받는 방식이 아니며, vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일로 받아야 한다. 필지번호 같은 전역 조인 키가 없어 지적·건축물 데이터와 바로 키로 결합할 수 없다.
