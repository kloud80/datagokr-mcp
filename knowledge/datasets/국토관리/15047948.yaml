summary_user: 전북특별자치도 정읍시에 있는 농공단지 입주업체를 업체 한 곳당 한 행으로 담은 명단 파일(CSV, 약 30KB)로, 농공단지명·업체명·도로명/지번 주소·전화번호·생산품을 담는다. 구직자나 영업 담당자가 '정읍의 어느 농공단지에 어떤 제품을 만드는 업체가 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 공장 등록 현황이나 산업단지 통계와는 업체명·주소나 농공단지명을 맞춰 붙여야 한다.
description_portal: 전북특별자치도 정읍시 소재 농공단지 입주업체 현황 자료중 농공단지명, 업체명, 소재지주소, 전화번호, 생산품에 대한 정보를 제공합니다.투명한 정보 공유를 통해 기업 간 협업과 상호 경쟁을 촉진할 수 있습니다. 또한, 입주 기업의 수요와 공급을 파악하고, 정책 및 지원 프로그램의 효율성을 높이는 데 기여합니다. 이를 통해 농공단지의 활성화와 경제적 성장을 도울 뿐만 아니라, 중소기업의 성장 가능성을 높이고 지역 경제에 긍정적인 영향을 미칠 것으로 예상됩니다.기타 궁금한 사항은 담당부서인 정읍시 미래산업과로 문의하시기 바랍니다.
