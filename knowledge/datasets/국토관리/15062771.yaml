summary_user: 통영시 도시정보시스템에 등록된 도시기준점을 한 점씩 담은 건별 파일로, 관리번호·기준점 명칭·행정읍면동·도엽번호와 베셀 및 GRS80 좌표, 고도, 측표 상황, 망실 여부를 기록한다(CSV 약 19만 바이트, 통영시 단위). 측량업체나 공간정보 담당자가 '현장 측량에 쓸 통영시 기준점이 어디에 있고 아직 남아 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 행정읍면동 이름이나 도엽번호로 다른 통영시 공간자료와 맞추고, 좌표(GRS80 또는 베셀)로 지도 위에 겹쳐 쓴다.
