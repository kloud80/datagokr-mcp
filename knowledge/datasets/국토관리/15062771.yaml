description_portal: 통영시 도시정보시스템에서는 도시기준점의 정확한 위치와 상태를 체계적으로 관리하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 기준점의 위치와 식별이 가능하며, 관리기관 정보는 유지관리의 책임 주체를 나타냅니다. 또한 기준점 명칭, 지형도 번호 및 명칭, 측표 상황 등은 기준점의 설치 상태와 관련 정보를 자세히 보여줍니다. 더불어 베셀 좌표, 측지기준계, 기준점 고도, 좌표원점 등은 공간정보 구축에 필요한 정밀한 기준 데이터를 제공하며, 기준점 망실 여부까지 포함해 현장 점검과 공간정보 정확도 유지에 활용되는 중요한 자료로 구성되어 있습니다.
