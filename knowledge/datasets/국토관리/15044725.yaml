description_portal: 본 데이터는 경상북도 내에 위치한 주요 댐의 현황 정보를 수록한 자료입니다. 다목적댐, 용수전용댐, 농업용댐 등 용도에 따라 구분된 댐별 정보를 포함하며, 항목으로는 댐명, 위치, 유역면적, 총저수량, 저수면적, 사업기간, 관리기관 등이 제공됩니다. 수록된 자료는 지역의 수자원 관리 및 댐 운영 실태를 파악하는 데 활용될 수 있으며, 한국수자원공사, 한국농어촌공사, 경주시 등 관리 주체에 따라 관리되고 있는 댐 현황도 확인할 수 있습니다. 본 데이터는 행정기관, 연구기관, 민간에서도 재난예방, 수자원계획 수립, 정책 개발 등의 목적으로 활용될 수 있도록 공공에 개방됩니다. 경상북도는 주기적인 자료 갱신을 통해 정보의 최신성과 신뢰성을 확보하고 있습니다. 자료 관련 문의는 054-880-4068로 연락주시기 바랍니다.
