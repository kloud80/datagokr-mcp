summary_user: 경상북도 내 주요 댐을 한 행씩 담은 현황 파일로, 다목적·용수전용·농업용 등 용도 구분과 댐명, 위치, 유역면적, 총저수량, 저수면적, 사업기간, 관리기관을 수록한다(CSV 약 1KB의 소규모 목록). 지역 수자원 계획이나 재난 대비를 검토하는 분석가가 "경북에 있는 댐은 어디에 있고, 규모(총저수량)는 얼마이며, 어느 기관이 관리하나"를 확인하는 데 쓴다. 실측 컬럼에 댐코드 같은 전역 조인 키가 없어서, K-water 댐 운영·수위 자료나 농어촌공사 저수지 저수율 자료와는 댐명이나 관리기관 이름을 맞춰 연결해야 한다.
limits: 댐코드가 없으므로 다른 댐 데이터와 붙일 때 이름 매핑이 필요하고, 표기 차이로 매칭이 틀어질 수 있다. 제원 현황 목록이라 수위·방류량·저수율 같은 운영 실적은 담지 않으므로 가뭄·홍수철 운영 판단에는 별도 운영 데이터가 필요하다.
