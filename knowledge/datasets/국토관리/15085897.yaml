summary_user: 주요 국가산업단지별로 음식료·섬유의복·석유화학·철강·기계·전기전자·운송장비·비제조 등 업종별 고용인원(명)과 합계를 담은 집계 파일로, 포털 설명상 산업단지별 약 40개 행과 14개 열로 구성된 분기 산업동향 통계다. 지역 제조업 경기를 보는 분석가나 지자체 담당자가 "어느 국가산단에서 전기전자·기계 업종 고용이 얼마나 되는가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 산업단지명(산업단지)을 이름으로 매핑해 같은 기관의 산단 원장이나 생산·수출·가동률 통계와 잇는다.
limits: 산업단지코드 같은 공통 키가 없어 다른 데이터와는 단지명 문자열 매칭으로만 연결되며, 표기 차이에 주의해야 한다. 전국 단위 비공간 자료라 좌표나 행정구역 코드로 지도에 바로 올릴 수 없고, 개별 기업 단위가 아닌 단지·업종별 집계다.
