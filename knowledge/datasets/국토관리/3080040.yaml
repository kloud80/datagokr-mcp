summary_user: 경상남도 거제시에 등록된 인터넷신문사를 한 곳당 한 행으로 담은 건별 목록으로, 신문사명·도로명/지번 주소·등록번호·등록일·발행인·연락처·홈페이지·위도·경도·기준일을 담는다(csv 약 9KB). 거제 지역에서 활동하는 인터넷 언론사가 어디에 몇 곳 있고 누가 발행하는지 확인하려는 주민·홍보 담당자·미디어 분석가가 보도자료 배포처를 찾거나 지역 언론 분포를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 결합하거나 신문사명·등록번호를 이름 기준으로 맞춰 이어 쓴다.
description_portal: 경상남도 거제시에 등록된 인터넷신문사의 현황을 제공하며, 신문사명, 주소, 등록번호, 등록일, 발행인, 연락처, 홈페이지, 위도·경도 좌표, 기준일 등의 항목으로 구성되어 있습니다. 지역 언론사의 분포 및 특성을 파악할 수 있으며, 언론 정책 수립, 미디어 산업 분석, 위치 기반 서비스 연계 등 다양한 분야에 활용될 수 있습니다. 특히 공간정보와 결합하여 지역별 언론 접근성 분석이나 미디어 인프라 현황 진단에 유용하게 활용됩니다. 또한, 지역 홍보 전략 수립이나 공공 커뮤니케이션 채널 확보를 위한 기초자료로도 활용 가능합니다.
