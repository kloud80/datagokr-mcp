description_portal: '○ 경상남도 거창군 하천현황에 대한 데이터로 구분(국가하천, 지방하천, 소하천), 하천명, 지정고시일, 지정고시번호, 소재지, 기점, 종점, 관리주체, 연장(미터)을 제공합니다.○ 데이터 기준일 : 2025. 09. 01.○ 국가하천은 국토 보전이나 국민 경제상 중요한 하천으로, 국가(농림축산식품부장관 등)가 직접 관리하는 하천을 말합니다. 지방하천은  지방의 공공 이익과 밀접한 관계가 있는 하천으로서, 시·도지사가 그 명칭과 구간을 지정하여 관리하는 하천입니다. 소하천은 하천법」의 적용을 받지 않는 소규모 하천으로, 평균 하천 폭이 2m 이상이고, 시점에서 종점까지의 전체 길이가 500m 이상인 것으로 특별자치시장·시장·군수 또는 구청장이 지정합니다.'
