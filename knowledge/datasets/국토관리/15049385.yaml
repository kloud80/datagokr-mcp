description_portal: '- 제주특별자치도개발공사에서 운영 중인 하천유출량 관측소입니다.- 하천유출량 관측소는 하천의 수위와 유속을 측정하는 기기로써 수위와 유속을 측정하고 하천단면적을 측량 후 하천의 유량(유출량)을 계산합니다.- 하천유출량 관측소는 제4교래교(제주시 조천읍 교래리 818), 천미천 상류지역에 설치되어 있으며 평상시는 건천을 유지하고, 강우가 발생하였을 때 하천 유출이 발생합니다.- 하천유출량을 관측함으로써 제주삼다수 취수허가 연장을 위한 지하수 영향조사 시 지하수 함양량을 도출하고, 공공데이터로써 인근 지역의 하천범람 모니터링 등에 활용 가능합니다.'
