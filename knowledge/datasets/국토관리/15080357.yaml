summary_user: 세종특별자치시 일반건축물의 지방세 부과기준인 시가표준액을 물건지(법정동·리, 본번·부번, 동·호) 단위로 담은 건별 원천 파일로, 과세년도와 연면적이 함께 들어 있다. 건물 소유자나 세무·부동산 분석가가 특정 건물의 재산세 과세표준이 되는 시가표준액이 얼마인지, 세종시 내 지역별 건축물 가액 분포가 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 건축물대장·공시지가 등 다른 데이터와는 법정동·본번·부번 같은 지번 정보를 이름·코드로 맞추거나 자치단체코드로만 연결한다.
description_portal: 세종특별자치시 일반건축물에 대한 지방세 부과기준인 시가표준액을 제공하는 데이터입니다.데이터는 시도명(세종시), 시군구명(세종시), 자치단체코드, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 시가표준액, 연면적, 데이터 기준일로 구성되어 있으며데이터 기준일은 2024년 6월로,  물건지별 재산가액(시가표준액)이 확인 가능한 데이터 입니다.본 데이터는 세종특별자치시 자치행정국 세정과(044-300-3517)에서 관리하는 데이터로,  1년 주기로 업데이트 될 예정입니다.
