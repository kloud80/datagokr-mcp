summary_user: 인천광역시 부평구에 등록된 저수조청소업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 업체명·전화번호·소재지 주소가 들어 있다. 부평구의 아파트·건물 관리자나 주민이 "우리 건물 물탱크 청소를 맡길 수 있는 구내 등록 업체가 어디이고 연락처는 무엇인가"를 찾을 때 쓰고, 분석가는 업체 분포를 볼 때 쓴다. 전역 조인 키나 코드가 없어서 다른 데이터와는 소재지 주소를 지오코딩하거나 업체명을 맞춰 보는 방식으로만 연결한다.
limits: 부평구 한 곳의 업체만 담으므로 인천시 전체나 다른 시군구와 비교하려면 각 지자체 파일을 따로 모아야 한다. 사업자번호 같은 공통 키가 없어 다른 업체 데이터와 정확히 매칭하기 어렵다.
