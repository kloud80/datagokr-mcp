summary_user: 기준연도와 시도별로 인구, 비상급수 필요량, 정부지원·지자체·공공지정 등 시설 유형별 비상급수시설 개소 수와 급수 용량(톤)을 담은 집계 데이터이며, 범위는 전국·비공간으로 분류된다. 재난 대비 담당자나 분석가가 '우리 시도의 비상급수시설 용량이 인구 대비 필요량을 채우는가'를 따지는 데 쓴다. 전역 조인 키는 없어 시도명(CTPV_NM)과 기준연도를 이름 매핑해 시도별 인구·상수도 통계와 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 경기도(지자체)에서 제공하는 비상급수시설현황 관련 정보입니다.\""
