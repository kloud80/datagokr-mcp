summary_user: 광양시의 상수도 요금 부과·징수·체납 현황을 구분별로 묶은 집계 파일로, 부과액·징수액·체납액의 건수와 금액, 징수율(퍼센트), 데이터기준일을 담는다(csv 412바이트의 작은 표). 시민이나 분석가가 '광양시 상수도 요금은 얼마나 걷히고 체납은 얼마나 남아 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지자체 요금징수 현황이나 같은 기관 상수도 데이터와는 시군구 이름으로 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 상수도 요금 부과 및 징수 현황을 종합적으로 제공하는 자료로, 부과액(건수·금액), 징수액(건수·금액), 징수율(퍼센트), 체납액(건수·금액) 등의 정보를 포함하고 있습니다. 이를 통해 국민은 상수도 요금의 부과 및 납부 현황을 확인할 수 있으며, 행정기관은 요금 징수율 제고, 체납 관리, 수도행정의 효율성 강화에 본 데이터를 활용할 수 있습니다. 또한 데이터 기준일이 명시되어 있어 최신성과 신뢰성을 확보하고, 공공데이터 개방을 통해 행정의 투명성을 높이며, 요금 부과·징수 과정의 공정성과 합리성을 제고할 수 있습니다. 연구기관 및 정책 수립 부서는 본 데이터를 기반으로 수도 요금 정책 개선과 합리적 요금 체계 마련을 위한 근거 자료로 활용할 수 있습니다.
