summary_user: 한국산업기술시험원이 2024년 8~9월 식물공장(컨테이너 1동·2동)에서 측정한 3상 인입 전류 중 T상 전류를 측정일시별로 담은 실측 원천 파일(csv, 약 33MB)로, 동별 메인값과 에어컨·공조기·양액기·조명·LED 등 설비별 전류값이 열로 나뉘어 있다. 스마트팜 연구자나 에너지 분석가가 "컨테이너형 식물공장에서 어떤 설비가 언제 전류를 많이 쓰고, 대기전력은 얼마나 되는가"를 따지거나 설비 이상 감지·예지보전 모델을 만드는 데 쓴다. 전역 조인 키(사업자번호·지역코드 등)가 없어 공장등록 등 다른 데이터와 직접 잇기는 어렵고, 같은 기관이 낸 식물공장 R상·S상 전류 데이터와 측정일 기준으로 맞춰 3상 부하 균형을 보는 식으로만 연결된다.
description_portal: 본 데이터는 한국산업기술시험원이 2024년 8월부터 9월까지 식물공장에서 수집한 전체 인입 3상 전류 중 T상(T상 전류)에 해당하는 정보입니다. T상전류는 3상 전력 시스템의 한 축을 구성하는 전류 흐름으로, 전력 부하의 균형 상태를 진단하고 설비의 정상 작동 여부를 판단하는 데 필수적인 전기적 지표입니다. 해당 데이터는 식물공장 내 스마트 온실 설비의 전력 사용 특성을 분석하고, 대기전력 사용 실태 파악 및 절감 모델 구축, 에너지 효율화 정책 수립 등에 활용될 수 있습니다. 또한, 대기전력 차단에 따른 전기요금 절감 효과 분석, 실시간 전류 모니터링 시스템 개발, 예지보전 기반 설비 유지관리 전략 수립 등 다양한 연구 및 산업적 응용이 가능하며, 스마트팜의 지능형 전력 운영을 위한 기반 자료로서의 가치가 높습니다.
