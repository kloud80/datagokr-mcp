summary_user: 광주광역시에서 추진 중이거나 완료한 도시개발사업을 구역(지구) 한 건당 한 행으로 정리한 표로, 2025년 3월 24일 기준 16개 지구(완료 9, 추진 중 7)의 위치·개발유형·구역면적·구역지정일·실시계획인가일·사업방식·시행자·사업기간·사업비·공동주택 수·계획인구를 담는다. 시민·부동산 분석가가 '우리 구에서 진행 중인 도시개발사업은 어디이고 언제 끝나며 공동주택이 몇 세대 들어오는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구역명이나 위치(자치구) 이름을 맞춰 연결해야 한다.
