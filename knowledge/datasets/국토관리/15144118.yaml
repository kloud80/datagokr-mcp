summary_user: '인천광역시 계양구의 건축물대장을 건물 하나씩 담은 파일로, 법정동·지번·도로명주소와 대장 구분·종류, 주용도·기타용도·대표용도(예: 단독주택, 다가구주택, 근린생활시설, 음식점)를 담는다. 계양구 안 특정 동이나 지번에 있는 건물이 어떤 용도로 등록돼 있는지, 동별로 다가구주택이나 근린생활시설이 얼마나 되는지 알아보려는 주민·사업자·분석가가 쓴다. 전역 조인 키(건축물 관리번호, 법정동 코드 등)가 없어서, 다른 건축물대장·공시지가·인허가 데이터와는 법정동명·주지번·부지번이나 도로명주소 같은 주소 문자열을 맞춰 이어 써야 한다.'
description_portal: 인천광역시 계양구 건축물대장 현황에 대한 데이터파일로서 시도명, 시군구명, 법정동명, 주지번, 부지번, 대지위치주소, 도로명주소,  대장구분코드명, 대장종류코드명, 주용도코드명, 기타용도내용, 대표용도코드명으로 구분되어 있습니다.대장종류코드명은 일반건축물이며, 주용도코드명은 근린생활시설, 단독주택, 제1종근린생활시설, 제2종근린생활시설이 있으며, 기타용도내용은 단독주택, 다가구주택, 근린생활시설 등으로 구분되어지며, 대표용도코드명은 단독주택, 다가구주택, 한의원, 음식점 등으로 구분되어 지고 있습니다.데이터파일에 대한 자세한 문의사항은 인천광역시 계양구 건축과(032-450-5581)로 문의주시기 바랍니다.
