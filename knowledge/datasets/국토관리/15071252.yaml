description_portal: '서울특별시 도시계획위원회 정보입니다.위원회 개최결과, 담당부서, 개최일, 개최결과 내역 등의 정보를 제공합니다.*용어설명- 도시계획위원회의 법적 근거 :  「국토의 계획 및 이용에 관한 법률」 제113조 등. 이 법률에 따라 국토교통부, 시·도, 시·군·구에 각각 도시계획위원회가 설치, 역할은 단순 자문이 아니라, 도시계획 결정의 타당성 검토와 심의를 통해 계획의 전문성과 공공성을 보장-  주요 기능과 역할 :  도시·군 기본계획, 관리계획 심의,  개발사업 및 기반시설 관련 심의, 도시개발사업, 정비사업, 기반시설 설치계획 검토, 환경·교통·경관 조화 여부 검토, 무분별한 개발 방지, 친환경·안전 도시 건설, 자문·권고 기능, 지자체장의 요청에 따라 정책적 자문 제공 등'
