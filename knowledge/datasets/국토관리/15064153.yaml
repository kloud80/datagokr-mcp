description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 공동주택 착공 계획 현황을 제공합니다. 생활권 및 블록 단위로 사업자, 주택유형, 착공시기, 세대수 등의 정보를 포함하고 있어, 공공기관(LH)과 민간 건설사(계룡건설, 우미건설 등)의 공급 주체별 주거공급 현황을 확인할 수 있습니다.이를 통해 행복도시 내 주택 공급 규모와 유형별(공공분양, 민간분양, 임대 등) 분포를 파악할 수 있으며, 연도별 착공 시기와 세대수를 기준으로 공급 추세를 분석할 수 있습니다. 본 데이터는 주거정책 수립, 수요예측 연구, 주택시장 분석, 생활권별 인프라 계획 등에 활용될 수 있습니다.
