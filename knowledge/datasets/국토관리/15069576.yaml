summary_user: 중앙토지수용위원회 토지재결정보시스템(LTIS)에 등록된 수용재결·이의재결·사업인정 사건을 사건번호 단위로 담은 전국 범위 건별 파일(csv, 약 3.2MB)이다. 개발사업 부지의 토지 수용이 언제 어떤 사업명으로 재결됐는지, 사건이 어느 처리 단계에 있는지를 확인하려는 토지소유자·사업시행자·보상 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 재결사업명 같은 이름 매핑이나 같은 기관의 시행자코드·처리상태코드·재결구분코드 코드표로만 이어 쓴다.
