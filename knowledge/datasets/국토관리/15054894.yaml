summary_user: '성남시에 입주한 제조업·가공업 업체의 공장등록 현황을 업체 한 곳당 한 행으로 담은 시군구 단위 명부로, 회사명·연락처·도로명 공장 주소·업종번호와 업종명·종업원수를 포함한다(CSV 약 63만 바이트). 성남시에서 특정 업종(예: 전자부품·의료기기) 공장이 어디에 몇 곳 있고 규모가 어느 정도인지 알고 싶은 사업자나 지역 산업 분석가가 쓴다. 실측 컬럼에 사업자번호·필지번호 같은 전역 조인 키가 없어, 다른 데이터와는 회사명·도로명 주소 매칭이나 업종번호를 업종분류 코드에 대응시키는 방식으로만 이어 쓴다.'
description_portal: 성남시 내 입주해 있는 제조업, 가공업 등 기업과 공장등록 현황에 대한 자료입니다.회사명, 전화번호, 팩스번호, 공장대표주소(도로명), 업종번호, 업종명, 종업원수 등의 항목으로 구성되어 있습니다.데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV 형식으로 제공되며, 누구나 무료로 다운로드하여 활용할 수 있습니다. 또한 오픈API를 통해 데이터를 자동 변환하여 활용할 수도 있습니다. 이 데이터는 성남시가 전기·전자·통신 분야를 중심으로 식품, 섬유, 의료기기, 화장품 등 다양한 제조업이 공존하는 복합형 도시 제조업 집적지임을 보여줍니다. 대부분의 업체가 지식산업센터에 입주한 소규모 기업이라는 점에서, 도심형 첨단 제조업 클러스터의 특성이 뚜렷하게 나타납니다.
