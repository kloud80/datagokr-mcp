summary_user: 서울특별시 하천기본계획의 사업 정보(계획 코드, 수립 연도, 사업명, 발주처, 사업 시작·종료일)와 하천별 기본계획 주요 정보(하천명, 하천 등급, 총연장, 계획 대상 연장, 수계·유역 이름)를 계획 단위 행으로 담는다. 시민이나 분석가가 '우리 동네 하천은 언제 기본계획이 세워졌고 계획 연장이 얼마인가'를 확인하거나, 서울 하천별 정비 계획 수립 이력을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 하천명(RVR_NM)이나 수계·유역 이름으로 하천 목록·하천구역 등 다른 하천 데이터와 이름 매칭으로만 이어 쓴다.
description_portal: '하천기본계획은 하천의 이용 및 관리에 필요한 기본적인 사항 등을 내용으로 하며 유역의 강우, 하천의 유량, 하도특성 및 이용현황 등을 조사 분석하여 하천의 종합적인 정비, 보전, 이용에 대한 계획을 수립합니다. 하천기본계획의 내용중 하천기본계획사업과 하천별 기본계획의 주요정보 조회할 수 있습니다.*용어설명정의: 하천법에 따라 하천의 종합적 관리·이용·보전을 위해 수립하는 중장기 계획입니다. 홍수 예방(방재), 하천환경·친수공간 조성, 하천구역 결정의 근거가 됩니다.대상: 국가하천은 국토교통부(국가), 지방하천은 시·도지사(또는 위임받은 시장·군수·구청장)가 수립합니다.법적 근거: 하천법 및 동법 시행령·시행규칙, 관련 지침(하천기본계획 수립 지침 등).'
