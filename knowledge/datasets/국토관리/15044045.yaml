description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터 JDC에서 운영하는 제주영어교육도시의 토지 공급 입찰 결과를 정리한 자료로, 공급 대상 토지에 대한 낙찰 정보와 가격 현황을 포함하고 있습니다. 데이터 항목은 연번, 토지용도, 필지번호, 면적, 낙찰자, 낙찰가격, 낙찰단가, 감정단가, 예정가격으로 구성되어 있으며, 낙찰자는 이름의 앞글자만 표기되고 나머지는 물결표시로 처리되어 예를 들어 카~, 샤~와 같은 방식으로 표시됩니다. 토지용도 항목에는 공동주택용지, 단독주택용지 블록형, 기타교육시설용지, 주차장용지, 종교용지가 포함되어 있어 다양한 용도의 개발 대상지를 확인할 수 있습니다. 면적은 제곱미터 단위로 제공되며, 낙찰가격은 해당 필지에 대한 실제 낙찰 금액을, 낙찰단가는 제곱미터당 낙찰가를 의미합니다. 감정단가와 예정가격은 사전에 설정된 기준 가격으로, 낙찰가와 비교해 입찰 경쟁도 및 시장 수요를 간접적으로 분석하는 데 활용할 수 있습니다. 이 데이터는 낙찰가 추이 분석, 공급 정책 검토, 입지별 투자 선호도 파악 등 다양한 행정적 분석과 전략 수립에 유용한 자료입니다.
