summary_user: 대전광역시 유성구의 2023년 행정동별 일평균 유동인구를 월 단위로 집계한 파일로, 통신사(KT) 기반 수치를 행정동·월·일평균 세 항목으로 담는다. 상권 분석가나 구청 담당자가 "유성구 안에서 어느 행정동에 어느 달 유동인구가 많은가"를 비교해 상권 활성화나 생활편의 서비스 입지를 정할 때 쓴다. 전역 조인 키(행정동 코드)가 없어 다른 데이터와는 행정동 이름을 매핑해 이어야 하며, 행정동 단위 인구·사업체 통계 등과 이름 기준으로 결합한다.
description_portal: 대전광역시 유성구 행정동별 일평균 유동인구에 대한 데이터를 제공합니다.해당 데이터는 행정동, 월, 일평군 항목을 포함하는 데이터로 2023년의 대전광역시 유성구 행정동별 통신사(KT) 유동인구 데이터이며, 월별 일평균 유동인구 데이터를 나타냅니다.해당 데이터는 지역별 유동인구와 이동 특성을 분석하는 데 활용할 수 있습니다.또한 상권 활성화 정책 마련, 생활편의 서비스 운영 등에 활용이 가능합니다.이외에도 상권 및 입지분석, 광고 및 마케팅 전략 수립, 유동인구 기반 서비스 개발 등 다양한 분야에 활용할 수 있습니다.
