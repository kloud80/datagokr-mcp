summary_user: 충청남도 부여군 관내 재난대응용 배수펌프장을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 2.5KB)로, 펌프장명·도로명/지번 주소·설치년도·설치목적·모터 펌프 규모·한전 전원공급 방식·비상발전기·계약전력, 고압/저압별 사용전력량과 전기요금 최대·최소값을 담는다. 군 방재 담당자나 분석가가 "설치된 지 오래된 펌프장 중 전력 사용이 많은 곳은 어디이며 비상발전기는 갖췄는가" 같은 노후도·가동 점검 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 하천 목록·수문 등 다른 하천 시설 데이터와는 펌프장명이나 주소(도로명·지번)를 매칭하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 충청남도 부여군 관내에서 운영 중인 재난대응용 배수펌프장의 상세 시설 현황과 에너지 운영 효율을 관리하기 위한 자료입니다. 구교배수장, 왕포배수펌프장 등 각 시설의 명칭과 도로명·지번 주소를 포함하여, 1991년 설치된 노후 시설부터 2016년 구축된 최신 시설까지의 **설치 연도 및 설치 목적(도시 침수 방지, 농경지 배수 등)**을 체계적으로 제공합니다.특히, 재난 대응의 핵심 지표인 **모터 펌프 규모(HP/kW)**와 함께 한전 전원 공급 방식, 계약 전력, 그리고 실제 가동에 따른 **사용 전력량 및 전기요금 정보(최대/최소)**를 상세히 수록하고 있습니다. 이러한 전력 사용 데이터는 배수펌프장의 실제 가동 빈도와 에너지 효율을 분석하는 중요한 근거가 되며, 홍수 및 자연재해 발생 시 저지대 침수 피해를 예방하기 위한 행정적 의사결정을 지원합니다. 주기적인 데이터 업데이트를 통해 방제 시설의 노후도를 진단하고 유지보수 계획을 수립함으로써, 군민의 생명과 재산을 보호하는 안전한 부여군 조성을 위한 기초 자료로 활용됩니다.
