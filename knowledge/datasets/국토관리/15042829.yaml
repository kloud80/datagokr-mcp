summary_user: 성남시 안의 공개공지를 한 곳씩 담은 목록으로, 각 행에 대지위치(지번주소)와 면적(제곱미터), 데이터기준일자를 기록한 개별 단위 원천 파일이다. 시민이나 도시계획 분석가가 '우리 동네 어디에 개방된 공개공지가 있고 규모는 얼마나 되나'를 확인하거나 판교·분당 등 지역별 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 주소 매핑(지오코딩 등)해 건축물대장·토지 정보와 잇는 방식으로만 연결한다.
description_portal: 성남시는 도시계획사업이나 개발행위 과정에서 확보된 **공개공지(公開空地)**를 통해 시민들에게 개방된 휴식 및 통행 공간을 제공하고 있습니다. 공개공지는 주로 대규모 개발부지, 준주거지역, 업무용 건축물 등에서 건축법 또는 도시계획 조례에 따라 조성됩니다. 성남시 전역에는 약 수십여 개소 이상의 공개공지가 분포하고 있으며, 대부분 판교, 분당, 정자동, 야탑동 등의 대규모 업무시설이나 주상복합단지에 집중되어 있습니다. 이들 공간은 보행통로, 휴게시설, 조경지, 소규모 광장 등의 형태로 구성되어 있습니다.
