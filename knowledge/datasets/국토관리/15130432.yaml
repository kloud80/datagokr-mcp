summary_user: 전국 지자체의 도시·군관리계획 결정(변경결정)과 지형도면 승인 고시를 한 건씩 담은 원천 파일로, 고시번호·고시일자·고시유형·제목·내용·진행상태와 원천 시군구코드가 들어 있다(약 35MB zip). 토지 소유자나 개발 분석가가 "우리 동네에 최근 용도지역 변경이나 도시계획시설 결정 고시가 났는가"를 확인하는 데 쓰고, 관리계획 결정 고시는 개발 가능성의 선행 지표로도 쓴다. 전역 조인 키는 없으며, 원천시군구코드로 행정구역 코드표와 연결하거나 같은 기관의 고시관리코드·계획관리코드로 UPIS 결정조서 등 관련 데이터와 이어 쓴다.
limits: 다른 기관 데이터와 직접 맞출 공통 키가 없어 시군구 코드나 이름으로 매핑해야 한다. 명세상 반기·이벤트 주기로 생성되므로 최근 고시가 바로 반영되지 않을 수 있다. 고시 텍스트 중심이라 필지별 토지이용 규제를 바로 판정하는 데는 쓰기 어렵다.
