description_portal: '국토교통부 도시계획 중 고시정보는 특정 지역의 토지이용계획이나 도시계획 등을 담은 도면이 포함된 고시정보로기본정보(시군구코드, 고시번호, 고시내용 등)와 도시계획, 토지이용계획에 대한 정보등으로 구성된 데이터 입니다.* 토지이용계획 : 용도지역, 용도지구, 용도구역, 도시계획시설 등 토지이용에 관한 정보가 포함됩니다.* 도시계획 : 도시계획시설, 도로, 공원, 녹지 등 도시계획 시설의 결정, 변경, 실효 등에 대한 내용이 포함됩니다.고시정보는 행정기관 및 자치단체에서 정한 일정한 사항을 공식적인 법률(국토계획법 또는 타법령)에 의한용도지역/지구/구역  및 도시계획시설, 지구단위계획 등 고시의 결정(변경결정) 및 지형도면 승인 고시정보를 일반에게 알리고자 하는 정보입니다.이를 통해 토지 소유자 및 관련 이해관계자들은 자신의 토지에 적용되는 계획을 명확히 파악할 수 있습니다.'
