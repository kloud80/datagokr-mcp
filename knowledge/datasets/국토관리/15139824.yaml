summary_user: 대전광역시 중구 소재 단독·다가구 등 개별주택의 기준연도별 공시가격을 소재지(지번)·동번호 단위로 담은 건별 파일이며, 대지면적·건물연면적과 산정 면적(제곱미터)을 함께 싣는다. 주민이나 분석가가 '중구의 우리 집(단독주택) 공시가격이 해마다 어떻게 바뀌었나'를 확인하거나 보유세·건강보험료·복지 기준 산정의 근거 가격을 살피는 데 쓴다. 전역 조인 키(PNU 등)가 컬럼에 없어 다른 데이터와는 소재지 주소 문자열 매핑으로만 이어 붙여야 한다.
description_portal: 본 공공데이터는 매년 1.1. 기준 대전시 중구 소재 단독 및 다가구와 같은 개별주택에 대한 지번, 공시가격 등을 제공하는 자료입니다. 매해 업데이트가 되는 내용으로 해당 내용은 현재와 다를 수 있습니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 면적으로 기재된 컬럼들은 제곱미터 기준으로 작성되어 있습니다.기준년도별 공시된 개별주택가격 또한 포함하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
