summary_user: 경상남도 하천관리시스템에서 2023년 기준으로 모은 하천구역 구분 정보를 하천별·구역별 한 행씩(하천명, 일련번호, 하천구분구역명) 담은 파일로, 포털 설명상 총 26,232건이며 현행화되지 않는 1회성 데이터다. 경남의 어떤 하천이 어떤 구역 이름들로 나뉘어 관리되는지 확인하려는 분석가나, 특정 하천 주변 토지의 하천구역 여부를 먼저 가늠하려는 사업자가 하천명으로 구역 목록을 찾는 데 쓴다. 실측 컬럼에 하천코드 같은 전역 조인 키가 없어 다른 하천 목록·제방·점용 데이터와는 하천명 같은 이름 매칭으로만 이어 쓴다.
description_portal: (데이터 수집목적 및 과정) 경상남도 하천관리 하천구역구분 데이터는 하천관리시스템에서 2023년을 기준으로  하천구역 정보를 수집 및 정제하여 제공하는 정보입니다. 하천명과 하천구분구역에 대한 정보를 통해 하천에 대한 구역이름을 정리할 수 있습니다.(데이터 구성 및 세부항목) 하천구역구분 데이터는 연번, 하천명, 일련번호, 하천구분구역명으로 구성됩니다. 총 26232건 입니다. 미집계 데이터는 공란 처리하였습니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다.
