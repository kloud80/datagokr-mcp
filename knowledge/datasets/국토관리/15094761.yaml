summary_user: 제주특별자치도 안 외식업체 이용자 수를 업종 타입별로 나누고 성별·연령대·요일·기준연월별로 집계한 통계로, 건별 원천이 아닌 집계 자료이며 포털 설명상 2019년 1월부터 2020년 12월까지를 담는다. 외식업 창업을 검토하는 사업자나 지역 분석가가 "제주에서 20~30대 여성이 주말에 많이 찾는 업종은 무엇인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종명이나 연월을 이름으로 맞추거나 같은 기관(제주특별자치도) 자료끼리만 이어 쓴다.
description_portal: '이 데이터셋은 2019년 1월 1일부터 2020년 12월 31일까지 제주특별자치도 내 외식업체를 업종 타입별로 구분하여, 성별과 연령대별 이용자 수를 집계한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 데이터는 CSV 형식으로 공개되어 있어 누구나 무료로 다운로드·활용할 수 있으며, 업종별 외식 이용자 구성(예: 한식, 중식, 패스트푸드, 카페 등), 인구집단별(연령대·성별) 소비 행태, 지역 외식 수요 패턴, 관광객 vs 도민 소비 비교, 외식업 시장 구조 분석 등에 활용 가능하다. 다만 2019–2020년 기간에 한정된 집계이며, 이후 외식 트렌드 변화, 업종 재편, 인구구조 변화 등은 반영되지 않을 수 있다는 한계가 있다.'
