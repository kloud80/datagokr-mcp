summary_user: 군포시 안에서 이뤄진 건축허가를 허가 건별로 담은 파일로, 대지위치·지목·대지면적·연면적·건폐율·용적률·구조·층수·주용도와 허가일자·착공처리일자·사용승인일자, 세대수·호수·가구수, 주차대수 등을 함께 싣는다. 지역 분석가나 부동산·건설 사업자가 '최근 군포시에서 어떤 용도·규모의 건축물이 허가·착공되고 있는가'처럼 지역 개발 흐름을 앞서 가늠하는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 대지위치(주소)나 허가번호를 이름·문자열로 맞춰 이어야 하며, 건축물대장 같은 국토 정보 원장과 잇는 것도 이런 주소 매칭에 기댄다.
limits: 표준 지번·건물 식별 코드가 없어 다른 데이터와 바로 조인되지 않고, 주소 문자열 매칭에 기대야 한다. 범위가 군포시 한 곳뿐이라 다른 시군구와 비교하려면 지자체별 데이터를 따로 모아야 한다.
