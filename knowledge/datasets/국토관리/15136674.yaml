summary_user: 경기도 용인시 수지구 안의 공원을 한 곳당 한 행으로 담은 목록 파일로, 관리번호·분류·공원명·주소·관할동·면적·데이터기준일자를 담는다. 주민이 '우리 동네(관할동)에 어떤 공원이 있고 면적은 얼마인가'를 확인하거나, 분석가가 수지구 동별 공원 분포와 녹지 면적을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 관할동 이름을 맞춰 붙여야 하며, 좌표 필드가 없으므로 지도에 올리려면 주소를 좌표로 바꾸는 작업이 필요하다.
limits: 수지구 한 곳만 다루므로 용인시 전체나 다른 구와 비교하려면 처인구·기흥구 목록을 따로 모아야 한다. 공통 코드 키가 없어 다른 공원·시설 데이터와는 이름·주소 매칭으로만 연결된다.
