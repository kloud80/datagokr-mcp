summary_user: 경기도 각 시군이 운영하는 지역화폐의 발행·이용 현황을 시군별·월별(기준년월)로 집계해 신규 카드 발행(가입) 수, 충전액, 사용액을 담는다. 분석가나 지자체 담당자가 '우리 시군의 지역화폐 충전액과 사용액이 월별로 어떻게 변했는가'를 비교하는 데 쓴다. 전역 조인 키는 없고, 시군코드(SIGUN_CD)·시군명과 기준년월을 이름·코드 매핑으로 맞춰 경기도의 다른 시군별 통계와 잇는다.
description_portal: 경기도 지역화폐 발행 및 이용 현황 데이터는 각 시군에서 운영하는 지역화폐의 발행과 이용 내역을 월별로 정리한 자료로, 시군명, 기준년월, 월별 신규가입자 수, 월별 충전액, 월별 사용액 등의 항목으로 구성되어 있습니다.※ 지역화폐 카드는 타 지역 거주자에게도 발급 가능하며, 충전금액이 0원인 카드도 존재하오니, 데이터 이용 시 참고하시기 바랍니다.※ 시군별 최초 발행 시기가 상이하며, 2019년 이후부터 발행하는 시군은 발행시기부터, 2019년 이전부터 발행하던 시군은 2019년 1월 데이터부터 제공합니다.
