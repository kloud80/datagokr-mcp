summary_user: 경상북도 영덕군 관내에 주소지를 둔 제조업체를 업체 한 곳당 한 행으로 담은 파일로, 회사명·전화·팩스·공장대표주소·업종명·생산품·데이터기준일자를 싣는다. 영덕군에서 특정 품목(농산물·수산물 가공 포함)을 만드는 업체를 찾거나 지역 제조업 업종 구성을 살펴보려는 사업자·분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어, 다른 공장등록 자료와는 회사명이나 공장대표주소를 매칭해 이어 쓴다.
description_portal: 관내에 주소지를 두고 있는 제조업체 현황을 순번, 회사명, 전화번호, 팩스번호, 공장대표주소, 업종명, 생산품, 데이터기준일자로 표시하였습니다.전화번호, 팩스번호에서 개인정보보호를 위해 휴대폰 정보는 제외한 내역이거나 관리되고 있지 않아 공란처리하였습니다.  "제조업" 업종코드는 한국표준산업분류(KSIC) 업종코드에서 찾을 수 있고 생산품은 실제 제조업체에서 생산되는 품목을 나열하였습니다.영덕은 농촌지역과 어촌지역이 포함되어 생산품에 일반공산품 외에 농산물, 수산물가공이 다수 포함되어 있습니다.
