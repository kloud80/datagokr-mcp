summary_user: 충청남도 서천군의 2021~2024년 일반건축물 시가표준액 과세자료로, 건물(동·호) 단위로 물건지 지번, 시가표준액, 연면적, 결정일자를 과세년도별로 담는다. 재산세·취득세 부담을 가늠하려는 건물 소유자나 분석가가 "서천군 이 건물의 과세 기준 금액이 연도별로 얼마이고 면적당 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 법정동·법정리·본번·부번 지번 이름 매핑이나 자치단체코드로만 건축물대장·공시지가 등 다른 국토 자료와 연결한다.
description_portal: 2021년~2024년  서천군 일반건축물 시가표준액에 대한 과세자료로, 물건지 및 시가표준액, 연면적을 포함한 과세자료입니다.일반건축물 시가표준액은 실제 거래가격을 의미하는 시세와는 달리, 건축물에 부과되는 재산세나 취득세와 같은 지방세를 매길 때 기준이 되는 과세용 금액이다. 이 금액은 건물의 구조, 용도, 면적, 경과 연수, 지역 보정률 등 다양한 요소를 반영해 산정되며, 국토교통부가 매년 고시하는 ‘건물 기준시가 산정 방법’에 따라 각 지자체가 동일한 방식으로 계산한다. 건물의 기초 단가는 철근콘크리트, 철골, 조적 등 구조별로 다르게 정해지며, 근린생활시설, 공장, 창고, 사무실 등 용도에 따라 또 다른 기준 단가가 적용된다. 이렇게 산정된 기준 단가에 건물의 연면적을 곱해 기본 가액을 구한 뒤, 건물이 지어진 지 얼마나 되었는지를 나타내는 ‘잔가율(감가상각률)’을 적용하여 시간 경과에 따른 가치 감소를 반영한다. 여기에 지자체 물가나 지역적 특성을 고려한 ‘지역 보정률’을 더해 최종 시가표준액이 결정된다.이 시가표준액은 세무 계산을 위한 행정적 산정값이기 때문에 실제 시장가격보다 낮게 책정되는 경우가 많으며, 시장에 따라 변동하는 시세와 달리 동일한 산정 기준을 적용하여 매년 비교적 안정적으로 고시된다. 일반 건축물 시가표준액은 위택스(Wetax)에서 재산세나 취득세 예상 조회를 통해 확인할 수 있고, 지자체 세무과에서도 개별 건축물의 시가표준액을 확인해 준다. 건물은 토지와 달리 개별공시가격이 존재하지 않기 때문에, 세금을 계산할 때는 이 시가표준액이 사실상 ‘공시가격 역할’을 하게 된다. 원한다면 건물의 구조, 용도, 면적, 준공연도 등 정보를 토대로 예상 시가표준액을 직접 계산해 주는 것도 가능하다.
