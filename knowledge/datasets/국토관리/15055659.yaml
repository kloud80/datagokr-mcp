summary_user: 전북특별자치도 전주·익산·정읍 농수산물 도매시장의 연도별 거래량과 거래액을 지역별로 담은 집계 파일로, 2017년부터의 값이 들어 있고 파일 크기는 172바이트로 작다. 지역 유통 분석가나 지자체 담당자가 '전북 도매시장 세 곳 가운데 어디의 거래 규모가 커지고 줄었나'를 연도별로 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 연도와 지역 이름(전주·익산·정읍)을 직접 맞춰 이어 써야 한다.
description_portal: 이 데이터는 전북특별자치도 내 주요 농수산물 도매시장인 전주, 익산, 정읍 지역의 연도별 거래 현황을 나타냅니다. 2017년부터 시작하여 각 지역에서 발생한 거래량과 거래액이 연도별로 기록되어 있어, 지역별 유통 규모와 변화를 비교·분석할 수 있는 기초 자료로 활용됩니다. 거래량은 해당 연도에 판매된 농수산물의 총 물량을 의미하며, 거래액은 이에 따른 총 거래 금액을 나타냅니다. 이 데이터를 통해 연도별 경기 상황, 지역 간 유통 규모 차이, 도매시장 활성화 수준 등을 파악할 수 있으며, 농수산물 수급 계획 수립, 물류 인프라 개선, 지역 경제 분석 등의 정책 자료로도 활용 가능합니다. 또한 거래량과 거래액 간의 상관관계 분석이나 추세 예측 모델 개발 등의 학습 데이터로도 적합합니다.
