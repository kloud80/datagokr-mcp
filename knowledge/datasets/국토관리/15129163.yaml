summary_user: 충청남도 금산군에 있는 일반산업단지와 농공단지(금산일반산업단지, 복수·금성·추부·인삼약초특화농공단지 등 5곳)를 단지 한 곳당 한 행으로 정리한 현황 파일입니다. 단지명, 소재지, 사업 시작·종료일, 입주업종, 입주업체수, 관리사무소 연락처, 면적, 준공여부를 담습니다. 기업 유치 담당자나 입지를 찾는 사업자가 금산군의 각 단지 규모와 입주업종, 입주 업체 수를 비교할 때 씁니다. 전역 조인 키가 없어서 전국산업단지및공장정보표준데이터나 국토부 산업단지 현황과는 단지명과 소재지 주소를 맞춰 대조해야 합니다.
