description_portal: 울산광역시 북구 등급별 빈집정보 현황입니다.우리 구는 총 27개의 법정동으로 구성되어 있으며, 그 중 빈집이 없는 2개동을 제외한 25개동의 빈집현황에 대한 정보입니다. 등급별(1등급, 2등급, 3등급)로  구분되어있습니다.빈집을 리모델링하여 인구유입정책으로 활용할 근거자료로서의 가치를 가지고 있으며, 빈집이 많은 동을 대상으로 도시재생사업을 구성할 수도 있습니다.재산과 관련한 정보이므로 주소지까지는 공개가 불가하여 등급별, 법정동별 현황정보를 공개합니다.더 궁금한 사항은 건축주택과(빈집 담당), 미디어정보과(공공데이터 담당)로 문의주시기 바랍니다.
