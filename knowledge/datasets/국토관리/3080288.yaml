summary_user: 양주시 내 산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일로, 단지명·업체명·대표자·도로명주소·지번주소·업종명을 포함하며 포털 설명 기준 216행이다. 구직자나 영업 담당자가 '양주시 어느 산업단지에 어떤 업종의 기업이 입주해 있나'를 확인하거나, 분석가가 단지별 업종 분포를 파악하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 공장 등록 등 다른 데이터와는 업체명·주소 문자열 매칭이나 단지명 기준으로만 이어 쓴다.
description_portal: 경기도 양주시_산업단지 입주기업 현황 데이터는 양주시 내 산업단지에 위치한 기업들의 정보를 종합적으로 제공하는 자료다. 총 216행으로 구성되어 있으며, 주요 항목으로는 단지명, 업체명, 대표자, 도로명주소, 지번주소, 업종명 등이 포함된다. 이를 통해 산업단지별 기업 분포 현황을 파악할 수 있으며, 각 기업의 위치 및 업종 특성을 분석할 수 있다. 특히 도로명주소와 지번주소가 함께 제공되어 GIS 기반의 공간분석 및 물류·교통계획 수립에도 활용 가능하다. 대표자 정보와 업체명은 기업 신뢰성을 검증하거나 행정기관이 관리·지원 정책을 수립하는 데 유용하다. 또한 업종 분류는 지역 산업구조를 이해하고 특정 분야의 집중도 및 발전 가능성을 판단하는 데 중요한 지표로 작용한다. 이 데이터는 기업 지원 정책, 산업단지 관리, 중소기업 육성, 지역경제 활성화 등 다양한 행정·정책적 의사결정 과정에서 핵심 기초자료로 활용될 수 있다.
