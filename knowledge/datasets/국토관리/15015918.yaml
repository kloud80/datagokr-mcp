summary_user: 인천광역시 제물포구(포털 설명상 동구 관내)에 등록된 공장을 한 곳씩 나열한 공장등록 현황 파일로, 회사명·공장 지번 주소·사업유형·전화번호를 담는다. 지역 산업 정책 담당자나 분석가가 '관내 공장이 어느 동네에 몰려 있고 어떤 사업유형이 많은가'를 확인하거나, 지원사업 안내 대상 공장의 연락처를 찾는 데 쓴다. 전역 조인 키(사업자등록번호·업종코드·필지고유번호)가 없으므로, 다른 데이터와는 지번 주소를 지오코딩하거나 회사명으로 맞춰 연결해야 한다.
description_portal: 인천광역시 동구 관내에 등록되어 있는 공장 현황 데이터로, 회사명, 공장대표주소(지번),업종명,사업유형, 전화번호 등 항목을 게시하였습니다. 이를 통해 지역 내 공장의 분포 현황을 파악할 수 있으며, 산업 구조 및 사업 유형별 특성 분석에도 활용이 가능합니다. 특히, 도로명 주소 기준의 위치 정보는 공장의 물리적 분포와 접근성을 분석하는 데 유용합니다. 또한 사업 유형을 통해 제조업, 가공업 등 다양한 업종별 현황을 확인할 수 있어 기업 유치 및 정책 수립 시 기초 자료로 활용될 수 있습니다. 전화번호 항목은 기업 간 협업이나 산업 지원을 위한 직접적인 커뮤니케이션 경로 확보에 기여할 수 있습니다.
