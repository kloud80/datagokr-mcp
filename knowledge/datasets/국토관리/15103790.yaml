summary_user: 경상남도 양산시 관내에서 추진된 일반농산어촌개발사업을 사업 한 건당 한 행으로 정리한 소규모 파일(csv, 약 2KB)로, 사업 구분·진행 여부·사업비(억원)·사업위치·사업기간을 담는다. 양산시 주민이나 지역개발 분석가가 "우리 시 농산어촌개발사업은 어디서 얼마의 예산으로 언제까지 진행되며 끝났는가"를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 사업위치의 지명이나 같은 기관(양산시) 기준으로 이름을 맞춰 연결해야 한다.
limits: 양산시 한 곳만 다루므로 다른 시군과의 비교나 전국 현황 파악에는 쓸 수 없다. 사업위치는 좌표가 아닌 지명 텍스트여서 공간 분석이나 다른 데이터와의 키 조인이 바로 되지 않는다.
