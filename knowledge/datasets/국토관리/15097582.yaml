summary_user: 강릉시에서 추진 중인 재개발·재건축 사업을 단지 한 건당 한 행으로 정리한 파일로, 사업명·단지명·지번 위치·대지면적·층수·동수·세대수를 담는다(파일 크기 586바이트로 소규모). 강릉시 아파트·연립 재건축이 어디서 어느 규모로 진행되는지, 향후 공급될 세대 수가 얼마인지 알고 싶은 주민·부동산 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 단지명·지번 주소(단지위치)를 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: '강원특별자치도 강릉시의 재개발·재건축 사업 현황을 정리한 데이터로, 단지별 위치, 면적, 세대수 등 기본 정보를 한 번에 확인할 수 있도록 구성된 자료입니다. 노후 주거지 정비 현황과 주거환경·도시 구조 변화를 파악하는 데 활용할 수 있습니다.번호: 각 재개발·재건축 사업을 구분하기 위한 일련번호사업명: 추진 중인 재개발·재건축 사업의 명칭(예: ○○아파트 재건축, ○○연립 소규모재건축 등)단지명: 정비 대상 아파트·연립주택 단지의 이름단지위치: 사업 대상 단지가 위치한 지번 주소(○○동, ○○리 일원 등)대지면적(제곱미터): 재개발·재건축 대상 부지의 전체 면적(㎡ 단위)층수: 단지를 구성하는 건축물의 층수(최고층 기준 등으로 활용 가능)동수: 단지를 이루는 건물 동(棟)의 개수세대수: 재건축·재개발 후 공급되거나 계획된 전체 세대 수데이터기준일자: 재개발·재건축 사업 현황 정보가 확인·정리된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 내 노후 주거지 정비 규모와 위치를 파악하고, 향후 주택 공급 계획, 기반시설·교통·생활SOC 수요 분석, 주거환경 개선 및 도시정비 정책 수립 등에 활용할 수 있는 기초 통계자료입니다.'
