summary_user: 경상남도 하천관리 시스템의 하천구역 지정 현황을 하천별 구역 건별로 담은 파일로, 하천명·명칭·지정연월일·고시번호와 상류·하류 끝점의 주소·지번·측점번호, 구역 거리와 면적, 하천구역 법 구분을 기록한다(CSV 약 2.4MB, 경상남도 범위). 토지 소유자나 건축 사업자가 특정 지번이 하천구역 안에 드는지, 언제 어떤 고시로 지정됐는지 확인하는 데 쓰고, 분석가는 하천별 구역 면적 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 하천명이나 상·하류 지번 주소를 기준으로 하천 목록·제방·점용 등 같은 기관 하천 데이터나 지적·공간정보와 이름·주소 매핑으로 이어 쓴다.
limits: 하천코드(WAMIS) 같은 공통 코드가 없어 다른 하천 데이터와 정확히 연결하려면 하천명·주소를 직접 맞춰야 한다. 구역 경계는 상·하류 끝점의 지번과 측점으로만 나와 있어 경계 폴리곤이 필요하면 국가공간정보포털 등 공간 자료를 따로 봐야 한다.
