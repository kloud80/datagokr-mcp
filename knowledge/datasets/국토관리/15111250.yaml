summary_user: 서울 양천구 관내 공개공지를 한 곳씩 담은 건별 목록으로, 건축물명·도로명/지번 주소·위도·경도·행정동·편의시설·특이사항·사진 이미지명을 담는다. 주민이 우리 동네에서 쉬어 갈 수 있는 민간 건축물 개방 공간과 그 편의시설을 찾거나, 분석가가 행정동별 공개공지 분포와 보행·휴식 공간 부족 지역을 살펴보는 데 쓴다. 전역 조인 키는 없으므로 행정동명·행정동 ID나 주소를 매핑하거나 좌표로 다른 공간 데이터와 겹쳐 쓴다.
limits: 양천구 한 시군구만 다루므로 다른 자치구나 서울 전체 비교에는 다른 기관 자료를 따로 모아야 한다. 실측 컬럼에 표준 조인 키가 없어 다른 데이터와 붙일 때는 주소·행정동명 매칭이나 좌표 기반 공간 결합이 필요하다. 포털 설명에 나온 면적·조성 연도·개방 여부·관리 주체는 필드 목록에서 확인되지 않는다.
