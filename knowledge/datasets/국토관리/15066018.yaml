summary_user: SH공사가 예정한 용역사업 중 예산이 명시된 건을 한 줄씩 담은 발주계획 파일로, 발주 예정 연월·용역명·계약방법·예산액(천 원)·담당 부서명을 담는다. 입찰을 준비하는 용역업체가 'SH공사가 다가오는 분기에 어떤 용역을 어느 부서에서 얼마 규모로 발주하려 하는가'를 미리 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용역명·부서명 같은 이름 매칭이나 같은 기관(SH공사) 기준으로만 이어 쓴다.
description_portal: '본 데이터는 서울주택도시공사(SH공사)에서 예정하고 있는 각종 용역사업의 발주 계획에 관한 정보로, 예산이 명시된 건을 대상으로 제공합니다. 항목에는 발주 예정 월, 용역명, 계약방법, 예산액(단위: 천 원), 그리고 발주를 담당하는 부서명이 포함되어 있습니다. 이를 통해 SH공사가 향후 어떤 용역을 수행할 계획인지 사전에 파악할 수 있으며, 용역의 규모와 소요 예산, 추진 주체를 분석하는 데 유용한 자료가 됩니다. 다만, 발주 계획은 내부 사정이나 외부 여건에 따라 변경될 수 있으므로 확정된 사업으로 간주해서는 안 됩니다. 이 데이터는 공공기관의 용역 수요 예측, 민간 기업의 입찰 준비, 예산 집행 계획 파악 등 다양한 목적으로 활용할 수 있습니다.'
