summary_user: 한강홍수통제소 AI홍수예측에 쓰는 조위 관측소의 제원(관측소 코드·명칭·위도·경도)을 관측소 한 곳당 한 행으로 담은 파일 데이터로, 전체 54건이 전국 범위로 수신되었다. 분석가나 홍수예측 담당자가 조위 관측소가 어디에 있는지 지도에 표시하고 예측 결과를 공간적으로 살펴볼 때 쓴다. 위도·경도(coord)를 키로 다른 좌표 기반 자료와 겹쳐 볼 수 있고, 관측소 코드는 조위 관측 자료와 이어 쓰는 기준이 되지만 명세상 코드표는 없다.
description_portal: '기후에너지 환경부 한강홍수통제소의 조위 관측소 기본 정보를 정의하고 관리하는 데이터 항목으로, AI 홍수예측과 연계하여 조위 제원, 조위 명칭, 조위 코드, 관측소 좌표위치(LON, LAT)등 핵심 정보를 포함한다. 이를 통해 시스템과 지도 연계 등을 통해 관측소 위치를 시각화하고 예측 결과를 공간적으로 분석할 수 있다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
