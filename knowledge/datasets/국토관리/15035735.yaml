summary_user: 경상북도 안동시에서 현재 시공 중인 건축 현장을 한 건씩 담은 파일로, 대지위치·건축구분·주용도·착공예정일과 착공처리일, 설계·감리·시공 사무소명, 데이터기준일자가 들어 있으며 범위는 안동시 한 시군구의 필지·건물 단위입니다. 주민이나 지역 건설업체가 "우리 동네 어느 필지에서 어떤 용도의 건물이 공사 중이고, 시공사와 감리자는 누구인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 건축·필지 데이터와는 대지위치 주소 문자열이나 업체명을 맞춰 붙이거나 같은 기관(안동시) 기준으로만 이어 쓴다.
limits: 공통 식별 키가 없어 건축물대장·인허가 데이터와 정확히 연결하려면 주소·이름 매칭이 필요하다. 범위가 안동시에 한정되며, 포털 설명과 달리 실측 필드에는 준공예정일이 보이지 않으므로 공사 종료 시점 분석에는 쓰기 어렵다.
