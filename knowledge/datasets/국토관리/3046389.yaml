summary_user: 개발제한구역도에 해당하는 구역의 명칭, 고시일자, 기관 등을 vworld 외부 API로 내려주는 전국 범위의 비공간 데이터이다. 도시민이나 사업자가 어떤 지역이 개발제한구역으로 지정돼 있는지, 용도구역 규제를 확인할 때 쓴다. 전역 조인 키가 없어 시도명(sido_name)·시군구명(sigg_name) 같은 이름 매핑이나 같은 기관 코드로만 다른 데이터와 이어 쓰며, 국토계획법상 용도지역·지구·구역 규제를 다루는 데이터와 함께 본다.
description_portal: 개발제한구역은 도시의 무질서한 확산을 방지하고 자연환경을 보전하여 도시민의 건전한 생활환경을 확보하기 위하여 도시의 개발을 제한할 필요가 있는지역을 뜻하며, 개발제한구역도는 개발제한구역 명칭, 고시일자, 기관 등의 정보를 제공.RestAPI로 호출하면 json/xml로 데이터를 반환합니다
