summary_user: 대전도시공사가 공급한 순환형 임대아파트의 임대현황을 동·호 단위로 담은 파일로, 호실별 임대면적·전용면적·공용면적, 임대구분, 보증금, 월임대료가 행마다 들어 있다(CSV 약 110KB). 대전에서 저소득층 공공임대 입주를 알아보는 시민이나 공공임대 정책을 보는 분석가가 '이 단지의 호실별 보증금과 월세 수준은 면적에 따라 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 임대주택·전월세 데이터와는 임대대상명(단지명)이나 같은 기관 이름으로 맞춰 이어 써야 한다.
description_portal: 대전도시공사는 저소득층의 주거 안정을 지원하기 위해 순환형 임대아파트를 건설하여 임대주택으로 공급하고 있습니다. 경제적 여건으로 인해 주거 확보가 어려운 시민들이 도심 지역에서 안정적으로 거주할 수 있도록 지원하는 사업입니다.입주대상은 소득과 주거 여건에 따라 사회적 배려계층을 중심으로 선정되며, 세대별 소득수준과 자산요건을 기준으로 세부 자격이 구분됩니다. 장애인, 고령자, 한부모가정 등은 별도 기준을 적용받아 지원받을 수 있습니다.임대기간은 2년 단위로 입주 자격을 검증하며, 요건 충족 시 최대 50년까지 거주가 가능합니다. 이를 통해 주거 취약계층의 장기적이고 안정적인 생활 기반을 마련하고자 합니다.※ 자세한 사항은 홈페이지(https://www.dcco.kr/web/contents/view.do?mId=239)를 참고하시기 바랍니다.
