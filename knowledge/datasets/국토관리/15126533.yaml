description_portal: 2017년 기준 개발제한구역 내 시군구별 토지활용현황(지목별 면적, 건축물 별)* 개발제한구역 토지관리계획 수립년도마다 갱신되는 자료입니다.* 개발제한구역 토지활용 현황 데이터를 제공하는 서비스 입니다. 개발제한구역 이란?도시의 무질서한 확산을 막고 도시 주변의 자연환경을 보호하여 도시민의 건강한 생활환경을 조성하기 위해 도시 개발을 제한할 필요가 있는 지역이나 국방부장관의 요청으로 안보상 개발이 제한될 필요가 있는 지역을 지정하는 것을 의미합니다. 도시계획 입안 시 중요한 정책 자료로 활용되며, 주민지원사업비, 개발제한구역 관리비, 지방교부세 산정 시 기초 자료로도 사용되고 있습니다.
