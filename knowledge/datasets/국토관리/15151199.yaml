summary_user: 승강기 한 대(승강기고유번호)마다 선임된 안전관리자의 이름, 선임일, 교육 이수일, 교육 유효기간 시작일과 종료일을 담은 전국 범위의 건별 조회 API입니다. 건물 관리자나 점검 담당자가 특정 승강기의 안전관리자가 선임돼 있는지, 그 관리자의 법정 교육 유효기간이 끝나지 않았는지 확인할 때 씁니다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 기관의 다른 승강기 데이터와 승강기고유번호(elevatorNo)로 맞춰 보는 방식으로만 이어 쓸 수 있습니다.
