description_portal: 경상북도개발공사 인허가 현황입니다. 사업명, 인허가명, 인허가기관, 신청일, 결정일, 심의 결과 내용이 포함되어 있습니다. 공사의 인허가기관은 경상북도 내의 도청, 군청, 시청 등 이며, 과학기술정보통신부 인허가도 일부 있습니다. 심의결과는 승인, 조건부허가, 조건부가결을 획득했습니다. 신청일로 부터 소요기간은 대부분 1개월 이내이나 몇몇 사업은 1개월 이상 소요된 사업도 있습니다. 한국문화테마파트(안동지구)실시계획(변경)은 신청일 부터 결정일 까지 약 7개월정도 소요된 사업도 있습니다.
