summary_user: 국토계획법상 도시관리계획으로 결정된 용도지역 중 관리지역의 경계를 시도별 공간 파일(SHP)로 담은 전국 범위의 공간 데이터로, 도면 단위 객체마다 고시일자(NTFDATE)·별칭·비고 등 속성이 붙는다. 토지 매입이나 개발을 검토하는 사업자·분석가가 특정 필지가 관리지역에 속하는지, 관리지역이 어디에 분포하는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공간 중첩(도시·농림·자연환경보전지역 등 다른 용도지역 레이어나 지적도와 겹쳐 보기)이나 시군구 식별값(SGG_OID)·행정구역 이름 매핑으로 이어 쓴다.
limits: 포털 활용신청이나 API 호출이 아니라 vworld.kr에 로그인한 뒤 시도별 파일을 내려받아야 한다. 전역 조인 키가 없어 행정구역 코드로 바로 결합할 수 없고, 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
