summary_user: 경상북도 영천시에 있는 면직물·직물 생산 공장을 공장 한 곳당 한 행으로 담은 소규모 CSV 파일(약 8KB)로, 회사명·전화번호·생산품(원단, 타포린, 타올 등)·용지면적·건축면적·지번 주소·대표업종번호와 업종명을 기록한다. 영천 지역 섬유 제조업체를 찾는 사업자나 지역 섬유산업의 분포와 공장 규모를 파악하려는 분석가가 '영천에서 타포린이나 원단을 생산하는 공장은 어디이고 규모는 얼마인가' 같은 질문에 쓴다. 전역 조인 키(사업자번호·필지번호 등)가 없으므로 다른 공장등록 데이터와는 회사명·지번 주소·업종번호를 매칭해 연결한다.
limits: 실측 컬럼에서 사업자번호나 필지고유번호 같은 전역 조인 키를 찾지 못해, 다른 데이터와 붙이려면 이름이나 주소를 직접 매칭해야 한다. 범위는 영천시 한 곳에 한정되며 업종번호에 붙은 코드표가 명세에 없다.
