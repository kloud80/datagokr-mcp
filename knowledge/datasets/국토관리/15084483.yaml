summary_user: 서울 문정 도시개발구역 안에 조성되는 지식산업센터를 가구(블록) 단위로 정리한 소규모 파일(csv 약 1.7KB)로, 가구번호·가구면적·위치·면적·준공예정일을 담는다. 문정지구에 입주를 검토하는 기업이나 산업용 부동산 수요자가 '어느 블록에 어느 규모의 지식산업센터가 언제 준공되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위치(주소·블록) 이름을 맞춰 연결해야 하며, 세부 부문 차원에서는 건물관리번호를 통해 건축물대장과 잇는 방식이 제시되어 있으나 이 파일에는 그 번호가 없다.
limits: 건물관리번호나 표준 코드 같은 조인 키가 없어 건축물대장·입주기업 데이터와 바로 연결되지 않고, 위치 문자열을 수작업으로 맞춰야 한다. 입주기업, 분양·임대 현황 등은 담지 않으며 준공 일정은 '예정일' 기준이다.
