description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 건축물 주제도 정보를 제공합니다. 필지별 건축물의 층수, 건폐율, 용적율 등 건축 밀도 지표를 종합적으로 담고 있어 토지 이용 현황을 한눈에 파악할 수 있습니다. 지번코드는 시도, 시군구, 법정리 코드(10자리), 필지구분(1:일반, 2:산), 본번(4자리), 부번(4자리)으로 구성된 19자리 코드로 각 필지를 고유하게 식별합니다. 층수는 건축물의 높이를 나타내고, 건폐율은 대지면적 대비 건축면적 비율을, 용적율은 대지면적 대비 연면적 비율을 표시합니다. 본 데이터는 도시 계획 분석, 개발 가능성 검토, 토지 이용 현황 파악, 건축 계획 수립, 부동산 개발 분석 등에 활용됩니다.
