summary_user: 부산광역시 금정구에 등록된 공장을 한 줄에 한 곳씩 담은 목록으로, 회사명·대표자명·도로명 공장주소·업종명을 2025년 12월 31일 기준으로 담는다(포털 설명상 311곳). 금정구 안에서 특정 업종 제조업체가 어디에 모여 있는지, 거래처나 협력업체 후보가 어떤 곳인지 찾는 사업자·지역 산업 분석가가 쓴다. 사업자번호나 표준산업분류 코드 같은 공통 키가 없어, 다른 데이터와는 회사명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 금정구에 등록된 공장 현황(회사명, 대표자명, 업종명 등) 2025년 12월31일 기준 공장등록 현황입니다.이 데이터는 부산광역시 금정구에 등록된 **총 311개의 공장(제조업체) 현황**을 담고 있으며, 회사명, 대표자명, 상세 도로명 주소, 그리고 업종명 등 5가지 주요 항목으로 구성되어 있습니다. 가장 큰 특징은 **다수의 공장이 "업종명 외 N 종" 형태로 복수 업종**을 등록하고 있다는 점인데, 이는 금정구 내 제조업체들이 다각화된 사업 포트폴리오를 운영하고 있음을 시사합니다. "공장대표주소"는 **특정 건물이나 호실까지 명시된 상세한 도로명 주소**를 제공하여, 공장들이 특정 산업단지나 집합 건물 내에 밀집된 현황을 파악하는 데 유용합니다. 데이터에는 동일 회사명이 중복 등록된 레코드가 존재하므로, 전체 공장의 **실제 개수를 산출하거나 정확한 규모를 분석할 때 중복 제거 과정**이 필수적입니다.이 자료는 지역 제조업 기반 시설 파악, 산업 정책 수립, 공장 집적지 관리 및 기업 탐색을 위한 **기초 산업 현황 데이터**로 활용될 수 있습니다.
