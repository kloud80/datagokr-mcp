summary_user: 전국 경제자유구역 안에서 도시관리계획으로 결정된 용도지구(경관·고도·방재 등)의 구역 정보를 시도별 SHP 파일로 담은 공간 데이터이며, 각 지방자치단체가 구축한 것을 국토교통부가 취합했다. 개발사업자나 토지이용 분석가가 경제자유구역 내 특정 필지가 어떤 용도지구에 걸려 건축·개발 제한을 받는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 지구 이름·코드 매핑이나 행정구역 코드(시군구 식별 컬럼 등)로만 연결하고, 용도지역·지구 규제의 법적 근거는 국토계획법 체계와 함께 본다.
limits: 포털 API가 아니라 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일로 받는다(인증키 불필요, 포털 활용신청과 별개). 전역 조인 키가 없어 필지·건축물 데이터와 바로 키 조인할 수 없고 공간 중첩이나 이름·코드 매핑이 필요하다.
