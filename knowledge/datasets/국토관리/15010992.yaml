summary_user: 전북특별자치도 내 제조업체를 업체 한 곳당 한 행으로 정리한 명부 파일로, 사업체명·대표자·본사소재지·주생산품·주소·홈페이지를 담는다(약 719KB CSV). 지역 산업 정책 담당자나 분석가가 "도내 어느 시군에 어떤 품목을 만드는 제조업체가 몰려 있나" 같은 질문에 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어 다른 공장등록·기업 데이터와는 사업체명이나 주소 문자열 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 전라북특별자치도 전주 지역에 위치한 제조업체의 현황을 정리한 표로, 각 업체의 사업체명, 대표자 성명, 본사 소재지, 주생산품, 주소 등의 정보를 포함하고 있습니다. 전통식품(고추장, 된장, 간장 등) 제조업체뿐만 아니라 금속제창, 인조손톱, 신재생에너지, 주방가구 등 다양한 업종이 포함되어 있어 지역 내 제조업의 산업 분포와 특성을 파악하는 데 활용될 수 있습니다. 특히 식품제조, 뷰티, 전자, 에너지 등 분야별 현황을 파악하거나 산업 정책 수립, 기업 지원 전략 수립 시 기초자료로 유용하게 사용될 수 있습니다.
