summary_user: 인천광역시 연수구에 있는 계량기 관련 업체를 업체 한 곳당 한 행으로 담은 파일이며, 상호·대표자명·전화번호·처리일자·처리구분(영업 여부)으로 구성된다(CSV 335바이트의 소규모 자료). 연수구 주민이나 사업자가 "우리 동네에 영업 중인 계량기 업체가 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명 매칭이나 같은 기관(연수구) 자료끼리 묶는 방식으로만 연결된다.
