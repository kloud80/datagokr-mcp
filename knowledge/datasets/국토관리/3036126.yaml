description_portal: '- 전라남도내 토지면적(시군별 면적, 지목별 면적 현황 등)에 관한 데이터를 공공데이터 포털에서 조회 할 수 있게 했습니다.- 전라남도 면적은 **전국 국토의 약 12.3%**를 차지하며, **지번 수(필지 수)**는 전국에서 가장 많습니다. 면적은 경북, 강원 다음으로 3위입니다.- 통계는 2025년 2월 국토교통부 검증을 거쳐 지적통계 연보에 수록되며, 세부 데이터는 전남도 홈페이지에서 확인 가능합니다.- 임야가 가장 많고, 농지 비중도 상당히 높습니다. 최근 도로·대지 면적은 SOC 확충 및 매립 등의 영향을 받아 증가하는 추세입니다.- 공공데이터 포털에서 제공하는 “전라남도_지적통계” CSV 파일을 통해 지역별·용도별 상세 통계를 확인하실 수 있습니다.'
