summary_user: 서울특별시 양천구가 빈집정비계획에 따라 조사한 대상 빈집을 한 채씩 소재지(주소)·호명·주택유형·건축년도·대지면적과 함께 담은 건별 목록으로, 범위는 양천구 한 곳의 시군구 단위입니다. 주민이나 정비사업 실무자가 '우리 동네 어느 주소에 정비 대상 빈집이 있고, 언제 지어진 어떤 유형의 주택인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 소재지 주소를 이름·주소 매칭으로 맞추거나 같은 양천구 자료끼리만 연결한다.
description_portal: 본 데이터는 서울특별시 양천구 관내 빈집정비계획에 따라 조사된 대상 빈집의 현황을 정리한 목록이다. 주거환경 개선 및 도시 미관 회복, 안전사고 예방을 목적으로 활용되며, 대상 빈집의 소재재, 주택유형(다세대주택, 단독주택 등), 용도지역, 전용면적 등을 제공한다. 해당 자료는 노후화된 유휴주택에 대한 정비 필요성을 사전에 파악하고, 효율적인 정비사업 추진을 위한 기초 자료로 제공된다. 양천구는 이 데이터를 활용하여 도시재생사업, 주택 정책 수립, 지역 안전관리 및 공공주택 공급 계획 수립에 반영하고 있다. 본 데이터는 주기적으로 갱신되며, 향후 주민 생활환경 개선과 지역 균형 발전에 기여할 수 있도록 정책적 활용도를 높이고자 한다.
