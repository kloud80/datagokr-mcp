summary_user: 경상북도 안 대구권 개발제한구역이 지정된 시군(경산·고령·칠곡)별로 행정구역 면적, 개발제한구역 최초 지정면적, 해제면적, 현재 지정면적을 제곱미터 단위로 담은 시군구 단위 집계표이며, 파일 크기는 386바이트로 몇 행 안 되는 소규모 자료다. 지역 정책 담당자나 부동산·도시계획 분석가가 "경산·고령·칠곡에서 그린벨트가 처음 지정된 뒤 얼마나 해제됐고 지금 얼마나 남았나"를 확인하는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 자료와는 시군 이름을 맞춰 연결해야 한다.
limits: 필지·구역 경계 같은 공간 정보는 없고 시군별 면적 합계만 있어 특정 토지의 개발제한구역 해당 여부는 판단할 수 없다. 행정코드 컬럼이 없어 다른 데이터와 이을 때 시군명 매핑이 필요하다.
