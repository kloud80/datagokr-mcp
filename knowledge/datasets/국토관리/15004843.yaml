description_portal: 본 데이터는 대구권 개발제한구역 중 경상북도 내 개발제한구역에 대한 현황 자료입니다.경상북도 내 개발제한구역이 지정된 3개의 시군(경산,고령,칠곡-3읍 4면 1동) 행정구역의 면적, 개발제한구역 최초 지정면적, 개발제한구역 해제면적, 해제가능 잔여면적, 현재 경상북도 내 개발제한구역 관리 면적 현황이며, 각 시군별로 구분되어 제공되고있습니다. 또한 이 데이터는 정기적으로 갱신되어 최신의 경상북도 내 개발제한구역 현황을 반영하고 있어  개발제한구역의 합리적 관리에 활용 할 수 있습니다.
