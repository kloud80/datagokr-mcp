summary_user: 경기도 인구동향조사 출생 B형 집계로, 연도(yr)·시군 단위로 전체 출생아 수, 결혼출산 출생아 수, 어머니 연령 5세 구간(15~19세부터 45~49세까지)별 출생아 수를 담는 집계 자료다. 정책 담당자나 분석가가 '경기도 시군 중 어디에서 35세 이상 고령 출산 비중이 늘었는가', '청소년 출산은 어느 시군에 많은가'를 따지는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 시군 통계(인구·혼인 등)와는 시군명이나 경기도 자체 시군코드(sigun_cd)를 이름·코드 매핑해 이어 쓴다.
description_portal: 이 데이터는 경기도 인구동향조사 중 출생 관련 B형 집계자료로, 연도별 시군 단위로 전체 출생아 수 및 어머니 연령대별 출생아 수를 제공하며, 결혼출산 출생아 수도 함께 집계되어 있습니다. 어머니 연령대는 1519세부터 4549세까지 구간별로 나뉘며, 출산 연령 구조의 변화를 파악할 수 있습니다. 데이터는 시군별 출생 수준을 비교하거나, 연령대별 출산 경향을 분석하여 저출산 대응 정책의 기초자료로 활용할 수 있으며, 특히 청소년·고령 출산의 비율 파악 및 결혼여부에 따른 출산 구조 분석에 유용합니다. 출산 시기 변화, 지역 간 격차, 모성보건 정책의 기획에도 폭넓게 활용될 수 있는 인구 기반 통계자료입니다.
