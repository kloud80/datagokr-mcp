summary_user: 인천광역시 부평구의 집합건축물을 건물(필지) 단위로 한 행씩 담은 파일로, 법정동·본번·부번 지번과 대지면적·건축면적·연면적, 주용도, 사용승인일자를 담는다. 부평구 안에서 어느 법정동에 오래된 아파트·연립 같은 집합건축물이 몰려 있는지, 용도별·준공 연도별 분포가 어떤지를 확인하려는 주민·중개업자·도시재생 분석가가 쓴다. 전역 조인 키(건물관리번호·PNU 등)는 없어서 다른 건축물대장·공시지가 데이터와는 법정동 이름과 본번·부번을 조합한 지번 매칭으로만 이어 쓴다.
