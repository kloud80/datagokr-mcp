summary_user: 충청북도 진천군에서 산업단지 밖에 있는 개별 기업체를 한 행에 한 업체씩 담은 명부 파일로, 회사명·대표자·공장 주소·생산품·업종·종업원수·용지면적·건축면적이 들어 있다. 지역산업 분석가나 군 담당자가 "진천군 산단 밖에 어떤 업종의 공장이 어디에 얼마나 큰 규모로 흩어져 있나"를 파악하고 기업 지원이나 공장 설립 수요를 검토할 때 쓴다. 전역 조인 키(사업자번호·필지번호 등)는 없어서, 공장대표주소나 회사명, 업종번호를 기준으로 팩토리온 공장등록 정보나 산업단지 입주기업 자료와 맞춰 써야 한다.
description_portal: 본 데이터는 충청북도 진천군 내 산업단지 외 지역에 위치한 개별 기업체 현황을 담은 자료로, 순번, 회사명, 대표자명, 전화번호, 공장 대표 주소, 생산품, 업종번호 및 명칭, 단지명, 종업원수, 용지면적, 건축면적 등의 항목을 포함합니다. 이를 통해 기업체의 업종 특성과 입지, 고용규모, 생산시설 규모 등을 종합적으로 파악할 수 있어, 지역산업 분석, 기업 지원정책 수립, 공장 설립 수요 조사 등에 유용하게 활용됩니다. 산업단지 외 개별 기업에 초점을 맞춘 데이터로서, 정주권 외곽지역의 경제활동 흐름을 분석하고, 균형 있는 지역 산업 정책 수립에 기초자료로 활용될 수 있습니다.
