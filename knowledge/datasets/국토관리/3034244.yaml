summary_user: 경상남도 시군별 취수장·정수장의 이름과 하루 최대 처리 가능 시설용량(㎥/일)을 시설 1곳당 한 행으로 담은 현황 파일로, 범위는 경상남도 한 개 시도이고 행정단위는 시군구입니다. 지역 상수도 계획을 검토하는 분석가나 주민이 '우리 시군에는 어떤 정수장이 있고 처리 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어서, 다른 상수도 데이터(정수장별 수질검사 등)와는 시군명이나 정수장 이름을 맞춰 연결해야 한다.
description_portal: '경상남도 내 취·정수시설 현황으로, 취·정수시설 시군명, 취·정수시설명, 취·정수장 시설용량(㎥/일)에 대한 정보를 제공하며 시설별 운영 규모와 취수장, 정수장 지역 분포를 파악하는데 활용됩니다.구체적으로는 다음과 같은 정보들을 포함하고 있습니다.1. 시군명: 해당 취·정수시설이 위치한 경상남도의 행정구역 단위(예: 창원시, 진주시 등)를 나타냅니다. 이를 통해 각 지역별 취·정수시설의 분포 현황을 확인할 수 있습니다.2.취·정수시설명: 해당 시군에서 위치한 취수장, 정수장 명을 말합니다.(예: oo정수장, oo취수장 등으로 표기됩니다.)3.취·정수장 시설용량 (㎥/일): 해당 취·정수장이 하루 동안 처리 가능한 물의 최대 용량을 나타내는 지표입니다. 단위는 ‘㎥/일’(세제곱미터/일)입니다.'
