summary_user: 인천 부평구 안의 민방위 비상급수 생활용수 시설을 한 곳당 한 행으로 담은 소규모 파일(약 2.5KB csv)로, 행정동·시설종류(정부지원/공용)·주민 개방 여부·시설명·도로명/지번 주소를 수록한다. 주민이 '우리 동네 단수·재난 때 물을 받을 수 있는 개방 시설이 어디인가'를 찾거나, 구청·분석가가 행정동별 비상급수시설 분포와 공백 지역을 점검하는 데 쓴다. 공통 조인 키는 없어서 행정동 이름이나 주소를 지오코딩해 다른 민방위 대피시설·인구 자료와 맞춰 이어 쓴다.
description_portal: '비상시 활용 가능한 생활용수 공급 시설의 행정동, 시설종류, 개방 여부, 시설명, 주소 등을 수록한 데이터.재난·재해 상황에서 주민 생활용수 공급을 보장하기 위한 기반 시설 현황을 파악하고, 민방위 및 안전관리 정책 수립, 위기 대응 체계 강화 등에 활용 가능하다.활용 목적 및 특징– 행정동별 비상 급수·생활용수시설 분포 현황 분석– 시설종류·개방여부 기반 운영 특성 파악– 도로명·지번주소를 통한 위치 확인 및 접근성 평가– 민방위, 재난 대응, 생활안전 정책 수립 자료 활용주요 항목 설명● 연번: 데이터의 고유 번호● 행정동: 시설이 위치한 행정동 명칭● 시설종류: 생활용수 공급 시설의 종류(정부지원/공공용)● 개방유무: 시설의 주민 개방 여부● 민방위 비상급수시설명: 지정된 시설의 공식 명칭● 도로명주소: 시설의 도로명 주소● 지번주소: 시설의 지번 주소'
