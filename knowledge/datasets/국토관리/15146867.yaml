summary_user: 전국 지방자치단체가 도시관리계획으로 결정한 재정비촉진지구의 구역 정보를 국토교통부가 취합한 공간 데이터로, 시도별 SHP 파일로 내려받습니다. 부동산 투자자나 분석가가 "관심 지역이 재정비촉진지구 안에 들어가는가, 언제 고시됐는가(NTFDATE)"를 확인하는 데 쓰고, 정비사업 단계 정보와 함께 보면 지역 가격 판단에 참고가 됩니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정구역 코드(COL_ADM_SE 등)나 지구 이름으로 매핑하거나 공간 중첩으로 이어 써야 합니다.
