summary_user: 부산광역시 상수도사업본부 수용가정보시스템에 쌓인 급수공사(공사승인) 민원 신청 건을 사업소·구·동 단위 위치와 함께 계량기 구경, 급수관 종류·구경, 연결 본관 종류·구경 같은 공사 사양으로 담은 CSV 파일(약 145KB)이다. 상수도 분석가나 건축·설비 사업자가 '부산의 어느 구·동에서 어떤 구경의 급수공사 승인이 많은가'를 살펴보는 데 쓴다. 전역 조인 키는 없어서 구·동 코드와 이름(구코드·동명 등)을 행정구역 코드표에 맞추거나 같은 기관의 사업소코드로 다른 상수도 데이터와 이어 쓴다.
description_portal: '부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 민원 신청 정보(급수공사_공사승인) 자료입니다.신청 접수: 건물 소유주가 관할 상하수도사업소 방문 또는 온라인으로 신청현장 조사: 담당 공무원이 현장을 확인하여 배관 위치와 공사 설계안을 마련공사비 납부: 산출된 공사비를 지정 계좌로 납부하면 공사 일정이 확정시공 및 설치: 전문 시공업체가 배관 공사와 계량기 설치를 진행.급수 개시: 공사 완료 후 준공 검사를 거쳐 즉시 수돗물 사용이 가능'
