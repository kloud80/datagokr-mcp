summary_user: 충청남도 도시계획정보시스템(UPIS)에 등록된 도시계획 방재시설을 도형 단위로 담은 CSV 파일(약 28KB)로, 도형별 관리번호, 라벨명, 도형 면적(제곱미터), 도형 길이(미터)를 기록한다. 도시계획 분석가나 지자체 담당자가 충남 도시계획에 지정된 방재시설의 종류와 면적·길이 규모를 파악할 때 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 라벨명으로 이름을 맞추거나 같은 기관(충청남도) UPIS 데이터와 함께 보는 방식으로만 연결한다.
