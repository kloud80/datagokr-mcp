description_portal: 이 데이터는 서울주택도시공사(SH공사)가 공급 및 관리 중인 자치구별 임대주택 현황을 정리한 자료로, 임대 유형별 세대 수를 기준으로 각 자치구 내 분포를 파악할 수 있습니다. 포함된 임대주택 유형은 영구임대, 공공임대, 국민임대, 장기전세, 주거환경개선임대, 외국인임대, 행복주택, 재개발임대, 역세권청년주택, 다가구 임대, 도시형생활주택, 전세임대, 장기안심주택, 기타임대 등으로 매우 다양합니다. 각 유형은 입주 대상, 공급 방식, 임대 조건이 상이하며, 이를 자치구별로 비교함으로써 지역별 주거복지 정책의 실행 양상과 공급 불균형 여부를 파악할 수 있습니다. 본 데이터는 주택 유형별 수요 대응 현황 분석, 정책 우선순위 조정, 청년·고령층 맞춤형 공급 전략 수립 등에 폭넓게 활용될 수 있는 기초 자료입니다.
