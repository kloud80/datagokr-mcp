summary_user: 인천환경공단 송도지소 하수처리장의 일자별 운영 기록으로, 유입량·방류량·탈수케익 발생량과 함수율, 유입수·반응조 유입수·방류수의 수온·pH·BOD·COD·부유물질·총질소·총인·대장균군, 호기조·분리막조 등 공정별 용존산소와 활성슬러지 농도를 담은 CSV 파일(약 65KB)이다. 송도지소 방류수가 날짜별로 어느 수준으로 처리됐는지, 유입 부하 대비 처리 효율이 어떻게 변하는지를 확인하려는 분석가·주민이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 하수처리장 데이터나 수질 측정 자료와는 일자나 처리장 이름을 맞춰 연결해야 한다.
description_portal: 인천환경공단 송도지소 연간 하수처리 데이터로일자, 날씨, 유입량, 방류량, 내부반송률, 외부반송률뿐만 아니라유입수, 방류수, 분배조 등 법정항목 수질 공개자료입니다.해당 정보에는 일자별 유입량, 방류량, BOD, COD, 유입수의 상태, 탈수케익, 분배조부터 침전지, 생물반응조, 포기조 등의 수질 데이터가 있으며,해당 단계를 지날 때 마다 정보를 제공하고 있습니다.송도지소 수질처리 데이터는 공공데이터 중 엑셀 파일 형태의 CSV 형식으로 제공하고 있으니 참조하시기 바랍니다.또한 모든 데이터는 에코넷을 통해 대시민 공개중이오니 참조바랍니다.
