summary_user: 전국 공공 택지개발 사업지구별로 사업단계(단계번호·단계명)마다 시행기간·시작/종료일자·시행면적을 담은 단계별 사업정보로, 택지정보시스템에서 18개 법령에 따라 고시·공고된 지구를 다루며 비공간 데이터다. 공공주택지구나 신도시 같은 택지 사업이 지금 어느 단계에 있고 언제까지, 얼마나 넓은 면적으로 시행되는지 알고 싶은 국민·부동산 분석가가 쓴다. 전역 조인 키는 없어서, 같은 택지정보시스템의 다른 지구 데이터와는 지구지정번호나 지구명으로 맞춰 이어 쓴다.
limits: 택지정보시스템 사이트의 별도 인증키가 필요하며, 이는 공공데이터포털 활용신청과 별개다. 전역 조인 키가 없어 다른 기관 데이터와는 지구명 같은 이름 매칭으로만 연결되고, 행정구역 코드나 좌표가 없어 지도 위 분석에는 바로 쓰기 어렵다. 명세상 갱신은 수시(이벤트성)다.
