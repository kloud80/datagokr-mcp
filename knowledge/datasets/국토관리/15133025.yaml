description_portal: 대행법인이 지적공부의 정리를 목적으로 지적측량을 실시한 후, 지적소관청이 해당 측량성과가 관계 법령과 기준에 적합한지 여부를 검토하여 정확성을 확인하고 최종적으로 그 적정 여부를 결정하는 검사이다. 예를 들어, 토지 분할을 위해 대행법인이 지적측량을 실시하고 분할도면과 면적을 제출하면, 지적소관청에서 경계점 위치와 면적 산정이 기준에 맞는지 확인한 뒤 해당 측량성과를 인정하는 경우가 이에 해당한다. 이 과정은 지적공부의 신뢰성과 공공성을 확보하기 위한 필수 절차이다. 관계법령은 공간정보의 구축 및 관리 등에 관한 법률, 지적측량 시행규칙, 지적업무 처리규정이 있다.
