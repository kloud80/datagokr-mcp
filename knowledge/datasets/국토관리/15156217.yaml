summary_user: 부산광역시 사상구 관내에서 사업계획승인(건축허가 포함)을 받은 민간 공동주택 가운데 아직 분양되지 않은 주택을 단지·전용면적별 행으로 정리한 파일로, 시행사·위치·아파트명·미분양 세대수·집계 기준일을 담는다(준공 전·후 미분양 모두 포함, CSV 약 4.6KB). 사상구에서 집을 구하려는 주민이나 분양 시장을 보는 분석가가 '지금 사상구에 미분양이 남은 단지는 어디이고 면적대별로 몇 세대인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 아파트명·위치(주소)를 이름 매칭하거나 같은 기관 자료끼리 이어 쓰고, 전국 비교는 국토교통통계누리의 미분양 통계와 함께 본다.
description_portal: 본 자료는 부산광역시 사상구 관내에서 사업계획승인(건축허가 포함)을 받아 현재 건설이 진행 중이거나 건설이 완료된 민간 공동주택을 대상으로, 해당 주택들 중 아직 분양이 완료되지 않은 미분양 주택의 현황을 정리한 것입니다.미분양 주택의 범위는 준공 이전 단계에서 발생한 미분양과 준공이 완료된 이후에도 분양되지 않고 남아 있는 주택을 모두 포함하며, 수록된 정보로는 해당 주택의 사업 주체(시행사 또는 건설사), 대지의 위치(주소), 아파트 명칭, 전용면적 및 현재 미분양 상태로 남아 있는 세대수 등이 포함되어 있습니다.※ 국토교통통계누리(http://stat.molit.go.kr)에서 조회가능합니다.※ 미분양 세대수는 집계 기준일에 따라 변동될 수 있습니다.
