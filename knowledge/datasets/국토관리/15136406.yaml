summary_user: 경기도 시흥시의 유동인구를 날짜(exmn_ymd)·시간대(24시간 코드)·내외국인 구분별로 나누고, 남녀 각각 0~9세부터 65~69세까지 5세 단위 연령대별 인구 수로 담은 집계 데이터다. 상권 분석가나 시 담당자가 '시흥시에서 평일 저녁 시간대에 20대 여성 유동인구가 얼마나 되는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군구코드·시군구명을 이름·코드로 맞추거나 같은 기관(경기도) 분석갤러리의 다른 시군 유동인구와 이어 쓴다.
description_portal: 이 데이터는 경기도 시흥시 지역의 시간대별 유동인구 정보를 분석하기 위한 자료로, 외국인과 내국인을 구분하여 남녀별·연령대별 인구 수를 시계열로 제공합니다. 주요 항목은 ‘시군구코드’와 ‘시군구명’을 통해 지역을 식별하며, ‘시간코드’는 하루 24시간을 의미하는 코드로 유동 인구의 시간대 분포를 나타냅니다. 성별 및 연령별 인구는 ‘남자0009수’, ‘여자2529수’ 등 항목으로 세분화되어 있으며, ‘외국인구분’을 통해 내국인과 외국인 유동인구를 구분합니다. ‘연도_월_일’은 해당 통계가 수집된 날짜를 나타내며, 시간대 및 연령대별 유동인구 흐름을 파악하는 데 핵심적인 정보를 제공합니다.
