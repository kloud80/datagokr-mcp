summary_user: 가뭄 분석에 쓰는 국외 GTS(세계기상통신망) 관측소의 제원을 관측소 한 곳당 한 행으로 담은 목록 파일로, 국가코드·국가명, 지점코드·지점명, 관측개시일, 위도·경도를 담는다(CSV 647바이트의 작은 파일). 해외 가뭄·강수 자료를 다루는 분석가가 '이 해외 관측소는 어느 나라 어디에 있고 언제부터 관측했나'를 확인하거나 관측소를 지도에 표시할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 국외 관측 자료와는 지점코드나 지점명을 맞추는 매핑으로만 잇고 위경도로 공간 결합한다.
description_portal: 'ㅁ 개요 : 가뭄 분석 정보 제공을 위한 공단코드정보, 공단명정보, 관련 업체수 등 전국 공업단지에 대한 시설 제원정보 데이터 항목을 제공합니다.본 데이터는 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어 사회 전반의 혁신과 가치 창출에 도움이 됩니다.* 해당파일은 별도 로그인 없이 다운로드 하실수 있습니다.ㅁ 제공속성- 국가코드 / 샘플 : 1- 국가명 / 샘플 : 인도- 지점코드 / 샘플 : 42182- 지점명 / 샘플 : 뉴델리 사프다르정- 관측개시일 / 샘플 : 1996-01-02- 위도 / 샘플 : 28.620167- 경도 / 샘플 : 77.209395* 2025년 09월 12일 기준으로 "한국수자원공사_국외 GTS 관측소 제원정보"의 데이터에 대한 변경사항은 없습니다.보다 자세한 사항은 국가가뭄정보포털(www.drought.go.kr), (가뭄관련 담당자 연락처 안내 : https://www.drought.go.kr/menu/m10/m13.do)로 문의하여 주시기 바랍니다.'
