summary_user: 인천광역시 서구(서해구)에 등록된 제조업체를 업체 한 곳당 한 행으로 담은 파일 데이터로, 회사명·생산품·업종명·공장 도로명주소·전화번호·데이터기준일자를 포함한다. 지역 분석가나 행정 담당자가 '서구에는 어떤 업종의 공장이 어느 도로명주소에 몰려 있고 주로 무엇을 생산하는가'를 확인할 때 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 실측 컬럼에 없어서, 다른 공장등록·기업 데이터와는 회사명이나 도로명주소(공장대표주소) 문자열을 맞춰서만 이어 쓸 수 있다.
description_portal: 본 공공데이터는 인천광역시 서구 내 등록된 제조업체의 현황을 정리한 자료입니다. 본 데이터는 회사명, 생산품, 업종명, 공장 주소, 전화번호 등으로 구성되어 있습니다.해당 데이터는 제조업 기반 산업 분포를 파악할 수 있으며, 지역 내 주요 생산품 현황과 업종별 특성을 이해하는 데 유용합니다.또한 산업 기반시설 밀집도 분석, 산업 인프라 조성 등 행정 실무에 활용될 수 있을것으로 판단이 되며 지역경제 구조 파악 등에 활용 가능한 통계자료로 쓰일 수 있을것으로도 판단이 됩니다.본 데이터는 연마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
