summary_user: 의무관리대상 공동주택이 위탁관리·공사·용역·물품 사업자를 선정한 입찰을 입찰번호 단위로 담은 건별 원천 데이터로, 공고일·마감일·경쟁방식·낙찰방법·낙찰금액·계약기간·낙찰/유찰 사유를 포함하며 범위는 전국이다. 주민이나 관리업체가 '우리 단지의 경비·청소 용역은 어느 방식으로 얼마에 낙찰됐나', '비슷한 단지의 공사 낙찰금액은 어느 수준인가'를 확인하는 데 쓴다. 단지코드(aptCode)와 단지명으로 K-apt 단지 기본정보·관리비·장기수선 데이터와 잇고, 법정동 시도코드로 지역별 집계를 하지만 실측에서 전역 조인 키는 확인되지 않아 이름·코드 매핑이 필요하다.
limits: 입찰번호·공고상태·입찰 사이트 구분 같은 필수 파라미터는 다른 데이터에서 먼저 받아 넘겨야 하고, 6개 오퍼레이션 중 4개는 최소 파라미터로 응답이 없었다. 검증 호출에서는 0행이 수신되어 실제 규모와 최신 시점은 확인되지 않았다.
