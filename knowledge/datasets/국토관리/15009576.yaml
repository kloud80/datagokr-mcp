summary_user: 울산광역시 중구에 소재한 공장을 한 곳씩 담은 등록 현황 파일로, 회사명·공장대표주소·업종코드와 업종명·생산품·종업원수를 담는다(CSV 약 9KB). 중구에 어떤 업종의 공장이 어디에 몇 명 규모로 있는지 보려는 분석가나 지역 사업자가 업종별·지역별 공장 분포를 파악하는 데 쓴다. 사업자번호·필지번호 같은 전역 조인 키는 없어 업종코드나 주소·회사명 매칭으로만 다른 공장등록·기업 데이터와 이어 쓴다.
description_portal: 울산광역시 중구 공장 현황에 대한 자료로, 울산광역시 중구에 소재한 공장 정보를 제공합니다.본 데이터는 회사명, 공장대표주소, 업종코드, 업종명, 생산품, 종업원수 등의 현황을 확인할 수 있습니다.데이터 출처는 울산광역시 중구 일자리정책과 기업지원계(052-290-4460)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 2월 1일입니다. 다음 업데이트는 2027년 1~2월 중 제공됩니다.본 자료는 업종별·지역별 공장 분포 파악, 산업 현황 분석 등의 기초자료로 활용할 수 있습니다.
