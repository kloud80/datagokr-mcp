description_portal: 경상북도개발공사에서 공급하는 택지,산업단지, 필지 등 사업에 대한 공급계획 관련 정보(사업명, 계획고시일자, 계획고시번호 등). 경상북도개발공사에서 진행하는 사업에 대한 사업명과 계획고시일자, 계획고시번호 등을 공개하고 있습니다. 또한 계획이 최종계획인지 여부와 확정되어 진행하는지 확인할수 있는 확정여부 정보도 공개하고 있습니다. 공개하는 사업은 주로 택지개발사업, 단지조성사업, 건설사업이 주류를 이루며, 일부 현물출자 등의 사업도 포함되어 있습니다. 토지공급을 위한 고시내용 및  계획고시번호, 일자 등 경상북도개발공사의 토지개발사업 진행에 대한 정보입니다.
