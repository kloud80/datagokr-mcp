summary_user: 주요 국가산업단지별로 음식료·섬유의복·석유화학·철강·기계·전기전자·운송장비·비제조 등 11개 업종과 총계의 가동업체 수(개사)를 집계한 분기별 산업동향 통계 파일로, 산업단지명과 구분을 포함한 14개 열·40개 행 규모의 전국 단위 비공간 자료입니다. 지역 제조업 경기를 보는 분석가나 입주를 검토하는 사업자가 '이 산업단지에는 어떤 업종 업체가 몇 곳 가동 중인가'를 확인하는 데 쓴다. 실측 컬럼에 산업단지코드 같은 전역 조인 키가 없어서, 산업단지 원장이나 생산·수출·고용 등 다른 산단 통계와는 산업단지 이름을 매핑해 이어 쓴다.
description_portal: 본 데이터는 한국산업단지공단 주요국가산업단지 산업동향 통계 중 업종별 가동업체수 현황을 확인할 수 있는 자료입니다. 산업단지별 업종별 가동업체수 현황을 취합한 자료로서, 저희 기관에서 관할하는 산업단지 산업동향정보를 분기별로 제공하고 있습니다.본 데이터에서 제공하고 있는 항목은 주요국가산업단지 음식료(개사), 섬유의복(개사), 목재종이(개사), 석유화학(개사), 비금속(개사), 철강(개사), 기계(개사), 전기전자(개사), 운송장비(개사), 기타(개사), 비제조(개사), 총계(개사) 업종별 가동업체 현황입니다. 본 파일은 산업단지 업종별로 구분된 총 14개 열과 산업단지별로 나누어진 총 40개 행으로 구성되어 있습니다.
