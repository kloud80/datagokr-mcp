summary_user: 경기주택도시공사가 사업지구별로 공급하는 용지의 추첨공고를 필지(가지번) 단위로 담은 건별 공고 자료다. 담긴 정보는 공고명, 공급방법, 모집공고일·접수기간·추첨일, 토지용도, 면적(제곱미터), 분양가(원)이다. 민간사업자가 '어느 지구에서 어떤 용도의 땅이 언제 추첨으로 나오고 분양가는 얼마인가'를 확인해 분양 참여를 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 사업지구명(biz_district_nm)이나 토지용도 같은 이름을 맞춰서만 연결한다.
description_portal: 이 데이터는 경기주택도시공사에서 공급하는 용지의 추첨공고 내역을 기록한 자료로, 각 사업지구별  용지공급 정보를 제공합니다.주요 항목으로는 사업지구명, 공고명, 공급방법, 모집공고일, 공고접수시작일, 공고접수종료일, 추첨일, 토지용도, 가지번, 면적(제곱미터), 분양가(원) 등이 포함되어 있으며, 이를 통해 경기주택도시공사에서 시행하는 부지공급의 세부내용을 확인할 수 있습니다. 본 데이터는 부동산시장 분석, 공공택지 공급계획 수립, 토지이용계획 수립, 민간사업자의 분양 참여 검토, 개발사업 수요예측, 정책적 공급조정 등 다양한 행정·정책·연구 목적으로 활용됩니다. 특히 공급방법과 추첨일 등 세부일정 정보가 포함되어 있어 공급절차 관리 및 일정관리에 유용합니다.
