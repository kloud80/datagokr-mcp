summary_user: 서울특별시 생활권계획에 포함된 시설의 버퍼(영향권) 범위를 공간정보 파일로 담으며, 도시계획사항 코드·명칭, 결정보고 일련번호, 고시 일련번호, 고시일자, 라벨 같은 속성이 함께 있다. 도시계획 분석가나 부동산·입지 검토자가 특정 생활권 시설의 버퍼가 어느 지역에 걸치는지, 언제 고시됐는지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 서울시 도시계획 공간자료와는 도시계획사항 코드(CTY_PLAN_MTTR_CD)나 고시 번호·일자로 맞추거나 공간 중첩으로 이어 쓴다.
limits: 원본은 data.seoul.go.kr 외부 사이트에서 받으며, 포털 활용신청과 별개의 서울 열린데이터광장 인증키가 필요하다. 좌표계가 EPSG:5174(Bessel TM)이고 인코딩이 windows-949라 다른 좌표계 자료와 겹칠 때는 변환이 필요하다. 법적 효력이 없는 참고자료이다.
