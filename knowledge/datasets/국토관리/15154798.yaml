summary_user: 장성군 관내 건물을 한 건씩 담은 건물 단위 주소 원천 파일로, 건물본번·부번, 기초구역번호, 지하여부, 법정동코드·법정동명, 지번(본번·부번·산여부), 도로명코드·도로명, 변동일자를 시군구·읍면동 단위로 담는다(CSV 약 2.6MB). 주소 정비나 물류·배달 서비스를 다루는 사업자·분석가가 '장성군 특정 지번 건물의 도로명주소와 기초구역번호는 무엇인가' 같은 질문에 쓴다. 법정동코드(bjd_cd)를 키로 법정동 코드표나 같은 코드를 쓰는 건축물대장·공시지가 등 국토 정보 데이터와 잇고, 도로명코드로 도로명 정보와도 맞춘다.
description_portal: 이 데이터는 장성군 관내 건축물 및 주소 정보를 체계적으로 관리하기 위한 건물 단위 기초 데이터입니다. 건물관리번호, 건물본번·부번, 기초구역번호, 우편번호·우편일련번호 등을 통해 건물을 고유하게 식별할 수 있으며, 건축물대장 건물명, 상세건물명, 시군구용 건물명, 상세주소여부 등으로 실제 사용 주소와 명칭 정보를 제공합니다. 또한 법정동코드, 법정읍면동명, 법정리명, 행정동명·행정동코드, 지번본번·부번, 산여부 등을 포함해 법정·행정구역 및 지번 체계와 연계가 가능합니다. 도로명, 도로명코드, 변동일자, 이동사유코드, 변동전도로명주소 필드를 통해 도로명주소 변경·이동 이력을 관리하며, 공동주택여부, 지하여부, 다량배달처명 등은 우편 및 택배, 위치기반 서비스에 필요한 특성 정보를 제공합니다. 이를 통해 공공·민간 분야에서 주소 정비, 공간정보 구축, 물류 및 생활 서비스 향상에 폭넓게 활용할 수 있는 핵심 공공데이터를 제공합니다.
