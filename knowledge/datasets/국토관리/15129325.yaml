summary_user: 경기도 행정동(읍면동) 단위로 기준연도별 전출 인구를 전출 시군구·행정동, 전출 유형, 연령, 성별, 전입 시군구·행정동 조합마다 인구수로 집계해 담는다. 지자체 정책 담당자나 분석가가 '어느 행정동에서 어떤 연령대·성별의 인구가 어느 행정동으로 빠져나가는가'처럼 지역 간 인구 이동 흐름과 전출 특성을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 경기도 분석마트의 다른 행정동 자료와는 시군구·행정동 코드나 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 행정동 단위에서 발생한 전출 인구의 기본정보를 정리한 자료입니다. 주요 항목으로는 순번, 기준년도, 전출시군구코드, 전출시군구명, 전출행정동코드, 전출행정동명, 전출유형코드, 연령내용, 성별코드, 인구수, 전입시군구코드, 전입행정동코드, 수정행정동내용 등이 포함됩니다. 이를 통해 특정 지역에서 어떤 연령대와 성별의 인구가 어느 행정동으로 이동했는지 확인할 수 있으며, 지역 간 인구이동 흐름과 전출 특성을 분석할 수 있습니다. 자료는 인구 구조 변동, 도시 간 이동 패턴, 연령대별 전출 특성 파악 등에 활용할 수 있습니다.
