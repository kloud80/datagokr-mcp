description_portal: '- 부산광역시 도시재생종합정보관리시스템의 데이터로 도시재생 및 마을공동체의 블로그 및 페이스북, 홈페이지 등의 관리번호, 명칭, 참조URL, 위도,경도,수정일자 등의 정보를 제공합니다. - 위치기반(GIS)의 데이터로 구성되어 있으며 부산광역시 16개 자치구·군에서 활동하고 있는 도시재생 관련 기관(도시재생지원센터 등) 및 마을공동체, 유사 공동체의 홈페이지 등(블로그, 페이스북, 홈페이지 등)과 링크(link)되어 해당 기관 등의 내용을 바로 확인할 수 있습니다.- 도시재생은 낙후되거나 쇠퇴한 도시 지역을 물리적·경제적·사회적으로 되살려 지속 가능한 도시로 만드는 과정을 말하며 단순히 오래된 건물만 새로 짓는 ‘재개발’과는 다르게, 도시재생은 사람·공간·경제·문화를 함께 회복하는 데 중점을 둡니다. 본 데이터를 통해 도시재생과 관련한 사업 및 활동 등을 실시간으로 확인할 수 있으며, 지속적으로 갱신되고 있는 자료입니다.'
