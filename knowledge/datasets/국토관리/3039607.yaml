summary_user: 충청북도 음성군에 등록된 공장을 한 건씩 담은 파일 데이터로, 회사명·소재 산업단지명·생산품·업종명·공장대표 지번주소와 데이터기준일자를 담는다(csv 약 307KB). 음성군에 입지할 사업자나 투자유치·산업정책 담당자가 '어느 산업단지에 어떤 업종·생산품의 공장이 모여 있는가'를 파악하는 데 쓴다. 전역 조인 키(사업자번호·업종코드·필지고유번호)는 없어서, 공장대표주소(지번)를 주소 매칭해 필지·공간정보와 잇거나 회사명·단지명을 이름으로 맞춰 팩토리온 공장등록 정보나 산업단지 현황과 연결한다.
description_portal: 음성군 공장등록현황 데이터는 지역 내 산업 구조와 기업 활동을 체계적으로 파악하기 위해 구성된 정보입니다. 회사명은 등록된 공장의 법인 또는 사업체 명칭을 나타내며, 단지명은 해당 공장이 위치한 산업단지나 개발지구를 구분하는 기준이 됩니다. 생산품은 공장에서 제조하는 주요 제품을 기록하여 산업 특성을 분석할 수 있도록 하며, **공장대표주소(지번)**는 행정적·지리적 위치를 명확히 하여 공간정보와 연계 활용이 가능하게 합니다. 또한 업종명은 기업의 산업 분야를 분류해 정책 수립이나 통계 분석에 활용되며, 데이터기준일자는 정보의 최신성과 신뢰성을 보장하는 기준 시점을 제공하여 시점별 변화 추적을 가능하게 합니다. 이러한 데이터 구조는 음성군의 산업 현황을 종합적으로 관리하고 행정, 연구, 투자 유치 등 다양한 분야에서 활용될 수 있는 기반 자료로 기능합니다.
