summary_user: 남양주시가 주민·사업자에게 부과하는 상수도 요금과 하수도 요금의 단가를 업종별·사용량 구간(제곱미터)별로 정리한 요율표로, 건별 부과 내역이 아닌 660바이트 분량의 소형 CSV 기준표입니다. 남양주시 주민이나 사업자가 "우리 업종에서 한 달에 이만큼 쓰면 수도·하수도 요금이 얼마나 나올까"를 미리 계산하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지자체 요율표와 비교하려면 업종명과 사용량 구간을 이름으로 맞춰 이어 써야 한다.
description_portal: 남양주시 상하수도 사용요금 요율표 데이터입니다 해당데이터는 관내 지역 주민 및 사업자에게 부과하는 수도 요금(상수도)과 하수도 요금(하수도)의 산정 기준을 정리한 자료입니다. 이 데이터는 요금의 투명성을 확보하고, 사용자가 자신의 사용량에 따른 요금을 예측할 수 있도록 하는 데 목적이 있습니다. 이 요율표 데이터는 공공 서비스의 예측 가능성과 재정 운영의 투명성에 기여합니다. 일반 시민이나 기업이 자신의 용도 및 예상 사용량에 맞춰 수도 요금과 하수도 요금을 사전에 계산하고 재정 계획을 세울 수 있도록 돕습니다.
