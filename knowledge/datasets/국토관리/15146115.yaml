summary_user: 서울특별시 건축물대장에 딸린 지역지구구역 정보로, 필지·건물별로 대지위치·지번·도로명주소와 함께 지정된 용도지역·용도지구 구분, 대표 여부, 기타 지정 내용을 담는다. 건축 인허가를 준비하는 사업자나 부동산 거래를 검토하는 사람이 '이 건물 부지가 어떤 용도지역·지구에 속하는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 건축물대장(표제부·총괄 등)과는 시군구·법정동 이름과 본번·부번 같은 지번 조합이나 대장 일련번호(BDRG_SN)를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 서울특별시 내 토지와 건축물의 지정 용도지역·용도지구 정보를 제공하는 자료입니다. 각 필지는 행정구역, 지번, 도로명 등 위치 정보를 기반으로 해당 부지의 법적 용도구역을 나타내며, ‘용도지역’은 주거, 상업, 공업, 녹지 등 토지의 기본 사용 목적을 정의하고, ‘용도지구’는 경관, 환경, 교통, 방재 등 특정 목적을 위해 세부적으로 지정된 구역을 의미합니다. 또한, 대표 여부, 관련 고유 식별번호, 기타 지정 내용 등이 포함되어 있어 도시계획, 개발사업 검토, 건축 인허가 심사, 부동산 거래 시의 법적 검토, 환경영향 평가, 도시재생 계획 수립 등 다양한 분야에서 활용할 수 있습니다. 이 자료는 도시의 효율적 토지 이용과 지속가능한 발전을 위한 기초 데이터로서 중요성을 가집니다.
