summary_user: 화성도시공사가 관리하는 화성시 공원 안 공중화장실을 화장실별로 담은 파일 데이터로, 권역·공원수·공원면적·화장실개수·구분·화장실명·관리기관과 관리자 연락처·데이터기준일자를 담는다(csv 약 8KB). 화성시 시민이 특정 권역 공원에 화장실이 몇 개 있고 문제가 생기면 어디에 연락하는지 확인하거나, 분석가가 권역별 공원면적 대비 화장실 수를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 공원·공중화장실 데이터와는 화장실명·공원명이나 권역 이름을 맞춰서만 이어 쓸 수 있다.
limits: 좌표나 표준 코드 같은 전역 조인 키가 없어 지도 표시나 다른 데이터와의 자동 결합이 어렵고, 이름 매칭에 의존해야 한다. 메타데이터상 범위는 전국으로 표시돼 있지만 실제 내용은 화성도시공사가 관리하는 화성시 공원에 한정된다.
