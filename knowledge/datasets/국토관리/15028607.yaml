summary_user: 경산시에서 공사 중인 공동주택 사업을 사업(현장) 한 건당 한 행으로 담은 파일이며, 공사명·공사기간·현장 주소·세대수·입주예정일·시공사명·전화번호가 들어 있고 전체 크기는 609바이트 규모의 작은 CSV이다. 경산시로 이사를 계획하는 시민이나 지역 주택 공급을 보는 분석가가 "지금 경산에서 짓고 있는 아파트는 어디이고, 몇 세대이며, 언제 입주하나"를 확인하는 데 쓴다. 전역 조인 키가 없어서 K-apt 단지코드나 실거래·분양 데이터와는 공사명(단지명)이나 현장 주소를 문자열로 맞춰 이어 써야 한다.
limits: 단지코드 같은 공통 키가 없으므로 다른 주택 데이터와 연결하려면 이름이나 주소를 직접 매칭해야 한다. 범위는 경산시 한 곳의 개별 현장뿐이어서 다른 시군과의 비교나 시계열 공급 추이 분석에는 쓸 수 없다.
