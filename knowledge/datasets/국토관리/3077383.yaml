summary_user: 충청북도 청주시 필지별 개별공시지가(원/㎡)를 필지고유번호(PNU)·지번·기준연도·공시일자·표준지 여부와 함께 담은 건별 파일로, 범위는 청주시 한 곳이며 CSV 약 56MB다. 토지 소유자나 매수 예정자가 특정 필지의 연도별 공시지가가 얼마인지 확인하거나, 분석가가 청주시 읍면동별 지가 수준을 비교하는 데 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 데이터와 잇고, 19자리 필지고유번호로 토지대장·건축물대장 등 필지 단위 원장과 이어 쓴다.
description_portal: 충청북도 청주시의 개별공시지가 정보를 제공합니다. 개별공시지가는 국토교통부장관이 매년 공시하는 표준지 공시지가를 기준으로 시장, 군수, 구청장의 조사, 의견수렴 및 부동산가격공시위원회 심의 등을 거쳐 결정, 공시하는 개별토지의 단위면적당 가격(원/제곱미터)을 말합니다.제공 데이터 내 고유번호는 필지고유번호(PNU)를 의미하며 다음의 19자리로 구성됩니다. * 구코드(5), 읍면동(리)코드(5), 일반번지/산번지(1), 본번(4), 부번(4)* 제공 데이터 중 고유번호와 지번은 엑셀에서 자동변환되므로 데이터 사용 시 주의하시기 바랍니다.
