summary_user: 수원시 도시계획시설(도로·하천·공공청사·주차장·교통광장·상수도·하수도·자동차정류장·전기·열공급시설·철도 등)을 시설 단위로 담은 파일 데이터로, 시설 종류·상세 구분·시설명과 최종 변경 고시일·고시번호를 담는다. 시민이나 도시계획 분석가가 수원시의 특정 도시계획시설이 언제 마지막으로 변경 고시됐는지, 시설 종류별로 어떤 시설이 결정돼 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·시설명 같은 이름 매칭이나 고시번호로 대조해야 하고, 도시·군계획시설을 다루는 국토계획법 체계의 다른 시군구 도시계획시설 데이터와 나란히 쓴다.
