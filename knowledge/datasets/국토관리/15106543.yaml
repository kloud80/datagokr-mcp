description_portal: 광주광역시 동구의 상생협력상가 조성현황 데이터는 상가건물 임대차보호법 제2조에 따라 정해진 상가건물을 소유한 임대인 중, 10년 이상 임대료 인상을 자제하기로 임차인과 상생협약을 체결한 경우 이를 지원·관리하기 위해 정리된 자료입니다. 이 데이터는 지역 내 건물주와 임차인이 함께 지속 가능한 상권을 만들고, 급격한 임대료 상승으로 인한 영세 상인의 부담을 덜어 주기 위한 정책의 기반이 되는 정보입니다.데이터에는 상생협력상가의 유형을 나타내는 구분, 건물의 구체적 위치를 확인할 수 있는 건물위치, 협약이 적용된 상가 명칭이 포함되어 있습니다. 또한 협약에 참여한 임차인 수가 기록되어 있어 몇 개의 점포가 상생협약 혜택을 받고 있는지 파악할 수 있습니다.임대료 안정과 관련된 주요 항목으로는 약정임대기간과 차임인상률이 있으며, 이를 통해 임대인이 얼마나 오랜 기간 임대료를 동결 또는 제한적으로 인상하기로 약정했는지 확인할 수 있습니다. 사업 지원 측면에서는 지자체가 제공한 지원금액이 함께 제공되어, 상생협력상가 조성 사업에 따른 재정 투입 규모를 파악할 수 있습니다.마지막으로 데이터기준일자는 자료가 언제 기준으로 정리되었는지 나타내는 항목으로, 정보의 최신성과 정확성을 판단하는 데 필요한 정보입니다.이러한 상생협력상가 조성현황 데이터는 지역 소상공인 보호, 안정적인 상권 유지, 임대료 상생 문화 확산을 위한 정책적 근거로 활용되는 중요한 자료입니다.
