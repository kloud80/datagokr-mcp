summary_user: 항공사진 촬영 때 쓴 GPS 기준국 한 곳마다 기준국명, 작업기관, 관측일, 위·경도와 평면좌표(노싱·이스팅), 타원체고·정표고, 상시관측소 관측시간·간격·위성수·PDOP·수신앙각·안테나높이를 담은 건별 조서이며, 전국 범위의 작은 CSV 파일(약 3KB)이다. 측량·공간정보 분석가가 특정 항공사진 사업에서 어떤 기준국을 어떤 관측 조건으로 썼는지 확인하거나 촬영 성과의 위치 정확도를 점검하는 데 쓴다. 전역 조인 키가 없어서 다른 항공사진 조서나 정사영상 자료와는 기준국명·작업기관 같은 이름 매핑이나 좌표 기반 공간 결합으로 잇는다.
description_portal: '항공사진 촬영을 위한 GPS 기준국 위치 정보 : 사업지구, 측량업체, 기준점번호, 측량자, 기준국위치 등 정보.▷ 식별정보 : GPS기준국점의조서ID, 기준국명 ▷ 속성정보 : 작업기관, 관측일, 위치, 위도, 노싱, 경도, 이스팅, 타원체고, 정표고, 상시관측소관측시간, 상시관측소관측간격, 상시관측소관측위성수,상시관측소PDOP, 상시관측소수신앙각, 상시관측소안테나높이  * 항공사진 : 항공기나 드론 등의 항공 플랫폼에서 지표면을 촬영한 사진으로, 지도 제작, 지형 분석, 도시계획, 환경 모니터링 등 다양한 분야에서 활용- 전국을 촬영하여, 국토 변화상황을 모니터링 하고 정사영상 제작 및 국가기본도 수정 등에 활용- 전국을 도시지역(해상도 12cm) 및 비도시지역(해상도 25cm)으로 구분하여 도시지역, 비도시지역 1년 주기 촬영'
