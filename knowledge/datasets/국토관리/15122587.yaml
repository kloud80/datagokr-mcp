description_portal: '국가수자원관리종합정보시스템(WAMIS)에서 환경생태 관련 정보를 제공합니다.오염부하량 : 행정구역별 및 유역별 인구, 축산, 산업, 토지 오염부하량 현황 자료생태환경 : 행정구역별 및 유역별 어류, 포유류, 조류, 물 속에서 생활하는 저서성무척추동물, 환경부 및 문화재보호법에서 지정한 특정종(천연, 멸종, 보호종) 현황 자료하천공간평가 : 권역별 하천공간을 포함한 하천주변의 자연환경, 사회환경, 이용실태 등을 파악하고 평가한 자료토양측정망 : 행정구역별 및 유역별 토양측정망의 목록 및 운영 자료'
