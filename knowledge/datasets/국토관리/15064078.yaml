summary_user: 행복도시(세종 행정중심복합도시) 안 생활권별로 지구단위계획 수립 현황을 집계해 계획 면적(㎡), 예상 인구, 계획 가구수를 담은 작은 표(CSV 약 691바이트)다. 도시계획·주택정책 연구자가 '행복도시 생활권 가운데 어디가 면적 대비 계획 인구·가구 밀도가 높은가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 생활권 이름(구분)을 직접 맞춰 이어야 한다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 각 생활권별 지구단위계획 수립 현황을 체계적으로 제공합니다. 각 생활권 단위별로  총 계획 면적(㎡), 예상 인구수, 계획 가구수를 포함하고 있어, 도시개발 단계별 변화 추이를 한눈에 파악할 수 있습니다. 이를 통해 생활권별 도시 규모와  인구·가구 밀도를 비교할 수 있으며, 행복도시 전반의 성장 과정도 분석할 수 있습니다.본 데이터는 행복도시 건설과 관련된 인구 및 주거 수요 추정, 기반시설 수요 분석, 도시계획 및 주택정책 연구, 공공투자 계획 수립, 학술 연구 등 다양한 분야에서 활용 가능합니다.
