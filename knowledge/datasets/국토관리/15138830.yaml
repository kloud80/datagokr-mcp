summary_user: 익산시에서 승인된 건축허가를 건별로 담은 파일로, 대지위치·지목·대지면적·건축면적·연면적·건폐율·용적률·구조·층수·최고높이·주용도와 허가일을 필지·건물 단위로 기록한다. 부동산 개발업자나 지역 분석가가 '최근 익산시 어느 동네에 어떤 용도의 건물이 얼마나 허가됐나'처럼 지역 개발 흐름의 선행 지표를 볼 때 쓴다. 실측 컬럼에 전역 조인 키(건축물대장 관리번호·법정동코드 등)가 없어, 다른 데이터와는 대지위치 주소 문자열을 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 익산시에서 승인된 건축허가 현황에 관한 자료로, 건축구분, 대지위치, 지목, 대지면적, 건축면적, 연면적, 건폐율, 용적률, 구조, 허가일, 최대지상층수, 최대지하층수, 최고높이, 주용도, 부속용도 등의 항목을 포함하고 있다. 익산시의 부동산 개발에 대한 기초자료로 활용 가능하며, 건축허가 관련 주요 통계 및 동향을 한눈에 파악할 수 있도록 하여 익산시의 도시개발 및 건축 관련 정책 수립 등에도 활용 가능하다. 데이터는 주기적으로 갱신되어 최신성을 유지하고 있으며, 관련 키워드와 설명을 통해 사용자 이해도를 높이고 있다.
