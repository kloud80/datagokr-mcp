summary_user: 개발이익환수법상 개발부담금 부과 대상 사업(1호~8호 사업종류)별로 실제 조성된 사업구분, 대상사업명, 그 사업의 근거법률, 인가 등을 받은 날과 준공 등을 받은 날을 정리한 기준 정보로, 전국 범위의 작은 CSV 파일(약 13KB)이다. 개발사업 시행자나 분석가가 특정 개발사업이 개발부담금 대상인지, 어떤 법률에 근거한 사업인지, 부과 기준 시점인 인가일·준공일을 무엇으로 보는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대상사업명이나 근거법률 이름을 문자열로 맞춰서만 이어 쓸 수 있다.
