summary_user: 건축물대장의 사용승인일자를 기준으로 산출한 건물별 연령과 5년·10년 단위 연령대 구분을 건물 단위 원천 레코드로 전국 범위에서 담으며, 구조·주요용도·연면적·층수 같은 건물 속성도 함께 들어 있다. 지자체 도시재생 담당자나 연구자가 '우리 동네에서 30년 이상 된 노후 건물이 어느 법정동에 몰려 있는가'처럼 노후도 분포를 파악하는 데 쓴다. 법정동코드(bjd_cd)를 키로 행정구역 코드표나 법정동 단위 통계와 이어 쓰고, 건물식별번호·고유번호로 건축물대장 계열 데이터와 맞춰 볼 여지가 있다.
limits: 포털 활용신청 API가 아니라 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일로 받는다. 포털 설명은 SHP 형식이라고 하지만 실측으로 받은 시도 파일은 CSV였고 범위도 비공간으로 확인됐으므로, 좌표가 들어 있다고 가정하지 말아야 한다.
