summary_user: 부산광역시 연제구의 미분양 공동주택 수를 면적 구간별(60㎡이하, 60~85㎡, 85㎡초과)로 나눠 최근 4개월(2026년 5~8월) 월별로 집계한 작은 CSV 파일(254바이트)이다. 연제구 신규 분양 단지의 계약 부진이 최근 몇 달 사이 늘었는지 줄었는지, 어떤 평형대에 몰려 있는지 확인하려는 실수요자·분양 사업자·지역 정책 담당자가 쓴다. 전역 조인 키가 없어 다른 구·시도의 미분양 통계나 인허가·착공 자료와는 지역명(시군별)을 맞춰 붙여야 한다.
description_portal: '부산광역시 연제구 미분양 주택 현황을 면적별(60㎡이하, 60-85㎡, 85㎡초과), 최근 4개월 간 데이터를 제공합니다.시군별, 분양 주택 수, 분양 면적,  4개월 간 미분양 주택 수에 대한 데이터를 확인하실 수 있습니다.※ 조사대상 : 사업계획승인(건축허가 포함)을 받아 건설 중이거나 건설된 공동주택, (공공주택은 제외)※ 입주자모집공고 승인 물량 중 분양계약일이 지난 사업장에 대하여 계약이 되지 않은 물량을 미분양주택으로 조사정부는 미분양 주택 현황을 바탕으로 주택 공급 조절 정책을 수립하고, 지역별 주택 시장의 특징을 파악하여 맞춤형 정책을 추진할 수 있고, 민간 기업은 미분양 주택 현황을 분석하여 투자 판단을 내리고, 투자 유치 및 부동산 시장 활성화를 위한 다양한 방안을 마련할 수 있습니다.'
