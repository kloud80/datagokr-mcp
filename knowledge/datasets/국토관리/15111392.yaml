summary_user: 창원시 관내에 등록된 건축물을 건축물대장에서 뽑아 한 건물씩 담은 파일(CSV, 약 11.6MB)로, 대장 종류·시군구·법정동·지번(본번·부번)·연면적·세대수·주용도와 기타용도를 담는다. 도시계획 담당자나 분석가가 창원시 어느 동에 주거·상업 용도 건물이 몰려 있는지, 세대수와 연면적이 어떻게 분포하는지 살필 때 쓴다. 전역 조인 키(건물관리번호·법정동코드 등)가 없으므로 다른 건축물대장·공간정보 자료와는 시군구명·법정동명과 본번·부번 지번을 이름으로 맞춰 이어야 한다.
description_portal: 창원시 관내 전체 건축물 현황을 건축물대장에서 추출한 정보로 지번, 연면적, 세대수, 용도 등의 항목을 제공합니다.창원시 관내 등록된 모든 건축물의 위치, 면적, 세대수, 용도 등 기본 정보를 포함한 자료입니다. 본 데이터는 도시계획, 주거 및 상업 분포 분석, 인프라 정책 수립, 민원 대응, 안전진단 등 도시·환경·사회문제 해결을 위한 기초로 활용될 수 있습니다.데이터 추출 기준, 업데이트 주기(수시), 자료집계 방식 등은 제공기관의 메타데이터 또는 기술문서를 참고하실 것을 권합니다.일반 뷰어(엑셀 등)만으로는 일부 정보만 확인될 수 있으므로, R, Python, GIS 등의 분석 도구 사용을 권장합니다.
