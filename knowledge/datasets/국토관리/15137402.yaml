summary_user: 전국 하수도의 연도별·시도별 현황을 담은 집계 파일로, 실측 필드 기준으로는 시도 단위의 하수관로 계획연장·시설연장(합류식·분류식 오수·우수)과 하수관로보급율, 분류식화율을 담는다. 지역별 하수관로가 계획 대비 얼마나 깔렸는지, 합류식에서 분류식으로의 전환이 어느 시도에서 더딘지 비교하는 정책 분석가나 지자체 담당자가 쓴다. 전역 조인 키는 없고 시도코드·시도명칭과 연도로 다른 시도 단위 통계(인구, 하수처리장 현황 등)와 이름·코드 매핑해 잇는다.
