summary_user: 서울특별시 건축인허가 단계의 전유·공용 면적을 담은 표로, 소재지·시군구명·법정동명·지번(본번·부번)과 전유/공용 구분, 주·부속 구분, 층 구분과 층수, 구조, 주용도, 면적(AREA)을 담고 claim상 범위는 시도 단위이다. 부동산 관리자나 분석가가 "인허가된 이 집합건물의 특정 층·호 전유부 면적과 공용면적은 얼마이고 용도는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 건축물·토지 데이터와는 시군구명·법정동명·지번 같은 이름 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 서울특별시 건축인허가 전유공용면적표 데이터입니다. 각 지역의 건축물 전유부에 대한 위치 및 속성 정보를 제공한다. 각 항목에는 소재지 주소, 행정구역명, 지번, 도로명 주소, 도로명 상세, 지상·지하 구분, 건물 관리번호, 등기 구분, 동명칭, 호수, 층 구분, 층수 등의 정보가 포함되어 있다. 이를 통해 건물의 물리적 위치와 소유·구성 형태를 파악할 수 있으며, 부동산 관리, 도시계획, 건축물 현황 조사, 행정업무 지원 등 다양한 분야에서 활용 가능하다. 특히 집합건물 내 특정 전유부의 층 위치와 호수 정보를 포함하고 있어 세부 단위 공간 분석 및 관리에도 유용하다.
