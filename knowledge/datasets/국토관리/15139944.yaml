summary_user: 익산시 관내 돼지농장별로 상호·주소와 가축분뇨 폐수 발생량, 처리방법을 한 행씩 담은 농장 단위 파일(CSV 약 25KB)이다. 축산 환경 담당자나 연구자가 '익산의 어느 돼지농장이 분뇨를 얼마나 내고 어떤 방식으로 처리하는가'를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 농장 상호나 주소를 이름·주소 매칭해 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 익산시 관내 돼지농장 가축분뇨 발생량 및 처리공법을 제공하는 자료이다. 관내 돼지농장의 상호명 및 주소, 가축분뇨 발생량 및 처리공법 등을 포함하여 축산 환경 관리와 환경오염 방지에 유용한 정보를 제공한다. 해당 자료는 축산 폐기물 관리와 농장 위생 개선을 위한 기초 자료로 활용되며, 관련 행정기관 및 환경 연구기관에서 폭넓게 활용 가능하다. 데이터는 정기적으로 갱신되고, 설명과 핵심 키워드를 포함하고 있어 이용자들이 돼지농장 가축분뇨 관리 현황을 명확하게 파악할 수 있도록 지원한다.
