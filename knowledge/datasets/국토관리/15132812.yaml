description_portal: 지방재정 투명성 강화 및 보조사업 집행의 효율성 제고에 대한 사회적 요구가 높아지는 가운데, 충청남도 보령시는 누리집 메타데이터를 기반으로 지방보조사업 집행내역 데이터를 제공합니다. 본 데이터는 보조사업키, 보조사업명, 사업시작일, 사업종료기간, 부서명, 등록일, 수정일 항목으로 구성되어 있으며, 보령시에서 집행된 지방보조사업의 현황을 체계적으로 파악할 수 있도록 정리되어 있습니다. 지자체 및 재정 관련 기관은 본 데이터를 통해 부서별·사업별 보조사업 집행 현황을 분석하고, 보조사업 성과 평가 및 예산 배분 효율화 방안 수립에 활용할 수 있습니다. 또한 지방재정 연구기관에서는 사업 기간 및 집행 현황 데이터를 바탕으로 지방보조사업의 운영 실태 분석 및 보조금 관리 제도 개선 방안 연구에 기여할 수 있으며, 시민단체 및 언론에서는 지방보조사업 집행 현황 모니터링을 통해 재정 집행의 투명성 검증에 본 데이터를 활용할 수 있습니다.
