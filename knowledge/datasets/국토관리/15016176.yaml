summary_user: 군포시에 공장을 등록한 업체를 한 행씩 담은 건별 명부 파일로, 회사명·업체유형·업종명·생산품·연락처와 공장의 지번·도로명 주소를 담는다(CSV 약 349KB). 군포시에서 특정 업종이나 생산품을 다루는 제조 공장이 어디에 있는지 찾는 사업자·분석가가 거래처 탐색이나 지역 제조업 분포 파악에 쓴다. 사업자번호·업종코드·필지고유번호 같은 공통 조인 키가 없어, 다른 데이터와는 회사명이나 주소를 이름·주소 매칭으로 맞춰 이어 써야 한다.
description_portal: '경기도 군포시 공장등록 현황은 군포시에 공장을 등록한 업체의 데이터를 제공합니다.데이터는 회사명, 업체유형, 업종명, 생산품, 전화번호, 팩스번호, 공장의 지번주소, 공장의 도로명 주소, 데이터 기준일로 구성됩니다. 자료는 한 달에 한 번 업데이트되며, 군포시 기업포털 홈페이지(https://www.gunpo.go.kr/biz/index.do)에서 확인할 수 있습니다.  *홈페이지 주소 ― https://www.gunpo.go.kr/biz/selectBbsNttList.do?bbsNo=2285&key=2266*경로안내: 시 홈페이지☞분야별정보☞기업/일자리☞기업포털 바로가기☞기업현황☞월별공장등록현황'
