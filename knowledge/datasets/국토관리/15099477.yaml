summary_user: 남원시가 발주한 10억원 이상 대형 건축공사를 공사 한 건당 한 행으로 담은 CSV 파일(약 6.5KB)로, 계약명·계약금·계약일·착공일자·준공일자·계약상대자(시공업체)를 포함한다. 시민이나 지역 건설업계가 '남원시 대형공사를 어느 업체가 얼마에 수주했고 언제 준공됐나'를 확인하거나, 연구자가 지역 공공공사 수주 동향을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 계약상대자 업체명이나 공사명을 이름으로 맞추거나 같은 기관(남원시) 기준으로만 이어 쓴다.
description_portal: 1. 데이터 주요 내용 및 활용 맥락본 데이터는 전북특별자치도 남원시에서 발주한 10억원 이상의 대형 건축공사 현황을 상세히 정리한 정보입니다. 각 공사의 계약 체결부터 준공까지의 전체 과정을 상세히 추적할 수 있으며, 시공업체 정보와 공사 일정에 대한 내용을 포함하고 있습니다. 이 데이터는 지역 건설산업의 심층적 동향 분석, 공공공사의 투명성 향상, 시민들의 정보접근권 보장을 주요 목적으로 구축되었습니다. 연구기관의 지역경제 연구, 건설업계의 시장 인텔리전스 확보, 시민사회의 행정 모니터링 등 다양한 방면에서 활용될 수 있습니다.2. 데이터 항목명계약명, 계약금, 계약일, 착공일자, 준공일자, 계약상대자3. 기대효과대형공사 정보의 투명한 공개를 통해 공공공사의 책임성을 제고하고, 지역 건설산업 생태계를 심층적으로 분석할 수 있는 기초자료로 활용될 것으로 기대됩니다.
