summary_user: 충청남도개발공사가 소규모 공사·용역에 대해 체결한 수의계약을 계약 건별로 담은 파일로, 사업명·계약일자·계약기간·계약금액(원)·업체명·업체 주소·수의계약 사유를 제공한다. 사업자나 감시 분석가가 '충남개발공사가 어떤 업체와 어떤 사유로 얼마 규모의 수의계약을 맺었는가'를 확인하거나 특정 업체에 계약이 몰리는지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: '이 자료는 충청남도개발공사의 수의계약 현황으로, 소규모 공사·용역에 대해 체결된 계약의 사업명, 계약일자, 계약기간, 금액 및 업체 정보를 제공한다. 단, 내부 심사 과정이나 계약 세부 조건은 제공되지 않는다.키워드별 상세설명○ 수의계약 → 경쟁입찰 절차 없이 법령 기준에 따라 특정 업체와 직접 체결한 계약을 의미하며, 주로 소액·긴급 계약에서 활용됨○ 계약일자 → 해당 계약이 체결된 날짜를 의미하며, 계약 효력 발생의 기준이 됨○ 계약기간 → 계약이 유지되는 기간을 나타내며, 착수일부터 종료일까지의 기간으로 표시됨○ 계약금액 → 수의계약으로 체결된 공사·용역의 금액을 원 단위로 표시하며, 계약 변경 시 실제 집행액과 차이가 발생할 수 있음○ 업체명 → 계약 상대방이 되는 수행 업체의 명칭을 의미하며, 법인·개인 사업자 모두 포함될 수 있음○ 계약주소 → 계약 상대방 업체의 소재지를 의미하며, 행정구역 주소 기준으로 제공됨○ 계약사유 → 해당 건이 수의계약으로 체결된 법적 사유를 의미하며, 법령 조항(예: 지방계약법 시행령 제25조 등)에 근거하여 기재됨○ 법령근거 → 수의계약 체결 시 적용되는 관련 법령이나 조항을 의미하며, 주로 「지방자치단체를 당사자로 하는 계약에 관한 법률」 시행령에 따라 산출됨'
