description_portal: 해당 데이터는 광주광역시 서구 관내 도시쇠퇴 현황에 대한 정보를 담고 있으며, 최근 인구 감소 연속 연수, 사업체 감소 연속 연수, 그리고 노후 건축물 비율 등의 항목으로 구성되어 있습니다. 이 데이터는 지역 내 도시쇠퇴의 진행 정도를 객관적으로 파악하고, 도시재생 및 정책 수립의 기초 자료로 활용될 수 있습니다. 특히 인구 및 사업체 감소 여부를 연도 단위로 확인할 수 있어 쇠퇴 지역을 식별하거나 우선 지원 대상지를 선정하는 데 유용합니다. 노후 건축물 비율 또한 포함되어 있어 물리적 쇠퇴 정도를 판단할 수 있는 지표로 활용될 수 있습니다. 본 데이터는 수시로 갱신되는 구조이며, csv 형식으로 제공되어 분석 및 활용이 용이합니다.
