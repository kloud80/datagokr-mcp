summary_user: 한국국토정보공사 공간정보연구원이 발간하는 KCI 등재학술지 『지적과 국토정보』 관련 학술 연구 목록을 논문·연구과제 한 건당 한 행으로 담은 CSV 파일(약 18KB)로, 번호·종류·연도·연구과제명·연구자를 담는다. 지적·공간정보 분야 연구자나 학생이 '특정 연도에 어떤 주제의 연구가 누구에 의해 수행됐는가'를 찾거나 연구 동향을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연구과제명·연구자 이름이나 연도 기준 매핑으로만 이어 쓴다.
description_portal: 한국국토정보공사 공간정보연구원에서 발간하는 <지적과 국토정보>는 국토공간정보 분야의 대표 KCI 등재학술지입니다. 해당 학술 분야의 독창성을 가진 이론 및 실험적인 연구 등을 게재함으로써 연구자들의 학술연구 장려를 목적으로 하고, 최신 동향 및 다양한 시각과 해석을 연구자와 독자에게 공유하고 확산하여 국토공간정보 분야발전에 기여하고 있습니다. 학술지의 공정성을 위하여 편집위원회 구성과 편집위원회의 운영현황을 공개함으로써 학술적 가치와 투명성을 높이고 있습니다.
