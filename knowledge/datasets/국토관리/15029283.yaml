summary_user: 인천광역시 영종구(포털 설명상 옛 중구 자료)의 건축허가·신고 건을 한 줄씩 담은 건별 원천 파일로, 대지위치·건축구분·주용도·허가일·착공처리일·설계사무소명·시공자사무소명을 기록하며 범위는 시군구 단위 필지·건물이다. 지역 분석가나 건설·부동산 사업자가 영종 지역에서 최근 어떤 용도의 건축이 허가·착공되고 있는지를 개발 흐름의 선행 지표로 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)나 사무소 이름을 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
limits: 고유 식별 키가 없어 건축물대장 등 국가 데이터와 직접 결합하지 못하고 주소 문자열 매칭에 의존해야 한다. 범위가 영종구(옛 중구) 한 시군구에 한정되어 광역·전국 비교에는 다른 지자체 파일을 따로 모아야 한다.
