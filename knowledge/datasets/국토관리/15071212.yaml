summary_user: 서울특별시 공동주택통합마당의 아파트별 잡수입·잡지출·장기수선충당금 내역을 담은 데이터로, 아파트명·아파트코드·비용명·일자·금액이 한 줄씩 기록된 건별 항목이며 위치 좌표는 없다. 입주민이나 관리 분석가가 '우리 단지의 잡수입은 어디서 얼마나 들어오고, 장기수선충당금은 얼마씩 쌓이는가'를 확인하거나 단지끼리 비교하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 아파트코드(APT_CD)나 아파트명을 K-apt 단지 기본정보·관리비 데이터와 이름·코드로 매핑해야 이어 쓸 수 있다.
