summary_user: 대구광역시 서구 관내 건축물의 허가·신고 건을 한 줄씩 담은 파일로, 허가와 신고 구분, 신축·증축·용도변경·대수선 같은 건축 행위, 대지위치, 허가(신고)일, 주용도를 기록한다. 서구에서 최근 어느 동네에 어떤 용도의 건물이 새로 허가·신고됐는지 보려는 주민·부동산 사업자·지역 개발 흐름 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 대지위치(주소)를 문자열로 맞추거나 같은 기관의 데이터로만 이어 쓴다.
limits: 표준 지번코드나 건축물대장 키 같은 전역 조인 키가 없어서 건축물대장·공시지가와 이으려면 주소 문자열을 따로 정제·매칭해야 한다. 범위는 대구 서구 한 곳뿐이므로 다른 시군구와 비교하려면 각 구의 파일을 따로 모아야 한다.
