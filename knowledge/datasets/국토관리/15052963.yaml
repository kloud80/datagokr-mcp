summary_user: 공무원연금공단이 관리하는 임대주택의 공급 세대수와 장부가를 1982년부터 기준년도까지 연도별(구분) 행으로, 전국 계와 17개 광역자치단체를 열로 펼쳐 담은 집계표(2.5KB 남짓의 CSV)입니다. 공무원 임대주택이 어느 시도에 얼마나 공급·감소했는지, 장부가가 연도별로 어떻게 변했는지를 확인하려는 분석가나 주택정책 담당자가 쓴다. 전역 조인 키나 행정코드가 없어 다른 주택 공급·인허가 통계와는 연도와 시도 이름을 직접 맞춰 이어 써야 한다.
description_portal: '공무원연금공단에서 관리하는 지역별 연도별 임대주택 공급 세대수, 장부가 등 현황에 대한 데이터로, 1982년부터 기준년도까지의 데이터를 포함하고 있습니다.음수에 해당하는 세대는 노후주택 매각세대 및 재건축으로 인한 멸실세대를 반영되었습니다.장부가는 2012년말까지는 취득원가(역사적원가) 기준이고, 2013년부터는 국가회계기준을 따른 자산재평가금액으로 반영되었습니다.지역 : 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주(광역자치단체 기준)'
