summary_user: 군산시에 있는 제조업 공장을 한 행에 한 곳씩 담은 현황 파일로, 단지명·회사명·대표자·도로명 주소·대표 업종번호와 업종명·연락처·종업원 수·생산품을 담는다(csv 약 144KB, 시군구 범위). 지역 투자 유치 담당자나 분석가가 "군산의 어느 산업단지에 어떤 업종 공장이 몇 곳 있고 종업원은 얼마나 되나"를 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 필지번호 같은 전역 조인 키가 없어서, 다른 공장등록·기업 데이터와는 회사명·주소 매칭이나 대표업종번호(업종 코드) 기준으로만 이어 쓴다.
limits: 사업자번호·필지고유번호가 없어 기업·토지 데이터와 정확히 1:1로 연결할 수 없다. 이름이나 주소로 매칭해야 하므로 표기 차이에 따른 누락·오매칭에 주의한다. 범위는 군산시 한 곳뿐이라 다른 시군과 비교하려면 별도 자료가 필요하다.
