description_portal: 본 데이터는 경기도 광주시청에서 관리하는 기계설비유지관리자 선임신고 대상 건축물 현황 자료입니다. 주요 제공 항목은 건축물용도, 건물명, 주소, 연면적(㎡), 선임기준일(사용승인일), 데이터기준일자로 구성되어 있습니다. 해당 데이터는 「기계설비법」에 따라 일정 규모 이상의 건축물에 대해 기계설비유지관리자를 선임해야 하는 의무 대상 정보를 제공합니다. 건축물별 용도와 면적, 사용승인일 등이 포함되어 있어 시설 유지관리 기준을 확인할 수 있으며, 행정기관과 시민 모두가 안전관리 현황을 명확히 이해하는 데 활용할 수 있습니다. 본 자료는 기계설비법 관련 규정에 따른 관리 의무 준수 여부를 점검하는 기초자료로 제공되며, 건축물 안전성 확보와 도시 관리 정책 수립에 기여합니다.
