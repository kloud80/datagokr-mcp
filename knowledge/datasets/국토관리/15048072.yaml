summary_user: 전북특별자치도 시군구별로 미집행 도시계획시설 대지의 대상 토지 면적·금액, 소유주의 매수청구 면적·금액, 실제 매수 실적 면적·금액을 정리한 집계 파일입니다(csv 731바이트 규모). 분석가나 지자체 담당자가 '어느 시군에서 매수청구 대비 실제 매수 비율이 낮은가'처럼 장기미집행 시설의 집행 실적과 예산 부담을 비교할 때 쓴다. 전역 조인 키는 없어 시군구명을 행정구역 이름·코드로 매핑해 다른 도시계획시설·재정 통계와 연결해야 한다.
description_portal: 이 데이터는 전북특별자치도 내 각 시군구에서의 미집행 도시계획시설에 대해 토지 소유주가 대지 매수청구를 한 현황을 정리한 것입니다. 주요 항목으로는 행정구역(시군구), 미집행 대상 토지의 면적과 금액, 해당 토지에 대한 매수청구 면적 및 금액, 그리고 실제로 매수된 면적과 금액이 포함되어 있습니다. 이를 통해 각 시군구별 미집행 규모와 매수 실적을 파악할 수 있으며, 매수청구 대비 실질적인 집행 비율 등도 분석 가능합니다. 이 데이터는 도시계획의 실행력, 행정 대응 수준, 예산 소진 정도 등과 같은 정책 의사결정에 활용될 수 있습니다.
