summary_user: 부산광역시 해운대구 관내 공원을 공원 한 곳당 한 건으로 담으며, 공원명·주소·관리기관과 전화번호·면적(㎡)·위도/경도를 제공한다. 주민이나 분석가가 '해운대구에서 우리 동네 가까운 공원은 어디이고 넓이와 관리 담당 기관은 어떻게 되나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 공원·녹지 데이터와는 공원명이나 주소로 맞추거나, 위도·경도 좌표로 공간 결합해 이어 쓴다.
description_portal: '부산광역시 해운대구 관내에 있는 공원에 대한 정보를 조회할 수 있는 오픈 API 서비스를 제공합니다.공원명, 주소, 전화번호, 관리기관, 면적, 위도, 경도 정보를 포함하고 있습니다.각 항목별 설명은 다음과 같습니다.- 공원명: 공원의 고유 명칭- 주소: 공원이 위치하고 있는 곳의 주소 - 전화번호: 공원을 관리 및 운영을 담당하고 있는 기관의 전화번호- 관리기관: 공원을 관리 및 운영을 담당하고 있는 기관명- 면적: 공원의 전체 면적(㎡)- 위도: 공원이 위치하고 있는 곳의 위도 좌표- 경도: 공원이 위치하고 있는 곳의 경도 좌표'
