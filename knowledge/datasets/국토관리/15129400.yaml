summary_user: 경기도 데이터분석시스템이 정제해 제공하는 인구동향조사 출생 B형 자료로, 출생아 한 명 단위로 연도·시군, 성별, 출생연월·출생장소, 임신주수·다태아 여부·신생아 체중, 부모의 직업·학력·연령·국적, 결혼연월과 동거기간, 어머니의 총출생아수·생존아수를 담는다. 분석가나 정책 담당자가 '경기도 시군별로 어머니 연령·학력에 따라 저체중아나 조산 비율이 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명이나 경기도 자체 분석시군코드(anls_sigun_cd)를 이름·코드 매핑해서 이어 써야 한다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 인구동향조사 출생 B형 정제 기본정보입니다. 주요 항목에는 연도, 분석시군코드, 시군명, 성별코드, 결혼자녀구분코드, 출생연도·출생월, 출생장소코드, 부모의 직업·학력·연령코드, 결혼연도·결혼월, 임신주수, 다태아구분코드, 신생아무게, 어머니총신생아수, 어머니생존아수, 부모동거기간값, 국적코드, 신생아수, 출산 관련 여부, 생성일자 등이 포함됩니다. 이 데이터는 출생아의 기본 특성과 부모의 사회·경제적 배경을 함께 반영하고 있어, 지역별 출산율 분석, 보건·복지 정책 수립, 가족 구성 및 사회 변화 연구에 활용할 수 있습니다.
