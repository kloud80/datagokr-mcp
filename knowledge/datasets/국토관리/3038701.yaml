summary_user: 구리시 관내 하천과 소하천(국가하천 한강, 지방하천 4개소, 소하천 15개소)을 하천 한 개당 한 행으로 담은 목록이며, 수계명·하천명·연장(km)·구간 시작·종료 위치와 위경도·동별·관리기관을 함께 담은 작은 CSV 파일(약 3KB)이다. 구리시민이나 개발·건축 사업자가 "우리 동네 동을 지나는 하천은 무엇이고 어느 구간에 있으며 누가 관리하는가"를 확인하거나, 분석가가 하천 구간을 지도에 표시할 때 쓴다. 전역 조인 키(하천코드 등)가 없으므로 하천정보관리시스템이나 국가공간정보포털의 하천 자료와는 하천명·수계명 이름 매칭이나 구간 좌표로 이어 쓰고, 행정동 단위 자료와는 동별 이름으로 맞춰 쓴다.
description_portal: '구리시 하천 및 소하천은 한강 및 왕숙천 등의 수계를 중심으로 형성되어 치수·환경·친수 기능을 동시에 수행하는 중요한 도시 기반시설입니다.해당 데이터는 경기 구리시 관내에 위치한 하천 및 소하천에 대한 현황을 제공합니다.1. 해당 위치 : 구리시 관내 하천 및 소하천2. 해당 대상 : 국가하천 1개소(5.1㎞), 지방하천 4개소(12㎞), 소하천 15개소(16.573㎞)    - 국가하천 : 한강    - 지방하천 : 불암천,갈매천,용암천,왕숙천    - 소하천 : 안말1개울천,안말개울천,샛다리개울천,백교천,아치울천,유입수로,우미천,동구천,갈매3천,언제말개울천,내동1천,내동2천,내동3천,인창천,토평천3. 제공 데이터 : 수계명, 하천명, 연장, 구간 시작위치, 구간 종료위치, 위도, 경도, 동별 구분, 관리기관 등4. 해당근거 : 구리시 하천기본계획 및 소하천기본계획5. 제공일자 : 2026.3.17.6. 관리기관 : 구리시청 안전총괄과 하천팀7. 관련홈페이지    - 하천정보관리시스템 : https://river.go.kr/index.do    - 구리시 하천 현황 : https://www.guri.go.kr/www/contents.do?key=730※ 홍수위, 계획홍수량 등의 하천 현황에 대한 세부적인 내용이 필요할 경우 관리기관으로 요청하여 주시기 바랍니다.'
