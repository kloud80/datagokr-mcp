summary_user: 서울 동대문구 관내에서 팩토리온에 공장등록된 제조업소 165곳을 한 행씩 담은 파일로, 회사명·대표 전화번호·도로명 주소·업종명·생산품을 담는다(포털 설명상 2026년 2월 24일 기준). 동대문구에서 특정 업종이나 생산품을 만드는 공장이 어디에 있는지 찾는 사업자나, 구 단위 제조업 분포를 보려는 분석가가 쓴다. 실측 컬럼에 사업자번호·산업분류코드·필지번호 같은 전역 조인 키가 없어, 다른 데이터와는 회사명이나 도로명 주소를 맞춰 잇는 방식으로만 연결한다.
description_portal: 해당 공장등록 현황 정보는 2026년 2월 24일 기준, 서울특별시 동대문구 관내에 등록된 제조업소(한국표준산업분류상에 "제조업"으로 명시되어 있는 업종) 중 "산업집적활성화 및 공장설립에 관한 법률" 제16조(공장의 등록)에 의거하여 (팩토리온에)공장등록된 제조업소(165개)의 회사명, 회사 대표 전화번호, 회사 대표 주소, 제조업종명 및 제조생산품에 관한 데이터입니다.(데이터 공란 및 마스킹은 개인정보로 비공개 처리합니다.)추가 설명이 필요한 경우 02-2127-4368로 문의바랍니다.
