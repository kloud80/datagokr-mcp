summary_user: 충청남도개발공사가 수행한 도시개발·공동주택·산업단지조성·대행·임대 사업을 사업 한 건당 한 행으로 정리한 목록으로, 순번별로 사업 구분, 사업명, 관련 부서, 시·군 단위 위치, 완료·진행중 여부를 담는다(CSV 약 7KB). 도민이나 지역개발 연구자가 "충남개발공사가 어느 시·군에서 어떤 사업을 하고 있고 그중 무엇이 아직 진행 중인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 사업명이나 시·군 이름을 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 충청남도개발공사가 수행한 도시개발사업, 공동주택사업, 산업단지조성사업, 대행사업, 임대사업 등 주요 사업의 추진 현황을 체계적으로 정리한 목록 데이터이다. 각 사업은 고유 순번을 기준으로 사업 구분, 사업명, 담당 부서 또는 관련 부서, 사업 위치(시·군 단위), 추진 상태(완료 또는 진행중) 등의 정보를 포함하고 있다. 본 자료는 충청남도 및 도내 시·군 지역의 도시 성장, 주거 환경 개선, 산업 기반 확충, 공공시설 확충, 도시재생 및 농촌 활성화 정책의 추진 현황을 종합적으로 파악할 수 있도록 구성되었다. 또한 공공기관의 사업 수행 내역을 투명하게 공개함으로써 도민의 알 권리를 보장하고, 연구기관, 정책 수립 기관, 민간 기업 등이 지역 개발 동향 분석, 정책 연구, 사업 기획 자료로 활용할 수 있도록 한다. 본 데이터는 행정 목적에 따라 관리·갱신되며, 특정 시점 기준의 사업 현황을 나타내므로 실제 사업 진행 상황은 변동될 수 있다.
