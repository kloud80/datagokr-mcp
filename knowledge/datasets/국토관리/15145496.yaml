description_portal: 경상남도 함양군에 등록된 조경업체의 현황을 수록한 자료로, 업종, 업체명, 전화번호, 도로명 주소 등의 정보를 포함하고 있습니다. 건설업 중 종합건설을 제외한 전문건설업 현황으로 조경식재.시설물공사업 관련 민간업체의  분포를 파악할 수 있으며, 지역 내 조경 산업의 구조 및 규모를분석하는 데 기초자료로 활용 가능합니다. 함양군의 도시경관 관리 및 녹지관련 사업 발주시 업체 선정을 위한 참고자료로 활용될 수 있으며, 민간에서는 조경업체 선정, 시장조사, 기업 간 협력기반 마련 등 다양한 목적으로 활용 할 수 있습니다. 공공데이터로 제공함으로써 행정의 투명성을 높이고 민간의 창의적인 활용을 장려할 수 있으며, 디지털 기반의 도시 관리 및 서비스 고도화에도 기여할 수 있습니다.
