description_portal: '대구광역시 북구 관내 부동산중개업의 법규위반에 대한 행정처분 결과 분기별 현황 정보(2015년~)를 제공합니다. 투명한 부동산 거리질서 확립과 건전한 거래문화 조성을 위해   부동산중개업소 지도점검 및   단속, 한국부동산원 인터넷표시광고 모니터링 등을 통해 접수된 공인중개사법 위반에 사항에 대해 처분하고 분기별 현황정보를 제공합니다. 행정처분 내역:  등록취소(공인중개사법 제38조), 업무정지(공인중개사법 제39조), 과태료(공인중개사법 제51조), 수사의뢰(공인중개사법 제48,49조)'
