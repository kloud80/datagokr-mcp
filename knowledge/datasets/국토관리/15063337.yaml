summary_user: 경상남도 산업단지를 단지 한 곳당 한 건으로 담으며, 단지명·유형, 시도·시군구 위치, 지정면적·지정일자, 착공·준공인가일자, 조성 진행상태와 분양상태, 분양가 등을 산업입지정보시스템 자료로 제공한다. 지역 분석가나 입지를 찾는 사업자가 경남 시군별로 어떤 산업단지가 언제 지정되어 조성 중이거나 준공됐는지, 분양 상태가 어떤지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(산업단지코드 등)가 없어, 전국산업단지 표준데이터나 국토부 산업단지 일반현황·경계도면과는 단지명과 시군구명(signguNm)을 맞춰 연결한다.
description_portal: 경상남도 산업단지의 명칭(단지명), 위치(시도, 시군구, 주소), 지정내역(지정면적, 지정일자), 분양상태, 착공일자, 준공인가일자 등을 조회하는 경상남도 산업단지 현황 조회 서비스경상남도의 산업단지 데이터는 산업입지정보시스템의 데이터를 활용하여 정보를 제공합니다. 위의 데이터로 산업단지의 현황을 파악하고 산업단지 조성공사 진행현황 파악 및 유용자원을 확인하기 위해서 활용할 수 있습니다. 현재 데이터는 2025년 1월 기준 데이터로, 연간 현행화 데이터로 차기 업데이트 예정일은 2026년 6월입니다.
