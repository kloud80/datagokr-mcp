summary_user: 경기도 광주시 도시계획정보시스템에 등록된 도로·주차장·정류장 등 교통시설을 시설(현황도형) 한 건씩 담은 시군구 단위 파일로, 시설 명칭(라벨명)·부지 면적·선형 시설 길이·등록 일시를 포함한다. 광주시 안에 어떤 교통시설이 어느 정도 규모로 지정돼 있는지 확인하려는 도시계획 담당자나 분석가가 도로망 현황 파악이나 교통 인프라 검토에 쓴다. 전역 조인 키는 없어 시군구코드나 시설 명칭으로 같은 시의 다른 도시계획시설 현황 데이터와 맞춰 쓴다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 교통시설 현황 정보를 제공합니다. 도로, 철도, 항만, 공항, 주차장, 자동차 정류장 등 도시 교통을 지원하는 시설의 위치와 규모 정보를 담고 있습니다. 현황도형 관리번호는 각 시설을 고유하게 식별하며, 라벨명은 교통시설의 명칭을 나타냅니다. 면적은 시설이 차지하는 부지 면적을 제공하고, 길이는 선형 시설의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 교통 계획 수립, 도로망 분석, 교통 인프라 관리, 도시 개발 계획, 교통 접근성 개선 등에 활용됩니다.
