summary_user: 경기주택도시공사가 공급하는 용지의 추첨공고를 필지(가지번) 단위로 담은 건별 파일로, 사업지구명·공고명·공급방법·모집공고일·접수 시작·종료일·추첨일과 토지용도·면적(제곱미터)·분양가(원)를 기록한다. 단독주택용지·산업시설용지·이주자택지 등 용지 공급에 참여하려는 사업자나 개인이 '어느 지구에서 어떤 용도의 땅이 언제 추첨되고, 면적당 분양가는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업지구명 같은 이름 매칭이나 같은 기관(경기주택도시공사) 데이터끼리만 연결한다.
description_portal: 경기주택도시공사에서 공급하는 공급용지의 추첨공고 내역에 관한 데이터로써 사업지구명, 공고명, 공급방법, 모집공고일, 공고접수시작일, 공고접수종료일, 추첨일, 토지용도, 가지번, 면적, 분양가 등의 정보를 포함하고 있습니다. 산업시설용지, 단독주택용지, 지원시설용지, 물류시설용지, 이주자택지, 종교시설용지, 유치원용지, 연립주택용지 등 다양한 토지용지별 공급면적 및 분양가 정보 등 수요자가 참여할 수 있는 추첨방식의 정보를 명확히 제공하여 공정성과 투명성을 확보하는 데 기여하며, 참여자의 사업계획 수립 시 참고자료로 활용될 수 있습니다.
