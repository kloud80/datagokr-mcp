summary_user: 전국 건축물의 월별 전기·가스 사용량(KWh)을 지번 단위로 담은 건축HUB API로, 건별 원천 조회 형태다. 건물 에너지 사용 실태를 지번별로 살피려는 분석가나 건물 관리자가 특정 지번의 월별 에너지 사용량이 얼마인지 확인하는 데 쓴다. 시군구코드(sigunguCd, 키 sgg_cd)로 다른 건축물대장 계열 데이터와 이어 쓰고, 필수 파라미터인 번(bun)·지(ji)는 다른 데이터에서 먼저 받아 넘겨야 한다.
limits: 번(bun)·지(ji)가 필수 파라미터여서 다른 데이터에서 먼저 확보해야 하며, 오퍼레이션 중 getBeElctyUsgInfo는 최소 파라미터로 호출했을 때 응답이 없었다. 검증 때 전체 건수 1, 수신 1행이 확인되었을 뿐이라 실제 수록 규모는 이 근거로 알 수 없다. 단독주택, 200세대 미만 공동주택(2020년 1월 이후), 산업용·수송용 등 일부 용도는 포털 설명상 제외 대상이다.
