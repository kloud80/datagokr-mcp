summary_user: 대전광역시 동구에 있는 개별 단독주택마다 소재지 지번주소, 대지·건물연면적, 산정 면적, 개별주택가격(원), 가격기준연도를 한 행씩 담은 건별 공시가격 파일(CSV 약 1.26MB)이다. 동구 주민이나 중개·분석 실무자가 특정 주택의 공시가격을 확인해 보유세·건강보험료·복지 기준을 가늠하거나 매매·임대 전에 가격 수준을 비교하는 데 쓴다. 전역 조인 키(PNU 등)가 없어 다른 데이터와는 주택소재지 지번주소를 문자열로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 대전광역시 동구 개별주택가격 데이터는 대전광역시 동구에 위치한 주택의 개별주택가격 정보를 포괄 제공하기 위해 구축되었습니다. 각 주택의 소재지 지번주소, 대지면적(㎡), 건물연면적(㎡), 개별주택가격, 가격기준연도(기준일) 정보를 포함하며 국토교통부에서 공시된 주택가격을 전산 처리했습니다. 이를 통해 주택 가격 비교, 세제 과세 기준 설정, 부동산 시장 동향 분석 및 주거복지 정책 수립에 활용할 수 있으며, 시민은 매매·임대 시 비용 예측과 합리적 의사결정을 내리는 데 기초자료로 활용 가능합니다.
