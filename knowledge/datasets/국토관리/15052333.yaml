summary_user: 서울시 공동주택 통합정보마당의 재무보고서를 담은 데이터로, 아파트 단지별·비용 항목별·연월별 금액을 한 행으로 기록합니다. 입주민이나 분석가가 "우리 단지의 특정 관리비 항목이 다른 단지나 이전 달보다 많이 나갔는가"를 확인할 때 씁니다. 단지는 아파트명과 아파트코드(APT_CD)로 식별하지만 실측에서 전역 조인 키는 확인되지 않아, K-apt 단지 기본정보·관리비·실거래 데이터와는 단지명·코드 매핑을 거쳐 연결합니다.
description_portal: 서울시 공동주택 재무보고서 정보는 아파트 단지별 관리비 등 주요 비용 내역을 투명하게 확인할 수 있도록 제공되는 데이터입니다. 아파트명과 아파트코드를 통해 단지를 식별할 수 있으며, 비용명과 년월, 금액 정보를 통해 특정 시기별 지출 현황을 비교·분석할 수 있습니다. 이를 통해 입주민은 관리비 사용 내역을 보다 명확히 파악하고, 단지 간 비용 수준을 객관적으로 비교하는 데 활용할 수 있습니다. 서울특별시 공동주택 통합정보마당에서 제공하는 공공주택 재무보고서입니다. 나아가 이 데이터는 공동주택 재정 운영의 건전성 제고와 입주민의 알 권리 강화에도 기여하는 중요한 기반 자료입니다.
