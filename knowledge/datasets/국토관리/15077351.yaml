summary_user: 2014년 '아름다운 경기건축'으로 선정된 경기도 근대건축명소를 명소 한 곳당 한 행으로 담은 목록으로, 시군명·명소명·유형·용도와 정제된 도로명·지번주소, 우편번호, WGS84 위도·경도를 포함한다. 시민이나 답사·관광 기획자가 "우리 시군에 있는 근대건축명소는 어디이고 지금 어떤 용도로 쓰이나"를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어 시군명이나 주소 문자열로 다른 데이터와 맞추고, 위도·경도(refine_wgs84_lat 등)로 공간 데이터와 위치 기준으로 겹쳐 본다.
description_portal: 아름다운 경기건축으로 선정된(2014년) 경기도 근대건축명소 현황 정보입니다.주요 항목은 시군명, 명소명, 유형, 용도, 정제도로명주소, 정제지번주소, 정제WGS84 위도 및 경도 등으로 구성되어 있으며, 공공업무시설, 교육연구시설, 문화재 등 다양한 용도로 활용되고 있는 근대 건축 자산의 위치 및 건축적 특성을 제공합니다※ 아름다운 경기건축은 경기도에 소재한 현대, 근대, 역사 건축물 및 공간환경 중에서 건축적으로 또는 그 장소적 가치의 품격과 품질이 우수하여 지역 건축자산으로서 홍보, 기록, 보존, 교육, 활용 등의 가치가 있다고 판단되는 건축명소에 대한 자료집(‘아름다운 경기건축’ 컬러화보집)을 홈페이지를 통해 서비스하기 위해 만들어 졌습니다.니다.
