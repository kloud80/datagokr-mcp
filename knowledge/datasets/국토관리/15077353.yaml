summary_user: 2014년 '아름다운 경기건축'으로 선정된 경기도 역사건축명소를 건축물 한 곳당 한 행으로 담은 현황 목록으로, 시군명·명소명·유형·용도·위경도(WGS84)가 들어 있다. 지역 문화유산 홍보·관광 코스 기획이나 역사교육 자료를 만드는 사람이 '우리 시군에 어떤 역사건축명소가 어디에 있나'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명이나 명소 이름으로 맞추어 잇고, 위경도로 지도나 다른 공간 데이터에 겹쳐 쓴다.
description_portal: 아름다운 경기건축으로 선정된(2014년) 경기도 역사건축명소 현황 정보입니다.이 데이터는 지역문화유산의 홍보 및 관광자원화, 역사교육 자료 개발, 도시계획 내 전통경관 보호 구역 설정, 문화재관리 정책 수립 등에 유용하게 활용될 수 있습니다.※ 아름다운 경기건축은 경기도에 소재한 현대, 근대, 역사 건축물 및 공간환경 중에서 건축적으로 또는 그 장소적 가치의 품격과 품질이 우수하여 지역 건축자산으로서 홍보, 기록, 보존, 교육, 활용 등의 가치가 있다고 판단되는 건축명소에 대한 자료집(‘아름다운 경기건축’ 컬러화보집)을 홈페이지를 통해 서비스하기 위해 만들어 졌습니다.
