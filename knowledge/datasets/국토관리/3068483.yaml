summary_user: 대전광역시시설관리공단이 운영하는 하수처리장(유성구 엑스포로 326)의 처리장별 평균 유입량과 평균 방류량을 연·월 단위로 집계한 파일 데이터다. 하수처리 실무자나 분석가가 "대전 하수처리장의 월별 유입량이 계절이나 연도에 따라 어떻게 달라지는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·월 기준으로 맞추거나 처리장 이름, 같은 기관 기준으로만 이어 쓴다.
description_portal: 대전광역시시설관리공단에서 관리 운영 중인 하수처리장의 처리량 정보를 제공하고 있습니다. 하수처리장의 주소는 대전광역시 유성구 엑스포로 326 이며 체육, 환경, 복지, 기반 중 환경시설에 해당됩니다. 하수처리량 정보는 월별 데이터입니다. 해당 파일에서 제공하는 정보는 년도, 월, 1처리장평균유입량, 2처리장평균유입량, 3에이처리장평균유입량, 3비처리장평균유입량, 4에이처리장평균유입량, 4비처리장평균유입량, 하수처리장평균유입량, 1_2처리장평균방류량, 3처리장평균방류량, 4처리장평균방류량, 하수처리장평균방류량입니다. 하수처리량 데이터 기준일은 2025년 7월 1일 입니다. 추가로 필요하신 사항이 있다면 공공데이터 담당자(042-610-2746)에게 문의하여 주시기 바랍니다.
