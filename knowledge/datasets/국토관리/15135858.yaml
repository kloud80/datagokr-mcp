summary_user: 충청남도 공간정보 통합플랫폼의 토지매매 현황을 시군구·읍면동별로 용도지역, 지목, 계약일, 지분거래 여부에 따라 묶어 거래 건수(전체건수)로 집계한 파일 자료이며, 범위는 충청남도 읍면동 단위입니다. 분석가나 지자체 담당자가 '어느 읍면동에서 어떤 용도지역·지목의 토지가 지분거래로 많이 팔렸나'처럼 지역별 토지 매매 동향을 볼 때 쓴다. 전역 조인 키(법정동코드 등)가 없어 다른 데이터와는 시군구명·읍면동명 같은 이름 매핑으로만 이어 붙여야 한다.
