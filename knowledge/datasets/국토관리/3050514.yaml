summary_user: 경상북도 상주시의 강수량을 '구분'별로 1월~12월 월별 합계(mm)로 정리한 소규모 집계 파일(csv, 약 1.2KB)로, 데이터기준일이 함께 들어 있다. 상주시 농업인·하천 관리 담당자·분석가가 '상주시는 어느 달에 비가 가장 많이 오는가' 같은 월별 강수 패턴 질문에 쓴다. 실측 컬럼에 관측소코드 같은 전역 조인 키가 없어 WAMIS 등 다른 수문 자료와는 지역명·관측소명을 수작업으로 맞춰 이어 쓴다.
limits: 월별 집계라 일·시간 단위 강수나 실시간 시계열 분석에는 쓰지 못한다. 관측소코드 등 표준 키가 없어 다른 관측 자료와 자동 연결이 되지 않고, 이름 매핑이나 같은 기관 자료로만 연결된다.
