summary_user: 전북특별자치도의 공공임대주택 보급 수를 연도별로 집계한 통계 파일로, 공급 주체(LH공사·지자체·민간업체)와 유형(매입임대·전세임대)별 보급 실적을 담으며, 포털 설명상 기간은 2013~2020년이고 파일 크기는 260바이트로 아주 작다. 주거복지 분석가나 정책 담당자가 "전북에서 공공임대 공급이 LH 중심이었는지, 매입·전세임대 비중은 해마다 어떻게 바뀌었는지"를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(구분)나 시도 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터는 전북특별자치도의 연도별 공공임대주택 보급 수 현황을 공급 주체와 유형에 따라 집계한 통계입니다. 2013년부터 2020년까지 8년간의 기록을 바탕으로, LH공사, 지방자치단체, 민간업체 등 공급 주체별 보급 실적과 매입임대, 전세임대 등 주택 유형별 보급 수를 상세히 보여줍니다. 이 자료를 통해 지역 내 주거 안정을 위한 공공임대주택 공급 정책이 어떻게 실행되었는지 그 흐름을 파악할 수 있습니다. 이는 주거 복지 정책의 효과를 분석하고, 향후 주택 공급 계획을 수립하며, 서민의 주거 환경 개선을 위한 중요한 기초 자료로 활용됩니다.
