summary_user: 광주광역시 서구 관내 배수펌프장(배수장 포함)을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 409바이트)로, 펌프장명·주소·설치년도·설치목적과 모터펌프 규모, 한전 전원공급방식, 비상발전기 용량, 계약전력, 사용전력량, 전기요금을 담는다. 구청·방재 담당자나 분석가가 '집중호우 때 서구 배수펌프장별 비상발전기 용량이 펌프 규모를 감당할 만한가', '전기요금이 많이 드는 노후 시설은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 하천·침수 데이터와는 펌프장명이나 주소를 맞춰 붙이거나 같은 기관(서구) 자료끼리 연결해야 한다.
description_portal: 이 데이터는 광주광역시 서구 재난대응용 배수펌프장 시설현황을 수록한 자료입니다. 관내 배수펌프장(배수장 포함)의 **기본 정보(펌프장명·주소·설치년도·설치목적)**와 함께, 재난 대응 역량을 판단할 수 있는 설비 규모 및 전력 운영 정보(모터펌프규모, 한전 전원공급방식, 비상발전기 용량, 한전 계약전력, 전력 사용량, 전기요금) 등을 제공하여 시설 운영 현황을 정량적으로 파악할 수 있습니다.본 데이터는 집중호우·침수 등 재난 상황에서 필요한 배수시설의 운영 기반과 비상전원 확보 수준을 점검하고, 시설별 규모·목적에 따른 침수방지 기능 배치 현황을 분석하는 데 활용될 수 있습니다. 또한 전력 사용량 및 전기요금 정보를 통해 시설 운영비 추이 관리, 예산 편성 및 효율화 검토, 노후 시설 개선·증설 우선순위 설정 등 재난 대응 인프라 관리 정책의 기초자료로 활용 가능합니다.
