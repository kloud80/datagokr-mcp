summary_user: 경기도 단독·다가구 주택의 전월세 임대차 계약을 건별로 담은 원천 데이터로, 주소·도로조건·계약면적·전월세 구분·계약연월일·보증금·월세·건축년도와 정제된 지번·도로명 주소, 우편번호, 위경도 좌표를 함께 제공한다. 세입자나 임대사업자가 '우리 동네 단독·다가구 전세 보증금과 월세가 면적 대비 어느 수준이고 시기별로 어떻게 변했나'를 확인하거나, 분석가가 지역별 임대료 차이를 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 정제 주소(지번·도로명)나 우편번호, 위경도 좌표로 위치를 매칭해 이어 쓴다.
description_portal: 이 데이터는 경기도 단독·다가구 주택의 전월세 실거래가 원천 기본정보로, 실제 계약된 임대차 거래 내역을 수록하고 있습니다. 주요 항목은 주소, 도로조건, 계약면적, 전월세 구분, 계약연월, 보증금액, 월세금액, 건축년도, 도로명 등이며, 위치 정보와 함께 계약 조건을 상세히 제공합니다. 이를 통해 단독·다가구 주택의 임대료 수준과 지역별 차이를 분석할 수 있으며, 면적 대비 임대료 산정, 시기별 전세·월세 추이 파악, 도로조건에 따른 주거 가치 비교 등이 가능합니다. 주거정책 수립, 부동산 시장 예측, 학술 연구 및 투자 분석에 유용하게 활용될 수 있는 공공데이터입니다.
