summary_user: 서울주택도시개발공사(SH공사)가 추진하는 행복주택(리츠 포함)의 공급계획을 단지별로 담은 CSV 파일(약 1.6KB)로, 유형·단지명·소재지·공급(예정)년도·공급예정물량 총계와 전용면적별 공급형을 담는다. 청년·신혼부부·사회초년생이 언제 어느 지역에 어떤 크기의 행복주택이 나올지 확인하거나, 분석가가 자치구별 공급 편중과 공급 시기를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단지명이나 소재지 주소를 매핑해 붙여야 한다.
description_portal: 이 데이터는 서울주택도시개발공사(SH공사)에서 추진하는 행복주택(리츠 포함) 공급계획에 대한 정보를 담고 있으며, 소형 주택 위주의 공급 물량을 전용면적 구간별로 확인할 수 있는 자료입니다. 포함된 주요 항목으로는 단지명, 소재지, 공급 예정 물량 총계, 공급(예정)년도, 전용면적 등이 있으며, 청년, 신혼부부, 사회초년생 등 주거 취약계층을 대상으로 한 공공임대주택의 세부 공급 계획을 확인할 수 있습니다. 행복주택 공급 정보는 다양한 가구 형태와 주거 수요에 맞는 정책 설계에 활용될 수 있으며, 입주 수요 예측, 지역별 공급 편중 현황 분석, 공급 시기 조정 등의 행정적 판단 근거로도 사용됩니다. 다만, 공급계획은 사업 추진 상황에 따라 변경될 수 있어 참고자료로 활용하는 것이 적절합니다.
