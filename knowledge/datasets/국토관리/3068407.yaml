summary_user: 진주시에 등록된 공장을 한 건씩 담은 파일로, 단지명·회사명·공장 주소(도로명·지번)·업종·생산품·남녀·외국인 종업원 수·용지·제조시설·건축 면적을 공장 단위로 제공한다. 진주시 어느 산업단지에 어떤 업종 공장이 몰려 있고 종업원 규모가 어느 정도인지 알고 싶은 분석가나 기업 지원 담당자가 쓴다. 전역 조인 키(사업자번호·필지고유번호 등)는 없어서, 업종번호·업종명으로 업종 분류와 맞추거나 주소·회사명을 매칭해 다른 공장등록·토지 자료와 연결한다.
description_portal: 경상남도 진주시 공장등록현황 데이터는 진주시 내 기업(공장) 현황을 체계적으로 파악할 수 있도록 구성된 자료입니다. 단지명, 회사명, 공장 대표 주소, 전화번호, 업종명 등 기본 정보를 제공합니다. 이를 통해 지역 산업 구조 분석, 기업 지원 정책 수립, 투자 유치 계획 마련 등 행정 및 산업 분야 전반에서 활용할 수 있는 기초 데이터를 제공합니다. 또한 공장 분포 현황을 파악하여 산업단지 관리, 기업환경 개선, 지역경제 활성화 전략 수립에 도움이 되며, 향후 산업 동향 분석과 정책 효과 평가에도 유용하게 활용될 수 있습니다.
