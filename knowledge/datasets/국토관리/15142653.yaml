summary_user: 용산구에서 허가된 건축물을 허가 건별로 담은 파일(csv, 약 716KB)로, 대지위치·지목·대지면적·건축면적·연면적·건폐율·용적률·구조·주용도·층수·높이·주차대수·세대수와 허가일·취소구분이 들어 있다. 부동산 개발업자나 지역 분석가가 "최근 용산구 어느 지번에 어떤 용도·규모의 건물이 허가됐나"를 확인하거나, 허가 추이를 지역 개발 흐름의 선행 지표로 볼 때 쓴다. 전역 조인 키(건물·필지 고유번호 등)가 없어서 다른 데이터와는 대지위치 주소 문자열을 매칭하거나 같은 기관 자료끼리만 이어 쓸 수 있다.
description_portal: 서울특별시 용산구_건축허가현황 데이터는 용산구 내에서 허가된 건축물에 관한 다양한 정보를 포함하고 있습니다. 주요 항목으로는 건축구분, 대지위치, 지목, 대지면적, 건축면적, 연면적, 건폐율, 용적률, 건축사사무소, 시공사 등이 포함됩니다. ‘건축구분’은 건축물의 용도와 성격을 구분하는 항목으로, 주거용, 상업용, 공공용 등 다양한 유형을 구분하여 제공합니다. ‘대지위치’는 건축물이 위치한 구체적인 주소 및 지번 정보로, 해당 건축물이 어느 지역에 위치하는지를 명확히 알 수 있게 합니다. ‘지목’은 해당 대지의 법적 용도 분류로서 건축 가능 여부와 관련 규제를 판단하는 데 중요한 역할을 하며, ‘대지면적’은 건축 대상 토지의 전체 크기를 나타냅니다. ‘건축면적’과 ‘연면적’은 각각 건물의 1층 바닥 면적과 모든 층의 바닥 면적을 합산한 총면적으로, 건축물의 규모를 파악하는 데 필수적입니다. ‘건폐율’과 ‘용적률’은 대지 대비 건축면적과 연면적의 비율로, 용산구 내 건축 규제 준수 여부를 확인하는 데 활용됩니다. 또한 ‘건축사사무소’와 ‘시공사’ 정보는 해당 건축 프로젝트를 담당한 전문 업체와 시공사를 나타내어, 건축 과정과 품질 관리에 대한 투명성을 제공합니다. 이 데이터는 용산구의 건축 허가 현황을 체계적으로 파악하고, 도시계획 및 행정 업무, 건축 관련 연구에 중요한 기초 자료로 활용됩니다.
