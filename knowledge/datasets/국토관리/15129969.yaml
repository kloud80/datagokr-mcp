summary_user: 평택시 도시계획정보시스템(UPIS)에 등록된 자연환경보전지역을 도형 단위로 담은 시군구 범위 CSV 파일로, 도형별 관리번호·결정고시관리코드·라벨명·면적·길이를 담는다(파일 크기 약 1KB로 행 수가 적다). 평택시에서 자연환경보전지역으로 결정된 구역이 어디이고 면적이 얼마인지 확인하려는 토지 소유자·사업자·도시계획 분석가가 쓴다. 전역 조인 키는 확인되지 않았고, 시군구코드나 결정고시관리코드로 같은 기관의 다른 UPIS 용도지역 데이터나 결정고시 자료와 이어 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 자연환경보전지역현황으로 현황도형 관리번호, 도형 조서관리 코드, 결정고시관리코드, 라벨명, 면적_도형, 길이_도형 등의 항목을 제공합니다.자연환경보전지역은 자연환경, 수자원, 해안, 생태계, 상수원 및 문화재의 보전과 수산자원 보호·육성 등을 위해 필요한 지역으로, 도시·군관리계획으로 결정·고시된 지역을 말합니다. 이러한 지역은 토지의 이용과 건축물의 용도, 건폐율, 용적률, 높이 등을 제한하여 토지를 효율적으로 이용하고 공공복리 증진을 도모합니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
