summary_user: 김해시 관내 묘지를 한 곳씩 묘지명, 공설·사설 구분, 설치년도, 허가면적·묘역면적, 총매장가능구수, 주소와 위도·경도로 담은 시설별 원천 목록이다(파일 758바이트로 소규모). 시민이 '김해에 매장 가능한 공설묘지가 어디 있고 얼마나 수용할 수 있나'를 확인하거나, 분석가가 지역 장사시설 수급을 살피는 데 쓴다. 전역 조인 키는 없어 주소·좌표로 지도에 올리거나 같은 김해시의 자연장지·장례식장·봉안시설 현황과 시설명·주소로 맞춰 이어 쓴다.
description_portal: '경상남도 김해시 묘지 현황에 대한 데이터로 묘지명, 공설-사설구분, 허가면적, 묘역면적, 총매장가능구수, 전화번호, 지번주소, 도로명주소, 위도, 경도, 데이터기준일자의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 9월 25일로, 연간 주기로 관리하고 있습니다.* 관련 장사시설 데이터로 자연장지 현황, 장례식장 현황, 봉안시설 현황이 공개되어 있으니 활용시 참고 바랍니다.데이터 담당부서 : 김해시 노인복지과(055-330-0954)[데이터 변동 안내]1. 데이터 업데이트2. 데이터 설명 수정3. 데이터 키워드 추가4. 데이터 기준일 변경'
