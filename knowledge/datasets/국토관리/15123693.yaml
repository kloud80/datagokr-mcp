summary_user: 경기부동산포털의 집합건물 대지권 정보를 토지고유번호·소재지와 집합건물명, 동·층·호수·실번호별로 담은 건별 자료로, 각 호실이 대지 전체에서 갖는 대지권 지분비율(sitergt_quota_rt_info)을 함께 제공한다. 아파트·오피스텔 소유자나 중개·감정 실무자가 특정 호실의 대지 지분이 얼마인지 확인하는 데 쓰고, 분석가는 단지별 세대 지분 구성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 토지고유번호나 소재지·건물명 같은 이름·코드 매핑으로 다른 토지·건축물 자료와 맞춰 써야 한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 집합건물의 대지권(대지 사용권) 정보로, 공동주택 등의 집합건물에 대해 개별 호수별로 부여된 대지권 지분과 그 구조적 구성을 확인할 수 있는 자료입니다. 주요 항목은 토지고유번호, 토지소재지, 집합건물명, 동·층·호수, 실번호, 대지권지분비율로 구성되어 있으며, ‘대지권지분비율’ 항목은 개별 세대가 해당 대지 전체에서 보유하는 권리 비율을 나타냅니다. ‘집합건물’은 공동주택, 오피스텔 등 동일 건물 내에 다수의 소유자가 존재하는 구조를 의미합니다.대용량 데이터로 전체 데이터가 필요하신 분은 파일 다운로드를 이용 부탁드립니다.
