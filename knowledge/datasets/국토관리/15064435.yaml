summary_user: 무안군 지역화폐인 무안사랑상품권을 쓸 수 있는 가맹점을 한 곳씩 담은 목록으로, 가맹점마다 소재 읍면·상호·업태·주소를 기록한 CSV 파일(약 45만 바이트)이다. 주민이 "우리 읍면에서 상품권을 받는 음식점이 어디인가"를 찾거나, 분석가가 읍면별·업태별 가맹점 분포로 지역 상권 특성을 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소를 지오코딩하거나 읍면 이름·상호를 맞춰 연결해야 한다.
description_portal: 이 데이터는 전라남도 무안군의 지역화폐인 무안사랑상품권을 사용할 수 있는 가맹점의 현황 정보에 대한 데이터입니다.가맹점 소재지 읍면, 상호, 업태, 주소 등의 항목을 제공하며, 지역화폐 이용 활성화, 소상공인 지원 정책 수립, 소비자 안내 서비스 등에 활용됩니다.데이터는 전라남도 무안군으로부터 수집되며, 연간으로 갱신됩니다.지역경제 순환 구조 분석, 상권 특성 파악 등에도 활용할 수 있으며, 시민들이 실생활에서 사용할 수 있는 실효성 높은 데이터입니다.추후 모바일 앱 및 온라인 지도 서비스를 연계하여 활용 시 유용하게 사용할 수 있습니다.
