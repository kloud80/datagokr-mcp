description_portal: 하천 생활환경 보호기준물질(생물화학적산소요구량, 화학적산소요구량, 총유기탄소량, 부유물질량, 용존산소량, 총인, 대장균군 총대장균군, 분원성 대장균군)의 등급별(매우좋은, 좋은, 약간좋음, 보통, 약간나쁨, 나쁨, 매우나쁨) 기준 농도 정보입니다.하천의 생활환경 보호 기준은 환경정책기본법 시행령 별표1의 수질 기준에 따라 I~VI 등급으로 분류됩니다. 이 기준은 수소이온농도(pH), 생물학적 산소요구량(BOD), 부유물질(SS), 용존산소(DO), 대장균군 등을 포함한 다양한 항목에 대해 설정됩니다. 또한 사람의 건강 보호를 위한 기준도 별도로 존재합니다.
