summary_user: 전국 하수처리장별로 시설용량·연간하수처리량과 재이용시설 설치 여부·가동개시일·재처리 용량·공급관로·펌프, 그리고 재이용수량을 장내용수(세척·냉각·조경 등)와 장외용수(하천 유지·농업·공업 등) 용도별로 나눠 담은 시설 단위 현황 파일이며, 행정단위는 시군구다. 물 재이용 정책 담당자나 분석가가 "우리 시군구 하수처리장 중 재이용시설이 없거나 재이용률이 낮은 곳은 어디이고, 재이용수는 주로 어떤 용도로 쓰이는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 하수처리장 원장이나 방류수 수질 자료와는 시도·구군 이름이나 하수처리장 시설명을 맞춰 연결해야 한다.
description_portal: 이 데이터는 전국 하수처리장에서 처리된 하수 중 지역별로 얼마나 많은 양이 다양한 목적으로 재이용되고 있는지를 보여주는 통계자료입니다. 각 시설의 재이용 설비 보유 여부, 설치 시기, 기술 유형, 공급 기반 시설(관로, 펌프 등)뿐 아니라 실제로 재이용된 물의 양을 용도별(청소, 세척, 조경, 하천 유지, 공업 등)로 구분하여 제공하고 있습니다.이러한 데이터는 물 재이용 정책, 도시 물순환 관리, 하천 유지관리, 산업용수 대체, 물 부족 지역 지원 등 다양한 분야에서 정책 수립 및 시설 개선의 기초자료로 활용될 수 있습니다.
