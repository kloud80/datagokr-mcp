description_portal: 서울특별시 강서구 내 빈집 정비계획의 대상으로 지정된 빈집의 목록으로, 주거환경 개선과 도시재생을 위한 기초자료로 활용됩니다. 본 데이터는 연번, 해당 빈집의 정확한 소재지, 주택유형(단독, 다세대 등), 용도지역(주거지역, 상업지역 등), 전용면적(㎡ 단위), 그리고 데이터 기준일자 항목으로 구성되어 있으며, 노후화되었거나 장기간 방치된 주택 정보를 파악할 수 있게 합니다. 해당 정보는 강서구의 방치 빈집에 대한 체계적 관리 및 활용을 유도하고, 도시 미관 및 주민 안전 확보를 위한 정책 수립, 정비사업의 우선순위 설정, 리모델링 및 공공임대주택 전환 검토 등 다양한 도시계획적 활용이 가능합니다. 특히 빈집의 위치 및 유형에 따른 정비 필요성 판단에 있어 중요한 기준 역할을 수행합니다.
