summary_user: 스마트제조혁신추진단 사업관리시스템에 등록돼 스마트공장을 보급하는 공급기업의 명부로, 기업별 한 행에 부여번호·기업명·대표자명·주소·담당자·담당자 연락처를 담은 전국 단위 CSV 파일이다. 스마트공장 도입을 검토하는 중소 제조기업이 '우리 지역에 있는 스마트공장 솔루션 공급업체와 담당자 연락처는 어디인가'를 찾을 때나, 분석가가 공급기업의 지역 분포를 볼 때 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 공장등록 현황 등 다른 데이터와는 기업명이나 주소를 맞춰 붙이는 방식으로만 연결한다.
description_portal: '* 스마트공장이란? 스마트공장은 제품의 기획부터 판매까지 모든 생산과정을 ICT(정보통신)기술로 통합해 최소 비용과 시간으로 고객 맞춤형 제품을 생산하는 사람 중심의 첨단 지능형 공장입니다.* 스마트공장 공급기업이란? 스마트 공장에 서비스를 제공하는 업체입니다. - 서비스는 스마트공장 솔루션 6가지와 융합한 것으로 스마트공장에서 제품을 생산해낼때 그에 맞는 시스템을 갖추고 공급 또한 스마트공장과 함께 최적화되어서 제공하는 공장을 뜻합니다. 스마트 공장이 국내에서 발전하고 상용화되는 만큼 공급기업에서도 그에 맞게 같이 발전하면서 많아지고 있습니다.* 스마트공장사업관리시스템 (smart-factory.kr, 중소기업기술정보진흥원(기정원) 스마트공장추진단) 개방 데이터입니다.* 스마트제조혁신추진단 사업관리시스템에 등록되고 스마트 공장을 보급하는 공급기업에 대한 정보입니다.* 데이터 구성 : 부여번호, 기업명, 대표자명, 주소, 담당자, 담당자 연락처'
