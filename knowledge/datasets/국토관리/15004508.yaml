summary_user: 경상남도 거제시 관내 마을회관을 한 건씩 담은 시설 목록으로, 면·동, 시설명, 사용승인연도, 소재지, 위도·경도, 기준일자를 담은 작은 CSV 파일(925바이트)이다. 주민이나 지역계획 담당자가 "우리 면·동에 마을회관이 어디에 있고 언제 지어졌나"를 확인하거나 시설 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 면·동 이름이나 주소 문자열, 좌표를 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경상남도 거제시 관내 마을회관의 현황 정보를 제공합니다. 각 마을회관의 행정구역(면·동), 시설명, 사용승인연도, 소재지, 위도 및 경도 좌표 등이 포함되어 있습니다. 위치 정보는 지도 서비스와 연계하여 활용할 수 있도록 위도와 경도 좌표로 제공됩니다. 마을회관은 지역 주민의 커뮤니티 공간으로 활용되며, 본 데이터는 관련 시설의 분포 및 현황 파악에 유용합니다. 공공시설 분석, 지역계획 수립, 응급 서비스 위치 연계 등 다양한 행정 및 민간 서비스에 활용될 수 있습니다. 데이터는 정기적인 업데이트를 통해 최신 정보를 반영하고 있고, 현황 파악 및 정책 수립을 위한 기초자료로 활용될 수 있도록 구성되었습니다.
