summary_user: 코로나19 확산 전후(2019년 12월 기준)로 주요 상권영역과 행정동별 업종별 업체 수, 유동인구, 총인구, 매출액을 비교해 지역경제 위험도를 도출한 분석 결과를 시도별 엑셀 파일로 담으며, 범위는 전국이다. 지역 정책 담당자나 상권 분석가가 '우리 동네 상권에서 코로나19 이후 어떤 업종이 가장 타격을 받았는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 같은 기관 코드로 맞춰 연결해야 한다.
description_portal: ❍ 코로나19 펜데믹로 인하여 전세계 경제에 많은 변화가 생겼다.❍ 코로나19라는 돌발변수로 인해 발생한 변화를 파악하고 향후 상황에서 대안을 모색고자한다.❍ 이에 코로나19 확산에 다른 지역경제 영향력을 업종별로 객관적으로 정량화하여 평가지수를 도출하여 코로나19 확산에 따른 영향을 분석하고자 한다.❍ 코로나19 확산에 따른 지역경제 영향력을 업종별로 평가지수를 도출하고 이에 따른 대응 방안 마련을 목표로 함❍ 코로나 19 확산에 따른 지역경제 영향분석은 주요상권영역과 행정동을 기준으로 하여 업종별 업체현황 수, 유동인구 현황, 총인구, 매출액 2019년 12월 이전과 이후를 비교하여 지역경제 위험도를 도출한다.
