summary_user: 경남 창원시 5개 구(의창·성산·마산합포·마산회원·진해)에 제조업 공장으로 등록된 공장을 한 곳씩 회사명, 도로명 주소, 업종명, 생산품, 전화·팩스번호와 함께 담은 건별 명부이며, 포털 설명상 2024년 12월 31일 기준이다. 창원에서 특정 업종이나 생산품을 만드는 공장이 어디에 있는지 찾는 사업자, 또는 구별 제조업 업종 구성을 보려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 데이터와는 회사명이나 도로명 주소를 맞춰 붙이거나, 주소를 좌표로 바꿔 지도에 올리는 방식으로 이어 쓴다.
description_portal: 경남 창원시 관내(의창구, 성산구, 마산합포구, 마산회원구, 진해구)에 소재하고 있으며 제조업 공장으로 등록된 현황을 제공합니다.(2024년 12월 31일 기준)공장등록현황 데이터는 지역 및 업종 분류에 따라 정해진 기준을 넘는 공장들이 정식 등록된 정보를 위치, 면적, 설비 내용, 종사자 수, 운영 상태 등과 함께 종합적으로 정리한 자료입니다. 이 데이터는 공업단지 및 산업체계 분석, 고용 및 세수 기반 파악, 환경·안전 규제 대상 선정, 민원 대응, 도시 계획 및 인허가 검토, 산업 정책 수립 등에 폭넓게 활용됩니다. 특히 GIS 기반 공간 시각화와 결합할 경우 산업 밀집도 분석, 업종 구조 비교, 지역별 특화 전략 수립에 중요한 기초 자료로 기능합니다.
