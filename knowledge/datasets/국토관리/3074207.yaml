summary_user: 순천시 안에서 이루어진 건축 인허가를 허가 건별로 담은 원천 파일로, 대지위치·지목·면적·건폐율·용적률·층수·주용도·용도지역과 허가일·착공일·사용승인일·허가취소일 등 인허가 단계별 날짜를 함께 기록한다(CSV 약 128KB). 순천시에서 최근 어느 지역에 어떤 용도의 건축 허가·착공이 몰리는지 알고 싶은 분석가나 사업자가 지역 개발 흐름의 선행 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)나 허가번호를 이름·코드 매핑으로 맞춰 건축물대장·공시지가 같은 국토 정보와 이어 써야 한다.
description_portal: 전라남도 순천시의 ‘건축인허가 현황’ 데이터는 순천시 내에서 이루어진 건축 인허가 사항을 상세히 기록한 공공데이터입니다. 이 데이터는 건축물의 위치, 용도, 규모, 인허가 일자, 인허가 번호 등 다양한 항목으로 구성되어 있습니다. 이를 통해 순천시의 건축물 분포와 인허가 현황을 파악할 수 있으며, 도시 개발 및 재개발 계획 수립, 부동산 시장 분석, 건축 관련 정책 수립 등에 유용하게 활용될 수 있습니다. 또한, 이 데이터는 공공데이터포털을 통해 제공되며, CSV 형식으로 다운로드하여 다양한 분석 및 활용이 가능합니다. 업데이트 주기는 수시로 이루어지며, 최신 정보는 공공데이터포털에서 확인할 수 있습니다. 이 데이터는 순천시의 건축 인허가 현황을 파악하고, 관련 정책 수립 및 산업 분석에 유용한 자료로 활용될 수 있습니다.
