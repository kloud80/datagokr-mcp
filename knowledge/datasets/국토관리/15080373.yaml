summary_user: 충청북도 증평군의 일반건축물을 건물(동·호) 단위로 담아 과세연도별 시가표준액과 연면적, 법정동·법정리·본번·부번 등 소재지 정보를 기록한 파일(CSV 약 1.1MB)이다. 증평군 내 특정 건물의 지방세 과세 기준가액을 확인하려는 소유자나, 군 내 건축물 가격 분포를 살피려는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 법정동·본번·부번 같은 지번 정보나 자치단체코드를 맞춰 이어 써야 한다.
description_portal: 충청북도 증평군 일반건축물 시가표준액 데이터는 지방세 부과의 기준이 되는 일반건축물의 시가표준액(가격정보)과 해당 건축물의 위치·면적·지번 등 부동산 정보를 포함한 행정 재산 평가 자료입니다.일반건축물에 대한 법정동, 법정리, 특수지, 본번, 부번, 동,호,물건지 등의 정보는 건축물 및 부동산 관련 행정업무나 등기, 세금부과 등에 사용되는 데이터입니다.본 자료는 지방세법 시행령 제28조에 따라 매년 갱신되는 시가표준액을 기반으로 작성되며,취득세·등록세·재산세 등 지방세 부과, 도시계획 수립, 재산세 제도 연구, 공공시설 입지 분석 등에 폭넓게 활용됩니다.
