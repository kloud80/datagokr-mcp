summary_user: 성주군 돼지농장별로 가축분뇨 배출량, 처리시설 연계 여부, 처리공법을 한 줄씩 담은 건별 파일 데이터이며 28건이 들어 있다. 군 환경·축산 담당자나 분석가가 관내 어느 농장이 분뇨를 어떤 방식으로 처리하는지 확인하는 질문에 쓴다. 주소(address)를 키로 다른 주소 기반 자료와 이어 쓸 수 있고, 하수처리장·처리구역 원장이나 방류수 수질 자료와 함께 보면 분뇨 처리 실태를 넓게 볼 수 있다.
description_portal: 본 데이터는 성주군 내 돼지농장에서 발생하는 가축분뇨의 연간 발생량과 농가별 처리공법 현황을 종합적으로 정리한 자료이다. 상호명, 주소, 분뇨배출량, 처리시설 연계여부, 공법를 포함하여 분뇨 관리 실태를 체계적으로 파악할 수 있도록 구성하였다. 이를 통해 환경오염 예방, 처리시설 적정성 검토, 지역 농축산 정책 수립 등 행정 의사결정에 활용할 수 있으며, 지속가능한 축산환경 구축을 위한 근거자료로 제공되는 공공데이터이다. 또한 농가별 운영규모 변화와 처리시설 개선 필요성을 파악할 수 있도록 관련 행정자료와 연계되어 정기적으로 갱신되며, 지역 환경관리 정책의 효율성을 높이는 기반정보로 활용된다. 지속적 품질관리를 위해 검증 절차가 운영된다.
