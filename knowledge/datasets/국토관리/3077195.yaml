summary_user: 경기도 양주시가 내준 건축허가·신고를 건별로 담은 파일로, 건마다 대지위치·지목·대지면적·건축면적·연면적·건폐율·용적률·층수·구조·주용도·용도지역·허가일·주차대수 같은 항목이 들어 있다. 양주시에서 최근 어느 지역에 어떤 용도의 건물이 얼마나 허가됐는지 살펴보려는 분석가·부동산 사업자가 지역 개발 흐름의 선행 지표로 쓴다. 전역 조인 키는 없어서 다른 데이터와는 대지위치(주소)를 이름으로 매칭하거나 같은 기관(양주시) 기준으로만 이어 쓴다.
description_portal: 「건축허가 현황」 데이터는 경기도 양주시에서 인허가한 건축물의 허가 내역을 수록한 공공데이터입니다.이 데이터는 건축행위를 위해 관할 행정기관(양주시청 등)으로부터 받은 건축허가 사항을 중심으로 하며, 대치위치, 지목, 면적, 건폐율, 구조, 용도 등  항목을 제공하고 있습니다.주요 활용 목적은 도시계획, 건축물 통계, 개발 모니터링, 부동산 정보 제공, 정책 수립 등에 있습니다.
