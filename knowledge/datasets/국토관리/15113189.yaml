summary_user: 대전역 일원(정동 3-4번지) 도시재생사업을 단위사업·세부사업별로 나눠 사업 유형, 사업내용, 2021~2025년 연도별 추진계획과 2022년 추진실적을 담은 작은 CSV 파일(약 6KB)이다. 지역 주민이나 도시재생 분석가가 '대전역 도시재생사업의 세부사업이 연도별로 무엇을 계획했고 2022년에 실제로 얼마나 진행됐나'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키(코드)는 없으므로 사업명이나 대전광역시 기관 단위로 맞춰 다른 도시재생 현황 자료와 비교한다.
