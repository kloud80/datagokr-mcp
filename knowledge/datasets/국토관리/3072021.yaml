summary_user: 경기도 동두천시가 운영하는 지정벽보판을 게시대 한 곳당 한 행으로 담은 건별 현황 파일로, 게시대 명칭·위치·지번주소·위도·경도와 벽보 규격(센티미터), 게시기간(일), 신고수수료, 관리기관 연락처를 포함한다. 동두천시에서 행사·홍보 벽보를 붙이려는 시민이나 사업자가 "가까운 지정벽보판이 어디이고, 며칠 동안 얼마를 내고 게시할 수 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 지번주소나 위도·경도를 기준으로 지도 레이어나 다른 시군구의 같은 형식 지정벽보판·현수막게시대 현황과 이름·위치로 맞춰 이어 쓴다.
description_portal: 경기도 동두천시에서 운영중인 지정벽보판 현황 정보를 민원인에게 제공하고자 합니다.데이터는 게시대명칭, 게시대위치, 소재지지번주소, 위도, 경도, 벽보규격, 게시기간, 신고수수료, 관리기관명, 관리기관전화번호의 정보입니다.데이터의 기준일자는 2026년 5월 13일 입니다. 홍보 게시대에 대하여 추가문의사항이 있으실 경우 동두천시청 건축과 광고물관리팀 031-860-2147로 문의주시기 바랍니다.동두천시 대표홈페이지에서도 지정벽보판을 확인하실 수 있습니다.(https://www.ddc.go.kr/ddc/contents.do?key=508)
