summary_user: 서울시가 「국토의 계획 및 이용에 관한 법률」에 따라 지정한 용도지구 중 개발진흥지구를 도형 단위로 담은 공간정보 파일로, 지구 이름표, 시군구 코드, 면적, 길이, 고시 관리 코드 같은 속성을 함께 담는다. 사업자나 도시계획 분석가가 특정 부지가 주거·상업·공업·관광 등 개발진흥지구에 걸치는지, 서울 안 어디에 얼마나 지정돼 있는지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 용도지역·지구 공간정보와는 도형 중첩으로 잇고 통계와는 시군구 코드(SGG_CD) 같은 같은 기관 코드나 이름 매핑으로만 잇는다.
description_portal: '주거기능·상업기능·공업기능·유통물류기능·관광기능·휴양기능 등을 집중적으로 개발·정비하기 위해 지정하는 「국토의 계획 및 이용에 관한 법률」에 의한 용도지구의 하나이다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.문의 : 도시계획과 (02-2133-8339)'
