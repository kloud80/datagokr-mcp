description_portal: 도시경관 기록화 사업은 지난 과거의 모습을 확인하고, 현재를 객관적으로 기록하면서, 미래 도시경관의 변화과정을 확보하는 도시 정체성 유지를 위한 작업입니다. 도시경관을 체계적·지속적으로 기록하여 지역의 역사 및 도시구조 등의 연구를 위한 체계적이고 지속적인 기초자료 구축을 위한 데이터입니다.1,2차 울산 도시경관기록 사업을 통해 촬영된 사진을 선별하여 공개하기로 한 사진에 대한 검색용 데이터로 촬영일, 촬영GPS, 검색용 태그 등을 제공합니다.자세한 사항은 울산광역시 도시경관아카이브에서 확인하시기 바랍니다.https://www.ulsan.go.kr/archive
