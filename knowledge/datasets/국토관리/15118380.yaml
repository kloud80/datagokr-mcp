description_portal: 한국가스공사 제주기지에서 생산되는 응축수 생산량 정보를 제공합니다.LNG 기화 과정에서 발생하는 응축수의 효율적 관리 및 활용을 목적으로 수집되었습니다. 데이터의 세부 항목으로는 생산량, 생산지역, 생산월, 생산시설, 수질검사 결과, 용도별 활용량, 재이용률 등이 포함되어 있습니다. 제주 지역의 지하수 저장량 감소와 용수 부족 문제에 대응하여 응축수를 대체 수자원으로 활용하기 위한 기초자료입니다. 본 데이터는 제주 지역 수자원 관리기관, 환경연구기관, 물 재이용 사업자, 친환경 시설 연구자, 지자체 환경부서, 수자원공사가 응축수 활용 방안 연구에 활용할 수 있으며, 수자원 절약과 친환경 에너지 시설 운영에 기여할 것으로 기대됩니다.
