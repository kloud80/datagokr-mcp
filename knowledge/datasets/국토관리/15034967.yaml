summary_user: 부산광역시 서구 관내 제조업 공장을 공장 한 곳당 한 행으로 담은 파일(csv, 약 20KB)로, 회사명·대표자명·팩스번호·도로명 공장주소·업종명·생산품을 담는다. 서구에 어떤 업종의 공장이 어디에 있고 무엇을 만드는지 알고 싶은 기업지원 담당자나 거래처를 찾는 사업자가 관내 제조업 분포를 확인하는 데 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없으므로, 다른 데이터와는 회사명이나 도로명 주소를 맞춰 보거나 업종명을 업종분류에 수작업으로 대응시켜 잇는다.
description_portal: 부산광역시 서구 관내에 위치한 제조업 공장의 현황에 관한 자료로, 해당 자료에는 지역 내 공장에서 운영 중인 회사의 기본 정보와 세부 내용이 포함되어 있습니다. 구체적으로는 각 회사의 회사명, 대표 팩스번호, 공장 주소지 등 기본 인적 사항뿐만 아니라, 영위하고 있는 업종의 종류, 주요 생산품목 등 생산 활동과 관련된 상세 항목까지 체계적으로 정리되어 있습니다. 이 자료는 부산광역시 서구 내 제조업체의 산업 분포와 현황을 파악하고, 행정 업무 및 기업 지원 정책 수립에 기초 자료로 활용할 수 있습니다.
