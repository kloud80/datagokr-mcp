summary_user: 한국토지주택공사가 관리하는 건설임대주택 단지 정보를 단지 단위로 담은 전국 파일 데이터로, 단지명·주소·준공일자·공급유형·형명·공급면적·세대수 등 24,259행을 싣는다. 전세 사기 이후 임차인이나 분석가가 "내가 살 곳 주변에 어떤 공공 건설임대 단지가 있고 규모는 어떤지"를 확인하는 데 쓴다. 단지코드(apt_complex_cd)와 주소·상세주소(address)를 키로 삼아 전월세 실거래 자료와 이어 쓴다.
description_portal: 한국토지주택공사에서 관리하는 건설임대 주택 단지 정보(단지명, 주소, 준공일자, 세대수, 공급유형, 형명, 공급면적 등)를 제공합니다. 가장 많은 계약이 된 단지는 재건축신현하늘채로 365건 입니다. 가장 많은 계약면적수(미터제곱)은 1. 50~60m^2 7203 물건, 2. 40~50m^2 4595 물건, 3. 30~40m^2 4004 물건, 4. 80~90m^2 2657 물건, 5. 20~30m^2 2126 물건으로 나타납니다. 단지를 통한 총 공급 세대는 1,661,777 호를 공급했으며, 수원역푸르지오자이가 3,472호로 가장 많은 세대를 공급한 단지입니다.
