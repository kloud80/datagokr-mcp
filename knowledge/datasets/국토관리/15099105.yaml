summary_user: 한국수자원공사가 관리하는 댐(다목적댐·용수댐)과 보의 이름(damnm)과 고유 코드(damcode)를 댐 단위로 담은 코드 목록 API이며, 검증 호출에서 전국 59행이 수신됐다. 댐 운영·수위·방류 자료를 조회하려는 분석가나 개발자가 원하는 댐의 코드를 찾을 때 쓴다. 전역 조인 키는 확인되지 않아 댐 이름·코드 매핑이나 같은 기관(K-water)의 다른 댐 데이터의 코드로 이어 쓴다.
description_portal: 'ㅁ 개     요 :  K-water에서 관리중인 댐(다목적댐, 용수댐) 및 보의 코드정보본 데이터는 한국수자원공사가 관리하는 전국 주요 댐의 고유 코드를 조회할 수 있도록 제공한 것입니다. 각 댐에 부여된 식별 코드로 다양한 분야에서 표준화된 참조값으로 활용되고, 이를 통해 사용자는 원하는 댐의 정보를 신속하고 정확하게 검색할 수 있습니다. 해당 자료는 댐 운영 현황 조회, 수자원 데이터 연계, 시설 유지관리, 재난 대응 게획 수립 등 다양한 업무에 활용 가능합니다. 또한, 연구기관, 공공기관, 민간 기업 등에서 댐 관련 데이터 분석, 정책 연구, 학술 조사 시 기초 자료로 활용할 수 있습니다.변경전 : 수문제원현황>댐코드 조회 서비스(http://opendata.kwater.or.kr/openapi-data/service/pubd/dam/damCode/list)변경후 : 댐코드 조회(http://apis.data.go.kr/B500001/dam/damCode/damCodelist)추후 기본정보 수정 예정'
