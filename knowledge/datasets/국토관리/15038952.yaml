description_portal: 지하수원수대금은 제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법 제387조에 고시되 있으며, 지하수법 제30조의3에 해당하는 지하수 이용 부담금에 해당되는 내용입니다. 제주특별차지도는 지하수의 적정한 보전ㆍ관리에 필요한 재원의 조성을 위하여 지하수원수대금을 부과ㆍ징수하고 있습니다. 제주특별자치도개발공사는 이에 따라 매월 취수하는 지하수를 제주상하수도본부에 납부하고 있습니다.제주특별자치도개발공사가 매월 납부하는 지하수 원수대금 정보로 연도별, 월별 지하수 원수대금 정보를 포함하고 있습니다.지하수 이슈에 대응하기 위한 수자원 보호 노력의 일환으로 제주특별자치도개발공사의 지하수 원수대금 납부 및 투명한 ESG 경영 내역을 제공하는 데이터입니다.
