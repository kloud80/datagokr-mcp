summary_user: 오산시 관내 지식산업센터를 센터 한 곳당 한 행으로 담은 현황 파일로, 주소·좌표, 용도지역, 부지·건축·공장시설 면적, 층수, 유치가능·입주업체 수, 분양형태, 공사진행상황, 허가·착공·준공·사용승인 일자를 포함한다. 오산시에 입주할 지식산업센터를 찾는 사업자가 어느 센터가 준공됐고 분양인지 임대인지, 입주 여유가 얼마나 남았는지를 확인하는 데 쓰고, 분석가는 시 안의 센터 분포와 입주율을 살피는 데 쓴다. 사업자등록번호(bizno)로 사업자 정보와 잇고, 주소·좌표로 지도나 건축물대장 등 위치 기반 데이터와 맞춰 쓴다.
description_portal: 본 데이터는 오산시 관내 지식산업센터에 대한 현황 정보를 제공합니다. 각 센터의 주소, 대표 전화번호, 위도 및 경도 좌표, 건축 연면적, 입주 기업 수, 분양 또는 임대 형태, 공사 진행 현황, 준공 및 착공 연도, 사용 승인일, 사업자등록번호 등의 세부 내용을 포함합니다. 해당 정보는 오산시 지역의 지식산업센터 분포, 기업 활동 현황, 창업 및 기업유치 여건 등을 종합적으로 파악할 수 있는 기초 자료로 활용되며, 정책 수립, 행정 지원, 기업 유치 전략 등에 필요한 기초 인프라 데이터입니다. (소재지주소, 전화번호, 위도 및 경도, 면적, 입주업체수, 분양형태, 공사진행상황, 준공 및 착공 연도, 사용승인일, 사업자등록번호 등)
