summary_user: 세종특별자치시에 등록된 주택임대관리업체 목록을 업체 한 곳당 한 행으로 담은 파일로, 업체명·대표자명·도로명/지번 소재지 주소·전화번호·데이터기준일로 이루어진다(포털 설명 기준 6개 업체, 파일 709바이트). 세종시에서 임대주택 관리를 맡길 업체를 찾는 임대인이나, 계약 상대 업체가 등록 업체인지 확인하려는 임차인이 쓴다. 전역 조인 키나 코드표가 없어서 다른 데이터와는 업체명이나 주소 문자열을 맞춰 이어야 하며, 소재지 주소를 지오코딩해 지도에 올리거나 다른 시도의 주택임대관리업 현황과 나란히 놓고 보는 방식으로 쓴다.
limits: 세종시 한 곳의 등록 업체 명부라서 관리 물량, 영업 실적, 행정처분 이력은 담지 않는다. 사업자번호 같은 공통 식별자가 없으므로 다른 데이터와 연결할 때는 업체명이나 주소를 직접 맞춰야 한다.
