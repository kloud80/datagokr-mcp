description_portal: 세종특별자치시 주택임대관리업 등록 현황을 제공하는 데이터입니다.본 데이터는 연번, 업체명, 대표자명, 소재지 도로명주소, 소재지 지번주소, 전화번호, 데이터기준일로 구성하고 있는 자료입니다.세종특별자치시 주택임대관리업 등록 현황은 한빛주택종합관리, 스마트하우징, (주)케이알서비스, 주식회사장남, (주)세종이엠씨, 그린씨앤엠 주식회사 총 6개의 업체가 등록되어있으며어진동, 연기면, 장군면, 나성동 등에 소재하고 있습니다.2025년 12월 17일 기준의 데이터로, 데이터 업데이트 주기는 연간이며 2026년 12월에 업데이트 될 예정입니다.이 데이터는 세종특별자치시 도시주택국 주택과에서 관리하고 있는 데이터입니다.문의사항은 044-300-5944로 연락해주시기 바랍니다.
