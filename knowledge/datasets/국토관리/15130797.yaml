summary_user: 경기도 내 공동주택 단지를 한 행씩 담은 단지 목록으로, 단지유형(아파트·연립·다세대 등), 단지코드, 변경구분, 지번 기반 토지 식별자(PNU), 단지명을 담는다. 분석가가 '이 실거래·공시가격 자료의 단지명이 어느 공동주택 단지에 해당하는가'처럼 단지를 하나로 식별해 다른 주택 자료와 맞출 때 쓴다. 단지코드(apt_cd)는 실거래 단지명·공시 동호·청약 단지를 잇는 매핑 기준으로 쓰이고 PNU(pnu_no)는 토지·좌표 자료와 붙일 때 후보가 되지만, 실측상 전역 조인 키로 확인되지 않아 이름·코드 매핑을 거쳐 연결해야 한다.
description_portal: 이 데이터는 경기도 내 공동주택 단지의 주요 속성을 체계적으로 제공하는 자료로, 단지유형(아파트, 연립·다세대 등), 아파트코드, 변경구분, PNU번호(지번 기반 식별자), 단지명과 같은 항목을 포함합니다. 이러한 정보는 각 단지를 고유하게 식별하고 행정구역 단위로 주거지를 체계적으로 파악하는 데 활용될 수 있습니다. 단지별 PNU는 고유한 토지 식별 코드로, 이를 좌표 정보와 연계하여 지도 시각화로 활용하거나, 인근 생활 인프라와의 연계 분석, 주거밀집도 및 공급 현황 파악, 인구 이동이나 주택 수요 예측 연구에도 유용합니다.
