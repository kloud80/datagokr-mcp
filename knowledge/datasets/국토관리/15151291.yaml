summary_user: 승강기 검사 접수 건을 건물 단위로 담은 API로, 포털 설명상 건물명·주소·시도·시군구·검사종류·검사대수·제조업체·보수업체와 연락처·승강기 구분과 형식을 제공하며 범위는 전국이고 위치는 개별 주소 수준이다. 건물 관리자나 입주민이 우리 건물 승강기의 검사 접수 현황과 담당 보수업체를 확인하거나, 분석가가 지역별 검사 접수 대수와 업체 분포를 살펴보는 데 쓴다. 실측 필드에서 전역 조인 키를 찾지 못해, 다른 데이터와는 건물명·주소나 업체명 같은 이름 매칭, 또는 같은 기관(한국승강기안전공단)의 다른 승강기 데이터와 맞춰 이어 쓴다.
limits: 공통 코드나 고유 식별자가 확인되지 않아 건축물대장 등 다른 데이터와 정확히 조인하기 어렵고, 주소·이름 매칭에 의존해야 한다. 응답 필드 명세에는 페이지 정보(결과 수·페이지 번호·전체 건수)만 정리돼 있으니, 실제 항목 구성은 호출 결과로 확인해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
