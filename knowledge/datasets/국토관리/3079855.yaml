description_portal: '부산광역시 사하구 관내의 건축허가 현황에 대한 데이터를 제공합니다.본 데이터는 대수선, 증축, 용도변경, 신축 등 다양한 건축 구분별로 허가된 건축물의 세부 정보를 포함하고 있으며, 건축물의 위치, 용도, 규모, 설계 및 시공 관계자 정보 등을 종합적으로 확인할 수 있습니다.*주요 데이터 컬럼별 상세설명○ 건축구분 → 건축 행위의 유형(신축, 증축, 대수선, 용도변경 등)○ 허가번호 → 건축허가를 식별할 수 있는 고유 번호○ 대지위치 → 해당 건축물의 도로명 주소○ 지목 → 대지의 지목(예: 대, 공장용지, 창고용지 등)○ 대지면적/건축면적/연면적 → 각각의 면적 정보(㎡ 기준)○ 건폐율/용적률 → 건축물의 건폐율 및 용적률(%)○ 허가일 → 건축허가가 승인된 날짜○ 최대층수/최고높이 → 건축물의 지상·지하 최대 층수 및 전체 높이(m)○ 동수 → 건축물의 동 수○ 주용도/부속용도 → 건축물의 주요 및 부속 용도○ 용도지역/지구/구역 → 해당 부지의 도시계획 상 지정된 지역·지구·구역○ 설계사무소명/감리사무소명/시공자사무소명 → 해당 건축물의 설계, 감리, 시공을 맡은 업체명'
