summary_user: 경기도가 구매한 민간데이터로, 도착 행정동(읍면동) 기준 유입 인구 수를 기준일·도착 시간대·이동목적·성별·연령대별로 묶은 집계 자료이며 도착지의 시도·시군구·행정동 이름과 중심 좌표를 함께 담는다. 지자체·연구기관 분석가가 '출근 시간대 어느 행정동으로 어떤 연령대가 어떤 목적으로 몰리는가' 같은 생활인구 유입 패턴과 정책 효과 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 도착 행정동 코드·이름으로 다른 행정동 단위 통계와 맞추거나 중심 좌표로 지도에 올려 쓰며, 이동목적·연령대 코드의 뜻은 경기도 민간데이터 규격서 데이터셋에서 확인한다.
description_portal: 이 데이터는 경기도에서 구매한 민간데이터로 행정동 간 유입 인구를 이동목적별·성별·연령대별·시간대 기준으로 집계한 자료입니다.이를 통해 시간대별 인구 유입 패턴, 연령·성별 이동 특성, 생활권역별 활동 목적 분포를 파악할 수 있으며, 연구기관에서는 생활인구 기반 정책 효과 분석, 연령별 생활 패턴 연구, 인구 구조 변화에 따른 수요 예측에도 유용합니다.대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.다운로드 받으신 파일의 컬럼명에 대한 정보와 컬럼 중 코드에 해당하는 설명은 경기도 민간데이터 규격서 데이터셋에서 확인하실 수 있습니다.
