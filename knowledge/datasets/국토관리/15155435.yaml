description_portal: 본 데이터는 한국토지주택공사에서 공급하는 토지 중에서 선착순(수의) 계약의 방식으로 공급하는 토지의 상세 내역을 제공합니다. 일반적으로 토지를 민간에 판매하는 경우에는 경매를 통해 낙찰자를 결정하는 입찰 방식과, 신청자에게 추첨을 통해 필지를 배정하는 추첨 방식이 사용되고 있습니다. 그러나 토지 미분양, 당첨 취소, 계약 포기 그 외 다양한 사유로 미분양인 토지는 선착순의 방식으로 계약자를 결정하여 수의계약을 체결하기도 합니다. 본 데이터의 토지 상세 내역에는 지역, 사업지구, 지번, 공급용도, 면적, 단가, 가격, 용도지역, 건폐율, 용적율, 토지사용가능시기 등의 정보가 포함되어 있습니다. 자세한 사항은 페이지에 포함된 분양 문의처로 문의하시면 얻으실 수 있습니다. 다만 본 데이터는 매월 첫째 주 및 셋째 주에 업데이트 되므로 목록 중에 이미 계약이 완료된 토지가 남아있을 수 있다는 점 유의하시기 바랍니다.
