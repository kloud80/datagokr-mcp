summary_user: 전북특별자치도 내 전주·군산·남원·김제 공영도매시장과 공판장의 농산물 판매 실적을 연도별로 시장마다 연간 거래량(톤)과 거래액(백만원) 합계로 정리한 집계 통계이며, 파일 크기는 526바이트로 행 수가 적다. 농업 정책 연구자나 유통업 종사자가 "전북의 도매시장별 농산물 거래 규모가 해마다 어떻게 변했나"를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 시장 이름을 직접 맞춰 붙여야 한다.
description_portal: 전북특별자치도 내 주요 공영도매시장 및 공판장의 연도별 농산물 판매 실적을 정리한 통계 데이터입니다. 이 자료는 전주, 군산, 남원, 김제 등 주요 도시의 공영도매시장과 기타 공판장에서 이루어진 농산물의 연간 총 거래량(톤)과 거래액(백만원)을 상세히 보여줍니다. 이 데이터는 지역 농산물 유통의 중심지 역할을 하는 도매시장의 경제적 규모와 활동성을 파악하는 데 중요한 지표입니다. 유통업 종사자나 농업 정책 연구자들은 이를 통해 시기별 거래 동향을 분석하고, 지역 농산물의 유통 구조를 이해하여 효율적인 수급 계획을 수립하는 데 활용할 수 있습니다.
