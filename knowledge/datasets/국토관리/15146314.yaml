description_portal: '2005년~2016년 통계 데이터 ○ 통계개요* 통계명 : 공동주택 현황(사용년수별)* 통계종류 : 서울시 공동주택 현황을 사용년수 기준으로 제공하는 일반ㆍ보고통계* 근거법령 :「주택법」에 의거한 주거실태조사* 작성목적 : 공동주택의 건립현황ㆍ규모ㆍ층수ㆍ구조 등의 제현황을 파악하여, 공동주택을 효율적으로 관리하고 건설 및 주거환경관련 정책수립을 위한기초자료로 활용하는 것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 사용년수기준 아파트 단지ㆍ동ㆍ세대수 현황○ 용어설명○ 기 타* 해당연도 12월 31일 기준 산정* 2016년 이전 : 주택법에 의거 관리되는 20세대이상 공동주택 기준2017년 이후 : 분양가구수 30세대 이상인 공동주택 기준'
