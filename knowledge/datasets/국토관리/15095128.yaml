summary_user: 서울특별시 중랑구의 대형마트·백화점·쇼핑센터·복합쇼핑몰 같은 대규모점포를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·전화번호·업태·중부원점TM(EPSG:5174) 좌표를 포함한다. 주민이나 상권 분석가가 '중랑구에서 지금 영업 중인 대형마트와 백화점은 어디이고 언제 문을 열거나 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중랑구의 대형마트, 백화점, 쇼핑센터, 복합쇼핑몰 등 대규모 점포 인허가 정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
