summary_user: 대구광역시 서구 관할 공원·녹지에 설치된 화장실을 시설 한 곳당 한 건으로 담으며, 시설명·위치(주소)·설치 연도를 제공한다. 주민이나 공원 이용자가 서구 어느 공원에 화장실이 있는지 찾거나, 구청·분석가가 설치 연도를 보고 오래된 화장실의 교체 대상을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공원·편의시설 데이터와는 시설명이나 주소 문자열을 맞춰서만 이을 수 있다.
limits: 공통 코드나 표준 식별자가 없어 다른 데이터와 자동으로 결합되지 않으며, 범위는 서구 한 시군구에 한정되고 좌표가 없는 비공간 자료다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
