summary_user: 서울특별시 도시계획시설 중 공원·녹지·광장 같은 공간시설의 도형을 시설 단위로 담은 공간정보로, 시설 분류(대·중·소분류), 결정고시 관리코드, 시군구, 집행상태, 면적·길이를 함께 담는다. 도시계획 담당자나 부동산·개발 분석가가 '이 지역에 결정된 공원·녹지 시설이 어디에 있고 집행됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군구 코드(SGG_CD)나 시설 이름·결정고시 코드를 같은 기관의 다른 도시계획 데이터와 매핑해 잇는다.
description_portal: '서울특별시 공간시설 공간정보 입니다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.*원본시스템 : 서울도시공간포털(https://urban.seoul.go.kr/view/new/main.html)제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
