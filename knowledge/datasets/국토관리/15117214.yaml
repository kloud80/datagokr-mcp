summary_user: LX 한국국토정보공사 직원들이 추천한 전국 식당·카페를 한 곳당 한 행으로 담은 원천 목록으로, 상호·업종·주소·메뉴·영업시간·주차정보와 추천(제안)·댓글 수를 포함한 CSV 파일(약 140KB)이다. 출장자나 여행객이 '이 지역에서 현지 직원이 추천하는 식당이 어디이고 주차가 되는가'를 찾을 때, 또는 분석가가 지역별 골목 식당 분포를 볼 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 상호·주소 문자열로 맞춰 연결해야 한다.
description_portal: 전국 145개 지사, 4천여 명의 LX 직원들이 발로 뛰며 직접 검증한 '진짜 동네 맛집'을 공개합니다. 수도권부터 지방 소도시까지, 현지에서 근무하는 직원만 아는 숨은 로컬 맛집부터 지역 주민들이 대를 이어 즐겨 찾는 골목식당까지, 광고나 협찬 없이 오직 직원들의 실제 경험으로 엄선한 생생한 맛집 정보를 제공합니다.제공 정보는 상호명·주소·전화번호·메뉴 등 기본 정보는 물론, 위치 기반 거리 안내 및 길찾기 서비스와 연동되어 출장지나 낯선 여행지에서도 현지인처럼 맛집을 찾을 수 있습니다. 전국 방방곡곡에 퍼져 있는 LX 직원들의 생생한 추천 덕분에, 포털 검색에서는 쉽게 발견하기 어려운 진짜 로컬 맛집을 만나볼 수 있습니다.나아가 이 데이터는 단순한 맛집 안내를 넘어, 소상공인과 골목상권을 응원하는 의미 있는 공공데이터입니다. 지역 곳곳의 작은 식당과 카페가 더 많은 사람들에게 알려질 수 있도록, LX 한국국토정보공사가 지역경제 활성화에 함께합니다.
