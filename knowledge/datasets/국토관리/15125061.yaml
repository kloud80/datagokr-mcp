summary_user: 도시관리계획으로 결정된 수도 상수원보호구역의 지역정보를 전국 범위로 담은 연속주제도 공간파일(SHP)로, vworld에서 시도별 파일로 내려받는다. 개발·건축을 검토하는 사업자나 토지 담당자가 특정 땅이 상수원보호구역에 걸리는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시군구 구분값(SGG_OID 등)의 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
