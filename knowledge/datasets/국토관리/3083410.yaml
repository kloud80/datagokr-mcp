summary_user: 제주시 읍면동별 마을회관을 한 행씩 담은 시설 목록으로, 회관명·주용도·층별용도·소재지·건립연도·규모를 담고 범위는 제주시 한 곳이며 개별 주소 단위다. 복지·지역행정 담당자나 분석가가 '어느 읍면동에 마을회관이 얼마나 있고, 오래된 회관은 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어서 다른 데이터와는 소재지 주소나 읍면동 이름을 맞춰 연결해야 한다.
limits: 행정동 코드나 건물 식별번호 같은 공통 키가 없어 다른 데이터와 자동 조인이 되지 않는다. 범위는 제주시뿐이라 서귀포시나 다른 지역과 비교하려면 별도 자료가 필요하다.
