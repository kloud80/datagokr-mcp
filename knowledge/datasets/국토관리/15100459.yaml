summary_user: 진주시에 공장등록된 업체 중 성형기 제조업 관련 업종코드를 가진 사출성형 제조업체를 업체(공장) 한 곳당 한 행으로 담은 명부로, 회사명·도로명 공장주소·업종번호와 업종명·전화·팩스·생산품을 포함한다(파일 약 8KB 규모의 소규모 CSV). 진주에서 사출성형 부품을 맡길 협력업체를 찾는 사업자나, 지역 내 성형기 제조업체가 어디에 몰려 있는지 보려는 분석가가 쓴다. 사업자번호·필지번호 같은 전역 조인 키가 없어 다른 공장등록 데이터와는 회사명·도로명주소 매칭이나 업종번호(KSIC 계열 코드) 대조로만 이을 수 있다.
description_portal: 진주시 성형기 제조업체 현황 데이터는 진주시에 공장등록된 업체 중 성형기 제조업 관련 업종코드를 보유한 사출성형제조업체의 정보를 체계적으로 정리한 자료입니다. 해당 데이터에는 회사명, 공장 주소, 대표 업종, 업종번호, 업종명 등 기본 정보를 포함하며, 전화번호, 팩스번호, 주요 생산품 등 업체 운영과 관련된 세부 항목도 함께 제공합니다. 이를 통해 지역 내 성형기 제조업체의 분포를 파악하고 산업 구조 분석, 기업지원 정책 마련, 산업단지 관리 및 관련 분야 투자전략 수립에 활용할 수 있는 기초 자료로 활용됩니다.
