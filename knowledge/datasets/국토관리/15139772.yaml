summary_user: 재난안전데이터 공유플랫폼에서 받는 전국 하수처리시설의 시설별 정보로, 1~3차 처리방식, 일평균·일최대·시간최대 처리용량, 수처리시설(유입펌프·최초침전지·반응조·최종침전지·고도처리시설)과 슬러지 처리시설(농축조·소화조·탈수방식·최종처분방법) 구성을 시설물번호 단위로 담는다. 지자체 하수도 담당자나 분석가가 "우리 지역 하수처리장은 어떤 처리방식을 쓰고, 하루 최대 얼마까지 처리하도록 설계됐나" 같은 질문을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없다. 방류수 수질(TMS)이나 처리구역 데이터와는 시설명 등 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 하수처리시설 정보로, 시설물번호, 처리방식1차, 처리방식2차, 처리방식3차, 처리용량일평균, 처리용량일최대, 처리용량시간최대 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
