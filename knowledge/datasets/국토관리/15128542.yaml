description_portal: 지적재조사사업은 토지의 실제 이용 현황과 지적도 간에 발생하는 불일치 문제를 해결하기 위해 추진되는 국책사업입니다. 이 사업은 토지 경계를 정확히 설정하여 국민의 재산권을 보호하고, 나아가 효율적인 국토 관리와 행정업무의 효율성 향상을 목표로 합니다. 특히, 경계 오류로 인한 분쟁을 최소화하고, 체계적인 토지관리를 통해 국가 자산의 가치를 높이는 데 중요한 역할을 합니다. 진주시에서는 2013년부터 2025년까지 지적재조사사업을 진행하며 완료된 지구에 대해 다양한 데이터를 축적하였습니다. 이 데이터에는 사업명, 소재지, 지구지정일, 사업완료일과 함께 종전 지번수 및 면적, 완료 확정된 지번수 및 면적, 그리고 증감 지번수와 증감 면적 등이 포함되어 있습니다.
