summary_user: 정읍시 안의 원룸·오피스텔 건물을 한 건씩 담은 파일로, 건물별 구분, 주소, 주용도·기타용도, 가구수, 사용승인년도를 시군구 범위에서 개별 주소 단위로 제공한다. 정읍에서 자취방을 구하려는 임차인이나 소형 임대주택 공급을 살피는 분석가가 "어느 동네에 언제 지어진 원룸·오피스텔이 몇 가구나 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 이름 매칭하거나 같은 기관(정읍시) 자료끼리 이어 써야 한다.
description_portal: 전북특별자치 정읍시의 원룸 및 오피스텔 현황 중 구분 , 주소, 주용도, 기타용도, 가구수, 사용승인년도 자료를 제공합니다.원룸 및 오피스텔 현황 데이터를 개방하며 지역별 공급·수요 현황을 정확히 파악할 수 있어 주거 정책의 효율성이 높아집니다. 또한 부동산 정보의 투명성이 향상되어 임차인의 합리적 선택을 돕고, 민간 서비스 기업의 분석·매칭 서비스 혁신을 촉진해 시장 경쟁력과 이용자 편익이 함께 증대될 것으로 예상됩니다.기타 관련된 궁금한 사항은 담당부서인 정읍시 건축과로 문의하시기 바랍니다.
