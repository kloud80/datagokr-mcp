description_portal: 부산광역시 사하구 관내 빈집 실태조사 현황 데이터를 제공합니다.행정동별 빈집을 주택 유형과 빈집 등급에 따라 분류하여 빈집의 분포와 관리 현황을 확인할 수 있습니다. 주택 유형은 단독주택, 다가구주택, 다세대주택, 연립주택, 아파트 및 그 외 유형으로 구분하며, 빈집 상태는 1등급, 2등급, 3등급으로 구분하여 제공합니다.*주요 데이터 컬럼별 상세설명○ 행정동 → 빈집 실태조사가 실시된 사하구 행정동○ 단독 → 행정동별 단독주택 유형의 빈집 수○ 다가구 → 행정동별 다가구주택 유형의 빈집 수○ 다세대 → 행정동별 다세대주택 유형의 빈집 수○ 연립 → 행정동별 연립주택 유형의 빈집 수○ 아파트 → 행정동별 아파트 유형의 빈집 수○ 그 외 → 건축물대장 확인 불가 또는 용도 혼합 등 그 외 유형의 빈집 수○ 1등급 → 1등급으로 분류된 빈집 수○ 2등급 → 2등급으로 분류된 빈집 수○ 3등급 → 3등급으로 분류된 빈집 수
