summary_user: 고창군이 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 CSV 파일(약 5.6KB)로, 읍면명·상호명·주소·전화번호와 대표 품목 두 가지 및 그 가격을 담는다. 고창 주민이나 관광객이 "고창 ○○면에서 싼 값에 식사할 수 있는 곳과 메뉴 가격은?"을 찾을 때 쓰고, 분석가는 읍면별 착한가격업소 분포나 품목 가격 수준을 비교하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소(지오코딩)나 읍면명 같은 이름 매칭으로 연결한다.
description_portal: 전라북도 고창군 착한가격업소 데이터는 지역 내에서 합리적인 가격과 우수한 서비스로 운영되는 업소 정보를 제공하는 자료입니다. 이 데이터에는 업소명, 주소, 주요 메뉴 및 가격 등이 포함됩니다. 착한가격업소는 물가 안정과 소비자 부담 완화를 위해 정부와 지자체가 지정하며, 청결한 환경과 친절한 서비스도 중요한 기준이 됩니다. 해당 데이터는 지역 주민과 관광객이 경제적인 소비를 할 수 있도록 돕고, 소상공인의 경쟁력을 강화하는 데 활용됩니다. 이를 통해 지역 경제 활성화와 소비자 만족도를 높이는 효과를 기대할 수 있습니다.
