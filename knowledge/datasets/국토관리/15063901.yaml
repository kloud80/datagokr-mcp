summary_user: 수원시 내 배수지를 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·도로명/지번 주소·위도·경도와 시설연도, 시설용량(톤), 부지면적, 최고·최저수위, 흡입·토출관경을 담는다(파일 크기 약 2KB의 소규모 목록). 수원 시민이나 분석가가 '우리 동네에 물을 대는 배수지는 어디이고 용량은 얼마인가', '단수·재난 때 어느 배수지가 영향을 주나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 상수도 데이터와는 시설명이나 주소·좌표로 맞춰 붙이거나, 같은 수원시 기관 데이터끼리 연결한다.
description_portal: 경기도 수원시 배수지현황으로 시설명, 소재지위치, 시설연도, 시설용량, 부지면적, 수위, 흡입관경, 토출관경 정보를 제공합니다. 자신이 거주하는 지역의 배수지 규모(용량)와 운영 수준을 알 수 있어, 상수도 공급 안정성에 대한 신뢰의 기반이 될 수 있으며 가뭄, 단수, 재난 시 어떤 배수지가 생활에 직접 영향을 주는지 파악하는데 활용할 수 있습니다. 최고, 최저 수위 등 정보는 물 부족 위험이 있는지, 혹은 안정적인 수위가 유지되는지 확인 할 수 있습니다. 재난 시 긴급 급수 계획을 이해하는 데 도움이 됩니다. 부지 면적, 흡입관경 등 세부 수치가 개방되어 기초 시설을 눈에 보이는 생활자원으로 인식할 수 있습니다.
