summary_user: 서울특별시의 국토계획법상 용도지역을 도면 객체 한 건씩 담은 데이터로, 각 건에 도면 분류 코드, 결정고시 관리코드, 라벨명, 시군구코드(SGG_CD), 면적·길이가 들어 있고 범위는 서울특별시 한 곳입니다. 부동산 사업자나 도시계획 분석가가 '이 자치구에서 어떤 용도지역이 얼마만큼의 면적으로 지정돼 있나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 다른 데이터와는 시군구코드나 라벨명 같은 이름·코드 매핑, 또는 서울시 내부 코드로만 연결한다.
description_portal: 인구와 산업이 밀집되어 있거나 밀집이 예상되어 그 지역에 대하여 체계적인 개발·정비·관리·보전 등이 필요한 지역으로서 「국토의 계획 및 이용에 관한 법률」에 의한 용도지역의 대분류 중 하나입니다.해당 데이터의 원본 시스템은 서울도시공간포털(https://urban.seoul.go.kr)입니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
