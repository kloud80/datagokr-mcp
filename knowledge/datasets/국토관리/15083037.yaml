summary_user: 주택도시보증공사가 주택분양보증·조합주택시공보증을 선 전국 공사 중 아파트·상가 사업장별로 시행사, 사업장명, 시도·시군구, 보증종류, 보증서 발급일, 총세대수, 사용검사 예정일, 공정률 제출년월과 공정률을 한 행씩 담은 CSV 파일(약 137KB)이다. 분양을 받았거나 받으려는 입주예정자가 "내가 계약한 단지 공사가 몇 % 진행됐고 사용검사는 언제 예정인가"를 확인하거나, 분석가가 지역별 공사 진척과 입주 예정 물량을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구명(지역명·시군구명)이나 사업장명·시행사명을 이름으로 맞춰 이어 써야 한다.
description_portal: 주택도시보증공사가 보증(주택분양보증, 조합주택시공보증 등)한 사업장 중 전국에 공사가 진행 중인 집합건물(아파트, 상가) 사업장 공정율 현황(시행사, 사업장명,지역명,지역 세부내용,보증 세대 수보증서발급일자, 사용검사예정일자,세대수 등)을 나타낸 것으로서 매월 공사가 관리하고 있는 공사 관련 데이터를 주기적으로 업로드하고 있으며 당해 사업장에 대한 세부현황 등을 파악할 수 있는 자료입니다.공사가 보증하고 있는 전반적인 상품(주택분양보증, 조합주택시공보증)에 대한 내용은 아래와 같습니다.주택분양보증이란 사업주체가 파산 등의 사유로 분양계약을 이행할 수 없게 되는 경우 당해 주택의 분양의 이행 또는 납부한 계약금 및 중도금의 환급을 책임지는 보증이며,보증채권자는 당해사업장의 입주예정자입니다.조합주택시공보증 은 조합주택을 건설하는 주택건설사업의 시공자가 파산 등의 사유로 당해 주택에 대한 시공책임 등을 이행할 수 없게 되는 경우에 시공을 이행하거나 조합의 손해금 지급을 책임지는 보증으로서 보증채권자는 당해 주택사업의 시행자인 주택조합, 정비사업조합 또는 토지등 소유자를 말합니다.
