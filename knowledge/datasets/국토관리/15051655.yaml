summary_user: 인천광역시에 있는 산업단지별로 구분, 단지명, 준공년도, 조성면적, 입주업체 수, 등록업체 수, 종업원 수, 관리기관을 한 행씩 담은 단지 단위 현황 파일이며, 활용신청 없이 받는 약 1KB 크기의 CSV다. 인천의 어느 산업단지에 기업과 종업원이 많이 모여 있고 각 단지를 어느 기관이 관리하는지 확인하려는 분석가·기업 담당자·시민이 쓴다. 전역 조인 키가 없으므로 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황 같은 산업단지코드 원장과는 산업단지명을 맞춰 이어 쓴다.
description_portal: 인천광역시 산업단지 입주 현황 공공데이터는 인천에 위치한 산업단지들의 운영 및 기업 입주 현황을 파악할 수 있는 자료입니다.이 데이터에는 산업단지명, 준공년도, 조성면적 같은 산업단지 기본 정보는 물론, 입주업체 및 등록업체 수, 종업원 수, 관리기관 정보가 포함되어 있어 지역 산업의 활력을 보여줍니다.이 데이터는 정부 기관이 지역 경제 분석, 고용 동향 파악, 투자 유치 정책 수립 등에 활용할 수 있는 핵심 자료이며, 기업 관계자들은 시장 조사나 입주 환경 분석에 이용할 수 있습니다. 또한, 학술 연구나 일반 시민의 지역 산업 이해를 돕는 데도 유용하게 사용됩니다.해당 데이터는 인천시 홈페이지->경제, 투자 -> 기업정보 및 공공데이터포털에서 확인할 수 있습니다.
