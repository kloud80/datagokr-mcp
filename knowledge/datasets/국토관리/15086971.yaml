summary_user: 광주 광산구 아파트 단지별로 단지명·동·지번 주소, 세대수, 법적·가능 주차대수와 경로당·보육시설·주민회의 공간·작은도서관·놀이터·텃밭·북카페 유무, 경비실·운동시설 수를 한 행씩 담은 CSV 파일(약 23KB)이다. 구청·연구자·주민단체가 '광산구 어느 단지에 작은도서관이나 경로당 같은 공동체 공간이 있고 세대수 대비 주차는 넉넉한가'를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 단지명이나 지번 주소를 이름 매칭해 잇거나 같은 광산구 자료끼리만 연결한다.
description_portal: 광주광역시 광산구에서는 아파트 공동체 자원 공간시설 현황에 관한 정보를 제공하고 있습니다. 이 자료에는 단지명, 주소, 세대수, 주차 시설 여부를 비롯하여 경로당, 보육시설, 주민회의 공간, 작은도서관, 소통로, 경비실, 운동시설, 놀이터, 텃밭, 북카페 등의 다양한 공동체 자원 시설에 대한 세부 현황이 포함되어 있습니다. 다만, 이 데이터는 광산구 정책 분석을 목적으로 한시적으로 수집된 자료로, 2015년에 한해 수집된 내용만 존재합니다. 따라서 현재 시점에서는 최신 현황과 다소 차이가 있을 수 있으나, 당시의 아파트 단지 내 공동체 시설 분포와 구성에 대해 이해하는 데 기초 자료로 활용될 수 있습니다.
