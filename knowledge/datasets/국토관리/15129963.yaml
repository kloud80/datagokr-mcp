summary_user: 평택시 도시계획정보시스템(UPIS)에 등록된 수산자원보호구역을 도형 단위로 담은 CSV 파일로, 도형별 관리번호·결정고시관리코드·라벨명·면적·길이를 담으며 파일 크기가 411바이트에 불과해 레코드는 몇 건 수준이다. 평택시 안에서 수산자원보호구역이 어디에 얼마 면적으로 지정됐는지 확인하려는 토지 소유자·개발사업자·도시계획 분석가가 쓴다. 전역 조인 키는 없고 시군구코드나 결정고시관리코드로 같은 기관의 다른 UPIS 용도구역·결정고시 데이터와 이어 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 수산자원보호구역현황으로 현황도형 관리번호, 도형 조서관리 코드, 결정고시관리코드, 라벨명, 면적_도형, 길이_도형 등의 항목을 제공합니다.수산자원보호구역은 수산자원의 보호와 육성을 위해 공유수면이나 그에 인접한 토지를 지정한 구역입니다. 주로 서남해안 일부 지역에 지정되어 있으며, 어업 활동이 제한될 수 있습니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
