description_portal: '○ 통계개요* 통계명 : 토지거래 현황* 통계종류 : 서울시 자치구별 토지거래 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「국토의 계획 및 이용에 관한 법률」에 의한 토지거래 현황* 작성목적 : 서울시 토지에 관한 정보와 연간 토지허가 및 거래 현황을 파악하여,공정한 부동산관련 정책수립과 연구ㆍ분석을 위한 기초자료로 활용하는것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부* 작성방법 : 전국 지자체 부동산거래신고 자료 취합 및 집계* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 용도지역별ㆍ지목별 토지거래 필지수 및 면적 등○ 용어설명* 필지 : 하나의 지번에 붙는 토지의 등록 단위. 토지소유자와 용도가 동일하고지반이 연속된 토지를 1필지로 할 수 있음* 토지 용도지역구분 : 국토의 계획 및 이용에 관한 법률에 의거 도시지역(주거, 상업, 공업, 녹지), 관리지역, 농림지역 등으로 구분함* 지목 : 토지의 주된 용도에 따라 토지의 종류를 구분하여 지적공부에 등록한 것으로,부동산거래현황에서는 크게 전, 답, 대지, 임야, 공장용지,기타(과수원, 목장용지 등 상기지목 외)로 나누고 있음○ 기 타* 면적은 천단위 절사된 값으로 합계가 일치하지 않을 수 있음* 2011년부터 부동산거래건수에 포함되었던 신탁/신탁해지건수를 제외 작성함'
