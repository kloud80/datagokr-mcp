summary_user: 대구광역시 북구에 조성된 화단을 한 곳씩 담은 건별 원천 데이터로, 시설명·소재지·조성 연도·면적과 식재 수종, 교목·관목 본수를 담는다. 구청 조경 담당자나 분석가가 '어느 동네 화단이 언제 만들어졌고 어떤 나무가 몇 그루 심겨 있는가'를 확인해 유지보수 계획이나 민원 응대에 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 소재지 주소나 시설명을 매핑하거나, 같은 기관의 다른 공원녹지 데이터와 묶어 쓴다.
limits: 대구 북구 한 시군구만 다루므로 다른 지역과 비교하려면 별도 데이터가 필요하다. 표준 코드 키가 없어 주소·이름 매칭으로만 연결된다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
