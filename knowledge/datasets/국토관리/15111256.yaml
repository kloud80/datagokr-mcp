summary_user: 서울 양천구에 조성된 둘레길을 코스(대분류·상세 코스) 단위로 정리한 현황 데이터로, 거리·예상 소요시간·상세 경로·주요 명소·연계 공원·연계 지하철역·교통편을 담고 행정동 단위로 위치를 표시한다. 주민이나 여가 이용자가 '집 근처 지하철역에서 바로 걸을 수 있는 양천구 둘레길 코스와 소요시간은 얼마인가'를 확인하거나, 분석가가 동별 보행·녹지 여건을 살필 때 쓴다. 전역 조인 키는 없어 행정동 ID(emdId)·행정동명, 공원명, 지하철역명 같은 이름·코드 매핑으로 공원·역·행정동 통계 데이터와 이어 쓴다.
description_portal: 이 데이터는 서울특별시 양천구 내에 조성된 둘레길의 현황을 정리한 공공데이터이다. 주민 건강 증진과 여가활동 확대를 위한 걷기길 정보로 활용되며, 도시 생태환경과 연계된 보행 기반 조성에 기여한다. 주요 항목은 구간명, 시작점과 종점 위치, 거리, 소요시간, 경사도, 포장 여부, 주변 편의시설 등이 포함되며, 경로별 난이도, 휴식 공간, 안내 표지 등 이용자의 접근성과 안전성 향상을 위한 정보도 함께 수록되어 있다. 본 데이터는 지역 보행환경 개선, 녹지축 연계, 생태관광 활성화 등의 정책 수립 시 참고자료로 활용할 수 있다. 양천구청에서 해당 데이터를 관리하며, 정기적인 조사 및 현황 갱신을 통해 데이터의 최신성과 정확성을 유지하고 있다.
