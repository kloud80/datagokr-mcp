summary_user: 서울특별시가 도시관리계획으로 결정한 도로시설(광로·대로·중로·소로 등 규모·류별 구분)을 도면 객체 단위의 공간정보로 담으며, 각 객체에 도면관리번호·결정고시 관리코드·시군구 코드·규모 등급·집행상태·면적·연장 등이 붙는다. 도시계획 실무자나 분석가가 "우리 구에 결정됐지만 아직 집행되지 않은 계획도로는 어디이고 길이와 면적은 얼마인가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군구 코드(SGG_CD)나 결정고시 관리코드 같은 같은 기관 코드, 또는 이름 매핑으로만 다른 도시계획시설·고시 자료와 연결한다.
description_portal: '"국토의 계획 및 이용에 관한 법률"에 의한 도시관리계획으로 결정하여 설치하는 도로시설도로종류 : 광로1류 UQS111, 광로2류 UQS112, 광로3류 UQS113, 대로1류 UQS114, 대로2류 UQS115, 대로3류 UQS116, 중로1류 UQS117, 중로2류 UQS118, 중로3류 UQS119 UQS120, 소로2류 UQS121, 소로3류 UQS122, 소로4류 UQS123, 도로시설 기타 UQS190[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.문의 : 도시계획과 (02-2133-8339)'
