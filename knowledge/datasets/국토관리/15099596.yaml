summary_user: 서울시 지적재조사 사업지구(사업영역)를 지구 단위 공간정보로 담으며, 지구번호·지구명·위치·사업기간(시작·종료일)·진행상태·시행자 등이 들어 있다. 토지 소유자나 부동산 분석가가 특정 동네가 지적재조사 사업지구에 들어가는지, 사업이 어느 단계까지 진행됐는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 시군구 코드(SGG_CD)나 지구명·위치 같은 이름 매핑으로 다른 서울시 데이터와 연결해야 하며, 필지 고유번호(PNU)로 바로 붙일 수는 없다.
limits: 서울 열린데이터광장(data.seoul.go.kr) 외부 사이트에서 받으며, 공공데이터포털 활용신청과 별개로 그쪽 인증키가 필요하다. 전역 조인 키가 없어 필지·건물 단위 데이터와 직접 결합할 수 없고, 포털 설명대로 법적 효력이 없는 참고자료다.
