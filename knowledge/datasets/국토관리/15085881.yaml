summary_user: 전국 산업단지를 시도(17개)와 유형(국가·일반·도시첨단·농공)으로 묶어 단지수, 지정·관리면적, 산업시설구역 분양·미분양 면적과 분양률, 입주·가동업체 수를 담은 집계 통계표다. 지역 산업정책 담당자나 분석가가 '어느 시도의 산업단지 분양률이 낮고 가동업체가 적어 지원이 필요한가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명(구분)을 이름으로 맞추거나 같은 기관의 산단 통계와 시도 단위로 연결해야 한다.
description_portal: 전국 산업단지의 시도별 현황을 나타내는 통계표 입니다. 시도별(총17개)·유형별(국가, 일반, 도시첨단, 농공)로 구분하여 통계자료를 공표하고 있습니다. 통계자료는 가동업체 2개이하인 산업단지는 X표시해서 내보내고 있습니다. 시도별 단지개수는 총합은 1,335개이지만 2개도시에 걸친 산업단지가 있어 전체 총계는 1,331개 입니다.  시도별 통계 자료를 통해 산업단지 경쟁력이 뛰어난 시도, 지원이 필요한 시도가 어디인지  등 시도별 특징을 파악할 수 있으며 지역별 산업단지 지원정책 수립을 할 수 있습니다.
