summary_user: 양주시에서 추진되는 지역주택조합을 조합 한 곳당 한 행으로 담은 파일로, 조합명·위치·조합원 및 총분양 세대수·대지면적과 연면적·시공사와 함께 설립인가, 사업계획승인, 착공신고, 사용검사(예정)일 같은 사업 단계별 날짜를 담는다(csv 약 1.7KB 규모의 소규모 목록). 가입을 고민하는 시민이 '이 조합은 설립인가를 받았고 착공까지 진행됐나'를 확인하거나, 분석가가 양주시 지역주택조합의 공급 세대 규모와 추진 단계를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 주택 인허가·분양 데이터와는 조합명이나 위치(주소)를 이름 매칭해 잇거나 같은 기관(양주시) 기준으로만 연결한다.
description_portal: 경기도 양주시_지역주택조합 현황 데이터는 양주시 내에서 추진되는 지역주택조합 사업의 진행 상황을 관리하기 위해 구축된 자료이다. 총 10여 개 항목으로 구성되어 있으며, 연번, 조합명, 조합장, 위치, 세대수(조합원/총사용), 대지면적, 연면적, 설립인가일, 사업계획 승인일, 착공신고일, 사용검사일, 사용자, 관리기관명, 관리기관 전화번호 등이 포함된다. 해당 데이터는 각 지역주택조합의 규모와 사업 추진 단계를 파악할 수 있도록 하여 주택 공급 현황 및 도시개발 흐름을 분석하는 데 중요한 기초 자료로 활용된다. 특히 세대수와 면적 정보는 주거 수요 및 인프라 계획 수립에 필수적이며, 설립인가일·착공일·사용검사일 등 주요 이정표는 사업 진행의 투명성을 높이는 역할을 한다. 또한 행정기관은 관리기관 정보를 통해 사업의 합법성과 진행 상황을 점검할 수 있고, 시민들은 조합 정보를 통해 주거 선택 및 참여 여부를 판단할 수 있다. 본 데이터는 양주시의 주택정책 수립, 주거환경 개선, 도시개발 관리 등 다양한 행정적 의사결정을 지원하는 핵심 자료이다.
