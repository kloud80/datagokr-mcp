description_portal: '본 데이터는 제주특별자치도 제주시 관내 어린이 놀이터를 대상으로 실시한 안전검사 결과를 수록한 현황 자료입니다. 어린이들의 안전한 놀이환경 조성을 위한 법적 안전기준에 따라 정기적으로 검사된 놀이시설의 위치, 검사 이력 등을 포함하며, 시설물 유지·보수 및 안전관리 체계 강화를 위한 행정자료로 활용됩니다.주요 항목놀이시설명: 안전검사가 실시된 놀이터 또는 놀이기구의 명칭주소: 해당 놀이시설이 설치된 행정구역 또는 도로명 주소최종검사년도: 가장 최근에 안전검사가 완료된 연도안전검사여부: 해당 시설의 검사 시행 여부(예: 완료, 미실시 등)활용 목적이 데이터는 어린이 놀이시설의 주기적인 안전관리 실태를 파악하고, 위험 요소를 사전에 식별하여 사고를 예방하는 데 활용됩니다. 또한 지역 주민에게 안전 정보 제공, 보수 예산 계획 수립, 관련 법령 이행 여부 점검, 어린이 복지 증진 정책 등에 기초자료로 제공됩니다. 제주시 공원녹지과에서 주기적으로 갱신하며, 최신 검사 현황을 반영하고 있습니다.'
