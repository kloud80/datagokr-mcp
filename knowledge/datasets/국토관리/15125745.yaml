summary_user: 서울시 조류 관찰 기록을 개별 종 단위로 담은 공간정보로, 종명·학명·과명, 우점 여부, 서울시 보호종·멸종위기 등급·천연기념물·고유종 여부, 둥지·먹이 길드, 자치구·조사지역·조사연도, X·Y 좌표(EPSG:5174)를 담는다. 생태 분석가나 환경단체가 '우리 자치구에서 관찰된 보호종 조류는 어디에 분포하는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치구명(ATNM_DSTC_NM)·조사지역명 같은 이름 매핑이나 좌표 기반 공간 중첩으로 다른 서울시 공간 레이어와 이어 쓴다.
description_portal: 해당 데이터는 서울시 조류개별종분포 공간정보 입니다. 데이터의 원본 시스템은 서울도시공간포털(https://urban.seoul.go.kr)입니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
