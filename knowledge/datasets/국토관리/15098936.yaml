limits: 사업자번호 같은 공통 식별 키가 없어 공장 등록 등 다른 데이터와 정확히 대조하기 어렵고, 이름·주소 매핑에 의존해야 한다. 실측 필드에는 종사자 수·매출이 보이지 않으므로 포털 설명과 달리 고용·매출 분석에는 쓰기 어렵다.
