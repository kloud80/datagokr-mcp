summary_user: 국토교통부가 브이월드(vworld.kr) 오픈API로 제공하는 전국 읍면동 행정구역 데이터로, 읍면동의 도형(지도)과 속성(한글명·영문명·전체명·읍면동 코드)을 조회한다. 지도 서비스 개발자나 분석가가 특정 읍면동의 경계를 지도에 그리거나 읍면동 코드로 지역명을 확인하는 데 쓴다. 전역에서 통하는 조인 키는 확인되지 않아, 읍면동 코드(emd_cd)나 지역명 매핑 또는 같은 기관 코드를 통해서만 다른 데이터와 잇는다.
description_portal: 오픈API로 행정구역도(광역시도, 시군구, 읍면동, 리)의 정보를 공간정보(지도) 제공읍면동의 도형, 속성 정보를 조회할 수 있다.
