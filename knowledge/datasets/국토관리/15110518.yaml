summary_user: 대구광역시 동구의 의무관리대상 아파트를 단지 한 건씩, 등록번호(REG_NO)·아파트명·지번 주소·도로명 주소로 담은 시군구 단위 목록이다. 동구 주민이나 부동산 분석가가 '이 단지가 의무관리대상인지, 정확한 주소는 어디인지'를 확인하거나 동구 관리대상 단지 지도를 만들 때 쓴다. 실측 컬럼에 전역 조인 키(K-apt 단지코드 등)가 없어, 다른 공동주택 관리·실거래 데이터와는 아파트명이나 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
limits: K-apt 단지코드 같은 공통 키가 없어 관리비·실거래·공시가격 데이터와 바로 조인되지 않고, 이름·주소 매칭에 의존해야 한다. 범위가 대구 동구 한 곳이라 다른 시군구나 전국 비교에는 쓸 수 없다. 호출에는 포털 활용신청(자동승인) 후 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
