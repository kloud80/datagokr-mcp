summary_user: 서울시 정비사업(재개발·재건축·주거환경개선 등) 구역의 도시계획 결정 내용을 결정 건별로 담는 원천 목록이며, 필드명으로 보아 위치명·지역명, 대·중·소 분류, 기존·변경·변경 후 면적, 결정고시 관리코드가 들어 있다. 주민이나 부동산 분석가가 특정 동네의 정비구역이 어디에 어떤 종류로 지정됐고 면적이 어떻게 바뀌었는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 위치명·지역명으로 이름을 맞추거나 같은 기관의 사업코드·결정고시 관리코드(DCSN_ANCMNT_MNG_CD)로만 잇는다.
description_portal: 도시 및 주거환경정비법에서 정한 절차에 따라 도시기능의 회복이 필요하거나 주거환경이 불량한 지역을 계획적으로 정비하여, 도로·상하수도·공원·공용주차장·공동구 등 도시기반 시설을 정비하고 노후불량주택 등 건축물을 개량하거나 건설하는 도시계획사업으로서 주건환경개선사업, 주택재개발사업, 주택재건축사업, 도시환경정비사업을 말함※ 본자료의 도시계획현황은 법적 효력을 갖고 있지 않습니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
