summary_user: 토지(임야)대장의 분할·합병 같은 토지이동 과정에서 생긴 피분할지·피합병지의 지번(행정구역·법정동 코드, 대장 구분, 본번·부번, 이동 이력 순번)을 건별로 담은 전국 단위 비공간 텍스트(TXT) 데이터다. 지적 담당자나 부동산 분석가가 '이 필지는 어떤 지번에서 분할되거나 합병되어 나왔는가'처럼 지번 변동 이력을 추적할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정구역코드와 지번(본번·부번) 등을 코드 매핑해 토지대장·연속지적도 같은 필지 단위 지적 데이터와 맞춰 써야 한다.
description_portal: 국토교통부 토지이동관련지번은 토지의 표시를 새로 정하거나 변경·말소하는 토지이동 과정에서 발생하는 지번 정보를 제공하는 데이터이다. 토지(임야)대장의 이동 시 피분할지와 피합병지에 대한 정보를 포함하며, 전국 부동산종합공부로부터 수집·관리된다. 이를 통해 토지이동 절차에서 발생하는 지번 변동 내역을 체계적으로 확인할 수 있으며, 토지 행정업무, 지적 관리, 정책 수립 등에서 기초자료로 활용된다.이 데이터는 TXT 형식으로 제공되며, 행 단위 텍스트 구조로 대량 데이터를 효율적으로 처리할 수 있다. 단순 편집 프로그램으로 열람이 가능하나, 실제 활용에서는 데이터베이스나 GIS, R·Python 등의 분석 도구에 적재하여 가공·분석하는 방식이 적합하다. 전국 단위의 토지이동 관련 지번 정보를 일괄 관리할 수 있어 행정업무 지원, 연구, 민간 서비스 개발 등 다양한 분야에서 활용 가능하다.
