description_portal: 본 데이터는 경기도 구리시청에서 관리하는 관내 토지의 용도지역별 면적 및 구성비 정보를 담고 있습니다.주거지역(1·2·3종 일반, 준주거), 상업지역(일반, 유통, 근린), 녹지지역(자연녹지) 등으로 세분화된 통계를 제공하며, 구리시 전체 면적 대비 각 용도가 차지하는 비중을 파악할 수 있습니다.* 특이사항:1. 자연녹지지역이 전체 면적의 **75.5%**를 차지하고 있어 관내 녹지 보존 비율이 매우 높음2. 데이터 기준일자는 2025년 12월 31일로, 해당 시점의 도시계획 현황을 반영함3. 면적 단위는 ㎡(제곱미터)이며, 소수점 단위의 구성비(%)가 포함되어 있음세부적인 지구단위계획이나 구체적인 지번별 용도는 관련 조례 및 도시계획도를 병행하여 확인하시기 바랍니다.
