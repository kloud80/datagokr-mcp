summary_user: 경기도 구리시 관내 토지를 주거·상업·녹지 등 용도지역과 그 세부 구분(1·2·3종 일반주거, 준주거, 일반·유통·근린상업, 자연녹지 등)별로 나눠 면적(㎡)과 구성비(%)를 담은 시군구 단위 집계표이며, 568바이트 크기의 작은 CSV 파일이다. 구리시 땅 가운데 녹지나 주거·상업 용도가 얼마나 차지하는지 알고 싶은 시민이나 지역 개발·입지를 검토하는 사업자·분석가가 시 전체 용도지역 구성을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군의 도시일반현황이나 용도지역 통계와는 용도지역 이름(구분1·구분2)을 맞추거나 기관명으로만 이어 쓴다.
