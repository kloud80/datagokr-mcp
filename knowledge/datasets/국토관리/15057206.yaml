summary_user: 경기도 내 공동주택 단지의 미분양 현황을 단지·규모별 행으로 담는 건별 자료로, 시군·읍면동, 시공사·시행사, 민간/공공 구분, 임대/분양 구분, 총 분양 가구 수와 당월 미분양 가구 수, 청약일·입주예정일, 준공 여부가 들어 있다. 분석가나 실수요자가 '경기도 어느 시군의 어떤 단지에서 준공 후에도 미분양이 남아 있는가'를 확인하거나, 시군별 공급·수요 불균형을 살피는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소 문자열로 같은 경기도 데이터 또는 시군 단위 주택 공급·인허가 통계와 이름·코드 매핑으로 연결한다.
description_portal: 경기도 내의 시군별 공동주택 미분양 현황 자료입니다. 관할군구명, 관할읍면동명, 시공사명, 시행사명, 시공자주소 등의 정보를 제공합니다.이 데이터는 경기도 내 공동주택 중에서 분양이 완료되지 않은 미분양 주택 현황을 제공하는 자료로, 민간 및 공공이 공급하는 아파트 등의 공동주택 단지에 대한 분양 실적과 잔여세대 정보를 포함합니다. 주요 항목은 시군명, 관할 군구 및 읍면동, 시공소재지 위치, 시공사 및 시행사 정보, 민간/공공 구분, 임대 또는 분양 구분, 규모별 면적(㎡), 총 분양 가구 수, 당월 미분양 가구 수, 분양청약일자, 입주예정일자, 준공여부 등으로 구성되어 있습니다.해당 데이터는 지역별 주택 공급과 수요의 불균형 파악, 미분양 발생 원인 분석, 부동산 경기 동향 모니터링, 분양정책 수립, 주택시장 안정화 대책 마련 등에 활용됩니다. 예를 들어 분양 후 미분양이 지속될 경우 주택 수요 위축, 분양가 과다, 입지 조건 등의 문제가 복합적으로 작용할 수 있으며, 이를 바탕으로 정책적 개입 지점 및 공급 조절의 기초 자료로 활용됩니다.본 자료는 경기도 및 관할 시군의 주택건설사업 인허가 관리기관에서 수집한 공공데이터로, 부동산 정책 수립 및 지역 내 주거환경 개선, 실수요자 중심의 분양 전략 설계에 필수적인 정보를 제공합니다.
