summary_user: 한국수자원공사가 관리하는 전국 정수장(생활·공업용수)의 잔류염소·pH·탁도 측정값을 정수장별 1시간 단위로 담는 원천 관측 데이터이며, 검증 호출(2015-11-18 하루)에서는 24행이 수신됐다. 상수도 운영기관·지자체 담당자나 분석가가 '우리 지역 정수장의 잔류염소와 탁도가 특정 시간대에 기준을 벗어났는가'를 확인하는 데 쓴다. 정수장 코드 같은 공통 코드표 키는 없고 시설주소(fcltyAddr)를 주소 키로 삼아 행정구역·급수구역·정수장 위치 데이터와 이어 쓴다.
description_portal: '본 데이터는 한국수자원공사가 제공하는 공공데이터로서, 실시간 수도정보 중 수질 항목을 1시간 단위로 조회할 수 있도록 지원하는 서비스입니다. 이를 통해 상수도 운영기관과 지자체 담당자는 수돗물의 안전성과 신뢰성을 종합적으로 평가하고, 수질 저하 및 이상 발생 가능성을 조기에 인지하여 신속한 대응책을 마련할 수 있습니다.ㅁ 제공지점 : 정수장(생활, 공업)ㅁ 제공항목 : 잔류염소[mg/L], pH, 탁도[NTU], 관리번호, 태그SN, 태그설명  * 관리번호, 태그SN, 태그설명 : 측정항목의 고유값(내부관리용)'
