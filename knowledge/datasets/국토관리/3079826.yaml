summary_user: 경기도 동두천시에서 영업 중인 옥외광고업체를 업체 한 곳당 한 행으로 담은 파일로, 업종·업소명·도로명/지번 주소·위도·경도·연락처를 포함한다(csv 약 6.5KB의 소규모 시군구 단위 목록). 시민이나 광고주가 '동두천에서 간판·광고물을 제작해 줄 업체가 어디 있고 연락처는 무엇인가'를 찾거나, 분석가가 업체 분포를 지도에 표시하는 데 쓴다. 전역 조인 키는 없으므로 주소나 위도·경도로 다른 공간 데이터와 겹쳐 보거나, 다른 시군의 같은 이름 옥외광고업 현황과 업종·업소명 기준으로 이어 쓴다.
description_portal: 경기도 동두천시에 영업중인 옥외광고업 현황을 민원인에게 제공하고자 합니다.공공데이터 제공항목으로는 업종, 업체명, 소재지도로명주소, 소재지지번주소, 위도, 경도, 연락처, 관리기관명, 관리기관 전화번호의 정보입니다.데이터의 기준일자는 2026년 6월 15일입니다. 데이터에 대하여 추가적인 문의사항이 있으실 경우 동두천시청 건축과 광고물관리팀 031-860-2146으로 문의주시기 바랍니다.동두천시 대표홈페이지에서도 광고물제작업체현황을 확인하실 수 있습니다.(http://www.ddc.go.kr/ddc/contents.do?key=507)
