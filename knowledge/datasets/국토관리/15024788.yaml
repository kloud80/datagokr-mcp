summary_user: 경상남도 의령군 관내 재난대응용 배수펌프장을 시설 한 곳당 한 행으로 담은 작은 파일(csv 약 1.8KB)로, 배수장명·주소·설치연도·모터·비상발전기·한전 전원공급방식·계약전력·사용전력량을 담는다. 군 방재 담당자나 지역 분석가가 '의령군의 어느 배수펌프장이 오래됐고 비상발전기를 갖췄는지, 집중호우 때 전력 공급은 어떻게 되는지'를 확인하는 데 쓴다. 전역 조인 키나 하천코드는 없어 다른 하천·배수시설 데이터와는 배수장명이나 주소(시군구 단위) 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 경상남도 의령군 관내 재난대응용 배수펌프장 현황에 대한 데이터로 배수장명, 주소, 설치연도, 모터, 비상발전기, 전원공급방식, 전력량 등의 항목을 제공합니다. 집중호우, 태풍 등 자연대해 발생 시 침수로 인한 인명 및 재산 피해를 최소화하기 위한 주요 방재시설로 활용되며, 재난대응 계획 수립 및 시설 유지관리의 기초자료로 활용될 수 있습니다. 또한, 기후변화에 따른 강수량 증가와 도시 침수 위험에 선제적으로 대응하기 위한 행정적 기반자료로 활용될 수 있습니다. 본 데이터는 지역 내 재해예방 능력 강화를 도모하며, 군민의 안전 확보와 재난 대응 역량 향상에 기여하고자 합니다.
