summary_user: 경기도 의왕시 관내 현수막 지정게시대를 게시대 한 곳씩 담은 건별 목록으로, 읍면동·용도·주소·위도경도와 게시면수(행정용·상업용), 현수막 규격, 부착일수, 부착금액을 담는다. 의왕시에서 현수막을 걸려는 업체나 단체가 '우리 동네 가까운 상업용 게시대는 어디고 며칠에 얼마인가'를 확인하거나, 분석가가 게시대 분포를 지도에 올리는 데 쓴다. 실측상 전역 조인 키는 없어 다른 데이터와는 읍면동명·주소 같은 이름 매칭이나 위도·경도 좌표로만 이어 쓴다.
description_portal: 이 데이터는 의왕시 관내에 설치된 현수막 지정게시대의 위치, 용도, 게시 가능 수량 및 이용 요금 등 주요 정보를 담고 있는 자료로, 행정 및 상업용 현수막 부착을 합법적으로 운영·관리하기 위해 제공됩니다. 항목에는 시군명, 읍면동명, 용도구분, 게시대명, 도로명주소 및 지번주소, 위도·경도, 게시대 수, 현수막 규격(너비·높이), 게시면수(행정용·상업용), 부착일수, 부착금액(행정용·상업용·민원수수료), 관리기관명, 연락처가 포함됩니다. 이 정보를 통해 시민과 업체는 지정된 공간에 합법적으로 홍보물을 게시할 수 있으며, 도시 미관을 해치지 않는 범위 내에서 공공 및 민간의 정보 전달이 가능해집니다. 또한, 행정기관은 게시대 이용 현황을 체계적으로 관리하고 수수료 징수 및 유지보수 계획 수립에 활용할 수 있습니다. 게시 가능 수량과 요금 체계가 명확히 제시되어 있어 공정한 이용을 유도하고 민원 발생을 줄이는 데 기여합니다.
