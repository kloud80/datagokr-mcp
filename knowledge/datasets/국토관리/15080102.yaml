summary_user: 강진군 일반건축물의 시가표준액을 건물 동·호 단위로 담은 건별 파일로, 과세년도·법정동·법정리·본번·부번 같은 위치 정보와 도로명 물건지, 연면적, 기준일자가 함께 들어 있다(CSV 약 1.7MB, 범위는 강진군 한 개 시군구). 건물 소유자나 세무·감정 실무자가 '이 건물 이 호수의 과세 기준 가액이 얼마이고, 같은 주소의 다른 호수와 면적·가액이 어떻게 다른가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 법정동·본번·부번이나 물건지 주소를 이름으로 맞추거나 자치단체코드로 같은 기관 자료와 이어 써야 한다.
description_portal: 해당 데이터는 전라남도 강진군 지역의 부동산‧건축물 과세 정보를 세부적으로 담고 있는 표준 자료로, 각 개별 물건의 법정동·본번·부번·동·호 등 위치 정보, 도로명 주소 기반 물건지, 연면적, 그리고 시가표준액이 포함되어 있다. 건물 용도는 아파트, 다가구, 상가, 지하층 등 다양하며, 동일 주소 내 여러 호수의 면적과 시가표준액 차이를 확인할 수 있어 부동산 가치 비교, 과세 기준 검토, 감정평가 참고자료 등으로 활용하기 적합하고 연도별 시가 변동 분석이나 공시가격 대비 비교 분석의 기초 자료로도 사용 가능하다.
