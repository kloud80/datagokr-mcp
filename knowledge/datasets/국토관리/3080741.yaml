summary_user: 경기도 고양시에 등록된 공장을 업체별 한 행으로 담은 파일로, 회사명·용지·건축면적·종업원수·공장규모·등록일·업종·생산품과 대기·수질 오염등급, 용수 사용량, 주소와 위도·경도를 포함한다. 고양시 안에서 어떤 업종의 공장이 어디에 얼마나 있는지, 특정 용도지역에 들어선 제조업체 분포를 확인하려는 분석가·사업자가 쓴다. 전역 조인 키(사업자번호·필지고유번호 등)는 없어서, 업종코드(한국표준산업분류 11차 기준)로 업종 통계와 맞추거나 주소·좌표로 지도·토지 데이터에 공간 결합해 쓴다.
description_portal: '경기도_고양시_공장등록 현황경기도 고양시에 공장등록 업체의 데이터를 제공합니다.(회사명, 용지면적, 건축면적, 종업원수, 공장규모, 공장등록일, 용도지역명, 지목명, 업종명, 업종코드, 생산품정보, 도로명주소, 지번주소, 위도, 경도 등)[데이터 변경 안내]1. 제조업종분류:  한국표준산업분류 기반 업종분류2. 제조업종분류 체계: 중분류(25개), 소분류(85개), 세분류(182개), 세세분류(480개)3. 표준산업분류: 11차※ 업종코드는 2024년 7월 1일부터 시행한 한국표준산업분류 제11차를 따르고 있습니다.'
