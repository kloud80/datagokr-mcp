summary_user: 전국 지방하천 하천범람 지도를 바탕으로, 재현빈도(50·80·100·200년)마다 침수심 5단계(0.5m 이하부터 5.0m 초과까지)별 침수면적(km²)을 전국 단위로 묶은 집계 통계를 담는다. 방재 담당자나 분석가가 '100년 빈도 홍수가 나면 지방하천 범람으로 깊이 2m 넘게 잠기는 면적이 전국에서 얼마나 되는가'처럼 빈도별 침수 규모를 비교하는 데 쓴다. 지역 코드나 전역 조인 키가 없어 다른 데이터와는 빈도 구분(fldlvFreq) 값이나 같은 기관의 다른 빈도별 범람지도 통계와 이름으로 맞춰 나란히 놓고 비교하는 방식으로만 쓴다.
limits: 전국 단위의 비공간 통계라서 시도·시군구나 하천별 침수면적은 알 수 없고, 실시간 홍수 예보·경보 정보도 아니다. 한 번 만든 뒤 바뀌지 않는 이벤트성 데이터라 주기적으로 갱신되지 않는다. 전역 조인 키가 없어서 다른 데이터와 자동으로 결합하기 어렵다.
