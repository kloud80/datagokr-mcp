summary_user: 인천 서구(서해구) 안에서 추진 중인 도시정비사업을 사업 한 건당 한 행으로 담은 파일로, 사업구분·사업명·위치·면적·용도지역·조합설립인가일·정비구역 지정일·완료(예정)일·추진단계·향후단계를 기록한다(csv 1,671바이트의 소규모 파일). 주민·투자자·분석가가 '우리 동네 재개발·재건축 구역이 지금 조합설립, 사업시행, 관리처분 중 어느 단계이고 언제 끝날 예정인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명·위치(주소) 문자열을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구에서 추진 중인 도시정비사업의 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 추진중인 도시정비사업의 사업구분, 사업명, 위치, 면적, 용도지역, 사업완료(예정)일, 사업내용, 추진단계, 향후단계 등 다양한 항목을 제공하고 있습니다. 본 공공데이터를 활용하여 노후 주거지 개선, 기반시설 확충, 정비구역 관리 등 도시재생 정책 수립에 도움이 될 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
