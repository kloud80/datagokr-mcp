summary_user: 부산광역시 동래구의 일반가구수와 주택수, 단독주택·아파트·연립·다세대·비거주용건물내주택 등 주택 유형별 수, 일반가구수 대비 주택수 백분율인 주택보급률을 자치구 단위 집계로 담은 작은 CSV 파일(913 bytes)이다. 동래구 주민이나 주택정책 분석가가 '동래구에 가구 수 대비 주택이 충분한가, 아파트 비중은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 자료기준일과 '동래구'라는 지역명으로 맞춰 KOSIS 주택총조사 시군구 주택수나 다른 자치구 주택보급률 파일과 나란히 비교하는 방식으로 이어 쓴다.
description_portal: '부산광역시 동래구 주택의 현황 및 보급률에 대한 데이터로주택수 세부사항으로는 단독주택(다가구주택), 아파트, 연립주택, 다세대주택, 비거주용건물내주택이 있으며주택보급률(%)은  일반가구수(A)에 대한 주택수(B)의 백분율 (B)/(A)*100=(%)로 나타냅니다.아울러, 통계청(KOSIS) 업무 개편에 따른 주택수 세부내역 열람 방법을 아래와 같이 안내하오니, 참고하여 주시기 바랍니다. *통계청(KOSIS 국가통계포털) 자치구별 주택수/인구수 확인방법  - 주택수 : 주제별통계 > 주거 > 주택총조사 > 총조사주택(2015년 이후) > 전수부문(등록센서스, 2015년 이후) >  다가구 구분거처를 반영한 주택수(부가자료) - 시군구'
