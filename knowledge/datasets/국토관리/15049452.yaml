summary_user: 서울 양천구의 건축 인허가 건을 한 줄씩 담은 파일로, 대지위치·대지/건축/연면적·지상·지하 층수·주용도·설계사무소명과 허가일·착공일·사용승인일을 함께 기록한다(범위는 양천구 한 시군구, 단위는 필지·건물). 양천구에서 최근 어떤 용도의 건물이 얼마나 허가·착공·준공되었는지를 살펴 지역 개발 흐름을 가늠하려는 분석가나 주민이 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(주소) 문자열을 매핑하거나 같은 기관의 자료끼리만 이어 쓴다.
limits: 건축물대장 등과 바로 붙일 공통 코드가 없어 주소 정제·매핑이 필요하다. 범위가 양천구로 한정되어 다른 구나 서울 전체 비교에는 다른 자치구 자료를 따로 모아야 한다.
