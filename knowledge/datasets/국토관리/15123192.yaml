summary_user: 천안시 도시계획정보시스템(UPIS)에 등록된 교통시설 현황을 현황도형 관리번호별로 라벨명과 면적·길이 도형 값을 담은 시군구 단위 파일(약 10KB CSV)이다. 도시계획 분석가나 토지 관련 사업자가 천안시 도시·군계획시설 중 교통시설이 어떤 것이 있고 면적·길이 규모가 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 기관(천안시) 기준으로만 이어 쓴다.
description_portal: 충청남도 천안시 도시계획정보시스템(UPIS)의 교통시설 현황으로 현황도형 관리번호, 라벨명, 면적 도형, 길이 도형의 항목을 제공합니다.도시계획정보시스템(UPIS)은 도시·토지·시설·경관 등 도시계획 전반의 정보를 통합 관리하기 위해 구축된 시스템입니다. 도시의 공간 구조와 이용 실태를 분석할 수 있도록 다양한 계획·관리 요소를 담은 정보시스템이며, 각종 공간정보와 행정정보를 체계적으로 기록하여 도시관리·정비·개발계획 수립을 지원합니다. 이의 중장기개방계획에 따라서 교통시설 현황 테이블을 데이터 개방하였습니다.
