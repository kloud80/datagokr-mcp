summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 도로 현황 도형을 한 건씩 담은 파일로, 도형마다 공간정보 관리번호, 범위 좌표(X·Y 최솟값·최댓값), 라벨명, 면적·길이, 현황 도형 관리번호가 들어 있다. 진안군 안 특정 도로가 어디에 있고 길이와 면적이 얼마인지 확인하려는 도시계획 담당자나 토지 분석가가 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키는 없어서, 같은 기관의 다른 UPIS 자료와는 관리번호·라벨명을 맞춰 보거나 좌표 범위로 공간 대조해 연결한다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 도로 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 공간 정보 관리 번호, X좌표 최솟값, Y좌표 최솟값, X좌표 최댓값, Y좌표 최댓값, 라벨 명, 면적(도형), 길이(도형), 현황 도형 관리 번호 정보를 제공합니다. 이 자료를 통해 공간 정보 관리 번호에 해당하는 현황 도형 관리 번호가 무엇인지 확인할 수 있습니다. 또한 현황 도형 관리 번호에 해당하는 라벨 명도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2024년 7월 19일입니다.
