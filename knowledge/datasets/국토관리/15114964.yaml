summary_user: 전남광주통합특별시 신안군에 있는 아파트·연립주택 등 공동주택을 단지별로 한 행씩 담은 파일 데이터로, 단지명, 도로명·지번 주소, 위도·경도, 연면적, 세대수, 데이터기준일자를 담는다(파일 크기 808바이트의 소규모 목록). 군 행정 담당자나 분석가가 신안군 안에서 공동주택 단지가 어디에 있고 규모와 세대수가 어떤지를 확인하고, 주거지 분포를 지도에 표시하는 데 쓴다. 전역 조인 키나 코드표가 없어서, 다른 데이터와는 주소·단지명을 직접 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 공동주택현황은 전국에 위치한 공동주택의 기본 정보를 수록한 데이터로, 연번, 단지명, 소재지도로명주소, 소재지지번주소, 위도, 경도, 연면적, 세대수, 데이터기준일자 항목으로 구성되어 있습니다. 아파트, 연립주택 등 공동주택 단지별 위치와 규모, 세대 수 정보를 포함하고 있어, 주거지 분포 현황 분석, 도시계획 수립, 인구 추계 등의 행정업무에 활용됩니다. 위도와 경도 정보는 공간정보 기반 분석 및 지도 시각화에 유용하며, 도로명주소와 지번주소를 함께 제공함으로써 다양한 시스템과 연계가 가능합니다. 본 데이터는 정기적으로 갱신되며, 기준일자를 통해 최신성 확인이 가능합니다.
