summary_user: 서울특별시 강서구에 등록된 배출가스전문정비사업자(확인검사대행자)를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록이며, 인허가일자, 영업상태와 상세 영업상태, 폐업·휴업 일자, 소재지 지번·도로명 주소, 전화번호, 좌표를 포함한다. 강서구 차량 소유자가 '우리 동네에서 지금 영업 중인 배출가스 정비·확인검사 대행 업체가 어디인가'를 확인하거나, 분석가가 관내 업체의 개업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결한다.
description_portal: 서울시 강서구 관내에서 배출가스 관련 전문 정비 및 확인검사 업무를 수행하는 사업자에 대한 인허가 현황 정보를 담고 있습니다. 「대기환경보전법」에 따른 자동차 배출가스 정비 및 점검, 확인검사대행 등의 업무를 수행하기 위해 등록된 사업자 정보를 제공하며, 등록일자, 영업상태, 사업자 유형 등 기본 정보가 포함되어 있습니다. 환경부의 배출가스 저감정책 및 관리대책에 따라, 이 데이터는 차량 환경관리체계 구축, 노후 차량 단속, 저공해 조치 의무이행 모니터링 등의 기반 자료로 활용될 수 있습니다. 또한, 자동차 소유자에게는 정비소 선택에 참고할 수 있는 정보이며, 공공기관 및 연구기관에서는 도시 대기환경 분석, 교통환경 정책 수립, 감시체계 설계 등에 중요한 참고자료가 됩니다.
