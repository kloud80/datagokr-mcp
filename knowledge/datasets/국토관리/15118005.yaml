summary_user: 한국수자원공사가 수도사업자별로 연도 단위 총인구, 급수인구, 미급수인구, 지방·광역상수도 보급률과 급수보급률을 정리한 집계 통계로, 전국 범위이며 위치 정보가 없는 작은 CSV 파일(약 1KB)이다. 수자원 정책 담당자나 분석가가 '수도사업자별로 수돗물을 공급받지 못하는 인구가 얼마나 되고 보급률 격차가 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 상수도 데이터와는 수도사업자 이름을 맞추거나 같은 기관 코드로만 이어 붙인다.
description_portal: 본 데이터는 한국수자원공사가 관리하는 국가 상수도 급수 인구에 관한 통계 정보를 제공한다. 주요 항목으로는 수도사업자별 총인구, 급수인구계, 미급수인구계, 광역 및 지방상수도 보급률, 행정구역별 보급률 등이 포함되며, 급수 인프라의 보급 현황과 서비스 대상 범위를 정량적으로 확인할 수 있다. 이를 통해 상수도 공급의 형평성, 지역 간 격차, 미급수 인구 규모 등의 정책적 분석이 가능하며, 수도시설 확충 및 수자원 정책 수립 시 참고자료로 활용할 수 있다. 해당 자료는 전국 지자체 및 한국수자원공사를 포함한 수도사업자의 데이터로 구성되어 있으며, 상수도 보급 현황에 대한 전반적인 이해를 지원한다.
