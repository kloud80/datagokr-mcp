summary_user: 천안시 도시계획정보시스템(UPIS)의 건축지정선 현황을 규제관리번호·현황도형 관리번호·도형 길이·시군구코드 단위로 담은 시군구 범위의 파일 데이터이며, 파일 크기는 663바이트로 작습니다. 천안시에서 건축지정선이 어느 규제에 묶여 몇 개, 얼마 길이로 지정돼 있는지 확인하려는 건축 사업자나 도시계획 분석가가 쓴다. 전역 조인 키는 없어 시군구코드로 같은 지역의 다른 UPIS 현황 데이터와 맞추거나, 규제관리번호·현황도형 관리번호를 같은 시스템 안의 이름·코드 매핑으로 이어 쓴다.
description_portal: 충청남도 천안시 도시계획정보시스템(UPIS)의 건축지정선 현황으로 규제관리번호, 현황도형 관리번호, 길이 도형, 시군구코드의 항목을 제공합니다.도시계획정보시스템(UPIS)은 도시·토지·시설·경관 등 도시계획 전반의 정보를 통합 관리하기 위해 구축된 시스템입니다. 도시의 공간 구조와 이용 실태를 분석할 수 있도록 다양한 계획·관리 요소를 담은 정보시스템이며, 각종 공간정보와 행정정보를 체계적으로 기록하여 도시관리·정비·개발계획 수립을 지원합니다. 이의 중장기개방계획에 따라서 건축지정선 현황 테이블을 데이터 개방하였습니다.
