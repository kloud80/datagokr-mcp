summary_user: 경기도 수원시의 용도구역(개발제한구역 등) 현황을 기준연도·구분별로 개소수, 면적(제곱미터), 고시·공고번호(비고)로 정리한 시군구 단위 집계 파일로, 704바이트 크기의 작은 CSV입니다. 수원시 안에 개발제한구역이 몇 곳, 얼마의 면적으로 지정돼 있고 해마다 어떻게 바뀌었는지 확인하려는 분석가·사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군의 용도구역 현황이나 용도지역·지구 데이터와는 기준연도와 구분 이름을 맞춰 연결해야 한다.
description_portal: 국토의 계획 및 이용에 관한 법률 제2조에서는 용도구역이란 "토지의 이용 및 건축물의 용도ㆍ건폐율ㆍ용적률ㆍ높이 등에 대한 용도지역 및 용도지구의 제한을 강화하거나 완화하여 따로 정함으로써 시가지의 무질서한 확산방지, 계획적이고 단계적인 토지이용의 도모, 혁신적이고 복합적인 토지활용의 촉진, 토지이용의 종합적 조정ㆍ관리 등을 위하여 도시ㆍ군관리계획으로 결정하는 지역"으로 정의하고 있습니다제공하는 정보는 국토계획법 관련, 경기도 수원시의 용도구역 현황 데이터로, 기준연도에 따른 개발제한구역의 개소수, 면적, 비고(고시및공고번호) 등을 포함합니다.
