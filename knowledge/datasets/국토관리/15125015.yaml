description_portal: 서울특별시 강동구 관내 기계설비 성능점검 법정 의무 대상 건축물의 현황을 제공하는 공공데이터입니다.본 데이터에는 성능점검 대상 건축물의 순번, 건축물명, 소재지 주소(도로명·지번), 연면적, 세대수 등의 정보가 포함되어 있습니다.기계설비 성능점검은 건축물에 설치된 냉난방, 환기, 급배수 등 주요 기계설비가 안전하고 효율적으로 운영되는지 확인하기 위한 법정 의무점검 제도입니다.기계설비 성능점검 대상은 연면적 1만㎡ 이상 건축물, 500세대 이상 공동주택, 그리고 300세대 이상 중앙집중식 난방방식(지역난방 포함) 공동주택입니다.행정기관 및 건축·에너지 관련 공공기관은 의무 점검 대상 건물의 법정 검사 이행 여부를 모니터링하고, 노후 기계설비로 인한 안전사고 예방, 건물 부문 온실가스 감축 및 에너지 효율화 정책 등 지역 맞춤형 건축물 안전 관리 계획을 수립하는 데 폭넓게 활용할 수 있습니다.공동주택 입주민이나 대형 상업시설 이용 시민은 자신이 거주하거나 이용하는 건축물이 기계설비 안전 점검 대상인지 확인하여 생활 환경(환기, 냉난방, 수질 등)의 신뢰도를 높일 수 있습니다. 연구기관은 도시 내 건축물의 에너지 소비 및 시설물 유지보수 현황을 분석하는 연구 자료로 활용할 수 있습니다.
