summary_user: 인천광역시 계양구의 재개발 정비사업을 사업(조합) 한 건당 한 행으로 정리한 시군구 범위의 작은 파일(CSV 611바이트)로, 위치·조합명·조합원수·아파트명·면적·이전고시일·조합 연락처와 진행 현황을 담는다. 계양구 주민이나 부동산 분석가가 "우리 동네 재개발 구역은 지금 추진위·조합·사업시행·관리처분·준공 중 어느 단계이고 조합에 어떻게 연락하나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 정비사업·부동산 데이터와는 위치(주소)나 조합명·아파트명을 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터파일은 인천광역시 계양구 내에서 진행 중인 재개발 정비사업의 추진현황을 상세히 정리한 자료입니다. 주요 항목으로는 각 사업의 고유 식별번호인 연번, 재개발 대상지의 구체적인 위치, 사업에 참여하는 조합원의 수, 조합의 공식 명칭인 조합명, 조합과 직접 연락할 수 있는 연락처 정보, 그리고 현재 사업의 진행 상태를 나타내는 현황이 포함되어 있습니다. 본 자료는 계양구 내 재개발 사업의 전반적인 추진 상황을 파악하고, 도시 재생 및 주거환경 개선을 위한 정책 수립과 평가에 활용될 수 있습니다. 또한 조합원과 주민, 관련 기관들이 사업 진행 상황을 투명하게 확인할 수 있도록 지원하는 중요한 정보입니다.
