summary_user: 서울특별시 주택 인허가 대상 부지별로 오수정화시설 현황을 담은 건별 원천 데이터로, 대지위치·자치구·법정동·지번과 함께 오수 처리 방식(부패탱크방법, 하수종말처리장연결 등), 1인당 처리용량, 총 용량을 기록한다. 분석가나 환경·시설 담당자가 '특정 구·동의 주택 부지가 하수종말처리장에 연결돼 있는지, 아니면 자체 정화조를 쓰며 용량은 얼마인지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 건축·주택 인허가 데이터와는 자치구명·법정동명과 본번·부번 지번을 맞춘 이름·주소 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 각 구·동에 위치한 특정 부지의 하수처리 및 오수정화 시설 현황을 나타냅니다. 각 레코드는 부지의 주소, 구(자치구)명, 동명, 지번, 대표 여부, 하수 처리 방식, 1인당 처리 용량(리터 단위), 총 용량(㎥ 또는 리터 단위)을 포함하고 있습니다. 하수 처리 방식에는 ‘부패탱크방법’, ‘하수종말처리장연결’ 등이 있으며, 일부 데이터는 1인당 처리 용량이 비어 있거나 총 용량만 기록되어 있습니다. 예를 들어, 동작구 흑석동의 한 시설은 부패탱크방식을 사용하며, 1인당 5,000리터 용량을 갖고 있습니다. 이 정보는 건물·부지의 하수 처리 설비 규모 파악, 환경 관리, 시설 유지보수 계획 수립, 환경오염 예방 대책 마련 등에 활용될 수 있습니다.
