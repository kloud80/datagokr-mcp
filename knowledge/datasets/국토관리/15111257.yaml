summary_user: 서울특별시 양천구의 역사문화시설 15곳을 시설 하나당 한 행으로 담은 건별 현황 API이다. 주민이나 방문객이 구 안의 역사문화시설 위치와 관람 시간, 휴관 정보를 찾을 때, 분석가가 시설 분포를 파악할 때 쓴다. 지번주소·도로명주소(lnmadr, rdnmadr)와 위도·경도 좌표를 키로 지도나 다른 지역 데이터와 이어 쓴다.
description_portal: 이 데이터는 서울특별시 양천구에 위치한 역사문화 관련 시설의 현황을 정리한 공공데이터이다. 지역 문화유산의 보존과 역사 교육 기반 강화를 위한 자료로 활용되며, 주민과 방문객이 역사적 장소를 체험하고 학습할 수 있도록 지원한다. 주요 항목에는 시설명, 주소, 시설 유형, 관리 주체, 설립연도, 운영시간 등이 포함되며, 전시 내용, 체험 프로그램, 문화행사 운영 여부 등 부가 정보도 수록되어 있다. 이를 통해 지역 역사자원의 분포 및 운영 실태를 파악할 수 있으며, 관련 정책 수립과 교육·관광 자원 개발에 기초자료로 활용된다. 본 데이터는 양천구청에서 관리하며, 주기적인 현황 점검과 정보 갱신을 통해 최신성과 정확성을 유지한다.
