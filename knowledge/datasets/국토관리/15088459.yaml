summary_user: SH공사가 공급하는 전세임대주택 중 신혼부부Ⅰ유형의 지역별 공급계획 호수를 2020~2023년 연도별 열로 담은 소규모 집계 파일(csv 483바이트)이다. 서울에서 신혼부부 전세임대를 알아보는 가구나 정책 분석가가 '어느 지역에 해마다 몇 호가 계획됐나'를 확인하거나 연도별 공급 추이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역 이름을 맞추거나 같은 기관(SH공사)의 다른 전세임대 공급계획 데이터와 나란히 놓고 쓴다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)가 공급하는 전세임대주택 중 ‘신혼부부Ⅰ유형’에 해당하는 주택의 공급계획을 담고 있으며, 주거 안정이 시급한 젊은 층을 대상으로 한 주거복지 정책의 일환입니다. 신혼부부Ⅰ 유형은 전년도 도시근로자 가구당 월평균 소득의 70% 이하인 가구를 대상으로 하며, 배우자가 소득이 있는 경우에는 합산 소득이 90% 이하인 경우까지 지원이 가능합니다. 공급계획에는 지역, 호수, 전용면적, 공급 일정 등이 포함되며, 공급 계획은 사정에 따라 언제든지 변경될 수 있습니다. 또한 지원 가능한 전세금에는 제한이 있으며, 전세금이 대출한도액을 초과할 경우 입주자가 초과분을 부담해야 합니다. 단, 전세금은 원칙적으로 호당 대출한도의 250% 이내여야 하며, 세대원 수가 5인 이상인 경우에는 예외 적용이 가능합니다. 이 데이터는 청년 및 신혼가구를 위한 정책 수립, 주거 수요 예측, 지역별 지원 집중도 분석 등에 활용될 수 있습니다.※ 2025년부터는 "서울주택도시개발공사_전세임대주택 공급계획" 으로 통합하여 정보 제공됩니다.
