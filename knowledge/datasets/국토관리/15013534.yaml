summary_user: 대구도시개발공사가 추진 중이거나 완료한 도로건설사업을 사업 한 건당 한 행으로 담은 소규모 파일(csv 약 1KB)로, 사업명·도로폭·도로총길이(미터)·사업비(억원)·사업 시작일과 종료일을 담는다. 시민이나 분석가가 "대구도시개발공사가 낸 도로는 어느 정도 규모이고 얼마의 사업비로 언제 지어졌나"를 확인하거나 사업별 길이당 사업비를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명을 기준으로 같은 기관의 도시개발사업 자료와 이름 매칭으로만 연결한다.
limits: 조인 키와 위치 정보가 없어 지도나 행정구역 단위 통계와 바로 붙일 수 없고, 사업명 텍스트 매칭에 의존해야 한다. 명세상 이벤트 주기로 생성된 뒤 바뀌지 않는 파일이어서 진행 중 사업의 최신 상태는 따로 확인해야 한다.
