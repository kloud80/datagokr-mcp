summary_user: 지방하천 하천범람 지도를 바탕으로 시도·시군구 단위, 재현빈도별(50·80·100·200년)로 침수심 5단계(0.5m 이하부터 5.0m 초과까지)별 침수면적(km²)을 집계한 통계를 담으며, 범위는 전국 시군구다. 지자체 방재 담당자나 분석가가 '우리 시군구에서 100년 빈도 홍수로 지방하천이 넘치면 2m 넘게 잠기는 면적이 얼마인가'처럼 지역별 범람 침수 규모를 비교·판단하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 시도·시군구 코드(stdgCtpvCd, stdgSggCd)를 행정구역 코드표나 이름에 매핑해 인구·시설 통계나 같은 기관의 국가하천 범람지도 통계(하천 구분값 rvrSe)와 이어 쓴다.
description_portal: 환경부 한강홍수통제소에서 제공하는 홍수위험지도 중 지방하천 하천범람 지도를 기반으로 장마철 갑작스럽게 내리는 국지적 집중호우·돌발호우 등으로 유발되는 하천범람 결과의 5단계로 이루어진 침수심별(0.5m 이하, 0.5~1.0m, 1.0~2.0m, 2.0~5.0m, 5.0m 이상) 침수면적(km² 단위) 통계 데이터를 행정구역별(시도, 시군구), 빈도별(50년, 80년, 100년, 200년)로 구분하여 침수면적 통계 데이터를 조회할 수 있는 서비스 입니다. 사용자는 이러한 침수면적 통계 데이터를 통해 해당 지역의 하천범람으로 인한 침수 규모의 정도를 판단할 수 있습니다.
team:
