summary_user: 경기도 이천시 관내 미용업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 98KB)로, 사업장명·인허가일자·도로명/지번 주소·위생업태·영업상태·면적·의자수·침대수 등을 담는다. 위생 담당자나 창업 준비자가 '이천시 어느 동네에 영업 중인 네일·피부 미용업소가 몰려 있는가'를 확인하거나 위생교육·점검 대상 업소 목록을 뽑는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 사업장명 매칭, 또는 관리번호(관리번호)를 같은 기관 데이터와 맞춰 보는 방식으로만 잇는다.
description_portal: 경기도 이천시 내 미용업소 현황을 정리한 데이터로, 업소명, 위생업태명, 영업상태, 주소, 시설 전화번호, 등 다양한 항목으로 구성되어 있습니다.이 데이터는 관내 미용업소의 행정 인허가 이력, 시설 규모, 업태 분류 등을 종합적으로 파악할 수 있어 보건·위생 지도, 위생교육 계획 수립, 영업장 안전 점검 등 실무 활용도가 높습니다. 또한 미용산업 분포 및 촉진을 개선할 수 있습니다.또한 좌표 기반의 위치 데이터 및 위생업종 분류는 공간분석 및 유사업종 간 분포 특성 비교 등 지역 맞춤형 공공서비스 설계에도 유용하게 쓰입니다.
