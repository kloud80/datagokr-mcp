description_portal: 제주의 용천수는 역사·문화적으로 중요한 수자원으로, 체계적인 보전과 관리를 위해 「제주특별자치도 용천수 활용 및 보전에 관한 조례」 제5조에 따라 10년마다 관리계획을 수립하고 5년마다 보완하고 있습니다. 관리계획 수립 시 용천수 전수조사를 실시하며, 이를 통해 용천수의 분포 현황, 이용 및 관리 실태, 수질과 용출량, 구조와 형태, 역사·문화적 가치 등을 종합적으로 조사하고 있으며, 또한 용천수 시설 구조에 대한 측량도 함께 수행하여 관리계획 수립을 위한 기초자료로 활용하고 있습니다. 제주도의 용천수 위치 자료는 제주특별자치도 물정책과 '지하수정보관리시스템'에서 확인할 수 있습니다.
