summary_user: 음성군 국가공간정보통합체계(KRAS 등 공간정보 시스템)에서 농업 관련 테이블·컬럼이 무엇인지 적은 메타데이터 목록으로, 시스템명·논리/물리 데이터베이스명·영문/한글 테이블명과 컬럼명·공개여부를 한 행씩 담은 약 22KB 분량의 CSV 파일이다. 분석가나 공무원이 '음성군 공간정보 시스템에 농업 관련 어떤 테이블과 항목이 있고 그중 무엇이 공개 대상인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 테이블명·컬럼명 같은 이름 매칭이나 같은 기관(음성군) 기준으로만 이어 쓴다.
description_portal: 음성군 국가공간정보통합체계 농업 관련 목록 데이터는 농업 분야의 공간정보를 체계적으로 관리하기 위해 마련된 메타데이터 성격의 자료입니다. 주요 컬럼에는 연번을 통해 데이터의 순서를 확인할 수 있으며, 시스템명은 해당 데이터가 속한 정보시스템을 나타냅니다. 논리데이터베이스명과 물리데이터베이스명은 데이터베이스 구조와 실제 저장 위치를 구분하여 관리 효율성을 높입니다. 또한 영문 및 한글 테이블명은 데이터 테이블의 정체성을 명확히 하고, 영문 컬럼명과 한글 컬럼명은 각 필드의 의미를 직관적으로 이해할 수 있도록 돕습니다. 공개여부 항목은 데이터 활용 가능성을 판단하는 기준이 되며, 데이터기준일자는 최신성과 시의성을 확인하는 지표로 활용됩니다. 이러한 구조는 농업 관련 공간정보를 표준화하여 행정, 연구, 정책 수립 등 다양한 분야에서 활용될 수 있도록 지원합니다.
