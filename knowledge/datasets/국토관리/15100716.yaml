description_portal: 이 데이터파일은 인천광역시 계양구 내에서 진행 중인 소규모 정비사업 추진현황을 체계적으로 정리한 자료입니다. 주요 항목으로는 각 사업별 고유 식별을 위한 연번, 사업이 진행되는 구체적인 위치, 사업에 참여하는 조합원수, 조합의 공식 명칭인 조합명, 그리고 현재 사업의 진행 상황을 나타내는 현황 정보가 포함되어 있습니다. 이 데이터는 소규모 정비사업의 추진 현황을 한눈에 파악할 수 있도록 하여, 지역 개발 및 도시 재생 계획 수립에 중요한 기초자료로 활용됩니다. 또한 주민과 관련 기관에 사업 진행 상황을 투명하게 알리고, 행정적 지원과 관리 감독에 필요한 정보를 제공합니다. 해당 데이터에 관한 추가 문의는 **인천광역시 계양구 건축과(032-450-5583)**로 연락해 주시기 바랍니다.
