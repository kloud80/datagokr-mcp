description_portal: '한국부동산원(구.한국감정원)에서 제공하는 전국주택가격동향조사 중 단독주택 전세수급동향 데이터입니다.* 단독주택 : 원칙적으로 1가구만이 단독으로 거주할 수 있도록 건축된 독립주택* 수급동향 : 수요와 공급의 균형을 중심(100)으로 시장에서 매도문의가 많은지, 매수문의가 많은지를 조사하여 점수화한 것- 0에 가까울수록 매도문의 많음, 200에 가까울수록 매수문의 많음, 100에 가까울수록 매도와 매수문의가 비슷함을 의미<전국주택가격동향조사 개요>ㅇ 국가통계 승인번호 : 제304004호ㅇ 법적근거 : 「주택법」제88조 1항 및 제89조 제2항 제4호 동법 시행령 제91조 제2항 제3호ㅇ 조사목적 : 전국 주택시장의 매매, 전세, 월세가격을 조사하여 주택시장의 평균적인 가격변화를 측정, 주택시장 판단지표 또는 주택정책수립의 참고자료 제공ㅇ 조사주기 : 월ㅇ 조사지역 : 전국ㅇ 조사방법 : 표본조사'
