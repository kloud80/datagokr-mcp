description_portal: '이 공공데이터는 경상남도 사천시의 공간정보시스템데이터베이스에 구축된 보안등 시설물에 대한 상세 현황 정보입니다. 보안등은 주로 주택가나 골목길, 취약 지역 등에 설치되어 범죄 예방 및 시민의 야간 통행 안전을 확보하는 데 필수적인 도시 안전 인프라입니다. 이 자료는 보안등의 설치 및 관리 현황을 파악하여 시설 개선 및 유지보수 계획 수립에 중요한 기반을 제공합니다.데이터셋은 사천시 내 각 보안등 시설에 대해 다음과 같은 구체적인 기술 및 관리 정보를 포함하고 있습니다:설치일자: 해당 보안등이 실제로 설치된 시점을 기록하여, 시설물의 노후도를 판단하고 교체 주기를 산정하는 데 중요한 역할을 합니다.등기구모형: 사용된 등기구의 물리적 형태나 모델명을 나타냅니다. 이는 조명 효율성을 분석하고, 향후 에너지 효율이 높은 LED 등기구로 교체하는 계획을 수립하는 데 활용됩니다.광원종류: 보안등에 사용된 빛의 종류를 명시합니다 (예: 나트륨등, 메탈할라이드등, LED등 등).광원용량: 광원이 소비하는 전력량을 정량적으로 제공하여, 개별 시설물의 전기 소비량을 파악하고 도시 전체의 에너지 절감방안을 모색하는 데 중요한 기초 자료가 됩니다.이 상세 현황 정보는 사천시가 야간 방범 환경을 개선하고, 에너지 효율적인 도시 조명 시스템을 구축하며, 시설물 관리 및 예산 집행의 투명성을 높이는 데 결정적인 역할을 수행합니다. 또한, 주민들의 안전 민원에 신속하게 대응하고, 지역별 조도 수준을 표준화하는 작업의 근거 자료로 활용됩니다.'
