summary_user: 강원특별자치도 내 아파트 입주자모집공고를 단지 한 건씩 정리한 파일로, 2021년부터 2025년 7월까지의 시군·단지명·주소·모집공고일·공급세대·청약 접수건수·경쟁률·평균 및 평당 분양가(천원)를 담는다. 강원도에서 청약을 준비하는 사람이나 지역 주택시장 분석가가 '어느 시군에서 공급이 많았고 경쟁률과 평당 분양가는 어땠나'를 비교하는 데 쓴다. 전역 조인 키나 법정동 코드가 없어서 다른 데이터와는 시군 이름이나 단지명·주소를 문자열로 맞춰 이어야 한다.
description_portal: <"21~"25년 7월 입주자모집공고 현황자료>1. 개요  - 모집공고일  - 아파트 주소  - 공급 세대수  - 청약 접수건수  - 분양 경쟁률  - 84타입 평균 분양가  - 평당 분양가2. 주요 분석 항목 및 내용 2.1 시군별 공급 규모 비교- 각 시군별 아파트 공급세대수를 산출하여 지역별 공급량 차이를 확인- 공급세대수가 많은 시군은 주택 공급이 활발한 지역으로 분류- 상대적으로 공급세대수가 적은 시군은 주택 공급이 제한적인 지역으로 판단 가능2.2 분양 경쟁률 분석 - 경쟁률은 접수 건수를 공급 세대수로 나눈 값으로 산출  - 경쟁률이 높은 시군은 분양 수요가 공급보다 많아 시장에서 인기가 높은 지역으로 평가 - 경쟁률이 낮은 시군은 수요 대비 공급이 여유 있는 지역으로 해석 가능 - 이를 통해 인기지역과 비인기지역을 구분하여 부동산 시장의 수요 집중도를 분석2.3 분양 가격 동향 - 시군별 평균 분양가와 평당 분양가를 산출하여 가격 수준을 비교 - 연도별 분양가 변동 추이를 통해 부동산 가격 상승 혹은 안정세를 파악 - 평균 분양가가 높은 시군은 상대적으로 생활 인프라 및 교통 접근성이 우수한 지역일 가능성이 높음 - 평당 분양가를 활용하여 면적 대비 가격 경쟁력 분석 가능
