summary_user: 성남시 안에서 난 건축허가를 한 건씩 담은 CSV 파일로, 건축구분·대지위치·대지면적·건축면적·연면적·구조·허가일·지상/지하 층수·주용도·세대수·호수·가구수를 필지·건물 단위로 기록한다. 분석가나 사업자가 '최근 성남시 어느 동에서 공동주택이나 근린생활시설 허가가 몰리는가'처럼 지역 개발 흐름을 앞서 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키(법정동코드·PNU 등)가 없어 다른 데이터와는 대지위치 주소를 이름으로 매핑하거나 같은 성남시 자료끼리만 이어 쓴다.
description_portal: 성남시 내 건축 허가현황을 제공하는 데이터로, 건축구분, 대지위치, 대지면적, 건축면적, 증축연변적, 구조, 허가일, 최대상층수, 최대지하층수, 주용도, 세대수, 호수, 가구수 항목으로 구성되어 있습니다. CSV파일로 1년주기로 현행화 하여 자료를 제공하고 있습니다. 타 지자체와 다른 성남시 건축허가 과정의 특이점은, 재개발 및 재건축시 전담 조직운영으로 빠르게 진행되며, 사전협의체 및 가이드 라인 운영으로 민원 감소 및 인허가 처리 기간 단축, 노후주책 개선 지원 사업의 연중 신청 가능 및 지원 대상 확대라는 성남시만의 차별성을 갖고 있습니다.
