description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 공공문화체육시설현황으로 현황도형 관리번호, 도면번호, 라벨명, 면적_도형, 길이_도형 등의 항목을 제공합니다.국토의계획및이용에관한법률에 의한 공공·문화체육시설(공공청사, 학교, 연구시설, 문화시설, 사회복지시설, 공공직업훈련시설, 공공필요성이 인정되는 체육시설, 청소년수련시설)은 공간정보로 활용 가능하며, 문화체육시설 관련 정책 수립 및 연구 등에 활용될 수 있습니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
