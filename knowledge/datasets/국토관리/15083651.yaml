summary_user: 대구광역시 달서구 안의 다가구주택과 오피스텔을 건물 한 동씩 담은 파일로, 건물위치·건물명·주택유형구분·위도·경도·기준일자가 들어 있다(CSV 약 1.36MB). 부동산·주택 시장 분석가나 정책 담당자가 '달서구 어느 동네에 다가구주택과 오피스텔이 몰려 있는가'를 지도로 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 주소 문자열이나 위도·경도 좌표를 매칭해 공간적으로 붙이거나 같은 기관 자료와 이름으로 연결한다.
description_portal: 대구광역시 달서구 내 다가구주택, 오피스텔 현황에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 건물위치, 건물명, 주택유형구분, 관리부서, 기준일자 등으로 구성되어있으며 1년마다 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 현황을 파악하여  부동산, 주택 시장 분석에 참고자료로 쓰는데 가능하며 주거환경 개선 및 생활 편의 증진을 위해 주택 정책 수립, 도시 개발 연구, 주거복지정책  등 다양한 목적으로 활용될 수 있습니다.
