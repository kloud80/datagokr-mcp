summary_user: 시흥시에서 공장등록이 취소된 사업장을 한 건씩 담은 파일로, 단지명·회사명·도로명 주소·업종명·취소일을 담는다(포털 설명 기준 1,688건, 시군구 범위). 지역 산업 분석가나 산업정책 담당자가 '시흥시에서 어느 업종, 어느 단지의 공장이 언제 많이 등록취소됐는가'를 취소일 기준 시계열로 볼 때 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어서, 다른 공장등록 현황이나 기업 정보와는 회사명·주소·업종명을 이름으로 맞춰 이어 써야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 팩토리온 공장등록 정보나 기업·토지 데이터와 정확히 연결되지 않는다. 이름이나 주소로 매핑하거나 같은 기관 자료끼리만 이어 쓸 수 있다. 등록취소 사유 항목이 없어 폐업 원인은 이 데이터만으로 판단할 수 없다.
