summary_user: 전북특별자치도 내 산업단지별 입주기업을 업체 한 곳(업종이 여럿이면 업종별) 단위로 산업단지명·업체명·업종명·데이터 기준일자와 함께 담은 명단 파일(CSV 약 352KB)이다. 구직자·영업 담당자가 '도내 어느 산업단지에 어떤 업종의 기업이 입주해 있나'를 찾거나, 분석가가 단지별 업종 분포와 특화 산업을 집계하는 데 쓴다. 전역 조인 키나 코드표가 없어 공장 등록 현황, 산업단지 현황·통계 등 다른 자료와는 산업단지명·업체명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 내 산업단지에 입주한 기업들의 현황을 나타내는 자료로, 산업단지명, 업체명, 업종명, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 각 산업단지에 어떤 업종의 기업이 입주해 있는지를 확인할 수 있으며, 동일 업체가 복수 업종을 운영하는 경우도 표시되어 있어 산업단지의 다변화된 산업 구조를 파악하는 데 도움이 됩니다. 이 데이터를 활용하면 산업단지별 산업 분포, 특정 업종의 입지 현황, 기업 수 분포 등의 통계 분석이 가능하며, 기업 유치 전략, 산업정책 수립, 지역 산업 생태계 이해 등에 유용하게 활용하실 수 있습니다. 특히 입주업체의 업종을 기준으로 해당 산업단지의 특화 산업을 도출하거나, 투자유치 우선순위 설정을 위한 기초 자료로도 활용할 수 있습니다.
