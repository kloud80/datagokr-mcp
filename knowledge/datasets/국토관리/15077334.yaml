summary_user: 전남 곡성군 안의 원룸·오피스텔을 건물별로 한 행씩 담은 목록으로, 주소·주용도·객실수·건축년도·데이터기준일자를 담는다(csv 약 3.9KB의 소규모 파일). 곡성군에서 자취방이나 임대용 원룸·오피스텔을 찾는 주민·귀농귀촌인, 또는 지역 소형 주거 공급을 살피는 분석가가 "곡성 어디에 몇 실 규모의 원룸이 언제 지어졌나"를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소 문자열을 매칭하거나 같은 곡성군 데이터끼리만 이어 쓴다.
