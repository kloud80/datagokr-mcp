description_portal: 경상북도_재난대응용 배수펌프장 현황 자료는 시·군 단위로 수해 예방과 관련된 주요 시설의 운영·관리 현황을 정리한 자료입니다. 행정구역(읍·면·동) 기준의 위치 정보와 주용도, 유역 규모, 장비 규모(동력·관경·대수), 처리 성능, 저류 규모, 계획 빈도, 설치·관리 주체, 설치 연도 등을 포함합니다. 해당 자료는 침수 위험지역 분석, 우수 관리 계획 수립, 점검·정비 우선순위 결정, 예산 투자 검토, 지도 기반 시각화(GIS), 강우·수위·침수이력 등 타 데이터와의 결합 분석에 활용할 수 있습니다. 자료 관련 문의는 054-880-2358로 하시기 바랍니다.
