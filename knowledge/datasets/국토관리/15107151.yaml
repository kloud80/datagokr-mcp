summary_user: 수원시 전체와 영통·장안·팔달·권선 4개 구별로 주택 수, 일반가구 수, 이를 바탕으로 산정한 주택보급률을 담은 시군구 단위 집계 파일(CSV, 246바이트)이다. 수원시 도시계획·주택정책 담당자나 분석가가 "수원시 어느 구가 가구 수 대비 주택이 가장 부족한가"를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군·구 이름(시군)을 행정구역 코드에 직접 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 경기도 수원시의 주택보급률 현황에 대한 본 자료는 수원시 전체를 비롯하여 영통구, 장안구, 팔달구, 권선구 등 4개 행정구역별로 구체적인 주택 수, 일반가구 수, 그리고 이를 기반으로 산정된 주택보급률에 대한 정보를 종합적으로 수록하고 있습니다. 이를 통해 수원시 내 각 구의 주택 공급 수준과 가구 대비 주택의 충족 정도를 객관적으로 파악할 수 있으며, 주거 안정성 분석, 인구 대비 주택 수요 예측, 향후 주택 공급 정책 수립 등 다양한 도시계획 및 정책 수립에 있어 중요한 기초자료로서의 가치를 지닙니다. 더불어 지역별 주거 여건의 형평성을 판단하고, 주택 관련 제도 개선이나 균형 있는 발전 방향을 설정하는 데에도 유용하게 활용될 수 있습니다
