description_portal: '○ 통계개요* 통계명 : 전·월세 전환율(주택유형별)* 통계종류 : 서울시 전·월세 전환율(주택유형별)을 제공하는 일반ㆍ보고통계* 작성목적 : 최근 증가하는 주택의 월세 계약 추세를 반영하여, 실제 계약자료인「전월세 확정일자 등록시스템」에 기반한 ‘주택 전월세 전환율’ 을매 분기별 공개함으로써, 새로 집을 구하거나 재계약을 앞둔세입자들에게 실질적인 도움을 제공하는 동시에 불공정한 월세 부담과급격한 월세 전환을 방지하는데 기여할 것으로 기대* 조사체계 : 실제 25개 자치구의 거래량을 대상으로 산출* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 서울시 전·월세 전환율(주택유형별) 현황○ 용어설명* 전월세 전환율 : 전세금 일부를 월세로 돌릴 때 그 금액을 산정하는 데 참고로 하는 수치임- 전월세 전환율 = {(월세금액×12개월)÷(총 전세금액-월세보증금)}×100○ 기 타* 서울시 권역별- 도심권 : 종로구, 중구, 용산구- 동남권 : 서초구, 강남구, 송파구, 강동구- 동북권 : 성동구, 광진구, 동대문구, 중랑구, 성북구, 강북구, 도봉구, 노원구- 서남권 : 양천구, 강서구, 구로구, 금천구, 영등포구, 동작구, 관악구- 서북권 : 은평구, 서대문구, 마포구'
