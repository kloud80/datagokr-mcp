description_portal: 본 자료는 충청북도 제천시의 행정구역별(27개동, 1읍, 7면) 토지이용 현황을 체계적으로 파악하기 위하여 지적공부를 기초로 작성한 공공데이터로, 각 행정구역 단위별 지목 종류와 해당 지목에 속하는 필지 수를 집계한 자료임. 지목별 토지 분포 현황을 한눈에 확인할 수 있도록 구성되어 있으며, 매년 정기적으로 실시되는 지적공부 정비 및 각종 토지 이동, 지목 변경 등 변동 사항을 반영하여 연주기로 최신화하고 있음. 본 데이터는 토지이용 실태 분석, 도시·농촌계획 수립, 공간정보 분석, 행정 통계 작성, 정책 결정 지원 등 다양한 행정업무 및 연구 목적의 기초자료로 활용 가능함.
