description_portal: 이 자료는 울산광역시 도시계획시설 중 교통시설에 해당하는 철도 현황을 정리한 자료입니다. 도시계획시설로 결정되어 있는 동해남부선(부산~울산간, 울산~포항간), 공장인입선(장생포 선, 울산항 선, 삼성정밀화학 선, 온산공단 선), 신항만 인입선, 경부고속철도 등 주요 철도 시설에 대하여 각 노선별 결정 구간, 철도의 연장, 시점과 종점, 최초 고시일 및 최종 고시일 등에 대한 도시계획현황울 제공하고 있는 엑셀 파일 형태의 자료입니다. 본 자료는 도시계획현황통계를 기초로 하는 자료로 세부적인 사항들을 포함하지 않으므로 참고 자료로 활용하시기 바랍니다.
