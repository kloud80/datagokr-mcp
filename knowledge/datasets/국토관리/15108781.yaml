summary_user: 제주시가 설치한 하천 감시 CCTV를 지점별로 한 건씩 담은 현황 데이터로, 지점구분·지점명·영상 URL·위도·경도·사용여부를 제공한다. 제주시 주민이나 방재 담당자가 호우 때 특정 하천 지점의 실시간 영상을 어디서 볼 수 있는지 확인하거나, 지도에 CCTV 위치를 표시하는 데 쓴다. 전역 조인 키가 없어 다른 하천 데이터와는 지점명 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 하천코드 같은 공통 키가 없어 하천 목록·수위 관측 데이터와 바로 결합할 수 없다. 범위는 제주시 한 곳에 한정된다. 영상 자체가 아니라 CCTV 접속 URL만 제공하며, 사용여부(useYn)로 운영 중인 지점을 걸러 써야 한다.
