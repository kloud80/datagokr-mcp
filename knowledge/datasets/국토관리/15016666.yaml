summary_user: 익산시에서 내준 토석채취 허가를 허가 건별로 담은 원천 목록으로, 허가지 지번·면적·수량·허가 시작일과 종료일·수허가자·용도를 기록한다(csv 450바이트의 소규모 파일). 주민이나 사업자가 '우리 동네 어느 지번에서 언제까지 토석채취가 허가돼 있나'를 확인하거나, 분석가가 시 내 채취 허가 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 허가지 지번을 주소·지번 정보에 이름으로 맞추거나 같은 기관(익산시) 기준으로만 이어 쓴다.
