summary_user: 화성시의 유동인구를 시간대(0~23시, 1시간 단위)·외국인 여부별로 나누고, 성별과 5세 단위 연령대(0~69세)별 인구수를 담은 집계 자료다. 상권 분석가나 사업자가 '화성시에서 20대 여성 유동인구가 가장 많은 시간대는 언제인가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 시군구 코드·이름(signgu_cd)과 조사일자로 같은 기관의 다른 시군 유동인구 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 화성시 지역을 대상으로 시간대별 유동인구 정보를 제공하는 자료로, 00시부터 23시까지 1시간 단위로 수집된 정보를 포함하고 있습니다. 유동인구는 성별 및 연령대(0~69세)를 기준으로 세분화되어 있으며, 남자0009수 또는 여자2529수와 같은 항목을 통해 각 연령층의 인구수를 파악할 수 있습니다. 또한 외국인 여부도 ‘외국인구분’ 항목을 통해 구분됩니다. 유동인구 수치는 이동통신 기지국 데이터를 기반으로 하며, 인근 50m×50m 셀 단위로 분배됨에 따라 소수점 값이 발생할 수 있습니다.
