summary_user: 원주시 안의 아파트 단지를 한 행씩 담은 파일로, 단지명·주소·분양조건·사업승인일·사용검사일·동수·세대수·대지면적·연면적·층수·관리기관과 연락처를 담는다(csv 약 42KB). 원주에서 집을 알아보는 시민이나 분석가가 "이 단지는 언제 사용검사를 받았고 몇 세대·몇 층 규모이며 분양인지 임대인지"를 확인하는 데 쓴다. 실측 컬럼에 K-apt 단지코드 같은 전역 조인 키가 없어서, 실거래·공시가격·K-apt 관리비 데이터와는 단지명·주소를 맞춰 이어 쓴다.
limits: 단지코드가 없어 다른 주택 데이터와 붙이려면 단지명·주소 문자열 매칭에 기대야 하고, 표기 차이 때문에 일부 단지는 연결되지 않을 수 있다. 범위는 원주시 한 곳뿐이며, 관리비·장기수선·실거래가는 들어 있지 않다.
