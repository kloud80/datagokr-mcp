summary_user: 광주 동구에서 허가된 건축 행위를 허가 건별로 담은 파일로, 건축구분(신축·증축·대수선 등), 허가번호, 대지위치·지목, 대지·건축·연면적, 건폐율·용적률, 층수·높이·동수, 주용도·용도지역, 설계·감리·시공 사무소명이 들어 있다. 지역 분석가나 개발 사업자가 동구에서 최근 어떤 용도·규모의 건물이 어디에 허가되고 있는지 보고 지역 개발 흐름을 앞서 가늠하는 데 쓴다. 실측 컬럼에 필지고유번호 같은 전역 조인 키가 없어, 다른 건축물·토지 데이터와는 대지위치 주소 문자열을 매칭하거나 같은 기관 데이터끼리만 이을 수 있다.
description_portal: 광주광역시 동구의 건축허가 현황 데이터는 지역 내에서 이루어지는 건축 행위가 어떤 내용과 규모로 허가되었는지를 체계적으로 기록한 자료로, 도시계획·건축행정·지역 개발 흐름을 파악하는 데 중요한 기초 정보로 활용됩니다. 이 데이터는 건축물의 유형부터 규모, 위치, 용도까지 상세하게 포함하고 있어 각 허가 건을 종합적으로 이해할 수 있도록 구성되어 있습니다.데이터에는 먼저 건축구분이 포함되어 있어 허가 대상이 신축인지, 증축·개축인지, 대수선 또는 용도변경인지 등을 확인할 수 있습니다. 허가번호는 각 건축허가 건을 식별하기 위한 고유 번호로, 행정 처리 및 이력 관리에 사용됩니다. 건물이 들어설 장소는 대지위치와 함께 토지의 성격을 나타내는 지목으로 기록되며, 해당 부지가 어떤 용도로 분류되는지 판단할 수 있습니다.또한 건물의 규모와 관련된 정보로 대지면적, 건축면적, 연면적이 제공되며, 이를 토대로 건폐율과 용적률을 계산해 건물이 법적 기준에 맞게 건축되는지 확인할 수 있습니다. 실제 허가가 이루어진 날짜는 허가일에 기록되며, 건축물의 형태와 규모는 층수, 동수, 그리고 가장 중요한 용도 항목을 통해 구체적으로 파악할 수 있습니다. 이 용도는 주거용, 상업용, 공업용, 복합용 등 다양한 건축 목적을 나타냅니다.이와 같은 건축허가 현황 데이터는 동구의 도시 구조 변화와 개발 추세를 이해하는 데 중요한 자료이며, 도시관리계획 수립, 인허가 행정, 건축물 안전관리, 지역 개발 정책 등 다양한 행정 업무의 핵심 기반이 됩니다.
