summary_user: 전라남도 진도군 안의 원룸·오피스텔을 건물 한 곳당 한 행으로 담은 파일(csv, 약 3KB)로, 용도·상호명·도로명/지번 주소·전화번호·세대수(객실수)·건축연도를 담는다. 진도군에서 자취방이나 단기 거주용 원룸을 찾는 주민·근무자, 또는 군 단위 소형 임대주택 공급 현황을 파악하려는 분석가가 '진도에 어떤 원룸이 어디에 몇 세대 규모로 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 도로명·지번 주소를 주소 매칭(지오코딩 등)으로 맞추거나 같은 기관 자료와 이름으로만 이어 쓴다.
limits: 진도군 한 곳만 다루므로 다른 시군과 비교하려면 지자체별 자료를 따로 모아야 한다. 표준 코드나 전역 키가 없어 실거래·임대차 자료와 붙이려면 주소 문자열을 정제해 맞춰야 한다.
