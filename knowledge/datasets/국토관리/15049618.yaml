summary_user: 광산구에서 결정 후 오래 집행되지 않은 공간시설(공원·녹지 등) 도시계획시설을 시설별로 한 행씩 담은 파일로, 시설 종류·명칭, 결정일자와 고시번호, 결정·집행 면적, 국공유지·사유지별 미집행 면적, 보상비·공사비를 담는다(약 5KB 규모 CSV). 구청 도시계획·예산 담당자나 분석가가 '광산구의 장기미집행 공원을 모두 집행하려면 사유지 보상비가 얼마나 드는가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·결정위치 같은 이름 매핑이나 같은 기관(광산구) 기준으로만 이어 쓴다.
