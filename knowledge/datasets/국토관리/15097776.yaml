description_portal: 이 데이터는 서울특별시 및 서울주택도시공사(SH공사)가 공동으로 보유한 **공공한옥 10채(건물 총 19동)**에 대해 실측한 3차원(3D) 스캔데이터의 구조와 형상을 미리 확인할 수 있도록 제작된 샘플 동영상 자료입니다. 본 영상은 고해상도 3D 스캔 기술을 통해 디지털화된 한옥의 외관 및 내부 공간을 시각적으로 구현한 콘텐츠로, 각 건축물의 실제 형상, 비례, 구조적 특징, 전통 건축 요소 등을 직관적으로 확인할 수 있도록 구성되어 있습니다. 이 동영상은 연구자, 설계자, 일반 시민 등 다양한 이용자들이 실제 데이터를 다운로드하거나 활용하기에 앞서 한옥 디지털 아카이빙의 수준과 활용 가능성을 판단할 수 있게 도와주는 참조 자료입니다. 또한, 향후 VR/AR 콘텐츠 개발, 문화유산 보존교육, 디지털 건축 설계 등의 활용 방향성을 제시하는 데에도 의미 있는 시각자료입니다.
