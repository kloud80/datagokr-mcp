summary_user: 포항시가 처리한 토지거래계약허가를 허가 건별로 담은 파일로, 처리연도·허가번호·허가구분과 읍면동·리·지번 소재지, 지목·면적(제곱미터), 허가일, 이용목적, 착수·준공 예정일, 토지취득일·이용의무종료일을 수록한다. 포항시 안에서 어떤 동네의 어떤 지목 토지가 어떤 목적으로 거래허가를 받았고 이용의무가 언제 끝나는지 확인하려는 분석가나 토지행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키(법정동코드·PNU 등)가 없어 읍면동·리·지번 이름을 주소 매핑해야 토지대장·공시지가 같은 필지 데이터와 이어 쓸 수 있다.
description_portal: 본데이터는「국토의계획및이용에관한법률」에근거하여운영되는토지이용거래허가제의행정처리현황을체계적으로정리한공공데이터이다.토지의투기적거래를방지하고계획적·합리적토지이용을유도하기위하여허가대상토지에대해거래내용과이용계획을관리한결과를반영하고있다.처리연도별허가자료를기준으로허가번호,허가구분,소재지정보인읍·면·동및리,지번을포함하며,토지의물리적특성을파악할수있는지목과면적(제곱미터)을제공한다.또한행정처리시점을확인할수있는허가일과함께거래이후토지활용계획을파악하기위한이용목적,사업착수년월일,준공예정일을수록하고있다.토지취득일과이용의무종료일항목을통해허가조건에따른이용의무이행여부를관리·분석할수있도록구성되어있다.본자료는토지이용실태및이행관리현황분석,부동산거래동향및공공규제효과분석,도시관리계획과토지이용계획수립을위한기초통계자료로활용가능하며,지방자치단체의토지행정업무지원과정책결정의근거자료로활용할수있다.
