summary_user: 새만금사업 매립 현황을 권역별·용지 구분별로 집계해 계획면적과 매립완료·매립중·매립예정 면적(제곱킬로미터)을 담은 작은 CSV 파일(673바이트)이다. 새만금 투자나 도시계획을 검토하는 사업자·분석가가 '어느 권역의 어떤 용지가 얼마나 매립됐고 얼마가 남았나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 새만금 자료와는 권역명·용지명을 이름으로 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
