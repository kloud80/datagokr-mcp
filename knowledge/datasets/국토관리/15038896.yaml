summary_user: 스마트공장 보급 확산사업에 참여해 스마트공장을 구축한 우수 기업의 사례를 기업 단위로 담은 소규모 CSV 파일(약 9KB)로, 선정년도·기업명·구축내용·지역을 담는다. 스마트공장 도입을 검토하는 제조 중소기업이나 분석가가 "우리 지역·업종에서 어떤 기업이 어떤 내용으로 스마트공장을 구축해 우수사례로 뽑혔나"를 찾아보는 데 쓴다. 사업자번호나 공장 고유번호 같은 전역 조인 키가 없어, 공장등록(팩토리온) 등 다른 데이터와는 기업명이나 지역 이름 매칭으로만 이어 쓸 수 있다.
