summary_user: 경기도 수원시 일반건축물의 지방세 과세 기준인 시가표준액을 물건지(소재지) 단위로 담은 건별 파일로, 연면적·납부년도·결정일자가 함께 들어 있습니다(CSV 약 23MB). 세무·부동산 분석가가 "수원시 안에서 같은 동네 건물끼리 시가표준액과 그에 따른 세 부담이 얼마나 차이 나는가"를 비교하는 데 쓴다. 전역 조인 키는 없어서 자치단체코드나 시도·시군구명, 물건지 주소 문자열을 매핑해 건축물대장·공시지가 같은 다른 국토 정보 데이터와 잇는다.
description_portal: 일반건축물에 대한 지방세 부과기준인 시가표준액을 제공하고(시도명,시군구명,자치단체코드,과세년도, 물건지,시가표준액,연면적,기준일자)을 포함한 데이터입니다. 시가표준액은 일반건축물에 대한 과세 기준이 되는 중요한 데이터입니다. 이 데이터를 활용하면 세금정책, 부동산 행정, 도시 계획, 재정분석, 민원 댕응 등 다양한 분야에서 실질적인 분석과 정책 개선에 활용할 수 있습니다. 지역별 시가표준액을 비교 분석 할 수 있으며, 주변 건축물과의 시가표준액 차이로 인한 세금 부담  차이를 파악하는데 도움이 됩니다.
