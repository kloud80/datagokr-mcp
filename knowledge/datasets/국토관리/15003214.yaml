summary_user: 녹색건축 인증을 받은 건축물을 건별로 담은 파일 데이터로, 인증번호·인증기준·인증등급·인증일자·건축물 주소와 연면적·층수 등을 싣고 전국 5,104건(2015-01-08~2025-12-30)을 포함한다. 건축주나 분석가가 특정 지역·용도 건축물의 녹색건축 인증 등급과 인증 시점을 확인하는 질문에 쓴다. 건축물 주소(address)가 조인 키라서 건축물대장 등 주소를 가진 건축물 데이터와 이어 쓰며, 인증번호는 키로 지정되어 있지 않다.
description_portal: '한국부동산원(구.한국감정원)에서 제공하는 녹색건축 인증현황 정보 중 인증번호,시도,인증기준,인증구분,건축물명,인증대상 건축물군,인증등급,인증일자,건축물 주소 데이터입니다.ㅇ 관련 사이트 : www.gseed.or.kr > 녹색건축자료실 > 녹색건축 실적현황ㅇ 녹색건축 인증제도란?- 설계와 시공 유지, 관리 등 전 과정에 걸쳐 에너지 절약 및 환경오염 저감에 기여한 건축물에 대한 친환경 건축물 인증을 부여하는 제도이다. 또한, 지속 가능한 개발의 실현을 목표로 인간과 자연이 서로 친화하며 공생할 수 있도록 계획된 건축물의 입지, 자재선정 및 시공, 유지관리, 폐기 등 건축의 전 생애(Life Cycle)를 대상으로 환경에 영향을 미치는 요소에 대한 평가를 통하여 건축물의 환경성능을 인증하는 제도를 말한다'
