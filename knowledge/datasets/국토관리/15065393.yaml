summary_user: 인천 연수구에서 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 소규모 파일(csv 약 4.9KB)로, 업종·업소명·주소·최초 지정 시기와 대표 품목 두 개의 가격을 함께 싣는다. 주민이 '우리 동네에서 값싼 미용실이나 식당이 어디 있나'를 찾을 때, 또는 지역 물가 정책 담당자가 착한가격업소의 업종별 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(도로명주소)를 지오코딩하거나 업소명·업종 이름을 맞춰서만 이을 수 있다.
description_portal: 인천광역시 연수구 착한가격업소 데이터는 지역 내 합리적인 가격과 우수한 서비스를 제공하는 업소 현황을 담고 있습니다. 데이터는 업소의 상호명, 영업소 소재지 도로명주소, 업종 항목으로 구성되어 있어 이용자가 원하는 업소를 쉽게 파악할 수 있습니다. 이를 통해 지역 주민은 생활비 절감과 함께 신뢰할 수 있는 업소를 선택할 수 있으며, 정책 담당자나 연구자는 물가 안정 정책 수립, 지역경제 분석 등 다양한 목적으로 활용할 수 있습니다. 또한 업소 분포 현황을 확인함으로써 지역 내 소비 패턴 및 상권 특성을 이해하는 데에도 유용합니다.
