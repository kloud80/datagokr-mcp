summary_user: 제주투자진흥지구별 지구명·위치·면적·사업비·사업시행자·지정일·변경일을 한 행씩 담은 지구 단위 현황 파일로, 포털 설명상 2014년 10월 기준이며 지정일은 2005~2014년에 걸쳐 있다. 투자자나 정책 분석가가 '제주에서 어떤 사업자가 언제 어느 위치에 얼마 규모로 투자진흥지구를 지정받았는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지구명·사업시행자 이름이나 위치 주소를 매칭해 이어 써야 한다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)가 2014년 10월 기준으로 추진한 제주투자진흥지구의 지정 및 관리 현황을 담고 있습니다. 주요 항목으로는 지구명, 위치, 면적, 사업비, 사업시행자, 지정일, 변경일이 포함되어 있으며, 지구명에는 제주동물 테마파크, 비치힐스 리조트 등 개별 지구의 명칭이 기록되어 있습니다. 위치 항목에는 각 지구가 실제로 위치한 상세 주소가 포함되어 있으며, 면적은 단위 면적으로 표기되어 개발 범위를 나타냅니다. 사업비는 지구별 총 투자비용을 나타내고, 사업시행자에는 해당 지구의 개발을 담당하는 법인이나 기관명이 기록되어 있습니다. 지정일은 날짜 형식으로 2005년부터 2014년 사이에 분포되어 있으며, 변경일은 지정 이후 변경이 발생한 지구에 한해 포함되어 있습니다. 본 데이터는 JDC의 투자유치 전략 수립, 지정 지구별 사업 진행 상황 분석, 연도별 개발 추이 파악 등 행정적·정책적 분석에 유용하게 활용될 수 있습니다.
