summary_user: 서울특별시 주택 건설사업 인허가 건의 층별 현황을 층 단위로 담은 원천 자료로, 대지 위치(주소·지번), 동명, 지상·지하 구분과 층번호, 층별 주용도·용도, 층 면적(FLR_AREA)을 기록한다. 개발사업자나 분석가가 "인허가된 이 주택 사업은 층마다 어떤 용도로 얼마의 면적을 배치했는가"를 확인하거나, 자치구별 층별 용도 구성을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 기관의 주택인허가 기본·동별 개요와는 대지위치·지번·동명이나 개요 일련번호 같은 이름·번호 매칭으로만 이어 쓴다.
description_portal: 주택인허가 층별개요 데이터는 주택 건설사업 인허가 과정에서 각 층의 세부 현황을 기록한 자료입니다. 이 데이터에는 건축물의 위치(주소, 지번), 대지 구분, 지상·지하 여부, 층수 및 층명, 구조 형식(철근콘크리트, 철골조 등), 층별 주용도(아파트, 다세대, 오피스텔 등)와 부수 용도, 해당 층의 연면적 정보가 포함됩니다. 또한 주건축물과 부속건축물 구분, 면적 산정에서 제외되는 여부도 함께 제공됩니다. 이를 통해 주택 개발 계획 단계에서 세대 구성, 층별 용도 배치, 건물 규모 검토, 구조 안전성 평가 등을 수행할 수 있으며, 인허가 심사, 도시계획 검토, 부동산 개발사업 타당성 분석, 주거정책 수립의 기초 자료로 활용됩니다.
