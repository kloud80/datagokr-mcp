summary_user: 충청북도 산업단지에 입주한 공장기업을 회사 한 곳당 한 행으로 담은 명부 파일(CSV, 약 2.1MB)로, 단지명·지식산업센터명·업종·대표자·전화번호와 남녀·외국인 종업원 수, 용도지역을 담는다. 충북 산업단지별로 어떤 업종 기업이 모여 있고 외국인 고용 비중이 어느 정도인지 보려는 분석가나, 특정 단지 입주기업 연락처를 찾는 사업자가 쓴다. 사업자번호나 필지 고유번호 같은 공통 조인 키는 없어서, 다른 산업단지 현황·통계와는 단지명이나 업종번호·업종명을 맞춰 이어 쓴다.
description_portal: 해당 공장기업 현황 데이터는 산업단지 내 입주한 기업들의 전반적인 정보를 포괄적으로 파악할 수 있도록 구성된 자료입니다. 주요 항목으로는 회사명과 대표자명, 전화번호 등이 포함되어 있어 기업별 기본적인 식별 및 연락이 가능하며, 산업단지명과 지식산업센터명을 통해 기업의 입지정보를 확인할 수 있습니다. 또한 남자 종업원, 여자 종업원, 외국인 남자 종업원 외국인 여자 종업원, 전체 종업원 수와 같은 인력 구성 데이터를 통해 고용현황과 외국인 고용 비중 등도 파악할 수 있습니다. 업종명과 업종번호는 해당 기업이 영위하는 산업분야를 구체적으로 나타내며, 산업군별 분포와 특성을 분석하는 데 활용됩니다. 용도지역 정보는 해당 공장이 위치한 지역의 도시계획상 지정용도를 나타내며, 입지 적정성이나 향후 개발 가능성 분석에 도움이 됩니다. 이러한 데이터를 종합적으로 활용하면 산업단지 내 기업의 특성, 고용 구조, 외국인 노동력 활용도, 산업분포, 입지 특성 등을 입체적으로 분석할 수 있습니다.
