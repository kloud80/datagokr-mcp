summary_user: 서울시와 SH공사가 공동 소유한 공공한옥 10채·건물 19동을 3D 스캔한 실측 데이터의 파일 목록으로, 가옥명·건물명·용도, 데이터 취득 방식, 3D 데이터 유형, 파일형식, 파일명, 용량 같은 메타데이터를 파일 단위로 담는다(CSV 약 8KB). 한옥 연구자나 디지털 복원·VR 콘텐츠 개발자가 어느 한옥 건물에 어떤 형식의 3D 스캔 파일이 있고 용량이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 가옥명·건물명 같은 이름 매칭이나 기관명으로만 이어 붙인다.
description_portal: 이 데이터는 서울특별시와 서울주택도시공사(SH공사)가 공동 소유하고 있는 공공한옥 10채, 총 건물 19동에 대해 실시한 3차원(3D) 실측 스캔데이터 목록입니다. 각 한옥은 전통 건축문화 보존과 활용을 목적으로 보존·관리되고 있으며, 3D 스캔은 건축물의 구조, 외형, 세부 요소 등을 정밀하게 디지털화한 데이터로 구성되어 있습니다. 이 목록에는 한옥별 식별 정보, 위치, 스캔 방식, 스캔 일자 또는 파일 형태 등 기본적인 메타데이터가 포함되어 있어, 문화재적 가치 평가, 정비 이력 관리, 디지털 복원, VR·AR 콘텐츠 개발 등 다양한 용도로 활용될 수 있습니다. 특히 전통한옥의 구조를 정밀하게 보존하기 위한 자료로서 학술적·행정적 가치가 높으며, 서울시의 역사적 도시경관을 디지털 기술로 보존하는 우수 사례로 평가받고 있습니다.
