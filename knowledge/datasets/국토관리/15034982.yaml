summary_user: 경상북도 청도군에 등록된 제조업체를 업체 한 곳당 한 행으로 담은 명부로, 회사명·대표자명·전화번호·공장 도로명 주소·업종명·생산품·데이터기준일자를 담는다(CSV 약 26KB). 청도군에서 특정 품목을 만드는 공장을 찾거나 업종별 업체 분포로 지역 특화·취약 업종을 살피려는 사업자·분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어서, 다른 공장등록·기업 데이터와는 회사명이나 공장 주소를 맞춰 이어 쓴다.
description_portal: 경상북도 청도군 관내에 등록된 제조업체에 대한 현황 정보를 제공합니다.이 자료는 청도군 지역 내에서 공장을 운영하며 제품을 생산하는 제조업 기반 사업체들의 주요 정보를 체계적으로 정리한 것으로, 회사명, 대표자명, 전화번호, 공장 도로명 주소, 업종명, 주요 생산품 등의 항목으로 구성되어 있습니다. 해당 데이터는 각 제조업체가 주로 생산하는 제품군을 통해 지역 특화 산업, 수출입 품목, 산업 연계 가능성 등을 분석하는 데에도 유용합니다. 청도군 내 제조업체는 기계, 금속, 식품, 전기·전자, 섬유 등 다양한 업종에 걸쳐 있으며, 해당 자료는 특정 산업 분야의 집중도나 취약 업종 파악 등 지역 산업 균형을 위한 분석 작업에도 도움이 됩니다.
