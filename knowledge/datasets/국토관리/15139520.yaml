summary_user: 군산 산업단지에 설치된 악취·환경 모니터링 센서와 침수·강우 감지기의 센서 정보와 측정값(복합악취·황화수소·미세먼지 등 대기 항목, 침수 수위·강우량·침수 위험도)을 센서별·수집 일시별 건 단위로 담으며, API 전체 건수는 193,240건이다. 산단 입주기업이나 인근 주민, 환경·안전 분석가가 '특정 기간 군산 산단 어느 지점에서 악취나 침수 위험이 높았나'를 확인하는 데 쓴다. 센서 설치 주소(address)와 경위도 좌표를 키로 산업단지 경계도면·전국산업단지 표준데이터 등 위치 기반 데이터와 공간적으로 이어 쓰고, 침수 위험도는 안전·주의·경계·위험 4단계 코드표로 해석한다.
limits: 필수 파라미터인 센서 유형(sensorType)은 다른 데이터에서 코드를 먼저 받아 넘겨야 하고, 침수 센서 오퍼레이션(/flood-sensor)은 최소 파라미터로 호출했을 때 응답이 없었다. 전량을 받으려면 페이지를 194회 이상 반복해야 하며, 실측 최신 날짜는 검증 호출 조건 기준이라 실제 데이터 최신성과 다를 수 있다. 포털 설명의 교차로 교통량·버스 승하차 통계는 제공 필드 목록에서 확인되지 않는다.
