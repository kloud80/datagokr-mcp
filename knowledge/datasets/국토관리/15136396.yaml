summary_user: 경기도 지역화폐 사용액을 기준년월·시군·성연령(성별과 연령대를 결합한 코드)별로 묶어 매출금액과 전체 대비 매출금액비율로 담은 집계 데이터다. 정책 분석가나 시군 담당자가 "우리 시군에서 지역화폐를 가장 많이 쓰는 성별·연령층은 누구인가" 같은 인구집단별 소비 비중을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 시군코드(sigun_cd)를 이름·코드 매핑으로 다른 경기도 시군 자료와 맞추거나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 경기도 지역화폐 사용 내역을 성별 및 연령대별로 집계한 자료로, 특정 인구집단의 소비 패턴을 파악하는 데 활용됩니다. ‘기준년월’을 기준으로 하며, ‘시군코드’를 통해 경기도 내 각 시군을 구분할 수 있습니다. ‘성연령코드’는 소비자의 성별과 연령대를 결합한 코드를 나타내며, 이에 따른 ‘매출금액’과 ‘매출금액비율’이 제공됩니다. 매출금액은 해당 집단이 사용한 총 금액을 의미하고, 매출금액비율은 전체 지역화폐 매출 중 해당 집단이 차지하는 비율을 보여줍니다. 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.
