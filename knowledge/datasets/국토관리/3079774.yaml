summary_user: 광양시 관내 공동주택(아파트 등)을 단지별 한 행으로 담은 파일로, 아파트명·읍면동·위치·사업주체·층수·동수·세대수와 사업승인일·사용검사일, 유형·비고를 기록한다. 주민이나 분석가가 '광양시 어느 읍면동에 언제 사용검사를 받은 몇 세대 규모 아파트가 있는가'를 확인하거나 지역별 공동주택 공급 시기와 규모를 살피는 데 쓴다. 전역 조인 키(단지코드·법정동코드 등)가 없어 다른 데이터와는 아파트명·읍면동 이름을 맞추는 방식으로만 이어 쓴다.
