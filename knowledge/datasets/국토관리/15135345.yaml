summary_user: 한국토지주택공사의 2024년도까지 상가공급계획을 지역본부·사업지구·블록별 세대수와 공급년도로 담은 전국 단위 파일(csv, 약 8KB)이다. 사업자나 분석가가 'LH가 어느 지구에서 몇 년에 상가를 얼마나 공급했거나 공급할 계획인가'를 지역본부·연도별로 확인하는 데 쓴다. 전역 조인 키는 없어 지역본부코드나 사업지구명·블록명 이름 매칭으로 같은 기관의 다른 LH 공급·분양 데이터와 이어 쓴다.
description_portal: 한국토지주택공사의 2024년도까지의 상가공급계획(지역명, 사업지구명, 블록명, 세대수, 공급년도) 정보를 제공합니다. 지역별로 살펴볼 때 인천지역본부가 331세대(23.8%), 서울지역본부 216세대(15.6%), 경기지역본부 174세대(12.54%)를 24년도까지 공급할 계획입니다. 년도별로는 2016년 414세대(29.83%), 2018년 291세대(20.97%)로 과반이 넘게 공급하였습니다. 가장 많은 상가 공급을 진행한 지구는 화성동탄2지구로 93호(6.7%)에 해당하는 공급을 진행하였습니다.
