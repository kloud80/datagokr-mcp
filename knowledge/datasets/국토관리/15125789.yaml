description_portal: 이 데이터는 ‘서울두드림길’로 불리는 서울시 내 둘레길의 선형(라인) 공간정보를 제공합니다. 각 구간의 위도·경도 좌표(X, Y)를 포함하고 있어, 둘레길이 지나는 경로를 GIS(지리정보시스템) 상에서 시각화하거나 공간분석을 수행하기에 적합합니다. 좌표계는 ITRF2000이 사용되며, 형태는 쉐이프파일(Shapefile) 형식으로 제공, 기본 인코딩이 UTF-8으로 설정되어 있습니다. 이를 활용하면 둘레길의 경로 최적화, 자전거‧도보 이용자 동선 분석, 주변 환경(녹지, 접근성)과의 연계성 평가, 관광 및 레크리에이션 인프라 계획 등에 기여할 수 있습니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)
