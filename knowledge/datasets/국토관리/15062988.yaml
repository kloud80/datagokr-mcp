summary_user: 부안군 상하수도요금시스템에서 뽑은 요금 수납 건별 기록으로, 수용가번호별 접수일자·납기마감일·수납일자와 상수도·하수도·지하수 요금의 납기내·납기후 금액과 실제 수납액을 담는다(CSV 약 28MB). 군 재정 담당자나 분석가가 "부안군 주민은 상하수도 요금을 납기 안에 내는 비율이 얼마이고, 납기 후 납부는 어느 달에 몰리는가"를 따져 징수 효율을 진단하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 군 단위 이름 매핑으로만 잇는다. 수용가번호는 이 파일 안에서만 쓰는 식별자다.
description_portal: 본 데이터는 전북특별자치도 부안군에서 관리하는 상하수도요금시스템(DB)에서 추출한 수납 관련 정보를 기반으로 작성된 자료이다. 수록 항목으로는 요금 고지 후 접수일자, 실제 수납이 이루어진 수납일자, 상수도요금 수납금액, 하수도요금 수납금액 등이 포함되어 있으며, 기간별 요금 수납 현황을 체계적으로 파악할 수 있도록 구성하였다. 본 데이터는 요금 수납 시기의 추이 분석, 상·하수도 재정 수입의 흐름 파악, 징수 효율성 진단 및 행정정책 수립의 기초자료로 활용될 수 있다. 또한 납부 시점의 지연 여부나 항목별 납부 경향 등을 분석함으로써 주민 편의를 위한 제도 개선, 요금 정책 수립의 근거자료로서 중요한 역할을 한다. 데이터 기반의 수납 관리와 행정의 투명성 제고를 위한 자료로서 활용 가치가 높다.
