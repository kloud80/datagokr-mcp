description_portal: 이 데이터는 충청남도 서산시 기계설비 성능점검 대상 건축물 현황을 정리한 공공자료이다. 항목은 단지명, 도로명주소, 소유주(상호), 연면적, 주용도로 구성된다. 단지명은 건축물의 이름, 도로명주소는 위치 정보를 제공하며, 소유주(상호)는 소유자 또는 법인명이다. 연면적은 건축물 전체 면적, 주용도는 주요 사용 목적을 의미한다. 본 자료는 기계설비 안전관리, 정기점검 대상 파악, 시설 유지관리, 에너지 효율 향상, 법적 점검 이행 등을 위해 활용된다. 데이터는 서산시청에서 수집 및 관리하며, 관련 규정에 따라 정기적으로 갱신된다. 건축물 관리주체 및 관계 기관이 성능점검 대상 여부를 확인하고 활용하는 데 필요한 기초자료로 제공된다.
