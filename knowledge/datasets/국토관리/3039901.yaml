summary_user: 충청남도에 소재한 제조업체를 공장등록 기준으로 한 행에 한 업체씩 담은 명부로, 회사명·업종번호와 업종명·시군구 소재지·사업유형과 남녀·외국인별 종업원 수를 담는다(CSV 파일, 시군구 단위). 충남의 특정 시군구에 어떤 업종 제조업체가 모여 있는지, 업체별 고용 규모가 어느 정도인지 확인하거나 거래처·협력업체 후보를 찾는 사업자와 분석가가 쓴다. 사업자번호나 필지번호 같은 전역 조인 키가 없어 다른 공장등록·기업 데이터와는 회사명이나 업종번호(업종 분류 코드) 매핑, 시군구 이름으로만 이어 쓴다.
description_portal: 충남 제조업체 현황충남 소재한 제조업체(공장등록 기준) 데이터를 제공합니다.(회사명, 업종코드, 업종명, 소재지, 종업원 수 등)본 자료는 도내 소재 제조업체의 생산제품 홍보를 위해 제공하는 자료이며, 대외적인 공식 통계자료로 활용할 수 없습니다. 게시된 자료에 대한 문의사항은 충청남도 일자리기업지원과(041-635-2242)로 연락하여 주시기 바랍니다.* 충청남도 홈페이지 - 산업경제 - 기업통상교류 - 제조업체 현황(https://www.chungnam.go.kr/cnportal/bbs/B0000204/list.do?menuNo=500295)에서도 자료 확인 가능합니다.
