description_portal: (데이터 수집 목적 및 과정) 경상남도 하천관리 계곡선 데이터는 분야는 지역개발-수자원으로, 경상남도 하천에 대한 표고와 공간정보를 나타내며 경상남도 하천의 높이와 위치정보를 분석하고자 할 때 활용할 수 있습니다.(데이터 구성 및 세부항목) 경상남도 하천관리 계곡선 데이터는 하천관리코드, 표고, 하천공간정보로 구성되어 있습니다. 표고란 지점을 정하여 수직으로 잰 일정한 지대의 높이를 말하며, 공간정보란 하천의 공간정보를 나타냅니다. 총 49건입니다. 제공하는 데이터는 샘플데이터로 제공신청 시 데이터 전체를 제공받으실 수 있습니다.(데이터 현행화 시기) 경상남도 하천관리 계곡선 데이터는 연간데이터로 현행화는 연간 진행하며 차기 업데이트 예정일은 2025년 10월입니다.
