summary_user: 강원특별자치도 강릉시 관내 축산물판매업소를 업소 한 곳당 한 행으로 담은 파일 데이터로, 업소명·판매업 구분(식육판매업 등)·도로명 주소·전화번호를 담는다. 강릉 시민이나 식당·급식소 운영자가 '우리 동네 가까운 정육점이나 식육판매업소는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시내 축산물판매업소의 분포와 업종 구성을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소(소재지주소(도로명))를 맞춰 잇거나 주소를 좌표로 바꿔 지도에 올려 쓴다.
limits: 업소를 고유하게 식별하는 인허가번호 같은 공통 키가 없어, 다른 업소·위생 데이터와 연결할 때는 이름·주소 매칭에 의존해야 한다. 범위는 강릉시 한 곳에 한정되므로 다른 시군과 비교하려면 별도 데이터가 필요하다.
