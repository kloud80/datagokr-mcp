description_portal: '강원특별자치도 강릉시 관내 축산물판매업소의 기본 현황을 정리한 데이터로, 업소별 명칭·업종·주소·연락처 정보를 한 번에 확인할 수 있도록 구성된 자료입니다. 축산물을 취급하는 정육점·식육점 등의 분포와 기본 정보를 파악하는 데 활용됩니다.연번: 축산물판매업소를 식별하기 위한 일련번호업소명: 축산물판매업 영업을 하는 점포·매장의 공식 명칭업종: 해당 업소의 축산 관련 영업 유형(예: 식육판매업, 식육부산물판매업, 복합판매업 등)업소주소: 업소가 위치한 도로명 또는 지번 주소(방문·지도 표기 등에 활용)업소전화번호: 주문·문의·민원 상담 등을 위한 업소 대표 전화번호이 데이터는 지역 내 축산물 판매업소 분포와 영업 유형을 파악하고, 축산물 유통·위생관리, 지도 기반 업소 안내 서비스, 식당·급식소 등의 원재료 공급처 관리, 안전점검 및 민원 대응 시스템 구축 등에 활용할 수 있는 기초 공공데이터입니다.'
