summary_user: 전국 마을상수도·전용상수도 같은 소규모 수도시설의 원수를 채수한 건별 수질검사 결과로, 측정지점(주소)·취수장·채수일자마다 비소·카드뮴·납·수은·시안 등 중금속과 농약류(다이아지논·파라티온 등)·불소·붕소 검사값을 담는다. 우리 마을 소규모 취수원 원수에서 중금속이나 농약 성분이 검출됐는지 확인하려는 주민, 소규모 수도시설 관리 취약 지역을 찾으려는 지자체·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 상수도 데이터와는 수도사업자명·취수장명·측정지점주소를 이름이나 주소로 맞춰 연결한다.
description_portal: 본 데이터는 전국 160개 지자체 상수도 시설에서 채취한 원수(마을 및 전용상수도 소규모 수도시설) 수질검사 정보입니다. 대상은 지역 소규모 취수원으로 먹는 물 안전성을 확보하기 위해 정기적으로 실시된 검사 결과를 공개합니다. 본 자료는 소규모 시설 관리 취약성을 보완하기 위한 정책 수립, 안전한 음용수 공급 체계 마련, 주민 신뢰 확보에 활용됩니다.(제공정보) 검사월, 수도사업자, 취수장명, 측정지점명, 측정지점주소,  채수지점구분, 정수장명, 수원, 채수일자, 미생물, 무기물질, 유기물질, 소독제 등
team:
  dept: 디지털전환추진단
