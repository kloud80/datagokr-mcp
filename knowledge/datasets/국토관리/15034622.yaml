summary_user: 경상북도 관내에 개설 신고를 마친 건축사사무소를 한 곳씩 담은 목록으로, 사무소 상호·소재지 주소·전화번호를 개별 단위로 제공한다(CSV 약 50KB). 도민이나 건축주가 "우리 시군에서 설계를 맡길 건축사사무소가 어디 있고 연락처는 무엇인가"를 찾거나, 분석가가 경북 시군별 건축사사무소 분포를 살피는 데 쓴다. 전역 조인 키나 사무소 등록번호가 없어, 다른 데이터와는 상호 이름이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 건축사법 제23조에 의해 경상북도 내 등록된 건축사사무소에 관련한 데이터이며, 사무소 명칭과 경북 지역 내 주소 등의  항목을 제공합니다.본 데이터는 경상북도 관내에서 적법하게 신고를 마치고 운영 중인 건축사사무소의 현황을 체계적으로 정리하여 제공하는 공공데이터입니다. 건축서비스의 투명성을 제고하고 도민의 알 권리를 보장하기 위해 작성되었습니다.주요 포함 항목으로는 건축사사무소의 명칭, 사무소의 소재지 주소 및 연락처 등이 포함되어 있습니다.본 데이터는 경상북도의 건축 행정 서비스 개선과 더불어 관련 산업의 분석 및 연구를 목적으로 개방되었습니다.
