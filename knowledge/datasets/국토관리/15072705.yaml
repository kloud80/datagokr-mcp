summary_user: 대전광역시 건설관리본부가 관리·추진하는 건설사업을 사업 한 건당 한 줄로 정리한 현황 파일이다. 항목은 사업명, 위치, 사업량, 사업기간, 사업비, 담당자 연락처이며, 약 10KB 크기의 CSV로 활용신청 없이 내려받는다. 시민이나 분석가가 "우리 동네 근처에서 대전시가 진행하는 도로·시설 공사는 무엇이고, 언제까지 얼마를 들여 하는가"를 확인하거나 담당 부서에 문의할 때 쓴다. 전역 조인 키가 없어 다른 데이터와 붙이려면 사업명이나 위치 문자열로 직접 맞추거나 같은 기관(대전광역시) 자료끼리 연결해야 한다.
limits: 표준 코드나 좌표 같은 조인 키가 없어 지도 표시나 다른 데이터와의 자동 결합이 어렵고, 위치는 텍스트로만 다룬다. 시도 단위 비공간 자료라서 행정동·지번 단위 분석에는 별도 정제가 필요하다.
