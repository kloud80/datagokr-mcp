summary_user: 전국 도서(섬)를 한 건씩 담은 원천 목록으로, 섬마다 법정동코드·법정동명, 도서고유번호와 도서명, 도서 구분, 육지·다른 섬과의 연결유형, 제방·다리 수와 이름, 데이터기준일자를 담는다. 도서지역 행정·연구 담당자나 서비스 개발자가 '우리 시군의 섬 가운데 다리나 제방으로 연결되지 않은 섬은 어디인가' 같은 질문에 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 행정구역·인구·지역 통계 데이터와 이어 쓴다.
description_portal: 국토교통부 도서정보는 우리나라의 도서(섬) 지역에 대한 기본 정보를 제공하는 데이터이다. 섬의 명칭, 구분유형, 연결유형, 제방·연결다리 유무 등 섬과 관련된 주요 속성이 포함되어 있으며, 이를 통해 도서 지역의 관리 및 행정 업무, 연구, 정책 수립 등에 활용할 수 있다.이 데이터는 CSV 형식으로 제공되며, 범용 오피스 프로그램(엑셀 등)은 물론 데이터베이스, GIS 소프트웨어, 통계·분석 도구(R, Python 등)와 연계하여 손쉽게 가공·분석이 가능하다. 구조가 단순하고 호환성이 높아 대량의 도서 정보를 빠르게 처리할 수 있으며, 행정업무 지원, 도서지역 연구, 민간 서비스 개발 등 다양한 분야에서 기초자료로 활용될 수 있다.
