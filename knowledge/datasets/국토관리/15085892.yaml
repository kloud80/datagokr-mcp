summary_user: 주요 국가산업단지별 수출실적을 분기 단위로 집계한 파일로, 단지별 당분기·전분기·연간 누계 수출액(백만 달러)과 전분기 대비 증감률을 약 40개 행에 담는다. 분석가나 지역 경제 담당자가 "이번 분기 어느 국가산업단지의 수출이 전분기보다 늘거나 줄었나"처럼 단지별 제조업 수출 경기를 비교할 때 쓴다. 실측 컬럼에 산업단지코드 같은 공통 조인 키가 없어, 산업단지 원장이나 생산·고용·가동률 등 다른 산단 통계와는 산업단지 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국산업단지공단 주요국가산업단지 산업동향 통계 중 산업단지별 수출실적을 확인할 수 있는 자료입니다.한국산업단지공단에서는 주요국가산업단지 산업동향 정보를 분기별로 제공하고 있으며, 본 데이터는 산업단지별 수출실적 현황을 취합한 자료입니다.본 데이터에서 제공하고 있는 항목은 주요국가산업단지 수출실적  당분기, 전분기, 누계, 전분기 대비 증감률 입니다. 본 파일은 산업단지, 구분, 당분기(백만달러), 전분기(백만달러), 누계(백만달러), 증감률(전분기대비)(퍼센트)의 총 6개 열과 산업단지별로 나누어진 총 40개 행으로 구성되어 있습니다.
