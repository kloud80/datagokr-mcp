summary_user: 대구 서구 평리동 일대 주택재개발 정비사업(평리1~7구역)의 구역별 위치, 정비계획 규모(건립 동 수·최고층수·예상 세대 수), 추진상황, 향후 추진계획을 담은 소규모 현황 파일(csv 약 990바이트)입니다. 평리동 주민이나 부동산 실수요자가 '내 구역이 지금 사업시행인가·관리처분·철거·준공 중 어느 단계이고 몇 세대가 들어서나'를 확인하는 데 쓰고, 정비사업은 단계가 곧 가격에 반영되므로 시의성 있는 참고자료가 됩니다. 필드는 개요·위치·규모·추진상황·추진계획 같은 서술형 항목뿐이고 전역 조인 키가 없어서, 다른 데이터와는 구역명·지명을 직접 맞추거나 같은 기관(대구 서구) 자료끼리만 연결합니다.
description_portal: 대구광역시 서구 평리동의 재정비 촉진사업 추진 현황에 대한 데이터 입니다. 사업 규모와 추진상황, 추진계획 등의 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 평리동 일대에서 추진 중인 주택재개발 정비사업의 구역별 추진현황을 수록한 자료이다. 평리1구역부터 평리7구역까지의 위치, 정비계획 규모, 추진단계, 향후 계획 등을 포함하고 있다. 구역별로 건립예정 동 수, 최고층수, 예상 세대 수 등의 정보가 포함되어 있으며, 사업시행계획인가, 관리처분계획인가, 철거, 준공 등 단계별 진행상황이 구체적으로 기재되어 있다. 본 자료는 정비사업의 진행 흐름을 이해하고 도시재생 정책 수립, 주민이주 및 도시계획 업무에 활용될 수 있다. 사업의 체계적 추진을 위한 행정자료로서 지역개발 현황 및 도시환경 개선의 방향성을 파악하는 데 유용하다.
