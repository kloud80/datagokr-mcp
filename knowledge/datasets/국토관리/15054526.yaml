summary_user: 한국수자원공사가 관리하는 수변(단지) 사업지구의 토지분양 공고를 공고 한 건당 한 행으로 담은 원천 목록이며, 공고명·사업지구·공고일·접수 마감일·담당자로 구성된 약 15KB 규모의 CSV 파일이다. 토지를 사려는 사업자나 분석가가 '특정 사업지구에서 어떤 용도의 토지가 언제 분양 공고되었고 접수는 언제 마감되었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 사업지구 이름을 기준으로 수자원공사 온라인청약시스템의 판매공고나 다른 분양 자료와 이름 매칭으로만 연결한다.
description_portal: 본 데이터는 한국수자원공사가 관리하는 수변(단지) 사업지구의 토지분양 공고 현황에 대한 정보이다. 가장 최신순으로 분양공고가 진행된 내역이 나와있으며, 공고명, 사업지구, 공고일, (입찰, 추첨 등 접수)마감일, 담당자 항목으로 구성되어있다. 이용자는 과거부터 현재까지의 분양공고 내역을 통해 특정 사업의 특정 용도 및 특정 시기의 공고를 확인하고자 할 경우 본 데이터를 활용할 수 있다. 다만, 해당 데이터에서 공고문 등 세부 정보를 확인하기는 어려우므로 한국수자원공사 온라인청약시스템(land.kwater.or.kr)의 판매공고에서 세부 정보를 확인하는 것을 권장한다. 데이터는 표준화된 CSV 형식으로 제공되며, 분양정보 제공 시스템(온라인청약시스템) 등 다양한 정보서비스와의 연계활용도 가능하다.
