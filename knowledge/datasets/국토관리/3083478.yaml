summary_user: 경상북도 관내 온천을 온천 한 곳당 한 행으로 정리한 현황 파일(CSV, 약 4KB)로, 온천명과 온천공 수, 수온(섭씨), 천질(TDS), 적정 양수량(톤/일), 지구지정 일자·면적을 담는다. 관광·지역자원 담당자나 분석가가 '경북에서 수온이 높거나 하루 양수량이 많은 온천지구는 어디이고 언제 지정됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군구 단위 관광자원·시설 자료와는 온천명이나 시군구 이름을 직접 맞춰서 이어 써야 한다.
