summary_user: 인천광역시 연수구 안의 도시형 생활주택 인허가를 건별로 담은 파일로, 건마다 연도, 건축구분, 대지위치, 대지·건축·연면적, 구조, 허가일, 지상·지하 최대 층수, 주·부속용도를 기록하며 범위는 연수구 한 곳, 단위는 필지·건물이다(CSV 약 1KB로 행 수가 적다). 연수구에서 소형 주택 공급이 어느 해, 어느 위치에, 어떤 규모와 구조로 허가됐는지 살펴보려는 주민·사업자·주택정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 주소를 이름으로 맞추거나 같은 기관(연수구) 자료끼리만 연결한다.
description_portal: 연립주택은 주택으로 쓰는 1개 동의 바닥면적(2개 이상의 동을 지하주차장으로 연결하는 경우에는 각각의 동으로 본다) 합계가 660제곱미터를 초과하고, 층수가 4개 층 이하인 주택입니다.연수구 내 도시형 생활주택 인허가 현황에는 대지위치, 대지면적, 건축면적, 연면적, 구조 등의 정보를 포함하고 있습니다.소형 주거 공급 확대를 위한 주택유형으로, 도심 내 원룸형 및 연립주택, 다세대주택 중심의 주택 유형입니다.청년, 1인 가구의 수요에 맞춰 공급되지만 실제로는 임대료 상승, 주거 질 저하 등의 문제로 실질적인 주거 대안이 되지 못한다는 비판이 있습니다.
