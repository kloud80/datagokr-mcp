summary_user: 경기도 이천시의 상수도·하수도 요금 산정 기준을 구분·업종·사용 구간(단계)별 세제곱미터당 단가(원)로 담은 소형 CSV 파일(1,856바이트)이며, 건별 부과 내역이 아니라 요율표다. 시민이나 사업자가 '우리 업종이 한 달에 몇 톤을 쓰면 상하수도 요금이 얼마인가'를 계산하거나, 분석가가 시군구 간 수도 요율을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체 요금표와는 구분·업종 이름을 맞추거나 관리기관명으로만 연결한다.
description_portal: 본 데이터는 경기도 이천시의 상·하수도 요금 산정 기준 정보를 담고 있으며, 구분(상수도/하수도), 업종, 단계(사용 구간), 사용량, 세제곱미터당 요금(원), 관리기관명, 연락처, 기준일자 등으로 구성되어 있습니다. 해당 자료는 상하수도 요금이 사용량 또는 업종별로 차등 적용되는 구조를 설명하고, 단위 요금체계 및 적용 구간별 요율을 확인할 수 있도록 구성되어 있습니다. 이 데이터는 수도요금 인상 또는 감면 검토, 수용가 요금제 설계, 수도경영 효율성 평가, 시민 대상 요금 안내 등 실무 행정 및 대민 서비스를 위해 활용될 수 있으며, 민간기관은 도시기반시설 분석, 환경부담금 산정, 물가 비교 등 정책 연구에도 활용 가능합니다. 관리기관 정보 및 기준일이 포함되어 있어 최신성 판단과 기관별 요금 체계 비교에도 유리합니다.
