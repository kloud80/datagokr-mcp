summary_user: 충청남도 아산시의 일반건축물대장을 건축물 한 동씩 담은 원천 파일(CSV, 약 7.3MB)로, 법정동리·지번별 대지면적·건축면적·연면적·건폐율·용적률·구조·주용도·층수·높이·세대수·가구수·사용승인일자를 담는다. 아산시 특정 동네에서 사용승인 30년이 넘은 노후 건축물이 몇 동이고 주로 어떤 용도인지 알아보려는 도시계획 담당자·부동산 분석가가 쓴다. 전역 조인 키(건물관리번호·법정동코드 등)는 없어서, 다른 건축물·토지 데이터와는 시군구명·법정동리명·주지번·부지번을 이름과 지번으로 맞춰 이어 써야 한다.
description_portal: 충청남도 아산시 일반건축물대장으로 일반건축물대장은 「건축법」에 따라 작성·관리되는 건축물 현황 자료로, 특정 지역 내 건축물의 기본적인 특성과 세부 정보를 종합적으로 담고 있는 공공데이터이다. 아산시 일반건축물대장 데이터에는 시군구명, 법정동리, 본번, 부번, 연면적, 대지면적, 건폐율, 용적율, 사용승인일 등의 내용을 포함합니다.이를 바탕으로 건폐율과 용적률을 산출할 수 있어 건축물의 밀집도와 토지 활용도를 파악할 수 있다. 또한 건축물의 구조와 주용도, 지붕 형태, 층수, 높이, 세대수·가구수 같은 주거 현황 정보도 제공한다. 마지막으로 건축물의 최초 사용승인일자까지 포함되어 있어 건축물의 이력 관리에도 유용하다.이와 같은 데이터는 공공행정에서는 건축물 관리와 도시계획, 재난·재해 대응의 기초 자료로 쓰일 수 있고, 부동산 시장 분석이나 건축·설계 업계에서는 수요·공급 분석 자료로 활용될 수 있다. 연구 분야에서는 지역별 건축 특성 연구나 도시 발전사 연구에 기초자료로 제공될 수 있으며, 시민들에게는 자신이 거주하거나 소유한 건축물의 정보를 확인할 수 있는 서비스 자료로도 제공될 수 있다.
