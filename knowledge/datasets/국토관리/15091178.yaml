summary_user: 세종시 행정중심복합도시 생활권(1~6생활권·S생활권)별 복합커뮤니티센터를 사업 한 건당 한 행으로 담은 소규모 파일(xlsx, 약 13KB)로, 부지면적·연면적·사업비·준공일·개청일·건립 현황을 기록한다. 세종시 주민이나 도시계획 분석가가 '우리 생활권 복합커뮤니티센터는 준공됐는지, 언제 개청했는지, 다른 생활권보다 규모와 사업비가 얼마나 되는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 사업명이나 생활권 이름을 손으로 맞춰서만 이어 쓸 수 있다.
description_portal: 이 데이터는 세종시 행정중심복합도시 각 생활권(1~6생활권 및 S생활권)에 건립된 복합커뮤니티센터의 건립 현황을 제공합니다. 복합커뮤니티센터는 행정, 문화, 체육, 보육 등 다양한 공공 서비스를 한 곳에서 제공하는 시설로, 주민 편의 증진과 생활권별 균형 발전을 목표로 건립되었습니다. 데이터 항목에는 생활권, 부지면적, 연면적, 사업비, 준공일, 개청일, 건립 현황, 세부 진행 단계가 포함되어 있습니다. 이를 통해 생활권별 센터의 규모 비교, 준공 여부 확인, 공사 진행 단계 파악, 향후 건립 계획 확인이 가능합니다.특히, 생활권 단위로 건립 현황을 확인할 수 있어 시설 투자 규모, 건립 시기, 운영 개시 시점, 공사 진행 상태를 분석하고, 정책 계획 수립 및 행정 평가 자료로 활용할 수 있습니다.
