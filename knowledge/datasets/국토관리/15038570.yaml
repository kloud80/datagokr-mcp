summary_user: 한국수자원공사가 관리를 맡은 하수처리장을 시설 한 곳당 한 행으로 담은 목록 파일로, 지역본부·지사, 위탁 지자체, 소재지, 처리 공법, 시설용량(톤), 방류하천을 담는다. 분석가나 지자체 담당자가 '어느 지역에 수자원공사 관리 하수처리장이 있고, 어떤 공법과 용량으로 어느 하천에 방류하는가'를 확인할 때 쓴다. 시설코드 같은 전역 조인 키가 없으므로 다른 하수처리장 원장이나 방류수 수질(TMS) 자료와 이을 때는 처리시설명·지자체명·소재지 주소나 방류하천명으로 맞춰야 한다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·주소 매핑으로만 연결되며, 이 과정에서 표기 차이로 매칭이 어긋날 수 있다. 파일 크기가 약 1.8KB인 소규모 목록이라 수자원공사가 관리하는 시설만 담는다. 처리량·방류수 수질 같은 운영 실적 수치는 들어 있지 않다.
