description_portal: 한국토지주택공사의 입찰공고 대상 필지에 대하여 가분할면적, 확정면적, 용적률, 확정본번, 확정부번, 산지번여부, 소재지역명, 지목코드, 용지공급용도, 공급면적, 공급예정금액 등의 정보를 제공합니다. 해당 데이터에 포함된 필지는 한국토지주택공사가 경쟁입찰의 방식으로 공급하는 토지이므로 필지별 상세한 정보는 각 공고문을 확인하시기 바랍니다. 토지를 공급하는 방식으로는 경쟁입찰 외에도 추첨, 수의계약 등이 있고 공공주택특별법 시행령 제24조에 따르면 공공주택사업자는 토지 조성 목적에 따라 위와 같은 방법으로 공급하거나 임대해야 합니다.
