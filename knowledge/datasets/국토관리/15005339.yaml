summary_user: 상주시 관내 공동주택·연립주택·다세대주택을 단지 한 건당 한 행으로 담은 현황 파일로, 단지명, 지번·도로명 주소, 세대수, 동수, 층수, 준공일자, 관리사무실 연락처, 우편번호를 담는다. 상주시로 이사하거나 투자를 검토하는 사람, 지역 주택 분석가가 '상주시 어느 단지가 몇 세대 규모이고 언제 준공됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 단지명이나 도로명주소를 문자열로 맞춰 실거래가·공시가격·공동주택 관리 데이터에 이어 붙여야 한다.
limits: 표준 코드 키(단지코드·법정동코드 등)가 없어 다른 데이터와 붙일 때는 이름·주소 매칭에 기대야 하고, 표기가 다르면 잘못 이어질 수 있다. 상주시 한 시군구만 담고 좌표가 없어 지도 분석에는 주소 지오코딩이 따로 필요하다.
