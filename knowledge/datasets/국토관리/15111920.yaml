description_portal: '충청북도 증평군_공공주택 현황 데이터는증평군 관내의 공공주택 시설에 대한 위치, 규모, 용도, 관리 정보 등을 포함하고 있으며,2025년 7월 11일 기준으로 작성된 최신 자료입니다.본 데이터는 연번, 공공주택명, 도로명주소, 용도(예: 영구임대, 국민임대 등),세대수, 전용면적, 층수, 동수, 준공연도,관리실 연락처(관리실번호), 데이터기준일 항목으로 구성되어 있습니다.이를 통해 증평군 내 공공주택의 공급 현황, 입주 가능 규모, 건축 시기,생활환경 인프라 수준 등을 파악할 수 있습니다.해당 데이터는 공공주택 정책 수립, 저소득층 주거복지 분석,공공임대 주택 수급 계획, 입주자 관리,건축물 노후도에 따른 개보수 계획 수립 등에 활용됩니다.또한 GIS 기반의 주거지도 제작, 지역별 공공주택 분포 시각화,재난대응시 주거취약지대 파악 등에도 유용하게 사용됩니다.데이터는 증평군청 건축부서에서 관리하며,공공주택 준공, 관리기관 변경, 세대수 조정 등 행정 변경사항을 주기적으로 반영합니다.'
