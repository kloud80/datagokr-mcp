description_portal: 본 데이터는 경상북도 경주시에서 시행 중인 도시재생사업 대상지 내 창업 현황을 정리한 파일 형태의 공공데이터이다. 도시재생사업은 쇠퇴한 도심 지역의 기능 회복과 지역 활력을 높이기 위한 정책으로, 해당 지역 내 창업 활동은 경제 회복과 일자리 창출에 핵심적 역할을 한다. 데이터에는 사업지명, 창업자 성명, 창업일자, 업종, 주소, 지원유형 등 창업 관련 주요 항목이 포함되어 있으며, 도시재생정책의 성과 분석이나 정책 수립에 활용될 수 있다. 또한 창업 지원 행정, 상권 현황 조사, 지역 상생 사업 발굴, 학술연구 등의 목적으로도 다양하게 활용 가능하다. 본 자료는 경주시에서 정기적으로 갱신하여 최신 현황을 반영하며, 지역 경제 활성화와 창업 지원의 기반 자료로 활용되도록 제공된다.
