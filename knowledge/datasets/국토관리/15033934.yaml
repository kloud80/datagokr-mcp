summary_user: 전라남도 화순군의 도시조명시설을 읍면 단위로 집계해 가로등(메탈·LED)과 보안등(삼파장 메탈·LED)의 광원별 수량을 담은 파일 데이터로, 내려받은 CSV는 628바이트의 소규모 표다. 군 행정 담당자나 에너지 분석가가 "화순군 어느 읍면에 아직 LED로 바뀌지 않은 메탈 가로등·보안등이 많이 남아 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명·읍면명 이름 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 전라남도 화순군 관내에 설치된 도시조명시설의 현황 정보를 체계적으로 제공하는 자료이다. 주요 항목에는 가로등, 보안등, 조명시설의 종류 등 세부 정보가 포함되어 있다. 이 자료를 통해 지역 주민과 방문객은 밤길 보행 및 차량 이동 안전 확보에 필요한 공공조명 현황을 쉽게 파악할 수 있으며, 행정기관은 체계적인 시설 관리와 신속한 고장 대응, 에너지 절감 정책 수립 등 유지보수 및 관리업무에 활용할 수 있다. 또한 시설 위치 정보를 기반으로 시설물 노후화 모니터링과 안전 점검, 교통환경 개선 정책 등 다양한 행정 및 정책 연구 자료로도 활용될 수 있다. 본 데이터는 정기적으로 최신 내용으로 갱신되어 공공시설 정보의 투명성과 지역사회 안전 증진에 기여한다.
