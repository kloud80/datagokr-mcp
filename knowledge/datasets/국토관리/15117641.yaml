summary_user: 한강홍수통제소가 매년 내는 수문연보에 실리는 전국 강수량관측소의 목록을 관측소 한 곳당 한 행으로 담은 파일로, 관측소코드·관리기관·수계·한글/영문 명칭·주소·경위도·해발고·관측개시일·관측방법·폐국 여부 등이 들어 있다. 연구자나 방재 분석가가 특정 유역이나 지역에 어떤 강수량관측소가 언제부터 어떤 방식으로 운영되는지, 좌표는 어디인지 확인하는 데 쓴다. 전역 조인 키는 없고, 강수량관측소코드를 같은 체계(WAMIS 표준 관측소코드)를 쓰는 강수량 시계열 자료와 맞추거나 경위도로 행정구역·유역 공간자료에 겹쳐 쓴다.
limits: 관측소 정보만 담고 강수량 관측값 자체는 없으므로 시계열은 다른 수문 관측 자료와 코드로 연결해야 한다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 기관 자료와는 이름·코드 매핑이 필요하며, 수문연보 기준이라 연 단위로 새로 만들어진다.
