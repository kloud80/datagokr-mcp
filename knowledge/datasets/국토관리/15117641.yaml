description_portal: 한강홍수통제소에서 매년 수문연보를 발행합니다. 이 데이터는 전년도에 생성된 데이터를 기초로 하여 작성하는 수문연보에 포함될 강수량관측소 정보입니다. 해당 관측소의 코드, 관리기관, 행정주소와 한글명칭, 영문명칭 등으로 구성되어 있습니다. 강수량관측소 코드는 수위관측소 코드와 다른 구조로 되어있고 코드 내에 특정 자리의 값으로 강수량관측소를 구별할 수 있습니다. 관측소 코드의 일부 값은 해당 시설이 설치된 행정권역과 수계에 따라 부여됩니다. 관측소 영문명칭은 한글명칭의 독음을 영문자로 표기한것이며, 한글 로마자표기법을 따릅니다.
