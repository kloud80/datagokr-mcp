summary_user: 제주시 관내에 조성된 가로수를 성상·수종별로 묶어 수량을 담은 집계 파일이며, 특정 기준일 현재 기준이고 CSV 1.5KB 남짓의 작은 표입니다. 시 녹지 담당자나 분석가가 '제주시 가로수 중 어떤 수종이 몇 그루나 심겨 있나'처럼 수종 분포와 식재 규모를 확인하고 수종 갱신·병해충 방제 계획의 기초로 삼는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지자체 가로수 현황 등과는 수종 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 제주특별자치도 제주시 관내에 조성된 가로수의 현황을 수종별로 제공하는 데이터입니다. 본 데이터는 제주시에서 관리하는 가로수의 성상, 수종, 수량 정보를 포함하고 있으며, 일정 기준일 현재의 가로수 조성 현황을 파악할 수 있도록 구성되어 있습니다. 이를 통해 제주시 지역 내 가로수의 식재 규모와 수종 분포를 확인할 수 있으며, 도시경관 개선, 녹지 확충, 가로환경 정비, 수목 유지관리, 병해충 방제, 수종 갱신 계획 수립 등 가로수 관리 및 도시녹화 관련 행정업무의 기초자료로 활용할 수 있습니다. 또한 지역 내 가로수 자원의 현황을 체계적으로 파악함으로써 효율적인 녹지정책 수립과 공공서비스 제공을 지원하는 데 목적이 있습니다.
