summary_user: 서울시 생활권계획에서 공원을 뺀 교육·문화·공공청사·복지 등 생활서비스 시설을 시설 객체 하나씩 위치(좌표, GRS80)와 함께 담은 공간 데이터이며, 범위는 서울시 전체이고 행정단위는 개별 주소·좌표 수준이다. 도시계획 담당자나 분석가가 "우리 생활권에 어떤 종류의 생활시설이 얼마나 있고 무엇이 부족한가"를 따져 시설 입지를 검토할 때 쓴다. 필드에는 시설 식별값(ID)·도시계획코드·분류명·라벨명이 있으나 다른 데이터와 맞물리는 전역 조인 키는 실측에서 확인되지 않아, 분류명·시설 이름 매핑이나 좌표 기반 공간 중첩으로 행정구역·인구 자료와 이어 쓴다.
limits: 공원은 포함하지 않으므로 공원녹지 분석에는 별도 데이터가 필요하다. 원본은 외부 사이트(data.seoul.go.kr)에서 받으며, 포털 활용신청과 별개로 서울 열린데이터광장 인증키가 필요하다. 전역 조인 키가 없어 다른 데이터와의 연결은 이름·코드 매핑이나 공간 결합에 의존한다.
