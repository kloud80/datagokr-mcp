summary_user: 의왕시 관내 주요 도로 구간에 심긴 가로수를 한 그루씩 기록한 공간정보 파일로, 식재일자·수령·직경·수종코드와 수목보호판·지지대·받침틀 설치 여부, 위도·경도를 담는다. 시민이나 도시계획 분석가가 '의왕시 어느 도로 구간에 가로수가 얼마나 촘촘히, 어떤 상태로 심겨 있는가'를 보행안전지수 지도와 함께 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 위도·경도 좌표나 도로구간번호·행정동읍면코드 같은 기관 내부 코드를 이름·코드 매핑해 맞춰 붙여야 한다.
description_portal: 이 데이터는 의왕시 보행안전지수 시각화 자료에 활용하기 위한 관내 주요 도로 구간에 식재된 가로수 현황을 기록한 공간정보 자료입니다. 공간지리식별번호, 지형지물부호, 도로구간번호와 함께 가로수의 식재일자, 수령(나이), 직경, 수목 보호판 및 지지대 설치 여부, 밭침틀 사용 여부, 위도와 경도 등의 정보를 포함하고 있습니다. 이 데이터는 보행안전지수 지도 시각화에 활용되어 도시 내 가로수 분포와 보행환경 개선 효과를 분석하는 데 기초 자료로 쓰입니다. 자료는 2022년 기준 자료로 최신 정보와 차이가 있을 수 있으므로 참고용으로 활용하는 것이 적합합니다.
