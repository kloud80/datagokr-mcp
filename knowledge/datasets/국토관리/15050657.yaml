summary_user: 전라남도(전남광주통합특별시) 내 등록된 일반측량업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·대표자명·사무소주소·사무소전화번호가 들어 있다. 토지 경계 측량이나 드론·GPS 측량을 맡길 지역 업체를 찾는 시민·사업자, 또는 시군별 측량업체 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 사무소주소를 이름·주소 매칭해 이어 쓴다.
description_portal: '- 전라남도 내 일반측량업체의 업종, 업체명, 사무소주소, 대표자 등에 관한 데이터를 조회할 수 있는 공공데이터입니다.- "일반측량업체"는 지형, 지적, 수로, 항공, 공간정보 등을 측량하는 전문 업체로, 국내에서는 「측량·수로조사 및 지적에 관한 법률」에 따라 등록이 필요합니다. 일반적으로 다음과 같은 업무를 수행합니다.- 일반측량업체의 주요 업무- 지형측량 – 지형도 작성, 토지 고저 차이, 지표면 형태 측정 등- 지적측량 – 토지 경계 확정, 분할, 등록 등을 위한 측량- 건설측량 – 도로, 교량, 터널, 건축물 등을 위한 정밀측량- 수로측량 – 하천, 해안, 항만 등 수로 및 수심 측정- GPS 측량 – 위성신호를 활용한 정밀 측위- 3D 스캔 및 드론측량 – 최신 기술을 이용한 고해상도 데이터 수집- 공간정보 구축 – GIS(지리정보시스템) 관련 데이터 구축 및 관리'
