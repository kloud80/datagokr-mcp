summary_user: 국토교통부 장관이 조사·평가해 공시한 전국 표준지의 단위면적당 가격(원/㎡)을 필지 단위로 담은 원천 데이터로, vworld에서 시도별 SHP 파일로 내려받는다. 감정평가사·부동산 분석가·연구자가 '우리 동네 표준지의 ㎡당 공시가격은 얼마이고 주변 필지와 비교하면 어떤가'를 GIS로 시각화·비교하는 데 쓴다. 실측 컬럼(A0~A28처럼 이름만 있는 필드)에서 전역 조인 키를 찾지 못해 다른 데이터와는 행정구역 이름·코드 매핑이나 같은 기관(국토교통부) 코드로만 이어 쓴다.
description_portal: 국토교통부 표준지공시지가정보는 「부동산 가격공시에 관한 법률」에 따라 국토교통부 장관이 조사·평가하여 공시한 표준지의 단위면적당 가격 정보를 제공하는 데이터이다. 매년 1월 1일을 기준으로 산정되며, 전국 표준지의 가격 현황을 단위면적(원/㎡) 기준으로 확인할 수 있다. 표준지공시지가는 개별공시지가 산정의 기준 자료로 활용될 뿐 아니라 부동산 과세, 보상, 금융, 개발행위 허가 등 다양한 분야에서 기초 자료로 사용된다.이 데이터는 SHP(Shapefile)와 CSV 형식으로 제공된다. SHP 형식은 공간좌표와 속성정보를 함께 포함하고 있어 GIS 소프트웨어(ArcGIS, QGIS 등)에서 직접 시각화·분석할 수 있다. CSV 형식은 엑셀, 데이터베이스, R·Python 등 범용 통계·분석 도구에서 손쉽게 가공·처리할 수 있으며, 행정업무와 연구뿐만 아니라 민간 서비스 개발에도 활용도가 높다. 두 가지 형식이 모두 지원되므로 공간분석 기반의 활용부터 일반 통계분석까지 목적에 따라 유연하게 적용할 수 있다.
