summary_user: 경기도에서 공연장·학원·예식장·실내체육시설 등 정해진 유형에 속하지 않아 '기타'로 분류된 공중이용시설을 사업장 한 곳당 한 행으로 담는다. 각 행에는 시군, 사업장명, 인허가·폐업일자, 영업상태, 위생업종·업태, 주소와 위경도가 들어 있다. 보건·위생 담당자나 분석가가 "우리 시군에서 영업 중인 기타 공중이용시설은 어디에 몇 곳 있나"를 확인하거나 위생점검 대상을 추가로 검토할 때 쓴다. 전역 조인 키는 없으므로 다른 공중이용시설·인허가 데이터와는 시군 코드·이름(SIGUN_CD), 주소, 좌표를 맞춰 잇는다.
description_portal: 경기도 내 공중이용시설 현황(공중이용시설 기타)입니다. 공중의 이용으로 인해 건강 및 공중위생에 영향을 미칠 수 있는 건축물 중 공연장, 학원, 상점가, 혼인예식장, 실내체육시설 등에 속하지 않는 이용시설의 정보를 제공합니다.이 데이터는 경기도 내에서 ‘기타’로 분류된 공중이용시설의 인허가 및 운영 현황을 정리한 자료로, 상업시설, 복합쇼핑몰, 대형 건물 등 대중이 빈번하게 이용하지만 특정 용도로 명확히 구분되지 않는 시설들에 대한 정보를 포함하고 있습니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 건물소유구분, 위생업종 및 위생업태명, 도로명주소 및 지번주소, 우편번호, 위도·경도 좌표(WGS84) 등으로 구성되어 있으며, 일부 데이터는 누락되어 있어 가공 및 보완이 필요합니다.해당 시설들은 「공중위생관리법」상 공중의 이용으로 인해 위생 상태가 건강에 영향을 줄 수 있다고 판단되는 장소로, 예를 들어 백화점, 대형마트, 쇼핑센터, 상업용 복합건물 등이 이에 포함됩니다. 이들은 일반적인 위생점검 대상은 아니지만, 불특정 다수의 밀집 및 장시간 체류 가능성이 있어 실내환경 안전관리의 측면에서 중요합니다.본 데이터는 위생 점검 대상 추가 검토, 지역 내 대형 공공시설 현황 분석, 다중이용시설 위생등급 지정 기초자료, 도시 공간계획 수립, 감염병 확산 예방 정책 수립 등에 활용될 수 있으며, 경기도 및 각 시군 보건·위생 관련 부서에서 수집한 공공데이터입니다.
