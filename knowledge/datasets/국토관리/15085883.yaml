summary_user: 신규로 지정된 산업단지를 단지 한 곳당 한 행으로, 유형·시도·시군구·단지명과 지정면적·산업용지 면적(천㎡), 지정일자를 담은 전국 범위 파일입니다(파일 크기 269바이트로 건수가 매우 적음). 기업이 어느 지역에 새 산업단지가 생겼는지 보고 입지 후보를 찾거나, 지자체·분석가가 최근 시도별 신규 지정 면적을 비교할 때 쓴다. 전역 조인 키(산업단지코드 등)가 없어 시도·시군구 이름이나 단지명으로 매칭해 산업단지 현황 원장이나 산단 통계와 이어 붙여야 한다.
limits: 단지를 식별하는 공통 코드가 없어 다른 산단 데이터와는 이름 매칭으로만 연결되며 표기 차이에 주의해야 한다. 해당 시점의 신규 지정 건만 담은 작은 파일이라 누적 현황이나 해제 이력은 별도 현황 통계를 봐야 한다.
