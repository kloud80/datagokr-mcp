description_portal: 신규로 지정된 산업단지 현황을 알려주는 데이터입니다.  해당 데이터에서는 신규지정 산업단지의 유형, 시도, 시군구, 단지명 뿐만 아니라 지정면적(천㎡), 산업용지(천㎡), 지정일자를 알 수 있습니다. 이 정보는 기업의 시설 입지 계획, 지방자치단체의 유치 전략, 산업정책 수립 자료로 널리 활용됩니다. 또한, 전체 산업단지 현황 통계 데이터(시도별, 유형별, 해제 현황 등)와 함께 제공되어, 종합적인 분석이 가능합니다. 매달 신규로 지정, 해제되는 산업단지는 산업입지정보센터의 통계자료실에서 참고 할 수 있습니다.
