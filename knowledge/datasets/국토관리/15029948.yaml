summary_user: 울산광역시 관내 토석채취 허가를 허가 건별로 담은 파일로, 업체명·허가지 주소·허가면적(㎡)·허가수량(㎥)·허가권자·허가 시작일과 종료일을 기록하며 파일 크기가 321바이트로 건수는 적다. 건설업체나 지역 주민이 '울산에서 지금 허가 기간 중인 토석채취장은 어디이고 얼마나 채취하도록 허가됐나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 허가지 주소나 업체명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 관내 토석 채취 허가 현황 정보이다. 허가별 채취 위치, 면적, 채취량, 채취 기간, 허가 일자, 허가 업체 등의 세부 내용을 포함한다. 토석 채취는 건설 공사 등에 필요한 골재 자원을 확보하기 위해 산지 또는 하천에서 토사 및 암석을 채취하는 행위이다. 해당 자료는 골재 수급 관리 정책 수립, 토석 채취 허가 관리, 국토 자원 보전에 활용된다. 허가 현황 분석을 통해 무분별한 채취로 인한 환경 훼손을 예방하고 체계적인 자원 관리를 도모한다. 또한 불법 채취 단속 및 허가 기준 준수 여부 점검 자료로 활용되어 산지 및 하천 환경 보호에 기여한다. 건설 업체가 합법적으로 골재를 확보할 수 있도록 허가 정보를 제공한다. 본 정보는 정기적으로 업데이트된다.
