description_portal: 한국수자원공사에서 운영관리하는 홍수조절용 댐 제원정보 입니다.* (홍수조절용댐이란?) 하천의 홍수를 방지하기 위해 건설된 구조물로, 주로 집중호우 시 유입되는 물을 저류해 하류로 서서히 방류. 이를 통해 하천 범람과 침수 피해를 최소화하는 것이 핵심 기능입니다.법률상 높이 15m 이상의 댐으로 정의되며, 단일목적(홍수조절 전용) 또는 다목적댐의 일부로 운영. 홍수기에는 수위를 낮춰 "홍수조절용량"을 확보하고, 평상시 물을 흘려보내 생태계를 유지합니다.대표 예시로 군남댐, 담양홍수조절지, 화순홍수조절지, 평화의댐, 한탄강 등이 있으며, 소양강댐·충주댐 등 다목적댐도 홍수조절 역할 함.
