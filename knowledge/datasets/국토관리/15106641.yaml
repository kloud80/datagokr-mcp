summary_user: 인천도시공사가 맺은 수의계약을 계약 건별로 담은 파일(csv, 약 23KB)로, 구분·계약명·계약일자·계약상대자·계약업체 소재지·집행금액·법적근거가 들어 있다. 연구자나 시민이 '인천도시공사가 어떤 업체와 어떤 법적 근거로 얼마짜리 수의계약을 맺었나'를 확인하거나 공공조달 수의계약 운영을 분석하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 공통 조인 키가 없어, 계약상대자 이름이나 업체 소재지 주소를 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
