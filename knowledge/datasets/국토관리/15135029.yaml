summary_user: 광주광역시 관내에서 1997년 이전에 사용승인을 받아 준공 후 30년 이상 지난 공동주택(아파트·연립·다세대)을 단지 한 건씩 담은 파일로, 아파트명·구·동·주소·세대수·층수·동수·준공년도를 담는다(약 33KB CSV). 재건축·리모델링 대상 지역을 살피는 분석가나 주민이 '우리 구에 준공 30년이 넘은 단지가 몇 곳이고 세대 규모는 얼마인가' 같은 질문에 쓴다. 전역 조인 키(K-apt 단지코드 등)가 없어 실거래·공시가격·K-apt 관리 데이터와는 아파트명과 주소 문자열을 맞춰 이어야 한다.
