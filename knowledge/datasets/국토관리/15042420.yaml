summary_user: 경기도 안양시 공간정보시스템에서 관리하는 가로수를 한 그루씩 고유 관리번호 단위로 담은 건별 원천 파일로, 수목 직경·식재일자·관할지역을 담는다(CSV 약 725KB, 활용신청 없이 내려받음). 안양시 녹지 담당자나 도시 분석가가 '어느 관할지역에 가로수가 얼마나 심겨 있고, 언제 심은 나무가 많으며 직경 분포는 어떤가'를 확인해 노후 수목 교체나 녹화 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 관할지역 이름을 매핑하거나 같은 안양시 기관 데이터끼리 연결해야 한다.
description_portal: 본 데이터는 경기도 안양시 관내 가로수의 현황을 관리하기 위한 목적으로 구축된 자료로서, 각 가로수에 부여된 고유 관리번호를 기준으로 수목의 직경, 식재일자, 관할 행정구역 등의 정보를 포함하고 있습니다. 수록된 정보는 도시 경관 개선, 미세먼지 저감, 도시열섬 완화 등 도시녹화 정책 수립에 필요한 기초자료로 활용될 수 있으며, 관할지역별 수목 분포 및 생육 특성 분석에 기여할 수 있습니다.해당 데이터는 안양시 공간정보시스템을 기반으로 수집·정리되었으며, 시스템의 상황에 따라 데이터 업데이트가 이루어지지 않을 수 있습니다.
