summary_user: 대구광역시 서구의 행정구역별 토지 지목 현황을 소재지 코드, 토지 소재지, 토지 구분(지목), 지목별 면적, 지번 수로 담은 시군구 단위 집계 자료이며, 검증 시 API 전체 건수는 1건이었다. 서구 안에서 대지·도로·임야 같은 지목별 토지 면적과 필지 수가 어떻게 분포하는지 확인하려는 도시계획 담당자나 지역 분석가가 쓴다. 토지 소재지(LAD_LOCPLC)를 주소 키로 삼아 같은 지역의 지적·공시지가·건축물대장 등 국토 정보 자료와 이어 쓴다.
description_portal: 입력 파라미터를 이용하여 대구광역시 서구_행정구역별 지목 현황의 소재지 코드, 토지 소재지, 토지 구분, 면적, 지번 수 항목을 제공하는 서비스본 데이터는 대구광역시 서구청에서 제공하는 행정구역별 토지 지목 현황 자료이다. 각 토지의 소재지 코드와 위치 정보, 토지 구분, 지목별 면적, 그리고 해당 지번 수를 포함하여 체계적으로 관리된다. 이를 통해 각 지역 내 토지의 용도별 분포와 면적 규모를 한눈에 파악할 수 있으며, 토지 관리 및 도시계획 수립 시 중요한 기초 자료로 활용된다. 해당 자료는 공공 행정의 효율성을 높이고, 토지 관련 정책 결정 및 주민의 이해 증진을 목적으로 개방된다. 더불어, 지목별 면적 현황 분석을 통해 지역 개발 및 환경 관리에도 기여할 수 있다.
