description_portal: 충청북도 제천시의 도시계획 정보시스템(UPIS) 관리지역 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 현황도형관리번호, 라벨명, 면적도형, 길이도형, 시군구코드, 현황도형생성일시 등의 정보를 제공합니다. 이 자료를 통해 공간 정보 관리 번호에 해당하는 현황 도형 관리 번호가 무엇인지 확인할 수 있습니다. 또한 현황 도형 관리 번호에 해당하는 라벨 명도 확인할 수 있습니다. 그리고 이 자료는 2024년 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2025년 11월 26일입니다.해당 데이터의 담당부서는 충청부도 제천시의 도시디자인과입니다.
