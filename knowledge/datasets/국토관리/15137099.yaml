summary_user: 충청북도 제천시 도시계획정보시스템(UPIS)의 관리지역 현황을 도형 단위로 담은 파일로, 도형별 관리번호·라벨명·면적·길이·생성일시와 시군구코드를 시군구 범위로 제공한다. 토지 투자자나 인허가 담당자가 제천시 안에서 관리지역(계획·생산·보전관리지역 등)으로 지정된 구역이 어디이고 면적이 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 시군구코드나 같은 기관의 다른 UPIS 현황(용도지역·지구 등)과 라벨명·관리번호로 맞춰 이어 쓴다.
limits: 전역 조인 키가 없어 필지(PNU) 단위 토지정보와 바로 연결할 수 없고, 이름·코드 매핑으로만 다른 데이터와 붙는다. 범위가 제천시 한 시군구에 한정된다.
