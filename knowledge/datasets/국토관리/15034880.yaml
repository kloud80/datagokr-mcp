summary_user: 경기도 김포시의 상수도 요금표를 업종(가정·일반·대중목욕탕 등)과 사용량 구간(톤)별로 담은 집계성 요율 파일로, 톤당 상수도단가·하수도단가·물이용부담금을 함께 담는다(csv 851바이트 규모의 작은 표). 김포시 주민이나 사업자가 '우리 업종에서 한 달에 몇 톤을 쓰면 수도요금이 얼마인가'를 계산하거나, 분석가가 지자체 간 수도요금 단가를 비교할 때 쓴다. 전역 조인 키가 없어 다른 지자체 상수도요금 파일과는 업종명·구간을 이름으로 맞춰 이어 쓰고, 같은 기관(관리기관명) 기준으로만 연결한다.
description_portal: 경기도 김포시의 상수도 요금에 대한 정보를 제공합니다. 제공 항목으로는 업종별, 단계별(톤), 상수도단가(톤), 하수도단가(톤), 물이용부담금(톤), 관리기관명, 데이터기준일자로 구성되어있습니다. 본 공공데이터를 통해 가정, 일반, 대중목욕탕별 수도 사용 구간에 따른 수도세 정보를 확인할 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 수도과로 연락주시기 바랍니다.
