description_portal: 본 공공데이터는 인천광역시 서구 관내에 존재하는 다양한 사물시설에 부여된 주소정보 현황을 담고 있습니다. 사물주소란 일반 건축물 외 다양한 공공시설물에 고유 주소를 부여하는 제도입니다. 본 자료는 육교 승강기, 지진 옥외대피장소, 버스정류장, 택시승강장, 소공원 등 주요 생활 기반 시설에 대한 등록 수와 유형별 현황이 포함되어 있습니다. 본 자료를 통해 주소체계 고도화, 위치 기반 공공서비스 구축 등 다양한 행정적 자료로 활용할 수 있을것으로 판단됩니다. 본 데이터는 연마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
