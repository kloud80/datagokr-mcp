summary_user: 서울특별시 주택 인허가 대상 부지별로 위치(대지위치, 시군구·법정동명, 본번·부번 지번, 블록·로트 번호)와 그 부지에 지정된 용도지역·지구·구역의 구분과 이름, 대표 지역지구 여부를 담은 건별 목록이다. 사업자나 분석가가 '이 주택 인허가 부지가 어떤 용도지역·지구에 걸쳐 있는가'를 확인하거나 인허가 부지의 용도지역 분포를 볼 때 쓴다. 전역 조인 키나 행정코드 컬럼이 없어, 다른 데이터와는 시군구명·법정동명·지번 같은 이름과 번호를 맞춰 연결하거나 같은 기관의 주택인허가 계열 데이터와 인허가 일련번호(HSRG_SN)로 맞춰 보는 방식으로만 이어 쓴다.
