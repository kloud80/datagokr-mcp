description_portal: 이 데이터는 전북특별자치도 내 용담호로 유입되는 하천의 수질 상태를 파악하기 위해 수행된 수질 조사 결과입니다. 장수천, 장계천, 계북천, 구량천, 정자천, 주자천 등 총 6개 하천을 대상으로 2021년 4월 9일에 채수된 수질 항목을 포함하고 있습니다. 측정 항목에는 수온(℃), 수소이온농도(pH), 용존산소(DO), 전기전도도(EC), 생화학적 산소요구량(BOD), 화학적 산소요구량(COD), 총유기탄소(TOC), 총질소(T-N), 총인(T-P), 부유물질(SS)이 포함되며, 수질 오염도 및 생태계 영향을 종합적으로 진단할 수 있는 정보를 제공합니다. 환경정책 수립 및 수질 관리 방안 수립에 활용 가능합니다.
