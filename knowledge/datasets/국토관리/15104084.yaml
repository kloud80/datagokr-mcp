summary_user: 대전광역시 서구에 지정된 소공원을 공원 한 곳당 한 행으로 담은 파일로, 공원명(도면번호)·지번주소·면적(제곱미터)·최초결정일과 고시번호·조성계획결정일과 고시번호·비고(조성 여부 등)를 기록한다. 서구 주민이나 도시계획 분석가가 '도마동·변동 일대에 아직 조성되지 않은 소공원이 어디에 얼마나 남아 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 지번주소로 주소·좌표 데이터에 맞추거나 공원명·고시번호를 다른 도시공원 현황 자료와 이름으로 대조해 이어 쓴다.
description_portal: 대전광역시 서구 일대에는 여러 소공원이 조성되어 있거나 계획 중에 있으며, 이들은 주로 도마동, 변동, 도안동, 산직동, 용촌동 등지에 위치하고 있다. 소공원은 도심 속에서 주민들이 휴식과 산책을 즐길 수 있는 작은 녹지 공간으로, 면적은 약 500㎡에서 7,500㎡ 이상까지 다양하다.특히 도마동과 변동 지역에 소공원이 밀집되어 있는데, 이곳에는 ‘버들’, ‘도마,변동 9구역’, ‘도마,변동 11구역’ 등 여러 소공원이 위치해 있으며, 아직 조성되지 않은 ‘미조성’ 상태의 공원도 다수 존재한다. 이는 앞으로도 이 지역의 녹지 공간 확충과 환경 개선이 계속될 가능성을 시사한다.반면 ‘도솔마을’, ‘아름드리’, ‘도안숲’ 같은 소공원은 이미 조성이 완료되어 주민들에게 쾌적한 휴식 공간을 제공하고 있다. 특히 ‘아름드리’ 공원은 약 7,500㎡의 비교적 넓은 면적으로 도안동 일대의 대표적인 녹지 공간 역할을 하고 있다.이들 소공원은 지정일과 관리번호 등 행정적으로도 체계적으로 관리되고 있으며, 각각의 위치와 면적에 따라 지역 주민들의 생활 환경 개선에 기여하고 있다. 면적이 넓은 공원은 산책로나 휴식 공간이 잘 마련되어 있어 가족 단위 방문객이나 운동을 즐기는 주민들에게 인기가 높으며, 작은 규모의 소공원은 주로 동네 산책이나 잠깐의 휴식을 위한 공간으로 활용되고 있다.또한 일부 소공원은 아직 조성 전 상태로 남아있어, 앞으로의 조성 계획과 환경 개선 사업이 더욱 기대되는 상황이다. 대전 서구의 소공원들은 도심 내 자연 친화적 공간을 확대하고 주민들의 삶의 질을 높이기 위한 중요한 역할을 수행하고 있으며, 앞으로도 지속적인 관리와 보완이 필요한 지역 자산이다.
