summary_user: 경기도 안에서 객석 1천석 이상 공연장으로 인허가된 공중이용시설을 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·소재지 면적·도로명/지번 주소·위경도를 포함한다. 분석가나 시군 위생·문화 담당자가 '우리 시군에 지금 영업 중인 대형 공연장은 어디에 있고 언제 인허가됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)로 같은 경기도 데이터와 묶거나, 주소·좌표로 다른 공간 데이터와 맞춰 쓴다.
description_portal: 경기도 내 공중이용시설(공연장) 인허가 현황입니다. 공중이용시설(공연장)은 공중의 이용으로 인해 건강 및 공중위생에 영향을 미칠 수 있는 객석수 1천석이상의 공연장입니다.이 데이터는 경기도 내 공중이용시설 중 ‘공연장’으로 인허가된 시설들의 현황을 정리한 자료로, 객석 수 1,000석 이상의 대형 공연장 시설을 포함하여, 공연예술 활동을 위한 공공 문화공간의 위생 및 운영 상태를 확인할 수 있는 공공데이터입니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태, 위생업종명, 위생업태명, 도로명 및 지번 주소, 우편번호, 위도·경도(WGS84) 등으로 구성되어 있으며, ‘공중이용시설’로 분류되어 「공중위생관리법」 및 「실내공기질관리법」 등 관련 법령의 적용을 받습니다.이 데이터는 공연장이 공중위생에 미치는 영향을 관리하고, 다중이용시설로서의 안전성과 청결성을 유지하기 위해 수집되며, 공연장 분포 분석, 위생 관리 대상 파악, 문화시설 인프라 평가, 지역별 문화 접근성 분석 등의 목적으로 활용됩니다. 특히 위경도 정보는 GIS 기반 시각화를 통해 공연장 접근성 및 지역 문화 인프라 격차 해소 정책 수립에 유용합니다. 본 자료는 경기도 및 시군 위생 부서, 문화예술 행정기관 등에서 수집한 공공데이터입니다.
