summary_user: 경주시 관내 토석채취 허가를 허가지별로 한 줄씩 담은 건별 파일로, 수허가자·허가지 주소·채취 용도·허가면적(제곱미터)·허가 시작일과 종료일을 담는다(CSV 425바이트 규모). 경주에서 어느 곳이 어떤 용도로 언제까지 토석채취 허가를 받았는지 확인하려는 주민이나, 허가 만료 시점과 면적을 점검하는 자원·환경 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 허가지 주소나 같은 기관(경주시) 기준으로만 맞춰 이어 쓴다.
description_portal: 경상북도 경주시에서 제공하는 토석채취허가 현황 데이터는 관내 토석 자원의 채취 허가 정보를 정리한 파일데이터이다. 수허가자, 연락처, 허가지 주소, 채취 용도, 허가면적, 허가기간 등의 항목으로 구성되어 있으며, 토목 공사나 골재 생산 등과 관련한 채취 활동의 행정 이력을 확인할 수 있다. 본 자료는 허가지별 위치와 허가 기간 등의 정보를 포함하고 있어 자원관리, 환경영향 평가, 도시계획 수립 등의 기초자료로 활용 가능하다. 특히 허가 시작일과 종료일 항목을 통해 채취 기간을 파악할 수 있어 연장 심사나 관리 기준 마련에도 도움이 된다. 데이터는 표 형식으로 제공되며, 정기적으로 갱신되어 최신 허가 현황을 반영한다.
