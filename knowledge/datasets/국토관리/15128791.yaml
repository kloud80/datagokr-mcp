summary_user: 충청남도 논산시에 설치된 가로등을 한 개씩 담은 CSV 파일(약 806KB)로, 행정구역·가로등 위치명·소재지 지번주소·설치형태를 기록한다. 주민이나 지자체 담당자가 "우리 동네 어느 길에 가로등이 어떤 형태로 설치돼 있는가"를 확인하거나, 분석가가 읍면동별 가로등 분포를 비교해 야간 보행 안전 취약 구간을 찾는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 행정구역 이름이나 지번주소를 기준으로 매칭해 이어 쓴다.
description_portal: 가로등(街路燈, street light)은 매일 밤 특정한 시간대에 어두운 도로나 보도 같은 길에서 운전자나 보행자의 시야 확보를 통한 사고 및 범죄 예방을 위해 도로 가장자리에 높게 설치하는 등을 말한다. 현대의 가로등은 빛에 민감한 광전지를 이용하여 어둑해 질 무렵 자동으로 점등되고 새벽에 소등되며, 흐린 날씨에도 작동한다.가로등은 보행자의 차량 충돌 위험을 크게 줄여주고 교차로에서의 사고를 방지하는 등의 장점이 있으나 누전으로 인한 잠재적 사고 위험과 빛공해(Light Pollution)를 일으킨다. 누전으로 인한 사고 위험을 줄이기 위해 몇몇 도시에서는 누전 경고등과 보호 커버를 장착하기도 한다..충청남도 논산시 가로등에 대한 데이터로  행정구역,  위치명,  소재지지번주소,  설치형태 정보를 제공하고 있습니다.
