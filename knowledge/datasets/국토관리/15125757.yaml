summary_user: 서울시 도로굴착을 관리하는 구역의 경계를 담은 공간정보(경계 도형) 파일로, 좌표계는 EPSG:5186이며 자치구 코드와 자치구명(SGG_NM) 속성이 붙어 있다. 도로굴착 공사를 계획하는 사업자나 분석가가 특정 지점이 어느 굴착 관리구에 속하는지 확인할 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 자치구 코드·자치구명으로 같은 기관의 다른 서울시 자료와 이름·코드를 맞춰 연결한다.
description_portal: 서울시 도로굴착관리구경계 공간정보 입니다.[좌표계] EPSG:5186 (GRS80 타원체의 한국 중부원점이며 Y 축으로 600000미터만큼 이동시킨 좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 재난안전실 도로기획관 도로관리과(02-2133-8187) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
