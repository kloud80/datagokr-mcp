summary_user: 부산광역시 영도구에 등록된 공장을 한 곳씩 나열한 공장등록현황 파일(CSV)로, 회사명·공장 주소(도로명·지번)·업종명·생산품·종업원수·외국인 종업원 수(남·여)·전화·팩스를 담는다. 영도구에서 창업이나 거래처 발굴을 준비하는 사업자나 지역 산업 구조를 보는 분석가가 '영도구에 어떤 업종의 제조공장이 어디에 몇 명 규모로 있는가'를 확인하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 주소 문자열을 맞추는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 팩토리온 공장등록 정보나 기업·토지 데이터와 정확히 연결하기 어렵고, 이름·주소로 맞출 때 오매칭에 주의해야 한다. 범위는 영도구 한 곳뿐이므로 부산 전체나 다른 구와 비교하려면 각 구의 파일을 따로 모아야 한다.
