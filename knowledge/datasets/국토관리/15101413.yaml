description_portal: '한국토지주택공사  도시재생지구 건축공사 지급자재 옥외기계의 2017년 3월 기준 발주일정에 대한 자료로, 지구명, 사업유형, 면적, 건설호수, 발주일정 등의 정보를 제공합니다.지급자재 : 한국토지주택공사가 직접 구매하여 시공사에 제공하는 자재를 의미합니다. 비슷한 용어로는 관급자재, 도급자재가 있습니다.옥외기계 : 주로 건물 외부에 설치되는 기계 장비를 의미합니다.정비사업 :  도시 기능을 회복하거나 주거 환경을 개선하기 위해 노후・불량 건축물을 개량 또는 신축하고 정비 기반 시설을 정비하는 사업비고 : 비고란을 통해 사업방식 변경, 소송사항 등에 대한 세부정보를 알 수 있습니다.'
