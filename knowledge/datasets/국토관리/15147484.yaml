summary_user: 국토계획법에 따른 도시계획정보 중 차량출입불허구간 현황을 지방자치단체가 구축하고 국토교통부가 취합한 전국 범위 자료로, 브이월드(vworld.kr)에서 시도별 XLSX 파일로 받는다. 부동산·개발 사업자나 도시계획 분석가가 특정 지역 도로변 부지에 차량 출입이 제한되는 구간이 결정·고시돼 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 용도지역·지구 현황 자료와는 지역 이름·코드 매핑으로만 이어 쓴다.
limits: 브이월드 로그인 후 내려받는 파일이며 공공데이터포털 활용신청이나 인증키로는 받을 수 없다. 공통 조인 키가 없어 필지·행정구역 단위 결합은 이름 매칭에 의존해야 한다. 명세상 갱신은 수시·이벤트성이라 정기 갱신 시점을 기대하기 어렵다.
