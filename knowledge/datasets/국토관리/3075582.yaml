summary_user: 부산 해운대구 소재 20세대 이상 공동주택을 단지 한 건씩 담은 파일로, 단지명·면적대별 세대수(40㎡ 이하부터 135㎡ 초과까지)·층수·동수·총세대수·사용검사일과 의무관리대상 여부(구분)를 담는다. 해운대구에서 특정 규모대 아파트가 어느 단지에 몰려 있는지, 준공 시기별로 노후 단지가 얼마나 되는지 살펴보려는 주민·중개업자·주택정책 분석가가 쓴다. 실측 컬럼에 법정동코드나 단지코드 같은 전역 조인 키가 없어, 공동주택 관리정보나 실거래 자료와는 단지명·주소를 맞춰 이어 써야 한다.
description_portal: '부산광역시 해운대구 소재 공동주택에 대한 현황입니다20세대 이상 공동주택 중 공동주택관리법의 규모에 따라 의무관리대상과 비의무관리대상으로 구분하였으며,의무관리대상은 공동주택관리법, 비의무관리대상은 집합건물의 관리 및 소유에 관한 법률(일부 제외)을 적용받습니다공동주택의 규모, 단지명, 세대수, 주소 등에 대한 정보를 포함하고있으니 참고하시기바랍니다.참고: 오피스텔, 생활형숙박시설, 20세대 미만 주택, 레지던스 등 공동주택에 해당하지않는 주택유형은 포함하지 않습니다'
