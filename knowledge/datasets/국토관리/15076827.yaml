summary_user: 대구광역시 동구에 있는 오피스텔을 건물 한 동씩 담은 목록으로, 건물명·도로명주소·지번주소·세대수·준공년월이 들어 있으며 파일 크기는 약 2.9KB입니다. 동구에서 오피스텔을 찾는 1인 가구나 임대 사업자가 '동구 어느 지역에 몇 세대 규모의 오피스텔이 언제 지어졌나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(도로명·지번)나 건물명을 맞춰 연결해야 하며, 실거래가·건축물대장 같은 자료와 이어 쓸 때도 주소 매칭이 필요하다.
