summary_user: 전국·시도 단위 수도사업자별로 행정구역 면적, 급수지역 수, 급수·미급수 동읍면 수, 전체 동읍면 수, 동읍면 단위 보급률을 연도별로 정리한 집계 현황표로, 909바이트 크기의 작은 CSV 파일이다. 지자체·연구기관 분석가가 "우리 지역은 동읍면 중 몇 곳이 아직 상수도 미급수 상태이고 보급률이 전국 대비 어느 수준인가"를 확인하는 데 쓴다. 전역 조인 키(행정구역 코드 등)가 없어 다른 상수도·행정구역 데이터와는 수도사업자명이나 지역명을 매핑해서만 이어 쓴다.
description_portal: 본 데이터는 한국수자원공사가 관리하는 국가상수도 지역별 일반 현황으로, 전국 및 시·도 단위의 급수 보급 실태를 정리한 것이다. 수도사업자, 행정구역 면적, 급수지역 수, 급수 및 미급수 동·읍·면 수, 전체 행정구역 수, 보급률 등의 항목이 포함되어 있으며, 지역별 상수도 보급 수준과 미급수 지역의 분포를 파악하는 데 활용된다. 특히 동·읍·면 단위 행정 구분을 기준으로 지역 간 상수도 보급률 격차를 진단하고, 미보급 지역에 대한 기반시설 확충 및 정책 수립에 유용하다. 본 데이터는 지방자치단체, 공공기관, 연구기관 등에서 지역 맞춤형 수자원 정책 마련, 인프라 개선 계획, 보급률 분석 등에 참고자료로 활용할 수 있다.
