description_portal: '부산광역시 연제구 건축허가 현황에 대한 데이터로 해당 자료에는 건축허가 현황을 (대지위치, 연면적, 건축 용도,  구조 등) 데이터를 제공합니다.제공 데이터 : 대지위치, 대지면적, 건축면적, 연면적, 구조, 허가일, 착공일, 사용승인일, 동수 등 연제구청 홈페이지 (https://www.yeonje.go.kr/)에서도 관련정보를 확인하실 수 있습니다.[행정정보공개게시판>부서별 행정정보> 건축허가 현황]건축허가 현황 공개는 주민에게 알 권리의 보장과 지역 내 공사 정보를 쉽게 확인해 생활 불편에 대비하고, 안전한 환경 조성하는 데 도움이 됩니다.'
