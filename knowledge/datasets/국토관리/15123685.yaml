summary_user: 경기도 내 토지를 토지고유번호(필지) 단위로 한 건씩 담은 기초지적 자료로, 소재지·행정구역코드·대장구분(토지/임야)·본번·부번·지목·면적·소유구분·공유인수를 수록한다(포털 설명상 500만 건이 넘는 대용량). 특정 필지의 지목과 면적, 개인·법인·국공유 같은 소유형태와 공유자 수를 확인하거나, 시군별 임야·전·답 분포를 집계하려는 분석가와 사업자가 쓴다. 실측상 전역 조인 키는 확인되지 않아, 다른 토지 자료와는 토지고유번호(land_idntfy_no)나 행정구역코드 같은 코드 값을 맞춰 연결하는 방식으로 이어 쓴다.
description_portal: 이 데이터는 경기부동산포털을 통해 제공되는 '토지_토지임야기본' 정보로, 경기도 내 토지 고유번호별로 지목, 면적, 소유형태 등의 기초지적 정보를 수록하고 있습니다. 주요 항목에는 '토지고유번호', '토지소재지', '행정구역코드', '토지소재지코드', '대장구분', '본번', '부번', '지목', '면적', '소유구분', '공유인수' 등이 포함되며, 이는 임야, 전, 답 등 다양한 지목의 토지 특성과 해당 필지의 행정적 위치 및 권리구조를 파악하는 데 유용합니다. * 데이터 활용 시 500만건이 넘어가는 대용량 데이터입니다.SHEET 탭의 변환 다운로드 서비스가 아닌 FILE 탭을 클릭하여 경기부동산포털_토지_토지임야기본_20230921.zip 파일을 직접 다운로드 부탁드립니다.
