summary_user: 경기도 내 산업단지 공공폐수처리시설을 시설 1곳당 1행으로 담으며, 시군명·산업단지명·시설용량·평균 유입량·유입율·준공일·주소·WGS84 좌표를 포함한다. 산업단지 환경 담당자나 분석가가 "우리 시군 산업단지 폐수처리시설은 용량 대비 얼마나 차서 가동되는가"를 확인하거나 증설이 필요한 시설을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명·산업단지명 같은 이름이나 주소, 위경도 좌표(refine_wgs84_lat/logt)를 매핑해 하수처리장 원장이나 방류수 수질 자료와 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 산업단지에서 발생하는 폐수를 처리하는 공공폐수처리시설의 운영 현황을 정리한 자료로, 각 시설의 용량과 평균유입량 및 위치 정보 등을 포함하고 있습니다. 주요 항목으로는 시군명, 산업단지명, 시설용량, 평균 유입량, 유입율, 준공일, 소재지 주소(지번 및 도로명), 우편번호, 위도 및 경도 좌표(WGS84 기준) 등이 있으며, 이를 통해 지역별 폐수처리 인프라 규모 및 처리효율을 파악할 수 있습니다. 이 데이터는 환경정책 수립, 산업단지 환경영향평가, 폐수처리 용량 확보 및 개선 계획 수립 등에 활용 가능하며, 폐수 배출 규제와 연계한 공공환경관리 기반 자료로도 중요하게 사용됩니다.
