summary_user: 인천 미추홀구 안의 도시형생활주택을 건축물 한 동(대장) 단위로 담은 원천 목록으로, 법정동·도로명주소, 대지·건축·연면적, 주용도, 세대수, 허가·착공·사용승인일자를 담은 CSV 파일(약 63KB)이다. 구청 담당자나 주거 분석가가 '미추홀구에서 어느 동에 도시형생활주택이 몰려 있고 최근 몇 년간 사용승인된 세대수가 얼마인가'를 볼 때 쓴다. 전역 조인 키(건축물대장 고유번호 등)는 없어 법정동명이나 도로명주소를 문자열로 맞춰 건축물대장·주택 인허가 자료와 이어 써야 한다.
description_portal: 본 데이터는 도시형생활주택의 현황을 기록한 자료로, 주거환경 관리와 도시계획 수립을 위한 기초정보로 제공됩니다. 각 항목에는 법정동과 도로명주소, 대지면적, 건축면적, 연면적, 주용도, 세대수, 허가일자, 착공일자, 사용승인일자 등이 포함되어 있으며, 기타 용도 및 기재사항을 통해 건축물의 특성을 상세히 확인할 수 있습니다. 도시형생활주택은 소규모 대지 위에 효율적으로 건축되는 공동주택으로, 주거 수요 변화에 대응하고 도심 내 다양한 주거 형태를 수용하는 데 중요한 역할을 합니다. 본 자료는 행정기관의 건축물 관리와 불법 건축물 예방, 안전 점검 및 도시재생 정책 추진을 지원하는 데 활용됩니다. 또한 주거밀도 분석, 생활 SOC 수요 예측, 도시환경 변화 모니터링 등에도 중요한 기초자료로 제공됩니다. 데이터는 정기적으로 갱신되어 신뢰할 수 있는 최신 정보를 반영하며, 주거복지 향상과 안정적 생활환경 조성을 위한 정책 수립과 연구에 기여합니다.
