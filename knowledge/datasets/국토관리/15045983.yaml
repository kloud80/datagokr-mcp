summary_user: 부산도시공사가 관리하는 영구임대·행복주택·공공임대 등 임대주택을 단지(지구) 단위로 한 행씩 담고, 유형·지구명·세대수·동수·층수·입주개시·관리방법·소재지·관리사무소 연락처를 기록한 작은 파일(약 2KB csv)이다. 부산에서 공공임대 입주를 알아보는 시민이 '우리 동네 가까운 영구임대나 행복주택 단지는 어디이고 몇 세대 규모이며 관리사무소 연락처는 무엇인가'를 확인하거나, 분석가가 지역별 공공임대 공급 현황을 파악하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 소재지 주소나 지구명을 이름 매칭해 전월세 실거래나 공동주택 관리 정보 등 다른 주택 데이터와 연결해야 한다.
description_portal: '부산도시공사에서 관리하는 임대주택 현황(유형, 지구명, 세대수, 동수, 층수, 입주개시일, 관리방법, 소재지, 연락처 등) 자료입니다.ㅇ영구임대주택 : 국가나 지방자치단체의 재정을 지원받아 최적소득 계층의 주거안정을 위하여 50년 이상 또는 영구적인 임대를 목적으로 공급하는 임대주택으로 15층 내외의 아파트로 운영중입니다.ㅇ행복주택 : 행복주택은 대학생·청년·신혼부부·주거약자 등의 주거비 부담경감을 위해 직장과 학교가 가까운 곳이나 대중교통 이용이 편리한 곳에 짓는 임대료가 저렴한 공공임대주택입니다.ㅇ공공임대주택 : 국가재정 또는 주택도시기금을 지원받아 영구임대주택을 대체할 목적으로 건립된 임대주택으로 분양전환은 되지 않습니다.'
