summary_user: 충청북도 보은군에 있는 제조업체를 업체 한 곳당 한 행으로 담은 명부로, 업체명·업종구분·산업분류코드·소재지·전화·팩스·고용인원을 포함하며 포털 설명상 2025년 9월 3일 기준 255개소입니다. 보은군에 입지할 협력업체나 특정 업종 제조업체를 찾는 사업자, 군 단위 제조업 고용 규모를 살피는 분석가가 '보은군에 어떤 업종 공장이 몇 곳 있고 몇 명을 고용하나' 같은 질문에 쓴다. 사업자번호나 필지번호(PNU) 같은 전역 조인 키는 없어, 산업분류코드로 업종 통계와 맞추거나 소재지 주소·업체명으로 공장등록·기업 정보와 대조하는 식으로 이어 쓴다.
description_portal: '민원인의 요청에 따라 제공되는 일회성 데이터입니다.충청북도 보은군의 제조업체 현황(업체명, 업종구분, 산업분류코드, 소재지,전화번호, 팩스번호, 고용인원 수 등)을 다음과 같이 제공하고자 합니다.전화번호 및 팩스번호 중 휴대폰 번호가 포함된 경우 등 개인정보가 포함된 데이터는 제공 대상에서 제외하였습니다.충청북도 보은군의 제조업체 현황 데이터와 관련된 기타 문의사항은 보은군청 경제정책실(043-540-3236)로 연락하여 주시기 바랍니다.○ 보은군 제조업체 현황 : 총 255개소※ 기준일 2025. 9. 3.'
