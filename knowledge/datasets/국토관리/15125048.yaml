summary_user: 국토교통부가 도시관리계획으로 결정한 개발제한구역의 구역 경계를 담은 연속주제도 공간 파일(SHP)로, 시도별 파일로 내려받으며 범위는 전국입니다. 토지 매입이나 개발을 검토하는 사업자·분석가가 특정 필지나 지역이 개발제한구역에 걸리는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 공간 중첩이나 이름·코드 매핑, 같은 기관 코드로만 잇는다.
limits: 포털 활용신청과 별개로 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일을 받아야 하며, API 호출 방식이 아니다. 표준 행정코드 같은 전역 조인 키가 없어 다른 통계·대장 데이터와 바로 붙일 수 없다.
