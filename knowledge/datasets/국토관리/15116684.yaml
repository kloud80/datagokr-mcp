description_portal: 성남시 내의 지역주택조합 사업 현황에 대한 데이터로, 조합명, 조합장명,  사업자위치,  세대수(조합원), 세대수(총분양), 대지면적 등의 데이터를 제공합니다. 지역주택조합은 무주택자들이 주체가 되어 주택을 마련하기 위해 자발적으로 조합을 구성하고 공동으로 아파트 등 주택을 건설하는 방식입니다. 이는 정부나 민간사업자가 아닌 조합 자체가 주택 건설의 주체가 된다는 점에서 일반 분양이나 공공임대사업과 구별됩니다. 조합이 설립되면 조합원 총회를 통해 시공사 선정과 자금조달 계획을 수립하고, 사업계획 승인을 관할 지자체에 신청합니다.
