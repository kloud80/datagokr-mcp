summary_user: 경기도 용인시에서 허가된 건축물을 건별로 담은 파일로, 대지 지번주소와 연면적, 허가·착공·사용승인 일자와 예정일, 주용도·부속용도를 한 행에 기록한다. 지역 개발업자나 도시계획 분석가가 '용인시에서 최근 어느 지역에 어떤 용도의 건축이 허가되고 실제 착공·사용승인까지 이어졌는가'를 보는 개발 흐름 선행 지표로 쓴다. 전역 조인 키는 없어서 다른 데이터와는 대지지번주소를 주소 매핑해 건축물대장·공시지가 같은 국토 정보와 잇거나 같은 기관(용인시) 자료끼리 연결한다.
description_portal: 본 데이터는 경기도 용인시에서 허가된 건축물의 현황을 제공한다. 주요 항목은 대지지번주소, 연면적(㎡), 허가일자, 착공처리일자, 착공예정일자, 사용승인일자, 준공예정일자(사용승인예정일자), 주용도, 부속용도로 구성되어 있다. 이를 통해 건축물별 위치, 연면적 규모, 주요 용도와 부속 용도, 허가 및 착공 과정, 사용 승인 여부 등을 종합적으로 파악할 수 있다. 본 자료는 건축행정 관리, 도시계획 수립, 건축 동향 분석, 개발 규모 파악, 정책 연구 등 다양한 목적으로 활용된다. 또한 건축허가 절차와 실제 준공 현황을 비교·검토할 수 있어 행정의 투명성과 관리 효율성 제고에 기여한다. 시민, 건축 관계자, 정책 담당자, 연구자 등 다양한 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 허가 및 승인 현황이 정기적으로 갱신된다. 공공데이터 개방을 통해 건축 관련 정보의 신뢰성과 활용도를 강화하고, 지역사회 내 건축행정의 투명성과 도시 발전에 기여하는 것을 목표로 한다.
