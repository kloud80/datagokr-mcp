summary_user: 팩토리온에 등재된 전국 산업단지별로 기준년월마다 위치(좌표), 규모·용도지역·면적, 입주 업체 수, 공장 유형, 고용인원 등을 통계항목 단위로 집계한 파일 데이터이며, 포털 설명상 2006년 6월~2025년 8월 시점을 담는다(xlsx 약 180MB). 분석가나 지자체 담당자가 특정 산업단지의 입주업체 수와 고용인원이 시점별로 어떻게 변했는지 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 광역시도명·산업단지명 같은 이름 매핑이나 산업단지 좌표로 이어 쓴다.
