summary_user: 부산광역시 상수도사업본부 수용가정보시스템에 접수된 가정수돗물 무료점검 민원 신청 정보를 담은 CSV 파일(약 2.3MB)로, 신청 건마다 담당 사업소, 건물형태, 녹물 출수 경험 여부, 자재 지원 여부가 기록된다. 상수도 행정 분석가나 시민이 '어느 지역사업소 관할에서 녹물 경험을 이유로 한 점검 신청이 많은가', '어떤 건물형태에서 배관 자재 지원이 자주 이뤄지는가' 같은 질문을 볼 때 쓴다. 전역 조인 키는 없어 사업소코드·사업소명을 기준으로 같은 상수도사업본부의 다른 수용가정보시스템 자료와 이름·코드를 맞춰 연결해야 한다.
description_portal: 부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 민원 신청 정보(수돗물점검) 자료입니다.정수장에서 고도정수처리된 깨끗하고 좋은 수돗물이 가정까지 그대로 공급될 수 있도록 가정내 수도배관, 물탱크 등 상수도와 관련된제반사항을 상수도 사업본부가 직접 점검하고, 필요시 개선방안을 제시하는 상수도 행정서비스입니다.가정수돗물 무료점검서비스를 받고자 하실 경우에는 거주지 내 지역사업소로 전화, 방문신청 또는 인터넷 홈페이지로 신청하시면가정수돗물 무료점검서비스팀이 가정을 방문하여 점검하여드립니다. 점검은 약 30분정도 소요됩니다.
