summary_user: 경상북도 상주시 일반건축물의 지방세 부과기준인 시가표준액을 과세년도별로 건물 단위(법정동·법정리·본번·부번·동·호, 연면적 포함)로 담은 파일이며, 포털 설명상 2017~2020년분이다. 상주시에 건물을 가진 소유자나 세무·부동산 분석가가 특정 건물의 연도별 시가표준액이 얼마였는지, 면적당 과세기준이 어떻게 변했는지 확인하는 데 쓴다. 전역 조인 키는 없어서 자치단체코드나 법정동·리명과 본번·부번 지번을 맞춰 건축물대장·공시가격 등 다른 데이터와 이름·지번 매핑으로 이어 쓴다.
