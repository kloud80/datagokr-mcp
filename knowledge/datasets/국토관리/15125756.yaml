summary_user: 서울특별시 도로굴착복구시스템에서 나온 도로굴착 예정지를 개별 위치(주소·좌표) 단위로 담은 공간정보로, 범위는 서울시 한 곳이며 예정지 일련번호와 연도 필드가 있습니다. 시민이나 공사·시설 관리 사업자가 "우리 동네 도로에 언제 어디서 굴착 공사가 예정돼 있나"를 지도 위에서 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 좌표 기반 공간 결합이나 이름·서울시 기관 코드 매핑으로만 이어 쓴다.
