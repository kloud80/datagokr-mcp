summary_user: 한국토지주택공사가 2016~2020년에 추첨 방식으로 공급한 토지(용지)의 공고 내역을 필지(사업지구·블록·가구번호) 단위로 담은 파일이며, 추첨·당첨자 게시·신청 접수 일정, 공급용도, 면적, 공급금액, 분양신청예약금 등을 포함한다. 이주자택지나 실수요자택지를 노리는 사람이나 분석가가 'LH가 어느 지구에서 어떤 용도의 땅을 얼마에, 어떤 추첨 일정으로 공급했나'를 과거 사례로 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지구명·지역본부명 같은 이름 매칭이나 같은 기관(LH)의 다른 공고 데이터와 맞대어 이어 쓴다.
description_portal: 한국토지주택공사에서  2016년~2020년 간 추첨 방식으로 공급한 토지 공고 내역 정보를 제공합니다. 파일을 통해 추첨일시, 추첨형태, 당첨자게시일시, 추첨분양신청접수개시일시, 추첨분양신청접수종료일시, 사업지구, 블록, 가구번호, 획지위치, 예정지번, 확정지번, 공급용도, 공급용도별공급방법, 가분할면적, 확정면적, 공급금액, 분양신청예약금, 공동신청에 대한 정보를 제공합니다. 경기지역본부 38.3%, 인천지역본부 19.4%, 서울지역본부 7.4% 입니다. 실수요자택지 주거전용이 26.8%, 협의양도인택지 주거전용이 25%, 이주자 택지 점포겸용이 20.3%를 차지합니다.
