summary_user: 대구광역시 서구 관내 착한가격업소를 업소 한 곳당 한 행으로 담은 파일로, 지정연도·업종·업소명·주소·전화번호·대표메뉴와 그 가격을 담는다(CSV 약 5.7KB, 시군구 범위의 개별 주소 단위). 주민이나 방문객이 '서구에서 저렴한 외식·이미용·세탁 업소가 어디 있고 대표메뉴가 얼마인가'를 찾거나, 분석가가 지역 물가안정 모범업소의 업종 분포와 가격 수준을 살피는 데 쓴다. 전역 조인 키는 없으므로 다른 구·군의 착한가격업소 현황과는 업소명·주소 문자열로 맞추거나 주소를 지오코딩해 위치 기반으로 이어 쓴다.
description_portal: 대구서구 관내에 위치한 착한가격, 청결하고 좋은 서비스를 제공하는 착한가격업소 공개에 대한 데이터로 가격, 위치등을 제공합니다.고물가 상황에서 저렴한 가격과 양질의 서비스를 제공하는 착한가격업소에 대한 정보는 물가 안정에 기여하며, 주민의 가계경제에 긍정적인 영향을 미친다.[용어설명]‘착한가격업소’는 효율적 경영을 통해 소비자에게 저렴한 가격으로 양질의 서비스를 제공하는 업소을 대상으로 정부와 지방자치단체가 지정하는 물가안정 모범업소다.모집 대상은 관내 사업장을 둔 외식업, 이·미용업, 세탁업 등 서민 생활과 밀접한 개인서비스 업종으로 주변 상권 대비 가격이 저렴하고 청결 관리가 우수한 업소이다.‘착한가격업소’로 선정된 업소에는 인증 표찰과 함께 맞춤형 물품, 쓰레기 종량제봉투 지급, 상수도 요금 할인, 이용 활성화를 위한 홍보 지원 등 다양한 혜택이 주어진다.착한가격업소에 대한 자세한 정보를 확인하고 싶다면 대구 서구청 홈페이지 https://www.dgs.go.kr/tour/goodPrcBiz/list.do?mid=0503000000&token=1740642054357 에서 확인할 수 있다.
