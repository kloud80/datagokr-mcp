description_portal: 본 통계는 전국 산업단지 현황통계 중 노후산업단지를 대상으로, 시도, 시군, 단지명, 조성상태, 지정면적, 관리면적 등 주요 항목을 분기별로 제공하는 자료입니다. 이를 통해 노후산업단지의 공간적 분포와 조성·관리 현황을 시계열적으로 파악할 수 있도록 구성되었습니다.노후산업단지는 착공 후 20년 이상 경과한 산업단지로서, 산업 구조의 변화, 기술 환경의 고도화, 주변 지역의 도시화 등 외부 환경 변화로 인해 기존 기능의 개선과 재편이 필요한 단지를 활성화 대상으로 규정하고 있습니다. 본 통계는 이러한 노후산업단지의 현황을 체계적으로 정리하여 정책적 관리와 단계별 개선 추진을 지원하는 데 목적이 있습니다.아울러, 노후거점산업단지는 「노후거점산업단지의 경쟁력 강화 및 지원에 관한 특별법(노후거점산단법)」에 따라, 착공 후 20년 이상 경과한 산업단지 중 지역 산업 및 경제 발전의 핵심 거점 역할을 수행하는 단지를 의미합니다. 본 통계는 노후산업단지와 노후거점산업단지를 구분하여 파악할 수 있는 기초 정보를 제공함으로써, 산업단지 고도화 정책 및 지역 균형 발전을 위한 참고자료로 활용될 수 있습니다.
