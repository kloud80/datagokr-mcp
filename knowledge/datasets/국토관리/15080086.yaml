summary_user: 인천광역시 계양구 안 일반건축물의 지방세 과세 기준인 시가표준액을 건물(동·호) 단위로 담은 원천 파일로, 과세년도·법정동·본번·부번·물건지·연면적·기준일자가 함께 들어 있다. 소유자가 내 건물의 재산세·취득세 산정 기준액이 얼마인지 확인하거나, 분석가가 계양구 내 법정동별 건축물 시가표준액 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서 시군구명·법정동·본번·부번 같은 지번 정보를 맞춰 건축물대장이나 공시지가 자료와 이어 쓰고, 다른 시군구 자료와는 자치단체코드로 구분해 붙인다.
description_portal: 이 데이터파일은 인천광역시 계양구 내 일반건축물에 대한 지방세 부과 기준인 시가표준액 정보를 제공하는 자료입니다. 항목으로는 건축물이 소재한 행정구역을 나타내는 법정동, 개별 건축물의 위치를 나타내는 물건지, 해당 건축물의 시가표준액, 건축물의 총 연면적을 의미하는 연면적, 그리고 해당 평가 기준이 적용되는 기준일자가 포함되어 있습니다. 이 데이터는 재산세, 취득세 등 지방세 부과를 위한 기초자료로 활용되며, 부동산 가격 산정, 과세 공정성 확보, 정책 수립 등에 중요한 역할을 합니다. 또한 시민들은 이 자료를 통해 본인 소유 건축물의 시가표준액을 확인하고 세금 산출의 기준을 이해할 수 있습니다.자세한 문의는 **인천광역시 계양구 세무1과(032-450-5223)**로 하시면 됩니다.
