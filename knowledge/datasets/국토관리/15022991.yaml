summary_user: 부산광역시 남구에 등록된 제조업 공장을 한 행에 한 공장씩 담은 시군구 단위 파일로, 회사명·도로명 주소·업종명·생산품·전화번호와 남녀·외국인 종업원 수를 담는다(약 30KB CSV). 남구에서 특정 업종이나 생산품을 만드는 공장이 어디에 있고 인력 규모가 어느 정도인지 찾는 사업자·분석가가 거래처 탐색이나 지역 제조업 현황 파악에 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 도로명 주소를 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 부산광역시 남구 소재의 공장등록(제조업) 현황에 대한 데이터로서 공장명, 주소, 종업원수, 전화번호, 생산품, 업종명  정보를 제공합니다.산업집적활성화 및 공장설립에 관한 법률 제16조에 의거하여 등록된 공장 정보를 제공합니다. (산업집적법, 산업현황, 통상, 중소기업, 제조업)  - 부산광역시 남구 공장등록현황(공장명, 주소, 업종명, 생산품, 전화번호, 남종업원수, 여종업원수, 외국인남종업원수, 외국인여종업원수)공장건축면적이 500제곱미터 이상인 공장의 신설ㆍ증설 또는 업종변경(이하 “공장설립등”이라 한다)을 하려는 자는 대통령령으로 정하는 바에 따라 시장ㆍ군수 또는 구청장의 승인을 받아야 하며, 승인을 받은 사항을 변경하려는 경우에도 또한 같다. 다만, 승인을 받은 사항 중 산업통상자원부령으로 정하는 경미한 사항을 변경하려는 경우에는 시장ㆍ군수 또는 구청장에게 신고하여야 한다.
