summary_user: 경상남도 함양군의 상하수도 요금표를 구분(상수도·하수도)과 업종(가정용·욕탕1종·욕탕2종·산업용·업무용·영업용), 사용량 단계(1~6)별로 정리한 CSV 파일로, 단계별 사용량 구간(세제곱미터)과 세제곱미터당 금액(원)을 담는다(파일 크기 약 3KB). 함양군 주민이나 사업자가 "우리 업종이 한 달에 몇 톤을 쓰면 수도요금이 얼마인가"를 따져 보거나, 분석가가 다른 시군과 업종별 누진 요금 구조를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 지자체 요금 데이터와는 업종명·단계 같은 이름 매핑이나 관리기관명으로만 이어 붙인다.
description_portal: 경상남도 함양군 상하수도 요금정보 자료로 구분, 업종(가정용, 욕탕1종, 욕탕2종, 산업용, 업무용, 영업용) 단계(1~6), 사용량(세제곱미터), 금액, 관리기관명, 연락처, 데이터기준일자로 구성되어 있습니다.본 데이터는 상하수도 요금 체계 전반을 구조화한 데이터를 통해 지역 주민과 기업, 행정기관이 요금 정책을 쉽게 이해하고 활용할 수 있도록 지원하고 있습니다. 이 자료는 수도요금의 합리적인 부과·징수와 더불어, 물 사용량 분석, 요금 체계 개선, 민원 대응 등 다양한 행정 및 정책적 목적에 활용될 수 있습니다.
