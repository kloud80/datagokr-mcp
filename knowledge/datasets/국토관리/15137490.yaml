summary_user: 대구도시개발공사가 매입한 임대주택을 건물 단위로 담은 파일 데이터로, 전체 258행에 임대주택명·주택구분·준공일자·매입일자·청년매입임대 여부·엘리베이터 유무 등을 건별로 싣는다. 매입임대주택의 건축 시기나 엘리베이터 설치 여부 같은 시설 현황을 확인해 자산관리·유지보수 계획을 세우려는 분석가나 담당자가 쓴다. 주소와 주소_상세를 조인 키로 삼아 주소 기반의 다른 주택·지역 데이터와 이어 쓰며, 그 외 코드표가 정의된 키는 없다.
