description_portal: '한강홍수통제소에서 관측하는 수위 관측소 별 수위자료, 유량자료를 적용기간 별로 제공하는 수위유량곡선환산표 데이터입니다.수위-유량 곡선식(Stage-Discharge Curve) 이란 하천의 특정 지점에서 측정한 수위(H)와그 지점을 흐르는 유량(Q) 사이의 상관관계를 나타낸 공식 또는 그래프를 말합니다.보통 하천의 유량을 직접 매번 측정하는 것은 시간과 비용이 많이 들기 때문에, 상대적으로 측정이 쉬운 수위를 통해 실시간 유량을 추정하기 위해 사용합니다.1. 기본 공식 (Rating Curve)가장 일반적으로 사용되는 공식은 다음과 같은 지수함수 형태입니다.   Q = C(H - a)^n :      - Q : 유량(m^3/s)      - H : 관측된 수위(m)     - a: 유량이 0이 되는 시점의 수위 (영수위, Zero-flow stage)     - C,n : 하천 단면의 형상과 거칠기에 따라 결정되는 상수'
