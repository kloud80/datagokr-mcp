summary_user: 한강홍수통제소 수위 관측소별로 적용기간(적용시작일자~적용종료일자)마다 수위값과 그에 대응하는 유량값을 짝지어 담은 수위-유량 곡선 환산표로, 약 61MB 규모의 CSV 파일 한 건이다. 하천 분석가나 수자원 실무자가 '이 관측소에서 수위가 몇 m일 때 유량은 몇 m³/s였나'처럼 관측 수위를 유량으로 바꾸거나 기간별 곡선 변화를 비교하는 데 쓴다. 전역 조인 키는 없으며, 수위관측소코드·관측소명을 같은 기관의 실시간 수위 관측 자료와 맞춰 이어 쓴다.
limits: 다른 기관 데이터와 바로 붙일 공통 키가 없어 관측소 코드나 이름을 직접 매핑해야 한다. 명세상 수시 생성 후 고정되는 파일이라 실시간 수위·유량 값 자체는 담지 않는다.
