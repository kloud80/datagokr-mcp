summary_user: 제주시 관내에서 추진된 도시숲 조성사업을 연도별·사업 건별로 정리한 파일 데이터로, 장소·사업량·사업내용(식재, 산책로, 쉼터 등)·사업비(천원)를 담는다(csv 약 4.5KB의 작은 표). 제주시 시민이나 환경정책 분석가가 "어느 해에 어디에 도시숲을 얼마의 예산으로 조성했나"를 확인하는 데 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어서, 다른 공원녹지·도시계획시설 데이터와는 장소명이나 연도를 직접 맞춰 이어 쓴다.
description_portal: '본 데이터는 제주특별자치도 제주시 관내에서 추진된 도시숲 조성사업의 연도별 조성 현황을 수록한 자료입니다. 도시 내 녹지공간 확충과 탄소흡수원 확대, 미세먼지 저감, 시민의 휴식 및 생태복원 기능 강화를 목적으로 조성된 도시숲의 위치, 면적, 사업비, 조성 내용 등 종합적인 정보를 제공합니다. 제주시의 생태환경 개선과 기후위기 대응 정책 수립을 위한 기초자료로 활용됩니다.주요 항목조성년도: 도시숲 조성사업이 시행된 연도장소: 도시숲이 조성된 대상지 명칭 또는 지역사업량: 조성 면적 또는 식재 규모 등 사업 물량 정보사업내용: 수종 식재, 산책로 조성, 쉼터 조성 등 사업의 주요 내용사업비(천원): 해당 사업에 투입된 총 예산(단위: 천 원)위치 등: 조성 장소의 주소 또는 행정구역상 위치 정보 및 기타 참고사항활용 목적이 데이터는 도시 녹지 확충 현황 분석, 지역별 도시숲 분포 파악, 생태기반 조성 사업의 성과 관리, 환경정책 수립, 주민참여형 녹지사업 기획 등에 활용됩니다. 제주시청이 주관하여 매년 갱신·관리하며, 공공의 환경 정보 접근성과 도시 녹색복지 실현을 위한 자료로 제공됩니다.'
