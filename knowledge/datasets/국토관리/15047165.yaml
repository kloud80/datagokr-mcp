description_portal: '○ 통계개요* 통계명 : 지가변동률* 통계종류 : 조사통계, 지정통계(승인번호 31501)* 근거법령 : 국토의계획및이용에관한법률 제125조 및 같은법 시행령 제125조* 작성목적 : 지가변동상황을 조사하여 토지정책 수행 및 감정평가시 시점수정 등을 위한자료로 활용* 조사체계 : 국토교통부(조사평가의뢰) → 한국감정원(조사평가,통계작성)* 공표주기 : 매월* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구 용도지역별 이용상황별 등○ 용어설명* 지가변동률 : 기준시점 대비 해당시점의 지가지수의 상승분을 나타냄- 지가지수 : 기준시점의 지수를 100으로 보았을 때, 기준시점 대비 가격상승분을반영한 해당시점의 지수를 나타냄* 지수분류 : 지역별, 용도지역별, 이용상황별 지가변동률* 월별변동률 : [(당해월 지수 / 전월지수)-1]*100 　 　* 연도별 변동률 : 해당연도 12월 기준 누계변동률- 누계변동률 : [당해월 지수/전년말지수)-1]*100'
