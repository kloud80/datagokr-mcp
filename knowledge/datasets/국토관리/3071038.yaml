summary_user: 단양군의 개발행위허가를 연도별로 집계한 파일로, 건축물 건축·공작물 설치·토지 형질변경·토석채취·토지분할·물건 적치 여섯 유형별 허가 건수와 면적(제곱미터), 그리고 합계를 시군 단위로 담는다. 연구자나 지역 분석가가 "단양군에서 해마다 토지 형질변경이나 토석채취 허가가 얼마나 늘거나 줄었나" 같은 개발 압력 추이를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명과 연도를 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 충청북도 단양군 연도별 개발행위허가 현황(건축물의건축(건수, 면적), 공작물의설치(건수, 면적), 토지의형질변경(건수, 면적), 토석채취(건수, 면적), 토지분할(건수, 면적), 물건의적치(건수, 면적)) 항목을 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 연도별 개발행위허가 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 12일입니다. 담당부서는 단양군 관광건설국 균형개발과이며 문의주시면 최신의 충청북도 단양군 연도별 개발행위허가 현황을 열람하실 수 있게 도와드립니다.
