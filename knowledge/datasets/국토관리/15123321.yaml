summary_user: '홍수위험지도가 속한 수자원단위지도상 대권역의 코드(대권역코드)와 이름(대권역명)을 짝지은 소형 코드표로, 전국 범위의 비공간 파일(csv 326바이트)입니다. 홍수위험지도나 수자원 관련 자료에 적힌 대권역코드가 어느 권역(예: 한강 등)을 뜻하는지 확인하려는 분석가·지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 대권역코드나 대권역명을 같은 기관의 홍수위험지도·중권역·표준유역 자료와 이름·코드 매핑으로 이어 쓴다.'
description_portal: 제방월류, 제방파제, 내수침수 등 홍수시나리오에 따라 예상되는 최대 범람지역을 표시하는 홍수위험지도이 속한 대권역을 표시.* 홍수위험지도란? 하천제방의 설계빈도를 초과하는 홍수가 발생하여 제방붕괴, 제방월류 등 극한의 상황이 발생한다는 가정하에 하천 주변지역의 침수범위, 침수깊이를 나타낸 지도. 이를 통해 최악의 홍수상황을 사전에 대비하고 인명 및 재산피해를 최소화하며, 지자체의 재해지도 제작, 홍수 관련 보험의 기초자료를 제공 및 수해방지대책 수립 등에 활용이 가능한 홍수 대비를 위한 기초정보. 홍수위험지도의 제방붕괴 등의 홍수 예상 시나리오는 실제 하천제방의 안정성과 무관하며, 구조물적 대책이 실패한다는 최악의 경우를 가정한 것으로서 홍수 시 가상의 최대 범람 범위 산정을 위한 것임* 수자원단위지도란? 국가 자원의 수자원개발, 계획 및 관리업무의 효율적 추진을 위하여 수자원 업무에 활용되는 자료의 수집, 분석과 관련된 기관 간 자료와 공동활용을 목적으로 지형공간 상에 대권역, 중권역 및 표준유역의 가상의 구역을 설정한 지도
