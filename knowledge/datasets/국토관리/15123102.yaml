summary_user: 경기도 시군별로 국민과 혼인한 배우자 수를 기준년월(crtr_ym) 단위로 집계해 총계와 5세 단위 연령 구간(0~4세부터 80세 이상)별 인원을 남녀로 나눠 담은 시군구 단위 통계다. 지자체 가족·다문화 정책 담당자나 인구 분석가가 '어느 시군에 어떤 연령대의 결혼 배우자가 몰려 있고 성비는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(anls_sigun_cd)나 시군명을 이름·코드 매핑하거나 같은 경기도 데이터의 코드로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 국민과 혼인한 배우자의 지역별·연령별 통계를 기준년월 단위로 제공하며, 시군별로 배우자의 총 수와 연령 구간별 인구(0세부터 80세 이상까지)를 남녀 성별로 세분화하여 포함하고 있습니다. 연령 구간은 5세 단위로 나뉘며, 남녀 각각의 세부 연령대별 통계를 확인할 수 있습니다. 이 데이터를 통해 특정 지역의 결혼 연령 분포나 연령대별 결혼 집중 구간, 성비 등을 분석할 수 있으며, 지역 맞춤형 결혼 및 가족 정책 수립, 저출산 대응 전략, 인구 구조 분석 등에 활용됩니다. 연령 구간별로 결혼 시기나 경향을 분석함으로써 인구사회학적 연구 자료로도 유용합니다.
accrual_periodicity: 수시
team:
  dept: AI미래행정과
