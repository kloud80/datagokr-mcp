summary_user: 서울특별시 건축 인허가 건물의 호별·층별 개요를 담은 원천 자료로, 한 행이 대지위치(자치구·법정동·본번·부번) 기준 건물의 동·호, 평형유형, 층 번호와 지상·지하 구분을 나타낸다. 재개발·재건축 계획 담당자나 부동산 분석가가 특정 지번 건물에 몇 층에 어떤 호가 배치돼 있는지, 층별 세대 분포가 어떤지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 건축물 데이터와는 자치구명·법정동명·지번(본번·부번) 같은 이름·번호 매칭이나 같은 기관의 인허가 대장 일련번호(PRMSN_LDGR_SN)로만 연결한다.
description_portal: 이 데이터는 서울특별시 건축 인허가 관련 호별 층별 세부 현황을 나타낸 자료입니다. 각 행은 특정 건물의 위치(자치구명, 법정동명, 지번)를 기반으로, 해당 건물의 동·호수, 평형유형, 층수 및 층 구분(지상, 지하 등)을 제공합니다. 이를 통해 건물 내 각 세대의 물리적 배치와 구조를 파악할 수 있으며, 건축 인허가 관리, 부동산 거래, 주거 환경 분석 등 다양한 분야에서 활용됩니다. 예를 들어, 한 건물의 1층 101호부터 5층 501호까지 층별·호별 구성이 명확히 기록되어 있어 층별 세대 분포와 주거 형태 분석이 가능합니다. 이 데이터는 재개발·재건축 계획 수립, 인구 및 가구 수 통계 작성, 도시계획, 건축물 관리 등에도 중요한 기초자료로 쓰입니다.
