summary_user: 경기도 포천시 관내에 등록된 공장을 한 건씩 담은 명부로, 회사명·공장 대표주소(도로명·지번)·업종명·전화번호·종업원수·생산품·주원자재를 담는다(CSV 약 673KB, 범위는 포천시 한 곳). 포천시에서 어떤 업종의 공장이 어디에 몰려 있고 어떤 제품을 만드는지 알아보려는 기업 지원 담당자나 지역 산업 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 데이터와는 주소(도로명·지번)나 회사명을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 경기도 포천시에서 제공하는 공장등록 현황 데이터입니다. 본 데이터는 포천시 관내에 등록된 공장의 기본 정보를 제공하는 자료로, 회사명, 공장대표주소(도로명), 공장대표주소(지번), 업종명, 전화번호, 종업원수, 생산품 등 공장의 위치, 업종 및 운영 현황과 관련된 정보를 포함하고 있습니다.이를 통해 공장의 분포, 업종별 현황, 규모 및 주요 생산품을 파악할 수 있으며, 지역 산업구조 분석, 제조업 분포 현황 분석, 산업정책 수립, 기업 지원, 일자리 및 경제 동향 분석을 위한 기초자료로 활용할 수 있습니다. 또한 도로명주소를 기반으로 산업단지, 교통, 인구, 행정구역 등 다양한 공공데이터와 연계·분석이 가능하여 지역경제 활성화 정책 수립과 산업 연구를 위한 자료로 활용할 수 있습니다.
