summary_user: 국가하천 하천범람 지도를 바탕으로 중권역(수자원단위지도) 단위·재현빈도별(100년, 200년, 500년, 기왕최대)로 침수심 5단계(0.5m 이하부터 5.0m 초과까지)의 침수면적(km²)을 집계한 전국 범위 통계다. 지자체 방재 담당자나 분석가가 '이 중권역에서 200년 빈도 홍수로 하천이 넘치면 2m 넘게 잠기는 면적이 얼마인가'처럼 유역별 범람 피해 규모를 비교·판단하는 데 쓴다. 대권역·중권역 코드(bbsnCd, sbsnCd)로 같은 체계를 쓰는 다른 유역 단위 수자원 데이터와 맞춰 볼 수 있지만, 실측에서 전역 조인 키는 확인되지 않아 코드·이름 매핑으로 연결해야 한다.
description_portal: 환경부 한강홍수통제소에서 제공하는 홍수위험지도 중 국가하천 하천범람 지도를 기반으로 장마철 갑작스럽게 내리는 국지적 집중호우·돌발호우 등으로 유발되는 하천범람 결과의 5단계로 이루어진 침수심별(0.5m 이하, 0.5~1.0m, 1.0~2.0m, 2.0~5.0m, 5.0m 이상) 침수면적(km² 단위) 통계 데이터를 유역별(수자원단위지도의 중권역 단위), 빈도별(100년, 200년, 500년, 기왕최대)로 구분하여 침수면적 통계 데이터를 조회할 수 있는 서비스 입니다. 사용자는 이러한 침수면적 통계 데이터를 통해 해당 지역의 하천범람으로 인한 침수 규모의 정도를 판단할 수 있습니다.
