summary_user: 수질오염총량관리 기술지침(2019)에 제시된 축종별(젖소·한우·말·돼지·양/사슴·개·가금) 축산분뇨 발생부하원단위를 BOD·총질소·총인별로 폐수·고형물·합계로 나눠 담은 전국 단위 소형 기준표(csv 818바이트)로, 단위는 마리당 하루 그램(g/두/일)이다. 수질오염총량관리 계획을 세우는 지자체 담당자나 분석가가 '이 유역의 돼지·한우 사육두수로 하루 축산계 BOD·T-N·T-P 발생부하량이 얼마인가'를 계산할 때 곱하는 계수로 쓴다. 전역 조인 키가 없어 축종 이름(구분)과 대상물질 이름(항목)을 기준으로 가축 사육두수 통계 등과 직접 매핑해 이어 써야 한다.
description_portal: '수질오염총량관리제를 위한 오염원별(생활계, 산업계, 축산계, 토지계, 매립계, 양식계) 발생부하량을  산정하여야 합니다.  축산계 오염원  발생부하량을 산정할 경우 수질오염총량관리 기술지침에서 제시하는 축종별(젖소, 한우, 말, 돼지, 양/사슴, 개, 가금) 사육두수에 발생부하 원단위(폐수, 고형물)를 곱하여 산정합니다. 축산계 발생부하량 산정을 위한 축종별(젖소, 한우, 말, 돼지, 양/사슴, 개, 가금) 대상물질(BOD(생물학적산소요구량), T-N(총질소), T-P(총인)) 축산분뇨 발생부하원단위(폐수/고형물/합계)를 제공합니다.단위 : g/두/일)출처 : 수질오염총량관리기술지침(2019)'
