description_portal: 'K-water 위수탁 지방상수도의 업종별 수도요금 정보입니다.o 안내사항  1. 수자원공사에서 위탁운영하는 22개 지방자치단체의 지방상수도 관련 정보    -(지자체) 동두천, 광주, 양주, 파주, 단양, 논산, 서산, 금산, 정읍, 나주, 장흥, 함평, 완도, 진도, 청송, 고령, 예천, 봉화, 거제, 사천, 통영, 고성(경남)  2. 제공되는 항목 : 위탁운영중인 지방자치단체 수도사업장, 업종 구분, 업종별 적용되는 금액(단위 : 원/㎥) “K-water는 지방상수도의 효율적 관리 및 서비스 향상을 위해22개 지자체로부터 위탁받아 상수도 운영을 수행하고 있으며,본 데이터는 투명한 요금정보 제공과 주민·기업의 요금 예측 편의를 위해 공개됩니다.”자세한 사항은 해당 홈페이지에서 확인하시기 바랍니다.https://www.data.go.kr/data/15054137/fileData.do상세 요금 산정 기준 및 문의: 해당 지자체 수도사업소'
