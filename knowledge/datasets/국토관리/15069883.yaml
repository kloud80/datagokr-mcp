summary_user: K-water가 위탁운영하는 22개 지방자치단체 지방상수도의 업종별 수도요금표로, 지자체·업종·누진 단계마다 사용량 구간(㎥)과 구간 단가(원), 단계별 기본요금을 한 행씩 담은 요금 기준표(약 11KB CSV)이다. 위탁 지자체에 사는 주민이나 사업자가 "우리 업종이 한 달에 몇 ㎥를 쓰면 수도요금이 얼마쯤 나오나"를 추정하거나, 분석가가 위탁 지자체 간 업종별 요금 수준을 비교하는 데 쓴다. 전역 조인 키나 행정코드는 없어서, 다른 상수도 데이터와는 지자체명을 이름으로 맞춰 이어 쓴다.
