description_portal: 제주특별자치도 제주시에서 관리하는 지방 하천 현황 데이터는 관내 하천의 체계적인 정비와 홍수 예방 등 수자원의 효율적인 관리를 위해 구축된 하천 지리 및 기본계획 정보를 제공합니다. 본 데이터는 제주시가 관리하는 각 물길의 고유 명칭인 하천명, 하천의 시작점을 나타내는 하천 기점, 하천법상 지정된 총 길이인 하천연장(km), 재해 예방 및 하천 정비의 기준이 되는 기본계획수립 연장 수립 및 미수립 구간(km), 하천의 실제 물줄기 총 길이인 유로연장(km), 그리고 비가 내렸을 때 해당 하천으로 물이 모여드는 전체 면적인 유역면적(㎢) 등의 상세한 하천 제원 정보를 일목요연하게 제공하여 집중호우 시 수해 방지 대책 수립과 하천 구역의 체계적인 유지·보수를 위한 기초 행정 자료로 활용됩니다.
