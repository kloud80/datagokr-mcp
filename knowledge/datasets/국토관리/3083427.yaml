summary_user: 제주시가 관리하는 지방하천을 하천 한 줄씩 정리한 현황표로, 하천명·기점과 하천연장, 기본계획 수립·미수립 연장, 유로연장, 유역면적을 담은 작은 CSV 파일(약 2KB)이다. 제주시 하천 정비나 수해 대비를 검토하는 담당자·분석가가 '기본계획이 아직 수립되지 않은 구간이 긴 하천은 어디인가' 같은 질문에 쓴다. 전역 조인 키나 하천코드가 없어 다른 하천·공간 데이터와는 하천명으로 맞춰 이어 써야 한다.
