description_portal: 부산광역시 사상구 개인하수처리시설(정화조, 오수처리시설) 청소대행업체 현황(업체명, 대표자, 청소구역, 청소인원, 청소차량, 전화번호)에 대한 데이터로 내부청소 이행 시 참고하시기 바랍니다. 개인하수처리시설의 소유자 또는 관리자(이하 “소유자등”이라 함)는 방류수의 수질자가측정 및 내부청소 등에 관하여 다음 기준에 따라 그 시설을 유지·관리해야 합니다(규제「하수도법」 제39조제2항 및 규제「하수도법 시행규칙」 제33조제1항 본문).1. 다음의 구분에 따른 기간마다 그 시설로부터 배출되는 방류수의 수질을 자가측정하거나 측정대행업자가 측정하게 하고, 그 결과를 기록하여 3년 동안 보관할 것√ 1일 처리용량이 200세제곱미터 이상인 오수처리시설과 1일 처리대상 인원이 2천 명 이상인 정화조： 6개월마다 1회 이상√ 1일 처리용량이 50세제곱미터 이상 200세제곱미터 미만인 오수처리시설과 1일 처리대상 인원이 1천 명 이상 2천 명 미만인 정화조： 연 1회 이상2. 정화조는 연 1회 이상 내부청소를 할 것. 단, 규제「하수도법 시행령」 제4조제1호부터 제5호까지와 제10호에 따른 구역 또는 지역에서 아래의 어느 하나에 해당하는 영업을 하는 건물등에 설치된 정화조는 6개월마다 1회 이상 내부청소를 해야 함√ 관광숙박업 또는 관광객 이용시설업(관광유람선업과 외국인전용 관광기념품판매업은 제외함)√ 식품접객업. 단, 제과점영업과 다방영업(주로 차 종류를 조리·판매하는 영업을 말함)은 제외함√ 숙박업3. 오수처리시설은 그 기능이 정상적으로 유지될 수 있도록 침전 찌꺼기와 부유 물질 제거 등 내부청소를 해야 하며, 청소 과정에서 발생된 찌꺼기를 탈수하여 처리하거나 분뇨수집·운반업자에게 위탁하여 처리할 것4. 1일 처리대상 인원이 500명 이상인 정화조에서 배출되는 방류수는 염소 등으로 소독할 것 공공하수처리시설 또는 공공폐수처리시설로 오수를 유입시켜 처리하는 지역에 설치된 개인하수처리시설에는 위의 관리기준 중 1.과 4.는 적용하지 않고, 해당 지역에 설치
