summary_user: 부산광역시 사상구의 개인하수처리시설(정화조·오수처리시설) 청소대행업체 현황을 업체 한 곳당 한 행으로 담은 파일로, 업체명·대표자·소재지·청소구역·청소인원·청소차량·전화번호를 담는다(파일 크기 287바이트의 소규모 목록). 사상구에서 정화조를 가진 건물 소유자나 관리인이 정기 내부청소를 맡길 업체와 연락처, 담당 청소구역을 찾는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 업체명·소재지 주소를 기준으로 맞추거나 같은 기관(사상구) 단위로만 이어 쓴다.
