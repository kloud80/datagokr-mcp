summary_user: 경상북도 안동시에 있는 예식장 식당을 업소 한 곳당 한 행으로 담은 목록으로, 업종명·업소명·영업자·도로명/지번 소재지·전화번호를 담는다(파일 크기 503바이트의 소규모 CSV). 안동에서 결혼식 피로연을 치를 식당을 찾는 시민이나 지역 예식 관련 업소 분포를 살피는 분석가가 '안동시 예식장 식당은 어디에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 주소(도로명·지번)를 지오코딩하거나 업소명으로 맞춰 다른 업소·위치 데이터와 이어 쓴다.
description_portal: 해당 데이터는 경상북도 안동시 내에 소재하는 예식장 식당 목록을 나타내는 자료로,예식장 식당 목록 활용 수요 증가에 따라 주목받고 있는 예식장 식당 목록의 상세 정보를 제공합니다.데이터 항목에는 업종명, 업소명, 영업자명, 도로명주소, 지번주소, 전화번호 등이 포함되어 있으며,이를 통해 각 예식장 식당 목록의 상세 정보를 파악할 수 있고, 관련 자원 연계에도 활용할 수 있습니다.이 자료는 지역 활성화 정책 수립, 예식장 식당 개발 등의 기초 자료로 활용될 수 있으며,예식장 식당 이용 활성화를 도모하는 데 기여할 수 있습니다.경상북도 안동시의 예식장 식당 현황을 한눈에 파악할 수 있는 유용한 자료입니다.
