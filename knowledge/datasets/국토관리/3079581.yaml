description_portal: 본 자료는 전라남도 광양시에서 승인한 개발행위 허가에 대한 정보를 체계적으로 정리한 공공데이터로, 국민 누구나 열람하고 활용할 수 있도록 무료로 개방된 자료입니다. 「국토의 계획 및 이용에 관한 법률」에 따라 개발행위는 토지 형질 변경, 건축물 건축, 공작물 설치 등 다양한 행위가 포함되며, 본 데이터는 이러한 행위에 대해 행정기관이 허가한 내용을 기록하고 공개한 것입니다.주요 항목에는 용도지역, 읍면동, 리, 지번, 지목, 허가면적, 행위목적, 허가일, 구분이 포함되며, 이를 통해 광양시 전역의 개발사업 추진 현황, 허가 규모, 용도별 분포, 시기별 추이 등을 쉽게 파악할 수 있습니다.특히 이 정보는 토지이용 계획 수립, 도시계획 변경 검토, 환경영향 평가, 민원 대응, 부동산 거래 등 다양한 분야에서 기초 자료로 활용됩니다.
