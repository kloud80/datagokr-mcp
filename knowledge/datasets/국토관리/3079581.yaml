summary_user: 광양시가 허가한 개발행위를 필지 단위로 한 건씩 담은 CSV 파일로, 대지위치·지목·허가면적(제곱미터)·용도지역·허가일·개발행위목적을 기록한다. 광양시 안에서 어느 용도지역·지목에 어떤 목적의 개발행위가 언제 얼마만큼 허가됐는지 알고 싶은 토지 투자자, 인근 주민, 도시계획 분석가가 쓴다. 실측 컬럼에 필지고유번호 같은 전역 조인 키가 없어서, 다른 데이터와는 대지위치(지번 주소) 문자열을 맞추거나 같은 광양시 자료와 이름으로 매핑해야 연결된다.
limits: 광양시 한 곳만 다루므로 다른 시군과 비교하려면 지역별 파일을 따로 모아야 한다. 표준 필지코드가 없어 토지·건축물 대장과 붙이려면 주소 정제와 매칭 작업이 필요하다. 명세상 연간·이벤트 주기로 생성되는 파일이라 실시간 허가 현황으로 보면 안 된다.
