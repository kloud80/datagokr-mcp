summary_user: 전라남도 진도군의 지구단위계획구역을 구역 도형 하나당 한 행으로 담은 파일로, 구역 이름(라벨명), 면적(㎡), 경계 길이(m), 도면번호, 생성날짜가 들어 있고 범위는 진도군 한 개 시군구입니다(csv 896바이트의 소규모 파일). 진도군 안에 지구단위계획구역이 어디에 몇 곳 있고 각각 규모가 얼마인지 확인하려는 주민·사업자, 그리고 구역별 면적을 비교하는 도시계획 분석가가 쓴다. 전역 조인 키는 없으므로 시군구코드나 구역 이름으로 같은 기관의 다른 도시계획정보(용도지역·도시계획시설 현황 등)와 맞춰 이어 쓴다.
description_portal: 전라남도 진도군 도시계획정보 지구단위계획구역 현황 데이터는 각 지구단위계획구역을 식별할 수 있는 고유한 라벨명과 해당 구역이 차지하는 면적(㎡), 그리고 구역 경계를 따라 측정된 총 길이(m)를 포함하고 있어, 이를 통해 구역별 공간적 특성과 규모를 명확히 파악하여 도시계획 수립과 개발 관리, 행정적 구분 및 GIS 기반의 공간 분석에 활용할 수 있는 중요한 기초 자료입니다. 지구단위계획은 일정 구역 단위에서 토지 이용, 건축물 배치, 도로망, 공원 등 도시 환경을 체계적으로 계획하는 제도로, 해당 구역을 “지구단위계획구역”이라 부릅니다.
