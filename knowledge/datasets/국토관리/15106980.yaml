summary_user: 서대문구 신촌·이대 일대에 설치한 센서 30곳에서 측정한 유동인구를 날짜별 한 행으로 담은 일 단위 집계 파일로, 센서 지점별 값과 신촌연세로·이대·박스스퀘어 등 권역 합계 열이 함께 들어 있으며 포털 설명상 기간은 2022년 10월 1일~31일이다. 상권 분석가나 소상공인이 '신촌역 광장과 이대입구 중 어느 쪽이 요일별로 사람이 더 많이 다니는가', '축제 기간에 연세로 유동인구가 얼마나 늘었는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜나 지점 이름을 직접 맞춰 이어야 하며, 같은 기관(서대문구)의 다른 데이터와 연결하는 정도로 쓴다.
