summary_user: 부산 영도구가 빈집정비계획(제1기 2020년, 제2기 2025년 수립)에 따라 구가 직접 철거·정비한 빈집을 건물 한 채 단위로 담은 원천 목록으로, 주소·구조·용도·연면적·정비일자·정비방법을 담는다(CSV 약 3.9KB의 소규모 파일). 영도구 주민이나 도시재생 분석가가 "구가 어느 동네에서 어떤 빈집을 언제 철거했나"를 확인하는 데 쓴다. 전역 조인 키는 없어 건물주소(건물주소)를 주소 매칭해 건축물대장이나 다른 빈집 실태조사 자료와 이어 써야 한다.
description_portal: '"빈집 및 소규모주택 정비에 관한 특례법"에 따라 부산광역시 영도구에서 수립한 빈집정비계획 제1기(2020년 수립), 제2기(2025년 수립) 빈집정비계획에 따른 영도구의 빈집 현황 중 영도구지자체에서 자체 철거 정비한 영도구 빈집의 정비 현황(건물의 주소, 건물의 구조, 건물의 용도, 건물의 연면적, 건물의 정비일자 등)에 대한 데이터 자료입니다. 이 데이터는 영도구에서 자체 정비한  철거 현황만 포함되며  빈집소유자의 자발적 철거 나 개발에 의한 철거 등의 내용은 포함되지  않음을 알려드립니다.'
