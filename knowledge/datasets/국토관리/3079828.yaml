summary_user: 경기도 동두천시의 상업용 현수막 지정게시대를 게시대 한 곳당 한 행으로 담으며, 명칭·지번주소·위도·경도와 게시대 수, 행정용·상업용 면수, 규격, 부착 기간, 금액, 관리기관 연락처를 함께 제공한다. 현수막을 내걸려는 사업자나 민원인이 동두천시 안 어느 게시대에 상업용 면이 몇 개 있고 며칠에 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 지번주소나 위도·경도 좌표로 위치를 맞추거나 같은 기관(동두천시 시설관리공단) 기준으로 이어 쓴다.
description_portal: '경기도 동두천시의 상업용 현수막지정게시대 현황을 민원인에게 제공하고자 합니다.데이터는 게시대명칭, 소재지지번주소, 위도, 경도, 게시대(수), 행정용(면), 상업용(면), 규격(cm), 부착일(일), 금액, 관리기관명, 관리기관전화번호의 정보를 제공합니다.데이터의 기준일자는 2026년 5월 11일입니다.데이터에 대하여 추가 문의사항이 있을 경우에는 경기도 동두천시 시설관리공단 031-890-2147으로 문의주시기 바라며, 동두천시 시설관리공단 홈페이지에서도 현수막 게시대 이용 현황을 확인하실 수 있습니다.현수막 게시대 이용 안내 : https://www.ddcsiseol.or.kr/main/content/view/MN02070000.do'
