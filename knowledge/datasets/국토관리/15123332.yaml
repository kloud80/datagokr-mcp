summary_user: 하천에서 물을 끌어 쓰는 시설에 대한 하천수 사용 허가를 허가번호별로 담은 건별 원장 파일로, 시설물명·하천명·용도·허가상태와 최초·최근 허가일, 만료일, 취소일, 관할통제소를 전국 범위로 수록한다. 사업자나 분석가가 특정 하천에서 어떤 시설이 어떤 용도로 물을 취수하고 있는지, 허가가 언제 만료되거나 취소됐는지를 확인하는 데 쓴다. 전역 조인 키는 없고, 하천코드나 하천명으로 하천 목록·구역 같은 하천 시설 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 하천수 사용 허가는 하천에서 물을 취수하여 다양한 용도로 사용하는 시설에 대해 국가 또는 지방자치단체가 부여하는 법적 허가입니다. 이는 하천법에 근거하여 하천의 공공성과 환경 보호를 위해 엄격하게 관리됩니다. 이 자료는 하천수 사용 허가번호, 시설물명, 하천코드, 하천명, 용도, 허가상태, 최근허가일, 최근허가시작일, 최근허가만료일, 최초허가일, 전체허가시작일, 전체허가만료일, 허가취소일, 관할통제소에 대한 자료를 제공합니다. 하천수 사용 허가를 통해 하천수 사용을 효율적으로 관리하여 지속 가능한 수자원 관리를 실현합니다
