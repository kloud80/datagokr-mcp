summary_user: 한국농어촌공사가 관리하는 농업용 저수지 4곳(백록·난계·백련·남성현)의 시설제원을 저수지당 한 행으로 담은 소규모 파일(299바이트 CSV)로, 취수시설 최대방류량, 설계 홍수빈도·홍수량, 여수로 길이·높이·최대방류량을 담는다. 저수지 안전점검이나 재해 대응 시나리오를 짜는 연구자·관리자가 '이 저수지 여수로가 설계 홍수량을 얼마나 흘려보낼 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 저수지코드 대신 시설명(저수지 이름)으로 농어촌공사의 저수율·수위 데이터와 맞춰 이어 써야 한다.
description_portal: '- 한국농어촌공사에서 관리하고 있는 4개의 농업용 저수지에 대한 데이터입니다.- 농업용 저수지는 농업용수를 확보하기 위해 빗물이나 하천수 등을 모아 저장하는 인공 저수시설입니다.- 본 데이터는 백록, 난계, 백련, 남성현 저수지의 시설제원(취수시설의 최대방류량, 홍수빈도, 홍수량, 여수로 길이, 여수로 높이, 여수로 최대방류량)을 제공합니다.- 해당 데이터는 저수지의 유지관리, 안전점검, 재해예방 등에 활용될 수 있으며- 재해 대응 시나리오 수립 등 다양한 학술연구(논문,과제) 목적으로도 활용 가능합니다.'
