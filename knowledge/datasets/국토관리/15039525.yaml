summary_user: 인천 서구(서해구) 안에 등록된 공장을 공장 한 곳당 한 행으로 담은 CSV 파일(약 299KB)로, 단지명·회사명·생산품만 들어 있습니다. 지역 산업 담당자나 분석가가 "서구의 어느 산업단지에 어떤 회사가 무엇을 생산하는가"를 파악하거나 지역 산업 구조를 개략적으로 볼 때 씁니다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 단지명 문자열을 맞춰서만 연결할 수 있습니다.
description_portal: 본 공공데이터는 인천광역시 서구 내 등록공장의 현황을 제공을 하고 있습니다. 본 공공데이터는 인천광역시 서구 내 공장의 단지명, 회사명, 생산품 등 항목을 제공을 하고 있습니다. 본 공공데이터를 통하여 서구 지역 내 공장의 분포와 산업 구조를 손 쉽게 파악할 수 있을것이며, 이를 통하여 공장등록 관리, 산업단지 조성계획 수립 등 다양한 행정업무를 체계적으로 수행할 수 있도록 도움을 줄 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
