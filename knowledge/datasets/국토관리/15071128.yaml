description_portal: 2016~2025년 연도별 정보공개 포털 등을 통해 주택도시보증공사로 접수된 정보공개 청구 및 처리 현황을 제공합니다.해당 정보를 통해 우리 공사의 정보공개 전체 청구건수, 공개, 비공개, 부분공개, 그 외로 처리된 청구 건수의 통계를 확인할 수 있습니다.  해당 정보는 우리 공사가 정보공개시스템을 통해 처리한 정보공개 청구건수를 공개, 비공개, 부분공개와 그 외 처리한 데이터를 추출하여 제작되었습니다. 공개는 데이터를 공개하거나, 즉시 공개한 경우, 비공개는 해당 정보를 법률에 정한 사유에 해당됨을 이유로 비공개한 경우, 부분공개는 청구정보에 대해 일부는 공개하고 일부는 비공개했을 경우 집계됩니다.그 외 처리한 데이터는 부존재, 진정질의처리, 종결 등을 포함합니다.
