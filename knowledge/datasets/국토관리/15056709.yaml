summary_user: 국토교통부가 브이월드(vworld.kr) OGC API로 제공하는 행정구역도 중 리 단위 경계 공간정보로, 범위는 전국이고 행정단위는 읍면동으로 기재돼 있다. 지도 서비스 개발자나 분석가가 특정 리의 경계와 이름(국문·영문·전체 명칭)을 조회해 지도에 표시하는 데 쓴다. 필드에 리 코드(li_cd)가 있으나 실측에서 전역 조인 키는 찾지 못해, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 잇는다.
limits: vworld.kr 인증키(query 파라미터 key)가 필요하며 포털 활용신청과는 별개다. 전역 조인 키가 없어 타 데이터와 자동 결합은 안 되고 이름·코드 매핑을 따로 해야 한다. 갱신 주기와 건수는 근거가 없어 확인되지 않는다.
