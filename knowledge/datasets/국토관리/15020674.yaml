summary_user: 수원시 안의 지식산업센터를 건물 한 동씩 담은 목록으로, 센터명·지번/도로명 주소·위도·경도와 함께 건축연면적, 준공일, 지하·지상 층수, 입주업체 수, 고용효과, 관리기관·연락처를 기록한 약 6KB 분량의 작은 CSV 파일이다. 수원에서 사무실이나 도시형 공장 입주 공간을 찾는 사업자, 또는 지식산업센터별 입주업체·고용 규모를 비교하려는 산업정책 분석가가 "수원 어느 지역에 어떤 규모의 센터가 있고 얼마나 차 있나"를 확인하는 데 쓴다. 실측 컬럼에 건물관리번호 같은 전역 조인 키가 없어 건축물대장이나 다른 시군구의 지식산업센터 파일과는 주소·좌표나 센터명 매칭으로 이어 써야 한다.
description_portal: 경기도 수원시 지식산업센터 현황정보(센터명, 주소, 우편번호, 위도, 경도, 건축연면적, 준공일, 건물층, 입주업체수, 고용효과, 관리기관, 연락처) 제공하는 데이터입니다. 지식산업센터는 지식 기반 산업 및 정보통신, 제조벤처 기업 등을 위한 업무시설 복합단지입니다. 국토교통부령으로 정하는 시설을 말하며, 지식산업, 정보통신산업 및 제조업을 영위하는 자가 입주할 수 있도록 일정한 요건을 갖춘 다층형 집합 건축물입니다. 산업정책 수립, 기업 지원, 민간 서비스 개발 등 다양한 분야에서 폭넓게 활용할 수 있습니다.
