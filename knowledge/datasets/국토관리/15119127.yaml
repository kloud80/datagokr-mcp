summary_user: 전북특별자치도 진안군 도시계획정보시스템(UPIS)에 등록된 교통시설 이력을 도형 단위로 담은 파일로, 공간정보관리번호별 좌표 범위(X·Y 최솟값·최댓값), 도면번호, 라벨명, 도형 면적과 길이를 담는다(CSV 453바이트 규모의 소량 자료). 진안군의 도로 등 도시·군계획 교통시설이 어느 도면에 어떤 이름으로 어느 위치·면적으로 결정됐었는지 확인하려는 분석가나 토지 관련 사업자가 쓴다. 다른 데이터와 바로 잇는 전역 조인 키는 없어, 좌표 범위로 공간 중첩하거나 라벨명·도면번호를 같은 진안군 UPIS 자료와 이름으로 맞춰 연결한다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 교통시설 이력에 대한 공공데이터 자료입니다. 이번 자료에서는 공간정보 관리 번호, X 좌표 최솟값, Y 좌표 최솟값, X 좌표 최댓값, Y 좌표 최댓값, 도면번호, 라벨 명, 면적(도형), 길이(도형) 정보를 제공합니다. 이 자료를 통해 교통시설 이력에 관한 공간 정보 관리 번호와 도형에 대한 면적과 길이가 각각 얼마인지 확인 할 수 있습니다. 또한 도면번호에 맞는 라벨 명이 무엇인지 알아볼 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다.
