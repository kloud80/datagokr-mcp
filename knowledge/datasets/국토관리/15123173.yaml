summary_user: 경기도 광주시 도시계획정보시스템에 등록된 개발행위허가 제한지역을 지역(도형)별로 한 행씩 담은 시군구 범위 파일로, 제한지역 명칭(라벨명)·면적·경계 길이·등록일시를 포함하며 파일 크기는 286바이트로 매우 작다. 광주시에서 토지를 개발하거나 건축하려는 사업자·토지주가 '이 지역이 개발행위허가 제한지역으로 묶여 있는가, 면적은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없고 시군구코드·시군구명으로만 같은 기관의 다른 도시계획정보나 시군구 단위 통계와 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 개발행위 허가제한지역 현황 정보를 제공합니다. 도시 계획 수립이나 재해 예방 등을 위해 일정 기간 동안 건축 및 개발 행위를 제한하는 지역의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 지역을 고유하게 식별하며, 라벨명은 제한지역의 명칭을 나타냅니다. 면적은 제한지역이 차지하는 면적을 제공하고, 길이는 경계선의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 개발 행위 허가 심사, 건축 인허가 관리, 토지 이용 규제, 도시 계획 수립, 무분별한 개발 방지 등에 활용됩니다.
