summary_user: 경기도 파주시 도시계획정보체계(UPIS)의 용도지역·용도지구·도시계획시설·지구단위계획 결정조서와 고시, 도로·교통·방재 등 기반시설 현황 테이블을 원시데이터 그대로 묶은 파일로, 파주시 범위의 필지·구역 단위 결정 기록(위치명·구역명, 변경 전후 면적, 도로 너비·시점·종점 등)을 담는다. 개발사업자나 도시계획 분석가가 '파주시 어느 구역에 어떤 용도지역·지구단위계획 결정이 고시됐고 면적이 어떻게 바뀌었나'를 확인해 개발 가능성을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위치명·구역명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓰며, 파일 안에서는 기록코드·상위기록코드·공고코드로 결정조서와 고시를 서로 연결한다.
limits: 법정동코드나 PNU 같은 전역 조인 키가 없어 토지대장·건축물대장 등과 바로 결합되지 않는다. 명세상 연간·이벤트 주기로 생성 후 고정되는 파일이라 최신 결정·고시가 바로 반영되지 않을 수 있다.
