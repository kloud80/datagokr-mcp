summary_user: 여수시가 직접 관리하는 농업용 저수지를 저수지 한 곳당 한 행으로 정리한 목록 파일로, 소재지(읍면·리동)와 유효저수량·인가면적·수혜면적·유역면적, 제방 길이·폭·높이, 축조년도를 담는다. 농업 정책 담당자나 분석가가 '여수시의 어느 읍면에 오래되고 규모가 큰 농업용 저수지가 있고, 각각 얼마나 넓은 농지에 물을 대는가'를 확인하는 데 쓴다. 전역 조인 키나 저수지코드가 없어 다른 저수지·저수율 데이터와는 저수지명과 읍면·리동 이름을 맞춰 연결해야 한다.
description_portal: 여수시에서 직접 관리하고 있는 농업용 저수지에 대한 종합적인 목록을 작성할 때에는, 단순히 저수지 이름만 나열하는 수준을 넘어서 각 저수지별로 유효저수량과 인가면적, 실제로 농업에 혜택을 주는 수혜면적, 그리고 유역면적과 같은 수문학적 특성을 포함하여 기록해야 한다. 또한 저수지의 물리적 구조를 파악할 수 있도록 길이와 폭, 높이 등 주요 치수를 함께 표기하고, 해당 저수지가 언제 축조되었는지를 알 수 있도록 축조년도까지 체계적으로 정리하여야 한다. 이러한 방식으로 자료를 구성하면 여수시의 농업용 저수지 현황을 보다 명확하게 파악할 수 있으며, 향후 농업 정책 수립이나 수자원 관리 계획을 세울 때에도 중요한 기초 자료로 활용될 수 있다
