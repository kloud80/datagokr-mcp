description_portal: 본 데이터는 한국수자원공사가 관리하는 국가상수도 내 수도계량기 보급 현황을 정리한 것이다. 전국 지방자치단체별로 총 수도계량기 수, 배수관 및 수도관 연장당 계량기 수, 그리고 13mm 계량기의 설치율 등을 포함하고 있다. 이를 통해 지역별 상수도 기반시설 보급 현황 및 계량기 설치 밀도를 파악할 수 있다. 해당 정보는 수도시설의 운영 효율성 제고와 정밀한 수용가 관리 기반 마련에 활용될 수 있으며, 계량기 보급 수준은 수도 행정의 정합성과 유지관리 체계 개선에 있어 주요한 참고지표로 기능한다. 지역 간 기반시설 격차 분석, 교체 계획 수립 등 정책 수립의 기초자료로도 제공이 가능하다.
