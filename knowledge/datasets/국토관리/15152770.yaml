summary_user: 안양시에서 진행 예정이거나 진행 중인 도로굴착 공사를 건별로 담으며, 공사명·업체명·업체 전화번호·공사주소·공사 시작일과 완료일·공사지역 중점 좌표(EPSG:5186)를 제공한다. 시민이나 물류·운송 사업자가 '이번 주 우리 동네 어느 도로에서 굴착 공사가 언제까지 이어지는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 공사주소(JYG_LOC)나 중점 좌표를 이용한 공간 매칭, 또는 같은 안양시 기관 데이터와의 이름 매핑으로만 이어 쓴다.
limits: 표준 행정코드나 공통 키가 없어 다른 데이터셋과 바로 결합할 수 없고, 주소 문자열이나 좌표로 직접 매칭해야 한다. 좌표가 EPSG:5186이므로 위경도 기반 지도에 올리려면 좌표 변환이 필요하다. 범위는 안양시 한 곳뿐이라 다른 시군구 공사 현황은 담겨 있지 않다.
