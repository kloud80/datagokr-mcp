summary_user: 진주시 관내에서 추진 중인 도시개발사업을 사업(구역) 한 건당 한 행으로 담은 파일로, 단계·구역명·위치·면적(제곱미터)·시행자·사업방식(수용·사용 또는 환지)·구역지정일을 담는다(포털 설명상 초전신도심 1단계·판문지구·초전남부1지구·도동지구 등, 파일 크기 633바이트). 진주시에서 어떤 도시개발구역이 공공·민간 중 누구에 의해 어떤 방식으로 추진되는지 확인하려는 주민·부동산 사업자·지역 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 구역명·위치 주소를 이름으로 맞추거나 같은 기관(진주시) 자료끼리만 연결한다.
description_portal: 2025년 기준 진주시 관내에서 진행하고 있는 도시개발사업에 대한 현황입니다. 초전신도심(1단계) 개발사업은 수용 또는 사용 방식으로 현재 공공에서 진행하고 있으며 판문지구 개발사업은 수용 또는 사용 방식이며 민간에서 진행하고 있으며 초전남부1지구 개발사업과 도동지구 개발사업은 환지방식으로 민간에서 현재 사업을 위해 행정절차 진행하고 있는 도시개발사업입니다. 진주시 관내 추진 중인 도시개발사업의 단계, 구역명, 위치, 면적, 시행자, 지정일, 사업방식 등의 정보를 제공합니다.
