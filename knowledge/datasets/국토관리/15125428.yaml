summary_user: 충주시에 접수된 개발행위허가(협의) 신청 건을 허가 한 건마다 담은 원천 목록 파일로, 허가번호·소재지·허가면적·용도·허가일·준공일을 담는다. 토지 소유자나 개발사업자, 도시계획 분석가가 '충주시에서 어느 지역에 어떤 용도의 개발허가가 났고, 허가 뒤 준공까지 얼마나 걸렸나'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 소재지 주소를 매칭하거나 같은 기관(충주시) 기준으로만 이어 쓴다.
description_portal: 본 데이터는 충청북도 충주시 내에서 접수된 개발행위허가(협의) 신청 건에 대한 허가 현황을 제공하는 자료로, 허가번호, 소재지, 허가면적, 용도, 허가일, 준공일, 데이터 기준일 등의 항목으로 구성되어 있음. 이를 통해 지역 내 토지 및 건축 관련 개발행위의 허가 진행 상황을 파악할 수 있으며, 허가일과 준공일을 비교하여 사업 진행 속도나 준공 여부를 확인할 수 있음. 해당 데이터는 도시계획 수립, 토지이용 관리, 개발사업 모니터링, 인허가 절차 투명성 확보, 환경영향 평가 기초자료 등으로 활용될 수 있으며, 장기적 추이를 분석하면 지역 내 개발 수요와 패턴을 진단하는 데에도 유용함.
