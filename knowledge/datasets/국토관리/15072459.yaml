summary_user: 한국토지주택공사가 2016~2025년에 입찰 방식으로 공급한 토지(용지) 공고를 공고·필지 단위로 담은 원천 목록으로, 지역본부·사업지구·블록·획지위치·공급용도·공급예정금액·입찰 접수 및 개찰 일정을 포함한다. 사업자나 분석가가 "어느 사업지구에서 점포겸용 택지나 근린생활시설 용지가 얼마의 예정금액으로 입찰에 나왔는가"를 확인하거나 지역본부별 용지 공급 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업지구명·지번(예정지번·확정지번) 같은 이름 매핑이나 같은 기관(LH) 자료로만 연결한다.
description_portal: 한국토지주택공사에서 2016년~2025년 간 입찰 방식으로 공급한 토지 공고 내역(지역본부, 공고명, 사업지구, 공급용도, 공급금액 등) 정보를 제공합니다. 16~25년까지의 공고중 경기남부지역본부는 5336건(24.6%), 경기북부지역본부는 3666건(16.9%), 대구경북지역본부는 1906건(8.8%)입니다.  입찰추첨 방식은 전체 공급방식 중 7.3%의 비율을 가지고 있습니다. 공급용도로써는 실수요자택지 점포겸용이 32.8%, 근린생활시설이 19.5%, 일반상업용지가 12.9%으로 가장 많은 용도를 차지하고 있습니다.
