description_portal: '충청북도내 총괄, 건축구분별, 건축주체별, 주거유형별 건축 허가 착공 통계에 대한 데이터를 공개합니다. 시트에 나와있는 숫자의 단위는 (단위 : 건수,동수,㎡ 제곱미터)입니다.건축착공은 건축허가를 받은 이후 실제로 공사가 시작되는 시점을 말합니다. 이는 통계적으로 "공사 시작"이 실제 이뤄진 건축물의 수와 면적을 반영합니다.허가가 실질적인 공사로 이어지고 있는지, 시공 활동의 활성 정도를 판단할 수 있습니다.세부내용으로는 충청북도의 건축종별, 시군용도별, 용도별, 사업주체별, 세부용도별 현황 자료를 제공합니다.'
