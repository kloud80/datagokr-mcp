summary_user: 광주 광산구 관내 공가·폐가를 건축물 한 건씩 행정동, 구조, 연면적, 층수·동 수, 관리 등급, 농촌지역 여부와 함께 담은 파일(CSV)로, 범위는 광산구 한 개 시군구이고 위치는 읍면동 단위까지만 적혀 있다. 도시재생이나 방범·안전 담당자, 지역 분석가가 "광산구 어느 동에 관리 등급이 나쁜 빈집이 몰려 있나" 같은 질문에 쓴다. 전역 조인 키(법정동코드·건물관리번호 등)는 없어서, 다른 데이터와는 행정동 이름을 맞춰 붙이거나 같은 기관 자료와만 연결된다.
description_portal: '광주광역시 광산구 관내 각 동(행정동)별 공가 및 폐가 현황에 대한 정보를 제공합니다. 본 자료에는 해당 건축물의 행정동 위치를 비롯하여 구조, 연면적, 층수 및 동 수, 관리 등급, 농촌지역 여부 등의 세부 항목이 포함되어 있으며, 광산구 지역 내 유휴 주거자산에 대한 종합적인 현황 파악과 활용을 위한 기초자료로 활용될 수 있습니다. 특히 이 데이터는 도시 재생, 주거환경 개선, 방범 및 안전 대책 수립 등 다양한 정책 수립과 실행에 유용하게 쓰일 수 있습니다. 다만, 일부 항목의 경우 실제 현장 조사를 통한 정보 수집이 어려운 지역이나 상황에 따라 데이터 확보에 제한이 있어, 일부 내용이 누락되었거나 공란으로 처리된 경우가 있습니다. 따라서 해당 정보를 활용하실 때에는 이러한 점을 고려하여 주시기 바랍니다. 본 자료는 정기적으로 갱신되며, 지역의 공가 및 폐가 관리와 정책 수립에 도움이 되는 기초정보로 제공됩니다.키워드 : 공가, 폐가, 도시계획, 주거환경, 지역도심, 건축물'
