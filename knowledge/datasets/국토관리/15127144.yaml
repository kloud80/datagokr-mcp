summary_user: 부천시 전역의 오피스텔과 다세대·다가구 등 도시형생활주택을 건물 한 동씩 담은 현황 파일로, 건물명·도로명주소·대지면적·건축면적·주용도와 세부용도·지하/지상 층수·세대수를 포함한다. 1~2인 가구용 주거를 찾는 사람이나 분석가가 '부천시에서 오피스텔·도시형생활주택이 어느 동네에 몰려 있고 규모(세대수·층수)는 어떤가'를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소(소재지도로명주소)를 주소 매칭하거나 건물명을 맞춰 이어 써야 한다.
description_portal: 경기도 부천시 전역에 위치하고 있는 오피스텔(업무시설) 및 다세대 주택, 다가구 주택 등 도시형 생활 주택의 현황 정보로서 건물 명칭, 위치, 용도, 건축면적, 연면적, 대지면적, 도로명주소, 층수 등의 해당 건축물의 주요 정보를 제공하고 있습니다. 해당 데이터는 자취생 및 신혼부부 등 1~2인 가구가 늘어남에 따라 필요한 해당 주거 형태의 세부 자료 데이터화 하여 각종 건축물 정보 활용에 기여할 수 있습니다.※오피스텔의 우편번호는 시에서 관리하고 있지 않은 데이터이므로 이 점 양해하여 주시기 바랍니다.
