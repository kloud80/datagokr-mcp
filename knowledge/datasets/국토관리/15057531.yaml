summary_user: 경기도에서 선정된 평생학습마을을 마을 한 곳당 한 행으로 담은 현황 목록으로, 시군, 마을명, 수행기관, 관련부서, 전화번호, 사업개시년도가 들어 있다. 평생교육 담당자나 분석가가 "우리 시군에는 학습마을이 몇 곳 있고 언제부터 어느 기관이 운영하나"를 확인하거나 시군 간 학습마을 분포 차이를 볼 때 쓴다. 전역 조인 키는 없어서, 시군명·시군코드(SIGUN_CD)를 이름·코드로 맞춰 경기도의 다른 시군별 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 선정된 평생학습마을에 대한 시군별 현황을 수록한 자료로, 2024년 7월 3일을 기준으로 수집되었으며 연간 주기로 갱신됩니다. 평생학습마을이란 마을 주민이 직접 참여하여 마을리더, 주민강사, 학습 코디네이터 등으로 성장하며 마을 단위의 학습공동체를 활성화하고 지역 인재를 육성하여 자치역량을 강화하는 것을 목표로 운영되는 공동체입니다. 데이터에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 마을명(VILAGE_NM), 수행기관명(EXECUTN_INST_NM), 관련부서명(RELATE_DEPT_NM), 전화번호(TELNO), 사업개시년도(BIZ_BEGIN_YY) 등의 항목이 포함되어 있어 행정단위별 사업 운영현황과 학습마을의 분포를 확인할 수 있습니다. 본 자료는 경기도 전역의 평생교육 정책 수립, 교육 자원 배분, 지역 학습 격차 분석 등에 유용하게 활용될 수 있으며, 주민 주도의 자치형 교육모델 확산, 지역 공동체 활성화, 주민 일자리 창출 등의 기대효과를 갖고 있습니다. 특히 수행기관과 연계 부서 정보는 각 마을의 운영 책임기관을 확인하는 데 도움이 되며, 마을별 전화번호를 통해 현장 연결성도 확보됩니다. 또한 이 데이터는 Open API를 통해 제공되어 실시간으로 정보 조회가 가능하고, 연구기관, 공공기관, 교육지원청 등에서 지역 평생교육 거버넌스 구축 자료로 폭넓게 활용할 수 있습니다.
