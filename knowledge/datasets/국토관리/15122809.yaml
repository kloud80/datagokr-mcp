summary_user: 한국토지주택공사가 시행한 보상공고를 공고 단위(보상공고일련번호)로 담은 파일로, 사업지구코드·사업지구명과 보상 시작일·종료일이 들어 있고 범위는 전국이며 공간 좌표는 없다. 토지 소유자나 분석가가 특정 LH 사업지구의 보상이 언제 시작해 언제 끝나는지, 또는 랜드뱅크 지구(코드 첫 자리 3)와 일반·특수 지구의 보상 일정을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업지구명 매칭이나 LH의 같은 사업지구코드 체계를 쓰는 자료로만 잇는다.
description_portal: 한국토지주택공사에서 시행한 보상공고 현황(사업지구코드, 사업지구명, 보상시작일자, 보상종료일자 등)의 정보를 제공합니다. 일반적으로 보상 기간은 일년을 넘지 않으며 사업지구 코드의 경우 유형에 따라 첫번째 숫자가 1,3,9로 나뉘어집니다. 1번대의 경우 일반적인 사업 보상 지구에 해당하며 3번대의 경우 LB(랜드뱅크)에 해당하는 보상지구입니다. 9번대의 경우 강 유역, 우회도로, 수탁보상, 융합센터, 복합타운과 같이 특수지구에 해당합니다. 랜드뱅크제도는 토지비축제도로  정부가 도로나 산업단지 등을 건설하려는 지역의 땅을 미리 사들여서 비축함으로 보상 지연을 방지할 수 있습니다.
