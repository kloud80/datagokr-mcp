summary_user: 여수시 화양면 화동리 일원 화양농공단지에 입주한 업체를 한 행씩 담은 명단 파일로, 회사명과 공장 도로명주소, 데이터기준일로 구성되며 파일 크기는 1.5KB 남짓한 소규모입니다. 구직자나 영업 담당자가 '화양농공단지에 어떤 회사들이 들어와 있고 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 공장 등록 현황이나 다른 산단 입주기업 자료와는 회사명이나 도로명주소를 맞춰 이어 써야 한다.
description_portal: 화양농공단지는 농촌의 농외소득 증대 및 지역의 균형 발전을 위해 1992년 여수시 화양면 화동리 2140번지 일원에 조성된 농공단지입니다. 화양농공단지 관리권자는 여수시장이며, 관리기관은 입주기업들로 이루어진 화양농공단지 협의회입니다. 제조업 공장이 입주 가능하나 현재 악취관리지역으로 지정되어 있어 화학과 폐기물 업종은 조건에 따라 일부 입주가 제한됩니다.개방 데이터는 입주기업체명과 주소이며 해당 데이터를 통해 화양농공단지 내 입주기업 현황을 확인할 수 있습니다.
