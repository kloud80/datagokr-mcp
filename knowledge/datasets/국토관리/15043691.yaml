description_portal: 공동주택 시공중 현황 데이터는 관할 구역 내에서 추진 중인 공동주택 건설사업의 진행 현황을 체계적으로 제공하기 위한 자료이다. 본 데이터에는 각 사업장의 착공일, 사용검사일, 대지위치, 건물명, 층수, 세대수, 연면적, 사업주체, 시공자, 감리자 정보가 포함되어 있으며, 공동주택 건설사업의 기본 현황과 사업 규모를 종합적으로 파악할 수 있도록 구성되어 있다. 착공일과 사용검사일을 통해 사업의 추진 시기와 준공 예정 또는 완료 시점을 확인할 수 있고, 대지위치와 건물명은 사업 대상지와 사업명을 식별하는 기준으로 활용된다. 또한 층수, 세대수, 연면적은 건축물의 규모와 주거 공급 수준을 판단하는 주요 지표이며, 사업주체, 시공자, 감리자 정보는 사업 시행 및 시공·감리 책임 주체를 확인하는 데 활용된다. 이 자료는 공동주택 공급 현황 파악, 주택정책 수립, 도시계획 및 건축행정 지원, 지역 내 주거개발 동향 분석, 민간의 부동산 정보 활용 등에 기초자료로 활용될 수 있다. 아울러 시민에게 공동주택 건설 관련 정보를 투명하게 제공함으로써 행정의 신뢰성을 높이고, 관련 사업에 대한 접근성과 활용성을 제고하는 데 목적이 있다.
