summary_user: 경기도 여주시 일반건축물의 물건지(소재지)별 연면적과 기준일자 시점의 시가표준액을 담은 건별 파일 데이터로, 범위는 여주시 한 개 시군구이며 CSV 약 28MB 규모입니다. 취득세 과세표준을 가늠하려는 건물 소유자·매수자나 여주시 건축물의 면적 대비 과세 기준가를 비교하려는 분석가가 "이 건물의 시가표준액은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 물건지 주소 문자열 매칭이나 자치단체코드(같은 기관 코드)로만 이어 쓴다.
description_portal: 일반건축물에 대한 자치단체코드, 물건지, 연면적, 기준일자, 시가표준액 등의 정보는 건축물 및 부동산 관련 행정 업무나 등기, 세금 부과, 자산 평가 등에 사용되는 데이터입니다.  물건지는 건축물이나 토지의 고유 식별 정보로, 연면적은 건축물의 총 바닥 면적을 의미합니다.  시가표준액은 취득세의 과세표준을 정하는 기준으로, 신고가액이 시가표준액에 미달하는 경우 시가표준액을 과세표준으로 보는 규정입니다.기준일자는 해당 정보가 유효한 시점을 나타내며, 시가표준액은 과세나 평가 기준이 되는 표준 시가를 의미합니다. 이 모든 정보는 부동산 거래, 평가, 관리, 세무처리 등 다양한 분야에서 활용됩니다.
