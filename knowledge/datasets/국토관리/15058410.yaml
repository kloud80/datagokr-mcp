summary_user: 국토계획법과 개별 법령·도시(군)계획조례가 정한 토지이용행위 규제를 지역지구(용도지역·지구·구역)별로 토지이용행위와 그 가능 여부로 연결해 담은 행위제한 정보이며, 전국 범위를 시군구 단위로 조회한다. 건축주·부동산 사업자·분석가가 '이 지역지구에서 특정 건축이나 영업 행위가 허용되는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 지역지구코드(UCODE_REF_LAW_CD)·지역지구명과 토지이용행위코드(LUN_CD)를 다른 토지이용계획 자료와 이름·코드로 맞춰 이어 쓴다.
description_portal: 국토의 계획 및 이용에 관한 법률 및 각 개별 법령과 관련된 도시(군)계획조례 및 그 밖에 조례에서 규정하고 있는 토지이용행위 규제 내용에 대하여, 각각 토지이용행위와 가능여부로 연결하고 이를 시군구별/지역지구별로 조회할 수 있도록 구성하여 제공하는 토지이용규제정보 행위제한 서비스입니다.
