summary_user: 전북특별자치도 무주군 6개 읍면(무주읍·무풍면·설천면·적상면·안성면·부남면)의 강우량(적설량)을 날짜(연월일)별로 한 행에 나란히 담은 작은 CSV 파일(약 2KB)입니다. 무주군 주민이나 방재·농업 분석가가 '특정 시기 무주군 어느 면에 비가 얼마나 왔나'를 읍면끼리 비교하거나 연도별 통계로 볼 때 쓴다. 실측 컬럼에 관측소코드 같은 전역 조인 키가 없어서, 다른 수문 자료(WAMIS 관측소 시계열 등)와는 읍면 이름이나 날짜를 기준으로 직접 맞춰 이어 써야 한다.
description_portal: 전북특별자치도 무주군에 존재하는 지역별  강우량 현황을 년단위로 분류하여 파일데이터로 제공하고 있습니다.연월일, 무주읍, 무풍면, 설천면, 적상면, 안성면, 부남면, 데이터기준일자로 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다.2022년 9월부터매월 각 읍면별 데이터를 관측시스템으로부터 데이터를 수신받아 작성한 자료로서, 강우량(적설량)을 확인 할 수 있으며, 이는 통계자료로 활용할 수 있는 자료입니다.해당 데이터는 전북특별자치도 무주군 산업건설국 안전재난과 재난방재팀에서 관리하고 있으며 자세한 내용은 063-320-2265(안전재난과)로 연락주시면 됩니다.
