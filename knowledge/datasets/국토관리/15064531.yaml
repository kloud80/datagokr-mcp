summary_user: LH가 관리하는 행복주택 단지별·공급계층(고령자·청년·신혼부부 등)별로 6개월 이상 비어 있던 주택 수를 2017년 12월 말부터 2020년 6월 말까지 분기 말 기준으로 집계한 현황 파일이며, 포털 설명상 424건이다. 정책 분석가나 연구자가 '어느 행복주택 단지의 어떤 공급계층에서 장기 공가가 많았고 분기별로 어떻게 변했나'를 살펴 수요 미달 원인이나 공급계층 배분을 검토하는 데 쓴다. 전역 조인 키가 없어 다른 행복주택·공공임대 자료와는 단지명을 이름으로 맞추는 방식으로만 이어 쓴다.
limits: 2020년 6월 말까지만 담은 1회성 자료로 정해진 갱신 주기가 없어 현재 공가 상황과 다를 수 있다. 단지 코드·주소 같은 표준 키가 없어 다른 데이터와 연결할 때 단지명 표기 차이를 직접 맞춰야 한다.
