summary_user: 인천 계양구 안의 공동주택을 건물(동) 단위로 한 행씩 담은 파일로, 법정동·본번·부번 지번과 건물명·동명칭, 주용도·기타용도, 세대수, 지상·지하 층수, 사용승인일을 담는다. 주민이나 분석가가 '계양구 어느 동에 언제 사용승인된 몇 세대 규모 아파트가 있는가'처럼 지역 공동주택의 위치·규모·노후도를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군구명·법정동명·본번·부번을 지번 주소로 만들어 건축물대장이나 공동주택 관리 데이터와 이름·주소 매칭으로 연결한다.
limits: 범위가 계양구 한 시군구에 한정되어 인천 전체나 다른 지역과 비교하려면 다른 기관 파일을 따로 모아야 한다. 법정동코드나 건물관리번호 같은 공통 키가 없어 다른 데이터와 붙일 때 주소·건물명 문자열을 맞추는 작업이 필요하다.
