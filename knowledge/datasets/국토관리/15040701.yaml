description_portal: '전기용품 및 생활용품 안전관리법, 어린이제품안전 특별법 등 KC 인증제품에 대한 제조공장 등을 확인할 수 있는 정보를 제공합니다. 본 데이터는 안전 인증을 받은 제품을 생산하는 제조공장의 기본 정보를 제공하는 데이터입니다. 소비자, 기업, 관계 기관 등 제조공장 정보를 기반으로 인증제품의 생산 과정과 안전 점검을 수행하는 데 도움이 될 수 있습니다.* 다만, 해당 정보는 API(API 데이터 목록명: 산업통상자원부 국가기술표준원_제품 안전인증 및 리콜 정보)로 제공되고 있는 바, 최근 데이터 수정일 이후 최신 정보를 확인하시고자 하는 분들은 API 데이터를 활용해주시길 바랍니다.'
