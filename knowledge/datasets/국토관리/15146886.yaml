summary_user: '각 지방자치단체가 도시관리계획으로 결정한 산림·기타 용도지역지구의 구역 정보를 국토교통부가 전국 단위로 취합해 시도별 공간파일(SHP)로 담는다. 특정 토지나 지역이 산림·기타 용도지역지구로 묶여 있는지, 언제 고시됐는지(NTFDATE)를 확인하려는 토지 소유자·개발 사업자·토지이용 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했다. 그래서 다른 용도지역지구 데이터나 행정구역 데이터와는 지역 이름·코드 매핑(예: 시군구 구분 필드)이나 같은 기관 코드로만 이어 쓴다.'
limits: vworld.kr에 로그인해 공간정보 다운로드 페이지에서 시도별 파일을 받는 방식이다. 포털 활용신청이나 인증키 기반 API 호출로는 받지 않는다. 전역 조인 키가 없어 필지·건물 등 다른 데이터와 바로 붙일 수 없고, 연결하려면 공간 중첩이나 이름·코드 매핑이 필요하다.
