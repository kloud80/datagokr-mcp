summary_user: 경기도 여주시 안의 창고시설을 한 건씩 담은 파일로, 시설별 건축구분, 지번주소, 대지·건축·연면적, 건폐율·용적률, 주용도·부속용도를 기록한다. 여주시에서 물류·창고 입지를 검토하는 사업자나 분석가가 "어느 지역에 어느 규모의 창고가 몰려 있고 건폐율·용적률은 어느 수준인가"를 살필 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 지번주소를 이름 매칭하거나 같은 기관(여주시) 자료끼리 맞춰 연결한다.
limits: 표준 코드 같은 공통 키가 없어 건축물대장 등과 바로 결합되지 않고, 주소 문자열 매칭에 기대야 한다. 명세상 수시·이벤트성 생성 자료라 정기적으로 갱신되는 현황으로 보기 어렵고, 범위는 여주시 한 곳에 한정된다.
