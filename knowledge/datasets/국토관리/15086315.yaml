summary_user: 한강홍수통제소가 홍수 예측에 쓰는 수위관측소별 하도 단면 자료로, 관측소마다 적용 기간(적용 시작·종료 일자) 안에서 측점 일련번호별 거리와 표고를 담은 건별 원천 파일(CSV 약 265KB)입니다. 하천 기술자나 홍수 분석가가 '이 수위관측소 지점의 강바닥과 제방 높이는 어떤 모양이고, 특정 수위에서 물이 어디까지 차는가'를 따질 때 쓴다. 전역 조인 키는 없고 수위관측소명으로만 이어지므로, 같은 기관의 수위 관측·홍수 예보 지점 자료와 관측소 이름을 맞춰 연결해야 한다.
description_portal: 한강홍수통제소에서 수문자료를 관측, 수집 중인 수위관측소 별 예측수문 단면자료입니다. 수위관측소 코드/명, 적용 시작 일자, 적용 종료 일자, 일련번호, 거리, 표고 데이터를 제공합니다.하도 단면(River Cross-section)은 하천의 흐름 방향과 수직이 되도록 자른 단면을 의미합니다. 쉽게 말해, 하천의 특정 지점에서 강 양쪽 기슭을 잇는 선을 따라 땅을 파낸 것처럼 보았을 때 나타나는 모양입니다.하도 단면은 하천의 상태를 파악하고 관리하는 데 있어 가장 기초적이면서도 중요한 자료입니다.
