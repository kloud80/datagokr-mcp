summary_user: 청약홈이 일반공급 접수를 대행한 일반분양 단지의 당첨자 수를 모집공고일이 속한 연월별로 집계해 30대 이하·40대·50대·60대 이상 네 연령대로 나눠 담은 전국 단위 월별 집계 파일입니다. 청약 연령 구조를 보는 분석가나 정책 담당자가 '최근 몇 년 사이 30대 이하 당첨자 비중이 늘었는가'처럼 세대별 당첨 추이를 확인하는 데 쓴다. 지역·단지 코드 같은 전역 조인 키가 없어 다른 청약 경쟁률·당첨 통계와는 연월 기준으로만 맞춰 이어 쓴다.
