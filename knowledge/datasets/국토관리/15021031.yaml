description_portal: 한국국토정보공사에서 보유하고 있는 지적측량 및 공간정보에 관련된 지식재산권(특허)의 등록 현황 데이터 입니다. 2015년도 부터 현재까지의 등록된 특허에 대한 출원번호, 발명의 명칭, 상태, 출원일자, 등록번호, 등록일자를 포함하고 있습니다. 등록된 정보를 통해 특허청에서 운영하는 "특허로", 또는 지식재산정보 검색 서비스 "KIPRIS"에서 조회가 가능하며, 발명자, 발명에 대한 세부내용, 특허공보, 특허 권리자, 연차 납부료 등 상세정보를 검색하실 수 있습니다. 본 데이터는 연 1회 갱신되며, CSV 형식으로 제공됩니다.
