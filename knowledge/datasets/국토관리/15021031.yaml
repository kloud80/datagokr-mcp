summary_user: 한국국토정보공사가 보유한 지적측량·공간정보 관련 특허를 건별로 담은 CSV 파일로, 2015년 이후 특허의 출원번호·발명의 명칭·상태·출원일자·등록번호·등록일자를 담는다(파일 크기 약 3.6KB의 소규모 목록). 공사가 어떤 측량·공간정보 기술을 특허로 확보했는지, 특정 기술의 출원·등록 시점이 언제인지 확인하려는 연구자·사업자가 쓴다. 다른 데이터와 묶을 전역 조인 키는 없으며, 출원번호·등록번호로 특허청 특허로나 KIPRIS에서 발명자·권리자·공보 등 상세정보를 따로 조회해 잇는다.
