summary_user: 경상북도 안의 국가하천·지방하천을 하천 한 곳당 한 행으로 담은 하천 목록 파일(약 48KB CSV)로, 하천등급, 기점·종점 위치와 경계위치, 지정 근거와 고시일, 본류·1지류·2지류 관계, 하천연장(km)을 담는다. 경북의 어떤 하천이 국가하천인지 지방하천인지, 어느 본류의 지류인지, 시작·끝 지점이 어디이고 길이가 얼마인지를 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키나 하천코드 컬럼이 없어 다른 하천 데이터와는 하천명·본류명 같은 이름 매핑으로만 이어 쓴다.
limits: 하천코드(WAMIS 등) 같은 공통 키가 없어 이름이 같은 하천이나 표기 차이로 연결이 틀어질 수 있다. 좌표·도형이 없는 비공간 목록이라 하천구역 경계나 공간 분석에는 국가공간정보포털 등 공간 데이터를 따로 써야 한다.
