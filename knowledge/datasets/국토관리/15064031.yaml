summary_user: 국토지리정보원 NGTN 지도 플러그인 OpenAPI의 기능을 한 건씩 정리한 명세 파일(CSV, 약 181KB)로, 기능별 고유번호·분류 코드·기능명·설명·입력/반환 파라미터·플러그인 버전·2D/3D 구분·표출 여부를 담는다. 지도 서비스나 3D 시각화 화면을 만드는 개발자가 '카메라 색상 설정이나 줌레벨 조정에 어떤 함수를 어떤 인자로 호출해야 하나'를 찾거나 API 문서·호출 테스트를 자동으로 만드는 데 쓴다. 다른 데이터셋과 이을 전역 조인 키는 없고, 파일 안의 분류 코드(class_cd)와 기능 범주 코드로 기능을 묶어 보는 정도로만 연계한다.
limits: 지리·통계 데이터가 아니라 API 함수 설명서여서 지역 단위 분석에는 쓸 수 없고, 다른 공공데이터와 키로 조인되지 않는다. 분류 코드의 의미를 풀어 주는 코드표가 함께 제공되지 않아 코드 해석은 기능명·설명에 기대야 한다.
