description_portal: 'NGTN(OpenAPI)의 기능별 API 명세를 담은 데이터로, 각 API의 이름, 기능 설명, 입력·출력 파라미터, 분류 코드 등 상세 기술 정보를 포함하고 있으며, 공간정보 기반 서비스 구축을 위한 실질적 연계 개발 자료입니다.1. 형식: CSV2. 내용 요약■ func_sn: 기능별 고유 식별 번호■ class_cd: 기능이 속한 API 분류 코드■ func_ctgry_cd: 하위 기능 범주 코드■ func_nm: API 기능명 (예: XDCameraViewSetColor, SetZoomLevel 등)■ func_dc: 기능 설명 (예: 카메라 색상 설정, 줌레벨 조정 등)■ input_paramtr_dc: 입력 파라미터 설명 (자료형 + 설명)■ return_paramtr_dc: 반환값 정보 (자료형 + 성공여부 또는 반환값 의미)■ plugin_ver: API 적용 플러그인 버전■ func_se: 기능 유형 (예: 2D, 3D, 데이터 처리 등)■ indict_at: 표출 여부 (Y/N)■ regist_date, updt_date: 최초 등록일과 최종 수정일3. 활용 예제■ 공공기관 또는 민간 개발자가 지도 서비스, 재난정보 표출 시스템, 드론 관제 시스템 등을 구축할 때 필요한 API 호출 구성 및 테스트 자동화에 활용■ UI/UX 설계 시, 지도 컨트롤/데이터 조회/3D 시각화 등 기능별 API 카테고리에 따라 메뉴 구조를 설계하거나 기능 분류 체계를 정리하는 기준으로 활용■ 시스템 연동 설명서, API 명세서 자동 문서화 시스템 개발 시 각 API의 명칭, 설명, 입력·출력 항목을 바탕으로 JSON 스키마나 문서화 양식 생성에 활용 가능'
