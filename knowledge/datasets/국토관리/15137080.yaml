summary_user: 전남 영광군의 도시계획 정보를 UPIS에서 연계·수집해 담은 CSV 파일로, 시설별 도면번호·위치, 기정·변경 면적과 증감, 도로 규모(등급·류별·번호)·폭원·연장, 기점·종점, 최초결정일 등 결정조서 항목을 건별로 담는다(압축파일 약 251KB). 영광군에서 특정 도로나 기반시설이 언제 처음 결정됐고 면적·연장이 어떻게 바뀌었는지 확인하려는 사업자나 분석가가 개발 가능성을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시설명·위치명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 전라남도 영광군의 도시계획 정보가 포함된 본 데이터는 UPIS 시스템(DB)에서 연계·수집된 자료로, 각종 지구 현황과 고시, 도로 및 기반시설 현황, 지구단위계획, 준공대장 등의 정보를 통합적으로 제공합니다. CSV 형식으로 제공되며 도시지역·관리지역·자연환경보전지역·공원구역·수산자원보호구역 등의 공간구역, 교통시설·공공문화·방재·환경기초 시설과 같은 공공시설 현황도 포함합니다. 이 데이터는 도시계획 수립, 기반시설 투자 우선순위 설정, 환경보전 전략, 공간정보 기반 분석 및 시각화 등 행정계획과 정책 결정을 지원하는 핵심 자료입니다.
