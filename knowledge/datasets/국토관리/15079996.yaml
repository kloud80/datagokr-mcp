summary_user: 경기도 파주시 일반건축물의 과세년도별 시가표준액과 연면적을 법정동·리, 본번·부번, 동·호 단위 물건지별로 담은 건별 CSV 파일(약 43MB)이다. 파주시 건물 소유자나 분석가가 특정 건물의 재산세 과세 기준 가격이 얼마인지, 지역별로 시가표준액이 어떻게 다른지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 법정동명·본번·부번 같은 주소 정보를 이름으로 맞추거나 자치단체코드로만 건축물대장·공시지가 등 다른 자료와 이어 쓴다.
