summary_user: 충청남도 지방하천의 통합관리 기본계획 현황대장을 담은 파일로, 하천 구간별 토지 지번조서(하천명·구역번호·소재지·지번·지목)와 측량기준점, 하천개수·개수시설물 자료를 건별로 묶어 제공한다. 하천 정비나 토지 보상을 검토하는 공무원·분석가가 '이 하천 구역에 어느 지번 토지가 들어 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 하천명이나 시군구·읍면동·리명과 지번(본번·부번)을 이름 그대로 맞춰 하천코드 목록이나 토지 정보와 이어 써야 한다.
description_portal: 충청남도 지방하천 통합관리 기본계획 수립 및 체계적인 하천 관리를 지원하기 위한 현황대장 정보로, 지번조서, 측량기준점, 하천개수, 하천개수 시설물 등의 세부 자료를 포함하고 있습니다. 지번조서는 하천 구간별 토지 지번 현황을 파악하기 위한 기초자료로 활용되며, 측량기준점 정보는 하천 정비 및 시설물 설치 시 정확한 공간 기준을 제공하는 역할을 합니다. 하천개수 및 하천개수 시설물 정보는 제방, 교량, 수문, 호안 등 하천 정비 현황과 관련 시설물의 위치 및 현황을 종합적으로 관리하기 위한 자료로, 하천 재해 예방, 치수·이수 계획 수립, 유지관리 업무의 효율화를 위한 핵심 기초 데이터로 활용됩니다.
