summary_user: 부산시 건설본부가 추진한 건설공사를 공사 한 건씩 담은 원천 목록으로, 공사명·사업분야·공사기간·총공기와 경과일·계획 대비 달성 공정률·사업비·추진부서와 담당자·감리사·시공사를 포함한다(포털 설명 기준 약 474~480개 공사, 도로/교량·하수처리장·영조물 건립 등 8개 분야). 시민이나 지역 분석가가 "우리 동네 이 공사는 언제 끝나고 공정이 계획보다 얼마나 늦어졌나", "분야별로 진행 중인 공사와 사업비는 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공사명·위치 이름 매칭이나 같은 기관(부산시) 기준으로만 이어 쓰며, 지도 표시용 좌표 필드(marker_x·marker_y)가 있어 위치 기반 중첩에 활용하는 것을 검토할 수 있다.
description_portal: 부산시 건설본부에서 추진한 건설공사 현황 및 건설공사 진행 상황 데이터를 개방합니다.개방된 데이터는 총474건의 공사에 대한 정보를 포함하고 있습니다. 데이터에는 공사명, 공정현황, 총공기, 경과일, 공정률, 공정현황 계획/달성, 사업분야, 공사기간, 사업개요, 추진부서, 담당자, 전화번호사업비, 감리사, 시공사의 데이터가 있습니다사업분야는 도로/교량 건설 93, 택지/산단 조성 9, 하수/폐수처리장 건설 97, 쓰레기 처리사업 7, 영조물 건립 171, 친수공간/공원 조성 47, 하수관로 38 , 기타 18 등 8개 분야 480개 공사현장이 있습니다.*기준일 2025.5.21 현재
