description_portal: 잠재력지표정보는 공공도시재생의 관점에서 인구 구조, 경제활동 수준, 생활 인프라, 주거환경 등 개별 또는 결합 지표를 활용하여 전국 지방자치단체별 도시의 잠재력을 진단하는 데이터임. 시군구 단위로 연도별 데이터가 제공되며, 해당 지역의 발전 가능성과 경쟁력을 정량적으로 평가하는데 활용 가능함. 도시재생사업의 우선순위 설정, 전략 수립, 투자 방향 결정 등 다양한 정책 의사 결정에 활용할 수 있는 자료임.도시재생 종합정보체계 웹사이트(city.go.kr) 內 도시재생 종합정보 개방체계를 통해 CSV파일로 내려받을 수 있으며, 공공데이터 포털을 통한 OPEN API 활용도 가능함.
