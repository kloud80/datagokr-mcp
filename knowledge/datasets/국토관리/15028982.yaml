summary_user: 충청남도 금산군의 금산일반산업단지와 금성·복수·인삼약초특화·추부 농공단지에 입주한 업체를 한 행에 한 기업씩 담은 명단으로, 2025년 10월 기준 80개 기업의 산업단지명·회사명·설립일자·전화번호·종업원수·공장 주소·생산품을 수록한다. 구직자나 영업 담당자가 '금산 농공단지에 어떤 품목을 만드는 업체가 있고 고용 규모는 얼마인가'를 확인하거나, 같은 단지 안에서 협력업체를 찾는 데 쓴다. 사업자번호나 표준 코드 같은 전역 조인 키가 없어 공장 등록 등 다른 데이터와는 회사명·공장대표주소를 이름 맞추기로 연결해야 한다.
description_portal: 충청남도 금산군 농공단지(금산일반산업단지, 금성농공단지, 복수농공단지, 인삼약초특화농공단지, 추부농공단지) 내 입주업체현황에 대한 데이터입니다. 2025년 10월 기준으로 금산군에 위치한 총 80개의 기업의 산업단지명, 회사명, 설립일자, 전화번호, 종업원수, 공장대표주소, 생산품의 정보가 수록되어 있습니다. 기업·사업체는 동일 산업단지 내 입주기업 현황 파악을 통해 협력업체 발굴 및 비즈니스 네트워킹에 활용하고, 투자기관·금융기관은 지역 산업 현황 분석을 통해 투자 및 금융지원 전략 수립에 활용하며, 지방자치단체·산업진흥기관은 산업단지 운영 현황 분석 및 기업 지원 정책 수립, 신규 기업 유치 전략 마련에 활용할 수 있습니다.
