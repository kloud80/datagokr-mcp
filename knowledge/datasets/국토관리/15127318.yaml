description_portal: '세종시설공단이 운영하는 은하수공원의 봉안 시설 이용현황에 관한 월별 통계 데이터를 제공합니다. 이 데이터는 봉안당 이용자들의 거주지역, 이용형태, 요금감면 적용 여부에 따라 세분화된 항목별 집계 정보를 포함하고 있습니다.주요 데이터 구성 항목:거주지역별 분류관내소계: 세종시 거주자의 총 이용 건수관외소계: 세종시 외 지역 거주자의 총 이용 건수이용형태별 분류개인단: 개별 이용자 단위의 봉안 건수부부단 소계: 부부 합장 형태의 총 이용 건수기존부부단: 전통적인 부부 합장 이용 건수개인형부부단: 개인 단위로 구분된 부부 봉안 이용 건수요금감면 적용현황감면소계: 각종 요금 할인 적용 대상자의 총 이용 건수면제: 요금이 전액 면제된 이용 건수50%감면: 이용료의 절반이 할인된 이용 건수이 통계는 매월 단위로 갱신되어 은하수공원 봉안당의 운영현황과 시민 이용패턴을 파악할 수 있는 기초자료로 활용됩니다. 지역별 이용비율, 합장형태별 선호도, 사회적 배려계층에 대한 감면혜택 적용 실태 등을 종합적으로 분석할 수 있는 데이터셋'
