summary_user: 인천광역시 도시기반시설물시스템의 주민등록 인구를 수집년월별로 시군구·법정동·행정동·통 단위에서 남녀 인구와 10세 구간(만0-9세~만100세 이상) 성별 인구로 집계한 파일(csv 약 327KB)이다. 도시계획·생활SOC 담당자나 분석가가 특정 법정동의 고령 인구 비중이나 아동 인구 규모를 확인해 공원·복지시설 같은 도시계획시설 수요를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 법정동명·행정동명 같은 이름 매핑이나 같은 기관의 코드로만 이어 쓴다.
description_portal: 인천광역시 도시기반시설물시스템 내 법정구역 성연령별 주민등록 인구수를 제공하고 있습니다. 항목 구성은 법정동명, 법정기관코드, 연령별 남자여자 인구수 등으로 구성되어 있습니다.이 데이터는 인천광역시의 각 법정동별 주민등록 인구 현황을 성별과 연령별로 매우 상세하게 분석한 자료입니다. 특정 법정동의 인구 구조를 정확히 파악하고, 이에 따른 맞춤형 정책을 수립하는 데 필수적인 기초 통계를 제공합니다. 법정동은 지번 주소의 기본이 되는 고유한 지명으로, 행정동과 구분됩니다.공공데이터포털에서 무료로 다운로드 할 수 있습니다.
