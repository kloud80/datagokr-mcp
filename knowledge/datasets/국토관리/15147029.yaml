summary_user: 전국 지방자치단체가 도시관리계획으로 결정한 도시지역의 경계를 국토교통부가 취합한 공간 자료로, 시도별 SHP 파일로 내려받는다. 토지 소유자·사업자·분석가가 특정 필지나 사업 예정지가 도시지역 안에 드는지, 경계가 언제 고시됐는지(NTFDATE)를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 용도지역·지구 자료와는 공간 중첩이나 행정구역 이름·코드 매핑, 같은 기관 코드로만 잇는다.
limits: 포털 활용신청과 별개로 브이월드(vworld.kr)에 로그인해 시도별 파일을 직접 내려받아야 하며, 인증키 방식의 API 호출은 없다. 공통 조인 키가 없어 표 형태 자료와 바로 결합하기 어렵다.
