summary_user: 수도권 공공주택지구를 지구 한 곳당 한 행으로 정리한 현황 자료로, 지구명·위치·면적·세대수·지구 지정일자·지구계획 승인 일정·비고를 담는다. 정책 분석가나 지자체 담당자가 "수도권 어느 지구에 몇 세대가 언제 지정·승인됐는가"를 확인하고 지자체별 중장기 공급 규모를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 지구명(district_nm)이나 위치 설명을 이름으로 맞춰 잇거나 경기도의 다른 데이터와 기관 단위로 묶어 쓴다.
description_portal: 이 데이터는 경기도 주거복지로드맵·수도권주택공급 공공주택지구 현황입니다. 수도권 지역 내 공공주택지구의 지정 및 공급 계획에 관한 현황 자료로, 지구별로 위치, 면적, 세대수, 지정일자, 지구계획 승인 일정, 비고 등을 포함합니다. 수도권 주거 수급 안정과 관련된 중장기 공급 계획 분석에 활용됩니다. 본 자료는 주거복지로드맵 및 수도권 주택정책 실행의 근거 자료로 활용될 수 있으며, 주택 수급 정책 수립, 부지 개발 타당성 검토, 지자체별 공급 우선순위 설정 등에도 유용합니다.※ "도내 공공주택 사업 현황" 자료로 일원화되어 갱신이 중단된 데이터입니다.
