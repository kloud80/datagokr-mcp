summary_user: 광주 서구에서 건축허가를 받은 건축물을 허가 건별로 담은 파일로, 건축구분·대지위치·연면적·증축연면적·지상/지하 최대층수·주용도·부속용도·세대수·호수·가구수·설계사무소명·허가일을 시군구 범위의 필지·건물 단위로 기록한다(CSV 약 19.7KB). 지역 개발 흐름의 선행 지표로 보고, 예를 들어 분석가나 부동산 사업자가 '서구에서 최근 어떤 용도의 건물이 얼마나 많이, 어느 규모로 허가됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 주소 문자열이나 같은 기관 코드 매핑으로만 이어 붙일 수 있으며, 건축물대장·착공·사용승인 자료와 연결할 때도 주소 정규화가 필요하다.
limits: 실측 컬럼에 건물·필지를 식별하는 전역 키(관리번호·PNU 등)가 없어 다른 데이터와 정확히 1:1 조인하기 어렵다. 범위는 광주 서구 한 시군구에 한정되므로 다른 자치구나 광역 단위 비교에는 별도 자료가 필요하다.
