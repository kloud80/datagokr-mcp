summary_user: 거제시 안에 지정된 용도지구(경관·고도·방재·취락 등)를 도형 단위로 한 행씩 담은 CSV 파일로, 각 행에 지구 종류를 나타내는 라벨명, 도형면적·도형길이, 현황도형 생성일시, 데이터기준일자가 들어 있다(파일 크기 약 9.7KB). 도시계획 담당자나 분석가가 거제시에 어떤 용도지구가 어느 정도 면적으로 지정돼 있는지 확인하고 종류별 면적을 합산할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 라벨명(용도지구 이름)이나 같은 기관(거제시) 기준으로만 맞춰 이어 쓴다.
description_portal: 거제시 용도지구 현황 데이터의 라벨명, 도형면적, 도형길이, 현황도형생성일시 등의 칼럼은 공공데이터로서 도시 관리와 행정 업무에 효과적으로 활용될 수 있다. 라벨명은 용도지구의 종류와 기능을 명확히 구분하여 정책 정보 제공에 기여하며, 도형면적과 도형길이는 토지 이용 현황 분석, 개발 밀도 검토, 시설 배치 계획 수립의 기초 자료로 활용된다. 또한 현황도형생성일시는 공간정보의 최신성 확보와 변경 이력 관리, 도시 변화 모니터링에 활용되어 행정 신뢰성과 시민 서비스 품질을 향상시킨다.
