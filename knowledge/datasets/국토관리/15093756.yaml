description_portal: 본 데이터는 성주군에서 부과하는 상·하수도 요금의 세부 구조를 명확히 제시하기 위해 구축된 자료이다. 상수도와 하수도를 구분하여 사용량 기준의 요금 산정방식을 제시하고, ㎥당 금액을 구간별로 구분하여 이용자가 부담 수준을 쉽게 파악할 수 있도록 하였다. 또한 관리기관 정보와 담당자 연락처를 포함하여 요금 문의, 민원 처리, 납부 관련 절차를 신속히 지원할 수 있는 기반을 마련하였다. 아울러 가정·업소 등 다양한 수용가의 사용 패턴을 분석할 수 있는 기초자료로 활용되도록 구성하여 행정의 효율성과 공공서비스 접근성을 높이고자 하였다.
