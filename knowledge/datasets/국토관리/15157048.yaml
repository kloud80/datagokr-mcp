description_portal: 본 데이터는 한국토지주택공사가 데이터 기준일로부터 5년전 이내로 최초 공급 공고가 게시된 공공분양주택의 청약 당첨자에 관한 정보를 통계적으로 제공합니다. 통계에 포함된 정보는 당첨자의 연령대, 성별, 소득구간 정보입니다. 공공분양주택의 유형은 일반 '공공분양'과 신혼부부만 청약 가능한 '신혼희망타운'으로 구분합니다. 연령은 '30 미만' 부터 '60대 이상' 까지 10 단위로 구분하고 있으며 원칙적으로 청약은 성년자여야 가능하기 때문에 최저 연령은 만19세 입니다. 소득은 세전 월소득을 의미하며 '200만원 이하' 구간부터 '800만원 초과' 구간까지 200만원 단위로 구분합니다. 사전청약당첨자는 본청약 시점에는 소득에 대한 조회를 별도로 하지 않으므로 소득구간에 따른 분류에 포함되어 있지 않습니다. 또한 소득은 당첨자 중 부적격자를 제외한 인원을 대상으로 사회보장정보원에 조회 요청한 결과이므로 연령, 성별과 달리 소득구분별 인원 수 합과 당첨자 수가 다를 수 있습니다.
