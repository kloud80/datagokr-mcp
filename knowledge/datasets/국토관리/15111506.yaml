summary_user: 순천시 도시재생 활성화구역 안 소상공인 점포를 한 곳씩 담은 건별 목록으로, 시설명·업종 분류(목록·상세목록)·도로명/지번주소·위도경도와 함께 운영시간·휴무일·지역화폐·제로페이·키오스크·배달앱 사용 여부를 기록한다. 도시재생 구역에서 지역화폐나 제로페이를 받는 가게가 어디이고 몇 시까지 여는지, 또는 키오스크·배달앱 같은 디지털 결제·주문 도입이 업종별로 어느 정도인지 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·위경도·법정읍면동 이름으로 맞춰 붙여야 하며, 좌표를 써서 도시재생 구역 경계나 상권 자료와 공간적으로 겹쳐 본다.
