summary_user: 부산광역시 수영구에서 이루어진 건축허가를 허가 건별로 담은 파일로, 대지위치·지목·대지면적·연면적·건폐율·용적률 같은 대지·규모 정보와 구조·주용도·층수·최고높이·용도지역, 허가일·착공예정일·착공처리일, 설계·감리·시공 사무소명을 함께 담는다. 수영구에서 최근 어떤 용도와 규모의 건물이 허가·착공되고 있는지 보려는 분석가나 주민이 지역 개발 흐름을 가늠하는 선행 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치(주소) 문자열 매핑이나 같은 기관 자료로만 이어 쓴다.
description_portal: 부산광역시 수영구의 건축허가현황을 파악할 수 있는 공공데이터입니다.본 데이터는 수영구 내에서 이루어진 건축물의 허가번호, 대지위치, 지목, 대지면적, 건축면적, 연면적, 건폐율, 용적률 등의 기본적인 대지 및 규모 정보를 제공합니다. 아울러 건축구분, 구조, 주용도·부속용도, 최고높이, 층수(지상·지하), 동수와 같은 건축물의 상세 제원과 용도지역·지구·구역 정보를 포함하고 있습니다.또한 허가일, 착공예정일, 착공처리일 등의 행정 진행 일정은 물론, 해당 프로젝트에 참여한 설계사무소, 감리사무소, 시공자사무소명까지 함께 기록되어 있어 수영구의 건축 동향 분석과 도시 개발 연구에 유용하게 활용할 수 있습니다.
