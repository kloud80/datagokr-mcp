summary_user: 평택시 도시계획정보시스템(UPIS)에 등록된 도시자연공원구역을 도형 단위로 담은 1회성 CSV 파일로, 구역마다 관리번호·결정고시관리코드·라벨명과 도형 면적·길이를 기록하며 파일 크기는 398바이트로 아주 작다. 평택시에서 어느 산지가 도시자연공원구역으로 묶여 있고 그 면적이 얼마인지 확인하려는 토지 소유자·개발 사업자·도시계획 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 UPIS 계열의 평택시 도시계획 데이터와는 결정고시관리코드나 시군구코드, 라벨명으로 맞춰 이어 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 도시자연공원구역현황으로 현황도형 관리번호, 도형 조서관리 코드, 결정고시관리코드, 시군구코드, 라벨명, 면적_도형, 길이_도형 등의 항목을 제공합니다.도시자연공원구역은 도시 지역 안에서 식생이 양호한 산지를 개발로부터 보호하고 도시민에게 휴식 공간을 제공하기 위해 지정되는 용도구역입니다. 이는 국토의 계획 및 이용에 관한 법률에 따라 관리되며, 도시의 자연환경과 경관을 보호하는 것을 목적으로 합니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
