summary_user: 전라남도 시군의 지방하천을 하천 1개당 1행으로 담은 목록 파일(csv)로, 하천명과 본류부터 제6지류까지의 수계 위계, 하천등급, 기점·종점의 시군구·읍면동, 하천연장·유로연장·유역면적, 제방 정비·보강·신설 현황, 지정근거와 일자를 담는다. 지자체 하천 담당자나 분석가가 '우리 시군을 지나는 지방하천은 무엇이고 제방 정비가 덜 된 구간은 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 하천·공간 데이터와는 하천명이나 기점·종점의 시군구·읍면동 이름을 맞춰 연결해야 한다.
limits: 하천코드(WAMIS) 같은 공통 코드가 없어 국가공간정보포털의 하천구역 공간자료와 바로 맞물리지 않고, 이름 매칭에 의존해야 한다. 이 파일만으로는 하천구역 경계 같은 공간 정보를 알 수 없다.
