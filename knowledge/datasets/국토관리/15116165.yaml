summary_user: 경기도 구리시 관내 지역주택조합을 조합 한 건당 한 행으로 담은 시군구 단위 현황 파일(약 800바이트 CSV)로, 조합명·조합장·설립인가일·사업계획승인일·착공신고일·사업지 위치·조합원 및 총분양 세대수·대지면적·연면적·시공사를 담는다. 구리시에서 집을 알아보는 시민이나 조합 가입을 검토하는 사람이 '이 조합이 설립인가를 받았는지, 착공까지 진행됐는지, 시공사는 어디인지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지 위치(주소)나 조합명을 이름으로 맞추거나 시군명으로 묶어 이어 쓴다.
description_portal: 경기도 구리시 관내 지역주택조합 현황입니다. 조합명, 조합장명, 설립인가일, 사업계획승인일, 착공신고일 , 사업지위치, 세대수(조합원수), 분양수, 대지면적, 연면적, 시공사명 등이 있으며, 현재 구리시는 조합설립인가 3건과 모집신고 건 1건으로 총 4건의 조합이 운영되고 있으며, 인창대명지역주택조합과 수택지역주택조합은 현재 공사 중에 있습니다. 또한 인창동 지역주택조합은 2027년 1월  준공 예정이고, 수택지역주택조합은 2027년 11월 준공예정입니다. 기타 궁금한 사항은 구리시청 건축과 주택팀에 문의하시기 바랍니다.
