summary_user: 인천도시공사가 맺은 일반계약을 건별로 담은 파일 데이터로, 계약 구분·최초계약일자·계약명·최초계약금액·계약방법·업체명·업체소재지를 반기 단위로 제공한다. 사업자나 감시 활동가가 인천도시공사가 어떤 업체와 어떤 방식(수의계약 등)으로 얼마짜리 계약을 맺었는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명이나 계약명 같은 이름 매핑으로만 연결한다.
description_portal: 인천도시공사_일반계약현황인천도시공사에서 보유하고 있는 일반계약현황에 대해 반기별 데이터를 제공합니다. -구분, 최초계약일, 계약명, 최초계약금액, 계약방법, 업체명, 업체소재지명 등으로 구성된 데이터입니다.인천도시공사에서 진행중인 수의계약현황 및 타 계약에 관한 자세한 사항은 iH 홈페이지(https://www.ih.co.kr) 및 나라장터 홈페이지 에서  확인하실 수 있습니다.- 나라장터 검색 시 사업번호(입찰공고번호, 계약번호 등)로 검색 시 기간 제한 없이 검색 결과를 확인 할 수 있습니다.
