summary_user: 의왕시 관내 지식산업센터를 센터 한 곳당 한 행으로 담은 소규모 파일(csv 약 3.3KB)로, 지번·도로명 주소, 용도지역, 부지·건축·공장·지원시설 면적, 층수, 유치가능·실제 입주업체 수, 분양형태, 공사진행상황, 허가·착공·준공일자를 담는다. 의왕으로 이전하거나 창업하려는 기업이 '어느 센터에 아직 입주 여유가 있고 규모는 어떤가'를 비교하거나, 담당 공무원이 센터별 입주율과 공사 진행을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 센터명·주소 매칭으로만 잇고, 건축물대장 등과 연결하려면 주소로 건물을 찾아 맞춰야 한다.
description_portal: 본 데이터는 의왕시 관내 지식산업센터의 입지 및 시설 현황을 상세히 제공하는 자료로, 센터 명칭, 지번 및 도로명 주소, 용도지역, 부지면적, 건축면적, 층수(지하~지상), 공장 및 지원시설 면적, 유치 가능 업체 수, 실제 입주 업체 수, 공장동 수, 분양형태, 공사진행상황, 허가·착공·준공일자, 전화번호, 데이터 기준일자 등 다양한 항목으로 구성되어 있습니다. 해당 정보는 지식산업 기반 시설의 공간 활용도와 분양 및 입주 실적을 확인하는 데 유용하며, 산업 인프라 현황 분석, 기업 유치 전략 수립, 공간 공급계획 수립 등 다양한 행정 및 정책적 활용이 가능합니다.  센터별 시설 규모 및 수용력은 창업 및 이전 기업의 입지 선정에 실질적인 기준을 제공합니다.
