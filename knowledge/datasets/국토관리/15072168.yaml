summary_user: 이 데이터는 택지정보시스템에서 제공하는 전국 공공 택지개발 사업지구의 가구(블록) 및 획지경계를 담으며, 18개 법령에 의해 고시·공고된 사업지구를 대상으로 지구·블록·획지 단위로 구성된다. 택지 분양이나 개발사업을 검토하는 사업자·분석가가 특정 공공택지 지구 안에 어떤 블록과 획지가 어떤 유형으로 나뉘어 있는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 지구 코드·지구명(zoneCode)을 이름·코드 매핑으로 같은 택지정보시스템의 다른 택지 데이터와 연결해 쓴다.
