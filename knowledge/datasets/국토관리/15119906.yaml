description_portal: 민원인이 상하수도요금을 이중으로 납부하였을 경우 반환 처리해야 하는데 이때 사용되는 이자 자료입니다.연도별 지급 이자 정보를 포함하고 있습니다.은행을 통해 전자지급 처리합니다.매년 등록되는 자료입니다.다음달 사용료에서 차감하는 것도 가능합니다.1995년부터 현재까지 이자 자료를 보여줍니다.과오납금 납부자가 부산광역시 수도요금 등 부과·징수 사무처리 규정 제24조 및 부산광역시 수도사업회계 규칙 제38조에 따라 환부 신청하는 민원사무임.○ 처리기간내 처리결과 통지○ 전화신청은 자동납부 고객중 개인(법인제외) 대상으로 예금주, 납부자가 동일한 경우에 한함.○ 환부금은 당일 지급을 원칙으로 하되, 당일 지급이 불가능할 경우 익일 근무시간내 지급○ 법인이 아닌 경우 사업자등록증의 대표자 인감증명을 제출받아 처리함.
