summary_user: 울산광역시 남구에 있는 일반건축물의 시가표준액을 건물(동·호) 단위로 담은 파일로, 과세년도·법정동·본번·부번·연면적·시가표준액과 그 기준일자를 함께 싣는다(CSV 약 77MB). 남구 건물 소유자나 세무·부동산 분석가가 특정 주소 건물의 과세 기준 금액이 얼마인지, 연도별로 어떻게 달라졌는지 확인하는 데 쓴다. 전역 조인 키는 없어 법정동·본번·부번(지번)이나 자치단체코드를 이름·코드로 맞춰 건축물대장·공시지가 같은 다른 필지·건물 자료와 잇는다.
description_portal: ‘일반건축물 시가표준액 정보’는 울산광역시 남구에 위치한 일반건축물의 시가표준액에 관한 정보를 수록한 데이터로, 건축물 단위의 과세 기반 마련, 부동산 관련 정책 수립, 행정업무 지원, 통계 분석 등 다양한 분야에 활용 가능한 기초 자료입니다. 이 데이터는 시도명, 시군구명, 자치단체코드, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 연면적, 시가표준액, 시가표준액 기준일자, 데이터 기준일 등 총 17개 항목으로 구성되어 있으며, 각 건축물의 법정 주소, 구조, 면적, 가격 기준 정보를 종합적으로 제공합니다. 시가표준액은 과세 기준 금액 산정에 활용되며, 정기적으로 갱신되는 기준일자를 포함하여 정보의 시의성과 정확성을 확보하고 있습니다.
