summary_user: 충청남도개발공사가 추진하는 행복주택의 공급계획을 단지별로 담은 파일로, 주택 유형·단지명·소재지·공급(예정)월과 전용면적 구간별(29·39·49·59㎡ 이하) 공급예정 물량과 합계를 담는다(약 729바이트 csv의 소규모 목록). 충남에서 행복주택 입주를 준비하는 신혼부부·청년이 '언제, 어느 지역에, 어떤 평형이 몇 호 공급되나'를 확인하거나, 분석가가 지역별 공공임대 공급 물량을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 공급·청약 데이터와는 소재지 주소나 단지명을 이름으로 맞춰 이어 써야 한다.
description_portal: '충청남도개발공사에서 추진하는 행복주택 공급계획에 대한 정보를 선제적으로 제공합니다.신혼부부, 청년 등 주거 취약계층을 위한 공공임대주택 공급 현황을 담고 있으며, 임대료 감면 혜택이 적용되는 행복주택의 공급 시기와 위치, 물량 등을 시민들이 쉽게 파악할 수 있도록 하는 정보를 제공합니다.제공되는 정보는 아래와 같습니다.1. 주택 유형2. 단지명3. 계4. 공급예정물량(: 29㎡/39㎡/49㎡/59㎡ 이하)5. 소재지6. 공급 예정일7. 비고* 본 데이터는 충남지역의 주거복지 향상, 서민 주거 안정, 공공주택 정책의 지역별 균형 추진에 기여할 수 있는 정보이며, 향후 정책 모니터링, 입주 수요 예측, 지역주택시장 분석 등에 활용 가능하도록 지원하는 정보입니다 *'
