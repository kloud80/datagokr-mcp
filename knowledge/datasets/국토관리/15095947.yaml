summary_user: 대구 북구의 순환 테마길 8개 코스(행복여울숲길, 운암지 만보길, 팔거산성길 등)를 구간별로 노선, 연번, 산 이름, 소요 시간, 거리로 담은 시군구 단위 목록 데이터다. 북구 주민이나 걷기 여행자가 '집 근처에서 몇 시간짜리 어느 산 둘레길을 걸을 수 있나'를 고를 때, 또는 지역 산책로 현황을 정리하는 분석가가 코스 길이와 소요 시간을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 산 이름(MNTN_NM)이나 노선명을 글자로 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 북구 둘레길은 종주길과 마을길 및 역사문화지원을 연계하는 순환 테마길로 실제 기존의 길을 이용하여 의미가 있는 걷고 싶은 숲길, 북구 순환 테마길입니다.테마길 코스로는 1.행복여울숲길(39km)2.운암지 만보길(50km)3.연리지길(14.1km)4.팔거산성길(15.4km)5. 호연지기길(11.9km)6.서리지둘레길(5km)7. 화담누리길(8.2km)8. 도덕둘레길(14km) 총 8가지 둘레길이 있습니다. 팔달동, 구암동, 서변동, 동호동 인근 주민들은 가까운 순환테마길을 이용할 수 있습니다.
