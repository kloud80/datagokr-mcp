description_portal: (데이터 수집목적 및 과정) 경상남도 건축허가 데이터는 2000년 부터 2023년까지의  경상남도 건축용도별 건축허가별 건축재료별 허가현황에 대한 정보입니다. 구분별 건축혀가 현황을 확인할 때 활용할 수 있습니다.(데이터 구성 및 세부항목) 건축허가 데이터는 건축용도별, 건축허가별, 건축재료별 현황으로 구성됩니다. * 건축용도는 주거, 상업, 농수산, 공업, 공공, 문교, 사회, 교육및사회, 기타로 분류됩니다.* 건축허가는 신축, 증축개축이전대수선, 용도변경으로 분류됩니다.* 건축재료는  콘크리트, 철골, 조적, 철골철근, 목조, 기타로 분류됩니다.(데이터 현행화 시기) 해당 데이터는 통계DB에 자동으로 갱신됩니다. 링크를 통해 접속하여 데이터를 조회 및 다운로드 하실 수 있습니다.
