summary_user: 도시침수 지도를 바탕으로 권역(한강·낙동강·금강·영산강·섬진강·제주)과 재현빈도(30·50·80·100년)별 도시침수 면적(km²)을 침수심 5단계(0.5m 이하부터 5.0m 초과까지)로 나눠 담은 집계 통계로, 범위는 전국이며 공간 좌표는 없다. 방재 담당자나 분석가가 '100년 빈도 집중호우 때 낙동강 권역에서 1m 넘게 잠기는 도시 면적이 얼마인가'처럼 권역 간·빈도 간 침수 규모를 비교하는 데 쓴다. 다른 데이터와 공통으로 맞출 전역 조인 키는 없어서, 권역 코드(sareaCd)를 권역 이름으로 바꾸거나 같은 한강홍수통제소의 다른 홍수 데이터와 권역·빈도 기준으로 맞춰 이어 쓴다.
limits: 권역 단위 집계라 시군구나 특정 지점의 침수 위치·심도는 알 수 없고, 실시간 예보가 아닌 빈도별 시나리오 통계다. 한 번 만들어진 뒤 바뀌지 않는 이벤트성 데이터이며, 호출에는 serviceKey가 필요하고 개발계정은 하루 3,000회로 제한된다.
