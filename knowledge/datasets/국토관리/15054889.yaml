description_portal: 부산광역시에서 처리중인 오수발생 및 분뇨처리 현황에 대한 데이터로, 연도별 배출량, 하수처리장 처리량, 분뇨 및 정화조의 수거 및 처리량에 대한 데이터를 제공하고 있습니다.- “분뇨”라 함은 수거식 화장실에서 수거되는 액체성 또는 고체성의 오염물질(개인하수처리시설의 청소과정에서 발생하는 찌꺼기를 포함한다)을 말합니다.- “분뇨처리시설”이라 함은 분뇨를 침전ㆍ분해 등의 방법으로 처리하는 시설을 말합니다. 부산광역시 오수발생 및 분뇨처리 현황은 1년 단위로 업데이트 됨을 알려드립니다.
