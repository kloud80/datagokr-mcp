summary_user: 행정안전 통계연보 '재난관리' 분야에 수록된 재해위험저수지 통계로, 전국 지역·시군구별 저수지 명칭, 지정 고시일, 개소 수를 담은 집계 자료입니다. 지자체 방재 담당자나 분석가가 "우리 시군구에 지정된 재해위험저수지는 몇 곳이고 언제 고시됐나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름이나 저수지 명칭을 직접 맞춰 연결해야 한다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '재난관리' 중 '재해위험저수지', '재해위험저수지 지역별 정보'에 관한 통계입니다. 각 지역 및 시군구별 저수지 명칭과 지정 고시일, 개소를 기준으로 재해위험저수지 지역별 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
