summary_user: 서귀포시 관내 일반건축물의 시가표준액을 과세년도별로 필지(본번·부번)와 동·호 단위로 담은 건별 파일 데이터로, 연면적과 기준일자가 함께 들어 있다(CSV 약 7MB). 건물 소유자나 세무·부동산 분석가가 특정 건물의 재산세·취득세 과세 기준가가 얼마인지, 읍면동별로 시가표준액이 어떻게 분포하는지 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에 없어서, 법정동·법정리·특수지·본번·부번을 조합한 지번이나 자치단체코드로 건축물대장·공시지가 같은 다른 국토 데이터와 이름·코드를 맞춰 연결한다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘일반건축물 시가표준액’ 데이터는 해당 관내 건축물의 공정한 과세 기준가인 시가표준액 정보를 담고 있는 공공데이터입니다. 이 데이터는 행정구역(읍·면·동), 건축물 현황(용도, 연면적), 수량(동/호), 시가표준액 및 단위 가격(㎡당), 데이터 기준일자(보통 1월 1일 기준) 등의 항목으로 구성되어 있으며, 지방세 과세 기준 및 부동산 자산 평가 시 필수 기준을 제공합니다. 연간 단위로 갱신되어 최신 기준을 반영하고, PDF 혹은 JSON/XML 오픈API 형태로도 연동 가능합니다. 이 데이터는 재산세·취득세 산정, 부동산 시장 분석, 자산 평가 및 투자 분석, 지방재정 예측, 부동산 정책 수립 등 행정·금융·부동산·학술 연구 분야 전반에서 폭넓게 활용될 수 있습니다.
