summary_user: 토지이음 고시정보 게시판에 등재된 고시 목록을 고시번호·고시일·접속링크주소·고시명 네 열로 담은 건별 CSV 파일이며, 전국 471,823건을 포함한다. 국민이나 분석가가 특정 지역에 도시·군관리계획 결정 고시가 났는지, 어떤 고시가 있었는지를 찾아볼 때 쓴다. 접속링크주소(address)가 조인 키이므로 이를 따라 토지이음 고시 원문 페이지로 이어 보며, 이 파일에는 그 외의 다른 데이터와 잇는 코드 키가 따로 없다.
description_portal: 토지이용규제 기본법 제8조제9항 및 국토의 계획 및 이용에 관한 법률 제31조 및 제32조 등에 따라 국토이용정보체계를 활용하여 등재된 고시정보가 취합된 토지이음(https://eum.go.kr) 홈페이지 고시정보 게시판을 기준으로 추출하는 고시 목록 자료입니다.본 자료는 토지이음 고시정보 메뉴를 통해 서비스하는 고시 목록을 CSV 파일로 제공하며, 고시번호/고시일/접속경로(URL)/고시제목으로 구성되어 있는 파일입니다. ※ CSV 파일의 열 구분자는 쉼표(,)인 점 참고하여 주시기 바랍니다.
