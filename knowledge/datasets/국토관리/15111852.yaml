summary_user: 경기도 안산시 안의 읍면동별로 날짜마다 기록된 일 강우량(mm)을 담은 관측 원천 파일로, 시도·시군구·읍면동 이름과 관리기관명이 함께 들어 있다. 안산시 공무원이나 분석가가 특정 동에 어느 날 비가 얼마나 왔는지, 침수가 난 날 동별 강우가 어땠는지 확인할 때 쓴다. 전역 조인 키나 관측소코드가 없어서, 다른 데이터와는 시군구·읍면동 이름이나 날짜를 맞춰 이어 붙여야 한다.
limits: 관측소코드(WAMIS 표준)가 없어서 국가 수문 관측 시계열과 코드로 바로 연결하지 못하고, 행정동 이름을 매핑해야 한다. 범위는 안산시 한 곳의 읍면동 단위이고 일 단위 자료라서 시간별·10분 강우나 다른 시군구 비교에는 쓰지 못한다.
