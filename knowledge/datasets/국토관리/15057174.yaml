summary_user: 토지이용규제 기본법의 적용을 받는 법령과 도시·군계획조례 등에서 정한 행위제한 규정을 시군구별·지역지구별로 해당 조항(조·항·호·목 단위)과 연결해 담는 API로, 범위는 전국이고 행정단위는 시군구입니다. 건축주·부동산 사업자·분석가가 '이 용도지역·지구에서 어떤 행위가 제한되고 근거 조항은 무엇인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 지역지구코드(UCODE)·지역지구명으로 이름·코드를 매핑하거나 같은 기관 코드로 필지별 토지이용계획 정보와 연결해 쓴다.
limits: 검증 호출에서 0행이 수신되어 실제 응답 구조와 내용 확인이 제한적이다. 필지 식별자(PNU) 같은 전역 조인 키가 없어 공시지가·건축물대장·실거래와 직접 결합되지 않고 지역지구 코드·이름 매핑을 거쳐야 한다. 개발계정은 하루 1,000회로 호출이 제한된다.
