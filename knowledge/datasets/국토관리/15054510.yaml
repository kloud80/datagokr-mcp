summary_user: 행정중심복합도시(세종 행복도시) 공동주택 단지별로 생활권, 마을 명칭, 명칭 설명, 명명 근거를 한 행씩 담은 소규모 CSV 파일(약 5KB)이다. 세종시 신도시의 '범지기마을'·'가락마을' 같은 아파트 마을 이름이 어떤 전래 지명이나 지형에서 왔는지 알고 싶은 주민, 지명 연구자, 도시 홍보 담당자가 쓴다. 실측 컬럼에 전역 조인 키나 단지 코드가 없어, 다른 데이터와는 마을 명칭이나 생활권 이름을 글자로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 공동주택 단지의 명칭 정보와 유래를 제공합니다.각 단지별로 생활권, 명칭, 명칭 설명, 명명 근거가 수록되어 있으며, 이는 고유한 전통지명, 지역의 자연·지형적 특성, 마을 전래명 등을 반영하여 결정된 것입니다. 예를 들어 ‘가락마을’은 ‘가락골’이라는 전래 지명에서, ‘범지기마을’은 지형이 호랑이가 누운 형상을 닮아 붙여진 이름에서 유래하였습니다.해당 데이터는 행복도시 건설 과정에서 지역 정체성·역사성 보존과 주민 친화적 공동주택 명칭 부여를 목적으로 마련된 것으로, 행정적 편의뿐만 아니라 도시문화·정체성 형성에도 중요한 의미를 갖습니다. 이를 통해 생활권별 공동주택의 분포와 명칭 체계를 한눈에 확인할 수 있으며, 지명학 연구, 도시계획, 문화사적 해석, 도시 브랜딩 및 홍보 자료 등 다양한 활용이 가능합니다.
