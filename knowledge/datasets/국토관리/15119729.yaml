summary_user: 창원시 공장등록 수를 구·읍면동 단위로 2021년과 2022년 연말 기준 두 시점만 집계한 표로, 1456바이트 분량의 작은 CSV 파일입니다. 지역 분석가나 산업정책 담당자가 '창원시 어느 동에 공장이 몰려 있고, 1년 사이 등록 수가 늘거나 줄어든 곳은 어디인가'를 확인할 때 쓴다. 전역 조인 키나 행정코드는 없으므로 다른 읍면동 통계나 공장등록 원부와는 구·읍면동 이름을 맞춰 연결해야 한다.
description_portal: 공장등록시스템 자료에 의거 2021년 및 2022년 연말 기준 창원시 읍면동별 공장등록 현황에 대한 데이터를 제공합니다.읍면동별 공장등록현황 데이터는 각 읍·면·동 단위로 등록된 공장의 위치, 업종 분류, 가동 상태, 면적, 종사자 규모 등의 정보를 종합적으로 정리한 자료입니다. 이 데이터는 지역별 산업 분포 및 밀집도 분석, 환경·안전 규제 대상 파악, 산업단지 계획 수립, 고용 및 세수 기반 마련, 민원 대응, 도시·공간계획과 연결한 정책 입안 등에 활용될 수 있으며 GIS 기반 공간 시각화와 결합하면 산업 구조 및 지역 특화 전략을 수립하는 데 핵심 기초자료 기능을 합니다.
