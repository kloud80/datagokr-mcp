summary_user: 인천 동구(현 제물포구) 관내에서 착공승인을 받아 건축 중인 건축물을 한 건씩 담은 파일로, 소재지·허가(신고)일·착공일·용도·설계사무실·시공사·기준일을 시군구 범위의 개별 주소 단위로 수록한다. 주민이나 분석가가 동네에서 지금 어떤 건물이 어느 시공사 손으로 지어지고 있는지, 허가부터 착공까지 얼마나 걸렸는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건축물대장·인허가 자료와는 소재지 주소를 이름 매칭하거나 같은 기관 자료끼리만 이을 수 있다.
description_portal: 인천광역시 동구 관내 건축 중(건축 승인)인 건축물에 대한 시공 정보를 수록한 자료입니다.  각 건축물의 착공승인 주소와 건축중인 건축물소재지를 비록하여, 허가(신고)일과 실제 착공(처리)일 등 건축 절차상의 주요 일정이 포함되어 있습니다. 또한 건축물의 용도, 설계를 담당한 설계사무실명, 시공을 담당하는 시공사 정보도 함께 제공됩니다. 본 데이터는 지역 내 건축행위의 흐름을 파악하고 건축 공정의 진행 상황을 분석하는 데 유용하며, 도시개발 계획, 민원 대응, 안전관리, 건축행정의 효율적 운영 등 다양한 행정 목적에 기초자료로 활용될 수 있습니다.
