summary_user: 신고된 단독·다가구주택 매매 실거래를 건별로 담으며 거래금액(만원), 계약일, 대지면적, 연면적, 건축년도, 매수·매도자 구분, 해제 여부 등을 제공한다. 지역코드(법정동 앞 5자리)와 계약년월로 조회하므로, 특정 시군구에서 단독·다가구주택이 최근 얼마에 거래됐는지 알아보려는 국민이나 분석가가 쓴다. 지역코드(sggCd, sgg_cd 키)로 같은 시군구 단위의 다른 실거래·주택 데이터와 이어 쓰며, 지번은 일부만 공개되어 필지 단위 조인 키는 없다.
limits: 지번이 개인정보 보호로 일부만 공개되어 정확한 필지를 특정하는 용도에는 쓸 수 없다. 거래는 계약 후 30일 내 신고되고 해제·정정이 소급 반영되므로 최근 계약월은 공개 시점에 따라 달라질 수 있고, 해제 여부(cdealType) 필드를 함께 확인해야 한다. 검증 호출은 10행만 수신해 전체 규모는 확인하지 못했으며, 개발계정은 일 10,000회로 제한된다.
