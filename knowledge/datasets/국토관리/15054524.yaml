summary_user: 한국수자원공사가 관리하는 수변(단지) 사업지구에서 연도별로 분양할 예정인 토지의 출시계획을 사업지구·용도·분양시기·공급방법(추첨/수의/입찰 등)별 필지수와 면적(천제곱미터)으로 정리한 계획 집계 파일이며, CSV 719바이트 규모의 작은 자료다. 토지 분양을 희망하는 개인·사업자가 '특정 사업지구에서 언제, 어떤 용도의 토지가 몇 필지·얼마 면적으로 어떤 방식으로 나오는가'를 미리 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지구 이름이나 같은 기관 자료와의 이름 매핑으로만 이어 쓰며, 실제 공고 확인은 한국수자원공사 온라인청약시스템과 함께 본다.
description_portal: 본 데이터는 한국수자원공사가 관리하는 수변(단지) 사업지구의 연도별 분양 예정 토지의 출시계획에 대한 정보를 정리한 자료이다. 토지의 용도, 분양시기, 사업지구, 공급방법(추첨/수의/입찰 등) 필지수, 면적 항목으로 구성되어 있다. 이용자는 특정 사업지구의 출시 시기와 규모(면적, 필지수)를 파악할 수 있어 토지 분양을 희망하는 경우 자료를 활용할 수 있다. 다만, 해당 정보는 내·외부 법령 및 정책 등의 변경, 외부 요인 등에 따라 분양시기 등이 변동될 수 있으므로, 한국수자원공사 온라인청약시스템(land.kwater.or.kr)에서 최신 분양공고 등을 참고하는 것을 권장한다. 데이터는 표준화된 CSV 형식으로 제공되며, 분양정보 제공 시스템(온라인청약시스템) 등 다양한 정보서비스와의 연계 활용도 가능하다.
