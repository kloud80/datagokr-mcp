summary_user: 지적재조사 사업지구 안 토지를 대상으로 한 토지현황조사 결과를 필지·건물 단위 건별로 담은 전국 범위 파일(CSV 약 4.3MB)로, 사업지구·기준년도·시군구별 필지의 지목과 대장 면적, 지상건축물의 층수·건축면적·건폐율·용적률·구조·용도, 조사자 의견을 담는다. 지적재조사 지구의 필지 현황이나 건축물 이용 상태를 파악하려는 분석가나 지자체 담당자가 '이 사업지구의 필지는 어떤 지목이며 그 위 건물은 몇 층에 어떤 용도인가' 같은 질문에 쓴다. 토지고유코드·시군구코드 필드가 있지만 실측에서는 전역 조인 키로 확인되지 않았으므로, 토지·임야대장이나 건축물대장 등과는 이름·코드 매핑을 거쳐 연결한다.
description_portal: '지적재조사 사업지구 실시계획을 수립한 때에는 예정지구임이 지적공부에 등록된 토지를 대상으로 토지현황조사를 합니다.(사전조사)1. 토지에 관한 사항 : 지적공부 및 토지등기부2. 건축물에 관한 사항 : 건축물대장 및 건물등기부3. 토지이용계획에 관한 사항 : 토지이용계획확인서(토지이용규제기본법령에 따라 구축ㆍ운영하고 있는 국토이용정보체계의 지역ㆍ지구 등의 정보) 4. 토지이용 현황 및 건축물 현황 : 개별공시지가 토지특성조사표, 국ㆍ공유지 실태조사표, 건축물대장 현황 및 배치도5. 지하시설(구조)물 등 현황 : 도시철도 및 지하상가 등 지하시설물을 관리하는 관리기관ㆍ관리부서의 자료와 구분지상권 등기사항(현지조사)1. 조사항목별 내용을 기록할 때는 별표의 토지현황조사표 항목코드에 따라 속성 및 코드로 항목속성에 부합되게 작성2. 조사서에 사용하였던 관련서류는 디지털화하고, 디지털화하기 어려운 비규격 용지의 경우 별도의 장소에 보관3. 현황사진은 해당 토지의 이용현황과 주변 토지의 이용현황을 드론 또는 항공사진측량 등으로 촬영한 정사영상자료에 해당토지의 점유현황 경계를 표시. 다만, 비행금지구역 또는 보안규정 등으로 인하여 작성할 수 없는 경우에는 생략4. 토지특성은 현장조사를 통해 필지별로 조사5. 건축물 등에 관한 사항은 지상건축물의 층수, 이용현황, 거주 및 경작자 현황 등을 조사하여 작성6. 현황경계는 동서남북의 방위별로 경계형태, 경계폭, 연접토지현황, 연접토지와의 고저 등을 상세하게 작성, 명확한 경계가 없는 경우에는 특이사항에 현실경계현황을 구체적으로 작성7. 토지현황조사 과정에서 나타나는 특이사항 등은 조사자 의견란에 구체적으로 작성하고, 작성할 내용이 많은경우 별지로 작성토지현황조사서 작성 목록입니다.'
