summary_user: 전북특별자치도 시군별 상설시장(전통시장)의 시군명, 시장명, 소재지 주소를 시장 한 곳당 한 행으로 담은 작은 목록 파일(약 1.6KB CSV)이다. 지역 주민·관광객이 "우리 시군에 어떤 상설시장이 어디 있나"를 확인하거나, 지역 상권 정책 담당자가 시군별 시장 분포를 파악하는 데 쓴다. 공통 조인 키나 코드 필드는 없어서, 다른 데이터와는 시군명이나 시장명을 이름으로 맞추거나 주소를 지오코딩해 연결해야 한다.
description_portal: 전북특별자치도 내 각 시군에 위치하여 상시 운영되는 '상설시장'의 현황을 정리한 데이터입니다. 이 자료는 전주 남부시장, 군산 공설시장 등 지역 주민들의 생활과 밀접한 관계를 맺고 있는 전통시장의 명칭과 상세 주소 정보를 포함하고 있습니다. 이 데이터는 지역 주민과 관광객들이 신선한 농수산물이나 특산품을 구매하고, 특유의 활기찬 분위기와 먹거리를 즐길 수 있는 시장을 찾는 데 유용한 길잡이가 됩니다. 또한, 소상공인 지원 및 지역 상권 활성화 정책을 수립하는 데 있어 핵심적인 기초 자료로 활용될 수 있습니다.
