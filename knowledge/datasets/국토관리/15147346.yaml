summary_user: 2006년 기준 광주광역시 전체와 5개 자치구(동구·서구·남구·북구·광산구)별로 도시지역(주거·상업·공업·녹지)과 비도시지역(관리·농림·자연환경보전)의 용도지역 지정면적을 담은 집계 파일로, 2006년 도시관리계획 재정비 결정 고시를 근거로 한다. 도시계획 연구자나 분석가가 "2006년 당시 광주 각 자치구의 주거지역·녹지지역 면적 비중은 어땠나"처럼 과거 시점 토지이용 구성을 비교하거나 시계열 기준점으로 삼는 데 쓴다. 전역 조인 키나 행정코드 컬럼은 없고 자치구가 열 이름으로 들어 있어, 다른 자료와는 자치구 이름을 행정구역 코드에 직접 맞춰 이어야 한다.
description_portal: '○ 용도지역 현황은 2006년 기준 광주광역시 자치구별 용도지역 면적 현황입니다(2005년 자치구별 구분된 용도지역 결정조서 부존재로 2006년 자료로 제공). ○ 데이터 근거는 광주 도시관리계획 재정비 결정(변경) 고시[광주광역시고시 제2006-105호(2006.7.15.)] 자료이고, 세부 구성은 다음과 같습니다.   - 데이터 기준 : 2006년   - 데이터 내용 : 자치구별 도시지역(주거지역, 상업지역, 공업지역, 녹지지역)과 비도시지역(관리지역, 농림지역, 자연환경보전지역)의 지정면적'
