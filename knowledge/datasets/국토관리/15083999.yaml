summary_user: 경상남도 통영시에 있는 50세대 이상 공동주택을 단지 한 곳당 한 행으로 담은 파일로, 단지명·도로명주소·허가일자·준공일자·주택구분·관리사무소 전화번호·대지면적·연면적·지상 층수·동수·세대수를 기록한다. 통영에서 특정 연도 이후 준공된 단지가 어디이고 각각 몇 세대·몇 동 규모인지, 또는 단지 관리사무소 연락처가 무엇인지 확인하려는 주민·중개업자·분석가가 쓴다. 실측 컬럼에 K-apt 단지코드 같은 전역 조인 키가 없어서, 실거래가·공시가격·K-apt 관리비 데이터와 이으려면 단지명이나 도로명주소를 맞춰 매핑해야 한다.
limits: 통영시 한 곳만 다루므로 다른 시군과 비교하려면 해당 지자체 데이터를 따로 받아야 한다. 공통 단지코드가 없어 다른 데이터와 붙일 때 단지명·주소 표기 차이로 매칭이 어긋날 수 있다.
