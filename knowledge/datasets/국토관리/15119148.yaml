summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 건축물대장을 건물 한 건씩 담은 파일로, 건축물대장 고유번호·시군구·법정동·본번·부번·수정일을 담는다(CSV 약 0.9MB, 진안군 범위). 진안군 안의 특정 건물이 건축물대장에서 어떤 고유번호와 지번(본번·부번)으로 등록돼 있는지 확인하려는 분석가나 실무자가 쓴다. 실측상 전역 조인 키는 확인되지 않았으므로, 다른 건축물대장·지번 자료와는 시군구·법정동 코드와 본번·부번을 맞춰 이름·코드 매핑으로 연결한다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 건축물대장에 대한 공공데이터 자료입니다. 이번 자료에서는 건축물대장 고유번호, 시군구, 법정동, 건축물대장 본번, 건축물대장 부번, 수정 일자 정보를 제공합니다. 이 자료를 통해 건축물대장에 있는 건축물들의 고유번호가 무엇인지 알아볼 수 있으며, 각 고유번호에 해당하는 시군구, 법정동 코드와 건축물대장 본번과 건축물대장 부번 또한 알아볼 수 있습니다. 또 이 정보의 수정 일자가 언제인지도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2023년 8월 18일입니다.
