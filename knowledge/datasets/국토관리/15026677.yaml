summary_user: 부산광역시 북구 관내 공동주택의 준공 전·준공 후 미분양 세대 수를 월별로 집계해, 합계와 전용면적 3구간(60㎡ 이하, 60~85㎡, 85㎡ 초과)으로 나눠 담은 소규모 CSV 파일(약 3.8KB)입니다. 북구의 미분양 물량이 최근 늘고 있는지, 어느 면적대에 몰려 있는지를 확인하려는 분석가·사업자·주민이 지역 주택시장 동향을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 미분양·인허가·공급 데이터와는 월(구분) 기준이나 시군구 이름 매핑으로만 이어 쓴다.
description_portal: 국토교통부에서는 각 시·도로부터 제출받은 미분양 주택 현황 자료를 기반으로 미분양주택현황보고 통계를 생산하고 있으며, 매월 말일 기준의 미분양 현황을 조사하여 자료를 작성·제출하고 있습니다. 본 데이터는 부산광역시 북구 관내 공동주택의 준공 전 및 준공 후 미분양 현황을 대상으로 하며, 월별 및 전용면적별(전용 60㎡ 이하, 전용 60~85㎡, 전용 85㎡ 초과) 미분양 세대 수를 제공합니다. 이를 통해 지역 내 주택시장 동향과 미분양 추이를 파악하고, 주택 공급 및 부동산 정책 수립을 위한 기초자료로 활용할 수 있습니다.
