summary_user: 제주특별자치도 내 외식업 이용자 수를 업종별로 나누고 성별·연령대별로 집계한 통계로, 포털 설명상 2019년 1월부터 2020년 12월까지 기준연월(base_year_month) 단위로 담는다. 외식 창업을 준비하는 사업자나 지역 분석가가 "제주에서 20~30대 여성이 많이 찾는 외식 업종은 무엇인가" 같은 질문에 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어, 업종명·연월을 이름으로 맞추거나 같은 기관(제주특별자치도)의 다른 통계와 기준연월로 나란히 놓고 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터셋은 2019-01-01부터 2020-12-31 기간 동안 제주특별자치도 내 외식업체를 업종별로 구분해, 성별과 연령대 구분을 포함한 이용자 수를 집계한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 데이터는 CSV 형식으로 공개되어 있으며, 업종별로 어떤 외식업이 어느 성별·연령대에서 얼마나 이용되었는지를 파악할 수 있어, 지역 외식 소비 구조 분석, 연령대·성별 소비 성향 비교, 업종별 수요 파악, 외식시장 구조 변화 모니터링, 관광객 및 주민 소비 패턴 연구 등에 활용할 수 있습니다. 다만 해당 데이터는 2019–2020년 기간으로 한정된 집계이며, 이후 외식업 트렌드 변화나 인구 구성 변화, COVID-19 등 외부 요인의 영향을 반영하지 않을 수 있다는 한계가 있습니다.
