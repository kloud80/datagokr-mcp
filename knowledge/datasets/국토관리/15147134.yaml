description_portal: 개발제한구역의 해제 및 변경된 고시문을 수급하여 시스템에서 활용될 수 있도록 구축 및 가공된 데이터 입니다 고시문은 매일(평일기준) 등록되는 전자관보와 고시정보를 관리하는 토지이음 등 관련 사이트에서 상시 수급하여 관리되고 있으며, 수급된 데이터는 광역시도, 시군구 별 권역코드를 부여하고 고시관리번호, 기관코드, 고시번호, 고시일자, 제목, 내용 등 항목별 전산화 작업을 거친 후 개발제한구역 관리정보시스템에 등록 및 조회가 가능하도록 취합하여 제공하고 있습니다 고시정보는 속성데이터 형식으로 구축되며, 시스템 상 표출되는 도형데이터(shp)와 연계되는 데이터 입니다.
