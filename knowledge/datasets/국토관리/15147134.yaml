summary_user: 개발제한구역의 해제·변경 고시문을 고시 한 건씩 모아 고시번호·고시일자·제목·내용·고시유형과 권역·기관 코드를 붙여 정리한 속성 파일로, 전국을 시군구 단위로 다룬다. 토지 소유자나 개발 사업자가 특정 시군구의 개발제한구역이 언제 어떤 고시로 해제·변경됐는지 확인할 때, 분석가가 해제 고시 이력을 지역별로 추려 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 권역코드나 기관코드를 행정구역 이름·코드에 직접 매핑하거나 같은 기관의 코드 체계로만 다른 데이터와 잇는다.
limits: 고시문 속성만 담고 구역 경계 도형(shp)은 들어 있지 않다. 표준 행정코드 같은 전역 조인 키가 없어 다른 데이터와 붙이려면 코드나 이름을 따로 매핑해야 한다.
