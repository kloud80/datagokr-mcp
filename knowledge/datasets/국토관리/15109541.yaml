summary_user: 경상남도 남해군 관내 국유·군유(공유지) 토지를 필지 하나당 한 행으로 담은 파일로, 지번주소·지목·대지면적·개별공시지가·대부 여부·위도·경도를 포함한다(약 180KB CSV). 남해군에서 빌려 쓸 수 있는 공유지를 찾는 군민이나 사업자가 "이 지역에 대부 가능한 공유지가 어디에 있고, 지목과 면적, 공시지가는 얼마인가"를 확인할 때 쓴다. 전역 조인 키(PNU 등)는 없어서 지번주소를 이름 매칭으로 맞추거나 위도·경도로 공간 결합해 토지대장·지적도 같은 다른 토지 데이터와 잇는다.
description_portal: 본 데이터는 경상남도 남해군 관내에 소재하는 국유재산 토지 및 군유재산(공유지) 토지의 관리 현황, 특히 일반인 및 사업체의 "대부 가능 여부"와 관련된 핵심 정보를 종합적으로 제공합니다. 이는 공공자산의 효율적이고 투명한 관리·운용을 도모하며, 군민과 기업에게 공공자산 활용 기회를 공정하게 확대하는 것을 목표로 합니다. 각 필지별로 해당 토지의 정확한 "소재지 주소"(지번/도로명), 토지의 사용 목적을 나타내는 "지목", 전체 "면적", "재산구분"(국유/군유 명시), 현재의 "대부 여부", 그리고 대부 중인 경우 "대부 목적", "대부 기간", "연간 대부료" 등 주요 대부 조건과 관련된 상세 정보를 포함
