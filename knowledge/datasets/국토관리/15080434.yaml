summary_user: 경기도 양평군 일반건축물의 지방세 과세용 시가표준액을 과세년도별·건축물(동·호)별로 담은 건별 파일로, 법정동·리·본번·부번 지번과 연면적, 기준일자가 함께 들어 있다. 납세자가 자기 건물의 재산세 과세 기준이 되는 가액을 확인하거나, 분석가가 양평군 안에서 같은 규모 건물끼리 가액 분포를 비교하는 데 쓴다. 전역 조인 키는 실측되지 않아 다른 건축물·토지 데이터와는 법정동·리·본번·부번 같은 지번 이름 매핑이나 자치단체코드로만 연결한다.
description_portal: 해당 자료는 양평군 일반건축물에 대해 지방세를 부과할 때 사용하는 시가표준액을 건축물별로 제시하는 데이터로, 각 물건의 재산가액을 객관적으로 산정·확인할 수 있도록 지원합니다. 이를 통해 건축물 규모, 용도, 구조 등에 따라 산출되는 과세표준의 적정성을 검토할 수 있으며, 납세자는 자신의 건축물에 대한 재산평가 기준과 세부 산정 근거를 투명하게 확인할 수 있습니다.나아가 동일 유형 건축물 간 비교나 지역별 가액 분포 분석이 가능해져 지방세 부과 체계의 공정성 확보와 재산세 정책의 합리성 평가에도 활용되는 기초자료로 기능합니다.
