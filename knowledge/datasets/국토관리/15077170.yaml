summary_user: 전북특별자치도 장수군 안의 원룸과 오피스텔을 건물 한 동씩 담은 목록으로, 건물명·주소·주용도·세대수·건축연도를 담는다(CSV 949바이트의 작은 파일). 장수군에서 집을 구하는 사람이나 지역 임대주택 공급을 살피는 분석가가 "장수군에 원룸·오피스텔이 어디에 몇 세대 있고 언제 지어졌나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 건물명을 맞춰 붙여야 한다.
limits: 공통 코드 키가 없어 건축물대장·실거래 등과는 주소·건물명 매칭으로만 연결된다. 범위가 장수군 한 곳이고 개별 건물 단위라서, 다른 시군과 비교하려면 각 지자체 자료를 따로 모아야 한다.
