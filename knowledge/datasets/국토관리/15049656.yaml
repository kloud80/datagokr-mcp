summary_user: 한국국토정보공사(LX) 전자조달의 입찰계획을 공고 건별로 담은 파일(csv, 약 205KB)로, 공고번호·차수, 입찰건명, 공고일자, 긴급입찰 여부, 참가자격, 지체상금율, 입찰참가·입찰서 제출 기간, 개찰·낙찰 처리일시, 품목, 예산금액 등이 들어 있다. 공공조달에 참여하려는 사업자가 LX가 어떤 품목을 얼마의 예산으로 언제 발주하는지, 참가자격과 제출 기한이 어떤지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 공고번호나 입찰건명 같은 이름 매칭, 또는 같은 기관 기준으로만 연결한다.
