summary_user: 필지 단위로 토지이용상황, 지형높이, 지형형상, 도로접면 같은 물리적·입지적 특성을 담은 전국 범위의 건별 원천 데이터로, 브이월드에서 시도별 SHP 파일로 받는다. 감정평가사나 부동산 분석가가 "이 필지는 도로에 접해 있고 지형이 평탄한가"를 확인하거나, 도시계획 연구자가 지역별 토지이용 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 국토교통부 토지특성정보는 필지별로 해당 토지가 가지는 물리적·입지적 특성을 제공하는 데이터이다. 주요 항목에는 토지이용상황, 지형높이, 지형형상, 도로접면 여부 등이 포함되어 있으며, 이를 통해 개별 필지의 입지 조건과 물리적 특성을 종합적으로 파악할 수 있다. 이 정보는 토지 가치 평가, 도시계획, 개발 행위 관리, 연구 및 정책 수립 등 다양한 분야에서 기초 자료로 활용된다.이 데이터는 SHP(Shapefile)와 CSV 형식으로 제공된다. SHP 형식은 공간좌표와 속성을 함께 담고 있어 GIS 소프트웨어(ArcGIS, QGIS 등)에서 직접 시각화·분석할 수 있으며, 공간데이터와 연계 활용이 가능하다. CSV 형식은 엑셀, 데이터베이스, R·Python 등 통계·분석 환경에서 손쉽게 가공·처리할 수 있어 범용성이 높다. 두 가지 형식이 모두 지원되므로 행정업무, 연구, 민간 서비스 개발 등 다양한 목적에 따라 유연하게 활용할 수 있다.
