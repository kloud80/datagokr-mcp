summary_user: 경상남도 하천관리시스템에 등록된 하천 부속물을 건별로 담은 원천 파일로, 부속물마다 하천관리코드·구분코드·일련번호·부속물명·공간정보를 기록한다(CSV 약 2.2MB). 하천 정비·점용 업무 담당자나 분석가가 '이 하천 구간에 어떤 부속물이 어디에 설치돼 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 경상남도 하천관리 데이터(하천 목록·제방·수문 등)와는 하천관리코드나 공간아이디 같은 기관 내부 코드로만 맞춰 잇는다.
limits: 전국 표준 하천코드 같은 전역 키가 확인되지 않아 다른 기관·전국 하천 데이터와 바로 결합하기 어렵고, 이름·코드 매핑이 필요하다. 하천구역 등 공간 규제 판단은 국가공간정보포털 자료와 중복되므로 그쪽 원장을 함께 확인해야 한다.
