summary_user: 대구광역시 수성구 관내 일반건축물의 시가표준액(원)을 건물(동·호) 단위로 담은 CSV 파일로, 과세년도·법정동·본번·부번·연면적·기준일자 등을 함께 싣는다. 수성구에 건물을 가진 시민이나 세무·부동산 분석가가 '이 건물의 재산세·취득세 과세 기준이 되는 시가표준액은 얼마이고 연면적당 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 법정동·본번·부번 같은 지번 정보나 자치단체코드를 이름·코드로 맞춰 건축물대장이나 공시지가 등 다른 필지·건물 자료와 연결한다.
description_portal: 본 데이터는 대구광역시 수성구 관내 일반건축물의 시가표준액을 평가한 자료로, 주소(도로명 기준),  연면적(㎡), 시가표준액(원), 데이터 기준일자 등의 항목으로 구성된다. 시가표준액은 공시지가와 유사한 개념으로, 세금(재산세·취득세 등) 부과 및 부동산 정책 수립의 기초가 된다. 본 자료를 통해 각 건축물의 표준적 시장가치를 확인할 수 있으며, 지방세 과세 기반 정비, 공시지가 보완, 재산세 면제·경감 심사, 도시계획 및 개발사업 평가 등에 활용된다. 또한 주소, 용도, 층수 등 속성정보를 통해 건축물 분포 분석, 용도별 시가 비교, 노후 건축물 가치 변화 추이 분석이 가능하다. 수성구청은 매년 공공기관 공시가 발표 시점에 맞춰 데이터를 갱신하며, 본 자료는 행정기관, 지방세 부서, 도시계획 담당자, 연구기관, 시민에 유용한 기초정보로 제공됩니다.
