summary_user: 한국국토정보공사가 지적·공간정보 사업에 쓰려고 보유한 드론 장비를 품명·규격·모델명 단위로 한 줄씩 적은 목록 파일(csv, 약 4KB)이다. 측량 장비 시장을 보는 사업자나 분석가가 공공 측량기관이 어떤 기종과 규격의 드론을 쓰는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 모델명·품명 같은 이름을 맞추거나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: '"한국국토정보공사는 지적측량과 공간정보 서비스 제공을 통해 국토의 효율적인 발전과 국민의 토지재산권 보호를 위해 노력하고 있습니다.이 데이터는 지적사업 및 공간정보사업 수행에 사용되는 측량장비에 관한 데이터로 한국국토정보공사의 본사, 국토정보교육원, 공간정보연구원 및 11개 지역본부의 각 지사에서 보유중인 측량장비 내역입니다.주 보유 측량장비로는 토탈스테이션, GNSS측량장비, 드론, 지상라이다, 햄머드릴 등이 있습니다. 전문기관인 첨단기술센터를 자체 운영하여 체계적이고 주기적인 성능검사 및 수리를 통해 측량장비의 최적 성능 유지에 노력을 기울이고 있습니다."'
