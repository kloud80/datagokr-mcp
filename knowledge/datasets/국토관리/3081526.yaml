summary_user: 전북특별자치도 내 주요 도서관을 한 행에 하나씩 정리한 목록으로, 도서관명·위치·전화번호와 운영주체, 건물 면적(제곱미터), 열람석 수를 담는다(CSV 978바이트의 소규모 파일). 주민이나 정책 분석가가 "우리 시군에 어느 기관이 운영하는 도서관이 있고 열람석이 몇 석인가"를 확인하거나 도내 도서관 분포와 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도서관명이나 위치(주소) 문자열을 맞춰 연결해야 한다.
description_portal: 이 데이터는 전북특별자치도 내 주요 도서관의 현황을 정리한 목록입니다. 각 도서관의 명칭, 위치, 연락처와 같은 기본 정보와 함께, 운영 주체(전라북도, 교육청, 시 등)를 명시하여 시설의 소속을 알 수 있게 합니다. 또한, 건물 면적과 열람석 수를 포함하여 각 도서관의 규모와 수용 능력을 구체적으로 보여줍니다. 이 자료는 지역 주민과 학생들의 지식 정보 접근성 및 평생 교육 기회를 제공하는 핵심적인 문화 기반 시설의 분포와 현황을 파악하는 데 유용한 기초 데이터로 정책 수립 및 제언에 활용할 수 있습니다.
