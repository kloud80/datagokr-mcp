description_portal: 경기도 양주시_도시계획정보시스템(UPIS) 용도지구 결정조서 현황 데이터는 도시계획상 지정된 용도지구에 대한 정보를 담고 있다. 데이터는 총 187행으로 구성되어 있으며, 각 용도지구별로 도면번호, 위치명, 지역명, 면적(기정·변경·변경후) 등의 세부 항목이 포함된다. 예시 데이터에서는 가납지구, 오산지구, 장흥지구 등 다양한 용도지구의 위치와 면적 변동 사항을 확인할 수 있다. 특히 기정 면적 대비 변경 면적, 변경 후 면적을 모두 제공함으로써 도시계획 변경에 따른 토지이용 현황의 변화를 파악할 수 있다. 이러한 데이터는 도시계획 수립과 용도지구별 개발·보전 정책을 설계하는 데 중요한 근거자료로 활용될 수 있다. 또한 지역별 면적 증감 내역은 정책적 판단, 개발사업 타당성 검토, 환경 영향 평가 등에서도 활용 가능하다. 나아가 도면번호와 같은 행정적 참조값을 통해 GIS 데이터와 연계 분석이 가능하여, 보다 정밀한 공간정보 기반의 의사결정을 지원한다.
