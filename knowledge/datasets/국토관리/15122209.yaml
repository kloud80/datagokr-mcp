description_portal: 전북특별자치도 임실군 도시계획정보시스템 개발행위허가 토지분할 현황으로 종전면적, 분할면적, 시스템생성일시, 시스템생성자ID 등이 포함된 메타데이터입니다. 임실군 내에서 개발행위 허가를 받아 토지를 분할한 필지 정보를 중심으로, 분할 전후의 지번, 위치좌표, 분할 면적, 허가일자, 허가 목적 등의 세부 항목이 포함되어 있습니다. 이 데이터는 도시의 효율적인 토지이용 관리와 개발행위의 합리적 조정을 위한 행정 기반 자료로 활용됩니다. 특히 도시개발, 기반시설 조성, 민간개발 인허가 검토 등에서 필수적인 공간정보로, 토지 관리정책의 투명성을 높이는 역할을 합니다. 또한 GIS 분석 및 도시계획 연구에 활용되어 임실군의 공간 변화와 개발 동향을 시각적으로 파악할 수 있습니다.
