description_portal: 이 데이터는 장성군 관내 토지와 건물을 지번 기준으로 식별하고, 도로명주소 체계와 연계하기 위한 ‘관련지번’ 정보입니다. 건물본번·건물부번, 지번본번번지·지번부번호, 지번일련번호를 통해 개별 필지와 그 위의 건물을 세밀하게 구분할 수 있으며, 산여부와 지하여부를 통해 토지의 지형 특성 및 건물의 지상·지하 여부를 파악할 수 있습니다. 법정읍면동명, 법정리명, 법정동코드는 법정 행정구역 체계와의 정합성을 보장하여 다른 공공데이터와의 연계 분석을 가능하게 합니다. 도로명코드, 시도명, 시군구명 필드를 통해 지번 주소와 도로명 주소를 연결할 수 있어, 지번·도로명 간 매핑, 주소 전환, 위치기반 서비스 구축에 활용도가 높습니다. 또한 이동사유코드를 통해 지번 및 주소 체계 변경 이력을 관리하여, 과거와 현재 주소를 비교·추적할 수 있으며, 이는 토지대장·건축물대장 정비, 각종 인허가 업무, 공간정보 시스템 구축 등 공공행정과 민간 서비스에서 중요한 기초자료로 활용될 수 있는 공공데이터입니다.
