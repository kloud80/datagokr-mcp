description_portal: 한국토지주택공사의 2018~2021년 연도별 지역별 가구인원수별 임차가구 주거급여 지원임대료 데이터를 제공합니다. 주거급여는 저소득층의 주거 안정을 지원하기 위해 정부가 제공하는 주거복지 제도입니다. 1인 가구 기준 1급지 서울 지역 기준으로 2018년 21.3만원, 2021년 31만원으로 증가하였습니다. 주거급여 기준은 부양의무자의 소득·재산 유무와 상관없이, 신청가구의 소득과 재산만을 종합적으로 반영한 소득인정액이 기준 중위소득의 48%일 때 신청가능하고, 2025년 1인가구 기준 선정 기준은 1,148,166원 입니다.
