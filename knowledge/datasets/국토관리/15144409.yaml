description_portal: 충청북도 충주시 관내의 빈집 현황을 정리한 데이터로, 방치된 주택에 대한 위치 및 기본 건축정보를 제공합니다.시도명, 시군구명, 읍면동명, 도로명주소, 위도·경도 좌표, 주택유형, 구조유형, 건축연도, 빈집등급, 기준일자 등의 항목으로 구성되어 있습니다.빈집은 장기간 거주 또는 사용되지 않은 상태의 주택으로, 「빈집 및 소규모주택 정비에 관한 특례법」에 따라 조사·분류됩니다.빈집등급은 외관, 안전성, 사용 가능성 등을 종합 평가하여 등급(1~4등급)으로 분류한 것이며, 정비사업 또는 활용 우선순위에 활용됩니다.주택유형은 단독·다가구 등으로, 구조유형은 목조·벽돌조·철근콘크리트 등 건축물 형태를 나타냅니다.위도·경도는 현장 위치 확인 및 지도 기반 활용을 위한 정보로, 도시재생계획 수립이나 주거복지 정책 분석에 활용될 수 있습니다.※ 해당 데이터는 건축물대장, 현장조사, 위성지도 등을 기반으로 작성되었으며, 실시간 현황은 충주시청 관련 부서에 문의 바랍니다.
