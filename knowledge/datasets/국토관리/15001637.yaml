summary_user: 전남광주통합특별시 관내 도로명을 도로구간 단위로 한 행씩 담은 파일로, 시군구별 도로명·영문도로명, 고시일자, 시점·종점, 도로폭, 고시길이와 물리길이, 부여사유·방식·일자 등을 포함한다. 주소 업무 담당자나 분석가가 특정 시군구에 어떤 도로명이 언제 어떤 사유로 부여됐는지, 도로 구간의 길이와 폭은 어떤지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 도로명주소 자료와는 시군구명과 도로명을 이름으로 맞추거나 같은 기관의 도로구간일련번호로만 잇는다.
limits: 전국 공통 도로명코드 같은 전역 키가 없어 다른 기관 데이터와 바로 조인하기 어렵고, 이름 매핑을 할 때는 표기 차이를 확인해야 한다. 범위는 시도 하나이고 집계 단위는 시군구이므로, 다른 시도의 도로명이나 건물 단위 주소는 이 데이터로 알 수 없다.
