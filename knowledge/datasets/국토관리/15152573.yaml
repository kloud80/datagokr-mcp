summary_user: AWS 관측소 강수량을 바탕으로 6시간 누적 강수량과 유역평균 강수량을 다루는 자료이며, 포털 파일(zip, 약 168KB)은 샘플 100건만 담고 있습니다. 실제 받은 파일의 컬럼은 순서·코드명·코드설명·코드값·코드값 의미 형태여서, 건별 관측값보다는 항목 정의와 코드표에 가깝습니다. 홍수 대응 분석가가 '이 유역에 최근 6시간 동안 비가 얼마나 왔나'를 계산할 때, 자료 구조와 코드 체계를 먼저 확인하는 데 씁니다. 실측 컬럼에는 전역 조인 키가 없어서, WAMIS 표준 관측소코드 같은 이름·코드 매핑을 거쳐야 WAMIS나 홍수통제소의 실시간 수문 관측 자료와 이을 수 있습니다.
description_portal: '현재 AWS, 6시간 누적 강수량 및 유역평균 강수량은 AWS 관측소 데이터를 기반으로 6시간 단위 누적 강수량과 유역별 평균 강수량을 계산하여 관리하는 데이터 항목으로, 10분마다 실시간으로 갱신된다. 데이터 항목에는 관측소 코드, 관측시각(년월일시분), 강수량(0.1 mm 단위), 6시간 누적 강수량 등이 포함된다. AI 분석과 연계하여 유역별 강우 특성을 체계적으로 제공하며, 시뮬레이션, 분석 등 다양한 업무에 활용된다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
