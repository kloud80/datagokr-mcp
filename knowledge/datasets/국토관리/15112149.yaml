summary_user: 제주특별자치도개발공사가 운영하는 약 1,600세대 매입임대주택의 주택별 전용·공용·계약면적과 임대보증금, 월 임대료를 담은 CSV 파일(약 86KB)이다. 제주에서 매입임대주택 입주를 고려하는 취약계층이나 공공임대 정책 분석가가 '이 면적대 주택의 보증금과 월세는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 이름이나 면적 같은 값을 직접 맞추는 방식으로만 이어 쓰며, 전월세 실거래 자료와 나란히 놓고 시세 대비 수준을 비교하는 용도가 대표적이다.
description_portal: 제주특별자치도개발공사에서는 약 1,600세대의 매입임대주택을 운영하고 있습니다. 기존의 주택을 매입하여 취약계층에게 임대시세보다 저렴한 가격으로 제공하고 있습니다. 주택 매입 이후에 보증금 및 임대료 산정을 위해 공정하게 감정평가를 진행하며, 대상 주택의 시중 임대료를 파악한 뒤 시중 임대료 가격의 약 30% 정도의 임대료로 입주자로 선정되신분들께 주택을 제공해드리고 있습니다. 해당 데이터는 공사에서 제공하고 있는 주택들의 보증금 및 임대료 정보를 포함하고 있습니다.
