description_portal: '부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해  사용되는 중수도감면비율(하수도) 자료입니다.사용한 수돗물을 재활용할 수 있도록 중수도시설을 설치하거나,빗물을 재활용할 수 있도록 이용시설을 설치한 수용가로 계측장치가 설치되어야 함.감면비율은 하수도 사용료를 기준으로 가몀나하는 금액의 비율을 말함설치근거: 물의 재이용 촉진 및 지원에 관한 법률 제8조 및 제9조신청방법: 인터넷(상수도홈페이지), 전화(콜센터 ☎ 120), 관할 사업소 방문(팩스) 신청예) 하수도 사용료가 100원이고 감면비율이 30%인 경우 하수도 사용료의 70원을 부과하는 것임감면금액○ 상수도: 해당사용량에 해당하는 수도요금의 10%○ 하수도: (중수도만 해당) 업종별 적용 (가정용 65%, 일반용 30%, 욕탕용 10%, 산업용 65%)○ 물이용: 상수도와 동일'
