summary_user: 부산광역시 도시재생사업을 사업 한 건당 한 행으로 담으며, 사업주체·위치·해당구·사업기간과 국비·시비·구비·민간으로 나눈 사업비, 거점시설의 운영 수입·지출을 포함하고 전체 15건 규모다. 부산의 어느 구에서 어떤 도시재생사업이 얼마의 예산으로 진행되는지, 거점시설이 어떤 재원으로 운영되는지 알고 싶은 주민이나 지역 분석가가 쓴다. 위치(locateAddr)를 주소 키로 삼아 다른 주소 기반 공간·시설 데이터와 이어 쓰고, 별도의 코드표는 없다.
description_portal: 부산 도시재생사업 현황으로 사업주체, 담당자, 사업기간 등의 정보를 제공합니다. 도시재생사업 수, 자치구 군별 사업내용, 사업비, 구상도 등소프트웨어 및 하드웨어 사업에 대한 자세한 설명이 포함되어 있습니다.
