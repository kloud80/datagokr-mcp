summary_user: 화성도시공사가 관리하는 화성시 내 공원을 공원 한 곳당 한 행으로 담은 CSV 파일(약 81KB)로, 권역·공원명·공원종류·위치·조성연도·조성면적·관리기관·관리자 연락처를 포함한다. 시민이나 분석가가 '내가 사는 권역에 화성도시공사가 관리하는 공원은 어디이고 언제 조성됐으며 넓이는 얼마인가, 문의는 어디로 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공원 데이터와는 공원명·위치 같은 이름 매칭이나 같은 기관 자료로만 이어 쓴다.
limits: 표준 코드나 공통 키가 없어 전국 도시공원 데이터 등과 정확히 결합하려면 공원명·주소를 직접 맞춰야 한다. 포털 메타의 범위는 전국으로 표기돼 있으나 실제 내용은 화성도시공사 관리 공원에 한정된다.
