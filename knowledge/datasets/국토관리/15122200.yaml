summary_user: 임실군이 도시계획정보시스템에 올린 도시계획 고시를 고시 한 건당 한 행으로 담은 CSV 파일(약 134KB)로, 고시일자·고시번호·제목·내용이 들어 있다. 사업자나 분석가가 임실군에서 언제 어떤 도시·군관리계획 결정이 고시됐는지 확인해 특정 지역의 개발 가능성을 미리 가늠하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 고시번호·제목 속 지명이나 같은 기관 기준으로만 맞춰 이어 쓴다.
description_portal: 전북특별자치도 임실군에서 제공하는 ‘도시계획정보시스템 고시정보’ 데이터는 지역의 도시계획과 관련된 고시 내용을 체계적으로 정리한 공공데이터로, 각종 개발행위와 공간정책을 이해하는 데 중요한 기초자료입니다. 이 데이터에는주요 도시계획 고시 사항이 포함되어 있어 임실군의 공간 구조 변화와 행정 계획 방향을 확인할 수 있습니다. 도시계획 고시는 주민 생활환경, 기반시설 구축, 공공·민간 개발사업 등에 직접적인 영향을 미치는 만큼, 본 데이터는 행정기관의 정책 수립, 민원 처리, 개발행위 허가 검토 등 다양한 업무에서 핵심적으로 활용됩니다. 또한 부동산 개발 가능성 분석, 토지 이용 현황 파악, 지역 성장 전략 수립 등 민간 활용 가치도 높습니다. 이 데이터는 임실군의 지속가능한 도시 발전을 위해 복잡한 계획 정보를 투명하게 공개하고, 주민과 행정 모두가 참고할 수 있는 중요한 공공정보입니다.
