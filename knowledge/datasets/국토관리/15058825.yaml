summary_user: 국토교통부가 대권역·중권역·표준유역의 가상 구역을 지도정보로 설정해 제공하는 전국 단위 하천망 데이터로, 하천명(riv_nm)과 분류명(cat_nam) 필드를 담는다. 하천구역 안팎은 건축 규제가 달라지므로, 분석가나 사업자가 특정 지점이 어느 하천·유역 권역에 속하는지 확인하는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 하천명·코드 매핑이나 같은 기관 코드로 잇고, 하천코드(WAMIS)·유역 권역 기준으로 국가공간정보포털과 대조해 쓴다.
limits: 외부 사이트 vworld.kr의 인증키(query 파라미터 key)가 따로 필요하며 포털 활용신청과는 별개다. 실측 컬럼에서 전역 조인 키를 찾지 못해 이름 매핑 오류에 주의해야 하고, 국가공간정보포털과 내용이 중복된다.
