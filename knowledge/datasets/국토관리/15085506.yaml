summary_user: 공장설립온라인지원시스템에 등록된 공장의 면적을 시도별로 집계한 전국 단위 통계 파일로, 기준 연월(년월)과 면적 구분(용지면적, 제조시설면적, 부대면적)을 행으로, 시도를 열로 두고 m² 단위로 담는다. 지역 정책 분석가나 입지를 검토하는 사업자가 '어느 시도에 공장 용지와 제조시설 면적이 많이 몰려 있는가'를 비교하는 데 쓴다. 전역 조인 키는 없으며, 다른 시도 단위 통계나 산단 원장과는 시도 이름을 매핑해 잇는다.
description_portal: 공장등록현황통계의 시도별 공장면적현황 csv 파일로, 한국의 17개 시도에 대한 공장면적현황을 데이터 기준일자로 제공하고 있습니다.공장면적의 경우 용지면적, 제조시설 및 부대면적으로 나뉘어져 있으며 단위는 m2입니다.17시도의 경우 광역시도에 대한 기준으로 서울, 인천, 경기, 강원, 충북, 충남, 대전, 전남, 전북, 광주, 경북, 대구, 경남, 부산, 울산, 제주, 세종 등으로 구분되어 있습니다.해당 데이터는 공장설립온라인지원시스템(www.factoryon.go.kr)을 통해 전국 지자체 및 관리기관에서 등록한 민원 데이터를 토대로 작성하였습니다.
