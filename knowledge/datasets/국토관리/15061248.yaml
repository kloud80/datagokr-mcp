description_portal: K-water의 온실가스 배출량 이행률 데이터는 정부의 감축 목표 대비 실제 배출 실적을 정리한 자료입니다. * 사업장별 구분없이 총량 제공* 온실가스별 간접배출량과 직접배출량의 합계가 총배출량과 차이가 있습니다.(사업장별 배출량 단위 절사 배출량 총합을 총배출량으로 확정함)* 총배출량은 최종보고량으로 환경부 인증결과에 따라 수정될 수 있습니다.(온실가스배출권의 할당 및 거래에 관한 법률 제25조)본 데이터에는 온실가스 배출량과 에너지 사용량 등 핵심 지표가 포함되어 있으며, 에너지 사용량을 연도별로 변화를 확인할 수 있습니다. 이를 통해 정책 담당자는 국가 감축 정책의 추진 현황을 점검할 수 있고, 연구자와 산업계는 온실가스 감축 효과 분석과 전략 수립에 참고할 수 있습니다. 또한 공공기관의 환경경영 성과를 확인할 수 있어 지속가능경영 지표로 활용됩니다. 본 데이터는 기후변화 대응 과정에서 배출 감축 노력이 어떤 성과를 내고 있는지를 보여주며, 에너지 효율화와 환경정책 수립을 위한 기초 자료로 제공됩니다.
legal_basis_portal: '* 정책적·행정적 근거국가 온실가스 종합 관리 체계 (National GHG Inventory System)K-water는 국가 온실가스 종합 관리 체계에 참여하는 기관으로서정부의 2030 국가 온실가스 감축 목표(NDC), 2050 탄소중립 목표(Net Zero) 이행을 지원합니다.본 데이터는 국가 전체 온실가스 인벤토리 구축 시 공공기관 배출량 기초자료로 활용됩니다.* K-water 지속가능경영 추진 기본지침K-water는 내부적으로 지속가능경영(ESG) 전략을 수립하고 있으며,이를 위한 ESG 공시와 연차보고서 작성 시 본 데이터를 활용합니다.공공기관 ESG 평가 대응, 정부기관 요구자료 제출 시 필수 항목입니다.'
