summary_user: 경기도 시군별 소하천을 대상으로 측정월(MESURE_YM)·하천명 단위로 BOD·COD·부유물질·총질소·총인·총유기탄소·클로로필a·암모니아성질소·질산성질소·색도 등 수질 측정값을 담은 자료이다. 주민이나 지자체 담당자, 분석가가 '우리 시군의 어느 소하천이 BOD·총인 기준으로 오염이 심한가', '하천 복원사업 대상지를 어디로 고를까' 같은 질문에 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 소하천 이름 매핑으로만 다른 하천·행정 데이터와 연결한다.
description_portal: 이 데이터는 지역별 소하천을 대상으로 측정된 다양한 수질오염 지표들을 바탕으로 소하천의 수질 상태를 파악할 수 있도록 구성된 환경 모니터링 자료입니다. 각 시군의 하천에 대해 생물화학적산소요구량(BOD), 화학적산소요구량(COD), 총질소, 총인, 부유물질 등 여러 항목이 포함되어 있으며, 이를 통해 소하천의 오염 수준, 수생태계 건강성, 인근 주민의 환경보건 위험도 등을 평가할 수 있습니다. 이 자료는 수질 개선 정책 수립, 환경영향 평가, 하천 복원사업, 지속 가능한 물관리 정책의 기초자료로 활용될 수 있습니다.
