summary_user: 경기도 내 토지 실거래를 거래 건(필지) 단위로 담은 원천 자료로, 시군구·읍면동별 계약일, 거래금액, 거래면적, 지목, 용도지역, 지분거래 여부, 직거래·중개 구분, 거래 해제 여부와 사유를 포함한다. 분석가나 투자자가 '특정 시군의 계획관리지역 임야가 최근 ㎡당 얼마에 거래됐나' 같은 지가 추이와 거래 특성을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군구·읍면동 코드(signgu_cd, emd_cd)나 지역명, 지목·용도지역 코드를 이름·코드 매핑해 다른 실거래·공시가격 자료와 연결한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 경기도 내 토지의 실거래 정보를 수록한 자료입니다. 시군구별로 토지의 거래금액, 계약일, 지목, 용도지역, 거래면적 등의 항목을 포함하며, 직거래 또는 중개거래 여부, 지분 거래 여부, 거래 해제 사유 등도 함께 제공합니다. 이를 통해 지역별 토지 거래 현황과 특성을 파악할 수 있으며, 부동산 시장 분석, 지가 추이 모니터링, 투자 판단 등에 유용하게 활용될 수 있습니다.본 데이터는 대용량으로 제공되며, 현재는 2024년도 기준 자료만 시트를 통해 열람 가능하고전체 데이터는 파일 탭에서 다운로드 받으실 수 있습니다.
