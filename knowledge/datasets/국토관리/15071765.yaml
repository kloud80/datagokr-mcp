description_portal: 서울시 희망의 집수리 사업정보 데이터는 주거취약계층의 주거환경 개선을 위해 추진되는 집수리 지원 현황을 담은 자료입니다. 신청사업자(자치구)와 신청년도를 통해 어떤 자치구에서 언제 사업을 신청했는지 확인할 수 있으며, 주택유형과 주거형태, 방갯수, 거실 및 화장실 유무를 통해 대상 주택의 기본 구조와 시설 상태를 파악할 수 있습니다. 또한 대상가구 가구원수와 가구 형태 정보를 통해 1인 가구, 노인 가구, 다자녀 가구 등 어떤 특성을 가진 가구가 지원 대상이 되었는지 알 수 있습니다. 선정여부 항목은 실제 지원이 이루어졌는지 여부를 구분해 주며, 행정동 정보는 지원이 이루어진 지역적 분포를 분석하는 데 활용됩니다. 준공항목들은 집수리를 통해 어떤 공사가 완료되었는지를 보여주어, 사업의 실질적인 지원 내용을 구체적으로 파악할 수 있는 유용한 데이터입니다.
