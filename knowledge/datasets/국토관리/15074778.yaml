summary_user: 제주도 읍면동별·업종별로 월 단위 이용자수(명), 이용금액(원)과 해당 연월의 총 유동인구(명)를 한 행에 묶은 집계 매쉬업 결과로, 포털에서 CSV 파일(약 2.5MB)로 받는다. 창업 예정자나 상권 분석가가 '유동인구에 비해 이 읍면동에서 이용자와 매출이 많이 몰리는 업종은 무엇인가'를 따져 입지·업종을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 상권·인구 데이터와는 읍면동명·업종명·년월을 이름으로 맞춰 이어 써야 한다.
limits: 행정구역 코드 같은 전역 조인 키가 없어 다른 데이터와 붙일 때 읍면동명·업종명 표기를 직접 맞춰야 한다. 총 유동인구는 매시 정각 측정 인구를 머문 시간 비율로 합한 월 합계라서 실제 방문자 수와 같지 않다.
