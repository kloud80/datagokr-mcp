summary_user: 전북특별자치도에 등록된 공장을 한 곳씩 기록한 명부로, 포털 설명상 2017년 4월 기준 6,219개 공장의 회사명·대표자명·공장 주소·소속 산업단지명·업종명을 담는다. 지역 산업정책 담당자나 분석가가 "전북 어느 시군·산업단지에 어떤 업종 공장이 몰려 있나"를 파악할 때 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 데이터와는 회사명이나 주소 문자열, 단지명을 맞춰 연결해야 한다.
description_portal: 본 데이터는 2017년 4월 기준 전북특별자치도 내에 등록된 공장들의 현황을 담고 있습니다. 총 6,219개의 공장 정보가 포함되어 있으며, 각 공장별로 회사명, 대표자명, 공장 소재지 주소, 소속 단지명(지방산업단지 등), 그리고 업종명을 기록하고 있습니다. 업종은 제조업, 농업용 기계, 건설용 석제품, 의약품 제조 등 매우 다양하며, 지역별 산업 구조 및 분포 파악에 중요한 기초자료입니다. 특히 산업단지 내 위치한 공장과 개별 공장 주소가 명확히 기재되어 있어, 지역 경제 활성화, 산업 정책 수립, 공장 인허가 관리, 환경영향 평가 등 다양한 행정·산업 분야에서 활용될 수 있습니다. 데이터는 산업별, 지역별 공장 분포와 규모를 분석하고, 정책 결정 및 지원책 마련에 기초 자료로 적합합니다.
