description_portal: 서울특별시 4개 물재생센터(중랑, 난지, 탄천, 서남)내 체육시설 등 주민편의 시설에 대한 이용 실적 통계 자료 데이터입니다. 처리개방일자, 물재생센터 명칭, 개방장소, 개방횟수, 이용인원 데이터를 제공합니다.<용어설명>물재생센터 = 하수처리장의 새로운 명칭으로 생활하수·오수 등을 받아서 → 고도처리를 통해 정화 → 재이용수(중수도), 하천 방류수, 산업·농업용수 등으로 다시 활용하는 자원 순환 개념제공부서는 서울특별시 물순환안전국 물재생시설과(02-2133-3834)입니다.해당 데이터의 원본시스템은 '물재생센터관리시스템 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
