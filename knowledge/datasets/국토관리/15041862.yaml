summary_user: 충청북도 증평군이 관리하는 공유재산을 필지(지번주소) 단위로 한 건씩 담은 목록으로, 지목·면적·대부여부·대부면적·관리부서·연락처가 들어 있다(CSV 약 20KB). 군 소유 토지를 빌려 쓰려는 주민이나 사업자가 "증평군에서 아직 대부되지 않은 공유지가 어디에 얼마나 있고 어느 부서에 문의하면 되는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 소재지 지번주소를 주소·좌표 데이터와 맞추거나 같은 기관의 다른 자료와 이름으로 이어 써야 한다.
description_portal: '충청북도 증평군의 공유재산정보입니다.링크정보: https://www.jp.go.kr/kor/prog/nllpOthbc/sub01_06_04/list.do충청북도 증평군_공유재산정보 데이터는 증평군에서 관리 중인 공공 소유 재산의 목록, 주소, 지목, 면적, 대부여부 등을 정리한 행정자산 관리 데이터입니다.해당 자료는 「공유재산 및 물품관리법」에 따라 등록된 공유재산 중 대부(임대) 여부와 관리 책임기관, 물건 위치 등 핵심 속성을 포함하고 있으며,재산 활용도 제고, 유휴자산 개방 정책, 민간 임대 검토 등 다양한 정책적 활용에 기여합니다.항목에는 순번, 구분, 물건명 및 소재지, 지목, 면적(㎡), 관리기관, 대부여부가 포함됩니다.이를 통해 공유재산의 공공 활용, 민간 활용 가능성, 도시공간 분석 등에도 활용할 수 있습니다.'
