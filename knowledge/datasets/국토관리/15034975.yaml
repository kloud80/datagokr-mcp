summary_user: 전북특별자치도 김제시에 있는 제조공장을 공장 한 곳당 한 행으로 담은 CSV 파일이며, 단지명·회사명·대표자명·도로명 공장주소·대표업종번호·업종명·생산품을 함께 담는다(파일 약 130KB). 기업 유치 담당자나 투자자가 '김제시 어느 산업단지에 어떤 업종의 공장이 몰려 있고 무엇을 생산하는가'를 파악하는 데 쓴다. 전역 조인 키는 없어서, 대표업종번호를 업종분류 코드로 맞추거나 회사명·도로명 주소를 문자열로 매칭해 팩토리온 공장등록 정보나 산업단지 현황과 이어 쓴다.
description_portal: 전북특별자치도 김제시에 소재한 제조공장에 대한 현황 데이터를 제공합니다. 데이터에는순번, 단지명, 회사명, 대표자명, 공장대표주소, 대표업종번호, 업종명, 생산품 항목이 포함되어 있으며, 관내 제조업 기반 산업 현황을 체계적으로 파악할 수 있습니다. 본 데이터는 산업정책 수립, 입지 분석, 지역 경제 활성화 방안 마련 등 다양한 목적으로 활용될 수 있습니다. 특히 김제시의 산업 구조와 제조업 분포 특성을 이해하고, 신규 투자 및 기업 유치 시 기초자료로 제공할 수 있는 유용한 데이터입니다. 기업 관계자, 투자자, 정책 입안자 및 연구자들에게 제조업 동향을 파악할 수 있는 실증 자료를 제공합니다.
