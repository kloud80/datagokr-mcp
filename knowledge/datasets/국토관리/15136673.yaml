summary_user: 용인시 수지구에서 건축허가 때 거치는 관계 부서·법령별 협의 항목을 담은 파일 데이터로, 협의 한 건마다 담당부서·사업담당·적용법률·협의명·협의내용이 한 행에 들어 있다(CSV 약 15KB, 활용신청 없이 내려받음). 건축허가를 준비하는 건축주나 설계사무소가 '수지구에서 허가를 받으려면 어느 부서와 어떤 법률에 따른 협의를 거쳐야 하나'를 미리 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어서, 적용법률 이름이나 담당부서명을 기준으로 건축 인허가 현황 같은 다른 자료와 이름 단위로만 이어 쓴다.
limits: 개별 건축허가 건이나 대지·지번 정보가 없어 특정 건축물의 허가 진행 상황은 알 수 없다. 범위는 용인시 수지구 한 곳의 시군구 단위이고 공간 정보가 없으므로 지도나 다른 지역과 직접 비교하는 데 쓰지 못한다.
