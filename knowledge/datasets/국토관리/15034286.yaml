summary_user: 충청북도 충주시에 등록된 공장을 한 곳당 한 행으로 담은 파일로, 회사명·단지명·전화번호·종업원수·공장대표주소·업종명과 담당부서 연락처가 들어 있다. 충주시 안에서 어떤 업종의 제조업체가 어느 산업단지나 지역에 얼마나 모여 있는지 보려는 산업정책 담당자, 입지 분석가, 기업 지원사업 기획자가 쓴다. 실측 컬럼에 사업자번호·산업분류코드·필지고유번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명·주소 문자열을 맞추거나 같은 기관(충주시) 기준으로만 이어 쓸 수 있다.
limits: 사업자번호나 필지번호가 없어 기업·토지 데이터와 키로 바로 연결할 수 없고, 이름이나 주소를 맞춰 붙여야 한다. 범위는 충주시 한 곳뿐이므로 다른 시군과 비교하려면 해당 시군의 공장등록 데이터를 따로 구해야 한다.
