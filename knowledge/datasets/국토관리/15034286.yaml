description_portal: 충청북도 충주시에 등록된 공장의 정보를 제공하는 데이터입니다.회사명, 전화번호, 공장대표주소, 종업원 수, 업종명, 담당부서 및 연락처 등으로 구성되어 있으며, 지역 내 제조업체 현황과 산업구조를 파악하는 데 활용됩니다.공장등록은 「산업집적활성화 및 공장설립에 관한 법률」에 따라 등록된 업체를 대상으로 하며, 공장 부지의 소규모 여부나 업종 특성에 따라 단지명은 비어 있을 수 있습니다.주소는 도로명주소 기준이며, 사업장 위치는 공장 대표지번 중심으로 표기됩니다.종업원 수는 신고 기준으로 작성되었으며, 실제 근무 인원과 차이가 있을 수 있습니다.업종명은 신고 당시 기준으로 분류되었으며, 표준산업분류와 일부 차이가 있을 수 있습니다.※ 본 데이터는 지역 내 산업정책 수립, 입지 분석, 기업 지원사업 기획, 통계분석, 민원 응대 등에 활용할 수 있으며, 등록정보의 변경 가능성을 고려해 담당 부서(허가민원과) 확인이 권장됩니다.
