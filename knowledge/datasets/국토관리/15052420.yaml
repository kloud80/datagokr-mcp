summary_user: 서울 부동산 정보광장의 전월세 계약을 건별로 담으며, 자치구·법정동·지번·층·건물명·건축년도·용도와 함께 전월세 구분, 임대면적, 보증금·임대료, 계약일·계약기간, 신규/갱신 여부, 갱신요구권 사용 여부, 종전 보증금·임대료를 제공합니다. 세입자나 분석가가 '이 동네 이 건물의 최근 전세 보증금이 얼마였고 갱신 때 얼마나 올랐나'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 자치구 코드(CGG_CD)·법정동 코드(STDG_CD)와 본번·부번 지번을 매핑해 같은 지역의 실거래·공시가격 데이터와 이어 쓴다.
limits: 서울특별시 열린데이터광장 인증키(KEY)가 따로 필요하며 포털 활용신청과 별개다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 이름·코드 매핑으로만 연결된다. 범위는 서울 시도 단위이며 좌표가 없는 비공간 데이터다.
