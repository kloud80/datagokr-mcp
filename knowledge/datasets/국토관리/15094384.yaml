description_portal: '경상남도 거창군 지목별 현황에 대한 데이터로 전, 답, 과수원, 목장용지, 임야, 광천, 염전, 대, 공장용지, 학교용지, 주차장, 주유소용지, 창고용지, 도로, 철도용지, 제방, 하천, 구거, 유지, 양어장, 수도용지, 공원, 체육용지, 유원지, 종교용지, 사적지, 묘지, 잡종지의 지번수와 면적을 제공합니다.○ 데이터 기준일 : 2025. 11. 01.○ 지목(地目)은 토지의 주된 용도나 이용 목적을 나타내는 행정적 구분으로, 토지대장이나 등기부등본에 기재되어 있습니다. 이는 토지가 실제로 어떻게 사용되고 있는지를 기준으로 분류되며, 예를 들어 전(밭), 답(논), 대(대지), 임야, 도로, 공장용지, 학교용지 등 다양한 종류가 있습니다. 지목은 토지의 과세 기준, 개발 가능성, 건축 허가 여부 등에 영향을 미치므로 매우 중요한 정보입니다. 지목 변경은 일정한 절차와 요건을 충족해야 하며, 지자체의 허가가 필요합니다.'
