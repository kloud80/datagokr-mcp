summary_user: 전북특별자치도 장수군 개별주택의 공시가격을 소재지·동번호 단위로 담은 건별 파일로, 대지·건물 전체면적과 산정면적, 개별주택가격(원)을 함께 담는다(CSV 약 820KB). 장수군에 단독주택을 가진 주민이나 분석가가 특정 주택의 공시가격이 얼마인지, 보유세·건강보험료·복지 기준 판단에 쓰이는 가격을 확인하는 데 쓴다. 실측 컬럼에 필지고유번호 같은 전역 조인 키가 없어, 다른 데이터와는 소재지 주소 문자열 매핑이나 같은 기관(장수군) 기준으로만 이어 쓴다.
