summary_user: 서울특별시 건축물대장 중 집합건물 전유부의 호실·층별 면적을 담은 건별 원천 자료로, 대지위치·지번·도로명주소와 동·호, 전유·공용 구분, 층 구분·층수, 구조, 주용도, 면적(AREA)을 행 단위로 기록한다. 서울 시내 특정 아파트·오피스텔 호실의 전용면적과 공용면적, 층 위치, 용도를 확인하려는 부동산 거래자·중개사·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 건축물대장(표제부·총괄 등)이나 공시지가 자료와는 시군구·법정동 이름과 본번·부번 지번, 도로명주소를 맞춰 연결한다.
description_portal: 서울특별시 각 지역의 건축물 전유부에 대한 위치 및 속성 정보를 제공한다. 각 항목에는 소재지 주소, 행정구역명, 지번, 도로명 주소, 도로명 상세, 지상·지하 구분, 건물 관리번호, 등기 구분, 동명칭, 호수, 층 구분, 층수 등의 정보가 포함되어 있다. 이를 통해 건물의 물리적 위치와 소유·구성 형태를 파악할 수 있으며, 부동산 관리, 도시계획, 건축물 현황 조사, 행정업무 지원 등 다양한 분야에서 활용 가능하다. 특히 집합건물 내 특정 전유부의 층 위치와 호수 정보를 포함하고 있어 세부 단위 공간 분석 및 관리에도 유용하다.
