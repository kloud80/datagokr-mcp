description_portal: 이 데이터는 서울주택도시공사(SH공사)가 2021년도에 공급한, 또는 공급 예정인 행복주택 리츠(REITs) 사업의 공급계획 정보를 포함하고 있습니다. 주요 항목으로는 단지명, 전용면적 구간별 공급 예정 물량(30㎡ 이상 39㎡ 이하 / 40㎡ 이상 49㎡ 이하), 단지 소재지, 공급(예정) 월 등이 포함되어 있어, 서울 내 청년·신혼부부·사회초년생 등을 위한 소형 공공임대주택의 공급 현황을 구체적으로 파악할 수 있습니다. 행복주택 리츠는 민간 투자와 공공이 결합된 방식으로 추진되는 임대주택 공급 모델로, 해당 데이터는 면적별 수요 대응성, 지역별 공급 집중도, 시기별 분포 등을 분석하는 데 유용합니다. 다만 공급계획은 사업성, 행정절차, 예산 등 여러 요인에 따라 변경될 수 있으므로 참고자료로 활용해야 합니다. 청년 주거 안정 정책이나 도심 내 주거 확보 전략 수립에도 활용 가치가 높은 데이터입니다.※ 2025년부터는 서울주택도시개발공사_행복주택(리츠포함) 공급계획으로 통합하여 제공됩니다.
