summary_user: 한국가스안전공사가 관리하는 고압가스제품 해외제조공장 등록 목록으로, 업소별 1행의 건별 원천 파일이며 검증 시 전국 1,688행(등록일 2003-07-10~2024-04-05)을 받았다. 고압가스 분야 해외제조공장이 어느 국가에 어떤 업종·취급품목으로 등록돼 있는지 확인하려는 분석가나 사업자가 쓴다. 이어 쓸 수 있는 키는 주소(address) 하나뿐이며 사업자번호·좌표 같은 키는 필드에 없어, 다른 공장등록 자료와는 주소 문자열 대조로 잇는다.
limits: 포털 설명상 영업 현황이 '정상'인 데이터만 담아 폐업·말소 이력은 알 수 없고, 타 유관기관 자료와 일부 다를 수 있다. 명세상 갱신은 수시이며 실측 최신 행 날짜가 2024-04-05라 오래돼 보이나, 이것만으로 데이터가 낡았다고 단정할 수는 없다. 이 자료는 국내 제조업 공장등록 원부와 달리 사업자번호·KSIC·PNU 키가 없고 세부 부문도 해외제조공장으로 옮기자는 제안이 있다.
