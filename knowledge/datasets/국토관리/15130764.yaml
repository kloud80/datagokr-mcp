summary_user: 경기도 위반건축물의 발생·정비 건수와 이행강제금·과태료 부과 건수와 금액(천원), 고발 건수를 연도·분기별, 구분·용도별로 묶은 집계 자료이며 건별 원천 기록이 아니다. 건축행정 담당자나 분석가가 '최근 몇 년간 어떤 용도의 건축물에서 위반이 늘었고 이행강제금은 얼마나 부과됐나' 같은 단속·처분 실적 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 집계년도·분기나 구분명·용도구분명 같은 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터는 위반건축물의 발생 및 조치 현황을 연도별, 분기별로 집계한 자료로, 건축법 위반사항에 대한 행정처분 및 조치 내역을 제공합니다. 주요 항목으로는 집계년도, 분기, 구분명, 용도구분명, 발생건수(건), 정비건수(건), 이행강제금건수(건), 이행강제금금액(천원), 과태료건수(건), 과태료금액(천원), 고발건수(건) 등이 포함되어 있으며, 이를 통해 위반건축물의 발생 추이와 행정조치 실적을 파악할 수 있습니다. 본 데이터는 건축행정 관리, 위반건축물 단속 정책 수립, 이행강제금 및 과태료 부과현황 분석, 행정처분 이행실태 평가 등 다양한 공공행정 및 연구 목적으로 활용됩니다. 특히 용도구분에 따라 위반유형을 구분할 수 있어 특정 건축용도에서의 위반 경향을 파악하는 데에도 유용합니다.
