summary_user: 경기도 평택시 도시계획정보시스템(UPIS)에서 추출한 관리지역 도형별 현황을 담은 1회성 CSV 파일로, 도형마다 관리번호·라벨명·면적·길이가 한 행씩 들어 있다. 도시계획 실무자나 토지 분석가가 평택시 관리지역이 어떤 구분으로 얼마만큼의 면적에 걸쳐 있는지 집계할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 용도지역 현황 데이터와는 라벨명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓸 수 있다.
