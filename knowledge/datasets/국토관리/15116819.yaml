description_portal: '경기도 평택시 도시계획정보시스템(UPIS) 관리지역 현황으로 현황도형 관리번호, 라벨명, 면적(도형), 면적(길이) 등의 항목을 제공합니다.도시계획 수립, 지형도면 제작, 토지이용 현황 분석 등에 활용될 수 있습니다. 특히, 공간 데이터를 시각화하고 지역별 분석을 수행하는데 유용한데, UPIS는 도시계획 관련 자료와 정보를 전산화하여 도시계획 업무 의사 결정을 지원하고 관련 정보를 제공합니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
