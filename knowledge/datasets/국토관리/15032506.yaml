summary_user: 전남개발공사가 분양 중인 택지 가운데 2025년 8월 기준으로 팔리지 않은 재고를 필지(블록) 한 건씩 담은 작은 파일(csv 약 2KB)로, 소재지·지번·토지이용 용도·지목·면적(㎡·평)·㎡당 단가·공급예정가·상태를 담는다. 주택이나 상업 용지를 사려는 개인·기업이 "전남개발공사 택지 중 지금 살 수 있는 땅은 어디이고 공급예정가는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키나 법정동 코드가 없어 다른 토지 데이터와는 소재지·지번 문자열을 매핑해 붙이거나 같은 기관의 다른 데이터와 이어 써야 한다.
description_portal: 이 데이터는 전남개발공사가 분양 중인 택지 중 '25년 8월 기준 미분양된 재고에 대한 상세 정보를 담고 있습니다.이는 공공 주체의 투명한 부동산 자산 관리를 보여주고, 주택 및 상업 용지 등 토지 구매를 희망하는 개인과 기업에게 필요한 정보를 제공하는 것을 주된 목적으로 합니다.데이터는 해당 택지의 소재지, 지번, 이용용도, 지목, 면적, 단가, 그리고 공급예정가 등의 핵심 정보를 포함하고 있습니다.본 데이터는 내부 토지 판매 및 재고 관리 기록을 체계적으로 집계하여 작성됩니다.이러한 정보는 토지 시장의 동향을 파악하고, 지역별 부동산 가치를 분석하는 데 중요한 기초 자료로 활용될 수 있습니다.또한, 일반 시민들이 합리적인 가격으로 토지를 취득할 기회를 탐색하는 데 도움을 주며, 유휴 토지의 활용을 촉진하여 지역 경제 발전 및 주거 안정에 기여하는 중요한 역할을 할 것으로 기대됩니다.
