description_portal: 충청남도개발공사가 추진하는  각 도시개발사업과 관련하여 발생한 용지보상 내역을 시민과 이해관계자가 쉽게 확인할 수 있도록 정리한 데이터 입니다. 보상 절차의 투명성 제고와 공공사업의 신뢰성 강화를 목적으로 공개되며, 사업별 조상 진행 상황을 한눈에 확인할 수 있습니다. 제공되는 정보는 다음과 같습니다.1. 도시개발사업 사업지구명2. 물건구분3. 보상건수4. 보상면적(제곱미터)5. 보상금액(원)*본 데이터는시민과 토지 소유자에게 보상정보를 쉽게 제공함으로써 정보 접근성 향상을 높이고, 보상 현황 모니터링을 통한 정책 투명성 강화에 기여할 수 있는 정보입니다*
