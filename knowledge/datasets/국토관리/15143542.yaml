description_portal: 건축사사무소는 건축사가 건축 관련 업무를 수행하기 위해 설립한 사무소로, 건축물의 설계, 감리, 인허가 대행 등의 업무를 담당합니다. 건축사법에 따라 자격을 갖춘 건축사만이 건축사사무소를 설립할 수 있으며, 주로 주거시설, 상업시설, 공공건축물 등 다양한 건축물의 설계와 공간계획을 수행합니다. 또한 건축사의 전문성과 창의성을 바탕으로 건축물의 기능성, 안전성, 심미성 등을 고려하여 설계를 진행하며, 시공 과정에서는 설계 도면에 따라 공사가 이루어지는지 확인하고 감독하는 감리 역할도 수행합니다. 건축사사무소는 개인이 운영하는 1인 사무소부터 대규모 프로젝트를 수행하는 법인 사무소까지 규모와 형태가 다양합니다. 최근에는 지속가능한 건축, 친환경 설계, 도시재생 프로젝트 등 시대적 요구에 맞는 다양한 건축 서비스를 제공하며 사회와 환경에 기여하고 있습니다.
