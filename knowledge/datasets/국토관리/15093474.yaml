summary_user: 경상남도 하천관리 시스템에 등록된 하천을 하천 한 건당 한 행으로 담은 파일(csv, 약 160KB)로, 하천코드·하천명, 전체유역면적·총유로연장·하천총연장, 하천 지정연월일과 고시번호, 시점·종점 명칭과 측점번호, 기본계획 수립년도를 담는다. 경남 지역 토지·건축 사업자나 분석가가 특정 하천이 언제 어떤 고시로 지정됐는지, 구간 시점·종점이 어디인지, 기본계획이 언제 세워졌는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 하천 데이터와는 하천코드나 하천명 매핑으로만 연결하고, 하천구역 등 공간 정보는 국가공간정보포털 자료와 겹치므로 그쪽과 함께 본다.
limits: 하천 단위 기본 속성만 담고 하천구역 경계 같은 공간 좌표는 없어(비공간) 지도 위에서 구역 안팎을 판정하는 데 바로 쓰지 못한다. 공통 조인 키가 확인되지 않아 다른 기관 데이터와 붙일 때 하천명·코드 매핑을 직접 검증해야 한다.
