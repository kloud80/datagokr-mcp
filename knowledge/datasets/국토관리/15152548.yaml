summary_user: AI 홍수예보 시스템의 초단기 침수예측에서 격자마다 행정구역과 관할 홍수통제소를 매칭하고 주의·경계·심각 단계 기준값을 정해 둔 고정 기준표로, 격자 한 칸이 한 행인 csv 파일(약 2MB)이다. 지자체·재난 담당자나 분석가가 "우리 구의 이 격자는 어느 수준부터 경계 단계로 보는가"처럼 초단기 침수예측 결과를 경보 단계로 바꿔 읽을 때 쓴다. 전역 조인 키는 없어 격자순번으로 같은 기관의 초단기 침수예측 격자 자료와 붙이고, 다른 데이터와는 행정구역명칭을 이름으로 매핑해 연결한다.
description_portal: 'AI 홍수예보 시스템의 초단기 침수 예측에서 격자 단위 위험 수준을 평가하기 위한 기준표(주의, 경계, 심각)를 제공하는 데이터 항목으로, 격자별 행정구역을 매칭하고 그에 따른 주의, 경계, 심각 단계의 기준을 정의한다. 이를 통해 격자 단위 침수 위험을 체계적으로 산정하고 제공하며, 단기 홍수 대응, 침수 경보 발령, 자원 배분, 홍수 위험 관리 등 다양한 의사결정과 관리 업무에 활용될 수 있다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
