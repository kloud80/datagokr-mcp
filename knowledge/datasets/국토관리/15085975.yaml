summary_user: 고양시 안의 일반정비사업(주택재건축·도시환경정비) 사업장별로 사업구분, 사업장명(탄현·주교·행신·관산 등), 진행단계, 시 홈페이지 안내 주소를 한 줄씩 담은 소규모 현황표(CSV 약 844바이트)입니다. 고양시 아파트 매수자나 부동산 분석가가 '이 재건축 단지가 조합설립인가·관리처분계획인가·착공 중 어느 단계에 와 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명(단지·지역명) 문자 매칭이나 같은 기관(고양시) 기준으로만 이어 쓰며, 실거래가·정비구역 지정 자료와 붙일 때도 이름 대조가 필요하다.
description_portal: 경기도 고양시_일반정비(주택재건축)사업현황 데이터는 사업유형, 사업구분, 사업장명, 진행단계, URL 등의 항목을 제공합니다. 사업유형은 일반정비사업, 사업구분은 주택재건축, 도시환경정비입니다. 사업장은 탄현, 주교, 행신, 관산을 포함하는 데이터이며, 진행단계는 착공, 사업시행계획 인가, 정비구역 해제, 준공인가 전 사용 허가, 관리처분계획인가, 조합설립인가 등의 단계를 포함합니다. 인터넷 주소는 고양시 대표 홈페이지에서 일반정비(주택재건축)사업 소개, 추진절차, 계획, 사업시행, 절차도 등의 정보를 개방하는 사이트입니다.
