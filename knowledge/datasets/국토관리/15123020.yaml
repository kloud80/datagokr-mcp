summary_user: 안산시 관내 민간·공공 시설 중 시민에게 개방된 화장실을 개소별로 담은 파일 데이터로, 장소명·도로명주소·법정동·행정동·위도·경도와 장애인 칸 유무·개방 시간 등 이용 정보(설명)를 한 행에 담는다. 시민이나 방문객이 '지금 근처에서 밤늦게도 열려 있고 장애인 칸이 있는 개방화장실은 어디인가'를 찾거나, 시 담당자·분석가가 동별 개방화장실 분포를 보고 공중화장실 확충 지역을 가늠하는 데 쓴다. 전역 조인 키는 없으므로 법정동·행정동 이름으로 다른 동 단위 통계와 맞추거나, 위도·경도로 공중화장실·공공시설 위치 데이터와 공간 결합해 쓴다.
limits: 표준 코드(법정동코드 등) 컬럼이 없어 다른 데이터와는 동 이름 매칭이나 좌표 결합으로만 이을 수 있다. 범위가 안산시 한 곳이라 다른 시군구와 비교하려면 각 지자체 자료를 따로 모아야 한다.
