summary_user: 구로구 관내 건축물의 신축·증축 등 건축허가를 필지·건물 단위 건별로 담은 파일(csv 약 515KB)로, 대지위치·주용도·연면적·층수·세대수와 허가일·착공처리일·사용승인일을 함께 담는다. 분석가가 구로구 어느 동네에서 어떤 용도의 건축이 늘고 있는지, 허가에서 착공·사용승인까지 얼마나 걸리는지처럼 지역 개발 흐름을 앞서 살피는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치(주소) 문자열 매칭이나 같은 기관 코드로만 이어 쓴다.
description_portal: 건축허가 현황 데이터는 구로구 관내 건축물의 신축·증축·개축 등 각종 건축행위에 대한 허가정보를 기록한 자료로, 건축허가일자, 건물용도, 대지위치, 연면적, 허가번호 등 공간·물량 기반 행정정보가 포함된다. 건축허가는 도시계획, 기반시설 수요 예측, 안전관리, 환경영향 평가 등의 핵심 기초자료이므로 지역 개발 동향을 파악하는 데 직접적인 역할을 한다. 또한 중부원점TM(EPSG:2097) 좌표계로 건축물 위치가 제공되며 위경도 정보는 포함되지 않아, 도시계획 시스템과 연계 시 좌표 변환이 필요하다. 건축허가 데이터는 단순 건물 정보가 아니라 지역의 성장 패턴, 상권 변화, 인구유입 가능성 등 도시정책 의사결정의 근거가 되는 자료로 활용된다.
