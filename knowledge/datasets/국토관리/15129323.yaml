summary_user: 경기도 행정동(읍면동) 단위로 연도별 총인구·세대수·세대당 인구, 남녀 인구와 성비, 1인~4인 이상 세대수와 비율, 연앙인구의 성별·연령대(15~29세, 30~49세, 50세 이상, 가임기 여성 5세 구간) 세부값을 담은 집계 자료다. 지자체 정책 담당자나 분석가가 '우리 시군에서 1인 가구 비율이 높고 청년층 비중이 큰 행정동은 어디인가'처럼 주택·복지 수요를 동 단위로 비교하는 데 쓴다. 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동코드(admdong_cd)·시군코드나 시군명·행정동명을 매핑하거나 같은 경기도 분석마트 코드로 연결한다.
description_portal: 이 데이터는 경기도 행정동 단위의 인구 및 세대 기본정보를 정리한 자료로, 지역별 인구구조와 세대 특성을 분석할 수 있습니다. 주요 항목에는 년도, 시군코드, 행정동코드, 시군명, 행정동명, 총인구수, 세대수, 세대당인구수, 성별비율, 총남성·여성인구수, 1~4인 이상 세대수와 비율, 연앙인구 및 성별·연령대별 세부항목, 생성일자 등이 포함됩니다. 이를 통해 특정 지역의 세대규모 분포, 남녀 인구 비율, 청년·중장년·고령층 비중을 확인할 수 있으며, 도시계획, 주택정책, 복지정책 수립 등 다양한 정책 연구의 기초 자료로 활용 가능합니다.
