summary_user: 전국 도시정비사업(재개발·재건축·주거환경개선) 구역을 한 행에 한 구역씩 담은 목록 파일로, 시도·시군구·구역명칭·현 추진단계·사업유형·사업시행자·공급 예정 세대수를 담는다. 분석가나 수요자가 "우리 시군구에서 관리처분 단계까지 간 재건축 구역은 어디이고 몇 세대가 공급될 예정인가"처럼 지역별 정비사업 진행 상황과 공급 물량을 확인하는 데 쓴다. 전역 조인 키나 행정구역 코드는 없어서, 다른 데이터와는 시도·시군구 이름이나 구역명칭을 문자열로 맞춰 이어야 한다.
limits: 행정구역 코드나 좌표가 없는 비공간 데이터라 지도 위 구역 경계나 다른 통계와의 코드 기반 결합은 바로 되지 않는다. 명세상 연간·이벤트 주기로 만들어지는 파일이어서, 추진단계는 생성 시점 기준이며 실시간 진행 상황과 다를 수 있다.
