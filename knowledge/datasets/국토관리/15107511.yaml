summary_user: 고양시의 연도별 일반가구수·주택수·주택보급률을 한 줄씩 담은 시 단위 집계 파일로, 원본 CSV는 157바이트의 아주 작은 표입니다. 시민이나 부동산·주택정책 분석가가 고양시의 주택이 가구 수에 비해 해마다 얼마나 공급됐는지 추이를 볼 때 씁니다. 전역 조인 키가 없어 다른 시군구 주택보급률 자료나 인허가·준공 통계와는 연도와 시 이름을 맞춰 붙여 씁니다.
description_portal: 택수를 가구수로 나누고 100을 곱해서 산출한다.참고로 세대수와 가구수는 다른 개념이다. 세대란 '동일한 주소 또는 거소에서 생계를 같이하는 가족'으로 정의하며, 가구는 '반드시 혈연 관계가 아니더라도 1인 이상이 모여 취사, 취침 등 생계를 같이하는 생활 단위'를 말한다.예를 들어 100가구가 있고 주택 수가 100채면 주택보급률은 100%다. 2019년 자료에 따르면 전국 주택보급률은 104.8%, 울산은 111.5%, 서울은 96%인데 이를 보면 전국적으로 보면 주택이 남고 서울은 주택이 부족한 것으로 볼 수 있다. 즉 전국적으로 100가구가 있는데 주택은 105채가 있어 괜히 5채가 더 많은 것으로 오해할 수 있다.이는 다음과 같이 주택보급률은 주택이 충분히 공급이 되는지 안 되는지를 보여주는데 한계가 있기 때문이다.주택보급률을 계산할 때 가구수에 한국에 사는 외국인들은 포함이 되지 않는다. 외국인들이 길에서 자는 것도 아닌데 이들은 빠져있는 것이다. 어느 지역에 100가구가 있고 100채의 주택이 있는데 외국인 가구가 5가구라면 이들 5가구나 빠진 95가구가 가구수로 적용되어 그 지역의 주택보급률은 (100/95)×100=105.26%가 되어 집이 대략 5개가 남는 것으로 나온다. 즉 빈 집이 없는데도 빈 집이 있는 것으로 계산되는 것이다. 외국인 가구가 많은 동네는 남아도는 빈집이 많은 것으로 나타나게 된다. 점점 외국인 가구가 증가하는 상황에서 이 때문에 지역마다 주택보급률이 100%를 상회하는 지역이 빈출하고 있다.[1]주택보급률을 계산할 때 주택수에 고시원, 오피스텔, 쪽방, 기숙사 등은 주택으로 치지 않고 제외한다. 2019년 서울의 주택보급률 96%는 얼핏 서울 전체 가구수가 100가구라면 4가구는 집이 아닌 길에서 자는 것인가?라고 오해하게 되는 이유이다. 현실은 이들 가구(1인 가구 포함)는 가구수로는 잡히는데 기숙사에 살고있어서, 또는 비싼 오피스텔[2]에서 살고 있는 것일 수 있는 것이다.극단적으로 말해서 제대로 된 통계
