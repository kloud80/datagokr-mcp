status: active
summary_user: 부산 남구의 가로수를 노선(위치명)별 한 행으로 담은 파일로, 구간 시점·종점, 식재거리(km), 위도·경도와 왕벚나무·은행나무·이팝나무 등 40여 개 수종별 본수와 총합계를 기록한다. 구청 녹지 담당자나 연구자가 '남구 어느 도로에 어떤 수종이 몇 그루 심겨 있고, 가로수 정비나 수종 교체가 필요한 노선은 어디인가'를 확인할 때 쓴다. 전역 조인 키는 없어 위도·경도로 지도·공간 데이터와 겹치거나, 구군명 기준으로 부산 다른 구의 가로수현황과 이어 붙여 쓴다.
limits: 표준 행정코드나 도로 식별코드 같은 공통 조인 키가 없어 다른 데이터와는 이름 매칭이나 좌표로만 연결된다. 남구 한 개 구만 다루며, 개별 나무 단위가 아니라 노선 단위의 수종별 집계다.
