summary_user: 경상남도 거창군의 상하수도 요금 단가를 구분(상수도·하수도 등)·업종·사용량 구간별 세제곱미터당 가격(원)으로 담은 소규모 요율표 파일(CSV 약 1.3KB)이다. 거창군 주민이나 사업자가 가정용·일반용 같은 업종과 월 사용량에 따라 수도요금이 얼마나 나올지 추산할 때 쓴다. 전역 조인 키가 없어 다른 시군의 요금 데이터와는 업종명·사용량 구간을 이름으로 맞춰 비교하거나, 관리기관명으로 같은 기관 데이터와 잇는다.
description_portal: '상하수도 요금은 우리가 일상에서 사용하는 수돗물의 공급(상수도)과 사용 후 버려지는 하수의 처리(하수도)에 드는 비용을 합산하여 청구되는 공공요금입니다.1. 요금의 구성상수도 요금: 취수장에서 물을 끌어와 정수 처리 후 가정까지 보내는 데 드는 비용입니다.하수도 요금: 쓰고 버린 물을 하수처리장으로 이송하여 깨끗하게 정화하는 데 드는 비용입니다.물이용부담금: 상수원 보호구역 주민 지원과 수질 개선을 위해 부과되는 법정 부담금입니다.2. 산정 방식 및 납부요금은 보통 기본요금에 사용량에 따른 업종별 단가를 곱하여 산출됩니다. 가정용, 일반용, 대중탕용 등으로 구분되며, 지자체마다 조례에 따라 단가가 다를 수 있습니다. 최근에는 고지서 외에도 지자체 상수도사업본부 홈페이지나 앱을 통해 실시간 사용량과 미납 요금을 간편하게 조회하고 납부할 수 있습니다.3. 알아두면 좋은 팁누수 발생 시 감면 혜택을 받을 수 있는 제도가 있으며, 다자녀 가구나 기초생활수급자 등은 복지 할인이 가능하므로 해당 지자체에 확인하는 것이 좋습니다. 물을 아끼는 습관은 가계 경제뿐 아니라 환경 보호에도 큰 도움이 됩니다.'
