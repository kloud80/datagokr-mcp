summary_user: 서울 관악구 관내 주요 도로를 노선·구간별로 나눠 2025년도 가로등 등주가 몇 본 설치돼 있는지 정리한 집계 파일이다(CSV 약 1.8KB 규모의 작은 표). 주민이나 구청·도시 분석가가 "우리 동네 이 도로 구간에는 가로등이 몇 개나 있나", "어느 노선의 등주가 많아 교체·보수 부담이 큰가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명·구간 이름을 맞추거나 같은 기관(관악구) 기준으로만 이어 쓴다.
description_portal: 본 데이터는 관내 주요 도로별 2025년도 가로등 설치 수량 현황을 정리한 자료로, 각 도로 구간에 몇 본의 등주가 설치되어 있는지를 수치로 확인할 수 있도록 구성되어 있습니다.항목은 ▲기관명 ▲노선명 ▲구간 ▲등주수량(본) ▲데이터 기준일자로 이루어져 있으며, 도로별 명칭과 해당 구간, 설치된 등주의 총량이 핵심 정보로 제시됩니다.본 데이터는 도로별 등주 설치 규모를 비교하거나 특정 노선의 설치 수량을 파악하는 데 활용할 수 있으며, 향후 유지관리 계획 수립, 교체·보수 대상 검토 등의 기초자료로 사용할 수 있습니다.
