description_portal: '본 데이터는 경상남도 남해군 관내에 설치된 스마트워터미터기의 분포 현황 및 관련 핵심 정보를 체계적으로 제공합니다. 이는 첨단 정보통신기술(ICT)을 기반으로 한 효율적인 수자원 관리 시스템 구축, 물 사용량의 정확한 원격 검침 및 실시간 분석, 그리고 누수와 같은 문제 발생 시 신속한 상황 파악 및 대응을 지원함을 주요 목표로 합니다. 스마트워터미터기가 설치된 각 "읍면" 단위의 지역 정보와 함께 해당 지역별 "설치 갯수", 그리고 개별 또는 그룹 단위 미터기의 정밀한 "위치 데이터"(예: 좌표 또는 상세주소) 등 필수적인 정보를 포함하고 있습니다.'
