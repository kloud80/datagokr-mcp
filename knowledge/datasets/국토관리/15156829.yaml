description_portal: 2025년 9월 5일에 공고되어 9월 25일부터 10월 17일까지 접수마감된 부산도시공사 행복주택 예비입주자 모집공고의 청약경쟁률(타입별, 공급계층별) 현황입니다. (*본 청약경쟁률은 신청에 대한 경쟁률이며 최종경쟁률이 아닙니다.)금회 공고에는 총 5개 행복주택 단지(동래행복주택, 금호 센트럴베이 행복주택 일광, 경동 포레스트힐 행복주택 아미, 더파크 이기대 행복주택, 금사 행복주택)의 예비입주자를 모집하며, 추첨을 통해 선정된 서류제출 대상자를 대상으로 관계법령에 따라 행복주택 입주자격을 심사하여 2026년 2월에 최종 당첨자를 발표할 예정입니다. (*당첨자발표는 사회보장정보시스템 처리기간에 따라 연기될 수 있으며 연기 시 별도 공지할 예정입니다.)
