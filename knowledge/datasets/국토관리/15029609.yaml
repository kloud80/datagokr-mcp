summary_user: 경기도 구리시가 운영하는 재난대응용 빗물 배수펌프장을 펌프장 1곳당 1행으로 담은 현황 파일로, 주소·위경도, 설치년도·설치목적, 모터 펌프 규모와 대수, 비상발전기 용량, 한전 전원공급 회선과 계약전력, 연간 사용전력량·전기요금 최대·최소값이 들어 있다. 구리시 주민이나 방재 담당자가 "우리 동네 침수에 대비한 배수펌프장이 어디에 있고, 이중 전원과 비상발전기를 갖췄는가"를 확인하거나 분석가가 펌프장별 전력비용을 비교하는 데 쓴다. 전역 조인 키는 없으므로 위경도나 주소로 하천·침수 관련 공간자료와 겹쳐 보거나, 펌프장명·관리기관명으로 다른 지자체 배수펌프장 현황과 맞춰 쓴다.
description_portal: 경기도 구리시에 설치되어 있는  태풍 및 호우 등 자연재난으로 인한 재난 발생 시 시민의 안전과 재산을 지키고 각종  재난대응을 위해 운영중인 배수펌프장에 관련된 현황정보(펌프장명, 위치, 경위도, 규모, 목적, 장비 등)를 제공합니다.1. 경기도 구리시에 설치되어 있는 인창,수택,수택3,토평, 아천펌프장 등 5개소 빗물펌프장      특고압 전기요금 및 전기사용량 자료 제공 기간은  2024년 4월 ~ 2024년 10월까지 이며    토평지하펌프장 저압 전기요금 및 전기사용량 자료 제공 기간은 2024년 9월 ~ 2025년 8월까지 입니다. 3. 각 펌프장에 설치되어 있는 펌프 수량과 펌프 규모, 그리고 각 펌프장 별 위치 등을 제공합니다. 4. 각 펌프장에 공급되고 있는 전기공급 2회선 유무, 계약용량 현황을 제공합니다
