summary_user: 경상남도 하천관리시스템에서 모은 제방 현황을 제방 한 건씩 담은 1회성 파일로, 포털 설명 기준 5375건이며 제방명·하천명·하천등급과 기점·종점 주소, 연장·둑마루표고·계획홍수량 같은 시설 제원을 포함한다. 하천 관리 담당자나 방재 분석가가 '우리 지역 하천의 제방이 어디서 어디까지 놓여 있고 계획홍수위·둑마루 높이가 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 하천 데이터와는 하천명·제방명 매핑이나 기점·종점 동코드로 행정구역에 붙이는 방식으로만 연결한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 하천관리 제방 현황 데이터는 하천관리시스템에서 수집하여 관리하고 있는 제방 현황에 대한 정보입니다. 제방명, 하천명, 코드, 주소에 대한 정보로 경상남도 제방 현황(위치, 시설정보, 코드, 거리, 관리항목 등)에 대해 알 수 있습니다.(데이터 구성 및 세부항목) 데이터는 하천관리코드, 제방명, 하천명, 하천등급, 기점/종점 코드/주소 등으로 구성됩니다. 총 5375건 입니다. 미집계 데이터는 공란 처리합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터며 현행화 하지 않습니다.
