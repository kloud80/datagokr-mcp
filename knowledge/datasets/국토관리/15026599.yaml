summary_user: 부산광역시 강서구에서 정화조 청소를 맡는 업체 목록으로, 업소별로 업소명·도로명/지번 주소·위도·경도·전화번호·데이터기준일자를 담는 작은 원천 파일(약 334바이트)이다. 강서구청에서 정화조 청소 안내문을 받은 주민이 "우리 동네에서 어느 업체에 연락해 청소를 맡기면 되나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소·좌표로 맞추거나, 같은 강서구 기관의 하수도·하수처리구역 자료와 지역 단위로만 나란히 놓고 본다.
description_portal: 부산광역시 강서구 내 정화조청소업체현황입니다. 제공되는 데이터는 다음과 같습니다. (업소명, 도로명주소, 지번주소, 전화번호, 데이터기준일자)부산광역시 강서구청으로부터 정화조 청소 안내문을 받았을 경우 아래 업체로 연락하여 정화조 청소를 실시하시면 됩니다.기한 내 청소를 실시하지 않을 경우 불이익 처분을 받을수 있습니다.강서정화사 업체는 부산광역시 강서구 대저로 183 소재하며, 연락처는 051-972-2368이며,강동산업사 업체는 부산광역시 강서구 생곡로 8 소재하며, 연락처는 051-271-3696으로 연락하시면 됩니다.공공하수처리구역으로 편입될 경우에도 정화조를 철거할 수 있습니다.
