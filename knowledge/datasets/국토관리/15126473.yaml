summary_user: 신고된 연립·다세대 주택의 전월세 계약을 건별로 담은 실거래 원천 자료로, 보증금·월세·전용면적·건축년도·계약기간·갱신요구권 사용 여부 등을 법정동·지번 단위로 제공하며 범위는 전국이다. 세입자나 임대인, 분석가가 특정 시군구의 특정 계약월 연립다세대 전월세 보증금과 월세 수준이 어떤지 확인하는 질문에 쓴다. 시군구 코드(sggCd, 법정동코드 앞 5자리)를 키로 같은 실거래 부문의 다른 거래 유형이나 지역 기준 자료와 이어 쓴다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료 및 「주택임대차보호법」에 따라 부여된 확정일자 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월 6자리(예시 : 201801)로 해당 지역, 해당 기간의 연립대세대 전월세 실거래가 상세자료를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 연립다세대 전월세 실거래가 자료를 제공하는 연립다세대 전월세 실거래가 정보 조회. 세부사항 참고자료 참고.* 공개내용 중 개인정보보호를 위해 연립다세대 전월세의 동/호정보는 제공되지 않습니다.'
team:
  dept: 부동산소비자보호기획단
services:
  - op: /getRTMSDataSvcRHRent
    name: 연립다세대 전월세 실거래가 공개 자료
    endpoint: https://apis.data.go.kr/1613000/RTMSDataSvcRHRent/getRTMSDataSvcRHRent
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
