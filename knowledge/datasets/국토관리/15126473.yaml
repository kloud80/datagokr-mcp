        desc: 지역코드, 각 지역별 코드 행정표준코드관리시스템(www.code.go.kr)의 법정동코드 10자리 중 앞 5자리
      - name: DEAL_YMD
        required: true
        example: '201512'
        desc: 계약월, 실거래 자료의 계약년월(6자리)
