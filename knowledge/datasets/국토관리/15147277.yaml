summary_user: 광주광역시 북구의 2005년 기준 용도지역 면적을 시군구 단위로 집계한 CSV 파일(1,202바이트)로, 도시지역의 주거·상업·공업·녹지 세부 용도지역과 비도시지역의 관리·농림·자연환경보전지역 면적을 제곱킬로미터로 담는다. 도시계획 분석가나 연구자가 '2005년 북구 면적 가운데 주거지역과 녹지지역이 각각 얼마였나'처럼 과거 시점의 토지이용 구성을 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 연도·다른 자치구의 용도지역 현황과는 기준연도와 시군구 이름을 맞춰 이어 쓴다.
