summary_user: 중앙부처와 지방자치단체가 시행하고 실적평가까지 마친 국가공간정보사업을 사업 한 건씩 담은 목록으로, 사업명·사업연도·사업기간·사업분류·계속/신규 구분·담당기관·부서와 천원 단위 예산(총예산, 국비, 시도비, 시군구비, 기타)을 전국 범위로 담는다. 공간정보 정책 분석가나 지자체 담당자가 "어느 기관이 어떤 공간정보사업에 연도별로 얼마의 국비·지방비를 썼는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 담당기관명이나 사업명을 이름으로 맞춰 이어 써야 한다.
description_portal: 중앙부처 및 지방부처에서 시행하는 국가공간정보사업에 대한 기본정보이며 매해 시행계획을 수립하고 등록한 사업의 실적평가가 완료된 사업에 대한 정보를 제공함(사업의명,  사업년도, 사업기간, 사업분류, 사업구분, 관리기관, 부서명, 총 예산, 국가 지원 예산, 시/도 지원 예산, 시/군/구 예산 등)○ 2023년 고도화 이후로 사업분류의 값들이 변경되었습니다. ○ 사업 구분은 "계속" , "신규" 사업으로 구분됩니다.○ 예산은 천원 단위 이고 총예산, 국가 지원 예산, 시/도 지원 예산, 시/군/구 예산, 기타 예산으로 나누어집니다.
