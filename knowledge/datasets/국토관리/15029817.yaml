summary_user: 서울 강남구 안에 있는 지식산업센터를 센터 한 곳당 한 행으로 정리한 현황 파일입니다. 센터명, 소재지, 공장부지·제조시설·지원시설 면적, 건축물 수, 지하~지상 층수(건축규모), 주용도(지식산업센터·도시형공장·공장 등)를 담으며, 파일 크기는 565바이트로 몇 건에 불과합니다. 강남구에 어떤 지식산업센터가 어느 규모로 있는지 확인하려는 입주 희망 사업자나, 구별 산업시설 분포를 비교하는 분석가가 씁니다. 공통 조인 키는 없어서 다른 시군구 지식산업센터 파일과 합칠 때는 시군구명을 기준으로 붙이고, 건축물대장과 연결할 때는 소재지 주소나 센터명을 맞춰서 이어야 합니다.
description_portal: 서울특별시 강남구 지식산업센터 현황 정보로 센터명, 소재지, 공장부지면적, 공장시설(제조시설)면적, 부대시설(지원시설)면적, 건축물수, 건축규모(지하 ~ 지상 층수), 주용도( 지식산업센터, 도시형공장, 공장 등)등 데이터입니다 건축규모(지하 ~ 지상 층수)는  지하 몇 층부터 지상 몇 층까지 건물이 조성되어 있는지 층수에 대한 정보입니다. 센터의 전반적인 주 용도를 구분하는 정보로 "주용도"가 있으며, 이 항목에는 예를 들어 지식산업센터, 도시형공장, 혹은 공장 등 구체적인 용도 구분이 명시되어 있습니다. 이러한 데이터는 강남구 내 지식산업센터의 분포, 규모, 용도 등의 전반적인 현황을 총체적으로 파악할 수 있도록 도와줍니다.
