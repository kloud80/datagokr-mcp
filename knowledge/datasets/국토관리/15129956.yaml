summary_user: 평택시 도시계획정보시스템(UPIS)에 등록된 도로·주차장 등 도시·군계획 교통시설을 도형 단위로 한 행씩 담은 CSV 파일(약 49KB)이며, 범위는 평택시 한 곳입니다. 도시계획 실무자나 분석가가 '평택시에 결정된 교통시설은 어떤 종류이고 면적·길이와 집행 상태는 어떤가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 시군구코드나 결정고시관리코드를 같은 UPIS 계열 데이터(결정고시·다른 시설현황)와 이름·코드로 맞춰 이어 쓴다.
description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 교통시설현황으로 현황도형 관리번호, 도형 조서관리 코드, 결정고시관리코드, 라벨명, 면적_도형, 길이_도형 등의 항목을 제공합니다.공간의형성이나 주민의 생활에 있어서 필수적인 시설로서 당해지역 뿐 아니라 시.군 전체의 기능과 발전방향에 큰 영향을 주는 시설 중 하나로 도로ㆍ철도ㆍ항만ㆍ공항ㆍ주차장ㆍ자동차정류장ㆍ궤도ㆍ차량 검사 및 면허시설 등이 포함될 수 있습니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
