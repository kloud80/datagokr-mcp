summary_user: 창원시 5개 구(의창·성산·마산합포·마산회원·진해)의 저수조 청소 의무대상 건축물을 건축물 한 건씩 담고, 건축물관리번호·건축물명·최종청소일·비고를 기록한 CSV 파일(약 70KB)이다. 시민이나 건물 관리자가 "우리 아파트·건물 저수조를 마지막으로 언제 청소했나"를 확인하거나, 분석가가 연 2회 청소 의무 이행 여부를 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 데이터와는 건축물관리번호나 건축물명을 이름·코드 매핑으로 맞춰야 이어 쓸 수 있다.
description_portal: 경상남도 창원시 의창구, 성산구, 마산합포구, 마산회원구, 진해구에 대한 데이터이며, 수도법 제33조에 따라 저수조 청소의 의무대상이 되는 건축물에 대한 저수조 대상 건축물 및 청소여부의 항목을 제공합니다.저수조 청소 대상 건축물은 수도법 시행령 제50조에 의거하며, 또한 저수조 청소는  연2회  실시하여야합니다.저수조 청소 대상건축물은 다음과 같습니다.1. 연면적 5,000제곱미터 이상 건축물2. 연면적 3,000제곱미터 이상 업무시설3. 연면적 2,000제곱미터 이상 2개 이상 용도로 사용하는 건축물4. 연면적 2,000제곱미터 이상 예식장, 학원, 지하도에 있는 상가5. 대규모점포(백화점, 대형마트 등)6. 1천석 이상 공연장, 실내체육시설, 5층 이상 아파트 및 그 복리시설 등이 있습니다.제외대상으로는 저수조를 거치지 않고 수돗물을 공급하는 건축물이나 시설 또는 음용수와 생활용수를 제외한 소방전용 용수 또는 변기 세척 용수로만 공급되는 저수조입니다.
