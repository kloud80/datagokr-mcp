summary_user: 부산도시공사가 운영하는 영구임대아파트 11개 지구의 지구별 세대수·최초 입주 시기와 함께, 입주자 자격 구분(수급자·일반·탈락 단계·할증 등)별 표준임대보증금(천원)과 표준임대료(원)를 담은 지구·구분 단위의 소규모 표(약 1.8KB CSV)입니다. 부산에서 영구임대 입주를 고려하는 시민이나 상담 기관이 '수급자와 일반 입주자는 어느 지구에서 보증금과 월 임대료를 얼마나 내는가'를 비교하는 데 쓴다. 전역 조인 키나 코드표가 없어 지구명 문자열로 다른 공공임대 단지 자료나 전월세 실거래 자료와 수작업으로 맞춰 이어 쓴다.
description_portal: '부산도시공사에서 운영하는 영구임대아파트의 임대료 및 임대보증금 자료로 지구별 세대수, 지구별 평형 정보, 최초입주년월, 임대기간, 대상에 따른 표준임대보증금과 표준임대료를 제공하고 있습니다ㅇ 대상지구 : 영구임대아파트 11개지구 (개금2지구, 다대3지구, 다대4지구, 다대5지구, 동삼1지구, 동삼2지구, 학장1지구, 덕천지구, 반송지구, 부곡지구, 동백지구)ㅇ기준일자 : 2026년 4월 9일ㅇ 임대보증금 상한액 : 2,140,000원 ~ 21,100,000원ㅇ 임대료 상한액 : 45,600원 ~ 277,600원  * 임대보증금 및 임대료는 지구에 따라 상이합니다.   * 또한, 입주 계약 및 재계약 시 입주민의 자격 요건 조회 과정을 거쳐 산정되며 자격 요건에 따라 임대료 및 임대보증금은 상이할 수 있습니다.'
