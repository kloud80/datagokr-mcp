description_portal: 부산광역시 상수도 단수현황 정보(단수개시일자, 단수종료일자, 단수사유 등)를 개방합니다단수란 계획적이거나 비계획적으로 수도물 공급이 일정시간 중단되는 상황을 의미합니다. 상수도 단수는 수도관 교체, 정수장 보수, 배수지 청소 등 정비, 공사목적의 계획단수와 상수도관 파손 노후관 누수, 지진, 홍수, 한파 등 자연재해, 대형 화재시 소방급수 우선 공급 등 긴급상황으로 예고없이 발생하는 비계획적 돌발 단수가 있습니다.개방되는 데이터에는 담당 사업소명, 단수 개시 일자/시간, 단수 종료 일자/시간, 단수 종류, 단수 사유, 단수 지역, 단수 설명 등의 정보가 제공됩니다.
