summary_user: 부산광역시 상수도 단수 건별로 담당 사업소, 단수 개시·종료 일시, 단수 종류(계획·돌발), 사유, 지역, 설명을 담는 원천 목록이다. 부산 시민이나 사업자가 '우리 동네에 언제부터 언제까지 단수가 있나'를 확인하거나, 분석가가 사업소·사유별 단수 발생을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단수 지역명·사업소명(div_nm) 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
