summary_user: 서울특별시가 직접 관리하는 도시계획시설(공원) 가운데 장기미집행 등으로 결정이 실효된 근린공원을 공원별로 정리한 목록으로, 공원명·위치·기정/변경/변경 후 면적·최초 결정일·실효일자·실효 위치·실효 사유를 담는다. 시민·토지 소유자·도시계획 분석가가 "우리 동네 공원 부지가 언제, 어떤 사유로 공원에서 해제됐는가"를 확인하거나 실효로 줄어든 공원 면적을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공원명·위치(주소) 문자열 매칭이나 같은 기관(서울시) 공원·도시계획 자료와의 이름 대조로만 이어 쓴다.
description_portal: 「도시계획시설(공원) 결정 실효 현황」은 서울특별시에서 직접 관리하는 도시계획시설(공원) 중 「국토의 계획 및 이용에 관한 법률」 제48조 및 같은 법 제88조에 따라 실효된 근린공원 현황을 정리한 데이터입니다. 장기미집행에 따른 자동 실효 또는 실시계획 고시 후 일정 기간 경과로 효력이 상실된 대상이 포함됩니다.데이터 항목은 공원명, 위치, 기정 면적, 변경 면적, 변경 후 면적, 최초 결정일, 실효일자, 실효위치, 실효 사유 등으로 구성되어 있어 도시계획 결정 이후 변경과 실효에 이르는 행정 이력을 종합적으로 확인할 수 있습니다. 이를 통해 공원 지정 및 해제 현황과 도시공간 정책 변동 사항을 체계적으로 파악할 수 있습니다.단, 본 자료는 서울특별시에서 직접 관리하는 시설만을 대상으로 하며, 자치구에서 개별적으로 관리하는 공원 시설의 실효 현황은 포함하지 않습니다.
