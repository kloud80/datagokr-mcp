summary_user: 토지(임야)대장 기반 토지소유현황 통계 중 시도·시군구별로 소유자 연령대(5세 단위)에 따른 소유 면적·지번수·가액을 집계한 전국 범위 파일 자료다. 지역별로 어느 연령층에 토지 소유가 몰려 있는지, 예컨대 우리 시군구에서 60대 이상이 보유한 토지 면적과 가액 비중이 얼마인지를 따지는 분석가·정책 담당자의 질문에 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어, 다른 통계와는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: 토지소유현황 통계는 토지(임야)대장에 등록된 현황을 기반으로 공시지가, 주민등록, 비법인 등록 전산자료, 토지실거래가를 연계해 전국 단위의 개인(세대)·법인·비법인의 토지 소유 구조를 집계·분석하는 자료입니다. 최근 공개된 ’23년 통계에서는 전체 인구의 37.1%인 1,903만 명이 토지를 보유한 것으로 나타나 소유 분포의 흐름을 가늠할 수 있습니다. 올해는 유산취득세 도입 입법예고(2025.3.19) 등 세제 변화가 상속·증여 기반의 소유 편중과 세대 간 이전 구조에 영향을 줄 가능성이 큽니다. 따라서 ‘개인/법인·비법인’별 보유 면적·필지 수, 연령대별·지역별 집중도를 함께 읽어야 합니다.  또한 토지거래허가구역 확대(서울 강남3구·용산 등, 2025.3 이후)는 거래량·보유구조의 단기 변동을 만들어, 허가구역 내 실수요 중심 거래와 법인 보유행태 변화를 동반할 수 있습니다.  여기에 2025년 공동주택 공시가격(안) 평균 3.65% 상승이 보유세·보유 전략에 파급을 주며, 경매·공매 물량 확대는 강제 이전을 매개로 지역·계층 간 소유 재편을 촉진하는 변수입니다.  한편 빈집정비 특례령(2025.5.27 시행) 개정과 지방의 공공 매입·정비 확대는 공공 보유 비중을 늘려 소유구분 구조를 바꿀 수 있습니다. 데이터 거버넌스 관점도 중요합니다. 본 통계는 주민등록·거래·공시가격 등 다중 행정자료를 결합하므로, 개인정보 보호와 비식별 처리가 필수입니다. 실제로 개인정보위는 2024년 유출 신고 307건(해킹 56%)을 발표하며 공공·민간의 보안 강화를 당부했습니다. 공개 시에는 집계 단위 중심의 배포, 재식별 위험 점검, 메타데이터(집계 기준·행정구역 변경·결측 처리) 고지 등을 권장합니다.
