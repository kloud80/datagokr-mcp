summary_user: 경상북도 영주시에서 허가된 개발행위를 건별로 담으며, 사업 내용·법정 읍면동명·대지 면적·용도명·신청일·시작일·만료일·사업 목적을 읍면동 단위로 제공한다. 부동산·건설업계나 도시계획 분석가가 '영주시 어느 읍면동에서 어떤 용도의 개발 허가가 얼마나 넓은 면적으로 나왔는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 법정 읍면동명(STTY_EMD_NM) 같은 이름 매핑이나 같은 기관 데이터로만 잇는다.
limits: 표준 행정코드나 지번 같은 전역 키가 없어 공간정보·부동산 데이터와 자동 결합하기 어렵고, 이름 매칭에 의존해야 한다. 범위는 영주시 한 곳이라 타 시군구와 비교하려면 지자체별 데이터를 따로 모아야 한다. 갱신은 이벤트 주기로 분류되어 있어 정기적으로 새 건이 추가된다고 가정하지 않는다.
