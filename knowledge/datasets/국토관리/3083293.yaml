summary_user: 서귀포시 관내에 등록된 대부업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·소재지·연락처·사업내용·영업상태(정상·폐업·휴업)와 데이터기준일자를 포함하며 파일 크기는 789바이트 수준의 소규모 목록이다. 시민이 대출 상담이나 계약 전에 "이 업체가 서귀포시에 정식 등록된 대부업체인가, 지금도 영업 중인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호나 소재지 주소를 이름·주소 매칭으로 맞추거나, 같은 기관(서귀포시) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 서귀포시 관내에서 등록·운영 중인 대부업체의 현황을 제공하는 자료입니다.업체명, 영업소재지, 연락처, 영업 상태(정상·폐업·휴업) 등의 항목이 포함됩니다.이를 통해 합법적으로 등록된 대부업체를 확인하고, 불법 대부 행위나 미등록 영업으로 인한 피해를 예방할 수 있습니다.또한 지역 내 대부업 시장 규모를 파악하고, 업체 분포 현황을 분석하여 특정 지역의 금융 접근성이나 과도한 대부업 집중 여부를 판단할 수 있습니다.금융당국이나 지자체는 해당 데이터를 활용해 소비자 보호 정책을 수립하고, 불법 사금융 단속 및 지도 점검 활동을 강화할 수 있습니다.일반 시민은 대출 상담이나 계약 체결 전에 해당 업체의 합법성 여부를 사전에 검증하는 참고 자료로 활용할 수 있습니다.
