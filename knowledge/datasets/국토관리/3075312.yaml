description_portal: 본 데이터는 대구광역시 수성구 관내에 설치된 빗물이용 시설(빗물 저류·재이용 설비 등)의 현황 정보를 정리한 자료로, 시설명 또는 설치 대상지(건물·공원 등), 도로명 주소 및 위도·경도 위치정보, 설치 연도, 시설 유형(저류조, 지붕집수, 투수포장 등), 저장 용량 또는 재이용 가능량(㎥), 운영 주체(공공·민간), 관리 상태, 데이터 기준일자 등의 항목으로 구성된다. 본 자료는 각 시설의 분포, 설치 연도 및 유형, 용량 정보를 통해 도시 물순환 정책 평가, 우수 저류량 분석, 침수 예방 및 배수 체계 보완, 공원 및 주택 인프라 계획, 녹색 인프라 홍보 등에 활용 가능하다. 또한 관리 상태와 운영 주체를 통해 유지보수 계획 수립 및 민관 협력 체계 강화, 환경 교육 및 주민홍보자료 제작 등 다양한 목적의 기초자료로 활용될 수 있으며, 수성구청은 신규 설치 및 점검 시마다 정기적으로 데이터를 갱신합니다.
