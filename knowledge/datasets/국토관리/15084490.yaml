summary_user: 창원시 도시재생사업지구 안에서 관리·운영 중인 마을기업과 협동조합을 한 행에 한 곳씩 담은 목록 파일로, 조합 유형(구분)·조합명·운영여부·소재지·사업내용을 담는다(CSV 약 1.3KB의 소규모 원천 목록). 도시재생 담당자나 주민·연구자가 "창원 마산합포·의창·진해 도시재생지구에서 어떤 마을기업·사회적협동조합이 무슨 사업을 하는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 조합명이나 소재지 주소를 기준으로 도시재생 활성화지역·뉴딜사업 목록이나 사회적경제기업 명단과 이름·주소 매칭으로 이어 쓴다.
description_portal: 창원시 관내 도시재생사업지 내 창업현황으로, 도시재생사업지구 내 도시재생 사업 활성화를 위해 관리운영중인 마을기업, 협동조합 현황입니다.창원시 마산합포구 소재에 있는 마을기업인 창동라온빛과 사회적협동조합인 사단법인창동예술촌, 일반협동조합인 부림창작공예촌협회에서는 다양한 문화예술 프로그램사업을 추진하고 있으며일반협동조합인 에스빠스리좀협동조합은 영화상영 및 공연사업, 수상점협동조합은 체험 및 핸드메이드 사업을 추진하고 있습니다.창원시 의창구 소재에 있는 사회적협동조합인 행복의창사회적협동조합에서는 행복의창 커뮤니티비즈니스센터 운영관리와 마을복지사업, 수익사업(마을카페 운영) 등을 하고 있으며,소계 마을관리 사회적협동조합은 주민공동이용시설 내 카페, 프로그램실, 헬스장, 주차장 등을 운영하고 있습니다.창원시 진해구 소재에 있는 사회적협동조합인 블라썸여좌사회적협동조합은 여좌커뮤니티센터 및 카페를 운영하고 있으며,진해 충무 마을관리 사회적협동조합은 충무현장지원센터에 위치하여 사업진행중인 충무지구 도시재생 뉴딜사업 구축물 관리 및 도시재생의 지속적인 관리를 하고 있으며마을관리사회적협동조합인 진해부엉이마을협동조합은 부엉이마을 도시민박 및 펀랩, 창작소 등 체험프로그램 운영을 계획중에 있습니다.이와 같이 다양한 마을기업과 협동조합에서 여러 방면의 프로그램을 추진하고 시설 유지관리를 통해 건전한 주민공동체 생활을 영위하고 있습니다.
