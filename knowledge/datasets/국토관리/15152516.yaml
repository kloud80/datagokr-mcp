summary_user: 한강홍수통제소 AI 홍수예보시스템이 중기 침수위험 예측에 쓰는 전국 시·군·구별 강우량·유출량 위험단계(관심·주의·경계·심각) 기준값을 코드표 형태(코드명·코드값·의미·설명)로 담은 고정자료이며, 포털 파일(zip)에는 샘플 100건만 들어 있다. 방재 담당자나 분석가가 '우리 시·군·구는 강우량이나 유출량이 얼마를 넘으면 경계 단계가 되나'를 확인하거나 예측 강우를 위험단계로 환산할 때 쓴다. 실측 컬럼에 행정코드 같은 전역 조인 키가 없어, 강우 관측·예보 자료와는 시·군·구 이름을 매핑하거나 같은 기관 코드로만 연결한다.
limits: 포털 파일은 업로드 용량 제한으로 샘플 100건뿐이라 전국 전체 기준값을 얻으려면 담당자에게 따로 요청해야 한다. 좌표가 없는 비공간 자료이고 표준 행정코드도 없어 지도 결합이나 자동 조인에는 이름 매핑이 필요하다. 명세상 이벤트성으로 생성된 뒤 바뀌지 않는 자료라 정기 갱신을 기대하기 어렵다.
