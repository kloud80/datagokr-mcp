summary_user: 안산시 관내 하천을 하천 한 건당 한 행으로 정리한 지정 현황 목록으로, 하천 구분(지방하천 등)·하천명·지정고시일과 고시번호·기점과 종점 주소·유역면적·하천연장·관리기관과 부서를 담는다. 시청 하천 담당자나 개발·부동산 분석가가 "이 땅 옆 하천은 언제 어떤 고시로 지정됐고 누가 관리하나"를 확인하거나 하천 규모를 비교할 때 쓴다. 전역 조인 키나 하천코드가 없어 다른 하천·유역 데이터와는 하천명이나 관리기관 이름으로만 맞춰 이어야 한다.
limits: 하천코드(WAMIS 등) 같은 공통 키가 없어 국가 하천 목록이나 공간정보와 정확히 연결되지 않고, 이름 매칭에 의존해야 한다. 기점·종점이 주소 텍스트일 뿐 좌표나 하천구역 경계가 아니므로 하천구역 안팎 판정이나 지도 분석에는 바로 쓰지 못한다.
