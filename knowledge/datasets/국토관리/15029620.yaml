summary_user: 경기도 구리시에서 공사 중인 공동주택(아파트·연립주택 등)을 허가 건별로 담은 파일로, 건축구분·허가번호·건축주·대지위치·면적·건폐율·용적률·층수·세대수·착공일·입주예정일·시공자·감리자 등을 한 행에 정리한다. 구리시에서 어떤 단지가 언제 착공해 언제 입주 예정인지, 세대수와 시공사는 어디인지 확인하려는 주민·수요자나 지역 주택 공급을 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 허가번호·대지위치 주소나 단지명 같은 이름 매칭으로만 이어 쓰며, K-apt 단지 정보나 인허가·청약 자료와는 이 방식으로 연결한다.
description_portal: '■ 데이터 정의 (무엇을 담고 있나요?)이 데이터는 경기도 구리시에서 현재 **새로 짓고 있거나 공사 중인 아파트, 연립주택 등(공동주택)**의 진행 상황을 한눈에 확인할 수 있도록 정리한 자료입니다.■ 데이터 구성 (어떤 내용이 들어있나요?)이용자가 정보를 쉽게 찾을 수 있도록 크게 세 가지 묶음으로 구성했습니다.공사 기본 정보: 어떤 종류의 건물인지(신축/증축), 허가 번호는 무엇인지, 공사 이름은 무엇인지, 누가 짓는지(건축주명) 등위치 및 땅 정보: 정확한 주소(대지위치), 땅의 용도(지목) 등건물 크기 정보: 땅의 넓이(대지면적 ㎡), 건물이 차지하는 넓이(건축면적 ㎡), 전체 층의 합계 면적(연면적 ㎡), 건폐율(%) 및 용적률(%) 등'
legal_basis_portal: 건축행정시스템 관리 등 현황 자료 통계 보유
