summary_user: 경상북도 안동시 공간정보시스템에 등록된 관내 건물을 건물 한 동씩 담은 파일로, 건물명·형태·용도·높이, 법정·행정읍면동, 지번과 도로명주소, 주요건물 여부를 기록한다. 안동시 특정 동네에 어떤 용도의 건물이 얼마나 있는지, 높은 건물이나 주요건물이 어디에 몰려 있는지를 확인하려는 분석가나 시설 관리자가 쓴다. 전역 조인 키는 없어서 법정읍면동·지번 또는 도로명·건물번호 같은 주소 값을 문자 그대로 맞춰 건축물대장 등 다른 주소 기반 데이터와 이어야 한다.
description_portal: 해당 데이터는 경상북도 안동시에서 운영 중인 공간정보시스템 내에서 관내 공간정보 건물에 대한 정보가 포함되어 있으며,건물 데이터(지형지물부호, 건물명, 건물세부명, 건물형태, 건물용도, 법정읍면동, 행정읍면동, 지번_산구분, 지번_본번, 지번_부번, 새주소_도로명, 새주소_본번, 새주소_부번, 건물높이, 주요건물여부)를 정보를 제공합니다.이러한 정보는 도시 기반시설의 효율적인 관리와 활용을 위한 중요한 자료로 활용되며, 각 공간정보 건물 식별 및 위치 파악에 유용하게 쓰입니다.안동시 관내 공간정보 건물 인프라의 현황을 종합적으로 파악하고 분석할 수 있도록 구성되어 있으며, 이를 통해 공공기관은 물론 민간 활용자들도 공간정보를 기반으로 보다 효율적이고정확한 의사결정을 내릴 수 있도록 지원합니다.
