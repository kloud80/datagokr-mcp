summary_user: 제주 지역의 카드 이용 실적을 년월·읍면동·업종별로 묶고 이용자 구분(관광 여부)·연령대·성별에 따라 이용자수·이용건수·이용금액과 매장수를 담은 집계 파일로, 제주빅데이터센터 데이터를 결합한 매쉬업 결과이며 CSV 한 파일이 약 184MB입니다. 제주에서 창업을 준비하는 사람이나 상권 분석가가 '어느 읍면동에서 어떤 업종의 매장당 카드 매출이 높고, 관광객과 도민 중 누가 주로 쓰는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 읍면동명이나 업종코드·업종명을 이름·코드로 맞춰 다른 상권·인구 데이터와 잇는다.
