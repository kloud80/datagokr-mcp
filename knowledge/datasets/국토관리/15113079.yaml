summary_user: 대전광역시 서구에서 추진 중인 소규모재건축·자율주택정비·소규모재개발 등 소규모 주택정비사업을 사업지 한 곳씩 담은 건별 목록으로, 주소·위도경도와 대지면적, 사업 전후 용적률, 층수, 세대수, 추진내용·추진일자를 담는다. 서구 안에서 어느 동에 소규모 정비사업이 진행 중이고 어느 단계까지 왔는지, 완료 시 몇 세대가 공급되는지 알아보려는 주민·부동산 분석가가 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 통계·부동산 데이터와 잇고, 위도·경도로 지도 위에 다른 공간 데이터와 겹쳐 본다.
description_portal: 대전광역시 서구 소규모 주택정비사업 현황 데이터는 노후 주거지 개선과 주거환경 정비를 목적으로 진행되는 다양한 유형의 소규모 정비사업 정보를 체계적으로 정리한 자료입니다. 데이터에는 정비사업의 형태를 나타내는 사업유형구분명(소규모재건축, 자율주택정비, 소규모재개발 등)이 포함되며, 사업대상지를 식별할 수 있는 지번주소·도로명주소, 그리고 행정구역 정보인 행정동코드·행정동명·법정동코드·법정동명이 함께 제공됩니다.사업 규모를 파악하는 중요한 지표로는 대지면적, 건축물 계획 규모를 의미하는 연면적1·연면적2, 해당 면적의 단위, 그리고 사업 추진 전후의 용적률 변화(용적률1·용적률2) 등이 포함되어 있어 정비사업의 개발 강도와 토지 활용 변화를 분석할 수 있습니다. 또한 건축물의 규모를 나타내는 최저층수·최고층수, 사업 완료 시 공급될 세대수 정보도 제공됩니다.아울러 정비사업의 진척 상황을 보여주는 추진내용 및 추진일자, 도시재생뉴딜사업 대상 지역 여부를 확인할 수 있는 뉴딜사업지구여부, 그리고 공간 분석을 위한 위도·경도 등이 포함되어 있어 도시계획, 정비사업 관리, 노후주거지 개선 정책 수립에 직접적으로 활용할 수 있는 데이터입니다.
