description_portal: 경남개발공사에서 시행하는 개발사업 구역 내 분묘조사 결과를 제공하는 데이터입니다. 데이터 항목은 사업지구, 관리번호, 소재지, 지번, 분묘형태, 연고자 확인 여부, 조사일자, 비고 등으로 구성되어 있으며, 사업 시행 과정에서 확인된 분묘 현황을 확인할 수 있습니다.본 데이터는 공익사업 추진에 따른 분묘 이장 및 보상 관련 업무 수행을 위한 기초자료로 활용되며, 사업구역 내 분묘 위치 및 조사 현황 등을 체계적으로 관리하기 위해 작성되었습니다. 동일 사업지구 내 다수의 분묘 정보가 포함될 수 있으며, 조사 결과에 따라 연고자 확인 여부, 분묘 형태, 관리 상태 등의 정보가 함께 제공될 수 있습니다.해당 데이터는 개발사업 추진 과정에서 수행된 현장조사 결과를 기반으로 작성된 자료로, 공공사업 관련 현황 파악, 분묘 이장 업무 지원, 지장물 조사 현황 분석 등 다양한 행정업무 및 정책 참고자료로 활용할 수 있습니다.
