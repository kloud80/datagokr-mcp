summary_user: 경남개발공사가 시행하는 개발사업 구역 안에서 현장조사로 확인한 분묘를 한 기씩 담은 건별 조사 결과 파일(CSV, 약 120KB)로, 묘지 번호, 연고 유무(유무연 구분), 사망자 관계, 단장 기수, 감정평가 여부, 유연분묘 전환 여부 등을 담는다. 공익사업 담당자나 분석가가 '이 사업지구에 연고자 없는 무연분묘가 몇 기이고 감정평가·이장 대상은 얼마나 되나' 같은 질문에 답할 때 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 찾지 못했으므로, 사업 구분 코드나 사업지구 이름을 기준으로 같은 기관의 사업·보상 자료와 이름 매핑으로만 이어 쓴다.
limits: 표준 조인 키가 없어 다른 기관 데이터나 지번·좌표 기반 공간 데이터와 바로 결합되지 않는다. 범위가 전국·비공간으로 분류되어 있어 지도 위 분묘 위치 분석에는 바로 쓰기 어렵다.
