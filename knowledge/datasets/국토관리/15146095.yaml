summary_user: 서울시 주택 건축 인허가를 필지·호별명세 단위 행으로 담은 건별 등록 자료로, 대지 위치·시군구·법정동·지번과 건물 용도·구조·동 수·연면적·총세대수, 승인·착공·사용승인일과 각 예정일을 포함한다. 분석가나 정책 담당자가 "어느 자치구에서 몇 세대 규모 주택이 승인되어 언제 착공·준공되었나"처럼 지역별 주택 공급 흐름과 인허가 진행 단계를 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구명·법정동명·지번 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 표는 서울시 건축 인허가 호별 등록 정보를 행 단위로 정리한 자료입니다. 각 행은 하나의 필지를 나타내며, 대지 위치, 시군구명, 법정동, 대지구분, 주·부지번, 호별명세 일련번호 등 기본 식별정보와 건물 용도, 구조, 동 수, 연면적, 총세대수 등의 건축 세부정보를 담고 있습니다. 또한 승인일, 착공일, 사용승인일 및 해당 날짜의 사전 공고일 정보가 포함되어 건축 진행 단계의 흐름을 파악할 수 있습니다. 이 데이터는 지역별 개발 현황 분석, 인허가 절차 추적, 도시계획과 주거정책 수립을 위한 기초 자료로 활용할 수 있습니다.
