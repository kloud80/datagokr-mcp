summary_user: 서울시에서 이루어진 도시계획 결정·변경·정정 고시를 고시 건별로 담으며, 고시관리코드·프로젝트코드, 담당기관·고시기관, 고시유형·번호·일자, 제목과 내용이 들어 있다. 사업자나 분석가가 "우리 동네 부지에 최근 어떤 도시관리계획 결정이 고시됐나"처럼 개발 가능성의 선행 신호를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 고시번호·제목 속 지명이나 기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 서울시 도시계획 결정고시 정보 데이터는 서울시에서 이루어지는 각종 도시계획 결정 사항을 체계적으로 제공하는 행정 정보입니다. 고시관리코드와 프로젝트코드를 통해 개별 사업과 고시 건을 명확히 구분할 수 있으며, 담당기관과 고시기관 정보로 어느 기관이 계획을 수립·집행하는지 확인할 수 있습니다. 또한 고시유형, 고시번호, 고시일자를 통해 도시계획 변경, 결정, 정정 등 고시의 성격과 시점을 파악할 수 있습니다. 제목과 내용에는 도시계획의 구체적인 결정 사항과 적용 범위 등이 담겨 있어, 시민·전문가·사업자가 도시계획 정책과 사업 진행 상황을 이해하고 활용하는 데 중요한 기초 자료입니다.
