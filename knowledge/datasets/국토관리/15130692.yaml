summary_user: 경기도 내 외국인투자기업 전용으로 지정된 산업단지를 단지 한 곳당 한 행으로 정리한 현황표로, 지역명·단지명·지정년도·전체면적·임대면적(㎡)·입주기업수·입주비율을 담는다. 외국인 투자유치 담당자나 입지를 찾는 외국인투자기업이 '경기도 어느 외투 전용 단지에 임대 여유가 있고 입주율은 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황(산업단지코드 원장)과는 단지명·지역명을 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 외국인투자기업의 입주를 촉진하기 위해 지정된 산업단지의 현황을 지역별로 정리한 자료입니다. 주요 항목은 지역명, 단지명, 지정년도, 전체면적, 임대면적, 입주기업수, 입주비율로 구성되어 있으며, 각 산업단지의 조성 현황과 외국인투자기업의 입주 정도를 파악할 수 있습니다. 해당 데이터는 외국인 투자유치 정책 수립, 산업단지별 경쟁력 분석, 공간 활용률 및 입주율 관리 등에 활용될 수 있으며, 특히 산업 인프라 계획 수립이나 외국인 기업 대상 입지 제안 등 실무적 활용도가 높습니다. 데이터에 포함된 면적 정보는 제곱미터(㎡) 단위로 제공되며, 임대면적 대비 입주비율을 통해 산업단지의 활용 현황을 분석할 수 있습니다.
