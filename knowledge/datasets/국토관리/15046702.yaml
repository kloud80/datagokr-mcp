description_portal: '○ 통계개요* 통계명 : 수질현황* 통계종류 : 서울시 주요지점 수질의 측정내용을 제공하는 일반ㆍ보고통계* 작성목적 : 환경부 수질측정 계획에 의거 주요지점별로 측정한 수질현황을 파악하여,수질의 안전관리 및 오염방지를 위한 정책수립의 기초자료를 제공하는 것을목적으로 함* 조사체계 : 한강유역환경청, 보건환경연구원 → 시도 → 환경부* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 한강서울 주요지점별(하천) 온도, 수소이온농도, 용존산소 등수질측정 현황○ 용어설명* PH (수소이온농도) : 용액 속의 수소 이온 또는 옥소늄 이온의 농도. 보통, 수소이온 지수pH 로서 표시함* DO (용존산소) : Dissolved Oxygen. 물의 오염상태를 나타내는 지표항목중의 하나로 물에녹아 있는 산소의 농도임(단위는 mg/ℓ 또는 ppm)* BOD(생물화학적 산소요구량) : 생물화학적 산소요구량은 통상 BOD(Biochemical OxygenDemand)라고 부른다. 물의 유기오염 지표의 한가지로서 어떤 물속의 미생물이 산소가존재하는 상태에서 유기물을 분해, 안정시키는데 요구되는 산소량임(단위는 mg/ℓ)* COD(화학적 산소요구량) : 생물화학적 산소 요구량과 마찬가지로 하천 오염상태를나타내는 수치로서, 물속의 유기물 등 오염이 되는 물질을 산화제로 산화시키는데요구되는 산소의 양을 말함(단위는 mg/ℓ)* SS(부유물질) :입경 2mm이하의 물에 용해되지 않는 물질, Suspended Solids 의 약칭.또는 현탁물질이라고 함(단위는 mg/ℓ)* 총대장균군 : 단위는 MPN/100㎖'
