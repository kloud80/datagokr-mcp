description_portal: '이 자료는 부산도시공사에서 추진한 주요 공공건축사업의 공사비 구조를 비교·분석한 데이터입니다.각 사업별로 공사 기간, 위치, 공종, 건물용도 등 공사개요와 함께 직접공사비, 제경비, 관급자재비, 공종별 비율 등 세부적인 비용 항목을 상세히 포함하고 있습니다.분석 데이터는 다음과 같은 내용을 보여줍니다:공사비 구성: 직접공사비, 제경비, 관급자재비 등 공사비 주요 항목별 금액 및 비중단위면적당 공사비: 프로젝트별 비용 효율성 확인 가능공종별 비교: 건축, 기계, 토목, 조경, 전기 등 각 공종마다 비용 분포가 어떻게 다른지 제공사업 유형 특성: 생활 SOC, 공공문화시설, 근린생활시설 등 용도에 따라 공사비 구조 차이 파악이 자료를 통해 사업별 공사비 구조의 특징, 비용 효율성, 공종 간 비용 편차, 공통비율의 수준 등을 한눈에 비교할 수 있어,공공건축물의 예산 분석·사업계획 수립·원가 검토 등에 활용할 수 있습니다.'
