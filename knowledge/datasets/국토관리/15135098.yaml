summary_user: 2025년 1월 1일 기준 양평군 개별공시지가 결정공시 결과를 읍면별로 집계한 파일로, 총필지수·표준지수·개별지수와 사유지·국공유지 필지 현황, 비율, 가중 지가합(백만원)을 담는다(포털 설명상 표준지 3,920필지 포함 총 339,555필지). 지역 분석가나 주민이 '양평군 읍면 가운데 공시 필지가 가장 많거나 국공유지 비중이 높은 곳은 어디인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역코드·지역명(읍면 이름) 매핑으로만 이어 쓴다.
limits: 읍면 단위 집계여서 필지별 공시지가나 개별 토지 조회에는 쓸 수 없다. 전역 조인 키가 없으므로 다른 시군구·전국 데이터와 연결할 때는 이름이나 코드를 직접 맞춰야 한다.
