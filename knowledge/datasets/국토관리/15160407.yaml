description_portal: '상업용 현수막 게시대는 지방자치단체가 지정한 장소에 사업자나 개인이 광고·홍보용 현수막을 일정 기간 유료로 게시할 수 있도록 설치한 공식 게시대를 말합니다. 신청: 위탁 운영기관 홈페이지에서 신청(대전광역시옥외광고협회 042-254-2393)배정: 선착순 사용료 납부규격에 맞는 현수막 제작지정된 기간 동안 게시(7일~15일)'
