legal_basis_portal: "상업용 현수막 게시대는 주로 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」(약칭: 옥외광고물법)과 그 시행령, 그리고 각 지방자치단체의 조례에 따라 운영됩니다.「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」제3조: 광고물 등의 허가 또는 신고옥외광고물을 표시하거나 설치하려면 원칙적으로 허가 또는 신고를 해야 합니다.제5조: 표시방법광고물의 종류, 크기, 설치방법 등은 대통령령으로 정하도록 규정하고 있습니다.「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률 시행령」제3조 제7호'현수막'을 옥외광고물의 한 종류로 규정하고 있습니다.제26조현수막을 게시할 수 있는 지정게시대 등 공공시설물 이용 광고물의 설치기준을 규정하고 있습니다.각 지방자치단체의 옥외광고물 조례상업용 현수막 게시대의신청 방법게시 기간사용료게시 순서(선착순·추첨)현수막 규격등을 구체적으로 정하고 있습니다. 따라서 지역마다 운영 기준이 일부 다를 수 있습니다.도로법(도로변 게시대인 경우)게시대가 도로를 점용하는 시설인 경우에는 도로점용허가 및 도로점용료가 별도로 적용될 수 있습니다.법제처는 지정게시대에 현수막을 게시하는 경우에도 옥외광고물법상의 수수료와는 별도로 도로법에 따른 점용허가 및 점용료가 적용될 수 있다고 해석하고 있습니다.상업용 현수막 게시대를 운영하거나 관리하는 경우 가장 중요한 법적 근거는 다음 세 가지입니다.「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」같은 법 시행령해당 지방자치단체의 옥외광고물 관리 조례"
