summary_user: 서울특별시 건축 인허가 과정에서 만든 호별 전유·공용 면적표를 담은 데이터로, 대지위치·지번과 층·호 단위로 전유/공용 구분, 주·부속 구분, 구조, 주용도, 면적이 행마다 기록된다. 집합건물 거래나 권리관계를 확인하려는 사람·분석가가 '이 건물의 특정 호는 전유면적과 공용면적이 각각 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 시군구명·법정동명·본번·부번 같은 이름과 지번 값을 맞춰 건축물대장이나 다른 인허가 데이터와 이어 붙여야 한다.
description_portal: 이 데이터는 서울특별시 건축 인허가 과정에서 생성되는 ‘호별 전유·공용 면적표’ 정보를 제공한다. 각 항목에는 건축물의 소재지 주소, 행정구역명, 지번, 도로명 주소, 지상·지하 구분, 건물 관리번호, 동명칭, 호수, 층수 등과 함께 각 호별 전유면적과 공용면적이 기록되어 있다. 이를 통해 건물 내 개별 세대 또는 구획의 면적 구성과 공용부분의 면적 배분을 확인할 수 있다. 해당 데이터는 건축물 관리, 부동산 거래, 재산세 부과, 도시계획 수립 등 다양한 행정·상업적 목적에 활용 가능하며, 특히 집합건물의 세부 면적 분석과 권리관계 확인에 중요한 기초자료로 쓰인다.
