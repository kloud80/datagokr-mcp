summary_user: 전북개발공사가 관리하는 임대아파트·임대단지별로 현재 공가 수, 대기자 수, 최근 3년간 청약 후 실제 입주까지 걸린 평균 대기일수(waitaverage)를 담는 단지 단위 조회 API다. 전북 지역 임대주택 청약을 고민하는 시민이 '이 단지에 신청하면 입주까지 얼마나 기다려야 하나'를 확인하거나, 주거정책 분석가가 단지별 수요 대비 공가 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 단지명(rentname) 이름 매핑이나 같은 기관 데이터로만 이어 쓴다.
description_portal: 전북개발공사의 응용데이터(단지별 입주대기일수 조회 서비스)는 전북개발공사가 관리하는 임대아파트 및 임대단지를 대상으로 현재 시점의 공가 수, 대기자 수, 최근 3년간 청약 후 실제 입주까지 소요된 평균 대기일수를 제공하는 서비스입니다.이를 통해 단지별 수요 현황과 공급 여건을 종합적으로 파악할 수 있으며 주거 수급의 불균형 해소, 공가 최소화 전략 수립 등 다양한 공공 주거정책·연구 분야에 활용될 수 있습니다. 또한 실시간 기반으로 임대단지별 데이터를 제공하여 청약 신청자 및 일반 시민에게 임대주택 수급 상황을 이해하는 데 유용한 정보를 제공합니다.
