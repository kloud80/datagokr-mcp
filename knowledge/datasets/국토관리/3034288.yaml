summary_user: 남양주시 관내 공공하수처리시설을 처리장 한 곳당 한 행으로 담은 작은 파일(약 1.7KB)로, 처리장명·주소·처리구역·일 처리용량(세제곱미터/일)과 데이터 기준일자를 담는다. 남양주 주민이나 분석가가 '우리 동네 하수는 어느 처리장에서 처리하고 그 시설의 하루 처리용량은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 하수도·방류수 수질 데이터와는 처리장명이나 주소를 이름 매칭해 잇거나 같은 기관(남양주시) 자료끼리 묶어 쓴다.
description_portal: 이 데이터는 남양주시 관내에 위치한 공공하수처리시설에 관한 정보를 제공합니다. 처리장명, 주소, 처리구역, 처리용량 등 주요 항목이 포함되어 있습니다. 우리 시에는 진건 공공하수처리시설을 포함해 총 17개의 하수처리시설이 운영 중이며, 이 시설들에서 법적 기준을 충족한 처리수는 한강으로 방류됩니다. 또한, 처리된 하수처리수 일부는 조경용수나 세척수 등 다양한 용도로 재이용되어 자원 절약에도 기여하고 있습니다. 방류수 수질검사 결과는 남양주시 홈페이지에서 누구나 쉽게 확인할 수 있습니다.
