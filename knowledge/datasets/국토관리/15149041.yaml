description_portal: '이 데이터는 지역 내 다가구주택의 위치 및 건축 현황을 정리한 자료입니다. 각 주택의 신주소, 구주소, 건물 유형, 준공일자, 인허가일자 등을 포함하고 있어 도시계획, 주거통계, 재난대응, 빈집 관리 등 다양한 공공 목적에 활용될 수 있습니다. 특히 신주소와 구주소가 함께 제공되어 주소 체계 이행상황을 확인하거나 위치정보 보정 시 유용하며, 준공일자와 인허가일자를 통해 건축 연한을 분석하거나 관련 사업의 이력 관리도 가능합니다. 데이터는 총 6개 컬럼으로 구성되어 있으며, 기준일은 별도 명시되어 있지 않지만 파일명 기준 2025년 9월 10일 자료입니다.연번: 데이터에 기록된 주택의 일련번호입니다.신주소: 도로명주소 체계에 따른 건물 주소입니다.구주소: 지번 기반의 기존 주소입니다.건물유형: 해당 건물의 유형으로, 일반적으로 다가구주택으로 표기됩니다.준공년월: 해당 건물이 실제로 준공된 연월 정보입니다.인허가년월: 행정적으로 건축 허가가 이루어진 연월 정보입니다.'
