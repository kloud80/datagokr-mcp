description_portal: '인천광역시 종합건설본부 토지구획정리사업 추진현황1. 목록명 : 인천광역시 토지구획정리사업 진행현황2. 키워드 :  지역개발, 기반시설, 지구단위계획3. 데이터설명 토지구획정리사업은 토지의 합리적이용 증진과 지역생활환경의 향상을 도모하기 위하여 도로, 공원, 상하수도, 학교, 광장 등의 시설을 설치, 변경하거나 토지의 교환, 분합, 구획정리, 지목 또는 형질변경 등을       행하는 것으로서 사업시행 전에 존재해온 권리관계에 변동을 가하지 아니하고 각 토지의 위치, 지적, 토질, 이용 상황 및 환경 등을 고려하여 사업시행후의 대지에 이전시키는 행위, 즉 환지를 수반하는 사업입니다.이 파일은 인천광역시 종합건설본부 토지구획정리사업 추진현황에 대한 데이터로 사업 공정률, 사업개요에 대한 항목을 제공합니다.데이터는 연간 업데이트되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, CSV 형식으로 제공됩니다'
