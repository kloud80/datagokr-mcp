summary_user: 경기도 동두천시에 있는 공동주택(아파트)을 단지 한 곳당 한 행으로 정리한 목록으로, 아파트명·도로명주소·연면적·세대수·위경도와 관리사무소·관리기관 연락처를 담은 작은 CSV 파일(약 7KB)이다. 동두천시에서 집을 구하는 시민이나 관리업체·분석가가 단지별 세대수와 규모, 관리사무소 연락처를 찾거나 시내 공동주택 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키(단지코드 등)는 없어서 다른 데이터와는 아파트명·도로명주소를 맞추거나 위경도로 공간 결합해 이어 쓴다.
