summary_user: DMZ와 그 주변 접경지역 관광지를 한 곳당 한 행으로 담은 파일로, 관광지 이름·주소·전화번호·위도·경도·이미지 주소·비고가 들어 있다(포털 설명 기준 614건). 관광객이나 지역 계획 담당자가 '연천·파주·철원 일대 DMZ 근처에서 가 볼 만한 관광지가 어디에 있고 연락처는 무엇인가'를 확인하고 지도에 표시할 때 쓴다. 법정동코드(bjd_cd)로 행정구역별 통계·인구 데이터와 잇고, 위도·경도로 다른 위치 데이터와 공간 결합한다.
description_portal: '통일부에서 제공하는 ‘통일부_DMZ 인근 지역 관광 정보 데이터’는 비무장지대(DMZ) 및 그 주변 접경지역의 주요 관광지 현황과 관련된 정보를 정리한 공공데이터입니다. 본 데이터는 DMZ 인근 지역의 관광 활성화와 방문객의 편의 증진을 목적으로 제작되었으며, DMZ가 지닌 평화·생태·역사적 가치와 연계된 관광자원을 쉽게 확인할 수 있도록 지원합니다.데이터는 총 614건으로, 각 관광지별 이름, 주소, 전화번호, 위도, 경도, 비고 항목으로 구성되어 있습니다.- 이름: 관광지의 공식 명칭을 표기하여, 사용자가 원하는 관광지를 쉽게 식별할 수 있도록 합니다.- 주소: 관광지의 실제 위치 정보를 상세히 제공하여, 내비게이션이나 지도 서비스와 연계할 수 있도록 합니다.- 전화번호: 관광지에 대한 문의 및 예약을 위한 연락처를 제공합니다.- 위도/경도: 관광지의 정확한 위치를 지도 기반 서비스(예: 네이버 지도, 카카오맵 등)와 연계하여 확인할 수 있도록 위도와 경도 정보를 함께 제공합니다.- 비고 : 별도 전화번호 등 추가 정보를 제공합니다.단, 전화번호 컬럼의 경우, 데이터 미집계, 개인정보 보호 등의 사유로 일부 정보가 누락될 수 있습니다.본 데이터는 관광객, 연구자, 지역 주민 등 다양한 사용자가 DMZ 인근 지역의 관광지 현황을 한눈에 파악하고, 체계적으로 방문 계획을 수립할 수 있도록 돕는 실질적인 정보 제공 역할을 수행합니다. 특히, DMZ 평화관광, 생태관광, 역사관광 등 다양한 테마와 연계된 관광지 정보가 포함되어 있어, 남북 접경지역의 평화와 화합, 그리고 지역경제 활성화에도 기여할 수 있습니다.'
