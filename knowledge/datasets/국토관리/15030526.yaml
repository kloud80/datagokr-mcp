summary_user: 충청남도 보령시 관내 산업단지에 입주한 기업을 업체 한 곳당 한 행으로 담은 명단 파일(CSV, 약 42KB)로, 단지명·업체명·주소·업종명·주생산품·전화번호·최초승인일이 들어 있다. 구직자나 영업 담당자가 "보령의 어느 산업단지에 어떤 업종·생산품의 업체가 입주해 있고 연락처는 무엇인가"를 확인하거나, 지자체·지원기관이 단지별 업종 분포를 파악하는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 공장 등록 등 다른 데이터와는 업체명·주소 문자열 매칭이나 단지명 기준으로만 이어 붙인다.
limits: 사업자번호 등 공통 키가 없어 공장 등록·산단 통계와의 연결은 이름·주소 매칭에 의존하므로 동명·표기 차이에 주의해야 한다. 범위는 보령시 한 곳에 한정되며, 용지 분양·임대·미분양이나 고용 규모 정보는 이 파일에 들어 있지 않다.
