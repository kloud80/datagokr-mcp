summary_user: 서울 강남구에서 사용승인을 받은 건축물을 건별로 담은 파일로, 건축구분·대지위치·대지·건축·연면적, 건폐율·용적률, 구조, 층수·높이, 주용도, 용도지역, 세대·호·가구수와 허가일·착공처리일·사용승인일을 함께 기록한다. 분석가나 부동산·개발 사업자가 '최근 강남구에서 준공된 공동주택은 어디에 몇 세대이고, 허가에서 사용승인까지 얼마나 걸렸나' 같은 지역 개발 흐름 질문에 쓴다. 건축물대장 번호 같은 전역 조인 키가 없어, 다른 데이터와는 대지위치(주소) 문자열 매칭이나 같은 기관의 허가·착공 현황 자료와의 대조로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 강남구에서 건축물에 대한 사용승인 현황을 정리한 자료입니다. 구체적으로 설명하자면, 이 데이터는 건축물의 특성을 구분할 수 있도록 건축구분이라는 항목을 포함하고 있으며, 건물이 위치한 구체적인 장소를 확인할 수 있도록 대지위치 정보가 들어 있습니다. 또한, 건물의 전체적인 규모를 파악할 수 있도록 연면적(건물의 모든 층의 바닥 면적을 합한 값)과 건축면적(대지에 접한 바닥 면적)이 포함되어 있습니다. 이 외에도, 건축 행정 절차의 진행 상황을 알 수 있도록 해당 건축물에 대한 허가가 난 날짜, 실제로 공사가 착공된 일자, 그리고 최종적으로 사용승인이 이루어진 날짜가 기록되어 있습니다. 아울러, 건축물의 주된 목적이나 용도를 나타내는 주용도 항목과, 해당 건물에 몇 개의 세대가 포함되어 있는지를 나타내는 세대수 등의 정보도 함께 포함되어 있습니다.
