description_portal: 상기 데이터는 AI 친화 고가치 데이터로 주택 자체의 속성이 아닌 패널조사 응답가구를 중심으로 주변 주요시설의 최단거리값을 GIS분석을 통해 산출한 내용입니다.데이터 축적은 Arc GIS pro 내 네트워크분석(최단거리 산출) 사용하였으며  네트워크 분석은 현실상의 실제 도로망(차도, 도보 등)을 기반으로 최단거리분석, 최소 이동시간 산출 등이 가능합니다.이 중 최단거리분석은, 임의의 지점에서부터 임의의 시설까지의 최단거리를 실제 보행로 기준으로 거리를 산출이 가능하며 각 속성정보는 이동거리를 표현합니다.각 세대 데이터는 동일 단지라고 하더라도 동단위로 접근성이 산출되었고, 각 가구별 주요시설(학교, 병원) 접근성을 정량화하여 거리값 제공을 통해 전처리 없이 AI에서 활용 가능합니다.생활환경을 다차원적 분석할 수 있는 기반데이터이며 정책적 활용 가능성 측면에서 지역 간 생활환경 격차 파악 및 사회적 약자의 주거·이동권 분석, 맞춤형 도시계획·복지정책 설계의 기반이 될 수 있습니다.각 세대에 대한 정보는 서울주택도시개발공사에서 제공하는 서울시 공공임대주택 입주자 패널조사 홈페이지에서 확인가능하며접근경로는 아래와 같습니다.http://shpanel.kr/board/list?bd_id=data
