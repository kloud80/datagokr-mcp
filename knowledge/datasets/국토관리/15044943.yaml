summary_user: 인천 미추홀구 안 다세대주택을 건물 한 동씩 담은 건별 목록으로, 법정동·지번·도로명주소, 주용도·대장 구분, 연면적, 세대수·가구수·호수, 사용승인일자를 담는다(CSV 약 43만 바이트). 구청·연구자가 '미추홀구 어느 동에 오래된 다세대주택이 몰려 있고 세대 규모는 어떤가'처럼 노후 주거지 파악이나 도시재생 대상지 검토를 할 때 쓴다. 전역 조인 키는 없어서 법정동명과 주지번·부지번, 도로명주소를 맞춰 건축물대장이나 주소 기반 자료와 연결해야 한다.
description_portal: 본 데이터는 다세대주택의 현황을 체계적으로 수록한 자료로, 행정기관의 주택 관리 및 도시계획 수립을 위한 기초자료로 제공됩니다. 주요 항목에는 법정동과 도로명주소, 건축물 용도, 구조 형식, 대지구분, 주지번과 부지번, 연면적, 세대수, 가구수, 사용승인일자 등이 포함되어 있습니다. 이를 통해 다세대주택의 입지 특성과 건축 현황을 파악할 수 있으며, 주거환경 분석 및 정책적 활용에 중요한 참고자료로 활용됩니다. 특히 건축물의 용도와 규모를 기반으로 지역 내 인구밀도, 생활 기반시설 수요, 도시재생 사업 대상지 선정 등 다양한 행정 수요에 대응할 수 있습니다. 또한 해당 데이터는 주택 안전관리, 주거복지 서비스 제공, 불법 건축물 관리 등에도 활용되며, 정기적으로 갱신되어 최신 정보를 반영합니다. 이를 통해 주거환경의 변화와 주택정책 수립을 지원하고, 주민 생활의 안정성과 편의를 높이는 데 기여합니다.
