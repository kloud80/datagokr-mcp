summary_user: '경기도가 제공하는 한강권역 주요 하천의 관측소별 수위(m)·유량(㎥/s) 관측 기록으로, 관측 일시·관측소명·주소·관할기관을 함께 담으며 한강홍수통제소 원격관측(T/M) 원시자료를 기반으로 한다. 하천 관리 담당자나 분석가가 특정 하천 관측소의 수위·유량이 호우 때 어떻게 변했는지 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 수문 자료(예: WAMIS 관측소 기준 시계열)와는 관측소명·주소 같은 이름 매핑으로만 이어 쓴다.'
description_portal: 이 데이터는 한강권역 내 주요 하천의 수위를 실시간으로 관측하여 기록한 환경 모니터링 자료입니다. 관측소별로 수위관측일자, 관측소명, 주소, 관할기관, 수위자료값(m), 유량자료값(㎥/s) 등의 항목이 포함되어 있으며, 한강홍수통제소의 원격관측 시스템(T/M)을 통해 수집된 원시자료를 기반으로 합니다. 이 데이터는 하천 수위 및 유량 변화를 추적할 수 있어 홍수 예방, 하천 관리, 수자원 정책 수립 등에 활용될 수 있으며, 관측기기 오류나 기상 요인 등에 따른 오차가 존재할 수 있으므로 분석 시 주의가 필요합니다.
