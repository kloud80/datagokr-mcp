summary_user: 충청남도개발공사가 추진 중인 내포신도시 개발사업의 지적도를 모은 한글 문서(hwpx, 약 3.2MB) 파일로, 필지 단위의 도면 자료를 담는다. 내포신도시에 땅이나 건물을 알아보는 도민·사업자가 '이 필지가 신도시 개발계획에서 어떤 위치와 경계에 있는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지번·지명 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
