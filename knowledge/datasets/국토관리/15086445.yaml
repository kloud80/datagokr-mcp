summary_user: 안양시 공동주택 단지 안에 설치된 어린이놀이시설을 시설 한 곳당 한 행으로 담은 파일로, 시설번호·시설명·주소·설치장소·설치일자를 담는다(csv 약 79KB, 시군구 범위). 안양시 주민이나 분석가가 '우리 아파트 단지 놀이터는 언제 설치됐고 단지 안 어디에 있나', '설치된 지 오래된 단지 놀이시설이 어느 동네에 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 K-apt 단지코드 같은 단지 마스터와는 시설명·주소 문자열을 맞춰서만 이을 수 있다.
description_portal: '안양시 공동주택 단지 내 어린이놀이시설 현황입니다. 시설번호, 놀이시설명, 주소, 설치장소, 설치일자 등의 데이터를 제공 합니다.안양시 공동주택 단지 내 어린이놀이시설과 관련된 주요 키워드는 다음과 같습니다．- 공동주택 단지: 아파트, 연립주택 등 다세대 주거지역 내 설치된 놀이시설- 어린이 안전: 놀이기구의 안전검사, 보험가입, 정기 점검 등 안전관리 요소- 설치장소 및 주소: 단지 내 위치 정보와 도로명 주소- 설치일자 및 시설번호: 시설의 고유 식별 정보와 설치 시기- 놀이시설 유형: 실내/실외 구분, 미끄럼틀, 그네, 정글짐 등 놀이기구 종류- 관리주체: 민간(입주자대표회의, 관리사무소) 또는 공공(지자체)- 공공데이터 활용: 공공데이터포털에서 CSV 파일로 제공됨- 스마트도시정보과: 안양시 내 관련 부서로, 데이터 관리 및 제공 담당이 데이터는 연 1회 갱신됩니다．'
