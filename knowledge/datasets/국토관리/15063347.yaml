summary_user: 인천광역시 서구(서해구) 안에서 진행 중인 주택재건축 구역별 현황을 구역 한 건당 한 행으로 담은 소규모 파일(csv 571바이트)로, 위치·면적·용도지역·건폐율·용적률·층수·높이·계획세대수·시공사를 포함한다. 서구 주민이나 부동산 분석가가 "우리 동네 재건축 구역은 몇 층, 몇 세대로 계획됐고 시공사는 어디인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 정비사업·주택 데이터와는 구역명이나 위치(주소) 문자열을 맞추는 방식으로만 이어 쓴다.
limits: 범위가 서구 한 개 시군구에 한정되며, 좌표가 없는 비공간 자료다. 추진위·조합·사업시행·관리처분 같은 사업 단계 정보는 필드에 없어 진행 상황 판단에는 별도 자료가 필요하고, 갱신은 명세상 연 1회라 데이터기준일자를 함께 확인해야 한다.
