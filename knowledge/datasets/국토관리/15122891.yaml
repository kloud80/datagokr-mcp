summary_user: 지적재조사 사업지구 안 토지를 대상으로 한 토지현황조사 자료를 필지·건물 단위로 담은 파일로, 사업지구명·기준년도와 함께 필지별 공시지가와 전년 대비 변동률, 용도지역지구, 대지·건물면적, 기준점 정보가 들어 있으며 범위는 전국이다. 지적재조사 사업지구 안 필지의 공시지가와 용도지역, 건축물 현황이 어떠한지 확인하려는 지자체 담당자나 토지 분석가가 쓴다. 필지고유번호(pnu)를 키로 토지대장·연속지적도·개별공시지가·토지이용계획 등 다른 필지 단위 데이터와 이어 쓴다.
description_portal: '지적재조사 사업지구 실시계획을 수립한 때에는 예정지구임이 지적공부에 등록된 토지를 대상으로 토지현황조사를 합니다.(토지현황 사전조사 항목)토지현황조사에 관한 사항 : 지적공부 및 토지등기부건축물에관한사항 : 건축물대장 및 건물등기부토지이용계관한사항 : 토지이용계획확인서토지이용현황 및 건축물 현황 : 개별공시지가 토지특성조사표, 국공유지 실태조사표, 건축물대장 현황 및 배치도지하시설(구조)물 등 현황 : 도시철도 및 지하상가 등 지하시설물을 관리하는 관리기관, 관리부서의 자료와 구분지상권 등기사항해당 정보는 유관기관과의 연계기능을 통해 구축됩니다.'
