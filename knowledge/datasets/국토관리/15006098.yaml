summary_user: 서울특별시 중랑구 관내 30세대 이상 공동주택을 단지 한 곳당 한 행으로 담은 파일로, 단지명·주소(번지·도로명)·동수·최고층수·세대수·승강기·난방방식·준공일·관리사무소 전화번호를 담는다. 중랑구에서 이사할 곳을 찾는 주민이나 지역 주택 재고를 보는 분석가가 '어느 동에 준공 몇 년 된 몇 세대 규모 단지가 있고 난방은 어떤 방식인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 단지명이나 도로명주소를 이름·주소 매칭으로 이어 써야 하며, 실거래가·공시가격 등 단지 단위 데이터와 붙일 때도 같은 방식으로 연결한다.
description_portal: '중랑구 관내  공동주택 현황을 제공합니다. 제공하는 주요항목으로는 단지명, 동명, 주소, 동수, 최고층수, 세대수, 승강기, 난방방식, 준공일, 전화번호가 있습니다. 자세한 정보는 파일을 다운로드받아 확인하여 주시기 바랍니다. 감사합니다. 데이터 기준은 다음과 같습니다.  가. 데이터 대상    - 30세대 이상 공동주택    - 30세대 미만(건축과 소관) : 해당 정보를 건축데이터 개방사이트에서 확인 할 수 있음  나. 데이터 내용    - 단지명, 주소, 준공일, 세대수, 전화번호 등  다. 문의전화 : 2094-2110 으로 전화주시기 바랍니다.'
