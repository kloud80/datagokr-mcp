summary_user: 스마트공장 보급에 필요한 기술·역량을 가진 공급기업을 기업 1곳당 한 행으로 담은 전국 명부 파일로, 기업명·대표자명·주소와 스마트공장 전문분야·전문업종, 공급기업 전문업종을 담는다. 스마트공장 구축을 검토하는 중소 제조기업이 'MES나 설비 자동화를 맡길 수 있는 공급기업이 우리 지역에 어디 있나'를 찾을 때, 분석가가 지역별·분야별 공급기업 분포를 볼 때 쓴다. 사업자번호나 행정코드 같은 공통 조인 키가 없어 다른 기업·공장등록 데이터와는 기업명이나 주소를 맞춰 붙여야 한다.
description_portal: 스마트공장은 제조 전과정을 ICT로 통합하여 고객맞춤형 스마트제품을 생산하는 지능형 공장으로 스마트공장은 하드웨어(센서, 액츄에이터 등), 네트워크, 소프트웨어(MES 등) 등으로 구성되어 있다.(공장자동화) 설비들이 개별적으로 자동화된 것(스마트공장) 자동화된 설비들이 서로 연결되고, 모든 것이 데이터 되어 데이터 기반으로 공장이 가동되는 것스마트공장의 보급을 위한 기술 및 역량을 보유한 기업의 업체명, 주소, 대표자, 전문분야 등 공급기업 세부 정보 등의 데이터 항목을 제공합니다.
