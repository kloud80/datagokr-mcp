summary_user: 지정·고시된 사업지구(혁신도시, 택지개발예정지구, 도청이전신도시 개발예정지구 등)의 경계를 공간정보로 제공하는 OGC 표준 API이며 범위는 전국이다. 지구 경계를 지도에 겹쳐 보거나 특정 위치가 어느 개발예정지구에 속하는지 확인하려는 분석가·사업자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 이름·코드 매핑이나 같은 기관 코드로만 다른 데이터와 연결하며, 필드는 지구명(zonename)만 확인된다.
description_portal: 사업을 시행하기 위해 지정·고시된 지구를 말하며 혁신도시개발예정지구, 택지개발예정지구, 도청이전신도시 개발예정지구 등이 있음OGC(Open Geospatial Consortium) 표준 API는 공간 데이터의 공유와 상호운용성을 위해 개발된 국제 표준으로, 웹 기반에서 지도, 피처, 래스터 등 다양한 지리정보를 효율적으로 제공·활용할 수 있게 합니다. 최신 OGC API는 RESTful 구조를 채택해 개발 편의성과 확장성을 높였으며, WMS, WFS 등 기존 표준을 현대적으로 계승합니다
