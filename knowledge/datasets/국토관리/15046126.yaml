summary_user: 창원시 개별단독주택의 공시가격을 필지·건물 단위 건별로 담은 표준데이터 파일(CSV, 약 12MB)로, 기준년도·기준월별 주택가격과 토지대장면적·산정대지면적·건물 연면적, 표준주택 여부를 함께 담는다. 창원시 단독주택 소유자나 매수 예정자가 특정 지번 주택의 공시가격이 얼마인지 확인할 때 쓰고, 분석가가 보유세·건강보험료·복지 기준 추정이나 동별 가격 분포를 비교할 때 쓴다. 법정동코드(bjd_cd)로 다른 지역 데이터·행정구역 자료와 잇고, 고유번호(필지)와 건축물대장고유번호로 토지·건축물대장 자료와 맞대어 쓴다.
limits: 창원시(시군구) 범위만 담아 다른 지역 비교에는 해당 지자체 파일이 따로 필요하다. 공시가격이라 실거래가나 시세 동향을 나타내지 않으며, 공동주택(아파트 등) 가격은 이 데이터에 없다.
