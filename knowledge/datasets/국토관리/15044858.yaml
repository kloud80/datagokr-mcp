summary_user: 광산구에 있는 재난대응용 배수펌프장을 한 곳씩 행으로 담은 시설 현황 파일로, 펌프장명·주소·설치연도·설치목적과 모터펌프 규모·비상발전기·한전 계약전력, 연간·월별 전기요금과 사용전력량, 위도·경도를 담는다. 구청 재난·시설 담당자나 분석가가 "광산구 배수펌프장들은 어디에 있고, 어느 곳이 오래됐거나 전기요금·전력 사용이 큰가"를 보고 유지보수 우선순위나 예산을 따질 때 쓴다. 전역 조인 키는 없어 다른 하천·침수 데이터와는 펌프장명·주소로 맞추거나 위도·경도로 공간 중첩해 이어 쓴다.
description_portal: 광주광역시 광산구에 위치한 재난대응용 배수펌프장 시설 현황에 대한 상세한 정보를 제공합니다. 이 데이터에는 각 펌프장의 명칭, 소재지 주소, 설치 연도, 설치 목적뿐만 아니라 운영에 필요한 전기요금과 실제 사용 전력량, 그리고 정확한 위치를 확인할 수 있는 위도와 경도 등이 포함되어 있습니다. 광산구 내 재난 상황 발생 시 신속한 배수 기능을 수행하는 펌프장들의 분포와 운영 현황을 체계적으로 파악할 수 있으며, 유지보수 계획 수립 및 예산 편성에 중요한 기초 자료로 활용될 수 있습니다. 또한 지역 주민 안전 강화와 재난 대비 체계 구축을 위한 핵심 자료로서, 행정 기관이나 관련 부서에서 재난관리 및 인프라 관리에 적극 활용할 수 있을 것입니다.
