description_portal: 대구광역시 상수도사업본부에서 2020년 1월부터 2023년 12월까지 고지한 체납건수를 각 사업소별, 납기년월별, 체납기간(년도)에 따라 집계한 자료입니다. 대구광역시 상수도요금 체납에 대한 관리 및 조치 절차는 「대구광역시 상수도요금 등 부과ㆍ징수사무 처리 규정」에 따라 체계적으로 이루어지고 있습니다. 체납은 납부기한까지 수도요금을 내지 않았을 때 발생합니다. 수도요금은 매월 혹은 격월로 청구되며, 기한 내 미납 시 체납요금으로 전환됩니다. 체납시 정수처분등의 행정조치가 이루어질수 있으며 체납납부방법은 위택스 등을 통하여 온라인 또는 은행창구를 통한 오프라인으로 납부가 가능합니다. 체납관련 문의는 지역사업소로 할수 있습니다. 주소지에 따라 중남부사업소, 동부사업소, 서부사업소, 북부사업소, 수성사업소, 달서사업소, 달성사업소, 군위사업소로 문의를 하시면 됩니다.
