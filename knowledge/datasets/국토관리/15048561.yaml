summary_user: 대구광역시 북구 관내 의무관리대상 공동주택(300세대 이상, 승강기·중앙난방을 갖춘 150세대 이상 등)을 단지 하나당 한 행으로 담은 현황 파일로, 아파트명·도로명주소·행정동·준공년도·동수·세대수·관리사무소 연락처를 담는다. 북구에 사는 주민이나 관리업체·분석가가 '우리 동네에 준공 20년이 넘은 대단지 아파트가 어디 있고 관리사무소 연락처는 무엇인가'를 확인할 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 도로명주소나 행정동·단지명을 이름 매칭해 붙여 쓴다.
description_portal: '*관내 공동의무단지 공동주택현황(가.300세대 이상 공동주택/나.150세대 이상으로서 승강기가 설치된 공동주택,/다.150세대 이상으로서 중앙집중식 난방방식(지역난방방식을 포함한다.)의 공동주택/라.건축법 제11조에 따른 건축허가를 받아 주택 외의 시설과 주택을 동일 건축물로 건축한 건축물로서 주택이 150세대 이상인 건축물) *정보 1.아파트명(대구광역시 북구 공동주택 이름)2. 도로명(대구광역시 북구 공동주택에 도로명을 기준으로 하여 건물에 고유번호를 붙인 주소)3. 행정동(대구광역시 북구 공동주택이 위치하고 있는 행정구역의 단위)4. 준공년도(대구광역시 북구 공동주택의 건설이 완료되어 실제 사용 가능한 허가 완료된 연도)5.동수(대구광역시 북구의 공동주택을 세거나 차례를 나타내는 단위수)6.세대수(공동주택내 현실적으로 주거 및 생계를 같이하는 사람의 집단을 세어 나타낸 값)7.관리사무소(공동주택 을 관리하는 일을 맡아보는 곳의 연락처)8.주관부서(공동주택 업무를 책임지고 맡아 관리하는 부서)6. 세대수 7.관리사무소 8.전화번호 등)를 제공합니다.'
