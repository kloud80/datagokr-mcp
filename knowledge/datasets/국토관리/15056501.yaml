summary_user: 경기도 내 신규 민간아파트의 분양가격(천원/㎡)을 집계년도·집계월별, 전용면적 규모구분(60㎡ 이하, 60㎡ 초과~85㎡ 이하 등)별로 모은 집계 통계이며, 건별 단지 자료가 아니다. 실수요자나 부동산 분석가가 '경기도에서 전용 85㎡ 이하 신규 아파트의 ㎡당 분양가가 최근 몇 년간 어떻게 변했나'처럼 면적별 분양가 흐름과 평당가를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도명(SIDO_NM)과 연·월을 기준으로 다른 분양가·미분양·주택가격 통계와 이름 매칭으로만 이어 쓴다.
description_portal: '경기도내 분양승인된 주택중 미분양이 발생한 단지, 주택 보급률, 신규아파트 분양가격 등의 현황 정보를 제공합니다.이 데이터는 경기도 내 신규 민간아파트의 분양가격을 면적구간별로 월 단위로 집계한 통계 자료입니다. 항목에는 집계년도, 집계월, 규모구분명(예: 전용면적 60㎡ 이하, 60㎡초과~85㎡이하 등), 분양가격(천원/㎡)이 포함되어 있으며, 평당가 산정 시 기초자료로 활용될 수 있습니다. 본 데이터는 주택 수요·공급 및 가격 흐름을 분석하거나, 면적별 아파트 가격 차이를 비교하는 데 유용합니다. 또한 지역별 주택시장 동향을 파악하고, 주택정책 수립, 부동산 투자 분석, 실수요자 정보 제공 등 다양한 용도로 활용될 수 있습니다.'
