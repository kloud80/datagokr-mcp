summary_user: 서울시 양서파충류 보호종의 발견 기록을 지점별로 담은 공간정보로, 종명·과명·개체수·올챙이 수, 서울시 보호종과 멸종위기 등급 여부, 서식지 유형, 자치구·발견 장소·발견 연도·출처, X·Y 좌표(EPSG:5174)를 담는다. 생태 조사자나 개발사업 검토자가 "이 자치구나 사업 부지 주변에 멸종위기 양서파충류가 확인된 적이 있는가"를 확인할 때 쓴다. 전역 조인 키가 없어 자치구명(GUNAME)으로 이름을 맞춰 다른 서울시 자료와 잇거나, 좌표를 다른 공간 레이어와 겹쳐 쓴다.
description_portal: 서울시 양서파충류보호종분포 공간정보 입니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
