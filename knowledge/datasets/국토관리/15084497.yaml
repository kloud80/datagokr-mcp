summary_user: 부산 도시공간정보시스템에서 관리하는 도로·상하수도 시설물의 공사·관리 관련 업체 목록을 업체 1건당 1행으로 담은 파일(csv, 약 126KB)로, 업체관리번호·업체명·주소·상세주소·업종코드를 포함한다. 부산의 도로나 상하수도 시설 공사·관리에 어떤 업체가 등록돼 있는지, 특정 업종 업체가 어디에 있는지 확인하려는 분석가·사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 같은 기관(부산광역시) 시설물 데이터와의 업체관리번호 대조로만 이어 쓴다.
description_portal: 부산광역시 및 구.군에서 관리하는 도시기반시설인 도로, 상수도, 하수도 등의 시설물 정보를 GIS기반으로 데이터베이스화 하여 관리하는 도시공간정보시스템을 구축 운영하고 있습니다.본 자료는 부산 도시공간정보시스템에서 관리되고 있는 도로 및 상하수도 시설물 관련  업체 정보로 각 종 공사, 시설물 관리와 관련된 업체 정보로 관련 업체가  신설 또는 삭제 및 수정 시 업체의 상호, 주소, 업종 등의 정보를 현행화 하고 있고 이를 바탕으로 추출된 정보 입니다.(회사 일련번호, 회사 명, 주소, 상세 주소, 업종코드 등)
