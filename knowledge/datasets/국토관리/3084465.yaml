summary_user: "국제슬로시티연맹 인증을 받은 국내 슬로시티를 한 줄씩 나열하고, 시도·지역명과 함께 각 도시의 주요 자원(예: 한옥마을, 갯벌)과 대표 슬로푸드를 담은 829바이트 규모의 소형 CSV 목록이다. 여행객이 '느린 여행을 할 만한 인증 도시가 어디이고 무엇을 먹고 볼 수 있나'를 찾거나, 지자체 담당자가 지역 브랜딩 사례를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·지역명 이름을 행정구역 코드에 직접 매핑해야 이어 쓸 수 있다."
description_portal: "대한민국 내에 국제슬로시티연맹의 인증을 받은 '슬로시티'의 지정 현황을 정리한 데이터입니다. 이 자료는 전북특별자치도 전주를 포함한 전국 슬로시티 목록과 함께, 각 도시가 내세우는 핵심적인 지역 자원(예: 한옥마을, 갯벌)과 대표적인 슬로푸드(예: 비빔밥, 한정식) 정보를 담고 있습니다. 이 데이터는 바쁜 일상에서 벗어나 느긋하고 여유로운 여행을 추구하는 관광객들에게 훌륭한 길잡이가 됩니다. 또한, 지역 고유의 문화와 자연환경을 보존하며 지속가능한 발전을 추구하는 도시들의 현황을 보여줌으로써, 슬로라이프 가치 확산과 지역 브랜딩 전략 수립에 참고할 수 있는 유용한 자료입니다."
