summary_user: 경상북도 청도군 관내 재난대응용 배수펌프장을 한 곳씩 한 행으로 담은 시설 목록 파일(csv 287바이트로 몇 건 수준)로, 펌프장명·주소·설치년도·설치목적·모터펌프 규모·한전 전원공급방식과 계약전력·연간 사용전력량과 전기요금을 담는다. 청도군 주민이나 방재·시설 담당자가 '우리 동네 저지대 침수를 막는 배수펌프장이 어디에 있고, 언제 설치됐으며, 전원이 1회선인지 2회선인지'를 확인하거나 연간 전기요금으로 유지관리비를 가늠하는 데 쓴다. 전역 조인 키는 없어 주소를 좌표로 바꿔 하천·침수 관련 공간자료와 겹쳐 보거나, 펌프장명·같은 기관(청도군) 기준으로 다른 시군의 배수펌프장 현황과 이어 쓴다.
description_portal: '경상북도 청도군 관내 재난대응을 위한 배수펌프장에 대한 상세 현황 정보를 제공합니다.이 자료는 집중호우, 태풍, 하천 범람 등 자연재해로부터 지역 주민과 시설물을 보호하기 위해 청도군에 설치된 배수펌프장의 위치, 운영 현황, 전력 사용 정보 등을 종합적으로 파악할 수 있도록 구성된 데이터입니다.자료에는 펌프장명, 주소(도로명 또는 지번), 설치년도, 설치 목적(예: 내수 침수 방지, 저지대 배수 등), 모터펌프 규모(설비 용량), 한전 전원공급방식(단상·삼상 등), 한전 계약전력, 사용전력량, 전기요금, 그리고 데이터 기준일자가 포함되어 있습니다.이 정보는 청도군의 재해 예방 시설 운영 실태를 정량적으로 진단할 수 있을 뿐만 아니라, 설치 이후 시설의 노후화 여부, 에너지 효율, 유지관리 비용 추정 등 시설 개선 및 보강계획 수립에 필요한 기초 자료로도 활용됩니다.'
