description_portal: 대구광역시 상수도사업본부에서 2023년 1월부터 2023년 12월까지 납기월별, 이체구분별로 수납된 요금수입의 급수수익 처리 건수 및 금액 현황입니다. 금액과 건수는 상수도, 하수도, 물이용부담금이 모두 합산된 내역입니다. 대구광역시의 수도요금 처리 현황은 상수도사업본부를 중심으로 체계적으로 운영되며, 요금 부과, 정산, 납부 및 감면 등의 과정을 포함합니다. 아래에 각 항목별로 자세히 설명드리겠습니다. 대구시의 수도요금은 「대구광역시 수도급수 조례」 및 관련 규정에 따라 부과되며, 주요 구성은 기본요금(수도계량기의 구경(직경)에 따라 매월 정액으로 부과), 사용요금(실제 사용한 수돗물의 양(㎥)에 따라 업종별 요율로 부과), 기타 요금(하수도 요금, 물이용부담금 등)입니다.
