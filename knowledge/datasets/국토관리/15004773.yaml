summary_user: 서울특별시 동작구의 건축허가 건을 한 행씩 담은 원천 목록으로, 건축구분(신축·대수선 등)·대지위치·지목·대지면적·건축면적·연면적·구조·층수·높이·주용도·세대수와 허가일·착공일·사용승인일 같은 인허가 단계별 날짜를 필지·건물 단위로 담는다. 부동산·건설 분석가나 주민이 '동작구에서 최근 어느 동네에 어떤 용도의 신축이 허가·착공됐고 언제 사용승인이 났는가'처럼 지역 개발 흐름의 선행 지표를 확인하는 데 쓴다. 실측 컬럼에 법정동코드·건물관리번호 같은 전역 조인 키가 없어 다른 데이터와는 대지위치(주소) 문자열 매핑이나 같은 기관(동작구) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 동작구 건축허가 현황입니다. 이 데이터에는 건축구분, 대지위치, 연면적,건축면적, 허가일, 착공처리일, 사용승인일, 주용도, 세대수, 등이 포함되어 있습니다.데이터에는 건축 유형을 구분할 수 있는 건축구분(신축, 대수선 등) 항목이 포함되어 있습니다.대지면적 항목을 통해 건축물이 위치한 토지의 면적 정보를 확인할 수 있습니다.구조(철근콘크리트 등) 항목에는 건축물의 주요 구조 형식 정보가 포함됩니다.허가일 항목을 통해 건축허가가 승인된 시점을 확인할 수 있습니다.세대수 항목을 통해 세대 규모를 확인할 수 있습니다.
