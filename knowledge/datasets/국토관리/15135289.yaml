summary_user: 한국토지주택공사(LH)가 사업지구별로 공급하는 토지의 계획을 사업지구명·용지공급용도·세부 용도·필지수·공급년도 단위로 담은 전국 범위 CSV 파일입니다. 상업업무·공동주택·단독주택용지 등이 어느 지구에서 몇 필지, 언제 공급될 예정인지를 알아보려는 사업자·투자자·분석가가 지구별·용도별 토지 공급 물량을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업지구명 같은 이름 매칭이나 같은 기관(LH) 자료끼리로만 연결한다.
description_portal: 한국토지주택공사의 토지공급계획(사업지구명, 필지수, 용지공급용도명, 용도내용, 공급년도) 정보를 제공합니다. 토지공급계획 중 상업업무 용지가 3.7만건(32.7%), 기타시설 용지가 2.5만건(22.2%), 공동주택용지가 1.6만건(14%), 단독주택용지가 1.6만건(14%)으로 총합 82.9%를 차지합니다. 년도별로 2017년에 17.1만건(16.7%) 토지를 공급하였으며 2019년 15.9만건(15.4%) 공급하였습니다. 용도별로 중심상업, 일반상업, 블록형, 종교, 통신, 블록형 등 다양한 용도별 목적이 존재합니다.
