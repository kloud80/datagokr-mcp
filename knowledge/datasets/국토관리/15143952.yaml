summary_user: 한국산업기술시험원이 식물공장 컨테이너 2개 동에서 측정한 3상 전력 중 R상과 S상 사이 선간전압을 측정일시별로 기록한 건별 계측 데이터로, 포털 설명상 2024년 9월 23일부터 30일까지의 값을 약 61MB 크기의 CSV 파일 하나에 담는다. 스마트팜 운영자나 에너지 분석가가 '조명·LED·에어컨·양액기 같은 설비별 전압이 언제 흔들리고 어떤 부하 패턴을 보이는가'를 확인해 전력 품질 이상 탐지나 설비 고장 예측 모델을 만드는 데 쓴다. 전역 조인 키가 없어 다른 공공데이터와 직접 결합하지 못하며, 같은 기관이 낸 식물공장 3상 전력 데이터(다른 선간전압·전류 등)와 측정일시를 기준으로 맞춰 쓰는 정도로 연결한다.
description_portal: 한국산업기술시험원이 2024년 9월 23일부터 9월 30일까지 식물공장에서 수집한 3상 전력 데이터 중 RS 선간전압에 대한 정보입니다. RS 선간전압은 R상과 S상 간 전압 차이를 의미하며, 이 데이터는 식물공장 내 전기 설비의 운전 상태와 전력 부하 특성을 정밀하게 분석하고, 에너지 소비 효율성 진단 및 개선 방안을 도출하는 데 활용됩니다. 또한 전력 품질 이상 탐지, 전기 설비 고장 예측, 대기전력 절감 알고리즘 개발, 스마트 센서 기반 예지보전 시스템 구축, 스마트팜 설비의 지능형 에너지 제어 기술 개발 등 다양한 연구와 산업적 활용 가능성이 높습니다. 해당 데이터는 스마트팜 운영의 고도화와 에너지 절감형 농업 시스템 실현에 기여할 수 있는 핵심 자료로 활용될 수 있습니다.
