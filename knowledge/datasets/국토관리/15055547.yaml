summary_user: '전북특별자치도 시군별 향토산업 육성사업을 사업 한 건당 한 행으로 정리한 소규모 파일(csv 약 1.7KB)로, 시군명·향토자원(예: 완주 생강, 남원 오디뽕)·사업기간과 총사업비(백만원) 및 국비·도비·시군비·기타 재원 분담을 담는다. 지역 특산물 사업에 정부·지자체 재원이 어느 시군에 얼마나 투입됐는지 비교하려는 정책 분석가나 지역 연구자가 쓴다. 전역 조인 키나 행정코드는 없으므로, 다른 시군구 단위 데이터와는 시군명 이름 매핑으로만 이어 쓴다.'
description_portal: 전북특별자치도 내 각 시군의 고유한 향토자원을 활용하여 부가가치를 창출하는 '향토산업 육성사업'의 현황을 정리한 데이터입니다. 이 자료는 완주 생강, 남원 오디뽕, 장수 오미자 등 각 지역을 대표하는 특산물을 기반으로 추진된 사업들의 기간과 총사업비 규모를 상세히 보여줍니다. 특히, 국비, 도비, 시군비 등 재원 부담 내역을 포함하고 있어, 지역 특화 산업을 육성하기 위한 정부의 정책적, 재정적 지원 현황을 구체적으로 파악할 수 있습니다. 이는 지역 경제 활성화 및 농가 소득 증대를 위한 정책의 성과를 분석하는 데 중요한 기초 자료가 됩니다.
