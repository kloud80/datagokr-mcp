summary_user: 서울시설공단이 관리하는 시청광장·을지입구·을지로2~4구역 지하도상가의 실내 지도를 1미터 격자로 나누어, 격자별 도면 좌표(X축·Y축)와 위도·경도, 지역코드·지역명을 대응시킨 격자 단위 공간 메타정보 API입니다. 지하상가 안 길안내나 휠체어 경로 안내 서비스를 만드는 개발자가 "도면상 이 격자 위치가 실제 위경도로 어디인가"를 변환할 때 쓴다. 실측 컬럼에서 다른 데이터와 붙일 전역 조인 키는 찾지 못했으므로, 위경도 좌표로 공간 매칭하거나 지역명·상위지역코드(regiionCode)를 같은 기관의 다른 지하도상가 데이터와 이름·코드로 맞춰 연결한다.
description_portal: 본 데이터셋은 서울시설공단이 관리·운영하는 주요 지하도 상가 권역(시청광장, 을지입구, 을지로2구역, 을지로3구역, 을지로4구역)의 실내 공간 지도를 1미터(1M) 단위의 정밀한 격자로 분할하고, 각 격자마다 고유한 좌표값을 부여하여 구축한 격자 기반 공간 메타 정보입니다. 본 자료는 지하도 상가 도면 고유의 격자 좌표를 실제 지리 좌표계의 위도 및 경도 정보와 상호 대입하여 결합할 수 있도록 설계되었습니다. 이를 통해 복잡한 지하 상가 내부의 정밀한 위치 확인이 가능해지며, 시각화된 디지털 지도 정보로 즉시 변환하여 활용할 수 있습니다. 본 데이터는 대중교통 연계 지하 공간의 내비게이션 시스템 구축, 교통약자를 위한 휠체어 길 안내 서비스 개발, 지하 공간 내 시설물 및 점포의 효율적인 위치 관리 등 스마트 시티 공간정보 서비스 분야의 핵심적인 기초 자산으로 활용 가치가 매우 높습니다.
