summary_user: 순천시 하수처리시설을 순천·승주·송광·신평·낙안·황전·주암 7개 권역 열로 나누고, 행(구분)마다 시설용량·처리량 같은 항목을 적은 소형 집계표(CSV 142바이트)다. 순천시 각 권역 하수처리장의 하루 처리 용량이 얼마이고 실제 처리량과 비교해 여유가 있는지 확인하려는 시민·분석가가 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 권역(읍면) 이름을 맞추거나 같은 기관 자료끼리만 이을 수 있다.
description_portal: 전라남도 순천시의 상하수도시설 현황은 지역 내 수돗물 공급과 하수 처리 인프라의 규모와 운영 상태를 종합적으로 보여주는 자료로, 시민의 생활환경과 공공위생을 평가하는 데 중요한 지표로 활용됩니다. 순천시는 상수도 보급률이 높은 편이며, 도시와 농촌 지역을 포함해 광범위한 배수구역을 관리하고 있습니다. 하수도는 순천, 승주, 송광, 신평, 낙안, 황전, 주암 등 총 7개 권역으로 나뉘며, 각 권역별로 일일 하수 처리시설 용량과 실제 처리량이 기록되어 있습니다. 예를 들어, 순천 권역은 하루 65,000㎥의 시설용량을 갖추고 있으며, 실제 처리량도 유사한 수준입니다. 이러한 데이터는 CSV와 API(JSON, XML) 형식으로 제공되어 행정기관뿐 아니라 연구기관, 민간기업 등에서도 쉽게 활용 가능합니다. 또한 노후관 비율, 시설 가동률, 물 재이용률 등 추가 지표와 결합해 도시의 물순환 시스템 전반을 평가하는 데에도 쓰입니다.
