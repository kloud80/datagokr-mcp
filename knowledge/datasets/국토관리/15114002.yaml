description_portal: 빈집 실태조사 결과 1,2,3등급(1등급 > 2등급 > 3등급 ) 상태가 좋음)빈집 실태조사를 통해 파악한 서구 관내 동별 빈집 등급 및 현황(개수)본 데이터는 대구광역시 서구 관내 행정동별 빈집 실태조사 결과를 기반으로 등급별 분포 현황을 정리한 자료이다. 빈집은 상태에 따라 1등급부터 3등급까지 분류되며, 1등급은 상대적으로 양호한 상태이고, 등급이 높아질수록 관리 필요성이 증가한다. 각 동별로 등급별 빈집 수를 표 형식으로 제공함으로써 지역별 관리 우선순위 설정, 정비 사업 기획, 도시재생 정책 수립 등의 기초 자료로 활용 가능하다. 주택 노후도 파악, 공가 활용 방안 마련, 지역 안전 관리 등에도 참고 자료로 활용되며, 공공 및 민간 부문에서 주택 관련 의사결정에 기여할 수 있도록 구성되어 있다. 데이터 항목은 간결하면서도 명확하게 정리되어 있어 검색 편의성과 활용도를 높였다.
