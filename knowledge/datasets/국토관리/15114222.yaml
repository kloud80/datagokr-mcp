description_portal: '- 환산보증금이란 월세를 보증금으로 환산하여 원래의 보증금에 더한 금액을 말함. 월세를 보증금으로 환산할 때에는 100을 곱하여 계산(환산 보증금을 기준으로 해당 지역별 상가 건물 임대차 보호법의 적용 대상 유무가 결정)- 확정일자란 증서의 작성일로부터 완전한 증거능력(증거력)을 인정받은 날짜를 말함. 법적 문서에 대해 일정한 절차를 밟은 경우 등 작성 날짜에 대해 완전한 증거능력을 인정하는 제도- 2025년 12월말 기준 지역별, 환산보증금액별 확정일자 부여 현황.- 경기는 경기도 중 인천청 관할을 제외한 구역을 말함- 강원은 철원군을 제외한 강원도 전체 구역을 말함- 경기(일부)는 인천청 관할인 김포, 부천, 의정부, 포천, 동두천, 고양, 파주, 광명, 연천군을 말함- 상가건물의 경매 또는 공매 시에 보증금 우선변제를 받고자 임차인이 관할세무서장에게 신청하여 부여 받음.'
