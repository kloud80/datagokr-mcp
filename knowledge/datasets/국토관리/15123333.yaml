summary_user: 전국 하천의 하천유지유량과 기준갈수량을 수위관측소 단위로 담은 파일로, 각 행에 관측소가 있는 시도·시군구·읍면동 주소와 하천·표준유역 이름이 함께 붙어 있다. 하천 관리자나 환경·수자원 분석가가 '이 하천 지점에서 생태계와 수질을 지키려면 최소 몇 유량을 유지해야 하나'를 확인하고, 실제 관측 유량과 견줄 기준값을 잡는 데 쓴다. 전역 조인 키는 없어서, 수위관측소코드로 같은 기관의 수위·유량 관측 자료에 붙이거나 하천코드·표준유역코드와 이름으로 하천·유역 자료에 맞춰 이어 쓴다.
description_portal: 하천유지유량(最低流量, Minimum Flow)은 하천의 생태계와 수질을 보호하기 위해 유지해야 하는 최소한의 유량을 의미합니다. 이는 자연환경의 보전뿐만 아니라, 수자원 관리 및 수질 오염 방지에도 중요한 역할을 합니다.  환경부는 하천 생태계 보호를 위한 가이드라인을 제공하고 있으며, 이를 바탕으로 지역 특성에 맞는 하천유지유량을 산정하고 있습니다.행정구역 별 하천유지유량 정보 (기준갈수량, 수위관측소코드, 수위관측소명, 하천유지유량, 하천코드, 표준유역코드, 하천코드명, 표준유역코드명) 제공합니다.
