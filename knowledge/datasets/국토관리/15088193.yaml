summary_user: 서울주택도시공사(SH공사)가 앞으로 매각할 토지를 용지 단위로 정리한 계획 파일로, 지구명·용지명·면적·가격조건·공급방식·용적률·건폐율·층수제한·공고 연월을 담는다(csv 약 7.6KB 규모의 소량 파일). 민간 개발사업자나 투자 검토자가 'SH공사가 어느 지구에서 어떤 용지를 언제, 입찰과 수의계약 중 어떤 방식으로 내놓는가'를 확인해 입찰 참여를 준비하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지구명·용지명 같은 이름으로 맞춰 잇거나 같은 기관(SH공사)의 다른 데이터와 묶어 본다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)가 추진하는 토지 매각 계획에 관한 정보를 포함하고 있으며, 향후 공급 예정인 토지의 세부 조건을 확인할 수 있습니다. 주요 항목으로는 지구명, 용지명, 면적(㎡), 가격조건, 공급방식(입찰, 수의계약 등), 용적률(%), 건폐율(%), 허용용도(주거, 상업 등), 공고시기 등이 제공됩니다. 이를 통해 각 지구에서 어떤 유형의 토지가 얼마만큼의 규모로 어떤 방식으로 공급될 예정인지 파악할 수 있으며, 민간 개발사업자나 관련 업계는 해당 정보를 바탕으로 입찰 참여나 투자 검토를 준비할 수 있습니다. 다만 이 매각 계획은 부동산 시장 상황, 사업성 검토, 정책 방향 등에 따라 언제든지 변경될 수 있으므로 참고자료로 활용해야 합니다. 또한 토지이용계획, 개발 가능성, 수익성 분석 등과 연계하여 도시개발 전략 수립에도 활용 가능합니다.
