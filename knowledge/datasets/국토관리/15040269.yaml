summary_user: 대구광역시 서구 비산동의 건물(주소)별 상수도 사용량을 2017년 1월부터 2019년 9월까지 월별 열로 담은 건별 원천 파일이며, 기간 합계 열이 함께 있다(CSV 약 1.8MB). 지역 분석가가 비산동 안에서 어느 건물이나 구역의 물 사용이 계절별로 늘고 주는지, 사용량이 많은 건물이 어디인지 확인하는 데 쓴다. 공통 조인 키는 없고 주소 문자열이 유일한 연결 고리라서, 건축물대장이나 주소·좌표 데이터와는 주소를 정제해 맞춰 붙여야 한다.
description_portal: 대구광역시 서구 비산동 건물별 상수도 사용량 현황을 확인할수 있습니다. 참고로  참고로 대구광역시의 상수도요금은 시민이 사용한 수돗물의 양과 용도에 따라 합리적으로 산정되어 부과되는 비용으로, 수도시설의 유지관리와 안정적인 수돗물 공급을 위한 주요 재원입니다.상수도요금은 기본요금과 사용요금으로 나뉘며, 기본요금은 계량기의 구경 크기에 따라, 사용요금은 월간 수돗물 사용량과 사용 용도(가정용, 일반용, 산업용 등)에 따라 차등 적용됩니다. 대구시는 검침원이 매월 계량기를 통해 사용량을 확인하고, 이에 따라 요금을 계산합니다. 사용자는 고지서를 통해 요금을 확인한 후, 금융기관 납부, 자동이체, 모바일 앱, 인터넷 납부 등의 다양한 방식으로 요금을 납부할 수 있습니다. 기한 내 납부하지 않으면 연체료가 부과될 수 있으므로 주의가 필요합니다.
