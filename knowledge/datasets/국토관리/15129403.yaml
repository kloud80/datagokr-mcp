summary_user: 경남개발공사가 시행하는 공공사업(택지개발·도로·하천 정비 등)에서 작물 피해 보상금을 산정할 때 쓰는 작물별 고시 단가(농업 조수입 기준)를 사업 구분·고시 일자·작물명·단가 단위로 담은 작은 파일(약 4KB CSV)이다. 보상 대상 토지 소유자나 경작자, 감정평가 실무자가 '이 사업에서 고추나 벼의 보상 단가가 얼마로 고시됐고 고시 시점별로 어떻게 달랐나'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 작물명이나 사업 구분 코드를 같은 기관의 사업 목록과 이름·코드로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경남개발공사에서 수행하는 각종 공공사업(택지개발, 도로건설, 하천재해예방 등)과 관련하여농지 및 작물 피해 보상 산정 시 활용되는 농업조수입(작물단가) 기준 정보를 제공합니다.사업별 구분 코드, 고시 일자, 작물 명, 단가, 등록일자 등의 항목으로 구성되어 있으며,공공사업 시행 시 작물 피해 보상금 산정의 근거자료로 활용됩니다.또한, 하천정비나 도로확포장, 자연재해위험 개선지구 정비 등 다양한 사업에서연도별·지역별로 고시된 농업 조수입 단가 변동 현황을 파악할 수 있습니다.이 데이터는 농업보상 평가의 투명성을 높이고,공익사업 시행 과정에서의 공정한 보상 기준 수립 및 정책분석 자료로 활용될 수 있습니다.
