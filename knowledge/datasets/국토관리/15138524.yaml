summary_user: 경기도 이천시에서 개발행위허가를 받은 필지를 도형 단위로 담은 파일로, 도형 관리번호·라벨명·도형 면적·도형 생성일을 담는다(CSV 약 246KB, 시군구 범위). 이천시에서 어느 필지가 개발행위허가를 받았고 그 면적이 얼마인지 확인하려는 분석가·사업자가 개발 밀도나 인허가 이력을 볼 때 쓴다. 전역 조인 키(필지고유번호 등)가 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 같은 이천시 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경기도 이천시에서 개발행위 허가를 받은 필지에 대한 공간 정보를 제공합니다. 현황도형 관리번호, 라벨명, 면적(도형), 생성일 등으로 구성되어 있으며, 허가가 완료된 필지를 도형 단위로 식별하고 해당 면적 정보를 제공합니다. 본 데이터는 개발 밀도 분석, 인허가 이력 관리, 도시관리계획 이행 점검, 공공시설 배치 검토, 기반시설 연계 등 다양한 행정업무에 활용됩니다. 특히 도형 식별자 및 면적 정보는 GIS 기반 도시계획 수립, 개발 이력 분석, 사전행위검토 자동화 등에서 핵심 자료로 쓰입니다. 라벨명은 필지 구분이나 행정상 분류 기준으로 활용될 수 있어 시각화에도 적합합니다.
