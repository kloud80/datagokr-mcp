summary_user: 부산광역시 강서구 안에 조성된 공개공지를 건축물 한 곳당 한 행으로 담은 파일로, 건축물명·용도·층수·연면적과 공개공지 면적·개소·위치·편의시설, 도로명·지번 주소와 위·경도, 허가·사용승인 일자를 함께 싣는다(csv 약 1.7KB 규모의 작은 목록). 주민이나 도시계획 분석가가 '강서구에서 누구나 쉬어 갈 수 있는 공개공지가 어느 건물에 있고 어떤 편의시설을 갖췄나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 주소(도로명·지번)나 위·경도 좌표로 건축물대장·지도 데이터와 공간적으로 맞춰 이어 쓴다.
description_portal: 부산광역시 강서구 내에 조성된 공개공지의 현황을 체계적으로 파악할 수 있게 구성되어있습니다. 구체적으로는 건축물의 명칭과 용도, 층수 및 전체 연면적과 같은 건축물 기본 정보를 비롯하여, 공개공지의 면적과 설치 개소, 구체적인 위치 및 편의시설 현황 등 공간적 특성을 상세히 포함하고 있습니다. 또한, 정확한 위치 확인을 위한 도로명·지번 주소와 위·경도 좌표는 물론, 건축 허가 및 사용 승인 일자 등의 시계열적 이력과 최신성 유지를 위한 데이터 기준일자를 포함하여 정보를 제공하고 있습니다.
