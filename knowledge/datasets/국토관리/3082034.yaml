summary_user: 부산 기장군에 있는 공동주택의 하자보수보험증권 현황을 단지(건물)마다 한 줄씩 담은 파일로, 소재지·건물명·연면적·세대수·준공일·보증사·보증금액 합계·비고(반환 여부)를 담는다. 입주자대표나 주민, 분석가가 우리 단지의 하자보수 보증금이 어느 보증사에 얼마로 예치돼 있는지, 증권이 이미 반환됐는지를 확인하는 데 쓴다. 전역 조인 키가 없어서 K-apt 단지정보나 실거래 자료와는 건물명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '부산광역시 기장군 공동주택 하자보수 보험증권 현황으로 건물명, 위치, 보증사, 보증금액, 준공일, 비고(반환여부)  등의 항목을 제공합니다.하자보수 보험증권은 공동주택관리법 시행령 제41(하자보수보증금의 예치 및 보관) 규정에 따라 사업주체가 지은 건축물(공동주택)에 대한 하자가 발생될 시 하자를 보수하기 위하여 보험증권을 지방자치단체로 하여금 피보험자로 예치 및 보관하게 합니다.지방자치단체가 피보험자로 가입되어 있는 보증보험증권으로 공동주택에 하자가 발생될 시 사업주체가 하자보수를 이행하지 아니할 시 가입된 하자보수보증보험을 청구하여 하자를 보수 할 수 있습니다.공동주택의 관리인(예시: 입주자대표 등)이 선임될 시 보증보험증권 반환 신청을 통해 증권을 직접 관리할 수 있습니다.'
