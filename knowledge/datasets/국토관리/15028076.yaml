summary_user: 대전광역시 유성구에 소재한 공장의 등록 정보를 공장 한 곳당 한 행으로 담은 파일(csv, 약 47KB)로, 회사명·업종번호와 업종명·생산품·지번과 도로명 주소·위도와 경도를 포함한다. 분석가나 사업자가 '유성구에서 특정 업종 공장이 어디에 몰려 있는가'처럼 지역 제조업 분포와 산업구조를 지도 위에서 확인하는 데 쓴다. 공통 조인 키(사업자번호·필지고유번호 등)가 없어서, 주소나 좌표로 공간 결합하거나 업종번호를 업종 코드표와 맞춰 보는 방식으로만 다른 데이터와 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 팩토리온 공장등록이나 기업·토지 데이터와 정확히 연결하려면 회사명·주소 매칭이 필요하다. 범위는 유성구 한 곳이며, 용지 분양·임대나 산단 개발 정보는 담지 않는다.
