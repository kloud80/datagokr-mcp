summary_user: 광주 동부소방서 관내(동구) 터널을 터널 한 곳당 한 행으로 정리한 소규모 파일(csv 716바이트)로, 터널 이름·위치·상행선과 하행선 길이(m)·설치된 소방시설을 담는다. 소방·안전 담당자나 지역 주민이 '동구 관내 터널마다 길이가 얼마이고 어떤 소방시설이 갖춰져 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 터널·도로 데이터와는 터널 이름(대상명)이나 위치 문자열을 맞춰 연결해야 한다.
description_portal: '광주광역시 동부소방서 관내 터널현황에 대한 데이터로 동구 관내 터널의 위치 ,상·하행선 길이 및 소방시설에 대한 정보를 설명하는 자료입니다.동부소방서 관내에는 도심과 외곽을 연결하는 중·소규모 터널들이 분포하고 있습니다. 이들 터널은 출퇴근 시간 교통량이 많아 사고 발생 시 2차 피해로 이어질 가능성이 크며, 대부분 차량 전용 도로에 위치해 있습니다. 터널 내부에는 화재감지기, 비상 조명, 비상 전화, 소화기, 스프링클러, 환기 설비 등 다양한 안전 장치가 설치되어 있어 사고 시 초기 대응이 가능하도록 하고 있습니다.터널에서는 주로 다음과 같은 위험이 발생할 수 있습니다.교통사고: 충돌, 추돌, 차량 고장 등이 발생하면 밀폐 공간 특성상 정체와 2차 사고 위험이 큽니다.화재 사고: 차량 화재는 짙은 연기와 고열로 인해 시야 확보와 탈출이 어렵습니다.환기 문제: 터널 내 배기가스 축적, 화재 시 유독가스 확산 등은 인명 피해로 이어질 수 있습니다.동부소방서는 터널 화재나 사고에 대비해 정기 합동 훈련을 실시합니다. 소방·경찰·구청·한국도로공사 등과 함께 터널 내 사고 상황을 가정해 인명 구조, 차량 화재 진압, 교통 통제 훈련을 하고 있습니다. 또한, 터널 내 비상구 위치, 환기 설비 작동 방식, 소방차 진입 동선 등을 사전에 철저히 파악해 두어 실제 사고 시 신속히 대응할 수 있도록 준비하고 있습니다.'
