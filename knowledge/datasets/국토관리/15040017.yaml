summary_user: 충청남도 청양군 관내 저수지를 한 행에 하나씩 담은 시설 목록 파일로, 저수지명과 읍면·리 소재지, 준공년도, 수혜면적(ha), 총저수량·유효저수량, 제방 길이·폭·높이, 관리부서 연락처를 담는다(csv 약 5.8KB, 시군구 범위). 지역 정책 담당자나 농업·수자원 분석가가 '청양군의 어느 읍면에 어떤 규모의 저수지가 있고 몇 ha의 농지에 물을 대는가'를 확인할 때 쓴다. 전역 조인 키나 저수지코드가 없으므로, 농어촌공사 저수율 자료 등 다른 데이터와는 저수지명과 읍면·리 이름을 맞춰 연결해야 한다.
limits: 수위·저수율·방류 같은 운영 실측값은 없고 정적인 시설 제원만 담는다. 공통 코드가 없어 다른 저수지 데이터와 붙일 때 이름 표기 차이로 매칭이 어긋날 수 있다. 범위는 청양군 한 곳뿐이다.
