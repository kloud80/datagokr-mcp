description_portal: '평택시 도시숲 위치 정보 데이터는 평택시 대표 홈페이지 DB 데이터로서 도시 내 녹지의 공간 분포를 파악하여 시민의 삶의 질을 높이고, 미세먼지 저감·열섬현상 완화 등 여러 분야에 활용하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 생활권 내 도시숲의 위치와 규모를 쉽게 확인할 수 있으며, 민간·연구기관은 도시 생태계 분석, 녹지 접근성 평가, 환경·기후 대응 연구, 녹지 기반 헬스케어 서비스 개발 등에 활용할 수 있습니다. 본 데이터에는 도시숲 이름, 주소, 유형(근린숲·가로숲·학교숲 등) 등이 포함되어 있어 도시와 녹지 환경을 종합적으로 이해하는 데 도움이 됩니다. 이러한 자료는 도시계획, 녹지정책, 생활환경 개선, 환경교육 프로그램 개발 등 공공과 민간에서 폭넓게 활용할 수 있는 핵심 기반 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
