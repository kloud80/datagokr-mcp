summary_user: 아산시 도시계획정보시스템의 용도구역(개발제한구역·시가화조정구역 등) 결정조서·변경사유서·승인조서를 병합해, 조서 건별로 위치·면적(기정·변경·변경후)·결정(변경)사유를 담은 파일 데이터(CSV 약 11KB)다. 분석가나 주민이 아산시 안에서 어떤 용도구역이 어디에 어느 면적으로 결정·변경됐고 그 사유가 무엇인지 확인할 때 쓴다. 전역 조인 키는 없으며, 조서관리번호·결정고시 관리번호로 같은 시스템의 다른 아산시 도시계획 테이블과 잇거나 지역명·위치명을 이름으로 맞춰 연결한다.
description_portal: '용도구역:  국토의 계획 및 이용에 관한 법률에 따라 토지의 이용 및 건축물의 용도, 건폐율, 용적률, 높이 등에 대한 용도지역 및 용도지구의 제한을 강화하거나 완화하여 따로 정함으로써 시가지의 무질서한 확산방지, 계획적이고 단계적인 토지이용의 도모, 토지이용의 종합적 조정, 관리 등을 위하여 도시, 군관리계획하는 지역을 말한다.용도구역이 설정되어 있으면 용도지역에서 허가되는 건물이더라 하더라도 용도구역이 우선된다.23~25 공공데이터 중장기개방계획에 의한 도시계획정보시스템 개방데이터로서 용도구역 결정조서, 용도구역 변경사유서, 용도구역 승인조서 테이블을 병합하여 제공합니다.'
