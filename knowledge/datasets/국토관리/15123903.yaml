summary_user: 전국 법정동(시군구·읍면동·리) 경계를 연속된 도면으로 담은 공간정보 데이터로, OGC 표준 WMS/WFS 외부 API(vworld.kr)로 제공한다. 지도 서비스 개발자나 공간 분석가가 특정 지역의 법정동 경계를 지도에 겹치거나 도형·속성을 가져오는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결하고, 같은 국토 정보 계열 공간정보 레이어와 지도 위에서 겹쳐 쓴다.
