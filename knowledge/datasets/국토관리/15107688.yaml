summary_user: 경기도 양주시의 장기미집행 도시계획시설을 시설 종류별로 묶어 미집행 개소와 면적을 집계한 표로, 전체·10년 미만·10년 이상으로 나눠 기준연도와 함께 담는다(시군구 단위, 1.5KB 남짓한 CSV 한 건). 양주시에서 도로·공원 같은 시설 중 10년 넘게 집행되지 않은 면적이 얼마나 되는지 확인하려는 주민·도시계획 분석가가 쓴다. 전역 조인 키가 없어 다른 시군구 장기미집행 현황과는 시도명·시군구명·시설명 같은 이름을 맞춰 이어 쓴다.
description_portal: 경기도 양주시 장기미집행 도시계획시설 현황 데이터는 도시계획 시설 중 장기간 집행되지 않은 시설의 실태를 체계적으로 기록한 자료이다. 시도명과 시군구명, 시설명을 통해 지역별·시설별 분류가 가능하며, 기준연도를 통해 해당 자료가 수집된 시점을 확인할 수 있다. 특히 미집행 총개수와 미집행 총면적 항목은 도시계획시설의 규모와 미집행 정도를 파악하는 핵심 지표로 활용될 수 있다. 또한 미집행 10년 미만과 10년 이상 구분 자료가 제공되어 단순 현황 파악을 넘어 도시계획의 장기 미이행 문제를 분석하는 데 유용하다. 관리부서 및 연락처 정보가 포함되어 있어 행정적 대응과 정책 수립 과정에서 실무 활용도가 높으며, 데이터기준일자를 통해 자료의 최신성과 신뢰성이 보장된다. 이 데이터는 장기미집행 도시계획시설 해소를 위한 우선순위 설정, 예산 배분, 정책 평가 및 지역 균형 발전 전략 수립에 중요한 근거 자료로 활용 가능하다.
