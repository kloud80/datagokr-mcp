summary_user: 한국수자원공사가 관리하는 지방정수장의 계획 단수 일정을 건별로 담은 파일로, 지자체명·단수지역·단수사유·시작/종료 일시·공사명·공사개요와 작성부서·담당자·연락처를 한 행에 담는다(내려받은 CSV는 약 3KB 규모). 주민이나 사업자가 '우리 지역에 언제, 무슨 공사로 물이 끊기는가'를 미리 확인하거나, 민원·행정 담당자가 단수 일정과 연락처를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 상수도 데이터와는 지자체명 같은 이름 매칭으로만 연결한다.
description_portal: 본 데이터는 한국수자원공사가 관리하는 지방정수장의 수돗물 공급 중단 계획 정보를 체계적으로 제공하기 위한 공공데이터이다. 지자체별로 계획된 단수 일정을 포함하며, 단수 지역, 단수 사유, 시작 및 종료 일시, 공사명, 공사 개요 등으로 구성된다. 이 정보는 수돗물 이용자와 관계기관이 사전 대응할 수 있도록 제공되며, 단수로 인한 불편을 줄이고 공공서비스 품질을 높이는 데 목적이 있다. 해당 데이터는 정기적으로 갱신되며, 작성부서, 작성일, 담당자, 연락처 등 메타정보도 함께 포함되어 활용성과 신뢰도를 높인다. 또한 정수장 운영 계획 수립, 민원 응대, 긴급상황 대응 등 다양한 행정업무에 활용될 수 있는 자료이다.
legal_basis_portal: '* 지방상수도 시스템 운영 중 발생하는 계획 단수 및 긴급 단수에 대한 이력 및 현황을 지자체, 시민, 중앙정부가 공동으로 파악하고 대응하기 위함* 물관리 일원화 정책 및 지방상수도 현대화 사업 추진에 따라, 지역 기반 사고 정보를 수집하고 사고 재발 방지 및 통계 기반 정책 수립에 활용하기 위함'
