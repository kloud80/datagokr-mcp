summary_user: 경기도 지역화폐 결제와 카드 결제를 중분류 업종별로 맞대어 계산한 상관계수를 기준년월마다 집계한 자료로, 지역화폐 업종코드·카드 업종코드 쌍별로 -1~1 사이 상관계수값(crrltn_cffcnt_vl)을 담는다. 정책 분석가나 연구자가 '지역화폐 소비가 어느 업종에서 카드 소비와 같은 방향으로 움직이는가'처럼 지역화폐 정책 효과와 업종별 소비 구조를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 업종코드는 포털 파일 서비스의 '2024년도 분석시스템 데이터셋 코드값'으로 풀어 같은 분석시스템의 다른 경기도 데이터와 업종코드·기준년월로만 맞춰 쓴다.
description_portal: 분석시스템_경기도_상관관계_집계 데이터는 지역화폐와 카드 데이터를 업종별로 비교하여 산출한 상관계수를 집계한 자료입니다. 데이터는 기준년월, 지역화폐 중분류 업종코드, 카드 중분류 업종코드, 상관계수값으로 구성되어 있습니다. 상관계수값은 -1에서 1 사이로 나타나며, 0에 가까울수록 상관이 약하고, 양수는 정(+)의 상관관계, 음수는 부(-)의 상관관계를 의미합니다. 이를 통해 지역화폐 이용 활성화 정책 효과 분석, 카드 결제 데이터와의 비교 연구, 업종별 소비 구조 파악 등에 활용할 수 있습니다. 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.
