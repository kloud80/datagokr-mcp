description_portal: 한국토지주택공사에서 관리하는 분양임대 공고 정보를 조회할 수 있는 서비스 입니다.인증키와 함께 공고명 또는 공고유형코드 지역코드, 공고상태(공고중/접수중/접수마감/상담요청/정정공고중), 공고게시일, 공고마감일을 입력하여 필요한 공고를 조회할 수 있습니다.공고유형코드로는 01(토지), 05(분양주택), 06(임대주택), 13(주거복지), 22(상가), 39(신혼희망타운)이 있습니다.API 활용을 위해선 공공데이터포털 가입 및 활용신청이 필요합니다. 자세한 활용 방법은 첨부된 OPEN API 활용 가이드 문서에서 확인하실 수 있습니다.
