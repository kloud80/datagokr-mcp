summary_user: 한국토지주택공사가 게시한 분양·임대 공고를 공고명, 공고유형(토지·분양주택·임대주택·주거복지·상가·신혼희망타운), 지역, 공고상태, 게시일·마감일로 조회하는 API이며, 검증 때 전국 범위에서 2행을 받았다. 청약 대기자나 분석가가 지금 접수 중인 LH 임대주택이나 분양주택 공고가 무엇인지 찾는 질문에 쓴다. 실측 필드에서 전역 조인 키를 찾지 못해 다른 데이터와는 공고명·지역 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 타 기관 데이터와 자동 결합은 안 되고, 경쟁률·당첨 결과는 이 데이터로 확인되지 않는다. 검증 수신은 2행이어서 전체 규모는 알 수 없으며, 갱신 주기는 이벤트성(생성 후 불변)으로 분류돼 있다. 활용신청 후 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
