description_portal: 이 데이터는 경기도 이천시에서 발행된 지역화폐의 실제 사용 내역을 업종 단위로 집계한 자료입니다. 항목은 사용순위, 사용업종명, 업종코드, 세부업종명, 총 사용금액, 사용비율로 구성되며, 특정 업종에서 지역화폐가 얼마나 사용되었는지를 금액 및 비율 기준으로 파악할 수 있도록 설계되어 있습니다. 지역경제 내 소비 흐름과 업종별 수요 편중 현황을 확인할 수 있어, 지역화폐 정책의 효과 평가, 소상공인 지원 방향 수립, 민간 소비 진작 전략 등에 근거 자료로 활용됩니다. 특히, 사용비율과 업종 세분화 정보는 소비 행태를 정밀 분석하는 데 기초자료로 활용되며, 시군별 지역화폐 운영 효율성 분석에도 유용합니다.
