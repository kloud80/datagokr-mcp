summary_user: 경기도 이천시에서 발행된 지역화폐의 사용 내역을 업종·세부업종 단위로 집계해 사용순위, 업종코드, 총 사용금액, 사용비율을 담은 작은 CSV 파일(약 2.4KB)로, 건별 결제 원천이 아닌 집계 자료다. 지역화폐 정책 담당자나 지역경제 분석가가 '이천시 지역화폐가 어느 업종에 가장 많이 쓰였는가'를 확인하거나 업종별 소비 편중을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군의 지역화폐 업종별 현황과는 업종명·업종코드를 맞춰 비교하거나, 같은 기관(이천시) 기준으로만 이어 쓴다.
