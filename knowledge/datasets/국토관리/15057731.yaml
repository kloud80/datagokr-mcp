summary_user: 국토교통부가 제공하는 용도지역 중 자연환경보전지역 구분을 다루는 외부 API(vworld.kr)로, 범위는 전국이며 시도·시군구명(sido_name, sigg_name) 등을 필드로 둔다. 토지 소유자나 사업자가 특정 지역이 자연환경보전지역으로 지정돼 건축·개발 제한을 받는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시도·시군구 이름 매핑이나 같은 기관 코드로만 이어 쓰며, 국토계획법상 용도지역·지구·구역 규정(§36~§42) 해석의 기초 자료가 된다.
description_portal: '#. 용도지역토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등을 제한함으로써 토지를 경제적·효율적으로 이용하고 공공복리의 증진을 도모하기 위하여 서로 중복되지 않게 도시관리계획으로 결정하는 지역으로  도시지역, 관리지역, 농림지역, 자연환경보전지역으로 구분#용도지구토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역의 제한을 강화 또는 완화하여 적용함으로써 용도지역의 기능을 증진시키고 미관·경관·안전 등을 도모하기 위하여 도시관리계획으로 결정하는 지역으로 경관지구, 미관지구, 방화지구, 방재지구, 고도지구, 보존지구, 시설보호지구, 취락지구, 개발진흥지구, 특정용도제한지구로 구분 #. 용도구역토지의 이용과 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역 및 용도지구의 제한을 강화 또는 완화하여 따로 정함으로써 시가지의 무질서한 확산방지, 계획적이고 단계적인 토지이용 도모, 토지이용의 종합적 조정·관리 등을 위하여 도시관리계획으로 결정하는 지역으로 개발제한구역, 시가화조정구역, 도시자연공원구역, 수산자원보호구역으로 구분공통주택, 공장, 관광휴게시설, 교육연구시설 등 행위 금지 기타 도시계획조례가 정하는 바에 의하여 종교시설, 제1종, 2종 근린시설 건축 가능'
