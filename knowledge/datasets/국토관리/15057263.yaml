summary_user: '토지이용행위와 건축법 시행령 별표 시설에 대해 계획·건축인허가, 사업시행·공사, 사용·등록·신고 단계별 인허가 안내사항을 시설 단위로 요약해 담는 전국 범위 API이다. 사업자나 건축주가 특정 시설(예: 근린생활시설)을 지으려 할 때 단계별로 어떤 인허가 절차를 거쳐야 하는지 확인하는 데 쓴다. 분류코드·시설코드(FACIL_CD)와 상세 URL을 주지만 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 없어, 시설명·분류명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.'
limits: 필지·건물 단위 범위로 분류되지만 개별 필지의 규제 여부나 토지이용계획을 직접 판정하지는 않는 안내 요약 정보다. 다른 데이터와 공통 키가 없어 이름 기준으로 맞춰야 하며, 개발계정은 하루 1,000회로 호출이 제한된다.
