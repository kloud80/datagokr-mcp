summary_user: 국토교통부 데이터 통합채널의 유즈케이스 분석서비스에 등록된 데이터 활용정책 자료를 건별로 담으며, 각 건마다 제목, 카테고리, 키워드, 제공기관, 원본등록일, 제공페이지 URL을 제공한다(범위는 전국·비공간). 공공데이터로 창업이나 사업을 구상하는 사업자와 분석가가 '국토교통 데이터를 쓴 정책·활용 사례 중 특정 키워드나 등록 시기에 해당하는 것은 무엇인가'를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 제공기관 이름이나 키워드 같은 텍스트 매핑으로만 이어 쓸 수 있다.
limits: 공통 코드나 식별자가 없어 다른 데이터셋과 키로 바로 조인할 수 없고, 제공기관명·키워드 등 이름 매핑에 의존해야 한다. 지역 단위 구분이 없는 전국·비공간 자료라 지역별 분석에는 쓸 수 없다. 개발계정은 하루 1,000회까지 호출할 수 있다.
