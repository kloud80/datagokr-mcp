summary_user: 춘천시에서 공사 중인 건축 공사장을 한 건씩 담은 파일로, 공사장별 건축구분·허가번호·대지위치와 대지면적·건축면적·연면적·건폐율·용적률, 허가일·착공일·사용승인일을 담는다. 시민이나 부동산·건설 분석가가 '우리 동네에서 지금 어떤 규모의 건축 공사가 언제 착공해 언제 끝날 예정인가'를 확인하거나, 시내 공사 물량과 일정을 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 대지위치(주소)나 허가번호를 이름·코드로 맞춰 건축물대장·건축인허가 자료와 연결해야 한다.
description_portal: 해당 데이터는 강원특별자치도 춘천시에서 공사 중인 공사장의 상세 정보를 포함하고 있다. 주요 항목으로는 연번, 건축 구분, 허가 번호, 지목, 대지 면적(㎡), 건축 면적(㎡), 연면적(㎡), 증축 연면적(㎡), 건폐율(%), 용적률(%), 허가일, 착공 처리일, 착공 예정일, 사용 승인일, 데이터 기준일 등이 포함된다. 이 자료는 춘천시 내 진행 중인 각종 건축 공사의 진행 상태를 체계적으로 관리할 수 있게 하며, 공사 일정과 면적, 건축물의 특성 등을 종합적으로 파악할 수 있다. 또한, 건축물의 허가 조건을 점검하고, 도시 개발 및 건축 규제에 따른 정책 수립을 위한 중요한 기초 자료로 활용될 수 있다.
