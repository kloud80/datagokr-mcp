summary_user: 홍수위험지도에서 하천유역의 권역을 나타내는 권역코드와 권역명을 담은 작은 코드표 파일(csv 159바이트)로, 전국 범위의 비공간 자료다. 홍수위험지도 관련 자료를 다루는 분석가나 지자체 담당자가 '이 권역코드는 어느 유역 권역인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 기관의 홍수위험지도 자료와 권역코드·권역명을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 제방월류, 제방파제, 내수침수 홍수시나리오에 따라 예상되는 최대 범람지역을 표시하는 홍수위험지도에 대하여 하천유역의 권역을 표현.* 홍수위험지도란? 하천제방의 설계빈도를 초과하는 홍수가 발생하여 제방붕괴, 제방월류 등 극한의 상황이 발생한다는 가정하에 하천 주변지역의 침수범위, 침수깊이를 나타낸 지도. 이를 통해 최악의 홍수상황을 사전에 대비하고 인명 및 재산피해를 최소화하며, 지자체의 재해지도 제작, 홍수 관련 보험의 기초자료를 제공 및 수해방지대책 수립 등에 활용이 가능한 홍수 대비를 위한 기초정보. 홍수위험지도의 제방붕괴 등의 홍수 예상 시나리오는 실제 하천제방의 안정성과 무관하며, 구조물적 대책이 실패한다는 최악의 경우를 가정한 것으로서 홍수 시 가상의 최대 범람 범위 산정을 위한 것임
