summary_user: 전국 국가산업단지를 단지 한 곳당 한 행으로 정리한 현황 통계 파일로, 시도·시군·조성상태와 지정·관리면적, 산업시설구역 분양·미분양 면적과 분양률, 입주업체·가동업체 수를 담는다. 지역 제조업 입지를 살피는 분석가나 사업자가 '우리 지역 국가산단의 분양률과 실제 가동업체 비율은 어느 정도인가' 같은 질문에 쓴다. 전역 조인 키는 없어 단지명과 시도·시군 이름을 맞춰 산업단지 원장이나 산단공 산업동향·공장등록 통계와 연결한다.
description_portal: '지정된 전국 국가 산업단지와 관련된 통계 자료입니다. "국가산업단지"는 대한민국에서 국가가 직접 개발하거나 지정하여 관리하는 산업단지를 말합니다. 국가 산업단지는  산업입지 및 개발에 관한 법률(약칭: 산업 입지법)에 근거하여 지정되며, 국가 산업정책의 핵심 수단 중 하나입니다. 통계자료에는 조성상태, 지정면적, 관리면적, 산업시설구역 분양률, 입주업체, 가동업체 등이 포함되어 있습니다. 들여쓰기 되어 있는 단지는 하위단지로 상위단지에 포함되어 있는 단지이며 단지 수에는 포함되지 않습니다.'
