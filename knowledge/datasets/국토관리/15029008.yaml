summary_user: 충청남도 아산시 산업단지·농공단지에 입주한 기업을 한 행에 한 업체씩 담은 명단 파일로, 회사명·지번주소·업종·생산품·최초등록일·전화번호·종업원수·입주 단지명을 담는다. 구직자나 영업 담당자가 '아산의 어느 단지에 어떤 업종 업체가 몇 명 규모로 들어와 있나'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어, 다른 공장 등록·산단 통계 자료와는 회사명·지번주소·단지명을 이름으로 맞춰 이어 쓴다.
limits: 사업자등록번호 같은 공통 키가 없어 공장 등록 등 다른 데이터와의 연결은 이름·주소 매칭에 기대야 하며 오매칭에 주의한다. 범위는 아산시 한 곳에 한정되고, 용지 분양·임대·미분양 정보는 담지 않는다.
