summary_user: 지자체(행정구역)별·공부구분별·축척별로 지적공부의 등록지번수, 폐쇄·말소지번수, 폐쇄장부(공유지·색인표 포함) 페이지수를 통계 기준월 단위로 집계한 전국 범위 파일 데이터이다. 지자체나 분석가가 "어느 지역에 폐쇄 지적장부 페이지가 많이 남아 있어 전산화·보존 업무량이 큰가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키(법정동코드 등)가 없어, 다른 지적·토지 통계와는 행정구역 이름을 매핑하거나 통계 기준월을 맞춰 붙여 쓴다.
description_portal: 본 통계는 지자체별 지적공부(폐쇄대장 포함)의 등록·정리·보존 현황을 보여주며, 지적재조사(디지털 지적), 공익사업 보상, 온라인 민원 확대, 시장 안정 조치(토지거래허가구역), 빈집정비, 농지 관리 제도 변화, 개인정보 보호 강화 등 최근 이슈와 함께 해석할 때 정책적 시사점이 극대화됩니다. 나아가 세계측지계 전환·디지털트윈 국토 구축·3D 공간정보 고도화와 맞물려 축척 표준화·폐쇄장부 전산화(스캔·메타데이터화)·색인체계 정비의 진척도를 드러내고, 재난복구·대규모 개발·수용 시기에는 지번 등록·말소·폐쇄의 급증 구간을 통해 사업 일정과 행정 수요를 가늠할 수 있습니다. 또한 공시가격·세제 변화, 경매·공매 동향, 전세사기 피해 지원, 도시정비사업(재건축·재개발) 추진, 국‧공유지 정비 및 신산업 입지(데이터센터·재생에너지 등) 확대에 따라 보존문서 열람·발급 트래픽과 업무량이 지역별로 상이하게 나타날 수 있으므로, 본 통계는 민원 포화도 예측, 디지털 아카이브 우선순위 설정, 예산·인력 배분, 데이터 거버넌스(비식별·접근통제) 기준 마련 등 실무적 의사결정의 근거로 활용됩니다. 마지막으로, 통계 해석 시 업무량(정리·전산화)과 실제 수요(열람·발급)의 혼합 신호, 정책 이벤트에 따른 단기 변동, 개인·특정 지번의 재식별 위험을 함께 점검하는 것을 권장합니다
