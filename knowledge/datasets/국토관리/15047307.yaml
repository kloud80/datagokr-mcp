summary_user: 서울시에 있는 지식산업센터를 센터별 한 행으로 정리한 현황 목록으로, 일련번호·센터명·업체(공장)명·소재 구분·주소를 담는 시 단위 비공간 자료다. 사업자나 분석가가 '서울 어느 자치구에 지식산업센터가 몰려 있고 각 센터 주소는 어디인가'를 확인하거나 입주 공간 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 건축물대장·산업단지 통계 등과는 센터명이나 주소(CENTER_ADDR)를 문자열로 맞춰 연결해야 한다.
description_portal: 서울시 지식산업센터 현황 자료는 서울시에 위치한 지식산업센터의 기본 정보를 정리한 데이터입니다. 연번은 각 센터를 구분하기 위한 일련번호이며, 공장명은 지식산업센터 또는 그 내 입주 공장의 명칭을 나타냅니다. 소재지는 센터가 위치한 주소를 의미하며, 전화번호를 통해 입주기업 또는 관리 주체와 직접 연락할 수 있습니다. 승인일은 관련 법령에 따라 공장 또는 지식산업센터 설립이 행정적으로 승인된 날짜를, 준공일은 건축 공사가 완료되어 실제 사용이 가능해진 날짜를 표시합니다. 이 자료는 지식기반 산업 및 제조업 관련 기업의 공간 분포를 파악하고, 산업단지·지식산업 인프라 현황 분석, 입주 수요 조사, 기업 지원 정책 수립 등 다양한 행정·정책적 활용에 기초 자료로 사용될 수 있습니다.
