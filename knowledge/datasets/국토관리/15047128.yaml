description_portal: 국가통계포털(KOSIS) 주택총조사를 기반으로 동별 주택보급률(기준산정방식) 현황을 제공하는 자료이다. 서울시 각 자치구 및 행정동별 주택 수와 일반가구 수를 바탕으로 산출한 주택보급률(%) 정보를 포함하고 있으며, 지역별 주택 공급 수준과 주거 여건을 파악할 수 있다. 주택보급률은 일반가구 수 대비 주택 수의 비율을 나타내는 지표로, 주택 수급 현황과 주거 안정성을 분석하는 데 활용된다. 본 자료는 주택정책 수립, 주거복지 정책 추진, 도시계획 수립, 재개발·재건축 검토, 지역 간 주거환경 비교 분석 및 부동산 시장 연구를 위한 기초자료로 활용할 수 있으며, 시계열 분석을 통해 지역별 주택 공급 변화 추이도 확인할 수 있다.
