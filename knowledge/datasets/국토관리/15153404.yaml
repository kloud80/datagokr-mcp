summary_user: 국토안전관리원이 관리하는 하천 공공시설(제방·수문 등)의 안전점검 현황을 시설 한 건 단위로 담는다. 시설명·번호·종류·위치·준공일·주요 제원·상태등급·최근 및 다음 점검진단일·관리주체·사진이 들어 있으며 범위는 전국이다. 지자체 담당자나 주민이 "우리 지역 제방·수문의 안전등급은 무엇이고 다음 정밀점검은 언제인가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 시설명·위치 문자열이나 관리기관 이름으로 하천 목록·시설 데이터와 맞춰 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국토교통부 국토안전관리원에서 제공하는 하천 공공시설 안전점검 관련 정보입니다.\""
