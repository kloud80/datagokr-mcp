summary_user: 경기도 내 필지별로 분할·합병 같은 토지 이동 내역을 건별로 담으며, 토지고유번호·소재지·지목·면적·이동사유코드·이동일자(연·월)를 기록한다. 분석가가 특정 시군에서 어느 시기에 어떤 지목의 토지가 분할·합병됐는지 추적할 때나, 사업자가 관심 필지의 지목·면적 변동 이력을 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 토지고유번호(land_idntfy_no)나 소재지 이름을 맞춰 같은 기관의 토지·지적 자료와 이어 쓴다.
description_portal: 이 데이터는 경기부동산포털을 통해 제공되는 '토지_토지이동사유' 자료로, 경기도 내 토지의 이동 이력 및 사유에 대한 정보를 포함하고 있습니다. 데이터 항목은 '토지고유번호', '토지소재지', '토지순번', '지목', '면적', '토지이용사유코드', '토지이동일자' 등으로 구성되어 있으며, 임야 또는 전·답 등 다양한 지목의 토지가 분할, 합병 등의 사유로 행정상 이동된 내역을 기록합니다. '토지이용사유코드' 항목은 토지대장, 임야대장 기준의 이동 사유를 구분하며, 이동일자는 연도 및 월 기준으로 정리됩니다.데이터가 대용량인 관계로 전체 데이터는 파일로 개방하고 있습니다. 전체 데이터가 필요하신 분은 파일을 활용 부탁드립니다.
