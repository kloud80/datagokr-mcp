summary_user: 국토지리정보원이 항공사진·정사영상·수치표고모델(DEM)·항공라이다 등 공간영상정보 구축 사업을 사업지구 단위로 나눠 관리하는 기준 목록으로, 사업지구코드별 지구명·사업명·사업년도·대표축척·사업종류·카메라·수치표고 격자간격을 담는다(전국 범위, CSV 약 41만 바이트). 공간정보 분석가나 측량·영상 사업자가 특정 항공사진이나 정사영상 도엽이 어느 연도·어느 사업에서 어떤 카메라와 축척으로 만들어졌는지 확인할 때 쓴다. 사업지구코드(aerial_project_district_cd)를 키로 낱장 항공사진, 도엽별 정사영상, 수치표고 성과물 메타데이터와 이어 쓴다.
description_portal: '항공사진을 비롯하여 정사영상, 수치표고모델(DEM), 항공라이다(LiDAR) 등 다양한 공간영상정보를 구축하는 사업에 대하여, 각 사업의 명칭과 더불어 실제 작업 수행의 효율성을 높이기 위해 분할·구획한 구축 지역의 구분 정보를 체계적으로 관리한다. 이와 같은 관리 체계는 모든 낱장의 항공사진, 도엽 단위로 제작된 정사영상, 도엽별 수치표고와 같은 성과물을 관리할 때의 기준이 되는 핵심 메타데이터로 활용되며, 결과적으로 공간영상정보의 품질 보증과 효율적 활용을 뒷받침하는 역할을 한다.▷ 식별정보 : 사업지구코드▷ 속성정보 : 사업명, 사업년도, 대표축척, 사업종류, 카메라코드(명), 카메라구분, 수치표고격자간격, 비고'
