summary_user: 대구광역시 서구에 등록된 옥외광고업체를 업체 한 곳씩 담은 현황 자료로, 등록번호·업소명·대표자 성명·영업장 도로명주소·종업원 수·기술 인력 사항을 포함하며 범위는 서구 한 시군구다. 서구에서 간판·옥외광고 제작을 맡길 등록 업체를 찾는 주민이나, 지역 옥외광고 사업장의 인력 규모와 기술 인력 보유 현황을 살피는 행정 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업장 도로명주소(BUZPLC_RDNMADR)나 업소명 매칭으로만 이어 쓴다.
description_portal: 대구광역시 서구_옥외광고업 현황의 등록번호, 업소 명, 성명, 영업장 도로명주소, 종업원 수, 기술 인적 사항 항목을 제공하는 서비스본 데이터는 대구광역시 서구청에서 관리하는 옥외광고업 현황을 수록한 자료이다. 각 옥외광고업체의 등록번호, 업소명, 대표자 성명, 영업장 도로명주소, 종업원 수 및 해당 업체 기술 인적 사항을 포함한다. 이를 통해 지역 내 옥외광고 관련 사업장의 인력 구성과 기술 자격 현황을 파악할 수 있으며, 관련 행정업무 지원과 산업현황 분석에 활용된다. 본 자료는 옥외광고업체의 투명한 관리와 정보 제공을 목적으로 개방한다.
