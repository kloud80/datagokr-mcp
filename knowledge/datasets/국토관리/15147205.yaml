summary_user: 전국 시군구별로 개발제한구역 안의 지목별 토지면적(대지·임야·전·답 등, ㎢)과 용도별 건축물 동수(단독주택·공동주택·근린생활시설·창고 등)를 정리한 집계 통계 파일이다. 지자체 도시계획 담당자나 분석가가 '우리 시군구 개발제한구역은 임야·농지 비중이 얼마이고 주택·창고가 몇 동 들어서 있는가'를 비교할 때 쓴다. 실측 컬럼에 행정코드 같은 전역 조인 키가 없어서, 다른 시군구 단위 데이터와는 시도·시군구 이름을 매핑해야 이어 쓸 수 있다.
description_portal: 개발제한구역 관리정보시스템 내 지자체별 관리계획으로 결정 및 변경되는 항목 내 별지서식으로 관리되고 있는 지목별 토지현황과 건축물현황을 정리한 데이터 입니다. 해당 데이터는 관리계획 수립(변경)이 완료된 시점마다 관할지역 시스템 담당자가 개발제한구역 관리정보시스템에 등록하여 자동으로 갱신되고 있으며, 공공데이터 포털에 제공되는 데이터는 현재 운영시스템 내 관리되고 있는 시군구별 지목에 대한 면적(㎢)과 건축물 현황(동수)을 작업자가 정제작업을 거쳐 통계자료로 제공하고 있습니다
