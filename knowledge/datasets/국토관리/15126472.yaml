summary_user: 신고된 단독·다가구 주택의 전월세 계약을 건별로 담으며 보증금·월세(만원), 계약기간, 연면적, 종전 계약 금액, 갱신요구권 사용 여부를 포함한다. 세입자나 임대인, 분석가가 특정 시군구·계약년월의 단독·다가구 전월세 시세가 어느 수준인지 확인하는 데 쓴다. 지역코드(sggCd, 법정동코드 앞 5자리)가 조인 키라서 같은 키를 쓰는 다른 실거래 API(매매·전월세 등)와 지역 단위로 이어 쓴다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료 및 「주택임대차보호법」에 따라 부여된 확정일자 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월 6자리(예시 : 201801)로 해당 지역, 해당 기간의 단독/다가구주택의 전월세 신고정보를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 단독다가구 전월세 실거래가 자료를 제공하는 단독다가구 전월세 실거래가 자료 조회. 세부사항 참고자료 참고.* 공개내용 중 개인정보보호를 위해 단독/다가구 주택의 지번정보는 일부만 제공합니다.'
