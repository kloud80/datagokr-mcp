description_portal: '수질오염총량관리제에서 배출부하량 산정을 위해서는 오염원별(생활계, 산업계, 축산계, 토지계, 매립계, 양식계) 발생유량을 산정하여야 합니다. 축산계 오염원 발생유량을 산정할 경우 수질오염총량관리 기술지침에서 제시하는 축종별(젖소, 한우, 말, 돼지, 양과사슴, 개, 가금) 사육두수에 발생유량 원단위(폐수, 고형물)를 곱하여 산정합니다. 축산계 발생유량 산정을 위한 축종별(젖소, 한우, 말, 돼지, 양과사슴, 개, 가금) 대상물질(BOD(생물학적산소요구량), TN(총질소), TP(총인)) 축산분뇨 발생유량원단위(폐수,고형물,합계)를 제공합니다.(단위 : g_두_일)'
