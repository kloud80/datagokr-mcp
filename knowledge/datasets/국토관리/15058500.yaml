summary_user: 국가가뭄정보센터의 시설별 운영정보 조회에 필요한 시설 코드(cd)와 시설 명칭, 시설분류코드를 담은 코드 목록으로, 용수댐·다목적댐·수위·강우·지하수관측소·취수장·정수장·행정동·공업단지·북한 시설·국외 GTS 관측소·기상관측소 등 16종을 전국 읍면동 단위까지 다룬다. 가뭄 운영정보 API를 호출하려는 개발자나 분석가가 '특정 댐이나 정수장의 가뭄 운영정보를 조회하려면 어떤 시설 코드를 넣어야 하나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 같은 기관(한국수자원공사) 가뭄 정보 API와 시설 코드로 연결하거나 다른 기관 데이터와는 시설 명칭 매핑으로 잇는다.
limits: 시설의 운영 수치(저수율·수위·강우량 등)는 담지 않는 코드표이며, 법정동·행정표준코드 같은 전역 키가 없어 외부 데이터와는 이름 매칭에 의존해야 한다. 호출에는 포털 활용신청 후 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
