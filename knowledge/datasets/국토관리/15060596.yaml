summary_user: 경기도 양평군 지역화폐인 양평통보 가맹점 가운데 추가 할인을 주는 우대가맹점을 업소 한 곳당 한 행으로 담은 csv 파일(약 15KB)이며, 상호명·할인율·주요업종·도로명주소·우편번호·기준일자를 담는다. 주민이나 방문객이 '양평에서 양평통보로 추가 할인을 받을 수 있는 음식점이 어디인가'를 찾거나, 분석가가 업종별 우대가맹점 분포와 할인율을 살펴 지역화폐 정책 효과를 가늠하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 도로명주소를 지오코딩하거나 상호명·주소를 맞춰 양평군 일반 가맹점·상가 정보 등과 이어 쓴다.
description_portal: 이 데이터는 경기도 양평군에서 발행하는 지역화폐인 양평통보 가맹점포 중 추가할인을 제공하는 우대가맹점 현황을 집계한 자료입니다. 항목은 업체명, 할인율, 업종, 주소, 우편번호, 기준일자 등으로 구성됩니다. 해당사업에 대한 관내 소상공인의 적극성, 참여도 등을 파악할 수 있으며 지역화폐 정책의 효과 평가, 소상공인 지원 방향 수립, 민간 소비 진작 전략 등에 근거 자료로 활용될 수 있습니다.본 데이터를 통해 업종별로 양평군 내 지역화폐(양평통보)를 추가 할인받아 사용할 수 있는 업소를 확인하고 주소 정보를 통해 방문해 지역화폐를 사용할 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 양평군청 일자리경제과로 연락주시기 바랍니다.
