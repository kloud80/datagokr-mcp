summary_user: 전라남도 신안군에 지정된 용도지역 현황을 도형 관리번호 단위로 담은 작은 CSV 파일(1,271바이트)로, 용도지역 구분(지역현황·지역현황상세)과 면적·길이·도형생성일자를 행마다 기록한다. 주민·사업자·분석가가 '신안군에 주거·상업·공업·농림 등 용도지역이 각각 얼마나 지정돼 있는가'를 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓸 조인 키(법정동코드·PNU 등)가 없어, 다른 시군구 용도지역 현황과는 용도지역 명칭을 맞추거나 기관 단위로만 이어 쓴다.
description_portal: 이 데이터는 전라남도 신안군의 용도지역 지정 현황을 수록한 자료로, 도시계획 및 토지이용 규제의 기초정보로 활용됩니다. 각 행정구역별로 지정된 용도지역의 분포와 면적, 용도 구분 등을 포함하고 있으며, 도시의 효율적인 공간 관리와 체계적인 개발을 위한 정책 수립에 유용합니다. 주요 항목으로는 황도형 관리번호, 지역현황, 지역현황상세, 면적, 길이, 도형생성일자 등 다양한 행정 절차에 참고자료로 제공됩니다. 특히 주거, 상업, 공업, 농림 등 용도별로 세분화된 정보를 통해 토지의 계획적 활용과 관리가 가능하며, 주민 민원 대응, 투자유치 검토, 도시관리계획 수립 등 실무에 폭넓게 적용할 수 있습니다.
