summary_user: 전국 산업단지를 국가·일반·도시첨단·농공단지 네 유형으로 나눠 유형별 단지 수, 지정·관리면적, 산업시설구역 면적·분양·미분양·분양률, 입주계약업체 수와 가동업체 수를 담은 집계표로, 507바이트짜리 작은 CSV 파일이다. 정책 담당자나 분석가가 '농공단지는 국가산업단지에 비해 분양률과 입주 대비 가동 업체 비율이 어느 정도인가' 같은 유형별 규모·입주 수준 비교에 쓴다. 전역 조인 키가 없어 다른 데이터와는 단지유형 이름을 맞춰서만 연결할 수 있다. 단지 원장이나 산업동향 통계와의 대조도 같은 방식이다.
description_portal: 본 요약 통계는 전국에 조성된 산업단지를 대상으로, 산업단지 유형별 현황과 운영 실태를 종합적으로 파악하기 위해 작성된 자료입니다. 통계는 「산업입지 및 개발에 관한 법률」에 따른 산업단지 분류 기준에 따라 국가산업단지, 일반산업단지, 도시첨단산업단지, 농공단지의 네 가지 유형으로 구분하여 집계하였습니다.요약본에는 각 산업단지 유형별로 단지 수, 지정면적, 관리면적, 산업시설구역 전체면적, 산업시설구역 분양면적, 입주계약업체 수, 가동업체 수 등 주요 핵심 지표가 포함되어 있습니다. 이를 통해 산업단지의 공간적 규모, 토지 이용 현황, 기업 입주 수준, 실질적인 가동 현황을 한눈에 파악할 수 있도록 구성하였습니다.먼저, 단지 수는 각 유형별로 지정·조성된 산업단지의 개수를 의미하며, 지정면적은 산업단지로 지정된 전체 면적을 나타냅니다. 관리면적은 실제로 관리기관이 관리·운영 중인 면적으로, 조성 완료 여부 및 단계별 개발 현황을 반영한 지표입니다.또한, 산업시설구역 전체면적은 산업단지 내에서 제조업 및 산업 활동을 위해 계획된 산업시설용지의 총면적을 의미하며, 산업시설구역 분양면적은 이 중 기업에 분양이 가능한 면적으로, 산업단지의 공급 여력과 토지 활용 가능성을 판단하는 데 중요한 기준이 됩니다.기업 활동과 관련된 지표로는 입주계약업체 수와 가동업체 수가 포함되어 있습니다. 입주계약업체 수는 산업단지 내 산업시설용지에 대해 입주 계약을 체결한 업체 수를 의미하며, 가동업체 수는 실제로 생산 활동을 수행하고 있는 업체 수를 나타냅니다. 두 지표를 함께 분석함으로써 산업단지의 입주 진행 수준, 가동률, 실질적인 산업활동 수준을 종합적으로 파악할 수 있습니다.본 전국 산업단지 요약 통계는 산업단지 정책 수립, 입지 분석, 산업 인프라 현황 파악 등 다양한 정책·행정적 활용을 위한 기초 통계 자료로서의 역할을 수행하며, 산업단지 유형별 특성과 구조적 차이를 비교·분석하는 데 유용한 정보를 제공합니다.
