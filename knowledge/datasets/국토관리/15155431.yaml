description_portal: 본 데이터는 한국토지주택공사가 각 사업지구에서 시행한 외부용역의 계약 현황을 정리한 목록으로, 용역명·계약일자·용역금액·공동계약 여부로 구성되어 있습니다. 주된 용역 유형은 지장물 기본조사 용역, 설계변경에 따른 추가 용역, 공공주택지구 조사 관련 용역 등이 포함되며, 사업지구별 조사·계획·설계 업무의 실제 집행 규모와 시기를 파악할 수 있습니다. 금액은 수천만 원부터 수십억 원대까지 다양하며, 대부분 단독계약(N) 형태로 이뤄졌습니다. 이를 통해 LH의 사업 추진 과정에서 필요한 외부 전문조사·설계업무가 어떤 프로젝트에 얼마의 비용으로 발주되었는지, 연도별·지구별 발주 패턴이 어떠한지 살펴볼 수 있는 기초자료 역할을 합니다.
