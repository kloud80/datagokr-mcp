summary_user: LH 마이홈포털의 기존 행복주택 단지·주택형별 목록으로, 전국 2,555행에 세대수·주택유형·준공일자·공급면적·임대보증금·월임대료·전환보증금 등을 담는다. 청년·신혼부부·고령자 등이 특정 지역에 어떤 행복주택 단지가 있고 보증금과 월임대료가 얼마인지 찾아볼 때 쓴다. 도로명주소(address)를 키로 삼아 전월세 실거래 등 주소 기반 주택 데이터와 이어 쓸 수 있고, 코드표는 따로 없다.
description_portal: 한국토지주택공사에서 위탁관리중인 마이홈포털의 기존 행복주택 정보로서 광역시도 및 시군구, 단지명, 세대수, 주택유형, 임대사업자, 공급면적(전용, 공용), 준공일자, 난방방식, 주차대수, 승강기 설치여부, 임대보증금, 월임대료, 전환보증금 등의 정보를 제공합니다. 행복주택은 대학생, 청년, 사회초년생, 신혼부부, 고령자 등 다양한 계층에 특화된 형태의 임대주택입니다. 계층 별로 서로 다른 입주자격, 임대조건, 거주기간 등이 적용되므로 자세한 사항은 LH 청약플러스(https://apply.lh.or.kr)에서 확인하시는 것을 권장드립니다. 본 데이터는 공급주체가 한국토지주택공사가 아닌 위탁 관리 중인 주택 정보를 포함하고 있으므로 유의하시기 바랍니다.
