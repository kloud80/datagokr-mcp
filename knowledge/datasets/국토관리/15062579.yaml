summary_user: 경상북도 경주시 관내 직물 생산 공장을 공장 한 곳당 한 행으로 정리한 파일로, 회사명·공장 도로명주소·대표업종번호·업종번호·업종명·생산품·주원자재를 담는다(CSV 약 1.8KB 규모의 소규모 목록). 지역 산업 분석가나 섬유 관련 사업자가 "경주시에 어떤 직물 공장이 어디에 있고 무엇을 어떤 원자재로 만드는가"를 확인하는 데 쓴다. 사업자번호·필지번호 같은 전역 조인 키는 없어서, 업종번호(업종 분류)나 회사명·도로명주소를 매칭해 팩토리온 공장등록 정보나 다른 시군구 공장등록 현황과 이어 쓴다.
description_portal: 본 데이터는 경상북도 경주시 관내에 소재한 직물 생산 공장의 현황을 정리한 파일 형태의 공공데이터이다. 직물 생산 공장은 섬유 원료를 가공하여 다양한 직물을 제조하는 산업 현장으로, 지역 경제 및 고용 창출에 중요한 역할을 담당한다. 데이터는 회사명, 공장도로명주소, 대표업종번호, 업종번호, 업종명, 생산품, 주원자재 등 주요 정보를 포함하고 있으며, 산업 정책 수립, 지역 경제 활성화, 산업 구조 분석 등에 활용 가능하다. 경주시는 데이터의 신뢰성 확보와 최신 정보 제공을 위해 정기적으로 갱신하며, 투명한 행정 운영을 위한 기초자료로 개방한다.
