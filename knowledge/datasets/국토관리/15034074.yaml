summary_user: 부산광역시 내 주요 하천 관측지점 20개소(동천교, 화명교, 온천천하류 등)의 수위를 지점별로 담는 API로, 현재 수위·일 최대수위·측정시간과 함께 단계별 경계 수위 기준과 수위 상태를 제공한다. 시민이나 재난 대응 담당자가 폭우·장마철에 "지금 우리 동네 하천 수위가 경계 단계에 가까운가"를 확인하는 데 쓴다. 실측 컬럼에서 전국 단위 조인 키는 확인되지 않아, 지점코드(siteCode)나 지점명을 기준으로 이름 매핑하거나 같은 기관 자료와만 연결할 수 있다.
limits: WAMIS 표준 관측소코드와 같은 전역 키가 확인되지 않아 홍수통제소·WAMIS의 전국 수문 자료와 바로 결합하기 어렵고, 지점명 매핑이 필요하다. 범위는 부산 내 20개 지점에 한정된다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
