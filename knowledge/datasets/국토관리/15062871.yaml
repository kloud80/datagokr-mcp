summary_user: 경기도 내 택지개발지구를 지구 단위로 한 행씩 담은 현황 자료로, 시군명·시군코드, 지구명, 면적, 계획 세대수, 수용인구, 사업기간, 시행자(LH·경기도시공사 등), 공사·보상 진행 상황(proplsn_stus)을 포함한다. 주택·도시계획 분석가가 "우리 시군에 진행 중인 택지지구는 어디이고, 계획 세대수와 수용인구는 얼마이며 보상·공사는 어디까지 진행됐나"를 확인하는 데 쓴다. 전역 조인 키는 없고, 시군명이나 시군코드(sigun_cd)를 행정구역 이름·코드에 매핑해 시군별 인구·주택 통계와 잇거나, 지구명으로 다른 택지·공공주택지구 자료와 대조하는 방식으로 연결한다.
description_portal: 본 데이터는 경기도 내 택지개발사업의 지구별 추진현황을 수록한 자료입니다. 주요 항목으로 시군명, 시군코드, 지구명, 면적, 세대수, 수용인구, 사업기간, 시행자, 추진현황 등이 포함되어 있으며, 각 택지개발지구의 면적과 계획된 세대수, 예상 수용인구, 시행기관 및 사업진행률 정보가 제공됩니다. 시행자 항목에는 LH, SH, 경기도시공사 등 사업 주관기관이 명시되며, 추진현황에서는 공사 및 보상 완료율을 확인할 수 있습니다. 본 데이터는 택지공급계획 수립, 도시 확장 및 인구 분산 정책, 주거복지 정책 마련, 공공사업 평가 등에 활용될 수 있으며, 활용 시 사업기간, 계획변경 이력 및 사업단계별 진척사항을 종합적으로 고려해야 합니다.
