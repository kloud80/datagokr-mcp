summary_user: 경기도가 추진한 생태하천 복원사업을 하천 단위로 정리한 현황 자료로, 하천명·소재 시군명·사업 길이(km)·사업구간 시점과 종점을 담는다. 지자체 담당자나 분석가가 "우리 시군에서 생태하천 복원이 이뤄진 하천과 구간 길이는 얼마인가"를 확인하거나 시군별 복원 실적을 비교하는 데 쓴다. 실측 컬럼에 하천코드 같은 전역 조인 키가 없어, 다른 하천 데이터와는 시군명·하천명(riverstrm_nm) 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 경기도에서 추진한 생태하천 복원사업의 현황을 정리한 자료로, 복원이 진행된 하천의 이름, 하천이 포함된 시군명, 사업 길이(km), 사업 시작 및 종료 지점에 대한 정보를 포함하고 있습니다. ‘사업구간시점’과 ‘사업구간종점’은 복원 대상 하천의 위치를 상세히 나타내며, 도심 속 하천환경 개선을 위한 실질적인 공간 정보를 제공합니다. 본 데이터는 하천 생태계 회복, 수질개선, 시민 휴식공간 확보 등을 목표로 한 환경복원 정책의 이행 현황을 파악하는 데 유용합니다. 또한 도시개발과 병행하여 친환경 인프라를 구축하려는 지방자치단체 및 정책 입안자들에게 공간 분석 자료로 활용될 수 있습니다.
