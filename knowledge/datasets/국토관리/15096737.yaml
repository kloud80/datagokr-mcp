summary_user: 강릉시 금학동 성남시장 안 상점별로 상호명, 운영시간, 업종구분, 도로명·지번주소, 전화번호, 위도·경도를 담은 건별 파일 데이터이며, 포털 설명상 전자도면(SHP)도 함께 제공된다. 시민·관광객이나 상권 분석가가 '성남시장에서 특정 업종 가게는 어디에 있고 몇 시까지 여는가'를 확인하거나 시장 내 상점 분포를 지도에 그릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 상호명 매칭, 또는 위도·경도를 이용한 공간 결합으로만 이어 쓴다.
description_portal: 강원특별자치도 강릉시 금학동에 위치한 성남시장 관련 데이터는 시장 내 상점의 상호명, 운영시간, 업종구분, 도로명주소, 지번주소, 전화번호, 위도·경도, 그리고 전자도면(SHP) 정보를 제공합니다.본 데이터는 2021년 기업매칭 지원사업으로 구축되었으며, 시장 상권 분석, 상점 위치 기반 서비스, GIS 지도 시각화, 지역경제 연구, 관광 안내, 편의 서비스 개발 등 다양한 행정·산업·연구 목적으로 활용할 수 있습니다.제공되는 SHP 파일은 QGIS, ArcGIS 등 GIS 소프트웨어에서 사용 가능하며, 지도 제작, 상점 분포 분석, 공간 기반 정책 수립 등 시각화와 공간 분석에 유용합니다.
