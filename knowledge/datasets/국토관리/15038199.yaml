description_portal: '한국수자원공사가 제공하는 다목적댐 부유물 수거현황 데이터는 댐 상류와 저수지에서 발생하는 부유물의 수거 실적을 정리한 자료입니다. 본 데이터는 각 댐마다의 발생량(톤), 수거처리비(백만원)으로 구성되어 있습니다. 해당 자료를 통해 부유물 관리 현황을 점검하고 대책 수립에 활용할 수 있으며, 연구자는 발생 원인과 계절적 특성을 분석하는 자료로 사용할 수 있습니다. 산업계는 댐 운영 및 수질 관리 계획에 참고할 수 있고, 공공기관은 환경 정책과 수생태 보전 활동의 근거 자료로 활용할 수 있습니다. 본 데이터는 댐 주변 환경 관리, 수질 개선, 수생태계 보전을 위한 기초 자료로 제공됩니다.*제공댐(20개) : 영주댐, 성덕댐, 보현산댐, 김천부항댐, 장흥댐, 보령댐, 부안댐, 주암댐, 섬진강댐, 군위댐, 밀양댐, 남강댐, 합천댐, 소양강댐, 충주댐, 횡성댐, 용담댕, 대청댐, 안동댐, 임하댐'
