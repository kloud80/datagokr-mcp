description_portal: '○ 통계개요* 통계명 : 주택재개발사업 추진실적* 통계종류 : 서울시 시행 주택재개발사업의 시행현황을 제공하는 일반ㆍ보고통계* 근거법령 :「도시 및 주거환경정비법」에 의한 주택재개발사업* 작성목적 : 서울시에서 시행하는 주택재개발사업 진행 현황를 파악하여, 토지의효율적 이용과 도시 및 주거환경 개선을 위한 기초 자료를 제공하는 것을목적으로 함* 조사체계 : 자치구 → 서울특별시 주거재생과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 서울시 주택재개발사업의 진행상황별(완료, 시행중, 미시행)구역수 및 시행면적, 정비건축물(동), 건립가구 등○ 용어설명* 주택재개발사업 : 정비기반시설이 열악하고 노후ㆍ불량건축물이 밀집한 지역에서 주거환경을 개선하기 위하여 시행하는 사업- 완료 : 당해연도의 준공인가된 구역- 시행중 : 당해연도에 사업시행인가 또는 관리처분 계획인가된 구역- 미시행 : 당해연도에 정비구역으로 지정된 구역○ 기 타* 뉴타운사업의 주택재개발사업 실적은 제외된 수치임'
