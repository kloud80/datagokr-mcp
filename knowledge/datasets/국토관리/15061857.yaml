summary_user: 경기도 포천시 도시계획위원회의 심의 운영 현황을 연도·위원회별로 집계한 파일로, 심의회 개최 횟수와 총안건, 원안·조건부·수정 수용, 재심의, 자문, 유보, 부결 건수를 담는다(약 3KB 규모의 작은 CSV). 포천시에서 해마다 도시계획위원회 안건이 얼마나 원안대로 통과되고 얼마나 조건부 수용이나 재심의·부결로 처리되는지 살펴보려는 분석가나 주민의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 위원회 이름을 맞추거나 같은 포천시 자료끼리만 이어 쓸 수 있다.
description_portal: 경기도 포천시 도시계획위원회 전자심의시스템에서 제공하는 도시계획위원회 심의현황 데이터입니다. 본 데이터는 연도, 위원회, 심의회, 총안건, 원안수용, 조건부수용, 수정수용, 재심의결정, 자문, 유보, 부결, 데이터기준일 등의 항목으로 구성되어 있으며, 연도별 도시계획위원회 심의 운영 현황과 안건 처리 결과를 제공합니다. 이를 통해 위원회별 심의 실적과 안건 처리 유형, 연도별 심의 추이 및 운영 현황을 분석할 수 있으며, 도시계획 정책 수립, 행정 운영 현황 분석, 위원회 운영의 투명성 제고 및 정책 연구를 위한 기초자료로 활용할 수 있습니다. 또한 연도, 위원회 구분 등의 정보를 활용하여 도시개발, 건축, 인허가 등 관련 공공데이터와 연계·분석을 위한 자료로 활용할 수 있습니다.
