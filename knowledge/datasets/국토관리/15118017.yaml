summary_user: 국가상수도 정수시설의 운영 현황을 연도·수도사업자 단위로 집계한 소규모 CSV 파일(약 1.8KB)로, 정수시설 개소수·설계 시설용량·연간 처리수량과 생산량·일평균/일최대 생산량·이용률·가동률·일첨두율·단위생산량당 전력사용량을 전국 범위로 담는다. 수자원 정책 분석가나 연구자가 "한국수자원공사 정수장의 설계용량 대비 실제 생산량과 이용률은 해마다 어떻게 달라지고, 물 1㎥ 생산에 전력이 얼마나 드는가"를 따질 때 쓴다. 전역 조인 키가 없어서 다른 상수도 데이터와는 연도(년도)와 수도사업자 이름을 맞춰 붙여야 한다.
description_portal: 본 데이터는 한국수자원공사에서 관리하는 국가 상수도 정수시설의 현황을 제공한다. 전국 각 지역의 정수시설 개소수, 설계 시설용량, 연간 처리수량과 생산량, 일평균 및 최대 생산량 등의 운영 정보를 포함하며, 정수장 이용률과 가동률, 생산량 일첨두율, 단위생산량당 전력사용량 등 운영 효율성과 관련된 다양한 지표도 함께 수록되어 있다. 이를 통해 지역별 정수시설의 처리능력, 운영 실태, 에너지 효율성을 종합적으로 파악할 수 있으며, 상수도 정책 수립, 수자원 관리계획 수립, 정수장 성능 진단 등에 활용 가능하다. 데이터는 체계적으로 정리되어 있어 시계열 분석 및 정책평가, 학술연구 자료로서도 활용가치가 매우 높다.
