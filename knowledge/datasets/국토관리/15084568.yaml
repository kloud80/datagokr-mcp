description_portal: '해당 데이터는 서울시 하천수위 관측 데이터입니다.ㅇ 서울시 하천수위 : 20개소ㅇ 제공기간 : 지점별 최초관측시기~2021년 (5월15일~10월15일)ㅇ 참고사항 : 본 자료는 홍수, 태풍 등 기상현상에 따른 자연재해를 막기 위한 목적으로 하천수위관측소에서 송신한 원시자료로써 보정하지 않은 자료입니다. 측정기기의 오작동, 자치구 운영환경 등으로 인해 자료에 오차가 있을 수 있으며, 특히 수방기간(5.15~10.15) 이외에는 시설 점검 및 내부공사 등으로 자료 수집이 부정확할 수 있습니다. 해당 자료 사용 시 이 점을 참고하시기 바랍니다.'
