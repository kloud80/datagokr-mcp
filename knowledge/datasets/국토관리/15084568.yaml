summary_user: 서울시 하천수위관측소 20개소에서 송신한 수위 원시자료를 관측소명·시간별로 담은 건별 관측 파일이며, 지점별 최초 관측 시기부터 2021년까지 수방기간(5월 15일~10월 15일) 자료를 zip 파일로 제공한다. 서울 시내 하천의 과거 홍수기 수위 변화를 살펴보려는 분석가가 '특정 관측소 수위가 호우 때 얼마나, 언제 올랐나'를 확인하는 데 쓴다. 실측 컬럼에 관측소코드 같은 전역 조인 키가 없어, WAMIS 표준 관측소 자료나 강수 관측 자료와는 관측소명 매핑으로만 이어 쓴다.
limits: 보정하지 않은 원시자료라 기기 오작동이나 자치구 운영환경에 따른 오차가 있을 수 있고, 수방기간 밖의 자료는 시설 점검·공사로 부정확할 수 있다. 관측소코드가 없어 다른 수문 데이터와 결합하려면 관측소명을 직접 대조해야 한다.
