summary_user: K-water가 관리하는 다목적댐·용수댐과 보의 제원을 시설 1건당 한 행으로 담은 전국 단위 파일(CSV 약 6KB)로, 형식·높이·길이·유역면적·저수면적, 계획홍수위·상시만수위·홍수기제한수위 같은 기준 수위, 총·유효·홍수조절 저수용량, 연간용수공급량, 사업 기간을 담는다. 분석가나 연구자가 "이 댐의 유효저수용량과 홍수조절용량은 얼마이고, 현재 수위가 홍수기제한수위에 얼마나 가까운가"를 따질 때 기준값으로 쓴다. 전역 조인 키나 댐코드 컬럼은 없어 댐 수위·방류량 같은 운영 데이터와는 댐이름이나 하천명을 맞춰 연결해야 한다.
description_portal: 'ㅁ 개     요 :  K-water에서 관리중인 댐(다목적댐, 용수댐) 및 보의 제원정보 입니다.* 2024년 12월까지 변동사항 없습니다.본 데이터는 한국수자원공사가 관리하는 댐·보 등의 수문 구조물 정보를 체계적으로 제공합니다. 댐 형식과 위치, 높이 및 길이, 저수용량(총·유효), 정상표고, 홍수조절용량, 유역면적, 저수면적, 월류정표고 등의 항목을 포함합니다. 데이터 활용을 위한 세부 이용 예시를 함께 제공합니다. 본 데이터는 수문 분석, 용수 수요 예측, 홍수 위험도 평가, 수자원 정책 수립 등 다양한 연구 및 실무에 활용할 수 있습니다.ㅁ 제공항목   * 형식  * 높이[m]  * 길이[m]   * 정상표고 [EL.m]   * 체적[㎥]   * 유역면적[㎢]   * 저수면적[㎡]   * 계획홍수위[EL.m]   * 상시만수위[EL.m]   * 홍수기제한수위[EL.m]  * 월류정표고[EL.m]  * 저수위[EL.m]   * 총저수용량[㎥]   * 유효저수용량[㎥]   * 홍수조절용량[㎥]ㅁ 보유기간 : 매년 업데이트ㅁ 제공형식 :파일(XLS, CSV), 오픈API(XML, JSON)'
