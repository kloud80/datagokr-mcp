limits: 6개 오퍼레이션 중 실호출에 성공한 것은 1개이며, 동별·층별·호별개요와 부대시설 오퍼레이션은 최소 파라미터로는 응답이 없어 추가 조회 조건이 필요하다. 검증 호출에서 1건만 받은 것은 호출 조건 때문일 수 있어 전체 규모로 해석하지 않는다. 개발계정은 하루 10,000회로 제한된다.
