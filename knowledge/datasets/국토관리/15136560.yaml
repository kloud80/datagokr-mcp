description_portal: '주택건설사업계획승인 정보 개요본 API는 주택건설사업계획승인과 관련된 다양한 속성 정보를 제공합니다. 주요 제공 항목은 다음과 같습니다:기본개요: 사업의 일반 정보동별개요: 각 동(Building) 단위의 상세 정보층별개요: 층별 구성 및 용도 정보호별개요: 세대별 세부 정보부대시설: 커뮤니티, 관리시설 등 부대시설 현황오수정화시설: 오수처리 관련 설비 정보주차장/부설주차장: 주차장 및 부설주차장 배치 및 용량 정보전유공용면적: 전유 및 공용 면적 세부 내역행위호 전유·공용면적: 개별 행위(호) 기준의 면적 정보행위개요: 건축 행위별 개요 정보관리공동형별개요: 관리단위별 공동주택 정보관리공동 부대복리시설: 관리 대상 복리시설 정보지역·지구·구역 정보: 해당 대지의 도시계획 관련 지정 정보복리분양시설: 분양 대상 복리시설 내역대지위치: 건축물 위치 정보 본 API에서 제공하는 데이터는 기존 ‘건축데이터 민간개방시스템’에서 제공하던 유형별 건축데이터와 구조적으로 유사하나,현재는 **‘건축서비스산업 정보체계(건축HUB)’**를 통해 통합 제공되며, 이에 따라 건축데이터의 기본키(PK) 체계가 변경되었습니다.'
