summary_user: 지방하천 하천범람 지도를 바탕으로 수자원단위지도 중권역별·재현빈도별(50·80·100·200년) 침수면적(km²)을 침수심 5단계(0.5m 이하부터 5.0m 초과까지)로 나눠 담은 집계 통계로, 범위는 전국이며 좌표 없는 비공간 데이터다. 지자체 방재 담당자나 분석가가 '우리 중권역에서 100년 빈도 홍수 때 지방하천이 넘치면 2m 넘게 잠기는 면적이 얼마인가'를 확인하거나 권역 간 침수 규모를 비교하는 데 쓴다. 대권역·중권역 코드(bbsnCd, sbsnCd)가 있으나 실측에서 전역 조인 키로 확인되지 않아, 다른 데이터와는 권역 이름·코드 매핑이나 같은 기관(한강홍수통제소)의 권역 코드 기준으로 맞춰 이어 쓴다.
description_portal: 환경부 한강홍수통제소에서 제공하는 홍수위험지도 중 지방하천 하천범람 지도를 기반으로 장마철 갑작스럽게 내리는 국지적 집중호우·돌발호우 등으로 유발되는 하천범람 결과의 5단계로 이루어진 침수심별(0.5m 이하, 0.5~1.0m, 1.0~2.0m, 2.0~5.0m, 5.0m 이상) 침수면적(km² 단위) 통계 데이터를 유역별(수자원단위지도의 중권역 단위), 빈도별(50년, 80년, 100년, 200년)로 구분하여 침수면적 통계 데이터를 조회할 수 있는 서비스 입니다. 사용자는 이러한 침수면적 통계 데이터를 통해 해당 지역의 하천범람으로 인한 침수 규모의 정도를 판단할 수 있습니다.
