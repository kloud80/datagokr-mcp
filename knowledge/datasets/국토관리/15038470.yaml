summary_user: 세종특별자치시에 있는 컴퓨터·스마트폰 정보화교육장을 교육장 1곳당 1행으로 담은 목록 파일로, 교육장명·도로명주소·위도·경도·교육대상·수용인원·문의처·데이터기준일을 담는다(포털 설명 기준 6개소, CSV 785바이트). 세종시민이나 고령층·장애인 가족이 "집 근처에서 스마트폰 교육을 받을 수 있는 곳과 정원, 문의 전화는?"을 찾을 때나, 정보화 교육 시설이 지역별로 어떻게 배치됐는지 볼 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 도로명주소나 위도·경도로 위치를 맞춰 잇거나, 교육장명으로 직접 대조해 쓴다.
description_portal: 세종특별자치시에 있는 정보화교육장(컴퓨터,스마트폰 교육장 현황)입니다.데이터는 교육장명, 도로명주소, 위도, 경도, 교육대상, 수용인원, 문의처, 데이터 기준일로 구성되어 있으며데이터기준일 현재 세종특별자치시 정보화교육장은 총 6개소로종촌동 정보화교육장, 조치원 정보화교육장, 소담동 정보화교육장, 세종시장애인복지관, 한국언어심리협회, 세종특별자치시청 전산교육장이조치원읍, 소담동, 대평동, 보람동에 소재하고 있으며 교육대상은 세종시민, 장애인, 고령층, 공무원 등입니다.
