summary_user: 취수장·정수장·가압장 시설별 압력(kg/㎠)을 1시간 단위 순시값으로 담은 시설·시각별 원천 API이며, 검증 호출에서 API 전체 153건, 수신 177행(전국)이 확인됐다. 상수도 운영 분석가나 관리자가 누수 가능성 진단, 관망 이상 탐지, 설비 유지보수 계획에 쓴다. 필수 파라미터 시설구분코드(fcltyDivCode)는 다른 데이터의 코드라 먼저 받아 넘겨야 하고, 사업장코드(sujCode)·시설관리번호(fcltyMngNo)로 같은 기관 데이터와 연결한다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 검증 호출은 2015-11-19 하루 조건(stDt, edDt)이라 최신 행 날짜가 오래돼 보이지만 데이터 자체의 최신성과는 다를 수 있다. 호출 전에 fcltyDivCode를 제공하는 다른 데이터에서 코드를 먼저 받아야 한다.
