description_portal: '본 서비스는 한국수자원공사가 제공하는 공공데이터로서, 실시간 수도정보 중 압력 항목을 1시간 단위로 조회할 수 있도록 지원하는 서비스입니다. 본 데이터는 누수 가능성 진단, 관망 이상 탐지, 설비 유지보수 계획 수립, 장기적 운영 효율성 개선 등 다양한 실무 현장에서 직접적으로 활용할 수 있습니다. 이를 통해 민간 및 공공기업에서 연구와 정책 수립에 활용할 수 있습니다.ㅁ 제공지점 : 취수장, 정수장, 가압장ㅁ 제공항목 : 시설별 압력[kg/㎠], 관리번호, 태그SN, 태그설명, 데이터항목구분(M)  * 관리번호, 태그SN, 태그설명 : 측정항목의 고유값(내부관리용)  * M : 순시값, 정시기준 측정된 실시간 압력[kg/㎠]'
