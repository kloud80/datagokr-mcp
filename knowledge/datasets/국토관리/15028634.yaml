summary_user: 충청남도 홍성군 안에서 시공 중인 공동주택을 공사 현장 한 곳당 한 행으로 담은 파일로, 공사명·공사기간 시작과 종료·현장주소·세대수·시공사명·연락처를 담으며 파일 크기는 550바이트로 현장 수가 매우 적은 소규모 목록이다. 홍성군 주민이나 지역 주택시장 분석가가 '지금 홍성군에서 짓고 있는 아파트는 어디이고, 몇 세대가 언제 준공 예정인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 현장주소를 주소·좌표로 변환하거나 공사명·시공사명을 이름으로 맞춰 홍성군 인허가·분양·준공 자료와 이어 쓴다.
description_portal: 본 데이터는 충청남도 홍성군 내 현재 시공 중인 공동주택의 현황을 제공합니다. 데이터에는 공사명, 공사기간 시작, 공사기간 종료, 현장 주소, 세대수, 시공사명, 전화번호 등이 포함되어 있어 공사 현장별 진행 상황과 시공사 정보를 상세히 확인할 수 있습니다. 이 자료는 주택 건설 현황 파악 및 공사 관리, 지역 주택 공급 계획 수립을 위한 기초 자료로 활용됩니다.
