summary_user: 강릉시 건축물 중 기타용도에 '다가구주택' 또는 '오피스텔'이 들어간 건물을 건물 단위로 뽑은 파일로, 주소·주용도·대지면적·건축면적·연면적·세대수·지상층수를 담는다. 강릉에서 원룸이나 오피스텔 임대 사업을 검토하는 사업자, 또는 시내 원룸·오피스텔 공급 분포를 보려는 분석가가 "어느 동네에 다가구·오피스텔 건물과 세대가 몰려 있나"를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 주택·건축물 데이터와는 대지위치주소를 주소 정제·매칭해 연결해야 한다.
description_portal: "공공데이터 제공 신청 건으로, 강원특별자치도 강릉시의 원룸(다가구주택) 및 오피스텔 현황 데이터입니다.※ 본 데이터는 기타용도내용 항목에 '다가구주택' 또는 '오피스텔'이 포함된 항목을 추출한 자료입니다.본 데이터는 10개 항목(컬럼)으로 구성되며, 각 항목의 설명은 다음과 같습니다.시군구명: 자치단체명 (강원특별자치도 강릉시)대지위치주소: 건물의 상세 주소주용도코드명: 건물의 주 용도 (예: 단독주택, 업무시설)기타용도내용: 건물의 기타 용도 (예: 다가구주택(3가구), 오피스텔)대지면적: 대지 면적 (m²)건축면적: 건축 면적 (m²)연면적: 총 건물 면적 (m²)세대수: 총 세대 수지상층수: 지상 층 수주용도코드명: 층별 주 용도 (예: 다가구주택)"
