summary_user: 안산시 관내에서 기계설비법상 기계설비 유지관리자 선임신고 대상이 되는 건축물을 건물(필지) 단위로 정리한 파일로, 대장 종류·법정동·본번·부번·연면적·용도와 연면적 기준 구간(구분)을 담는다. 설비공사업체나 설계사무소, 담당 공무원이 '안산시에서 연면적 1만㎡ 이상이라 기계설비 기술자를 선임해야 하는 건물은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 건축물대장 자료와는 시군구명·법정동명·본번·부번을 이름이나 지번 매핑으로 맞춰 연결해야 한다.
