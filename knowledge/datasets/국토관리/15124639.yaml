description_portal: 이 정보는 안산시 관내 기계설비법에 따라 선임신고 대상이 되는 건축물에 대한 현황을 정리한 자료입니다. 총 449건의 기록이 포함되어 있으며, 항목으로는 순번, 대장종류, 시군구명, 법정동명, 대지구분, 본번, 부번, 연면적, 용도, 구분이 포함되어 있습니다. 해당 정보는 일정 연면적 이상의 건축물 중 기계설비 기술자가 선임되어야 하는 건축물에 대한 것으로, 주로 교육연구시설, 의료시설, 공장, 업무시설 등 대규모 시설이 대상입니다. 연면적 항목은 평방미터 기준으로 제공되며, 구분 항목을 통해 '연면적 10,000 이상~15,000 미만'과 같은 기준별 분류가 가능하도록 구성되어 있습니다. 이 정보는 기계설비법 이행 여부 점검, 건축허가 사전 검토, 기계설비 안전관리 정책 수립 등 행정적 활용뿐 아니라, 설비공사업체나 설계사무소 등 민간에서도 기계설비 대상 건축물 파악 및 업무 계획 수립에 참고하실 수 있습니다.
