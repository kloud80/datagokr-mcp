summary_user: 여수시에서 사람이 실제로 사는 섬(유인도서)을 섬 한 곳당 한 행으로 담은 작은 현황표(CSV 약 2KB)로, 행정구역·읍면동·도서명과 면적(㎢)·가구·인구가 들어 있다. 여수시 도서정책이나 연안여객항로를 검토하는 행정기관·분석가가 "어느 면에 사람이 사는 섬이 몇 곳이고, 섬별 인구와 가구는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름이나 도서명을 맞춰 붙여야 한다.
description_portal: 전라남도 여수시 유인도서 현황에 대한 데이터로 행정구역, 읍면동, 도서명, 면적, 인구등의 항목 정보을 제공합니다.                                                                                                                                                                                                                                                                                                                                                                                                                      여수시 유인도서(사람이 실제로 거주하는 섬)의 현황을 시민이나 관계기관에 정확하고 보기 쉽게 제공기준일은 2024년 12월 31일 행정안전부에서 관리하고 있는 우리시 유인도서 현황을 시민 관광객 행정기관 등에 제공하여 도서정책 수립 교통편의 개선 연안여객항로 운영등에 활용하고자 함현재 여수시는 365개 도서 중 45개(행정리 기준 사웆 인구 존재 섬을 정리하고 무인도서는 약 320여개정도로주요지역은 화정면 남면 산삼면 돌산읍 율촌면등으로 분포되어 있음
