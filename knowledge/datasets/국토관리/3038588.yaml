description_portal: 「국토의 계획 및 이용에 관한 법률」에 의한 모든 국토의 용도지역·지구·구역, 도시계획시설등에 대하여 도시계획현황 통계책자를 매년 발간하여, 도시행정, 도시정책, 도시연구 및 개발 도시계획 분야에 필요한 기초자료를 제공합니다. 해당 자료는 지자체가 관리하는 용도지역, 성장관리계획구역, 개발행위허가, 도시군계획시설 현황 등을 매년 집계하여 공표하는 국가승인통계로 도시정책 수립 등에 활용하며, 전년도 자료를 차년도 7~9월 경 갱신하여 제공합니다. 본 자료는 위 절차에 따라 공표된 데이터를 토지이음을 통해 파일로 제공하고 있습니다.
