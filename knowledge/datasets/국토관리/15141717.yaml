summary_user: 한강홍수통제소의 도시침수 지도를 바탕으로 중권역 단위 유역별·재현빈도별(30·50·80·100년) 침수면적(km²)을 침수심 5단계(0.5m 이하부터 5.0m 초과까지)로 나눠 담은 집계 통계로, 범위는 전국입니다. 지자체 방재 담당자나 분석가가 '우리 유역에서 100년 빈도 호우가 오면 1m 넘게 잠기는 면적이 얼마인가'처럼 도시침수 규모를 가늠하는 데 쓴다. 대권역·중권역 코드(bbsnCd, sbsnCd)가 있으나 실측상 전역 조인 키는 없어, 수자원단위지도 권역 코드표나 같은 기관의 다른 서비스와 코드·이름 매핑으로 연결한다.
limits: 침수 지도 기반 시나리오 통계라 실제 침수 발생 기록이나 실시간 예보가 아니며, 한 번 생성된 뒤 바뀌지 않는 이벤트성 데이터다. 행정구역이 아닌 유역 단위의 비공간 집계라 시군구별 면적이나 위치(좌표)는 알 수 없고, 행정 데이터와 잇려면 별도 매핑이 필요하다.
