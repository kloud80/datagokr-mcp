summary_user: 충청남도 도시계획정보(UPIS)에 등록된 개발행위허가제한지역을 도형(구역) 한 건씩 담은 작은 파일(csv 약 1KB)로, 도형 관리번호·라벨명·면적(제곱미터)·둘레 길이(미터)를 담는다. 토지 매입이나 개발사업을 검토하는 사업자·분석가가 충남에서 어떤 개발행위허가제한지역이 지정돼 있고 각각 규모가 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 라벨명(구역 명칭)을 이름으로 맞추거나 같은 기관(충청남도)의 UPIS 데이터와만 연결한다.
