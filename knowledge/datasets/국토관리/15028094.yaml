summary_user: 대전광역시 대덕구에 등록된 제조업 공장을 한 곳씩 담은 목록으로, 공장마다 산업분류번호·업체명·공장 도로명주소·주생산품·데이터기준일자가 들어 있다. 대덕구에 어떤 업종의 공장이 어디에 몰려 있는지, 특정 생산품을 만드는 관내 업체가 어디인지 찾는 사업자·분석가·행정 담당자가 쓴다. 실측 컬럼에 사업자번호·필지번호 같은 전역 조인 키가 없어서, 다른 데이터와는 업체명·도로명주소를 맞추거나 산업분류번호를 표준산업분류 코드표와 대조해 이어 쓴다.
description_portal: 본 데이터는 대전광역시 대덕구에 등록된 제조업공장의 현황을 제공하는 공공데이터입니다.데이터에는 산업분류번호, 업체명, 소재지, 생산품 등 주요정보가 포함되어 있습니다.해당자료는 관내 제조업공장업체의 분포와 등록 실태를 파악하는 데 활용되며, 공장 및 산업 관련 정책 수립과 행정업무의 기초자료로 사용됩니다.민간분야에서는 입찰 참여 시 업체 비교, 사업계획 수립, 지역 내 시장 조사 등의 용도로 활용할 수 있습니다.정기적으로 갱신되는 본 데이터는 최신 정보를 반영하여 행정의 투명성과 효율성을 높이는 데 기여합니다.
