summary_user: 충청남도에서 공사가 중단된 일반 건축물을 한 건씩 적은 파일 목록으로, 위치·허가년도·구조·동수·용도·공정률·중단기간(개월)을 담는다(포털 설명상 2022년 12월 31일 기준, 파일 크기 약 2.6KB의 소규모 자료). 시·군 건축·안전 담당자나 지역 분석가가 "우리 지역에 오래 방치된 미완공 건물이 어디에 몇 동 있고 공정률은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건축물대장 등 다른 데이터와는 위치(주소) 문자열을 매칭하는 방식으로만 이어 쓴다.
limits: 건물관리번호·법정동코드 같은 공통 키가 없어 다른 건축물 데이터와 바로 결합할 수 없고, 주소 텍스트 매칭에 의존해야 한다. 충청남도 한 시도 범위의 비공간 자료라 좌표 기반 지도 분석이나 타 시도와의 비교에는 별도 자료가 필요하다.
