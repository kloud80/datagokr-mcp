summary_user: 광주광역시에 있는 제조업체를 한 업체당 한 줄로 담은 2023년 기준 목록이며, 업종·업체명·도로명 소재지·주생산품·종업원 수·전화번호(일부)를 싣는다. 지역 협력업체나 납품처를 찾는 사업자, 또는 광주의 업종별 제조업체 분포와 고용 규모를 살피는 분석가가 '광주에서 이 품목을 만드는 업체는 어디이고 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키(사업자번호·산업분류코드·필지번호)는 없어서, 공장등록 정보나 기업 데이터와는 업체명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 광주광역시 소재의 제조업체 목록입니다.(2023년 기준)  개별 제조업체에 대하여 업종, 업체명(한국표준산업분류코드 기준), 소재지(도로명 주소), 주 생산품, 종업원 수,전화번호(일부)의 순으로 내용을 제공합니다.※ 광주광역시청 홈페이지에서도 제공하고 있습니다.https://www.gwangju.go.kr/economy/boardList.do?pageId=economy45&boardId=BD_0000000531&movePage=1
