summary_user: 건축물대장의 기본개요·총괄표제부·표제부·층별개요·전유공용면적·주택가격 등 속성정보를 필지·건물 단위 건별 원천으로 담으며, 범위는 전국이고 검증 기간은 2008-01-01부터 2026-08-25까지다. 특정 지번이나 도로명 주소 건물의 주용도·구조·연면적·건폐율·용적률·층수·세대수를 확인하려는 매수 예정자, 중개사, 부동산·도시 분석가가 쓴다. 시군구코드(sigunguCd)가 실측 조인 키이고 법정동코드·번·지로 필지를 특정하므로 공시지가·토지대장 같은 다른 국토 원장 데이터와 이어 쓰며, 대장구분·대장종류·주용도·구조·지붕 코드는 코드표로 뜻을 풀어 쓴다.
description_portal: '건축물대장에서 관리하고 있는 기본개요, 총괄표제부, 표제부, 층별개요, 부속지번, 전유공용면적, 오수정화시설, 주택가격, 전유부, 지역지구구역 등 속성정보를 제공합니다.* 데이터 포맷 요청변수 : &_type=xml or &_type=json (생략 시 xml로 기본 제공)기존 ‘건축데이터 민간개방시스템’에서 제공하던 유형별 건축데이터 정보를 ‘건축서비스산업 정보체계(건축HUB)’에서 서비스 제공함에 따라 건축데이터 PK가 변경이 되었습니다.이에 따른 기존 건축데이터 PK 전환 규칙을 첨부파일로 제공해 드리오니 참고하여 주시기 바랍니다.'
