summary_user: 충청남도 당진시 관내 산업단지에 입주한 기업을 한 행에 한 업체씩 담은 명단 파일로, 단지명·회사명·업종명·공장 주소·전화번호·데이터 기준일을 담는다. 구직자나 영업 담당자가 '당진의 어느 산업단지에 어떤 업종의 회사가 들어와 있고 연락처는 무엇인가'를 확인하거나, 분석가가 단지별 업종 구성을 파악하는 데 쓴다. 전역 조인 키(사업자번호 등)가 없어 공장 등록 현황이나 산단 통계와는 단지명·회사명 문자열 매칭이나 같은 기관(당진시) 기준으로만 이어 쓴다.
description_portal: '충청남도 당진시 산업단지 입주 기업 현황 안내(데이터 기준일자: 2026년 7월 2일)충청남도 당진시는 지역 산업 활성화와 기업 지원 행정의 효율화를 위해 산업단지 입주 기업 현황을 체계적으로 관리하고 있습니다.본 자료는 당진시 관내 산업단지에 입주한 기업의 현황을 정리한 것으로, 다음 항목들을 포함하고 있습니다:연번단지명회사명업종명도로명주소지번주소전화번호데이터 기준일본 자료는 산업단지 운영 현황 파악, 입주기업 지원 정책 수립, 입지 정보 분석,기업 유치 전략 마련, 대시민 정보 제공 등 다양한 행정 및 공공 목적에 활용될 수 있습니다.'
