description_portal: '경상남도 창원시의 빈집 현황 데이터로 47개의 행정동별 빈집 개수와 빈집 상태에 따른 빈집 등급별 빈집 개수 정보를 제공합니다.창원시 내 빈집 등급은 1등급 482호(49.7%), 3등급 256호(26.4%), 2등급 202호(20.8%), 4등급 29호(2.9%) 순으로 1등급 빈집이 가장 많음."빈집"이란 : 거주 또는 사용여부를 확인한 날로부터 1년 이상 아무도 거주 또는 사용하지 않는 주택빈집 등급은 노후도 및 불량 상태, 주변에 미치는 영향 정도 등을 고려하여 1~4등급으로 구분됩니다.상태가 비교적 양호한 1~2등급은 정비를 통해 활용을 유도하고, 붕괴·화재·범죄 발생 우려가 높은 3~4등급은 철거 및 안전조치가 필요한 상태입니다.자세한 내용은 빈집 및 소규모주택 정비에 관한 특례법 참고'
