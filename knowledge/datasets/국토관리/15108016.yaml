summary_user: 경상북도 포항시 안에서 분양·임대되지 않고 남은 공동주택을 사업장·주택규모별 행 단위로 담은 파일(CSV, 약 32KB)입니다. 각 행에는 소재지, 시행사·시공사, 공공/민간 및 임대/분양 유형, 전용면적 규모, 총분양가구수, 전월·당월 미분양 수, 준공(예정)일과 준공여부, 택지종류가 들어갑니다. 실수요자나 분석가가 '포항 어느 단지에 미분양이 얼마나 남았고 지난달보다 줄었는지, 준공은 됐는지'를 확인하는 데 쓰고, 공통 조인 키가 없어 다른 주택 공급·실거래 자료와는 지역명·소재지·지구명을 이름으로 맞춰 연결해야 합니다.
description_portal: 미분양 공동주택 데이터는 지역 내 주택 공급 이후 분양 또는 임대되지 않고 남아 있는 주택의 현황을 체계적으로 제공하기 위한 자료이다. 본 데이터에는 시행사, 공공 및 민간 유형, 임대 및 분양 유형, 규모별(제곱미터), 총분양가구수, 준공예정일, 준공여부, 택지종류 등의 항목이 포함되어 있으며, 미분양 주택의 공급 구조와 사업 특성을 종합적으로 파악할 수 있도록 구성되어 있다. 시행사 항목은 사업을 추진하는 주체를 확인할 수 있는 정보이며, 공공 및 민간 유형은 사업의 공급 주체 성격을 구분하는 기준으로 활용된다. 또한 임대 및 분양 유형은 주택 공급 방식과 시장 내 유통 형태를 파악하는 데 중요한 자료가 되며, 규모별 면적 정보는 수요 계층별 주택 공급 특성과 주거 선호도를 분석하는 데 활용될 수 있다. 총분양가구수는 사업 규모와 전체 공급 물량을 보여주는 핵심 지표이며, 준공예정일과 준공여부를 통해 사업의 진행 단계와 실제 입주 가능 시기를 확인할 수 있다. 택지종류는 사업 부지의 조성 유형과 입지 특성을 파악하는 데 활용되며, 지역별 주택정책 수립과 공급계획 검토의 기초자료로 기능한다. 이 자료는 미분양 추이 분석, 주택시장 안정화 정책 마련, 공급 적정성 검토, 도시개발 및 주거복지 정책 지원, 민간의 부동산 정보 활용 등에 폭넓게 활용될 수 있다. 아울러 시민과 사업 관계자에게 정확한 미분양 정보를 제공함으로써 주택시장에 대한 정보 접근성을 높이고 행정의 투명성과 신뢰성을 제고하는 데 목적이 있다.
