summary_user: 한국토지주택공사가 낸 대토보상 공고를 공고 한 건 단위로 담은 파일(csv, 약 8KB)로, 보상계획공고번호·회차·공고명·공고 시작·종료일자를 담는다. 공익사업 지구에서 토지를 수용당하는 토지소유자나 보상 분석가가 '어느 지구에서 언제 대토보상 공고가 났고 신청 기간이 언제까지였나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 공고명에 들어 있는 지구 이름이나 같은 기관(LH) 기준으로 이름을 맞춰 이어야 한다.
description_portal: 한국토지주택공사에서 공고한 대토보상 공고 현황(보상계획공고번호, 회차, 공고명, 공고시작일자, 공고종료일자)에 대한 정보를 제공합니다. 대토보상은 공익사업(도로, 철도, 공공주택 등)을 위해 토지를 수용하거나 매입할 때, 보상 방법의 하나로서 현금 보상 대신 다른 토지로 보상하는 제도입니다. 대토보상이 실시되는 지역은 계양부천, 남양주왕숙, 하남교산, 안양매곡, 부천역곡 등이 있습니다. 대토보상 공고기간은 평균 2~3주 정도 시간이 걸리게 됩니다. 대토보상 평가액에 불만이 있거나, 아예 대토보상 여부를 두고 다툼이 있으면 수용재결을 통해 판단을 받아야 합니다.
