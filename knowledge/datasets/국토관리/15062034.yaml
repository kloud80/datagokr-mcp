summary_user: 전북개발공사가 공급한 분양주택의 분양현장(사업지구) 정보를 현장·분양 건 단위로 담는다. 현장명과 주소, 분양명, 분양일, 입주 시작·종료일이 들어 있다. 전북 지역 공공분양을 준비하는 청약 대기자나 분석가가 "이 현장의 분양 시점과 입주 기간이 언제인가"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 현장명·주소(우편번호 포함) 매칭으로만 잇고, 같은 기관 데이터와는 현장코드(spotcode)·분양코드로 잇는다.
limits: 전역 조인 키가 없어 청약홈·마이홈 등 다른 기관의 분양·경쟁률 데이터와 바로 결합하지 못하며, 이름이나 주소를 직접 맞춰야 한다. 분양 이벤트가 생길 때 만들어진 뒤로는 바뀌지 않는 데이터여서, 최신 날짜가 예전이라도 갱신이 끊겼다고 단정하면 안 된다.
