summary_user: 경기부동산포털의 공동주택 공시가격을 호(세대) 단위로 담은 건별 자료로, 단지·동·층·호, 전용면적, 공시가격(pblntf_pc), 공시년도·기준월과 법정동·도로명주소·지번 같은 위치 정보를 함께 수록한다. 아파트 보유자나 분석가가 특정 단지·호의 공시가격을 확인하거나, 보유세·건강보험료·복지 수급 기준에 쓰이는 공시가격을 단지·지역별로 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 법정동코드·본번·부번이나 건물식별번호, 단지명·동·호 같은 이름·코드 매핑으로 실거래가나 건축물대장 등과 연결해야 한다.
description_portal: 이 데이터는 경기부동산포털의 공동주택 공시가격 자료로, 2023년 수원시 공동주택 단위별 가격과 세부 정보를 제공합니다. 주요 항목에는 단지코드, 동코드, 호코드 같은 식별값과 공시년도, 기준월, 법정동코드, 도로명주소, 시군구명 등 행정구역 정보가 포함됩니다. 또한 단지명, 동명칭, 층번호, 전용면적, 공시가격, 건물식별번호 등이 수록되어 있어 주택 가격 산정과 비교 분석이 가능합니다. 이 자료는 부동산 시장 동향 파악, 지역별 주택가격 차이 분석, 행정 정책 수립, 세금 및 복지 관련 제도 운영 등에 활용될 수 있습니다.
