summary_user: 경기도 시군별로 기준연월마다 등록 외국인 수를 5세 단위 연령대(0~4세부터 80세 이상까지)와 성별로 나눠 담은 집계 통계다. 다문화 지원사업이나 외국인 노동력 분석을 맡은 담당자·분석가가 '우리 시군에 학령기 또는 20~30대 등록 외국인이 얼마나 되고 남녀 비율은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군명(sigun_nm)이나 경기도 분석용 시군 코드 같은 이름·기관 코드 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 등록 외국인 지역별·연령별 현황 기본정보로, 시군 단위에서 연령별·성별로 구분된 등록 외국인의 인구 구조를 보여주는 통계자료입니다. 주요 항목에는 기준연월, 시군명, 등록외국인수, 연령별 인구수(0~4세, 5~9세, 10~14세 등), 등록외국인 남성·여성 인구수 및 세부 연령대별 구성이 포함됩니다. 이를 통해 특정 지역의 외국인 인구 분포와 성별·연령별 비율을 파악할 수 있으며, 외국인 노동력 분석, 교육·복지 정책 수립, 다문화 지원사업 기획 등 다양한 행정 및 연구 분야에서 활용 가능합니다.
accrual_periodicity: 수시
team:
  dept: AI미래행정과
