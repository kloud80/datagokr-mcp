description_portal: '부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에서 사용하는 수도 사용량에 따른 요금표입니다.구경별 기본요금: 계량기 크기(mm)에 따라 물 사용량과 관계없이 고정적으로 부과됩니다.사용요금 (상수도): 검침한 물 사용량(\(m^{3}\))에 업종별 단가를 곱하여 산정합니다.누진제 적용: 가정용 등 일부 업종은 사용량이 많아질수록 톤당 단가가 높아지는 누진 요금이 적용됩니다.하수도 요금: 사용한 수돗물의 배출량(보통 상수도 사용량과 동일하게 간주)에 따라 하수 처리 비용이 부과됩니다.물이용부담금: 상수원 주변 수질 개선 및 주민 지원을 위해 상수도 사용량에 비례하여 부과됩니다.'
