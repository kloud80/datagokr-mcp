summary_user: 부산광역시 상수도사업본부가 수용가정보시스템에서 쓰는 수도 요금표로, 요금표 구분(상수도·하수도·물이용부담금 등)과 업종별로 누진 단계마다 시작·끝 사용량 구간과 톤당 단가, 변경일자를 담은 작은 CSV 파일(약 2.7KB)이다. 부산 시민이나 사업자가 "우리 집(업종) 한 달 사용량이면 상하수도 요금이 얼마인가"를 직접 계산하거나, 분석가가 업종·단계별 요금 구조와 변경 이력을 비교하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 전역 조인 키는 없어, 업종명·업종코드를 이름 매핑하거나 같은 부산 상수도사업본부의 사용량·수용가 데이터와 기관 단위로 이어 쓴다.
limits: 전역 조인 키가 없어 다른 지자체 요금표나 사용량 통계와는 업종명 등 이름 매핑으로만 연결된다. 부산광역시 한 곳의 요금 체계만 담으므로 전국 요금 비교에는 다른 기관 자료가 필요하고, 계량기 구경별 기본요금 반영 여부는 필드에서 별도로 확인해야 한다.
