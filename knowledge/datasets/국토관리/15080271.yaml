summary_user: 전북특별자치도 익산시 일반건축물의 시가표준액을 건물(동·호) 단위로 담은 CSV 파일로, 과세년도·법정동·리·본번·부번 주소와 연면적, 기준일자가 함께 들어 있다. 익산시 소재 건물의 세금 부과 기준 금액이 얼마인지 확인하려는 소유자나, 지역 내 건축물 시가표준액 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없어 자치단체코드나 법정동·본번·부번 같은 주소 정보를 이름·코드로 맞춰 건축물대장·공시지가 등 다른 국토 정보와 연결해야 한다.
description_portal: 본 데이터는 전북특별자치도 익산시 내 일반건축물에 대한 시가표준액을 수집한 자료로, 시가표준액은 건축물의 적정 시가를 산정하여 부동산 거래 및 세금 부과의 기준으로 활용되는 중요한 지표이다. 해당 데이터는 시도명, 시군구명, 자치단체코드, 과세년도, 주소정보(법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지), 시가표준액, 연면적, 기준일자 등의 정보를 담고 있어, 2020년 익산시의 일반건축물에 대한 시가표준액을 파악하는데 중요한 자료로 활용될 수 있다. csv파일로 공공데이터포털에 업로드되어 활용하기 용이하며, 설명과 키워드를 통해 이용자들의 이해를 돕고 있다.
