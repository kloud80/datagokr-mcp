summary_user: K-water가 관리하는 댐(다목적댐·용수전용댐·홍수조절용댐·조정지)과 보, 낙동강하굿둑 등 61개소의 제원을 시설 1곳당 1행으로 담는 전국 단위 비공간 제원표로, 형식·높이·길이·체적·유역면적·총저수용량·유효저수용량·홍수조절용량·계획홍수위·상시만수위·홍수기제한수위 등을 제공한다. 가뭄이나 홍수철에 분석가나 시민이 '이 댐의 유효저수용량과 홍수기제한수위는 얼마이고, 현재 수위가 그 기준에 얼마나 가까운가'를 판단할 때 기준값으로 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 댐 수위·방류량 같은 K-water 운영 데이터와는 댐 이름(damnm) 문자열을 맞춰 붙여야 한다.
