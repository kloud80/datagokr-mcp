summary_user: 하남시 일반 정비사업(재개발·재건축 등)을 정비구역 한 곳당 한 행으로 담으며, 구역명·소재지·구역면적, 기존 주택 동수·세대수·용적률, 신축 주택의 면적대별 분양·임대 계획, 토지등소유자·조합원 수, 추진위 승인부터 조합설립·사업시행·관리처분·착공·분양·준공까지의 단계별 일자와 현재 사업단계(BIZ_STEP_NM)를 담는다. 하남시에서 특정 재개발·재건축 구역이 지금 관리처분 인가를 받았는지, 언제 착공·준공 예정인지 확인하려는 주민·투자자·분석가가 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 구역명·소재지 주소를 이름으로 맞춰 다른 정비구역·부동산 데이터와 잇는다.
description_portal: 경기도청 노후신도시정비과에서 운영하는 API 데이터로, 일반 정비 사업 추진에 대한 정비구역명, 소재지주소, 구역면적, 기존주택동수 등의 현황을 제공합니다.
