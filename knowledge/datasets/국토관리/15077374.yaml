summary_user: 광주광역시 북구에 있는 오피스텔을 한 건물당 한 행으로 정리한 시군구 단위 목록으로, 건축명·건축주소·사업승인연도·세대수·데이터기준일을 담는다. 북구에서 어느 오피스텔이 몇 세대 규모이고 언제 사업승인을 받았는지 확인하려는 주민·임대사업자·주택 분석가가 지역 오피스텔 공급 현황을 파악하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와 붙이려면 건축주소(도로명주소 위주이고 일부는 지번주소)나 건물명을 주소 정제·지오코딩으로 맞춰야 한다.
limits: 표준 조인 키가 없어 건축물대장·실거래가 같은 데이터와 바로 연결되지 않고, 이름이나 주소를 직접 매칭해야 한다. 파일 크기가 1.5KB 정도로 작은 단일 CSV이며 북구 한 곳만 다룬다.
