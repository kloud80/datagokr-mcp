summary_user: 안양시 지역화폐인 안양사랑상품권(종이)을 쓸 수 있는 가맹점을 한 곳씩 담은 목록으로, 가맹점명·업종(종목)·주소·연락처를 담는다(CSV 파일 약 500KB, 시군구 범위의 개별 주소 단위). 안양 시민이 "우리 동네에서 종이 상품권을 받는 가게가 어디인가"를 찾거나, 분석가가 업종별·지역별 가맹점 분포를 살펴 상권을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 가맹점명이나 주소를 기준으로 맞춰 붙이거나 같은 기관(안양시) 데이터와만 이어 쓴다.
description_portal: 안양시에서 발행하는 안양사랑상품권(종이)형(연번, 가맹점명,  종목, 주소, 연락처) 데이터 정보입니다.데이터 설명이 데이터는 경기도 안양시에서 발행한 지역화폐인 ‘안양사랑상품권(종이)’을 사용할 수 있는 가맹점 목록을 제공합니다. 가맹점의 상호명, 업종, 주소, 연락처, 행정동 등 주요 정보를 포함하고 있으며, 시민들이 상품권 사용 가능 매장을 쉽게 찾을 수 있도록 돕습니다. 또한 소상공인 지원 및 지역경제 활성화를 위한 정책 수립, 상권 분석, 민원 응대 등 다양한 행정 및 연구 목적으로 활용될 수 있습니다. 데이터는 정기적으로 갱신되며, 종이형 상품권 사용처에 대한 최신 정보를 반영합니다.
