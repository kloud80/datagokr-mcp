summary_user: 토지대장·임야대장에 등록된 필지별 토지등급과 그 변경 이력(변경일자·변동순번)을 전국 범위로 담은 건별 원천 자료로, 브이월드에서 시도별 CSV 파일로 받는다. 감정평가사·연구자가 특정 필지의 토지등급이 언제 어떻게 바뀌었는지, 지역별로 토지등급 분포가 어떤지 확인할 때 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 자료와 잇고, 법정동코드·대장구분·지번을 조합한 고유번호(필지 식별값)로 토지특성·공시지가 같은 필지 단위 자료와 맞춰 쓴다.
description_portal: 국토교통부 일별토지등급정보는 토지대장과 임야대장에 등록된 토지등급 자료를 제공하는 데이터이다. 토지등급은 토지의 위치, 이용 현황, 환경적 조건 등에 따라 평가된 등급을 의미하며, 개별 토지의 상대적 가치를 파악하는 기초 지표로 활용된다. 브이월드에서는 해당 정보를 일별 단위로 갱신·제공하여 최신성을 유지하고 있으며, 토지 과세, 이용 관리, 평가·감정, 정책 연구 등 다양한 분야에서 기초자료로 활용될 수 있다.이 데이터는 CSV 형식으로 제공되며, 텍스트 기반 구조이므로 가볍고 호환성이 높아 다양한 환경에서 활용이 가능하다. 사용자는 엑셀과 같은 범용 오피스 프로그램뿐 아니라 데이터베이스, GIS 소프트웨어, 통계·분석 툴(R, Python 등)과 연계하여 손쉽게 가공·분석할 수 있다. 또한 대량의 데이터를 빠르게 읽고 처리할 수 있어 행정업무, 연구, 민간 서비스 개발 등 여러 분야에서 재활용하기 용이하다.
