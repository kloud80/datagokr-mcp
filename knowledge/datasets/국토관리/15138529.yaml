summary_user: 경기도 이천시가 도시계획에서 공동개발 권장 대상으로 지정했거나 검토 중인 임시 구역의 현황도형을 건별로 담은 공간정보 파일로, 범위는 이천시 한 시군구입니다. 도시계획 실무자나 개발사업자가 특정 지역이 통합 개발이나 기반시설 공동 설치 검토 대상인지 확인하고 토지이용계획 재조정·사업성 검토의 기초자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드나 규제관리번호를 같은 기관 자료와 맞춰 보는 방식으로만 연결한다.
description_portal: 경기도 이천시 도시계획에서 일정 지역을 공동개발 권장 대상으로 지정하거나 검토 중인 공간 정보입니다. 항목은 규제관리번호, 현황도형 관리번호, 생성일시, 시군구코드 등으로 구성되며, 해당 지역이 통합 개발이나 기반시설 공동 설치 등에 적합한지 판단하는 기초자료로 활용됩니다. 본 데이터는 도시공간 효율성 제고, 토지이용계획 재조정, 사업성 검토, 도시관리계획 변경 지원, GIS 기반 분석 등에서 사용됩니다. 임시로 지정된 구역에 대한 행정적 판단과 사전 협의에 필요한 공간정보로 활용될 수 있습니다.
