description_portal: '강원 도내 지자체에 등록된 주택관리업자 및 주택임대관리업자 현황 제공 요청에 따라, 2026년도 1월 27일 기준 주택임대관리업자 현황을 제공합니다.주택임대관리업: 주택의 소유자로부터 임대관리를 위탁받아 관리하는 업(業)① 자기관리형 주택임대관리업: 주택의 소유자로부터 주택을 임차하여 자기책임으로 전대(轉貸)하는 형태의 업② 위탁관리형 주택임대관리업: 주택의 소유자로부터 수수료를 받고 임대료 부과·징수 및 시설물 유지·관리 등을 대행하는 형태의 업* 민간임대주택법 제2조제10호주택임대관리업자: 주택임대관리업을 하기 위하여 민간임대주택법제7조제1항에 따라 등록한 자* 민간임대주택법 제2조제11호데이터 목록: ① 등록번호, ② 등록일, ③ 영업구분, ④ 사무소명, ⑤ 전화번호, ⑥ 사무소 도로명주소, ⑦ 대표자명, ⑧ 대표자 도로명주소'
