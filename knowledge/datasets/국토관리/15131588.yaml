summary_user: 전라남도 공간정보 통합 플랫폼에 게재된 행복마을 사업 정보를 마을 단위로 담은 파일로, 마을 명칭·측점명·제목·시군구코드와 위치를 나타내는 도형정보를 건별로 담는다(CSV 약 41만 바이트, 시군구 단위). 전남 지역에서 행복마을 사업이 어느 시군구 어느 위치에 있는지 지도로 확인하려는 공무원·연구자·도민이 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 시군구코드나 마을 명칭을 매핑해 행정구역 경계·다른 전남 공간정보 레이어와 이어 쓴다.
limits: 표준 조인 키가 없어 다른 데이터와는 시군구코드나 이름 매칭으로만 연결된다. 범위는 전남(시도) 내 시군구 단위로 한정된다.
