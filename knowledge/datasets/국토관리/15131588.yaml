description_portal: '- 전라남도 공간정보 통합 플랫폼에 게재된 행복마을 사업 정보(마을명칭, 측점명, 도형정보, 제목 등)에 대해 조회하실 수 있습니다.- 전라남도 공간정보플랫폼은 전라남도청이 주관하는 공간정보 기반의 통합 정보 서비스 시스템으로, 도민과 공무원, 연구자 등이 다양한 공간 데이터를 활용할 수 있도록 지원합니다. 이 플랫폼은 공간정보의 수집, 관리, 분석, 시각화 등을 통해 효율적인 정책 수립과 의사결정을 돕고 있습니다.- 전라남도 공간정보플랫폼은 공간 데이터를 효율적으로 관리하고 활용할 수 있는 중요한 도구로, 다양한 분야에서 활용되고 있습니다. 이 플랫폼을 통해 공간 데이터를 보다 쉽게 접근하고 활용할 수 있으며, 이를 통해 정책의 효율성을 높이고, 연구 및 서비스 개발에 기여할 수 있습니다.'
