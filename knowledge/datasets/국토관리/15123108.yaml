summary_user: 경기도 시군별로 연도마다 어린이집 수(국공립·직장·민간 구분)와 유치원 수(공립·사립 구분), 0~5세와 3~5세 유아 인구를 함께 담은 집계 데이터이다. 정책 담당자나 분석가가 "우리 시군은 유아 인구에 비해 국공립 보육시설이 부족한가"처럼 지역별 보육 수요·공급 균형과 공공·민간 비율을 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 연도(yr)와 시군 이름·시군 코드(sigun_cd)를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 각 시군의 보육 및 유아 교육 시설 현황을 연도별로 제공하며, 어린이집과 유치원의 수 및 유형별 분포, 0세~5세 유아 인구 등을 포함합니다. 주요 항목은 국공립어린이집, 직장어린이집, 민간어린이집, 공립 및 사립유치원 수로 구분되며, 어린이 인구도 전체 0~5세 및 3~5세로 나뉘어 제시됩니다. 이를 통해 지역별 보육 인프라의 규모와 유형을 파악할 수 있으며, 유아보육 수요와 공급의 균형 여부, 공공과 민간 보육의 비율 등을 분석하는 데 유용합니다. 이 데이터는 보육정책 수립, 보육시설 입지 분석, 복지서비스 계획, 유아 교육 수요 예측 등 다양한 행정 및 연구 목적에 활용될 수 있습니다.
