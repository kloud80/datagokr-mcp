summary_user: 인천대공원 자전거 대여 서비스의 이용을 대여 건별로 기록한 원천 자료로, 대여날짜·대여시간·반납시간·자전거 종류·대여가격·추가금액·반납지연 여부를 담는다(CSV 파일 약 33MB). 공원 운영자나 분석가가 "어느 요일·시간대에 대여가 몰리고 반납 지연과 추가요금은 얼마나 생기는가"를 따져 자전거 배치와 요금 정책을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜·시간 기준이나 같은 기관(인천시설공단) 자료와의 이름 대응으로만 이어 쓴다.
