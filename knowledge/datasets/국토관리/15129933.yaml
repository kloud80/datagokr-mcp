description_portal: 법정영세민 급지별 단가는 한국토지주택공사가 법정영세민을 대상으로 제공하는 통합공공임대주택의 임대료를 산정할 때 사용하는 기준이 되는 정보입니다. 4개 유형의 급지 별로 기준 단가를 다르게 산정하고 있으며 급지 유형은 서울특별시, 광역시 및 수도권, 인구 30만 이상 도시 또는 도청 소재지, 기타 지역으로 구분됩니다. 법정영세민을 대상으로 공급하는 통합공공임대주택의 경우에는 취약 계층의 경제력을 고려하여 일반적인 임대조건보다 할인된 금액이 적용됩니다. 표준임대보증금 및 표준임대료의 단위는 "원/제곱미터" 이므로 이용에 참고하시기 바랍니다.
