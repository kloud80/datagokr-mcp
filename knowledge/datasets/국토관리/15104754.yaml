summary_user: 광주 북구에 설치된 현수막 게시대를 한 기당 한 행으로 담은 파일(csv, 약 11KB)로, 공공게시대·상업용게시대 구분, 위치(괄호 안 법정동·지번 주소), 시설물·현수막 규격(가로×세로 m), 광고면 수, 정치현수막 게시대 여부를 담는다. 현수막을 내걸려는 사업자·단체나 주민이 '우리 동네 어디에 상업용 게시대가 있고 현수막 크기는 얼마로 맞춰야 하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치 텍스트의 법정동명·지번 주소를 매칭하거나 같은 기관(북구) 자료끼리 이어 쓴다.
