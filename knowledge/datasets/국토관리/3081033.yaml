summary_user: 인천광역시 연수구에서 담배소매인으로 지정된 업소를 한 곳씩 담은 목록으로, 소매인 구분·업소명·지번주소·도로명주소가 들어 있고 범위는 연수구 한 곳입니다. 연수구에서 담배를 파는 가게가 어느 동네에 몰려 있는지, 특정 학교 주변에 판매점이 있는지 알고 싶은 주민·사업자·청소년보호 담당자가 위치 분포를 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 업소 주소(지번·도로명)를 주소정제나 좌표변환으로 맞추거나 업소명을 대조해 잇는다.
description_portal: 이 데이터는 인천광역시 연수구 내 담배소매인으로 지정된 업소들의 상세 현황을 담고 있습니다. 연번, 소매인 구분, 업소명, 지번주소와 도로명주소 등으로 구성되어 있어 업소 위치와 유형을 명확히 파악할 수 있습니다. 이를 통해 담배 유통 관리, 청소년 보호 정책 수립, 상권 분석 등 다양한 행정 및 연구 목적으로 활용할 수 있으며, 지역 내 담배 판매업소 분포와 특성을 분석하는 데 매우 유용합니다. 또한 업소별 정확한 주소 정보는 현장 방문, 지도 제작, 홍보 활동에도 도움을 줍니다. 최신 정보를 바탕으로 효율적인 정책 결정과 관리가 가능하도록 지원하는 자료입니다.
