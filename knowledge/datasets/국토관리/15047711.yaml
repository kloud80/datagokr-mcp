summary_user: 서울특별시 광진구 관내에 등록된 제조업 공장을 한 곳씩 담은 명부 파일로, 회사명·대표자명·전화번호·생산품·공장 주소와 데이터 기준일자가 들어 있다. 광진구에서 어떤 품목을 만드는 공장이 어디에 있는지 찾는 사업자나, 구 단위 제조업 분포를 살피는 분석가가 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어, 다른 데이터와는 회사명·주소를 맞춰 대조하거나 같은 기관 자료끼리만 이어 쓴다.
limits: 사업자번호·업종분류코드·필지 고유번호가 없어 기업·토지·상권 데이터와 키로 직접 결합할 수 없고, 이름·주소 매칭에 의존해야 한다. 범위는 광진구 한 곳에 한정되어 다른 시군구나 전국 현황은 따로 모아야 한다.
