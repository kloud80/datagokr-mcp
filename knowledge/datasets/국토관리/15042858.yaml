summary_user: "강릉시가 지정·관리하는 '맛있는강릉' 참여 음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·인증 구분·전화번호·도로명주소·음식 유형·관리부서·데이터기준일자를 포함한다. 강릉을 찾는 여행자나 시민이 \"강릉에서 시가 인증한 해산물 식당은 어디이고 연락처는 무엇인가\"를 확인하거나, 관광 콘텐츠 제작자가 식도락 지도를 만드는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명주소나 업소명을 매칭해서 잇는다(예: 일반음식점 인허가 데이터, 지오코딩 결과)."
description_portal: '강원특별자치도 강릉시에서 지정·관리하는 ‘맛있는강릉’ 참여 업소 정보를 정리한 데이터로, 업소별 기본 정보, 인증 여부, 위치, 연락처, 음식 유형 등을 한 번에 확인할 수 있도록 구성된 자료입니다.연번: 맛있는강릉 참여 업소를 구분하기 위한 일련번호업소명: 맛있는강릉에 등록된 음식점·식당의 이름인증: 위생·품질·서비스 등 기준에 따라 부여된 인증 구분(예: 우수음식점, 지정업소 등)전화번호: 예약·문의 등을 위한 업소 대표 전화번호도로명주소: 업소의 도로명 기준 주소(방문·길찾기용 정보)음식의유형: 업소에서 주로 취급하는 음식 종류(예: 한식, 해산물, 분식, 카페·디저트 등)관리부서: 맛있는강릉 업소를 지정·관리하는 행정 부서명데이터기준일자: 맛있는강릉 업소 현황 정보가 확인·갱신된 기준 일자(YYYY-MM-DD 형식)이 데이터는 지역 대표 맛집 현황을 체계적으로 관리하고, 방문객과 시민에게 검증된 외식 정보를 제공하기 위한 자료로 활용되며, 관광 코스 설계, 식도락 지도 제작, 음식·관광 연계 콘텐츠 개발, 온·오프라인 맛집 안내 서비스 구축 등에 활용할 수 있습니다.'
