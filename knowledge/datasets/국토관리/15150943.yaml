summary_user: 한국수자원공사가 운영하는 9개 다목적댐(소양강·대청·충주·용담·안동·주암·임하·합천·남강)의 2024년 1월 1일부터 12월 31일까지 발전기별 발전량과 저수위·저수량·저수율·유입량·방류량(수문·발전·취수 등 세부 방류 포함)을 1시간 단위로 담은 건별 시계열 파일이다. 분석가가 '홍수기 집중호우 때 댐별 유입량과 방류량, 수위가 시간대별로 어떻게 움직였고 그동안 발전량은 얼마였나'를 확인하거나 수문·발전 예측 모델 학습 자료로 쓴다. 전역 조인 키나 댐코드가 없어 다른 댐 운영·수문 관측 데이터와는 댐명과 측정일시를 맞춰 이어 써야 한다.
limits: 댐코드 같은 공통 키가 없어 다른 데이터와 붙일 때 댐 이름 매핑이 필요하다. 9개 다목적댐의 2024년 한 해 자료만 담은 파일이라 다른 댐이나 다른 연도와의 비교, 실시간 조회에는 쓰지 못한다.
