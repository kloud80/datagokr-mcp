summary_user: 제주특별자치도 안의 마을하수도(1일 처리용량 500㎥ 미만 소규모 하수처리시설)를 시설 한 곳당 한 행으로 담은 CSV 파일(약 2KB)이며, 읍면동·시설명·위치·처리방법·일 처리용량·설치연도를 기록한다. 우도·추자도·가파도·마라도 같은 도서 지역 하수가 어떤 시설에서 어떤 방식으로 얼마나 처리되는지, 노후 시설이 어디에 있는지 확인하려는 주민·연구자·하수도 정책 분석가가 쓴다. 전역 조인 키가 없어 읍면동 이름이나 시설명을 기준으로 행정구역 자료나 제주도 하수처리시설 자료와 이름 매칭으로 이어 쓴다.
