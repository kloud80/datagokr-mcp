summary_user: 수도권매립지에 반입되는 광명시 환경수도사업소 배출분의 폐기물 실중량(톤)을 마감년월·폐기물 종류별로 담은 월간 집계 파일로, CSV 한 건(1,259바이트)의 작은 규모다. 광명시 환경수도사업소가 매달 어떤 폐기물을 얼마나 매립지로 보냈는지, 시기별 반입량이 어떻게 변했는지를 확인하려는 분석가나 지자체 담당자가 쓴다. 전역 조인 키가 없어 같은 기관의 다른 통합반입관리 배출처 데이터와 마감년월·배출처명·폐기물명을 이름 그대로 맞춰 이어 쓴다.
description_portal: '수도권매립지관리공사는 폐기물관리법 등의 관계법과 수도권매립지 폐기물 반입 등에 관한 사무처리 규정에 따라 폐기물을 반입하고 있습니다.수도권매립지관리공사는 매립 후 5시간 이내 복토 작업을 통해 폐기물의 흩날림, 해충서식, 냄새발생, 빗물침투 등을 방지합니다.폐기물 분해과정에서 발생하는 매립가스를 포집하여 전력생산 및 악취방지의 효과를 달성하고 있으며,매립시설 바닥에 차수시설을 설치하여 지하수 오염을 차단하고, 침출수를 모아 처리하고 있습니다.해당 데이터는 수도권매립지에 반입되는 광명시 환경수도사업소 배출처의 월간 폐기물 실중량(톤) 정보입니다.개방항목 : 마감년월, 배출처명, 폐기물명, 실중량 수도권매립지에 반입되는 광명시 환경수도사업소 배출처의 폐기물 실중량(톤)정보입니다.'
