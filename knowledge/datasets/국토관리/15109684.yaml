description_portal: 이 데이터는 울산광역시도시공사에서 추진 및 운영 중인 주택사업의 주요 현황을 종합적으로 관리하기 위한 데이터셋으로, 주택 단지의 위치, 유형, 면적, 세대수, 준공일, 법적 근거 등 주택 관련 행정정보를 체계적으로 수록하고 있습니다.공사의 임대주택, 분양주택, 공공지원형 주택 등 다양한 공급유형별 사업 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 주택정책 수립과 공공자산 관리의 기초자료로 활용됩니다.핵심 항목으로는 소재지(LCTN_ADDR), 단지명(CNBD_NM), 공급유형(TYPE) 등이 있으며, 각 사업의 위치와 유형을 명확히 구분하여 관리합니다.또한 공급면적(PPR), 전용면적(XUAR), 연면적(GFA) 등 면적 관련 항목을 통해 주택의 규모와 구조를 정량적으로 분석할 수 있고, 건폐율(BDCVRT) 및 용적률(FART) 항목은 도시계획 및 건축규제 준수 여부를 판단하는 지표로 활용됩니다.세대수(HH_CNT) 항목은 단지별 총 세대수를 나타내며, 실제 입주민 수용 규모 및 주거밀도 분석에 유용합니다.사용승인일(CMCN_YMD) 항목을 통해 사업의 준공시점과 주택공급 시기를 추적할 수 있으며, 사업추진현황(BIZ_STATE) 항목은 각 주택단지의 개발단계(계획 중·공사 중·완공 등)를 명시합니다.
