summary_user: 김해시에 등록된 공장을 회사 단위로 한 줄씩 담은 시군구 공장등록 현황 파일로, 회사명·지식산업센터명·공장 대표주소(지번)·남녀 및 외국인 종업원 수·업종번호와 업종명·용도지역을 담는다. 김해시 안에서 어떤 업종 공장이 어느 용도지역에 몰려 있고 외국인 종업원을 얼마나 고용하는지 알고 싶은 분석가나 입지를 검토하는 사업자가 쓴다. 실측 컬럼에 사업자번호·필지고유번호(PNU) 같은 전역 조인 키가 없어, 다른 데이터와는 회사명·지번 주소를 이름 매칭하거나 업종번호를 업종분류표와 맞춰 잇는다.
description_portal: '경상남도 김해시 공장기업 현황에 대한 데이터로 회사명, 단지명, 지식산업센터명, 공장대표주소, 남종업원, 여종업원, 외국인남자 종업원, 외국인여자 종업원, 업종번호, 업종명, 용도지역에 대한 정보를 제공합니다.해당 데이터의 데이터 기준일자는 2025년 8월 14일로, 연간 주기로 관리하고 있습니다.* 해당 데이터는 공공데이터포털(data.go.kr)을 통한 제공 신청으로 개방된 데이터입니다.데이터 담당부서 : 김해시 허가민원과(055-330-3693)[데이터 변동 안내]1. 신규 데이터 추가2. 데이터 설명 수정3. 데이터 키워드 추가4. 데이터 기준일 변경'
