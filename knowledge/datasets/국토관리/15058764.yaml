summary_user: 전북개발공사가 시행하는 사업지구별 용지보상 개요를 담는 API로, 사업 승인일자·인정고시일자·조사 및 보상 시작일자, 보상지역, 보상면적, 보상예상액, 관련 법규명 같은 사업 단위 보상 기준정보를 제공한다. 지역개발사업을 분석하는 연구자나 사업지구 인근 토지 소유자가 특정 사업지구의 보상이 언제 시작됐고 어느 지역에서 어느 규모로 진행되는지 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 사업명·보상지역 같은 이름 매핑이나 같은 기관의 사업구분·사업유형 코드로만 연결한다.
limits: 표준 행정코드나 필지 고유번호 같은 전역 조인 키가 없어 토지대장·공시지가 데이터와 바로 결합하기 어렵다. 호출에는 포털 활용신청(자동승인) 후 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
