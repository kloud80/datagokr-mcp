description_portal: 용지보상개요기준정보조회 서비스는 사업지구별 토지 보상 관련 주요 정보를 조회할 수 있는 OpenAPI 서비스입니다.사업지구별 분양 및 미분양 토지에 대한 면적, 용도, 평가금액, 계약금액 등 주요 필지 정보 및 사업 승인일자, 보상 시작일자, 보상지역 등 보상 개요 정보를 제공합니다.이를 통해 사용자는 사업별 보상 현황을 신속하게 파악하고 공공사업 추진 시 토지 보상 절차의 투명성을 높일 수 있습니다.본 서비스는 토지 보상 행저업무의 효율화, 지역개발사업 분석, 정책 연구 등에 활용될 수 있습니다.
