description_portal: 인천광역시 용도지역 현황 공공데이터는 인천시 전역의 도시군관리계획 중 용도지역에 대하여 파악할 수 있는 자료입니다. 이 데이터는 도시지역과 비도시지역으로 구분되며, 도시지역은 주거지역, 상업지역, 공업지역, 녹지지역으로 세분화되고, 비도시지역은 관리지역(계획관리지역, 생산관리지역, 보전관리지역), 농림지역, 자연환경보전지역으로 구성됩니다. 각 용도지역은 토지의 개발 가능성, 건축물의 용도 제한, 환경보전 여부 등을 결정하는 중요한 기준이 됩니다. 기준일은 2024년 12월이며, 연간 단위로 업데이트 됩니다.
