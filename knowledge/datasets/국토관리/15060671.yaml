summary_user: LH가 관리하는 건설임대주택의 공급 호수를 시·도와 시·군·구 단위로 집계한 파일로, 국민임대·영구임대·행복주택 유형별 호수와 총합계를 담는다. 정책 분석가나 지자체 담당자가 '우리 시·군·구에 공공임대가 유형별로 몇 호 공급돼 있고 다른 지역과 비교해 부족한가'를 따질 때 쓴다. 행정구역 코드 같은 전역 조인 키가 없어, 다른 지역 통계와는 시도·시군구 이름을 맞춰 연결해야 한다.
