summary_user: 대구광역시 관내에 개설신고되어 영업 중인 건축사사무소를 사무소 한 곳당 한 행으로 담은 파일로, 사무소명·소재지 주소·대표건축사 성명·전화번호가 들어 있다. 건축주나 사업자가 대구에서 설계·공사감리를 맡길 건축사사무소를 지역별로 찾거나, 분석가가 구·군별 건축사사무소 분포를 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소를 행정구역으로 매핑하거나 사무소명·성명을 맞춰 보는 방식으로만 연결한다.
limits: 사업자번호·등록번호 같은 공통 키가 없어 건축 인허가나 건축물대장 데이터와 직접 결합할 수 없고, 주소나 이름 매칭에 의존해야 한다. 범위는 대구광역시 한 곳에 한정된다.
