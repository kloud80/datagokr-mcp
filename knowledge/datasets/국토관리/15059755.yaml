description_portal: 해당 데이터는 대구광역시 관내 건축사법 제23조에 의거 개설신고 되어 영업 중인 건축사사무소의 사무소명, 사무소 소재지, 대표건축사 성명, 사무소 전화번호에 대한 현황정보입니다.건축사는 국토교통부장관이 시행하는 자격시험에 합격한 사람으로서 건축물의 설계와 공사감리 등 건축사법 제19조에 따른 업무를 수행하는 사람을 말하며, 자격등록을 한 건축사가 건축사업을 하려면 시도지사에게 건축사사무소의 개설신고를 하여야 합니다.*해당 데이터는 참고자료이며 오류가 있을 수 있습니다.
