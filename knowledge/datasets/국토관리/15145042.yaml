description_portal: '○ 경상남도 거창군의 조경업체에 관한 정보입니다. 경상남도 거창군의 조경업체 상호, 경상남도 거창군의 조경업체 업종, 경상남도 거창군의 조경업체 시군구, 경상남도 거창군의 조경업체 도로명주소, 경상남도 거창군의 조경업체 전화번호, 경상남도 거창군의 조경업체 데이터 기준일 데이터를 제공합니다.○ 데이터기준일 : 2025. 08. 01.○ 조경업체는 조경 공사를 전문적으로 수행하는 회사를 말합니다. 조경 공사는 자연환경과 인공 환경을 조화롭게 조성하여 쾌적하고 아름다운 공간을 만드는 활동을 의미하며, 조경업체는 이러한 공사를 계획, 설계, 시공, 유지 관리하는 역할을 합니다.'
