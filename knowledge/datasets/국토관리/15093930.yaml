summary_user: 한국수자원공사가 운영하는 정수장별 먹는물 법정 수질검사 결과를 건별로 담은 파일 데이터로, 검사연월·시설명·채수일자와 일반세균, 총대장균군, 납, 불소 등 항목별 측정값을 수록하며 검증 수신 5,200행이다. 시민이나 수질관리 분석가가 "우리 지역 정수장의 수돗물이 수질기준에 맞는가"를 확인할 때 쓴다. 소재지(address)와 좌표(coord)를 키로 다른 상수도 시설·급수구역 자료와 위치 기준으로 이어 쓰며, 정수장코드 같은 별도 코드 키는 필드에 없다.
description_portal: 본 데이터는 한국수자원공사에서 운영 중인 정수장의 먹는물 법정 수질검사 결과를 제공합니다. 검사는 "먹는물 수질기준 및 검사 등에 관한 규칙"에 따라 시행되며, 수돗물의 안전성과 수질 적합 여부를 확인하기 위한 것입니다. 자료에는 정수장 명칭, 검사일자, 항목명, 기준값, 측정값 등이 포함됩니다. 검사 항목은 일반세균, 대장균, 탁도, 색도, 잔류염소 등입니다. 본 자료는 2024년 7월부터 2024년 12월까지의 결과를 수록하고 있으며, 수질관리, 위생 점검, 정책 수립 등에 활용할 수 있습니다.* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/tapWaterData
