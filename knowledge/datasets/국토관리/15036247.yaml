description_portal: 이 데이터는 국민임대산업단지와 임대전용산업단지에 대한 정보를 제공하며, 각 단지의 명칭, 위치, 지정면적, 지정연도, 시행기관, 임대기간 등 기본 현황을 포함하고 있습니다.임대전용산업단지는 중소기업, 외국인 투자기업, 해외 유턴기업 등에 저렴한 산업용지를 장기간 임대해 기업의 입지비용을 줄이고 국내 산업 경쟁력을 높이기 위해 조성된 단지입니다.이 단지는 국가, 지방자치단체, 중소기업진흥공단 등 공공기관이 개발·운영하며, 의무임대기간은 최소 10년에서 최장 50년까지입니다.또한 국민임대산업단지는 국가 정책에 따라 일정 기준을 충족하는 기업에게 산업용지를 안정적으로 공급하기 위해 지정된 산업단지로, 임대전용산업단지와 함께 정부 주도의 장기임대형 산업입지 체계로 구분·관리됩니다.
