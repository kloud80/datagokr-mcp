summary_user: 부천시에 등록된 제조업 공장을 한 곳씩 담은 건별 명부 파일로, 회사명·도로명 공장주소·업종명·생산품·전화번호를 담는다. 부천시 안에서 특정 업종이나 생산품을 만드는 공장을 찾는 사업자, 또는 관내 제조업 분포를 업종별로 살피려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 회사명·도로명주소를 맞춰 보거나 업종명을 표준산업분류 이름에 대응시켜 잇는다.
description_portal: 부천시 공장등록 현황에 대한 데이터로 회사명, 공장주소(도로명), 전화번호, 업종명, 생산품 등의 정보를 제공합니다. 해당 정보는 산업집적활성화 및 공장설립에 관한 법률 제16조(공장의 등록)에 따라 등록된 제조업 공장 현황 자료로 부천시 관내 제조업 활성화와 지역경제활성화 , 일자리 창출에 기여할 수 있습니다. 해당 정보는 부천시 사이트 "사전정보공표" 현황에서도 확인 가능합니다. 업종코드는 한국표준산업분류에 따른 분류코드입니다.(10차시) 2025년 기준 부천시 관내 등록공장은 약 3,400개소 입니다. 기타 세부사항은 부천시청(www.bucheon.go.kr)에서도 확인 가능합니다. 해당 자료는 오정일반산업단지 내 공장등록(입주계약)현황 자료를 포함합니다. 공장등록 현황 외 세부 공장설립 완료신고 현황도 부천시청(www.bucheon.go.kr)에서 확인 가능합니다. (공장등록(변경)은 공장설립온라인지원시스템(팩토리온)에서 신청 가능합니다)
