summary_user: 경기도 내 공동주택(아파트 등) 공사를 건별로 담으며, 공사명·시군·착공 및 준공 예정일·시공사와 연락처·세대수·입주예정일·지번/도로명 주소·위경도를 포함한다. 분석가나 수요자가 '우리 시군에서 앞으로 입주할 단지는 어디이고 몇 세대인가'처럼 지역별 공급 시기와 시공사별 사업 규모를 살펴보는 데 쓴다. 전역 조인 키는 없고 K-apt 단지코드도 없으므로, 시군 코드(SIGUN_CD)·시군명으로 같은 기관의 경기도 자료와 묶거나 단지명·주소를 매칭해 K-apt 단지정보·실거래·청약 자료와 잇는다.
description_portal: 경기도 내의 공동주택 시공현황입니다. 공사명, 시공사, 시공위치, 공사일자등의 정보를 제공합니다.이 데이터는 경기도 내 공동주택(아파트 등)의 시공 현황을 정리한 자료로, 공사명, 시군명, 공사 시작일 및 완료일, 시공사명과 연락처, 세대수, 입주예정일, 시공 위치 주소(지번 및 도로명), 우편번호, 위도·경도 정보 등의 항목으로 구성되어 있습니다. 이를 통해 지역별 공동주택 개발 동향, 시공사별 프로젝트 규모, 입주 시기 등을 파악할 수 있으며, 주택공급 정책 수립, 도시계획 및 인프라 배치, 부동산 시장 분석 등에 활용될 수 있습니다. 시공 위치의 좌표 정보는 공간 분석 및 지도 시각화 자료로도 유용하게 쓰일 수 있습니다.
