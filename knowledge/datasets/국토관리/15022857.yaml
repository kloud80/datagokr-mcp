summary_user: 하남시 덕풍동·신장동 저지대 침수를 막는 재난대응용 배수펌프장 2개소(신장·덕풍)의 지번주소, 설치년도·설치목적, 모터 펌프 규모·대수, 한전 계약전력·전원공급방식, 연간 사용전력량·전기요금을 펌프장 한 곳당 한 행으로 담은 작은 현황 파일이다. 지역 주민이나 방재 담당자가 '우리 동네 빗물 배수펌프장이 어디에 있고 펌프 용량과 전원 이중화(1회선·2회선)가 어떤가'를 확인하거나, 분석가가 펌프장 전력 사용량과 운영비를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 하천·침수 데이터와는 펌프장명이나 지번주소를 주소·좌표로 바꿔 공간으로 맞추거나, 같은 기관(하남시) 기준으로만 연결한다.
description_portal: 경기도 하남시 재난대응용 배수펌프장(신장펌프장, 덕풍펌프장) 2개소의 현황(펌프장명, 설치년도, 설치목적, 모터 펌프규모(kW(HP)), 한전계약전력((kW)-저압고압) , 전원공급방식(1회선 또는 2회선), 사용전력량(kWH / 1년 /최대-최소 / 고압-저압), 전기요금(원 /1년 /최대-최소/고압-저압 등) 항목을 제공합니다.   여름철 높은 강우 상황시 상습 침수지역인 하남시 덕풍동 및 신장동 일대 저지대의 침수피해를 최소화하기 위한 재난대응용 빗물배수펌프 시설입니다.안전한 운영을 위해 정기 및 정밀안전점검을 실시하고 있으며, 전기안전관리 대행 계약으로 덕풍펌프장 월 2회, 신장펌프장 월1회의 전기안전관리를 실시하고 있습니다.
