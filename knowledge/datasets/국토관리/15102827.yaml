summary_user: 광양시의 주택 단지별 공급 계획을 담은 파일로, 단지마다 단지명·소재지·공급(예정)월과 전용면적 구간별(59㎡ 이하, 84㎡ 이하, 117㎡ 이하, 118㎡ 초과) 공급 예정 물량을 한 행씩 기록한다(csv 1,351바이트 규모의 작은 목록). 광양시에서 내 집 마련이나 이사를 준비하는 사람이 '언제 어느 단지에서 84㎡ 이하 물량이 얼마나 나오는가'를 확인하거나, 분석가가 시군구 단위 신규 공급 규모를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 공급·인허가·미분양 데이터와는 단지명·소재지 같은 이름 매칭이나 같은 기관(광양시) 기준으로만 이어 쓴다.
limits: 단지 식별 코드나 법정동 코드 같은 공통 키가 없어 다른 데이터와 자동 연결이 어렵고, 단지명·주소 문자열로 맞춰야 한다. 범위가 광양시 한 곳뿐이라 지역 간 비교에는 다른 시군구 자료를 따로 모아야 한다.
