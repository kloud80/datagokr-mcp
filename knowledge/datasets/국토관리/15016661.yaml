summary_user: 서울 관악구 안의 지식산업센터를 건물 한 동씩 담은 파일로, 건물명·소재지·공장용지면적·연면적(공장시설·지원시설 구분)·층수·분양/임대 여부·입주업체수·용도지역·건립자를 담으며 파일 크기는 352바이트로 몇 건에 그친다. 관악구에 어떤 지식산업센터가 어디에 있고 분양인지 임대인지, 입주업체가 몇 곳인지 확인하려는 창업자·사업자나 도시형 공장 분포를 보는 분석가가 쓴다. 전역 조인 키는 실측 컬럼에서 찾지 못해 소재지 주소나 건물명으로 건축물대장 등과 맞춰 이어야 하며, 다른 자치구 지식산업센터 파일과는 같은 항목 구성으로 나란히 묶어 쓴다.
description_portal: '* 지자체에서는 당해 업무를 담당하지 않으므로 정확한 데이터의 확인은 [한국산업단지공단_입지지원팀_070-8895-7383]으로 연락주시기 바랍니다.서울특별시 관악구에서 제공되었던 지식산업센터 정보로 순번, 자치구명, 입주형태(분양임대),입주업체 수, 용도지역, 건립자, 데이터 기준일, 담당기관 등에 대한 데이터입니다.해당 데이터는 다음의 항목으로 구성되며, 지식산업센터의 규모·입주 형태·시설 구성 등을 파악하는 데 활용할 수 있습니다.자치구명건물명 및 소재지공장용지면적(㎡)건축 총 연면적(㎡)공장시설·지원시설 연면적(㎡)건축형태(지하/지상 층수)입주형태(분양·임대 여부)입주업체수용도지역건립 주체데이터 기준일 및 담당기관본 자료는 관악구 내 지식산업센터의 현황을 파악하고, 산업시설 분포 및 공간 활용 분석에 참고하기 위한 기초 데이터로 활용 가능합니다.'
