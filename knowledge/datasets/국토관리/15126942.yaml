summary_user: 경기도 양주시 안의 다중주택과 오피스텔을 건물 한 동씩 담은 파일로, 건물명·소재지 주소·대지면적·건축면적·주용도·층수·관리부서를 기록한다(CSV 약 17KB). 양주시에 다중주택이나 오피스텔이 어느 동네에 몰려 있는지, 대지면적 대비 건축면적으로 본 건축 규모가 어떤지 확인하려는 주민·사업자·도시계획 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 소재지 주소를 주소 정제·지오코딩하거나 건물명을 맞춰 보는 방식으로만 잇는다.
description_portal: 경기도 양주시_다중주택 및 오피스텔 현황 데이터는 양주시 내 다중주택과 오피스텔 건축물의 현황을 제공한다. 주요 항목은 시군명, 건물명, 소재지 주소, 대지면적, 건축면적, 층수, 세대수, 관리부서 등의 정보로 구성되어 있다. 이를 통해 특정 지역 내 주거용 건축물의 밀집 현황, 건축 규모, 공급 형태를 파악할 수 있으며, 지역별 주택정책 수립과 주거환경 개선 자료로 활용 가능하다. 특히 대지면적과 건축면적 항목은 건폐율과 용적률을 추정할 수 있어 도시계획, 건축행정 및 인허가 업무 지원에 유용하다. 또한 다중주택과 오피스텔의 현황은 인구밀도 및 주거 수요와 직접적으로 연결되므로, 도시 인프라 계획, 교통정책, 생활 SOC 시설 배치 등에도 참고할 수 있다. 나아가 부동산 시장 분석, 주거복지 정책, 지역별 주거수준 평가에도 중요한 기초자료로 활용될 수 있다.
