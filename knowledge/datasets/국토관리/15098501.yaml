summary_user: 대구광역시 관내에서 허가·신고된 건축물별로 건축구분(신축·증축·용도변경 등), 대지위치, 건축면적·연면적, 지상·지하 층수, 주용도, 허가일·착공처리일·사용승인일, 설계·감리·시공 사무소명을 담은 건별 현황 파일(xlsx, 약 93KB)이다. 분석가나 사업자가 '대구에서 최근 어느 지역에 어떤 용도의 건물이 허가·착공되고 있나'처럼 지역 개발 흐름을 앞서 가늠하는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 대지위치 같은 주소 문자열이나 같은 기관 기준 이름 매칭으로만 잇는다.
limits: 표준 조인 키(건축물대장 번호, 법정동 코드 등)가 없어 건축물대장·공시지가 등과 바로 결합하지 못하고 주소를 매칭해야 한다. 범위는 대구광역시 한 곳뿐이고 좌표가 없는 비공간 자료다. 기관이 변경 가능성을 밝히고 참고용으로만 쓰라고 안내한다.
