description_portal: 제방파제, 제방월류, 내수침수의 홍수시나리오에 대해 침수범위와 침수심을 나타내는 홍수위험지도에 대하여  검색조건을 구분하는 공통코드들을 분리해 놓은 그룹 정보.* 홍수위험지도란? 하천제방의 설계빈도를 초과하는 홍수가 발생하여 제방붕괴, 제방월류 등 극한의 상황이 발생한다는 가정하에 하천 주변지역의 침수범위, 침수깊이를 나타낸 지도. 이를 통해 최악의 홍수상황을 사전에 대비하고 인명 및 재산피해를 최소화하며, 지자체의 재해지도 제작, 홍수 관련 보험의 기초자료를 제공 및 수해방지대책 수립 등에 활용이 가능한 홍수 대비를 위한 기초정보. 홍수위험지도의 제방붕괴 등의 홍수 예상 시나리오는 실제 하천제방의 안정성과 무관하며, 구조물적 대책이 실패한다는 최악의 경우를 가정한 것으로서 홍수 시 가상의 최대 범람 범위 산정을 위한 것임
