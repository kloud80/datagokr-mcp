summary_user: 대전광역시 동구 관내 일반건축물의 시가표준액을 건물 단위로 담은 파일 데이터로, 물건지 주소·연면적·납부년도·결정일자가 함께 들어 있다(CSV 약 1.3MB). 동구에 건물을 가진 사람이나 분석가가 "이 건물의 재산세 부과 기준이 되는 시가표준액이 얼마이고 해마다 어떻게 바뀌었나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 물건지 주소를 맞춰 잇거나, 같은 기관의 자치단체코드로 다른 시군구 시가표준액 데이터와 묶어 쓴다.
description_portal: 본 데이터는 일반건축물에 대한 지방세 부과기준으로 활용되는 시가표준액 정보를 담고 있으며, 대전광역시 동구 관내 건축물의 연면적, 주소, 과세년도, 기준일자 등의 세부 항목으로 구성됩니다. 이 데이터는 지방세 부과 및 부동산 과세 체계 운영, 건축물 가치 산정, 부동산 시장 분석, 재산세 예측 모델 개발, 도시계획 수립 등 행정 및 민간 부문의 다양한 활용 목적에 부합합니다. 특히 부동산 투자자, 공공기관, 연구기관 등이 건축물 자산 가치를 비교·분석하고 정책 수립 시 참고자료로 사용할 수 있는 기반 자료로서의 가치가 큽니다.
