summary_user: 경기도 시군별 상수도 요금 총괄 현황을 담은 집계 자료로, 시군마다 부과량·부과액·판매단가·생산액·생산원가·요금 현실화율을 집계 기준일(SUM_DE)과 함께 제공한다. 분석가나 지자체 담당자가 '우리 시군의 수도요금이 생산원가를 얼마나 회수하고 있는가'처럼 요금 현실화 수준과 상수도 재정 건전성을 시군끼리 비교할 때 쓴다. 전역 조인 키는 없고, 시군명(SIGUN_NM)·시군코드(SIGUN_CD)를 이름·코드 매핑해 다른 경기도 시군 단위 상수도·인구·재정 자료와 이어 쓴다.
description_portal: 이 데이터는 시군별 상수도 요금 총괄 현황을 수록한 자료로, 상수도 운영에 따른 요금 부과 실적과 경제적 지표를 종합적으로 제공합니다. 주요 항목으로는 부과량(LEVY_QTY), 부과액(LEVY_AMT), 판매단가(SALE_UNPC), 생산액(PRODCTN_AMT), 생산원가(PRODCTN_PCOST), 현실화율(ACTULZTN_RT) 등이 포함되며, 각 시군별로 수도요금의 책정 및 운영 성과를 정량적으로 분석할 수 있습니다.판매단가는 수돗물을 공급할 때의 단위당 판매 가격이며, 생산원가는 물을 생산하는 데 소요되는 비용을 나타냅니다. 현실화율은 실제 요금이 생산원가 대비 어느 정도를 반영하는지를 나타내는 지표로, 지방자치단체의 요금 현실화 수준을 판단하는 데 활용됩니다.이 데이터는 수도 정책의 효율성 평가, 요금 구조 개선, 상수도 재정 건전성 분석, 환경 및 자원 절약 캠페인 설계 등 다양한 행정 및 연구 목적으로 활용될 수 있으며, API를 통한 외부 연계도 지원됩니다.
