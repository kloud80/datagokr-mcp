description_portal: '서울특별시 도시건축공동위원회 심의안건 결과입니다.위원회 개최결과, 담당부서, 개최일, 개최결과 내역 등의 정보를 제공합니다.*용어설명도시건축공동위원회란? 도시계획위원회와 건축위원회를 통합 운영하는 위원회- 도시계획과 건축을 별개로 심의하면 중복·지연이 발생하는 문제가 있어, 두 기능을 하나의 위원회로 합친 것- 법적 근거 : 「국토의 계획 및 이용에 관한 법률」 제113조, 「건축법」 제4조 등 관련 규정.< 설치 목적> - 심의 절차 간소화(기존: 도시계획위원회 → 건축위원회 두 번 심의)                                   개편: 도시건축공동위원회 한 번에 심의 → 행정 효율성 ↑                                             도시와 건축의 연계성 강화- 도시계획(용도지역, 지구단위계획 등)과 건축(개별 건축물 설계, 경관 등)을 종합적으로 고려. - 전문성 보장 : 도시계획, 교통, 환경, 건축, 조경 등 다양한 전문가들이 함께 심의.'
