description_portal: 쾌적하고 살기 좋은 주거환경 조성에 필요한 주택의 건설ㆍ공급 및 주택시장의 관리 등에 관한 사항을 정함으로써 국민의 주거안정과 주거수준의 향상에 이바지함을 목적으로 하는 주택법에 의거한 주택건설사업계획승인과 관련됩니다.2026년 2분기 기준, 대한민국 경상남도 진주시 관내 공사중인 (민간)주택건설 사업계획의 승인현황 자료를 공개합니다.해당 데이터에서는 공사중인 주택건설 사업계획의 단지명, 소재지, 시공자, 세대수, 연면적 및 사업승인, 착공, 분양 날짜, 그 외 정보 등의 세부항목을 확인할 수 있습니다.
