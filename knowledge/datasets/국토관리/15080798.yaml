description_portal: 부산광역시는 시 본청 및 사업소, 산하 구.군에서 관리하는 도시기반시설인 도로, 상수도, 하수도 등의 시설물 정보를 GIS기반으로 데이터베이스화 하여 관리하는 도시공간정보시스템을 구축 운영하고 있습니다.본 자료는 부산 도시공간정보시스템에서 관리되고 있는 기본도의 지반시추 정보로, 프로젝트 코드 및 명칭, 시추공 코드 및 명칭, 고도, xy좌표(GRS80기준) 정보를 제공하고 있으며, 국토교통부에서 관리하고 있는 지반시추 정보를 요청하여 제공받아 업무에 활용하고 있는 자료 입니다.
