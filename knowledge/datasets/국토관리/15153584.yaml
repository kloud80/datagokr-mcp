summary_user: K-water가 관리하는 유사량관측소 50곳의 속성(관측소명, 하천명, 표준유역명, 경위도, 영점표고, 지정홍수위, 유역면적 등)을 관측소 한 곳당 한 행으로 담은 전국 단위 목록 파일이다. 수문 분석가나 하천 계획 담당자가 특정 하천의 유사량관측소가 어디에 있고 유역 규모와 기준 표고가 어떠한지 확인하는 데 쓴다. 경도·위도 좌표 키로 다른 수문 관측소나 하천 공간 데이터와 위치 기준으로 이어 쓰며, 관측소코드 같은 별도 식별 키는 필드에 없다.
description_portal: '한국수자원공사(K-water)에서 관리하는 유사량관측소 정보입니다.(관측소 속성) - 관측소명 - 대권역 - 하천명 - 관측소영문명 - 표준유역명 - 전송방법명 - 경도 - 위도 - 영점표고 - 수준거표표고 - 최고독수 - 지정홍수위 - 유역면적 - 하구합류점거리유사량이란? 자료가 부족하거나 없는 지역(미계측 유역)의 수문량(유출량, 홍수량, 저수량 등)을, 지형·기후·토지이용 조건이 유사한 인근 유역의 실측 자료를 활용하여 추정하는 값1. 주요 사용 목적   댐·보의 설계홍수량 산정, 미계측 소유역의 장기 유출량(연간·월별 물량) 추정, 용수개발 가능량, 가뭄해석, 기후변화 영향평가 등2. 유사량 산정 방법 (3단계 절차)한국수자원공사, 환경부, 국립재난안전연구원 등에서 가장 많이 쓰는 3단계 절차입니다.1. 유사 유역 선정  다음 항목이 비슷한 유역을 1~3개 선정 - 유역면적 (가장 중요) - 평균 해발고도, 평균 경사 - 지질·토양 특성 - 연강우량, 강우 패턴 - 토지피복(임상비율, 도시화율 등)2. 유사도 지수 계산 (필요시)  단순히 면적비만 쓰는 경우도 많지만, 정밀하게 할 때는 아래와 같은 가중점수 사용  예시: 유사도 점수 = 0.4×(면적비) + 0.3×(강우비) + 0.2×(임상비율 차이 역수) + 0.1×(경사비)3. 유사량 환산 가장 기본적인 식 (면적비 보정)'
