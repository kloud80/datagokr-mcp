summary_user: 충청남도에서 추진된 도시개발사업을 지구(사업) 한 건당 한 행으로 정리한 파일(csv, 약 4KB)로, 지역·지구명·시행자·구역면적(㎡)·계획세대·계획인구·사업기간·진행사항과 2023년까지 실적 및 2024년 계획을 담는다. 충남 어느 시군에 도시개발구역이 몰려 있는지, 특정 지구의 시행자와 계획 세대·인구, 준공 여부를 확인하려는 주민·부동산 사업자·지역정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역(시군) 이름이나 지구명을 문자열로 맞춰 연결한다.
description_portal: 이 데이터는 2024년 7월 2일 기준으로 충청남도에서 추진된 도시개발사업의 현황을 집계한 자료입니다. 주요 항목에는 시군명, 사업명, 위치, 면적(㎢ 또는 ha), 개발방식(환지·수용 등), 시행자, 사업기간, 추진단계(추진 중·준공 등) 등이 포함됩니다. 이를 통해 충남 내 도시개발사업의 공간적 분포와 규모를 확인할 수 있으며, 지역별 개발 편차와 집중도를 분석할 수 있습니다. 특히 면적과 사업기간을 함께 보면 대규모 장기 개발사업과 소규모 단기 사업을 구분할 수 있고, 개발방식에 따라 행정·재정적 특성을 비교할 수 있습니다. 또한 추진단계 항목은 현재 진행 중인 사업과 완료된 사업을 구분하여 정책적 성과를 평가하고 향후 지원이 필요한 지역을 도출하는 데 유용합니다. 이 데이터는 도시계획 수립, 주거 및 상업용지 공급 정책, 기반시설 확충, 지역균형발전 전략 마련 등 다양한 분야에서 기초 자료로 활용됩니다.
