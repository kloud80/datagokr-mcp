summary_user: 무안군 도시계획정보시스템(UPIS)의 고시 테이블을 옮긴 파일로, 도시계획 결정·변경·해제 고시를 건별로 고시일자·고시번호·제목·내용 단위로 담는다(CSV 약 196KB, 범위는 무안군 한 시군구). 무안군에서 특정 지역의 용도지역이나 도시계획시설이 언제 어떤 고시로 결정·변경됐는지 확인하려는 주민·사업자·분석가가 개발 가능성의 선행 지표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 고시번호·제목 속 지명이나 같은 기관 코드로 맞춰 이어 써야 한다.
description_portal: 전라남도 무안군 도시계획 고시 데이터는 무안군 도시계획정보시스템(UPIS)에 수록된 고시 테이블의 내용을 제공하는 자료입니다. 이 데이터는 무안군에서 시행하는 도시계획의 결정, 변경, 해제 등과 관련된 주요 행정 고시 사항을 체계적으로 관리하기 위해 구축되었습니다.주요 컬럼으로는 고시일자, 고시번호, 고시제목, 고시내용 등이 포함되어 있으며, 이를 통해 고시된 도시계획의 법적 근거와 행정 절차, 적용 범위를 명확히 확인할 수 있습니다.해당 자료는 무안군의 도시계획 추진 현황을 주민과 이해관계자에게 투명하게 공개하고, 정책 수립 및 도시 개발관리 과정에서 중요한 행정적 참고자료로 활용됩니다.
