summary_user: 광주광역시 지역특화거리 안에 있는 점포를 한 행씩 담은 건별 목록으로, 거리명·점포명·업종 분류·지번/도로명 주소·전화번호·배달서비스 여부·취급품목·주력상품과 위도·경도를 담는다(CSV 약 18만 바이트). 창업 준비자나 상권 분석가가 '특정 음식·문화 특화거리에 어떤 업종 점포가 몰려 있고 배달을 하는 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 점포명·거리명 매칭으로만 잇고, 위도·경도로 지도나 상권 데이터에 겹쳐 본다.
description_portal: 광주광역시 지역특화거리 내 점포현황(점포명, 업종분류, 소재지지번주소, 소재지도로명주소, 전화번호, 배달서비스 여부 등)에 관한 데이터입니다.이 자료는 특히 문화예술 테마거리, 음식 특화거리, 디자인 거리처럼 광주 지역만의 특색 있는 상권 구성을 이해하고자 하는 분석가, 지방자치단체, 창업지원기관, 혹은 도시계획 담당자들에게 적합합니다. 실제로 광주광역시는 이 데이터를 빅데이터 통합플랫폼과 공공데이터포털을 통해 개방하여 (전통시장·특화거리 데이터 포함 총 22종 데이터) 창업 활성화 및 상권 전략 수립을 지원하고 있습니다
