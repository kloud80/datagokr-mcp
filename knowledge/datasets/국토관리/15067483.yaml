summary_user: 국토지리정보원 항공사진 촬영기록부 가운데 촬영코스 정보를 담은 파일로, 사업지구·촬영일자·렌즈·코스번호별로 개시시간, 노출·조리개·필터 같은 촬영조건, 촬영방향·각도, 사진 매수, 진행방향·촬영 중복도를 한 행씩 기록한다(전국 범위, CSV 약 7.7MB). 특정 사업지구 항공사진이 언제 어떤 방향과 조건으로 촬영됐고 중복도가 얼마였는지 확인하려는 측량·공간정보 분석가가 정사영상 제작이나 사진 품질을 검토할 때 쓴다. 전역 조인 키는 없으므로 같은 기관의 다른 항공사진 데이터(촬영기록부·사진 목록 등)와 사업지구코드·촬영일자·코스번호를 이름 그대로 맞춰 이어 쓴다.
limits: 공식 조인 키가 없어 다른 데이터와는 사업지구코드·코스번호 같은 컬럼 값을 직접 맞춰야 하며, 연결이 보장되지 않는다. 좌표가 없는 비공간 기록이어서 이 파일만으로 촬영 위치를 지도에 표시할 수 없다.
