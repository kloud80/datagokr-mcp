summary_user: 서울특별시 주택 인허가 건의 동(건물)별 개요를 담은 데이터로, 주건축물과 부속건축물(경비실·지하주차장·펌프실 등) 구분, 용도, 구조·지붕, 바닥면적·연면적, 지하·지상 층수, 높이·층고·천장고, 벽 두께와 공공임대·민간임대·분양 세대 수를 동 단위로 담는다. 공동주택 관리자나 분석가가 "이 단지에서 공공임대 세대가 있는 동은 어디이고 각 동의 구조·층수는 어떤가"처럼 단지 내 시설 현황과 임대 구성을 확인하는 데 쓴다. 전역 조인 키는 없으며, 대지위치·시군구명·법정동명·본번/부번(MN_LOTNO) 같은 주소·지번 이름을 맞춰 건축물대장이나 다른 주택 인허가 데이터와 연결한다.
description_portal: 아파트 단지 내 부속건축물 현황을 상세히 정리한 것입니다. 포함된 부속건축물은 MDF실, 경비실 1·2, 지하주차장, 펌프실 등으로, 각 시설별 용도, 구조, 지붕 형태, 바닥면적, 연면적, 지하·지상층 수, 층고, 천장 높이, 외벽 두께 등의 물리적 특성이 기록되어 있습니다. 또한 공공임대, 민간임대, 분양 여부와 관련된 세대 수 정보가 포함되어 있어 주거 형태나 시설 활용 현황 파악이 가능합니다.  이 데이터는 공동주택 관리, 시설 안전 점검, 유지보수 계획 수립, 건축물 구조 분석, 재난 대비 설비 점검 등 다양한 행정 및 기술적 목적으로 활용될 수 있습니다.
