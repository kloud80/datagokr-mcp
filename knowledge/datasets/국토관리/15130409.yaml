summary_user: '인천광역시 강화군 관내에 공장등록된 제조업체를 업체 한 곳씩 담은 목록으로, 업체명·사업자등록번호·공장주소·생산품·업종명·데이터기준일자를 제공하며 범위는 강화군 한 개 시군구다. 강화군에서 특정 품목(예: 인삼 가공품)을 생산하는 공장이 어디에 있는지 찾으려는 사업자나 지역 산업 구성을 업종별로 살피려는 분석가가 쓴다. 사업자등록번호(bizno)가 실측 조인 키라서 사업자 상태 조회나 다른 기업 목록과 업체 단위로 이어 쓰고, 공장주소는 주소 기반 위치 정보와 맞춰 쓴다.'
