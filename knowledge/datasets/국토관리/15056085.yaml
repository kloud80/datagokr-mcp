summary_user: 서귀포시 안에 있는 유흥주점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·주소·위도·경도·데이터기준일자를 담는다(약 24KB CSV). 행정 담당자나 분석가가 "서귀포시 어느 동네에 유흥주점이 몰려 있나"를 지도에 찍어 보거나 점검·단속 대상 지역을 고를 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 좌표를 기준으로 공간 결합하거나 업소명으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 서귀포시 내에 위치한 유흥주점의 기본 정보를 제공합니다. 업소명, 도로명·지번 주소, 위도·경도 등의 항목이 포함되어 있어, 행정기관은 공간 기반 행정 관리 및 위치 기반 서비스 개발에 활용할 수 있습니다. 예를 들어, GIS 지도 시각화, 특정 지역 단속 대상 분류, 유흥업소 밀집도 분석, 안전/위생 점검 계획 수립, 민원 대응, 재난 대비 교통 안내 등에 유용합니다. 또한, 관광객 유입 분석이나 지역 상권 변화 모니터링에도 기초 자료로 활용 가능합니다. 공간 좌표가 포함된 데이터는 다양한 디지털 행정·서비스 운영에 중요한 기초 인프라가 될 수 있습니다.
