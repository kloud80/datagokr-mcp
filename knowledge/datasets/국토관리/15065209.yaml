summary_user: 전국 시도·구군별 공공하수처리시설마다 하수 찌꺼기 발생량(자체·외부유입), 이송처리량, 함수율, 처리량 합계와 자체 처리 방식(매립·소각·고화·건조·탄화·퇴비화) 및 2차 처리, 외부 위탁처리량을 처리장 한 곳당 한 행으로 담은 파일이다. 지자체 하수도 담당자나 분석가가 '우리 시군구 하수처리장의 찌꺼기는 얼마나 나오고 소각·건조·위탁 중 어떤 방식으로 처리되는가'를 확인하고 처리방식별 운영 계획을 검토할 때 쓴다. 전역 조인 키가 없어 하수처리장 원장이나 방류수 수질(TMS) 자료와는 처리장명·시군구 이름을 맞춰 연결해야 한다.
description_portal: 공공하수처리시설 찌꺼기 처리 현황 데이터는 전국 시도 및 구군별 하수처리장에서 발생하는 찌꺼기의 발생과 처리 실태를 종합적으로 제공하는 자료입니다. 주요 항목에는 하수처리장명, 찌꺼기 발생량(합계,자체,외부유입량), 이송처리장 및 이송처리량, 함수율(%), 처리량 합계(톤/년), 자체 처리 방식별 현황(매립,소각,고화,건조,탄화,퇴비화)과 외부 위탁처리량, 수도권 광역 위탁처리량 등이 포함됩니다. 본 자료는 지자체별 하수찌꺼 관리 현황을 파악하고 처리방식별 운영 특성을 파악하며, 향후 운영 계획 수립 검토에 참고자료로 활용 가능합니다.
