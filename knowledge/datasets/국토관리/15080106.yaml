summary_user: 동두천시 관내 일반건축물별 시가표준액(원)을 물건지·연면적·납부년도와 함께 건물 단위로 담은 파일로, 포털 설명상 과세연도는 2025년이다. 동두천시 건물 소유자나 분석가가 "이 건물의 재산세 과세 기준이 되는 시가표준액은 얼마인가"를 확인하거나 연면적 대비 금액을 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 물건지 주소 문자열이나 자치단체코드(같은 기관 범위)로만 맞춰 이어 쓴다.
description_portal: 경기도 동두천시의 일반건축물시가표준액 정보를 민원인에게 제공하고자 합니다.데이터는 동두천시 관내 일반건축물에 대해  시가표준액을 포함하고 있으며 시도명, 시군구명, 과세연도, 주소지번, 물건지, 연면적, 기준일자 등의 정보입니다.시가표준액은 과세자료로 활용되는 표준 금액이며 과세연도는 2025년 이고 데이터의 기준일자는 2026년 7월 15일입니다.데이터에 대하여 추가 문의사항이 있으실 경우 동두천시청 세무과 재산세팀 031-860-2201로 문의주시기 바랍니다.
