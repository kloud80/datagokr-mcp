description_portal: 서울특별시 마포구에 소재하고 있는 아파트 공사장 현황입니다.도시화의 진전과 주거환경 개선, 인구 유입에 따른 주택 수요 증가에 따라 아파트 신축 및 재건축 공사장이 늘어나고 있으며,도시계획 수립, 주거안정 정책 추진, 건설안전 관리, 생활환경 보호 및 지역 개발 계획 수립 등 다양한 목적에서 아파트 공사장에 대한 정보 수요가 꾸준히 증가하고 있습니다.이에 따라, 마포구에서 진행한 공사장 현황과 관련된 공사명, 위치, 공사규모(건물 층, 면적 단위 ㎡), 세대수, 공사기간(년,월), 시공사 등 정보를 제공합니다.
