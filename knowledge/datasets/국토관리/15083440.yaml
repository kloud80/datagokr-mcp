description_portal: 부산광역시 상수도사업본부에서 상하수도 요금 계산 및 징수를 위해 운영하는 수용가정보시스템에 사용되는 간단e납부 시스템 연계(일반수납내역 분배 자료) 자료입니다.상하수도 일자별 수납정보는 지방자치단체가 상수도 및 하수도 사용료의 납부 현황을 수용일자별로 관리하는 데이터입니다.주로 수용일자, 고지서에 명시된 납기, 실제 납부된 금액, 체납 여부 등을 포함하고 있습니다.사용자는 이 정보를 통해 매월 말일까지 부과되는 수도요금의 납부 여부를 정확히 확인할 수 있습니다.공공데이터포털이나 각 지자체 수도사업소 홈페이지, 위택스 등에서 조회 및 다운로드가 가능합니다.
