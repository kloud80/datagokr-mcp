summary_user: 세종특별자치시에 등록된 건설업체를 업체 1곳당 1행으로 담은 파일로, 상호·업종(토목공사업, 건축공사업, 조경공사업 등)·도로명주소·지번주소·전화번호를 포함하며 포털 설명 기준 총 609개 업체가 실려 있다. 지역 건설사를 찾는 주민이나 협력업체를 물색하는 사업자가 "세종시 조치원읍에 있는 조경공사업 등록업체는 어디인가" 같은 질문에 쓴다. 전역 조인 키는 없으며, 다른 데이터와는 상호명이나 주소(읍·면·동)를 매칭해 붙여 쓴다.
description_portal: 세종특별자치시의 건설업체 등록현황에 대한 자료입니다.데이터는 번호, 상호, 업종(토목공사업, 토목건축공사업, 조경공사업, 건축공사업 등), 도로명주소, 지번주소, 전화번호로 구성되어 있으며데이터 기준일 현재 세종특별자치시에는 총609개의 건설업체가 등록되어 있습니다. (주)금성백조건설, (주)신우건설, (주)장벽종합건설, (주)코리아에이아이종합건설, (주)플랜에이앤씨종합건설, 에스제이종합건설(주),(주)베어트리조경디자인,(주)세기엔지니어링 등이 소담동, 연기면, 연서면, 금남면, 보람동, 조치원읍 등에 소재하고 있습니다.이 데이터는  세종특별자치시 교통국 도로과에서 관리하고 있는 데이터입니다.문의사항은 044-300-5155로 연락주시기 바랍니다.
