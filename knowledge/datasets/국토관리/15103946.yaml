summary_user: 광주광역시 북구 관내 지역주택조합을 조합 한 곳당 한 행으로 담은 현황 파일(CSV, 약 3KB)로, 조합명·사업위치(지번)·층수와 동수·세대수·조합원수·토지사용권원과 소유권 확보 현황, 그리고 모집신고부터 설립인가·사업승인·착공·사용검사·해산인가까지의 단계별 날짜를 담는다. 북구에서 지역주택조합 가입을 검토하는 주민이나 주택 공급을 분석하는 사람이 특정 조합이 설립인가나 사업승인을 받았는지, 사업이 어느 단계까지 진행됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업위치 지번주소나 조합명을 맞춰 보거나 같은 기관의 데이터끼리만 연결할 수 있다.
limits: 북구 한 개 시군구만 다루므로 광주 전체나 다른 지역의 주택조합 현황은 이 파일로 알 수 없다. 공통 코드 키가 없어 주소나 이름 매칭으로 연결해야 하고, 설립인가 전 조합은 조합명이 가칭으로 표기돼 있어 이름 매칭에 주의해야 한다.
