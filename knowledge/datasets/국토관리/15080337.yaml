summary_user: 담양군 일반건축물의 지방세 부과기준인 시가표준액을 과세년도별로 건물(동·호) 단위로 담은 건별 원천 파일이며, 포털 설명상 2018~2022년 5개년 자료로 물건지·연면적·시가표준액을 포함한다. 담양군에 건물을 가진 국민이나 세무·부동산 분석가가 "이 건물의 연도별 시가표준액이 얼마였고 재산세 과세표준의 출발점은 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 법정동·법정리·본번·부번 등 지번 정보를 이름·코드로 맞춰 건축물대장이나 공시지가 같은 필지·건물 데이터와 잇고, 자치단체코드로 같은 기관 자료와 연결한다.
