description_portal: 서울시 가로수 위치정보 데이터는 서울 전역 가로수의 공간적 분포와 생육 상태, 관리 현황을 종합적으로 파악할 수 있도록 구축된 자료입니다. 구명, 구번호, 순번, 수목고유번호 등으로 각 가로수를 식별할 수 있으며, 수목명, 품계수종, 수고, 흉고지름, 수관너비, 품계활력, 품계위치 등 세부 생육 정보를 제공합니다. 또한 관리등급, 관리기관, 전정, 피해정도, 관리방안, 현존유무, 환경영향, 방재, 보호덮개 등 가로수의 유지관리 및 안전 관련 항목을 포함하고 있습니다. 도로길이, 차선수, 위치, 주변토지사용상태, 가로명과 함께 위도, 경도 좌표를 제공하여 지도 기반 분석과 공간정보 시스템에 활용하기 적합한 데이터입니다. 이를 통해 도시녹지 관리, 가로수 건강진단, 보행환경 개선 및 도시경관 계획 수립에 기초 자료로 활용할 수 있습니다.
