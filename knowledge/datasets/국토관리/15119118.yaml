summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 건축한계선 도형을 건별로 담은 파일로, 도형마다 공간정보·현황도형·규제 관리번호, 좌표 범위(X·Y 최솟값·최댓값), 도형 생성일시가 들어 있으며 파일 크기는 약 1KB로 작다. 진안군에서 건축이나 개발을 검토하는 사업자·분석가가 특정 위치에 건축한계선 규제가 걸려 있는지를 좌표 범위로 1차 확인할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 규제관리번호나 같은 기관(진안군)의 UPIS 데이터셋 기준으로 이름·번호를 맞춰 연결하고, 좌표 범위는 지도·필지 데이터와 공간으로 겹쳐 본다.
limits: 표준 행정코드 같은 전역 조인 키가 없어서 다른 지역·기관 데이터와 자동으로 결합하기 어렵다. 좌표는 도형을 감싸는 사각형 범위만 담고 실제 선 형상은 없으며, 명세상 갱신은 수시 또는 이벤트 때만 이뤄진다.
