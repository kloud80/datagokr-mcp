summary_user: 가축분뇨의 관리 및 이용에 관한 법률에 따라 지정된 가축사육제한구역을 도시관리계획 지역정보로 담은 공간 파일(SHP)로, 전국을 시도별 파일 단위로 제공한다. 축사 신축이나 귀농·토지 매입을 검토하는 사업자·국민이 특정 필지가 가축사육제한구역에 걸리는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 고시일자·시군구 식별값 같은 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 포털 활용신청이 아니라 vworld.kr에 로그인해 시도별 파일을 직접 내려받아야 한다. 공통 조인 키가 없어 지적·건축물 데이터와 바로 결합되지 않고, 공간 중첩 분석이나 별도 매핑이 필요하다.
