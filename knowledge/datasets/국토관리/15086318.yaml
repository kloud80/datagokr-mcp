summary_user: 한강홍수통제소 홍수예보시스템의 수리학적 모형(FLDWAV)에 하류단 경계조건으로 넣는 조위 자료를 예보유역별·시각(년월일시분)별 조위 값으로 담은 파일(csv, 약 1.8MB)이다. 수자원·하천 분석가가 감조하천 구간에서 밀물·썰물이 홍수 예측 수위에 어떤 경계조건으로 반영됐는지 확인하거나 모형을 재현할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 홍수예보·수위 자료와는 예보유역 이름과 시각을 맞춰 연결해야 한다.
description_portal: 한강홍수통제소에서 수집, 관측 중인 예보유역 별 수리모형조위자료입니다. 예보유역 명, 년월일시분, 예측수리 조위자료 등 데이터를 제공합니다.홍수예보시스템에서 수리학적모형으로는 FLDWAV 모형을 사용중입니다.FLDWAV(Flood Wave) 모형에서 하류단 경계조건으로 사용되는 것이 조위 자료입니다.조위자료는 시간, 조위로 구성됩니다.FLDWAV 모형에서 하류단 경계조건(Downstream Boundary Condition)으로 조위자료(Tide Data)를 사용하는 것은 주로 감조하천(조석의 영향을 받는 하천)의 흐름을 분석하기 위함입니다.하천의 끝단이 바다나 외해와 연결되어 있다면, 하천의 수위와 유량은 단순히 상류에서 내려오는 물의 양뿐만 아니라 바다의 밀물과 썰물(조석)에 의해 직접적인 영향을 받게 됩니다.
