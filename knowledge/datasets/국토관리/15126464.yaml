summary_user: 신고된 오피스텔 매매 실거래를 건별로 담은 API로, 거래금액(만원)·전용면적·층·건축년도·계약일·단지명과 매수·매도자 구분, 해제 여부를 포함하며 범위는 전국이다. 오피스텔을 사려는 국민이나 분석가가 특정 시군구·계약월의 오피스텔 매매가가 얼마였는지 확인하는 데 쓴다. 시군구 코드(sggCd, 법정동 앞 5자리)가 조인 키라서 같은 키를 쓰는 다른 실거래 종류나 지역 단위 데이터와 이어 쓴다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월 6자리(예시 : 201801)로 해당 지역, 해당 기간의 오피스텔 매매 실거래가 상세자료를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 오피스텔 매매 자료를 제공하는 오피스텔 매매 실거래가 상세 자료 조회. 세부사항 참고자료 참고.* 공개내용 중 개인정보보호를 위해 오피스텔 매매의 층정보만 제공됩니다.'
