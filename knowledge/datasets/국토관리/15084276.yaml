summary_user: 제주국제자유도시개발센터(JDC)가 세미양빌딩 문화공간 '낭'에서 2019년 기준으로 관리한 도서를 한 권(종)씩 담은 목록으로, 도서명·저자·ISBN·출판사·발행연도와 수량·단가·금액·견적금액, 분야(어린이베스트 등)를 담는다. 공공 문화공간의 장서 구성이나 어린이 도서 구입 단가·견적 대비 실제 금액을 살펴보려는 분석가나 담당자가 '이 공간에 어떤 분야 책을 얼마에 들였나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 다른 도서 목록과는 ISBN이나 도서명·저자로 직접 맞춰 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 세미양빌딩 내 문화공간 "낭"에서 2019년을 기준으로 관리된 도서 목록 정보를 정리한 자료입니다. 각 데이터 항목은 연번, 도서명, 저자, 저자2, ISBN, 발행자(출판사), 발행연도, 책수, 수량, 단가, 금액, 견적금액, 분야로 구성되어 있으며, 세부 항목을 통해 도서의 기본 정보부터 가격과 수량, 장르까지 종합적으로 파악할 수 있습니다. 도서명과 저자, ISBN은 책의 고유 식별 정보를 제공하고, 발행자는 출판사 명칭, 발행연도는 출판 시기를 나타냅니다. 책수와 수량은 해당 도서의 입고 및 보유 규모를 보여주며, 단가와 금액, 견적금액 항목은 예산 책정과 실제 구입 내역을 비교 분석하는 데 유용한 정보입니다. 분야 항목은 어린이베스트, 어린이문학베스트, 어린이교양베스트 등으로 구분되어 있어 도서의 주제 및 대상 독자층을 분류할 수 있으며, 이를 통해 문화공간 '낭'의 도서 구성 방향, 어린이 독서지원 프로그램 설계, 자료 구입의 효율성 검토 등 다양한 문화행정 목적에 활용될 수 있는 기초 데이터를 제공합니다.
