summary_user: 전국 공공 택지개발 사업지구의 주택건설계획을 블록 단위로 담으며, 지구지정번호·지구명 아래 블록별 면적, 주택유형·규모, 세대수, 계획인구수, 용적율, 평균평형, 층고구분, 공급유형, 임대기간을 기록한다. 분석가나 사업자가 어느 택지지구의 어떤 블록에 분양·임대 주택이 몇 세대, 어떤 규모로 계획돼 있는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 택지정보시스템의 다른 지구 데이터와는 지구지정번호·지구명 같은 이름·코드 매핑으로 이어 쓴다.
limits: 포털 활용신청과 별개로 외부 사이트 인증키가 필요하다. 명세상 수시·이벤트 주기로 생성되는 데이터라 정기 갱신을 전제로 하면 안 되며, 법정동·좌표 같은 공간 정보가 없어 지도 위 위치 분석은 못 한다.
