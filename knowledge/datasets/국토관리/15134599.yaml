summary_user: 인천광역시 도시기반시설물시스템의 주민등록 인구를 수집년월별로 시군구·행정동·통 단위로 묶어 남녀 인구수와 10세 구간(0-9세부터 100세 이상까지) 성별 인구수를 담은 집계 파일이다. 도시계획·시설 담당자나 분석가가 '이 행정동에는 고령 인구나 어린이 인구가 얼마나 사는가'처럼 지역별 인구 구조를 보고 시설 수요를 따질 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 데이터와는 시군구명·행정동명 이름 매칭으로만 이어 쓴다.
description_portal: 인천광역시 도시기반시설물시스템 내 행정구역 성연령별 주민등록 인구수를 나타내고 있습니다. 항목 구성은 법정기관코드, 시도명, 시군구명, 법정동명, 연령별 남여 인구수 등으로 구성되어 있습니다.이 데이터는 인천광역시의 각 행정동별 주민등록 인구 현황을 성별과 연령별로 매우 상세하게 분석한 자료입니다. 특정 행정동의 인구 구조를 정확히 파악하고, 이에 따른 맞춤형 정책을 수립하는 데 필수적인 기초 통계를 제공합니다. 행정동은 주민센터와 같은 행정 서비스를 제공하는 구역을 기준으로 나뉘며, 법정동과는 구분됩니다.해당 데이터는 공공데이터포털에서 무료로 다운로드 할 수 있습니다.
