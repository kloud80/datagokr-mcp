summary_user: 충청북도 제천시의 개발행위허가를 허가 건별로 담은 파일 데이터로, 허가번호·소재지(읍면동·리·지번)·용도지역·허가면적·용도·허가일·준공일을 필지 단위로 기록한다. 제천시에서 토지 개발을 검토하는 사업자나 분석가가 '어느 읍면동, 어떤 용도지역에서 어떤 용도로 얼마만큼의 면적이 허가되고 준공됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 읍면동·리·지번 같은 주소 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 표준 행정코드나 필지 고유번호가 없어 주소 문자열 매칭으로만 다른 데이터와 연결된다. 범위는 제천시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다. 명세상 갱신은 연간이다.
