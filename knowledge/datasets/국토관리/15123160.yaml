summary_user: 경기도 광주시 도시계획정보시스템에 등록된 관리지역 도형을 한 건씩 담은 파일로, 도형마다 관리번호·라벨명·면적·경계 길이·등록일시를 시군구 단위로 기록한다. 개발행위허가를 검토하는 사업자나 토지이용을 분석하는 담당자가 '광주시 안 관리지역은 어디이고 면적이 얼마인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 시군구코드·시군구명으로 같은 지역의 다른 용도지역(도시·농림·자연환경보전) 현황과 이름·코드 매핑으로만 맞춰 쓴다.
limits: 필지 단위 키가 없어 지번·필지 정보와 바로 이어 붙일 수 없고, 다른 데이터와는 시군구 코드나 이름 매핑으로만 연결된다. 범위는 광주시 한 곳의 시군구 단위이다.
