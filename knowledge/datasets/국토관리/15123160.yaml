description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 관리지역 현황 정보를 제공합니다. 도시지역과 농림지역 사이에서 도시 확산에 대비하거나 농림 지역을 보호하기 위해 지정된 관리지역의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 지역을 고유하게 식별하며, 라벨명은 관리지역의 명칭이나 구분을 나타냅니다. 면적은 관리지역이 차지하는 면적을 제공하고, 길이는 경계선의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 용도지역 관리, 개발 행위 허가 심사, 토지 이용 계획, 도시 성장 관리, 환경 보전 정책 등에 활용됩니다.
