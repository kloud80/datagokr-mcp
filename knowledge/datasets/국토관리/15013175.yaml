description_portal: '- 한국도시통계는 전국 지방자치단체의 기본여건(인구, 거주 등), 경제, 사회, 환경 등의 모습을 한 눈에 비교할 수 있도록 13개 분야 53개 항목을 수록한 지역종합통계로 행정수행에 필요한 기초자료를 제공하고, 지역을 연구하고 정책 수립 과정 등에 지원을 목적으로 하고 있습니다.- 연혁으로 "한국도시통감"(1966년)을 시작으로 2010년 "한국도시통계"로 변경승인되어 현재까지 매년 작성하고 있습니다.- 작성기준일은 해당연도 전전년을 기준(예 2025년 공표, 2023년 기준)으로 하고 있고 KOSIS, 행정안전부 누리집을 통해 공개하고 있습니다.- 한국도시통계는 지역경제 연구 및 지역정책 계획 수립에 활용하거나 지역수요에 부응하는(이용자중심) 지역통계 개발과 통계정책 수립 등에 활용하고 있습니다.- 현재 타 승인통계와 지자체 기본통계와 상호 연계성 확보를 통해 수요자가 필요한  통계를 신뢰도 높게 제공을 위해 노력하고 있습니다.'
