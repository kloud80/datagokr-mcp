summary_user: 경기주택도시공사가 공급하는 업무·산업시설·단독주택·준주거·숙박시설·종교용지 등의 토지 분양을 분양 회차별·필지별로 담은 파일(CSV, 약 18만 바이트)로, 개발지구번호, 분양회차명, 공급방법, 선정방식, 추첨구분, 입찰보증금율, 판매필지번호, 계약 장소와 계약 기간을 담는다. 토지 청약을 검토하는 개인·사업자가 특정 개발지구의 이번 회차에 어떤 필지가 추첨인지 입찰인지, 보증금율과 계약 일정은 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개발지구번호·분양공고일련번호 같은 기관 내부 코드나 지구명·회차명 매칭으로만 연결한다.
description_portal: 업무시설용지, 산업시설용지, 단독주택용지, 준주거용지, 숙박시설용지, 종교용지 등 경기주택도시공사에서 공급하는 토지의 분양을 위한 경기주택도시공사 토지분양시스템의 메타데이터 기반 분양 회차별로 필지에 대한 상세 정보를 제공하는 데이터로써 개발지구번호, 분양횟수, 분양공고일련번호, 분양회차명, 공급방법, 선정방식, 추첨구분, 입찰보증금율, 판매필지번호, 메인필지여부, 가지번, 계약장소, 계약시작일시, 계약종료일시 등의 정보를 포함하고 있습니다. 이 데이터는 회차별로 공급되는 토지의 세부정보를 파악하고 청약자에게 명확히 안내하기 위한 자료로 사용되며, 시스템 내 필지 매칭, 분양대상자 확인 및 계약체결 절차에 필요한 핵심정보로 활용됩니다.
