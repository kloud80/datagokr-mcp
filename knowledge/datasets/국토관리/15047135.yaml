description_portal: '○ 통계개요* 통계명 : 주택건설 현황* 통계종류 : 서울시 주택건설 현황을 주택종류별로 제공하는 일반ㆍ보고통계* 근거법령 :「건축법」제8조 제9조,「주택법」제16조* 작성목적 : 생활을 같이하는 가구가 거주하는 공간으로써 주택건설 현황을파악하여 주택건설관련 정책수립의 기초 자료로 활용하는 것을목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부(주택공급통계정보시스템)* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 주택건설 현황 등○ 용어설명* 단독주택 : 한가구가 생활할 수 있도록 건축된 일반단독주택과 여러 가구가 살 수있도록 설계된 다가구 단독주택을 말함* 연립주택 : 한 건물내에 여러가구가 살 수 있도록 건축된 4층이하의 영구건물로서건축 당시 연립주택으로 허가받은 주택을 말함* 아파트 : 한 건물내에 여러 가구가 거주할 수 있도록 건축되어진 5층이상의 영구건물로서구조적으로 한 가구씩 독립하여 살 수 있도록 건축된 주택을 말함* 다세대주택 : 한 건물내에 여러 가구가 살 수 있도록 건축된 4층 이하의 영구건물로서건물의 연면적이 200평 이하이면서 건축당시 다세대 주택으로 허가받은 주택을 말함'
