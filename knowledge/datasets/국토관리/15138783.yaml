summary_user: 세종시 행정중심복합도시 안에서 추진 중인 공공건축물·복합시설 건설사업을 연도·월별로 사업 한 건씩 담은 파일(csv, 약 12KB)로, 사업명·공정 상태·계획 대비 실적·공사 시작일과 종료 예정일·공사 규모·도급사·총사업비를 담는다. 행복도시 개발을 연구하거나 지켜보는 분석가·시민이 '이 공공건축물 공사는 계획 대비 공정이 얼마나 진척됐고, 언제 끝나며, 사업비는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명이나 도급사 이름으로 맞추거나, 같은 기관(행정중심복합도시건설청)의 다른 자료와 묶어서만 이어 쓴다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 내 건설사업 현황을 제공하는 자료로, 연도와 월별로 추진 중인 주요 건축·시설 사업의 진행 상태를 확인할 수 있습니다. 각 사업별로 사업명, 공정 상태, 계획 대비 실적, 공사 시작일과 종료 예정일, 건축 규모, 시공사(도급사), 총사업비 등의 정보가 포함되어 있습니다.이를 통해 행복도시 내 공공건축물 및 복합시설 건립 사업의 진척도, 예산 규모, 일정 관리 현황을 한눈에 파악할 수 있으며, 도시개발 연구, 건설사업 투자 관리, 정책 모니터링 및 행정 의사결정 지원에 활용할 수 있습니다.
