summary_user: 경기도 시군별·월별(crtr_ym)로 전입·전출 이동자 수를 성별과 5세 단위 연령대(0세부터 80세 이상까지)로 나눠 담은 집계표로, 전입전출구분은 전체·전입·전출 세 가지다. 지자체 정책 담당자나 분석가가 "우리 시로 20대 후반 청년이 얼마나 들어오고 나가는가" 같은 청년층·고령층 순유입 추세를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(anls_sigun_cd)나 시군명을 이름·코드 매핑해 연결해야 한다.
description_portal: 이 데이터는 경기도 각 시군의 인구 이동 현황을 성별 및 연령대별로 구분하여 월별로 제공하며, 전입(유입)과 전출(유출) 구분, 연령대별(0세부터 80세 이상까지) 이동자 수를 남녀별로 세분화한 항목을 포함합니다. 전입전출구분 항목은 0은 전체, 21은 전입, 22는 전출을 의미합니다. 이를 통해 특정 시군의 인구 유입 및 유출 경향을 분석하거나, 특정 연령대 인구의 이동 성향, 청년층 및 고령층의 지역 간 이동 특성 등을 파악할 수 있습니다. 본 자료는 인구 정책 수립, 주거·교통 인프라 계획, 지역 균형 발전 전략 수립, 청년정책이나 노인복지 정책 등에 실증 자료로 활용될 수 있습니다.
