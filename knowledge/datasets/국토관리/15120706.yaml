description_portal: 경기도 하남시의 용도지구 현황을 지구 유형별로 정리한 자료로, 경관지구, 고도지구, 방화지구, 방재지구, 취락지구, 개발진흥지구, 특정용도제한지구, 시설보호지구, 미관지구, 보존지구 등의 구분별 개소 수와 면적 정보를 포함하고 있습니다. 데이터 기준일자는 2025년 12월 31일이며, 하남시 내 도시계획 및 토지이용 관리 현황을 파악하는 데 활용할 수 있습니다. 특히 실제 지정 현황이 있는 경관지구, 방화지구, 취락지구의 개소 및 면적을 확인할 수 있어 도시관리계획 검토, 공간계획 수립, 지역 개발·보전 정책 분석, 토지이용 현황 파악 등에 기초자료로 활용 가능합니다.
