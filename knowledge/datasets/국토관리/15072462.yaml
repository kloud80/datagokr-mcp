summary_user: 한국토지주택공사(LH)가 2016~2020년에 낸 주택 공고를 공고·사업지구·블록·주택형 단위로 담은 파일로, 공고일자와 계약기간, 공급유형, 총세대수와 금회분양세대수, 분양금액 또는 임대보증금, 계약금·중도금·잔금, 월임대료가 들어 있다. 청약 대기자나 분석가가 'LH 공공임대·공공분양이 어느 지역본부·사업지구에서 어떤 주택형으로 얼마의 보증금·임대료에 공급됐나'를 살펴보는 데 쓴다. 전역 조인 키는 없어서 사업지구명·지역본부명 같은 이름을 맞추거나 같은 기관(LH) 데이터와 이어 써야 한다.
description_portal: 한국토지주택공사에서 공급, 공고한 2016년~2020년 간 주택 공고 내역(지역본부, 공고종류, 공급유형, 주택형,  총세대수, 계약금, 중도금, 잔금, 월임대료 등) 정보를 제공합니다. 지역본부별로 살펴볼 때 경기지역본부가 25.1%, 인천지역본부가 19.4% , 서울지역본부가 10.8%로 수도권에서 55.3% 가량의 주택공고를 진행하였으며 전체 3,746,773 세대중 공공임대 10년 75.2%, 공공분양 19.5%로 분양 됐습니다.  사업지구별로는 행정중심복합도시 22만4천건, 도청이전신도시 15만 1천건, 파주운정 14만 2천건, 수원호매실 12만 1천건, 화성동탄2 11만 2천건, 부산만덕5 10만 1천건 으로 집계됩니다.
