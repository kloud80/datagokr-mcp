description_portal: 이 데이터는 2023년 1월 31일 기준으로 서울특별시 성북구 내 기계설비 성능점검 대상 건축물의 현황을 정리한 자료입니다.각 건물의 명칭, 도로명주소, 연면적(또는 세대수), 준공일자, 데이터 기준일 등이 포함되어 있으며, 점검대상 건축물의 규모와 준공연도를 파악할 수 있도록 구성되어 있습니다.본 자료는 「기계설비법」에 따라 정기적으로 관리·점검이 필요한 대형 건축물의 현황을 제공함으로써, 건축물의 설비안전 관리, 공공시설 유지보수 계획 수립, 건축물 에너지 효율성 평가, 그리고 시설물 안전관리 정책 수립 등에 활용될 수 있습니다.특히 학교, 백화점, 공공시설 등 다양한 유형의 대형 건축물 정보를 포함하고 있어, 지역별 설비 점검 대상 분포와 관리 현황을 분석하는 데 유용한 기초 데이터입니다.
