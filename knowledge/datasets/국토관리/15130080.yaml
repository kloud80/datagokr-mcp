summary_user: 전북특별자치도 진안군 도시계획정보시스템(UPIS)에 등록된 지구단위계획구역을 구역 도형 단위로 담은 파일로, 구역별 라벨명, 좌표 범위(X·Y 최솟값·최댓값), 도형 면적·길이, 관리번호가 들어 있다(데이터 기준일자 2024년 7월 19일, CSV 약 1.6KB). 진안군 안에 어떤 지구단위계획구역이 어디에 얼마 넓이로 지정돼 있는지 확인하려는 주민·사업자·도시계획 분석가가 쓴다. 전역 조인 키는 없어서 같은 진안군 UPIS 계열 자료와는 공간정보관리번호·현황도형관리번호나 라벨명(구역 이름)으로 맞춰 잇고, 다른 데이터와는 좌표 범위로 위치를 대조해 쓴다.
