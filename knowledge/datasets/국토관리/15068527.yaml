description_portal: '한국부동산원(구.한국감정원)에서 제공하는 부동산거래현황 중 아파트매매 거래현황의 월별 거래규모별 데이터입니다.* 아파트매매 거래현황 : 건축물거래통계 중 건축물 용도가 아파트이고 거래원인이 매매인 건축물의 동(호)수 및 건축물면적(아파트 거래현황에 포함)* 호수 : 아파트의 호별 건수* 면적 : 아파트의 전용면적<부동산거래현황 개요>ㅇ 국가통계 승인번호 : 제315003호ㅇ 법적근거 : 부동산 거래신고 등에 관한 법률 제 25조 및 시행령 제 19조의 4ㅇ 통계목적 : 토지, 건축물 등 부동산거래에 대한 정확한 정보를 수집·작성하여 부동산정책의 기초자료로 활용ㅇ 통계주기 : 월ㅇ 조사지역 : 전국ㅇ 조사방법 : 전국 시·군·구 신고자료 취합 및 집계ㅇ 공표주기 : 매월ㅇ 공표시기 : 토지 : 익월 25일경 / 주택 : 익월 말일경'
