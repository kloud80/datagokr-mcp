summary_user: 한국토지주택공사가 공급하는 공공주택 중 착공(예정)일이 지난 사업의 준공 예정 현황을 사업지구·블록 단위로 담은 전국 범위 파일(csv, 약 29KB)로, 위치·공급유형(분양·임대·기타)·세대수·준공예정일을 포함한다. 향후 특정 지역에 LH 공공주택이 언제 몇 세대 준공될 예정인지 알아보려는 수요자나, 지역별 공공주택 입주 물량을 가늠하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 주택 공급·인허가 자료와는 사업지구명·블록명 같은 이름이나 대략적인 위치 주소를 맞춰서만 이어 쓴다.
description_portal: 한국토지주택공사가 공급하는 공공주택 중 데이터 기준일이 착공(예정)일 이후인 주택의 준공 예정 현황 자료를 제공합니다(사업지구명, 블록명, 위치, 공급유형, 세대수, 준공예정일 포함). 사업지구와 블록명은 내부적으로 공사 구역을 구분하는 단위이고, 위치는 주소의 형태를 가지고 있으나 상세주소가 부여되지 않아 대략적으로만 표시되어 있습니다. 공공주택이므로 분양과 임대, 기타 유형이 포함되어 있습니다. 예정 현황 자료이므로 실제 세대수 및 준공일은 확정된 것이 아니며 공사 진행 여건에 따라서 사업내용은 연기, 취소, 변경될 가능성이 있음을 유의하시기 바랍니다. 세대수가 0이거나 비어있는 사업의 경우에는 세대수가 미확정인 경우로서 향후 데이터 업데이트 시 보완될 것입니다.
