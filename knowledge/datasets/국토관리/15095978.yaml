summary_user: 대구광역시 북구 안 광장별로 명칭·소재지·조성 연도·면적과 식재된 수종명, 교목·관목 본수를 담은 개별 시설 단위 현황 데이터이며, 범위는 북구 한 시군구입니다. 북구 주민이나 도시녹지 분석가가 '우리 동네 광장은 언제 조성됐고 면적은 얼마이며 나무는 몇 그루, 어떤 수종이 심겨 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 공원·녹지 데이터와는 광장 명칭이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 표준 코드나 공통 식별자가 없어 다른 데이터와 자동 결합이 어렵고, 명칭·주소 매칭에 의존해야 한다. 북구 범위만 담으므로 대구시 전체나 다른 구와 비교하려면 별도 데이터가 필요하다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
