summary_user: 인천 영종구(포털 설명상 중구) 관내에 공장으로 등록된 제조업 공장을 한 곳씩 회사명·도로명 주소·업종명·생산품으로 담은 시군구 단위 파일이며, 파일 크기는 약 2KB로 작은 명부입니다. 지역 내 어떤 업종의 제조공장이 어디에 있는지 확인하려는 주민·사업자·지역산업 분석가가 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 회사명·주소 문자열 매칭이나 같은 기관 자료로만 이어 쓴다.
description_portal: '인천광역시 중구 관내에 위치한 제조업공장현황에 대한 데이터 입니다.산업집적활성화 및 공장설립에 관한 법률에 따라 등록된 공장 현황이며, 등록하지 않은 공장은 확인할 수 없습니다.(제조시설면적 500제곱미터 이상 : 의무등록 / 이하 : 자율등록)업종은 한국표준산업분류표에 따라 구분하며, 제조업이 아닌 경우 공장으로 등록할 수 없습니다.추가적인 문의사항은 담당부서로 연락해 주시기 바랍니다.파일명 인천광역시_중구_제조업공장현황파일내용 회사명, 주소, 업종명 등[변경사항]2025. 5. 27. : 현황 업데이트'
