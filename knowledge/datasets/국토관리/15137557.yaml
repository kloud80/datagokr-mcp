summary_user: "수원시 도시·군관리계획으로 결정된 용도지역 현황을 기준연도별·용도지역·상세용도지역(예: 주거지역 아래 세부 지역)별 면적(제곱미터)으로 담은 집계 CSV 파일이며, 필지 단위 원천이 아니라 시 전체 합계 표다. 도시계획 분석가나 시민이 '수원시 면적 중 주거·상업·공업·녹지지역이 각각 얼마나 되는가'를 확인하거나 다른 시와 용도지역 구성을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지자체 용도지역 현황과는 용도지역 이름을 맞춰 붙여 쓰고 연도 비교는 기준연도 필드로 맞춘다."
description_portal: 용도지역정보는 도시ㆍ군 관리계획으로 결정된 용도지역ㆍ지구ㆍ구역 별 고시 및 조서정보로서 그 중 수원시의 용도지역 결정 현황입니다.이는 토지를 경제적이고 효율적으로 이용하기 위해 도시·군관리계획으로 결정하는 정보로 토지 이용 및 건축물의 용도, 건폐율, 용적률, 높이 등을 제한하여 공공복리의 증진을 도모하여,땅의 성격을 미리 정해놓고 그에 맞게 이용하는 정보로 텍스트(CSV) 파일로 제공됩니다.국토의 계획 및 이용에 관한 법률에 따라 국토를 토지의 이용실태 및 특성, 장래의 토지이용방향등을 고려하여도시지역, 관리지역, 농림지역, 자연환경보전지역 등 4가지로 구분되며, 도시지역은 다시 주거지역, 상업지역, 공업지역, 녹지지역으로 분류됩니다.용도지역과 용도지구가 토지의 효율적인 이용이 목적인 반면, 용도구역은 토지의 이용제한에 목적을 두고 있습니다.
