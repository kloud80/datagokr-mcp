summary_user: K-water가 관리하는 댐·보·하굿둑 등 61개 지점의 저수위·저수량·저수율·유입량·총방류량·강수량을 관측일자(관측년월일)와 댐별로 담은 관측 시계열 파일이며, 포털 설명상 10분·시간·일 단위로 2025년 기준 최근 1만 건을 제공하고 전년·예년 대비 값과 발전·여수로 방류량, 취수량도 함께 담는다. 수자원 분석가나 지자체 담당자가 '이번 가뭄에 우리 지역 댐 저수율이 예년보다 얼마나 낮은가'나 '집중호우 때 댐 유입량과 방류량이 어떻게 움직였나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 댐코드·댐명을 매개로 같은 기관의 다른 댐·수문 자료나 이름 매핑을 거친 하천·유역 자료와 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 하천코드나 행정구역과 바로 결합하지 못하고, 댐명·댐코드 기준 이름 매핑이 필요하다. 행정단위가 없는 비공간 자료라 지도 위치 분석에는 별도의 지점 좌표 자료가 있어야 한다. 파일 용량이 약 51MB인 zip이다.
