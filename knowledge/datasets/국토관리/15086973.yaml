summary_user: 광산구 아파트 단지별로 입주자대표회의 명칭·주소와 입주자대표회의·노인회·부녀회의 정원·현원, 지역아동센터 이용자 수, 동아리 최대 3개의 명칭·회원수·모임장소를 한 행에 담은 단지 단위 현황 파일이다(csv 약 19KB, 시군구 범위). 지역 공동체 정책을 맡은 공무원이나 연구자가 '2016년 당시 광산구 아파트 단지마다 노인회·부녀회와 동아리가 얼마나 꾸려져 있었나'를 살필 때 쓴다. 전역 조인 키가 없어 K-apt 단지 기본정보 같은 다른 공동주택 데이터와는 입주자대표회의 명칭이나 주소로 단지명을 맞춰 이어야 한다.
description_portal: 광주광역시 광산구는 아파트 공동체 자원의 자치조직 현황에 대한 정보를 제공합니다. 이 자료는 입주자대표회의 명칭, 주소, 노인회, 부녀회, 지역아동센터, 동아리 등 다양한 자치조직의 구성 및 활동 현황을 포함하고 있습니다. 이 데이터는 광산구 정책 분석을 목적으로 한시적으로 수집된 자료로, 2016년 자료만 존재합니다. 따라서 현재 시점에서는 최신 정보가 반영되어 있지 않으며, 2016년 당시의 아파트 공동체 자치조직의 구성과 활동 현황을 파악하는 데 유용한 자료로 활용될 수 있습니다. 이 정보는 지역사회 공동체의 활성화 및 정책 수립에 기초 자료로 이용할 수 있습니다.
