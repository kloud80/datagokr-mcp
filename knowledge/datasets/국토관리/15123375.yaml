summary_user: 충청북도 단양군 도시계획정보시스템(UPIS)에 등록된 개발행위허가 필지도 현황을 필지 단위로 담은 파일 데이터로, 허가계획 관리번호·라벨명·도형 면적·현황도형 생성일시를 포함하며 범위는 단양군 한 개 시군구다(포털 기준 데이터기준일자 2014년 12월 31일). 연구자나 분석가가 단양군에서 개발행위허가가 난 필지가 어느 정도 면적으로 언제 등록됐는지 파악하는 데 쓴다. 실측 컬럼에 지번·필지고유번호 같은 전역 조인 키가 없어 다른 데이터와는 라벨명 등 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
limits: 전역 조인 키가 없어 토지·건축물 데이터와 바로 결합할 수 없다. 명세상 수시·이벤트 주기로 생성 후 바뀌지 않는 자료로 표시돼 있으므로 최신 허가 현황은 담당부서에 따로 확인해야 한다.
