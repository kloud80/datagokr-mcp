summary_user: 부산광역시 구·군별로 등록된 개인하수처리시설(정화조) 청소·분뇨 수거업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·대표자·소재지·전화번호·등록(허가)일·보유 차량 대수·종사 인원을 담는다. 정화조 청소를 맡길 시민이 우리 구·군 관할 수거업체와 연락처를 찾거나, 분석가가 구·군별 수거 차량·인력 규모를 비교하는 데 쓴다. 전역 조인 키는 없어 구·군 이름(시군구)이나 소재지 주소를 매핑해 하수처리구역·인구 등 다른 지역 통계와 붙여 쓴다.
limits: 업체 코드나 법정동 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 구·군명·주소를 직접 맞춰야 한다. 범위는 부산광역시 한 곳뿐이라 다른 시도와 비교하려면 별도 데이터가 필요하다.
