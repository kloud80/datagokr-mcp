summary_user: 전남 신안군에 등록된 제조업 공장을 공장 한 곳당 한 행으로 담은 시군구 단위 파일(csv 약 19KB)로, 회사명·대표자·도로명/지번 주소·위도·경도·업종명·생산품·주원자재·데이터기준일자를 포함한다. 신안군에 어떤 업종의 공장이 어디에 있고 무엇을 만드는지 알고 싶은 지역 산업 분석가나 납품처·협력사를 찾는 사업자가 쓴다. 사업자번호·업종코드·필지코드 같은 전역 조인 키가 없으므로, 다른 데이터와는 주소나 위도·경도 좌표 기준의 공간 매칭 또는 회사명·업종명 이름 매칭으로 잇는다.
limits: 실측 컬럼에 사업자등록번호·표준산업분류코드·필지고유번호가 없어 기업·토지 데이터와 키로 바로 결합되지 않는다. 신안군 한 곳만 다루므로 다른 시군과 비교하려면 지역별 파일을 따로 모아야 한다. 산업단지 용지 분양·개발·토지 정보는 담지 않는다.
