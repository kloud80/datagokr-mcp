description_portal: 제조업공장현황은 전국에 등록된 제조업 공장의 기본 정보를 수록한 데이터로, 연번, 회사명, 대표자명, 소재지도로명주소, 소재지지번주소, 위도, 경도, 공장우편번호, 업종명, 전화번호, 팩스번호, 생산품, 주원자재, 데이터기준일자 항목으로 구성되어 있습니다. 본 데이터는 공장 단위의 위치 정보뿐 아니라 생산품목과 주요 원자재 정보를 포함하고 있어 산업 구조 분석, 지역 산업단지 현황 파악, 기업 지원 정책 수립 등에 활용됩니다. 주소 정보는 도로명과 지번을 병기하고 있으며, 위도·경도는 공간정보 기반 서비스 및 입지 분석에 유용하게 활용됩니다. 업종명은 해당 공장의 주요 제조 분야를 나타내며, 전화 및 팩스번호를 통해 직접적인 연락 수단도 확인할 수 있습니다. 데이터기준일자를 통해 최신성 있는 공장 현황 자료를 제공하며, 지역 경제 및 산업 활성화 정책의 기초자료로 활용될 수 있습니다.
