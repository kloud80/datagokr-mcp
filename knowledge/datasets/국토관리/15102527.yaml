description_portal: 공동주택관리법에 따라 부산광역시 중구청에 등록된 주택관리업 등록현황입니다. 부산광역시 중구청에 등록된 주택관리업체 등록 정보로 지역, 사무소명, 전화번호, 도로명주소, 대표자 이름 등이 포함되어있습니다.  공동주택관리법에 따른 주택관리업이란 공동주택을 안전하고 효율적으로 관리하기 위하여 입주자 등으로부터 의무관리대상 공동주택의 관리를 위탁받아 관리하는 업을 말합니다. 주택관리업 등록기준은 자본금 또는 재산이 2억 원 이상으로  주택관리업무를 수행하기 위해 관련 분야에 전문지식과 경험을 갖춘 관리자를 반드시 두어야 하며, 업무 수행에 필요한 시설과 장비를 갖추고 있어야 합니다.
