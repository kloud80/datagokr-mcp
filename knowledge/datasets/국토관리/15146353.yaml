summary_user: 서울시 주요 120개 장소별 실시간 인구 현황을 담은 외부 API로, 장소 단위로 혼잡도, 추정 인구 최소·최대, 성별·연령대별 비율, 상주·비상주 비율, 예측 인구를 제공한다. 서울 도심 방문을 계획하는 시민이나 상권·행사 담당자가 특정 장소가 지금 얼마나 붐비는지, 어떤 연령층이 많은지 확인하는 데 쓴다. 전역 조인 키는 확인되지 않으며, 장소명(AREA_NM)·장소코드(AREA_CD)로 서울시 120장소 목록과 이름·코드 매핑하거나 같은 기관의 다른 실시간 도시데이터와 연결해야 한다.
description_portal: 서울시 실시간 인구데이터는 실시간 인구현황 정보를 제공합니다.※ 서울시 주요 120장소에 대한 실시간 도시데이터 중, 실시간 인구 항목만 제공하는 데이터입니다.※ 서울 주요 120장소 목록은 아래 '서울시 주요 120장소명 목록(코드포함).xlsx' 파일에서 확인 가능합니다.※ 샘플key를 통해서는 주요 120장소 중 '광화문·덕수궁' 지역만 조회 가능합니다. 나머지 지역을 조회하기 위해서는 인증키를 발급받아 주시기 바랍니다.※ 서울시 실시간 인구데이터 API는 한 번에 1개 장소씩만 호출 가능합니다.※ 장소명 OR 장소코드 중 택1 하여 호출이 가능합니다.
