description_portal: 경기도 남양주시 공간정보시스템의 색인도에 대한 데이터로, 지형지물부호(1/500,1000,2500,5000) 및 도엽번호 항목을 제공합니다.색인도 데이터는 대규모의 공간 정보 데이터를 관리하고 검색하기 쉽도록 일정한 격자 형태로 분할하고 목록화한 자료입니다. 특정 지역의 공간 정보가 어떤 파일(도엽)에 포함되어 있는지 알려주는 찾아보기 지도의 역할을 합니다. 사용자가 원하는 위치의 지도 파일이 무엇인지 쉽게 알 수 있도록, 이 분할된 도엽의 경계, 도엽 번호, 파일명 등을 시각적으로 표시한 것이 색인도입니다.색인도 데이터는 사용자가 선택한 지역에 해당하는 정확한 수치지도 파일을 빠르게 불러오기 위한 핵심 자료로 사용됩니다.
