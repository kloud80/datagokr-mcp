summary_user: 제주특별자치도 제주도지질공원(세계지질공원) 홈페이지 포토갤러리에 올라온 게시물 목록을 게시물 한 건당 한 행으로 담은 CSV 파일(약 6.7KB)이며, 게시판명·카테고리·담당 부서·제목·작성자·수정일·상태를 포함한다. 지질공원 홍보나 지오스쿨 같은 체험 프로그램의 사진 기록이 어떤 주제로 언제 게시됐는지 파악하려는 관광·교육 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 부서명·카테고리 같은 이름 매핑이나 같은 기관(제주특별자치도) 기준으로만 이어 쓴다.
description_portal: '제주특별자치도 제주도지질공원 포토갤러리에 게시된 자료 현황 정보를 제공합니다.항목: 게시판명, 카테고리, 부서, 제목, 작성자 등 *지오스쿨(Geo-School) : 초·중등학생과 일반 성인 등을 대상으로 제주도 지질자원의 형성 과정 및 주요 특징 등을 배우는 체험 중심 활동※ 본 공공데이터는 상기 항목에 대한 정보로 공공데이터포털에서 제공하는 csv 파일을 제외한 첨부파일, 이미지, PDF 등의 자료나 문서 등에 대하여는 무단 사용을 금합니다.자세한 사항은 제주도세계지질공원 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/geopark/community/gallery.htm'
