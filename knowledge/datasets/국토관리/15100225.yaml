summary_user: 대구광역시 안에서 허가·승인된 오피스텔을 사업(건물) 단위로 한 행씩 담은 현황 파일로, 구군·사업명·대지위치와 지번·연면적·오피스텔 호실수를 기록한다. 대구 각 구군에 오피스텔이 얼마나, 어느 규모로 공급되었는지 확인하려는 분석가나 부동산 사업자가 "우리 구에 오피스텔 호실이 몇 개나 있나" 같은 질문에 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 구군 이름이나 대지위치·지번 주소를 맞춰 붙여야 한다.
description_portal: 해당 데이터는 대구광역시 관내에서 허가 또는 승인된 오피스텔을 구군별로 사업명, 대지위치(지번 포함), 연면적, 오피스텔 호실수를 포함하고 있는 현황정보입니다.  *해당 데이터는 참고자료이며 오류가 있을 수 있습니다.오피스텔의 건축물 용도는 건축법에 따라 업무시설이며, 건축법 시행령 별표1에서 업무를 주로 하며, 분양하거나 임대하는 구획 중 일부 구획에서 숙식을 할 수 있도록 한 건축물로서 국토교통장관이 고시하는 기준(오피스텔 건축기준)에 적합한 것을 말한다.라고 규정하고 있습니다.
