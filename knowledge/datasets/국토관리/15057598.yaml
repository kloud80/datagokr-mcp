summary_user: 경기도 내 하수처리장을 시설 단위로 담은 데이터로, 집계연도(SUM_YY)별 시군·시설명, 가동개시일, 운영주체·위탁업체, 처리방법, 물리적·생물학적·고도처리 시설용량과 실제 처리량, 방류 수역(본류·지류·수계), 소독방법, 사업비, 주소와 위도·경도를 포함한다. 지자체 환경 담당자나 분석가가 '우리 시군 하수처리장의 고도처리 용량 대비 실제 처리량은 얼마이고, 어느 수계로 방류하며 위탁운영은 누가 하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드·시군명이나 시설명으로 다른 하수도·수질 데이터와 이름 매칭해 잇고, 위도·경도로 하천·수계 공간 데이터와 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 하수처리장에 대한 통계 정보를 제공하며, 하수처리장별 운영 현황 및 처리 성능에 대한 정보를 포함합니다. 주요 항목에는 시설명, 시군명, 가동개시일, 운영주체명, 위탁업체명, 처리방법, 지역구분, 방류수역 정보(본류, 지류, 수계), 물리적·생물학적·고도처리 시설용량 및 실제 처리량, 방류수 소독방법, 위탁계약 범위, 사업비, 소재지 주소 및 위도·경도 좌표 등이 포함됩니다. 이 데이터는 지역 하수처리 기반시설의 운영실태 파악, 환경정책 수립, 하천 수질관리, 위탁운영의 효율성 분석 등에 활용될 수 있습니다. 특히 물리적·생물학적·고도처리 항목은 하수처리의 질적 수준을 수치로 파악할 수 있는 핵심 지표입니다. Open API로 제공되며 다양한 환경 데이터 분석 및 통합 플랫폼에서 연계 활용 가능합니다.
