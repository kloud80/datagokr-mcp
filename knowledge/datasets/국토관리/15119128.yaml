summary_user: 전북특별자치도 진안군 도시계획정보시스템(UPIS)에서 공공 문화체육시설 집행 현황 도형을 건별로 담은 파일로, 도형마다 공간정보관리번호, 좌표 범위(X·Y 최솟값·최댓값), 도면번호, 라벨명, 면적·길이, 도형 생성일시를 기록한다. 진안군에서 문화·체육 도시계획시설이 어디에 어느 규모로 집행됐는지 확인하려는 주민·사업자·도시계획 분석가가 개발 가능성이나 시설 입지를 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 라벨명 같은 이름 매핑이나 좌표 범위를 이용한 공간 대조, 같은 진안군 UPIS 자료끼리의 연결로만 이어 쓴다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 공공 문화체육시설 집행에 대한 공공데이터 자료입니다. 이번 자료에서는 공간정보 관리 번호, X 좌표 최솟값, Y 좌표 최솟값, X 좌표 최댓값, Y 좌표 최댓값, 도면번호, 라벨 명, 면적(도형), 길이(도형), 현황 도형 생성일시 정보를 제공합니다. 이 자료를 통해 공공 문화체육시설 집행에 관한 공간 정보 관리 번호와 라벨 명, 규모, 도형에 대한 면적과 길이가 각각 얼마인지 확인 할 수 있습니다. 또한 공공 문화체육시설 집행에 관한 현황 도형이 언제 생성되었는지도 알아볼 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다.
