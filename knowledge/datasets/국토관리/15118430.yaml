summary_user: 바른땅시스템(대국민) 홈페이지 자료실에 올라온 지적재조사 관련 지침서·매뉴얼·교육자료·양식의 게시글 목록을 게시글 한 건당 한 행으로 담는다(제목·분류코드·조회수·등록일시, CSV 약 11.8KB). 지적재조사 실무 공무원이나 사업 담당자가 '좌표 변환 매뉴얼이나 대상지 등록 양식이 언제 올라왔고 얼마나 열람됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 필지(PNU) 단위 지적 데이터와 직접 결합되지 않으며, 게시판 ID·일련번호는 이 게시판 안에서만 쓰는 식별자다.
limits: 게시글 목록과 조회수만 담고 자료 파일 본문이나 필지·사업지구 정보는 없으므로 지적재조사 사업 현황 분석에는 쓰지 못한다. 다른 데이터와는 공통 키 없이 제목 등 이름 매칭으로만 연결할 수 있다.
