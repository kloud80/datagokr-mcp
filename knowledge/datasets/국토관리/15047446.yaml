summary_user: 전북특별자치도 농어촌 지역의 빈집 정비사업을 시군별로 집계한 통계 파일로, 정비 대상 빈집 총수와 2016년까지의 추진 실적, 2017년 계획, 향후 정비 대상을 나눠 담는다(csv 535바이트 규모의 소량 표). 지역 행정 담당자나 연구자가 "우리 시군의 농어촌 빈집 정비가 대상 대비 어디까지 진행됐고 얼마나 남았나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 이름을 행정구역 코드에 맞춰 매핑하는 방식으로만 이어 쓴다.
limits: 빈집 개별 위치나 건별 정보가 없는 시군 단위 집계라 지도화나 개별 빈집 추적에는 쓰지 못한다. 명세상 이벤트성으로 한 번 생성된 뒤 바뀌지 않는 자료로, 2016년 실적·2017년 계획 시점 기준이므로 현재 정비 현황으로 해석하지 않는다. 시군 이름 외에 표준 코드가 없어 다른 자료와 연결하려면 이름 매핑이 필요하다.
