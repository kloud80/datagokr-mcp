summary_user: 대구광역시 가로수를 한 그루 단위로 담은 건별 원천 데이터로, 위경도 좌표 중심 반경(km) 안의 수목 목록과 수목명·관리기관·식재 도로와 주소·흉고직경·수령·보호틀 상태·간섭 시설물·이미지 정보를 조회한다. 구청이나 연구자가 '이 지점 반경 1km 안 가로수는 어떤 수종이고 보호틀 파손이나 뿌리 들림이 있는가'를 확인해 녹지 관리나 정비 대상을 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 도로명·지번 주소, 행정동명, 좌표(treeLat·treeLot)로 맞춰 이어 써야 한다.
description_portal: WGS84 위경도 좌표를 중심으로 좌표로부터 반경거리(km단위) 내에 존재하는 대구광역시 가로수의 목록과 기본정보를 조회할 수 있는 서비스입니다. 조회 항목은 기본정보(수목 관리번호, 수목명, 수목구분, 수목특성, 수목관리기관 정보 등), 도로, 위치(식재지 도로명 및 지번 주소, 행정동 등), 생육(지표면 1.2m 높이에서의 지름, 수목나이 등), 상태(보호틀 덮개 재질 및 종류, 수목과 간섭 발생 시설물 등), 이미지 정보를 제공합니다. 가로수 식재 및 생육 정보를 바탕으로 도시 녹지 관리 정책을 수립하거나, 미세먼지 저감 효과를 분석하여 도시 환경 개선, 가로수 관리 최적화, 연구 및 데이터 분석, 스마트 도시 구축 등에 활용될 수 있습니다.
team:
  dept: 산림녹지과
services:
  - op: /getRoadsideTree
    name: 좌표기반 가로수 리스트 조회
    endpoint: https://apis.data.go.kr/6270000/dgRoadsideTree/getRoadsideTree
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: type
        required: true
        example: xml
        desc: 데이터 타입(xml, json)
      - name: lat
        required: true
        example: '35.843739166065'
        desc: WGS84 위도 좌표
      - name: lot
        required: true
        example: '128.52419828467'
        desc: WGS84 경도 좌표
      - name: radius
        required: true
        example: '3'
        desc: 좌표로부터의 반경 거리. 단위 km
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /getRoadsideTreeItem
    name: 가로수 항목 조회[상세정보]
    endpoint: https://apis.data.go.kr/6270000/dgRoadsideTree/getRoadsideTreeItem
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: type
        required: true
        desc: 데이터 타입(xml, json)
      - name: id
        required: true
        desc: 가로수 상세정보 조회를 위 한 아이디(리스트 조회 기능에서 확인 가능)
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
