summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 관리지역 도형을 한 건씩 담은 파일로, 도형마다 관리번호, 좌표 범위(X·Y 최솟값·최댓값), 라벨명, 면적과 길이를 기록한다. 토지 소유자나 개발 검토자가 진안군의 어느 구역이 관리지역(계획·생산·보전관리 등)으로 지정돼 있고 면적이 얼마인지 확인할 때 쓴다. 전역 조인 키는 없으므로 좌표 범위로 다른 공간자료와 위치를 대조하거나, 같은 기관의 다른 UPIS 용도지역 자료와 관리번호·라벨명으로 맞춰 쓴다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 관리지역 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 공간 정보 관리 번호, X좌표 최솟값, Y좌표 최솟값, X좌표 최댓값, Y좌표 최댓값, 라벨 명, 면적(도형), 길이(도형), 현황 도형 관리 번호 정보를 제공합니다. 이 자료를 통해 공간 정보 관리 번호에 해당하는 현황 도형 관리 번호가 무엇인지 확인할 수 있습니다. 또한 현황 도형 관리 번호에 해당하는 라벨 명도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2024년 7월 19일입니다.
