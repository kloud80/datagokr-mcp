summary_user: 옥천군에서 토석채취·채석 허가나 신고를 받은 사업장을 건별로 담으며, 업체 상호·연락처·허가지 소재지와 지번·채취 용도·허가면적(㎡)·허가량(㎥)·허가 시작일과 종료일이 들어 있다. 주민이나 인근 토지 소유자가 우리 동네 어느 지번에서 언제까지 토석채취가 허가돼 있는지 확인할 때 쓰고, 분석가는 군 내 채취 사업장의 규모를 살필 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 허가지 주소(지번)를 주소·지번 매핑해 붙이거나 같은 기관(옥천군) 기준으로만 이어 쓴다.
description_portal: 충청북도 옥천군_토석채취 및 채석신고 현황 데이터는 옥천군 내에서 토석(흙, 돌, 모래 등)의 채취 및 채석을 위해 허가받거나 신고된 사업장 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터에는 수허가자 상호, 연락처, 허가지 주소, 허가면적, 토석구분(골재, 흙, 돌 등), 용도, 허가 수량, 최초 허가일, 허가 만료일, 복구비 예치액, 주된 행정처분 등과 같은 핵심 항목이 포함되어 있습니다. 면적과 수량, 예치금 등은 각각 천㎡, 천㎥, 천원 단위로 표기되며, 채취 행위에 대한 행정적 이력과 사업장 위치, 규모, 운영주체, 복구 관련 정보까지 한눈에 파악할 수 있도록 구성되었습니다.이 데이터는 연 1회 이상 정기적으로 갱신되며, 옥천군 산림녹지과 등 관련 부서에서 관리합니다. 이를 통해 지역 내 토석·석재 자원의 개발과 관리 현황, 환경영향 평가, 산림 및 토지 이용 계획, 불법 채취 단속, 복구 계획 수립 등 다양한 행정·연구 목적으로 활용할 수 있습니다. 유관기관이나 연구자, 일반 시민도 공공데이터포털을 통해 CSV 등 오픈 포맷 파일 또는 오픈API 방식으로 데이터를 손쉽게 활용할 수 있습니다. 데이터는 최신 등록일 및 기준일에 맞춰 제공되며, 별도의 이용 제한이나 비용 없이 자유롭게 내려받아 사용할 수 있다는 점에서 투명성 및 접근성을 높이고 있습니다
