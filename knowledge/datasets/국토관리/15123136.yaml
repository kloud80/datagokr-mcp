summary_user: 경기도 전역의 법정동코드를 시도·시군구·읍면동·리 단위까지 한 행씩 정리한 참조용 코드표로, 법정동코드와 시군구코드·읍면동코드 및 각 명칭을 담는다. 부동산 분석가나 개발자가 '이 주소의 리 단위 법정동코드는 무엇인가'처럼 실거래·공시가격 등 행정구역 단위 부동산 데이터를 코드 기준으로 맞출 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 법정동코드(legaldong_cd)·시군구코드 값이나 행정구역 명칭을 매핑해 잇는 방식으로 연결한다.
description_portal: 이 데이터는 경기도 전역의 행정구역 단위별 법정동코드를 체계적으로 정리한 자료로, 법정동코드, 시도명, 시군구코드 및 명칭, 읍면동코드 및 명칭, 리명 등의 항목으로 구성되어 있습니다. 해당 정보는 부동산포털에서 공간정보를 연계하거나 행정구역 단위의 부동산 데이터를 정합성 있게 관리하기 위한 필수 참조자료입니다. 법정동코드는 국토교통부의 표준코드 체계에 기반하며, 각 주소를 유일하게 식별할 수 있는 코드 체계로, 위치정보 시스템, 공공행정시스템, 부동산정보 서비스 구축 등에 핵심적으로 활용됩니다. 특히 리 단위까지 상세 분류가 제공되어 농촌 지역의 세분화된 공간정보 분석에도 적합합니다.
