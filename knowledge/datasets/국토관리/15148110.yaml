description_portal: '국토지리정보원은 영상자료실과 민원실에서 일반민원인과 기관신청자에게 교부된 성과정보를 체계적으로 관리한다. 관리대상 성과종류는 항공사진 정사영상 수치표고로 구분되며, 각 자료는 교부신청정보와 연계되어 관리된다. 항공사진은 항공촬영단위별로 정사영상은 1대5000도엽단위별로 수치표고는 DEM단위별로 구분되며 이들 성과종류는 코드체계로 추가되어 전산화되고 체계적인 관리기준으로 활용된다. 이를 통해 성과이력의 추적성과 정확성을 높이고 공간정보 업무에서의 신뢰성과 활용성을 보장한다▷ 식별정보 : 신청관리번호▷ 속성정보 : 성과관리코드(명), 성과별자료건수'
