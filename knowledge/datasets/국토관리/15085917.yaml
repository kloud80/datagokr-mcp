summary_user: 한강 수계 수위 관측소별로 수위를 유량으로 바꾸는 수위유량곡선식을 적용기간(시작·종료일자)과 수위 구간(하한·상한·간격)별로 담은 파일(CSV, 약 2MB)입니다. 하천 분석가나 수자원 실무자가 '이 관측소의 특정 시기 수위값을 유량으로 환산하려면 어떤 식을 써야 하나'를 확인할 때 쓴다. 전역 조인 키는 없어 수위관측소코드나 지점명을 같은 기관의 수위 관측 자료와 맞춰 이어 쓴다.
limits: 이 파일은 관계식만 담고 실제 수위·유량 관측값은 담지 않으므로, 유량을 구하려면 별도의 수위 자료가 필요하다. 명세상 수시·이벤트성으로 생성되는 파일이라 실시간 갱신을 기대하기 어렵고, 다른 기관 데이터와는 공통 코드 없이 이름·코드 매핑으로만 연결된다.
