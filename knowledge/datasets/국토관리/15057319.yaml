summary_user: 경기도 안의 연면적 2천제곱미터 이상 상점가 등 복합건축물 형태 공중이용시설을 사업장 한 곳씩 담으며, 시군·사업장명·인허가일자·영업상태·폐업일자·건물 소유구분·다중이용업소 여부·위생업종과 업태·주소·위도경도를 포함한다. 도 위생 담당자나 분석가가 "우리 시군에서 지금 운영 중인 복합건축물 공중이용시설은 어디이고, 그중 임대 건물이나 다중이용업소는 몇 곳인가" 같은 질문에 쓴다. 전역 조인 키가 없어 시군코드(SIGUN_CD)로 같은 경기도 데이터와 잇거나, 사업장명·도로명/지번 주소·좌표를 맞춰 건축물 정보 등 다른 데이터와 연결한다.
description_portal: 경기도 내 공중이용시설 현황(복합건축물)입니다. 공중의 이용으로 인해 건강 및 공중위생에 영향을 미칠 수 있는 연면적 2천제곱미터이상의 상점가 복합건축물등에 해당되는 이용시설에 대한 정보입니다.데이터는 경기도 내 복합건축물 형태의 공중이용시설에 대한 현황을 정리한 자료입니다. 항목에는 시군명, 사업장명, 인허가일자, 영업상태명(운영중, 폐업 등), 건물소유구분(자가/임대), 다중이용업소여부, 위생업종명 및 위생업태명, 소재지 주소(도로명 및 지번), 우편번호, WGS84 기준 위도·경도 좌표 등이 포함됩니다. 해당 자료는 복합상가, 쇼핑몰, 센터 등 다양한 공공 접근이 가능한 복합시설의 위생관리 및 행정현황을 파악하는 데 유용하며, 위생지도, 정책적 관리 대상을 선별하거나 재난대응 및 민원처리 기반 자료로 활용될 수 있습니다. 특히 건물 유형과 소유형태별 분포 파악이 가능합니다.
