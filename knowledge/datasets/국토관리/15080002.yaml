summary_user: 대구광역시 중구 소재 일반건축물의 지방세 과세 기준인 시가표준액을 건물(동·호) 단위로 담은 파일로, 과세년도 2021년 자료이며 소재지 지번, 연면적, 결정일자·기준일자가 함께 들어 있습니다. 중구 건물 소유자나 매수 예정자가 해당 건물의 재산세·취득세 과세 기준액이 얼마인지 확인하거나, 분석가가 중구 내 건축물 과세가액 분포를 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 자치단체코드와 법정동·본번·부번 같은 지번 정보를 이름·코드로 맞춰 건축물대장이나 공시지가 등 다른 필지·건물 데이터와 연결해야 한다.
description_portal: '대구광역시 중구 소재 일반건축물에 대한 지방세 부과기준인 시가표준액 데이터를 제공합니다.(과세년도 2021년 자료)- 제공내용 : 시도명,시군구명,자치단체코드,과세년도,법정동,법정리,특수지,본번,부번,동,호,물건지,시가표준액,연면적,결정일자,기준일자- 일반 건축물에 대한 시가표준액은 위에서 알려드린 위택스 사이트(www.wetax.go.kr)에서 조회가 가능합니다.- 위택스 사이트에서 조회하는 데이터는 매년 1월1일 기준자료이며, 수시조정기준에 따라 시가표준액이 변경될 수 있습니다.'
