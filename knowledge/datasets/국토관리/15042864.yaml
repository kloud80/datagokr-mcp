summary_user: 강릉시가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 명단 파일로, 업종·상호·상세주소·업소 연락처·담당부서 전화번호·데이터기준일자를 담는다(CSV 약 8.6KB). 강릉 시민이나 관광객이 '강릉에서 가격이 저렴한 한식당이나 미용실이 어디 있나'를 찾거나, 분석가가 시내 착한가격업소의 업종 분포를 볼 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 상호명·상세주소를 맞추거나 주소를 좌표로 바꿔 지도·상권 자료와 겹쳐 보는 방식으로 이어 쓴다.
description_portal: '강원특별자치도 강릉시에서 지정한 착한가격업소의 기본 현황을 정리한 데이터로, 업소별 업종·위치·연락처와 행정 담당부서 정보를 한 번에 확인할 수 있도록 구성된 자료입니다.순번: 강릉시 착한가격업소를 식별하기 위한 일련번호업종: 업소의 영업 형태를 나타내는 항목(예: 한식, 분식, 세탁, 이·미용 등)업소명: 착한가격업소로 지정된 업체의 공식 상호명시도: 업소가 위치한 광역자치단체 명칭(강원특별자치도 등)시군구: 업소가 위치한 기초자치단체 명칭(강릉시 등)상세주소: 도로명, 건물번호 등을 포함한 업소의 정확한 위치 정보연락처: 업소에 직접 문의·예약을 할 수 있는 대표 전화번호(000-000-0000 형식)담당부서전화번호: 착한가격업소 제도와 관리를 담당하는 강릉시 부서의 연락처데이터기준일자: 착한가격업소 지정 현황이 최종으로 확인·갱신된 기준 일자(YYYY-MM-DD 형식)이 데이터는 강릉시 내 착한가격업소의 분포와 업종을 파악하고, 물가안정 정책 추진, 서민·소상공인 지원, 저렴한 생활·외식업소 안내 서비스 구축, 관광객과 시민 대상 합리적 소비 정보를 제공하는 데 활용할 수 있는 공공데이터입니다.'
