summary_user: 김포시 관내 아파트 단지별로 아파트명, 소재지주소, 승인일·준공일, 층수, 동수, 세대수, 관리사무소 전화번호를 한 행씩 담은 단지 현황 파일(CSV, 약 20KB)이다. 김포로 이사하려는 사람이나 분석가가 "김포시 어느 지역에 준공 20년이 넘은 대단지 아파트가 몰려 있나"처럼 단지 규모와 연식 분포를 확인할 때 쓴다. 실측 컬럼에 K-apt 단지코드 같은 전역 조인 키가 없어서, 실거래·공시가격·K-apt 관리비 데이터와는 아파트명이나 소재지주소를 맞춰 붙여야 한다.
limits: 공통 단지코드가 없으므로 다른 주택 데이터와 연결할 때 단지명 표기 차이로 매칭이 어긋날 수 있다. 범위는 김포시 한 곳뿐이고, 관리비·장기수선·실거래가 같은 관리·시장 정보는 들어 있지 않다.
