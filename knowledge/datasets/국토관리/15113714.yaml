description_portal: 경기도 동두천시 개별공시지가 정보(관내 개별 필지별로 조사·산정된 공시지가 정보를 포함)를 민원인의 데이터 제공 신청에 따라 공공데이터 포털에 개방하고자 합니다.부동산 가격공시 및 감정평가에 관한 법률에 따라 매년 1월 1일 기준으로 산정되며, 재산세, 양도소득세 등 각종 세금과 개발부담금 부과 기준으로 활용합니다. 또한 토지 가치 평가 및 행정업무 기초자료로도 이용합니다.데이터의 제공항목으로는 가격기준년도, 법정동, 본번, 부번, 개별공시지가, 기준일자, 공시일자, 데이터기준일자의 정보입니다.데이터의 기준일자는 2023년 5월 10일입니다. 데이터에 대하여 추가적인 문의사항이 있을 경우 동두천시 민원봉사과 토지관리팀 031-860-2152로 문의주시기 바랍니다.
