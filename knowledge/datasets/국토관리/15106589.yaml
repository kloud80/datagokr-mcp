summary_user: 강릉시 법정동별로 설치된 수도 원격검침 단말기 수를 담은 읍면동 단위 집계 파일로, 법정동명과 단말기수 2개 항목으로 구성된다(포털 기준일 2022-08-09). 상수도 담당자나 분석가가 '강릉시 어느 동에 스마트 수도검침 보급이 많고 어디가 부족한가'를 확인하고 보급 계획의 기초자료로 쓴다. 전역 조인 키(법정동코드 등)가 없으므로 다른 데이터와는 법정동 이름을 매핑해 강릉시 인구·세대수나 급수 현황 같은 읍면동 단위 자료와 이어 쓴다.
description_portal: '강원특별자치도 강릉시 [수도] 원격검침기 설치 현황 데이터입니다. (신청인에게 직접 제공한 PDF 파일을 CSV로 변환하여 제공합니다.)본 데이터는 2개 항목(컬럼)으로 구성되며, 각 항목의 설명은 다음과 같습니다.법정동: 읍면동 위치 (예: 홍제동, 주문진읍)단말기수: 해당 법정동에 설치된 [수도] 원격검침 단말기의 총 수량이 2개 항목은 강릉시 법정동을 기준으로 해당 지역의 [수도] 원격검침 단말기수가 몇 개인지 보여주는 현황 자료입니다. [수도] 인프라 관리 및 보급 계획 수립을 위한 기초자료로 활용할 수 있습니다.데이터 기준일: 2022-08-09'
