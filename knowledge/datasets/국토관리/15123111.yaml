summary_user: 경기도 시군별 인구와 세대 현황을 연도(yr) 단위로 집계한 데이터로, 총인구·세대수·세대당 인구·남녀 인구와 성비, 1인·2인·3인·4인 이상 세대 수와 비율, 연령대별 연앙인구(여성은 15세부터 5세 단위)를 담는다. 지자체 정책 담당자나 분석가가 '우리 시군의 1인 세대 비율과 가임기 여성 인구가 몇 년 사이 어떻게 변했나'처럼 인구·세대 구조 변화를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(sigun_cd)나 시군명을 매핑해 연결하거나 같은 기관(경기도) 데이터끼리 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군의 인구 및 세대 정보를 연도별로 제공하며, 총인구수, 세대수, 세대당 인구수, 남녀 인구수 및 비율, 연앙인구 등 다양한 항목으로 구성되어 있습니다. 특히 연앙인구 항목은 연령별·성별로 세분화된 정보를 제공하여, 특정 연령대의 인구 분포를 분석할 수 있게 합니다. 각 연령대는 15세부터 5세 단위로 구분되어 있으며, 남녀별 비중과 성비를 동시에 확인할 수 있어 인구 구조의 특성과 불균형 문제를 진단하는 데 유용합니다. 본 데이터는 도시계획, 복지정책, 교육 및 보건 서비스 설계 등 다양한 공공 행정 목적과 학술 연구, 시장 분석에도 활용될 수 있습니다.
