summary_user: 전국 연속지적도를 기준으로 만든 지적도 도곽(인덱스) 단위의 위치·범위를 담은 공간 데이터로, 축척 1:500부터 1:6,000까지 여러 축척의 도곽을 SHP 형식으로 시도별 파일에 담는다. GIS 분석가나 지적 업무 담당자가 어떤 필지가 몇 번 도곽, 어느 축척 지적도에 속하는지 찾을 때나 도곽 경계를 지도에 겹쳐 도면을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 공간 중첩으로 잇거나, 시군구 식별값(SGG_OID)·행정구역 구분처럼 이름·코드를 매핑해서만 연결한다.
description_portal: 국토교통부 지적도인덱스는 전국 지방자치단체 부동산종합공부시스템과 연계하여 수집·제공되는 데이터로, 연속지적도를 기반으로 작성된 인덱스 도곽 정보를 포함한다. 제공 범위는 축척 1:500, 1:600, 1:1,000, 1:1,200, 1:2,400, 1:3,000, 1:6,000 등 다양한 수준으로 구성되어 있으며, 지적도 도곽 단위의 위치와 범위를 파악할 수 있다. 이를 통해 지적도 분할·관리 체계에 따른 공간적 참조를 제공하고, 지적업무 처리와 공간분석의 기본 자료로 활용된다.이 데이터는 SHP(Shapefile) 형식으로 제공되며, GIS 소프트웨어(ArcGIS, QGIS 등)에서 직접 불러와 공간분석이나 도면 제작에 활용할 수 있다. 좌표·속성 정보를 동시에 포함하고 있어 다른 공간데이터와의 연계성이 높으며, 지적도 기반 행정업무, 연구, 민간 서비스 개발 등 다양한 분야에서 기초 공간자료로 쓰인다.
