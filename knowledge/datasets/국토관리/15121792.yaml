description_portal: 본 데이터는 한국수자원공사가 정읍시 지역에 시범 구축한 스마트계량기(스마트미터)를 통해 수집한 수도검침 데이터를 정제·가공한 공공자료이다. 2023년 1월부터 6월까지 약 1% 계량기를 무작위 선정해 일별 수돗물 사용량을 측정하였으며, 계량기는 익명번호로 처리되어 CSV 형식으로 월별 제공된다. 제공 항목은 계량기 식별번호와 일자별 사용량이며, 민감정보는 비식별화와 익명처리를 거쳐 안전하게 개방된다. 본 데이터는 독거노인 생활 모니터링, 급수 이상징후 탐지, 스마트시티 기반 연구 등 공익적 목적에 적합하다. 활용자는 급수량 변동을 수치화하여 수요 예측, 이상패턴 분석, 물사용 행태 파악 등 정량적 분석에 활용할 수 있다.
