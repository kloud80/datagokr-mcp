summary_user: 서귀포시 관내에서 고시된 도로명주소를 건별로 담은 파일로, 각 행에 종전 지번주소와 대응 도로명주소, 도로명고시일·도로명주소고시일, 도로명부여 사유가 함께 들어 있다(CSV 약 10MB). 주민·민원 담당자·분석가가 '이 지번주소가 어떤 도로명주소로 바뀌었고 언제 고시됐나', '이 도로명은 어떤 취지로 붙었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 주소 데이터와는 종전주소·도로명주소 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 서귀포시 관내에서 고시된 도로명주소 관련 현황을 정리한 데이터 입니다. 각 행은 종전주소(지번 기반 주소)와 이에 대응하는 도로명주소가 함께 수록되어 주소 전환·정비 내역을 확인할 수 있습니다. 또한 도로명 자체가 고시된 일자(도로명고시일)와 해당 도로명주소가 고시된 일자(도로명주소고시일)가 포함되어, 시기별로 주소가 언제 고시되었는지 조회하거나 이력 관리에 활용할 수 있습니다. 아울러 도로명부여 사유 정보를 제공해 도로명 명칭의 취지와 의미르 파악하는 데 참고할 수 있으며, 행정업무, 미원안내, 데이터 분석 등 다양한 용도로 활용 가능합니다.
