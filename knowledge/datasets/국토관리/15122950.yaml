description_portal: 지적재조사 사업지구 실시계획을 수립한 때에는 예정지구임이 지적공부에 등록된 토지를 대상으로 토지현황조사를 합니다.토지현황조사 중 토지현황 현지조사는 지적재조사측량과 병행하고 작성내용은 아래와 같습니다.1. 조사항목별 내용을 기록할 때는 별표의 토지현황조사표 항목코드에 따라 속성 및 코드로 항목속성에 부합되게 작성2. 조사서에 사용하였던 관련서류는 디지털화하고, 디지털화하기 어려운 비규격 용지의 경우 별도의 장소에 보관3. 현황사진은 해당 토지의 이용현황과 주변 토지의 이용현황을 드론 또는 항공사진측량 등으로 촬영한 정사영상자료에 해당토지의 점유현황 경계를 표시. 다만, 비행금지구역 또는 보안규정 등으로 인하여 작성할 수 없는 경우에는 생략4. 토지특성은 현장조사를 통해 필지별로 조사5. 건축물 등에 관한 사항은 지상건축물의 층수, 이용현황, 거주 및 경작자 현황 등을 조사하여 작성6. 현황경계는 동서남북의 방위별로 경계형태, 경계폭, 연접토지현황, 연접토지와의 고저 등을 상세하게 작성, 명확한 경계가 없는 경우에는 특이사항에 현실경계현황을 구체적으로 작성7. 토지현황조사 과정에서 나타나는 특이사항 등은 조사자 의견란에 구체적으로 작성하고, 작성할 내용이 많은경우 별지로 작성작성된 토지현황 현지조사 내용의 입회일자, 현지조사일자, 자료조사일자, 항공/정사영상 구분, 이용현황 등에 대한 데이터 파일입니다.
