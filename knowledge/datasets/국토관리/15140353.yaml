description_portal: 서울특별시 강서구 주택과에서 관리하고 있는 주택관리업자 및 임대주택관리업자 사업자 정보, 연락처, 주소, 업체명 등의 정보입니다.서울 강서구 내에서 활동 중인 공동주택(아파트,연립주택 등) 관리업체 및 임대주택 관리업체에 대한 정보입니다. 등록된 업체의 상호, 대표자, 주소, 등록번호, 등록일자, 관리 대상 단지명 등이 포함되며, 공동주택 관리의 투명성 확보와 입주자 대표회의의 업체 선정 시 참고자료로 활용됩니다. 특히 민간임대주택 관리 품질이나 민원 이력 등을 분석하는 데도 유용하며, 주거복지 및 주택행정 정책 수립에 필요한 기반 데이터입니다.강서구 주택과(02-2600-6821)로 연락주시기 바랍니다.
