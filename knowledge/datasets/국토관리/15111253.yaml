summary_user: 서울 양천구 관내 공원을 한 건씩 담은 원천 목록으로, 공원명·공원구분·면적·지정고시일과 주소·위경도, 운동·유희·편익·교양 등 보유시설, 관리기관 연락처를 공원 단위로 제공한다. 주민이나 분석가가 '우리 동네 행정동 안에 운동시설이 있는 근린공원은 어디이고 면적은 얼마인가'를 확인하거나 동별 공원 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 데이터와는 행정동명·행정동 ID(emdid), 주소, 위경도 좌표를 매핑하거나 같은 기관 코드로 이어 써야 한다.
limits: 범위가 양천구 한 개 시군구로 한정돼 다른 구나 서울 전체 공원과 비교하려면 별도 데이터를 모아야 한다. 공통 조인 키가 없어 이름·주소·좌표 매칭에 의존하므로 연결 시 오매칭을 점검해야 한다. 호출에는 포털 활용신청(자동승인) 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
