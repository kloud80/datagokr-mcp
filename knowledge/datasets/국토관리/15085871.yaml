summary_user: 2개 시도에 걸쳐 조성된 산업단지 4곳(한국수출·명지녹산·빛그린·아산)을 시도별로 나눈 8개 단지 단위로, 지정·관리면적, 산업시설구역 분양·미분양 면적과 분양률, 입주계약·가동업체 수를 담은 분기별 집계 파일입니다(약 1KB CSV). 지역 산업정책 분석가가 '시도 경계에 걸친 산단의 각 시도 쪽 분양률과 가동업체 수가 어떻게 다른가'를 확인할 때 씁니다. 전역 조인 키가 없어 다른 산단 통계나 단지 원장과는 단지명·시도 이름 매칭으로 이어 씁니다.
description_portal: 본 통계는 2개 시도에 걸쳐 조성·관리되는 산업단지를 대상으로 한 분기별 통계 자료입니다. 해당 유형에 속하는 산업단지는 한국수출산업단지(서울특별시, 인천광역시), 명지·녹산국가산업단지(부산광역시, 경상남도), 빛그린국가산업단지(광주광역시, 전라남도), 아산국가산업단지(경기도, 충청남도)로 총 4개 산업단지가 이에 해당합니다.다만, 본 통계표에서는 각 산업단지를 시도별로 구분하여 집계함에 따라, 통계상으로는 총 8개 산업단지로 표시됩니다. 이는 통계 작성 및 제공 과정에서의 행정구역 기준 분리 집계 방식에 따른 것으로, 실제 산업단지의 물리적 개수는 4개임을 유의할 필요가 있습니다. 이로 인해, 본 자료에 포함된 2개 시도에 걸친 산업단지들로 인해 다른 통계표에 제시된 산업단지 총 개수와 요약 통계표의 전체 산업단지 수 간에 값의 차이가 발생할 수 있습니다. 통계 해석 및 활용 시에는 이러한 중복 계상 가능성을 충분히 고려하여 주시기 바랍니다.아울러, 시도별 현황 표에서는 해당 산업단지들이 각 시도별로 중복 표기되어 나타나므로, 시도별 통계는 개별 시도의 산업단지 현황을 파악하기 위한 참고자료로 활용하고, 전국 단위 또는 전체 규모 분석 시에는 중복 여부를 감안한 해석이 필요합니다.본 통계 항목에는 상위단지명, 시도, 시군, 단지명, 조성상태, 지정면적, 관리면적, 분양률, 입주업체 수, 가동업체 수 등이 포함되어 있으며, 이는 하나의 상위 산업단지에 속한 각 하위 단지별 세부 현황과 운영 실태를 체계적으로 설명하기 위한 것입니다. 이를 통해 2개 시도에 걸친 산업단지의 공간적 특성과 관리·운영 현황을 보다 입체적으로 파악할 수 있도록 구성되었습니다.
legal_basis_portal: 2개 시도에 걸친 산업단지에 대한 통계자료로 한국수출산업(서울, 인천), 명지·녹산(부산, 경남), 빛그린(광주, 전남), 아산국가(경기, 충남) 산업단지의 하위단지에 대한 통계자료를 설명하기 위해 공표
