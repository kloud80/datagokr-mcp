summary_user: 경기도 이천시가 도시계획상 공동개발을 권장한 구역을 현황도형 관리번호·라벨명·생성일 단위로 담은 목록 파일로, 2,642바이트 규모의 작은 CSV입니다. 인접 필지를 묶어 개발하려는 사업자나 도시계획 분석가가 '이천시에서 어느 구역이 언제 공동개발 권장지로 지정됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 현황도형 관리번호나 라벨명을 이름 매핑하거나 같은 기관(이천시) 데이터끼리만 연결한다.
description_portal: 경기도 이천시에서 도시계획 상 공동개발을 권장하는 지역에 대한 공간 정보를 제공하는 데이터입니다. 항목은 현황도형 관리번호, 라벨명, 생성일 등으로 구성되어 있으며, 특정 구역이 도시계획상 공동개발 권장지로 지정된 이유와 시점을 확인할 수 있습니다. 본 데이터는 도시의 효율적 토지 이용, 인접 필지 통합 개발 유도, 기반시설 공동 설치, 재개발 구역 사전 검토, 장기미개발지 관리 등에 활용됩니다. 특히 현황도형은 SHP(GIS) 기반의 공간분석 자료로 연계되어, 국토부 및 지자체 도시관리계획 수립 시 정책적 판단을 지원하는 핵심 자료입니다.
