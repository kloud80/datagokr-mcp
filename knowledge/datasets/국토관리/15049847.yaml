summary_user: K-water가 관리하는 수위관측소별로 관측소 코드·이름·수계·경위도·관측개시연도를 한 행씩 담은 제원 목록이며, 전국 범위의 작은 CSV 파일(약 6KB)입니다. 가뭄·수문 분석가가 '이 수계에 어떤 수위관측소가 어디에 있고 언제부터 관측했나'를 확인하거나 관측소를 지도에 찍을 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 수위 시계열 등 다른 자료와는 관측소 코드나 관측소명 매핑으로 연결하고, 위치는 경위도로 공간 결합한다.
