summary_user: 문경시 일반건축물의 시가표준액을 건물(동·호) 단위로 담은 파일 데이터로, 소재지(법정동·리, 본번·부번), 연면적, 과세년도, 기준일자와 함께 건별로 제공한다. 납세자나 부동산 분석가가 '문경시 특정 지번 건물의 과세 기준이 되는 시가표준액이 얼마인가'를 확인하거나 지역별 건물 가액 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서 법정동·리와 본번·부번 같은 지번 정보를 이름·코드로 맞추거나 자치단체코드로 같은 기관 자료와 연결해야 한다.
description_portal: 일반건축물에 대한 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 연면적, 기준일자, 시가표준액 등의 정보는 건축물 및 부동산 관련 행정 업무나 등기, 세금 부과, 자산 평가 등에 사용되는 데이터입니다. 법정동과 법정리는 행정구역을 구분하는 기본 단위로, 건축물이 위치한 지역을 명확히 식별할 수 있게 해 줍니다. 특수지는 토지 이용 목적이나 지형적 특성을 반영하는 항목이며, 본번과 부번, 동, 호는 건축물 내 세부 위치를 나타내는 상세 주소 체계입니다. 물건지는 건축물이나 토지의 고유 식별 정보로, 연면적은 건축물의 총 바닥 면적을 의미합니다. 기준일자는 해당 정보가 유효한 시점을 나타내며, 시가표준액은 과세나 평가 기준이 되는 표준 시가를 의미합니다. 이 모든 정보는 부동산 거래, 평가, 관리, 세무처리 등 다양한 분야에서 활용됩니다.
