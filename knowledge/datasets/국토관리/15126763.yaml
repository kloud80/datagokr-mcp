summary_user: 한국농어촌공사가 관리하는 농업용 저수지 5곳(괴산 백마·보은 백록·구례 백련·청도 남성현·순창 난계)의 저수위(EL.m 표고)와 저수율(%)을 1시간 단위로 계측한 원천 시계열로, 포털 설명상 기간은 2021년 6월 1일부터 2024년 2월 8일까지이며 zip 파일로 받는다. 농업용수·수자원 분석가가 특정 저수지의 가뭄기·홍수기 저수율 변화나 일·계절별 수위 변동 패턴을 살펴보는 데 쓴다. 파일 안에 저수지코드 같은 전역 조인 키가 없어, 다른 저수지 제원·기상 자료와는 저수지 이름 매핑과 관측 일시(관측 년월일시간)를 기준으로 맞춰 이어 쓴다.
description_portal: '이 데이터는 한국농어촌공사가 관리하는 아래 5개 저수지의  저수위(EL.m) 표고값과 저수율(%) 데이터로 일자별 1시간 주기 계측데이터 정보 제공합니다.데이터 제공 기간 : 2021.06.01 ~ 2024.02.08 - 충북 괴산 백마저수지 - 충북 보은 백록저수지 - 전남 구례 백련저수지 - 경북 청도 남성현저수지 - 전북 순창 난계저수지저수위는 저수지 내의 물의 높이, 저수율은 전체 저장 가능 용량 대비 현재 물의 비율을 뜻합니다.해당데이터는 농업용수, 가뭄,홍수대비, 용수공급 계획, 환경 모니터링 등 다양한 분석에 활용될 수 있습니다.'
