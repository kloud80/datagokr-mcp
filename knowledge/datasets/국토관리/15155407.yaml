summary_user: 한국토지주택공사가 낸 대토보상 계획 공고를 공고 건별로 담은 원천 파일로, 공고명·공고기간·사업지구명·대상자 선정기준·가격사정 방법·필지수·보상면적·단가·기준면적·토지용도 등을 전국 범위에서 수록한다. 개발사업지구 토지소유자나 보상 분석가가 '우리 사업지구에서 대토보상은 어떤 기준으로 누구에게, 어떤 용도의 토지를 얼마의 단가로 주는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 보상·사업지구 데이터와는 사업지구명 같은 이름 매칭이나 같은 기관(LH) 데이터 기준으로만 이어 쓴다.
description_portal: 본 데이터는 한국토지주택공사의 보상 업무 중 대토보상 계획 공고에 해당하는 공고 상세 내용을 제공합니다. 신규 토지 개발 사업을 진행함에 있어서 해당 사업지구 내 원주민들의 재산에 대한 정당한 대가를 지급하는 것을 보상이라고 하는데 일반적으로는 보유 재산에 대한 감정평가를 통해 결정된 금액을 금전으로 보상하지만, 경우에 따라서는 개발 사업 이후에 새롭게 조성되는 토지로 대신 보상하는 방식을 사용하기도 하는데 이를 대토보상이라고 합니다. 그러므로 이 데이터는 그러한 대토보상을 하겠다는 계획에 대한 공고 상세 내용이라고 이해하면 됩니다. 여기에는 대상 사업지구, 대상자선정기준, 가격사정방법, 필지수, 보상면적, 단가, 기준면적, 토지용도 등이 포함되어 있습니다.
