summary_user: 경기도 광주시 도시계획정보시스템에 등재된 건축물대장 목록을 건물 한 건 단위로 담은 파일로, 시군구·법정동·본번·부번·건축물명 같은 기본 식별 정보를 담는다. 광주시 특정 법정동·지번에 어떤 건축물이 대장에 올라 있는지, 동별로 건축물이 얼마나 등재돼 있는지를 확인하려는 부동산·도시계획 분석가나 시민이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 법정동 이름과 본번·부번(지번)을 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 경기도 광주시의 도시계획정보시스템의 건축물대장 목록 정보를 제공합니다. 광주시에 등재된 건축물의 기본 식별 정보를 담고 있어 건축물 현황 파악과 관리에 활용됩니다. 법정동은 건축물이 위치한 행정구역을 나타내며, 건축물대장 본번과 부번은 건축물의 고유 지번을 제공합니다. 건축물명은 건물의 명칭을 나타냅니다. 본 데이터는 건축물 관리, 부동산 정보 제공, 도시 계획 수립, 건축 통계 분석, 재산세 과세 자료, 건축 인허가 업무 등에 활용되며 체계적인 건축물 관리와 효율적인 도시 행정 운영을 지원합니다.
