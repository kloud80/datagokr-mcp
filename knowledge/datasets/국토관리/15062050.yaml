summary_user: 전북개발공사가 분양하는 토지의 필지별 분양 상세정보(감정평가 차수·연도·감정가와 단가, 확정 여부와 확정일 등)를 사업구분코드와 필지관리번호 단위의 건별 기록으로 담는다. 전북개발공사 사업지구의 토지 분양을 검토하는 사업자나 분석가가 "이 필지의 감정평가 가격과 단가가 차수별로 어떻게 바뀌었나" 같은 질문에 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 찾지 못했으므로, 같은 기관의 사업구분코드(businesscode)·필지관리번호로 기관 내 데이터와 잇거나 지구명·지번을 이름 매핑해 연결한다.
limits: 전역 조인 키가 없어 국토부 공시지가·실거래 등 타 기관 데이터와 바로 결합할 수 없고 이름·코드 매핑이 필요하다. 갱신은 분양 같은 이벤트 때 생성된 뒤 바뀌지 않는 방식이며, 개발계정 호출은 일 10,000회로 제한된다.
