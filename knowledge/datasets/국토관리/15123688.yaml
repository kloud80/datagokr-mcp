summary_user: 경기도 부동산포털의 건물별 부속지번 정보로, 건물번호마다 주된 토지 외에 함께 쓰는 보조 지번(부속지번)을 토지고유번호·토지소재지·건물명과 함께 개별 주소 단위로 담는다. 공인중개사나 부동산 분석가가 "이 건물 부지가 어떤 필지들에 걸쳐 있는가"를 확인해 등기·세금·용도지역 검토의 기초자료로 쓴다. 토지고유번호(land_idntfy_no)가 있어 필지 단위 지적 자료와 맞춰 볼 여지가 있으나, 실측상 전역 조인 키로 확인되지는 않아 지번·소재지 이름 매핑이나 같은 기관 자료와의 연결로 이어 쓴다.
description_portal: "이 데이터는 경기부동산포털에서 제공하는 건물과 해당 부속지번 간의 관계를 나타낸 정보로, 건물번호를 기준으로 주된 토지 외에 함께 사용하는 보조 지번(부속지번)을 확인할 수 있습니다. 주요 항목은 '토지고유번호', '건물번호', '토지소재지', '건물명', '부속지번'으로 구성되어 있으며, 이는 건물의 부지와 연계된 토지 정보 파악 및 지적 연계성 분석에 활용됩니다. 예를 들어 하나의 건물이 여러 필지를 포함할 경우 이를 명확하게 식별할 수 있어, 부동산 거래 시 등기, 세금, 용도지역 해석 등에 필요한 기초정보를 제공합니다.※ 부속지번 : 하나의 집합 대장 내에 존재하는 여러 토지 번호"
