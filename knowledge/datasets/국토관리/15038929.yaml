summary_user: 인천 계양구 관내 건축물별 건축허가·착공신고·사용승인 현황을 건별로 담은 CSV 파일(약 417KB)로, 대지위치·지목·구조·주용도·용도지역과 허가일·착공처리일·사용승인일, 설계·감리·시공 사무소명을 함께 담는다. 분석가나 지역 사업자가 '계양구에서 최근 어떤 용도의 건물이 어느 동네에 착공되고 있나'처럼 지역 개발 흐름의 선행 지표를 볼 때 쓴다. 실측 컬럼에 전역 조인 키(건축물대장 PK·법정동코드·PNU 등)가 없어, 다른 건축물대장·인허가 데이터와는 대지위치 주소나 용도명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 인천광역시 계양구 관내 건축허가, 착공신고, 사용승인 현황을 상세히 제공합니다. 주요 항목으로는 구분, 건축구분, 지목, 구조, 허가일, 착공처리일, 사용승인일, 주용도, 부속용도, 용도지역, 용도지구, 용도구역, 설계사무소, 감리사무소, 시공자사무소명 등이 포함되어 있습니다. 이를 통해 각 건축물의 허가부터 착공, 사용 승인까지의 전 과정을 체계적으로 파악할 수 있으며, 건축 행정의 투명성 확보와 효율적 관리에 중요한 자료입니다. 데이터는 정기적으로 갱신되며 CSV 형식으로 제공되어 다양한 분석과 도시계획, 건축 정책 수립에 활용됩니다. 공공데이터포털에서 무료로 다운로드 가능합니다.
