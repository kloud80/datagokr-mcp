summary_user: 제주국제자유도시개발센터(JDC)가 운영하는 노스런던컬리지스쿨 제주(NLCS Jeju)의 2019년 기준 학생현황을 유치원부터 13학년까지 과정(학년)별 한 행씩 담은 소규모 집계 파일(약 493바이트 CSV)입니다. 학부모나 교육정책 분석가가 "이 국제학교의 학년별 승인정원 대비 실제 재학생은 몇 명이고, 내국인·외국인 비율과 성비는 어떤가"를 확인하는 데 씁니다. 전역 조인 키가 없어 다른 제주국제학교 학생현황 파일과는 과정 구분(학년) 이름을 맞춰 나란히 비교하는 방식으로만 이어 씁니다.
description_portal: 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주국제학교 중 하나인 노스런던컬리지스쿨 제주(NLCS Jeju)의 2019년 기준 학생현황 정보입니다. 이 데이터는 국제학교 운영 현황을 분석하는 데 활용되며, 각 항목은 과정 구분, 과정 구분(중복 항목 포함), 과정 구분(국제학교 기준), 승인정원, 학급수, 성별(남), 성별(여), 국적별(외국인), 국적별(내국인)으로 구성되어 있습니다. 과정 구분 항목은 유치원을 포함하여 1학년부터 13학년까지 연령대별 교육 과정에 따라 구분되어 있습니다. 승인정원 항목은 각 학년별로 수용 가능한 최대 인원을 나타내며, 학급수는 실제 운영 중인 학급의 수를 의미합니다. 성별과 국적별 항목을 통해 각 학년별로 남학생과 여학생, 외국인과 내국인 학생의 수를 구체적으로 파악할 수 있어, 학교의 국제화 정도, 성비 분포, 정원 대비 충원율 등을 종합적으로 분석하는 데 활용될 수 있는 구조로 구성되어 있습니다.
