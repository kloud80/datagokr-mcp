summary_user: 광주 서구 관내 주거지역·상업지역·녹지지역의 면적(㎡)을 연도별로 한 행씩 담은 집계 표로, 378바이트 크기의 작은 CSV 파일이다. 도시계획 담당자나 분석가가 "서구의 주거·상업·녹지 면적 비율이 해마다 어떻게 바뀌었나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 자치구 이름을 맞춰 연결해야 하며, 같은 기관이 낸 다른 서구 통계나 타 자치구 용도지역 면적과 연도 기준으로 나란히 비교하는 방식으로 쓴다.
description_portal: '「광주광역시 서구 용도지역 면적」 데이터는 지역 개발 및 도시계획 수립에 필요한 공간정보 기반 통계자료로, 서구 관내 주거지역, 상업지역, 녹지지역의 **연도별 면적 현황(단위: ㎡)**을 구분하여 제공합니다.이 데이터는 각 용도지역별 면적 변화 추이를 통해 토지이용 특성, 공간 구조 변화, 개발 압력 분포 등을 파악할 수 있으며, 주거지역 면적은 주택 공급 및 정주환경 평가, 상업지역은 상권 분석 및 창업 지원 정책 수립, 녹지지역은 환경보전, 도시숲 조성, 생태계 관리 등에 기초자료로 활용됩니다.특히 용도지역 간 면적 비율 변화는 도시 기능의 균형성 확보, 미래 도시공간 구조 설계, 도시 재편 전략 수립에 중요한 판단 근거가 되며, 지자체의 토지이용계획 수립, 용도지역 조정계획 수립, 지속가능한 도시개발 정책 마련에 필수적인 핵심 데이터입니다.해당 데이터는 표준적인 CSV 형식으로 제공되며, 연도별로 정기 갱신되어 시계열 분석 및 공간계획 도구와의 연계 활용도 매우 높습니다.'
