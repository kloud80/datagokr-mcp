description_portal: 스마트공장 AS 지원사업 신청유형 현황은 중소벤처기업진흥공단의 스마트공장 AS 지원사업 참여기업의 신청 유형별 현황을 실적 기준일을 기준으로 정리한 자료입니다.신청유형은 정기 AS, 긴급 AS, 역량제고코칭 등으로 구분되며, 각 유형별 협약 건수와 참여 기업 수, 실적 기준일에 대한 데이터를 제공합니다.스마트공장 AS 지원사업은 스마트공장 도입기업을 대상으로 부품교체, 소프트웨어 업그레이드 등 운영 애로사항 해결 지원을 통해 스마트공장 활용도 및 효율성 향상을 지원하는 제도입니다.* 본 사업은 2023년 지원사업 이후 폐지되어 자료가 더 이상 갱신되지 않습니다.
