summary_user: 경기도 내 주택법상 사업계획승인을 받아 준공된 공동주택과 건축허가를 받아 준공된 30세대 이상 주상복합을 단지별로 담으며, 시군명·단지명·지번주소·사용검사일자·최고층수·동수·세대수·의무관리대상 여부를 포함한다. 분석가나 주민이 '우리 시군에 의무관리대상 공동주택이 몇 단지이고 언제 준공됐는가'처럼 지역별 공동주택 재고와 노후도를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)이나 지번주소, 단지명 매칭으로만 잇는다.
description_portal: '주택법에 따라 사업계획승인을 받아 준공된 공동주택 및 건축법에 따라 건축허가를 받아 준공된 30세대 이상 주상복합에 대해 작성된 자료입니다.· 사용검사일자 : 준공검사일자· 층수 : 해당 공동주택의 최고층수· 의무관리대상① 300세대 이상의 공동주택② 150세대 이상으로서 승강기가 설치된 공동주택③ 150세대 이상으로서 중앙집중식 난방방식(지역난방방식을 포함한다)의 공동주택④「건축법」 제11조에 따른 건축허가를 받아 주택 외의 시설과 주택을 동일 건축물로 건축한 건축물로서 주택이 150세대 이상인 건축물⑤ ①~④에 해당하지 아니하는 공동주택 중 입주자등이 대통령령으로 정하는 기준에 따라 동의하여 정하는 공동주택'
