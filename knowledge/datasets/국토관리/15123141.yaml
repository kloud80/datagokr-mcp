summary_user: 경기도 내 부동산 중개사무소와 측량업체를 업체 한 곳당 한 행으로 담은 목록으로, 업체구분·고유번호·업체명·주소·업종명을 담는다. 특정 시군에 중개사무소나 지적측량업체가 얼마나, 어디에 있는지 알고 싶은 주민·사업자·정책 분석가가 위치 기반 업체 조회나 행정지도 구축에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소(addr)나 업체명 같은 이름 매핑으로만 이어 쓰며, 업체 고유번호는 경기부동산포털 내부 식별용이다.
description_portal: 이 데이터는 경기도 내 부동산 중개사무소와 측량업체에 대한 정보를 제공하며, 업체구분, 고유번호, 업체명, 주소 등의 항목으로 구성되어 있습니다. 중개사무소는 공인중개사 등록 기관, 측량업체는 지적 및 공간정보 관련 서비스 제공 기관으로서 행정구역별 주소 정보를 포함합니다. 고유번호는 각 업체를 식별하기 위한 고정값이며, 이는 경기부동산포털 내에서 공간정보 서비스나 민원연계 시스템 구축 시 활용됩니다. 해당 데이터는 부동산 거래 서비스 인프라 현황 분석, 지적측량업 등록현황 파악, 공공정책 수립 자료로 활용될 수 있으며, 위치 기반 중개업체 조회, 행정지도 구축, 공간데이터 시각화 등의 기초자료로도 유용합니다.
