description_portal: '○ 통계개요* 통계명 : 미분양주택현황* 통계종류 : 분양주택 중 미분양 주택현황을 파악하여 보고하는 일반·보고 통계* 작성목적 : 매월 지역별 미분양 주택현황을 파악하여 주택공급정책의 기초자료로 활용* 조사체계 : 시군구 → 시도 → 국토교통부* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 민간 미분양 현황 및 준공후 미분양 주택 현황○ 용어설명* 공공부문 : 국민주택기금을 지원받아 건설하는주택* 민간부문 : 국민주택기금을 지원받지 않고 순수 민간자본으로 건설하는 주택* 미분양 : 사업계획 승인권자로부터 분양승인을 받아 일반인을 대상으로 분양을 실시하였으나 분양되지 않은 주택* 준공 후 미분양 : 사용검사 후에도 분양되지 않은 주택'
