summary_user: 경상남도와 시군의 아파트전세가격지수를 행정동코드와 데이터기준일별로 담은 파일이며, 포털 설명에 따르면 통계청 자료를 경남빅데이터허브플랫폼에서 정제한 집계 지수입니다. 경남 지역 전세시장 분석가가 '최근 몇 년 사이 창원·김해 등 시군의 아파트 전세가격이 어떻게 움직였나'를 비교할 때 쓴다. 행정동코드와 시도명·시군구명·읍면동명 필드가 있으나 실측에서 전역 조인 키는 확인되지 않았으므로, 다른 주택가격 통계와는 지역 이름이나 코드 매핑으로 이어 쓴다.
description_portal: (데이터 수집목적 및 과정) 경상남도 아파트전세가격지수 데이터는 경남빅데이터허브플랫폼 DB 내에서 관리하고있는 경상남도 및 시군의  아파트전세가격지수에 대한 정보입니다. 출처는 통계청이며 정제하여 플랫폼에 제공하고 있습니다.(데이터 구성 및 세부항목)  아파트전세가격지수 데이터는 행정동코드, 데이터기준일, 아파트전세가격지수로 구성됩니다. 행정동코드에 대한 설명은 코드북을 활용하여 주시기 바랍니다.(데이터 현행화 시기) 해당 데이터는  1회성 데이터며 현행화 하지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼-데이터분석-경남도정현황을 참고하여 주시기 바랍니다.
