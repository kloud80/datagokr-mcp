summary_user: 나주시 관내 산업단지에 입주한 공장을 회사 한 곳당 한 행으로 담은 건별 목록으로, 단지 구분·회사명·대표자·도로명 주소·전화번호·생산품을 시군구 범위에서 개별 주소 단위로 수록한다(CSV 약 148KB). 나주시에 투자하거나 거래처를 찾는 사업자, 지역 제조업을 분석하는 사람이 '나주 어느 산업단지에 어떤 품목을 만드는 공장이 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 단지 이름이나 회사명, 도로명 주소를 맞춰 붙여야 하며, 전국산업단지및공장정보표준데이터나 국토부 산업단지 일반현황과는 단지명으로 산업단지코드를 찾아 연결한다.
description_portal: 본 데이터는 전라남도 나주시 관내에 위치한 공장의 등록 현황을 종합적으로 제공한다. 수록 항목에는 공장명, 소재지 주소, 대표자, 공장, 입주 산업단지 명칭, 생산품 등 각종 세부 정보가 포함되어 있다. 데이터는 나주시의 제조업 기반 현황 파악, 산업 입지 계획, 신규 공장 설립 심의, 지역경제 분석, 정책 수립과 산업단지 관리 등 다방면에 활용된다. 특히 지역별 공장 분포와 성장 동향, 가동률 및 업종별 특성을 분석해 투자유치나 중소기업 지원 정책 마련의 기초자료로 활용 가치가 크다. 또한 입지 조건, 공장 규모와 유형, 행정지원 내역 등 다양한 정보를 체계적으로 제공하여 관련 기관, 기업, 연구자, 주민 등에게 경제활동과 지역발전을 위한 신뢰성 높은 정보를 제공한다.
