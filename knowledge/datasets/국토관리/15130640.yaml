summary_user: 부산도시공사가 공급·운영하는 임대주택을 지구별로 담은 데이터로, 지구명·임대유형(영구임대·재개발임대·행복주택·국민임대 등)·공급 세대수·소재지(구·군)를 제공한다. 시민이 '내가 살고 싶은 구에 행복주택이나 국민임대 지구가 있는지, 몇 세대 규모인지'를 확인하거나, 분석가가 부산 구·군별 공공임대 공급 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 소재지의 구·군 이름이나 지구명을 문자열로 맞춰 연결해야 한다.
description_portal: '본 서비스는 부산도시공사가 공급·운영 중인 다양한 임대주택 유형(예: 영구임대주택, 재개발임대, 행복주택, 국민임대 등)에 대한 정보를 제공합니다.사용자는 본 서비스를 통해 각 임대주택 유형별 공급 세대수를 확인할 수 있으며, 해당 주택이 위치한 구·군(지역구 기준)의 소재지를 함께 조회할 수 있습니다.이를 통해 시민들은 자신이 원하는 임대주택 유형과 희망 거주지역에 대한 정보를 한눈에 파악할 수 있으며, 또한 행정기관이나 연구기관 등에서는 본 서비스를 활용하여 주택 공급 현황 분석 및 주거복지 정책 수립 시 참고자료로 활용할 수 있습니다.'
