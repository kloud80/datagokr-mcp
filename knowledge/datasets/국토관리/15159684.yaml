description_portal: 김천시는인구감소와고령화,주택노후화등의영향으로증가하는빈집문제에대응하기위해빈집실태조사와정비사업을지속적으로추진하고있다.장기간방치된빈집은화재,붕괴,범죄발생우려등주민안전을위협하는요인으로작용함에따라철거및안전조치를실시하고있다.또한빈집관리시스템을통해대상주택을체계적으로관리하며,활용가능한빈집은주거지원시설,마을공동체공간,생활SOC시설등으로재활용하여지역활성화를도모하고있다.이를통해쾌적한주거환경조성,도시미관개선,주민삶의질향상은물론지속가능한지역발전기반마련에도기여하고있다.
