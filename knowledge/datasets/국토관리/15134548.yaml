summary_user: 역대 정부 임기별로 전국 개별입지 공장의 공간 분포 패턴을 분석하고, 개별공장 핫스팟과 입지 확률이 함께 높으면서 기존 산업단지 접근성이 좋은 지역을 신산업입지 후보군으로 뽑은 분석 결과 파일로, 시도별 XLSX로 내려받는다. 시군청이나 지역 산업정책 담당자, 분석가가 '우리 지역에서 산업단지 밖 개별공장이 몰리는 곳은 어디이고, 신규 산업입지 후보로 검토할 만한 곳은 어디인가'를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 공장등록 현황이나 산업단지 통계와는 지역 이름·행정코드 매핑으로만 이어 쓴다.
limits: 공간빅데이터 분석플랫폼 수요분석과제의 결과물이라 건별 공장등록 원부가 아니며, 사업자번호·업종코드·필지번호 같은 키가 없어 개별 기업·토지와 직접 연결하지 못한다. 파일은 vworld.kr 로그인 뒤 공간정보 다운로드 페이지에서 시도별로 받으며 포털 활용신청과는 별개이고, 확인된 컬럼명이 표 머리말(Unnamed) 형태라 파싱 때 헤더를 직접 정리해야 한다.
