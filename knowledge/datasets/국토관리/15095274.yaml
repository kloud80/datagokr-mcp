summary_user: 광주광역시 종합건설본부 품질시험팀이 운영하는 건설공사 품질시험의 종별·시험종목별 수수료(원), 처리기간(일), 시료량을 담은 고시 기반 안내 목록이며, 건별 원천 기록이 아니라 요금표 형태의 파일(csv, 약 9.9KB)이다. 건설 사업자나 현장 관리자가 '특정 자재 시험을 의뢰하면 수수료가 얼마이고 며칠 걸리며 시료는 얼마나 내야 하나'를 확인하는 데 쓴다. 다른 데이터와 이을 전역 조인 키는 없어, 시험종목 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: '광주광역시 고시 제 2025-13 호  "2025년 건설공사 품질시험 수수료 및 현장시험 경비 고시"(광주광역시 건설공사 품질관리등에 관한 조례 제10조제2항)에 해당하는 내용이며, 광주광역시 종합건설본부 총무부 품질시험팀(국ㆍ공립시험기관)에서 운영 중인 품질시험 검사의 종류 및 수수료에 관한 안내사항임.□ 현장시험경비(차량경비 + 인건비) : 105,000원 ○ 장비운반차량 소요 경비(화물자동차 1톤급 10km이내 기준) : 65,000원 ○ 출장요원 인건비 : 40,000원(20,000원 × 2인)□ 수수료 적용시기 : 2025. 2. 1일부터'
