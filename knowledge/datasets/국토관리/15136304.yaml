summary_user: 경상남도 행정동코드별로 준공 후에도 팔리지 않은 미분양 주택 수를 민간·공공 부문과 전용면적 구간(40 이하, 40~60, 60~85, 85 초과)으로 나눠 담은 통계청 출처의 집계 파일로, 범위는 시도·읍면동 단위이고 포털 설명상 총 1,386건입니다. 경남 주택시장을 보는 분석가나 사업자가 '경남 어느 동네에 어떤 면적대의 준공후 미분양이 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 행정동코드나 지역명 매핑을 거쳐 이어 써야 한다.
description_portal: (데이터 수집목적 및 과정) 경남빅데이터허브플랫폼 준공후미분양 데이터는 경남빅데이터허브플랫폼 내에서 관리하고 있는 준공후미분양 데이터로, 출처는 통계청 입니다. 행정동 코드별 민간부문, 공공부문 준공후 미분양 데이터입니다.(데이터 구성 및 세부항목) 경남빅데이터허브플랫폼 준공후미분양 데이터는 행정동코드별 데이터이므로 행정동코드 부문(민간/공공), 면적부문(공공, 40 이하, 40-60, 60-85, 85 초과), 준공후미분양 건수로 구성되어 있습니다. 데이터는  총 1386건입니다.(데이터 현행화 시기) 1회성 데이터로 현행화되지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼을 참고하여 주시기 바랍니다.
