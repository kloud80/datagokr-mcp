summary_user: 진안군의 지번주소(법정 읍면동·리, 산 여부, 지번 본번·부번)와 도로명주소(도로명, 건물 본번·부번)를 한 행씩 대응시켜 담은 파일이며, 읍면동 단위까지 내려가는 군 단위 자료입니다. 옛 지번주소만 아는 주민이나 민원·배송 담당자가 '이 지번이 지금 어떤 도로명주소로 바뀌었나'를 확인하는 데 쓴다. 전역 조인 키나 코드 컬럼이 없어서, 다른 주소·건물 데이터와는 시군구명·법정동명·리명과 지번을 이름 그대로 맞춰 이어 쓴다.
description_portal: 전북 특별자치도 진안군의 도로명주소에 대한 공공데이터 정보입니다. 이번 자료에서는 연번, 시도 명, 시군구 명, 법정 읍·면·동명, 법정리 명, 산 여부, 지번 본번, 지번 부번, 도로명, 건물 본번, 건물 부번 정보를 제공합니다. 이 자료를 통해 진안군의 도로명주소의 세부 정보를 파악할 수 있습니다. 또한 지번 주소일 때 법정리 명과 지번 본번, 저번 부번이 도로명주소일 때 어떤 도로명 이름과 건물 본번, 건물 부번으로 바뀌었는지 확인할 수 있습니다. 그리고 2행부터는 대표 지번 정보, 15701행부터는 관련 지번 정보입니다.
