summary_user: 경기도 지역화폐 매출을 기준년월·시군구 단위로 성별·연령대(성연령코드)와 중분류업종별로 집계한 자료로, 매출금액과 그 비율, 전월·전년 동월 대비 증감값과 증감비율을 담는다. 지자체 정책 담당자나 분석가가 "우리 시군구에서 30대 여성의 지역화폐 소비는 어떤 업종에서 전년보다 늘었나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 시군구코드(signgu_cd)를 이름·코드로 매핑하거나 경기도의 같은 코드 체계를 쓰는 다른 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 지역화폐 사용에 따른 시군구별 성별 및 연령대별 매출 정보를 집계한 자료입니다. 기준년월을 기준으로 각 시군구코드 단위로 성연령코드(M30, F40, TOT 등)와 중분류업종코드(B1, B2 등)에 따라 매출금액이 기록되며, 이와 함께 매출금액비율, 전월 대비 증감값 및 증감비율, 전년 동월 대비 증감값 및 증감비율 등이 포함되어 있습니다. ‘성연령코드’는 남녀 및 연령대를 결합한 코드 값이며 이 데이터는 성별 및 연령대에 따른 지역화폐 소비 트렌드를 분석할 수 있습니다. 대용량 데이터로 다운로드는 파일탭을 이용해 주시기 바랍니다.
