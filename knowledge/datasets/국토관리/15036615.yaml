summary_user: 서울특별시 동대문구의 개발행위허가를 허가 건별로 담은 파일 데이터로, 해당년도·위치명·지목명·허가면적(제곱미터)·용도지역 및 지구·개발행위구분·허가일자·개발행위 목적 및 사유를 기록한다(csv 약 7KB 규모). 동대문구에서 어느 위치에 어떤 목적의 건축물 건립·공작물 설치·토지 형질 변경이 허가됐는지, 용도지역별로 허가 면적이 어떻게 분포하는지를 살피는 분석가·사업자·주민이 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치명(지번 등 주소 문자열)이나 용도지역 이름을 매핑하거나, 같은 기관(동대문구) 단위로 다른 자치구 개발행위허가 데이터와 나란히 놓고 비교하는 방식으로 이어 쓴다.
limits: 표준 지역코드·필지 고유번호 같은 조인 키가 없어 토지대장·공시지가 등과 바로 결합되지 않고, 위치명 문자열을 정제·매핑해야 한다. 범위는 동대문구 한 곳이며 좌표가 없는 비공간 데이터라 지도 분석에는 주소 지오코딩이 따로 필요하다. 명세상 연 단위로 생성되는 파일이다.
