summary_user: 토지대장·임야대장에 등록된 필지별 소재(법정동·지번), 지목, 면적, 소유구분, 축척 등 토지 기본 속성을 소유자 개인정보 없이 담은 건별 원천 데이터로, 범위는 전국이며 시도별 CSV 파일로 제공된다. 분석가나 사업자가 특정 법정동 안 필지들의 지목 구성과 면적 합계, 국공유지·사유지 비율을 따져볼 때 쓴다. 법정동코드(bjd_cd)가 조인 키라서 같은 코드를 쓰는 건축물대장·공시지가·토지이용계획 등 필지 단위 데이터와 법정동 기준으로 이어 쓰고, 고유번호(필지 식별번호)로 필지 단위 대조에도 쓴다.
limits: 포털 활용신청이나 API 인증키로 받는 데이터가 아니며, vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 CSV 파일을 직접 내려받아야 한다. 소유자 개인정보는 빠져 있어 소유자 신원 확인에는 쓰지 못한다.
