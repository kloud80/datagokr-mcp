summary_user: 경기도 시군별 하수처리장 단위로 하수슬러지의 연간 처리량을 집계한 데이터로, 집계년도·시군명·하수처리장명과 재활용·육상매립·소각·해양투기·연료화·기타처분·미처분(이월)량을 톤 단위로 담는다. 환경정책 분석가가 "우리 시군 하수처리장의 슬러지가 매립·소각에서 재활용·연료화로 얼마나 옮겨 갔는가" 같은 처리방식 변화 추이를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 하수처리장명을 이름·코드로 맞춰 하수처리장 원장이나 방류수 수질 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군의 하수처리장에서 발생하는 하수슬러지의 연간 처리 현황을 제공하며, 재활용량, 육상매립, 해양투기, 소각, 연료화, 미처분량(이월량), 기타처분 등 다양한 처리방식별 처리량 정보를 포함하고 있습니다. 주요 항목은 집계년도, 시군명 및 코드, 하수처리장명, 각 처분방식별 연간 처리량(톤 단위) 등으로 구성되어 있습니다. 본 데이터는 경기도청 상하수과에서 관리하며, 공공환경 데이터로서 하수슬러지의 발생량과 처리방식의 변화 추이를 파악하고 지역 간 환경정책 수립의 기초 자료로 활용될 수 있습니다. 데이터는 연간 단위로 갱신되며, XML 또는 JSON 포맷으로 제공되는 Open API 형태로 활용 가능합니다. 관련 URL을 통해 샘플 호출 테스트도 가능하며, 환경 관련 연구나 정책 분석, 폐기물 감축 및 처리 효율화 전략 수립에 유용한 자료입니다.
