summary_user: 서울 강동구 관내에 등록된 제조업 공장을 한 곳씩 담은 명부로, 회사명·대표자명·도로명 소재지·업종명·생산품·전화번호를 공장 단위로 기록한다(CSV 약 11KB). 지역 분석가나 사업자가 '강동구에서 특정 업종이나 생산품을 다루는 공장이 어디에 몇 곳 있는가'를 확인하거나 거래처 후보를 찾을 때 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 공장등록·기업 데이터와는 회사명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
