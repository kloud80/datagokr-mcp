summary_user: 전북개발공사가 시행하는 사업지구별로 용지보상 개요(사업명, 사업구분, 면적, 보상면적, 보상금액, 고시번호, 승인·인정·조사·보상 일자, 관련 법령)를 담는 API로, 건별 원천이라기보다 지구 단위 요약 정보다. 토지 소유자나 분석가가 '이 개발사업지구의 보상 면적과 보상금은 얼마이고 언제 보상이 이뤄졌나'를 확인하거나 지역개발·토지보상 정책 연구의 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명(name)·고시번호 같은 이름 매핑이나 같은 기관 데이터로만 연결한다.
limits: 표준 지역코드나 필지 고유번호 같은 공통 조인 키가 없어 지적·토지 데이터와 바로 결합하기 어렵다. 범위는 전국·필지 단위로 분류돼 있으나 내용은 전북개발공사 사업지구에 한정되며, 호출에는 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
