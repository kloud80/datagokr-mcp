description_portal: 전북개발공사의 사업구분별보상개요조회 서비스는 사업지구를 기준으로  용지보상 개요 정보를 조회할 수 있는 OPenAPI입니다.사업지구별 보상면적, 평가금액, 계약금액 등 사업지구별 분양 및 미분양 토지에 대한 필지정보를 제공하여 사업별 보상 현황을 파악할 수 있습니다.이를 통해 지자체와 공공기관은 보상 일정 관리, 사업 추진 단계 점검 등 행정 의사결정을 효율화할 수 있고 연구·민간 분야에서는지역개발 분석, 토지보상 정책 연구, 정보공개를 위한 기반 자료로 활용할 수 있습니다.
