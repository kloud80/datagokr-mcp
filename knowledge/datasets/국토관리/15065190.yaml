description_portal: 이 자료는 울산광역시의 도시 계획 중 공간 시설에 해당하는 광장 현황을 정리한 자료입니다. 광장은 대중교통, 보행 동선, 인근 주요 시설 및 토지이용현황 등을 고려하여 보행자에게 적절한 휴식공간을 제공하고 주변의 가로환경 및 건축계획 등과 연계하여 도시의 경관을 높일 수 있도록 결정하여야 하며, 교통광장(교차점광장, 역전광장, 주요시설광장), 일반광장(중심대광장, 근린광장), 경관광장, 지하광장, 건축물부설광장 등으로 분류됩니다.본 자료는 도시계획현황통계를 기초로 하는 자료로 세부적인 사항들을 포함하지 않으므로 참고 자료로 활용하시기 바랍니다.
