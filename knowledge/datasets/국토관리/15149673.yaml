description_portal: 이 데이터는 한국수력원자력㈜의 발전용댐 상하류 수질 자료입니다. 발전용댐의 상하류 수질 현황 데이터를 공개함으로써, 국민의 건강권 및 환경권을 보장하고 한국수력원자력의 신뢰성을 높이고자 해당 데이터를 개방합니다. 이 데이터는 화천, 춘천, 의암, 청평, 팔당, 칠보댐의 댐상류와 발전방류수의 수질 정보를 제공하며 전도도(μs / cm), 수소이온농도(pH), 탁도(NTU), 투명도(m), 수온(°C), 용존산소(mg/L) 정보를 포함하고 있습니다. 단, 의암댐은 댐상류 수질자료만 제공합니다. 데이터 형식은 CSV 파일 형식입니다. 이 공개데이터가 제공하는 수질분석 결과를 통해 지역 주민들의 불안감을 해소하고 댐 수질 환경의 이상징후를 포착하는 데 활용할 수 있습니다.
