summary_user: 서울 강남구에서 난 건축허가를 건별로 담은 원천 파일로, 건축구분(신축·증축·대수선·용도변경 등), 대지위치, 대지·건축·연면적, 건폐율·용적률, 층수·높이, 주용도·용도지역, 세대수·주차대수와 허가일·착공처리일·사용승인일을 함께 담는다. 강남구에서 어떤 용도의 신축·증축이 언제 허가되고 착공·사용승인까지 이어졌는지 보며 지역 개발 흐름을 가늠하려는 분석가나 사업자가 쓴다. 전역 조인 키(건물·필지 고유번호 등)가 없어 다른 데이터와는 대지위치 주소 문자열을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
