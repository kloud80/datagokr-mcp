summary_user: 부산광역시 동구의 착한가격업소를 업소 한 곳당 한 행으로 담은 파일(약 5KB CSV)로, 업소명·업소구분·지역·주소·대표전화와 대표 메뉴 두 가지 및 각 가격(원)을 담는다. 동구 주민이나 방문객이 '동구에서 저렴한 가격의 식당이나 미용실은 어디이고 대표 메뉴 가격은 얼마인가'를 확인할 때 쓰고, 분석가는 업종별 가격 수준을 비교하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소를 지오코딩하거나 업소명으로 맞춰 붙이고, 부산 다른 구의 착한가격업소 파일과는 같은 컬럼 구성으로 이어 쓴다.
description_portal: 착한가격업소 공공데이터는 지역 내 합리적 가격과 양질의 서비스를 제공하는 업소 정보를 한눈에 파악할 수 있도록 구성된 자료입니다. 이 데이터에는 업소를 식별할 수 있는 번호와 업소명, 업소구분은 물론, 지역과 상세 주소, 대표전화 등 기본적인 위치·연락 정보가 포함됩니다. 또한 이용자가 실제로 참고할 수 있도록 주요 메뉴 1·2와 각각의 가격 정보를 제공하며, 업소의 서비스 특징이나 운영 철학 등을 소개하는 설명 항목도 담고 있어 소비자 편의 향상과 지역 경제 활성화에 기여하는 정보를 제공합니다.
