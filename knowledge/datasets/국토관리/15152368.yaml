summary_user: 행정구역별로 단기 예측 기반 침수위험을 관심·주의·경계·심각 4단계로 나누는 기준값을 10분·30분·60분·180분 시간대별로 담은 고정 기준표 파일로, 포털에는 전체가 아닌 샘플 100건만 올라와 있다. 지자체 재난 담당자나 분석가가 "우리 구의 60분 예측 강우가 어느 수준이면 경계 단계인가"처럼 침수 예보 단계를 판정하거나 해석할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어(순서·코드명·코드값 등 코드표 형식), 같은 기관의 침수 예보 자료와 행정구역 이름이나 기관 코드를 맞춰 이어 쓴다.
description_portal: '기후에너지환경부 한강홍수통제소의 단기 예측 기반 침수위험을 평가하기 위해 각 행정구역별로 관심·주의·경계·심각 단계별(10분,30분,60분,180분)기준을 제공하는 서비스이다. 각 행정구역 의 강우와 수위 변화를 분석해 단계별 위험도를 명확히 구분하며, 침수 상황에 대한 예측과 대비를 체계적으로 관리한다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
