summary_user: 전국 읍면동 행정구역별로 AI 홍수예보시스템이 강우레이더 자료를 바탕으로 10분부터 6시간까지 초단기 침수위험을 예측한 알람 결과와 이력을 관심·주의·경계·심각 네 단계 위험 수준으로 담은 파일이며, 포털에는 샘플 100건만 올라와 있고 받은 파일의 컬럼은 순서·코드명·코드값·코드값 의미 같은 코드 정의 형태다. 지자체 재난 담당자나 분석가가 '집중호우 때 어느 읍면동이 1시간 안에 경계 이상 침수 위험에 들었는가'를 확인하거나 예측 단계별 알람 패턴을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 읍면동 이름을 행정구역 코드로 매핑해야 행정경계·강우·침수 피해 자료와 이어 쓸 수 있다.
limits: 포털 파일은 업로드 용량 제한으로 샘플 100건뿐이라 전국 전체 예측 결과와 이력이 필요하면 담당 기관에 따로 요청해야 한다. 명세상 주기는 연간·이벤트로 되어 있어 실시간 알람 피드로 쓸 수 없고, 다른 데이터와 붙이려면 이름 기반 매핑이 필요하다.
