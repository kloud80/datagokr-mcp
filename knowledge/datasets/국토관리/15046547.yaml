description_portal: '○ 통계개요* 통계명 : 용도지구* 통계종류 : 서울시 자치구별 용도지구 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「국토의 계획 및 이용에 관한 법률」및「서울시 도시계획조례」에 따른용도지구 면적* 작성목적 : 서울시 토지에 관한 정보와 연간 토지허가 및 거래 현황을 파악하여,공정한 부동산관련 정책수립과 연구ㆍ분석을 위한 기초자료로 활용하는것을 목적으로 함* 조사체계 : 자치구 → 시도 → 국토교통부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 용도지구별(경관, 미관, 고도, 보존지구 등) 면적 현황 등○ 용어설명* 용도지구 : 토지의 이용 및 건축물의 용도·건폐율·용적률·높이 등에 대한 용도지역의제한을 강화하거나 완화하여 적용함으로써 용도지역의 기능을 증진시키고 미관·경관·안전 등을 도모하기 위하여 도시·군관리계획으로 결정하는 지역을 말함1.경관지구: 경관을 보호·형성하기 위하여 필요한 지구2.미관지구: 미관을 유지하기 위하여 필요한 지구3.고도지구: 쾌적한 환경 조성 및 토지의 효율적 이용을 위하여 건축물 높이의최저한도 또는 최고한도를 규제할 필요가 있는 지구4.방화지구: 화재의 위험을 예방하기 위하여 필요한 지구5.방재지구: 풍수해, 산사태, 지반의 붕괴, 그 밖의 재해를 예방하기 위하여 필요한지구6.보존지구: 문화재, 중요 시설물 및 문화적·생태적으로 보존가치가 큰 지역의보호와 보존을 위하여 필요한 지구7.시설보호지구: 학교시설·공용시설·항만 또는 공항의 보호, 업무기능의 효율화,항공기의 안전운항 등을 위하여 필요한 지구8.취락지구: 녹지지역·관리지역·농림지역·자연환경보전지역·개발제한구역 또는도시자연공원구역의 취락을 정비하기 위한 지구9.개발진흥지구: 주거기능·상업기능·공업기능·유통물류기능·관광기능·휴양기능등을 집중적으로 개발·정비할 필요가 있는 지구10.특정용도제한지구: 주거기능 보호나 청소년 보호 등의 목적으로 청소년유해시설 등 특정시설의'
