summary_user: 서울시 지구단위계획 결정조서를 조서 단위로 담은 데이터로, 조서유형·대분류·지역명·위치명과 기정 면적, 면적 증감, 변경 후 면적, 결정고시 관리코드를 함께 제공한다. 도시계획 분석가나 부동산·개발 사업자가 특정 지역의 지구단위계획 구역이 결정 과정에서 면적이 얼마나 늘거나 줄었는지 확인할 때 쓴다. 전역 조인 키는 없으며, 프로젝트코드(PRJC_CD)·결정고시 관리코드처럼 같은 기관 데이터의 코드나 지역명·위치명 매칭으로만 다른 데이터와 잇는다.
description_portal: '도시계획을 수립하는 지역 가운데 일부지역의 토지이용을 보다 합리화하고 그 기능을 증진시키며 미관의 개선 및 양호한 환경을 확보하는 등, 당해 지역을 체계적·계획적으로 관리하기 위하여 수립하는 도시관리계획에 대한 세부적인 계획※ 본자료의 도시계획현황은 법적 효력을 갖고 있지 않습니다.- 제공정보 : 조서관리코드, 프로젝트코드, 지자체, 조서유형, 대분류, 지역명, 위치명, 면적기정, 면적증감코드, 면적변경, 면적변경후, 결정고시관리코드제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
