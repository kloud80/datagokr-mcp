description_portal: 본 데이터는 한국토지주택공사의 보상취득 건별로 총면적, 무상공급·무상취득·소규모·서민주택 면적 등을 기준으로 취득세와 농어촌특별세의 과세비율을 산정한 현황표입니다. 각 건은 감면율(소규모임대주택 감면율, 기본감면율)에 따라 실제 과세 비율이 달라지며, 확정일자와 확정여부(Y/N)가 명시돼 과세 결정의 시점을 파악할 수 있습니다. 특히 소규모·서민주택 면적이 큰 경우 감면율이 높아져 취득세 과세비율이 낮아지는 패턴을 확인할 수 있습니다. 이는 사업자가 소규모·서민주택을 건설하기 위한 토지 취득시 세율을 인하함으로써 해당 건설사업을 촉진하려는 데 그 과세정책의 목적이 있다고 생각해 볼 수 있습니다.
