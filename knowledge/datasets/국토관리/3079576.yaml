summary_user: 광양시 안의 담배소매업소를 한 곳당 한 행으로 담은 파일로, 업소명, 지번·도로명 주소, 지정일자, 영업구분, 데이터기준일이 들어 있다(csv 약 61.8KB). 동네별로 담배소매점이 몇 곳 있고 어디에 몰려 있는지, 어느 업소가 언제 지정되었는지를 확인하는 주민·창업 예정자·정책 담당자가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주소를 지오코딩하거나 업소명을 맞춰 보는 방식으로 연결하고, 다른 시군구 담배소매업 현황과는 같은 컬럼 구성을 기준으로 이어 붙인다.
description_portal: 이 데이터는 담배소매업 현황을 제공하는 자료로, 업소명, 업소 지번주소 및 도로명주소, 지정일자, 영업구분 등의 정보를 포함하고 있습니다. 이를 통해 국민은 지역 내 담배소매점 분포 현황을 확인할 수 있으며, 행정기관은 담배소매업 관리, 지정·폐업 현황 파악, 관련 정책 수립에 기초 자료로 활용할 수 있습니다. 또한 데이터 기준일이 명시되어 있어 최신성과 신뢰성을 확보하고, 공공데이터 개방을 통해 행정의 투명성을 높이는 데 기여합니다. 더불어 연구기관과 정책 부서는 본 데이터를 활용하여 담배 판매 업소의 밀집도 분석, 청소년 보호 정책, 금연 환경 조성 등 다양한 연구와 행정적 활용이 가능합니다.
