summary_user: 충청남도 금산군이 지정한 착한가격 모범업소를 업소 한 곳당 한 행으로 담은 소규모 CSV 파일(809바이트)이며, 업소명·행정구역·주소·업종구분과 데이터기준일자를 담는다. 금산군 주민이나 방문객이 '금산에서 저렴한 가격의 식당·카페가 어디에 있나'를 찾거나, 분석가가 군 단위 물가안정 정책 업소의 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 지역의 착한가격업소 목록과는 업소명·주소 문자열로 맞추고, 지도 데이터와는 주소를 좌표로 변환해 이어 쓴다.
