summary_user: 폐쇄되거나 말소된 건축물대장의 기본개요·표제부·층별개요·부속지번·전유공용면적·지역지구구역 등 속성을 대장 한 건(관리폐쇄말소대장PK) 단위로 담는 전국 범위의 필지·건물 원천 API입니다. 철거되거나 멸실된 건물이 언제 폐쇄·말소됐는지, 당시 어떤 용도지역에 있었는지 확인하려는 부동산 실무자나 건축 이력 분석가가 쓴다. 실측에서 전역 조인 키는 확인되지 않았으며, 시군구코드·법정동코드·번·지 같은 주소 코드를 매핑해 현행 건축물대장이나 지적 데이터와 맞춰 잇는 방식만 가능하다.
description_portal: 폐쇄말소대장에서 관리하는 기본개요, 총괄표제부, 표제부, 층별개요, 부속지번, 전유공용면적, 오수정화시설, 전유부, 주택가격, 지역지구구역 등의 속성 정보를 제공합니다.기존에는 ‘건축데이터 민간개방시스템’을 통해 유형별 건축 정보를 제공하였으나, 이제는 **건축서비스산업 정보체계(건축HUB)**에서 동일한 데이터가 제공됩니다. 이와 함께, 건축데이터의 **기본키(PK)**가 변경되었습니다.이에 따라, 변경된 데이터 구조에 맞춰 활용하실 수 있도록 기존 PK와 신규 PK 간의 전환 기준을 정리한 자료를 첨부하였습니다. 데이터 연계 및 활용 시 참고하시기 바랍니다.
