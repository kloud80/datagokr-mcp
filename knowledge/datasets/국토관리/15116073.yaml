summary_user: 대전광역시 서구 관내 행정동별로 추진 중이거나 완료된 도시재생뉴딜 사업을 사업 한 건당 한 행으로 정리한 소규모 파일(csv 약 5KB)로, 연도·행정동·사업명·사업내용·사업비(억원)·추진현황을 담는다. 주민이나 지역 분석가가 '우리 동네(서구 어느 행정동)에서 어떤 도시재생뉴딜 사업이 얼마의 예산으로 어디까지 진행됐나'를 확인하는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 행정동 이름을 행정구역 코드표에 맞춰 매핑해야 이어 쓸 수 있다.
description_portal: '본 자료는 대전광역시 서구에서 수행 중인 도시재생뉴딜 사업의 추진 현황에 대한 정보를 수록한 공공데이터입니다.해당 자료는 대전광역시 서구 관내의 각 행정동을 대상으로 현재 추진 중이거나 완료된 도시재생뉴딜 사업의 전반적인 개요와 진행 현황을 파악할 수 있도록 구성되어 있습니다.자료에 포함된 항목은 사업이 추진된 연도, 해당 사업이 실행된 행정동 명칭, 개별 사업의 고유한 사업명, 사업의 주요 내용을 요약한 사업내용, 사업 수행에 소요되는 총사업비, 그리고 사업의 진행 단계나 상태를 나타내는 추진현황(예: 계획, 착수, 진행 중, 완료 등) 등으로 구성되어 있으며, 도시재생 정책의 지역별 실현 현황을 종합적으로 이해할 수 있도록 정리되어 있습니다.본 데이터는 대전광역시 서구가 주관하거나 참여하는 도시재생뉴딜 사업 전반에 대한 기초 정보와 실행 현황을 공공적으로 제공하기 위한 것으로, 지역 환경의 개선, 주민 삶의 질 향상, 공동체 회복, 기반시설 정비 등 다양한 도시재생 목적 아래 수행되는 개별 사업들에 대한 행정적·재정적 정보를 포함하고 있습니다.이를 통해 대전광역시 서구 내 도시재생 전략의 실행 흐름과 공간별 추진 특성을 체계적으로 분석할 수 있으며, 향후 유사 사업 기획이나 정책 수립 시 기초자료로 활용될 수 있도록 구성된 공공데이터입니다.'
