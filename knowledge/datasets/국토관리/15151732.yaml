description_portal: 환경부 국립환경과학원에서 운영하고 있는 물환경정보시스템의 수질오염총량 관리제도 중 지류총량 유량 정보에 관한 데이터를 제공합니다.이 자료는 지류별로 측정된 수문항목의 유량을 체계적으로 관리하고 분석하기 위해 구축된 것으로, 총량관리제의 유역 단위 오염부하 산정 및 유량 기반의 수질평가에 활용됩니다.데이터에는 지류총량 코드와 항목별 유량 값이 포함되어 있으며, 수계별 지류 단위로 구성되어 있습니다.이를 통해 지류별 유량 변동특성을 분석할 수 있으며, 강우량과의 상관성을 고려한 부하량 산정, 목표수질 달성도 평가, 유량기반 부하량 분배 연구 등에도 활용됩니다.수집된 유량 자료는 지류총량 관련 데이터와 연계하여 제공되며, 단위는 초당세제곱미터(㎥/s)를 기준으로 합니다.
