summary_user: 광주 남구에 있는 제조업 공장을 업체 한 곳당 한 행으로 담은 명부로, 업체명·업종구분·도로명 소재지·전화·팩스 번호와 데이터 기준일자를 담는다. 남구 안에서 어떤 업종의 공장이 어디에 몰려 있는지 알고 싶은 지역 산업 분석가나, 거래처·납품처 공장의 연락처를 찾는 사업자가 쓴다. 사업자번호나 표준산업분류 코드 같은 공통 조인 키가 없어서, 다른 공장등록 데이터와는 업체명이나 도로명 주소를 맞춰서 잇는다.
description_portal: 광주광역시 남구에 위치한 제조업공장 현황 및 정보(업체명, 전화번호, 팩스번호, 사업소 주소 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 민생경제과(☎062-607-2721)에서 제공합니다. 전화번호, 팩스번호가 없거나 개인정보가 포함되어 있는 경우, 미기재하였으니 데이터 이용 시 참고하여 주시기 바라며, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 제조업공장은 원자재나 부품을 가공·조립하여 완제품을 생산하는 산업 시설로, 식품, 금속, 기계, 화학, 전자 등 다양한 업종이 포함됩니다. 해당 데이터를 통해 지역 산업 구조 분석, 입주 기업 지원 정책, 산업단지 개발 계획, 환경 영향 평가, 지역 고용 창출 방안 수립 등에 활용할 수 있을 것으로 보입니다.
