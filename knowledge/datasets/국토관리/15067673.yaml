summary_user: 1973년 10월부터 2004년 9월까지 촬영된 과거 위성영상의 씬별 성과 가운데 R·G·B·근적외(NIR) 등 밴드 파일 한 건마다 파장대역(최소·최대·설명), 영상 라인·픽셀 수와 간격, 브라우즈 영상명을 담은 밴드 단위 원천 목록이며, 전국을 대상으로 하는 비공간 표다. 원격탐사 분석가나 연구자가 "이 과거 위성영상 씬에 근적외 밴드가 있는지, 각 밴드의 파장 범위와 해상도는 얼마인지"를 확인해 지형·식생 분석에 쓸 영상을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 파일식별자를 기준으로 같은 기관의 구 위성영상 씬·파일 정보와 맞춰 쓰는 정도로만 연결한다.
description_portal: '과거 위성영상의 씬별 성과 중 밴드(R, G, B, NIR 등) 파일 정보를 포함합니다. 식별정보로는 파일식별자, 밴드번호, 밴드식별자가 있으며, 속성정보로는 최소·최대파장, 파장대역설명, 해상도(라인·픽셀), 간격 정보, 브라우즈 이미지명이 포함되어 밴드 특성을 정밀하게 파악▷ 식별정보 : 파일식별자, 밴드번호, 밴드식별자▷ 속성정보 : 최소파장대역, 최대파장대역, 파장대역설명, 밴드이미지라인, 밴드이미지픽셀, 밴드이미지라인간격, 밴드이미지픽셀간격, 밴드이미지브라우즈영상명* 위성영상 : 지구 궤도를 도는 인공위성이 지표면을 촬영한 이미지로 지도제작 및 지형분석 등에 활용됨. - 1973-10-08 ~ 2004-09-30 범위의 과거 위성영상 보유'
