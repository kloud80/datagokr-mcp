summary_user: 지적재조사 시스템의 토지소재지를 법정동코드와 토지소재지명 기준으로 정리한 건별 파일 데이터이며, 전국 20,560건을 담는다. 필지가 속한 법정동 소재지를 확인하거나 주소 체계를 맞추려는 분석가·개발자가 '이 법정동코드는 어느 소재지인가'를 따질 때 쓴다. 법정동코드(bjd_cd)와 토지소재지명(address)이 조인 키여서 같은 키를 가진 다른 주소·지적 데이터와 이어 쓰며, 필지 단위 데이터의 공간 기준(PNU 원장)을 보완하는 용도다.
description_portal: 지적재조사 시스템에서 관리되는 법정동·행정동 체계에 따라 필지의 소재지를 식별하고 지번·도로명주소 간 매핑과 중심점 좌표를 제공하는 데이터입니다. 시도–시군구–읍면동–리(선택) 계층과 표준코드, 지번(본번/부번), 도로명코드/주소를 함께 제공해 다양한 주소체계 간 호환성을 높이고 활용되고있습니다. 좌표는 국가표준 좌표계(EPSG:5186 등)에 맞춰 제공되어 공간 분석과 시각화에 즉시 활용 가능합니다. 도로명주소 개편이나 행정구역 조정 시 이력을 남겨 과거 자료와의 연계성을 유지합니다.
