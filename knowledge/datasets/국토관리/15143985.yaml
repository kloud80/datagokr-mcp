description_portal: 본 데이터는 한국산업기술시험원이 2024년 8월부터 9월까지 식물공장에서 수집한 전체 유효전력(Active Power) 데이터입니다. 유효전력은 전력계통에서 실제로 일을 수행하는 전력으로, 열, 빛, 기계적 에너지 등으로 변환되어 소비되는 전기를 의미하며, 한국전력공사(한전) 전기요금 산정 시 중요한 기준으로 사용됩니다. 본 데이터는 스마트팜 내 전력 사용 패턴 분석, 설비의 에너지 효율 평가, 대기전력 분석 및 절감 방안 마련, 전기요금 최적화 모델 개발 등 다양한 연구 및 실무적 목적으로 활용될 수 있습니다. 특히 에너지 절약형 농업 시스템 구현과 스마트 그리드 기반의 정밀한 전력 제어 기술 개발에도 기여할 수 있는 기반 자료로써 활용 가치가 높습니다. 공공기관, 연구기관, 에너지 관련 기업 등 다양한 분야에서 실질적이고 정량적인 분석 자료로 폭넓게 활용될 수 있습니다.
