summary_user: 한국산업기술시험원이 2024년 8월부터 9월까지 컨테이너형 식물공장 2개 동에서 측정한 유효전력을 측정일시별로 담은 실측 원천 데이터로, 동별 전체(메인)값과 에어컨·공조기·양액기·조명·LED 등 설비별 값을 열로 나눠 담는다(CSV 약 50MB). 스마트팜 연구자나 에너지 분석가가 식물공장에서 냉방과 LED 조명 중 어느 설비가 전력을 가장 많이 쓰는지, 대기전력과 전기요금 절감 여지가 얼마인지를 분석하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키(사업자번호·지역코드 등)가 없으므로 측정일 기준으로 기상·전력요금 자료와 시간축으로 맞춰 쓰는 정도로만 연계한다.
limits: 특정 식물공장 컨테이너 2개 동의 두 달치 측정값일 뿐이며, 공장등록 원부처럼 사업자·필지·업종 코드가 없어 공장등록·산업단지 데이터와 키로 연결할 수 없다. 범위가 '전국'으로 분류돼 있지만 위치 정보가 없는 비공간 자료다.
