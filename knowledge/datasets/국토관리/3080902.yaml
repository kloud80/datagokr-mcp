summary_user: 전북특별자치도에서 추진한 전원마을 조성사업을 지구별로 한 행씩 정리한 소규모 파일(csv 약 1.4KB)로, 지구명·위치·사업기간·계획세대와 입주·건축 중·미건축 세대 수, 입주율을 담는다. 귀농·귀촌을 고려하는 도시민이 "전북 어느 시군 전원마을에 아직 빈 필지(미건축 세대)가 남아 있나"를 확인하거나, 지자체가 지구별 입주 실적을 비교하는 데 쓴다. 표준 행정코드 같은 전역 조인 키가 없어 다른 데이터와는 위치·지구명 텍스트를 시군명으로 맞추는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 내에서 추진된 '전원마을 조성사업'의 지구별 현황을 정리한 데이터입니다. 이 자료는 각 사업 지구의 위치와 사업 기간, 계획된 총 세대수 정보를 제공하며, 현재 입주를 완료했거나 건축 중인 세대, 그리고 아직 건축되지 않은 세대의 수를 비교하여 실제 입주율까지 상세히 보여줍니다. 이 데이터는 귀농·귀촌을 희망하는 도시민들에게 지역별 전원마을의 조성 현황과 입주 가능성을 파악하는 데 유용한 정보를 제공합니다. 또한, 지방자치단체에서는 이를 통해 농촌 지역의 주거 환경 개선 및 인구 유입 정책의 성과를 평가하고 관리하는 데 활용할 수 있습니다.
