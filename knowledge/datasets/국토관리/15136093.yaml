summary_user: 전북특별자치도 연립·다세대 주택의 전월세 실거래를 계약 한 건당 한 행으로 담은 원천 파일(csv, 약 90KB)로, 시군구·번지·건물명·전용면적·층·건축년도와 함께 전세/월세 구분, 보증금·월세, 계약기간, 신규/갱신 구분, 갱신요구권 사용 여부, 종전 계약 보증금·월세를 담는다. 세입자나 임대인이 전주시 특정 동의 다세대 전세 보증금이 면적·건축년도 대비 어느 수준인지, 갱신 계약에서 보증금이 얼마나 올랐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 실거래·공시가격 데이터와는 시군구·번지(본번·부번)·도로명 같은 주소 문자열을 맞춰 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 내 연립·다세대 주택의 전월세 실거래가 정보를 상세히 담고 있는 부동산 자료입니다. 각 거래별로 건물의 소재지, 전용 면적, 건축 연도 등 기본적인 정보와 함께, 전세인지 월세인지의 계약 유형, 보증금과 월세 금액, 계약 기간, 그리고 갱신 계약 여부까지 구체적으로 명시하고 있습니다. 이 자료는 아파트 외 주택 유형의 임대차 시장 동향을 파악하고, 특정 지역의 시세를 확인하는 데 매우 유용합니다. 서민 주거 안정과 밀접한 관련이 있는 시장을 분석하고 관련 정책을 수립하는 데 핵심적인 기초 데이터로 활용됩니다.
