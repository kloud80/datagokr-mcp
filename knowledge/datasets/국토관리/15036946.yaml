summary_user: 경상남도 김해시의 개발행위허가를 건별로 주소, 허가목적, 용도지역 항목으로 담은 시군구 범위의 파일 데이터입니다. 분석가나 사업자가 김해시에서 어느 용도지역에 어떤 목적의 개발행위허가가 많이 나는지 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 용도지역 이름을 맞춰 연결하거나 같은 기관(김해시) 데이터끼리만 이어 쓴다.
description_portal: '경상남도 김해시 개발행위허가 정보에 대한 데이터로 주소, 허가목적, 용도지역의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 11월 28일로, 연간 주기로 관리하고 있습니다.* 해당 데이터 내 주소에 대한 위, 경도 좌표의 경우 추후 추가할 예정입니다.* 해당 데이터는 분석·연계하여 정책 수립 및 지역 사회 문제 해결 등 다양한 분야에 활용하실 수 있습니다.데이터 담당부서 : 김해시 허가민원과(055-330-4776)[데이터 변동 안내]1. 데이터 업데이트2. 데이터 설명 수정3. 데이터 키워드 추가4. 데이터 기준일 변경'
