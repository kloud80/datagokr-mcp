summary_user: 청약홈의 청약 신청자·당첨자 수를 지역별·연령대별(30대~60대 이상)로 집계하고, 지역별 일반·특별공급 공급세대수·신청건수·경쟁률과 가점제 당첨자의 최고·최저·평균·중위 가점을 통계일자(STAT_DE) 단위로 담은 전국 범위 집계 API입니다(오퍼레이션 6개). 청약을 준비하는 국민이나 주택시장 분석가가 '우리 지역 청약 경쟁률과 당첨 가점 수준은 어느 정도이고, 어느 연령대가 많이 신청·당첨되는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 청약지역 코드·명칭(SUBSCRPT_AREA_CODE_NM)과 통계일자를 기준으로 같은 기관의 청약·분양 공고나 미분양·가격 동향 데이터와 이름 매핑으로 잇는다.
description_portal: 한국부동산원 '청약홈'에서 제공하는 청약 신청·당첨자 정보 조회 서비스로 지역별/연령별 청약 신청·당첨자 정보 및 지역별 경쟁률, 지역별 가점제 당첨자 데이터를 제공합니다.※ 관련 기술문서는 아래 URL을 통해 확인하시기 바랍니다.https://www.reb.or.kr/reb/na/ntt/selectNttInfo.do?mi=10251&bbsId=1268&nttSn=83317
