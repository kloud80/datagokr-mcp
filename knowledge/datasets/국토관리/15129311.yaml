summary_user: 경기도 데이터분석시스템이 시군구와 기준연월별로 업체 상태 건수를 집계한 자료로, 정상·등록말소·영업정지·자진반납·폐업 건수와 전환·합병에 따른 등록말소 건수를 담는다. 지역경제 분석가나 시군 담당자가 '어느 시군에서 폐업·영업정지 비율이 늘었나'를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군구 코드·명(signgu_cd)과 기준연월을 다른 시군구 통계의 이름·코드에 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 데이터분석시스템에서 제공하는 지역별 업체상태 집계 정보로, 시군구 단위의 업체 영업 현황을 통계적으로 정리한 자료입니다. 주요 항목에는 시군구명, 기준연월, 정상건수, 등록말소건수, 영업정지건수, 자진반납건수, 폐업건수 등이 포함되어 있으며, 지역별로 업체 활동의 변동과 운영 상태를 종합적으로 파악할 수 있습니다. 이를 활용하면 특정 시군의 산업 활력과 경기 동향을 분석하거나, 폐업 및 영업정지 비율을 비교하여 지역경제 안정성을 진단할 수 있습니다. 또한 정책 수립, 지역산업 지원, 기업환경 연구 등 다양한 행정 및 학술적으로 활용할 수 있습니다.
