description_portal: '○ 통계개요* 통계명 : 민간아파트 분양가격* 통계종류 : 수도권 민간아파트 분양가격 현황을 제공하는 일반ㆍ가공통계* 작성목적 : 전국 민간분양아파트의 지역별 분양가격 및 분양세대수 동향 제공을통해 국민의 주택구매의사결정을 지원하고 부동산 경기 예측 및아파트 공급정책 수립을 위한 정보 제공* 조사체계 : 주택사업자→주택도시보증공사 지사→주택도시보증공사 조사연구처* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울, 인천, 경기 및 수도권내용 - 서울시 및 수도권 민간아파트 평균분양가격○ 용어설명* 분양가격 : 신규아파트를 소비자에게 분양할 때의 분양가격으로, 주택공급에 관한규칙 제7조에 의하여 승인받은 입주자모집공고상의 가격을 기준으로 함○ 기 타* 2013년 9월부터 작성* 월별 평균 분양가격은 공표직전 12개월 간(작성기준월 포함)의 자료를 평균하여 작성* 본 자료는 대한주택보증의 분양보증서 발급일을 기준으로 작성되었으며,실제 입주자모집공고일과 분양보증서 발급일 간에는 약간의 시차가 존재할 수 있음* 규모별 ㎡당 분양가격은 지역별 ㎡당 분양가격을 전용면적 기준 규모별로 데이터를구분하여 산출하였으나 평균 분양가격의 산정방식은 동일함* 2015년 10월부터 규모별 ㎡당 분양가격으로 항목 변경(2015년 9월이전 3.3㎡당 평균분양가격)'
