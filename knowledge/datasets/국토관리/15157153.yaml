description_portal: 해당 데이터는 경상북도 영천시의 지적공부 등록현황을 종합적으로 제공한다. 주요 항목은 토지소재지, 전, 답, 과수원, 목장용지 등 각 지목별 면적으로 구성되어 있습니다. 이를 통해 영천시 내 토지의 용도별 분포, 지목별 총 면적을 체계적으로 파악할 수 있습니다. 자료는 토지이용 계획 수립, 도시 개발, 농업정책, 지적 재조사, 부동산 분석, 공시지가 산정 등 다양한 행정 및 정책 목적에 활용될 수 있습니다. 또한, 각 지목별 토지 현황을 지역별로 비교하거나 용도지역별 변화를 분석하는 데에도 유용합니다 시민, 정책 담당자, 연구자 등 다양한 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 지적공부 현황을 반영하여 정기적으로 갱신됩니다. 면적의 단위는 ㎡ 입니다. 궁금하신 사항은 영천시 지적정보과로 연락주시기 바랍니다.
