summary_user: 서울특별시 광진구 관내에서 이루어진 개발행위허가를 건별로 담은 파일로, 허가마다 위치·지목·허가면적·용도지역·허가구분·공작물 종류·허가일을 기록한다. 광진구에서 토지를 개발하거나 공작물을 설치하려는 사업자·주민이 특정 지역에서 어떤 용도지역에 어떤 개발행위가 언제 허가됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치(주소)나 용도지역 이름을 맞추거나 같은 기관 코드로만 연결한다.
limits: 파일 크기가 약 4KB로 작아 수록 건수가 적고, 광진구 한 곳만 다루므로 서울 전체나 다른 구와 비교하려면 별도 데이터를 모아야 한다. 연 단위로 갱신되는 파일이라 최근 허가가 바로 반영되지 않을 수 있다.
