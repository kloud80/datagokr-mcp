summary_user: 서울의 특정 시점에 특정 지역에 머무는 내국인 생활인구를 기준일·시간대·행정동·집계구 단위로 담은 집계 데이터로, 총생활인구수와 남녀 연령대별(0~9세부터 70~74세까지 5세 구간 위주) 생활인구수가 들어 있다. 상권 분석가나 자치구 담당자가 '특정 행정동에 평일 저녁 시간대에 20~30대 여성이 얼마나 머무는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드(ADSTRD_CODE_SE)나 집계구코드를 서울시 다른 데이터의 같은 코드와 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: "서울시가 보유한 공공데이터와 통신데이터로 측정한 특정시점에 서울의 특정 지역에 존재하는 인구 중 내국인 데이터입니다.※ 개인정보 비 식별화를 위하여 ‘3명’ 이하인 경우 “ * ” 처리※ Sheet와 OpenAPI는 5일전 당일자료만 제공합니다.제공정보 : 기준일ID, 시간대구분, 행정동코드, 집계구코드, 총생활인구수, 남자/여자 연령대 생활인구수\"해당 데이터의 원본시스템은 '빅데이터 분석 활용시스템 입니다.\"제공부서는 서울특별시 디지털도시국 데이터전략과(02-2133-4273)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다."
