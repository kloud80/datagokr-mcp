summary_user: 광주광역시 동구에 설치된 가로등을 한 개씩 관리번호, 도로명·지번 주소, 위도·경도로 담은 시설 단위 원천 목록이다(CSV 약 245KB). 주민이나 분석가가 "우리 동네 골목길에 가로등이 어디에 얼마나 설치돼 있나"를 확인하거나 야간 조도가 부족한 구간을 찾는 데 쓴다. 전역 조인 키는 없으므로 주소나 위도·경도로 다른 시설·보행 안전 데이터와 지도 위에서 공간적으로 이어 쓴다.
description_portal: 광주광역시 동구의 가로등 설치현황 데이터는 지역 내 도로와 생활권에 설치된 가로등의 위치와 관리 정보를 파악하기 위해 정리된 자료로, 야간 보행 안전 확보와 도시미관 관리에 중요한 역할을 합니다. 이 데이터는 가로등의 정확한 위치와 관리 상태를 체계적으로 관리해, 유지보수 계획 수립이나 고장 신고 처리, 조도 개선 사업 등에 활용될 수 있도록 구성되어 있습니다.데이터에는 먼저 각 가로등을 식별하기 위한 관리번호가 포함되어 있으며, 이를 통해 개별 시설의 이력 관리가 가능합니다. 소재지 도로명주소는 가로등이 설치된 도로 기반 위치를 나타내며, 주변 보행환경과 연계한 관리에 유용합니다.또한 소재지 지번주소가 함께 제공되어, 도로명주소와 병행해 보다 정확한 위치 확인이 가능합니다. 위도와 경도 정보는 지도 기반 관리나 GIS 시스템과의 연계를 가능하게 하여, 가로등 배치 현황 분석이나 설치 지역의 공간적 특성 파악에 중요한 역할을 합니다.이와 같은 가로등 설치현황 데이터는 동구 전역의 야간 안전 환경을 강화하고, 시설 유지관리의 효율성을 높이며, 주민 생활의 편의와 안전을 보장하는 데 중요한 기초 자료로 활용됩니다.
