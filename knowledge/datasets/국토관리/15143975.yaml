summary_user: 한국산업기술시험원이 2024년 9월 23일부터 30일까지 식물공장 컨테이너 2개 동에서 측정한 3상 인입 전압 중 T상과 R상 사이의 선간전압을 측정 시각(측정일)별로 담은 건별 계측 CSV 파일(약 45MB)이다. 컨테이너별 메인 전원과 에어컨·공조기·양액기·조명·LED 같은 설비별 전압 값이 들어 있어, 스마트팜 연구자나 설비 운영자가 설비별 전압 변동과 이상 징후를 살피거나 대기전력 제어 알고리즘을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 측정 시각을 기준으로 같은 기관의 다른 상(相) 전압 데이터와 맞춰 보는 정도로만 이어 쓴다.
description_portal: 한국산업기술시험원이 2024년 9월 23일부터 9월 30일까지 식물공장에서 수집한 전체 인입 3상 전압 데이터 중 TR 선간전압에 대한 정보입니다. TR 선간전압은 3상 전력 시스템에서 T상과 R상 사이의 전압 차이를 의미하며, 이는 전기설비의 부하 균형, 전력 품질 유지, 전기적 이상 탐지 등에 중요한 지표로 활용됩니다. 본 데이터는 식물공장 내 온실 설비의 전력 소비량을 정밀하게 산정하고, 대기전력 최소화를 위한 제어 알고리즘 개발, 전력 설비 이상 여부 판단, 에너지 효율 향상을 위한 스마트 제어 기술 개발 등의 목적으로 사용될 수 있습니다. 특히, 실시간 전압 모니터링 시스템 구축, 예지보전 기반 유지관리 전략 수립, 에너지 절감형 설비 운영모델 개발 등 스마트팜 운영의 고도화와 지속 가능성 확보에 기여할 수 있는 고품질 공공데이터입니다.
