description_portal: 서울특별시 용산구_사용승인신고현황 데이터는 용산구 내에서 최근 사용승인 신고가 이루어진 건축물에 대한 상세 정보를 제공합니다. 주요 항목으로는 대지위치, 지목, 대지면적, 연면적, 증축연면적, 건폐율, 용적률, 구조 등이 포함되어 있습니다. ‘대지위치’는 건축물이 위치한 토지의 구체적인 주소 및 지번 정보를 나타내며, ‘지목’은 해당 토지의 법적 용도 분류로서 건축 가능 여부와 밀접한 관련이 있습니다. ‘대지면적’은 건축물이 자리한 토지의 전체 면적을 의미하며, ‘연면적’은 건물 각 층의 바닥면적을 모두 합산한 총 건축 면적입니다. ‘증축연면적’은 기존 건물에 추가 증축된 부분의 면적으로, 증축 규모를 파악하는 데 활용됩니다. ‘건폐율’과 ‘용적률’은 각각 대지 대비 건물 바닥면적과 연면적의 비율을 나타내며, 지역별 건축 규제 준수 여부를 판단하는 중요한 지표입니다. 마지막으로 ‘구조’ 항목은 건축물의 골조 재료 및 형태를 나타내어 내구성과 안전성 평가에 참고됩니다. 본 데이터는 용산구 내 건축 현황을 체계적으로 파악하고, 도시 계획 및 건축 행정에 유용하게 활용될 수 있습니다.
