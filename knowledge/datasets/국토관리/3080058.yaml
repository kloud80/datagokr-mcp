description_portal: 수도법 제33조(위생상의 조치)에 따라 건축물의 소유자 또는 관리자(공동주택에 대해서는 공동주택관리법 제64조에 따른 관리사무소장을 건축물이나 시설의 관리자로 본다.)가 1년에 반기별로 1회 실시하는 저수조 청소에 대한 데이터로 건물명, 주용도, 청소일, 청소업체 등의 항목을 제공합니다. 저수조 청소 대상 건축물은 수도법 시행령 제51조(급수관의 세척 등 조치를 하여야 하는 건축물 또는 시설)에 따라 건축연면적 5천제곱미터 이상의 건축물, 2천제곱미터 이상인 둘 이상의 용도에 사용되는 건축물, 3천 제곱미터 이상의 업무시설 및 대규모 점포, 1천석 이상의 공연장 및 실내체육시설, 아파트 및 복리시설 등입니다.
