summary_user: 공간정보공동활용시스템(NGTC)에서 제공하는 서비스 데이터 한 건마다 명칭, 주제, 버전, 제공기관, 등록·갱신일자, 2D/3D 구분, 도형 형식(폴리곤·라인 등)을 담은 메타데이터 목록이며, 약 3KB 크기의 CSV 한 개로 된 비공간 관리용 자료다. 공간정보 담당자나 분석가가 'NGTC에 어떤 기관이 어떤 형식의 공간데이터를 올렸고 언제 마지막으로 갱신됐나'를 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 서비스 데이터 명칭(svc_data_nm)이나 제공기관 이름을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '국토교통부 국토지리정보원에서 제공하는 ‘서비스데이터정보(ngtn_svc_data_info)’ 데이터로, 공간정보공동활용시스템(NGTC)에서 제공되는 서비스 데이터의 명칭, 버전, 제공기관, 데이터유형 등 메타데이터를 포함한 관리용 정보입니다. 각 공간데이터의 출처 및 특성을 파악하고, 데이터 품질관리 및 서비스 현황을 점검하기 위한 기준자료로 활용됩니다.1. 형식: CSV (엑셀 호환)2. 내용 요약   ■ svc_data_sn: 서비스 데이터의 고유 일련번호 (예: 36, 13 등)   ■ data_contents: 데이터의 주요 내용 또는 주제명 (예: 재난지역, 기본도 등)   ■ data_ver: 데이터 버전 정보 (예: 1)   ■ register_nm: 등록자 명칭 (예: 관리자)   ■ regist_date: 최초 등록일자 (예: 2016-12-30)   ■ cl_cd: 데이터 분류코드 (예: cadmap)   ■ svc_data_nm: 서비스 데이터의 공식 명칭 (예: 자연재해위험지구(해일위험지구), 수치표고 5m 등)   ■ updt_date: 데이터 최신 갱신일자 (예: 2016-12-30)   ■ provd_instt: 데이터 제공기관 (예: 국토지리정보원, 국민안전처 등)   ■ data_se_nm: 데이터의 표현 차원(2D 또는 3D)   ■ data_stle_nm: 데이터 형식 구분(예: polygon, line 등)3. 활용 예제   ■ 공간정보공동활용시스템(NGTC) 내 제공 데이터의 현황·버전·형식 정보를 조회하여 데이터 관리 효율화   ■ 기관별 제공 데이터 분류 및 주제별 메타데이터 분석을 통한 데이터 품질관리 및 갱신주기 관리   ■ 공간데이터 통합 서비스 구축 시, 표준화된 데이터 속성과 형식을 참고하여 상호연계성 확보   ■ 국가공간정보체계 구축·운영을 위한 데이터 제공기관 간 협업 체계 정립 및 서비스 개선 참고자료로 활용'
