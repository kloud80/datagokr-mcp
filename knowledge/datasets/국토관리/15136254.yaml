summary_user: 경상남도 행정동코드별 미분양주택 수를 담은 1회성 집계 파일로, 포털 설명상 데이터 기준일은 2024년 1월이며 미집계 값은 공란으로 둔다. 분석가나 주택사업자가 '경남에서 어느 읍면동에 미분양 주택이 많이 몰려 있었나'를 확인할 때 쓴다. 함께 받은 파일에는 행정동코드와 시도·시군구·읍면동명, 생성·말소일자로 된 코드북이 있어 동 이름으로 바꿀 수 있지만, 실측상 전역 조인 키는 없어 다른 데이터와는 지역명·코드 매핑으로만 잇는다.
description_portal: (데이터 수집목적 및 과정) 경상남도 경남빅데이터허브플랫폼 미분양 주택 건수 데이터는 통계청에서 수집하여 경남빅데이터허브플랫폼 DB에 정제하여 저장하고 관리하는 정보입니다. 행정동코드별 미분양주택건수를 제공하며 데이터 기준일은 2024년 1월입니다.(데이터 구성 및 세부항목) 데이터는 행정동코드, 미분양주택수, 데이터기준일로 구성합니다. 미집계 데이터는 공란처리합니다. 행정동코드는 코드북을 참고하여 주시기 바랍니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터며 현행화 하지 않습니다.
