description_portal: 대구광역시 상수도사업본부에서 2023년 7월 시행중인 일반건물 및 공동주택의 급수공사 정액 급수공사비 내역을 제공하며 해당 공사비는 대구광역시 수도급수조례에 의거합니다. 참고로 대구광역시의 상수도 제수입금은 상수도 요금 이외에 발생하는 부가적인 수입을 말합니다. 대표적인 제수입 항목은 급수공사비이며 이는 신규 급수설비 설치나 기존 설비의 변경 등 공사를 시행할 때 사용자에게 부과되는 비용입니다. 제수입금은 대구시 상수도사업본부의 수입원 중 하나로 활용되며, 수돗물 생산 및 공급에 필요한 시설 유지·보수, 노후관 교체, 수질 개선 등 공공 서비스 향상을 위한 재정적 기반을 마련하는 데 중요한 역할을 합니다.대구시는 제수입금 관련 자료를 공공데이터포털 등을 통해 투명하게 공개하고 있으며, 이를 통해 시민들이 상수도 재정의 운영 현황을 쉽게 확인하고, 상수도 서비스에 대한 신뢰를 높일 수 있도록 노력하고 있습니다.
