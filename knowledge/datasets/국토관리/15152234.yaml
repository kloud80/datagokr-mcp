summary_user: 공무원연금공단이 전국에 보유·관리하는 공무원임대주택을 단지 한 곳당 한 행으로 담은 파일로, 관할 지부·시도·단지명(내부·외부)·단지유형·세대수·관리사무소 전화·상세 주소가 들어 있다(약 6KB 규모의 CSV). 공무원 본인이 근무지 인근에 공무원임대주택 단지가 어디에 있고 세대수가 얼마인지 확인하거나, 분석가가 지역별 공공임대주택 분포를 살필 때 쓴다. 공통 조인 키나 코드표는 없어서 다른 데이터와 붙이려면 주소를 지오코딩하거나 단지명·시도 이름으로 맞춰 연결해야 한다.
description_portal: 공무원연금공단이 공무원의 생활 안정과 주거 복지 향상을 위해  전국에 보유 및 관리하고 있는 공무원임대주택 단지별 기본 정보와 주소 내역을 제공합니다.본 데이터는 공단 관할 지부, 주택 소재지(시, 도), 단지명(내부 관리용 및 외부 명칭), 단지 유형, 총 세대수, 관리사무소 전화번호, 그리고 상세 주소 항목으로 구성되어 있습니다. 이 데이터를 통해 전국에 분포한 공무원임대주택의 위치를 파악할 수 있으며, 공무원 주거복지 시설 현황을 분석하거나, 지역별 공공임대주택의 분포 현황을 연구하는 기초 자료로 활용할 수 있습니다.
