summary_user: 대전광역시 서구의 용도지역 면적을 행정구역(법정동)별로 주거·상업·공업·녹지지역, 개발제한구역, 용도미지정으로 나눠 담은 집계 표이며, 981바이트 규모의 작은 CSV 파일이다. 도시계획 담당자나 연구자가 '서구의 어느 동에 주거지역이나 개발제한구역 면적이 많은가'처럼 동별 토지이용 구성을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키나 법정동 코드가 없어, 다른 데이터와는 행정구역 이름을 매핑해서만 이어 쓴다.
description_portal: 대전광역시 서구 내 용도지역(주거지역, 상업지역, 공업지역, 녹지지역, 개발제한구역 등)별 면적정보(법정동 구분) 제공 데이터 입니다.용도지역 공공데이터는 토지의 활용 목적에 따라 구분된 주거지역, 상업지역, 공업지역, 녹지지역, 개발제한구역 등의 면적 현황을 제공합니다.이 데이터는 대전 서구 토지정보과에서 도시계획과로 변경 관리되고 있습니다.갱신주기는 매년 업데이트되며, 도시계획·연구·개발 사업 등에 활용할 수 있는 기반 자료입니다.특히 서구 내 용도지역별 면적 분포를 한눈에 파악할 수 있어 공간 분석과 지역 발전 전략 수립 활용이 가능합니다.
