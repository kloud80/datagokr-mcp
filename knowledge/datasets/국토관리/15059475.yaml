summary_user: 한국토지주택공사가 관리하는 전국 공공임대주택단지 정보를 조회하는 API로, 단지 단위로 단지명·주소·공급 유형·세대수·임대 조건 등을 담는다. 검증 호출에서는 전국 범위의 2행이 수신되었다. 공공임대 입주를 알아보는 사람이나 지역별 공급 현황을 보는 분석가가 쓰며, 전월세 실거래 데이터와 병합해 보는 관계이지만 실측 컬럼에서 전역 조인 키는 찾지 못해 이름·코드 매핑이나 같은 기관 코드로 연결해야 한다.
description_portal: '한국토지주택공사(LH)가 관리하는 전국 공공임대주택단지의 정보를 제공하는 서비스입니다. 서민 주거 안정과 주거 선택권 확대를 위해 전국 임대주택 현황 데이터를 개방하고 있습니다.해당 서비스를 이용하여 지역별 공급 현황과 임대 조건을 한눈에 파악할 수 있어, 공공 주거 정책 수립을 위한 기초 분석 자료나 서민 주거 복지 향상을 위한 정보 인프라로 가치 높게 활용할 수 있습니다.주요 제공 항목: 단지명, 주소, 최초 입주일, 공급 유형(영구·국민임대, 행복주택 등), 총세대수, 전용면적, 임대보증금 및 월임대료 정보 등'
