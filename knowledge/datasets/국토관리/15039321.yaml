summary_user: 경기도 양주시에서 도시계획 심의에 오른 개발행위 대상지를 건별로 주소와 함께 담고, 각 건의 심의결과(조건부 승인·유보 등)와 관리기관명을 기록한 파일 데이터다. 양주시 땅을 사거나 개발하려는 사업자·주민이 특정 지번 주변에서 개발행위 심의가 있었는지, 조건부 승인됐는지 유보됐는지를 확인하는 데 쓴다. 전역 조인 키는 없어서 대상지 주소를 기준으로 지번·좌표 변환을 거쳐 토지이용계획·용도지역 자료나 같은 기관의 개발행위허가 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 양주시 내 개발행위 심의 대상지와 그 결과를 기록한 자료로, 도시계획 관련 심의 현황을 종합적으로 제공한다. 주요 항목으로는 개발행위 대상지의 위치(주소), 심의결과(조건부 승인, 유보 등), 관리기관명(양주시 허가과 등)이 포함되어 있다. 이를 통해 각 개발행위 건이 어떠한 조건으로 승인되었는지, 혹은 보류되었는지를 파악할 수 있으며, 행정기관의 심의 절차와 결과를 투명하게 공개하는 역할을 한다. 특히 조건부 승인 건의 경우는 일정한 기준 충족을 요구하거나 보완 사항을 반영해야 하는데, 이는 도시계획의 질적 향상과 난개발 방지를 위한 제도적 장치라 할 수 있다. 또한 유보 판정은 환경적, 사회적 요인이나 법적 기준 미달로 인해 추가 검토가 필요한 경우에 내려지며, 해당 데이터는 향후 정책 수립 및 행정 의사결정 과정에서 중요한 참고자료로 활용될 수 있다. 따라서 본 데이터는 도시 관리와 계획의 투명성을 제고하고, 주민과 이해관계자들에게 행정 신뢰도를 높이는 데 기여하는 자료라 할 수 있다.
