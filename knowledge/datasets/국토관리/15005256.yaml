summary_user: 정읍시에 등록된 공장을 업체 한 곳당 한 행으로 담은 파일(CSV, 약 73KB)로, 농공단지명·업체명·도로명·지번 주소·생산품·전화번호를 담는다. 투자 입지를 검토하는 기업이나 협력업체를 찾는 사업자가 '정읍시 어느 농공단지에 어떤 품목을 만드는 공장이 있는가'를 확인하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 실측 컬럼에 없어서, 다른 공장등록·기업 데이터와는 업체명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 사업자번호·업종분류코드·필지번호가 없어 기업정보나 토지 데이터와 키로 바로 조인할 수 없고, 이름·주소 매칭에 의존해야 한다. 범위는 정읍시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
