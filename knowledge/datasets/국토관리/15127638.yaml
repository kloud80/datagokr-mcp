summary_user: '서울특별시 강동구 관내 건축허가 건별로 건축구분(신축·증축 등), 대지위치, 착공예정일, 사용승인일을 담은 CSV 파일(약 128KB)이며, 범위는 강동구 한 시군구, 단위는 필지·건물입니다. 주민·부동산·건설업 종사자가 "우리 동네 어느 지번에 어떤 건축이 허가됐고 언제 착공·준공되나"를 확인하거나, 지역 개발 흐름의 선행 지표로 건축 유형별·지역별 추세를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 주소를 이름·코드로 맞추는 방식으로만 잇는다(예: 건축물대장, 다른 구의 건축허가현황).'
description_portal: 서울특별시 강동구 관내에서 이루어지는 건축 허가 현황 정보를 제공하는 공공데이터입니다. 본 데이터는 건축구분, 대지위치, 착공예정일, 사용승인일 등의 정보를 포함하고 있어 강동구 내 건축사업의 유형과 공간적 분포, 사업 추진 일정 현황을 파악할 수 있도록 구성되어 있습니다.건축허가는 건축물의 신축·증축·개축·재축·이전 또는 용도변경 등 건축행위가 관계 법령과 기준에 적합한지를 검토하는 행정 절차입니다.주민과 지역 사업자는 생활권 주변의 건축허가 현황 및 예정 사업 정보를 확인하여 지역 개발 동향을 파악하고, 주거·상업환경 변화에 대한 정보를 얻는 데 활용할 수 있습니다. 건축 관련 업계 종사자는 건축구분, 대지위치 및 일정 정보를 바탕으로 지역 내 건설·설계·감리·자재·부동산 관련 사업 수요를 분석하는 기초자료로 활용할 수 있습니다.행정기관은 건축구분별·지역별 건축허가 현황을 분석하여 건축행정 업무를 지원하고, 도시관리 및 기반시설 수요 검토, 지역 개발 추세 분석 등을 위한 기초 통계자료로 활용할 수 있습니다. 또한 착공예정일과 사용승인일 정보를 연계하여 사업 추진 시기와 건축물 공급 시점에 따른 행정·생활 인프라 수요를 검토하는 데 참고할 수 있습니다.
