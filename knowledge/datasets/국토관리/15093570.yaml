summary_user: 경상남도 하천관리시스템의 하천구역결정조서를 제방 구간 단위로 담은 파일로, 관리기관명·제방명칭과 구간의 시작·종료 지점 주소·지번·측점번호, 초목 생장·토질·토지이용·토지변동 상태와 결정 결과를 기록한다(약 2.7MB CSV, 시도 범위·주소 단위). 하천구역 안팎은 건축 규제가 달라지므로, 토지 소유자나 개발 사업자가 경남의 특정 지번이 어느 제방의 하천구역 결정 구간에 걸리는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 하천코드로 바로 붙지 않고, 시작·종료 지점 주소·지번이나 제방·관리기관 이름을 매칭해 하천 목록·제방 데이터나 국가공간정보포털의 하천구역 공간자료와 이어 쓴다.
limits: 하천코드 같은 공통 키가 없어 다른 하천·제방 데이터와는 이름·주소 매칭으로만 연결되며, 매칭 오류에 주의해야 한다. 좌표가 아닌 주소·지번으로 구간을 적으므로 하천구역 경계를 지도에 정확히 그리려면 국가공간정보포털의 공간자료가 따로 필요하다.
