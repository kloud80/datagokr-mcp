summary_user: 서울특별시 도시계획으로 지정된 고도지구(건축물 높이를 제한하는 용도지구)의 구역 경계를 도형 단위로 담은 공간정보 파일로, 도형마다 결정고시 관리코드·라벨명·시군구 코드·면적·길이 같은 속성이 붙어 있다. 건축주나 부동산 분석가가 특정 필지·지역이 고도지구에 걸려 높이 제한을 받는지 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으므로, 시군구 코드(SGG_CD)나 결정고시 관리코드를 이름·코드 매핑으로 맞추거나 좌표를 공간 중첩해 지적·건축물 데이터와 이어 쓴다.
limits: 법적 효력이 없는 참고자료이므로 실제 규제 여부 판단에는 토지이용계획 확인 등 공식 절차가 필요하다. 원본은 서울 열린데이터광장에 있고 호출에는 포털 활용신청과 별개인 data.seoul.go.kr 인증키가 필요하다. 좌표계가 EPSG:5174(Bessel TM), 인코딩이 windows-949라서 다른 공간자료와 겹쳐 쓰기 전에 좌표 변환과 인코딩 처리가 필요하다.
