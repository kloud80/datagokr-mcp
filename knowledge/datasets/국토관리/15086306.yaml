summary_user: 한강홍수통제소가 수집한 우량자료를 바탕으로 표준유역별 티센 UM 우량을 대권역명·표준유역명·월일시분 단위로 담은 파일 데이터로, 관측 우량과 3시간 간격 72시간까지의 예측우량을 함께 제공합니다(csv 약 29MB). 홍수 대응 담당자나 분석가가 특정 표준유역에 앞으로 3~72시간 동안 비가 얼마나 올지, 그 예측이 실제 우량과 얼마나 맞았는지를 따질 때 쓴다. 전역 조인 키가 없어 다른 수문·홍수 데이터와는 대권역명·표준유역명 이름을 매핑하거나 같은 기관 코드로만 잇는다.
