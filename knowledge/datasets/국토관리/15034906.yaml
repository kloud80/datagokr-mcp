summary_user: 충청남도 금산군에 있는 제조업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 회사명·주소·업종·생산품·대표명·연락처를 담는다. 지역 산업 분석가나 군 행정 담당자가 금산군에 어떤 업종의 제조업체가 어디에 몰려 있는지, 특정 품목을 만드는 업체가 어디인지 찾는 데 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어서, 다른 데이터와는 회사명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 충청남도 금산군에 위치한 제조업체의 현황으로 회사명, 주소, 전화번호, 팩스번호, 업종, 생산품, 대표명 등의 자료가 수록되어 있습니다. 이 데이터는 금산군의 760개의 기업에 대한 정보를 제공하며, 제조업체의 분포 및 생산 품목을 분석하여 산업 정책 수립과 지역 경제 활성화의 기초자료로 활용될 수 있습니다. 또한 금산군 내 산업 구조 파악, 산업 입지 분석, 기업 지원정책 수립, 고용 정책 개발 등 다양한 행정 및 연구목적으로 활용될 수 있습니다. 주요 업종에는 의료기기, 식품, 기계 장비 제조 등이 있으며, 공장 주소를 기준으로 한 공간분석도 가능합니다.
