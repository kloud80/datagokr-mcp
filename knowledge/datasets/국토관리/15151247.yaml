summary_user: 승강기 한 대 단위로 승강기고유번호, 건물명, 주소, 검사유효만료일자, 유지관리업체, 승강기 구분·형식, 설치장소, 호기 등을 담은 전국 대상 조회 API이며, 검증 호출에서는 1행이 수신되었다. 건물 관리자나 점검 담당자가 특정 승강기의 검사 유효기간이 언제 끝나는지, 어느 업체가 유지관리하는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
