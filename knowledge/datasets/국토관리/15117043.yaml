summary_user: 전국에서 대표 저수지 100곳을 골라 저수지별로 주소·주소코드와 유역면적·저수량·관개면적·댐 형식·길이·높이·물넘이 형식·월류수심 같은 시설 제원, 주변 관광지·지역 특산물·먹거리·오시는 길을 한 행씩 담은 CSV 파일이다. 여행자나 농촌관광 기획자가 '근처에 가볼 만한 저수지와 주변 관광지·먹거리는 무엇인가'를 찾거나, 분석가가 대표 저수지의 규모와 댐 제원을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 저수지 데이터(저수율 등)와는 시설명이나 주소코드로 직접 맞춰 이어야 한다.
description_portal: 우리나라 저수지를 대표하는 100개의 저수지를 선정하여 다양한 정보를 제공하고 있습니다.해당 데이터에는 100개 저수지의 기본정보(주소코드, 시설명, 주소)와 기본시설정보(유역면적, 저수량, 관개면적, 댐형식, 댐길이, 댐높이, 물넘이 형식, 물넘이 길이, 월류 수심)를 포함합니다.또한 주변 관광지(시설명 및 주요설명), 지역 특산물, 먹거리, 오시는 길까지  소개하고 있습니다.본 데이터는 농촌 관광 자원으로 활용이 가능하며 일부 저수지에 대한 기본시설정보(저수량, 관개면적, 물넘이길이, 월류수심) 및 주요시설정보 일부 데이터 미대상으로 미집계되어 있습니다.
