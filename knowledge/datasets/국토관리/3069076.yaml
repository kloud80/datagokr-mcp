summary_user: 전주시에 등록된 공장을 한 곳씩 담은 목록으로, 단지명·회사명·도로명/지번 주소·업종명·생산품·연락처·공장면적(제곱미터)·데이터기준일자를 담는다. 지역 산업 분석가나 기업지원 담당자가 '전주시 어느 산업단지에 어떤 업종 공장이 얼마나 넓게 들어서 있나'를 파악하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없으므로, 다른 공장등록·기업 데이터와는 회사명·주소를 맞춰 보는 방식으로만 잇는다.
description_portal: '전북특별자치도 전주시 내 공장등록현황을 제공하며, 단지명, 공장명, 도로명주소, 지번주소, 업종명, 생산품명, 연락처,  공장면적, 데이터기준일자 등을 제공합니다.제공부서 : 기업지원과전주시 공장등록 현황 공공데이터는 인천에 등록된 공장들의 상세 정보를 담고 있습니다.이 데이터에는 공장 명칭, 소재지, 생산품목, 종업원 수 등 다양한 정보가 포함되어 있어  제조업 현황을 한눈에 파악할 수 있는 핵심 자료입니다.<활용 가치>정책 수립: 정부는 이 데이터를 활용하여 특정 지역이나 업종에 대한 맞춤형 산업 육성 정책을 수립하고, 산업단지의 효율적인 관리를 위한 기초 자료로 활용합니다.경제 분석 및 연구: 경제 연구 기관이나 학계는 지역 경제의 규모와 동향을 파악하고, 고용 구조 및 제조업 관련 연구를 진행하는 데 이 데이터를 활용합니다.'
