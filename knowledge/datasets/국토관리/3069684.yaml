summary_user: 인천환경공단 승기사업소 하수처리장의 일자별 운영 기록으로, 날씨·유입량·방류량·내부/외부 반송률과 유입수·분배조·최초침전지·처리 계열별 수온, 수소이온농도, 용존산소, BOD·COD, 부유물질, 총질소·총인, 대장균군 수질을 담은 CSV 파일(약 123KB)이다. 하수처리 분석가나 지역 주민이 '승기사업소에서 유입수 오염물질이 처리 단계를 거치며 얼마나 줄어 방류되는가', '비 오는 날 유입량과 처리 효율이 어떻게 달라지는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 일자를 기준으로 날씨·강수 자료와 맞추거나 사업소 이름으로 하수처리장 원장·방류수 수질 자료와 이름 매핑해 잇는다.
limits: 사업소·시설 코드 같은 공통 조인 키가 없어 다른 처리장이나 전국 하수도 통계와 자동으로 연결되지 않고 이름·일자 매핑이 필요하다. 승기사업소 한 곳의 자료라 다른 처리장 비교나 처리구역 단위 분석에는 별도 자료가 필요하다.
