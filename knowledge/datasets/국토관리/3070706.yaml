summary_user: 광명시 관내 제조업 공장등록업체를 업체 한 곳당 한 행으로 담은 파일로, 회사명·최초 공장등록일·종업원수·생산품·도로명 소재지·업종번호와 업종명(한국표준산업분류)·전화번호가 들어 있다. 기업 지원 담당자나 지역경제 분석가가 '광명시에 어떤 업종의 공장이 어디에, 몇 명 규모로 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 업종번호(한국표준산업분류)로 업종 통계와 맞추거나 소재지 주소를 지오코딩해 토지·상권 데이터와 붙이는 방식으로만 연결한다.
description_portal: 이 데이터는 광명시 관내 제조업 공장등록업체의 현황 자료로 회사명, 최초 공장등록일, 종업원수, 생산품정보, 공장소재지(도로명 주소), 주 업종번호정보 및 업종명(한국표준산업분류), 전화번호를 제공합니다.이 데이터는 정책수립, 행정업무, 경제분석 및 연구, 고용현황 조사, 기업 지원 등 다양한 목적으로 이용될 수 있으며, 매년 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.기타 세부사항은 광명시청(https://www.gm.go.kr/) 분야별정보(공장 설립/등록 현황)에서 확인 가능하며, 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 광명시 투자유치과로 연락부탁드립니다.
