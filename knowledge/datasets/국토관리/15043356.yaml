summary_user: 경기도 이천시 관내 현수막 지정게시대를 게시대 한 곳당 한 행으로 담은 파일로, 읍면동·용도구분·도로명/지번 주소·위도·경도와 현수막 규격(너비·높이), 행정용·상업용 게시면수, 부착일수, 행정용·상업용 부착금액과 민원수수료·일일도로점용료를 포함한다. 이천시에 현수막을 걸려는 사업자나 주민이 '우리 동네 지정게시대는 어디에 있고 상업용 면은 몇 개이며 부착 비용은 얼마인가'를 확인하거나, 분석가가 게시대 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·위도·경도로 공간 결합하거나 읍면동명·관리기관명 같은 이름 매칭으로만 잇는다.
description_portal: 해당 데이터는 경기도 이천시 관내에 설치된 현수막 지정게시대의 위치 및 이용 현황을 체계적으로 관리하기 위한 자료로, 읍면동, 용도구분, 게시대명, 주소, 규격(너비·높이), 게시면수(행정용·상업용), 부착횟수, 부착금액 등 15개 항목으로 구성되어 있습니다. 본 자료는 지정게시대별 물리적 규모와 이용현황, 금액 산정 기준 등을 포함하고 있어, 도시경관 관리와 옥외광고물 정책 수립에 활용될 수 있습니다. 또한 부착금액 및 면수 정보는 광고료 기준 설정, 수입 예측, 게시대 추가 설치 검토 등 실무행정에서 참고자료로 사용되며, 주소 기반의 공간정보는 지도 기반 위치 시각화에도 유용합니다. 이 데이터는 현수막 난립 방지, 합법적 게시문화 조성, 공공안내문구 우선 게시 등의 정책 실현을 위한 기반자료로도 활용됩니다.
