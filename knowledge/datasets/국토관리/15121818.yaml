description_portal: '이 데이터는 공인중개사법에 따라 등록된 부동산중개업소의 운영 현황을 정리한 자료입니다. 각 사무소의 명칭, 소재지 주소, 전화번호 등의 정보를 제공하며, 부동산 거래 민원 대응, 중개업소 이용 편의 제고, 불법 중개 행위 예방 등의 행정적 활용은 물론, 주민들이 중개업소를 신속하게 파악하고 연락할 수 있도록 구성되어 있습니다. 일부 전화번호는 비공개 사유가 함께 표시되어 있어 개인정보 보호에 유의하고 있으며, 실제 운영 중인 사무소의 현황을 기준일 기준으로 확인할 수 있습니다. 총 7개 컬럼으로 구성되어 있으며, 데이터 기준일은 2025년 8월 20일입니다.시도: 부동산중개업소가 소재한 광역 지자체입니다.시군구: 부동산중개업소가 위치한 기초 지자체입니다.사무소명: 등록된 공인중개사사무소의 상호명입니다.사무소전화번호: 사무소에서 사용하는 대표 전화번호입니다.전화번호 비공개 사유: 전화번호가 비공개일 경우 그 사유를 명시합니다.사무소주소: 해당 중개업소의 사업장 주소입니다.기준일자: 데이터가 집계된 기준일로, 최신 현황 기준으로 기록되어 있습니다.'
