description_portal: '한국가스공사 인천기지본부 상수도 월 별 사용량에 관한 데이터입니다.인천기지본부의 상수도 사용처는 크게 설비용(IW)과 사무용(PW)로 구분되어 있습니다.해당 데이터는 월 별 용도에 따른 상수도 사용량을 구분하여 나타냅니다.상수도 사용량의 산정 기준은 인천기지에 위치한 수도 계량기 3곳의 전월지침 대비 당월지침 값을 비교하여 계산하였습니다.사용량의 단위는 세제곱미터(㎥)로 작성되었습니다. * 작성대상기간 : 2020년 1월 ~ 2026년 6월 * 첨부된 데이터의 파일형식은 CSV파일입니다.'
