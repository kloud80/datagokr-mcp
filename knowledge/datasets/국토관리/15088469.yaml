description_portal: '이 데이터는 서울시 세운지구 내 택지(획지)의 이용계획에 관한 정보로, 도시재생과 개발이 혼재된 지역의 토지 이용 현황을 체계적으로 보여주는 자료입니다. 데이터에는 구역(예: 1-1구역, 3-2구역 등), 구분(용도 또는 지정 유형), 면적(㎡), 해당 택지의 존치 여부(기존 건축물 유지 또는 철거 여부), 그리고 전체 면적 대비 차지 비율(%) 등이 포함되어 있습니다. 이를 통해 각 구역 내에서 어떤 유형의 토지가 얼마만큼 존재하며, 보존 대상인지 개발 예정지인지 등을 파악할 수 있어, 도시계획 수립, 개발 가능성 평가, 주민참여형 재생사업 설계 등에 활용될 수 있습니다. 단, 세운지구는 단계별로 개발계획이 갱신되므로 해당 데이터는 행정 결정이나 도시계획 변경 등에 따라 수시로 변동될 수 있습니다.'
