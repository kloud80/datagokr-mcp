summary_user: K-water가 관리하는 광역 취수장마다 한 행씩 관리번호, 취수장 이름, 건설연도, 주소, 취수구분(용수댐 등), 취수원 이름, 취수용량, 후처리시설 유무를 담은 전국 단위 시설 제원 파일이다. 연구자나 지자체 담당자가 특정 지역의 광역상수도 원수를 어느 댐·하천 취수장에서 얼마만큼의 용량으로 끌어오는지 확인할 때 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 전역 조인 키가 없다. 취수장·취수원 이름이나 읍면동 코드(읍면동 코드)를 매핑해 정수장·댐 데이터 등 같은 기관의 상수도 자료와 잇는다.
