description_portal: '○ 통계개요* 통계명 : 빈집사유 및 기간별 빈집 현황* 통계종류 : 조사, 지정통계* 근거법령 : 인구주택총조사 규칙* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악하여 각종정책입안의 기초자료로 활용, 각종 가구관련 경상조사 표본틀로 활용* 조사체계 : 전수 : 공공기관 및 사법기관 등 각종 행정자료 활용 → 통계청표본 : 조사원 →동.읍.면→구.시.군→시.도→통계청* 공표주기 : 5년* 공표범위 : 지역 - 서울시내용 - 주택종류별 빈집사유 및 비어있는 기간 등의 빈집 수○ 용어설명* 빈집 : 사람이 살지 않는 주택을 말하며, 신축되어 아직 입주하지 않은 주택도 포함○ 기 타* 빈집을 대상으로 집계* 개인정보 보호와 자료 노출 위험성을 최소하기 위하여 5미만 자료는 x로 표기함* 2015년 인구주택총조사는 방문면접조사인 현장조사로 행정자료를 활용한 전수조사의결과와 차이가 발생할 수 있음'
