summary_user: 경기도 파주시에 등록된 제조업 공장을 공장 한 곳당 한 행으로 담은 파일(CSV, 약 1.5MB)로, 회사명·대표자·도로명/지번주소·위도·경도·업종·종업원수·생산품·주원자재와 소속 산업단지·지식산업센터명을 포함한다. 창업자나 분석가가 '파주시 어느 산업단지에 어떤 업종 공장이 몰려 있고 종업원 규모는 어떤가'를 파악하거나 업종별 공장 분포를 지도로 그리는 데 쓴다. 전역 조인 키(사업자번호·필지번호 등)는 없으므로 다른 데이터와는 주소·좌표로 공간 매칭하거나 업종번호·업종명, 산업단지명을 이름 기준으로 맞춰 잇는다.
description_portal: 경기도 파주시 제조업 공장등록 현황에 대한 공공데이터로, 회사명, 대표자명, 산업단지명, 지식산업센터명, 공장의 위치 정보인 도로명주소, 지번주소, 위도, 경도, 업종번호, 업종명, 종업원수, 생산품명, 주원자재명 등으로 구성되어 있습니다. 본 데이터셋은 위치 기반 서비스(LBS) 구축 및 GIS 분석, 산업단지 조성, 지역 균형 발전 정책, 지식산업센터 건립, 산업단지 재정비 사업 타당성 조사, 청년 창업자가 진출 가능한 유망 업종 또는 협업 대상 기업 탐색, 산업별 통계, 고용 분석, 공급망 구조 연구, 산업 분포 및 지역 경제 분석, 특정 지역의 산업 육성 정책 계획, 효율적인 물류망 구축이나 유통 경로 설계, 상권 활성화 방안 마련, 특정 지역의 환경 영향이나 오염 가능성 분석, 창업 트렌드 파악, 업종별 지도 시각화, 통계 대시보드, 지역 제조업 밀집도 분석, 신규 창업자나 스타트업 지원 프로그램 기획, 테스트베드 후보지 선별, 데이터 기반의 정책 수립, 비즈니스 기획, 스마트시티 및 산업클러스터 관련 연구 등에 활용될 수 있습니다.
