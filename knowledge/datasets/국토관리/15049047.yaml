summary_user: 경기도 의정부시 지역화폐의 카드 사용액을 기준연도별로 업종 대분류·세부업종 단위로 묶은 집계 데이터로, 시군구 단위(의정부시 한 곳)를 범위로 하며 약 8KB 크기의 CSV 파일 하나로 제공된다. 정책 담당자나 연구자가 '의정부시 지역화폐가 어느 업종에 많이 쓰이고 연도별로 어떻게 달라졌나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 시군의 지역화폐 업종별 자료와는 시군명·업종명 같은 이름이나 업종코드를 직접 맞춰 비교해야 한다.
description_portal: 경기도 의정부시에서 발행·사용된 지역화폐의 업종별 사용 내역을 집계한 데이터입니다. 기준연도별로 업종 대분류와 세부업종에 따른 카드 사용액을 제공하며, 업종명, 업종코드, 카드사용액, 데이터 기준일자 등의 항목으로 구성됩니다. 이를 통해 업종별 소비 규모와 특징을 정량적으로 파악할 수 있으며, 특정 업종에 집중되는 소비 흐름이나 연도별 소비 패턴의 변화를 분석할 수 있습니다. 특히 지역화폐 사용이 소상공인 매출 증대와 지역경제 활성화에 미치는 영향을 검증할 수 있는 중요한 근거 자료로 활용됩니다. 또한 업종별 소비 구조를 분석함으로써 의정부시의 지역화폐 정책 효과를 보다 면밀하게 평가할 수 있고, 향후 업종 맞춤형 지원 전략이나 소비 촉진 정책을 수립하는 데 필요한 기초 정보를 제공합니다. 연구자, 정책 담당자, 일반 시민 모두 지역 소비 행태를 이해하는 데 참고할 수 있습니다.
