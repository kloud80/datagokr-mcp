summary_user: 제주특별자치도개발공사가 도내 주거취약계층을 위해 매입한 공공임대주택을 단지 단위로 담은 파일로, 단지명·도로명주소·공급유형·세대수·전유·공용·공급면적·매입일자·공급연도가 들어 있습니다. 제주에서 청년·신혼부부·저소득층용 매입임대주택이 어느 지역에 몇 세대, 어떤 면적으로 공급됐는지 확인하려는 주거복지 담당자·분석가·입주 희망자가 씁니다. 전역 조인 키가 없어 다른 임대주택·전월세 데이터와는 시군구 이름이나 도로명주소를 맞춰 연결합니다.
description_portal: 본 데이터는 「공공주택 특별법」 및 「기존주택등 매입임대사업 업무처리지침」에 따라 제주특별자치도개발공사가 도내 저소득층, 청년, 신혼부부, 한부모가정, 다자녀 가구 등 주거취약계층의 주거 안정과 주거 수준 향상을 목적으로 매입한 공공임대주택에 관한 정보입니다. 데이터에는 주택명, 주소, 공급유형, 총 세대수, 세대별 전용면적 및 공용면적, 공급면적, 매입일자, 공급년도 등의 항목이 포함되어 있으며, 이를 통해 도내 공공임대주택 공급 현황을 체계적으로 파악하고 향후 주거복지 정책 수립 및 평가에 활용할 수 있습니다.
