summary_user: 서울시 하천 등에서 조사된 어류 보호종의 출현 지점을 한 건씩 담은 공간정보로, 종명·과명, 서울시 보호종·천연기념물·고유종·교란종·외래종 여부, 자치구와 조사지역, 조사연도·출처, X·Y 좌표(EPSG:5174)를 담는다. 하천 생태 연구자나 개발사업 환경검토 담당자가 '이 하천 구간에 보호 어종이 출현한 기록이 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 자치구명(ATNM_DSTC_NM)이나 조사지역 이름을 맞추거나 좌표로 다른 서울 공간 레이어와 겹쳐 이어 쓴다.
description_portal: 서울특별시 어류보호종분포 공간정보 입니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
