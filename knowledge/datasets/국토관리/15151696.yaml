summary_user: DMZ 및 접경지역의 진료소를 한 곳당 한 행으로 담은 목록 파일로, 진료소명·상세 주소·전화번호·위도·경도·비고가 들어 있습니다. 관광객이나 지역 주민이 'DMZ 인근을 방문할 때 가까운 진료소가 어디이고 연락처는 무엇인가'를 확인하거나, 연구자가 접경지역 의료 접근성을 지도로 살펴볼 때 쓴다. 법정동코드(bjd_cd)로 다른 행정구역 단위 통계·시설 데이터와 잇고, 위도·경도로 지도 위에 다른 위치 데이터와 겹쳐 본다.
description_portal: '통일부에서 제공하는 DMZ인근 지역 진료소 정보 데이터는 비무장지대(DMZ) 및 그 주변 접경지역의 주요 진료소 정보를 제공하고 있습니다.데이터는 이름, 주소, 전화번호, 위도, 경도, 비고로 이루어져 있습니다.- 이름 : 진료소명 정보입니다.- 주소 : 진료소가 위치한 상세 주소 정보입니다.- 전화번호 : 진료소의 전화번호 입니다.- 위도 및 경도 : 위도, 경도를 수치로 제공하여 지도 시각화를 할 때 유용하게 활용 될 수 있습니다.- 비고 : 진료소의 추가 정보를 제공합니다.본 데이터는 관광객, 연구자, 지역 주민 등 다양한 사용자가 DMZ 인근 지역의 진료소 현황을 한눈에 파악하고, 방문 정보를 수집할 수 있도록 돕는 실질적인 정보 제공 역할을 수행합니다.'
