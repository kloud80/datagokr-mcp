summary_user: 전국지가변동률조사에 쓰이는 표본 필지의 특성정보를 표본 단위 마이크로데이터로 담으며, 범위는 전국이고 비공간 자료입니다. 분석가가 지목·용도지역·이용상황·면적·가격 같은 표본 속성으로 지역·용도별 지가 수준과 변동 요인을 따져볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역명·코드 매핑이나 한국부동산원의 다른 자료 코드로만 연결한다.
limits: 표준 행정구역코드나 필지 식별자 같은 공통 조인 키가 확인되지 않아 개별공시지가·지적 자료와 필지 단위로 바로 붙이기 어렵다. 필드 의미가 명세에 비어 있어 컬럼 해석은 포털 설명에 링크된 기술문서를 함께 봐야 한다. 호출에는 serviceKey가 필요하고 개발계정은 하루 40,000회로 제한된다.
