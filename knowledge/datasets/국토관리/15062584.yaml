summary_user: 경상북도 포항시 관내 직물 제조업체를 업체 한 곳당 한 행으로 담은 명부로, 회사명·도로명 소재지 주소·생산품·업종명·데이터기준일자를 담는다(CSV 618바이트의 소규모 파일). 포항에서 어떤 직물 공장이 어디에 있고 무엇을 만드는지 알아보려는 거래처 탐색 사업자나 지역 산업 분포를 보려는 분석가가 쓴다. 사업자번호·산업분류코드·필지번호 같은 공통 조인 키가 없어서, 다른 공장등록 자료와는 회사명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 팩토리온 공장등록 정보나 기업 데이터와 바로 결합할 수 없고, 회사명·주소 문자열로 대조해야 한다. 범위가 포항시 한 곳이라 다른 시군과 비교하려면 별도 자료가 필요하다.
