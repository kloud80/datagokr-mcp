summary_user: 부천시 관내 공장 건축물의 건축물대장 내용을 건물(대장) 한 건씩 담은 파일로, 지번·도로명주소, 대장 구분·종류, 주용도, 구조, 허가·착공·사용승인일자, 대지·건축·연면적, 건폐율·용적률, 높이, 층수, 승강기, 주차대수가 들어 있다. 공장 부지를 찾는 사업자나 지역 산업시설 현황을 보는 분석가가 '부천시 어느 동에 어떤 규모·구조의 공장 건물이 언제 사용승인을 받았나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구·법정동 이름과 주지번·부지번, 도로명주소 같은 주소 문자열을 맞춰 연결한다.
limits: 표준 코드가 아닌 코드명(이름)만 들어 있어 법정동코드·건물관리번호로 바로 조인할 수 없고 주소 매칭에 의존한다. 범위는 부천시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
