description_portal: 부천시 건축물중에 공장 건축물에 대한 자료입니다. 자료는 세움터를 통해 추출되었으며 일반건축물 및 집합건축물 모두를 포함한 자료입니다. 부천시 관내에 존재하는 단독공장 건축물 중에서  건축물대장에 나와있는 건축물대장상의 대장구분, 대지위치, 도로명주소,외필지, 대지면적,건축면적,연면적,건폐율, 용적율, 높이, 구조, 주용도, 기타용도, 지붕, 내진설계적용여부, 층수, 세대수, 가구수, 승강기, 주차대수, 소유구분 등이 포함되어 있는 자료입니다. 자료는 매년 6월말경 1년주기로 업데이트 될 예정입니다.
