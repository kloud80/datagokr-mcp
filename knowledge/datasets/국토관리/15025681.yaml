description_portal: 부산광역시 사상구 관내 저수조 청소업(영업소명, 영업소주소, 관리번호 등)현황을 붙임과 같이 제공합니다.2026년 7월 현행화 된 자료 입니다.다음의 건축물이나 시설(이하 “대형건축물등”이라 함)의 소유자 또는 관리자(이하 “소유자등”이라 함)는 저수조를 6개월마다 1회 이상 청소하고, 월 1회 이상 저수조의 위생상태를 점검해야 합니다(규제「수도법」 제33조제3항, 규제「수도법 시행령」 제50조제1항·제2항 및 규제「수도법 시행규칙」 제22조의4제1항).다만, 일반수도사업자가 재난(「재난 및 안전관리기본법」 제3조제1호)이 발생한 경우에 안정적인 물 공급을 위하여 규제「수도법 시행규칙」 제22조의4제3항의 기준을 충족하는 것으로 확인되는 저수조에 대해 환경부장관과 협의하여 해당 반기가 끝나는 날의 다음 날부터 2개월의 범위에서 소유자등에게 저수조 청소 유예를 요청하는 경우에는 그렇지 않습니다(「수도법 시행규칙」 제22조의4제1항 단서).저수조청소업의 신고를 하려는 자는 다음의 서류를 특별자치시장·특별자치도지사·시장·군수 또는 자치구의 구청장에게 제출해야 합니다(규제「수도법」 제34조제1항 전단 및 규제「수도법 시행규칙」 제23조의6제2항)= 저수조청소업 개설 신고서(「수도법 시행규칙」 별지 제13호서식), 인력보유 현황 및 그 자격을 증명하는 서류, 시설 및 장비명세서
