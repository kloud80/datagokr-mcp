summary_user: 부산광역시 사상구 관내에 신고된 저수조 청소업체를 업체 1곳당 한 행으로 담은 건별 현황 파일로, 청소업 관리번호·영업 상태·영업소명·사업자등록번호·도로명/지번 주소를 담는다. 대형건축물 소유자나 관리자가 6개월마다 해야 하는 저수조 청소를 맡길 사상구 업체를 찾을 때, 또는 분석가가 구 단위 청소업체 분포와 영업 상태를 확인할 때 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태 조회나 다른 지자체 저수조 청소업 현황과 이어 쓰고, 주소로 위치를 붙여 쓴다.
