summary_user: 경상북도의 건설기계 관련 등록 정보를 담은 CSV 파일(약 235KB)이며, 실측 필드는 사업장명·도로명주소·위경도·사업종류·등록종 구분·등록번호·등록일자 등 사업장 단위 항목으로 구성된다. 사업자나 지역 분석가가 경상북도 안에서 어떤 종류의 건설기계 관련 사업장이 어디에 등록돼 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·위경도나 관리기관명 같은 이름 매핑으로만 잇는다.
description_portal: 건설기계의 종류별 등록 현황을 정리한 자료로서, 볼도저·굴착기·로더·지게차 등 주요 기종을 기준으로 관용, 자가용, 영업용 등록 대수를 구분하여 제공합니다. 이 데이터는 행정‧산업 분야에서 건설기계의 운용 규모와 이용 특성을 파악하는 데 활용되며, 기종별 수요 변화나 장비 운행 구조를 분석하는 기초 자료로 사용됩니다. 또한 등록 용도별 규모를 한눈에 비교할 수 있어 정책수립, 산업동향 분석, 안전관리 체계 개선 등에 도움이 되는 정보를 포함하고 있습니다. 자료 관련 문의는 054-880-3971로 하시기 바랍니다.
