summary_user: 군산시 관내에 등록된 대부업체를 업체 한 곳당 한 행으로 담은 등록 원천 목록으로, 등록번호·등록일자·상호·법인 여부·사업장 주소·전화번호·대표자를 포함하며 파일 크기는 약 1.9KB(1882바이트)의 작은 CSV다. 시민이 거래하려는 대부업체가 군산시에 정식 등록된 곳인지 상호나 등록번호로 확인하거나, 분석가가 관내 대부업체의 법인·개인 구성과 주소별 분포를 살펴볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호·주소 같은 이름 매칭이나 주소 기반 지오코딩으로만 이어 쓴다.
description_portal: 군산시 대부업 업체 등록현황 데이터는 군산시 관내에서 대부업을 운영하기 위해 등록된 업체들의 기본 정보를 수록한 행정자료입니다. 이 데이터에는 등록번호, 등록일자, 상호, 법인 여부, 사업장 주소, 전화번호, 대표자 이름 등 주요 정보가 포함되어 있으며, 지역 내 대부업체의 관리와 감독, 불법 대부업 예방, 금융소비자 보호 정책 수립 등에 활용됩니다. 또한 대부업체의 지역 분포와 업종 특성을 분석하여 건전한 금융환경 조성과 지역 금융 정책 개선에도 기초 자료로서 중요한 역할을 합니다.최신 등록일은 2026년 5월 27일입니다.
