summary_user: 전국 지방자치단체가 구축해 국토교통부가 취합한 산업입지·산업단지 용도지역지구의 도시관리계획 결정 정보로, 시도별 공간파일(SHP)에 단지 구역 단위 경계와 명칭·고시 관련 속성이 들어 있다. 분석가나 입지 검토자가 특정 지역에 산업단지로 지정된 구역이 어디이고 경계가 어떻게 되는지 확인할 때 쓴다. 실측 컬럼에서는 다른 데이터와 공통으로 쓰는 전역 조인 키가 없어, 산업단지 현황·표준데이터 같은 산업단지코드 원장과는 단지 이름이나 행정구역 코드를 맞춰 대조해야 연결된다.
