summary_user: 공장설립온라인지원시스템(팩토리온)에 등록된 전국 공장을 공장 단위로 한 행씩 담고, 회사명·시도·시군구·단지명·공장규모·입주형태·보유구분 등 기본정보와 함께 공장별 보유 필지 수(필지수)를 집계한 파일 데이터로, 포털 설명상 2021년 7월 말 기준입니다. 지역별·산업단지별로 공장이 몇 개의 필지에 걸쳐 있는지, 임차·자가 등 보유 형태와 공장 규모가 어떻게 분포하는지 보려는 분석가나 지자체 담당자가 쓴다. 실측 컬럼에서 사업자번호·PNU 같은 전역 조인 키는 없어, 공장관리번호나 시도·시군구명·단지명·회사명을 문자열로 맞춰 팩토리온 공장등록·생산정보 데이터나 산단 통계와 연결한다.
limits: 필지 고유번호(PNU)나 사업자번호가 없어 토지·기업 데이터와 직접 조인할 수 없고 이름 매핑에 의존해야 한다. 2021년 7월 말 기준 집계 파일이라 이후 공장 등록 변동은 반영되지 않으며, 파일이 커서(약 14.7MB xlsx) 일반 엑셀에서는 전체가 보이지 않을 수 있다.
