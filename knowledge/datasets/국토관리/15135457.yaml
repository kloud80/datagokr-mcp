summary_user: 안양시의 유동인구를 시군구·시간대(00~23시)·외국인 여부별로 나눠, 남녀 각각 0~69세 연령대별 인구수와 수집일자를 담은 집계 자료다. 상권 분석가나 지자체 담당자가 '안양시에서 20대 여성 유동인구가 가장 많은 시간대는 언제인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 시군구코드(signgu_cd)·시군구명이나 같은 기관(경기도) 코드로 매핑해 다른 경기도 시군 유동인구·상권 자료와 이어 쓴다.
description_portal: 이 데이터는 안양시 지역을 대상으로 시간대별 유동인구를 분석한 자료로, 00시부터 23시까지 1시간 단위로 수집된 정보를 포함합니다. 각 시간대별로 남성과 여성의 유동인구가 0~69세까지 연령대별로 세분화되어 있으며, 외국인 여부도 구분되어 있습니다. 유동인구 수치는 이동통신 기지국 기반으로 수집되어 인근 셀 단위(50x50)로 분배됨에 따라 소수점이 발생할 수 있습니다. 주요 항목으로는 시군구코드, 시군구명, 시간코드, 외국인구분, 성별·연령대별 인구수, 수집일자 등이 있으며, 유동인구의 시간대별 분포 분석, 연령대별 인구 흐름 분석, 상권 활성화 전략 수립, 교통 혼잡도 예측 등에 활용 가능합니다.
