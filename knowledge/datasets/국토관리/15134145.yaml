summary_user: 한국수자원공사가 관리하는 정수장의 정수 수질검사 결과를 시설·채수일자 단위의 건별 데이터로 담고, 탁도·잔류염소·대장균군·일반세균·중금속·소독부산물 등 항목을 제공하며 API 전체 건수는 45,026건이다. 시민이나 분석가가 "우리 지역 정수장의 수돗물은 언제 어떤 수질검사 결과를 받았나"를 확인할 때 쓴다. 전역 조인 키는 없고 수도사업자명(wtwkBsnm)·시설명(nm)·검사월 같은 이름·코드 매핑이나 같은 기관의 다른 데이터 코드로 정수장·상수도 데이터와 이어 쓴다.
description_portal: 본 데이터는 한국수자원공사에서 관리하는 정수장에서 실시한 상수도 정수 수질검사 정보입니다. 대상은 정수처리를 거친 상수도이며 국민이 안심하고 음용할 수 있도록 정기적으로 검사한 결과를 제공합니다. 이를 통해 공급 안전성과 위생 상태를 확인할 수 있으며, 본 자료는 정수장 관리의 투명성을 높이고 안전한 수돗물 공급 체계 마련과 신뢰 확보에 기여합니다.(대상) 전국 160개 지자체(제공정보) 검사월, 수도사업자, 시설명, 소재지, 수원 시설용량, 채수일자, 미생물, 무기물질, 유기물질, 소독제 등
