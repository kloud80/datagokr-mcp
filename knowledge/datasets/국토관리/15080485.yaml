summary_user: 경상북도 청도군의 일반건축물별 지방세 과세 기준인 시가표준액을 과세년도별로 담은 건별 원천 파일로, 법정동·리·본번·부번·동·호로 특정되는 건물마다 시가표준액(원)·연면적·기준일자를 담는다(CSV 약 7.2MB). 청도군에 건물을 가진 납세자나 분석가가 "이 건물의 시가표준액이 과세년도마다 어떻게 바뀌었나", "연면적과 시가표준액은 어떤 관계인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 자치단체코드나 법정동·리·본번·부번 같은 주소 항목을 이름 매핑해 건축물대장·공시가격 등 다른 건물 데이터와 이어 붙여야 한다.
description_portal: 경상북도 청도군에서는 2017년부터 2020년까지 일반건축물에 대해 지방세 부과의 기준이 되는 시가표준액 정보를 공개하고 있습니다. 공개 항목은 건축물의 물건지(주소 또는 위치), 시가표준금액(원 단위), 연면적(㎡), 결정일자로 구성되어 있으며, 각 연도별로 개별 건축물의 과세 기준이 어떻게 조정되었는지를 확인할 수 있습니다. 연도별 데이터를 시계열로 비교함으로써, 특정 기간 내 시가표준액의 상승 또는 조정 추세, 건축물 규모와 과세표준 간의 상관관계 등을 분석할 수 있으며, 지역 간 부동산 과세 기준의 격차 해소 및 공시가격 현실화 정책과의 연계 연구에도 유용한 기반 자료로 기능합니다.
