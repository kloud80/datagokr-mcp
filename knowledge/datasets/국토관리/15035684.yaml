summary_user: 경상남도 남해군 내 건설현장을 건별로 담은 원천 목록으로, 대지 주소(대지위치)·주용도·착공처리일·사용승인일과 설계·감리·시공을 맡은 사무소 이름을 담는다. 주민이 우리 동네 신축 건물이 언제 착공해 어떤 용도로 사용승인됐는지 확인하거나, 건축 사업자가 남해군에서 어느 시공사·설계사무소가 많이 일하는지 살피는 데 쓴다. 전역 조인 키(건축물대장 관리번호·법정동코드 등)가 없어 다른 데이터와는 대지 주소를 주소 매핑하거나 같은 남해군 기관 데이터와 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경상남도 남해군 내 건설현장의 시공 정보를 한눈에 확인할 수 있게 정리되어 있습니다. 구체적으로 건설현장이 위치한 대지의 주소, 건물의 주요 용도, 착공일과 사용 승인일, 설계·감리·시공을 맡은 사무소의 명칭까지 포함되어 있습니다. 이 정보를 활용하면 시민들은 우리 동네 신축 건물이 언제부터 어떤 용도로 지어졌는지 쉽게 알 수 있고, 지역 개발 동향과 건설 현황을 투명하게 파악할 수 있습니다. 부동산 개발업자나 건축 관련 사업자는 시장 조사, 공사 일정 관리, 지역 내 경쟁사 정보 파악 등에 활용할 수 있습니다. 행정기관이나 연구자들은 건축물의 인허가 현황 분석, 도시계획 수립, 공공시설 분포 개선 등 다양한 활용이 가능합니다.
