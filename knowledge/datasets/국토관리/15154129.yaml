description_portal: ​​한국농어촌공사 강릉지사에서 관리 중인 오봉저수지의 2016년 1월부터 2025년 10월까지의 저수율입니다.오봉저수지는 강원도 강릉시 성산면 오봉리 산111-2에 위치한 저수지로 1983년 준공된 1종 저수지입니다.해당 데이터는 오봉저수지의 10년간 유효저수량(천㎥)과 일별 저수율(%)을 제공하고 있습니다.본 데이터는 1회성 데이터로 2025년 10월 이후 데이터는 공공데이터 포털에서 매년 업데이트 되고 있는 "한국농어촌공사_전국 저수지 일별 저수율" 에서 확인 가능합니다.
