summary_user: 부산 영도구 관내 도시재생 사업(깡깡이예술마을, 흰여울문화마을, 해돋이새뜰마을 등)을 사업별 한 행으로 사업명·위치·사업기간·안내페이지 주소와 함께 담은 703바이트 규모의 소형 목록 파일이다. 주민이나 지역 연구자가 영도구에서 어떤 도시재생 사업이 어디서 언제까지 진행되는지 확인하고 상세 안내페이지로 찾아가는 데 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어 다른 데이터와는 사업명이나 위치 이름을 직접 맞추는 방식으로만 이어 쓴다.
description_portal: 영도구 관내 도시재생 사업 현황(사업명, 위치, 사업기간, 안내페이지)깡깡이예술마을 / 흰여울문화마을 / 영도대통전수방프로젝트 / 해돋이새뜰마을 / 베리베리굿봉산마을(각 사업은 영도구의 특색을 살려 쇠퇴한 도시를 활성화하고, 주민 삶의 질을 높이며, 지속 가능한 지역 발전 모델을 제시하고 있으며, 특히 주민 참여와 로컬 콘텐츠 발굴에 중점을 두어 사회적 가치를 창출하고 있음. 또한 영도구는 해양 도시의 특성을 살려 문화적 재생, 주민 주도형 성장, 스마트 기술 접목 등 다양한 접근 방식으로 도시재생 사업을 추진하며, 이는 로컬 크리에이터 육성의 중요성을 반영하고 있음)
