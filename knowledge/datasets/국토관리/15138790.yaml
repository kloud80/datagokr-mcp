summary_user: 경기도 하남시 춘궁동 일대 상수도 계량기를 관리번호 한 건씩 담은 개별 목록으로, 도로명·지번 소재지 주소, 계량기 구경, 폐전 여부를 함께 담는다. 하남시 상수도 담당자나 분석가가 '춘궁동에서 아직 폐전되지 않은 계량기는 어느 주소에 몇 개이고 구경은 무엇인가'처럼 현장 점검·정비 대상을 추리는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 소재지 주소를 이름 매칭으로 맞추거나 같은 하남시 데이터끼리 연결해야 한다.
