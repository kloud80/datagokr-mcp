description_portal: '경기도 하남시 춘궁동 일대 상수도 계량기를 관리번호(471개로 전수 식별) 단위로 관리하면서, 위치(도로명·지번), 계량기 규격(구경), 운영상태(폐전여부)를 함께 담고 있습니다. 폐전은 253건(약 53.7%), 미폐전은 218건(약 46.3%)으로, 운영·정비 대상이 혼재되어 있어 “현장 점검 우선순위” 설정에 활용도가 높습니다. 구경은 13MM 258건(약 54.8%), 20MM 168건(약 35.7%)가 대부분으로, 일반 수용가 중심의 규격 분포가 뚜렷합니다. 한편 주소 관점에서는 도로명주소 공란 6건, 지번주소 공란(빈칸) 21건이 확인되며, 동일 도로명주소가 반복되는 사례(예: 특정 도로명 8회 반복)는 한 건물/부지 내 여러 계량기(세대·호실·점포 등)가 존재하는 운영 특성을 시사합니다. 따라서 이 데이터는 “폐전 정비”와 “주소 정합성(도로명↔지번) 표준화”를 함께 추진할 때 행정·현장 업무 효율을 가장 크게 높일 수 있습니다.'
