description_portal: '해당 데이터는 금산군 공공하수처리시설 유입수질 분석내역을 기반으로 인공지능 생성모델 알고리즘에 적용하여 산출된 합성데이터입니다. 합성데이터는 원천데이터와 통계적으로 유사한 패턴을 가진 가상데이터로, 익명화와 통계적 변형 기법을 통해 개인정보를 철저히 보호합니다. 합성 모델(CTGAN, GMM)에 따라 각각 24,657건, 21,859건의 데이터가 수록되어 있습니다. 해당 합성데이터를 활용하여 유입량·유입수질(BOD, COD, SS, T-N, T-P, 대장균군) 일자별 변동으로 부하 예측 및 운영을 최적화할 수 있습니다. 또한 기상·계절과 연동한 월별 이상패턴 감지 및 설비 용량 계획 등을 수립하기 위한 연구 목적으로도 활용될 수 있습니다.※ 항목명 상세 설명1. 날짜 : 관측 일자(YYYY-MM-DD)2. 유입량(㎥/일) : 하루 동안 처리장으로 들어온 원수 유량의 합계(입구 유량계 적산)3. 방류량(㎥/일) : 하루 동안 방류수로 배출된 유량의 합계(출구 유량계 적산)4. BOD(㎎/L) : 하수처리시설에서 유입되는 원수의 5일 생화학적 산소요구량(BOD₅)5. COD(㎎/L) : 하수처리시설에서 유입되는 화학적 산소요구량(전 유기물 산화 지표)6. SS(㎎/L) : 하수처리시설에서 유입되는 부유고형물 농도(현탁 고형물)7. T-N(㎎/L) : 하수처리시설에서 유입되는 총질소(암모니아·질산/아질산·유기질소 포함)8. T-P(㎎/L) : 하수처리시설에서 유입되는 총인(정인·유기인 포함)9. 총대장균군(개/㎖) : 하수처리시설에서 유입되는 원수의 총대장균군 수'
