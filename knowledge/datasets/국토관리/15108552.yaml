description_portal: 한국토지주택공사의 정보공개 - 사전정보공표 - 전체를 통해 접속이 가능합니다. 한국토지주택공사에서 제공하는 민원 목록 및 내용, 조사결과, 수용여부, 민원처리결과 등 고충 다수 민원과 관련된 데이터를 제공합니다. 매년 3월에 관련 결과를 공표하며 총무처에서 관련 정보를 담당하고 있습니다. 각 파일은 고충 및 다수 민원관련 조사 및 처리결과에 대해서 안내하며 번호, 요청일자, 민원요지, 심의결과, 수용여부 및 사유, 처리결과를 통해 심의를 안내합니다. 일반적으로 관련 민원이 불수용 되는 경우는 기간 연장 혹은 요금 인상에 대한 것들이 대다수입니다.
