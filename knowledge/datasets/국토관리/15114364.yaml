description_portal: 지역 내 빈집의 등급 및 동별 분포 현황을 정리한 자료로, 빈집의 위치, 등급 구분, 동별 현황 등 빈집 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 빈집의 발생 현황과 공간적 분포 특성을 종합적으로 파악하기 위한 기초자료로 활용된다.또한 빈집 등급 및 동별 현황에 대한 체계적인 관리를 통해 주거 환경의 안전성 및 노후도 실태를 분석하고, 빈집 정비 및 활용 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 빈집 관리 대상에 대한 행정 관리, 현장 조사, 민원 대응 업무 수행과 함께 관련 통계 산출 및 도시·주거 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 주거 환경 개선과 도시 미관 향상을 위한 관리 체계를 강화하고, 빈집 정비 및 활용을 통한 지역 활성화 정책 추진의 기초자료로 활용되며, 지속적인 주거·도시 행정 업무 수행을 지원하는 행정자료로 활용된다.
