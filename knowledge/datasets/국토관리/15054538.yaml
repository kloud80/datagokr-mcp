description_portal: 생활용 지하수개발이용시설의 이용량 등 정보를 제공하며, 지하수 조사연보 통계작성을 통해 생산된 데이터입니다. 생활용 시설의 세부용도별 이용현황을 확인하실 수 있습니다. 제공되는 지하수 정보는 지역 간 지하수 현황 비교, 지질 및 환경 여건 파악, 지하수 개발이용을 위한 참고자료로의 활용 등 다양한 분야에서 사용될 수 있으며, 민간 기업 및 공공기관의 연구와 정책 수립에 활용할 수 있는 기초자료입니다. 기타 관련된 지하수 정보는 국가지하수정보센터 홈페이지(https://www.gims.go.kr)에서 확인하실 수 있습니다.* (참고사항) 국가지하수정보센터(www.gims.go.kr)에서 제공하는 통계정보는 데이터 검증 및 확정 절차로 인해 통상 2~3년의 기간이 소요됩니다.
