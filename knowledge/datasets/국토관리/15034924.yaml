summary_user: 전남 광양시 관내에 제조업으로 등록된 공장을 한 곳씩 담은 목록으로, 회사명·전화번호·도로명주소·지번주소와 데이터기준일을 담는다(CSV 파일 약 98KB). 광양 지역에서 협력업체나 납품처를 찾는 사업자, 또는 산단 주변 공장 분포를 보려는 분석가가 '광양시에 어떤 제조 공장이 어디에 있나'를 확인하는 데 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 공장등록·기업 데이터와는 회사명이나 주소를 매칭해 이어 쓰며, 주소를 지오코딩하면 지도·입지 분석과 연결할 수 있다.
limits: 실측 컬럼에 전역 조인 키가 없어 팩토리온 공장등록 데이터 등과 정확히 연결되지 않고, 회사명·주소 문자열 매칭에 의존해야 한다. 범위는 광양시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
