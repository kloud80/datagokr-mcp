description_portal: 본 자료는 전라남도 광양시 관내에서 제조업종으로 등록된 공장의 기본 현황 정보를 체계적으로 정리한 데이터로, 공장의 회사명, 전화번호, 주소(도로명·지번) 등의 항목으로 구성되어 있습니다.광양시는 국가산단, 중소기업 산업단지 등이 조성된 주요 산업 도시로, 공장 위치 정보 및 연락처를 국민에게 투명하게 공개함으로써 산업정보 활용도를 높이고, 기업 접근성과 유치 환경을 개선하기 위한 목적에서 본 데이터를 제공합니다.특히 도로명주소와 지번주소를 병기함으로써 행정기관, 물류업체, 민간기업, 지역 주민 등 다양한 사용자층이 상황에 맞는 위치 식별 방식으로 활용할 수 있습니다. 해당 정보는 산업 정책 수립, 민간기업 간 네트워크 구축, 공장 등록 현황 파악, 입지 분석, 지방세 과세 기초자료 등 다양한 행정 및 실무 영역에서도 유용하게 쓰입니다.
