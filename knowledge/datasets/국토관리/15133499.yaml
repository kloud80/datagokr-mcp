summary_user: 유역 단위(KMA 대권역·중권역·표준유역)로 날짜별 면적강수량(mm), 증발산량(mm), 토양수분(%)을 담은 집계 파일로, 전국을 대상으로 한다. 물관리 담당자나 분석가가 특정 표준유역의 최근 강수와 토양수분 변화를 보고 가뭄 위험이나 홍수기 대비 상황을 판단하는 데 쓴다. 전역 조인 키는 없으며, 중권역·표준유역 코드와 이름을 수자원단위지도 구분이나 다른 유역 기반 수문 자료에 이름·코드 매핑으로 맞춰 잇는다.
description_portal: '기상청 수문기상정보는 홍수 등 수문기상 재해 대응과 물관리 유관기관의 의사결정을 지원하기 위해 생산된 유역단위 면적강수량, 토양수분, 증발산량 자료입니다. 단기 홍수 예·경보 업무까지 폭넓게 활용될 수 있으며 이를 통해 기관들은 유역의 물 공급 관리, 홍수기 대비 계획, 가뭄 위험 평가 등 다양한 분야에서 기초자료로 활용할 수 있습니다. 세부 사항은 기상청 수문기상 가뭄정보 시스템(https://hydro.kma.go.kr)을 참고하여 주시기 바랍니다.- 유역단위: 기후에너지환경부에서 관리하는 "수자원단위지도"에서 구분하는 중권역, 표준유역과 기상청의 KMA대권역이 해당됩니다.'
