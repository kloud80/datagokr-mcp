summary_user: 한국수자원공사가 운영하는 전국 유량측정소 60곳의 위치 정보를 측정소 한 곳당 한 행으로 담은 CSV 파일로, 관측소코드·수계명·하천명·관리기관·주소·경위도·유역면적 등을 싣는다. 수자원 담당자나 분석가가 유량측정소가 어느 하천 어디에 있는지 지도에 표시하거나 확인하는 질문에 쓴다. 주소(address)와 경위도 좌표(coord)를 키로 지도·공간 데이터와 잇고, 관측소코드가 있어 WAMIS 기준 수문 시계열과 연계해 볼 수 있다.
description_portal: 본 데이터는 한국수자원공사가 운영하는 유량측정소 좌표 정보(60개)를 제공한 것입니다. 유량측정소는 하천, 저수지, 댐 등에서 수량 변화를 실시간 또는 정기적으로 관측하는 시설로, 유입량·방류량·유속 등의 수문학적 자료를 수집하는 핵심 거점입니다. 데이터에는 측정소 명칭, 위치 좌표(위도·경도), 설치 하천명, 관할 관리기관 등의 정보가 포함되어 있습니다. 이를 통해 사용자는 특정 유량측정소의 위치를 지도 기반 시스템에 표시하거나, 수자원 관리, 홍수 예·경보, 수문 분석 등 다양한 업무에 활용할 수 있습니다. 해당 자료는 수문학 연구, 유역 관리 계획 수립, 환경 영향 평가, 재난 대응 체계 구축 등에도 기초 자료로 쓰이며, 다른 수문·기상 데이터와 연계하여 분석하면 수자원 예측 정확도를 높일 수 있습니다.
