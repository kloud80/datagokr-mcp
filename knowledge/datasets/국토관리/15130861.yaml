description_portal: '한국부동산원(구.한국감정원)에서 제공하는 공동주택 실거래가격지수중 아파트 가격의 월별 지역별 전세 중위 데이터입니다.- (단위 : 만원 /㎡)<공동주택실거래가격지수 개요>ㅇ 국가통계 승인번호 : 제116072호ㅇ 법적근거 : 주택법 제88조 및 89조, 동법 시행령 제91조ㅇ 작성목적 : 전국의 재고 아파트 및 연립·다세대를 대상으로 하여 실제 거래되어 신고된 공동주택의 가격정보를 활용한 통계를 생산하여 정확한 시장동향 정보를 국민에게 제공하고 정부 정책 수립에 참고 자료로 활용ㅇ 작성주기 : 월ㅇ 공표주기 :   - 공동주택 통합(매매)   * 매월 : 전국, 수도권, 지방, 서울, 인천, 경기  - 아파트(매매)   * 매월 : 전국, 시·도, 서울 생활권역   * 매분기 : 수도권 및 광역시의 시·군·구  - 아파트(전세)   *매월 : 전국, 시·도, 서울 생활권역  - 연립·다세대(매매)   *매월 : 전국, 수도권, 지방, 서울, 인천, 경기'
