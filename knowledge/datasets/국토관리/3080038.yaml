summary_user: 거제시가 발행하는 거제사랑상품권을 쓸 수 있는 가맹점을 한 곳씩 지역·상호명·소재지·위도·경도·기준일자로 담은 시군구 범위의 건별 목록(CSV 파일, 약 400KB)이다. 주민은 내 주변 어디서 거제사랑상품권을 쓸 수 있는지 찾는 데 쓰고, 분석가는 가맹점이 읍면동별로 어떻게 분포하는지 파악하는 데 쓴다. 전역 조인 키는 없으므로, 다른 데이터와는 소재지 주소나 좌표(위도·경도)를 기준으로 공간·주소 매칭해 이어 쓴다.
description_portal: 본 데이터는 경상남도 거제시에서 발행하는 거제사랑상품권을 사용할 수 있는 가맹점 정보를 상세히 제공합니다. 각 가맹점의 지역, 상호명, 소재지와 함께 정확한 위치 확인이 가능한 위도·경도 정보가 포함되어 있어, 사용자는 자신에게 가까운 가맹점을 쉽고 편리하게 찾을 수 있습니다. 국민과 기업 모두 상품권 활용 계획 수립, 마케팅 전략 수립, 상권 분석 등 다양한 목적으로 활용할 수 있는 유용한 자료입니다. 또한 지역경제 활성화 정책을 계획하거나, 가맹점 분포 현황을 파악하기 위한 기초자료로도 활용할 수 있어, 지역 상권과 경제를 이해하고 지원하는 데 큰 도움이 됩니다.
