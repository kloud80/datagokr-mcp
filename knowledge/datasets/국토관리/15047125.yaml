description_portal: '○ 통계개요* 통계명 : 주택현황 및 보급률(새로운산정방식)* 통계종류 : 서울시 주택현황 및 보급률을 제공하는 일반ㆍ가공통계* 작성목적 : 생활을 같이하는 가구가 거주하는 공간으로써 주택의 보급 정도를파악하여 주택관련 정책수립의 기초 자료로 활용하는 것을목적으로 함* 조사체계 : 통계청 인구주택총조사 결과를 활용* 공표주기 : 정기(매년, 작성대상년도 익년 1월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 주택현황(종류별 주택수) 및 보급률○ 용어설명* 주택보급률 : 특정국가 또는 특정지역의 주택재고의 과부족을 총체적으로 나타내주는지표. 일반적으로 주택수를 가구수로 나누어 산정(총 주택수/보통가구수)하고 있음* 연립주택 : 한 건물내에 여러가구가 살 수 있도록 건축된 4층이하의 영구건물로서건축당시 연립주택으로 허가받은 주택을 말함* 다세대주택 : 한 건물내에 여러 가구가 살 수 있도록 건축된 4층 이하의 영구건물로서건물의 연면적이 200평 이하이면서 건축당시 다세대 주택으로 허가받은 주택을 말함* 비거주용건물내 주택 : 영업용 목적으로 건축된 건물내에 사람이 거주할 수 있도록구획된 부분으로서 주택의 요건을 갖추고 있는 것을 말함. 단, 사람이 살고 있으나주택의 요건을 갖추지 못한 거처는 주택이외의 거처로서 주택에서 제외함○ 기 타# 통계산정방식 변경으로 "주택현황 및 보급률(새로운산정방식)(2015년 이후)"으로 대체* 주택수는 통계청 인구주택총조사 결과를 활용함- 인구주택총조사가 이루어지는 연도에는 통계청의 인구주택총조사보고서의 주택수 활용- 인구주택총조사가 실시되지 않는 연도에는 매년 신축주택수를 더하고 멸실수를 감하여주택수 산정 (국토교통부 보고 산정기준)* 주택보급률 산정기준 변경 : 거처의 종류별로 살고 있는 일반가구를 대상으로 집계(비혈연 5인이하 가구, 1인가구 포함). 단, 집단가구(6인이상 비혈연가구, 기숙사,사회시설 등) 및 외국인 가구 제외* 단독주택 산정기준 변경 : 기'
