summary_user: 경기도 이천시에서 추진 중인 일반정비사업을 정비구역 1건당 1행으로 담은 원천 현황 파일(csv, 약 1.2KB)로, 구역면적·기존주택 준공년도와 세대수, 조합원·일반분양·임대 세대수, 용적률 변화, 구역지정부터 관리처분인가까지의 인허가 일자와 현 추진상황을 담는다. 이천시 재개발·재건축 구역에 관심 있는 시민이나 투자자가 '이 구역은 조합설립·관리처분 중 어느 단계까지 왔고 일반분양 물량은 몇 세대인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구명이나 정비구역명·위치 문자열을 맞춰서만 이어 쓸 수 있으며, 다른 시군의 같은 형식 정비사업 현황과 나란히 비교하는 방식이 현실적이다.
description_portal: 이 데이터는 경기도 이천시에서 추진 중인 일반정비사업의 전반적 현황을 제공하며, 도시 노후 주거지의 재개발 추진 과정을 체계적으로 관리하기 위해 수집되었습니다. 주요 내용에는 정비구역명, 위치, 구역면적, 기존 주택의 준공년도·세대수·면적별 세대구성 등 기초 현황이 포함됩니다. 또한 신축 주택의 분양·임대 세대수, 면적별 공급 계획, 용적률 변화와 조합원 수, 토지등소유자 현황 등 사업규모 정보가 제공됩니다. 인허가 절차에서는 정비계획 승인, 구역 지정, 추진위원회 승인, 조합설립 인가, 사업시행 인가, 관리처분 인가, 착공·준공·이전고시 등 법적·행정적 일정이 기록되어 추진 단계별 진행 상황을 파악할 수 있습니다. 활용 측면에서는 지자체와 연구기관이 정비사업 진행 속도와 주택공급 계획을 분석해 정책 수립 자료로 활용할 수 있으며, 시민과 이해관계자들은 현 추진 상황과 일반분양 물량을 확인하여 합리적 의사결정을 지원받을 수 있습니다.
