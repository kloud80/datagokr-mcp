summary_user: 군 주거권역별로 적정 주택가격(중위단위가격의 70%~150%) 범위에 드는 주택 공급 물량을 분석해 담은 집계 자료로, 범위는 전국이며 공간 좌표 없이 권역 단위로 제공된다. 군 주거정책 담당자나 분석가가 특정 군 주거권역에서 적정 가격대 민간주택이 얼마나 있는지, 임차지원이 얼마나 필요할지를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 주택 실거래·공급 데이터와는 권역·지역 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 포털 활용신청이 아니라 vworld.kr에 로그인해 시도별 XLSX 파일로 내려받아야 한다. 파일 첫 행이 테이블정의서 형식이라 컬럼명이 제대로 잡히지 않으므로 파싱할 때 헤더를 따로 정리해야 한다. 공통 조인 키가 없어 다른 데이터와 자동으로 결합하기 어렵다.
