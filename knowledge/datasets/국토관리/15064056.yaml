summary_user: 행복도시(세종시 행정중심복합도시) 개발계획의 주요 지표를 대분류·중분류·소분류별 계획지표 값과 비고로 정리한 소규모 집계 파일(csv 약 3.4KB)이다. 도시계획 연구자나 분석가가 행복도시의 세대당 가구원수, 인구밀도, 생활권 규모, 상업시설 면적 비율 같은 계획 기준을 다른 신도시와 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 분야 이름 매핑이나 같은 기관(행정중심복합도시건설청) 자료 기준으로만 이어 쓴다.
description_portal: 이 데이터는 행정중심복합도시(세종시 행복도시) 개발계획의 핵심 지표를 제공합니다. 주거·생활권, 상업, 공원녹지, 교통, 공공시설 등 주요 분야별로 세대당 가구원수, 인구밀도, 생활권 규모·개수, 상업시설 면적 비율 등 정량적 수치가 제시되어 있어, 행복도시가 지향하는 도시 구조와 공간 배분 원칙을 한눈에 확인할 수 있습니다.예를 들어, 주거 부문은 세대당 가구원수와 생활권 규모를 통해 인구밀도와 생활권 단위 계획을 보여주며, 상업 부문은 업무·상업시설의 비율을 통해 경제·업무 기능의 배분 원칙을 제시합니다. 또한 공원·녹지 및 공공시설 부문은 주민 생활 편의와 환경적 균형을 고려한 배치 기준을 제공합니다.본 데이터는 도시계획 수립, 교통수요 예측, 주거정책 및 인구 정책 연구, 국제 도시 비교, 행복도시 개발 성과 평가 등 정책·연구·분석 전반에 활용 가능한 기초자료입니다.
