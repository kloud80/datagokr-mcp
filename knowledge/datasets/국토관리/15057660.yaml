summary_user: 전국을 수자원 관리용 대권역으로 나눈 유역 구역 지도정보로, 대권역마다 권역 코드(bbsncd)와 권역 이름을 담는다. 하천·수자원 분석가나 개발 사업자가 특정 지역이 어느 대권역에 속하는지, 하천구역 관련 공간 규제를 검토할 때 기준 구역을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 중권역·표준유역이나 하천 데이터와는 권역 코드·이름을 맞춰 매핑하거나 같은 기관 코드로만 연결한다.
description_portal: 국가 차원의 수자원개발, 계획 및 관리업무의 효율적 추진을 위하여 수자원 업무에 활용되는 자료의 수집, 분석과 물관련 기관 간 자료의 공동활용을 목적으로 지형공간 상에 대권역, 중권역 및 표준유역의 가상의 구역을 설정한 지도정보를 제공합니다. ◎ 1999년 8월 21세기 정보화시대를 맞이하여 건설교통부에서 국가자원정보화 사업에 부응하는 수자원 정보시스템 기반을 구축하고, 국가 차원의 수자원 개발 계획 및 관리를 보다 효율적으로 추진하기 위하여 미국의 수문단위지도(The Hydrologic Unit Map) 및 일본의 유역정보시스템과 같은 유역단위의 표준 지도 제작의 필요성이 대두되어 정부가 추진해온 국가지리정보 시스템(NGIS)을 활용하여 대권역 22개, 중권역 117개, 표준유역 1,174개로 구성된 수자원지도를 개발빈칸◎ 2002년 4월 건설교통부에서만 사용되고 있는 수자원지도를 대외적으로는 물관련 기관간의 물관련 기초자료의 정보 교환 및 생성을 위한 공통유역도로, 대내적으로는 수자원장기 및 유역조사 등의 유역분할 기준으로 사용하기 위해, '물관리정보 표준화 실무 소위원회'에서 관련부처 관계자(건교부, 농림부, 환경부 물정보 담당자) 및 외부전문가로 구성된 공통유역도 조정업무 전담반을 구성, 운영하여 국내 물관련 기관에서 해당 업무에 활용되는 자료를 공동 활용하기 위한 목적으로 확정한 공통유역도(21개 대권역, 117개 중권역)를 기본틀로 하여 대권역 21개, 중권역 117개, 표준유역 840개로 구성된 수자원지도를 개발
