summary_user: 울산광역시도시공사가 지은 공공임대아파트 ‘율동위드유’ 단지 안 상가를 호실 단위로 정리한 파일로, 층·호수, 공급·전유·공용 면적, 분양예정가격, 분양 여부, 소유권 변동일자와 주소·담당부서 연락처를 담는다(CSV 약 1.4KB의 소규모 자료). 상가 분양을 고려하는 사업자가 남은 호실의 면적과 예정가격을 비교하거나, 연구자가 공공임대 단지 상가의 분양 진행 상황을 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 지번·도로명 주소나 시군구·읍면동 이름으로 맞춰 이어야 한다.
description_portal: 본 데이터는 울산광역시도시공사가 건축한 공공임대아파트 ‘율동위드유’ 내 상가 분양 현황을 정리한 자료입니다.데이터에는 상가명, 행정구역 정보(시·군·구·동), 지번 및 도로명 주소 등 기본 위치 정보가 포함되어 있으며, 층수와 호수, 공급면적, 전유부 면적, 공용부 면적 등 상가의 세부 물리적 정보도 함께 제공됩니다. 또한 분양예정가격, 분양 여부, 소유권 변동일자 등 분양 관련 핵심 정보와 함께 관리기관명, 담당부서명, 안내 전화번호 등이 수록되어 있어 상가 분양 및 관리 현황을 종합적으로 파악할 수 있습니다.해당 자료는 공공임대아파트 내 상가 자산의 분양 현황을 투명하게 공개함으로써, 시민과 수요자에게 객관적인 정보를 제공하고 공공자산 운영의 공정성과 신뢰성을 높이는 데 목적이 있습니다. 나아가 분양 희망자에게는 상가 입지와 면적, 가격 등 실질적인 의사결정에 필요한 정보를 제공하며, 정책 담당자와 연구자에게는 공공임대 상가 운영 및 자산 관리 정책 수립의 기초자료로 활용될 수 있습니다.
