summary_user: 수도사업자별로 연도 단위 GIS 구축 완료 관로 총연장과 도수관·송수관·배수관·급수관 등 용도별 완료 연장, 관로 GIS 구축률을 담은 전국 범위의 집계 파일이다(약 1KB 규모의 소형 CSV). 지자체·광역상수도 운영기관 담당자나 분석가가 "우리 수도사업자의 관로 GIS 구축률이 다른 사업자보다 낮은가, 어떤 용도의 관로가 덜 구축됐나"를 비교해 수도정비기본계획·스마트관망 추진 우선순위를 정하는 데 쓴다. 공통 조인 키가 없어 정수장·급수구역 등 다른 상수도 데이터와는 수도사업자명(지자체명)을 이름 매핑해서만 이어 쓴다.
description_portal: 본 데이터는 한국수자원공사가 보유한 국가상수도 관련 GIS(지리정보시스템) 구축 현황을 정리한 자료이다. 수도사업자별 총 관로 연장과 도수관, 송수관, 배수관, 급수관 등 용도별 GIS 구축 완료 관로 연장, 전체 대비 GIS 구축률 등을 포함한다. 해당 정보는 수도시설 디지털화 수준을 수치로 파악할 수 있는 기반 자료로, 수도정비기본계획 수립, 자산관리 개선, 스마트관망 운영 등에 활용될 수 있다. 연도별로 구성되어 있으며, 지방자치단체 및 광역상수도 운영기관의 공간정보 구축 실적을 비교·분석하는 데 유용하다. 관로 위치, 종류, 구축 상태를 정량적으로 파악하여 유지관리의 효율성과 정책 수립의 객관성을 높이는 데 기여할 수 있다.
