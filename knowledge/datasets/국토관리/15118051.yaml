legal_basis_portal: 본 데이터는 「한국수자원공사법」 제9조(사업) 제1항 제2호 및 제5호에 따라, 수자원의 개발·관리와 수도용 수자원 및 수도시설의 설치·운영과 관련된 자료의 수집·관리·제공을 위해 구축·보유된 것이다.「수도법」 제14조(수도정비기본계획의 수립), 제15조(기본계획의 집행), 제16조(수도시설의 유지관리) 등에 따라 수도사업자는 수도시설 현황과 계획 정보를 체계적으로 확보·관리해야 하며, GIS 기반의 수도관로 정보는 이러한 의무 이행의 핵심 수단이다.
