summary_user: 전북특별자치도 완주군 관내 원룸과 오피스텔을 건물 단위로 한 줄씩 담은 목록으로, 주택유형 구분·주소·건물명·세대수(객실수)·건축연도·데이터기준일자를 담는다. 완주군에서 원룸이나 오피스텔을 구하는 사람, 또는 군 단위 소형 임대주택 공급을 살피는 분석가가 '읍·면별로 원룸·오피스텔이 어디에 몇 세대나 있고 언제 지어졌나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 주소나 건물명을 맞춰 붙여야 하고, 주소를 지오코딩하면 지도나 건축물대장과 대조하는 데 쓴다.
