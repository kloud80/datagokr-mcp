summary_user: 부산광역시 제조업 공장등록업체를 업체별 한 행으로 담은 파일 데이터로, 회사명·공장대표주소·업종명·등록일·공장용지와 제조시설 면적 등을 싣고 검증 수신 기준 11,548행(1956-02-19~2026-07-01)이다. 부산에 어떤 업종의 공장이 어디에 있는지, 지역 제조업 현황을 파악하려는 공무원·연구자·기업 지원 담당자가 쓴다. 이어 쓸 수 있는 키는 공장대표주소(address) 하나뿐이라 주소 기준으로 다른 위치 정보와 맞춰 보며, 사업자번호나 필지번호 같은 키는 이 파일 필드에 없다.
description_portal: 이 데이터는 부산광역시에 위치한 제조업 공장등록업체의 현황 정보를 분기별로 정기 제공하는 자료입니다. 데이터에는 업체명, 공장 대표주소(지번), 업종명, 전화번호 등 총 4가지 항목이 포함되어 있습니다.이 자료를 보면 부산에 어떤 공장이 있고, 어디에 위치해 있는지 쉽게 알 수 있습니다.예를 들어, 부산시의 제조업 현황을 파악하거나, 공장 위치를 확인하거나, 산업 트렌드를 분석하는 데 사용할 수 있습니다.이 데이터는 행정업무, 연구, 산업 동향 분석, 정책 수립, 기업 지원 등 다양한 목적으로 이용할 수 있습니다.자료는 3개월(분기)마다 새로 갱신됩니다.
