description_portal: 이 자료는 대전광역시 생활SOC 복합화사업 현황은 시민의 일상생활에 필요한 기반시설을 하나의 부지에 통합하여 설치하는 생활SOC 복합화 추진사업에 관한 자료입니다. 이 자료는 복수의 생활SOC 사업을 단일 또는 연계 시설물로 조성하는 방식으로 주민편의를 높이고 부지 및 예산 부담을 경감하는 데 목적이 있습니다. 해당 자료는 대전시에서 2019년에 선정된 11개 사업과 2020년 선정된 2개 사업을 포함하고 있으며, 사업별로 위치, 규모, 구성 시설 등 세부 내용을 확인할 수 있습니다.
