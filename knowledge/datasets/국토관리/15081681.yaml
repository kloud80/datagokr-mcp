summary_user: 대전광역시가 선정한 생활SOC 복합화사업(포털 설명상 2019년 11개, 2020년 2개)을 사업 한 건당 한 행으로 정리한 소규모 CSV 파일로, 선정연도·선정지역·사업명·유형·복합대상시설·사업기간을 담는다. 시민이나 지역 연구자가 '우리 구에는 어떤 생활SOC 복합시설이 어떤 시설 조합으로 언제까지 조성되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 선정지역(자치구·동 이름)이나 사업명을 기준으로 이름 매칭해 이어 쓴다.
limits: 표준 행정코드나 시설 식별자 같은 조인 키가 없어 다른 데이터와 자동 연결이 어렵고, 이름 매칭에 의존해야 한다. 좌표 등 공간 정보가 없는 비공간 데이터라 지도 위 위치 분석에는 바로 쓰지 못한다.
