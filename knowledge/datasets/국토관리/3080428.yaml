summary_user: 군산시에 있는 제과점 영업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 업종명·상호·도로명 주소·지번 주소를 담는다(포털 설명 기준 87건, CSV). 창업 예정자나 상권 분석가가 군산시 안에서 제과점이 어느 동네에 몰려 있는지 확인할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소 문자열이나 상호명을 맞춰 연결해야 한다.
description_portal: 이 데이터는 전북특별자치도 군산시에 소재한 제과점 영업소 현황을 수록한 공공데이터로, 식품접객업소 중 제과점 업소의 상호명, 도로명 주소, 지번 주소 등의 정보를 포함하고 있습니다. 이를 통해 군산시 내 제과점 분포 현황을 파악하거나, 상권 분석, 창업 입지 조사, 정책 수립 등에 활용할 수 있습니다. 데이터는 총 87건으로 구성되어 있으며, CSV 형식으로 제공되며 누구나 자유롭게 다운로드 및 활용이 가능합니다. 최신 등록일은 2025년 5월 23일입니다. 또한 위치 기반 서비스, 내비게이션 데이터 구축 등 다양한 산업에서 활용될 수 있습니다.
