summary_user: 전국 공시대상 공동주택의 단지 기본정보(주소·도로명주소·동수·세대수·사용승인일), 단지별 동 정보(동명·지상층수), 단지명 변경 이력(이전·현재 단지명과 변경연도)을 단지 단위로 담는 API입니다. 분석가나 사업자가 실거래·공시가격 자료의 단지명이 어느 공동주택 단지에 해당하는지, 이름이 바뀐 단지의 예전 명칭이 무엇인지 확인하는 데 쓴다. 필지 고유번호(PNU)로 토지·건축물 자료와 잇고, 단지 식별번호(COMPLEX_PK)로 기본·동·이력 정보를 서로 연결하며, K-apt 단지코드 체계로 실거래 단지명·공시 동호·청약 단지를 잇는 매핑 마스터 역할을 한다.
description_portal: 한국부동산원(구.한국감정원)에서 제공하는 공동주택 단지 식별정보 조회 서비스로 공동주택 단지 기본정보, 동정보, 단지명 이력정보 데이터를 제공합니다.※ 해당년도 데이터는 전년도 사용승인된 공시대상 공동주택 기준(ex. 24년 제공 데이터는 23년 사용승인된 공시대상 공동주택 기준)※ 관련 기술문서는 아래 URL을 통해 확인하시기 바랍니다.https://www.reb.or.kr/reb/na/ntt/selectNttInfo.do?mi=10251&bbsId=1268&nttSn=82063
