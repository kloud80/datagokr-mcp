summary_user: 경기도 광주시 지구단위계획의 획지선 현황을 획지 한 건씩 담은 파일 데이터로, 획지별 관리번호(현황도형 관리번호)와 개발규모, 건축물 밀도, 도형 생성일시, 시군구 정보를 시군구 범위로 담는다. 부동산 개발 분석가나 사업자가 광주시 특정 획지에 어느 정도 규모와 밀도로 건축이 계획돼 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드나 시군구 이름으로만 이어 쓰며, 같은 지구단위계획 구역·결정조서 데이터와 연결할 때도 이 방식에 그친다.
description_portal: 본 데이터는 경기도 광주시의 도시계획정보 중 획지선 현황 정보를 제공합니다. 토지를 일정한 단위로 구획하는 획지선의 정보와 각 획지별 건축 계획 내용을 담고 있어 도시 개발 현황을 파악할 수 있습니다. 현황도형 관리번호는 각 획지를 고유하게 식별하며, 건축물의 용도는 주거용, 상업용, 공공시설 등 토지 사용 목적을 나타냅니다. 개발규모는 건축 예정 또는 기존 건축물의 규모를 표시하고, 건축물의 밀도는 용적율, 건폐율 등 토지 이용 강도를 나타냅니다. 본 데이터는 도시 개발 계획, 토지 이용 계획, 획지 단위 관리, 건축 가능 범위 확인, 부동산 개발 분석 등에 활용됩니다.
