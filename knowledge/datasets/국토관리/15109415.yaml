summary_user: 서울특별시 용산구 관내 가로수를 한 그루씩 담은 건별 원천 파일로, 수목명·식재일 같은 기본 정보와 도로명·도로폭·보도폭 등 도로 정보, 주소와 위경도 좌표, 흉고직경·근원직경·수령 같은 생육 정보, 보호틀 파손·뿌리 융기 여부 같은 상태 정보를 담는다. 구청 담당자나 연구자가 '보호틀이 파손됐거나 뿌리가 솟은 가로수가 어느 도로·행정동에 몰려 있는가', '미세먼지·열섬 취약 지역에 가로수가 부족한가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소·지번주소·행정동 이름이나 수목 위경도 좌표를 매핑해 공간적으로 이어 쓴다.
description_portal: '"서울특별시 용산구 관내에 식재된 가로수의 수목에 대한 기본, 도로, 위치, 생육, 상태, 이미지 정보등을  파일로 제공가로수정보 데이터로 관리번호, 수목명, 수목구분, 수목유형, 식재일, 관리기관전화번호, 관리기관명, 도로명, 도로종류, 도로시작점, 도로종료점, 수목위치, 도로명주소, 지번주소, 행정동, 수고, 수관폭, 흉고직경, 근원직경, 식재간격, 도로폭, 보도폭, 보호덮개, 보호틀, 지장물여부, 데이타기준일자, 수목전경사진명, 보호덮개사진명 등의 항목으로 구성되어 있습니다.<데이터 활용성>1. 도시 환경 및 미세먼지 저감 관리:가로수 수종, 수량, 위치 데이터를 분석하여 미세먼지 저감, 대기 질 개선 효과를 과학적으로 평가,미세먼지 취약 지역을 대상으로 가로수 식재 최적화 등 가로수 기본계획 수립 활용2. 열섬 현상 완화 및 기후 대응:가로수의 일사 차단 효과, 그늘 면적 데이터를 통해 도시 열섬 현상 완화 전략 수립, 수목 성장 데이터 기반으로 도시 기후 레질리언스(회복력) 설계 가능3. 교통 및 보행환경 개선: 가로수와 도로, 보도 간의 간섭 정보 제공으로 안전한 보행로 및 자전거 도로 설계에 활용 등4. 가로수는 도시 미관을 개선하고, 미세먼지 저감, 열섬현상 완화, 소음 차단, 그늘 제공 등 다양한 공익적 기능을 수행하는 중요한 녹지자원입니다. 해당 공공데이터를 활용하면 지자체는 효율적인 가로수 관리 및 유지보수 계획을 수립할 수 있고, 연구자들은 도시 녹지 분포 분석, 기후환경 개선 효과, 생태계 서비스 평가등에 활용할 수 있습니다. 또한 시민들은 생활 주변의 가로수 현황을 쉽게 파악하여 환경 교육이나 도시 생태 체험 자료로 활용할 수 있습니다. 결국 가로수 현황 공공데이터는 건강한 도시 생태계 조성과 쾌적한 생활환경 제공을 위한 핵심 기반 자료라 할 수 있습니다.'
