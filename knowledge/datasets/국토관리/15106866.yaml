summary_user: 전국 공동주택의 동(棟) 단위 식별정보를 담은 파일 데이터로, 단지고유번호와 공시가격·건축물대장·도로명주소 기준 동명, 지상층수를 행으로 두며 467,644행 전체를 받아 확인했다. 분석가나 사업자가 공시가격 기준 동이 건축물대장의 어느 동에 해당하는지, 해당 동이 몇 층인지 같은 질문에 쓴다. 단지고유번호(reb_complex_id)와 도로명주소(address)가 조인 키라서 실거래 단지명·공시 동호·청약 단지를 잇는 매핑 자료와 연결해 쓴다.
limits: 해당 연도 데이터는 전년도 사용승인된 공시대상 공동주택 기준이라 최신 사용승인 단지는 빠질 수 있다. 공시가격 DB와 건축물대장 등 다른 DB의 기준시점이 달라 매칭되지 않거나 동명이 기재되지 않으면 일부 컬럼이 공란이다.
