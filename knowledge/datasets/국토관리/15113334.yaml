summary_user: 서울 금천구 안 어린이공원을 공원 하나당 한 행으로 담은 현황 파일이다. 행마다 공원 명칭, 주소, 면적, 시설, 개원일, 재정비 연도가 들어 있다. 구민은 집 근처에서 최근 재정비한 넓은 어린이공원을 고를 때 쓰고, 구청이나 분석가는 조성한 지 오래돼 리모델링 우선순위가 높은 공원을 가려낼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 공원 명칭이나 주소를 맞춰 붙이거나, 같은 금천구가 낸 다른 데이터와 묶어 써야 한다.
limits: 금천구 한 개 구만 다루므로 다른 자치구나 서울 전체와 비교하려면 다른 기관의 파일을 따로 모아야 한다. 공원 코드 같은 공통 식별자가 없어 다른 데이터와 붙일 때 명칭·주소 표기가 조금만 달라도 제대로 이어지지 않을 수 있다.
