summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 도로 현황 도형을 건별로 담은 파일(csv, 약 14KB)로, 도형마다 공간정보 관리번호, 현황도형 관리번호, 경계 좌표(X·Y 최소·최대값), 그 도형이 도로의 기점·종점인지 나타내는 구분을 담는다. 진안군 도시계획 도로의 시작점과 끝점이 어디에 있는지 위치를 확인하려는 도시계획 분석가나 개발 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 진안군 UPIS 자료와는 공간정보관리번호·현황도형 관리번호 같은 이름 매핑이나 좌표 범위로만 이어 쓴다.
