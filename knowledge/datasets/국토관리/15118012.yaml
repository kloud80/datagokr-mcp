description_portal: 이 데이터는 한국수자원공사가 관리하는 국가상수도 취수시설의 운영 현황을 제공한다. 본 데이터에는 수도사업자가 보유한 취수장의 수, 설계용량, 실제 취수량(연간/일평균/일최대), 공급량, 펌프 대수, 전력 사용량, 이용률 및 가동률 등의 세부 항목이 포함되어 있다. 이를 통해 국가 단위 상수도 시스템 내 취수 단계의 운영 효율성과 용수공급 안정성 등을 진단할 수 있다. 정책 수립, 연구, 시설 계획 등 다양한 목적의 수자원 관련 업무에 활용이 가능하며, 각 항목은 수치 기반으로 정량화되어 있어 비교 및 분석이 용이하다. 또한 데이터는 행정기관, 연구기관, 민간기업 등에서 용도에 따라 다양한 방식으로 가공·활용될 수 있다.
