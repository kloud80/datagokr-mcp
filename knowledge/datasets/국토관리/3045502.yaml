summary_user: 인천광역시에 등록된 분뇨 수집·운반업체를 업체 한 곳당 한 행으로 관할 지역, 업체명, 대표자만 담은 목록 파일이다(포털 설명상 63개 업체). 인천 시민이나 건물 관리자가 "우리 구에서 정화조·분뇨 수거를 맡길 수 있는 허가 업체가 어디인가"를 확인할 때, 분석가가 구별 업체 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역(구) 이름이나 업체명을 문자열로 맞춰서만 이어 쓸 수 있다.
description_portal: 하수도법 제45조에 따른 인천광역시 분뇨수집,운반업체 63개에 대한 일반현황(관할 구, 업체명, 대표자) 정보를 제공합니다.인천광역시가 제공하는 분뇨 수집·운반 업체 현황 공공데이터는 시 내에서 분뇨 수집 및 운반업을 등록하고 운영 중인 업체의 상세 정보를 집계한 목록 자료입니다. 이 데이터는 지역의 공중 위생 관리, 분뇨 처리 서비스의 지역별 분포, 환경 정비 및 폐기물 처리 정책 수립의 기초 자료로 활용됩니다.해당 데이터는 공공데이터포털에서 확인할 수 있으며, CSV파일로 제공하고 있습니다.
