summary_user: 인천광역시 서구(서해구) 안에서 착공된 건축물을 한 건씩 담은 파일로, 대지위치·주용도·부속용도·설계사무소명·시공자사무소명과 데이터기준일자가 들어 있다. 지역 분석가나 건축 관련 사업자가 "최근 서구 어느 동네에서 어떤 용도의 건물 공사가 시작됐나"를 보고 개발 흐름을 앞서 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치(주소) 문자열 매칭이나 같은 기관의 건축허가·사용승인 현황과 이름으로 맞춰 이어 쓴다.
limits: 건축물대장번호나 지번코드 같은 공통 키가 없어 다른 건축·토지 데이터와 정확히 1:1로 연결하기 어렵고, 주소 문자열 매칭에 기대야 한다. 범위가 인천 서구 한 시군구로 한정된다.
