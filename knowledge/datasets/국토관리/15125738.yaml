summary_user: 서울시 양서파충류 개별 종의 분포 지점을 담은 공간정보로, 종명·과명·조사지역·조사연도·보호종 여부 등 속성과 좌표(EPSG:5174)를 함께 담는다. 서울 안에서 특정 양서파충류 종이 어느 자치구·지역에서 조사됐는지 확인하려는 생태 분석가나 개발사업 환경검토 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 자치구명(ATNM_DSTC_NM)이나 종명 같은 이름 매핑, 또는 좌표 기반 공간 중첩으로만 다른 데이터와 잇는다.
description_portal: 서울시 양서파충류개별종분포 공간정보 입니다.[좌표계] EPSG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
