summary_user: 순천시 도시재생 활성화 구역 안 주차장을 한 곳씩 담은 파일로, 주차장 이름·연락처, 도로명·지번 주소와 위경도, 부제 시행 여부, 평일·토요일·공휴일 개방 여부와 운영 시작·종료 시간을 담는다(CSV 약 11KB). 주민이나 방문객이 원도심 재생구역에서 주말이나 공휴일에 열려 있는 주차장이 어디인지 확인하거나, 분석가가 재생구역 주차 공급의 분포와 운영시간을 파악하는 데 쓴다. 전역 조인 키는 없으므로 주소(시군구·법정읍면동명)나 위경도 좌표를 기준으로 다른 주차장 정보, 도시재생 구역 경계 데이터와 공간적으로 맞춰 이어 쓴다.
limits: 실측 컬럼에는 주차장 코드 같은 공통 식별자가 없어서 다른 데이터와는 이름·주소·좌표 매칭으로만 연결된다. 포털 설명에는 요금·할인·주차면수가 들어 있다고 되어 있지만, 받은 파일의 필드는 위치와 개방·운영시간 중심이다. 범위는 순천시 한 곳뿐이다.
