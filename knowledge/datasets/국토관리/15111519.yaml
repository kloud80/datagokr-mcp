description_portal: 전라남도 순천시 도시재생 활성화 구역의 주차 데이터는 도시 내 주차 공간의 효율적인 운영과 주민 편의 증진을 목적으로 수집·제공되는 공공데이터입니다. 이 데이터는 크게 네 가지 유형으로 나뉘며, 각각 주차장 위치 및 규모, 운영 방식, 요금 체계, 할인 정책 정보를 담고 있습니다. 첫째, ‘전용 주차구획 데이터’는 도시재생 구역 내 설치된 주차장의 명칭, 주소, 총 주차면수 등을 포함하며, 총 40개소 이상의 정보가 수록되어 있습니다. 둘째, ‘주차 운영 정보 데이터’는 각 주차장의 운영 시간, 기본 시간 단위, 결제 방식, 휴무일 등의 세부 사항을 나타내며, 이용자의 접근성과 편의성을 분석하는 데 유용합니다. 셋째, ‘요금제 데이터’는 시간당 이용요금, 일 최대요금, 정기권 정보 등을 포함하고, 마지막으로 ‘할인 정책 데이터’는 장애인, 경차, 다자녀 가구 등에 적용되는 할인 기준과 비율을 제공합니다. 이 모든 정보는 CSV 및 API(JSON, XML) 형식으로 제공되며, 도시계획, 교통정책, 민간 서비스 개발 등 다양한 분야에서 활용 가능합니다. 특히, 도시재생 사업의 일환으로 주차난 해소와 지역 접근성 개선을 위한 기초자료로 중요하게 쓰이고 있습니다.
