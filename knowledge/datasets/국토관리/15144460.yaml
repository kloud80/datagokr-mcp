description_portal: 1. 신혼·신생아 매입임대는 2020년 2월 21일 최초 입주자 모집공고가 시행된 이후, 빠른 주택의 공급을 위해 2021년 9월 30일 입주대기자 모집공고로 모집방식을 변경하였습니다.  - 더이상 입주자 모집방식으로 공급하지 않아 입주대기자로 변경된 이후의 자료만을 제공합니다.2. 입주대기자 방식이란 신청당시 주택을 특정하지 않고, 입주대기자를 선정하여 순번대로 공급가능 공가를 공급하는 형태입니다.  - 신청당시 입주예정 주택의 자치구, 주택형을 선택하지 않으므로 따로 자료를 가지고 있지 않습니다.  - 신청자의 주소지, 성별은 신청결과에 영향을 미치는 요소가 아닙니다.  - 입주자 방식의 당첨자 커트라인 신청순위, 커트라인, 가점총점, 예비자 커트라인 신청순위, 예비자 커트라인, 가점총점 대신 입주대기자 방식에 적합한 서류심사 커트라인, 입주대기자 커트라인으로 정정하여 제공합니다.3. 2024년 2차 공고까지 신혼·신생아 매입임대는 모집인원 대비 신청이 저조하여 서류심사 대상자의 커트라인이 입주대기자 커트라인과 일치합니다.  - 서류심사 커트라인이 없는 경우 신청자 중 서류결격자, 심사포기자 등을 제외하고 신청인 전원이 서류심사 대상자가 되었음을 의미합니다.  - 2023년 2차 신혼부부 Ⅰ,Ⅱ / 2024년 1차 신혼·신생아 Ⅰ,Ⅱ 공고의 경우 서류심사 커트라인이 존재하고 이는 입주대기자 커트라인과 동일합니다.  - 2025년 1차 신혼·신생아 Ⅰ,Ⅱ 공고의 경우 현재 심사 진행 중으로 입주대기자 커트라인은 확인 불가합니다.
