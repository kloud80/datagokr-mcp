description_portal: '전국 537개 취수장에 대한 아래의 정보를 제공합니다.(기준일 : 2025.8.1)본 데이터는 한국수자원공사에서 관리하는 전국 취수장 시설의 주요 정보를 제공합니다. 각 시설에 대해 명칭, 소재지, 운영기관, 수원유형, 시설용량, 취수방식, 용도 등의 항목으로 구성되어 있으며, 상수도 취수시설의 운영현황을 파악하는 데 활용됩니다. 해당 정보는 수원 관리, 취수시설 설계, 물 수급계획 수립 등에 필요한 기초자료로 활용 가능하며, 지역별 물이용 현황 분석 및 환경영향 검토에도 유용합니다. 공공기관, 지자체, 연구기관 등에서 수자원 정책 수립이나 연구를 위한 참고자료로 활용할 수 있습니다.'
