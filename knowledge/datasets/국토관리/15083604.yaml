summary_user: 한국토지주택공사가 관리하는 3기 신도시 인천계양 공공주택지구(계양구 귤현·동양·박촌·병방·상야동 일원, 주택 1.7만호·4.1만명 수용 계획)의 토지이용계획도를 단독주택·공동주택·근린생활시설 등 용도별로 담은 파일(json, 약 68KB)이다. 청약 수요자나 사업자가 계양지구 안에서 공동주택·단독주택·상업 용지가 어디에 배치되는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지구명·동 이름 같은 이름 매핑이나 같은 기관(LH)의 다른 지구 토지이용계획도와 나란히 놓는 방식으로만 잇는다.
description_portal: 한국토지주택공사에서 관리중인 3기신도시 토지이용계획도로, 인천계양 지구의 단독주택, 공동주택, 근린생활시설등 부분별 이용계획도를 제공합니다. 인천 계양구 귤현동, 동양동, 박촌동, 병방동, 상야동 일원을 기준으로 1.7만호의 주택공급, 4.1만명을 수용할 수 있는 공공주택지구입니다. 19년 사업 지정돼 26년 사업준공 예정이며 인천 도시철도 1호선, 공항철도 및 수도권제1순환고속도로와 인접하여 광역교통여건이 우수합니다. 토지이용계획도를 통해 계양지구 위치에 대한 자세한 정보를 얻을 수 있습니다.
