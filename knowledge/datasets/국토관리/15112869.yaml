summary_user: 서울 성북구 안의 공공건축물을 시설 한 곳당 한 행으로 정리한 파일로, 시설 구분(경로당·어린이집·공영주차장 등), 시설명, 행정동, 도로명주소, 연면적을 담는다. 성북구 주민이나 분석가가 "우리 행정동에 경로당·어린이집 같은 생활SOC 시설이 몇 곳이고 면적은 얼마인가"를 따져볼 때 쓴다. 전역 조인 키가 없으므로 도로명주소나 행정동 이름을 매개로 건축물대장·주소 데이터나 다른 생활SOC 현황과 이어 쓴다.
limits: 건축물관리번호 같은 전역 조인 키가 없어 다른 데이터와는 주소·행정동 이름 매칭으로만 연결된다. 범위는 성북구 한 곳이며, 포털 설명상 2023년 3월 21일 기준의 시점 자료다.
