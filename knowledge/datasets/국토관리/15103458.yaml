summary_user: 대전도시공사가 분양한 공공주택을 사업 단위로 정리한 파일로, 사업명·진행현황·공사위치·분양타입·동·세대수·층수·분양공고일과 사업별 상세 웹페이지 주소를 담는다(CSV 약 1.4KB의 소규모 목록). 대전 지역 공공분양 청약을 준비하는 시민이 '도시공사가 공급한 단지가 어디에 있고 몇 세대이며 언제 공고됐는지'를 확인하거나, 분석가가 지역 공공주택 공급 이력을 정리할 때 쓴다. 전역 조인 키가 없어 다른 청약·분양 데이터(마이홈, LH 공고 등)와는 사업명이나 공사위치 주소를 이름 매칭해 이어 써야 한다.
description_portal: 대전도시공사에서 분양한 공공주택 현황자료로  공공주택별 진행현황, 위치, 세대 수와 각 사업 상세자료를 확인할 수 있는 웹페이지 주소 정보를 제공합니다.대전도시공사는 "시민중심의 주거안정 기반 강화"를 전략목표로 수립하고, "맞춤형 주거정책 및 공급추진", "고품질 주거서비스 제공을 통한 주거복지 실현", "입주민 지원서비스 확대"와 같은 전략과제를 선정하였다. 주택분양의 자세한 사항은 홈페이지(https://www.dcco.kr/web/apply/list.do?mId=39)를 참고하시기 바랍니다.대전도시공사 위치는 주소(대전광역시 중구 중앙로118(대흥동))와 지도(https://naver.me/xg7vx2WT)를 참고하시기 바랍니다.
