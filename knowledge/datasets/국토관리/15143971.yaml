summary_user: 한국산업기술시험원이 2024년 8~9월 식물공장(컨테이너 2개 동)에서 측정한 온실 인입 3상 전류 중 R상 전류를 측정일시별로 담은 원천 계측 파일(CSV 약 45.8MB)로, 동별 메인값과 에어컨·공조기·양액기·조명·LED 등 설비별 값이 열로 나뉘어 있다. 스마트팜 에너지 분석가가 '컨테이너 온실에서 어떤 설비가 언제 전류를 많이 쓰고, 대기전력이나 부하 불균형 구간은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호·공장관리번호·PNU 같은 전역 조인 키가 없어 공장등록 원부 등과 직접 연결되지 않으며, 같은 기관이 공개한 다른 상(S·T상) 전류 파일과 측정일 기준으로 맞춰 쓰는 정도다.
description_portal: 한국산업기술시험원이 2024년 8월부터 9월까지 식물공장에서 수집한 온실 전체 인입 3상 전류 데이터 중 R상 전류에 대한 정보입니다. R상 전류는 3상 전력 시스템 중 R상에서 흐르는 전류 값을 의미하며, 이는 전력 부하의 실시간 변화 및 설비 운전 상태를 판단하는 데 중요한 지표로 활용됩니다. 본 데이터는 식물공장 내 스마트 온실 환경의 에너지 소비 패턴 분석, 비효율적인 전력 사용 구간 식별, 대기전력 모델링 및 절감 기술 개발 등 다양한 목적에 사용될 수 있습니다. 특히 전기 요금 절감을 위한 대기전력 차단 알고리즘 설계, 부하 불균형 진단, 예지보전 기반의 스마트 유지관리 기술 개발 등에도 유용하게 활용될 수 있으며, 향후 스마트팜 설비의 지능형 에너지 관리 시스템 구축을 위한 기초 자료로서 높은 활용 가치를 지닙니다. 본 데이터는 식물공장의 에너지 효율 향상과 지속 가능한 농업 환경 조성에 기여할 수 있는 핵심 공공데이터입니다.
