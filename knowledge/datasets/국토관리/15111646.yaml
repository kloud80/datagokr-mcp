summary_user: 충청남도 아산시 안의 공공주택을 단지 한 곳당 한 행으로 정리한 현황 파일로, 단지명·도로명주소·세대수·층수·동수·준공연도를 담는다(CSV 약 1.5KB의 소규모 목록). 아산시에서 영구임대·국민임대 같은 공공주택이 어디에 몇 세대 규모로 있고 언제 준공됐는지 알아보려는 주민이나 지역 주택공급 분석가가 쓴다. 전역 조인 키나 코드는 없어서, 도로명주소를 주소 매칭하거나 단지명을 기준으로 다른 주택·공동주택 자료와 이어 쓴다.
description_portal: '정의: 정부나 지방자치단체, 공공기관(예: LH, SH 등)이 서민 및 중산층 주거안정을 목적으로 공급하는 주택종류: 영구임대, 국민임대, 공공분양 등시공절차:1. 사업계획 수립 및 공공주택사업자 지정2. 지구지정 및 개발계획 수립 (환경/교통 영향 검토)3. 실시계획 인가 → 토지보상4. 설계 및 인허가 → 착공5. 준공 → 입주자 모집 및 입주본 데이터는 충청남도 아산시 공공주택 현황 자료를 제공합니다.( 공공주택명, 도로명주소, 세대수, 층수, 동수, 준공연도, 데이터기준일)'
