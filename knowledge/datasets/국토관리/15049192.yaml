summary_user: 제주시 관내 도시정비 관련 사업을 사업명 단위로 한 줄씩 담은 소규모 파일(csv 약 9.8KB)이다. 각 행에는 사업량(길이·폭, m), 총사업비·기투자액·2024·2025년·향후 투자액(백만원), 현재 추진 실적이 들어 있다. 시민이나 분석가가 제주시의 특정 정비사업이 총사업비 대비 얼마나 집행됐고 어느 단계까지 진행됐는지 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업명이나 위치 이름을 맞추는 방식으로만 이어 쓴다.
limits: 포털 설명에는 단지명·세대가 있다고 되어 있지만, 실제 필드는 사업량(m)과 연도별 사업비 중심이다. 따라서 재개발·재건축 단지별 세대 수나 조합 단계를 비교하는 용도로는 맞지 않을 수 있다. 범위는 제주시 한 곳이고 코드 기반 조인 키가 없으며, 명세상 갱신은 연간 또는 이벤트 시점이다.
