summary_user: 국토계획법상 용도지역·용도지구·용도구역(도시지역, 관리지역, 개발제한구역 등)의 구역 정보를 전국 범위로 제공하는 vworld 기반 RestAPI이며, 필드에는 구역명(uname), 시도명(sido_name), 시군구명(sigg_name) 등이 있다. 사업자나 개인이 특정 지역이 어떤 용도지역·지구·구역으로 묶여 토지이용 규제를 받는지 확인하는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 같은 기관 코드로 연결해 쓰며, 국토계획법의 용도지역·지구·구역 규정과 함께 해석한다.
