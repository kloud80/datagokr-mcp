description_portal: '경기도 평택시 도시계획정보시스템(UPIS) DB의 취락지구현황으로 현황도형 관리번호, 도형 조서관리 코드, 결정고시관리코드, 라벨명, 면적_도형, 길이_도형 등의 항목을 제공합니다.취락지구는 도시 지역 외의 지역, 즉 녹지지역, 관리지역, 농림지역, 자연환경보전지역 안의 취락을 정비하기 위해 필요한 지구를 말합니다. 취락지구는 개발제한구역 내 취락을 정비하기 위한 집단취락지구와 그 외 지역의 취락을 정비하기 위한 자연취락지구로 나뉩니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※문의 : 평택시 도시계획과(031-8024-3923)'
