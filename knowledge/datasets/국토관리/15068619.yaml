summary_user: 주택관리공단이 관리하는 전국 임대단지를 단지·평형(단위평형코드) 단위로 나눠, 평형별 세대수와 공급유형(영구임대·국민임대·행복주택 등), 임대조건 적용유형, 전용·주거공용·기타공용·주차장·공유대지 면적, 방 개수를 담은 파일(CSV, 약 136KB)이다. 공공임대 입주를 알아보는 사람이나 주거복지 분석가가 "어느 지사 관할 단지에 전용 몇 ㎡, 방 몇 개짜리 국민임대 세대가 얼마나 있나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 임대주택·전월세 데이터와는 단지명·지사명 같은 이름 매칭이나 같은 기관의 코드로만 잇는다.
description_portal: 주택관리공단 평형별 임대단지 관리현황에 대한 데이터로 평형별 세대수, 임대조건 적용유형, 전용면적 등의 항목을 제공합니다. (지사명, 단지명, 공급유형, 단위평형코드, 형별세대수, 전용·주거공용·기타공용·주차장·공유대지 면적, 방 개수 등)[데이터 설명]- 단지별로 세대가 어떤 평형(전용면적 기준)으로 구성되어 있는지와 각 평형별 세대 수를 확인할 수 있음- 전용면적, 주거공용면적, 기타공용면적, 주차장면적, 공유대지면적 등 면적 단위별 지표 제공- 공급유형(영구임대, 국민임대, 행복주택 등)과 단위평형코드, 임대조건 적용 유형 등의 항목 포함- 방 개수까지 기록되어 있어 단지별 주거 구조와 특성을 세부적으로 분석 가능[활용분야]- 평형별 임대주택 수급 현황 분석- 단지별 주거 면적 구조 및 주차시설 확보 현황 비교- 공급유형에 따른 세대 구성 및 면적 분포 분석- 주거복지 정책 수립, 주택시장 연구, 시설 관리 및 운영 기준 마련의 기초자료로 활용 가능
