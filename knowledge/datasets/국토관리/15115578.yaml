summary_user: 서울특별시 중랑구에서 자동차 배출가스 관련 부품 정비·점검과 소음 확인검사를 대행하는 업소의 인허가 정보를 업소 한 곳당 한 행씩 담고, 인허가일자·영업상태·폐업일자·주소·사업장명·좌표(XCRD/YCRD)가 들어 있습니다. 차량 소유자가 중랑구에서 지금 영업 중인 배출가스 전문정비업소를 찾거나, 분석가가 업소의 개업·폐업 추이를 살피는 데 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰고, 좌표는 중부원점TM(EPSG:5174) 기준이라 지도 데이터와 겹칠 때는 좌표 변환이 필요합니다.
description_portal: '서울특별시 중랑구의 자동차의 배출가스와 관련된 부품 등의 정비ㆍ점검 및 자동차 소음관련 확인검사 업무를 하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
