summary_user: 경기도 안에서 체결된 아파트 분양권 실거래를 계약 건별로 담으며, 시군구·읍면동, 번지·도로명, 단지명, 전용면적, 층, 계약일, 거래금액, 거래구분, 해제 여부와 사유, 중개 구분, 매도·매수 주체 정보가 들어 있다. 분양권을 사려는 사람이나 분석가가 특정 단지의 준공 전 분양권 가격이 면적·층별로 어떻게 움직였는지, 계약 해제가 얼마나 났는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 시군구·읍면동 코드, 단지명·분양권단지코드, 아파트코드 같은 같은 기관 코드나 이름 매핑으로 다른 실거래·단지 자료와 잇는다.
description_portal: '이 데이터는 경기도 내에서 체결된 아파트 분양권 실거래 내역을 제공하며, 준공 전 분양권 거래의 실제 계약 정보를 확인할 수 있습니다. 주요 항목에는 시군구코드, 접수년도, 접수번호, 물건시퀀스번호, 상세물건번호, 분양권단지코드, 읍면동코드, 시군구명, 읍면동리명, 번지·도로명 정보, 계약일, 단지명, 전용면적, 층수, 거래금액, 거래구분(예: 준공전 분양권), 아파트코드 등이 포함됩니다. 이를 통해 특정 단지별 분양권 거래 가격 변동을 추적하거나, 계약 해제 발생 현황, 전용면적·층수별 거래금액 차이, 개인·법인 간 거래 특성 등을 분석할 수 있습니다.'
