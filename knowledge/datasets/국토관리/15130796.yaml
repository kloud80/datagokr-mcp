summary_user: 경기도부동산포털이 보유한 주택 전월세 계약을 건별로 담은 원천 자료로, 시군구·읍면동·도로명주소, 주택유형, 전세/월세 구분, 계약일, 전용면적, 층, 보증금·월세, 종전 보증금·월세, 계약기간, 갱신·신규 여부, 확정일자 관련 코드를 제공한다. 분석가나 세입자가 '우리 동네 아파트 전세 보증금 수준은 얼마이고 갱신 계약에서 보증금이 얼마나 올랐나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 국토교통부 전월세 실거래 등 다른 데이터와는 시군구 코드·읍면동명·도로명주소·단지명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 해당 데이터는 경기도부동산포털이 보유한 주택 전월세 계약 건별 자료로, 시군구·읍면동·도로명주소 등 위치 정보와 함께 주택유형(아파트, 연립/다세대, 단독/다가구), 거래구분(전세/월세), 계약일, 전용면적, 층수, 보증금과 월세금액, 건축년도, 계약기간, 갱신·신규 여부, 확정일자 관련 코드 등의 항목을 제공합니다. 이를 통해 지역·유형별 임대차 시세 수준을 비교하거나 전세와 월세 추이, 갱신 계약과 신규 계약 비율 등을 분석할 수 있으며, 부동산 시장 동향 파악과 주거정책 수립, 민간 시세 서비스 등에 활용할 수 있습니다.
