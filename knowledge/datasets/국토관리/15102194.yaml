summary_user: 서울 서초구에 있는 오피스텔을 건물 한 동씩 담은 파일로, 건물명·대지위치 주소·주용도·기타용도·세대수·호수·사용승인일자를 담는다. 구청 주택·도시계획 담당자나 부동산 분석가가 서초구 안 어느 동에 오피스텔이 몰려 있고, 언제 승인된 건물이 몇 세대·몇 호 규모인지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 주소나 건물명을 맞춰 건축물대장·실거래가 같은 주소 기반 자료와 이어 쓴다.
limits: 서초구 한 구만 다루므로 다른 자치구나 서울 전체와 비교하는 데는 따로 자료가 필요하다. 코드형 조인 키가 없어 다른 데이터와는 주소·건물명 문자열을 맞춰야 연결된다. 포털 설명에 따르면 세대수·호수가 빈 칸인 건물이 있어 합계를 낼 때 주의한다.
