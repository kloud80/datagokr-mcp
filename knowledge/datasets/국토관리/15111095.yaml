description_portal: 본 데이터는 서울특별시 성동구에서 1988년부터 2002년까지의 건축인허가 이력을 체계적으로 수집·정리한 자료입니다. 오랜 기간 축적된 건축인허가 정보를 통하여 도시개발의 변화, 인구 및 산업 구조의 발전 사례, 생활환경의 변천사 등을 한눈에 파악할 수 있도록 하는 것이 주요 목적입니다. 데이터에는 건축 인허가가 이루어진 정확한 대지위치, 시군구코드, 법정동코드, 대지구분코드, 번, 지, 건물명, 지목코드 등 각 건축물의 행정정보와 식별 정보가 포함되어 있습니다. 이로써 해당 기간 동안 허가된 개별 건축물의 위치, 토지 이용 현황, 용도 및 구조 같은 주요 정보를 신뢰성 있게 확인할 수 있습니다. 성동구청 등 행정기관에서 기록 보전 및 관리 체계를 통해 데이터의 신뢰성과 완전성을 확보하였으며, 도시계획·행정자료 연구, 부동산 분석, 대규모 개발 이력 검토, G.I.S. 기반 상권·환경 분석 등 다양한 분야에서 실질적으로 활용됩니다. 데이터는 보존성 및 완전성을 중시하여 관리됩니다.
