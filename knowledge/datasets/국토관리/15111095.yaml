summary_user: 서울 성동구의 1988~2002년 건축인허가 이력을 인허가 건별로 담은 파일로, 대지위치·지번, 지목·용도지역, 대지·건축·연면적과 건폐율·용적률, 주용도, 세대수, 허가·착공·사용승인일을 포함한다. 도시계획 연구자나 부동산 분석가가 '1990년대 성동구의 어느 동에서 어떤 용도의 건물이 얼마나 허가·착공되었나'처럼 과거 개발 흐름을 살피는 데 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 통계·건축물대장 자료와 잇고, 시군구코드와 번·지를 조합해 필지 단위로 맞춰 본다.
limits: 범위가 성동구 한 시군구로 한정되어 다른 지역과 비교하려면 별도 자료가 필요하다. 포털 설명상 1988~2002년 이력만 담고 있어 이후 인허가 현황은 이 데이터로 확인할 수 없다. 이용할 때는 활용신청 없이 CSV 파일을 내려받으면 된다.
