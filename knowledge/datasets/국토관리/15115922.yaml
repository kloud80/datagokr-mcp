description_portal: 경기도 양주시_도시계획정보시스템(UPIS) 지구단위계획 결정조서 현황 데이터는 양주시에서 수립한 지구단위계획의 공간적·행정적 정보를 제공한다. 주요 항목으로는 도면번호, 위치명, 지역명, 면적(기정), 면적(변경전), 면적(변경후), 비고 등이 포함되어 있으며 총 402행의 데이터를 담고 있다. 이를 통해 각 지구단위계획 구역의 도면과 행정 구역 단위별 면적 변동 사항을 확인할 수 있다. 특히 면적은 기정값, 변경 전, 변경 후로 나누어 기록되어 있어, 도시개발·재개발 과정에서 발생하는 토지 이용 변화와 행정적 조치의 흐름을 추적할 수 있다. 예를 들어, 기존 면적과 변경된 면적의 차이를 통해 토지이용 효율성을 검토하거나, 특정 지역의 도시재생 추진 여부를 판단하는 데 중요한 참고 자료가 된다. 또한, 공간계획, 도시정비사업, 기반시설 확충 등 행정적 의사결정에 활용 가능하며, 향후 양주시의 균형발전 및 지속가능한 도시관리 전략 수립에 기초자료로서 기여할 수 있다.
