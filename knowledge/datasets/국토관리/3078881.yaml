summary_user: 고양시 공원 내 어린이놀이터의 모래 소독 현황을 놀이터·소독 건별로 담은 파일로, 공원명, 지번주소, 소독면적(제곱미터), 소독일자, 바닥재, 관리기관을 기록한다(포털 설명상 덕양구 50개소, 일산동구·서구 68개소). 주민이나 보호자가 '우리 동네 공원 놀이터 모래를 언제 마지막으로 소독했나'를 확인하는 데 쓴다. 전역 조인 키는 없고, 지번주소나 공원명으로 다른 공원·놀이시설 목록과 이름·주소 매칭하여 연결한다.
description_portal: '- 공개 목적: 경기도 고양시 공원 내 어린이 놀이터 모래 주기적인 소독 현황에 대한 데이터를 공개함으로써  주민의 알권리 충족과 어린이놀이터를 안전하게 이용할 권리 제공- 공개 대상 놀이터: 덕양구 관내 공원의 어린이놀이터 50개소, 일산동구 및 서구 관내 공원의 어린이놀이터 68개소- 공개 항목: 공원명, 소재지, 소독 면적, 소독 일자, 바닥재, 데이터 기준일, 관리기관명 - 공개 기관: 덕양공원관리과(덕양구 관내 공원의 어린이놀이터 50개소), 일산공원관리과(일산동구 및 서구 관내 공원의 어린이놀이터 68개소)'
