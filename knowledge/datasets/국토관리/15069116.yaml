summary_user: 부산 기장군 정관신도시에 있는 공동주택을 단지 1건당 1행으로 정리한 파일 목록입니다. 단지마다 아파트명, 지번주소(법정리), 준공일자, 세대수를 담고, 입주 중인지 착공했는지를 비고에 적으며, 아직 착공하지 않은 단지도 포함합니다. 정관신도시에 어떤 단지가 언제 준공했고 각각 몇 세대인지 확인하려는 주민, 부동산 사업자, 지역 분석가가 씁니다. 공통 조인 키는 없으므로, 다른 데이터와 합치려면 아파트명이나 지번주소를 기준으로 맞춰야 합니다.
description_portal: 부산광역시 기장군 정관읍에 있는 정관신도시 공동주택 현황에 대한 데이터로 아파트명, 주소, 준공일자, 세대수 등의 항목을 제공합니다. (아파트명, 주소, 준공일자, 세대수 등)* 2025년 말 기준으로 작성된 데이터입니다.* 연번은 준공일자 기준으로 작성되었습니다.* 아파트명은 영어 및 한자가 한글로 표기되어 있을 수도 있습니다.* 제공되는 아파트의 주소는 지번주소(법정리)입니다.* 비고항목에는 현재 입주사용중 및 착공 여부 기재되어 있습니다.* 미착공상태의 공동주택의 현황도 포함되어 있습니다.
