summary_user: 대지권이 설정된 토지 위 집합건물의 호수(buldHoNm)별로 동·층·호 정보와 대지권 비율(ldaQotaRate), 대지권 말소 여부 등을 담은 전국 범위 건별 조회 API다. 아파트·오피스텔 같은 구분건물의 특정 호실이 대지를 얼마만큼의 지분으로 갖는지 확인하려는 매수 예정자, 감정·등기 실무자, 부동산 분석가가 쓴다. 필지고유번호(pnu)를 키로 토지·지적, 공시지가, 건축물대장 등 같은 필지를 다루는 국토 정보 데이터와 이어 쓴다.
limits: 포털 활용신청과 별개로 브이월드(vworld.kr) 인증키를 따로 받아 호출 파라미터(key)로 넣어야 한다. 공간 좌표가 없는 비공간 데이터라 지도 표출에는 pnu로 다른 공간 데이터와 연결해야 한다.
