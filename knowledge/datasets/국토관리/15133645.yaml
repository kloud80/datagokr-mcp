summary_user: 경기주택도시공사가 관리하는 매입임대주택 자산별로 표준보증금·표준임대료와 산출비율, 이를 적용한 기본보증금·기본임대료를 담은 파일 데이터(CSV 약 38만 바이트)입니다. 경기도 매입임대주택 청약을 준비하는 사람이 "이 주택에 들어가려면 보증금과 월 임대료가 얼마인가"를 따져 자금계획을 세울 때 쓰고, 분석가는 표준 단가 대비 산정 비율을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 자산관리번호를 같은 기관의 다른 매입임대 데이터(주택 목록·공고)와 맞추는 방식으로만 이어 쓴다.
description_portal: 경기행복주택 및 국민임대주택의 공급안내 및 청약신청 접수를 위한 경기주택도시공사 주택청약센터의 메타데이터 기반 매입임대주택의 보증금 정보 데이터로써 자산관리번호, 표준보증금, 표준임대료, 산출비율, 기본보증금, 기본임대료 등의 정보를 포함하고 있습니다. 경기주택도시공사에서 관리하고 있는 자산에 대하여 표준보증금과 표준임대료 단가를 제공으로 산정기준에 따라 자산들의 기본보증금 및 기본 임대료를 제공하는 제공하여 계약투명성과 가격안정성을 확보하기 위한 기초자료로 활용될 수 있습니다. 청약을 준비하는 소비자들의 자금계획에도 유용할 것으로 생각됩니다.
