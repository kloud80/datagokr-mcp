summary_user: 서울특별시 성북구에서 2015년부터 2024년까지 처리된 건축허가·건축신고를 건물(인허가) 건별로 담은 CSV 파일로, 건축구분(신축·증축·대수선 등), 대지위치, 대지·건축·연면적, 건폐율·용적률, 허가일·착공일·사용승인일, 용도지역·지구·구역, 세대수·주차대수, 설계·감리·시공사명을 포함한다. 성북구에서 최근 어느 동네에 어떤 용도의 신축 허가와 착공이 늘었는지를 보려는 부동산 분석가나 도시계획 담당자가 지역 개발 흐름의 선행 지표로 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치(지번 주소)를 이름 매칭하거나 같은 기관(성북구) 단위로만 연결할 수 있다.
limits: 건축물대장 번호나 PNU 같은 공통 키가 없어 건축물대장·공시지가 등과 바로 결합되지 않고 주소 문자열 매칭이 필요하다. 범위는 성북구 한 개 시군구에 한정되므로 다른 자치구와 비교하려면 별도 자료가 필요하다.
