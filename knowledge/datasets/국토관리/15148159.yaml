description_portal: 한국농어촌공사 새만금유역내 새만금호에 대한 자동 수위계측정보로 10분단위, 최대, 최소, 평균값을 제공하고 있습니다.계측 기간은 "24년 8월 30일부터 25년 8월 29일을 기간으로 구성된 자료입니다.* 계측 장소 및 계측기기의 현장상황에 따라 오측값 또는 빈값이 있을수 있으니 참고바랍니다.파일내 항목별 코드설명은 "데이타항복 컬럼 설명"을 참고해 주시기 바랍니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않을수 있으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.수위계 측정방법은 레이더에 센서에서 발사된 신호가 측정물의 표면에서 반사되어 돌아오는 시간을 측정하여 센서와 측정물까지 거리를 표시하는 장치
