summary_user: 경기도 포천시 소규모수도시설별 수질검사 결과를 시설·채취일 단위로 담은 3KB 남짓의 작은 CSV 파일로, 수원·시설명·주소와 일반세균·총대장균군·질산성질소·탁도·우라늄 등 항목별 검사값, 검사기관을 기록한다. 포천시 주민이나 마을상수도 관리자가 "우리 마을 소규모수도시설 물이 최근 검사에서 대장균이나 질산성질소 기준에 문제가 없었나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소를 이름으로 맞추거나 같은 포천시 자료끼리만 이어 쓴다.
limits: 포천시 한 곳의 시군구 범위 자료라 다른 지역 소규모수도시설이나 정수장 단위 수질과는 바로 비교하지 못한다. 시설코드 같은 공통 키가 없어 다른 데이터와 연결할 때는 시설명·주소 문자열 매칭에 의존해야 한다.
