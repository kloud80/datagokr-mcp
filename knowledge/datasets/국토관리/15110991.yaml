summary_user: 청약홈에서 일반공급 접수를 대행한 일반분양 단지의 가점제 당첨자 점수를 모집공고 연월·17개 시도·신청거주구분(해당지역/기타경기/기타지역)별로 평균·중위·최고·최저 가점으로 집계한 파일(csv)입니다. 청약 대기자가 '우리 지역에서 해당지역 거주자로 당첨되려면 가점이 몇 점쯤 필요했나'를 가늠하거나, 분석가가 지역별 당첨 가점 추이를 비교하는 데 쓴다. 전역 조인 키는 없으며, 연월과 시도 이름을 맞춰 같은 기관의 청약 경쟁률·분양 공고 같은 다른 청약 통계와 이어 쓴다.
description_portal: 한국부동산원(구 한국감정원)의 청약홈에서 제공하는  가점제 당첨자의 점수 현황입니다.청약홈에서 일반공급 접수를 대행한 일반분양 단지를 기준으로 작성되었습니다.공공데이터 제공범위는 한국부동산원이 주택청약 업무를 수행한 2020년 2월부터 데이터 작성 기준 전월 말일까지로 모집공고일을 기준으로 집계하였습니다.* 컬럼별 상세설명- 연월→ 모집공고일이 속한 연월- 지역 → 전국 17개 시도 기준- 청약지역 → 신청거주구분(해당지역/기타경기/기타지역)- 평균 → 가점제 당첨자 평균가점- 중위수 → 가점제 당첨자 중위가점- 최고 → 가점제 당첨자 최고가점- 최저 → 가점제 당첨자 최저가점※ 매월 25일, 전월까지의 데이터를 제공하며 전월 데이터는 향후 변동될 수 있습니다.※ "23.1월의 경우 가점제 당첨자가 발생하지 않아 데이터를 제공하지 않습니다.
