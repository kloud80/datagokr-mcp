description_portal: '전라남도 진도군의 지구단위계획 결정조서 데이터는 진도군 내 특정 지역에 대해 수립된 지구단위계획에 관한 정보를 정리한 자료입니다.이 자료는 CSV 파일 형식으로 제공되며, 표 형식으로 구성되어 있어 데이터 분석이나 행정 활용에 적합합니다. 총 30건의 계획 데이터가 수록되어 있으며, 각각은 독립된 지구를 의미합니다.위치명: 계획이 적용되는 구체적인 지리적 위치 또는 행정 구역의 명칭 (예: ○○리, ○○면 등)지역명: 해당 지구가 속한 보다 큰 행정 구역이나 지구 단위의 명칭면적: 각 지구가 차지하는 면적 (㎡ 단위 등으로 표시)이 데이터는 주로 다음과 같은 목적으로 활용됩니다:도시계획 수립: 지역의 토지 이용, 기반 시설, 건축 규제 등을 체계적으로 설계할 때 사용지역 개발 분석: 진도군 내 개발 가능성, 인프라 확장, 환경 보전 등의 분석 자료로 활용'
