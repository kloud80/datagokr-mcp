summary_user: 대구광역시 서구청이 관리하는 옥외광고물을 건별로 담으며, 등록번호·허가/신고 구분과 일자·광고물 종류·업소명·표시 시작/종료 일자·수량·광고물 사업자명·표시 장소 도로명을 제공한다. 주민이나 광고 사업자, 분석가가 '서구 특정 도로에 설치된 광고물의 표시 기간이 언제 끝나는가' 같은 질문을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명(INDICT_PLACE_ROAD_NM)이나 업소명 같은 이름 매칭, 또는 같은 기관 코드로만 연결한다.
description_portal: 입력 파라미터를 이용하여 대구광역시 서구_옥외광고물 현황의 등록번호, 구분, 허가 신고 일자, 광고물 종류, 업소 명, 표시 시작 일자, 표시 종료 일자, 수량, 광고물 사업자 명, 표시 장소 도로 명 항목을 제공하는 서비스본 데이터는 대구광역시 서구청에서 관리하는 옥외광고물 현황을 수록한 자료이다. 옥외광고물의 구분, 허가 및 신고 일자, 광고물 종류, 설치된 업소명, 표시 시작 및 종료 일자, 수량, 광고물 사업자명과 표시 장소 도로명을 포함한다. 각 광고물에 관한 세부 정보를 통해 설치 시기와 기간, 사업자 현황 등을 파악할 수 있으며, 지역 내 옥외광고물의 합법적 관리와 점검에 활용된다. 본 자료는 옥외광고물 관련 행정업무 지원 및 시민의 정보 접근성 증진을 목적으로 개방한다.
