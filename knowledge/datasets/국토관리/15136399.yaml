summary_user: 경기도 부천시의 유동인구를 일자(exmn_ymd)·1시간 단위 시간대·내외국인 구분별로 나누고, 남녀 각각 0~9세부터 65~69세까지 5세 단위 연령대별 인원수를 담은 집계 통계다. 상권 분석가나 부천시 담당자가 '특정 날짜 저녁 시간대에 20대 여성 유동인구가 얼마나 되는가', '외국인 유동인구는 주간과 야간에 어떻게 달라지는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시군구코드·시군구명을 이름이나 코드로 직접 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 부천시의 유동인구를 시간대별, 성별, 연령대별로 구분하여 정리한 통계자료로, 내국인과 외국인의 유동 인구 특성을 함께 제공하고 있습니다. ‘시군구코드’와 ‘시군구명’을 통해 지역을 식별하며, ‘시간코드’는 하루 24시간을 1시간 단위로 구분하여 시간대별 인구 흐름을 나타냅니다. 인구는 성별 및 연령대별로 구분되어 있으며, ‘외국인구분’ 항목은 내국인과 외국인을 구분해 비교 분석이 가능하며, ‘연도_월_일’ 항목은 인구 수집 일자를 명시합니다. 이 데이터는 시간대별 유입 인구 흐름 분석, 상권 특성 진단, 외국인 밀집지역 식별, 야간·주간 인구 차이 분석 등을 통해 도시계획, 행정서비스 제공, 민간 마케팅 전략 수립 등에 활용 가능합니다.
