summary_user: 경기도 광주시 도시계획정보시스템에 등록된 광장·공원·녹지·유원지·공공공지 같은 공간시설을 도형 하나당 한 행으로 담은 파일(csv, 약 44KB)이다. 각 행에는 시설 명칭(라벨명), 부지 면적, 선형 시설의 길이, 시스템 등록 일시가 들어 있다. 광주시 안에 어떤 공원·녹지가 어디에 얼마나 있는지 확인하려는 주민, 또는 녹지 계획이나 공원 정책을 검토하는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군구코드나 시설 명칭을 맞춰서만 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 공간시설 현황 정보를 제공합니다. 광장, 공원, 녹지, 유원지, 공공공지 등 도시민의 휴식과 정서 함양을 위한 공간시설의 위치와 규모 정보를 담고 있습니다. 현황도형 관리번호는 각 시설을 고유하게 식별하며, 라벨명은 시설의 명칭을 나타냅니다. 면적은 시설이 차지하는 부지 면적을 제공하고, 길이는 선형 시설의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 공간시설 관리, 녹지 계획 수립, 도시 공원 정책, 주민 여가 공간 확보, 도시 환경 개선 등에 활용됩니다.
