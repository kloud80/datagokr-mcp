summary_user: 경기도 시군구별 가구 단위 인구이동을 기준년월(crtr_ym)마다 이동 구분(시군내이동·도내 타시군/타시도 전출입)별로 집계한 통계로, 전체·성별 이동 인구, 20~30대 여성 이동자 수, 전체·1인·2인 가구 수를 담는다. 시군 주거·복지 담당자나 연구자가 "우리 시로 전입하는 1인 가구와 청년 여성이 매달 얼마나 늘고 있는가"를 확인해 청년 주거정책이나 생활 SOC 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구 코드·이름(signgu_cd, signgu_nm)과 기준년월로 다른 시군구 단위 통계에 맞춰 붙여야 한다.
description_portal: '이 데이터는 경기도 각 시군구의 가구 단위 인구이동 현황을 기준년월 단위로 정리한 통계로, 전입(11), 전출(22), 전체(0) 구분과 함께 인구 수, 성별 인구 수, 20~30대 여성 이동자 수, 1인 및 2인 가구 수 등을 포함하고 있습니다. 이를 통해 지역별로 인구의 유입·유출 동향뿐 아니라, 가구 구성의 변화 양상을 파악할 수 있으며, 특히 1인가구 및 청년 여성의 이동은 주거 및 복지 정책 수립에 핵심 자료로 활용됩니다. 데이터는 주거 수요 예측, 청년 주거정책, 지역별 생활 SOC 계획, 도시계획 등 실질적인 행정 수요 예측 및 연구 분석에 적합합니다.*인구이동구분 코드 값입니다.00 : 시군내이동11 : 전출 - 도내타시군12 : 전출 - 타시도21 : 전입 - 도내타시군22 : 전입 - 타시도'
