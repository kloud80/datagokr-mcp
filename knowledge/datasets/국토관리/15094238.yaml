description_portal: '서울특별시 서초구 단독정화조오수처리시설설계시공업 인허가 정보에 대한 데이터로 사업장명, 지번주소, 도로명주소 등에 대한 정보 확인이 가능합니다.서울특별시 서초구의 개인하수처리시설(오수처리시설과 단독정화조)을 설계, 시공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다.개인하수처리시설(단독정화조/오수처리시설)을 ‘설계하거나 시공할 수 있도록’ 지자체가 업체에 부여하는 등록(허가)·신고의 행정기록 데이터를 말합니다. 즉, “시설 자체의 설치허가/준공” 데이터가 아니라 업체(사업자) 자격에 대한 데이터인 경우가 대부분입니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
