summary_user: 서울 자치구별로 하루 단위 생활인구를 집계한 표로, 기준일·시군구별 총생활인구와 내국인·장기체류외국인·단기체류외국인 인구, 일 최대·최소 인구, 주간·야간 인구, 이동 인구 수를 담는다. 상권 분석가나 구청 담당자가 '이 자치구는 주간과 야간 인구 차이가 얼마나 나고, 외국인 생활인구는 날짜별로 어떻게 변하나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구코드(SIGNGU_CODE_SE)나 자치구명을 이름·코드로 맞춰 연결한다.
description_portal: '서울 생활인구 일별 집계 정보입니다. 집계구, 행정동별, 성별, 연령대별 통계를 제공합니다. 기준일, 시군구코드, 시군구명, 총생활인구수, 내국인생활인구수, 장기체류외국인인구수, 단기체류외국인인구수, 일최대인구수, 일최소인구수, 주간인구수, 야간인구수, 일최대이동인구수 등을 제공합니다. *원천시스템 : 서울시 빅데이터분석활용시스템제공부서는 서울특별시 디지털도시국 데이터전략과(02-2133-4267)입니다.※ 바로가기 클릭 시 서울특별 열린데이터광장 개방 데이터로 이동합니다.'
