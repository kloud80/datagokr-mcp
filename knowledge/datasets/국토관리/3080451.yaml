summary_user: 군산시에 있는 대형마트와 기업형 슈퍼마켓(SSM)을 매장 한 곳씩 적은 CSV 파일로, 구분·상호·주소·전화번호를 담고 검증 시 6행이 수신됐다. 군산시의 대형마트·SSM이 어디에 있는지 알고 싶은 주민이나 상권·입지를 검토하는 분석가가 쓴다. 주소(address)를 조인 키로 삼아 다른 지역 상가·점포 자료나 지도 자료와 이어 쓰며, 좌표 필드는 없다.
description_portal: '"전북특별자치도 군산시_대형마트 및 SSM현황" 데이터는 군산시에 위치한 대형마트와 기업형 슈퍼마켓(SSM)의 정보를 제공하는 공공데이터입니다. 제공 항목에는 구분(대형마트 또는 SSM), 상호명, 주소 등 기본 정보가 포함되어 있으며, 지역 내 유통업체의 분포 현황을 파악하는 데 활용됩니다. 데이터는 텍스트 형식의 CSV로 제공되며, 상권 분석, 지역경제 연구, 점포 입지 선정 등 다양한 분야에서 참고할 수 있습니다. 공공데이터이기 때문에 누구나 무료로 다운로드 및 활용이 가능하며,  총 4건의 매장 정보가 수록되어 있어 군산시 내 유통 구조를 이해하는 데 기초 자료로 쓰일 수 있습니다. 일회성 데이터로 추후 변동사항 발생시 변동사항 반영하겠습니다.'
