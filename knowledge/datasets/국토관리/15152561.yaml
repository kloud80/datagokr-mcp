summary_user: 시·군·구마다 그 지역에 걸치는 강우 티센망(관측소 영향권) 코드·명칭과 면적비율을 짝지어 담은 매핑표이며, 범위는 전국 시군구이다. 홍수 분석가가 "이 시·군·구의 면적 가중 강우량을 어떤 관측소 영향권으로 어떻게 계산하나"를 따질 때, 또는 시군구별 강우·침수 분석에 쓴다. 실측 컬럼에 전역 조인 키는 없어 시군구 코드·명칭이나 티센망 코드를 같은 기관의 강우 관측·침수 자료와 이름·코드로 맞춰 이어 쓴다.
description_portal: 'AI홍수예보플랫폼에서 SSN을 활용하여 주소 기반 자료를 관리하고 제공하는 데이터 항목으로, AI 분석과 연계하여 티센망 코드, 면적비율 등 정보를 포함하며 시·군·구 단위로 체계적으로 관리된다. 이를 통해 시.군.구별  강우 및 침수 분석 등 다양한 업무 활용하거나 과거 데이터와 결합하여 침수 패턴 분석 활용할수 있다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
