description_portal: 경상북도에서 제공하는 대규모 택지개발사업 현황 데이터는 도내 주요 시군의 택지개발 지구별 사업 내역을 상세히 수록하고 있습니다. 본 자료에는 지구명, 시군, 읍면동,  면적, 사업비, 실시계획 승인일, 세대수, 수용인구, 사업시행자, 사업 상태 등의 정보를 포함하고 있어 택지개발 현황과 관련 정책 수립에 중요한 기초자료로 활용됩니다. 다양한 행정 및 도시계획 업무에 활용 가능하며, 체계적 관리와 투명성을 위해 제공되는 공공 데이터입니다. 자료 관련 문의는 054-880-3923으로 하시기 바랍니다.
