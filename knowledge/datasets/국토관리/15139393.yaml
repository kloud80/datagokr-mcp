summary_user: 제주특별자치도에 등록된 건설엔지니어링업체를 업체 한 곳당 한 행으로 담은 파일 데이터로, 등록 종류(종합·일반), 상호, 주소, 담당부서, 데이터기준일자를 기록한다. 발주처나 사업자가 '제주에 등록된 종합 건설엔지니어링업체는 어디이고 어느 지역에 있는가'처럼 설계·건설사업관리 용역 상대 업체를 찾거나 지역별 분포를 볼 때 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 업체 데이터와는 상호 이름 매칭이나 주소 기반 행정구역 매칭으로만 잇는다.
limits: 업체를 식별하는 공통 코드가 없어 다른 등록·실적 데이터와 정확히 연결하기 어렵고, 상호 표기 차이로 매칭이 틀어질 수 있다. 범위는 제주특별자치도 한 곳뿐이라 전국 비교에는 다른 시도 자료가 따로 필요하다.
