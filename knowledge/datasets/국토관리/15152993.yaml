description_portal: 15분 도시공원 데이터는 시민이 일상생활권에서 도보 15분 이내에 접근 가능한 도시공원을 분석하기 위해 구축된 공간 정보 기반 데이터입니다.본 데이터는 도시공원의 위치, 유형, 면적, 행정구역, 접근성 분석 결과 등으로 구성되어 있으며, 시민 생활권 내 공원 접근성을 평가하고 도시계획·생활SOC 정책에 활용할 수 있습니다.데이터는 각 기관, 공원종류, 공원명, 상세주소, 공원면적, 최초시설결정일, 중심좌표(경도·위도)를 포함합니다. 또한 주거지역·주요 밀집지역 기준으로 산정한 도보 15분 이내 접근 가능 여부, 공간 분석을 통해 도출한 생활권별 공원 서비스 수혜 여부, 공원 분포 및 부족지역 판별을 위한 기본 정보를 제공합니다.본 데이터는 도시공원 이용 편의 증진, 보행 중심 생활권 계획, 공원 확충 기준 마련, 지역 간 공원 불균형 해소 등 다양한 공공정책 수립에 활용 가능합니다.
