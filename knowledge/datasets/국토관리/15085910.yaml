description_portal: 홍수 예측을 위해 한강홍수통제소에서 관측하는 예보유역 별 수문학적홍수변수정보입니다. 예측수문 모형 종류, 변수명, 변수 기본값 등을 제공합니다.수문모형(Hydrological Model)은 강수량이 하천 유출량으로 변하는 복잡한 과정을 수학적으로 표현한 것입니다. 이 과정에서 사용되는 변수는 크게 입력 변수, 상태 변수, 매개변수, 출력 변수의 네 가지로 구분할 수 있습니다.여기서는 이중 매개변수에 대한 정보로 구성됩니다. 홍수예보시스템에서는 1항 유역저류함수법, 2항 유역저류함수법, Nash단위도법, NRCS단위도법, Clark단위도법, 1항 하도저류함수법, 2항 하도저류함수법, Muskingum방법, Muskingum-Cunge방법을 사용중이며여기서는 각 모형의 매개변수의 변수명으로 구성됩니다.
