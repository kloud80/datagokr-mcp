summary_user: 새만금 방조제 동쪽 끝 신시도 한 지점의 수위를 연·월·일·시 행마다 10분 간격 값(00~50분)과 그 시간의 최대·최소·평균으로 담은 관측 원천 시계열 CSV 파일이다. 새만금 담수호 수위가 홍수나 배수 시점에 시간대별로 얼마나 오르내렸는지 확인하려는 수자원 관리·환경 모니터링 분석가가 쓴다. 실측 컬럼에 관측소코드 같은 전역 조인 키가 없어서, 다른 새만금 수위 지점이나 WAMIS 관측소 자료와는 지점 이름과 날짜·시각을 맞춰 이어 쓴다.
description_portal: '- 한국농어촌공사에서 관리하고 있는 새만금 유역 내 신시도에 대한 수위 데이터 입니다.- 신시도는 전라북도 군산시 옥도면에 속한 섬으로 새만금 방조제 동쪽 끝에 위치하며 새만금 내측 담수호와 외측 해수의 수문 및 배수관리의 거점지 입니다.- 본 데이터는 신시도 수위 계측 정보로 월별, 10분단위, 최대, 최소, 평균값을 제공하고 있으며- 계측자료가 없는 일자(시간)데이터는  계측장비의 정비, 점검, 통신이상 등의 현장 사정에 따라 누락 될 수 있습니다.- 수위계측 자료는 홍수 및 재해 대응에 활용 가능하며- 새만금 수자원 관리, 환경 모니터링, 정책 수립 등에 활용 가능합니다.'
