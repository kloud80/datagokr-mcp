summary_user: 제주특별자치도 내 외식업체 이용자 수를 기준 연월(base_year_month)별로 시간대·성별·연령대로 나누어 집계한 통계이며, 포털 설명상 기간은 2019년 1월부터 2020년 12월까지입니다. 외식업 창업자나 상권 분석가가 '제주에서 20대 여성이 가장 많이 외식하는 시간대는 언제인가' 같은 피크 시간대·수요층 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 기준 연월이나 같은 기관(제주특별자치도)의 다른 외식·관광 통계와 이름·항목 매핑으로만 맞춰 쓴다.
description_portal: '이 데이터셋은 2019년 1월 1일부터 2020년 12월 31일까지 제주특별자치도 내 외식업체를 대상으로, 시간대별·연령대별·성별 이용자 수를 집계한 통계자료입니다. 제공기관은 제주특별자치도이고, 관리 부서는 디지털혁신과이며, 데이터 형식은 CSV로 누구나 무료로 다운로드 가능하도록 공개되어 있습니다. 이 자료는 지역 내 외식 이용 패턴의 시간대 흐름 분석, 피크 시간대 파악, 연령대 및 성별에 따른 외식 수요 비교, 관광객 및 도민 소비 시간대 분포 이해, 외식업 매장 운영 계획 혹은 상업 인프라 기획 등에 유용합니다. 다만 2019~2020년 기간에만 수집된 자료이므로, 최근 소비 트렌드 변화나 사회적·환경적 요인 변화(예: 팬데믹 이후 외식 행태 변화 등)는 반영되어 있지 않을 수 있다는 한계가 있습니다.'
