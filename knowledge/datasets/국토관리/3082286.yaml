summary_user: 광주광역시 광산구에 설치된 모정(마을 정자)을 한 곳씩 담은 시군구 범위의 개별 시설 목록으로, 동별·주소·건립구분·신축연도·보수연도가 들어 있다. 구청 담당자나 분석가가 "우리 동 모정 가운데 지은 지 오래됐는데 보수 기록이 없는 곳은 어디인가" 같은 유지보수 계획 질문에 쓴다. 전역 조인 키는 없어서 동 이름이나 주소를 행정동 코드나 지오코딩 결과에 맞춰 다른 시설·인구 데이터와 잇는다.
description_portal: '광주광역시 광산구에 설치된 모정 현황에 대한 데이터로 모정명, 동별, 위치 , 신축연도, 보수연도, 데이터 기준일자 등의 정보를 제공합니다.광주광역시 광산구에는 주민의 휴식과 소통을 위한 시설로 여러 동에 걸쳐 설치되어 있으며, 이들에 대한 현황 데이터를 통해 시설의 주요 특성을 한눈에 파악할 수 있습니다. 동별 정보는 모정이 어느 동(예: 송정동, 비아동 등)에 위치해 있는지 알려주며 위치 항목은 구체적인 설치 장소나 주소를 제공하여 지도 상의 정확한 위치를 확인할 수 있게 돕습니다. 신축연도 항목은 해당 모정이 언제 지어졌는지, 보수연도 항목은 마지막으로 언제 개선·수리되었는지를 나타냅니다.이 데이터는 주민의 쉼터 환경 개선, 어린이 안전 보장, 마을 공동체 활성화, 안전 점검 및 유지보수 계획, 그리고 주민복지 정책 수립 등 다양한 목적에 기여할 수 있는 중요 기반 자료입니다.'
