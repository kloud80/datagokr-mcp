summary_user: 전남·광주 지역의 사람이 사는 섬(유인도)을 한 행에 한 섬씩 담은 파일로, 시군구·위경도·섬 코드와 함께 2023·2024년 인구와 증감, 세대·성별 인구, 면적·해안선 길이를 담는다. 육지 연결 여부와 여객선 운항·접안시설, 개발대상섬·인구감소지역 같은 정책 지정, 읍면동사무소·치안·소방·우체국·금융·병원 등 시설 수가 함께 있어 정책 담당자나 분석가가 '인구가 줄고 육지와 연결되지 않은 섬 가운데 병원·파출소가 없는 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 시군구·섬 이름 매핑이나 위경도 좌표로 이어 쓴다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 기관 데이터와 연결할 때 이름 매핑이 필요하다. 유인도만 대상이며, 일부 섬은 행정구역상 인접 육지 시설을 이용하므로 시설 수가 0이라도 서비스 공백으로 단정하지 않는다.
