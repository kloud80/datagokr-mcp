summary_user: 서울 성동구 내 거리가게(노점) 한 곳당 한 행으로 허가 여부, 관리번호, 형태, 취급품목, 인접지 지번, 가로·세로 길이와 면적, 보도폭·유효보도폭을 담은 건별 현황 파일이다(CSV 약 2.6KB). 구청 담당자나 보행환경 연구자가 '어느 지번 앞 노점이 보도를 얼마나 차지해 유효보도폭이 얼마나 남는가'를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 인접지 지번을 주소·지번 데이터에 이름 매칭하거나 같은 성동구 자료와 맞대어 이어 쓴다.
description_portal: 서울특별시 성동구 내 거리가게(노점상)의 현황 정보를 제공합니다. 이 데이터는 거리가게의 연번, 허가여부, 관리번호, 형태, 취급품목, 인접지 지번, 가로·세로 길이(m), 면적(m²), 보도폭(m), 유효보도폭(m) 등 11개 항목으로 구성되어 있습니다. 해당 데이터는 거리가게가 위치한 장소와 규모, 합법적 관리 여부, 판매 품목 등 다양한 정보를 담고 있어 행정기관에서 도시 미관 관리, 보도 안전 확보, 노점 허가정책 수립 등에 활용할 수 있습니다. 민간 기업이나 연구자는 도시 상권 분석, 보행환경 개선 연구, 사회적 경제 활성화 등 다양한 분야에서 자료로 쓸 수 있으며, 시민들에게도 우리 동네 거리가게 위치 및 규모 정보를 제공함으로써 편리한 이용 및 지역 상권 이해를 높일 수 있습니다.
