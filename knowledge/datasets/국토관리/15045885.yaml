summary_user: 토지대장·임야대장의 한 필지에 소유자가 2인 이상인 경우 공유인별 소유구분과 변동 내역을 필지·공유인 일련번호 단위로 담은 건별 원천 데이터로, 범위는 전국이다. 특정 필지가 누구와 공유된 땅인지, 공유자 구성이 언제 바뀌었는지를 거래·개발 전에 확인하려는 사업자나 토지 소유 구조 변화를 보는 분석가가 쓴다. 법정동코드(bjd_cd)로 다른 토지·건물 데이터와 잇고, 필지 고유번호·지번으로 토지대장 계열 자료와 맞춰 쓴다.
description_portal: 국토교통부 일별공유지연명정보는 토지대장 또는 임야대장에 등록된 1필지에 소유자가 2인 이상 존재하는 경우, 각 공유자의 지분 현황과 권리 관계를 일 단위로 구분하여 제공하는 데이터이다. 이 자료는 공유 토지의 지분 구조 변동을 세밀하게 추적할 수 있도록 구성되어 있으며, 공유지분의 이전·변경·말소 등 권리 변동 이력을 확인하는 데 활용된다.특정 필지의 소유자별 권리 범위를 명확히 파악할 수 있다는 점에서 토지 거래나 개발 과정에서 중요한 참고 자료가 되며, 공유지 관련 분쟁 예방과 행정 처리의 신뢰성을 높이는 데 기여한다. 또한 일 단위의 데이터 제공을 통해 토지 소유 구조의 시계열적 변화 흐름을 분석할 수 있어, 정책 수립이나 연구 자료로서의 활용 가치도 높다.
legal_basis_portal: 국토교통부 대민서비스를 위해 서비스되는 자료이며, k-geo 플랫폼을 통해 연계받고 브이월드에서 대민서비스 중입니다.
