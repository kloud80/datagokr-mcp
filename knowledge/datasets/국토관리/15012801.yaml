summary_user: 한국상하수도협회가 국내 물산업 현황을 통계조사한 결과를 전국 단위 비공간 집계 엑셀 파일(xlsx, 약 460KB)로 담으며, 2019년부터는 통계청 국가승인 기준으로 바뀐 분류체계·종사자규모 구간·조사항목에 맞춘 공식 공표 양식으로 올라온다. 물산업 정책 담당자나 분석가가 "국내 물산업 사업체와 종사자 규모가 어떻게 분포하고 어떻게 변해 왔는가"를 보고 성장 전망과 지원정책의 기초자료를 마련할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 업종·분류 이름을 맞추는 매핑이나 같은 기관 자료로만 이어 쓴다.
description_portal: '국내 물산업 현황에 대한 통계조사 및 분석을 통해 물산업 성장 전망 예측 및 지원정책 수립의 기초자료로 활용,양식 변경 사유:  2019년 통계청 국가승인시 분류체계, 종사자규모 구간, 조사항목이 변경되어, 기존 틀과 현격히 차이가 발생하였고, 기존 틀은 홈페이지 예전 차트 생성용 양식이며, 홈페이지개편으로 현재 사용하고 있지 않은 양식입니다.  2019년 부터 업로드 되는 양식은 통계청, 정책관리시스템, 마이크로 데이터 제출양식에 맞는 공식 공표 양식입니다.'
