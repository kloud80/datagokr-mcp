summary_user: 의무관리대상 공동주택이 공사·용역·물품·위탁관리 사업자를 고르려고 낸 입찰공고를 공고 한 건 단위로 담으며, 범위는 전국이고 K-apt 외 민간 입찰사이트 공고도 함께 들어 있다(입찰제목·공고일·마감일·낙찰방법·낙찰/유찰 사유 등). 관리업체나 공사업체가 "우리 지역 아파트 단지의 경비·청소 용역 입찰 중 아직 마감되지 않은 공고가 무엇인가"를 찾을 때, 또는 분석가가 단지별 공사 발주 경향을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 단지코드(aptCode)로 K-apt 단지 기본정보·관리비·장기수선 데이터와, 법정동 시도코드로 지역 데이터와 이름·코드 매핑을 거쳐 잇는다.
description_portal: (공동주택입찰정보)「공동주택관리법 시행령 」 및 「주택관리업자 및 사업자 선정 지침」에 따라 실시하는  의무관리대상공동주택의 공사 및 용역 등 사업자를 선정하는 경우 전자입찰 방식으로 사업자를 선정할 수 있으며, 공동주택관리정보시스템으로 제공되는 전자입찰시스템을 이용할 수 있음. 이에 따라 시스템에 축적된 공동주택별 공동주택위탁관리, 공사, 용역, 물품, 기타에 관한 입찰 관련 정보 제공하고 있고  k-apt 사이트뿐만 아니라 민간입찰사이트를 통한 입찰공고, 투찰, 낙찰 등의 정보도 함께 제공하고 있음.
