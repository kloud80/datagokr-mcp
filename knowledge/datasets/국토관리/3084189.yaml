summary_user: 제주도 생물권보전지역 로고를 쓸 권한을 받은 업체를 건별로 담은 작은 CSV 파일(약 3.5KB)로, 업체명·품목·구분·취득 자격과 데이터기준일자가 들어 있다. 생물권보전지역 인증 농·임·수산물을 사거나 납품처를 찾는 소비자·유통업자가 "어느 업체의 어떤 품목이 생물권보전지역 브랜드를 쓰나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·품목 이름을 맞추거나 같은 기관 자료로만 이어 쓴다.
description_portal: '제주특별자치도 생물권 보전지역 내 브랜드 활용 제품 데이터를 제공합니다.항목: 업체명, 품목, 구분, 취득 자격 정보*브랜드 활용 사업은 생물권보전지역 내에서 생산되는 친환경 농산물과 임산물 그리고 수산물에 대하여 “제주도 생물권보전지역 로고”를 활용할 수 있는 권한을 부여하는 제도로, 유네스코라는 국제기구가 인정한 청정 생물권보전지역에서 생산된 생산물임을 인증하여 생산물의 부가가치를 높이는 주민지원사업입니다. 자세한 사항은 제주도생물권보전지역 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jibr/promotion.htm'
