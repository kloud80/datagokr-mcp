summary_user: 국토교통부가 지정한 국가산업단지의 현황을 vworld.kr 외부 API로 제공하는 데이터이며, 범위는 전국이고 비공간 단위로 확인된다. 산업단지 위치와 정보를 찾는 분석가나 사업자가 '이 국가산단은 어느 단지인가'를 확인하는 질문에 쓴다. 산업단지코드 원장 성격이어서 입주기업·공장 등록·산단 통계와 이어 쓰지만, 전역 조인 키는 없고 단지 이름(e_name)·코드(e_code) 매핑이나 같은 기관 코드로만 연결한다.
limits: vworld.kr 인증키(query 파라미터 key)가 필요하며 포털 활용신청과 별개다. 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑으로만 연결되고, 용지 분양·임대·미분양, 개발·조성, 보상·입찰, 토지·지적 정보는 이 데이터의 범위에서 제외된다.
