summary_user: 부산광역시 수영구에 등록된 기업체(공장 포함)를 한 곳당 한 행으로 담은 파일로, 회사명·도로명 공장 주소·업종명·전화·팩스번호를 담으며 포털 설명상 57건 규모다. 수영구에서 특정 업종의 공장이 어디에 있는지, 거래처나 협력업체 연락처를 찾으려는 사업자나 지역 제조업 분포를 보려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 도로명 주소를 맞춰 보는 방식으로만 잇는다.
