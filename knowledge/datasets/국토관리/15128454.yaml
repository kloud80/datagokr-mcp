summary_user: 경기도 시군구 간 출발지·도착지 쌍별로 이동수단(승용차, 버스, 지하철, 택시 등)에 따른 탄소배출량을 추정한 집계 자료로, 기준연월(crtr_ym)·요일 구분별 이동 인구, 이동 거리, 배출량을 시도·시군구 단위로 담는다. 교통·환경 분석가가 '어느 시군구 간 이동에서 승용차 배출량이 가장 큰가'처럼 지역 간 통행의 환경 영향을 비교하거나 대중교통 전환 효과를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군구 코드(dppl_signgu_cd)나 시군구명으로 다른 행정구역 단위 통계와 매핑해 잇고, 컬럼·코드 설명은 경기도 민간데이터 규격서 데이터셋에서 찾는다.
description_portal: 이 데이터는 경기도 시군구 간 이동수단별 탄소배출량을 기록한 자료입니다. 특정 출발지와 도착지 간 이동 시 교통수단(승용차, 버스, 지하철, 택시 등)에 따라 발생하는 온실가스 배출량을 추정·산출한 것으로, 교통 활동의 환경적 영향 분석에 활용됩니다.대용량데이터로 시트는 데이터의 샘플이며, 원본 데이터는 FILE 탭을 활용하여 다운로드가 가능합니다.다운로드 받으신 파일의 컬럼명에 대한 정보와 컬럼 중 코드에 해당하는 설명은 경기도 민간데이터 규격서 데이터셋에서 확인하실 수 있습니다.
