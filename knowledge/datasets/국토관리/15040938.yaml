summary_user: 부천시 안의 공연장(부천시민회관·부천아트센터·오정아트홀·복사골문화센터)과 전시장(심곡천네모갤러리·부천시청역 갤러리·아리솔갤러리) 7곳을 시설 한 곳당 한 행으로 담은 작은 목록 파일로, 소재지·규모·전시실 구성·개관일·전화번호가 들어 있다. 부천 시민이 가까운 공연장이나 갤러리를 찾거나, 대관을 원하는 단체가 어느 시설에 연락할지 확인할 때 쓴다. 법정동코드(bjd_cd)가 들어 있어 법정동 단위의 다른 지역 통계나 시설 데이터와 이어 쓰고, 행정동코드도 함께 있다.
description_portal: '- 문화의 도시 부천시는 시민들에게 더 다양한 공연 및 전시 등의 문화 제공을 위하여 부천시 공연장 및 전시장의 규모, 구성, 개관일, 전화번호 등의 정보를 제공하고 있습니다. - 부천시 내 공연장 및 전시장은 총 7군데로 시설별로 공연장 또는 전시시설을 구비하고 있으며, 일부 시설은 공연장과 갤러리 시설을 함께 운영 중에 있습니다. 제공되는 데이터를 통해 시민들이 공연 및 전시를 즐길 수 있으며, 대관을 원하는 경우 해당 시설별 연락처로 문의 가능합니다.- 부천시 공연장: 부천시민회관, 부천아트센터, 오정아트홀, 복사골문화센터- 부천시 전시장: 심곡천네모갤러리, 부천시청역 갤러리, 아리솔갤러리'
