summary_user: 부산 영도구 관내 착한가격업소로 지정된 업소의 업종·업소명·도로명주소·연락처를 업소 1곳당 1행으로 담은 파일(csv, 약 7KB)입니다. 주민이나 방문객이 영도구에서 값싸고 깨끗한 식당·미용실 같은 생활서비스 업소를 찾을 때 쓰고, 분석가는 업종별 지정 현황을 살피는 데 씁니다. 전역 조인 키가 없어 다른 데이터와는 도로명주소를 지오코딩하거나 업소명을 대조해 잇고, 다른 지자체의 착한가격업소 파일과는 같은 항목끼리 이어 붙여 씁니다.
description_portal: 부산광역시 영도구 관내 착한가격업소(착한 가격, 청결한 가게 운영, 기분 좋은 서비스 제공으로 소비자에게 만족을 드리기 위해 정부와 지방자치단체가 선정한 우수 업소) 지정 정보를 제공합니다.업종, 업소명, 주소 , 연락처를 확인할 수 있습니다.지정대상은 개인사업자, 법인으로서 서민생활과 밀접한 개인서비스요금(통계청 분류)에 해당하는 업종에 대해 시민에게 직접 소매단위로 물품‧서비스 등의 판매행위를 하는 업소입니다. 다만, 프랜차이즈업소는 지정불가합니다.지정기준은 주변대비저렴도(가격수준, 가격 안정 노력 포함 ), 위생청결(주방 등, 매장 내, 화장실 등)을 평가하며,  지역사회 공헌도 등을 고려하여 정성평가 등 부분도 확인합니다.착한가격업소는 2011년부터 물가안정을 위해 가격이 저렴하지만 양질의 서비스를 제공하는 곳을 정부와 지자체가 지정한 우리 동네의 좋은 업소입니다.착한가격업소 제도는 전반적 개인서비스 물가안정에 기여하고 서민이 많은 착한가격업소의 매출증대를 통해 서민경제 살리기에도 기여할 수 있습니다.지역상인과 소비자가 윈-윈(Win-Win)할 수 있는 지정업소입니다.착한가격업소는 행정안전부 착한가격업소 홈페이지, 영도구청 홈페이지(분야별정보-경제정보-착한가격업소 게시판)에서도 확인 할 수 있습니다.
