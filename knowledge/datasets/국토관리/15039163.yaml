summary_user: 제주특별자치도개발공사가 제주삼다수 사업(취수원 보호, 공장·도로 용지 확보)을 위해 매입해 보유한 조천읍 공장 주변 토지를 필지별로 소재지·지목·면적(㎡)·취득일자·용도로 담은 작은 CSV 파일(약 2.6KB)이다. 지역 주민이나 분석가가 "삼다수 공장 주변에서 공사가 언제, 어떤 지목의 땅을 얼마나 사들였고 무슨 용도로 쓰는가"를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지(지번 주소)를 문자열로 맞추는 방식으로만 이을 수 있다.
description_portal: 본 데이터는 제주특별자치도개발공사가 먹는샘물(제주삼다수) 사업을 위해 취수원 보호, 공장 및 도로 용지 확보 등의 목적으로 매입한 토지의 현황입니다. 해당 데이터는 공사가 보유·관리 중인 제주시 조천읍 남조로 1717-35 일대 제주삼다수 공장 주변 토지를 대상으로 하며, 토지의 지번, 지목, 면적(㎡), 취득일자, 용도 등 세부 정보를 포함하고 있습니다. 해당 자료를 통해 제주특별자치도개발공사가 투명한 재산 운용 및 관리하고 있음을 확인할 수 있으며, 지역 토지 이용 실태 분석을 위한 기초 자료로 활용할 수 있습니다.
