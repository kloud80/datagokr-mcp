summary_user: 리츠정보시스템에 등록된 운영 중인 자산관리회사의 기본현황(인가·설립일, 자본금, 대표자, 주소)과 공시내역, 공모 진행상황(모집가액·청약·배정 주식수), 수탁 리츠 목록을 회사·리츠 건별로 담는 전국 범위 API다. 투자자나 부동산 금융 분석가가 특정 자산관리회사가 어떤 리츠를 맡고 있고 공모를 어떤 조건으로 진행했는지 확인할 때 쓴다. 전역 조인 키는 없어 리츠번호(reitsNo)·자산관리회사번호(amcNo)와 이름 매핑으로 같은 기관의 리츠정보 서비스와 연결하며, amcNo는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 리츠정보시스템에서 관리하는 리츠 관련정보 중 운영중인 자산관리회사 공시사항, 공모정보, 수탁리츠 목록 등의 정보를 제공합니다. 본 서비스는 국토교통부에서 제공하는 OpenAPI로서 리츠정보시스템에 등록된 운영중인 자산관리회사의 기본현황과 공시내역, 공모 진행상황 및 해당 회사가 수탁한 리츠 목록을 체계적으로 조회할 수 있도록 지원한다. 제공되는 데이터는 REST 방식의 JSON 포맷으로 응답하며, 공시기준일을 기준으로 최신 등록정보를 반영하여 제공한다. 본 데이터는 리츠 투자정보 제공 서비스, 자산관리회사 현황 분석, 부동산 금융·투자 플랫폼 개발뿐만 아니라 정책 연구 및 시장감시, 투자리스크 분석, 신용평가 및 통계 작성 등 다양한 행정·산업적 활용에 적합하다. 출력결과는 자산관리회사 코드, 회사명, 설립일자, 대표자명, 주소, 연락처, 전자우편, 공시일자, 공시유형, 공시내용 요약, 공모상태, 공모시작일, 공모종료일, 수탁리츠 수, 수탁리츠 목록(리츠코드·리츠명 등) 등의 항목으로 구성되며, 그 외 관련 메타정보가 포함될 수 있다 등과 같은 항목들로 제공된다.
