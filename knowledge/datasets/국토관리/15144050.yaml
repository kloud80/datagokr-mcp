summary_user: 전북특별자치도 장수군에 지정된 착한가격업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·연락처·도로명 주소와 대표 메뉴 최대 3개의 이름과 가격을 담는다. 장수군 주민이나 방문객이 '장수군에서 값싼 한식당이나 목욕탕은 어디이고 메뉴 가격은 얼마인가'를 찾거나, 분석가가 업종별 가격 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 문자열이나 시도·시군 이름을 맞춰 붙여야 하며, 다른 시군의 착한가격업소 현황과 같은 형식으로 이어 붙여 쓰는 방식이 현실적이다.
description_portal: '전북특별자치도 장수군 소재한 착한가격업소 현황입니다이 데이터는 지역 내 소비자 물가 안정을 유도하기 위해 지정된 착한가격업소의 현황을 정리한 자료입니다. 업소명, 업종, 전화번호, 도로명 주소, 주요 메뉴 품목 및 가격(최대 3개까지), 데이터는 전북특별자치도 장수군의 착한가격업소 현황을 담고 있으며, 총 25개 업소에 대한 정보를 포함하고 있습니다. 주요 항목은 아래와 같습니다.가장 저렴한 업종: 목욕업은 기본적으로 5,000원으로 가장 저렴합니다.-가성비 있는 식당업종: 양식, 한식_육류가 1만원 이하로 평균 메뉴 가격을 형성하고 있어 가격 경쟁력이 높습니다.-고가 업종: 숙박업과 미용업은 상대적으로 높은 가격대를 보이며, 평균 가격이 3~6만 원대입니다.-한식_일반은 전통음식과 정식류를 포함해 가격이 평균적으로 높은 편입니다.'
