description_portal: 한국부동산원(구 한국감정원)의 청약홈에서 제공하는 월별 평균 분양가 정보입니다.청약홈에서 일반공급 접수를 대행한 일반분양 단지를 기준으로 작성되었습니다.공공데이터 제공범위는 한국부동산원이 주택청약 업무를 수행한 2020년 2월부터 데이터 작성 기준 전월 말일까지로 모집공고일을 기준으로 집계하였습니다.* 컬럼별 상세설명- 연월→ 모집공고일이 포함된 연월- 60제곱미터 이하 → 전용면적 60제곱미터 이+-9하 주택의 제곱미터당 평균 분양가- 60제곱미터 초과 85제곱미터 이하 → 전용면적 60제곱미터 초과 85제곱미터 이하 주택의 제곱미터당 평균 분양가- 85 제곱미터 초과 → 전용면적 85제곱미터 초과 주택의 제곱미터당 평균 분양가- 59형 → 전용면적 59제곱미터(소수점 미만 절사) 주택의 제곱미터당 평균 분양가- 84형 → 전용면적 84제곱미터(소수점 미만 절사) 주택의 제곱미터당 평균 분양가※ 참고사항1. 한국부동산원 청약홈에서 추첨을 진행했던 국민, 민영주택 APT의 최고분양가를 기준으로 작성되었습니다.2. 월별 최신화로 자료이용 시 기준월에 유의하시기 바랍니다(ex. "24.7월 업로드 데이터는 "24.6월말 기준 APT 대상).3. 면적구분은 전용면적 기준이며 평균분양가 산출 시에는 공급면적을 사용하였습니다.
