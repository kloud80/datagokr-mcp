description_portal: '○ 통계개요* 통계명 : 상수도 급수 현황* 통계종류 : 서울시 상수도 급수현황을 제공하는 일반ㆍ보고통계* 근거법령 : 서울시「수도조례」에 의한 상수도관을 통한 수돗물 공급량* 작성목적 : 서울시 상수도 보급현황, 시설물현황, 요금ㆍ재정 등에 대한 현황을 조사ㆍ분석하여 시설의 적정 설치 및 관리를 위한 정책수립의 기초자료를 제공하는것을 목적으로 함* 조사체계 : 수도사업소 → 상수도사업본부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 자치구별 상수도 급수대상 및 보급률ㆍ급수량 등○ 용어설명* 시설용량 : 1일 물을 생산할 수 있는 능력(시설용량 초과 불가)* 급수량 : 배수지 유량계를 통과하는 수치* 1일1인당 급수량: 1일 급수량/급수 인구수* 급수전 : 서울시에서 설치한 수도계량기 또는 주계량기(아파트 등에서 사용되는 주 배관에있는 계량기)를 의미함○ 기 타* 급수대상 총인구는 주민등록인구를 활용함* 보급률은 구청별로 구분하고, 시설용량ㆍ급수량ㆍ급수전수 등은 정수장별로 구분'
