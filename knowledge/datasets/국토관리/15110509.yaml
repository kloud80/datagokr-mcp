summary_user: 대구광역시 서구에서 추진 중인 재건축·재개발 등 도시정비사업을 구역 단위로 정리한 현황 자료로, 등록번호·사업 구분·구역명·위치·조합 사무실·면적·사업계획(세대 수·층수·동수 등)·정비구역 지정일을 담는다. 서구에서 어느 구역이 재개발·재건축으로 지정됐고 언제 정비구역으로 지정됐는지, 조합 연락처는 어디인지 확인하려는 주민·부동산 사업자·도시계획 분석가가 쓴다. 실측 컬럼에 법정동코드 같은 전역 조인 키가 없어 다른 정비사업·건축 데이터와는 구역명이나 위치(주소) 문자열 매칭으로만 이어 쓴다.
description_portal: 대구광역시 서구_도시정비사업 현황 데이터의 등록번호, 사업 구분, 구역 명, 위치, 조합 사무실, 면적, 사업 계획, 정비 구역 지정 항목을 제공하는 서비스본 데이터는 대구광역시 서구에서 추진 중인 도시정비사업의 현황을 정리한 자료이다. 주요 내용은 재건축 및 재개발 사업 구분별 구역 명칭, 위치, 조합 사무실 주소 및 연락처, 면적, 사업계획, 정비구역 지정일 등을 포함하고 있다. 각 사업은 주거환경 개선 및 노후 건축물 정비를 위한 것으로, 세대 수, 층수, 동수 등 세부 계획이 기재된 항목도 있다. 일부 사업은 조합 사무소 정보가 누락되어 있으나, 구역별 위치를 통해 사업 범위를 확인할 수 있다. 본 자료는 지역 정비사업 추진 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 주택정책 수립 및 도시계획 관련 업무에 활용 가능하다. 표 형식으로 정리되어 있어 행정기관, 연구기관, 민간 부문에서의 접근성과 활용성이 높다.
