summary_user: 경상북도 김천시에 조성된 정보화마을을 마을 한 곳당 한 행으로 담은 486바이트 분량의 작은 CSV 파일로, 마을명·지번/도로명 주소·위도·경도·조성년도·홈페이지주소를 담는다. 김천시 봉산면(포도)·구성면(자두) 정보화마을의 위치와 온라인 판매·홍보 홈페이지를 찾는 주민·방문객이나, 농산촌 정보화사업 분포를 지도에 올리려는 분석가가 쓴다. 전역 조인 키는 없어서 시도·시군구 이름이나 주소·좌표를 기준으로 다른 지역 데이터와 맞춰 이어 쓴다.
description_portal: 경상북도 김천시 내 조성되어있는 정보화마을에 대한 마을명,소재지지번주소, 소재지도로명주소, 위도, 경도, 조성년도, 홈페이지주소 정보를 제공합니다.정보화마을이란 농촌, 어촌, 산촌과 같이 정보화에 소외된 지역에 초고속 인터넷 이용환경  조성으로 전자상거래와 정보콘텐츠를 구축하여 지역주민의 정보생활화를 유도하고 실질적인 수익을 창출함으로써 지역경제 활성화를 통해 발전을 이룩하고자 하는 사업입니다. 김천시에는 포도가 많이 생산되는 봉산면과 자두가 많이 생산되는 구성면에 정보화마을이 지정되어 있습니다.
