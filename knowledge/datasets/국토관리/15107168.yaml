description_portal: '경상남도 진주시에 위치한 주택보급률에 관한 데이터셋입니다.경상남도 진주시에 위치한 주택보급률의 연도, 일반가구수, 주택총수, 아파트수, 연립주택수, 다세대, 단독, 주택보급률에 관한 정보를 포함하고 있습니다.*주석1. 일반가구수 = 총가구수 – 집단가구수 – 외국인 가구수※5년마다 인구주택 총 조사 실시(2010, 2015, 2020), 그 외 연평균 증감률 반영하여 추정치2. 주택수 = 전년도 주택수 + 사용승인 주택수 - 멸실 주택수※사용승인 주택 수 : 세움터 주택건설실적 사용승인분 참고※멸실 주택수 : HIS(주택공급통계정보시스템) 참고3. 주택보급률 = 주택수/일반가구수*100'
