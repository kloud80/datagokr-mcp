description_portal: '서울특별시 금천구 내 개별입지에 위치한 제조업체의 현황을 산업중분류(예: 식료품, 음료, 섬유제품) 및 동별로 상세히 제공하는 데이터입니다. 본 데이터는 지역별 산업 구조 분석, 창업 및 투자 계획 수립, 정책 연구 등 다양한 분야에서 금천구의 경제 현황을 심도 있게 파악하는 기초자료로 활용될 수 있습니다. 이를 통해 지역 경제 활성화를 위한 맞춤형 정책 개발과 민간 부문의 데이터 기반 의사결정을 지원하고자 합니다.본 데이터는 「산업입지 및 개발에 관한 법률」에 따라 개별적으로 공장 등록을 마친 제조업체를 대상으로 하며, 산업단지 내 입주한 공장 현황은 한국산업단지공단에서 별도로 관리하고 있으니 이용에 참고하시기 바랍니다.'
