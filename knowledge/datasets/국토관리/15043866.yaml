summary_user: 전남광주통합특별시가 부여한 명예도로명을 한 건씩 담은 조서 파일(CSV, 약 1.8KB)로, 명예도로명과 해당 공식 도로명, 관할구역, 기점·종점, 부여일자, 사용기간, 부여사유를 담는다. 주민·방문객이나 지역사 연구자가 '이 길에 붙은 명예도로명은 누구를, 왜 기념하며 언제부터 얼마 동안 쓰이는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 공식 도로명(도로명)이나 관할구역 이름을 기준으로 도로명주소 자료와 이름으로 맞춰 이어 쓴다.
description_portal: 명예도로명은 우리 지역의 특별한 인물이나 중요한 역사적 사건, 또는 지역이 지닌 문화적 가치를 오래도록 기념하기 위해 붙이는 이름입니다. 기존에 쓰이고 있는 공식 도로명과는 별도로, 그 의미를 더하기 위해 부여됩니다. 예를 들어, 지역에서 큰 업적을 남긴 인물의 이름이나 역사적으로 중요한 사건이 있었던 장소의 이름이 명예도로명으로 쓰일 수 있습니다. 이렇게 하면 주민들이 자신이 사는 지역에 대해 더 큰 애정을 갖게 되고, 지역의 역사와 문화를 지키는 데에도 도움이 됩니다. 명예도로명은 주로 도로 표지판이나 공공장소에 공식 도로명과 함께 표기되기 때문에, 주민뿐 아니라 처음 방문하는 사람들도 그 의미를 쉽게 알 수 있습니다. 또한, 학교 수업이나 지역 축제, 기념행사 등 다양한 활동에서 활용되어 지역의 전통과 이야기를 널리 알리는 역할을 합니다. 결국 명예도로명은 단순한 길 이름을 넘어, 지역의 정체성과 자긍심을 키우고 다음 세대에까지 그 가치를 전하는 중요한 수단입니다.(2026년 현행 자료입니다.)
