description_portal: 서울특별시 시정통계를 기반으로 기타 주거유형의 전·월세 전환율 현황을 제공하는 자료이다. 전세보증금을 월세로 전환할 때 적용되는 전환율을 권역별(도심권, 동남권, 동북권, 서남권, 서북권) 및 분기별로 제공하며, 임대차 시장의 가격 변동과 주거비 부담 수준을 분석할 수 있다. 전·월세 전환율은 전세와 월세 간의 가격 관계를 나타내는 지표로, 임차인의 주거비 부담과 임대시장의 구조 변화를 파악하는 데 활용된다. 본 자료는 주택정책 수립, 임대차시장 동향 분석, 주거복지 정책 추진, 부동산 시장 연구, 권역별 주거환경 비교 및 주거비 부담 분석을 위한 기초자료로 활용할 수 있다.
