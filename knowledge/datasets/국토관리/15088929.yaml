summary_user: 팩토리온(공장설립온라인지원시스템)에 등록된 공장을 공장 한 건 단위로 담은 파일로, 2021년 7월 말 기준 회사명·시도·시군구·단지명·설립구분·입주형태·보유구분·용도지역·지목과 용지·제조시설·부대시설·건축 면적을 전국 범위로 수록한다. 분석가나 지자체 담당자가 "어느 시군구·산업단지에 공장이 몰려 있고 공장당 용지·건축 면적은 얼마인가"를 따질 때 쓴다. 사업자번호·PNU 같은 전역 조인 키가 없어서 다른 데이터와는 회사명, 시도·시군구명, 단지명 같은 이름으로 맞춰 이어 쓴다.
limits: 2021년 7월 말 기준으로 집계한 데이터라 그 뒤의 공장 등록·변경은 들어 있지 않다. 조인 키가 없어 기업·토지 데이터와 연결하려면 이름 매칭이 필요하고, 파일이 약 19.6MB xlsx로 커서 엑셀에서는 다 보이지 않을 수 있으므로 R·Python 같은 분석 도구로 읽어야 한다.
