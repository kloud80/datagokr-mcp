summary_user: 대구광역시 서구 관내에서 추진 중인 소규모주택 정비사업(가로주택정비사업·소규모재건축정비사업)을 사업 구역 단위로 정리한 파일로, 구역번호·구역명·위치·면적·사업계획·세대수·진행상황·주요 일자를 담는다(CSV 약 4.6KB의 소규모 목록). 서구에서 어느 구역이 어떤 단계까지 진행됐고 몇 세대가 공급되는지 확인하려는 주민·부동산 사업자·도시계획 분석가가 쓴다. 실측 컬럼에 전역 조인 키(법정동코드·지번 PNU 등)가 없어, 다른 데이터와는 위치 주소나 구역명을 이름으로 맞춰 연결해야 한다.
description_portal: 대구광역시 서구의 소규모주택 정비사업 현황을 나타내는 데이터 입니다. 사업구역과 면적, 사업계획 등의 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구 관내에서 추진 중인 소규모주택 정비사업의 현황을 수록한 자료이다. 사업 구역별로 구역번호, 사업유형, 위치, 면적, 건축계획, 세대 수, 진행상황 및 주요 일자를 포함하고 있어 사업추진의 전반적인 흐름을 확인할 수 있다. 데이터는 가로주택정비사업과 소규모재건축정비사업으로 구분되며, 각 구역의 규모 및 추진 단계에 대한 정보가 구체적으로 명시되어 있다. 주거환경 개선 및 도시재생사업의 기초 자료로 활용 가능하며, 관련 부서와 시민, 민간업체 등이 참고할 수 있는 행정자료이다. 세부 주소와 세대 수가 포함되어 공간 계획, 인구 추계, 인프라 수요 분석 등 다양한 분야에서 활용될 수 있다.
