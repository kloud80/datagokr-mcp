summary_user: 경상북도 고령군에 설치된 스마트워터미터기(원격 검침 수도계량기)의 위치를 주소 단위로 담은 파일 자료로, 도로명·지번 상세주소와 해당 위치의 설치대수, 데이터 기준일자를 행마다 기록한다. 군 상수도 담당자나 분석가가 '고령군 어느 지역에 스마트 계량기가 얼마나 깔렸고, 어디가 아직 미설치인가'를 파악해 검침 인력 배치나 노후 계량기 교체 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 자료와는 주소를 지오코딩하거나 주소 문자열을 행정구역 이름에 맞춰 연결해야 한다.
