summary_user: 진안군 관내에서 시행한 10억원 이상 대형공사를 공사 한 건당 한 행으로 담은 파일로, 계약명·계약금액·도급업체명·착공일·준공일을 기록한다(약 5.7KB 규모의 CSV). 지역 주민이나 건설업체·분석가가 '진안군에서 최근 어떤 대형공사가 어느 업체에 얼마에 맡겨졌고 언제 끝났나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도급업체명이나 계약명 같은 이름 매칭, 또는 같은 기관(진안군) 단위로만 이어 쓴다.
description_portal: 전북 특별자치도 진안군의 관내에서 실시한 10억원 이상의 대형공사에 대한 공공데이터 자료입니다. 이번 자료에서는 10억 이상 대형공사 계약명, 공사 계약 금액, 공사를 시행한 도급업체명, 공사 시작일, 공사 종료일 등에 대한 정보를 제공합니다. 이 자료를 통해 어떤 공사가 주로 이루어졌는지 확인할 수 있고, 어떤 도급 업체들이 어느 공사를 주로 담당했는지와 공사 시작일과 종료일을 확인할 수 있습니다. 그리고 이 자료는 년 단위 기준으로 새롭게 시행한 공사 관련 데이터를 현행화하여 제공합니다.
