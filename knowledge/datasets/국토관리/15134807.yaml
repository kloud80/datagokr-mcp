summary_user: 인천 동구(제물포구)에서 쓰는 지역화폐 동구사랑상품권의 가맹점을 한 곳씩 담은 목록으로, 상호명·도로명주소·가맹점 유형·데이터기준일자를 담는다(CSV 약 142KB). 주민이 "우리 동네에서 동구사랑상품권을 받는 가게가 어디인가"를 찾거나, 분석가가 가맹점 유형별 분포와 입지를 살펴 상권·소상공인 정책을 검토할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와 이으려면 도로명주소(소재지도로명주소)를 주소 정제·좌표 변환해 붙이거나 상호명으로 맞춰야 한다.
