summary_user: 건물 정보를 바탕으로 유동인구·카드매출·부동산 빅데이터를 분석해 도시재생사업이 필요한 지역을 도출한 결과를 시도별 엑셀(XLSX) 파일로 담는다(범위는 전국, 공간 좌표 없는 비공간 자료). 지자체 도시재생 담당자나 분석가가 '우리 시도에서 도시재생 사업이 우선 필요한 지역이 어디인가'를 검토하고 사업 방향·성과관리 기준을 잡는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 지역 이름이나 행정 코드를 직접 매핑해서만 이을 수 있다.
limits: API가 아니라 vworld.kr에 로그인한 뒤 공간정보 다운로드 페이지에서 시도별 파일을 받는 방식이며, 포털 활용신청과는 별개다. 공통 조인 키가 없어 건축물대장·도시재생 활성화지역 등 다른 자료와 연결하려면 이름·코드 매핑 작업이 필요하다. 받은 파일의 첫 행이 '테이블정의서'와 이름 없는 열로 읽히므로 실제 컬럼명은 파일 안 정의를 확인해 다시 지정해야 한다.
