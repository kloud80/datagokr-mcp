summary_user: 인천광역시 연수구 안에 있는 집합건물(아파트·오피스텔·상가 등)을 건물 한 동 단위로 정리한 현황 파일로, 주소·건물명·연면적·주용도·세대수·사용승인일자를 담는다. 연수구 주민이나 부동산 분석가가 '연수구에서 사용승인이 오래된 대형 집합건물은 어디에 있고 세대수는 얼마인가'를 확인하는 데 쓴다. 건축물대장 고유번호 같은 전역 조인 키가 없어 다른 데이터와는 주소나 건물명을 맞춰 연결해야 한다.
limits: 공통 식별 키가 없으므로 건축물대장·공시지가 등과 붙이려면 주소 문자열을 정제해 매칭해야 하고, 일부 건물은 매칭이 어긋날 수 있다. 범위가 연수구 한 곳뿐이라 다른 시군구와 비교하려면 해당 지자체의 자료를 따로 구해야 한다.
