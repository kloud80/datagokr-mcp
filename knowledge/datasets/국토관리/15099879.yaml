description_portal: '인천광역시 연수구 소재 집합건물(소재지 주소, 건물명, 연면적, 주용도, 세대수, 가구수 등)에 관한 현황 정보입니다. 집합건물이란 "집합건물의 소유 및 관리에 관한 법률"의 적용 대상인 건축물로 여러 개의 독립된 구획(예: 아파트, 오피스텔, 상가 등)이 한 건물 또는 여러 건물에 모여 하나의 집합을 이루는 건물을 의미합니다. 해당 정보는 주소, 건물명, 연면적, 사용승인일자, 용도, 세대수, 호수, 가구수의 정보를 담고 있습니다. 집합건물 구분소유자 및 점유자 등에게 건물 정보를 제공하고 부동산 관련 통계 및 분석 자료로도 활용될 수 있습니다.'
