summary_user: 성남시에 있는 일반건축물의 지방세 부과기준인 시가표준액을 과세년도별로 필지·건물(동·호) 단위로 담은 파일로, 소재지 지번(법정동·본번·부번)과 시가표준액·연면적이 함께 들어 있다. 재산세 과세표준을 가늠하려는 건물 소유자나, 성남시 안에서 동별·연도별 건축물 시가표준액 수준과 변동을 비교하려는 분석가가 쓴다. 전역 조인 키(건물·필지 고유번호)는 없어서, 다른 건축물대장·공시지가 자료와는 법정동명과 본번·부번 같은 지번 조합, 또는 자치단체코드로 맞춰 이어 써야 한다.
description_portal: 일반건축물에 대한 지방세 부과기준인 시가표준액을 제공하며, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 시가표준액, 연면적 등 항목이 있습니다. 성남시에 소재한 일반건축물의 시가표준액을 산정하고 그 현황을 체계적으로 파악하실 수 있도록 구성된 자료입니다.  재산세 과세표준 산정의 기초자료로 활용됩니다. 이를 통해 성남시 건축물의 유형별·지역별 가치 수준을 비교하고, 연도별 변동 추이를 분석하실 수 있습니다. 또한 시가표준액 변동이 지방세 세수, 부동산 시장 여건, 건축물 관리 정책 등에 미치는 영향도 파악하실 수 있어 세정 운영 및 부동산 정책 수립에 중요한 참고자료가 됩니다. 다양한 행정·정책 분야에서 활용 가능한 핵심 데이터를 제공하는 자료라고 할 수 있습니다.
