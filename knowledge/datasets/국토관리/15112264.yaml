description_portal: '한국부동산원(구.한국감정원)에서 제공하는 전국지가변동률조사 중 용도지역별 지가변동률 데이터입니다.<전국지가변동률조사 조사 개요>ㅇ 국가통계 승인번호 : 제315001호ㅇ 법적근거 : 부동산 거래신고 등에 관한 법률 제19조 및 같은 법 시행령 제17조ㅇ 조사목적 : 전국의 지가변동 상황을 조사하여 토지정책수행 및 감정평가시 시점수정 등을 위한 자료로 활용ㅇ 조사주기 : 월ㅇ 조사지역 : 전국ㅇ 조사방법 : 표본, 실측조사ㅇ 공표주기 : 지가지수 및 변동률(매월)ㅇ 공표시기 : 익월 25일경※ 이용시 유의점 : 전국 지가변동률 통계는 일반적인 지가수준의 변동을 측정하는 하나의 지표로서 특정지역이나 개별토지의 가격수준 및 가격변동을 측정하는 것은 아님'
