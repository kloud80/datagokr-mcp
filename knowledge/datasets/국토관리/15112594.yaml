description_portal: 경기주택도시공사에서 청년, 대학생, 신혼부부 등의 주거안정을 지원하기 위해 추진된 공공임대주택인 경기행복주택 공급 현황 데이터로써 각 사업지구의 위치정보, 유형, 공급세대수, 준공일자 등 주거지 선택에 필요한 다양한 정보를 포함하고 있습니다. 행복주택은 직주근접과 교통편의를 고려하여 선정된 부지에 공급되며, 공공임대주택 정책의 일환으로 주거비 부담을 경감하고 주거복지 향상을 목적으로 합니다. 해당 자료는 주거복지 정책 수립, 입주수요 분석, 지역별 주택 공급계획 등 다양한 분야에서 활용될 수 있으며, 연도별 공급추이와 유형변화 등을 파악하는 기초정보로 제공됩니다.
