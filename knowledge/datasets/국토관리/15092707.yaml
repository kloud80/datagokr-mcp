description_portal: 전북특별자치도 부안군은 지역 내 축산시설에서 발생하는 가축분뇨 악취로 인한 주민 생활불편을 해소하고, 악취저감 정책 수립의 근거자료를 마련하기 위하여 본 데이터를 구축하였다. 본 데이터는 2015년부터 2025년까지 부안군 관내에서 발생한 가축분뇨 관련 악취민원을 연도별로 집계한 자료로, 민원발생연도, 민원건수, 데이터기준일 항목으로 구성되어 있다.데이터는 행정기관의 민원접수시스템 및 환경부서 내부 관리대장을 근거로 수집되며, 개인정보를 제외하고 통계 형태로 정제되어 개방된다. 민원발생연도는 민원이 발생한 연도를, 민원건수는 연도별 총 접수 건수를 의미하며, 데이터기준일은 최신 자료 갱신일을 나타낸다.
