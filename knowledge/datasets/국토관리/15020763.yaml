summary_user: 구미시 관내에 등록된 공장을 한 건씩 담은 명부 파일로, 회사명·공장 대표주소·업종명·종업원수·관리기관 정보를 담는다. 지역경제 분석가나 기업 유치 담당자가 "구미시 일반 지역에 어떤 업종 공장이 어디에 얼마나 있나"를 파악하는 데 쓴다. 실측 컬럼에 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어, 다른 데이터와는 회사명·주소 문자열이나 업종명 매핑으로만 이어 쓴다.
description_portal: 경상북도 구미시 공장 등록 현황에 관한 데이터로, 구미시 관내에 등록된 공장의 회사명, 주소, 업종명 등 기본 정보를 포함하고 있습니다. 해당 자료는 일반적인 공장 등록 현황을 파악하기 위한 기초자료로 활용되며, 산업 구조 분석, 지역경제 현황 진단, 입지 정책 수립 등에 유용하게 쓰일 수 있습니다. 이를 통해 구미시 관내 공장 분포 현황을 지역 단위로 분석하거나, 산업 정책 수립 및 기업 유치 전략 등에 참고할 수 있는 공공 데이터입니다. 단, 한국산업단지공단에서 관리하는 국가산업단지 내 공장 정보는 본 데이터에 포함되어 있지 않습니다.
