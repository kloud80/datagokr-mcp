summary_user: 낙동강 하굿둑의 유역평균강우량을 10분·시간·일 단위 시계열로 담는 관측 데이터이며, 계측시각(또는 관측일)별 강우량 값으로 구성되고 개발계정 기준 일 10,000회까지 호출한다. 하굿둑 운영이나 낙동강 하류 수위·홍수 상황을 분석하는 사람이 '지난 몇 시간 동안 하굿둑 유역에 비가 얼마나 왔나'를 확인하는 데 쓴다. 실측 컬럼에 관측소코드 같은 공통 조인 키가 없어 다른 수문 자료와는 계측시각을 맞추거나 하굿둑이라는 이름으로 매핑해 이어 써야 한다.
description_portal: '한국수자원공사의 낙동강 하굿둑의 강우량 현황 정보입니다. 낙동강 하굿둑 강우량의 현황은 10분별, 시간별, 일별로 제공하는 오픈 API(Open API) 서비스 입니다.O 제공항목 : 낙동강 하굿둑 강우량(10분별, 시간별, 일별)O 데이터포맷 : JSON+XMLO 유의사항 : 하굿둑 강우량 현황은 유역평균강우량 정보로 실제 강우량과 상이할 수 있습니다. * 강우량 : 일정한 기간 동안 내린 비의 양으로, 넓은 의미로 눈, 싸락눈, 우박, 이슬 및 서리의 양도 포함*해당 자료는 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어, 이용자의 편익 증진과 신산업 창출에 기여합니다.'
