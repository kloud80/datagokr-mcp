summary_user: 경기도에서 준공된 생태하천복원사업을 사업(하천) 단위로 담은 시도 범위의 비공간 자료로, 시군명·하천명·준공연도·총사업비·국비·지방비·데이터 기준일자를 담는다. 도민이나 환경정책 분석가가 '우리 시군에서 언제 어느 하천이 복원됐고 국비와 지방비가 얼마씩 들었나'를 확인하거나 시군별 복원 투자 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 하천 목록·하천구역 자료와는 시군명(sigun_nm)이나 하천명 같은 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도 내 생태하천복원사업의 준공 현황을 보여주는 자료로, 하천의 생태적 기능 회복과 지역 주민의 쾌적한 생활환경 조성을 목적으로 시행된 사업들의 결과를 담고 있습니다. 생태하천복원사업은 하천의 자연성 회복, 수질 개선, 생물 다양성 증진 등을 목표로 하며, 도심 내 하천의 콘크리트 제방을 자연형으로 개선하거나 하천 주변 친수공간을 조성하는 등의 다양한 형태로 추진됩니다. 본 데이터에는 사업이 완료된 하천의 명칭, 사업 규모, 준공 연도, 사업비 등의 정보가 포함되어 있으며, 경기도의 지속 가능한 환경정책 이행 현황과 향후 생태복원계획 수립을 위한 참고 자료로 활용될 수 있습니다.
