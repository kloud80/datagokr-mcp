summary_user: 전북특별자치도 내 산업단지를 단지 한 곳당 한 행으로 정리한 현황 파일(CSV, 약 7.7KB)로, 단지 유형·시군·조성상태, 지정·관리면적(천㎡), 산업시설구역의 분양대상·분양·미분양 면적과 분양률, 입주·가동업체 수를 담는다. 기업 입지 담당자나 지역 산업 분석가가 '전북 어느 시군의 어느 산업단지에 아직 미분양 산업용지가 남아 있고, 입주 업체 중 실제 가동 중인 곳은 몇 개인가'를 확인하는 데 쓴다. 실측 컬럼에 산업단지코드 같은 전역 조인 키가 없어, 전국산업단지 및 공장정보 표준데이터나 국토부 산업단지 일반현황·경계도면과는 단지명·시군 이름을 맞춰 연결해야 한다.
description_portal: 본 데이터는 전북특별자치도 내 산업단지 현황 정보를 제공하는 엑셀 자료(CSV)입니다. 주요 항목으로 단지명, 지정/관리면적, 산업시설구역의 분양 현황(분양대상,분양,비분양 면적 및 분양률), 입주 및 가동업체 수 , 조성 상태 등을 포함하고 있습니다. 도내 산업단지의 개발 현황 분석 및 기업 입지 선정을 위한 기초 행정 자료로 유용하게 활용할 수 있습니다. 아울러 현재 단지 내 입주 및 가동 중인 업체 수 정보를 포함하고 있어 지역 산업 생태계 분석과 공공 연구에 유용합니다.사용 단위로는 면적:천제곱미터/ 분양률:퍼센트/ 업체:개/ 로 작성되어 있습니다.
