summary_user: 경기도 연천군 안의 공장·제조업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 41KB)로, 단지명(개별입지 또는 연천BIX은통·백학·청산대전 등 산업단지), 회사명, 소재지·도로명주소, 전화·팩스, 생산품, 업종명, 종업원수를 담는다. 연천군에 어떤 업종의 공장이 어느 산업단지나 개별입지에 얼마나 모여 있는지, 종업원 규모가 어느 정도인지 알아보려는 투자유치 담당자·지역경제 분석가·거래처를 찾는 사업자가 쓴다. 사업자번호·업종코드(KSIC)·필지번호(PNU) 같은 전역 조인 키가 없어 다른 데이터와는 회사명·주소 문자열 매칭이나 같은 기관(연천군) 기준으로만 이어 쓴다.
description_portal: 경기도 연천군 내 공장 및 제조업체 현황 정보를 종합적으로 제공하는 데이터로, 단지명(개별입지 및 산업단지), 업체명, 소재지, 도로명주소, 연락처(전화·팩스), 생산품, 업종명, 종업원수 등의 항목을 포함하고 있다. 본 데이터는 연천BIX은통일반산업단지, 연천백학일반산업단지, 청산대전일반산업단지 등 주요 산업단지와 개별입지 기업 정보를 모두 포괄하고 있어 지역 산업 구조를 파악하는 데 유용하다. 식품가공, 금속가공, 화학제품, 플라스틱, 섬유, 기계 및 전기전자 등 다양한 제조업 분야의 기업 분포와 생산 특성을 확인할 수 있으며, 기업 규모(종업원수) 정보를 통해 산업 규모 분석도 가능하다. 또한 기업 위치 정보와 주소 데이터를 기반으로 지도 서비스 및 산업 입지 분석, 투자 유치, 지역경제 연구 등에 활용될 수 있다. 본 데이터는 연천군의 산업 기반 및 기업 활동 현황을 체계적으로 제공하는 기초자료로서 공공·민간 분야에서 폭넓게 활용 가능하다.
