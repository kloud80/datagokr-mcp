summary_user: 서울시설공단이 2008년부터 수행한 공사를 건별로 담은 준공 이력 파일로, 공사명·계약업체명·착공일자·준공기한·실제 준공일자를 한 행에 담는다(약 95KB CSV). 공단 공사가 준공기한 안에 끝났는지, 특정 업체가 맡은 공사의 일정 준수 이력이 어떤지 확인하려는 분석가·사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 업체명이나 공사명 같은 이름 매칭, 또는 같은 기관(서울시설공단)의 다른 데이터와 기관 단위로만 이어 쓴다.
description_portal: 서울시설공단 공사 준공 정보는 2008년부터 현재까지 공단이 수행한 다양한 공사 사업의 추진 이력을 체계적으로 정리한 데이터로, 계약업체, 착공일자, 준공기한, 실제 준공일자 등 핵심 정보를 포함하고 있습니다. 이 데이터는 실제 준공일자가 가장 최근인 순서로 정렬되어 있어 공사 진행 현황을 직관적으로 파악할 수 있으며, 각 사업의 일정 준수 여부, 지연 요인 분석, 계약 수행 능력 평가 등 다양한 행정·관리 목적에 활용될 수 있습니다. 또한 공사 이력 전반을 파악함으로써 향후 사업 계획 수립, 예산 편성, 공사 품질 관리 등 정책적 의사결정을 지원하는 데에도 유용한 기반 자료로 활용됩니다.
