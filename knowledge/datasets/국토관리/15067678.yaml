summary_user: 과거 위성영상(1973-10-08~2004-09-30 촬영분)의 씬별 주문형 성과를 밴드(청색~근적외·전정색 등 파장대) 파일 단위로 한 행씩 담은 메타데이터 목록이며, 밴드번호·최소/최대 파장대역·이미지 라인·픽셀 수와 간격·브라우즈 영상명을 담는다. 분석가나 연구자가 특정 과거 위성영상 씬에 근적외 밴드가 있는지, 각 밴드의 해상도(픽셀 간격)는 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없고, 같은 기관의 구 위성영상 씬·파일 정보와는 파일식별자·컴포넌트번호로 맞춰 이어 쓴다.
description_portal: '과거 위성영상의 씬별 주문형 성과에 대하여 세부 밴드(R,G,B,NIR 등 파장대별 이미지) 파일에 대한 정보 관리▷ 식별정보 : 파일식별자, 컴포넌트번호, 밴드번호, 밴드식별자▷ 속성정보 : 최소파장대역, 최대파장대역, 파장대역단위, 파장대역설명(Blue~Near infrared(전정색)), 밴드이미지라인, 밴드이미지픽셀, 밴드이미지라인간격, 밴드이미지브라우즈영상명* 위성영상 : 지구 궤도를 도는 인공위성이 지표면을 촬영한 이미지로 지도제작 및 지형분석 등에 활용됨. - 1973-10-08 ~ 2004-09-30 범위의 과거 위성영상 보유'
