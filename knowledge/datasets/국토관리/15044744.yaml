summary_user: 광진구 관내 건축물의 허가·신고와 착공 처리 내역을 담은 파일 데이터이다. 범위는 시군구, 단위는 필지·건물이며, 한 행에 대지위치, 대지·건축·연면적, 건폐율·용적률, 허가·신고일·착공처리일·사용승인일, 주용도, 층수, 세대수가 들어 있다. 부동산 개발업자나 지역 분석가가 "최근 광진구 어느 동에서 어떤 용도의 신축 착공이 늘고 있나"처럼 지역 개발 흐름을 앞서 살피는 데 쓴다. 전역 조인 키(건물관리번호·PNU 등)는 실측 컬럼에 없어서, 다른 데이터와 잇는 방법은 대지위치 주소를 매칭하거나 같은 기관 코드로 묶는 것뿐이다.
limits: 표준 식별 키가 없어 건축물대장·공시지가 등과 바로 조인되지 않고, 주소 문자열 정제와 지오코딩을 거쳐야 한다. 광진구 한 곳의 자료이므로 다른 자치구와 비교하려면 각 구의 파일을 따로 모아야 한다.
