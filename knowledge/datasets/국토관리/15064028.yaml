summary_user: 국토지리정보원 NGTN(OpenAPI)이 제공하는 API 서비스의 분류표로, 분류 코드(class_cd)별로 분류 명칭, 기능 설명, 2D·3D·DP 같은 분류 구분, 삭제·표시 여부를 담은 약 2KB 규모의 작은 CSV 코드표입니다. 재난·공간정보 시스템을 만드는 개발자나 공공기관 담당자가 'NGTN의 어떤 API가 지도 제어용이고 어떤 API가 피해예측정보 표출용인가'를 확인하고 API 카탈로그나 호출 관리 체계를 짤 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 분류 코드나 분류 명칭을 NGTN API 목록에 이름·코드로 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 'NGTN(OpenAPI)에서 제공하는 API 서비스 분류표로, 각 API의 기능, 분류 코드, 설명 등을 포함하고 있어 재난·공간정보 활용 시스템에서 API 탐색과 통합관리를 돕는 데이터입니다.1. 형식: CSV2. 내용 요약■ class_cd: API 분류 코드 (예: Q, R, I 등)■ class_nm: API의 분류 명칭 (예: 지도제어도구 API, 피해예측정보 표현 2D API 등)■ class_dc: API 기능에 대한 설명 (예: 지도 이동, 확대/축소, 피해예측정보 표출 등)■ delete_at: 해당 API 분류의 삭제 여부 (Y/N)■ indict_at: 시스템에 표시되는 여부 (Y/N)■ class_se: API 분류 구분 (예: 2D, 3D, DP 등 시각화 및 데이터 처리 유형)3. 활용 예제■ 공공기관이나 민간기업이 NGTN의 다양한 API 서비스를 기능별로 분류하여 통합 연계 시스템 구축 시 자동 분류 및 호출 관리에 활용■ API 카탈로그 문서화 자동화, 지도 서비스 및 재난정보 시각화 플랫폼 구축 시 API 분류 기준으로 기능 매핑 및 UI 설계에 참고■ 신규 API 개발 또는 오픈소스 연계 시 기존 API 분류 기준을 참고하여 기능 유사성 분석, 중복성 제거, 기능 분류 재정립 등에 활용 가능'
