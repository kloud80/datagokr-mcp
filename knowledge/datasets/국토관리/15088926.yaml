summary_user: 주택분양보증을 받아 분양한 30세대 이상 민간 신규아파트(주상복합 제외)의 분양기간 3개월 초과 6개월 이하 평균 초기분양률을 지역(시군구 열)별·분기별로 담은 집계 파일로, 열은 2021년 1분기부터 2026년 2분기까지 이어진다. 분양 사업자나 수요자·분석가가 '이 지역 신규 아파트는 분양 후 반년 안에 몇 %나 팔렸고 최근 분기에 나아졌나'를 확인하는 데 쓴다. 전역 조인 키는 없어 미분양·분양가격 등 다른 주택 통계와는 지역 이름을 맞춰 연결해야 한다.
description_portal: '주택분양보증을 받아 분양한 전체 민간 신규아파트 초기분양률 자료를 제공합니다.조사의 목적은 전국 민간분양 아파트의 지역별 초기분양률 현황 자료를 작성·공표함으로써 주택공급자의 원활한 사업 활동 및 국민의 주택구매 의사결정을 지원함과 동시에 주택관련 연구 및 정책 수립을 위한 기초정보를 제공하는 것입니다. *조사범위 : HUG 주택도시보증공사의 주택분양보증(주상복합제외)이 발급되고 입주자 모집승인을 받아 분양한 민간아파트*조사지역 : 전국*조사내용 : 초기분양률조사주기는 분기이며, 조사방법은 분양세대수 30세대 이상 아파트 전수조사입니다. 작성지표는 분양기간 3개월 초과 6개월 이하 민간아파트의 지역별 평균 분양률입니다. 해당 데이터는 주택도시보증공사 홈페이지 및 통계청 KOSIS에서도 확인가능하오니 참고하시기 바랍니다.'
