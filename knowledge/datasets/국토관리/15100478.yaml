summary_user: 경상남도 양산시 관내 사출성형기 제조업체를 업체 한 곳당 한 행으로 담은 명부로, 회사명·주소·전화·팩스·생산품·업종번호·업종명을 수록하며 파일 크기가 645바이트에 불과한 소규모 목록이다. 사출성형기나 관련 부품을 양산 지역에서 조달하려는 사업자가 어느 업체가 무엇을 만들고 어디로 연락하면 되는지 확인하는 데 쓴다. 실측 컬럼에 사업자번호나 필지번호 같은 전역 조인 키가 없어서, 다른 공장등록·기업 데이터와는 회사명·주소 문자열 대조나 업종번호(표준산업분류 코드로 보이는 값) 매핑으로만 이어 쓴다.
limits: 사업자등록번호·필지번호(PNU) 같은 공통 키가 없어 팩토리온 공장등록 정보나 기업 데이터와 정확히 연결하기 어렵고, 이름과 주소 문자열로 맞추는 수밖에 없다. 범위가 양산시 한 곳의 사출성형기 업종에 한정되므로 다른 지역이나 다른 업종 현황은 담지 않는다.
