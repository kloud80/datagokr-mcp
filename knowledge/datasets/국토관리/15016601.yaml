summary_user: 경주시 관내에 등록된 골재채취업체를 업체 한 곳당 한 행으로 담은 파일 데이터로, 상호·사업장 주소·전화번호·데이터기준일을 담는다(csv 약 2KB 규모). 건설업체나 자재 조달 담당자가 경주 지역에서 골재를 공급받을 수 있는 등록 업체가 어디에 있고 연락처가 무엇인지 확인하는 데 쓴다. 실측 컬럼에 사업자번호·법정동코드 같은 공통 조인 키가 없어, 다른 데이터와는 주소를 지오코딩하거나 상호 이름을 맞춰 붙여야 한다.
description_portal: 경상북도 경주시에서 제공하는 골재채취업 등록현황 데이터는 관내 골재채취업체의 등록정보를 체계적으로 관리하고자 마련된 자료로, 파일 데이터 형식으로 제공된다. 본 데이터는 업체명 상호, 사업장 주소, 전화번호 등 주요 항목을 포함하고 있으며, 건설 자재 수급 및 관리, 환경영향 평가, 지역 개발 정책 수립 등의 행정적 활용을 목적으로 한다. 또한 관련 업계 종사자나 정책 담당자들이 골재 채취에 관한 정보에 효율적으로 접근할 수 있도록 지원하며, 데이터는 정기적으로 갱신되어 공공성과 신뢰성을 확보하고 있다. 산업 동향 분석 및 규제 관리 등에도 활용 가능한 본 데이터는 지역 자원 관리의 투명성과 효율성을 제고하는 데 기여한다.
