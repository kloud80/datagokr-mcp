description_portal: 본 API 데이터는 한국산업단지공단 주요국가산업단지 산업동향 통계입니다. 한국산업단지공단에서는 주요국가산업단지 산업동향 정보를 분기별로 제공하고 있으며, 본 데이터는 국가산업단지별 입주, 가동, 입차업체수, 생산, 수출, 가동률, 고용인원 등을 제공합니다. 총 12개 유형별 현황의 년월을 입력 시 해당 기간 데이터를 제공 받을 수 있습니다. * 국가산업단지 업종별 입주, 가동, 임차업체수 등 * 국가산업단지 업종별 산업생산 및 수출, 가동률 등(생산, 수출, 가동률은 제조업 가동업체만을 조사대상으로 함) * 국가산업단지 업종별 고용인원
