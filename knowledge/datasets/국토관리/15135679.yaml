description_portal: 지적불부합지라 함은 실제와 지적공부 상에 등록된 각종 토지 관련 정보가 일치하지 않는 것을 말한다. 2012년 시작된 지적재조사사업은 종이 지적도를 디지털화하여 우리 땅의 가치를 높이고, 공간정보산업의 토대를 닦는 사업이다. 지적재조사 사업이 시행됨에 따라 새로운 디지털 지적정보를 구축하고 있는 가운데 지적불부합지를 구축하기 위한 활용 데이터 표준화 및 분석 과정 정형화 통해 지적불부합지 표준분석모델을 구축한다.지적불부합지 표준분석모델은 실제 지적상 등록된 토지 관련 정보가 일치하지 않는 지역을 빅데이터 분석 플랫폼을 통해 전국을 한 번에 비교 분석하여 미일치 지역을 도출하는 것에 목적을 두고 있다. 실제상 도로(새 주소 도로 구간)와 연속지적도 상의 도로가 아닌 지적정보 추출
