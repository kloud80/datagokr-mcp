description_portal: 본 데이터는 수도 계량기의 연도별 교체 실적과  계량기 교체 사유에 대한 정보를 담은 자료입니다. 연도별로 교체된 수도 계량기 수량과 함께, 교체 사유가 기재되어 있습니다. 교체사유로는 크게 만기(검정 유효기간 도래), 폐전, 동파로 구분되며 각 사유별 교체 수량을 포함하고 있습니다. 수도 계량기 교체는 정확한 수도 검침과 안정적인 급수 서비스 제공을 위해 필요한 조치로, 교체 사유별 실적 공개를 통해 시민의 이해도를 높이고 유지관리의 투명성을 제고하고자 합니다. 해당 데이터는 연도별로 업데이트 될 예정입니다.
