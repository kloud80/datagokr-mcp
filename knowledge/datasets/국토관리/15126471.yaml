summary_user: 신고된 아파트 분양권 전매 실거래를 건별로 담으며, 단지·전용면적·층·거래금액(만원)·계약일·해제 여부·매도자와 매수자 구분을 필드로 둔다. 시군구와 계약년월을 지정해 특정 지역 분양권 전매 가격이 어느 수준인지, 해제된 거래가 있는지 확인하려는 사업자나 분석가가 쓴다. 지역코드(sggCd, 키 sgg_cd)로 같은 실거래 부문의 다른 거래 유형 API와 지역 단위로 이어 쓴다.
description_portal: '「부동산 거래신고 등에 관한 법률」에 따라 신고된 자료로서 행정표준코드관리시스템(www.code.go.kr)의 법정동 코드 중 앞5자리(예시 : 서울 종로구 - 11110), 계약년월(예시 : 201801)로 해당 지역, 해당 기간의 아파트 분양권 전매 신고정보를 조회할 수 있습니다.API 설명 : 지역코드와 기간을 설정하여 해당지역, 해당기간의 아파트 분양권 전매 실거래가 자료를 제공하는 아파트 분양권 전매 실거래가 정보 조회. 세부사항 참고자료 참고.* 공개내용 중 개인정보보호를 위해 아파트 분양권 전매의 층정보만 제공됩니다.'
