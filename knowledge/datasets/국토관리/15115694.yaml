description_portal: 한국장학재단 창업기숙사는 창업에 관심이 있는 예비 창업자 또는 기창업자인 대학(원)생들이 시간과 공간에 구애받지 않고 창업에 전념할 수 있도록 주거와 창업준비 공간을 무상으로 지원하여 대학생의 주거와 창업비용 부담 경감뿐만 아니라 다양한 창업 지원 프로그램을 통한 창업 활성화 지원으로 누구나 창업에 도전할 수 있는 환경을 제공합니다. 해당 공공데이터는 센터명, 주소, 연락처, 연면적 규모, 입주정원, 주거지원 공간, 창업활동 공간 정보를 제공합니다. 창업기숙사 관련 상세 정보는 한국장학재단 누리집 "창업기숙사 온라인 홍보관"(http://startup.kosaf.go.kr/)을 참고 바랍니다.
