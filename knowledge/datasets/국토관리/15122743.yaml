summary_user: 광진구 공동주택을 행정동별로 나눠 2000·2005·2010·2015·2020년 다섯 시점마다 노후기간(20년 이상 30년 미만, 30년 이상)별 현황을 담은 집계 표이며, 파일은 439바이트 크기의 작은 CSV다. 구청·연구자·주민이 '광진구에서 30년 이상 된 공동주택이 어느 동에 몰려 있고 시점별로 어떻게 늘었나'를 보고 재건축·리모델링, 안전점검 대상 지역을 가늠하는 데 쓴다. 전역 조인 키(행정동 코드 등)가 없어 행정동 이름을 매핑해 같은 구의 인구·주택 통계와 이어 써야 한다.
description_portal: 서울특별시 광진구_노후기간별 공동주택 현황 데이터는 광진구 내 공동주택의 건축 연한을 기준으로 노후화 정도를 구분하여 제공하는 공공데이터입니다. 주요 항목은 노후기간 구분(20년 이상 30년 미만, 30년 이상)과 동별 공동주택 현황으로 구성되어 있으며, 지역별 주택 노후화 현황을 체계적으로 분석할 수 있도록 지원합니다. 노후기간 구분 항목은 건축물의 사용 연한을 기준으로 주거 환경의 유지·관리 상태를 평가하는 지표로 활용되며, 재건축 및 리모델링 정책 수립의 핵심 데이터가 됩니다. 동별 공동주택 현황은 행정동 단위로 주택의 분포와 노후화 비율을 파악할 수 있어 지역별 균형 있는 도시 계획 수립에 기여합니다. 본 데이터는 도시 재생사업, 공동주택 관리계획, 주택 안전 점검, 인구 및 주거 환경 분석 등 다양한 행정·정책 분야에서 활용될 수 있으며, 광진구의 지속 가능한 주거 환경 개선과 노후주택 관리 정책 수립을 위한 기초 자료로 중요한 역할을 합니다.
