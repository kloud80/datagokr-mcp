summary_user: 창업보육센터에 입주한 기업을 한 행씩 담은 건별 명단으로, 소재지·센터명·운영기관명·기업명·대표자명·창업일·입주일·기업형태·업종·주생산품을 전국 범위로 담는다(CSV 파일 약 877KB). 창업 지원 기관이나 분석가가 "어느 지역 창업보육센터에 어떤 업종의 초기 기업이 언제 입주해 있는가"를 확인하거나, 영업·협업 대상 기업을 찾는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어서 다른 데이터와는 센터명·기업명·소재지 같은 이름이나 주소를 맞춰서만 이어 쓴다.
