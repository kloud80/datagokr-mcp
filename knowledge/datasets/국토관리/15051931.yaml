summary_user: 서울특별시 하천기본계획에 실린 댐·홍수조절지·저류지 시설물대장을 시설 한 곳당 한 행으로 담으며, 시설명·하천명·하천등급·위치와 함께 유역면적, 홍수기 제한수위·상시만수위, 홍수조절용량·총저수용량, 설계방류량·계획홍수량, 여수로·제방 제원 같은 계획상 제원을 수록한다. 치수 담당자나 분석가가 "우리 동네 하천 상류의 저류지는 홍수를 얼마나 담아 둘 수 있나"처럼 시설별 홍수조절 능력을 확인하거나, 개발·재해영향평가에서 주변 홍수 저감 시설을 파악하는 데 쓴다. 전역 조인 키는 없으므로, 같은 기관의 하천기본계획 자료와는 하천기본계획 코드(RVR_BSC_PLAN_CD)나 하천명으로 맞추고, 다른 기관 자료와는 시설명·하천명을 손으로 대조해 잇는다.
description_portal: '하천기본계획은 하천의 이용 및 관리에 필요한 기본적인 사항 등을 내용으로 하며 유역의 강우, 하천의 유량, 하도특성 및 이용현황 등을 조사 분석하여 하천의 종합적인 정비, 보전, 이용에 대한 계획을 수립합니다. 하천기본계획의 내용중 댐/홍수조절지/저류지 시설물대장의 정보를 조회할 수 있습니다.*용어설명홍수조절지는 하천의 홍수량을 일시적으로 저장해 첨두유량(피크)을 낮추고, 하류 침수 피해를 줄이는 시설입니다. 제방·호안·하천기본계획과 긴밀하게 연결되며, 개발·재해영향평가·친수공간 조성에도 영향※ 제공부서 : 서울특별시 물순환안전국 치수안전과(02-2133-3886)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
