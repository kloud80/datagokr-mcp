summary_user: 경기도 시군별로 지역화폐 이용 실적을 기준연도(crtr_yr)·연령대·성별로 나눠 결제 건수·결제금액을 담은 집계 통계이며, 결제 취소 건수·취소금액과 1회 평균 결제금액은 시군에 따라 제공 여부가 다르다. 정책 담당자나 분석가가 "우리 시군에서 지역화폐를 가장 많이 쓰는 연령대와 성별은 누구이고 1건당 얼마를 쓰는가"를 확인해 소비 활성화 정책이나 맞춤형 프로모션을 설계할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)과 기준연도를 이름으로 맞춰 연결해야 하며, 같은 기관(경기도)의 다른 지역화폐 통계와 함께 쓰는 것이 현실적이다.
description_portal: 이 데이터는 경기도 각 시군에서 지역화폐를 사용하는 도민들의 연령대 및 성별별 이용 현황을 보여주는 통계자료로, 지역화폐의 수요 특성과 이용 행태를 분석하는 데 활용됩니다결제 취소 건수와 취소금액, 1회 평균 결제금액은 선택제공항목으로 시군별로 제공 여부가 상이할 수 있으며 결제 오류, 반품, 환불 등의 거래 특성과 1건당 소비 규모를 분석하는 데 활용됩니다. 이 자료는 성별 및 연령별 지역화폐 이용 경향 분석, 지역 소비 활성화 정책 설계, 사용자 대상 맞춤형 프로모션 전략, 연령 맞춤형 소비 유도 등 다양한 정책 및 마케팅 분야에 활용 가능합니다.
