description_portal: '지적재조사사업은 일제강점기인 1910년대에 만들어진 낡은 종이지적도를 디지털화하고, 지적도와 실제 토지 현황이 일치하지 않는 문제를 해결하기 위해 추진되는 국가사업입니다.<사업의 목적과 필요성.-지적 불일치 해소: 100여 년 전에 만들어진 지적도는 측량 기술이 낙후되었고, 오랜 시간이 지나면서 마모되거나 훼손되어 실제 토지의 모습과 일치하지 않는 경우가 많습니다. 이러한 "지적 불부합지"는 전체 국토의 약 15%를 차지합니다.-국민 재산권 보호: 지적 불일치로 인해 발생하는 이웃 간의 경계 분쟁을 해결하고, 토지 소유자의 재산권을 명확하게 보호하기 위함입니다.-디지털 지적 구축: 아날로그 종이지적을 최신 측량 기술을 활용한 디지털 지적으로 전환하여, 국토의 효율적인 관리와 다양한 공간정보산업 활성화의 기반을 마련합니다.-국토의 가치 증진: 불규칙한 토지 모양을 반듯하게 정리하거나, 맹지(도로에 접하지 않은 땅)에 도로를 확보해주는 등 토지의 활용 가치를 높이는 데 기여합니다.'
