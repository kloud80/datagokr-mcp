summary_user: 경기도 시군별·업종 중분류별로 지역경제 활성화 수준을 수치화한 '활성화비율'(vtlz_rt)을 기준년월 단위로 집계한 자료로, 건별 원천이 아닌 집계 지표이다. 지자체 정책 담당자나 상권 분석가가 '우리 시군에서 어떤 업종의 소비·거래가 다른 업종보다 활발한가, 월별로 어떻게 변했나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드와 중분류업종코드를 포털 파일 탭의 코드값 파일(2024년도 분석시스템 코드값)로 이름에 매핑한 뒤, 같은 경기도 분석 계열 데이터나 시군명 기준으로 이어 쓴다.
description_portal: 이 데이터는 경기도 각 시군의 업종별 지역경제 활성화 수준을 나타내는 지표인 '활성화비율'을 기준으로 집계된 자료입니다. ‘기준년월’을 기반으로 한 시계열 분석이 가능하며, ‘시군코드’를 통해 지역별 데이터를 식별할 수 있습니다. ‘중분류업종코드’는 업종을 분류하는 코드로, ‘활성화비율’은 해당 지역 내 업종의 경제활동 수준을 수치로 표현한 지표입니다. 수치가 높을수록 해당 업종의 소비·거래가 활발함을 의미합니다. * 해당 데이터셋의 코드 값은 파일 서비스 탭 2024년도_분석시스템_데이터셋_코드값을 다운받으시면 확인 가능합니다.
