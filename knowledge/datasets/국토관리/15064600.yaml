description_portal: '- 제주특별자치도개발공사는 도내 무주택 서민의 내집마련 기회제공 및 주거취약계층의 주거 안정에 기여하고자 통합공공임대주택을 건설하고 공급하고 있습니다. - 개방 데이터는  수요자 맞춤형 공공임대주택 공급계획을 제공하고 있습니다. - 본 데이터는 지구명, 주소, 전용면적, 공급호수, 준공시기, 공급우형, 공급예정시기, 입주예정시기를 포함한 데이터입니다. - 해당 모집이 이루어지는 임대주택 명칭을 확인할 수 있고, 신청일정과 시기를 파악하는데 활용됩니다. 또한, 시민의 임대주택 신청 편의 향상, 수요 기반의 공급 정책 수립, 모집 계획의 투명한 공개를 통해 공공주택 운영의 공정성과 효율성을 제고하는 것에 목적을 두고 있습니다. 주택복지 실현을 위한 기초자료로 활용될 수 있습니다.'
