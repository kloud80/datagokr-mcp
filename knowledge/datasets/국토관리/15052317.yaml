description_portal: 경상북도 경주시에서 제공하는 공동주택 현황 데이터는 관내 공동주택의 유형, 세대 수, 주소, 사용승인일, 시행사 및 시공사 정보를 포함하는 링크형 공공데이터이다. 본 데이터는 아파트, 연립주택, 다세대주택 등 다양한 공동주택 유형을 포괄하며, 단지명, 위치, 건축규모, 건축년도, 세대수 등의 항목으로 구성되어 있다. 해당 자료는 주거정책 수립, 인구 분석, 도시계획 및 기반시설 관리 등 행정 목적뿐 아니라, 시민들의 주거지 탐색, 부동산 정보 파악 등 실생활에도 유용하다. 데이터는 경주시 누리집을 통해 정기적으로 공개되며, 최신 정보가 반영되어 지속적으로 갱신된다. 이용자는 제공된 링크를 통해 공동주택 관련 자료를 신속하게 확인할 수 있다.
