description_portal: 'ㅁ 개요 : 가뭄 분석 정보 제공을 위한 북한의 GTS 관측소코드, 관측소명, 표고 등 북한 GTS 관측소 시설 제원정보 데이터 항목을 제공합니다.공공데이터 개방은 다양한 기관의 연구와 정책 수립, 산업 발전, 시민 생활 개선 등 여러 분야에서 활용되어 사회 전반의 혁신과 가치 창출에 도움이 됩니다.* 해당파일은 별도 로그인 없이 다운로드 하실수 있습니다.ㅁ 매체유형 : 텍스트ㅁ 전체 행 : 27ㅁ 확장자 : CSVㅁ 제공형태 : 공공데이터포털에서 다운로드(원문파일등록)ㅁ 제공속성- 관측소 코드 / 샘플 : 47003- 관측소 명 / 샘플 : 선봉- 관측개시일 / 샘플 : 1973- 표고 / 샘플 : 3* 2025년 9월 12일 기준으로 "한국수자원공사_북한 GTS 관측소 제원정보"의 데이터에 대한 변경사항은 없습니다.보다 자세한 사항은 국가가뭄정보포털(www.drought.go.kr), (가뭄관련 담당자 연락처 안내 : https://www.drought.go.kr/menu/m10/m13.do)로 문의하여 주시기 바랍니다.'
