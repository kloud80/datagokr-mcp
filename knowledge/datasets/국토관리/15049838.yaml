summary_user: 북한 GTS 관측소의 관측소 코드, 관측소명, 관측개시 연도, 표고를 관측소 한 곳당 한 행으로 담은 제원 목록이며, 포털 설명 기준 27행(CSV 595바이트)의 작은 파일입니다. 가뭄 분석가나 연구자가 '북한 강수·기상 자료를 낸 관측소가 어디이고 언제부터 관측했는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 북한 관측 자료와는 관측소 코드나 관측소명을 직접 맞춰서 연결한다.
