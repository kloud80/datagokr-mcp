description_portal: 인천광역시 상수도사업본부가 제공하는 연도별 상수도 급수량 현황 공공데이터는 2012년부터 2024년까지의 상수도 공급 상황을  정리한 자료입니다.이 데이터는 크게 세 가지 항목으로 나뉘어 있습니다.1. 일평균 급수량은 하루 동안 인천시 전체에 공급된 상수도의 평균 총량을 의미합니다. 도시 전체가 하루에 얼마나 많은 물을 쓰는지를 보여주는 지표입니다.2. 급수인구는 상수도를 공급받는 인구 수를 나타냅니다. 인천시민 중 실제로 상수도 서비스를 이용하는 사람들의 규모를 보여주며, 상수도 보급률과도 연결됩니다.3. 1인 1일 급수량은 급수인구 한 명이 하루에 평균적으로 사용하는 물의 양을 뜻합니다. 생활 수준, 물 사용 습관, 절수 정책의 효과 등을 파악할 수 있는 중요한 지표입니다.단위는 천㎥, 천명, L입니다.
