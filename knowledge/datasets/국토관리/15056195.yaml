description_portal: "본 데이터는 제주특별자치도 제주시 관내에서 현재 시공(건축)이 진행 중인 공동주택(아파트, 연립주택, 다세대주택 등)의 전반적인 건축 허가 및 착공 현황을 파악할 수 있는 공공 행정 통계 자료입니다.해당 데이터셋은 건축이 이루어지고 있는 정확한 '대지위치'와 토지의 성격을 나타내는 '지목' 정보를 제공하여, 제주시 내 신규 주거 인프라가 어느 지역에 집중적으로 조성되고 있는지 공간적 분포를 보여줍니다. 또한, 개별 건축 프로젝트의 규모를 구체적으로 가늠할 수 있도록 '대지면적', '건축면적', 전체 층의 바닥 면적을 합친 '연면적' 데이터를 제곱미터 단위로 수록하고 있습니다. 이와 함께 토지 활용의 밀도를 나타내는 도시계획 핵심 지표인 '건폐율'과 '용적률', 그리고 건축물의 뼈대를 구성하는 '구조(예: 철근콘크리트구조 등)' 정보를 포함하고 있어 건축물의 물리적 특성을 깊이 있게 분석할 수 있습니다.특히, 행정적인 승인 절차와 실제 공사 일정을 추적할 수 있도록 최초 '허가일'부터 '착공예정일' 및 실제 행정 처리가 완료된 '착공처리일'과 고유 '허가번호'까지 명시하고 있습니다. 이를 통해 제주시의 중장기적인 신규 주택 공급 물량 및 시기를 예측하고, 지역 내 부동산 건설 동향과 주거 개발 흐름을 체계적으로 모니터링하는 기초 행정 데이터로 활용될 수 있습니다."
