summary_user: 제주시 관내에서 시공 중인 공동주택을 건축 허가 건별로 담은 파일(csv, 약 11KB)로, 대지위치·지목·대지면적·건축면적·연면적·건폐율·용적률·구조와 허가일·착공예정일·착공처리일, 허가번호를 수록한다. 제주시에서 어느 지역에 어느 규모의 공동주택이 지어지고 있고 언제 착공했는지를 보고 향후 주택 공급 물량과 시기를 가늠하려는 분석가나 주민의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대지위치(주소)나 허가번호를 이름 매칭하는 방식으로만 이을 수 있다.
