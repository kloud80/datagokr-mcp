summary_user: 전북특별자치도 내 아파트 전월세 계약을 한 건씩 담은 원천 파일로, 단지명·소재지(시군구·번지)·전용면적·층·건축년도와 함께 전세/월세 구분, 보증금·월세, 계약기간, 신규·갱신 구분, 갱신요구권 사용 여부, 종전계약 보증금·월세를 담는다. 임차인이나 분석가가 '전주의 특정 아파트 단지에서 최근 전세 보증금이 얼마였고 갱신 계약 때 얼마나 올랐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구·번지(본번·부번)·도로명·단지명 같은 이름과 주소 매핑으로만 이어 쓴다.
limits: 법정동코드 같은 전역 조인 키가 없어 매매 실거래가나 공시가격 데이터와 연결할 때는 주소·단지명 매칭에 의존해야 한다. 실거래 신고는 계약 후 30일 안에 이루어지고 해제·정정이 소급 반영되므로, 최근 계약월의 건수와 금액은 공개 시점에 따라 달라질 수 있다.
