summary_user: 경기도 내 아파트 단지별·조사년월별 일반관리비를 인건비(급여·상여금·퇴직금), 4대 보험료, 전기·통신료, 청소·경비·소독·승강기 유지비, 위탁관리수수료 등 세부 항목으로 나눠 담는 단지 단위 자료다. 입주민이나 분석가가 우리 단지의 경비비·청소비가 비슷한 경기도 단지보다 높은지 비교하거나 관리비 구조를 분석하는 데 쓴다. 실측 컬럼에 단지코드 같은 전역 조인 키가 없어, K-apt 단지 기본정보·장기수선·실거래 자료와는 아파트명(apt_nm)으로 이름 매핑해서만 이어 쓴다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 아파트 일반관리비 정보로, 경기도 내 아파트 단지별 관리비 세부 항목을 포함합니다. 주요 항목에는 아파트명, 조사년월, 급여·제수당·상여금·퇴직금 등 인건비 관련 비용과 산재보험료, 고용보험료, 국민연금, 건강보험료 같은 4대 보험 항목이 있습니다. 또한 전기료, 통신료, 우편료, 청소비, 경비비, 소독비, 승강기 유지비, 수선비, 안전점검비, 위탁관리수수료 등 공공요금 및 시설 유지 관리 항목도 포함됩니다. 이 자료는 아파트 관리비 구조 분석, 단지별 관리비 비교 참고자료 등으로 활용 가능합니다.
