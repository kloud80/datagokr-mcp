summary_user: 전남개발공사가 개발해 공급하는 택지를 필지 단위로 담은 CSV 파일(약 5.8KB)로, 구분·소재지·가지번·면적(㎡)·㎡당 단가·공급예정가를 건별로 싣는다. 토지 구매를 검토하는 개인이나 사업자가 '전남개발공사가 공급하는 택지 중 어느 필지가 얼마에, 몇 ㎡ 규모로 나와 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소·지번을 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
