summary_user: 제주시 관내에 설치된 사용 가능한 옥상 전광판 대형 광고물을 한 건씩 주소·위치정보·광고주·연락처로 담은 개별 목록으로, 파일 크기가 779바이트에 불과한 소규모 CSV다. 광고를 내려는 사업자가 '제주시 어느 건물 옥상 전광판에 광고를 걸 수 있고 누구에게 문의하나'를 확인하거나, 분석가가 대형 옥외광고물의 지역 분포를 볼 때 쓴다. 다른 데이터와 잇는 공통 코드 키는 없어서, 주소나 위치정보를 행정구역·좌표로 매핑해 같은 지역의 다른 데이터와 맞춰 쓴다.
description_portal: 이 데이터는 제주특별자치도 제주시 관내에 설치되어 있는 사용 가능한 옥상 전광판 대형 광고물 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 도시재생과이며, 제주시 지역 내 옥상 전광판 형태의 대형 광고물에 대한 위치와 활용 정보를 종합적으로 파악할 수 있도록 구성되어 있습니다.데이터 항목은 주소, 위치정보, 광고주, 연락처 등으로 이루어져 있습니다. 주소 항목을 통해 각 옥상 전광판 대형 광고물의 소재지를 확인할 수 있으며, 위치정보를 통해 보다 구체적인 설치 위치를 파악할 수 있습니다. 이를 통해 광고물이 제주시 내 어느 지역에 분포하고 있는지 확인할 수 있습니다.또한 광고주 항목에는 해당 광고물과 관련된 광고주 정보가 포함되어 있어 광고물 운영 또는 관리 주체를 확인할 수 있으며, 연락처 항목을 통해 광고물 이용이나 계약, 문의 등에 필요한 실질적인 연락 정보를 확인할 수 있습니다.
