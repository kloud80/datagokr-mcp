description_portal: '○ 통계개요* 통계명 : 서울 랜드마크 인식* 통계종류 : 서울서베이의 서울시민 서울의 랜드마크 인식을 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의 현재상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을 모니터링하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년)  * 2010년 생산종료* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별ㆍ연령별ㆍ지역별ㆍ학력별 등)의 서울 랜드마크인식 현황 등○ 용어설명* 랜드마크(land mark) : 도시의 이미지를 대표하는 특이성 있는 시설이나 건물을 말하며,물리적ㆍ가시적 특징이 시설물뿐만 아니라 개념적이고 역사적인 의미가 있는 추상적공간도 포함됨○ 기 타* 1, 2순위 종합'
