summary_user: 경기도 파주시의 지적공부 등록 토지를 읍면동 단위로 묶어 총계와 전·답·임야·대·공장용지·도로 등 지목별로 집계한 파일 자료입니다(필지 건별 원천 아님). 파주시 각 읍면동의 농지·임야 비율이나 도시화 정도를 비교하려는 행정·계획 분석가가 '어느 읍면동에 임야나 대지 비중이 큰가'를 확인하는 데 쓴다. 전역 조인 키가 없어 읍면동명을 이름으로 맞추거나 같은 기관 자료와 대조하는 방식으로만 다른 인구·개발 통계와 이어 쓴다.
description_portal: 경기도 파주시 읍면동 단위로 토지의 이용현황을 지목별로 분류하여 집계한 공공기반 자료로, 총계 항목을 포함해 전, 답, 과수원, 임야, 대, 공장용지, 주차장 등 총 26개 지목으로 구성되어 있습니다. 이를 통해 지역별 토지이용 구조를 파악하고, 농지·임야 비율, 도시화 정도, 공공시설 비중 등을 정량적으로 분석할 수 있습니다. 행정계획, 부동산정책, 개발제한구역 설정, 난개발 방지, 국토균형발전 등의 정책 수립과 공간정보 분석에 기초자료로 활용되며, 기후위기 대응과 탄소흡수원 확보를 위한 임야 보호, 수변지 관리 등 환경계획에도 중요한 역할을 합니다.
