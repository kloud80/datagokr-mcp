summary_user: 남양주시 공간정보시스템의 도로시설물 레이어를 시설물 한 건씩 담은 파일로, 관리번호·지형지물부호·행정읍면동·관리기관·데이터기준일을 담는다. 과속방지턱, 교량, 육교, 자전거도로, 도로반사경 같은 도로시설물이 남양주시 읍면동마다 몇 개씩 GIS에 등록돼 있는지 보려는 분석가나 시 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 행정읍면동 이름이나 지형지물부호 매핑으로만 붙여 쓴다.
description_portal: 남양주시 공간정보시스템에 포함되어 있는 도로시설물 레이어에 대한 데이터로 관리번호, 지형지물부호, 행정읍면동, 관리기관 등의 항목을 제공합니다. 공간정보시스템 상 행정 읍면동별 지형지물(고가도로, 과속방지턱, 교량, 교통광장, 교통표지판, 도로반사경, 도로표지판, 미끄럼방지시설, 불법주정차금지구역, 육교, 자전거도로, 자전거보관소, 중앙분리대)의 피처 수를 참고할 수 있습니다.※ GIS 데이터 구축에 따른 자료이므로 실제 현황가 차이가 있을 수 있습니다. 도로기반시설물 사업에 따라 GIS 데이터가 추가, 수정, 삭제될 수 있습니다.
