summary_user: 농산어촌 지역개발사업으로 조성되는 전원마을을 지구(사업) 단위로 담아 지구명, 시도·시군구·읍면동명, 법정동코드, 계획세대수, 진행단계, 분양률을 제공하며, 범위는 전국이고 행정단위는 읍면동이다. 귀농·귀촌이나 전원주택 입주를 생각하는 사람이 '원하는 시군에 분양 중인 전원마을이 있고 분양률은 얼마인가'를 확인하거나, 분석가가 지역별 전원마을 조성 진행 현황을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 법정동코드(legalCode)나 시도·시군구명을 행정구역 코드표와 맞추는 방식으로만 다른 지역 통계와 이어 쓴다.
