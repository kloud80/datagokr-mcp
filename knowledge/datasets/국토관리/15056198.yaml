summary_user: 제주시 관내 공동주택 단지 안에 설치된 어린이 놀이시설을 단지별로 한 행씩 담은 목록 파일(약 20KB 규모 CSV)로, 시도·단지명·설치장소·운영주체·데이터기준일자를 담는다. 제주시 주민이나 주택 행정 담당자가 '우리 동네 어느 아파트 단지에 놀이터가 있고 누가 관리하는가'를 확인하거나 단지별 아동 놀이 인프라 분포를 살펴보는 데 쓴다. 전역 조인 키나 K-apt 단지코드가 없어 다른 공동주택 데이터(K-apt 단지 기본정보 등)와는 단지명 문자열을 맞춰 연결해야 한다.
