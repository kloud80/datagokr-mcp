summary_user: 제주특별자치도가 2007~2021년 관내에서 추진한 도시숲 조성 사업을 사업 건별로 기준 연도, 위치, 사업량(면적 ha·거리 km), 사업내용, 사업구간과 함께 담은 현황 자료다. 제주 도시계획·환경 담당자나 연구자가 '어느 지역에 어느 해에 얼마만큼 도시숲이 조성됐는가'를 확인해 녹지 공백 지역과 조성 우선순위를 따지는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치·사업구간 같은 지명을 이름으로 맞추거나 같은 제주특별자치도 기관 자료끼리만 이어 쓴다.
description_portal: '이 데이터셋은 제주특별자치도에서 2007년부터 2021년까지 관내에서 추진된 도시숲 조성 사업의 현황을 집계한 공공데이터로서, 각 사업의 시행 위치, 조성 연도, 사업량(면적 또는 식재 규모), 사업내용(예: 수종 식재, 산책로 조성, 쉼터 설치 등), 투입된 사업비 및 조성 대상지의 행정구역 또는 주소 정보를 포함한다.  이 자료는 제주의 도시 녹지 공간 현황과 변화, 녹지 확대 노력의 시계열적 흐름을 객관적으로 보여주는 기초 통계 자료로 기능한다. 이를 통해 도시계획 담당기관, 환경·생태 관련 정책 입안자, 연구자, 지역주민 등이 제주의 녹지 확보 실태를 평가하고, 향후 공원‧녹지 정책 수립, 기후변화 대응, 탄소흡수원 확대, 미세먼지 저감, 주민 휴식 공간 확보, 생태 복원 및 경관 관리 등의 목적으로 활용할 수 있다. 또한 녹지 분포를 행정구역 단위 또는 사업 단위로 분석함으로써, 특정 지역의 녹지 공백 여부를 진단하고 녹지 조성 우선 순위를 설정할 수 있는 근거 자료가 된다. 공공의 환경 정보 투명성 확보 및 지속가능한 도시 생태계 관리의 기초로서 공공성과 실용성을 갖춘 데이터라 할 수 있다.'
