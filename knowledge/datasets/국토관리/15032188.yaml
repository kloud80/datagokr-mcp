summary_user: 충청남도 안에서 시공 중인 공동주택 사업을 사업 한 건당 한 행으로 담은 파일이며, 시군·사업명·대지위치·사업주체·시공자·층수·동수·세대수·사업승인일·착공일을 기록한다. 주택 수급 분석가나 지역 주민이 "우리 시군에서 지금 짓고 있는 아파트는 어디이고 몇 세대 규모인가"를 확인할 때 쓴다. 전역 조인 키가 없어 K-apt 단지코드나 실거래·청약 자료와는 사업명·대지위치(주소)를 이름으로 맞춰서만 이을 수 있다.
limits: 실측 컬럼에 단지코드 같은 공통 키가 없으므로 다른 주택 데이터와 연결하려면 사업명·주소를 직접 매칭해야 하고, 매칭이 어긋날 수 있다. 범위는 충청남도 한 시도에 한정된다.
