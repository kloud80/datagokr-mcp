summary_user: SH공사가 공급하는 전세임대주택 중 신혼부부 Ⅱ 유형의 공급계획을 지역별로 2020~2023년 연도별 호수(세대수)로 정리한 소규모 집계 파일(csv, 470 bytes)이다. 중간소득층 신혼부부 전세임대가 지역별로 해마다 몇 호씩 계획됐는지, 공급 규모가 어떻게 바뀌었는지 보려는 예비 신청자나 주거정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름을 맞추거나 같은 기관(SH공사)의 전세임대 자료로만 이어 쓴다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)가 공급하는 전세임대주택 중 ‘신혼부부 Ⅱ 유형’에 해당하는 공급계획을 다룬 자료입니다. 신혼부부 Ⅱ 유형은 보다 넓은 소득계층을 대상으로 하며, 전년도 도시근로자 가구당 월평균 소득의 100% 이하인 자가 기본 대상입니다. 배우자가 소득이 있는 경우, 합산 소득이 120% 이하까지 지원 가능합니다. 공급계획에는 지역, 세대수, 전용면적, 공급일정 등이 포함되어 있으며, 공급 일정은 예산이나 정책 변화에 따라 수시로 조정될 수 있습니다. 전세금이 지원 한도액을 초과할 경우에는 초과분을 입주자가 부담하면 지원이 가능하나, 전세금 총액은 호당 대출한도의 250% 이내여야 하며, 세대원 수가 5인 이상인 경우에는 예외가 인정됩니다. 본 데이터는 중간소득층 신혼부부를 위한 주거안정 정책의 실행 현황을 분석하고, 지역별 수요 대응이나 공급 전략 수립에 활용할 수 있는 기반 자료입니다.※ 2025년부터는 "서울주택도시개발공사_전세임대주택 공급계획" 으로 통합하여 정보 제공됩니다.
