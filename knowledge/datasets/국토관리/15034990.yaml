summary_user: 광주 광산구에 등록된 제조업체를 업체 한 곳당 한 행으로 담은 파일(CSV, 약 54만 바이트)로, 업체명·소재지 주소·업종구분·산업분류코드·연락처·고용인원수를 포함한다. 지역 산업정책 담당자나 분석가가 '광산구에서 어떤 업종의 제조업체가 어디에 몰려 있고 고용 규모는 어느 정도인가'를 파악하는 데 쓴다. 사업자번호나 필지번호 같은 전역 조인 키가 없어서, 산업분류코드로 업종 통계와 맞추거나 소재지 주소·업체명을 매칭해 팩토리온 공장등록 정보 등 다른 자료와 잇는다.
description_portal: 광주광역시 광산구 내에 등록된 제조업체들의 현황 정보를 제공합니다. 각 제조업체의  업체명, 소재지, 업종구분 등과 같은 세부적인 정보가 포함되어 있어 지역 내 산업 구조와 제조업 현황을 파악하는 데 유용합니다. 이 데이터는 광산구 내 산업 정책 수립, 기업 유치 및 지원 계획 마련, 산업단지 관리, 기업체 분석 등 다양한 분야에서 활용될 수 있으며, 특히 지역 경제 활성화 및 고용 창출 전략 수립을 위한 기초 자료로 중요한 역할을 합니다. 관련 기관 및 기업 관계자들이 실질적인 의사결정을 내리는 데 도움이 되길 바랍니다.
