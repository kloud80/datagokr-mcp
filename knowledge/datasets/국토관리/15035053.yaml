summary_user: 전북특별자치도 남원시에 있는 제조업체를 업체 한 곳당 한 행으로 담은 파일로, 회사명·생산품·도로명주소·전화번호·데이터기준일자를 수록한다(CSV 약 32KB). 지역 분석가나 사업자가 '남원시에서 식자재나 주방용품을 만드는 업체는 어디이고 연락처는 무엇인가'처럼 품목별 지역 공급처를 찾을 때 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 팩토리온 공장등록 정보나 기업·토지 데이터와는 회사명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시에 위치한 제조업체들의 상세 현황을 종합적으로 담은 자료입니다. 생활용품부터 식자재, 전자기기, 주방용품, 산업용품, 의약용품에 이르기까지 다양한 분야의 제조업체 정보를 수록하여 지역 산업 생태계의 전반적인 모습을 조망할 수 있습니다. 각 업체의 생산품목, 연락처, 위치 정보를 통해 지역 경제 분석, 공급망 관리, 비즈니스 네트워킹 등에 폭넓게 활용할 수 있습니다.2. 데이터 항목명회사명, 생산품, 도로명주소, 전화번호3. 기대 효과지역 제조업체의 체계적인 정보 제공을 통해 산업 클러스터 구축과 지역 경제 활성화에 실질적으로 기여할 수 있습니다. 더불어 중소기업 지원 정책 수립과 지역 특화 산업 육성을 위한 핵심 기초 자료로 적극 활용될 수 있습니다.
