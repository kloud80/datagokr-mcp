summary_user: 대전광역시 내 산업단지(대전산단·대덕산단 등)를 단지별 한 행으로 묶어 조성기간, 산업·교육·상업·주거 용지 면적, 등록·가동 업체 수와 가동률, 근로자 수, 생산액·수출액 누계를 담은 집계표로, 638바이트 크기의 작은 CSV 파일입니다. 대전에서 공장 입지를 검토하는 사업자나 지역 산업정책 분석가가 "대전의 어느 산업단지가 가동률과 근로자 규모가 가장 크고 생산·수출 실적이 많은가"를 비교하는 데 쓴다. 전역 조인 키나 산업단지코드가 없어, 전국산업단지 표준데이터·국토부 산업단지 일반현황 같은 산업단지코드 원장과는 단지 이름을 맞춰서만 이어 쓴다.
description_portal: 대전광역시 산업단지 현황 자료는 대전산단, 대덕산단, DTV, 대덕특구, 하소산단 등 대전광역시 내 주요 산업단지의 기본 현황을 종합적으로 제공합니다. 이 자료에는 각 산업단지의 전체 면적, 산업 용지 규모, 입주 기업 수, 주요 업종, 생산액 등 다양한 항목이 포함되어 있습니다. 대전시에는 국가 산단과 일반 산단을 포함해 10개 산업단지가 조성되어 있으며, 복합산업단지로서 연구, 교육, 주거 기능이 결합된 형태와 중소기업 중심의 맞춤형 단지 등 다양한 유형이 존재합니다. 산업단지 별 조성 시기, 시행자, 사업비, 입주 업종 등 세부 정보가 체계적으로 정리되어 있어, 입주 기업 현황 파악, 산업 정책 수립, 투자유치 전략 마련, 산학연 연계 활성화, 산업단지 고도화 등 다양한 행정적·정책적 목적에 활용할 수 있습니다.
