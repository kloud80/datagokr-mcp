description_portal: '한국수자원공사(K-water)에서 운영중인 증발산량 및 토양수분량 관측소 정보를 제공합니다.(제공속성) - 관측소유형(16개소) - 측정소이름 - 측정소 경도 - 측정소 위도---<참고(아래)>* 증발산량 (Evapotranspiration, ET) 증발산량은 땅 표면과 식물에서 물이 증발(evaporation)과 식물의 증산(transpiration)이 합쳐져 대기 중으로 빠져나가는 총 물의 양을 이야기 합니다. 간단히 말해 “토양과 식물이 얼마나 많은 물을 공기 중으로 내보냈는가”를 mm 단위로 나타낸 값 증발(Evaporation): 토양, 수면, 잎 표면 등에서 직접 물이 기화되는 현상 증산(Transpiration): 대부분 식물이 뿌리로 흡수한 물을 잎의 기공을 통해 수증기로 내보내는 생리 작용주로 영향을 주는 요인: 기온 (높을수록 ↑) 일사량·햇빛 (강할수록 ↑) 바람 (세면 증발이 빨라짐) 상대습도 (낮을수록 ↑) 식생 상태 (잎이 많을수록 증산 ↑)* 토양수분량 (Soil Moisture Content) 토양수분량은 토양 안에 들어 있는 물의 양을 이야기 하며, 측정·표현 방법이 여러 가지인데, 주로 아래 3가지로 나타냅니다.1. 질량함수량 (%) (무게기준)   = (젖은 토양 무게 − 마른 토양 무게) ÷ 마른 토양 무게 × 1002. 체적함수량 (cm³/cm³ 또는 %) = 토양 속 물의 부피 ÷ 토양 전체 부피 × 100 → 실제 논밭에서 가장 많이 쓰는 값 (관개 관리에 직결)3. 유효수량 (Available Water) 작물이 실제로 쓸 수 있는 물의 양 = (밭자람함수량 − 시들음점) 사이의 물'
