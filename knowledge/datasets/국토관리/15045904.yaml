summary_user: 필지의 분할·합병 등 토지이동에 따른 변동 이력을 필지(고유번호)와 이동이력 순번 단위로 담은 건별 원천 데이터로, 전국을 시도별 CSV 파일로 제공하며 지목·면적·이동사유·이동일자·말소일자를 함께 기록한다. 분석가나 행정 담당자가 '이 필지는 언제 어떤 사유로 분할·합병되어 지금의 지목과 면적이 되었나'를 추적하거나 지역별 토지이동 패턴을 시계열로 볼 때 쓴다. 법정동코드(bjd_cd)로 행정구역 단위 데이터와 잇고, 필지 고유번호(PNU)로 토지대장·연속지적도 등 다른 필지 단위 데이터와 이어 쓴다.
description_portal: 국토교통부 토지이동이력정보는 필지의 합병, 분할 등 토지이동에 따른 변동 이력을 제공하는 데이터이다. 시도별 기준일자를 설정하여 특정 시점의 토지이동 내역을 조회할 수 있으며, 이를 통해 필지 단위의 변동 과정을 체계적으로 파악할 수 있다. 해당 정보는 토지 관리, 행정업무, 연구 및 정책 수립 등에서 기초자료로 활용될 수 있다.이 데이터는 CSV 형식으로 제공되며, 구조가 단순하고 호환성이 높아 다양한 분석 환경에서 쉽게 가공·활용할 수 있다. 엑셀과 같은 범용 오피스 프로그램뿐 아니라 데이터베이스, GIS 소프트웨어, R·Python 등의 분석 도구와 연계하여 대량 데이터를 처리할 수 있으며, 공간정보와 결합할 경우 토지이동 패턴 분석이나 시계열 변동 추적에도 유용하다.
