summary_user: 광주광역시 상수도사업본부가 상수도관 누수 응급복구를 맡기는 계약 업체를 구·생활권역·법정동 단위로 나눠, 담당자·업체명·연락처를 담은 작은 목록 파일(csv 약 2KB)이다. 시민이나 관할 공무원이 '우리 동네(법정동)에서 누수가 나면 어느 업체가 복구를 맡고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 구·법정동 이름을 맞춰 연결해야 하고, 같은 기관의 다른 상수도 데이터와 묶어 보는 정도로 쓴다.
description_portal: 본 데이터는 상수도관 누수 등 긴급 상황 발생 시, 신속하고 체계적인 응급 복구 공사 체계를 확립하기 위해 관리되는 핵심 자료입니다. 행정 구역(구) 및 생활 권역, 법정동 단위로 세분화하여 각 지역을 전담하는 공사 계약 업체의 상세 현황을 제공합니다.주요 포함 항목으로는 권역 구분, 관할 법정동, 관리 담당자, 시공 업체명, 비상 연락처 등이 있습니다. 이는 누수 발생 시 사고 지점에 적합한 업체를 즉각적으로 파악·동원하여 공사 지연을 방지하고, 유수율 제고 및 시민들의 단수 피해를 최소화하기 위한 기초 행정 정보로 활용됩니다.
