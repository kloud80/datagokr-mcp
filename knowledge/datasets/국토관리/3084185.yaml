description_portal: '제주특별자치도 내 유네스코 지정 제주도 세계지질공원과 관련한 데이터를 제공합니다.항목: 구분, 지질공원, 문의처, 짧은 소개 등*제주도는 2010년 10월에 섬 전체가 유네스코 세계지질공원으로 인증됨. 이후 4년 주기로 진행되는 재인증 심사를 통과함*대표적인 지질명소: 산방산, 용머리해안, 수월봉, 주상절리대, 서귀포패류화석층, 천지연, 우도, 비양도, 선흘곶자왈, 교래삼다수마을자세한 사항은 제주도세계지질공원 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/geopark/index.htm'
