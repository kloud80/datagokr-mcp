summary_user: 전남 목포시 개별입지(산업단지 밖)에 등록된 제조업체를 업체 한 곳당 한 행으로 담은 명부로, 회사명·공장 도로명주소·전화번호·생산품을 싣고 있으며 CSV 파일 하나(약 16KB)로 받는다. 지역 산업 담당자나 기업 관계자가 '목포시 개별입지에서 특정 품목을 생산하는 업체가 어디에 있는가'를 찾거나, 지원 사업 대상 업체 목록을 만드는 데 쓴다. 사업자번호·산업분류코드·필지번호 같은 공통 조인 키가 없어서, 다른 공장등록·기업 데이터와는 회사명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 사업자등록·토지·상권 데이터와 정확하게 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 범위는 목포시 한 곳의 개별입지 업체로 한정되므로 산업단지 입주기업이나 다른 시군구 현황은 담기지 않는다.
