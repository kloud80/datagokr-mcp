summary_user: '나주시 도시·군관리계획으로 결정된 용도지역 결정조서를 조서 단위로 담은 CSV 파일(약 34만 바이트)로, 대분류·중분류별 기정·증감·변경후 면적과 구성비, 결정·승인 고시 관리코드를 포함한다. 토지 투자자나 도시계획 분석가가 나주시에서 특정 용도지역(예: 주거·상업·녹지) 면적이 변경 결정으로 얼마나 늘거나 줄었는지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 지자체명·용도지역 분류명 매핑이나 같은 기관의 용도지구·용도구역 결정조서와의 고시관리코드·계획관리코드 대조로만 이어 쓴다.'
