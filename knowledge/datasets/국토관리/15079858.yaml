summary_user: 충청북도 옥천군 관내 일반건축물별로 납부연도, 물건지(소재지), 연면적, 시가표준액, 기준일자를 담은 건별 파일 데이터(CSV 약 2.1MB)이며, 범위는 옥천군 한 개 시군구다. 옥천군에 건물을 가진 주민이나 세무·부동산 분석가가 "이 건물의 지방세 과세 기준이 되는 시가표준액이 얼마이고 연도별로 어떻게 바뀌었나"를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 건축물대장 등과는 물건지 주소 문자열이나 자치단체코드(같은 기관 코드) 수준으로만 맞춰 이어 쓴다.
description_portal: 해당 데이터는 충청북도 옥천군 관내 일반건축물에 대해 매년 산정되는 시가표준액 정보를 제공합니다. 시가표준액은 지방세 과세 기준의 기초 자료로 활용되며, 건축물의 위치, 구조, 용도, 연면적 등 다양한 속성을 반영하여 산출됩니다. 본 데이터는 일반건축물시가표준액에 대한 데이터를 포함하고 있어 지방세 부과, 재산 평가, 국세 연계 자료로 활용 가능합니다. 또한, 공공기관, 연구기관, 민간 등에서 지역경제 분석, 부동산 정책 수립, 개발 계획 수립 등의 참고자료로 사용될 수 있습니다. 정기적으로 갱신되는 본 자료는 데이터의 최신성과 정확성을 유지하며, 공공데이터 개방 표준에 따라 제공됩니다.
