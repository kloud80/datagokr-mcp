description_portal: 본 데이터는 경상북도 경주시에서 제공하는 원룸 및 다가구주택 현황 자료이다. 자료는 경주시 내 주거용 건축물에 대한 기본 정보를 담고 있으며, 행정구역, 신주소, 구주소, 건물유형, 건물별 가구수, 준공연월, 건물인허가년월 등으로 구성된다. 이를 통해 지역 내 주거공간의 분포와 밀집도를 확인할 수 있으며, 도시계획과 주택정책 수립의 기초자료로 활용된다. 또한 인구구조 변화와 주거복지 수요 파악, 생활 인프라 배치 등 행정업무에 기여한다. 민간에서는 부동산 시장 분석, 연구, 지역개발 전략 등에도 참고할 수 있다. 본 데이터는 파일데이터 형식으로 개방되어 시민 누구나 활용 가능하며, 공공데이터 개방을 통한 투명행정과 생활 편익 증진에 이바지한다.
