summary_user: 부산 해운대구의 배수펌프장·유수지를 시설 1곳당 1행으로 담은 작은 파일(csv 약 1.2KB)로, 펌프 전동기 용량·설치연도, 설계빈도, 분당 배수량, 비상발전기, 유수지 면적·용량을 기록한다. 주민이나 방재 분석가가 '우리 동네 저지대 침수를 막는 배수펌프장이 어디에 있고, 몇 년 빈도 호우에 맞춰 설계됐으며 얼마나 오래됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지자체 유수지·배수펌프장 현황이나 하천 시설 자료와는 펌프장명·위치 문자열이나 기관명으로 직접 맞춰 이어야 한다.
description_portal: 부산광역시 해운대구 내 유수지 현황에 대한 데이터로 배수펌프장 명, 위치, 펌프시설, 설계빈도, 배수량, 비상발전기, 유수지 면적/용량 등 관련 정보를 제공합니다.배수펌프장 및 유수지는 주로 침수 방지를 위해 저지대나 홍수 위험 지역에 설치하는 방재시설로 집중호우 시 하천의 외수위가 상승하여 제내측 저지대 우수의 자연배수가 어려운 경우, 배수펌프장 유수지에 우수를 임시로 저류하고 배수펌프를 통해 하천이나 바다로 강제 배출하여 침수 피해를 예방하는 역할을 합니다.해운대구 배수펌프장은 춘천, 송정, 송정게이트1, 송정게이트2, 우2동, 재송1, 재송2, 반여1, 반여2배수펌프장이 있습니다.
