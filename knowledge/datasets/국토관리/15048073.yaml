summary_user: 전북특별자치도 시군구별로 도로·공원·녹지 등 도시계획시설의 결정 규모와 아직 집행되지 않은 연장·면적을 시설 종류 단위로 집계해 담는다. 미집행 기간을 10년 미만과 10년 이상으로 나눠 개소·면적·사업비를 함께 실어, 분석가나 지자체 담당자가 '어느 시군에 10년 넘게 묶인 미집행 공원·도로가 얼마나 되고 해소에 사업비가 얼마나 드나'를 따질 때 쓴다. 전역 조인 키는 없으므로 다른 시군구 통계와는 시도명·시군구명을 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 내 시군별로 계획되었으나 아직 실행되지 않은 '장기미집행 도시계획시설'의 현황을 상세히 담고 있는 행정 자료입니다. 도로, 공원, 녹지 등 각 시설별로 계획된 총면적과 함께 미집행된 면적 및 사업비를 구체적으로 보여줍니다. 특히, 사업 지연 기간을 '10년 미만'과 '10년 이상'으로 구분하여 각 기간에 해당하는 미집행 개소, 면적, 그리고 예상 사업비를 상세히 기록한 것이 특징입니다. 이 자료는 지역별 도시 개발의 진행 상황을 파악하고, 장기간 지연되고 있는 인프라 사업의 현황을 분석하여 효율적인 도시 관리 및 계획 수립을 위한 중요한 기초 데이터로 활용됩니다.
