description_portal: 주거 복지 확대와 안정적인 주거 환경 조성에 대한 사회적 요구가 증가하고 있으며, 각 분야에서 공공주택 운영 및 관리 정보에 대한 활용 요청이 증가함에 따라 보령시는 관할 지역 내 공공주택의 상세 현황 정보를 제공하고 있습니다.개방 데이터는 공공주택명, 소재지 지번주소, 소재지 도로명주소, 위도, 경도, 세대수, 층수, 동수, 준공년도, 관리사무소 전화번호, 데이터 기준일자 등의 항목으로 구성되어 있습니다.지자체·주거복지기관은 공공주택 공급 현황 분석, 지역별 주거 복지 수요 파악 및 주택 공급 정책 수립에 활용하고, 연구기관·학계는 공공주택 분포 패턴 분석, 주거 복지 정책 효과성 연구, 지역별 주택 보급률 및 노후화 현황 분석에 활용하며, 복지기관·시민단체는 주거 취약계층 지원 프로그램 기획 및 공공주택 입주 안내에 활용할 수 있습니다. 또한 시민은 공공주택 위치 및 관리사무소 정보를 확인하여 입주 상담 및 문의에 활용할 수 있습니다.
