summary_user: 제주영어교육도시 안 공급 대상 토지 41필지를 필지 한 건씩 담은 단일 파일로, 토지용도·면적·용도지역·건폐율·용적률·높이 제한·공급단가·예정가격·공급방법(일반공급, 수의계약 등)을 2014년 12월 15일 기준으로 정리했다. 투자자나 분석가가 영어교육도시 안에서 어떤 용도의 필지가 어떤 건축 조건과 ㎡당 가격으로 공급됐는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 필지번호나 용도지역 이름으로 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: '이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주영어교육도시 내 공급 대상 토지에 대한 필지별 세부 내역과 예정가격 정보를 2014년 12월 15일 기준으로 정리한 자료입니다. 항목으로는 연번(1번부터 41번까지), 토지용도, 필지번호, 면적(㎡), 용도지역, 건폐율(%), 용적률(%), 높이 제한(m), 공급단가(원/㎡), 예정가격(총액 기준), 공급방법(예: 일반공급, 수의계약), 비고란 등이 포함되어 있으며, 각 필지의 개발 가능 범위 및 건축 조건이 구체적으로 명시되어 있습니다. 이 데이터는 영어교육도시 내 토지 개발 현황을 파악하고, 토지의 활용 가능성, 투자 적정성, 공급정책 분석 등에 활용할 수 있으며, 정책 수립 및 민간 투자 유치 전략 수립 시 실무적인 참고 자료로 활용될 수 있는 고정밀 행정 데이터입니다.'
