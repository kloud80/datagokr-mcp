description_portal: '충청남도 당진시 정수장 수질검사 현황 안내(데이터 기준일자: 2026년 7월 5일)충청남도 당진시는 시민에게 안전하고 깨끗한 수돗물을 공급하기 위하여 정기적인 수질검사를 실시하고 있으며, 검사 결과를 공개하고 있습니다.검사 대상지는 합덕정수장을 비롯한 행정배수지, 신평배수지, 송악배수지 등 총 20여 개소 이상으로, 모든 지점에서 먹는 물 수질기준에 적합 판정을 받았습니다.총대장균군, 일반세균, 납, 철, 망간 등 주요 항목은 전 지점에서 불검출 또는 기준치 이하로 확인되었으며, 탁도 역시 0.01~0.40 NTU 수준으로 매우 양호하게 유지되고 있습니다.브롬산염, 포름알데히드, 알루미늄, 우라늄 등의 특이 항목도 대부분 불검출로 나타났습니다.본 수질검사 결과는 당진시의 수돗물 품질에 대한 신뢰도를 높이고,정수장 운영 관리, 대시민 수질정보 제공, 환경 위생 관리계획 수립 등 다양한 행정 및 공공서비스 목적에 활용될 수 있습니다.'
