summary_user: 경상북도 의성군의 일반건축물에 대해 과세년도별로 법정동·리, 본번·부번, 동·호 단위의 물건지와 연면적, 시가표준액을 건별로 담은 파일(CSV 약 8MB)이다. 의성군 소재 건물 소유자나 세무·부동산 분석가가 특정 건물의 재산세 과세 기준이 되는 시가표준액이 얼마인지, 연도별로 어떻게 달라졌는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건축물대장이나 공시지가 자료와는 법정동·리 이름과 본번·부번으로 지번을 맞추거나 자치단체코드로 기관 단위 연결만 할 수 있다.
description_portal: 본 데이터는 경상북도 의성군에서 제공하는 '일반건축물 시가표준액'에 관한 공공데이터입니다. 주요 항목으로는 시도명, 시군구명, 자치단체코드, 과세년도, 법정동 등이 포함되어 있으며, 이를 통해 일반건축물 시가표준액에 대한 세부 정보를 확인할 수 있습니다. 해당 데이터는 행정업무 지원, 정책 수립, 통계 분석, 민원 대응, 연구 및 공공서비스 개선 등을 위한 기초 자료로 활용 가능합니다.  또한 주민과 유관기관의 이해를 돕기 위해 항목별로  되어 있읍니다. 이 데이터를 통해 공공의 알권리를 보장하고, 행정의 투명성과 효율성을 높이는 데 기여할 수 있습니다. 이 데이터는 공공의 이해와 활용을 돕는 데 목적이 있습니다.
