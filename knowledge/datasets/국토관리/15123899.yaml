summary_user: 전산화된 지적도·임야도의 경계점을 이어 전국을 연속된 필지 도면으로 만든 공간정보를 필지 단위로 담으며, 필지별 지번·본번·부번·주소와 공시지가(jiga) 및 그 고시 연월을 함께 제공한다(검증 호출에서 300행 수신). 토지를 알아보는 국민이나 부동산·도시 분석가가 '이 필지의 경계는 지도에서 어디이고, 공시지가는 얼마인가'를 확인하는 데 쓴다. 필지고유번호(pnu)가 실측 조인 키이므로 토지대장·건축물대장·공시지가 등 필지 단위 데이터를 공간에 올리는 기준으로 이어 쓴다.
limits: 측량자료로 쓸 수 없는 참조용 도면이라 경계 분쟁이나 측량 근거로 쓰지 못한다. 호출하려면 포털 활용신청과 별도로 브이월드(vworld.kr) 사이트 인증키를 query 파라미터(key)로 넣어야 한다.
