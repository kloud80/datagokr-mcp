summary_user: 경기도 시군별로 외국인과 혼인한 배우자 수를 연도(yr)마다 집계한 통계로, 외국배우자 총수와 남녀 구분, 20~30대 여성 외국배우자 수를 담는다. 지자체 담당자나 분석가가 "우리 시군에 결혼이주 여성이 얼마나 되고, 다문화 지원·언어교육 수요가 어느 지역에 몰리는가"를 따질 때 쓴다. 전역 조인 키는 없어서, 시군 코드(sigun_cd)·시군명과 연도를 맞춰 같은 경기도 시군분석마트의 다른 통계와 이름·코드 매핑으로 잇는다.
description_portal: 이 데이터는 경기도 내 시군별로 외국인과 혼인한 배우자 수를 연도별로 기록한 통계자료로, 외국배우자의 총 수, 성별 구분, 그리고 20~30대 여성 외국배우자의 수를 포함하고 있습니다. 다문화가정 구성의 기초 자료로 활용 가능하며, 특히 외국여성배우자의 비중을 통해 결혼이주 여성의 지역별 분포를 파악할 수 있습니다. 이는 지역별로 필요한 다문화 지원 정책 수립, 언어·교육·출산 관련 행정 수요 예측, 여성 이주자의 사회통합 프로그램 설계 등에 유용합니다. 데이터는 사회통합 정책, 가족 지원 제도, 다문화 유아교육 정책 등과 연계한 실증분석 자료로 적합합니다.
