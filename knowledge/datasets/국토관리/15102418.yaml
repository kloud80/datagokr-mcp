summary_user: 장수군 내 일반건축물을 건물(동·호) 단위로 나눠 과세연도별 시가표준액(원)과 연면적(㎡), 법정동·리, 본번·부번, 물건지 주소를 담은 건별 파일 자료입니다. 납세자나 분석가가 특정 건물의 재산세 과세기준 금액이 얼마인지, 또는 면적당 시가표준액이 지역 안에서 어떻게 다른지 확인하는 데 쓴다. 전역 조인 키는 없어 법정동·법정리·본번·부번을 조합해 이름·코드 매핑으로 건축물대장이나 공시지가 등 다른 필지·건물 자료와 연결한다.
description_portal: 이 데이터는 지역 내 일반건축물에 대한 과세기준으로 활용되는 시가표준액 정보를 정리한 자료입니다. 자치단체명, 과세연도, 법정동 및 법정리 코드, 본번·부번, 동·호수, 물건지 주소, 연면적(㎡), 시가표준액(원) 등의 항목으로 구성되어 있으며, 모든 항목은 세부 단위까지 구체적으로 구분되어 있어 건축물별 개별 평가자료로 활용할 수 있습니다. 시가표준액은 주택이나 상가 등 각 건축물의 공시 가격과는 별도로, 국세·지방세의 과세표준 설정, 재산세·종합부동산세 산정 등의 행정적 목적에 따라 산정된 값입니다. 연면적 정보가 포함되어 있어 단위 면적당 시가표준액 산정 및 비교 분석이 가능합니다.
