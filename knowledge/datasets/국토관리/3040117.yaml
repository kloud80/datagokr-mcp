summary_user: 경상남도 창원시 관광과가 만든 통합 관광지도(리플릿)를 담은 파일 자료로, 공원·문화시설·역사 명소·체험 공간과 관광 동선이 표시되어 있으며 포털에서는 약 7.7MB 크기의 xlsx 파일로 받는다. 창원을 찾는 여행자가 명소를 묶어 여행 코스를 짜거나, 지자체·관광업계가 홍보물과 안내시설을 만들 때 어떤 명소를 넣을지 참고하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 명소 이름 대조나 같은 기관(창원시) 기준으로만 이어 쓴다.
description_portal: 통합 창원시 관광지도(리플릿 및 지도)를 게시하오니, 창원을 방문하고자 하시는 분들께서는 게시된 관광지도를 참고하시기 바랍니다.경상남도 창원시 관광과에서 제공하는 통합 관광 지도는 창원의 주요 명소와 관광 동선을 시각적으로 정리한 리플릿 형식의 자료입니다. 이 지도에는 공원, 문화시설, 역사적 명소, 체험 프로그램 공간 등이 표시되어 있어 방문자가 효율적으로 여행 계획을 세우는 데 활용할 수 있습니다. 특히 지도 기반 여행 코스 구성, 관광 홍보물 제작, 안내시설 구성, 민원 대응 및 지역 축제 안내와 연계해 활용할 수 있어 관광 정책 및 지자체 홍보에 필요한 기초 자료로 유용합니다.
