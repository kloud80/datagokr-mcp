summary_user: 경기주택도시공사가 시행하는 공공개발 사업의 보상공고를 공고 한 건씩 담은 파일로, 공고명·공고종류·공고등록일을 기록한다(CSV 약 22KB). 토지소유자나 이주 대상 주민이 '내 땅이 포함된 개발사업의 대토보상·감정평가법인 선정·이주대책 공고가 언제 나왔나'를 확인하거나, 분석가가 사업별 보상 절차 진행 시점을 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공고명 속 사업지구 이름을 매핑하거나 같은 기관(경기주택도시공사) 데이터로만 연결한다.
description_portal: 경기주택도시공사에서 시행 중인 공공개발 사업에 따른 보상공고 현황 데이터로써 보상공고명, 공고종류, 공고등록일 등의 정보를 포함하고 있습니다. 개발사업에 따른 대토보상계획, 보상액 산정을 위한 감정평가법인 선정, 이주 및 생활대책 시행, 이주 원주민들을 위한 임시주거용 주택공급 등 토지소유자 및 관계자에게 보상 절차 및 일정을 안내하는 목적 외에도, 사업 추진에 따른 이해관계자 관리, 민원 예방, 개발 사업의 절차적 투명성을 확보하는 데 유용하게 활용될 수 있습니다. 동종 사업을 진행하는 기관의 보상사업 관리 체계 구축에도 필수적인 자료로 활용될 수 있습니다.
