summary_user: 부산 남구가 관리하는 하천(지방하천 남천·동천, 소하천 대연천)을 하천별 한 행으로 정리한 2025년 목록 파일(csv, 353바이트)이다. 각 행에는 구분(지방하천·소하천), 위치, 연장, 양안 기준 요개수·개수·미개수 연장이 들어 있다. 주민이나 분석가가 남구 하천의 길이와 정비(개수)가 얼마나 진행됐는지 확인할 때 쓴다. 전역 조인 키나 하천코드가 없으므로 다른 하천 데이터와는 하천명이나 같은 기관 기준으로 맞춰 이어 쓴다.
description_portal: 본 2025년 데이터는 부산광역시 남구에서 관리하고 있는 하천현황(지방하천, 소하천)으로 지방하천 중 남천은 대연동에 위치해 있고, 동천은 문현동에 위치하고 있습니다. 소하천인 대연천은 대연동에 위치하고 있습니다.이와 관련 2025년 데이터이며 각각의 하천명, 지방하천, 소하천, 위치 , 연장에 대한 데이터를 제공하고 있습니다.자세한 데이터(하천) 문의는 부산광역시 남구청 홈페이지(https://www.bsnamgu.go.kr/)를 참고하여 관련 부서에 문의하시기 바랍니다.감사합니다.
