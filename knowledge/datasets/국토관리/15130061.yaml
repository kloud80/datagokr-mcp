summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 개발행위허가 필지도를 필지 도형 단위로 담은 파일로, 도형별 공간정보관리번호·좌표 범위(최소·최대 X·Y)·라벨명·면적·현황도형관리번호가 들어 있다(약 11KB CSV). 진안군에서 토지를 사려는 사람이나 개발 사업자, 도시계획 분석가가 어느 위치에 개발행위허가가 난 필지가 있고 면적이 얼마인지 확인하는 데 쓴다. 지번·법정동코드 같은 전역 조인 키가 없어 다른 데이터와는 좌표 범위를 이용한 공간 중첩이나 라벨명 매핑, 같은 기관(진안군)의 UPIS 자료 간 관리번호로만 이어 쓴다.
description_portal: 전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 개발 행위 허가 필지도 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 공간 정보 관리 번호, X좌표 최솟값, Y좌표 최솟값, X좌표 최댓값, Y좌표 최댓값, 라벨 명, 면적(도형), 현황 도형 관리 번호 정보를 제공합니다. 이 자료를 통해 공간 정보 관리 번호에 해당하는 현황 도형 관리 번호가 무엇인지 확인할 수 있습니다. 또한 현황 도형 관리 번호에 해당하는 라벨 명도 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2024년 7월 19일입니다.
