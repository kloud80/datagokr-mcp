summary_user: 인천광역시 연수구에서 추진한 도시재생사업을 사업 한 건당 한 행으로 정리한 파일로, 사업명·위치·면적(제곱미터)·대표지번 기준 위도·경도·사업내용·총사업비(억원)를 담으며 파일 크기는 약 1.2KB로 몇 건 안 되는 소규모 목록이다. 주민이나 지역 연구자가 '연수구에서 어디에 어떤 도시재생사업이 얼마의 사업비로 진행됐나'를 확인하거나 사업 위치를 지도에 표시하는 데 쓴다. 다른 데이터와 공통으로 맞물리는 조인 키는 없어서 사업명·위치 주소를 직접 맞추거나 좌표로 공간 결합해 다른 도시재생·개발사업 자료와 이어 쓴다.
description_portal: 본 자료는 인천광역시 연수구에서 추진한 도시재생사업의 현황을 체계적으로 정리한 데이터로, 위치, 지역, 사업명, 사업면적, 위도·경도, 사업내용, 총사업비 등으로 구성되어 있습니다. 이를 통해 수요자는 각 사업의 지리적 범위와 공간적 특성을 파악할 수 있으며, 위도와 경도 정보를 활용해 GIS 기반의 지도 시각화나 공간 분석이 가능합니다. 또한 사업명과 사업내용은 해당 사업의 주요 목표와 추진 방향을 이해하는 데 도움이 되며, 총사업비 항목은 사업의 재정 규모나 예산 분포를 분석할 수 있도록 지원합니다. 이 데이터는 정책 수립, 연구 분석, 민간협력, 지역공동체 활동 등 다양한 분야에서 실용적인 기초 자료로 활용될 수 있습니다.
