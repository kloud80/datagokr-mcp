summary_user: 경기도 양주시 내 일반건축물의 시가표준액을 필지·건물(동·호) 단위로 담은 건별 파일로, 과세년도·법정동·법정리·지번(본번·부번)·물건지·연면적·기준일자를 함께 기록하며 포털 설명상 63,901행이다. 양주시 건물 소유자나 부동산 분석가가 특정 건물의 재산세 과세기준이 되는 시가표준액이 얼마인지 확인하거나, 읍면동별 건축물 과세표준 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 건축물·토지 데이터와는 법정동·법정리·본번·부번 같은 지번 조합이나 자치단체코드로 맞춰 이어야 한다.
description_portal: 경기도 양주시_일반건축물 시가표준액 데이터는 양주시 내 건축물의 시가표준액을 관리하고 과세 및 행정업무에 활용하기 위해 구축된 자료이다. 총 63,901행으로 구성되어 있으며, 시도명, 시군구명, 자치단체코드, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 시가표준액, 연면적, 기준일자 등의 항목을 포함한다. 이 데이터는 개별 건축물의 위치와 특성을 기준으로 과세표준액을 산정하는 데 활용되며, 재산세 부과, 부동산 관련 세금 부과, 건축물 관리 등 다양한 행정업무의 기초자료가 된다. 또한 건축물의 연면적, 법정동, 지번 등의 공간 데이터를 포함하여 GIS 시스템과 연계 분석이 가능하며, 건축물 분포 현황 및 세수 추정 등 정책 수립에도 기여한다. 시민들에게는 부동산 과세기준을 확인할 수 있는 투명한 정보를 제공하고, 행정기관에는 합리적이고 공정한 세금 부과를 위한 기반을 마련한다. 따라서 이 데이터는 양주시의 건축물 관리, 세정업무, 도시계획 수립 등 다방면에서 중요한 역할을 수행하는 핵심 자료다.
