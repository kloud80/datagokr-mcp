summary_user: 김해시 일반건축물의 시가표준액을 건물 단위로 담은 파일로, 과세년도·법정동·리·본번·부번·동·호별로 시가표준액과 연면적을 기록한다. 납세자나 부동산 분석가가 김해시 특정 지번 건물의 과세 기준 가액(시가표준액)이 얼마인지, 면적 대비 가액이 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 법정동·본번·부번 같은 지번 정보나 자치단체코드를 매핑해 건축물대장·공시지가 등 다른 국토 정보와 연결해야 한다.
description_portal: '경상남도 김해시 일반건축물시가표준액 현황에 대한 데이터로 순번, 시도명, 시군구명, 자치단체코드, 과세년도, 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 시가표준액, 연면적, 기준일자의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2022년 6월 1일이며, 데이터 기준일자와 수정일이 상이하오니 이용에 유의 바랍니다.* 해당 데이터는 시스템 개편으로 인해 자치단체별 시가표준액 추출이 불가능하여 2023년 이후 자료 현행화가 불가능합니다.데이터 담당부서 : 김해시 재산소득세과(055-330-3996)'
