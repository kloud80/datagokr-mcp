description_portal: '○ 경상남도 거창군 관내 부동산중개업소에 대한 데이터로 중개사무소명, 개설등록번호, 개업공인중개사종별구분, 소재지도로명주소, 개설등록일자, 공제가입유무, 대표자명, 데이터기준일자 정보를 제공합니다.○ 데이터 기준일 : 2025. 09.  01.○ 부동산중개 업소는 토지, 건물 등 부동산을 사고팔거나 빌리려는 사람들의 거래를 중개해 주는 사업장으로, 법적으로 개설 등록을 해야 하며 "공인중개사 사무소" 또는 "부동산중개"라는 간판을 사용해야 합니다. 이 업소는 거래당사자 간의 매매, 교환, 임대차 등의 행위를 알선하고, 중개수수료를 받는 대가로 그에 대한 전문적인 서비스를 제공합니다.'
