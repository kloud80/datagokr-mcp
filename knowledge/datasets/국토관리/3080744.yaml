summary_user: 고양시 관내 지식산업센터를 센터 한 곳당 한 행으로 담은 전수조사 파일로, 명칭·지번/도로명 주소·위경도, 용도지역·부지면적·건축연면적·층수, 공장시설·지원시설 면적, 입주업체 수, 분양형태, 건축허가·착공·사용승인일을 포함합니다. 고양시에 입주할 지식산업센터를 찾는 사업자나 지역 산업 집적을 보는 분석가가 '고양시 어디에 어떤 규모의 지식산업센터가 있고 입주업체는 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·위경도나 센터 이름으로 맞춰 연결하며, 건축물대장과는 주소를 매개로 이어 쓴다.
description_portal: 본 자료는 고양시 관내 지식기반 산업 인프라의 핵심 거점인 지식산업센터의 운영 실태를 파악하기 위한 전수조사 데이터입니다. 주요 내용은 각 센터의 명칭, 소재지, 연면적 등 건축물 정보 등을 포함하고 있습니다. 제조업, 지식기반산업, 정보통신산업 등 업종별 집적 현황을 시각화하여 고양시 산업 생태계의 변화를 모니터링하는 데 활용됩니다. 이를 통해 기업 애로사항 파악 및 맞춤형 지원 사업을 발굴하고, 스마트 산업 클러스터 조성을 위한 전략적 판단의 근거를 제시하고자 합니다. 기타 문의사항은 고양시 기업지원과 지식산업센터팀으로 연락하여 주시기 바랍니다.
