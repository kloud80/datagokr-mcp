description_portal: 이 데이터는 경기도 이천시 도시계획 내 특정 공간의 도형 단위 정보를 기반으로 면적과 경계 길이 등을 기록한 자료입니다. 현황도형 관리번호, 라벨명, 면적(도형), 면적(길이), 생성일 등으로 구성되어 있으며, 공간별 규모 파악 및 도형 식별에 활용됩니다. 각 도형은 토지의 실제 이용 현황을 반영하거나 개발 제한 구역 등 특정 용도지구로 설정된 공간일 수 있으며, 이를 통해 도시계획 수립, 지역 단위 관리, 개발행위 사전 검토, 인허가 협의 시 기초정보로 사용됩니다. 특히 면적·경계 데이터는 지적정보 시스템, 공간분석 도구와 연계해 활용도가 높고, 도형별 식별번호와 라벨명은 시각화 및 정책적 관리 기준 설정에도 기여합니다.
