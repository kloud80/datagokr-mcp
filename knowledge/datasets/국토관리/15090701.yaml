summary_user: 인천광역시 서구(서해구) 안의 개발제한구역을 구역별로 구분, 지정·해제일자, 면적(제곱미터), 기준일자와 함께 정리한 시군구 단위 소규모 파일(CSV 588바이트)이다. 서구 주민이나 투자자가 특정 구역이 개발제한구역으로 지정됐는지, 언제 지정·해제됐는지, 면적이 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 구역 이름이나 같은 기관 코드로만 맞춰 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 개발제한구역 현황에 대해 분석하여 정리한 데이터입니다. 본 공공데이터는 인천광역시 서구 내 개발제한구역의 구역현황, 구분, 지정(해제)일자, 면적, 기준일자 등이 포함되어 있습니다. 본 공공데이터를 통하여 주민들은 개발 가능 여부, 규제 사항을 사전에 확인하여 행정절차 및 투자 판단에 도움을 줄 수 있을것으로도 판단이 됩니다. 또한 관련 토지 정책의 기초자료로도 활용할수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
