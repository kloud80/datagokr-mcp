description_portal: 환경부 영산강홍수통제소에서 발령하는 홍수특보정보입니다.영산강홍수통제소 관할 행정 구역은 전라북도, 전라남도, 광주광역시, 경상남도 일부(하동군), 제주도 입니다.영산강홍수통제소 관할 수계 유역은 영산강, 섬진강, 동진강, 만경강, 탐진강 및 제주도에 위치하고 있는 하천입니다.홍수특보정보는 관할 유역 내 특보 지정 지점에 대해서 발령합니다,홍수특보 종류는 주의보, 경보 , 주의보 변경,경보변경, 주의보 해제, 경보 해제 입니다,제공하는 정보는 관할유역의 과거년도 및 실시간 홍수특보 및 과거년도 홍수특보정보입니다.
