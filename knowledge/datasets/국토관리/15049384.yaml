description_portal: '- 제주특별자치도개발공사에서 운영 중인 기상 관측소에서 수집한 기상 정보입니다.- 제주삼다수 기상 관측소는 제주삼다수 공장 부지에 설치되어 강수량, 기온, 지표온도, 습도, 풍향, 풍속, 일사량 등을 관측합니다.- 기상 관측소는 제주시 조천읍 교래리 산70-30번지에 설치되어 있으며, 데이터 관측주기는 10분입니다.- 기상 관측소로 관측한 기상 데이터(강수량, 기온, 지표온도, 습도, 풍향, 풍속, 일사량 등)는 매 2년마다 있는 제주삼다수 취수허가 연장을 위한 지하수 영향조사 시 삼다수공장 지역의 기상데이터로 활용하고 있습니다.'
