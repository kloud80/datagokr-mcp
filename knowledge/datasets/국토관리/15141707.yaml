summary_user: 국가하천 하천범람 지도를 바탕으로 권역(한강·낙동강·금강·영산강·섬진강·제주)과 재현빈도(100년·200년·500년·기왕최대)별로 침수심 5단계(0.5m 이하부터 5.0m 초과까지)의 침수면적(km²)을 집계한 통계를 담는다. 방재 담당자나 분석가가 "500년 빈도 홍수 때 낙동강 권역에서 2m 넘게 잠기는 면적은 얼마인가"처럼 권역별 하천범람 침수 규모를 비교하는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 권역 코드(sareaCd)와 빈도 구분(fldlvFreq)을 권역명·빈도 이름으로 맞춰 같은 기관의 홍수위험지도 관련 데이터와 연결한다.
limits: 권역 단위 집계라 시군구 같은 행정구역이나 특정 지점의 침수 여부는 알 수 없고, 공간 좌표도 없다. 지도 작성 시점에 만들어진 뒤 바뀌지 않는 데이터라서 실시간 홍수 예보·경보 용도로는 쓰지 않는다. 다른 데이터와 묶을 공통 코드가 없어 이름 매핑이 필요하다.
