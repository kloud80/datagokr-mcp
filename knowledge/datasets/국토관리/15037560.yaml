summary_user: 경기도 광주시에 등록된 임대사업자의 임대주택을 건별로 담은 파일 데이터로, 영업구분·등록번호·사업자구분·임대주택구분·지번주소·주택 종류와 유형·면적·데이터기준일자를 포함한다(시군구 범위, 개별 주소 단위). 세입자나 분석가가 광주시 안에서 등록임대주택이 어느 동네에 어떤 유형과 면적으로 분포하는지, 계약하려는 주택이 등록임대인지 확인하는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 주소 매칭하거나 같은 기관 코드로만 연결하며, 전월세 실거래 자료와 주소 기준으로 함께 보는 용도가 있다.
description_portal: 본 데이터는 경기도 광주시청에서 관리하는 임대사업자등록현황 자료입니다. 주요 제공 항목은 영업구분, 등록번호, 사업자구분, 임대주택구분, 지번주소, 종류, 유형, 면적, 데이터기준일자로 구성되어 있으며, 광주시 내 임대사업자로 등록된 주택 및 관련 부동산의 현황 정보를 체계적으로 수록하고 있습니다. 이 데이터는 임대사업자의 자산 관리와 부동산 임대시장 현황 파악에 활용되며, 관련 정책 수립과 행정업무의 효율적 운영을 지원합니다. 또한, 등록된 임대사업자의 상세 정보를 통해 시민들에게 투명하고 신뢰성 있는 부동산 정보를 제공하는 데 기여합니다.
