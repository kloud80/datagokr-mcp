summary_user: 서울시 생활권계획에서 도시 기반시설·서비스로부터 상대적으로 소외된 지역을 한 건씩 담은 공간정보로, 지역마다 식별자·분류명·라벨명·관련 조서와 고시(고시일자)·GRS80 기준 X·Y 좌표를 갖는다. 도시계획 분석가나 자치구 담당자가 '우리 동네가 생활권계획상 소외지역으로 지정됐는지, 언제 어떤 고시로 지정됐는지'를 확인하거나 생활SOC 공급 격차를 지도로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도시계획코드(CTY_PLAN_CD)·고시ID 같은 같은 기관 코드나 이름 매핑, 또는 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 서울시 생활권계획 소외지역 공간정보는 생활권 계획상 각종 도시 기반시설과 서비스로부터 상대적으로 소외된 지역을 식별하고 관리하기 위한 공간 데이터입니다. 순번과 ID는 각 소외지역을 구분하는 기본 식별자이며, 도시계획코드는 해당 지역이 어떤 생활권·도시계획 체계와 연계되어 있는지를 보여줍니다. 분류명과 라벨명은 소외지역의 유형과 명칭을 제공해 지역의 성격과 문제 특성을 이해하는 데 도움을 줍니다. 조서ID와 고시ID, 고시일자는 관련 계획 조서와 행정 고시와의 연계를 통해 소외지역 지정의 법적·행정적 근거와 시점을 확인할 수 있게 합니다. X좌표와 Y좌표는 GRS80 좌표계를 기준으로 소외지역의 정확한 위치를 나타내어 지도 서비스, 공간 분석, 생활SOC 공급 격차 분석, 취약지역 지원정책 수립 등 다양한 도시계획 및 정책 의사결정에 활용할 수 있는 중요한 공간정보입니다.
