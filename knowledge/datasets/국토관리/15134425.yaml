description_portal: 본 데이터는 한국수자원공사에서 관리하는 전국 160개 지자체 상수도 시설에서 채취한 원수(광역 및 지방상수도) 수질검사 정보 입니다. 검사 항목으로 검사월, 수도사업자, 취수장명, 측정지점명, 측정지점주소,  채수지점구분, 정수장명, 수원, 채수일자, 미생물, 무기물질, 유기물질, 소독제 등의 정보가 포함됩니다. 대상은 대규모 취수원으로 먹는 물 안전성을 확보하기 위해 정기적으로 실시된 검사 결과를 공개합니다. 본 자료는 광역 시설 관리의 투명성을 높이고, 안전한 음용수 공급 체계 마련과 국민 신뢰 확보에 기여합니다.
