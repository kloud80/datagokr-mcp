description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 건축물대장 표제부 정보를 제공합니다. 건축물의 동별 세부 정보와 건축 규모, 구조, 용도 등 건축물 현황을 종합적으로 담고 있습니다. 건축물대장은 건물 식별 정보이며, 동명칭은 각 건물동의 이름을 나타냅니다. 건축면적과 연면적은 건물의 바닥 면적과 전체 면적을 제공하고, 용적율 산정용 연면적은 법적 용적율 계산에 사용되는 면적입니다. 기타구조는 건축 구조 형식을, 기타용도는 건물의 사용 목적을 나타내며, 기타지붕은 지붕 재질과 형태를 표시합니다. 높이, 지상층수, 지하층수는 건물의 규모를 나타내고, 총 동 연면적은 모든 동의 면적 합계를 제공합니다. 사용승인일은 건축 완료 일자를 기록합니다.
