summary_user: 경기도 광주시 도시계획정보시스템의 건축물대장 표제부를 건물 동별 한 행으로 담은 원천 파일로, 동명칭·건축면적·연면적·용적률 산정용 연면적·구조·용도·지붕·높이·지상/지하 층수·사용승인일을 포함한다. 광주시 안에서 특정 건물의 규모와 준공 시기를 확인하거나, 지역별 노후 건축물 분포와 용적률 여건을 살펴보려는 분석가·사업자가 쓴다. 실측 컬럼에 전역 조인 키(법정동코드·지번·건물관리번호 등)가 없어, 다른 데이터와는 동명칭 같은 이름 매칭이나 같은 기관(광주시) 단위로만 이어 쓴다.
limits: 표준 건물 식별 코드가 없어 국토부 건축물대장이나 필지·용도지역 데이터와 정확히 1:1로 결합하기 어렵다. 범위는 광주시 한 시군구에 그친다. 명세상 연간·이벤트 주기로 생성되므로 최신 건축 현황이 즉시 반영된다고 가정하지 않는다.
