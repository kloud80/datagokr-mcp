summary_user: 충청남도 아산시 일반건축물의 시가표준액을 필지·건물(동·호) 단위로 과세년도별 건별 기록으로 담으며, 연면적과 기준일자, 소재지(법정동·리, 본번·부번)가 함께 들어 있다. 아산시에 건물을 가진 시민이나 세무·부동산 분석가가 "우리 건물의 재산세 과세 기준이 되는 시가표준액이 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 법정동·리와 본번·부번으로 만든 지번 주소나 자치단체코드 같은 기관 코드를 맞춰서만 이어 쓴다.
