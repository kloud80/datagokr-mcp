summary_user: 한국토지주택공사(LH)가 보유한 일반비축토지를 필지 단위로 담은 원천 목록으로, 사업지구·법정동·소재지·산 여부·본번/부번·토지면적·용도지구·등록일시를 담는다. 공공 비축토지가 어느 지역에 얼마나 있는지, 예컨대 특정 시군구에 LH가 비축한 산지 필지와 면적이 얼마인지 확인하려는 분석가·사업자가 쓴다. 법정동코드(bjd_cd)로 행정구역·필지 단위 공간·공시 데이터와, 사업지구코드(lh_project_district_cd)로 LH 사업지구 관련 데이터와 이어 쓴다.
description_portal: 한국토지주택공사가 보유하고 있는 일반비축토지 현황(사업지구코드, 법정동코드, 소재지역명, 토지면적, 용도지구명 등)의 정보를 제공합니다. 총 비축토지는 458만 제곱미터이고 면적 순으로 제주시 해안동 211만(46.15%) 제곱미터, 제주시 연동 197만(42.95%) 제곱미터를 차지하고 있습니다. 2008년 등록된 토지는 361만(78.81%) 제곱미터로 그다음 등록된 토지는 82만(17.94%) 제곱미터에 해당합니다. 비축토지중 458만(83.51%) 제곱미터는 산지에 해당하고 있습니다.
