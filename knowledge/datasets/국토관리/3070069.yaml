summary_user: 부산광역시 북구에 등록된 공장을 한 곳당 한 행으로 담은 CSV 파일(약 12KB)로, 회사명·주소·설립구분·용지면적·제조시설면적·종업원수·공장규모·최초등록일·용도지역·지목·업종명을 담는다. 창업자나 지역 분석가가 북구의 어느 동네에 어떤 업종의 공장이 얼마나 큰 규모로 모여 있는지를 파악할 때 쓴다. 사업자번호·필지번호(PNU)·업종코드 같은 전역 조인 키가 없으므로, 다른 데이터와는 주소를 지오코딩하거나 업종명을 표준산업분류에 이름으로 매핑해 연결한다.
limits: 실측 컬럼에 전역 조인 키가 없어 팩토리온 공장등록이나 기업·토지 데이터와 바로 결합되지 않고, 주소나 이름 매칭에 의존해야 한다. 범위는 북구 한 곳이며, 포털 설명에 따르면 관내 전체 공장을 담은 것은 아니다.
