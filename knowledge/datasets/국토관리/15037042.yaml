description_portal: 성남시내 배수펌프장 현황 데이터로, 시군명, 펌프장명,지번주소,설치년도,설치목적,규모, 전력 등의 항목으로 구성되어 있습니다. 성남시는 국지성 집중호우와 도심 침수 피해를 예방하기 위해 주요 저지대 및 하천 인근에 배수펌프장 시설을 설치·운영하고 있다. 이들 시설은 집중강우 시 우수(雨水)를 신속히 배출하여 침수를 방지하는 핵심 도시방재 인프라로, 수정구의 저지대 지역, 탄천 주변, 그리고 하수처리구역과 연계된 지점에 분산 배치되어 있다. 시는 기상 예보에 따라 사전 가동 점검을 실시하며, 재난안전대책본부와 연계해 펌프장 운영상황을 모니터링하고 있다.
