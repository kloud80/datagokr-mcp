description_portal: '한국부동산원(구.한국감정원)에서 제공하는 오피스텔 가격동향조사의 지역별 월세가격 데이터입니다. <오피스텔 가격동향조사 개요>ㅇ 국가통계 승인번호 : 제408002호ㅇ 법적근거 : 주택법 제 88조, 제89조 및 동법 시행령 제91조ㅇ 조사목적 : 오피스텔의 매매·전세·월세가격을 조사하여 주택 대체시장의 상황과 주거유형 변화를 측정하고 수익률을 통한 월세시장 판단 지표 또는 정책 수립의 참고 자료를 제공ㅇ 조사주기 : 월ㅇ 조사지역 : 9개시도(수도권, 지방광역시 및 세종시)ㅇ 조사방법 : 현장조사를 기반으로 한 실거래 정보, 협력중개업소 모니터링 시세 등 각종 가격정보를 활용하여 표본의 가격 산정ㅇ 공표주기 : 월간ㅇ 공표시기 : 조사 다음달 15일(휴일인 경우 그 다음날)'
