summary_user: 건물에 설치된 승강기를 승강기 1대 단위로 담은 건별 조회 API로, 소재지·건물명·승강기 형식과 종류·상태·적재하중·층수·최종검사 유효기간과 판정결과를 제공하며 검증 호출에서 전국 범위의 2행이 수신됐다. 건물 소유자나 안전 담당자, 분석가가 특정 건물의 승강기가 몇 대이고 최종검사가 유효한지, 어떤 판정을 받았는지 확인하는 질문에 쓴다. 소재지 필드(address1, address2)가 주소 조인 키이므로 같은 주소 키를 가진 다른 건물·주소 데이터와 이어 쓰고, 승강기고유번호(elevatorNo)로 같은 승강기의 다른 정보를 맞춰 본다.
limits: 검증 호출에서 확인된 것은 2행뿐이라 전체 건수나 갱신 주기는 이 자료로 알 수 없다. 포털 활용신청은 자동승인이며 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
