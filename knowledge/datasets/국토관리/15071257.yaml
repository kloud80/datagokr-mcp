summary_user: 서울시 방화지구로 지정된 구역을 도형 단위로 담은 공간정보로, 도형 분류·결정고시 관리코드·시군구 코드·면적·길이·작성일자를 함께 담는다(좌표계 EPSG:5174, 인코딩 windows-949). 사업자나 건축 실무자가 대상 필지가 국토계획법상 용도지구인 방화지구에 걸리는지 미리 확인할 때 쓴다. 전역 조인 키는 없어서, 시군구 코드(SGG_CD)나 결정고시 관리코드를 이름·코드 매핑으로 같은 기관의 다른 용도지역·지구 공간정보나 행정구역 자료와 잇는다.
description_portal: '서울시 방화지구 공간정보 입니다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.제공부서는 서울특별시 도시공간본부 도시계획상임기획과(02-2133-8339) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.문의 : 도시계획과(02-2133-8339)'
