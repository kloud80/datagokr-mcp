summary_user: 시군구별·토지 이동 종목(분할·합병·지목변경·등록전환·말소 등)별로 한 해 동안 지적공부에 정리된 지번 수를 집계한 전국 통계 파일로, 건별 원천이 아닌 연도 단위 집계입니다. 분석가가 '어느 시군구에서 분할이나 지목변경이 몰렸고, 그것이 정비사업이나 공익사업 보상 시기와 맞물리는가'처럼 지역별 개발 압력과 토지 구조 변화(세분화·통합·농지 전환)를 가늠할 때 쓴다. 전역 조인 키가 없어 건축 인허가·보상 공고·토지이용계획 자료와는 행정구역 이름이나 기준년도를 맞춰 이어 쓴다.
description_portal: '본 통계는 지자체별 토지이동내역을 집계한 자료로, 통계 기준년도, 행정구역(시‧군‧구), 토지 이동 종목(예: 분할·합병·지목변경·등록전환·말소 등), 정리 지번 수로 구성됩니다. 이 통계는 개발·재정비·보상·경계정비 같은 현장 이벤트가 지번 단위의 행정처리로 어떻게 나타나는지를 보여주는 기초 지표로서, 특정 시기의 개발 압력·이용 전환·경계 확정이 어느 지역에 집중되는지 가늠하게 해줍니다. 또한 지적공부 체계에서의 대장 정리 흐름(정리 지번 수)을 통해 실제 사업 단계(계획–보상–착공–준공)와의 시차나 업무량 피크를 추적할 수 있습니다.최근의 사회·정책 환경과 함께 보면 해석력이 커집니다. 지적재조사와 디지털 지적 전환은 경계 확정과 면적 정합 개선을 통해 분할·합병·등록전환 처리가 늘어날 수 있고, 도시정비사업(재건축·재개발)·도시재생·빈집 정비는 구역 지정과 관리처분, 이주시기 전후로 분할(세분화)–합병(통합)–지목변경이 파도처럼 나타나곤 합니다. 공익사업(공항·철도·도로·산단 등) 보상·수용은 편입 토지 위주로 합병·말소·지목변경을 집중적으로 발생시키며, 농지 관리·취득 심사 강화와 용도지역·용도지구 조정은 농지→대지/잡종지 등 지목 전환 수요를 자극할 수 있습니다. 토지거래허가구역 지정·연장, 공시가격·세제 변화, 경매·공매 물량 증감, 재난복구(침수·산불 등), 신산업 입지(데이터센터·재생에너지 단지 등) 같은 이슈도 각기 지번 분할(세분화)·합병(대형화)·지목 전환의 패턴을 바꾸며, 온라인 민원 확대와 기록 전산화 진척도는 처리 속도와 월별 변동성에 영향을 줍니다. 따라서 본 통계를 건축·인허가, 보상 공고, 정비사업 일정, 토지이용계획 변경과 함께 교차 분석하면 지역별 토지 구조 변화의 방향(세분화 vs 통합, 농지→도시용지 전환 등)을 선명하게 읽을 수 있습니다.'
