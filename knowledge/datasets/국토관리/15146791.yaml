summary_user: 수원시 팔달구의 건축 인허가 건을 한 줄씩 담은 파일로, 건축구분(신축·증축·대수선), 대지위치, 연면적·증축면적, 지하·지상 층수, 주용도, 허가일을 기록한다. 주민이나 분석가가 '팔달구에서 최근 어떤 용도의 건물이 어디에 새로 허가됐나'처럼 지역 개발 흐름을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 주소를 이름·주소 매칭으로 맞추거나 같은 기관(수원시) 자료끼리만 이어 쓴다.
