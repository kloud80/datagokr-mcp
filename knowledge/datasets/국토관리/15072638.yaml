summary_user: 경기도 시군별 주민 1인당 공원면적(㎡)을 기준년도와 반기 단위로 정리한 집계 자료로, 건별 공원 원천이 아니라 시군 단위 지표를 담는다. 도시계획·녹지정책 담당자나 분석가가 '우리 시군의 1인당 공원면적이 경기도 내 다른 시군보다 적은가, 반기별로 늘고 있는가'를 비교하는 데 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)과 기준년도·반기를 이름 매핑으로 맞춰 인구·공원 현황 등 다른 시군 단위 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군별 주민 1인당 공원면적을 기준년도 및 반기 단위로 정리한 자료로, 주민 한 명이 이용할 수 있는 평균 공원 면적을 통해 지역의 녹지공간 확보 수준을 측정할 수 있습니다. 항목은 시군명, 기준년도, 기준반기, 1인당면적(㎡)으로 구성되어 있으며, 지역별로 공공녹지에 대한 접근성과 도시환경의 쾌적성을 비교할 수 있습니다. 이 지표는 도시계획, 녹지정책, 건강복지 분야의 핵심 지표로 활용되며, 공원 서비스 불균형 해소를 위한 정책 수립, 저면적 지역의 공원 확충 전략 수립, 지역 간 녹지 복지 격차 분석 등에 활용됩니다. 또한 공원녹지 총량제, 환경영향 평가 등에도 활용 가능한 기초 데이터로서 기능합니다.
