summary_user: 승강기의 설치일자, 최초설치일자, 승강기형식, 정격속도 같은 설치 정보를 승강기 한 대 단위로 조회하는 API이며, 검증 호출에서는 전국 범위의 개별(주소·좌표) 단위 1행이 수신되었다. 건물 관리자나 분석가가 특정 승강기가 언제 설치되었고 어떤 형식·정격속도인지 확인하는 질문에 쓴다. 실측 컬럼에서 다른 데이터와 이어지는 전역 조인 키는 확인되지 않아 이름·코드 매핑이나 같은 기관 코드로만 연결하고, 필수 파라미터인 설치 시작·종료일자(Installation_sdt, Installation_edt)는 다른 데이터에서 받은 값을 넘겨야 한다.
limits: 전역 조인 키가 없어 타 기관 데이터와 바로 결합할 수 없다. 필수 파라미터 Installation_sdt, Installation_edt는 다른 데이터의 코드이므로 먼저 받아 넘겨야 하며, 검증 호출은 오퍼레이션 1개에서 1행만 수신해 전체 규모와 갱신 주기는 확인되지 않았다.
