summary_user: 하수도법에 따른 하수도 배수구역을 도시관리계획 결정 지역정보로 담은 연속주제도 공간 데이터로, 전국 범위를 시도별 SHP 파일로 내려받는다. 지자체 담당자나 분석가가 특정 지역이 어느 하수도 배수구역에 속하는지, 배수구역 경계가 언제 고시됐는지(NTFDATE)를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 구분 값(COL_ADM_SE 등)을 이름·코드로 매핑하거나 같은 기관 자료와만 연결한다.
limits: 포털 활용신청과 별개로 vworld.kr 로그인 후 공간정보 다운로드 페이지에서 시도별 파일을 받아야 한다(인증키 불필요). 전역 조인 키가 없어 행정구역 코드 기반 자동 결합은 어렵고, 필드 의미가 명세에 비어 있어 실제 값을 보고 해석해야 한다.
