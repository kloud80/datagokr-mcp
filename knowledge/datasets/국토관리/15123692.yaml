summary_user: 경기도 내 토지의 개별공시지가를 필지(지번) 단위로 담은 건별 데이터로, 토지고유번호·소재지·연도·기준월·공시지가·지목·면적을 포함한다. 토지 소유자나 분석가가 "경기도 특정 필지의 연도별 개별공시지가는 얼마이고 지목·면적은 어떤가"를 확인하거나 세금·보상금 산정의 기초 가격을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 토지고유번호(land_idntfy_no)나 소재지명을 이용한 이름·코드 매핑 또는 같은 기관 코드로 다른 공시지가·지적 데이터와 이어 써야 한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 '개별공시지가' 관련 자료로, 경기도 내 토지에 대한 지번별 가격 정보를 포함하며 토지면적, 이용상황, 지목 등의 속성을 기준으로 개별 필지의 공시지가를 제공합니다. 항목은 '토지고유번호', '토지소재지', '연도', '기준월', '개별공시지가', '토지이용상황', '지목', '면적'으로 구성되어 있으며, 공시가격은 세금 부과, 보상금 산정, 금융 평가 등 다양한 공공 및 민간 분야에서 활용됩니다. 또한 지목은 대(대지), 전(밭), 도로 등으로 토지의 용도 분류를 나타내고, 이용상황은 상업용, 단독, 도로 등으로 실제 이용 형태를 나타냅니다.* 대용량 데이터로 전체 데이터를 다운로드 받으시고 싶으시다면, API나 파일 탭에서 다운로드 부탁드립니다.
