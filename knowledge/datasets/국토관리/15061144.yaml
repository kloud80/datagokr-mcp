summary_user: 한국수자원공사가 전국에서 추진한 상수도 건설 공사를 공사 한 건당 한 행으로 정리한 파일로, 공사명·착공일·준공(예정)일·공사내용(관로 길이, 시설 증설 용량 등)·현장주소를 담는다. 연구자나 지역 주민이 "우리 지역에서 어떤 상수도 관로·시설 공사가 언제 시작해 언제 끝날 예정인가"를 확인하는 데 쓴다. 전역 조인 키나 코드 필드는 없어 현장주소의 행정구역명이나 공사명을 기준으로 정수장·급수구역 등 다른 상수도 데이터와 이름 매칭으로만 잇는다.
description_portal: '한국수자원공사가 제공하는 수도건설현황 데이터는 전국에서 추진된 상수도 건설 사업의 진행 상황과 주요 내용을 정리한 자료입니다. 데이터에는 수도공급 안정성 강화와 수질 개선을 위한 주요 인프라 사업들의 기본 정보와 진행상황 등이 포함되어 있습니다. 본 자료를 통해 건설 추진 현황을 점검하고 관련 정책 수립에 참고할 수 있으며, 연구자는 사업 성과와 지역별 특성을 분석하는 자료로 활용할 수 있습니다. 산업계는 건설 실적을 기반으로 시설 운영 및 신규 사업 계획을 마련하는 데 활용할 수 있습니다. 또한 본 데이터는 안정적인 물 공급을 위한 기반 자료로 제공되어 국민 생활환경 개선과 공공 인프라 관리에 기여합니다.*총괄 제공 항목 - 공사명 : 사업 또는 공사 프로젝트의 공식 명칭 - 공사착공일 : 실제 공사 시작일(YYYY-MM-DD) - 공사준공일 : 계획된 공사 완료 예정일(YYYY-MM-DD) - 공사내용 : 공사의 구체적인 작업 범위 및 규모(관로 길이, 시설 증설 용량 등 상세 수치 포함) - 현장주소 : 공사가 수행되는 주요 행정 구역'
