legal_basis_portal: 법령적 근거「수도법」 제4조(수도정비기본계획의 수립)국가 및 지방자치단체는 국민의 생활과 공중위생에 필요한 적정량의 수돗물 공급을 위하여수도정비기본계획 및 관련 사업계획을 수립·시행해야 함.이에 따라 수도시설의 설치 및 관리 현황을 지속적으로 관리·보고하도록 규정됨.「수도법」 제6조(상수도관 등의 관리)수도사업자는 상수도관 등의 상태를 정기적으로 점검·관리하여,국민이 안전하고 깨끗한 수돗물을 공급받을 수 있도록 해야 함.
