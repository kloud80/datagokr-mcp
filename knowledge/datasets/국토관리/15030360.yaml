summary_user: 인천광역시 안에서 도시계획으로 결정됐지만 아직 조성되지 않은 도로·공원·학교 등 도시계획시설을 시설 한 건씩 담은 파일로, 군구명·시설 구분과 세분·위치·결정 면적과 미집행 면적(제곱미터)·총 사업비와 향후 사업비(백만원)·최초 결정일·실효 시기·관리 방안을 포함한다(CSV 약 3.6KB 규모). 토지 소유자나 투자자, 도시계획 분석가가 '우리 구의 어떤 시설 부지가 언제 실효되고 남은 사업비는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 군구명·시설명 같은 이름 매칭이나 같은 기관 자료로만 연결한다.
description_portal: '인천광역시 미집행 도시계획시설 현황 공공데이터는 도시 계획은 세워졌지만, 예산 부족 등의 이유로 아직 도로, 공원, 학교 등이 만들어지지 않은 땅에 대한 정보입니다. 이 데이터는 다음과 같은 내용을 포함합니다.주요항목으로는 시설구분, 시설의 세분, 시설명, 위치, 결정 면적, 미집행 면적, 총 사업비, 향후 사업비, 실효 시기 등으로 구성되어 있습니다.<AI 학습 데이터 활용>최적 개발 부지 예측 : AI 모델은 미집행 도시계획시설의 위치, 면적, 주변 환경, 도시계획 변경 이력 등을 학습하여, 향후 개발 가능성이 높은 부지를 예측할 수 있습니다. 투자 위험도 분석 : 이터에 기반해 미집행 시설이 해제될 확률을 예측함으로써, 토지 투자 시 발생할 수 있는 잠재적 위험을 미리 파악하고 회피할 수 있습니다.'
