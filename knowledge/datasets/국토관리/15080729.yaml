summary_user: 대전도시공사가 매입해 무주택 미혼 청년에게 공급하는 청년임대주택을 호실 단위로 담은 파일로, 주소·동·호와 임대·전용·공용면적, 임대구분, 보증금, 월임대료를 기록한다(csv 약 28만 바이트). 대전에서 청년 매입임대 입주를 알아보는 사람이 어느 주소의 몇 ㎡ 호실이 보증금·월세 얼마인지 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(주소) 문자열을 매칭하거나 같은 기관 자료끼리만 연결하며, 전월세 실거래와는 주소 기준으로 견줘 볼 수 있다.
description_portal: 대전도시공사는 무주택 미혼 청년의 주거 안정을 지원하기 위해 기존 다가구주택 등을 매입하여 임대주택으로 공급하고 있습니다. 경제적 여건으로 인해 주거 확보가 어려운 청년들이 도심 지역에서 안정적으로 거주할 수 있도록 지원하는 사업입니다.입주대상은 소득과 주거 여건에 따라 사회적 배려계층을 중심으로 선정되며, 세대별 소득수준과 자산요건을 기준으로 세부 자격이 구분됩니다. 장애인, 고령자, 한부모가정 등은 별도 기준을 적용받아 지원받을 수 있습니다.임대기간은 2년 단위로 입주 자격을 검증하며, 요건 충족 시 최대 10년까지 거주가 가능합니다. 단 입주 후 혼인한 입주자의 경우 2년 단위로 5회 연장 가능이를 통해 주거 취약계층의 장기적이고 안정적인 생활 기반을 마련하고자 합니다.※ 자세한 사항은 홈페이지(https://www.dcco.kr/web/contents/view.do?mId=241)를 참고하시기 바랍니다.
