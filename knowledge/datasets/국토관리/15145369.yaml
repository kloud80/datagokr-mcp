description_portal: 이 데이터는 경기도 이천시 관내 「기계설비법」에 따라 기계설비유지관리자 선임신고 의무가 있는 건축물의 현황을 제공합니다. 제공 항목은 건물명, 주소, 연면적, 공동주택 제외 연면적, 선임기준일(사용승인일)이며, 행정복지센터·학교·체육시설·상업시설 등 다양한 용도의 건축물이 포함됩니다. 본 데이터는 기계설비 안전관리 의무 이행 여부 점검, 건물 규모별 유지관리 인력 배치, 법정 점검 주기 산정, 에너지 효율화 사업 계획, 공공건물 관리대장 보완 등 행정·기술 분야에서 활용할 수 있습니다. 또한 시설 노후화 분석, 기계설비 교체·보수 예산 수립, 도시 기반시설 관리 정책 수립의 기초자료로도 활용 가치가 높습니다.
