summary_user: 서울특별시 하천 조사지점별로 출현한 어류 종과 종수, 서울시 보호종·천연기념물·고유종·교란종·외래종 여부, 하천명·자치구·조사지역·조사연도 등을 좌표(XCRD·YCRD)와 함께 개별 지점 단위로 담은 공간정보다. 분석가나 환경단체가 '어느 하천 어느 구간에서 고유종이나 생태계교란종이 몇 종 출현했는지'를 지도 위에서 확인하는 데 쓴다. 전역 조인 키는 없으므로 하천명(RVR_NM)·자치구명(ATNM_DSTC_NM) 같은 이름 매핑이나 좌표 기반 공간 결합으로 다른 하천·행정구역 레이어와 이어 쓴다.
