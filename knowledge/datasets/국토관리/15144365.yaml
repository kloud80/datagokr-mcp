summary_user: 전라남도 영암군 관내 일반공장을 공장 한 곳당 한 행으로 담은 파일로, 단지명·읍면·회사명·소재지 주소(도로명·지번)·전화번호·종업원수와 외국인수·최초등록일·업종번호와 업종명·생산품을 포함합니다(포털 설명 기준 2읍 11면, 645행, 기준일 2025년 7월 7일). 영암군 어느 읍면이나 단지에 어떤 업종의 공장이 몇 곳 있고 외국인 종업원이 얼마나 일하는지 보려는 지역 산업 분석가나 입지를 검토하는 사업자가 쓴다. 전역 조인 키는 없으므로 주소를 지오코딩하거나 회사명·업종번호를 매핑해 팩토리온 공장등록 정보나 산업단지 현황과 이어 쓴다.
