description_portal: 본 데이터는 대구광역시 달성군 관내에 등록된 공장의 현황 정보를 제공하는 자료입니다. 순번, 회사명, 도로명주소, 전화번호, 공장등록일, 공장용지면적, 부대시설면적, 종업원수, 업종명, 데이터기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 기업과 주민, 연구자는 지역 내 등록 공장의 분포와 업종, 규모, 고용 현황 등을 손쉽게 파악할 수 있습니다. 또한 지역 산업단지 관리, 입지 분석, 기업 지원 정책 수립, 투자 유치 등 다양한 행정 연구 목적으로 활용될 수 있습니다. 데이터는 데이터기준일자를 기준으로 작성되며 공장의 신규 등록 폐업 등으로 실제 현황과 차이가 있을 수 있으므로 정확한 내용은 관리기관에 문의하시기 바랍니다.
