summary_user: 대구광역시 달성군에 등록된 공장을 한 곳씩 담은 건별 명부로, 회사명·도로명주소·공장등록일·공장용지면적·부대시설면적·종업원수·업종명을 데이터기준일자 기준으로 담는다(CSV 약 131KB). 달성군 안에서 어떤 업종 공장이 어디에 몰려 있고 규모와 고용이 어느 정도인지 알고 싶은 기업·주민·연구자가 입지 분석이나 기업 지원 검토에 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어, 다른 데이터와는 회사명·도로명주소를 이름으로 맞추거나 같은 기관(달성군) 단위로만 연결한다.
limits: 사업자번호·KSIC 코드·PNU가 없어 팩토리온 공장등록 정보나 기업·토지 데이터와 키로 바로 붙일 수 없고 회사명·주소 매칭에 의존해야 한다. 범위가 달성군 한 곳이라 다른 시군구와 비교하려면 각 지자체 자료를 따로 모아야 한다.
