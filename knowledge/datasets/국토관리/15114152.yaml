description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘가축분뇨 배출시설 현황’ 데이터는 관내에서 가축 사육 활동으로 인해 분뇨가 발생하는 시설들의 위치와 규모, 축종별 특성을 종합적으로 수록한 공공데이터입니다.주요 항목으로는 농장명, 도로명 주소 및 지번, 축종(한우, 젖소, 돼지 등), 가축 사육두수, 분뇨 배출량, 시설 유형, 데이터 기준일자 등이 포함됩니다.이 데이터는 가축분뇨로 인한 수질 및 토양 오염 우려 지역을 사전 파악하고, 분뇨처리시설 설치 기준 설정, 지역별 환경규제 정책 수립 등 지방자치단체의 환경행정 기획과 지속 가능한 축산업 관리에 유용하게 활용됩니다.또한 GIS 기반의 오염원 지도 구축, 축산업 밀집 지역의 환경 리스크 분석, 가축사육 제한구역 설정, 주민 민원 대응 자료 등으로도 실무 활용도가 높은 환경 분야 핵심 데이터입니다.
