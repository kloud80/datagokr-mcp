summary_user: 천안시 도시계획정보시스템(UPIS)의 도시지역 현황 도형을 건별로 담은 CSV 파일(약 9.7KB)로, 현황도형 관리번호·라벨명·면적(제곱미터)·길이(미터)를 기록한다. 천안시 안에서 도시지역으로 지정된 구역이 어디이고 각각 면적이 얼마인지 확인하려는 도시계획 담당자나 토지 분석가가 쓴다. 다른 데이터와 바로 묶을 전역 조인 키가 없어 라벨명 같은 이름 매핑이나 같은 기관(천안시) UPIS 데이터끼리만 연결한다.
description_portal: 충청남도 천안시 도시계획정보시스템(UPIS)의 도시지역 현황 데이터로 도형 현황도형 관리번호, 라벨명, 면적, 길이 등의 항목을 제공 합니다도시계획정보시스템(UPIS)은 도시·토지·시설·경관 등 도시계획 전반의 정보를 통합 관리하기 위해 구축된 시스템입니다. 도시의 공간 구조와 이용 실태를 분석할 수 있도록 다양한 계획·관리 요소를 담은 정보시스템이며, 각종 공간정보와 행정정보를 체계적으로 기록하여 도시관리·정비·개발계획 수립을 지원합니다. 이의 중장기개방계획에 따라서 도시지역 현황 테이블을 데이터 개방하였습니다.
