summary_user: 용인시 유동인구를 구(수지·기흥·처인) 단위로 날짜·1시간 단위 시간대·외국인 여부별로 나누고, 성별·5세 연령대별 인구수로 담은 집계 자료입니다. 상권 분석가나 시 담당자가 특정 구에 어느 시간대에 어떤 성별·연령층이 많이 다니는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군구 코드(signgu_cd)나 시군구명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 용인시 내 유동인구 정보를 시간대, 성별, 연령대, 외국인 여부별로 분석한 자료입니다. 시간코드는 0시부터 23시까지의 1시간 단위로 구성되며, 남자0009수, 여자2529수 등은 각 연령대별 성별 유동인구 수를 나타냅니다. 유동인구 수치는 이동통신 기지국 단위로 수집되며, 인근 지역(50m × 50m 셀)으로 분배되는 과정에서 소수점 단위의 값이 발생할 수 있습니다. 주요 항목으로는 시군구코드, 시군구명, 시간코드, 외국인구분, 연령별 성별 인구수, 연도_월_일 등이 포함되며, 용인시 수지구, 기흥구, 처인구 단위로 나뉜 정보를 제공합니다.
