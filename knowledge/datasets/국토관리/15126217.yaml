description_portal: 공공시설 태양광발전설비 데이터는 구로구 내 학교·행정시설·공공건물 등에 설치된 태양광 발전설비의 용량, 설치위치, 설비유형, 설치연도 등 에너지 인프라 구성 요소를 기록한 재생에너지 기반 행정자료이다. 태양광 설비는 탄소중립 및 지역 에너지 자립도를 높이는 핵심 수단으로, 해당 자료는 공공부문의 에너지전환 추진 정도를 정량적으로 파악하는 데 매우 중요한 역할을 한다.설치위치는 태양광 인프라의 공간적 분포를 분석할 수 있게 하며, 일사량·건물 구조·주변 음영 여부 등 입지 적합성 평가와 연계할 수 있다. 설비용량 정보는 에너지 생산량 추정, 가동 효율 분석, 신규 설치 필요성 검토 등 정책 기획의 기초 자료로 활용된다. 또한 공공시설군별로 에너지 기여도를 비교하여 향후 에너지 효율화 사업·그린 리모델링 계획 수립에 반영할 수 있다.
