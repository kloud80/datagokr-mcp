summary_user: 전남광주통합특별시가 지정한 토지거래허가구역을 구역(대상지역)별로 한 행씩 정리한 현황 파일로, 면적(제곱킬로미터)·지정권자·공고일자·최초지정일자·지정 차수·지정기간·관련 시군·지정원인을 담는다(약 4KB 규모의 CSV). 토지를 사고팔려는 시민이나 중개사가 '이 지역 땅이 허가구역에 들어가 언제까지 묶여 있는가'를 확인하거나, 분석가가 개발지역·산업단지 주변 지정 사유와 기간을 살피는 데 쓴다. 전역 조인 키는 없어서 관련 시군 이름이나 대상지역 명칭을 다른 토지·실거래 데이터와 이름으로 맞춰 이어 써야 한다.
description_portal: 토지거래허가제도는 특정 구역 안에서 토지를 사고팔 때 반드시 허가를 받아야 하는 제도입니다. 이 제도는 투기나 무분별한 토지 거래로 인한 부작용을 막고, 토지를 효율적이고 계획적으로 사용할 수 있도록 하기 위해 만들어졌습니다. 허가를 받지 않고 거래를 하면 법적으로 문제가 될 수 있으며, 지역 사회의 안정과 공정한 부동산 시장을 위해 매우 중요합니다. 전남광주통합특별시에서는 여러 중요한 개발지역과 산업단지 주변을 중심으로 토지거래허가구역을 지정해 운영하고 있습니다. 이러한 구역에서는 토지 거래 시 면적, 거래 목적, 지정 권자, 허가 기간 등 다양한 기준에 따라 엄격하게 관리됩니다. 관련 정보는 투명하게 공개되어 시민들이 안심하고 거래할 수 있도록 돕습니다. 이 제도를 통해 무분별한 투기행위를 예방하고, 지역의 지속 가능한 발전과 주민 재산권 보호에 큰 역할을 하고 있습니다. 시민들도 토지 거래 시 허가 여부를 꼭 확인하여 안전한 거래를 할 수 있도록 주의하는 것이 중요합니다.
