summary_user: 경기도 부동산포털의 건물 전유부를 동·호수별로 담은 건별 데이터로, 필지·건물 단위로 경기도 전역을 대상으로 하며 각 호실 면적이 전용인지 공용인지(prvowrs_shrn_div)와 주구조·주용도·면적을 함께 기록한다. 공동주택의 특정 호실 전용면적과 공용면적 비율을 확인하거나 등기·공시가격 자료의 면적을 대조하려는 분석가·실무자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 토지고유번호(land_idntfy_no)·건물번호·소재지명 같은 이름·코드 매핑으로 건축물대장 등 다른 국토 정보와 연결해야 한다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 건물 전유부(전용 및 공용 공간 구분) 정보로, 공동주택의 동호수별 구조, 용도, 면적 등에 대한 세부정보를 포함합니다. 주요 항목은 토지고유번호, 건물번호, 토지소재지, 건물명, 동명칭, 호명칭, 전유공유구분, 주구조, 주용도, 면적 등이며, ‘전유공유구분’은 해당 면적이 전용 공간인지, 공용 공간인지를 구분합니다. ‘주구조’는 철근콘크리트구조, 벽돌구조 등으로 명시되며, ‘주용도’는 주로 아파트와 같은 주거용 건축물을 대상으로 합니다. 이 데이터는 건축물의 실제 공간구성 분석, 공시가격 산정자료, 부동산 등기정보 검증, 공동주택 면적비율 계산 등 다양한 용도로 활용될 수 있습니다.
