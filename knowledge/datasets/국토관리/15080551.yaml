summary_user: 경기도 안양시 일반건축물의 지방세 부과기준인 시가표준액을 필지·건물(동·호) 단위로 과세년도별로 담은 파일로, 포털 설명상 2017~2023년 자료이며 CSV 약 89MB 규모다. 안양시 소재 건물 소유자나 분석가가 특정 지번 건물의 재산세·취득세 기준 가액이 연도별로 얼마였는지 확인하는 데 쓴다. 전역 조인 키는 없어 자치단체코드·법정동·본번·부번 같은 지번 정보를 이름·코드로 맞춰 건축물대장이나 공시지가 자료와 연결해야 한다.
description_portal: 본 데이터는 일반건축물에 대한 지방세 부과기준인 시가표준액을 제공하여 물건별 재산가액 확인이 가능하도록 합니다. 이 자료는 2017년부터 2023년까지의 일반건축물 시가표준액 정보를 포함하고 있으며, 지방세 부과의 투명성과 형평성을 확보하고자 수집되었습니다. 세부 항목은 건축물의 용도, 구조, 위치, 경과연수 등을 반영하여 산정된 시가표준액으로 구성됩니다. 재산세, 취득세 등 지방세 산정의 기준 자료로 활용될 뿐만 아니라, 부동산 관련 정책 수립 및 개인의 자산 가치 평가에도 유용하게 활용될 것으로 기대됩니다.
