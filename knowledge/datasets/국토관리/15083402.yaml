summary_user: 서울시 도시계획시설 중 보건위생시설(도축장, 종합의료시설, 장사시설)의 결정 도형을 시설별 공간정보로 담으며, 시설 분류·결정고시 관리코드·집행상태·면적·길이 같은 속성이 붙어 있다. 도시계획 분석가나 부동산·개발 사업자가 '특정 구 안에 장사시설이나 종합의료시설로 결정된 땅이 어디이고 아직 집행되지 않았는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 서울시 도시계획시설 공간정보와는 같은 기관 코드 체계로, 행정구역 자료와는 시군구 코드(SGG_CD)나 이름 매핑으로 이어 쓴다.
limits: 법적 효력이 없는 참고자료이므로 토지이용 규제나 시설 결정 여부를 확정하는 근거로 쓸 수 없다. 서울 열린데이터광장(data.seoul.go.kr)의 인증키를 공공데이터포털 활용신청과 별도로 받아야 호출된다. 좌표계가 EPSG:5174(Bessel TM)이고 인코딩이 windows-949이므로 다른 공간자료와 겹칠 때 좌표 변환과 문자 인코딩을 맞춰야 한다.
