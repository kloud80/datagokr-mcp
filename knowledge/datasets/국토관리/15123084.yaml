summary_user: 경기도 시군별·연도별 인구 이동을 집계한 데이터로, 시군 내 이동, 도내 전출입, 타시도 전출입 건수를 성별, 20~30대 여성, 전체·1인·2인 가구 수로 나눠 담는다. 도시계획 담당자나 연구자가 "우리 시군은 1인가구와 20~30대 여성이 도내로 빠져나가는가, 타시도에서 들어오는가" 같은 유입·유출 양상과 이동 성격을 따지는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군 코드(sigun_cd)나 시군명(sigun_nm)으로 매핑하거나 같은 기관(경기도) 시군분석마트 자료와 연도·시군 기준으로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 시군별 인구의 전입과 전출 현황을 연도별로 제공하며, 시군 내 이동, 도내 및 타시도 간 이동, 이동 성별(남자/여자) 및 가구 형태(전체, 1인가구, 2인가구 등)를 포함하고 있습니다. 주요 항목은 시군내이동수, 도내전출입수, 타시도전출입수와 각 항목의 성별 및 가구별 구분 데이터로 구성되어 있습니다. 이를 통해 특정 시군의 인구 유입·유출 양상, 이동의 성격(도내인지, 타시도인지), 1인 또는 2인가구의 이동 흐름을 정밀하게 분석할 수 있습니다. 본 자료는 주거 수요 예측, 도시계획, 교통 인프라 설계, 청년 또는 고령 인구 이동 특성 연구 등 다양한 정책 수립과 연구에 활용됩니다.
