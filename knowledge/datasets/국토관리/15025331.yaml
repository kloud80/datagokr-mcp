summary_user: 부산광역시 사상구 관내 공장을 한 행에 한 곳씩 담은 시군구 단위 공장 현황 파일(CSV, 약 298KB)로, 회사명·도로명주소·전화번호·업종명·생산품과 남녀·외국인 남녀·총 종업원 수를 담는다. 사상구에서 특정 업종이나 생산품을 만드는 공장이 어디에 있고 외국인 인력을 얼마나 쓰는지 알고 싶은 사업자·지역경제 분석가가 거래처 탐색이나 산업 구성 분석에 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어 다른 데이터와는 회사명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 사상구 관내 공장 현황 데이터입니다. 각 공장의 회사명과 대표 도로명주소, 연락 가능한 대표 전화번호가 포함되어 있어 위치와 연락처를 쉽게 파악할 수 있습니다. 또한 업종명으로 공장의 산업 분야를 구분할 수 있으며, 남녀 종업원 수와 외국인 남녀 종업원 수를 별도로 기록하여 인력 구성 현황을 상세히 알 수 있습니다. 총 종업원 수 정보는 공장별 규모를 가늠하는 데 유용하며, 생산품 항목 데이터는 각 공장에서 어떤 제품을 제조하는지 구체적으로 확인할 수 있어 산업 분석과 지역 경제 연구에 중요한 자료로 활용될 수 있습니다.
