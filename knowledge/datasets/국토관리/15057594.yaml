summary_user: 경기도 시군의 저수조 청소업체를 업체(사업장) 한 곳당 한 행으로 담은 인허가 원천 목록으로, 사업장명·영업상태·폐업일자·도로명/지번 주소·우편번호·전화번호·업태 정보를 포함한다. 공동주택 관리자나 건물주가 우리 시군에서 영업 중인 저수조 청소업체를 찾을 때, 위생 담당 공무원이 폐업·휴업 업체를 걸러 지도점검 대상을 정할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 시군코드(SIGUN_CD)·시군명이나 주소·우편번호를 매칭해 다른 경기도 데이터나 상수도 데이터와 잇는다.
description_portal: 이 데이터는 경기도 31개 시군 내 저수조 청소업체에 대한 인허가 및 관리 현황을 제공하며, 주요 항목으로는 사업장명, 시군명, 인허가일자 및 취소일자, 영업상태, 소재지 정보(도로명 및 지번주소, 우편번호), 전화번호, 위치좌표(WGS84 위도·경도 및 X/Y좌표), 업태구분, 업무구분, 건축물명 및 연면적, 청소대상 시작 및 종료일자, 휴업 및 폐지 사유 등이 포함됩니다. 이 데이터는 수돗물 위생관리, 공동주택 및 상업시설의 급수설비 청결도 조사, 위생관리업체 지도점검 등 환경보건 행정에 활용될 수 있습니다. 특히 청소 대상 기간 항목은 정기적인 위생 점검 주기 파악에 유용하며, 건축물 정보와 함께 분석 시 관리 대상의 유형별 특성 파악도 가능합니다. Open API로 제공되어 민간 및 공공 플랫폼에서 활용 가능하며, 위생 관련 사고 예방을 위한 사전관리 정책 수립에도 기초자료로 활용됩니다.
