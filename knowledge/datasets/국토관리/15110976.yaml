summary_user: 청약홈이 일반공급 접수를 대행한 일반분양 단지를 기준으로, 모집공고일이 속한 연월과 전국 17개 시도별 청약 당첨자 수를 연령대(만 40세 미만, 40대, 50대, 60세 이상)로 나눠 담은 집계 파일이다. 분석가나 청약 대기자가 '우리 시도에서 30대 이하 당첨자가 최근 늘었나' 같은 지역·연령별 당첨 구조 변화를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 청약·분양 데이터와는 연월과 시도 이름을 맞춰서만 이어 쓴다.
limits: 시도·연월 단위 집계라 단지별·개인별 당첨 내역이나 시군구 단위 분석은 못 한다. 명세상 월간 갱신이며, 가장 최근 전월 수치는 이후 변동될 수 있다. 시도 코드가 없으므로 다른 데이터와 연결할 때 시도 명칭을 직접 매핑해야 한다.
