description_portal: 한국부동산원(구.한국감정원)의 청약홈에서 제공하는 지역별 청약 당첨자 수 현황입니다. 청약홈에서 일반공급 접수를 대행한 일반분양 단지를 기준으로 작성되었습니다.공공데이터 제공범위는 한국부동산원이 주택청약 업무를 수행한 2020년 2월부터 데이터 작성 기준 전월 말일까지로 모집공고일을 기준으로 집계하였습니다.* 컬럼별 상세설명- 연월→ 모집공고일이 포함된 연월- 시도 → 전국 17개 시도 기준- 30대 이하 → 모집공고일 기준 만 40세 미만 당첨자 수- 40대 → 모집공고일 기준 만 40세 이상 50세 미만 당첨자 수- 50대 → 모집공고일 기준 만 50세 이상 60세 미만 당첨자 수- 60대 → 모집공고일 기준 만 60세 이상 당첨자 수※ 매월 25일, 전월까지의 데이터를 제공하며 전월 데이터는 향후 변동될 수 있습니다.
