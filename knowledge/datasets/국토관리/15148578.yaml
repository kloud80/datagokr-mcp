summary_user: 경주시 안에 있는 제조업체를 업체 한 곳씩 담은 파일로, 업체명·업종구분·업종번호·소재지·전화번호·고용인원 수가 들어 있다(약 210KB csv). 지역 산업 분석가나 기업지원 담당자가 "경주시에서 특정 업종 제조업체는 어디에 몇 곳 있고 고용 규모는 얼마인가"를 확인할 때 쓴다. 전역 조인 키(사업자번호·필지번호 등)는 없어서, 다른 데이터와는 업체명·소재지 주소를 맞춰 보거나 업종번호를 업종 분류와 대조하는 방식으로만 이어 쓴다.
description_portal: 경상북도 경주시는 지역 내 제조업체 현황을 체계적으로 관리하고 이를 공공데이터로 제공하고 있다. 본 데이터는 업체명, 업체구분, 업종번호, 소재지, 전화번호, 고용인원수 등 핵심 정보를 포함하여 지역 제조업체의 분포와 특성을 파악하는 데 활용할 수 있다. 이를 통해 산업정책 수립, 기업지원, 지역경제 분석 등 행정 및 연구 목적에 기여한다. 특히 고용인원수는 일자리 현황을 확인하고 노동시장 변화를 분석하는 데 유용하며, 소재지와 업종번호는 산업별·지역별 비교분석에 도움이 된다. 본 데이터는 경주시가 제공하는 신뢰성 있는 자료로서 정책결정자, 연구자, 기업인 등 다양한 이해관계자들이 지역 제조업의 구조와 동향을 이해하고 활용할 수 있도록 지원한다.
