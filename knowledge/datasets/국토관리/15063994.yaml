summary_user: 시군구 행정구역별·민원처리종목별로 누계 지번 수·발급 수·수수료를 유료와 무료로 나누어 통계 기준년도 단위로 집계한 파일(CSV, 약 71만 바이트)로, 건별 원천이 아닌 전국 범위의 집계 자료다. 분석가가 "어느 시군구에서 토지(임야)대장 등 민원을 창구 유료 발급보다 무료 온라인 경로로 더 많이 처리하는가"처럼 지역별 수수료 부담과 디지털 전환 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정구역 이름을 행정구역 코드에 매핑하거나 같은 기관 자료의 코드로만 이어 쓴다.
description_portal: 본 통계는 지자체별(시‧군‧구) 민원처리종목 기준으로 누계 지번 수, 누계 발급 수, 누계 수수료, 유료 지번 수, 유료 건수, 유료 수수료, 무료 지번 수, 무료 발급 수, 무료 수수료를 집계한 자료입니다.최근 정부24를 통한 토지(임야)대장 인터넷 발급‧열람이 무료이고, 창구 방문 발급/열람은 유료(대장 발급 500원, 열람 300원)인 정책 환경을 고려할 때, 유료/무료 건수는 지역의 ‘방문 vs 온라인’ 이용행태와 수수료 감면정책의 영향을 함께 반영합니다. 또한 2025년 초 건축물대장 대량 유출 사건으로 부동산 공부류 문서의 개인정보 보호 강화가 사회적 쟁점이 된 만큼, 특정 지번의 반복·대량 발급 등 이상 패턴 모니터링과 통계의 비식별·집계 제공 원칙을 준수합니다. 아울러 전세사기 피해 지원, 재난·복구 지원 등 정책 신청기에 부동산 관련 증빙서류 수요가 급증할 수 있고, 부동산종합증명서·부동산종합공부 확대 같은 제도 변화가 발급 경로와 수수료 구조에 영향을 줄 수 있음을 함께 명시합니다. 본 통계는 이러한 사회·정책 환경을 배경으로 지역별 민원 접근성, 수수료 부담, 디지털 전환 수준을 비교·분석하는 기초자료로 활용될 수 있습니다
