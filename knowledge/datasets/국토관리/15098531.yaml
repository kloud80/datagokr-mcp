description_portal: 이 데이터는 2020년 12월 31일을 기준으로 전북특별자치도 내에 소재한 가구 제조업체의 현황을 상세히 담고 있는 목록입니다. '2021 전북특별자치도 제조업체 총람'을 바탕으로 작성되었으며, 각 업체의 소재 지역, 사업체명, 업종코드, 그리고 주 생산품 등 핵심적인 산업 정보를 제공합니다. 본 자료는 도내 중소 제조업체의 생산 제품을 홍보하고 새로운 판로를 촉진하기 위한 목적으로 제작되었습니다. 따라서 상업적 용도로 사용하거나 대외적인 공식 통계 자료로 활용하는 것은 제한됩니다. 지역 내 가구 산업의 생태계와 주요 생산 품목의 분포를 파악하는 데 유용한 기초 자료입니다.
