summary_user: 전북특별자치도에 소재한 가구 제조업체를 업체 1곳당 1행으로 정리한 목록으로, 2020년 12월 31일 기준 '2021 전북특별자치도 제조업체 총람'을 바탕으로 지역·사업체명·대표자·업종코드(2자리)·주생산품·주소를 담는다. 도내에서 어떤 시군에 어떤 가구 업체가 무엇을 만드는지 찾으려는 구매처·사업자나, 지역 가구 산업의 분포를 살피는 분석가가 쓴다. 실측 컬럼에 사업자번호·필지번호 같은 전역 조인 키가 없어, 사업체명·주소 문자열 매칭이나 2자리 업종코드(표준산업분류 중분류로 보임)로 공장등록 현황 등과 느슨하게 이어 쓴다.
limits: 전역 조인 키가 없어 공장등록 원부나 기업 데이터와 정확히 연결되지 않고 이름·주소 매칭에 의존한다. 2020년 말 기준 시점 자료이며, 포털 설명상 홍보·판로 촉진 목적이라 상업적 이용이나 공식 통계로 쓰는 것은 제한된다.
