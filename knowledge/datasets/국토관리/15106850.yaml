summary_user: 경기도 양평군의 건축신고·건축허가 건을 한 건씩 담은 파일로, 2024년 12월부터 2025년 11월까지의 인허가 구분, 읍면 단위 대지위치, 건축목적(신축·증축·용도변경 등), 연면적·증축연면적, 구조, 동수, 세대·호·가구수, 주·부속건축물 수를 담는다. 양평군에서 어느 읍면에 신축 허가가 몰리는지, 주택 세대 공급이 얼마나 예정돼 있는지처럼 지역 개발 흐름을 앞서 가늠하려는 분석가·사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면 이름 매핑이나 같은 기관(양평군) 기준으로만 이어 쓰며, 건축물대장·착공·사용승인 데이터와 건 단위로 직접 연결되지 않는다.
description_portal: '양평군 건축인허가 현황을  제공합니다.기간 : 2024.12.1.~2025.11.30.데이터 내용 : 건축인허가(건축신고, 건축허가), 대지위치(해당 읍면까지만 제공), 건축목적(신축 재축 개축 대수선 증축 용도변경), 연면적, 증축시 연면적, 구조, 동수, 세대수, 호수, 가구수, 주건축물수, 부속건출물수사전정보공개 제공 사이트 : 양평군청 정보공개 사전정보공개 참조(https://www.yp21.go.kr/www/selectBbsNttList.do?bbsNo=49&key=1616), 월별 사전정보공개 건축신고 및 건축허가 : 집을 짓기 전 토지에 건축을 하겠다고 신고하는 행위, 신고 후 착공신고, 사용승인 등을 거쳐 최종적으로 건축물을 사용할 수 있게 되는 전 과정'
