summary_user: 김해시 관내 제조업체를 업체 한 곳당 한 행으로 담은 명부 파일로, 회사명·전화번호·읍면동·주소·주력생산품·근로자수를 담는다(csv 약 0.9MB, 시군구 범위의 개별 주소 단위). 사업자나 분석가가 김해시 어느 읍면동에 어떤 품목의 제조업체가 몰려 있고 고용 규모가 어느 정도인지 파악하는 데 쓴다. 사업자번호·업종코드(KSIC)·필지번호(PNU) 같은 전역 조인 키가 없어 다른 데이터와는 회사명이나 주소·읍면동 이름을 맞춰 연결해야 한다.
