summary_user: 지적재조사 사업에서 지적확정예정조서·의견신청·경계결정·이의신청·성과완료 단계별로 생성되는 지적측량성과(DAT) 파일의 검사 현황을 성과물 단위로 담은 파일로, 시군구·사업지구별 성과검사결과, 검사방법, 오류유형, 검사일자와 보완일자를 기록하며 범위는 전국 시군구다. 지적재조사 담당자나 측량 분석가가 '어느 사업지구의 측량성과 파일에서 어떤 유형의 오류가 많이 나오고, 보완까지 얼마나 걸렸나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(필지고유번호 등)가 없어 시군구코드·사업지구코드나 시군구명·사업지구명을 매핑해 다른 지적·지적재조사 데이터와 연결해야 한다.
description_portal: '지적재조사 사업시 지적확정예정조서를 작성시 진행단계별(지적확정예정조서, 지적확정예정조서 의견신청, 경계결정, 경계결정 이의신청, 성과완료)로 생성되는 DAT 파일에 관한 현황을 성과검사결과, 검사방법, 오류유형에 관한 데이터입니다.-지적측량성과(DAT)파일 : 지적측량 결과를 전산화된 형식으로 저장한 파일입니다. 이 파일은 지적재조사, 등록전환, 분할, 경계복원, 등록말소 등의 측량 업무 후 생성되며, 토지의 경계점 좌표, 면적, 지번, 도면 번호 등 중요한 지적 정보 파일(성과검사결과와 오류유형이 기입된  필지만 있습니다.)'
