summary_user: 경남개발공사 개발사업 지구 안의 지장물·영업장·수목 등 보상 대상을 건 단위로 기록한 보상 기본조사 원천 파일로, 사업 구분과 지번 관리 번호별로 보상 대상 제외 여부와 사유, 철거 여부, 추가 조사 여부, 소유자·권리자 확정 여부, 등록일시를 담는다(CSV 약 3.3MB). 보상 실무자나 분석가가 특정 사업지구에서 보상 대상 중 철거가 끝나지 않았거나 소유자가 확정되지 않은 건이 얼마나 남았는지 확인하는 데 쓴다. 전역 조인 키는 없어서 같은 공사의 다른 보상 데이터와 사업 구분 코드·지번 관리 번호로만 이어 쓴다.
description_portal: '이 데이터는 경남개발공사가 수행한 다양한 개발사업(예: 택지개발, 도로 건설, 산업단지 조성 등)에 수반되는 보상업무를 체계적으로 관리하기 위해 구축된 보상조사 기록 테이블입니다. 사업 시행에 따라 부득이하게 철거·이전·보상 등이 필요한 대상 항목(예: 지장물, 영업장, 수목, 기타 설비 등)을 대상으로, 현장 실사 및 행정 절차를 거쳐 등록된 조사 결과를 집대성한 구조입니다.각 항목은 특정 개발사업과 연계되며, ‘사업 구분 코드’를 통해 식별됩니다. 해당 사업지구 내 다수의 지번 또는 위치에 존재하는 보상 대상에 대해, 조사 시점의 상태, 철거 및 소유권 확인 여부 등 사안별 이력정보를 건 단위로 축적하고 있습니다.데이터는 조사 결과 및 행정 판단의 흐름을 정리한 원천 정보로, 향후 보상 대상 확정, 보상금 지급, 감정평가, 공탁, 소송 대응, 민원 처리 등 실무 전 과정에 연계되어 활용됩니다. 또한 조사 시점에서의 상태뿐 아니라 철거 이행 여부, 소유자 및 권리자 확정 여부 등의 추적도 가능하여 사후 관리 및 사업 마무리 단계에서의 책임 관리에도 중요한 근거자료로 작용합니다.'
