summary_user: 한국토지주택공사 사업지구별로 임대가 가능한 필지를 한 행씩 담은 파일로, 사업지구명·필지번호·토지면적(제곱미터)을 담는다. 기업이나 투자 검토자가 "어느 산업단지·택지지구에 임대 가능한 필지가 있고 면적은 얼마인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업지구명이나 필지번호를 이름 기준으로 맞춰 이어 써야 한다.
description_portal: 한국토지주택공사에서는 각 사업지구별로 임대가 가능한 필지에 대한 상세 정보를 제공합니다. 제공되는 정보에는 사업지구의 이름, 각 필지의 번호, 그리고 해당 필지의 토지 면적이 포함되어 있습니다. 토지면적별로 살펴볼 때, 단위는 제곱미터에 해당하며 전체 738만에 해당하는 필지를 가지고 있으며 이 중 군장군산3 134만(18.1%), 포철제4연관 60만(8.2%), 광주첨단2단계 58만(7.9%), 대구테크노폴리스 57만(7.7%), 석문국가산단 47만 필지(6.3%), 대불공단 46만 필지(6.2%)를 차지합니다.
