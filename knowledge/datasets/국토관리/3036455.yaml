summary_user: 국세청이 고시한 오피스텔·상업용 건물의 기준시가를 건물·층·호 단위로 담은 파일로, 고시일자·소재지(법정동코드·번지)·고시가격·전용면적·공유면적을 함께 싣고 전국 범위로 제공된다. 오피스텔이나 상가를 사고팔거나 상속·증여받을 때 해당 호실의 기준시가가 얼마인지 확인하려는 납세자·세무사, 지역별 상업용 부동산 과세 기준 가격을 비교하려는 분석가가 쓴다. 법정동코드(bjd_cd)를 키로 법정동 코드표, 건축물대장·공시지가 등 다른 부동산 데이터와 지역 단위로 잇는다.
description_portal: 기준시가란 부동산 양도소득세, 상속세, 증여세 등을 부과할 때 적용되는 정부가 결정한 과세 기준 가격으로, 토지와 건물 가격을 합산하여 국세청장이 매년 산정 · 고시하는 가액임2026년 오피스텔 및 상업용 건물에 대한 기준시가 고시｢상속세 및 증여세법｣제61조제1항제3호와 같은 법 시행령 제50조제3항 및 ｢소득세법｣제99조제1항제1호다목과 같은 법 시행령 제164조제10항에 따라 지정지역에 소재하는 오피스텔 및 상업용 건물에 대한 기준시가상업용건물 및 오피스텔의 기준시가 제공(상가건물번호, 상가종류코드, 고시일자, 법정동코드, 특수지코드, 번지, 호, 상가건물블록주소, 상가건물동주소, 건물층구분코드, 상가건물층주소, 상가건물호주소, 고시가격, 전용면적, 공유면적 등)
