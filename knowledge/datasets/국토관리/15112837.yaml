description_portal: 이 데이터는 경기도 양평군에서 발행된 지역화폐의 실제 사용 현황을 연령대와 로 집계한 자료입니다. 항목은 사용자 연령, 성별, 결제건수, 결제금액 등으로 구성되며, 특정 업종에서 지역화폐가 얼마나 사용되었는지를 금액 및 비율 기준으로 파악할 수 있도록 설계되어 있습니다. 지역경제 내 소비 흐름과 연령 및 성별에 따른 지역화폐 사용현황을 파악할 수 있어서 지역화폐 정책의 효과 평가, 소상공인 지원 방향 수립, 민간 소비 진작 전략 등에 근거 자료로 활용됩니다.본 데이터를 통해 업종별로 양평군 내 지역화폐(양평통보)를  사용할 수 있는 업소를 확인하고 주소 정보를 통해 방문해 지역화폐를 사용할 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 양평군청 일자리경제과로 연락주시기 바랍니다.
