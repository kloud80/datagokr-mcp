summary_user: 주택도시보증공사의 전세보증금반환보증과 전세자금대출특약보증 발급 실적을 분기별·주택유형별(아파트·오피스텔·연립·다세대·단독·다가구 등)·보증유형별로 건수, 금액(백만원), 건수 기준 비율로 담은 전국 단위 집계 파일이다. 전세 사기 이후 임차인의 보증 가입이 어떤 주택유형에서 얼마나 늘었는지를 따지는 정책 분석가나 연구자가 분기별 추이를 볼 때 쓴다. 전역 조인 키가 없어 전월세 실거래 등 다른 임대차 데이터와는 기준 분기와 주택유형 이름을 맞춰 이어 쓴다.
