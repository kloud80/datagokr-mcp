description_portal: 본 데이터는 대구광역시 수성구 관내 주요 도로 및 공공장소에 식재된 가로수 현황을 정리한 자료로, 수목명, 식재 위치(도로명 주소·지점명), 식재 연도, 수종(참나무·은행나무 등), 데이터 기준일자 등의 항목으로 구성된다. 가로수는 도시 미관 개선, 미세먼지 저감, 폭염 완화, 녹지 연계 등 다목적 공공자원으로 활용되며, 본 자료는 수종별 분포, 수령·수고 특성, 관리 등급 등을 분석하여 도시 녹지 정책, 생태 복지 계획, 도로 안전 관리, 미세먼지 방지 대책 등에 기초 데이터로 활용 가능하다. 또한 수목의 수종·연도·상태 정보를 바탕으로 노후 수목 정비 계획, 시민 안전 민원 대응, 스마트가로수GIS 구축, 도시열섬 완화 실태 진단 등을 지원할 수 있다. 수성구청은 정기적으로 현황을 갱신하고, 본 데이터는 환경·도시계획·공공안전·연구기관 등에서 광범위하게 활용될 수 있도록 개방합니다.
