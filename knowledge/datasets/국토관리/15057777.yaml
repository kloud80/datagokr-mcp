summary_user: 경기도 광교테크노벨리에 입주한 기관별로 구분(기업체, 기업지원기관, 대학 및 연구기관 등)에 따라 업체 수와 종사자 수를 집계한 통계로, 업체별 건별 명단이 아닌 분야별 집계값을 담는다. 산업 분석가나 지자체 정책 담당자가 "광교테크노벨리에서 기업체와 연구기관 중 어느 쪽 고용 규모가 더 큰가" 같은 클러스터 구조 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 산업단지·입주기업 데이터와는 기관명(INST_NM)이나 구분명을 이름으로 맞춰 연결해야 한다.
description_portal: 경기도가 광교에 조성한 광교테크노벨리(IT, BT, CT, NT가 융합된 차세대 첨단산업의 허브로 다수의 국내기업과 외국투자기업이 입주하고 있으며, 아주대, 경희대, 서울대 등의 대학연구소가 있는 세계적인 과학기술의 중심지)의 입주업체 분야별 종사자 집계현황입니다.이 데이터는 경기도 광교테크노벨리에 입주한 기관별로 업체 수와 종사자 수를 분야별로 집계한 자료입니다. 주요 항목에는 기관명, 구분명(기업체, 기업지원기관, 대학 및 연구기관 등), 업체 수(개), 종사자 수(명)가 포함되어 있습니다. 해당 데이터는 광교테크노벨리 내 산업 및 연구 기반의 구조를 파악할 수 있는 중요한 통계로, 기술집약 기업의 밀집도, 지원기관의 분포, 고용 규모 등을 분석할 수 있습니다. 이를 통해 산업 클러스터의 활성화 수준을 진단하거나, 정책적 지원의 필요성과 효과를 평가하는 데 활용될 수 있습니다.
