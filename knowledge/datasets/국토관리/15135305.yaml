description_portal: '이 데이터는 지역균형발전과 관련된 교육자료를 분야별로 체계적으로 정리한 것으로, 전문가 및 실무자들이 교육 콘텐츠를 신속하게 활용할 수 있도록 구성되어 있습니다. 주요 항목은 다음과 같습니다. 분야(교육자료가 속하는 주제 영역(예: 도시재생, 스마트시티, 지역경제, 사회적경제, 지자체 역량강화 등)),제목(교육자료의 공식 명칭 또는 강의 세션 제목),저자(작성자 또는 강의 진행자(연구자, 실무 전문가 등)),페이지 수(해당 자료의 전체 페이지 수(분량)),핵심 키워드(콘텐츠의 핵심 개념 및 주제어를 한눈에 파악할 수 있도록 정리(예: ‘지방재정’, ‘공공참여’, ‘디지털 전환’ 등)),URL( 실제 자료가 게시된 웹페이지 주소(강의 슬라이드, PDF, 동영상 강의 등으로 연결)).이 자료는 지자체 공무원, 연구자, 교육 담당자 등 다양한 계층의 이용자를 대상으로 설계되었으며, 주제와 분량, 핵심 키워드에 따라 맞춤형 교육 및 워크숍 프로그램을 기획하거나 참여할 때 유용하게 활용될 수 있습니다. 특히 지역교육 역량 강화, 정책 실행력 제고, 균형발전 전략 수립 등의 맥락에서 교육 콘텐츠를 선별하고 접속·다운로드할 수 있는 구조로 제공됨으로써 실무현장 및 학계에서 직관적으로 활용하기 적합합니다.'
