summary_user: 경상북도 의성군에 소재한 제조업체를 업체 한 곳당 한 행으로 담은 목록 파일(CSV, 약 21KB)로, 소속 단지명·회사명·공장 지번 주소·업종명·전화번호·종업원수를 담는다. 의성군 안에서 어떤 업종의 공장이 어느 읍·면과 단지에 몰려 있고 고용 규모는 어느 정도인지 확인하려는 지역 산업 분석가나 거래처를 찾는 사업자가 쓴다. 사업자번호·필지고유번호(PNU)·산업분류코드 같은 전역 조인 키가 실측 컬럼에 없어, 다른 데이터와는 회사명·지번 주소 문자열 매칭이나 같은 기관 자료로만 이어 쓴다.
description_portal: '이 데이터는 경상북도 의성군에 소재한 제조업체들의 현황을 구조화한 종합 목록입니다. 각 기업에 대해 다음과 같은 주요 항목들을 체계적으로 수록하고 있어, 지역 산업 분석과 정책 수립에 매우 유용합니다:사업체명: 기업의 공식 명칭을 정확히 기록하여 식별이 가능하도록 구성업종구분: 식품가공, 금속기계, 전자부품 등 기업이 속한 제조업 분야를 세분화산업분류코드: 한국표준산업분류(KSIC)에 따른 체계적 코드화로, 산업 통계 및 비교 분석에 적합소재지: 도로명 주소 또는 지번 중심의 세부 위치 정보(읍·면·리 포함)전화번호: 기업의 연락처 정보로, 실무용 정보 활용에 용이'
