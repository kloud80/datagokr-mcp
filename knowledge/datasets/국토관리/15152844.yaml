summary_user: 경기도 내 자료 제공기관별로 임대주택을 공공·민간 구분과 임대 유형별로 나눠 연도별 공급 호수와 재고 호수를 담은 집계 자료다. 주택 정책 분석가나 연구자가 경기도에서 공공·민간 임대주택이 해마다 얼마나 공급되고 쌓여 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 주택 통계와는 기준연도(yr)와 제공기관명을 이름으로 맞춰 이어 써야 한다.
description_portal: 경기도의 임대주택 공급 및 재고 현황입니다. 자료 제공기관별 임대주택 구분(공공/민간)별 공급 및 재고 호수 정보를 제공합니다.25년 10월 기준 국토교통부 통계누리에 공표된 가장 최신 통계인 2023년을 기준으로 제공하나, 제공기관별 보유 현황에 따라 기준연도가 다를 수 있으니 이용에 참고하시기 바랍니다.임대주택 공급 및 재고 호수관련 상세 문의는 제공기관의 주택관련 부서로 문의해주시기 바랍니다.LH(한국토지주택공사) 등 타기관이 보유한 자료는 미보유로 해당 수치는 제외되어 제공하며 [LH 청약플러스 - 청약 - 임대주택 검색]을 통해 시군구 단위의 임대주택 검색이 가능하니 참고해주시기바랍니다.
