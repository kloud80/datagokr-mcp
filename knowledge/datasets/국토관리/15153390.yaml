summary_user: 전국 상하수도 공공시설물의 안전점검 현황을 시설물 한 건씩 담은 데이터로, 시설명·종류·구분, 상태등급, 최근·다음 점검진단일, 위치, 관리기관, 주요 제원, 준공일, 사진 항목이 들어 있다. 주민이나 지자체 담당자가 '우리 지역 정수장·하수처리시설의 안전등급은 무엇이고 다음 점검은 언제인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 수도·하수 데이터와는 시설명·위치·관리기관 이름으로 맞춰 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국토교통부 국토안전관리원에서 제공하는 공공시설물의 안전점검 관련 정보입니다.\""
