summary_user: 서울특별시 건축물대장의 층별개요를 한 층당 한 행으로 담은 건별 원천 자료로, 대지위치·지번·도로명주소, 지상·지하 구분과 층번호·층명, 구조, 주용도·기타용도, 층별 면적, 주·부속 건축물 구분, 면적 제외 여부를 포함한다. 부동산 실사자나 리모델링·용도변경 검토자가 '이 건물 3층은 어떤 용도와 구조로 몇 ㎡가 등록돼 있는가'를 확인하는 데 쓴다. 전역 조인 키가 확인되지 않아 다른 건축물대장(표제부·전유부 등)과는 대지위치·시군구명·법정동명·본번·부번 같은 이름·지번 값을 맞춰 연결해야 한다.
description_portal: 이 데이터는 건축물의 층별 개요를 정리한 자료로, 각 층을 하나의 기록으로 하여 위치 정보(주소·지번·도로명), 지상·지하 구분, 층수와 층명, 구조 형식, 주용도와 기타 용도, 해당 층의 면적 등을 포함합니다. 동일 건물 안에서 층이 어떻게 구성되어 있는지, 각 층이 어떤 구조와 용도로 사용되는지, 층별 면적 규모가 어느 정도인지 파악할 수 있습니다. 또한 주건축물인지 부속건축물인지, 면적 산정에서 제외되는 부분이 있는지 여부 등 관리에 필요한 판단 항목도 담고 있습니다. 이 자료는 건축물 관리대장 점검, 리모델링·용도변경 검토, 안전 점검 계획 수립, 면적·용도 근거 확인, 부동산 실사 및 평가, 도시계획과 주택정비 사업 검토 등에 폭넓게 활용될 수 있습니다.
