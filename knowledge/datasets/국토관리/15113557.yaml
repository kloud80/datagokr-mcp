summary_user: 서대문구 안산 일대 17개 유동인구 센서(숲속쉼터, 산책로 도서관, 반려견놀이터 등)가 측정한 일일 유동인구를 날짜별 한 행에 센서 지점별 열과 전체 합계로 담은 집계 파일이다. 산책로·쉼터 운영자나 지역 분석가가 "안산 자락길에서 요일·계절별로 사람이 가장 몰리는 지점은 어디인가"를 확인해 편의시설 배치나 관리 인력 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 날짜를 기준으로 날씨·행사 자료와 맞대거나, 지점 이름으로 같은 구의 시설 자료와 수작업 매핑해 잇는다.
description_portal: '서대문구 안산 지역 유동인구 센서에서 측정된 2023년 4월 1일부터 2026년 5월 31일까지 일일 유동인구 데이터입니다.센서개수 : 17개  센서위치 : 숲속쉼터, 휠체어보관소, 너와집쉼터 화장실, 북카페화장실, 천연마당, 무악정화장실, 메타세콰이어화장실, 만남의 장소, 산책로 도서관, 독립문파크빌정류장, 현저테니스장, 능안정전망대화장실, 민방위비상급수시설앞, 안산연세화장실, 만우정, 반려견놀이터, 천연동황톳길 종점센서 위치 변경(2024년 5월 1일 벚꽃마당에서 숲속쉼터로 상암곡어린이공원에서 산책로도서관으로 위치변경) 센서 신규 설치 : 만우정(2024.5.1.), 천연동황톳길, 반려견놀이터(2024.9.1.)'
