description_portal: '한국부동산원(구.한국감정원)에서 제공하는 부동산 거래현황 중 토지매매 거래현황의 연도별 거래규모별 데이터입니다.* 토지매매 거래현황 : 토지와 건축물이 일괄거래된 내역의 토지건수 및 토지면적* 필지수 : 거래된 필지수* 면적 : 일반건축물의 경우 대지면적 + 집합건축물의 경우 대지권면<부동산거래현황 개요>ㅇ 국가통계 승인번호 : 제315003호ㅇ 법적근거 : 부동산 거래신고 등에 관한 법률 제 25조 및 시행령 제 19조의 4ㅇ 통계목적 : 토지, 건축물 등 부동산거래에 대한 정확한 정보를 수집·작성하여 부동산정책의 기초자료로 활용ㅇ 통계주기 : 월ㅇ 조사지역 : 전국ㅇ 조사방법 : 전국 시·군·구 신고자료 취합 및 집계'
