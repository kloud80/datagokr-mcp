summary_user: 광양시 관내에서 신고된 건축물 착공 건을 한 건씩 담은 파일(CSV 약 62KB)로, 건축구분·대지위치·지목·대지면적·연면적·건폐율·용적률·구조·층수·높이·동수·주용도와 허가일·착공예정일·착공처리일을 담는다. 분석가나 건설·부동산 사업자가 '광양시에서 최근 어떤 용도의 건물이 어느 지역에 얼마나 착공되고 있는가'처럼 지역 개발 흐름의 선행 지표를 볼 때 쓴다. 전역 조인 키(건축물 고유번호·법정동코드 등)가 없어 다른 데이터와는 대지위치 주소 문자열 매칭이나 같은 기관의 허가·사용승인 자료와 이름 기준으로만 이어 쓴다.
description_portal: 본 데이터는 전라남도 광양시 관내에서 신고된 건축물 착공 건에 대한 행정처리 이력을 체계적으로 관리하고, 건축 행정의 투명성과 도시계획의 기반자료로 활용하기 위해 구축된 자료입니다. 각 항목에는 건축물 구분(신축, 증축 등), 대지 위치, 지목, 대지면적 및 건축면적, 연면적, 증축면적 등 면적 관련 정보와 함께 건폐율 및 용적률, 구조 형태, 최고층수, 건물 높이, 동수 등 물리적 특성과 착공 예정일, 착공 처리일, 인허가 일자 등 행정처리 일정이 포함되어 있습니다. 또한 건축물의 주용도 정보(근린생활시설, 공장, 주택 등)를 통해 도시 내 공간 기능의 변화 추세를 파악할 수 있도록 구성되어 있으며, 정기적으로 집계 및 갱신되는 데이터를 기반으로 도시 공간 수요 예측, 인허가 처리 효율성 개선, 건축물 유형별 개발밀도 분석, 건축통계 기반 예산편성 자료로도 활용이 가능합니다. 민간 부문에서는 부동산 시장 분석, 건설 수요 예측, 시공 트렌드 연구, 건축정보 서비스 개발 등의 목적으로 연계 활용될 수 있으며, 데이터는 공공데이터포털을 통해 누구나 자유롭게 열람 및 활용할 수 있도록 개방되어 있습니다.
