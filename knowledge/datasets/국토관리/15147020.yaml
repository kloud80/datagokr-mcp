summary_user: 지방자치단체가 구축해 국토교통부가 취합한 도시계획사업지역(용도지역지구 분류)의 구역 정보를 시도별 SHP 파일로 담으며, 범위는 전국이다. 부동산·개발 분석가가 특정 지역이 도시계획사업지역으로 결정·고시됐는지, 언제 고시됐는지(NTFDATE)를 확인해 개발 가능성의 선행 지표로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 행정구역 이름·코드 매핑이나 같은 기관의 다른 연속주제 도면과 공간 중첩으로 이어 써야 한다.
