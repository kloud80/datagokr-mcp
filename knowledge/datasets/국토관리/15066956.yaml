summary_user: 경상남도 거창군이 운영하는 현수막 지정게시대를 한 곳씩 담은 파일로, 위치·지번주소·위도경도, 게시 가능 규모(열·면), 게시대 형태, 관리기관명·연락처를 시군구 단위 개별 시설 기준으로 제공한다. 거창군에 현수막을 합법적으로 걸려는 주민·사업자가 가까운 게시대 위치와 문의처를 찾을 때, 또는 분석가가 게시대 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도로 공간 결합하거나 같은 기관의 다른 시군 게시대 파일과 항목 이름을 맞춰 이어 쓴다.
description_portal: '경상남도 거창군 현수막지정게시대에 대한 데이터로 경상남도 거창군 현수막지정게시대의 위치, 경상남도 거창군 현수막지정게시대의 지번주소, 경상남도 거창군 현수막지정게시대의 게시가능 수, 경상남도 거창군 현수막지정게시대의 관리기관명, 경상남도 거창군 현수막지정게시대의 관리기관 연락처, 경상남도 거창군 현수막지정게시대의 게시대 형태 항목을 제공합니다.○ 데이터 기준일 : 2025.07.01.○ 현수막 지정게시대는 지방자치단체에서 운영하는 현수막 광고 공간으로, 지정된 장소에 현수막을 게시하여 광고하는 시설을 의미합니다. 지정게시대는 불법 옥외 광고물 문제를 해결하고 체계적인 광고 관리를 위해 설치되었습니다.'
