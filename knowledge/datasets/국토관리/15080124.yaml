summary_user: 대구광역시 달서구 안의 일반건축물에 대해 지방세 부과 기준인 시가표준액을 건물(동·호)별로 담은 파일 데이터로, 과세년도·법정동·본번·부번·물건지와 연면적, 기준일자가 함께 들어 있다. 건물 소유자나 부동산 분석가가 '달서구 이 건물의 올해 과세 기준 가액은 얼마이고 면적당 얼마인가'를 확인하거나 지역 내 시가표준액 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 건축물·토지 데이터와는 법정동·본번·부번 같은 지번 정보를 이름으로 맞추거나 자치단체코드로만 연결한다.
description_portal: 대구광역시 달서구에 일반건축물에 대한 지방세 부과 기준인 시가표준액을 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.시도명, 시군구명, 자치단체코드, 과세년도, 법정도, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 시가표준액, 연면적, 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.지역 내 일반건축물 시가표준액을 파악하는데 유용하게 참고자료로 쓸 수 있으며 물건별 재산 가액을 확인하는데 기초자료로 활용 가능합니다.
