summary_user: 전국 개별토지의 필지별 단위면적당 공시지가(원/㎡)를 기준연도·기준월, 공시일자, 표준지 여부와 함께 담은 건별 원천 데이터로, vworld에서 시도별 CSV·SHP 파일로 내려받는다. 토지 보유자나 분석가가 특정 필지의 올해 개별공시지가와 연도별 변화를 확인하거나, 과세·보상·거래 검토를 위해 지역별 지가 분포를 비교하는 데 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 행정·통계 데이터와 잇고, 필지 고유번호와 지번으로 지적·건축물대장 같은 필지 단위 국토 정보 원장과 대조한다.
description_portal: 국토교통부 개별공시지가정보는 국토교통부 장관이 매년 공시하는 표준지공시지가를 기준으로 시장·군수·구청장이 조사한 개별토지의 특성과 비교표준지의 특성을 대조하여 산출한 자료이다. 토지가격비준표상의 토지특성 차이에 따른 가격배율을 표준지공시지가에 곱하여 지가를 산정한 후, 감정평가업자의 검증을 거치고 토지소유자 의견수렴과 시·군·구 부동산가격공시위원회 심의 절차를 통해 결정·공시되는 개별토지의 단위면적당 가격(원/㎡) 정보를 제공한다. 이 데이터는 토지 가격 산정 및 과세, 부동산 거래, 정책 수립 등 다양한 분야에서 활용된다.해당 데이터는 SHP(Shapefile)와 CSV 형식으로 제공되며, 공간정보와 속성정보를 함께 관리할 수 있다. SHP 형식은 GIS 소프트웨어(ArcGIS, QGIS 등)에서 공간분석과 시각화에 활용하기 적합하며, CSV 형식은 엑셀, 데이터베이스, 통계·분석 도구(R, Python 등)에서 손쉽게 가공·처리할 수 있어 범용성이 높다. 이를 통해 토지 단위의 가격 정보를 공간분석, 행정업무, 연구·민간 서비스 개발 등 다양한 목적에 맞게 유연하게 활용할 수 있다.
