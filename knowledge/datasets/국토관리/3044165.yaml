summary_user: LH가 수급조절용으로 보유하거나 기업 부채상환용으로 매입한 비축토지를 필지 단위로 담은 목록 파일로, 사업지구·소재지·지번(산·본번·부번)·면적·지목·용도지역을 담는다. 공공 토지 비축 현황을 살피는 분석가나 사업자가 '어느 지역에 LH 비축토지가 얼마나, 어떤 지목·용도지역으로 있나'를 확인하는 데 쓴다. 전역 조인 키(법정동코드·PNU 등)는 없어서, 소재지와 산·본번·부번을 조합해 지번 기준으로 토지대장·공시지가 같은 필지 데이터와 이름 매칭으로 잇는다.
description_portal: LH에서 보유하고 있는 수급조절용 토지 및 기업의 부채상환용으로 매입한 토지 목록의 상세 정보(사업지구, 소재지, 면적 등)를 제공합니다. 21년도까지의 자료이며 지구별로 살펴볼 때  제주지역본부 46 지구, 부산울산지역본부 44 지구, 대전충남지역본부 28 지구입니다. 한국토지주택공사는 5,072,705 미터제곱의 토지를 비축하고 있으며 이중 81.1%가 제주지역본부의 비축토지이며, 4.5%가 광주전남지역본부의 토지입니다. 지목으로는 목 부분이 가장 많으며 전체 토지의 65.5%를 차지하고 있습니다.
