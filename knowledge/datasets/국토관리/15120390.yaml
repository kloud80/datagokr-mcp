summary_user: SH공사가 추진하는 청년안심주택의 공급계획을 단지별로 담은 파일로, 단지명·공급호수·전용 57㎡ 이하 공급예정물량·소재지·공급(예정)월을 한 행에 정리한 451바이트 규모의 작은 CSV다. 청년 주거 정책 분석가나 입주를 준비하는 청년이 '어느 자치구에서 언제 몇 호가 공급될 예정인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 소재지 주소를 행정구역 코드로 직접 매핑하거나 단지명으로 SH공사의 다른 모집·임대 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 서울주택도시공사(SH공사)에서 추진하는 청년안심주택의 공급계획 정보를 담고 있는 파일형 데이터로, 청년안심주택 공급단지명, 공급 호수, 소재지, 공급 일정 등의 항목으로 구성되어 있습니다. 청년안심주택은 사회 초년생, 대학생, 청년층을 대상으로 주거비 부담을 완화하고 안정적인 주거 기반을 제공하기 위한 서울시의 공공임대주택 정책입니다. 본 데이터를 통해 특정 시기, 특정 지역에 어떤 단지에서 얼마나 많은 주택이 공급될 예정인지 확인할 수 있어, 청년층의 수요 대응 정책 분석이나 주거복지 수급 현황 파악에 활용될 수 있습니다. 또한 지역별 청년 주거 수요와 공급의 불균형을 식별하거나, 향후 공급 계획을 예측하는 데 기초자료로 활용 가능합니다.
