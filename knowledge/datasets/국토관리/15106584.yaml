summary_user: 경기도 광주시에 설립된 지역주택조합을 조합 한 곳당 한 행으로 담은 작은 파일(약 709바이트 CSV)이며, 조합명·사업 위치·설립인가일·총세대수·조합원 수가 들어 있다. 광주시에서 지역주택조합 가입을 검토하는 시민이 "이 조합이 실제로 설립인가를 받았는지, 계획 세대수 대비 조합원이 얼마나 모였는지"를 확인하거나, 분석가가 시 단위 주택 공급 계획을 살필 때 쓴다. 전역 조인 키나 행정코드가 없어서 다른 데이터와는 조합명·위치 주소를 문자열로 맞추거나 같은 기관(광주시) 기준으로만 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시에 설립된 지역주택조합의 현황 정보를 제공합니다. 지역 주민들이 공동으로 주택을 건설하기 위해 구성한 주택조합의 설립과 사업 정보를 담고 있습니다. 조합명은 주택조합의 명칭이며, 위치는 조합이 건설하는 주택 단지의 소재지를 나타냅니다. 설립인가 현황은 조합 설립이 승인된 날짜를 표시하고, 총 세대수는 건설 예정 또는 건설된 주택의 세대 규모를 제공합니다. 조합원 수는 조합에 가입한 회원 수를 나타냅니다. 본 데이터는 주택 공급 계획, 주택조합 관리 감독, 주거 정책 수립, 주택 건설 현황 파악, 조합 사업 투명성 확보 등에 활용됩니다.
