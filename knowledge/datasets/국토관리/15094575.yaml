summary_user: 경기도 하남시에 등록된 공장을 한 곳씩 담은 건별 명부로, 회사명·도로명/지번 주소·업종명·생산품명·종업원수·전화·팩스와 위도·경도를 담는다(포털 설명상 2025년 6월 기준, CSV 약 204KB). 제조업 조사자나 기업 관계자가 '하남시 어느 지역에 어떤 업종의 공장이 몰려 있고 규모는 어느 정도인가'를 파악할 때 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키는 없어서, 주소나 좌표로 지도·토지 데이터에 맞추거나 회사명·업종명을 이름으로 매핑해 다른 공장등록 데이터와 이어 쓴다.
description_portal: 2025년 6월 기준 경기도 하남시에 등록되어있는 공장에 대한 정보를 포함하고 있습니다. 산업집적활성화 및 공장설립에 관한 법률에 의거하여 등록된 공장 정보를 기반으로 작성되었습니다.하남시 관내 등록되어 있는 각 공장들의 회사명, 공장대표주소(도로명,지번), 전화번호, 팩스번호, 종업원수, 업종명 등을 제공합니다. 종업원 수는 등록 당시 기준의 종업원 수로 실제 종업원수와 다를 수 있습니다. 해당 정보들을 통해 행정기관 및 기업 관계자 또는 제조업 관련 조사 등에 다각적으로 분석하는데 기초 자료로 활용될 수 있습니다.
