summary_user: 경기도 내 소규모 주택정비사업(가로주택정비·합필형·건축협정 등)을 사업 한 건씩 시군구·주소 단위로 담는다. 시행자, 용도지역, 면적, 유형별 공급세대수, 기존·신축 용적률, 조합설립인가부터 착공·준공까지의 추진 단계를 함께 기록한다. 투자자나 주민은 '우리 동네 가로주택정비사업이 지금 조합설립 단계인지 사업시행인가 단계인지'를 확인하는 데 쓰고, 분석가는 단계별 사업 분포를 보는 데 쓴다. 실측에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 시도·시군구명과 상세주소 같은 이름·주소 매칭으로 잇는다(토지 식별번호 필드가 있지만 키로 검증되지 않았다).
description_portal: 이 데이터는 경기도 경기부동산포털에서 제공하는 소규모 주택정비사업 현황으로, 가로주택정비사업, 합필형, 건축협정 등 유형별 정비사업을 시군구와 주소 단위로 제공합니다. 주요 항목에는 시행자 및 공동시행자, 용도지역, 면적, 공급세대수(토지등소유자·일반·공공임대·공공지원민간임대), 기존 및 신축 용적률, 특례 적용 여부, 빈집·주차장 여부가 포함됩니다. 또한 동의서 검토, 추진위원회 승인, 조합설립인가, 건축심의, 사업시행계획 인가, 착공, 준공, 이전고시 등 단계별 추진 상황과 중단사유를 기록합니다.
accrual_periodicity: 수시
team:
  dept: AI미래행정과
