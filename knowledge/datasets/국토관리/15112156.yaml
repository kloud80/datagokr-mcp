description_portal: '- 제주특별자치도개발공사는 취수원의 보전 및 체계적인 관리 기반을 마련하고, 지속 가능한 관리 방안을 확립하기 위해 제주삼다수 유역의 수문지질을 연구하고 있으며, 이에 대한 성과를 논문으로 발표하고 있습니다. - 제주삼다수의 취수 안정성과 주변 지역에 미치는 영향을 과학적으로 분석함으로써, 제주도민이 지하수를 효율적이고 안전하게 활용할 수 있도록 지속적인 연구 활동을 수행하고 있습니다. - 취수원 인근의 지질, 지하수, 지하수위 등에 대한 종합적인 연구를 통해 기후변화 등 다양한 환경 변화에 선제적으로 대응하고, 제주도의 소중한 공유 자원인 지하수의 보존을 위해 최선을 다하고 있습니다.'
