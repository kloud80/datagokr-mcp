summary_user: 전북특별자치도 안 정보화 마을을 마을 한 곳당 한 행으로 정리한 파일(csv, 약 4KB)로, 시군명·도로명주소·마을명·대표자 성명·전화번호·협회 소속·특산물을 담는다. 특산물을 사거나 체험 프로그램을 찾는 국민이 '우리 시군에 어떤 정보화 마을이 있고 무엇을 파는가'를 확인하거나, 분석가가 시군별 정보화 마을 분포와 특산물 구성을 보는 데 쓴다. 전역 조인 키는 없어서 시군명이나 도로명주소를 이름·주소 매칭해 행정구역 코드나 다른 마을·농촌 데이터와 이어 붙인다.
description_portal: 이 데이터는 전북특별자치도 내 ‘정보화 마을’의 운영 현황을 정리한 자료입니다. 정보화 마을은 디지털 기반을 활용해 지역 특산물 판매, 체험 프로그램 운영 등으로 농촌 경제를 활성화하고 있는 마을입니다. 본 데이터는 시군명, 도로명주소, 마을명, 대표자 성명, 연락처, 협회 소속, 특산물 정보 등을 포함하고 있으며, 마을의 현황이 수록되어 있습니다. 주민 참여형 마을 정보화 사업 현황 파악, 특산물 유통 경로 분석, 지역 자원 활용 사례 연구 등에 활용될 수 있습니다. 데이터는 전라북도 정보화총괄과에서 관리하며, 매년 갱신주기 1회로 제공됩니다. 행정, 학술, 정책 활용도 높은 지역 특화 자료입니다.
