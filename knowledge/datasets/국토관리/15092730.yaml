summary_user: 대구광역시 서구에 등록된 공장을 한 곳씩 회사명·도로명 주소·전화번호·생산품으로 담은 시군구 단위 공장등록 명부 파일(CSV)입니다. 서구에 어떤 제조업체가 어떤 품목(의류, 금형, 식품, 전자부품 등)을 만드는지 알고 싶은 분석가나 공장 입지·거래처를 찾는 사업자가 '서구에서 금형을 생산하는 공장은 어디에 있나' 같은 질문에 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 데이터와는 회사명이나 주소를 직접 맞춰 이어 쓴다.
description_portal: 대구광역시 서구의 공장등록 현황입니다. 서구 내 공장의 회사명, 공장주소, 전화번호, 생산품 등 데이터를 포함하고 있습니다.이 데이터는 대구광역시 서구 내에 위치한 제조업체 등의 공장 등록 현황을 수록한 자료이다. 해당 데이터는 기업명, 소재지(도로명 주소), 전화번호, 생산품목 등의 정보를 포함하고 있으며, 지역 내 산업 분포 및 업체 유형을 파악하는 데 활용될 수 있다. 주요 생산품은 의류, 금형, 식품, 전자부품, 방화문, 의료기기 등으로 다양하며, 이를 통해 서구 지역의 산업 특성과 제조 기반을 이해할 수 있다. 데이터는 사업자 등록이 완료된 업체 중 실제 제조시설을 보유한 공장 중심으로 구성되어 있으며, 지역경제 분석, 입지 선정, 기업지원 정책 수립 등에 활용 가능하다. 일부 항목은 연락처 또는 상세 주소 정보가 누락될 수 있으며, 이는 업체의 등록 상태에 따라 다소 차이가 있을 수 있다.
