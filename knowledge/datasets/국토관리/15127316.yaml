summary_user: 세종시설관리공단이 운영하는 은하수공원 화장장의 화장 건수를 월(연월) 단위로 집계한 파일로, 대인·소인·개장유골·사산아 같은 대상 구분과 기증시신·유공자·수급자·군복무자·무연고자 등 전액감면 대상별 건수를 담는다. 장사 정책 담당자나 분석가가 '세종 공공 화장장에서 무연고자·수급자 화장이 매달 몇 건이고 전체 이용 중 감면 비중이 어떻게 변하는가'를 볼 때 쓴다. 전역 조인 키는 없어 연월을 기준으로 다른 지역 화장장 통계나 세종시 사망 통계와 시점을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: '세종시설관리공단이 운영하는 은하수공원 화장장의 월별 화장 서비스 이용현황에 관한 통계 데이터를 제공합니다. 이 데이터는 화장 대상자의 연령, 상태, 사회적 신분에 따라 세분화된 항목별 집계 정보를 포함하고 있습니다.주요 데이터 구성 항목:연령 및 상태별 분류대인: 성인 연령대의 일반적인 화장 건수소인: 미성년자를 대상으로 한 화장 건수개장유골: 기존 매장된 유골을 개장하여 화장한 건수죽은태아: 태아 상태에서 사망한 경우의 화장 건수기증시신: 의학 연구 또는 교육 목적으로 기증된 후 화장된 시신 건수사회적 배려대상자별 분류유공자: 국가유공자 및 그 유족에 대한 화장 서비스 제공 건수수급자: 기초생활보장 수급자를 대상으로 한 화장 건수군복무자: 현역 또는 예비역 군인 신분의 화장 건수무연고자: 연고자가 없거나 확인되지 않은 고인의 화장 건수이 통계는 매월 단위로 갱신되어 은하수공원 화장장의 운영현황과 지역 내 화장 서비스 이용패턴을 파악할 수 있는 기초자료로 활용됩니다. 연령대별 이용비율, 사회적 배려계층에 대한 서비스 제공 실태, 특수한 상황의 화장 서비스 수요 등을 종합적으로 분석할 수 있는 데이터셋입니다. 또한 공공 화장 시설의 사회적 역할과 취약계층에 대한 복지 서비스 제공 현황을 모니터링하는 데 중요한 지표로 활용됩니다.'
