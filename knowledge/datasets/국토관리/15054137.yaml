summary_user: K-water가 위탁운영하는 22개 지방자치단체 지방상수도의 수도 구경(mm)별 월 기본요금(원)을 지자체·구경 단위 행으로 담은 소규모 파일(csv 약 6KB)이다. 동두천·파주·거제 등 위탁 지자체의 주민이나 사업자가 "우리 건물의 수도관 구경이면 월 기본요금이 얼마인가", 분석가가 "위탁 지자체 사이 기본요금 차이는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키나 지자체 코드는 없어 지자체 이름으로만 다른 상수도·요금 데이터와 맞춰 써야 한다.
description_portal: 'K-water에서 위수탁 중인 지방 상수도 수도 구경별 요금 정보현황입니다.o 안내사항  1. 수자원공사에서 위탁운영하는 22개 지방자치단체의 지방상수도 관련 정보    -(지자체) 동두천, 광주, 양주, 파주, 단양, 논산, 서산, 금산, 정읍, 나주, 장흥, 함평, 완도, 진도, 청송, 고령, 예천, 봉화, 거제, 사천, 통영, 고성(경남)  2. 제공되는 항목 : 위탁운영중인 지방자치단체 수도사업장, 상수도구경(단위 : mm), 구경별 적용되는 금액(단위 : 원)   3. 요금 적용 기준      - 요금은 기본요금(원/월) 기준이며, 사용량에 따라 추가 요금이 발생할 수 있습니다.  “K-water는 지방상수도의 효율적 관리 및 서비스 향상을 위해22개 지자체로부터 위탁받아 상수도 운영을 수행하고 있으며,본 데이터는 투명한 요금정보 제공과 주민·기업의 요금 예측 편의를 위해 공개됩니다.”자세한 사항은 해당 홈페이지에서 확인하시기 바랍니다.https://www.data.go.kr/data/15054137/fileData.do※ 수도 구경(mm)이란?  수도관의 지름을 의미하며, 통상적으로 관의 크기에 따라 가정용/업무용/산업용 등으로 분류됩니다.  예) 13mm: 일반 가정, 20mm 이상: 상가 및 소규모 업체, 50mm 이상: 대형 건물 또는 공장 등* 수도 구경(mm)은 일반적으로 구경이 클수록 더 많은 수돗물을 공급할 수 있습니다.※ 활용 예시  - 수도요금 비교 분석: 지자체 간 수도 기본요금 차이를 분석하여 정책 제안에 활용  - 민간기업: 구경별 수요 예측 및 배관 설계 비용 산정에 활용※ 자세한 요금 체계 및 지역별 비교 시각화는 [데이터 포털 링크]를 통해 확인 가능합니다.  상세 요금 산정 기준 및 문의: 해당 지자체 수도사업소'
