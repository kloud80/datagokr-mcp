summary_user: 대구도시개발공사가 공급한 분양용 토지를 블록·롯트 단위로 한 행씩 담은 건별 파일로, 소재지 주소(본번·부번), 용도, 당초·확정 면적과 단가·금액, 임대보증금·연간임대료, 계약상태를 담는다. 토지 수요자나 분석가가 "대구도시개발공사가 공급한 특정 블록 필지의 확정 분양가와 계약 여부는 어떤가"를 확인하거나 공공 분양 토지 시세를 비교하는 데 쓴다. 전역 조인 키는 없어서 소재지 주소·본번·부번을 주소 매핑으로 연결하거나 같은 기관 데이터의 블록·롯트번호·공급코드로만 이어 쓴다.
description_portal: 이 데이터는 대구도시개발공사에서 공급한 분양용 토지의 상세 정보가 포함된 공공데이터입니다. 토지, 블록번호, 롯트번호, 롯트세부번호, 토지구분, 소재지우편번호, 소재지기본주소, 소재지상세주소, 소재지_본번, 소재지_부번, 용도구분, 당초면적, 당초단가, 당초금액 등의 항목을 포함합니다. 이를 통해 분양 토지의 물리적·행정적 특성을 파악할 수 있으며, 수요자 대상 정보 제공, 공급 계획 수립, 시세 분석 등의 다양한 행정 및 정책 분야에 활용됩니다. 공공 토지 자원의 활용 효율성 제고와 투명한 분양 관리에 기여합니다.
