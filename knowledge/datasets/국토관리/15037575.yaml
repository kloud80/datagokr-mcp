summary_user: 경기도 파주시에서 태양광 발전시설로 개발행위허가를 받은 사업부지를 부지 한 건씩 담은 파일 데이터로, 주소·위도·경도와 지목, 지적면적, 용도지역지구, 허가면적, 허가일자, 허가조건, 준공 여부를 함께 담는다. 재생에너지 분석가나 사업자가 '파주시에서 태양광 허가가 어떤 지목·용도지역에 몰려 있고 실제 준공까지 간 비율은 얼마인가'를 확인할 때 쓴다. 전역 조인 키는 없으므로 지번주소·도로명주소나 위경도 좌표를 매개로 토지이용규제·지적 정보 같은 다른 공간 데이터와 맞춰 이어 쓴다.
limits: 파주시 한 개 시군구만 다루므로 다른 지자체나 전국 단위 비교에는 따로 같은 형식의 데이터를 모아야 한다. 공통 코드 키가 없어 다른 데이터와 붙일 때는 주소 문자열이나 좌표 매칭에 의존해야 한다. 명세상 갱신 주기는 연간·이벤트성으로 표시되어 있어 최근 허가 건이 바로 반영된다고 보기 어렵다.
