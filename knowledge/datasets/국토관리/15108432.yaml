summary_user: 충청남도 홍성군 광천전통시장의 시장 정보와 시장 안 상점별 정보(상점명, 상점 유형, 판매 품목, 영업시간, 주소·좌표 등)를 개별 상점 단위로 담는 API이다. 광천시장을 찾는 주민·방문객이나 지역 상권 분석가가 '광천시장에 어떤 업종 상점이 있고 주차장·공중화장실·배송 서비스가 있는가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시장명·상점명 같은 이름 매칭이나 주소·위경도(lat, lot) 기반 위치 결합으로만 이어 쓴다.
limits: 홍성군 광천전통시장 한 곳만 다루며 다른 시장이나 시군구와 비교하려면 별도 데이터가 필요하다. 표준 코드 형태의 조인 키가 없어 다른 데이터셋과의 연결은 이름·주소 매칭에 의존한다. 개발계정은 하루 8,000회 호출로 제한된다.
