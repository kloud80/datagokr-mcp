summary_user: 서울시 강우량 관측소별로 관측소명·자치구명·10분 강우량(RN_10M)과 자료수집 시각을 담은 관측 시계열 자료이며, 포털 설명상 서울시 관측소는 47개소입니다. 시민이나 재난 담당자가 '지금 우리 구에 비가 얼마나 오고 있나'를 확인하거나, 분석가가 집중호우 때 자치구별 강우 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 수문 자료와는 자치구명·구 코드나 관측소명을 직접 매핑해서 잇는다.
description_portal: '서울시내 강우량 정보를 강우량 측정계명, 구청명, 시우량(시간당 강우량), 최대 우량, 일일누계, 일년누계, 송신지 자료수집 시각, 수신서버 저장 시각 정보를 OpenAPI로 제공합니다.- 강우량관측소 : 비가오는 양을 측정하는 시스템으로 우리시에는 47개소의 관측소가 있으며 시·자치구 재해대책상황실에서 실시간으로 강우량자료를 전송받고 있습니다. - 기상위성수신장치(氣象衛星受信裝置) : 적도상공 35,000㎞ 고도에서 지구의 자전속도와 같은 가속도로 지구주위를 돌고 있는 일본기상위성(GMS:Geostationary Meteorological Satellite)의 안테나를 통해서 보내온 구름사진을 컴퓨터 화면에 표출하는 시스템입니다.'
