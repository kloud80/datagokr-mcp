summary_user: 전국 건물에 설치된 승강기를 한 대씩(승강기고유번호·호기 단위) 담는 건별 제원 데이터로, 승강기 종류·상태·설치일자·모델·제조업체·검사유효만료일자와 최대정원·적재하중·카 및 출입구 치수, 운행층수·운행구간, 건물 지상·지하 층수를 포함한다. 건물 관리자나 이용자가 "우리 건물 승강기의 검사 유효기간이 언제 끝나고 정원·적재하중은 얼마인가"를 확인하거나, 분석가가 지역별 노후 승강기 분포를 파악하는 데 쓴다. 전역 공통 조인 키가 없어 다른 데이터와는 건물명·시도·시군구 같은 이름 매핑이나 같은 기관의 승강기고유번호로만 연결한다.
limits: 실측 컬럼에 건물관리번호·법정동코드 같은 전역 조인 키가 없어 건축물대장 등과 정확히 붙이려면 주소·건물명 매칭이 필요하다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
