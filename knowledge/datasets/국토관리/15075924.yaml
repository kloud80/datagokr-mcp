summary_user: 판교테크노밸리에 입주한 기업을 한 건씩 담은 명단으로, 소속 시군·용지 유형·컨소시엄명과 기업명, 업종·표준산업분류 코드, 기업규모·분류, 설립연도, 임대면적, 도로명·지번 주소와 위경도를 담는다. 구직자나 영업 담당자가 판교에 어떤 업종·규모의 기업이 어디에 입주해 있는지 찾거나, 분석가가 테크노밸리의 산업군 분포와 창업 기업 구성을 파악하는 데 쓴다. 실측상 전역 조인 키는 없어 표준산업분류 코드(stdd_indust_class_cd)나 기업명·주소 매핑, 위경도 좌표로 산업단지 입주기업·공장 등록 자료와 맞춰 쓴다.
description_portal: 이 데이터는 판교테크노밸리 내 입주 기업들의 현황을 기록한 자료로, 테크노밸리의 창업 생태계와 기업 활동 현황을 분석하는 데 활용됩니다. 주요 항목에는 ‘시군명’, ‘테크노밸리용지유형’, ‘컨소시엄명’을 통해 기업이 소속된 공간 유형과 지원기관 정보를 제공하며, 기업의 활동 분야와 산업분류 정보를 확인할 수 있습니다. ‘기업규모’ 및 ‘기업분류’ 항목으로 기업의 성격을 파악하는 데 도움이 되며 기업의 위치 및 기본 정보를 확인할 수 있습니다. 이 데이터는 입주기업 특성 분석, 창업지원 성과 평가, 산업군 분포 파악, 테크노밸리 공간 활용도 분석, 유망 기업 발굴 등에 활용될 수 있습니다.
