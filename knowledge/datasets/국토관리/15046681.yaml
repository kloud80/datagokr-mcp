description_portal: '○ 통계개요* 통계명 : 누수율* 통계종류 : 서울시 상수도 생산량과 누수율 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 상수도 보급현황, 시설물현황, 요금ㆍ재정 등에 대한 현황을 조사ㆍ분석하여 시설의 적정 설치 및 관리를 위한 정책수립의 기초자료를제공하는 것을 목적으로 함* 조사체계 : 수도사업소 → 서울아리수본부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 서울시 상수도 총급수량, 무효수량, 누수율 현황○ 용어설명* 무수수량 : 유효수량 중 요금으로 부과되지 않은 수량- 수도사업용수량 : 수도사업을 위해서 사용되어 요금징수가 되지 않은 수량(배수지 항 청소, 관세척, 공사 등을 위해 관내 채워진 물을 배출시킨 수량 등)- 부정사용량 : 허가를 받지 않고 불법적으로 사용한 수량- 계량기 불감수량 : 수용가계량기를 통과하여 유효하게 사용되었으나 계량기에 감지되지 않아 요금징수 대상이 되지 않는 수량* 무효수량 : 사용상 무효라고 인정되는 수량- 조정감액수량 : 오염 등 수도사업자의 귀책사유로 인해 요금징수시 감액대상이 된 수량- 누수량 : 송수시점 이후 급수사용자의 계량기 이전까지 발생한 손실수량○ 기타* 누수율=(누수량÷연간 총급수량)×100'
