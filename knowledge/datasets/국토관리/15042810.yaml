summary_user: 인천광역시 서해구 산업단지에 입주한 업체를 한 줄에 한 곳씩 담은 명단 파일로, 단지명·회사명·대표업종번호와 업종번호·업종명·공장 도로명주소로 구성된다(csv 약 190KB). 어느 산업단지에 어떤 업종의 회사가 모여 있는지 확인하려는 구직자·영업 담당자나, 단지별 업종 분포를 보고 기업 유치 방향을 잡으려는 행정 담당자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업체명·단지명 같은 이름이나 업종번호로 맞추거나 도로명주소를 주소 매칭해서 공장 등록·산단 통계와 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서해구에 위치한 산업단지 내 입주 기업 정보를 담은 데이터입니다. 본 자료는 인천광역시 서해구의 산업단지 내 업체의 단지명, 회사명, 대표업종번호, 업종명, 도로명 주소 등의 정보로 구성되어 있습니다. 본 데이터를 통해 각 업체가 어떤 산업단지에 위치하고 있는지 어떤 업종에 종사하고 있는지를 확인 할 수 있습니다. 본 데이터를 통해 산업단지 내 업체의 분포현황을 파악하여 기업 유치,산업 정책 수립등의 행정 자료에 활용 될 수 있을것을 판단됩니다. 본 데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
