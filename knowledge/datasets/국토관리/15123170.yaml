summary_user: 경기도 광주시 도시계획정보시스템에 등록된 하수처리장·폐기물처리시설 같은 환경기초시설을 시설(도형) 한 건씩 담은 파일로, 시설 명칭과 부지 면적, 선형 시설의 길이, 등록 일시가 들어 있으며 범위는 광주시 한 곳입니다(CSV 약 2.6KB). 광주시 안에 어떤 환경기초시설이 도시계획시설로 잡혀 있고 각각 부지가 얼마나 되는지 확인하려는 도시계획 담당자나 분석가가 쓴다. 전역 조인 키는 없고, 시군구코드나 시설 명칭(라벨명)을 맞춰 같은 기관의 다른 도시계획시설 현황 데이터와 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 환경기초시설 현황 정보를 제공합니다. 하수처리장, 쓰레기처리시설, 폐기물처리장 등 환경 관리를 위한 기초시설의 위치와 규모 정보를 담고 있습니다. 현황도형 관리번호는 각 시설을 고유하게 식별하며, 라벨명은 시설의 명칭을 나타냅니다. 면적은 시설이 차지하는 부지 면적을 제공하고, 길이는 선형 시설의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 환경 시설 관리, 도시 기반시설 계획, 환경 정책 수립, 시설 용량 분석, 도시 개발 계획 등에 활용됩니다.
