summary_user: 창녕군이 관리하는 배수펌프장을 시설 한 곳당 한 행으로 담은 시설현황 파일로, 위치·준공/보강연도·펌프 마력과 대수·처리능력(분당 세제곱미터)·유수지용량·수문 수·수혜지역·방류하천을 포함한다(CSV 약 3KB 규모의 소량 자료). 집중호우 때 창녕군 어느 지역이 어떤 배수장의 보호를 받고 그 배수 능력이 얼마인지 확인하려는 재난 담당자나 주민, 노후 시설을 점검하는 분석가가 쓴다. 전역 조인 키가 없어 방류하천명을 하천 목록과 이름으로 맞추거나 배수장위치 주소를 지오코딩해 다른 시군 배수펌프장·하천 자료와 잇는다.
description_portal: 경상남도 창녕군 재난대응용 배수펌프장 시설현황 입니다. 1. 배수장명칭, 배수장위치, 준공연도, 보강연도, 펌프마력, 펌프대수, 처리능력, 유수지용량, 수문수, 수혜지역, 방류하천명, 관리기관명, 관리부서, 운영기간 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 8일이며, 해당 자료는 매년 1회 정기적으로 업데이트됩니다.3. 보강연도, 유수지용량이 없는 데이터가 존재합니다.4. 데이터에 대하여 추가 문의사항이 있는 경우에는 창녕군청 건설산업국 안전치수과 재난예방시설팀 055-530-2134로 문의 주시기 바랍니다.
