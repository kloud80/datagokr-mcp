description_portal: '군산, 부안, 김제 등 새만금 지역 내 토지의 지목별 현황 데이터는 총 24개 항목으로 세분화되어 제공되며, 전(田), 답(畓), 목장용지, 임야, 염전, 도로, 철도용지, 공장용지, 학교용지, 주차장, 창고용지, 하천, 제방, 공원, 체육용지, 유원지, 종교용지, 묘지, 잡종지 등 다양한 지목을 포함합니다. 각 지목별 면적은 천㎡ 단위로 정리되어 있어 토지의 용도별 분포를 한눈에 파악할 수 있습니다. 이 자료는 토지 이용 현황 분석, 도시계획 수립, 부동산 개발 전략 마련, 환경 관리 및 보존, 정책 설계 등 다양한 분야에서 핵심 기초 자료로 활용될 수 있습니다. 또한 정기적으로 갱신되어 최신 토지 정보를 반영하므로, 행정기관, 연구자, 기업 등이 신뢰성 있게 활용할 수 있으며, 장기적인 개발 방향과 공간 활용 전략 수립에도 중요한 역할을 합니다.참고: 지목의 종류는 총 24종으로  전, 답, 목장용지, 임야 등의 면적(단위: 천 m2)입니다.'
