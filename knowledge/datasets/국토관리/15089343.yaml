summary_user: 의왕시 상하수도 요금표를 업종·자원 구분별 한 행으로 담은 소규모 CSV 파일(1,960바이트)로, 기본요금과 사용량 1~8단계 구간별 단가, 혼합업종 요금, 적용 시작·종료일자를 포함한다. 의왕시에서 가정용·영업용 등 업종별로 한 달 사용량에 따라 수도요금이 얼마 나오는지 계산하거나 다른 시군과 요금 구조를 비교하려는 시민·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명·자원구분 같은 이름 매핑이나 같은 기관(의왕시) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 의왕시에서 운영하는 상하수도 요금 체계 정보를 체계적으로 정리한 자료입니다. 요금 부과 기준을 시구분, 자원 유형, 업종 코드 등으로 구분하고 있으며, 각 업종별로 기본요금, 사용량 구간, 단계별 요금 단가 등이 상세히 포함되어 있습니다. 혼합 업종 여부나 가구 분할 적용 여부, 기본요금 부과 기준도 함께 제공되어 실제 요금 산정 구조를 면밀히 파악할 수 있습니다. 또한 적용 시작일자와 종료일자를 통해 시간에 따른 요금 변경 이력도 추적 가능합니다. 이 데이터는 공공요금의 투명한 운영과 합리적인 요금 체계를 이해하는 데 도움을 주며, 요금 시뮬레이션이나 수돗물 소비 분석, 업종별 요금 비교 등 다양한 분야에서 활용될 수 있습니다. 특히 사용량 기준으로 설정된 1단계부터 최대 8단계까지의 구간별 요율 정보는 현실적 요금 부담 분석에 유용하며, 혼합 업종에 대한 별도 항목 제공으로 요금제 다양성을 반영하고 있습니다.
