description_portal: 대구광역시 서구 내에서 빗물을 집수하여 활용하는 시설에 대한 정보를 포함하고 있습니다. 포함 데이터로는 시설명, 주소지, 설치년월, 집수면(집수면적), 저류조의 용량과 용도 등이 있습니다.본 데이터는 대구광역시 서구 관내에 설치된 빗물이용시설의 현황을 체계적으로 수집·정리한 자료이다. 각 시설별 위치, 명칭, 도로명 주소와 더불어 설치 시기 및 집수면적, 여과·처리시설 현황, 저류조 용량, 연간 빗물 사용량 등의 상세 정보가 포함되어 있다. 빗물활용용도는 조경수, 텃밭용수, 교육용수 등으로 구분되며, 법적 시설 대상 여부 또한 명확히 명시되어 있다. 이를 통해 관내 빗물이용 인프라의 규모와 특성을 파악할 수 있으며, 정책 수립 및 관리에 활용할 수 있다. 체계적이고 상세한 정보 제공으로 데이터 검색의 편의성과 사용자의 이해도를 높이고자 하였다.
