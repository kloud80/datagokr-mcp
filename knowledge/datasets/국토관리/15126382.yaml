summary_user: 전라남도 내 분뇨처리시설을 시설 1곳당 1행으로 담은 현황 파일로, 포털 설명상 23개소의 소재지·준공일·시설용량·처리량·처리공법·유입·방류 수질(BOD·TOC·SS·총질소·총인·대장균수)·방류수역·운영주체·직원 수를 시도 범위에서 시설 단위로 제공한다. 지자체 환경 담당자나 분석가가 "우리 시군 분뇨처리시설은 용량 대비 얼마나 처리하고, 방류수질은 어느 수계로 얼마나 나가는가"를 확인하는 데 쓴다. 공통 조인 키는 없어 시군명·시설명·연계처리장명(하수처리장 이름)이나 방류수역 수계·중권역·소권역 이름으로 하수처리장 현황이나 수질 자료와 이름 매칭해 잇는다.
description_portal: '- 전라남도 내 23개소 분뇨처리 시설 현황에 대한 정보를 조회하실 수 있습니다.- 시설명, 소재지, 전화번호, 준공일, 가동개시일, 사업비, 시설용량, 처리량, 가동일수, 처리공법, 연계처리장, 연계처리량, 유입수질, 방류수질, 방류수역, 운영주체, 직원총수 등에 대한 데이터를 제공합니다.- 전라남도에서 분뇨처리시설은 주로 하수처리장과 오수처리시설로 구분되며, 각 시군의 환경부서 또는 상하수도사업소에서 관리하고 있습니다. 이러한 시설들은 환경 보호와 주민 건강을 위해 필수적인 역할을 수행하고 있습니다.'
