description_portal: 본 데이터는 서울특별시 성북구 관내 빈집의 현황을 체계적으로 파악하기 위해 구축된 공공주택 관리 데이터로서, 2020년 3월 31일 기준 빈집의 분포, 유형, 건축년도 등의 정보를 담고 있습니다. 데이터는 빈집의 위치(동 단위), 주택유형(단독, 다세대, 아파트 등), 건축년도, 관리 기준일자로 구성되어 있어 각 빈집이 어떤 유형의 주거형태에 해당하는지, 노후 정도가 어느 수준인지 등을 분석할 수 있습니다. 특히 단독·다세대 등 저층주거지에 집중된 주택의 빈집 여부는 도시재생사업 대상지 선정, 취약지역 맞춤형 안전관리, 지역 내 방치시설 해소 정책 수립의 중요한 기초자료로 활용될 수 있습니다.
