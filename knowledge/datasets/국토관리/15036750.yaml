summary_user: 안산시 관내 하천(안산천·반월천·건건천 등)의 점용 허가를 건별로 담은 파일로, 허가마다 유형, 하천명, 물건소재지 주소, 점용면적(㎡), 점용 시작·종료일을 기록한다. 하천 인근 토지를 개발하려는 사업자나 담당 공무원이 '이 하천 구간에 이미 점용 허가가 나 있고 기간이 언제까지인가'를 확인하는 데 쓴다. 전역 조인 키나 하천코드는 없어서 하천명이나 물건소재지 주소를 매핑해 하천 목록·하천구역 자료와 이어 쓴다.
limits: 하천코드 같은 공통 키가 없어 다른 하천 데이터와는 하천명·주소 문자열 매칭으로만 연결된다. 범위는 안산시 한 곳의 허가 현황이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
