summary_user: 수원시 골목상권 상인연합회·전통시장연합회에 가입한 소상공인 업소를 한 업소당 한 행으로 담은 파일로, 업소명·업태·품명·도로명/지번 주소·위경도와 상인회 구분을 담는다. 시청 담당자나 상권 분석가가 '어느 골목상권에 어떤 업종이 모여 있고 상인회 회원 규모는 어느 정도인가'를 파악해 지원금·컨설팅 대상을 정할 때 쓰고, 창업자나 소비자는 동네 상인회 가입 업체를 찾는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없으므로 다른 데이터와는 주소 문자열이나 위경도 좌표로 공간 매칭해 이어 쓴다.
description_portal: 경기도 수원시의 상인연합회 및 전통시장연합회 소상공인 사업자등록증 회원 정보로 업소명, 업태, 품명, 소재지주소(도로명, 지번), 위경도값을 포함합니다. 골목상권별로 어떤 업종이 모여 있고, 상인회 규모가 어떤지 파악해 지원금, 컨설팅 등 정책을 설계하는데 활용할 수 있습니다. 또한 외부 상인, 청년 창업자 등이 쉽게 접근해 협업이 가능하고, 상인회 가입 업체를 공개하면 소비자에게 신뢰도 향상에 도움이 됩니다. 시민의 방문을 유도 할 수 있고, 소비자가 우리 동네 상권에 대한 이해가 높아져 지역 소비의 촉진에도 도움이 될 것입니다.
