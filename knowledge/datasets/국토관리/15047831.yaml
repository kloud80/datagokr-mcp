description_portal: 용도지역정보는 도시ㆍ군 관리계획으로 결정된 용도지역ㆍ지구ㆍ구역 별 고시 및 조서정보로서토지를 경제적이고 효율적으로 이용하기 위해 도시·군관리계획으로 결정하는 정보입니다.토지 이용 및 건축물의 용도, 건폐율, 용적률, 높이 등을 제한하여 공공복리의 증진을 도모하여,땅의 성격을 미리 정해놓고 그에 맞게 이용하는 정보로 각 항목별로 도형(SHP) 및 텍스트(CSV) 파일로 제공됩니다.국토의 계획 및 이용에 관한 법률 제6조는 국토를 토지의 이용실태 및 특성, 장래의 토지이용방향등을 고려하여도시지역, 관리지역, 농림지역, 자연환경보전지역 등 4가지로 구분되며, 도시지역은 다시 주거지역, 상업지역, 공업지역, 녹지지역으로 분류됩니다.용도지역과 용도지구가 토지의 효율적인 이용이 목적인 반면, 용도구역은 토지의 이용제한에 목적을 두고 있습니다.
