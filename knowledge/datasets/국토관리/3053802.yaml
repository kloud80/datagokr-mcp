description_portal: '서울특별시 한옥비용(천원단위) 지원 내역 정보입니다. 한옥등록번호, 지원결정자문 융자금, 지원결정자문 융자금 지급일자, 공사완료전지원 보조금1차, 공사완료전지원 보조금1차 지급일자, 공사완료전지원 보조금2차, 공사완료전지원 보조금2차 지급일자, 공사완료후지원 보조금, 공사완료정보를 제공합니다. *한옥등록번호 : 서울시나 일부 지자체에서 한옥을 체계적으로 관리·보존하기 위해 부여하는 고유 식별번호입니다.제공부서는 서울특별시 건축기획관 한옥건축자산과(02-2133-5576) 입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
