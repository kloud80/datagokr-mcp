summary_user: 경상남도 창원시의 2015년 기준 개별주택가격을 시군구·읍면동·리·지번(본번·부번, 토지구분) 단위로 한 줄씩 담은 필지·건물 단위 원천 파일이며, 활용신청 없이 약 4MB CSV로 받는다. 창원시 단독주택 소유자나 분석가가 특정 지번 주택의 공시가격이 얼마였는지, 읍면동별 가격 분포가 어떤지 확인하는 데 쓴다. 실측 컬럼에 PNU 같은 전역 조인 키가 없어, 다른 데이터와는 시군구·읍면동·리 이름과 토지구분·본번·부번을 조합해 지번을 맞추는 방식으로만 연결한다.
description_portal: 경상남도 창원시 2015년 기준 개별주택가격 정보에 대한 자료입니다.  읍면동 별 지번별 주택 가경을 공시하는 자료입니다. 개별주택가격 데이터는 특정 시점 기준으로 개별 주택의 지번, 주택 유형, 면적, 주변 시세 등 가격 요소를 기반으로 산정된 개별 주택단위 가격정보를 정리한 자료입니다. 이 데이터는 주택가치 평가, 부동산 정책 수립, 조세 기반 설정, 주택 가격 변동 분석, 주택 시장 균형 및 접근성 평가, 민원 대응 등에 활용할 수 있으며, GIS 기반 시각화를 통해 지역 간 가격 격차나 분포 패턴을 효과적으로 탐색하는 데 유용합니다.
