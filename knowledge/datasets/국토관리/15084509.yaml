summary_user: 인천광역시 서구 관내 지식산업센터를 센터 한 곳당 한 행으로 담은 파일(csv 약 5KB)로, 센터명·공장부지면적·제조시설과 부대시설 면적·층수·호실수·설립승인일·공장등록일·준공일·도로명과 지번 주소를 담는다. 사업자나 정책 분석가가 "서구에서 최근 준공된 지식산업센터는 어디이고 규모와 호실수는 얼마인가"를 확인하거나 지역 내 지식산업센터 분포를 조사할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 센터명이나 주소를 기준으로 매칭해 이어 쓰며, 건축물대장 등과 연결하려면 주소를 통한 별도 매핑이 필요하다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 지식산업센터에 대한 상세 정보를 포함하고 있습니다. 본 자료는 인천광역시 서구 지신산업센터의 신터명, 공장부지, 면적, 제조시설 및 부대시설 면적, 건축물 층수 및 동수, 호실 구성, 설립 승인일, 공장 등록일, 준공일, 도로명 및 지번 주소 등 다양한 항목으로 구성되어 있습니다. 해당 데이터는 산업 기반 공간자원 분포 조사, 지식산업센터 활성화 방안 수립 등 다양한 행정 및 정책 분석의 자료로 활용될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
