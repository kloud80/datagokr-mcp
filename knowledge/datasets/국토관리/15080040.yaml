summary_user: 대구광역시 군위군의 일반건축물 시가표준액을 법정동·리, 본번·부번, 동·호 단위의 건물별로 담은 파일로, 과세년도·물건지 주소·연면적·결정일자가 함께 들어 있다. 납세자나 분석가가 군위군 내 특정 건물의 재산세·취득세 과세 기준이 되는 시가표준액이 얼마인지, 면적 대비 가액이 지역별로 어떻게 다른지 확인하는 데 쓴다. 전역 조인 키는 없어 자치단체코드와 법정동·리·본번·부번 같은 지번 정보를 이름·코드로 맞춰 건축물대장이나 공시지가 등 다른 국토 정보와 연결해야 한다.
description_portal: 대구광역시 군위군의 일반건축물시가표준액에 대한 데이터로 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지주소, 시가표준액, 연면적, 기준일자 항목을 제공합니다. 지방세 과세 및 부동산 평가의 기초자료로, 각 건축물의 자산 가치를 객관적으로 산정하기 위해 사용됩니다. 이 데이터는 재산세, 취득세, 양도소득세 등의 세금 부과 기준이 되며, 건물 감정평가, 도시계획, 통계 등 다양한 분야에서 활용됩니다. 물건지 주소는 건축물 개별 식별 및 위치 기반 분석, 시군구별 통계 및 지역별 세수 분석, 인근 시가표준액 또는 지도 시각화(GIS)에 활용되며, 시가표준액은 재산세·취득세·양도세 등의 과세표준 산정, 공공기관·감정평가사 등에서의 건물가치 추정, 건축물 리모델링 타당성 분석 등에 활용되며, 연면적은 시가표준액과 곱해져 총 건물가액을 산정하는 데에, 면적대비 시가표준액 비교 및 건물 유형별 통계 분석과 건축허가, 도시계획, 공간 효율성 분석 등과 연계하는 데에 활용됩니다.
