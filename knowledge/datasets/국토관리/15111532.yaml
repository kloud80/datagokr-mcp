summary_user: 순천시 안의 상가업소를 한 곳씩 담은 건별 데이터로, 상호명·지점명, 상권업종 대·중·소분류, 표준산업분류, 지번·도로명 주소, 층 정보, 경도·위도를 함께 싣는다. 창업 준비자나 지역 분석가가 "순천시 어느 동, 어느 산업단지 주변에 어떤 업종 점포가 몰려 있나"를 확인하는 데 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 통계·행정자료와 잇고, 경도·위도로 산업단지 경계 도면 같은 공간자료와 겹쳐 본다.
limits: 순천시 한 시군구만 다룬다. 제목에 산업단지가 들어가 있지만 필드에는 산업단지코드나 단지 경계가 없어, 산업단지 원장과 바로 조인되지 않는다. 산업단지 소속 여부는 좌표나 주소로 따로 판별해야 한다.
