summary_user: 부산광역시 동래구 관내 공동주택을 단지 하나당 한 행으로 담은 목록 파일로, 단지명·도로명 소재지·층수·동수·세대수·연면적·준공일자·철거일을 담는다(포털 설명 기준 389개 단지). 동래구에서 특정 아파트 단지의 준공 연도나 세대 규모를 확인하거나, 노후 공동주택이 얼마나 되는지 따져 보려는 주민·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 단지명·도로명 주소를 맞추거나 같은 기관(구군명) 기준으로만 이어 쓴다.
description_portal: 부산광역시 동래구 관내 공동주택 현황에 대한 데이터로 389개에 대한 소재지, 층수, 동수, 세대수, 연면적, 준공일자, 철거일 등의 항목을 제공합니다.데이터 항목 설명1. 공동주택주소(도로명 주소)2.공동주택층수3.공동주택동수4.공동주택세대수5.공동주택연면적6.공동주택준공일자7.공동주택철거일본 파일 데이터는 부산광역시 동래구 관내 소재 공동주택 현황으로 새로 준공승인을 받은 공동주택이 추가되거나 철거가 되는 등의 사정에 따라 데이터 항목이 변경되거나 삭제될 수 있으니,이에 유의해 주시기 바랍니다.사정 상 직접 확인이 어려우신 경우 또는 자세한 내역을 알고 싶으신 경우에는 부산광역시 동래구 건축과 공동주택관리계 담당자(☎ 051 550 4521)에게 직접 문의 전화를 주시면 친절히 안내해 드리겠습니다.대단히 감사합니다.
