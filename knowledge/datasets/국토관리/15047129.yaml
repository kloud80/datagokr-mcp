description_portal: '○ 통계개요* 통계명 : 주거 실태현황(주택유형, 점유형태 등)* 통계종류 : 조사통계* 작성목적 : 국민의 주거생활에 관한 전반적인 사항을 가구설문조사를 통하여 파악하고, 조사결과를 토대로정부가 국민의 특성을 고려한 주택정책을 수립할 수 있도록 지원하는 데 목적이 있음* 조사체계 : 일반가구→조사전문기관→연구기관→국토교통부* 공표주기 : 매년(2017년 이후), 2년(2016년 이전)* 공표범위 : 지역 - 서울시, 전국내용 - 주택유형별, 점유형태별 일반가구 비율○ 용어설명* 가구 : 1인 또는 2인 이상이 모여서 취사, 취침 등 생계를 같이 하는 생활단위* 가구주 : 가족관계등록부나 주민등록상의 가족관계 또는 세대주와 관계없이 그 가구를실질적으로 대표하는 사람(가구의 중대사를 결정하는 사람 또는 생계를 책임지는 사람)* 거처 : 사람이 살고 있는 모든 장소를 지칭하며, 구조적으로 분리되고 독립된하나의 거주단위* 주택 : 가구가 독립적으로 살림을 할 수 있도록 지어진 집영구 또는 준영구 건물로 부엌과 한 개 이상의 방을 갖추었으며, 다른 가구의주거부분을 통하지 않는 독립된 출입구를 갖춘 집을 말함○ 기 타* 주거실태조사는 표본조사로 조사대상가구의 주거상황을 파악하는데 중점을 준 조사로,가구의 인구/사회/경제적 특성 등에 대한 조사 결과는 인구주택총조사, 가계동향조사등 유사조사를 통해 이미 알려진 값들과 차이를 보일 수 있음'
