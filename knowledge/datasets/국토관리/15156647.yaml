description_portal: '광명시 창업지원센터는 창업을 희망하는 (예비)창업가들의 아이디어와 사업 아이템을 발굴하여 1년간의 비즈니스 인큐베이팅을 통해,창업자가 성공적인 사업모델을 만들어 안정적으로 시장에 진입할 수 있도록 다각도로 지원하는 창업 지원 시설입니다.일반 시민들이 이용할 수 있는 광명시 창업지원센터의 2층 코워킹공간 (회의실, 미팅룸, 셀프 스튜디오) 및 카페 등에 대한 공간현황 자료입니다-Partner office (2F 회의실) : 최소 4명부터 최대 8명까지 수용 가능한 회의실, 전자칠판 구비-Conference room (2F 회의실): 최소 4명부터 최대 10명까지 수용 가능한 회의실스크린, 빔 프로젝터, 앰프, 무선 마이크 구비-Self studio (2F 셀프 스튜디오) : 셀프스튜디오-Meeting room A ,B(2F 미팅룸): 최대 4명까지 수용 가능한 회의실 전자칠판 구비-START-UP CAFE 꿈을 담다 (2F 카페)'
