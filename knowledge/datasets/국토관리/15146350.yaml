summary_user: 서울시 생활체육포털(우리동네 프로그램)에 올라온 체육 프로그램을 건별로 담으며, 프로그램 고유 ID(BD_IDX)·자치구명·프로그램명·활동 내용·대상 연령·세부 종목·운영 요일과 시간·운영 기관·정원·주소·연락처를 포함한다. 학부모나 어린이집·유치원 담당자가 '우리 구에서 평일 오전에 아이가 참여할 수 있는 유아체육 프로그램이 어디서 열리나'를 찾거나, 분석가가 자치구별 유아체육 프로그램 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구명(AR_CD_NAME)이나 운영 기관명·주소 같은 이름 매핑으로만 연결한다.
description_portal: 해당 데이터는 생활체육포털 우리동네 프로그램 데이터입니다. 데이터의 원본 시스템은 생활체육포털 우리동네 프로그램(https://sports.seoul.go.kr)입니다. 각 항목은 프로그램 고유 ID, 행정구명, 프로그램명, 활동 내용, 대상 연령, 세부 종목, 운영 요일·시간, 운영 기관명, 정원, 주관기관, 주소, 연락처 등의 상세 정보를 포함합니다. 프로그램은 주로 유아체육을 중심으로 어린이집·유치원 등 교육기관에서 운영되며, 자치구별로 다양한 요일과 시간대에 진행됩니다. 이를 통해 서울시 전역의 유아체육 프로그램 현황을 파악하고 지역별 참여 계획을 세우는 데 활용할 수 있습니다.
