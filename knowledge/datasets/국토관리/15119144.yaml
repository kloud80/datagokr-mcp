summary_user: 진안군 도시계획정보시스템(UPIS)의 건축물 주제도를 건물·필지 단위로 담은 파일로, 건물별 공간정보관리번호, 외곽 범위 좌표(X·Y 최소·최대값), 용적률, 건물군관리번호, 필지고유번호를 담는다(포털 설명상 기준일 2023-08-18, CSV 약 898KB). 도시계획 담당자나 개발·부동산 분석가가 '진안군 특정 필지 위 건물의 용적률이 얼마이고 대략 어디에 있는가'를 확인하는 데 쓴다. 필지고유번호(PNU) 컬럼은 있지만 실측 점검에서는 전역 조인 키로 확인되지 않아, 다른 데이터와는 이름·코드 매핑이나 같은 기관(진안군) 자료끼리 맞춰 이어 써야 한다.
description_portal: '전북 특별자치도 진안군 도시계획 정보시스템(UPIS) 건축물 주제도 면적에 대한 공공데이터 자료입니다. 이번 자료에서는 공간정보 관리 번호, X 좌표 최솟값, Y 좌표 최솟값, X 좌표 최댓값, Y 좌표 최댓값, 용적률(의미: 전체 대지면적에 대한 건물 연면적의 비율), 건물 군 관리 번호, 필지 고유번호(PNU 의미: 토지에 부여되는 고유한 19자) 정보를 제공합니다. 이 자료를 통해 공간정보 관리 번호에 해당하는 필지 고유번호가 무엇인지 알 수 있으며, 해당 건물의 용적률 또한 확인할 수 있습니다. 그리고 이 자료는 메타데이터 중장기 개방을 위한 자료입니다. 또 이 자료의 데이터 기준일자는 2023년 8월 18일입니다.'
