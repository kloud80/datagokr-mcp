summary_user: 경기도 광주시 도시계획정보시스템에 등록된 개발제한구역(그린벨트) 현황을 구역 도형 단위로 담은 시군구 범위 파일로, 관리번호·명칭·면적·경계 길이·등록 일시를 포함하며 파일 크기는 279바이트로 매우 작다. 광주시에서 토지를 사거나 개발·건축을 검토하는 사업자나 분석가가 '광주시 개발제한구역이 얼마나 넓고 어떤 구역으로 나뉘어 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군구코드·시군구명으로 같은 지역의 다른 도시계획·토지이용규제 데이터와 이어 쓰고, 구역 단위 결합은 명칭 매칭에 의존해야 한다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 개발제한구역 현황 정보를 제공합니다. 도시의 무질서한 확산을 방지하고 자연환경을 보전하기 위해 지정된 개발제한구역(그린벨트)의 위치와 범위 정보를 담고 있습니다. 현황도형 관리번호는 각 구역을 고유하게 식별하며, 라벨명은 개발제한구역의 명칭을 나타냅니다. 면적은 구역이 차지하는 면적을 제공하고, 길이는 경계선의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 개발 행위 허가 심사, 건축 인허가 관리, 환경 보전 정책, 토지 이용 규제, 도시 성장 관리 등에 활용됩니다.
