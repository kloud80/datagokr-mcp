summary_user: 행정안전 통계연보 '재난관리' 분야 중 지역별 소하천 정비 현황을 담은 집계 통계로, 시도 등 지역 단위로 정비대상·총연장·기정비·미정비 연장과 정비율을 제공하며 범위는 전국입니다. 지자체 방재 담당자나 분석가가 "우리 지역 소하천 정비율이 다른 지역보다 낮은가, 미정비 구간은 얼마나 남았나"를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 하천·재난 데이터와는 지역명을 맞춰 이어 붙여야 한다.
limits: 하천코드나 행정구역 코드 같은 공통 키가 없어 다른 데이터와는 지역명 매핑으로만 연결된다. 비공간 집계 통계여서 개별 소하천의 위치나 구간 단위 정비 내역은 담지 않는다.
