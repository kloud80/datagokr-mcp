description_portal: '성남시 관내 하천의 구조, 관리상태, 정비수준 등을 파악할 수 있는 현황 데이터 입니다. 하천별로 하천명, 구간 시점과 종점, 유역 면적, 제방 총연장, 제방 개수 등의 항목으로 구성되어 있습니다. 하천의 길이와 제방 개수율을 통해 하천 정비 상태를 확인 할 수 있습니다. 해당 자료는 하천 정비 계획 수립, 홍수 예방, 생태하천 조성 등 다양한 정책의 기초자료로 활용됩니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.* 주요 항목 설명- 하천명: 탄천, 동막천, 분당천, 운중천, 금토천, 야탑천, 여수천, 상적천 등 8개- 구간 시점 및 종점: 각 하천의 시작과 끝 지점 정보- 유역 면적: 하천이 영향을 미치는 지역의 넓이- 제방 총연장: 제방이 설치된 총길이- 개수율: 정비된 구간의 비율'
