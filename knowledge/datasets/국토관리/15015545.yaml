summary_user: 충청북도 내에서 가동 중인 공공하수처리시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 하루 처리용량 500톤 이상과 500톤 미만(소규모) 시설을 함께 다루며 소재지·시설용량·유입하수량·방류량·유입/방류 수질(BOD·TOC·SS·T-N·T-P·대장균군)·처리방법·준공일 등을 포함한다. 분석가나 지자체 담당자가 '우리 시군의 하수처리장은 용량 대비 얼마나 유입되고, 방류수 총인·총질소는 어느 수준인가' 같은 질문에 쓴다. 전역 조인 키는 없어서 시군구명(구군)·시설명·소재지 주소 같은 이름 매핑으로만 다른 데이터와 잇고, 수계·지류·세부단위구역 필드로 하천 수질 데이터와 수계 단위로 맞춰 볼 수 있다.
description_portal: 공공하수처리시설은 일상생활에서 발생한 하수를 최종적으로 안전하게 처리하여 방류함으로써 공공수역의 수질을 보전하여안전한 상수원확보와 도시환경개선 및 주민보건위생 향상을 도모하는데 있으며 수질보전을 위한 중요한 수단중에 하나입니다.다음은 충청북도  내  전지역에 가동 중인 공공하수처리시설 현황입니다.하루처리용량 500톤/일 이상 및 500톤/일 미만(소규모하수처리시설)에 대한 현황으로서지역, 시설명, 소재지, 용량, 처리량, 처리방법, 전화번호, 준공일, 가동개시일 등 데이터를 제공합니다
