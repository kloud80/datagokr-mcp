summary_user: 천안시 도시계획정보시스템(UPIS)에서 관리하는 도시자연공원구역 현황을 도형 단위로 담은 파일로, 도형 관리번호·라벨명·면적·길이를 제공하며 원본 csv가 314바이트에 불과해 담긴 건수는 매우 적다. 천안시 안에서 도시자연공원구역이 어떤 이름으로 몇 곳, 어느 정도 면적으로 지정돼 있는지 확인하려는 주민·도시계획 분석가가 쓴다. 다른 데이터와 이을 전역 조인 키는 없으므로 라벨명(구역 이름)으로 맞추거나 같은 천안시 UPIS 현황 테이블과 기관 기준으로 함께 본다.
