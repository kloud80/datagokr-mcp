summary_user: 한국수자원공사가 공급하는 수돗물의 급수과정 지점별 법정 수질검사 결과를 분기 단위로 담은 건별 파일 데이터이며, 검사년도·분기, 수도사업자, 시설명·지점명, 채수일자와 일반세균·총대장균군·탁도·잔류염소·총트리할로메탄 등 항목별 측정값을 담는다(전국 범위, csv 약 1.6MB). 주민이나 분석가가 '우리 지역 정수장에서 공급된 수돗물이 급수 지점에서 잔류염소·탁도 기준을 지켰는가'를 분기별로 확인하는 데 쓴다. 전역 조인 키가 없어 다른 상수도 데이터와는 시설명·지점명 같은 이름 매핑이나 같은 기관의 시설물번호로만 이어 쓴다.
description_portal: '본 데이터는 분기별 먹는물 수질검사 결과입니다. 이를 통해 계곡수 기반 급수시설의 수질과 안전성을 확인할 수 있습니다. 이를 통해 수질 분석, 정책 연구, 스마트 물관리 기술 개발 등 여러 분야에 활용할 수 있습니다.제공항목 : 년도,검사분기,지역,공급정수장,검사지점,수질검사기관,일반세균,총대장균군,암모니아성질소,총트리할로메탄,동,수소이온농도,아연,철,탁도,잔류염소,대장균_분원성대장균군 등* 상세자료조회는 아래 URL을 참고 해주시기 바랍니다.https://www.waternow.go.kr/web/tapWaterData'
