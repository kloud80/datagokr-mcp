summary_user: 서울특별시 도시지역 용도지역 경계를 도형 단위로 담은 공간정보 파일로, 도형마다 관리번호, 도형 분류코드, 결정고시 관리코드, 명칭(LBL_NM), 시군구코드, 면적·길이를 기록하며 범위는 서울시 한 곳이다. 부동산 사업자나 도시계획 분석가가 특정 땅이 국토계획법상 어느 용도지역에 들어가는지, 자치구별로 용도지역 면적이 얼마인지 알아보는 데 쓴다. 실측 컬럼에는 전국 공통 조인 키가 없어서, 다른 데이터와는 시군구코드(SGG_CD)나 명칭 매핑, 또는 좌표를 이용한 공간 중첩으로 잇는다.
description_portal: '인구와 산업이 밀집되어 있거나 밀집이 예상되어 그 지역에 대하여 체계적인 개발·정비·관리·보전 등이 필요한 지역으로서 「국토의 계획 및 이용에 관한 법률」에 의한 용도지역의 대분류 중 하나이다.[좌표계] ESPG:5174 (Bessel 1841타원체의 TM 직각좌표계)[인코딩] windows-949※ 본 자료는 법적 효력이 없으며 참고자료로만 활용 가능합니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2847)을 경유하여 서울 열린데이터 광장에 제공됩니다.문의 : 도시계획과(02-2133-8339)'
