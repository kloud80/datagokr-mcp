summary_user: 인천 서구 일반건축물의 시가표준액을 과세연도별로 담은 파일 데이터로, 건물 위치(법정동·본번·부번)와 동·호, 연면적, 시가표준액, 기준일자가 건물 단위로 들어 있다. 지방세 담당자나 부동산 분석가가 "서구의 이 건물은 올해 과세 기준 시가표준액이 얼마이고 연면적 대비 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 건축물대장이나 공시지가 같은 다른 자료와는 자치단체코드와 법정동·본번·부번 주소를 이름 매핑하는 식으로 맞춰 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 일반건축물의 과세연도별 시가표준액 정보를 제공하고 있는 데이터입니다. 본 데이터는 건물의 위치(법정동, 본번,부번), 동,호 정보, 연면적, 시가표준액, 기준일자 등으로 구성되어 있습니다. 본 데이터를 통해 세금 부과 및 행정업무 활용을 위한 기초자료로 활용될 수 있을것으로 판단됩니다. 본 데이터는 위치정보와 함께 시가산정의 주요항목이 포함되어 있어 지역별 건축물 가치 파악 및 관련 정책 수립에 참고 가능할것으로 판단됩니다. 본 데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
