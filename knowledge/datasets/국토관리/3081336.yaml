summary_user: 전북특별자치도 시군별 농촌공동체회사 한 곳당 한 행으로, 2011~2017년 연도별 지원 상태(신규·계속)와 주요 사업 내용을 담은 작은 CSV 파일(약 2KB)이다. 전북 지역 마을기업·사회적경제 조직이 어느 시군에서 언제 시작해 몇 년간 이어졌는지, 어떤 농촌자원 활용 사업(6차 산업)을 하는지 살피는 연구자·정책 담당자가 쓴다. 전역 조인 키나 행정코드는 없어서 다른 데이터와는 시군 이름이나 공동체명으로 맞춰 이어야 한다.
description_portal: 이 데이터는 전북특별자치도 내 시군별 '농촌공동체 회사'의 운영 현황을 보여주는 자료입니다. 2011년부터 2017년까지의 기간 동안 각 공동체 회사의 연도별 활동 상태(신규/계속)를 추적하고, 주요 사업 내용을 명시하고 있습니다. 친환경 쌀, 전통 장류, 복분자주, 누룽지 피자와 같이 농촌 자원을 활용한 다양한 제품과 서비스를 통해 부가가치를 창출하는 6차 산업의 실제 사례들을 확인할 수 있습니다. 이 자료는 지역 기반의 사회적 경제 조직 및 마을 기업의 성장 과정을 파악하고, 농촌 활성화 정책을 연구하는 데 유용한 데이터입니다.
