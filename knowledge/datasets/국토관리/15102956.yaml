summary_user: 남양주시 일반건축물의 물건지(소재지 주소)별 시가표준액과 연면적(제곱미터)을 납부년도·결정일자와 함께 담은 건별 원천 파일로, 범위는 남양주시 한 시군구다. 지방세 과세나 자산 평가를 앞둔 소유자·분석가가 특정 건물의 과세 기준 가액이 연도별로 얼마였는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 물건지 주소 문자열이나 시도명·시군구명 이름 매칭으로만 잇는다.
description_portal: 남양주시의 과세년도별 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지에 따른 시가표준액, 연면적 데이터입니다. 일반건축물에 대한 법정동, 법정리, 특수지, 본번, 부번, 동, 호, 물건지, 연면적, 시가표준액 등의 정보는 건축물 및 부동산 관련 행정 업무나 등기, 세금 부과, 자산 평가 등에 사용되는 데이터입니다. 법정동과 법정리는 행정구역을 구분하는 기본 단위로, 건축물이 위치한 지역을 명확히 식별할 수 있게 해 줍니다. 특수지는 토지 이용 목적이나 지형적 특성을 반영하는 항목이며, 본번과 부번, 동, 호는 건축물 내 세부 위치를 나타내는 상세 주소 체계입니다. 물건지는 건축물이나 토지의 고유 식별 정보로, 연면적은 건축물의 총 바닥 면적을 의미합니다. 시가표준액은 과세나 평가 기준이 되는 표준 시가를 의미합니다. 이 모든 정보는 부동산 거래, 평가, 관리, 세무처리 등 다양한 분야에서 활용됩니다.
