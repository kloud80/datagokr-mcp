summary_user: 경기도 내 공공주택사업을 지구 단위로 정리한 현황 자료로, 시군명·지구명·위치·면적·세대수·수용인구·사업기간·지구지정일·계획승인일·시행자·추진현황(공사·보상 진행률)을 담는다. 주택·도시계획 분석가가 '우리 시군에 LH·GH가 추진 중인 공공주택지구는 몇 세대 규모이고 공사가 어디까지 진행됐나'를 확인하거나 인구유입·주택공급 전망을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·지구명 같은 이름 매칭으로만 연결한다.
description_portal: 본 데이터는 경기도 내 공공주택사업의 지구별 추진현황을 수록한 자료입니다. 주요 항목으로 시군명, 지구명, 면적, 세대수, 수용인구, 사업기간, 시행자, 추진현황 등이 포함되어 있으며, 각 사업지구별 면적, 예상 수용인구 및 세대수, 시행기관(LH, GH 등) 및 사업진행률이 함께 제공됩니다. 추진현황 항목에는 공사 및 보상 진행률이 명시되어 사업의 실질적 추진 상태를 확인할 수 있습니다. 본 데이터는 공공주택 수급계획 수립, 도시계획 및 인구유입 분석, 주거복지 정책 마련, 사업 타당성 평가 등에 활용될 수 있습니다.
