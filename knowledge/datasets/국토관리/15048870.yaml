summary_user: 김천시 관내 일반 지역과 산업단지에 등록된 제조업체를 업체(공장) 한 건씩 담은 파일로, 회사명·사업자등록번호·도로명 주소·위경도·업종명·생산품·연락처·소속 산업단지명을 포함한다. 김천시 어느 산업단지에 어떤 업종의 제조업체가 모여 있는지 확인하려는 지역경제 분석가나 기업유치 담당자, 협력업체를 찾는 사업자가 쓴다. 사업자등록번호(bizno)를 키로 다른 기업정보·사업자 데이터와 잇고, 위경도와 주소로 지도·입지 분석에 붙이며, 산업단지명으로 산단 현황·통계와 연결한다.
description_portal: 이 데이터는 경상북도 김천시 관내에 등록된 제조업체의 사업자 및 공장 등록정보를 체계적으로 정리한 데이터셋입니다.김천시 전역의 일반 지역과 산업단지 내 입주 기업들을 포함하며, 공장의 위치(주소 및 위경도), 업종, 생산품, 연락처 정보, 소속 산업단지 명칭 등기업 현황 파악과 정책 활용을 위한 주요 정보를 포함합니다.산업단지 분석, 업종 분포 파악, 제조업 기반 지역경제 정책 수립,산업정책 수립, 기업유치, 입지분석, 지역경제 연구 등 에 활용될 수 있으며, 기업홍보·민간비즈니스 매칭 서비스·위치기반 플랫폼 개발 등의 민간 활용도 가능합니다.
