summary_user: 서울특별시 기타용도지구(포털 설명상 고도지구 등)의 구역 경계를 도형 단위로 담은 공간정보 파일로, 도형별 분류코드·라벨명·시군구코드·면적·길이(AREA, LEN)를 포함한다. 부동산 사업자나 도시계획 분석가가 특정 필지가 고도지구 등 용도지구에 걸리는지 지도에서 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군구코드(SGG_CD)나 라벨명 같은 이름·코드 매핑, 또는 같은 기관 데이터의 코드로만 다른 데이터와 잇는다.
