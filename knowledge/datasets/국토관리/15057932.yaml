summary_user: 경기도 내 계량기 제조업체를 사업장 한 곳씩 담은 인허가·영업현황 목록으로, 사업장명·인허가일자·영업상태와 폐업일자·지번/도로명 주소·전화번호·WGS84 위경도를 포함한다. 분석가가 '경기도 어느 시군에 영업 중인 계량기 제조업체가 몰려 있고 폐업은 얼마나 되나'를 파악하거나, 품질관리·안전점검 대상 업체를 고를 때 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)나 주소·사업장명 매칭, 위경도 좌표로 공장등록 현황 등 다른 경기도 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 계량기 제조업체의 인허가 및 영업현황을 수록한 자료로, 각 사업장의 명칭, 인허가일자, 영업상태(영업중, 폐업 등), 소재지 주소(지번 및 도로명), 전화번호, 위치좌표(WGS84 위·경도) 등의 정보를 포함하고 있습니다. 계량기란 산업·상업·일상 생활 등에서 물리량을 측정하는 기기로, 정확성과 정밀성이 요구되는 분야입니다. 해당 데이터는 제조업체의 지역 분포, 업종 지속성, 주소 기반 위치정보, 공업제품 품질관리 모니터링, 산업안전점검 대상 선정, 기술산업 클러스터 분석 등에 활용할 수 있으며, 중소 제조업체 육성 정책이나 규제완화 검토에도 기초자료로 유용합니다.
