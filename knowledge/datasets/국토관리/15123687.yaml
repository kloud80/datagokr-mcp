summary_user: 경기도 내 공동주택의 공시가격을 호(세대) 단위로 담은 건별 데이터로, 토지고유번호·소재지·도로명주소·단지명·동·호와 공시연도·기준월, 전용면적, 공동주택가격을 함께 싣는다. 보유세·건강보험료·복지 기준 판단에 쓰이는 공시가격이라, 예컨대 경기도 어느 아파트 특정 동·호의 올해 공시가격이 얼마인지 확인하거나 단지별 공시가격 분포를 분석하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으나 토지고유번호(land_idntfy_no, 필지 식별)와 동·호를 묶으면 같은 필지 기준의 실거래가·건축물 정보 등과 주소·이름 매핑으로 이어 볼 수 있다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 공동주택 가격 정보로, 경기도 내 각 공동주택의 주소, 단지명, 동·호수별 공시년도 및 기준월, 전용면적, 공시가격 등 세부정보를 포함하고 있습니다. ‘토지고유번호’는 해당 주택의 위치를 고유하게 식별하며, ‘공동주택가격’은 국토교통부에서 매년 고시하는 공시가격으로 세금 부과, 복지 지원 등의 행정 기준으로 활용됩니다. ‘단지명’, ‘동명’, ‘호명’ 등의 항목은 동일 건축물 내 개별 호수 단위까지 구분된 정보를 제공하여 상세한 부동산 분석이 가능합니다. 이 데이터는 주택시장 동향 분석, 세금 정책 연구, 주거환경 개선 사업, 공공기관의 부동산 정책 수립 등에 활용될 수 있습니다.
