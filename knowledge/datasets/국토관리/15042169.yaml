summary_user: 충청남도 보령시 관내에 지정된 용도지역·지구·구역(농림지역, 가축사육제한구역, 도로, 하천, 보건위생시설 등)을 레이어이름, 지역·지구 명칭, 지정권자, 고시년도, 관리번호, 등재면적 항목으로 담은 파일 데이터로, 범위는 보령시 한 곳이다. 지자체 도시계획 담당자나 개발사업자가 '보령시에서 가축사육제한구역이나 농림지역으로 지정된 곳이 어디이고 면적이 얼마인가'처럼 규제 지정 현황과 면적 분포를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역·지구 명칭이나 관리번호를 이름 기준으로 맞추거나 같은 기관(보령시) 자료끼리만 연결한다.
limits: 필지 고유번호 같은 전역 조인 키가 없어 개별 필지의 토지이용규제 여부를 바로 대조하는 데는 쓰기 어렵고, 이름 매핑이 필요하다. 보령시 범위만 담으므로 다른 시군과의 비교는 각 지자체 자료를 따로 받아야 한다.
