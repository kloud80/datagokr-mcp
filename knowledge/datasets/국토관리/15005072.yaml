summary_user: 서울특별시 중랑구 관내 건축허가 건을 한 행씩 담은 파일로, 대지위치·건축구분·대지면적·연면적 등 면적, 구조, 허가일·착공처리일·사용승인일, 지상·지하 층수, 주용도, 세대수·호수·가구수를 시군구 범위의 필지·건물 단위로 기록한다. 중랑구에서 최근 어느 동네에 어떤 용도의 신축이 허가·착공됐는지, 공동주택 세대 공급이 얼마나 예정돼 있는지 보는 지역 개발 흐름의 선행 지표로 쓴다. 전역 조인 키가 없어 다른 데이터와는 대지위치 주소를 주소 매핑으로 이어 붙이거나 같은 기관 자료끼리만 연결한다.
limits: 건축물대장번호·PNU 같은 공통 키가 없어 건축물대장·공시지가 등과 바로 조인되지 않고 주소 정제가 필요하다. 범위는 중랑구 한 곳뿐이라 다른 자치구와 비교하려면 각 구 파일을 따로 모아야 한다. 빈칸은 미집계 항목이다.
