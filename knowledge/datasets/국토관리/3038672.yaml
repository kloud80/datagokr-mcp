summary_user: 구리시 관내 하수도의 계획연장·시설연장, 분류식·합류식 하수관로 현황, 하수도 보급률 같은 지표를 항목(구분)과 값 한 쌍씩 담은 시 단위 집계표로, 활용신청 없이 받는 1,933바이트 크기의 작은 CSV 파일이다. 시민이나 분석가가 '구리시 하수도는 얼마나 보급돼 있고 분류식 관로 비중은 어느 정도인가'를 확인하거나, 하수도정비기본계획·예산 검토의 기초 수치로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시군의 하수도 보급률 자료와는 관리기관명이나 지자체 이름으로 맞춰 이어 써야 한다.
description_portal: 경기도 구리시 관내에 설치된 하수도의 보급 및 운영 현황을 종합적으로 제공하는 데이터입니다. 주요 항목으로는 하수도 계획연장, 실제 시설연장, 분류식·합류식 하수관로 현황, 하수도 보급률 등 지역 내 하수도 기반시설의 설치 및 보급 수준을 파악할 수 있는 정보가 포함되어 있습니다. 본 데이터는 구리시 하수도 인프라의 현황 분석, 중장기 하수도정비기본계획 수립, 시설 유지관리, 예산 편성, 원인자부담금 및 각종 정책자료의 기초자료로 활용될 수 있으며, 시민과 관계기관이 지역 하수도 보급 수준을 객관적으로 확인할 수 있도록 제공됩니다.
