summary_user: 한국수자원공사가 제공하는 전국 소규모 상수도 시설의 시설별 목록으로, 시설마다 행정구역·시설명·소재지·수도규모·가동상태·준공연도·수도구분·시설용량을 담은 건별 CSV 파일(약 1.3MB)이다. 지자체 상수도 담당자나 분석가가 "우리 지역 소규모 급수시설 중 가동 중이 아니거나 오래 전에 준공된 시설은 어디인가"처럼 시설 분포·노후도·운영 상태를 점검하고 유지보수 대상을 고를 때 쓴다. 전역 조인 키(시설코드·행정구역코드 등)가 없어 다른 상수도·수질 데이터와는 행정구역명이나 시설명·소재지 주소를 이름으로 맞춰 연결해야 한다.
description_portal: 본 데이터는 한국수자원공사의 전국 상수도 시설 현황(소규모)입니다. 자료에는 행정구역, 시설명, 소재지, 수도규모, 가동상태, 준공연도, 수도구분, 시설용량 등의 내용을 제공합니다. 이를 통해 시설 분포와 운영 상태를 파악하고 유지보수 계획을 세울 수 있습니다. 본 데이터는 소규모 지역의 급수 안정성과 주민 생활 편익 증진을 위한 자료입니다. 시설 정보는 신규 사업 검토, 공급망 평가, 정책 의사결정에도 활용됩니다. 국민은 생활과 밀접한 급수 시설 현황을 확인해 공공데이터 서비스의 신뢰를 높일 수 있습니다.
