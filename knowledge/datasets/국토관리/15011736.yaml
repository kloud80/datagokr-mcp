description_portal: 경상북도개발공사의 직원 채용 내용입니다, 정규직, 공무직, 계약직, 체험형 인턴 채용 내용이 포함되어 있습니다.  채용직렬, 공고일자, 모집인원, 담당업무 등 내용이 포함되어 있습니다. 공사의 직원채용은 공개채용을 기본으로 하고 있으며 이에 정보를 위하여 공고번호를 관리하고 있다. 고용형태는 정규직 및 계약직으로 구분하여 채용하고 있으며 채용직종은 사무, 건축, 설비, 전산, 토목, 미화 등으로 구분하고 있다. 또한 채용시에 담당직무를 구체화하여 인력을 채용 중이며 이런 모든 정보를 공개하고 있습니다
