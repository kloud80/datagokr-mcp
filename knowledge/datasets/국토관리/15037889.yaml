summary_user: 부산진구 관내 가로수를 도로 구간(위치명, 구간시점·구간종점) 단위로 담은 파일로, 구간별 위도·경도, 식재거리, 왕벚나무·은행나무·느티나무·이팝나무 등 수종별 그루 수와 총합계를 담는다(약 8.7KB 규모의 csv). 구청 녹지 담당자나 주민이 '우리 동네 어느 도로에 어떤 수종이 몇 그루 심겨 있는가'를 확인하거나 병충해·수종 다양성 관리 대상을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표로 지도 위에서 겹치거나 구군명·위치명(도로명) 이름 매칭으로만 잇는다.
description_portal: 부산광역시 부산진구 가로수 현황에 대한 데이터로 부산진구 관내 가로수의 위치명,위도,경도, 구간시점, 구간종점 수종, 수량 등의 항목을 제공합니다.부산광역시 부산진구 가로수 현황에 관한 데이터로, 구 관내 주요 도로와 보행로에 조성된 가로수 정보를 체계적으로 관리하기 위해 구축된 자료입니다. 이 데이터에는 각 가로수 구간의 위치명, 지도 기반 확인이 가능하도록 제공되는 위도·경도 좌표, 그리고 가로수가 시작되는 지점을 나타내는 구간시점과 종료되는 구간종점 정보가 포함되어 있습니다. 또한 가로수의 종류를 알려주는 수종, 해당 구간에 조성된 가로수의 수량 등 식재 현황을 파악할 수 있는 세부 정보가 제공되어, 도시녹지 관리와 생태 환경 개선 정책을 수립하는 데 중요한 기초자료로 활용됩니다. 이러한 데이터는 가로수 관리·보수 계획 수립, 병충해 대응, 수종 다양성 관리 등 행정업무에 실질적인 도움을 줄 뿐 아니라, 지역 주민들이 생활환경의 녹지 수준을 이해하는 데에도 기여합니다.
