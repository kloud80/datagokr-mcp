summary_user: 전북특별자치도 시군별로 경관·미관·고도·방화·방재·보존·시설보호 등 용도지구의 세부 유형별 지정 개소와 면적을 집계한 표로, 범위는 시도이고 행 단위는 시군구이다. 도시계획 담당자나 개발 사업자가 '어느 시군에 자연경관지구나 고도지구가 얼마나 지정돼 있나'처럼 지역별 용도지구 규제 분포를 비교하는 데 쓴다. 실측 컬럼에 행정구역코드 같은 전역 조인 키가 없어, 다른 시군 단위 통계와는 시군구 이름을 매핑해서 이어야 한다.
description_portal: 전북특별자치도 내 각 시군의 용도지구 지정 현황을 상세히 집계한 데이터입니다. 이 자료는 「국토의 계획 및 이용에 관한 법률」에 따라 토지의 이용 및 건축물의 용도, 건폐율 등을 제한하는 각종 용도지구(경관지구, 미관지구, 고도지구, 방재지구 등)의 지정 개소와 총면적을 포함하고 있습니다. 이 데이터는 도시 계획가, 건축가, 부동산 개발업자 등이 특정 지역의 개발 가능 여부와 규제 사항을 파악하는 데 필수적인 정보입니다. 또한, 지역의 종합적인 토지 이용 계획을 수립하고 관리하는 지방자치단체의 정책 결정 과정에서도 핵심적인 기초 자료로 활용됩니다.
