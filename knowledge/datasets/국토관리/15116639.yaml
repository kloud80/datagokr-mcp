description_portal: '한국부동산원(구.한국감정원)에서 제공하는 상업용부동산 임대동향조사 중 중대형상가의 분기별 지역별 임대가격지수 시계열 데이터입니다.<상업용부동산 임대동향조사 개요>ㅇ 국가통계 승인번호 : 제408001호ㅇ 법적근거 : 부동산 가격공시에 관한 법률 제15조 및 동법 시행령 제25조ㅇ 조사목적 : 전국의 상업용부동산(오피스, 상가)의 자산가치 산정 및 임대정보 조사를 통해 상업용부동산 투자성과 측정 및 시장동향 파악하여 시장정보를 제공하고,표준지 공시지가 조사·평가 시 수익방식 평가 방법에 활용하며, 건전한 부동산 거래질서 확립에 기여할 수 있도록 부동산 정책 수립의 참고자료로 활용ㅇ 조사주기 : 분기ㅇ 조사지역 : 전국ㅇ 조사방법 : 표본조사, 현장조사ㅇ 공표주기 : 계간(분기)ㅇ 공표시기 : 분기 익월 마지막 목요일(휴일인 경우 그 다음날)※ 이용시 유의점 : 임대동향조사 통계의 신뢰성을 검토하기 위한 지표로 상대표준오차(RSE) 및 표준오차 등을 제시하고 있습니다. 이를 이용하면 신뢰구간 등을 이용자들이 작성 가능합니다.   - 95% 신뢰구간은 추정값±1.96×(RSE X 추정값/100), 추정값±1.96×표준오차   * RSE(상대표준오차, %) : 표준오차 / 추정값 X 100   * 표준오차 : 추정량의 분산에 대한 제곱근을 말하며, 표본추출오차를 나타내는 척도'
