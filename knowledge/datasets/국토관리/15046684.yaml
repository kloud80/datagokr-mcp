description_portal: '○ 통계개요* 통계명 : 상수도관* 통계종류 : 서울시 상수도관 설치 현황을 제공하는 일반ㆍ보고통계* 근거법령 : 서울시「수도조례」에 의한 상수도관을 통한 수돗물 공급량* 작성목적 : 서울시 상수도 보급현황, 시설물현황, 요금ㆍ재정 등에 대한 현황을 조사ㆍ분석하여 시설의 적정 설치 및 관리를 위한 정책수립의 기초자료를제공하는 것을 목적으로 함* 조사체계 : 수도사업소 → 상수도사업본부* 공표주기 : 정기(매년)* 공표범위 : 지역- 서울시 및 자치구내용 - 서울시 상수도관의 용도별(정수 및 급수절차)ㆍ소재별 설치현황 등○ 용어설명* 도수관 : 한강물을 유입시키기위한 관* 송수관 : 도수관에서 정수장과 배수지까지 연결하는 관* 배수관 : 배수지에서 구역별 저장소까지 연결하는 관* 급수관 : 구역별 저장소에서 최종 급수지까지 연결하는 관○ 기 타* 합성수지관에 PVC, PE, Hi-3P 포함* 주철관에 닥타일관이 포함'
