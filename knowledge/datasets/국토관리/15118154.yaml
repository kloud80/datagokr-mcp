description_portal: '행정동별 면적과 전체 면적 대비 구성비를 정리한 공간 기반 행정자료.각 행정동의 상대적인 면적 규모와 구역 비중을 파악할 수 있으며, 도시계획 수립, 인프라 배분, 통계 인구 기준 설정 등 공간기반 행정 업무의 기초자료로 활용됨.활용 목적 및 특징– 행정동별 면적 정보 제공으로 도시공간 구조 파악 가능– 구성비를 통해 지역 간 면적 편차 및 균형 발전 지표 확보– 생활권 계획, 시설 배치, 자원 분포 분석 등 정책 기반자료로 활용– 공간통계 연계 행정지도 작성 및 인구밀도 분석의 기준 자료 제공주요 항목 설명● 연번: 각 행정동 항목에 부여된 고유 식별번호● 행정동: 부평구 내 법정 또는 행정동 명칭● 면적(㎢): 해당 행정동의 총 면적 (단위: 제곱킬로미터)● 구성비(%): 전체 면적 중 해당 행정동이 차지하는 비율 (단위: 퍼센트)'
