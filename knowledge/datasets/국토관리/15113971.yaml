summary_user: 제주특별자치도 안의 공공하수처리장을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 849바이트)로, 시설명·소재지 주소·위도·경도와 데이터기준일자를 담는다. 주민이나 분석가가 '우리 동네 하수는 어느 처리장으로 가며 그 처리장은 어디에 있나'를 확인하거나 제주 하수처리시설 위치를 지도에 올릴 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓰며, 방류수 수질(TMS)이나 처리구역 자료와 연결하려면 시설명을 직접 맞춰야 한다.
description_portal: '제주특별자치도 내에 위치하고 있는 하수처리장에 대한 데이터를 제공합니다.항목: 시설명, 소재지, 위도, 경도 등*「하수도법」에 의거하여 관리함- 공공하수처리시설: 이라 함은 하수를 처리하여 하천ㆍ바다 그 밖의 공유수면에 방류하기 위하여 지방자치단체가 설치 또는 관리하는 처리시설과 이를 보완하는 시설- 제주시에 3개소, 서귀포시에 5개소가 운영중자세한 사항은 제주특별자치도 상하수도본부 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jejuwater/sewer/status.htm'
