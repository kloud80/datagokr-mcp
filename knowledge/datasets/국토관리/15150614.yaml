summary_user: 환경부가 제공하는 홍수통제소 관측소별 10분 단위 하천 유량 값을 관측소 코드, 관측 일시, 유량 값 단위로 담는 관측 원천 데이터로, 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 제공된다. 장마·태풍철에 방재 담당자나 분석가가 '이 관측소의 유량이 최근 몇 시간 동안 얼마나 빠르게 늘었나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 유량관측소 코드(FLX_OBSVTR_CD)를 같은 기관의 관측소 제원 정보와 맞추거나 관측소 이름으로 매핑해야 수위·강수량 등 다른 수문 자료와 이을 수 있다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 이에 따라 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 환경부에서 제공하는 홍수통제소 10분단위 유량 정보입니다.
