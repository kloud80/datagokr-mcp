summary_user: AI 홍수예보 시스템에서 홍수특보 수위관측소마다 예측에 쓰는 인근 강수량관측소를 짝지은 매칭표로, 수위관측소명·인근 강수량관측소명·분할유역명을 한 행씩 담는 고정 자료이며 포털에는 7KB 남짓한 CSV 샘플만 올라 있다. 수자원·홍수 분석가가 "이 수위지점의 홍수 예측에는 어느 강우관측소 자료를 넣어야 하나"를 확인하거나 수위지점 간 특성을 비교할 때 쓴다. 전역 조인 키가 없어 수위·강수량 관측 자료와는 관측소 이름을 맞춰 연결해야 한다.
description_portal: '본 자료는 AI 홍수예보 시스템에서 AI홍수예측을 위한 인근 강수량지점 정보를 관리하고 홍수특보지점과 강수량 지점 매칭 관계를 제공하는 데이터 항목으로, 관측소와 지점 정보를 포함하여 각 강수량지점의 유사 특성과 연결 관계를 체계적으로 관리한다. 이를 통해 수위지점 등 특성비교 및 다양한 업무에  활용 할수있다. 본 자료는 업로드 용량 제한으로 샘플 자료 100개만 제공하며 전체 자료 요청은 담당에게 문의. 담당자: 기후에너지환경부 한강홍수통제소 이민호 연구사 02-590-9976'
