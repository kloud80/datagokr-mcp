summary_user: 서울특별시 중랑구에 있는 오피스텔을 건물 한 동씩 담은 건별 목록으로, 소재지 지번주소(면목동·상봉동·중화동·묵동·망우동·신내동 등), 주용도(업무시설·공동주택), 호수, 사용승인년도를 담는다. 중랑구 어느 동에 언제 지어진 오피스텔이 몇 호 규모로 있는지 확인하려는 주민·임대사업자·주택 분석가가 동별 오피스텔 공급 현황을 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 지번주소를 문자열로 맞추는 방식으로만 이을 수 있다.
limits: 범위가 중랑구 한 곳이라 다른 구와 비교하려면 별도 데이터가 필요하다. 표준 코드형 키가 없어 건축물대장·실거래 자료와 연결하려면 지번주소를 직접 매칭해야 한다. 호수는 세대수·가구수와 별개의 값이므로 거주 세대 규모로 해석하지 않는다.
