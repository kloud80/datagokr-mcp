summary_user: 경기도 시군별·연도별 출산 기초 지표를 담은 집계 데이터로, 총출산율과 연령 구간별 출산율, 출생아 수(성별·모 연령대별), 첫째·둘째 이상 출산 건수와 평균 출산 연령, 15~49세·25~39세 여성 인구, 출산 가능 병원·산부인과 수 등 44개 항목을 시군 단위로 제공한다. 지자체 정책 담당자나 분석가가 "우리 시군의 출산율이 낮은 것이 가임 여성 인구 때문인지, 분만 가능한 병원 부족 때문인지"처럼 출산 경향과 출산 인프라를 함께 진단하는 데 쓴다. 실측 컬럼에서 전국 공통 조인 키는 확인되지 않아, 다른 데이터와는 연도(yr)와 시군 이름·시군 코드(sigun_cd)를 이름·코드 매핑해 연결해야 한다.
description_portal: 이 데이터는 경기도 시군별 출산과 관련된 다양한 기초 지표를 담고 있으며, 연도별·지역별 출산율(총출산율 및 연령 구간별 출산율), 출생아 수, 연령별 재출산 건수, 여성 인구(1549세 및 2539세), 출산 가능 병원 수 등 총 44개 항목으로 구성되어 있습니다. 특히 연령대별 출산율(25세 미만, 25세, 30세, 35세, 40세 이상)과 출산 연령대별 재출산 수치를 함께 제공하여, 출산 경향 분석과 출산 정책 수립에 유용합니다. 또한 병원 및 산부인과 수를 함께 제시함으로써 지역별 출산 인프라 현황 파악이 가능하며, 시군별 출산율 저하 또는 개선 요인을 종합적으로 진단할 수 있는 기초 자료로 활용됩니다.
