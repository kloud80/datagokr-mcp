summary_user: 용인시 안 지식산업센터를 한 건물당 한 행으로 담은 건별 현황 파일로, 주소·위도경도, 용도지역, 부지·건축·공장시설·지원시설 면적, 층수, 유치가능업체수, 분양형태, 공사진행상황, 허가·준공·사용승인 일자를 담는다(CSV 약 4.5KB). 기업이나 분석가가 '용인시에서 준공됐거나 공사 중인 지식산업센터는 어디에 있고 입주 가능한 업체 수는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시군구 지식산업센터 파일과는 시군명·센터명으로 맞추고, 건축물대장 등과는 주소나 좌표로 이어 붙인다.
description_portal: '본 데이터는 경기도 용인시 내 지식산업센터의 주요 현황 정보를 제공한다. 수록 항목은 시군명, 지식산업센터명, 소재지지번주소, 소재지도로명주소, 위도, 경도, 용도지역, 부지면적, 건축면적, 층수, 공장시설면적, 지원시설면적, 유치가능업체수, 공장동수, 분양형태, 공사진행상황, 허가일자, 준공일자, 사용승인일자 등으로 구성되어 있다. 이를 통해 용인시 각 지식산업센터의 위치, 공간 특성, 시설 규모, 개발 진행 현황, 입주 가능 업체 수, 지원시설 내역 등을 종합적으로 파악할 수 있다. 자료는 기업 유치 및 분양 정책 수립, 산업단지 개발 계획, 지역 내 첨단산업 육성, 행정 인허가 관리, 연구 및 공간 분석 등 다양한 목적으로 활용할 수 있다. 시민, 기업, 정책 담당자, 연구자 등 다양한 이용자의 정보 접근성과 이해도를 높이고자 하며, 최신 현황이 반영되어 정기적으로 갱신된다. 공공데이터 개방을 통해 정보의 투명성과 활용성을 높이고, 지역 산업 발전 및 기업 지원 환경 조성에 기여하는 것을 목표로 한다.※ 데이터기준일자 : 2026-06-10'
