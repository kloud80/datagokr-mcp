summary_user: 경기도 광주시 도시계획정보시스템에 등록된 보건위생시설(병원·보건소·장례식장·묘지·화장시설 등)을 시설 도형 단위로 담은 시군구 범위 파일이며, 시설명(라벨명)·부지 면적·선형 연장·등록일시를 포함하고 파일 크기는 445바이트로 매우 작다. 도시계획 담당자나 분석가가 '광주시에 도시계획시설로 결정된 장례식장·묘지·화장시설이 어디에 얼마 규모로 있나'를 확인할 때 쓴다. 전역 조인 키는 실측에서 찾지 못했고, 시군구코드나 시설명으로 같은 기관의 다른 도시계획시설 현황이나 보건의료 시설 목록과 맞춰 잇는다.
description_portal: 본 데이터는 경기도 광주시 도시계획정보시스템의 보건위생시설 현황 정보를 제공합니다. 병원, 보건소, 장례식장, 묘지, 화장시설 등 주민의 건강과 위생을 위한 시설의 위치와 규모 정보를 담고 있습니다. 현황도형 관리번호는 각 시설을 고유하게 식별하며, 라벨명은 시설의 명칭을 나타냅니다. 면적은 시설이 차지하는 부지 면적을 제공하고, 길이는 선형 시설의 연장을 나타냅니다. 현황도형 생성일시는 해당 정보가 시스템에 등록된 날짜와 시간을 기록합니다. 본 데이터는 보건 시설 관리, 의료 인프라 계획, 위생 시설 배치, 공중보건 정책 수립, 도시 기반시설 계획 등에 활용됩니다.
