summary_user: LH 청약플러스에서 분양한 주택의 가격공고를 공고·주택형 단위로 담은 파일로, 공고종류·공고구분(일반·정정)·공고명·소재지·주택형·세대수·전용면적과 분양가격 및 그 구성(계약금·중도금합계·잔금·융자금), 입주예정월을 포함한다. 청약 대기자나 분석가가 특정 지역 LH 분양주택의 주택형별 분양가와 계약금·중도금 부담이 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 청약·분양 공고나 실거래 데이터와는 공고명·소재지 같은 이름 매칭으로만 이어 쓴다.
description_portal: 한국토지주택공사 청약플러스에서 분양하는 주택에 대한  공고종류, 공고구분, 공고명, 소재지, 세대수, 분양가격 등 가격공고에 대한 정보를 제공합니다. 분양가격은 계약금, 잔금, 융자금, 중도금의 합으로 구성되나 전산상 1000원 미만의 단위는 절삭하여 제공하므로 1000원 이하의 오차가 존재할 수 있습니다. 지구별 평균 분양 세대수는 222세대수로 총 71,354세대 수를 운용하고 있습니다. 일반, 정정공고로 구분되며 일반적인 분양주택 평형은 59, 74, 84로 나뉘어 집니다. 평형의 단위는 미터제곱입니다.
