summary_user: 서울 밖에 살면서 통근·통학·쇼핑·관광 등으로 특정 시점에 서울의 특정 지역에 머무는 내국인과 장기 체류 외국인을 기준일·시간대·행정동별로 집계하고, 성별·5세 연령대별 생활인구수를 함께 담는다. 분석가나 상권·교통 담당자가 "경기·인천 등 수도권 거주자가 평일 출근 시간대에 서울 어느 동에 얼마나 모이는가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 행정동 코드(ADSTRD_CODE_SE)를 서울시 행정동 코드표나 같은 기관의 다른 생활인구 데이터와 코드·이름으로 맞춰 이어 쓴다.
limits: 호출에는 포털 활용신청과 별개로 서울 열린데이터광장(data.seoul.go.kr) 인증키가 필요하다. 전역 조인 키가 없어 다른 기관 데이터와는 행정동 코드·이름 매핑으로만 연결된다.
