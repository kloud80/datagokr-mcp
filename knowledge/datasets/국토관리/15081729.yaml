summary_user: 대전광역시 서구 관내 도시공원마다 설치된 야외 조명시설 수를 공원 한 곳당 한 행으로 담은 파일이며, 화장실·건물 안 조명은 빠져 있고 LED·CDM·나트륨·기타 종류별 개수와 합계, 자동 점멸기 운영 여부, 자정 이후 점등 여부를 함께 적는다. 공원 관리 담당자나 분석가가 '서구에서 아직 나트륨등이 남아 LED 교체가 필요한 공원은 어디인가', '밤 12시 이후에도 불이 켜지는 공원은 어디인가'를 확인할 때 쓴다. 전역 조인 키가 없으므로 공원명·행정동·소재지 이름을 기준으로 서구 도시공원 현황이나 다른 공원시설 데이터와 맞춰 이어 쓴다.
description_portal: 본 데이터 파일은 대전광역시 서구 관내 도시공원에 설치된 조명시설의 현황 정보를 수록한 자료입니다.○ 본 자료는 공원 내 화장실 및 건물 내 조명을 제외한 야외 조명시설에 한정하여 수록되었습니다.○ 수록 항목에는 공원등, 잔디등, 투광기, LED, CDM, NH등 등 다양한 종류의 조명기구가 포함되어 있으며, 각 조명기구의 설치 개수가 함께 제공됩니다.○ 조명시설 정보는 도시공원의 야간 안전성 확보 및 시설 관리의 효율성을 도모하기 위해 구성된 자료입니다.○ 공원별 조명기기 현황을 통합하여 분석함으로써 유지보수, 교체계획 수립, 에너지 절감 방안 마련 등에 활용할 수 있습니다.○ 본 데이터는 도시공원 환경 개선 및 지역 조경 설계, 공공시설물 관리 등을 위한 기초자료로 제공됩니다.
