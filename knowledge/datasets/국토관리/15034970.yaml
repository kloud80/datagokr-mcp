summary_user: 부안군 관내 제조업 공장을 한 곳씩 담은 명부로, 읍면·회사명·공장 대표 주소·전화번호·주요 생산품을 담는다(csv 약 24KB). 부안군 어느 읍면에 어떤 품목을 만드는 공장이 있는지 확인하려는 기업 유치 담당자, 창업 입지 조사자, 거래처를 찾는 사업자가 쓴다. 사업자번호·업종코드·필지번호 같은 전역 조인 키가 없어 다른 공장등록 자료와는 회사명이나 주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 전라북도 부안군에 위치한 제조업 공장의 현황을 수록한 자료로, 공장이 속한 읍·면, 회사명, 공장 대표 주소, 전화번호, 주요 생산품 항목으로 구성되어 있다. 부안군 관내 제조업체의 공간 분포와 업종 특성, 생산 구조 등을 파악할 수 있으며, 산업 분석 및 기업 유치, 지역경제 정책 수립 등에 활용될 수 있다. 또한 중소기업 지원, 창업 입지 조사, 산업단지 조성 등 민간 및 공공 부문 모두에서 기초자료로 활용 가능하다. 본 데이터는 주기적으로 갱신되며, 부안군 내 제조업 기반의 규모와 특성을 이해하는 데 유용한 정보를 제공한다. 데이터 개방을 통해 산업 정보의 접근성을 높이고, 지역경제 활성화와 행정의 투명성 제고에 기여하는 것을 목적으로 한다.
