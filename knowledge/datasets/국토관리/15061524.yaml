summary_user: 경기도 내 현수막 지정게시대를 게시대 한 곳씩 담은 현황 자료로, 시군명, 게시 장소, 도로명·지번 주소, 위도·경도, 용도 구분, 관리기관과 연락처, 데이터 기준일자를 포함한다. 사업자가 우리 동네 상업용 게시대가 어디 있고 어느 기관에 신청해야 하는지 확인하거나, 분석가가 시군별 게시대 분포를 비교할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명 이름 매핑이나 같은 기관 코드로 잇고, 위도·경도로 지도 위에 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 현수막 지정게시대의 설치 현황과 관련 정보를 정리한 자료로, 지역별 게시대 위치 및 사용 조건을 확인할 수 있습니다. 주요 항목은 시군명, 읍면동명, 게시대명, 소재지 주소(도로명 및 지번), 위도·경도, 게시대 수, 현수막 규격(너비, 높이), 게시면수(행정용/상업용), 부착일수, 부착금액(상업용/민원수수료/도로점용료), 관리기관명, 전화번호 등으로 구성되어 있습니다. 이 자료는 도시 미관 관리, 옥외광고 허가 관리, 광고물 설치정책 수립, 광고수익 분석 등에 활용되며, 특히 상업용 게시대의 수익성과 지역별 광고 수요 비교 분석에 유용합니다.
