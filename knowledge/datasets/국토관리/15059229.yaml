summary_user: 경기도 내 연면적 2천제곱미터 이상 업무시설을 공중이용시설로 보고 사업장 한 곳씩 사업장명, 시군, 인허가·폐업일자, 영업상태, 소재지 면적, 위생업종·업태, 주소와 좌표를 담은 건별 현황 데이터다. 보건·환경 담당자나 분석가가 "우리 시군에서 영업 중인 대형 업무시설은 어디이며 실내공기질 점검 대상은 몇 곳인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)·시군명이나 주소·사업장명 매핑으로 다른 경기도 공중이용시설·다중이용시설 자료와 잇는다.
description_portal: 경기도 내 공중이용시설 현황(업무시설)입니다. 공중이용시설 현황(업무시설)은 공중의 이용으로 인해 건강 및 공중위생에 영향을 미칠 수 있는 연면적 2천제곱미터 업무시설입니다.경기도 내 공중이용시설 현황 중 ‘업무시설’에 해당하는 자료는 다수의 사람들이 이용하는 건축물 중에서도 특히 공중의 출입이 잦고 밀집도가 높은 업무 관련 건물들에 대한 정보를 포함하고 있습니다. 이 데이터는 연면적 2,000제곱미터 이상인 업무시설을 대상으로 하며, 이러한 시설은 그 규모와 이용자의 수로 인해 실내 환경이 이용자의 건강과 공중위생에 직접적인 영향을 미칠 수 있는 공간으로 분류됩니다.‘업무시설’이란 주로 사무실, 업무용 빌딩, 공공기관 청사, 기업 본사 및 지사 건물 등 다양한 형태의 업무 수행 공간을 의미하며, 이들 건물은 불특정 다수가 일정 시간 이상 체류하면서 일상적인 활동을 하는 공간인 만큼, 공기질, 청결도, 위생 관리 등이 법적 기준에 따라 엄격히 관리되어야 합니다.이 데이터에는 각 시설의 소재지, 건축 면적, 사용 용도, 관리기관 등 기본 정보가 포함되어 있으며, 이는 환경보건 정책 수립, 위생 점검 대상 선정, 실내공기질 모니터링, 감염병 예방을 위한 시설 환경 개선 등에 필요한 기초자료로 활용됩니다. 특히 「실내공기질관리법」 및 「공중위생관리법」 등 관련 법령의 적용 대상이 되는 시설로, 주기적인 점검, 환기설비 설치, 실내 환경측정 등의 법적 의무가 부과될 수 있습니다.따라서 본 데이터는 공공보건 행정, 실내환경 개선 정책, 민원 응대 시스템 개발, GIS 기반의 다중이용시설 분포 지도 작성 등 다양한 행정 및 정책 분야에서 중요한 참고자료가 됩니다.
