summary_user: 진안군 도시계획정보시스템(UPIS)에 등록된 교통시설 집행 현황 도형을 한 행씩 담은 건별 공간 자료로, 도형별 관리번호·도면번호·라벨명·면적·길이·외곽 좌표 범위(X·Y 최소·최대)와 도형 생성일시를 담는다(파일 크기 약 1.3KB의 소량 자료). 진안군 안에서 도로·주차장 같은 도시·군계획 교통시설이 어디에 어느 규모로 집행됐는지 확인하려는 분석가나 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 좌표 범위로 공간 대조하거나 같은 기관의 UPIS 결정·미집행 자료와 관리번호·라벨명으로 맞춰 이어 쓴다.
limits: 전역 조인 키가 없어 다른 기관 자료와 코드로 바로 연결할 수 없다. 범위는 진안군 한 곳의 개별 시설 단위이므로 다른 시군과 비교하려면 지역별 자료를 따로 모아야 한다.
