summary_user: '경상북도 청도군 관내 섬유공장을 공장 한 곳당 한 행으로 담은 명부 파일(csv, 658바이트)로, 회사명·대표자명·도로명 주소·전화·팩스·생산품을 담는다. 청도군에서 어떤 섬유 제품을 만드는 업체가 어디에 있는지 찾으려는 사업자나, 지역 섬유산업의 분포를 살피려는 분석가가 쓴다. 사업자번호·업종코드·필지번호 같은 공통 조인 키가 없어서, 다른 공장등록 데이터(예: 팩토리온 공장등록 정보)와는 회사명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.'
description_portal: 경상북도 청도군 관내에서 운영 중인 섬유공장에 대한 현황 정보를 제공합니다.이 자료는 청도군 지역 내 제조업 기반 중 하나인 섬유 산업 분야의 사업체 현황을 파악하고, 관련 산업의 구조 및 분포를 이해하기 위한 기초 산업정보로 구성되어 있습니다. 자료에는 각 섬유공장의 회사명, 대표자 성명, 사업장 주소(도로명 또는 지번), 전화번호, 팩스번호, 그리고 주요 생산품에 대한 정보가 포함되어 있으며, 이를 통해 관내 섬유 제조업체의 입지 현황과 생산 특성, 연계 산업군 파악, 산업클러스터 구성 가능성 등에 대한 실질적인 분석이 가능합니다.
