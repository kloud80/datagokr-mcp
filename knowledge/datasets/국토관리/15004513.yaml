summary_user: 부산광역시 상수도사업본부가 시행하는 상수도 공사를 건별로 담으며, 공사명·발주부서·착공일·완료일·공사개요·공정율(pcent)·계약금액·시공사·현장대리인 등을 포함한다. 시민이 집 근처 상수도관 교체나 송수관 정비 공사의 기간과 시공사를 확인해 불편 민원을 넣을 때, 또는 분석가가 부산 상수도 시설 투자와 공정 진행 현황을 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공사명·부서명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 부산광역시 상수도 사업본부에서 시행하는 공사현황을 개방합니다.상수도 공사는 깨끗하고 안정적인 물공급을 위해 상수도 시설을 설치, 보수, 확장 하는 공사를 말합니다. 개방되는 데이터에는 공사명, 발주부서(상수도 본부, 사업소 등), 착공일, 완료일, 공사개요, 공정율, 계약금액, 시공사, 현장대리인 등의 데이터가 포함됩니다.상수도 공사로 인해 발생하는 피해나 불편사항들에 대해서 민원을 제기하거나 의견을 표시할 때 도움을 받을 수 있습니다.상수도관교체, 송수관연결, 송수관 정비, 배수관 세관 등 다양한 목적으로 공사를 진행합니다.
