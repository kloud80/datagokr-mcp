summary_user: 경기도 이천시 관측 지점별로 10분 간격(분류 M) 측정값을 날짜와 함께 기록한 건별 시계열 파일로, 포털 설명은 수위(cm)라고 하지만 실제 필드 목록은 지점코드·지점명·날짜·강우량(mm)·강우 여부로 되어 있으며 CSV 한 파일이 약 47.5MB입니다. 이천시 하천 주변 주민이나 재해 담당자가 특정 지점에 언제 얼마나 비가 왔는지, 또는 집중호우 때 물이 얼마나 불었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 지점코드·지점명을 WAMIS 관측소 코드 등과 이름 대조로 매핑하거나, 같은 이천시 자료끼리만 연결한다.
description_portal: 본 데이터는 경기도 이천시 내 수위관측 지점에서 측정된 수위를 기록한 자료로, 지점코드, 지점명, 측정 간격(M단위), 측정일자, 평균 수위, 최저 수위, 최고 수위 항목으로 구성되어 있습니다. 각 관측 지점은 고유 코드와 명칭으로 식별되며, 해당 날짜 기준으로 측정된 수위 데이터를 cm 단위로 제공합니다. 이 데이터는 하천 및 저수지 수위 변화 모니터링, 수해 위험지역 예측, 기후 변화 분석, 수자원 관리 및 재해 예방 정책 수립 등에 활용될 수 있으며, 실시간 수문자료 기반의 스마트 관측 체계 구축에도 기초 자료로 사용됩니다.
