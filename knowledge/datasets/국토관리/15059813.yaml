summary_user: 전국 LH 매입임대·건설임대 주택을 단지 한 줄씩 담아, 공급기관·주택유형·도로명주소·총세대수와 함께 입주민 수를 10세 단위 연령대(10대 미만~100대)와 성별로 나눈 집계를 제공한다(CSV 약 4MB). 연구자나 지자체 담당자가 "고령 입주민이 많은 임대단지는 어디이고 돌봄·편의시설 수요가 어느 지역에 몰리는가" 같은 질문에 쓴다. 전역 조인 키가 없어 도로명주소나 주택명으로 다른 임대주택·주소 데이터와 맞춰 붙이거나, 같은 기관(LH) 데이터와 단지명으로 연결해야 한다.
description_portal: '전국 매입임대와 건설임대 유형의 임대주택 단지별 유형,공급기관명, 주택명, 주소명, 총세대수등의 주택정보와 연령,성별등 입주민관련 통계정보를 제공합니다.매입임대 : LH가 기존 도심의 다가구 주택을 매입하여 공급하는 주택건설임대 : LH가 직접 건설하여 공급하는 주택공급기관명 : 성남시, 제주시, 대전광역시, SH공사, 부산도시공사, 대전도시공사, 한국토지주택공사 등의 유형주택유형 : 다세대주택, 매입다가구, 아파트 등의 유형도로명주소 :  도로에 이름을 부여하고 건물에 번호를 부여하여 건물의 위치를 쉽게 찾을 수 있도록 하는 새로운 주소 체계'
