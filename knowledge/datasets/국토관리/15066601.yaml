summary_user: 청주시 관내 산업단지별 입주기업을 기업 한 건씩 담은 목록으로, 포털 설명 기준 2022년 8월 31일 시점 1,232건이며 단지명·회사명·지식산업센터명·공장 도로명주소·업종번호(한국표준산업분류 5자리)·생산품·용지·제조시설·부대시설 면적을 담는다. 구직자나 영업 담당자가 '오창·오송 등 특정 산단에 어떤 업종의 어떤 회사가 들어와 있고 공장 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 업종번호를 한국표준산업분류 코드표와 맞추거나, 회사명·공장 주소로 공장 등록·지식산업센터 자료와 이름 매핑해 이어 쓴다.
description_portal: 충청북도 청주시 관내 산업단지별 입주기업 현황 데이터(2022년 8월  31일 기준, 1,232건)로 단지명, 회사명, 지식산업센터명, 공장대표주소, 대표업종번호, 업종번호, 업종명, 생산품, 용지면적(제곱미터), 제조시설면적(제곱미터), 부대시설면적(제곱미터)을 제공하며, 업종번호는 통계청의 한국표준산업분류[KSIC]의 5자리 업종코드를 의미합니다.* 본 데이터는 2022년 8월  31일 기준으로 공공데이터 포털 공공데이터 제공 신청 건에 대하여 제공하는 공공데이터로, 산업단지 내 입주기업 정보는 한국산업단지공단에서 관리합니다.
