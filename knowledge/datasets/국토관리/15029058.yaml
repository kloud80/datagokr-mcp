summary_user: 대전광역시에 등록된 제조업 공장을 업체 한 곳당 한 행으로 담은 파일(csv, 약 30KB)로, 업체명·업종·주생산품·용지면적·제조시설과 부대시설 규모·남녀 종사자 수가 들어 있다. 대전 지역 산업정책 담당자나 분석가가 '대전에서 어떤 업종 공장이 얼마나 넓은 용지와 인력을 쓰고 있는가'를 볼 때 쓴다. 실측 컬럼에 사업자번호·산업분류코드·필지번호 같은 전역 조인 키가 없으므로, 다른 공장등록·기업 자료와는 업체명 문자열 매칭으로만 이어 쓴다.
description_portal: 대전광역시 공장 현황 자료는 대전 지역 내 제조업체로 등록된 공장의 세부 정보를 포함하고 있습니다. 이 자료는 각 업체 별 주 생산품 종류,  용지의 면적, 제조 시설 및 부대 시설의 유무와 규모, 종사 인원 등의 항목을 제공하며, 산업단지 내 제조업 활동 실태와 공간 활용 현황을 파악하는 데 유용합니다. 이를 통해 지역 산업의 분포와 공장 밀집도, 업종별 활동 특성 등을 분석할 수 있으며, 제조업 기반 정책 수립, 인프라 확충, 산업 용지 활용도 분석, 공장 관리 및 행정 지원을 위한 기초 자료로 활용될 수 있습니다. 향후 제조업 발전 방향 설정이나 신규 입주 기업 대상 정책 설계 시 참고자료로서 활용될 수 있습니다.
