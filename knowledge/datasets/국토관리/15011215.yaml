summary_user: 지역균형발전과 지역 산업 활성화를 지원하는 기관을 한 행에 한 곳씩 담은 전국 단위 CSV 목록으로, 기관명·소재 지역·전문 분야·기관 유형·홈페이지·전화번호·주소·주요업무를 수록한다. 지역 기업이나 단체가 "우리 시도에서 기술이전이나 인력양성을 도와주는 기관은 어디이고 어떻게 연락하나"를 확인할 때, 행정 실무자가 지역별 유관기관 연락망을 정리할 때 쓴다. 공통 기관코드 같은 전역 조인 키는 없으므로, 다른 데이터와는 기관명이나 주소·지역명을 문자열로 맞춰 연결해야 한다.
description_portal: '본 데이터는 한국산업기술기획평가원이 정리한 지역균형발전 지원기관 목록으로, 지역 산업 활성화 및 관련 지원서비스에 연결될 수 있는 기관의 기본 정보를 CSV 형태로 제공합니다. 기관별로 기관명과 소재 지역이 제시되어 어느 권역에서 활동하는 조직인지 확인할 수 있고, 기관의 전문 지원 영역과 기관 유형(공공기관, 연구기관, 지원센터 등) 정보가 함께 수록되어 지원 주체의 성격을 구분하는 데 도움이 됩니다. 또한 홈페이지 주소, 전화번호, 주소 등 연락·방문에 필요한 정보가 포함되어 있어, 이용자가 기관을 찾은 뒤 바로 문의하거나 공식 안내 페이지를 확인할 수 있습니다. 주요업무 항목에는 기업지원, 기술이전, 인력양성, 정책연계 등 기관이 제공하는 지원 기능이 정리되어 있어, 특정 수요(예: 기술지원 상담, 교육 프로그램 탐색, 정책 연계 창구 확인)에 맞는 기관을 선별하는 데 활용할 수 있습니다. 이 자료는 지역 기업·단체가 적합한 지원기관을 빠르게 찾는 참고용 디렉터리로 사용할 수 있으며, 행정·정책 실무에서는 유관기관 연락망 구축, 협업 대상 정리, 지역별 지원기관 안내자료 제작 등 기관 정보의 체계적 관리에도 유용합니다.'
