summary_user: 강릉시에서 많이 찾는 관광지·카페·맛집·문화공간 같은 인기 장소를 한 곳당 한 행으로 정리해 이름, 도로명 주소, 전화번호, 소개 문구, 연관 키워드를 담은 작은 파일(약 2.4KB CSV)이다. 강릉 여행을 계획하는 관광객이나 관광 서비스 개발자가 "바다뷰 카페나 야경 명소 같은 테마로 강릉에서 어디를 묶어 코스를 짤까"를 정할 때 쓴다. 다른 데이터와 바로 붙일 전역 조인 키나 코드가 없어, 장소명이나 소재지 주소를 문자열로 맞추거나 주소를 좌표로 바꿔 다른 관광·상권 데이터와 이어 쓴다.
