summary_user: 부산광역시 남구의 일반건축물을 건물(동·호) 단위로 물건지·시가표준액·연면적·납부년도·결정일자와 함께 담은 건별 파일 데이터로, 포털 설명상 2025년 기준이며 범위는 남구 한 시군구입니다. 재산세·취득세 과세표준의 바탕이 되는 시가표준액을 확인하려는 남구 건물 소유자나, 남구 건물의 면적 대비 시가표준액 분포를 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 물건지 주소 문자열이나 자치단체코드를 맞춰 이어 써야 합니다.
description_portal: '부산광역시 남구 지방세, 특히 재산세와 취득세 등의 과세표준을 산정할 때 사용되는  2025년 물건지, 시가표준액, 연면적을 법정동, 법정리, 동, 호수 별로 일반건축물 시가표준액을 제공합니다.산정 주체: 국토교통부 고시산정 방식:건물 구조 (철근콘크리트, 조적조 등)건축 연도 (신축, 노후 여부)용도 (주택, 상가, 공장, 창고 등)면적 (연면적 기준)이 요소들을 반영해, 국토교통부가 매년 1월 1일 기준으로 고시하는 ㎡당 단가를 기초로 하여 시·군·구청장이 개별 건물별로 산정합니다.더 자세한 조회 사항은지자체 세무과 또는 건축과전화 또는 방문 문의위택스 https://www.wetax.go.kr"재산세 시가표준액 열람" 메뉴부동산 공시가격 알리미 https://www.realtyprice.kr(공동주택 중심이지만 일부 조회 가능)'
