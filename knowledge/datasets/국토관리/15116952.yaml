summary_user: 충청남도 금산군에 있는 골프장과 골프연습장(스크린골프 포함) 등 골프 관련 체육시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설 구분·사업장명·위치 주소·위도·경도를 담는다(파일 크기 593바이트의 소규모 CSV). 주민이나 지역 분석가가 '금산군 안에 골프 시설이 어디에 몇 곳 있고 어떻게 분포하는가'를 확인하거나, 생활체육·스포츠 관광 시설 현황을 지도에 올릴 때 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 주소나 좌표(위도·경도)를 이용한 공간 매칭, 또는 사업장명 대조로만 이어 쓴다.
description_portal: 본 데이터는 충청남도 금산군에서 운영중인 존재하는 골프장 및 골프연습장 정보를 제공합니다. 2023년 8월 기준 금산군에는 에딘버리 CC, 유한회사 진악산골프클럽, 이글스크린골프존, 금산골프연습장, 프렌즈스크린골프, 투인스크린이 있으며, 총 6개의 골프 관련 체육시설에 대해 사업장명, 사업장 위치, 위도, 경도 데이터를 제공하고 있습니다. 또한 위치 기반 행정정보가 포함되어 있어 체육 인프라 분포를 파악하는 데 활용될 수 있습니다. 또한 골프 시설 정책 수립, 생활체육 기반 조성, 스포츠 관광 개발 등에 유용하게 활용될 수 있습니다.
