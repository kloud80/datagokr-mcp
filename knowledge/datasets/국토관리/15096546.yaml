summary_user: 무주군 농공단지 3곳(무주 제1, 무주 제2, 안성)에 입주한 업체를 업체 한 곳당 한 행으로 담은 명단으로, 업체명·도로명주소·전화번호·업종·생산품을 기록한 4KB 남짓의 작은 CSV 파일이다. 구직자나 영업 담당자가 '무주 농공단지에 어떤 업종의 어떤 업체가 무엇을 생산하는지, 연락처는 무엇인지' 확인할 때 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 업체명이나 도로명주소를 맞춰 공장 등록·산업단지 현황 자료와 이어 쓴다.
description_portal: 전북특별자치도 무주군 농공단지에 입주해 있는 업체 현황을 매년 갱신하여 파일데이터로 제공하고 있습니다.농공단지명(무주 제1, 무주 제2, 안성), 업체명, 소재지도로명주소, 전화번호, 업종명, 생산품(유제품, 병, 터널라이닝폼, 샷시, 구조물, 철강, 거울, 햄, 소세지, 천마엑기스, 빵, 떡 등), 데이터기준일자 등으로 파일 데이터컬럼이 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다.해당 데이터는 전북특별자치도 무주군 산업건설국 산업경제과 투자유치팀에서 관리하고 있으며 자세한 내용은 063-320-2354(산업경제과)로 연락주시면 됩니다.
