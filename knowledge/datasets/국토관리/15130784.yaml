summary_user: 경기도 내 주택 실거래를 거래 건별로 담은 원천 데이터로, 시군구·읍면동·지번·도로명 위치, 주택유형·단지명·전용면적·층·건축년도, 계약일·거래금액, 매도·매수 주체, 중개 여부, 해제 여부와 사유, 등기일자를 포함한다. 경기도 특정 읍면동이나 단지의 최근 매매가가 어떻게 움직였는지, 해제된 거래가 얼마나 되는지 확인하려는 국민·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구·읍면동 코드나 지번·도로명 이름 매칭으로만 공시가격·건축물 정보 등 다른 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기부동산포털에서 제공하는 경기도 내 주택 실거래가 정보를 수록한 자료입니다. 각 거래 건별로 시군구 코드, 접수년도, 처리구분, 접수번호 등 행정 정보와 함께 주택유형, 위치(시군구·읍면동·도로명), 단지명, 전용면적, 대지권면적, 층수, 건축년도 등의 물리적 특성이 포함됩니다. 또한 계약일과 거래금액, 거래주체(매도자·매수자 구분), 중개 여부, 해제 여부 및 사유, 등기일자 등이 제공되어 거래의 전 과정과 결과를 종합적으로 확인할 수 있습니다. 이 데이터는 부동산 거래 투명성 제고, 주택시장 분석, 지역별 가격 동향 파악, 정책 연구 및 투자 참고자료로 활용할 수 있습니다.
