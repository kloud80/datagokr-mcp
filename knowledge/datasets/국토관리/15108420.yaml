summary_user: 마이홈포털에 올라온 국민임대·영구임대·행복주택 등 공공임대주택 모집공고를 공고 단위로 담고, 단지별 주소·필지(pnu)·공급호수·임대보증금·월임대료·접수 기간을 함께 제공하는 전국 범위 API다. 공공임대 입주를 준비하는 국민이 '우리 시군구에 지금 접수 중인 행복주택 공고와 보증금·월세는 얼마인가'를 확인하거나, 분석가가 지역별 공공임대 공급 공고를 모으는 데 쓴다. 단지 필지 고유번호(pnu)를 키로 토지·건축물 등 필지 단위 데이터와 이어 쓰고, 시도·시군구명과 법정동명은 지역별 집계에 쓴다.
description_portal: 국토교통부에서 제공하는 마이홈포털 공공임대주택 모집공고 조회 서비스입니다. 오퍼레이션 파라미터를 기준으로 공공임대주택 모집공고 조회하는 서비스 (유의)조회하는 시점에 따라 ‘응답 메시지’가 달라질 수 있습니다. API는 활용신청을 통해 받은 인증키를 사용하여 접속할 수 있습니다. 데이터는 시도 등의 지역 정보를 포함하고 있으며, 공공임대주택 정보를 제공하고 있습니다. 공공임대주택으로는 국민임대, 영구임대, 행복주택 등의 유형을 구분하여 제공중입니다. 자세한 파라미터는 참고문서 파일을 참고해주십시오.
