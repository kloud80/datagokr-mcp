summary_user: 국토지리정보원이 수행한 항공라이다(LiDAR) 촬영 성과를 자료 한 건씩 담은 성과 목록으로, 자료ID·명칭과 함께 자료형식·촬영년도·좌표계·제작기관을 기록하며 범위는 전국입니다(CSV 파일 약 149KB). 측량·공간정보 분석가가 특정 지역의 라이다 성과가 어느 해에 어떤 좌표계·형식으로 만들어졌는지 확인해 원자료 신청이나 지형 분석 계획을 세울 때 쓴다. 다른 데이터와 묶을 공통 조인 키는 없어, 명칭(사업지구명)이나 촬영년도를 기준으로 같은 기관의 항공사진·정사영상 성과 목록과 이름 매칭으로 잇는다.
description_portal: '항공라이다 촬영 성과에 대한 성과정보 (사업지구, 장비, 촬영정보, 업체정보 등)▷ 식별정보 : LIDAR자료ID, 명칭▷ 속성정보 : 자료형식, 촬영년도, 좌표계, 제작기관, 참고사항, 예비, 지리좌표계* LiDAR (Light Detection And Ranging) :  레이저를 지표면에 쏘아 반사된 신호를 측정하여 고도와 위치를 정밀하게 파악하는 원격탐사 기술* 항공사진 : 항공기나 드론 등의 항공 플랫폼에서 지표면을 촬영한 사진으로, 지도 제작, 지형 분석, 도시계획, 환경 모니터링 등 다양한 분야에서 활용- 전국을 촬영하여, 국토 변화상황을 모니터링 하고 정사영상 제작 및 국가기본도 수정 등에 활용- 전국을 도시지역(해상도 12cm) 및 비도시지역(해상도 25cm)으로 구분하여 도시지역, 비도시지역 1년 주기 촬영'
