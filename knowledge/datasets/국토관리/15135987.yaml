description_portal: '건축물 생애이력 관리시스템에서 수집하는 건축물 유지관리 점검기관과 정기점검 이력 정보를 제공합니다.* 점검기관 : 건축물 유지점검을 수행한 점검기관 관련하여, 점검기관이 등재된 시도 코드와 점검기관명을 기준으로 주소, 건물명, 영업상태, 신청규모, 안전진단여부, 정기점검여부 점검기관 구분 정보를 제공합니다.* 정기점검이력 : 건축물 유지점검을 수행한 점검이력과 관련하여, 점검한 건물의 시군구와 법정동 코드, 번, 지, 건축물명, 동명 등을 기준으로 점검기관명, 점검시작일, 승인일시 정보를 제공합니다.'
