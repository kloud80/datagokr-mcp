summary_user: 경기도 이천시 안에서 공사 중이거나 공사를 마친 공동주택을 공사 건별로 담은 작은 CSV 파일(약 2.5KB)이다. 항목은 공사명, 시공사, 공사 시작·완료일, 입주예정일, 세대수, 지번·도로명 주소, WGS84 위경도다. 이천시에 언제 어느 위치에서 몇 세대 규모의 아파트가 입주할 예정이며 어느 건설사가 짓는지 확인하는 데 쓴다. 공통 조인 키는 없어서, K-apt 단지코드나 실거래 단지명 같은 다른 주택 데이터와는 단지명·주소를 맞추거나 좌표로 공간 결합해 연결한다.
description_portal: 이 데이터는 경기도 이천시 내 공동주택의 건축 및 시공 현황을 정리한 자료로, 공공·민간이 시공한 아파트 단지별 정보를 포함합니다. 주요 항목으로는 시군명, 시공사명, 공사 시작일과 완료일, 입주예정일, 세대수, 위치정보(지번 및 도로명 주소), 위도(WGS84), 경도(WGS84) 등이 있으며, 이를 통해 공동주택 단위의 건축 일정과 위치, 주거 규모를 파악할 수 있습니다. 본 데이터는 주택 수급 현황 분석, 정주여건 개선, 도시개발 계획 수립, 건설사별 실적 비교, 기반시설 확충 정책 수립 등에 활용될 수 있으며, 위치 좌표 정보는 공간 분석 및 지도 시각화 자료로도 유용하게 사용됩니다.
