description_portal: 음성군 국가공간정보통합체계 공간정보 기타 데이터는 행정 및 공간정보 관리 체계를 지원하기 위해 구성된 자료입니다. 주요 컬럼에는 각 항목을 구분하는 연번, 해당 데이터가 속한 시스템명, 데이터 구조를 정의하는 논리데이터베이스명과 실제 저장 단위를 나타내는 물리데이터베이스명이 포함됩니다. 또한 테이블을 식별할 수 있는 영문테이블명과 한글테이블명이 제공되며, 세부 항목을 설명하는 영문 컬럼명과 한글 컬럼명이 기록되어 있습니다. 데이터의 활용 범위를 알 수 있는 공개여부는 행정적 투명성과 정보 접근성을 판단하는 기준이 되며, 데이터 기준일자는 최신성을 확인할 수 있도록 제공됩니다. 이 자료는 공간정보 관리, 행정 데이터 표준화, 시스템 간 연계 및 활용을 위한 기초 자료로 활용될 수 있습니다.
