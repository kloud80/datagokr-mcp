description_portal: '경상북도 영덕군에 위치한 부동산중개업소  사무소명, 사무소전화번호, 사무소주소 등 부동산중개업소 정보를 아래와 같이 제공하고자 합니다.부동산중개업소는 부동산 거래를 원하는 사람들(매도인, 매수인, 임대인, 임차인) 사이에서 부동산의 매매·임대차 등을 알선하거나 중개하는 업무를 수행하는 곳입니다. 일반적으로 공인중개사가 개설하며, 정식 등록을 마친 후 영업할 수 있습니다.- 업무 범위 : 부동산 매매·임대차의 중개, 권리분석, 거래계약 체결 지원, 등기절차 안내 등- 주요 대상 : 아파트, 주택, 상가, 토지 등 부동산을 거래하거나 임대하려는 개인 및 기업- 보수 : 거래 완료 시 일정 기준에 따라 중개수수료를 수취- 공인중개사법 준수 : 무등록 영업, 허위광고, 중개사 아닌 자의 영업 등은 법으로 금지되어 있음'
