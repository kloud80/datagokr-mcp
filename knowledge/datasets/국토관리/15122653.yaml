description_portal: 본 데이터는 경기도 광주시의 도시계획정보 중 건축물 주제도 용적율 정보를 제공합니다. 필지별 건축물의 용적율 현황 정보를 담고 있어 토지 이용 밀도를 파악할 수 있습니다. 지번코드는 각 필지를 식별하는 코드이며, 건물군 관리번호는 건축물 군집 단위의 관리 번호를 나타냅니다. 용적율은 대지면적 대비 연면적의 비율로 건축물의 밀도를 표시하고, 지번코드표는 지번 코드의 상세 정보를 제공합니다.(지번코드:시도_시군구_법정리코드(10)+필지구분(1:일반,2:산)(1)+본번(4)+부번(4)) 본 데이터는 도시 계획 분석, 개발 가능성 검토, 용적율 관리, 토지 이용 계획, 재개발·재건축 사업 검토, 부동산 개발 분석 등에 활용됩니다.
