summary_user: LH가 관리하는 사전청약 공고를 공고 한 건 단위로 담으며, 공고세부유형명·공고명·지역명(시도 단위)·게시일·마감일·상세 URL을 전국 범위로 조회한다. 사전청약을 준비하는 국민이 "지금 우리 시도에 접수 중인 LH 사전청약 공고가 있고 마감일이 언제인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 청약·분양 데이터(마이홈, 청약홈 경쟁률 등)와는 지역명·공고명 같은 이름 매핑이나 LH의 다른 공고 서비스와의 기관 내 코드로만 연결한다.
limits: 공고는 이벤트 때 생성된 뒤 바뀌지 않는 형태라 경쟁률·당첨 결과는 이 데이터에 없고, 지역은 시도 단위까지만 구분된다. 다른 데이터와 붙일 공통 키가 없어 이름 매칭에 기대야 하며, 개발계정은 하루 10,000회로 호출이 제한된다.
