summary_user: 산업단지 안에 유치할 수 있는 업종 정보를 산업입지도 공간정보 오픈API(OGC 표준) 형태로 담은 전국 범위 데이터이다. 산업단지에 어떤 업종이 들어올 수 있는지 알아보려는 사업자나 분석가가 단지명(dan_name)과 업종 분류(cat_nam)를 확인하는 데 쓴다. 전국 산업단지 표준데이터·일반현황·경계도면의 산업단지코드 원장과 이어 쓰는 것이 적합하지만, 이 데이터에는 전역 조인 키가 없어 이름 매핑이나 같은 기관 코드로 연결해야 한다.
limits: vworld.kr 외부 사이트 인증키(key)가 필요하며 포털 활용신청과는 별개이다. 실측 컬럼에서 전역 조인 키를 찾지 못해 단지명 등 이름 매핑에 의존해야 하고, 용지 분양·임대·미분양 같은 정보는 이 범위에 포함되지 않는다.
