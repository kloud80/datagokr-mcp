description_portal: 산업입지도는 유한한 국토공간의 토지이용을 제고하고 국가경제발전의 기틀을 마련하기 위한 산업의 생산 및 활동공간을 확보하는 정책을 목적으로한 공간정보로, 산업단지 내 단지경계, 단지용도지역, 단지시설용지, 단지유치업종 등의 정보를 오픈API 형태로 공간정보(지도)로 표현OGC(Open Geospatial Consortium) 표준 API는 공간 데이터의 공유와 상호운용성을 위해 개발된 국제 표준으로, 웹 기반에서 지도, 피처, 래스터 등 다양한 지리정보를 효율적으로 제공·활용할 수 있게 합니다. 최신 OGC API는 RESTful 구조를 채택해 개발 편의성과 확장성을 높였으며, WMS, WFS 등 기존 표준을 현대적으로 계승합니다
