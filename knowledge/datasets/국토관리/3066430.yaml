summary_user: 경상남도 창원시 5개 구의 공동주택(아파트 등) 단지를 한 행에 한 단지씩 담은 현황 파일로, 단지명·행정구역·위치·도로명주소·동수·층수·세대수·준공일을 담는다(CSV 약 94KB, 시군구 범위). 창원시 안에서 특정 구에 어떤 단지가 있고 세대수와 준공 시점이 어떤지 확인하려는 주민·분석가가 노후 단지 분포나 주택 공급 규모를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 아파트명, 행정구역 이름을 맞춰 연결해야 한다.
description_portal: 2025-12-31 기준 경상남도 창원시(5개구) 공동주택 현황 자료(아파트명, 행정구역, 위치, 도로명주소, 동수, 층수, 세대수 등) 입니다.아파트, 연립·다세대주택 등 공동주택 단지의 위치, 세대수, 층수, 건축연도 등 기본 정보를 포함한 자료입니다. 본 데이터는 주거환경 분석, 주택공급 계획, 인프라 정책 수립, 민원 대응, 재난 안전점검 등에 활용될 수 있습니다.공동주택 단지가 수천건 이상일 수 있으므로 엑셀, 메모장 등 일반 뷰어로는 일부 항목만 확인될 수 있으며, R, Python, GIS 등의 분석 전용 도구로 처리·시각화하는 것이 권장됩니다.건축 기준일, 주택 유형 분류, 세대 구성 기준, 관리 주체, 준공연도·리모델링 여부 등 세부 정의는 제공기관의 메타데이터나 기술문서를 참고해 주세요.
