description_portal: '외교사료관 외교사전시실에서 전시, 소장하고 있는 전시품명, 구분, 시대, 내용 등 전시품 목록을 csv파일로 제공 합니다.(2023.5월 기준 데이터 변동내용 없음)제공되는 전시품에 대한 정보는1. 전시품명: 한·아세안 특별정상회의 2. 구분: 기념품 3. 시대: 2009 4. 내용: 2009.6.1-2 한·아세안(ASEAN) 대화관계 수립 20주년을 기념하여 ‘한·아세안 특별정상회의(ASEAN-Republic of Korea Commemorative Summit)’가 제주에서 개최되었다. ‘Partnership for Real, Friendship for Good’라는 주제로 열린 특별 정상회의에서는 우리나라의 이웃국가이자 3대 교역시장인 아세안 국가들과 지난 20년간 꾸준히 발전해온 관계를 한 단계 도약시키는 한편, 경제 뿐 아니라 정치, 문화, 녹색성장 분야까지 협력의 범위를 넓히는 계기가 되었다. 동 회의에서는 양측 간 제반 분야에서의 협력증진 방안을 담은 공동성명을 채택하였으며 우리 정부는 개발협력, 저탄소 녹색성장, 문화·인적교류 등 3개 분야에 대해서 대(對)아세안 정책방향을 담은 별도의 정책문서를 발표하였다.와 같은 형태로 제공되며, 이외에도 269개의 전시품목 정보가 제공됩니다.'
