description_portal: 통일부에서 제공하는 ‘남북회담문서목록’ 데이터는 남북회담의 공식 기록물입니다.제1차~제2차 회담에서는 인도적 문제와 이산가족 상봉 등 적십자회담 중심의 논의가 이뤄졌고, 1972년 7.4 남북공동성명과 직통전화 설치 등 남북조절위원회 활동이 이어졌습니다. 이후 1979~1980년대에는 체육·경제·정치 등 교류의 폭이 넓어지며, 고위급회담, 경제회담, 국회회담, 올림픽 관련 협의, 이산가족 고향방문 등 실질적 교류와 협력이 진행되었습니다. 각 회담의 성립 경위, 주요 의제, 실무·본회담·대표회의 등 세부 진행 과정, 쌍방 반응과 언론 보도, 회담 중단 및 재개 노력까지 상세히 기록되어 있어, 남북관계의 변화와 대화의 흐름, 분단 이후 교류의 역사적 맥락을 종합적으로 파악할 수 있는 자료입니다.
