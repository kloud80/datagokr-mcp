description_portal: 한국국제교류재단은 국제교류사업 및 각종 공식 문서에서 해외 대학 명칭의 일관된 표기를 지원하고 혼동을 방지하기 위해 ‘한국국제교류재단_해외대학 국영문 표준명칭’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 <해외대학 국문명칭 표준화 지침>에 따라 선정된 주요 해외 대학의 국문 및 영문 표준명칭 정보를 수록하고 있으며, 1,392건의 대학명이 CSV, XML, JSON 등 다양한 포맷으로 제공됩니다. 연 1회 정기적으로 갱신되어 최신 정보를 반영하며, 누구나 무료로 다운로드하거나 오픈API를 통해 활용할 수 있습니다. 이 자료는 국제협력 사업 보고서 작성, 학술연구, 데이터베이스 구축, 공식 문서 작성, 번역, 교육자료 개발, 언론 보도, 통계 분석, 정보시스템 연계, 정책자료 작성 등 다양한 분야에서 활용 가능합니다.
