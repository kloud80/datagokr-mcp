summary_user: 방산원가관리체계 인증을 받은 방산업체 목록을 업체 한 곳당 한 행으로 담고, 신규 인증일과 1~5차 갱신일, 현재 유효기간 시작·종료일을 기록한 작은 파일(약 1KB)이다. 포털 설명 기준으로 2026년 5월에 13개 업체가 인증을 받았다. 방산 분석가나 협력업체가 특정 방산업체가 원가관리체계 인증을 언제 받았고 인증이 언제까지 유효한지 확인할 때 쓴다. 전역 조인 키는 없어서 방산업체 지정 현황 같은 다른 방위사업청 데이터와는 업체명을 맞춰서만 이을 수 있다.
description_portal: 방산업체 중 방산원가관리체계 인증을 받은 업체 목록 정보를 제공하고 있으며,순번,업체명,신규 인증일,1차 ~ 5차 갱신일, 유효기간 시작일과 종료일로 구성되어 있습니다.인증회수에 따라 갱신일은 공란이 발생할 수 있습니다. '26년 5월 기준 13개 업체 인증(대한항공, LIG넥스원, 한화시스템, STX엔진, 풍산, S&T모티브, 한국항공우주산업, 한화에어로스페이스, 현대로템, 휴니드테크놀러지스, 퍼스텍, 코리아디펜스인더스트리, 에이치디현대중공업㈜)* 방산원가대상물자의 원가계산에 관한 규칙- “방산원가대상물자”란 방위사업계약의 대상으로서 다음 각 목의 어느 하나에 해당하는 물자 또는 물품 등을 말한다.- “원가”란 방산원가대상물자를 생산하거나 연구하기 위하여 또는 필수정비를 위하여 소비하는 각종 재화와 용역을 화폐가치로 환산한 가액(價額)을 말한다. 다만, 계약목적물의 완성과 관련 없이 소비하는 재화 및 용역과 비정상적인 원인으로 발생하는 경제가치의 감소는 포함하지 아니한다.
