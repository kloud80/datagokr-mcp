summary_user: 방위사업청과 각 군이 발주한 시설공사 공개수의 입찰의 결과를 건별로 담은 파일 데이터로, 2024-11-01~2025-12-31 전국 11,517건이 들어 있다. 건설업체나 분석가가 발주기관별 예산금액·예정가격·낙찰하한율 수준과 입찰결과를 보며 입찰 전략이나 경쟁 양상을 점검하는 질문에 쓴다. 전역 조인 키는 없어 공고번호·발주기관 이름이나 같은 기관 코드로만 다른 국방전자조달 자료(입찰공고·계약정보)와 잇고, 사업자번호 기반 기업 축 연결은 별도 확인이 필요하다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결할 수 있다. 명세상 갱신 주기는 연간이며 실측 최신 행 날짜는 2025-12-31이고, 범위는 2024-11-01~2025-12-31로 한정된다. 나라장터와 별도인 국방전자조달 자료이므로 나라장터 데이터와 합쳐 해석하지 않는다.
