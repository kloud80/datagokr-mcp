description_portal: 'ㅁ 2016년 부터 연도별 양자조약, 다자조약 체결 건 수를 제공하는 통계 데이터입니다.(발효연도 기준)ㅁ 해당 내용은 2024.12월  31일 기준 데이터로, 최신 정보 확인은 외교부 조약정보시스템에서 가능합니다.- 접속 방법 : 외교부 조약정보시스템(https://treatyweb.mofa.go.kr/) 접속 > 조약통계 > 연도별 통계- 조약정보시스템에서는 해당 데이터 외에도 조약 통계, 보도자료, 공지사항 등 조약에 관련된 다양한 정보를 게시합니다.ㅁ (추가 정보) "조약"이라 함은 “단일의 문서 또는 둘 또는 그 이상의 관련 문서에 구현되고 있는가에 관계없이 또한 그 특정의 명칭에 관계없이, 서면 형식으로 국가간에 체결되며, 또한 국제법에 의하여 규율되는 국제적 합의”를 말합니다.(“조약법에 관한 비엔나협약” 제2조 참조)'
