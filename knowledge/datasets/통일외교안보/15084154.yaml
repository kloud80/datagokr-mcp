description_portal: 한국국제협력단(KOICA)이 설립년도부터 최근까지 국내외 다양한 기관과 체결한 양해각서(MOU)의 체결 현황 정보를 제공합니다. 공공 및 민간과의 전략적 파트너십 구축을 통해 KOICA는 MOU를 체결하며, 이는 개발협력 사업의 효과적 추진에 중요한 역할을 합니다. 동 데이터에는 체결된 기관의 명칭, 유형, 체결 부서, 체결일 및 만료일, 갱신 유형, 체결 분야, 주요 내용 등이 포함되어 있습니다. 이를 통해 KOICA의 협력 네트워크를 파악하고, 나아가 대외협력 전략을 분석 및 개발협력 사업의 기획·평가에 활용 할 수 있습니다.
