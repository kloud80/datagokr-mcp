description_portal: 해군사관학교 졸업 통계에 대한 데이터입니다. 연도별로 계열 구분(문과, 이과, 공통 등), 학위(문학사, 이학사, 공학사, 군사학사 등), 인원수 항목을 상세하게 제공하고 있습니다. 인원수에는 수탁생도 포함되어 있으며, 세부적으로 2021년 이학사 2명, 2021년 공학사 1명, 2021년 군사학사 3명, 2020년 이학사 3명, 2020년 군사학사 3명, 2019년 문학사 1명, 2019년 이학사 1명, 2019년 군사학사 2명, 2018년 문학사 2명, 2018년 공학사 2명, 2018년 군사학사 4명, 2017년 문학사 1명, 2017년 공학사 2명, 2017년 군사학사 3명입니다. 해당 데이터를 통해 전공별 인력 구성에 대해 분석할 수 있으며, 해군 인원을 파악하여 추후 인사 배치 및 계획에 기초 자료로써 활용하는 것이 가능합니다.
