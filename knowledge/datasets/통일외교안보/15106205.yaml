description_portal: 통일부에서 제공하는 ‘통일부_유형별 남북교역액 현황’ 데이터는 남북 간 경제교류의 다양한 유형에 따라 연도별 반입 및 반출 교역액을 백만 달러 단위로 집계한 공식 통계입니다. 본 데이터는 2005년부터 2020년까지의 남북교류협력의 경제적 규모를 유형별로 세분화하여, 남북 간 경제교류의 실질적 흐름과 변화를 체계적으로 보여줍니다.데이터는 크게 일반교역 위탁가공, 경제협력, 비상업적 거래로 구분되어 있습니다. 일반교역은  위탁가공은 북한 내에서 가공한 제품을 다시 남한으로 반입하는 형태를 포함합니다. 경제협력은 개성공단, 금강산 관광, 기타 경제협력, 경공업 협력 등 남북 간 협력사업에서 발생하는 교역액을 포함합니다. 비상업적 거래에는 정부 및 민간 지원, 사회문화협력, 경수로 사업 등으로 구분되어 있어, 남북 간 경제교류의 다양한 측면을 포괄적으로 반영합니다.각 항목별로 반입(북한으로부터 남한으로의 수입)과 반출(남한으로부터 북한으로의 수출) 금액이 구분되어 명시되어 있어, 남북 간 경제교류의 구조적 특징과 각 유형별 교역의 비중 변화를 한눈에 파악할 수 있습니다. 이를 통해 남북 간 경제협력이 확대되거나 위축되는 시점, 그리고 각 유형별 교역의 활성화 정도를 연도별로 분석할 수 있습니다.
