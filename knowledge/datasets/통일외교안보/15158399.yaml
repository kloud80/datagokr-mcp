summary_user: KOICA가 수행한 ODA 개발협력사업을 사업 단위로 담아 사업명·사업번호·사업형태·시작·종료년도·코이카지역명·국가명을 조회년도·사업형태·분야·국가 조건으로 돌려주는 API다. 분석가나 개발협력 관계자가 특정 수원국에서 어떤 분야(보건·교육·농업 등)의 사업이 어느 해에 진행됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 KOICA 데이터(발주계획·조달·봉사단 파견 등)와는 국가명·사업명 매핑이나 같은 기관의 국가·분야·사업형태 코드로만 이어 쓴다.
description_portal: KOICA가 수행한 ODA 개발협력사업을 국가별, 분야별로 조회할 수 있는 API입니다. 각 수원국에서 어떤 분야의 개발협력사업이 수행되었는지, 연도별로 어떤 변화가 있었는지를 정량적으로 분석할 수 있도록 구성되어 있습니다. 보건, 교육, 행정, 농업 등 다양한 분야의 사업 유형을 비교하거나 특정 국가에 집중된 지원 성격을 확인하고자 할 때 활용할 수 있습니다. 해당 API는 인증키(serviceKey), 페이지 번호(pageNo), 페이지당 호출건수(numOfRows) 등 기본적인 요청변수를 사용하며 조회년도, 사업형태, 분야코드, 국가코드 등의 필터 파라미터를 추가로 설정할 수 있습니다. 출력결과에는 사업시작년도, 사업종료년도, 사업명, 사업번호, 사업형태, 코이카지역명, 국가명 등의 항목이 포함되며, 각 항목에 대한 데이터는 XML 형식으로 반환됩니다.
team:
  dept: 데이터팀
services:
  - op: /getBsnsInfoRealmList
    name: ODA 분야별 사업목록
    endpoint: https://apis.data.go.kr/B260003/BsnsAddService/getBsnsInfoRealmList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: 한 페이지 결과 수
      - name: P_YEAR
        required: true
        desc: 조회년도
      - name: P_BSNS_TY_CD
        required: true
        desc: 사업의 형태. 문서 15페이지의 사업유형코드 참고
      - name: P_SPORT_REALM_CD
        required: true
        desc: 분야코드. 문서 16페이지의 분야별코드 참고
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
