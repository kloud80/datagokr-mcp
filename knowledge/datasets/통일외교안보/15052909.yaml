description_portal: 한국국제협력단(KOICA)과 관련 기관들이 사용하는 ODA(공적개발원조) 분야 주요 용어를 체계적으로 정리한 용어사전입니다. 여기에는 원조 방식, 협력 유형, 평가 지표, 재정·회계 관련 용어, 거버넌스 및 현장운영 개념 등 다양한 범주의 핵심 용어들이 포함되어 있어, ODA에 익숙하지 않은 사용자도 쉽게 이해할 수 있도록 설명과 예시를 함께 제공합니다. ODA 유관심자, 신규 실문자, 정책 담당자 등 많은 사람들이 ODA 전문용어에 대한 정확한 이해를 할 수 있으며, 문서 작성이나 사례 분석 등 작업 시 개념의 일관성을 유지할 수 있습니다.
