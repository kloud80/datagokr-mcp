summary_user: 외교부 해외안전여행홈페이지(0404.go.kr)에 게시된 해외안전 관련 영상을 한 건씩 담은 목록으로, 영상마다 등록일·제목·내용·영상 링크를 담는다(약 52KB 분량의 CSV 파일). 해외여행을 앞둔 국민이나 안전교육 담당자가 '해외 대마 위험성이나 해적 대응처럼 특정 주제의 외교부 안내 영상이 있는가'를 찾아 내려받는 데 쓴다. 실측 컬럼에 국가코드 같은 전역 조인 키가 없어, 다른 여행경보·안전공지 데이터와는 영상 제목이나 내용 속 국가명·주제어를 맞춰 보는 방식으로만 이어 쓴다.
limits: 영상 안내 목록이므로 국가별 여행경보 단계나 최신 안전공지를 직접 판단하는 데는 쓸 수 없고, 국가·지역 표준코드가 없어 국가 단위 연계가 어렵다. 명세상 갱신은 연간·이벤트 주기라 최근 게시 영상이 바로 반영되지 않을 수 있다.
