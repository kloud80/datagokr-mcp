description_portal: 국제협력정보시스템에서 제공하는 우호도시 현황 정보로 국가/도시명, 협정구분, 분야, 체결연도 등의 정보를 제공합니다. <용어설명)* 우호교류는 자매결연의 전단계로서 향후 교류추진을 예고하는 것으로 볼 수 있으며, 자매결연처럼 의회의 승인을 필요로 하지 않음* 국제 우호교류(國際 友好交流)는 국가와 국가 사이 혹은 지방정부·기관·민간 단체 등이 우호적 관계를 바탕으로 서로 교류하는 활동을 뜻합니다. 보통 정치적·경제적 이해관계만이 아니라, 문화·학술·체육·경제·환경 등 다양한 분야에서 상호 교류와 협력을 통해 친선을 증진하는 것을 의미※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.
