summary_user: 대한민국이 다른 나라와 맺은 양자조약을 조약 한 건당 한 행으로 담은 CSV 파일(약 1.1MB)로, 체결 상대국·분야·국문/영문 조약명·서명일·서명장소·국회동의 여부와 일자·발효일·관보게재일·종료일을 담는다. 특정 국가와 맺은 조약 중 지금 발효 중인 것이 무엇인지, 국회 동의를 거친 조약은 어느 것인지 확인하려는 연구자·기업·실무자가 쓴다. 조약번호(treaty_no)를 키로 다른 조약 목록이나 외교부 조약정보시스템의 상세 정보와 맞춰 볼 때 쓰고, 국가는 국가명 텍스트로만 들어 있어 국가코드 표와 잇는 데는 별도 매핑이 필요하다.
description_portal: 'ㅁ 대한민국 양자조약 목록을  조회가능한 자료입니다. -  국가명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용)를 이용하여 양자조약 목록 조회 - 양자조약 관련 정보를 제공하는 공공데이터ㅁ 해당 내용은 2026.5월 갱신된 데이터로, 최신 정보 확인은 외교부 조약정보시스템에서 가능합니다.   - 접속 방법 : 외교부 조약정보시스템(https://treatyweb.mofa.go.kr/) 접속 > 조약 정보 게시판 에서      체결 국가/국제 기구/ 서명일/ 발효일 / 검색어 등으로 검색 및 저장이 가능합니다.  - 조약정보시스템에서는 해당 데이터 외에도 조약 통계,  보도자료, 공지사항 등 조약에 관련된 다양한 정보를 게시합니다.ㅁ (추가 정보) "조약"이라 함은 “단일의 문서 또는 둘 또는 그 이상의 관련 문서에 구현되고 있는가에 관계없이 또한 그 특정의 명칭에 관계없이, 서면 형식으로 국가간에 체결되며, 또한 국제법에 의하여 규율되는 국제적 합의”를 말합니다.     (“조약법에 관한 비엔나협약” 제2조 참조)'
