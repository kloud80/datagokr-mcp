description_portal: 모집병 지원 시 선택하는 군사특기 관련 정보를 제공하는 서비스입니다.군별(육군, 해군, 공군, 해병대), 모집회차별, 모집분야별(기술행정병, 일반/전문기술병, 전문특기병 등), 군사특기별 신체조건(신장체중, 시력, 최저신체등급 등), 면접 실시여부, 연간 모집여부 등을 확인할 수 있습니다.군사특기별 지원조건 및 신체조건 관련 자세한 사항은 병무청 누리집- 군지원(입영신청)안내- 모집안내서비스- 안내 및 지원절차- 군/모집분야 선택- [모집안내], [군사특기 임무 및 설명] 메뉴 및 모집 공지 등에서 확인할 수 있습니다.
