summary_user: 병무청 모집병의 군사특기별 정보를 군(육·해·공군·해병대), 모집연도·회차, 모집분야(기술행정병·전문특기병 등) 단위로 담으며, 특기 코드·명칭, 접수 기간, 입영 시작·종료 연월, 신체조건 기준값 같은 항목이 들어 있다. 입대를 준비하는 지원자가 '이번 회차에 내가 지원할 수 있는 특기는 무엇이고 접수와 입영은 언제인가'를 확인하거나, 분석가가 군·분야별 특기 모집 구성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 병무청 모집병 계열 데이터(배점·지원가능·접수현황 등)와는 군구분·모집분야·군사특기 코드(gsteukgiCd)나 모집연도·회차를 이름·코드로 맞춰 연결한다.
limits: 다른 기관 데이터와 바로 잇는 공통 키가 없어 병무청 내부 코드나 명칭 매핑으로만 연결된다. 데이터는 모집 공고처럼 이벤트 때 생성된 뒤 바뀌지 않는 형태이므로 회차별로 따로 조회해야 하고, 세부 지원조건은 병무청 누리집 모집 공지를 함께 확인해야 한다. 개발계정 호출 한도는 일 10,000회이다.
