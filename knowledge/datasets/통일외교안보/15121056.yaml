description_portal: 통일부에서 제공하는 ‘통일부_이산가족찾기 등록현황 월별 통계 정보’는 남북 분단으로 인해 흩어진 가족을 찾기 위한 신청자 현황과 가족관계별 등록 현황을 월별로 집계한 공공데이터입니다. 본 데이터는 총 86건의 월별 통계로 구성되어 있으며, 각 통계는 연월, 생존 신청자 평균 나이, 출신지별 생존자 수(황해, 평남, 평북, 함남, 함북, 미수복 경기, 미수복 강원), 성별 및 가족관계별(부모, 형제자매, 3촌 이상 등) 생존자 및 사망자 수, 그리고 총 생존자 수 항목으로 구성되어 있습니다.이 데이터를 통해 이산가족 신청자의 연령 분포, 출신 지역별 등록 현황, 가족관계 및 성별에 따른 변화 추이, 그리고 사망자 통계 등 세부적인 정보를 파악할 수 있습니다. 특히, 이산가족 문제의 현황을 정확히 분석하고, 남북 관계 개선을 위한 정책 수립, 이산가족 관련 연구 등 다양한 목적에 활용할 수 있습니다.
