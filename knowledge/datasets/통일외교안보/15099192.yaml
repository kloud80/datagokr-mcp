summary_user: 재외공관이 주재국 인구통계·동포단체 조사·재외국민등록부 등을 근거로 추산한 국가별 재외동포 수를 담으며, 한 행이 한 국가이고 연도별 값(year_2015~year_2021 열)이 나란히 들어 있는 집계 자료다. 연구자나 동포 정책 담당자가 '어느 나라에 재외동포가 가장 많이 사는가, 최근 몇 년 사이 어떻게 변했는가'를 확인하는 데 쓴다. 실측 컬럼에는 공통 조인 키가 없고 국가명(country_nm)만 있으므로, 출입국·무역·관광 등 다른 국가 단위 데이터와는 국가명을 국가 표준코드로 매핑해 잇는다.
description_portal: '1. 재외동포 현황 목록 조회: 한글 국가명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용)를 이용하여 재외동포 현황 목록 조회 - 재외동포 현황 관련 정보를 제공하는 공공데이터 API 서비스※ 재외동포청 신설로 인해 데이터 소유가 이관되었습니다. 2019년도 이후 자료의 경우 재외동포청에 문의바랍니다.본 자료는 해외에 주재하는 우리나라 재외공관(대사관, 총영사관, 분관 또는 출장소)에서 작성한 공관별 재외동포현황을 취합, 정리(2012.12월 기준)한 것으로서 주재국의 인구 관련 통계자료, 한인회 등 동포단체 조사자료, 재외국민등록부 등 공관 민원 처리기록 직접조사 등을 근거로 산출한 추산치입니다.'
