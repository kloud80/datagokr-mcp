description_portal: 한국국제교류재단은 해외 대학에서 운영 중인 한국학 과정의 확산과 현황을 체계적으로 파악하고, 글로벌 한국학 진흥 정책 수립에 기여하기 위해 ‘한국국제교류재단_해외대학 한국학 과정 운영현황’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 지역, 국가, 대학명, 한국학 제공 형태(학사, 석사, 박사, 교양어학원, 세종학당, 코리아코너) 등 세부 정보를 포함하며, 연 1회 갱신되어 최신 현황을 반영합니다. 총 1,404건의 운영 정보를 CSV, XML, JSON 등 다양한 포맷으로 제공하며, 누구나 무료로 활용할 수 있습니다. 해당 데이터는 해외 대학의 한국학 교육 현황 분석, 국제교류 정책 연구, 학술자료 구축, 교육콘텐츠 개발, 한류 확산 효과 평가, 언론 보도, 글로벌 네트워크 지도 작성, 데이터 기반 시각화, 교육기관 비교, 정책자료 작성 등 다양한 분야에서 활용됩니다. 해당 정보는 재외공관 및 해외 대학 설문결과(2016-17 일제시행)를 바탕으로 작성되었으며, 이후 수시 업데이트 중이나 현재 해외대학 한국학 강좌 운영 현황과는 차이가 있을 수 있습니다.
