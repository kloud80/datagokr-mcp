summary_user: 외교안보연구소가 발간한 자료를 건별로 담으며, 각 건에 일련번호·카테고리명·저자명·제목·요약 내용·발간일자·원문 URL이 들어 있다. 연구자나 학생이 특정 저자나 주제어로 외교안보연구소 보고서를 찾아 요약을 훑고 원문 링크로 이동할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 저자명·제목 같은 이름 매칭이나 같은 기관 코드로만 연결한다.
