summary_user: 국가별 재외동포 인구를 2015·2017·2019·2021년 네 시점의 열로 담은 국가 단위 집계 파일(csv, 약 5KB)이다. 연구자나 동포 정책 담당자가 '특정 국가의 재외동포 수가 몇 년 사이 늘었나 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 ISO 국가코드 같은 공통 조인 키가 없고 한글 국가명만 있으므로, 출입국·무역·관광 등 국적 데이터와 이으려면 국가 표준코드 데이터로 국가명을 코드에 매핑해야 한다.
