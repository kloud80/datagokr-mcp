description_portal: '국가보훈부에서 의료서비스, 진료적정성, 이용자만족도, 예우시책 참여도 등 9개 평가지표를 통해 선정한 "우수 위탁병원" 목록을 제공합니다.ㅇ 제공 항목: 인증 시작일, 인증 만료일, 기수 구분, 지역, 위탁병원명, 종별(의원/병원/종합병원), 진료과수, 병상수, 주소, 전화번호, 위치정보* 위탁병원이란? - 보훈병원(전국 6개소)이 없거나 보훈병원으로부터 원거리에 거주하는 보훈대상자의 근접의료 서비스를 제공하기 위해 전국 각지에 지정하여 운영하고 있습니다.ㅇ 우수위탁병원 인증이 만료되어도 위탁병원 계약은 유지될 수 있으며, 최신 위탁병원 목록은 https://www.mpva.go.kr/mpva/selectBbsNttView.do?key=144 를 참조하시기 바랍니다.'
