description_portal: 통일부에서 제공하는 ‘통일부_북한이탈주민 연도별 정착현황’ 데이터는 2008년부터 2019년까지 북한이탈주민의 생계급여 수급률과 초·중·고등학교 학업 중단율을 연도별로 체계적으로 집계한 통계 자료입니다.이 데이터는 북한이탈주민의 경제적 자립 상태와 교육 환경 변화를 파악하는 데 필수적인 정보를 제공합니다. 특히, 생계급여 수급률은 남한 사회에 정착한 북한이탈주민 가운데 경제적 어려움으로 생계급여를 받는 비율을 나타내며, 이는 탈북민 가구의 경제적 취약성과 복지 지원 필요성에 대한 중요한 지표로 활용됩니다. 한편, 초·중·고등학교 학업 중단율은 북한이탈주민 자녀들의 교육 지속 여부를 반영하며, 이는 남한 교육 체계 내에서의 적응과 정착 과정을 평가하는 데 중요한 의미를 가집니다.연도별로 누적된 데이터는 북한이탈주민의 정착 과정에서 경제적 자립과 교육 환경이 어떻게 변화하고 있는지 추세를 분석할 수 있게 해줍니다. 이를 통해 정부와 지자체는 북한이탈주민의 복지 지원 필요성과 교육 문제를 보다 정밀하게 진단할 수 있으며, 관련 정책 수립과 맞춤형 지원 프로그램 개발에 있어 필수적인 기초자료로 활용됩니다.
