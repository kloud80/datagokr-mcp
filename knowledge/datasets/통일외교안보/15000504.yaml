summary_user: 외교부가 지정한 여행금지 국가의 목록과 국가별 상세 내용을 담은 API로, 국가 단위 집계형 정보이며 전체 20건이다. 해외여행객이나 여행 서비스 사업자가 방문 예정 국가가 허가 없이 갈 수 없는 여행금지 대상인지 확인하는 데 쓴다. 전역 조인 키는 없고, 국가명·ISO 국가코드(isoCode)를 이름·코드 매핑으로 다른 해외안전·여행경보 데이터와 잇거나, 목록 조회 결과의 id로 단일 조회와 이어 쓴다.
description_portal: '[요약 정보]외교부에서 지정하는 여행금지 국가 목록정보 및 상세정보를 조회주의) 여행경보 4단계(흑색경보, 여행금지)에 해당하는 국가로서 허가 없이 방문하면 처벌을 받습니다.[상세 정보]1.여행금지제도 목록 조회 : 한글 국가명 또는 영문 국가명  또는 ISO 국가코드로 여행금지제도 목록 조회2.여행금지제도 단일 조회 : 목록조회 결과의 해당 국가의 id 값을 이용하여 해당국가에 대한 여행금지제도 단일 내용 조회. - 외교부에서 지정하는 여행금지 국가목록정보 및 상세정보를 제공하는 공공데이터 API 서비스'
