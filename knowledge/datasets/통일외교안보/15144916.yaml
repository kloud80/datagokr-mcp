description_portal: '독립기념관에서 1988년부터 독립운동가를 매년 선정하여 공표하는 이달의 인물에 대한 정보이다.최근에는 국가보훈부,광복회, 독립기념관 공동으로 선정하고 있으며, 2025년부터는 이달의 독립운동으로 내용을 변경하여 서비스 중에 있다.자료 대상기간 : 1988-09  ~ 2024-09본 자료는 일제에 맞서 싸운 독립운동가로 한정되며, 2013년 7월부터는 한국의 독립운동에 도움을 준 외국인들도 선정하고 있다. 무장 투쟁이 아니더라도 윤동주, 심훈, 이육사, 한용운, 나운규와 같이 항일 작품을  쓴 예술인들도 독립운동가로서 포함되어 있다.'
