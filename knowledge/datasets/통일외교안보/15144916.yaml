summary_user: 독립기념관이 1988년 9월부터 2024년 9월까지 매달 선정·공표한 '이달의 독립운동가'를 인물(또는 단체) 한 건씩 담은 CSV 파일로, 선정 연월일·이름·사진·내용파일 정보가 들어 있다. 특정 달에 어떤 독립운동가가 선정됐는지, 외국인 조력자나 항일 예술인이 언제 선정됐는지를 찾는 교사·기자·전시 기획자가 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 독립유공자 공훈록이나 국립묘지 안장자 자료와는 인물 이름으로 맞춰 이어 써야 한다.
