summary_user: 외교부 국가별 약황 중 의료환경 정보를 국가 단위로 담은 API로, 국가명(한글·영문)과 ISO 2자리 국가코드, 깨끗한 음용수 사용비율, 인구 10만 명당 결핵 발생률과 각 측정연도, 현재 여행경보를 제공한다. 해외 출장·여행·주재원 파견을 앞둔 사람이나 기업이 "이 나라의 위생·감염병 환경은 어느 수준인가"를 확인하는 데 쓴다. 전역 조인 키는 실측되지 않았으나 ISO 2자리 국가코드(country_iso_alp2)나 국가명으로 외교부의 여행경보·안전공지·입국허가요건 등 다른 국가별 데이터와 맞춰 이어 쓴다.
description_portal: '[요약 정보] 국가·지역별 의료환경 목록 조회: 한글 국가명 또는 ISO국가코드를 이용하여 국가·지역별 의료환경 목록 조회  - 국가·지역별 의료환경 관련 정보를 제공하는 공공데이터 API 서비스[상세 정보]외교부 홈페이지에 공개 중인 각 국가별 약황 정보 중 의료 환경에 대한 정보를 제공합니다. 데이터 항목에는 한글 국가명, 영문 국가명, 국가코드(ISO 2자리), 깨끗한 음용수 사용비율 측정연도, 깨끗한 음용수 사용비율, 깨끗한 음용수 사용비율, 깨끗한 음용수 사용비율 측정연도 등에 대한 데이터를 포함하고 있습니다.  해당 데이터는 기업과 연구기관이 활용할 수 있는 실질적인 정보입니다.'
