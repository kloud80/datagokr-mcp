        example: '10'
        desc: 한 페이지 결과 수
      - name: cl
        required: false
        example: ARGUMENT_DAIL
        desc: 동향 기간 분류
      - name: bgng_ymd
        required: false
        example: '20201215'
        desc: 시작일자
      - name: end_ymd
        required: false
        example: '20251231'
        desc: 종료일자
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
