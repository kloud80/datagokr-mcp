summary_user: KOICA에 개발협력 사업을 요청한 사업별로 사업번호·사업명, 대상 국가, 요청한 수원국 기관과 시행기관의 한글·영문명을 한 줄씩 담은 건별 원천 파일(CSV, 약 33만 바이트)이다. 분석가나 개발협력 관계자가 '특정 국가에서 어떤 기관이 어떤 사업을 KOICA에 요청했고 누가 시행하는가'를 확인하는 데 쓴다. 사업번호(koica_project_no)로 KOICA ODA 사업·조달 데이터와, 국가코드(country_cd)로 국가 표준코드·재외공관·여행경보 데이터와 이어 쓴다.
description_portal: 사업요청 수원국 정보는 한국국제협력단(KOICA)에 개발협력 사업을 요청한 국가별 기관과 제안 현황을 관리하는 데이터입니다. 주요 제공항목은 사업번호, 사업명, 국가코드, 국가명, 수원국 기관의 영문명과 한글명, 시행기관의 영문명과 한글명 등이며, 동 데이터를 통해 사업요청 수업국 주체와 제안 내역을 체계적으로 관리할 수 있고 사업 추진 과정에서 국가별 수요를 반영한 맞춤형 협력 전략 수립이 가능합니다. 또한, 데이터의 정합성과 이력 관리가 확보되어 투명한 사업 운영과 협력국 신뢰 제고에 기여할 수 있습니다.
