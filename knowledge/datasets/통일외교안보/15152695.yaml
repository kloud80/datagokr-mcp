description_portal: 중남미 건축 진행사업 목록은 한국국제협력단(KOICA)가 중남미 지역에서 추진하는 개발협력사업 중 건축이 포함된 사업의 현황 정보를 제공하는 데이터 입니다. 주요 제공항목에는 사업국가, 프로젝트명, 총사업비(만불), 진행단계, 건축사업비(만불) 등이 포함되어 있으며, 각 사업의 추진 현황과 건축 예산 규모를 한눈에 파악할 수 있고 중남미지역 협력국별 건축사업의 관리 및 모니터링에 활용될 수 있습니다. 동 데이터는 개발협력사업의 투명성과 효율성을 높이고, 성과 관리와 평가에 중요한 기초 자료가 될 수 있으며, 향후 신규 건축사업의 기획 및 예산 편성에도 참고할 수 있습니다.
