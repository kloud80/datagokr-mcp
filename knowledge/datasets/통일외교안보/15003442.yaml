summary_user: 한국국제교류재단이 미국을 제외한 해외 연구기관·대학 부설 연구소에 지원한 정책연구 사업을 사업 단위로 담은 파일(CSV 약 55KB)로, 사업연도·국가·연구기관명·사업명을 기록한다. 연구자나 언론이 '어느 나라의 어떤 연구기관이 몇 년도에 재단 지원으로 한국 관련 정책연구를 했는가'를 확인하거나 국가별·연도별 지원 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 외교·ODA 데이터와는 국가명이나 연구기관명을 이름으로 맞춰 연결해야 한다.
description_portal: 한국국제교류재단은 국제사회에서 한국 관련 주요 현안에 대한 연구를 촉진하고, 외교·안보·정치·경제·사회 등 다양한 분야에서 정책 제언을 활성화하기 위해 ‘한국국제교류재단_해외정책연구지원 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 미국을 제외한 해외 연구기관 및 대학 부설 연구소가 수행한 정책연구지원 사업의 연도, 국가, 연구기관명, 사업명 등 상세 정보를 담고 있으며, 연 1회 갱신되어 최신 연구 동향을 반영합니다. 자료는 CSV, XML, JSON 등 다양한 포맷으로 제공되어 누구나 자유롭게 활용할 수 있습니다. 해외 정책연구 현황 분석, 국제 협력 네트워크 구축, 외교정책 수립, 글로벌 이슈 대응 전략 연구, 학술자료 구축, 정책자료 작성, 언론 보도, 연구기관 비교, 데이터 기반 시각화, 교육 콘텐츠 개발 등 다양한 분야에서 활용이 가능합니다
