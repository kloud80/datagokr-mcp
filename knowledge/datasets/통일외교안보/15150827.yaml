description_portal: 해당 데이터는 판문점견학시스템에서 수집된 판문점 견학 프로그램 관련 설문조사 정보 입니다. 데이터는 설문지정보, 설문항목정보, 설문문항정보의 csv파일들을 하나의 zip파일로 제공하고 있습니다.설문지정보 데이터는  설문 제목, 설문 목적, 설문 작성 안내 내용, 설문 시작 일자, 설문 종료 일자, 최초 생성 일시, 최종 수정 일시로 구성됩니다.설문문항 데이터는 설문 제목, 질문 번호, 질문 유형 코드, 설문 내용, 최대 선택 개수, 질문 내용 유형, 문항 최초 생성 일시, 문항 최종 수정 일시로 구성됩니다.설문항목정보 데이터는 설문 제목, 질문 번호, 질문 항목 순번, 항목 내용, 기타 답변 여부, 최초 생성 일시, 최종 수정 일시로 구성됩니다.각 파일들에 포함된 설문 정보들을 조합하여 활용할 수 있습니다. (설문지 > 설문문항 > 설문 항목 순)판문점 견학에 대한 이용자들의 생각을 참고하기 위한 설문내용을 활용하여 향후 통일 관련 프로그램, 교육 등 기획에 활용될 수 있습니다.
