summary_user: 병무청 누리집의 우선소집원·선복무·재학생입영원 접수 화면에서 보여 주던 입영년도·분기·시군구별 공석인원수를 담은 집계형 API로, 전국 27,029건이 들어 있다. 입영 희망자나 병무 분석가가 특정 연도·분기에 어느 시군구에 공석이 얼마나 있었는지 확인하는 데 쓴다. 법정동 시군구 주소코드(bjdsggjusoCd)가 시군구 코드(sgg_cd)로 실측 확인되어 지역별 인구·행정 통계 등 시군구 단위 데이터와 이어 쓴다.
description_portal: 병무청 누리집(홈페이지)을 통해 우선소집원, 선복무, 재학생입영원 접수 시 확인할 수 있는 정보에 대한 데이터입니다. 소집년도, 소집분기, 시군구, 공석인원수 데이터를 제공합니다. 현재는 병무청 누리집(홈페이지)을 통한 우선소집원, 선복무 신청을 접수하지 않아, 우선소집원 데이터는 2007년부터 2018년까지의 데이터, 선복무 데이터는 2014년부터 2019년까지의 데이터인 점 참고하여 주시기 바랍니다.  아울러 재학생입영원 데이터의 경우 재학생 입영(소집)등 신청(수시) 화면에서 제공하는 데이터입니다.
