description_portal: 한국국제교류재단은 해외 대학에서 이루어진 한국 관련 출판 현황을 체계적으로 파악하고, 글로벌 한국학 연구의 확산을 지원하기 위해 ‘한국국제교류재단_해외대학 한국관련 출판 실적’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 2017~2018년 기간 동안 해외 각 대학에서 발간된 한국 관련 출판물에 대한 조사 결과로, 조사연도, 대학명, 출판형태, 출판물명 등 주요 정보를 포함하고 있습니다. 총 574건의 출판 실적이 수록되어 있으며, CSV, XML, JSON 등 다양한 포맷으로 제공되어 누구나 자유롭게 활용할 수 있습니다. 해당 데이터는 해외 한국학 출판 동향 분석, 연구기관의 학술자료 구축, 정책 입안자의 국제교류 전략 수립, 교육콘텐츠 개발, 언론의 한류 확산 보도, 출판시장 조사, 대학별 연구 성과 비교, 데이터 기반 시각화 자료 제작 등 다양한 분야에서 활용될 수 있습니다"해외대학 한국관련 출판 실적" 사업은 현재 종료된 사업으로, 향후 업데이트 계획이 없는 1회성 데이터입니다.
