summary_user: 연도별로 여권 발급 건수를 외교관여권, 관용여권, 거주여권, 일반여권(남성·여성), 재외공관 발급과 총합으로 나눠 담은 전국 단위 집계 데이터이다. 분석가나 정책 담당자가 "해마다 일반여권 발급이 남녀별로 얼마나 늘거나 줄었는가", "재외공관에서 발급한 여권 비중은 얼마인가" 같은 질문에 쓴다. 전역 조인 키가 없어 연도(year)를 기준으로 출입국·관광 통계 같은 다른 연도별 집계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
limits: 지역·국가 단위로 나뉘지 않은 전국 연도별 집계여서 지역별·개인별 발급 분석에는 쓸 수 없다. 공통 코드 키가 없어 다른 데이터와는 연도나 이름 매핑으로만 연결된다.
