summary_user: 방산업체를 기업규모와 원가 구분(제조/정비)으로 나누어 1~4그룹별 방산노임단가(원)를 담은 집계 파일로, 전국 단위이며 내려받은 CSV는 397바이트의 작은 표입니다. 방산 원가 분석가나 방산업체 실무자가 '우리 회사 규모와 같은 그룹의 제조 노임단가는 통계상 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 방산 데이터와는 기업규모·그룹 이름을 맞춰 붙이거나 같은 기관(방위사업청) 자료끼리만 연결한다.
description_portal: '주요 방산업체 그룹 및 일반 방산업체로 구분하여 생산물자분야별 , 제조/정비별, 방산노임단가(단위 원) 정보를 제공합니다.방산노임단가의 값이 없는 항목은 해당그룹에  해당하는 기업규모의 기업이 없는 경우 발생합니다.예시) 1그룹 제조 중소기업출처 : 한국방위산업협회 근거 : 방산노임단가는 국가통계(승인번호 제409001호) 『방산노임단가 조사』의 조사기준에 따라 기업규모 및 방산매출액을 고려하여 산정된 그룹별 노임단가입니다.공개되는 "그룹별 노임단가 및 퇴직급여율은 통계결과 사항으로 방산원가에 적용되는 것이 아니며, 방산원가 산정 시에는 『방산원가 규칙』 제2조(정의) 19호에 따라 업체별(공장별) 노임단가가 적용될 예정입니다.'
