summary_user: 국가보훈부 현충시설정보시스템에 등록된 국내 현충시설을 시설 한 곳당 한 행으로 담은 건별 목록이며, 전국 2,362건을 호국·독립 구분, 명칭, 지정일자, 시설종류, 소유자·관리자, 관할 관서와 함께 싣는다. 국민이나 분석가가 우리 지역에 지정된 현충시설이 어디에 어떤 종류로 있는지 찾는 질문에 쓴다. 주소·상세주소(address)를 키로 다른 지리·행정 데이터와 이어 쓰며, 현충시설·보훈단체 좌표 원장 성격이라 보훈병원 등 의료기관 자료와도 맥락상 연결한다.
description_portal: 국가보훈부에서 제공하는 현충시설정보시스템에 등록된 국내 현충시설 정보를 제공합니다.해당 데이터는 OPEN API로도 제공하고 있으니 참고하시기 바랍니다.https://www.data.go.kr/data/15056800/openapi.doㅇ 제공항목  - 연번,구분(호국, 독립),명칭,관리번호,지정일자,사건연도,주제분류,주소,상세주소,시설종류,시설 소유자,시설 관리자,건립연도,관할 관서ㅇ 데이터 변경사항 - "26년 7월부터 기존 사건연도, 건립연도 컬럼은 삭제(데이터 오류 및 공란 등의 사유로 미제공) - "25년 4월부터 기존 건립시기 정보를 건립연도로 변경하여 제공합니다.
