description_portal: '전문연구요원 배정인원 및 편입인원에 대한 현황 자료입니다.1. 전문연구요원제도는 병역자원 일부를 군 필요인원 충원에 지장이 없는 범위내에서 국가산업의 육성·발전과 경쟁력 제고를 위하여 병무청장이 선정한 병역지정업체(연구기관)에서 과학기술 연구·학문분야 종사 하도록 지원하는 제도입니다.2. 복무기간: 36개월입니다. 3. 배정절차는 아래와 같습니다. -  병무청장이 인원배정 기준 고시(5월) - 병역지정업체의 장은 다음해 필요인원을 산출하여 추천권자에게 제출(6월) - 추천권자는 병역지정업체별 추천등급을 부여한 추천명부를 병무청장에게 제출(7월) - 병무청장은 지방병무청장의 복무관리 평가결과와 추천권자의 평가를 고려하여 배정(12월) - 인원배정 결과 인터넷 게재(병무청 홈페이지 공지사항, 병역일터 공지사항에 공개)4. 편입절차는 아래와 같습니다. - 의무자와 병역지정업체의 장의 근로계약에 따라 채용 결정 - 병역지정업체의 장은 의무자로부터 편입신청서를 받은 후 7일 이내 또는 입영(소집)기일 5일전까지 관할지방병무청장에게 제출 - 관할지방병무청장은 편입신청서 검토 후 편입결과 통보'
