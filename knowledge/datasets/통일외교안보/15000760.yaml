summary_user: 외교부 재외공관이 올리는 국가·지역별 안전공지(테러 위협, 항공노선 운항, 감염병 주의 등)를 공지 한 건 단위로 담으며, 건마다 국가명(한글·영문), 제목, 본문, 첨부파일 주소, 작성일(wrtDt)이 있다. 해외여행객이나 여행업 사업자가 '지금 가려는 나라에 최근 어떤 안전공지가 나왔나'를 확인하는 데 쓰고, 제목·내용으로 목록을 검색한 뒤 공지 id로 단건 본문을 조회한다. 실측 컬럼에 국가 표준코드 같은 전역 조인 키가 없어, 여행경보·입국요건 등 다른 외교부 해외안전 데이터와는 국가명(countryName)이나 영문 국가명을 이름 매핑해 잇는다.
description_portal: '[요약 정보] 각 공관에서 실시간 업데이트 되는 국가별 최신 안전정보 제공국가 지역별 안전정보를 제공하는 공공데이터 API 서비스 [데이터 예시]케냐, 테러 위협에 대한 안전공지러시아 한-러시아 지방 항공노선 일시 운항말레이시아 뎅기열 감염 주의 관련 안전공지[상세 정보]1. 국가 지역별 안전정보 목록 조회 : 제목 또는 내용을 이용하여 국가 지역별 안전정보 목록을 조회2. 국가 지역별 안전정보 단일 조회 : 목록 조회 겨과의 해당 국가의 id 값을 이용하여 해당 국가에 대한 국가 지역별 안전정보 단일 내용 조회'
