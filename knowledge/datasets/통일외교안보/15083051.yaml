description_portal: 2015년도 4월부터 2026년도 3월까지 PX(군마트)에서 판매한 월별 인기상품 정보들을 제공하고 있습니다.데이터는 행번호, 판매년도, 판매월, 선정기준(수량/금액), 상품명으로 구성되어 있습니다.데이터는 판매년도, 판매월, 선정기준(수량/금액), 상품명으로 구성되어 있으며, 주로 주류, 라면·탄산음료 등 식음료, 영양제, 화장품 등이 인기상품으로 확인됩니다.본 데이터는 10년간의 장기 데이터로 계절별·연도별 소비 트렌드 변화 추적이 가능하며, 카테고리별 대표 상품을 통해 군 장병의 선호도 파악이 가능합니다.예산 효율화를 위한 인기 상품 기반 재고 관리 및 군 복지 정책 개선을 위한 소비자 수요 분석 등의 분야에 활동 가능합니다.
