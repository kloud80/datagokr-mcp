description_portal: '한국국제협력단(KOICA)의 다자협력전문가(KMCO; KOICA Multilateral Cooperation Officer) 수요목록정보 입니다. KMCO는 국제기구에 한국인 인력을 파견하여 국제기구 진출을 지원하고 글로벌 인재를 양성하는 제도로, KOICA는 한국인의 국제기구 진출지원, 국제기구협력사업 모니터링 및 평가 강화 등을 목적으로 2013년부터 8개 국제기구(UNDP, UNICEF, UNESCO, UNOPS, UNHCR, UNFPA, WFP, GGGI)에 파견사업을 시행해오고 있습니다. 국제기구가 제출한 각 수요에는 파견 대상 국가, 국제기구, 단원 형태, 직종, 성별, 직급, 주요 업무 등이 포함되어 있으며, 수요 등록 시점과 수요 상태(대기·진행·완료)*도 확인할 수 있습니다.*수요상태- 대기: 수요 취합 후 등록된 수요(모집선발 전)- 진행: 수요 취합 후 모집 선발 전형 진행중인 수요- 완료: 수요 취합 및 모집 선발 전형 완료 후 최종 선발된 수요'
