summary_user: 전국 시군구별로 국가보훈대상자 본인과 선순위 유족 1명의 인원을 대상구분(상·하), 본인·유족 구분, 성별, 1세 단위 연령(0세~100세 이상)으로 나눈 집계표다. 지자체 보훈 담당자나 분석가가 "우리 시군구에 사는 70세 이상 보훈대상자 본인은 몇 명인가"처럼 지역별 고령 보훈대상자 규모를 파악해 복지·의료 수요를 가늠하는 데 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 지역 통계와는 시도·시군구 이름을 코드로 매핑해 이어 써야 한다.
description_portal: '개별 법률에 따라 국가보훈부에 등록하신 국가보훈대상자 본인과 선순위자인 유족 1명의 2021년말 기준 인원 현황을  지역과 성별, 연령(1세 단위)으로 나누어 제공합니다.ㅇ 제공항목- 시도, 시군구, 순서, 대상구분 상, 대상구분 하, 본인유족구분, 성별, 연령별 인원(0세~100세, 100세 이상)※ 주의사항 필독 ※- 유족이 모두 사망하였거나 국적을 상실한 분, 상이등급을 받지 못한 분, 선순위자가 아닌 유(가)족 등은 포함되어 있지 않습니다.- "해당없음"은 실종이나 무연고 등으로 연령정보가 확인되지 않는 경우를 말합니다.- 대상별 중복 인원이 포함되어 있어 대상별 합계는 실제 인원보다 많습니다.- 고엽제후유증(환자) 인원은 대상구분을 위해 표시하였으나 전원 "전몰·전상·순직·공상군경" 인원에 포함되므로 국가보훈부에서 공표하는 전체 인원 합계에 포함되지 않습니다(지역 합계 계산 시 제외 필요)ㅇ 데이터 변경사항 - "25.8월 : 대상구분 명칭 기술방법을 일부 수정하고 열제목에 합계 인원을 추가하였습니다.'
