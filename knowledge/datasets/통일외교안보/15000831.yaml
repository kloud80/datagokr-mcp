summary_user: 외교부가 국가 소속 대륙을 구분하는 대륙 구분코드와 대륙명을 담은 코드표로, 포털 설명상 4건 규모의 작은 마스터 목록이다. 외교·출입국·관광 데이터를 다루는 분석가가 '이 국가 데이터의 대륙 코드는 어느 대륙을 뜻하는가'를 풀어 대륙별로 묶어 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 같은 외교부 국가 표준코드 데이터의 대륙 코드(code)나 대륙명 문자열 매핑으로만 다른 데이터와 잇는다.
limits: 대륙 코드와 대륙명만 담겨 개별 국가 목록이나 국가 기본정보는 이 데이터만으로 얻지 못한다. 공통 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑을 직접 만들어야 하며, 지리 좌표가 없는 비공간 데이터다.
