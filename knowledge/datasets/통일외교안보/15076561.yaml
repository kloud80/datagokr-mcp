description_portal: 한국국제협력단(KOICA) 해외봉사단이 파견된 개발도상국 국가에 대해 인식한 안전수준을 자가안전체감도 정보로 제공합니다. 각 국가별로 1(위험)부터 5(안전)까지 5단계로 구분된 안전수준이 연도별 평균치로 산정되어 포함되어있고, 나아가 과거 대비 안전상황 변화수준도 제공됩니다. 이를 통해 현지에서 주의해야 할 사항들을 미리 파악하여 안전사고를 예방하는데 활용할 수 있으며, 나아가 봉사단원 파견전략 수립 및 개발협력사업의 안전 추이 파악과 위험성 관리에도 활용될 수 있습니다.
