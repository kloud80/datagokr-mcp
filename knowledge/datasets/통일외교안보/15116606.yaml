description_portal: '중앙보훈병원의 퇴원 환자의 퇴원 결과에 대한 자료입니다.중앙보훈병원에서 개방하는 월별 진료과별 퇴원환자의 퇴원결과 현황데이터로 월, 진료과, 퇴원결과 건수를 포함한 데이터를 제공합니다.진료과는 환자가 진료를 본 과를 의미합니다. 월별은 1달을 기준으로 하여 해당 월의 1일부터 해당 월의 말일날까지를 의미합니다.각 월에 해당하는 중앙보훈병원의 각 진료과의 퇴원 환자의 퇴원 결과 데이터를 자료로 산출하였습니다.보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
