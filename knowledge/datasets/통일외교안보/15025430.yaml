summary_user: 외교부가 단기적 위험 상황에 발령하는 특별여행주의보·특별여행경보 대상국가 목록을 국가 단위로 담은 API로, 국가별 발령 여부(전체·일부 지역)와 내용, 여행위험지도 경로, 등록일을 제공한다. 해외여행 예정자나 여행사가 '지금 가려는 나라에 특별여행주의보가 발령돼 있어 여행을 취소·연기해야 하는지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나 ISO코드(iso_code)와 국가명이 있어, 같은 외교부의 일반 여행경보·안전공지·입국허가요건 데이터와 국가 표준코드나 국가명으로 맞춰 이어 쓴다.
description_portal: 외교부 해외안전여행(https://www.0404.go.kr/)의 여행경보제도를 API로 서비스합니다.외교부에서 지정하는 여행 유의, 자제, 제한 등 해외 여행경보 대상국가 목록 및 상세정보를 조회할 수 있다. 특별여행경보 제도는 단기적인 위험 상황이 발생하는 경우에 발령하고 있습니다.ㅁ 특별여행주의보 발령에 따른 행동요령은 여행경보 2단계 이상 3단계 이하에 준합니다.  예) (여행예정자) 여행 취소·연기, (체류자) 신변안전 특별유의ㅁ 특별여행주의보 발령 기간은 90일을 넘지 않습니다.(통상 1개월 단위로 발령)ㅁ (발령기준) 단기적인 위험 상황이 발생하는 경우
team:
  dept: 정보화담당관실
services:
  - op: /getTravelSpecialWarningListV3
    name: 특별여행경보제도 목록조회
    endpoint: https://apis.data.go.kr/1262000/TravelSpecialWarningServiceV3/getTravelSpecialWarningListV3
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: cond[country_name::EQ]
        required: false
        desc: 한글 국가명(ISO국가코드와 중복조회 할 수 없음)
      - name: cond[country_en_name::EQ]
        required: false
        desc: 영문 국가명(ISO국가코드와 중복조회 할 수 없음)
      - name: cond[iso_code::EQ]
        required: false
        desc: ISO 국가코드
      - name: returnType
        required: false
        example: JSON
        desc: 응답 데이터포맷 설정(JSON 또는 XML)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
