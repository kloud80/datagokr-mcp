summary_user: KOICA 공식 유튜브 채널에 올라온 영상 한 편당 한 행으로 채널명·제목·설명·업로드 날짜·교육콘텐츠 여부·영상 링크를 담은 목록 파일(csv, 약 8.7KB)이다. 국제개발협력 강의나 홍보 자료를 만드는 사람이 'KOICA 사업 현장을 보여주는 교육용 영상은 무엇이 있나'를 찾을 때 쓴다. 전역 조인 키가 없어 KOICA 사업정보·국가별 협력사업 데이터와는 영상 제목·설명 속 사업명이나 국가명을 직접 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 한국국제협력단(KOICA) 공식 유튜브 채널에 등록된 영상 콘텐츠의 메타정보를 정리한 목록입니다. 영상 제목, 업로드 날짜, 영상 내용 개요, 채널 명칭, 교육용 콘텐츠 포함 여부 및 해당 영상의 외부 링크 등을 포함하고 있습니다. 동 데이터를 통해 KOICA가 진행하는 다양한 개발협력 사업의 현장 사례뿐 아니라 다양한 기술지원, 연구, 정책 수립 등에 대한 내용을 한눈에 확인할 수 있어, 국제개발협력에 관심있는 모든 국민들에게 유용한 정보 자원이 됩니다. 영상정보를 기반으로 개발협력 강의자료 제작, 프로젝트 홍보, 개발협력 분야 커뮤니케이션 전략 수립 등에 다양하게 활용할 수 있으며, 분기마다 업데이트되어 최신 콘텐츠를 언제든지 확인 가능합니다. 자세한 사항은 “KOICA” 유튜브 채널에서 직접 시청할 수 있습니다.
