description_portal: 해당 자료는 남북기본합의서와 한반도 비핵화에 관한 공동선언 채택을 위한 구체적인 외교교섭 경위에 관한 당시 정책결정자 및 외무당국자들의 심도 있는 질의와 답변 내용을 수록하였다. 정세현, 송한호, 박용옥, 백주현, 유명환, 이동복, 임동원 등 당시 정책결정자와 외무당국자의 구술을 통해 협상 배경과 쟁점, 한계와 의의를 조명하며 남북 화해·협력과 비핵화 노력의 전환점을 기록하였다. 이 자료는 남북관계와 한국 외교의 연구자, 관련 사안을 접하는 현직 외교관 등에게 중요한 참고 자료로 활용 가치가 크다.
