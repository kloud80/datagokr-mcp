description_portal: '통일부에서 제공하는 ‘통일부_개성공단 입주기업 수(월별)’ 데이터는 월별(1월~12월), 그리고 각 연도(2013년, 2014년, 2015년)별로 개성공단에 실제로 입주한 기업 수를 집계한 공공데이터로, 남북경제협력의 구체적 현황을 한눈에 파악할 수 있도록 구성되어 있습니다.이 데이터를 통해 개성공단 내 입주기업 수의 월별 증감 추이와 연도별 변동 현황을 객관적으로 분석할 수 있습니다. 또한, 연속적으로 제공되는 월별 데이터를 활용하면 특정 시기(예: 계절적 요인, 남북관계 변화 등)에 따른 입주기업 수의 변화와 그 배경에 대한 심층적 연구가 가능합니다.또한, 남북 경제협력 동향 연구, 관련 정책 수립, 산업 현황 파악 등 다양한 분야에서 실무적·연구적으로 활용될 수 있습니다.'
