summary_user: 병무청이 안내하는 청소년상담복지센터·청소년쉼터·중앙행정기관 등 정신건강·청소년 관련 상담지원기관을 기관 한 곳당 한 행으로 담은 전국 단위 목록 파일(CSV 약 55KB)로, 지원기관 구분·기관명·우편번호·주소를 담는다. 심리상담이 필요한 사회복무요원이나 병역의무자, 또는 이를 돕는 담당자가 '우리 지역에서 상담받을 수 있는 기관은 어디인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소·시군구 주소코드(SGGJUSO_CD)를 맞춰 붙여야 하며, 지역별 시설·인구 데이터와 주소 기준으로 이어 쓴다.
description_portal: 청소년상담복지센터 청소년쉼터 중앙행정기관 등 정신건강 및 청소년관련 상담기관 목록 안내을 위한 상담지원기관 목록 입니다.병무청은 2019년부터 국방부·보건복지부·여성가족부와 협업해 심리취약 및 정신질환이 의심되는 병역의무자에 대한 심리상담서비스를 제공하고 있다. 특히 사회복무요원으로 복무 중 심리적 부적응자와 입영 후 군복무부적합으로 판정받은 사회복무요원 대상자들에게 심리상담서비스를 제공해 복무기관 적응을 지원하고 있다. 최근 5년간 총 2647명에게 정신건강 상담치유서비스를 제공했다.그러나 서비스 제공방식이 지방자치단체를 경유하기 때문에 신속성에 한계가 있었다. 신청자가 개인정보이용동의서를 제출해도 결과를 부처 간 공유하는 데 어려움이 있었다.이를 해결하기 위해 2023년 유관기관과 병무청 간 정보공유체계 고도화 사업을 추진했다. 지난 해 8월부터는 병무청과 여성가족부 간 직접 상담서비스 의뢰가 가능해졌다. 또 쌍방향 정보공유로 상담결과를 바로 확인할 수 있어 사회복무요원 복무관리 등에 활용하고 있다.
