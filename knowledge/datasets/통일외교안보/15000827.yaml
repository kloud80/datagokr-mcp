summary_user: 외교부 해외안전여행의 여행경보를 국가별 한 행으로 담은 API로, 국가명·영문명·ISO 국가코드·대륙과 함께 여행유의·여행자제·철수권고·여행금지 단계별 지정 여부, 일부 지역 지정 여부, 내용 설명, 국기·여행위험지도 이미지 경로, 등록일을 제공한다. 해외여행객이나 여행·출장 담당자가 '이 나라(또는 그 일부 지역)에 지금 몇 단계 경보가 걸려 있는가'를 출국 전에 확인하는 데 쓴다. 공식 전역 조인 키는 실측에서 확인되지 않았으므로, ISO 국가코드(iso_code)나 국가명을 매핑해 같은 외교부의 국가별 안전공지·입국허가요건·재외공관 정보 등과 이어 쓴다.
description_portal: 여행경보제도는 특정 국가(지역) 여행·체류시 특별한 주의가 요구되는 국가 및 지역에 경보를 지정하여 위험수준과 이에 따른 안전대책(행동지침)의 기준을 안내하는 제도입니다. 우리국민의 안전에 대한 위험(위협)을 중요한 기준으로 해당 국가(지역)의 치안정세와 기타 위험요인을 종합적으로 판단하여 안전대책의 기준을 판단할 수 있도록 중·장기적 관점에서 여행경보를 지정·공지하고 있습니다.외교부 해외안전여행(https://www.0404.go.kr/)의 여행경보제도를 서비스하며, 발령 대상 국가(지역)의 위험 수준에 따라 1~4단계(여행유의, 여행자제, 출국권고, 여행금지)로 구분됩니다.
team:
  dept: 정보화담당관실
services:
  - op: /getTravelWarningListV3
    name: 여행경보제도 목록조회
    endpoint: https://apis.data.go.kr/1262000/TravelWarningServiceV3/getTravelWarningListV3
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: cond[country_name::EQ]
        required: false
        desc: 한글 국가명(ISO국가코드와 중복조회 할 수 없음)
      - name: cond[country_en_name::EQ]
        required: false
        desc: 영문 국가명(ISO국가코드와 중복조회 할 수 없음)
      - name: cond[iso_code::EQ]
        required: false
        desc: ISO 국가코드
      - name: returnType
        required: false
        example: JSON
        desc: 응답 데이터포맷 설정(JSON 또는 XML)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
