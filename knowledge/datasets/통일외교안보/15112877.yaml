description_portal: 한국국제교류재단은 한국문화의 세계적 확산과 현지인 대상 문화예술 향유 기회 확대를 위해 ‘한국국제교류재단_해외공연지원 사업실적’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 재단이 지원한 해외 공연사업의 연도별, 지역별, 국가별 실적 통계를 포함하며, 약 150건의 사업 정보를 CSV, XML, JSON 등 다양한 포맷으로 제공합니다. 누구나 무료로 다운로드하거나 오픈API를 통해 활용할 수 있으며, 해외 공연 지원 현황 분석, 국제교류 정책 연구, 문화예술단체의 해외 진출 전략 수립, 한류 확산 효과 평가, 언론 보도, 학술연구, 글로벌 협력사업 기획, 문화콘텐츠 개발, 공연시장 동향 파악, 데이터 기반 시각화 등 다양한 분야에서 활용됩니다."해외공연지원 사업실적" 사업은 현재 종료된 사업으로, 향후 업데이트 계획이 없는 1회성 데이터입니다.
