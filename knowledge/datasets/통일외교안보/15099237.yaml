summary_user: 외교부가 관리하는 다자조약을 조약 한 건당 한 행으로 담은 목록 파일(CSV, 약 227KB)로, 분야·국문/영문 조약명·채택일과 장소·기탁처·원조약 발효일·서명일·국회동의 여부와 일자·우리나라 발효일·조약번호·관보게재일·종료일을 담는다. 연구자나 실무자가 "우리나라가 특정 분야의 어떤 다자조약에 언제 서명하고 발효시켰는지, 국회 동의를 거쳤는지"를 확인하는 데 쓴다. 조약번호(treaty_no)를 키로 외교부 양자조약 목록이나 조약 본문·관보 자료와 이어 쓴다.
