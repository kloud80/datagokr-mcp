description_portal: 한국국제협력단(KOICA)이 추진하는 포용적 비즈니스 프로그램(IBS/ Inclusive Business Solution)은 개발도상국 저소득층이 당면한 사회개발 문제를 해결하는 동시에 이들에게 고용과 비즈니스 기회를 제공하며, 우리 기업의 비즈니스 니즈 충족이라는 공통의 목표를 위한 전략적 파트너십 기반 사업입니다. 해당 데이터는 연도, 대상 지역 및 국가, 수행 기관, 예산 규모, 사업 단계 등의 정보를 제공합니다. 이를 통해 KOICA 민관협력 및 IBS 사업에 대한 현황을 분석하고, 그에 기반한 연구, 평가, 전략적 의사 결정 등에 활용할 수 있습니다.
