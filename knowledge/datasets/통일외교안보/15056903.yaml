summary_user: 유엔 청년봉사단·전문봉사단(UNV) 선발 모집 공고를 공고 한 건 단위로 담으며, 제목·본문·등록일(regDt)과 직무기술서 등 첨부 링크를 함께 제공한다. 국제기구 진출을 준비하는 청년이나 진로 상담자가 "지금 모집 중인 UNV 파견 자리와 요구 직무가 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 국제기구 공석(JPO·인턴십·유엔 공석) 데이터와는 공고 제목이나 기구명을 맞춰 보는 방식으로만 이어 쓴다.
limits: 공고는 모집 이벤트 때 생성된 뒤 바뀌지 않는 형태라 기존 공고의 마감·선발 결과 같은 진행 상황은 이 데이터로 추적하지 않는다. 조인 키가 없어 기구·국가 코드 기준의 자동 연계는 되지 않는다.
