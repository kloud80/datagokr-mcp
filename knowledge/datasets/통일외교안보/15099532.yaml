summary_user: 외교부 홈페이지 국가별 약황 중 치안환경 정보를 국가·지역 단위로 담은 API로, 한글·영문 국가명, ISO 2자리 국가코드, 현재 여행경보, 실업률·자살사망률과 각 기준연도를 함께 준다. 해외 출장이나 여행을 앞둔 사람, 해외 진출 기업이 "이 나라의 현재 여행경보 단계와 치안 관련 지표는 어떤가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나 ISO 2자리 국가코드(country_iso_alp2)나 국가명으로 외교부의 여행경보·안전공지·사건사고 등 다른 국가별 해외안전 데이터와 매핑해 이어 쓴다.
limits: 조인 키가 확인되지 않아 다른 데이터와는 국가명·국가코드 매핑으로만 연결된다. 이벤트 주기로 생성 후 바뀌지 않는 성격이라 여행경보 같은 시의성 있는 항목은 최신 여부를 별도로 확인해야 하며, 지역 단위 공간 정보는 없다.
