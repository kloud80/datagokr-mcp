description_portal: 한국국제교류재단은 세계인의 한국에 대한 올바른 이해를 높이고, 한국 관련 지식 확산을 위해 ‘한국국제교류재단_출판지원 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 재단이 수행한 출판지원 사업에 관한 세부 정보(출판연도, 출판물명, 출판물 저자 등)를 제공, 12개 언어·10개국에서의 다양한 출판 실적이 수록되어 있습니다. 자료는 CSV, XML, JSON 등 여러 포맷으로 제공되어 연구자, 출판사, 정책 입안자, 교육기관, 언론 등 누구나 활용할 수 있습니다. 해외 한국학 연구 동향 파악, 국제 출판시장 분석, 번역 출판 정책 연구, 학술자료 구축, 한류 확산 효과 평가, 글로벌 문화콘텐츠 개발, 교육 자료 제작, 외국어 도서 출판 지원사업 기획, 저자 네트워크 분석, 데이터 기반 시각화 등 다양한 활용이 가능합니다."출판지원 사업정보" 사업은 현재 종료된 사업으로, 향후 업데이트 계획이 없는 1회성 데이터입니다.
