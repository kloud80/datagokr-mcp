summary_user: 외교부가 국가·지역별 여행경보(여행유의·자제·제한 등)를 조정할 때마다 낸 공지를 건별로 담으며, 제목·원문 텍스트/HTML·작성일·첨부파일 주소가 들어 있고 2009-02-15부터 2026-09-04까지 498건이다. 해외여행객이나 여행업자가 "가려는 나라의 여행경보가 최근 언제, 어떻게 바뀌었나"를 확인하는 데 쓴다. ISO 2자리 국가코드(country_iso_alp2)가 조인 키여서 같은 코드를 쓰는 외교부의 다른 해외안전 데이터(국가별 여행경보·안전공지·사건사고·입국요건 등)와 이어 쓰고, 대륙코드로 대륙별로 묶을 수 있다.
description_portal: '[요약 정보] 국가∙지역별 여행경보 조정 목록 조회: 한글 국가 명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용 )를 이용하여 국가∙지역별 여행경보 조정 목록 조회- 외교부에서 지정하는 여행 유의, 자제, 제한 등 해외 여행경보 대상국가 목록 및 상세정보를 제공하는 공공데이터 API 서비스[응답정보(출력 결과)]결과코드, 결과메세지, 한 페이지 결과 수, 페이지 번호, 전체 결과 수, 영문 국가명, 한글 국가명, ISO 2자리 코드, 대륙코드, 영문 대륙명, 한글 대륙명, 파일다운로드url, HTML원본 내용, 제목, 원본텍스트 내용, 작성일, 현재 결과수'
team:
  dept: 정보화담당관실
services:
  - op: /getCountryHistoryList2
    name: 국가∙지역별 여행경보 조정 목록 조회
    endpoint: https://apis.data.go.kr/1262000/CountryHistoryService2/getCountryHistoryList2
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: returnType
        required: false
        example: JSON
        desc: 데이터표출방식
      - name: numOfRows
        required: false
        example: '10'
        desc: 한 페이지 결과 수
      - name: cond[country_nm::EQ]
