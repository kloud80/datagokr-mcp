summary_user: FSC(Federal Supply Classification) 기반으로 군수품을 기능별 군(Group)·급(Class)으로 나눈 분류표로, 군급 코드 한 건마다 상태, 한글·영문 명칭, 주석, 포함·제외 범위를 담은 코드 사전(CSV 파일)이다. 군수품 조달·재고 담당자나 방산 업체가 "이 품목의 재고번호 앞 4자리는 어느 군급에 속하고, 무엇이 포함·제외되는가"를 확인할 때 쓴다. 군급 코드(defense_fsc_cd)를 키로 재고번호(13자리)의 앞 4자리를 가진 군수품 목록·조달 데이터와 이어 분류 명칭을 붙인다.
description_portal: 군급분류집은 국제적으로 통용되는 군수품 분류 표준을 제공하기 위해 발간·배포되는 목록 도구로 활용됩니다. FSC(Federal Supply Classification)를 기반으로 군수품을 기능적 특성에 따라 체계적으로 분류하고 이에 부여된 번호를 제공합니다. 재고번호 13자리 중 앞 4자리를 통해 군(Group)과 급(Class)을 구분할 수 있어 대규모 군수품을 효율적으로 관리할 수 있으며 이를 통해 군수품의 기능적 분류와 검색 기준을 일관성 있게 확인할 수 있습니다. 또한 군급분류집은 군수품 조달과 재고 관리의 국제적 표준화를 지원하고 관련 기관과 기업이 동일한 기준을 바탕으로 업무를 수행할 수 있도록 돕는 중요한 참고 자료로 활용됩니다.
