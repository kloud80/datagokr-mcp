summary_user: KOICA 해외 파견 대상국별로 치안상황·정세 불안·자연재해·감염병 같은 위험요소를 국가·연도·구분별 텍스트 내용(cn)으로 담은 안전정보 API다. 해외 파견을 앞둔 봉사단원·사업 담당자나 기관 안전관리자가 '이 나라의 올해 치안·감염병 위험은 어떤가'를 확인하고 파견 전 안전교육·대응 매뉴얼을 만드는 데 쓴다. 실측 컬럼에 전역 조인 키는 없지만 ISO 2자리 국가코드(country_iso_alp2)와 한글·영문 국가명이 있어, 외교부 여행경보 등 국가 표준코드를 쓰는 다른 해외안전 데이터와 국가 단위로 맞춰 이어 쓴다.
limits: 이벤트가 생길 때 만들어진 뒤 바뀌지 않는 성격의 데이터라 실시간 여행경보 조정을 대신하지 못하며, 최신성은 별도 경보 데이터로 확인해야 한다. 공통 조인 키가 없어 다른 데이터와는 국가명·ISO 코드 매핑으로만 연결된다.
