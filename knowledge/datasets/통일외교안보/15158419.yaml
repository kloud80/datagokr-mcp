summary_user: 방위사업청 국방전자조달(D2B)의 시설·국내·국외 군수품 계약을 건별로 담으며, 계약금액·예정가격·낙찰률·계약기간·계약방법·진행상태 등을 싣는다(API 전체 2,179건, 전국, 2023-09-07~2028-09-30). 분석가나 사업자가 발주기관별·연도별 계약 현황과 낙찰률 추이를 확인하는 데 쓴다. 전역 조인 키는 없어 같은 기관 코드나 계약업체명·계약번호의 이름 매핑으로만 이어지며, 나라장터와는 별도 체계라 정부조달 데이터와 개념적으로 나란히 본다.
description_portal: 방위사업청 국방전자조달시스템(D2B)에서 제공하는 군수품 조달 계약정보 데이터입니다. 본 데이터는 군수품 조달 과정에서 체결되는 시설계약정보, 국내계약정보, 국외계약정보를 포함하며, 계약 건별로 발주기관(기관명/기관코드), 요구년도, 계약방법, 입찰방법, 업무구분(물품/용역/시설), 진행상태 등 계약 추진 및 관리에 필요한 핵심 정보를 제공합니다. 또한 계약 금액, 예정가격, 낙찰률·낙찰금액, 계약기간(시작일/종료일) 등 계약성과 및 일정 분석에 활용할 수 있는 항목도 포함되어 있어 기관별·연도별 계약현황 분석, 조달 집행 모니터링, 계약 추이 분석 등에 활용 가능합니다.
