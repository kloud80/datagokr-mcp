description_portal: 본 데이터는 보건의료기본법 제44조(보건의료시범사업)에의거 보건복지부 시범사업 승인 하 "15년 7월부터 군의관 4명(내과 2, 가정의학과2) 편제로 1차 사업을 시작하였으며, 현재 5차 확대사업까지 진행하여 총 89개소(육군 76개소, 해군 11개소, 공군 2개소) 운영 및 군의관 6명(응급의학과)이 진료공백 없이 24시간 당직 진료체계 구축했습니다.데이터 구성 컬럼으로는 지원년도(2015~2025), 구분(총계, 육군, 해군, 공군), 총계, 진료전체, 투약, 경과관찰, 후송, 점검/교육 현황의 데이터를 확인할 수 있습니다.데이터는 XlS, CSV, JSON 형식으로 다양하게 제공하고 있습니다.본 데이터를 통해 군 의료 정책 수립, 의료 자원 최적화, 복지 개선 등의 연구에 활용할 수 있습니다.
