description_portal: 첨단 무기체계의 독자적 개발 역량을 확보하기 위해 추진된 핵심기술 연구개발의 예산과 과제 수 현황을 최근 11년간 연도별로 제공합니다. 이 데이터는 국방 연구개발 분야의 투자 추세와 정책 방향을 종합적으로 분석하는 데 활용할 수 있으며 연도별 예산 배분과 과제 추진 규모를 구체적으로 확인할 수 있습니다. 방위산업 관련 연구기관과 기업은 기술개발 우선순위 설정과 신규 과제 발굴의 근거로 삼을 수 있고 정책 담당자는 핵심기술 확보를 위한 중장기 전략 수립과 예산 집행의 효율성을 검토하는 지표로 활용할 수 있습니다. 또한 연구개발 성과의 지속성과 확대 가능성을 점검하는 참고 자료로 기능합니다.
