summary_user: 사회복무요원이 복무할 수 있는 전국 복무기관을 기관 한 곳당 한 행으로 담은 원천 목록으로, 전체 22,052건이며 기관명·대표기관명·소속기관 대분류·관할지방청·도로명주소·전화번호·선발제한 질병·성범죄 제한 여부를 포함한다. 사회복무요원 대상자가 "우리 동네에서 내 질병으로도 복무할 수 있는 기관이 어디인가"를 찾거나, 분석가가 시군구별 복무기관 분포와 관할지방청별 현황을 볼 때 쓴다. 시군구코드(bjdsggjusoCd)를 시군구 코드(sgg_cd)로 삼아 지역 통계·행정구역 데이터와 잇고, 복무기관코드와 관할지방청코드로 같은 병무청의 공석·인원배정 데이터와 맞춰 본다.
description_portal: '- 사회복무요원은 공익목적 수행에 필요한 사회복지, 보건의료, 교육문화, 환경안전 등의  사회서비스 업무 및  행정업무 지원을 위하여 국가기관, 지방자치단체, 공공단체, 사회복지시설(사회복지사업법 제2조에 따라 설치된 사회복지시설) 등 복무기관에서 근무할 수 있음(관련근거 : 병역법 제2조)-사회복무요원이 근무하는 복무기관(국가기관, 지방자치단체, 공공단체, 사회복지시설 등)의 관할지방청, 선발제한 질병, 연락처, 주소 등 사회복무요원이 복무 가능한 전국 복무기관 정보를 제공하고자 하는 서비스임.'
