summary_user: 외교부가 관리하는 국가·지역별 ISO 3166-1 표준코드(2자리·3자리·숫자)와 한글·영문 국가명을 국가 1개당 1행으로 담은 코드표 CSV 파일이며, 포털 설명 기준 231개 국가·지역을 담는다. 분석가가 출입국·무역·관광 통계의 국적·국가 표기를 하나의 기준으로 맞출 때, 예컨대 한글 국가명만 있는 방문객 통계를 ISO 코드 기반 해외 데이터와 맞추려 할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아 국가명이나 ISO 코드(ISO2자리·ISO3자리)를 매핑 기준으로 삼아 다른 국가 단위 데이터와 연결한다.
limits: 국가 코드·명칭만 담은 마스터 표여서 국가별 정치·경제 현황이나 여행경보 같은 내용은 없다. 실측 컬럼에 전역 조인 키가 없어 데이터마다 국가명 표기가 다르면 이름·코드 매핑을 따로 맞춰야 한다.
