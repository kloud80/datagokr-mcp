summary_user: 병무청이 선정한 나라사랑가게를 가게별 건으로 담은 목록 API이며, 우대구분명·우대기관명·주소·전화번호를 제공한다. 전체 2,391건 중 1,000행을 검증 수신했고 범위는 전국이다. 병역이행자나 병역명문가가 주변에서 혜택을 받을 수 있는 가게를 찾는 질문에 쓰며, 전역 조인 키가 없어 다른 데이터와는 주소나 이름 매핑, 또는 같은 기관 코드로 연결한다.
