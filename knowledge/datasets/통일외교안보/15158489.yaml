summary_user: 국방전자조달시스템(D2B)의 군수품 조달 서비스에서 공통으로 쓰는 발주기관 코드와 기관명(코드·코드명 두 항목)을 담은 전국 단위 코드목록이며, 건별 거래 원천이나 집계가 아닌 참조용 코드표다. 분석가나 방산 사업자가 "특정 군 부대·기관이 낸 입찰공고와 계약 실적은 어떤가"를 보려 할 때, 기관명을 발주기관코드로 바꾸거나 코드를 기관명으로 풀어 읽는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 방위사업청 조달계획·입찰공고·입찰결과·계약정보 데이터의 발주기관코드와 코드값을 맞추거나 기관명 매핑으로만 연결한다.
limits: 코드와 기관명만 있어 이 데이터만으로는 기관별 발주 건수나 금액을 알 수 없고, 다른 조달 데이터와 이어 써야 한다. 국방전자조달은 나라장터와 별도 체계이므로 나라장터 기관코드와 같다고 가정하면 안 된다. 개발계정은 일 100회로 호출이 제한된다.
