description_portal: '한국보훈복지의료공단 중앙보훈병원에서 운영 중 인 진료과와 메인진료과 부진료과 등  진료과에 대한 보유 장비에 대한 정보 및 진료 항목에 대한 설명자료 입니다.보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
