summary_user: KOICA가 협력국에서 추진하는 국별 협력사업을 사업 한 건당 한 행으로 정리한 사업개요서 파일(CSV, 약 103KB)로, 사업명·대상국과 대상지·예산(만불)·시작·종료연도·목적과 내용·지원분야·구성요소·산출물과 성과·수행기관과 수원기관·추진단계를 담는다. 연구자나 개발협력 실무자가 "특정 국가에서 KOICA가 어떤 분야에 얼마의 예산으로 어떤 사업을 하고 있는가"를 확인하거나 국가·분야별 사업 구조를 비교하는 데 쓴다. 전역 조인 키는 없어 사업대상국 이름을 국가 표준코드에 매핑하거나 사업번호·사업명으로 같은 기관의 KOICA 사업정보·발주계획·조달 데이터와 맞춰 이어 쓴다.
description_portal: 한국국제협력단(KOICA)이 세계 각국에서 진행하는 국별 협력사업의 사업개요서를 정리한 자료입니다. 사업명, 지원 대상 국가 및 도시, 예산 규모, 사업 기간, 추진 목적과 주요 내용, 유형, 원조 구분, 구성 요소, 예상 산출물과 성과, 수행 기관 및 수원 기관 정보, 추진 단계 등 핵심 정보를 체계적으로 담고 있습니다. 이를 통해 각 국별 개발협력 사업의 주요 분야, 목표, 투입예산 및 전반적인 구조를 비교 분석할 수 있습니다. 이에 동 자료는 국별협력사업에 대해 확인하고 연구하고자 하는 사람들에게 적합한 기초 자료입니다. 또한 협력국별 맞춤형 지원계획 수립 등 실무적인 접근에도 유용하게 활용될 수 있습니다.
