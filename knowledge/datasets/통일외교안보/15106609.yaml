description_portal: "통일부에서 제공하는 '통일부_금강산 관광객 현황' 데이터는 남북 교류협력 사업의 대표적 사례로 꼽히는 금강산 관광의 연도별 방문자 수를 집계한 공공통계 자료입니다. 이 데이터는 금강산 관광이 시작된 1998년부터 현재까지 남한에서 출발한 관광객의 연도별 방문 현황을 해로(도선)와 육로(육로 통행) 경로별로 구분하여 상세히 기록하고 있습니다.데이터는 각 연도별 금강산 관광을 위해 출발한 관광객 수(해로, 육로), 금강산 관광 총합계, 그리고 남북 교류 확대와 함께 추가된 개성 관광객 수와 평양 관광객 수까지 포함되어 있습니다. 이를 통해 남북 간 관광 협력사업의 활성화 시기, 정책 변화에 따른 방문 인원의 증감, 그리고 남북 관계의 변화 양상을 시계열적으로 파악할 수 있습니다.특히, 금강산 관광은 남북 간 신뢰 구축과 교류 확대에 중요한 역할을 해왔으며, 이 데이터는 남북관계의 주요 국면(예: 금강산 관광 중단 및 재개 시점, 남북정상회담 이후 교류 확대 등)과 관광객 수 변동 간의 상관관계를 분석하는 데 핵심적인 자료로 활용될 수 있습니다."
