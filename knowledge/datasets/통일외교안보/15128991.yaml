description_portal: 병영 도서관의 보유 도서 관련 데이터입니다.군인복지기본계획의 '문화와 여가를 누릴 수 있는 군 생활 보장' 및 독서문화진흥기본계획의 '책 읽는 병영 만들기'와 연계하여장병들의 선호도가 높은 진중문고 보급량을 지속적으로 확대 중이며, 전방 및 해, 강안 소초까지 진중문고를 보급하여 격오지 부대의 장병 독서 여건을 개선하고 있습니다.또한 '23년부터는 전자책, 오디오북을 나라사랑포털 어플을 통해 제공하고 있으며, 장병들의 교양 증진과 정서 함양을 위해 선호하는 다양한 분야의정기 간행물(병사용 교양지, 간부용 시사안보지)을 지속적으로 보급합니다.해당 데이터를 통해 장병들이 선호하는 도서를 파악할 수 있으며, 추후 보급 도서 선정시 기초 자료로써 활용하는 것이 가능합니다.
