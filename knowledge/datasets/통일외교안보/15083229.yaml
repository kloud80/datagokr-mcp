description_portal: 국방부가 관리하고 있는 군 체력단련장(골프장) 관련 정보를 담은 데이터입니다. 군 체력단련장 명칭과 위치(주소), 규모(9홀 혹은 18홀), 연락처(프론트, 예약실 등)를 비롯하여 그 외 정보를 직접 찾아볼 수 있는 홈페이지 주소 등을 제공합니다. 해당 데이터는 전국에 위치한 체력단련장 개수와 그 규모를 한눈에 파악하여 체력단련장 시설 점검 및 군 복지를 강화하는 데에 기초 자료로써 활용할 수 있으며, 체력단련장 활성화를 통해 군 장병, 군무원, 예비역 등의 체력 증진 및 여가 활동을 책임지는 것이 가능합니다.
