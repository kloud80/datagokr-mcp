description_portal: 통일부에서 제공하는 ‘통일부_남북합의서 해설자료 목록’ 데이터는 남북 간 주요 회담 및 합의서에 대한 해설과 설명자료를 기록한 정보입니다. 이 데이터에는 1991년부터 2018년까지 남북 간에 체결된 주요 합의서와 관련 회담의 해설자료가 총 84건 포함되어 있으며, 남북관계의 주요 이슈와 쟁점을 이해하는 데 필수적인 자료로 활용되고 있습니다.본 데이터는 남북정상회담, 고위급회담, 각종 실무회의 등 다양한 채널에서 도출된 합의서와 공동선언의 배경, 주요 내용, 이행 과정 등에 대한 해설을 포함하고 있습니다. 사용자는 정치, 군사, 경제, 인도, 사회문화 등 5개 세부 분야별로 검색이 가능하며, 각 분야별로 남북 간에 이루어진 주요 합의와 그 의미를 손쉽게 확인할 수 있습니다. 각 합의서의 해설자료는 파일(HWP 등) 형태로 제공되어, 원문 확인과 함께 상세한 내용 분석이 용이합니다.
