summary_user: 한국국제교류재단이 개최한 포럼·세미나 사업을 사업 한 건 단위로 담은 원장형 파일로, 사업연도·시작일자·종료일자·사업명·사업국가·공동추진기관명을 담는다(CSV 약 6.5KB). 국제교류 연구자나 언론이 '재단이 어느 해에 어떤 나라에서 어떤 기관과 함께 포럼·세미나를 열었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 외교·ODA 데이터와는 사업국가 이름이나 기관명을 직접 맞춰서만 이어 쓴다.
