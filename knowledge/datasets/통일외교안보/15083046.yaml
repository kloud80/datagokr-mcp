summary_user: 육군·해군·해병대·공군에 입대하는 병사에게 처음 지급하는 기본피복류의 품목별 보급기준을 담은 전국 단위 비공간 파일이며, 품목(품명)마다 군별 지급 기준과 보충역 기준이 열로 나뉜 작은 기준표(csv 약 1.3KB)이다. 입대를 앞둔 사람이나 가족이 '해병대에 가면 전투복·전투화·운동복을 몇 벌씩 받는가'를 확인하거나, 분석가가 군별 피복 보급량 차이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 품명 같은 이름 매칭이나 같은 국방부 자료끼리만 이어 쓴다.
description_portal: 육군, 해군, 공군, 해병대에 입대하는 병사에게 초도로 지급하는 기본피복류의 종류 및 품목별 보급기준을 파악할 수 있는 자료입니다. 전투복, 전투화, 운동복 등을 비롯하여 병영생활에 필요한 품목과 품목별 보급기준을 상세히 설명하여 입대 전 참고 자료로 활용이 가능합니다. 또한, 군 복무여건 개선 및 장병 임무수행능력 향상을 위한 기본피복류 보급 기준 조정 및 품질개선 관련 기초 자료로 활용될 수 있습니다.* 입대하는 군의 종류 및 시기에 따라 지급되는 물품의 종류와 지급 매수에 차이가 발생할 수 있으니 입대 전 참고 자료로 활용하시기 바랍니다.
