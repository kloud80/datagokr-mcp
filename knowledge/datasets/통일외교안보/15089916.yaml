description_portal: 육군사관학교 종교 행사 참석자 데이터입니다. 연도별, 분기별 종교 구분(기독교, 천주교, 불교, 원불교, 기타 등), 인원수, 비율로 세부 항목을 나누어 행사 참석자에 대해 상세하게 설명하고 있습니다. 해당 데이터는 육군사관학교 생도들의 종교별 행사 참여도를 통해 종교적 다양성을 파악할 수 있으며, 특정 종교에 치우치지 않는 종교적 중립성을 유지하는 것이 가능합니다. 또한, 종교 자유 보장 정도를 확인하여 가치관을 반영할 수 있는 중요한 자료가 될 수 있습니다.* 매분기마다 업데이트 진행할 예정입니다.
