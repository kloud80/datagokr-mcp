description_portal: '중남미 지역 국가의 다양한 분야(정치, 경제, 외교, 각종 사회 문제, 안보, 치안 등)의 주요 이슈 사항들에 대한 주요 언론 기사의 목록을 CSV 형식으로 제공합니다. 언론 기사의 예시를 보면 최근 중남미 반정부 시위 배경 및 전망, 중국의 대중남미 경제협력 확대 동향, 코로나 사태가 중남미 경제에 미치는 영향,미국 대선 후보자들의 대중남미 정책 방향, OECD 중남미 경제전망: 2020 디지털 전환의 필요성, 글로벌가치사슬(GVC) 재편으로 인한 중남미의 기회와 과제 등 각국의 기사를 공지합니다.해당 기사의 내용은 외교부의 입장과는 무관함을 알려드립니다.'
