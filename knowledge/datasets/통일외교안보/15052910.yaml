summary_user: KOICA가 국가별 국제개발협력 동향 기사를 건별로 모은 파일로, 국가·구분(공여국/수원국/국제기구/KOICA)·분야와 기사 제목·본문(국문·영문)·출처·링크·날짜를 담는다. ODA 사업 담당자나 개발협력 분석가가 특정 수원국의 최근 협력 우선순위나 정책 변화, 현지 이슈를 확인해 사업 타당성·위험요소를 검토할 때 쓴다. 전역 조인 키가 없어 국가명을 기준으로 KOICA 국가별 협력사업·사업정보 등 같은 기관 데이터와 이름 매핑으로 이어 쓴다.
