description_portal: 한국국제협력단(KOICA)이 국제개발협력과 관련된 국가별 개발협력 동향을 제공하는 정보 데이터입니다.동 데이터는 지역, 국가, 관할사무소, 구분(공여국/수원국/국제기구/KOICA), 분야, 동향기사 제목 및 본문내용, 출처, 링크 정보를 제공합니다. 이를 통해 특정 국가의 협력 우선순위, 추진 과제, 정책적 변동사항 등을 시의성 있게 파악할 수 있으며, 국제개발과 관련된 종합적 흐름을 이해할 수 있습니다. 더불어 현지에서 발생한 이슈를 기반으로 사업 타당성 평가, 위험요소 식별, 대응 전략 수립 등 실무에 다각적으로 활용할 수 있습니다. 동 데이터는 데이터가 생성된 시점(월)으로부터 익월 10일에 취합되어 공공데이터포털에 업로드되며, 데이터 생성 시점(월)을 기준으로 전월과 익월 데이터가 일부 포함될 수 있습니다.
