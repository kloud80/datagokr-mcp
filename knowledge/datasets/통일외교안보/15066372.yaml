summary_user: 광주보훈병원 한 곳이 환자에게 받는 비급여 의료서비스를 항목별로 담은 건별 목록 파일(CSV 약 134KB)로, 대·중·소분류, 항목코드·명칭, 병원 자체 코드·명칭, 비용과 최저·최고비용, 치료재료대 포함 여부, 고지 시작·종료일을 담는다. 광주보훈병원 진료를 앞둔 환자·보호자가 특정 검사나 처치의 비급여 비용이 얼마인지 미리 확인하거나, 분석가가 다른 보훈병원과 같은 항목의 비급여 가격을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 보훈병원 비급여 파일이나 의료기관 정보와는 항목코드·항목명칭 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국보훈복지의료공단 광주보훈병원에서 개방하는 비급여 수가 정보 데이터는 병원에서 환자에게 제공되는 비급여 의료서비스의 항목별 세부 정보를 담고 있는 자료입니다. 이 데이터에는 의료서비스를 분류한 대분류, 중분류, 소분류 항목이 포함되어 있으며, 각각의 비급여 항목에 대한 명칭과 고유 코드, 적용 비용이 명시되어 있습니다. 이 정보는 환자와 보호자가 치료 전 의료비를 예측하고, 항목별 비용의 투명성을 확인하는 데 중요한 역할을 하며, 병원의 비급여 진료비 운영에 대한 객관적이고 표준화된 데이터를 제공합니다.
