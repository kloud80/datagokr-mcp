description_portal: 국방 R&D 분야에서 기초·원천 기술 확보를 목표로 추진한 최근 11년간의 기초연구 예산과 과제 수 현황을 연도별로 제공합니다. 이 데이터는 방위산업의 장기적 기술 경쟁력 강화를 위해 어떤 분야에 예산이 집중되고 있는지를 분석하는 데 유용합니다. 또한 기초연구 단계의 투자 규모와 과제 추진 현황을 통해 차세대 무기체계 개발을 위한 기반 기술 축적 정도를 가늠할 수 있습니다. 연구기관과 산업체는 기술 로드맵을 수립하거나 연구개발 전략을 조정하는 참고자료로 활용할 수 있으며 정책 담당자는 기초연구 지원 확대 및 성과 관리의 근거로 활용할 수 있습니다.
