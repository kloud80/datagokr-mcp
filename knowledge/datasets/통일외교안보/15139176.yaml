summary_user: 병무청이 해군 모집병의 모집계열(일반기술·전문기술·동반입대·복무지역·작전사)별로 모집년도·회차마다 1차 선발 커트라인 점수와 선발인원을 정리한 전국 단위 집계 파일(xlsx)이다. 해군 입대를 준비하는 지원자가 '지난 회차에 일반기술 계열은 몇 점이면 1차 합격했고 몇 명을 뽑았나'를 확인해 지원 계열과 시기를 정하는 데 쓴다. 전역 조인 키가 없어 다른 병무청 모집병 자료(특기·배점·접수현황 등)와는 모집년도·회차·모집계열 이름을 맞춰서만 이어 쓴다.
limits: 실측 컬럼에 표준 조인 키가 없고, 첫 행이 제목('2023년 해군 병 모집계열별 1차합격 커트라인 점수')이고 나머지 열은 이름 없는 열로 읽혀 머리글을 직접 정리해야 한다. 명세상 연 단위로 만들어진 뒤 바뀌지 않는 자료라 회차 진행 중의 최신 커트라인은 담기지 않을 수 있다.
