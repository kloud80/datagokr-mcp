summary_user: 독립기념관 콘텐츠관리시스템에 등록된 웹툰·유튜브 영상·카드뉴스·일러스트 등 콘텐츠 목록을 한 건씩 담은 파일로, 건마다 작업·프로그램 구분, 제목, 이미지·동영상·음성·PDF 포함 여부, 등록일이 있으며 전국 단위의 비공간 데이터다(csv 약 5.5KB). 교사·연구자·일반 국민이 '삼일운동이나 봉오동·청산리 전투를 다룬 독립기념관 웹툰·영상 자료가 무엇이 있나'를 찾을 때 쓴다. 관리번호(ikm_content_mgmt_no)가 유일한 키이며, 다른 보훈 데이터와 이을 지역 코드나 인물 식별자는 없다.
description_portal: 독립기념관에서 운영중인 콘텐츠관리시스템 내용중 유튜브 등 콘테츠와 관련된 내용이다.데이터의 주요 항목으로는 관리번호, 작업코드, 작업명, 프로그램코드, 프로그램명, 제목, 이미지여부, 동영상여부, 음성여부, PDF 여부, 등록일로 구성되어 있다.데이터 주요 내용으로는 웹툰으로는 삼일운동과 관련 제1화 ~ 15화, 봉오동/청산리 전투, 한국광복군 등이 있으며, 유튜브 영상으로는 독립운동가 성향분석 등 자료, 카드뉴스로는 독립기념관이 발굴한 독립운동가(2024.1~12), 기타 자료로는 광복 80주년 엠블럼, 독립기념관 일러스트 파일 등이 있다.
