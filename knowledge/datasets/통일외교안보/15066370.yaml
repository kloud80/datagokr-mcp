summary_user: 대구보훈병원 한 곳의 비급여 진료 항목을 항목별로 담은 파일로, 대분류·건강보험 요양급여비용 코드와 명칭·병원 수가코드와 수가명·일반단가가 들어 있다. 환자나 분석가가 '대구보훈병원에서 이 비급여 검사·처치는 얼마인가'를 확인하거나 다른 병원과 비급여 단가를 비교할 때 쓴다. 전역 조인 키는 없어서 다른 보훈병원·의료기관 비급여 자료와는 건강보험 요양급여비용코드나 항목 명칭을 맞춰 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 코드·이름 매핑으로만 연결된다. 대구보훈병원 한 곳의 자료라서 공간 단위 분석에는 쓰지 못하고, 다른 병원과 비교하려면 병원별 파일을 따로 모아야 한다.
