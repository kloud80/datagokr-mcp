summary_user: KOICA가 지정한 일일 안전관리 중점국가를 국가·사건 단위로 정리한 수시성 파일(csv 약 2.8KB)로, 국가명·위험수준(1~5단계)·사건사고명·사건일·세부내용·조치사항을 담는다. KOICA 파견 인력이나 해외 사업 관계자가 '지금 파견국에서 어떤 사건이 있었고 위험 단계는 몇 단계인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 외교부 국가별 여행경보 등 다른 해외안전 데이터와는 국가명을 국가 표준코드에 매핑해야 이어 쓸 수 있다.
description_portal: 한국국제협력단(KOICA)이 지정한 ‘일일 안전관리 중점국가’ 목록을 수집한 수시성 자료로, 국가명, 위험수준(1~5단계), 사고명, 사건 발생일, 세부 내용 및 조치 사항을 포함하고 있습니다. 이를 통해 파견된 인력과 해외 사업 관계자들에게 현지 안전 상황을 일상적으로 모니터링하고 신속히 대응할 수 있도록 돕습니다. 위험분류는 ‘관심’에서 ‘위험’ 단계까지 세분화되어 있어, 지역별 위험정도에 대한 확인이 가능하며, 이를 바탕으로 위험 대응 지침 수립, 안전 정보 공유 체계 강화, 위험 수준별 대응 효과 평가 등에도 활용할 수 있습니다.
