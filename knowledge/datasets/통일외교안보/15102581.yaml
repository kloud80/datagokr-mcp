summary_user: KOICA 해외봉사단원이 파견 지역에서 추진한 소규모 현장사업을 사업 한 건당 한 행으로 담은 원장 파일(CSV 약 22KB)로, 사업수행연도·파견 국가와 지역·단원형태·활동종류·협력기관·수혜자 수·미화 기준 사업비와 분담 구성을 포함한다. 분석가나 ODA 연구자가 '어느 나라에서 봉사단원이 어떤 분야의 현장사업을 했고, 사업비를 KOICA·협력국·단원이 각각 얼마씩 분담했으며 수혜자는 몇 명인가'를 보는 데 쓴다. 전역 조인 키는 없어서 국가명(국문)을 이름으로 맞추거나 공여국 보고체계(CRS) 코드로 다른 KOICA 사업·국가별 협력사업 데이터와 분야 단위로 이어 쓴다.
description_portal: 한국국제협력단(KOICA)이 해외봉사단의 현지활동을 효과적으로 지원하기 위해 실시하는 현장사업의 목록을 제공합니다. 현장사업은 봉사단원이 파견 활동지역을 대상으로 진행하는 소규모 프로젝트로, 단원의 활동기간 중 접하는 현장의 문제와 수원기관의 의견을 반영하여 추진됩니다. 해당 사업은 현장사업 심의위원회의 심의를 거쳐 사업비가 지원됩니다. 동 데이터의 주요 항목으로는 사업명, 사업수행연도, 파견국가 및 지역, 단원형태, 활동종류, 협력기관명, 총사업비 및 분담액, 수혜자 수 등이 있습니다. 이를 통해 각 수원국에 파견된 봉사단원들이 현장에서 어떤 사업을 추진하고 있는지 그 현황을 자세히 파악할 수 있습니다.
