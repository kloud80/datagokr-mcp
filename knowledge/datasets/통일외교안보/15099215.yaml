summary_user: KOICA가 수행한 ODA 개발협력사업과 한국국제교류재단(KF)의 공공외교사업을 사업 단위로 담은 API로, 대상국별로 국가명·대륙·사업유형·사업명·사업기간·사업년도·수혜기관을 함께 제공한다. 분석가나 연구자가 '특정 국가에서 KOICA 개발협력과 KF 공공외교가 각각 어떤 사업으로 언제 진행됐는가'를 한눈에 비교할 때 쓴다. 실측상 전역 조인 키는 없으나 ISO 2자리 국가코드(country_iso_alp2)와 국가명을 매개로 국가 표준코드·여행경보 등 다른 국가 단위 외교 데이터와 이름·코드 매핑으로 연결한다.
description_portal: KOICA가 수행한 ODA 개발협력사업과 한국국제교류재단(KF)의 공공외교사업 정보를 융합 제공하는 API입니다. 하나의 대상국에서 진행된 두가지 사업의 예시를 한눈에 파악할 수 있습니다. 해당 API는 인증키(serviceKey), 페이지 번호(pageNo), 한 페이지 결과 수(numOfRows) 등 기본적인 요청변수를 사용하며 한글 국가명, ISO 2자리코드, 사업시작일, 사업종료일 등의 필터 파라미터를 추가로 설정할 수 있습니다. 출력결과에는 국가명, ISO 2자리코드, 대륙명, 사업유형코드, 사업명, 사업시작일, 사업종료일, 다년구분코드, 수혜기관명, 사업년도 등의 항목이 포함되며, 각 항목에 대한 데이터는 JSON 형식으로 반환됩니다.
