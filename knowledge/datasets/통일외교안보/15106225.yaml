description_portal: 통일부가 제공하는 ‘통일부_남북 선박왕래 현황’ 데이터는 남북 간 인적 및 물적 교류의 해상 이동 상황을 연도별로 기록한 공식 통계 자료입니다. 이 데이터는 1994년부터 현재까지 남북을 오가는 선박의 운행 횟수, 제주해협을 통과하는 선박의 횟수 항목을 포함하고 있어, 남북 해상 교류의 규모와 변화 추이를 시계열로 파악할 수 있습니다.각 연도별 선박 운항 횟수는 남북 해상 교류의 활성화 정도를 수치로 보여주며, 제주해협 통과 횟수는 특정 해역을 경유하는 교류의 빈도와 특성을 반영합니다. 남북관계의 발전 추이와 해상 물류 및 인적 왕래의 변화를 이해하는 데 중요한 역할을 하며, 남북 경제협력, 인도적 지원, 민간 교류 등 다양한 분야에서 활용 가능합니다.
