summary_user: 전국 지방병무청(병무지청)별 병역판정검사장의 주소와 그 검사장이 맡는 관할 시군구를 정리한 2023년 기준 소규모 파일(csv, 약 1.6KB)이다. 병역판정검사를 앞둔 병역의무자나 가족이 "우리 시군구 거주자는 어느 검사장에서 검사를 받는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 행정구역 코드표나 다른 병무 시설 데이터와는 시군구 이름(해당 시군구)이나 지방병무청 이름을 맞춰서 이어 쓴다.
