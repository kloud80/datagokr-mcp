description_portal: 한국국제교류재단은 국내외 한국학 연구 활성화와 정책 수립을 지원하기 위해 ‘한국국제교류재단_한국관련 연구 실적’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 1992년부터 2013년까지 재단이 추진한 다양한 한국 관련 연구의 연도, 세부 사업명, 연구명 등 주요 정보를 포함하며, 2,639건의 실적을  제공합니다. 연구 동향 파악, 정책 평가, 학술자료 구축, 국제 협력사업 분석, 연구성과 홍보, 교육 콘텐츠 개발, 외교정책 연구, 데이터 기반 통계분석, 연구자 네트워킹, 해외 한국학 진흥 등 여러 분야에서 활용할 수 있습니다. 본 데이터는 지난 1992년부터 2013년까지만 수집한 1회성 데이터 입니다.
