description_portal: '방위사업청의 조달에 있어 계약의 입찰참가 제한을 받는 부정당업자(계약상대자)의 최근 5개년 발생원인 현황 정보입니다.부정당업자 제재처분은 「국가를 당사자로 하는 계약에 관한 법률 시행령」제94조에 근거하여 계약심의위원회를 설치․ 운영하고, 계약의 입찰, 낙찰 또는계약체결․ 이행에 있어서 부정당 행위를 한 부정당업자(계약상대자)에 대해서계약심의위원회 심의․ 조정을 통해 일정기간 동안 정부계약의 입찰참가를 제한하는 제도임.※ 관련근거 : 국가계약법 제27조, 같은 법 시행령 제76조 및 제94조, 같은 법 시행규칙 76조방위사업법 제59조, 같은 법 시행령 제70조, 같은 법 시행규칙 제58조군수품조달관리규정 / 방위사업청 계약심의위원회 운영규정'
