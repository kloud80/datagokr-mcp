description_portal: '국가보훈부에서 발행하는 지면 나라사랑신문을 구독자의 관할지청별 인원현황 정보를 제공합니다.나라사랑 신문은 전체 대상자가 구독할 수 있으나, 종이신문 구독을 원치 않는 경우 모바일로 전환됩니다.ㅇ 제공항목: 기준일자, 지역, 기관형태, 기관명, 발행건수※ 나라사랑신문은 국가보훈부에서 매월 발간하는 신문으로 국가유공자분들에게 ​정확한 보훈정책 제공과 보훈가족 및 단체의 소식을 빠르게 전달하여 보훈문화 창달을 지원하고 있습니다.    (창간일: 1963년 9월 19일 , ​누리집 주소: www.narasarang.kr)(관련문의) 국가보훈부 홍보담당관실(044-202-5013)'
