description_portal: 이 공공데이터는 인천광역시의 각 **행정구역별(군·구별)**로 대한적십자회비의 **고지액(목표액)**과 **실제 납부된 금액(모금액)**을 집계하여 제공하는 통계 자료입니다. 이 자료는 적십자 활동에 대한 지역 주민의 참여도와 모금 성과를 보여줍니다.<활용 목적>이 자료는 인천시민의 인도주의 활동 참여 수준을 파악하고, 지역별 모금 활성화 정도를 분석하는 데 사용됩니다. 행정적으로는 효율적인 모금 전략을 수립하고, 적십자 활동 홍보 및 지원을 위한 정책 마련의 기초 자료로 활용됩니다. 인천시의 인도주의 및 사회 공헌 활동 현황을 보여주는 중요한 통계 정보입니다.
