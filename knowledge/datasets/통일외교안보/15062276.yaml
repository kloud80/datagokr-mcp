summary_user: 2025년 현역 모집병의 지원·선발·선발취소·연기·입영·귀가·실입영 인원을 지방병무청별(구분)로 집계한 연간 파일로, 건별 원천이 아닌 전국 단위 집계표입니다. 병역 정책 분석가나 지원 예정자가 어느 지방청에서 지원 대비 선발과 실제 입영 비율이 높고 낮은지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 모집병 자료(특기·접수현황·입영 계획 등)와는 지방청 이름을 맞춰 연결해야 합니다.
