description_portal: 한국국제협력단(KOICA)이 수행하는 전사 프로그램 중 보건 분야에서 수혜자 수를 정리한 수시성 통계 자료입니다. KOICA는 '보건 중기전략(2021-2025)을 수립하여 개발도상국 주민들에게 양질의 보건의료서비스를 제공하고, 보편적 건강보장을 강화하기 위해 다각적인 노력을 기울이고 있습니다.  해당 데이터는 개발도상국의 보건 역량강화를 위해 추진한 전사 프로그램 사업의 수혜자 수를 안내하고 있으며, 연도와 대상지역, 그리고 대상국을 기준으로 하고 있습니다. 이에 연도별 보건프로그램 수혜자 규모를 시계열적으로 확인할 수 있습니다.
