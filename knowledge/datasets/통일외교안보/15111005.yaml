summary_user: KOICA가 민간 파트너(시민사회·기업·대학 등)와 수행한 민관협력사업을 사업 단위로 한 행씩 정리한 파일로, 사업형태·분야, 국문·영문 사업명, 대상국가·지역, 전체 사업기간, 총약정액, 수혜자 수, 수행기관·현지파트너, 주요실적과 문제점 대응을 담는다(csv 약 568KB). 연구자나 개발협력 분석가가 "특정 국가나 분야에서 KOICA 민관협력사업이 어떤 기관과 얼마 규모로 진행됐고 어떤 성과와 문제가 있었나"를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 KOICA 사업목록(시민사회협력·CTS·IBS 등)과는 통계사업번호·사업명·대상국가 이름을 맞춰 보는 방식으로만 연결한다.
description_portal: 한국국제협력단(KOICA)이 수행하는 민관협력사업의 핵심 개요 정보를 정리한 자료입니다. 민관협력사업은 개발도상국의 빈곤 감소와 복지 증진을 목표로, 정부-시민사회-기업-대학 등 다양한 민간 파트너와 협력하여 국제개발협력 사업을 수행하는 프로그램입니다. 각 사업에 대한 사업분야, 사업명(국문, 영문) 대상국가 및 지역, 사업 기간 등이 요약되어 있어 사업의 개요 전반을 파악할 수 있습니다. 이를 통해 KOICA 과거 민관협력사업에 대한 현황을 분석하고, 그에 기반한 연구, 평가, 전략적 의사결정 등에 활용할 수 있습니다. 최신의 정보는 공공데이터포털에 개방된 시민사회협력프로그램 신규사업목록, 혁신적기술프로그램(CTS) 사업 목록, 포용적 비즈니스 프로그램(IBS) 사업 목록 등을 통해서도 확인할 수 있습니다.
