summary_user: 병무청 취업맞춤특기병의 모집 정보를 군별(육·해·공군), 모집특기별, 입영부대별, 입영일자별로 나눠 모집인원과 선발인원 단위로 담은 전국 범위 API입니다. 입대를 앞둔 청년이나 진로 상담자가 '내가 가진 자격·전공에 맞는 특기가 어느 부대로 언제 입영하고 몇 명을 뽑는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 같은 병무청 모집병 계열 데이터와 특기코드(gsteukgiCd)·입영부대코드·모집연도·차수 같은 기관 내부 코드나 이름 매핑으로만 이어 쓴다.
description_portal: 취업맞춤특기병 모집 및 선발과 관련한 자료를 조회하는 서비스입니다.군별(육군, 해군, 공군), 모집특기별, 입영부대별(육군훈련소 등), 입영일자별 모집인원과 선발인원 정보를 확인할 수 있습니다.병무청 누리집- 군지원(입영신청)안내- 모집안내서비스- 안내 및 지원절차- [취업맞춤특기병] 메뉴에서 모집 개요, 모집 안내, 군사특기임무 및 설명, 지원 절차 등을 확인할 수 있고,병무청 누리집- 군지원(입영신청)안내- 지원서 작성/수정/취소- [취업맞춤특기병 지원] 메뉴에서 취업맞춤특기병 지원서를 접수할 수 있습니다.
