summary_user: KOICA 해외봉사단(WFK) 지원 실적을 통계사업번호 단위로 담은 파일로, 분야·사업유형·사업명·지역·국가(DAC 기준)·사업목적(CRS 코드)·사업연도와 원화·달러 지원액이 들어 있다(CSV 약 291KB). 분석가나 ODA 연구자가 '어느 국가·지역·분야에 봉사단 지원액이 얼마나 갔나'를 연도별로 따져 볼 때 쓴다. 통계사업번호(koica_stat_project_no)를 키로 다른 KOICA 사업·통계 자료와 잇고, DAC 국가명과 CRS 목적코드명으로 OECD 원조통계 분류와 맞춰 본다.
description_portal: '한국국제협력단(KOICA)이 운영하는 해외봉사단(WFK: World Friends Korea)의 지원 실적을 국가별·봉사단유형별로 집계한 통계 자료를 제공합니다. 이를 통해 KOICA 분야명, 사업명, 지역명, 국가, 사업내용, 사업목적, 사업연도, 지원액(원, 달러) 항목을 제공하여 KOICA의 봉사단의 지원실적을 파악할 수 있습니다. 동 데이터는 내부적으로 과거의 파견실적을 점검하고 앞으로의 전략적인 파견게획을 수립하는 데 활용될 수 있으며, 외부적으로 봉사단 프로그램의 정책과 실행 간 연계가 잘 이루어지고 있는지 검토할 수 있는 기초 자료로 활용될 수 있습니다. 본 자료는 연간 업데이트되며, KOICA의 투명성 제고와 이해관계자 정보 접근성 향상에도 기여합니다.*OECD 확정통계는 N+2년 1월 확정되므로, 본 데이터는 2023년 데이터입니다. 2024년 데이터는 2026년 하반기 내에 게시될 예정입니다.'
