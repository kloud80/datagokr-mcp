summary_user: '한국국제협력단(KOICA)이 OECD DAC에 보고한 ODA 사업을 사업 단위로 담은 원천 로데이터로, 보고연도·수원국·사업명·사업분야·원조유형·사업실시기관과 약정액·지출액(USD), 성평등·기후변화 등 정책목표 표시를 포함한다. 분석가나 개발협력 연구자가 특정 수원국이나 분야(예: 보건, 기후변화 적응)에 KOICA가 어느 해에 얼마를 약정·지출했는지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 수원국명·사업분야 같은 이름 매핑이나 OECD CRS 코드북(원조유형·채널·SDGs 코드) 대조로 연결한다.'
description_portal: '한국국제협력단이 OECD DAC(개발원조위원회)에 보고한 ODA 사업정보 로데이터로, 사업명, 사업분야, 지역명, 사업실시기관, 해당 SDGs 지표 등을 제공합니다.* 코드 칼럼 설명- [채널코드]: [사업실시기관]에 명시된 데이터 값의 코드를 기재한 코드 칼럼입니다.- [원조유형코드]: [원조유형]에 명시된 데이터 값의 코드를 기재한 코드 칼럼입니다.- [지속가능개발목표(SDGs)]: OECD CRS CODE list 파일 내 SDGs focus 시트(코드북) 참조- [기술협력],[프로그램원조],[프로젝트원조코드],[혼합신용]: 관련 사업의 칼럼 속성 해당 여부를 표시한 칼럼입니다. (해당 시 = 1, 해당하지 않을 시 = 0)- [통화]: 통화코드를 나타내는 칼럼으로 해당 데이터 값(302)은 USD를 뜻합니다.* 공란으로 남겨진 데이터 값의 경우, 사업에 해당되지 않아 미집계된것입니다.'
