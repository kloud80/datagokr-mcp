limits: 조인 키로 확인된 것은 주소뿐이며 국가코드 필드가 없어 국적·무역 데이터와 바로 연결되지 않는다. 필드 명세에 코드표와 의미 설명이 비어 있어 공관 유형 코드값의 뜻은 이 데이터만으로 알 수 없다. 최신 행 날짜가 2026-08-24로 관측일 기준 39일 전이지만 이것만으로 데이터가 오래됐다고 단정할 수는 없다.
