description_portal: '독립유공자 중 여성에게 수여된  포상 현황을 연도별, 훈격별로 분류하여 데이터 제공합니다.* 훈격: 건국훈장(대한민국장, 대통령장, 독립장, 애국장, 애족장), 건국포장, 대통령표창* 독립유공자 포상:독립유공자 포상은 일제하 독립운동에 헌신한 이들을 포상함으로써 그 공훈을 선양하는 사업입니다.독립유공자 포상은 단지 유공자 개인을 선양한다는 차원을 넘어 독립운동사를 재정립한다는 역사적 의의를 지니고 있으며,국민의 역사의식과 국가관을 정립하는데 주요한 기능을 수행한다고 할 수 있습니다.독립유공자 포상 및 정보 현행화에  따라 부정기적으로 업데이트 됩니다.'
