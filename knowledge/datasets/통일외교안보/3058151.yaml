summary_user: 국방기술품질원이 수행한 민군규격표준화사업의 과제를 한 건씩 정리한 파일 데이터로, 과제명·주관연구기관·진행/종료 여부·연구 기간·연구보고서 번호와 제목·보고서 공개범위를 담는다(CSV 약 23KB, 전국·비공간). 방산업체나 연구자가 "특정 장비·부품 규격에 대해 이미 민군 공통 표준화 연구가 수행됐고 보고서를 열람할 수 있는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주관연구기관명이나 과제명·보고서명 같은 이름 매칭으로만 연결한다.
limits: 표준 코드나 기관 코드 같은 공통 키가 없어 국방규격·방산업체 데이터와 정확히 연결되지 않는다. 기관명·과제명 표기 차이에 주의해야 한다. 보고서 본문은 없고 번호·제목·공개범위만 있어 실제 성과 내용은 별도로 확인해야 한다.
