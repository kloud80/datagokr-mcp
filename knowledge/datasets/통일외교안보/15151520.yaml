description_portal: 종료평가보고서 성과지표 요약 데이터는 한국국제협력단(KOICA)가 수행한 개발협력사업의 종료평가보고서 내 성과달성 요약표를 정형화한 데이터 입니다. 높은 민간 수요 기반, 보건, 교육, 공공행정 분야 개발협력사업의 최근 5년 종료평가보고서에 대한 정형화 작업을 통해 데이터를 구축하였으며, 사업개요 및 성과지표, 기초선·목표치·결과선에 대한 내용을 제공합니다. 동 데이터는 분야별 사업별 다양한 성과지표 및 목표 대비 달성도를 정략적으로 확인할 수 있으며, 이를 통해 사업효과성 및 지속가능성을 평가하고, 향후 사업 기획·정책 수립 및 개선 등에 활용될 수 있습니다.
