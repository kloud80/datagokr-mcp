summary_user: 국가별로 일반·관용·외교관 여권 소지자의 무비자 입국 가능 여부와 가능 기간, 입국 시 소지 서류, 무비자 입국 근거를 담은 파일 데이터로, 전국·비공간 단위 184행이다. 해외여행객이나 출장 담당자가 "이 나라는 일반여권으로 비자 없이 며칠까지 들어갈 수 있나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 국가명 매핑이나 국가 표준코드 대조로 이어야 하며, 같은 해외안전·여행경보 부문의 여행경보·안전공지와 국가 단위로 함께 볼 수 있다.
