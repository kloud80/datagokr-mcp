summary_user: KOICA 협력국별로 인구·1인당 GDP·빈곤율·지니계수·문해율·중등학교 등록률·세금·ODA 순 수원액·해외직접투자·통신·전기·인터넷 사용률·취약국가 지수 같은 개발 지표를 지표마다 기준연도와 함께 한 행에 모은 국가 단위 집계 파일(csv, 약 67KB)이다. 개발협력 분석가나 사업 기획자가 'KOICA 사무소가 있는 국가협력전략 대상국 가운데 빈곤율이 높고 취약국가 순위가 낮은 나라는 어디인가' 같은 질문에 쓴다. 전역 조인 키는 없어서 국가명(국문·UNDP·World Bank·OECD 표기)이나 KOICA 지역명을 기준으로 KOICA ODA 사업·조달 데이터나 국가 표준코드 데이터와 이름을 맞춰 붙여 쓴다.
description_portal: '한국국제협력단(KOICA)이 협력 중인 KOICA 협렵국의 개발 지표 및 ODA 지원 실적을 수집한 수시성 데이터입니다. 인구, 1인당 GDP, 빈곤율, 문해율 등 기초 개발 지표부터, 인간개발지수(HDI), 전자정부 지수, 성평등, 거버넌스 수준 등의 보다 포괄적 인권·사회지표까지 포함되어 있어 국가별 전반적인 발전 상태를 다각도로 이해할 수 있습니다. 여기에 KOICA의 ODA 규모와 분야별 지원 실적이 함께 기록되어 있어 개발지도상 국가의 니즈와 한국의 지원이 어떻게 매치되는지 구조적으로 분석 가능합니다.*개발지표: 인구, 경제, 인간개발, 빈곤, 교육, 재정, 거버넌스, 비즈니스, 산업인프라, 성평등*출처: World Bank Open data, Human Development Data Center, Fragile States Index, Transparency International, UN Department of Economic and Social Affairs Public Institutions, OECD Statistics, KOICA ODA 정보센터'
