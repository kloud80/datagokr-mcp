description_portal: '독립기념관에서 운영하고 있는 한국독립운동정보시스템에 대한 접속 통계로 연도, 월별 접속 정보 내용을 제공한다.한국독립운동정보시스템은 독립기념관이 보유하고 있는 한국독립운동 관련 정보를 종합적으로 보여주고 있는 시스템으로 소장자료에 대한 기본 정보와 중요자료, 한국독립운동인명사전 정보, 대한민국임시정부 자료, 독립운동가 자료, 신문자료, 의병자료 등 원문정보와 한국독립운동사연구소에서 연구 발간한 연구논문, 한국독립운동의 역사자료, 발간자료 총서 등 다양한 정보를 서비스 하고 있다.주요항목 : 연도, 월, 접속자수, 접속건수, 페이지뷰대상기간 : 2021년 ~ 2025년'
