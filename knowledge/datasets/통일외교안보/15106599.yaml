description_portal: 통일부에서 제공하는 ‘북한이탈주민 재북 학력별 현황’ 데이터는 북한이탈주민이 북한에 거주하던 시기의 학력 분포를 성별로 구분하여 집계한 통계 자료입니다. 본 데이터는 북한이탈주민의 교육 배경을 다각적으로 파악할 수 있도록 설계되었으며, 북한 사회 내 학력 구조와 성별 간 교육 수준 차이를 분석하는 데 중요한 기초 정보로 활용됩니다.구체적으로는 취학 전 아동, 유치원, 인민학교(초등학교에 해당), 중학교(고등중), 전문대, 대학 이상, 무학(북한 내 문맹), 기타(불상 등)으로 세분화되어 있으며, 각 학력 구분별로 남성과 여성 인원수를 별도로 집계하였습니다. 또한, 전체 인원의 합계도 포함되어 있어, 전체적인 학력 분포와 성별 비율을 한눈에 확인할 수 있습니다.이 데이터는 북한이탈주민의 교육 수준을 정량적으로 파악할 수 있는 유의미한 지표를 제공합니다. 특히, 북한 내 교육 체계와 남한의 교육 체계가 서로 다르기 때문에, 북한이탈주민의 학력 인정 및 남한 사회 정착 지원 정책 수립에도 중요한 참고 자료로 활용됩니다.
