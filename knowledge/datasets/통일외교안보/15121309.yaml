description_portal: 한국국제협력단(KOICA)이 수행 중인 개발협력사업에서 현지 파견 활동 및 사업 운영에 활용되는 다양한 전달 채널(communication channels) 정보를 정리한 자료입니다. 각 채널은 현지 사무소, 협력 기관, 지역사회 파트너, 봉사단원, 기술지원 인력, 현지 정부기관 등과 같은 다양한 주체로 구성되어 있으며, 이를 통해 사업 정보가 어떤 네트워크를 통해 전달되는지 구조적으로 파악할 수 있습니다. 또한 이를 바탕으로 KOICA의 현지 대응 체계와 협업 체계를 개략적으로 이해할 수 있습니다. 전세계 데이터 기준일자에 따라 2년의 통계 일정 소요로 등록일자 -2년에 해당하는 데이터 기준일자를 부여하였습니다.
