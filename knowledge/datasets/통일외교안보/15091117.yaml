summary_user: 국가별로 ISO 2자리·3자리·숫자 국가코드와 영문명·한글명, 그리고 공통 대륙코드·행정표준코드·외교부 직제 기준의 대륙명을 한 행에 담은 국가 표준코드 마스터 파일(csv, 약 17KB)이다. 출입국·무역·관광 통계를 다루는 분석가가 'GHA나 288 같은 국가코드가 어느 나라이고 어느 대륙에 속하는가'를 확인하거나, 국적별 데이터를 한글 국가명·대륙 단위로 묶어 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터의 ISO 코드나 국가명(한글·영문)과 값을 맞춰 연결하는 매핑표로 쓴다.
