summary_user: 국가·지역별 ISO3166-1 표준코드(2자리·3자리·숫자)와 한글·영문 국가명을 국가 한 건당 한 행으로 담은 코드 목록으로, API 전체 251건이 수신됐다. 출입국·무역·관광 통계의 국적 표기를 표준코드로 맞추거나 한글 국가명으로 ISO 코드를 찾을 때 쓴다. 전역 조인 키는 없어 국가명 또는 ISO 코드 값을 직접 매핑하는 방식으로 다른 국적 데이터와 잇고, 같은 기관의 다른 코드와는 해당 코드로 연결한다.
description_portal: '국가·지역별 표준코드 목록 조회: 한글 국가 명 또는 영문국가 명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용 )로 국가 표준코드에 대한 목록 조회 - 국가별 ISO3166-1 표준코드 및 한글명칭, 영문명칭 정보를 제공하는 공공데이터 API 서비스외교부에서 보유하고 있는 국가별, 지역별 ISO3166-1 표준코드(2자리, 3자리) 및 한글명칭, 영문명칭을 API 서비스 제공합니다.국가는 231개 제공되며, 제공되는 국가의 코드 예시를 보면1. Ghana 가나 GH GHA 2882. Gabon 가봉 GA GAB 2663. Guyana 가이아나 GY GUY 3284. Gambia 감비아 GM GMB 2705. Bailiwick of Guernsey 건지 GG GGY 8316. Guadeloupe 과들루프 GP GLP 312등의 형식으로 다른 국가의 정보도 제공됩니다.'
