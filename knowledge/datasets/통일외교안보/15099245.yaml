summary_user: 외교부가 연도별로 집계한 여권 발급 건수를 외교관·관용·거주여권, 일반여권 남성·여성, 재외공관 발급과 그 합계로 나눠 담은 전국 단위 집계 파일로, 포털 설명상 2012년부터 2025년까지를 다룬다. 분석가나 기자가 '해마다 여권 발급이 얼마나 늘고 줄었으며, 일반여권 발급에서 남녀 비중이나 재외공관 발급 비중은 어떻게 변했나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 연도 컬럼을 기준으로 출국자 수 같은 다른 연도별 통계와 맞춰 비교하는 정도로만 이어 쓴다.
description_portal: 본 데이터는 연도(year)를 조회 조건으로 활용하여 연도별 여권 발급 현황을 확인할 수 있도록 제공되는 공공데이터입니다. 조회 결과를 통해 각 연도별 외교관여권 발급 수, 관용여권 발급 수, 거주여권 발급 수, 일반여권 남성 발급 수, 일반여권 여성 발급 수 및 재외공관 여권 발급 수를 확인할 수 있으며, 각 항목을 합산한 전체 여권 발급 건수도 함께 제공합니다. 데이터의 제공 범위는 2012년부터 2025년까지이며, 연도별 여권 발급 규모와 유형별 발급 추이를 분석하거나 관련 통계자료를 작성하는 데 활용할 수 있습니다.
