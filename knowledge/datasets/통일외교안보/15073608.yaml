description_portal: '데이터 설명:국방과학연구소가 연구개발 활동을 통해 창출한 특허, 실용신안, 소프트웨어 프로그램 등 모든 지식재산권(IP)의 전 주기를 관리하는 현황 데이터입니다. 본 데이터는 국가 자산인 국방 기술이 법적으로 어떻게 보호받고 있는지, 그리고 어떤 권리가 유효한지를 보여주는 공신력 있는 지표입니다. 기업 입장에서는 특정 기술을 사업화하기 전 특허 침해 여부를 사전에 검토(FTO 분석)하거나, ADD가 보유한 우수 특허를 검색하여 기술 도입 전략을 수립하는 데 핵심적인 기초 자료로 활용됩니다. 국가적으로는 국방 R&D 예산 투입 대비 성과물 생산성을 객관적으로 증명하는 성과 관리 데이터로서의 가치를 지닙니다.상세 컬럼 설명:지식재산권 명칭: 발명의 핵심 기술적 특징을 담은 공식 명칭입니다. "심층 강화 학습을 이용한 네트워크 공격 경로 탐지"와 같이 기술의 구체적인 구현 내용이 포함됩니다.출원구분/출원국: 특허, 프로그램 등의 권리 형태와 해당 권리가 효력을 발휘하는 국가를 명시합니다. 이는 해외 시장 진출을 고려하는 기업에게 중요한 정보가 됩니다.출원/등록 번호 및 일자: 법적인 효력이 발생하는 시점과 고유 식별 번호를 제공합니다. 권리의 존속 기간을 계산하거나 법적 분쟁 방지를 위한 증빙 자료로 활용됩니다.등록번호: 최종 등록 결정이 내려진 권리에 부여되는 번호로, 기술의 권리 안정성을 보장하는 핵심 지표입니다.'
