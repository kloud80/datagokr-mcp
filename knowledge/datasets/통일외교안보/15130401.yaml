description_portal: 한국독립운동인명사전편찬 사업은 2015년 광복 70주년과 2019년 3·1운동 및 대한민국 임시정부 수립 100주년을 계기로 한국독립운동사를 집대성하기 위해 시작했습니다. 독립운동가들의 생생한 발자취를 담아내기 위해 애국지사들의 일종의 작은 전기 사전 형태로 편찬하였습니다. 독립기념관에서 편찬하고 있는 독립운동가 인명사전관련 수록자 기본항목 및 수록항목에 대한 기본정보입니다. 주요내용은 이름, 운동계열, 훈격, 출생지, 관련단체, 활동내역, 이미지 파일 정보 등으로 구성되어 있습니다.본 자료는 독립운동가 인명사전 편찬과정에서 발굴한 이미지 정보에 관한 내용으로 독립운동가와 관련있는 사진, 문서, 영상에 목록 정보로 10,867건이다.
