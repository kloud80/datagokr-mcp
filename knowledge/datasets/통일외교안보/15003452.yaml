summary_user: 한국국제교류재단이 해외 박물관 한국실과 그 공간에서 열린 전시·교육 지원사업을 사업 단위로 기록한 파일로, 사업연도·사업 기간·사업국가·수혜기관(국문·영문)·사업명·사업유형을 담는다(CSV 약 19KB). 연구자나 박물관·국제교류 실무자가 "어느 나라 어느 박물관이 언제 어떤 한국 전시 사업을 지원받았나"를 확인하거나 국가·연도별 협력 현황을 정리할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업국가 이름이나 수혜기관명을 문자로 맞춰 연결해야 한다.
description_portal: 한국국제교류재단은 세계 각국 박물관에 설치된 한국실과 이 공간을 활용한 전시·교육 프로그램 지원을 통해 한국문화의 지속적 확산과 현지 관람객의 체험 기회 확대를 목적으로 ‘한국국제교류재단_해외박물관협력 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 2012년 이후 해외 주요 박물관에 마련된 한국실 정보, 해당 공간에서 개최된 전시사업 세부 내용, 사업 기간 등 다양한 정보를 포함합니다. 자료는 연 1회 갱신되며, CSV, XML, JSON 등 다양한 포맷으로 제공되어 누구나 자유롭게 활용할 수 있습니다. 해외 박물관의 한국문화 전시 현황 분석, 국제교류 정책 연구, 전시 기획, 박물관 협력사업 평가, 한류 확산 효과 분석, 학술연구, 문화콘텐츠 개발, 글로벌 네트워크 구축, 교육자료 제작, 데이터 기반 시각화 등 다양한 분야에서 활용이 가능합니다
