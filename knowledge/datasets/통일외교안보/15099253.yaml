summary_user: KF 공공외교 사업과 KOICA ODA 사업을 사업 단위로 한데 모아 국가명·대륙명·사업유형·사업명(국문·영문)·사업 기간·수혜기관·사업연도를 담은 건별 원장 CSV 파일(약 1.9MB)이다. 연구자나 기자가 '특정 국가·대륙에서 연도별로 어떤 ODA·공공외교 사업이 어느 수혜기관과 진행됐는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가명·국가영문명을 국가 표준코드 등과 이름으로 맞추거나 KOICA 조달·발주 자료와 사업명으로 매칭해 이어 쓴다.
description_portal: 한국국제교류재단은 공공외교와 개발협력의 시너지 창출을 위해 ‘한국국제교류재단_융합_KF-공공외교 사업 정보_KOICA-ODA 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 KOICA-ODA 사업정보 KF-공공외교 사업 정보로 ODA 사업정보와 공공외교 사업정보의 사업명, 사업 시작일, 사업 종료일, 사업연도 등 핵심 정보를 통합 제공합니다.  REST API와 CSV, JSON 등 오픈 포맷으로 제공되어 누구나 무료로 활용할 수 있습니다. 해당 데이터는 개발도상국 협력사업 분석, 국제교류 정책 연구, 외교전략 수립, 수혜기관 네트워크 파악, 사업성과 평가, 언론 보도, 글로벌 프로젝트 기획, 데이터 기반 시각화, 학술연구, 후속 협력사업 발굴 등 다양한 분야에서 활용됩니다. 일부 사업의 경우 데이터 미집계로 파일 내 공란이 있을 수 있습니다.
