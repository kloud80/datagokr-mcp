summary_user: 전 세계 380여 개 재외공관(대사관·총영사관 등)의 홈페이지 정보를 공관·언어 버전별 행 단위로 담은 파일로, 공관 코드·공관명·사이트 아이디·언어 구분·타임존 코드·홈페이지 주소(URL)를 포함한다. 해외 체류 국민이나 여행자가 '이 나라 우리 대사관 홈페이지 주소가 무엇이고 한국어·영어·현지어 페이지는 어디인가'를 찾을 때나, 서비스 개발자가 국가별 공관 링크 목록을 만들 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 국가 표준코드·여행경보 등 외교부 데이터와는 공관명·국가명 매핑이나 같은 기관 코드를 맞춰 이어 써야 한다.
description_portal: 해외 각국 380여개의 재외공관에 대한 상세 파일 데이터입니다. 재외공관 코드,재외공관명,사이트아이디,언어구분,사이트타입,타임존일련번호,타임존코드상세,공관일련번호,공관코드상세,홈페이지 데이터를 포함하고 있습니다.아래 예시와 같은 정보를 담고 있습니다.  ( *공관코드의 경우 의미를 가지는 코드는 아닙니다.)대사관 의 홈페이지 주소(URL)와 명칭의 국문 버전, 영문 버전, 현지 언어 버전(영문명과 다를 경우) 을 포함하고 있습니다.  예시 ) 주 미국 대한민국 / http://overseas.mofa.go.kr/us-ko/index.do 등
