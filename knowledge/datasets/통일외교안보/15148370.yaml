summary_user: 병무청이 운영하는 병역진로설계지원센터 11곳(서울·부산·울산·대구·수원·광주·대전·춘천·창원·인천·의정부)의 센터명, 기본·상세 주소, 대표전화, 위치 참고 내용, 관할 지방병무청을 센터 1곳당 한 행으로 담은 전국 목록 파일이다. 현역입영대상 판정을 받은 청년이나 그 가족이 입영 전 군 복무와 전역 후 진로를 상담받으려 할 때 가까운 센터와 연락처를 찾는 데 쓴다. 전역 조인 키는 없어 주소를 행정구역으로 맞추거나 관할지방청명으로 같은 기관의 다른 병무 데이터와 이름을 매핑해 잇는다.
description_portal: '청춘디딤돌 병역진로설계란?- 병역판정검사를 받아 "현역입영대상"으로 나왔는데, 바로 입영해야 할까?- 졸업 후 취업도 해야하는데...- 군대 가면 배운 기술도 다 잊어버리는 건 아닌지...==> 입영 전 자신의 적성·전공 등을 고려 군 복무 및 전역 후 진로를 체계적으로 설계하도록 지원하는 프로그램1. 병역진로설계지원센터 위치 안내 - 총 11개 센터가 있으며, 서울,부산,울산,대구,수원,광주,대전,춘천,창원,인천,의정부센터 가 있음. (※세부위치는 첨부파일 참고)2. 실시간 상담예약- 병무청 누리집 : https://www.mma.go.kr/byjr/01/bYJRSchedule.do?mc=mma0003263* 총 데이터 건수가 11건이며, 변경이 이루어지는 경우 수정 등록하겠습니다.'
