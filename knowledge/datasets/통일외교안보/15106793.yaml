description_portal: '대한민국 국군 장병 대상의 대학 원격 강좌 교육 과정상 개설된 강좌를 각각의 국군 장병이 수강하여 인정 받은 학점에 대한 데이터입니다. 군 장병이 군 e-러닝 시스템(https://www.narasarang.or.kr/)을 통해 접속하여 온라인으로 수강한 학점에 대한 것으로, 수강 대학과 년도, 학기, 강좌명, 학점 등을 상세하게 나타내고 있습니다. 해당 데이터를 통해 국군 장병의 원격 강좌 이수율과 취득 학점을 파악할 수 있으며, 원격 강좌 제도를 개선하는 데에 도움을 주는 것이 가능합니다.* 데이터 종류: 원시데이터(개인정보 비식별화)'
