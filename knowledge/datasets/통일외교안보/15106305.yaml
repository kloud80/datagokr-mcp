description_portal: 대한민국 국군 해군 예하부대인 해병대 장병들의 군수품 일종인 피복류(전투복, 생활복, 전투화 등)을 원활하게 보급하기 위해 측정한 장병들의 체형 정보 데이터입니다. 2024년 1월 측정한 것으로 대대(2개 이상의 중대 또는 포대로 구성된 단위부대), 소대(군대 편성 단위) 정보를 비롯하여 엑스레이(X-RAY) 결과, 신장, 가슴 둘레, 허리 둘레, 기장, 비고 순서대로 측정 결과를 상세히 확인할 수 있습니다. 해당 데이터를 통해 해병대 장병들이 체형에 맞는 피복을 순조롭게 보급 받는 데에 도움을 줄 수 있습니다.
