summary_user: 2018년 남북 사회문화협력사업 승인 건을 사업별로 담은 원천 목록으로, 포털 설명 기준 총 5건이며 문서명·상세목적·승인일자·처리상태·승인단체명(신청자상호)을 담는다. 연구자나 기자가 '2018년에 어떤 단체가 어떤 목적으로 북한과의 사회·문화 교류 사업을 승인받았나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 협력사업 승인내역이나 허가법인 데이터와는 단체명(신청자상호)을 이름으로 맞춰 연결해야 한다.
description_portal: 통일부에서 제공하는 ‘통일부_사회문화협력사업 승인내역" 데이터는 2018년 사회문화협력사업의 승인내역 데이터입니다. 본 데이터는 총 5건의 승인내역을 포함하며, 각 사업별로 문서명, 상세목적, 승인일자, 처리상태, 신청자상호(승인단체명) 등의 항목으로 구성되어 있습니다.본 데이터는 남북 사회·문화 교류의 실제 현황과 정책 추진 과정을 이해하는 데 중요한 참고자료가 됩니다. 해당 데이터는 남북 사회·문화 교류 관련 현황 파악, 단체별 사업 추진 내역 검토, 정책 연구 및 분석 등 다양한 목적으로 활용하실 수 있습니다.
