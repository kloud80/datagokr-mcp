summary_user: 모집병 지원 시 내야 하는 구비서류 목록을 군별(육군·해군·공군·해병대), 모집분야별, 모집특기별로 나눠 서류 항목과 필수 제출 여부(psjechulYn)를 담은 전국 단위 API입니다. 기술행정병 등 특정 특기에 지원하려는 사람이 '이 특기에 어떤 서류를 꼭 내야 하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없고, 군 구분·특기 코드와 이름(gsteukgiCd 등)을 매개로 같은 병무청의 모집병 특기·배점·접수현황 데이터와 이름·코드 매핑으로만 이어 쓴다.
description_portal: '모집병 지원 시 구비서류 목록을 확인할 수 있는 서비스입니다. 군별(육군, 해군, 공군, 해병대), 모집분야별(기술행정병, 일반/전문기술병 등), 모집특기별로 정보가 구분되어 있습니다. 예) 기술행정병 00특기 제출서류: 자격면허증 사본, 생활기록부 사본, 군사특기 관련 경력증명서, 국가유공자증명서, 헌혈 및 사회봉사활동 증명서 등 응시지방병무청에서 필요 시 지원자에게 제출해야 하는 서류, 제출 방법, 제출 기한 등을 개별 안내하며, 병무청 누리집- 군지원(입영신청)안내- 지원서 작성/수정/취소- 서류제출 메뉴에서 파일 등록할 수 있습니다.'
