summary_user: KOICA 해외봉사단(WFK)의 모집 예정 공고를 봉사단 유형·직종·대륙·국가·파견기관·활동내용 단위로 한 행씩 담은 파일(csv, 약 1.09MB)입니다. 해외봉사단 지원을 준비하는 사람이 '내 직종으로 어느 나라, 어느 파견기관에 어떤 활동으로 모집이 예정돼 있나'를 미리 확인하는 데 쓴다. 전역 조인 키나 국가 코드가 없어 다른 KOICA 사업·국가별 협력사업 데이터와는 국가명·기관명 같은 이름 매칭으로만 연결한다.
description_portal: '한국국제협력단(KOICA)이 운영하는 해외봉사단(WFK: World Friends Korea)의 모집예정 공고 정보를 사전에 제공하는 자료입니다. 모집 예정 국가와 활동 유형, 직종, 파견기관, 활동 분야, 모집 인원, 예상 모집 시기 등의 핵심 항목이 포함되어 있어, 지원자들이 미리 준비하고 대응하도록 돕습니다. 해외봉사단에 참여를 희망하거나 관심이 있는 지원자는 모집 정보를 통해 지원에 필요한 필수정보를 얻을 수 있고, 이에 따라 미리 지원계획을 수립하거나 필요한 역량을 준비할 수 있습니다. 이는 봉사단 참여를 촉진하는 효과를 야기할 수 있으며, 장기적인 봉사단 파견기조와 과정의 투명성 확보에도 도움이 됩니다.'
