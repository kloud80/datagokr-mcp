summary_user: 나토목록제도에서 공통으로 쓰는 군 보급품 지정품명 목록을 품명부호별로 담은 원천 목록 파일로, 한글·영문 품명과 품명 정의, 품목식별지침부호를 함께 담는다(전국·비공간, CSV 약 11.7MB). 군수 담당자나 방산 업체가 신규 품목을 등록하거나 물자를 분류할 때 "이 품목의 공식 지정품명과 정의는 무엇인가"를 확인하는 데 쓴다. 품명부호(defense_item_name_cd)가 실측 조인 키이므로 같은 부호를 가진 다른 방위사업청 군수품 목록·재고 데이터와 이어 품명과 정의를 붙이는 데 쓴다.
description_portal: 군 보급품의 지정품명 목록을 제공합니다. 지정품명은 동일 품목에 동일한 명칭이 부여될 수 있도록 나토목록제도에서 공통으로 사용하는 공식 명칭을 의미합니다. 해당 데이터를 활용하여 군수품 관리 과정에서 발생할 수 있는 혼선을 줄이고 표준화된 체계를 확립할 수 있습니다. 또한 국제 간 호환성을 보장하여 동맹국 간 군수 협력을 원활히 지원할 수 있으며 군수 지원 업무의 효율성과 정확성을 높이는 데 활용됩니다. 축적된 목록은 신규 품목의 등록과 관리 기준 마련에도 중요한 기초 자료로 사용됩니다.
