description_portal: 육군3사관학교 생도들의 종교 행사 참석자 수를 나타낸 데이터입니다. 종교 행사간 종교별(기독교, 천주교, 불교, 원불교, 기타 등)로 참석자 수와 비율을 상세하게 설명하고 있습니다. 해당 데이터는 생도들의 종교별 행사 참여도를 통해 종교적 다양성을 파악할 수 있으며, 특정 종교에 치우치지 않는 종교적 중립성을 유지하는 것이 가능합니다. 또한, 종교 자유 보장 정도를 확인하여 가치관을 반영할 수 있는 중요한 자료가 될 수 있습니다.* 주 단위로 집계를 하고 있으며, 매분기마다 업데이트 진행할 예정입니다.
