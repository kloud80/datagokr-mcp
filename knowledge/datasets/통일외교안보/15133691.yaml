description_portal: '한국국제협력단(KOICA)이 운영하는 해외봉사단(WFK: World Friends Korea)의 모집정보를 제공합니다. KOICA는 개발도상국의 수요와 우리나라가 비교우위에 있는 분야를 종합 고려하여 적합한 봉사단원을 모집하고 있습니다. 이에 동 데이터 주요 내용에는 모집공고 제목, 공고일이 포함되어 있고, 이를 통해 지원 희망자들이 필수 정보를 한 눈에 확인할 수 있습니다. KOICA 봉사단 모집선발에 관심이 있으신 경우 봉사단 홈페이지(kov.koica.go.kr)에서 내용 확인 후 관련 절차를 진행하실 수 있습니다.'
