description_portal: 본 데이터는 광주광역시 관내 보훈단체 13개소의 관리 현황을 체계적으로 정리한 자료입니다. 각 보훈단체의 기본적인 일반 현황을 확인할 수 있도록 단체명, 대표자 성명, 회원 수, 단체 소재지 등 주요 항목을 포함하고 있으며, 단체별 비교와 행정적 관리·지원 업무에 활용할 수 있도록 구성되어 있습니다. 특히 지역 내 보훈대상자의 조직 현황을 파악하고, 보훈단체 운영의 기초자료로 제공하기 위함이며, 5·18 관련 단체는 본 데이터에서 제외되었습니다. 해당 자료는 광주광역시의 보훈정책 수립, 단체 지원사업 검토, 현황 모니터링 등 행정 전반에 걸쳐 활용될 수 있습니다.
