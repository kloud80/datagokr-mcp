description_portal: '- 전라남도와 국제 도시 간  자매결연 및 우호교류 등 협력 추진 중인 해외 지방자치단체(도시), 인구, 면적, 결연 일자 등의 정보가 포함되어 있습니다.- 전라남도는 국제적인 우호 교류를 통해 다양한 문화와 경제적 협력을 증진하고 있으며, 자매결연을 통해 상호 이해와 우정을 쌓아가고 있습니다. 이러한 교류는 지역 발전과 국제적인 인지도 향상에 기여하고 있습니다.- 문화 행사 : 양 도시 간의 문화 행사와 축제를 통해 상호 문화를 이해하고 교류하고 있습니다.- 교육 프로그램 : 학생 및 교사 교환 프로그램을 통해 교육 분야에서의 협력을 강화하고 있습니다.- 경제 협력 : 무역과 산업 분야에서의 협력을 통해 상호 경제적 이익을 도모하고 있습니다.'
