description_portal: 사건 사고가 발생한 국가명, 대륙, 사건사고 예방정보 등 목록정보 및 사고 내용에 대한 상세 정보를 조회할 수 있다.예) 태국사건ㆍ사고 예방을 위한 일반 수칙 ○ 방문국 존중  - 태국인들은 오랜 역사와 문화, 많은 유적과 아울러 한 번도 외세의 지배를 받지 않았다는 점 등에 대해 자랑스러워하고 또한 자존심이 높습니다. 방문국의 문화와 국민을 존중하는 것은 외국을 방문하는 관광객이 반드시 지녀야 하는 마음가짐입니다.  - 방문기간 중 태국인들이 소중히 여기는 왕실, 종교, 문화, 유적, 관습 등을 공공연히 비하하거나 조롱하는 언행은 자칫 사건사고 발생의 원인이 될 수 있습니다. ○ “자국민 우선” 명심  - 외국인과 내국인을 차별대우해서는 안되는 것이 원칙이나 사실상 어느 나라든 내외국인간 시비가 발생하면 경찰 등의 공무원이 가급적 자국인에게 다소 호의적으로 처리하려는 것은 인지상정입니다. 따라서 외국을 방문 중에 현지인과 시비가 발생할 경우 불리한 입장에 처할 가능성이 있으므로 항시 언행에 주의하여 애초에 시비 거리가 발생하지 않도록 하는 것이 가장 바람직합니다.  - 만약 시비가 발생하여 경찰 등의 공무원이 자신에게 불리하게 일처리를 하고 있다는 생각이 들 경우에도 큰소리로 고함을 지르며 항의하거나 물리적인 저항을 자제하시고 침착한 가운데 논리적인 반박을 하셔야 하며, 대사관의 도움이 필요한 경우 즉시 전화 등으로 조력을 요청하십시오.
