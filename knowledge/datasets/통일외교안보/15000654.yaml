summary_user: 외교부가 국가별로 작성한 사건사고 예방정보를 국가명(한글·영문), 대륙, 예방 수칙 본문(news), 작성일, 국기·지도 이미지 주소와 함께 국가 단위 목록·상세로 담는다. 해외여행객이나 여행사가 '태국에서 현지인과 시비가 붙지 않으려면 무엇을 조심해야 하나'처럼 방문국별 사건사고 예방 수칙을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 여행경보·안전공지 등 다른 해외안전 데이터와는 국가명(name, ename) 매핑이나 같은 기관 데이터의 국가 코드로 이어 써야 한다.
limits: 개별 사건사고 발생 건이나 통계가 아니라 국가별 예방 안내문이므로 실시간 사고 현황이나 여행경보 단계 판단에는 쓰지 못한다. 공통 국가 표준코드 필드가 확인되지 않아 다른 데이터와 붙일 때 국가명 표기 차이에 주의해야 한다.
