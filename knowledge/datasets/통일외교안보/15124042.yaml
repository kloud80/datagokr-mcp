description_portal: 한국국제교류재단은 국제교류기금의 투명한 운용과 국민의 알 권리 보장을 위해 ‘한국국제교류재단_국제교류기금 월별 지출내역’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 한국국제교류재단법 제13조에 근거해 설치·운용되는 국제교류기금의 월별 지출 현황을 회계연도, 회계월, 단위사업, 지출금액 등 항목별로 제공합니다. 연 1회 정기적으로 갱신되며, CSV, XML, JSON 등 다양한 포맷으로 누구나 무료로 활용할 수 있습니다. 이 자료는 예산 집행의 투명성 검증, 공공기관 재정 분석, 정책 연구, 언론 보도, 국제교류사업 평가, 회계자료 작성, 데이터 기반 시각화, 시민단체의 감시활동, 학술연구, 내부관리 등 다양한 분야에서 활용할 수 있습니다
