summary_user: 방위사업청 무기체계 개발 사업에서 국산화가 완료된 품목을 사업명·품명·부품관리번호·재고번호·도면번호·규격번호·계약업체 단위로 한 줄씩 담은 목록 파일(CSV, 약 3.3MB)이다. 방산업체나 부품 협력사가 특정 무기체계 사업에서 어떤 부품이 국산화됐고 어느 업체가 계약했는지 확인할 때, 분석가가 국산화 성과와 업체 참여 현황을 집계할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 국방전자조달 데이터와는 재고번호·규격번호·업체명 같은 이름·코드를 직접 맞춰 이어야 하며, 사업자번호가 없어서 기업 단위 연계도 업체명으로만 할 수 있다.
limits: 사업자번호 같은 공통 키가 없어서 입찰·계약 데이터나 기업 정보와 정확하게 조인하기 어렵다. 국방전자조달은 나라장터와 별도 시스템이므로 일반 정부조달 데이터와 섞어 해석하면 안 된다. 공간 단위가 없는 전국 자료라 지역별로 나눠 분석하는 데는 맞지 않는다.
