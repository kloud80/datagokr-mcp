summary_user: 외교부가 모은 국제기구 공석 공고를 전문 분야별로 묶어 공고 한 건 단위로 담으며, 기구·직위명·근무 국가와 도시·경력 요건·등록일과 마감일·모집 상태 등을 포함한다. 국제기구 진출을 준비하는 구직자가 "내 전공 분야에서 지금 지원 가능한 유엔 공석이 어디에 있는가"를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 외교부의 기구별·JPO·UNV·인턴십 공석정보와는 기구명·국가명 같은 이름 매칭으로만 이어 쓴다.
description_portal: '[요약 정보]전문 분야별 국제기구 공석정보 조회가 가능한 분야별 공석정보 서비스 API입니다.[상세 정보](국제기구공석정보) 외교부에서 구축하여 보유하고 있는 국제기구 채용정보(국제기구 채용, 국제기구인사센터 소개 등), 국제기구진출설명회/국제기구 진출 한국인 초청 간담회(동영상 자료, PPT 자료 등), 유엔 공석정보(최근 공석정보, 기구별 공석정보, 분야별 공석정보 등), 기타 공석정보(JPO/UNV/인턴십) 등 국민이 쉽게 제공받아 활용할 수 있도록 표준화 방식으로 개방한 공유 서비스입니다.'
