summary_user: 방위사업청 국방전자조달(D2B)의 군수품 입찰결과와 협상결과를 입찰공고 단위로 담는 API로, 낙찰 여부·개찰일시·발주기관·계약방법·입찰방법 등을 제공한다. 검증 호출 기준 2026-09-02~2026-10-02 구간에서 전체 504건이 조회되었으며, 분석가나 방산 사업자가 특정 기간 군수품 입찰의 낙찰 결과와 경쟁 현황을 확인하는 질문에 쓴다. 전역 조인 키는 없고 발주기관코드(orntCode)나 공고번호·공고차수 같은 같은 기관 코드로만 다른 국방조달 데이터와 이어지며, 나라장터와는 별도 체계라 이름·코드 매핑이 필요하다.
description_portal: 방위사업청 국방전자조달시스템(D2B)에서 제공하는 군수품조달 입찰결과 정보 데이터입니다. 본 데이터는 국내·국외 조달 입찰의 입찰결과 및 협상결과를 확인할 수 있으며, 입찰공고 단위로 낙찰 여부, 개찰일시, 발주기관, 요구년도, 계약방법, 입찰방법, 업무구분(물품/용역/시설) 등의 핵심 항목을 포함합니다. 또한 입찰별 참가업체 정보와 복수예비가격(기초예비가격 관련 정보) 등 세부 결과 데이터도 함께 제공하여, 입찰 경쟁 현황 분석, 낙찰 결과 모니터링, 업체 참여 추이 분석, 조달 투명성 분석 등 군수품 조달 업무 및 정책 분석에 활용할 수 있습니다.
