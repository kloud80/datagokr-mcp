description_portal: '국가보훈부 보훈심사위원회의 월별 상이등급 심사현황 정보를 제공합니다.ㅇ 제공 항목 : 심사 대상구분, 연간 접수 누계, 당월 접수 소계, 당해연도 상이급수별 심사 완료 누계, 당월 심사완료 소계, 심사 진행 중 안건 누계※  ‘상이등급’ 이란?부상의 정도를 등급으로 구분한 것을 뜻합니다. 법령으로 정한 분류기준(*)에 따라 1급(중상이)부터 7급(경상이)으로 분류하며 상이 부위 및 상태,사회생활에 제약을 받는 정도 등을 종합적으로 고려하여 신체검사 및 보훈심사위원회 심의를 거쳐 판정합니다.* 국가유공자법 시행령 [별표3] 상이등급구분표'
