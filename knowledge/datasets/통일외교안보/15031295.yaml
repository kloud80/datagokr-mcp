description_portal: 각 군 모집병 지원서 접수현황을 제공하는 서비스입니다.군별(육군, 해군, 공군, 해병대), 모집회차별(입영연월별), 입영부대별(육군훈련소 등), 모집분야별(기술행정병, 일반/전문기술병, 전문특기병 등), 모집특기별로 정보가 구분되어 있습니다.접수시작일, 접수종료일, 모집인원(계획인원), 접수인원, 과부족인원, 지원율 정보가 포함되어 있습니다.병무청 누리집- 군지원(입영신청)안내- 지원서 작성/수정/취소- 실시간지원현황 메뉴에서 군 선택- 모집구분 선택- 입영연월 선택- 접수목록 선택- 해당회차 선택- 조회하여 모집병 군지원 접수현황을 실시간으로 확인할 수 있습니다.
