summary_user: 각 군(육군·해군·공군·해병대) 모집병 지원서의 접수현황을 모집회차·입영부대·모집분야·특기별로 담은 API로, 접수 시작·종료일, 접수인원, 선발인원, 과부족, 지원률을 포함하며 전체 9,188건이다. 입영을 준비하는 국민이나 분석가가 특정 군·특기의 지원률이 얼마나 되고 접수 인원이 모집 계획에 못 미치는지를 확인하는 데 쓴다. 전역에서 통용되는 조인 키는 없어서, 군사특기코드(gsteukgiCd)나 군구분명 같은 같은 기관 코드로 병무청의 다른 모집병 데이터와 이름·코드 매핑을 거쳐 이어 쓴다.
limits: 전체 9,188건 중 검증 수신은 1,000행뿐이라 전량을 모으려면 페이지를 10회 이상 반복 호출해야 한다. 확인된 데이터 기간은 2024-09-23~2025-07-17이며, 실측 최신 행 날짜가 관측일 기준 442일 전이라 최근 회차가 들어 있는지는 별도로 확인해야 한다. 전역 조인 키가 없어 다른 기관 데이터와 직접 결합할 수 없다.
