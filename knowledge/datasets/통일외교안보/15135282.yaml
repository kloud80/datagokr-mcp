summary_user: 한국보훈복지의료공단 본사와 병원·요양원 등 소속기구가 보유한 물품의 코드 목록을 물품 한 건씩 담은 파일로, 물품명·규격과 대·중·소분류명을 기록한다(전국 범위, 비공간 자료). 공단 납품을 준비하는 사업자나 공공기관 물품관리를 비교하는 분석가가 '공단이 어떤 분류의 물품을 어떤 규격으로 관리하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 물품명이나 분류명을 이름으로 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
description_portal: '한국보훈복지의료공단은 공단 본사 및 산하기관(병원, 요양원 등)으로 구성 되어 있습니다.공단 본사 및 전 소속 기구의 물품별 코드 관리 현황 자료입니다. [데이터 설명]- 순번 :  공단 및 소속기구의 물품코드 개수- 물품명: 공단 및 소속기구 내 보유중인 물품코드명- 품목규격 : 품목의 크기 및 단위(규격이 존재하지 않는 경우 공란으로 기재) - 대분류코드명 :  공구기구, 기계장치, 소프트웨어 등 대 분류코드- 중분류명 :  전동공구, 기계설비 등 대분류의 하위 코드 명- 소분류코드명: 조리기구, 스텐레스 등 중분류의 하위 코드명'
