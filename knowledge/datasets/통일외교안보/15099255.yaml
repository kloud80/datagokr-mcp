description_portal: 한국국제협력단(KOICA)이 수행하는 국가별 개발협력사업의 목록 정보를 체계적으로 정리한 자료입니다. 각 프로젝트에 대한 다운로드URL, 원본파일명, 파일크기 등의 항목을 제공하며, 사업별 보고서에는 사업명, 사업예산, 추진 기간, 대상 국가, 주요 목표 및 기대 효과 등의 핵심 정보를 담고 있어, 사업의 전반적 구조와 특징을 한눈에 파악할 수 있습니다. 또한, 사업 수행 기관과 협력 수원기관, 추진 단계 등의 정보를 포함해 담당 주체와 진행 상태를 명확히 확인할 수 있도록 구성되어 있습니다. 동 데이터는 CSV 기반으로 제공되지만, 제목과 작성일을 이용하여 국가별 협력사업 목록을 조회하는 API서비스도 제공하고 있습니다.
