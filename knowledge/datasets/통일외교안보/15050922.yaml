summary_user: 방위사업청이 해외에서 추진하는 군수품·무기체계 조달사업의 입찰공고를 공고 건별(공고번호·차수)로 담은 CSV 파일로, 공고명·공고상태·공고일자·계약체결방법·공고기관·수요기관·입찰마감·개찰 일시와 장소를 포함한다. 방산·무역 기업이 "지금 어떤 국외조달 입찰이 열려 있고 마감과 개찰이 언제인가"를 확인하거나, 분석가가 국외조달 공고 동향을 살피는 데 쓴다. 전역 조인 키는 없어서 같은 방위사업청 국방전자조달 계열의 입찰결과·계약정보와는 공고번호·차수나 공고기관코드·수요기관코드 같은 기관 코드로 맞춰 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑으로만 연결한다. 국방전자조달은 나라장터와 별도 체계여서 나라장터 공고 데이터와 그대로 합쳐지지 않는다. 포털 설명에 따르면 비전자입찰 공고는 마감일 정보가 빠져 있을 수 있다.
