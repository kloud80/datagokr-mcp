description_portal: 한국국제협력단(KOICA)이 수행한 개발협력사업을 지역별, 분야별로 분류하여 집행실적을 정리한 통계 자료입니다. 사업지역(아시아, 아프리카, 중남미, 중동 등)별로 주요 분야(보건, 교육, 농업, 인프라 등)에 집행한 내역을 포함하고 있어, KOICA의 재원 배분 구조를 체계적으로 파악할 수 있습니다. 동 데이터는 지역별과 분야별 ODA 예산 규모와 비중의 변화 파악, 성과 대비 예산 사용 분석 등에 기초자료로 활용될 수 있습니다. 또한 본 통계는 정기적으로 업데이트되며, KOICA의 재정 투명성 강화와 정책 책임성 확보에도 기여합니다.동 통계데이터의 원천데이터는 한국국제협력단_KOICA ODA 실적보고 로데이터 에서 확인 가능합니다.
