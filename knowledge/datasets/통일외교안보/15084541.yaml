description_portal: '「민법」 제32조 및  「 국가보훈부 소관 비영리 법인 설립 및 감독에 관한 규칙 」 에 의해 설립허가 된 국가보훈부 소관업무와 관련된 비영리법인 현황입니다.독립, 호국, 민주 관련 구분을 가지며, 재단법인과 사단법인이 포함됩니다.주요 국가유공자 또는 보훈기념행사와 관련된 기념사업회와 유족회 등이 포함되어 있으며, 국가보훈법령에 따른 공법단체와 각 지자체 또는 행정안전부 소관 비영리법인은 포함되어 있지 않습니다.※ 제공 항목:  기준일자, 연번, 구분, 허가연월일, 법인명, 법인분류ㅇ 데이터 변경 안내- 2024년 2분기부터 항목명 "성격"을 "법인분류"로 변경하였습니다.  * 법인 분류 종류 : 재단, 사단'
