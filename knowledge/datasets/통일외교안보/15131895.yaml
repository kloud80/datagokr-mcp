summary_user: 남북 간 회담에서 체결된 합의서를 한 건씩 담는 원천 목록으로, 합의서명·개최회담·회담분야(정치·경제·군사·인도·사회문화·기타)·국가·지역·시설·회담 시작·종료일·합의일·본문 내용·원문 파일과 다운로드 주소를 제공하며 범위는 전국·비공간이다. 연구자나 기자, 일반 국민이 '특정 연도에 군사 분야에서 어떤 남북합의가 어디서 체결됐고 본문은 무엇인가'처럼 분야와 연도로 합의서를 찾아 원문을 확인할 때 쓴다. 전역 조인 키는 없어서, 같은 통일부의 남북회담 데이터와는 회담명(sj)·회담일자 같은 이름·날짜 매칭으로만 이어 쓴다.
description_portal: ① 회담분야 키워드와 회담년도 키워드를 기준으로 ②남북합의서 목록 및 내용(개최회담, 회담분야, 국가, 지역, 시설, 제목, 내용, 회담일자, 파일명, URL정보)을 조회하는 ③통일부 남북관계 남북합의서 조회 서비스 API
