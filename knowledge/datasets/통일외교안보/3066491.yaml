summary_user: 전문특기병 지원 때 적용되는 선발배점 기준을 군별·모집특기별로 담은 API로, 모집연도·모집차수별로 자격면허·전공학과(학제·학년·재학/수료, 직접/간접 관련 여부)·출결상황 같은 배점 구분과 기준값, 접수·입영 기간을 함께 싣는다. 전문특기병 지원을 준비하는 입영 대상자가 '내 자격증이나 전공으로 이 특기에서 몇 점을 받는가'를 확인하는 데 쓴다. 전역 조인 키는 실측에서 찾지 못해, 같은 병무청 모집병 API(특기·지원가능·접수현황 등)와는 군 구분 코드, 모집특기 코드, 모집연도·차수 같은 기관 내 코드나 이름 매핑으로만 잇는다.
limits: 이벤트 주기 데이터로 모집 공고 때 생성된 뒤 바뀌지 않으므로, 최신 차수 기준인지 모집연도·차수로 확인해야 한다. 전국 단위 비공간 데이터라 지역별 분석에는 쓰지 못하며, 세부 배점 해석은 병무청 누리집 모집 공지를 함께 봐야 한다.
