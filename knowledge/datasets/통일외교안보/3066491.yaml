description_portal: 모집병 모집분야 중 전문특기병 지원 시 선발배점 기준을 확인할 수 있는 서비스입니다.군별, 모집특기별로 정보가 구분되어 있습니다.자격면허, 무도단증, 전공학과(학제(2년제, 3년제, 4년제 등), 학년(1~4학년이상), 재학/수료여부, 직접/간접관련학과 여부), 출결상황 등에 따라 전문특기병 배점을 구분합니다. 전문특기병 세부 선발배점 관련 자세한 사항은 병무청 누리집- 군지원(입영신청)안내- 안내 및 지원절차- 전문특기병- 모집안내, 군사특기 임무 및 설명 메뉴 및 모집 공지를 통해 확인할 수 있습니다.
