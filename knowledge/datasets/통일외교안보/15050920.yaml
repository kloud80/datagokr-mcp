summary_user: 방위사업청과 각 군이 국내에서 조달한 군수품 계약을 건별로 담은 원천 파일로, 2018-07-01부터 2026-12-01까지 전국 43,112건이 들어 있다. 방산 업체나 연구자가 어떤 기관이 어떤 방식·금액으로 누구와 계약했는지, 입찰·계약 동향이 어떤지 살필 때 쓴다. 대표업체 사업자등록번호(bizno)와 대표업체 주소(address)가 있어 사업자번호 기준의 기업 정보나 나라장터와 별도인 국방전자조달 쪽 다른 조달 데이터와 이어 쓴다.
description_portal: 방위사업청 및 각 군이 국내에서 조달하는 군수품에 대한 계약정보를 제공합니다. 계약번호, 계약차수, 계약명 등 세부 항목이 포함되어 있으며 입찰 및 발주 과정에서 확정된 계약 현황을 체계적으로 관리할 수 있도록 구성되어 있습니다. 해당 데이터를 동해 군수품 조달 과정의 투명성을 강화할 수 있으며 계약업체와의 협력 체계를 효율적으로 운영할 수 있습니다. 또한 방산 관련 업체들에게는 입찰 및 계약 동향을 전반적으로  파악할 수 있는 참고자료가 될 것이며 정책 수립 및 연구 목적에서도 활용될 수 있습니다.
