summary_user: 방위사업청 방산수출입지원시스템이 수집한 해외 방산·조달 입찰공고를 공고 한 건 단위로 담으며, 공고명(국문·영문), 국가·권역, 입찰기간, 정보획득일자, 공고형태(입찰공고·조달계획·기타)를 기간 조건으로 조회한다. 방산 수출을 노리는 업체나 분석가가 "이번 달 중동 권역에 새로 올라온 무기체계·부품 입찰공고가 무엇이고 마감이 언제인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가명·권역명 같은 이름 매핑으로만 잇고, 목록의 순번(seqn)은 같은 서비스의 상세 조회에 넘기는 내부 키로 쓴다.
description_portal: (해외입찰정보) 방위사업청 방산수출입지원시스템에서 제공하는 해외입찰정보 OpenAPI 서비스입니다. 본 데이터는 해외 방산·조달 관련 입찰공고 정보를 기간 조건으로 조회할 수 있으며, 공고명(국문/영문), 국가/권역, 입찰기간(시작일~종료일), 정보획득일자, 공고형태(입찰공고/조달계획/기타) 등의 항목을 포함합니다. 또한 상세 조회를 통해 발주기관, 품목명/품목구분, 수량·단위, 화폐단위 및 총금액, 담당자 정보, 원문 URL 등 입찰공고의 세부 내용을 확인할 수 있어 해외 시장 동향 분석, 입찰 모니터링, 방산수출 전략 수립 등 다양한 업무에 활용 가능합니다.
