description_portal: '※ 해당 자료는 샘플데이터로 제공되며 한국데이터산업진흥원(K-data) 데이터안심구역(서울/대전), 충남대학교병원 의료데이터안심활용센터 내에서 전체 해당 원천(Raw) 데이터 열람 및 분석이 가능합니다.○ 목적 :청년기경제적 약자와 간기능 지표 연관성 연구 , 병역판정검사 집단을 대상으로 경제적 약자와 그렇지 않은 집단간의 간기능 이상 위험을 비교 분석하는데 있음○ 대상 : 2022년 ~ 2024년 기간중 병역판정검사 수검자○ 건수 : 67만 2,303건○ 내용: 병무청 병역판정신체검사 항목으로 칼럼명, 병역판정검사 연도, 주소, 신상명세서 작성 내용(경제적약자), 질병상태문진표(간염 등 간질환이 있다) 항목 선택 여부, 신장, 체중, BMI, 혈압(수축기/이완기), 혈액검사 결과(AST, ALT, r-GTP, Albumin, Glucose, HbA1C, Hbs Ag(양성/음성), HCV, Cholesterol, HDL-Chol, TG)※신상명세서 작성내용(경제적 약자) 및 질병상태문진표 "간염등 간질환이 있다" 항목체크자 : 해당 정보는 당사자가 직접 작성한 것으로 검증된 자료 아님※알부민(ALBUMIN) 이상값(501)은 501=5.01g/dl 또는 501mg/dl일 가능성이 높으나 임의로 값을 바꿀수 없음. 해당값은 기계적ㆍ 계산ㆍ 표기 오류로 판단※중성지방(TG)의 경우, 0값일 때 혈액 검사 거부자이며 마이너스 값의 경우 기계적ㆍ 계산ㆍ 표기 오류로 판단○ 특징- 파일 : 1개- 용량 : 69MB'
