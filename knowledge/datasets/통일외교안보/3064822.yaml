description_portal: 한국국제교류재단은 해외에서의 한국학 진흥과 차세대 한국학자 양성을 위해 ‘한국국제교류재단_해외대학 한국학 교수직 설치정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 국가명, 대학명(한글·영문), 조사연도, 학과 개설연도, 교수 인원수 등 주요 항목을 포함하며  CSV, XML, JSON 등 다양한 포맷으로 제공합니다. 설치된 교수진은 한국어, 문화, 문학, 역사, 사회, 정치, 경제 등 다양한 분야에서 강의를 담당합니다. 해당 데이터는 해외 한국학 인프라 현황 분석, 국제교류 정책 연구, 대학별 교수직 설치 동향 파악, 글로벌 협력사업 기획, 한류 확산 효과 평가, 교육기관 비교, 학술연구, 언론 보도, 인재 양성 사례 발굴, 데이터 기반 시각화 등 다양한 분야에서 활용할 수 있습니다
