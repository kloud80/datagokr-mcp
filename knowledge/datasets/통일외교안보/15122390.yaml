description_portal: '한국보훈복지의료공단에서 제공하는 중앙보훈병원 요양병원EMR시스템 내의 요양병원 관련 부서코드 정보(컬럼정보: 부서코드, 부서명, 부서세부명)입니다.* 서울요양병원: 국가유공자의 고령화 및 노인성 질환 증가에 따라 노인전문 의료서비스를 제공하고자 2014년 2월에 개원하여 쾌적한 진료환경, 현대적인 시설을 갖추고 보훈 가족 및 지역 주민의 건강증진 도모, 중앙보훈병원과의 협진 체계 구축으로 진료 편의 제공 등 서비스 제공** 주소: 서울시 강동구 진황도로 61길 53 (우편번호 05368)'
