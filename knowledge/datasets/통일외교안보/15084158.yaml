summary_user: KOICA가 유니세프·유엔난민기구·세계보건기구·세계식량계획 같은 국제기구와 함께 추진하는 개발협력사업을 사업 한 건당 한 행으로 담은 사업 단위 목록으로, 사업명(국문·영문), 시작·종료연도, 미화 예산총액, 대상 국가·지역, 수행기관, 담당부서, 사업단계를 담는다(CSV 약 18KB). 분석가나 정책 담당자가 "어느 국제기구와 어느 나라에서 어떤 규모의 다자협력사업이 진행 중인가"를 파악하거나 다자개발협력 현황을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 KOICA 사업·조달 데이터와는 사업번호·시행계획번호 같은 같은 기관 코드나 국가명·사업명 매칭으로만 연결한다.
description_portal: 한국국제협력단(KOICA)이 국제기구와 협력하여 추진하는 개발협력사업의 목록을 제공합니다. 주요 국제기구로는 유엔아동기금(UNICEF), 유엔난민기구(UNHCR), 세계보건기구(WHO), 세계식량계획(WFP) 등이 있으며, 이들과의 파트너십을 통해 교육, 보건, 식량안보, 평화구축 등 다양한 분야에서 공동사업을 수행하고 있습니다. 동 데이터에는 사업명(국문 및 영문), 시작 및 종료 연도, 예산 총액(원화 및 미화), 대상 국가 및 지역, 수행기관, 담당 부서, 사업 단계 등의 정보가 포함되어 있으며, 이를 통해 국제기구와의 협력 현황을 파악하고, 다자개발협력 전략 수립 및 정책 분석에 활용할 수 있습니다.
