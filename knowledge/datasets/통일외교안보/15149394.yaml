description_portal: '국방품질경영 연구 성과물 공유를 통해 산·학·연·관·군 내 전문가 간 인적 네트워크 형성 및 기술교류를 활성화하여 방위산업과 관련 학술공동체의 발전에 공헌하기 위한 연구회 활동 현황2023년 3개 전문분과 신규 개설(신규 전문분과 : 빅데이터기반운용성연구, 우주위성연구, AI·사이버연구), 학술대회 발표 수는 COVID-19 사태로 개최규모를 축소한 2021년을 제외하고 지속적으로 증가하는 추세2024년 『국방품질연구논집』 게재논문 총 편수는 39편으로 2023년 대비 13건 감소2024년 KCI 등재학술지 선정 대비 게재논문 질적수준 향상을 위해 논문 심사기준 강화논집 게재논문 총 편수 중 외부기관의 게재 비율이 2023년 75%에서 2024년 82%로 증가하여, 논문 투고 주제의 다양성을 확보'
