description_portal: 독립기념관을 관람하고 나서 느낀 점이나 배운 점 등을 후기 형식으로 작성하여 홈페이지를 통해 접수 받았던 자료이다.접수 내용을 검토하여 매년 시상도 하였으나 현재는 접수를 받지 않고 있다.자료의 대상시기는 2018년부터 2021년까지이다.접수 내용 중에서 발췌 대한민국 국군이라면 누구나 한 번씩 가야 한다는 곳, 독립기념관을 휴가 기간을 통해 방문하게 되었습니다 휴가를 받을 수 있다기에 방문한 곳이라 큰 기대를 하고 갔던 것은 아닙니다 하지만 독립기념관에 도착한 후, 넓은 부지와 우뚝 서 있는 탑, 펄럭이는 태극기들을 보며 그저 시간만 보내다 갈 곳이 아니라는 것을 직감할 수 있었습니다 겨레의 뿌리, 겨레의 시련, 겨레의 함성, 나라 되찾기, 새나라 세우기라는 이름의 전시관들을 관람하며 많은 것들을 느낄 수 있었습니다 특히 힘이 없어 나라를 빼앗기는 수모를 당하고 그로 인해 많은 국민이 고통받았다는 것을 보며 국가의 의미와 국가를 지키는 힘인 군사력에 대해 생각해보는 시간이 되었습니다 또한, 독립을 위해 노력하신 분들의 피와 노력이 있었기에 국가가 재건될 수 있었다는 것을 통감하며 군인으로서 가치관과 마음가짐을 재정비할 수 있었습니다 휴가를 위해 방문한 국군 장병들도 관심을 가지고 관람한다면 남은 군 복무기간 동안 더 책임감 있게 임무 수행을 할 수 있는 뜻깊은 관람이 되리라 생각합니다
