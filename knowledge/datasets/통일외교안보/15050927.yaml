summary_user: 방위사업청이 발주한 시설공사 경쟁 입찰의 결과를 입찰공고 1건 단위로 담은 건별 원천 파일로, 전국 4,392건(2024-11-07~2025-12-31)이 들어 있다. 건설업체나 분석가가 특정 시설공사의 낙찰 업체, 낙찰률, 예정가격이 어땠는지 확인하는 질문에 쓴다. 최종낙찰업체 사업자등록번호(bizno)로 기업 단위 자료와 이어 쓰고, 나라장터와 별도인 국방전자조달 데이터이므로 정부조달 분석에서는 사업자번호를 기업 축으로 삼아 맞춘다.
limits: 명세상 갱신은 연간이고 실측 최신 행은 2025-12-31이라, 그 이후 입찰은 담기지 않을 수 있다. 조인 키는 사업자등록번호와 주소뿐이며 공고기관·수요기관 코드는 코드표가 입력에 없어 의미를 확인할 수 없다. 나라장터 입찰과는 별개 체계이므로 합산하려면 따로 맞춰야 한다.
