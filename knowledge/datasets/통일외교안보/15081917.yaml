description_portal: 보훈대상자 중 의료지원대상자에게 진료비 혜택을 제공하는 위탁병원 현황 정보입니다.ㅇ 제공 항목은 기준일, 연번, 지역, 위탁병원명, 종별(의원/병원/종합병원), 진료과수, 병상수, 주소(지역, 상세 분리) 전화번호, 위치정보* 위탁병원이란? - 국가보훈관계법령에 따라 국가유공자와 그 유족 등의 진료를 국가로부터 위탁받아 수행할 의료기관을 "보훈의료 위탁병원"이라 합니다. 보훈병원(전국 6개소)이 없거나 보훈병원으로부터 원거리에 거주하는 보훈대상자의 근접의료 서비스를 제공하기 위해 전국 각지에 지정하여 운영하고 있습니다.
