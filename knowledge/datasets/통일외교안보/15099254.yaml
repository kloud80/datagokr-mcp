description_portal: '한국국제협력단(KOICA)이 수행하는 ODA 사업과 한국국제교류재단(KF)에서 하는 공공외교 사업의 정보를 체계적으로 정리한 자료입니다. 각 사업마다 사업명, 수행 국가, 사업시작일과 종료일, 수혜기관명 등이 포함되어 있어 양 기관에서 어떤 사업이 진행되는지를 파악할 수 있도록 구성되어 있습니다. 동 데이터는 CSV 기반으로 제공되지만, 한글 국가명, 한글 사업명 등으로 KF-공공외교 사업 정보 목록을 조회하는 API서비스도 제공하고 있습니다.1. KOICA-ODA 사업정보 KF-공공외교 사업 정보 목록 조회: 한글 국가명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용), 한글 사업명으로 KOICA-ODA 사업정보 KF-공공외교 사업 정보 목록 조회- KOICA-ODA 사업정보 KF-공공외교 사업 정보로 ODA 사업정보와 공공외교 사업정보의 사업명, 사업 시작일, 사업 종료일, 사업연도 등을 제공하는 공공데이터 API 서비스'
