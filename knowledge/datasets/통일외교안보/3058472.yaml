description_portal: 이 데이터는 국제품질보증 협정 국가 목록 데이터입니다. 국방기술품질원은 「방위사업법 시행령」 제71조에 따라 외국 정부와 국제품질보증 협정을 체결하여 국제 품질보증 협력을 추진하고 있으며, 이를 통해 수출 및 수입 군수품에 대한 정부품질보증 용역을 상호 제공하고, 해외 품질보증 기관과의 협력 및 기술교류를 확대하고 있습니다. 특히, 2024년까지 총 26개국과 협정을 체결하고 있으며, 2027년 방산수출 4대 강국으로 진입을 위해 국제품질보증 협정 확대와 수출품 품질보증 지원을 강화하고 있습니다.
