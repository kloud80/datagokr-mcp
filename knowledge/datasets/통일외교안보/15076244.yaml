summary_user: 외교부가 지정한 국가·지역별 특별여행주의보(철수 권고·즉시 대피 지역 유형과 비고, 위험지도·국기·지도 다운로드 경로, 작성일)를 국가 단위로 담은 API이며, 검증 시 전체 197건이 수신됐다. 해외여행객이나 여행·출장 담당자가 가려는 나라에 특별여행주의보가 내려져 있는지, 어느 지역에 철수 권고가 있는지 확인할 때 쓴다. 전역 조인 키는 없지만 ISO 2자리 국가코드(country_iso_alp2)와 한글·영문 국가명으로 같은 기관의 다른 국가 표준코드 계열 데이터와 이름·코드 매핑해 잇는다.
description_portal: '[요약 정보] 국가∙지역별 특별여행주의보 목록 조회: 한글 국가 명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용 )를 이용하여 국가∙지역별 특별여행주의보 목록 조회- 외교부에서 지정하는 여행 유의, 자제, 제한 등 해외 여행경보 대상국가 목록 및 상세정보의 히스토리내역을 제공하는 공공데이터 API 서비스[응답 정보]현재 개수, 일치데이터 개수, 현재페이지, 페이지 당 갯수, 총개수, 영문 국가명, 한글 국가명, ISO 2자리 코드, 대륙코드, 영문 대륙명, 한글 대륙명, 위험지도 경로, 국기다운로드 경로, 지도다운로드 경로, 철수 권고 비고, 지역유형, 작성일'
team:
  dept: 기획조정실 정보화담당관
services:
