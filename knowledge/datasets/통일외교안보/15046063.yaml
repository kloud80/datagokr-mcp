description_portal: 1962년부터 현재까지 연도별 계급별(병장, 상병, 일병, 이병) 봉급 내역을 체계적으로 정리한 자료입니다.데이터는 기준 시작년월, 종료년월, 계급 정보를 포함해 계급 간 봉급 격차의 역사적 변화 추이를 분석할 수 있도록 구성되었습니다.이를 통해 국방 정책 수립, 사회경제적 연구, 군 복지제도 효과성 평가 등에 활용 가능하며, 엑셀/CSV 형식의 표로 제공되어 정량적 비교, 시각화 도구 연동, 통계 처리가 용이합니다. 데이터 출처는 공식 국방부 오픈데이터 포털의 URL 링크를 통해 접근할 수 있으며, 최신 버전의 자료를 직접 다운로드해 세부 내용을 확인할 수 있습니다.※ 본 데이터 업데이트 주기는 "연간" 입니다.
