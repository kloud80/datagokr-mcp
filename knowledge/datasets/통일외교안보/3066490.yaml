summary_user: 군별(육군·해군·공군·해병대)·모집특기별로 모집병 선발배점 기준을 담은 전국 단위 기준 데이터로, 자격면허(등급·특기 직접/간접 관련성), 전공(학제·학년·재학/수료), 출결(결석일수)에 따른 배점과 모집연도·차수, 접수·입영 기간이 함께 들어 있다. 입대 지원자가 '내 자격증과 전공으로 원하는 특기에 지원하면 몇 점을 받는가'를 따져 보거나, 분석가가 특기별 배점 구조를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 병무청 모집병 데이터(특기·지원가능·접수현황 등)와는 군 구분·모집특기 코드나 이름, 모집연도·차수를 맞춰 연결한다.
description_portal: 모집병 지원 시 선발배점 기준을 확인할 수 있는 서비스입니다.군별(육군, 해군, 공군, 해병대), 모집특기별로 정보가 구분되어 있습니다.자격면허는 자격등급(기사급이상, 산업기사급, 기능사급, 일반 등) 및 특기 관련성(직접관련, 간접관련)에 따라 배점을 구분하고, 전공은 학제(2년제, 3년제, 4년제이상 등), 학년(1~4학년이상), 재학/수료여부에 따라 배점을 구분하고, 출결은 결석일수에 따라 배점을 구분합니다.병무청 누리집- 병무민원- 군지원- 내점수 미리 알아보기 메뉴에서 자격면허 및 전공학력을 입력하여 예상 점수를 확인할 수 있습니다.
