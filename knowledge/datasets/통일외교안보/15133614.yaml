description_portal: 한국국제협력단(KOICA)이 추진하는 청년 인재 대상 영프로페셔널(YP) 사업의 국내 수행기관 목록을 정리한 자료입니다. YP는 청년인재가 개발협력사업 현장경험을 축적할 수 있도록 지원하는 프로그램이며, 동 데이터는 YP가 근무할 수 있는 국내 개발협력 사업수행기관의 이름, 주소, 수행 연도, 회차 등의 내용을 포함하고 있습니다. 인력의 ODA 분야 진출을 위한 네트워크 정보를 제공함으로써 기관 간 협력관계를 분석할 수 있고, 동 내용을 청년 개발협력 시장 혹은 청년 역량강화 정책의 효과를 분석하는 근거 자료로도 활용할 수 있습니다.
