description_portal: 한국보훈복지의료공단 산하 광주보훈병원 재활의학과에서는 월별로 입원 및 외래 환자를 대상으로 다양한 재활치료를 시행하고 있으며, 치료종류별 수행 건수를 구분하여 집계하고 있다. 치료는 집중운동, 방문물리치료, 방문인지작업치료, 특수치료실, 인지치료실, 온열치료, 작업치료실, 언어치료실, 연하치료실, 재활기능, 재활체육 등 12개 항목으로 구성된다. 각 치료는 환자의 상태에 따라 입원 또는 외래로 구분되어 시행되며, 월별로 치료 건수가 기록된다. 이 현황은 치료 종류별, 환자 유형별 치료 이용 상황을 파악하는 데 활용된다.
