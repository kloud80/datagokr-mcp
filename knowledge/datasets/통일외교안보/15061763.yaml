description_portal: 병무청은 25세 이상 병역 미필자 및 복무 중인 사람이  국외로 출국 하기 위해서 사전에 병무청의 허가를 받아야하는 국외여행허가제도를 운영하고 있습니다.  다음은 병역의무자에 대한 연도별과 허가 사유에 따른 목적별 국외여행허가 현황을 공개하고 있습니다. 해당 공개데이터는 국외이주 목적 외 국외여행허가로서 유학, 단기여행, 연수 및 훈련, 승선 및 취업, 국제경기 및 회의, 업무 출장, 기타에 대한 현황으로 구성되어 있으며, 공개데이터 기준은 2018년 ~ 2025년으로 최신 데이터를 홈페이지에 게시합니다.
