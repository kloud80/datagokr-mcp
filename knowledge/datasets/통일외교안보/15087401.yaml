summary_user: KOICA가 국내 NGO의 긴급구호·조기복구·난민 지원 등 인도적지원 활동을 지원한 민관협력사업을 사업 한 건당 한 행으로 담은 목록 파일(csv, 약 13KB)로, 사업명(국·영문), 시작·종료연도, 원화·미화 예산총액, 대상 국가·지역, 수행기관, 사업단계를 담는다. 연구자나 NGO 관계자가 '어느 국가에 어떤 단체가 얼마 규모의 인도적지원 사업을 수행했는가'를 확인하거나 연도·국가별 지원 현황을 집계하는 데 쓴다. 전역 조인 키는 없어 다른 KOICA 사업 데이터와는 사업번호·시행계획번호나 국가명·수행기관명을 이름 기준으로 맞춰 이어 쓴다.
description_portal: 한국국제협력단(KOICA)의 인도적지원 민관협력사업에 대한 프로그램 목록을 제공합니다. 인도적지원 민관협력사업은 긴급 재난 발생 및 만성화된 재난 대응 시 국내 민간단체(NGO)들이 시행하는 인도적 지원을 목적으로 하는 활동에 대한 자금, 실행 및 관리를 지원하는 사업입니다. 사업 분야로는 긴급구호, 조기복구, 재난위험경감, 난민 및 국내실향민 지원, 분쟁하성폭력 등이 있으며, 제공되는 데이터에는 사업명, 연도, 예산, 대상 국가·지역, 수행기관, 사업 단계 등의 정보가 포함되어 있습니다. 이를 통해 KOICA의 인도적지원 민관협력에 대한 현황과 전략을 분석하고, 그에 기반한 연구, 평가, 전략적 의사 결정 등에 활용할 수 있습니다.
