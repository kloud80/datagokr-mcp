description_portal: 한국국제교류재단은 해외 대학에서 개최된 다양한 한국 관련 행사의 현황을 체계적으로 파악하고, 국제적 한국학 확산 및 문화교류 정책 수립에 기여하기 위해 ‘한국국제교류재단_해외대학 한국관련 행사 실적’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 2017~2018년 조사 결과로, 각 대학별로 개최된 행사명, 연도, 대학명 등 핵심 정보를 포함하며, 총 850건의 실적이 XML, JSON 등 다양한 포맷으로 제공됩니다. 누구나 자유롭게 활용할 수 있어, 해외 한국학 행사 동향 분석, 국제교류 정책 연구, 문화행사 기획, 대학별 협력사업 평가, 언론 보도, 학술자료 구축, 데이터 기반 시각화, 글로벌 네트워킹, 교육콘텐츠 개발, 한류 확산 효과 분석 등 다양한 분야에서 활용 가능합니다."해외대학 한국관련 행사 실적" 사업은 현재 종료된 사업으로, 향후 업데이트 계획이 없는 1회성 데이터입니다.
