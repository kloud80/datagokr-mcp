description_portal: '한국보훈복지의료공단 부산보훈병원에서 2011년부터 2025년까지 년도별 국가유공자의 진료인원을 국비/감변별로 자연인원과 연인원을 제공합니다.자연인 : 년도별 진료본 사람의 수연인원 : 년도별 진료본 사람의 진료일수한국보훈복지의료공단 소속기관인 6개 보훈병원(중앙, 부산, 광주, 대구, 대전, 인천)의 홈페이지를 통한 연령대별 진료과 진료예약 건수 통계자료입니다.보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
