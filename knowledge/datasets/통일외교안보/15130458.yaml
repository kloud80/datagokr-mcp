description_portal: 한국독립운동인명사전편찬 사업은 2015년 광복 70주년과 2019년 삼일운동 및 대한민국 임시정부 수립 100주년을 계기로 한국독립운동사를 집대성하기 위해 시작했습니다. 독립운동가들의 생생한 발자취를 담아내기 위해 애국지사들의 일종의 작은 전기 사전 형태로 편찬하였습니다. 본 자료를 통해 국민의 독립정신·나라사랑·겨레사랑 정신을 배양하고 자라나는 세대들의 교육자료로도 활용할 수 있을 것입니다.  본 자료는 독립기념관에서 편찬하고 있는 인명사전과 관련하여 편찬 세부정보를 담고 있는 자료로 이름, 운동계열, 공훈정보, 관련조직, 관련사건, 편찬페이지, 발간여부 등을 포함하고 있다.
