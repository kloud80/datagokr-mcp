summary_user: 독립기념관이 편찬 중인 한국독립운동인명사전의 항목별 편찬 정보를 독립운동가 한 사람당 한 행으로 담은 파일(CSV 약 1.7MB)로, 이름·출생지·생몰일·운동계열·관련조직·관련사건·훈격·수훈연도·사전 수록 페이지·발간여부를 포함한다. 연구자나 교사가 특정 운동계열이나 관련조직에 속한 독립운동가가 누구이고 어떤 훈격을 언제 받았는지, 인명사전 몇 쪽에 실렸는지 확인할 때 쓴다. 전역 조인 키는 없어 다른 보훈 공훈록·안장자 데이터와는 공훈번호나 이름·생몰일을 맞춰 연결해야 한다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와 붙일 때는 이름이나 기관 내부 코드 매핑에 의존해야 하며, 동명이인 처리에 주의해야 한다. 지역 코드가 없는 전국·비공간 자료라 지역별 집계에는 출생지 문자열을 따로 정제해야 한다.
