summary_user: 승선근무예비역 인원을 배정받은 해운·수산업체를 업체 한 곳당 한 행으로 담은 명부로, 기업규모·업체명·주소(시도·시군구·이하주소)·관련협회·수산/해운(내항·외항) 구분과 2026년 배정인원(계, 국가필수국제선박, 기타선박), 관할 지방청을 담는다. 승선근무예비역으로 복무하려는 해양계 학교 졸업생이나 진로 상담자가 우리 지역에서 올해 배정인원을 받은 선사·수산업체가 어디이고 몇 명을 받았는지 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 시도·시군구 이름으로만 이어 붙이며, 병무청의 다른 병역지정업체 명부와도 같은 방식으로 맞춘다.
description_portal: 해당 파일은 승선근무에비역 인원배정 명부로 업체별 기업규모, 업체명, 소재지, 관련협회 및 수산·해운업별 인원배정 결과로 이루어져 있습니다. 승선근무예비역은 전시사변 또는 비상시  국민경제에 긴요한 물자와 군수물자를 수송하기 위한 업무 또는 이와 관련된 업무의 지원을 위하여 소집되어 승선근무하는 병역대체복무제도입니다.승선근무예비역 배정결과는 해운업체, 수산업체 별 인원 배정결과로 이루어져 있으며 해당업체의 소재지별 관리하는 관할 지방청을 구분하여 구성하였습니다.
