summary_user: 중앙보훈병원 한 곳의 병상을 병상구분·병동(구분)별로 나눠 특실·1~6인실·기타 병실 유형마다 병상 수와 병실 수, 합계를 담은 집계 파일이며, 포털에서 받은 CSV는 1KB 남짓의 작은 표다. 보훈대상자나 가족이 중앙보훈병원에 다인실·1인실이 얼마나 있는지 확인하거나, 분석가가 보훈병원 간 병상 구성을 비교할 때 쓴다. 전역 조인 키가 없어 다른 보훈병원(부산·광주·대구·대전·인천) 병상정보 파일과는 병원명·항목명을 맞춰 나란히 붙여 쓰고, 의료기관 정보와도 병원 이름으로만 연결한다.
description_portal: '중앙보훈병원 병원 내 병상 정보에 대한 데이터로 병상 구분, 병동 구분, 병상·병실 수, 병실 합계 등의 항목을 제공합니다.보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
