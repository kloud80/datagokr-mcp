description_portal: '인천천보훈병원에서 제공하는 통합EMR 시스템 보훈병원 급식예정인원 정보로 데이터를 제공합니다.급식 예정 인원은 병원에서 하루 동안 식사를 제공할 예상 인원을 의미합니다. 이는 병원에서 중요한 기준이 됩니다.급식 예정 인원은 최근 1개월 동안 실제 배식일을 기준으로 계산됩니다. 일반적으로 조식, 중식, 석식 중 가장 많은 급식 인원을 평균하여 산정합니다.급식 예정 인원 산정 기준- 병원 급식: 입원 환자 및 의료진 포함데이터 구성* 급식일자 : 급식일자* 급식끼니 : 아침, 점심, 저녁 구분* 식사분류 : 저염상식, 일반연식, 선택식 구분* 예정인원 : 예정인원'
