summary_user: 북한 주요 인물 한 명당 한 행으로 이름·한국식 이름·직책·성별·생년월일·출생지·사망 여부와 사망일을 담은 인물 목록이며, 전국·비공간 범위로 API 전체 100건이다. 연구자나 기자가 특정 북한 인물의 현재 직책과 생존 여부를 확인하거나 주요 인물의 출생지·연령 구성을 살펴볼 때 쓴다. 전역 조인 키가 없어서 김정은 공개 활동이나 북한 동향 같은 통일부 자료와는 인물 이름(nm)을 맞춰 연결해야 한다.
description_portal: 통일부에서 제공하는 ‘통일부_북한 인물 조회 서비스’는 북한 주요 인물 정보를 조회할 수 있는 공공데이터입니다.이 서비스는 인물의 이름, 한국식 이름, 직책, 성별, 생년월일, 출생지, 사망 여부, 사망일 등 다양한 정보를 포함하고 있어, 북한 인물에 대한 체계적인 정보를 손쉽게 확인하실 수 있습니다.이 데이터는 북한 인물 분석, 통일 및 외교 정책 연구, 언론 및 학술 자료 작성 등 다양한 분야에서 활용될 수 있습니다.특히, 북한 주요 인물의 배경 및 활동 이력을 파악하고, 남북 관계 및 통일 관련 연구에 기초 자료로 활용하실 수 있습니다.
team:
