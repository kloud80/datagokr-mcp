services:
  - op: /getPrsn
    name: 북한 인물 조회
    endpoint: https://apis.data.go.kr/1250000/prsn/getPrsn
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: sexdstn
        required: true
        example: '1'
        desc: '1: 남성 2: 여성'
      - name: nk_prsn_death_at
        required: true
        example: N
        desc: 'Y: 사망 N: 생존'
      - name: bgng_ymd
        required: true
        example: '19300101'
        desc: 시작 출생일자
      - name: end_ymd
        required: true
        example: '20201212'
        desc: 종료 출생일자
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
