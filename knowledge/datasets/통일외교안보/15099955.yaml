summary_user: KOICA 해외봉사단 파견지별로 파견기관 이름·주소·연락처와 국가별 생활·보건·고용 지표(깨끗한 음용수 사용 비율, 자살 사망률, 결핵 발병률, 고용률, 실업률, 소비자물가지수)를 담은 건별 API이며, 전체 13,230건이다. 파견을 준비하는 봉사단 지원자나 지역 리스크를 평가하는 분석가가 '이 파견국의 보건·생활 환경은 어떤가'를 확인하는 데 쓴다. 파견기관 주소(dispatch_org_adress)가 조인 키이고, 국가명과 ISO 2자리 국가코드(country_iso_alp2)가 있어 국가 표준코드 기반의 다른 외교·안전 데이터와 이어 쓴다.
description_portal: KOICA의 해외봉사단 파견지와 관련된 정보를 통합적으로 제공하는 API입니다. 파견국가별 활동지 위치, 주요 사업, 협력기관, 생활 환경 등 파견과 관련된 정보를 종합 제공하며, 사전 파견 준비, 체류 중 지원 체계 수립, 지역 리스크 평가 등에 활용됩니다. 해당 API는 인증키(serviceKey), 페이지 번호(pageNo), 한 페이지 결과 수(numOfRows) 등 기본적인 요청변수를 사용하며 한글 국가명, ISO 2자리코드, 파견기관명 등의 필터 파라미터를 추가로 설정할 수 있습니다. 출력결과에는 국가명, 파견기관명, 파견기관 주소, 자살 사망률, 깨끗한 음용수 사용 비율, 결핵 10만명 당 발병률, 고용률, 실업률 등의 항목이 포함되며, 각 항목에 대한 데이터는 XML 형식과 JSON 형식으로 반환됩니다.
