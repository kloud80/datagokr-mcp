description_portal: 국가보훈부에서는 6.25전쟁 당시 나라를 지킨 호국영웅 가운데 감동적인 사연과 공적을 지닌 인물을 발굴하여, 국민적 공감대 형성과 보훈문화 확산을 위해 ‘이달의 6.25전쟁영웅’으로 선정하고 있습니다. 이 사업은 6.25전쟁 60주년을 계기로 2011년 6월부터 시작되었으며, 현재까지 매월 전쟁영웅을 선정하여 그 분들의 숭고한 희생과 헌신을 다양한 홍보를 통해 국민에게 널리 알리고 있습니다. 본 데이터는 이달의 전쟁영웅으로 선정된 인물들의 선정년월, 성명, 국적, 군별, 소속, 생년월일, 사망년월일 및 공적자료와 홍보 포스터 등을 포함하고 있습니다.
