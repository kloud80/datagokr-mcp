description_portal: 유해발굴감식단에서 발굴한 유해 중 신원 확인이 된 전사자 현황에 대한 데이터입니다. 2000년부터 현재 시점까지 꾸준히 이루어진 신원 확인 연도와 신원 확인 전사자를 비롯하여 서울 현충원, 서울 현충원 충혼당, 대전 현충원, 본가 봉송, 안장 대기 등 세부적으로 항목을 나누어 전사자 안치 현황에 대해 상세하게 나타내고 있습니다. 해당 데이터 분석을 통해 미처 수습되지 못한 신원 미상 전사자들의 유해를 발굴, 감식하여 신원을 확인한 후 가족의 품으로 보내고, 안장할 수 있는 데에 도움을 줄 수 있습니다.
