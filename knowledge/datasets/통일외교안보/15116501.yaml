description_portal: 한국국제교류재단은 한국 문화의 글로벌 확산과 국가 이미지 제고를 위해 ‘한국국제교류재단_미디어 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 2019년까지 추진된 드라마, 영화 상영, 한국소개영상 제작 등 다양한 미미디어 사업(드라마/영화 상영, 한국소개영상 제작)에 관한 정보(사업연도, 사업유형, 사업국가 등)입니다. 총 320건의 사업 실적이 수록되어 있으며, CSV, XML, JSON 등 다양한 포맷으로 제공되어 연구자, 정책 입안자, 미디어 제작사, 언론 등 누구나 자유롭게 활용할 수 있습니다. 해당 데이터는 한국 미디어 콘텐츠의 해외 진출 동향 분석, 국제교류 정책 연구, 글로벌 홍보 전략 수립, 문화콘텐츠 제작, 한류 확산 효과 평가, 미디어 시장 조사, 교육 자료 개발, 데이터 기반 시각화, 국가별 협력사업 기획, 언론 보도 등 다양한 분야에서 활용 가능합니다.해당 사업은 현재 종료된 사업으로, 향후 업데이트 계획이 없는 1회성 데이터입니다.
