summary_user: 2026년 전문연구요원 인원배정 결과를 지정업체(연구기관) 한 곳당 한 행으로 담은 전국 명부입니다. 행마다 기업부설연구소·자연계대학원 같은 연구기관 분야, 업체명, 소재지, 2026년 배정인원, 관할 지방병무청이 들어 있습니다. 병역특례로 전문연구요원 복무를 알아보는 석·박사 과정생이나 채용을 검토하는 사업자가 어느 연구기관에 올해 몇 명이 배정됐는지, 관할청이 어디인지 확인할 때 씁니다. 실측 컬럼에는 사업자번호 같은 전역 조인 키가 없어서, 다른 병역지정업체 자료나 사업자 정보와는 업체명·소재지를 맞춰 보는 방식으로만 이어 쓸 수 있습니다.
description_portal: 해당 파일은 2026년 전문연구요원 인원배정 결과로 기업부설연구소, 기초과학연구기관, 대학부설연구기관, 방위산업연구기관, 자연계대학원, 지역혁신연구기관, 특정연구정부출연국공립 등 전문연구요원 인원배정 명부입니다.엑셀 파일의 세부내용은 연구기관별 분야, 업체명, 소재지, 26년 배정결과, 관할지방청으로 나누어 작성되어 있으며, 각 업체별 배정 결과(배정인원, 미배정, 미신청, 총괄배정)가 기재되어 있습니다. 또한 각 업체별 소재지에 따라 관리를 담당하는 관할 지방청을 명시하고 있습니다.
