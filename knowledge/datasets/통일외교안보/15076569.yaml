summary_user: 국가별 재외공관(대사관·총영사관·분관 등) 한 곳을 한 행으로, 공관 유형·이름·위도·경도·전화번호·영사콜센터·무료·긴급 전화번호·주소와 겸임(관할) 여부를 담은 CSV 파일이다(약 52KB). 해외 여행자·재외국민이 '이 나라에서 연락할 우리 공관과 긴급 연락처는 어디인가'를 찾거나, 분석가가 공관 위치를 지도에 표시할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않았으나 ISO 2자리 국가코드(국가코드)와 국가명을 통해 여행경보·출입국·무역·관광 등 국적·국가 단위 데이터와 매핑해 이어 쓴다.
