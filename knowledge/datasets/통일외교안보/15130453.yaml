summary_user: 독립기념관이 편찬하는 한국독립운동인명사전 수록자를 한 사람당 한 행으로 담은 파일로, 이름·운동계열·훈격·수훈연도·출생지·관련단체·활동내역과 인물 이미지 정보(파일명·설명·크기)를 담는다. 독립운동가 한 사람의 출생지, 소속 단체, 활동, 서훈 등급을 확인하려는 국민·연구자나, 운동계열·출생지별로 독립운동가 분포를 정리하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 공훈번호나 이름을 기준으로 독립유공자 공훈록·국립묘지 안장자 자료와 맞춰 보는 방식으로 이어 쓴다.
description_portal: 한국독립운동인명사전편찬 사업은 2015년 광복 70주년과 2019년 3·1운동 및 대한민국 임시정부 수립 100주년을 계기로 한국독립운동사를 집대성하기 위해 시작했습니다. 독립운동가들의 생생한 발자취를 담아내기 위해 애국지사들의 일종의 작은 전기 사전 형태로 편찬하였습니다. 독립기념관에서 편찬하고 있는 독립운동가 인명사전관련 수록자 기본항목 및 수록항목에 대한 기본정보입니다. 주요내용은 이름, 운동계열, 훈격, 출생지, 관련단체, 활동내역, 이미지 파일 정보 등으로 구성되어 있습니다.
