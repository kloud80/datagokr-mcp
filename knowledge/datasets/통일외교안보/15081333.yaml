description_portal: 대전광역시 북한이탈주민 지역협의회는 북한이탈주민이 지역사회에 안정적으로 정착하고 자립할 수 있도록 돕기 위해 운영되고 있습니다. 이 협의회는 ‘북한이탈주민 보호 및 정착지원에 관한 법률 시행령’을 근거로 대전광역시가 주관하며 구성되었습니다. 위원은 당연직과 위촉직으로 약 10명 내외로 이루어지며, 여성 위원의 참여도 적극 보장됩니다. 위원의 임기는 2년이며, 연임도 가능합니다. 협의회는 반기마다 정기회의를 열고 필요에 따라 임시회의도 개최합니다. 주요 역할은 복지, 취업, 의료, 교육 등 다양한 분야에서 북한이탈주민 지원 정책을 자문하고, 지역 내 민관 협력체계를 구축하는 것입니다. 이를 통해 대전시는 북한이탈주민이 새로운 환경에 잘 적응할 수 있도록 체계적이고 실질적인 지원을 제공하고 있습니다.
