description_portal: 국방부 군인(간부)의 봉급(급여)을 계급과 호봉별로 설명하고 있는 데이터입니다. 하사부터 소장까지 군 간부 모든 계급이 받는 봉급(급여)을 호봉별로 세분화하여 상세하게 제공합니다. 해당 데이터 분석을 통해 장기 복무자를 체계적으로 관리하고, 우수한 군 전문 인재 양성 등 다양한 인사 정책을 수립하며, 군 간부 처우 개선(당직비, 훈련급식비, 주거환경개선비 등)을 효과적으로 하는 데에 도움을 줄 수 있습니다. 또한 합리적인 예산 관리에 관한 기초 자료로써 활용할 수 있습니다.* 군인(간부) 봉급 정보 변동 시 수시로 업데이트 예정입니다.
