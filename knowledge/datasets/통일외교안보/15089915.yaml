description_portal: 육군사관학교 졸업생의 임관 병과를 설명하고 있는 데이터입니다. 2009년 임관한 65기부터 2023년에 임관한 79기까지 총 졸업생 인원수를 바탕으로, 졸업생이 선택한 병과(보병, 포병, 기갑, 공병, 정보통신, 정보, 방공, 항공, 병기 등)에 대해 상세하게 파악할 수 있습니다. 해당 데이터를 통해 연도별로 졸업생이 선택한 병과 변화 추이를 분석할 수 있고, 각 병과에 대한 관심도나 수요 및 선호도 예측을 가능하게 하며, 추후 군 인사 배치에 도움을 줄 수 있습니다.* 연 단위로 데이터 업데이트 예정입니다.
