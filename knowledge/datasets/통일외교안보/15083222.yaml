description_portal: 국방공통컴포넌트로 컴포넌트명, 버전, 키워드, 플랫폼, 구현언어, 서비스도메인, 서비스유형 등이 제공됩니다.국방부 및 군 관련 정보시스템 개발 시 반복적으로 사용되는 공통 기능들을 표준화된 형태로 모듈화하여 제공하는 소프트웨어 구성요소들을 말합니다. 국방시스템의 효율성, 일관성, 보안성, 유지보수성을 높이기 위해 도입하였고 이를 표준화하였습니다.주요 컴포넌트를 구분하자면, 인증-보안, 사용자관리,  UI컴포넌트, 데이터처리, 연계기능, 기타로 구분되며 해당파일에서 이에 따른 세부 컴포넌트를 확인할 수 있습니다.
