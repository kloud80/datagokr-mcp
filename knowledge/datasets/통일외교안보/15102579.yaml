description_portal: 한국국제협력단(KOICA)의 고객의소리(VOC) 시스템을 통해 접수된 민원과 문의 사항의 접수 및 처리 현황을 제공합니다. 동 데이터는 VOC 접수 및 처리 연도와 월, 접수 채널, 유입 경로, 문의 분류(대·중·소분류), 문의 구분, 게시판 구분, 처리 부서 등의 항목을 포함하고 있어, 민원 발생 추이와 처리 현황을 분석하는 데 유용합니다. 이를 통해 KOICA의 개발협력 사업에 대한 국민의 의견을 파악하고, 서비스 개선 및 정책 수립에 활용할 수 있습니다. 자세한 사항은 KOICA 대표 홈페이지(https://koica.go.kr/koica_kr/1019/subview.do)에서 확인하실 수 있습니다.​
