description_portal: 병무청에서는 병역의무자 중 "영주권자 등 입영희망신청" 제도를 통해 입영신청 및 입영 한 현황을 자원 구분하여(현역, 사회복무요원) 공개합니다. 해당 제도는 외국의 영주권 등을 취득한 국외이주자가 한국인으로서의 정체성을 확립하고 애국심을 고취할 수 있도록 병역이행을 지원하는 제도입니다. 입영 신청자는 본인이 희망하는 시기에 병역판정검사 및 입영이 가능하며, 정기휴가 기간 중 영주권 유지 등을 위한 거주국 방문시 국가에서 항공료를 지원해 주고 있습니다. 공공데이터 기준은 2018년 ~2025년으로 최신 데이터를 홈페이지에 게시합니다.
