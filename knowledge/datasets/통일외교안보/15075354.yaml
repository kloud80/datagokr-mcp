summary_user: 전 세계 재외공관(대사관·총영사관·분관 등)을 공관 한 곳당 한 행으로 담은 원천 목록으로, 검증 시 184건 전체를 받았으며 국가명·공관 유형·주소·위도경도·대표/긴급/무료 전화번호를 포함한다. 해외여행자나 재외국민이 '이 나라에서 여권을 잃어버리면 어느 공관에 연락해야 하나'를 찾거나, 분석가가 국가별 공관 분포를 지도로 그릴 때 쓴다. ISO 2자리 국가코드(country_iso_alp2)로 여행경보·출입국·무역 등 국가 단위 데이터와 잇고, 공관 주소와 좌표로 위치 기반 자료와 겹쳐 본다.
description_portal: '[요약 정보] 국가별 재외공관(대사관, 총영사관, 분관 등) 정보를 제공합니다. [상세 정보]재외공관정보 목록 조회: 한글 국가 명 또는 영문국가 명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용 )로 재외공관정보 목록 조회 - 국가별 재외공관(대사관, 총영사관, 분관 등) 정보를 제공하는 공공데이터 API 서비스[응답정보]제공되는 정보 항목은-국가명-국가코드-겸임(관할)-재외공관 유형-재외공관명-재외공관 위도-재외공관 경도-전화번호-영사콜센터 번호-무료전화번호-긴급전화번호재외공관주소등이 제공됩니다.'
