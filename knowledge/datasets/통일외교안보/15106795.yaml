description_portal: '군 장병들이 자기 개발을 위해 취득한 국가기술자격 정보를 담은 데이터입니다. 국방부는 군 장병들의 자기 개발을 위해 군 병영 기간 동안 국가기술자격을 취득할 수 있는 제도를 마련하여 매년 시행하고 있는데, 해당 제도를 활용하여 취득한 국가기술자격 정보를 상세하게 나타내고 있습니다. 특히, 세부 항목을 수험 식별 ID, 종목 코드, 종목명(자동차정비산업기사, 정보처리산업기사, 위험물산업기사 등), 군구분코드, 취득자 우편번호, 취득자 지역, 군구군명, 취득 구분으로 나누어 필요한 정보를 보다 쉽게 얻는 것이 가능합니다.* 데이터 종류: 원시데이터* 비식별화 조치(개인정보 삭제)'
