description_portal: '데이터 설명:본 데이터셋은 국방과학연구소(ADD)가 국가 안보를 위해 개발한 고도의 첨단 국방 기술 중, 보안성 검토를 거쳐 민간 산업체로 이전이 가능하다고 판단된 "스핀오프(Spin-off)" 대상 기술들의 상세 목록을 담고 있습니다. 국방 기술은 일반 상용 기술보다 가혹한 환경에서의 신뢰성과 정밀도가 검증된 경우가 많아, 이를 민간에 도입할 경우 기업의 기술 진입장벽을 낮추고 글로벌 경쟁력을 확보하는 데 결정적인 역할을 합니다. 본 데이터를 통해 민간 기업은 국방 R&D 성과를 비즈니스 모델에 접목하여 새로운 시장을 창출할 수 있으며, 국가적으로는 국방 예산이 투입된 연구 성과를 경제 전반의 자산으로 환원하는 선순환 구조를 형성하게 됩니다.상세 컬럼 설명:순번: 데이터의 식별과 관리를 위한 일련번호입니다.년도: 해당 기술이 민간이전 대상 목록에 등재되었거나 특허가 관리되기 시작한 시점을 나타내며, 기술의 최신성과 유효 기간을 판단하는 척도가 됩니다.기술분야: 플랫폼/구조, 센서, 소재, 정보통신 등 기술의 계통적 분류를 명시합니다. 이는 기업이 자사의 주력 업종이나 필요 기술군을 신속하게 필터링하여 맞춤형 기술을 찾는 데 필수적인 항목입니다.특허기술명: 이전 대상이 되는 기술의 공식 명칭입니다. 기술의 목적과 핵심 기능(예: "물체탐지 성능 향상용 인공물체 추가 기술")이 포함되어 있어 기술의 성격을 직관적으로 파악할 수 있습니다.등록번호: 대한민국 특허청에 등록된 고유 번호입니다. 기업이 법적 권리 범위를 상세히 분석하거나 기술 가치 평가를 진행할 때 기준이 되는 고유 식별자입니다.'
