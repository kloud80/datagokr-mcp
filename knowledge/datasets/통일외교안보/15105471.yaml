summary_user: KOICA가 민간기업·스타트업·사회적기업 등 혁신 주체와 함께 추진하는 혁신적 개발협력 사업을 사업 한 건당 한 행으로 담은 사업 단위 목록 파일(CSV, 약 146KB)로, 사업명(국·영문), 시작·종료연도, 원화·미화 예산총액, 대상 국가·지역, 수행기관, 담당부서, 사업단계를 포함한다. 분석가나 개발협력 참여를 검토하는 사업자가 'KOICA가 어느 나라에서 어떤 기관과 얼마 규모의 혁신 협력사업을 진행 중인가'를 파악하는 데 쓴다. 전역 조인 키는 없으므로 KOICA의 다른 사업·조달 데이터와는 사업번호·시행계획번호나 사업명, 국가명 같은 이름 매칭으로만 잇는다.
limits: 표준 국가코드가 없어 국가 단위로 다른 외교 데이터와 붙이려면 국가명을 직접 매핑해야 한다. 공간 정보가 없는 비공간 데이터라 국내 지역 단위 분석에는 쓸 수 없다.
