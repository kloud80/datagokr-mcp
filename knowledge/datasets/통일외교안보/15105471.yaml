description_portal: 한국국제협력단(KOICA)이 추진하는 혁신적 개발협력 사업의 목록을 제공합니다. 개발도상국의 난제들을 해결하고 원조 효과성을 높이기 위해 다양한 분야의 전문성을 가진 파트너들과 협력하여 진행하는 사업들의 정보를 포함하고 있습니다. 제공되는 주요 항목으로는 사업명(국문 및 영문), 시작 및 종료 연도, 예산 총액(원화 및 미화), 대상 국가 및 지역, 수행기관, 담당 부서, 사업 단계 등이 있습니다. 이 데이터를 통해 민간기업, 스타트업, 사회적기업 등 다양하고 새로운 혁신 주체들과 협력해 추진 중인 국제개발협력 사업의 현황을 파악하는데 활용할 수 있습니다.
