description_portal: '한국국제협력단(KOICA)이 운영하는 해외봉사단(WFK: World Friends Korea)의 파견현황을 제공합니다. 동 데이터는 연도에 따른 해외봉사단의 단원 형태, 파견 국가, 파견 직종, 파견 분야, 인원 등의 항목을 포함하며, 이를 통해 국가별 봉사단원 분포와 파견 흐름을 한눈에 확인할 수 있습니다. 더불어 어떤 국가에 어떤 직종의 봉사단원이 파견되었는지에 따라 봉사단의 수요를 확인하고, 국가별 수요 기반에 따라 맞춤형 활동을 찾아 지원할 수 있습니다. 봉사활동 참여를 희망하는 경우가 아니라고 하더라도 봉사단 사업의 효과성을 측정하거나, 봉사단 파견정책 수립 등 시 기초 자료로 활용 가능합니다.'
