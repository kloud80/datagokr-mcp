summary_user: 병역판정검사에서 수집한 병역의무자의 보유 자격증 정보를 시군구 단위로 담은 API로, 전체 62,882건이며 범위는 전국이다. 분석가나 병무 정책 담당자가 지역별 병역의무자의 자격·면허 보유 현황을 파악하는 질문에 쓴다. 시군구 코드(sggjusoCd, 키 sgg_cd)로 같은 시군구 키를 가진 다른 지역 데이터와 이어 쓴다.
