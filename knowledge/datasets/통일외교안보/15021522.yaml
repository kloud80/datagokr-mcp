description_portal: 병역판정검사에서 수집한 병역 자료 중 전국의 병역의무자가 보유한 자격증 정보를 제공합니다.* 병역법 제11조에 따라 병역의무자는 19세가 되는 해에 병역을 감당할 수 있는지를 판정받기 위하여 지방병무청장이 지정하는 일시(日時)ㆍ장소에서 병역판정검사를 받아야 하며 , 병역법 제13조(적성의 분류,결정 등)에는 지방병무청장은 신체검사의 결과 신체등위가 1급부터 4급까지로 판정된 사람에 대하여는 자격, 면허, 전공분야 등을 고려하여 군복무에 필요한 적성을 분류하여 결정한다고 명시되어있습니다.
