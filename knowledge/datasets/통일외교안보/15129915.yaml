summary_user: 공군 모집병의 모집년도·회차별로 일반기술과 전문기술(전자계산, 화생방, 의무, 기계, 차량운전, 차량정비, 통신전자전기) 계열의 1차 선발 커트라인과 선발인원을 담은 집계 파일이다. 공군 입대를 준비하는 지원자가 '내가 지원하려는 계열은 지난 회차에 몇 점이면 1차에 붙었나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 병무청 모집병 자료(특기·배점·접수현황 등)와는 모집년도·회차·계열 이름을 맞춰 연결한다.
description_portal: 위 자료는 모집병(육군, 해군, 해병대, 공군) 중 공군 모집직종(일반기술, 전문기술)별 1차 선발 커트라인, 선발인원에 대한 자료를 제공하고 있습니다.최근 3년의 자료를 제공하고 있으며 모집년도와 모집회차 그리고 모집계열(일반기술-일반 / 전문기술-전자계산, 화생방, 의무, 기계, 차량운전, 차량정비, 통신전자전기) 각각의 회차별 선발 커트라인이 대하여 제공하고 있습니다.위의 자료는 병무청 누리집(홈페이지) - 군지원(입영신청) 안내 - 모집안내서비스-공지사항-지난회차 합격점수로 들어가면 동일한 자료로 확인이 가능합니다.
