description_portal: 한국국제협력단(KOICA)이 수행한 개발협력사업을 유형별로 분류하여 집행실적을 정리한 통계 자료입니다. 각 연도에 프로젝트, 개발컨설팅, 봉사단, 연수생 초청, 전문가 파견 등 다양한 사업 유형별로 사용된 예산의 금액(원화 및 달러 기준)을 확인할 수 있어, KOICA의 재원 배분 구조를 체계적으로 파악할 수 있습니다. 동 데이터는 ODA 사업유형별 예산 규모와 비중의 변화, 성과 대비 예산 사용 분석 등에 기초 자료로 활용될 수 있습니다. 정기적으로 업데이트되는 본 통계는 KOICA의 재정 투명성 강화와 정책 책임성 확보에도 기여합니다.통계데이터의 원천데이터는 한국국제협력단_KOICA ODA 실적보고 로데이터 에서 확인 가능합니다.*사업유형별 ODA 실적통계는 통계 산출 절차상 N+2년 1월 확정됩니다. 따라서 본 데이터는 2023년 확정치이며, 2024년 데이터는 2026년 하반기 내에 게시될 예정입니다.올해는 2023년 확정치와 동일한 데이터로 제공됩니다.
