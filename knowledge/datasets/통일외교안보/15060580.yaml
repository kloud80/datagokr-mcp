description_portal: 통일부에서 제공하는 ‘통일부_남북교역 연도별 월별 통계 데이터’는 1989년 1월부터 현재까지 남북 간 교역 현황을 월별 및 연도별로 집계한 공공데이터입니다. 본 데이터는 남북교역 관련 시스템을 통해 수집된 정보를 기반으로 하며, 남북 간 반입과 반출 및 반출입에 해당하는 금액 및 중량, 그리고 각 항목별 증감률 등 교역의 주요 지표를 포함하고 있습니다.데이터는 세부 항목으로 기간(연도/월), 품목별, 반입금액, 반입금액_증가율, 반입중량, 반입중량_증가율, 반출금액, 반출금액_증가율, 반출중량, 반출중량_증가율, 반출입금액, 반출입금액_증가율, 반출입중량, 반출입중량_증가율이 있습니다. 이 데이터는 남북교역의 규모 변화, 시기별 교역 동향, 남북경협 정책의 효과 분석 등 다양한 목적으로 활용될 수 있습니다.
