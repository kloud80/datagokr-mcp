description_portal: '한국국제협력단(KOICA)이 전 세계에 운영하고 있는 해외사무소의 위치 정보를 제공합니다. 각 사무소의 번호, 구분(본사무소 또는 분사무소), 지역(예: 아시아, 아프리카 등), 사무소명, 주소 등의 항목으로 구성되어 있습니다. KOICA는 47개국에 해외사무소를 운영하여 현장에서의 개발협력사업을 관리하고 현지 파트너 국가와의 소통을 강화하고 있습니다. 이러한 점에서 동 데이터는 개발도상국에서 개발협력사업과 관련된 기회를 찾는 민간기업 혹은 파트너 기관에게 유용한 정보가 될 수 있습니다. 보다 자세한 사항은 KOICA 홈페이지에서 확인하실 수 있습니다.URL:https://www.koica.go.kr/koica_kr/1045/subview.do'
