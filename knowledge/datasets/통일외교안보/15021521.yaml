summary_user: 병역명문가로 선정된 가문의 구성원을 한 줄씩 담은 전국 단위 목록으로, 선정년도·관할 지방청·가계 세대 구분(조부·부·본인 등)·군 구분·출생년도를 담는다. 병무 행정 분석가나 지자체 담당자가 "어느 해에 어느 지방청 관할에서 병역명문가가 몇 가문 선정됐고 세대별·군별 복무 구성은 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지방청명이나 군 구분 같은 이름·코드 매핑, 또는 같은 병무청 데이터의 코드로만 잇는다.
limits: 구성원 실명이나 주소, 우대 시설 정보는 들어 있지 않고 행정구역 좌표도 없는 비공간 데이터라 지역별 지도화나 시설 연계는 바로 하지 못한다. 공통 조인 키가 없어 다른 데이터와 연결하려면 이름 매칭에 의존해야 한다.
