summary_user: 인천보훈병원 한 곳의 병상 현황을 병동별로 정리한 소형 집계 파일(CSV, 977 bytes)로, 특실·1인실~9인실·격리실·기타 유형별 병실 수와 병상 수, 국비·사비 병상 구분을 담는다. 보훈대상자나 가족, 의료 분석가가 '인천보훈병원은 병동별로 몇 인실 병상을 얼마나 갖추고 있고, 격리병실이나 국비 병상은 몇 개인가'를 확인하는 데 쓴다. 전역 조인 키(기관코드 등)가 없어 다른 보훈병원 병상정보나 의료기관 데이터와는 병원명·병동명을 기준으로 직접 맞춰 이어 써야 한다.
limits: 병원 한 곳의 병동별 정적 현황이라 실시간 빈 병상이나 입원 가능 여부는 알 수 없다. 조인 키가 없어 다른 데이터와 연결할 때 병원명 매핑이 필요하다. 포털상 범위는 전국으로 표기돼 있으나 실제 내용은 인천보훈병원 한 곳이다.
