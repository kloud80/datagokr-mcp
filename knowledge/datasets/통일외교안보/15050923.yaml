summary_user: 방위사업청과 각 군이 해외에서 조달하는 군수품의 입찰 결과를 공고번호·판단번호·항목번호 단위로 담은 파일로, 발주기관·계약방법·입찰방법·낙찰방법·개찰일시·입찰결과·달러 기준 예산금액이 들어 있다. 국외 조달에 참여하려는 업체나 분석가가 "어느 기관이 어떤 계약·낙찰 방법으로 해외 군수품을 사고, 예산 규모는 어느 정도인가"를 파악하는 데 쓴다. 전역 조인 키는 없어 국방전자조달의 입찰공고·계약정보 등 같은 기관 데이터와 공고번호나 건명으로 맞춰 이어 쓰며, 이 조달 체계는 나라장터와 별도이므로 정부조달 데이터와는 개념만 대응시켜 함께 본다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 이름 매핑이나 같은 기관 코드로만 연결된다. 국방전자조달은 나라장터와 별도 체계여서 나라장터 입찰결과와 같은 키로 바로 합칠 수 없다. 범위는 전국·비공간 데이터라 지역별 분석에는 맞지 않는다.
