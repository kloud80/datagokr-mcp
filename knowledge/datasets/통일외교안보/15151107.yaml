description_portal: '기술변경은 무기체계 개발 이후 최초양산단계에서 가장 많이 발생하며, 국방기술품질원은 최초양산 단계에서 품질을 조기에 안정화하기 위해 기술자료의 충분성과 적합성을 중점적으로 확인하고 있다. 형상통제는 무기체계의 개발 및 운용과정에서 발생하는 기술적 변경을 관리하는 활동으로, 연구개발 단계에서는 ‘개발형상변경’, 양산 및 운용유지 단계에서는 ‘기술변경’, ‘규격완화’, ‘면제’ 등으로 구분된다.국방기술품질원은 양산 및 운용유지 단계에서 설계 오류나 수정 사항 등 군수품의 작전운용성능 및 전력화에 영향을 미치지 않는 형상 변경 사항을 확인하고 조정·통제하는 업무를 수행하고 있으며, 여기에는 ‘기술변경’이 대부분을 차지하고 있다.* 1 급 기술변경(기술지원) : ① 작전운용성능에 영향을 미치는 사항, ② 전력화 일정에 지장을 초래하거나 비용변동등 이 예상되어 수정계약 대상이 되는 사항, ③ ’②번‘에 해당하지 않으나, 후속 또는 그 밖의 사업에서 해당 기술변경 품목 의비용 증가액이 해당 품목이 적용되는 체계 장비 계약금액의 100분의 30 이상일 것으로 예상되는 사항* 2급 기술변경(주관) : 1급 기술변경에 해당하지 않는 기술변경 사항'
