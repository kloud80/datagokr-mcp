description_portal: 통일부에서 제공하는 ‘통일부_북한이탈주민 재북 출신지역별 현황’ 데이터는 북한이탈주민이 북한에 거주하던 당시 출신 지역을 성별로 구분하여 집계한 공공 통계 자료입니다. 본 데이터는 북한의 주요 행정구역인 강원, 남포, 양강, 자강, 평남, 평북, 평양, 함남, 함북, 황남, 황북, 개성 등 지역과 기타(재외) 지역을 포함하여, 각 지역별로 남성과 여성 인원 수와 전체 합계를 상세하게 제시합니다.이 데이터는 북한 내에서 탈북민이 발생하는 지역의 특성 및 인구 현황을 파악할 수 있으며, 이는 북한 사회의 지역별 분포와 인구 이동, 사회적 배경에 대한 이해를 높이는 데 기여할 수 있습니다. 나아가, 북한 내 지역별 사회적 문제 및 인구 유출 요인을 분석함으로써, 향후 통일 대비 정책 마련 및 남북 인구 교류 확대 방안 모색에도 유용하게 활용될 수 있습니다.
