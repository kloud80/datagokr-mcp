summary_user: 병역지정업체(기간산업체·방위산업체)별 산업기능요원 인원배정 결과를 업체 한 곳당 한 행으로 담은 zip 엑셀 파일로, 전국 업체의 업종·기업규모·소재지·선정년도·관할 지방청과 출생연도·협약 유형별 배정인원, 별도배정 인원을 담는다. 산업기능요원 복무를 준비하는 청년이 '우리 지역에서 올해 산업기능요원을 배정받은 업체는 어디이고 몇 명인가'를 확인하거나, 분석가가 업종·기업규모·지역별 배정 분포를 볼 때 쓴다. 공통 업체 코드 같은 전역 조인 키는 없어서, 병역지정업체 목록이나 병역일터 채용공고와는 업체명·소재지를 맞춰 잇고, 관할청 값으로 지방병무청 단위로 묶는다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 문자열 매칭으로만 연결되며, 동명 업체나 표기 차이에 주의해야 한다. 포털 설명은 05·06년생 기준 배정 유형을 말하지만 실제 필드는 '06년생 이전'·'07년생' 기준이어서, 파일이 어느 해 배정분인지 확인한 뒤 해석해야 한다.
