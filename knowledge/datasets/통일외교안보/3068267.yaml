description_portal: 병역지정업체의 장은 매년 6월말까지 추천권자에게 다음해 필요인원을 신청하여야 합니다. 해당 zip 파일은 2025년 산업기능요원 인원배정 결과로 기간산업체 파일과 방위산업체 파일로 구성되어 있습니다.엑셀 파일의 세부내용은 기업의 규모, 업종, 업체명, 소재지, 선정년도 별로 나누어 작성되어 있으며, 각 업체별 배정 유형(05년생 3자협약·2자협약, 06년생 3자협약 및 별도 배정 등)에 따라 인원배정 결과가 기재되어 있습니다. 또한 각 업체별 담당하는 관할 지방청을 명시하고 있습니다.
