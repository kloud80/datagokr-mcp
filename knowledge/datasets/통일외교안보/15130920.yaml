description_portal: '라틴아메리카협력센터의 웹진 목록을 CSV 형식으로 제공합니다. 웹진은 분기별 발행되며, 매 호마다 중남미 산학계의 전문가 및 현지 공관을 통해 수집한 중남미 지역의 최신 동향과 산업 정보 등을 제공하고 있습니다. 센터 홈페이지에서 ‘웹진 구독신청’을 하시면 메일로 편리하게 받아 보실 수 있습니다.  한-중남미 주제로 기고문, 보고서, 기업 인터뷰, 행사 소개 등 다양한 콘텐츠가 수록되었습니다. [참고]※ 라틴아메리카협력센터 홈페이지 주소 : https://energia.mofa.go.kr※ 웹진 명 : 라틴 인더스트리 NOW,  웹진 Near Latin'
