description_portal: '한국보훈복지의료공단 산하 보훈요양원에서 입소자를 대상으로 제공된 선택 식사 이용 현황을 집계한 통계 데이터를 제공합니다.본 데이터는 개인의 기호나 건강 상태에 따라 제공된 선택 식사의 이용 건수를 정리한 자료이며, 선택 식사 구분, 식사년월 등의 정보를 포함합니다.* 기준연도: 2025년** 공단 산하 8개 보훈요양원의 데이터를 합친 자료입니다.1. 수원보훈요양원(경기도 수원시 장안구 광교산로 95)2. 광주보훈요양원(광주광역시 광산구 첨단월봉로 85)3. 김해보훈요양원(경상남도 김해시 진영읍 하계로 127)4. 대구보훈요양원(대구광역시 달성군 하빈면 하산길 123-23)5. 대전보훈요양원(대전광역시 유성구 유성대로 935)6. 남양주보훈요양원(경기도 남양주시 덕송2로 71)7. 원주보훈요양원(강원도 원주시 혁신로 249)8. 전주보훈요양원(전라북도 전주시 완산구 쑥고개옛길 65)'
