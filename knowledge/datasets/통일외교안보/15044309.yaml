description_portal: 한국국제교류재단은 세계 각국에 한국의 역사, 문화, 사회에 대한 올바른 정보를 전달하고 국제적 이해를 높이기 위해 ‘한국국제교류재단_한국소개자료제작 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 재단이 발간한 비매용 도서와 DVD 등 다양한 형식의 한국소개 자료에 대한 정보를 담고 있으며, 발간연도, 언어, 자료명, 형식, 국제표준자료번호 등 주요 항목을 포함합니다. 자료는 CSV, XML, JSON 등 다양한 포맷으로 제공되어 누구나 자유롭게 활용할 수 있습니다. 해당 데이터는 한국문화 연구, 외국어 교육자료 개발, 해외문화원 전시기획, 정책자료 작성, 문화콘텐츠 제작, 학술 연구, 도서관 자료 구축, 국제교류 행사 기획, 언론 보도, 데이터 기반 시각화 등 다양한 분야에서 활용될 수 있습니다."한국소개자료제작적" 사업은 현재 종료된 사업으로, 향후 업데이트 계획이 없는 1회성 데이터입니다.
