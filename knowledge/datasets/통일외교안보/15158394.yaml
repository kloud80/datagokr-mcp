summary_user: KOICA가 수행한 ODA 개발협력사업을 사업 단위로 담은 원장형 API로, 사업명·사업형태·수원국·사업기간·예산 등을 조회한다. 국민이나 분석가가 특정 수원국에서 KOICA가 어떤 사업을 해왔는지 확인하는 질문에 쓴다. 전역 조인 키는 없어 이름·코드 매핑이나 같은 기관의 사업번호·사업유형 코드로 다른 KOICA 데이터와 이어 쓴다.
description_portal: KOICA가 수행한 ODA 개발협력사업의 목록 및 사업 상세정보를 조회할 수 있는 API입니다. 사업명, 사업유형, 수원국, 시행기관, 테마 등을 기준으로 사업 현황을 파악할 수 있습니다. 해당 API는 인증키(serviceKey), 페이지 번호(pageNo), 페이지당 호출건수(numOfRows) 등 기본적인 요청변수를 사용하며 조회년도, 사업형태, 사업번호 등의 필터 파라미터를 추가로 설정할 수 있습니다. 출력결과는 사업년도, 사업명, 사업기간, 사업형태, 코이카지역명, 사업예산금액, 수원국, 연수인원, 사업추진 현황 등의 항목을 포함되며, 각 항목에 대한 데이터는 XML 형식으로 반환됩니다.
team:
  dept: 데이터팀
services:
  - op: /getBsnsInfoList
    name: ODA 사업목록 조회
    endpoint: https://apis.data.go.kr/B260003/BsnsService/getBsnsInfoList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: P_PAGE_NO
        required: true
        desc: 페이지번호
      - name: P_PAGE_SIZE
        required: true
        desc: 한 페이지 결과 수
      - name: P_YEAR
        required: true
        desc: 조회년도
      - name: P_BSNS_TY_CD
        required: true
        desc: '사업의 형태 0102:프로젝트컨설팅 사업 07 : 민관협력 사업 09 : 다자협력 사업 04 : 연수생 초청 사업 12 : 소규모 무상원조'
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getBsnsInfoDetail
    name: ODA 사업상세 조회
    endpoint: https://apis.data.go.kr/B260003/BsnsService/getBsnsInfoDetail
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: P_BSNS_NO
        required: true
        desc: 사업번호
    approval: auto
    traffic:
      dev: 10000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
