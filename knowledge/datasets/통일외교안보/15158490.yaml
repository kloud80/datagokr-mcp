description_portal: 방위사업청 국방표준종합서비스(국방표준종합서비스 규격목록) 데이터입니다. 본 서비스는 국방 물자 및 장비의 표준화·목록화 업무에 활용되는 규격(표준) 정보 목록을 제공하며, 재고번호(NSN), 품목식별번호(IIN), 군급(FSC), 품명부호, 국가부호, 생산자부호(CAGE), 부여일자 등 국방 표준 관련 주요 식별·관리 항목을 포함합니다. 또한 품목명(한글/영문), 지정·비지정 품명, 요청기관, 참조번호 등 세부 항목을 함께 제공하여 국방 물자 식별, 규격관리, 표준화 데이터 조회 및 업무 분석에 활용할 수 있습니다.
