summary_user: 통일부가 새로 들여온 신착 자료를 한 권(건)씩 담은 목록 데이터로, 자료 구분·서명·저자·출판사·출판연도·등록번호·청구기호·소장처·대출 상태를 제공한다. 연구자나 일반 이용자가 "최근 통일부 자료실에 들어온 북한·통일 관련 신간이 무엇이고 어디에 소장돼 있나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 서명·저자 같은 이름 매칭으로만 이을 수 있다.
limits: 공통 조인 키가 없어 다른 데이터셋과 정확히 연결되지 않는다. 신착 도서 목록이므로 북한 동향·남북회담·합의서처럼 분석 대상으로 고른 핵심 데이터 범위에는 들지 않는다. 개발계정은 하루 10,000회로 호출이 제한된다.
