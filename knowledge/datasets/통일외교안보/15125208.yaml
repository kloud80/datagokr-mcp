description_portal: '정부에서 독립운동 공적으로 서훈한 독립유공자 명단입니다. 독립유공자의 관리번호, 성명, 생년월일, 사망년월일, 성별, 본적, 운동계열 등을 제공하고 있습니다.* 운동계열: 의병, 3.1운동, 문화운동, 국내항일, 의열투쟁, 학생운동, 광복군 등 16개 유형* 훈격: 건국훈장(대한민국장, 대통령장, 독립장, 애국장, 애족장), 건국포장, 대통령표창* 독립유공자 포상:독립유공자 포상은 일제하 독립운동에 헌신한 이들을 포상함으로써 그 공훈을 선양하는 사업입니다.독립유공자 포상은 단지 유공자 개인을 선양한다는 차원을 넘어 독립운동사를 재정립한다는 역사적 의의를 지니고 있으며,국민의 역사의식과 국가관을 정립하는데 주요한 기능을 수행한다고 할 수 있습니다.독립유공자 포상 및 정보 현행화에 따라 부정기적으로 업데이트 됩니다.'
