summary_user: 독립운동 공적으로 서훈받은 독립유공자를 개인 단위로 정리한 공훈 원장으로, 관리번호·성명·생년월일·사망년월일·본적·운동계열·포상년도·훈격 등을 담고 전국 19,059행 규모다. 독립운동가 개인의 서훈 내역이나 운동계열별 포상 현황을 확인하려는 국민·연구자·분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 성명이나 같은 기관 코드로 대조해 이어 쓰며, 같은 보훈 분야의 국립묘지 안장자 기록과 연결해 볼 수 있다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와 자동 결합은 어렵고, 성명 등 이름 매핑은 동명이인 오류 가능성을 확인해야 한다. 포상 및 정보 현행화에 따라 부정기적으로 갱신된다고 포털에 안내되어 있다.
