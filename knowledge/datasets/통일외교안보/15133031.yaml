description_portal: '인천천보훈병원에서 제공하는 통합EMR 시스템 보훈병원 정맥약품재료 정보로 데이터를 제공합니다.정맥 약품 재료는 정맥주사 시 사용되는 다양한 의료 용품을 포함합니다. 일반적으로 다음과 같은 재료가 필요합니다1. 정맥 카테터 및 주사기- 혈관 카테터 (Angio Catheter): 22~24G 크기 사용- 주사기: 멸균 주사기 및 주사침 포함2. 수액 및 약물- 수액백: Hartman Solution, 생리식염수 등- 약물: 항생제, 진통제, 영양제 등3. 연결 및 고정 용품- 수액세트: 수액 연결 튜브 및 조절기 포함- 고정용 반창고 및 투명 드레싱: 카테터 고정4. 위생 및 안전 용품- 알코올 솜: 주사 부위 소독- 지혈대: 혈관 확보 시 사용- 손소독제: 감염 예방데이터 구성 * 정맥약품코드: 약품구별코드 * 정액약품명: 약품명 * 영양소:  칼로리, 당질, 단백질, 지질, 칼륨 등'
