summary_user: 인천광역시 서구(제목상 서해구) 관내 보훈단체를 단체 1건당 1행으로 정리한 소규모 명부 파일(CSV 약 827바이트)로, 단체명·회장명·취임일자·연락처·팩스번호·회원수·데이터기준일자를 담는다. 지역 주민이나 국가유공자 가족이 '우리 구에 어떤 보훈단체가 있고 어디로 연락하면 되나', 또는 담당 공무원이 '단체별 회원 규모가 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키나 기관 코드가 없어, 다른 시군구 보훈단체 파일이나 현충시설 자료와는 단체명을 직접 맞춰 이어 써야 한다.
limits: 포털 설명은 소재지를 포함한다고 하지만 실제 필드에는 주소나 좌표가 없어, 지도 표시나 위치 기반 분석에는 쓸 수 없다. 범위가 한 시군구에 한정되므로 다른 지역 자료와 단체명으로 수작업 매칭해야 한다.
