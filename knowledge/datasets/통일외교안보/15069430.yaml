description_portal: 제9030부대의 월별 병영 표준 식단 정보 데이터입니다. 날짜를 비롯하여 조식, 중식, 석식, 식단별 알레르기 표시, 조식 열량, 중식 열량, 석식 열량, 열량 합계 등으로 상세하게 설명하고 있습니다. 해당 데이터를 통해 날짜별로 병영 식당에서 장병들에게 배식된 식단에 대해 알아볼 수 있으며, 기록된 식단 목록 분석을 통해 추후 식단별 영양소를 구분하거나 식단 계획을 세우고, 병영 식단에 대한 만족도 평가를 하는 등 다양하게 활용하여 병영 급식 환경과 문화를 개선하는 데에 기초 자료로써 도움을 주는 것이 가능합니다.* 숫자와 알레르기 유발 식품 간의 연결이 변동될 수 있으므로 알레르기 보유자는 식단 편성 부대에 세부적으로 다시 한번 확인해 보시기를 바랍니다.(01) 난류, (02) 우유, (03) 메밀, (04) 땅콩, (05) 대두, (06) 밀, (07) 고등어, (08) 게, (09) 새우, (10) 돼지고기, (11) 복숭아, (12) 토마토, (13) 아황산염, (14) 호두, (15) 닭고기, (16) 쇠고기, (17) 오징어, (18) 조개류
