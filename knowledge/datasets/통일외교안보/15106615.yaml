summary_user: 2005년부터 2015년까지 개성공단 입주기업 수와 연간 생산액(1만 달러 단위)을 연도별로 집계한 통계 파일입니다. 연구자나 정책 분석가가 입주기업 수와 생산액이 해마다 어떻게 변했는지 보고 남북 경제협력의 성과를 평가할 때 씁니다. 전역 조인 키는 없어서, 남북교역 통계 같은 다른 연도별 자료와는 연도 값을 맞춰서만 이어 씁니다.
description_portal: 통일부에서 제공하는 ‘통일부_개성공단 입주기업 현황’ 데이터는 2005년부터 2015년까지 개성공단에 입주한 기업의 수와 1만 달러 단위로 연도별 생산액을 집계한 통계 자료입니다. 이 자료는 개성공단의 산업 활성화와 남북 경제협력의 발전 정도를 평가하는 데 중요한 기초 데이터로 활용됩니다. 예를 들어, 입주 기업 수의 변화와 생산액 증감 추이를 분석함으로써, 남북 경제협력 사업의 성과와 한계, 그리고 경기 변동이나 정책 변화에 따른 산업 현황의 변화를 세밀하게 관찰할 수 있습니다.또한, 이 데이터는 정책 수립자, 연구자, 투자자 등 다양한 이해관계자에게 유용한 정보를 제공합니다. 정책 입안 과정에서는 남북 경협 사업의 효과를 평가하고, 향후 정책 방향을 설정하는 데 참고할 수 있습니다.
