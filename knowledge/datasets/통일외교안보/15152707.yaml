description_portal: Q-DEEP(공공협력사업) 목록은 한국국제협력단(KOICA)가 정부부처, 지자체, 공공기관 등 공공부문과 협력하여 추진하는 공공협력사업의 현황 정보를 제공하는 데이터 입니다. 주요 제공항목으로 사업명, 시작연도, 종료연도, 사업유형, 예산총액, 대상국가명, 지역명, 대표기관이 포함되어 있으며, 이를 통해 공공협력사업의 기본 정보와 참여기관 정보 등을 파악할 수 있습니다. 동 데이터는 수요가 높은 공공협력사업 정보를 제공함으로써, 신규 기관 공모 참여를 독려하고 개발협력분야에서의 공공기관 간 파트너십 확대에도 활용될 수 있습니다.
