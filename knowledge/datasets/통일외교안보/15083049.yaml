description_portal: 국방부 국유재산 매각 대상 군 보유 토지 현황에 대한 데이터입니다. 2025년을 기준으로 순번, 매각 방법, 소재지, 지번, 지목, 공부면적, 매각면적, 금액 등 국유재산 매각대상 토지에 대한 정보를 상세하게 나타내고 있습니다. 해당 데이터를 통해 현 시점에서 활용도가 적은 정부 소유 국유재산을 파악하여 보유 필요성이 낮거나 활용 계획이 없는 토지를 적극적으로 처분할 수 있으며, 국가와 지자체가 함께 개발하는 데에 도움을 줄 수 있습니다. 또한, 국유재산 매각 활성화를 위한 제도를 개선하는 것이 가능합니다.
