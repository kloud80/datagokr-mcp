description_portal: '우리나라의 유엔 평화유지활동(PKO) 파견 현황(임무단, 현재인원, 지역, 최초파견년월)을 CSV파일로 제공합니다.■ 참고 : UN PKO(Peace Keeping Operations)   °  취지 :  지역분쟁과 이로 인하여 발생하는 생존권을 비롯한 기본적 인권의 침해를 인류 공영에 대한 도전으로 간주하고 공동의 대처를 통하여 이를 평화적으로 해결하여 항구적인 세계평화를 구현   °  정의 :  UN 안보리나 총회가 행하는 결의에 의거하여 국제 평화를 위협하는 지역분쟁과 사태에 대해서  분쟁 당사자들이 분쟁해결에 대한 동의가 있는 경우 그 분쟁 지역에 이해관계를 갖지 않는 UN 회원국들이 UN 사무총장의 요청을 받아 자발적으로 군인 및 민간인들을 파견하여 파견요원들의 정치적 군사적 중립성이 유지되는 가운데  UN이 주도하여 평화적으로 수습해 나가는 UN활동'
