summary_user: 한국보훈복지의료공단이 운영하는 보훈병원을 병원 한 곳당 한 행으로 담은 전국 현황 파일(약 1.5KB CSV)로, 종별·개원일·전문의 수·병상 수·진료과 수·주소·전화번호를 담는다. 보훈대상자나 가족이 가까운 보훈병원의 위치와 규모(병상·전문의 수)를 비교하거나, 분석가가 지역별 보훈 의료 인프라를 파악하는 데 쓴다. 사업자번호(bizno)로 사업자 정보와 잇고, 시도·주소로 시군구별 보훈대상자 인원 데이터와 지역 단위로 맞대어 쓴다.
description_portal: '한국보훈복지의료공단이 관리하는 보훈병원 현황으로 기관코드, 보훈병원명, 관할코드, 종별, 대표자, 사업자번호, 보훈병원개원일, 전문의 수 등으로 구성되어 있습니다.보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
