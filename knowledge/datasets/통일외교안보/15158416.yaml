summary_user: 방위사업청 국방전자조달시스템(D2B)의 국내·국외 경쟁입찰공고와 공개수의 협상계획을 공고 건별로 담으며, 공고번호·차수, 입찰명, 발주기관, 입찰참가등록·입찰서제출 마감일시, 개찰일시, 계약방법, 물품/용역 구분, 기초예비가격·예산금액을 제공한다(검증 시 전국 범위, API 전체 227건, 2026-07-16~2026-11-10). 군납 업체가 특정 발주기관의 물품·용역 입찰 중 이번 달에 입찰서 제출이 마감되는 공고가 무엇인지 확인하거나, 분석가가 기관별·분야별 군수품 입찰 동향을 볼 때 쓴다. 전역 조인 키는 없고 같은 기관의 입찰결과·계약정보와는 공고번호·차수, 판단번호(dcsNo), 발주기관코드(orntCode)로 잇는다. 나라장터와는 G2B공고번호(g2bPblancNo)를 이름·코드 매핑하는 수준으로만 대조한다.
description_portal: 방위사업청 국방전자조달시스템(D2B)에서 제공하는 군수품조달 입찰공고 정보 데이터입니다. 본 데이터는 국내·국외 경쟁입찰공고 및 공개수의 협상계획을 포함하여 조달 공고를 기간 조건으로 조회할 수 있으며, 공고별 요구년도, 공고일자, 공고번호, 입찰명, 발주기관(기관명/기관코드), 입찰참가등록·입찰서제출 마감일시, 개찰일시, 계약방법, 입찰형태, 업무구분(물품/용역) 등의 주요 항목을 제공합니다. 또한 품목명세서 조회를 통해 입찰 대상 품목 정보를 확인할 수 있어 입찰 참여 준비, 공고 모니터링, 기관별·분야별 입찰 동향 분석 등에 활용 가능합니다.
