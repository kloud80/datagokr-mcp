description_portal: 한국국제교류재단은 해외 고등교육 기관에서의 한국학 확산과 국제적 인식 제고를 위해 ‘한국국제교류재단_해외대학 한국관련 강좌 실적’ 데이터를 공공데이터 포털에 공개하고 있습니다. 이 데이터는 2018년 기준, 전 세계 대학별로 개설된 한국 관련 강좌의 조사연도, 대학명, 강좌명 등 핵심 정보를 포함하며, 총 2,203건의 강좌 실적이 수록되어 있습니다. 자료는 CSV, XML, JSON 등 다양한 포맷으로 제공되어 연구자, 교육기관, 정책 입안자, 언론 등 누구나 자유롭게 활용할 수 있습니다. 해외 한국학 교육 현황 분석, 국제교류 정책 수립, 한류 확산 영향 평가, 대학별 강좌 개설 동향 파악, 교육콘텐츠 개발, 글로벌 협력사업 기획, 언론 보도, 학술연구, 데이터 기반 시각화, 한국어·한국학 전공자 진로 연구 등 다양한 분야에서 활용이 가능합니다. 2018년 조사한 내역으로 데이터 업데이트가 지원되지 않습니다.
