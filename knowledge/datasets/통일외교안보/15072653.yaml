description_portal: 개별 법률에 따라 국가보훈부에 등록하신 보훈대상자 본인과 선순위자인 유족 1명의 보훈대상별 인원현황을2020년 9월부터 매 월 말일자 기준으로 집계하여 2026년 6월말 현황까지 누적한 자료를 제공합니다.ㅇ 주의사항- 고엽제후유증(환자) 인원은 대상 구분을 위해 기재하였으나 국가유공자법상 "전몰·전상·순직·공상군경" 인원에 포함되므로, 국가보훈부에서 공표하는 보훈대상 전체 인원 합계에 포함되지 않습니다.- 유족이 모두 사망하였거나 국적을 상실한 분, 상이등급을 받지 못한 분, 선순위자가 아닌 유(가)족 등은 포함되어 있지 않습니다.- 대상별 중복 인원이 있어 인원 합산 시 실제 인원보다 많습니다.ㅇ 데이터 변경 안내- 25년 3월부터 기존 대상구분 일부를 상위 분류로 분리하여 제공합니다.- 25년 5월부터 기존 대상구분 기술방식을 일부 변경하였습니다.
