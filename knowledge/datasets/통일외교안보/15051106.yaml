summary_user: KOICA가 IATI 표준에 따라 보고한 개발협력 사업을 사업 단위로 담은 원장형 파일로, 프로젝트 번호·사업명·사업단계·착수/완료 일자·수원국·사업분야·예산·약정액 등을 포함하며 전체 1,646건, 기간은 2013-01-01~2026-12-31이다. 분석가나 개발협력 연구자가 특정 수원국에서 KOICA가 어떤 분야의 사업을 얼마의 예산으로 진행 중인지 확인하는 질문에 쓴다. 전역 조인 키는 없어서 수원국·사업명 같은 이름 매핑이나 같은 기관 코드로만 KOICA의 다른 사업·조달 데이터와 이어 쓴다.
description_portal: 한국국제협력단(KOICA)이 국제원조투명성기구(IATI; International Aid Transparency Initiative) 표준에 따라 보고하는 개발협력 사업 정보를 제공합니다. IATI는 개발협력에 참여하는 공여국, 국제기구, 민간기관 등이 참여하여 원조사업과 관련된 정보공개를 통해 투명성 증진을 위한 활동을 전개하는 자발적 협의체입니다. ITAI 정보는 전년도 ODA 지원실적을 공개하는 OECD DAC(개발원조위원회) 통계와 달리 현재 진행 중인 최신 사업 정보를 제공한다는 점에서 차이가 있습니다. 동 데이터는 프로젝트번호, 사업명(국/영문), 사업설명(국/영문), 사업단계, 사업착수 연월, 사업착수 실제일자, 사업완료 실제일자 등을 제공하고 있습니다.* 데이터 값이 공란인 경우, 해당 사업에 해당하지 않는 데이터로 인해 집계되지 않는 데이터입니다.
