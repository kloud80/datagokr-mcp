description_portal: 2020년부터 1월1일 부터  2025년 12월 31일까지의 현역 모집병 군별 학력별 입영 현황 데이터입니다.연도별 현역 모집병을 군별(육군,해군,공군,해병대 합산), 학력별  입영현황으로 구분했습니다.각 군별 병사 학력 구성 분포를 나타냅니다.병무청에서 제공하는 데이터이며 총 입영 당시 학력을 기준으로 대학원, 대학, 고졸(고등학교 졸업), 고등학교 퇴학 이하로 구분하였습니다. 현역 모집병으로 입영한 인원 중 학력이 대학원인 인원, 대학인 인원, 현역 모집병으로 입영한 인원 중 학력이 고졸(고등학교 졸업)인 인원, 현역 모집병으로 입영한 인원 중 학력이 고등학교 퇴학 이하인 인원을 설명한 자료입니다.입영연도별 모집병 합계를 분모로 하고, 각 군별 입영 인원을 분자로 하여 군별 비중(%) 계산이 가능합니다.입영연도와 군별 데이터값 이외 데이터는 인원 수를 의미합니다.기존에 등록되어 있는 "병무청_현역 모집병 학력별 입영 현황" 데이터와의 차이점은 군별로 데이터가 구분되어 있습니다.
