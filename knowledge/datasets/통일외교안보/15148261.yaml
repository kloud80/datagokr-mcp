description_portal: '한국보훈복지의료공단 산하 보훈요양원에서 입소 어르신을 대상으로 발생한 CMS(자동이체) 요청 내역을 집계한 통계 데이터를 제공합니다.본 데이터는 요양원 이용료 및 관련 비용 자동이체 처리와 관련된 요청 이력을 정리한 자료이며, 요청년월,  요청구분, 건수 등의 정보를 포함합니다.* 기준연도: 2025년** 공단 산하 8개 보훈요양원의 데이터를 합친 자료입니다.1. 수원보훈요양원(경기도 수원시 장안구 광교산로 95)2. 광주보훈요양원(광주광역시 광산구 첨단월봉로 85)3. 김해보훈요양원(경상남도 김해시 진영읍 하계로 127)4. 대구보훈요양원(대구광역시 달성군 하빈면 하산길 123-23)5. 대전보훈요양원(대전광역시 유성구 유성대로 935)6. 남양주보훈요양원(경기도 남양주시 덕송2로 71)7. 원주보훈요양원(강원도 원주시 혁신로 249)8. 전주보훈요양원(전라북도 전주시 완산구 쑥고개옛길 65)※ CMS(Cash Management Service): 금융결제원과 금융기관이 공동 운영하는 자동출금·입금 처리 서비스입니다.'
