summary_user: 군별(육군·해군·공군·해병대)·모집분야별·모집특기별로 지원 가능한 자격면허와 전공학과 목록을 특기 단위로 담은 전국 범위 API입니다. 입영을 앞둔 지원자가 '내 자격증이나 전공으로 어떤 특기에 지원할 수 있나', 또는 '이 특기에 인정되는 자격면허·학과는 무엇인가'를 확인할 때 씁니다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 같은 병무청 모집병 데이터(배점·접수현황 등)와는 특기 코드(gsteukgiCd)나 특기명 같은 기관 내부 코드·이름 매핑으로만 이어 씁니다.
description_portal: 모집병 지원 시 군별, 모집특기별로 지원 가능한 자격/면허, 전공학과 등 정보를 제공하는 서비스입니다.군별(육군, 해군, 공군, 해병대), 모집분야별(기술행정병, 일반/전문기술병, 전문특기병 등), 모집특기별로 정보가 구분되어 있습니다. 병무청 누리집- 군지원(입영신청)안내- 지원서 작성/수정/취소- [지원요건 검색] 메뉴에서 특기별 관련분야로 인정되는 자격면허 및 전공학과 목록을 확인할 수 있고, [지원가능분야 검색] 메뉴에서 본인의 자격면허 또는 전공학과를 입력 후 해당 조건을 기준으로 지원 가능한 특기를 확인할 수 있습니다.
