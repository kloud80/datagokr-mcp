summary_user: 외교부가 각 공관에서 올리는 국가·지역별 안전공지를 공지 한 건 단위로 담은 API로, 전체 5,997건 중 검증 수신은 1,000행(2026-07-27~2026-10-01)이다. 해외여행객이나 출장자가 가려는 나라에 최근 어떤 주의·중요 공지가 올라왔는지 확인하는 데 쓴다. 한글 국가명이나 ISO 2자리 코드(country_iso_alp2)로 국가를 지정하며, 같은 국가·지역 표준코드를 가진 다른 외교 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: "[요약 정보][상세 정보]1. 국가∙지역별 안전정보 목록 조회: 한글 국가명 또는 ISO 3166-1 국가코드(알파벳 2자리)를 아용하여국가∙지역별 안전공지 목록 조회 - 각 공관에서 실시간 업데이트 되는 국가별 최신 안전공지를 제공하는 공공데이터 API 서비스 ※ 입력변수 중 'country_nm' 항목에 'ALL(또는 all)'을 입력 할 경우 전체 국가에 해당하는 공지사항을 호출 가능 합니다.     예 ) cond[country_nm::EQ]=all[요청 정보-메세지]공공데이터포털에서 받은 인증키, 한 페이지 결과 수, 한글 국가명, ISO 2자리코드, 페이지 번호"
team:
  dept: 정보화담당관실
services:
  - op: /getCountrySafetyList7
    name: 국가∙지역별 안전공지 목록 조회
    endpoint: https://apis.data.go.kr/1262000/CountrySafetyService7/getCountrySafetyList7
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: cond[country_nm::EQ]
        required: false
        example: 카자흐스탄
        desc: 한글 국가명
      - name: cond[country_iso_alp2::EQ]
        required: false
        example: KZ
        desc: ISO 2자리코드
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지 번호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
