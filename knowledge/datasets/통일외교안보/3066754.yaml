summary_user: 사회복무요원 복무기관 본인선택 때 공개되는 공석현황을 복무기관·부대 단위 개별 건으로 담으며, 전국 대상 전체 220,852건이 2025-01-06~2025-12-18 기간으로 제공된다. 소집대기자나 재학생입영연기자가 어느 시군구의 어떤 복무기관에 공석이 몇 명 나왔는지 확인하는 질문, 분석가가 지역별 공석 배정 규모를 보는 질문에 쓴다. 시군구 코드(bjdsggjusoCd, sgg_cd 키)로 다른 시군구 단위 행정 데이터와 이어 쓰며, 같은 부문의 병역지정업체 데이터와는 공통 키가 확인되지 않는다.
description_portal: 사회복무요원 소집업무 규정 제26조(소집일자 및 복무기관 본인선택)에 따라 매년 두 차례에 걸쳐 사회복무요원 복무기관 본인선택 접수를 실시하고 있습니다. *1차는 재학생입영연기자 및 국외입영연기자, 2차는 1차대상자 + 소집대기자 사회복무요원은 시군구, 소집일자, 복무기관 등을 확인하고 접수하게 되는데, 해당 데이터는 사회복무요원 복무기관 본인선택 시 제공하는 공석현황에 관한 데이터로. 관할지방청, 시군구, 접수회차(1차, 2차), 소집일자, 복무기관명, 부대명, 선복무여부, 집행계획인원, 공석배정인원을 제공합니다.
