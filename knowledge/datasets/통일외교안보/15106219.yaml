description_portal: 통일부에서 제공하는 ‘통일부_남북 협력사업 승인 현황’ 데이터는 남북 간 교류협력 현황을 연도별로 집계한 공공데이터입니다. 본 데이터는 남북 협력사업에 대한 정부의 승인 현황을 경제(민간경협, 개성공단 승인 및 신고)와 사회문화 분야로 구분하여 각 연도별 승인 건수를 제공합니다. 세부 항목으로는 연도, 경제_민간경협(건수), 경제_개성공단_승인(건수), 경제_개성공단_신고(건수), 사회문화(건수), 그리고 계(연도별 전체 합계) 항목으로 구성되어 있습니다.이 데이터는 1991년부터 2001년까지의 초기 남북 교류협력 시기부터 현재까지, 약 30년에 걸친 남북 협력사업의 승인 현황을 연도별 데이터로 정리하고 있습니다. 데이터를 통해 남북 간 경제협력(민간경협 및 개성공단 관련 사업)과 사회문화 교류의 변화 추이를 한눈에 파악할 수 있으며, 남북관계의 주요 이슈와 정책 변화에 따른 협력사업의 증감 현상도 확인할 수 있습니다.남북 협력사업 승인 현황 데이터는 남북 교류협력의 경제적·사회문화적 흐름을 분석하는 데 유용하며, 통일정책 연구, 남북관계 현황 분석, 정책 수립 및 평가 등 다양한 분야에서 활용될 수 있습니다. 특히, 민간경협과 개성공단 사업의 활성화 정도, 사회문화 교류의 확대 여부 등 남북관계의 실질적 진전 상황을 객관적으로 평가하는 데 중요한 근거 자료가 됩니다.
