description_portal: '한국국제협력단(KOICA)이 운영하는 해외봉사단(WFK: World Friends Korea) 파견 유형별로 제공받는 사전 교육 정보를 체계적으로 정리하여 제공합니다. 해외봉사단은 현지에서 안전하고 효과적인 봉사활동을 수행하고, 현지 생활에 잘 적응하며, 파견국의 문화와 환경을 존중할 수 있도록 교육을 받습니다. 해당 데이터는 파견 유형에 따라 온라인·오프라인 교육 기간, 파견 기간, 교육 형태 같은 요소를 포함하고 있고, 이를 통해 봉사단 파견 전 어떤 류의 교육이 얼마만큼의 기간동안 진행되는지에 대한 전반적 체계를 파악할 수 있습니다.'
