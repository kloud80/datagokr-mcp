description_portal: 한국국제협력단(KOICA)의 납품대금연동 계약체결 실적 데이터로, 계약명, 계약대상자, 연동 계약체결일, 연동 대상 목적물, 조정요건 등의 항목을 제공합니다. 동 데이터는, 수·위탁거래에서 중소기업 보호를 위해 중소벤처기업부에서 신설한 제도인 납품대금연동제의 실적을 정리한 데이터로, 해외 판로 개척 제품, 본부 시설 보수 자재, 인도적 지원 장비, AI 기반 솔루션 등 다양한 물품 계약정보가 포함되어 있습니다. 중소기업의 제도 활용도를 제고하고 해당 제도 도입에 대한 기관 홍보 효과 및 계약 실적 데이터의 개방을 통한 기관의 신뢰도를 높이는데 기여합니다.
