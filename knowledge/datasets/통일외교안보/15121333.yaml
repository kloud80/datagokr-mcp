description_portal: 한국국제협력단(KOICA)이 수행 중인 다양한 사업이 유엔(UN)의 지속가능개발목표(SDGs) 17개 항목과 어떻게 연계되고 있는지를 체계적으로 정리한 자료입니다. SDGs 칼럼을 통해 각 사업의 개발효과가 어떤 목표에 기여하는지를 한눈에 파악할 수 있으며, 사업연도, 국가 및 지역, 사업유형 정보와 함께 지원액(원화 및 달러) 등의 지표도 제공됩니다. 이를 통해 KOICA의 사업 포트폴리오가 SDGs와 얼마나 연계되어 있는지 분석할 수 있으며, 목표별 기여도를 정량적으로 평가하는 기초 자료로도 활용될 수 있습니다. 전세계 데이터 기준일자에 따라 2년의 통계 일정 소요로 등록일자 -2년에 해당하는 데이터 기준일자를 부여하였습니다.
