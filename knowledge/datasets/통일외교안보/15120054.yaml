description_portal: '병역명문가는 3대(1대부터 3대까지의 직계비속 남성)*가 모두 현역복무 등을 성실히 마친 가문을 말한다.*3대 : 조부와 부·백부·숙부 그리고 본인·형제·사촌형제 등 조부의 직계비속 남자 모두현역복무 등을 성실히 마친 가문이라 함은 가족 모두 징집 또는 지원에 의하여 장교, 준사관, 부사관, 병으로 입영하여 현역 복무를 마쳤거나 장교, 준사관 및 부사관 중 의무복무기간을 마친 후 계속 복무중인 경우를 말한다. 국민방위군, 학도의용군 등 비군인 신분으로 6.25 전쟁에 참전한 사람, 대한민국임시정부 하에서 조직된 한국광복군으로 활동한 사람, 군 의무복무를 마친 여성이 있는 경우까지 포함된다. 매년 병역이행자 수 등에 따라 병역명문가 표창가문을 선정하여 시상식을 개최한다. 선정 된 병역명문가는 언론 등을 통하여 국민에게 널리 알림으로써 명예심을 제고하고 병역이행의 귀감이 되도록 하고 있다. 또한 국·공립, 지방자치단체, 민간 시설 등과 병역명문가 우대 업무협약을 추진하여 시설이용료 감면·면제 등의 우대사업을 확대해 나가고 있다.'
