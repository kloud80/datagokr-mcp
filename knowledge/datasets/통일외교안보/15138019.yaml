description_portal: '독립기념관은  1987년 8월 15일, 우리는 진정한 조국 광복과 민족의 번영을 염원하고, 우리 역사를 지키며 나라사랑 정신을 고취하고자 당시로선 천문학적인 국민성금 500억원으로 건립되 기관으로 독립기념관의 업무수행 지원을 위해 개인·법인 또는 단체가 돈이나 그 밖의 재산을 출연하거나 기부할 수 있도록 하고 있습니다. 본 자료는 기관 운영과 관련하여 국민, 기업 , 단체 등에서 운영지원금, 기부물품, 조건부 기부금, 홍보용 옥외광고비, 외부연구용역비 등의 명목으로 기부받은 한 내역입니다.  제공해주신 기탁금은 나라사랑을 위한 국민정신교육사업에 소중하게 쓰이고 있습니다.기부기간 : 2012년 ~ 2024년갱신기간 : 매년 1회'
