summary_user: 국가·지역별 면적, 수도, 기후, 민족, 언어, 인구, 종교, 건국일 같은 일반 개황을 국가 한 곳당 한 건의 설명형 텍스트로 담는다. 해외 진출 사업자나 여행·유학 준비자가 '이 나라의 공용어와 주요 종교, 인구 규모는 어떤가'를 빠르게 확인할 때 쓰며, 한글 국가명이나 ISO 국가코드로 조회한다. 실측상 전역 조인 키는 없어서, ISO 2자리 국가코드(country_iso_alp2)나 한글 국가명을 매핑해 여행경보·재외공관 같은 외교부 국가별 데이터와 잇는다.
limits: 국가 개황은 모델이 이미 아는 참고 텍스트 성격이어서 관리 검토에서 외교 부문 핵심 범위에서 제외됐고, 통계 분석용 정형 수치로 보기 어렵다. 공간 정보가 없는 비공간 데이터이고, 개발계정 호출은 하루 5,000회로 제한된다.
