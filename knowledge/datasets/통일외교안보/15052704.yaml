summary_user: 국방기술품질원이 국방(DQ)마크 인증을 준 업체별 인증 내역을 담은 파일 데이터로, 인증번호·업체명·인증년도·최초인증일·유효기간·인증 제품·품목수·소재지·전화를 한 행에 담는다(전국 범위, 소재지는 개별 주소 단위). 방산 협력업체를 찾는 사업자나 분석가가 "어떤 업체가 어떤 국방 제품으로 DQ마크를 받았고 인증이 언제까지 유효한가"를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 방산업체 지정·국방규격·군수품 조달 데이터와는 업체명 매칭으로만 이어 쓴다.
limits: 표준 업체 식별 코드가 없어 다른 데이터와 묶을 때 업체명 표기 차이로 누락·오매칭이 생길 수 있다. 군수품 조달(입찰·계약) 정보는 담지 않으며, 국방전자조달은 나라장터와 별도 체계다.
