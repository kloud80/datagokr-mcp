description_portal: 국방부 군 자살률 통계와 중앙자살예방센터에 기록된 자살자 수(민간 자살률), 서울시 20대 남성 자살자 수를 비교한 자료입니다. 2011년부터 2025년까지 15년간 발생한 군 자살률과 민간 자살률, 20대 남성 자살률의 차이를 비교 분석하여 나타낸 데이터로, 원인 분석을 통해 군 사망 사고 중에서 가장 높은 비율을 차지하고 있는 자살 사고를 예방하는 대책 마련을 가능하게 합니다. 특히 심리 치료 프로그램 및 자살예방종합시스템, 국방 헬프콜센터, 병영생활전문상담관 운용을 강화하는 등 다양한 예방조치를 취할 수 있습니다.
