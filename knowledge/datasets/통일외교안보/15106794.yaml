description_portal: 대한민국 국군 장병 대상의 대학 원격 강좌 교육 과정에 대한 개설 강좌 정보를 담은 데이터입니다. 원격 강좌는 군 복무 중 국방부와 협정 체결이 맺어진 본교 e-러닝 수업을 수강하면 학점을 취득할 수 있는 제도로, 원격 강좌 개설 대학은 국군 장병들이 군 e-러닝 시스템(https://www.narasarang.or.kr/)에 접속하여 확인할 수 있으며, 온라인으로 개설된 강좌를 수강할 수 있습니다. 해당 데이터를 통해 복무 중 중단 없이 학습하며, 자기 개발을 통해 생산적인 복무 여건을 조성하는 것이 가능합니다.
