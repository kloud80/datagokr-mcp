description_portal: 병역판정검사 최초수검시 신장, 체중 등 신체검사 결과 정보(※BMI가 저체중 이거나 고도비만인 데이터는 표시되지 않습니다)* 현재 BMI 기준 18.5 이상 부터 35 이하 까지 표시 됩니다. (BMI 공개 기준은 병역판정검사과에서 검토 중)* 병역법 제11조에 따라 병역의무자는 19세가 되는 해에 병역을 감당할 수 있는지를 판정받기 위하여 지방병무청장이 지정하는 일시(日時)ㆍ장소에서 병역판정검사를 받아야 하며 병역판정검사를 받아야 하는데 받지 아니한 사람과 병역판정검사가 연기(延期)된 후 그 연기사유가 소멸된 사람은 그 해 또는 그 다음 해에 병역판정검사를 받아야 합니다.
