description_portal: '한국국제협력단(KOICA)이 국제질병퇴치기금(Global Disease Eradication Fund)을 통해 추진하는 감염병 대응 사업 목록을 제공합니다. 국제질병퇴치기금은 국내에서 출발하는 모든 국제선 항공권에 1,000원을 부과하는 "항공권연대기금(Air-ticket solidarity levy)" 제도를 기반으로 조성된 재원으로, 개발도상국의 감염병 예방 및 퇴치를 지원하여 글로벌 사회적 가치(SDGs3: 모두를 위한 전 연령층의 건강한 삶 보장과 웰빙 증진) 달성에 기여하고자 합니다. 제공되는 데이터에는 사업명(국문 및 영문), 시작 및 종료 연도, 예산 총액, 대상 국가 및 지역, 수행기관, 담당 부서 등의 정보가 포함되어 있으며, 이를 통해 감염병 대응 사업의 추진 현황을 파악하고, 개발협력 분야의 정책 수립, 사업 평가, 연구 등에 활용할 수 있습니다.※ 「국제질병퇴치기금법」이 2024년 12월 31일부로 폐지됨에 따라, 해당 법률을 근거로 추진되던 관련 사업이 종료되어 신규 데이터 수집이 중단되었습니다. 본 데이터는 기존 수집분만 제공되며, 신규 데이터 확보 시 수시로 제공될 예정입니다.'
