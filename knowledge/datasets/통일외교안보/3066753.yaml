summary_user: 병무청이 제공하는 사회복무요원의 연도별·분야별 소집 계획 인원 자료로, API 전체 22,961건의 전국 단위 비공간 데이터이다. 사회복무요원 복무를 앞둔 사람이나 병무행정 분석가가 연도별로 어느 분야에 몇 명을 소집할 계획인지 확인하는 데 쓴다. 전역에서 통용되는 조인 키는 확인되지 않아, 같은 기관 코드(bmgigwanCd)나 분야명(bmbunyaNm)을 이름·코드 매핑으로 맞춰 병무청의 다른 사회복무·병역지정업체 자료와 잇는다.
limits: 전체 22,961건 중 검증에서는 1,000행만 받았으므로 전량 수집하려면 페이지를 23회 이상 반복 호출해야 한다. 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑을 거쳐야 하며, 필드별 명세상 의미와 코드표가 입력에 없어 코드값의 뜻은 별도 확인이 필요하다.
