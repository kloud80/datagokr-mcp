description_portal: '평가원에서제공하는동일성분배수함량등재의약품리스트관리로 저함량의약품표준코드, 저함량의약품수가코드, 저함량의약품저함량제품명, 저함량의약품실거래가, 저함량의약품상한가, 배수, 고함량의약품표준코드, 고함량의약품수가코드, 고함량의약품저함량제품명, 고함량의약품실거래가, 고함량의약품상한가 등으로 구성되어 있습니다.한국보훈복지의료공단 소속기관인 6개 보훈병원(중앙, 부산, 광주, 대구, 대전, 인천)의 홈페이지를 통한 연령대별 진료과 진료예약 건수 통계자료입니다.보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
