description_portal: '독립기념관에서 이달의 독립운동가에 대한 정보를 좀 더 국민들에게 쉽게 전달하고 가까이 다가가기 위해 진행했던 이벤트로 매월 단위로 진행하였다.대상자료 시기 : 2011-07 ~ 2020-11샘플자료김 : 김규식 선생은 조선에서 영어를 제일 잘 했던 사람으로 알려져 있고,규 : 규모를 국내에서 국외로 넓혀가며 평생을 조국의 독립을 위해 헌신했다.식 : 식민지 하에 놓인 우리나라의 독립을 위해서라면 그 어떠한 것도 놓치지 않고 헌신했던 선생의 업적을 기린다.김 : 김규식 선생의 수 많은 업적에 빼놓을 수 없는 히로인, 부인 김순애 여사.순 : 순결하고 아름다움으로 대표되는 여성미(美)를 과감히 벗어 던지고,애 : 애국심으로 똘똘 뭉친 당당함과 강인함을 독립운동 전선에 과감히 떨쳐 독립을 쟁취했다.'
