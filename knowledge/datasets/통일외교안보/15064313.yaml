description_portal: 한국국제협력단(KOICA) ODA교육원이 제공하는 ODA 교육 과정 정보를 체계적으로 정리한 자료입니다. ODA 교육원은 우리나라 개발협력의 양적, 질적 성장 기반을 견고히 하는 개발교육 플랫폼으로서 역할을 수행하기 위해 다양한 타깃별 맞춤형 교육과정을 운영하고 있습니다. 그리고 동 데이터는 그러한 교육과정의 과정명, 강의 주요 내용, 교육 대상, 운영 방식(온라인/오프라인), 수강 신청 절차 및 접근 경로 등의 핵심 정보를 포함하고 있습니다. 이를 통해 개발협력 분야 종사자와 예비 실무자들의 경우 ODA 역량 개발 기회를 쉽게 파악할 수 있으며, 교육 수요자 입장에서는 강의 일정과 주제 등의 데이터를 기반으로 본인의 필요에 맞는 교육과정을 확인하고 준비할 수 있습니다.
