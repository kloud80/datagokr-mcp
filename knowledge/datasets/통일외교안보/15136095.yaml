summary_user: 상이 국가유공자 등에게 승선권을 할인해 주는 이용협정을 맺은 민간 내항여객선사를 선사 한 곳(행) 단위로 담은 전국 목록 파일로, 선사 명칭·항로·주소·전화번호·누리집 주소·협약연월을 담는다. 애국지사·상이 국가유공자·5·18 부상자와 가족이 '내가 타려는 섬 항로의 배편이 보훈 할인 대상인지, 어느 선사에 문의해야 하는지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 선사 명칭이나 항로명(항로)을 이름으로 맞춰 연결해야 한다.
description_portal: '상이 국가유공자등에게 이용권을 할인해주는 민간 내항여객선사의 명칭, 항로, 선사 연락처 및 주소 정보를 제공합니다.ㅇ 대상 : 애국지사, 1~7급 상이 국가유공자, 5․18민주화운동부상자ㅇ 횟수 : 육상거주자 연  6회, 도서거주자 연 12회ㅇ 방법 : 매표창구에서 국가유공자증 등 제시(선사에서 매표시스템을 통해 승선이용권 온라인 조회), 승선권 발권 및 승선'
