description_portal: 한국국제협력단(KOICA)이 시행한 코로나19 대응 포괄적 지원프로그램의 지원 실적을 정리한 통계 자료입니다. 연도별·국가별 계획금액, 집행금액, 수혜자수 등의 코로나19 지원실적에 대한 주요 정보를 포함하고 있어, 각 국가에 대한 KOICA의 코로나19 대응 현황을 한눈에 확인할 수 있습니다. 더불어 코로나 19와 관련된 KOICA의 재원 배분 구조를 체계적으로 파악할 수 있습니다. 본 통계는 KOICA가 코로나 19에 대응한 프로그램의 재정투명성 강화와 사업 책임성 확보에도 기여합니다.
