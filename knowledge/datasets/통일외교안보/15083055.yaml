description_portal: 군 감염병 현황 정보를 담은 데이터입니다. 매년 발생한 감염병 정보 현황에 대해 분기별(4분기)로 나누어 질병명(A형 간염, 세균성 이질, 파상풍, 홍역, 유행성 이하선염, 수두, 결핵, 말라리아, 수막구균성 수막염 등)과 현황(인원수) 등으로 상세하게 나타내고 있습니다. 해당 데이터 분석을 통해 분기별로 유행하는 감염병을 파악할 수 있으며, 감염병에 따른 예방책과 대응책을 마련하는 데에 기초 자료로써 활용하는 것이 가능합니다. 또한, 감염자가 발생하더라도 미리 마련한 대응책을 통해 확산을 막을 수 있습니다.
