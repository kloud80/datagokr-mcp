description_portal: 한국국제협력단(KOICA)이 개발도상국의 경제·사회 발전을 지원하기 위해 운영하는 글로벌연수사업 목록을 제공합니다. 연수사업은 개도국의 공무원, 기술자, 연구원, 정책결정자 등을 대상으로 실시되며, 전문성과 리더십을 갖춘 인재양성을 목표로 합니다. 연수사업은 CIAT(씨앗; Capacity Improvement & Advancement for Tommorrow)이라는 브랜드명으로 운영되고 있습니다. 동 데이터의 주요 항목으로는 연수사업 유형, 수행 지역 및 국가, 사업명(국문 및 영문), 시작연도와 종료연도 등이 포함되어 있으며, 이를 통해 국제협력사업의 인적자원 양성 현황을 분석하고, 연수 프로그램의 성과를 연구하는 데 활용할 수 있습니다.
