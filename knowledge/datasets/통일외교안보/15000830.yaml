summary_user: 여행 대상 국가별로 국가명·영문명·대륙, 위치·기후·면적·인구·수도·민족·종교·언어·화폐·시차 같은 기본정보 텍스트(basic), 국기 이미지 경로를 한 국가당 한 건씩 담은 목록·상세 정보이다. 해외여행을 준비하는 국민이나 여행·관광 서비스 사업자가 '이 나라의 수도·언어·화폐·시차는 무엇인가'를 확인하거나 국가 소개 화면을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 해외안전·여행경보나 출입국·관광 국적 데이터와는 국가명(countryName)·영문명 매핑으로 이어 쓴다.
description_portal: '여행 대상 국가의 국가명, 영문명, 대륙 및 기본정보, 국기 이미지 경로 등을 포함한 목록정보와 단일 국가정보에 대한 상세정보를 조회할 수 있다.예) 태국ㅇ 국  명 : 타이 왕국(Kingdom of Thailand)ㅇ 위  치 : 위도상 북위 5.6°- 20.7°, 경도상 동경 97.3°- 105.7°          (방콕 : 북위 13.5°, 동경 100.5°)ㅇ 기  후 : 고온다습한 열대성 기후이며, 3계절로 대별(2월중순 ∼ 5월 고온, 6월 ∼ 10월 우기, 11월 ∼ 2월초 비교적 저온)    - 연평균 기온   : 28℃(평균최고 32.5℃, 평균최저 23.7℃)    * 방콕 연평균 기온 : 28℃(평균최고 32.5℃, 평균최저 23.7℃    - 연평균 강우량 : 1,600 mm    - 연평균 습도   : 79%(최고 94%, 최저 60%)ㅇ 면  적 : 51.4만 k㎡(한반도의 2.3배)ㅇ 인  구 : 약 6,407만명(2012년)ㅇ 수  도 : 방콕시(Bangkok : 인구 570만명), 방콕시 및 인근지역(약 1,200만명) ㅇ 민  족 : 타이족 85%, 화교 12%, 말레이족 2%, 기타 1%ㅇ 종  교 : 불교 94.6%, 이슬람교 4.6%, 기독교 0.7%, 기타 0.1%ㅇ 언  어 : 타이어(공용어)ㅇ 화폐단위 : 밧 또는 바트 (Baht, 1Baht 100Satang)ㅇ 시  차 : -2시간(우리나라 시간보다 2시간 느림)'
