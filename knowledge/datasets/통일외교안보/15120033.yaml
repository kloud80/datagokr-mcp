description_portal: 한국국제협력단(KOICA)와 협력관계를 맺고 있는 개발협력연대(DAK)의 공식 회원기관 목록을 정리한 자료입니다. DAK는 지구촌 빈곤, 불평등 감소 및 지속 가능한 개발을 목표로 정부, 기업, 시민사회, 학계 등 다양한 주체가 협력하는 참여형 협력체제입니다. 각 회원기관의 명칭, 기관 성격(민간·공공·학계 등), 홈페이지 주소 등의 정보가 포함되어 있어, 협력 네트워크의 현재 구성을 확인할 수 있습니다. DAK가 다양한 민간파트너 및 정부가 함께 참여하는 협력체제임을 감안, 무상원조와 관련된 하나의 네트워크를 이해하는 기초자료입니다. 최신 업데이트 기준으로 전체 170개 기관 정보를 포함하여 제공하고 있습니다.
