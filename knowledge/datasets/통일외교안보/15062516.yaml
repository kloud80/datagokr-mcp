description_portal: 2024년도 재병역판정검사 처분 인원으로 기존 현역, 보충역 구분된 자원이 재병역판정검사 결과 현역, 보충역, 면제, 재검으로 각각 처분된 현황입니다.* 병역법 제11조에 따라 병역의무자는 19세가 되는 해에 병역을 감당할 수 있는지를 판정받기 위하여 지방병무청장이 정하는 일시.장소에서 병역판정검사를 받게 되며, 병역판정검사를 받아야 하는데 받지 아니한 사람과 병역판정검사가 연기 된 후 그 연기사유가 소멸된 사람은 그 해 또는 그 다음 해에 병역판정검사를 받게 됩니다.* 현역병 또는 보충역을 병역처분 받은 사람이 그 처분을 받은 다음 해부터 4년이 되는 해의 12월31일까지 징집 또는 소집되지 않는 경우 5년이 되는 해에 재병역판정검사를 받게 됩니다.
