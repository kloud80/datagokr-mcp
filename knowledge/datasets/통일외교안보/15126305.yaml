description_portal: 본 데이터는 국군복지단에서 운영하는 영외마트 현황을 제공합니다. 전국 약 122개 영외마트의 구분, 마트명, 규모, 요일별(평일/토요일/일요일) 운영시간 및 점심시간, 비고(휴점일·특이사항), 마트번호, 위치 정보를 포함합니다.서울·경기·인천·부산 등 전국에 분포하며, XLS·CSV·JSON 형식으로 제공되어 군인·가족의 복지시설 이용 계획 수립, 시설 운영 효율화, 정책 개선에 활용됩니다. 비고란에는 휴점일이나 이용 제한 사항이 기재되어 있으므로 사전 확인이 필수적입니다.국군복지단의 시설 관리 부서에서 수요 분석을 통해 공급망 최적화 또는 신규 마트 설치 지역 선정 또는 정책 연구자가 지역별 복지 시설 격차를 분석해 정책 개선 방안 마련 등에 활용할 수 있습니다.
