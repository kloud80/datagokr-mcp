description_portal: 상근예비역 지방청별 일자 연기 현황 데이터는 병무청에서 관리하며, 전국 각 지방병무청을 단위로 연기 건 수를 분류한 자료입니다.  이 데이터는 상근예비역 입영 대상자의 입영일자을 연기한 현황을 사유 별로 정리한 것으로 주요 연기 사유에는  질병, 군지원 응시, 채용시험, 각급학교 진학, 자격면허 시험응시, 취업 사유 등이 포함됩니다. 각 사유별로 연기 건수를 지방청별로 집계하여 공개함으로써, 지방청별/연기사유별 현황을 객관적으로 파악할 수 있습니다.  이 데이터는 CSV형식으로 제공되며, 매년 12.31.기준으로 작성하였음을 알려드립니다.
