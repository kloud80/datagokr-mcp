description_portal: 병역지정업체 정보는 병역일터 병역지정업체 검색해서 확인할 수 있습니다. 대분류로 전문연구요원, 산업기능요원, 승선근무예비역으로 구분됩니다.산업기능요원(제조업, 정보처리 등)전문연구요원(기업부설연구소 등), 승선근무예비역(수산업, 해운업)이 근무할 지정업체는 기업별, 업종별, 소재지별, 채용공고 등록여부 등을 조건으로 검색하면 됩니다. 참고로 병역지정업체는 일정 사유가 발생 시 취소되기도 하고, 매년 병무청 고시에 따라 업종에 따라 접수기관에 신규로 선정신청을 할 수도 있습니다.
