summary_user: 병무청이 지정한 전문연구요원·산업기능요원 근무 업체를 업체 한 곳당 한 건으로 담으며, 업체명·주소·업종구분·기업규모·선정년도·사업자번호·연락처·홈페이지를 전국 범위로 제공한다. 병역 대체복무를 준비하는 사람이 '우리 지역에서 산업기능요원으로 일할 수 있는 정보처리 업종 지정업체는 어디인가'를 찾거나, 분석가가 지역·업종·기업규모별 지정업체 분포를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 사업자번호(saeopjaDrno)나 업체명·주소를 매칭해 다른 기업 데이터나 같은 기관의 인원배정·채용 데이터와 이어 쓴다.
limits: 검증된 공통 조인 키가 없어 다른 데이터와는 사업자번호·업체명 매칭에 기대야 하며, 업종구분·기업규모는 코드값이라 별도 해석이 필요하다. 개발계정 호출은 하루 10,000회로 제한된다.
