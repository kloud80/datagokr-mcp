description_portal: 국가보훈부에서 지정한 자활용사촌의 명칭과 소재지, 그곳에서 생산하는 품목 및 조달청 물품목록번호, 공장(법인) 명칭과 소재지, 연락처를 제공합니다.* 자활용사촌이란? - 전상군경 및 공상군경 중 상이등급 1급에 해당하는 자의 자활을 촉진하기 위하여 전ㆍ공상군경 1급 중상이자 20명 이상이 동일한 행정구역에 거주하고 있는 마을을 의미합니다. - 사업장인 복지공장을 운영하고 수익금을 공동분배함으로써 생활안정을 도모합니다. 세금 감면이나 생산품 수의 계약(경쟁에 부치지 않고 자격을 가진 특정 상대와 계약을 체결하는 것) 등을 지원하고 있습니다.ㅇ 각 공장 사정이 확인될 때마다 부정기적으로 업데이트 되는 자료입니다. 품목에 변경이 있을 수 있으므로 구매 전 해당 공장 용사촌으로 확인 바랍니다.  * 공공데이터 업로드 전 최신 정보는 국가보훈부 홈페이지 https://www.mpva.go.kr/mpva/selectBbsNttList.do?key=188 참고
