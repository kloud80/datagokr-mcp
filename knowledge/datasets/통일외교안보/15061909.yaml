description_portal: 2021년부터 2024년까지의 정시·수시 모집별 기숙사 공고 내역을 체계적으로 정리한 자료입니다.이 데이터는 총 7개 열로 구성되어 있으며, 각 필드의 역할은 다음과 같습니다.먼저 모집년도 열은 데이터가 속한 연도(2021~2024)를 표시하며, 모집형태 열은 정시 또는 수시와 같은 모집 유형을 구분합니다.차수 열은 연간 모집 단계를 나타내며, 예시로 1차·2차 등으로 세분화됩니다. 제목 열에는 해당 공고의 명칭을 기재했으며, 내용 열에서는 대상, 접수기간, 신청자격, 유의사항 등 세부 정보가 기술되어 있습니다. 마지막으로 시작일자와 종료일자 열은 신청 가능 기간을 날짜 범위로 명시해 사용자가 신속히 일정을 확인할 수 있도록 돕습니다.
