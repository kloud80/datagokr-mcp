description_portal: 육군 헌혈자 통계에 대한 데이터입니다. 육군에 속한 인원 중 연도별로 헌혈을 실시한 인원수에 대한 데이터를 제공하고 있습니다. 해당 데이터를 통해 육군 장병들이 헌혈에 대해 가지고 있는 관심도와 가치관을 확인해 볼 수 있습니다. 또한, 이미 자율적인 헌혈 제도와 헌혈 유공자(다회헌혈자) 수여를 통해 헌혈이 적극적으로 장려되고 있으나, 더 높은 자발성과 헌혈 참여 유도를 이끌기 위한 홍보 방식과 제도 개선에 대해 기초 자료로써 활용하는 것이 가능합니다.* 연말에 지속적으로 업데이트될 예정입니다.
