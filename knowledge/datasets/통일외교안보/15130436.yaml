description_portal: 우리나라의 고조선부터 대한민국임시정부까지 외세의 침입으로부터 나라를 지키기 위한 국난극복의 역사를 시기별로 정리한 역사 해설 자료입니다. 고조선, 고구려, 백제, 발해, 고려, 조선시대까지  발생한 수나라, 당나라, 거란, 몽고, 일본, 청나라 등 외세의 침입에 당당하게 맞서서 물리친 우리 민족의 역사를 설명하고 있으며일제강점기가 도래하기  전 개화와 척사, 동학, 의병 등에 대한 내용과 일제강점기 독립협회, 애국계몽운동, 만세운동, 의열투쟁, 무력투쟁 및 대한민국임시정부에 대한 내용으로 되어 있으며 총  29개 카테고리로 구분하여 설명하고 있습니다.
