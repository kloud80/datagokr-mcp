description_portal: 군인을 대상으로 한 특별공급 주택 공고의 세부 내용을 담고 있습니다.주요 정보는 많은 컬럼에 해당하는 정보를 제공하고 있습니다.- 시간 관련 정보로는 청약연도, 차수, 일정(접수 시작일, 접수 종료일, 접수 종료시), 발표일정(당첨자 발표일, 모집공고일)에 해당합니다.- 지역 관련 정보로는 위치정보인 신청지역에 대한 정보가 해당됩니다.- 주택 관련 정보는 주택 유형(종합주택), 단지 정보(블럭), 면적(평형)에 해당합니다.- 금융 관련 정보는 청약저축, 청약예금, 청약부금에 해당합니다.- 숫자 관련 정보는 모집인원에 해당하며, 상태 관련 정보는 사용여부가 해당됩니다.본 데이터의 목적별 분류를 통해 군 특별공급 주택 공고의 세부 정보를 체계적으로 이해할 수 있습니다.
