summary_user: 경기도 시군에 등록된 보훈단체를 단체 한 곳당 한 행으로 담은 목록으로, 단체명·소재 시군·도로명/지번 주소·위경도 좌표·설립연도·사무실 전화번호·기준일자를 포함한다. 국가유공자나 유족이 우리 시군에 어떤 보훈단체가 있고 어디로 연락하면 되는지 찾을 때, 분석가가 시군별 보훈단체 분포와 접근성을 비교할 때 쓴다. 전역 조인 키는 없어서 시군명(sigun_nm)으로 시군구 보훈대상자 인원과 맞추거나, 위경도로 현충시설·보훈병원 위치와 공간적으로 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 각 시군에 등록된 보훈단체의 현황을 정리한 자료로, 단체명, 설립년도, 회원 수, 주소 등의 정보를 포함하고 있습니다. 해당 데이터는 다양한 보훈 유관 단체들로 구성되어 있으며, 국가유공자 및 유족의 권익 보호와 복지 증진, 보훈정신 계승을 위한 활동을 수행하고 있습니다. 이 자료는 보훈단체 운영 현황 파악, 지역 기반 복지정책 설계, 보훈 관련 서비스 접근성 분석 등에 활용될 수 있으며, 특히 단체 분포 및 활동력 분석을 통해 보훈 정책의 지역적 균형성과 실효성 향상에 기여할 수 있습니다.
