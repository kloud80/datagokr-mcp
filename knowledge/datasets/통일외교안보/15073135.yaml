summary_user: KOICA 국제협력사업의 원조조달 계약을 계약 한 건씩 담은 목록으로, 전체 115건에 계약번호·계약명·계약방법·계약일자·계약금액·계약업체 등이 들어 있다. 국민이나 분석가가 KOICA의 용역·구매 계약이 어떤 조달 방식으로, 얼마 규모로 체결됐는지 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 계약명이나 업체명 같은 이름 매핑, 또는 같은 기관 코드로만 잇는다.
description_portal: 한국국제협력단(KOICA) 국제협력사업에 대한 원조조달 계약목록으로, 계약번호, 계약업체, 계약명, 계약방법, 계약날짜, 계약금액 등의 정보를 제공합니다. 이를 통해 KOICA에서 진행하는 용역이나 구매가 어떤 조달 방식을 통해 계약이 체결되는지를 알 수 있으며, 나아가 계약 범위에 대한 상세한 내용을 확인할 수 있습니다. 각 계약에 대한 정보를 활용해 국제개발협력 사업 조달 및 계약에 대한 통계를 확인하고 그 내역을 분석을 할 수 있습니다. 보다 상세한 계약 내역 및 조달 관련 정보는 KOICA 전자조달시스템(nebid.koica.go.kr)에서 확인하실수 있습니다.
