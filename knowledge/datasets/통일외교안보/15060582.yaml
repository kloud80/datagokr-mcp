description_portal: 통일부에서 제공하는 ‘남북교역 거래유형별 통계 데이터’는 1989년부터 현재까지 남북 간 교역 실적을 거래유형별로 집계한 공공데이터입니다. 본 데이터는 남북 경제협력 및 교역의 역사적 흐름과 변화상을 파악할 수 있도록 체계적으로 정리되어 있으며, 각 연도별로 남북 간 거래가 어떻게 진행되었는지, 주요 거래유형에 따라 어떤 특징이 있는지 등을 세부적으로 분석할 수 있습니다.데이터는 기간(연도별,월별), 거래유형(상업적/비상업적거래, 일반교역, 위탁가공, 개성공단사업, 협력사업 등), 반입·반출·반출입 금액(1달러,1000달러,백만달러) 및 중량(kg,톤), 각 항목별 증감률, 그리고 HScode(2,4,6,10자리), MTI(1,2,3,4,6단위) 등이 포함되어 있습니다. 이 데이터를 통해 남북교역의 연도별 변화 추이, 거래유형별 특징, 교역 규모의 증감 등 다양한 통계적 분석이 가능합니다.
