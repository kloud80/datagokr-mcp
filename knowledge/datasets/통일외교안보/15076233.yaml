summary_user: KOICA가 해외사업 수행 시 위험요소(정세 불안·재난·감염병 등)를 사전에 파악하려고 지정한 안전관리 중점국가를 국가별 건 단위로 담으며, 전체 1,000건이 2021-01-28~2023-02-15 기간에 걸쳐 있다. 해외사업 담당자나 분석가가 특정 국가가 어떤 위험수준과 위험내용으로 안전관리 대상이 되었는지 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않았고, 국가 ISO 2자리코드(country_iso_alp2)나 국가명을 다른 국가 표준코드와 매핑하거나 같은 기관 코드로만 연결한다.
description_portal: KOICA가 지정한 일일 안전관리 중점국가 목록 정보를 제공하는 API입니다. 정세 불안, 재난, 감염병 등 다양한 위험요소에 따라 안전관리가 필요한 국가를 분류하여, KOICA의 해외사업 수행 시 위험요소를 사전 인지하고 대응할 수 있도록 합니다. 해당 API는 인증키(serviceKey), 페이지 번호(pageNo), 한 페이지 결과 수(numOfRows) 등 기본적인 요청변수를 사용하며 한글 국가명, 데이터표출방식, ISO 2자리코드 등의 필터 파라미터를 추가로 설정할 수 있습니다. 출력결과에는 국가명, ISO 2자리코드, 신규구분코드, 보고일, 위험내용, 위험수준코드 등의 항목이 포함되며, 각 항목에 대한 데이터는 JSON 형식으로 반환됩니다.
