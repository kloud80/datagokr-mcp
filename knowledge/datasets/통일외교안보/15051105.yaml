summary_user: KOICA 고유 국가코드를 DAC(개발원조위원회) 코드, ISO 3166-1 숫자·2자리·3자리 알파벳 코드, 국가명과 한 행씩 대응시킨 국가 단위 코드 매핑표로, CSV 파일 크기는 약 8.8KB다. KOICA ODA 사업 데이터를 분석하는 연구자나 개발자가 "KOICA 사업 자료의 국가코드를 ISO·DAC 기준 통계와 맞추려면 어떻게 바꿔야 하나"를 풀 때 쓴다. KOICA 국가코드와 ISO 2자리 알파벳 코드가 조인 키(country_cd)여서, KOICA ODA 사업·조달 자료나 외교부 해외안전·재외공관 등 ISO 코드를 쓰는 데이터와 잇는 변환표로 쓴다.
description_portal: 한국국제협력단(KOICA)이 관리하는 KOICA 고유 국가코드와 국제 표준 코드(ISO, DAC) 간 매핑 정보를 체계적으로 정리한 수시성 자료입니다. 국가 이름, KOICA 코드, DAC(개발원조위원회) 코드, ISO 3166-1 숫자 코드 및 알파벳 코드(2자리/3자리) 등의 정보를 포함하여, 기관 내외부 데이터 연계 시 국가 식별의 혼동을 줄이고 정합성을 높이는 핵심 도구로 활용됩니다. 동데이터는 CSV뿐 아니라 XML, JSON 형태로 제공되어 자동화 스크립트나 API 연계 등에도 유리하게 활용될 수 있습니다.
