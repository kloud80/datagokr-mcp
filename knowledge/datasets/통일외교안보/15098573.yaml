summary_user: 강원특별자치도와 관할 시군구에 주소를 둔 보훈대상자 본인과 선순위 유족 1명의 인원을 연도·분기별, 시군구별, 대상구분(상·하위)별로 집계한 파일 데이터로, 시군구명이 '강원특별자치도'인 행은 도 전체 합계다. 지역 보훈 정책 담당자나 분석가가 '강원도 어느 시군에 참전유공자나 국가유공자 유족이 많이 사는가'처럼 지역별 보훈 수요를 파악하는 데 쓴다. 실측 컬럼에 행정구역 코드 같은 공통 조인 키가 없어서, 다른 시군구 통계와는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: 개별 법률에 따라 국가보훈부에 등록하신 보훈대상자 본인과 선순위자인 유족 1명 중 강원특별자치도 및 관할 시군구로 주소가 되어 있는 분들의 현황입니다.시군구명이 "강원특별자치도"인 정보는 강원특별자치도 합계 인원입니다.<참고>ㅇ 주의사항 - 고엽제후유증(환자) 인원은 국가유공자법상 "전몰·전상·순직·공상군경"에 포함됩니다. - 유족이 모두 사망하였거나 국적을 상실한 분, 상이등급을 받지 못한 분, 선순위자가 아닌 유(가)족 등은 포함되어 있지 않습니다.- 대상별 중복 인원이 있어 인원 합산 시 실제 인원보다 많습니다.ㅇ 데이터 변동 안내 - 24년 3분기부터 기존 대상구분 일부를 상위 분류로 분리하여 제공합니다. - 25년 2분기부터 기준연월을 연도와 분기로 분리하고 대상구분 명칭 일부를 수정하여 제공합니다(이전 정보와 연번은 동일).
