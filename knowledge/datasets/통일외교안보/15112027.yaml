description_portal: 2015년부터 2025년까지  병역판정검사 수검자 중 4급~6급 판정 받은 사람의 부령조항과목, 부령조항, 질병명 별 현황입니다.* 병역법 제11조에 따라 병역의무자는 19세가 되는 해에 병역을 감당할 수 있는지를 판정받기 위하여 지방병무청장이 정하는 일시.장소에서 병역판정검사를 받게 되며, 병역판정검사를 받아야 하는데 받지 아니한 사람과 병역판정검사가 연기 된 후 그 연기사유가 소멸된 사람은 그 해 또는 그 다음 해에 병역판정검사를 받게 됩니다.* 병역판정검사는 병역판정 신체검사 등 검사규칙의 질병. 심신장애의 정도에 따른 신체등급의 판정기준에 따라 판정됩니다.
