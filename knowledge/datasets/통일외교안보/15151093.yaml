description_portal: 방위사업청이 직접 계약하거나 조달청에 위탁하여 구매하는 중앙조달 군수품은 국방기술품질원의 품질보증대상에 해당한다. 국방기술품질원은 「방위사업법」 제32조 및 동법 시행령 제71조에 따라 해당 군수품에 대한 정부품질보증 활동을 수행하며, 그 결과로 검사조서를 발행한다. 군수품 품질보증 대상은 국방기술품질원이 수행하는 품질보증 업무 규모를 간접적으로 보여주는 주요 지표로 활용된다. 최근 5년간 품질보증 대상의 규모는 연평균 약 6.6조 원이며, 연평균 대상 품목수는 약 16,868종에 달한다. 2024년에는 총 16,406종(약 6.6조 원 규모)에 대해 품질보증활동을 수행하였다.품질보증형태는 중앙조달 계약품목의 특성에 따라 분류되며, 이 분류는 정부품질보증의 범위와 심도, 그리고 계약업체의 품질경영체계 기준을 정하는 데 활용된다. 전체 품질보증 품목 중에서 정부가 직접 품질보증활동을 수행하는 표준품질보증형(Ⅲ형)이 전체의 80% 이상으로 가장 큰 비중을 차지하고 있으며, 그 외에 업체가 자체적으로 품질을 보증하는 선택품질보증형(Ⅱ형)과 단순품질보증형(Ⅰ형)이 뒤를 잇고 있다.최근에는 업체의 품질경영체계가 점차 강화됨에 따라 표준품질보증형 품목의 비중은 소폭 감소하고, 선택품질보증형 품목은 점진적으로 증가하는 추세이다. 다만, 매년 계약되는 품목의 특성에 따라일부 변동은 있을 수 있다.
