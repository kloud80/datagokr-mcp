summary_user: 한국국제교류재단이 운영한 한미미래비전네트워크 사업을 사업연도·사업국가·수행기관명·사업명 단위로 한 줄씩 담은 사업 목록 파일(CSV, 약 24KB)이다. 한미 관계 연구자나 정책 분석가가 '어느 해에 미국의 어떤 기관이 어떤 한미 현안 연구·교류 과제를 맡았는가'를 확인하고 연도별 추이와 수행기관 분포를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 국가명·기관명 같은 이름 매칭으로만 이어 쓸 수 있다.
