description_portal: 육군사관학교 졸업생의 연도별 인원수, 그리고 학위(이학사, 문학사, 공학사, 위탁생도) 통계 데이터입니다. 2002년 졸업한 58기 이후의 데이터를 모두 포함하여 학위 종류별로 상세히 설명하고 있습니다. 지, 인, 용의 교훈 아래 군사 훈련과 학위 교육을 병행하여 학습한 육군사관학교 생도들이 군사학사와 더불어 취득한 학위(이학사, 문학사, 공학사)의 비율을 분석하여 군 교육의 성향을 파악하고, 앞으로의 방향성을 잡는 데에 기초 자료로써 활용하는 것이 가능합니다.* 연 단위로 데이터 업데이트 예정입니다.
