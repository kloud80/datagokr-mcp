summary_user: KOICA 해외봉사단원이 파견되어 활동하는 현지 기관을 파견국 국가명과 기관명(국문·영문) 단위로 정리한 목록 파일이다(CSV, 약 272KB). 해외봉사 지원을 준비하는 사람이 '특정 국가에서 봉사단원이 어떤 기관에 파견되는가'를 확인하거나, 분석가가 국가별 파견 파트너 기관 분포를 살피는 데 쓴다. 전역 조인 키나 국가 코드가 없어 다른 KOICA 사업·국가 데이터와는 국가명이나 기관명을 이름으로 맞춰 연결해야 한다.
