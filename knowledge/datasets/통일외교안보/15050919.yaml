summary_user: 방위사업청이 국내에서 추진하는 군수품 조달계획을 건별로 담은 파일 데이터로, 집행예정월·대표품명·집행유형·계약방법·예산금액 등을 싣고 전국 35,859행(2024-12-01~2025-12-01)을 포함한다. 방산·군납 업체가 어떤 품목이 언제 어떤 계약방법으로 발주될지 미리 파악해 참여 전략을 세우는 질문에 쓴다. 전역 조인 키는 없어 같은 기관 코드나 이름·코드 매핑으로만 연결하며, 국방전자조달의 입찰공고·입찰결과·계약정보와 사업자번호 축으로 이어 쓰는 것이 취지이나 이 파일 필드에는 사업자번호가 없다.
description_portal: 방위사업청이 국내에서 추진하는 군수품 조달계획을 연도별로 제공합니다. 제공 항목에는 집행예정월, 판단번호, 대표품명, 집행유형, 계약방법이 포함되며 일부 연락처 정보는 타 시스템과의 연계 과정에서 공란이거나 형식이 상이할 수 있습니다. 업체는 자료를 통해 발주 일정을 사전에 파악하고 준비도를 높일 수 있으며 조달 방식에 따라 참여 전략을 세밀하게 조정할 수 있습니다. 기관은 계획 공개를 통해 조달 운영의 예측 가능성과 효율성을 강화하고 집행 과정에서 발생할 수 있는 불확실성을 줄여 안정적인 관리 체계를 마련할 수 있습니다.
