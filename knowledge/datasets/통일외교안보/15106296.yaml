description_portal: 국방부 해군 장병 맞춤 피복 측신 정보를 담은 데이터입니다. 해군 장병들의 군수물자 중 피복(군복, 생활복, 전투복 등)의 원활한 배급을 위해 장병들의 체형 측정 정보를 제공하고 있습니다. 입대 년도와 기수, 가슴둘레, 허리 둘레, 엉덩이 둘레, 총장 등의 세부 항목으로 구성하여 장병들의 체형 분석이 가능하도록 상세히 설명하고 있습니다. 해당 데이터를 통해 해군 장병들이 체형에 맞는 피복을 순조롭게 보급 받는 데에 도움을 줄 수 있으며, 체형을 통한 건강 진단을 하는 데에 기초 자료로써 활용하는 것이 가능합니다.
