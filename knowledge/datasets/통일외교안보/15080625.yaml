description_portal: 한국국제협력단(KOICA)이 개발도상국에 파견한 인력의 안전을 확보하기 위해 수집한 국가별 사건사고 정보를 월 단위로 정리한 "파견국 안전이슈 월력표"를 제공합니다. 각 국가별 사건발생일, 사건종료일, 사건내용 정보 등이 포함되어 있으며, 이를 통해 특정 국가의 정치적 불안, 사회적 갈등뿐 아니라 기념일 등 다양한 위험 요소를 파악할 수 있습니다. 이 정보는 KOICA의 현장 사업 운영과 파견 인력의 안전 관리에 활용되며, 개발협력 사업의 위험 분석 및 대응 전략 수립에도 중요한 자료로 사용됩니다.
