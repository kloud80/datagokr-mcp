summary_user: 인천보훈병원 한 곳의 비급여 진료 항목을 대분류·중분류·소분류로 나누고, 항목별 명칭·코드·비용(최저·최고비용, 특이사항 포함)을 한 행씩 담은 목록이며, 약 47KB 크기의 CSV 파일 하나로 제공된다. 환자와 보호자가 인천보훈병원에서 특정 비급여 검사나 처치를 받기 전에 "이 항목은 얼마인가"를 미리 확인하거나, 분석가가 보훈병원의 비급여 가격 수준을 살펴보는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 보훈병원 비급여 파일이나 의료기관 정보와는 항목 명칭·코드를 직접 맞춰 보거나 같은 기관(한국보훈복지의료공단) 단위로만 이어 쓴다.
description_portal: 한국보훈복지의료공단 인천보훈병원에서 개방하는 비급여 수가 정보 데이터는 병원에서 환자에게 제공되는 비급여 의료서비스의 항목별 세부 정보를 담고 있는 자료입니다. 이 데이터에는 의료서비스를 분류한 대분류, 중분류, 소분류 항목이 포함되어 있으며, 각각의 비급여 항목에 대한 명칭과 고유 코드, 적용 비용이 명시되어 있습니다. 이 정보는 환자와 보호자가 치료 전 의료비를 예측하고, 항목별 비용의 투명성을 확인하는 데 중요한 역할을 하며, 병원의 비급여 진료비 운영에 대한 객관적이고 표준화된 데이터를 제공합니다.
