description_portal: '인천천보훈병원에서 제공하는 통합EMR 시스템 보훈병원 입원환자식단 정보로 데이터를 제공합니다.입원환자식단은 급식일자, 식사분류, 아침, 점심, 저녁, 간식 등으로 구성되어 있습니다. 환자의 건강상태에 맞게 일자별로 일방상식, 혈투연식, 위절제상식, 저지방식, 고단백연식, 저염상식 등 영양사가 환자식단을 만들고 있습니다.데이터 구성* 급식일자 : 일자별로 식단 구성* 식사분류 : 환자에 건강상태에 따른 식사 분류* 아침,점심,저녁 : 아침 점심 저녁 구분해서 쌀밥, 조미김, 근대나물, 김치볶음, 양배추쌈 등 식단 구성'
