summary_user: KOICA가 추진 중인 국별협력사업(프로젝트형·개발컨설팅 등 다년도 사업)을 사업 한 건당 한 행으로 담은 파일로, 국문·영문 사업명, 시작·종료연도, 원화·미화 예산총액, 대상 국가·지역, 수행기관, 담당부서, 사업단계를 담는다. 연구자나 정책 담당자가 "KOICA가 특정 협력대상국에서 지금 어떤 사업을 얼마 규모로 진행하고 있는가"를 확인하거나 국가·지역별 ODA 사업 분포를 분석하는 데 쓴다. 시행계획번호와 사업번호가 조인 키로 확인되어 같은 번호를 쓰는 다른 KOICA 사업·조달 데이터와 이어 쓰고, 국가명은 국가 표준코드 데이터와 이름으로 맞춰 쓴다.
description_portal: 한국국제협력단(KOICA)이 추진하는 국별협력사업의 진행 현황을 제공합니다. 동 데이터는 협력대상국의 경제·사회 발전 및 복지 향상을 목표로 하는 프로젝트형 사업과 개발컨설팅 사업 등 다년도에 걸쳐 진행되는 사업들의 정보를 포함하고 있습니다. 주요 항목으로는 사업명(국문 및 영문), 시작 및 종료 연도, 예산 총액(원화 및 미화), 대상 국가 및 지역, 수행기관, 담당 부서, 사업 단계 등이 있습니다. 이를 통해 KOICA에서 협력대상국별로 어떤 사업을 추진하고 있는지 확인할 수 있고, 세부 정보를 파악하여 국제개발협력 분야의 정책 수립, 평가, 연구 등에 광범위하게 활용할 수 있습니다.
