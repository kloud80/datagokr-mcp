description_portal: 통일부에서 제공하는 ‘통일부_개성공단 근로자 현황(년도별)’ 데이터는 남북 경제협력의 상징적인 공간인 개성공업지구(개성공단)에서 근무한 북측 및 남측 근로자의 연도별 인력 현황을 집계한 공공데이터입니다. 이 데이터는 2005년 개성공단 가동 이후부터 2015년까지 연도별로 북측 근로자 수, 남측 근로자 수, 그리고 양측을 합한 총 근로자 수(합계) 정보를 포함하고 있습니다. 총 11건의 연도별 데이터로 구성되어 있으며, 각 연도별 인력 규모와 변화 추이를 한눈에 파악할 수 있습니다.북측 근로자 수는 북측 개성공단에 근무한 근로자 수를 의미하며, 남측 근로자 수는 남측에서 개성공단에 파견된 인원을 의미합니다. 합계(명)는 각 연도의 북측과 남측 근로자 수를 합산한 것으로, 개성공단의 전체 인력 규모와 연도별 증감 현황을 명확히 보여줍니다.이 데이터는 남북 경제협력과 교류의 실질적인 성과를 확인하는 데 중요한 근거 자료로 활용될 수 있습니다. 특히 남북관계 변화에 따른 인력 변동, 경제적 상호의존성, 교류 협력의 전망 분석에 유용하게 사용할 수 있습니다.
