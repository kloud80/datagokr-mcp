description_portal: 병무청과 유관기관간 연계되는 시스템 목록 정보 입니다.병무청은 지난해 말 기준 28개 부처·공공기관과 정보공유를 통해 디지털플랫폼정부 구현에 앞장서고 있습니다.아래는 해당 관련 기사 입니다.※ 병무청 유관기관 연계 관련 기사 참고 https://www.asiatoday.co.kr/kn/view.php?key=20240208010004362병무청이 지난해 말 기준 28개 부처·공공기관과 정보공유를 통해 '디지털플랫폼정부' 구현에 앞장서고 있다.8일 병무청에 따르면 국민이 병역이행 서비스를 좀더 편리하게 이용할 수 있도록 돕기 위해 82종의 자료를 정부부처 및 공공기관 등과 연계해 공동 활용 중이다.병무청은 병역판정검사 시 검사의 정확성 제고를 위해 학교생활기록부나 건강기록부 자료가 필요한 경우가 있다. 모집병 면접시에도 학교생활기록부가 참조된다. 이에 병무청은 병무행정시스템과 교육부의 교육행정정보시스템(NEIS)을 연계해 병역의무자들의 서류제출 부담을 줄였다. 그동안 병무청은 교육부와 시스템이 연계되기 전에는 병역의무자들이 사본 발급을 위해 학교에 직접 방문하거나 병무청에서 해당학교에 공문으로 요청해 받아야 하는 불편이 있었다. 병무청은 이번 정보공유로 연간 18억6000만원의 비용이 절감되는 효과가 있는 것으로 나타났다.병무청은 또 보건복지부의 진료정보교류시스템을 연계해 진료기록 등을 병역처분 참조자료로 활용하고 있다. 병역판정검사 과정에서 정확한 처분에 필요한 경우 본인이 다니던 병원을 방문해 진료기록 등의 서류와 CT, MRI 등 의료영상자료 등을 발급받아 제출해야 하는 불편이 있었다.이번 정보 연계를 통해 대상자가 병원에 정보제공 동의 후 자료전송을 요청하면 자동으로 병원의 진료정보가 병무청으로 전송된다.
