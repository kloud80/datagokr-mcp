summary_user: KF 공공외교 사업과 KOICA ODA 사업을 사업 단위로 묶어 사업명(국문·영문), 대상 국가·대륙, 수혜기관, 사업 유형, 사업연도와 시작·종료일, 단년·다년 구분을 담은 건별 목록이다. 연구자나 기자가 특정 국가(한글 국가명 또는 ISO 국가코드)나 사업명으로 '이 나라에서 한국이 어떤 공공외교·개발협력 사업을 언제 했는가'를 찾을 때 쓴다. 전역 조인 키는 없어 ISO 2자리 국가코드(country_iso_alp2)나 국가명으로 다른 국가별 외교·ODA 데이터와 이름·코드 매핑해 잇는다.
description_portal: 한국국제교류재단은 공공외교와 개발협력의 시너지를 극대화하고, 글로벌 현안 대응 역량 강화를 위해 ‘한국국제교류재단_융합_KF-공공외교 사업 정보_KOICA-ODA 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 한글 국가명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용), 한글 사업명으로 KOICA-ODA 사업정보 KF-공공외교 사업 정보 목록 조회 할 수 있습니다. 해당 데이터는 개발도상국 협력사업 분석, 국제교류 정책 연구, 외교전략 수립, 글로벌 네트워크 지도 작성, 수혜기관 현황 파악, 언론 보도, 사업성과 평가, 학술연구, 데이터 기반 시각화, 후속 협력사업 기획 등 다양한 분야에서 활용할 수 있습니다.
