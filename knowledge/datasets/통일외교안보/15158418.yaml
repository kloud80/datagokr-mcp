summary_user: 방위사업청 국방전자조달시스템(D2B)의 국내·국외 물품과 시설공사 조달계획을 건별로 담으며, 발주예정월·대표품목명·판단번호·계약방법·입찰방법·발주기관·예산금액·진행상태 등을 전국 범위로 제공한다. 방산·군납 업체가 "앞으로 몇 달 안에 어느 군 기관이 어떤 품목을 얼마 예산으로 발주할 예정인가"를 확인해 입찰 참여를 준비하는 데 쓴다. 전역 조인 키는 없고 발주기관코드(orntCode)·판단번호·공사번호로 같은 방위사업청 입찰공고·계약정보와 이어 쓰며, 나라장터와는 별도 체계라 공공조달 데이터와는 이름 매핑으로만 연결한다.
description_portal: 방위사업청 국방전자조달시스템(D2B)에서 제공하는 군수품조달 조달계획 정보 데이터입니다. 본 데이터는 국내·국외 물품 조달계획과 시설 조달계획을 포함하며, 조달 추진을 위한 발주 예정 정보를 기간 조건으로 조회할 수 있습니다. 주요 항목으로는 발주예정월(시작/종료), 대표품목명, 판단번호, 집행유형, 계약방법, 입찰방법, 발주기관(기관명/기관코드), 예산금액, 요구년도, 특정조달여부, 진행상태(코드 포함) 등이 포함됩니다. 또한 국외 조달계획 판단내역 조회 및 상세조회 기능을 통해 조달계획의 판단 정보까지 확인할 수 있어, 조달 수요 분석 및 조달 일정 관리, 업체 참여 준비 등 실무에 활용 가능합니다.
