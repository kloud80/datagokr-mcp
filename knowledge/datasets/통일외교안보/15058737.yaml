summary_user: 외교부가 게시한 국제기구초급전문가(JPO) 선발 모집 공고를 공고 한 건 단위로 담으며, 제목·본문·등록일·일련번호와 첨부 링크(제목·URL)를 포함한다. 국제기구 진출을 준비하는 청년이나 취업 지원 기관이 '올해 JPO 모집 공고가 언제 올라왔고 어떤 내용인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 제목·기구 이름 매칭으로만 잇고, 같은 외교부의 유엔 공석·UNV·인턴십 공석정보와 나란히 보는 용도에 맞다.
limits: 공고는 게시 시점에 생성된 뒤 바뀌지 않는 이벤트성 자료라 상시 갱신을 기대하기 어렵고, 최근 공고가 드물게 보여도 데이터가 끊겼다고 단정할 수 없다. 공통 코드나 조인 키가 없어 기구·직무별 통계 결합은 이름 매칭에 의존해야 한다.
