description_portal: 한국국제협력단(KOICA)이 민관협력 파트너와 함께 수행한 ODA 사업에 대한 결과보고서를 목록화한 수시성 자료입니다. 민관협력사업은 개발도상국의 빈곤 감소와 복지 증진을 목표로, 정부-시민사회-기업-대학 등 다양한 민간 파트너와 협력하여 국제개발협력 사업을 수행하는 프로그램입니다. 해당 자료는 2009년부터 2019년까지의 연도별 사업유형, 파트너명, 사업분야, 국가명, 문서종류, 포맷형태 등의 항목을 제공합니다. 이를 통해 연도별로 어떤 파트너가 어디에서 어떤 분야의 사업을 했는지 한눈에 파악할 수 있습니다.
