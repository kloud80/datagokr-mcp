summary_user: 중앙보훈병원 한 곳의 비급여 진료 항목별 가격을 담은 파일로, 항목마다 대·중·소분류, 명칭, 코드, 비용과 최저·최고비용, 치료재료대·약제비 포함 여부, 특이사항, 최종변경일을 한 행씩 기록한다. 환자나 보훈대상자가 중앙보훈병원에서 특정 비급여 검사나 처치를 받을 때 본인이 내는 비용이 얼마인지 미리 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 보훈병원 비급여 파일이나 의료기관 정보와는 항목 명칭·코드를 맞추는 방식으로만 이어 쓴다.
description_portal: '중앙보훈병원 비급여정보에 대한 데이터로, 분류,명칭,  코드, 구분, 비용, 최저비용, 최고비용, 치료재료대 포함여부, 약제비 포함여부, 특이사항으로 구분하여 제공합니다.보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
