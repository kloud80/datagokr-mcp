description_portal: 본 공공데이터는 인천광역시 서구 내 사회복무요원의 근무지 배치 현황을 정리한 자료입니다. 본 자료는 근무지의 명칭, 주소, 연락처, 복무인원, 기준일자 등의 정보를 제공하는 데이터입니다. 본 데이터를 통해 각 행정복지센터와 아동센터, 기타 공공기관에 근무중인 복무요원의 분포 현황을 확인하는데 파악할수 있습니다. 본 데이터는 지역별 배치 규모를 파악하고 사회복무요원 인력 운영의 효율성을 높이기 위한 기초자료로 활용될 수 있을것으로 판단됩니다. 본 데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
