summary_user: 국가·지역별 여행경보 정보를 국가 단위로 담은 API로, 검증 시 전체 210건이 수신됐고 경보 단계(alarm_lvl), 대륙, 국기·지도 내려받기 주소, 작성일 등을 포함한다. 해외여행객이나 출국 준비 중인 국민이 방문하려는 나라에 어떤 경보가 내려져 있는지 확인하는 질문에 쓴다. 국가 ISO 알파2 코드(country_iso_alp2)나 국가명으로 재외공관·여권 등 외교부의 다른 국가 표준코드 데이터와 이름·코드 매핑해 잇지만, 실측상 전역 조인 키는 확인되지 않았다.
