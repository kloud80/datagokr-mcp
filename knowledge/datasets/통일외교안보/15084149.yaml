description_portal: 한국국제협력단(KOICA)이 추진하는 혁신적 기술 프로그램(CTS/Creative Technology Solution)은 예비창업가, 스타트업, 소셜벤처 혁신가들의 혁신적 아이디어 또는 기술을 ODA에 적용하여 기존방법으로 해결이 어려웠던 개발협력 난제에 대한 솔루션을 찾는데 기여하고 개발협력사업의 효과성을 제고하는 사업입니다. CTS 사업은 SEED0(예비창업가 육성지원), SEED1(기술개발사업), SEED2(시범사업)의 3가지 단계로 구성되어 있습니다. 해당 데이터는 CTS 사업에 대한 사업명, 단체명, 구분, 시작연도, 종료연도, 국가, 분야 정보를 제공합니다. 이를 통해 KOICA 민관협력 및 CTS 사업에 대한 현황을 분석하고, 그에 기반한 연구, 평가, 전략적 의사 결정 등에 활용할 수 있습니다.
