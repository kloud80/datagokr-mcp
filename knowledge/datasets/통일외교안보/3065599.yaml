summary_user: 병역지정업체(전문연구요원·산업기능요원)의 채용공고를 공고 한 건 단위로 담는 전국 범위 원천 데이터로, 업체명·업종·근무지·요원 구분·역종·학력·경력 조건·마감일 등을 포함한다. 산업기능요원이나 전문연구요원으로 편입·전직하려는 사람이 '내 지역에서 보충역을 뽑는 IT 업종 지정업체 공고가 지금 있는가'를 찾을 때 쓰고, 분석가는 지역·업종별 병역특례 채용 수요를 볼 때 쓴다. 전역 조인 키는 없어 다른 병역지정업체 데이터와는 업체명이나 사업자등록번호(saeopjaDrno)·주소 같은 이름·코드 매핑으로 이어 쓴다.
description_portal: 병역지정업체에 편입 및 전직을 하고자 하는 사람은 병역일터 채용공고란에서 복무형태, 기업규모, 업종, 업체명, 소재지, 역종, 전직자 채용여부 등을 확인하여 지원할 수 있습니다. 현역병입영대상자는 학력별 기술자격 등급기준에 해당하는 사람이 해당되고, 사회복무요원 소집대상 보충역, 사회복무요원 복무중단자, 현역병 복무중 보충역 편입자는기술자격 불요합니다.(단, 정보처리 직무분야 근무자는 관련학과 전공, 기술훈련과정 수료, 해당분야 근무경력 2년 이상 필요(단, 보충역은 국가기술자격(정보처리, 전자계산기조직응용, 빅데이터분석) 및 일학습병행자격(정보기술 분류 종목) 소지자인 경우 1년 이상 편입 가능)
