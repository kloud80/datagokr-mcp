summary_user: KOICA 해외봉사단이 파견된 수원기관(봉사단 수요기관)을 건별로 담은 목록으로, 국가명·ISO 2자리 국가코드·파견기관코드·파견기관명을 제공하며 전체 999건이다. 해외봉사단이 어느 나라의 어떤 기관에서 활동하는지, 현장 파트너 기관이 어디인지 확인하려는 분석가나 사업 담당자가 쓴다. 전역에 통용되는 조인 키는 없고, 국가는 ISO 2자리코드나 국가명 매핑으로, 기관은 같은 파견기관코드를 쓰는 데이터와만 이어 쓴다.
description_portal: KOICA의 해외봉사단이 파견된 수원기관의 정보를 제공하는 API입니다. 각 파견국 내 봉사단 수요기관의 명칭, 위치, 분야 등 정보가 포함되어 있으며, 봉사단 활동이 수행되는 현장의 파트너십 관계를 이해하는 데 유용합니다. 해당 API는 인증키(serviceKey), 페이지 번호(pageNo), 한 페이지 결과 수(numOfRows) 등 기본적인 요청변수를 사용하며 한글 국가명, 데이터표출방식, ISO 2자리코드 등의 필터 파라미터를 추가로 설정할 수 있습니다. 출력결과에는 국가명, ISO 2자리코드, 파견기관코드, 파견기관명 등의 항목이 포함되며, 각 항목에 대한 데이터는 JSON 형식으로 반환됩니다.
