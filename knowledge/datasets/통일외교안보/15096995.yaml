description_portal: 한국국제협력단(KOICA)이 추진하는 시민사회협력프로그램의 신규사업 목록을 제공합니다. 시민사회협력사업은 정부, 시민단체, 기업, 대학 등 다양한 이해관계자들이 포괄적인 파트너십을 구축하여, 민간의 인적자원, 지적 자산, 기술, 사업역량, 재원을 활용함으로써 협력대상국의 지속가능한 발전과 빈곤완화에 기여하는 국민참여형 국제개발협력 사업입니다. 제공되는 데이터는 사업명(국문 및 영문), 시작 및 종료 연도, 예산 총액(원화 및 미화), 대상 국가 및 지역, 수행기관, 담당 부서, 사업 단계 등이 포함되어 있으며, 동 데이터를 통해 시민사회와의 협력 현황을 파악하고, 민관협력 기반의 개발협력 전략 수립에 활용할 수 있습니다.
