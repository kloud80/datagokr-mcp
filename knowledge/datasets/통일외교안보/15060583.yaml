description_portal: 통일부에서 제공하는 통일부_남북교역_품목별_통계 데이터는 남북 간 교역 현황을 품목별로 심층적으로 분석한 공공 통계 자료입니다. 이 데이터는 남북 간 경제교류의 주요 흐름과 변화를 세밀하게 파악할 수 있도록 1989년부터 현재까지의 기간 동안 수집된 정보를 기반으로 구성되어 있습니다.본 데이터는 세부 항목은 기간(년/월), 품목코드, 품목명, 반입 및 반출 금액(1달러,천달러,백만달러 단위), 반입 및 반출 중량(kg,톤 단위), 각 항목별 증가율(퍼센트) 그리고 HScode(2,4,6,10자리), MTI(1,2,3,4,6단위) 항목을 포함하고 있습니다. 반입·반출 금액 및 중량, 그리고 그에 따른 증가율 데이터는 남북 교역의 규모 변화와 성장세를 수치로 확인할 수 있도록 지원합니다.이 통계는 남북 간 교류협력의 실제적 현황을 객관적으로 파악할 수 있는 중요한 기초자료로, 통일경제 정책 수립, 남북 교역 동향 분석, 향후 남북 경제협력 기반 마련 등 다양한 정책적·학술적 목적에 활용될 수 있습니다. 또한, 남북 교역의 품목별 특성과 변화 추이를 연도별로 비교·분석할 수 있어, 남북관계 변화에 따른 교역 구조의 진화와 주요 품목의 변화도 함께 살펴볼 수 있습니다.
