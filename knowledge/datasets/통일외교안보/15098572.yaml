summary_user: 서울특별시와 관할 시군구에 주소를 둔 등록 보훈대상자 본인과 선순위 유족 인원을 연도·분기, 대상 구분(상·하위)별로 집계한 파일이며, 검증에서 23,452행을 받았다. 분석가나 지자체 담당자가 특정 자치구의 국가유공자·보훈보상대상자 등 대상별 인원과 분기별 변화를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 지역 통계와는 시도·시군구 이름을 행정구역 코드에 매핑해 이어 쓴다.
description_portal: 개별 법률에 따라 국가보훈부에 등록하신 보훈대상자 본인과 선순위자인 유족 1명 중 서울특별시 및 관할 시군구로 주소가 되어 있는 분들의 현황입니다.시군구명이 "서울특별시"인 정보는 서울특별시 합계 인원입니다.<참고>ㅇ 주의사항- 고엽제후유증(환자) 인원은 국가유공자법상 "전몰·전상·순직·공상군경"에 포함됩니다.- 유족이 모두 사망하였거나 국적을 상실한 분, 상이등급을 받지 못한 분, 선순위자가 아닌 유(가)족 등은 포함되어 있지 않습니다.- 대상별 중복 인원이 있어 인원 합산 시 실제 인원보다 많습니다.ㅇ 데이터 변동 안내 - 24년 3분기부터 기존 대상구분 일부를 상위 분류로 분리하여 제공합니다. - 25년 2분기부터 기준연월을 연도와 분기로 분리하고 대상구분 명칭 일부를 수정하여 제공합니다(이전 정보와 연번은 동일).
