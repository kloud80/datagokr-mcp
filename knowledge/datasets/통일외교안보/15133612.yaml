summary_user: KOICA가 추진하는 개발협력사업을 인도적 지원·보건의료·교육·농업식수 등 유형별로 나눠, 사업별 사업명·사업내용·시작/종료일자·사업예산과 그 사업을 구성하는 활동(역량강화·시스템 구축·물품지원·연수 등)별 제목과 소요예산을 담은 사업 단위 원장 파일(CSV, 약 1.3MB)이다. ODA 분석가나 개발협력 사업 기획자가 '보건·의료 분야 유사 사업들은 예산을 어떤 활동에 얼마씩 배분했나'를 비교하는 데 쓴다. 전역 조인 키는 없어 다른 KOICA 사업정보·국가별 협력사업·조달 데이터와는 사업번호나 사업명 매칭으로만 이어 쓴다.
description_portal: 한국국제협력단(KOICA)이 추진하는 개발협력사업을 유형별로 분류하고 개요를 체계적으로 정리한 자료입니다. 사업 유형은 인도적 지원, 보건·의료, 교육, 농업·식수 등 다양한 분야로 나뉘어져 있으며, 각 유형별 사업에 대한 사업명, 사업내용, 사업기간, 사업예산 그리고 간략한 개요 정보를 제공합니다. 개요 정보를 통해서는 사업을 구성하고 있는 활동(역량강화, 시스템 구축, 물품지원, 연수 등) 내역을 확인할 수 있습니다. 이를 통해 유사 유형 사업 간 비교 분석을 쉽고 효율적으로 수행할 수 있으며, 새로운 사업을 기획하거나 이행하는 단계에서 인사이트를 얻는 참고자료로 활용할 수도 있습니다. 동 데이터는 연간 단위로 업데이트됩니다.
