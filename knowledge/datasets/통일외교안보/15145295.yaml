description_portal: 본 데이터는 2025년 7월말 기준 가습기살균제 피해자의 병역판정검사 질병별 현황입니다.질병명은 대상자별 병역판정검사 당시 "병역판정 신체검사 등 검사규칙" 기준의 질병명이며, 한 명이 여러 질병일 경우 중복 추출하였습니다.(데이터 제공 신청 요청에 따른 파일데이터 등록)* 병역법  제11조에 따라 병역의무자는 19세가 되는 해에 병역을 감당할 수 있는지를 판정받기 위하여 지방병무청장이 지정하는 일시(日時)ㆍ장소에서 병역판정검사를 받게 되며, 병역판정검사를 받아야 하는데 받지 아니한 사람과 병역판정검사가 연기(延期)된 후 그 연기사유가 소멸된 사람은 그 해 또는 그 다음 해에 병역판정검사를 받게 됩니다.
