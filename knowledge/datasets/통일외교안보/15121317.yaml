description_portal: 한국국제협력단(KOICA)이 추진하고 있는 국별협력사업과 OECD의 정책마커 간 연계현황을 체계적으로 정리한 자료입니다. OECD 정책마커란 OECD DAC의 정책 목표에 대한 이행성과를 측정하기 위하여 도입한 측정 방식으로, 마커부여기준으로 직접기여, 간접기여, 해당없음 등으로 분류됩니다. 이를 통해 공여국이 국제적인 개발목표와 자국의 개발협력 전략을 조화시키기 위해 어떤 노력을 하고 있는지 살펴볼 수 있습니다. 더불어 OECD DAC에 정책마커 보고를 의무적으로 제출해야하는바, 국제사회의 개발목표 이행에 대한 책임성을 강화하는 측면도 있습니다. 전세계 데이터 기준일자에 따라 2년의 통계 일정 소요로 등록일자 -2년에 해당하는 데이터 기준일자를 부여하였습니다.
