summary_user: 방위사업청이 추진한 군 식재료 입찰을 건별로 담은 파일로, 공고일자·발주처·입찰건명·요구년도·판단번호·금액을 한 행에 기록한다. 식재료 공급업체가 과거 어떤 발주처가 어떤 품목을 얼마 규모로 입찰에 부쳤는지 보고 다음 입찰 참여를 준비하거나, 정책 담당자가 군 급식 식재료 조달 비용 추이를 검토할 때 쓴다. 전역 조인 키가 없어 다른 방위사업청 조달 데이터(입찰결과·계약정보 등)와는 판단번호나 입찰건명 같은 이름·번호 매칭으로만 이어 쓰며, 나라장터와는 별도인 국방전자조달 체계의 자료다.
limits: 전국 단위 비공간 자료라 지역별 분석에는 맞지 않고, 표준 조인 키가 없어 업체(사업자번호)나 계약 결과와 직접 연결되지 않는다. 국방전자조달 자료이므로 나라장터 공공조달 데이터와 같은 체계로 취급하면 안 된다.
