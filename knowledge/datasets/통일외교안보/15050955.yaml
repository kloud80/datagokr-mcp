summary_user: 2017년 4월 기준 우리나라가 유엔평화유지활동에 파견한 부대·인원 현황을 부대 단위로 담은 소규모 CSV 파일(941바이트)로, 활동 종류, 파견 규모 단위, 부대명, 현재 인원, 파견 지역, 최초 파병일, 교대 주기를 담는다. 국민이나 연구자가 '우리나라는 어느 지역에 어떤 평화유지 부대를 몇 명 보내고 있었나'를 확인하는 데 쓴다. 실측 컬럼에 국가코드 같은 전역 조인 키가 없어, 다른 데이터와는 파견 지역 이름을 국가 표준코드에 수작업으로 맞추는 방식으로만 이어 쓴다.
description_portal: 2017년 4월 기준 우리나라의 유엔평화유지활동 참여현황 자료입니다. 부대명, 파견지역, 참전인원 등을 CSV파일로 제공합니다.제공되는 데이터의 구성항목은1. 구분  평화유지활동의 종류를 구분2. 단위  파견의 규모 단위3. 부대명  평화유지를위해 일정한 규모로 편성된 군대 조직의 명칭4. 현재인원  평화유지균의 인원 수5. 지역  평화유지균이 파병된 지역6. 최초파병  처음으로 평화유지균이 파병된 일자7. 교대주기  어떤 일을 여럿이 나누어서 차례에 따라 맡아하는 주기등의 정보가 제공됩니다.
