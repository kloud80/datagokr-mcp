description_portal: '국가보훈부에서 제공하는  재가복지서비스를 지원하고 있는 인력 현황 자료입니다.* 지원 인력:  보훈복지사, 보훈재가복지실무관, 이동보훈실무관※ 보훈재가복지서비스란?‘재가복지’란 각 가정에 방문하여 제공하는 복지 서비스를 뜻하는 말로, 요양시설 등에서 이루어지는 ‘시설복지’와 구분되는 개념입니다.국가보훈부에서 실시하는 ‘보훈재가복지서비스’는 생활이 어려운 독거·노인부부세대 중 거동이 불편한 사람을 대상으로 하는 찾아가는 복지서비스입니다.전문 인력인 ‘보훈재가복지실무관’가 각 가정으로 찾아가 가사활동, 건강관리, 편의지원 등을 제공합니다.'
