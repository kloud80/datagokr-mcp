description_portal: 국방기술품질원에서 인증한 국방품질경영체제(DQMS, Defense Quality Management System) 인증을 획득한 업체들의 정보를 포함합니다. DQMS는 국방 관련 품질관리 체계를 인증하기 위한 제도로, 방산업체 및 관련 업체의 품질 신뢰성을 평가하고 인증합니다.본 데이터는 인증업체의 명칭, 인증번호, 인증 유효기간, 전문센터 및 지역 정보를 포함하며, 국방 품질 인증 업체 현황 파악, 품질경영 기반 업체 검색, 방산협력업체 발굴 등 다양한 용도로 활용될 수 있습니다.
