summary_user: 재외공관이 주재국 인구통계·동포단체 조사·재외국민등록부 등을 근거로 추산한 재외동포 수를 국가 단위로 모아 2013·2015·2017·2019년 수치와 비중(%)·증감률을 담은 집계 파일입니다(CSV 약 601바이트). 재외동포 정책 담당자나 연구자가 '특정 국가·지역의 동포 인구가 최근 몇 년 사이 늘었나 줄었나'를 확인하는 데 씁니다. 전역 조인 키나 국가코드 컬럼이 없어 다른 데이터와는 국가명을 외교부 국가 표준코드(ISO 국가코드)에 이름으로 매핑해야 이어 쓸 수 있습니다.
description_portal: '[요약정보]본 자료는 해외에 주재하는 우리나라 재외공관(대사관, 총영사관, 분관 또는 출장소)에서 작성한 공관별 재외동포현황을 취합, 정리(2012.12월 기준)한 것으로서 주재국의 인구 관련 통계자료, 한인회 등 동포단체 조사자료, 재외국민등록부 등 공관 민원 처리기록 직접조사 등을 근거로 산출한 추산치입니다.[상세정보] 1. 재외동포 현황 목록 조회: 한글 국가명 또는 ISO국가코드(다.참고 1 ISO국가코드 이용)를 이용하여 재외동포 현황 목록 조회- 재외동포 현황 관련 정보를 제공하는 공공데이터(출처 : 재외동포현황(2021년), 2020년 12월 기준)년도별 재외동포 인구를 제공합니다.제공되는 데이터 예시를 보면1. 일본 855725(2015년) 818626(2017년) 824977(2019년) 818865(2021년)2. 중국 2585993(2015년) 2548030(2017년) 2461386(2019년) 2350422(2021년)이외에도 191개국의 년도의 동포 인구를 제공합니다.'
