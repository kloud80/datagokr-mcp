description_portal: 국군 복지 휴양 시설(호텔, 콘도, 컨벤션 등)에 대한 데이터입니다. 시설 명, 위치 주소, 객실 수량, 규모(층수), 연락처, 휴양 시설에서 이용 가능한 부대 시설을 비롯하여 해당 데이터에 포함되지 않은 정보를 확인할 수 있는 홈페이지 주소를 상세하게 나타내고 있습니다. 해당 데이터를 통해 각 지역에 위치하여 있는 복지 휴양 시설을 보다 유용하게 이용할 수 있으며, 부대시설(연회, 스카이라운지, 식당, 카페, 바베큐장, 마트, 세미나실 등)을 포함하고 있어 각 시설별 이용의 효율성을 높이는 데에 기초 자료로써 활용할 수 있습니다.
