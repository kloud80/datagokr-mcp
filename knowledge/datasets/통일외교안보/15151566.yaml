description_portal: 개발협력포럼 영상 STT 데이터는 한국국제협력단(KOICA)가 주관하는 "개발협력포럼"의 발표·토론 과정을 담은 영상(비정형 데이터)을 정형화한 데이터로, 비정형 데이터 개방 및 비정형 데이터의 정형화에 대한 높은 민간 수요 기반, 데이터를 구축하여 개방합니다. 동 데이터는 연사 발언, 토론 세션, 질의응답 등 현장의 발화 내용으로 이루어져 있으며, 주요 항목으로 발화구분, 발화자명, 발화자 유형, 발화시간, 발화내용을 제공합니다. 동 데이터는 개발협력 분야의 정책 논의와 연구, 교육 자료로 활용되며, 현장 담론을 기록해 다양한 이해관계자의 의견을 공유하고 협력 방향을 모색하는 기반이 될 수 있습니다. 더불어 포럼의 영상자료는 대국민 홍보 컨텐츠로 활용되어 개발협력사업의 가시성을 높이고 국민 참여 확대를 지원 할 수 있습니다.
