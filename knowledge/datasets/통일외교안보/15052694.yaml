description_portal: 국방기술품질원이 전자도서관에서 구독 중인 학술지 현황을 정리한 자료입니다. 각 항목에는 ISSN, 학술지명, 출판사, 매체 정보가 포함되어 있으며, 국방과학기술 분야의 연구자와 실무자가 최신 학문 동향과 기술 정보를 접할 수 있도록 지원하고 있습니다. 국내 학술지는 월간지, 기술 전문 잡지, 과학 교양지 등으로 구성되어 있습니다. ‘스마트 PC 사랑’, ‘과학동아’ 같은 대중 과학지부터, 군 관련 전문지까지 포함되어 있어 연구자뿐만 아니라 일반 독자도 참고할 수 있는 자료가 함께 제공되고 있습니다.이 데이터는 국방기술품질원이 단순히 방산 기술에 국한되지 않고, 기계·전자·재료·컴퓨터 과학·신뢰성공학 등 다양한 분야의 학문적 자원을 확보하고 있다는 점을 보여줍니다. 즉, 전자도서관을 통해 연구자들이 세계적인 학술지와 국내 기술 동향을 동시에 접할 수 있으며, 이를 통해 국방 연구개발에 필요한 최신 지식과 학문적 기반을 지속적으로 강화하고 있습니다.
