description_portal: '통일부에서 제공하는 ‘이산가족 초청 위로 행사 정보’ 데이터는 남북 분단으로 인해 가족과 생이별한 이산가족의 아픔을 위로하고, 사회적 관심과 지원을 확대하기 위해 개최된 각종 초청 행사의 이력을 체계적으로 정리한 공공데이터입니다. 이 데이터는 이산가족 문제에 대한 국가적 관심과 실질적 지원의 현황을 한눈에 파악할 수 있도록 행사별 주요 정보를 기록하고 있습니다.데이터는 총 23건으로, 행사시작일, 행사종료일, 행사명 항목으로 구성되어 있습니다. 행사명에는 개최 시기(연도, 월), 행사의 성격(예: 위로, 초청, 만남 등), 그리고 개최 지역이 명시되어 있어, 연도별·지역별로 이산가족 관련 행사의 변화와 분포를 쉽게 확인할 수 있습니다. 이를 통해 남북 이산가족 문제에 대한 시간에 따른 정책적 변화를 분석할 수 있습니다.'
