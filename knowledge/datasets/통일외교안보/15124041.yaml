description_portal: 한국국제교류재단은 국제교류기금의 조성 및 운용의 투명성을 높이고, 국민의 알 권리 실현을 위해 ‘한국국제교류재단_국제교류기금 월별 수입내역’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 한국국제교류재단법 제13조에 근거해 설치된 국제교류기금의 월별 수입 현황을 회계연도, 회계월, 수입항목, 금액 등 세부 항목별로 제공합니다. 연 1회 정기적으로 갱신되며, 자료는 CSV, XML, JSON 등 다양한 포맷으로 제공되어 누구나 무료로 활용할 수 있습니다. 이 데이터는 기금 수입 구조 분석, 재정 투명성 검증, 정책 연구, 언론 보도, 회계자료 작성, 국제교류사업 기획, 시민단체 감시, 학술연구, 데이터 기반 시각화, 내부관리 등 여러 분야에서 활용 가능합니다
