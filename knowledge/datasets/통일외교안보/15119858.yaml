summary_user: 전력운영사업의 신규 조달요구품목과 조달제한품목에 대해 발주부서가 업체로부터 받은 사전 입찰의향서 목록을 조달요구 품목 단위로 담으며, 품명·재고번호·규격번호·요구수량·요구단가·요구금액·의향서 접수 시작·종료일자·최초 및 현재 조달원 등이 포함된 전국 범위 CSV 파일(약 5MB)이다. 방산·군수 납품 업체가 '어떤 군 부대가 어떤 품목을 얼마의 수량과 단가로 조달하려 하는지, 의향서 마감은 언제인지'를 확인해 입찰 참여를 준비하거나, 분석가가 조달제한품목의 조달원 변화를 살피는 데 쓴다. 전역 조인 키는 없어 국방전자조달의 입찰공고·계약정보 등과는 조달요구번호나 재고번호·품명을 이름 매칭하는 방식으로만 이어 쓰며, 나라장터와는 별개 시스템이다.
description_portal: 전력운영사업의 신규 조달요구품목과 조달제한품목에 대해 발주 부서가 업체로부터 사전 입찰의향서를 제출받은 목록 정보를 제공합니다. 업체는 사전의향서를 통해 입찰 참여 의지를 명확히 전달할 수 있으며 발주기관은 이를 기반으로 수요와 공급 가능성을 사전에 파악해 보다 체계적이고 안정적인 조달 계획을 수립할 수 있습니다. 축적된 자료는 시장 상황과 업체 역량을 분석하는 중요한 참고 지표로 활용되며 향후 조달 절차의 예측 가능성과 효율성을 높이고 제도 개선 방향을 검토하는 근거로도 기여합니다.
