description_portal: '2018년도 병역판정검사 결과에 따른 국방부령 조항별 신체등급 4급, 5급, 6급 판정 현황입니다. (2018.12.31.기준, 단위: 명)* 병역판정 신체검사 등 검사규칙의 신체등급 판정기준에 따라 판정합니다.* 병역의무자는 19세가 되는 해에 병역을 감당할 수 있는지를 판정받기 위하여 지방병무청장이 지정하는 일시(日時)ㆍ장소에서 병역판정검사를 받아야 하며 병역판정검사를 받아야 하는데 받지 아니한 사람과 병역판정검사가 연기(延期)된 후 그 연기사유가 소멸된 사람은 그 해 또는 그 다음 해에 병역판정검사를 받아야 합니다.'
