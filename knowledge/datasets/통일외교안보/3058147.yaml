description_portal: 국방과학기술 용어정보입니다. 국방 분야에서 사용되는 주요 무기체계, 장비, 기술 용어를 체계적으로 정리한 자료로, 각 항목에는 용어명, 약어, 영어 표기, 출처, 그리고 상세 설명이 포함되어 있습니다.예를 들어 ‘37’국가재고번호품목은 군수품 관리에서 사용되는 국가 재고 번호와 관련된 개념을 설명하고 있습니다. 5세대 공중 표적기는 스텔스 성능을 반영하여 개발된 무인 표적기이고, 6세대 전투기는 기존 세대 전투기보다 더 높은 스텔스 성능과 인공지능 기술을 결합한 미래형 항공 전투체계를 의미합니다. Abrams X는 미국의 최신형 전차 시제 모델로 자동 장전 장치를 탑재한 무인화 지향 플랫폼이며, AGM-114 헬파이어는 잘 알려진 공대지 미사일입니다.또한 ALQ-249 차세대 재머는 전자전 수행을 위한 첨단 재밍 장비이고, AS-21 레드백은 호주와 협력해 개발된 차세대 장갑차입니다. B-21 레이더는 차세대 전략 폭격기로 스텔스 성능을 극대화한 장비이며, BTR-4는 우크라이나에서 개발한 장륜형 장갑차입니다. 마지막으로 Bukovel-AD는 드론 방어 체계로, 최근 전장에서 활용도가 급격히 높아지고 있는 장비입니다.이 데이터는 단순히 용어 사전을 정리한 것이 아니라, 현재와 미래의 국방 기술 트렌드를 반영하는 지식 자원입니다. 무기체계와 기술의 발전 흐름을 이해하고, 각 장비와 기술이 어떤 배경과 목적을 가지고 개발되었는지 파악하는 데 중요한 자료가 됩니다.
