description_portal: 5.18민주화운동의 정신을 이어받아 민주화운동에 헌신하신 호남민족민주열사희생자의 현황을 알려드립니다.직접적인 민주화투쟁과정에서 돌아가신 분, 돌아가신 것을 계기로 사회적 모순을 해결하는 운동적 흐름을 만들게 된 계기가 된 분, 민족민주운동에 참여하여 돌아가실 때까지 헌신하신 분 등을 5.18정신계승 호남민족민주열사희생자라 부릅니다.민주화 운동 중에 희생된 민주화 희생자들의 삶을 기억하고 그 정신을 계승하기 위해서 추모 공연, 추모식, 분향 등 을 통해 추진하고 있습니다. 민주주의와 정의를 위해 헌신한 수많은 희생자들의 삶과 정신을 기리고 있습니다. 이는 광주전남추모연대를  중심으로 합동추모제와 망월동 안내단, 망월동 성역화 사업 등을 하고 있으며 최근은 추모기행처럼 그분들의 일대를 기리고 있습니다.
