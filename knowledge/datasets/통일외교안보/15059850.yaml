description_portal: 한국국제교류재단 내 한중앙아협력포럼사무국에서 중앙아 국가와 협력 증진을 위해 수행한 사업 실적에 관한 정보를 제공합니다.한국국제교류재단은 한국과 중앙아시아 5개국(카자흐스탄, 우즈베키스탄, 키르기즈스탄, 타지키스탄, 투르크메니스탄) 간의 실질적 협력 확대와 상호 이해 증진을 위해 ‘한국국제교류재단_한중앙아협력 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 한중앙아협력포럼사무국이 수행한 다양한 협력사업의 연도, 사업명, 시작·종료일, 사업유형 등 주요 정보를 포함하며, 연 1회 갱신되어 최신 실적을 반영합니다. 자료는 CSV, XML, JSON 등 다양한 포맷으로 제공되어 누구나 자유롭게 활용할 수 있습니다. 해당 데이터는 외교정책 수립, 국제협력사업 기획, 경제·보건·교육·에너지 등 분야별 협력 동향 분석, 학술연구, 언론 보도, 글로벌 네트워크 구축, 정책자료 작성, 데이터 기반 시각화, 지역전략 수립, 미래 협력방안 모색 등 다양한 분야에서 활용 가능합니다.
