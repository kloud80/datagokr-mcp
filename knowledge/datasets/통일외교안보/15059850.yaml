summary_user: 한중앙아협력포럼사무국이 중앙아시아 5개국과 수행한 협력사업을 사업 한 건씩 연도·사업명·시작일·종료일·사업유형으로 담은 작은 CSV 파일(약 6.6KB)이다. 외교·국제협력 분석가나 연구자가 '한국과 중앙아시아 간 협력사업이 연도별로 어떤 유형으로 얼마나 진행됐나'를 살피는 데 쓴다. 전역 조인 키가 없어 다른 ODA·외교 데이터와는 사업명이나 연도를 기준으로 직접 맞춰 이어야 한다.
