summary_user: 방위사업청이 국방전자조달로 낸 신기술 분야 입찰공고를 공고 건별로 담은 전국 단위 파일(CSV, 약 9KB)로, 공고일자·업무구분·입찰구분·사업명·발주기관을 담는다. 국방 신기술 연구개발 사업에 참여하려는 기업·연구기관이 '최근 어떤 발주기관이 어떤 신기술 사업을 공고했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 사업자번호가 없어, 다른 국방조달 입찰결과·계약 데이터와는 사업명·발주기관 이름을 맞춰 이어야 한다.
