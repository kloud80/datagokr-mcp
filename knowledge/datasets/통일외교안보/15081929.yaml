summary_user: 방위사업청이 지정한 방산업체 84곳을 업체 단위로 나열한 전국 단위 목록 파일(csv)로, 순번·업체명·분야·지정일자·비고를 담고 지정일자는 최초 지정일 기준이다. 방산업체로 지정된 회사가 어느 분야에 있고 언제 처음 지정됐는지 확인하려는 분석가나 사업자가 쓴다. 전역 조인 키가 없어 업체명 매핑이나 같은 기관의 다른 방산 데이터(DQ 인증·국방규격 등)와 이름·기관 코드로 연결해 쓰며, 국방전자조달은 나라장터와 별도라 `public-procurement`와는 따로 본다.
description_portal: '2007년 방위사업청 개청 이후 방산업체 지정현황을 제공합니다.순번,  업체명, 지정일자, 비고 항목을 제공하며, 지정일자는 최초 지정일자 기준입니다.방산업체 분야는 기동, 탄약, 화력, 항공, 항공유도, 함정, 통신유도, 기타 분야입니다. 방산수출 증가에 따른 방위사업청 다운로드 상위 데이터입니다. 데이터 업데이터 주기는 1년이며, 문의 요청에 따라 기업의 합병, 지정해제 등을 반영한 데이터를 수시로 업데이트 합니다. 데이터 관련 문의사항은 02-2079-6787로 연락주시기 바랍니다. 방산업체 지정현황 소관부서 : 방산정책과'
