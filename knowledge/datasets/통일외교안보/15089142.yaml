description_portal: 해군사관학교 입학 통계에 대한 데이터입니다. 연도별로 계열을 구분(문과, 이과, 자연, 인문 등)하여 각각의 인원수를 상세하게 나타내고 있습니다. 해당 데이터를 통해 계열별 입학 인원수를 토대로 추후 선발 정책 및 교육 과정 운영 정책 수립과 개선을 진행할 수 있으며,  해군의 전문 인력을 파악하는 데에 기초 자료로써 활용하는 것이 가능합니다.* 인원수에서 2021년 수탁생도 3명, 2020년 수탁생도 3명, 2019년 수탁생도 6명, 2018년 수탁생도 7명, 2017년 수탁생도 3명이 포함되어 있습니다.
