summary_user: KOICA가 정리한 국가별 개발협력 동향 글을 건별로 담으며, 제목·본문(한·영)·분야·출처·검토자·작성일과 국가명·ISO 코드를 함께 제공하나 검증 시 API 전체 건수는 2건에 그쳤다. 특정 협력대상국에서 최근 어떤 분야의 개발협력 동향이 보고됐는지 확인하려는 ODA 실무자나 분석가가 참고 텍스트로 쓴다. ISO 3166 2자리 국가코드(country_iso_alp2)를 키로 KOICA 국가별 협력사업·사업정보나 외교부 국가표준코드 데이터와 이어 쓴다.
description_portal: KOICA 및 국제개발협력사업과 관련된 개발협력 동향을 파악할 수 있는 API입니다. 국가별로 어떤 개발협력사업이 어떤 방식으로 수행되었는지에 대한 정보를 제공하며, 국가별 지원 분야의 집중도나 사업의 변화 양상을 정리하는 데 유용합니다. 대상 국가의 특성과 수요를 분석하고, 향후 협력 전략 수립이나 평가 기준 설정에 필요한 데이터를 제공합니다. 국가별 ODA 협력전략, 외교정책 수립, 성과 기반 계획 수립을 위한 실무자료로 활용 가능합니다. 해당 API는 인증키(serviceKey), 페이지 번호(pageNo), 한 페이지 결과 수(numOfRows) 등 기본적인 요청변수를 사용하며 데이터표출방식, 한글 국가명, ISO 2자리코드 등의 필터 파라미터를 추가로 설정할 수 있습니다. 출력결과에는 본문, 검토자, 국가명, ISO 숫자코드, 코로나19관련여부, 동향분야명, 출처 등의 항목이 포함되며, 각 항목에 대한 데이터는 JSON 형식으로 반환됩니다.
team:
  dept: 데이터팀
services:
  - op: /getDevCprTrendList2
    name: 국가별 개발협력 동향 조회
    endpoint: https://apis.data.go.kr/B260003/DevCprTrendService2/getDevCprTrendList2
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지 번호
      - name: numOfRows
        required: false
        example: '10'
        desc: 한 페이지 결과 수
      - name: returnType
        required: false
        example: JSON
        desc: 데이터표출방식
      - name: cond[country_nm::EQ]
        required: false
        example: 나이지리아
        desc: 한글 국가명
      - name: cond[country_iso_alp2::EQ]
        required: false
        example: NG
        desc: ISO 2자리코드
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
