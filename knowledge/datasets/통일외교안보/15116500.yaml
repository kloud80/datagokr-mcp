description_portal: 한국국제교류재단은 한국문화의 세계적 확산과 국가 이미지 제고, 상호 문화 이해 증진을 위해 ‘한국국제교류재단_문화예술교류 사업정보’ 데이터를 공공데이터 포털에 개방하고 있습니다. 이 데이터는 연도별, 사업분류, 프로젝트명, 사업국가 등 다양한 문화예술교류 사업의 핵심 정보를 포함하며, 약 1,000건이 CSV, XML, JSON 등 오픈 포맷으로 제공됩니다. 누구나 무료로 활용할 수 있으며, 해외 공연·전시 지원, 국제 문화예술 협력 현황 분석, 정책 연구, 글로벌 네트워크 구축, 언론 보도, 문화콘텐츠 개발, 사업성과 평가, 학술연구, 데이터 기반 시각화, 정책자료 작성 등 다양한 분야에서 활용 가능합니다. 이 데이터는 문화예술을 통한 국가 브랜드 가치 향상과 국제적 교류 기반 확대에 기여하고 있습니다.
