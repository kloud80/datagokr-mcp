summary_user: KOICA 무상원조와 EDCF 유상원조를 연계해 추진하는 유무상연계사업을 사업 한 건당 한 행으로 담은 목록이며, 국가명·시행기관·사업유형·시작·종료연도·사업규모(억원)·사업 내용이 들어 있다(CSV 약 4.8KB의 소규모 파일). 개발협력 연구자나 정책 담당자가 '어느 나라에서 어떤 분야의 유무상연계사업이 몇 년간 얼마 규모로 진행됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 KOICA 사업·국가별 협력사업 데이터와는 국가명이나 사업명을 이름으로 맞춰 연결해야 한다.
description_portal: 한국국제협력단(KOICA)과 대외경제협력기금(EDCF)이 협력하여 추진하는 유무상연계사업의 목록을 제공합니다. 유무상연계사업은 무상원조와 유상원조를 하나의 큰 그림 안에서 유기적으로 연계하여 추진하는 것으로, 무상원조와 유상원조의 장점을 결합하여 개발협력의 시너지를 극대화하고 원조의 효과성을 높이는 것을 목표로 합니다. 동 데이터 주요 제공항목으로는 사업명, 국가명, 시행기관, 사업유형, 시작 및 종료 연도, 사업규모, 사업구분, 사업내용 등이 있습니다. 이를 통해 각 사업의 기본 정보와 추진 현황을 파악하고, 나아가 개발협력 정책 수립, 사업 평가, 국제개발협력 연구 등에 활용할 수 있습니다.
