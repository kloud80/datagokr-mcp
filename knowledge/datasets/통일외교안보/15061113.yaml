description_portal: 경기도 성남시 국제교류(자매협력, 우호협력)도시 현황에 관한 데이터로, 국가명, 도시명, 체결일, 지역특성 등의 항목을 제공합니다. 성남시 국제교류도시 현황은 성남시가 세계 여러 도시와 맺은 자매결연 및 우호협력 관계를 정리한 자료입니다. 이 자료는 자매협력도시와 우호협력도시로 구분하여 국가명, 도시명, 국제교류 체결일자, 인구, 지역특성(주요산업) 등의 항목을 포함하고 있습니다.  데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 성남시의 국제적 협력 기반을 이해하고 활용하는 기초자료로 활용 할 수 있습니다.
