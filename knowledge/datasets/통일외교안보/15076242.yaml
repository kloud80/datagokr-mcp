summary_user: 국가·지역별 현지 대사관 등 연락처를 담은 국가 단위 목록 API로, 전체 197건이 전국·비공간 범위로 제공된다. 해외여행 중 여권 분실 같은 도움이 필요할 때 여행객이 현지 연락처를 찾는 질문에 쓴다. 한글 국가명이나 ISO 2자리 국가코드(country_iso_alp2)로 조회하며, 전역 조인 키는 없어 국가명·코드 매핑이나 같은 기관 코드로만 다른 해외안전 데이터와 잇는다.
