summary_user: 해외에서 발행된 DR(주식예탁증서) 종목을 기준일자·법인별로 담은 API로, DR 종목 조회(발행회사, 주식종류, 원주와 DR 비율, 전환가능·전환된 주식 수, 거래 거래소, 예탁기관)와 배당·분배 등 권리행사 사유별 일정 조회 2개 오퍼레이션으로 구성된다. 투자자나 분석가가 '특정 국내 기업이 해외 어느 거래소에 DR을 상장했고, 원주 몇 주가 DR 1단위에 해당하며 배당 등 권리일정은 언제인가'를 확인하는 데 쓴다. 법인등록번호(crno)와 ISIN 코드(isinCd)가 실측 조인 키여서 같은 키를 쓰는 금융위원회 주식시세·상장종목·배당 정보나 기업 공시·재무 데이터와 이어 쓴다.
description_portal: '국제거래종목정보는 기준일자와 법인등록번호 등을 기반으로 해외 발행 DR(대체증권, Depositary Receipt) 관련 정보를 제공하는 데이터입니다.총 2가지 오퍼레이션으로 구성되어 있으며,① DR종목 조회를 통해 DR 발행회사명, 주식종류, 종목단축코드, ISIN코드, 거래소 정보, 예탁기관명, 전환비율, 전환가능주식 수 등의 정보를 제공하고,② 사유별 일정정보 조회에서는 권리행사사유(예: 배당, 분배 등), 신규상장구분, DR 종목 및 원주의 상세 정보를 확인할 수 있습니다.※ 데이터 갱신주기는 일 1회이며, 주말 및 공휴일은 다음 영업일에 데이터가 제공됩니다.** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
