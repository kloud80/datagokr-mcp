description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에서 발행하는 남원사랑상품권의 이용 현황을 체계적으로 정리한 자료입니다. 지역 내 소상공인의 매출 증대와 지역경제 활성화를 목적으로 도입된 남원사랑상품권은 지류형과 모바일형으로 나뉘어 운영되고 있으며, 이 데이터에는 상품권 발행량, 사용액, 업종별 이용 분포, 월별 사용 추이 등 상품권 운영에 관한 전반적인 실적이 포함되어 있습니다. 이 자료는 지역화폐 정책의 실효성을 분석하고 향후 정책 개선 방향을 수립하는 데 기초 자료로 활용될 예정입니다.2. 기대 효과이 데이터를 통해 지역화폐 정책의 효과를 객관적으로 측정하고 지역경제에 미치는 파급효과를 분석할 수 있습니다. 또한 상품권 이용 패턴을 심층적으로 분석함으로써 소상공인 지원 정책의 실효성을 높이고, 보다 체계적이고 효율적인 지역경제 활성화 방안을 마련할 수 있습니다.
