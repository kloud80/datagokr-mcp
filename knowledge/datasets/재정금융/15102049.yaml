summary_user: 농림축산검역본부에 등록된 전국 수출입식물 방제업체(훈증소독 업체)의 명부로, 업체 한 곳당 한 행에 상호명·사업장 주소·전화번호·대표자명을 담는다. 수입 식물 소독이나 수출 검역용 훈증을 맡길 업체를 찾는 수출입 사업자, 또는 특정 업체가 등록된 방제업체인지 확인하려는 사람이 쓴다. 전역 조인 키가 없어 다른 무역·사업자 데이터와는 업체명이나 주소를 직접 맞춰 이어야 한다.
description_portal: '수출입식물방제업 등록제도는 수입 식물 등에서 발견될 수 있는 검역병해충의 확산을 방지하기 위해 운영되고 있습니다. 등록된 방제업체는 훈증소독 시설과 전문 인력을 갖추고, 안전 기준과 국제 규범에 따라 소독을 실시합니다. 본 게시판에서는 이러한 수출입식물방제업체의 등록 현황을 공개하여 업계와 국민이 관련 정보를 쉽게 확인할 수 있도록 하고, 검역 현장의 신뢰성과 투명성을 확보하는 데 기여하고 있습니다.수출입식물방제업을 하려는 자는 농약관리법 규정에 따라 농림축산검역본부장에게 수출입식물방제업을 신고한 후 신고증을 발급받아야 합니다.제공정보 : 수출입식물방제업체 상호명, 사업장주소, 전화번호, 대표자명2025년 7월 25일 기준 등록현황 입니다.'
