description_portal: 재정정보 공개시스템 열린재정을 통해 제공되는 국가채권 관련 주요 재정 지표를 포함한 종합적인 통계를 담고 있습니다. 국가채권현황을 비롯하여 회계별 세입·세출 결산현황, 각종 부담금의 운용 실적, 조세수입 내역과 국민의 조세부담률, 추경예산의 편성 추이, 연도별 세입세출 예산편성 현황 등 다양한 항목에 대한 정보를 확인할 수 있습니다. 이를 통해 정부의 재정 운용상황과 국가재정의 건전성 수준을 파악할 수 있으며, 정책 수립 및 예산 편성에 참고할 수 있는 기초자료로 활용됩니다. 해당 데이터는 재정투명성 강화를 위해 대국민에게 개방된 정보로서, 국가의 재정 흐름과 정책 방향을 이해하는 데에 유용한 자료입니다.
