summary_user: 관세청 수입 통관자료를 수입신고수리일 기준 10일 단위로 집계한 잠정치 통계로, 전체 수입금액과 반도체·원유·기계류·가스 등 10대 주요품목별 수입금액(천 달러)을 전국 단위로 담는다. 기업·분석가가 이번 달 1~10일, 1~20일 누적 기준으로 원유나 반도체 수입이 얼마나 늘었는지 같은 월중 수입 동향을 빠르게 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 관세청의 월별 품목·국가별 수출입 통계와는 기간(연월)과 품목 이름을 맞춰 연결한다.
limits: 전국 합계만 있어 지역·국가·세관별 수입은 알 수 없다. 당월 수치는 잠정치이고 신고 정정·취하가 반영되면 바뀔 수 있다. 조회 기간 파라미터(시작·종료 연월)는 필수이므로 호출할 때 미리 정해 넘겨야 한다.
