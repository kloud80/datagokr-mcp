description_portal: 한전KPS의 주주총회 소집결의에 대한 자료로, 소집결의 공시제출일자, 주주총회일시, 장소, 이사회결의일(결정일), 사외이사 참석 및 불참 인원, 감사 참석여부 등에 대한 내용입니다. 해당 데이터는 2022년부터 2024년까지의 정기주주총회 및 임시주주총회 관련 주주총회 소집결의 정보를 포함하고 있습니다. 주주총회 소집결의는 상법 제363조 및 제542조의 4에 의거 공고하고 있습니다. 더 자세한 주주총회 소집결의 관련 사항은 전자공시시스템(dart.fss.or.kr) 자료를 통해 확인할 수 있습니다.
