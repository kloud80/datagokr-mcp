description_portal: (부보금융회사 종합정보)예금보험기금이 일정 손실을 감당할 수 있도록 사전에 적립 목표규모를 설정하고, 예금보험기금의 적립수준이 목표규모에 도달한 경우 예금보험료를 감면하는 것으로 조치한 현황 정보("09.1월부터  시행)* 계정별 공사의 직전 회계연도말 기금적립률에 따른 당해연도 예금보험료 감면 내역으로, 해당 예금보험료는 다음연도에 수납** 예금보험료 감면 기준의 경우 목표규모 상환을 초과하는 경우 예금보험료를 면제, 목표규모 하한 초과 계정의 경우 각 계정의 목표규모 구간(상한～하한)을 9개 구간으로 나누어 구간별 고정 감액률(구간별 감액률을 10%씩 동일하게 증가)을 설정한 후, 직전 회계연도말 기금 적립률을 기준으로 감액률 결정
