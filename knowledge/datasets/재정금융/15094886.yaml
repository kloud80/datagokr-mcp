description_portal: '○ 통계개요* 통계명 : 임금실태 (성별)* 통계종류 : 서울시 상용근로자의 월평균 임금 현황을 제공하는 일반ㆍ조사통계* 작성목적 : 민간, 공영사업체 등에 취업하고 있는 상용근로자의 고용, 임금, 근로시간의변동추이를 파악하여, 고용정책, 근로기준 및 노사정책 등 정책 수립에 기초자료를제공하는 것을 목적으로 함* 조사체계 : 사업체 → 지방노동관서 → 노동부* 공표주기 : 정기(매년, 12월 기준) ※ 2006년 조사종료* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 성별ㆍ직업분류별(전산업, 광공업, 사회간접 등) 임금실태,임금비 현황○ 기 타* 2007년 이후 데이터 생산 안함* 상용근로자 5인이상 자료임* 임금액은 해당년도 4월급여기준 자료이며, 남여임금비는 남자=100 기준임'
