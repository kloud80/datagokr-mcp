description_portal: '초보 중소기업의 원활한 수출 이행을 지원하기 위해  각 분야별 현장 경험이 풍부한 전문 컨설턴트가 1:1 맞춤형 컨설팅을 제공하는 "TRADE-SURE 컨설팅"에 대한 설명 영상입니다. <컨설팅 분야>- 수출금융 조달 : 정책자금 및 금융·보증기관 종합 안내, 무역금융 및 매입외환 등 활용방안, Trade Finance 활용방안- 환위험 관리 : 환위험 헤지 방안 관리기법, 환율동향 및 전망- 무역보험 활용방안 : 수입자 신용조사, 보상 및 해외 수출채권추심, 수출대금 미회수위험 관리 및 자금조달을 위한 보험(보증)제도 안내- 수출입 :  해외마케팅 및 수출판로 개척, 수출계약, FTA 활용 등- 법무  : 상사분쟁, 법률자문, 무역클레임, 특허권 등- 회계(세무) : 조세법령 검토, 회계감사 자문, 세법 검토 등- 인사, 노무 :  인사제도, 노동법령 - ESG : ESG 경영진단, ESG 도입방안 등'
