summary_user: MBS·KOMOCO·SLBS 등 주택저당증권의 원본 상환액과 이자(배당) 지급액을 기준년월·발행연도·채권종류별로 집계해 담고, 증권유형별 콜옵션 행사금액도 따로 담는다. 채권 분석가나 MBS 투자자가 '특정 연도에 발행된 MBS의 원금이 월별로 얼마나 상환되고 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 기준년월(basYm)·발행연도(scrsIssuYr) 같은 시점 값이나 채권종류 이름을 맞춰서만 이어 쓴다.
description_portal: 모기지론증권원본및이자상환추이정보는 기준년월을 기준으로 MBS, KOMOCO, SLBS 등 주택저당증권의 원본 및 이자 상환 현황을 제공하는 데이터입니다.총 2가지 오퍼레이션으로 구성되어 있으며,① 전체증권원본및이자상환추이정보 조회에서는 발행년도별 채권종류에 따라 원본금액 및 배당금액 현황을 제공하며, 주요 항목에는 MBS·KOMOCO·SLBS별 원본 및 이자(배당) 금액이 포함됩니다.② 콜옵션행사현황 조회는 각 증권유형별 콜옵션 행사금액 정보를 제공하며,기준년월과 발행연도별로 행사 여부 및 금액 변화를 확인할 수 있습니다.
