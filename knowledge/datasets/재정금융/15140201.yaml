summary_user: 한국무역보험공사가 수입 제한·전쟁·송금 제한 같은 비상위험 발생 가능성과 OECD 등급 등을 고려해 자체 평가한 국가별 신용등급을 국가 한 곳당 한 행으로 담으며, 국가코드·국가명·평가등급(1~7등급, 숫자가 작을수록 신용도가 높음)·평가일자로 구성된다. 수출기업이나 무역금융 분석가가 "이 거래 상대국의 대금 회수 위험은 어느 등급이고 언제 평가됐나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 관세청 국가별 수출입 실적 같은 다른 데이터와는 국가코드(ctryCd)나 국가명을 매핑해서 잇는다.
description_portal: 공사에서 자체 평가한 국가별 신용등급 자료입니다. 국가명, 국가등급 및 등급평가일 정보를 제공합니다. 국가등급은 국가별 신용도의 우열순으로 1~7등급으로 평가되었습니다. 무역보험에서 담보하고 있는 각종 비상위험*의 발생가능성을 국가별로 조사, 분석하고, OECD 등급 등을 고려하여 평가를 진행하고 있습니다.  * 수입국에서 수입을 금지하거나 수입 제한 조치를 하거나, 수입국 또는 제3국에서의 전쟁, 내란, 혁명, 폭동, 파업과 같은 비상사태 등 수출입계약 당사자에게 책임 지울 수 없는 사유로 인하여 수출이 불가능하거나 수출대금의 회수가 불가능해지거나 또는 해당국의 환거래 제한, 송금 제한 조치로 인하여 수출한 물품대금의 회수가 불가능할 때 수출자나 금융기관이 손실을 입을 위험
