description_portal: 본 데이터는 경기도 광주시 주민의 1인당 지방세 부담액 정보를 제공합니다. 광주시민이 부담하는 지방세를 인구와 세대수로 나누어 산출한 통계 자료를 담고 있어 지역 재정 현황을 파악할 수 있습니다. 과세년도는 해당 통계의 기준 연도를 나타내며, 주민 1인당 부담금액과 세대당 부담금액은 각각 인구와 세대 기준으로 산출한 평균 지방세 부담액을 제공합니다. 지방세 금액은 전체 징수된 지방세 총액을 나타내고, 인구수와 세대수는 산정 기준이 된 주민 수와 가구 수를 표시합니다. 본 데이터는 재정 분석, 조세 정책 수립, 지역 경제 비교, 재정 건전성 평가, 주민 세 부담 분석 등에 활용됩니다.
