description_portal: '해당 자료는 기업의 총차입금/자기자본 비율에 대해 재무제표보다 동태적인 시계열 형식으로 확인하실 수 있는 자료입니다.- 총차입금/자기자본 비율 : 신용공여상(전전월 기준) 총차입금을 재무제표상 자기자본으로 나눈 지표로, 자기자본으로 얼마만큼 최근의 차입금을 부담할 수 있는지를 나타냅니다.- 통계 프로그램상 2022년 3월 이후부터 확인 가능합니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다'
