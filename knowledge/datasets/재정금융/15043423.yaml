summary_user: 종목별 주식 기본정보, 발행 내역, 의무보호예수 반환 정보, 발행 현황을 4개 조회 기능으로 담는 API이며 전체 153,754건, 기간은 1956-03-03~2026-10-01이다. 분석가나 투자자가 특정 상장사의 유상증자 등 주식 발행 이력과 보호예수 물량이 언제 풀리는지 확인하는 데 쓴다. 법인등록번호(crno)와 종목코드(isinCd)가 조인 키라서 기업 공시·재무 데이터나 증권 시세 데이터와 이어 쓴다.
description_portal: '주식발행정보는 기준일자, 법인등록번호 또는 주식발행회사명을 기준으로 종목의 기본 정보부터 발행 내역, 의무보호예수 반환 정보, 주식발행 현황까지 종합적으로 제공하는 데이터입니다.주요 제공 항목으로는 주식액면가, 발행주식수, 상장 및 상장폐지일자, 주식발행일자와 발행차수, 주식발행사유, 반환일자 및 반환주식수, 보호예수 등록일 및 사유, 보통주·우선주의 총발행수 등이 포함됩니다.<데이터 조회 시 유의사항>파라미터 없이 조회 시 데이터 조회 시간이 오래걸려 timeout이 발생하게 되어 필수 파라미터를 지정하였습니다.- 파라미터 조건 : 조회 시 아래의 필수 파라미터 중 최소 1개 이상을 반드시 입력해야 합니다.- 기본값 안내 : 필수 파라미터를 입력하지 않은 경우, 기준일자(basDt)는 자동으로 가장 최신 날짜로 설정되어 조회됩니다.[서비스별 필수 파라미터 목록]- 종목기본정보조회 : basDt, isinCd, crno- 주식발행내역조회, 의무보호예수반환정보조회, 주식발행현황조회 : 없음해당 데이터는 다음 4가지 조회 기능으로 구성되어 있으며,① 종목기본정보 조회, ② 주식발행내역 조회, ③ 의무보호예수반환정보 조회, ④ 주식발행현황 조회를 통해 개별 항목을 상세히 조회할 수 있습니다.본 데이터는 상장기업 정보 분석, 유상증자 동향 파악, 보호예수 해제 규모 모니터링 등 자본시장 분석과 공시 검증 자료로 활용할 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
