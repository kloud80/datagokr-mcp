description_portal: 1. 데이터 설명전북특별자치도 남원시의 지방세 체납현황 데이터는 지역 내 납세자들의 자동차세, 재산세, 주민세 등 다양한 지방세 미납 상황을 체계적으로 정리한 통계 자료입니다. 이 데이터는 과세연도와 세목에 따라 체납액 구간을 세분화하고, 체납건수와 체납금액을 상세히 제공하며, 누적 체납현황까지 포함하여 지역의 세수 상황을 포괄적으로 분석할 수 있게 구성되었습니다. 지방자치단체의 재정 투명성을 높이고 시민들의 납세의식을 향상시키는 것을 목표로 하며, 정책 수립과 세정 개선을 위한 중요한 기초자료로 활용됩니다.2. 데이터 항목명시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 체납액구간, 체납건수, 체납금액, 누적체납건수, 누적체납금액3. 기대효과본 데이터 공개를 통해 지방세 징수율 향상을 위한 정책 마련에 필요한 근거자료를 제공하고, 시민들의 납세의식을 높이며 지방재정 운영의 투명성을 더욱 강화할 수 있습니다.
