description_portal: '한국무역보험공사의 2019년 상반기 기준 무역보험 주요종목 지원현황을 원화신규보험금액 및 미화신규보험금액으로 나타낸 데이터입니다.<무역보험 제도 개요>ㅇ 수출보험 및 수출신용보증 : 수입자의 계약 파기, 파산, 대금지급지연 또는 거절 등의 신용위험과 수입국에서의 전쟁, 내란 또는 환거래 제한 등의 비상위험으로 수출자 또는 수출금융을 제공한 금융기관이 입게 되는 손실을 보상하는 제도- 단기수출보험 : 결제기간 2년 이내의 수출거래 대상 / 외상 수출 후 수출대금을 회수하지 못하는 경우의 손실을 보상- 중장기수출보험 : 결제기간 2년 초과 수출거래 대상 / 중장기 수출거래에서 금융기관의 대출원리금 회수불능 위험 등을 담보하는 제도- 수입보험 : 선급금 미회수 시 또는 자원 수입에 필요한 자금 대출 후 대출금 미회수 시 발생하는 손실을 보상하는 제도- 해외투자보험 : 해외 자원 개발 등을 위해 투자한 주식, 대출금의 미회수 위험을 담보하는 제도- 수출보증보험 : 금융기관이 보증서 발행 후 수입자로부터 보증채무 이행청구를 받아 이행함으로써 입게 되는 손실을 보상하는 제도'
