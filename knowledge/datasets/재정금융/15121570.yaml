description_portal: '조세지출은 조세감면,비과세,소득공제,세액공제,우대세율 적용 또는 과세이연 등 조세특례에 따른 재정지원입니다.(조세특례제한법 제142조의2)조세지출은 영구적으로 세부담을 경감하는 직접감면과 일정기간 과세를 연기하는 간접감면으로 구분이 가능합니다.ㅇ 직접감면의 종류 - 비과세: 특정 소득을 과세대상이 되는 소득에서 제외 - 소득공제: 과세소득에서  일정금액을 차감 - 저율과세: 일반세율보다 낮은 세율을 적용 - 세액감면: 산출세액의 일정 비율을 납부할 세액에서 제외 - 세액공제: 투자금액 등의 일정 비율을 납부할 세액에서 차감 - 기타감면: 근로장려금, 자녀장려금, 부가가치세 영세율 등 다른 감면 유형에 속하지 않는 감면ㅇ 간접감면의 종류 - 준비금: 기업이 특정한 목적을 위하여 준비금을 사내적립하는 경우 그 사내적립금을 일정한 손비로 인정하여 과세를 연기 - 과세이연: 자산을 대체 취득하는 경우 새로 취득한 자산의 처분시점까지 과세를 연기 - 이월과세: 개인이 사업용 고정자산을 현물출자 등으로 법인에 양도하는 경우 개인에 대해서는 양도소득세를 과세하지 않고, 법인이 그 출자 받은 자산을 처분할 떄까지 과세를 연기해당 자료는  예산의 기능별 분류기준, 세목, 감면방법, 조세특례제한법 상 분류에 따른 연도별(2018~2023년) 조세실적 자료를  제공합니다.(단위: 억원, %)'
