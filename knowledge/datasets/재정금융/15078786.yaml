description_portal: 지방자치제 확산과 지방 분권 강화로 지방세의 역할과 중요성이 증대되면서, 과세 대상과 비과세 대상에 대한 체계적인 관리와 분석을 통한 효율적인 지방세 정책 수립이 중요한 지방 행정 과제로 대두되고 있습니다. 지방세법에 따른 적정한 과세와 비과세 기준 적용을 통한 조세 형평성 확보와 세정 운영의 투명성 제고가 요구되고 있으며, 지역 경제 발전과 납세자 지원을 위한 세제 혜택 정책의 효과성 분석과 개선 방안 모색이 필요합니다. 과세 현황과 비과세 현황의 체계적 분석을 통한 지방세 수입 예측과 중장기 재정 계획 수립의 정확성 향상이 중요해지고 있으며, 납세자들의 과세 및 비과세 혜택에 대한 이해 증진과 적정한 세무 서비스 제공을 위한 투명한 정보 공개가 필요합니다. 또한 지방자치단체 간 과세 정책 비교 분석과 지방세 제도 개선을 위한 실증적 자료 확보의 중요성이 증가하고 있으며, 세목별 과세 효율성 평가와 세정 개선 방안 도출을 위한 데이터 기반 정책 수립이 요구되고 있어, 충청남도 보령시는 관내 104건의 세목별 과세 현황에 대한 과세년도, 세목명, 과세 및 비과세 건수와 금액 등 지방세 정책 수립과 세정 운영 개선에 필요한 종합적인 지방세 과세 현황 정보를 제공하고 있습니다.
