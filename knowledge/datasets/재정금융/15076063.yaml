description_portal: 세출 및 지출 세부사업 예산편성현황(외화)은 중앙행정기관의 세부사업별 세출·지출 예산 중 외화로 편성된 예산 현황을 집계·제공하는 재정 통계 자료입니다.(부처별, 분야·부문·프로그램·세부사업별 외화예산 편성 내역과 정부안 및 국회 확정 예산 금액 비교 가능)외화예산은 외화로 지급해야 하는 국제 거래, 해외사업, 외교·통상 활동 등과 관련된 지출을 위해 편성되며, 외화환율 변동에 따라 원화 대비 실질 지출규모가 달라질 수 있는 특성을 가집니다.[데이터 주요 항목 및 특징]1. 데이터 범위   * 중앙행정기관의 외화 편성 예산 현황   * 부처명, 회계명, 분야·부문·프로그램·단위사업·세부사업명, 외화표시 금액 등 포함3. 외화 예산의 주요 용도   * 해외 공관 운영비   * 국제기구 분담금 및 출연금   * 해외사업 투자비   * 해외 구매 장비·물자 비용   * 대외원조 자금(ODA)3. 활용 예시   * 외교·국제협력 관련 예산 분석   * 환율 변동에 따른 외화예산 규모 추정   * 정부 대외정책 우선순위 파악   * 부처별 외화 사용 구조 비교4. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 파일형식 다운로드 가능   * Open API 연계 가능 (연도, 부처, 분야, 세부사업, 통화 단위 등 조건별 조회 지원)본 자료는 정부의 외화지출 구조와 규모를 투명하게 공개하여 국민의 알권리를 충족시키고, 연구기관·언론·일반 국민의 대외정책 분석, 환율리스크 관리, 국제협력 정책 수립 등에 폭넓게 활용됩니다.
