description_portal: 지자체 등 지원기관 또는 단체(협회 등)가 보험계약 절차를 진행하여 일괄 보험계약을 체결하는 방식의 단체보험 지원 실적("16년~"23년)을 나타내는 데이터입니다.단체보험은 단체 및 협회는 보험계약자로 보험계약을 체결하고, 수출자는 단체보험의 피보험자로서 수출대금 미회수 위험 발생 시 최대 U$10만(지자체별 상이)까지 보상받는 제도입니다. 1회 가입으로 1년간 수출거래 전체에 대해 대금 미회수 위험을 담보하며, 수입자 신용조사 및 한도책정 등을 생략하며, 보험료는 지자체, 협회 및 단체, 금융기관 등이 대신 납부하는 상품입니다.
