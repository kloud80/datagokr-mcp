description_portal: 중앙행정기관별 순자산의 변동 현황을 정리한 공공데이터로, 회계연도 기준으로 각 부처의 순자산 증감 내역을 명확히 파악할 수 있도록 구성되어 있습니다. 순자산변동표는 자산 증가 및 감소 요인, 기초 및 기말 순자산 등의 항목으로 구성되며, 정부의 회계 및 결산 체계를 이해하고 예산 운용의 효율성을 평가하는 데 중요한 자료입니다. 본 데이터는 열린재정 시스템을 통해 제공되며, 행정기관의 자산관리 투명성 제고와 국민의 재정 정보 접근성 향상에 기여합니다. 또한 정책 수립과 분석, 학술 연구 등 다양한 목적으로 활용이 가능하며, 공공저작물로 자유롭게 이용할 수 있습니다. 링크의 "메타정보열기"를 통해 세부 내용을 확인하실 수 있습니다.
