description_portal: 본 데이터는 시와 구·군 간 조정교부금 교부 현황 정보이다. 자치구별 연도, 구군명  등의 세부 내용을 포함한다. 조정교부금은 광역자치단체가 기초자치단체의 재정 불균형을 조정하고 특정 사업을 지원하기 위해 교부하는 재정 지원금이다. 해당 자료는 재정 분권 정책 수립, 지역 간 재정 격차 해소, 재정 운영 투명성 제고에 활용된다. 교부금 배분 기준 및 실적 분석을 통해 공정한 재정 배분 체계를 확립하고 재정 형평성을 확보할 수 있다. 또한 기초자치단체의 재정 자립도 향상 및 지역 균형 발전을 위한 정책 수립에 필요한 기초 자료를 제공한다. 교부금 집행 내역 공개를 통해 재정 운영의 투명성을 확보하며, 주민들의 재정 감시 활동을 지원한다.
