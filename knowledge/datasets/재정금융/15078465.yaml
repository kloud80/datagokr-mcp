description_portal: 2018년 ~ 2025년 주민 1인 당 또는 세대 당 부담된 지방세액조세 부담 수준 확인 및 거시경제 조세승수등의 산출 기초로 사용본 데이터는 대구광역시 서구의 연도별 주민 1인당 및 세대당 지방세 부담액을 산정한 자료이다. 과세년도별로 자치단체 코드, 지방세 총액, 인구수, 세대수 등과 함께 제공되며, 해당 지표를 통해 지역 주민의 세금 부담 수준과 재정 기여도를 파악할 수 있다. 또한 인구 및 세대수 추이를 기반으로 한 자치단체의 재정정책 수립 및 세수 계획 수립 시 참고자료로 활용 가능하다. 데이터는 2018년부터 2025년까지 연속적으로 수집되었으며, 지방세 납부 실적을 기반으로 신뢰도 높은 행정통계로 구성되어 있다. 활용자는 본 데이터를 통해 연도별 변동 추이 및 세부담 증가율 등을 비교 분석할 수 있으며, 타 지역과의 상대적 재정 부담 수준을 파악하는 데 유용하다.
