summary_user: 국가·공공기관이 보유한 자산 중 대부·매각이 가능한 물건의 처분 공고를 건별로 담으며, 전국 47,742건(2007-03-02~2022-06-13)이 단일 오퍼레이션 목록 조회로 제공된다. 입찰을 노리는 사업자나 분석가가 특정 지역에 어떤 국유·공공 자산이 어떤 가격과 조건으로 공고됐는지 확인하는 데 쓴다. 소재지 주소 필드(address 키)와 시도명(admin_area_code 키)으로 지역·주소 기반 데이터와 이어 쓰며, 자산 식별용 별도 공통 키는 확인되지 않았다.
description_portal: 국가자산정보는 국가 및 공공기관이 보유한 자산 중 대부 또는 매각이 가능한 물건에 대한 정보를 제공하는 데이터입니다. 제공 항목에는 자산명, 자산유형, 대부·매각 구분, 처리기관, 감정평가액, 예정가격, 소재지, 공고일자, 공고번호, 입찰일자, 계약체결일자, 계약구분 등이 포함됩니다. 이 데이터는 국가자산 처분에 대한 공고 목록 조회 기능을 단일 오퍼레이션으로 제공하며, 공공자산의 처분 절차를 투명하게 공개하여 국민의 알 권리를 보장하고, 입찰참여, 자산활용 계획 수립, 정책 모니터링 등에 활용할 수 있습니다.
