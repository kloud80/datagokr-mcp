description_portal: '○ 통계개요* 통계명 : 금융기관 예금, 대출 및 어음* 통계종류 : 금융기관에서 이루어진 금융거래 현황을 제공하는 지정ㆍ가공통계* 근거법령 :「한국은행법」제86조에 따라 수집ㆍ제공되는 금융거래 현황* 작성목적 : 통화당국과 예금취급기관 등의 대차대조표 등을 파악ㆍ분석하여, 통화신용정책 및 관련금융정책 수립의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 금융결제원, 은행및신용카드사, 전자금융업자→한국은행* 공표주기 : 정기* 공표범위 : 지역 - 서울시내용 - 서울시 월별 금융기관 예금(저축성예금, 요구불예금), 대출, 어음부도율 등○ 용어설명* 예금 : 은행 등 금융기관이 불특정다수인으로부터 그 보관과 운용을 위탁받은 자금.예금은 계약의 내용에 따라 저축성예금과 요구불예금으로 분류* 저축성예금 : 예금납입 및 인출방법에 대해 특정 조건이 있는 기한부 예금으로주로 장기저축이나 이자수입을 목적으로 하는 예금을 이르는 말** 정기예금 : 예금주가 일정 기간 환급(還給)을 요구하지 않을 것을 약정하고 일정금액을 은행에 예치, 은행은 이에 대하여 일정 이율의 이자를 지급할것을 약속하고 증서 또는 통장을 발행·교부하는 예금** 정기적금 : 일정 금액을 계약하고, 일정기간 매월 일정액을 불입하여 기간 만료후에계약금액을 환불받는 예금제도. 푼돈으로 목돈을 마련하는 목적에 이용됨** 저축예금 :개인이 저축 및 이자를 늘려 나가기 위하여 하는 예금. 정기 예금의 형태를취하는 경우가 많으며, 보통 예금보다 이율이 높고 수시로 인출이 가능* 요구불예금 : 예금자가 언제든지 찾아 쓸 수 있는 예금을 통틀어 이르는 말* 어음교환 : 일정지역의 은행 등 금융기관이 매일 일정한 장소, 일정한 시각에 모여 각기보유하고 있는 어음류를 교환함으로써 대차(貸借)를 집합적으로 상계(相計)하고 그 잔액만을 결제하는 방법이나 제도'
