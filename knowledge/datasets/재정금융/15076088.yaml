description_portal: 중앙행정기관별 재정운영에 대한 정보를 포함한 데이터로, 순원가, 비교환수익, 재정운영결과 등 주요 회계항목의 현황을 종합적으로 제공합니다. 각 부처의 재정활동 실적을 투명하게 공개함으로써 국민의 알권리를 보장하고, 정책 수립 시 재정운영 실태를 분석하는 데 활용됩니다. 재정운영표는 회계연도 기준으로 정리되며, 정부회계에 따른 운용결과를 정확하게 나타냅니다. 본 데이터는 열린재정 시스템을 통해 접근할 수 있으며, 공공저작물로 자유롭게 활용 가능합니다. 예산집행, 회계분석, 정책연구, 행정성과 평가 등 다양한 분야에 유용하게 쓰일 수 있도록 설계되어 있습니다.
