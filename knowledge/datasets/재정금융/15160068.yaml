description_portal: 이 데이터는 신용보증기금에서 유망 스타트업을 발굴 및 지원하기 위해 추진한 공모 사업의 현황을 집계한 자료로, 공모제목, 공모진행상태, 공모진행현황 등의 핵심 칼럼을 포함하고 있다. 본 데이터는 스타트업 공모 사업별로 진행된 다양한 스타트업 공모 사업의 전반적인 추진 과정을 투명하게 제공함으로써, 공공기관의 창업 지원 사업 운영 메커니즘과 혁신 스타트업 육성 추이를 다각도로 분석할 수 있는 기반을 제공한다. 해당 데이터는 창업 생태계 내 민간 스타트업의 공모 참여 전략 수립, 유관 기관의 창업 지원 정책 효과성 검증, 민간 연구소의 스타트업 트렌드 분석을 위한 기초 자료로 다양하게 활용될 수 있다.
