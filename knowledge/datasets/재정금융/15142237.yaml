description_portal: 면세점(보세판매장)을 이용하는 이용객의 국적별 비중과   면세점(보세판매장)에서 판매되는 화장품에 대한 매출 비중에 대한 데이터입니다.이용객의 국적은 한국, 미국, 중국, 일본, 대만, 기타로 나뉘어집니다.면세점(보세판매장)에서 판매되는 물품은 가방류, 귀금속류, 담배, 민예품류, 시계, 식품류, 안경(선글라스)류, 의류, 인홍삼류, 전자제품류, 주류, 향수, 화장품, 기타 등으로 분류됩니다.기간은 2015년부터 2024년까지 연간으로 집계한 데이터입니다.또한, 면세점 관련 데이터는 온오프라인을 구분하여 데이터를 관리하고 있지 않아 온라인 매출액만 나눌 수 없음을 알려드립니다.또한, 신고인의 수정, 정정 등으로 인해 통계 수치는 달라질 수 있으니 유의해 주시기 바랍니다.
