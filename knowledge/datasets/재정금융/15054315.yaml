description_portal: 국가채권 현황 자료 제공. *해당 데이터는 공공저작물입니다. 저작권 정보를 참고하시어 데이터 이용에 유의하시길 바랍니다.국가채권은 융자회수금, 예금 및 예탁금, 사회보장기여금 등에 국가가 행사할 수 있는 금전청구권을 말한다.정부는 매년 채권현재액 총계산서를 작성하여 국회에 보고하는 등 국가채권의 효율적 관리를 위해 노력하고 있다.본 통계는 결산 자료로, 매년 6월경 전년 결산 정보가 공개됩니다.*  2024년말 현재 국가채권은 총 576.7조원으로 융자회수금 232.2조원, 예금및예탁금 247.2조원, 조세채권 75.8조원, 경상이전수입 16.1조원, 사회보장기여금 2.9조원, 기타 2.4조원으로 구성
