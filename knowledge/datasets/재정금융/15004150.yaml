description_portal: '신용보증기금은 중소기업의 역량 강화를 목적으로 매년 다양한 분야의 연수 프로그램을 운영하고 있으며, 본 데이터는 이러한 연수 실적을 연도별로 정리한 것입니다. 제공되는 정보에는 교육명, 교육내용, 교육분류(예: 직무향상교육, 창업교육 등), 대상(예: 중소기업 CEO, 임직원, 예비창업자 등), 모집인원, 수료인원 등이 포함되어 있어 연수 운영 현황을 구체적으로 파악할 수 있습니다.예를 들어, "매출채권 마스터 종합과정", "경리 마스터 종합과정", "마케팅·세일즈 전략과 사례", "pre-NEST 창업교육" 등 실무 중심의 교육과정이 다수 포함되어 있으며, 회계·경리, 영업전략, 인사노무, 창업 등 실질적인 경영 역량 향상을 위한 내용이 주를 이룹니다.'
