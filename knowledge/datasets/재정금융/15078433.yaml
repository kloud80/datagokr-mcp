description_portal: 본 자료는 대구광역시 서구의 과세연도별 지방세 납부 실적을 세목과 납부매체별로 정리한 통계이다. 등록면허세, 자동차세 등 세목을 기준으로, 납부매체 유형과 해당 매체의 전자고지 여부, 납부건수, 납부금액, 그리고 전체 중 해당 매체가 차지하는 비율이 포함되어 있다. 본 자료는 납세자가 실제로 선택한 납부수단의 활용 현황을 파악하고, 전자고지 기반 납부 방식의 보급률을 분석하는 데 활용된다. 특히 가상계좌 납부의 활용도가 높은 세목을 중심으로 납세 편의성 향상 정책 수립에 기초자료로 제공된다. 해당 통계는 지방세 수납 체계의 효율성과 향후 납부 경로 다양화 및 디지털 세정행정 추진의 근거자료로 활용된다.
