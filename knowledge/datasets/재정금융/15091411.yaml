description_portal: 이 데이터는 경남개발공사의 2025년도 회계연도 기준 예산현황을 수입과 지출로 구분하여 정리한 예산총괄 정보입니다. 데이터는 클린아이(지방공공기관 경영정보 공개시스템)의 "예산현황 > 예산총괄" 항목에서 추출한 것으로, 사업예산과 자본예산 각각의 수입 및 지출 항목을 항목별로 구체화하여 제공합니다.구체적으로는 연도, 기관명, 수입·지출 구분, 예산의 성격(사업/자본), 세부 항목명, 예산액(천 원 단위)으로 구성되며, 각 항목은 총괄 계정과 개별 세부계정이 포함되어 있습니다. 예산 항목은 영업수익, 영업외수익, 투자자산처분, 유동/비유동부채수입, 유보자금 등 수입 항목과 주택임대관리, 대행사업, 관광사업, 행정운영활동, 재무활동 등 지출 항목으로 구성되어 있습니다.이 데이터는 지방공기업의 재무운영 투명성을 제고하고 예산계획 수립 및 활용 실태를 분석하는 데 활용될 수 있으며, 예산 대비 실집행 분석, 사업 우선순위 평가, 재정 건전성 진단 등에 활용 가능성이 높은 자료입니다. 특히 예산항목별로 사업예산과 자본예산의 구분이 명확하여 예산 성격에 따른 정책 분석 및 재정운영 비교에 유용한 구조로 되어 있습니다.
