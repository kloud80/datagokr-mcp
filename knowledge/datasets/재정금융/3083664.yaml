description_portal: 이 데이터는 월별 기준으로 기업형태와 업종별 리스크율(%)을 정리한 현황 자료입니다. ‘기준년월’은 1월부터 12월까지이며, 기업형태는 법인, 개인, 기타로 구분됩니다. 업종은 소비재, 기계, 전기전자, 금속, 바이오화학, 지식, 기타의 7개 범주로 구성되어 있습니다. 각 수치는 해당 기업 유형과 업종 조합에서 집계된 리스크율(%)로, 일반적으로는 부실 가능성 또는 신용위험 수준을 수치화한 지표로 활용됩니다. 수치는 소수점 둘째 자리까지 제공되며, 월별 변동을 포함해 정량적 비교가 가능합니다.또한, 이 자료는 업종별 위험도 분포, 기업형태에 따른 리스크 프로파일 비교, 내부 리스크관리 기준 수립, 보증심사 모델 설계 등에 유용하게 활용될 수 있습니다. 특히 업종 및 기업구조별 차이를 수치로 구분할 수 있어, 정책 수립, 리스크 평가 체계 개선, 산업별 리스크 모니터링의 기초자료로서 활용될 수 있습니다.
