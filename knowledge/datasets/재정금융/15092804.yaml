summary_user: 신용보증기금 총계정원장을 회계년월과 국가결산회계구분 단위로 정리해 전기이월금액과 계정·회계 내부거래의 차변·대변 금액을 담은 집계형 회계 파일(CSV, 약 25KB)이다. 재무 분석가가 '신보 회계에서 내부거래 규모와 이월금액이 월별로 어떻게 달라지는가'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 회계년월이나 같은 기관 기준으로만 맞춰 본다.
description_portal: 해당 파일 데이터는 신용보증기금의 총계정원장정보에 대해 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
