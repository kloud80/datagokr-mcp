summary_user: 외화증권의 예탁결제일자별로 유가증권 구분(채권·어음·CD 등)과 거래 시장 국가·대륙 단위의 매도·매수 건수와 금액을 담은 집계 데이터이며, 외화증권예탁결제정보 조회와 시장별 현황 조회 두 오퍼레이션으로 제공된다. 분석가나 정책·연구기관이 '특정 기간 국내 투자자의 미국·유럽 등 해외 시장 외화증권 매수·매도 규모가 어떻게 변했나'처럼 국가별·대륙별 해외 증권투자 흐름과 집중도를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 결제일자, 국가 코드·명칭(scrsMrktNtnlDcd), 유가증권 구분 코드의 이름·코드 매핑으로만 이어 쓸 수 있다.
limits: 종목코드(ISIN 등) 같은 전역 조인 키가 없어 개별 종목 시세·공시와 직접 연결하지 못하고 국가·증권구분 수준의 집계만 다룬다. 공공누리 2유형(출처표시·상업적 이용금지)이라 상업적 활용에는 한국예탁결제원과 별도 이용계약이 필요하며, 개발계정은 일 10,000회 호출 제한이 있다.
