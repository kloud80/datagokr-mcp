description_portal: '국제거래외화증권예탁결제정보는 외화증권의 예탁결제일자를 기준으로 외화증권의 예탁·결제 거래 현황을 제공하는 데이터입니다.주요 항목에는 유가증권구분코드 및 명칭, 시장 국가 코드 및 대륙명, 예탁증권 매도건수 및 매도금액, 매수건수 및 매수금액, 결제일자, 종목 구분 등이 포함되며, 국가별 또는 시장별로 외화증권 거래 동향을 파악할 수 있습니다.이 데이터는 ① 외화증권예탁결제정보 조회, ② 시장별 외화증권예탁결제현황 조회의 두 가지 오퍼레이션으로 제공되며, 외화 유가증권 거래 흐름, 해외 투자자금 유입·유출 추이, 대륙별·국가별 거래 집중도 분석 등에 활용됩니다.특히 국제 금융거래의 예탁 및 결제 규모를 정량적으로 파악할 수 있는 데이터로서, 투자기관, 정책기관, 연구기관 등에서 글로벌 자본 흐름 분석과 외환·자본시장 안정성 진단에 활용할 수 있습니다.** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
