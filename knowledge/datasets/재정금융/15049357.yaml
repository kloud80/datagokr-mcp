description_portal: 서울시 세입운용 현황 데이터는 서울시가 특정 회계연도에 어떤 세목을 통해 얼마의 세입을 확보하고 운용했는지 파악하기 위한 재정 통계 자료입니다. 회계연도와 기준일을 통해 시점별 세입 현황을 확인할 수 있으며, 세목코드명으로 지방세, 비세입 등 세입의 구체적인 종류를 구분할 수 있습니다. 전일누계, 당일 수입액, 과오납반환액, 과목경정액, 당일누계 항목을 통해 하루 단위 세입 변동과 누계 추이를 동시에 파악할 수 있어, 세입 징수 실적 분석과 예산 대비 수입관리 평가에 활용 가능합니다. 또한 출력순서를 통해 통계표나 보고서에서 일관된 정렬과 비교가 가능하여, 세입 구조 분석, 세입 전망, 재정 건전성 평가를 위한 기초 자료로 활용될 수 있는 데이터입니다.
