description_portal: '주식배당정보는 법인등록번호 또는 주식발행회사명을 기준으로 배당 관련 주요 정보를 제공하는 데이터입니다. 제공 항목에는 배당기준일자, 현금배당지급일자, 주식교부일자, 주식일반배당금액, 차등배당금액, 배당률, 주식종류(보통주·우선주 등), 배당사유 코드 및 명칭, 명의개서대리인 정보 등이 포함됩니다. 단일 오퍼레이션으로 구성되어 있으며 세부 내용은 다음과 같습니다.① 배당정보조회 : 기준일자, 법인등록번호, 주식발행회사명을 통하여 배당기준일자, 현금배당지급일자, 주식교부일자, 주식일반배당금액, 주식차등배당금액 등을 조회하는 배당정보조회 기능이 데이터를 통해 기업별 배당 정책 및 실행 현황을 시점별로 파악할 수 있으며, 배당정책의 변화, 현금흐름 분석, 투자자 참고자료로 활용할 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
