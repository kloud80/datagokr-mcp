description_portal: 이 데이터는 기술보증기금이 월별로 제공한 보증을 보증의 종류별로 구분하여 건수 기준으로 집계한 현황입니다. 기업의 자금 조달 방식이나 신용보완 수요에 따라 보증의 형태가 달라지며, 본 자료는 이를 네 가지 유형으로 나누어 월별 보증공급 실적을 정리한 것입니다.주요 항목은 다음과 같습니다.**‘연도’**와 **‘월’**은 보증공급이 집계된 기준 시점을 나타냅니다.**‘대출보증(건수)’**은 금융기관을 통한 자금 조달 시, 해당 대출에 대해 기술보증기금이 지급보증을 제공한 건수로, 전체 보증공급의 대부분을 차지합니다.**‘비은행대출보증(건수)’**은 비은행금융기관 또는 기타 대출기관의 당좌대출, 상업어음할인 등 급부성 채무에 대해 제공한 보증건수를 의미합니다.여기서 비은행금융기관이란, 기술보증기금 운영기준인 「기술보증규정」 제3조 제9항에 따라 종합금융회사, 보험회사, 상호저축은행, 농협, 수협을 의미합니다.기타대출기관은 중소벤처기업진흥공단, 한국농수산식품유동공사, 신용가트업자와 할부금융업자, 중소기업창업투자회사, 집합투자업자, 중소기업창업투자조합 및 신기술사업투자조합을 의미합니다.**‘상거래담보보증(건수)’**은 어음, 외상매출채권 등 상거래로 발생한 채권을 담보로 제공되는 보증으로, 매입자금 확보 또는 외상거래의 신용보완 수단으로 활용됩니다.**‘지급보증의 보증(건수)’**은 기업이 제3자에게 제공한 지급보증이나 이행보증에 대해 기술보증기금이 다시 보증을 제공하는 이중보증 형태이며, 상대적으로 고위험 계약에 주로 사용됩니다.이 자료는 기술보증기금이 어떤 형태의 보증 수요에 대응하고 있는지를 파악하는 데 활용할 수 있으며, 자금조달 채널의 다변화, 비은행권 활용 현황, 상거래 기반 신용보완 수요 등을 분석하는 데 유용한 기초자료입니다. 또한 보증정책의 유형별 집중도 및 시장 환경 변화에 따른 보증 구조의 흐름을 진단하는 데에도 참고할 수 있습니다.
