description_portal: 서울시 시민참여예산사업 분야코드 데이터는 참여예산 제안사업을 정책·사업 분야별로 구분하기 위한 기준 정보를 담고 있는 코드표 데이터입니다. 회계년도는 해당 코드가 적용되는 연도를 나타내며, 분야코드는 각 분야를 식별하는 고유 코드값입니다. 분야명은 주민이 이해하기 쉬운 형태로 표현된 분야의 이름으로, 복지, 문화, 도시계획 등과 같이 제안사업이 속하는 정책 영역을 의미합니다. 정렬순서는 화면이나 보고서에서 분야를 나열할 때 사용할 표시 순서를 지정하기 위한 값입니다. 기타플래그는 분야별로 추가적인 속성이나 구분을 표시하기 위한 보조 코드로 활용되며, 비고는 코드에 대한 설명, 변경 사항, 운영상 참고해야 할 사항 등을 자유롭게 기록하는 메모 항목입니다. 이 데이터는 제안사업, 심사결과, 예산집행 데이터와 연계해 분야별 통계와 분석을 수행하는 데 기본 축이 되는 기준 정보입니다.
