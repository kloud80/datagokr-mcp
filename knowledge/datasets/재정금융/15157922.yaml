description_portal: '주택도시기금의 주요 조성 재원 중 하나인 제1종 국민주택채권의 최근 10개년 월별 발행, 상환, 월말 잔액 현황(단위: 억원) 입니다.제1종 국민주택채권은 부동산 등기나 건축허가 등의 사유가 발생할 시 매입의무가 발생하는 첨가소화 채권입니다.주택도시기금은 국민주택채권, 주택청약종합저축 등 다양한 재원으로 조성되며, 조성된 기금은 서민의 주거지원 사업을 위해 활용됩니다.[주택도시기금법 근거]* 해당 데이터는 1회성 데이터로 별도의 갱신주기를 가지지 않습니다.**제2종 국민주택채권은 발행중단(13.5월~), 제3종 국민주택채권은 폐지(06.2월)'
