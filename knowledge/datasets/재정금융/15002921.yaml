description_portal: '신용보증기금은 신용도가 낮은 중소·중견기업의 원활한 자금조달을 지원하기 위해 유동화 회사채(P-CBO)를 발행하고 있으며, 이와 관련된 운용통계 현황을 공공데이터로 제공하고 있습니다. 본 데이터에는 연도별 P-CBO 발행 기업의 업종, 기업규모(중소·중견), 발행용도(예: 차환), 신용평가기관, 신용등급, 발행일, 표면금리 등 주요 항목이 포함되어 있습니다. 이를 통해 발행 기업의 산업 분포와 신용위험 수준, 금리 조건 등을 분석할 수 있으며, 업종별 자금지원 추이, 등급별 발행 특성, 정책금융 지원 효과 측정 등 다양한 분석에 활용될 수 있습니다. 또한 금융시장 참여자와 정책 수립자에게 유동화 지원 현황을 체계적으로 제공함으로써, 시장 기반의 중소기업 지원정책 기획, 신용보강 정책 운영 및 리스크 관리 자료로도 유용하게 쓰일 수 있습니다.'
