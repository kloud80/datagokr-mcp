summary_user: 신용보증기금이 운용하는 SOC보증 대상 민간투자사업의 원장을 사업별로 담은 전국 단위 파일(CSV 약 27KB)로, 원장 ID·시설분류·건설기간 시작·종료 연월·유효기간·신규사업단계 건수를 담는다. 인프라 금융 분석가가 'SOC보증이 붙은 민간투자사업은 어떤 시설 분류에 몰려 있고 건설기간은 언제부터 언제까지인가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 민간투자사업 원장 ID나 시설분류 이름을 기준으로 같은 기관의 SOC보증 자료와만 맞춰 이어 쓴다.
description_portal: 해당 파일은 신용보증기금이 운용하는  SOC보증에 대한 민간투자사업 원장 현황 데이터로, 원장별 건설기간 등의 항목을 제공합니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
