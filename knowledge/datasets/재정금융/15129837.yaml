description_portal: 공사에서 자체 평가한 국가별 신용등급 자료입니다. 국가명, 국가등급 및 등급평가일자 정보로 구성되며, 2006년부터 2026년까지 20여 년 간의 국가별 등급 이력 데이터를 포함합니다. 국가등급은 국가별 신용도의 우열순으로 1~7등급으로 평가하고 있으며, 무역보험에서 담보하고 있는 각종 비상위험의 발생 가능성을 국가별로 조사, 분석하고, OECD 등급 등을 고려하여 평가를 진행하고 있습니다. 비상위험은 수입국에서 수입을 금지하거나 수입 제한 조치를 하거나, 수입국 또는 제3국에서의 전쟁, 내란, 혁명, 폭동, 파업과 같은 비상사태 등 수출입계약 당사자에게 책임 지울 수 없는 사유로 인하여 수출이 불가능하거나 수출대금의 회수가 불가능해지거나 또는 해당국의 환거래 제한, 송금 제한 조치로 인하여 수출한 물품대금의 회수가 불가능할 때 수출자나 금융기관이 손실을 입을 위험을 의미합니다.
