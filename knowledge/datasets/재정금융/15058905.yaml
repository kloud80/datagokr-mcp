description_portal: 중앙정부의 예산운영 실태를 보다 투명하고 체계적으로 파악할 수 있도록 세출예산 편성현황을 연도별로 정리하여 제공합니다. 회계별 세입·세출 결산현황, 부담금 운용현황, 조세수입 및 조세부담율, 국가채권현황, 세입세출 예산편성현황과 함께, 추경편성추이 등의 정보가 포함되어 있어 예산과 재정지표의 흐름을 종합적으로 분석하는 데 활용할 수 있습니다. 특히 본 자료는 정기예산 외에도 추가경정예산(추경)까지 포함하여 편성 내역을 수록함으로써, 예산편성의 변화 양상과 정부의 재정정책 방향을 이해하는 데 유용합니다. 정책 수립, 회계 분석, 재정건전성 평가 등 다양한 행정 및 분석 업무에 참고자료로 활용될 수 있습니다.
