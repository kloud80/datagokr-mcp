summary_user: 2026년 확정 예산을 총예산, 국고보조금 예산, 보조금 외 예산(예비비·기금 등)으로 나눠 조 원 단위 금액과 비중으로 담은 3행짜리 전국 집계표다. 나라 예산 가운데 보조금이 얼마이고 몇 퍼센트를 차지하는지 알고 싶은 국민이나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 예산 자료와는 회계연도와 구분 이름을 맞춰 연결한다.
description_portal: 2026년 총예산과 국고보조금 예산, 보조금 외 예산에 대한 확정 예산액 현황자료입니다.* 총예산은 나라가 1년 동안 쓸 돈의 총액으로 복지, 국방, 교육 등 나라 전체에 쓸 돈의 총합입니다.* 보조금은 특정 목적을 위해 국가가 나누어 주는 지원금으로 지방자치단체, 혹은 국민에게 공공의 이익(취약계층 지원, 친환경차 구매 등)을 위해 특정 사업에 사용하는 지원금입니다.* 보조금 외 예산은 예비비(예상치 못한 상황에 대비하는 금액), 기금(특정 목적을 위해 계속해서 쌓아두고 관리하는 금액) 등을 포함한 예산액입니다.*모든 통계는 합계 또는 소계가 반올림되었으므로 세부 항목의 합계가 총계와 일치하지 않는 경우가 있습니다.*각 통계표의 계수 단위는 기본적으로 ‘조 원" 단위이며 소수점 첫째자리까지만 표시했습니다.* 정부 조직개편, 재정사업 분류체계 개편 등으로 인해, 소관, 분야, 부문, 프로그램별 시계열 자료 해석 시 유의할 필요가 있습니다.
