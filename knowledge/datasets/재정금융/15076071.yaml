description_portal: 세입 예산편성현황(추경포함)은 중앙행정기관의 세입 예산 현황을 집계·제공하는 재정 통계 자료로, 본예산뿐 아니라 추가경정예산(추경) 결과가 반영된 최신 데이터를 포함하고 있습니다.(부처별, 회계별, 세입 항목별 예산 편성 현황 등 내역을 확인할 수 있도록 구성되어 있습니다.)추가경정예산(추경)은 이미 확정된 본예산으로 충당하기 어려운 새로운 세입·세출 수요나 경기 대응, 재난·재해 등 긴급 상황 발생 시 수립되며, 세입 측면에서도 국세 수입 변화, 경상수입 변동 등을 반영하기 위해 편성됩니다.[데이터 주요 항목 및 특징]1. 데이터 범위   * 중앙행정기관의 세입 예산 편성 현황   * 부처명, 회계명, 세입 항목명, 본예산액 등 포함2. 추경 반영 현황   * 본예산 대비 추경으로 인한 증액·감액 내역 확인 가능3. 세입 항목   * 국세수입(소득세, 법인세, 부가가치세 등)   * 세외수입(사용료, 수수료, 재산수입, 경상이전수입 등)   * 기금수입 및 기타수입4. 활용 예시   * 정부 세입 구조 분석 및 재정건전성 평가   * 경기 변동에 따른 세입 증감 추이 파악   * 특정 세목의 추경 반영 여부 분석   * 세입 전망 및 재정운용 전략 수립 자료로 활용5. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 파일형식으로 다운로드 가능   * Open API를 통해 연도, 부처, 세입 항목 등 조건별 상세 조회 지원본 자료는 정부의 세입구조와 추경 변동 내역을 투명하게 공개하여 국민의 알권리 충족은 물론, 연구기관·언론·일반 국민이 재정 분석, 세입 예측, 재정정책 수립 등에 폭넓게 활용할 수 있는 중요한 재정정보입니다.
