description_portal: 신용보증기금의 「PC-OFF 잠정조치누락내역」은 임직원의 근무시간 외 PC 사용 기록 중, 시간외근무로 인정되지 않은 사례를 집계한 자료입니다. PC-OFF 제도는 정규 근무시간 이후 자동으로 PC 전원을 차단하거나 경고함으로써 초과근무를 제한하는 제도이며, 이 데이터는 시스템상 감지된 초과근무 이력 중 담당 부서 또는 사용자에 의해 정당한 사유로 처리되지 않은 ‘잠정조치 누락’ 건들을 포함합니다. 이를 통해 시간외근무 승인 절차의 누락 여부, 제도 운영의 사각지대, 조직 내 근무문화 개선 필요성 등을 파악할 수 있습니다. 해당 데이터는 공공데이터로 개방되어 있어, 근무시간 관리 정책 수립이나 내부통제 분석에 활용 가능합니다.
