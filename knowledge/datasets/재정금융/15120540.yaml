description_portal: '1. 데이터 개요각 파산재단 등을 통해 예금보험공사가 받은 파산배당금에 대한 연도별, 계정별(특별계정, 고유계정, 상환기금) 파산배당 통계 자료2. 데이터 항목기간 구분 : 파산배당금액 집계를 위한 기준연도특별계정 : 특별계정 재원을 통해 배당받은 파산배당금액, (단위 : 억원)고유계정 : 고유계정 재원을 통해 배당받은 파산배당금액, (단위 : 억원)상환기금 : 상환기금 재원을 통해 배당받은 파산배당금액, (단위 : 억원)3. 데이터 주석파산재단 : 「채무자회생 및 파산에 관한 법률」에 따라 법원의 파산선고와 동시에 채무자가 보유한 국내외 모든 자산으로 파산재단이 구성되며, 「공적자금관리특별법」에 의거 공적자금이 투입된 금융회사의 파산관재인으로 예금보험공사 또는 그 임직원이 선임되어 직접 파산재단을 관리하고 있음.고유계정 : 부보금융회사 파산 시 예금 등 대지급을 위한 보험료 수납계정특별계정 : 2011년 1월 이후 발생한 상호저축은행 보험사고에 따른 부실을 정리하기 위하여 예금보험기금에 만들어진 계정예금보험기금 : 금융기관이 예금을 상환할 수 없는 사태가 발생하였을 때, 예금자의 손실을 보전하기 위해 마련된 기금으로 고유계정과 특별계정으로 구성됨상환기금 : IMF 외환위기 당시 금융구조조정을 위해 지출된 공적자금의 상환을 위해 운영되는 기금'
