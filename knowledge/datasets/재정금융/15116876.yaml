description_portal: KOTRA에서 공공 데이터 포털에 개방하고 있는 국가 목록 Open api는 KOTRA 해외 경제 정보 드림 플랫폼에서 수집한 국가와 지역에 관한 정보를 제공하는 공공 데이터 입니다. 각 해외무역관에서  해당 국가의 GDP, 인구 등 경제 지표와 같은 기초 통계, 수출 유망 품목 정보,  대한 수입 규제 현황 등을 정리한 내용을 KOTRA 해외 경제 정보 드림 플랫폼에 제공 중에 있습니다. 사용자들은 이 Open api를 타 통계 자료 api와 연동하여 새로운 서비스를 제공할 수 있습니다. 그 밖에도 대시보드 및 내부 시스템와 연계하여, ERP, CRM, BI 도구에서 국가 단위 메타정보를 활용할 수 있습니다.
