summary_user: KOTRA 해외 경제 정보 드림 플랫폼이 다루는 국가 목록을 국가 한 건당 한 행으로 담으며, 각 행은 한글 국가명, 영문 국가명, 2자리 국가코드(isoWd2NatCd)로 이뤄진다. 분석가나 개발자가 "KOTRA가 정보를 제공하는 국가는 어디이고, 각 국가의 표준 코드는 무엇인가"를 확인할 때 쓰며, 대시보드·ERP·CRM에서 국가 기준표로도 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 무역 통계나 KOTRA 국가정보와는 국가명이나 2자리 국가코드를 매핑하는 방식으로 이어 쓴다.
limits: 이 목록에는 국가명과 코드만 있고, 포털 설명에 나오는 GDP·인구 같은 경제지표, 수출 유망 품목, 수입 규제 현황은 들어 있지 않다. 공통 조인 키가 없어 다른 데이터와 연결하려면 국가명이나 코드를 직접 대응시켜야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
