description_portal: 경상북도 시군단위지역내총생산1인당생산액 자료는 경상북도 관할 각 시·군별로 지역의 경제활동 규모를 인구수로 나누어 산출한 1인당 생산 수준을 정리한 통계 자료이다. 본 자료는 2022년을 기준으로 포항시, 경주시, 김천시, 안동시, 구미시 등 도내 23개 시·군을 대상으로 시군명, 시군코드, 기준년도, 단위, 산출값 항목으로 구성되어 있으며, 지역 간 경제 여건과 주민 1인당 경제적 성과의 상대적 차이를 비교·분석하는 데 활용할 수 있다. 특히 인구 규모 차이에 따른 왜곡을 보정한 지표이므로 단순 총량 비교가 아닌 지역별 생활 수준 및 산업 구조의 특성을 간접적으로 파악하는 데 유용하며, 중장기 지역 발전 전략 수립, 재정 정책 검토, 산업 육성 방향 설정을 위한 기초 참고 자료로 활용할 수 있다. 자료 관련 문의는 054-880-2564로 문의하시기 바랍니다.
