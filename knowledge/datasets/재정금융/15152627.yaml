description_portal: '외국인직접투자 유치를 희망하는 국내 기업이 각 기업의 제품을 홍보하기 위해 직접 등록한 데이터 입니다. (등록일자, 제품명, 홍보파일수, 제품 URL, 제품소개글, 제품키워드, 제품관련파일수) 로 구성되어 있습니다. 각 항목병 상세 설명으로는, - 등록일자 : 기업이 제품을 직접 등록한 일자입니다. - 제품명 : 기업의 선택에 따라 국/영문으로 홍보제품의 명칭이 작성되어 있습니다. - 홍보파일수 : 홍보 브로슈어, 로고, 사진 등 전반적 기업 및 제품 홍보를 위해 업로드 한 자료의 수 입니다. - 제품 소개페이지 바로가기 링크 : 제품을 소개하는 홈페이지 및 유튜브 영상의 바로가기 링크입니다. 기업의 선택에 따라 업로드를 하지 않은 경우 공란입니다. - 제품소개글 : 기업의 선택에 따라 국/영문으로 제품에 대한 소개 글이 작성되어 있습니다.- 제품 키워드 : 제품을 설명하는 내용으로 키워드를 추출하여 작성한 내용 입니다. 기업의 선택에 따라 국/영문으로 작성되었습니다. - 제품관련 파일수 : 전반적 홍보보다 좀 더 자세하게 제품과 관련된 내용으로 업로드 한 자료의 수 입니다.'
