description_portal: 대전광역시 지역 화폐 사용 및 상위 5순위 업종 현황 자료는 대전 지역 화폐인 ‘온통대전’의 2021년 1월부터 12월까지 월 별 사용 금액과 해당 기간 동안 가장 많이 사용된 상위 5개 업종의 사용 현황을 포함하는 자료입니다. 이를 통해 각 월 별 업종별 소비 규모와 소비자의 지출 경향을 파악할 수 있으며, 지역 내 소상공인 지원 효과, 소비 유도 정책의 실효성 검증 및 지역 경제 순환 구조 진단에 활용됩니다. 특히 월 별 소비 패턴과 업종별 수요 변화 분석을 통해 계절별·정책별 소비 동향을 비교할 수 있으며, 지역 화폐 운영 모니터링, 전략적 예산 편성, 상권 활성화 지원 계획 수립 등과 같은 행정적 자료로도 유용합니다. 본 자료는 2022년 공공데이터 기업매칭지원사업으로 수행되었습니다.
