summary_user: 은행별 기술신용대출 실적을 담은 집계 파일로, 은행 구분과 은행명별로 기술보증기금 보증·온렌딩·은행 자율 유형의 건수와 금액(억원), 그 합계를 담는다(약 1KB 규모의 작은 CSV). 정책 분석가나 금융 연구자가 '어느 은행이 기술신용대출을 어떤 방식으로 얼마나 취급했나'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 금융회사 데이터와는 은행명을 직접 맞춰 이어 써야 한다.
description_portal: 한국산업은행에서 제공하는 금융기관 대출실적 데이터로, 특수/시중/지방은행의 월별 기술신용대출 실적 자료를 제공합니다.  기술신용대출은 기술력이 우수하지만 재무 상태나 신용등급이 낮은 벤처 및 중소기업이 대출을 받을 수 있도록 2014년 도입된 제도입니다. 은행은 기술평가기관이 발급한 평가서 및 기타 요건을 고려하여 대출 금리 및 한도를 책정하게 됩니다. 이 데이터에서는 한국산업은행의 기술신용대출 실적 자료를 제공함으로써 한국산업은행의 기술신용대출 취급 동향 및 규모 등을 파악할 수 있는 유용한 데이터입니다.
