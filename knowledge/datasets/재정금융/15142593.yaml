description_portal: 사업장현황신고란?부가가치세가 면세되는 개인사업자는 직전년도 연간 수입금액 및 사업장현황을 사업장 관할세무서에 신고하여야 함사업장현황신고 대상자병·의원, 치과, 한의원 등 의료업자예체능계열 학원, 입시학원, 외국어학원 등 학원사업자법정도매시장 중도매인 등 농·축·수산물 도·소매업자가수·모델·배우 등 연예인대부업자, 주택임대사업자, 주택(국민주택규모 이하)신축판매업자기타 부가가치세가 면제되는 재화 또는 용역을 공급하는 모든 사업자사업장현황신고 제외자부가가치세 면세사업자 중 소규모 영세사업자 등 아래의 경우에는 납세편의 등을 위하여 사업장현황 신고대상에서 제외하고 있음납세조합에 가입해 수입금액을 신고한 자독립된 자격으로 보험가입자의 모집 및 이에 부수되는 용역을 제공하고 그 실적에 따라 모집수당 등을 받는 자독립된 자격으로 일반 소비자를 대상으로 사업장을 개설하지 않고 음료품을 배달하는 계약배달 판매 용역을 제공하고 판매실적에 따라 판매수당 등을 받는 자1. 해당연도 귀속 부가가치세 면세사업자 수입금액(부가가치세 과·면세겸업자의 면세수입금액 포함) 신고를 기준으로 함2. 사업장 단위로 계산한 것이므로, 1인당 수입금액과 일치하지 않음3. 2011.7.1. 이후 부가가치세 과세전환된 미용목적 성형수술, 수의사 애완동물 진료용역 등의  매출금액은 제외된 금액임4. 교육서비스업은 2014년 귀속부터 분류항목을 보다 명확하게 재 분류한 신고건수와 금액임
