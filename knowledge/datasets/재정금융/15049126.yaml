description_portal: 서울시 시민참여예산교육 수강자 출석관리 정보는 연도와 차수별로 운영되는 교육과정에 대해 개인별 출석 현황을 관리하기 위한 기본 데이터입니다. 순번은 출석 기록을 고유하게 식별하기 위한 내부 관리용 번호로, 동일한 수강자에 대해 여러 일차의 출석 데이터가 생성되더라도 각 기록을 명확히 구분할 수 있게 합니다. 연도와 차수는 어떤 해, 몇 번째로 진행된 교육 과정에 대한 출석인지 구분해 교육 운영의 시기별 참여 양상을 분석하는 근거가 됩니다. 일차 정보는 1일차, 2일차 등 교육이 며칠 차에 진행된 회차인지를 나타내어, 하루 단위 출석률, 특정 일자에 결석이 집중되는지 여부 등을 살펴볼 수 있는 중요한 지표입니다. 분반번호는 동일한 교육 과정이 여러 분반으로 나뉘어 운영될 때 각 분반을 구분하기 위한 값으로, 분반별 인원 분산, 시간·장소별 출석 특성 등을 분석하는 데 활용됩니다. 교육신청 식별값은 교육 신청 정보가 담긴 별도의 테이블과 연결되는 키로, 실제 신청자 정보, 교육 이수 여부, 사전·사후 설문 결과 등의 데이터와 출석 정보를 연계해 수강자의 참여 행태를 종합적으로 분석할 수 있게 합니다. 이 출석관리 데이터는 단순히 수강 여부를 확인하는 수준을 넘어, 교육 이수 기준 충족 여부 판단, 교육 효과성 분석, 무단 결석·중도 탈락 현황 파악, 향후 교육 일정·운영 방식 개선 등 시민참여예산교육의 품질 관리와 참여 확대 전략 수립에 중요한 기초 자료로 활용될 수 있습니다.
