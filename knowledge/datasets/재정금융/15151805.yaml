summary_user: 전국 공항만 세관에 신고된 입항 적재화물목록을 바탕으로 월(yyyymm)·입항지(항구/공항)·선적지 국가별 B/L 건수, 총중량, 컨테이너 수량(FCL·LCL·빈 컨테이너, TEU 기준)을 담은 월별 집계 자료다. 물류·해운 분석가나 항만 관련 사업자가 특정 국가에서 어느 항구로 들어오는 화물량이 월별로 어떻게 바뀌는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 관세청 수출입 실적과는 국가명·입항지명을 이름으로 맞춰 연결해야 한다.
description_portal: 세관에 신고하는 입항 적재화물목록을 기초로 수집한 BL건수, 컨테이너 수량 등 물동량 자료를 제공. 통계제공 기준일은 입항일이며, 입항 적재화물목록상 선적지 국가를 기준으로 한 전국 공항만 세관별 물동량 자료임. 공표 주기는 1개월 단위이며 매월 15일경 입항 적재화물목록의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화하여 제공. 세관은 적재화물목록이 접수되는 전국 공항만 세관을 기준으로 하되, 부산세관은 부산신항/부산북항(감천항 포함)/부산세관(신항＋북항)으로 구분하여 집계됨. 입항화물은 수입(I), 환적(T) 화물로 구분 가능하며, 운송은 해상(10), 항공(40)으로 구분 가능함. BL건수는 최소단위 BL(Bill of Lading) 기준으로 집계되며 House BL이 있는 경우 House BL, 없는 경우 Master BL건수임. 중량은 총중량이며, 컨테이너 수량은 20피트 컨테이너 기준 1TEU임.
