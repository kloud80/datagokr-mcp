description_portal: 2022년 기준 국고채 발행 추이 데이터입니다.바이백은 조기상황은 의미합니다.상환=만기상환+조기상환+교환을 나타냅니다.국고채 잔액은 전년잔약+국고채발행-상환을 나타냅니다.2021년 국채발행량은 229.8조원이며, 이중 국고채 발행량은 180.5조원(78.6%)입니다.2021년 국고채 발행량 180.5조원 중 상환규모 63.6조원을 제외한 순증규모는 116.9조원입니다. 상환기간별로는 2,3,5년물이 44.8%, 10년물 이상이 55.2%입니다.*본 재정통계 BRIEF 데이터는 공공데이터포털(www.data.go.kr)에서 오픈 포맷 데이터로 제공되고 있습니다.<경로> 공공데이터포털 > 데이터찾기 > 데이터목록 > 재정통계BRIEF
