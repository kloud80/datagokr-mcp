description_portal: 경기도 이천시의 지방세 중 비과세 및 감면 현황을 정리한 데이터입니다. 항목은 과세연도, 세목명, 비과세금액, 감면금액, 부과금액, 비과세감면율 등으로 구성되어 있으며, 특정 세목별로 실제 과세되지 않은 금액의 규모와 비율을 확인할 수 있습니다. 본 데이터는 세입 추계, 감면정책 효과 분석, 지방세 부과율 점검, 조세형평성 진단, 재정운영 전략 수립 등에 활용됩니다. 특히 감면율은 정책 목적에 따른 감면 효과를 수치로 비교하거나, 세목 간 감면 집중도 분석에 활용될 수 있는 핵심 지표입니다. 또한 이 데이터는 감면 유형별 정책 수용성과 세제지원 실효성을 분석하는 데에도 활용되며, 예산 손실 최소화를 위한 제도 개선 방향 수립에도 기초자료로 제공됩니다.
