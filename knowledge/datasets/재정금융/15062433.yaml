description_portal: 이 데이터는 기술보증기금을 통해 이루어진 기술거래 처리 현황을 나타내며, 기술보증기금의 수요발굴을 통해 거래된 기술건수에 대한 데이터입니다.  공급기술 공급자의 기관유형에 따른 월별 거래 건수를 제공합니다. 기준년월은 해당 실적이 집계된 연도와 월을 의미하며, 연구소, 대학, 지원기관 항목은 각각 해당 유형의 기관이 공급기술의 공급자인 경우의 기술거래 건수를 의미합니다. 이를 통해 기술거래에서 공급기술 제공 기관의 유형별 분포를 확인하고, 기관유형별 기술공급 현황을 비교·분석하는 기초자료로 활용할 수 있습니다.
