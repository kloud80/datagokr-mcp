description_portal: 전북특별자치도 고창군 지역화폐 발행 및 이용현황 공공데이터는 고창군에서 발행한 지역화폐(고창사랑 상품권)의 월별 발행 및 이용 현황을 제공합니다. 이 데이터에는 발행액, 결제 건수 등의 정보가 포함되며, 지역 내 경제 활성화 및 소비 패턴 분석에 활용할 수 있습니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다. 또한, 오픈 API를 통해 JSON/XML 형식으로 활용할 수도 있습니다. 해당 데이터는 고창군 신활력경제정책관에서 관리하며, 수시로 업데이트됩니다. 특히, 지역화폐의 발행 규모와 사용 패턴을 분석하여 소상공인 지원 및 지역 경제 정책 수립에 활용할 수 있습니다. 보다 자세한 내용은 전북특별자치도 빅데이터 허브에서 확인할 수 있습니다.
