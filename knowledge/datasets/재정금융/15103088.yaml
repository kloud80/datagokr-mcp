description_portal: '한국수력원자력(주)의 2025.12.31 기준 통화스왑 구성내역입니다.통화스왑이란 다른통화간에 이자와 원금을 주고받는 파생상품을 말하며 당사에서는  보유중인 자산, 부채의 환율변동과 금리변동의 리스크를 헷지하기위하여 통화스왑계약을 진행하고 있습니다. 1. 계약처: 통화스왑 계약을 체결한 거래 상대 금융기관을 의미합니다. 2. 계약시작일:  통화스왑계약이 발효되어 이자계산이 시작되는 날을 의미합니다. 3. 계약금액(매도금액) : 당사가 향후에 계약상대방(계약처)에게 지급해야할 원금 금액을 의미합니다. 4. 계약금액(매입금액) : 당사가 향후에 계약상대방(계약처)에게 수령해야할 원금 금액을 의미합니다. 5. 계약이자율(매도) : 당사가 향후에 계약상대방(계약처)에게 지급해야할 이자 금액을 의미합니다.6. 계약이자율(매입) : 당사가 향후에 계약상대방(계약처)에게 수령해야할 이자 금액을 의미합니다. 7. 계약환율 : 계약당시 통화가 다른 원금 및 이자를 교환하기위해 설정된 환율을 의미합니다. 8. 변동금리라고 명기된 통화스왑 계약은 USD 지불 금액이 SOFR+ 가산금리로 계산되어 가산금리  숫자를 명기(원화금리는 고정)하였으니 확인 바랍니다.(*외화단위 : 천USD, 천HKD, 천CHF, 원화 단위 : 백만원, 계약이자율 : 퍼센트(%), 계약환율 : 원/USD, 원/HKD, 원/CHF)'
