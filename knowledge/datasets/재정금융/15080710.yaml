description_portal: '2013년부터 2022년 까지 내국세, 국세수입 등을 포함한 국세수입 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.국세수입: 국세는 과세 권한을 가진 중앙정부가 세목별 세법에 근거하여 부과·징수하는 세금이며, 이로 인한 수입을 의미내국세: 넓은 의미로는 국경 내의 물건에 부과되는 세금을 뜻하며, 좁은 의미로는 국세 주요 세목 9개를 총칭조세부담률: 국내총생산(GDP)에서 조세(국세+지방세)가 차지하는 정도를 나타내는 지표재산과세: 재산의 소유사실이나 이전사실 또는 재산 그 자체에 대한 세금소비과세: 부가가치세 및 판매세를 합산한 세금'
