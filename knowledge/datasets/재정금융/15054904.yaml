description_portal: 2025년 6월 13일 기준, 「대부업 등의 등록 및 금융이용자 보호에 관한 법률」에 따라 등록된 대부업체 현황입니다. 시군구명, 업체명, 도로명 주소, 유효기간 만료일, 등록 사업 유형, 데이터 기준일 등의 정보를 포함하고 있습니다. 대부업이란 타인에게 금전을 빌려주고 그에 대한 이자를 받는 행위를 영리 목적으로 수행하는 사업을 말합니다. 이에는 단순히 자금을 대출하는 것뿐만 아니라, 여신금융기관이나 다른 대부업자로부터 대부계약에 따른 채권을 양도받아 이를 추심하는 행위도 포함됩니다. 즉, 대부업자는 직접 채권을 생성하거나 제3자로부터 인수한 채권을 회수하는 방식으로 수익을 창출합니다. 이러한 업무는 일정한 요건을 갖추어 등록한 자만이 수행할 수 있으며, 법령에 따라 이자율, 추심 방식, 이용자 보호 등의 사항이 엄격히 규제됩니다.
