description_portal: 본 데이터는 포천도시공사에서 구매한 중소기업 제품의 구매실적을 집계하여 제공하는 자료입니다. 월별로 중소기업 제품 구매총액을 정리하여 공사의 구매 현황과 예산 집행 흐름을 한눈에 확인할 수 있도록 구성하였습니다. 이를 통해 공공기관의 중소기업 제품 우선구매 정책 이행 현황을 투명하게 공개하고, 지역 및 중소기업 지원을 위한 공사의 노력을 시민과 공유하고자 합니다. 본 자료는 회계 처리 및 집계 일정에 따라 월별 업데이트가 이루어지며, 내부 정산 절차로 인해 일부 기간의 데이터 공개가 다소 지연될 수 있습니다. 해당 정보는 공공데이터로 활용 가능하도록 지속적으로 관리·제공됩니다.
