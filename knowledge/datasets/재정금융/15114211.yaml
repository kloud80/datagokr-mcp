description_portal: '- 2025년 12월말 기준 처리기관별(6개 지방청별), 지역별 권리보호요청 처리 실적- 해당연도 처리건수 기준으로 작성- 권리보호란 세무관서장의 처분이 완료되기 전 사항으로서 세무조사 등 국세행정 집행과정에서 납세자의 권리가 부당하게 침해 되고 있거나 권리 침해가 예상되는 경우 납세자가 관할 세무서의 납세자보호담당관에게 권리의 구제를 요청하는 제도- 세무조사에 대한 권리보호 요청과  세무조사 이외 일반 국세행정에 대한 권리보호요청으로 구분- 세무조사는 국민들에게 큰 관심을 받는 주제로, 조사범위, 권리침해, 권리보호 등이 중요한 키워드임먼저, 조사범위는 양도소득세에서 자금출처나 취득계약서와 관련이 있습니다. 조사가 진행되면 과세예고통지도 따라오게 됨.조사범위는 임의로 확대할 수 없으며, 무분별하게 넓히게 되면 시정명령의 대상이 됨취득계약서나 자금출처 등은 조사 진행 시점에 이미 조사대상이어야 함. 또한, 과세예고통지는 고지세액이 1백만원 이상이라는 조건이 있음납세자의 권리침해에 대한 구제제도- 세무조사 결과를 통지받지 못하거나 장기간의 예금압류로 권리가 침해된 경우, 국선대리인의 지원을 받을 수 있음세무조사 결과에 대한 미통지는 동일 사업연도에서의 중복조사나 과세예고통지가 없었던 세금고지와 함께, 납세자의 권리를 절차적으로 침해하는 경우에 해당함.이런 경우에는 "국선대리인지원"이라는 제도를 활용할 수 있는데, 이는 청구세액 기준으로 1천만 원 이하의 금액으로 이의신청을 하는 개인(보유재산 5억 이하, 종합소득금액 5천만 이하)을 대상으로 함.'
