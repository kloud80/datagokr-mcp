summary_user: 관세청 수출입 신고 자료를 APEC·ASEAN·EU·OECD 등 경제권 단위로 묶어 기간별 수출·수입 금액(달러)과 건수, 무역수지를 담은 전국 집계 통계다. 분석가나 수출기업이 'ASEAN이나 EU 상대 수출입이 기간에 따라 어떻게 달라졌고 무역수지는 흑자인가 적자인가'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙는 전역 조인 키가 없어서, 경제권 코드(statCd)·경제권명과 기간을 기준으로 같은 관세청의 국가별·품목별 수출입실적과 이름 매핑으로 맞춰 쓴다.
description_portal: 통관업무처리 절차를 기초로 수집한 무역자료를 경제권 기준으로 집계한 시도별 품목별 수출입무역통계입니다. 집계한 수출입무역통계입니다. 경제권은 국제적으로 특정 경제권에 속하는 국가들을 APEC, ASEAN, CIS, ETA, EU, EU28, GCC, MERCOSUR, NAFTA, OECD, 동구권, 동남아, 아셈으로 분류하였으며 각 경제권에 속하는 나라들은 수출입무역통계 홈페이지를 통해 확인 할 수 있습니다.수출입무역통계란 사전적 의미로 국민경제가 다른 나라와의 사이에서 행하는 화물의 교류에 관한 통계로 일국의 경제영역으로 반입(수입)되거나 반출(수출)됨으로써 그 나라의 물적 자원을 증가 또는 감소시키는 모든 상품이 기록되며, 단순히 한 나라를 통과하는 물품(통과물품)이나 일시적으로 반입 또는 반출되는 물품은 그 나라의 물적 자원량을 증가시키거나 감소시키지 않기 때문에 무역통계에 포함되지 않습니다. 작성할 때의 기준이 되는 무역통계지역은 지리적·행정적·국민 경제적 관점에서 정해지며, 우리나라를 포함한 대부분 국가의 경우 관세법이 포괄적으로 적용되는 영역을 의미하는 관세영역과 무역통계지역은 개념적으로 일치합니다. 따라서 관세영역을 넘어서 행해지는 화물의 교류 통계가 무역통계라 할 수 있습니다. 우리나라는 수입은 CIF금액기준으로, 수출은 FOB 금액기준으로 집계합니다. 매월 15일경 수출입 신고의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화하고 있으며 주기는 1개월입니다. 중량은 순중량(kg)이며, 금액은 수입(과세가격미화금액), 수출(신고미화금액) 기준입니다.
