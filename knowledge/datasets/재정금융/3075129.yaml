description_portal: '본 자료는 국내 주요 은행의 경영 건전성과 재무 성과를 심층적으로 분석하기 위해 수집된 종합 통계 데이터 입니다. 해당 파일에는 각 은행의 자산 및 자본 구성 현황은 물론, 기업의 전반적인 재무 건전성을 한눈에 파악할 수 있는 요약재무상태표가 상세히 수록 되어있습니다. 특히 금융시장의 리스크 관리 능력을 평가하는 핵심 지표인 담보별 여신현황 자료를 포함하고 있어 부동산, 동산, 보증서 등 담보 유형에 따른 대출 구조를 파악 할 수 있습니다.해당 데이터는 은행별 자본 적정성과 유동성 확보 수준을 비교 분석하는데 필수적이며, 각 금융기관이 직면한 잠재적 위험 요소과 수익 구조의 변화추이를 진단하는 기초 자료로 활용이 가능합니다. *자료 목록 : 은행별 자산/자본, 요약재무상태표, 담보별 여신현황, 은행별 유가증권 보유현황, 손익계산서, 연결 재무상태표 등'
