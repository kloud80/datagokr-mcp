description_portal: 본 데이터셋은 신용보증기금이 중소기업의 자금 유동성을 지원하기 위해 수행하는 "매출채권 팩토링" 사업의 신청 및 접수 단계에서 수집된 핵심 원천 데이터입니다. 팩토링은 기업의 외상 매출채권을 신보가 매입하여 즉시 현금화해주는 금융 서비스로, 이 데이터는 기업 간 상거래 신용 흐름을 파악하는 데 중요한 가치를 지닙니다.주요 개방 데이터는 팩토링 승인 및 거절 사유를 분석할 수 있는 [매출채권 등록 취소 심사], 신청 기업의 신용 리스크를 판단하는 "부실징후 정보", 고객과의 접점 이력을 담은 "상담 관계" 내역을 포함합니다. 또한, 실제 거래 관계를 입증하는 "전자세금계산서 정보"와 개별 채권의 연결성을 보여주는 "매출채권 관계" 데이터까지 상세히 제공합니다.이 데이터는 핀테크 기업의 대안 신용평가 모델(ACSS) 고도화, 학계의 공급망 금융(Supply Chain Finance) 연구, 그리고 정책 기관의 중소기업 자금 조달 현황 분석을 위한 기초 자료로 활용도가 매우 높습니다. 이번 데이터 개방을 통해 매출채권 시장의 정보 비대칭을 해소하고, 데이터 기반의 디지털 금융 혁신 및 민간 서비스 창출에 기여할 것으로 기대됩니다.
