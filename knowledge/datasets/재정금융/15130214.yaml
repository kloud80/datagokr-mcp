description_portal: 이 데이터는 기술보증기금이 연도별로 수행한 주요 기술보증 종류별 지원 실적을 담고 있으며, 보증 건수와 금액을 기준으로 세부 유형별 지원 현황을 제공합니다. 주요 컬럼에는 다음과 같은 보증 항목이 포함되어 있습니다. ‘기술보증’은 기술력은 있지만 담보력이 부족한 중소기업을 위한 일반 기술신용보증‘기술창업보증’은 기술 기반 창업 초기 기업의 자금 조달을 지원하는 보증 ‘혁신성장산업보증’은 4차 산업혁명, 스마트공장 등 성장 잠재력이 높은 신산업 분야 기업에 대해 집중적으로 지원하는 보증‘수출중소기업보증’은 수출 실적이 있거나 수출을 준비 중인 중소기업이 글로벌 시장에 진출할 수 있도록 자금 조달을 지원하는 보증 마지막으로 ‘청년창업기업보증’은 청년(만 39세 이하)이 창업한 기업을 대상으로 기술력과 성장 가능성을 평가하여 초기 경영 안정을 위해 지원하는 보증입니다. 이 데이터는 기술보증기금의 보증 전략 변화, 산업별 정책 성과 분석, 기술금융 흐름 이해 등에 활용할 수 있습니다.
