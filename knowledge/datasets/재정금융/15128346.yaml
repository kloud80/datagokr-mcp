description_portal: '착오송금 반환지원 금액구간별 평균 지급률 공공데이터는, 실수로 잘못 송금한 돈에 대해 예금보험공사가 지원한 반환 사례들을 착오송금액 대비 반환금액을 구간별로 나눠 분석한 정보입니다.이 데이터는 다음과 같은 내용을 포함합니다:금액 구간: 예를 들어 5만원이상 10만원이하 , 10만원초과 20만 원이하  등 8단계로 구분.("25년부터는 1억원 이상도 집계할 예정)자진반환 누적 평균 지급률 : 자진반환 단계에서 반환받은 신청인이 부담하는 착오송금액 대비 평균 비용 비율법적절차 누적 평균 지급률 : 법적절차 단계에서 반환받은 신청인이 부담하는 착오송금액 대비 평균 비용 비율전체 누적 평균 지급률 : 제도를 통해 반환받은 전체 신청인이 부담하는 착오송금액 대비 평균 비용 비율이 데이터는 국민들이 착오송금 발생 시 금액대별로 반환 가능성을 예측하고, 제도 이용에 참고할 수 있도록 제공됩니다. 또한 금융기관이나 정책 입안자들이 제도 개선에 활용할 수 있습니다.'
