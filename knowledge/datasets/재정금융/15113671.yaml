description_portal: '예산이란 정부가 1년 동안 사용할 돈을 미리 계획한 것으로, 수입(세입)과 지출(세출)을 모두 포함세수란 예산 수입의 상당 부분을 차지하는 것으로, 세금(국세, 지방세)을 통해 거두어들이는 수입불납결손액은 세금이나 공과금 등 징수해야 할 채권에 대해 면제, 시효 완성, 강제징수 종료 등 징수가 불가능한 사유가 발생하여 징수관이 "결손 처분"을 한 금액을 의미함해당연도 각 세목별 예산액, 수납액, 불납결손액 현황.1)추가경정예산을 반영한 수치.2)자진납부세액에 고지결정세액을 합한 금액에서 환급결정금액을 차감.3)국세청 공공데이터 "국세청_소관_세수_현황"과  일치.※ 단위: 백만원'
