description_portal: '○ 통계개요* 통계명 : 금융기관(동별)* 통계종류 : 서울시 금융기관의 각 자치구 동별 점포 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 전국은행연합회에 등록된 금융기관의 점포 현황을 파악하여, 개인 및 기업에대한 효율적인 금융서비스 제공과 금융산업의 발전을 위한 정책 마련의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 전국은행연합회* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 각 자치구 동별 금융기관(한국은행ㆍ시중은행ㆍ지방은행ㆍ특수은행ㆍ기타) 점포 현황○ 용어설명* 시중은행 : 대도시에 본점을 두고 전국적인 지점망으로 거액의 자금량을 보유하는 은행* 지방은행 : 영업기반이 지방적인 은행. 시중은행에 상대해서 쓰이며 실제로는 은행법에따라 설립된 일반은행 중 시중은행 이외의 은행이 이에 속함* 특수은행 : 은행법 이외의 특별한 법령에 따라 설립된 은행. 특별은행이라고도 하며은행을 설립근거법에 따라 구분한 것으로 일반은행과 대비됨'
