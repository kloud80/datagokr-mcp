description_portal: '- 2023년 4분기 기준 주택도시보증공사의 P-CBO매입현황으로, 건설사 14차, 시장안정 22차 내역을 포함하고 있습니다.- P-CBO 채권이란,  여러 중소기업들이 발행한 회사채를 한데 묶어서 만든 종합 채권 상품을 다시 투자자에게 등급별로 쪼개서 판매하는 구조의 금융상품입니다. 이는 신용보증기금과 같은 공공기관에서 일부 신용보증을 하고, 여러 각 중소기업의 회사채를 묶어 판매하기 때문에 분산투자 효과도 가지고 있어 투자 유치가 어려운 중소기업에 안정적인 투자 유치가 가능합니다.- 현재 업데이트가 중단된 공공데이터입니다.'
