description_portal: 지방세 납부매체별 현황 분석은 신용카드, 가상계좌, 지로, 신용카드 포인트 등 다양한 결제 수단을 통해 이루어지는 납부 건수와 금액 데이터를 수집하는 것에서 출발합니다. 이를 기반으로 각 매체별 사용 비중과 트렌드를 파악하여, 전자송달 시장의 규모를 객관적으로 산정할 수 있습니다. 또한, 전자송달 도입으로 인한 비용 절감 및 편의성 증대 등 사회·경제적 편익도 함께 분석하여, 전자송달 서비스 수수료 산정 시 기초자료로 활용할 수 있습니다. 이러한 분석은 지방세 납부 과정의 효율성 제고와 사용자 만족도 향상에도 기여할 수 있습니다.
