description_portal: 지방자치제 확산과 지역 경제 활성화를 위한 세제 지원 정책의 중요성이 증대되면서, 비과세와 감면 제도의 효과적인 운영과 지역 발전을 위한 전략적 세정 정책 수립이 중요한 지방 행정 과제로 대두되고 있습니다. 지방세법과 지방세특례제한법에 따른 적정한 비과세·감면 제도 운영과 정책 목표 달성을 위한 효과성 분석 및 평가가 요구되고 있으며, 지역 경제 발전과 투자 유치를 위한 세제 혜택 정책의 합리적 운영과 재정 건전성 확보 간의 균형 유지가 중요해지고 있습니다. 세목별·연도별 비과세감면 현황 분석을 통한 세제 혜택 정책의 성과 평가와 개선 방안 모색이 필요하며, 비과세감면 제도의 투명성 확보와 납세자의 알권리 보장을 위한 상세한 현황 정보 제공이 중요합니다. 또한 지방자치단체 간 비과세감면율 비교 분석과 세제 정책 벤치마킹을 통한 최적의 세정 운영 모델 구축이 요구되고 있으며, 비과세감면 제도의 정책 효과 분석과 지방재정에 미치는 영향 평가를 통한 지속가능한 세정 정책 수립의 필요성이 증대되고 있어, 충청남도 보령시는 관내 세목별 비과세감면 현황에 대한 과세년도, 비과세 금액, 감면 금액, 부과 금액, 비과세감면율 등 지방세 정책 수립과 세제 혜택 정책 평가에 필요한 종합적인 지방세 비과세감면율 현황 정보를 제공하고 있습니다.
