summary_user: 영업정지 처분을 받은 저축은행별로 보험사고 발생 이전까지의 일별 예금 입금액·출금액·잔액을 담은 건별 원천 데이터이며, 필드명상 예금 규모 구간(5천만원 이하·초과)별 입출금과 잔액도 나뉘어 있다. 연구자나 관계기관이 "영업정지 직전 몇 주 동안 고액 예금자가 얼마나 빨리 돈을 빼 갔는가" 같은 뱅크런·예금 이탈 양상을 분석하는 데 쓴다. 전역 조인 키가 없어 저축은행명(svbkNm)과 기준일로 같은 기관의 부보·영업정지·파산 정보나 저축은행 재무 데이터와 이름 매칭으로 이어 쓴다.
description_portal: (부보금융회사 종합정보) - 영업정지 처분을 부과받은 저축은행에 대해 보험사고가 발생하기 이전 작성되었던 일별 수신(예금) 입금액, 출금액 등의 잔액변동 정보 활용 요청 증가에 따라 예금보험공사는 동 정보를 제공하고 있습니다. - 개방데이터는 영업정지 저축은행에 대한 보험사고 발생 이전까지의 일별 수신(예금) 입금액, 출금액 등의 잔액변동 정보입니다. - 학계·연구기관은 현 저축은행을 비롯한 다양한 금융업권에서 과거 영업정지 처분을 받은 저축은행들의 재무제표를 활용하여 연구 등에 활용하고, 관계기관은 동 정보를 공유받아 금융계약자들의 보호를 비롯한 금융시장 안정에 기여할 수 있습니다.
