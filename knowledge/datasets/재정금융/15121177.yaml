description_portal: 경상남도 남해군 공사대장관리시스템의 추출 데이터입니다. 데이터는 남해군에서 추진하는 각종 공사 사업의 예산 편성 구조를 투명하게 공개하기 위한 자료입니다. 공사명과 회계구분을 비롯해 장·관·항·세항·세세항·목 등 예산과목 체계를 세부적으로 제공하여, 공사별 예산의 흐름과 사용 목적을 명확히 파악할 수 있습니다. 이를 통해 예산 집행의 투명성을 높이고, 주민과 관계자가 공공사업의 재정 구조를 쉽게 이해할 수 있도록 돕는 것을 목표로 합니다. 공사건 중 예산과목현황으로 항목은 공사명, 회계구분, 예산과목부서, 예산과목정책명, 예산과목단위(회계)항목 등 포함된 데이터 입니다.
