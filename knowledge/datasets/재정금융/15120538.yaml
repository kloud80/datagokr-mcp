description_portal: '1. 데이터 개요 : 파산 이후 종결 이전 파산재단들이 보유하고 있는 미수령금(파산배당금, 개산지급금 정산금) 등의 통계 자료입니다.2. 데이터 항목-파산재단명 : 미수령금이 존재하는 파산재단의 명칭-파산배당금 인원 : 미수령된 파산배당금 대상 인원(단위 : 명)-파산배당금 금액 : 미수령된 파산배당금 총액(단위 : 억원)-개산지급금 정산금 인원 : 미수령된 개산지급금 정산금 대상 인원(단위 : 명)-개산지급금 정산금 금액 : 미수령된 개산지급금 정산금 총액(단위 : 억원)3. 데이터 주석-파산재단 : 「채무자회생 및 파산에 관한 법률」에 따라 법원의 파산선고와 동시에 채무자가 보유한 국내외 모든 자산으로 파산재단이 구성되며, 「공적자금관리특별법」에 의거 공적자금이 투입된 금융회사의 파산관재인으로 예금보험공사 또는 그 임직원이 선임되어 직접 파산재단을 관리하고 있음-파산배당금 : 금융회사가 파산하는 경우 남은 자산을 현금화하여 채권 순위 및 채권액에 따라 배분하는 금액을 ㅁ라함-개산지급금 정산금 : 5천만원 초과 예금자가 예상배당률에 따라 미리 신청하여 지급받은 금액(개산지급금)이 실제 파산배당금보다 적은 경우 예금보험공사가 추가로 정산하여 지급하는 금액을 말함'
