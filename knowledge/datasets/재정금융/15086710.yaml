description_portal: 2012년부터 2025년까지의 국가 지방 분담 비율 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*지방자치단체가 예산 편성단계에서 과소계상한 중앙정부 부담 초과분을 조정한 통합재정사용액(본예산)을 기준으로 합니다.* 재정통계는 디지털예산회계시스템에 수록되어 있는 예･결산 자료를 바탕으로 한 것이며, 출처가 디지털예산회계시스템이 아닌 경우에는 그 출처를 “주”에 별도 표시해 두었습니다.* 모든 통계는 합계 또는 소계가 반올림되었으므로 세부 항목의 합계가 총계와 일치하지 않는 경우가 있습니다.* 각 통계표의 계수 단위는 기본적으로 ‘억 원’ 단위이며, 필요한 경우 ‘조 원’ 단위로 표시해 두었습니다.* 정부 조직개편, 재정사업 분류체계 개편 등으로 인해, 소관, 분야, 부문, 프로그램별 시계열 자료 해석 시 유의할 필요가 있습니다.
