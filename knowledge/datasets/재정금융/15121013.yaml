description_portal: 경제협력개발기구(OECD) 회원국의 총조세 대비 보유세(Taxes on Property, 코드 4000)비중 에 대한 시계열 데이터입니다. 1965년부터 2023년까지의 연도별 통계를 포함하며, 해당연도 데이터 자료가 없는 국가는 데이터 미제공 국가입니다. OECD 회원국, 보유세, 총조세 대비 등의 키워드를 중심으로 구성된 이 데이터는 호주, 오스트리아, 벨기에, 캐나다, 칠레 , 콜롬비아, 코스타리카, 체코, 덴마크 등 여러 국가의 재산과세 비중과  조세 구조를 비교, 분석하는 데 활용됩니다.본 자료는 정부와 연구기관의 조세정책 수립, 재정 구조 진단, 과세 기준 마련 등에 기초자료로 사용되며, 국제 조세 동향 분석에도 적합합니다. 통계는 OECD 원자료를 기반으로 하며, 조세제도 연구에 실질적인 정보를 제공하는 공공데이터 입니다.
