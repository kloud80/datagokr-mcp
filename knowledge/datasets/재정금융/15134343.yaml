summary_user: 전국 시군구별로 HS 품목 단위의 수출·수입 건수와 미화금액, 무역수지를 월별로 집계한 관세청 통계로, 수출입 신고 원장에서 나온 집계값이며 건별 신고 내역은 담지 않는다. 지자체 담당자나 지역경제 분석가가 '우리 시군구에서 어떤 품목이 가장 많이 수출되고 무역수지가 어떻게 변했나'를 확인하는 데 쓴다. HS부호(hsSgn)를 키로 HS 부호표나 품목·국가별 수출입실적과 이어 쓰고, 지역은 시군구명(sggNm)만 있어 행정구역 코드와 붙일 때는 이름 매칭이 필요하다.
description_portal: "관세청 시군구별_품목별 수출입통계정보의 무역수지, 수출건수, 수출금액, 수입건수, 수입금액, 기간 등을 조회 할 수 있는 서비스입니다.개요: 수출입 통관자료를 지역별 중심으로 품목별, 성질별 등 기준에 따라 집계하여 국민, 기업, 공공기관 등이 쉽고 편리하게 조회할 수 있도록 서비스 제공공표주기 : 1개월공표시기 : 매월 15일경 수출입 신고의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화통계제공 기준기준일 : 수리일 (기본적으로 신고수리일 기준으로 수출입 통계를 집계) , 출항일 (수출의 경우 출항일 기준으로도 통계 조회 가능하며, 출항일 기준 선택 시 수출통계에만 적용됨)지역 : 수입은 「납세의무자 주소지 우편번호」, 수출은 「제조장소 우편번호」 기준으로 집계금액은 수입(과세가격미화금액), 수출(신고미화금액) 기준임※ '26.7.1.자 전남광주통합,인천 지방행정체계 개편으로 수출입신고 시군구 코드가 변경되었으니, 수출입실적 조회 시 참고하시기 바랍니다 - '26.7.1.이후 수출입실적 조회: 지방행정체계 개편반영 시군구 코드 적용 - '26. 7월 이전 수출입실적 조회: 개편 전 지방행정체계 시군구 코드 적용"
