description_portal: '총지출은 내부거래와 보전거래 등을 제외하지 않고 집계한 정부의 예산 총액으로, 재정정책의 총량 효과와 재정규모를 파악할 수 있는 중요한 지표입니다. 세목 단위의 예산현황은 정부 재정 집행 계획의 가장 상세한 구조를 보여주며, 개별 사업별, 항목별 예산 배분 현황을 분석할 수 있도록 구성되어 있습니다.1. 데이터 범위   * 연도별 총지출 기준 세출·지출 예산 현황   * 중앙행정기관별, 회계별, 분야·부문·프로그램·단위사업·세부사업·세목별 구분   * 예산구분(정부안, 국회확정), 예산액(단위: 원), 데이터 기준일 포함2. 총지출 기준 제공   * 내부거래, 보전거래 등을 제외하지 않은 총액 기준 데이터   * 재정규모 및 재정정책 총량 효과 분석 가능3. 세목 단위 구성   * 세출예산은 ‘세목’이라는 가장 작은 단위로 편성되어 집행   * 항목별 사업 목적 및 세부 내역까지 확인 가능5. 활용 예시   * 사업별·세목별 재정투자 우선순위 분석   * 특정 정책·사업에 대한 국회 심의 영향 파악   * 재정 집행계획 수립 및 정책 효과 분석 자료로 활용   * 연도별 재정 배분 변화 추이 분석6. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 파일 형식 다운로드 가능   * Open API 제공 (연도, 부처, 분야, 세목명, 예산구분 등 조건별 상세 조회 지원)본 자료는 정부의 세출·지출 구조를 가장 세밀한 수준에서 공개하여 국민의 알권리를 충족하고, 연구기관·언론·일반 국민이 정책 분석, 재정 건전성 점검, 재정투자 우선순위 설정 등에 활용할 수 있는 중요한 재정정'
