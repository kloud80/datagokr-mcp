description_portal: 지방세 부과액에 대한 세목별 징수현황을 제공(시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 부과금액, 수납급액, 환급금액, 결손금액, 미수납 금액, 징수율)지방자치단체가 부과한 각종 지방세(재산세, 자동차세, 등록면허세 등)의 징수 금액, 징수 완료율 및 체납 정리 내역을 집계한 자료입니다. 본 데이터는 세목·기간별 징수 실적, 지역 간 비교, 징수율 추이 분석 등을 통해 재정 운영 효율 평가, 징수 전략 수립, 민원 대응, 세정 관리 개선 등에 활용될 수 있습니다.데이터 건수가 많아 일반 뷰어(엑셀, 메모장 등)에서 일부만 보일 수 있으므로 R, Python, GIS 등 전용 분석 도구를 사용한 시각화 및 통계 분석을 권장합니다.징수 기준일, 징수 방식(일시납·분납), 징수율 계산 방법, 체납 전환 기준일 등 상세 정의는 해당 지자체의 메타데이터나 기술문서를 참고해 주세요.
