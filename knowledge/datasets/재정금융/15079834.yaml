description_portal: 1. 주요 내용 및 활용 맥락본 데이터는 전북특별자치도 남원시의 지방세 징수 상황을 체계적으로 정리한 자료입니다. 자동차세, 담배소비세, 재산세 등 주요 세목별로 연도에 따른 부과금액, 수납금액, 환급금액, 결손금액, 미수납금액 및 징수율 정보를 상세히 제공합니다. 이 데이터는 지방 재정의 투명성을 높이고 시민들이 세정 현황을 쉽게 이해할 수 있도록 마련되었으며, 연구기관, 정책 입안자, 시민단체 등이 지방세 징수의 효율성을 분석하거나 재정 건전성을 평가하는 데 활용될 수 있습니다.2. 데이터 항목명시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 부과금액, 수납금액, 환급금액, 결손금액, 미수납금액, 징수율3. 기대 효과지방세 징수 현황을 투명하게 공개함으로써 시민의 알 권리를 보장하고 행정에 대한 신뢰를 높일 수 있습니다. 더불어 데이터 기반의 세정 정책 수립과 징수율 개선 방안 마련에 실질적으로 기여할 것으로 기대됩니다.
