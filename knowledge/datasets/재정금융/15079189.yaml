description_portal: 본 데이터는 경기도 양주시의 지방세 정수현황을 과세년도별로 정리한 자료이다. 데이터는 시도명, 시군구명, 자치단체 코드, 과세년도, 세목명, 부과금액, 수납금액, 환급금액, 결손금액, 미수납금액, 정수율 등의 항목으로 구성된다. 지방세기본법 제128조 및 제135조에 근거하여 제공되며, 세부 항목별 징수율을 산출할 수 있어 지방자치단체의 세입 건전성과 세정 집행 효율성을 평가하는 핵심 자료로 활용된다. 특히 부과금액 대비 수납금액의 비율은 세입 확보율을 보여주며, 환급금액과 결손금액, 미수납금액 등은 재정 건전성 및 세정 운영의 문제점을 파악하는 데 중요한 지표가 된다. 이 데이터는 지방자치단체의 세수 관리, 징수 정책 수립, 체납 관리 및 세정 개선 방안 마련 등 행정적 의사결정의 근거자료로 유용하게 활용될 수 있다.
