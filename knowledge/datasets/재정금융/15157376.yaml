description_portal: 본 데이터는 전라남도 보성군의 연도별 지방세 비과세 및 감면 규모를 파악할 수 있는 세무 행정 통계 정보를 제공한다. 보성군은 지역 경제 활성화와 취약 계층 지원을 위해 시행되는 다양한 조세 감면 제도의 실효성을 검토하고, 세수 추계의 정확성을 높이기 위해 매년 발생하는 비과세·감면액 데이터를 체계적으로 관리하여 개방한다. 데이터의 주요 구성 항목은 발생 연도별 취득세, 주민세, 자동차세, 등록면허세, 지역자원시설세 등 주요 세목에 대한 비과세 금액과 감면 금액으로 상세히 분류되어 있다.수록된 정보는 2013년부터 최근까지 보성군 세정 운영의 흐름을 보여주는 시계열 자료를 포함하며, 조세특례제한법 및 지방세특례제한법 등에 근거하여 감면된 세액의 규모를 정량적으로 제시한다. 특히 취득세와 자동차세 등 비중이 큰 세목의 감면 현황을 통해 지역 내 투자 유치나 복지 정책이 지방 재정에 미치는 영향을 분석할 수 있는 기초 자료로 활용될 수 있다. 또한 각 세목별로 비과세와 감면을 구분하여 공표함으로써 실제 부과되지 않은 세액의 성격을 명확히 규명하고, 보성군의 자립 재원 확보 가능성과 세정 지원 정책의 규모를 객관적으로 진단하는 근거가 된다. 이는 지방 정부의 재무 보고서 작성이나 예산 편성 시 세입 결손 요인을 파악하는 데 있어 매우 중요한 행정적 인프라로 기능한다.이 데이터는 조세 정책 연구자, 지방 재정 전문가, 행정학계 및 보성군의 세무 행정에 관심 있는 일반인들에게 투명한 통계 자료를 제공하는 데 그 목적이 있다. 공공데이터 표준 규격을 엄수하여 설계되었으며, 사용자는 이를 활용해 전국 지자체별 감면율 비교 연구를 수행하거나 지역별 조세 지원 형평성을 분석하는 등 다각도의 학술적·실무적 연구를 수행할 수 있다. 보성군은 본 자료를 통해 지방세 행정의 투명성을 제고하고 데이터 기반의 고도화된 재정 관리 체계를 실현함으로써 건전한 지방 재정 운용을 도모하고자 한다.
