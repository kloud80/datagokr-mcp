description_portal: '이 데이터는 월별 TCB평가서 제공 현황을 기록한 표입니다. 주요 내용은 각 월별로 기술보증기금이 19개의 시중은행에 제공한 기술신용정보(TCB평가서) 제공 건수를 포함하며, 각 은행의 제공 현황을 관리하고 분석하는 데 사용됩니다.구분: 각 월별 데이터를 구분하는 항목으로, 주로 해당 월에 대한 정보를 나타냅니다.은행구분: 이 항목은 기술신용정보(TCB평가서)를 제공한 은행을 구분하는 필드입니다. 은행은 가변문자형(VARCHAR)으로 표기되어 있으며, 중소기업은행을 포함한 총 19개의 시중은행으로 구분됩니다.각 날짜는 해당 월의 마지막 날짜로, 각 월에 대한 데이터를 구분합니다. 이를 통해 데이터는 매월 제공된 TCB평가서의 수치를 확인할 수 있습니다. 월별 TCB평가서 제공 건수는 숫자로 기록됩니다.'
