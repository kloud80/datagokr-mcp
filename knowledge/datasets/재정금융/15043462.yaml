summary_user: 한국예탁결제원 원천의 채권 대차거래를 기준일자별로 담으며, 종목별 대차체결·상환금액과 잔액 순위, 개별 채권 종목의 거래·잔액 현황, 표준산업분류별 대여·차입 잔액과 비율의 3개 오퍼레이션(전국 범위, 비공간)으로 제공한다. 금융시장 분석가나 금융기관 리스크 담당자가 '특정 일자에 대차잔액이 가장 큰 채권 종목은 무엇이고, 어느 업종이 채권 차입을 많이 하는가'를 확인하는 데 쓴다. 채권 국제식별번호(isinCd)를 조인 키로 삼아 같은 부문의 종목코드 원장, 일별 채권 시세, 발행정보, 연기금 보유·기업 공시 데이터와 이어 쓰고, 업종별 오퍼레이션은 표준산업분류 코드(sicCd)로 산업 단위 통계와 맞춘다.
description_portal: '채권대차정보는 기준일자, 대차증권구분코드명, 표준산업분류명 등을 기준으로 채권 대차거래 현황을 조회할 수 있는 데이터입니다.총 3가지 오퍼레이션으로 제공되며, 각각의 기능은 다음과 같습니다:① 채권대차종목순위 조회: 대차체결금액, 상환금액, 대차잔액 등을 종목별로 제공② 채권종목별 대차거래현황 조회: 개별 채권 종목의 거래 내역과 잔액 현황③ 채권업종별 참여현황 조회: 산업별로 채권 대여·차입 잔액 및 비율 제공주요 항목에는 ISIN코드, 채권명, 산업분류명, 대차체결금액, 대차상환금액, 대차잔액, 대여·차입잔액 및 비율 등이 포함됩니다.본 데이터는 채권시장 내 유통 규모, 종목별 거래 집중도, 산업별 참여 구조를 분석할 수 있어, 금융시장 감시, 투자 전략 수립, 금융기관 리스크 점검 등에 활용될 수 있습니다.** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
