summary_user: 법인등록번호 단위로 개별 기업의 개요(법인명·영문명, 대표자, 설립일, 상장 시장과 상장·폐지일, 업종, 종업원 수·평균 근속·1인 평균 급여, 감사인과 감사의견, 주거래은행, 주요 사업)를 건별로 담는다. 전국 범위이며, 검증 호출에서는 전체 건수 2건, 수신 2행이 나왔다. 투자자나 기업 분석가가 '이 회사는 언제 어느 시장에 상장했고, 감사의견과 종업원 수는 어떤가'를 확인하는 데 쓴다. 법인등록번호(crno)·사업자등록번호(bzno)·소재지 주소를 키로 금융위 재무·지배구조 정보, 금감원 공시, 개인사업자 데이터 같은 기업 축 데이터와 잇는다.
description_portal: 기업기본정보는 법인 등록번호 또는 기업명을 기준으로 개별 기업의 개요, 계열회사 현황, 연결대상 종속기업 정보를 통합 제공하는 데이터입니다. 주요 항목으로는 기업명, 대표자, 설립일, 업종, 종업원 수, 주요 사업, 계열회사 상장 여부, 종속기업의 주요 정보(주소, 사업내용, 자산규모, 지배구조 근거 등)가 포함되며, 기준일자를 활용한 시점별 조회가 가능합니다. 이 데이터는 단일 기업뿐 아니라 기업군 간의 구조와 연결관계를 함께 파악할 수 있어, 기업 재무분석, 계열구조 해석, 지배구조 분석 등에 활용할 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)
