description_portal: 경산시는 지방세 환급금에 대한 시민의 알권리 보장과 수령 독려를 위해 세목별 미환급금 현황을 공개합니다. 지방세 환급금은 이중납부, 착오납부, 납세자 사망 등 다양한 사유로 발생하며, 본인의 신청 없이는 환급되지 않습니다. 현재 세목별 환급건수와 환급금액은 아래 표와 같으며, 시민 여러분께서는 위택스(www.wetax.go.kr) 또는 경산시청 징수과를 통해 환급 대상 여부를 꼭 확인하시기 바랍니다.(자료는 환급금 발생, 환급 처리, 정정 등의 사유로 인해 수시로 변동될 수 있습니다. 특히 환급신청에 따른 지급, 오류 정정, 추가 납부 이력 반영 등으로 환급건수 및 금액이 변경될 수 있으므로, 게시된 자료는 특정 시점 기준의 현황임을 알려드립니다.)
