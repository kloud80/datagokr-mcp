description_portal: '이 데이터는 대출종류별 보증 및 사고현황을 연도·분기 기준으로 정리한 자료입니다. 각 시점별로 보증종류(대출보증, 비은행대출보증, 기타)에 따라 법인·개인에게 제공된 보증 규모와, 그에 따른 보증사고 실적을 함께 확인할 수 있습니다.주요 항목은 다음과 같습니다.연도구분: 대출종류별 보증 및 사고현황의 연·분기를 구분한 항목입니다.보증종류: 해당 보증이 어떤 종류인지 구분하는 항목으로, 대출보증·비은행대출보증·기타로 구성되어 있습니다.법인보증건수 / 법인보증잔액(억원): 연도·보증종류별 법인 대상 보증의 건수와 잔액을 나타내는 항목입니다.개인보증건수 / 개인보증잔액(억원): 연도·보증종류별 개인 대상 보증의 건수와 잔액을 나타내는 항목입니다.법인사고건수 / 법인사고금액(억원) / 법인사고율: 보증종류별로 발생한 법인 보증사고의 건수, 금액, 사고 비율을 보여주는 항목입니다.개인사고건수 / 개인사고금액(억원) / 개인사고율: 보증종류별로 발생한 개인 보증사고의 건수, 금액, 사고 비율을 나타내는 항목입니다.이를 통해 대출보증, 비은행대출보증, 기타 보증상품별로 법인·개인 부문의 보증 규모와 사고 수준을 시점별로 비교·분석하는 데 활용할 수 있습니다.'
