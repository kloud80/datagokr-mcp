summary_user: 금융위원회가 연계받은 채권의 권리행사 내역을 조기행사옵션, 옵션부채권 조기상환, 옵션 행사가 조정, 옵션 행사 내역의 4개 오퍼레이션으로 담으며, 기준일자·종목(ISIN)별 건 단위로 옵션 유형(콜·풋), 행사 기간·비율·금액, 조기상환일자, 행사가격 등을 제공한다. 채권 투자자나 분석가가 특정 회사채에 콜옵션·풋옵션이 붙어 있는지, 언제 조기상환됐는지, 전환·교환 대상 주식의 행사가격이 어떻게 조정됐는지를 확인하는 데 쓴다. 법인등록번호(crno)와 국제증권식별번호(isinCd)를 키로 금융위원회 채권 발행·시세 정보나 기업 공시·재무 데이터와 이어 쓴다.
limits: 실시간 데이터가 아니며 기준일자 기준으로 연계된 값을 제공한다. 조기행사옵션조회는 기준일자·ISIN·법인등록번호 중 최소 1개를 넣어야 하고, 넣지 않으면 기준일자가 가장 최신 날짜로 자동 설정되므로 과거 이력 조회 시 기준일자를 명시해야 한다. 개발계정은 일 10,000회 호출 제한이 있다.
