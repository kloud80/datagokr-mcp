description_portal: '채권권리행사정보는 기준일자, 법인등록번호, 채권발행인명을 기준으로 채권 관련 권리행사 내역을 조회할 수 있는 데이터입니다.<데이터 조회 시 유의사항>파라미터 없이 조회 시 데이터 조회 시간이 오래걸려 timeout이 발생하게 되어 필수 파라미터를 지정하였습니다.- 파라미터 조건 : 조회 시 아래의 필수 파라미터 중 최소 1개 이상을 반드시 입력해야 합니다.- 기본값 안내 : 필수 파라미터를 입력하지 않은 경우, 기준일자(basDt)는 자동으로 가장 최신 날짜로 설정되어 조회됩니다.[서비스별 필수 파라미터 목록]- 조기행사옵션조회 : basDt, isinCd, crno- 옵션부채권조기상환조회, 옵션행사가조정내역조회, 옵션행사내역조회 : 없음총 4가지 오퍼레이션 정보가 제공되며, 각각 다음과 같은 내용을 포함합니다.1. 조기행사 옵션 조회 : 기준일자, 법인등록번호, 채권발행인명을 통하여 옵션유형코드, 옵션행사시작일자, 옵션행사금액등을 조회하는 조기행사옵션조회 기능2. 옵션 부채권 조기 상환 조회 : 옵션부채권조기상환일자, 법인등록번호, 옵션부채권발행인명을 통하여 옵션부채권발행금액, 옵션부채권이자지급금액, 채권발행금액, 옵션행사비율등을 조회하는 옵션부채권조기상환조회 기능3. 옵션 행사가 조정내역 조회 : 준일자, 법인등록번호를 통하여 옵션행사가, 납입구분코드, 권리행사가격조정일자, 권리변경전행사가등을 조회하는 옵션행사가조정내역조회 기능4. 옵션행사 내역조회 : 기준일자, 법인등록번호를 통하여 옵션행사가, 행사가격, 행사금액, 행사주식수, 상장일자등을 조회하는 옵션행사내역조회 기능※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
