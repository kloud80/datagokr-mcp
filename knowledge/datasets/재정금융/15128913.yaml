summary_user: 한국주택금융공사가 발행한 주택저당증권(MBS)을 유동화계획(회차)별로 담은 발행실적 데이터로, 계획명·발행일자·트랜치수·발행금액·트랜치잔액·가중평균발행금리를 제공하며 범위는 전국·비공간이다. 채권 투자자나 금융 분석가가 'MBS 발행금리가 시기별로 어떻게 변했고 회차별 잔액은 얼마나 남았나'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어, 발행일자를 기준으로 금리·주택담보대출 통계 같은 시계열과 날짜로 맞추거나 같은 기관의 다른 데이터와 유동화계획명으로 연결한다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·날짜 매핑이나 같은 기관 데이터로만 이어 붙일 수 있다. 지역 구분이 없는 전국 단위라 지역별 분석에는 쓰지 못한다. 개발계정은 하루 10,000회 호출로 제한된다.
