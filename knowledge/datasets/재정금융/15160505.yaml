description_portal: 이 데이터는 신용보증기금의 신용보험 인수 심사 과정에서 활용되는 자동신용보험평가 체계의 모형 및 세부 지표 현황을 집계한 자료로, 자동신용보험평가 모형 마스터, 모형 지표 정보, 재무제표·신용공여·부가세 지표 정보 및 부도 정보, 결과 제공 전환 정보, 재산출 정보 등의 테이블을 포함하고 있다. 본 데이터는 과세세금계산서교부금액, 과세기타금액, 비과세세금계산서교부금액, 고정자산매입금액 등의 세부 칼럼을 제공함으로써, 자동평가 모형의 구조부터 재무·거래 관련 개별 지표, 그리고 평가 결과 관리에 이르는 관련 업무의 기본적인 현황을 종합적으로 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터 내 ‘모형 마스터’ 및 ‘모형 지표 정보’는 자동평가 체계의 전반적인 구성 항목을 살펴보는 데 활용될 수 있으며, ‘부가세 지표 정보’, ‘재무제표 지표 정보’ 및 ‘신용공여 지표 정보’ 등은 평가에 참고되는 세부 매출·재무·신용 거래 항목들의 단편적인 경향성을 파악하는 기초 자료를 제공한다.
