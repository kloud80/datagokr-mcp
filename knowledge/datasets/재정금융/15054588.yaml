description_portal: '한국무역보험공사 국외기업 신용조사 결과 연도별(2017년~2025년) 유효등급 통계(단위 : 건) 자료를 제시한 파일 데이터 자료입니다. 국외기업 신용조사는 K-SURE의 해외지사 및 전 세계 신용조사기관을 통해 정보를 조사한 후 신청인에게 신용조사 보고서를 제공하는 서비스로, 무역보험 이용을 위한 필수 절차입니다. (단, 중소중견Plus+보험, 수출신용보증(선적전), 환변동보험 등 일부 종목은 국외기업 신용조사 불필요) 현지 신용조사는 평균 2∼3주가 소요되며, 현지 사정에 따라 조사거절, 불가, 지연 등이 발생할 수 있습니다.'
