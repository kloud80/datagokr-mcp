description_portal: 이 데이터는 서귀포시에서 부과한 지방세 중에서 ‘비과세’ 또는 ‘감면’이 적용된 세액 비율을 세목별로 정리한 통계자료입니다. 각 행에는 과세 연도, 세목명, 부과금액, 비과세 금액, 감면 금액, 그리고 이들을 합산해 계산한 ‘비과세·감면율’이 포함되어 있습니다. 이 정보를 통해, 어느 세목이 얼마나 감면 또는 면제됐는지, 전체 부과세 대비 감면 비율은 어느 정도인지를 파악할 수 있습니다. 지자체나 재정 정책 담당자는 세제 지원 실태를 분석하고, 감면 제도의 효과 및 재정 건전성 간 균형을 점검하는 데 활용할 수 있습니다. 또한, 시민이나 연구자는 조세 부담 완화 정책의 실질적 수혜 규모 또는 지역 간 비교 분석을 하는 기초 자료로 삼을 수 있습니다.
