summary_user: 운영대행사로부터 수집한 지역사랑상품권의 지역별 카드발행수량, 휴대가입자수, 휴대충전금액, 지류판매액·회수액을 기준연월 단위로 담은 집계 API이며, 검증 시 전체 100건이 전국 범위로 수신됐다. 분석가나 지자체 담당자가 특정 지역의 상품권 발행·충전·지류 유통 규모가 달에 따라 어떻게 달라지는지 알아볼 때 쓴다. 사용처지역코드(법정동코드 앞 5자리)로 행정구역 코드표와 잇고, 제공기관코드로 운영대행사를 구분하며, 전역 조인 키는 없어 같은 기관 코드나 이름·코드 매핑으로만 연결한다.
description_portal: '지역사랑상품권 운영대행사들로부터 수집한 지역사랑상품권의 지역별 카드발행수량, 휴대가입자 수, 지류판매액, 지류회수액 등을 제공한다.아래는 데이터 사용시 참고바랍니다:1) 제공기관코드:코나아이: I0000001한국간편결제진흥원: I0000002신한카드: I0000003한국조폐공사: I0000004KT: I0000005농협은행: I0000006광주은행: I0000007대구은행: I0000008ITS&G: I0000009NICE 정보통신: I0000010KIS 정보통신: I0000011인조이웍스: I0000012부산은행: I0000014비즈플레이:I00000152) 사용처지역코드(5자리):- 행정안전부에서 제공하는 법정동코드(지역코드 10자리) 중, 앞 5자리(시도코드 2자리 + 시군구코드 3자리)를 사용하고 있습니다.- 코드 정보는 참고문서를 확인바랍니다.3) 읍면동코드(8자리):- 행정안전부에서 제공하는 법정동코드(지역코드 10자리)의 앞 8자리(시도 코드 2자리 + 시군구 코드 3자리 + 읍면동 코드 3자리)를 사용하고 있습니다.- 법정동코드는 행정안전부_행정표준코드_법정동코드 API(https://www.data.go.kr/data/15077871/openapi.do)를 활용하여 조회할 수 있습니다.'
