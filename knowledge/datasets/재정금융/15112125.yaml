summary_user: 우체국에서 현재 판매 중인 펀드상품을 상품 한 건씩 담으며, 유형구분·펀드번호·상품명·위험등급과 창구·인터넷 신규가입 가능 여부, 개인·법인 개설 가능 여부를 함께 제공한다. 우체국에서 MMF·채권형 같은 보수적 펀드에 가입하려는 개인이나 법인이 '인터넷으로 바로 가입할 수 있는 저위험 펀드가 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 다른 펀드·금융상품 데이터와는 펀드번호(GDS_CD)나 상품명 매칭, 또는 같은 기관(우정사업본부) 데이터 범위 안에서만 이어 쓴다.
description_portal: '현재 우체국에서 판매하고 있는 펀드상품에 관한 정보입니다. 해당 데이터가 보유한 컬럼은 다음과 같습니다. 컬럼명 : 유형구분, 펀드번호, 펀드상품명, 위험등급, 단말신규가능여부, 인터넷신규가능여부, 개인개설가능여부, 법인개설가능여부 우체국 펀드 상품은 일반적인 금융기관의 펀드와 마찬가지로 고객의 투자 자금을 모아 전문가가 운영하는 상품이며, 주로 원금 손실 위험이 극히 적은 상품들을 판매 합니다. 예를들어 MMF, 채권형, 채권혼합형 펀드 등 비교적 보수적인 상품들 입니다.'
