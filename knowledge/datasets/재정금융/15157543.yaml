description_portal: 본 데이터는 예금보험공사가 관리하는 파산재단의 연도별 현황을 정리한 시계열 통계입니다. 파산재단이란 파산한 금융기관의 남은 자산과 채권을 정리하기 위해 운영되는 관리 단위를 의미합니다. 본 자료에는 매년 새롭게 파산선고를 받은 재단 수, 해당 연도에 파산절차가 종결된 재단 수, 그리고 지금까지 누적된 선고, 종결 건수가 포함되어 있습니다. 또한 연도 말 기준으로 아직 정리 절차가 진행 중인 재단 수를 함께 제공하여, 금융기관 부실 정리의 진행 속도와 잔여 관리 규모 변화를 한눈에 확인할 수 있습니다. 이를 통해 금융위기 이후 구조조정의 장기적 추이와 공적자금 사후관리 현황을 객관적으로 파악할 수 있습니다.
