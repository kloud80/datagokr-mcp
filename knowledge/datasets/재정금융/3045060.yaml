description_portal: '남양주시 세외수입 과오납 반환 현황에 대한 데이터로 부서별, 회계과목별, 반환건수, 반환금액에 대한 항목을 제공하고 있습니다. 과오납금은 과납금과 오납금을 통칭한 것으로서 과납금은 납부 또는 납입하여야 할 정당한 금액을 초과하여 납부 · 납입하였을때 그 초과 금액을 말하며, 오납금은 납부 또는 납입할 의무가 없음에도 착오로 납부 · 납입한 세입금을 말합니다.  ○ 과오납금 반환 대상자: 환급대상자는 납부고지서 등에 기재된 납부 의무자에게 환급함이 원칙 입니다. (단, 개별법령에 특별한 규정이 있을 경우 그러하지 아니함)○ 과오납금 반환처리 절차: 과오납금 사유가 발생하면 그 적정성을 검토한 뒤 납부자 본인 계좌로 과오납반환 처리 됩니다. 항목설명- 번호: 데이터번호- 부서별: 부서별구분- 회계과목별: 회계 과목별 구분- 반환건수: 반환한 건수- 반환금액: 반환한 금액- 데이터기준일: 데이터 작성 기준일'
