description_portal: '2010년 부터 2019년 까지의 세계잉여금, 국가채무 등의 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시했습니다.결산: 한 회계연도 세입예산의 모든 수입과 세출예산의 모든 지출을 확정적인 계수로 표시하는 행위로, 한해안의 재정운용에 대한 정부의 사후적 재무보고를 의미「국가재정법」 제90조에 따라 일반회계 세계잉여금을 지방교부세(금) 정산 → 공적자금상환기금 출연(잔여액 30% 이상) → 채무상환(잔여액 30% 이상) → 추경재원 또는 세입이입 순으로 사용세계잉여금: 일반회계와 특별회계의 총세입에서 총세출을 제하고 남은 금액(결산상 잉여금)에서 다음 연도 이월분을 차감한 금액'
