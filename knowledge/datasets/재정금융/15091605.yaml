summary_user: KOTRA 글로벌역량진단(GCL)을 받은 기업별로 진단일, GCL 점수, 등급, 유선컨설팅 신청 여부, 회원 여부를 한 행씩 담은 전국 범위의 건별 파일(csv, 약 261KB)이다. 수출 지원 기관이나 분석가가 "해외 진출 준비도 등급이 높은 기업은 어디이고, 이들 중 컨설팅을 신청한 곳은 얼마나 되나"를 살펴보는 데 쓴다. 사업자번호(bizno)를 조인 키로 삼아 무역보험 바이어·전략물자 거래업체·수출 실적 등 다른 기업 단위 데이터와 연결한다.
description_portal: KOTRA에서 공공데이터포털에 제공하는 글로벌역량진단(GCL) 데이터는 한국 기업들의 해외 진출을 위한 준비 상태와 역량을 평가하고 분석할 수 있는 데이터 입니다. 이 데이터는 기업들이 글로벌 시장에 성공적으로 진입하기 위한 준비 상태를 점검하고, 자사의 경쟁력을 강화할 수 있는 방법을 모색하는 데 유용한 데이터 입니다. 기업 유형을 3가지 타입으로 분류 후, 주요 부문 점수를 합산하여 KOTRA 자체 기준에 의거한 기업 등급을 책정하였습니다. 해외 시장에 대한 깊이 있는 이해와 전략적 접근이 필요한 기업의 많은 활용을 부탁 드립니다.
legal_basis_portal: KOTRA에서 개발한 진단으로 홈페이지에서 수행후 고객 사업이용 기반 데이터로 활용
