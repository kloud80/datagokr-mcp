description_portal: 국가의 회계 및 기금별 재정운영 결과를 정리한 결산 정보입니다. 순원가, 비교환수익, 재정운영결과 등의 항목으로 구성되며, 회계와 기금 단위로 구분되어 재정활동의 효율성과 성과를 평가하는 데 활용됩니다. 정부가 제공한 서비스의 원가와 수익 간 관계를 분석할 수 있도록 설계되었으며, 비용 구조와 운영 성과에 대한 이해를 높이는 데 기여합니다. 이 자료는 회계, 기금, 재정운영 외에도 운영성과, 재정지표, 비용분석, 회계정보, 공공재정 등의 키워드와 연계되어 정책 분석에도 활용됩니다. 열린재정을 통해 국민에게 제공되며, 공공저작물로 활용 가능하므로 메타정보 내 저작권 사항을 반드시 확인 후 이용하시기 바랍니다.
