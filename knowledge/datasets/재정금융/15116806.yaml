description_portal: '기업이 세관에 수입 신고하는 과정에서 생산된 운임정보를 화물정보와 연계하여 컨테이너 당 평균 수입 운송비용을 산출·공표하는 데이터로, 수출입 물류업계 등에서 참고자료로 활용 가능. 단위 : 천원/2TEU항로 : 항구 단위가 아닌 국가·지역 단위거래조건 : 운임을 포함하지 않는 대표적인 정형거래조건(국가 간 무역거래에서 널리 쓰이는 무역거래조건에 관한 해석 규칙(국제상업회의소 제정))인 FOB(Free On Board)를 거래조건으로 하는 수입신고 건적재형태 :  컨테이너에 단일 화주의 물품만 적재되는 FCL(Full Container Load) 형태만 선별컨테이너 종류 :  40피트(2TEU) 일반화물 운송용(GP, Genaral Purpose) 컨테이너'
