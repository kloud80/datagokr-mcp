description_portal: 이 데이터는 각 국가의 OECD 국가 등급을 나타내는 자료로, 이전 평가등급과 현재 등급을 기준으로 국가별 경제적 신뢰도를 평가한 정보를 제공합니다. 각 국가별로 이전 등급과 현재 등급을 비교할 수 있어, 해당 국가의 경제 상황 변화에 따른 신용도 및 리스크를 분석하는 데 유용한 자료입니다. 예를 들어, 아프가니스탄(Afghanistan)의 경우, 이전과 현재의 평가 등급이 동일한 7으로 나타나 있으며, 앤도라(Andorra)처럼 평가 등급이 없는 국가도 포함되어 있습니다. 이 데이터는 국제 경제 관계 분석, 투자 전략 수립, 무역보험 등의 분야에서 국가별 리스크 평가 자료로 활용될 수 있습니다.
