description_portal: <구성내용>- 예금보험공사 금융부실책임조사 시 피조사자 권익보호제도 안내 - 예금보험공사 금융부실책임조사 안내- 조사 단계 별 권익보호제도- 조사 전반에 걸친 권익보호제도 내용 등<상세내용>예금보험공사는 예금자보호법에 따라 부실금융회사의 부실 또는 부실 우려에 책임이 있는 부실관련자에게 손해배상을 청구하고 있으며, 이에 따라 부실관련자와 이해관계인에 대한 조사를 실시하고 있습니다.동 안내문은 피조사자의 권익보호를 위해 예금보험공사가 운영하고 있는 권익보호제도를 설명하는 안내문입니다.피조사자는 조사를 연기 신청할 수 있으며, 조사 진행 시 가족 등이 동석할 수 있으며, 조사 진행 상황을 예금보험공사 홈페이지에서 확인할 수 있습니다.자세한 사항은 안내문을 참고하시기 바랍니다.
