description_portal: (부보금융회사 종합정보)보험사고가 발생한 부보금융회사의 예금자가 예금보호를 받기위해 예금보험금 지급을 청구한 경우 공사 홈페이지를 통함 예금보험금 청구방법 외에 공사의 예금보험금 지급 업무를 대행해주는 지급대행기관(국민은행, 하나은행, 우리은행, 농협은행, 신한은행, 기업은행)을 통해 예금보험금을 청구 및 수령할 수 있으며, 이 때 예금보험공사의 예금보험금 지급 업무를 대행해 주는 금융회사의 지점 목록과 해당 지점에 대한 정보로, 지점명, 도로명주소, 연락처 등해당 정보를 통해 예금보험공사는 예금자에게 신속한 예금보험금 지급을 가능하게 하며, 예금자보호 실효성을 제고할 수 있음
