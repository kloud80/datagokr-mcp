summary_user: 신용보증기금 보증 건의 접수부터 승인·실행·해지까지를 원장 단위로 담은 파일 데이터로, 건별 접수금액·승인금액·보증금액·보증잔액·보증비율과 상담·접수·승인·보증시작·종료일자, 진행상태 코드를 담는다(전국 범위, csv 약 179KB). 분석가가 '보증 신청이 접수에서 승인·실행까지 얼마나 걸리고, 신청액 대비 승인액이 얼마나 줄어드는가'를 살펴볼 때 쓴다. 전역 조인 키는 없고, 기업고객ID·원장ID는 신보 내부 식별자라 같은 기관의 다른 원장 파일과 코드 매핑으로만 이어 쓴다.
description_portal: 해당 파일 데이터는 신용보증기금의 보증접수원장마스터에 대한 정보를 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
