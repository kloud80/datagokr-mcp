summary_user: 관세청 수출입 신고를 집계한 전국 단위 수출입 총괄 통계로, 기간(year)별 수출·수입 건수와 달러 금액, 무역수지를 담는다. 분석가나 사업자가 '특정 기간 우리나라 전체 수출입 규모와 무역수지가 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 품목·국가·시군구별 관세청 수출입 실적 데이터와는 기간 값을 맞춰 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 통관업무처리 절차를 기초로 수집한 무역자료를 집계한 수출입무역통계입니다. 수출입무역통계란 사전적 의미로 국민경제가 다른 나라와의 사이에서 행하는 화물의 교류에 관한 통계로 일국의 경제영역으로 반입(수입)되거나 반출(수출)됨으로써 그 나라의 물적 자원을 증가 또는 감소시키는 모든 상품이 기록되며, 단순히 한 나라를 통과하는 물품(통과물품)이나 일시적으로 반입 또는 반출되는 물품은 그 나라의 물적 자원량을 증가시키거나 감소시키지 않기 때문에 무역통계에 포함되지 않습니다. 작성할 때의 기준이 되는 무역통계지역은 지리적·행정적·국민 경제적 관점에서 정해지며, 우리나라를 포함한 대부분 국가의 경우 관세법이 포괄적으로 적용되는 영역을 의미하는 관세영역과 무역통계지역은 개념적으로 일치합니다. 따라서 관세영역을 넘어서 행해지는 화물의 교류 통계가 무역통계라 할 수 있습니다. 우리나라는 수입은 CIF금액기준으로, 수출은 FOB 금액기준으로 집계합니다. 매월 15일경 수출입 신고의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화하고 있으며 주기는 1개월입니다. 중량은 순중량(kg)이며, 금액은 수입(과세가격미화금액), 수출(신고미화금액) 기준입니다.
