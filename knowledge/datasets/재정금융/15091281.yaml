description_portal: 본 데이터는 관내 지방세 체납 현황 정보이다. 세목별 체납액, 체납 건수 등의 세부 내용을 포함한다. 지방세 체납 현황은 지방 재정 건전성 및 조세 행정 효율성을 나타내는 중요한 지표이다. 해당 자료는 세수 확보 대책 수립, 체납 징수 전략 개발, 재정 운영 계획 수립에 활용된다. 체납액 증감 추이 분석을 통해 체납 발생 원인을 파악하고 예방 대책을 마련할 수 있다. 또한 고액 체납자 관리 강화 및 징수 독려 활동을 통해 체납액 축소를 도모한다. 납세 편의 제도 개선 및 분할 납부 제도 운영을 통해 성실 납세 문화를 조성한다. 재산 압류 및 공매 등 강제 징수 절차 시행을 통해 조세 정의를 실현하며, 안정적인 지방 재정 운영 기반을 확보한다. 본 통계는 정기적으로 공개된다.
