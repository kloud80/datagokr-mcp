description_portal: SNS 마케팅을 통해 수집한 바이어 인콰이어리 정보는 메타, 링크드인 등에서 확보한 관심도와 문의 데이터를 분석해 타깃 바이어를 정밀 파악하는 데 활용된다. 이렇게 수집된 정보는 바이코리아에 가입된 국내 수출기업 데이터와 매칭되어 적합한 기업 및 제품과 연결되며, 이를 통해 맞춤형 수출 정보 제공과 실제 거래 가능성을 높이는 데 활용된다. 해당 데이터는 각 국가와 지역별 무역관의 담당자가 실제 기업소재 여부 및 검증을 통하여 인증을 거치게 되고 이후 정형 인콰이어리로 홈페이지에 노출된다.
