summary_user: KOTRA가 메타·링크드인 등 SNS 마케팅으로 받은 해외 바이어 인콰이어리를 건별로 담은 파일로, 바이어 기업명(영문)·국가·도시·관심상품 내용과 HS코드·품목명을 담는다(전국·비공간, CSV 약 4.5MB). 수출기업이나 지원기관이 '우리 품목(HS코드)에 관심을 보인 해외 바이어가 어느 나라·도시에 있는가'를 찾아 타깃 시장과 접촉 대상을 고르는 데 쓴다. 전역 조인 키는 없고, HS코드로 관세청 품목별 수출입 실적과, 국가명으로 국가별 무역 통계와 이름 매핑해 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 HS코드·국가명 같은 이름·코드 매핑으로만 연결된다. 바이어 연락처나 거래 성사 여부는 필드에 없어 인콰이어리 존재 확인 이상의 거래 분석에는 쓰지 못한다.
