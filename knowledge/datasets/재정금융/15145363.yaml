description_portal: 광주광역시 서구의 본예산 기준 통계목별 지출내역을 정리한 자료입니다. 세출 예산을 부서별로 분류하고, 장·관·항·목 및 통계목 단위로 세분화하여, 사업 목적에 따라 예산이 어떻게 편성·배분되었는지를 상세히 보여줍니다.항목에는 인건비, 사무관리비, 사업추진비, 시설비, 보조금, 민간이전, 재산취득비 등 다양한 세출 유형이 포함되며, 각 통계목별 예산 총액과 전년도 예산 대비 증감 현황도 함께 제공됩니다.이를 통해 행정 분야별 지출 구조를 파악하고, 연도 간 변화, 분야별 우선순위, 투자 성격(경상/자본지출 등)을 비교·분석할 수 있으며, 지방자치단체의 예산 운용 투명성을 높이는 데 기여합니다.또한, 주민참여예산제 운영, 재정공시, 행정감사, 정책사업평가 등에 핵심적인 기초자료로 활용할 수 있습니다.
