description_portal: (연도별 회계/기금별 채권)현황 자료 제공. *해당 데이터는 공공저작물입니다. 저작권 정보를 참고하시어 데이터 이용에 유의하시길 바랍니다.국가채권은 "금전의 지급을 목적으로 하는 국가의 권리" 로 중앙정부부처의 채권을 의미다만, "국가채권 관리법" 제3조 제1항 각 호의 규정에 의거하여 벌금, 과료, 형사추징금, 과태료 및 이에 준하는 채권, 증권으로 되어 있는 채권, 한국은행에 대한 국가의 예금 및 예탁금에 관한 채권, 기부금에 관한 채권, 국세 및 관세와 이의 징수에 관련된 채권의 경우에는 이를 "국가채권 관리법"에 의해 관리되는 국가채권의 범위에서는 제외국세 및 관세와 이의 징수에 관련된 채권은 "국가채권 관리법" 적용의 대상은 아니나, "국가채권 관리법" 제3조제1항 및 동법 시행령 제2조의 규정에 따라 채권현재액보고서 및 채권현재액총계산서 보고대상에는 포함*  2024년말 현재 국가채권은 총 576.7조원으로 일반회계 84.1조원(14.6%), 특별회계 8.5조원(1.5%), 기금 484조원(83.9%)으로 구성이는 2023년 국가채권 514.2조원에 비해 62.5조원(12.2%) 증가한 것으로 일반회계에서 8.2조원(10.8%), 특별회계에서 0.02조원(0.3%), 기금에서 54.3조원(12.6%) 증가
