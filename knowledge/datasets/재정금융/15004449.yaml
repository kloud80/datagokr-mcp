description_portal: 주요 온라인 쇼핑몰에서 거래되는 다양한 온라인 상품의 가격 정보를 웹스크래핑 방식으로 자동 수집하여, 약 120여 개 품목에 대한 상품가격 데이터를 일별로 제공하고 있습니다. 해당 데이터는 OPEN API 방식으로 제공되며, 시의성 있는 물가 동향 분석, 품목 간 가격 추이 비교 등 다양한 분석 및 정책적 활용이 가능하도록 설계되었습니다.본 자료는 웹스크래핑 방식으로 수집된 데이터로, 수집 과정의 특성상 일부 노이즈가 포함되어 있을 수 있으며, 대량 판매 상품임에도 수량 정보가 누락된 레코드가 존재할 수 있다는 점을 양해해 주시기 바랍니다.본 자료는 해당 온라인 가격정보를 다운받을 수 있는 링크를 포함하고 있습니다.
