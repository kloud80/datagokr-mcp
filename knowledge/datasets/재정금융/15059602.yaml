summary_user: 파산 절차 중인 금융회사의 손익계산서를 기준일자·법인·사업연도별 계정과목 단위로 담으며, 계정과목명과 당기·전기 등 금액, 보고서 구분(영업수익·영업비용·법인세비용 등)을 제공한다. 분석가나 채권자가 특정 파산 금융회사가 파산 전후 어느 해에 얼마의 영업손실을 냈는지, 수익·비용 구조가 어떻게 변했는지 확인하는 데 쓴다. 법인등록번호(crno)가 실측 조인 키여서, 같은 키를 쓰는 파산금융회사 재무상태표·금융회사 기본정보·영업정지 정보 등 금융회사 원장 데이터와 이어 쓴다.
