description_portal: '파산금융회사손익계산서정보는 파산 절차 중인 금융회사의 손익 항목을 기준으로 수익성과 운영 실적을 확인할 수 있는 데이터입니다.기준일자와 회사명을 기준으로, 항목코드, 항목명, 당기금액, 전기금액, 재무제표 구분(영업수익, 영업비용, 법인세비용 등)을 제공합니다.데이터는 단일 오퍼레이션으로 구성되어 있으며, 세부 정보는 다음과 같습니다.① 파산금융회사손익계산서조회 : 기준일자, 법인등록번호, 사업연도를 통하여 보고서코드명, 계정과목명, 당기계정과목금액등을 조회하는 파산금융회사손익계산서조회 기능이 데이터는 파산금융회사의 경영성과 흐름과 적자 여부, 회계상 실적 구조를 파악하기 위해 활용할 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
