summary_user: 국가가 보유한 자산을 건별로 담은 원천 데이터로, 자산 대분류, 토지·건물 면적, 지번·도로명 주소, 실태조사일, 관리기관, 관리 상태를 담으며 전체 7,993,536건에 전국 범위, 기간은 2011-10-03~2014-11-08이다. 국민이나 분석가가 특정 시도에 국가자산이 어떤 위치·면적·관리 상태로 있는지 확인하는 질문에 쓴다. 도로명 주소(ntnlAstLctnRdnmAdr, ntnlAstLctnRdnmDtadr)와 시도명(ntnlAstLctnSidoNm)을 키로 다른 주소·행정구역 기반 데이터와 이어 쓴다.
description_portal: '정보공개재산정보는 기준일자 및 국가자산 소재지 시도명을 기준으로 국가가 보유한 자산에 대한 상세정보를 제공하는 데이터입니다.제공 항목에는 국가자산대분류코드명(예: 부동산), 자산의 토지 및 건물 면적값, 지번·도로명 주소, 실태조사 일자, 관리기관명, 재산관리 상태, 전화번호 등이 포함됩니다.이 데이터는 단일오퍼레이션으로 구성되어 있으며 세부 정보는 다음과 같습니다.① 정보공개재산조회 : 기준일자, 국가자산소재지시도명을 통하여 국가자산대분류코드명, 국가자산토지면적값, 국가자산소재지상세주소, 국가자산실태조사일자등을 조회하는 정보공개재산조회 기능이 데이터는 공공기관이 보유한 국가자산의 관리 현황을 확인하고, 자산의 위치·면적·상태 등의 세부사항을 파악하는 데 활용할 수 있습니다.'
