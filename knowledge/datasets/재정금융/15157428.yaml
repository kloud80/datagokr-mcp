description_portal: 단기금융증권정보서비스 단기사채는 기업이 단기 자금 조달을 목적으로 만기 1년 이하 등 일정한 요건을 갖추고 전자등록기관(한국예탁결제원)을 통하여 발행·유통·권리행사 등이 전자적으로 이루어지는 사채입니다. 단기사채는 기업어음(CP)의 법적·실무적 한계 극복, 전자증권제도 도입기반 마련, 단기금융시장 선진화 등을 위해 2013년 도입되었습니다. 단기사채 발행요건(주식·사채 등의 전자등록에 관한 법률 제59조) ① 각 사채의 금액이 1억원 이상일 것 ② 만기가 1년 이내일 것 ③ 사채금액을 한꺼번에 납입할 것 ④ 만기에 원리금 전액을 한꺼번에 지급한다는 취지가 정하여져 있을 것 ⑤ 전환권 등 다른 증권을 취득할 수 있는 권리가 부여되지 아니할 것 ⑥ 사채에 물상담보를 붙이지 아니할 것 CD 종목 기본정보
