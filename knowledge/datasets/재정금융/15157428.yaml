status: active
summary_user: 한국예탁결제원이 전자등록으로 관리하는 단기사채·CP·ABCP·CD 등 단기금융증권의 발행잔액(억원)과 잔존만기 구간별(1~10일부터 1년 이상까지) 종목수·금액 집계, 종목 기본정보를 담는 API로, 6개 오퍼레이션 중 2개가 실호출에서 응답했다. 분석가가 "지금 단기사채와 CP 잔액이 얼마이고 만기가 어느 구간에 몰려 있나"처럼 단기자금시장의 차환 부담을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 종목코드(ISIN)·발행회사 번호나 증권구분명으로 같은 기관의 다른 증권 데이터와 이름·코드 매핑으로만 잇는다.
limits: 필수 파라미터(지표구분 indType, ISIN 종목코드 isin, 발행회사 고객번호 issucoCustno)는 다른 데이터에서 먼저 받아 넘겨야 한다. CD 종목정보, 단기사채 종목정보, 발행회사별 상환액, 발행한도 등 4개 오퍼레이션은 최소 파라미터로 호출했을 때 응답이 없었다. 개발계정은 하루 100회로 제한된다.
