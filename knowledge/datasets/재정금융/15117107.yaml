description_portal: 'Tech-Safe 플랫폼을 통한 기업의 기술임치 계약 정보(신규 및 연장)1) 계약년월 : 기술임치가 계약된 년월2) 기업구분 : 법인, 개인 등 기업구분3) 창업후 7년이내 여부 : 창업후 7년이내인 창업기업 여부4) 업종구분 : IT분야, 제조업 분야 등 업종구분5) 지역구분 : 서울, 경기 등 지역구분이 데이터는 기술보증기금의 Tech-Safe 플랫폼을 통해 체결된 기술임치 계약 정보를 바탕으로 구성된 자료로, 기업의 기술 보호 활동 현황을 파악할 수 있도록 월별 계약 데이터를 제공합니다. 각 계약은 신규 또는 연장 여부에 따라 구분되며, 기업의 법인·개인 구분, 창업 7년 이내 여부, 업종 및 지역 정보가 함께 기록되어 있습니다. 이를 통해 창업 초기 기업의 기술 보호 현황이나, 업종별·지역별 임치 이용 특성을 분석하는 데 활용할 수 있습니다.'
