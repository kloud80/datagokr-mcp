description_portal: 신용보증재단중앙회가 지역신용보증재단에 공급하는 재보증 중 보증금액 2억원 이상 건에 대해서는 재보증 개별약정 심사라고 하는 더 정밀한 심사를 하게 됩니다. 그 과정에서 제출된 기업의 손익계산서 정보입니다. 개인정보 보호를 위해 기업을 특정할 수 없도록 일부 정보를 삭제하면서 임의의 고유번호를 부여하여 비식별처리 하였습니다.당기순이익금액과 주식손익금액 등의 내용으로 구성되어 있으며 재무 흐름 분석 및 정책평가, 리스크 관리의 기초자료로 활용 가능합니다.재보증이란, 신용보증재단중앙회(재보증기관)가 원보증기관인 지역신용보증재단이 소상공인에 대하여 보증한 금액의 일정비율을 재보증하고, 원보증기관이 금융기관에 대위변제 후 회수하지 못한 채권에 대하여 재보증비율에 해당하는 금액을 신용보증재단중앙회(재보증기관)가 지역신용보증재단(원보증기관)에 지급하는 제도입니다.
