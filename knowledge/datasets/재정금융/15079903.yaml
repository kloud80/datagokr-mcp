description_portal: 본 데이터는 2021년도 전북특별자치도 익산시의 지방세 징수 현황을 정리한 자료이다. 세목별 부과 금액, 수납 금액, 환급 금액 및 징수율 등의 항목을 포함하고 있으며, 이를 통해 익산시의 세정 운영 실태와 재정 건전성을 객관적으로 파악할 수 있다. 해당 자료는 지방세 징수 실적을 수치로 명확히 제시함으로써 세입 관리의 효율성 분석 및 세정 정책 수립의 기초 자료로 활용된다. 본 자료는 익산시 세무 부서에서 생성한 것으로, 행정기관, 연구자, 시민 등 다양한 수요자에게 정보 접근을 제공하고 있다. 2021년 데이터만 제공되며, 연차별 갱신은 불가한 상태이다. 지방세 운용의 투명성을 제고하고 지방재정에 대한 이해를 높이는 데 기여하는 공공데이터로서 활용 가치가 높다.
