description_portal: '-2025년 12월말 기준 청구 유형별(개인, 법인), 청구세액 규모별 과세전적부심사청구 처리 실적- 심사제외 건수에 직권시정분 포함단위 : 건, 백만원, 퍼센트과세전적부심사청구 제도의 의미세무조사결과 등에 따른 고지처분을 하기 전에 과세할 내용을 미리 납세자에게 통지한 후 이의가 있는 경우 과세관청이 과세의 적정성 여부를 검증하여 스스로 시정하는 제도로서, 이는 부실과세를 예방하고 납세자의 권익 증진과 시간적·경제적 부담을 덜어주는 선진·민주적인「사전 권리구제제도」임과세전적부심사청구의 대상은 어떤 것입니까?세무관서에서 세무조사나 감사결과 및 과세자료 처리 후, 세금을 부과하겠다는 세무조사결과통지 또는 감사결과 등 과세예고통지를 받은 경우에 과세전적부심사청구를 할 수 있는 것입니다.과세전적부심사청구서는 어디에 제출합니까?세무조사 결과통지 또는 과세예고통지의 경우에는 조사 또는 자료 처리한 세무서장 또는 지방국세청장에게, 감사결과 과세예고통지의 경우에는 그 감사를 실시한 지방국세청장 또는 국세청장에게 청구하며, 법령해석사항의 경우에는 국세청장에게 청구하는 것입니다. 지방국세청장이나 국세청장에게 청구하는 경우라도 관할세무서에 직접 또는 우편으로 제출과세전적부심사청구는 언제까지 하여야 합니까?세무서 또는 지방국세청으로부터 세무조사결과통지나 감사결과 등 과세예고통지를 받은 날부터 30일 이내에 과세전적부심사청구서를 제출'
