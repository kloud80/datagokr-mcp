summary_user: 부동산신탁회사별·기준년월별로 일반현황(조직·인원·영업점), 재무현황(자산·부채·자본금·당기순이익), 주요경영지표(수탁액·수익률·성장률)를 담은 금융회사 단위 시계열 통계이며, 범위는 전국입니다. 분석가나 투자자가 특정 부동산신탁회사의 자본금 대비 수탁액이나 수익성이 업계에서 어느 수준인지, 시간에 따라 어떻게 변했는지 확인하는 데 쓴다. 법인등록번호(crno)를 키로 금융위원회 기업정보·재무정보나 다른 업권별 금융통계와 이어 쓰고, 금융회사 코드(fncoCd)로 같은 데이터 안의 오퍼레이션끼리 연결한다.
description_portal: '금융통계부동산신탁정보는 기준년월 및 금융회사명을 기준으로 부동산신탁회사의 주요 현황과 통계를 제공하는 데이터입니다. 신탁회사의 설립 및 조직 구조, 재무현황, 주요 경영지표 등을 시계열로 조회할 수 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 부동산신탁 일반현황 조회 : 부동산신탁회사의 개요, 소재지, 조직 정보 등 일반현황을 제공합니다.② 부동산신탁 재무현황 조회 : 자산, 부채, 자본금, 당기순이익 등 재무상태와 관련된 정보를 제공합니다.③ 부동산신탁 주요경영지표 조회 : 자본금 대비 수탁액, 수익률, 성장률 등 주요 경영성과 지표를 제공합니다.'
