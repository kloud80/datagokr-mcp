description_portal: '사업자 현황이란 국세청에 등록된 사업자 유형별(법인, 일반, 간이, 면세) 가동사업자 수, 연도 중 신규 및 폐업자 수 현황을 말함가동 법인수란 영업 활동을 계속하고 있는 법인 사업자의 수가동 사업자는 사업자 등록을 한 후 영업을 계속하고 있는 사업자를 말함. 즉, 살아있는 사업체의 수로, 폐업한 법인 사업체는 포함되지 않음공익 법인이란 사회 일반의 이익을 위해 설립된 비영리 법인을 말함. 일반적으로 학술, 교육, 자선, 종교, 사회복지 등 공익 목적을 위한 사업을 수행하며, 구성원의 이익을 추구하거나 영리 활동을 하는 것을 원칙적으로 금지함- 2024년 말 현재 공익법인으로 등록된 법인을 기준으로 작성-지역별, 사업목적별(종교보급, 사회복지, 교육사업, 학술장학, 예술문화  등) 공익법인 가동 법인수(단위 : 개)'
