description_portal: '충청북도 옥천군_지역화폐 업종별 결제내역 데이터는 옥천군에서 발행하는 지역화폐(예: 옥천사랑상품권)의 실사용 내역을 업종별로 집계·정리한 공공데이터입니다. 이 데이터에는 결제가 이루어진 연도, 결제 업종, 건수, 결제금액 등이 포함됩니다. 이를 통해 옥천군 내 지역화폐가 어느 업종(예: 식음료, 소매, 생활서비스 등)에서 얼마나 활발히 이용되는지, 업종별로 결제 건수와 금액이 어떻게 분포되어 있는지 한눈에 파악할 수 있습니다. 해당 데이터는 정책 수립, 지역경제 활성화 분석, 상권 연구 등에 유용하게 활용되며, 공공데이터포털에서 누구나 무료로 다운로드해 사용할 수 있습니다. 정기적으로 업데이트되므로 최신 지역화폐 소비 트렌드 추적에도 도움이 됩니다.'
