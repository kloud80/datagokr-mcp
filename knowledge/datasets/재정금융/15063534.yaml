description_portal: 부산광역시 전체 사업에 대한 공사, 물품, 용역, 공유 재산 등에 대한 계약 심사 현황입니다.전체 사업에 대한 원가 계산, 절차, 관련 법 절차 등에 관한 심사를 하여 예산의  투명성 있는 사업 추진을 도모합니다. 평균 예산 절감률은 보통 2% 이상 되며  년 삼백 억 이상의 예산을 절감합니다.절감된 예산은 부산시의 발전이나 현안 업무 추진에  환원되며 부산시 발전과 복지를 위해 재사용 됩니다. 계약 심사를 통한 사업의 문제점을 사전에 예방하고 절차의 문제점을 도출해 냅니다.❍ 「지방자치단체 입찰 및 계약 집행기준」제3장 계약심사 운영 요령 제6절 제2관(계약심사의 활성화) ❍ 「부산광역시 계약심사업무 처리 규칙」제8조(심사결과의 관리)
