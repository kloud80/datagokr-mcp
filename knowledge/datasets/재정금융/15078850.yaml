description_portal: 이 데이터는 인천광역시 계양구의 지방세 세목별 납세 현황을 정리한 공공데이터 파일로, 과세년도, 세목명, 납세자 유형, 관내/관외 구분, 납세자 수 등의 항목을 포함하고 있습니다. 이를 통해 특정 과세연도 기준으로 지방세 항목별 납세 인원의 구성과 납세자의 주소지 유형에 따른 분포를 체계적으로 파악할 수 있습니다.과세년도는 해당 세금이 부과된 연도를 나타내며, 세목명은 재산세, 자동차세, 주민세 등 개별 지방세 항목을 명시합니다. 납세자 유형은 개인, 법인 등 납세자의 구체적인 구분을 제공하고, 관내/관외 항목은 납세자의 주소지가 계양구 관내인지 외 지역인지에 따라 구분합니다. 납세자 수는 각 조건에 해당하는 실제 납세 인원을 숫자로 나타낸 항목입니다.이 데이터는 지방세 징수 전략 수립, 세수 추이 분석, 납세자 분포 이해, 관내외 경제활동 분석 등 다양한 행정적·정책적 활용이 가능하며, 나아가 지역 재정 운용의 기초자료로서도 중요하게 활용될 수 있습니다. 계양구는 이러한 재정정보를 투명하게 공개함으로써 주민의 알권리를 보장하고, 데이터 기반의 공공행정 실현에 기여하고자 합니다.
