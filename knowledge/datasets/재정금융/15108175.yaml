summary_user: 개인사업자의 금융 현황을 기준년월 단위로 담는 데이터로, 대표자 성별·연령대, 설립연도, 사업장 지역, 업종, 종업원 규모별로 보증잔액(보증잔액정보 오퍼레이션)과 요구불예금·대출금액(예금·대출정보 오퍼레이션), 운전자금·시설자금 대출 여부를 전국 범위로 제공한다. 정책 분석가나 연구자가 '특정 지역·업종의 개인사업자가 대출과 보증에 얼마나 의존하는가'를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 업종코드(bizBzcCd)나 지역명을 이름·코드로 매핑해 연결해야 하며 사업자번호로 개별 사업자와 잇는 것은 불가하다.
description_portal: '개인사업자금융정보는 보증잔액정보, 예금대출정보를 조회할 수 있으며, 주요 구성항목은 개인사업자의 설립일, 업종 및 지역정보와에 요구불예금액, 대출금액 및 보증잔액 등이 제공됩니다.이 데이터는 2개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 개인사업자 예금·대출정보 조회 : 업종 및 지역별 요구불예금, 대출금액, 수신액 등 금융현황을 조회합니다.② 개인사업자 보증잔액정보 조회 : 업종·지역별 보증잔액 현황을 기준년월 단위로 조회할 수 있습니다.※ 데이터는 매년 1회 갱신됩니다.'
