summary_user: 개인사업자의 대표자 성별·연령대, 설립연도, 사업지역, 업종, 종업원 규모와 함께 재무기준연도별 매출액·영업이익·당기순이익·자산·부채·자본 금액을 전국 범위로 담는 API이며, 매출액·영업이익·부채 3개 오퍼레이션으로 나뉜다. 분석가나 창업 준비자가 "특정 지역·업종 개인사업자의 매출과 부채 수준은 어느 정도인가" 같은 업종·지역별 사업성과와 재무구조를 비교하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업종코드(bizBzcCd)·업종명이나 지역명을 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: '개인사업자재무정보는 개인사업자의 재무정보, 매출액정보, 부채정보를 조회할 수 있으며, 주요 구성항목으로는 개인사업자의 설립일, 업종 및 지역정보와에 매출액, 영업이익, 부채정보 등이 제공됩니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 개인사업자 매출액정보 조회 : 업종·지역 기준으로 개인사업자의 연도별 매출액 정보를 제공합니다.② 개인사업자 영업이익정보 조회 : 영업이익 및 이익률 등 사업성과 관련 지표를 제공합니다.③ 개인사업자 부채정보 조회 : 총부채, 부채비율 등 개인사업자의 부채 구조를 조회할 수 있습니다.※ 데이터는 매년 1회 갱신됩니다.'
team:
