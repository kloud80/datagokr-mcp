summary_user: 경기도 내 지방세 납부 현황을 과세연도·세목·납부매체(가상계좌, 신용카드, 지로, 신용카드포인트 등)별로 묶어 납부건수, 납부금액, 납부매체비율을 담은 집계 통계다. 지자체 세정 담당자나 분석가가 '세목별로 어떤 납부매체가 많이 쓰이고, 전자고지 여부에 따라 납부 방식이 어떻게 달라지는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도명(sido_nm)·자치단체코드 같은 이름·코드 매핑으로만 다른 시도·시군구 지역 지표와 이어 쓴다.
description_portal: '이 데이터는 경기도 내 지방세의 납부 현황을 연도별로 정리한 통계자료로, 세목별 납부 건수 및 납부 금액, 납부매체 유형 등의 정보를 포함하고 있습니다. 지방세 수납의 흐름과 징수 방식의 변화를 파악할 수 있습니다. 이 자료는 납부 매체별 선호도 분석, 전자고지 도입 효과 검토, 연도별 납세 트렌드 파악 등을 통해 세정업무 디지털화 및 징수율 개선 전략 수립에 활용될 수 있습니다. 또한 세목별 징수 실적 비교를 통해 지방재정 안정성 확보 및 예산 계획 수립에도 기초자료로 유용하게 쓰입니다. * 납부매체 : 가상계좌, 신용카드, 지로, 신용카드포인트 등  * 시도명, 지차단체코드, 과세연도, 세목명, 납부매체, 납부매체전자고지여부, 납부건수, 납부금액, 납부매체비율이 포함되어 있습니다.'
