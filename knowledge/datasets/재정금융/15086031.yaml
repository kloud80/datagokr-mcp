description_portal: 이 데이터는 기술보증기금이 제공하는 ‘기술평가정보_업종별 현황’으로, 기준년월을 기준으로 기업의 법적 형태 및 업종별 기술평가 건수를 집계한 자료입니다.주요 항목은 ‘기준년월’, ‘기업형태구분’, 그리고 업종별 항목으로 구성되어 있습니다.‘기준년월’은 데이터가 수집된 시점을 연월 단위로 나타낸 항목입니다.‘기업형태구분’에는 ‘개인’, ‘주식’, ‘합자’, ‘합명’, ‘유한’, ‘기타’ 등 다양한 법적 형태가 포함되어 있으며, 각 기업 형태별로 기술평가가 몇 건 수행되었는지를 보여줍니다.업종 항목은 ‘기계’, ‘재료금속’, ‘전기전자’, ‘정보통신’, ‘화공’, ‘건설’, ‘기타제조’, ‘사업서비스’, ‘섬유’, ‘환경’, ‘농업’, ‘기타’로 구성되어 있으며, 해당 업종에 속한 기술평가 건수를 정수형 값으로 제공합니다.모든 데이터는 월별로 구성되어 있어, 일정 기간 동안의 누적 현황이 아닌 해당 월의 단일 통계임을 알 수 있습니다.이 데이터는 업종별로 기술평가 수요가 어느 정도 분포되어 있는지를 확인할 수 있도록 구성되어 있으며, 기업의 법적 형태와 업종 간의 교차 구성이 특징입니다.각 행은 특정 기준년월과 기업 형태의 조합으로 구성되어 있으며, 해당 조건에 해당하는 업종별 기술평가 건수가 함께 제시되어 있습니다.
