description_portal: 중소벤처기업진흥공단 정책자금 중 하나인 재창업자금의 업력별 지원현황을 나타내는 데이터입니다.재창업자금 지원기업의 업력에 대한 데이터를 신청내역 건별로 추출하였습니다.상세 내용으로는 예비 창업자, 3개월 미만, 1년 미만, 1년 이상~3년 미만, 3년 이상으로 업력을 구분하여 지원 상세 항목을 제공합니다.해당 자료에는 재도전 기업의 특성과 지원 성과에 관한 정보가 포함되어 있어, 재창업 활성화와 기업 재도전 지원정책의 효과를 분석하는 데 활용할 수 있습니다.또한 재도전 기업 관련 통계 구축에 기여함으로써 정책의 실효성을 높이고, 중소기업의 재기 문화 확산에도 도움을 줄 수 있는 기초자료로 활용될 수 있습니다.
