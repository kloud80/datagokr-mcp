description_portal: '2013년부터 2022년까지 통신 분야 시계열 자료2021년까지는 결산, 2022년은 2차 추가경정예산 기준으로 작성*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시우정사업행정지원: 기본경비, 기본경비성 비용우정서비스: 안정적 수익을 바탕으로 언제 어디서나 편리하게 이용할 수 있는 대국민 우편서비스 제공인공지능데이터진흥: 인공지능과 데이터가 경제성장과 사회혁신의 동력으로 작용할 수 있도록 데이터댐 구축, 인프라 확충, 기술개발 등 산업 생태계 강화우체국예금: 우체국예금의 내실화와 지속가능경영 기반 강화를 통해, 국민의 저축의욕 고취, 보편적 금융서비스 제공을 통해 국민경제생활의 안정과 공공복리의 증진에 기여정보통신융합산업: 정보통신방송융합산업의 경쟁력을 강화하고 산업인프라 구축SW산업진흥: SW기술 경쟁력을 강화하고, 기업 성장 환경을 조성우체국보험: 우체국보험의 안정적 사업운영을 통해 고객가치를 증진인터넷융합산업: ICT융합 신산업 기반 조성과 융합기술 확산을 통해 신시장 창출 촉진정보보호및활용: 안전한 인터넷 사회구현을 위해 정보보호 강화과학기술정보통신부운영지원: 방송통신재난·행정의 역량을 강화, 사이버공격으로부터 국가 중요 과학기술정보 및 행정업무정보 등을 보호하고 관리체계를 강화하여 신뢰받는 대국민 서비스 제공'
