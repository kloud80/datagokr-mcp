summary_user: 관세청이 수출입 신고를 기초로 시도별·성질별(수입은 소비재·원자재·자본재, 수출은 식료 및 직접소비재·원료 및 연료·경공업품·중화학 공업품)로 월 단위 집계한 수출입 실적으로, 전국을 시도 단위로 다룹니다. 지자체·분석가가 '우리 시도의 중화학 공업품 수출액이 기간별로 어떻게 변했나' 같은 지역 무역구조 질문에 씁니다. 실측 컬럼에 전역 조인 키가 없어 시도명·성질코드(tmprTpcd) 같은 이름·코드 매핑이나 같은 관세청의 품목·국가·시군구별 수출입 실적과 맞춰 이어 씁니다.
limits: 집계 통계라 개별 신고 건이나 HS 10단위 품목 수준 분석에는 쓰지 못하며, 다른 데이터와 직접 결합할 공통 키가 없습니다. 시도 단위까지만 제공되므로 시군구 분석은 별도 데이터가 필요합니다.
