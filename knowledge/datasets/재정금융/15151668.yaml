summary_user: 예금보험공사 잘못 보낸 돈 되찾기 서비스(착오송금 반환지원제도)를 신청한 건을 한 행씩 담은 원본 데이터로, 2021년 7월~2026년 3월 신청 건의 나이·성별·지역·송금방법·착오유형·착오송금액·수취인 반환금·종결사유를 담는다(금액 단위 천원, 범위 전국). 착오송금이 어떤 연령대·송금방법·유형에서 많이 일어나고 신청 건이 얼마나 반환으로 종결되는지 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역 이름이나 발생·신청 월 같은 값으로만 맞춰 이어 쓴다.
description_portal: '2021년 7월부터 송금인이 실수로 보낸 돈을 되찾을 수 있도록 예금보험공사는 "잘못 보낸 돈 되찾기 서비스"(착오송금 반환지원제도)를 운영하고 있습니다. 동 서비스의 2021년 7월~2026년 3월 기간 중 잘못 보낸 돈 되찾기 서비스를 신청한 건들의  주요 속성(연령대, 성별, 송금 방법, 지역, 유형, 종결 사유 등)을 포함된 데이터(원본데이터)입니다.  한편 동 원본데이터의 주요 속성별 분포 및 특징을 통계적으로  잘 반영하도록 가공한 데이터(합성데이터)로도 개방이 되어있으니, 이용에 참고 부탁드립니다.금액 단위: 천원'
