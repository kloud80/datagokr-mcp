description_portal: 근로소득은 일반적으로 고용관계 또는 이와 유사한 계약에 의하여 비독립적 인적용역인 근로를 제공하고 그 대가로 지급받은 소득(봉급·급료·보수·세비·상여금·직무발명보상금 등)으로,사업소득, 기타소득, 퇴직소득과의 구분(근로소득) 고용관계나 이와 유사한 계약에 의하여 근로를 제공하고 지급받는 대가 → 간이세액표에 따라 원천징수(사업소득) 고용관계 없이 독립된 자격으로 계속적으로 용역을 제공하고 지급받는 대가 → 수입금액의 3퍼센트를 원천징수(기타소득) 일시적으로 용역을 제공하고 지급받는 대가 → 기타소득금액(수입금액-필요경비)의 20퍼센트를 원천징수(퇴직소득) 사용자 부담금을 기초로 하여 현실적인 퇴직을 원인으로 지급받는 소득 등 → 퇴직시 원천징수근로소득 백분위(상위 1퍼센트 1,000분위) 자료- 인원(명)- 총급여액(억 원)- 근로소득금액(억 원)- 소득공제금액(억 원) (인적공제+연금보험료공제+특별소득공제+그밖의소득공제-소득공제 종합한도 초과액)- 과세표준(억 원)- 결정세액(억 원)* 주기성 과거 데이터는 연도별 데이터 항목(컬럼) 및 해당 파일에서 단위 확인 요망각 분위에 대한 근로소득 합계의 값이며, 상위 1퍼센트 이내에서만 0.1퍼센트 단위로 나타냄
