summary_user: 마산·군산·대불·동해·율촌·울산·김제 등 전국 자유무역지역에 입주한 기업을 한 행에 한 업체씩 담은 파일(csv, 약 47KB)로, 업체명·주소와 임대면적·주생산품·투자국·입주허가일을 담는다. 특정 자유무역지역에 어떤 외국인투자 기업이 어떤 품목을 생산하며 입주해 있는지 확인하려는 투자유치 담당자나 협력사를 찾는 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소를 기준으로 매핑해야 이어 쓸 수 있다.
description_portal: 자유무역지역(FTZ, Free Trade Zone)은 관세법·대외무역법 등에 대한 특례를 적용하여 자유로운 제조, 물류, 유통, 무역 활동을 보장하기 위해 정부가 지정한 지역으로서, 해당 데이터는 마산자유무역지역,군산자유무역지역, 대불자유무역지역, 동해자유무역지역, 율촌자유무역지역, 울산자유무역지역, 김제자유무역지역 등 기업활동을 촉진하고 외국인 투자를 유치하기 위해 조성된 자유무역지역 내 입주한 입주기업들의 현황자료(업체명, 주소, 주생산품, 투자국, 입주허가일 등)를 제공하는 데이터입니다.
