description_portal: '이 데이터는 경상북도 봉화군의 주민 1인당 지방세 부담액 정보를 연도별로 제공합니다. 주민과 세대별로 부담하는 지방세의 수준을 분석할 수 있으며, 인구수, 세대수, 총 지방세 금액 등을 포함하여 세부적인 통계 분석이 가능합니다. 이를 통해 지방세의 추이, 인구 대비 세수 변화 등을 파악하고, 세무행정 기초자료 또는 지역 재정 계획 수립에 활용할 수 있습니다.[제공 컬럼 설명]시도명: 경상북도 등 시·도 단위의 명칭시군구명: 봉화군 등 시·군·구 단위의 명칭자치단체코드: 행정구역을 구분하기 위한 고유 코드 (예: 47920)과세년도: 해당 데이터의 기준 연도 주민1인당 부담금액: 주민 1명이 부담한 평균 지방세 금액 (원 단위)세대당부담금액: 1세대가 부담한 평균 지방세 금액 (원 단위)지방세 금액: 해당 연도 총 부과된 지방세 총액 (원 단위)인구수: 기준연도의 주민등록상 총 인구 수세대수: 기준연도의 전체 세대 수'
