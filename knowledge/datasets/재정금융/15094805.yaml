summary_user: 한국거래소의 석유 전자상거래시장·KRX 금시장·탄소배출권시장 일별 시세를 오퍼레이션 3개(석유·금·배출권)로 담으며, 전체 20,556건에 기간은 2025-05-21~2026-10-01이다. 금 값이나 배출권 가격이 최근 어떻게 움직였는지, 휘발유·등유·경유 거래가 어떠했는지 확인하려는 분석가나 사업자가 쓴다. 금·배출권 시세는 종목코드(단축코드 srtnCd, ISIN isinCd)가 종목 키로 있어 상장종목·기업 공시 등 같은 키를 쓰는 증권 시장 데이터와 잇고, 석유 시세는 유종 구분으로 조회해 이 키가 없다.
description_portal: '일반상품시세정보는 한국거래소에서 제공하는 주요 일반상품의 시장 시세 정보를 제공하는 데이터입니다. 해당 정보는 석유전자상거래시장, KRX 금시장, 탄소배출권시장에 상장된 상품들의 실시간 시세, 전일 대비 등락률, 거래량 등을 포함합니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 석유시세 : 석유전자상거래시장에 상장된 석유상품의 시세 정보를 조회합니다.② 금시세 : KRX 금 시장에 상장된 금 상품의 시세 정보를 제공합니다.③ 배출권시세 : 탄소배출권 시장에 상장된 배출권 상품의 시세 정보를 조회합니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
