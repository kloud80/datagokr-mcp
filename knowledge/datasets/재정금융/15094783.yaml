description_portal: '소매채권수익률정보는 금융투자협회에서 제공하는 신용등급 및 만기에 따른 소매채권 수익률 통계를 요약 제공하는 데이터입니다. 각 등급별·만기별 수익률 현황은 투자 판단 및 시장 분석 등에 활용되며, 정기적으로 갱신되는 수치 기반의 요약 정보를 제공합니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 소매채권수익률요약 조회 : 신용등급과 잔존만기 구간별로 분류된 소매채권 수익률 요약 정보를 조회합니다.※ 소매채권이란? 증권사가 채권을 대량으로 사들인 후 소액으로 쪼개 판매하는 채권※ 소매채권수익률정보 API는 해당 정보 제공에 대한 서비스 이용률 저조로 인해 데이터 제공기관에서 서비스가 폐지되었습니다.이에 따라 신규 데이터는 생성되지 않으며, 과거 데이터만 제공됩니다. 데이터 제공 범위는 2022.03.25까지입니다.'
