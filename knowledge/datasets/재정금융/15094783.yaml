summary_user: 금융투자협회가 산출한 소매채권 수익률을 신용등급과 잔존만기 구간별로 요약한 집계 데이터로, 기준일자(basDt)별 등급·만기 구간의 수익률 값을 담으며 포털 설명상 서비스 폐지로 2022년 3월 25일까지의 과거 데이터만 제공된다. 개인 투자자나 분석가가 '과거 특정 시점에 AA등급 3년 만기 소매채권 수익률은 얼마였나'처럼 등급·만기별 수익률 수준과 추이를 되짚어 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 채권 시세·발행 데이터와는 기준일자와 신용등급 이름을 맞춰 붙이는 방식으로만 연결한다.
limits: 개별 종목 코드가 없는 등급·만기 구간 요약치라서 특정 채권 종목의 수익률은 확인하지 못하고, 다른 데이터와 키로 바로 조인되지 않는다. 신규 데이터가 생성되지 않으므로 2022년 3월 이후 시점 분석에는 쓰지 못한다.
