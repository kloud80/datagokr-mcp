description_portal: 'ㅇ 공공데이터 제공신청으로 2019.07~2019.12 기간의 대 중국 수출 품목(HS 4단위) 정보를 2020년에 개방했으며, 이후 1년 기간으로 데이터를 제공: 순번, 품목코드(HS4), 품목명 등ㅇ 수출입통계는 1965년 제 13차 UN 통계위원회의 권고에 의해 출간된 "International Merchandise Trade Statistics Concepts and Definitions"에 따라작성되며, 물품이 국가 간에 이동함으로써 국내 자원량의 증가 또는 감소를 가져오는 경우에 수출입통계로 계상하는 것이 원칙이며, 정상적인 통관시 수출입신고수리일을 기준으로 계상ㅇ 수출은 본선인도가격(FOB가격), 수입은 보험 및 운송가격을 포함한 가격(CIF가격)을 기준으로 함ㅇ 주요한 경제지표인 수출입 동향 지표에 대한 시의적절한 분석 및 공표를 통해 산업활동, 경제정책 수립과 정책대응에 기여'
