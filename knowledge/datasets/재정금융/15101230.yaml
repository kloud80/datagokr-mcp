description_portal: 관세법 제18조(과세환율)에 따른 "과세가격을 결정하는 경우 외국통화로 표시된 가격을 내국통화로 환산할 때에는 제17조에 따른 날(보세건설장에 반입된 물품의 경우에는 수입신고를 한 날을 말한다)이 속하는 주의 전주(前週)의 기준환율 또는 재정환율을 평균하여 관세청장이 그 율을 정한다." 과세환율입니다. 수출 및 수입, 적용개시일자, 주간환율구분코드를 이용하여 관세환율정보서비스의 국가부호, 화폐단위명, 환율, 통화부호, 적용개시일자, 수출입구분 등을 조회 할 수 있는 서비스입니다. 관세청 누리집을 통해 수출입 주요국가(미국, 일본, 유럽, 중국) 관세환율을 시각적으로 개방하고 있고, 유니패스(unipass.customs.go.kr) > 정보조회 > 신고인지원정보 > 주간환율에서 파일 데이터로 다운받아 보실 수 있습니다.
