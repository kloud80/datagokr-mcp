description_portal: '금융통계공통(신탁)정보는 금융업권별 신탁 관련 통계를 제공하는 데이터입니다. 증권사, 보험사, 부동산신탁회사의 인원 현황과 신탁보수금액, 회사 현황 등을 기준년월별로 조회할 수 있습니다.이 데이터는 6개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.1. 증권사 인원 현황 조회 : 증권사별 신탁업무 인원 수 및 변동 현황을 조회합니다.2. 보험사 인원 현황 조회 : 보험사별 신탁업무 인력 구성 및 증감 현황을 제공합니다.3. 부동산신탁회사 인원 현황 조회 : 부동산신탁회사별 인원 수 및 신탁 관련 조직 규모를 조회합니다.4. 신탁보수금액 조회 : 업권별 신탁보수 총액, 항목별 수익 구조 등을 조회합니다.5. 신탁회사 현황 조회 : 각 업권별 신탁회사 수, 분류, 구조 등 일반 현황 정보를 제공합니다.6. 신탁보수 상세내역 조회 : 신탁보수금액의 항목별 세부 구성 및 통계를 조회합니다.'
