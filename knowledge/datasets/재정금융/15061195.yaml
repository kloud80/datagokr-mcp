summary_user: 증권사·보험사·부동산신탁회사의 신탁 관련 통계를 금융회사별·기준년월(basYm)별로 담으며, 인원 현황, 신탁보수금액과 상세내역, 신탁회사 현황 등 6개 오퍼레이션으로 나뉜 전국 단위 비공간 데이터다. 분석가가 특정 업권이나 회사의 신탁업무 인력 규모와 신탁보수 수익 구조가 기간에 따라 어떻게 변했는지 비교하는 데 쓴다. 법인등록번호(crno)가 실측 조인 키여서 금융회사 기본·재무·지배구조 등 다른 금융회사 원장 데이터와 회사 단위로 이어 쓴다.
limits: 6개 오퍼레이션 중 실호출로 확인된 것은 1개뿐이어서 나머지 오퍼레이션의 응답은 따로 확인해야 한다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다. 금융회사 단위 업권 통계이므로 개별 신탁상품이나 위탁자 단위 정보는 담지 않는다.
