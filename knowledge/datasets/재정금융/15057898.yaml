summary_user: 경기도 내 공공기관이 운영하는 행복카셰어 차량 보유 현황을 소속기관별로 집계한 데이터로, 승용차 경차·소형·중형·대형과 소형 승합차 대수, 합계를 담는다. 공공차량 운영을 분석하는 담당자나 연구자가 '어느 기관이 행복카셰어 차량을 몇 대, 어떤 차급으로 보유하고 있는가'를 확인하고 차량 배분이나 친환경차 교체 계획을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 소속기관명(POSITN_NM)을 이름으로 맞추거나 같은 기관 코드로만 연결한다.
description_portal: 행복카셰어 기관별 차량 집계 현황 데이터는 경기도 내 공공기관에서 운영하는 행복카셰어 차량의 보유 현황을 나타내며, 소속기관명, 승용차 수, 승합차 소형 수, 합계 등의 항목으로 구성되어 있습니다. 해당 데이터는 기관별 차량 보유 규모와 차종별 분포를 확인할 수 있어 공공차량 운영 효율성 평가 및 차량 배분 정책 수립에 활용할 수 있습니다. 또한 차량 유형별 보유 현황은 기관의 업무 특성과 차량 활용 목적을 반영하므로, 향후 공용차량 운영계획 수립, 친환경차 교체 정책, 교통자원 최적화 연구 등에 중요한 기초자료로 제공됩니다.
