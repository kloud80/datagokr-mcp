description_portal: 경상북도 구미시의 지방세 금액 중 비과세·감면액이 차지하는 비율에 대한 데이터로, 구미시의 지방자치단체 코드, 세목명, 과세년도, 비과세 건수 및 금액, 감면 건수 및 금액, 부과금액, 그리고 이를 바탕으로 산출된 비과세감면율의 정보가 포함되어 있습니다. 세목별로 지방세 부과 규모와 비과세·감면에 따른 실제 세수 감소 규모를 함께 확인할 수 있어, 특정 세목에서 어느 정도의 세제 지원이 이루어지고 있는지 파악할 수 있도록 구성되어 있습니다. 또한 연도별·세목별 비교를 통해 비과세·감면 규모의 변화 추이와 세수 구조 변화를 분석할 수 있으며, 지방세수 운영의 효율성 분석, 조세정책 수립 및 평가, 감면제도의 적정성·합리성 검토, 재정 운용 계획 수립 등 다양한 행정·정책 분야에 활용 가능합니다.
