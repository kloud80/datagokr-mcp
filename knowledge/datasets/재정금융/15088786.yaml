description_portal: '부산광역시 지역화폐(동백전) 가맹점 현황으로 가맹점명, 도로명주소, 데이터기준일자에 대한 항목을 제공합니다.부산광역시의 지역화폐인 동백전은 지역 경제 활성화를 위해 발행된 카드형 지역사랑상품권입니다2026년 1월부터 6월까지 적용되는 캐시백 정책은 가맹점의 매출 규모에 따라 차등 적용됩니다.부산시 내 신용카드 단말기가 있는 가맹점에서 대부분 사용 가능하지만, 일부 제한되는 곳이 있습니다.이용방법은 먼저 앱 설치: 스마트폰에서 "동백전" 앱을 다운로드합니다.앱내에서 카드를 신청하고 계좌 연결 후 금액 충전하여 사용합니다.'
