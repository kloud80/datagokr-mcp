description_portal: 금융회사공시정보는 금융회사와 관련된 경영·재무 등 주요 변동사항을 외부 이해관계자에게 제공하기 위한 공시 항목을 제공하는 데이터입니다. 배당, 유상·무상증자, 주주총회 소집, 자산양수도, 영업정지, 소송, 합병 등 다양한 기업 공시 정보를 통해 금융회사의 지배구조 및 재무활동 변화를 종합적으로 파악할 수 있도록 구성되어 있습니다.이 데이터는 다음의 30개 오퍼레이션으로 구성되어 있습니다.금융회사배당공시정보, 금융회사유상증자결정공시정보, 금융회사무상증자결정공시정보, 금융회사주주총회소집공고공시정보, 금융회사주식매수선택권부여에관한신고공시정보, 금융회사사외이사의선임·해임또는중도퇴임에관한신고공시정보, 금융회사자산양수도(기타)_풋백옵션공시정보, 금융회사영업정지공시정보, 금융회사회생절차개시신청공시정보, 금융회사해산사유발생공시정보, 금융회사감자결정공시정보, 금융회사채권은행등의관리절차개시공시정보, 금융회사소송등의제기공시정보, 금융회사해외증권시장주권등상장공시정보, 금융회사해외증권시장주권등상장폐지공시정보, 금융회사전환사채권발행결정공시정보, 금융회사신주인수권부사채권발행결정공시정보, 금융회사교환사채권발행결정공시정보, 금융회사상각형조건부자본증권발행결정공시정보, 금융회사자기주식취득결정공시정보, 금융회사자기주식처분결정공시정보, 금융회사영업양도결정공시정보, 금융회사타법인주식및출자증권양수결정공시정보, 금융회사타법인주식및출자증권양도결정공시정보, 금융회사주권관련사채권양수결정공시정보, 금융회사주권관련사채권양도결정공시정보, 금융회사회사합병결정공시정보, 금융회사회사분할결정공시정보, 금융회사회사분할합병결정공시정보, 금융회사주식교환·이전결정공시정보※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)
