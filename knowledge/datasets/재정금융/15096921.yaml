summary_user: 제주특별자치도의 지역내총생산(GRDP)을 기준 연월과 산업 분류별로 백만원 단위로 담은 시도 단위 집계 통계입니다. 분석가나 정책 담당자가 제주 경제에서 서비스업과 제조업·농림수산업의 비중이 시기별로 어떻게 달라졌는지 확인할 때 씁니다. 전역 조인 키가 없으므로 다른 제주 통계와는 산업 분류 이름이나 기준 연월을 직접 맞춰 이어 씁니다.
description_portal: 이 데이터셋은 제주특별자치도 내에서 산업별로 산출된 지역내총생산(GRDP)을 집계하여 제공하는 공공 통계자료이다. GRDP는 일정 지역에서 일정 기간 동안 생산된 재화와 서비스의 시장가격 기준 부가가치 총합으로, 지역 경제규모와 산업구조를 파악하는 핵심 지표이다. Gross Regional Domestic Product(GRDP)를 산업별로 세분화 한 본 자료는 농림수산업, 제조업, 건설업, 서비스업 등 여러 산업 분야가 제주 경제에 기여한 정도를 정량적으로 보여준다. 이를 통해 제주도의 산업 구조와 경제 성과, 산업 간 비중 변화 추이, 지역 경제의 특징 및 취약 산업 식별, 정책 수립 및 경제계획에 대한 근거 자료로 활용할 수 있다. 지방자치단체, 연구기관, 정책 입안자뿐 아니라 민간 투자자·분석가에게도 지역의 경제 잠재력, 산업 다각화 상태, 성장 가능성 등을 평가하는 기초 데이터로 매우 유용하다. 자료는 CSV 혹은 공개 데이터 형식으로 제공되어 누구나 접근 및 분석 가능하다.
