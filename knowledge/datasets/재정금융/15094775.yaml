description_portal: 'KRX상장종목정보는 한국거래소에 상장된 종목의 기본 정보를 제공하는 데이터입니다.데이터는 단일 오퍼레이션으로 구성되어 있으며,기준일자 또는 ISIN코드 등을 기준으로, 기준일자, 단축코드, ISIN코드, 시장구분, 종목명, 법인등록번호, 법인명 정보를 제공합니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)※ ISIN코드란 ? 국제증권식별번호(ISIN : International Securities Identification Number)라는 명칭으로 널리 통용되고 있는 증권표준코드로 모든 증권상품에 개별적으로 부여되고 있는 12자리 고유번호이 데이터는 상장종목 분석, 투자자 정보 제공, 시장 현황 파악, 산업별 분류 통계 생성 등 다양한 자본시장 관련 분석에 활용할 수 있습니다.※ 외국회사의 경우 국내법인번호를 제공하지 않습니다. ※ 외국회사는 대한민국 외의 국가에서 설립되어 해당 국가의 법령에 따라 등록, 운영되는 법인을 의미하며, 국내에 별도의 법인등록을 하지 않은 경우 국내 법인등록번호가 존재하지 않습니다.'
