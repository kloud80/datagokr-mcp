description_portal: 이 데이터는 신용보증기금의 매출채권보험 인수 현황을 기업 규모별로 구분하여 제공하는 자료로, 각 규모별 기업이 보험에 가입한 건수(인수 업체 수)와 보험으로 인수된 총 금액(인수금액)을 포함하고 있다. 매출채권보험은 중소기업이 제품이나 서비스를 외상으로 판매한 뒤, 구매처의 대금 미지급 위험에 대비할 수 있도록 도입된 제도로, 신용보증기금이 보험사 역할을 하여 외상매출채권의 손실을 일정 범위 내에서 보상한다. 기업 규모는 일반적으로 중소기업, 중견기업, 대기업 등으로 구분되며, 이 데이터를 통해 각 기업군의 매출채권보험 활용 실태와 수요 규모를 파악할 수 있다. 또한 이는 기업 간 거래의 신뢰성 확보, 중소기업의 자금 회수 안정성 제고, 연쇄도산 방지 등의 정책 목적 달성에 기여하는 금융지원 성과를 평가하는 데 활용될 수 있는 기초자료이다.
