description_portal: '한국자산관리공사_중소기업 정상화 지원현황 정보한국자산관리공사 기업지원사업 중 자산매입후재임대 프로그램의 지원현황 데이터를 제공합니다.(지원기업의 업종, 기업 소재지, 자산종류 목록 등)[참고 : 자산매입후재임대 프로그램]1. 개요 : 일시적 경영애로를 겪고 있는 기업의 자산을 임대조건부 매매계약 등으로 인수하여 기업의 신속한 경영정상화를 지원하는 프로그램2. 프로그램 참여시 장점 : 사업기반 유지 가능, 기업 신용도 제고, 사후지원 제공, 매각절차의 공정성3. 대상기업 : 기업 보유자산 매각대금으로 금융회사 차입금을 상환하여 재무구조를 개선하고자 하는 기업, 협약 금융회사가 기업의 경영정상화 가능성이 높다고 판단하여 추천하는 기업4. 매입제한 부동산 : 재산권 행사에 제약이 있는 부동산, 개인 소유의 부동산 등자세한 사항은 캠코 온기업 홈페이지에서 확인하시기 바랍니다.https://oncorp.kamco.or.kr/'
