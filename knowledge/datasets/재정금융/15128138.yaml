description_portal: 해당연도 신고분 원천징수이행상황 신고실적을 집계하여 작성. 동일한 소득에 대하여 원천징수이행상황을 두번 신고하는 경우 신고건수와 총지급액은 이중으로 계상됨소득지급액은 과세미달과 비과세 지급분을 포함. 근로소득의 경우 신규입사자 및 중도퇴사자의 급여가 다수 포함되어 있으므로 근로자의 급여수준에 대한 지표로 사용하기 곤란함원천징수세액은 가산세가 포함된 금액임신고건수는 원천징수의무자의 소득종류별 원천징수이행상황 신고 건수임법인사업자중 본점일괄납부제도를 신청한 원천징수의무자의 원천징수 이행상황 신고 현황을 의미함원천징수의무자가 해당연도에 제출한 원천징수이행상황신고서를 원천징수지별, 징수의무자유형별로 소득지급액 등을 집계한 현황개인사업자, 법인사업자(본점 일괄납부자 등)
