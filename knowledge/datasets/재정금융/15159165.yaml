description_portal: 본 데이터는 인천광역시에서 발생하는 지방세 세목별 비과세 및 감면 현황을 관련 법령과 지출예산 근거에 따라 체계적으로 정리한 통계 자료입니다.지방세법 및 조례에 근거한 취득세, 재산세, 지방소득세 등 주요 세목에 대하여 연도별 비과세 금액과 감면 금액을 상세히 제공합니다. 이를 통해 조세 감면 정책이 지역 경제와 취약계층 지원 등에 미치는 재정적 영향을 객관적으로 파악할 수 있으며, 시민들에게는 세제 혜택의 규모를 투명하게 공개하여 조세 행정의 신뢰도를 높이는 데 목적이 있습니다.해당 데이터는 제공신청으로 개방되는 1회성 데이터로 2013~2024년도 데이터입니다.
