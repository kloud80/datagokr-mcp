description_portal: '이 데이터는 기술보증기금의 업종 및 대출 종류별 보증 및 사고 현황을 나타냅니다. 각 업종과 보증 종류별로 법인 및 개인에 대한 보증 건수, 잔액, 사고 건수, 사고 금액 등을 제공합니다. 이를 통해 보증사고가 발생한 규모와 비율을 분석할 수 있습니다.데이터 구성연도구분: 보증 및 사고 현황이 기록된 연도 및 분기 (예: 2015년1분기)업종구분: 보증 및 사고 현황이 구분되는 업종 (예: 제조업, 환경업)보증종류: 보증의 종류 (예: 대출보증, 비은행대출보증, 기타)법인보증건수: 법인에 대한 보증 건수법인보증잔액(억원): 법인에 대한 보증 잔액 (억원 단위)개인보증건수: 개인에 대한 보증 건수개인보증잔액(억원): 개인에 대한 보증 잔액 (억원 단위)법인사고건수: 법인에 발생한 보증사고 건수법인사고금액(억원): 법인에 발생한 보증사고 금액 (억원 단위)법인사고율: 법인에 대한 보증사고 발생 비율 (퍼센트 단위)개인사고건수: 개인에 발생한 보증사고 건수개인사고금액(억원): 개인에 발생한 보증사고 금액 (억원 단위)개인사고율: 개인에 대한 보증사고 발생 비율 (퍼센트 단위)이 데이터는 기술보증기금의 보증과 사고 현황을 상세히 분석할 수 있도록 도와주며, 업종별, 보증 종류별로 보증 건수 및 사고 금액과 비율을 파악할 수 있습니다.'
