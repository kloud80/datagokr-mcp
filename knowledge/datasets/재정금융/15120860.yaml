description_portal: "가동사업자란 사업자 등록을 하고 폐업 신고를 하지 않은 채 계속해서 영업 중인 사업자를 의미합니다. 이는 개별 사업자(개인사업자)와 법인사업자 모두를 포함가동 법인수란 영업 활동을 계속하고 있는 법인 사업자의 수폐업자란, 더 이상 사업이나 직업 활동을 계속할 의사가 없이 영구적으로 영업을 종료하는 사업자를 말함일시적으로 영업을 중단하는 '휴업'과 달리, 사업을 완전히 그만두고 다른 활동을 할 의사를 갖는 상태를 말함- 2024년도말 가동법인 기준으로 지점법인을 제외한 법인수 임- 업태분류는 법인의 신청, 정정 등에 의한 사업자등록(세적)상의 주업종을 기준으로 함(단위 : 법인수)"
