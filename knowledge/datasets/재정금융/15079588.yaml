description_portal: 경상남도 사천시의 2018년부터 2020년까지 지방세 납부 현황 데이터를 공공정보로 제공합니다.이 데이터는 사천시민이 지방세를 납부할 때 이용한 납부 매체별 세부 현황을 담고 있습니다. 주요 납부 수단으로는 신용카드, 가상계좌 이체, 인터넷 지방세 납부 시스템(위택스), 그리고 은행 창구 납부 등이 포함됩니다. 각 납부 매체별로 납부 건수와 납부 금액을 연도별로 상세히 제공하여, 납세 편의 제고를 위한 전자 납부 시스템 이용률 변화 추이를 파악할 수 있습니다. 이 자료는 납세 행정의 디지털 전환 수준을 분석하고, 미래 납부 환경 개선 정책 수립에 중요한 기초 자료로 활용됩니다.
