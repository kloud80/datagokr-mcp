summary_user: 관세청 수출입 신고 자료를 국가별로 묶어 기간별 수출·수입 건수와 달러 금액, 무역수지를 담은 전국 단위 집계 통계다(수출은 최종목적국, 수입은 원산국 기준). 분석가나 수출 기업이 '특정 국가와의 무역수지가 기간별로 어떻게 바뀌었나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 국가코드(statCd)나 국가명을 매개로 같은 관세청의 품목별·국가별 수출입 실적과 무역통계부호 같은 코드 자료에 이어 쓴다.
limits: 품목·시도·세관 단위 구분이 없는 국가별 집계라 지역별·품목별 분석에는 쓰지 못한다. 다른 데이터와는 공통 조인 키가 없어 국가 코드·이름 매핑으로만 연결된다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
