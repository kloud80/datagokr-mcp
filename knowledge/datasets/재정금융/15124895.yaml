description_portal: '침수차량진위확인 정보는 침수 피해 이력이 있는 차량 여부를 확인할 수 있도록 제공되는 데이터입니다. 해당 데이터는 차량번호를 기준으로 침수차량의 사고발생일시, 사고종류 등의 정보를 확인할 수 있습니다. 이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 침수차량진위확인 조회 : 현재 차량번호를 기준으로 사고발생일시, 사고종류 등 침수 이력을 조회합니다.※ 유 의 사 항 ※1. 공공데이터포털을 통해 제공하는 침수차량 진위확인 데이터의 경우, 침수사고 기록이 없다고 해서 반드시 침수와 무관한 차량이라고 할 수는 없습니다. 정밀한 중고차 품질 확인을 위해서는 차량진단 전문업체의 진단을 받아보시길 권장하여 드립니다.2. 자동차보험 사고자료를 기반으로 차량의 침수사고 발생여부을 제공하는 서비스로서, 보험사에 보험사고 발생 사실이 신고되지 않았거나 자동차보험으로 처리되지 않은 경우에는 확인되지 않습니다.3. 1차 침수차량 여부 진위확인 시, 침수차량으로 확인되었으나, 이후 2차 침수차량진위확인 시, 같은 차량번호로 침수여부가 확인되지 않는 경우, 해당 차량이 말소 등록 되었을 수 있으므로 해당 정보(말소 등)에 대한 별도 확인이 필요합니다.'
