summary_user: 현재 차량번호를 기준으로 자동차보험 사고자료에 남은 침수 이력(사고발생일시, 사고종류명, 자료작성일자)을 차량 단위로 조회하는 전국 범위 API입니다. 중고차를 사려는 국민이나 중고차 매매업자가 '이 차량번호의 차가 보험 처리된 침수 사고 이력이 있는가'를 구매 전에 확인하는 데 쓴다. 실측 컬럼에 다른 데이터셋과 이어 쓸 전역 조인 키나 코드표는 없고, 차량번호(nowVhclNo)를 입력값으로 삼아 건별로 조회하는 방식으로만 연결된다.
limits: 보험사에 신고되지 않았거나 자동차보험으로 처리되지 않은 침수는 나오지 않으므로, 기록이 없다고 침수와 무관한 차량으로 단정할 수 없다. 처음엔 침수로 확인된 차량번호가 나중에 조회되지 않으면 말소 등록 등의 가능성이 있어 별도 확인이 필요하다. 개발계정은 하루 10,000회로 호출이 제한된다.
