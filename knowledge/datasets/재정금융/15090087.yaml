description_portal: '(예금보험공사_해외 주요 금융기구 연구분석자료 정보)1. 데이터 개요 : 예금보험기구 등 해외 주요 금융기구에서 발간하는 연구분석자료 관련 정보2. 데이터 단위 : 해외연구분석자료(건), 예금보험공사 연구자료(건)* 세부항목 : 발간기구명, 해외연구분석자료명, 해외연구분석자료명 한글 번역, 발간년월, 원문 홈페이지 링크, 예금보험공사 연구자료명, 예금보험공사 연구자료 링크3. 해외연구분석자료- IADI 회원으로 가입된 해외 예금보험기구의 주요 연구자료- 주요국 금융안정기구(중앙은행, 감독기구 등)- 국제 금융 관련 기구(IMF, BIS, FBS 등)- 그 외 예금보험제도 운영에 참고할 수 있는 주요기관의 연구자료 등4. 예금보험공사 연구자료- 해외연구분석자료를 바탕으로 공사에서 작성한 보고서(글로벌 예금보험 브리핑 등)'
