description_portal: 예금보험공사에서 관리하는 부보금융회사 종합 정보 중 예금 보험 제도에 가입되어 있어 예금 보험 적용을 받는 금융회사 목록과 해당 금융회사의 주소,  연락처 및 홈페이지 등의 기본 정보를 제공합니다.해당 데이터 자료는  "25년 12월 말 기준으로 은행, 금융투자, 생명보험, 손해보험, 저축은행 순서로 작성되었으며 총 285개입니다.금융회사에 대한  자세한 정보를 알고 싶으신 경우, 파일에 나와있는 각 금융회사의 사이트 주소를 통해  각 회사 홈페이지를 이용하여 주시면 감사하겠습니다.해당 금융회사 목록 및 주소 데이터 이외에도 예금동향 등 다양한 정보들이 예금보험공사 홈페이지에 게시되어 있으니 참고 부탁드립니다.감사합니다.
