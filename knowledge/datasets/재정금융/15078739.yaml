description_portal: 본 데이터는 인천광역시 미추홀구의 지방세 징수 현황 정보를 담고 있습니다. 시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 부과금액, 수납금액, 환급금액, 결손금액, 미수납금액, 징수율 등의 데이터를 포함하고 있습니다. 미추홀구 내 지방세 징수 실적을 세목별로 파악할 수 있으며, 레저세, 재산세, 주민세, 취득세, 자동차세, 등록면허세, 지방교육세, 지방소득세, 지방소비세, 지역자원시설세 등 다양한 세목의 징수율과 수납 현황을 확인할 수 있습니다. 각 세목별 부과금액 대비 실제 수납금액과 환급·결손·미수납 금액을 통해 세수 관리 실태를 분석할 수 있습니다. 징수율 지표를 통해 세목별 징수 효율성을 평가할 수 있습니다. 이 데이터는 지방세 징수 효율성 분석, 세수 관리 정책 수립, 지방재정 건전성 연구 등에 활용될 수 있습니다.
