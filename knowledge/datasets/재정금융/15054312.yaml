description_portal: 중앙행정기관의 단위사업별 세출 및 지출 결산 정보를 연도별로 제공하는 데이터입니다. 해당 정보는 예산의 집행 및 실제 지출 내역을 비교·분석함으로써, 예산 운용의 투명성과 책임성을 확보하는 데 기여합니다. 세출결산은 승인된 예산에 따라 집행된 항목별 내역을, 지출결산은 실제 집행된 금액을 중심으로 구성되어 있어, 예산 대비 실제 집행 실적을 체계적으로 확인할 수 있습니다. 또한, 단위사업별로 구성되어 있어 세부 항목별로 분석이 가능하며, 각 부처의 재정 건전성 및 예산 운용 효율성을 평가하는 데 활용됩니다. 공공저작물로 제공되므로 저작권 정보를 확인하고 이용에 유의하시기 바랍니다.
