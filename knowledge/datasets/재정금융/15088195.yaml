description_portal: '기술보증기금에서 보증약정을 체결할 때 전자약정(기술보증기금 디지털지점에서 비대면으로 약정을 체결)으로 체결한 건수에 대한 데이터입니다.파일에서는 전자약정 건수뿐만 아니라 서면약정(기술보증기금 관할 지점에 오프라인으로 직접 방문하여 약정을 체결)으로 체결한 건수를 확인할 수 있습니다.본 데이터는 기술보증기금을 이용하는 중소벤처기업 소재 지역별로 구분되어있어 각 지역별로 약정(전자약정, 서면약정)을 체결한 건수를 확인할 수 있습니다.기술보증기금의 전자약정 지역별 정보(서면약정, 전자약정) 제공- 강원, 경기, 경남, 경북, 광주, 대구, 대전, 부산, 서울, 울산, 인천, 전남, 전북, 제주, 충남, 충북- 단위 : 건, %(소수점 셋째자리에서 반올림)지역은 특별시, 광역시와 경기도, 충청북도 등 도로 구분되어있습니다.파일에서 D열의 "비율"은 전자약정과 서면약정을 모두 포함한 약정 총 건수대비 전자약정의 건수가 차지하는 비율을 의미합니다.'
