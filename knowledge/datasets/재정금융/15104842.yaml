description_portal: 이 데이터는 신용보증기금에서 신용보증을 이용한 기업의 생존율을 측정한 자료로, 통계작성 기준연도에 신용보증을 이용 중인 기업 중, 기준연도 이전 1년부터 7년 전 사이에 신규 보증을 공급받은 기업을 측정 대상으로 한다. 생존율은 해당 기간 내 보증을 받은 기업이 현재까지 정상적으로 사업을 지속하고 있는지를 나타내는 지표로, 기업의 지속 가능성과 신용보증 지원 효과를 평가하는 데 활용된다. 데이터는 신용보증기금이 자체 생산한 보증공급 정보를 기반으로 하며, 업종, 지역, 기업규모, 보증 종류 등에 따라 생존율을 세분화해 분석할 수 있다. 이를 통해 창업기업의 초기 생존율, 산업별 위험도, 보증지속성과의 상관관계 등을 파악할 수 있으며, 신용보증 정책의 사후성과 평가, 고위험 기업군 식별, 맞춤형 지원정책 수립 등에 필요한 기초자료로 활용된다.
