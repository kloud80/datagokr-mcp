summary_user: 국유재산의 결산 기준 증감과 현재액을 재산분류·재산종류별로 집계한 전국 단위 파일이다. 전년도 이월 수량·금액, 본년도 증가·감소, 순증감, 본년도 말 수량·금액(금액은 천원)을 담는다. 정책 분석가나 국민이 '올해 국유 토지·건물 등 재산 종류별로 전년보다 얼마나 늘거나 줄었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 마감연도와 재산분류명·재산종류명 같은 이름을 맞춰서만 이어 쓴다.
description_portal: '"국유재산 증감 및 현재액 총괄 현황정보" 데이터는 국유재산 증감 및 현재액(결산)현황 집계 자료입니다. 기준 회계연도를 기준으로 전년도의 국유재산의 종류별 수량과 금액을 제공하고 기준 회계연도의 전년대비 증가, 감소, 순증가의 데이터와 기준 회계연도의 종류별 수량과 금액을 제공하고 있습니다. 해당 데이터의 금액 단위는 천원 기준이며 수량 단위는 재산 종류에 맞춰 표기하고 있습니다.  전체  및 각 재산 유형별로도 해당 회계연도 기준으로 직전 회계연도와 비교하여 증가와 감소 규모를 확인할 수 있습니다.'
