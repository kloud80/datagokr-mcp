description_portal: 해당 데이터는 국가별 단기수출보험 사고 및 보상금 지급 현황을 정리한 자료로, 국가명·보험금 지급액·회수금 등의 항목을 포함합니다. 단기수출보험은 수출자가 수출대금의 결제기간 2년 이하의 수출계약을 체결하고 물품을 수출한 후, 수입자(L/C거래의 경우 개설은행)로 부터 수출대금을 받을 수 없게 된 때에 입게되는 손실을 보상하는 제도로, 이 데이터는 2014년부터 2024년까지, 분기 단위로 국가별 인수실적과 사고(보상) 현황을 집계하고 있습니다. 국가별 사고 건수 및 보상 추이 분석, 환수율과 리스크 경향 파악, 헤지 전략 수립 등을 수행할 때 활용할 수 있습니다.
