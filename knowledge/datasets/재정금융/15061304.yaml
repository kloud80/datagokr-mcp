summary_user: 국내은행별로 기준년월(basYm) 단위의 일반현황·재무현황·주요경영지표·주요영업활동 통계를 담는 집계 데이터로, 은행별 점포·영업소·자동화기기 수 같은 항목이 구분코드와 함께 제공된다. 분석가가 특정 은행의 자산·ROA·대출금·예수금이나 점포 수가 시기별로 어떻게 변했는지, 은행끼리 경영지표를 비교하는 데 쓴다. 법인등록번호(crno)가 실측 조인 키라서 금융위원회 기업정보·공시 재무 데이터 등 법인등록번호를 가진 다른 금융회사·기업 데이터와 이어 쓴다.
description_portal: '금융통계국내은행정보는 기준년월 및 금융회사명을 기준으로 국내은행의 주요 현황과 경영지표 등을 제공하는 데이터입니다. 은행별 일반현황, 재무지표, 경영성과, 영업활동 통계 등을 시계열 분석이 가능하도록 제공합니다.이 데이터는 4개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 국내은행 일반현황 조회 : 국내은행의 설립연도, 본점소재지, 분포현황 등 일반정보를 제공합니다.② 국내은행 재무현황 조회 : 자산·부채·자본 등 재무상태 관련 통계를 제공합니다.③ 국내은행 주요경영지표 조회 : ROA, ROE 등 경영성과를 나타내는 주요 지표를 제공합니다.④ 국내은행 주요영업활동정보 조회 : 대출금, 예수금, 외화예금 등 주요 영업지표 관련 정보를 제공합니다.'
