description_portal: 금융기관의 리스크 개요 및 유형별 측정 방법과 관련된 용어에 대한 설명을 담은 데이터 입니다. 은행은 영업을 영위하면서 다양한 리스크에 직면하게 됩니다. 기본적인 대출 업무를 영위하면서 차주의 부도로 인해 대출금을 회수하지 못할 가능성인 신용리스크가 은행이 직면하는 대표적인 리스크라고 할 수 있습니다. 이외에도 단기매매 금융자산 운용 과정에서 시장 변수 가치의 급격한 변동에 따라 손실이 발생할 가능성인 시장리스크, 금리 변동으로 인한 은행계정 자산의 순현재가치 하락 가능성인 금리리스크, 내부 시스템 미비 또는 직원 실수 등으로 인해 발생하는 운영리스크 등이 대표적인 리스크 유형입니다. 은행은 이러한 리스크에 대비하고자 일정 수준 이상의 자본을 적립하게 되는데, 이러한 자본 적립 수준의 적정성을 유지하는 것은 은행의 건전하고 지속적인 영업 활동의 핵심이라고 할 수 있습니다.
