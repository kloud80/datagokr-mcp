description_portal: 이 데이터는 중소기업을 대상으로 한 팩토링(Factoring) 계약의 약정 현황을 기간별로 정리한 「기간별 중소기업팩토링 약정현황」입니다.팩토링은 중소기업이 매출채권을 금융기관에 양도하고 자금을 조기에 확보할 수 있도록 하는 금융기법으로, 이 데이터는 그러한 팩토링 서비스의 계약 승인 이력을 중심으로 구성되어 있습니다.주요 항목은 ‘순번’, ‘업체구분’, ‘업종코드’, ‘승인한도(백만원)’, ‘약정시작일자’, ‘판매구매구분’으로 이루어져 있습니다.‘순번’은 각 데이터 행의 고유 식별자이며, ‘업체구분’은 법인 여부 또는 신청기업의 형태를 구분합니다.‘업종코드’는 통계청 한국표준산업분류(KSIC)에 따른 업종 코드로 표기되어 있으며,‘승인한도(백만원)’은 해당 계약에 대해 승인된 금액 한도를 백만원 단위로 나타냅니다.‘약정시작일자’는 약정이 개시된 날짜를 의미하며, ‘판매구매구분’은 해당 거래가 매출채권 기반(판매)인지 매입채권 기반(구매)인지 여부를 구분하는 항목입니다.이 데이터는 중소기업에 대한 팩토링 지원 실적과 금융한도 설정 흐름을 확인하고, 팩토링 상품 설계나 정책금융 지원 방향 설정을 위한 기초 자료로 활용될 수 있습니다.
