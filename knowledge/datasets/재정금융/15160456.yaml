description_portal: 이 데이터는 신용보증기금의 보증신청 및 상담 업무 관련 현황을 집계한 자료로, 상담_담당자_알림톡_정보, 상담_검토표_참고항목_정보, 신청_참고항목_정보, 상담_O2O보증_참고항목_정보 등의 테이블을 포함하고 있다. 본 데이터는 보증상담검토표참고항목, 보증신청참고항목, O2O보증 및 담당자 알림톡 관련 정보 등 보증신청 상담 과정에서 활용되는 기본적인 관리 현황을 제공함으로써, 관련 분야의 전반적인 업무 흐름을 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터 내 ‘상담_담당자_알림톡_정보’ 및 ‘상담_O2O보증_참고항목_정보’는 알림 서비스 및 비대면 상담 체계의 대략적인 운영 현황을 살펴보는 데 활용될 수 있으며, ‘상담_검토표_참고항목_정보’ 및 ‘신청_참고항목_정보’ 등은 보증신청 검토 시 참고하는 항목들의 단편적인 경향성을 파악하는 기초 자료를 제공한다.
