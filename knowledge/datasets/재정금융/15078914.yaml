description_portal: 부산광역시 해운대구에서 부과하는 지방세의 연도별, 세목별로 과세, 비과세 건수 및 금액 등의 현황을 나타내는 자료입니다. 지방세의 다양한 유형의 세원 현황을 체계적으로 제공함으로써 세부담 형평성 및 비과세, 감면 집중 현상 분석, 전반적인 지방세 규모 파악 등이 가능하고, 나아가 우리 해운대구의 살림살이를 들여다보고, 미래를 계획하는 데 중요한 밑바탕으로 활용할 수 있습니다.지방세 과세 현황 등에 대한 구체적인 정보가 필요하신 경우 해운대구청내 세무 부서(재산취득세과, 지방소득세과, 세무관리과)로 문의하시기 바랍니다.
