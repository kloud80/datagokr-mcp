description_portal: 서울시 시민참여예산 제안사업(평가대상사업) 우선순위 결정 정보는 시민이 제안한 사업 중 평가대상에 오른 사업들의 심사 결과와 우선순위를 제공하는 공공데이터입니다. 회계년도, 차수, 제안번호를 통해 각 제안사업을 고유하게 식별할 수 있으며, 사업명, 시·구비, 사업위치를 통해 어떤 사업이 어디에서 얼마의 재원을 전제로 검토되는지 파악할 수 있습니다. 분야코드와 검토부서·부서코드는 사업이 속한 정책 분야와 담당 행정부서를 나타내어 정책 영역별 분석에 활용 가능합니다. 평가인원, 평가총점, 평가평균, 평가순위, 최고·최저점수 정보는 시민·위원 등의 평가 과정과 결과를 정량적으로 보여 주며, 이를 통해 어떤 사업이 상대적으로 높은 우선순위를 갖는지 판단할 수 있습니다. W_FLAG 항목은 내부 처리상태 또는 구분값으로 활용되는 메타 정보로, 제안사업 선정 과정의 관리와 추적에 도움이 되는 데이터입니다.
