summary_user: 상장·등록 회사가 주요사항보고서로 낸 자기주식 취득 결정을 공시 건별로 담으며, 접수번호(rcept_no)마다 취득예정 보통·기타주식 수와 금액, 취득 예상기간·보유 예상기간, 취득 목적·방법, 위탁 증권사, 취득 전 배당가능이익 범위 내 보유 현황 등을 싣는다. 투자자나 분석가가 '이 회사가 언제, 몇 주를, 얼마에, 어떤 목적으로 자사주를 사겠다고 결정했나'를 확인하거나 자사주 매입 공시를 모아 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 법인등록번호·사업자번호로 바로 붙일 수는 없고, 같은 DART 체계의 고유번호(corp_code)나 회사명으로 금감원 다른 공시 데이터와 연결한다.
