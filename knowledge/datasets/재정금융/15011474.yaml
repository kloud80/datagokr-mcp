summary_user: 분양보증 사고가 난 사업장별로 연도, 사고업체, 지역, 사고일, 보증이행방안(환급·분양·계속사업), 대위변제액(백만원)을 한 행씩 담은 전국 단위 파일(약 7KB CSV)이다. 분양 계약자나 분석가가 어느 지역·연도에 분양보증 사고가 몰렸는지, 환급과 분양 이행 중 어떤 방식으로 처리됐고 공사가 얼마를 대신 갚았는지 확인하는 데 쓴다. 사업장명(hug_guarantee_site)이 실측 조인 키여서 같은 공사의 다른 보증 사업장 자료와 사업장 단위로 이어 쓴다.
description_portal: '1) 내용: 정책보증인 분양보증 사고가 발생한 사업장의 연도별로 사고업체명, 위치(지역), 보증사고일(연도분류), 보증이행방안(환급이행, 분양이행, 계속사업), 대위변제액에 대한 정보 공개2) 효과: 연도별(사고일자 포함), 위치(지역)별, 사업장별, 보증이행방안(환급이행, 분양이행, 계속사업)별 분양보증사고 현황 및 대위변제금액 파악 가능3) 기타: 하자보수보증과 분양보증은 전자의 경우 사용검사 후, 후자의 경우 사용검사 전과 관련되어 다른 성격의 보증으로 각각 보증상품 별로 자료를 공개하는 것이 효율적'
