summary_user: 제주특별자치도 안에서 결제된 카드 이용금액을 기준연도·분기별로 업종, 성별, 연령대로 나눠 집계한 통계로, 포털 설명상 2018~2020년이 대상이며 금액은 백만 원 단위(use_amount_by_million)로 담긴다. 지역 상권 분석가나 마케팅 담당자가 '제주에서 특정 업종의 소비를 남성과 여성 중 누가 더 많이 하는가, 연령대별로는 어떤가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 연도·분기, 업종명, 성별·연령대 구분을 이름으로 맞추거나 같은 제주특별자치도의 카드 소비 통계와 묶어 쓴다.
description_portal: 이 데이터셋은 2018년 1월 1일부터 2020년 12월 31일까지 제주특별자치도 내에서 카드 결제된 금액을 성별 및 업종, 연령대 구분으로 집계하여 성별 카드 이용금액 비율을 산출한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 파일은 CSV 형식으로 누구나 무료로 다운로드 가능하며, 남성과 여성의 소비 패턴 비교, 성별 소비 비중 분석, 지역경제 소비 구조 평가, 성별 소비 격차 조사, 상권 분석, 정책 수립 및 마케팅 전략 수립 등에 활용될 수 있습니다. 다만 수집기간이 2018~2020년이며 그 이후의 소비 변화, 카드 사용 보편화 변화, 업종 구조 변화 등은 반영되지 않을 수 있다는 한계가 있습니다.
