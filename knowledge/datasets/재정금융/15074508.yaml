summary_user: 서민대출상품(햇살론 등 정책서민금융상품)을 취급하는 금융기관의 기관명·법인번호·주소·상품명·상품설명을 담은 전국 단위 목록 API로, 전체 657건이다. 대출이 필요한 국민이 "내가 받을 정책서민금융상품을 취급하는 금융기관이 어디인가"를 찾거나, 분석가가 상품별 취급기관을 비교하는 데 쓴다. 금융기관 주소(fninstAdr)와 상품명(prdNm)이 주소 계열 조인 키로 실측되어 주소 기준 지역 데이터와 이어 쓰고, 법인번호(corpNo)로 다른 금융회사 원장과 대조할 수 있으나 명세상 키로 확인된 것은 아니다.
description_portal: ‘서민금융진흥원 서민대출상품 취급기관 정보 서비스’ 공공데이터 API는 서민대출상품을 취급하고 있는 금융기관의 정보를 제공하는 서비스입니다. 이 API를 통해 기관명, 법인번호, 금융기관 주소, 상품명 등 서민대출상품의 주요 정보를 조회할 수 있으며, 이용자는 자신에게 필요한 서민대출상품을 취급하는 금융기관을 손쉽게 찾을 수 있습니다. 해당 API는 햇살론 등 다양한 정책서민금융상품을 포함하고 있어, 상품별로 어떤 금융기관이 취급하고 있는지 확인할 수 있는 기능도 제공합니다.
