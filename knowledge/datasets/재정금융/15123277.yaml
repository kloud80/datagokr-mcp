description_portal: 면세점 매출현황에 대한 통계 데이터로, 내국인 외국인별, 유형은 시내, 외교관, 입국장, 지정, 출국장으로 구분, 품목은 가방류, 귀금속류, 담배, 민예품류, 시계, 식품류, 신발류, 안경(선글라스류) 등으로 분류하여 매출현황을 달러와 원화 기준으로 집계하였습니다. 다만, 기내면세점은 따로 관리되고 있으며, 품목은 주류, 담배, 화장품, 기타로 분류됩니다. 기내면세점은 내외국인별 매출현황은 별도 관리되고 있지 않습니다. 달러는 백만달러 기준이며, 원화는 억원 기준입니다.참고로, 관세청은 「관세법」 제174조부터 제182조까지, 제196조 및 그에 따른 「관세법 시행령」, 「관세법 시행규칙」에서 보세판매장 특허 및 운영과 관련하여 위임된 사항과 그 시행에 필요한 사항을 규정하고, 「관세법 시행령」 제192조의5제7항에 따라 보세판매장 특허 관련 업무를 수행하는 과정의 투명성과 공정성을 높이기 위한 청렴옴부즈만의 설치와 운영에 관하여 필요한 사항을 규정하고 있습니다.
