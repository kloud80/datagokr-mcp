summary_user: 목포시 관내에 대부업법에 따라 등록된 대부업체를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록 업종(등록신청사업)·상호·도로명 소재지·등록일자를 담는다. 시민이 거래하려는 대부업체가 목포시에 정식 등록된 곳인지 확인하거나, 분석가가 목포 지역 대부업체의 분포와 등록 시기를 살펴보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·주소 매칭이나 같은 기관(목포시) 단위로만 이어 쓰고, 소재지 주소를 지오코딩해 지도 위에 올릴 수 있다.
description_portal: 본 데이터는 전라남도 목포시 관내에서 등록된 대부업체의 현황을 수록한 자료입니다. 대부업에 관한 법률에 따라 등록된 업체에 대한 정보를 제공함으로써 금융소비자의 알권리 보장과 불법 대부업 예방을 목적으로 합니다. 제공 항목은 업체명, 사업장 소재지, 등록일자 등으로 구성되어 있으며, 해당 정보를 통해 시민과 관련 기관은 대부업체의 합법 여부를 확인하고, 거래 시 참고자료로 활용할 수 있습니다. 또한, 이 데이터는 금융 분야 종사자 및 연구자에게 지역 내 금융 환경을 분석하는 기초 자료로도 활용될 수 있습니다. 데이터는 정기적으로 갱신되며, 공공데이터 포털을 통해 누구나 자유롭게 열람 및 활용이 가능합니다. 정확하고 투명한 정보 제공을 통해 건전한 금융질서 확립에 기여하고자 합니다.
