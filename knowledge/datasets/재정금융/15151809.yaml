summary_user: 출항 적재화물목록을 기초로 출항일 기준 월별(yyyymm)·출항 공항만·목적지 국가별 BL 건수, 총중량, 컨테이너 수량(FCL·LCL·빈 컨테이너, TEU)을 집계한 전국 물동량 자료입니다. 물류·해운 분석가나 수출 기업이 특정 국가로 나가는 화물이 어느 항구·공항에서 월별로 얼마나 출항하는지 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 관세청 수출입 실적과는 기간(YYYYMM)과 국가명·항구명 같은 이름 매핑으로만 연결한다.
description_portal: 세관에 신고하는 출항 적재화물목록을 기초로 수집한 BL건수, 컨테이너 수량 등 물동량 자료를 제공.통계제공 기준일은 출항일이며, 출항 적재화물목록상 목적지 국가를 기준으로 전국 공항만 세관별 물동량 자료임. 공표 주기는 1개월 단위이며 매월 15일경 출항 적재화물목록의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화하여 제공. 세관은 적재화물목록이 접수되는 전국 공항만 세관을 기준으로 하되, 부산세관은 부산신항/부산북항(감천항 포함)/부산세관(신항＋북항)으로 구분하여 집계됨. 출항화물은 수출(E), 환적(R) 화물로 구분 가능하며, 운송은 해상(10), 항공(40)으로 구분 가능함. BL건수는 최소단위 BL(Bill of Lading) 기준으로 집계되며 House BL이 있는 경우 House BL, 없는 경우 Master BL건수임. 중량은 총중량이며, 컨테이너 수량은 20피트 컨테이너 기준 1TEU임.
