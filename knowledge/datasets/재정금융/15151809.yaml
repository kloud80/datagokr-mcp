      - name: endYymm
        required: true
        example: '202501'
        desc: 검색을 원하는 조회 종료날짜(10년이내)
      - name: cargTpcd
        required: false
        example: R
        desc: '화물구분(R : 수출, T : 환적)'
      - name: seaFlghTpcd
        required: false
        example: '10'
        desc: '운송구분(10 : 해상, 40 : 항공)'
    approval: auto
