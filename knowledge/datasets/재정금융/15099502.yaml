description_portal: '정부 예산 시계열 자료입니다. 2020년까지 결산기준, 2021년은 제2차 추가경정예산 기준, 2022년은 본예산 기준입니다.총수입 : 정부가 한해 동안 거둬들이는 재정수입 전체 규모, 일반회계 특별회계의 예산세입(국세수입, 세외수입)과 기금수입의 합계에서 내부거래와 보전거래 제외총지출 : 한 회계연도의 정부 지출 규모, 일반회계 특별회계 기금 전체 지출에서 회계기금 간 내부거래 및 보전거래 제외국가채무 : 중앙정부의 일반회계 특별회계 기금이 부담하는 국채, 차입금, 국고채무부담행위의 채무와 지방정부 순채무(지방교육재정 포함)를 합하여 산출'
