summary_user: 개인종합자산관리계좌(ISA)의 업권·ISA 유형(신탁형·일임형·투자중개형)별 가입자수·회사수·투자금액, 편입자산별 운용 금액·비중, 회사별 모델포트폴리오(MP) 기간별 수익률을 기준일자 단위로 담은 전국 집계 데이터로, 계좌 단위 원천이 아니다. ISA 가입을 고민하는 개인이 '일임형 ISA 중 최근 1년 수익률이 높은 MP는 어느 회사 것인가'를 비교하거나, 분석가가 업권별 ISA 자금 유입과 자산 구성 추이를 살피는 데 쓴다. 전역 조인 키는 없어 기준일자(basDt)·업권 구분(bzds)·ISA 구분(isaForm)으로 같은 데이터 안의 세 오퍼레이션을 맞추고, 다른 금융상품·금융회사 데이터와는 회사 명칭(cmpyNm) 이름 매칭으로만 잇는다.
description_portal: 'ISA다모아정보는 개인종합자산관리계좌(ISA)의 가입 현황 및 운용 성과 등을 종합적으로 확인할 수 있는 데이터입니다.데이터는 다음 3가지 오퍼레이션으로 구성되어 있습니다.① ISA 업권별 가입현황 조회 : 기준일자 및 업권유형을 기준으로 업권별 계좌 수, 납입금액, 평균잔액, 계좌유형 등을 조회하는 기능② ISA 운용현황 조회 : 기준일자 및 업권유형을 기준으로 ISA 유형별 상품 보유 현황, 잔고 금액, 계좌 구성 내역 등을 제공하는 기능③ ISA MP 대표수익률 조회 : MP유형 및 업권 등을 기준으로 대표 모델포트폴리오(MP)의 수익률, MP명, 자산구성비율 등을 조회하는 기능※ 데이터 갱신주기는 월 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, ISA다모아정보의 데이터 개방 주기는 매월 초입니다.공개되는 데이터는 두 달 전 말일까지를 기준으로 제공됩니다.예를 들어, 12월 31일까지의 데이터는 2월 초에, 1월 31일까지의 데이터는 3월 초에 업데이트됩니다.'
