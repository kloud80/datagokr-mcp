description_portal: '방세 비과세·감면은 사회 정책적 목적(복지, 지역 개발 등)을 위해 과세권을 포기하거나 세액의 일부를 깎아주는 제도입니다. 1. 주요 세목별 감면 현황지방세 감면액은 2024년 기준 약 16.3조 원 규모로, 매년 완만한 상승세를 보이고 있습니다.취득세 (가장 큰 비중): 생애 최초 주택 구입, 출산·양육 가구 주택 취득, 기업 유치 등을 위해 가장 활발하게 감면됩니다. 특히 2026년부터는 인구감소지역 내 주택 취득 시 감면 한도가 확대(최대 300만 원)되는 등 지역 소멸 대응 기능이 강화되었습니다.재산세: 사회복지시설, 학교, 공공기관 등에 대해 비과세가 적용됩니다. 최근에는 빈집 철거 후 토지에 대한 5년간 50% 감면 등 주거 환경 개선을 위한 혜택이 신설되었습니다.주민세 및 지방소득세: 중소기업 근로자 고용 지원이나 고령자·장애인 복지 차원에서 감면이 이뤄집니다.2. 특징 및 구조법적 근거: 감면액의 약 95% 이상이 지방세법 및 지방세특례제한법 등 중앙정부 법률에 근거합니다. 지자체 조례에 의한 자체 감면은 5% 미만으로 비중이 낮습니다.지역별 편차: 경기·서울 등 수도권이 전체 감면액의 약 **45%**를 차지하며, 이는 인구와 경제 활동이 집중된 지역적 특성을 반영합니다.지방세 비과세·감면은 국민의 세 부담을 줄이고 지역 경제를 활성화하는 긍정적 효과가 있으나, 지자체의 세입 감소를 초래하므로 국가 차원에서 매년 감면율을 적정 수준(약 12~15%)으로 관리하고 있습니다.'
