summary_user: 남원시 남원사랑상품권 가맹점 가운데 등록이 제한된 업체를 한 건씩 가맹점명·주소·업종·데이터 기준일자로 담은 원천 목록이며, 범위는 남원시 한 개 시군구이고 파일 크기는 약 6.8KB(csv)다. 시민이나 소상공인이 "이 가게에서 남원사랑상품권을 쓸 수 있나, 등록 제한 대상인가"를 확인하거나 분석가가 제한 가맹점의 업종 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 상품권 가맹점 목록이나 상권 데이터와는 가맹점명·주소 문자열 매칭으로만 이어 쓴다.
description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시의 남원사랑상품권 가맹점 중 등록이 제한된 업체들의 세부 현황을 포함하고 있습니다. 남원사랑상품권은 지역 소상공인 지원과 지역경제 활성화를 목표로 하는 모바일 지역화폐로, 시민들의 소비를 지역 내에서 순환시켜 경제적 파급효과를 극대화하는 데 중점을 둡니다. 이 데이터는 상품권 사용에 제한이 있거나 부적절한 가맹점들을 체계적으로 관리함으로써 건전하고 투명한 지역화폐 운영 시스템을 유지하기 위해 마련되었습니다.2. 데이터 항목- 가맹점명- 주소- 업종3. 기대 효과투명하고 체계적인 가맹점 관리를 통해 남원사랑상품권의 신뢰성을 높이고, 시민들이 더욱 안심하고 지역화폐를 사용할 수 있는 건전한 환경을 조성할 수 있습니다. 나아가 부적절한 가맹점 현황을 공개함으로써 지역경제 생태계의 투명성과 건전성을 더욱 강화하는 데 실질적으로 기여할 것으로 기대됩니다.
