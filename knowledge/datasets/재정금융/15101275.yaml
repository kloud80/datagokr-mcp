description_portal: 한국토지주택공사의 상품권 구매 및 사용 내역입니다. 당사에서는 온누리 상품권 구매, 유공포상, 설문조사, 사회공헌 등의 이유로 구매한 상품권의 금액을 월별로 제공하고 있습니다. 전통시장과 소상공인 업체를 활성화하기 위해 중소벤처기업부와 소상공인시장진흥공단이 발행하는 상품권으로, 지류, 모바일, 카드 등 다양한 형태로 구매할 수 있습니다. 최소 최댓값을 제외한 평균치는 매달 2,423매의 온누리 상품권을 구매하였으며 평균 3,473만원 가량의 금액입니다. 최소 최대를 제외하고 연도별로 살펴볼 때 24년도 평균 2,532매 25년도 평균 2,223매로 나타납니다.
