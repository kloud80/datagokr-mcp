summary_user: 세관에 신고된 항공사부호(IATA 등록 영문 대문자 2자리)로 해당 항공사의 한글·영문 업체명을 한 건씩 조회하는 전국 범위의 코드 조회 API다. 수출입 화물 자료나 적재화물목록에 찍힌 항공사부호가 어느 항공사인지 확인하려는 물류업체·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관세청 무역 코드·화물 데이터와는 항공사부호 값이나 업체명 매핑으로만 이어 쓴다.
description_portal: 항공사부호를 이용하여 세관에 신고된 항공사 업체명(한글, 영문)을 조회 할 수 있는 서비스임.   관세법 제225조와 관세청 보세화물 입출항 하선 하기 및 적재에 관한 고시 제47조(항공사부호 신고)에 따라 우리나라에 국제무역기를 운항하는 항공사는 최초 입항지 세관장에게 항공사부호 신고서를 제출하여 국제항공운송협회(IATA)에 등록된 영문자 대문자 2자리의 항공사부호를 신고해야 하고, 적재화물목록의 작성 및 제출은 업체부호를 신고한 선사 또는 항공사나  화물운송주선업자의 등록 및 관리에 관한 고시에 따라 업체부호를 등록한 화물운송주선업자가 해야함.
