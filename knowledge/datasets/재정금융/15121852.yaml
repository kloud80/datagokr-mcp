description_portal: '해당 파일은 신용보증기금이 운용하는 유동화회사보증의 사후관리와 관련된 데이터로, 사후관리일자, 부실처리일자 등의 항목을 제공합니다.유동화회사보증(P-CBO보증) : 개별기업이 발행하는 회사채 등을 기초자산으로 유동화증권을 발행해 기업이 직접금융시장에서 자금을 조달할 수 있도록 지원하는 보증 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.'
