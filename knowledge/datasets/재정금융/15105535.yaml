description_portal: 대외채무(외채)란 '일정시점에 일국의 거주자가 비거주자에 대해 미래특정 시점에 금융원금 또는 이자를 지급해야 하는 확정채무 잔액'을 의미하며, 대외채권은 '일정시점에 일국의 거주자가 비거주자로부터 미래특정시점에 원금 또는 이자를 회수하게 될 확정채권 잔액'을 의미합니다. 대외채무 및 대외채권 통계는 우리나라의  대외건전성 등 대외지급능력을 판단하는 기초자료로 활용되며, 일정시점을 기준으로 파악되므로 플로우(flow) 개념이 아닌 스톡(stock) 개념입니다. 본 통계는 통상 전년말 대비, 전분기 대비 증감으로 파악하며 정부·통화당국·은행·기타 부문별 증감을 통해 그 의미를 해석하게 됩니다. 해당 데이터는 대외채무 및 대외채권에 대한 시계열 자료이며, 만기별(단기/장기) 및 주체별(일반정부/중앙은행/예금취급기관/기타부문)으로 구분되어 있습니다.
