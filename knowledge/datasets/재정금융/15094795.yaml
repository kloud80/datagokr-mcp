status: active
summary_user: 금융투자협회가 제공하는 금융투자회사 공시 가운데 증권사별 퇴직연금 유형별 적립금과 분기·3·5·7·10년 수익률, 금융투자회사별 거래금액 구간·개설 경로에 따른 주식거래 수수료를 기준일 단위로 담는다. 퇴직연금 가입자나 주식 투자자가 '어느 증권사의 확정기여형 퇴직연금 장기 수익률이 높은가', '비대면 계좌로 주식을 거래할 때 수수료가 가장 싼 곳은 어디인가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 기업 공시·재무 데이터와는 회사명(cmpyNm) 매핑으로만 이어 붙인다.
limits: 법인등록번호나 사업자번호 같은 공통 키가 없어 회사명 표기 차이를 직접 맞춰야 한다. 데이터는 이벤트 주기로 생성된 뒤 바뀌지 않는 성격으로 분류되어 있으므로, 시계열 비교를 하려면 기준일(basDt)별로 따로 호출해 모아야 한다.
