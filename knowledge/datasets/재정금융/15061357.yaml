summary_user: 선물회사별·기준년월별로 일반현황(설립일·본점소재지·영업망), 재무현황(자산·부채·자기자본), 주요경영지표(ROA·ROE), 주요영업활동(고객예탁금·파생상품 거래실적·수탁고), 보도자료 기준 통계를 5개 오퍼레이션으로 담은 전국 단위 금융회사 원장형 통계다. 분석가나 투자자가 '특정 선물회사의 자기자본과 ROE가 최근 몇 년 사이 어떻게 변했고, 영업망은 얼마나 되는가'처럼 선물업권 회사 간 구조와 성과를 비교하는 데 쓴다. 법인등록번호(crno)를 조인 키로 써서 금융위원회 기업정보·공시 재무 데이터나 다른 업권 금융통계와 회사 단위로 잇는다.
description_portal: '금융통계선물사정보는 기준년월 및 회사명을 기준으로 선물회사의 일반현황, 재무상태, 경영성과 및 주요 영업활동 정보를 제공하는 데이터입니다. 선물업권 내 기업의 구조와 성과를 시계열로 데이터로 제공합니다.이 데이터는 5개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 선물사 일반현황 조회 : 설립일, 본점소재지, 영업망 등 선물사의 일반 정보를 제공합니다.② 선물사 재무현황 조회 : 자산, 부채, 자기자본 등 재무구조 정보를 제공합니다.③ 선물사 주요경영지표 조회 : ROA, ROE 등 수익성과 관련된 경영지표를 조회할 수 있습니다.④ 선물사 주요영업활동 조회 : 고객예탁금, 파생상품 거래실적, 수탁고 등 영업성과 항목을 제공합니다.⑤ 선물사 보도자료 통계 조회 : 보도자료에 기재된 통계를 기준으로 선물사의 주요 수치를 제공합니다.'
