description_portal: 본 자료는 청주시 각 구청별 지방세 징수액 데이터를 인구 통계와 결합하여 ‘1인당 지방세 부담액’을 산출하기 위한 기초 데이터로 활용된다.1인당 지방세 부담액은 ‘구청별 지방세 징수액 ÷ 구청별 인구수’로 산출되며, 이를 통해 구청별 주민의 실질적인 조세 부담 수준을 정량적으로 비교할 수 있다.산출 결과는 구청별 재정력 수준, 산업시설 집중도에 따른 지방세 편차 분석, 지역 간 재정 여건 비교 등에 활용 가능하며, 지방정부의 세입 구조 분석 및 세정 정책 수립·평가를 위한 기초 자료로 활용될 수 있다.또한 법인이 납부하는 지방세가 포함되어 있어, 산업시설 규모에 따른 구청별 지방세 규모 차이를 분석하는 데에도 유용하다.
