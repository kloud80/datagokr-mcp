summary_user: 2026년 기준 HS부호(품목번호)별로 한글·영문 품목명, 적용 시작·종료일자, 수량·중량 단위코드, 수출입 성질코드, 성질통합분류, 품목 규격 사항을 담은 전국 단위 코드표 파일(xlsx)이다. 수출입 사업자나 분석가가 "우리 물품의 HS부호와 품목명은 무엇이고 어떤 수량·중량 단위로 신고하는가"를 확인하는 데 쓰며, 관세율·FTA 협정관세·원산지 기준을 찾기 전에 품목번호를 정하는 출발점이 된다. 실측상 전역 조인 키는 확인되지 않았으나, HS부호를 매개로 관세청 품목별 수출입 실적 같은 같은 기관 데이터와 코드 매핑으로 이어 쓴다.
description_portal: 우리나라의 2026년 기준 HS부호 데이터로서 HS부호에 따른 한글품목명, 영문품목명, 수입성질코드, 수출성질코드, 수량단위코드, 중량단위코드, 성질통합분류코드, 성질통합분류코드명 등의 데이터를 제공합니다.HS코드는 세계관세기구(WCO)가 중심이 되어 체결한 HS 협약에 의하여 상품별로 부여한 코드로써 관세율, 수출입요령, 간이정액환급액 등과 밀접한 관련이 있습니다. 특히 FTA와의 관계에서는 HS Code별로 협정관세율과 원산지 결정기준을 정하고 있기 때문에 무역계약에 앞서 수출입물품이 협정관세 적용대상인지, 원산지 결정기준은 무엇인지를 확인하여야 합니다. 이러한 사항을 모두 확인하기 위해서는 먼저 물품의 품목번호가 결정되어야 합니다.
