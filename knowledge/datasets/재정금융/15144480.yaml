summary_user: 한국무역보험공사가 보유한 해외 바이어 목록을 바이어 한 건 단위로 담으며, 국가를 지정해 조회하면 바이어번호·바이어명·업종명·품목명·국가코드를 돌려준다. 수출기업이나 분석가가 특정 국가에 어떤 업종·품목의 바이어가 얼마나 있는지 확인해 시장 진출 대상을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가코드(ctryCd)·국가명이나 품목명·업종명 같은 이름 매핑으로만 이어 쓴다. 예를 들어 관세청 국가·품목별 수출입 실적과 맞춰 볼 때도 이 방식을 쓴다.
limits: 다른 데이터와 공통 식별 키가 없어 바이어 단위 연결은 어렵고, 국가·품목 이름이나 코드 매핑에 의존해야 한다. 조회 때마다 국가를 지정해야 하며, 개발계정은 하루 5,000회로 호출이 제한된다.
