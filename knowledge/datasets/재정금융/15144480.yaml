description_portal: 한국무역보험공사에서 보유한 바이어 조회 자료입니다. 바이어 정보는 요청 시 국가를 필수로 선택해야하며, 자료는 선택한 국가별 바이어의 품목명, 바이어번호(대상자번호), 국가코드, 국가명, 바이어명, 업종명으로 구성됩니다. 본 API를 통해 각 국가별 바이어 정보 데이터를 수집하고, 이를 수출정보에 활용할 수 있습니다. 또한 국가별 품목, 국가별 업종 등 다양한 관점에서 데이터를 구분하고, 이를 통해 각 국가의 업종 및 품목 분포 현황을 확인하여 해당 국가에 대한 수출 동향으로 활용할 수 있습니다.
