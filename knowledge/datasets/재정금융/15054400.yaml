description_portal: 해당 자료는 외국인투자촉진법과 같은 법 시행령  등에 따라 집계되는 다양한 해외 국적의 외국인(자연인, 법인)의  국내 산업별 직접 투자 금액에 관한 통계 정보입니다.  1. 외국인의 중점 투자 분야 등을 알 수 있는 자료이며 해외 투자 의존도를 전체 FDI금액 비중을 통해 알 수 있음 2. 주요 시중은행 또는 전담기관(코트라)을 통해 해외 기업(자연인, 법인)으로 부터 접수된 신고 등록서 등을 통해 집계한 자료 3. 단위는 백만불 단위로 표기하며 투자 금액이 미미해 집계되지 않은 국가 있어 해외 투자 처 다변화를 위한 노력의 지표로 활용될 수 있음 4. 연도별 FDI자료는 1년 단위로 정기적으로 공공데이터 포털에 반영됨
