description_portal: 강원특별자치도 강릉시 관내에서 발행하는 지역사랑상품권(강릉페이)의 결제가 가능한 연간 매출액 30억원 미만의 소규모 주유소 및 가스 충전소 현황을 제공합니다. 2026년 5월 기준의 최신 데이터셋으로, 개별 가맹점명, 업종 분류(주유소/충전소), 소속 행정구역(동면), 상세 도로명주소, 정밀한 지리적 위치 정보(위도와 경도 좌표) 및 대표 연락처 항목으로 구성되어 있습니다. 지역 주민과 관광객은 해당 자료를 참고하여 해당 지역화폐로 차량 유류비를 결제할 수 있는 주유 공간을 신속하게 검색할 수 있으며, 효율적인 소비 지출 계획 수립이 가능합니다. 또한, 소상공인 지원 정책 수립을 위한 기초 분석 자료나 네비게이션 및 위치 기반 모바일 애플리케이션 개발 등 다양한 서비스의 디지털 데이터 원천으로 폭넓게 활용할 수 있습니다.
