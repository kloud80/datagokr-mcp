description_portal: '○ 통계개요* 통계명 : 가계대출규모* 통계종류 : 일반.보고통계* 작성목적 : 중앙은행 및 금융기관의 대차대조표 등을 기초로 각종 통화금융통계를 편제하여 통화신용정책 및 여타정책수립의 기초자료로 활용* 조사체계 : 예금취급기관 및 기타 금융기관 → 한국은행* 공표주기 : 매월* 공표범위 : 지역 - 서울시내용 - 예금취급기관, 비은행예금취급기관의 가계대출○ 기 타* 취급점포 소재지 기준임. 단, 2017.2월이후 인터넷전문은행은 서울지역으로 분류* (주택담보대출)은 소계에서 제외* 주택대출 : 주택담보대출("주택관련대출" 및 "주택관련 집단대출중 주택담보분도 포함")+ 주택관련 집단대출중 주택담보이외의 대출* 합계와 세목이 각각 반올림 되었으므로 세목의 합계가 ?합계?와 일치하지 않을 때가 있음* 예금취급기관의 가계대출 잔액에는 예금취급기관이 취급한 주택금융공사 모기지론의주택금융공사 앞 양도분은 포함되어 있지 않음* 예금은행 : 일반은행, 특수은행 및 외은지점* 기타 : 신탁계정 및 우체국예금* 일부 비은행예금취급기관의 통계 기초자료 재정비로 주택담보대출 등 수치를 재분류하여 수정함'
