summary_user: 기술보증기금이 투자한 기업별 투자 건을 한 행씩 담은 원천 목록으로, 투자일자·투자금액·투자형태(보통주·RCPS·SAFE·CPS 등)·업종·지역·기업 규모를 전국 범위로 담고 있으며 파일 크기는 약 4.9KB로 작습니다. 분석가나 창업기업이 'RCPS 같은 투자형태와 IT·바이오 업종 중 어디에 기술보증기금 투자가 몰리는가', '지역·규모별로 투자가 어떻게 분포하는가'를 볼 때 쓴다. 기업명이나 사업자번호 같은 전역 조인 키가 없어 다른 기업 데이터와 행 단위로 붙일 수 없고, 업종명·지역 이름을 기준으로 다른 집계와 맞춰 보는 정도로만 이어 쓴다.
description_portal: 이 데이터는 기술보증기금이 투자한 기업의 기본 현황을 정리한 자료로, 투자일자, 투자금액, 투자형태, 업종, 지역, 기업 규모 등의 정보를 포함합니다. 기술보증기금은 중소기업 및 벤처기업의 성장을 지원하기 위해 다양한 투자 방식으로 자금을 공급하며, 본 자료는 해당 투자 활동의 실적과 흐름을 파악하는 데 유용합니다.**‘투자형태’**는 보통주, RCPS(상환전환우선주), SAFE(조건부 투자계약), CPS(전환우선주) 등으로 구분되며, RCPS 비중이 가장 높습니다.**‘업종명’**은 IT, 기계금속, BT(바이오), 화공, 문화콘텐츠 등으로 구성되며, IT 분야 투자가 특히 활발히 이루어졌습니다.**‘지역’**은 서울, 경기, 대전 등 전국 각지에 분포하며, **‘규모’**는 대부분 소기업이며 일부 중기업도 포함됩니다.이 데이터는 투자방식별 추이 분석, 업종별 투자 집중도 파악, 지역 및 기업 규모에 따른 분포 확인 등에 활용될 수 있습니다.
