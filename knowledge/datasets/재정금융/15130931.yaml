description_portal: 본 메뉴는 우리나라의 자유무역협정(FTA)을 비롯한 통상협정과 관련된 주요 소식과 안내사항 등을 폭넓게 제공합니다. 관련 제도 변경 및 법령 제·개정, 신규 통상협정 추진 공청회 개최, FTA 활용 지원 사업 공고 등 정부와 유관기관에서 제공하는 정보를 접할 수 있습니다. 홈페이지 이용자는 키워드 및 게시일자 등을 검색하여 원하는 콘텐츠를 선별할 수 있으며, 모든 콘텐츠는 게시일자 기준으로 정렬되어 있습니다. 본 콘텐츠는 통상협정 관련 정보를 제공함으로써 통상협정 정책 동향을 쉽게 접할 수 있으며 FTA에 대한 이해도 제고에 기여합니다.
