description_portal: 서울시 시민참여예산 제안사업 현장심사의견 데이터는 시민이 제안한 사업에 대해 현장조사를 실시한 내용과 그에 대한 심사 의견을 기록한 자료입니다. 회계년도와 제안번호는 어느 연도, 어떤 제안사업에 대한 의견인지 구분하는 기본 식별 정보입니다. 심사의견아이디는 개별 의견 건을 구분하는 값이며, 소관분과코드와 소위 항목은 어떤 분과와 소위원회에서 해당 사업을 검토했는지를 나타냅니다. 현장조사 시작일시와 종료일시는 실제 현장조사가 이루어진 기간을 보여 주며, 현장조사의견 1~5 항목은 사업의 필요성, 타당성, 현장 여건, 보완사항 등 구체적인 심사의견을 여러 칸에 나누어 기록하기 위한 텍스트 필드입니다. 사용여부는 해당 의견의 활용 상태를, 등록일시와 수정일시는 의견 입력과 변경 이력을, 등록·수정자아이디와 처리자위원코드는 어떤 위원이 의견을 작성·처리했는지를 관리하기 위한 내부 식별 정보입니다. 이 데이터는 제안사업의 서류 정보만으로는 알기 어려운 현장 상황과 심사 근거를 파악하는 데 활용되는 주요 기초 자료입니다.
