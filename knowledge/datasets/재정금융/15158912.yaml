description_portal: 지방세 시스템을 통해 추출한 자료로, 지방세 개방형 데이터 구축사업의 일환으로 생산되었습니다. 본 데이터는 2013년부터 2024년까지의 기간 동안 인천광역시 동구에서 발생한 지방세 비과세 및 감면율 현황을 연도별로 정리한 자료입니다. 이를 통해 지역 내 세제 지원 규모와 추이를 파악할 수 있으며, 정책 분석 및 연구 등에 활용이 가능합니다. 또한 시도명, 시군구명, 자치단체코드, 세목명, 과세년도, 비과세금액, 감면금액, 부과금액, 비과세감면율 등의 항목으로 구성되어 있어 세부적인 비교·분석이 가능합니다.
