description_portal: '사회적채권정보는 사회적 가치를 창출하는 프로젝트에 사용된 채권 발행 정보를 제공하는 데이터입니다. 기준일자, 발행기관, 표준코드, 채권종류, 종목명, 발행일, 상장일, 상환일, 표면이자율, 발행금액, 상장잔액, 채권유형 등의 항목을 포함하며, 발행 이력과 현재 유통 현황을 확인할 수 있습니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 사회적채권정보 조회 : 기준일자, 발행기관, 종목명, 발행일, 상환일, 이자율, 채권유형 등 사회적채권의 주요 발행 정보를 제공합니다.데이터 갱신주기는 일 1회입니다.'
