status: active
summary_user: 사회적 가치를 만드는 프로젝트에 쓰인 사회적채권을 종목 단위로 담으며, 기준일자별로 발행기관·채권표준코드·종목명·발행일·상장일·상환일·표면이자율·발행금액·상장잔액·채권유형을 제공하는 전국 범위 데이터다. 투자자나 ESG 분석가가 "어느 기관이 언제 얼마의 사회적채권을 어떤 금리로 발행했고 지금 상장잔액은 얼마인가"를 확인하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으므로, 다른 증권 시세·발행 데이터와는 채권표준코드(bondStdCd)나 발행기관명·종목명 매핑으로 연결한다.
limits: 실측 컬럼에서 공통 조인 키가 확인되지 않아 연기금 보유·기업 공시 등과 붙일 때는 코드·이름 매칭을 직접 검증해야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓸 수 없다. 개발계정 호출은 일 10,000회로 제한된다.
