description_portal: 경상북도 투자유치촉진지구 지정현황은 경상북도 내 투자유치촉진지구의 지정 현황을 지구(단지) 단위로 정리한 자료입니다. 각 항목은 지구를 식별할 수 있는 명칭과 지정일자 정보를 포함하며, 면적 관련 항목으로 총분양면적, 분양완료면적, 미분양면적을 제공하여 지구별 공급 규모와 분양 진행 정도를 수치로 확인할 수 있습니다. 또한 지정 당시 분양률과 특정 시점의 분양률을 함께 제공하여, 지정 시점과 비교 시점의 분양률을 비교할 수 있습니다. 이 자료는 지구별 분양 완료 규모와 미분양 규모를 비교하거나, 분양률 변화 여부를 확인하는 등 현황 파악과 통계적 분석에 활용될 수 있습니다.  자료 관련 문의는 054-880-4623으로 하시기 바랍니다.
