description_portal: '□ 예금보험공사의 청렴 및 인권 교육 현황에 대한 데이터 ㅇ 예금보험공사가 「부패방지 및 국민권익위원회의 설치와 운영에 관한 법률」 제81조의2에 따라 매년 시행하고 있는 청렴교육 시행과 관련된 정보입니다. 공공기관 임직원은 연1회 이상, 2시간 이상의 부패방지교육을 의무로 이수해야하며, 청탁금지법, 이해충돌방지법, 공직자 행동강령 등의 주제로 필수로 교육을 진행해야 합니다. ㅇ 예금보험공사가 공공기관 인권경영 매뉴얼에 따라 매년 시행하고 있는 인권교육 시행과 관련된 정보 입니다.ㅇ 데이터 항목 : 일시, 교육 방법, 교육 내용, 참석 인원, 기관장 및 임원 참석 여부- 일시 : 청렴 및 인권 교육 실시 일자- 교육 방법 : 비대면(온라인) 또는 대면교육 - 교육 내용 : 청탁금지법, 이해충돌방지법 등 청렴 관련 교육 및 인권 교육 일체- 참석 인원 : 청렴 및 인권 교육 수강 대상 인원- 기관장 및 임원 참석 여부 : Y/N- 교육시간 : 청렴 및 인권 교육 실시 시간'
