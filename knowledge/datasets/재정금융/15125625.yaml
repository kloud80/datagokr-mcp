summary_user: 한국주택금융공사가 중도금 보증을 제공한 분양 사업장을 사업장 한 곳당 한 행으로 담은 파일로, 사업장 소재지·시행자·시공자·총분양가·세대수·승인일자 구분·입주예정일 구분을 전국 범위로 담는다(CSV 약 16KB). 분양을 받았거나 받으려는 사람이 자기 사업장이 공사 중도금 보증 대상인지 확인하거나, 분석가가 지역별·시공사별 중도금 보증 사업장 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 사업장 주소나 시행자·시공자 이름을 매칭해야만 이어 쓸 수 있다.
description_portal: 한국주택금융공사에서 제공하는 공공데이터인 한국주택금융공사_중도금보증사업장입니다。중도금보증 사업장의 사업장 소재지, 보증 공급 금액, 건수 등에 대한 데이터를 제공합니다. 중도금 보증은 수분양자의 중도금 대출 시 은행의 요청에 따라 공사가 담보(보증서)를 제공하는 상품이며, 보증잔액 10억 이상 사업장만 조회되며, 보증금액(건수)는 피보증인 변경을 제외한 자료입니다. 。제공되는 이 데이터는 보증 상품 수요 예측, 고객별 보증 이용 패턴 분석 및 보증심사 기준 정교화 등으로 활용될 수 있습니다。정책 입안 시 근거 자료로 활용되어 공공 금융 서비스의 투명성과 효율성을 높이는 데 기여합니다。이 데이터는 공사의 내부 데이터와 연계하여 고객 특성별 세부 분석 및 맞춤형 금융 상품 개발에 유용합니다。세부 통계 지표 분석을 통해 특정 고객군의 연체 위험도 평가 및 선제적 대응 전략을 수립할 수 있습니다。또한 과거 데이터 추이를 활용한 시계열 분석을 통해 미래 시장 수요 예측 및 리스크 관리에 활용할 수 있습니다。연관 데이터와 결합하여 빅데이터 분석 플랫폼 기반의 금융 시장 동향 모니터링에 활용 가능합니다。해당 데이터에 대한 문의사항은 한국주택금융공사 공공데이터 제공 실무담당자에게 연락 혹은 공공데이터포털을 통해 문의를 접수 해 주시기 바랍니다。
