description_portal: 'KOTRA에서 공공 데이터 포털에 개방하고 있는 수입 규제 품목 정보 데이터는 전 세계 주요 국가의 수입 규제 동향을 HS코드 및 품목 수준에서 확인 가능한 공공 데이터 입니다. 해당 데이터는 KOTRA 각국 해외무역관이 현지 정부 및 관세청 등을 통해 직접 조사하여 취합한 데이터 입니다. 사용자들은 이 open api를 통해 국가별 및 품목별 규제 현황 분석, 수입 리스크 모니터링, 무역 정책 대응 전략 수립 등에 활용할 수 있습니다. 또한, 해당 데이터는 HS 코드별 규제 건수 통계, 국가(예: 미국, EU, 인도 등)의 규제 빈도 분석, 특정 규제 유형 별(예: 반덤핑 중심) 심층 분석 시 유용하게 활용될 수 있습니다.'
