summary_user: KOTRA 해외무역관이 현지 정부·관세청 등을 통해 조사한 각국 수입규제 품목을 지역본부별로 담은 API로, 건마다 품목명·HS코드, 규제 내용, 규제 시작·종료일, 국가코드(ISO 2자리), 조사대상국이 붙어 있다. 수출기업이나 무역 분석가가 "우리 수출 품목(HS코드)에 대해 어느 나라가 반덤핑 등 수입규제를 걸고 있나"를 확인하고 국가별·품목별 규제 빈도를 집계하는 데 쓴다. HS코드(HSCD)를 키로 관세청 품목별 수출입 실적이나 HS부호 코드표와 이어 쓰고, 국가코드(ISO_WD2_NAT_CD)로 국가별 무역 통계와 맞춰 볼 수 있다.
limits: 필드 명세에 의미 설명이 비어 있어 규제 유형·지역본부 구분 등은 실제 값을 보고 해석해야 한다. 공간 단위가 없는 비공간 데이터라 국내 지역별 분석에는 쓰지 못한다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
