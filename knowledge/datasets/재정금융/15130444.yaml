description_portal: 본 자료는 『예금보험공사_상호저축은행 구조조정 특별계정 관리현황』에 관한 것으로, 「예금자보호법」 제24조의4에 근거하여 예금보험공사가 상호저축은행 구조조정 특별계정을 통해 연도별로 지원한 금액 및 회수한 금액을 담고 있습니다. 이는 상호저축은행 구조조정 특별계정의 지원 및 회수내역에 대해 투명하고 체계적인 정보를 제공합니다.예금보험공사는 예금자보호법 제24조의3제2항에 따라 예금보험기금에 설치된 상호저축은행계정의 건전화를 지원하기 위하여 예금보험기금에 상호저축은행 구조조정 특별계정을 설치하고, 제24조의3제2항에 따른 예금보험기금의 각 계정과 구분하여 회계처리하여야 하고 있습니다.특별계정은 상호저축은행과 관련하여 제24조제3항에 따른 예금보험기금의 지출을 특별계정에서 할 수 있고, 예금자보호법 제35조에 따라 취득한 채권을 회수한 자금, 제35조의2에 따라 매입한 예금등 채권을 회수한 자금, 제36조의5제3항 또는 제38조에 따른 부실금융회사의 정리 등을 위하여 지원한 자금을 회수한 자금 등을 수입재원으로 할 수 있습니다.자료에 포함된 데이터에서 사용된 지원금액 및 회수금액 등은 모두 ‘억원’ 단위로 표기되어 있으며, 1억원 미만의 금액은 반올림 없이 ‘0’으로 표시될 수 있습니다. 이는 숫자의 단위를 명확히 하여 표의 일관성과 가독성을 높이기 위함입니다.(해당 항목에 해당하는 금액이 존재하지 않을 경우에는 공란(blank)으로 표시)
