description_portal: 지방세 부담 수준을 나타내는 데이터는 지역 주민의 세금 부담 정도를 종합적으로 파악하기 위한 자료로, 재정 정책 수립과 주민 체감도 분석에 활용됩니다. 주요 항목으로는 전체 지방세금액을 기준으로 산출된 1인당 주민 부담금액과 세대당 부담금액, 그리고 총 지방세금액 현황이 포함됩니다. 이를 통해 지역 내 인구 및 세대 규모 대비 세금 부담 수준을 비교·분석할 수 있으며, 타 지역과의 재정 부담 격차도 파악할 수 있습니다. 또한 연도별 변화 추이를 통해 세부담 증가 또는 완화 여부를 확인하고, 합리적인 세율 조정과 재정 운영 방향 설정을 위한 기초자료로 활용됩니다.
