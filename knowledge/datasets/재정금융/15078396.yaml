description_portal: 과세액 중 비과세액과 감면액이 차지하는 비율 현황을 과세연도별·세목별로 제공하는 데이터로, 비과세 금액 및 감면금액 규모를 체계적으로 파악할 수 있도록 구성되어 있음. 지방세 비과감면 운영 현황과 조세지원 규모 분석, 과세연도별 변화 추이 비교, 세목별 감면 현황 파악, 세제지원 정책 효과 검토 등에 활용 가능함. 또한 국민이 받는 조세 혜택 규모를 객관적으로 확인할 수 있으며, 지방재정 운용의 기초자료, 정책 수립 및 제도 개선 검토자료, 연구·통계 분석자료로 활용할 수 있음. 공공기관의 데이터 기반 행정업무 지원, 학계 및 민간의 정책연구 활용, 지방세 감면제도 운영 현황 공개를 통한 행정 투명성 제고에도 활용 가능한 공공데이터임.
