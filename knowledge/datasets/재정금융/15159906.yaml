description_portal: '시도명 및 시군구명: 과세 및 체납 발생 지역을 명시합니다.자치단체코드: 행정기관의 고유 식별 번호로, 데이터 간의 정합성을 유지하고 시스템 간 연동을 원활하게 합니다.과세년도: 해당 체납이 발생한 기준 연도체납액구간: 체납액의 규모를 10만 원 미만부터 3억 원 이상까지 세분화하여 나눈 항목입니다. 이를 통해 소액 체납자와 고액 체납자의 분포를 파악하고, 체납 유형별 대응 전략을 수립할 수 있습니다.구분: 해당 데이터가 "명(체납 인원/ 단위: 명)", "건수(체납 세목별 건수/ 단위: 건)", "세액(체납된 금액 /단위:원)" 중 무엇을 나타내는지 정의합니다.도세 : 취득세, 등록면허세, 레저세, 지역자원시설세, 지방교육세시세": 자동차세, 재산세, 지방소득세, 주민세, 지방소비세, 담배소비세'
