description_portal: '"취업 후 학자금 상환"은 경제적 여건에 관계없이 균등한 고등교육기회를 부여하기 위해 대학(원)생에게 학자금을 대출하고, 원리금은 소득이 발생한 후 소득 수준에 따라 상환토록 하는 제도- 2025년 12월말 기준 지방청별 취업 후 학자금 상환 원천공제 선납 현황.- 원천공제란, 근로소득이 발생한 대출자가 직전연도 총급여를 기준으로 산정된 1년분 의무상환액을 매월(1/12개월)     고용주가 대출자의 급여에서 공제하여 납부하는 방법- 미리 납부란, 고용주가 원천공제하지 않고 대출자가 직접 1년분 의무상환액을 한 번에(또는 2회 분납) 미리 납부하는 방법(단위 : 명)'
