description_portal: '(부보금융회사 종합정보)금융회사가 파산하는 경우 남은 자산을 현금화하여 채권순위 및 채권액에 따라 채권자들에게 배분하는 금액 등의 파산배당 관련 정보 (단위 : 억원)해당데이터 내 재단명이란, 파산채권 및 배당정보에 포함된 기업명을 뜻 함.해당데이터 내 배당일이란, 배당에 포함된 기업들이 일정한 기준에 따라 배당금을 나누어 줄 날짜를 뜻 함.해당데이터 내 배당참가채권이란, 일정한 기준에 따라 나누어 남에게 빌린 돈의 금액을 적는 장부를 뜻 함.해당데이터 내 배당금액이란, 주식회사가 이익금의 일부를 현금이나 주식으로 할당하여, 자금을 낸 사람이나 주주에게 나누어 주는 돈의 액수를 뜻 함.'
