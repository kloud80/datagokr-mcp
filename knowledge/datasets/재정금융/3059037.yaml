summary_user: 파산한 부보금융회사(파산재단)별로 배당일, 배당에 참가한 채권액, 실제 배당금액을 억원 단위로 담은 파일로, 전국 범위의 비공간 데이터이며 내려받은 파일은 249바이트로 매우 작다. 예금자나 채권자, 금융 분석가가 특정 파산 금융회사에서 채권 대비 얼마가 언제 배당됐는지 확인하는 데 쓴다. 전역 조인 키는 없어 재단명(금융회사명)을 기준으로 예금보험공사의 부보·영업정지·파산 관련 다른 금융회사 원장 데이터와 이름 매핑으로 잇는다.
limits: 공통 코드나 식별 키가 없어 다른 데이터와는 재단명 문자열 매칭으로만 연결해야 한다. 파일 크기가 249바이트에 불과해 수록 건수가 매우 적을 수 있으므로, 전체 파산 배당 이력을 담았다고 보기 어렵다.
