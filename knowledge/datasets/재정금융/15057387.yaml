summary_user: 영업정지 처분을 받은 저축은행의 보험사고 발생 이전 자산건전성 보고서를 기준연월(baseYm)·금융회사·항목 단위로 담는 API이며, 항목별 건수와 금액이 함께 제공되고 범위는 전국이다. 학계·연구기관이나 금융당국 분석가가 '과거 영업정지된 저축은행들은 사고 전 부실 관련 자산이 어떤 규모로 쌓였는가'를 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 예금보험공사의 영업정지 저축은행 재무상태표·손익계산서 등 다른 보고서와는 금융회사명(fnccmpNm)과 기준연월로 맞춰 이어 쓴다.
description_portal: (부보금융회사 종합정보) - 영업정지 처분을 부과받은 저축은행에 대해 보험사고가 발생하기 이전 작성되었던 재무상태표, 손이계산서 및 수신과 여수신, 수익성과 유동성, 자본적정성과 자산건전성 등의 재무제표 관련 정보 활용 요청 증가에 따라 예금보험공사는 동 정보를 제공하고 있습니다. - 개방데이터는 영업정지 저축은행에 대한 보험사고 발생 이전까지의 BS/PL 및 여수신, 수익성, 유동성, 자본적정성, 자산건전성 관련 주요 재무보고서입니다. - 학계·연구기관은 현 저축은행을 비롯한 다양한 금융업권에서 과거 영업정지 처분을 받은 저축은행들의 재무제표를 활용하여 연구 등에 활용하고, 관계기관은 동 정보를 공유받아 금융계약자들의 보호를 비롯한 금융시장 안정에 기여할 수 있습니다.
