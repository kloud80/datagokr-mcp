summary_user: 생명보험협회·손해보험협회가 제공하는 실손의료보험 상품별 기준 보험료를 보험회사·상품·유형·담보·가입 연령 단위로 담고, 남녀 보험료를 따로 제공하며 범위는 전국·비공간이다. 소비자나 분석가가 "40세 남성이 같은 유형·담보의 실손보험에 가입하면 회사별 보험료가 얼마나 다른가" 같은 상품 비교 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 회사코드(cmpyCd)나 회사명으로 매핑해 같은 금융위원회의 보험상품·금융회사 데이터와 이어 쓴다.
description_portal: '실손보험정보는 생명보험협회 및 손해보험협회에서 제공하는 실손의료보험 관련 통계 데이터를 제공하는 정보입니다. 실손보험 유형, 담보 항목, 성별 및 연령별 기준 보험료 등의 항목이 포함되어 있습니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 실손보험정보 조회 : 실손보험 담보, 유형, 성별, 연령대별 보험료 정보를 조회할 수 있습니다.※ 데이터 갱신 주기는 일 1회입니다.※ 실손의료보험이란? 피보험자가 질병·상해로 의료기관에 입원 또는 통원하여 치료를 받거나 처방조제를 받은 경우에 본인이 실제로 부담한 의료비를 보상하는 상품'
