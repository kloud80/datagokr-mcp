description_portal: 통일부에서 제공하는 ‘통일부_기관장 업무추진비 사용내역’ 데이터는 2020년부터 2022년까지 장관, 차관, 각 실·국장 등 통일부 주요 간부들이 공무 수행 과정에서 집행한 업무추진비의 상세 내역(총 2,547건)을 포함하고 있습니다.각 내역은 사용자(직위), 사용일자, 사용장소, 사용목적(내역), 사용금액(원) 항목으로 구성되어 있어 정책 추진과 관련된 다양한 행정 활동의 실제 집행 현황을 파악할 수 있습니다. 구체적으로는 간담회, 직원 격려, 전문가 및 언론인과의 소통, 관계기관 간 협의, 정책 의견수렴 등 공공기관의 주요 업무 수행에 필요한 항목들이 포함되어 있습니다.이 데이터는 예산 집행의 투명성 확보와 함께, 정책 추진 과정에서의 자원 배분 및 집행 패턴 분석, 공공기관의 업무관행 연구 등 다양한 연구·분석 분야에 활용될 수 있습니다. 특히, 통일부의 정책 결정 및 실무 추진 과정에서 업무추진비가 어떻게 사용되고 있는지 구체적으로 확인할 수 있어, 예산 운영의 효율성 평가와 책임성 강화에도 도움이 될 것으로 기대됩니다.※ 업무추진비 사용내역은 기관장 간담회를 기반으로 하는 '지역 맛집 앱개발' 등의 목적으로 일부 편집되어 통일부 홈페이이지에 정보공개 목적의 업무추진비 자료와 차이가 있을 수 있습니다.
