summary_user: 상장법인의 주요 경영사항 공시(배당·증자·합병·소송 등 32개 오퍼레이션)를 건별로 담은 API이며, 전국 기준 전체 64,667건에 2002-02-19부터의 기간을 포함한다. 투자자나 분석가가 특정 회사의 배당 규모·배당수익률이나 유상증자·합병 같은 사건 공시를 확인하는 질문에 쓴다. 법인등록번호(crno)로 같은 키를 쓰는 금융위 기업기본·재무 정보와 이어 쓴다.
description_portal: 공시정보는 상장법인의 주요 경영사항이나 투자판단에 중대한 영향을 미치는 사항을 투자자에게 적시에 전달하기 위해 작성된 공시 항목을 제공하는 데이터입니다. 데이터는 다음의 32가지 오퍼레이션으로 구성되어 있습니다.배당공시정보조회, 유상증자결정공시정보조회, 무상증자결정공시정보조회, 유무상증자결정공시정보조회, 주주총회소집공고공시정보조회, 자산양수도(기타)_풋백옵션공시정보조회, 부도발생공시정보조회, 영업정지공시정보조회, 회생절차개시신청공시정보조회, 해산사유발생공시정보조회, 감자결정공시정보조회, 채권은행등의관리절차개시공시정보조회, 소송등의제기공시정보조회, 해외증권시장주권등상장공시정보조회, 해외증권시장주권등상장폐지공시정보조회, 전환사채권발행결정공시정보조회, 신주인수권부사채권발행결정공시정보조회, 교환사채권발행결정공시정보조회, 상각형조건부자본증권발행결정공시정보조회, 자기주식취득결정공시정보조회, 자기주식처분결정공시정보조회, 영업양수결정공시정보조회, 영업양도결정공시정보조회, 타법인주식및출자증권양수결정공시정보조회, 타법인주식및출자증권양도결정공시정보조회, 주권관련사채권양수결정공시정보조회, 주권관련사채권양도결정공시정보조회, 회사합병결정공시정보조회, 회사분할결정공시정보조회, 회사분할합병결정공시정보조회, 주식교환·이전결정공시정보조회, 주식매수선택권부여에관한신고조회, 사외이사의선임·해임또는중도퇴임에관한신고조회※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)
