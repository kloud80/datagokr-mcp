description_portal: 서울시 자동차 번호판 영치 현황은 자동차 번호판이 영치된 실적을 연도·월·기관별로 집계한 데이터입니다. 영치년도와 영치월은 번호판이 영치된 시점을 나타내며, 영치기관과 영치기관코드는 해당 조치를 수행한 기관과 그 식별 코드입니다. 영치건수는 기간별·기관별 번호판 영치 발생 건수를 의미합니다. 이 데이터는 자동차 관련 체납, 불법 운행 등에 대한 행정 집행 현황을 파악하고, 기간별·기관별 단속 추세 분석, 정책 효과 평가, 교통·세수 관련 행정 계획 수립 등에서 기초 자료로 활용됩니다. 또한 자치구별 단속 강도나 시기별 영치 변화를 비교·분석하여 교통질서 및 시민 편의 증진을 위한 정책 수립에 참고 자료로 활용됩니다.
