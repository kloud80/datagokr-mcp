description_portal: 본 데이터는 지방세 세원의 유형별 과세 현황을 과세연도와 세목 기준으로 체계적으로 제공하기 위한 자료이다. 제공 항목은 과세년도, 세목명, 세원 유형, 부과건수, 부과금액으로 구성되며, 이를 통해 특정 연도에 지방자치단체가 어떠한 세원에 대하여 어느 정도 규모로 과세하였는지를 파악할 수 있다. 과세년도는 지방세 부과의 귀속연도를 의미하며, 세목명은 취득세, 재산세, 자동차세, 주민세, 지방소득세 등 지방세법에 따라 부과되는 개별 세목을 나타낸다. 세원 유형은 토지, 건축물, 주택, 차량, 사업소, 소득 등 각 세목의 과세대상이 되는 자산 또는 과세기반의 종류를 구분한 항목으로, 세목별 과세 구조와 세원 분포를 분석하는 데 활용된다. 부과건수는 해당 세원 유형에 대해 실제로 부과가 이루어진 건수를 의미하며, 부과금액은 그에 따라 산정된 지방세 부과액의 합계를 뜻한다. 본 자료는 세목별·세원별 세수 구조 분석, 과세기반 변화 추이 파악, 세원 관리의 효율성 제고, 재정운영 검토 및 세정정책 수립을 위한 기초자료로 활용될 수 있다. 다만 자료는 기준시점에 집계된 행정자료이므로 이후 경정, 감액, 추가 부과 등으로 수치가 변동될 수 있다.
