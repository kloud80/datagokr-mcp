description_portal: 이 데이터는 기술보증기금이 기술이전 대상 기술로 분류한 항목들을 정리한 자료입니다. 각 행은 하나의 기술을 나타내며, 기술코드, 기술명, 출원번호, 보유기관, 설명자료 유형(SMK), 상세보기 링크 등의 항목으로 구성되어 있습니다.여기서 SMK는 특허 기반 기술의 이전·거래를 촉진하기 위해 제작된 마케팅용 기술소개 PDF 자료를 의미합니다. 기술요약, 적용 분야, 경쟁 기술과의 차별성, 시장성 등 기업 관점에서 활용 가능한 정보가 요약되어 있는 형태입니다.데이터에 포함된 기술은 대학, 공공연구기관, 산학협력단 등이 보유하고 있으며, 각 기술에 대한 자세한 내용은 스마트테크브릿지 플랫폼 내 상세보기 링크를 통해 확인할 수 있습니다. 이 데이터는 기술이전 수요에 대응하거나, 유망 기술을 선별·추천하는 데 참고자료로 활용될 수 있습니다.
