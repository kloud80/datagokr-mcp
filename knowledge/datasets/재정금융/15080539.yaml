description_portal: 본 데이터는 지방세 비과세 및 감면율 현황을 상세히 제공합니다. 이는 전체 과세액 중 비과세액과 감면액이 차지하는 비율 현황을 파악하여 국민의 조세 혜택 규모를 명확히 분석하는 데 활용될 목적으로 수집되었습니다. 세부 항목은 취득세, 재산세 등 주요 지방세 세목별 과세액, 비과세액, 감면액, 그리고 이에 따른 비과세율 및 감면율 등으로 구성됩니다. 이 자료는 지방세 정책의 효과성을 평가하고, 향후 조세 감면 정책 수립 및 재정 건전성 확보를 위한 기초자료로 활용될 것으로 기대됩니다. 투명하고 합리적인 세정 운영을 통해 납세자의 권익 보호에도 기여합니다.
