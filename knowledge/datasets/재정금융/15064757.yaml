description_portal: '-.리파이낸싱 보증: 기존사업을 인수하거나 저금리로 재조달하기 위한 자금에 대한 보증-.민간선 투자보증: 계속비 예산사업에 대해 당해연도 예산을 초과하여 선투자하고, 향후 지급받을 연부액 담보 조달 자금에 대한 보증-.브릿지파이낸싱 보증: 토지보상비 부족예산을 선투입하기 위한 자금조달에 대한 보증-.산업기반유동화회사보증: 유동화전문회사가 법 58조에 따라 발행한 사회기반시설채권 및 그 채권의 원리금 지급을 위한 자금조달에 대한 보증-.시설자금보증: 금융기관으로부터 조달하는 시설자금에 대한 보증-.운영자금보증: 금융기관으로부터 조달하는 운영자금에 대한 보증-.재정지원보증:주무관청으로부터 법, 시행령 및 실시협약에서 정한 재정지원금을 지급받기 전 원리금 상환 등을 위해 조달하는 운영자금에 대한 보증-.투자위험분담형: BTO-rs 등의 사업을 대상으로, 주무관청으로부터 위험분담금을 지급받기 전 원리금 상환 등을 위해 부족한 운영자금을 조달하기 위한 자금에 대한 보증'
