summary_user: 주식 대차거래를 일자(basDt) 기준으로 6개 오퍼레이션에 나눠 담는다. 상위 종목 순위, 종목별 일별 체결·상환·잔고 수량, 시장 전체 월별 실적, 업종별 대여·차입 잔고와 비율, 내외국인별 잔고·체결량이 여기에 들어가며, 범위는 전국 단위의 비공간 데이터다. 투자자·분석가는 '특정 종목의 대차잔고가 최근 늘었는지, 외국인 차입 비중이 얼마인지' 같은 공매도 대기 물량과 수급을 확인하는 데 쓴다. 종목 단위 오퍼레이션은 ISIN 종목코드(isinCd)를 키로 해 같은 금융위원회 증권 시세·상장종목 데이터나 기업 공시와 잇는다. 시장 전체·내외국인 집계 오퍼레이션은 종목 키가 없어 기준일자로만 맞춘다.
description_portal: '주식대차정보는 주식대차 거래 종목별 순위, 업종별·참여자별 현황, 거래 주체별 대차잔고 비교 등 다양한 통계 정보를 제공하는 데이터입니다.주요 항목으로는 종목별 대차 상위 순위, 종목별 및 업종별 거래현황, 월별 대차규모, 내외국인별 잔고 및 거래량 통계 등이 포함됩니다.<데이터 조회 시 유의사항>파라미터 없이 조회 시 데이터 조회 시간이 오래걸려 timeout이 발생하게 되어 필수 파라미터를 지정하였습니다.- 파라미터 조건 : 조회 시 아래의 필수 파라미터 중 최소 1개 이상을 반드시 입력해야 합니다.- 기본값 안내 : 필수 파라미터를 입력하지 않은 경우, 기준일자(basDt)는 자동으로 가장 최신 날짜로 설정되어 조회됩니다.[서비스별 필수 파라미터 목록]- 주식업종별참여현황조회 : basDt, isinCd- 주식대차종목순위조회, 주식종목별대차거래현황조회, 월별대차거래현황조회, 내외국인대차잔고비교조회, 내외국인대차거래량조회 : 없음이 데이터는 6개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 주식대차종목순위 조회 : 대차거래 기준 상위 종목 순위 정보를 제공합니다.② 주식종목별대차거래현황 조회 : 특정 종목에 대한 일별 대차거래 규모 및 변동 현황을 조회합니다.③ 월별대차거래현황 조회 : 전체 시장 기준 월별 대차거래 실적 통계를 조회합니다.④ 주식업종별참여현황 조회 : 업종 단위로 대차거래 참여 현황 및 집중도 정보를 제공합니다.⑤ 내외국인대차잔고비교 조회 : 내국인과 외국인의 대차잔고 규모를 비교할 수 있습니다.⑥ 내외국인대차거래량 조회 : 내국인과 외국인의 거래량 및 증감 추이를 제공합니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
