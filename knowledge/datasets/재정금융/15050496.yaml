description_portal: '세입 및 수입 예산편성현황(총액)은 연도별, 회계별로 집계한 정부의 세입·수입 예산현황을 제공하는 재정 통계 자료입니다.(국세수입, 세외수입, 기금수입 등 각종 수입 항목과 함께, 일반회계·특별회계·기금별 수입 현황을 총액 기준으로 한눈에 파악할 수 있도록 구성되어 있습니다.)본 자료는 국가의 재정운용 기반을 보여주며, 정부 수입구조의 규모와 구성 비율, 주요 재원별 변동 추이 등을 분석할 수 있는 중요한 데이터입니다. 국세 수입, 비세 수입, 기금수입 등이 포함되며, 재정정책 수립과 재정 건전성 평가에 활용됩니다.1.데이터 범위   * 연도별 세입·수입 예산현황   * 회계 구분별(일반회계, 특별회계, 기금 등) 총수입 규모   * 수입 항목별 금액(단위: 원), 비율 포함2. 세입·수입 항목   * 국세수입 (소득세, 법인세, 부가가치세 등)   * 세외수입 (사용료, 수수료, 재산수입, 경상이전수입 등)   * 기금수입 (국민연금기금, 고용보험기금 등)   * 기타수입3. 총액 기준 제공   * 내부거래·보전거래 등을 제외하지 않은 총수입 기준 데이터   * 국가 전체 재정규모 파악 및 총량 효과 분석 가능4. 활용 예시   * 연도별 국가 재정 수입 구조 분석   * 국세 대비 비세 수입 비율 평가   * 재정 건전성 평가 자료로 활용   * 특정 세입 항목 증감 원인 분석   * 정책 수립 및 연구자료로 활용5. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 파일 형식으로 다운로드 가능   * Open API 제공 (연도, 회계, 수입 항목, 예산구분 등 조건별 상세 조회 지원)본 자료는 정부의 수입 구조와 규모를 투명하게 공개하여 국민의 알권리 충족은 물론, 연구기관·언론·일반 국민이 재정 분석, 재정정책 수립, 재정 건전성 평가 등에 폭넓게 활용할 수 있는 중요한 재정정보입니다.'
