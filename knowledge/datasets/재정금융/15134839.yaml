description_portal: 광주광역시 서구에서 제공하는 「연도별 지방재정자립표」 데이터는 해당 지역의 재정 자립도를 정량적으로 파악할 수 있는 통계로, 지방정부의 재정 운영 상태를 진단하는 핵심 지표들로 구성되어 있습니다. 주요 항목으로는 연도별 재정자립도, 재정자주도, 기준재정수요충족도 등의 지표가 포함되어 있으며, 각 지표는 백분율 형태로 제공됩니다.재정자립도는 자체 수입이 전체 재정에서 차지하는 비율을 의미하며, 중앙정부 의존도를 측정하는 데 활용됩니다.재정자주도는 자체 수입과 지방 교부세 및 조정 교부금 등 실질적으로 자율적으로 쓸 수 있는 재원을 합친 비율입니다.기준재정수요충족도는 지방자치단체가 재정 수요를 충족시키는 수준을 측정하는 지표입니다.이 데이터는 매년 1회 갱신되며, 지역 재정 건전성과 자립 기반을 분석하거나 국가 예산 편성과 지방교부세 배분의 기초 자료로 활용될 수 있습니다. 따라서 정책 기획, 행정평가, 재정 분석, 지역 개발 등 다양한 행정 분야 및 연구 영역에서 필수적으로 참고되는 공공데이터입니다.
