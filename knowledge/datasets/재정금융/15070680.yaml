description_portal: 1.연도별 국세청의 세수, 징세비, 세무공무원 정원과 세무공무원 1인당 세수 및 징세비 현황 통계자료입니다 2.국세청 세수는 내국세, 교통·에너지·환경세, 방위세, 교육세, 농어촌특별세 및 종합부동산세의 합계로 구성됩니다 3.징세비는 국세청에서 연간 지출한 총 지출금액 (결산기준:일반회계)을 의미합니다 4.정원은 해당연도 12.31일 현재 세무공무원 인원입니다(정무·별정, 직제개정전 기능직 해당 직렬 제외)
