description_portal: '2024년 김천시 지방세 납부현황 (연도별징수통계) ○지방세법에 의거 징수한 세목별 현황 ○ 2024년에 부과 후 2024년도에 징수된 금액, 지난연도수입은 제외○단위: 건, 납부금액:  천원 ○도세- 취득세 → 부동산, 차량, 기계장비 등 취득 시 부과되는 세금- 등록면허세 → 각종 권리의 등록 및 면허 취득 시 부과되는 세금- 레저세 → 경마, 경륜, 경정 등 레저 관련 사업에서 발생하는 세금- 지방소비세 → 부가가치세의 일정 비율을 지방자치단체에 배분하는 세목- 지역자원시설세 → 지역의 특수한 자연환경·자원 보호 및 소방시설 등 지역시설 확충을 위해 부과- 지방교육세 → 지방교육 재정 확충을 목적으로 다른 세목에 부가하여 징수하는 세금○시세 - 주민세       ■ 균등분: 개인 및 법인 균등 부과       ■ 재산분: 사업소 연면적 기준 부과      ■ 종업원분: 종업원 급여총액 기준 부과 - 지방소득세 → 소득세 및 법인세의 10%에 해당하는 금액을 지방세로 부과      ■개인분: 개인 소득세 납부세액 기준      ■ 법인분: 법인세 납부세액 기준      ■ 특별징수분: 원천징수 방식으로 징수- 재산세 → 토지, 건축물, 주택 등 재산 보유에 대해 부과- 자동차세 → 자동차 소유에 따라 부과되는 세금      ■ 소유분: 연 2회(6월, 12월) 부과     ■ 주행분: 유류 소비량 기준 부과- 담배소비세 → 담배 제조 및 수입 시 부과되는 소비세'
