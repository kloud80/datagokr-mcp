summary_user: 전국 단위로 전체 수출기업과 AEO(수출입안전관리우수업체) 인증 수출기업의 건수·수출금액(천 달러), 그리고 AEO 기업이 차지하는 비중을 연도별로 집계한 작은 파일(csv, 약 1KB)이다. 무역 분석가나 수출기업이 'AEO 인증 기업이 우리나라 전체 수출에서 차지하는 금액 비중이 해마다 어떻게 변했나'를 확인하거나 AEO 인증 필요성을 판단하는 참고 자료로 쓴다. 전역 조인 키가 없고 연도(기간)만 공통 축이므로, 관세청 수출입 실적 등 다른 연도별 무역 통계와 연도 기준으로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: AEO는 미국 9.11 테러 이후 글로벌 무역안전에 대한 중요성이 부각됨에 따라 세계관세기구(WCO)를 중심으로 국제사회가 채택한 표준으로 AEO업체는 수출입업체, 운송인, 창고업자, 관세사 등 무역 관련 업체를 대상으로 관세청이 법규준수, 내부통제시스템, 재무건전성, 안전관리 분야의 기준을 심사하여 공인한 우수업체이며, 이들에 대해서는 신속통관, 세관검사 축소 등 통관절차 및 관세행정상의 혜택이 부여됨. 해당 데이터는 전체 수출금액 대비 AEO 인증을 받은 기업의 수출 금액 및 비중을 비교한 데이터로서 수출기업의 AEO 인증 여부 판단에 참고 자료로 활용 가능함. 연도별 집계이며, 단위는 건, USA1,000$ 입니다.
