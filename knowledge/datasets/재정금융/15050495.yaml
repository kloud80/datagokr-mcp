description_portal: 이 데이터는 국가의 세입 및 수입에 대한 예산편성 현황을 총액 기준으로 제공합니다. 연도별, 회계별, 기금별로 분류된 세입·수입의 편성 내역을 통해 국가 재정의 수입 구조와 규모를 확인할 수 있습니다. 특히 재정 건전성과 세입 기반 확대를 위한 정책 수립에 필요한 기초 자료로 활용됩니다. 제공되는 정보는 중앙행정기관 및 기금의 세입예산과 수입예산 편성액을 포함하며, 열린재정을 통해 누구나 열람 가능하도록 개방되어 있습니다. 국가예산의 투명성과 국민 신뢰 제고를 위한 목적으로 제공되는 공공데이터로, 예산 분석, 정책 평가, 학술연구 등 다양한 분야에서 유용하게 활용될 수 있습니다.
