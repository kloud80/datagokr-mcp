summary_user: 온라인수출플랫폼 고비즈코리아에서 해외바이어와 이뤄진 주문을 주문 1건 단위로 담은 원천 파일로, 주문번호·문의번호·총주문가격·통화단위·바이어 국가코드·지역/도시 주소를 담는다(csv 약 6.8KB 규모). 중소기업 수출 지원 분석가가 고비즈코리아를 통한 주문이 어느 나라 바이어에게서 얼마 규모로 들어오는지 살펴볼 때 쓴다. 문의번호(gobiz_inquiry_no)로 고비즈코리아 인콰이어리 데이터와, 주문번호(gobiz_order_no)로 주문 상세 데이터와 잇고, 국가코드(country_cd)·통화단위(currency_cd)로 국가 코드표·환율 자료와 붙여 쓴다.
description_portal: 온라인수출플랫폼(Gobizkorea)에서 확인할 수 있는 고비즈코리아 주문 기본정보 데이터를 제공합니다.제공하는 데이터로는 주문번호, 총주문가격, 인도조건, 국가코드, 지역주소, 도시주소 등의 정보를 제공합니다.*온라인수출플랫폼(Gobizkorea)는 해외 판로개척에 어려움을 겪는 국내 중소벤처기업들이 온라인을 통해 수출을 할 수 있도록 도와주는 플랫폼으로, 해외바이어를 대상으로 상품(영문 상품페이지, 영문 미니사이트)을 홍보하고 수출거래 협상(인콰이어리)을 진행할 수 있는 B2B 플랫폼입니다.
