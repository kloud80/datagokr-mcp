description_portal: 회계연도별로 재산종류를 기준으로 분류된 종류별 국유재산 현황 정보(연말기준)를 제공하는 데이터입니다. 항목에는 회계연도, 종류 구분, 금액(억원)이 포함됩니다.이 데이터는 재산의 체계적 관리 및 활용 방안 수립을 위한 기초 정보를 제공하는  유용한 정보입니다. 국유재산이란 국가가 행정목적을 수행하기 위해 필요로 하여 소유하고 있는 일체의 재산 및 국가의 부담이나 기부의 채납, 법령 또는 조약에 따라 국가소유로 된 재산을 말합니다.  국유재산의 종류로는 토지(국유지), 건물(국유건물), 공작물(국유지 또는 국유건물에 부착된 철탑, 울타리 등 시설물), 입목죽(국유지상에 식재된 나무 또는 대나무), 선박·항공기(소방·치안용 선박 및 항공기), 기계기구(기관차, 모노레일 등 궤도차량), 유가증권(증권, 주식, 채권), 무체재산(지상권, 전세권, 지식재산권 등)이 있습니다.
