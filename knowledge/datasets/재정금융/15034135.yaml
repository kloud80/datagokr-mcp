description_portal: HSK연계표는 전략물자에 해당하거나 해당 가능성이 있는 품목을 HSK 코드와 연계시킨 목록입니다.전략물자관리시스템 홈페이지 하단에 자주 찾는 서비스에서 파일을 받을 수 있습니다.HSK 연계표 정보는 전략물자에 해당하거나 해당 가능성이 있는 품목을 관세통계통합품목분류표상의 HSK 코드와 연계하여 제공하는 데이터입니다. 본 데이터는 수출입 품목의 HSK 코드 또는 HS 품목분류를 기준으로 전략물자 해당 가능성을 사전에 확인하고, 전략물자 수출통제 관련 품목 식별, 수출허가 사전검토, 전략물자 판정 준비, 기업의 자율준수 관리 업무 등에 활용할 수 있도록 구성되어 있습니다. 수출기업, 무역·관세 실무자, 공공기관 및 연구기관 등은 본 연계표를 참고하여 수출입 대상 품목과 전략물자 통제 대상 품목 간의 관련성을 검토할 수 있습니다. 다만 전략물자 해당 여부는 관련 법령, 고시, 통제품목 목록 및 전문 판정 결과에 따라 최종적으로 확인되어야 하므로, 본 데이터는 전략물자 해당 여부를 확정하는 자료가 아닌 사전 검토 및 업무 참고용 자료로 활용하는 것이 적절합니다.
