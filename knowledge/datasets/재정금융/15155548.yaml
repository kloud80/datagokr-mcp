description_portal: 국민의 관심이 많거나 국가재정을 이해하는데 필요한 재정통계를 선별하여 그 규모와 구성·추이·국제비교 등 다양한 정보를 담고 있으며, 관련 업무에 쉽게 활용할 수 있도록 직관적이고 시각화된 자료를 제공함소수점 이하 단수조정으로 상이할 수 있음. 장기재정전망이란 정부가 재정의 지속가능성 확보를 위한 정책방향 설정의 기초자료로 활용하기 위하여 40년 이상 기간에 대해 5년마다 장기재정전망을 실시. 국가재정법 제7조(국가재정운용계획의 수립 등)재정수지는 인구감소에 따른 성장률 하락으로 총수입은 제약되는 반면, 의무지출 증가로 총지출은 대폭 증가. 2025 자료 수록
