description_portal: '고액·상습체납자 명단공개 : 국세징수법 제114조에 따른 체납발생일로부터 1년이 지난 국세가 2억원 이상인 고액상습체납자의 성명(상호), 주소, 체납액 등을 국세기본법 제85조의5 ⑤항 규정에 따라 국세청 누리집, 관할세무서 게시판에 공개체납자의 은닉재산을 발견하여 신고할 경우 최대 30억원의 포상금 지급* 근거 : 국세기본법 제 84조의 2 및 동법시행령 제 65조의 42포상금은 체납자의 은닉재산 신고를 통한 현금징수액에 따라 5~ 20% 지급률을 곱하여 차등지급합니다.지방청별 고액, 상습체납자 명단 공개자의 현금징수 실적고액, 상습체납자 명단은 2004년도에 최초로 공개(2년 경과 체납액 10억원 이상)함'
