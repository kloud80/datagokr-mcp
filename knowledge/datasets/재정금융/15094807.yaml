summary_user: 한국거래소 주요 지수의 일별 시세를 주가지수·채권지수·파생상품지수 3개 오퍼레이션으로 담으며, 전체 363,209건 규모의 지수·기준일자별 집계 데이터다. 투자자나 분석가가 KOSPI·KOSDAQ 같은 지수의 종가와 등락률이 최근 어떻게 움직였는지 확인하는 데 쓴다. 전역 조인 키는 없어서 지수명(idxNm)과 기준일자(basDt)로 이름 매핑해 다른 금융위 증권 시세나 공시 데이터와 이어 쓴다.
description_portal: '지수시세정보는 한국거래소에서 제공하는 주요 지수의 시세 정보를 제공하는 데이터입니다.주가지수, 채권지수, 파생상품지수 등의 시가, 고가, 저가, 종가, 등락률, 거래량 등의 시세 항목을 포함하고 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 주가지수 시세 : KOSPI, KOSDAQ 등 주요 주가지수의 시세 정보를 제공합니다.② 채권지수 시세 : 채권시장 지수의 시세를 종목별로 조회할 수 있습니다.③ 파생상품지수 시세 : 파생상품 관련 지수의 시세 정보를 조회합니다.이 데이터는 2020년 1월 1일 이후부터의 데이터를 제공하고 있습니다.※2024년 12월 6일 이후, 일부 지수명 변경되었으니 활용자가이드 참고바랍니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
