description_portal: 국세통계 연보가 발간되기 전 조기에 통계를 공개함으로써 적시성 있는 통계 정보의 제공 및 활용의 효율을 높이기 위해 제공하는 정보입니다.* 국세통계포털(TASIS) 소개 1. 국세통계를 한번에 찾을 수 있는 스마트한 서비스 제공   - 국세통계포털(Tax Statistics Information Service)은 매년 공개하는 국세통계를 이용자가 손쉽게 조회하고 다양하게 활용할 수 있도록 국세청이 제공하는 통계서비스입니다.2. 15개 분야 560종의 통계표를 통한 정책수립 및 연구 통계자료 제공  -  13개 세목 등 총 15개 분야 560종의 통계표를 공개하고 있으며, 국세청 소관 국세의 세목별 신고·결정 등에 관한 사항을 체계적으로 작성하여 세입구조 실태, 변동 등에 따른 정책수립, 경제효과 분석        등을 위한 통계자료를 제공합니다.3. 다양한 시각화 콘텐츠, 국세통계안내 등 통계설명자료 제공  - 일반인들도 쉽게 이해할 수 있는 다양한 시각화 콘텐츠, 국세통계의 이해를 돕기 위한 국세통계안내, 쉽고 편리한 세목별 통계표 찾기 기능 등 이용자가 원하는 국세통계정보를 쉽고       빠르게 찾아보실 수 있습니다.
