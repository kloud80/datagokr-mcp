summary_user: 한국무역보험공사가 무역보험 운영 중 쌓인 실제 수출대금 결제정보를 통계 분석해 국가·업종별 결제조건, 평균 결제기간, 연체율, 평균 연체기간을 연도별로 담은 집계 데이터이며 건별 결제 원장은 아니다. 수출기업이나 수출지원기관이 "이 나라 바이어와 거래하면 보통 어떤 결제조건으로 며칠 안에 대금을 받고, 연체는 얼마나 생기나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 관세청 국가·품목별 수출입 실적 같은 다른 데이터와는 국가명·업종명을 직접 맞춰 연결해야 한다.
description_portal: 한국무역보험공사가 국내에서 유일하게 보유한 해외기업 결제 데이터를 기반으로 우리나라 수출기업이 거래하는 해외 수출시장의 수출대금 결제동향을 분석한 데이터입니다. 공사는 무역보험 업무 운영과정에서 발생한 실제 수출대금 결제정보 빅데이터 약 100만 건을 활용, 종합적인 통계분석 작업을 수행하여 수출기업, 수출지원기관 등 해외수출 관련 이해관계자들이 수출실무에 활용할 수 있는 스마트 수출결제정보 데이터를 제공하고 있습니다. 해당 데이터를 통해 국가, 업종별 결제조건, 결제기간, 연체율, 연체기간 등의 정보를 확인할 수 있습니다.
