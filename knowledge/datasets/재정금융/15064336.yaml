description_portal: '공사 환변동보험(보험가입시 환율보다 환율 상승시에는 이익금 납부, 환율 하락시에는 보험금을 지급하는 선물환 상품) 이용 시 적용되는 보장환율을 나타낸 데이터입니다. 산정일자, 통화코드, 기간별 평균 스왑포인트, 보장환율 등의 컬럼으로 이루어진 파일 데이터 자료입니다. 수출거래 기준으로 환율이 보장환율보다 하락 시 공사가 보험금을 지급하고, 보장환율보다 상승 시 이익금을 공사로 납부하시게 됩니다. (참고)- 보장환율 산정 방식 : 청약일 시장평균환율 + 기간별 Swap Point- 보장환율 산정일자는 청약일 및 결제신청일 익영업일입니다. (예) "22.11.10 청약 또는 결제신청 → 보장/조기결제 환율은 다음날("22.11.11) 조회 가능합니다.)'
