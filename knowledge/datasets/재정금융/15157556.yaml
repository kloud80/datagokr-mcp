description_portal: 해당 자료는 우리나라 예금보호한도의 변천 과정(연혁)을 정리한 표로, 시기별로 예금자가 보호받을 수 있는 금액과 제도 변화의 배경을 설명하고 있다. 1997년 예금보험제도 도입 초기에는 금융시스템 안정을 위해 은행·보험·증권·종금 등 대부분의 금융기관 예금을 전액 보호하였다. 이후 외환위기 상황이 안정되면서 1998년 8월부터 2001년까지는 한시적으로 전액보호를 유지하되 단계적 축소를 준비하였다. 2001년부터는 금융시장의 도덕적 해이를 방지하고 시장 규율을 강화하기 위해 예금보호 한도를 5천만 원으로 제한하는 부분보호제도가 시행되었다. 이후에도 동일한 한도가 유지되다가, 금융시장 규모 확대와 경제 여건 변화를 반영하여 2023년 이후 일부 예금에 대한 보호가 강화되었으며, 2025년부터는 예금보호 한도가 1억원으로 상향되었다. 이는 경제 규모 성장과 금융자산 증가에 따라 예금자의 실질적인 보호 수준을 높이기 위한 정책적 조치이다.
