summary_user: 신용보증기금 보증 기업의 부실 처리 건을 채권관리 건별로 담은 원천 파일로, 부실처리일자·부실사유·부실원인 코드, 부실발생금액, 정상화 전망, 기업의 규모·매출·경상이익·차입금 같은 재무 정보를 함께 담으며 범위는 전국이다. 분석가가 '보증 후 짧은 기간에 부실이 난 기업은 어떤 규모·재무 구조였고 주된 부실 원인은 무엇인가'처럼 보증 부실의 특성과 정상화 가능성을 살피는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못했으며, 채권관리ID는 기관 내부 식별자라 같은 기관의 채권관리 데이터끼리 맞추거나 업종·기업규모 코드를 이름으로 매핑해 이어 쓰는 정도에 그친다.
description_portal: 신용보증기금의 부실통지, 부실제외, 집중관리부점 등 관련 데이터입니다.(업무 데이터베이스에서 개인정보 등을 제외한 공개 가능한 원천 데이터를 추출) 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
