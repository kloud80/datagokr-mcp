description_portal: '부가가치세란 상품(재화)의 거래나 서비스(용역)의 제공과정에서 얻어지는 부가가치(이윤)에 대하여 과세하는 세금이며, 사업자가 납부하는 부가가치세는 매출세액에서 매입세액을 차감하여 계산부가가치세는 물건값에 포함되어 있기 때문에 실제로는 최종소비자가 부담하는 것이며, 사업자는 최종소비자가 부담한 부가가치세를 세무서에 납부하는 것임그러므로 부가가치세 과세대상 사업자는 상품을 판매하거나 서비스를 제공할 때 거래금액에 일정금액의 부가가치세를 징수하여 납부해야함- 신고건수는 사업장 단위로 계산한 것이며, 여러 사람이 한 사업장에서 공동사업을 하는 경우 1건으로 기재됨- 과세표준은 부가가치세 신고서상 과세분 매출금액이며, 소득금액이 아님- 법인사업자의 경우 지점 사업장도 각각 1건으로 기재됨(단위 : 건수, 백만원)'
