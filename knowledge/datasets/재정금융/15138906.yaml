description_portal: 이 데이터는 기술보증기금이 보증한 기업 중 채무불이행이 발생했을 때, 대위변제를 수행하고 이후 구상권을 청구한 실적을 보증상대처(금융기관)별로 정리한 것입니다. 2023년 기준으로, 구상권 발생 건수, 순증금액, 평균 증가금액이 포함되어 있으며, 보증 리스크의 기관별 분포와 사후 회수 규모를 분석할 수 있도록 구성되어 있습니다.각 항목의 의미는 다음과 같습니다.**‘연도’**는 데이터가 집계된 기준 시점,**‘구분’**은 기술보증이 집행된 금융기관 또는 기관명,**‘구상권 건수(건)’**는 대위변제 후 구상권이 발생한 건수,**‘구상권 순증금액(억원)’**은 해당 연도에 새로 발생한 구상채권 금액,**‘평균 증가금액(억원)’**은 건당 평균 구상금액을 나타냅니다.예를 들어, 기업은행은 2,752건의 구상권이 발생하고 4,215억 원의 순증금액을 기록해 전체적으로 높은 보증 리스크 부담을 나타냅니다. 반면, 건수가 적은 기관의 경우 상대적으로 리스크가 낮다고 해석될 수도 있지만, 실제로는 해당 기관의 보증 공급 규모 자체가 적었기 때문일 수도 있으므로 단순 비교에는 주의가 필요합니다. 이 데이터는 기술보증기금의 사후관리 실적과 금융기관별 리스크 분산 상황을 파악하고, 향후 회수 전략 수립 및 보증정책 개선을 위한 기초자료로 활용될 수 있습니다.
