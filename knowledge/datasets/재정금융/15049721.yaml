description_portal: HSK 표준품명 데이터로서 HS부호 단위별로 품명, 한글 표준품명, 영문 표준품명, 규격번호, 한글 필수규격, 영문 필수규격, 규격값, 세부분류내용 등의 데이터를 가지고 있습니다.관세법 제241조(수출·수입 또는 반송의 신고) ①물품을 수출·수입 또는 반송하려면 해당 물품의 품명·규격·수량 및 가격과 그 밖에 대통령령으로 정하는 사항을 세관장에게 신고하여야 한다.이에 따른 품명 작성 요령은 당해 물품을 나타내는 관세율표상의 품명을 기재. 다만, 관세율표상 당해 품명이 특게되어 있지 않은 경우 또는 당해물품의 성질을 정확하게 표현하지 못하는 경우 일반적인 품명을 기재.수입신고 정확도 제고를 위한 HSK별 품명·규격 수입신고 가이드에 따라 표준품명이 제정된 물품은 표준품명을 영문으로 기재
