summary_user: 상장법인 등 공시 기업의 지배구조 공시 가운데 소액주주 현황, 5억원 이상 개인별 보수지급(상위 5인), 미등기임원 보수 현황을 사업연도·법인 단위로 담은 건별 공시 API이며, 3개 오퍼레이션 중 실호출로 확인된 것은 1개(미등기임원 보수 현황 계열)다. 투자자나 지배구조 분석가가 '특정 회사의 미등기임원 1인 평균 급여와 소액주주 비율은 어느 수준인가'를 확인하는 데 쓴다. 법인등록번호(crno)를 조인 키로 금융위 기업기본·재무정보와 금감원 공시 등 기업 축 데이터에 붙이고, 주식종목코드로 증권 시세 데이터와도 잇는다.
limits: 개인별 보수지급(/getCGIdvpnPayInfo)과 소액주주현황(/getCGSmamInfo)은 최소 파라미터 호출에 응답이 없었으므로 호출 조건을 따로 확인해야 한다. 공시 이벤트 때 생성된 뒤 바뀌지 않는 자료라 실시간 지배구조 변화는 반영하지 않으며, 개발계정은 하루 10,000회로 제한된다.
