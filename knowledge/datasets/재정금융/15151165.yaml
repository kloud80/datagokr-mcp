description_portal: 기업지배구조 공시정보는 소액주주현황, 개인별 보수지급, 미등기임원 보수현황 내역 등을 확인할 수 있습니다. 이 데이터는 3개 오퍼레이션으로 구성되어 있습니다. 각 오퍼레이션은 다음과 같습니다.소액주주현황은 소액주주수, 전체주주수, 소액주주비율, 보유주식수, 총발행주식수, 보유주식 비율, 주식종목코드 등을 조회할 수 있습니다. 개인별 보수지급(5억원 이상 상위 5인)은 보수수령자성명, 보수수령자직위명, 총보수금액, 비포함총보수금액, 주식종목코드 등을 조회할 수 있습니다.미등기 임원 보수 현황의은 미등기임원수, 연간급여총액, 평균1인급여액, 보수현황비고내용, 주식종목코드 등을 조회할 수 있습니다.** 유의사항 ** ① 본 서비스에서 제공되는 정보는 공시제출인(또는 데이터 제공기관)의 책임 하에 작성되었으며, 금융위원회는 이의 정확성 및 완전성을 보장하지 않습니다. ② 금융위원회는 어떠한 경우라도 본 서비스를 통해 제공받은 정보를 이용하여 이용자가 얻은 이득이나 입은 손해 등 결과에 대해 책임이 없습니다. ③ 금융위원회는 금융공공데이터 이용자간 또는 금융공공데이터 이용자와 제3자간에 서비스를 매개로 한 거래 등과 관련하여 어떠한 책임도 부담하지 아니하고, 금융공공데이터 이용자가 서비스의 이용과 관련하여 기대하는 이익에 관하여 책임을 부담하지 않습니다. ④ 금융위원회는 서비스에 관하여 금융공공데이터 이용자가 금융위원회가 정한 제반 규정, 이용 안내 및 관계 법령을 준수하지 않은 이용으로 인한 결과에 대하여 책임을 지지 않습니다
