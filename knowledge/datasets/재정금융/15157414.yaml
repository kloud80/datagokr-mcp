description_portal: 본 API 서비스는 국제에서 거래되는 종목들의 거래 정보를 확인할 수 있는 서비스입니다. 구체적으로 종목별 전환 가능 주식수, DR의 월별 전환 및 해지 현황 정보를 조회할 수 있습니다. 그리고 국가코드도 조회가 가능하며, DR 전환가능 대상 종목 또한 조회 가능합니다. 추가로 연도별 미국주식 결제처리 현황을 조회할 수 있습니다. DR의 월별 전환/해지 현황 정보는 조회 기준 연월과 DR전환건수, DR전환주수(원주), DR해지건수, DR해지주수(원주)를 알 수 있습니다. 국가코드 조회시, 한글 국가명과 영문 국가명을 결과 값으로 받을 수 있습니다. DR 전환 가능대상 종목 조회시, DR 전환 비율과 총 원주수, DR 종목코드, 발행회사명을 알 수 있습니다. 연도별 미국주식 결제처리 현황 조회에서는 미국시장 매수 및 매도 결제건수를 결과 값으로 받아보실 수 있습니다.
