summary_user: "한국예탁결제원이 관리하는 해외 주식예탁증서(DR) 관련 정보를 오퍼레이션별로 담는다: 원주 종목별 DR 종류(ADR·GDR 등)·전환 비율·총 전환가능 한도와 현재 전환 가능 주식수, DR 월별 전환·해지 건수와 주수, 국가코드표, 연도별 미국주식 매수·매도 결제건수. 투자자나 분석가가 '삼성전자 원주를 지금 DR로 몇 주까지 전환할 수 있나', '최근 DR 해지가 늘었나' 같은 질문을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, 원주표준코드(isin)와 발행회사번호(issucoCustno)는 명세상 같은 기관의 주식정보·기업정보서비스를 참조하므로 이를 통해 종목·발행사 정보와 이어 쓴다."
limits: 실호출에서 6개 오퍼레이션 중 3개만 성공했고, DR 전환가능 종목·미국주식 결제현황·DR 월별 전환현황은 최소 파라미터로 응답이 없었다. 조회 연월·기준일·기준연도 같은 필수 파라미터를 먼저 맞춰 넘겨야 하며, 개발계정은 하루 100회로 제한된다.
