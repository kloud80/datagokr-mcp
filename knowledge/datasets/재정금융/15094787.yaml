description_portal: '서민금융상품기본정보는 서민금융진흥원에서 운영하는 ‘서민금융 한눈에’ 서비스를 통해 제공되는 데이터입니다. 취급기관별 서민금융 대출상품, 자산형성상품, 사회적 금융 관련 상품의 명칭, 지원대상, 금리, 대출한도, 상환방식 등 주요 정보를 통합 제공합니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 서민금융한눈에 정보 조회 : 서민금융 상품의 유형별 명칭, 금리, 한도, 지원대상, 상환방식, 취급기관 등 정보를 제공합니다.※ 서민금융이란? 1금융권(은행)에서 낮은 금리로 돈을 빌리는 등 양질의 금융서비스를 누리지 못하는 서민층이 이용하는 금융서비스'
