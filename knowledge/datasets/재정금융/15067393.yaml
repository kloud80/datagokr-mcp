description_portal: 한국자산관리공사가 관리하는 국민행복기금 소액대출 월별 대부실행 건수 데이터를 제공합니다.국민행복기금 소액대출은 성실상환자에게 긴급 생활자금을(의료비, 임차자금, 결혼자금, 출산자금 등) 지원하는 역할을 수행합니다.지원대상은 공사,국민행복기금, 한마음금융, 희망모아, 상록수 ,신용회복위원회 등의 채무조정약정 성실상환자 및 개인회생 성실상환자를 대상으로 합니다.지원 금액은 최대 2,000만원입니다.대출 금리는 1.9%~4.0%입니다.대출기간은 최장 5년이며, 상환방식은 원리금균등방식으로 지원하고 있습니다.
