summary_user: 예금보험공사 부보금융회사 중 증권사의 주요 재무현황(총자산·자기자본·당기순이익·순자본비율·레버리지비율 등)을 증권사별로 담은 CSV 파일이며, 검증 시 60행이 수신됐다. 분석가나 금융소비자가 특정 증권사의 자본 건전성과 수익성이 어느 수준인지 비교할 때 쓴다. 법인등록번호(corp_rgst_no)를 조인 키로 삼아 같은 키를 가진 다른 금융회사 원장 데이터와 이어 쓴다.
description_portal: '(부보금융회사 종합정보)[참고사항]1. 데이터 개요본 데이터는 예금보험공사의 부보금융회사 중 증권사의 주요 재무현황 자료임2. 데이터 단위(억원) : 총자산, 자기자본, 당기순이익, 영업용순자본, 총위험액, 필요유지자기자본(%) : ROE, 순자본비율, 레버리지비율3. 데이터 주석1) 당기순이익 : 당기 기중누적금액2) ROE산출 시 당기순이익(최근1년) : 손익계산서상 당기순이익에서 대손준비금전입액을 차감하거나 대손준비금환입액을 가산한 금액3) ROE산출 시 자기자본(최근1년평잔) : 최근 1년간 월말 자본총계에서 대손준비금을 차감한 금액의 평균4) 순자본비율 : (영업용순자본-총위험액)/필요유지자기자본 * 1005) 레버리지비율 : 총자산/자기자본*1004. 특이사항1) 순자본비율 : 2016년부터 본격 시행되어 2016년 3월 데이터부터 순자본비율이며, 그 전 데이터는 영업용순자본비율(영업용순자본/총위험액*100)임※ 9개 증권사(NH투자, 대우, 삼성, 한국투자, 현대, 미래에셋, HMC투자증권, 부국)는 순자본비율 조기도입하여 2015년 3월데이터부터 순자본비율로 제공2) 필요유지자기자본 : 순자본비율 본격도입된 2016년 3월 데이터부터 포함. 그 전 데이터에는 해당 항목 없음3) 사명변경 : 사명이 변경된 경우 변경 후 데이터에는 변경된 사명으로만 표시함'
