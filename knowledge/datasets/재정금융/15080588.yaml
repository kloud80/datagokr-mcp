description_portal: 성남시 구별/연도별 주민 1인당 또는 세대 당 부담된 지방세액으로 시군구명, 과세년도, 주민1인당부담금액, 세대당부담금액, 지방세금액, 인구수, 세대수 항목으로 구성되어 있습니다. 특정 연도 또는 기간 동안 성남시에 거주하는 주민 한 사람이 평균적으로 부담한 지방세 금액을 나타내는 지표입니다. 주민세, 재산세, 자동차세 등 주요 지방세 항목을 합산한 뒤 성남시 총인구로 나누어 산출하는 값으로, 지역 주민의 세 부담 수준과 지방재정 자립도, 재정 여건을 파악하는 데 활용될 수 있습니다. 이 데이터는 연도별 추이를 함께 보면 경기 변동, 인구 변화, 세율 조정, 부동산 가격 변동 등 정책·경제 요인에 따른 세 부담의 변화를 분석하는 데 유용합니다. 또한 다른 시·군·구의 1인당 지방세 부담액과 비교하면 성남시의 상대적 세 부담 수준과 재정 구조의 특성을 파악하는 데 도움을 줍니다. 분석 시에는 기준연도, 금액 단위(원/천원/만원), 명목값인지 실질값인지 여부를 함께 확인하는 것이 중요합니다.
