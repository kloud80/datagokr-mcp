description_portal: 한국수력원자력㈜이 공개하는 해외사채 발행 현황 데이터는 공공기관으로서의 투명성을 강화하고 국민의 알 권리를 보장하기 위해 제공되는 자료로, 한수원이 발행한 해외사채의 주요 정보를 담고 있습니다. 해당 데이터에는 글로벌본드, 해외사모, 해외채권 등 다양한 형태의 해외사채가 포함되어 있으며 2025년 12월 31일 기준으로 남아 있는 해외사채의 발행일, 발행 금액, 적용 이자율, 현재 잔액, 상환일 등의 세부 항목을 확인할 수 있습니다. 이를 통해 국민과 이해관계자는 한국수력원자력㈜의 해외 조달 현황과 채무 관리 현황을 객관적으로 파악할 수 있으며 기관의 재무 건전성과 국제 자본시장에서의 활동에 대한 신뢰성을 제고하는 데 기여합니다. (포모사채권의 경우 변동금리로 발행되어 변동금리+가산금리로 자료가 작성되어있음을 확인바랍니다.)
