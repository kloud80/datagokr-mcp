description_portal: '‘서민금융진흥원 연도별 재원조성 현황’ 공공데이터는 서민금융진흥원이 정책서민금융 상품을 안정적으로 운영하기 위해 조성한 연도별 재원 조성 내역을 체계적으로 제공합니다. 구체적으로 다섯 가지 주요 항목별로 재원 금액이 연도(2016년~2025년)별로 집계되어 있어, 각 재원이 어떤 재원에서 얼마나 조성되었는지 한눈에 파악할 수 있습니다.서민금융진흥원 재원조성 현황- 휴면예금관리 : 휴면예금, 휴면보험금- 기부금 : 기부금-청년자산형성 : 청년희망적금, 청년도약계좌- 신용보증 : 복권기금, 금융회사 출연금, 정부 출연금, 햇살론 이관금- 자본금 등 : 자본금'
