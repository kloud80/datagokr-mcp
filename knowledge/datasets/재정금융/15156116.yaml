description_portal: 매출채권 팩토링이란 중소기업이 보유한 외상 매출채권을 신보가 매입하여 만기일 전에 조기에 현금화해줌으로써 기업의 유동성을 지원하는 제도입니다. 이 중 팩토링 상담 정보는 자금 조달이 필요한 기업이 실제 신청에 앞서 신보와 논의하는 가장 초기 단계의 기록입니다. 기업이 유동성 확보를 위해 팩토링 이용이 가능한지, 적용되는 할인율과 수수료는 얼마인지 등을 문의하고 협의한 내역이 상담 마스터와 상담 매출채권 관계 테이블에 담겨 있습니다. 나아가 단순 상담을 넘어 실제 심사가 진행될 때 작성되는 심사 검토표와 기업의 신용도 및 실적을 기반으로 최종 지원 금액을 산출하는 개별거래 한도사정 정보까지 포함하고 있습니다.이는 기업의 초기 자금 수요부터 신보의 심사 기준, 그리고 최종 한도 결정에 이르는 일련의 의사결정 과정을 보여주는 자료로, 팩토링 제도의 수요 분석 및 금융 지원 프로세스 연구에 활용도가 높습니다.
