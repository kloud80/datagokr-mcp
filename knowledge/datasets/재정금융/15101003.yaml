description_portal: 이 데이터는 기술보증기금이 혁신성장산업 분야에 대해 연도별로 공급한 보증 실적을 집계한 자료입니다. 주요 항목은 해당 연도의 업체 수, 보증 승인 건수, 총 보증 금액으로 구성되어 있습니다.혁신성장산업은 정부가 미래 성장동력 확보를 위해 육성하고자 발표한 산업이거나, 시장 수요 및 기술 변화 흐름을 반영하여 선정된 분야를 의미합니다. 해당 산업에는 AI, 바이오헬스, 시스템반도체, 스마트팜 등 기술 중심의 고성장 산업이 포함될 수 있습니다.이 데이터는 혁신성장산업에 대한 기술보증기금의 보증 지원 규모와 수요 변화 흐름을 연도별로 정량적으로 확인할 수 있도록 구성되어 있으며, 산업별 정책지원의 확산 정도나 금융지원의 확대 추세 등을 파악하는 데 유용한 기초자료로 활용될 수 있습니다.
