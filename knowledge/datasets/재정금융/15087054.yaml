description_portal: '본 데이터는 부산광역시 동래구 주민들의 지방세 납세 방법 및 납세 경향을 분석할 수 있도록연도별·세목별·납부채널별 납세현황을 체계적으로 정리한 자료입니다.이 데이터는 납세자 편의 제고, 전자고지 활용도 분석, 납부 채널 다변화 평가 등디지털 기반 지방세 행정의 개선 및 정책 수립에 활용할 수 있습니다. 주요 항목납부년도: 해당 납부가 이루어진 연도세목명: 취득세, 자동차세, 재산세, 주민세 등 납부 대상 지방세의 명칭납부매체: 세금이 납부된 방식 (예: CD/ATM, 인터넷지로, ARS, 가상계좌, 모바일앱 등)납부매체전자고지여부: 해당 납부가 전자고지를 통해 이루어졌는지 여부 (예: Y/N)납부건수: 해당 매체를 통해 이루어진 납부 건수납부금액: 해당 매체를 통해 납부된 총 세액납부매체비율: 전체 납부 건수 또는 금액 대비 특정 납부매체가 차지하는 비율 (%, 선택 항목) 활용 예시납세 채널별 이용현황 파악: 전자 납부 채널(지로, 인터넷, 모바일 등)의 활용 증가 여부전자고지 수용도 분석: 납부 방식 중 전자고지 수단 활용률 비교납세행태 변화 분석: 연도별 납부방식 추세 및 세목별 특성 파악정책 성과평가: 디지털 세정 서비스 확대 정책의 성과 분석 자료로 활용이 자료는 부산 동래구청 세무과 수집 및 관리하며,세목별 세부 통계나 월별 트렌드 분석이 필요한 경우 추가 데이터 요청이 가능합니다.'
