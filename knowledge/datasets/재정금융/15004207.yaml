description_portal: 이 데이터는 신용보증기금이 제공하는 이행보증 및 그 상대처에 대한 연도별 보증잔액 현황을 나타낸 자료로, 보증을 제공받은 기업과 보증의 상대처(공공기관, 지방자치단체, 민간기업 등) 간의 계약 이행 보증 내역을 확인할 수 있다. 이행보증은 계약당사자인 기업이 공사, 납품, 용역 등의 계약을 성실히 이행할 수 있도록 신용보증기금이 제3자인 상대처를 대상으로 보증을 제공하는 제도로, 계약불이행 시 발생할 수 있는 손실을 보전해 주는 역할을 한다. ‘보증잔액’은 해당 시점 기준으로 남아 있는 이행보증 금액을 의미하며, 연도별 변화를 통해 이행보증의 수요 및 공급 추이, 산업·기관별 집중도 등을 파악할 수 있다. 본 데이터는 공공 및 민간 부문에서의 이행보증 활용 현황을 분석하고, 보증기금의 위험관리 및 신용지원 정책 방향을 설정하는 데 활용될 수 있는 기초 자료이다.
