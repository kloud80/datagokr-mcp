description_portal: '무역의존도가 높은 개방형 무역구조를 지닌 우리나라에서 수입물품의 공급량과 가격은 국내 물가 형성에 큰 영향을 미치고 있어, 수입물품 유통구조를 개선하고 소비자의 올바른 구매를 유도함으로써 물가안정을 도모할 수 있도록 수입물품에 대한 효과적인 정보제공을 위해 원유평균 수입가격 통계를 개발하여 제공하고자 합니다.원유 평균 수입가격의 산출방식은 원유의 월간 총 수입가격(CIF)을 총 중량으로 나누고, 이를 배럴 단위로 환산((kg과 배럴 간 환산계수 : 7.39754401538)한 평균 가격입니다. 산정방법은 “월평균 수입가격 : 매월 1일 ~ 말일의 수입가격 평균, {∑총 수입액(USD)} ÷ {∑총중량(kg)}”과 “주평균 수입가격 : 매주 월 ~ 일요일의 수입가격 평균, {∑총 수입액(USD)} ÷ {∑총중량(kg)}”입니다. 비교가격으로 국내유류 판매가격의 산출방식은 “한국석유공사의 유가정보(전국 주유소의 평균판매가격(평균판매가격 = 개별 주유소 판매가격의 합 / 전체 주유소 개수))”를 활용하였습니다. 산정방법은 “주평균 가격 : 해당 주 일요일 ~ 목요일의 평균가격”입니다.원유 평균 수입가격 단위는 USA$/배럴이고, 국내 판매 유류가격은 원/리터입니다. 기간은 연도별 집계이며, 2011년부터 2025년까지입니다.'
