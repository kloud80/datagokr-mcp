description_portal: 이 데이터는 대한무역투자진흥공사(KOTRA)에서 제공하는 "지사화사업 기업참가비 할인혜택 적용 현황" 정보입니다. 해외지사화사업은 국내 중소·중견기업의 해외 진출을 지원하기 위해 KOTRA, OKTA(세계한인무역협회), 중소벤처기업진흥공단(KOSME) 등 공공기관이 운영하는 사업으로, 이를 통해 기업들은 해외 시장에 진출하는 데 필요한 다양한 지원을 받을 수 있습니다. 이 데이터는 지사화사업에 참여하는 기업들에게 제공되는 참가비 할인 혜택의 적용 현황을 보여줍니다. 할인 종류 구분, 표출 시작일자, 표출 종료일자 등의 정보를 포함하고 있어, 기업들이 할인 혜택의 종류와 적용 기간을 파악하여 사업 참여를 계획하는 데 유용합니다.
