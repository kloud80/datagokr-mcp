description_portal: 기술보증기금의 이행보증 상대처 정보 데이터는 중소·벤처기업의 계약 이행을 지원하기 위해 발행된 보증서의 세부 현황을 담고 있습니다. 본 데이터는 보증 성격에 따라 계약용과 지급용 등으로 구분하여 종류명을 명시하며, 해당 연도 내에 보증 기한이 만료되거나 의무가 해소된 경우 전액해지 여부를 별도로 기재하여 보증의 유효 상태를 파악할 수 있게 합니다. 또한 한국철도공사, 한국전력공사 등 공공기관부터 한국항공우주산업, 케이씨씨와 같은 민간 기업에 이르기까지 보증서를 제출받은 구체적인 상대처 명칭과 해당 기관의 소재지 정보를 시·군·구 단위로 제공합니다. 이를 통해 2022년부터 2025년까지의 연도별 보증 공급 내역과 상대처 정보를 한눈에 확인할 수 있는 기초 자료로 활용됩니다.
