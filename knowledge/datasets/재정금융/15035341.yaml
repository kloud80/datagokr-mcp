description_portal: 이 데이터는 기술보증기금이 보증 사고 이후 구상권 회수 시 적용하는 손해금율의 연도별 변경 내역을 정리한 데이터입니다.손해금율은 보증사고로 인해 기술보증기금이 대위변제를 한 뒤, 해당 기업으로부터 구상권을 회수하는 과정에서 적용되는 이자율을 의미합니다.이는 일반적인 금융기관의 연체이율, 정부의 정책방향, 시중금리 동향 등을 반영하여 조정됩니다.주요 항목은 ‘변경년도’, ‘변경전이율’, ‘변경후이율’, ‘변경사유’로 구성되어 있습니다.-‘변경년도’는 손해금율이 조정된 기준 연도를 나타냅니다.-‘변경전이율’과 ‘변경후이율’은 각각 해당 연도 조정 이전과 이후의 손해금율을 퍼센트(%) 단위로 기록한 항목입니다.-‘변경사유’는 손해금율 조정의 배경을 서술한 설명란으로, 예를 들어 ‘금융기관 연체이율 변경’, ‘중소기업 부담 완화’, ‘정부의 금리인하 조치 반영’ 등의 사유가 기재되어 있습니다.일부 연도에는 동일한 변경년도 내에서 두 차례 이상 이율이 조정된 경우도 있으며, 여러 해 동안 변경 없이 동일한 이율이 유지된 기록도 포함되어 있습니다.해당 데이터는 손해금율의 정책 변천 과정을 시계열로 확인할 수 있도록 구성되어 있으며, 보증 관련 회수 조건에 대한 이력 자료로 활용될 수 있습니다.
