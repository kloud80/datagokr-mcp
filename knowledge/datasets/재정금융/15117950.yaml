summary_user: 무역위원회 무역구제시스템에 등록된 자유무역협정(FTA) 목록을 협정 한 건당 한 행으로 담은 소규모 코드성 파일(약 528바이트)로, 협정 아이디·협정명·사용여부만 있다. 무역구제 신청이나 원산지 위반 관련 자료를 보는 사업자·분석가가 '시스템에서 어떤 FTA 코드가 쓰이고 지금 유효한가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰이는 전역 조인 키는 없어, 무역구제 관련 자료의 협정 아이디나 협정명을 이 목록에 이름·코드로 맞춰 붙이는 방식으로만 연결한다.
description_portal: 산업통상자원부 무역위원회 무역구제시스템의 자유무역협정 목록자료 데이터입니다.한-칠레, 한-싱가포르, 한-ESTA, 한-ASEAN, 한-인도, 한-EU, 한-페루, 한-미, 한-터키, 한-콜롬비아, 한-호주, 한-캐나다, 한-중국, 한-뉴질랜드, 한-베트남, 한-중미(5개국) FTA에 대한 정보를 담고 있다.무역위원회는 전자정부법에 근거하여 무역구제제도의 설명 및 정보 제공, 국내 산업보호 제도를 위한 덤핑, 지적재산권 침해, 원산지 위반을 관리감독하는 대 민원 지원서비스 제공 시스템을 운영하고 있습니다.무역위원회는 공식 홈페이지를 통해 무역구제 관련 정보 및 무역위원회의 공식 일정을 공지하고 있으며, 보다 자세한 사항은 무역위원회 홈페이지(https://www.ktc.go.kr)를 통해 확인해주시기 바랍니다.
