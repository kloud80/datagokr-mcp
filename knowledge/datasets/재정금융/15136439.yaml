summary_user: 해외지사화사업의 사업연도·차수별로 권역·국가·도시 단위 무역관이 모집하는 인원(TO)을 KOTRA·중소벤처기업진흥공단·세계한인무역협회(OKTA) 기관별로 나눠 담은 집계 파일입니다(CSV 약 95만 바이트). 해외 진출을 준비하는 중소기업이 '이번 차수에 내가 원하는 국가·도시 무역관에서 몇 개 기업을 뽑는가'를 확인하거나, 연구자가 지역별 모집인원 변동을 볼 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 국가명·도시명 같은 이름 매핑으로만 연결하며, 예컨대 관세청 국가별 수출입 실적과 국가명을 맞춰 비교하는 방식입니다.
description_portal: 이 데이터는 대한무역투자진흥공사(KOTRA)에서 제공하는 "해외지사화사업 모집 차수 별 무역관 모집인원(TO) 정보"입니다. 이 데이터는 각 모집 차수별로 무역관에서 모집하는 인원수(TO)를 상세히 공개합니다.   이를 통해 기업들은 자신이 희망하는 지역과 기관에서 어떤 모집 현황이 있는지 확인하고, 해당 정보를 바탕으로 보다 효과적인 신청 전략을 수립할 수 있습니다. 기업들은 이를 통해 경쟁력 있는 지역을 선정하고, 사업 참여를 위한 준비를 보다 체계적으로 진행할 수 있습니다. 또한, 정책 입안자나 연구자들이 지역 및 모집인원 변동 추이 등 해외지사화사업의 운영 현황을 분석하고, 기관별 지원 역량을 평가하는 데에도 유용한 자료입니다.
