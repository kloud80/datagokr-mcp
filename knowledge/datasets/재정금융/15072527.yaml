summary_user: 경기신용보증재단이 경기도 내 중소기업·소상공인에게 내준 신용보증 지원 실적을 시군·연도별로 집계한 자료로, 보증을 받은 업체 수와 보증 지원 금액(억원)을 담는다. 정책 분석가나 지자체 담당자가 '우리 시군의 보증 지원 업체 수와 금액이 해마다 어떻게 변했고 다른 시군과 비교하면 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 경기도 내 중소기업 및 소상공인을 대상으로 경기신용보증재단이 연도별로 제공한 신용보증 지원 실적을 시군 단위로 기록한 자료입니다. 주요 항목으로는 시군명, 연도, 신용보증을 받은 업체 수, 총 보증 지원 금액(억원 단위)이 포함되어 있으며, 각 지역의 금융지원 수혜 규모를 파악할 수 있습니다. 이 데이터는 지역별 경제 활성화 정도, 보증 수요 추이, 소상공인 지원 효과 분석 등에 활용되며, 지방정부 및 정책기관의 재정 운용, 금융지원 정책 수립, 위기대응 전략 수립 등의 기초 자료로 사용될 수 있습니다.
