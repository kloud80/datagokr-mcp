description_portal: 무역보험 빅데이터 플랫폼(K-SIGHT)에서 서비스를 제공 중인 국가 목록입니다. 본 API 를 통해 제공하는 국가는 총  264개국이며, 미국, 프랑스, 일본, 중국, 인도 등 수출 상위 국가 외에도 가이아나, 나미비아 등 다양한 국가들을 포함하고 있습니다. 무역에 관심이 있거나 수출이 예정되어 있는 분들은 공사의 빅데이터 플랫폼을 통해 원하는 국가를 선택하여 해당 국가의 경제동향, 신용등급, 인수방침, 수출결제정보 등을 확인할 수 있으며,  이를 통해 수출 시장 발굴 전 국가별 위험을 사전에 판별할 수 있습니다.
