summary_user: 한국무역보험공사 무역보험 빅데이터 플랫폼(K-SIGHT)이 서비스하는 국가의 코드와 국가명을 한 행에 한 국가씩 담은 목록이며, 포털 설명상 264개국을 포함한다. 수출을 준비하는 사업자나 분석가가 K-SIGHT에서 특정 국가의 경제동향·신용등급·인수방침 등을 조회하기 전에 "이 나라는 어떤 코드로 불러야 하나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 국가명 매핑이나 같은 기관(한국무역보험공사) 국가코드(ctryCd)를 쓰는 데이터와만 이어 쓴다.
limits: 국가코드와 국가명만 담고 있어 국가별 위험도·신용등급·경제동향 수치는 이 목록에 없다. 국가코드가 다른 기관의 국가코드 체계와 같다는 것이 확인되지 않았으므로, 관세청 수출입 실적 등과 연결할 때는 이름이나 코드를 따로 대조해야 한다.
