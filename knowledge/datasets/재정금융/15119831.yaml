summary_user: 경기도 실·국·과 부서별로 집행한 국고보조금·교부세 사업을 연도·사업 단위로 담은 자료로, 사업마다 당초 보조금과 1·2회 추경 예산액(천 원 단위)이 들어 있다. 분석가나 도의원이 '특정 사업의 국고보조금이 추경을 거치며 얼마나 늘거나 줄었는가', '어느 실국에 국고 지원이 몰리는가'를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준년도·실국명·부서명 같은 이름 매핑으로만 이어 쓰며, 지역 지표와 겹쳐 볼 때도 경기도 한 시도 단위로만 맞출 수 있다.
description_portal: 이 데이터는 경기도의 실·국·과 단위 부서에서 집행한 국고보조금과 교부세의 운영 현황을 담고 있으며, 사업별로 초기 보조금과 추가경정예산(1회, 2회) 내역까지 포함하고 있습니다. 항목에는 기준년도, 보조금 구분명, 실국명, 부서명, 사업내용, 당초보조금액, 1회 및 2회 추경예산액(모두 천 원 단위) 등이 포함되며, 수산장비 임대, 친환경 양식어업 육성, 친환경에너지 보급 등 다양한 공공사업의 재정 운용 내역을 확인할 수 있습니다. 이 자료는 지방재정의 국고 지원구조 분석, 사업별 재원배분 실태 파악, 예산 운용 효율성 평가, 재정정책 개선안 도출 등에 활용될 수 있습니다. 특히 사업 단위로 예산변화 내역을 파악할 수 있어 정책 집행의 연도별 추이를 분석하는 데 유용합니다.
