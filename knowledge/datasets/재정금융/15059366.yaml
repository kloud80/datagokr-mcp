summary_user: 경기도 공유재산 중 일반재산(토지)을 필지 단위로 담은 현황 자료로, 도로명·지번 주소와 WGS84 위경도, 재산관리관·위임관리관, 지목, 토지면적·실소유면적, 대부 여부와 대부면적을 기록한다. 경기도 안에서 매각·대부가 가능한 도 소유 토지가 어디에 얼마나 있고 이미 대부 중인지 확인하려는 사업자나, 시군별 공유지 대부 현황을 분석하는 분석가가 쓴다. 전역 조인 키는 없으므로 주소(정제지번주소)나 좌표로 토지·건물 원장, 공매 물건 등과 소재지 기준으로 맞춰 이어 쓴다.
description_portal: '경기도 공유재산 중 일반재산(토지) 현황 입니다. 주소, 관리관, 지목종류, 면적 등의 정보를 제공합니다.· 경기도 공유재산 구분- 행정재산:각재산관리관 부서에서 특정 행정목적으로 사용,관리하고 있는 재산- 일반재산:행정목적 상실,용도폐지된 재산, 처분(매각,대부,교환,양여 등)가능 재산"이 데이터는 경기도 내 공유재산 중 토지에 해당하는 부동산의 현황을 기록한 자료로, 토지의 도로명 및 지번 주소, 위도 및 경도, 재산관리관, 위임관리관, 지목(예: 잡종지, 대 등), 토지면적, 실소유연면적, 대부여부 및 대부면적 등의 항목으로 구성되어 있습니다. 주요 항목은 ‘정제지번주소’, ‘지목’, ‘토지면적’, ‘대부여부’, ‘정제WGS84위도’, ‘정제WGS84경도’ 등이 있으며, 공공자산의 활용 현황 분석, 행정재산과 일반재산의 구분, 지역별 대부 현황 파악, 부동산 행정의 투명성 확보 등에 활용될 수 있습니다. 위임관리관은 시군 단위 행정기관으로 분류되며, 대부된 토지의 경우 ‘대부면적’이 기재되어 있으며, 일부는 비어 있어 분석 시 유의가 필요합니다. 좌표 정보는 지도 기반 시각화 및 공간분석 작업에 적합하게 구성되어 있습니다.'
