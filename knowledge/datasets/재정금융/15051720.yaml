description_portal: 서울시 생필품 농수축산물 가격 정보는 물가모니터요원이 주 1회 자치구별 전통시장을 방문하여 농·수·축산물 16개 주요 품목의 실제 판매가격을 조사한 뒤 공개하는 데이터입니다. 각 건별로 일련번호, 조사 시장·마트 번호와 이름, 품목 번호와 이름, 실판매규격, 가격, 점검일자, 년·월 등이 기록되어 있어 시점별·품목별 가격 변동을 파악할 수 있는 구조입니다. 또한 시장유형 코드와 이름, 자치구 코드와 이름이 포함되어 전통시장 간, 자치구 간 가격 수준 비교가 가능하며, 비고 항목을 통해 행사 여부, 산지 등의 추가 정보도 확인할 수 있습니다. 본 시트 서비스에서는 최근 6개월간의 데이터를 제공하며, 그 이전 기간의 과거 자료는 파일 서비스로 별도 제공됩니다.
