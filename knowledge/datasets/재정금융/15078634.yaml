description_portal: 본 데이터는 성주군민 1인당 지방세 부담액 현황을 체계적으로 정리한 자료이다. 시도명, 시군구명, 자치단체코드, 과세년도, 주민1인당 부담금액, 세대당부담금액, 지방세 금액, 인구수, 세대수 정보를 포함하여 지역 주민의 세금 부담 수준과 지방 재정 수입 구조를 종합적으로 파악할 수 있도록 구성하였다. 해당 자료는 지방세 정책 수립, 세수 예측, 재정 운영 계획 수립 등 행정 의사결정에 필요한 근거자료로 활용된다. 또한 1인당 부담세액과 세목별 변화 추이를 정기적으로 갱신하여 정보의 신뢰성을 유지하며, 성주군 재정 건전성 관리와 주민 부담 형평성 확보를 지원하는 공공데이터이다.
