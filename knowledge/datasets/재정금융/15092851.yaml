summary_user: 신용보증기금 보증유동화(P-CBO 등) 유동화회사별 보증 개요를 회사 원장번호 단위로 담은 약 13KB 분량의 CSV 파일이다. 각 행에는 기초자산에 편입된 기업 수, 후순위 발행금액, 자산관리자명, 삭제 여부가 들어 있다. 분석가는 '유동화회사마다 몇 개 기업이 편입됐고 후순위 규모는 얼마인가'를 확인하는 데 쓰며, 전국 단위의 비공간 자료이다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 신보 자료와는 유동화회사원장번호나 자산관리자명 같은 이름·코드를 맞춰 연결해야 한다.
description_portal: 해당 파일 데이터는 신용보증기금의 보증유동화회사보증개요정보에 대해 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
