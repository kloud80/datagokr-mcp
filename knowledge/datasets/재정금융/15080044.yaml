description_portal: 이 데이터는 음성군의 지방세 비과감면율을 분석하기 위한 자료로, 총 11개 항목으로 구성되어 있습니다. ‘연번’은 각 행의 고유 번호를 나타내며, ‘시도명’과 ‘시군구명’은 해당 지역의 행정구역 정보를 제공합니다. ‘자치단체코드’는 자치단체를 식별하는 고유 코드입니다. ‘세목명’은 세금의 종류를, ‘과세년도’는 세금이 부과된 연도를 나타냅니다. ‘비과세금액’과 ‘감면금액’은 과세 대상에서 제외되거나 감면된 금액을 의미하며, ‘부과금액’은 실제로 부과된 세액을 나타냅니다. ‘비과세감면율’은 전체 과세금액 대비 비과세 및 감면된 금액의 비율을 나타내며, 세수 확보 및 정책 효과 분석에 활용됩니다. 마지막으로 ‘데이터기준일자’는 자료의 기준일을 의미합니다.
