description_portal: 경상남도 창원시의 EGS전자예금압류 현황 시스템의 체납 현황입니다. 항목은 순번, 자치단체코드, 체납자구분, 압류등록일, 취소일, 압류본세, 압류가산금, 압류건수, 추심최소요청금액, 은행명입니다.EGS전자예금압류 현황 데이터는 지방세·세외수입 체납자에 대해 은행 예금을 전자 방식으로 압류·추심한 사례를 등록일, 취소일, 압류 대상 금액, 가산금, 압류 건수, 은행명 등 항목별로 정리한 자료입니다. 이 자료는 체납 대응 효율 분석, 징수 정책 개선, 체납자 유형별 대응 전략 수립, 추심 성과 모니터링, 민원 및 추심 절차 투명성 확보 등 공공 재정집행 체계의 효과성과 정밀성을 높이기 위한 법정 징수 시스템 분석 자료로 활용될 수 있습니다
