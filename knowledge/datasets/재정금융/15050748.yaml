description_portal: 단순경비율 적용 대상자는 직전연도 업종별 수입금액 기준으로 판단하며, 일정 수입금액 규모 이하의 사업자들이 단순경비율을 적용받음. 단순경비율을 적용하게 되면 필요경비 전부를 단순경비율을 적용하여 소득금액을 간편하게 계산이 가능하며, 업종별 수입금액 기준이 미달하는 경우 적용 가능기준경비율은 장부를 기장하지 않은 매출 일정규모 이상의 사업자에 대하여 수입금액에서 증빙서류에 의해 확인되는 매입비용, 임차료, 인건비 등 주요경비를 공제하고 여기에 다시 나머지 추가 비용을 매출에 일정 비율로 곱해 추산한 뒤 차액을 제외하여 최종과세대상 소득금액을 계산하는 제도이 기준경비율 및 단순경비율은「소득세법」제80조제3항 단서에 따른 소득금액 추계결정 또는 경정을 하거나「법인세법」제66조제3항 단서에 따른 추계결정 또는 경정을 하는 경우에 적용합니다.
