description_portal: '본 데이터는 전국을 대상으로 연도와 월 단위별로 지역별 신규 분양 세대수를 집계하여 제공하는 공공데이터 자료입니다.시기별, 지역별로 파악할 수 있도록 행정구역 기준으로 분양 세대수를 정리하였으며, 데이터는 정해진 주기에 따라 갱신됩니다.[주택분양보증 참고사항]- 정의 : 사업주체가 파산 등의 사유로 분양계약을 이행할 수 없게 되는 경우 당해 주택의 분양의 이행 또는 납부한 계약금 및 중도금의 환급을 책임지는 보증- 보증대상 : 주택법 제15조에 의하여 사업계획승인을 받은 주택 및 복리시설추가적인 보증상품별 설명(보증금액, 보증기간, 상품개요, 이용절차 및 제출서류, 약관 등)은 주택도시보증공사 홈페이지에서도 확인 가능하니 참고하시기 바랍니다.'
