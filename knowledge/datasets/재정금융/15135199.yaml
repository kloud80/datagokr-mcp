description_portal: '이 데이터는 광주광역시 서구의 일반회계 및 특별회계 예산과 결산 정보를 연도별로 정리한 공공 재정 통계자료이며, **수치의 단위는 천 원(KRW 1,000)**입니다. 포함된 주요 항목은 ▲예산현액, ▲세입, ▲세출, ▲잉여금 등이며, 일반회계와 특별회계를 구분하여 각각의 재정 흐름을 독립적으로 파악할 수 있도록 구성되어 있습니다.일반회계는 일상적 행정 운영에 관련된 재정을, 특별회계는 특정 사업 목적(예: 상수도, 의료보험 등)에 사용되는 독립 재정을 나타내며, 이를 통해 서구청의 재정 운영 구조 전반을 이해할 수 있습니다.이 데이터는 ▲예산계획 수립, ▲세입·세출의 균형 분석, ▲결산 대비 예산 집행률 분석, ▲재정 건전성 진단 등에 폭넓게 활용되며, 행정의 투명성을 제고하고 시민의 재정 이해도를 높이는 데 기여합니다. 특히 연도별 추이 분석을 통해 재정 규모의 변화, 세입 기반 확대 여부, 세출 효율성 등을 정량적으로 평가할 수 있어 정책 기획 및 의회 보고, 행정감사에도 실효적인 기초자료로 기능합니다.데이터는 CSV 형식으로 제공되며, 정기적으로 갱신되어 통계 분석 및 시각화 도구와의 연계 활용이 용이합니다.'
