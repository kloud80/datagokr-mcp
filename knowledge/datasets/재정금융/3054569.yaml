description_portal: '이 데이터는 기술보증기금이 중소기업을 대상으로 제공한 보증금액을 기업의 업력(존속기간) 기준으로 구분하여 연도별로 집계한 현황입니다. 업력 구간은 1년 이하부터 10년 초과까지 여섯 단계로 구분되어 있으며, 각 연도별 보증잔액(단위: 억원)이 포함되어 있습니다.  여기서 창업기업이란 「중소기업창업지원법」 제2조 제2호에 따라, 중소기업을 새로 설립한 경우를 의미하며, 일반적으로 창업일로부터 7년 이내 기업이 해당됩니다. 단, 동법 제25조 제4항에 따르면 신산업기술 분야의 창업기업은 최대 10년 이내까지도 창업기업으로 간주되어 다양한 정책적 지원의 대상이 될 수 있습니다. 따라서 본 데이터의 "10년 이하" 구간까지는 창업기업 보증지원으로 볼 수 있어, 최대 10년을 기준으로 데이터가 구분이 되어있습니다.'
