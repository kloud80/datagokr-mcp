summary_user: 관세청 세관장확인대상물품을 HS부호별로 조회하는 API로, 품목마다 신고인이 확인해야 하는 법령, 요건승인기관, 요건확인서류, 적용시작일자를 담는다. 수출입 사업자나 관세사가 특정 HS부호 물품을 수입·수출할 때 어떤 법령에 따라 어느 기관의 허가·승인 서류를 갖춰야 하는지 확인하는 데 쓴다. HS부호(hsSgn, 관세청 HSK 10자리)를 키로 관세청 품목별 수출입 실적 등 HS부호 기반 데이터와 이어 쓰고, 요건승인기관코드는 별도 기관 코드표와 맞춰 본다.
description_portal: 품목코드, 수출입구분코드를 이용하여 세관장확인대상물품 의 HS 부호, 신고인 확인법령코드, 신고인 확인법령명, 요건승인기관코드, 요건승인기관명, 적용시작일자 등을 조회 할 수 있는 서비스입니다.세관장확인대상물품이란 관세법 제226조에 따라 수출입을 할 때 법령에서 정하는 바에 따라 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖출 필요가 있는 물품은 세관장에게 그 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖춘 것임을 증명하여야 합니다. 자세한 사항은 「관세법 제226조에 따른 세관장확인물품 및 확인방법 지정고시」로 정하고 있습니다.예를 들어 세관장확인대상 수출물품에는 (1) 「마약류 관리에 관한 법률」 해당물품, (3)「폐기물의 국가간 이동 및 그 처리에 관한 법률」 해당물품, (4)「외국환거래법」해당물품 등이 있으며, 세관장확인대상 수입물품에는 (1)「약사법」해당물품 중 의약품(첨단바이오의약품 포함) 및 한약재, (2)「마약류 관리에 관한 법률」 해당물품, (3)「수입식품안전관리 특별법」해당물품 중 식품 및 식품첨가물, 식품용 기구 및 용기․포장, 수산물, 건강기능식품, 축산물 등이 있습니다. 물품에따라 구비요건은 달라집니다.
