description_portal: 이 데이터는 기술보증기금이 제공한 보증유형별 월별 지원 현황을 나타낸 것으로, 보증의 이용 지속성과 유형별 특성을 월 단위로 파악할 수 있도록 구성되어 있습니다. 보증구분에는 총 7가지 유형이 포함되어 있으며, 각 유형별로 1월부터 12월까지 월별 보증 이용 건수를 기록하고 있습니다.가장 높은 수치를 보이는 **‘대출보증’**은 금융기관을 통한 자금 조달 시 기술보증기금이 지급보증을 제공하는 보증 유형으로, 전체 보증의 중심축을 이루는 핵심 상품입니다. **‘비은행대출보증’**은 비은행 금융기관이나 기타 기관에서의 자금 조달을 지원하며, 지속적으로 이용 건수가 감소하는 추세를 보입니다. **‘상거래담보보증’**은 거래대금을 담보로 제공하는 보증이며, **‘어음보증’**은 기업이 발행한 어음에 대한 지급보증 기능을 수행합니다. **‘이행보증’**은 공공계약 등의 이행을 담보하며, **‘지급보증의보증’**은 제3자의 보증을 다시 보증하는 구조입니다. **‘유동화회사보증’**은 자산유동화 기업에 대한 보증입니다.이 데이터를 통해 기술보증기금의 보증상품별 활용 추이와 수요 변동성을 종합적으로 분석할 수 있으며, 보증정책 운용의 방향성 파악에도 활용될 수 있습니다.
