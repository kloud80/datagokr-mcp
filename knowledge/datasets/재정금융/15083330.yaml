description_portal: 연도별 국가채무 총괄(결산) 현황 집계.국가채무(D1)는 ｢국가재정법｣에 따른 우리나라 고유의 채무개념으로 법상 국채, 차입금, 국고채무부담행위로 구성되나 정부 전체의 채무규모 파악을 위해 지방정부 채무도 포함하여 관리하고 있습니다.현금주의 기준으로 산출하며, 주로 예ㆍ결산시 정부 채무관리 목표 설정 및 실적점검 등에 활용하고 있으며 국가재정 건전성 분석, 채무상환능력 평가, OECD·IMF 비교 지표로도 활용됩니다.*해당 데이터는 공공저작물입니다. 저작권 정보를 참고하시어 데이터 이용에 유의하시길 바랍니다.(링크의 "메타정보열기"를 통해 확인가능)
