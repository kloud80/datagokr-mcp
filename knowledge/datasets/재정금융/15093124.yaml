summary_user: 신용보증기금 내부 조직인 부점(본부·지점·사무소)의 기준정보를 부점 이력 한 건당 한 행으로 담은 CSV 파일(약 51KB)입니다. 필드는 부점명, 본부·그룹·지역 구분, 폐지일자, 사무소 여부 등입니다. 분석가가 신보 보증 통계나 기업 명세에 나오는 취급 부점이 어느 본부·지역에 속하는지, 지금도 운영 중인지 확인할 때 씁니다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관 자료와 부점명이나 내부 구분코드를 맞춰 이어 써야 합니다.
description_portal: 해당 파일 데이터는 신용보증기금의 공통일반부점정보에 대해 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
