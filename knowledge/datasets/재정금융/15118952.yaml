description_portal: '상속세란 사망으로 그 재산이 가족이나 친족 등에게 무상으로 이전되는 경우에 당해 상속재산에 대하여 부과하는 세금을 말함- 해당연도 상속세 신고자 중 과세미달을 제외하고 작성- 배우자공제는 배우자의 법정상속분의 범위 내에서 실제 상속받은 재산가액을 공제함(최소 5억원에서 최대 30억원)- 기타공제에는 일괄공제, 금융재산상속공제, 동거주택상속공제 등이 포함됨- 가산하는 증여재산가액에 대한 증여당시 산출세액과 공제한도액 중 적은 금액을 공제 - 단기상속은 이미 상속세가 부과된 재산이 10년 이내에 재상속 될 경우 재상속이 개시되는 기간에 따라 일정률의 금액을 공제 (단위: 건수, 백만원)'
