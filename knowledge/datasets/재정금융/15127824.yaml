description_portal: 한국무역보험공사에서 수출보험 활용능력 및 무역 실무역량 제고를 위해 정기적으로 제공하는 무역보험 아카데미 일정에 관한 데이터입니다. 무역보험 아카데미는 무역보험 제도 활용방안 및 무역실무 전반에 대하여 온·오프라인 교육 프로그램을 제공하는 서비스로, 한국무역보험공사 본사 K-SURE 캠퍼스(서울), 천안아산 지역거점 수출중기지원센터 또는 비대면 진행됩니다. 이용 대상은 무역기업 및 금융기관 직원, 무역 업무에 관심이 있는 학생 등 일반인이며, 초급, 중급, 심화 과정으로 나누어져 있어 원하는 주제, 난이도에 맞게 수강 신청하실 수 있습니다.
