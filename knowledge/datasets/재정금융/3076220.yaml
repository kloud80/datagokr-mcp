summary_user: 울산광역시 남구가 공매로 매각한 차량을 한 대씩 기록한 건별 원천 파일로, 차량명·연식·매각예정가액·낙찰금액·매각결정일을 담는다(csv 약 2KB 규모의 소량 파일). 시민이나 중고차 구매자가 남구 공매차량이 예정가 대비 얼마에 낙찰됐는지, 연식별 낙찰가 수준이 어떤지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 차량명이나 같은 기관(울산 남구) 기준으로만 느슨하게 이어 쓸 수 있다.
description_portal: 울산광역시 남구의 공매차량 관련 정보를 수록한 데이터로, 차량의 식별번호(연번), 차량명, 연식, 매각예정가액, 낙찰금액, 매각결정일을 포함하고 있습니다. 본 데이터는 공공자산의 매각 내역과 절차의 투명성 확보를 위해 제공되며, 시민이 차량별 낙찰 현황과 매각 추이를 손쉽게 확인할 수 있도록 구성됨. 데이터 추출일은 2026년 7월 2일이며, 향후 행정적 활용성과 정보공개 가치 증대를 위해 지속적으로 갱신될 예정입니다. (다음 갱신 예정일은 2027년 7월 31일  입니다)데이터에 대한 문의사항이 있으신 경우 공공데이터 담당자 ☎052-226-5363으로 연락주시기 바랍니다.
