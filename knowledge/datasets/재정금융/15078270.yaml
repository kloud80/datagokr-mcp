description_portal: 경기도 파주시의 2017년부터 2019년까지 주민 한 사람당 지방세 부담액에 대한 공공데이터로 행정구역 식별을 위한 고유 코드인 시도 및 시군구 자치단체코드, 데이터가 적용되는 기준 연도인 '과세연도', 인구수, 세대수, 지방세 총액, 지방세 총액을 인구수로 나눈 '주민 1인당 부담금액', 세대 단위로 환산한 세부담 수준인 '세대당 부담금액' 등으로 구성되어 있습니다. 이 데이터는 지역 간 세부담의 상대적 수준을 비교하거나 과세 정책의 효과성 분석, 지역 간 조세 형평성, 인구 및 세대 구조에 따른 세부담 분포 분석, 시계열 분석을 통한 연도별 추이 파악, 세금 부담의 단위 기반 분석, 지역재정 정책 수립이나 데이터 기반 공공서비스 기획의 기초자료 등에 활용될 수 있습니다. 더불어, 지방세 징수현황과 관련한 최신 자료는 지방세징수현황 데이터, 주민등록 인구통계와 관련한 최신 자료는 주민등록월간인구통계를 참고하여 주시기 바랍니다.
