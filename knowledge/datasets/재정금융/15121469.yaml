description_portal: '주류도매업은 주류 제조업체나 수입업체로부터 주류를 구매하여, 슈퍼마켓, 음식점 등 소매업자에게 다시 판매하는 사업을 의미함주류도매업은 취급하는 주류의 종류에 따라 종합주류도매업, 특정주류도매업, 그리고 주류중개업으로 세분화되며, 각 면허마다 취급할 수 있는 주류의 범위가 다름종합주류도매업은 희석식소주, 맥주, 위스키 등 일반 주류와 탁주, 약주, 청주, 민속주, 농민주, 자치단체주 등 일반 탁주를 제외한 특정주류를 모두 취급할 수 있음특정주류도매업은 발효주류(탁주, 약주, 청주), 전통주, 소규모 맥주제조자가 만든 주류 등 면허를 받은 특정 주류만을 취급할 수 있음주류중개업은 주류를 소비자에게 직접 판매하는 소매업자에게 주류를 판매할 수 있음- 지역별 주류 관련 신규면허 현황- 종합주류 도매업, 특정주류 도매업, 주류수출입업, 주류중개업으로 구분(단위 : 개)'
