description_portal: '이 데이터는 2018년부터 신용보증기금을 이용한 기업들의 업종별 매출액세전계속사업이익률(Pre-tax Income from Continuing Operations to Sales Ratio)을 포함한 수익성 지표를 제공하며, 기업의 규모 분류(예: 외감기업, 비외감기업 또는 중소·중견·대기업 등)도 함께 포함된 자료이다. 매출액세전계속사업이익률은 기업이 지속적으로 수행하는 주된 사업에서 발생한 이익이 전체 매출액 대비 어느 정도인지를 나타내는 수익성 비율로, 기업의 영업 효율성과 경상이익 창출 능력을 파악하는 데 중요한 지표다. 이 데이터를 통해 업종별 수익구조의 특성과 기업 규모에 따른 수익성 차이를 비교할 수 있으며, 신용보증기금의 보증 대상 기업군의 경영성과를 분석하고 산업별 맞춤형 보증 및 지원 전략을 수립하는 데 활용할 수 있다. 또한 기업의 장기적인 성장 가능성과 신용위험 수준을 간접적으로 진단하는 데 유용한 기초자료로 기능한다.'
