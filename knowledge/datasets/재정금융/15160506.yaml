description_portal: 이 데이터는 신용보증기금의 U-CONNECT(유커넥트) 관련 창업기업 및 행사 운영 현황을 집계한 자료로, 스타트업_UCONNECT 기업정보, 스타트업_UCONNECT_주간 정보, 스타트업_UCONNECT_주간 참여 정보, 스타트업_UCONNECT_온라인 매칭 정보 등의 테이블을 포함하고 있다. 본 데이터는 UCONNECT 영위분야, 온라인매칭상태 등 참여 기업의 기본적인 현황을 제공함으로써, 유커넥트 운영과 관련된 전반적인 업무 흐름을 종합적으로 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터 내 ‘UCONNECT 기업정보’ 및 ‘영위분야’ 정보는 투자유치 행사에 참여하는 창업기업의 대략적인 구성을 살펴보는 데 활용될 수 있으며, ‘주간 참여 정보’ 및 ‘온라인 매칭 정보’ 등은 행사 진행 및 투자자와의 온라인 연계 과정에서의 단편적인 경향성을 파악하는 기초 자료를 제공한다
