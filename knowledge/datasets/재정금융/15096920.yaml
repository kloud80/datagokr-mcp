summary_user: 제주특별자치도의 지역내총생산(GRDP)을 기준 연도별로 집계한 통계로, 명목·실질 GRDP(백만원)와 1인당 GRDP(천원)를 담는다. 분석가나 정책 담당자가 '제주 경제 규모가 연도별로 얼마나 커졌고, 물가 효과를 뺀 실질 성장은 어땠는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 기관의 다른 연도별 통계와는 기준 연도를 맞춰 붙여 쓴다.
description_portal: 이 데이터셋은 제주특별자치도 내에서 일정 기간 동안 생산된 모든 재화와 서비스의 시장가격 기준 부가가치 총합, 즉 지역내총생산(GRDP)을 연도별로 집계한 공공 통계자료다. GRDP는 해당 지역의 경제 규모와 구조를 파악하는 핵심 경제지표이며, 이 자료를 통해 제주 지역 전체 경제의 성장 추이, 산업 구조 변화, 경제활동 수준을 객관적으로 분석할 수 있다. 지방자치단체나 정책 입안자는 이를 바탕으로 지역경제 발전 전략, 재정·투자 계획, 산업 육성 정책을 설계할 수 있고, 연구자나 민간 분석가 또한 제주 경제의 장기 변화, 산업별 기여도, 지역 간 비교 분석 등에 활용할 수 있는 기초 자료로서 가치가 높다. 자료는 CSV 혹은 공개 데이터 형식으로 제공되어 누구나 접근 가능하다.
