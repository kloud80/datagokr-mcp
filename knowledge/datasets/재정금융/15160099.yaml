summary_user: 신용보증기금 매출채권보험 업무 중 인수·해지 관련 현황을 담은 파일로, 실측 필드는 보험증권 관리 ID·작성일자·증권 시작/종료 일련번호·일련번호 매수로 구성된 보험증권 일련번호 관리 내역이며 범위는 전국·비공간입니다. 매출채권보험 증권이 어떤 일련번호 구간으로 몇 매씩 발급·관리됐는지 업무 흐름을 파악하려는 분석가나 연구자가 참고용으로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 보험증권관리ID 같은 기관 내부 코드나 이름 매핑으로만 연결된다.
description_portal: 이 데이터는 신용보증기금의 매출채권보험 업무 중 인수 및 해지 관련 현황을 집계한 자료로, 보험_인수해지_보험증권_일련번호_관리_상세, 보험_인수해지_원장_이행지체_고객_알림_정보 등의 테이블을 포함하고 있다. 본 데이터는 보험 계약의 인수·해지 과정 및 이행지체 알림 관련 기본적인 관리 현황을 제공함으로써, 관련 분야의 전반적인 업무 흐름을 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터는 유관 분야의 일반적인 현황 파악이나 학술 연구 등을 위한 단순 참고용 자료로서의 역할을 수행하며, 공공데이터 개방 취지에 부합하도록 지원한다.
