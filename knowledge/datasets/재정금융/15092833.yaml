summary_user: 신용보증기금의 보증 상담을 상담 건별(상담ID·상담일자·일련번호)로 담은 원천 마스터 파일로, 상담금액·보증비율·자금용도·보증구분·상담결과와 보증신청 처리상태 같은 항목이 들어 있으며 범위는 전국·비공간이다. 분석가가 '보증 상담이 어떤 채널·자금용도로 들어와 어떤 결과로 이어졌는지, 상담금액과 보증비율은 어떻게 분포하는지'를 살피는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업·보증 데이터와는 직접 결합되지 않고, 상담기업개요ID나 각종 코드를 같은 기관(신용보증기금)의 다른 자료와 맞춰야 이어 쓸 수 있다.
description_portal: 해당 파일 데이터는 신용보증기금의 보증상담마스터에 대한 정보를 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
