summary_user: 한국거래소 상장 ETF·ETN·ELW의 종목별 일별 시세(시가·종가·고가·저가·거래량·등락 등)를 담은 건별 원천 API로, 전체 5,339,531건이며 3개 오퍼레이션으로 나뉜다. 투자자나 분석가가 특정 ETF의 최근 종가와 순자산, 기초지수 대비 움직임을 확인하는 질문에 쓴다. 단축코드(srtnCd)와 ISIN코드(isinCd)가 모두 종목코드(stock_cd) 키라서, 같은 키를 쓰는 연기금 보유·기업 공시 데이터와 이어 쓴다.
description_portal: '증권상품시세정보는 한국거래소에서 제공하는 상장 증권상품의 실시간 시세 정보를 제공하는 데이터입니다.상장지수펀드(ETF), 상장지수채권(ETN), 주식워런트증권(ELW) 등 주요 증권상품의 시가, 종가, 고가, 저가, 거래량, 변동률 등 시세 항목을 포함하고 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① ETF 시세 : 상장지수펀드(ETF)의 종목별 시세 정보를 조회합니다.② ETN 시세 : 상장지수채권(ETN)의 종목별 시세 정보를 조회합니다.③ ELW 시세 : 주식워런트증권(ELW)의 종목별 시세 정보를 조회합니다.'
