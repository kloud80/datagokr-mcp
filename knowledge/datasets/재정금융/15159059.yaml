description_portal: 광주광역시 남구 지방세 비과세 감면율 현황 데이터입니다. 해당 데이터는 시도명, 시군구명, 세목명, 과세연도, 비과세금액, 감면금액, 부과금액, 비과세 감면율 항목을 포함합니다. 비과세금액은 법류이나 조례에 따라 세금을 아예 부과하지 않는 금액이며, 감면금액은 부과된 세금에서 일정 부분을 경감해 주는 금액을 뜻합니다. 이 데이터는 지방세 전체 과세액 대비 비과세액과 감면액의 비율을 통해 국민의 실질적인 세 부담과 조세 혜택 규모를 파악하고, 조세 정책의 공정성과 효과성을 평가하며 향후 세제 개선 방향을 설정하는 기초자료로 활용됩니다.
