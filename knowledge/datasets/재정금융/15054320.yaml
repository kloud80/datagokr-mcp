summary_user: 국유재산을 결산연도별로 토지·건물·유가증권·기타로 나눠 금액(억원)을 담고, 토지는 면적(제곱킬로미터)도 함께 담은 전국 단위 연도별 집계 파일로, 포털 설명상 1991~2024년 자료다. 분석가나 국민이 '국유재산 총규모와 토지·유가증권 비중이 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도(결산연도)를 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 국유재산 연도별로 토지, 건물, 유가증권, 기타로 구분하여 연도별 국유재산 금액을 제공하는 자료입니다.  데이터 중 토지의 경우 국유 토지의 면적 현황 자료도 같이 제공하고 있습니다.재산 금액의 단위는 억원이며 토지 면적의 단위는 제곱 킬로미터로 제공하고 있습니다.결산연도 기준으로 1991~2024년까지의 자료이며 연도별로 총 규모 및 재산 종류별 규모의 변화를 확인할 수 있습니다. * 해당 데이터는 공공저작물입니다. 저작권 정보를 참고하시어 데이터 이용에 유의하시길 바랍니다.(링크의 "메타정보열기"를 통해 확인 가능)
