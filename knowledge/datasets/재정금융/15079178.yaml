description_portal: 연도별 지방세 과세 및 비과세 현황을 세목별로 제공하는 데이터로, 과세년도, 세목명, 과세건수 및 금액, 비과세·감면 건수와 금액, 감면 근거 등을 포함하고 있습니다. 이를 통해 지방세 부과 구조와 감면 정책의 흐름을 종합적으로 파악할 수 있습니다.특히 최근의 지역 간 재정 격차, 인구 감소 및 고령화 등 사회적 변화 속에서 지방세 수입 구조를 분석하는 기초 자료로 활용될 수 있으며, 공정 과세와 정책 효과 검증에도 중요한 역할을 합니다.시민들은 해당 데이터를 통해 세금 부과 기준과 감면 내역을 보다 쉽게 이해하고, 자신의 납세 의무를 명확히 인식할 수 있습니다. 또한 지방정부는 이를 바탕으로 효율적인 세원 관리와 합리적인 세제 운영을 추진하여 지역 재정 건전성을 높일 수 있습니다.아울러 공공데이터 공개를 통해 세금 운영의 투명성을 강화하고, 행정에 대한 시민 신뢰를 제고하는 데 기여하고자 합니다.
