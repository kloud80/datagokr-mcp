summary_user: 서민금융진흥원이 운영하는 정책 서민금융상품 중 미소금융과 햇살론의 지원 실적을 기준연월(basYm) 단위로 집계해 대출·보증 건수와 금액을 담는 전국 범위 데이터로, 미소금융·햇살론 2개 조회 기능으로 나뉜다. 분석가나 정책 담당자가 '최근 몇 달 사이 햇살론 보증 건수와 금액이 상품별로 어떻게 달라졌나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연월이나 상품명 매핑으로만 맞춰 쓴다.
description_portal: '서민금융지원실적정보는 서민금융진흥원에서 운영하는 정책 서민금융상품의 지원 실적을 제공하는 데이터입니다. 지원항목은 대표적으로 미소금융, 햇살론, 새희망홀씨, 바꿔드림론, 안전망대출 등이 있으며, 지원유형별 지원금액, 이용자 수, 성별·연령대별 실적 등이 포함됩니다.이 데이터는 2개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 미소금융지원실적 조회 : 미소금융의 지원금액, 이용자 수, 지역별·성별·연령대별 실적 현황을 조회합니다.② 햇살론지원실적 조회 : 햇살론의 신청·접수·실행 현황, 지원금액, 성별·연령대별 실적 등을 조회할 수 있습니다.'
