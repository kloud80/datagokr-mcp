description_portal: '경상북도 청송군 세원유형별 과세현황은 청송군에서 지방세를 부과할 때 각 과세 대상(예: 주택, 토지, 자동차 등)별로 실제로 부과한 내역을 결산 기준으로 제공하는 데이터입니다.이 데이터는 세목별(재산세, 취득세, 자동차세 등)로 나누어, 세원 유형별 부과건수와 부과금액을 연도별로 명확하게 파악할 수 있도록 구성되어 있습니다.세원유형별 과세현황 자료는 청송군의 세입구조 분석, 지방재정 효율성 평가, 자치단체별 세원 편중 여부 진단 등에 폭넓게 활용됩니다.또한 공공데이터포털을 통해 누구나 무료로 다운로드 및 활용이 가능하며, 세부 데이터를 분석해 연도별·유형별 과세 경향 및 지역 특성을 한눈에 파악할 수 있습니다.'
