summary_user: 주택도시보증공사가 분양보증을 발급한 전국 분양사업장을 사업장 한 곳씩 담은 건별 파일로, 시행·시공업체, 지역, 사업구분, 총·일반분양·조합원·임대보증 세대수, 분양가격, 모집공고승인일·분양개시일·보증발급일을 담는다. 분석가나 수요자가 '특정 지역에서 언제 어떤 단지가 몇 세대, 얼마의 분양가로 공급됐는가'를 확인하거나 시기별 분양 물량과 분양가 추이를 볼 때 쓴다. 사업장명(hug_guarantee_site)이 실측 조인 키여서 HUG의 다른 보증 사업장 데이터와 사업장 단위로 이어 쓰고, 지역명은 문자열로만 있어 행정구역 코드를 통한 공간 연계는 직접 매핑해야 한다.
description_portal: '본 데이터는 분양사업의 주요 정보를 제공하는 공공데이터 자료입니다. 사업장명, 세대수, 분양가격, 지역명, 모집공고승인일, 분양개시일, 보증발급일자 등으로 구성되어 있습니다.2017년부터 전국의 분양정보이 포함되어 분양 관련 주요 현황을 한눈에 확인할 수 있으며, 데이터는 정해진 주기에 따라 갱신됩니다.[주택분양보증 참고사항]- 정의 : 사업주체가 파산 등의 사유로 분양계약을 이행할 수 없게 되는 경우 당해 주택의 분양의 이행 또는 납부한 계약금 및 중도금의 환급을 책임지는 보증- 보증대상 : 주택법 제15조에 의하여 사업계획승인을 받은 주택 및 복리시설추가적인 보증상품별 설명(보증금액, 보증기간, 상품개요, 이용절차 및 제출서류, 약관 등)은 주택도시보증공사 홈페이지에서도 확인 가능하니 참고하시기 바랍니다.'
