summary_user: KRX가 개발한 ESG지수를 추종하는 ESG증권상품의 일별 시세를 상품별로 담으며, 기준일자별 종가·전일대비 증감(금액·비율)·상장좌수·거래량·거래대금을 담는 전국 단위 비공간 데이터다. 투자자나 분석가가 특정 ESG 상품의 최근 가격 흐름과 거래 규모가 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으며, ESG증권상품코드(esgScrtPrdCd)나 상품명을 매핑해 같은 기관의 다른 증권 시세·상장종목 데이터와 이어 쓴다.
description_portal: ESG증권상품은 ESG증권과 관련된 통계정보를 확인할 수 있습니다. 이 데이터는 1개 오퍼레이션으로 구성되어 있습니다. ESG증권상품의 기준일자, ESG증권상품명, ESG증권상품코드, ESG증권상품종가, 전일대비증감금액, 전일대비증감비율, 상장좌수, ESG증권상품거래량, 거래대금을 조회할 수 있습니다. ** 유의사항 ** ① 본 서비스에서 제공되는 정보는 데이터 제공기관의 책임 하에 작성되었으며, 금융위원회는 이의 정확성 및 완전성을 보장하지 않습니다. ② 금융위원회는 어떠한 경우라도 본 서비스를 통해 제공받은 정보를 이용하여 이용자가 얻은 이득이나 입은 손해 등 결과에 대해 책임이 없습니다. ③ 금융위원회는 금융공공데이터 이용자간 또는 금융공공데이터 이용자와 제3자간에 서비스를 매개로 한 거래 등과 관련하여 어떠한 책임도 부담하지 아니하고, 금융공공데이터 이용자가 서비스의 이용과 관련하여 기대하는 이익에 관하여 책임을 부담하지 않습니다. ④ 금융위원회는 서비스에 관하여 금융공공데이터 이용자가 금융위원회가 정한 제반 규정, 이용 안내 및 관계 법령을 준수하지 않은 이용으로 인한 결과에 대하여 책임을 지지 않습니다.⑤ 상기 증권상품 정보는 KRX에서 개발한 ESG지수를 추종하는 ESG증권상품 기준입니다.
