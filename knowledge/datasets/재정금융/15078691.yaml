description_portal: '지방세 금액 중 비과세·감면액이 차지하는 비율(시도명, 시군구명, 자치단체코드, 세목명, 과세년도, 비과세금액, 감면금액, 부과금, 비과세감면율)지방자치단체에서 운영하는 지방세(취득세, 재산세, 자동차세 등)의 비과세 및 감면 조치 비율 현황을 정리한 자료입니다. 본 데이터는 세목별 비과세·감면율, 적용 대상 유형(예: 사회복지, 농어업, 에너지 절약 등), 지역 간 비교 등을 분석할 수 있어 재정 정책 검토, 세제 지원 효과 평가, 민원 대응, 형평성 점검 등에 활용될 수 있습니다.방대한 조항 및 항목이 포함될 경우 일반 뷰어(엑셀, 메모장 등)에서 일부 항목이 누락될 수 있으므로 R, Python, GIS 등 분석 및 시각화 도구 사용을 권장합니다.비과세·감면 기준, 집계 방식, 해당 시점(연도) 등 세부 정의와 적용 범위는 해당 지자체의 메타데이터나 기술문서를 참고해 주세요.'
