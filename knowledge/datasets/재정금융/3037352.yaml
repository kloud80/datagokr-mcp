summary_user: 예금보험공사가 예금자보호 대상으로 정한 금융상품을 금융회사명·상품명·상품유형·등록일자·판매중단일자와 함께 상품 단위 목록으로 담으며, 범위는 전국이다. 금융소비자는 "내가 가입한 이 상품이 예금자보호를 받는가"를 확인하는 데 쓰고, 분석가는 금융회사별 보호 상품을 비교하는 원장으로 쓴다. 전역 조인 키가 없어 다른 금융상품·금융회사 데이터와는 금융회사명(fncIstNm)이나 상품명을 이름으로 맞춰 이어 쓴다.
limits: 금융회사 코드 같은 공통 키가 없어 다른 데이터와 연결할 때 이름 표기 차이로 매칭이 어긋날 수 있다. 개발계정은 하루 10,000회까지 호출할 수 있고, 활용신청 후 serviceKey를 넣어 호출한다.
