description_portal: 해당 데이터는 경기도 가평군을 포함한 지방자치단체의 지방세 비과세 및 감면 현황을 파악할 수 있도록 구성된 자료입니다. 시도명, 시군구명, 자치단체코드 등 행정구역 정보와 세목명, 과세년도 기준으로 비과세금액, 감면금액, 부과금액을 제공합니다. 이를 통해 지방세 부과 대비 비과세 및 감면 규모를 비교하고 세목별 세수 구조를 이해할 수 있습니다. 또한 비과세감면율을 통해 전체 세수 대비 세제 지원 비중을 분석할 수 있으며 연도별 변화 추이 파악이 가능합니다. 데이터기준일자는 자료 최신성 판단 기준으로 활용되며 지방재정 운영 분석과 세정 정책 수립의 기초자료로 활용됩니다. 아울러 세입 관리 및 재정 건전성 평가에도 참고자료로 활용됩니다. 다양한 정책 분석에 활용됩니다.
