description_portal: 한국무역보험공사의 전세계 업종별 수출거래 시 지급인도조건(Documents against Payment)을 사용하는 비율 데이터입니다. 한국무역보험공사는 무역보험 업무 운영과정에서 발생한 실제 수출대금 결제정보 빅데이터 약 100만 건을 활용, 종합적인 통계분석 작업을 수행하여 수출기업, 수출지원기관 등 해외수출 관련 이해관계자들이 수출실무에 활용할 수 있는 스마트 수출결제정보 데이터를 제공하고 있습니다. 지급인도란 수출상이 화물을 선적하고 구비된 운송서류에 일람출급 환어음을 발행 첨부하여 거래은행을 통하여 수입국의 추심은행 앞으로 어음대금을 추심의뢰하면 추심은행은 수입상에게 어음을 제시하여 수입대금의 일람지급과 동시에 운송서류를 인도하는 거래방식을 말합니다.
