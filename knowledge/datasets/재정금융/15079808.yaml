description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시의 연도별 지방세 부담 현황을 포괄적으로 분석할 수 있는 재정통계 자료입니다. 각 과세연도의 지방세 총액과 해당 지역의 인구 및 세대 규모를 바탕으로 주민 1인당, 세대당 지방세 부담금액을 계산하여 제공합니다. 이 데이터는 지방자치단체의 재정 건전성을 평가하고, 타 지역과의 세부담 수준을 비교 분석하며, 지방세 정책 수립을 위한 기초자료로 활용됩니다. 또한 주민들의 지방세 납세 현황을 객관적이고 투명하게 파악할 수 있는 중요한 근거 자료입니다.2. 데이터 항목명- 시도명- 시군구명- 자치단체코드- 과세년도- 주민 1인당 부담금액- 세대당 부담금액- 지방세 금액- 인구수- 세대수3. 기대효과본 데이터는 지방자치단체가 증거 기반의 재정정책을 수립하고 세정 운영을 효율화하는 데 기여할 것입니다. 동시에 주민들에게 투명한 세정 정보를 제공함으로써 지방재정에 대한 이해도와 참여 의식을 높이는 긍정적인 효과를 기대할 수 있습니다.
