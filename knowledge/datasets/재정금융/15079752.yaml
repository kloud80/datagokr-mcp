description_portal: '이 데이터는 음성군의 세원 유형별 과세 현황을 보여주는 자료로, 지방세의 부과 실적을 유형별로 분석할 수 있습니다.연번은 데이터 순서를 나타내며, 시도명과 시구군명은 해당 지역을 식별합니다. 과세년도는 세금이 부과된 연도를 의미하고, 세목명은 세금의 종류(예: 주민세, 자동차세 등)를 나타냅니다. 세원 유형명은 과세 대상의 성격(예: 개인, 법인, 차량 등)을 구분하며, 부과건수는 해당 유형에 대해 부과된 건수, 부과금액은 총 세액을 의미합니다. 데이터기준일자는 해당 정보가 기준으로 삼은 날짜로, 데이터의 최신성과 정확성을 판단하는 데 활용됩니다. 이 데이터는 세원별 징수 전략 수립과 세수 예측에 중요한 기초 자료로 활용됩니다.'
