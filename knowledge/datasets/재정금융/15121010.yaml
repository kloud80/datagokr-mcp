description_portal: 경제협력개발기구(OECD )회원국의 국내총생산(GDP )대비 재산과세(Taxes on Property, 코드4000)비중에 대한 시계열 데이터입니다.1965년부터 2023년까지의 연도별 통계자료이며 해당연도 데이터가 없는 국가는 데이터 미제공 국가입니다. OECD국가, 재산과세, GDP대비 등의 키워드를 중심으로 구성된 이 데이터는 국가별 재산과세 부담과 조세 구조를 분석 및 비교하는데 활용됩니다.조세정책 수립, 국제비교 연구, 세제 개편 방향 설정 등에 기초자료로 제공되며, 정부, 연구기관, 국제기구 등에서 다양하게 활용됩니다. 또한, 통계는 OECD 원자료를 기반으로  하며,GDP 기준으로 조세 비중 분석을 통해 글로벌 조세 정책 흐름 및 방향을 파악하고, 관련 정책 수립의 근거 자료로도 유용한 공공 통계입니다.
accrual_periodicity: 연간
