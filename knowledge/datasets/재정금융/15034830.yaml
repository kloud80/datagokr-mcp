summary_user: KOTRA 해외 무역관이 있는 국가별 비즈니스 정보 가운데, 현지에 진출한 한국기업의 기업명·모기업·업종·취급분야·진출연도·진출형태를 기업 단위로 담는 API다. 해외 진출을 준비하는 사업자나 분석가가 '목표 국가에 이미 어떤 한국기업이 어떤 업종과 형태(법인·지사 등)로 언제 들어가 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 한국기업명(korCompNm)이나 모기업명을 이름으로 맞추거나 같은 기관(KOTRA) 데이터끼리만 연결한다.
description_portal: KOTRA 국가정보 Open api는 KOTRA 해외 무역관이 운영되고 있는 해외 소재 국가별 비즈니스 및 시장 분석 데이터를 Open api 형태로 제공하고 있는 공공 데이터 입니다. 고객들은 해당 Open api를 통해 타깃 국가 진입 전 정보 수집을 하여 해외 진출 전략을 수립할 수 있으며, 앱 및 서비스 개발 시 대시보드 등을 구현하여 데이터 시각화에 활용할 수 있습니다. 해당 데이터는 해외경제정보 드림에서도 열람이 가능한 데이터로, 해외 시장 진출을 희망하는 고객들에게 유용한 데이터가 될 수 있습니다.
