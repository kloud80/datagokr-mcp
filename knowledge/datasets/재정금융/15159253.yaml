description_portal: '금천구_지방세 비과세 감면율 현황 데이터는 서울특별시 금천구의 지방세 비과세 및 감면율 현황을 세목명별, 과세연도별, 감면구분별로 정리한 자료입니다. 지방세법, 지방세특례제한법, 감면조례, 조세특례제한법 등의 감면구분별 건수, 세액금액을 확인할 수 있습니다.이 데이터를 통해 금천구의 세금 감면 혜택 정보에 대해 파악할 수 있습니다. 감면구분 항목에 따른 통계를 통하여 해당하는 세금 감면 규모를 확인해보고 관련 혜택을 찾아볼 수 있는 기초 자료로써 활용할 수 있습니다.또한, 금천구의 세액 감면 관련 지역정책 및 경제 흐름을 분석할 수 있습니다. 연도별 세목별 감면 추이를 통해 금천구의 복지 정책 우선순위를 확인하여 경제 흐름의 변화를 객관적으로 파악할 수 있습니다. 만약 특정 세목에서 감면율이 높다면 관련 정책을 확인하여 누릴 수 있는 혜택을 알아보고, 필요한 조치를 취할 수 있습니다.타 지역에 거주하고 계시는 분들도 거주지역과의 세금 부과와 감면 정책을 비교하면서 거주 지역에서 받을 수 있는 혜택에 대하여 더 자세하게 살펴볼 수 있습니다.(담당부서 : 금천구 재산세과)※ 해당 데이터의 단위는 (건수 : 건, 세액 : 천원) 입니다.'
