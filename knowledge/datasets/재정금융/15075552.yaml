description_portal: "2015년부터 2021년까지 국민관심사업 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*2019년 선정기준입니다.2021년 국민관심사업은 2020년 대비 3.9조원(13.4%) 증가한 33.6조원입니다.국민관심사업이란 국민의 삶과 밀접한 정보와 데이터 등을 국민중심으로 개방, 국민관심 재정사업은 31개로, '안전하고 살기좋은 대한민국'과 '혁신성장으로 활력있는 대한민국'으로 구성되어 있습니다.- 안전하고 살기좋은 대한민국 : 미세먼지, 안전, 저출산·고령사회 관련 생활안전, 육아·보육 및 노후 생활 등의 사업- 혁신성장으로 활력있는 대한민국 : 경제적 측면의 사회구조 및 체질개선, 경제 활력도모를 위한 일자리창출, 소상공인·창업자 지원 등의 사업"
