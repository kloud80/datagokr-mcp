description_portal: '(부보금융회사 종합정보)『예금자보호법』 제30조 및 동법 시행령 제16조의 4에 근거하여 부보금융회사는 매년 예금등의 잔액(보험회사의 경우애는 『보험업법』 제120조의 규정에 의한 책임준비금을 감안하여 대통령령이 정하는 금액)에 1천분의 5를 초과하지 아니하는 범위 안에서 대통령령이 정하는 비율을 곱한 금액(당해 금액이 10만원보다 적은 경우에는 10만원)을 연간 보험료로 공사에 납부하고 있습니다.동 자료는 예금보험제도에 가입되어 있는 개별 부보금융회사가 정기적으로 공사에 납부하는 "예금보험료"와 공적자금상환대책에 따라 예보채권상환기금 부담 부채의 원활한 상환을 위하여 부보금융회사에서 기존 보험료와는 별도로 공사에 납부하는 "특별기여금"을 수납한 정보입니다(단위 : 억원, 연단위 누적).'
