description_portal: 2021년 기준 결산 시계열 자료입니다.최근 10년간 자산 부채추이 및 국가채무(D1) 증가액 추이를 보여줍니다.자산, 부채, 순자상과 국가채무 증가액 등의 데이터 포함합니다.결산이란, 한 회계연도 세입예산의 모든 수입과 세출예산의 모든 지출을 확정적인 계수로 표시하는 행위로, 한해동안의 재정운용에 대한 정부의 사후적 재무보고를 의미합니다.순자산은 555.7조원으로 전년(443.2조원) 대비 112.5조원 증가하였습니다.재정운영결과는 -43.0조원으로 재정운영에 따른 비용이 수익을 초과하였음을 의미합니다.
