description_portal: 본 데이터는 지방자치단체에서 부과·징수하는 지방세의 납부 현황을 납부 매체별로 구분하여 제공하는 자료로, 지방세 행정의 운영 실태와 납세 편의 서비스 이용 경향을 파악할 수 있도록 구성되어 있다. 납부 매체는 금융기관 방문, 가상계좌, 인터넷지로, 위택스, 자동이체, 신용카드, 지방세입계좌, CD/ATM 등 다양한 전자적·비전자적 수단을 포함할 수 있으며, 각 매체를 통한 납부 건수 또는 금액 현황을 기준으로 집계된다. 본 자료는 지방세법에 근거하여 시군구가 보유·관리하는 행정자료를 기반으로 작성되며, 표준지방세시스템에 축적된 자료를 토대로 연도별 납부 매체 이용 현황을 체계적으로 제공한다. 이를 통해 지방세 납부 방식의 변화 추이, 비대면 납부 활성화 수준, 납세자 편의성 제고 정책의 효과 등을 분석할 수 있으며, 지방세정 운영의 효율성 제고와 행정서비스 개선을 위한 기초자료로 활용될 수 있다.
