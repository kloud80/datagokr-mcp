description_portal: 한국무역보험공사의 분석한 17개국 주요 업종별 최근 5년간(2017년~2021년)의 평균 부도율(퍼센티지) 데이터입니다. 한국무역보험공사는 무역보험 업무 운영과정에서 발생한 실제 수출대금 결제정보 빅데이터 약 100만 건을 활용, 종합적인 통계분석 작업을 수행하여 수출기업, 수출지원기관 등 해외수출 관련 이해관계자들이 수출실무에 활용할 수 있는 스마트 수출결제정보 데이터를 제공하고 있습니다. 부도는 수출대금 미결제로 인해 수출기업이 공사 앞으로 보험금을 청구하는 것을 의미하며, 부도율은 전년도말 기준 미부도수입자와 당해년도 신규 보험가입 이후 부도를 경험한 수입자수의 합계에서 당해 년도에 부도를 경험한 수입자수 비율로 계산됩니다.
