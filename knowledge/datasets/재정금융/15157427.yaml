summary_user: 한국예탁결제원이 3자간 환매(REPO) 플랫폼에서 집계한 REPO 증권종류별 담보금액(국채·통안채·금융채·특수채·회사채·지방채·ETF·주식·CP 등), 거래금액·일평균잔액, 통화별잔액을 전국 단위 집계로 담은 API입니다. 금융 분석가가 기관 간 레포 시장에서 어떤 증권이 담보로 얼마나 쓰이는지, 국채와 회사채 담보 비중이 어떻게 달라지는지를 확인하는 데 쓴다. 실측 컬럼에 종목코드 같은 전역 조인 키가 없어 다른 증권 데이터와는 증권종류 이름이나 같은 기관 코드로만 맞춰 이어 쓰고, 통화·REPO 구분 코드는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: REPO정보서비스는 REPO 증권종류별 담보금액, REPO 거래금액 및 일평균잔액, REPO 통화별잔액 등의 정보를 제공하는 API 서비스입니다. REPO 서비스란 금융시장에서 단기 자금 조달 및 운용을 위한 한 유형의 거래로, 증권의 매도자와 매수자가 미리 약정된 조건에 따라 일정 기간 후 매수자에게 증권을 다시 매도하는 형태의 거래를 말합니다. 실질적으로 REPO 거래는 단기 자금 조달 수단으로 기능합니다. 한국예탁결제원에서 제공하는 REPO서비스는 제3자 입장에서 공정하고 효율적인 REPO플랫폼을 통해 REPO 거래에 수반되는 결제, 거래증권 평가, 권리관리, 일일정산 등 3자간 환매서비스를 제공합니다. 예탁결제원은 중앙청산소(CCP) 역할을 수행하며, 기관 간 레포 시장의 안정성 확보 및 인프라를 운영하고 있습니다. REPO 거래에서 발생할 수 있는 신용위험 및 시장위험을 효과적으로 관리하고 있으며, 자본시장의 활성화와 유동성 공급을 위해 REPO 거래 관련 정책 지원 등의 업무도 수행하고 있습니다. 한국예탁결제원의 대표 증권정보포털인 SEIBro를 통해 실시간 REPO금리 및 시장 현황을 제공하고 있으며, 2025년에는 종합정보플랫폼 'RP인사이드'를 개시하여 KOFR 및 레포 시장의 업권, 차주신용, 담보, 포지션별 거래 분석을 확인할 수 있고 차입금리 비교 서비스를 제공하고 있습니다. 예탁결제원의 서비스의 장점은 Repo거래당사자간 합의에 따라 거래 세부사항을 자유롭게 정할 수 있으며, 거래기간 중에도 거래조건 변경이 가능합니다. 그리고 담보증권의 평가 일일정산서비스를 통해 담보증권의 가치변동에 따른 증거금 이행 및 거래규모 조정이 가능합니다. 마지막으로 담보증권에서 이자 등 권리가 발생하는 경우 수익지급을 통해 매도자에게 권리관리서비스를 제공하며, 매수자가 담보증권을 처분한 경우에도 대체지급프로세스를 통해 권리관리서비스를 제공합니다.
