summary_user: 종합금융회사별로 기준년월(basYm) 단위의 일반 현황(인가일자·임직원 수·본점·지점 수), 재무 현황(자산총액·자기자본·영업수익·순이익), 주요 경영지표(예대금리차·BIS비율·연체율 등)를 담은 전국 범위의 회사 단위 통계다. 분석가나 투자자가 '특정 종합금융회사의 BIS비율과 연체율이 기준년월별로 어떻게 변했고, 지점·임직원 규모는 어느 정도인가'를 확인하는 데 쓴다. 법인등록번호(crno)를 조인 키로 삼아 금융위원회 기업정보·공시 재무 데이터나 다른 업권별 금융회사 원장 데이터와 이어 쓰고, 금융회사 코드(fncoCd)로 회사를 구분한다.
limits: 지도에 올릴 위치 정보가 없는 전국 단위 비공간 데이터라 지역별 분석에는 쓰지 못한다. 실측 호출은 3개 오퍼레이션 중 1개만 확인되어 나머지 오퍼레이션의 응답은 따로 확인해야 하며, 개발계정은 일 10,000회 호출 제한이 있다.
