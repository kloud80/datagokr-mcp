description_portal: '금융통계종합금융회사정보는 기준년월을 중심으로 종합금융회사의 일반 현황, 재무 현황, 주요 경영지표 등을 제공하는 데이터입니다. 각 회사별 인가일자, 조직규모, 자산 현황, 수익구조, 자본금, 경영성과 등을 통계 형식으로 확인할 수 있도록 구성되어 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 종합금융회사 일반현황 조회 : 종합금융회사별 인가일자, 임직원 수, 본점·지점 수 등 조직 및 기본 현황 정보를 제공합니다.② 종합금융회사 재무현황 조회 : 자산총액, 자기자본, 영업수익, 순이익 등 재무 상태를 조회합니다.③ 종합금융회사 주요 경영지표 조회 : 예대금리차, BIS비율, 연체율, 총수익률 등 핵심 지표를 제공합니다.'
