summary_user: 한국예탁결제원이 관리하는 채권 관련 정보를 담은 API로, 채권 종류별(CD·CP·단기사채) 월별 기관결제대금, 지방자치단체별 지방채 발행·상환, 발행인별 채권발행내역, 원리금 확정 정보, 종목별·일자별 조기상환 정보를 제공하며 범위는 전국 단위이다. 투자자나 분석가가 특정 회사채의 원리금 지급일과 조기상환(콜·풋) 조건을 확인하거나, 특정 월의 CP·단기사채 결제 규모를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 발행사 고객번호나 종목코드(ISIN)를 같은 기관의 기업정보서비스 등에서 먼저 받아 넘기는 방식으로 이어 쓴다.
description_portal: 채권정보서비스는 발행회사 고객번호, 조회대상 기간 등을 통해 발행인별 채권발행내역, 원리금 확정 정보 등을 조회할 수 있는 서비스입니다. 구체적으로는 1. 채권 종류별 기관결제대금 현황, 2. 지방자치단체별 지방채 발행 및 상환 현황, 3. 발행인별 채권발행내역 조회, 4. 원리금확정 정보 조회 서비스, 5. 채권 조기상환 정보를 제공하고 있습니다. 1. 채권 종류별 기관결제 대금 현황은 월별로 조회 가능하며, CD, CP, 그리고 단기사채 결제대금을 조회할 수 있습니다. 2. 지방자치단체별 지방채 발행 및 상환현황은 도시철도채권, 지역개발채권, 일반지방공사채 채권을 상환한 건과 신규 건으로 나누어 결과 값을 받을 수 있습니다. 3. 발행인별 채권발행내역 조회에서는 발행사 고객번호를 조회하여 채권의 종목번호, 종목명, 종류, 발행일자, 상환일자, 발행통화, 발행가액, 발행금액 정보를 받을 수 있습니다. 발행사 고객번호는 기업정보서비스 값을 참조하여 조회됩니다.4. 원리금확정 정보 조회 서비스에서는 원리금 지급일자와 더불어, 권리 청구 구분 코드를 통하여 채권, CD, CP, CALL, PUT, 실기채권 별로 구분하여 결과 값을 볼 수 있으며 원화/외화 여부, 종목번호, 원금/이자/원리금 구분 여부, 이자지급 횟수구분, 지급일자 확정 여부, 예탁제한 예정일자, 단리/복리 구분, 할인이자 유형 구분, 특별이자 유형 구분으로 결과 값을 얻을 수 있습니다.5. 채권 조기상환 정보에서는 종목별 및 일자별 조기상환 정보를 조회할 수 있습니다. 표준종목코드 기준으로 종목번호를 볼 수 있으며, 한글 종목명, 조기상환 행사 시작일자, 종료일자, 조기상환일, CALL, PUT 그리고 CALL+PUT 옵션을 구분하여 볼 수 있으며, 적용 이자율, 조기상환금액, 이자지급금액, 행사비율 값을 받아볼 수 있습니다.
