description_portal: 서울시 세출운용 사업 및 예산 정보 데이터는 서울시가 집행하는 세출 예산의 편성·집행 현황을 세부사업 단위로 정리한 자료입니다. 회계연도와 회계구분, 부서명, 세부사업명, 사업구분명 등을 통해 어느 부서가 어떤 사업에 예산을 사용하는지 한눈에 파악할 수 있습니다. 국비, 도비, 구비 등 재원별 금액과 편성액, 이월액, 변경금액, 수입대체경비, 지출액, 집행잔액 정보를 통해 예산의 출처와 사용 흐름, 집행 효율성을 분석할 수 있습니다. 또한 분야명, 부문명과 소계 항목을 활용해 복지, 환경, 도시계획 등 정책 분야별 재정 투입 규모를 비교·평가할 수 있어, 예산 투명성 제고와 정책 우선순위 분석에 유용한 기초 데이터입니다.
