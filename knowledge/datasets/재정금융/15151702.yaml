summary_user: 전세보증금반환보증 건별로 보증완료월, 주택가액, 임대보증금액, 선순위채권금액, 대위변제 여부, 시도, 주택구분을 담은 합성 데이터로, 포털 설명상 보증완료월 기준 2022~2024년 전국 자료를 시도 단위로 구분한다. 분석가가 보증금 대비 주택가액·선순위채권 비율이나 주택구분·시도별로 대위변제 발생 비율이 어떻게 다른지 살펴보는 연습·모형 개발에 쓴다. 전역 조인 키는 없으며, 다른 데이터와는 시도명이나 주택구분 같은 이름 매핑으로만 이어 쓴다.
description_portal: 전세보증금반환보증 대위변제 현황은 임대인이 전세보증금을 반환하지 못할 경우, 보증기관(HUG 등)이 대신 임차인에게 보증금을 지급(대위변제)하고, 이후 임대인에게 해당 보증금액을 돌려받기 위해 법적 조치(경매 등)를 취하는 일련의 상황과 그 규모, 회수율 등을 의미합니다.최근 전세사기 증가로 대위변제 규모가 급증하고 있으나, 낮은 채권 회수율과 이로 인한 보증기관의 손실 부담이 증가하는 것이 주요 특징입니다.해당 데이터는 보증완료월 기준 2022년부터 2024년도까지의 자료입니다. * 해당 데이터는 실제 데이터를 모방하여 생성한 합성데이터로써, 실제 데이터와는 차이가 있을 수 있습니다.
