description_portal: 이 데이터는 의왕시의 재정 자립 수준을 수치로 나타낸 연도별 재정력지수 자료입니다. 재정력지수는 지방자치단체의 기준재정수요액과 기준재정수입액을 비교해 산정되며, 해당 지표를 통해 자치단체가 자체적으로 재정을 충당할 수 있는 능력을 파악할 수 있습니다. 데이터는 연도별로 정리되어 있으며, 각 연도에 해당하는 기준재정수요액(백만원), 기준재정수입액(백만원), 재정력지수가 포함되어 있습니다. 이 자료는 의왕시의 재정 구조를 객관적으로 진단하고 정책 수립의 기초자료로 활용될 수 있으며, 재정 정책 방향 설정, 유사 자치단체와의 비교 분석, 학술연구 등에 유용하게 활용될 수 있습니다.* 지방재정365(https://www.lofin365.go.kr/portal/LF6000000.do?ntcaClsDvCd=FSL407)에서도 확인이 가능합니다.
