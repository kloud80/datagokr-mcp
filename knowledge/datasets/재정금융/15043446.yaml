summary_user: CP·CD 등 단기금융상품의 거래를 기준일자별로 담은 API로, 결제 건별 매매내역(매매금액·금리·발행일·만기일·통화·매도/매수 측 금융업종)과 잔존만기별 매매금액·매매수익률을 세 개 오퍼레이션으로 나눠 제공한다. 분석가나 금융회사 실무자가 '특정일에 CD·CP가 잔존만기 구간별로 어떤 금리에 얼마나 거래됐고, 어느 업종이 사고팔았는가'를 확인하는 데 쓴다. 건별매매내역의 ISIN 코드(isinCd)를 키로 다른 증권 시장 데이터의 종목코드 원장·발행정보와 이어 쓰며, 잔존만기별 금리·금액 오퍼레이션에는 종목 키가 없어 기준일자·상품구분·잔존만기 코드로만 맞춘다.
limits: 전국 단위의 비공간 데이터라 지역별 분석에는 쓰지 못한다. 개발계정은 하루 10,000회 호출로 제한되며, 세 오퍼레이션 중 종목 단위 조인 키(ISIN)는 건별매매내역에만 있다.
