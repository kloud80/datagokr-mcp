description_portal: '단기금융증권거래정보는 단기금융상품(CP, CD 등)의 거래 현황을 기준일자별로 제공하는 데이터입니다.주요 항목으로는 단기금융상품구분코드, 매매금액, 매매수익률(금리), 발행일자, 만기일자, 잔존만기, 통화코드, ISIN코드, 매도·매수 금융업종구분 등이 포함되며, 상품 유형별, 업종별, 금리 수준별 거래 구조를 파악할 수 있습니다.해당 데이터는 ① 건별매매내역 조회, ② 매매금리 조회, ③ 매매금액 조회의 세 가지 오퍼레이션으로 제공되며, 단기 금융시장 내 자금 흐름과 유동성 현황을 파악하고, 금융회사의 단기자금 운용 및 리스크 관리에 필요한 기초자료로 활용할 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
