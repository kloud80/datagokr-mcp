description_portal: 본 데이터는 2013년부터 2024년까지 12년간 울산광역시에서 발생한 세목별 세금 면제 및 감액 내역을 집계한 통계 정보이다. 투명한 조세 행정 구현을 목적으로 개방하며, 연도별 지원 규모를 명확히 파악할 수 있다.주요 항목은 과세 연도, 취득세, 등록면허세, 주민세, 재산세, 자동차세, 지방교육세 등이다. 구 취득세 등 과거 세목 내역도 제공하여 비교가 가능하다. 각 세목은 혜택이 적용된 건수와 결산 금액으로 구성되어 실질적인 규모를 정량적으로 확인하는 데 용이하다.본 자료는 지역 경제 활성화를 위해 울산시가 투입한 간접적인 재정 지원 규모를 의미한다. 재정 구조를 연구하는 전문가 및 사용자에게 유용한 통계로 활용될 수 있다.
