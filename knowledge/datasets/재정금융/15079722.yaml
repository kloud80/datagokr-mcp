description_portal: 해당 자료는 부산광역시 사상구에서 제공하는 ‘지방세비과감면율현황’ 데이터는 세목명, 과세연도, 비과세금액, 감면금액, 부과금액, 비과세감면율 등 항목으로 구성되어 있습니다. 지방세 과세액 중 비과세액과 감면액이 차지하는 비율 현황은 조세 혜택의 규모를 파악하는 데 중요한 자료입니다. 비과세액은 법률이나 조례에 따라 세금을 아예 부과하지 않는 금액이며, 감면액은 부과된 세금에서 일정 부분을 경감해 주는 금액을 뜻합니다. 지방세비과감면율현황은 조세 정책의 공정성과 효과성을 평가하고, 향후 세제 개선 방향을 설정하는 데 중요한 기초자료로 활용됩니다.
