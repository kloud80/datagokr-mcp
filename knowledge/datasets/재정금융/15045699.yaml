description_portal: □ 지원 현황 개요한국자산관리공사는 2013년 4월 「서민주거 안정을 위한 주택시장 정상화 종합대책 발표」로 공사가 인수한 주택담보대출 연체차주에 대한 채무조정 지원을 실시하였습니다.특히 2020년 3월 2일부터 제1금융권과 "주택담보대출 연체 서민을 위한 채무조정 및 주택 매각 후 임차 거주 지원 협약"을 체결해 기존의 채무조정 지원을 강화하였습니다.채무조정을 체결하게 되면 약정 체결 채무자는 연체이자 감면 및 분할상환(최대 5년 거치, 최장 33년 이내) 등을 지원 받을 수 있습니다.□ 데이터 내용매월 하우스푸어 약정 채무조정 이율입니다.2020년 4월부터 채무조정 이율 산식이 "직전월 한국은행 기준금리 + 2.25%"로 변경되었으며, 본 데이터는 채무조정 이율이 변경된 2020년 4월 이후 매월 채무조정 이율이 기재되어 있습니다.
