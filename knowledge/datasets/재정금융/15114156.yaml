description_portal: '- 처리기관별(지방청별), 세목별, 청구세액 규모별 과세전적부심사청구 처리 실적.- 과세전적부심사청구제도는 과세관청으로부터 세무조사 결과통지 또는 업무감사 파생자료 등에 의한 과세예고통지를 받았을 때, 받은 날로부터 30일 이내에 관할세무서 혹은 지방국세청에 과세전적부심사를 청구할 수 있는 제도- 청구세액규모별 항목의 세무조사결과 및 과세예고통지건수 및 통지건수대비 접수비율은 통계생산이 안됨- 과세전적부심사청구제도란 사후 불복청구제도(이의신청, 심사·심판청구 등)는 납세자가 고지·압류처분 등을 받고 나서 청구할 수 있는 제도이므로 납세자의 권리를 신속히 구제하는 데 미흡한 면이 있었음. 이에 고지 이전 단계에서 납세자의 권리를 구제하기 위한 제도가 요구됨에 따라 1996년 4월부터 ‘과세적부심사사무처리규정’을 신설하여 「과세적부심사제도」가 운영되었으며, 1999년 8월 국세기본법에 「과세전적부심사제도」를 명문화함으로써 사전권리구제제도로서 2000년 1월 1일부터 시행되고 있음'
