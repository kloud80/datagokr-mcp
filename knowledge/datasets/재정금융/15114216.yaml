description_portal: '- 2025년 12월말 기준 발급채널별, 월별 국세증명 민원서류 발급 현황.- 방문발급, 홈택스, 어디서나 민원처리, 정부24, 모바일홈택스, 무인민원발급기.- 정부24는 정부민원포털에서 국세증명을 발급 받을 수 있는 서비스로 ’15. 6월에 국세증명 6종, ’16. 11월에 국세증명 3종, ’18. 6월에 국세증명 5종, ’19. 3월에 국세증명 1종 발급서비스 추가 개시사업자등록증명,휴업사실증명, 폐업사실증명, 납세증명서, 납부내역증명, 소득금액증명, 부가가치세 과세표준증명, 표준재무제표증명, 부가가치세 면세사업자 수입금액증명, 사업자단위과세적용 종된사업장증명, 연금보험료등 소득·세액 공제 확인서, 모범납세자증명, 소득확인증명서(개인종합 자산관리계좌가입용), 소득확인증명서(청년우대형주택청약종합저축 가입 및 과세특례 신청용), 소득확인증명서(청년형 장기집합투자증권저축 가입 및 과세특례 신청용), 소득확인증명서(청년희망적금 가입 및 과세특례 신청용), 소득확인증명서(청년도약계좌 가입 및 과세특례 신청용), 근로(자녀)장려금 수급사실증명'
