summary_user: KRX가 개발한 ESG지수의 일자별 시세를 지수 단위로 담는 데이터로, 기준일자별 지수 종가·전일 대비 증감액과 증감률·구성종목 수·거래량·거래대금을 제공한다. 투자자나 분석가가 특정 ESG지수가 기간 동안 얼마나 오르내렸는지, 일반 시장지수와 비교해 성과가 어땠는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지수·시세 데이터와는 기준일자(basDt)와 지수명·지수ID 매핑으로만 맞춰 붙인다.
limits: 지수를 구성하는 개별 종목 목록이나 종목코드는 담지 않아 종목 시세·공시 데이터와 직접 조인되지 않는다. 지수 기준은 KRX가 개발한 ESG지수에 한정되며, 제공 정보의 정확성과 완전성은 금융위원회가 보장하지 않는다.
