description_portal: '부산광역시 동래구 지방세 체납현황(2025년) 데이터 설명본 데이터는 부산광역시 동래구 관내에서 발생한 지방세 체납 현황을 정리한 자료로,과세연도별 체납 실태를 체계적으로 분석하고, 지방재정 건전성 확보, 세수 관리 개선, 정책수립의 기초 자료로 활용할 수 있습니다.데이터는 CSV 형식으로 제공되며, 다음과 같은 항목으로 구성되어 있습니다:자치단체코드: 동래구를 식별하는 고유 코드과세년도: 체납이 발생한 기준 과세연도 세목명: 체납이 발생한 세목의 명칭체납액 구간: 체납 금액 규모별 구간 구분체납건수: 해당 구간 및 세목에서 발생한 체납 건수체납금액: 해당 구간 및 세목에서의 체납 금액 총합누적체납건수: 해당 연도까지의 총 체납 건수 누계누적체납금액: 해당 연도까지의 총 체납 금액 누계이 데이터를 통해 연도별·세목별 지방세 체납의 분포, 고액 체납자 비율, 체납 규모별 경향성, 누적 증가 추세 등을 분석할 수 있으며,지방자치단체의 체납징수 전략 수립, 세무행정 효율화, 재정위험 요소 사전 대응 등 다양한 분야에 실질적인 기초자료로 활용 가능합니다.해당 자료는 부산광역시 동래구청 세무과에서 정기적으로 관리 및 갱신하고 있으며,보다 상세한 체납 사유, 연령대별 분석, 징수 실적 등 세부정보가 필요한 경우에는 별도 요청을 통해 확인하실 수 있습니다.'
