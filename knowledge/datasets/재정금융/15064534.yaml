description_portal: '한국무역보험공사에서 정리한 무역 및 무역보험 관련 주요 용어에 대해 설명하는 용어집입니다. 무역실무 및 무역보험 업무에 필수적인 개념을 표준화하여 제공하고 있습니다. 각 용어의 개념을 상세히 기술하고 있어 무역보험 이해도를 높이고 교육 및 업무 참고용으로 활용 가능합니다. 이 용어집은 무역보험 업무 종사자뿐만 아니라 관련 기업 및 고객들이 정책과 절차를 올바르게 이해하고 활용할 수 있도록 지원하는 역할을 합니다.<예시>약정이자 : 대출 상환기일에 적용되는 이자율에 의한 이자액(연체 이자율 및 신용가산이자율 제외)재판매 : 수출자가 해외지사(현지법인 포함)에 물품을 수출하고, 동 해외지사가 당해 물품을 현지 또는 제3국에 재판매하는 거래'
