summary_user: 전국 산림조합의 일반현황·재무현황·주요경영지표를 기준년월(basYm)과 조합(금융회사코드·조합명) 단위로 담는 업권별 금융통계로, 금융회사 단위 원장 성격의 데이터다. 금융 분석가나 감독·연구 담당자가 특정 산림조합의 자산·부채·순이익이나 수익성·안정성 지표가 시점별로 어떻게 변했는지 확인하는 데 쓴다. 법인등록번호(crno)가 실측 조인 키여서 금융위원회 기업정보·기업 재무 데이터나 다른 업권 금융통계와 법인 단위로 이어 쓴다.
description_portal: '금융통계산림조합정보는 기준년월 및 조합명을 기준으로 산림조합의 주요 통계정보를 제공하는 데이터입니다. 조합의 설립 및 일반현황, 자산·부채 등 재무지표, 주요 경영성과 지표 등을 시계열로 조회할 수 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 산림조합 일반현황 조회 : 산림조합의 설립연도, 소재지, 조직 정보 등 일반현황을 제공합니다.② 산림조합 재무현황 조회 : 자산, 부채, 자본, 순이익 등 주요 재무정보를 조회할 수 있습니다.③ 산림조합 주요경영지표 조회 : 자산증가율, 수익성, 안정성 등 경영성과 관련 지표를 제공합니다.'
