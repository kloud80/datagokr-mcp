description_portal: 'ㅇ 전체산업과 섬유산업의 각 수출입 실적 및 전년대비 증감률, 무역수지 현황을 제공하는 데이터입니다.ㅇ 데이터는 연도별로 1. 전체산업의 수출입 실적 및 증감률, 2. 섬유산업의 수출입 실적 및 증감률, 3. 전체산업 및 섬유산업의 무역수지 정보를 비교하여 제공합니다.(단위 : 백만불, 증감률 : 전년대비 %)ㅇ 해당 데이터의 섬유류는 MTI code : 4 기준으로 1. 섬유원료(41), 2. 섬유사(42), 3. 섬유직물(43), 4. 섬유제품(44)으로 구성됩니다.* 해당 데이터는 한국무역협회의 무역통계를 기반으로 작성되었습니다.'
