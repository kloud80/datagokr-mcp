description_portal: 지방세 납부 현황은 세목명, 납부건수, 납부금액, 납부매체, 납부매체비율 등으로 구성되어 지방세 징수 실적을 다각도로 보여주는 자료입니다. 세목명은 취득세, 재산세 등 구체 세목을 의미하며, 납부건수와 납부금액을 통해 해당 세목의 실제 납세 규모를 확인할 수 있습니다. 또한 납부매체 항목에는 지로, 자동화기기(CD/ATM), 인터넷, 신용카드 등 다양한 납부 수단이 포함되어 있으며, 납부매체비율은 전체 납부금액 대비 각 수단의 활용도를 보여줍니다. 이 자료를 통해 납세자의 납부 행태를 파악하고, 편리한 납부환경을 조성하기 위한 정책 방향을 수립할 수 있습니다. 특히 온라인·모바일 납부 비율이 증가하는 추세를 분석하면 향후 전자납부 확대 정책의 기초 자료로도 활용 가능합니다.
