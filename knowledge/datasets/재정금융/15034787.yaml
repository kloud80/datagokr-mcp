summary_user: 해외에 진출한 한국기업을 기업 한 곳(현지 법인·지사)당 한 행으로 담은 원천 목록으로, 진출국가·관할 무역관·국문·영문 기업명·현지 주소·진출형태·투자형태·모기업명·업종 대·중분류를 담고 CSV 파일(약 2.3MB)로 받는다. 해외 진출을 준비하는 기업이나 분석가가 '특정 국가에 어떤 업종의 한국기업이 어떤 형태(법인·지사 등)로 나가 있는가'를 확인하거나 진출 사례를 찾는 데 쓴다. 관할 무역관(kotra_trade_office)이 실측 조인 키라서 KOTRA 무역관 단위 자료와 이어 쓰고, 그 밖에 사업자등록번호 같은 공식 기업 식별 키는 없어 다른 기업 데이터와는 기업명·모기업명으로 맞춰야 한다.
description_portal: KOTRA에서 공공데이터포털에 제공하는 해외진출기업 데이터는  해외국가에 진출한 한국기업 정보를 제공하는 데이터 입니다. 이 데이터는 이미 해외국가로 진출한 기업들에 대한 다양한 정보를 제공하고 있습니다.  한국 기업들의 해외 진출 현황을 보여주는 데이터로, 각 기업의 해외 사업 영역을 파악할 수 있습니다. 예를 들어, 제조업, 서비스업, 무역업 등 다양한 산업군에서 활동 중인 기업들을 확인할 수 있습니다. 한국 기업들이 해외 진출을 계획하거나 이미 진출한 기업들의 사례를 분석함으로써 기업별 해외 진출 전략을 수립하는 데 유용한 자료로 활용될 수 있습니다.
