description_portal: '부산광역시 사하구 재정정보공개시스템의 세부사업별 예산현황 데이터를 제공합니다. 이 데이터는 사하구 내 각 부서가 회계연도별로 수행한 세부사업의 예산 편성 및 실제 지출 내역을 포함하고 있으며, 주민들의 세금이 어떻게 사용되었는지를 투명하게 공개하기 위한 목적에서 수집·공개되었습니다.* 주요 데이터 컬럼별 상세설명○ 회계연도 → 해당 세부사업이 소속된 회계 연도 (예:2024, 2025 등)○ 부서명 → 사업을 집행한 사하구청 내 부서명 (예: 복지정책과, 감사실 등)○ 세부사업명 → 개별 부서가 수행한 사업의 명칭 (예: 장애인 재활보조기구 지원, 도시 옥상텃밭 조성 등)○ 예산현액 → 해당 사업을 위해 편성된 총 예산 금액 (단위: 원)○ 지출액 → 실제로 집행된 금액 (단위: 원)'
