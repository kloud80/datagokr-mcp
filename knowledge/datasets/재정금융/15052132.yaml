description_portal: 1. 석유대체연료란 석유제품의 연소 설비의 근본적인 구조 변경 없이 석유제품을 대체하거나 석유제품에 혼합하여 사용할 수 있는 연료(석탄과 천연가스는 제외)로서 바이오연료, 재생합성연료 등 대통령령으로 정하는 것을 말한다.2. 석유대체연료 제조‧수출입업이란 석유대체연료를 제조하거나 수출‧수입하는 사업을 말한다.3. 석유대체연료 제조‧수출입업을 등록하려는 자는 산업통상자원부령으로 정하는 바에 따라 산업통상자원부장관에게 등록하여야 하며, 별지 제28호서식의 등록신청서에 사업계획서, 해당 석유대체연료의 품질시험서를 첨부하여 한국석유관리원에 제출하여야 한다.
