description_portal: 한국무역보험공사의 최근 5년간(2017년 ~ 2021년)의 국가별 그리고 업종별 6가지 결제조건 비율입니다. 한국무역보험공사는 무역보험 업무 운영과정에서 발생한 실제 수출대금 결제정보 빅데이터 약 100만 건을 활용, 종합적인 통계분석 작업을 수행하여 수출기업, 수출지원기관 등 해외수출 관련 이해관계자들이 수출실무에 활용할 수 있는 스마트 수출결제정보 데이터를 제공하고 있습니다. 결제조건은 수출 대금결제 방식을 의미하며, 결제조건엔 사후송금(O/A), 인수인도(D/A), 지급인도(D/P), 상계(NET), 서류상환(CAD), 현물상환(COD) 등이 있습니다.
