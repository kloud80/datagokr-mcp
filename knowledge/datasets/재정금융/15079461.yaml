description_portal: 주민 1인당 또는 세대당 부담된 지방세액을 통해 지방자치단체별 조세 부담 수준을 비교·분석할 수 있으며, 주민들의 경제적 부담 정도를 평가하는 중요한 지표로 활용됩니다. 또한, 이러한 지방세 부담액은 거시경제 분석에서 조세승수(tax multiplier)를 산출하는 기초자료로 사용됩니다. 조세승수란 조세가 1단위 증가했을 때 국민소득이 얼마나 변하는지를 나타내는 지표로, 지방세 부담 변화가 지역 경제에 미치는 파급효과를 평가하는 데 중요한 역할을 합니다. 따라서 주민 1인당 혹은 세대당 지방세액은 지방재정 정책 수립과 경제적 효과 분석에 도움이 될 것입니다.
