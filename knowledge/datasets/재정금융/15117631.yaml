summary_user: 관세청에 등록된 구매대행업자 수를 등록기간별로 집계한 작은 표(189바이트 CSV)로, 등록기간과 등록업체수 두 항목만 담는다. 해외직구 시장 분석가나 정책 담당자가 '구매대행업자 등록제 시행 이후 등록 업체가 기간별로 얼마나 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물릴 조인 키가 없어, 관세청 수출입 실적 같은 다른 자료와는 기간(연·월)을 기준으로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 구매대행업자란 자가사용물품을 수입하려는 화주의 요청에 따라 해외 판매자로부터 수입물품 구매를 대행하는 자로, 구매대행업자는 국내소비자를 대신해 구매계약․통관․납세 등에 관여하는 중요한 무역거래 주체이다. 관세청은 이들과의 신뢰관계 구축과 통관적법성 확립, 소비자 보호 등을 위해 "구매대행업자 등록제"를 도입하여 실행하고 있다. 구매대행업자 등록제도는 2021년 7월 시행되었으나, 업체 사전 준비 등을 위해 1년간 등록 유예기간을 둠에따라 2022년 4월까지 등록업체  실적은 없다.
