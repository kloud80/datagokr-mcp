description_portal: 국가별 관세율표에 관한 데이터로서 우리나라와 교역이 많은 교역 상대 국가의 수입관세율표 입니다. 관세율은 HS부호의 구분에 따라 정해집니다.- "해외 관세율표"는 해외 국가 등에서 공포한 내용을 수집하여 제공되며, 법적 효력이 없으므로, 참고로만 활용하시기 바랍니다.- 원문본과 영문본·기타 자료 간에 의미상 차이가 있는 경우에는 주로 원문본 정보가 우선권을 가지며, 해당 국가에서 명시하는 규정이 있는 경우 그 규정에 따릅니다.- "해외 관세율표"를 위조·변조하여 제공하거나 근거자료로 제출하는 행위는 관련 법령에 따라 형사처벌을 받을 수 있으니 유의하시기 바랍니다.-데이터는 2026년 1월 관세법령정보포털(https://unipass.customs.go.kr/clip)   세계HS > HS정보 > 품목분류 자료실 > 관세율표기준에서 다운로드 받은 자료입니다.
