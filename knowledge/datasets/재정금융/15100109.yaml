summary_user: 부산광역시 금정구 관내에 등록된 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 등록 원장으로, 등록신청사업, 등록증번호, 상호, 대표자, 법인여부, 도로명 소재지가 들어 있으며 3KB 남짓한 소규모 CSV 파일이다. 금정구에서 거래하려는 대부업체가 정식 등록된 곳인지 상호나 등록증번호로 확인하려는 주민이나, 지역별 대부업체 분포를 보려는 분석가가 쓴다. 전역 조인 키는 없어서 다른 시군구의 대부업 등록현황과는 상호·등록증번호·주소를 기준으로 이름 매칭해 합치고, 지도와 결합할 때는 도로명 소재지를 지오코딩해 연결한다.
description_portal: '이 자료는 관내에서 「대부업법」 에 따라 신고된 업체의 현황을 정리한 것입니다.각 업체의 순번, 시군구명, 등록신청사업, 상호, 대표자, 법인여부, 소재지(도로명 주소) 항목으로 구성되어 있습니다. 부산광역시 금정구 관내 대부(중개)업 등록현황(상호, 등록증번호, 소재지(도로명))의 정보를 제공하는 데이터입니다.2025년 데이터를 csv파일로 제공합니다.<컬럼항목설명>등록신청사업: 금정구 소재 대부업체 등록신청사업등록증번호: 금정구 소재 대부업체 등록증번호상호: 금정구 소재 대부업체 상호대표자: 금정구 소재 대부업체 대표자법인여부: 금정구 소재 대부업체 법인여부소재지(도로명): 금정구 소재 대부업체 소재'
