description_portal: '*2010년부터 2020년까지 사회보험성기금 시계열 자료를 포함합니다.*2020년 총지출 523.1조원 중 기금 지출은 164.8조원이며, 국민연금기금, 공무원연금기금 등 6개 사회보험성기금은 전체 기금지출의 78.3조원(47.5%)을 운용하였습니다.*고용보험성기금은 실업급여, 고용안전, 직업능력개발사업 등 고용보험사업의 재원 충당을 위해 1955년에 설치되었으며 운용규모는 2020년 기준 19.4조원이었습니다.*사회보험성기금은 연금지출과 보험지출에 대비하여 가입자가 납입한 기여금과 보험료 등의 자금을 운용하는 기금입니다.'
