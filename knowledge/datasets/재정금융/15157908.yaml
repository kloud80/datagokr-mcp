summary_user: 수출 통관자료를 수출신고수리일 기준 10일 단위(1~10일, 1~20일, 1일~말일)로 누적 집계한 잠정치로, 전체 수출금액과 반도체·철강제품·승용차·석유제품·선박 등 10대 주요품목별 수출금액(천 달러)을 전국 단위로 담는다. 월말 확정치가 나오기 전에 이번 달 반도체나 자동차 수출이 전월·전년 대비 어떤 흐름인지 빨리 확인하려는 분석가·기업·언론이 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 관세청 월별 품목·국가별 수출입 실적과는 품목명과 연월을 맞춰 이어 쓴다.
description_portal: '○ 개요: 수출입 통관자료를 10일 단위로 주요품목별로 수출금액을 집계하여 국민, 기업, 공공기관 등이 쉽고 편리하게 조회할 수 있도록 서비스 제공. 관세청 수출입통계 홈페이지(https://tradedata.go.kr) 10일 단위 잠정치 수출금액 (단위, 천 달러)통계임 ○ 공표 주기와 제공범위: 주기 10일. 범위와 시기1일~10일 통계는 11일에 제공, 1일~20일 통계는 21일에 제공, 1일~말일 통계는 익월 1일에 제공 ※ 수출입 신고의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화하되, 당월통계는 잠정치 기준으로 작성 ○ 통계제공 기준: 기준일-수출신고수리일 기준 / 전체수출금액 및 수출 성질별 분류로 반도체, 철강제품, 승용차, 석유제품, 무선통신기기, 선박, 자동차부품, 컴퓨터 주변기기, 정밀기기, 가전제품 10대 품목별 수출금액 / 금액-수출(신고미화금액) 단위, 천 달러'
