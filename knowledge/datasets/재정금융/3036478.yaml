description_portal: 공적자금백서는 공적자금관리위원회가 공적자금의 조성, 지원, 회수, 상환 및 사후관리 현황을 국민에게 알리기 위해 매년 발간하는 공식 백서입니다.본 백서는 1997년 말 외환위기 이후 금융시장 정상화와 금융구조조정을 위해 조성·지원된 공적자금의 운용 전반을 체계적으로 정리한 보고서로, 공적자금의 조성·지원·회수·상환 현황과 관련 통계를 수록하고 있습니다.「공적자금관리 특별법」에 따라 2000년부터 매년 발간되고 있으며, 기금별 운용 현황, 회수 실적, 민영화 추진 현황, 책임 추궁, MOU 이행 점검 등 공적자금 관련 정책 집행 및 관리 실태를 종합적으로 제공합니다.※ 공적자금이란 1997년 말 외환위기 이후 금융부실 누적으로 경색된 금융시장을 조속히 정상화하고, 급격히 위축된 실물경제의 회복을 지원하기 위해 금융구조조정 등에 사용된 자금을 의미합니다.
