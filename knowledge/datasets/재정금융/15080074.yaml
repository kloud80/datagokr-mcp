description_portal: '제주특별자치도 서귀포시에서 제공하는 ‘지방세 납세자 현황’ 데이터는 과세년도 및 세목별 납세자 수를 행정구역 및 납세자 유형별로 정리한 통계 자료입니다.각 항목에는 세목명(예: 재산세, 취득세 등), 납세자 유형(개인·법인), 관내·관외 구분, 납세자 수, 과세연도 등의 정보가 포함되어 있습니다.이 데이터는 연간 단위로 갱신되어 납세자 수 변동 추이를 분석하거나, 관외 납세자 비율을 통해 부과 징수 정책의 기초 근거로 활용할 수 있습니다.지방세 과세 대상 인구 분포를 시계열로 추적하여 조세 형평성 검토, 지자체 간 납세자 구성 비교, 세입 구조 안정성 평가, 정책 수립 동향 파악 등에 유용한 자료입니다.'
