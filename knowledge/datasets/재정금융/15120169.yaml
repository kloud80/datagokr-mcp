description_portal: '은닉재산 신고센터는 영업정지 또는 파산된 금융회사의 부실에 책임이 있는 부실관련자(전ㆍ현직 임직원, 대주주 및 채무자 등)가 국내 또는 해외에 일체의 재산을 은닉하는 경우에 대비해 일반 국민이 금융부실관련자의 은닉재산 정보를 쉽고 편리하게 신고하도록 돕기 위해 예금보험공사에 설치한 신고센터를 말하며, 법원 결정 등에 따라 신고재산의 회수 절차가 종료된 후 신고자의 회수기여도를 감안하여 최고 한도 30억 내에서 포상금을 결정하고 있습니다.제공하는 공공데이터는 은닉재산 신고센터 운영현황에 관한 데이터로, 연도별 신고 접수 건수, 회수 건수, 회수액, 포상금, 포상금액 정보를 제공합니다. (단위: 건수, 백만원)'
