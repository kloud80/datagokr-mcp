summary_user: 관세청에 등록된 화물운송주선업자(포워더)의 부호를 넣으면 해당 업체의 국문·영문 업체명을 돌려주는 전국 단위 코드 조회 API다. 수입화물 진행정보나 혼재화물 적재화물목록에 찍힌 포워더 부호가 어느 업체인지 확인하려는 물류·무역 실무자와 분석가가 쓴다. 실측 응답에서 전역 조인 키는 확인되지 않아, 다른 관세청 데이터에 나오는 화물운송주선업자부호(frwrSgn)를 받아 이 API에 넘기는 이름 매핑용 조회로 이어 쓴다.
