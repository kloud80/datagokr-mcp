description_portal: 화물운송주선업자란 「관세법」 제222조제1항제2호에 따른 화물운송의 주선을 업으로 하는 자로 「화물운송주선업자의 등록 및 관리에 관한 고시」(관세청)에 따라 등록, 관리되고 있음. 화물운송주선업자의 의무 등과 관련하여화물운송주선업자의 등록 및 관리에 관한 고시에서 정하는 것을 제외하고는 「보세화물 입출항 하선 하기 및 적재에 관한 고시」 및 「보세화물관리에 관한 고시」를 준용한다.화물운송주선업자는  보세화물 입출항 하선 하기 및 적재에 관한 고시에 따른 적재화물목록 작성책임자로서 적재물품과 부합되게 혼재화물적재화물목록을 작성하여 제출하여야 함.화물운송주선업자부호를 이용하여 세관에 등록된  화물운송주선업체명(영문, 국문)을 조회 할 수 있는 서비스임.
