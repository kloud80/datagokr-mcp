description_portal: '이 데이터는 기술보증기금에서 사무지원인력을 채용한 공고 이력을 정리한 자료입니다. 각 행은 하나의 채용공고를 의미하며, 채용부실점(또는 부서), 모집인원, 근무지역, 모집시작일, 모집마감일의 항목으로 구성되어 있습니다. 이 데이터에서 모집인원은 모두 1명으로 동일하며, 근무지는 서울, 경기, 부산, 대전, 인천, 충남, 경남, 강원, 광주, 대구 등 전국 각지에 분포되어 있습니다. 채용부서는 지역 지점(예: 시화지점, 아산지점 등)뿐 아니라 기술혁신센터, 재기지원센터, 기술거래보호부, 인재개발원 등 본부 부서도 포함됩니다. 사무지원인력은 기존 사무지원직원이 육아휴직, 병가 등으로 인해 공석이 발생했을 때 이를 대체하기 위해 한시적으로 채용되는 인력입니다. 또한, ‘모집시작일’과 ‘모집마감일’은 실제 서류 접수 기간에 해당하는 지원기간으로, 지원자가 제출 서류를 접수할 수 있는 일정으로 대부분 1~2주간 운영됩니다. 이 데이터는 지역별 인력 수요, 채용 공백 발생 시기, 부서별 인력운영 형태 등을 분석하는 데 활용될 수 있는 행정지원 인력 채용의 기초 자료로 활용될 수 있습니다.'
