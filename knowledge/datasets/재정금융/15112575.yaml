description_portal: 1. 데이터 개요 - 본 데이터는 예금보험공사 예금보험기금채권상환기금(이하 "상환기금")의 자산, 부채, 순자산 및 재정운영결과 자료입니다. 상환기금은 정부 재정활동에서 발생하는 거래를 발생주의, 복식부기 방식으로 회계처리 하도록 한 국가회계기준이 적용되었습니다. 재정상태표는 자산, 부채, 순자산을 나타내는 재무제표이며, 재정운영표는 일반 영리기업의 손익계산서에 해당됩니다. 손익계산서는 수익에서 비용을 빼서 이익을 산출하지만, 재정운영표는 비용에서 수익을 차감하여 재정운영결과를 도출합니다.2. 데이터 단위 - 백만원3. 데이터 주석 - 재정운영결과는 마이너스가 순이익을 의미
