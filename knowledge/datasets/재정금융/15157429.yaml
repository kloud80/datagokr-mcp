summary_user: 한국예탁결제원이 관리하는 ELS·DLS·ELW 등 파생결합증권 정보를 담는 API로, 기준년월(yyyymm)별 상품 유형·원화/외화별 발행·조기상환·만기상환 종목수와 금액 집계, 그리고 예탁결제원이 발급한 표준기초자산 코드·명칭·유형 정보를 제공한다. 분석가나 투자자가 "최근 몇 달 사이 ELS 발행액과 조기상환액이 어떻게 바뀌었나", "특정 기초자산은 어떤 유형으로 분류되나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 종목코드(ISIN)·표준기초자산코드를 이름·코드 매핑으로 맞춰야 다른 증권 시장 데이터와 이을 수 있다.
limits: 오퍼레이션 6개 중 실호출에 성공한 것은 2개이고, 발행사별 잔액·ISIN 정보·상환조건·종목명 검색 등 4개는 최소 파라미터로 호출했을 때 응답이 없었다. 필수 파라미터인 ISIN·종목명·기준일자는 다른 데이터에서 먼저 받아 넘겨야 하며, 개발계정은 하루 100회로 제한된다.
