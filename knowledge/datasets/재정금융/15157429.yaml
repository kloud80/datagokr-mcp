description_portal: 파생결합증권이란 기초자산의 가격·이자율·지표·단위 또는 이를 기초로 하는 지수 등의 변동과 연계하여 미리 정하여진 방법에 따라 지급하거나 회수하는 금전 등이 결정되는 권리가 표시된 증권을 의미합니다. 한국예탁결제원은 이러한 파생결합증권의 종목생성, 발행 및 전자등록, 계좌간 대체를 통한 유통과 권리행사를 지원하고 있습니다. 주가연계증권 ELS (Equity Linked Securities) 특정 주식의 가격이나 코스피200 등 지수에 연동하여 수익률이 결정되는 증권(비상장) 파생결합증권 DLS (Derivatives Linked Securities) 주식, 주가지수 이외의 기초자산(원유, 금, 금리, 신용 등)의 가격변동에 따라 투자수익이 결정되는 증권(비상장) 파생결합사채 ELB · DLB ELS · DLS와 상품 구성이 동일하나 원금이 보장된 증권(비상장)으로 상법적용 주식워런트증권 ELW (Equity Linked Warrant) 주식과 지수 등 기초자산을 사전에 정한 미래의 시점(만기일)에 미리 정한 가격(행사가격)으로 사거나 팔 수 있는 권리를 갖는 증권(KRX 상장) 상장지수증권 ETN (Exchange Traded Note) 기초지수(ex. KOSPI 선물지수, ELS 발행지수, 전략지수 등)의 수익률에 따라 수익을 지급하는 신종 파생결합증권
