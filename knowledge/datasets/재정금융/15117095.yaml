description_portal: '이 데이터는 기술보증기금의 지식재산공제 제도와 관련된 부금이자율 현황을 정리한 자료로, 제도가 도입된 2019년 8월 29일부터의 정보를 포함합니다. 지식재산공제는 기업이 납부한 부금을 기반으로, 일정 기간 후 이자와 함께 환급하는 제도로, 기업의 지식재산 보호와 재정 안정성 확보를 동시에 도모합니다.1) 기본이자율 : 납부만기 이전에 부금이 해지될 경우 적용하는 이자율2) 우대이자율 : 자금조달, 사업 운영상황, 시장금리 동향 및 공제사업의 활성화 등을 고려하여 정책적으로 결정하는 이자율3) 부금이자율 : 부금납부 만기까지 부금을 유지할 때 지급하는 이자율기간별로 이 세 가지 이자율의 변동 현황이 담겨 있습니다. 이를 통해 제도의 운용 흐름 및 시장금리와의 연계성을 살펴볼 수 있습니다.'
