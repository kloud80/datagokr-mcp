description_portal: 부처별 세입예산현황은 정부가 매년 편성·제출하고 국회가 의결한 국가 예산 중, 각 부처별 세입 예산 금액을 집계·제공하는 재정 통계 자료입니다.(정부예산안과 국회 의결 금액을 모두 수록하며, 부처별로 어떤 재원이 확보될 것으로 예상되는지를 한눈에 파악할 수 있도록 구성되어 있습니다.)1. 데이터 범위   * 연도별 부처별 세입예산 현황   * 부처명, 예산구분, 세입예산 금액, 데이터 기준일 포함2. 주요 제공 내용   * 각 부처별 총 세입예산 금액   * 국회 심의 후 정부안 대비 증감 금액 확인 가능   * 부처별 세입 규모 및 비중 파악 가능3. 세입 예산 항목   * 사용료·수수료·재산수입   * 국고금 반환   * 기부금 수입   * 경상이전수입 등4. 활용 예시   * 부처별 수입구조 분석   * 국회 심의로 인한 세입예산 증감 내역 파악   * 각 부처의 자체 수입 비율 비교   * 재정자립도 평가 및 재정 운영 전략 수립 자료로 활용5. 데이터 특징   * 세입 규모가 큰 부처와 적은 부처 간 차이를 비교 분석 가능   * 국회 심의 과정에서 변동된 세입 항목 확인 가능   * 국세와 비세 수입 구조 분석 자료로 활용 가능6. 제공 형식 및 접근 방법   * CSV, XLSX 등 다양한 파일 형식으로 다운로드 가능   * 시각화 그래프 및 표 제공   * Open API 제공 (연도, 부처, 예산구분 등 조건별 상세 조회 지원)본 자료는 정부의 부처별 세입 구조와 규모를 국민에게 투명하게 공개하여 국민의 알권리를 충족시키고, 연구기관·언론·일반 국민이 재정 분석, 정책 수립, 재정자립도 평가 등에 폭넓게 활용할 수 있는 중요한 재정정보입니다.
