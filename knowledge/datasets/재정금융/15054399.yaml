description_portal: '해당 자료는 외국인촉진법에 근거하여 수집된 외국인직접투자 통계로, 한국에 대한 투자형태별(M&A, Greenfield) 외국인직접투자 실적자료입니다.  1. 그린필드 : 그린필드형 투자란 기업이 해외에 직접 공장이나 사무실 등 생산 및 영업활동 기반을 새로 구축하는 것을 의미한다.  2. M&A : 인수합병(引受合倂, Merger and Acquisition), 줄여서 M&A는 기업의 규모를 성장시키거나, 시장을 확보하거나, 경쟁자를 제거하거나, 기술을 획득하는 등 이윤을 창출할 목적으로 두 기업이 인수 또는 합병을 통해 결합하는 제반과정과 이를 위한 경영전략  3. 해외 투자가들의 국내 투자 자금 운영비중 파악'
