description_portal: 지방세 비과·감면율 현황 데이터는 지방자치단체의 세수 구조와 조세 정책 효과를 종합적으로 분석할 수 있도록 구성된 자료입니다. 본 데이터에는 과세년도별로 적용된 지방세 세목명(취득세, 재산세, 자동차세 등)을 기준으로 비과세금액과 감면금액, 실제 납세자에게 부과된 부과금액이 함께 제공됩니다. 이를 통해 전체 과세 대상 금액 대비 비과세 및 감면이 차지하는 비중을 산출한 비과세·감면율을 확인할 수 있으며, 세제 지원 규모와 정책적 감면 효과를 정량적으로 파악할 수 있습니다. 또한 연도별·세목별 비교 분석을 통해 감면 제도의 변화 추이, 특정 세목에 대한 지원 집중도, 지방재정에 미치는 영향을 분석하는 데 활용할 수 있어 조세 형평성 검토, 재정 운용 계획 수립, 정책 평가 자료로 활용 가치가 높습니다.
