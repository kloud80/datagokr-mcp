description_portal: '부동산투자회사에 대한 투자성과 및 재무정보 등을 제공합니다. 매 분기와 결산기 투자보고서를 조회할 수 있고 투자현황, 재무상태표, 손익계산서, 현금흐름표 등을 확인 할 수 있습니다.1. 형식: 웹페이지 및 PDF2. 내용 요약■ 회사유형: 해당 리츠를 운용하는 회사의 유형 (예: 위탁관리리츠, 자기관리리츠 등)■ 리츠명: 투자보고서를 제출한 리츠의 명칭■ 년도: 해당 투자보고서가 작성된 연도■ 회기기수: 보고서 기준 회계 연도 내의 회기 차수■ 회기분기: 해당 회기의 분기 구분 (예: 1분기, 2분기, 결산 등)■ 결산월: 회계 결산이 이루어진 월 (예: 06, 08 등)■ 다운로드: 각 회차별 투자보고서를 파일 형태로 내려받을 수 있는 링크3. 활용 예제■ 투자자가 리츠의 운용 성과와 수익구조를 파악하고, 과거 실적 기반의 투자 판단에 활용■ 자산관리회사 및 금융기관이 다양한 리츠의 실적 데이터를 비교하여 시장 분석 및 신규 상품 설계에 활용■ 정부 및 연구기관이 리츠 산업의 건전성과 투명성 평가를 위한 실증 자료로 활용'
