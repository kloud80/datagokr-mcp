description_portal: '본 데이터는  2025년 부산광역시 동래구 관내에서 발생한 지방세 미환급 내역을 정리한 자료로,과세 후 환급 사유가 발생했으나 아직 환급되지 않은 건과 금액에 대한 연도별 통계 및 누적 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다.지방세 환급은 과오납, 이중납부, 감면대상 착오 적용 등 다양한 사유로 발생하며,미환급 현황은 지방세무 행정의 투명성과 효율성을 점검하는 중요한 지표로 활용됩니다.자료는 CSV 형식으로 제공되며, 다음과 같은 항목으로 구성되어 있습니다:자치단체코드: 동래구를 식별하는 고유 행정코드세목명: 취득세, 재산세, 주민세 등 해당 세금의 종류과세년도: 환급 대상이 된 원천 과세 연도미환급유형: 과오납, 착오입금, 주소불명, 장기미청구 등 환급이 지연된 사유 분류납세자 유형: 개인, 법인, 외국인 등 환급 대상자 분류당해 미환급건수: 해당 연도에 신규로 발생한 미환급 건수미환급금액: 해당 연도의 미환급 금액 총액누적미환급건수: 연도별 누적된 전체 미환급 건수누적미환급금액: 연도별 누적된 전체 미환급 금액누적미환급금액증감: 전년도 대비 누적 미환급금액의 증감 내역이 데이터를 통해 동래구의 지방세 환급 관리 상태, 환급 사유별 분포, 누적 미환급 추이, 연도별 증감 경향성 등을 분석할 수 있으며,세무 행정의 적극적 환급 조치, 제도 개선 필요성 평가, 납세자 권익 보호 방안 마련 등 정책적 활용이 가능한 기반 자료로 기능합니다.자료는 부산광역시 동래구청 세무과에서 정기적으로 점검 및 갱신하며,필요 시 미환급 발생 사유별 세부 내역, 고액 미환급 건 정보, 환급률 등은 별도 요청을 통해 확인할 수 있습니다.'
