summary_user: 외국인직접투자(FDI) 신고를 받을 수 있는 외국환 취급은행 등 신고 수탁기관을 기관(부서)별 한 행으로 모은 목록 파일로, 수탁기관명·부서명·전화번호·주소·등록일을 담고 전국 범위를 다룬다. 외국인 투자자나 대리인이 "투자 신고서를 어느 은행 어느 부서에 내면 되는가, 연락처와 위치는 어디인가"를 확인할 때 쓴다. 다른 데이터와 잇는 공통 조인 키는 없어서, 은행 이름이나 주소 문자열로 맞춰 붙이는 수밖에 없다.
description_portal: 외국인직접투자(FDI) 신고는 코트라 또는 지정거래외국환은행에 방문하여 신고서와 관련 서류를 제출하는 과정입니다. 신고 절차는 일반적으로 사전 신고가 원칙이며, 투자자의 국적 증명서, 대리인 신고 시 위임장 등 필요 서류를 준비해야 합니다. 신고 후에는 외국환은행을 통해 투자 자금을 송금하고, 외국인투자기업 등록을 거치게 됩니다. 외국인직접투자 신고를 할 수 있는 외국환 취급은행(신고 수탁기관)을 모아놓은 자료입니다.- 수탁기관명, 부서명, 전화번호, 주소, 등록일 로 구성되어 있습니다.
