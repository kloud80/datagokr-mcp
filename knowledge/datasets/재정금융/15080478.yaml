description_portal: '2017년부터 2024년까지 서천군 지방세 세목별 수납방법(ARS, 가상계좌, 위택스, 은행창구, 자동화기계 등)에 대한 납부건수 및 납부금액에 대한 과세자료를 제공합니다.*상세내용■ 과세년도: 세금이 부과되는 연도(2017년~2024년)■ 세목: 레저세, 재산세, 주민세, 취득세, 자동차세, 과년도수입, 담배소비세, 도시계획세, 등록면허세, 지방교육세, 지방소득세, 지방소비세, 지역자원시설세■ 납부매체-ARS: 전화를 통해 사용자가 음성 안내에 따라 번호를 누르거나 음성으로 답하면, 자동으로 우너하는 정보에 접근하거나 서비스를 받을 수 있게 해주는 시스템-가상계좌: 세금 납부 시 사용하며, 실제 은행 계좌와 연동되어 자동으로 입금 내역을 확인가능-위택스: 지방세 인터넷 납부 시스템-은행창구: 은행의 직원들이 고객을 직접 대면해서 업무를 처리하는 창구-인터넷지로: 세금을 온라인으로 납부할 수 있는 전자지로서비스-자동이체: 자동으로 지정된 금액을 출금하여 납부처에 송금하는 서비스-자동화기기: 사람이 직접 조작하지 않아도 자동으로 작동하는 기계(ATM)■ 납부매체전자고지여부: 납세자에게 세금 고지서를 전자적인 방식으로 통지하는지 여부■ 납부건수: 실제로 납부가 이루어진 세금 거래 횟수■ 납부금액: 실제로 납부한 세금의 총액(행정안전부 공공데이터포털에 서천군 공공데이터 등록 및 공개)근거: 공공데이터 제공 및 이용 활성화에 관한 법률 제18조, 제22조'
