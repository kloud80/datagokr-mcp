description_portal: 금융안정위원회(FSB)는 바젤은행감독위원회(BCBS) 및 각국 당국과 협의하여 2025년 글로벌 시스템적 중요 은행(G-SIBs) 명단을 확정했습니다. 이 명단은 2024년 말 기준 자료를 사용하였으며, 2018년 7월에 합의되어 2021년 말 G-SIB 평가에 최초로 도입된 방법론에 따라 산출되었습니다.2025년 명단에는 2024년 명단과 동일한 29개 G-SIB이 포함되었으나, 각 은행의 버킷 배정에는 변동이 있습니다. 은행별 버킷 배정의 변화는 주로 은행의 기초 영업 활동 변화에 따른 영향을 반영한 것이며, 특히 "복잡성" 부문이 점수 변동에 가장 크게 기여했습니다. 본 명단에서 버킷이 상승한 경우, 상향된 손실흡수력 요건은 2027년 1월 1일부터 유효합니다.
