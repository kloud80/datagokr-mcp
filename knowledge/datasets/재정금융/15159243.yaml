description_portal: 지방세 과세액 중 비과세액과 감면액이 차지하는 비율 현황은 국민이 받는 조세 혜택의 규모를 파악하는 데 중요한 자료입니다. 비과세액은 법률이나 조례에 따라 세금을 아예 부과하지 않는 금액이며, 감면액은 부과된 세금에서 일정 부분을 경감해 주는 금액을 뜻합니다. 이러한 제도들은 사회적 형평성과 경제 활성화를 위해 마련되어 국민의 세 부담을 줄여줍니다. 따라서 지방세 전체 과세액 대비 비과세액과 감면액의 비율을 분석하면, 국민이 실제 부담하는 세금과 정부가 제공하는 조세 혜택 규모를 종합적으로 이해할 수 있습니다. 이는 조세 정책의 공정성과 효과성을 평가하고, 향후 세제 개선 방향을 설정하는 데 중요한 기초 자료로 활용됩니다.
