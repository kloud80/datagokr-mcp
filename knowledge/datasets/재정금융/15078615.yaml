description_portal: 본 데이터는 성주군의 지방세 부과 및 감면 현황을 종합적으로 파악하기 위한 자료로서, 세목별 과세 구조와 비과세·감면 적용 실적을 체계적으로 정리한 것이다. 세목명과 법구분명을 기준으로 비과세건수 및 비과세액, 감면건수 및 감면세액, 그리고 실제 부과금액을 포함하고 있어 세수 형성과 감면 정책의 영향을 동시에 분석할 수 있는 특징을 가진다. 이를 통해 특정 세목에서 발생하는 세제 지원 규모와 실제 세입 간의 관계를 비교·검토할 수 있으며, 지방재정 운영의 효율성을 판단하는 기초자료로 활용 가능하다. 또한 연도별 또는 항목별 변동 추이를 분석함으로써 세정 운영 방향 설정과 정책 개선에 필요한 근거 자료로 기능한다. 본 자료는 지방세 감면 정책의 투명성 제고와 군민 대상 행정서비스 이해도 향상을 목적으로 제공되는 공공데이터이다.
