summary_user: 주택연금 가입 대상이 되는 노인복지주택을 시설 한 곳씩 나열한 전국 목록으로, 시설명·법정동코드·지번/도로명 주소·시설설치일자·시설폐지일자를 담는다(csv 약 3KB 규모의 작은 파일). 노인복지주택에 사는 고령자나 상담 실무자가 '이 노인복지주택이 주택연금 가입 대상인가'를 확인하거나, 분석가가 대상 시설의 지역 분포를 볼 때 쓴다. 법정동코드(bjd_cd)로 행정구역 코드표·지역별 인구·고령화 통계와 잇고, 주소·도로명주소로 건축물·주소 데이터와 맞춰 쓴다.
description_portal: '"한국주택금융공사에서 제공하는 공공데이터인 한국주택금융공사_주택연금 가입대상 노인복지주택주소현황입니다。주택연금 가입 대상 노인복지주택 리스트를 제공하며, 노인복지주택번호, 노인복지주택명, 법정동코드, 주소, 주소 본·부번, 시설설치일자, 시설폐지일자 등의 데이터 항목을 포함하고 있습니다.。제공되는 이 데이터는 주거 안정성 분석, 지역별 주택금융 수요 조사 및 정책 주택사업 대상지 선정 등으로 활용될 수 있습니다。정책 입안 시 근거 자료로 활용되어 공공 금융 서비스의 투명성과 효율성을 높이는 데 기여합니다。이 데이터는 공사의 내부 데이터와 연계하여 고객 특성별 세부 분석 및 맞춤형 금융 상품 개발에 유용합니다。또한 과거 데이터 추이를 활용한 시계열 분석을 통해 미래 시장 수요 예측 및 리스크 관리에 활용할 수 있습니다。세부 통계 지표 분석을 통해 특정 고객군의 연체 위험도 평가 및 선제적 대응 전략을 수립할 수 있습니다。연관 데이터와 결합하여 빅데이터 분석 플랫폼 기반의 금융 시장 동향 모니터링에 활용 가능합니다。해당 데이터에 대한 문의사항은 한국주택금융공사 공공데이터 제공 실무담당자에게 연락 혹은 공공데이터포털을 통해 문의를 접수 해 주시기 바랍니다。"'
