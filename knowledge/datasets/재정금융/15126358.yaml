summary_user: 국가채권관리법에 따라 한국자산관리공사에 회수가 위탁된 국가연체채권의 건별 납부일자와 그에 따른 위탁수수료 발생일자를 담으며, 범위는 전국·비공간이다. 위탁 채권별로 언제 납부가 이뤄졌고 수수료가 언제 발생했는지, 납부기한 대비 실제 납부 시점이 어땠는지를 확인하려는 분석가·관리 담당자가 쓴다. 관리번호·위탁관리번호·납부일련번호는 이 기관 내부 식별자일 뿐 다른 데이터와 잇는 전역 조인 키가 없어, 같은 기관의 국가채권 관련 데이터와 관리번호를 맞춰 보는 방식으로만 연결한다.
limits: 채권 금액이나 수수료 금액, 채무자·지역 정보는 필드에 없어 납부·발생 일자 흐름만 볼 수 있다. 전역 조인 키가 없어 외부 데이터와 직접 결합하기 어렵다. 이벤트성으로 생성된 뒤 바뀌지 않는 성격의 데이터로 분류되어 있어, 정기 갱신을 전제로 쓰지 않는다.
