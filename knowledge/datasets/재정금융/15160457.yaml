description_portal: 이 데이터는 신용보증기금의 보증연계투자 대상기업에 대한 사후관리 현황을 집계한 자료로, 계약_정보, 후행_투자_정보, 조건부_인수_정보, 주식지분_변동_정보, 사채발행_정보, 상환청구권_정보, 자본금_정보 등의 테이블을 포함하고 있다. 본 데이터는 투자 계약, 후행 투자, 주식지분 변동, 사채발행 및 자본금 등 보증연계투자 사후관리와 관련된 기본적인 관리 현황을 제공함으로써, 관련 분야의 전반적인 업무 흐름을 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터 내 ‘계약_정보’ 및 ‘후행_투자_정보’는 사후관리 대상기업의 투자 계약 및 후속 투자 발생 현황의 대략적인 추이를 살펴보는 데 활용될 수 있으며, ‘주식지분_변동_정보’, ‘사채발행_정보’, ‘자본금_정보’ 등은 대상기업의 자본구조 변동과 관련된 단편적인 경향성을 파악하는 기초 자료를 제공한다. 해당 데이터는 유관 분야의 일반적인 현황 파악이나 학술 연구 등을 위한 단순 참고용 자료로서의 역할을 수행하며, 공공데이터 개방 취지에 부합하도록 지원한다.
