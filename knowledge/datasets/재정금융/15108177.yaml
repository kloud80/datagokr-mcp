summary_user: 전국 개인사업자의 신용·매출 안정성·성장성 평가 결과를 우수·양호·보통이하 세 등급으로 담은 API입니다. 각 행에는 기준년월, 대표자 성별·연령대, 설립년도, 사업지역명, 업종 코드·명, 종업원수 구분이 함께 실립니다. 창업 준비자나 분석가가 '이 지역·업종의 개인사업자 중 평가 등급이 우수한 비율은 얼마인가'처럼 지역·업종·업력별 신용 분포를 비교할 때 씁니다. 전역 조인 키는 없으며, 업종코드(bizBzcCd)나 사업지역명을 이름·코드로 맞춰 업종·지역 통계와 붙여 씁니다.
limits: 사업자번호나 법인등록번호가 없어 특정 사업자를 식별하거나 기업 공시·재무 데이터와 바로 연결할 수 없습니다. 지역은 이름으로만 제공되는 비공간 데이터입니다. 갱신은 포털 설명상 연 1회이지만 실측 판정은 이벤트형(생성 후 불변)으로 나와 엇갈리므로, 기준년월을 확인해 쓰는 것이 좋습니다.
