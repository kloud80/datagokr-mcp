description_portal: '개인사업자평가정보는 개인사업자의 상거래 신용능력, 매출변동과 안정성, 성장성 등의 비금융적 요소까지 포함한 평가정보를 우수, 양호, 보통이하로 범주화하여 제공됩니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.① 개인사업자 평가정보 조회 : 개인사업자의 신용능력, 안정성, 성장성 등을 종합적으로 평가한 등급 정보를 조회할 수 있습니다. 요청 메시지로는 기준년월, 사업지역명, 사업업종명, 사업업종코드, 평가정보가 있으며, 응답 메시지로는 대표자 성별, 대표자 연령대, 설립년도, 사업지역명, 사업업종코드, 사업업종명, 종업원수구분명, 평가정보로 제공됩니다.※ 데이터는 매년 1회 갱신됩니다.'
