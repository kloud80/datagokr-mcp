description_portal: 이 데이터는 신용보증기금이 2024년 한 해 동안 중소기업의 기술역량을 평가하여 지원한 기술평가보증의 금액 현황을 담고 있으며, 기업의 사업장 소재지 기준으로 **지역별(특별시, 광역시, 도 단위)**로 구분된 자료이다. 기술평가보증은 재무제표 중심의 전통적인 신용평가 방식에서 벗어나, 기업의 기술력, 성장 가능성, 혁신성 등을 정량·정성적으로 평가하여 보증을 제공하는 제도다. 이 데이터는 기술력은 있으나 재무구조가 취약한 기업에 대한 금융지원 실적을 지역별로 파악할 수 있도록 구성되어 있으며, 각 지역의 기술기반 기업에 대한 보증 공급 수준과 기술 중심 보증 수요의 분포를 분석하는 데 활용된다. 또한 지역별 기술창업 활성화, 기술혁신 기업 지원의 편중 여부, 지역산업 발전 정도 등을 진단할 수 있는 정책적 기초자료로서 의미가 크다.
