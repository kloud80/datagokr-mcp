description_portal: "주택도시보증공사의 월별 전세자금대출특약보증(금융기관에 전세자금대출의 원리금상환책임을 함께 부담하는 보증으로, 이용을 위해서는 현재 전세금안심대출보증을 이용해야 함 ) 가입실적에 대한 데이터로 해당 상품의 발급건수 및 발급금액(단위 : 억원)을 포함하고 있습니다. 세부 데이터의 경우, 2018년부터 월별 실적을 포함하고 있으며, 향후 연간 단위로 현행화하여 공공데이터 포털을 통해 제공드릴 예정입니다.추가로, 보증한도 등 주요 보증요건의 경우, 공사 홈페이지(https://khug.or.kr/index_hug_in.jsp)의 '전세금안심대출보증' 상품개요 사이트를 참고하시기 바랍니다. 감사합니다."
