summary_user: 법인별 부실채권 회생 정보(회생 인가·개시 일자, 법원번호, 사건발생년도, 채권자집회 일자, 회생정보 정산구분 등)를 사건 단위로 담은 금융위원회 API로, 포털 설명상 파산정보·정책자금·공적자금 활용정보 오퍼레이션도 함께 제공한다. 금융기관 여신 담당자나 거래처를 검토하는 사업자가 '이 법인이 기업회생 절차에 들어간 적이 있고 언제 인가됐는가'를 확인하는 데 쓴다. 법인등록번호(crno)가 조인 키라 금융위 기업기본·재무정보, 금감원 공시 등 기업 축 데이터와 법인 단위로 이어 쓴다.
limits: 실호출로 확인된 오퍼레이션은 1개뿐이어서 나머지 오퍼레이션의 응답은 따로 확인해야 한다. 회생 사건이 생길 때 만들어진 뒤 바뀌지 않는 이벤트성 기록이라 시점별 재무 상태나 진행 경과를 추적하는 용도로는 맞지 않는다. 범위는 전국이고 지역 단위 정보가 없는 비공간 데이터다.
