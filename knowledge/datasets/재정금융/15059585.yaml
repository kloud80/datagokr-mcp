description_portal: '차입투자정보는 법인등록번호, 기준일자, 사건발생년도 등을 기준으로 다음 4가지 오퍼레이션을 제공합니다.1. 부실채권회생정보조회: 법인등록번호, 사건발생년도를 통하여 기업회생인가일자, 법원번호, 회생정보정산구분코드등을 조회하는 부실채권회생정보조회 기능2. 부실채권파산정보조회: 법인등록번호를 통하여 사건접수일련번호, 채무관계자구분코드명, 채권금액기준일자등을 조회하는 부실채권파산정보조회 기능3. 정책자금활용정보조회: 정책자금의 지원금액, 잔액, 지원형태, 금융회사, 부처 등의 정보 포함4. 공적자금활용정보: 공적자금 집행 내역, 잔액, 집행기관 및 차수 등 제공※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
