description_portal: '데이터 개요본 데이터는 연구개발특구에 입주해 있는 기업 및 기관 현황을 제공하는 자료로, 입주기관별로 소재 지역과 지구 등 기본 정보를 확인할 수 있습니다. 이를 통해 연구개발특구 내 입주 현황과 공간적 분포를 파악할 수 있습니다.데이터 항목데이터는 총 4개의 컬럼으로 구성되어 있습니다.번호: 개별 데이터 구분을 위한 일련번호지역: 해당 입주기관이 위치한 광역연구개발특구(대덕, 광주, 대구, 부산, 전북 등) 구분기관명: 입주기업 또는 기관의 명칭지구: 해당 기관이 속한 세부 지구기타사항본 데이터는 입주관리시스템을 기준으로 수집되었으며, 입주기업 중심으로 구축되었습니다.활용 유의사항입주기업 현황은 2025년 8월 25일 기준 시점 데이터입니다. 이후 변동 사항이 발생할 수 있으므로, 활용 시 반드시 기준 시점을 확인하시기 바랍니다.'
