summary_user: 모기지론 담보 유동화증권(MBS)의 발행 건·종목별 발행 구조를 담는 API로, 발행일자·발행금액·발행금리·만기 분류·원금 지급방식·신용등급·트랜치 같은 세부 항목을 제공하며 범위는 전국 단위의 비공간 데이터다. 채권 투자자나 금융 분석가가 특정 MBS 종목의 발행 조건, 즉 언제 얼마를 어떤 금리와 상환 방식으로 발행했는지를 확인하는 데 쓴다. 종목 국제코드(isinCd)를 조인 키로 삼아 증권 시장의 종목코드 원장·일별 시세나 연기금 보유 내역과 이어 쓴다.
limits: 포털 설명은 오퍼레이션 3개(발행개요·종목별 예상만기·대상기초자산)를 안내하지만 실호출로 확인된 것은 1개뿐이어서, 예상만기·기초자산 항목은 실제 응답을 따로 확인해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
