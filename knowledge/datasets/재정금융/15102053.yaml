summary_user: ISPM 15 기준에 따라 등록된 국내 수출입 화물 목재포장재 열처리업체의 상호명, 시설 소재지, 대표자 성명을 업체 한 곳당 한 행으로 담은 전국 단위 명부입니다(포털 설명상 2025년 7월 25일 기준). 수출 화물에 쓸 목재 팔레트·포장재의 열처리를 어느 지역의 등록업체에 맡길 수 있는지 찾는 수출기업·물류업체의 확인용으로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 상호명이나 소재지 주소를 기준으로 맞춰 이어 써야 합니다.
description_portal: '목재포장재 열처리업 등록제도는 국제식물검역협약(ISPM 15) 기준에 따라 목재포장재에 대한 적정한 소독 처리를 보장하기 위해 운영되고 있습니다. 등록된 업체는 소독시설, 장비, 관리체계 등 엄격한 요건을 충족해야 하며, 정기적인 점검과 관리 감독을 통해 안정적인 운영이 이루어지고 있습니다. 본 게시판에서는 국내 열처리업 등록업체 현황을 공개하여 관련 업계가 참고할 수 있도록 하고, 투명한 관리와 안전한 무역환경 조성에 기여하고 있습니다.제공 정보 :  수출입화물목재포장재 업체 상호명, 시설 소재지, 대표자 성명제공 방법 : 농식품부 공공데이터 포털 링크로 이동하여 사용2025년 7월 25일 기준으로 제공됩니다.'
