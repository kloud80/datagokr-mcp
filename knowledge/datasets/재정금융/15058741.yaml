summary_user: 영업정지 처분을 받은 저축은행이 보험사고 이전에 작성한 수익성 관련 재무보고서를 저축은행·기준년월·항목별로 담으며, 항목마다 전기값·당기값·증감이 들어 있는 것으로 보인다(필드 명세에 의미 설명이 없음). 연구자나 감독 관련 기관이 '과거 영업정지된 저축은행들의 수익성 지표가 부실 직전에 어떻게 변했는가'를 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관이 제공하는 영업정지저축은행 재무상태표·손익계산서·유동성·자본적정성 보고서와는 금융회사명(fnccmpNm)과 기준년월을 이름 매핑으로 맞춰 연결한다.
limits: 표준 금융회사 코드 같은 전역 조인 키가 없어 다른 데이터와는 회사명 매핑으로만 붙일 수 있다. 보험사고 이전 시점까지의 과거 자료만 담으므로 현재 영업 중인 저축은행 분석에는 쓰지 못한다. 필드 명세에 의미 설명이 없어 항목 코드와 값 단위는 실제 응답으로 확인해야 한다.
