description_portal: 이 데이터는 2022년도 기준으로 충청북도 각 지역(기관)별 재정자립도와 재정자주도 정보를 통합하여 제공하는 공공데이터입니다. 주요 항목은 회계연도, 기관코드, 기관명, 재정자립도, 재정자주도로 구성되어 있으며, 자치단체의 재정 운영 능력과 중앙정부에 대한 의존도를 정량적으로 파악할 수 있도록 구성되어 있습니다. 재정자립도는 자체 수입이 전체 재정 규모에서 차지하는 비율을 의미하고, 재정자주도는 지방세와 세외수입뿐 아니라 교부세 등 일반재원까지 포함한 자율적인 재정 운용 비율을 나타냅니다. 본 데이터는 자치단체 간 재정역량 비교, 재정 건전성 평가, 지방분권 정책 효과 분석 등 다양한 행정 및 정책 분석에 활용될 수 있는 기초자료로 유용하게 제공됩니다.
