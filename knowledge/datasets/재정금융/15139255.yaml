summary_user: 공시제출 기업이 사업보고서 등으로 낸 공모·사모 자금의 계획 대비 실제 사용 내역과 차이 사유, 채무증권(회사채·CP 등) 발행 건별 실적, 증권 종류별 미상환 잔액을 기업·접수번호 단위로 8개 오퍼레이션에 나눠 담는다. 분석가나 투자자가 '이 회사가 공모로 조달한 돈을 계획대로 썼는지, 회사채·기업어음 미상환 잔액이 얼마나 남았는지'를 확인할 때 쓴다. 법인등록번호(crno)로 금융위 기업기본·재무·지배구조 정보 등 같은 기업 축의 다른 공시 데이터와 잇고, 접수번호(rcptNo)로 원 공시 문서를 추적한다.
description_portal: '자금조달 공시정보는 공모 및 사모 방식의 자금 사용 내역과 다양한 종류의 채무증권 발행 실적 및 미상환 잔액 현황을 확인할 수 있습니다.이 데이터는 8개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 공모자금사용내역 조회 : 공모를 통해 조달된 자금의 세부 사용 내역을 조회합니다.② 사모자금사용내역 조회 : 사모 형태로 조달된 자금의 사용 내역을 제공합니다.③ 채무증권발행실적 조회 : 기업의 채무증권 발행 이력을 발행종류 및 금액 단위로 확인합니다.④ 기업어음증권 미상환잔액 조회 : 기업이 발행한 CP(기업어음)의 현재 미상환 잔액을 조회합니다.⑤ 조건부자본증권 미상환잔액 조회 : 조건부자본증권의 미상환 내역을 제공합니다.⑥ 신종자본증권 미상환잔액 조회 : 신종자본증권의 발행 후 남아 있는 잔액 정보를 조회합니다.⑦ 회사채 미상환잔액 조회 : 기업이 발행한 회사채의 현재 미상환 금액 현황을 제공합니다.⑧ 단기사채 미상환잔액 조회 : 단기 자금 조달을 위한 단기사채 미상환 잔액을 조회합니다.** 유의사항 **① 본 서비스에서 제공되는 정보는 공시제출인(또는 데이터 제공기관)의 책임 하에 작성되었으며, 금융위원회는 이의 정확성 및 완전성을 보장하지 않습니다.② 금융위원회는 어떠한 경우라도 본 서비스를 통해 제공받은 정보를 이용하여 이용자가 얻은 이득이나 입은 손해 등 결과에 대해 책임이 없습니다.③ 금융위원회는 금융공공데이터 이용자간 또는 금융공공데이터 이용자와 제3자간에 서비스를 매개로 한 거래 등과 관련하여 어떠한 책임도 부담하지 아니하고, 금융공공데이터 이용자가 서비스의 이용과 관련하여 기대하는 이익에 관하여 책임을 부담하지 않습니다.④ 금융위원회는 서비스에 관하여 금융공공데이터 이용자가 금융위원회가 정한 제반 규정, 이용 안내 및 관계 법령을 준수하지 않은 이용으로 인한 결과에 대하여 책임을 지지 않습니다※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
