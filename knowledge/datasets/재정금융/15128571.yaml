description_portal: '- 전라남도 내 22개 기초자치단체(시군)에 배분된 일반조정교부금(2014년~2025년)에 대해 조회하실 수 있습니다.- 일반조정교부금은 지방자치단체의 재정 형평성을 높이기 위해 중앙정부가 교부하는 재정지원금으로, 시·군의 행정운영에 필요한 재원을 보전하는 데 사용됩니다. 이는 지방재정법 시행령 제36조에 근거하여, 조정교부금 총액의 90%를 차지하며, 일반적 재정수요에 충당됩니다 .- 일반조정교부금의 배분은 다음과 같은 기준에 따라 이루어집니다:- 인구수 기준 : 총액의 50%를 해당 시·군의 인구수에 비례하여 배분합니다.- 세수 징수 실적 기준 : 20%는 해당 시·군의 광역시세 및 도세 징수 실적에 따라 배분됩니다.- 재정력지수 기준 : 30%는 재정력지수가 1 미만인 시·군을 대상으로, 재정력지수를 차등 적용하여 배분합니다.'
