description_portal: '경상남도 사천시의 2018년부터 2020년까지 지방세 징수 현황에 대한 상세 데이터를 공공정보로 제공합니다.이 데이터는 사천시의 재정 운영 성과와 징수 효율을 평가하는 데 핵심적인 자료입니다. 제공되는 정보는 취득세, 등록면허세, 지방소득세, 재산세 등 모든 세목별로 구분되며, 각 세목별로 다음 정보를 포함합니다:부과액: 해당 연도에 납세자에게 부과된 총 금액징수액: 부과액 중 실제로 수납이 완료된 금액징수율: (징수액 / 부과액)으로 계산된 비율이 자료를 통해 사천시의 세목별 징수 실적과 납세 이행도를 분석하고, 향후 효율적인 세입 확보를 위한 정책 방향을 설정하는 데 중요한 기초 자료로 활용됩니다.'
