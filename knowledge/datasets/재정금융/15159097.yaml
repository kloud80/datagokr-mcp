description_portal: '본 데이터는 지방자치단체의 세목별 과세 및 감면 현황을 법구분명 기준으로 정리한 자료입니다. 세목명별로 지방세법, 지방세특례제한법, 감면조례, 조세특례제한법, 기타에 따라 비과세건수와 비과세액, 감면건수와 감면세액, 그리고 부과금액이 구분되어 있습니다. 이를 통해 각 세목에서 어떤 법적 근거로 비과세·감면이 이루어졌는지와 그 규모를 확인할 수 있으며, 전체 세수 구조와 감면 정책의 영향을 분석하는 데 활용할 수 있습니다. ※ 자료 확인 시 유의사항  ○ 담배소비세, 자동차세(주행분)은 “기타” 자치단체로 집계되어 부과액도 “기타”로 집계, 현년도의 부과액만 집계(자치단체별 구분 불가)  ○ “세목별” 시트는 본세만 해당하므로 전체집계는 “세목 및 관계법령” 시트 확인  ○ 자료출처: 지방세 통계연감(한국지역정보개발원 제공)'
