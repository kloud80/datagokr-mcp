description_portal: '재정정보공개시스템(사업및예산정보) 내역에 대한 데이터로  해당 기간별 부서명, 세부사업명, 예산현액(재원 등), 지출액 및 편성액, 이월액, 집행잔액 등의 항목을  사상구 홈페이지를 통해 수시로 제공합니다.추진근거: 지방재정법 제60조 ⑦ 지방자치단체의 장은 제1항에 따른 공시와는 별도로 해당 지방자치단체의 세입ㆍ세출예산 운용상황을 특별한 사유가 없으면 매일 주민에게 공개하여야 한다. 이 경우 주민이 인터넷 홈페이지를 통하여 세입ㆍ세출예산 운용상황을 세부사업별로 조회할 수 있도록 하여야 한다.'
