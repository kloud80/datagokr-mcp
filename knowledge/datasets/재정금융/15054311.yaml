description_portal: 중앙행정기관의 회계연도별 세출 결산 현황을 정리한 정보입니다. 회계연도, 소관명, 회계명, 계정명 등 항목을 포함하며, 회계 기준에 따라 구분되어 세출 구조와 집행 내역을 파악할 수 있도록 구성되어 있습니다. 본 데이터는 예산 집행의 투명성 확보와 재정운영 평가에 활용되며, 정책 수립과 회계 분석에도 기초 자료로 제공됩니다. 열린재정을 통해 국민에게 공개되며, 연도별 세출 결산 내역을 쉽게 열람할 수 있습니다. 이 자료는 재정통계, 열린재정, 세출 결산 외에도 예산현황, 회계구분, 지출내역, 공공재정, 행정통계 등 다양한 분석 키워드와 연계됩니다. 공공저작물로 제공되므로 활용 시 메타정보에 명시된 저작권 사항을 반드시 확인하시기 바랍니다.
