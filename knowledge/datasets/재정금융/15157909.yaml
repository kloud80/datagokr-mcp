summary_user: 관세청 수입 통관자료를 수입신고수리일 기준 10일 단위(1~10일, 1~20일, 1일~말일 누계)로 집계해 전체 수입금액과 중국·미국·유럽연합·일본·베트남 등 주요 10개국별 수입금액(과세가격 미화, 천 달러)을 담는 전국 단위 잠정치 통계입니다. 기업·분석가가 월말 확정 통계 전에 이번 달 중국·미국 등 주요국에서 들여오는 수입이 전월보다 늘었는지 빠르게 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 관세청 월별 품목·국가별 수출입 실적 등 다른 데이터와는 국가명과 연월로 맞춰 이어 씁니다.
limits: 필수 파라미터인 조회 시작·종료 연월(strtYymm, endYymm)은 다른 데이터의 코드 체계를 따르므로 먼저 확인해 넘겨야 합니다. 품목별·지역별 분해는 없고 주요 10개국과 전체 금액만 담으며, 당월 수치는 신고 정정·취하 반영 전 잠정치라 이후 바뀔 수 있습니다.
