description_portal: '○ 개요: 수출입 통관자료를 10일 단위로 주요국가별로 수입금액을 집계하여 국민, 기업, 공공기관 등이 쉽고 편리하게 조회할 수 있도록 서비스 제공. 관세청 수출입통계 홈페이지(https://tradedata.go.kr) 10일 단위 잠정치 수입금액 (단위, 천 달러)통계임 ○ 공표 주기와 제공범위: 주기 10일. 범위와 시기1일~10일 통계는 11일에 제공, 1일~20일 통계는 21일에 제공, 1일~말일 통계는 익월 1일에 제공 ※ 수출입 신고의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화하되, 당월통계는 잠정치 기준으로 작성 ○ 통계제공 기준: 기준일-수입신고수리일 기준 / 전체 수입금액 및 중국, 미국, 유럽연합, 일본, 베트남, 호주, 대만, 사우디아라비아, 러시아연방, 말레이시아 국가별 수입금액 / 금액-수입(과세가격미화금액) 단위, 천 달러'
