description_portal: '2013년부터 2022년까지 예산, 기금 등 총지출 시계열 자료*2021년까지 결산서 기준, 2022년은 2차 추경분 포함 예산 기준*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시.2022년 2차 추경 포함 예산 기준 총지출은 679.5조원으로, 본예산 대비 71.8조원, 2021년 결산 대비 78.5조원 증가하였습니다.*용어해설- 총수입 : 총수입에 대응되는 개념으로 한 회계연도의 정부 지출 총 규모를 의미하며, 회계·기금 간 내부거래 및 보전거래를 제외하며 산출- 의무지출 : 의무지출은 재정지출 중 법률에 따라 지출의무가 발생하고 법령에 따라 지출규모가 결정되는 법정지출 및 이자지출을 의미- 재량지출 : 재량지출은 법정지출 등 재정지출에서 의무지출을 제외한 지출을 의미'
