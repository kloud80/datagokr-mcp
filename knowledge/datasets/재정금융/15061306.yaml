summary_user: 생명보험사별로 기준년월(basYm) 단위의 일반현황, 자산·부채·자본 등 재무현황, ROA·ROE 같은 주요경영지표, 보험금 지급액·계약건수 등 주요영업활동을 4개 오퍼레이션으로 담는 전국 범위의 회사 단위 금융통계다. 분석가나 소비자가 '특정 생명보험사의 자본 규모와 수익성이 업계에서 어느 수준이고 최근 어떻게 변했는가'를 따질 때 쓴다. 법인등록번호(crno)가 실측 조인 키라서 금융위원회 기업정보·기업 재무 데이터 등 법인 단위 원장과 이어 쓰고, 금융회사코드(fncoCd)와 회사명으로 다른 업권별 금융통계와 맞춰 본다.
description_portal: '금융위원회_금융통계생명보험정보는 기준년월과 회사명을 기준으로 생명보험사의 일반현황, 재무구조, 경영성과 및 주요 영업활동 정보를 제공하는 데이터입니다. 이 데이터는 4개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 생명보험사 일반현황 조회 : 회사명, 설립일, 본점 소재지, 영업점 분포 등의 정보를 제공합니다.② 생명보험사 재무현황 조회 : 자산, 부채, 자본 등 재무상태 관련 통계를 조회할 수 있습니다.③ 생명보험사 주요경영지표 조회 : ROA, ROE, 보험료 수익률 등 핵심 경영성과 지표를 제공합니다.④ 생명보험사 주요영업활동 조회 : 보험금 지급액, 계약건수, 신계약 보장성 보험료 등 주요 영업실적을 제공합니다.'
