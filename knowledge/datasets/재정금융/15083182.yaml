summary_user: 우체국에서 취급하는 예금상품을 상품 한 건씩 담은 CSV 파일로, 포털 설명상 2022년 3월 기준이며 상품별 가입금액·가입기간 범위, 기본이율, 가입 가능한 고객 유형, 이자지급방식을 담는다. 예금자나 금융 분석가가 '우체국 예금 중 법인이 가입할 수 있는 상품과 그 기본이율은 무엇인가' 같은 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 상품명이나 우체국 자체 상품코드(상품코드)를 기준으로 직접 매핑해 잇는다.
description_portal: 2022년 3월 기준 우체국에서 취급하는 예금상품에 관한 정보입니다.자료는 2022년 3월 기준 우정사업본부 우체국금융의 예금상품 현황을 정리한 CSV 파일로, 예금 상품별 가입조건, 기본이율, 고객유형, 이자지급방식 등 핵심 정보를 포함하고 있다. 가장 기본적인 상품인 ‘보통예금(상품코드 10100)’은 개인, 법인, 금융기관 모두 가입 가능하며 최소금액 제한 없이 개설 가능, 최대금액은 9,999조 원으로 설정되어 있으며, 기본이율은 0%로 설정되어 있다.대부분 상품은 이자지급방식을 ‘원가(원금가산)’로 지정하고 있으며, 일부 정부보관금 상품은 별도 상품코드를 통해 구분되고 있다.
