description_portal: 외환보유액은 중앙은행이나 정부가 국제수지 불균형을 보전하거나 외환시장 안정을 위해 언제든지 사용할 수 있도록 보유하고 있는 대외 지급준비자산을 의미합니다. 외환보유액은 긴급시 국민경제의 안전판일 뿐만 아니라 환율을 안정시키고 국가신인도를 높이는 데 기여합니다. 긴급사태 발생으로 금융기관 등 경제주체가 해외차입을 하지 못하여 대외결제가 어려워질 경우에 대비하고, 외환시장에 외화가 부족하여 환율이 급격하게 상승할 경우 시장안정을 위해 사용됩니다. 외환보유액을 많이 갖고 있다는 것은 그만큼 국가의 지급능력이 충실하다는 것을 의미하므로 국가신인도를 높여 민간기업 및 금융기관의 해외 자본조달 비용을 낮추고 외국인투자를 촉진하게 됩니다. 동 데이터는 최근 10년간(2014년~2025년 현재 기준) 우리나라 외환보유액에 대한 자료로 월별 기준이며, 단위는 천달러 입니다.
