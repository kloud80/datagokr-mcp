description_portal: '이 데이터는 기술보증기금의 보증사고정보를 업종별로 제공한 현황입니다. 각 업종별로 발생한 보증사고의 금액과 사고율을 포함하고 있어, 업종별로 보증사고가 어떻게 분포하고 있는지 알 수 있습니다.데이터 구성업종구분: 사고가 발생한 업종 (예: 농·임·어·광업, 제조업, 환경업 등)2025년 사고금액(억원): 각 업종에서 발생한 보증사고 금액 (억원 단위)2025년 사고율(퍼센트): 각 업종에서 발생한 보증사고의 비율, 즉 보증사고 금액이 해당 업종의 전체 보증 금액에서 차지하는 비율 (퍼센트 단위)이 데이터는 각 업종별로 발생한 보증사고의 규모와 빈도를 분석할 수 있게 해 주며, 업종별 사고율을 통해 특정 업종에서 발생하는 사고의 위험도를 파악할 수 있습니다.'
