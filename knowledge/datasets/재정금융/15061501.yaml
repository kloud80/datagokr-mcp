summary_user: 예금보험공사가 금융감독원 업무보고서를 바탕으로 정리한 부보 생명보험사별 주요 재무현황으로, 보험손익·투자손익·당기순이익·수입보험료·자산·부채·자본(천원 단위)과 지급여력비율·유동성비율 등 경영지표(%)를 회사별로 담으며 검증 시 22행이 수신됐다. 보험 가입자나 분석가가 특정 생명보험사의 재무 건전성과 지급여력이 어느 수준인지 비교할 때 쓴다. 법인등록번호(corp_rgst_no)를 키로 다른 금융회사 원장·기본정보 데이터와 이어 쓴다.
description_portal: '(부보금융회사 종합정보)[참고사항]1. 데이터 개요본 데이터는 예금보험공사의 부보금융회사 중 생명보험사의 주요 재무현황 자료입니다2. 데이터 단위(천원) : 보험손익, 투자손익, 당기순이익, 수입보험료, 자산총계, 부채총계, 자본총계(%) : 부실자산비율, 유동성비율, 유동성커버리지비율, 지급여력비율, 대손충당금적립률, 기본자본지급여력비율3. 데이터 주석1) 동 재무현황은 예금보험공사가 금융감독원으로부터 공유받은 생명보험사의 업무보고서를 바탕으로 작성한 것으로, 생명보험사가 업무보고서를 작성하는 과정에서의 착오 또는 오류 등으로 인해 일부 내용이 사실과 다를 수 있으며, 외부감사인 검토 또는 검사 결과 등에 따라 변경될 수 있습니다.2) 모든 통계는 반올림등이 이루어진 수치로 세부항목의 합계와 상위항목이 일치하지 않을 수도 있습니다.3) 주요 경영지표 비율 산출시 별도의 표시가 없는 경우 손익과목은 기중 누계액(회계연도 개시일부터 기준월 말일까지)이고 대차과목은 기준월말일 현재 잔액입니다.'
