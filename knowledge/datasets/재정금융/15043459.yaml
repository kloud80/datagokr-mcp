description_portal: 기업 재무정보는 법인등록번호와 사업연도를 기준으로 기업의 재무제표 항목을 조회할 수 있는 데이터입니다.제공 항목에는 기업의 매출액, 영업이익, 총자산, 총부채, 자본금 등 요약 재무정보뿐 아니라, 계정과목별 재무상태표와 손익계산서 항목이 포함됩니다.데이터는 요약재무제표 조회, 재무상태표 조회, 손익계산서 조회의 세 가지 오퍼레이션으로 구성되어 있으며, 각 항목에 대해 전기·당기·전분기 등의 비교 수치도 함께 제공됩니다.본 데이터는 기업의 경영성과 분석, 재무 건전성 평가, 투자 위험 분석, 기업 간 재무비교 등 다양한 금융 분석에 활용될 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)
