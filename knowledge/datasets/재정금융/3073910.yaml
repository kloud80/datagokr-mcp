description_portal: '총사업비 현황은 정부가 추진하는 주요 사업들의 총비용 정보를 체계적으로 정리한 통계 자료입니다.(사업명, 사업 유형, 계획·계속·예비비 포함 총사업비, 기초단계·본사업비·유지관리비·기타비용 등의 세부내역)[데이터 주요 항목]사업 건수 : 총 1,024개 (2024년7월 기준)총사업비 합계 : 약 303조 원사업유형별 분류 : 건축, 정보화, 토목, R&D 등 총 4대 유형자세한 데이터는 열린재정 재정상세통계 “분야별 세출현황(세부사업별 예산편성현황)” 항목에서 확인 가능하며, OPEN API를 통해 연도별·사업별 상세 금액 조회가 가능합니다'
