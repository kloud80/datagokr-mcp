description_portal: 본 데이터는 대구광역시 수성구에서 부과하는 지방세 및 세외수입(비과세·감면 대상)의 감면율 현황을 연도 및 세목별로 정리한 자료로, 시도명, 시군구명, 자치단체코드, 세목명(재산세·취득세·주민세·과태료 등), 과세연도, 비과세금액, 감면금액, 부과금액, 비과세감면율(%) 등의 항목을 포함한다. 본 자료는 각 세목과 과세 기간별 감면 규모를 분석할 수 있어, 감면 정책의 실효성 평가, 지방재정 영향 분석, 세입 구조 개선, 재정 건전성 평가 등에 활용된다. 또한, 연도별 감면율 변화 추이를 통해 정책 의도와 예산 절감 효과를 검토할 수 있으며, 투명한 조세 행정 구현에도 기여한다. 해당 데이터는 정기적으로 갱신되며, 공공기관, 재정·세정 부서, 정책 연구자, 회계·감사 기관 등에서 정책 분석과 지방재정 계획 수립을 위한 기초자료로 사용될 수 있다.
