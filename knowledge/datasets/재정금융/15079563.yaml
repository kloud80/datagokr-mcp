description_portal: 경상남도 사천시의 2018년부터 2020년까지 연도별 지방세 과세 및 비과세 현황에 대한 상세 데이터를 공공정보로 제공합니다.이 데이터는 사천시의 재정 운영 투명성을 높이고 지방세 정책 분석을 지원하기 위해 마련되었습니다. 제공되는 주요 내용은 취득세, 등록면허세, 지방소득세, 주민세 등 모든 세목별로 구분되어 있습니다. 각 세목에 대한 과세 건수, 과세 금액, 그리고 감면 등으로 인한 비과세 건수 및 비과세 금액을 상세하게 포함하여, 연도별 세수 구조의 변화와 지방세 감면 정책의 영향을 입체적으로 분석하는 데 필수적인 기초 자료로 활용됩니다.
