summary_user: 성남시에 등록된 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 구·동, 등록번호, 상호, 소재지 주소, 등록일자, 전화번호를 포함한다. 시민이나 분석가가 거래하려는 대부업체가 성남시에 정식 등록된 업체인지 확인하거나, 구·동별로 대부업체가 얼마나 분포하는지 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호·등록번호를 이름으로 맞추거나 소재지 주소를 지오코딩해 행정구역 단위로 붙여 쓴다.
description_portal: 성남시 관내 대부업 현황으로  시군구명,구별,동별, 등록신청사업(대부업/대부중개업), 등록증번호, 상호명, 소재지주소, 등록일자,  전화번호, 데이터기준일자 의 항목으로 구성되어 있습니다.※ 대부업 등의 등록 및 금융이용자 보호에 관한 법률 제3조 제2항에 따라 금융감독원의 허가를 받은 대부(중개)업은 해당 현황에 해당되지 않으며, 등록대부업체 통합조회(fines.fss.or.kr)에서 확인이 가능합니다.성남시는 인구 밀집과 상업·주거지역의 혼재로 인해 대부업체가 일정 규모 이상 분포하고 있습니다. 성남시에 등록된 대부업체는 「대부업 등의 등록 및 금융이용자 보호에 관한 법률」에 따라 관할 지방자치단체인 성남시에 등록되어 있으며, 이들은 금융감독원 대부업 공시시스템을 통해 관리되고 있습니다.
