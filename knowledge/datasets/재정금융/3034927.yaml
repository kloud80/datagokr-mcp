summary_user: 예금보험공사가 IMF 외환위기 때('98~'02년) 발행한 구조조정 채권의 만기 상환 부족분을 메우려고 차환발행한 상환기금채권을 채권 건별로 담으며, 채권번호·종류·기금, 발행일·만기일, 금리, 발행금액, 상환잔액, 원금상환 구분을 포함한다. 분석가나 재정·금융 연구자가 "공적자금 상환채의 남은 잔액과 만기 분포는 어떤가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 채권번호·기금명 같은 이름 매핑이나 같은 기관(예금보험공사)의 다른 채권발행 현황과만 이어 쓴다.
limits: 표준 종목코드(ISIN 등) 같은 공통 키가 확인되지 않아 시세·보유 데이터와 바로 조인하기 어렵다. 전국 단위 비공간 데이터라 지역별 분석에는 쓰지 못한다.
