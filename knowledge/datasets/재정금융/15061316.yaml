summary_user: 저축은행별로 기준년월(basYm) 단위의 일반현황(인가일자·임직원 수·본점·지점 수), 재무현황(총자산·자본금·영업수익·당기순이익), 주요 경영지표(수신·여신, 예대금리차, BIS 비율, 연체율)를 담은 전국 범위의 금융회사 단위 통계입니다. 분석가나 예금자가 특정 저축은행의 자산 규모와 건전성(BIS 비율·연체율)이 다른 저축은행과 비교해 어떤 수준인지, 지점·인력이 어떻게 변했는지 확인하는 데 씁니다. 법인등록번호(crno)를 키로 금융위원회 기업정보·재무정보 등 다른 금융회사 원장 데이터와 잇고, 금융회사코드(fncoCd)로 같은 업권 통계끼리 맞춰 씁니다.
description_portal: '금융통계저축은행정보는 기준년월을 중심으로 저축은행의 일반 현황, 재무 현황, 주요 경영지표 등을 제공하는 데이터입니다. 저축은행별 인가일자, 조직 규모, 총자산, 수익현황, 수신·여신 실적, 경영성과 등을 확인할 수 있도록 구성되어 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 저축은행 일반현황 조회 : 저축은행별 인가일자, 임직원 수, 본점 및 지점 수 등의 조직 일반 정보를 조회합니다.② 저축은행 재무현황 조회 : 총자산, 자본금, 영업수익, 영업이익, 당기순이익 등 재무항목을 제공합니다.③ 저축은행 주요 경영지표 조회 : 수신·여신 실적, 예대금리차, BIS 비율, 연체율, 수익성 등 주요 지표를 조회합니다.'
