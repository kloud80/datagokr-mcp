description_portal: '해당 자료는 기업의 총차입금의존도에 대해 재무제표보다 동태적인 시계열 형식으로 확인하실 수 있는 자료입니다.-  총차입금의존도 : 신용공여상(전전월 기준) 총차입금을 재무제표상 총자산으로 나눈 지표로, 기업의 자본구조 안정성을 나타내는 대표적인 지표인 총차입금의존도를 동태적으로 나타냅니다.- 통계 프로그램상 2022년 3월 이후부터 확인 가능합니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다'
