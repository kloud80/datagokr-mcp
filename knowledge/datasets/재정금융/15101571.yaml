description_portal: 본 데이터는 전북특별자치도 부안군에서 발행한 지류형 지역화폐의 연도별 발행 및 유통 현황을 수록한 공공데이터이다. 항목에는 지역화폐명, 발행연도, 지류상품권 발행총금액, 총판매액, 총보유액이 포함되어 있으며, 해당 연도 기준 지역 내 유통된 지역화폐 규모와 미사용 금액을 확인할 수 있다. 이를 통해 부안군의 지역경제 활성화 정책 운영 상황을 정량적으로 분석할 수 있으며, 소상공인 지원 및 소비 촉진 정책의 기초자료로 활용 가능하다. 본 데이터는 매년 갱신되며, 정책 수립을 위한 기초자료 제공은 물론, 지역화폐의 투명한 운영 실태를 대외적으로 공유하기 위한 목적으로 작성되었다. 연구기관, 지자체, 일반 국민 모두에게 유용한 정보를 제공하고자 한다.
