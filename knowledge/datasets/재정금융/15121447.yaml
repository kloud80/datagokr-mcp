description_portal: '국세부담률은 소득세, 법인세, 부가가치세, 상속세, 증여세 등 국세가 경상 GDP에서 차지하는 비중, 지방세부담률은 재산세, 취득세, 주민세 등 지방세가 경상 GDP에서 차지하는 비중을 말합니다.조세부담률은 국세 및 지방세를 합한 조세수입이 경상 GDP에서 차지하는 비중으로, 국민들의 조세부담 정보를 측정하는 지표입니다.국민부담률은 조세수입과 사회보장기여금이 경상 GDP에서 차지하는 비중으로, 조세부담률보다 포괄적으로 국민부담 수준을 측정하는 지표입니다. 국민부담률에 포함되는 사회보장기여금은 4대 공적연금인 국민연금, 공무원연금, 군인연금, 사학연금과 건강보험, 요양보험, 고용보험, 산업재해보상보험의 기여금을 말합니다.* GDP는 신계열(기준년도 2020년) 기준. ** 수정사항: 한국은행 2024년 기준 GDP 확정치 발표(2026. 6)에 따라 자료 업데이트, 이해를 돕기 위해 단위컬럼(조원, %) 추가'
