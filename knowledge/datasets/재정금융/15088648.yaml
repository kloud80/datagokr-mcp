summary_user: 한국주택금융공사가 발행한 주택저당증권(MBS)의 거래일·종목별 시세를 담은 파일로, 종목명·만기일과 평균·최고·최저 수익률, 평균단가, 거래량·거래대금·거래건수, 패스스루 방식 여부를 행 단위로 담는다. 채권 투자자나 금융 분석가가 특정 MBS 종목의 수익률과 거래 규모가 거래일에 따라 어떻게 움직였는지 확인할 때 쓴다. 증권표준코드(stock_cd)로 다른 증권 종목 원장·시세 데이터와 잇고, 유동화계획 코드(hf_liqd_plan_cd)로 같은 유동화계획에 속한 MBS 발행 정보와 묶어 본다.
description_portal: 한국주택금융공사에서 제공하는 공공데이터인 한국주택금융공사_주택저당증권 시세정보입니다。한국주택금융공사에서 발행하는 mbs의 증권표준코드정보, 종목명, 만기일, 평균수익률, 평균단가 등 주택저당증권 시세정보를 파악할 수 있는 주택저당증권 관련의 데이터들을 제공합니다.。제공되는 이 데이터는 주거 안정성 분석, 지역별 주택금융 수요 조사 및 정책 주택사업 대상지 선정 등으로 활용될 수 있습니다。세부 통계 지표 분석을 통해 특정 고객군의 연체 위험도 평가 및 선제적 대응 전략을 수립할 수 있습니다。또한 과거 데이터 추이를 활용한 시계열 분석을 통해 미래 시장 수요 예측 및 리스크 관리에 활용할 수 있습니다。정책 입안 시 근거 자료로 활용되어 공공 금융 서비스의 투명성과 효율성을 높이는 데 기여합니다。연관 데이터와 결합하여 빅데이터 분석 플랫폼 기반의 금융 시장 동향 모니터링에 활용 가능합니다。이 데이터는 공사의 내부 데이터와 연계하여 고객 특성별 세부 분석 및 맞춤형 금융 상품 개발에 유용합니다。해당 데이터에 대한 문의사항은 한국주택금융공사 공공데이터 제공 실무담당자에게 연락 혹은 공공데이터포털을 통해 문의를 접수 해 주시기 바랍니다。
