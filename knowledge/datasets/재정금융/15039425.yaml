description_portal: 신용보증재단중앙회가 개인에게 공급한 금액과 잔액에 대한 데이터로 공급된 금액 및 잔액(=공급-해지)을 억원 단위로 제공합니다. 신용보증재단중앙회의 개인보증 공급 및 해지의 지역별 분포 및 편차를 파악할 수 있습니다. 현재는 서민금융진흥원으로 이관된 근로자 햇살론이 대부분을 차지하였던 데이터입니다.* 2017년 개인보증제도 서민금융진흥원으로 이관개인보증이란, 개인이 금융회사에서 자금을 빌릴 때 개인보증기관이 보증하여 채무자를 대신하여 채무 이행의 책임을 지는 제도입니다.
