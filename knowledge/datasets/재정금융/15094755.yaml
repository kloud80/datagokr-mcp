summary_user: 2018년 1월~2020년 12월 제주도 내 카드 결제 건수를 기준연월·요일·연령대·성별로 묶어 집계한 통계로, 건별 거래가 아닌 집계값(use_count)을 담는다. 상권 분석가나 지자체 담당자가 '제주에서 주말과 평일 중 어느 연령대·성별의 카드 이용이 많은가' 같은 요일별 소비 패턴 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연월·연령대·성별 같은 이름 매핑이나 같은 기관(제주특별자치도) 자료끼리만 이어 쓴다.
description_portal: '이 데이터셋은 2018년 1월 1일부터 2020년 12월 31일까지 제주도 내에서 사용된 카드 결제 건수를 요일별·연령대별·성별로 집계한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 자료는 CSV 형식으로 공개되어 누구나 무료로 다운로드할 수 있으며, 요일별 소비 패턴, 인구 집단별 카드 이용 행동, 지역 상업활동 흐름 분석, 소비 트렌드 연구, 관광객 및 도민의 소비 행태 파악, 상권 계획이나 정책 수립 등에 활용될 수 있습니다. 다만 데이터는 2018~2020년까지의 과거 집계로, 이후 소비 행태 변화나 외부 충격(예: 팬데믹)으로 인한 이용 변화는 반영되어 있지 않을 수 있다는 점을 유의해야 합니다.'
