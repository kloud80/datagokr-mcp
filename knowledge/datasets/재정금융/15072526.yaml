summary_user: 경기신용보증재단이 보증한 기업 가운데 원금연체·압류·회생·파산 등으로 보증 부실이 난 금액을 시군별·연도별·구분별(일반, 소상공인, 합계)로 묶어 원 단위로 담은 집계 자료다. 지자체 정책 담당자나 분석가가 "우리 시군의 소상공인 보증 부실 금액이 해마다 늘고 있는가"처럼 지역별 보증 손실 추이를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)과 연도를 이름 그대로 맞춰 붙여야 한다.
description_portal: 이 데이터는 경기신용보증재단이 보증한 기업들 중 채무불이행 등으로 인해 발생한 보증 부실 내역을 시군별·연도별로 정리한 자료입니다. 항목은 시군명, 연도, 구분(일반, 소상공인, 합계 등), 해당 연도에 발생한 보증 부실 금액(원 단위)으로 구성되어 있으며, 지역별 보증 손실 규모를 파악할 수 있습니다. 이 데이터는 보증 사업의 재정 건전성 평가, 부실 위험 지역 식별, 보증 심사기준 개선, 신용보증 정책 재설계 등에 활용되며, 지자체 및 금융정책 수립의 참고자료로 중요한 역할을 합니다."보증부실발생"이란 경기신용보증재단 보증지원을 통해 은행으로부터 대출을 받은 기업이 원금연체, 사업장 압류, 회생 및 파산 등을 사유로 정상적으로 채무를 상환하는데 어려움을 겪고 있는 상태를 말합니다.
