summary_user: 한국예탁결제원의 주식정보 서비스로, 증권 시장 부문의 종목 정보(KDR 종목코드, 한글종목명, 상장일, 해외상장시장 등)를 오퍼레이션 단위로 제공하는 API이다. 실측 기준 전체 9건, 2013-05-30~2026-08-18 범위이며, 분석가가 특정 종목의 상장일이나 해외상장시장을 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않았으며, 종목코드(ISIN)와 종목명 매핑 또는 같은 기관의 다른 코드로 연기금 보유·기업 공시 데이터와 이어 쓴다.
description_portal: 증권이 전자등록발행된 후 전자등록계좌부에 전자등록의 방식으로 계좌간대체 또는 처분제한의 설정 및 말소를 하고, 이 정보가 전자등록된 전자등록계좌부를 관리하는 업무입니다. 예탁증권 집중예탁, 계좌간 대체, 발행 및 유통의 원활화를 위해 자본시장법 제294조에 의해 설립된 한국예탁결제원은 비상장 법인을 위해 "예탁대상증권 지정제도"를 운영하고 있습니다. 의무보유등록은 전자증권제도 시행 이후 전자증권의 의무보유를 위한 방식으로, 최대주주 등의 소유주식 처분에 따른 주가급락으로부터 일반투자자를 보호하기 위한 제도입니다. 금융위원회의 ‘증권의 발행 및 공시 등에 관한 규정’, 한국거래소의 ‘상장규정’ 및 기타 관계법령에 따라 최대주주, 주식인수인 등이 소유한 주식을 일정기간 동안 한국예탁결제원에 처분이 제한되도록 전자등록하는 것을 말합니다. 보호예수(separate safekeeping)제도란 보호예수의뢰인(계약당사자)과 한국예탁결제원 간의 보호예수계약에 의거하여 보호예수의뢰인별로 증권을 분리 보관하는 특수한 보관형태입니다. 계약관계이기 때문에 일정한 요건을 갖춘 자는 자유롭게 보호예수계약 및 그 구체적 내용을 정할 수 있으나, 의무보호예수 제도에 있어서는 보호예수계약의 체결 및 그 내용(구체적으로는 보호예수 기간) 등에 일정한 제한이 가해질 수 있습니다.
