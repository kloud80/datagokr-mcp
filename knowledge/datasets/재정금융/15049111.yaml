description_portal: 서울시 시민참여예산 제안사업 시민참여단 세부 코드 데이터는 시민참여단 구성과 운영에 관한 세부 정보를 담고 있는 자료입니다. 회계년도는 해당 정보가 속한 연도를 나타내며, 시민참여단 코드는 시민참여단 기본코드와 연계되어 어떤 참여단에 대한 정보인지 구분하기 위한 식별값입니다. 교육시간코드는 참여예산 관련 교육이 언제, 어떤 회차로 진행되었는지를 코드 형태로 관리하여 교육 이수 여부나 시간대별 참여 특성을 파악하는 데 활용되는 항목입니다. 시민참여단주소와 시민참여단구는 참여단의 거주 지역과 자치구 정보를 나타내어 지역별 시민참여 분포, 특정 구 중심의 참여 편중 여부 등을 분석할 수 있는 기초 자료가 됩니다. 등록일시와 수정일시는 해당 세부 정보가 언제 최초 입력되고 이후 언제 변경되었는지를 관리하는 이력 정보로, 시민참여단 구성 관리의 투명성과 데이터 품질을 확보하기 위해 사용되는 항목입니다.
