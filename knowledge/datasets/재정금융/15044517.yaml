summary_user: KOTRA가 소장한 단행본 자료를 한 권씩 기록한 목록으로, 서명·저자·발행처·발행년도·청구기호·등록번호를 담는다(CSV 파일 약 8.1MB, 전국·비공간). 기업이나 연구자가 특정 산업·해외시장 관련 단행본을 KOTRA가 갖고 있는지, 어떤 저자·발행처가 언제 낸 책인지 확인할 때 쓴다. 실측 컬럼에는 다른 데이터와 묶을 전역 조인 키가 없어, 서명·저자·발행처 같은 이름 매칭이나 같은 기관(KOTRA)의 자료로만 연결된다.
description_portal: KOTRA에서 공공데이터포털에 제공하는 소장자료 목록 데이터는 KOTRA가 보유하고 있는 다양한 자료들의 목록을 제공하는 데이터입니다. 기업들은 소장자료 목록을 저자, 발행년도, 발행처 기준으로 필터링하여 필요한 정보를 조회할 수 있습니다. 이 소장자료 목록은 주로 KOTRA가 보유한 연구보고서, 시장 동향, 산업 분석, 수출입 동향 등의 자료로 구성됩니다. 이 데이터는 해외 시장 동향, 산업별 분석, 수출 마케팅 전략, 글로벌 경제 전망 등 다양한 주제를 다룹니다. 기업들은 이 데이터를 통해 특정 산업이나 시장에 대한 심층적인 정보를 얻을 수 있습니다.
