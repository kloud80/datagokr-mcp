description_portal: 세출 및 지출 세목 예산편성현황(외화)은 중앙행정기관의 외화로 편성된 예산 내역을 가장 세부적인 단위인 세목별로 집계·제공하는 재정 통계 자료입니다.(부처별, 분야·부문·프로그램·단위사업·세부사업·세목별 외화예산 편성 내역으로 구성되어 있습니다.)외화예산은 국제 거래, 해외 사업 수행, 외교·통상 업무, 국제기구 출연금 등 외화로 직접 지급해야 하는 지출을 위해 편성되며, 환율 변동에 따라 원화로 환산된 예산 규모가 달라질 수 있습니다.[데이터 주요 항목 및 특징]1. 데이터 범위   * 중앙행정기관의 외화 편성 예산을 세목 단위까지 구분   * 부처명, 회계명, 분야·부문·프로그램·단위사업·세부사업·세목명, 외화 표시 금액 등 포함2. 외화 예산 주요 활용 분야   * 해외 공관 운영비   * 국제기구 분담금·출연금   * 해외 현지 프로젝트 비용   * 해외 장비·물자 구매비   * 대외원조(ODA) 자금 집행3. 활용 예시   * 외교·국제협력 관련 세목별 예산 구조 분석   * 환율 변동 리스크를 고려한 외화예산 규모 추정   * 부처별 외화 지출 세부 항목 비교   * 대외정책 우선순위 평가 자료로 활용4. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 형식으로 다운로드 가능   * Open API 지원 (연도, 부처, 분야, 세목명, 통화 단위 등 조건별 상세 조회 가능)본 자료는 정부의 외화 지출 구조를 가장 세밀한 수준에서 공개함으로써 국민의 알권리를 충족하고, 연구기관·언론·일반 국민이 대외정책, 국제협력, 재정 건전성 분석 등에 폭넓게 활용할 수 있는 소중한 재정 정보입니다.
