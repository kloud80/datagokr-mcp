description_portal: 이 데이터는 기술보증기금이 월별로 운전자금과 시설자금 용도로 집행한 보증공급 건수를 정리한 자료입니다. 보증공급 건수는 기술보증기금이 실제로 중소벤처기업에 보증을 제공한 사례 수를 의미하며, 자금의 사용 목적에 따라 구분함으로써 정책자금의 운용 흐름과 자금 수요의 유형별 특성을 파악할 수 있도록 구성되어 있습니다.주요 항목은 다음과 같습니다.**‘연도’**와 **‘월’**은 보증공급이 집계된 기준 시점을 의미합니다.**‘운전자금(건수)’**은 인건비, 원자재 구입, 외상매입 결제 등 중소기업의 일상적인 영업활동에 필요한 자금으로, 단기 유동성을 지원하는 보증건수를 나타냅니다.**‘시설자금(건수)’**은 토지, 건물, 기계기구 등의 자산을 매입하거나 신축·설치하는 데 필요한 설비투자성 자금에 대한 보증건수입니다.**‘총 공급(건수)’**은 위 두 항목을 합산한 전체 보증공급 실적입니다.실제 데이터에서는 운전자금이 대부분의 월에서 전체 건수의 약 90% 이상을 차지하고 있으며, 이는 중소벤처기업의 자금 수요가 주로 단기 운영자금에 집중되어 있다는 점을 보여줍니다. 시설자금 보증은 상대적으로 비중이 작지만, 기업의 중장기 성장을 위한 고정자산 투자 수요를 일정 부분 반영하고 있습니다.이 자료는 중소기업 정책금융의 자금 흐름을 이해하고, 자금용도별 보증 공급의 균형성, 정책 우선순위, 계절적 자금 수요 차이 등을 분석하는 데 활용됩니다. 또한 자금 조달 유형별 수요 변화, 산업 경기 흐름, 투자 심리 등을 종합적으로 파악하기 위한 참고 또는 기초자료로서 활용될 수 있습니다.
