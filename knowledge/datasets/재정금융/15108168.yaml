description_portal: '개인사업자기본정보는 개인사업자의 개요정보와 휴폐업정보를 조회할 수 있으며, 주요 구성항목은 업종정보, 지역정보, 설립년도, 휴폐업정보, 종업원수 및 대표자 연령대와 성별로 제공됩니다.이 데이터는 2개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 개인사업자 기본정보 조회 : 업종, 지역, 설립년도, 종업원 수, 대표자 성별 및 연령대 등 개인사업자의 개요 정보를 제공합니다.② 개인사업자 휴폐업정보 조회 : 개인사업자의 휴업 또는 폐업 여부 및 변동 사항을 조회할 수 있습니다.※ 데이터는 매년 1회 갱신됩니다.'
