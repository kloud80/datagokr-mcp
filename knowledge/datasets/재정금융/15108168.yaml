status: active
summary_user: 전국 개인사업자의 개요 정보(업종, 사업 지역, 설립년도, 종업원 수 구간, 대표자 성별·연령대)와 휴폐업 구분을 기준년월(basYm)과 함께 두 개의 조회 오퍼레이션으로 담으며, 범위는 전국이고 공간 좌표는 없다. 창업 컨설턴트나 분석가가 '특정 지역·업종 개인사업자의 설립년도 분포와 휴폐업 비중은 어떤가', '대표자 연령대·성별에 따라 업종 구성이 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에는 사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 업종코드(bizBzcCd)나 지역명·업종명 같은 이름 매핑으로만 붙인다.
limits: 사업자번호·법인등록번호가 응답에 없어 기업 공시·재무 데이터와 개별 사업자 단위로 연결할 수 없고, 지역도 이름 수준이라 좌표 분석에는 쓸 수 없다. 갱신 주기는 포털 설명에 연 1회로 적혀 있지만 실측 분류는 이벤트형(생성 후 불변)으로 잡혀 있어, 최신 기준년월은 호출해서 확인해야 한다.
