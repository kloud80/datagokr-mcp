description_portal: 기획재정부에서 제공하는 본 자료는 국유재산의 연도별 증감 내역과 현재액 현황을 종합적으로 정리한 데이터입니다. 중앙관서별, 회계별로 분류된 국유재산 통계를 포함하고 있으며, 국가의 자산 관리 현황을 분석하고자 하는 연구자나 정책 수립자에게 유용한 정보를 제공합니다. 특히 결산을 기준으로 한 실적 중심의 자료로, 국유재산의 변동 추이와 규모를 파악할 수 있는 기초 통계를 제공합니다. 또한 회계별로 분류된 정보는 예산의 집행과정에서 발생하는 자산 변동을 이해하는 데 중요한 자료로 활용될 수 있습니다. 본 데이터는 열린재정 포털을 통해 누구나 접근 가능합니다.
