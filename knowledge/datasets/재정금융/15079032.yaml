description_portal: 본 데이터는 지방자치단체가 부과·관리하는 지방세의 세목별 과세 및 비과세 현황을 체계적으로 제공하기 위한 자료이다. 제공 항목은 세목명, 과세건수, 과세금액, 비과세건수, 비과세금액으로 구성되며, 이를 통해 각 세목별 지방세 부과 규모와 비과세 운영 현황을 종합적으로 파악할 수 있다. 세목명은 취득세, 재산세, 자동차세, 주민세, 지방소득세 등 지방세법에 따라 부과되는 개별 세목을 의미한다. 과세건수와 과세금액은 해당 세목에 대해 실제로 납세의무가 성립되어 부과된 건수와 금액을 나타내며, 비과세건수와 비과세금액은 법령에 따라 과세대상에서 제외되거나 공익적·정책적 사유로 세부담이 발생하지 않은 건수와 금액을 의미한다. 본 자료는 세목별 세원 규모, 과세 편차, 비과세 수준 등을 분석할 수 있어 지방세수 구조 파악, 세정 운영 효율화, 재정정책 검토 및 행정서비스 개선을 위한 기초자료로 활용될 수 있다. 다만 자료는 기준시점에 집계된 행정자료이므로 이후 경정, 감액, 추가 부과 등에 따라 수치가 달라질 수 있다.
