description_portal: '금융통계자산운용사정보는 기준년월을 중심으로 자산운용사의 일반 현황, 재무 현황, 주요 경영지표 등에 대한 통계를 제공하는 데이터입니다. 자산운용사별 사업구조, 인력, 자본금, 수익현황, 운용자산 규모 등 운용사 경영 전반을 수치화하여 비교 및 분석할 수 있도록 구성되어 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 자산운용사 일반현황 조회 : 운용사별 회사 유형, 인가일자, 임직원 수, 점포 수 등 조직 일반 정보를 제공합니다.② 자산운용사 재무현황 조회 : 운용사별 자본금, 총자산, 영업수익, 영업이익, 순이익 등 재무 항목을 조회합니다.③ 자산운용사 주요 경영지표 조회 : 수탁고, 운용자산(AUM), 펀드수, 위탁고, 수익구조 등 핵심 경영성과 지표를 제공합니다.'
