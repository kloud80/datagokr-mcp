summary_user: 자산운용사별로 기준년월(basYm) 단위의 일반현황·재무현황·주요 경영지표(임직원·점포 수, 자본금·영업이익, 수탁고·운용자산 등)를 담은 전국 단위 금융회사 통계다. 투자자나 분석가가 '특정 자산운용사의 운용자산 규모와 순이익이 다른 운용사와 비교해 어떤가'를 확인할 때 쓴다. 법인등록번호(crno)가 실측 조인 키로 확인되어, 같은 키를 가진 금융위 기업정보·재무 데이터나 다른 업권 금융회사 원장과 이어 쓴다.
