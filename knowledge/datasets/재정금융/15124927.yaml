description_portal: 이 자료는 서귀포시의 일반회계에서 연도별로 실제 지출된 항목별 세출결산 내역을 정리한 것입니다. “일반공공행정”, “교육”, “사회복지”, “보건”, “환경보호” 등 다양한 기능별 부문으로 구분돼 있어, 각 부문별 지출이 얼마나 이루어졌는지, 그리고 전체 예산 대비 지출이 어떤 비율을 차지하는지를 파악할 수 있어요. 행정에서는 예산 집행의 효율성, 지출 항목 간의 우선순위, 예산 대비 지출의 낭비 요소 분석 등에 이 데이터를 활용할 수 있고, 시민이나 연구자에게는 재정 투명성 확보, 정책 효과 분석, 지역 재정 건전성 평가 등에 중요한 기초자료가 됩니다. 예를 들어 어떤 연도에 “사회복지” 지출이 큰 폭으로 늘었는지, “예비비” 항목이 얼마나 남거나 쓰였는지 같은 변화 추이를 비교 가능해요. 또한 미래 예산 편성 시 참고할 자료로, 어느 부문에 더 중점 투자가 필요한지 판단하는 데 유용합니다.
