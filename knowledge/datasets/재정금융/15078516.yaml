description_portal: 이 데이터는 옥천군 관내에서 부과되는 지방세 중 비과세 및 감면이 적용된 사례들을 세목별로 집계한 자료입니다. 주요 세목으로는 취득세, 재산세, 등록면허세, 자동차세 등이 포함되며, 각 세목에 대해 감면이 적용된 대상, 감면 사유, 감면 금액, 감면율 등을 확인할 수 있습니다.옥천군은 지방세특례제한법과 자체 조례에 따라 일정한 요건을 갖춘 납세자에게 지방세를 비과세하거나 감면해 주고 있으며, 이 데이터는 그러한 제도가 실제로 어떻게 적용되었는지를 수치적으로 보여줍니다.해당 데이터는 연도별 통계 형식으로 제공되며, 감면 건수, 감면 세액, 감면율 등을 기준으로 옥천군의 세정 운용상황을 분석하는 데 활용됩니다. 또한 감면 사유로는 국가보훈대상자, 장애인, 저공해차량, 창업 중소기업, 사회복지시설 등이 있으며, 이를 통해 지역 맞춤형 세제 지원 정책의 실효성을 점검할 수 있습니다.본 자료는 공공데이터포털(data.go.kr)에서 옥천군이 제공한 원자료를 기반으로 하며, 주민과 기업의 세부담 경감, 정책 수립, 감사 및 행정평가 자료로도 사용될 수 있습니다.
