description_portal: '경기도 파주시의 2017년부터 2019년까지의 세목별 납세자 분포를 체계적으로 기록한 통계성 데이터로, 시도명, 시군구명, 자치단체코드와 같은 지역 식별 정보를 비롯해 과세년도, 세목명(예: 재산세, 취득세 등), 납세자유형(개인, 법인), 관내·관외 구분, 그리고 해당 구분별 납세자수를 포함하고 있어 데이터 분석 및 시각화를 통한 세수 흐름 이해, 지방 재정 건전성 평가, 그리고 지역 간 세원 불균형 분석, 납세자유형(개인·법인)과 관내·관외 여부는 납세자의 활동범위 및 과세권 설정과 관련된 정책 연구에 유용한 변수로, 다양한 통계 분석 및 머신러닝 모델 학습에 적합한 구조로 구성되어 지방세 정책 개발, 지역경제 연구, 또는 공공행정 개선을 위한 실증적 근거 자료, 행정연구, 재정정책 수립, 지방세 분석, 자치단체 차원의 납세 기반 비교나 납세유형별 변화 추이 분석을 통한 지역 간 재정자립도 및 과세 편중 현상의 객관적 진단,  시각화 기반 인사이트 도출, 정책 시뮬레이션 도구 개발, 지역재정, 공공정책, 세무행정 연구 등에 활용될 수 있습니다. 또한, 지방세 징수현황과 관련한 최신 자료는 지방세징수현황 데이터를 참고하여 주시기 바랍니다.'
