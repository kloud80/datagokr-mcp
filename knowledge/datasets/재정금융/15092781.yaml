description_portal: '신용보증기금의 「회계거래정보 거래관리항목정보」는 내부 회계시스템에서 발생하는 거래 내역 중 거래에 수반되는 관리항목 정보를 상세히 기록한 데이터입니다. 주요 항목으로는 거래공통내역 ID, 분개내역 일련번호, 관리항목 코드 및 값, 항목명(예: 은행명) 등이 포함되어 있으며, 거래 건별로 연관된 식별 정보와 함께 체계적으로 관리됩니다. 이 데이터는 회계분개 내역에 부가적인 정보(계좌, 금융기관, 프로젝트 등)를 연계함으로써 거래의 성격과 흐름을 보다 명확히 분석할 수 있게 합니다. 현재 공공데이터로 개방되어 있어, 회계 투명성 확보, 내부통제 강화, 예산 분석 및 회계감사 연구 등에 활용 가능합니다.'
