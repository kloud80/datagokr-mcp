description_portal: '이 데이터는 우체국금융개발원이 접수한 전기통신금융사기 피해 사례에 대한 정보를 담고 있습니다. 주요내용은 보이스피싱 및 전지금융사기 등 다양한 유형의 금융사기 발생현황을 보여줍니다. 데이터에는 피해자 연령, 성별, 피해금액, 접수년,월, 사기유형, 피해금액, 피해구제신청 사유 등 상세정보가 포함되어 있습니다. 데이터 활용가치 사기예방 : 사기유형별 통계를 분석하여 금융사기 예방정책 수립에 활용 할 수 있습니다. 피해구제 연구 : 피해구제 절차의 효율성을 높이기 위한 연구자료로 사용할 수 있습니다. 대국민 정보 제공 : 전기통신금융사기의 심각성을 알리고, 피해사례를 공유하여 국민들의 경각심을 높이는데 기여할 수 있습니다. 이 데이터는 보이스피싱, 스미싱, 파밍 등 진화하는 사기수법에 대응하고 피해자를 효과적으로 지원하기 위한 중요한 기초자료가 될 것입니다.'
