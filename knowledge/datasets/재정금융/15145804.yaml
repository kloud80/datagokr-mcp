description_portal: '○ 통계개요* 통계명 : 지역소득* 통계종류 : 서울시 지역소득 현황을 제공하는 지정ㆍ가공 통계* 작성목적 : 지역경제의 생산 규모 및 지출수준, 소득수준, 산업구조 등을 파악하여지역경제분석 및 정책수립에 필요한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 지역내총생산, 경제성장률, 실질, 명목, 민간소비, 정부소비, 건설투자, 설비투자, 지역총소득 등○ 용어설명* 지역내총생산(GRDP) : 어떤 지역 내에서 가계, 기업, 정부 등 경제주체가 일정 기간 동안 생산활동에 참여하여 창출한부가가치를 시장가격으로 평가한 금액* 당해년가격과 기준년가격- 당해년가격 : 당해연도의 경상가격으로 평가, 지역경제의 구조변동이나 각 요소들의중요성이 시간의 경과에 따라 어떻게 변동하는가를 분석하고자 할 때 이용- 기준년가격 : 어느 특정 년(통상 끝자리 0,5자 연도)의 가격으로 평가, 물가의 변동에따른 요인을 배제하여 장기간에 걸친 물량수준의 변동 등을 분석하고자 할 때 사용* 명목과 실질- 명목 : 일정 기간 동안 정해진 경제구역 내에서 생산된 모든 최종재화와 서비스의 시장가격 합으로경제구조나 규모 파악에 활용- 실질 : 명목 지역내총생산에서 가격변동분으로 제거한 순수한 생산수량의 변동분만으로 나타낸 것으로경제성장율 산정에 이용○ 기 타* 지역내총생산은 각 시ㆍ도별 생산측면의 부가가치를 파악한 것으로써 소득 및 생활수준등의 비교자료로 사용하기에는 부적합함* 연쇄가중법(기준년이 매년 직전년도로 변경되어 실질 GRDP를 구하는 것)을 도입하여실질 GRDP 추계* 연쇄가중법에 의해 추계된 실질 GRDP는 비가법적 특성에 의해 총량(또는 상위부문)금액과 그 구성항목 금액의 합이 일치하지 않음* 1인당 지표는 통계청 시도별 장래인구추계 결과로 산출○ 출 처 : 통계청'
