description_portal: 해당 데이터는 양평군 군민들이 1인당 또는 세대당 부담하고 있는 지방세액을 체계적으로 제시함으로써 지역 주민의 실제 조세부담 수준을 비교·분석할 수 있는 기반 정보를 제공합니다. 이러한 자료는 납세자의 경제적 부담이 어느 정도인지, 타 지자체와의 상대적 차이는 어떤지를 파악하는 데 유용할 뿐 아니라, 세금 변화가 소비·지출에 미치는 영향을 분석하는 거시경제적 조세승수 산출의 기초 자료로도 활용될 수 있습니다. 더 나아가 인구 구조나 소득 수준 변화에 따른 세 부담 추세를 관찰함으로써 지방재정 건전성, 세정 정책의 적정성, 향후 세제 조정 필요성 등을 검토하는 데에도 중요한 참고자료로 기능합니다.
