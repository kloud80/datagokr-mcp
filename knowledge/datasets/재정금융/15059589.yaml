summary_user: 주택저당증권(MBS)의 발행년도·회차·트랜치별 원본 및 이자 지급 내역을 담으며, 공시일자, 발행잔액, 배당수익률, 만기일, 이자지급일, 원본·이자·합계 지급금액, 콜옵션 행사 여부, 상환계획 수정 여부를 건별로 제공한다. 투자자나 채권 분석가가 '특정 연도에 발행된 MBS 트랜치의 이번 지급일 원리금과 남은 발행잔액은 얼마인가'를 확인하는 데 쓴다. ISIN 코드(isinCd)를 조인 키로 삼아 종목코드 원장·일별 시세 등 증권 시장 데이터와 이어 쓴다.
limits: 요청 조건은 유가증권발행년도뿐이라 ISIN이나 트랜치 단위로 바로 좁혀 조회하려면 받은 뒤 걸러야 한다. 범위는 전국 단위 비공간 데이터이며 지역별 분석에는 쓸 수 없다. 개발계정은 일 10,000회 호출 한도가 있다.
