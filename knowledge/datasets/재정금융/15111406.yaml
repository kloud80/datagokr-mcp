description_portal: '2013년부터 2023년까지 성인지예산 시계열 자료입니다.*2021년까지는 성인지 결산서 집행액 기준, 2022년은 본예산 기준이며, 2023년은 「2023년도 성인지 예산서」 및 「2023년도 성인지 기금운용계획서」 예산안 기준으로 작성되었습니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.성인지예산제도: 예산이 여성과 남성에게 미칠 영향을 미리 분석하여 이를 예산편성에 반영·집행하고, 여성과 남성이 동등하게 예산의 수혜를 받고 예산이 성차별을 개선하는 방향으로 집행되었는지를 평가하여 다음연도 예산편성에 반영하는 제도• 2006년 「국가재정법」에 성인지예산서, 성인지결산서 제출 조항 마련, 2010회계연도 예산안 편성부터 시행'
