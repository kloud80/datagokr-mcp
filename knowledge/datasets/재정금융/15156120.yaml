description_portal: 본 데이터셋은 신용보증기금의 팩토링 심사 과정에서 기업의 실재성 및 정상 영업 여부를 검증하기 위해 다양한 외부 유관기관으로부터 수집된 연계 정보를 제공합니다. 신청 기업이 제출하는 서류 외에 공신력 있는 제3기관의 원천 데이터를 포함하고 있어 정보의 객관성과 신뢰도가 매우 높습니다.주요 데이터로는 인터넷 등기소의 법인 및 부동산 등기정보, 한국전력공사의 전기요금 청구서 정보, 국민연금공단의 보험료 납부 내역, 그리고 정부24를 통해 수집된 특허 및 지식재산권 보유 현황 등을 포괄합니다.이러한 데이터는 재무제표만으로는 파악하기 힘든 기업의 실제 공장 가동 현황, 기술 보유력, 그리고 고용 유지 안정성 등을 입체적으로 분석하는 데 필수적입니다. 핀테크 기업의 비금융 정보 기반 대안신용평가 모델 개발, 기업의 ESG 경영 분석, 그리고 다차원 기업 데이터 결합 연구를 위한 기초 자료로 활용 가치가 높습니다.
