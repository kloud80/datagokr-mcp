description_portal: '2017년부터 2023년까지 한국무역보험공사가 각 시점별 보유하고 있는 해외프로젝트 유효계약금액(원화기준)을 나타낸 데이터입니다. * 해외공사보험 : 해외공사 발주자와 채무불이행, 파산 등 신용위험이 수반될 뿐만 아니라 발주국 또는 지급국에서의 전쟁, 내란, 정변이나 환거래 제한.금지 등 공사계약 당사자간에는 불가항력적인 비상위험이 발생할 가능성을 배제할 수 없으므로 이러한 위험으로부터 해외공사를 수주한 자를 보호하기 위한 제도* 수출기반보험(제조설비) : 금융기관이 소재ㆍ부품ㆍ장비 또는 신산업을 영위하는 기업에게 상환기간 2년 초과의 제조설비 구매자금을 대출하고 대출원리금을 회수할 수 없게 된 경우에 발생하는 손실을 보상하는 제도'
