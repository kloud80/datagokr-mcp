summary_user: 관세청 수출입 신고 자료를 수출 8개·수입 16개 거래종류(일반수출, 보세공장 수출, 일반수입 등)별로 기간 단위로 집계한 무역통계로, 건수·중량(kg)·달러 및 원화 금액을 담으며 범위는 전국·비공간입니다. 분석가나 사업자가 '보세공장·자유무역지역을 거친 수출이 일반수출 대비 얼마나 되나'처럼 거래 형태별 무역 규모와 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 종류 코드(statCd)·기간·수출입구분을 이름 매핑하거나 같은 관세청 품목·국가별 수출입실적과 기간 기준으로 나란히 놓아 비교한다.
