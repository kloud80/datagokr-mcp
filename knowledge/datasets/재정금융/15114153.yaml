description_portal: '- 차명계좌란 남의 이름을 빌리거나 도용해 개설한 계좌를 말함- 가상의 이름을 사용하는 가명계좌와는 다르며, 보통 불법적인 금융거래, 비자금 관리, 로비활동, 탈세 등의 행위를 위해 사용됨- 차명계좌는 상대방의 허락을 얻어 개설한 합의 차명과 동의 없이 남의 이름을 훔쳐 개설한 계좌로 구분- 차명계좌는 주로 기업의 비자금 관리, 불법적인 금융 거래나 로비 활동, 탈세, 범죄 수익 운용 등 불법적인 돈을 관리하기 위해 만들며, 1993년 8월 12일 금융실명제 가 도입된 이후 모든 금융 거래에는 실명을 사용하도록 하여 차명계좌를 개설하는 것은 불법. 불법재산 은닉이나 자금 세탁, 탈세 등을 목적으로 다른 사람 명의로 된 계좌를 개설할 경우 5년 이하의 징역이나 5000만 원 이하의 벌금이 부과. 또한 불법 목적의 차명거래를 할 경우 명의를 빌린 사람과 함께 불법임을 알고 명의를 빌려 준 사람도 공범으로 처벌을 받게 됨. [네이버 지식백과] 차명계좌 (시사상식사전, pmg 지식엔진연구소)- 지방청별, 납세자 유형별(개인, 법인) 차명계좌신고 처리 실적(전년이월, 해당연도)- 해당연도 중 처리 완료한 실적을 기준으로 작성- 추가징수세액은 모든 세목을 합한 것임- 단위 : 건, 백만원'
