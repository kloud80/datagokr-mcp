summary_user: 한국자산관리공사 담보주택 매매지원 프로그램으로 온비드 공매에 부쳐진 담보주택을 물건 한 건씩 담은 파일로, 수임일자·감정일자·감정가금액·이해관계인 구분·개인/법인 구분·주소·물건유형을 기록한다(전국 범위, 주소 단위, 파일 크기 471바이트로 건수가 매우 적음). 주택담보대출 연체 차주의 담보주택이 언제 수임되어 얼마로 감정됐는지, 이해관계인이 개인인지 법인인지를 살펴보는 분석가나 정책 담당자가 쓴다. 전역 조인 키가 없어 주소를 행정구역명으로 맞추거나 같은 기관의 온비드 공매 데이터와 이름 기준으로 이어 써야 한다.
description_portal: □ 지원 개요한국자산관리공사는 정부의 「취약·연체 차주 지원방안("18.01.18.)」에 따른 후속조치로 2018년 2월부터 「담보주택 매매지원 프로그램」을 시행하고 있습니다.주택담보대출 연체채무자가 신용회복 위원회를 통해 담보주택을 매각 후 채무 상환하고자 할 경우 온비드(공매)를 이용하여 담보주택 매각을 지원합니다.□ 데이터 내용한국자산관리공사 담보주택매매 이해관계인의 물건현황 데이터로 해당 프로그램의 "수임일자","감정일자","감정가금액","이해관계인구분","개인/법인구분","주소","종별" 항목을 제공하고 있습니다.
