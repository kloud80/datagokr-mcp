summary_user: 신기술금융사의 일반현황(임직원 수 등), 재무현황(요약재무상태표 계정과목별 금액·구성비율), 주요경영지표(이사·감사 보수 등), 주요영업활동(부문별 금액)을 기준년월별 금융회사 단위 시계열로 담는 전국 범위 업권별 금융통계입니다. 분석가가 "특정 신기술금융사의 임직원 수와 자산 구성은 기준년월마다 어떻게 바뀌었나" 같은 질문에 답하거나 업권 내 회사를 비교할 때 쓴다. 법인등록번호(crno)를 조인 키로 삼아 금융위원회 기업정보·공시/재무 데이터와 다른 업권 금융통계의 같은 법인을 이어 쓰고, 금융회사코드(fncoCd)도 함께 담는다.
limits: 금융회사 단위 집계라 개별 투자·거래 건이나 지역별 분포는 담지 않는다(전국·비공간). 실호출은 1개 오퍼레이션만 확인했으므로 나머지 오퍼레이션의 응답 형식은 호출해 보고 확인해야 하며, 개발계정은 하루 10,000회로 제한된다.
