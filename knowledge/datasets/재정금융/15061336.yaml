description_portal: '금융통계신기술금융사정보는 기준년월을 기준으로 신기술금융사일반현황, 신기술금융사재무현황, 신기술금융사주요경영지표, 신기술금융사주요영업활동 등의 정보를 시계열 형식으로 제공하는 데이터입니다. 이 데이터는 4개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 신기술 금융사 일반현황 조회 : 기준년월등을 통하여 금융회사명, 인원수, 임직원수, 임직원 구분코드명등을 조회하는 신기술금융사일반현황조회 기능② 신기술 금융사 재무현황 조회 : 기준년월 등을 통하여 금융회사명, 자산요약재무상태표계정과목금액, 자산요약재무상태표계정과목코드, 자산요약재무상태표계정과목코드명, 자산요약재무상태표계정과목구성비율, 법인등록번호등을 조회하는 신기술금융사재무현황조회 기능③ 신기술 금융사 주요경영지표 조회 : 기준일자, 법인등록번호를 통하여 등기이사비고내용, 사외이사총보수금액, 감사인수, 감사인총보수금액등을 조회하는 신기술금융사주요경영지표조회 기능④ 신기술 금융사 주요영업활동 조회 : 기준년월 등을 통하여, 금융회사명, 부문구분금액, 부문구분코드, 부문구분코드명 등을 조회하는 신기술금융사주요영업활동조회 기능'
