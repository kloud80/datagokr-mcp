description_portal: 전라남도 영광군 계약정보공개 검수정보 및 도급정보로 계약공개시스템에 있는 테이블을 공개합니다. 계약이행 과정에서 발생하는 공사 및 용역에 대한 검수 결과, 대금 지급 이력, 하도급 및 공동도급 현황 등 세부 정보를 담은 데이터입니다. 계약별로 검수 일자, 검수 수량, 계약 금액, 지급액, 하도급 비율, 참여업체 정보 등이 포함되며, 연도별로 축적됩니다. 이 데이터는 지방계약의 투명성 확보, 공정한 계약 이행 관리, 예산 집행의 효율성 분석 등에 활용되며, 행정기관의 계약 감시체계 구축, 정책 수립, 재정 건전성 평가 등에 기초자료로 제공됩니다.
