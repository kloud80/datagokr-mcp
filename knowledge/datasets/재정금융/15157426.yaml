summary_user: 한국예탁결제원을 통해 체결된 주식·채권의 종목별 대차거래 현황(체결·상환·리콜 상환·잔고 주식수와 백만원 단위 잔고금액)과 주식·채권 대차 체결 종목 순위를 담는 전국 단위 API입니다. 투자자나 시장 분석가가 '특정 종목의 대차 잔고가 최근 얼마나 쌓였고 상환은 얼마나 됐나'처럼 공매도 수요와 대차 동향을 종목별로 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으나 종목코드(isin)와 예탁원 단축코드를 담고 있어, 종목코드 원장·일별 시세 등 같은 코드를 쓰는 증권 시장 데이터와 코드 매핑으로 이어 쓴다.
description_portal: 한국예탁결제원을 통해 체결되는 주식과 채권의 종목별 대차거래현황 정보, 채권대차 체결 종목 순위, 주식 대차 체결 종목 순위에 대한 정보를 제공 증권대차업무(Securities Lending and Borrowing, SLB)는 주식이나 채권 등 유가증권을 소유한 투자자가 이를 필요한 다른 투자자에게 대여하는 금융 활동입니다. 대여자는 자산을 대출해주는 역할을 하며 차입자는 일정 기간 동안 해당 증권을 사용합니다. 이 과정에서 차입자는 대여자에게 차입에 따른 수수료를 지급하고, 대여자는 차입자로부터 현금이나 국채 등 담보를 제공받아 거래의 안전성을 보장합니다. 일반적으로 증권대차는 공매도와 같은 전략적 거래를 위해 활용되며, 대차 계약 체결 후 담보 제공과 증권 반환 등의 절차를 통해 이루어집니다. 거래 만료 시점에 차입자가 증권을 반환하고 거래가 종료됩니다. 주요 참여자로는 대여자(연기금, 보험사 등), 차입자(헤지펀드, 증권사 등), 그리고 중개기관이 있으며, 이를 통해 거래가 성사됩니다.
team:
  dept: 증권데이터부
services:
  - op: /getSlbDealingByIsin
    name: 종목별대차거래현황
    endpoint: https://apis.data.go.kr/B552481/SlbSvc/getSlbDealingByIsin
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: isin
        required: true
        desc: 종목코드(KR표준코드)
    approval: auto
    traffic:
      dev: 100
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getSlbBondRank
    name: 채권대차종목순위
    endpoint: https://apis.data.go.kr/B552481/SlbSvc/getSlbBondRank
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: stdDt
        required: true
        desc: 기준일(YYYYMMDD)
      - name: rankTpcd
        required: false
        desc: 순위조건(1:대차잔고금액, 2:체결금액, 3:상환금액)
    approval: auto
    traffic:
      dev: 100
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /getSlbStockRank
    name: 주식대차종목순위
    endpoint: https://apis.data.go.kr/B552481/SlbSvc/getSlbStockRank
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: stdDt
        required: true
        example: '20131231'
        desc: 기준일(YYYYMMDD)
      - name: rankTpcd
        required: false
        example: '1'
        desc: 순위조건(1:대차잔고금액, 2:체결금액, 3:상환금액, 4:일잔고변동율)
    approval: auto
    traffic:
      dev: 100
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
