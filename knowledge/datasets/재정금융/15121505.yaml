summary_user: 신용보증기금 경영컨설팅 신청 건별로 입력일자, 총컨설팅비용, 신보 부담비율·지원금액, 실제지급금액, 컨설팅수행년도, 펌닥터 여부, 기업특성·우대기업 내용을 담은 전국 단위 원천 파일(csv, 약 29KB)이다. 연구자나 정책 분석가가 "신보 경영컨설팅에서 기업 부담 대비 신보 지원 비율은 얼마이고 우대기업에는 실제로 얼마가 지급됐는가" 같은 질문에 쓴다. 실측 조인 키는 경영컨설팅신청ID(kodit_consulting_app_id)뿐이고 사업자번호 같은 기업 식별 키는 필드에 없어, 다른 기업·보증 데이터와 기업 단위로 직접 잇기는 어렵다.
description_portal: 해당 파일은 신용보증기금이 운용하는 경영지원 서비스 중 경영컨설팅 신청에 관한 데이터로, 컨설팅비용, 지원금액 등의 항목을 제공합니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다
