description_portal: KOTRA(대한무역투자진흥공사)는 공공데이터포털을 통해 다양한 해외 인력 유치 및 채용 관련 정보를 개방하고 있습니다. 그 중 하나가 해외인력유치정보 회원정보 데이터로, 이는 KOTRA의 해외 인력 유치 사업에 참여하는 회원 기업 및 인력의 기본 정보를 포함하는 데이터입니다. 총 34개 테이블을 개방하고 있으며, 컬럼 정의서를 통해 각 컬럼 설명을 기재하였습니다. 회원 정보와 활동 데이터를 기반으로 통계 자료를 작성하여, 해외 인력 유치 사업의 성과를 평가하고, 향후 방향성을 설정하는 데 도움을 줄 수 있습니다. 또한, 회원들의 참여 이력과 활동 상태를 분석하여, 향후 해외 인력 유치 정책을 개발하거나 개선하는 데 활용할 수 있습니다.
