description_portal: '경상남도 사천시의 2018년부터 2020년까지 지방세 미환급 현황에 대한 상세 데이터를 공공정보로 제공합니다.이 데이터는 납세자에게 돌려줘야 하지만, 아직 환급되지 않고 남아있는 미환급금에 대한 정보를 담고 있습니다. 제공되는 주요 항목은 다음과 같습니다:미환급 유형별 분류: (예: 이중납부, 착오납부, 세액 감면 후 잔액 등)에 따른 미환급금 현황미환급금 총액: 각 연도별 미환급 상태로 남아있는 금액연간 누적률: 미환급금이 연도별로 얼마나 누적되고 있는지 보여주는 통계이 자료는 사천시의 지방세 환급 관리 실태를 객관적으로 파악하고, 납세자 권익 보호를 위한 환급 행정 개선 정책을 수립하는 데 필수적인 기초 자료로 활용됩니다.'
