description_portal: 자동간이환급실적 데이터로서 자동간이환급업체로 지정된 업체들의 간이환급업체수, 간이환급접수건수, 간이환급신청총세액에 관하여 월별로 통계를 작성한 데이터 입니다. 참고 자료로, 수출용 원재료에 대한 관세 등 환급사무처리에 관한 고시 제12조에 해당하는 업체는 영 제18조제7항에 따라 수출신고서에 환급신청 사항을 간략히 기재(이러한 환급방법을 이하 "자동간이"라 한다)함으로써 간이하게 환급신청할 수 있으며,  자동간이 환급업체로 지정을 받으려는 자는 별지 제17호서식의 자동간이 환급업체(품목) 지정(변경ㆍ취소) 신청(통보)서를 관할지세관장에게 제출하여야 함을 알려드립니다.  데이터  통계산출기간은 2016년 1월부터 시작합니다. 공공데이터 제공주기는 1년으로 활용도가 높아지면 월간제공주기로 변경할 수 있습니다.
