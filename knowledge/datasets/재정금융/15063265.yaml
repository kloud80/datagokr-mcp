description_portal: 경기도 과천시 재정정보시스템 일반지출권한에 관한 자료입니다. 해당 자료는 권한코드와 권한코드명을 기준으로 권한이 부여되는 대상과 권한 부여 시 사용할 수 있는 기능을 정의합니다.이 데이터는 일반지출 처리 과정에서 담당자별 권한의 범위와 역할을 명확히 구분하기 위해 구성된 것으로, 공공재정 집행의 투명성과 책임성을 확보하는 데 목적이 있습니다. 또한 내부 회계 통제 체계를 강화하고, 유사 행정시스템 설계 및 권한 관리 기준 마련 시 참고자료로 활용될 수 있는 행정 실무 기반 데이터입니다.
