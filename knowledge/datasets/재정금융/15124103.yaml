summary_user: KOTRA 해외인력유치 사업에 참여한 기업과 인력 사이의 구인구직 정보와 채용 공고를 36개 테이블로 묶은 전국 단위 비공간 파일(zip)로, 경력 순번·근무 시작일과 종료일·직위·퇴사 사유·국가코드 같은 건별 경력 항목을 담는다. 참여 기업이 행사별 채용 성과를 따져 다음 채용 전략을 세울 때나, 분석가가 해외 인력이 어떤 국가 출신이고 어떤 직위 경력을 가졌는지 살펴볼 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키를 찾지 못해, 국가코드(COUNTRY_CODE)처럼 이름·코드를 맞추는 방식이나 같은 기관 데이터 안에서만 연결한다.
description_portal: KOTRA(대한무역투자진흥공사)는 공공데이터포털을 통해 다양한 해외 인력 유치 및 채용 관련 정보를 개방하고 있습니다. 그 중 하나가 구인구직 및 공고정보 데이터로, 이는 KOTRA의 해외 인력 유치 사업에 참여하는 기업과 인력 간의 구인구직 정보와 채용 공고를 포함하는 데이터입니다. 총 36개 테이블을 개방하고 있으며, 각 컬럼별 컬럼정의서를 함께 개방하여 데이터 활용 시 안내하고 있습니다. 참여 기업은 행사별 채용 성과를 분석하여 향후 채용 전략을 수립할 수 있습니다. 구직자는 자신의 이력서를 개선하거나, 원하는 직무에 대한 정보를 얻어 취업 준비에 활용할 수 있습니다.
