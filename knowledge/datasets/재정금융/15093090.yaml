description_portal: 신용보증기금의 「PC-OFF 시간외근무저축내역」은 임직원의 근무시간 외 업무 사용 이력을 관리하기 위한 데이터로, 정규 근무시간 이후 PC 사용 종료 시점 기준으로 산출된 시간외근무 내역을 기록한 자료입니다. 이 데이터는 업무 집중도 향상과 워라밸(Work-Life Balance) 제고를 위한 PC-OFF 제도의 운영 현황을 확인할 수 있으며, 구성원별 누적 초과근무시간, 월별 발생 내역 등으로 구성되어 있습니다. 해당 정보는 조직의 업무효율성, 근무문화 개선 현황, 초과근무 모니터링 등 다양한 분석에 활용될 수 있으며, 공공데이터로 개방되어 있어 내부관리 외에도 연구 및 정책자료로도 활용 가능합니다.
