description_portal: 이 데이터는 2019년 기준 우리나라 13대 주력 수출품목의 수출대금 결제기간별 비중을 정리한 자료입니다. 각 품목별로 30일 이내, 31~60일, 61~90일, 91~120일, 120일 초과의 결제기간 구간으로 구분하여 해당 구간별 수출대금이 차지하는 비율을 백분율로 표시하고 있습니다. 이를 통해 품목별로 상대적으로 짧은 기간에 결제가 이루어지는지, 아니면 장기 결제가 많은지를 분석할 수 있습니다다. 예를 들어, 석유제품은 30일 이내 또는 31~60일에 결제되는 비중이 높고, 섬유류는 46%가 31~60일에 결제되는 등 업종 특성에 따른 결제 관행을 파악할 수 있습니다. 이 데이터는 수출 품목별 결제 리스크 분석, 외상 매출 관리 전략 수립, 금융기관의 여신 리스크 평가 등에서 유용하게 활용할 수 있습니다.
