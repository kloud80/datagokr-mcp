description_portal: '세입/수입 예산편성현황은 정부의 총수입 규모와 구성내역을 체계적으로 정리한 공개재정 통계 자료입니다.(총수입·국세 수입·국세 외 수입 포함, 일반회계·특별회계·기금을 모두 합산한 후 내부거래 및 보전거래를 차감한 순수입 기준 데이터를 제공합니다) [데이터 주요 항목 및 특징]1. 총수입 규모   * 일반회계·특별회계·기금을 포함한 정부전체 수입   * 내부거래·보전거래 등 차감을 통해 순수입 기준 자료2. 회계별 수입 구성   * 국세수입: 소득세·법인세·부가세 등   * 국세외수입: 사용료·수수료·이자·기타수입 등3. 연도 및 회계별 집계   * 연도별 총수입 변화와 회계 간 수입 비중 추이 제공4. 제공 형식 및 접근 방법   * CSV, XML, JSON, XLSX, TXT 파일로 다운로드 가능   * Open API 제공, 링크 방식(XML) 형식으로 연도·회계별·세목별 조회 가능본 자료는 재정전문가, 연구기관, 언론, 일반국민 모두에게 정부 수입 구조와 흐름을 투명하게 제공하며, 재정정책 효과 분석 및 예산운용 계획 수립, 국민 정책참여 기반 자료로 광범위하게 활용됩니다.'
