summary_user: 주택도시보증공사가 주로 주택사업자에게 보유한 채권 가운데 제3자에게 매각했거나 매각할 예정인 채권을 건별로 담은 전국 단위 파일(csv)로, 관할영업점·채권구분·채권번호와 매각금액·환매금액·매각잔액이 들어 있다. 부실채권 투자자나 금융 분석가가 공사가 어떤 종류의 채권을 얼마나 팔았고 환매 후 남은 잔액이 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업점명·채권구분 같은 이름 매핑이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 주택도시보증공사가 주로 주택사업자에 대하여 보유하는 채권 중 제3자에게 매각하는 채권의 내역 (업체명(마스킹), 금액, 채권종류 등 의 정보)이며, 수요자들에게 투자기회 부여(예고) 및 예측가능성 제고 가능하는 데이터이며, 부실채권을 매각하는 과정을 통해 공사 재무건전성에 기여함. 따라서 채권매각내역 및 예정내역 데이터는 유의미한 데이터임. 2025년 이후 공사가 부실채권에 대한 채권매각을 추가로 실시하게되면 추가공시예정이며 공사시스템에 등록되어있는 매각채권을 중심으로 작성한 유의미한 데이터
