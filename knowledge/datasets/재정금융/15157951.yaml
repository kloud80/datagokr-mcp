description_portal: '광주광역시 남구 대부업체 등록 현황 및 정보(업체명, 사업내용, 소재지, 연락처 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 민생경제과(☎062-607-2714)에서 제공합니다. 소재지지번주소가 공란인 경우 소재지도로명주소를 참고하시고, 연락처에 개인정보가 포함되어 있는 경우 공란 처리하였음을 알려드립니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바라며, 해당 자료는 한국대부금융협회 홈페이지(https://www.clfa.or.kr/)에서도 확인 가능하오니 참고하시기 바랍니다. 링크 : https://fines.fss.or.kr/fines/plis/moneyLenderSearch/MoneyLenderSearch.getMoneyLenderList.do ※ 해당 데이터는 불법 사금융 피해를 예방하고 투명한 금융 거래 질서를 확립하기 위한 목적으로 공표되었습니다. 구민들이 정식 등록된 업체 여부를 신속하게 대조하고 안전한 금융 서비스를 이용할 수 있도록 돕는 행정 서비스의 일환으로 해당 정보를 개방합니다.'
