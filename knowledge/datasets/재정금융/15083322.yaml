summary_user: 예금보험공사가 관리하는 부보금융회사의 예금 총액·비부보예금·부보예금을 은행·보험·금융투자·종금·저축은행 5개 업권별로 기준일마다 억원 단위로 담은 전국 집계 자료로, 개별 금융회사 단위가 아닌 업권 합계이다. 분석가나 금융 관계자가 '저축은행 업권의 예금 중 예금자보호 대상 금액이 얼마이고 시점별로 어떻게 변했나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 기준일(시점)과 업권명을 맞춰 다른 업권별 금융통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 예금보험공사에서 관리하는 부보금융회사 종합정보 중 부보금융회사의 업권별 부보대상 상품금액이며, 억원 단위의 자료로 제공합니다.예금, 비부보예금은 각각 "22.9월 이전 자료의 보호대상상품 총액, 공공기관 등 예금과 동일합니다.현재 자료는 "25년 12월말 기준 각 업권별 예금동향입니다.아울러 부보예금의 경우 업권별로 정의가 다르며, 부보예금과 관련한 자세한 내용은 예금보험공사 홈페이지를 통해 확인하실 수 있습니다.부보예금 정보 외에도 다양한 정보들을 홈페이지를 통해 확인하실 수 있으니 많은 이용 부탁드립니다.감사합니다.
