summary_user: 신용보증기금 보증·투자를 이용하는 고객(기업)별 기본정보를 고객ID 단위로 담은 원장형 파일로, 고객 분류·설립형태·기업형태·업종코드·고객상태와 그 변동일자, 삭제여부 등을 담으며 전국 범위의 비공간 자료다(CSV 약 38KB). 분석가가 '신보 보증 이용 기업은 어떤 업종·기업형태에 몰려 있고 고객 상태는 어떻게 변하는가'를 살필 때 쓴다. 신보 고객ID(kodit_customer_id)로 같은 기관의 보증 이용 기업 명세 데이터와 잇고, 업종코드(classification_code)로 업종 분류표·업종별 통계와 이어 쓴다.
description_portal: 해당 파일 데이터는 신용보증기금의 고객기본정보고객정보에 대해 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
