description_portal: 이 데이터는 중개형 e마켓플레이스를 운영하는 기업들의 기본 정보를 수록한 공공데이터로, 전자상거래정보 중 ‘중개형 e마켓플레이스’ 항목에 해당합니다. 해당 자료는 중소기업의 온라인 판로 확대 및 거래 기반 마련을 위해 중개형 전자상거래 플랫폼과 협약을 맺은 기업의 현황을 제공하며, 마켓플레이스(MP)로 지정된 업체들의 운영 이력과 연락처 정보를 확인할 수 있습니다.주요 항목은 다음과 같습니다.‘순번’은 각 기업 정보를 구분하기 위한 일련번호입니다.‘마켓플레이스(MP) 회사명’은 중개형 전자상거래 서비스를 제공하는 업체의 명칭이며, 이상네트웍스, 엠피원, 케이지이니시스 등 다양한 기업이 포함됩니다.‘협약일자’는 해당 기업이 공공기관과 협약을 체결한 날짜로, 시스템 참여 시점을 나타냅니다.‘대표자명’은 사업자등록 기준의 공식 대표자 성명으로, 공동대표일 경우 쉼표로 구분해 표기됩니다.‘대표전화’는 기업의 대표 연락처로, 서비스 문의나 제휴 관련 응대에 사용될 수 있습니다.‘주소"는 기업 본사 소재지를 나타냅니다.이 데이터는 특정 시점 기준의 등록 정보로, 전자상거래 플랫폼의 지속 운영 여부나 실제 거래 규모 등을 반영하지 않습니다. 따라서 단독으로 분석하거나 평가 지표로 사용하기보다는, 해당 기업과의 접촉을 위한 기초정보 확인이나 정책적 참고자료로 활용하는 것이 적절합니다.
