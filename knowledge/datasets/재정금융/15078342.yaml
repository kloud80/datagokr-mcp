description_portal: 이 데이터는 경상북도 봉화군의 2017년부터 2024년까지의 지방세 납부 현황을 나타냅니다. 총 5개 주요 항목이 포함되어 있으며, 각 항목은 지방세 납부 정보에 대한 세부 사항을 제공합니다. 주요 항목은 다음과 같습니다:시도명, 시군구명, 자치단체코드는 지역 정보를 제공하며, 해당 데이터가 봉화군에 속한 것임을 알 수 있습니다.납부년도는 납부가 이루어진 연도를 나타냅니다.세목명은 납부된 지방세의 종류를 보여줍니다. 예를 들어, 자동차세, 재산세, 주민세 등 다양한 세목이 포함되어 있습니다.납부매체는 세금 납부에 사용된 매체를 구체적으로 나누며, 가상계좌, 은행창구, 위택스, 인터넷지로 등 다양한 납부 방법이 포함됩니다.납부건수는 해당 세목에 대해 납부가 이루어진 건수를 나타내며, 납부금액은 납부된 총 금액을 보여줍니다.납부매체비율은 각 납부 매체별 납부 비율을 백분율로 나타내며, 특정 매체의 사용 비율을 확인할 수 있습니다.이 데이터는 봉화군 내 다양한 세목에 대한 납부 현황을 종합적으로 보여주며, 납부 방법, 금액, 건수 등 세부 정보를 제공합니다. 이를 통해 봉화군의 지방세 납부 경향을 분석하고, 각 납부 매체별 사용 비율을 파악할 수 있습니다.
