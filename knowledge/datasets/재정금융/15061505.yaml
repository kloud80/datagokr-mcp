summary_user: 예금보험공사 부보 손해보험사의 주요 재무현황을 회사별 1행으로 담은 파일로, 전체 22행이다. 보험손익·투자손익·당기순이익·자산총계 같은 금액(억원)과 지급여력비율·부실자산비율·유동성비율 같은 건전성 비율(%)이 들어 있어, 분석가나 소비자가 특정 손해보험사의 재무 건전성이 어떤지 비교할 때 쓴다. 법인등록번호(corp_rgst_no)를 키로 다른 금융회사 원장 데이터와 이어 쓴다.
description_portal: '1. 데이터 개요본 데이터는 예금보험공사의 부보금융회사 중 손해보험사의 주요 재무현황입니다.2. 데이터 단위(억원) : 보험손익, 투자손익, 당기순이익, 자산총계, 부채총계, 자본총계(%) : 지급여력비율, 부실자산비율, 신용시장리스크비율, 대손충당금적립률, 운용자산이익률, 유동성비율3. 데이터 주석- 지급여력비율 : 지급여력금액 ÷ 지급여력기준금액 x 100- 부실자산비율: 가중부실자산 ÷ 자산건전성 분류대상자산 × 100- 신용시장리스크비율: (신용위험액+일반시장위험액) ÷ (운용자산+신용리스크 측정대상 비운용자산+재보험거래 익스포져) × 100- 대손충당금 적립률: 대손충당금 및 대손준비금 합계 ÷ 고정이하 대출채권 × 100- 운용자산이익률: 직전 1년간 투자영업이익 ÷ 경과운용자산* × 100  * (당기말 운용자산+전기말 운용자산-직전 1년간 투자영업이익)÷2- 유동성비율: 잔존만기 3개월 미만 가용 유동성자산 ÷ 3개월 평균 지급보험금* × 100  * 직전 1년간 월평균 지급보험금의 3개월분1) 동 재무현황은 예금보험공사가 금융감독원으로부터 공유받은 손해보험사의 업무보고서를 바탕으로 작성한 것으로, 손해보험사가 업무보고서를 작성하는 과정에서의 착오 또는 오류 등으로 인해 일부 내용이 사실과 다를 수 있으며, 외부감사인 검토 또는 검사 결과 등에 따라 변경될 수 있습니다.2) 모든 통계는 반올림된 수치로 세부항목의 합계와 상위항목이 일치하지 않을 수도 있습니다.3) 주요 경영지표 비율 산출시 별도의 표시가 없는 경우 손익과목은 기중 누계액(회계연도 개시일부터 기준월 말일까지)이고 대차과목은 기준월말일 현재 잔액입니다.'
