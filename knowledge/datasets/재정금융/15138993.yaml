description_portal: '이 데이터는 기술보증기금이 월별로 제공한 보증을 **보증의 종류별로 구분하여 금액 기준(단위: 백만원)**으로 집계한 현황입니다. 기업의 자금 조달 방식과 신용보완 수요 유형에 따라 보증은 다양한 형태로 분류되며, 본 자료는 그 중 대표적인 세 가지 보증유형에 대해 월별 보증공급 금액을 정리한 것입니다.주요 항목은 다음과 같습니다.**‘연도’**와 **‘월’**은 자료가 집계된 기준 시점을 나타냅니다.**‘대출보증(백만원)’**은 일반 금융기관의 대출에 대해 기술보증기금이 지급보증을 제공한 금액으로, 전체 보증공급에서 가장 높은 비중을 차지하는 유형입니다.**‘비은행대출보증(백만원)’**은 비은행금융기관 또는 기타 대출기관의 대출(당좌대출, 상업어음할인 등)에 대해 제공된 보증금액입니다.비은행금융기관은 「기술보증규정」 제3조제9항에 따라 종합금융회사, 보험회사, 상호저축은행, 농협, 수협을 의미하며,기타대출기관은  「기술보증규정」 제3조제10항에 따라 중소벤처기업진흥공단, 한국농수산식품유통공사, 신기술사업금융회사, 중소기업창업투자회사, 집합투자업자, 창업투자조합 및 신기술사업투자조합 등을 포함합니다.**‘지급보증의 보증(백만원)’**은 기업이 제3자에게 제공한 이행보증 또는 지급보증에 대해, 기술보증기금이 다시 보증을 제공하는 형태로, 이중보증 구조에 해당하며 주로 고위험 계약에서 사용됩니다.이 데이터는 기술보증기금이 보증금액 측면에서 어떤 보증유형에 집중적으로 대응하고 있는지를 파악하는 데 유용하며, 금융권·비금융권 자금조달 수단 간 활용 비율, 지급보증 구조 활용 현황 등을 분석하는 기초자료로 활용됩니다. 또한 보증정책의 자금배분 구조와 시장 수요 변화에 따른 대응 방향을 파악하는 데에도 참고할 수 있습니다.'
