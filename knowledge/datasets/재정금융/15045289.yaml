description_portal: 이 데이터는 신용보증기금의 부실현황을 2011년부터 연도별로 집계한 자료로, 보증잔액, 부실금액, 부실률, 부실잔액 등의 항목을 포함하고 있다. ‘보증잔액’은 해당 연도 말 기준으로 신용보증기금이 보증을 제공하고 있는 총 금액이며, ‘부실금액’은 해당 연도 중 발생한 부실 보증의 금액을 의미한다. ‘부실률’은 보증잔액 대비 부실금액의 비율로, 신용보증 운영의 건전성을 평가하는 핵심 지표이다. ‘부실잔액’은 누적된 부실 보증 중 아직 회수되지 않은 잔액을 의미하며, 기금의 채권 회수능력과 부실 관리 수준을 보여준다. 이 데이터를 통해 연도별 부실 발생 추이와 보증건전성의 변화를 분석할 수 있으며, 신용보증기금의 리스크 관리 정책 효과, 경제 상황에 따른 부실 위험의 변화 등을 평가하는 데 활용할 수 있다.
