description_portal: '*2007년부터 2024년까지의 통합재정수지 국가채무 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*2022년까지 결산, 2023년부터 예산 기준입니다.총수입･총지출을 기준으로 작성하였으며, 총계, 통합재정 등 작성 기준이 다를 경우 그 기준과 출처를 “주”에 별도 표시되어 있습니다.재정통계는 디지털예산회계시스템에 수록되어 있는 예･결산 자료를 바탕으로 한 것이며, 출처가 디지털예산회계시스템이 아닌 경우에는 그 출처를 “주”에 별도 표시되어 있습니다.국제통계는 OECD의 ｢Government at a Glance｣, IMF의 ｢Fiscal Statistics Yearbook｣을 이용했으며, 타 기관이 발표한 자료는 그 출처를 “주”에 별도로 표기되어 있습니다. 다만, 국제통계는 ｢주요 재정통계｣ 발간 후 변경(업데이트)될 수 있어, 이용 시 주의할 필요가 있습니다.모든 통계는 합계 또는 소계가 반올림되었으므로 세부 항목의 합계가 총계와 일치하지 않는 경우가 있습니다.'
