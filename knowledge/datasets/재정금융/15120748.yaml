description_portal: 연도별 가구월평균소득 데이터는 구로구 주민 가구의 연도별 소득 수준 변화를 정량적으로 측정하기 위해 구축된 통계 자료로, 기준연도별 평균 월소득과 해당 통계값 산출 기준이 포함된다. 소득자료는 복지정책, 지역 균형발전, 취약계층 지원 정책을 설계하는 데 핵심 지표로 활용되며, 인구 구조 변화나 지역 산업구조와 연결하여 경제 흐름을 파악하는 데 중요하다. 비록 좌표정보는 제공되지 않지만, 행정동 단위 데이터와 결합할 경우 공간별 소득격차 분석도 가능하다. 또한 해당 자료는 공식 통계 생산 절차에 따라 갱신되며, 지역의 사회경제적 수준을 대표하는 기초 데이터로 기능한다.
