summary_user: 「해외진출기업의 국내복귀 지원에 관한 법률」에 따라 선정된 국내복귀기업(리쇼어링 기업)을 기업 한 건씩 담은 파일로, 업종·기업규모·선정연도·국내 복귀지역(광역·기초)을 기록하며 기업명은 비식별 처리했다. 정책 분석가나 지자체 담당자가 '어느 시군구에 어떤 업종의 복귀기업이 몇 해에 선정됐나'를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 지역 통계와는 복귀지역의 시도·시군구 이름을 맞춰서만 이어 쓴다.
description_portal: ㅇ 「해외진출기업의 국내복귀 지원에 관한 법률」에 근거하여 선정하는 국내복귀 기업(리쇼어링 기업) 현황 자료입니다. - 선정 기본요건은 해외사업장의 구조조정(청산, 양도, 축소 / 예외적 유지)과 국내 신증설 투자계획이 있어야 합니다.ㅇ 이 자료에는 업종, 기업규모, 국내 투자 지역(광역, 기초) 정보를 포함하고 있으며, 자료에서 확인되지 않는 지역은 해당 지역에 선정된 국내복귀기업이 없음을 의미합니다.ㅇ 국내복귀기업명은 기업의 내부경영방침 사유 등에 의한 비공개 요청으로 비식별 처리하였음을 양해 바랍니다.
