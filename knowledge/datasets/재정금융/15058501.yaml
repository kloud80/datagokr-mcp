description_portal: 본 데이터는 기획재정부에서 공개한 부담금 운용현황 정보를 바탕으로, 국가재정의 세입·세출 결산현황과 연계된 부담금 운용 실적을 연도별, 회계별로 제공하고 있습니다. 주요 항목으로는 부담금 징수액, 사용현황, 잔액 등의 내역이 포함되어 있으며, 각 부담금의 법적 근거와 활용 목적에 따라 분류되어 집계됩니다. 또한 조세수입 및 조세부담율, 추경편성추이 등 다른 재정지표와 함께 분석 가능하도록 구성되어 있어, 정책 수립 및 예산 운용의 투명성과 효율성을 제고하는 데 기여합니다. 본 데이터는 열린재정 포털을 통해 이용 가능하며, 예산편성과 결산 등 재정정보의 통합적 이해를 위한 참고자료로 활용될 수 있습니다.
