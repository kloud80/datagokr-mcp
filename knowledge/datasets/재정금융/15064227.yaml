description_portal: 이 데이터는 한국무역보험공사가 관리하는 CIRR(상업참고금리, Commercial Interest Reference Rate)의 통화별 금리 이력을 기록한 자료입니다. 각 레코드는 기준일자, 통화코드, 해당 통화에 대한 금리 정보를 포함하고 있어 특정 시점의 통화별 기준금리를 파악할 수 있습니다. 예를 들어 USD(미국 달러화), CHF(스위스 프랑), CAD(캐나다 달러) 등에 대해 2019년 12월 15일 기준으로 각각 다른 금리가 적용되어 있음을 보여준다. 이 데이터는 정책금리 동향 분석, 금융상품 금리 산정, 국제 금융비용 비교 등에 활용될 수 있으며, 수출금융 및 해외투자 관련 의사결정에도 참고자료로 유용하다. 또한 시계열 데이터로서 기간별 금리 변동성을 분석하는 데 활용할 수 있습니다.
