summary_user: 관세청이 보세판매장(면세점)으로 특허를 받은 업체의 업체명·주소·연락처를 업체 한 곳당 한 행으로 담은 전국 목록 파일입니다. 여행자나 사업자가 어느 지역에 어떤 면세점 특허 업체가 있는지, 그 위치와 연락처가 무엇인지 확인할 때 씁니다. 사업자번호 같은 전역 조인 키가 없어서 다른 데이터와는 업체명·주소를 맞춰 보는 방식으로만 이어 씁니다.
description_portal: 보세판매장으로 등록된 업체명, 주소 등 업체 정보입니다. 다만, 외국인관광객 보세판매장과 보세판매장의 영업개시일은 관세청에서 보유·관리하고 있지 않아 데이터가 존재하지 않음을 알려드립니다.참고로 보세판매장 및 보세판매장 특허와 관련하여,관세법  제196조에 따라 ① 보세판매장에서는 다음 각 호의 어느 하나에 해당하는 조건으로 물품을 판매할 수 있다. 1. 해당 물품을 외국으로 반출할 것. 다만, 외국으로 반출하지 아니하더라도 대통령령으로 정하는 바에 따라 외국에서 국내로 입국하는 자에게 물품을 인도하는 경우에는 해당 물품을 판매할 수 있다.2. 관세법 제88조제1항제1호부터 제4호까지의 규정에 따라 관세의 면제를 받을 수 있는 자가 해당 물품을 사용할 것② 제1항에도 불구하고 공항 및 항만 등의 입국경로에 설치된 보세판매장에서는 외국에서 국내로 입국하는 자에게 물품을 판매할 수 있다.관세법 제176조의2(특허보세구역의 특례)에 따라 ① 세관장은 제196조제1항에 따라 물품을 판매하는 보세판매장 특허를 부여하는 경우에 다음 각 호의 기업으로서 매출액, 자산총액 및 지분 소유나 출자 관계 등이 대통령령으로 정하는 기준에 맞는 기업 중 제174조제3항에 따른 특허를 받을 수 있는 요건을 갖춘 자(이하 이 조에서 "중소기업등"이라 한다)에게 대통령령으로 정하는 일정 비율 이상의 특허를 부여하여야 하고,「독점규제 및 공정거래에 관한 법률」제31조제1항에 따른 상호출자제한기업집단에 속한 기업에 대해 대통령령으로 정하는 일정 비율 이상의 특허를 부여할 수 없다. 다만, 세관장은 제196조제2항에 따라 물품을 판매하는 보세판매장의 경우에는 중소기업등에게만 특허를 부여할 수 있다. 1. 「중소기업기본법」 제2조에 따른 중소기업2. 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업 ② 제1항에도 불구하고 기존 특허가 만료되었으나 제3항에 따른 신규 특허의 신청이 없는 등 대통령령으로 정하는 경우에는 제1항을 적용하지 아니한다.③ 보
