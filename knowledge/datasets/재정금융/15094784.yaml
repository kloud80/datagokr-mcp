summary_user: 한국거래소 채권시장(국채전문유통·일반채권·소액채권)의 종목별 일별 시세를 담은 원천 데이터로, 시가·고가·저가·종가, 각 수익률, 거래량·거래대금을 기준일자별로 제공한다. 채권 투자자나 분석가가 특정 채권의 최근 종가와 수익률이 어떻게 움직였는지 확인하는 데 쓴다. 단축코드(srtnCd)와 ISIN(isinCd)이 종목코드(stock_cd) 조인 키라서, 같은 종목코드 체계를 쓰는 연기금 보유·기업 공시 데이터와 이어 쓴다.
description_portal: '채권시세정보는 한국거래소에서 제공하는 채권시장별 시세입니다. 국채전문유통시장, 일반채권시장, 소액채권시장 등 다양한 채권시장에서 거래되는 채권의 시가, 고가, 저가, 종가, 거래량, 수익률 등의 정보를 종합적으로 확인할 수 있습니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 채권시세 : 한국거래소에서 제공하는 채권시세 정보국채전문유통시장, 일반채권시장, 소액채권시장의 시세 정보를 채권시세에 대한 오퍼레이션을 통합적으로 제공한다.'
