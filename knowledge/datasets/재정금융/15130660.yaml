description_portal: HS부호란 모든 상품에 고유번호를 부여하는 국제적 상품분류체계로, 2단위, 4단위, 6단위로 분류체계를 가지고 있으며 우리나라는 10단위까지 분류하고 있습니다.그 중 관세청이 관리하고 있는 HS부호 단위(2단위, 4단위, 6단위(5단위포함),8단위(7,9단위 포함),10단위) 체계별 품목 한글명과 영문명에 관한 데이터입니다.HS부호(품목번호)를 분류하는 것을 품목분류라고 하며, 수입하거나 수출할 때 물품에 적합한 품목번호를 찾아 세관에 신고하는데, 이 때 적용한 품목번호(품목분류)는 자유무역협정(FTA)에서 각 협정국 사이에 원산지 판정기준, 복잡한 특혜관세 등을 결정하는 핵심 요소로 작용하고 있습니다.
