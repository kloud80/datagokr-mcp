description_portal: 이 데이터는 기술의 상용화 과정에서 발생하는 기술거래의 유형별 현황을 정리한 공공데이터입니다. 기술이 실제 산업 현장에 적용되기까지 다양한 형태의 거래가 이루어지며, 이 자료는 그 중 대표적인 거래 방식인 매매, 라이선스, 공동연구, 기술제휴, 기타로 구분하여 월별 건수를 집계한 것입니다. 기술거래는 기술을 이전하거나 활용하기 위한 계약적 행위를 포함하며, 해당 데이터는 거래 유형별 발생 빈도를 파악하는 데 도움을 줄 수 있습니다.**‘기준년월’**은 거래 건수가 집계된 시점을 나타냅니다.**‘매매’**는 기술 소유권을 완전히 양도하는 거래로, 대부분의 기간에서 가장 높은 건수를 기록하고 있습니다.**‘라이선스’**는 기술의 사용권을 일정 조건 하에 부여하는 방식으로, 매매 다음으로 높은 빈도를 보입니다.**‘공동연구’**와 **‘기술제휴’**는 각각 공동 기술개발과 기술 협력을 의미하며, 전체 거래 중 비중은 낮지만 일부 기간에 선택적으로 나타납니다.**‘기타’**는 위 항목에 포함되지 않는 기타 거래 유형을 의미합니다.이 데이터는 월별로 어떤 기술거래가 활발히 이루어졌는지를 파악하는 데 유용하며, 거래 유형별 동향이나 특정 시점의 특이값을 탐색하는 기초 통계자료로 활용할 수 있으며, 정책 수립이나 기술이전 촉진 사업 기획 시 참고자료로 활용될 수 있습니다.
