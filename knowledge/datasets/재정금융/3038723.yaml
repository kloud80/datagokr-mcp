summary_user: 불공정무역행위 조사 및 산업피해규제에 관한 법률에 따라 부과된 덤핑방지관세를 국가·품목 건별로 정리한 목록 파일로, 관세부과범위·부과시작일·부과종료일·관련법령을 담는다(전국 범위, CSV 약 13.5KB). 수입업자나 무역 분석가가 "특정 국가산 품목에 지금 덤핑방지관세가 걸려 있는지, 언제까지인지"를 확인하는 데 쓴다. 전역 조인 키가 없어 관세청 수출입 실적 등 다른 무역 데이터와는 국가명·품목명을 이름 매핑해 이어 써야 한다.
description_portal: 불공정무역행위 조사 및 산업피해규제에 관한 법률에 따라 부과된 덤핑관세에 대한 자료로 국가별, 품목별 관세부과 범위 등을 포함하고 있습니다.구체적인 구성요소로는 국가명, 품목, 관세부과범위, 부과시작일, 부과종료일, 관련법령의 내용을 포함하고 있으며,무역구제 덤핑방지관세(Trade Remedy Anti-Dumping Duty)를 부과한 현황을 분류하여 설명하고 있는 데이터입니다.보다 자세한 통계는 무역위원회 홈페이지(https://www.ktc.go.kr)에서 확인하시기 바랍니다.
