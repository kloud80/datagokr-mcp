description_portal: '금융통계금융지주회사정보는 기준년월 및 회사명을 기준으로 금융지주회사의 주요 현황과 재무지표, 경영성과 등을 제공하는 데이터입니다. 그룹별 일반현황, 재무구조, 경영지표 등을 시계열로 분석할 수 있도록 제공합니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 금융지주회사 일반현황 조회 : 설립연도, 본점소재지, 자회사 현황 등 일반정보를 제공합니다.② 금융지주회사 재무현황 조회 : 자산, 부채, 자본 등 재무구조 관련 통계를 조회할 수 있습니다.③ 금융지주회사 주요경영지표 조회 : ROA, ROE, 순이익률 등 지주사의 주요 경영성과 지표를 제공합니다.'
