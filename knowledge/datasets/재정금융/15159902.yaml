description_portal: '경상북도 김천시의 2024년 귀속 자동차세 연납 납부 현황을 차종별(규모 구분)로 정리한 통계 정보입니다. 정기분 자동차세가 아닌 연납 자동차세(1월 3월, 6월, 9월 신고납부)에 대한 내용입니다.  ( 단위: 천원) 데이터는 김천시 관내에서 운행되는 자동차의 분류에 따라 세액, 부과 건수, 그리고 공제액 정보를 포함하고 있습니다.  상세 항목으로는 시도명(경상북도), 시군구명(김천시), 납부 연도(2024), 차량의 용도별 분류(승용자동차, 기타승용자동차, 승합자동차, 화물자동차, 특수자동차, 3륜 이하 소형 등), 해당 분류별 총 세액, 부과 건수, 공제액 등이 기록되어 있습니다.'
