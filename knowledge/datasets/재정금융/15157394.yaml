description_portal: '본 데이터는 전주시 주민이 1년 동안 평균적으로 부담하는 지방세 금액을 보여주는 자료입니다. 과세년도 기준(2020년~2024년)으로 시도명, 시군구명, 자치단체코드 등 행정구역 정보와 함께 주민 1인당 지방세 부담금액과 세대당 부담금액을 제공합니다. 또한 지방세 총액, 인구수, 세대수 정보를 포함하고 있어 전주시의 지방세 부담 수준과 재정자립도 현황을 쉽게 이해하고 지역별로 비교·분석하는 데 활용할 수 있습니다. (전주시, 지방세, 주민 1인당 부담금액, 세대당 부담금액, 과세년도, 행정구역, 재정자립도, 세부담 수준, 인구수, 세대수, 공공데이터)제공부서 : 세정과(063-281-2282)'
