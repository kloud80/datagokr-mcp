summary_user: 신용보증기금이 기업 신용조사 때 작성한 조사서를 건별로 담은 파일로, 조사서별 조사기준일·신규/증액 여부·최종 업종코드와 그 차수·개인/법인 구분·주사업장 지역을 전국 범위로 제공한다. 정책 분석가가 "어느 업종·지역에서 신규 보증 신용조사가 늘고 있나" 같은 질문에 업종별·지역별 신용조사 건수 추이를 볼 때 쓴다. 최종업종코드(classification_code)를 한국표준산업분류(KSIC) 업종표와 이어 업종명을 붙이고, 조사서ID(kodit_survey_id)는 같은 기관의 다른 조사서·원장 자료와 맞춰 볼 때 키로 쓴다.
description_portal: 본 데이터는 신용보증기금이 기업 신용조사 시 작성하는 조사서에 기반한 정보를 제공합니다. 주요 항목으로는 조사서ID, 조사기준일, 신규·증액 여부, 최종업종코드 및 차수, 개인·법인 구분, 주사업장 소재지, 지역구분 등이 포함됩니다. 업종코드는 통계청의 한국표준산업분류(KSIC)를 기준으로 하며, 기업의 산업분류 및 지역별 분포를 파악할 수 있습니다. 해당 자료는 신용조사 건수 추이 분석, 업종별 신용지원 현황 파악, 지역별 보증 수요 예측 등의 정책 수립에 활용될 수 있으며, 중소기업 금융지원의 기초 데이터로서 가치가 높습니다.
