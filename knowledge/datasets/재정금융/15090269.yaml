description_portal: 본 자료는 2021년 상반기 동안 집계된 대전 지역 대표 지역 화폐인 온통 대전의 월 별 충전액과 사용액 등 구체적 내용을 포함하고 있습니다. 해당 자료는 지역 화폐 발행량의 증감 과 소비 패턴, 그리고 주요 업종에서의 실제 이용 실적 등 지역 내 경제 흐름을 다각적으로 파악할 수 있도록 정보를 제공합니다. 이를 바탕으로 지역 소상공인 지원 정책 수립, 예산 배분의 우선순위 결정, 업종별 지역 경제 활성화 전략 마련 등에 폭넓게 활용하실 수 있으며, 지역 화폐의 발행과 집행 상황, 그리고 실제 사용 실태 등을 다양한 관점에서 비교하거나 변화 추이를 분석할 수 있습니다. 지역 주민들의 소비 행태 및 업종 간 상호 연계, 미래 경제정책 수립, 지역사회의 안정적 경제 기반 마련 등에도 귀중한 참고자료가 될 수 있습니다.
