description_portal: 이 데이터는 기술보증기금이 운영하는 탄소가치평가보증 제도의 실행 내역을 월별로 집계한 자료로, 보증 실행일자, 자금용도, 기업 형태, 창업 여부, 소재지, 보증금액 등 기본적인 지원 정보를 포함하고 있습니다.특정 기간 동안의 보증 흐름을 시간 순으로 정렬하여 지원 대상 기업의 유형별 분포와 자금 활용 목적, 지역별 실행 특성 등을 파악할 수 있도록 구성되어 있으며, 동일 제도에 대한 다양한 기간별 비교나 기초 통계 분석에 유용한 기초 정보를 제공합니다.해당 데이터는 세부 기술정보나 업종 분류보다는, 보증 제도 운영의 전체적인 실적 규모와 일반적 경향을 보여주는 정량 중심의 자료로 활용될 수 있습니다.
