description_portal: 본 데이터는 한국무역보험공사가 보유하고 있는 대한민국 광역자치단체별 연도별·종목별 무역보험 인수실적 데이터입니다. 2000년부터 2025년까지 전국 17개 시·도 및 주요 광역자치단체의 수출 지원 성과를 담고 있습니다. 데이터는 단기·중장기 수출보험, 신용보증, 환변동 보험 등 4개 핵심 종목의 연간 인수 금액(억원)을 제공합니다. 이를 통해 우리 지역 기업들의 무역금융 활용 현황과 연도별 수출 활성화 추이를 직관적으로 비교·분석할 수 있어, 지역별 수출 경쟁력 연구 및 비즈니스 분석에 유용하게 활용될 수 있습니다. 각 광역자치단체는 국내기업의 소재지를 기준으로 분류되었습니다.
