description_portal: '2025년 기준으로 작성된 회계간 거래 자료입니다.*일반회계-특별회계 거래, 특별회계-일반회계 거래, 특별회계-특별회계 거래 등의 내용을 포함하고 있습니다.일반회계, 특별회계, 기금의 데이터를 포함합니다.•‌일반회계: 국세 등을 세입으로 하여 국가의 일반적 재정사업에 사용•‌특별회계: 목적세, 일반회계 전입금 등을 세입으로 하여 특정 목적사업에 사용•‌기금: 부담금, 기여금 등을 수입으로 하여 특정 목적사업에 사용- 기금은 예산과 달리 여유자금을 운용함에 따라 자산운용위원회의 설치 및 관련 지침 제정을 의무화이 자료는 2025회계기금 운용구조의 자료로서 공통적인 일러두기 사항은 아래와 같습니다.1. 본 자료집에 수록된 자료는 2023년도까지는 결산, 2024년도, 2025년도는 본예산 기준으로 작성하였습니다.가. 결산자료는 세입·세출외를 포함하지 않습니다.2. 본 자료집에 수록된 자료는 총계·총수입·총지출 기준으로 작성하였으며, 작성 기준이 다를 경우 그 기준을 별도 표시하였습니다.3. 본 자료집에 수록된 자료는 디지털예산회계시스템(dBrain+)에 기록되어 있는 예·결산 자료를바탕으로 작성하였습니다.4. 본 자료집에 수록된 자료는 소수점 이하 첫째 자리에서 반올림되었으므로, 세부 항목의 소계가합계와 일치하지 않을 수도 있습니다.'
