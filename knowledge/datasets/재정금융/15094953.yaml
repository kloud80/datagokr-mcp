description_portal: '○ 통계개요* 통계명 : 시민담세 및 조세부담율* 통계종류 : 서울시 담세 및 조세부담 규모를 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 : 「국세기본법」및「지방세법」등에 의거하여 운용되는 조세 현황* 작성목적 : 정부 및 지방정부의 조세운용에 대한 현황을 파악하고 이를 분석하여조세관련 정책을 기획ㆍ수립ㆍ집행하기 위한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 자치구 → 서울특별시 스마트도시담당관, 국세청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 거주인구에 대한 지방세 및 국세징수액ㆍ부담액, 지역내총생산에 대한 조세부담율○ 용어설명* 시민담세 : 지방세 및 국세 총액을 시민수로 나눈 1인당 부담액* 조세부담율 : 국민들이 소득 중에서 얼마만큼을 세금으로 부담하느냐를 나타내주는 지표지역내총생산에 대한 조세총액의 비율○ 기 타* 인구 및 세대수에 외국인인구 및 외국인세대 제외* 조세부담률=조세(국세+지방세)/당해년 지역내총생산(GRDP)*100○ 출 처 : 서울특별시 스마트도시담당관, 국세청'
