description_portal: '채권권리일정정보는 채권 보유자가 채권과 관련된 권리를 행사할 수 있는 상장 채권에 대한 권리행사 일정 정보를 제공하는 데이터입니다.기준일자, 법인등록번호, 채권발행인명을 기준으로 채권 이자 지급일, 만기일, 채권발행금액, 권리 기준일 등의 정보를 종목별로 조회할 수 있습니다.이 데이터는 단일 오퍼레이션으로 구성되어 있습니다.오퍼레이션의 세부 내용은 다음과 같습니다.① 채권권리행사일정조회 : 기준일자, 법인등록번호, 채권발행인명을 통하여 채권발행일자, 채권만기일자, 채권발행금액을 조회하는 채권권리행사일정조회 기능※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
