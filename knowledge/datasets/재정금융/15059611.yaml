status: active
summary_user: 상장 채권의 권리행사 일정을 기준일자·종목(국제채권식별번호)별로 담은 건별 데이터로, 발행인명, 발행일·만기일(상환 시 상환일), 최초발행금액, 금리 구분(고정·변동), 이자 유형(이표채·할인채) 같은 정보를 함께 제공한다. 채권 투자자나 분석가가 특정 회사가 발행한 채권이 언제 만기되고 이자 유형이 무엇인지 확인할 때 쓴다. 법인등록번호(crno)로 기업 공시·기업정보와, 국제채권식별번호(isinCd)로 채권 시세·발행 정보 등 다른 증권 시장 데이터와 연결한다.
