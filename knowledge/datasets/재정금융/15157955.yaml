description_portal: '광주광역시 남구 마을세무사 현황 및 정보(세무사명, 관할동, 전화번호 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 세무1과(☎062-607-3111)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 광주광역시 남구 마을세무사 제도는 지방세와 국세에 대한 법률지식이 부족하거나 경제적인 이유 등으로 세무전문가의 상담을 받기 어려운 시민, 영세사업자, 전통시장 상인들에게 우리 지역 세무사들의 재능기부를 통해 무료 세무 서비스를 제공하는 제도입니다. 상담을 원하는 주민은 거주지 동 주민센터에 비치된 마을세무사 연락처를 확인하여 주시기 바랍니다. 1차 상담 : 마을세무사의 전화, 팩스, 이메일 이용 2차 상담 : 1차 상담 부족시 마을세무사의 사무실 직접 방문 상담 상담 내용 : 지방세와 국세해당 정보는 광주광역시 남구청 홈페지이를 통해서도 확인 가능합니다. 링크 : https://www.namgu.gwangju.kr/menu.es?mid=a10205090000'
