description_portal: 서울시 시민참여예산 제안사업 신청 관리는 시민이 예산 사업을 제안할 때 입력한 기본 정보를 관리하는 데이터입니다. 회계년도와 제안번호는 제안을 식별하는 값이며, 사업이름과 사업위치 구·상세는 어디에서 어떤 사업을 하려는지 나타냅니다. 시구비예산과 자비예산은 행정기관 부담과 시민 자부담 규모를 보여주는 재정 정보입니다. 사업시작일과 종료일은 추진 기간을, 참여구분과 참여분야는 제안 유형과 정책 분야를 구분합니다. 제안취지, 사업내용, 사업효과는 필요성, 추진 내용, 기대 효과를 설명하는 핵심 서술 정보입니다. 게시물번호와 접수번호는 온라인 게시와 행정 접수를 연결하는 식별값이며, 위치도·현장사진·기타파일 ID는 제안 현장을 보완하는 첨부자료 정보입니다. 작성일·작성시간은 접수 시점을, 조회수는 관심도를 보여줍니다. 비밀번호는 온라인 신청 수정·취소 시 본인 확인용이며, 신청 취소 여부와 사업비분담동의는 제안 철회와 재원 분담에 대한 동의 여부를 기록합니다. 접수구분은 온라인, 우편, 이메일, 팩스 등 신청 경로를 구분하는 항목입니다.
