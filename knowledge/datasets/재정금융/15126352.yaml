status: active
summary_user: 한국자산관리공사에 징수가 위탁된 체납국세의 납부 건별 징수현황을 담으며, 수임의뢰번호·귀속연도·국고세목명·과세기간연월·납부일자·납부기한일자와 징수금액구간별 수수료율 내역을 함께 기록한다. 체납국세 위탁징수가 세목·귀속연도별로 언제 얼마나 납부되었는지, 건별로 어떤 수수료율이 적용되었는지를 확인하려는 재정 분석가나 관련 실무자가 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 찾지 못했다. 위임기관번호나 국고세목명 같은 이름·코드 매핑으로만 다른 국세·공매 데이터와 이어 붙일 수 있다.
limits: 전역 조인 키가 없어 체납자 개인이나 공매 물건, 토지·건물 원장과 바로 연결할 수 없다. 범위는 전국이지만 공간 정보가 없는 비공간 데이터이다. 서비스키 기반이며 개발계정은 하루 10,000회까지 호출할 수 있다.
