description_portal: 국세징수법 제11조(체납액 징수 관련 사실행위의 위탁)에 따라 한국자산관리공사에 위탁되는 체납국세의 징수현황을 조회할 수 있는 서비스 입니다. 체납국세 징수 위탁 수수료는 국세징수법 시행령 제6조(위탁 수수료)에서 규정하는 수수료율에 따라 건별 징수금액구간별로 발생하며, 본 서비스에서는 납부일련번호, 기준일자, 수임의뢰번호, 귀속연도, 계산일련번호, 수수료율내역내용, 수수료 발생일자, 납부일자, 납부기한일자, 위임기관번호, 의뢰일자, 국고세목명, 과세기간연월, 발행번호 정보 등을 조회하실 수 있습니다.
