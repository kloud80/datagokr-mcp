description_portal: '국세환급금 ARS 간편조회 서비스란?고령자·디지털 서비스에 익숙하지 않은 납세자를 위해 언제 어디서나 지역번호 없이 1544-9944로 전화하여 미수령 환급금을 간편하게 조회할 수 있는 서비스입니다. 개인납세자는 누구나 이용 가능합니다.국세환급금 ARS 간편조회 서비스 이용방법은? ① ARS전화: 1544-9944 → 음성·보이는ARS선택 → 국세고지환급 선택 ② 본인인증: 주민등록번호 입력 → 본인인증(통신사 휴대폰 또는 ARS 비밀번호 인증) ③ 환급금 조회: 국세환급 선택 → 미수령 환급금 합계 조회 → 미수령 환급금 내역 조회-해당연도 17개 지역별, 환급사유별 환급결정 현황.1)세법에 의한 환급(공제초과 등)과 납세자 착오납부 등에 의한 환급으로 구분 중간예납 등 각종 세법에 의하여 공제금액이 납부세액을 초과하여 발생하는 환급.'
