description_portal: 본 데이터파일은 인천광역시 계양구의 지방세 부과 내역 중에서 비과세금액 및 감면금액이 전체 부과금액에서 차지하는 비율을 나타낸 자료입니다. 주요 항목으로는 각 항목별 비과세금액, 감면금액, 부과금액, 그리고 이를 기준으로 산정한 비과세·감면율이 포함되어 있으며, 이를 통해 지방세 수입 중 실질적으로 과세되지 않은 금액의 비중을 확인할 수 있습니다. 본 자료는 지방세 정책의 형평성 및 재정 건전성 평가, 감면제도의 효과 분석, 세수 확보 방안 마련 등에 활용될 수 있습니다. 관련 데이터에 대한 구체적인 문의는 인천광역시 계양구 세무1과(032-450-5223)로 연락하시기 바랍니다.
