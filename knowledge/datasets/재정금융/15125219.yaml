summary_user: 운영대행사들이 보내온 지류 지역사랑상품권 환전지점을 지점 단위로 담는 API로, 지점명·주소·전화번호·상품권명·환전여부·좌표를 싣고 전국 범위에 전체 100건이다. 지류 상품권을 가진 시민이 가까운 환전지점이 어디인지, 해당 상품권을 환전할 수 있는지 찾는 질문에 쓴다. 지점주소(brnch_addr, brnch_daddr)와 위도 좌표(lat)를 키로 가맹점·상권 데이터와 잇고, 8자리 읍면동코드(emd_cd)와 5자리 사용처지역코드는 행정안전부 법정동코드 앞자리와 맞춰 지역 단위로 묶는다.
description_portal: '지역사랑상품권 운영대행사들로부터 수집한 지류 상품권 환전지점에 대한 지점명, 주소, 대표전화번호, 상품권명, 판매여부, 읍면동코드 등을 제공한다.아래는 데이터 사용시 참고바랍니다:1) 제공기관코드:코나아이: I0000001한국간편결제진흥원: I0000002신한카드: I0000003한국조폐공사: I0000004KT: I0000005농협은행: I0000006광주은행: I0000007대구은행: I0000008ITS&G: I0000009NICE 정보통신: I0000010KIS 정보통신: I0000011인조이웍스: I0000012부산은행: I0000014비즈플레이:I00000152) 사용처지역코드(5자리):- 행정안전부에서 제공하는 법정동코드(지역코드 10자리) 중, 앞 5자리(시도코드 2자리 + 시군구코드 3자리)를 사용하고 있습니다.- 코드 정보는 참고문서를 확인바랍니다.3) 읍면동코드(8자리):- 행정안전부에서 제공하는 법정동코드(지역코드 10자리)의 앞 8자리(시도 코드 2자리 + 시군구 코드 3자리 + 읍면동 코드 3자리)를 사용하고 있습니다.- 법정동코드는 행정안전부_행정표준코드_법정동코드 API(https://www.data.go.kr/data/15077871/openapi.do)를 활용하여 조회할 수 있습니다.'
team:
  dept: 지급결제운영부
services:
  - op: /exchangeV2
    name: 환전여부_지점정보
    endpoint: https://apis.data.go.kr/B190001/paperExchange/v2/exchangeV2
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: page
        required: true
        example: '1'
        desc: 페이지번호
      - name: perPage
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: cond[brnch_id::EQ]
        required: false
        example: '20231120339'
        desc: 검색값과 지점구분ID가 일치하는 데이터를 검색
      - name: cond[brnch_nm::EQ]
        required: false
        example: NH농협은행 평택시지부
        desc: 검색값과 지점명이 일치하는 데이터를 검색
      - name: cond[gt_nm::EQ]
        required: false
        example: 경기평택사랑상품권
        desc: 검색값과 상품권명이 일치하는 데이터를 검색
      - name: cond[emd_cd::EQ]
        required: false
        example: '41220114'
        desc: 검색값과 읍면동코드가 일치하는 데이터를 검색
      - name: cond[pvsn_inst_cd::EQ]
        required: false
        example: I0000004
        desc: 검색값과 제공기관코드가 일치하는 데이터를 검색
      - name: cond[crtr_ymd::EQ]
        required: false
        example: '20231120'
        desc: 검색값과 기준일자가 일치하는 데이터를 검색
      - name: returnType
        required: false
        example: JSON
        desc: "응답 데이터포맷 설정(JSON 또는 XML, default: 'JSON')"
      - name: cond[usage_rgn_cd::EQ]
        required: false
        example: '11680'
        desc: 사용처지역코드(법정동코드중 앞5자리)
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
