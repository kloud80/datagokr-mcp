description_portal: 중앙행정기관의 결산 기준에 따라 집계된 세입 및 세출 현황과 이불용액 정보를 포함한 자료입니다. 이 데이터는 열린재정 포털을 통해 제공되며, 소관별 분류를 기준으로 연도별 세입·세출 결산 내역을 확인할 수 있습니다. 세입은 국가로 들어오는 수입 항목별 현황을, 세출은 예산의 집행 내역과 실제 사용 금액을 기준으로 구성되어 있습니다. 또한 이불용액은 편성된 예산 중 집행되지 않은 금액을 명확히 파악할 수 있어, 예산 집행의 효율성과 투명성 확보에 기여합니다. 해당 데이터는 국가 재정 운영의 건전성을 평가하고 예산관리 체계를 개선하는 데 중요한 기초자료로 활용됩니다.
