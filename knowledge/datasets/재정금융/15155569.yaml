summary_user: 바이코리아에 국내 수출기업이 등록한 상품을 건별로 담은 파일로, HS코드(수출품목코드)와 한글 HS코드명, 영문 상품명, 상품 개요·키워드, 할랄 등록 여부를 담는다. 해외 바이어나 수출 지원 분석가가 "특정 HS코드 품목으로 바이코리아에 등록된 한국 상품은 무엇이고 할랄 등록 상품은 얼마나 되나"를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았으며, HS코드 값을 이름·코드 매핑해 관세청 품목별 수출입 실적 등과 이어 볼 수 있다.
description_portal: 바이코리아 수출상품정보는 국내 우수 수출기업이 등록한 다양한 제품의 핵심 정보를 체계적으로 제공하는 서비스입니다. 제품의 세부 사양, 기술 특징, 인증 현황, 가격 조건, 공급 능력 등을 한눈에 확인할 수 있으며, 해외 바이어는 관심 상품을 직접 조회하고 기업과 바로 상담(Inquiry)을 진행할 수 있습니다. 또한 카테고리별 검색과 추천 기능을 통해 바이어가 필요한 제품을 쉽고 빠르게 찾을 수 있어 글로벌 비즈니스 매칭에 최적화된 플랫폼 역할을 합니다. HS코드 기반으로 상품검색도 가능합니다.
