summary_user: 금융투자협회의 펀드표준코드 기준으로 금융투자회사가 운용하는 펀드의 명칭·코드 등 기본정보를 펀드 단위로 담는 API로, 전체 183,724건이고 기간은 1996-09-24~2026-10-02, 범위는 전국이다. 분석가나 투자자가 특정 펀드의 이름과 표준코드, 설정일, 유형을 확인하고 상품끼리 비교하는 질문에 쓴다. 단축코드(srtnCd)가 조인 키(stock_cd)로 확인되어 같은 키를 쓰는 다른 증권·상품 데이터와 이어 쓰고, 나머지 필드는 명세상 의미가 비어 있어 키 외 연결 근거는 없다.
description_portal: '펀드상품기본정보는 금융투자협회에서 제공하는 펀드표준코드 정보로 금융투자회사가 운용하는 펀드의 명칭, 코드 등에 대한 기본정보를 제공하는 데이터입니다. 이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 펀드상품기본정보 조회 : 금융투자협회에서 제공하는 펀드표준코드 정보 금융투자회사가 운용하는 펀드의 명칭, 코드 등에 대한 기본정보 제공※ 펀드란(fund)? : 일반 투자자로부터 증권투자에 운용할 목적으로 자금 등을 납입 받은 위탁자가 그 자금 등을 수탁자로 하여금 당해 위탁자의 운용지시에 따라 특정 유가증권에 투자/운용하고, 그에 따른 수익권을 분할하여 당해 투자자에게 취득 시키는것※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
