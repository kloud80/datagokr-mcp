description_portal: ‘서민금융진흥원 대출상품한눈에 정보 서비스’는 다양한 서민대출상품의 핵심 정보를 한눈에 비교하고 조회할 수 있도록 제공하는 공공데이터 API입니다.이 서비스는 금융상품명, 대출한도, 금리구분, 대출 용도, 총 대출기간, 취급기관 등 주요 항목별 정보를 포함하고 있어, 사용자가 자신의 필요에 맞는 서민대출상품을 쉽게 탐색하고 비교할 수 있도록 돕습니다. 특히 정부기관, 정책금융기관, 지방자치단체 등 다양한 기관에서 제공하는 금융상품을 자금용도, 지원대상 등 수요자가 원하는 기준에 따라 검색할 수 있는 기능을 갖추고 있어, 보다 맞춤형으로 정보를 활용할 수 있습니다. 이 서비스는 연 1회 업데이트 됩니다.
