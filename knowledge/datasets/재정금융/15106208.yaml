summary_user: 정부기관·정책금융기관·지방자치단체가 취급하는 서민대출상품을 상품 단위로 담은 비교용 원장으로, 상품명·대출한도·금리구분·대출 용도·총 대출기간·취급기관 같은 핵심 항목을 전국 범위로 제공한다. 자금이 필요한 국민이나 상담·비교 서비스 사업자가 '내 자금 용도와 지원 대상 조건에 맞는 정책 서민대출은 무엇이고 한도·기간은 어떤가'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 금융상품 데이터와는 상품명·취급기관명 같은 이름 매핑으로만 연결한다.
