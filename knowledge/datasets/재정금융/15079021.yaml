description_portal: 본 자료는 「지방세법」 및 「지방세징수법」에 근거하여 산출된 주민 1인당 또는 세대당 부담된 지방세액에 관한 정보이다. 해당 자료는 시·군·구 등 기초지방자치단체가 관할하는 지방세 부과·징수 결과를 기반으로 작성되며, 지역 주민이 실제로 부담한 지방세 수준을 객관적으로 파악할 수 있도록 제공된다.본 데이터는 표준지방세시스템을 통해 관리·제공되는 파일데이터로, 지자체별 세수 구조, 주민 부담 수준, 지역 간 조세 형평성 분석 등에 활용될 수 있다. 특히 주민 1인당 또는 세대당 지방세 부담액은 지방재정 건전성 분석, 재정자립도 평가, 정책 효과 분석을 위한 기초 통계자료로서 행정·연구 분야에서 활용 가치가 높다.자료기준일은 매년 12월 31일로, 해당 연도 말까지 확정된 지방세 부과·징수 실적을 기준으로 집계되며, 연도별 비교 분석을 통해 중장기적인 지방재정 추이 파악이 가능하다.
