summary_user: '국가별 통화명과 통화코드(예: USD, JPY), 통화단위값을 국가 한 줄씩 담은 소규모 기준 코드표 파일(CSV 약 1.7KB)이다. 수출기업이나 무역·금융 시스템 개발자가 거래 상대국의 통화코드와 통화단위를 확인하거나 코드값을 통화명으로 풀 때 쓴다. 통화코드(currency_cd)를 키로 환율·수출입 실적·무역보험 거래 데이터 등 통화코드를 담은 데이터에 붙여 통화명과 단위를 보완하는 데 쓴다.'
description_portal: '국가별 통화명, 통화코드 및 통화단위값에 대한 정보입니다. 이 데이터는 국가별 통화의 코드, 통화명, 기호 등을 포함하고 있어, 무역과 금융 거래에서 통화 관련 정보를 정확히 파악하는 데 유용합니다. 특히, 수출입 거래 시 다양한 국가의 통화 코드가 필요한 상황에서 이 데이터를 통해 각국의 통화를 빠르고 정확하게 확인할 수 있습니다. 또한, 금융 시스템에서의 통화 변환 및 국제 결제 시스템의 원활한 운영을 지원하는 중요한 참고자료로 사용됩니다. 통화코드는  통화값에 대한 이니셜(예. JPY : 일본통화, USD: 미국통화)을 뜻합니다.'
