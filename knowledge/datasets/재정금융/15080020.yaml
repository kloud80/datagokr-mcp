description_portal: 본 데이터는 충청남도 부여군의 재정 현황을 파악할 수 있는 핵심 자료로, 2020년부터 2024년까지의 지방세 비과세 및 감면 현황을 담고 있습니다. 주요 포함 항목으로는 시도명, 시군구명, 자치단체코드와 함께 구체적인 세목명(재산세, 취득세, 자동차세, 주민세, 등록면허세, 지역자원시설세, 지방교육세 등)이 기록되어 있습니다.가장 중요한 지표인 비과세금액과 감면금액이 세목별로 구분되어 있어, 정책적 목적이나 법령에 의해 징수되지 않은 세금의 규모를 명확히 확인할 수 있습니다. 또한, 실제 부과된 금액과 대비하여 산출된 비과세감면율을 통해 부여군의 세원 관리 상태와 재정 지원 규모를 시계열적으로 분석할 수 있는 유용한 자료입니다.다만, 민원인이 요청했던 "2013년부터의 장기 데이터"나 "법령별(지방세법, 감면조례 등) 상세 분류" 및 "건수" 데이터는 본 파일에 포함되어 있지 않으며, 2020년 이후의 세목별 합계 수치 위주로 구성되어 있습니다. 이 자료는 지자체의 세입 감소 원인을 분석하거나 지방세 정책의 실효성을 검토하는 기초 자료로 활용하기에 적합합니다.
