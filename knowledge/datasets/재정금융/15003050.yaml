description_portal: 이 데이터는 신용보증기금의 고용창출 우대보증과 관련된 지원 현황 및 프로그램 구조를 설명하는 자료로, 기업의 고용 성장 단계에 따라 맞춤형으로 구성된 보증제도다. 고용창출 우대보증은 상시근로자 수가 직전연도 대비 10% 이상 증가한 기업을 대상으로 하며, 고용 확대에 기여한 기업에 대해 보증 한도 우대, 보증료 감면 등의 혜택을 제공한다. 지원 프로그램은 성장 단계에 따라 세 가지로 나뉜다. 첫째, 신규창출단계에서는 고용창출 효과가 우수한 기업을 대상으로 고용창출 우대보증과 고용창출 특례보증이 지원된다. 둘째, 창출과 유지단계는 고용 유지 및 확대가 지속적인 기업에 대해 가젤형 기업 우대보증 및 특례보증을 제공한다. 셋째, 질적성숙단계에서는 고용의 질과 안정성이 높은 기업을 대상으로 고용의 질 우수기업 우대보증을 포함한 특례보증이 적용된다. 본 제도는 고용 확대뿐 아니라 고용의 지속성과 질까지 종합적으로 평가하여 기업의 성장 단계에 맞는 보증지원을 제공함으로써, 양질의 일자리 창출과 지속 가능한 고용환경 조성을 유도하는 데 목적이 있다.
