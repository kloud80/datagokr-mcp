summary_user: 예금보험에 가입한 부보금융회사 284곳을 회사 단위로 담은 전국 목록이며, 회사명·업권 구분·주소·연락처·홈페이지·경위도 등 기본 정보를 건별로 제공한다. 내 예금이나 퇴직연금을 맡긴 금융회사가 예금보험 적용 대상인지 확인하려는 국민이나 분석가가 쓴다. 주소(fncIstAdr)가 실측 조인 키라 주소 기반 데이터와 이어 쓰며, 퇴직연금·금융상품 공급자 원장으로서 금융회사 단위 자료와 연결한다.
limits: 주소 외에 금융회사 코드 같은 별도 조인 키는 확인되지 않아 다른 금융회사 데이터와는 주소나 회사명으로 맞춰야 한다. 필드별 명세상 의미와 코드표가 없어 부보 여부(isrgTgtYn) 등의 값 해석은 별도 확인이 필요하다. 포털 활용신청은 자동승인이며 개발계정은 일 10,000회까지 호출할 수 있다.
