description_portal: '조세법 처벌법제7조(체납처분 면탈) ① 납세의무자 또는 납세의무자의 재산을 점유하는 자가 체납처분의 집행을 면탈하거나 면탈하게 할 목적으로 그 재산을 은닉ㆍ탈루하거나 거짓 계약을 하였을 때에는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.   ② 「형사소송법」 제130조제1항에 따른 압수물건의 보관자 또는 「국세징수법」 제49조제1항에 따른 압류물건의 보관자가 그 보관한 물건을 은닉ㆍ탈루하거나 손괴 또는 소비하였을 때에도 제1항과 같다. <개정 2015.12.29, 2020.12.29>   ③ 제1항과 제2항의 사정을 알고도 제1항과 제2항의 행위를 방조하거나 거짓 계약을 승낙한 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.조세범처벌법 제7조의 재산을 은닉, 탈루하거나 거짓계약을 한 납세의무자 또는 납세의무자의 재산을 점유한 자와 면탈세액단위 : 명, 백만원'
