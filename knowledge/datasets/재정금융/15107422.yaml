description_portal: '2013년부터 2022년까지 통일, 외교 분야 재정지출 시계열 자료입니다. *수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*2021년까지 결산기준, 2022년은 2차 추가경정예산 기준으로 작성되었습니다.대외경제협력 지원: 대외경제협력기금(EDCF)을 통해 개도국의 산업발전 및 경제안정을 지원하고 개도국과 긴밀한 경제협력관계 구축국제개발협력: 전략적 개발원조 추진을 통해 국제사회에 기여재외공관운영: 재외공간 운영 인건비, 기본경비 등인도적 문제해결: 인도적 지원 다원화·내실화를 통한 남북간 인도적 문제의 해소'
