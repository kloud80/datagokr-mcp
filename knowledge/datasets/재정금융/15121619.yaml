description_portal: '부산광역시에서 운영하는 통합자금관리시스템은 시 재정과 자금 운용을 보다 효율적이고 체계적으로 관리하기 위해 다양한 데이터를 제공합니다. 그중 시뮬레이션비율관리 데이터는 시와 자치단체가 재정 계획과 자금 운용을 시뮬레이션할 때, 각 항목에 적용할 비율을 관리하고 조정하는 데 중요한 역할을 합니다. 제공되는 데이터 항목은 다음과 같습니다.비고: 해당 데이터와 관련된 추가 설명이나 특이 사항을 기록하여, 데이터 이해를 돕는 보조 정보 역할을 합니다.비율관리등록코드: 각 비율 관리 항목을 고유하게 식별하는 코드로, 시스템 내에서 등록 및 조회 시 기준이 됩니다.업무구분코드: 해당 비율 관리가 속한 업무 영역을 구분하는 코드로, 재정, 회계, 자금 운용 등 다양한 업무 단위별로 데이터를 분류하고 활용할 수 있습니다.자료명: 관리되는 비율과 관련된 자료의 명칭으로, 각 항목이 어떤 데이터를 기준으로 산정되었는지를 직관적으로 확인할 수 있습니다.적용비율: 실제로 시뮬레이션에 적용되는 비율 값으로, 재정 계획과 자금 운용 시 다양한 시나리오를 검토하는 핵심 정보입니다.최종자료변경일자: 해당 데이터가 마지막으로 수정된 날짜를 기록하여, 최신성 및 변경 이력을 확인할 수 있습니다.이처럼 시뮬레이션비율관리 데이터는 부산광역시와 자치단체가 재정 계획과 자금 운용을 보다 정확하고 효율적으로 수행할 수 있도록 필수적인 정보를 제공하며, 데이터 기반의 의사결정과 정책 수립에 중요한 역할을 합니다.'
