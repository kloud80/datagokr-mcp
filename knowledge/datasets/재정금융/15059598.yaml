summary_user: 환매조건부채권(REPO) 거래를 기준일자별로 담은 데이터로, 건별 거래(개시일·매입금액·금리·매입자·매도자 업종·상환기간)와 매입증권별 잔고(종목·수량·매입·평가금액), 통화·채권종류별 담보·잔고금액을 세 오퍼레이션으로 제공한다. 금융시장 분석가가 "특정일 기관REPO와 고객REPO의 금리·만기 분포는 어떻고, 국채·통안채·회사채 중 어떤 채권이 담보로 많이 쓰였나" 같은 단기자금시장 질문에 쓴다. 매입증권 잔고의 국제증권식별번호(isinCd)를 키로 채권 발행·시세 등 증권 시장 종목 데이터와 잇고, 기준일자(basDt)로 같은 날짜의 다른 시장 데이터와 맞춘다.
description_portal: 'REPO거래정보는 환매조건부채권거래(REPO)의 거래 현황과 잔고 정보를 제공하는 데이터입니다.데이터는 다음 3가지 오퍼레이션으로 구성되어 있습니다.① 건별거래 정보 조회 : 기준일자, 거래유형코드 등을 기준으로 거래일자, 매입자·매도자 구분, 거래금액, 거래금리 등을 조회하는 기능② 매입증권별 잔고금액 조회 : 기준일자와 증권종류코드를 기준으로 채권유형, 발행기관, 잔고금액, 평가금액 등을 확인하는 기능③ 통화별 잔고금액 조회 : 기준일자와 통화코드를 기준으로 통화구분, 보유잔고금액, 평가금액 등의 통화별 현황을 제공하는 기능* REPO 거래란? : 환매조건부매매로 금융기관이 특정 자산을 일정 기간 후에 원금과 이자를 지급하고 다시 매입하기로 약정하는 거래** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
