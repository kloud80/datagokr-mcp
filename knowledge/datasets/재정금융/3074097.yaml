summary_user: 정부·유관기관이 지원하는 국내 전시회를 전시회 한 건당 한 행으로 담은 파일(csv, 약 8.9KB)로, 전시회명·주최기관·기간·장소와 함께 전시면적, 참가업체 수(해외 포함), 참관객 수(해외 일반·해외 바이어 포함)를 담는다. 수출을 준비하는 중소기업이 '해외 바이어가 많이 오는 국내 전시회는 어디인가'를 비교해 참가할 전시회를 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 전시회명·주최기관 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 국내전시회 공공데이터는 산업통상자원부 등 정부 및 유관기관이 지원하는 유망 국내 전시회에 대한 정보를 체계적으로 제공함으로써, 중소기업에게 효과적인 수출 마케팅 기회를 부여하고 전시산업의 국제화 및 전문화를 촉진하는 데 목적이 있습니다. 해당 데이터는 전시회 기본 정보(연번, 전시회명, 주최기관, 전시기간, 전시장소 등)뿐만 아니라, 전시면적(㎡), 참가업체 수(총계 및 해외), 참관객 수(총계, 해외 일반 참관객, 해외 바이어) 등 주요 성과 지표를 포함하고 있어, 수출 유망 기업의 전시회 선택 및 마케팅 전략 수립에 유용한 기초자료로 활용될 수 있다. 또한 이 데이터를 통해 전시회의 규모, 해외 진출 가능성, 바이어 유입 수준 등을 객관적으로 파악할 수 있습니다.
