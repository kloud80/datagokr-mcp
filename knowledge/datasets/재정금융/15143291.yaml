description_portal: 신용위험, 국가위험, 환위험 등 무역 거래 과정에서 발생하는 위험 요인을 정의하고, AI 를 활용하여 도출한 영역별 지표 값을 통합하여 K-SURE RISK INDEX 를 산출하고 있습니다. 위험등급은 총 5단계(RI1~RI5)로 도출하고 있으며, 수치가 높을수록 주의가 필요한 거래입니다.최근 급격히 변화하는 무역 시장에 대응할 수 있도록 한국무역보험공사에서 보유하고 있는 과거 6년 치의 수출자와 수입국의 신용관련 데이터를 기본으로 활용하고 있으며, 그 외 각 지표 의미에 가장 최적의 결과를 제공하는 외부 기관 데이터를 수집하고 활용합니다. 과거 RISK INDEX 이력, RI 보고서는 해당 월 동안에 빈도가 높은 값을 제공하며, 국가별 RISK INDEX는 해당 국가의 RISK INDEX 값이 있는 업종 중 빈도가 높은 값을 제공합니다. K-SURE RISK INDEX는 AutoGluon(AutoML, AWS) 패키지를 활용하여 다양한 모델을 비교 및 앙상블로 구성하여 최적의 성능을 구현합니다.단, 무역보험공사 무역보험을 이용하지 않은 거래, 인수 거절된 케이스는 분석 대상에 포함되어 있지 않습니다. 본 서비스는 무역보험공사가 월별 또는 일별로 수집하는 내·외부의 데이터를 근거로 작성된 것으로, 업데이트 시점에 따라 주요 정보가 반영되지 않았을 가능성이 있습니다.
