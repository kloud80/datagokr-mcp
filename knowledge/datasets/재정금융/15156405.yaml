summary_user: 무역위원회 무역구제 조사 한 건마다 조사준비·신청·본조사·공청회·최종판정·종결 같은 활동을 순번과 코드로 기록하고, 단계별 공개개시 여부와 홈페이지 공개 여부를 함께 담은 건별 원장 파일(CSV 약 640KB)이다. 덤핑·세이프가드 등 무역구제 조사를 살펴보는 연구자나 업계 담당자가 특정 조사가 어느 단계까지 진행됐는지, 어떤 단계가 공개됐는지 확인하는 데 쓴다. 조사원장아이디(trade_remedy_inv_id)로 무역구제 조사원장 등 같은 키를 가진 조사 단위 데이터와 이어 쓴다.
description_portal: 산업통상자원부에서 제공하는 조사활동 분류정보 데이터는 무역위원회가 운영하는 무역구제 관련 조사 절차를 단계 별로 기록한 것입니다. 조사준비, 신청, 본조사, 공청회, 최종판정, 종결 등 주요 활동이 순서와 코드로 체계적으로 관리되며, 각 단계별 공개 여부와 홈페이지 공개 여부도 함께 표시되어 있습니다. 이러한 구조화된 정보는 행정 관리의 효율성을 높이는 동시에 국민에게 조사 과정의 진행 상황을 명확히 전달하는 역할을 합니다. 연구자들은 이를 활용하여 무역구제 제도의 운영 현황을 분석하거나 정책 개선을 위한 근거 자료로 삼을 수 있으며, 국민들 또한 무역위원회의 활동을 쉽게 이해하고 신뢰할 수 있는 기반을 마련할 수 있습니다.
