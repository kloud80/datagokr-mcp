description_portal: 정부는 회계연도마다 예산안을 편성하여 회계연도 개시 90일전까지 국회에 제출하고,국회는 회계연도 개시 30일전까지 이를 의결합니다.이 자료는 정부예산안 기준 분야별 예산금액분야별 예산현황 자료는 정부가 매년 편성·제출하는 예산안의 분야별 배분 현황을 집계·제공하는 재정 통계 자료입니다.(연도별 총지출 규모와 함께, 각 분야별 정부예산안 기준 배정 금액과 비중을 한눈에 파악할 수 있도록 구성되어 있습니다.)1. 데이터 범위   * 정부예산안 기준 분야별 예산현황   * 분야별 배정 금액 및 전체 대비 비중(%) 포함2. 주요 분야 구분   * 보건·복지·고용   * 교육   * 문화체육관광   * R&D   * 산업중소기업에너지   * SOC   * 농림수산식품   * 환경   * 국방   * 외교통일   * 공공질서안전   * 일반지방행정3. 활용 예시   * 정부 정책의 우선순위와 재정운용 방향 분석   * 분야별 예산 변화 추이 파악   * 특정 분야 집중도 및 정부 투자 방향성 평가   * 연구·언론 보도·정책 수립을 위한 기초 자료로 활용4. 데이터 특징   * 국회 심의 전 정부의 계획을 반영한 예산 배분 현황 자료   * 각 분야별 예산액과 전체 예산 대비 비율 제공   * 시계열 분석이 용이하여 재정정책의 변화 흐름 파악 가능5. 제공 형식 및 접근 방법   * CSV, XLSX 등 다양한 파일 형식으로 다운로드 가능   * 시각화 그래프 및 표 제공   * Open API를 통해 연도, 분야 등 조건별 상세 조회 지원본 자료는 정부의 분야별 예산 편성 계획을 국민에게 투명하게 공개하여 국민의 알권리를 충족시키고, 연구기관·언론·일반 국민이 재정 분석, 정책 평가, 예산편성 전략 수립 등에 폭넓게 활용할 수 있는 중요한 재정정보입니다.조원)을 연도별로 제공합니다.
