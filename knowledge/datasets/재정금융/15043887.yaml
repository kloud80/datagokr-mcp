description_portal: '한국무역보험공사 국가별 단기수출보험 인수현황(수입자국가코드, 국가명, 유효계약금액, 인수실적)입니다. 단기수출보험은 수출자가 수출대금 결제기간이 2년 이내인 수출계약을 체결하고 물품(용역 포함)을 수출하였으나, 비상위험 또는 신용위험으로 인하여 수출대금을 회수하지 못하게 됨에 따라 입게 되는 손실을 보상하는 제도입니다.ㅇ 담보하는 위험- 비상위험 : 수입국의 전쟁, 내란, 환거래제한, 모라토리움 등으로 인해 수출대금을 회수하지 못할 위험- 신용위험 : 수입자의 지급불능, 지급거절, 지급지체, 파산 등으로 수출대금을 회수하지 못할 위험'
