description_portal: '‘서민금융진흥원 미소금융 연령대별 대출실적 현황’ 공공데이터는 연도별로 연령대별 미소금융 이용 현황을 보여주는 자료입니다. 이 데이터는 미소금융을 통해 지원된 대출의 금액과 건수를 연령대별(예: 20대, 30대, 40대 등)로 구분하여 제공하며, 연도별 변화 추이도 함께 확인할 수 있습니다. 이를 통해 특정 연령층의 미소금융 수요와 이용 경향을 분석할 수 있으며, 연령별 수요에 맞는 맞춤형 금융정책 수립에도 유용하게 활용됩니다. 또한 금융 소외계층의 실질적인 자금 접근성과 정책금융의 효과를 연령별로 가늠할 수 있는 근거자료로 활용될 수 있어, 서민금융 지원 전략 수립과 서비스 개선에 중요한 기초 데이터를 제공합니다.※ 전통시장, 민간사업수행기관 소액대출 제외'
