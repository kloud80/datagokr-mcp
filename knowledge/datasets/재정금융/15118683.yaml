description_portal: 이 자료는 충청남도개발공사의 연도별 결산내역으로, 자산·부채·자본 등 재무상태와 매출액 및 당기순이익 등 경영성과를 종합적으로 제공한다. 단, 세부 계정과목별 내역이나 연결재무제표 수준의 상세 자료는 포함되지 않는다.키워드별 상세설명○ 결산 → 매 회계연도 종료 후 공사의 재무상태와 경영성과를 종합적으로 확정하는 절차로, 재무제표 수치가 반영됨○ 재무현황 → 자산·부채·자본 등 공사의 재정 건전성을 평가할 수 있는 기본 지표를 의미함○ 자산 → 공사가 보유한 경제적 자원의 총액을 의미하며, 현금·부동산·투자 등 다양한 항목이 포함됨○ 부채 → 공사가 제3자에게 변제해야 할 의무를 의미하며, 차입금·미지급금 등으로 구성됨○ 자본 → 자산에서 부채를 차감한 순자산을 의미하며, 공사의 자기자본 규모를 나타냄○ 매출액 → 해당 연도에 공사가 영업활동을 통해 벌어들인 총수익을 의미하며, 사업 실적의 규모를 판단하는 지표임○ 당기순이익 → 매출액에서 비용과 세금을 제외하고 해당 회계연도에 최종적으로 남은 이익을 의미함○ 연도별 비교 → 2008년 이후 연도별 재무 현황과 성과 변화를 확인할 수 있도록 제공되는 시계열 지표임
