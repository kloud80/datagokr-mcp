summary_user: 상장법인(금융업 제외)이 제출한 정기보고서의 XBRL 재무제표에서 재무상태표·손익계산서 주요 계정과목을 회사·사업연도·보고서별로 담고, 당기·전기·전전기 금액을 함께 제공하며 여러 회사를 한 번에 조회한다. 투자자나 분석가가 "같은 업종 상장사 몇 곳의 최근 3년 매출액·영업이익·부채총계를 나란히 비교하면 어떤가"를 확인하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았다. 다른 데이터와는 DART 고유번호(corp_code)·종목코드·접수번호 같은 같은 기관 코드나 회사명 매핑으로만 연결하며, 법인등록번호·사업자번호로 기업 축과 잇는 것은 세부 부문의 일반적 가치일 뿐 이 데이터 필드에서는 확인되지 않았다.
description_portal: 상장법인(금융업 제외)이 제출한 정기보고서 내에 XBRL재무제표의 주요계정과목(재무상태표, 손익계산서)을 제공합니다. (상장법인 복수조회 가능)
