description_portal: '□ 데이터 개요청주시 지방세 감면현황 데이터는 2013년부터 2024년까지 청주시에서 발생한 지방세 감면 내역을연도별, 세목별, 감면유형별, 구청별로 제공하는 공공데이터입니다.본 데이터는 지방세 감면 규모와 건수를 체계적으로 파악할 수 있으며,연도별 변화 및 지역별·세목별 감면현황 분석에 활용할 수 있습니다.□ 제공 목적청주시 지방세 감면 운영현황의 투명한 공개지방세 감면 정책 효과 분석 지원시민, 연구자 및 정책 담당자의 데이터 활용 기반 제공□ 제공 범위기간: 2013년 ~ 2024년기준: 과세연도 기준단위: 금액(원), 건수(건)형식: CSV 등 데이터 분석이 가능한 형태로 제공□ 주요 분류 기준1. 세목별 구분지방세는 다음과 같이 구분됩니다.도세: 취득세, 등록면허세 등시세: 재산세, 자동차세, 주민세, 지방소득세 등2. 감면유형별 구분법정감면(국가정책 감면)「지방세특례제한법」 등 법령에 따른 감면(예: 장애인, 국가유공자 등)지역경제 지원 감면산업단지 입주기업, 창업기업 등에 대한 감면자치단체 조례 감면「충청북도 도세 감면 조례」 및「청주시 시세 감면 조례」에 따른 감면□ 데이터 활용 방법본 데이터는 다음과 같은 분석에 활용할 수 있습니다.연도별 지방세 감면 추이 분석세목별 감면 규모 및 비중 비교감면유형별 정책효과 분석구청별 감면현황 비교청주시 전체 감면 규모 분석※ 청주시 전체 감면현황은 4개 구청 합계 기준으로 산출□ 참고사항-2013년 자료는 통합청주시 출범 이전 자료로당시 청주시(상당구, 흥덕구) 및 청원군 자료가 포함됩니다. -2014.7.1. 이후 청주시와 청원군 통합에 따라현재의 4개 구 체계(상당구, 서원구, 흥덕구, 청원구)로 운영됩니다. -시계열 비교 시 행정구역 체계 변화에 유의해야 합니다.'
