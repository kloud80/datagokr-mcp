description_portal: '금융회사재무신용정보는 기준일자, 법인등록번호, 사업연도를 기준으로 금융회사의 주요 재무제표를 제공하는 데이터입니다.이 데이터는 다음 3가지 오퍼레이션으로 제공합니다.1. 금융회사요약재무제표 조회: 매출금액, 영업이익, 당기순이익, 총자산, 총자본, 부채비율 등 요약 재무 지표2. 금융회사재무상태표 조회: 자산총계, 부채총계, 자본총계 등 회계 계정과목별 금액 (당기·전기·전전기 등 비교 포함)3. 금융회사손익계산서 조회: 영업수익, 영업이익, 순이익 등 손익 항목별 세부 금액 (계정과목별 비교 가능)※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
