description_portal: 2024년 복권 판매 현황에 대한 자료입니다. 복권위원회에서 발행하는 복권 상품별 액면가, 발행액, 발행매수, 판매액, 당첨금, 판매수수료, 위탁수수료, 복권수익금 및 기타 등에 관한 상세정보를 제공합니다. 복권 상품은 온라인복권(로또복권), 인쇄복권(스피또500, 스피또1000, 스피또2000), 결합복권(연금복권720+), 전자복권(추첨식 메가빙고, 추첨식 스피드키노, 추첨식 파워볼, 즉석식 트레져헌터, 즉석식 더블잭마이너스, 즉석식 캐치미)의 총 12종으로 구성되어 있습니다. 온라인복권은 발행 즉시 판매되는 형태입니다. 복권상품별로 당첨 구조와 사업비가 상이합니다. 사업비는 4가지 항목(판매수수료, 위탁수수료, 발행경비, 홍보비, 추첨방송비 등)으로 구성되어 있습니다. 전자복권의 경우 판매수수료 없이 홈페이지를 통해 판매됩니다.
