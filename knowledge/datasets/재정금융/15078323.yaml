description_portal: '이 데이터는 세원 유형별 과세현황을 나타내며, 경상북도 봉화군의 다양한 세목에 대해 과세된 내역을 세원 유형별로 구분하고 있습니다. 주요 항목은 다음과 같습니다시도명, 시군구명, 자치단체코드: 데이터가 속한 지역을 표시하며, 봉화군의 지방세 관련 정보를 포함합니다.과세년도: 과세가 발생한 연도를 나타냅니다.세목명: 세금 항목을 나타냅니다. 예를 들어, 담배소비세, 교육세, 재산세, 자동차세 등이 있습니다.세원 유형명: 세금이 부과된 세원의 유형을 구분합니다. 예를 들어, 주택, 건축물, 토지, 차량, 기계장비 등 다양한 세원 유형이 포함되어 있습니다.부과건수: 해당 세원 유형에 대해 부과된 건수입니다. 예를 들어, 주택에 대한 재산세 부과 건수, 자동차세 부과 건수 등이 포함됩니다.부과금액: 해당 세원 유형에 대해 부과된 총 금액입니다. 이는 세목과 세원 유형에 대해 부과된 세금 총액을 나타냅니다.이 데이터는 봉화군 내에서 세목별로 부과된 세금 금액과 부과된 건수의 현황을 분석할 수 있도록 도와주며, 세원 유형별로 어떤 자산이 세금 부과 대상이 되었는지, 또한 각 유형별로 세금이 얼마나 부과되었는지를 보여줍니다. 이를 통해 세금의 분포 및 세수 현황을 파악할 수 있습니다.예시 분석 - 담배소비세: 2017년 부과건수는 108건, 총 부과금액은 2,167,276,000원. - 교육세: 2017년 부과건수는 81,072건, 총 부과금액은 2,320,079,000원. - 취득세 (주택): 2017년 부과건수는 903건, 총 부과금액은 673,058,000원. - 자동차세 (승용): 2017년 부과건수는 16,413건, 총 부과금액은 2,163,230,000원. - 지방소득세 (법인소득): 2017년 부과건수는 532건, 총 부과금액은 2,915,009,000원.이 데이터를 통해 봉화군에서 어떤 세목이 더 많은 세금을 부과했는지, 그리고 어떤 세원에서 더 많은 세금이 발생했는지를 파악할 수 있습니다.'
