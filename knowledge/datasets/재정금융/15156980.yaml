description_portal: '국내외 신사업 파견은 한국중부발전의 중장기 성장 동력 확보를 위해 추진되는 국내외 신사업 파견 현황을 체계적으로 관리하는 자료입니다. 년도, 구분(국내 또는 해외), 사업명, 인원(단위: 명), 직무, 기준일 등의 핵심 항목을 포함하고 있어, 신규 프로젝트별 인적 자원 투입 규모와 전문 인력의 배치 상태를 실시간으로 파악할 수 있습니다. 특히 각 사업명에 따른 직무별 투입 인원을 분석함으로써, 신사업 추진에 필요한 핵심 역량을 진단하고 인력 운영의 효율성을 높이는 데 기여합니다. 이 데이터는 전략적 인적 자원 관리(HRM) 및 글로벌 사업 확장 전략 수립을 위한 기초 자료로 활용되며, 비고란을 통해 특이사항을 관리함으로써 파견 인력의 성과와 리스크를 선제적으로 파악하는 데 유용합니다.'
