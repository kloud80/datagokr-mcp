description_portal: 세출 세목 예산편성현황(추경포함)은 정부가 편성·집행하는 국가 예산의 세출 항목을 가장 세부적인 단위인 세목 단위로 집계한 통계 자료입니다.(부처별, 회계별, 분야·부문·프로그램·단위사업·세부사업·세목별 예산 현황과 금액을 포함하며, 본예산과 추가경정예산이 함께 수록됩니다.)추가경정예산(추경)은 이미 성립된 본예산을 집행하는 과정에서 불가피하게 발생한 새로운 재정 수요에 대응하거나, 경제 여건 변화, 재해·재난 등 긴급 상황에 따른 추가 재정 소요를 충당하기 위해 편성됩니다.[데이터 주요 항목 및 특징]1. 데이터 범위   * 국가 재정 세출 예산의 가장 상세 단위인 ‘세목’ 단위로 구성   * 부처명, 회계명, 분야·부문·프로그램·단위사업·세부사업·세목명, 예산구분, 본예산액, 추경예산액, 합계액 등 포함2. 추경 예산 반영   * 본예산 대비 증감액 확인 가능   * 각 세목별 증액 또는 감액 사유 기재되어 재정 변동 원인 파악 가능3. 예산구분   * 본예산   * 추가경정예산(제1회, 제2회 등 다회 편성 가능)4. 데이터 활용 예시   * 세목 단위의 상세한 재정투자 흐름 분석   * 특정 사업·정책의 추경 반영 여부 파악   * 분야별·부처별 재정 집행 우선순위 비교   * 예산 변동 추이 분석 및 정책효과 평가5. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 포맷으로 다운로드 가능   * Open API를 통해 부처, 연도, 회계, 분야, 세목 등 조건별 조회 지원본 자료는 재정 전문가, 연구기관, 언론, 일반 국민 모두가 정부의 예산 편성과 집행 내역을 보다 정밀하게 파악할 수 있도록 지원하며, 재정 건전성 관리, 정책 분석 및 의사결정에 필수적인 재정 정보로 널리 활용됩니다.
