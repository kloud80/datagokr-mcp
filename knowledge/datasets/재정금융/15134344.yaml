summary_user: 관세청 수출입 신고 원장에서 집계한 전국 시군구별 월간 수출입 실적으로, 수출·수입 건수와 미화 금액, 무역수지를 담는다. 지자체·지역경제 분석가가 '우리 시군구의 월별 수출액과 무역수지가 어떻게 변했나'처럼 지역 단위 무역 지표를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구명(sidoSggNm)을 행정구역 이름·코드로 매핑해야 다른 지역 통계와 이어 쓸 수 있다.
limits: 품목(HS)·국가별 구분 없이 시군구 합계만 담으므로 품목·상대국 분석은 다른 관세청 실적 데이터가 필요하다. 시군구 코드가 아닌 이름으로만 나와 지역 통계와 연결하려면 별도 매핑이 필요하며, 포털 안내상 '26.7.1. 전남광주통합·인천 행정체계 개편 전후로 시군구 기준이 달라 시계열 비교 때 주의해야 한다.
