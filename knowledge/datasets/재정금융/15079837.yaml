description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시의 지방세 부과 현황을 세원 유형별로 상세히 분류하여 제공하는 통계 자료입니다. 각 과세연도별로 취득세, 재산세, 주민세 등 주요 세목의 부과 건수와 부과 금액을 세원 유형에 따라 체계적으로 구분하여 기록하고 있습니다. 이를 통해 남원시의 세수 구조와 납세자 분포 현황을 심층적으로 분석할 수 있으며, 지방재정 운영과 세정 정책 수립을 위한 중요한 기초 자료로 활용됩니다.2. 데이터 항목명시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 세원 유형명, 부과건수, 부과금액3. 기대효과지방세 과세 현황의 투명한 공개를 통해 시민들의 세정에 대한 이해도를 높이고, 연구기관과 정책입안자들이 보다 효율적이고 합리적인 지방재정 운영 방안을 모색하는 데 실질적으로 기여할 수 있습니다.
