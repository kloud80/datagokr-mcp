description_portal: 한국산업은행이 취급하고 있는 기술금융대출과  관련하여, 매월 집계하고 있는 기술신용대출의 대출 잔액 및 대출 건수에 대한 데이터입니다. 기술신용대출은 기술력이 우수하지만 재무 상태나 신용등급이 낮은 벤처 및 중소기업이 대출을 받을 수 있도록 2014년 도입된 제도입니다. 은행은 기술평가기관이 발급한 평가서 및 기타 요건을 고려하여 대출 금리 및 한도를 책정하게 됩니다. 이 데이터에서는 한국산업은행의 기술신용대출 실적 자료를 제공함으로써 한국산업은행의 기술신용대출 취급 동향 및 규모 등을 파악할 수 있는 유용한 데이터입니다.
