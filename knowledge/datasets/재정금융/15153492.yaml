description_portal: 우리회사의 기타 재무현황 지표 자료로 재무 건정성을 파악할 수 있습니다.유동비율을 통해 회사가 부담하고 있는 전체적인 자금조달 비용으로 회사의 신용도와 자금을 빌려오는 원가를 확인할 수 있습니다.이자보상율로 특정 기간 동안 지불한 모든 채무에 대해 지급된 이자의 합계로 기업이 얼마나 많은 금융비율을 지출하는지 나타내고 있습니다.부채비율는 기업 자본 대비 외부에서 조달한 금액이 어느 정도인지를 백분율로 나타낸 수치로, 의존도가 높으면 상환 부담이 커지고 낮으면 안정성이 있다고 볼 수 있습니다.영업이익율은 일정 시점 혹은 기간에 걸쳐 확보하거나 투입한 현금으로 영업활동 및 투자 등을 위해 필요한 돈을 의미합니다.이러한 정보들로 회사의 전반적인 상황을 분석할때 유용하게 활용되며 정책 입안이나 연구원 등에게도 참고자료로 사용 될 수 있습니다.
