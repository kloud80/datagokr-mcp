description_portal: '○ 통계개요* 통계명 : 서울시 지역내 총생산 및 지출* 통계종류 : 서울시 지역내 총생산 및 지출 현황을 제공하는 지정ㆍ가공 통계* 작성목적 : 지역경제의 생산 규모 및 지출수준, 소득수준, 산업구조 등을 파악하여지역경제분석 및 정책수립에 필요한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 시내총생산, 경제성장률, 생산구조, 지출항목별증감률, 지출구조 등○ 용어설명* 지역내총생산(GRDP) : 일정기간 동안에 일정 지역내에서 새로이 창출된 부가가치의 합* 당해년가격과 기준년가격- 당해년가격 : 당해연도의 경상가격으로 평가, 지역경제의 구조변동이나 각 요소들의중요성이 시간의 경과에 따라 어떻게 변동하는가를 분석하고자 할 때 이용- 기준년가격 : 어느 특정 년(통상 끝자리 0,5자 연도)의 가격으로 평가, 물가의 변동에따른 요인을 배제하여 장기간에 걸친 물량수준의 변동 등을 분석하고자 할때 사용'
