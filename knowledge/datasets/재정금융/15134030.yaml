status: active
summary_user: KOTRA 해외 무역관이 제공한 해외 인증제도 정보를 인증제도별 게시물 단위로 담는다. 제도 내용, 근거 규정, 적용대상품목, 인증절차, 필요 서류, 시험·인증 비용, 소요 기간, 인증 유효기간, 인증기관이 포함되며 국가명·대륙명·무역관으로 구분된다. 수출기업은 "우리 제품을 이 나라에 수출하려면 어떤 인증을 어떤 절차와 비용으로 받아야 하나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, HS코드(hscd)나 국가명을 이름·코드로 매핑해 관세청 품목·국가별 수출입 실적과 이어 볼 수 있다.
limits: 전역 조인 키가 확인되지 않아 다른 데이터와는 HS코드·국가명 같은 이름·코드 매핑으로만 연결된다. 비공간 데이터이며 내용은 문서형 서술 필드 위주라서 수치 분석보다는 열람·검색 용도에 가깝다. 개발계정 호출 한도는 하루 10,000회이다.
