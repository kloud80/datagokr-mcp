description_portal: 이 데이터는 신용보증기금의 보험상품 이용 고객에 대한 특성과 리스크 관리 현황을 보여주는 정보로, 보험고객의 기업형태 및 재무상태, 인수 제한 여부 등을 중심으로 구성되어 있습니다. ‘보험고객 인수금지 기업 정보’는 보험 인수 심사 과정에서 일정 기준에 따라 인수가 제한되거나 금지된 기업의 현황을 나타내며, 과거 보험사고 이력, 부실징후, 업종 위험도 등을 포함합니다. ‘기업 형태 동향 정보’는 보험가입 기업을 자영업, 중소법인, 중견기업 등 유형별로 분류하고, 연도별 가입 비중 및 구성 변화를 통해 정책보험 수요 구조를 분석할 수 있도록 합니다. ‘재무 동향 정보’는 보험 고객의 매출액, 당기순이익, 자기자본 등 주요 재무지표를 통해 기업의 건전성과 보험 리스크를 종합적으로 판단할 수 있도록 지원합니다. 이 데이터는 보험 대상 기업군의 특성과 신용위험 추세를 파악하고, 보험정책 수립, 리스크 평가모형 고도화, 사전 리스크관리 체계 강화 등에 활용 가능한 핵심 자료입니다.
