summary_user: 전주시 관내에 정식 등록된 대부업·대부중개업체를 업체별로 한 행씩 담은 등록 현황 파일로, 상호, 업종(대부업·대부중개업), 법인여부, 영업소 도로명 주소, 등록일자, 데이터 기준일자를 담는다. 시민이 돈을 빌리기 전에 "이 업체가 전주시에 정식 등록된 대부업체인가"를 확인해 불법사금융업자를 가려내는 데 쓰고, 분석가는 관내 대부업체의 분포와 등록 시기를 살피는 데 쓴다. 등록번호나 사업자번호 같은 공통 조인 키는 없어서, 다른 데이터와는 상호명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '전주시 대부업(등록신청사업, 상호, 법인여부,  사업장 전화번호, 소재지, 등록일자)에 관한 현황을 제공합니다.담당부서: 민생사회적경제과「대부업 등의 등록 및 금융이용자 보호에 관한 법률」에 의거전주시 관내 대부업 및 대부중개업 등록현황 정보를 제공합니다.대부업 및 대부중개업체별 등록유형, 등록번호, 등록일자, 상호, 법인여부, 소재지 주소,  데이터 기준일자 등 정보로 구성되어 있습니다.대부업 및 대부중개업 이용 시, 정식 등록여부를 확인할 수 있도록 하여, 불법사금융업자를 판별할 수 있도록 합니다.기준일자(2026.07.) 현재 정식등록된 업체들에 대한 정보이며,실시간 등록현황은 금융위원회나 금융감독원 홈페이지에서 전국 지자체에 등록된 업체를 조회하실 수 있습니다.'
