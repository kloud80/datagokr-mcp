summary_user: 무역위원회가 무역구제 조사·행정에서 쓰는 국가 기준 코드표로, 국가 한 건마다 국가아이디·국가코드·국문/영문 국가명·상위 분류(대륙) 아이디·사용여부·대륙구분여부를 담은 약 8KB 분량의 CSV 파일이다. 무역구제(반덤핑·세이프가드 등) 조사 자료나 무역 통계를 분석하는 사람이 국가코드를 국가명·대륙으로 풀어 쓰거나 국가별로 묶어 집계할 때 쓴다. 국가코드(country_cd)를 키로 국가 단위 수출입 실적이나 다른 무역 데이터의 국가 필드와 이어 쓰고, 상위국가분류아이디로 같은 표 안에서 국가와 대륙을 연결한다.
description_portal: 산업통상부에서 제공하는 무역구제 국가 기준정보 데이터는 국가아이디, 국가코드, 국가명, 국가영문명, 상위국가분류아이디, 사용여부, 대륙구분여부 정보를 포함하고 있습니다. 이 데이터는 무역위원회가 국제 무역 관련 조사와 행정 업무를 수행할 때 국가를 일관성 있게 식별하고 관리하기 위한 기본 자료로 활용됩니다. 각 국가는 고유 코드와 명칭을 통해 체계적으로 구분되며, 상위 분류 아이디를 통해 대륙 단위의 구조적 관계를 확인할 수 있습니다. 또한 사용 여부와 대륙 구분 여부가 함께 기록되어 있어 실제 조사 과정에서 필요한 국가 정보를 효율적으로 제공하고, 정책 수립이나 통계 분석에도 기초 자료로 활용될 수 있습니다.
