description_portal: 서울시 시민참여예산 제안사업 댓글 데이터는 시민이 제출된 제안사업에 대해 남긴 의견이나 평가 내용을 기록한 자료입니다. 회계연도와 제안번호는 어느 연도, 어떤 제안사업에 달린 댓글인지 구분하기 위한 기본 식별 정보입니다. 순번은 동일 제안에 대해 작성된 여러 댓글을 구분하기 위한 일련번호입니다. 내용 항목에는 시민 또는 관계자가 남긴 구체적인 댓글 텍스트가 저장됩니다. 등록일은 댓글이 처음 작성된 날짜를, 수정id와 수정일은 댓글을 누가 언제 수정했는지 관리하기 위한 이력 정보입니다. 삭제여부는 해당 댓글이 현재 사용 중인지, 삭제 또는 비공개 처리되었는지를 표시하는 값입니다. 이 데이터는 제안사업에 대한 시민 의견, 찬반, 개선 제안 등을 파악하고 숙의 과정과 공론 형성의 흐름을 분석하는 데 활용됩니다.
