description_portal: KOTRA에서 공공데이터 포털에 개방 중인 국별 대세계 수입규제 현황 공공데이터는 각 국 정부가 대한 수입품에 대해 취하고 있는 반덤핑, 상계관세, 세이프가드 등의 무역 구제조치 정보를 수록한 자료로, 세계 주요국들이 한국을 포함해 각 국에 취한 수입규제조치 현황을 HS 코드별로 정리하여 제공한다. 이 데이터는 KOTRA 해외무역관이 현지 정부의 공식 발표, 관보, 무역청 통계등을 기반으로 직접 수집·정리한 것으로 신뢰도가 높으며, 연 1회 정기적으로 갱신된다. CSV 형식으로 제공되어 활용성이 높고, 수출기업 및 정책 수립기관에서 세계 무역 규제환경을 정확히 파악하고 사전 대응 전략을 수립하는데 활용할 수 있는 중요한 기초 자료로 평가된다.
legal_basis_portal: 해외 무역관으로부터 수입규제 정보 조사 후 KOTRA 빅데이터 플랫폼을 통해 對고객 제공
