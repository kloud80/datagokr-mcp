description_portal: '녹색제품 구매계획 데이터는 공사가 환경 친화적 소비를 실현하기 위해 연간 계획한 녹색제품 구매 목표를 품목별로 정리한 자료입니다. 이 데이터는 매년 2월 사전정보공표를 통해 공개되며, 각 품목에 대해 전체 구매 예정 수량 및 금액, 이 중 녹색제품으로 분류된 물품의 수량과 금액, 그리고 이에 대한 비율을 명확히 제시하고 있습니다. 공사는 이를 통해 정부의 녹색제품 의무구매 제도에 부응하고, 공공기관으로서의 환경 책임을 이행하고 있습니다.* 녹색제품 구매항목 : OA 칸막이, 의자, 기타 가구 및 부속품, 복사기, 사무용지, 개인용컴퓨터, 노트북컴퓨터, 프린터, 등기구, 바닥장식재 등'
