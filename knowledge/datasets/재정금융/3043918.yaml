description_portal: '방송통신발전기금 및 정보통신진흥기금 자산운용 실적 데이터는 한국방송통신전파진흥원이 공식적으로 제공하는 공적 자료로, 양 기금의 운용 현황과 성과를 국민에게 투명하게 공개하기 위해 마련된 것이다. 본 데이터는 최근 5개년 동안의 자산운용 실적을 연도별 차트 형식으로 체계적으로 정리하여 제공하며, 이를 통해 기금 운용의 변화 추세를 한눈에 파악할 수 있도록 지원한다. 이러한 정보는 기금 운용이 사회적 책임과 제도적 신뢰성 확보에 어떻게 기여하는지를 구체적으로 보여주고 있다. 또한 해당 자료는 정책 입안자, 연구자, 언론인뿐만 아니라 일반 국민에게도 개방되어 있어, 공공 데이터로서 활용도가 매우 크며 기금 운용의 투명성과 신뢰성을 높이는 기반이 된다. 특히 장기간에 걸친 데이터를 시각화된 형태로 제공함으로써 이용자가 보다 쉽게 이해할 수 있도록 하였고, 공공기금 관리의 건전성과 효율성 평가에도 직접적으로 기여한다. 아울러 국제적 기준과 비교 가능한 수준의 지표를 포함하고 있어 해외 기금 운용 사례와의 분석에도 활용될 수 있으며, 이는 우리나라 공공기금의 경쟁력을 높이고 제도적 신뢰를 확립하는 데 중요한 역할을 한다. 더 나아가 본 데이터는 학술 연구와 정책 평가 보고서 작성, 국회와 정부 부처의 의사결정 과정에서도 인용될 수 있어 국가적 차원의 정책 수립과 재정 운용의 효율성 제고에 기여한다. 해당 데이터는 우리 기관 공식 홈페이지 콘텐츠 페이지를 통해 누구나 접속할 수 있으며, PDF 파일 형식으로 열람 가능하다. 최근 5개년 방송통신발전기금 및 정보통신진흥기금 자산운용 실적 그래프를 링크 페이지 하단에서 확인 및 다운로드 받으실 수 있습니다.가로축 : 연도별 실적(단기자금(연평잔), 중장기자금(연평잔), 운용수익률, BM수익률) 세로축 : 증감률, 금액(억원, 연환산)'
