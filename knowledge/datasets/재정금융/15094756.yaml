summary_user: '제주특별자치도 내 카드 결제 금액을 기준연월별로 시간대·연령대·이용자 구분(예: 도민·관광객)에 따라 집계한 통계로, 이용금액은 백만 원 단위(use_amout_by_million)로 담는다. 제주 상권 분석가나 관광 정책 담당자가 "관광객과 도민의 소비가 하루 중 어느 시간대에 몰리는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연월이나 같은 기관(제주특별자치도)의 다른 카드·관광 통계와 이름·코드를 맞춰 연결해야 한다.'
description_portal: 이 데이터셋은 2018년 1월 1일부터 2020년 12월 31일까지 제주특별자치도 내에서 카드로 결제된 금액을 시간대별, 연령대별, 사용자 구분별로 집계한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 데이터 형식은 CSV로 공개되어 있어 누구나 무료로 다운로드 및 활용할 수 있습니다. 이 자료는 시간대별 소비 패턴 분석, 소비 집중 시간대 파악, 지역 상권의 시간대별 매출 흐름 연구, 관광객·도민의 소비 행태 비교, 경제 활동 시간 구획 분석, 정책 수립 및 상업 인프라 계획 등에 유용합니다. 다만 2020년 말까지의 집계만 포함되어 있으며, 이후 카드 이용 행태 변화나 인구 유동 변화는 반영되지 않을 수 있다는 한계가 있습니다.
