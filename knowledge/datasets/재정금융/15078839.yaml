description_portal: '- 지방세 과세 현황  - 연도별 지방세 과세 및 비과세 현황을 세목별로 제공합니다.  - 활용업무: 국민 조세 혜택 규모를 파악하는 데 사용제공 형태 및 접근 방법파일 데이터(CSV) 형태로 제공되며, 공공데이터포털에서 로그인 없이 무료로 다운로드할 수 있습니다.오픈API (JSON/XML) 형태로도 자동 변환되어 제공되며, 공공데이터포털 회원 가입 및 활용 신청을 통해 활용할 수 있습니다.제공 기관 및 관리 부서제공기관: 대전광역시 서구관리부서: 서구청 세정과주요 포함 항목과세년도, 세목명, 과세건수, 과세금액, 비과세건수, 비과세금액 등이 포함되어 있어, 연도별 지방세 과세 및 비과세 현황을 세목별로 파악할 수 있습니다.데이터 규모 및 갱신 주기전체 데이터 행 수는 12건으로, 연간 갱신 방식으로 운영되며, 차기 등록 예정일은 2025년 8월 14일입니다.이용 조건 및 라이선스무료 제공되며, 라이선스는 이용허락 제한 없음으로, 공공·민간 모두 자유롭게 활용 가능합니다.활용 분야 및 기대 효과이 데이터는 지방세 부과 현황 분석, 세목별 부과 건수 및 금액 비교, 비과세 항목 파악, 조세 혜택 규모 산정 등에 유용합니다. 예를 들어, 특정 세목의 부과 건수와 금액을 분석하여 세수 확보 방안을 모색하거나, 비과세 항목의 규모를 파악하여 정책 개선에 활용할 수 있습니다.'
