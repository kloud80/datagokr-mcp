description_portal: 본 데이터는 경기도 가평군의 지방세 징수현황을 과세년도별로 수록한 자료입니다. 항목에는 목표액, 부과액, 징수액, 결손액, 미수액, 징수율, 데이터기준일자 등이 포함되어 있으며, 금액 단위는 백만원 기준으로 제공됩니다. 본 자료는 지방세 부과 대비 실제 징수 실적을 연도별로 비교 분석하거나, 결손·미수 발생 현황을 파악하는 데 활용될 수 있습니다. 징수율 정보는 세입관리의 효율성 지표로 활용되며, 행정계획 수립 및 세수 확보 전략 수립에도 기초자료로 사용됩니다. 또한, 미수액과 결손액 추이를 통해 세입 누수 요인을 진단하거나 체납관리 대책 수립에 참고할 수 있습니다. 자세한 내역은 가평군 대표홈페이지 사전정보공표 메뉴를 통해 확인 가능합니다.*가평군 대표홈페이지 사전정보공표 URL:https://www.gp.go.kr/portal/contents.do?key=641
