description_portal: 재정력지수(기준재정수요충족도)는 지방자치단체가 주민에게 제공해야 할 기본적인 행정서비스를 수행하는 데 필요한 재정수요(기준재정수요액)를 자체적으로 확보한 재정수입(기준재정수입액)으로 어느 정도 충당할 수 있는지를 나타내는 대표적인 재정 지표입니다. 산정식은 기준재정수입액 ÷ 기준재정수요액으로 산출되며, 수치가 높을수록 재정 자립도가 높고, 낮을수록 국가 지원 의존도가 큰 것을 의미합니다. 본 지표는 지방자치단체의 재정 건전성, 재정 자립 수준, 교부세 산정의 중요한 기준 자료로 활용되며, 「지방재정365 → 통합자료실 → 예산 → 교부세 현황 → 연도별 보통교부세 산정내역」에서도 확인할 수 있습니다. 이를 통해 시·군별 재정 여건 비교 및 재정 정책 수립의 기초자료로 활용됩니다.
