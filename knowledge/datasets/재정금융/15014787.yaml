summary_user: 한국산업은행이 고시한 2025년 1월 2일~12월 31일 통화별 환율 변동 내역을 일자·통화 단위 행으로 담은 파일 데이터이며, 검증 시 14,094행을 받았다. 매매기준율, 현찰·수표·전신환 매입·매도율 등 여러 환율 종류가 한 행에 들어 있어, 해외송금이나 외화 환전 때 적용된 환율을 통화별로 비교하려는 사업자·분석가가 쓴다. 전역 조인 키는 없고 통화코드와 적용시작일을 기준으로 다른 환율 자료와 이름·코드 매핑을 거쳐 이어 쓰거나 같은 기관 코드로만 연결한다.
