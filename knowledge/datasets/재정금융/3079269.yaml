summary_user: 경상남도 거제시에 등록된 대부업 사업자를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록증번호·상호·영업구분·사업자구분·전화번호·지번/도로명 소재지·등록일자·기준일자를 포함한다(CSV 약 2.5KB 규모의 소량 파일). 시민이 거래하려는 대부업체가 거제시에 합법적으로 등록된 곳인지 상호나 등록증번호로 확인하거나, 분석가가 관내 대부업체의 분포와 영업 형태를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 시군구 대부업 등록 현황과는 시군구명·상호·소재지 같은 이름·주소 매핑으로만 이어 쓴다.
description_portal: 해당 데이터는 경상남도 거제시 대부업 현황에 대한 공공데이터로, 관내에서 등록·운영 중인 대부업 관련 사업자의 정보를 제공합니다. 시군구명, 등록신청사업, 영업구분, 등록증번호, 상호, 사업자구분, 전화번호 및 소재지와 함께 등록일자와 기준일자가 포함되어 있어 사업자 현황을 종합적으로 파악할 수 있습니다. 본 자료는 시민들이 합법적으로 등록된 대부업체 여부를 확인하는 데 활용할 수 있으며, 기업 및 기관에서는 금융 관련 정책 수립과 관리·감독을 위한 기초자료로 활용할 수 있습니다. 또한 지역 내 대부업 분포와 영업 형태를 파악하는 데 도움이 됩니다.
