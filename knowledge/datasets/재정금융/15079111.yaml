description_portal: 대구광역시 군위군의 지방세 비과감면율 현황에 대한 데이터로 연도별 비과세금액, 감면금액, 부과금액, 비과세감면율 항목을 제공합니다. 지방세 세입에서 비과세 및 감면된 금액이 어느 정도인지를 나타내는 재정 분석 지표입니다. 이 데이터는 자치단체의 조세정책 운용 현황, 세수 손실 규모, 감면제도의 적정성 등을 종합적으로 판단하는데 활용됩니다. 비과세금액은 법적면세 혜택 규모 분석, 조세기반 파악에, 감면금액은 정책적 지원 규모 분석, 감면제도의 수혜자 분포 분석에, 부과금액은 실세수 추이 및 자주재원 확보 수준 평가에, 비과세감면율은 감면제도의 총량적 수준 파악, 과도한 감면 여부 또는 제도 남용 우려 진단, 세입 확충 여지 판단에 활용됩니다.
