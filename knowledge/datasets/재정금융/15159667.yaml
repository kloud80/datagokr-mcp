description_portal: '2024년 김천시 지방세 (시세) 부과, 수납, 미수납 금액세목별 부과금액, 수납금액, 환급금액, 정리보류액, 미수납금액 (환급금액은 수납금액에 포함안됨)단위: 천원○세목별 설명- 주민세       ■ 균등분: 개인 및 법인 균등 부과       ■ 재산분: 사업소 연면적 기준 부과      ■ 종업원분: 종업원 급여총액 기준 부과 - 지방소득세 → 소득세 및 법인세의 10%에 해당하는 금액을 지방세로 부과      ■개인분: 개인 소득세 납부세액 기준      ■ 법인분: 법인세 납부세액 기준      ■ 특별징수분: 원천징수 방식으로 징수- 재산세 → 토지, 건축물, 주택 등 재산 보유에 대해 부과- 자동차세 → 자동차 소유에 따라 부과되는 세금      ■ 소유분: 연 2회(6월, 12월) 부과     ■ 주행분: 유류 소비량 기준 부과- 담배소비세 → 담배 제조 및 수입 시 부과되는 소비세'
