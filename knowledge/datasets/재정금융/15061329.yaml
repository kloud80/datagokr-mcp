summary_user: 국내에 진출한 외국은행 지점을 기준년월(basYm)과 지점별로 묶어 일반현황(설립일·본점소재지·점포 수 등), 재무현황(자산·부채·자기자본), 주요 경영지표(ROA·ROE 등)를 담는 금융회사 단위 통계이며, 범위는 전국·비공간이다. 금융 분석가나 연구자가 "특정 외은지점의 자산 규모와 수익성이 기준월마다 어떻게 달라졌나"를 확인하거나 외은지점끼리 안정성을 비교할 때 쓴다. 법인등록번호(crno)가 실측 조인 키여서 금융위 기업정보·공시 재무 등 법인 단위 데이터와 잇고, 금융회사 코드(fncoCd)로 다른 업권별 금융통계와 맞춰 볼 수 있다.
limits: 개발계정은 하루 10,000회로 호출이 제한된다. 실호출 검증은 오퍼레이션 1개에서만 성공해 나머지 재무현황·경영지표 오퍼레이션의 응답은 확인되지 않았다. 지점 단위 전국 통계라 지역별 분석에는 쓰지 못한다.
