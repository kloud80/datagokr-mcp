description_portal: '금융통계외은지점정보는 기준년월과 외국은행 지점명을 기준으로 외은지점의 일반현황, 재무상태 및 주요 경영지표를 제공하는 데이터입니다.국내에 진출한 외국계 은행지점의 구조와 수익성, 안정성을 파악할 수 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 외은지점 일반현황 조회 : 외은지점의 설립일, 본점소재지, 점포 수 등 기본 정보를 제공합니다.② 외은지점 재무현황 조회 : 자산, 부채, 자기자본 등 재무구조 항목을 제공합니다.③ 외은지점 주요경영지표 조회 : ROA, ROE 등 외은지점의 수익성과 경영성과를 나타내는 주요 지표를 제공합니다.'
