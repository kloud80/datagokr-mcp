summary_user: 바이코리아에 들어온 해외 바이어의 구매·견적·샘플 문의(인콰이어리)를 건별로 담은 파일로, 문의 구분과 종류, 영문·한글 상품명, 바이어 국가·도시, 유효 시작·종료일을 담는다. 수출기업이나 분석가가 "어느 나라 바이어가 어떤 상품을 지금 찾고 있나"를 확인하고 유망 시장·품목을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 국가명이나 상품명을 이름으로 맞춰 이어야 하며, 관세청 국가별·품목별 수출입 실적과 비교하는 식으로 쓴다.
description_portal: 해외 바이어 인콰이어리는 세계 각국의 바이어들이 한국 기업의 제품이나 서비스를 보고 구매 의향, 견적 요청, 기술 문의, 샘플 요청 등 비즈니스 협력을 위해 남기는 공식 문의를 의미합니다. 바이코리아 홈페이지는 이러한 문의를 체계적으로 수집·관리하여 국내 수출기업과 연결하는 플랫폼 역할을 합니다. 바이코리아에서 수집되는 해외 바이어 인콰이어리는 한국 수출기업과 세계 바이어를 연결해 실제 비즈니스로 이어지도록 지원하는 핵심 데이터로, 다양한 온라인 채널에서 유입된 바이어 문의를 체계적으로 수집·매칭·전달하는 시스템입니다.
