description_portal: "경기도 파주시에서 수행하는 차량 관련 체납 단속 및 번호판 영치 현황을 기록한 자료로, '읍면동명', '영치연월', '영치건수', '체납건수', '체납액', '자동차세체납건수', '자동차세체납액' 등의 항목으로 구성되어 있습니다. '읍면동명'은 단속이 수행된 행정구역을 나타내며, '영치연월'은 단속이 이루어진 연도와 월을 포함합니다. '영치건수'는 실제 번호판이 영치된 횟수를, '체납건수'는 체납된 사례의 수를 의미합니다. '체납액'은 전체 체납 금액을 나타내며, 그 중 '자동차세체납건수' 및 '자동차세체납액' 항목은 자동차세 체납에 해당하는 건수와 금액을 구분하여 제공함으로써, 체납 유형 중 자동차세 비중을 분석할 수 있도록 지원합니다. 이 데이터는 지방세 체납 실태 파악, 지역별 체납 집중도 분석, 단속 정책 수립, 단속성과와 세수확보 효과, 행정집행의 효율성 등의 평가, 시간 및 지역단위 데이터를 통한 시계열 및 공간분석, 정책 효과성 분석, 우선단속지역 선정, 체납패턴 도출 등에 활용 가능합니다.* 영치기간: 2021. 1월 ~ 2025. 7월"
