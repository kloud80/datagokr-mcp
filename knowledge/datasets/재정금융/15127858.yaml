description_portal: "무역보험공사에서는 국민의 알권리를 보장하고 업무운영의 투명성을 확보하기 위하여 정보공개제도를 시행하고 있습니다. 이 데이터는 2016년 1분기부터 2024년 1분기까지 분기별 한국무역보험공사로 접수된 정보공개 청구 현황을 정리한 자료입니다. 주요 항목은 연도·분기(구분), 청구건수, 전부공개, 부분공개, 비공개, 미결정, 기타(취하 등) 건수로 구성되어 있습니다. 국민들에게 더욱 편리한 방법으로 정보가 제공되도록 인터넷 홈페이지에 '정보공개제도' 페이지를 개설하여 운영하고 있습니다.* 정보공개제도 : 공공기관이 직무상 작성 또는 취득하여 관리하고 있는 정보를 수요자인 국민의 청구에 의하여 열람·사본·복제 등의 형태로 청구인에게 공개 하거나 공공기관이 자발적으로 또는 법령 등의 규정에 의하여 의무적으로 보유하고 있는 정보를 배포 또는 공표 등의 형태로 제공하는 제도"
