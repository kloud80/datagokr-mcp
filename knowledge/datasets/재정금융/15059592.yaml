summary_user: 채권 한 종목을 한 행으로 하는 종목별 기본정보 원천으로, 표면이율·발행금액·잔액·발행일·만기일·금리구분·보증·옵션 같은 발행 조건을 담으며 전체 29,114건(1999-06-29~)이다. 투자자나 분석가가 특정 기업이 발행한 채권의 만기·금리 조건과 잔액이 어떤지 확인할 때 쓴다. 법인등록번호(crno)로 기업 공시·기업정보와, 국제채권식별번호(isinCd)로 종목코드 기준 시세·발행 데이터와 이어 쓴다.
description_portal: '채권기본정보는 기준일자, 법인등록번호 또는 채권발행인명을 기준으로 채권에 대한 주요 정보를 제공하는 데이터입니다.제공 항목에는 채권표면이율, 채권순위구분, 채권잔액, 채권납입금액, 발행금액, 발행일자, 만기일자, 발행통화, 이자지급주기, 금리구분(고정·변동), 과세구분, 채권이자유형(이표·할인), 보증유형, 옵션유형, 상장일자, 자금용도, 이자산정방법 등 폭넓은 정보가 포함됩니다.또한 원리금 지급기관 및 지점, 보증기관, 발행대리인 등 실무적 참고정보도 함께 제공되며, 특수채, 영구채, 물가연동채 여부, 크라우드펀딩 여부 등의 특성도 확인 가능합니다.<데이터 조회 시 유의사항>파라미터 없이 조회 시 데이터 조회 시간이 오래걸려 timeout이 발생하게 되어 필수 파라미터를 지정하였습니다.- 파라미터 조건 : 조회 시 아래의 필수 파라미터 중 최소 1개 이상을 반드시 입력해야 합니다.- 기본값 안내 : 필수 파라미터를 입력하지 않은 경우, 기준일자(basDt)는 자동으로 가장 최신 날짜로 설정되어 조회됩니다.[서비스별 필수 파라미터 목록]- 채권기본정보조회 : basDt, isinCd, crno※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
