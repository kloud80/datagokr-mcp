description_portal: 본 데이터는 연도별 국가채무 총괄(결산) 현황을 제공하는 자료입니다. 국가채무는 중앙정부가 직접 상환 책임을 지는 채무로서, 결산 기준으로 각 회계연도별 국가채무의 규모와 구조를 확인할 수 있습니다. 이 데이터는 기획재정부에서 국가 재정건전성 확보 및 투명한 재정 운용을 위해 제공되며, 국가채무 구성 항목별 구분, 변동 내역, 부처(소관)별 책임 재원 등을 포함하고 있습니다. 채무 통계는 재정 운용 계획 수립, 중기 재정전망 및 국가재정전략 수립 시 주요 참고 지표로 활용되며, 정부의 재정상황에 대한 국민적 이해 제고에도 기여합니다. 수록된 정보는 결산 결과를 기반으로 집계되어, 실제 집행 이후의 확정된 수치를 바탕으로 작성됩니다.
