description_portal: 2013년~2024년 세목 및 근거 조항별 지방세 비과세·감면 현황 자료를 제공합니다.본 자료는 각 과세연도별로 세목(취득세, 재산세 등) 단위의 비과세 금액과 감면 금액을 정리한 데이터입니다.비과세·감면이 적용된 근거에 따라 지방세법, 지방세특례제한법, 감면 조례 등으로 구분하였으며, 이를 통해 어떤 법적 기준에 따라 세금이 줄어들었는지 확인할 수 있습니다. 또한 동일한 세목이라도 적용 근거별로 구분하여, 세목별 감면 현황을 보다 쉽게 비교할 수 있도록 구성하였습니다.이 데이터는 지방세 감면 규모, 연도별 변화 추이, 세목별 감면 현황 등을 파악하는 데 활용할 수 있으며, 정책 참고자료 및 통계 분석 등에 활용 가능합니다.비과세·감면율 = (비과세금액 + 감면금액) / 부과금액(부과금액은 감면 적용 전 전체 세액을 의미합니다.)감면조례는 조례광역공통 및 조례기초공통을 총칭하는 표현입니다.
