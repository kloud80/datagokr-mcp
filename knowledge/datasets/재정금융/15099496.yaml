description_portal: '2021년까지는 각연도 부담금운용종합보고서 기준, 2022~2023년은 부담금운용종합계획서 기준으로 작성된 부담금 시계열 자료입니다. * 2015년부터는 산업·중소에너지 분야명은 산업·에너지로 변경 되었습니다.*2022년 12월 29일을 기준으로 작성된 자료입니다.부담금: 특정 공익사업과 관련하여 법률이 정하는 바에 따라 부과하는 조세 외의 금전지급의무(부담금관리 기본법 제2조)특정 공익사업을 위한 경비에 충당되고, 부과대상과 특정 공익사업간에 밀접한 관련성이 있음부담금의 기능: 부담금은 원인자·수익자 부담원칙에 따른 공공서비스의 창출과 바람직한 행위의 유도 등의 기능 수행'
