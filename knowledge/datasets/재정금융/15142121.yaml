description_portal: 1. 개요최근 환경문제가 대두됨에따라, 예금보험공사는 지속가능한 ESG경영의 일환으로 지난 2023년 충남 보령시 원산도 해변(반려해변)을 입양하였습니다.데이터는 예금보험공사가 입양한 원산도 반려해변에 대한 환경정화 참여실적입니다.공사 뿐만 아니라 유관기관인 예울FMC, 수협은행, 한국자금중개 및 점치어촌계 주민 등과 함께 지속적으로 정화활동하고 있습니다.2. 내용 예금보험공사의 연도별 반려해변정화 참여실적 데이터가 들어가 있으며세부적으로는 반기 실시횟수, 전체 참여인원, 반려해변 정화 시 수거한 해양쓰레기의 중량이 작성되어 있습니다.3. 단위 (회) 실시횟수(명) 참여인원(kg) 중량
