description_portal: 2015년부터 2021년 까지 추가경졍예산 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.지난 7월 24일 34.9조원 규모의 2021년 제2회 추가경정예산이 국회심의를 거쳐 확정되었습니다.추경예산 34.9조원 중 14.9조원(43.7%)은 코로나19 피해지원 3종 패키지, 12.6조원(36.1%)은 지역경제 활성화, 4.9조원(14.0%)은 백신방역 대응 보강, 2.5조원(7.2%)은 고용 및 민생안전 등에 사용될 예정입니다.*GDP 전망이 지난 추경 이후 수정됨에 따라 통합재정수지 적자폭은 악화되었음에도 GDP 대비 비중은 감소하였습니다.
