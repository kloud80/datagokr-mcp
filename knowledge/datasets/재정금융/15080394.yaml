description_portal: 본 데이터는 지방세 부과액에 대한 세목별 징수현황을 상세히 제공합니다. 이는 각 지자체의 재정자주도 및 재정자립도를 산출하는 기초 자료로 활용되며, 납세자의 협력도와 조세 순응도를 확인하는 중요한 자료로 활용될 목적으로 수집되었습니다. 세부 항목은 취득세, 등록면허세, 재산세 등 주요 지방세 세목별 부과액 대비 징수액, 징수율, 체납액 등으로 구성됩니다. 이 자료는 투명하고 효율적인 지방세정 운영을 지원하고, 안정적인 지방재정 확보 및 지방세 정책 수립에 기여할 것으로 기대됩니다. 나아가 시민들의 지방세에 대한 이해를 높이는 데도 중요한 역할을 합니다.
