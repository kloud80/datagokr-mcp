description_portal: 이 데이터는 기술평가 업무에 활용되는 외부 정보제공사(Information Provider, IP) 현황을 정리한 자료입니다. 정보제공사는 기술 수준 분석, 산업 동향 파악, 특허 평가 등에 필요한 다양한 데이터를 유료로 제공하며, 기술보증기금 등 보증기관이 기술평가의 객관성과 신뢰성을 확보하기 위한 참고자료로 활용합니다.항목은 구분, 기술분야, 도메인명, 도메인주소, 특징으로 구성됩니다.**‘구분’**은 서비스 형태를 나타내며, 모두 유료 서비스입니다.**‘기술분야’**는 제공 정보의 주제 영역이며, 특허·법률, 기계, 기타 등으로 분류됩니다.**‘도메인명’**과 **‘도메인주소’**는 각각 서비스 명칭과 접속 URL을 의미하며,**‘특징’**에는 제공되는 콘텐츠나 서비스 성격이 간략히 기재되어 있습니다.예를 들어, 에프앤가이드(fnguide.com)는 증권사, 연구소 등에서 발간한 리서치 보고서를 종합 제공하는 플랫폼이며, DBpia(dbpia.co.kr)는 학술논문과 전자저널을 폭넓게 아우르는 학술정보 데이터베이스입니다.이 데이터는 각 평가기관이 정보제공사를 선택하거나 활용 범위를 설정하는 데 참고할 수 있으며, 기술분야별 정보 접근 경로 확보에도 도움이 됩니다.
