summary_user: 신용카드사별로 기준년월(basYm) 단위의 일반현황·재무현황·주요경영지표·주요영업활동을 담은 업권별 금융통계로, 금융회사 단위 원장이며 범위는 전국입니다. 분석가가 "어느 카드사의 자산·자기자본 규모와 연체율이 어떻게 변해 왔나"처럼 카드사 간 수익성·건전성·시장 점유율을 비교하는 질문에 쓴다. 법인등록번호(crno)가 실측 조인 키여서 금융위원회 기업기본정보·기업재무정보 등 법인등록번호를 가진 다른 금융회사·기업 데이터와 이어 쓴다.
