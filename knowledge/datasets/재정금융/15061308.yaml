description_portal: '금융통계신용카드사정보는 기준년월과 카드사명을 기준으로 신용카드사의 일반현황, 재무구조, 경영성과 및 주요 영업활동 정보를 제공하는 데이터입니다. 카드사의 시장 점유율, 수익성, 건전성 등을 종합적으로 분석할 수 있습니다.이 데이터는 4개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 신용카드사 일반현황 조회 : 설립일, 본점 소재지, 카드 발급사 현황 등 카드사 기본 정보를 제공합니다.② 신용카드사 재무현황 조회 : 자산, 부채, 자기자본 등 재무상태 항목을 조회할 수 있습니다.③ 신용카드사 주요경영지표 조회 : ROA, ROE, 총자산이익률 등 경영성과 지표를 제공합니다.④ 신용카드사 주요영업활동 조회 : 이용금액, 가맹점 수, 카드대금 연체율 등 카드사 영업실적을 제공합니다.'
