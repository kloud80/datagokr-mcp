description_portal: 본 데이터는 지방세 미환급 현황 및 연간 누적 정보를 제공한다. 과납 또는 과오납으로 납세자에게 환급해야 할 세금이 미처리된 상태를 나타낸다. 과세년도, 세목명, 미환급 유형, 납세자 유형, 미환급 건수, 미환급 금액 등의 항목을 포함한다. 과세년도는 세금 부과 기준 연도이며, 세목명은 취득세, 재산세 등 지방세법상 세금 종류이다. 미환급 유형은 환급 사유나 형태별 분류를 의미하고, 납세자 유형은 개인과 법인 등 대상자 구분을 표시한다. 미환급 건수는 환급 미완료 건수이며, 미환급 금액은 환급하지 못한 세액 총액이다. 본 데이터로 지방세 환급 업무 처리 현황과 미처리 규모를 파악할 수 있으며, 조세 행정 효율성 제고 및 납세자 권익 보호 기초 자료로 활용된다.
