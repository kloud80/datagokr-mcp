description_portal: 이 데이터는 전라남도 강진군의 지방세 과세 현황을 보여주는 자료로, 과세년도별 세목별 과세와 비과세 규모를 확인할 수 있습니다. 취득세, 등록세, 주민세, 재산세, 자동차세 등 다양한 세목에 대해 과세건수와 과세금액, 비과세 건수와 금액을 함께 제공하여 세수 구조와 비과세 비중을 분석할 수 있습니다. 주요 항목에는 시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 과세건수, 과세금액, 비과세건수, 비과세금액, 데이터기준일자가 포함됩니다.이 자료를 활용하면 강진군의 지방세 과세 기반과 세수 규모를 체계적으로 분석할 수 있으며, 과세와 비과세의 균형을 검토하여 세정 정책의 방향을 설정하는 데 유용합니다.
