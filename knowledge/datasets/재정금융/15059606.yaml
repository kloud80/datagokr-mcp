description_portal: '금융회사부보정보는 예금자보호 대상 금융회사 및 금융상품 현황을 종합적으로 제공하는 데이터입니다.데이터는 다음 3가지 오퍼레이션으로 구성되어 있습니다.① 부보대상 금융회사 조회 : 금융회사명 또는 고유번호를 기준으로 부보여부, 업권구분, 본점소재지, 인가일자 등을 조회하는 기능② 부보대상 금융상품 조회 : 금융회사별로 보호 대상이 되는 예금상품명, 상품유형, 예금자보호 적용 여부, 해지 조건 등을 조회하는 기능③ 부보대상 예금현황 조회 : 기준일자 및 금융회사명을 기준으로 예금총액, 부보금액, 미보호금액, 계좌수 등을 확인하는 기능※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
