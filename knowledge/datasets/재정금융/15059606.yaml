summary_user: 예금자보호 대상(부보) 금융회사의 부보 여부, 업권 구분, 부보 변경일 등을 금융회사 단위로 담은 API로, 검증 시 전국 118건이 수신됐고 기준일은 2015-10-14부터 2026-09-30까지다. 국민이나 분석가가 '이 금융회사는 예금자보호 대상인가, 어느 업권에 속하나' 같은 질문을 확인할 때 쓴다. 법인등록번호 키(crno, corp_rgst_no)로 같은 키를 쓰는 금융회사 기본·재무·지배구조 등 다른 금융회사 원장 데이터와 이어 쓰고, 퇴직연금·금융상품의 공급자 정보를 보강할 수 있다.
limits: 실측으로 호출에 성공한 것은 오퍼레이션 1개뿐이므로 포털 설명의 금융상품·예금현황 조회가 동일하게 동작하는지는 확인되지 않았다. 활용신청은 자동승인이며 개발계정은 일 10,000회로 제한된다. 실시간 데이터가 아니라 실측 최신 행은 2026-09-30(관측일 2일 전)이다.
