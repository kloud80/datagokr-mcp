description_portal: '일반손해보험가입정보는 기업이 가입한 일반손해보험(재물보험) 계약 정보를 제공하는 데이터입니다. 제공 항목에는 기준년도, 담보 구분(화재, 폭발 등), 물건 구분(공장, 창고 등), 계약 건수, 보험료 총액 등이 포함되어 있습니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 일반손해보험가입정보 조회 : 기준년도, 담보구분, 물건구분별 일반손해보험 가입 계약 건수 및 보험료 정보를 조회합니다.※ 일반손해보험이란? 상해, 질병, 배상책임, 화재 등 급격하고도 우연한 사고에 대비하여 경제적 손실을 보전할 목적으로 공동의 위험담보를 필요로 하는 사람들이 약정한 보험료를 납부하고, 사고 발생 시 발생한 손해를 약관에서 정한 바에 따라 보상(보험금)받게 되는 경제적 준비제도'
