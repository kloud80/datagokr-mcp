summary_user: 기업이 가입한 일반손해보험(재물보험) 계약을 기준년도·담보 구분(화재·폭발 등)·물건 구분(공장·창고 등)별로 묶어 계약 건수와 보험료 총액을 담은 전국 단위 집계 데이터이며, 개별 계약 건이나 지역 구분은 없다. 보험업계 분석가나 정책 담당자가 '공장·창고 같은 물건 유형별로 화재보험 계약이 몇 건이고 보험료 규모는 얼마인가, 해마다 어떻게 바뀌었나'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준년도나 담보·물건 구분 이름을 맞춰 붙이는 방식으로만 연결한다.
limits: 전국·비공간 집계라 시도·시군구별 가입 현황이나 개별 기업·계약 단위 분석은 할 수 없다. 공통 코드 키가 없어 다른 보험·금융 데이터와 결합할 때는 담보·물건 구분명을 직접 매핑해야 한다. 개발계정 호출은 일 10,000회로 제한된다.
