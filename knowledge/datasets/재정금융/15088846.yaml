summary_user: 경기도와 경기신용보증재단이 운용하는 중소기업육성자금(G-money)의 지원 내역을 신청 건별로 담으며, 시군·관할 지점, 신청·결정·대출일자와 금액, 자금명·용도, 금리 구분과 고객 부담 금리, 대출은행, 대출잔액, 업종, 진행현황이 들어 있다. 분석가나 지자체 담당자가 '어느 시군·업종의 소상공인에게 운전자금이 얼마나, 어떤 금리로 나갔는가'를 따질 때 쓴다. 전역 조인 키는 없어 시군명(sigun_nm)이나 업종코드(indutype_cd)를 이름·코드로 맞춰 다른 지역·업종 통계와 연결한다.
description_portal: 이 데이터는 경기도 및 경기신용보증재단에서 운용하는 경기도 중소기업육성자금의 G-money 지원 현황에 대한 자료로, 각 신청자의 관할 시군명, 신청·결정·대출일자, 자금명 및 용도, 금리정보, 담보종류, 대출은행, 대출잔액, 업종 및 업종코드 등 상세정보를 포함합니다. 자금은 주로 소상공인 운전자금 및 경영개선자금 등으로 구성되며, 금리구분(고정/변동), 접수방법(내방 등), 진행현황 등이 함께 제공됩니다. 이 자료는 정책금융지원의 투명성 제고, 지역별 자금 운용 분석, 소상공인 지원정책 개선 및 자금 흐름의 모니터링에 활용될 수 있습니다.
