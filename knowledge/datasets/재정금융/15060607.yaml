summary_user: 정기보고서(사업·반기·분기보고서)에 기재된 회사별 배당 사항을 담으며, 보고서 한 건마다 배당 항목(se)과 주식 종류별로 당기·전기·전전기 값을 결산기준일과 함께 제공한다. 투자자나 분석가가 '이 상장사의 주당 배당금과 배당성향이 최근 3개 기수 동안 어떻게 변했나'를 확인할 때 쓴다. 전역 조인 키는 없으므로 같은 기관(DART)의 회사 고유번호(corp_code)나 접수번호로 다른 DART 공시와 잇고, 금융위 기업정보 등 법인등록번호 기반 데이터와는 회사명이나 코드 매핑을 거쳐 연결한다.
