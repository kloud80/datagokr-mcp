description_portal: 이 데이터파일은 인천광역시 계양구의 지방세 부과액에 대한 세목별 징수현황을 체계적으로 정리한 자료입니다. 주요 항목으로는 각 세목별로 부과된 금액을 나타내는 세목별 부과금액, 실제 징수된 금액인 수납금액, 납세자에게 환급된 금액인 환급금액, 회수가 어려운 금액인 결손금액, 아직 징수되지 않은 금액인 미수납금액, 그리고 부과금액 대비 징수 비율을 보여주는 징수율이 포함되어 있습니다. 이 데이터는 지방세 징수 실적을 상세히 파악하고, 효율적인 세무 행정 운영과 재정 건전성 확보에 중요한 기초 자료로 활용됩니다. 또한 세목별 징수 현황 분석을 통해 징수율 향상 및 부과금액 관리에 도움을 줍니다.추가 문의사항은 **인천광역시 계양구 세무1과(032-450-5223)**로 연락해 주시기 바랍니다.
