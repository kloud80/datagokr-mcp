description_portal: 「안동시 대표홈페이지 안동사랑상품권 정보」 데이터는 지역경제 활성화와 소상공인 지원을 위해 운영 중인 안동사랑상품권의 발행·유통 현황 및 이용 관련 정보를 체계적으로 제공하는 자료입니다. 본 데이터에는 상품권의 종류(종이·모바일), 판매 및 환전처 위치, 취급 가능 가맹점 정보, 구매 한도, 할인 판매 기간, 유효기간, 이용 규정 등 시민과 가맹점이 필요로 하는 필수 정보가 포함됩니다. 또한 상품권 운영 부서에서 수집·관리하는 최신 정보를 기반으로 정기적으로 갱신되며, 시민·소상공인·유관기관이 지역사랑상품권을 보다 효율적으로 활용할 수 있도록 투명성과 접근성을 강화하는 것을 목적으로 합니다.
