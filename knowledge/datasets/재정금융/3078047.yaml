summary_user: 인천광역시 계양구 관내에 등록된 대부업체를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록 업종·등록증번호·상호·소재지·등록일자를 포함합니다(CSV 약 6.9KB, 시군구 범위의 개별 주소 단위). 주민이 거래하려는 대부업체가 계양구에 정식 등록된 곳인지, 언제 등록했는지 확인하거나 분석가가 관내 대부업체 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 시군구 대부업 등록 현황과는 상호·등록증번호를 이름 매칭하거나 소재지 주소를 기준으로 붙여 쓴다.
description_portal: 이 데이터는 인천광역시 계양구 관내 대부업 등록 현황을 상세히 담고 있습니다. 주요 항목으로는 순번, 시군구명, 등록신청사업, 등록증번호, 상호, 대표자, 소재지(도로명주소), 등록일자 등이 포함되어 있습니다. 이를 통해 대부업체의 기본 정보와 등록 상태, 위치 등을 한눈에 파악할 수 있습니다. 데이터는 행정기관에서 제공하며 정기적으로 갱신되어 최신 정보를 유지합니다. CSV 형식으로 제공되어 다양한 분석 및 행정 업무에 활용 가능하며, 금융 관련 규제 준수 확인 및 지역 경제 관리에 유용합니다. 공공데이터포털에서 누구나 무료로 다운로드할 수 있습니다.
