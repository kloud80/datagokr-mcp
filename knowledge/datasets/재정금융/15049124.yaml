description_portal: 서울시 시민참여예산 제안사업 위원투표여부 데이터는 참여예산위원들이 제안사업에 대한 투표에 실제로 참여했는지를 기록한 공공데이터입니다. 회계년도는 해당 투표가 이루어진 연도를 나타내며, 참여예산위원코드는 개별 위원을 식별하기 위한 내부 관리용 코드로 개인정보를 보호하면서 위원 단위 참여 분석이 가능하도록 합니다. 위원코드구분은 시민위원, 공무원, 전문가 등 위원의 유형이나 역할을 구분하는 항목으로, 위원 특성에 따른 참여도 차이를 분석하는 데 활용됩니다. 구별 참여예산 제안사업 투표여부와 자치구별 참여예산 제안사업 투표여부는 각 위원이 자치구 단위로 진행되는 제안사업 투표에 실제 참여했는지를 예·아니오 형태로 표시한 값으로, 이를 통해 연도별·유형별·자치구별 위원 투표 참여율과 참여 패턴을 파악하는 데 활용할 수 있는 데이터입니다.
