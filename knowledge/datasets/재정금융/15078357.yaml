description_portal: '이 데이터는 경상북도 봉화군의 지방세 체납 현황을 연도별, 세목별, 체납액 구간별로 보여주는 통계 자료입니다. 각 세목에 대해 체납건수, 체납금액, 그리고 해당 항목의 누적 체납건수와 누적 체납금액이 포함되어 있습니다. 이를 통해 특정 세목의 체납 추세나 체납 집중 구간 등을 파악할 수 있으며, 자치단체의 체납 관리 정책 수립과 세입 증대 방안 마련에 활용될 수 있습니다. 특히 체납규모별 분석이 가능하다는 점에서 실효성 있는 징수 대책 수립에 기초자료로 유용합니다.[제공 컬럼 설명]시도명: 경상북도 등 시·도 단위의 명칭시군구명: 봉화군 등 시·군·구 단위의 명칭자치단체코드: 행정구역을 구분하기 위한 고유 코드 (예: 47920)과세년도: 해당 데이터의 기준 연도 (예: 2017~2023)세목명: 해당 지방세의 종류 (예: 재산세, 취득세, 자동차세 등)체납액구간: 체납 금액이 속한 구간 (예: 10만원 미만, 10~30만원 미만 등)체납건수: 해당 구간에서의 체납 발생 건수체납금액: 해당 구간에서의 총 체납 금액 (단위: 원)누적체납건수: 해당 연도까지 누적된 체납 건수누적체납금액: 해당 연도까지 누적된 체납 금액 (단위: 원)'
