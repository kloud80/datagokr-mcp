description_portal: 세출 및 지출 세부사업 예산편성현황(총지출)은 중앙행정기관의 분야·부문·세부사업별 예산 현황을 총지출 기준으로 집계·제공하는 재정 통계 자료입니다.(정부안과 국회 확정 예산 금액 비교가 가능하며, 각 사업의 구체적인 재정투입 계획을 한눈에 파악할 수 있도록 구성되어 있습니다.)총지출은 예산회계상의 총지출액으로, 내부거래와 보전거래를 제외하지 않고 집계한 정부 재정규모를 의미하며, 재정정책의 총량 효과를 파악하는 지표로 활용됩니다.[데이터 주요 항목 및 특징]1. 데이터 범위   * 중앙행정기관의 분야·부문·세부사업별 예산 현황   * 부처명, 회계명, 분야·부문·프로그램·단위사업·세부사업명 등 포함2. 정부안 vs 국회 확정 비교   * 각 세부사업별로 정부안 대비 국회에서 조정된 예산 금액 확인 가능   * 국회 심의과정에서 증액·삭감된 항목 및 금액 분석 가능3. 총지출 기준 제공   * 내부거래, 보전거래 등을 제외하지 않은 총액 기준 데이터   * 재정정책 총량 효과와 규모 분석에 활용4. 예산구분   * 본예산   * 추가경정예산(추경) 포함 가능5. 활용 예시   * 부처별·분야별 총지출 규모 분석   * 국회 예산심의로 인한 재정 배분 변동 파악   * 정책 분야별 예산 증감 원인 분석   * 재정투입 우선순위 평가 자료로 활용6. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 파일형식 다운로드 가능   * Open API를 통해 연도, 부처, 분야, 세부사업 등 조건별 조회 지원본 자료는 정부 예산의 투명성을 높이고 국민의 알권리 충족은 물론, 연구기관·언론·일반 국민의 정책 분석 자료로서 매우 유용하며, 재정정책 수립과 정책 효과 평가에도 폭넓게 활용됩니다.
