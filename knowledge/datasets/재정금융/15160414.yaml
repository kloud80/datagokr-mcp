description_portal: 이 데이터는 신용보증기금의 경영지원 업무 중 홈페이지 예약 및 시설대여 관련 현황을 집계한 자료로, 경영지원_대고객서비스_조회_기간_설정_내역, 홈페이지_예약_시설대여_정보, 컨설팅서비스_혁신_스타트업_내역 등의 테이블을 포함하고 있다. 본 데이터는 대고객 서비스 조회 기간 설정 내역, 홈페이지 시설대여 예약 및 관련 컨설팅 서비스 등 경영지원 관련 업무의 기본적인 관리 현황을 제공함으로써, 관련 분야의 전반적인 업무 흐름을 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터 내 ‘홈페이지_예약_시설대여_정보’는 시설 대여 이용 및 예약 관련 업무의 대략적인 추이를 살펴보는 데 활용될 수 있으며, ‘컨설팅서비스_혁신_스타트업_내역’ 등은 지원 서비스 운영 과정에서의 단편적인 경향성을 파악하는 기초 자료를 제공한다.
