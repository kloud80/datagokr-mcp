description_portal: 한국수력원자력(주)이 공개하는 유무형자산 정보데이터입니다. 유형자산은 기업이 재화나 용역의 생산 또는 제공, 타인에 대한 임대, 또는 관리활동에 사용할 목적으로 보유하는 물리적 형태의 자산이며, 무형자산은 물리적 실체는 없지만 식별할 수 있고, 기업이나 기관이 통제하며 장기간에 걸쳐 경제적 효익을 제공할 수 있는 비화폐성 자산입니다. 한국수력원자력(주)이 제공하는 해당 데이터는, 2025년 기말 기준 한국수력원자력(주)의 유형자산과 무형자산의 세부정보로 자산별 소재지, 기초장부가액, 증가금액, 감소금액, 상각금액, 기말장부가액 항목으로 구성되어 있습니다. 별도재무제표 기준으로 작성되었습니다. - 감가상각 자산이 아니거나 처분 등 해당 자산의 장부가액을 감소시키는 사유가 없을 경우, 해당 항목의 값이 0으로 표기됩니다.
