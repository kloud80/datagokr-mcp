description_portal: '2014년부터 2023년까지 직접국세, 간접국세 , 관세 등 조세지출액 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*2021년까지는 결산, 2022년은 2차 추가경정예산, 2023년은 예산안 기준으로 작성되었습니다.조세지출: 조세의 일반적인 조세체계에서 벗어난 조세특례에 의하여 납세자에 대한 재정지원을 목적으로 발생하는 국가 세입의 감소조세지출예산제도: 재원배분의 효율성 및 재정운영의 투명성을 제고하기 위해 정부가 국회에 다음 연도 예산안을 제출할 때 3개 연도의 조세지출 실적과 전망을 집계·분석하여 조세지출의 관리와 통제가 가능하도록 하는 제도'
