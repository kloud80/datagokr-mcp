description_portal: KOTRA에서 공공데이터포털에 제공하고 있는 국가별 투자유치 현황(신고기준) 데이터는 2014년부터 2025년까지 국별 투자 신고금액 정리한 데이터 입니다. 이 데이터는 특정 국가들에 대한 외국인 직접 투자(FDI, Foreign Direct Investment) 현황을 기반으로 하며, 각국의 경제 환경, 투자 유치 정책, 산업별 투자 동향 등을 분석한 자료입니다. 각 연도별로 외국인 투자가 어떻게 변화했는지에 대한 통계 정보를 제공하며, 이를 통해 국가별 투자 동향을 파악할 수 있습니다. 이 데이터는 해외 진출을 고려하는 기업들이 어떤 국가가 외국인 투자에 유리한지 파악할 수 있도록 지원합니다.
