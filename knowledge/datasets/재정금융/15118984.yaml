summary_user: 온라인수출플랫폼(고비즈코리아)에 등록된 국가별 기본정보를 국가 한 건당 한 행으로 담은 코드성 기준표로, 국가코드(문자·숫자), 국제전화번호, 국가도메인, 한글·영문·중문 국가명과 EMS·DHL 배송 가능 여부, PayGos 결제 사용 가능 여부를 포함한다. 해외 바이어에게 온라인으로 판매하려는 중소기업이 "이 나라로 EMS나 DHL 배송이 되고 PayGos 결제를 쓸 수 있는가"를 확인하거나, 분석가가 국가코드를 한글·영문·중문 국가명으로 바꿀 때 쓴다. 국가코드(country_cd)를 조인 키로 삼아 고비즈코리아 상품·기업 데이터나 국가별로 집계된 수출입 실적 같은 다른 무역 데이터와 이어 쓴다.
description_portal: 온라인수출플랫폼(Gobizkorea)에 등록된 국가의 기본정보 데이터를 제공합니다.주요 제공데이터는 국가코드, 국가코드(숫자), 국가전화번호, 국가도메인, 국가한글명, 영문명, 중문명, EMS 배송가능 여부, DHL 배송가능여부, PayGos 사용가능 여부 등이 있습니다.* 온라인수출플랫폼(Gobizkorea)은 해외 시장에 온라인 판매를 희망하는 국내 중소기업이 해외 바이어를 대상으로 상품을 홍보하고, 수출거래 협상을 할 수 있도록 지원하는 온라인 B2B 수출플랫폼입니다.
