description_portal: 국가의 재정증권 발행 및 상환내역 정보를 제공하는 데이터입니다. 본 자료는 중앙정부의 유동성 확보를 위해 발행되는 재정증권의 발행요청일, 발행금액, 이율, 상환일, 상환금액 등의 항목별 내역을 포함하고 있으며, 예산·결산·성과관리·국가채무 등 전반적인 재정 흐름을 분석하는 데 활용됩니다. 각 내역은 발행일자 기준으로 정리되어 있으며, 월별 또는 분기별 통계분석에 유용한 기준 정보를 제공합니다. 해당 데이터는 국가의 단기 채무 운용 현황을 파악하는 데 필수적인 자료로서, 효율적인 재정 운용과 재정투명성 강화를 위한 참고 지표로 활용될 수 있습니다. 공공저작물로 제공되며, 데이터 이용 시 관련 저작권 정보를 반드시 확인하시기 바랍니다
