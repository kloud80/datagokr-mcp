description_portal: '이 데이터는 봉화군의 지방세 징수현황을 포함하고 있습니다. 각 항목별로 부과된 세금, 수납된 금액, 환급된 금액, 결손된 금액, 미수납된 금액, 징수율 등이 제공됩니다.[제공 컬럼내용] - 시도명: 세금을 부과한 지역의 시도명 (예: 경상북도) - 시군구명: 세금을 부과한 지역의 시군구명 (예: 봉화군) - 자치단체코드: 자치단체를 구분하는 고유 코드 (예: 47920) - 과세년도: 세금이 부과된 연도 (예: 2017, 2018) - 세목명: 부과된 세목의 이름 (예: 재산세, 취득세, 자동차세 등) - 부과금액: 해당 세목에 대해 부과된 총 세액 (금액 단위: 원) - 수납급액: 부과된 세액 중 실제로 수납된 금액 (금액 단위: 원) - 환급금액: 과오납, 세금 환급 등의 이유로 환급된 금액 (금액 단위: 원) - 결손금액: 징수되지 않은 금액으로, 세금 징수에 실패한 금액 (금액 단위: 원) - 미수납 금액: 부과된 세액 중 납부되지 않은 금액 (금액 단위: 원) - 징수율: 부과된 금액 대비 실제 수납된 금액의 비율 (백분율로 표시)본 데이터의 제공 기준일은: 2024년 12월 31일입니다. (2017~2024년)'
