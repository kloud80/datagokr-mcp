description_portal: '강원특별자치도 동해시 지방세 미환급 현황은 지방세가 납세자에게 과오납되거나 감면 등으로 인해 환급 결정되었으나, 납세자가 아직 찾아가지 않아 동해시가 보관하고 있는 환급금의 현황을 담고 있는 데이터입니다. 이는 지방세 행정의 투명성을 높이고, 납세자의 권리를 보호하며, 미환급금의 효율적인 정리를 돕기 위해 공개됩니다.이 공공 데이터의 활용 목적은 다음과 같습니다.납세자 권리 보호: 납세자가 자신에게 돌아갈 정당한 환급금을 인지하고 찾아갈 수 있도록 정보를 제공하여 납세자의 권익을 보호합니다.지방세 행정 투명성 제고: 미환급금 현황을 공개함으로써 지방세 행정의 투명성과 신뢰성을 높입니다.'
