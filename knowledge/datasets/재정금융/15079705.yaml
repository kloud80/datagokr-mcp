description_portal: '본 자료는 인천시의 재정 건전성 및 세정 운영 효율성을 분석하는 데 필수적인 핵심 정보를 담고 있습니다. 주요 칼럼은 다음과 같습니다.세목별 (2): 지방세의 종류 (취득세, 재산세, 자동차세, 지방소득세 등)부과액 (천원): 해당 기간 동안 납세의무자에게 부과된 총 금액징수액 (천원): 실제로 징수된 금액미수액 (천원): 징수하지 못한 체납액징수율 (%): 부과액 대비 징수액의 비율특히, 현년도 수입과 과년도 수입으로 구분하여 시간 흐름에 따른 징수 관리 실태를 파악할 수 있습니다. 이 데이터는 지방재정 연구, 조세 정책 효과 분석, 세수 예측, 그리고 시민들의 투명한 재정 감시에 활용됩니다.해당 데이터는 국가통계포털(KOSIS)와 공공데이터포털에서 무료로 확인할 수 있습니다.'
