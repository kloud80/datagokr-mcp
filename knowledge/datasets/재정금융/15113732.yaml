description_portal: '국세징수법제2조(정의) ① 이 법에서 사용하는 용어의 뜻은 다음과 같다.  1. “납부기한”이란 납세의무가 확정된 국세(가산세를 포함한다. 이하 같다)를 납부하여야 할 기한으로서 다음 각 목의 구분에 따른 기한을 말한다.    가. 법정납부기한: 국세의 종목과 세율을 정하고 있는 법률, 「국세기본법」, 「조세특례제한법」 및 「국제조세조정에 관한 법률」에서 정한 기한    나. 지정납부기한: 관할 세무서장이 납부고지를 하면서 지정한 기한  2. “체납”이란 국세를 지정납부기한까지 납부하지 아니하는 것을 말한다. 다만, 지정납부기한 후에 납세의무가 성립ㆍ확정되는 「국세기본법」 제47조의4에 따른 납부지연가산세 및 같은 법 제47조의5에 따른 원천징수 등 납부지연가산세의 경우 납세의무가 확정된 후 즉시 납부하지 아니하는 것을 말한다.  3. “체납자”란 국세를 체납한 자를 말한다.  4. “체납액”이란 체납된 국세와 강제징수비를 말한다.  ② 제1항제1호를 적용하는 경우 다음 각 호의 기한은 지정납부기한으로 본다. 다만, 「소득세법」 제65조제4항, 「부가가치세법」 제48조제4항 후단 및 같은 법 제66조제3항, 「종합부동산세법」 제16조제3항 후단에 따라 세액의 결정이 없었던 것으로 보는 경우는 제외한다.  1. 관할 세무서장이 「소득세법」 제65조제1항 전단에 따라 중간예납세액을 징수하여야 하는 기한  2. 관할 세무서장이 「부가가치세법」 제48조제3항 본문 및 같은 법 제66조제1항 본문에 따라 부가가치세액을 징수하여야 하는 기한  3. 관할 세무서장이 「종합부동산세법」 제16조제1항에 따라 종합부동산세액을 징수하여야 하는 기한  ③ 제1항 및 제2항에서 정하는 것 외에 이 법에서 사용하는 용어의 뜻은 「국세기본법」에서 정하는 바에 따른다.2025년 12월 말 기준 누계 체납액 현황누계체납액은 정리중체납 금액과 정리보류 금액을 합한 금액임누계체납건수(금액)은 누계체납액 규모별 해당 납세자가 보유한 총 체납 건수(금액)임'
