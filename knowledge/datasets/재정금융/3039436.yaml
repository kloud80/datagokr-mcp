description_portal: 'ㅇ 한국에 대한 외국의 수입규제 현황 정보 제공 : 관리번호, 규제국, 품목명, 규제내용, 조사개시일, 규제상태, 최근갱신일ㅇ 용어 설명 - 덤핑 : 어떤 물품이 자국 내 정상가격(Normal Value)보다 낮은 가격으로 타국의 상업권 내에 도입되는 것을 의미함. 자국으로부터 타국으로 동종 물품의 수출가격이 자국에서 소비용으로 판매되고 있는 동종 물품에 대한 통상의 상거래(In the Ordinary Course of Trade)에서의 비교 가능한 가격(Comparable Price)보다 낮을 경우 성립함 - 반덤핑관세 : 정상적인 가격보다 부당하게 저렴한 가격으로 수입되는 물품으로 인해 국내 산업이 피해를 입거나 입을 우려가 있을 경우 이를 방지하고 공정한 거래를 확보하기 위해 기본관세율에 추가되어 수입품에 부과하는 특별 관세를 말함 - 긴급수입제한조치 : 수입 급증으로 인하여 국내 산업에 심각한 피해가 있을 경우 수입국이 취할 수 있는 잠정적인 수입제한조치을 말함. 긴급수입제한조치는 덤핑, 보조금 지급과 달리 발동 요건이 보다 엄격하며, 한시적으로 발동해야 함 - 상계관세 : 외국에서 제조, 생산 또는 수출에 관하여 직접 혹은 간접적으로 보조금 또는 장려금을 받은 물품의 수입으로 국내 산업이 실질적인 피해를 받거나 받을 우려가 있는 경우 또는 국내 산업의 설립이 실질적으로 지연되었음이 수입당국의 조사를 통하여 확인되고 당해 국내 산업을 보호할 필요가 있다고 인정될 경우 일반관세에 추가하여 부과되는 관세를 말함'
