description_portal: 이 자료는 금융기관 및 유관기관을 통해 기술보증이 실행된 기업 중 사고(채무불이행)가 발생한 실적을 기관별로 집계한 것입니다. 보증사고는 기술보증제도의 리스크 수준과 건전성을 가늠하는 핵심 지표로, 건수와 금액 외에도 전체 보증 대비 사고금액의 비율인 사고율을 함께 제공하여 상대적인 위험도를 비교할 수 있도록 구성되어 있습니다.주요 항목은 다음과 같습니다.**‘연도’**는 사고 내역이 기록된 기준 시점을 의미하며,**‘구분’**은 보증을 수행한 금융기관 또는 보증 대상 기관을 나타냅니다.**‘사고건수(건수)’**는 보증사고가 발생한 건수,**‘사고금액(억원)’**은 사고로 인해 발생한 손실 금액의 총합,**‘사고율(퍼센트)’**은 보증 실적 대비 사고금액의 비율로, 상대적 리스크 수준을 나타냅니다.예를 들어, 일부 기관은 사고 건수나 금액이 크지 않더라도 전체 보증 규모가 작을 경우 높은 사고율을 보일 수 있습니다. 반대로, 보증 공급량이 많은 기관은 사고 규모가 크더라도 사고율은 상대적으로 낮게 나타날 수 있습니다.따라서 이 데이터는 단순 사고 비율에 의존하기보다 전체 보증공급 실적과 함께 해석해야 하며, 기관별 보증 리스크 분포, 사후관리 실태, 정책보증의 운영 건전성을 종합적으로 진단하는 데 활용할 수 있는 기초자료입니다.
