description_portal: 이 데이터는 기술보증기금이 소셜벤처기업을 대상으로 제공하는 임팩트보증의 연도별 지원 실적을 요약한 자료입니다. ‘임팩트보증’은 사회적 가치와 혁신성, 지속 가능성을 갖춘 소셜벤처기업의 자금 조달을 지원하기 위해 도입된 전용 보증제도로, 일반 보증에 비해 우대조건이 적용됩니다. ** ‘신규보증’**은 해당 연도에 새로 보증을 받은 실적이며, **‘보증잔액’**은 현재까지 보증이 유지되고 있는 누적 규모를 나타냅니다. 이를 통해 소셜벤처에 대한 정책금융의 도달 범위와 누적 지원 수준을 파악할 수 있으며, 플랫폼(sv.kibo.or.kr)을 통해 관련 정보가 공개되어 소셜벤처 생태계의 투명성과 신뢰성 확보에 기여하고 있습니다.
