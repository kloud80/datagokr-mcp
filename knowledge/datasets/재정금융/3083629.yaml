description_portal: 이 데이터는 기술보증기금 등 기술평가를 수행하는 기관에서 외부 전문기관의 자문을 받기 위해 위촉한 외부자문기관의 현황을 정리한 공공데이터입니다. 기술평가는 기업의 기술력, 사업성, 재무건전성 등을 종합적으로 판단하는 과정으로, 각 분야의 전문성을 갖춘 외부 기관이 자문 역할을 수행합니다. 해당 자료는 위촉된 자문기관의 명칭, 지역, 위촉일자, 자문분야 등의 정보를 포함하고 있습니다.**‘회사명’**은 자문기관의 공식 명칭으로, 회계법인, 특허법인, 기술협회 등 다양한 형태의 민간·비영리 기관이 포함됩니다.**‘지역’**은 기관의 주 사무소 소재지를 나타내며, 서울특별시를 중심으로 경기도, 광주광역시, 대전광역시 등지에도 분포되어 있습니다.**‘위촉일자’**는 해당 기관이 외부자문기관으로 지정된 날짜이며, 활동 시작 시점을 파악하는 데 활용됩니다.**‘자문분야’**는 각 기관이 자문하는 기술 영역으로, 재무회계, 특허법률, 바이오기술, 고분자화학/폴리머, 공작기계, 마이크로구조/나노기술 등 다양한 분야가 포함되어 있습니다.이 데이터는 기술평가 수행 시 어떤 기관이 어떤 분야에 자문을 제공할 수 있는지를 확인하는 데 유용합니다. 또한, 위촉 현황을 바탕으로 지역별 전문기관 분포를 확인하는 데에도 참고할 수 있습니다.
