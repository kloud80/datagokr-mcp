description_portal: '금융통계증권사정보는 기준년월을 중심으로 증권사의 일반 현황, 재무 상태, 주요 경영지표, 영업활동 실적, 보도자료 기반 통계정보 등을 제공하는 데이터입니다. 증권사별 조직 규모, 자산 현황, 수익 구조, 주요 영업 부문별 실적 등을 종합적으로 확인할 수 있도록 시계열 데이터로 구성되어 있습니다.이 데이터는 5개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 증권사 일반현황 조회 : 증권사별 인가일자, 본점·지점 수, 임직원 수 등의 조직 및 기본 정보를 조회합니다.② 증권사 재무현황 조회 : 자산총액, 자기자본, 영업수익, 순이익 등 재무 항목을 조회합니다.③ 증권사 주요 경영지표 조회 : 수익성, 안정성, 성장성 등 핵심 경영지표를 제공합니다.④ 증권사 주요 영업활동 조회 : 위탁매매, 인수, 자기매매, 자산관리, 신용공여 등 주요 영업 항목별 실적을 조회합니다.⑤ 증권사 보도자료 통계정보 조회 : 보도자료에 포함되는 증권사별 요약 통계 정보(예: 주요지표 요약)를 제공합니다.'
