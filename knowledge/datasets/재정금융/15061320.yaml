summary_user: 증권사별로 기준년월(basYm)마다 일반현황·재무현황·주요 경영지표·주요 영업활동·보도자료 요약 통계를 담은 전국 단위 시계열 데이터로, 금융회사 하나를 단위로 한 원장 성격의 자료다. 분석가나 투자자가 "특정 증권사의 임직원 수와 지점 수가 최근 몇 년간 어떻게 바뀌었고, 자기자본·순이익은 어느 수준인가"를 확인할 때 쓴다. 법인등록번호(crno)가 실측 조인 키라서 금융위 기업정보·공시 재무 데이터 등 법인등록번호를 가진 다른 데이터와 이어 쓰고, 금융회사 코드(fncoCd)와 회사명으로 업권별 금융통계와 맞춰 볼 수 있다.
limits: 지역을 나누지 않은 전국·비공간 자료라서 지점 위치나 지역별 분석에는 쓸 수 없다. 실호출 검증은 5개 오퍼레이션 중 1개에서만 성공이 확인됐으므로 나머지 오퍼레이션은 직접 호출해 응답을 확인해야 하고, 개발계정 호출 한도는 일 10,000회다.
