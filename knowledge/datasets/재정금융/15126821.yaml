description_portal: '예금보험공사의 정보화사업 추진 현황으로 사업연도, 사업명, 사업시작일, 사업종료일, 계약금액에 대한 정보를 제공합니다.정보화사업 : 업무의 효율성 향상과 서비스 개선을 목적으로 정보시스템을 기획·구축·운영·유지보수하거나, 정보화전략계획 수립, 소프트웨어 개발, 데이터베이스 구축, 정보시스템 감리, 전자정부사업관리의 위탁 등 정보화와 관련된 일련의 사업데이터 갱신주기 : 해당 데이터는 당해년도 정보화 추진 계획 수립 이후 연 1회 업데이트 됩니다.사업종료일 : 종료되지 않은 사업의 경우 사업종료예정일을 의미하며 추후 변경될 수 있습니다.계약금액 : 금액 단위 백만이며, 십만 단위에서 반올림 됩니다.'
