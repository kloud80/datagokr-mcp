description_portal: 부산광역시 사상구의 재정정보공개시스템에 대한 데이터로  통합지방재정시스템과 연계된 정보가 조회됩니다. 일자별 예산현액, 총수입액(당일 수입액, 누계액), 총지출액(당일 지출액, 누계액), 자금잔액합계 등의 내역을 제공합니다. 일간, 주간, 월간 각각의 조건으로도 조회가 가능하며 엑셀 다운로드 및 페이지 출력 등도 가능합니다. 또한 회계연도별 조회가 가능하여 지난 회계연도에 대해서도 확인이 가능하며 해당 데이터를 통해 사상구의 일자별 예산현액, 수입액, 지출액, 자금총액 등이 확인 가능하여 재정운용의 개방성 및 투명성을 확보할 수 있습니다.
