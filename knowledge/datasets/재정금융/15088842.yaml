summary_user: 경기신용보증재단이 창업기업에 제공한 신용보증 실적을 시군과 연도별로 보증 건수와 보증 금액으로 집계한 자료입니다. 지자체 담당자나 분석가가 경기도 안에서 어느 시군에 창업 보증이 많이 몰렸고 해마다 규모가 어떻게 바뀌었는지 비교할 때 씁니다. 전역 조인 키가 없어서 다른 데이터와는 시군 이름(sigun_nm)과 기준연도를 이름 매핑하는 방식으로만 이어 붙입니다.
description_portal: 이 데이터는 경기신용보증재단을 통해 창업기업에 제공된 신용보증 실적을 지역과 연도 단위로 정리한 자료입니다. 어느 지역에서 어느 해에 얼마나 보증이 이뤄졌는지(건수·금액)를 파악할 수 있어 지역별 창업 생태계의 금융 접근성과 지원 강도를 비교·분석하는 데 유용합니다. 이를 바탕으로 지자체와 유관기관은 정책자금 배분, 창업 집중 지역·시기 파악, 재원 운용 전략 수립에 참고할 수 있으며, 연구·현장에서는 보증 규모 변화 추이, 지역 간 격차 분석, 창업 초기 자금조달 여건 평가 등에 활용할 수 있습니다. 해석 시에는 동일 지역의 명칭 표기 일관성과 연도 간 기준의 변화 여부를 점검하여 시계열 비교의 정확성을 확보하는 것이 좋습니다.
