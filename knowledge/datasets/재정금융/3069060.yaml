description_portal: '(부보금융회사 종합정보)부보금융회사에 보험사고가 발생하였을 경우 공사는 예금보험금을 지급하며, 해당 데이터는 부보금융회사의 예금자에 대해 공사가 지급한 예금보험금의 부실금융회사 및 연도별 지급건수와 금액에 대한 정보이다. 2009년 이후 예금보험금의 연도별  보험사고 발생 부보금융회사와 그 회사에 대해 지급한 예금보험금의 지급건수 및 금액.2009년 이후 지급된 예금보험금은 총 44개의 부실금융회사에 약14조 9400억원, 총 1,005,027건.예금보험금 지급 부실금융회사(저축은행) : 국민, 김천, 분당, 좋은, 현대(전북), 한중, 플러스, 전북, 한나라, 으뜸, 전일, 대운, 홍익, 경북, 파랑새, 프라임, 상화, 제일(서울), 중앙부산, 제일2, 부산, 부산2, 에이스, 토마토, 대영, 도민, 대전, 전주, 보해, 경은, 솔로몬, 더블유, 진흥, 한국(서울), 토아토2, 한주, 미래(제주), 서울, 영남, 신라, 경기, 한울, 스마일, 해솔※데이터를 집계한 기준일은 2025-12-31'
