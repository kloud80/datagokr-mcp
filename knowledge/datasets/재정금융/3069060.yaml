summary_user: 2009년 이후 예금보험공사가 보험사고가 난 부보금융회사(주로 저축은행)의 예금자에게 지급한 예금보험금을 연도·부실금융회사별 지급건수와 지급금액(원)으로 집계한 파일이다. 특정 저축은행 부실 때 예금보험금이 얼마나, 몇 건 지급됐는지 또는 연도별 예금보험금 지급 규모가 어떻게 변했는지를 확인하려는 분석가·연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 금융회사 원장·영업정지·파산 데이터와는 금융회사 이름으로만 맞춰 이어야 한다.
