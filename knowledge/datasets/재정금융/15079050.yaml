description_portal: 본 데이터는 지방세 등 세입과 관련하여 발생한 미환급금의 현황과 연도별 누적 추이를 체계적으로 제공하기 위한 자료이다. 제공 항목은 과세년도, 미환급유형, 납세자유형, 당해미환급금, 누적미환급금, 누적미환급금액증감으로 구성되며, 이를 통해 특정 연도에 발생한 미환급 규모와 누적 잔액의 변동 현황을 함께 파악할 수 있다. 미환급유형은 과오납, 이중납부, 감액경정, 환급통지 미수령 등 환급사유의 유형을 구분한 항목이며, 납세자유형은 개인, 법인 등 환급 대상의 특성을 나타낸다. 당해미환급금은 해당 과세연도에 새로 발생하였으나 반환되지 않은 금액을 의미하고, 누적미환급금은 해당 연도 말까지 환급되지 않고 남아 있는 총 잔액을 의미한다. 누적미환급금액증감은 전년도 대비 누적 미환급금의 증가 또는 감소 규모를 나타내는 지표로서, 환급업무 처리 실적과 체납·환급 관리 효율성을 분석하는 데 활용될 수 있다. 본 자료는 지방세 환급행정의 투명성 제고, 납세자 권익 보호, 환급업무 개선 및 세정 운영 효율화의 기초자료로 활용될 수 있다.
