description_portal: '(부보금융회사 종합정보)[참고사항]1. 데이터 개요본 데이터는 예금보험공사의 부보금융회사 중 국내은행의 주요 재무현황 자료임2. 데이터 단위- (억원) : 총자산, 자본금, 자기자본- (%) : 총자산순이익률, 순이자마진, 총자본비율, 고정이하여신비율, 연체율, 유동성커버리지비율3. 데이터 주석- 총자산, 자본금, 자기자본은 잔액기준- 총자산은 은행계정총자산+신탁계정총자산(신탁계정 자산합계-차변손익)+종금계정총자산-상호거래(신탁_은행계정대+신탁_은행계정차+종금_은행계정대+종금_은행계정차)- 총자산순이익률, 순이자마진은 누적분기 기준- 실질총자산(평잔)=은행계정총자산(평잔)+신탁계정 약정배당부 총자산(평잔)+종금계정 총자산(평잔)-상호거래(평잔)- 당기순이익은 대손준비금 적립전- 토스뱅크는 바젤3 단계적 적용- 연체율은 1개월 원리금, 총대출채권 기준- 유동성커버리지비율은 통합 기준 ※ 2018년 12월 이전 데이터는 "예금보험공사 부보금융회사 경영현황 및 주요 재무현황" 참고'
