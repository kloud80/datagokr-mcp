summary_user: 한국자산관리공사가 기업키움이 프로그램(기업자산 유동화인수)으로 지원한 기업을 한 건씩 담은 파일로, 지원년도·기업명·기업규모·업종·소재지·고용지원 인원·용도·산업단지 여부·유동화증권 발행 구분을 담는다(전국 범위, 약 1.6KB 규모의 작은 CSV). 일시적 자금난을 겪는 기업이나 분석가가 "어떤 업종·지역·규모의 기업이 자산 유동화로 지원을 받았고 고용은 몇 명이 유지됐나"를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 기업명·소재지 주소나 업종명을 직접 맞춰야만 이어 쓸 수 있다.
description_portal: '한국자산관리공사의 기업키움이 프로그램(기업자산 유동화인수) 지원 현황에 대한 데이터 입니다.본 데이터는 기업자산 유동화인수를 통한 지원년도, 지원기업 정보(기업명, 기업규모, 업종, 소재지, 고용지원, 용도, 산업단지)에 대한 정보를 제공합니다.※ 기업키움이 프로그램(기업자산 유동화인수) : 일시적 어려움에 처한 기업이 자기자산을 담보로 유동화증권을 발행하여 선제적 구조조정이 가능하도록 자산유동화 시장을 통한 자금조달을 지원하는 프로그램입니다.※ 관련 사이트 : 온기업(https://oncorp.kamco.or.kr)'
