summary_user: 제주 지역에서 팔리는 가공식품·생필품·생활용품을 상품별로 담는다. 포털 설명상 2021년 기준이며, 대분류·소분류, 제조업체, 판매업체 종류와 업체명, 총 중량·단위 중량, 단위 가격과 실제 판매 가격이 들어 있다. 소비자나 물가 분석가가 '같은 상품이 제주 도내 어느 판매처에서 얼마에 팔리고, 단위 중량당 가격 차이는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상품명·업체명 같은 이름 매칭으로만 잇는다.
description_portal: 제주특별자치도 참가격 정보 데이터는 2021년을 기준으로 제주 지역 내 다양한 상품의 분류 및 판매 가격 정보를 단위 가격과 실제 판매 가격 형태로 정리한 공공 통계자료입니다. 이 자료는 도내 유통 시장에서 판매되는 가공식품, 생필품, 생활용품 등을 포함하여 품목별 가격 현황을 상세히 보여주기 때문에 소비자 물가 분석, 지역 생활비 실태 조사, 가격 비교 및 정책 수립의 기초 자료로 활용될 수 있습니다. 제공 기관은 제주특별자치도이며, CSV 형식으로 배포되어 있으며 무료로 다운로드 가능합니다. 유통구조와 가격 변동을 파악하거나 지역 간 가격 차이를 분석하고자 할 때 유용하며, 공공 행정·통계 분석·경제연구 등 다양한 분야에서 참고 가능한 신뢰성 있는 데이터입니다.
