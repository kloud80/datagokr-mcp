description_portal: '1. 데이터 개요보험사고가 발생한 부보금융회사의 예금자에 대하여 예금보험공사가 지급한 개산지급금 관련 정보를 제공합니다.2. 데이터 항목지급 개시연도 : 개산지급금 지급을 개시한 연도지급대상 금융회사 : 개산지급금 지급 사유에 해당하는 금융회사지급금액 : 공사가 지급한 개산지급금 지급액(단위 : 원)지급건수 : 지급개시일부터 데이터기준일까지 지급된 개산지급금의 총 지급건수(단위 : 건)개산지급률 :  개산지급금 산정을 위해, 향후 해당 저축은행이 파산절차가 진행되는 경우 예금 등 채권에 대하여 변제받을 수 있을 것으로 예상되는 금액을 고려하여 책정하는 값(단위:%)3. 데이터 주석개산지급금 : 장기간에 걸친 파산절차로 인한 예금자의 불편을 해소해드리기 위해 예금자가 향후 파산배당으로 받게될 예상배당률을 고려하여 예금자의 보호한도 초과 예금 등 채권을 예금자의 청구에 의하여 공사가 매입하고, 그 매입의 대가로 예금자에게 지급하는 금전부보금융회사 : 「예금자보호법」 제 2조 제1호에 따라 예금보험을 적용을 받는 금융회사보험사고 : 「예금자보호법」 제 2조 제8호에 해당하는 경우'
