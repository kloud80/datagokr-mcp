summary_user: 국세청 사업자등록번호 단위로 진위확인(개업일자·대표자명 등 입력값과 국세청 등록정보 일치 여부)과 상태조회(계속·휴업·폐업 상태, 과세유형, 폐업일자)를 건별로 돌려주는 전국 범위 API다. 거래처나 협력업체가 지금 정상 영업 중인지, 폐업했는지, 과세유형이 무엇인지를 확인하려는 사업자와 기업 원장의 생존 여부를 검증하려는 분석가가 쓴다. 사업자등록번호(b_no)가 조인 키이므로 사업자번호를 가진 다른 기업·인허가·거래 데이터에 붙여 상태 원장으로 이어 쓴다.
description_portal: 국세청에서 제공하는 사업자등록정보 진위확인 및 사업자등록 상태조회 API 서비스입니다.(진위확인) 사업자등록번호, 개업일자, 대표자명 등의 정보를 입력하여 국세청의 사업자정보와 일치하는지 진위여부 확인(상태조회) 사업자등록번호만으로 해당 번호의 사업자 운영상태(휴업, 폐업), 과세유형(일반, 과세, 면세), 폐업일자 정보 조회 (호출허용건수) 1회 100건, 1일 100만건 제한(테스트) 공공데이터포털 → 정보공유 → 공지사항 → "[국세청]사업자등록정보 진위확인 및 상태조회 서비스 오픈API 개방 안내" → 오픈API 테스트 링크※ 국세청에 등록된 사업자등록정보와 30분 주기로 업데이트 됨(신규 개업자는 1~2일 소요)
