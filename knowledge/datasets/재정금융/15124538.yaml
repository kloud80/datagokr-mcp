description_portal: 본 데이터는 기초자치단체에 배정된 특별조정교부금 현황 정보이다. 시군, 교부일자, 사업명, 교부 금액 등의 세부 사항을 포함한다. 특별조정교부금은 광역자치단체가 기초자치단체의 특정 사업 지원 또는 재정 부족을 보전하기 위해 교부하는 재원이다. 해당 자료는 지역 간 재정 불균형 해소, 특정 정책 사업 추진 지원, 재정 운영 투명성 제고에 활용된다. 교부금 배정 내역 공개를 통해 재정 운영의 공정성과 투명성을 확보하고 시민의 알 권리를 보장한다. 또한 기초자치단체의 재정 자립도 분석 및 재정 지원 정책 수립에 필요한 기초 자료를 제공하며, 재정 분권 강화 및 균형 발전 정책 수립에 기여하고 예산 집행 실적 평가 자료로도 활용된다.
