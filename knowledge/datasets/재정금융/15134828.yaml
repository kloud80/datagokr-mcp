description_portal: 이 데이터는 광주광역시 서구 대표 홈페이지에서 제공하는 연도별 예산 현황으로, 일반회계와 특별회계에 대한 예산 총액 정보를 포함하고 있다. 일반회계는 지방정부가 통상적인 행정 서비스를 제공하기 위한 주요 재정 수단으로 사용되며, 특별회계는 특정 목적에 맞춰 사용되는 재원을 별도로 관리하는 회계 방식이다. 이 데이터는 매년 기준으로 각 회계 항목별 예산 총액이 기록되어 있어, 연도 간 재정 추세 비교, 재정건전성 분석, 예산 운용의 중점 분야 파악 등 다양한 행정 및 정책 연구에 활용될 수 있다.데이터는 숫자형(NUMERIC) 형식으로 구성되며, 연도별로 일반회계와 특별회계 항목이 나뉘어져 있어 시계열 분석이 용이하다. 특히 지방재정의 투명성과 주민 참여 확대를 위한 기초 자료로서 가치가 높으며, 향후 예산 계획 수립, 재정 효율성 검토, 분야별 재정 배분 분석 등의 활용 가능성이 크다.또한, 본 데이터는 공공저작물로서 자유롭게 활용할 수 있으며, 연 단위로 갱신되어 최신성 또한 확보된다. 지방재정 운용의 흐름을 파악하고자 하는 연구자, 정책 수립자, 시민 등 다양한 수요자에게 유용한 자료이다.
