description_portal: 이 데이터는 경상남도 남해군의  취득세, 등록면허세, 레저세, 지역자원시설세, 주민세, 지방소득세, 재산세, 자동차세, 담배소비세, 도축세, 도시계획세, 지방교육세 등 주요 12개 지방세에 대해 법률(지방세법, 지방세특례제한법, 조세특례제한법)과 각 지자체 조례, 기타 사유에 따라 실제로 비과세 및 감면이 얼마나 이루어졌는지 항목별로 정리해 공개합니다. 지방세 감면 현황을 한눈에 볼 수 있어, 지역 간 감면율 비교, 감면제도의 효율성 분석, 지방정부의 재정 건전성 평가 등에 폭넓게 활용할 수 있습니다. 단, 이 데이터는 실제 신고·감면 내역에 한정되어 있어, 정책별 효과 해석 시 현장 적용이나 부정 수혜 여부 등 맥락적 해석이 필요합니다.
