description_portal: 경산시 지방세 징수현황은 경산시가 거둬들이는 지방세의 전체적인 흐름을 한눈에 보여주는 자료입니다. 주요 항목으로는 부과액, 징수액, 환급액, 결손액, 미수액, 징수율이 포함되어 있습니다. 부과액은 해당 기간 동안 과세된 총 금액이며, 징수액은 실제로 거둬들인 금액을 의미합니다. 환급액은 과오납 등으로 인해 시민에게 되돌려준 금액이고, 결손액은 징수가 불가능해진 금액입니다. 미수액은 아직 징수되지 못한 금액으로, 앞으로 징수 대상이 됩니다. 마지막으로 징수율은 부과액 대비 실제 징수된 금액의 비율을 나타냅니다. 이 자료는 경산시 재정 운영의 투명성을 높이고, 시민이 시의 세입 상황을 이해하는 데 도움이 됩니다.
