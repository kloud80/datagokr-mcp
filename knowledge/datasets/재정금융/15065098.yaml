description_portal: 본 데이터는 관내 외국인 직접 투자를 업종별로 집계한 통계 정보이다. 제조업, 서비스업, 건설업 등 산업 분류별 투자 금액, 투자 건수, 투자국, 투자 시기 등의 세부 내용을 포함한다. 외국인 직접 투자는 지역 경제 활성화 및 일자리 창출에 중요한 역할을 하는 경제 지표이다. 해당 자료는 투자 유치 정책 수립, 산업 구조 분석, 지역 경제 발전 전략 마련에 활용된다. 업종별 투자 현황 분석을 통해 투자 유치가 활발한 산업과 부진한 산업을 파악하고 맞춤형 투자 유치 전략을 수립할 수 있다. 또한 외국 투자 기업의 업종별 분포 분석을 통해 산업 생태계 발전 방향을 설정하고 관련 인프라 확충 계획을 마련한다. 본 통계는 정기적으로 갱신되어 최신 투자 동향을 반영한다.
