description_portal: '○ 통계개요* 통계명 : 가계 소비지출* 통계종류 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년) ※ 2006년 조사종료* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 가구의 사교육비 및 주거비, 기타비소비지출 비중○ 용어설명* 사교육비 : 학원, 과외, 학습 교구재, 강습 등에 지출되는 비용. 가구 구성원 전체가지출하는 비용 포함(직장인, 대학생 비용 불포함)* 주거비 : 집세, 주택설비 수리비용, 광열 및 수도료, 전기료, 가스료 등의 비용* 기타 : 주거비 및 사교육비 항목을 제외한 모든 지출항목(식비, 의류비, 공교육비 등)○ 기 타* 2007년부터 조사 항목에서 제외함'
