summary_user: 관세청 수출입 신고 자료를 세관 기준으로 월별 집계한 무역통계로, 세관(본부세관·세관 코드·세관명)별 수출·수입 건수와 금액(달러), 무역수지를 담는다. 지역 무역 분석가나 물류 사업자가 '인천공항세관과 부산본부세관의 월별 수출입 규모와 무역수지가 어떻게 달라지나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 세관 코드나 세관명 매핑, 또는 관세청의 다른 수출입 실적·무역 코드 데이터와 같은 기관 코드로만 연결한다.
limits: 세관 단위 집계라 품목(HS)·상대국·업체별 내역은 이 데이터만으로 알 수 없고, 범위는 전국이지만 공간 좌표가 없는 비공간 자료다. 다른 데이터와 공통 조인 키가 없어 연결 시 세관 이름·코드를 직접 맞춰야 한다.
