summary_user: 저축은행 79개사의 분기말 주요 재무지표(대출금, BIS자기자본비율, 연체율, 고정이하여신비율, 유동성비율, ROA·ROE, 당기순이익, 총자산, 여수신평균금리)를 회사·분기별로 담은 API 데이터로, 전체 6,070건이다. 예금자나 분석가가 특정 저축은행의 건전성과 수익성이 분기별로 어떻게 달라졌는지 확인하는 질문에 쓴다. 금융회사 코드(finIstCd)와 회사명(finIstNm)이 있어 같은 기관의 다른 금융회사 자료와 코드로 이을 수 있지만, 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 기관 자료와는 이름·코드 매핑이 필요하다.
description_portal: (부보금융회사 종합정보)저축은행 업무보고서를 바탕으로 작성한 주요 재무현황에 대한 정보를 제공하고 있습니다.개방되는 데이터는 각 분기말 기준 저축은행 79개사의 저축은행명, 대출금, BIS자기자본비율,  연체율,  고정이하여신비율, 유동성비율, ROA, 당기순이익, 총자산금액, 여수신평균금리, ROE 현황입니다.제공되는 데이터는 저축은행이 금융감독원에 보고한 업무보고서에 기초하여 작성되었으며, 추후 외부감사인 감사·검토 및 금융감독원 검사 결과 등에 따라 수정될 수 있습니다.
