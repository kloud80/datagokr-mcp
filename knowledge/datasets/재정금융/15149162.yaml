description_portal: 본 데이터는 영주시 지역사랑상품권 현황 정보 데이터로 영주시가 발행하는 지역화폐의 판매 대행점 및 가맹점, 제한 가맹점 현황을 제공합니다.데이터는 상호, 도로명주소, 업종(품목)의 항목으로 구성되어 있습니다.시민들은 본 데이터를 활용해 생활권 내에서 가까운 판매 대행점을 확인하거나 상품권을 사용할 수 있는 가맹점을 찾는 데 도움을 받을 수 있습니다.연구기관과 학계에서는 상품권 가맹점과 판매 대행점의 분포를 분석하여 지역경제 순환 효과를 평가하고 소비자 행동 분석 및 지역경제 활성화 정책 연구에 활용할 수 있습니다.민간플랫폼 개발자는 본 데이터를 활용해 가맹점 지도 서비스, 위치 기반 검색 앱 등의 시스템을 구축할 수 있습니다.영주시 지역사랑상품권의 자세한 정보는 홈페이지(https://www.yeongju.go.kr/open_content/main/page.do?mnu_uid=10451&)를 통해서 확인하실 수 있습니다.
