summary_user: 전국 시도별 가맹사업 상가업소의 종사자 수를 기준년도별로 묶은 집계 통계로, 개별 업소가 아닌 시도 단위의 비공간 자료입니다. 창업 희망자나 지역 고용정책 분석가가 연도별로 어느 시도에서 가맹점 종사자가 늘거나 줄었는지 비교할 때 쓴다. 전역 조인 키는 없으며, 시도코드(sido_cd)나 시도명을 매핑해 같은 시도 단위의 인구·사업체 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도를 포함한 전국 시도별 상가업소에 종사하는 인원 수를 연도별로 정리한 통계 정보입니다. 주요 항목은 "기준년도", "시도코드", "종사자수"로 구성되어 있으며, 각 연도별 특정 지역의 상가업소에서 일하는 종사자의 규모를 나타냅니다. 본 데이터는 소상공인 현황 파악, 업종별 인력 수요 추이 분석, 창업 및 고용정책 수립의 기초자료로 활용될 수 있으며, 상권 내 종사자 수의 변화를 통해 지역 상업 활동의 활발함을 가늠할 수 있는 지표로도 사용됩니다. 특히 해당 데이터는 다양한 연도에 걸쳐 수집되어 시계열 분석을 통해 지역별 상권 성장세 및 고용 동향 파악에 적합합니다.
