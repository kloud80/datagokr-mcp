description_portal: 이 데이터는 전라남도 영광군이 추진하는 공공사업의 계약 이행 현황과 발주계획을 통합적으로 관리하고, 계약의 투명성과 재정 집행의 효율성을 제고하기 위해 수집되었습니다. 각 계약 건별로 사업명, 사업부서, 계약일자, 계약금액, 입찰방식, 계약상대자, 계약단계(계획·체결·완료) 등의 항목을 포함하고 있으며, 연도별 계약정보가 축적되어 있습니다. 데이터는 발주 전후의 행정 흐름을 분석할 수 있도록 구성되었으며, 조달 방식 비교, 민간 참여 현황 진단, 예산 운용 실태 평가, 계약제도 개선, 정책 수립의 기초자료 등으로 다양하게 활용될 수 있습니다.
