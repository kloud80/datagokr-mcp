description_portal: '「복권 및 복권기금법」 제2조제1호마목에 정의된 온라인복권(상품명: 로또6/45)의 1등(자동선택) 당첨 판매점 목록입니다.* 온라인복권: 복권의 최종 구매자가 직접 번호를 선택하거나 전산에 의하여 자동으로 번호를 받은 후에 추첨으로 당첨번호를 결정하는 복권으로서 복권발행시스템을 갖춘 중앙전산센터와 정보통신망으로 연결된 복권의 발매단말기를 통하여 출력된 복권 또는 복권발행시스템을 갖춘 중앙전산센터와 연결된 정보통신망을 통하여 발행 및 판매가 이루어지는 전자적 형태의 복권해당 데이터는 1176~1227회차(25.6.8.~26.6.6.) 범위만 포함하여 정보를 제공합니다.해당 데이터에서는 판매점 이름(상호)과 지역, 1등 자동 당첨 건수 항목을 제공합니다.해당 데이터에서는 온라인 복권을 구매할 수 있는 판매점 이름(상호)과 판매점의 지역, 자동선택 1등 출현 횟수를 확인할 수 있습니다.해당 데이터에서는 구매자가 직접 번호를 선택하는 수동선택의 1등 출현 횟수는 빠져있습니다.상세한 데이터는 수탁사업자 홈페이지(www.dhlottery.co.kr)에서 제공 중이오니 참고하시기 바랍니다.'
