description_portal: 1. 데이터 주요 내용 및 목적전북특별자치도 남원시의 연간 지방세 징수 현황을 체계적으로 정리한 공공데이터입니다. 이 데이터는 취득세, 등록세, 주민세 등 다양한 지방세목에 대해 과세건수와 과세금액을 상세히 분류하여 제공하며, 비과세 대상의 건수와 금액도 포함하고 있습니다. 남원시의 재정 현황 분석, 세수 예측, 지역경제 동향 파악 등에 활용될 수 있으며, 연구기관, 정책수립기관, 시민단체들이 지방재정의 투명성을 확보하고 정책 연구를 수행하는 데 도움을 줄 수 있습니다.2. 데이터 항목명시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 과세건수, 과세금액, 비과세건수, 비과세금액3. 기대 효과지방세 과세 현황을 투명하게 공개함으로써 시민의 알권리를 보장하고 지방재정 운영의 투명성을 제고할 수 있습니다. 또한 연구자와 정책입안자들이 실증 데이터를 바탕으로 보다 효과적인 지방세 정책을 수립하는 데 기여할 것으로 기대됩니다.
