description_portal: 이 데이터는 신용보증기금의 신용조사 업무 과정에서 활용되는 산업별 평가 자료 및 거시경제 지표 현황을 종합적으로 집계한 자료로, 거시경제 기초 통계, 업종 소분류 설명 정보 및 산업평가 보고서 통계, 프로그램 테이블 정보 등의 테이블을 포함하고 있다. 본 데이터는 거시경제산업별평균값, 산업평가분류코드, 당기 및 전기 매출금액, BASA신청 유입 경로 코드 등의 주요 칼럼을 제공함으로써, 거시적 경제 흐름부터 업종별·기업별 세부 분석으로 이어지는 신용조사 관련 업무의 기본적인 관리 현황을 종합적으로 파악하는 데 참고할 수 있는 기반을 제공한다. 해당 데이터는 유관 분야의 일반적인 현황 파악이나 학술 연구 등을 위한 단순 참고용 자료로서의 역할을 수행하며, 공공데이터 개방 취지에 부합하도록 지원한다.
