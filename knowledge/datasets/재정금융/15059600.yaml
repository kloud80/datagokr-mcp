summary_user: 주택저당증권(MBS)의 종목별 속성(발행일·만기일·표면이율·금리구분·채권유형·발행금액 등)과 배당이자 지급 내역, 신용등급 현황을 종목(ISIN) 단위로 담는 원천 API이며, 종목기본정보·배당이자지급정보·신용등급정보 3개 오퍼레이션으로 나뉜다. 채권 투자자나 분석가가 특정 MBS의 만기·이율, 회차별 원리금 지급 일정과 신용등급을 확인하는 데 쓴다. 국제증권식별번호(isinCd)를 조인 키로 삼아 다른 증권 시장 종목 원장·시세 데이터나 연기금 보유 내역과 이어 쓴다.
description_portal: '모기지론종목기본정보는 주택저당증권(MBS)의 종목별 속성, 배당이자 지급 정보, 신용등급 현황을 확인할 수 있는 데이터입니다.데이터는 다음 3가지 오퍼레이션으로 구성되어 있습니다.① 종목기본정보 조회 : 발행번호, 종목번호를 기준으로 종목명, 발행일자, 금리구분, 표면이율, 만기일, 채권유형 등을 확인하는 기능② 배당이자지급정보 조회 : 발행번호, 종목번호를 기준으로 지급차수, 지급일자, 원금지급금액, 이자지급금액, 지급금액총액 등을 조회하는 기능③ 신용등급정보 조회 : 기준일자, 발행번호, 종목번호를 기준으로 평가기관, 신용등급, 등급평가일자 등을 조회하는 기능'
