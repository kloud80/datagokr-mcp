description_portal: 본 데이터는 연도별 지방세 과세 및 비과세 현황을 제공한다. 지방자치단체의 조세 부과 실적과 법령에 따른 감면 현황을 포함한다. 세목명, 과세건수, 과세금액, 비과세건수, 비과세금액 등의 항목을 수록한다. 세목명은 취득세, 재산세 등 지방세법상 세금 종류를 나타낸다. 과세건수는 세금이 부과된 건수이며, 과세금액은 부과된 세액 총액이다. 비과세건수는 감면 규정에 따라 세금이 부과되지 않은 건수이고, 비과세금액은 감면된 세액 총액을 나타낸다. 본 데이터로 지역 재정의 세입 규모와 조세 감면 현황을 파악할 수 있으며, 지방세 정책 수립과 재정 운용 계획의 기초 자료로 활용된다. 연도별 추이 분석으로 세수 변화와 감면 정책 영향을 확인할 수 있다.
