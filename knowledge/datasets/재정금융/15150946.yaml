summary_user: 법인별·사업연도별 공시 접수 건마다 발행예정주식총수, 누적 발행·감소 주식수, 감자·이익소각·상환주식 상환 수, 자기주식수와 유통주식수를 주식 종류 구분별로 담은 전국 단위 주식총수 공시 데이터다. 투자자나 분석가가 특정 상장사의 유통주식수와 자기주식 비중이 사업연도마다 어떻게 바뀌었는지 확인하는 데 쓴다. 법인등록번호(crno)로 금융위 기업기본·재무·지배구조 정보 등 기업 공시 데이터와 잇고, 주식종목코드와 접수번호로 시세·공시 원문과도 맞춰 볼 수 있다.
