description_portal: 주식발행 공시정보는 주식발행과 관련한 공시정보(주식발행  내역 등)를  확인할 수 있습니다. 이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.기준일자, 사업연도, 법인유형구분명, 법인구분번호, 법인명, 법인등록번호, 접수번호, 주식발행총수구분명, 발행예정주식총건수, 누적발행주식총수, 누적감소주식총수, 감자총수, 이익소각총수, 상환주식상환총수, 기타주식총수, 최대발행주식총수, 자기주식수, 유통주식수, 주식종목코드를 조회할 수 있습니다.** 유의사항 ** ① 본 서비스에서 제공되는 정보는 공시제출인(또는 데이터 제공기관)의 책임 하에 작성되었으며, 금융위원회는 이의 정확성 및 완전성을 보장하지 않습니다.② 금융위원회는 어떠한 경우라도 본 서비스를 통해 제공받은 정보를 이용하여 이용자가 얻은 이득이나 입은 손해 등 결과에 대해 책임이 없습니다. ③ 금융위원회는 금융공공데이터 이용자간 또는 금융공공데이터 이용자와 제3자간에 서비스를 매개로 한 거래 등과 관련하여 어떠한 책임도 부담하지 아니하고, 금융공공데이터 이용자가 서비스의 이용과 관련하여 기대하는 이익에 관하여 책임을 부담하지 않습니다. ④ 금융위원회는 서비스에 관하여 금융공공데이터 이용자가 금융위원회가 정한 제반 규정, 이용 안내 및 관계 법령을 준수하지 않은 이용으로 인한 결과에 대하여 책임을 지지 않습니다
