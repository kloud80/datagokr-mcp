description_portal: 1. 석유수출입업이란 석유사업법 제9조에 따라 등록(등록인 면제되는 경우를 포함)을 하고 석유수출입업을 하는 자를 말한다.2. 석유수출입업을 등록하려는 자는 산업통상자원부령으로 정하는 바에 따라 산업통상자원부장관에게 등록하여야 한다. 다만 석유정제업 등록을 한 자가 석유수출입업을 하는 경우, 윤활유 등 대통령령으로 정하는 석유제품의 수출입업을 하는 경우, 석유수출만을 업으로 하는 경우, 자기가 사용할 목적으로 해당 연도에 수입하는 석유의 양이 10만 킬로리터 이하인 경우에는 그러하지 아니하다.3. 석유수출입업의 등록요건은 사업개시연도의 석유 내수판매계획량의 15일분에 해당하는 양과 2천5백킬로리터 중 많은 양을 저장할 수 있는 저장시설을 갖출 것을 말한다.
