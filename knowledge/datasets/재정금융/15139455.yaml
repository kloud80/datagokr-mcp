description_portal: 본 데이터는 서울교통공사의 2025년(1~11월) 손익계산서로, 해당 기간 동안의 수익과 비용, 그리고 그 결과인 당기순이익을 포함하는 경영성과 내용입니다.(본 데이터는 2025년 상반기 기준 가결산 수치로 감사인의 감사 후 확정 손익계산서 추후 업로드 예정)손익계산서는 기업의 성과를 확인하는 핵심 데이터로 회사가 총 벌어들인 수익에서 사용한 비용을 차감하는 내용을 담고 있습니다.손익계산서의 흐름을 요약하면 매출액에서 매출원가를 차감하여 매출총이익을 계산하고, 판매비와관리비 등 영업활동 관련 비용을 반영해 영업이익을 산출합니다.이후 이자수익, 비용 등 영업외 손익을 반영하여 당기순이익(손실)을 나타냅니다.공사의 주요 수익구조는 운수수익, 부대수익, 기타수익 크게 3가지로 구성되어있고 대행구간 운영에 대한 수익, 지출 내역도 포함하고 있습니다.본 자료는 회계기준에 따라 작성되었으며 회사의 성과평가 또는 예산, 정책 수립 및 이해관계자의 정보 확인에 활용될  수 있는 기초자료입니다.
