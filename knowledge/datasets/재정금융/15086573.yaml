description_portal: 이 데이터는 기획재정부가 관리하는 주요관리대상사업 중 공공기관별 집행실적 정보를 제공합니다. 집행실적은 연간계획을 제외한 금액 기준으로 누적 데이터를 기준으로 제공되며, 사업비가 500억원 이상인 주요 사업에 대해 공공기관별로 분류된 집행 데이터를 포함하고 있습니다. 이를 통해 예산 집행의 투명성과 효율성 확보를 위한 공공기관별 사업 진행 현황을 파악할 수 있으며, 국민과 관계 기관이 공공 재정의 흐름을 체계적으로 이해하고 활용할 수 있도록 돕습니다. 해당 정보는 열린재정 시스템을 기반으로 제공되며, 공공자금의 건전한 운영과 정책 수립을 위한 기초자료로 활용됩니다.
