description_portal: '충청북도 옥천군_지방세 과세 현황 데이터는 옥천군 관내에서 연도별로 부과된 지방세에 대한 상세 정보를 수록한 공공데이터입니다. 이 데이터는 세목별(예: 재산세, 주민세 등)로 과세 및 비과세에 관한 주요 통계를 포함하며, 과세건수, 과세금액, 비과세건수, 비과세금액 등의 항목이 제공됩니다. 또한 세원(과세 대상) 유형별, 과세년도, 세목명, 세원 유형명, 부과건수, 부과금액 등 세분화된 항목도 함께 포함되어 있어, 지방세의 부과 현황을 다각적으로 분석할 수 있습니다.데이터는 연 1회 정기적으로 갱신되며, 최신 데이터 및 파일은 공공데이터포털을 통해 CSV, XML, JSON 등 다양한 포맷으로 누구나 무료로 다운로드할 수 있습니다. 해당 자료는 옥천군청 행정과에서 관리하며, 과세 행정의 투명성과 데이터 접근성을 동시에 높이고 있습니다.이 정보는 재정 운영, 세수 분석, 정책 수립, 세원 관리, 각종 통계 연구 등 행정 및 실무, 민간, 연구 목적으로 폭넓게 활용됩니다. 제공 주기가 정기적이고 각 세목별 세부 항목까지 포함되어 있어, 옥천군의 지방세 구조와 재정 현황을 한눈에 파악할 수 있는 중요한 자료입니다'
