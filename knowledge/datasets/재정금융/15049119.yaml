description_portal: 서울시 시민참여예산 제안사업 평가정보 데이터는 시민이 제출한 제안사업을 심사·평가한 결과를 관리하기 위한 자료입니다. 회계년도와 제안번호는 어느 연도, 어떤 제안에 대한 평가인지 구분하는 기본 식별 정보이며, 평가번호는 동일 제안에 대해 여러 차례 평가가 있을 경우 이를 구분하기 위한 순번입니다. 점수는 제안사업의 타당성, 효과성, 실현 가능성 등을 종합적으로 수치화한 평가 결과이며, 사유는 해당 점수를 부여한 근거와 판단 내용을 기록하는 항목입니다. 이미지url, 이미지타입, 이미지명, 이미지사이즈, 변환파일명은 평가 과정에서 활용된 현장사진, 서류 스캔본, 시각자료 등을 파일 형태로 관리하기 위한 메타데이터로, 평가 근거를 시각적으로 확인하고 보완하는 데 사용됩니다. 등록일은 평가 결과가 시스템에 최초 입력된 시점을, 수정id와 수정일은 이후 담당자가 내용을 보완하거나 정정한 이력을 나타내는 관리 정보입니다. 사용여부는 해당 평가 기록이 현재 유효하게 활용되는 데이터인지, 폐기 또는 비활성 처리되었는지를 구분하는 항목으로, 최종 통계와 의사결정에 반영할 평가만 선별하는 데 활용됩니다.
