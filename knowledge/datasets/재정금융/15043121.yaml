description_portal: '1. 데이터 개요예금보험공사는 부실금융회사 정리과정에서 설립된 가교금융회사의 명, 설립일, 계약이전 대상 금융회사의 명, 매각 진행상황, 매각일, 인수 회사명 등 가교금융회사의 매각현황에 대한 구체적 정보를 제공합니다.2. 데이터 항목가교금융회사명 : 계약이전 시 해당 금융기관이 최종적으로 정리될 때까지 한시적으로 운영되는 정리금융금융회사로서 설립된 11개 가교저축은행의 회사명(예가람, 예아름, 예한울, 예쓰, 예나래, 예솔, 예한별, 예한솔, 예성, 예신, 예주)과 가교보험사명(예별손해보험)설립일 : 해당 가교금융회사의 설립일자계약이전 대상 금융회사 : 해당 가교금융회사로 계약이전 되는 부실금융회사매각결과 : 해당 가교금융회사의 매각 진행상황매각일 : 해당 가교금융회사의 매각일자인수자 : 해당 가교금융회사를 인수한 회사3. 데이터 주석가교금융회사 : 부실금융회사의 일부 자산과 부채를 이전받아 제한된 범위 내에서 한시적으로 영업을 수행하는 정리금융회사,본질적으로 부실금융회사의 제3자 이전 필요성이 인정되나 적정인수자가 적시에 나타나지 않은 경우 예금보험기구가 이를 잠정적으로 인수하여 관리함으로써 거래자의 편의를 도모하는 한편, 계속기업으로서의 가치훼손을 최소화하기 위한 목적으로 활용하다가 인수자가 정해지면 제3자 이전을 실행하고 제3자 이전이 실패하면 파산처리함으로써 그 기능을 종료하는 임시기구의 성격을 가짐부실금융회사 : 예금 등의 지급이 정지된 저축은행, 보험사 등 「예금자보호법」 제2조 제5호에 해당하는 부보금융회사계약이전 : 계약상의 지위 및 재산(소극적 재산 포함)을 제3자에게 이전하는 것으로 임의적 계약이전과 감독당국에 의한 계약이전 명령 또는 계약이전 결정으로 구분됨. 금산법상 금융위원회의 계약이전결정 처분으로 권리의무의 이전이라는 사법상의 효력이 발생하며 계약의 일부 이전도 가능함'
