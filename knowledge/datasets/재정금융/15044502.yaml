description_portal: 이 데이터는 2016년부터 2025까지 신용보증기금에서 무기계약직 공석을 충원하기 위해 처음부터 무기계약직으로 채용한 인원 현황을 제공하는 자료이다. 무기계약직은 일정 기간 이후 자동으로 계약이 종료되는 기간제 근로자와 달리, 별도의 해지 사유가 없는 한 고용이 계속 유지되는 계약 형태로, 조직의 지속적이고 상시적인 업무를 담당하는 인력 충원을 위해 활용된다. 해당 데이터는 연도별로 채용된 인원 수를 기준으로 집계되며, 직무 유형, 근무 지역, 전환사유 등 세부 항목이 포함될 수 있다. 이를 통해 조직의 정원 관리 및 인력 운영 방향, 고용 형태의 변화 추이, 무기계약직 확대 여부 등을 분석할 수 있다. 또한 공공기관의 고용 안정성 확보 노력, 비정규직의 정규직화 흐름에 대한 정책적 대응 현황을 파악하는 데 유용한 참고 자료로 활용될 수 있다.
