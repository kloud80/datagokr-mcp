summary_user: 경기도 행복카셰어의 이용 실적을 이용년월별로 집계한 데이터로, 한 행에 총계와 본청·북부청·직속기관 및 사업소·시군별 이용차량수와 이용인원수를 담는다. 공공 차량공유 운영성과를 보는 분석가나 담당자가 '어느 기관 유형이 어느 달에 공유차량을 많이 썼는가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이용년월(USE_YM)을 기준으로 시기를 맞추거나 기관명 매핑으로만 연결한다.
description_portal: 이 데이터는 행복카셰어 제도의 기관별 월간 이용 현황을 집계한 자료로, 경기도 내 본청, 북부청, 직속기관 및 사업소, 시군별 차량 이용 실적을 보여줍니다. 주요 항목에는 이용년월, 총계_이용차량수, 총계_이용인원수, 본청/북부청/직속기관 및 사업소/시군별 이용차량수 및 이용인원수가 있으며, 각 기관이 공유 차량을 얼마나 이용했는지를 수치로 확인할 수 있습니다. 이 데이터는 공공 부문 차량공유 서비스 운영성과를 분석하고, 교통 자원 효율화 및 친환경 교통 수단 확대 정책 수립의 기초자료로 활용될 수 있습니다. 또한 시기별 이용패턴 분석을 통해 차량 수요 예측이나 정책 개선에도 활용이 가능합니다.
