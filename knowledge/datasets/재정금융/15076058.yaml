description_portal: 세출 및 지출 세부사업 예산편성 자료는 중앙행정기관의 연도별 세부사업별 예산 현황을 총액 기준으로 제공하는 재정 통계 데이터입니다.(부처별, 분야·부문·프로그램·세부사업별 예산 규모 및 집행 정보 포함)세출은 국가 또는 지방자치단체가 한 회계연도 동안 모든 수요를 충당하기 위하여 지출하는 일체의 경비를 의미하며, 국채나 차입금이 아닌 세입을 재원으로 합니다. 지출은 세출예산과 기금운용계획의 집행 과정에서 국고에서 현금 또는 이에 준하는 자금이 실제로 지급되는 것을 말합니다.1. 데이터 범위   * 총액 기준 중앙행정기관의 세출·지출 예산 자료   * 부처명, 회계명, 분야·부문·프로그램·세부사업명, 예산구분, 예산액, 예산변동 사유 등 포함2. 세부사업별 예산   * 각 사업별로 사업목적, 예산액, 집행계획 등이 기재되어 정책분석 및 연구자료로 활용 가능3. 회계 구분   * 일반회계   * 특별회계   * 기금4. 예산구분   * 본예산   * 추경예산   * 기금운용계획안5. 활용 예시   * 부처별 세부사업 예산비교 분석   * 정책별 재정투자 규모 파악   * 특정 분야 예산 증가·감소 추이 분석6. 제공 형식 및 접근 방법   * XLSX, CSV, XML, JSON, TXT 등 다양한 파일형식 다운로드 가능   * Open API 연계 가능 (연도, 기관, 분야, 프로그램, 사업 등 조건별 조회 지원)본 자료는 중앙정부 예산의 투명성을 높이고 국민의 알권리 충족, 연구기관·언론·일반 국민의 정책 분석 자료로 활용되며, 예산 편성과 정책 효과 분석 등에 필수적인 재정정보로 매우 유용합니다.
