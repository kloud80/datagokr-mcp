summary_user: 서울 종로구가 소유한 구유지 등 공유재산을 필지 단위로 담은 파일로, 재산용도·재산관리관·소재지·지목·면적(제곱미터)·데이터기준일을 기록한다(종로구 단일 시군구 범위, 약 48KB CSV). 구민이나 분석가가 '종로구 안에 놀고 있는 구유지가 어디에 얼마나 있고 어떤 용도로 쓰이는가'를 확인하거나, 지역개발·공공사업 부지 후보를 찾을 때 쓴다. 전역 조인 키는 없어 소재지(주소)를 기준으로 토지·건물 대장이나 공매 물건 정보와 주소 매칭으로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구가 소유한 구유지 등 공유재산의 관리 현황을 수록한 자료로, 자치단체가 보유한 부동산 자원의 위치 및 이용 상태를 파악할 수 있도록 구성되어 있습니다. 포함된 항목은 공유재산의 소재지, 토지지목코드, 면적 등으로, 각 필지는 「공유재산 및 물품 관리법」에 따라 등록되어 있으며 재산 관리대장을 기반으로 작성됩니다. 해당 데이터는 공공청사, 도로, 공원 등 다양한 용도의 공공시설 부지를 포함하고 있으며, 자산의 활용 가능성, 유휴 재산의 파악, 효율적 자산 운용을 위한 기초자료로 활용됩니다. 또한 구민의 재산에 대한 관리 투명성을 높이고, 지역개발 및 공공사업의 공간적 계획 수립에도 참고될 수 있는 행정기초자료로 제공됩니다. 본 자료는 종로구의 공유재산 관련 부서에서 주기적으로 점검 및 갱신하여 공공데이터로 개방되고 있습니다.
