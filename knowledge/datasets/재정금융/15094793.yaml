description_portal: '변액보험기본정보는 생명보험협회에서 제공하는 변액보험 펀드별 정보를 제공하는 데이터입니다. 각 변액보험 상품에 편입된 펀드의 명칭, 설정일자, 순자산금액, 기준가, 펀드유형, 운용회사명 등의 정보를 기준으로 펀드의 운용 현황과 투자 특성을 확인할 수 있습니다.이 데이터는 단일 오퍼레이션으로 구성되어 있습니다. 오퍼레이션의 자세한 정보는 다음과 같습니다.① 변액보험 펀드별 정보 조회 : 펀드명, 펀드유형, 기준가, 순자산금액, 설정일자, 운용회사명 등 변액보험에 편입된 펀드의 세부 정보를 조회합니다.※ 데이터 갱신주기는 월 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 변액보험기본정보의 데이터 개방 주기는 매월 초입니다.공개되는 데이터는 한 달 전 말일까지를 기준으로 제공됩니다.예를 들어, 12월 31일까지의 데이터는 1월 초에, 1월 31일까지의 데이터는 2월 초에 업데이트됩니다.'
