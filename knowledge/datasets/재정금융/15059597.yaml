description_portal: '지배구조정보는 기업의 소유구조와 경영책임 구조를 파악할 수 있도록 주주 정보, 대표이사 정보, 임원 보수 현황, 임원 정보를 통합 제공하는 데이터입니다.데이터는 다음 4가지 오퍼레이션으로 구성되어 있습니다.① 주주정보 조회 : 기준일자, 법인등록번호, 주주일련번호를 통하여 주식분류명, 주주기말주식수, 최대주주관계명등을 조회하는 주주정보조회 기능② 대표이사정보 조회 : 기준일자, 법인등록번호, 법인명, 대표이사성명을 통하여 대표이사출생년월, 대표이사직위명, 등기임원여부, 대표이사담당업무내용등을 조회하는 대표이사정보조회 기능③ 임원보수현황 조회 : 기준일자, 법인등록번호를 통하여 사외이사총보수금액, 사외이사수, 사외이사비고내용등을 조회하는 임원보수현황조회 기능④ 임원정보 조회 : 기준일자, 법인등록번호를 통하여 임원직위명, 등기임원여부, 임원재직기간내용, 성별코드등을 조회하는 임원정보조회 기능※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
