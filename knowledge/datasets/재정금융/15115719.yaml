description_portal: '한국수력원자력(주)가 공개하는 국내외 신용평가 등급에 대한 데이터입니다. 2018~2025년  한국수력원자력(주)의 국내, 국외 신용등급 현황을 담고 있습니다. 당사는 국내신용평가 3사, 해외신용평가사 3사에서 신용등급을 평가받고있습니다. 붙임의 자료는 연도별 기말기준으로 국내외 신용평가 기관별 신용등급과  향후 전망(Positive, Stable, Negative)이 포함되어 있습니다.  * 신용평가 등급은 AAA/Aaa(최상급신용) 부터 C/D(채무불이행) 까지의 등급이 있습니다.  * 향후전망은 Positive(긍정적 : 향후 신용등급의 상승 가능성이 있음), Stable(안정적 : 향후 현 등급의 유지 가능성이 있음), Negative(부정적 : 향후 신용등급의 하락 가능성이 있음) 3단계가 있습니다.'
