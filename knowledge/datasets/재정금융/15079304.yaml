description_portal: 인천광역시 영종구에서 매년 발표하는 “지방세과세현황” 데이터는 구역별·세목별 과세건수와 과세금액을 상세히 정리한 재정·세제 통계입니다. 주민세·재산세·자동차세 등 주요 지방세를 과세액, 과세건수, 세액구분(예산·실제) 등으로 구분해 제공하므로, 세목별 재정 흐름과 납세패턴을 한눈에 파악할 수 있습니다.  데이터는 연도별, 월별, 세목별로 구분된 CSV·XLSX 형식으로 제공되며, 각 행에는 과세대상 구역, 과세기간, 과세건수, 과세금액, 세액구조(예산·실제) 등이 포함됩니다. 키워드인 “지방세”, “과세건수”, “금액 분류”, “납세분석” 등을 활용해 지역 재정 분석, 세목별 정책 효과 평가, 세수 예측 모델링 등에 활용할 수 있습니다.  이 자료는 영종구의 재정 투명성을 높이고, 지방세 정책 수립·평가에 필요한 근거자료로 활용됩니다. 연구자·시민·기업 등 다양한 이용자는 과세현황을 통해 세목별 재정 기여도를 비교하고, 세수 증대 방안을 모색하거나 지역별 납세자 특성을 분석하는 등 정책·사업 의사결정에 직접 활용할 수 있습니다.
