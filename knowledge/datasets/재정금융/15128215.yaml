description_portal: '- 착오송금반환지원제도는 송금인이 실수로 잘못 송금한 금전을 예금보험공사가 대신 되찾을 수 있도록 도와드리는 제도이며, "21.7월부터 시행되고 있습니다. 최초 제도를 시행할 당시에는 지원한도 상한이 1,000만원 이었으며, "23년부터 5,000만원, "25년부터는 1억원으로 확대하여 금융소비자를 더욱 폭넓게 보호하고 있습니다.- 착오송금 반환지원 현황 데이터는 동 제도가 시행된 이후 반환지원 신청 · 지원대상 · 반환 관련 건수 및 금액 통계를 금액구간별로 보여주는 자료이며, 금액구간은 지원한도 최소 금액인 5만원 이상부터 5,000만원 이하까지 9개로 나누어져 있습니다.("25년 자료부터는 1억원 이하까지 10개 구간 예정)- 본 데이터를 통하여 예금보험공사로 접수된 신청건수 중에서 반환지원대상 건수, 실제로 반환되는 건수 등을 파악하는데 활용할 수 있습니다.'
