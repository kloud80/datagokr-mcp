description_portal: 2019년부터 2026년까지의 기금 수입 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*사회보장기여금은 국민연금, 사학연금, 고용보험, 산재보험기여금을 의미합니다. *기타 수입은 관유물매각대(주식매각수입), 수입대체경비수입, 재화 및 용역판매수입을 의미합니다.* 재정통계는 디지털예산회계시스템에 수록되어 있는 예･결산 자료를 바탕으로 한 것이며, 출처가 디지털예산회계시스템이 아닌 경우에는 그 출처를 “주”에 별도 표시해 두었습니다.* 모든 통계는 합계 또는 소계가 반올림되었으므로 세부 항목의 합계가 총계와 일치하지 않는 경우가 있습니다.* 각 통계표의 계수 단위는 기본적으로 ‘억 원’ 단위이며, 필요한 경우 ‘조 원’ 단위로 표시해 두었습니다.* 정부 조직개편, 재정사업 분류체계 개편 등으로 인해, 소관, 분야, 부문, 프로그램별 시계열 자료 해석 시 유의할 필요가 있습니다.
