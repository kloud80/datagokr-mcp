description_portal: 2015년부터 2026년까지의 중앙 지방 이전 재원 추이 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*교육재정교부금은 2017년 이후부터는 유아교육비보육료 지원을, 2020년 이후부터는 고등학교 무상교육을 위한 교부금 지원을 포함합니다.*2015년 이전 특별회계 교부사업을 포함합니다.(이후 국고보조사업으로 전환)*2023년까지 결산, 2024년부터는 본예산을 기준으로 합니다.* 모든 통계는 합계 또는 소계가 반올림되었으므로 세부 항목의 합계가 총계와 일치하지 않는 경우가 있습니다.* 각 통계표의 계수 단위는 기본적으로 ‘억 원’ 단위이며, 필요한 경우 ‘조 원’ 단위로 표시해 두었습니다.* 정부 조직개편, 재정사업 분류체계 개편 등으로 인해, 소관, 분야, 부문, 프로그램별 시계열 자료 해석 시 유의할 필요가 있습니다.
