description_portal: '부산광역시에서 운영하는 통합자금관리시스템은 시 재정과 자금 운용을 보다 효율적이고 체계적으로 관리하기 위해 다양한 재정 데이터를 제공합니다. 그중 예상수입액수기등록 데이터는 향후 자금 유입을 예측하고 계획하는 데 중요한 정보를 담고 있습니다. 이 데이터를 통해 부산시와 각 자치단체는 예상되는 재정 흐름을 사전에 파악하고, 계획적인 예산 운용과 자금 관리가 가능하게 됩니다. 제공되는 주요 항목은 다음과 같습니다.기준일자: 해당 데이터가 등록되거나 기준으로 삼는 날짜로, 예상 수입액이 어느 시점을 기준으로 산출되었는지 확인할 수 있습니다.비고: 데이터와 관련된 추가 설명이나 특이 사항을 기록한 항목으로, 예상 수입액의 이해를 돕는 보조 정보 역할을 합니다.예상수입액: 특정 기준일을 기준으로 예상되는 자금 유입 금액을 나타내며, 재정 계획과 집행의 기초 자료로 활용됩니다.일련번호: 각 데이터 항목을 고유하게 식별할 수 있는 번호로, 데이터 관리와 조회 시 중요한 기준이 됩니다.자치단체코드: 해당 예상수입액이 속한 자치단체를 식별하는 코드로, 시와 구·군 단위별 재정 계획을 분석하고 관리할 수 있습니다.회계년도: 데이터가 속한 회계 연도를 나타내며, 연도별 예산 계획과 집행 상황을 체계적으로 관리할 수 있습니다.회계코드: 예상수입액 항목이 속한 회계를 구분하는 코드로, 자금 운용과 회계 업무를 정확하고 체계적으로 수행하는 데 활용됩니다.이처럼 예상수입액수기등록 데이터는 부산광역시 및 자치단체의 재정 계획과 자금 운용을 사전에 검토하고 관리하는 데 필수적인 정보를 제공합니다.'
