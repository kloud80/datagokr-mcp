description_portal: '양도소득세란 개인이 토지, 건물 등 부동산이나 주식등과 파생상품의 양도 또는 분양권과 같은 부동산에 관한 권리를 양도함으로 인하여 발생하는 이익(소득)을 과세대상으로 하여 부과하는 세금을 말함양도소득세는 과세대상 부동산 등의 취득일부터 양도일까지 보유기간 동안 발생된 이익(소득)에 대하여 일시에 양도시점에 과세따라서 부동산 등의 양도로 인하여 소득이 발생하지 않았거나 오히려 손해를 본 경우에는 양도소득세가 과세되지 않음- 2025년 중 양도소득세 결정분 또는 경정분을 기준으로 작성- 양도소득세의 납세지는 양도자의 주소지임- 기타1, 기타2는  법인격 없는 단체 및 외국인 등 성별·연령을 확인할 수 없는 경우(단위 : 건수, 백만원)'
