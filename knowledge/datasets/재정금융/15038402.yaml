summary_user: 김포시에서 지역화폐(김포페이)를 쓸 수 있는 가맹점을 업소 한 곳당 한 행으로 담은 건별 목록이며, 사업자 명칭·업종·주소·데이터기준일자를 csv 파일(약 1.4MB)로 제공한다. 김포 시민이 '우리 동네에서 김포페이를 받는 음식점이나 학원이 어디 있나'를 찾을 때 쓰고, 분석가는 업종별 가맹점 분포로 지역 소상공인 상권을 살피는 데 쓴다. 공통 조인 키나 코드표는 없어서, 다른 데이터와 이으려면 주소를 지오코딩하거나 사업자 명칭·업종명을 직접 맞춰야 한다.
description_portal: 경기도 김포시의 지역화폐 가맹점 현황에 대한 정보를 제공합니다. 제공 항목으로는 사업자 명칭, 업종, 주소, 데이터기준일자로 구성되어있습니다. 본 데이터를 통해 업종별로 김포시 내 지역화폐(김포페이)를 사용할 수 있는 업소를 확인하고 주소 정보를 통해 방문해 지역화폐를 사용할 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 지역경제과로 연락주시기 바랍니다.
