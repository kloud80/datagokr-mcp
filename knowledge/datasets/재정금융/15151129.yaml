description_portal: '"금융생산성 측정 기초 데이터셋"은 기업의 재무적 생산성과 성장 잠재력을 분석할 수 있도록 구성된 데이터입니다. 약 13,000개 법인 기업의 5개년(2020년~2024년)치 시계열 정보를 포함하고 있습니다. 주요 포함 데이터로는 업종코드, 지역(시단위), 기업규모, 개업연도 등 기업의 기본 현황과 함께, 차입금회전율, 부가가치율, 총자산회전율 등 경영 효율성을 나타내는 핵심 재무 지표, 그리고 3개년 연속 매출증가여부 같은 성장성 지표가 있습니다. 해당 데이터는 5개년의 시계열 형태로 제공되어 기업의 변화 추이를 입체적으로 분석할 수 있으며, 신용보증기금의 고유 업무 과정에서 수집되어 신뢰도가 높다는 장점이 있습니다. 또한, 업종코드 등 표준 분류 체계를 적용하여 다른 데이터와의 연계 및 융합 분석이 용이합니다. 이 데이터는 금융기관의 새로운 신용평가 모형 개발, 핀테크 기업의 AI 기반 경영 컨설팅 솔루션 개발, 그리고 정부 및 연구기관의 생산성 연구나 정책 수립 등 다양한 분야에서 기초 자료로 활용될 수 있습니다.'
