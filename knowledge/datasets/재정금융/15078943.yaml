description_portal: 부산광역시 해운대구에서 부과, 징수하는 지방세의 세목별, 유형별 미환급금 현황을 나타내는 자료입니다. 미환급금에 대한 유형별 미환급금 건수, 금액, 연간 누적률, 미환급액 증감 현황 등을 제공함으로써 우리 구의 환급금 해소 노력을 확인할 수 있습니다. 이는 납세자 권익 보호와도 관련되어 환급 제도 개선 및 효율화, 지방세 행정의 투명성 제고를 위한 기초자료로 이용될 수 있습니다. 또한, 소액 환급금 기부 활성화를 위한 자료로도 활용될 수 있습니다.지방세 미환급금 현황 등에 대한 구체적인 정보가 필요하신 경우 해운대구청내 세무관리과로 문의하시기 바랍니다.
