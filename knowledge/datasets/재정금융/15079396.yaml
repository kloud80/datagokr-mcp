description_portal: '이 데이터셋은 인천광역시 옹진군이 매년 산출하는 1인당 지방세 부담액을 나타낸다. 주민세·재산세·자동차세 등 지방세 전체를 주민수로 나눈 금액으로, 지역 재정 건전성 및 세부담 형평성을 파악하는 기초 지표이다.  연도별(예: 2015∼2024) 1인당 지방세 부담액(원)과 해당 연도 총 지방세액, 인구(총인구·상주인구) 등의 변수로 구성된다. 데이터는 옹진군 재정통계연보를 기반으로 연 1회 갱신되며, CSV·XLSX 형식으로 제공된다. 출처는 옹진군 재무과이며, 공공데이터포털의 ‘지방세 현황’과 연계해 활용할 수 있다.  정책 입안자는 지역 세부담 변화를 모니터링하고 세제 개편 효과를 평가할 수 있고, 학계·연구기관은 지방재정 격차 분석에 활용한다. 또한 기업·투자자는 지방세 부담 수준을 고려한 사업 전략 수립에 이용할 수 있다.'
