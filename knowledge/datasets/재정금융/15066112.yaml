description_portal: '성인지예산제도는 2011.3.8. 「지방재정법」이 개정·공포 되어 2013년부터 지방자치단체 성인지예산서 작성 근거조항을 마련하였으며, 예산이 여성과 남성에게 미칠 영향을 미리 분석하여 이를 예산편성에 반영함으로써 여성과 남성이 동등하게 예산의 수혜를 받도록 하는 제도로, 성인지예산서는 「지방재정법」제36조의2에 따라 예산이 여성과 남성에게 미칠 영향을 미리 분석한 보고서로 성평등 기대효과, 성과목표, 성별 수혜분석 등을 포함하고 있습니다. - 예산개요(당초예산)기준- 대상회계: 일반회계, 기타특별회계, 기금'
