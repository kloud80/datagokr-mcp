description_portal: 이 데이터는 신용보증기금을 이용한 기업들의 소멸률 정보를 제공하는 자료로, 통계작성 기준연도에 보증을 신규로 공급받았거나 기존 보증잔액을 연말까지 유지한 전체 보증이용 기업을 대상으로 한다. ‘소멸률’은 일정 기간 동안 보증이 종료되거나 보증 이용을 중단한 기업의 비율을 의미하며, 신용보증기금의 보증 유지율, 기업의 생존율 및 보증이용 지속성을 분석하는 데 핵심적인 지표로 활용된다. 해당 데이터는 기업의 업력, 업종, 규모, 지역 등에 따라 소멸률의 차이를 분석할 수 있어, 보증이용 기업의 특성과 리스크 요인을 파악하는 데 유용하다. 또한 기업의 경영상태 변화, 시장 환경, 보증 정책의 효과 등을 평가하고, 향후 보증 지원 전략 및 사후관리 체계를 개선하는 데 필요한 기초자료로 활용될 수 있다.
