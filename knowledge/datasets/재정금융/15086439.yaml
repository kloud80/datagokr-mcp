description_portal: '이 데이터는 기업의 업력별 보증잔액을 구분하여 연도별로 집계한 현황입니다.항목은 ‘구분’, ‘기간구분’, 그리고 연도별 보증잔액(단위: 억원)으로 구성되어 있습니다.-‘구분’ 항목은 모두 ‘보증잔액’으로 표기되어 있으며, 이는 해당 자료가 보증 지원의 총 잔액을 기준으로 작성되었음을 의미합니다.-‘기간구분’은 기업의 업력 구간을 기준으로 하며, ‘3년 이하’, ‘5년 이하’, ‘7년 이하’, ‘10년 이하’, ‘10년 초과’로 구분되어 있습니다. 이는 기업이 설립된 이후 경과한 연수를 기준으로 해당 연도에 적용된 보증잔액을 분류한 것입니다.-각 연도별 항목에는 업력별 보증잔액이 억원 단위로 기재되어 있으며, 연도별 및 업력별 보증 지원 규모를 확인할 수 있도록 구성되어 있습니다.이 데이터는 보증기관이 업력 구간에 따라 자금을 어떻게 배분하고 있는지를 정량적으로 파악하는 데 활용될 수 있습니다.'
