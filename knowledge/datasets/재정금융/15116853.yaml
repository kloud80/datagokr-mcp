description_portal: AEO는 미국 9.11 테러 이후 글로벌 무역안전에 대한 중요성이 부각됨에 따라 세계관세기구(WCO)를 중심으로 국제사회가 채택한 표준으로 AEO업체는 수출입업체, 운송인, 창고업자, 관세사 등 무역 관련 업체를 대상으로 관세청이 법규준수, 내부통제시스템, 재무건전성, 안전관리 분야의 기준을 심사하여 공인한 우수업체이며, 이들에 대해서는 신속통관, 세관검사 축소 등 통관절차 및 관세행정상의 혜택이 부여됨. 해당 데이터는 전체 수입 건수 및 금액 대비 AEO 인증을 받은 기업의 건수 및 금액 비중을 비교한 데이터로서 수입기업의 AEO 인증 여부 판단에 참고 자료로 활용 가능함. 연도별 집계이며, 단위는 건, USA1,000$입니다.
