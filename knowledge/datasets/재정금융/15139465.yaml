    - name: '<<금융부실책임조사 관련 불법행위 신고센터 안내 >  1. 불법행위 신고센터 안내   □ 예금보험공사는 일반 국민이 금융회사 부실관련자 등의 횡령·배임 등 불법행위와 관련된 정보를 쉽고 편리하게 공사에 신고할 수 있도록 하기 위하여 공사 내 전담 신고센터를 설치·운영   ㅇ 공사는 접수된 신고 내용에 대해 필요시 부실책임조사를 실시하고 구체적인 범죄혐의를 포착할 경우 검찰에 수사의뢰를 하는 등의 역할을 수행  □ 신고방식    ㅇ 상담전화 : 02-758-0799 (필요시 공사 직원이 신고자 방문)   ㅇ 우편·방문 : 서울시 중구 청계천로 30 예금보험공사 14층                 금융부실책임조사본부 조사국   ㅇ 팩스 : 02-758-0798   ㅇ e-mail : invest@kdic.or.kr  2. FAQ    ① Q. 부실관련자 등이란 누구를 말하나요?      A. 부실관련자 및 그 이해관계인을 말하는 것으로서 부실관련자란 금융회사 부실을 초래하여 공적자금 및 예금보험기금 투입을 유발한 금융회사 전·현직 임직원 및 금융회사에 대하여 채무를 이행하지 아니한 채무자(채무자가 법인인 경우 해당 법인의 전·현직 임직원 등) 등이며'
