summary_user: 한국자산관리공사가 산업부 사업재편승인 기업의 자산을 매입 후 임대(관리신탁)해 유동성을 공급한 지원 실적을 기업 한 건씩 담은 CSV 파일(약 1KB)로, 기업명·지원시기·기업규모·업종·소재지·고용지원 인원·용도·지원방식을 담는다. 사업재편을 준비하는 기업이나 정책 분석가가 "어떤 업종·규모의 기업이 언제 어떤 방식으로 자산매입형 지원을 받았고 고용은 얼마나 유지됐나"를 확인하는 데 쓴다. 전역 조인 키가 없어 기업명이나 소재지 주소를 기준으로 산업부 사업재편승인 기업 목록이나 다른 기업정보와 이름 매칭으로만 잇는다.
description_portal: '한국자산관리공사 자산매입형 기업지원프로그램 중 사업재편기업 지원(자산매입 후 임대(신탁)) 프로그램의 지원현황을 CSV 파일 형태로 제공하는 데이터입니다. ※ (참고) 한국자산관리공사 사업재편기업 지원 프로그램1. 지원방식 : 사업재편기업이 보유한 자산을 관리신탁방식 등을 활용하여 유동성을 공급함으로써 기업의 신산업 진출 및 사업구조 혁신 등 지원2. 대상기업 : 신산업 진출 등을 위해 산업부로부터 사업재편승인 받은 기업3. 프로그램 장점 : 기존 금융권 대출을 저리의 상품으로 전환하고 추가적인 경영자금을 공급받아 R&D, 시설투자 등 사업구조 전환 추진 가능 4. 관련 사이트 : 한국자산관리공사 온기업 홈페이지(oncorp.kamco.or.kr)'
