description_portal: '부산광역시에서 운영하는 통합자금관리시스템은 시 재정 운영을 보다 효율적이고 체계적으로 관리하기 위해 다양한 재정 데이터를 제공합니다. 그 중 시뮬레이션수기등록 데이터는 실제 예산 집행 전, 자금 운용과 재정 계획을 사전에 검토하고 예측할 수 있도록 지원하는 중요한 정보입니다. 이 데이터에는 다음과 같은 주요 항목들이 포함되어 있습니다.금액: 수기 등록된 항목의 금액으로, 재정 계획이나 시뮬레이션 시 예상되는 자금 규모를 나타냅니다.기준일자: 해당 데이터가 등록되거나 참고되는 기준 날짜로, 시점별 자금 상황을 파악하는 데 활용됩니다.비고: 데이터와 관련된 추가 설명이나 특이 사항을 기록하여, 이해를 돕는 보조 정보 역할을 합니다.사용여부: 현재 데이터가 활성화되어 있는지, 혹은 비활성 상태인지를 나타내어 관리의 효율성을 높입니다.수기등록구분코드: 수기 등록 데이터의 종류를 구분하는 코드로, 다양한 유형의 시뮬레이션 기록을 분류할 수 있습니다.예상수입액일련번호: 관련 예상 수입 데이터와 연결된 고유 식별번호로, 시뮬레이션과 실제 예상액 데이터를 연계하는 데 사용됩니다.일련번호: 각 데이터 항목을 고유하게 식별할 수 있는 번호로, 데이터 관리와 조회의 기준이 됩니다.자치단체코드: 해당 데이터가 속한 자치단체를 식별하는 코드로, 시 및 구·군 단위의 재정 상황을 분석하고 관리할 수 있습니다.최종자료변경일시: 데이터가 마지막으로 수정된 시점을 기록하여, 최신성 및 변경 이력을 확인할 수 있습니다.회계년도: 데이터가 속한 회계 연도를 나타내며, 연도별 자금 계획과 집행 상황을 관리하는 기준이 됩니다.이처럼 시뮬레이션수기등록 데이터는 부산광역시와 각 자치단체의 재정 계획을 사전에 검토하고 예측하는 데 필수적인 정보를 제공하며, 이를 통해 자금 운용의 정확성과 효율성을 높이는 데 중요한 역할을 합니다.'
