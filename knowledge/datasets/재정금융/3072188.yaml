summary_user: 부보금융회사의 업권별 부보대상 예금 금액을 억원 단위로 담은 집계 자료로, 기준연월(calcBaseYm)별로 요구불·저축성·기타 원화예금, 외화예금, 해외지점 예금, 종금계정, 신탁계정 금액을 부보대상·비부보·합계로 나눠 제공하며 범위는 전국이다. 금융 분석가나 연구자가 "은행·보험·증권 등 업권별로 예금보험 보호 대상 예금이 얼마이고 보호되지 않는 예금은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 금융회사 원장·업권별 금융통계와는 업권명이나 기준연월을 맞추는 방식으로만 이어 쓴다.
limits: 금융회사별 금액은 담지 않고 업권 단위 집계만 담으므로 개별 금융회사의 예금 규모 확인에는 쓰지 못한다. 공통 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
