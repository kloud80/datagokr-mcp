description_portal: 신용보증재단중앙회기 지역신용보증재단에 공급한 재보증에 대한 데이터로 원보증의 보증금액 구간별 최근 5년 연 단위 데이터(단위:억원)를 제공합니다. 재보증 공급의 규모별 분포를 파악할 수 있습니다.재보증이란, 신용보증재단중앙회(재보증기관)가 원보증기관인 지역신용보증재단이 소상공인에 대하여 보증한 금액의 일정비율을 재보증하고, 원보증기관이 금융기관에 대위변제 후 회수하지 못한 채권에 대하여 재보증비율에 해당하는 금액을 신용보증재단중앙회(재보증기관)가 지역신용보증재단(원보증기관)에 지급하는 제도입니다.
