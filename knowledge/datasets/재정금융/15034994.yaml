description_portal: 한국무역보험공사 무역보험 사고발생 현황 관련 정보입니다. 단기수출보험은 수출자가 수출계약을 체결하고 물품을 수출한 후, 수입자(L/C거래의 경우 개설은행)로 부터 수출대금을 받을 수 없게 된 때에 입게되는 손실을 보상하는 제도입니다.대금미회수위험은 비상위험과 신용위험으로 이루어져 있습니다, 신용위험은 수입자의 파산이나 지급 불능으로 인한 대금 회수 불능과 일방적인 계약 파기 등으로 인한 수출 불능, 수입자의 재정 상태 악화에 따른 지급 불능, 고의적인 지급 지연, 지급 거절 등 수입자가 당연히 이행해야 할 채무를 이행하지 않아서 발생하는 위험이고, 비상위험은 수입국에서 수입을 금지하거나 수입 제한 조치를 하거나, 수입국 또는 제3국에서의 전쟁, 내란, 혁명, 폭동, 파업과 같은 비상사태 등 수출입계약 당사자에게 책임 지울 수 없는 사유로 인하여 수출이 불가능하거나 수출대금의 회수가 불가능해지거나 또는 해당국의 환거래 제한, 송금 제한 조치로 인하여 수출한 물품대금의 회수가 불가능할 때 수출자나 금융기관이 손실을 입을 위험입니다.
