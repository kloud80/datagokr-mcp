description_portal: '1. 데이터 개요 본 데이터는 예금보험공사의 부보금융회사 중 저축은행업권의 차등평가 재무지표 항목 및 배점의 연도별 현황임2. 데이터 단위 (항목) : 기준연도, 구분, 재무평가지표, 배점 (연도) : 기준연도3. 데이터 주석 1) BIS기준자기자본비율 : 자기자본 / 위험가중자산 2) 단순자기자본비율 : 자기자본 / 총자산 3) 유동성위험노출비율 : 순인출위험액 / (총대출금 - 할인어음 - 고정이하여신의대손충당금) 4) 연체대출비율 : 연체대출금 / 총대출금 5) 순고정이하여신비율 : (고정이하분류여신 - 대손충당금) / (총여신 - 대손충당금) 6) 대손충당금적립률 : 총 대손충당금 잔액 / 고정이하여신 7) 총자산순이익률 : 당기순이익/ 총자산(평잔) 8) 위험가중자산순이익률 : 당기순이익 / 위험가중자산(평잔) 4. 특이사항  1) 사업연도말 기준으로 지표값 산정 2) 유동성위험노출비율은 FY"21 차등평가부터 지표의 산식 변경  * (이전 산식) 순인출위험액 / (총대출금 - 할인어음)'
