description_portal: 본 데이터는 신용보증기금이 운영하는 보험상품에 대해 계약 체결 이후 발생하는 리스크를 관리하기 위한 사후관리 정보를 다각도로 제공하는 자료입니다. ‘기일도래 통지 정보’는 보험계약상 주요 일정 도래에 대한 통보 내역을, ‘매출채권보험 미결업무 정보’는 보험금 청구 후 처리되지 않은 사건을 보여줍니다. ‘부실 원장 요약’은 발생한 부실 건의 요약 데이터를, ‘신업종 소분류 부실률 정보’는 업종별로 세분화된 부실률 통계를, ‘영업점 계정과목 잔액 요약’은 사후관리 대상 채권의 잔액 현황을 제공합니다. 이를 통해 신용위험 분석, 회수 가능성 평가, 업종별 리스크 모니터링, 조직별 관리성과 분석 등 보험 사후관리 전반에 걸친 정책 수립 및 운영의 기초자료로 활용할 수 있습니다.
