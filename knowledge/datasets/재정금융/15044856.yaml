description_portal: 한국무역보험공사의 19개 국내지사별(중앙지사, 해양산업금융부 포함) 주소 및 우편번호를 제공하는 데이터입니다. 서울 본사를 포함해 부산, 대구, 광주, 대전, 인천, 창원 등 전국 주요 산업·무역 거점 지역에 위치한 국내지사는 국내 수출입 기업들이 보다 쉽게 무역보험 서비스를 이용할 수 있도록 지원하는 현장 거점입니다. 지역 기업들에게 맞춤형 상담, 무역보험 상품 안내, 보험 가입 지원  등의 서비스를 제공하고 있으며, 지자체 및 유관기관과 협력하여 중소기업 대상 보험료 지원 사업이나 무역보험 상담회 등 수출지원 프로그램을 운영하고 있습니다.
