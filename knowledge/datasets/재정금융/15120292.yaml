summary_user: 전국 저축은행별로 분기말 기준 총자산, 기업·가계담보·가계신용·기타 대출금, 당기순이익, BIS 자기자본비율, 연체율, 고정이하여신비율, 점포수를 한 행씩 담은 금융회사 단위 경영지표 파일이다. 예금자나 분석가가 거래하려는 저축은행의 건전성(BIS비율·연체율)이나 지역별 저축은행의 대출 구성과 수익성을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 금융회사 원장·부보·영업점 데이터와는 저축은행명이나 같은 기관(예금보험공사) 코드 매핑으로만 이어 붙인다.
