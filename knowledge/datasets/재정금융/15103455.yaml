description_portal: '이 데이터는 금융 사각지대 해소와 포용적 금융 지원을 목적으로 도입된 상거래신용지수 연계보증의 지역별 및 업종별 현황을 제공하는 자료이다. 상거래신용지수 연계보증은 전통적인 재무정보 기반 평가가 어려운 기업(예: 창업 초기, 저신용 기업 등)을 위해 비재무 정보와 상거래 데이터를 기반으로 신용도를 평가하고, 이를 바탕으로 보증을 지원하는 제도다. 본 자료는 상거래신용지수를 활용한 보증이 실제로 어떤 지역과 업종에서 이루어졌는지를 수치화하여 보여주며, 보증 공급의 분포와 활용 실태를 파악할 수 있다. 업종별 데이터를 통해 산업군별 보증 수요 및 수혜 정도를 확인할 수 있고, 지역별 현황은 금융 접근성이 낮은 지역의 보증지원 성과를 분석하는 데 활용된다. 이 데이터는 금융 포용성과 보증제도의 정책 효과를 평가하고, 향후 대안평가 기반 보증 확대 방안 마련을 위한 기초자료로서 중요한 의미를 갖는다.'
