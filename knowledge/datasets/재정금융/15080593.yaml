description_portal: '지방세 미환급 현황 및 연간 누적 현황 데이터로, 세목명, 미환급유형, 납세자유형(개인/법인/사업자/기타), 당해 미환급 건수, 당해 미환금 금액, 누적 미환급 건수, 누적 미환금 금액, 누적 미환금 금액 증감 항목으로 구성※ 누적 미환금 금액 증감: (누적미환급금액–전년도누적미환급금액) / 전년도누적미환급금액※ 전년도누적미환급금액: 누적미환급금액 – 당해미환급금액경기도 성남시에서 발생한 지방세 미환급금의 규모와 처리 현황을 체계적으로 파악하실 수 있도록 구성된 자료입니다. 연도별 미환급금 변동 추이를 통해 환급 절차의 효율성, 환급 안내 정책의 효과성, 납세자의 환급 인지 여부 등을 분석하실 수 있습니다. 이 데이터는 성남시 세정 운영의 투명성 제고, 환급 관리 개선 방안 마련, 납세자 권익 보호 관점에서 중요한 기초자료로 활용되며, 정책평가 및 행정 혁신 추진 과정에서도 활용 가치가 매우 높습니다.'
