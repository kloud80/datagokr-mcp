description_portal: 경상남도 산청군에서 부과하는 지방세 과세액 중에서 비과세액과 감면액에 대한 데이터 자료입니다.각 지방세 세목별(지방교육세, 등록세, 재산세, 주민세, 취득세, 자동차세, 등록면허세, 지역자원시설세, 등록면허세 등) 비과세 감면세액 및 건수를지방세법, 지방세특례제한법, 감면조례, 조세특례제한법, 기타 등으로 분류하여 제공하였습니다.지방세 비과세나 감면은 주로 특정 정책 목표를 달성하거나 사회적 약자를 돕는 방법으로 활용되고 있습니다.지방세 총 과세액에 대한 비과세, 감면의 비중 현황을 제공함으로써 경상남도 산청군이 받고 있는 지방세 감면 및 비과세 혜택의 규모를 파악하는 데에도 도움이 될 수 있습니다.
