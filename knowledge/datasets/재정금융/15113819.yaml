description_portal: '국세기본법 제84조의2(포상금의 지급) 제5항 및 동법 제81조의13(비밀유지) 규정에 따라 제보자의 신원과 제보내용은 보호되고 있습니다.제보처리결과는 과세활용 여부만 통지하며, 추징세액 등 개별 과세내역은 관련법에 따라 알려드리지 않습니다.동일한 제보를 반복해서 제출하실 경우 제보처리가 지연될 수 있습니다.사실과 다른 내용 및 허위 증빙을 근거로 제보하는 경우 관련 법률에 따라 민·형사상 책임을 질수 있습니다.현금영수증 미발급, 현금영수증 신용카드 발급거부 신고는 현금영수증 민원신고 메뉴를 이용하시기 바랍니다.근로·자녀장려금 부정수급 신고의 경우 포상금 지급이 없습니다.2025년 12월 31일 기준 지방청별, 납세자 유형별(개인, 법인)  탈세제보자료 처리 실적 및 추가징수세액단위 : 건, 백만원'
