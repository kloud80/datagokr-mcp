description_portal: 국가 회계 및 기금별 순자산의 변동 내역을 정리한 정보입니다. 기초순자산, 재정운영결과, 조정항목 등의 항목이 포함되어 있으며, 회계 단위와 기금별로 구분된 결산 데이터를 통해 순자산의 증감 원인을 확인할 수 있도록 구성되어 있습니다. 본 데이터는 자산 결산 및 회계 투명성 확보를 위한 기초 자료로 활용되며, 정부의 재정 상태와 자산 운용 흐름을 분석하는 데 유용합니다. 또한 회계, 기금, 순자산 외에도 자산결산, 순자산평가, 회계정보, 재정통계, 기금운용 등 다양한 키워드와 연계되어 있으며, 열린재정을 통해 제공됩니다. 공공저작물로 제공되므로, 활용 시 메타정보에 포함된 저작권 사항을 반드시 확인 후 이용하시기 바랍니다.
