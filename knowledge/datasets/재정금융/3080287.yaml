summary_user: 인천광역시 부평구에 등록된 대부업체를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록 업종, 등록증번호, 상호, 도로명 소재지, 등록일자가 들어 있다. 소비자가 돈을 빌리기 전에 상대 업체가 부평구에 정식 등록된 대부업체인지 상호나 등록증번호로 확인하거나, 분석가가 구 안에서 대부업체가 어디에 몰려 있는지 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 시군구의 대부업 등록현황과는 상호·등록증번호·주소 같은 이름 매칭으로 잇고, 위치 분석을 하려면 도로명 소재지를 주소 정제나 지오코딩한 뒤 결합해야 한다.
description_portal: 대부업 관련 정보를 수록한 공공데이터로, 부평구 내 등록 대부업체 현황을 제공합니다. 주요 항목으로는 순번, 시군구명, 등록신청사업 유형, 등록증번호, 업체 상호명, 소재지(주소), 등록일자 등이 포함되어 있으며, 대부업체의 위치 및 등록정보를 확인할 수 있습니다. 이 데이터는 불법 대부업 차단, 소비자 보호, 금융 정책 수립 등을 위한 기초자료로 활용될 수 있으며, 대부업 관리의 투명성과 지역 금융현황 파악에 기여합니다.ex) 1,인천광역시 부평구,대부업,인천부평-2021-00015,에치에스대부(주),인천광역시 부평구 세월천로 216-14, 1층 (청천동),2021-06-10
