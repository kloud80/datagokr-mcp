summary_user: 국가와 공공기관이 공매로 매각하는 자산을 물건 단위로 담은 건별 원천 데이터로, 전국 265,058건이 2004-06-01부터 2026-09-29까지 들어 있고 공매물건명·물건 상태·감정평가금액·최저공매가격·처분방법·소재지·집행기관 담당자 정보를 포함한다. 입찰을 준비하는 개인·사업자가 "우리 시군구에 지금 나온 국유 부동산 공매 물건과 최저공매가는 얼마인가"를 확인하거나, 분석가가 유찰·최저입찰가율 흐름으로 공매 시장을 모니터링하는 데 쓴다. 별도 코드 키는 없고 소재지 도로명주소·상세주소와 시도명을 연결 고리로 삼아 토지·건물 원장이나 행정구역 기준 통계와 이어 쓴다.
description_portal: 공매자산정보는 기준일자를 기준으로 국가 및 공공기관이 매각을 진행하는 자산에 대한 상세 정보를 제공하는 데이터입니다. 주요 항목에는 공매일자, 공매물건명, 물건 상태, 공매유찰횟수, 감정평가금액, 최저공매가, 매각처분방식, 소재지 주소, 매각주관기관 정보, 유가증권종류 등 자산 유형 정보가 포함됩니다. 해당 데이터는 공공기관 자산의 처분 현황을 투명하게 공개하여 공정하게 거래할 수 있도록 합니다.민간 참여를 유도하고, 입찰 분석, 자산 활용방안 수립, 시장 모니터링 등에 활용할 수 있습니다.
