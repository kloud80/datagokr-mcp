description_portal: 서울시 시민참여예산사업 예산집행 정보는 시민이 제안하여 선정된 사업들의 예산 편성 및 집행 현황을 제공하는 공공데이터입니다. 연도와 제안번호를 통해 개별 사업을 식별하고, 사업명과 예산편성사업명, 사업위치를 통해 어떤 사업이 어디에서 추진되는지 알 수 있습니다. 예산편성사업비와 지출금액, 사업추진단계, 집행률, 집행기준일 정보는 편성 예산 대비 실제 집행 규모와 추진 상황을 파악하는 데 활용됩니다. 예산편성계획서와 결과보고서 파일 항목을 통해 사업 계획과 집행 결과를 비교·검증할 수 있으며, 비고 항목에는 집행 지연 사유 등 추가 설명이 포함되어 예산 집행의 투명성과 시민 참여 평가 자료로 활용할 수 있는 데이터입니다.
