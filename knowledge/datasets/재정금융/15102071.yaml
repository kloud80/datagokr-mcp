description_portal: '한국수력원자력(주)의 연도별 요약 연결 재무상태표를 공개합니다. 해당 재무상태표는 공기업.준정부기관 회계사무규칙에 따라 작성되었습니다. 동 규칙에 규정되지 아니한 사항에 대하여는 한국채택국제회계기준을 적용하였습니다. 해당 데이터는 공개일 기준 최근 8년간(2025년 공개 데이터의 경우 2018년부터 2025년까지) 데이터를 포함하며, 공개정보는 과목, 자산, 부채, 자본, 금융부채(이상 금액 항목 단위: 백만원), 부채비율(단위: %) 항목으로 구성되어 있습니다.* 기업회계기준서 제1016호 "유형자산"개정으로 기준서 경과규정에 따라 2021년 말 재무상태표를 소급 재작성하였습니다.'
