summary_user: KOTRA 해외무역관이 발굴한 각국 정부·기업·기관 추진 해외 프로젝트를 프로젝트 단위로 담은 목록 파일이며(CSV 약 616KB), 국가·발주처·프로젝트 단계·입찰예정일·재원조달·규모(백만불)·상세설명·무역관 의견을 포함한다. 해외 수주나 수출을 노리는 기업이 '특정 국가에서 입찰을 앞둔 대형 인프라 프로젝트는 무엇이고 재원은 어디서 나오는가'를 찾을 때 쓴다. 실측 조인 키는 무역관(kotra_trade_office) 하나뿐이어서, 같은 무역관 키를 가진 KOTRA의 다른 데이터와 무역관 기준으로 이어 쓴다.
description_portal: KOTRA에서 공공데이터포털에 개방하고 있는 해외 유망 프로젝트 데이터는 각 국가 정부, 기업, 기관 등이 추진하는 다양한 해외 프로젝트 목록을 제공하는 데이터입니다. 해당 데이터는 지난 데이터 등록 이후 2024년부터 2025년까지 업데이트된 세계 각  국에서 추진했던 프로젝트 상세 정보를 반영하고 있습니다. 이 데이터를 통해 해외 프로젝트의 기본 정보와 함께 각 프로젝트별 세부설명, 추진현황, 재원 조달처 등 추가적인 내용 확인을 통해 잠재 기회를 파악하고, 해당 프로젝트에 참여하거나 수출 기회를 모색할 수 있습니다.
