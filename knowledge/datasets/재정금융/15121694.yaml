summary_user: 신용보증기금이 운용하는 유동화회사보증(P-CBO 등 자산유동화 방식 보증)에 편입된 기업을 한 행씩 담은 기업별 명세 파일로, 편입가능금액·당기결산년도·당기매출금액·동종업계부채비율·기업규모·상시직원수·외부감사대상여부·업종명을 담으며 범위는 전국이다. 정책 분석가나 금융 연구자가 '유동화회사보증에 편입된 기업은 어떤 업종·규모이며 매출과 편입가능금액은 어느 수준인가'를 볼 때 쓴다. 이 파일 안에서 기업을 구분하는 키는 편입기업원장번호(kodit_abs_incorp_ledger_no)뿐이고 사업자등록번호나 기업명은 필드에 없어, 다른 기업 데이터와 기업 단위로 바로 잇기는 어렵고 업종명·기업규모 기준으로 집계해 비교하는 방식으로 쓴다.
description_portal: 해당 파일은 신용보증기금이 운용하는 유동화회사보증의 편입기업 관련 데이터로, 당기매출금액 등의 항목을 제공합니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
