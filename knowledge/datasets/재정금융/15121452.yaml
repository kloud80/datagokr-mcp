description_portal: '민속주는 주류부문의 무형문화재 보유자나 식품명인이 전통 방식으로 제조한 술을 말하며, 주세법상 전통주로 분류전통주는 더 넓은 개념으로, 민속주와 지역특산주를 포함함민속주(전통주)의 주요 종류는 크게 탁주, 약주, 소주로 나뉘며, 이 외에도 과실주, 기타 증류주 등이 있음 탁주는 막걸리처럼 발효된 상태의 술이며, 약주는 탁주를 맑게 걸러 만든 청주나 약용 재료를 첨가한 술, 소주는 증류 과정을 거쳐 도수를 높인 술을 의미함- 2024년 출고를 기준으로 작성함- 종량세 주종(탁주, 맥주, 주정)의 과세표준은 ㎘기준이며, 그외 종가세 주종의 과세표준은 백만원 기준임(단위 : kl, 백만원)'
