description_portal: 1. 개요예금보험공사 운영에 필요한 자금을 관리하는 회계(공사회계)의 예산에 관한 정보2. 단위 원단위3. 구분 자본예산, 손익예산_인건비, 손익예산_경비, 손익예산_예비비4. 참고사항동 예산은 예금자보호법 제23조* 및 동법 시행령 제13조**에 따라 예금보험위원회의 의결을 거쳐 금융위원회의 승인으로 확정되었습니다.  *예금자보호법 제23조(예산과 결산) 공사의 예산과 결산은 위원회의 의결을 거쳐 금융위원회의 승인을 받아야 한다.**예금자보호법 시행령 제13조(예산과 결산) 법 제23조의 규정에 의하여 공사의 예산은 회계연도 개시전에 금융위원회의 승인을 얻어야 하고, 공사의 결산은 회계연도 종료후 3월 이내에 금융위원회의 승인을 얻어야 한다.
