description_portal: '예금보험공사는 보험사고가 발생한 금융회사의 상태, 보험사고일, 지급결정일, 지급공고일, 연락처에 대해 공개하고 있습니다.1. 데이터 항목금융권역 : 금융업의 기능과 성격에 따라 은행, 보험, 증권 등으로 구분한 업권 단위금융회사 : 공채·사채·주식 따위의 유가증권이 발행되는 경우에 이를 맡아서 기업에 자금을 공급하는 일을 하는 회사상태 : 금융회사의 영업 현황(예 : 파산 등)보험사고일 : 금융회사가 예금을 지급할 수 없는 상태로서  「예금자보호법」 제2조 제8호에 따라 인가취소, 해산명령, 영업정지, 파산 등 조치를  받은 일자지급결정일 : 예금보험공사가 예금보험위원회의 의결을 거쳐 보험금 지급대상, 지급여부, 지금 금액 등을 최종 결정하는 일자지급공고일 : 보험금 청구 및 지급기간, 보험금 지급장소, 보험금 지급방법, 공사가 보험금 지급업무를 대행하게 하는 경우 그  대행기관을 공고하는 일자연락처 : 보험사고 발생 해당 금융회사의 관련 담당자 연락처2. 데이터 주석1) 보험사고 : 「예금자보호법」 제2조 제8호 다음 각 목의 어느 하나에 해당                    가. 부보금융회사의 예금등 채권의 지급정지("제1종 보험사고")                    나. 부보금융회사의 영업 인가·허가의 취소, 해산결의 또는 파산선고("제2종 보험사고")2) 지급결정 : 제1종 보험사고의 경우 공사가 보험사고 통지를 받은 날로부터 2월 이내 위원회의 의결을 거쳐 보험금 지급 여부 결정, 제2종 보험사고의 경우 보험금 지급 결정이 필요 없으며  예금자 청구에 의하여 보험금지급 절차를 개시하여 보험금 지급'
