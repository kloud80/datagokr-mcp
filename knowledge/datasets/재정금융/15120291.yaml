description_portal: '부실주척은행 정리 연혁예금보험공사에서는 2011년 신설된  「예금자보호법」 특별계정의 자금 지원을 받은 부실저축은행들에 대하여 연혁별로 정리 관련 자료를 제공하고 있습니다.1. 데이터 항목 부실저축은행 : 2011년  「예금자보호법」 특별계정 신설 이후  정리한 부실저축은행의 회사명영업정지일 : 해당 부실저축은행의 영업 정지 일자 보험금 지급개시일 : 해당 부실저축은행의 예금보험금 지급 시작 일자파산선고일 : 해당 부실저축은행의 파산 선고 일자정리유형 : 부실저축은행의 정리 방식으로 가교저축은행 계약이전 정리방식 또는 제3자 계약이전 정리방식의 유형이 있음2. 데이터 주석부실저축은행 : 금융산업의 구조개선에 관한 법률 제2조 제2호 또는 예금자보호법 제2조 제5호에 해당하는 저축은행제3자계약이전 : 부실금융회사의 우량 자산·부채를 제3자 인수자에게 선택적으로 이전하는 정리방식가교계약이전 : 공사가 가교금융회사(정리금융회사)를 설립하여 부실금융회사의 우량 자산·부채를 계약이전한 후 가교금융회사의 지분을 매각하는 정리방식'
