description_portal: 성남시 연도별 지방세 과세 및 비과세 현황을 세목별로 제공하고 있으며, 세목명, 과세 건수, 과세 금액, 비과세 건수, 비과세 금액 항목으로 구성되어 있습니다. 성남시가 부과·징수하는 주요 지방세의 규모와 변동 추이를 체계적으로 파악하기 위한 기초 재정자료이다. 이 데이터에는 취득세, 재산세, 자동차세 등 세목별 부과액과 징수율, 세수 증감 현황 등이 포함되며, 성남시의 재정 건전성 분석, 세수 기반 확충 전략 수립, 지역 경제·부동산 시장 변화 파악 등 정책 활용에 중요한 근거자료로 사용된다. 또한 연도별·세목별 비교가 가능해 지방세 구조 변화를 분석하거나 타 지자체와의 세수 수준을 비교하는 데에도 활용 가치가 높다.
