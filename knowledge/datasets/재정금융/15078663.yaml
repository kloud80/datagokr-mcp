summary_user: 경기도 자치단체별·세목별로 연도마다 실제 과세된 건수와 금액, 비과세 처리된 건수와 금액을 담은 집계 자료다. 지방세 분석가나 정책 담당자가 "특정 연도에 어느 세목에서 비과세 금액 비중이 높았나" 같은 세수 구조·감면 조정 질문에 쓴다. 전역 조인 키는 없고, 자치단체코드(sfrnd_cd)나 시도명을 이름·코드 매핑해 시도·시군구 단위 지역 지표와 잇는다.
description_portal: 이 데이터는 경기도의 연도별 지방세 과세 현황을 정리한 자료로, 자치단체별 세목별로 실제 과세된 건수와 금액, 비과세 처리된 건수 및 금액 정보를 포함하고 있습니다. 주요 항목은 시도명, 자치단체코드, 과세년도, 세목명, 과세건수, 과세금액, 비과세건수, 비과세금액으로 구성되어 있습니다. 본 데이터는 특정 연도에 어떤 세목에서 얼마만큼의 세금이 과세되었는지, 그리고 어떤 항목에서 비과세 처리가 되었는지를 파악할 수 있도록 하며, 세수 구조 분석, 과세 기반 확대 정책 수립, 지방세 운영 성과 평가 등에 활용될 수 있습니다. 또한 비과세 금액 비중이 높은 세목에 대한 세정 정책 재설계나 감면 제도 조정의 근거자료로 활용할 수 있습니다.
