description_portal: 아동기부터 노년기까지 생애주기 단계별로 필요한 경제역량을 기반으로 제작된 경제교육 콘텐츠입니다. 각 연령대에 적합한 교수학습자료와 자기주도 학습자료를 함꼐 제공하여 학습자와 교육자 모두 활용할 수 있도록 구성되어 있습니다. 생애주기, 경제, 교육이라는 키워드를 중심으로 구성된 본 자료는 연령별, 계층별 경제 이해도 향상과 실생활 적용력 강화를 목적으로 합니다. 학교수업, 시민교육, 직업훈련 등 다양한 교육환경에서 활용가능하며, 개인의 경제적 자립과 합리적 판단 능력 함양에 기여합니다. 금융이해, 경제이해, 경제역량, 학습콘텐츠, 교육현장, 자율학습 등과도 연계되어 경제교육의 접근성과 효과성을 높이는 자료입니다. 콘텐트는 재정경제부, 한국개발연구원(KDI)에서 자체 개발제작한 콘텐츠와 정부기관, 유관기관, 연구기관, 금융, 재단 등에서 제작한 경제관련 콘텐츠를 연계하여 통합적으로 제공하고 있습니다.
