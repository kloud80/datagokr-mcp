description_portal: ※ 본 데이터는 시민참여예산 제안사업 상시 접수 건으로 2017년부터 2022년까지 한시적으로 운영되었으며, 사업 종료에 따라 추가 데이터 갱신은 제공되지 않습니다.※ 시민참여예산 제안사업 정기 접수 정보는 「서울특별시_시민참여예산사업 접수정보」 데이터셋을 이용하여 주시기 바랍니다.서울시 시민참여예산 제안사업 신청정보 데이터는 시민이 제안한 예산사업의 기본 신청 내용을 관리하는 핵심 자료입니다. 회계년도와 제안번호는 제안을 구분하는 식별값이며, 사업이름은 제안 사업의 제목입니다. 사업위치_구와 상세 위치는 사업이 시행될 자치구와 구체적 장소를 나타내어 지역별 사업 분포 분석에 활용됩니다. 소요예산은 사업 추진에 필요한 예산 규모를, 사업시작일과 종료일은 추진 기간을 보여줘 일정·집행 가능성 검토에 쓰입니다. 참여구분과 참여분야는 제안자의 참여 유형과 정책 분야를 분류하는 코드입니다. 제안취지, 사업내용, 사업효과는 사업 필요성, 실행 계획, 기대 성과를 설명하는 핵심 서술 항목으로 심사와 공론화의 주요 근거가 됩니다. 게시물번호와 접수번호는 온라인 게시와 행정 접수를 구분하는 식별값이며, 위치도·현장사진·기타파일 ID는 현장 상황과 참고자료를 첨부·연계하는 파일 정보입니다. 작성·수정 일시 항목은 신청 내용의 입력과 변경 이력을 관리하고, 조회수는 시민 관심도를 파악하는 지표입니다. 신청 취소 여부는 제안 철회 여부를, 자비와 시·구비는 재원 중 자부담과 지방재정 부담 구조를 구분하는 재정 정보입니다. 접수구분과 상태코드는 접수, 심사, 선정 등 처리 단계별 진행 상황을 관리하는 절차 관리용 코드입니다.
