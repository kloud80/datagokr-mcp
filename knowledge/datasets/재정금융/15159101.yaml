description_portal: 본 데이터는 지방세 세목별 비과세 및 감면 현황을 건수, 세액, 부과액 및 감면비율 기준으로 체계적으로 집계한 자료이다.자료는 일정 기간 동안 발생한 지방세 부과 및 감면 내역을 대상으로 하며, 세목별로 비과세 및 감면 적용 건수와 이에 따른 감면 세액, 총 부과액 대비 감면비율 등을 포함하고 있다.감면 건수는 적용 법령에 따라 「지방세법」, 「지방세특례제한법」, 지방자치단체 감면조례 및 「조세특례제한법」으로 구분하여 산출하였으며, 각 법령별 감면 규모 및 비중을 비교·분석할 수 있도록 구성하였다.또한 본 데이터는 지방세 과세 구조 내에서 비과세 및 감면이 차지하는 규모와 특성을 파악하고, 법령별 감면 정책의 운영 현황을 분석하기 위한 기초자료로 활용될 수 있다.아울러 지방재정 운용의 투명성 제고 및 정책 수립·평가를 위한 참고자료로 활용 가능하다.
