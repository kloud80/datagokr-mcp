summary_user: 신용보증기금이 문화산업완성보증으로 지원한 기업의 보증 건을 한 행씩 담은 원천 명세로, 보증취급일·취급금액·업종·장르(영화·드라마·게임 등)·소재지를 기록한 전국 범위 CSV 파일(약 89KB)이다. 문화콘텐츠 정책 분석가나 제작사가 '어떤 장르와 지역의 제작사가 언제 얼마의 완성보증을 받았는가'를 확인하는 데 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어, 업종코드·업종명이나 소재지 주소를 매핑해 업종·지역 통계와 맞춰 보는 정도로만 이어 쓴다.
description_portal: 이 데이터는 신용보증기금의 문화산업완성보증 지원현황을 나타낸 것으로, 문화콘텐츠 제작자에게 제공되는 특화된 보증제도의 운영 실적을 확인할 수 있다. 문화산업완성보증은 영화, 드라마, 애니메이션, 게임 등 문화상품을 제작하는 사업자가 유통사와 체결한 계약에 따라 상품을 완성하고 인도할 수 있도록, 금융회사 등으로부터 자금을 대출받을 때 발생하는 채무를 신용보증기금이 보증하는 제도다. 해당 보증은 문화산업의 특수성을 반영하여 기획·제작 단계에서 발생하는 자금 부담을 완화하고, 유통계약 기반의 안정적인 제작환경을 조성하는 데 목적이 있다. 본 데이터를 통해 연도별 보증금액, 건수, 수혜 업체 수 등 문화산업에 대한 금융지원 규모와 추이를 파악할 수 있으며, 창의 산업에 대한 정책적 지원 성과 및 보증제도의 실효성을 평가하는 데 활용된다.
