description_portal: 지방세는 지방자치단체의 주요 재원을 구성하는 핵심 세입으로, 주민복지 향상과 지역사회 발전을 위한 재정 기반입니다. 본 자료는 지방세의 세목별 주요 내용을 종합적으로 정리한 안내자료로서, 각 세목에 대한 세목명, 개요, 과세대상, 납세지, 납세의무자, 과세기간 및 사업연도, 세액공제 및 감면, 과세기준일, 과세표준, 세율, 세부담상한제, 세액산출 방식, 납부기간, 납부방법 등 실무에 필요한 정보를 종합적으로 제공합니다. 지방세를 처음 접하는 납세자는 물론, 세무 행정 실무를 담당하는 공무원들도 이 자료를 통해 지방세 제도의 전반적인 구조와 세목별 특징을 이해하고 업무 처리에 참고할 수 있도록 구성하였습니다.
