description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시에서 발행하고 운영하는 남원사랑상품권의 월별 발행 및 이용 현황을 종합적으로 정리한 자료입니다. 지역 내 소비를 촉진하고 소상공인을 지원하기 위해 운영되는 지역화폐의 실제 사용 양상을 면밀히 파악할 수 있으며, 지류상품권과 모바일상품권의 두 가지 형태로 나누어 각각의 판매·충전 금액과 실제 이용 금액을 월별로 세밀하게 추적할 수 있습니다. 이를 통해 지역경제의 순환 효과와 소비 트렌드 변화를 심층적으로 분석하고, 향후 지역화폐 정책 수립에 중요한 기초자료로 활용할 수 있습니다.2. 데이터 항목명- 기준연월- 지류상품권 판매금액- 지류상품권 이용금액- 모바일상품권 충전금액- 모바일상품권 이용금액3. 활용 효과지역화폐의 발행과 이용 패턴을 심층적으로 분석하여 소상공인의 매출 증대 및 지역경제 활성화 정도를 정확하게 측정할 수 있으며, 이를 바탕으로 효과적인 지역경제 정책 수립과 합리적인 예산 배분을 위한 핵심 근거자료로 활용할 수 있습니다.
