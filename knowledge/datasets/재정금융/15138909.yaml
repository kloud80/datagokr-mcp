description_portal: 이 데이터는 기술보증기금이 한 해 동안 중소기업과 중견기업을 대상으로 제공한 보증의 잔액 현황을 월별로 집계한 자료입니다. 보증잔액은 특정 시점 기준으로 여전히 유효한 보증금액을 의미하며, 기술보증기금이 해당 기업에 대해 현재 부담하고 있는 신용보증 규모를 파악할 수 있는 주요 지표입니다.주요 항목은 다음과 같습니다.**‘연도’**와 **‘월’**은 자료가 집계된 기준 시점을 나타냅니다.**‘중소기업(억원)’**은 해당 월 기준 중소기업 대상 보증잔액을 의미하며,**‘중견기업(억원)’**은 중견기업 대상 보증잔액,**‘총 잔액(억원)’**은 중소기업과 중견기업 잔액을 합산한 전체 보증잔액을 나타냅니다.여기서 중소기업은 「중소기업기본법」에 따라 업종별 상시 근로자 수, 자산총액, 매출액, 자본금 등의 기준을 충족하는 기업으로, 통상적으로 자본금 120억 원 이하 또는 연매출 1,000억 원 이하 등의 조건이 적용됩니다.반면 중견기업은 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」에 따라 직전 3년 평균 매출액이 3,000억 원 미만이면서 중소기업 기준을 초과한 기업으로 정의되며, 대기업에 해당하지 않으면서 일정 규모 이상으로 성장한 기업군입니다.이 데이터는 월별 보증잔액 추이 분석을 통해 계절적 보증 수요, 중소기업과 중견기업 간 지원 비중, 자금공급 흐름의 변화를 살펴보는 데 활용될 수 있으며, 보증제도의 기업 규모별 집중도 및 정책적 편중 여부를 평가하는 기초자료로도 활용될 수 있습니다.
