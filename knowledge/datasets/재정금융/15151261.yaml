description_portal: (데이터 정의) 사업자보증현황자료(규모별)는 지역신용보증재단이 지역 내 기업을 대상으로 지원한 보증 현황을 기업 규모별(소상공인, 소기업, 중기업)로 구분하여 정리한 연간 자료입니다.(데이터 구성내용) 기업규모구분과 연도별 보증공급액(단위:억원)과 보증잔액(단위:억원)으로 구성되어 있으며, 보증공급액은 연간 신규로 공급된 보증금액(기한연장 포함)이고 보증잔액은 해당 연도 시점에서 남아있는 보증채권 잔액을 말합니다.(데이터 활용) 해당 자료는 보증지원 규모를 파악하고,보증 지원 수준을 분석하기 위한 기초 통계로 활용 가능합니다.(기타설명) 사업자 보증은 신용보증과 햇살론을 포함하고 있습니다
