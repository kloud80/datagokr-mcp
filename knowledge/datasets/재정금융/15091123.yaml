summary_user: 예금보험공사가 부보금융회사(은행·금융투자·손해보험·생명보험)의 업무보고서를 바탕으로 만든 경영현황·주요 재무 정보를 금융회사 단위로 담으며, 검증 시 전국 범위 24건이 수신되었다. 분석가나 금융상품 공급자를 살피는 사람이 특정 금융회사의 자산·부채·자본 총계, 당기순이익, 부실채권비율, 유동성비율 같은 건전성 지표를 확인하는 질문에 쓴다. 법인등록번호(crpno, corp_rgst_no)를 조인 키로 삼아 같은 키를 쓰는 다른 금융회사·기업 정보와 이어 쓰며, 퇴직연금·금융상품의 공급자 원장으로 연결된다.
limits: API 전체 건수가 24건이라 개별 금융회사 전수 조회용이 아니며, 필드 명세에 의미와 코드표가 비어 있어 지표 정의와 단위는 별도로 확인해야 한다. 갱신 주기는 근거 자료에 없어 최신성은 확인되지 않는다.
