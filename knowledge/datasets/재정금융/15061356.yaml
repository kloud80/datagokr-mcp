description_portal: '금융통계할부금융사정보는 기준년월을 중심으로 할부금융사의 일반 현황 및 재무 현황에 대한 통계자료를 제공하는 데이터입니다. 할부금융사별 인가일자, 임직원 수, 본점·지점 수와 같은 조직 일반 정보뿐 아니라 자본금, 총자산, 영업수익, 당기순이익 등 주요 재무 항목을 시계열로 확인할 수 있도록 구성되어 있습니다.이 데이터는 4개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 할부금융사 일반현황 조회 : 할부금융사의 금융회사명, 임직원수, 임직원구분코드명 등의 일반 현황 정보를 제공합니다.② 할부금융사 재무현황 조회 : 자산요약재무상태표계정과정금액, 자산요약재무상태표계정과목코드, 자산요약재무상태표계정과목구성비율, 법인등록번호, 금융회사명 등 주요 재무 지표를 제공합니다.③ 할부금융사 주요 경영지표 조회 : 자본적성성항목코드, 자본적성성항목코드명, 자본적성성항목값내용, 금융회사명 등 할부금융사 주요 경영지표정보를 제공합니다.④ 할부금융사 주요 영업활동 조회 : 부문구분값 내용, 부문구분코드, 부문구분코드명 등 할부금융사 주요 영업활동 정보를 제공합니다.'
