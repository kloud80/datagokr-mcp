description_portal: '(월별 수입징수 상황 정보) 예산과목 단위 월별 수입징수 현황 정보* 잠정치로 변동 가능성 있음, 확정치는 연도별 결산 현황에서 제공* 컬럼별 상세설명○ 징수결정본월금액 → 회계월 간 징수하기로 결정된 금액○ 징수결정누계금액 → 회계연도 간 해당 회계월까지 징수하기로 결정된 금액○ 수납본월금액 → 회계월 내 납입되어 징수가 완료된 금액○ 수납누계금액 → 회계연도 간 해당 회계월까지 납입되어 징수가 완료된 금액○ 불납결손본월금액 → 징수가 불가능하여 결손처리된 금액 중 해당 회계월에 발생한 금액○ 불납결손누계금액 → 해당 회계연도에 발생한 결손액의 누계○ 미수납누계금액 → 납입되지 않아 징수가 완료되지 않은 금액의 누계* 해당 데이터는 공공저작물입니다. 링크 내의 저작권 정보를 참고하시어, 이용에 유의하시기 바랍니다.(링크 내, "메타정보열기"를 통해 조회가능)- 출처: https://www.openfiscaldata.go.kr/fdata/0XY022UGD797MPMB69617398266'
