description_portal: 지방세 체납현황을 체납액 규모별로 제공(시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 체납액구간, 체납건수, 체납금액, 누적체납건수, 누적체납금액)지방자치단체에서 징수하기로 되어 있으나 아직 납부되지 않은 지방세의 금액, 체납 기간 및 체납자 유형 등을 정리한 자료입니다. 이 데이터는 체납액 규모, 장기 체납자 현황, 세목별 비교, 지역별 체납 분포 분석 등에 유용하며, 세수 확보 전략 수립, 재정 건전성 평가, 민원·징수 대응, 행정 형평성 점검 등에 활용될 수 있습니다.건 수와 금액이 많아 엑셀이나 메모장 같은 일반 뷰어로는 일부만 확인될 수 있으므로 R, Python, GIS 등 전용 분석 도구를 사용하는 것이 권장됩니다.체납 기준일, 체납 구간(1개월, 1년 이상 등), 체납 정리 현황, 법적 단계(독촉, 가산금 등) 등에 대한 상세 정의는 해당 지자체의 메타데이터나 기술문서를 참고하시기 바랍니다.
