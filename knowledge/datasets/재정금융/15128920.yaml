summary_user: 한국주택금융공사가 발행한 주택저당채권담보부채권(MBB)의 발행실적을 유동화계획(회차)별로 담으며, 발행일자·발행금액·트랜치잔액·가중평균발행금리·발행통화를 제공하고 범위는 전국·비공간이다. 채권 투자자나 금융 분석가가 'MBB 발행 금리와 발행 규모가 시기별로 어떻게 달라졌는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 유동화계획명(sePlanNm)이나 발행일자 기준의 이름·날짜 매칭, 또는 같은 기관의 다른 데이터와 맞춰 이어 쓴다.
limits: 표준 코드가 없어 다른 기관 데이터와 키로 자동 결합할 수 없고, 이름·날짜 매핑에 의존해야 한다. 지역 단위 구분이 없는 전국 단위 자료라 지역별 분석에는 쓰지 못한다.
