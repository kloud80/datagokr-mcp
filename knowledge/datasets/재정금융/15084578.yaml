description_portal: '경기도 파주시에서 관리하는 납세정보 중 수기로 접수된 종합소득세 관련 영수필 내역을 디지털화하여 행정·재정 분석 및 시스템 통합에 활용할 수 있도록 구성된 정형 데이터로, 주요 필드로는 회계일, 신고년월, 신고일자 등 시간 정보를 비롯해, 세목코드, 납세자구분, 귀속년도, 등록년도 등 세금의 분류 및 기준 정보를 포함하며 종합소득세 본세 외에도 산출세액에 대한 주민세, 신고·납부 불성실에 따른 가산세 항목(가산세생성여부, 지연일수, 총가산세 등)이 포함되어 있어, 가산세 발생 및 징수 지연에 따른 행정적 리스크 분석이 가능하고, 이체일, 납부일 등을 통해 세금의 실제 납부 흐름을 파악할 수 있으며, 과세대상 여부에 따른 정량적 집계도 가능합니다. 세수 추이 분석, 지자체 세입 분석, 불성실 납부자 패턴 탐지, 납세 유도 정책 수립, 기계학습 기반의 체납 예측 모델 개발, 체납 리스크 예측, 납세 성실도 평가, 정책 효과성 검증 등에 적용 가능하며, 데이터 엔지니어링, 머신러닝 전처리, 시계열 회귀모델 설계 등 다양한 기술적 접근 지원 등에 활용될 수 있습니다(회계일자: 2019. 12. 31. ~ 2021. 7. 14.).'
