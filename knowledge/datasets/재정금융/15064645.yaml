summary_user: 신용보증기금 Trust on 보증(보증부대출금을 투명하게 쓰도록 지원하는 보증)을 이용한 기업을 연도말 업체별 보증잔액 기준으로 한 건씩 담은 전국 범위의 명세 파일로, 순번·업종코드·업종명·보증잔액만 있다. 분석가가 'Trust on 보증 잔액이 어떤 업종에 몰려 있는가'처럼 업종별 보증 규모 분포를 볼 때 쓴다. 전역 조인 키가 없어 기업 단위로 다른 데이터와 붙일 수 없고, 업종코드(최종업종코드)가 통계청 한국표준산업분류(세세분류)를 따르므로 이 분류 기준의 다른 업종 통계와 업종 단위로 이어 쓴다.
limits: 실측 컬럼에 사업자번호 같은 기업 식별 키가 없어 개별 기업을 특정하거나 다른 기업 데이터와 직접 조인할 수 없다. 지역 정보가 없는 전국·비공간 자료라 지역별 분석에는 쓰지 못한다.
