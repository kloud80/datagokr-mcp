description_portal: 이 데이터는 지방자치단체에서 과세한 지방세에 대해 비과세 또는 감면이 적용된 금액과 그 비율을 세목별로 정리한 현황 자료입니다. 시도명, 시군구명, 자치단체 코드, 세목명(교육세, 등록세, 재산세, 주민세, 취득세 등), 과세연도, 비과세 금액, 감면 금액, 부과 금액, 비과세·감면율 항목으로 구성되어 있으며, 안산시 상록구와 단원구로 구분되어 정리되어 있습니다. 세목별로 살펴보면 재산세와 취득세의 비과세감면율이 높은 수치로 확인이 되며, 반면 지방교육세나 등록세는 감면 규모가 상대적으로 작거나 일부 항목은 누락된 상태로 기재되어 있습니다.
