description_portal: 2013년부터 2021년까지 세계잉여금 시계열 자료입니다.수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시되어 있습니다소수점이하는 단수조정으로 상이할 수 있습니다.불용률은 세출예산현액 대비 불용액 비중입니다.2020년까지 결산기준, 2021년은 총세입 총세출 마감결과 기준으로 작성되었습니다.세계잉여금이란 총세입액에서 총세출액을 차감한 결산상 잉여금에서 다음연도 이월액을 차감한 금액입니다.*결산상잉여금(총세입액-총세출액)-다음연도 이월액'국고금 관리법'에 따라 한 회계연도에 속하는 세입세출의 출납에 관한 사무는 다음 연도 2월 10일까지 완결됩니다.
