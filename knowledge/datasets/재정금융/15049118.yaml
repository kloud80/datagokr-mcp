description_portal: 서울시 시민참여예산 제안사업 검토정보는 시민 제안 사업에 대해 행정부서가 공식적으로 검토한 내용을 정리한 데이터입니다. 회계년도와 제안번호는 제안을 식별하는 기본 값이며, 부서코드·자치단체코드·주관부서여부는 어떤 기관이 책임을 갖고 검토하는지 나타냅니다. 사업이름, 사업위치, 사업내용, 제안취지, 사업개요, 소요예산, 사업기간 정보는 검토의 기본 대상이 되는 사업의 핵심 속성입니다. 법률지원적합여부와 법률지원기준은 법·제도상 추진 가능성을 판단한 결과이고, 분과심사해당여부와 분과위심사기준은 시민위원회 분과 심사 대상 여부와 기준을 기록합니다. 사업성평가와 사업성평가2는 효과성·필요성·실현 가능성 등을 종합 서술한 평가 내용이며, 검토결과코드와 진행상태는 채택·보류·미채택 등 최종 행정 판단과 현재 처리 단계를 코드로 표현하는 핵심 결과 항목입니다.
