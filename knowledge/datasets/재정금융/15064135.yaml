summary_user: 한국남동발전이 1972년부터 2020년까지 취득한 자산을 자산단위별로 1건씩 기록한 자산관리대장으로, 취득일자·기초 취득가액·상각누계액·장부가액과 기중 취득·처분·대체·감가상각, 기말 장부가액을 담는다(포털 설명 기준 21,364건, 기계장치·건물·토지·소프트웨어 등). 분석가가 '이 발전사는 어느 시기에 어떤 종류의 설비에 투자를 집중했고, 자산 장부가치는 어떻게 줄어들었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자산단위명 같은 이름 매핑이나 같은 기관(한국남동발전) 단위로만 이어 쓴다.
description_portal: 해당 데이터는 1972년부터 2020년까지 취득된 한국남동발전의 자산관리대장 현황입니다. 총 21,364건의 데이터가 존재하며, 자산단위명, 취득일자, 기초취득가액, 기초상각누계액, 기초장부가액 등의 정보를 포함하고 있습니다. 주요 자산으로는 기계장치, 비품, 건물, 구축물, 공구 및 기구, 토지, 소프트웨어, 차량운반구, 종합검사원가가 있으며, 해당 데이터를 활용하여 한국남동발전의 과거 투자 활동과 자산 구성의 변화를 다각도로 분석하고, 이를 통해 기업의 성장 과정과 전략적 우선순위를 파악할 수 있습니다.
