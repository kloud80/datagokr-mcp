description_portal: 이 데이터는 신용보증기금이 직접 투자한 기업들의 현황을 보여주는 자료로, 투자연도별 투자금액, 투자종류, 업종정보(코드 및 업종분류명), 기업 소재지, 기업규모(중소기업, 중견기업 등) 등의 정보를 포함하고 있다. 신용보증기금은 보증 외에도 성장 가능성이 높은 기업에 대해 직접 투자(지분 투자, 메자닌 등)를 통해 자금 지원을 수행하며, 이를 통해 기업의 자본구조 개선과 지속 가능한 성장을 도모한다. ‘투자금액’은 각 연도별 실제 투자된 금액을 나타내며, ‘투자종류’는 보통주, 전환사채, 신주인수권부사채 등 다양한 투자 방식으로 구분된다. 업종별 분류를 통해 어떤 산업군에 투자가 집중되고 있는지를 파악할 수 있으며, 소재지와 기업규모 구분을 통해 지역별·규모별 투자 편중 여부 및 정책적 지원 성과도 분석할 수 있다. 본 데이터는 정책자금의 투자 방향, 산업별 성장 가능성, 투자성과 등을 평가하는 데 유용한 기초자료다.
