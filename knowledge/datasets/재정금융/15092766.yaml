summary_user: 신용보증기금이 내부 회계에 쓰는 계정과목코드 체계를 계정과목 하나당 한 행으로 담은 코드표 파일(csv, 약 38KB)로, 회계구분·상위계정·계정 레벨과 현금·부가세·충당금·보증수수료 해당 여부 같은 속성 플래그를 함께 담는다. 신용보증기금 재무·회계 자료를 읽는 분석가가 특정 계정과목코드가 어떤 분류에 속하고 상위 계정이 무엇인지 확인할 때 쓴다. 계정과목코드(kodit_account_cd)를 키로 같은 코드를 쓰는 신보 회계·재무 자료와 잇고, 상위계정과목코드로 자기 자신과 이어 계정 계층을 펼친다.
description_portal: 해당 파일 데이터는 신용보증기금의 계정과목코드에 대한 정보를 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
