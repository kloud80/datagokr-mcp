description_portal: 주택도시기금의 주요 재원 가운데 하나로 활용되고 있는 청약저축의 월별 변동 현황을 확인할 수 있도록 구성된 잔여좌수 현황 데이터로, 기준년월별 전월 청약저축잔여좌수를 제공합니다. 이 자료는 청약저축의 변화 추이를 파악하는 데 활용될 수 있으며, 청약저축은 주택청약 신청을 위해 필수적으로 요구되는 기본 요건으로서 청약 참여와 직접적으로 연결되어 있어 사회적 관심도 또한 높습니다.* 청약저축은 주택청약종합저축, 청년주택드림청약통장, 청약저축 세 가지를 모두 합산한 값을 의미하며, 해당 수치는 청약 관련 가입 규모를 종합적으로 나타내는 지표로 활용됩니다(청약예금 및 청약부금은 제외)
