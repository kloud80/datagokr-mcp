summary_user: 공공기관 운영에 관한 법률에 따라 지정된 공공기관을 기관 단위로 한 줄씩 담은 목록 파일로, 기관명·기관유형(시장형·준시장형 공기업, 위탁집행형 준정부기관, 기타공공기관)·주무부처·상위기관·소재지를 전국 범위로 담는다. 정책 분석가나 연구자가 "특정 부처 소관 공기업·준정부기관이 어디에 몇 곳 있는가"처럼 부처별·유형별 공공기관 구성을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 공공기관 경영·재무 데이터와는 기관명 문자열로 맞춰 이어야 하고, 소재지 주소를 행정구역으로 변환하면 지역 단위 자료와 이을 수 있다.
description_portal: 공공기관 운영에 관한 법률에 따라 지정된 공공기관의 분류, 주무부처 및 기관명, 소재지 등을 제공하는 정보입니다.해당 데이터는 시장형 공기업, 준시장형 공기업, 위탁집행형 준정부기관, 기타공공기관의 4개 유형으로 구분되며,각 기관이 소속된 법적 지위와 주무부처를 명확하게 확인할 수 있도록 구성되어 있습니다.이를 통해 공공기관의 기능과 역할, 관할 부처 간의 연계성을 파악할 수 있으며,정책 분석, 행정자료 활용, 공공행정 연구 등 다양한 분야에서 기초자료로 활용이 가능합니다.공공기관 분류, 주무부처, 공공기관명과 같은 핵심 정보를 포함하고 있어 데이터 이용자의 정보 접근성과 행정 자료 검색의 효율성을 높이는 데 기여합니다.
