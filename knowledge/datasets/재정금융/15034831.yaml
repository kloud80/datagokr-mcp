summary_user: KOTRA 무역관이 작성한 해외시장 뉴스를 게시물 한 건 단위로 담으며, 건마다 제목·게시일자·작성자·원문 URL과 국가·지역·무역관, HS코드명·산업분류·품목명(한글/영문)이 붙어 있다. 수출 기업이나 시장 분석가가 '진출하려는 국가에서 우리 품목과 관련된 규제 변화나 통관 이슈, 현지 소비 동향 기사가 최근 어떤 것이 나왔는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 관세청 수출입 실적 같은 다른 데이터와는 국가명이나 HS코드명(hsCdNm)·품목명을 이름 기준으로 맞춰 연결해야 한다.
description_portal: KOTRA가 공공데이터 포털을 통해 제공하는 해외 시장 뉴스 Open api는 전 세계 시장 동향과 트렌드를 자동화된 방식으로 받아볼 수 있는 공공 데이터 입니다. 고객들은 해당 데이터를 통해 시장 조사에 활용할 수 있고, 해외 규제 변화, 통관 이슈 등을 사전 파악하여 해외 리스크에 대응할 수 있습니다. 아울러, 현지 인기 상품, 소비자 반응 등을 통해 현지화 전략 수립에도 용이한 공공데이터로, 해외경제정보 드림에서도 현재 고객들에게 데이터를 제공하고 있습니다. 특히, 해외 진출을 고려하거나 이미 진출한 국내 기업들에게 매우 유용한 데이터 입니다.
