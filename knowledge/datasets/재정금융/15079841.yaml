description_portal: 1. 데이터 주요 내용 및 목적본 자료는 전북특별자치도 남원시의 지방세 납부 현황을 심층적으로 분석한 세무행정 데이터입니다. 등록면허세, 자동차세, 주민세, 재산세 등 다양한 지방세 항목에 대해 납부연도, 납부방식, 전자고지 여부에 따른 납부건수와 금액을 세부적으로 제시하고 있습니다. 이 데이터는 지방세 납부 동향을 파악하고 세수 관리의 효율성을 제고하기 위해 구축되었으며, 납부채널별 활용도와 전자납부 보급 수준을 분석하여 디지털 세무행정 정책 개발 및 시민 편의 증진에 활용될 예정입니다.2. 데이터 항목명시도명, 시군구명, 자치단체코드, 납부연도, 세목명, 납부매체, 납부매체전자고지여부, 납부건수, 납부금액, 납부매체비율3. 기대 효과납부채널별 이용 현황을 면밀히 분석함으로써 전자납부 시스템을 개선하고 시민 친화적인 정책을 수립할 수 있습니다. 더불어 세수 관리의 투명성을 높이고 보다 효과적인 지방세 징수 전략을 마련하는 데 기여할 수 있을 것으로 기대됩니다.
