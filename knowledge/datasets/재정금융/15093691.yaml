description_portal: 본 데이터는 한국방송통신전파진흥원이 2018년부터 2023년까지 추진한정보통신정진기금 및 방송통신발전기금 관련 사업의 연도별 현황 입니다. 데이터에는 각 연도별 기금출처구분(방송통신발전기금/정보통신진흥기금), 사업이력연도, 사업 건수 항목이 포함되어 있습니다. 이를 통해 방송통신 분야의 지원 사업이 연도별로 어떻게 변화되었는지 확인할 수 있습니다. 본 데이터는 공공재정 집행의 신뢰성 제고 및 공공기금의 집행 투명성과 효율적 재원 운용을 위해 제공되며, 기금사업의 정책성과 평가, 향후 기금 운용 방향성 제시 및 사업계획 수립의 기초자료로 활용될 수 있습니다. ※엑셀(csv)파일로 다운로드 가능합니다.
