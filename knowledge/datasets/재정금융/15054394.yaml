description_portal: 해당 자료는 한국에 유입되는 외국인직접투자(외국인투자촉진법 근거)에 관한 자료로, 외국인직접(해외법인, 자연인)투자 중 분기별 도착금액에 대한 자료가 포함되어 있습니다.  - 1962년 2분기 부터 국내 투자로 접수된 외국인(법인, 자연인)의 투자 유입액을 확인할 수 있다.  - 산업부 분기별 외국인 직접투자 통계 보도 내용을 일부 포함하고 있음  - 특히 신고 중심주의의 현재 법령체제에서 도착중심의 분석은 실제 투자 현황을 파악하는데 유용한 자료임  - 도착업체수와 도착금액을 같이 파악할 수 있어 해외 투자 효율을 알 수 있다.
