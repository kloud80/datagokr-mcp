summary_user: 예금보험공사가 부보금융회사 지원자금 부족재원 조달이나 만기 채권 차환을 위해 발행한 예금보험기금특별계정채권(예특채)을 채권번호 단위로 담으며, 채권 종류·기금명·발행일·만기일·이자율·발행금액·상환잔액·원금상환 구분을 포함한다. 금융 분석가나 재정 연구자가 '예특채가 언제 얼마나 발행됐고 아직 상환되지 않은 잔액은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 채권번호·기금명 같은 이름 매핑이나 같은 기관(예금보험공사)의 다른 채권발행 현황 데이터와 맞춰서만 이어 쓴다.
limits: ISIN 같은 표준 종목코드가 확인되지 않아 증권 시장 시세·보유 데이터와 바로 조인되지 않는다. 범위는 전국·비공간 데이터라 지역별 분석에는 쓰지 못한다.
