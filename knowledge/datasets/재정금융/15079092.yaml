description_portal: 디지털 전환 가속화와 비대면 서비스 확산으로 지방세 납부 방식의 다양화와 전자 납부 시스템 활용이 중요한 세정 혁신 과제로 대두되면서, 납세자 편의성 향상과 세무 행정 효율화를 위한 다양한 납부 매체 구축과 활용 확대가 필요합니다. 전자정부 구현과 디지털 세정 시스템 구축을 통한 납세 서비스 품질 향상과 납부 과정의 투명성 제고가 요구되고 있으며, 납부 매체별 이용 현황 분석을 통한 맞춤형 납세 서비스 개발과 납부 환경 개선 방안 모색이 중요해지고 있습니다. 전자고지 서비스 확산과 종이 고지서 절약을 통한 환경친화적 세정 운영과 행정 비용 절감 효과 창출이 필요하며, 납세자의 납부 매체 선택권 보장과 납부 편의성 증진을 위한 다양한 납부 채널 제공이 중요합니다. 또한 지방자치단체 간 납부 방식별 성과 비교 분석과 우수 사례 벤치마킹을 통한 세정 운영 개선이 요구되고 있으며, 납부 현황 데이터 분석을 통한 납세자 행동 패턴 파악과 맞춤형 세정 서비스 개발의 필요성이 증대되고 있어, 충청남도 보령시는 관내 571건의 납부 현황에 대한 납부년도, 세목명, 납부 매체, 전자고지 여부, 납부 건수와 금액, 매체별 비율 등 지방세 정책 수립과 세정 운영 혁신에 필요한 종합적인 지방세 납부 현황 정보를 제공하고 있습니다.
