description_portal: '[데이터 개요 및 목적]본 데이터는 부산광역시 동래구의 2013년부터 2024년까지 지방세 세부 항목별 비과세 및 감면 현황을 집계한 자료입니다. 지방세 감면 정책이 지역 경제 성장에 미치는 영향을 분석하고, 지방 재정 운영의 투명성을 확보하기 위한 기초 통계 자료로 활용할 수 있습니다.[데이터 구성 및 항목 설명]대상 세목: 취득세, 재산세, 자동차세, 등록면허세, 지역자원시설세, 지방교육세, 주민세 등 총 11개 이상의 지방세 항목을 포함하고 있습니다.분류 기준: 지방세법, 지방세특례제한법, 감면조례, 조세특례제한법 등 감면의 근거가 되는 법령별로 건수와 세액이 상세히 분류되어 있습니다.수치 단위: 모든 세액의 기준 단위는 천원입니다.[시계열 변동 및 특이사항]법령 변화: 2013~2016년까지는 조세특례제한법에 따른 감면이 활발했으나, 2018년부터는 해당 법령에 의한 감면 실적이 없습니다.부동산 정책 반영: 취득세와 재산세 등 부동산 관련 세목의 감면 비중이 가장 높으며, 부동산 정책 변화에 따라 연도별 감면 세액의 변동성이 큽니다.데이터 범위 차이:2013년~2016년: 비과세 감면율 정보는 포함되지 않습니다.2017년~2024년: 부과액 정보와 비과세 감면율이 추가되어 분석의 정밀도를 높였습니다.최신 항목 추가:2022년부터 레저세 및 지방소비세 부과액 정보가 포함되었습니다.2024년 데이터에는 "과년도 수입"에 따른 징수 실적이 추가로 입력되어 있습니다.'
