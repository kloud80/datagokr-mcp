description_portal: 중앙행정기관의 일반회계 및 특별회계 세입 내역을 회계별로 구분하여 정리한 결산 정보입니다. 수입과 징수액 등의 세입 실적이 결산 기준으로 집계되어 있으며, 열린재정을 통해 국민에게 제공됩니다. 해당 데이터는 회계 유형별 세입 규모와 구조를 파악할 수 있도록 구성되어 있어, 정부 재정의 수입 측면을 분석하거나 정책 수립에 필요한 기초자료로 활용됩니다. 또한 재정의 투명성 확보와 국민의 이해 증진을 위한 정보 공개 차원에서도 의미가 큽니다. 이 자료는 결산, 세입, 열린재정 외에도 징수현황, 수입통계, 일반회계, 특별회계, 세입분석, 회계정보 등과 같은 다양한 키워드를 통해 폭넓은 분석 자료로 활용할 수 있습니다.
