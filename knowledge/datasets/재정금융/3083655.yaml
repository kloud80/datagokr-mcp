description_portal: '이 데이터는 중소기업을 대상으로 한 P-CBO(Primary Collateralized Bond Obligation, 프라이머리 채권담보부증권) 발행 및 지원 현황을 나타낸 자료입니다. 각 행은 개별 기업의 P-CBO 발행 건을 나타내며, 자산보유자(예: IBK, 교보, 한투 등), 발행 구분(신규 또는 차환), 기업 규모(주로 중소기업), 업종, 기업신용등급 등의 항목으로 구성되어 있습니다. P-CBO는 신용도가 낮은 기업도 회사채를 발행할 수 있도록 자산유동화를 통해 신용을 보완해주는 구조로, 중소기업의 자금조달 활성화를 위한 주요 수단 중 하나입니다. 이 데이터에서 기업등급은 AAA부터 BB-까지 다양한 등급이 포함되어 있으며, 이는 P-CBO가 신용등급이 낮은 기업에게도 기회를 제공하는 수단임을 보여줍니다. 업종별로는 제조업이 압도적인 비중을 차지하고 있으며, 정보통신업, 건설업, 전문·과학·기술 서비스업 등 다양한 산업에 분포하고 있습니다. 특히 신규 발행뿐만 아니라 기존 채권을 차환한 사례도 다수 포함되어 있어, P-CBO가 새로운 자금 조달과 기존 부채 구조조정을 동시에 지원하는 정책도구로 활용되고 있음을 확인할 수 있습니다.'
