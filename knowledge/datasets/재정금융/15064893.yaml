summary_user: 신용보증기금의 Start-up NEST 프로그램에 선정된 혁신 스타트업을 기업 한 곳당 한 행으로 담은 명세로, 선정 연도·선정 당시 기업형태·영위 분야·비즈니스 모델·소재지를 담는다(전국 범위, CSV 약 14KB). 창업지원 정책 분석가나 지자체 담당자가 '연도별로 어떤 분야·지역의 스타트업이 선정되었나'를 파악하는 데 쓴다. 사업자번호 같은 전역 조인 키가 없어서 다른 데이터와는 기업명·지역명 매핑이나 같은 신용보증기금의 다른 보증 이용 기업 명세와 대조하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 신용보증기금의 Start-Up NEST 프로그램을 통해 선정된 혁신 스타트업의 명세를 담고 있으며, 선정 연도, 기업형태, 사업 분야, 비즈니스 모델, 그리고 기업 소재지 등의 정보를 포함하고 있다. Start-Up NEST는 ‘New(새로운 비즈니스 모델)’와 ‘Expandability(확장 가능성)’을 갖춘 유망 스타트업을 발굴하여, 이들의 성장을 지원하기 위한 금융 및 비금융 연계 지원 플랫폼이다. 선정 기업은 성장성과 혁신성을 인정받은 기업으로, 신용보증기금은 보증을 포함한 다양한 금융지원뿐 아니라, 투자유치, 컨설팅, 네트워킹 등 비금융 서비스도 함께 제공한다. 이 데이터는 연도별 선정 기업의 구성 및 분야 분포를 파악하고, 스타트업 생태계에서의 정책 효과와 기업 성장 동향을 분석하는 데 활용될 수 있으며, 창업지원 정책의 성과 평가 및 후속 지원 방향 설정에도 중요한 참고자료가 된다.
