description_portal: 대금기지급현황 데이터는 공공기관에서 체결한 계약에 대해 실제로 지급된 금액과 지급 일정을 투명하게 공개하기 위해 구축된 자료입니다. 이 데이터에는 계약을 체결한 계약관서와 계약부서, 그리고 해당 사업 또는 용역의 내용을 나타내는 계약명이 포함되어 있습니다. 또한 계약금액과 실제로 지급된 지급액을 함께 제공하여 예산 집행의 적정성을 확인할 수 있으며, 지급 성격을 나타내는 지급종류와 지급일을 통해 지급 흐름과 시점을 명확히 파악할 수 있습니다. 아울러 사업을 수행하는 도급업체 정보도 제공되어 계약의 책임 주체를 확인할 수 있습니다. 이 데이터는 공공재정의 투명성 강화, 계약 관리 효율성 제고, 대국민 신뢰 확보를 위해 활용할 수 있는 중요한 행정 정보입니다.
