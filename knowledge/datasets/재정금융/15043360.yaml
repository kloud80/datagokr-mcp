summary_user: 크라우드펀딩 중개업자별로 기준일자 시점의 유가증권 구분(채권·주식 등)과 크라우드펀딩 발행금액을 담은 중개업자 단위 발행 현황 데이터로, 범위는 전국이다. 분석가나 투자자가 '어느 중개업자가 어떤 증권 유형으로 얼마나 발행을 중개했나'처럼 비상장 기업의 초기 자금조달 흐름을 살피는 데 쓴다. 다른 데이터와 묶을 전역 조인 키는 없으며, 중개업자명(fundBrkrNm)이나 유가증권구분코드의 이름·코드 매핑으로만 금융위원회의 다른 금융회사·증권 발행 데이터와 연결한다.
description_portal: '크라우드펀딩중개업자정보는 기준일자와 업체명을 기준으로 크라우드펀딩 중개업자의 기본 현황과 발행 실적을 제공하는 데이터입니다. 주요 제공 항목에는 중개업자명, 일련번호, 기준일자, 유가증권구분코드 및 명칭, 크라우드펀딩 발행금액 등이 포함되며, 중개업자별로 시점별 발행 현황을 확인할 수 있습니다. 이 데이터는 기업의 비상장 자금조달 및 초기 투자 유치 현황을 파악할 수 있는 기초자료로 활용할 수 있습니다.※ 크라우드펀딩이란? 군중 또는 다수를 의미하는 영어단어 크라우드(Crowd)와 자금조달을 뜻하는 펀딩(Funding)을 조합한 용어** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
