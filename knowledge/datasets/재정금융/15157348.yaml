summary_user: 한국예탁결제원이 관리하는 상장·비상장 법인의 기업 기본 현황, 주식 분포(지역별 주주수·주주비율·주식수), 배당·이사·감사 등 기업 정보를 오퍼레이션 단위로 조회하는 API이다. 투자자나 핀테크 개발자가 특정 기업의 주주 구성과 지배구조가 어떤지 확인하는 질문에 쓴다. 발행회사 고객번호(issucoCustno) 등은 다른 데이터에서 받은 코드를 넘겨야 하며, 법인등록번호·사업자번호로 기업 축의 다른 공시·재무 데이터와 잇는 것이 세부 부문의 취지이나 실측 컬럼에서는 전역 조인 키를 찾지 못했다.
description_portal: 본 서비스는 국내 유일의 중앙집중예탁기관인 한국예탁결제원이 관리하는 방대한 기업 관련 데이터를 기반으로, 국내 상장 및 비상장 법인의 핵심 정보를 통합 제공하는 기업 데이터 지원 시스템입니다. 금융위원회 및 관련 법령에 따라 수집된 공신력 있는 원천 데이터를 활용하여 기업의 기본 현황부터 주식 발행, 배당 내역, 주주 구성 등 기업 경영 전반에 걸친 정밀한 정보를 실시간으로 조회할 수 있습니다.사용자는 각 기업의 홈페이지나 개별 공시를 일일이 확인할 필요 없이, 이 서비스를 통해 기업별 표준코드 정보, 이사 및 감사 현황, 사업 목적 등 기업 경영의 투명성을 판단할 수 있는 핵심 지표들을 한곳에서 편리하게 파악할 수 있습니다. 특히 예탁결제원의 내부 시스템과 직접 연동되어 정보의 업데이트가 빠르고 정확하며, 기업 분석을 수행하는 금융 전문가는 물론 핀테크 서비스 개발자들에게 신뢰도 높은 기초 데이터를 제공합니다.단순한 기업 명단 제공을 넘어 기업의 권리 관계와 지배 구조 정보를 투명하게 개방함으로써, 기업과 투자자 간의 정보 격차를 해소하고 건강한 투자 환경을 조성하는 공공 기업 데이터의 핵심 허브 역할을 수행합니다.
