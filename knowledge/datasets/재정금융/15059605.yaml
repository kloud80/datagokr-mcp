summary_user: 주택저당증권(MBS)의 잔액 현황을 전국 단위로 집계한 데이터로, 기준년월(basYm)과 발행연도별로 MBS·MBB 등 증권 유형별 발행금액과 증권 건수를 담는다. 금융 분석가가 특정 발행연도에 나온 MBS가 기준 시점에 얼마나 남아 있고 유형별 비중이 어떤지를 볼 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 같은 기관의 증권 시장 데이터와는 기준년월·발행연도 같은 시점 값으로만 맞춰 본다.
description_portal: '모기지론증권잔액현황정보는 주택저당증권(MBS)의 잔액 현황을 다양한 기준으로 확인할 수 있는 데이터입니다.데이터는 다음 4가지 오퍼레이션으로 구성되어 있습니다.① 전체 증권 잔액 현황 조회 : 기준일자에 따라 MBS 총 잔액, 잔존만기, 평균만기, 평균금리 등의 정보를 제공② 발행연도별 증권 잔액 조회 : 발행연도를 기준으로 연도별 MBS 발행규모와 현재 잔액 정보를 확인하는 기능③ 만기별 증권 잔액 조회 : 잔존만기 구간별로 잔액 분포 현황을 조회하는 기능④ 기초자산유형별 증권 잔액 조회 : 기초자산 유형(주택담보대출, 정책금융대출 등)에 따라 MBS 잔액 현황을 제공하는 기능'
