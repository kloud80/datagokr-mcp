description_portal: 한국주택금융공사에서 제공하는 공공데이터인 「정책모기지_u-보금자리론(디딤돌포함)실적명세」입니다. 이 데이터는 정책성 주택담보대출 상품인 u-보금자리론과 디딤돌대출의 실적 현황을 담고 있으며, 신청일자, 대출금액, 건수, 지역, 소득구간, 금리유형 등 다양한 항목을 포함하고 있습니다. 이를 통해 가계의 주택자금 조달 현황과 정책금융의 효과를 분석할 수 있으며, 연령·소득·지역별 대출 이용 특성을 파악하는 데 유용합니다. 학계와 연구기관에서는 주택금융 수요 추세와 서민 주거 안정 정책 효과를 검증하는 자료로 활용할 수 있으며, 금융기관은 대출상품 설계 및 리스크 관리에 참고할 수 있습니다. 또한 정책 당국은 취약계층 지원정책, 금리정책 조정, 주택시장 안정화 대책 마련에 근거 자료로 활용할 수 있어 공공성과 정책적 가치가 높습니다.해당데이터는 샘플 데이터이므로, 특정 범주의 데이터 제공을 원하시는 경우 공공데이터 제공 담당자에게 문의 바랍니다.
