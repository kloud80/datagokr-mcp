summary_user: 한국예탁결제원 기준으로 주식 종목(ISIN)별 등록·예탁 일자와 취소일, 상장구분·상장일·상장폐지일, 보통주·우선주 같은 종목종류, 비유통 사유를 기준일자 단위로 담은 전국 범위의 종목 원장형 데이터다. 투자자나 분석가가 특정 회사 주식이 예탁결제원에 예탁돼 유통 가능한 상태인지, 언제 상장되고 폐지됐는지 확인하는 데 쓴다. 법인등록번호(crno)와 종목코드(isinCd)가 조인 키라서 같은 키를 쓰는 금융위원회 시세·발행·배당 데이터나 기업 공시·재무 정보와 이어 쓴다.
limits: 조회할 때 기준일자·종목코드·법인등록번호 중 하나 이상을 넣어야 하고, 법인등록번호나 종목코드는 다른 데이터에서 먼저 받아 넘겨야 한다. 시세나 거래량은 담지 않는다.
