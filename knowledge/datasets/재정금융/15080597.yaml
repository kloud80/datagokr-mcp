description_portal: 지방세 체납현황을 체납액 규모별로 제공하고 있으며, 과세연도, 세목명, 체납액구간, 체납건수, 체납금액, 누적체납건수로 항목이 구성됨.경기도 성남시에서 발생한 지방세 체납 규모와 구조를 종합적으로 파악하실 수 있도록 구성된 자료입니다. 연도별·지역별 추이를 통해 체납 문제가 특정 시기나 특정 지역에서 집중되는지 분석하실 수 있으며, 체납액 징수율과 추징 실적을 통해 성남시의 체납 관리 성과를 평가하실 수도 있습니다. 이 데이터는 체납 방지 대책 수립, 추징 전략 개선, 납세자 지원 정책 마련 등 실효성 있는 세정 정책을 설계하시는 데 중요한 근거자료로 활용되실 수 있습니다.
