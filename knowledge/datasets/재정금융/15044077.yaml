description_portal: 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주헬스케어타운 조성사업의 시설 및 용도, 면적 등에 대한 상세내역을 2014년 4월 기준으로 정리한 데이터입니다. 각 데이터는 구분, 구분(상세), 면적(㎡), 건축면적(㎡), 건축연면적(㎡), 결정조서 건폐율(%), 건축면적 용적률(%), 건축연면적, 높이(층수), 건축물용도 1, 건축물용도 2, 건축물용도 3, 객실수 등 다양한 항목으로 구성되어 있습니다. 구분과 구분(상세) 항목은 시설의 유형과 세부 분류를 명확히 구분하는 역할을 하며, 면적, 건축면적, 건축연면적 항목은 각 시설의 물리적 규모를 수치로 상세히 표현합니다. 건폐율과 용적률은 해당 시설의 건축 밀도와 공간 활용 효율성을 나타내며, 높이(층수) 항목은 건축물의 층수를 표기해 구조적 특성을 파악할 수 있도록 되어 있습니다. 건축물용도 1, 2, 3은 복합용도의 건물인 경우 각 용도별 기능을 구분하기 위해 사용되며, 객실수 항목은 숙박시설 등의 객실 수량을 명시하여 숙박 및 의료서비스 제공 규모를 확인할 수 있습니다. 이 데이터는 헬스케어타운의 도시계획, 시설 운영, 건축 설계, 용도 배치 및 향후 시설 확장계획 수립에 중요한 기초자료로 활용됩니다.
