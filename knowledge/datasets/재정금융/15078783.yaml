description_portal: 지방자치제 확산과 지방 분권 강화로 지방세의 역할과 중요성이 증대되면서, 안정적인 지방재정 확보를 위한 효율적인 지방세 징수 체계 구축과 징수율 향상이 중요한 지방 행정 과제로 대두되고 있습니다. 지방세법에 따른 적정한 세무 행정과 체납 관리를 통한 지방세 수입 확보와 재정 건전성 유지가 요구되고 있으며, 세목별 징수 현황 분석을 통한 맞춤형 징수 전략 수립과 세정 개선 방안 모색이 필요합니다. 납세자의 납세 편의성 향상과 자진 납부 문화 확산을 통한 징수율 제고와 체납액 감소가 중요해지고 있으며, 지방세 징수의 투명성 확보와 납세자의 알권리 보장을 위한 상세한 징수 현황 정보 제공이 필요합니다. 또한 지방자치단체 간 징수 성과 비교 분석과 우수 사례 벤치마킹을 통한 세정 운영 효율화가 중요하며, 디지털 세정 시스템 구축과 징수 업무 혁신을 위한 데이터 기반 정책 수립의 필요성이 증대되고 있어, 충청남도 보령시는 관내 108건의 세목별 징수 현황에 대한 과세년도, 세목명, 부과·수납·환급·결손·미수납 금액과 징수율 등 지방세 정책 수립과 세정 운영 개선에 필요한 종합적인 지방세 징수 현황 정보를 제공하고 있습니다.
