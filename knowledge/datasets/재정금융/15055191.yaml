description_portal: 인천광역시가 제공하는 금융기관 예금·대출 및 어음 공공데이터는 관내 금융기관의 주요 금융 활동을 월별로 집계한 종합적인 통계 자료입니다. 이 데이터는 지역의 금융 시장 동향, 자금 유동성, 기업 활동 및 신용 위험 등을 객관적으로 분석하고, 지역 경제 정책 및 금융 시장 안정화 대책 수립의 기초 자료로 활용되는 것을 목적으로 합니다. 이를 통해 월별 금융기관의 예금 구조와 대출 규모를 확인할 수 있으며, 어음교환 건수와 금액, 평균 장당 금액, 부도액 및 부도율을 통해 지역 금융 안정성을 분석할 수 있습니다.
