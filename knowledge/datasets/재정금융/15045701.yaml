description_portal: □ 부실채권 인수 개요한국자산관리공사는 금융회사가 보유한 취약가계·기업의 부실채권을 신속히 인수 정리하여경제주체의 정상적 경제활동 복귀를 지원하고 금융시장의 건전성 제고에 기여하고 있습니다.□ 부실채권이란? 부실채권이란 금융기관의 대출채권 중 부도 등의 사유로 정상적으로 회수되고 있지 않은 대출채권을 이야기합니다. 금융기관에서는 대출채권을 자산건전성 분류기준에 따라 정상·요주의·고정·회수의문·추정손실 등 다섯 가지로 구분하는데, ‘고정’, ‘회수의문’, ‘추정손실’로 분류된 대출채권을 통상 부실채권이라고 합니다.□ 데이터 설명한국자산관리공사 부실채권 인수채권액을 채권유형별(일반채권, 특별채권,PF채권 등)로 구분 기재하여 제공하고 있습니다.
