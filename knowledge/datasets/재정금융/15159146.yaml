description_portal: 경상북도 경주시에서 관리하는 비과세 감면율 현황 데이터이다. 본 자료는 지방세 등 과세 대상에 적용되는 비과세 및 감면 비율 정보를 제공하여 세제 운영 현황을 이해하는 기초자료로 활용된다. 데이터는 세목명, 법구분명, 비과세건수, 비과세액 항목 등 으로 구성되어 감면 적용 여부를 확인할 수 있다. 행정기관은 이를 통해 세수 관리와 정책 수립에 활용할 수 있으며, 연구자에게는 세제 구조 분석 자료로 활용된다. 시민에게는 세제 혜택 대상과 적용 현황을 이해하는 정보를 제공한다. 자료는 파일형식으로 제공되며 주기적으로 갱신되어 최신성을 유지한다. 따라서 본 데이터는 경주시 세제 운영을 파악하고 정책 수립을 지원하는 기초자료이다.
