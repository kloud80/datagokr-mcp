description_portal: 전북특별자치도 무주군에서 실시하는 과세 현황을 매년 갱신하여 파일데이터로 제공하고 있습니다.해당 데이터는 공공데이터 신청에 의하여 파일데이터 형식으로 작성하였으며,시군구명, 과세연도, 비과세금액, 감면금액, 비과세감면율, 교육세, 지방소득세, 재산세, 주민세, 취득세, 자동차세, 등록면허세., 지연지원시설세, 담당부서, 연랓거, 기준일 등으로 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다. (추후 필요한 사항이 발견되면 더 추가 할 예정입니다.)비과세금액 + 감면금액은 과세연도에 부과하지 않은 금액을 말하며과세연도 별비과세금액 + 감면금액 = 교육세 + 지방소득세 + 재산세 + 주민세 + 취득세 + 자동차세 + 등록면허세 + 지역지원시설세 입니다.해당 데이터는 전북특별자치도 무주군 행정복지국 재무과에서 관리하고 있으며 자세한 내용은 063-320-2284(재무과)로 연락주시기 바랍니다.
