description_portal: '주식시세정보는 한국거래소에서 제공하는 상장 주식 및 관련 증권의 실시간 시세 정보를 제공하는 데이터입니다.주식, 수익증권, 신주인수권증권, 신주인수권증서 등 다양한 증권 종목의 시가, 종가, 고가, 저가, 거래량 등 상세 시세 항목을 포함하고 있습니다.이 데이터는 4개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 주식 시세 : 상장 주식의 시세 정보를 종목 코드 및 일자 기준으로 조회합니다.② 수익증권 시세 : 상장된 수익증권의 시세 정보를 제공합니다.③ 신주인수권증권 시세 : 신주인수권증권의 시세를 종목별로 조회할 수 있습니다.④ 신주인수권증서 시세 : 신주인수권증서의 시세 정보를 조회합니다.데이터를 활용하는 예로는 등락률 순위로 정렬, 특정 날짜의 종가 기준 시세 조회, 거래량/거래대금 기준 인기 종목 분석 등이 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
