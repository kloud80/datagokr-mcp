description_portal: '태국 무역보험  인수현황 데이터입니다. 단기성, 중장기성, 기타(수출신용보증) 등 다양한 종목별 인수현황을 표시한 데이터 입니다.<무역보험 제도 개요>ㅇ 수출보험 및 수출신용보증 : 수입자의 계약 파기, 파산, 대금지급지연 또는 거절 등의 신용위험과 수입국에서의 전쟁, 내란 또는 환거래 제한 등의 비상위험으로 수출자 또는 수출금융을 제공한 금융기관이 입게 되는 손실을 보상하는 제도- 단기성 종목 : 결제기간 2년 이내의 수출거래 대상 / 단기수출보험, 중소중견Plus+보험 등- 중장기성 종목 :  결제기간 2년 초과 수출거래 대상 /  중장기수출보험, 해외사업금융보험, 해외투자보험, 해외공사보험, 서비스종합보험, 수출보증보험, 수출기반보험 등- 기타(수출신용보증 등) :  수출신용보증(선적전, 선적후, 매입, 포괄매입) 등'
