description_portal: 중앙행정기관의 재정운영 결과를 분석하기 위한 정보로서, 운영원가, 비교환수익 등 재정 활동의 핵심 지표를 포함하고 있습니다. 각 항목은 정부 회계기준에 따라 체계적으로 정리되어 있으며, 열린재정을 통해 국민에게 공개됩니다. 본 데이터는 정부가 제공하는 서비스의 원가와 수익, 순손익 등의 항목을 통해 재정 효율성을 평가할 수 있도록 구성되었습니다. 이를 통해 정책 수립, 행정 효율성 분석, 재정 지출 평가 등에 활용 가능하며, 국민의 재정 이해도를 높이는 데 기여합니다. 주요 포함 키워드는 재정, 운영, 열린재정 외에도 정부회계, 수익비용분석, 예산성과, 행정지표, 공공비용 등으로 구성되어 다양한 분석 분야에서 참고자료로 활용됩니다.
