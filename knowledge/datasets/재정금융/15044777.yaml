description_portal: 본 데이터는 농산물 도매시장의 현황에 대한 상세 정보를 제공합니다. 이는 경상북도 내에서 농산물의 원활한 유통 및 가격 안정 기능을 담당하는 농산물 도매시장의 기본적인 정보와 시설 규모, 운영 주체 등의 현황을 파악하는 데 목적이 있습니다.주요 내용으로는 도매시장의 공식 명칭과 위치 및 전화 번호 등 기본 연락 정보를 포함합니다. 시설의 규모를 정량적으로 파악할 수 있는 **사업규모(제곱미터)**와 건물 현황 정보가 제공되며, 시장 개설에 투입된 사업비(만원) 정보와 해당 비용의 국_지방 재원 구분도 포함됩니다.또한, 시장의 조성 이력을 알 수 있는 사업기간, 개장일, 준공 일자 정보가 기록되어 있습니다. 시장 운영에 참여하는 입주법인 정보와 시장이 갖추고 있는 주요시설의 종류도 포함됩니다. 이 자료는 농산물 유통 구조 분석, 물류 인프라 투자 계획 수립 및 지역 경제 활성화 정책 연구 등에 귀중한 기초 자료로 활용됩니다.
