summary_user: 고비즈코리아 플랫폼 이용 기업의 거래에 쓰이는 수출대행업체를 업체별로 담은 원천 목록으로, 국가코드·업체명·우편번호·주소·업체 구분을 담으며 파일 크기는 약 2KB로 소규모다. 해외바이어와 거래하려는 중소기업이 "우리 지역 가까이에서 수출 대행을 맡길 업체는 어디인가"를 찾거나, 분석가가 지역별 수출대행 인프라 분포를 볼 때 쓴다. 전역 조인 키는 없어, 다른 고비즈코리아 상품·기업 데이터와는 업체명 매핑으로, 지역 통계와는 우편번호·주소를 행정구역으로 바꿔서 잇는다.
