description_portal: 제주특별자치도 제주시에서 부과되는 지방세 과세액을 기준으로, 비과세액과 감면액이 전체 과세액에서 각각 어느 정도 비중을 차지하는지를 종합적으로 보여주는 자료입니다. 이 자료는 재산세과에서 관리하며, 지방세 부과 과정에서 법령 또는 정책에 따라 세금이 면제되거나 경감된 규모를 한눈에 파악할 수 있도록 구성되어 있습니다. 이를 통해 특정 지역에서 제공되는 각종 세제 혜택의 규모와 추이를 분석할 수 있으며, 나아가 국민이 실제로 누리고 있는 조세 부담 완화 효과를 객관적으로 이해하는 데 유용하게 활용될 수 있습니다. 또한 지방재정 운영의 투명성을 높이고, 향후 세제 정책 수립 및 개선 방향을 검토하는 기초 자료로도 활용될 수 있는 통계 정보입니다.
