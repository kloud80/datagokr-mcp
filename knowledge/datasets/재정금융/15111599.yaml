description_portal: '본 데이터는 경남개발공사의 2022년부터 2024년까지 3개 연도에 걸친 주요 재무 항목 결산 내역을 정리한 자료입니다.해당 데이터는 재무상태표와 손익계산서 항목으로 구성되어 있으며, 각 항목별로 연도별 금액(원 단위)을 비교하여 열람할 수 있도록 제공됩니다.주요 항목은 다음과 같이 구성되어 있습니다:자산: 유동자산, 당좌자산, 재고자산, 비유동자산, 유형자산, 무형자산 등부채: 유동부채, 비유동부채자본: 자본금, 이익잉여금손익계산 항목: 매출액, 매출원가, 매출총이익, 판매비와관리비, 영업이익, 영업외수익/비용, 법인세비용차감전순이익, 당기순이익 등표기 단위는 원(₩)이며, 큰 금액은 엑셀 상에서 자동으로 지수형식(E 표기법)으로 변환될 수 있으므로 다운로드 후 엑셀에서 “셀 서식 → 텍스트”로 설정하시면 정상적인 숫자 확인이 가능합니다.본 데이터는 경남개발공사의 재무 건전성과 경영성과를 투명하게 공개하고, 국민 누구나 공사의 재무 흐름을 이해하고 분석할 수 있도록 제공하는 공공데이터입니다.'
