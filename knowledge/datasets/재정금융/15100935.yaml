summary_user: 2018~2022년 일반회계·특별회계·기금별 총수입·총지출 규모를 연도와 기준별로 억원 단위로 담은 집계 파일이다. 재정 분석가나 국민이 특정 기금이나 특별회계의 연도별 수입·지출 규모가 어떻게 변했는지 확인할 때 쓴다. 기금명(fiscal_account_fund_nm)을 키로 다른 회계·기금별 예산·결산 데이터와 이어 쓴다.
description_portal: '2018년부터 2022년까지 회계, 기금 규모입니다.총수입 및 총지출은 전체 총수입, 총지출에서 기금 등 금액을 나타냈었습니다.총수입-총지출은 총수입에서 총지출을 뺀 단순 수치입니다.일반회계, 특별회계, 기금의 데이터를 포함합니다.•‌일반회계: 국세 등을 세입으로 하여 국가의 일반적 재정사업에 사용•‌특별회계: 목적세, 일반회계 전입금 등을 세입으로 하여 특정 목적사업에 사용•‌기금: 부담금, 기여금 등을 수입으로 하여 특정 목적사업에 사용- 기금은 예산과 달리 여유자금을 운용함에 따라 자산운용위원회의 설치 및 관련 지침 제정을 의무화'
