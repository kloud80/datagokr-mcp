description_portal: '신주인수권증권발행정보는 법인등록번호, 기준일자, 신주인수권 발행인명 등을 기준으로 신주인수권 관련 다양한 정보를 제공합니다.이 데이터는 4가지 오퍼레이션(조회기능)을 통해 다음과 같은 항목을 조회할 수 있습니다:1. 신주인수권증권기본정보: 종목코드, 발행일자, 행사기간, 행사가격, 상장구분 등2. 신주인수권증권기초자산정보: 기초자산 식별정보(ISIN, 종목코드), 액면가, 상장시장 등3. 신주인수권증권연관채권정보: 연관채권의 발행일, 만기일, 금리, 옵션 유형, 보증 여부, 상장일 등4. 신주인수권증권행사가격정보: 행사 적용일자 기준의 행사비율, 가격변동사유 등이 데이터는 신주인수권증권의 발행 및 행사 구조, 연계 채권과 기초자산의 특성을 파악하고, 투자 분석, 시장감시, 기업의 자금조달 수단 평가 등의 용도로 활용될 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
