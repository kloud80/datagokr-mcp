description_portal: '본 데이터파일은 인천광역시 계양구의 지방세 과세를 위해 세원이 되는 과세대상 유형별로 부과된 현황을 정리한 자료입니다. 세목별로 분류된 항목에 따라, 각 세원유형명(예: 주택, 건축물, 차량 등)에 대해 실제 부과된 건수와 부과금액이 함께 제공됩니다. 이를 통해 지방세의 과세 기반이 되는 세원별 부과 규모와 빈도를 파악할 수 있으며, 세원 유형별 세수 기여도를 분석하는 데 유용한 정보를 제공합니다. 본 자료는 세무 행정의 투명성과 합리성을 높이고, 정책 수립 및 예산 편성 시 참고 자료로 활용될 수 있습니다. 데이터와 관련된 보다 자세한 사항은 인천광역시 계양구 세무1과(032-450-5223)로 문의하시면 안내받으실 수 있습니다.'
