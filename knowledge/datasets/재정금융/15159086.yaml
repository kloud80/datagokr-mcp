description_portal: '강원특별자치도 지방세 비과세 및 감면 현황 데이터입니다.포함항목: 과세연도, 자치단체명, 세목명, 법구분명, 비과세건수, 비과세액, 감면건수, 감면세액, 부과금액  - 과세연도: 해당 지방세가 부과된 연도  - 자치단체명: 해당 지방세를 부과한 처분청(기초자치단체)  - 세목명: 「지방세법」에서 규정하는 개별 세목의 명칭(예: 취득세, 재산세 등)  - 법구분명: 비과세 또는 감면의 근거가 되는 법령 구분(예: 「지방세법」, 「지방세특례제한법」, 조례 등)  - 비과세건수: 법령 등에 따라 지방세가 부과되지 않은 건수  - 비과세액: 비과세가 적용되어 부과되지 않은 금액  - 감면건수: 법령 등에 따라 지방세가 일정 또는 전부 경감된 건수  - 감면세액: 감면이 적용되어 경감된 세액  - 부과금액: 비과세·감면 적용 후 실제로 부과된 지방세 금액본 데이터를 통해 각 자치단체가 세목별로 운영 중인 비과세·감면 제도의 규모와 구조를 직관적으로 파악할 수 있으며 특정 세목이나 정책에서 과도한 세제 지원이 이루어지고 있는지 여부를 객관적으로 진단하는 데에 활용될 수 있습니다. 또한, 비과세 및 감면 정책이 지역 경제 활성화, 사회적 지원 등 정책 목적에 부합하게 운영되고 있는지를 평가하는 근거 자료로 기능하며, 조세 형평성 측면의 문제 여부도 함께 검토가 가능합니다.결과적으로 본 데이터는 지방세 감면 제도의 적정성 점검, 불필요 혹은 과도한 혜택의 조정, 공공 연구에의 활용 등 다양한 세정 의사결정에 활용될 수 있으며, 지속가능한 지방재정 운영을 위한 핵심 기초자료로서 중요한 의미를 갖습니다.'
