summary_user: 경기신용보증재단 보증서를 담보로 채권기관(은행 등)이 실행한 대출의 금리를 채권기관명과 보증서 발급연도별로 집계한 표이며, 보증비율 100%·95%·90%·85%별 금리를 따로 담는다. 경기도 소상공인·중소기업이 보증 대출을 받을 때 어느 은행이 몇 % 보증에서 어떤 금리를 적용했는지 비교하거나, 분석가가 보증비율에 따른 금리 차이를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 채권기관 이름 매핑이나 발급연도 기준으로만 이어 쓴다.
description_portal: '이 데이터는 경기신용보증재단을 통해 보증서가 발급된 후 채권기관에서 실행한 대출의 금리 현황을 정리한 자료입니다. 보증서 발급 연도별로 채권기관이 적용한 금리를 확인할 수 있으며, 채권기관별 금리 차이와 보증 형태(전액보증·부분보증)에 따른 금융 지원 조건을 비교·분석할 수 있습니다. 이를 통해 지역 내 금융기관의 보증 연계 대출 조건, 정책금융 지원 효과, 금리 형성 구조를 파악할 수 있습니다.- 채권기관 : 보증서 담보로 대출을 실행한 기관- 보증서발급년도 : 보증기관이 보증서를 발급한 연도- 부분보증: 일정비율까지 보증기관이 채무자의 채무를 보증'
