description_portal: 기록물 단위과제 데이터는 2025년 3월 기준으로  예금보험공사에서 수행하는 업무를 기능별로 분류하고 관리하기 위한 최하위 단위의 업무 정보를 담고 있습니다. 이 데이터는 단위과제의 명칭, 설명, 보존 기간, 보존기간 책정사유, 관련 부서 등 다양한 항목으로 구성되어 있습니다. 예금보험공사의 단위과제 보존기간은 기관에서 보존가치 분석을 통해 영구 기록물관리기관(국가기록원)과 협의하여 결정합니다. 협의과정에서 영구 기록물관리기관(국가기록원)에서 보존기간 조정 요구 시 기관에서는 이를 반영하여야 합니다.(공공기록물 관리에 관한 법률 시행령 제25조 4항)보존기간은 단위과제별로 영구, 준영구, 30년, 10년, 5년, 3년, 1년으로 구분하며, 고유업무의 보존기간 책정기준은 공공기록물 관리에 관한 법률 시행령 별표1 고유업무 보존기간 책정기준표에 따릅니다.
