description_portal: 이 데이터는 신용보증기금의 신규 보증이용 기업에 대한 소멸률 정보를 제공하는 자료로, 통계작성 기준연도에 처음으로 보증을 공급받은 기업을 대상으로 한다. ‘소멸률’은 보증 이용 이후 일정 기간 내 보증이 종료되거나 기업이 더 이상 보증을 이용하지 않게 된 비율을 의미하며, 기업의 보증 지속성, 생존 가능성, 신용위험 등을 판단하는 중요한 지표로 활용된다. 특히 신규 보증이용 기업을 기준으로 분석함으로써, 보증 지원이 초기 기업 성장에 어떤 영향을 미쳤는지, 보증 이용 이후 기업의 경영상태가 어떻게 변화했는지 등을 파악할 수 있다. 업종, 기업규모, 지역 등 다양한 요소별로 소멸률을 비교할 수 있어, 고위험군 조기 식별 및 맞춤형 사후관리 전략 수립에도 활용된다. 이 데이터는 신용보증기금의 정책 효과성과 지원 지속성 확보를 위한 기초자료로서 의미가 크다.
