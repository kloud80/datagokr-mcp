summary_user: 금융감독원 DART에 접수된 주요사항보고서 중 자기주식 처분 결정 공시를 건별로 담는다. 접수번호(rcept_no)마다 회사명·고유번호, 처분예정 보통·기타주식 수와 가격, 처분 예정기간, 처분 목적·방법(시장·시간외·장외 등), 이사회 결의일, 처분 전 보유 자기주식 현황이 들어간다. 투자자나 분석가가 특정 기업이 언제, 얼마나, 어떤 방식으로 자사주를 처분하기로 했는지 확인하는 데 쓰고, DART 고유번호(corp_code)나 회사명으로 같은 기관의 다른 공시·재무 데이터와 잇는다. 다만 실측 컬럼에서 전역 조인 키는 확인되지 않았다.
