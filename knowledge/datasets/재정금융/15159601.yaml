description_portal: '1. 데이터 개요본 데이터는 「부보예금 총괄표」, 「성별 개인예금자 부보예금 현황」, 「연령별 개인예금자 부보예금 현황」으로 구성된 국가승인통계(국가데이터처 승인)입니다.반기별 부보예금 규모와 예금자 특성을 금융업권·인적 속성별로 분석할 수 있도록 작성되었습니다.2. 데이터 단위부보예금 금액 : 백만원예금자 수 : 명3. 부보예금 총괄표부보예금 총괄표는 금융업권별 부보예금 규모와 예금자 분포를 종합적으로 파악하기 위한 통계자료입니다.각 업권에 대해 반기별 기준으로 예금자를 개인·법인 등 주체별로 구분하고, 예금 규모를 일정 금액 구간으로 나누어 해당 구간별 부보예금 금액과 예금자 수를 집계합니다.대상 금융업권은 다음과 같습니다.-은행-보험업권(생명보험, 손해보험)-금융투자업권(증권회사, 자산운용사, 선물회사)-상호저축은행-종합금융회사4. 성별 개인예금자 부보예금 현황본 자료는 개인예금자의 부보예금을 성별 기준으로 세분화하여 분석할 수 있도록 구성되어 있습니다.업권별·부보예금 금액 구간별로 개인예금자를 남성·여성·기타로 구분하여 성별 부보예금 금액과 예금자 수를 산출합니다.5. 연령별 개인예금자 부보예금 현황본 자료는 개인예금자의 연령대별 부보예금 분포를 파악하기 위한 통계자료입니다.업권별·부보예금 금액 구간별로 예금자를 연령대에 따라 세분화하여 부보예금 금액과 예금자 수를 집계합니다.연령 구분은 다음과 같습니다.-14세 이하-15~19세-20대-30대-40대-50대-60대-70세 이상-기타 * 성별 개인예금자 부보예금 현황 및 연령별 개인예금자 부보예금 현황에서 기타로 분류되는 예금(자)은  별단예금, 금융실명제 이전 가입예금 등 성별정보를 확인할 수 없는 예금(자)을 의미합니다.'
