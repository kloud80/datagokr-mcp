description_portal: 재보증현황자료(지역별)은 재보증기관이 원보증기관이 소상공인에 대하여 보증한 금액의 일정비율을 재보증한 현황 정보입니다.재보증현황 자료는 금액 중 재보증 공급, 잔액(단위:억원)으로 구성되어있으며 재보증금액의 지역별 분포를 확인할 수 있습니다.재보증이란, 재보증기관이 원보증기관인 지역신용보증재단이 소상공인에 대하여 보증한 금액의 일정비율을 재보증하고, 원보증기관이 금융기관에 대위변제 후 회수하지 못한 채권에 대하여 재보증비율에 해당하는 금액을 재보증기관이 원보증기관에 지급하는 제도입니다.
