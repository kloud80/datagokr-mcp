description_portal: 천안시의 지방세 비과세·감면 현황 자료는 2013년부터 2024년까지 총 12개 과세연도에 걸쳐 구축된 통계입니다. 이 자료는 보통세(취득세, 등록면허세, 레저세, 담배소비세, 지방소비세, 주민세, 지방소득세, 자동차세), 목적세(지역자원시설세, 지방교육세), 재산세 등 지방세 전 세목을 포괄합니다. 각 세목별로 비과세 건수 및 세액, 감면 건수 및 세액이 구분 집계되며, 법적 근거에 따라 지방세법, 지방세특례제한법, 지자체 감면조례, 조세특례제한법, 기타로 세분화하여 분류됩니다. 비과세감면율은 전체 부과 세액 대비 비과세·감면 세액의 비율로, 지방세 지출 규모와 조세 지원 정책의 효과를 분석하는 핵심 지표입니다. 이를 통해 연도별 세제 지원 추이, 세목별 감면 집중도, 법령별 적용 현황 등 다각도의 재정 분석이 가능하며, 지방재정 건전성 평가 및 조세 정책 수립에 활용됩니다.
