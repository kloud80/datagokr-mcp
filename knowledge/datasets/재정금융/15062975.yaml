description_portal: 경상북도에서 발주한 공공 공사의 하도급(공사를 도급한 자가 그 공사 또는 그 일부를 제삼자에게 다시 도급시키는것) 공사 계약 현황 공공데이터입니다. 본 자료는 관서명, 계약명, 계약금액, 계약일, 계약상대자  등 주요 항목을 포함하고 있으며, 건설산업의 투명성과 계약 실태 분석을 위한 기초자료로 활용됩니다. 국민 누구나 이용할 수 있도록 체계적이고 이해하기 쉬운 형식으로 구성되어 있으며, 하도급 참여 기업 정보를 통해 지역 건설업체의 참여 실태와 계약 구조를 확인할 수 있습니다. 해당 데이터는 경상북도 내 공공공사 집행의 행정적 투명성과 공정성 확보를 목적으로 제공되며, 공공기관, 연구기관, 민간기업 등에서 참고자료로 활용 가능합니다.
