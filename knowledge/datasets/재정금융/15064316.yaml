description_portal: '이 데이터는 한국무역보험공사가 2025년 한 해 동안 집계한 일자별 시장평균환율 정보를 담고 있습니다. 주요 통화(USD, EUR, CNY, JPY 등)에 대해 영업일 기준으로 매일 환율이 기록되어 있으며, 시장평균환율은 해당 일자에 집계된 평균 환율을 의미합니다. 총 970여 건의 데이터로 구성되어 있으며, 항목은 계산일자, 통화코드, 시장평균환율 3개로 구성됩니다. 시장평균환율은 수출입 거래 시 대금의 원화 환산, 환위험 관리 전략 수립 등에 활용될 수 있습니다. (참고) 통화코드는 실제 코드값이 아닌 통화값에 대한 이니셜을 의미하며,  CNY : 중국통화, USD: 미국통화, EUR: 유럽통화, JPY : 일본통화 를 의미합니다.'
