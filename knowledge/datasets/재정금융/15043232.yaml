summary_user: 금융회사 한 곳씩 기준일자별로 기업 개요를 담는 건별 원천 데이터다. 개요 항목은 대표자, 설립일, 종업원 수·평균급여, 주소, 표준산업분류, 상장·폐지일, 감사의견, 중소기업 여부 등이며, 전국 기준 전체 2,348,388건, 확인된 기간은 2017-06-30~2020-04-09이다. 투자자나 분석가가 "이 금융회사의 감사의견과 상장 이력, 종업원 규모는 어떤가"를 확인하거나, 퇴직연금·금융상품을 공급하는 회사의 기본 원장을 만드는 데 쓴다. 법인등록번호(crno)·사업자등록번호·ISIN코드·주소를 키로 금융위원회 기업정보·재무정보, 증권 시세·발행 데이터, 주소 기반 데이터와 잇는다.
description_portal: '금융회사기본정보는 기준일자, 법인등록번호 또는 금융회사명을 기준으로 개별 금융회사의 기업 개요 정보를 제공하는 데이터입니다. 주요 제공 항목에는 금융회사명, 대표자명, 사업자등록번호, 설립일자, 종업원 수, 주소, 전화번호, 표준산업분류, 결산월, 상장일자 및 폐지일자(KRX, 코스닥, 거래소 등), 회계감사 의견, 중소기업 여부 등이 포함됩니다. 해당 데이터는 특정 시점의 정보를 기준으로 금융회사 현황을 구조적으로 파악할 수 있도록 구성되어 있습니다.데이터는 단일 오퍼레이션으로 구성되어 있습니다.① 금융회사기업개요조회 : 기준일자, 법인등록번호, 금융회사명을 통하여 사업자등록번호, 금융회사주소, 금융회사설립일자, 금융회사종업원수 등을 조회하는 금융회사기업개요조회 기능※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
