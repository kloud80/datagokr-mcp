summary_user: 채권 발행 종목별 발행금액·표면이율·만기일, 채권 종류별 신규 발행·상환·증감 금액, 원리금 지급 일정을 담은 API로, 전국 범위 778,232건(2008-01-01~2026-10-01)이 있다. 분석가나 기업 재무 담당자가 특정 회사가 어떤 채권을 언제 얼마나 발행했고 만기가 언제인지 확인하는 질문에 쓴다. 법인등록번호(crno)로 기업 공시·재무 데이터와, 채권 국제식별번호(isinCd)로 종목코드 기반 시세·종목 원장과 이어 쓴다.
description_portal: '채권발행정보는 기준일자, 법인등록번호 또는 채권발행인명을 기준으로 채권 관련 주요 정보를 제공하는 데이터입니다. 제공 항목에는 채권종류별 발행·만기 현황, 발행자별 발행종목 내역, 채권 원리금 지급 정보 등이 포함됩니다. 주요 세부 항목에는 발행금액, 납입금액, 표면이율, 금리구분(고정·변동), 발행통화, 만기일, 채권이자유형, 원금 및 이자 지급금액 등이 있으며, 채권 종류별 신규 발행금액과 상환금액, 증감 현황도 확인할 수 있습니다. 본 데이터는 발행자별 발행 종목 현황 조회, 종류별 발행 만기 현황 조회, 채권 원리금 조회 3가지 오퍼레이션으로 제공되며, 채권시장의 유동성, 기업의 자금조달 구조, 금융시장 안정성 분석, 정책 수립 자료 등으로 활용 할 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
