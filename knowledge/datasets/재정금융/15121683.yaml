summary_user: 신용보증기금 보증원장을 원장 하나당 한 행으로 요약한 건별 파일(csv, 약 25KB)로, 보증기간 월수·보증비율·부분보증 여부·보증잔액·거래방법·원장 발급 당시 부점 지역 등을 전국 범위로 담는다. 분석가가 '신보 보증은 보통 몇 개월 기간에 몇 % 비율로 나가고, 부분보증 비중과 잔액은 지역별로 어떻게 다른가'를 살펴볼 때 쓴다. 이어 쓰는 키는 원장ID(kodit_guarantee_ledger_no) 하나여서 같은 원장ID를 가진 신보의 다른 원장 파일과 붙여 쓴다.
description_portal: 해당 파일은 신용보증기금의 보증원장 요약 데이터로, 보증원장별 보증기간월수, 부분보증여부 등의 항목을 제공합니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
