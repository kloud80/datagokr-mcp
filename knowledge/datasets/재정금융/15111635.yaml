summary_user: 경기도 공공배달앱 '배달특급'에 가입한 가맹점을 한 곳씩 담은 목록으로, 시군명·상호·사업자등록번호·업종·도로명/지번 주소·우편번호·위경도를 담는다. 분석가나 정책 담당자가 '어느 시군에 어떤 업종의 배달특급 가맹점이 몰려 있는가'를 확인하거나 가맹점 분포를 지도에 올리는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 기업·소상공인 데이터와는 사업자등록번호(bizregno)나 시군명·주소를 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: '이 데이터는 경기도에서 운영하는 공공배달앱 ‘배달특급’의 가맹점 현황으로, 코리아경기도주식회사에서 제공하는 데이터입니다. 시군별 가맹점의 명칭, 주소, 사업자등록번호, 업종, 우편번호, 위도·경도 정보 등을 포함하고 있습니다. ‘배달특급’은 중개수수료를 낮추고 지역화폐 결제를 지원함으로써 소비자에게는 다양한 혜택을 제공하고, 소상공인에게는 부담을 줄여 상생을 도모하는 플랫폼입니다. 지역별·업종별 가맹 현황 분석, 정책 수립, 공간 기반 활용 등에 유용하게 활용될 수 있습니다.※ 데이터 원본 출처 : 배달특급 스마트오더 사장님 사이트'
