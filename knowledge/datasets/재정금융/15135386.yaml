description_portal: 이 데이터는 광주광역시에 소재한 다양한 금융기관들의 지점 현황을 수록한 자료로, 시중은행, 지방은행, 특수은행, 외국계 은행 등 총 13개 주요 금융기관의 명칭과 해당 지점 수, 위치 정보 등이 포함되어 있습니다. 이를 통해 지역 내 금융 접근성, 금융 인프라의 지역별 분포, 금융서비스의 균형 여부 등을 파악할 수 있으며, 행정계획 수립, 지역경제 분석, 금융소외지역 발굴 등 다양한 공공 및 민간 목적의 분석 자료로 활용될 수 있습니다. 포함된 주요 기관으로는 한국은행, 우리은행, 국민은행, 신한은행, KEB하나은행, 광주은행, SC제일은행, 한국씨티은행, IBK기업은행, 농협중앙회, 수협중앙회, 한국산업은행, 한국수출입은행 등이 있습니다.
