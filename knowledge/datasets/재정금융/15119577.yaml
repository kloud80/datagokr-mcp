description_portal: 2024년 온렌딩대출 상품에 대한 안내 파일 데이터입니다. 온렌딩대출 신청방법, 지원대상, 대출기간, 상품별 지원조건 내용을 포함하고 있습니다. 특히 대출기간은 시설자금과 운영자금, 리스인 경우로 세분화하여 용도별 대출 기간을 안내하고 있으며, 지원조건의 경우에도 기본 상품과 특별 상품의 경우를 구분하고, 특별 대상의 상품별 안내를 자세하게 담고 있습니다. 특별 상품으로는 신산업 육성, 수출기업 우대, 소부장 첨단전략산업, 창업벤처기업지원, 산업전환지원, 탄소중립지원, 지역경제활성화, 지방은행우대, 일자리창출기업, 동산담보대출활성화 등의 분야가 있습니다.
