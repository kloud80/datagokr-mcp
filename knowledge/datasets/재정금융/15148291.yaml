summary_user: 경기도 내 각 시군의 재정자립도(%)를 집계년도별로 한 행씩 담은 집계 자료로, 행정단위는 시군구다. 경기도 시군 간 자체 수입 비중을 비교하거나 특정 시군의 재정 자율성이 해마다 어떻게 달라졌는지 확인하려는 분석가·정책 담당자가 쓴다. 전역 조인 키는 없어 시군명(sigun_nm)과 집계년도를 이름 매핑으로 맞춰 다른 시군구 단위 지역 지표와 이어 쓴다.
description_portal: 이 데이터는 각 시군별로 연도에 따라 집계된 재정자립도(%) 현황을 수록한 자료입니다. 재정자립도는 지방자치단체의 자체 수입이 전체 재정에서 차지하는 비율을 의미하며, 자치단체의 재정 자율성과 독립성을 나타내는 주요 지표입니다. 데이터는 집계년도, 시군명, 재정자립도(%) 항목으로 구성되어 있으며, 경기도 내 각 시군을 대상으로 수집된 값이 포함되어 있습니다. 본 데이터는 지역 간 재정 역량 비교, 재정 운영 개선 방안 수립, 정책 결정의 기초자료로 활용될 수 있습니다. ※ 1) 재정자립도 산출식재정자립도(%) = {(지방세 세외수입-지방채)/일반회계 세입} * 100
