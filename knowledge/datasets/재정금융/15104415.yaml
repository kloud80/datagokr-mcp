description_portal: '한국무역보험공사의 전세계 국가별 및 업종별 최근 5년간(2017년~2021년) 수출대금 결제 연체기간을 나타낸 데이터입니다. 각 국가별·업종별 평균 연체기간(일 기준)을 집계하여 어떤 지역과 산업에서 결제 지연이 자주 발생하는지를 구체적으로 파악할 수 있게 구성되어 있습니다. 예를 들어, 이용자는 데이터를 활용해 중남미, 중동, 아프리카 등 일부 지역에서 평균 연체기간(23.5~29.7일)이 전체 평균(약 20.8일)보다 훨씬 길다는 특징을 확인할 수 있습니다. 또한 업종별로는 도매업이나 특정 제조업(예: 디스플레이, 자동차 부품 등)의 결제 지연이 상대적으로 심한 경우가 있으며, 기업 규모에 따라 중소기업의 연체율과 연체기간이 대기업보다 현저히 높다는 점도 분석 가능합니다.'
