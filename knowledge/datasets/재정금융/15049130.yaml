description_portal: 서울시 시민참여예산사업 최종선정정보는 시민이 제안한 예산사업 중 최종 선정된 사업들의 기본 정보와 제안 취지, 사업내용, 기대효과, 법적·행정적 근거, 추진 절차, 세부 사업비 산출 내역, 협치 과정과 조정 결과 등을 종합적으로 담은 데이터입니다. 연도와 제안번호, 사업유형을 통해 언제 어떤 유형의 사업이 제안·선정되었는지 알 수 있으며, 사업명, 사업위치와 상세위치는 해당 사업이 어느 지역에서 어떤 공간을 대상으로 추진되는지를 보여줍니다. 소요사업비와 자비, 사업기간은 재정 규모와 추진 일정, 시민과 행정의 역할 분담을 파악하게 해 예산 구조 분석과 집행계획 수립에 활용할 수 있습니다. 제안취지 항목들은 시민이 이 사업을 통해 해결하고자 하는 문제의식과 필요성을 여러 측면에서 서술한 내용이고, 사업내용 항목들은 구체적으로 어떤 활동과 시설·서비스를 추진하려는지를 단계별로 설명합니다. 사업효과 항목들은 사업 시행 시 기대되는 변화와 편익을 정리한 것이며, 사업근거는 관련 법령, 지침, 상위계획 등 행정적 정당성과 필요성을 뒷받침하는 자료입니다. 사업추진절차는 사업이 실제로 실행되기까지의 단계별 일정과 담당 주체, 절차 흐름을 나타내고, 사업비세부산출내역은 예산이 어떤 세부 항목에 얼마만큼 배분되는지 보여 주어 예산의 투명성과 합리성을 검토하는 데 유용합니다. 협치기대효과와 협의공론과정은 시민·행정·민간 등이 함께 논의하고 결정하는 과정에서 예상되는 거버넌스 측면의 성과와 실제 공론화 과정을 기록한 것으로, 참여민주주의와 숙의 과정의 질을 평가하는 자료가 됩니다. 구체화 조정내용과 통폐합여부, 분야, 이관내용은 제안이 검토·조정되는 과정에서 내용 변경이나 통합 여부, 담당 부서나 영역의 조정이 어떻게 이루어졌는지를 보여 주어, 시민참여예산사업이 초기 제안에서 최종사업으로 다듬어지는 전 과정을 추적·분석할 수 있는 중요한 행정 기록입니다.
