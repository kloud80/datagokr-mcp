description_portal: '정의: 정부 주도의 모태펀드를 기반으로 한 ‘농림수산식품투자조합’은 Fund of Funds 방식으로 민간 자금을 포함해 농림·수산·식품 산업 경영체에 투자하도록 설계된 펀드 구조입니다.운용방식: 농림축산식품부·해양수산부의 출자 및 농업정책보험금융원의 관리를 바탕으로, 민간 운용사가 펀드 운용을 수행합니다. 자펀드를 조성해 경영체에 성장 자금을 투입하는 구조입니다데이터 항목 내용: 펀드 조성 연도, 펀드명, 투자 분야(예: 스마트농업, 그린바이오 등), 투자 기간, 운용사, 전화번호, 펀드 규모 등이 포함됩니다.목적: 농림수산식품산업 내 유망 경영체의 성장 촉진과 산업 경쟁력 강화, 투자 유입 구조 활성화를 목표로 합니다.'
