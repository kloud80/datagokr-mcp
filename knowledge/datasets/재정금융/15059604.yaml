summary_user: 금융위원회가 제공하는 주택저당증권(MBS)의 기초자산인 모기지론 정보를 기준월·발행연도·발행회차별로 담은 API로, 상환내역(대출 잔액·조기상환·이자상환), 연체율, 개별 대출 세부정보, 회차별 증권 상환 현황, LTV·DTI 다섯 가지 조회로 구성되며 범위는 전국이다. 채권 투자자나 분석가가 특정 발행연도 MBS의 기초자산 대출 잔액이 얼마나 줄었고 조기상환이 얼마나 일어났는지, 연체율이 어떻게 변했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 발행회차(scrsIssuRndNo)·발행일·발행연도 같은 값을 이름이나 코드로 맞춰 연결해야 한다.
limits: 다른 증권 데이터와 바로 붙일 공통 키(종목코드 등)가 확인되지 않아 결합은 회차·일자 매칭에 의존한다. 실호출 검증은 오퍼레이션 1개만 성공을 확인했으므로 나머지 오퍼레이션의 응답은 따로 확인이 필요하다. 개발계정은 하루 10,000회로 호출이 제한된다.
