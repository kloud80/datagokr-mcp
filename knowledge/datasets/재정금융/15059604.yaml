description_portal: 모기지론기초자산정보 API는 기초자산상환내역조회, 기초자산연체율조회, 기초자산세부정보조회, 기초자산증권상환정보조회, 기초자산LTV및DTI조회 오퍼레이션으로 구성되어있습니다.기초자산상환내역조회 기능은 기준월과 발행연도별로 대출 잔액, 조기상환금액, 이자상환금액 등을 제공하고,기초자산연체율조회 기능은 기초자산의 연체 건수, 금액, 연체율을 조회하며,기초자산세부정보조회 기능은 개별 대출의 금리, 만기, 담보정보 등을 조회할 수 있으며,기초자산증권상환정보조회 기능은 발행된 MBS의 회차별 상환 현황을 제공하며,기초자산LTV및DTI조회 기능은 대출자의 담보비율(LTV), 소득대비 부채비율(DTI)를 제공합니다.
