description_portal: 이 데이터는 신용보증기금의 기업분석 및 평가 업무 시 활용되는 외부 참고자료 현황을 집계한 자료로, 분석평가_참고자료_산업_기술_요소_값_정보, 분석평가_참고자료_특허_수명_지수_값_정보 등의 테이블을 포함하고 있다. 본 데이터는 업종중분류코드, 최대무형자산가치비율, 기술자산비율, 산업기술요소값 등의 칼럼을 제공함으로써, 기업분석 과정에서 참고하는 기술 및 특허 관련 지표들의 기본적인 관리 현황을 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터 내 ‘산업 기술 요소 값 정보’는 업종별 기술자산 및 무형자산 관련 지표의 대략적인 구성을 살펴보는 데 활용될 수 있으며, ‘특허 수명 지수 값 정보’ 등은 관련 분석평가 참고자료의 단편적인 경향성을 파악하는 기초 자료를 제공한다.
