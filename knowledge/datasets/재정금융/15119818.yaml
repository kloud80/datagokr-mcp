description_portal: '본 공공데이터는 대전광역시 중구 관내 마을세무사 현황(연번, 담당 동, 성명, 사무소 소재지, 전화번호, 팩스번호 등)을 담고 있습니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.○ 마을세무사 - 시민의 세금고민을 돕기 위해 무료 상담서비스(재능기부)를 제공하기로 약속한 우리 이웃 세무사○ 상담 내용 및 방법 1. 상담대상: 국세 및 지방세("신고대행" 업무는 상담범위 제외) 2. 내        용생활 속 세금고민 상담(국세 및 지방세 관련)지방세 불복청구(청구액 3백만 원 미만) 관련 상담 등 3. 방        법  - 상담자 지역을 담당하는 마을세무사에 상담 신청  - 전화, 이메일, 팩스, 추가상담이 필요할 경우 방문상담도 가능'
