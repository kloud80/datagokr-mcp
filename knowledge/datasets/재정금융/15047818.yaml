summary_user: 중소기업은행이 고시한 통화별 월말 재정환율을 통화 한 행, 월말 날짜 한 열의 표 형태로 담은 집계 파일이며, 포털 설명상 미국 달러·엔·위안부터 바레인 디나르·루마니아 레우까지 59개 통화를 다룬다. 해외 거래가 있는 사업자나 분석가가 "작년 각 달 말에 특정 통화 1단위가 원화로 얼마였나"를 확인하거나 외화 자산·채무를 월말 기준으로 환산할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 환율·무역 데이터와는 통화 이름이나 통화 코드를 맞춰 붙여야 한다.
limits: 일별 시세가 아닌 월말 값만 있어 월중 변동이나 매매 기준(현찰·송금) 환율은 알 수 없다. 포털 설명은 2024년 1월말~12월말이라고 하지만 실제 파일 컬럼은 2025년 1월말~12월말로 되어 있어 기준 연도를 확인하고 써야 한다. 다른 데이터와 묶을 공통 키가 없어 통화명 매핑이 필요하다.
