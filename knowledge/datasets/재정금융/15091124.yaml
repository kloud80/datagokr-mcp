summary_user: 예금보험공사가 금융회사(피지원 금융회사)별로 상환기금과 특별계정에서 집행한 자금지원액(출자·출연·예금대지급·대출·자산매입 등)과 회수액(출자금 회수·파산배당·자산처분 등)을 기준년월(baseYm)·업권·정리방식과 함께 담은 금융회사 단위 집계 자료이며, 범위는 전국입니다. 분석가나 연구자가 '특정 저축은행이나 부실 금융회사에 공적자금이 얼마나 투입됐고 그중 얼마가 회수됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 금융회사 원장 데이터와는 금융회사명(fncIstNm·spprFnccmpNm) 이름 매칭이나 같은 기관(예금보험공사) 자료의 기준으로만 연결한다.
description_portal: 기준일자, 금융회사명을 통하여 피지원금융회사명, 파산금융회사정리방식명, 상환기금지원출자금액, 상환기금지원출연금액, 상환기금지원예금대지급금액 등을 조회하는 자금지원및회수정보조회 기능
