description_portal: 본 데이터는 전라남도 목포시를 포함한 지방자치단체의 연도별 지방세 과세 현황을 제공하는 자료입니다. 수록 항목은 시도명, 시군구명, 각 자치단체를 식별할 수 있는 고유 코드, 과세가 이루어진 연도, 해당 연도에 발생한 과세 건수 및 과세 금액, 비과세 처리된 건수와 그 금액 등으로 구성되어 있습니다. 본 자료는 지방세 세입 구조 분석, 자치단체의 재정 건전성 평가, 지역 간 세수 불균형 해소 정책 수립 등에 활용될 수 있습니다. 특히, 연도별 과세 추이를 통해 지방세 수입 변동 요인을 파악하고, 비과세 및 감면 제도의 효과성을 분석하는 기초자료로 쓰일 수 있습니다. 자치단체별로 정리된 데이터는 정책 입안자, 연구자, 언론 등 다양한 수요자가 지역 재정정보를 투명하게 확인하고 비교 분석할 수 있도록 개방됩니다.
