summary_user: 파산 절차가 개시된 금융회사를 회사 단위로 한 건씩 담은 원장 데이터로, 회사명·권역·파산등록일자·주소와 연락처·파산재단 관재인·진행상태 등을 기준일자별로 조회하며 범위는 전국이다. 예금자나 채권자, 금융권 분석가가 '예전에 거래하던 저축은행이 파산했는지, 파산재단 관재인과 연락처는 어디인지'를 확인하거나 금융권 퇴출 이력을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 금융회사 원장·영업정지·부보 데이터와는 회사명이나 권역 이름 매핑으로만 이어 쓴다.
description_portal: '파산금융회사 기본정보는 기준일자 및 회사명을 기준으로 파산 절차가 개시된 금융회사의 현황을 조회할 수 있는 데이터입니다. 주요 제공 항목에는 파산금융회사명, 파산등록일자, 파산회사 주소 및 연락처, 권역, 파산재단 관재인 정보, 기타 진행상태 등이 포함됩니다. 단일오퍼레이션으로 구성되어 있으며, 세부내용은 다음과 같습니다.① 파산금융회사기본정보조회 : 기준일자, 파산금융회사명을 통하여 파산금융회사일련번호, 파산금융회사권역명, 파산재단관재인명, 파산등록일자, 파산금융회사주소 등을 조회하는 파산금융회사기본정보조회 기능해당 데이터는 금융시장에서 퇴출된 금융기관에 대한 구조조정 이력, 제도적 처리 상황, 파산 관련 행정정보 등을 종합적으로 파악하는 데 활용할 수 있습니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
