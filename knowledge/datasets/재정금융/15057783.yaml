description_portal: 회계별 및 기금별로 집계된 국가채권의 현황을 제공합니다. 국가채권은 국가가 채권자에 대하여 가지는 금전적 권리를 의미하며, 본 자료는 회계단위 및 기금 단위로 구분된 채권 규모와 세부 항목을 종합적으로 파악할 수 있도록 구성되어 있습니다. 특히 각 회계 또는 기금별로 채권의 현재 잔액, 변동 내역, 채권종류 등 구체적인 정보를 포함하고 있어, 국가의 재정 운영 및 결산 정보를 종합적으로 분석하는 데 유용한 통계자료입니다. 열린재정에서 제공되는 이 데이터는 재정 건전성 분석, 공공부문 자산 평가, 채권 회수 계획 수립 등 다양한 정책 수립과 학술 연구에 활용될 수 있습니다.
