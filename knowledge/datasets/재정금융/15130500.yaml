description_portal: '1. 데이터 개요 : 예금보험공사의 녹색제품 구매실적2. 데이터 단위 : 원(), 비율(%)3. 데이터 내용 : 예금보험공사의 2024년도 녹색제품 구매실적(제품분류별 조달구매액 및 총구매액, 제품분류별 녹색제품 조달구매액 및 총구매액)(참고) 총구매액 : 조달 및 수의계약을 포함한 금액 - 예금보험공사는 「녹색제품 구매촉진에 관한 법률」에 따라 녹색제품 구매를 장려함으로써 자원의 낭비와 환경오염을 방지하고 온실가스 감축에 기여하여 국민경제의 지속가능한 발전에 이바지하고 있으며, 공사 홈페이지(www.kdic.or.kr)에 녹색제품 관련 당해연도 구매이행계획과 전년도 구매실적을 공시하고 있습니다.'
