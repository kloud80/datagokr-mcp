summary_user: 2007년부터 2023년까지 공급된 주택연금의 공급 명세를 건별로 담은 CSV 파일(약 2.9MB)로, 취급연도·지역·가입자 본인의 연령과 성별 항목으로 구성된다. 연금 정책 분석가나 연구자가 "연도별로 어느 지역에서 몇 세 가입자가 주택연금에 많이 가입했는가"처럼 가입자 구성의 변화를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지역 이름이나 취급연도를 직접 맞춰 이어야 한다.
description_portal: 한국주택금융공사_주택연금 공급명세 데이터는 2007년부터 2023년까지 공급된 주택연금 상품에 대한 명세 입니다. 취급연도, 연령, 성별, 지역 등의 항목으로 구성되어 있습니다.. 이 시계열 자료는 연도별 통계 지표를 체계적으로 정리하여 장기적 변화를 명확히 파악할 수 있도록 구성되었습니다. 연도별 일반가구 통계표와 이용가구 통계표를 통해 주요 지표의 흐름을 종합 분석할 수 있습니다. 대출 규모, 보금자리론 가입 현황, 이용 비율, 상환 방식, 평균 금리 등 핵심 데이터를 포괄적으로 제공합니다. 이 자료는 정책 효과 평가와 시장 수요 예측, 리스크 관리 방안 수립 등 다양한 연구 및 실무적 분석 목적에 활용하기 적합합니다. 공공데이터 포털 사용자는 세부 지표 비교를 통해 정교한 정책 대응과 시장 동향 분석을 수행할 수 있습니다. 특히, 주택 금융 정책 수립과 집값 안정화 전략 마련을 위한 기초 자료로서의 가치를 갖습니다.
