summary_user: 신용보증기금이 매출채권보험 등 보험 인수·해지와 관련해 발급한 보험증권의 발급 이력을 증권 발급 건별로 담은 원천 파일(csv, 약 58KB)이다. 발급일자, 발급 사유, 증권 형태, 품의·결재 상태, 발급 부점 등을 담아, 분석가가 "보험증권은 어떤 사유로 언제 어느 부점에서 발급되고 결재는 어떻게 진행됐나"를 살펴보는 데 쓴다. 실측 컬럼에는 사업자등록번호 같은 전역 조인 키가 없다. 기업은 내부 고객 ID(신청기업고객ID)로만 식별되므로 다른 데이터와는 신보 내부 코드나 같은 기관 데이터 안에서만 이어 쓴다.
description_portal: 해당 파일 데이터는 신용보증기금의 보험인수해지보험증권마스터에 대한 정보를 확인하실 수 있는 자료이니 데이터 활용에 참고하여 주시기 바랍니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
