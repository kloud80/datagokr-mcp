summary_user: 보험사고가 난 부보금융회사의 예금자가 예금보험금을 청구할 때 예금보험공사 대신 지급 업무를 맡는 금융회사 지점을 지점 한 곳당 한 행으로 담는다. 대행 기관명, 지점명, 담당 연락처, 주소가 들어 있고 범위는 전국이다. 영업정지·파산한 금융회사에 예금이 있던 예금자가 '가까운 어느 은행 지점에서 보험금을 받을 수 있고 어디로 연락하나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 금융회사 원장 데이터와는 대행 기관명(pymtAgncIstNm)을 이름으로 맞추거나 주소로 지역을 묶어 이어 쓴다.
limits: 전역 조인 키가 없어 금융회사 코드 기반 결합이 불가하고, 기관명 문자열 매칭에 의존해야 한다. 어떤 보험사고(부실 금융회사) 건에 대한 대행인지는 필드로 드러나지 않는다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
