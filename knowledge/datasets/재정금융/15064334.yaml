description_portal: 한국무역보험공사(K-SURE)가 국가별·연도별 주요 거시경제 지표를 수집하여 제공하는 자료입니다. 본 데이터에는 경제성장률, 물가상승률, 경상수지, 경상수지 대비 GDP 비율, 정부부채 비율, 소득수지 등 주요 경제 변수가 코드화되어 기록되어 있습니다. 각 지표는 “경제지표년도”를 기준으로 시계열적으로 정리되어 있으며, “경제지표코드”와 “경제지표단위내용”을 통해 지표의 성격과 단위를 구체적으로 확인할 수 있습니다. 이를 통해 사용자는 특정 연도의 경제 상황을 국가별로 비교하거나 장기 추세를 분석할 수 있습니다. 특히 무역보험 리스크 평가, 수출기업의 해외시장 진출 전략 수립, 정책기관의 거시경제 모니터링 등에 활용할 수 있는 기초 자료로서 가치가 높습니다.
