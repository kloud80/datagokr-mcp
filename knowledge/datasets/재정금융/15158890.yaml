summary_user: 관세청에 신고된 국제무역선 선사의 영문 4자리 선사부호로 해당 선사의 업체명을 한 건씩 조회하는 전국 단위 비공간 코드 조회 API이다. 화물 입출항·적재 정보나 신고 자료에 찍힌 선사부호가 어느 선사인지 확인하려는 물류·무역 분석가나 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 관세청 데이터에 나오는 선사부호를 받아 넘기는 코드 매핑 방식으로만 이어 쓴다.
description_portal: 관세청 보세화물 입출항 하선 하기 및 적재에 관한 고시 제46조(선사부호 신고)에 따라  우리나라에 국제무역선을 운항하는 선사는 최초 입항지 세관장에게 선박회사부호 신고서를 제출하여 영문자 4자리의 선사부호를 신고해야 함. 선사가 부호를 신고하는 때에는 이미 다른 선사가 사용하고 있는 부호와 중복되지 않도록 신고해야 함. 세관장이  선사로부터 선사부호신고를 접수한 때에는 이미 신고된 타선사의 부호와 중복되는지 여부를 심사하여 수리한 즉시 선사부호를 시스템에 등록하여야 함. 선사부호를 이용하여 세관에 신고된 선사의 업체명을 조회 할 수 있는 서비스임
