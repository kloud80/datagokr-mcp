description_portal: 이 데이터는 기술보증기금이 금융기관 및 지방자치단체 등과 체결한 특별출연 협약 현황을 정리한 자료입니다. 특별출연 협약은 금융기관 등이 기금에 자금을 출연하여, 중소기업·스타트업에 대한 보증 지원을 확대하거나 특정 지역·산업 맞춤형 금융 지원을 추진하기 위해 체결됩니다.각 행에는 협약명, 협약 상대처, 체결일, 협약의 진행 여부가 기록되어 있으며, 이를 통해 특정 시점에 어떤 금융기관과 협력관계를 맺고 있는지, 협약이 여전히 유효한지를 확인할 수 있습니다. 협약명에는 “혁신성장 금융지원”, “지역 중소기업 상생 지원”, “스타트업 활성화” 등 다양한 목적이 포함되어 있습니다.이 자료는 기술보증기금이 금융권과 협력하여 조성한 보증 기반을 한눈에 파악할 수 있도록 구성되어 있습니다.
