description_portal: '고액·상습 체납자 명단 공개체납기간 1년이상! 체납국세 2억이상! 고액·상습 체납자의 명단을 공개국세징수법 제114조에 따른 체납발생일로부터 1년이 지난 국세가 2억원 이상인 고액상습체납자의 성명(상호), 주소, 체납액 등을 국세기본법 제85조의5 ⑤항 규정에 따라 국세청 누리집, 관할세무서 게시판에 공개함* 명단공개자의 일부 또는 전부를 사용하여 특정인의 명예를 훼손할 경우에는 형사상 명예훼손죄로 처벌을 받거나 민사상 손해배상 책임을 질 수 있음1. 체납자의 은닉재산을 발견하여 신고할 경우 최대 30억원의 포상금을 지급합니다.* 근거 : 제 84조의 2 및 동법시행령 제 65조의 42. 포상금은 체납자의 은닉재산 신고를 통한 현금징수액에 따라 5~ 20% 지급률을 곱하여 차등지급합니다.체납자 정보(지역별, 체납액 규모별, 체납자 유형별) 명단 공개 실적고액, 상습체납자 명단은 2004년 최초로 공개(2년경과 체납액 10억원 이상)함'
