description_portal: '부산광역시에서 운영하는 통합자금시스템은 시 재정과 회계 업무를 보다 효율적이고 체계적으로 관리하기 위해 구축된 전산 시스템입니다. 이 시스템에서는 회계정보와 관련된 다양한 데이터 항목을 제공하여, 재정 운영과 회계 관리의 투명성을 높이고 있습니다. 제공되는 주요 데이터 항목은 다음과 같습니다.금고코드: 회계 업무를 수행하는 각 금고를 식별하는 고유 코드로, 시에서 관리하는 금고를 구분하고 관련 거래 내역을 추적하는 데 사용됩니다.사용여부: 해당 회계 정보가 현재 사용 중인지, 혹은 비활성 상태인지를 나타내며, 회계 데이터의 관리 효율성을 높이는 데 도움을 줍니다.자치단체코드: 각 회계 데이터가 속한 자치단체를 식별하기 위한 코드로, 시와 구·군 등 다양한 행정 단위별로 회계를 구분하는 기준이 됩니다.최종자료변경일시: 해당 회계 정보가 마지막으로 수정된 시점을 기록한 항목으로, 데이터의 최신성과 변경 이력을 확인할 수 있습니다.회계구분(MST): 회계 데이터를 특정 업무나 성격에 따라 구분하는 항목으로, 재정, 예산, 결산 등 다양한 회계 구분 정보를 제공합니다.회계년도: 해당 회계 정보가 속한 연도를 표시하며, 연도별 재정 계획과 집행 내역을 관리하는 기준이 됩니다.회계명: 회계의 공식 명칭으로, 각 회계 항목의 내용을 직관적으로 이해할 수 있도록 도와줍니다.회계명약어: 회계명을 간단히 줄여 표시한 항목으로, 시스템 내 화면 표시나 보고서 작성 시 편리하게 활용됩니다.회계코드: 회계 업무를 구분하기 위해 부여된 고유 코드로, 데이터 조회 및 분석 시 핵심적인 기준이 됩니다.이처럼 통합자금시스템의 회계정보 데이터는 부산광역시의 재정 및 회계 운영을 효율적으로 관리하고, 보고와 분석을 체계적으로 수행하기 위한 필수 정보를 제공하며, 이를 통해 회계 관리의 정확성과 신뢰성을 높이는 데 큰 역할을 하고 있습니다.'
