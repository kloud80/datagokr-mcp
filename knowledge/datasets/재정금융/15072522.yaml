summary_user: 경기신용보증재단이 보증한 대출을 채무자가 갚지 못해 재단이 대신 갚은 대위변제 금액을 연도(crtr_yr)·시군(sigun_nm)·구분(일반 또는 합계)별로 집계한 자료로, 건별 원천이 아니라 집계표이며 범위는 경기도 시도 단위입니다. 정책 담당자나 분석가가 '경기도 어느 시군에서 보증 대출의 대위변제 금액이 해마다 얼마나 늘었는가'처럼 지역별 신용위험과 보증 정책의 재정 부담을 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군 이름과 연도를 이름 매핑으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기신용보증재단이 중소기업 및 소상공인 등을 대상으로 보증한 대출에 대해 채무자가 상환하지 못했을 때 재단이 대신 상환한 대위변제 내역을 시군별·연도별로 정리한 자료입니다. 각 행은 해당 연도와 시군, 구분(일반 또는 합계), 그리고 발생한 대위변제 금액을 포함하고 있으며, 재단의 재정적 부담과 지역별 신용 상황을 파악할 수 있습니다. 이 데이터는 지역별 신용위험 분석, 보증 정책 평가, 재정 집행 효율성 분석 등에 활용될 수 있으며, 금융정책 및 지방정부의 소상공인 지원 계획 수립에도 도움이 됩니다.
