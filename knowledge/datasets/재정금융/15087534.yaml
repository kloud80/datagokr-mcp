description_portal: 회계연도별로 중앙관서를 기준으로 분류된  중앙관서별 국유지 현황 정보를 제공하는 데이터입니다. 항목에는 회계연도, 중앙관서 구분, 필지수, 면적(제곱킬로미터), 면적 비율(퍼센트), 금액(억원)이 포함됩니다. 산림청, 국토교통부, 환경부, 농림축산식품부, 국방부 등 5개 부처의 현황을 중심으로 구성되어 있습니다. 중앙관서, 국유지, 면적, 국유재산, 필지의 키워드를 중심으로 구성된 본 자료는 중앙관서별 국유재산 분포를 파악하고 국유지 활용 및 관리 등에 활용될 수 있습니다. 또한, 자산관리, 공공재산정보, 행정자료, 통계 등과 연계되어 자산관리의 효율성을 높이는 데 기여하며, 정책 수립 및 연구 기반 자료로도 폭넓게 활용 가능한 유용한 정보입니다. 공공데이터의 투명성을 제고하고 국민의 알권리를 충족하는데 목적이 있는 정보입니다. 정책 결정자, 연구자, 일반 국민에게 유용한 참고 자료입니다.
