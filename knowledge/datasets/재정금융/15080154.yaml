description_portal: '이 데이터는 지방자치단체에서 부과·수납한 세목별 지방세 징수 실적을 정리한 자료입니다. 자치단체명, 과세연도, 세목명(예: 재산세, 취득세, 지방소득세, 지방소비세 등), 부과금액, 수납급액, 환급금액, 결손금액, 미수납금액, 징수율 항목으로 구성되어 있으며, 세정운영의 재정성과를 분석할 수 있도록 연도별 비교가 가능한 구조입니다. 지방소비세는 수납률이 100%에 가까운 반면, 기타 일부 세목은 부과 및 수납 내역이 없는 경우도 있어 세목별 징수실적 편차를 확인할 수 있습니다. 징수율은 부과금액 대비 실질 수납금액의 비율로 계산되어 세수 달성도와 효율성을 나타내는 핵심 지표로 활용됩니다. 본 자료는 다양한 지방재정 운영 및 세무행정 기획에 활용하실 수 있습니다.'
