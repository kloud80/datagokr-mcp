description_portal: 2012년부터 2022년까지 총수입 시계열 자료입니다.2021년까지는 결산서 기준, 2022년 예산은 2차 추경분 포함 예산 기준입니다.총수입, 국세수입, 세외수입, 기금 수입의 내용을 담고 있습니다.국세수입은 소득세, 법인세, 부가가치세, 기타 등의 합을 나타내고 있습니다.총수입 대비 비중에 대한 자료를 포함합니다.*총수입이란 정부가 한해 동안 거둬들이는 재정수입 전체 규모로, '일반회계수입+특별회계수입+기금수입-내부거래-보전거래'로 계산합니다.본 재정통계 BRIEF 데이터는 공공데이터포털(www.data.go.kr)에서 오픈 포맷 데이터로 제공되고 있습니다.<경로> 공공데이터포털 > 데이터찾기 > 데이터목록 > 재정통계BRIEF
