summary_user: 주택저당증권(MBS)의 장외거래 현황을 종목(ISIN)·거래일자 단위로 담으며, 유동화계획별 장외거래금액·거래건수·평균단가·평균·최고·최저 수익률·만기일·발행연도·회차 등을 제공하는 전국 범위 데이터다. 채권 분석가나 기관투자자가 '특정 MBS 종목이 장외시장에서 얼마나 자주, 어떤 수익률로 거래됐는가'처럼 MBS 유동성과 거래 가격 수준을 확인하는 데 쓴다. 종목코드(isinCd)를 조인 키로 삼아 금융위원회의 다른 증권 시세·종목 원장·발행 정보와 이어 쓴다.
description_portal: '모기지론시장거래현황정보는 주택저당증권(MBS)의 장외시장 거래 현황을 확인할 수 있는 데이터입니다.본 데이터는 단일 오퍼레이션으로 구성되어 있으며, 기준일자와 종목번호를 기준으로, 거래일자, 거래유형, 거래금액, 거래가격, 거래금리, 잔존만기월 등 주요 항목을 제공합니다. 오퍼레이션의 자세한 정보는 다음과 같습니다.① 장외거래현황조회 : 유동화계획코드를 통하여 유가증권장외거래일자, 유가증권장외거래금액, 유가증권장외거래건수등을 조회하는 장외거래현황조회 기능이 데이터는 모기지론 장외거래 시장의 유동성과 거래 구조를 파악하는 데 활용할 수 있습니다.'
