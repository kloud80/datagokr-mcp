description_portal: '이 데이터는 예금보험공사에서 비공개로 분류되었던 문서에 대해 재 검토하여 생산부서, 생산일자, 문서번호, 결재권자, 문서제목, 이전 공개구분 내용, 공개(부분공개 포함)로 재분류한 정보를 제공하고 있습니다. 개방 데이터는 비공개로 분류되었던 기록물을 다시 검토하여 공개 여부를 결정하는 과정에서 발생하는 데이터를 말합니다. 이는 특정 기간 경과, 비공개 사유 해소 등으로 인해 공개가 가능해진 기록물들을 공개하기 위해 필요한 절차입니다. 국가기록원에 따르면, 기록물 공개 재분류는 기록물 생산 또는 접수 시 구분하여 관리되던 공개 여부를, 기록물 정리, 이관 시, 또는 비공개 기록물의 경우 주기적으로 검토하여 변경하는 과정입니다. 비공개 기록물 공개 재분류 현황의 주요 항목으로는 생산부서, 생산일자. 결재권자, 문서제목, 기 공개구분, 재분류 결과를 확인할 수 있습니다.생산부서: 해당 문서를 생산한 부서의 이름,생산일자: 문서를 생산한 날짜, 문서번호: 문서가 생산될 때 부여되는 고유 식별번호결재권자: 문서의 최종 결재자,문서제목: 문서의 내용을 파악할 수 있는 정보,기 공개 구분:  생산 당시의 공개구분 값,재분류 결과: 공개하지 않기로 분류된 문서에 대해 일정 기간이 지난 뒤 다시 한 번 공개 여부를 검토하여 공개(부분공개)로 재분류된 값.'
