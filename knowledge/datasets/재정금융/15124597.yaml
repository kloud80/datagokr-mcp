description_portal: ㅇ 매 회계년도별 기초자치단체(시군)에 교부하는 특별조정교부금(조정교부금의 10%) 교부내역으로, 매 회계년도 결산 후 재정공시하는 자료임.  * 2025년도는 교부진행중이므로 교부 완료후 공개 가능충청남도청에서 제공하는 특별조정기부금 데이터는 지방자치단체가 지역 현안 해결과 균형발전을 위하여 교부받은 특별조정교부금을 종합적으로 정리한 공공자료이다. 본 데이터는 지방재정 운용의 투명성과 효율성을 높이기 위한 기초자료로 활용되며, 각 시군별 교부 실적과 배분 비율을 비교하여 정책 우선순위와 재정 수요 차이를 객관적으로 분석하는 데 유용하다. 또한 지역 균형 발전을 위한 투자 방향을 점검하고 주요 사업의 추진 성과와 효과성을 평가하는 근거로 사용되며, 도민 생활과 직결되는 공공서비스 개선에도 기여한다. 아울러 연구기관, 지자체, 정책 담당자 등은 본 데이터를 활용하여 재정 정책 연구, 제도 개선, 학술 분석, 통계 작성 등에 참고할 수 있으며, 주민은 공공재정의 흐름을 직접 확인함으로써 행정 참여와 감시 기능을 강화할 수 있다. 특히 지역사회 발전, 재정 민주성 확대, 정책 신뢰성 제고, 국가 정책과 지방 정책 간 연계성 확보라는 측면에서 중요한 의미를 가진다. 데이터는 매년 정기적으로 갱신되어 최신성을 유지하며 공공데이터 개방 기준에 따라 제공된다.
