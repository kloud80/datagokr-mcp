description_portal: 대구광역시 남구 관내 마을세무사 현황에 대한 데이터로, 마을세무사가 담당하는 동, 세무사명, 사무실 전화번호, 팩스번호, 데이터 기준일자 등의 데이터를 제공합니다.복잡한 세무행정에 대한 전문지식이 부족하거나 과세불복 관련 고액의 비용이 부담되는 시민들에게 마을(읍·면·동) 단위로 지정된 세무사들이 무료 세무상담 및 권리구제 지원을 해주는 우리 마을 담당 세무사각종 세금문제 무료상담(지방세 및 국세 관련 세금 문제와 지방세 불복청구 관련 사항을 무료로 상담)가까운 마을세무사에게 상담신청(구청, 대구시청, 행정안전부 및 한국세무사회 홈페이지에 마을세무사 검색)상담방법(우선 전화, 팩스, 이메일을 통한 상담이 가능하고, 추가 상담이 필요하면 직접 대면하여 상담도 가능합니다.)
