summary_user: 한국주택금융공사가 대출(유동화) 건별로 받은 담보 물건 정보를 담은 파일로, 담보물건지·주택유형·토지/건물 면적·LTV율·등기순위·선순위 임대차액·투기지역 여부 등을 한 행씩 기록한다(전국 범위, 약 12KB CSV). 분석가가 "규제지역(투기과열지구·조정대상지역) 담보의 LTV율이나 선순위 임대차 규모가 다른 지역과 어떻게 다른가" 같은 주택담보 위험 구조를 살피는 데 쓴다. 대출기관코드(hf_lender_cd)가 실측 조인 키라서 같은 코드를 가진 공사의 다른 대출·유동화 데이터와 이어 쓰고, 담보물건지·주택유형 등 나머지 코드는 코드표가 제공되지 않는다.
description_portal: 한국주택금융공사에서 제공하는 공공데이터인 한국주택금융공사_담보정보입니다。한국주택금융공사 담보정보에 관한 데이터이며(대출기관코드, 수신일자, 자료작성기준일자 등) 관련 칼럼과 값이 포함되어있습니다.。제공되는 이 데이터는 주거 안정성 분석, 지역별 주택금융 수요 조사 및 정책 주택사업 대상지 선정 등으로 활용될 수 있습니다。정책 입안 시 근거 자료로 활용되어 공공 금융 서비스의 투명성과 효율성을 높이는 데 기여합니다。세부 통계 지표 분석을 통해 특정 고객군의 연체 위험도 평가 및 선제적 대응 전략을 수립할 수 있습니다。또한 과거 데이터 추이를 활용한 시계열 분석을 통해 미래 시장 수요 예측 및 리스크 관리에 활용할 수 있습니다。연관 데이터와 결합하여 빅데이터 분석 플랫폼 기반의 금융 시장 동향 모니터링에 활용 가능합니다。이 데이터는 공사의 내부 데이터와 연계하여 고객 특성별 세부 분석 및 맞춤형 금융 상품 개발에 유용합니다。해당 데이터에 대한 문의사항은 한국주택금융공사 공공데이터 제공 실무담당자에게 연락 혹은 공공데이터포털을 통해 문의를 접수 해 주시기 바랍니다。
