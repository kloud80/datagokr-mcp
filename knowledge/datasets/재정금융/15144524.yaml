description_portal: 2025년 미국 관세율표 자료입니다. 출처는 미국국제무역위원회(The United States International Trade Commission)-https://hts.usitc.gov 입니다.우리청에서 제공하는 "해외 관세율표"는 해외 국가 등에서 공포한 내용을 수집하여 제공되는 것으로, ​"해외 관세율표"에서 제공하는 정보는 법적 효력이 없으므로, 참고로만 활용하시기 바랍니다.또한 "해외 관세율표"의 번역물은 공식적 효력이 있는 번역물이 아니므로 참고로만 사용하시기 바하며, "해외 관세율표"의 법적 효력은 원문본 출처 정부, 기관 및 관보 등에 있습니다.원문본과 영문본·기타 자료 간에 의미상 차이가 있는 경우에는 주로 원문본 정보가 우선권을 가지며, 해당 국가에서 명시하는 규정이 있는 경우 그 규정에 따릅니다."해외 관세율표"를 위조·변조하여 제공하거나 근거자료로 제출하는 행위는 관련 법령에 따라 형사처벌을 받을 수 있으니 유의하시기 바랍니다.
