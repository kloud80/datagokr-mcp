description_portal: ‘서민금융진흥원 청년도약계좌 취급은행 현황’ 공공데이터는 청년의 자산 형성을 지원하기 위해 도입된 정책형 금융상품인 청년도약계좌를 운영 중인 은행 목록을 제공하는 자료입니다. 청년도약계좌는 만기 5년(60개월) 동안 매월 최대 70만 원까지 자유롭게 납입할 수 있으며, 정부가 매월 최대 6%의 기여금을 지원하고 이자소득에 대한 비과세 혜택까지 제공하는 대표적인 청년 자산지원 상품입니다. 이 데이터는 해당 상품을 실제로 취급하고 있는 은행의 주요 정보를 포함하고 있어, 청년들이 본인의 거주지나 이용 편의에 맞는 금융기관을 쉽게 찾고 청년도약계좌에 가입할 수 있도록 돕습니다. 이 데이터는 청년층의 경제적 자립 기반 마련을 위한 정책 효과성 분석 자료로 유용하게 쓰입니다.
