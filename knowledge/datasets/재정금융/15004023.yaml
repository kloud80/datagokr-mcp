description_portal: 이 데이터는 신용보증기금이 경영혁신형 중소기업을 대상으로 지원하는 인증 현황을 연도별 및 지역별로 구분하여 나타낸 자료로, 각 지역에서 인증받은 중소기업의 업체 수를 확인할 수 있다. 경영혁신형 중소기업은 기술혁신, 경영 개선, 사업모델 혁신 등을 통해 경쟁력을 확보한 기업으로, 신용보증기금은 이들 기업에 대해 우대 보증, 컨설팅, 정책 연계 지원 등을 제공하고 있다. 본 데이터의 ‘인증 업체수’는 특정 연도와 지역에서 인증을 획득한 기업의 수를 의미하며, 이를 통해 지역별 혁신기업 분포와 창업·성장 생태계의 특성을 파악할 수 있다. 또한, 해당 데이터는 지역 단위의 산업지원 정책 수립, 균형 있는 혁신기업 육성 전략 마련, 중소기업 성장성과 혁신역량 분석 등 다양한 정책적 활용 가능성을 갖는다.
