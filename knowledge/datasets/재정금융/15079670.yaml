description_portal: 해당 데이터는, 세목별로 제공되는 지방세 과세건수, 과세금액, 비과세 및 감면 건수, 비과세 및 감면 금액 등의 자료로서, 국민에게 제공되는 조세 혜택의 규모를 파악하는 데 중요한 자료가 됩니다. 본 데이터를 통해 납세자의 경제적 부담을 줄이기 위한 세제지원이 어느 정도 이뤄지고 있는지를 객관적으로 확인할 수 있는 수단이 됩니다. 또한 특정 세목에서 비과세 및 감면이 집중적으로 발생하는 경우, 해당 세목이 국민 생활에 얼마나 밀접하게 관련되어 있는지를 분석하는 데에도 활용할 수 있습니다. 따라서 지방세의 과세 및 비과세 현황을 체계적으로 분석함으로써 조세 정책의 효과를 평가하고 향후 정책 개선 방향을 설정하는 데 중요한 기초자료로 사용할 수 있습니다.
