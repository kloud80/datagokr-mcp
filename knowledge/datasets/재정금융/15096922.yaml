summary_user: 제주특별자치도 전체의 수출액·수입액·무역수지를 천달러 단위로 기준 연월(포털 설명상 2000~2021년 연도별)마다 집계한 시도 단위 통계로, 건별 원천이 아닌 집계 자료다. 지역 분석가나 정책 담당자가 '제주의 수출입 규모와 무역수지가 해마다 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준 연월이나 지역명(제주)으로 직접 맞춰 붙여야 한다.
description_portal: 이 데이터셋은 2000년부터 2021년까지 기간 동안 제주특별자치도 지역의 수출액, 수입액 및 무역수지 정보를 연도별로 집계한 공공 통계자료이다. 제공기관은 제주연구원이며, CSV 형식으로 배포되어 누구나 자유롭게 열람 및 분석이 가능하다. 이 자료를 통해 시간 경과에 따른 제주도의 수출입 규모 변화, 무역수지 추이, 지역 경제의 통상 의존도 및 구조 변화를 파악할 수 있다. 또한 산업정책 수립, 지역 경제 활성화 전략, 통상 및 무역 기반 정책 평가, 관광·농수산물 수출 영향 분석 등 다양한 행정, 연구, 정책 기획 분야에서 신뢰성 있는 기초 자료로 활용할 수 있다.
