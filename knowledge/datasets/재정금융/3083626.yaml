description_portal: '이 데이터는 기술보증기금이 문화산업 분야 기업을 대상으로 제공한 보증 실적을 정리한 자료로, 보증지원의 대상과 특징을 구체적으로 파악할 수 있도록 구성되어 있습니다. 문화콘텐츠 업종별로 분류되며, 창업 여부와 법인 등록 여부에 따라 기업의 특성이 구분되어 있어 문화산업 내 다양한 수요 계층을 반영합니다. 특히 보증금액은 ‘1억원 이하’부터 ‘10억원 초과’까지 5개 구간으로 세분화되어 있어 자금 수요의 크기를 파악하는 데 유용하며, 문화산업 기업에 대한 정책 설계나 지원 대상을 선정하는 데 활용될 수 있습니다. 데이터 주요 항목은 다음과 같습니다.‘장르’: 방송, 만화, 공연, 영화, 게임 등 보증을 받은 콘텐츠의 업종을 나타냅니다.‘보증일자’: 보증이 실행된 날짜를 의미하며, 시기별 추이를 확인할 수 있습니다.‘보증금액’: 보증이 제공된 금액의 범위를 구간별로 제시한 값입니다.‘창업기업 여부’: 해당 기업이 창업기업인지 여부를 표시합니다.‘등록법인여부’: 법인 등록이 완료된 기업인지를 ‘여/부’로 구분합니다.'
