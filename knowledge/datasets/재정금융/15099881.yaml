summary_user: 전국 지방국세청과 산하 세무서별로 세무서명, 도로명 주소, 우편번호, 전화·팩스번호, 세무서코드, 계좌번호, 관할구역을 한 행씩 담은 기본사항 파일(csv, 약 21KB)이다. 사업자나 국민이 '우리 동네 주소는 어느 세무서 관할이고 연락처·납부 계좌는 무엇인가'를 확인하거나, 분석가가 세무서 단위 자료를 지역에 대응시킬 때 쓴다. 세무서코드(tax_office_cd)를 키로 세무서 단위 국세 자료와 잇고, 관할구역·주소를 시도·시군구로 맞추면 행안부 통계연보 지역별 지방세 같은 지역 지표와 연결한다.
description_portal: 국세청과 그 소속기관 직제 시행규칙에 제공되는 세무서별 관할구역 정보입니다. 전국에 있는 지방국세청 및 지방국세청 산하 세무서의 기본사항(지방국세청 및 세무서명, 도로명 주소, 우편번호, 전화번호, 팩스번호, 세무서코드, 계좌번호, 관할구역)을 안내해 드립니다. 국세청 누리집을 통해서도 전국 세무관서 기본사항 파일 내려받기가 가능하며 국세청 소개> 전국 세무관서 메뉴에서 지역별, 읍·면·동 및 도로명 주소별 검색이 가능합니다. 지도로 찾기 서비스를 이용하면 선택 지역 내 세무서 등 소재 현황을 확인할 수 있으며 해당 세무서 누리집으로 바로 이동할 수 있습니다.
