description_portal: '이 데이터는 2016년부터 2022년까지 한국무역보험공사가 사회적 기업으로 분류된 업체로부터 구매한 실적을 연도별로 정리한 자료입니다. 한국무역보험공사는 사회적 가치 실현과 ESG 경영의 일환으로, 기관의 사회적 기업 제품 구매 현황을 투명하게 공개하고 있습니다. 제공되는 항목은 총 구매액, 사회적 기업 구매 실적, 전체 구매액 대비 사회적 기업 제품 구매 비율로 구성되어 있으며, 이를 통해 공사의 사회적 기업 지원 노력을 수치적으로 확인할 수 있습니다.* 사회적기업 : 취약계층에게 사회서비스 또는 일자리를 제공하거나 지역사회에 공헌함으로써 지역주민의 삶의 질을 높이는 등의 사회적 목적을 추구하면서 재화 및 서비스의 생산·판매 등 영업활동을 하는 기업을 의미 (사회적기업육성법 제2조)'
