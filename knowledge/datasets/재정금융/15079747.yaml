description_portal: 인천광역시가 제공하는 지방세 세원유형별 과세 현황 공공데이터는 시에서 **지방세(세금)**를 부과한 실적을 세목별로 구분하고, 해당 세금의 세원(稅源) 유형별로 집계한 통계 자료입니다. 이 데이터는 지역의 재정 운영 상황, 세수(稅收) 구조, 세원별 과세 규모 및 추이 등을 파악하고, 지방세 정책, 재정 계획, 조세 정의 등의 기초 자료로 활용됩니다. 이 자료는 인천광역시의 재정 건전성 분석 및 지방세 정책의 효율성을 측정하는 데 필수적인 기초 데이터입니다. 해당 데이터는 공공데이터포털에서 확인할 수 있으며, CSV파일로 제공되고 있습니다.
