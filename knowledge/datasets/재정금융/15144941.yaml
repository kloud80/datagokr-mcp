description_portal: 이 데이터는 신용보증기금이 보험 인수 심사 과정에서 활용하는 기업별 평가등급 정보를 제공하는 자료입니다. ‘간편보험 평가등급 내역’은 간이심사를 기반으로 보험을 신청한 기업에 대해 내부 평가 기준에 따라 부여된 등급을 포함하고 있으며, 기업의 기본정보, 등급산정일, 등급구간 등 주요 항목이 포함되어 있습니다. 이는 서류 간소화를 통해 보다 빠르게 리스크 수준을 판단하고, 간편 인수보험 제도 운영의 핵심 기반이 됩니다. ‘인수공시등급 선정 내역’은 정식 보험 인수 심사 시 활용되는 공시 등급 정보로, 기업의 신용도와 재무건전성, 거래내역, 보험사고 이력 등을 종합적으로 평가해 등급을 산출합니다. 해당 등급은 보험 인수 여부 결정, 보험료율 차등화, 인수 한도 설정 등의 기준으로 활용되며, 기업별 리스크 분류 및 인수정책 정교화에 기여합니다. 이 데이터는 보험 인수의 객관성과 신속성을 확보함과 동시에, 신용보증기금이 수행하는 정책보험 리스크 관리의 핵심 요소로 기능합니다.
