description_portal: 경상남도 사천시의 2018년부터 2020년까지 주민 1인당 및 세대당 지방세 부담금액에 대한 공공 데이터를 제공합니다.이 자료는 해당 기간 동안 사천시민이 실제 부담한 지방세 (결산 징수 실적) 총액을 기준으로, 주민등록 인구수와 세대수를 활용하여 계산됩니다. 데이터에는 각 연도의 총 지방세액, 인구수, 세대수, 그리고 계산된 1인당 부담액과 세대당 부담액이 포함되어 사천시의 재정 환경 변화와 시민의 세금 부담 수준을 심층적으로 파악하는 데 유용한 통계 자료로 활용됩니다.제공데이터는 시도명, 시군구명, 자치단체코드, 과세년도, 주민1인당부담금액, 세대당부담금액, 지방세금액, 인구수, 세대수입니다.
