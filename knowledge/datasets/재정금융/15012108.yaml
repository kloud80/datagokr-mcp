description_portal: 본 데이터는 주택도시보증공사에서 제공하는 보증상품별 보증료 현황을 정리한 것으로, 기업보증과 개인보증으로 구분하여 각 상품별 보증료 규모와 그 구성비중을 확인할 수 있도록 구성되어 있습니다.기업보증에는 주택사업 관련 분양보증, 주택사업금융보증, 하자보수보증, 조합주택시공보증 등이 있으며, 개인보증에는 전세보증금반환보증, 주택구입자급보증, 정비사업자금 대출보증 등 다양한 상품이 포함됩니다.해당 자료 내 보증상품별 설명(보증금액, 보증기간, 상품개요, 이용절차 및 제출서류, 약관 등)에 대한 상세한 설명은 주택도시보증공사 홈페이지에서도 확인 가능하니 참고하시기 바랍니다.(참고) https://www.khug.or.kr/hug/web/cg/ov/cgov000001.jsp
