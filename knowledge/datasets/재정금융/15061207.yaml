description_portal: 한국수력원자력(주)이 공개하는 세금납부 현황 데이터입니다. 한국수력원자력(주)은 공공기관의 재정 기여와 세무관리 현황을 파악할 수 있도록 세금납부 현황을 투명하게 공개하고 있습니다. 해당 데이터는 한국수력원자력(주)이 납부한 국세와 지방세 현황에 대한 공개 데이터입니다. 국세는 법인세 ,부가가치세, 종합부동산세로 나뉘어지며, 지방세는 지역자원시설세, 지방소득세, 주민세, 재산세, 취득세, 기타(자동차세 등)으로 나뉘어져 있습니다. 데이터는 구분, 세목, 납부액(억원), 담당부서, 담당자, 연락처 등의 항목으로 구성되어 있습니다. 등록일 현재 전전년도와 전년도 데이터가 함께 제공됩니다.
