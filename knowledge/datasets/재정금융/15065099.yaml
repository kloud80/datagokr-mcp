description_portal: 본 데이터는 관내 외국인 직접 투자를 연도별로 집계한 통계 정보이다. 연도별 투자 금액, 투자 건수, 주요 투자 업종, 투자국 등의 세부 내용을 포함한다. 연도별 외국인 직접 투자 현황은 지역 경제의 국제 경쟁력 및 투자 환경 변화를 나타내는 중요한 지표이다. 해당 자료는 투자 유치 정책 평가, 중장기 투자 유치 전략 수립, 경제 정책 효과 분석에 활용된다. 투자 증감 추이 분석을 통해 투자 환경 개선 요인 및 저해 요인을 파악하고 정책 개선 방안을 마련할 수 있다. 또한 경기 변동 및 글로벌 경제 상황이 투자에 미치는 영향을 분석하여 대응 전략을 수립한다. 투자 유치 성과 평가 및 목표 설정에 필요한 기초 자료를 제공하며, 지역 경제 활성화 및 일자리 창출 효과를 검증한다.
