description_portal: 세출 세부사업 예산편성현황(추경포함)은 중앙행정기관의 세부사업별 예산 편성 내역을 집계·제공하는 재정 통계 자료로, 본예산뿐 아니라 추가경정예산(추경) 결과가 반영된 최신 데이터를 포함하고 있습니다.(부처별, 분야·부문·프로그램·세부사업별 예산 현황과 본예산 대비 추경 증감 현황을 한눈에 파악할 수 있도록 구성되어 있습니다.)추가경정예산은 이미 편성·의결된 본예산으로 충당할 수 없는 신규 재정수요, 경기 대응, 재난·재해 복구 등 긴급한 재정 소요를 반영하기 위해 편성됩니다.[데이터 주요 항목 및 특징]1. 데이터 범위   * 중앙행정기관의 세부사업 단위 예산 현황   * 부처명, 회계명, 분야·부문·프로그램·단위사업·세부사업명, 본예산액 등 포함2. 예산구분   * 본예산   * 추가경정예산(제1회, 제2회 등 필요 시 다회 편성 가능)3. 활용 예시   * 부처별·사업별 추경 규모 비교   * 분야별 재정투자 우선순위 분석   * 특정 정책·사업의 재정 강화 여부 파악   * 재정 집행계획 수립 및 정책 효과 분석 자료로 활용4. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 파일형식 다운로드 가능   * Open API 연계 가능 (연도, 부처, 분야, 세부사업 등 조건별 상세 조회 지원)본 자료는 정부 재정운용의 투명성을 높이고 국민의 알권리 충족은 물론, 연구기관·언론·일반 국민이 정책 분석, 재정 건전성 점검, 재정투자 우선순위 설정 등에 활용할 수 있는 중요한 재정정보입니다.
