description_portal: 부산광역시 해운대구에서 부과하는 지방세 과세액 중에서 비과세액과 감면액이 차지하는 비율을 나타내는 자료입니다. 각 지방세 세목별(지방교육세, 등록세, 재산세, 주민세, 취득세, 자동차세, 등록면허세, 지역자원시설세, 등록면허세 등) 비과세 감면세액 및 건수를 지방세법, 지방세특례제한법, 감면조례, 조세특례제한법, 기타 등으로 분류하여 제공하였습니다.지방세 비과세나 감면은 주로 특정 정책 목표를 달성하거나 사회적 약자를 돕는 방법으로 활용되고 있습니다. 지방세 총 과세액에 대한 비과세, 감면의 비중 현황을 제공함으로써 해운대구민이 받고 있는 지방세 감면 및 비과세 혜택의 규모를 파악하는 데에도 도움이 될 수 있습니다.지방세 비과세 및 감면에 대한 구체적인 정보가 필요하신 경우 해운대구청내 세무 부서(재산취득세과, 지방소득세과, 세무관리과)로 문의하시기 바랍니다.
