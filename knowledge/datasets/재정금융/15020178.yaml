description_portal: '이 데이터는 기술보증기금의 자금운용정보를 나타냅니다. 자금운용 방식에 따른 평균 잔액, 비중, 수익률 등의 정보를 제공합니다.데이터 구성기준년월: 해당 자금운용이 이루어진 연월로, 자금운용 실적이 어느 시점에 해당하는지 보여줍니다. 예를 들어, "2024-06"은 2024년 6월에 대한 자금운용 실적을 나타냅니다.구분: 자금운용 방식의 종류를 나타냅니다. 두 가지 주요 방식이 포함되어 있습니다:확정금리형: 일정한 금리가 적용되는 자금운용 방식실적배당형: 운용 성과에 따라 수익이 배당되는 방식평균잔액(원): 각 자금운용 방식에 따라 자금운용의 평균 잔액을 나타냅니다. 이는 해당 자금운용 방식에 배정된 자금의 평균 규모를 의미하며, 원 단위로 제공됩니다.비중: 전체 자금운용에서 해당 운용 방식이 차지하는 비율을 퍼센트로 나타냅니다. 예를 들어, 확정금리형 자금이 전체 자금에서 차지하는 비중이 36.34%라면, 이 비율만큼 확정금리형 방식으로 운용된 자금이 있다는 것을 의미합니다.수익률: 자금운용 방식별로 발생한 수익률을 퍼센트로 제공합니다. 이 값은 해당 운용 방식이 얼마나 효율적으로 자금을 운용했는지를 보여주는 중요한 지표입니다.이 데이터는 기술보증기금의 자금 운용 현황을 이해하고, 각 운용 방식의 성과와 비중을 분석하는 데 활용될 수 있습니다.'
