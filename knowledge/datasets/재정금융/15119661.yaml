description_portal: '증여세란 타인(증여자)으로부터 재산을 증여받은 경우에 그 재산을 증여받은 자(수증자)가 부담 하는 세금을 말함증여란 그 행위 또는 거래의 명칭·형식·목적 등과 관계없이 직접 또는 간접적인 방법으로 타인에게 무상으로 유형·무형의 재산 또는 이익을 이전(현저히 낮은 대가를 받고 이전하는 경우를 포함)하거나 타인의 재산 가치를 증가시키는 것을 말하며，유증과 사인증여는 제외타인으로부터 재산을 무상으로 받은 수증자(개인 또는 비영리법인)는 그 재산에 대한 증여세를 신고·납부수증자가 영리법인인 경우에는 영리법인이 증여받은 재산은 법인세 과세대상에 포함되므로 그 영리법인에게 증여세를 부과하지 않음- 2025년 증여세 신고자 중 과세미달을 제외하고 작성         - 증여재산가액 등 규모별 분류기준은 증여세 신고현황_증여재산가액 등 통계표의 증여재산가액에 증여재산가산액을 합산한 금액임         - 기타는 수증인이 비영리법인 등인 경우(단위: 명, 백만원)'
