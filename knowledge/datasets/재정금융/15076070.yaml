description_portal: '세입 및 수입 예산편성현황(외화)은 중앙행정기관의 외화로 편성된 세입·수입 예산 현황을 집계·제공하는 재정 통계 자료입니다.(부처별, 회계별, 세입·수입 항목별 외화 편성 금액과 통화 단위, 환율, 원화 환산 금액 등을 확인할 수 있으며, 정부의 외화 수입 구조와 규모를 파악할 수 있도록 구성되어 있습니다.)외화 세입·수입은 해외 자산 운용 수익, 국제기구 분담금 환급, 해외 공관 수수료 수입, 외화 재산 처분수입 등 외화로 수취되는 다양한 재원을 포함하며, 환율 변동에 따라 원화 기준 금액이 달라질 수 있습니다.[데이터 주요 항목 및 특징]1. 데이터 범위   * 중앙행정기관의 외화 세입·수입 편성 내역   * 부처명, 회계명, 수입구분(세입/수입), 세입·수입 항목명, 외화 표시 금액 등 포함2. 수입 항목   * 외화세입: 외화세수, 기부금, 국제기구 환급금 등   * 외화수입: 해외 사업 수익, 공관 수수료, 외화자산 이자수익 등3. 활용 예시   * 외화 수입 구조 분석 및 정책 효과 평가   * 해외자산 운용 성과 분석   * 환율 리스크 관리 자료로 활용4. 제공 형식 및 접근 방법   * CSV, XLSX, XML, JSON, TXT 등 다양한 파일형식으로 다운로드 가능   * Open API 제공, 연도, 부처, 수입 항목, 통화 단위 등 조건별 상세 조회 지원본 자료는 정부의 외화 수입 규모와 구조를 투명하게 공개하여 국민의 알권리 충족은 물론, 연구기관·언론·일반 국민이 재정 분석, 외화 운용 정책 수립, 환율 리스크 관리 등에 폭넓게 활용할 수 있는 중요한 재정정보입니다.'
