description_portal: '충청북도 증평군_지방세 납부현황 데이터는 지역 주민과 기업이 납부한 지방세에 대한 납부방식별 현황을 정리한 행정 통계 자료입니다.시도명, 시군구명, 자치단체코드, 납부연도, 세목명(예: 취득세, 재산세 등), 납부매체(인터넷, 금융기관 등), 전자고지 여부, 납부건수, 납부금액, 납부매체 비율로 구성되어 있으며,지방세 수납 경로의 디지털 전환 실적 평가, 납세 편의 정책 설계, 징수방식 다변화 정책의 기초자료로 활용됩니다. 지방세 회계연도 특성상 당해연도 수납 내역은 이듬해 초에 최종 마감 및 검증되므로, 최신 데이터는 2024년 기준이 됩니다.'
