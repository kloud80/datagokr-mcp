description_portal: 면세점(보세판매장)을  외교관 면세점, 출국장 면세점, 입국장 면세점, 시내 면세점, 지정 면세점으로 유형별로 2023년의  매출액을 집계한 데이터이며, 금액은 억원 기준입니다.보세판매장과 관련된 사항은  「관세법」 제174조부터 제182조까지, 제196조 및  「관세법 시행령」 제192조의5제7항 등에서 규정하고 있으며 「보세판매장 특허 및 운영에 관한 고시」 를 통해 보세판매장 특허 및 운영과 관련하여 위임된 사항과 그 시행에 필요한 사항을 규정하고 있습니다.다만, 신고인의 수정, 정정 등으로 인해 통계의 수치는 달라질 수 있으니 유의해 주시기 바랍니다.
