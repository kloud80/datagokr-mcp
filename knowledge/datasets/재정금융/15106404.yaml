description_portal: '2013년부터 2021년까지 총사업비관리대상사업 예산 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시했습니다.*예비타당성 조사 통과·면제 사업 중 미착수 사업이 포함된 것으로, 집행 현황과 다를수 있습니다.*2022년 8월 31일 기준으로 작성되었습니다.총사업비관리제도: 국가의 예산 또는 기금으로 시행하는 대규모 재정사업에 대해 사업추진 단계별로 사업시행 부처와 기획재정부가 협의해 총사업비를 관리하는 제도. 국가재정법 제50조 및 동법 시행령 제21조·제22조의 규정에 의거해 총사업비를 합리적으로 조정·관리함으로써 재정지출의 효율성을 높이는 것을 목적으로 함. 도로, 철도, 항만 등 대규모 SOC 공공건설 사업의 추진과정에서 총 사업비 증가를 엄격히 관리하고자 1994년 도입.'
