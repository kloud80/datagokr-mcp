description_portal: 차등예금보험료율제도는 경영 및 재무상황을 고려하여 개별 부보금융회사별로 보험료율을 달리 적용하는 제도로 부보금융회사 사업연도 종료 후 차등평가를 실시하고 있습니다. 차등보험료율제는 위험에 상응하는 보험료를 부과함으로써 개별 부보금융회사의 위험선호행위를 억제하여, 부보금융회사의 건전경영 유인을 제공하고 도덕적해이를 방지하고 있습니다. 또한, 부보금융회사별로 위험의 정도가 다름에도 불구하고 동일한 예금보험료율을 적용하면 보험료 납부의 형평성 문제가 발생하나, 차등예금보험료율제 적용 시 보험료 납부의 공정성 제고에 기여할 수 있습니다.해당 데이터는 국내 투자매매 및 중개업자(국내증권) 차등모형평가 지표에 대한 데이터이며 차등모형 평가의 세부 평가항목과 평가지표에 대한 정보를 제공하고 있습니다.1. 국내 투자매매업자, 투자중개업자2. 투자매매업자, 투자중개업자
