description_portal: '해당 자료는 경상남도 합천군 지방세 비과감면율현황에 관한 자료입니다.본 데이터는 경상남도 합천군의 시도명, 시군구명, 자치단체코드, 과세년도, 세목명,근거구분,비과세_감면 건수,비과세금액, 감면금액,비과세_감면금액 합계, 부과금액, 비과세감면율 등의  데이터를 포함합니다.지방세 과새액 중 비과세액과 감면액이 차지하는 비율 현황은 국민이 받는 조세 혜택의 규모를 파악하는 자료로 활용됩니다.* 비과세액 : 법률이나 조례에 따라 세금을 아예 부과하지 않는 금액* 감면액 : 부과된 세금에서 일정 부분을 경감해 주는 금액지방자치단체에서 제공하는 조세 혜택 규모를 종합적으로 파악할 수 있으며, 조세 정책 설정 및 개선을 위한 자료로 활용됩니다.'
