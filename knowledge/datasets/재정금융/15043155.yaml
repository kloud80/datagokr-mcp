description_portal: 부산광역시 사상구 내 등록되어 있는 대부업체 현황에 관한 데이터로 상호명, 등록신청 유형, 소재지 등의 정보를 제공합니다.대부업 등의 등록 및 금융이용자 보호에 관한 법률 제2조에 따르면,“대부업”이란 금전의 대부(어음할인ㆍ양도담보, 그 밖에 이와 비슷한 방법을 통한 금전의 교부를 포함한다. 이하 “대부”라 한다)를 업(業)으로 하거나 다음 각 목의 어느 하나에 해당하는 자로부터 대부계약에 따른 채권을 양도받아 이를 추심(이하 “대부채권매입추심”이라 한다)하는 것을 업으로 하는 것을 말하며, “대부중개업”이란 대부중개를 업으로 하는 것을 말합니다.해당 데이터는 사상구 관내의 등록일 현재 영업중인 대부업·대부중개업체의 정보를 제공하며 차기 데이터 등록일 전 변경사항이 있을 수 있으니 특정 시점의 업체 등록 및 영업 여부는 관련 부서에 문의하시기 바랍니다.
