summary_user: 부산광역시 사상구에 등록되어 영업 중인 대부업·대부중개업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 상호·등록신청 업종(등록신청사업)·도로명 소재지·데이터기준일을 담는다(CSV 약 1.4KB 규모의 소량 파일). 주민이나 금융소비자가 거래하려는 대부업체가 사상구에 등록된 업체인지, 어디에 있는지 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 상호명이나 도로명 주소를 맞춰 붙이거나, 다른 시군구의 대부업 등록 현황 파일과 같은 형식으로 이어 붙여 쓴다.
limits: 사상구 한 곳의 등록 현황만 담고 있어 부산 전체나 전국 대부업체를 보려면 다른 기관의 파일을 따로 모아야 한다. 공통 식별 키가 없어 상호·주소 문자열 매칭으로만 연결할 수 있다. 등록일 이후 변경이 있을 수 있어 특정 시점의 등록·영업 여부는 담당 부서에 확인해야 한다.
