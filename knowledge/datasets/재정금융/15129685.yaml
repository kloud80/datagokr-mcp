description_portal: 한국수력원자력(주)이 공개하는 무형자산 세부정보 데이터입니다. 무형자산이란 물리적 실체는 없지만 식별할 수 있고, 기업이나 기관이 통제하며 장기간에 걸쳐 경제적 효익을 제공할 수 있는 비화폐성 자산을 의미합니다. 해당 데이터는 작성일 기준 전년도 기말 기준으로 작성되었으며, 기초장부가액, 증가금액, 감소금액, 상각금액, 기말장부가액 항목으로 구성되어 있습니다. 자산항목은 소프트웨어, 산업재산권, 개발비 등으로 구분되어 있으며, 개발중인무형자산은 제외되었습니다. 별도 재무제표 기준 금액입니다.
