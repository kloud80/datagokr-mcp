description_portal: 신용보증기금의 구상권 현황은 기금이 보증채무를 이행한 이후, 주채무자 또는 관계자에게 법적·계약적 근거에 따라 회수를 청구할 수 있는 금전채권의 정보를 포함한다. 구상권은 모든 대위변제에 따른 채권을 의미하며, 실제 회수 가능성과 회계처리 기준에 따라 "구상채권"과 "특수채권"으로 구분된다. 구상채권은 아직 상각되지 않은 대위변제금 및 대지급금과 이에 수반되는 보증료, 지연보증료, 대위변제 수수료, 손해금, 위약금 등을 포함하며, 상대적으로 회수 가능성이 높은 채권군이다. 반면 특수채권은 회수 가능성이 낮아 회계상 손실로 처리(상각)된 채권으로, 동일한 항목을 포함하지만 재무제표상 자산으로 인식되지 않는다. 이 데이터는 신용보증기금의 채권 관리 현황, 채무자와의 사후적 법적 관계, 회수 전략 수립 등을 위한 핵심 자료로 활용된다.
