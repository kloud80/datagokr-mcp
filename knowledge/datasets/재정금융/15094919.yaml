description_portal: '○ 통계개요* 통계명 : 국세징수* 통계종류 : 서울시 국세징수 규모를 제공하는 일반ㆍ보고통계* 근거법령 : 「국세기본법」에 의한 국세징수 총규모* 작성목적 : 정부 재정정책을 기획ㆍ수립ㆍ집행하기 위한 재정수입에 대한 현황을 파악·분석하고, 이를 통해 지방자치단체의 제현황을 파악하여 이에 적합한 정책을시행할 수 있도록 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 세무서 → 지방국세청 → 국세청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 세무서내용 - 서울시 과세대상에 대한 직ㆍ간접세 등의 국세징수 현황○ 용어설명* 내국세 : 통관절차를 필요로 하지 않고 부과되는 조세. 국내에 있는 과세물건에 대하여부과하는 조세이며, 국세 중에서 관세를 제외한 것을 총칭함* 방위세 : 국토방위를 위하여 국방력을 증강하는데 필요한 재원을 확보하기 위해 국가가국세, 지방세 및 관세법상 납세의무자에게 국세, 지방세 및 관세의 부가세로서과세하는 세금을 말함* 교육세 : 교육부문에 대한 투자를 늘려 과밀학급 해소, 의무교육 연한 연장, 교원의 처우개선 등을 목적으로 설치한 목적세를 말함* 농어촌특별세 : 농어업의 경쟁력 강화를 위한 용도로 사용하기 위해, 조세감면액, 증권거래금액,취득세액,경주·마권세액 등에 일정률로 부과되는 목적세를 말함* 근로장려금 : 부양자녀수와 총급여액 등에 따라 산정된 금액을 지급하는 근로연계형소득지원금○ 기 타* 해당연도 세수 실적을 기준으로 작성함* 자산재평가세는 2000.12.31. 폐지됨* 전화세는 2001.9.1.부터 부가가치세로 통합됨* 노원세무서2004. 4. 1. 신설됨* 종합부동산세는 2005.1.5. 신설됨* 부가가치세는 2010.1.1.부터 지방소비세가 차감됨* 잠실세무서 2013. 5. 6. 신설됨* 관악세무서 2015. 4. 1. 신설됨*중랑세무서 2017. 4. 1. 신설됨○ 출 처 : 서울지방국세청, 국세통계'
