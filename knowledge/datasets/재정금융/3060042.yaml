description_portal: 해당 데이터는 신용보증기금 및 SOC(사회간접자본) 기금의 자금운용 수익률과 이를 평가하기 위한 BM, 그리고 BM 대비 초과수익률을 포함한 운용성과 지표를 종합적으로 나타낸 자료이다. ‘운용수익률’은 기금이 실제 자금을 운용한 결과 얻은 수익률을 의미하며, 이는 기금의 운용 전략, 자산 구성, 시장 상황 등의 영향을 받아 결정된다. ‘BM’은 운용성과를 비교·평가하기 위해 설정한 기준 수익률로, 일반적으로 채권지수, 주식지수 등 기금의 자산구성에 맞는 대표적인 지표가 활용된다. ‘초과수익률’은 운용수익률에서 해당 BM을 차감한 값으로, 운용성과의 상대적 우수성을 나타내는 핵심 지표이다. 이 지표는 기금이 단순히 시장 평균 수준을 따라간 것인지, 혹은 이를 능동적으로 초과하여 성과를 창출했는지를 파악하는 데 중요한 역할을 한다. 특히 신용보증기금과 같이 공공 목적의 정책기금은 안정성과 수익성의 균형이 중요하기 때문에, 자금운용 수익률 현황은 기금의 운용 전략 수립, 위험관리, 정책 목표 달성 정도를 평가하는 데 있어 필수적인 근거 자료로 활용된다.
