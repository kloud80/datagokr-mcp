description_portal: 이 데이터는 신용보증기금의 연도별 및 지역별 보증 현황을 나타내며, 보증기업의 사업장 소재지를 기준으로 집계된 신용보증 실적 정보를 포함한다. 주요 항목은 보증 취급 실적과 잔액 기준 실적으로 구성되어 있으며, 각각 금액, 업체 수, 건수 등 세부 지표로 나뉜다. ‘취급금액’은 해당 기간 동안 신규로 취급된 보증 총액을 의미하며, ‘취급업체’는 보증을 이용한 기업 수, ‘취급건수’는 보증이 실행된 건수를 의미한다. ‘잔액금액’은 해당 시점 기준으로 남아 있는 보증금액을 나타내며, ‘잔액업체수’와 ‘잔액건수’는 각각 현재 보증이 남아 있는 기업 수와 건수를 의미한다. 이 데이터는 신용보증기금의 보증 지원 규모, 지역별 분포, 보증 수요의 추이 등을 분석하는 데 활용되며, 중소기업에 대한 금융지원 현황과 정책 효과성을 진단하는 기초자료로 사용될 수 있다.
