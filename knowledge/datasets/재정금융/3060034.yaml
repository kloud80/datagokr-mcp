summary_user: 신용보증기금 보증을 이용한 기업의 재무비율을 업종(경공업·중공업·종합건설·전문건설·도소매업·서비스업)과 기업규모(외감·비외감)별로 묶은 전국 단위 집계표로, 행 구분(구분)마다 부가가치율·자기자본비율·총자본투자효율·순이익증가율을 담은 작은 CSV 파일(약 6KB)입니다. 정책 담당자나 분석가가 '보증 이용 건설업체 중 외감 기업과 비외감 기업의 자기자본비율 차이는 어느 정도인가' 같은 업종·규모별 재무건전성 비교에 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명·연도 같은 이름 매핑이나 같은 기관(신용보증기금)의 다른 보증 통계와 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 2015년부터 현재까지 신용보증기금의 보증을 이용한 기업들의 업종별 및 기업 규모별 재무비율 현황을 제공하는 자료로, 업종은 경공업, 중공업, 종합건설, 전문건설, 도소매업 등으로 구분되며, 기업 규모는 외부감사 대상 기업(외감)과 비외감 기업으로 나뉜다. 주요 재무비율에는 매출액 대비 영업이익률, 자산 대비 부채비율, 자기자본비율, 유동비율 등 기업의 재무건전성과 수익성을 판단할 수 있는 핵심 지표들이 포함된다. 이를 통해 업종별 또는 기업 규모별로 보증이용 기업의 재무적 특성과 위험 수준을 비교·분석할 수 있으며, 정책 수립, 리스크 평가모형 개선, 산업별 신용지원 전략 마련 등에 활용된다. 또한 기업의 규모와 업종에 따라 재무구조가 어떻게 상이하게 나타나는지를 분석하는 데 유용한 기초 통계 자료로 활용될 수 있다.
