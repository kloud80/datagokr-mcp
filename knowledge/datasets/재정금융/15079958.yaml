description_portal: 충청북도 주민 1인당 또는 세대당 부담된 지방세 부담액을 나타냅니다.(과세년도, 주민1인당 부담금액, 세대당 부담금액, 지방세 부과액, 인구수, 세대수)* 데이터 항목별 상세 설명1인당 지방세 부담액은 매 과세년도 기준 지방세 부과액을 인구수로 나눈 값이며,세대당 지방세 부담액은 매 과세년도 기준 지방세 부과액을 세대수로 나눈 값입니다.지방세 부과액은 매 과세년도에 부과된 도세와 지방세의 합계입니다.인구수는 해당 연도말 기준 도내 인구수이며,세대수는 해당 연도말 기준 도내 세대수를 나타냅니다.인구수와 세대수는 주민등록 인구통계의 주민등록 인구 및 세대현황 수치입니다.주민 1인당 또는 세대당 지방세 부담액은 거시경제 지표인 조세승수의 산출 기초로 활용될 수 있습니다.조세승수는 세금이 1단위 증가할 때 국민소득이 얼마나 증가 또는 감소하는지를 나타내는 지표입니다.
