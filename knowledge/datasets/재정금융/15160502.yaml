description_portal: 이 데이터는 신용보증기금의 신용보험 비대면 신청 관련 현황을 집계한 자료로, 인터넷신청_동의서_관계, 인터넷신청_동의서_정보, 인터넷신청_온라인보험_관계, 인터넷신청_온라인보험_마스터, 인터넷신청_전자약관교부_제안서 등의 테이블을 포함하고 있다. 본 데이터는 보험가입매출채권금액, 납입대상보험료, 인터넷 신청 동의서 및 전자약관 교부 현황 등 비대면 신용보험 신청 업무의 기본적인 관리 현황을 제공함으로써, 관련 분야의 전반적인 업무 흐름을 파악하는 데 참고할 수 있는 기반을 제공한다. 데이터 내 ‘인터넷신청_온라인보험_마스터’ 및 ‘보험가입매출채권금액’, ‘납입대상보험료’ 정보는 비대면 보험 신청 규모의 대략적인 추이를 살펴보는 데 활용될 수 있으며, ‘인터넷신청_동의서_정보’ 및 ‘전자약관교부_제안서’ 등은 온라인 신청 절차에서의 단편적인 경향성을 파악하는 기초 자료를 제공한다. 해당 데이터는 유관 분야의 일반적인 현황 파악이나 학술 연구 등을 위한 단순 참고용 자료로서의 역할을 수행하며, 공공데이터 개방 취지에 부합하도록 지원한다.
