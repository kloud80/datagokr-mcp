summary_user: 금융회사의 지배구조 정보(주주, 대표이사, 임원보수, 임원)를 기준일자와 법인등록번호별로 담은 API이며, 검증 기준 전체 14,460건이 2013-03-31~2013-12-31 기간에 걸쳐 있다. 분석가나 금융회사 관계자가 특정 금융회사의 최대주주와의 관계, 지분율, 주식 수 같은 주주 구성을 확인하는 질문에 쓴다. 법인등록번호(crno, corp_rgst_no)를 조인 키로 삼아 금융위원회의 기업기본·재무 정보와 기업 단위로 이어 쓴다.
description_portal: '금융회사지배구조정보는 기준일자와 법인등록번호를 기반으로 금융회사의 지배구조 관련 정보를 제공하는 데이터입니다.이 데이터는 네 가지 오퍼레이션으로 구성되며, 각각 다음과 같은 정보를 포함합니다:1. 금융회사주주정보: 주주 성명, 최대주주와의 관계, 주식 종류, 지분율 등2. 대표이사정보: 대표이사 성명, 등기임원 여부, 상근 여부, 담당업무, 주요 경력, 임기만료일 등3. 임원보수현황: 등기이사, 사외이사, 감사인 등의 보수 총액, 평균 금액, 인원수 및 비고4. 임원정보: 임원 성명, 직위, 성별, 재직기간, 담당업무, 경력사항, 보유 주식 수 등※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
