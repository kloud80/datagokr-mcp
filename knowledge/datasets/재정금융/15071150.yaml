description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)가 운영하는 헬스케어타운의 개발 현황을 2018년 8월 기준으로 정리한 자료입니다. 주요 데이터 항목은 구분, 면적, 건축면적(㎡), 건축연면적(㎡), 건폐율(%), 용적률(%), 높이, 건축물용도, 객실수로 구성되어 있으며, 이를 통해 헬스케어타운 내 각 부지 또는 건축물의 용도별 특성과 규모, 공간 배치 등을 종합적으로 확인할 수 있습니다. 건축물용도는 도로, 숙박시설, 근린생활시설, 의료시설 등으로 다양하게 구성되어 있으며, 복합기능을 포함한 개발 구역의 특성을 반영합니다. 객실수 항목은 숙박시설 등 객실이 존재하는 용도에 한해 실제 객실 수가 숫자로 기재되며, 해당하지 않는 항목은 ‘해당없음’으로 표시되어 있습니다. 건폐율과 용적률은 각 구역의 건축 밀도 및 효율성을 나타내며, 건축면적과 연면적은 각각 해당 부지 내 건축물의 수평적·총합적 공간 규모를 의미합니다. 이 데이터는 헬스케어타운의 도시계획 이행 상황, 용도별 시설 비율, 고밀도 개발 여부, 의료·숙박 인프라 확보 수준 등을 분석하는 데 활용할 수 있으며, 향후 투자 유치, 개발단계별 성과 측정, 기반시설 확충 및 복합 기능 배치 전략 수립 등에 있어 실질적인 기초 자료로 활용될 수 있습니다.
