description_portal: 경상북도 청도군의 지방세 체납 현황 중, 체납액 규모별 체납 건수에 대한 정보를 제공합니다.이 자료는 청도군에서 발생한 지방세 체납 사례를 체납 금액 규모에 따라 구간별로 분류하여, 납세 이행 실태를 정밀하게 파악하고 징수 행정의 효율성을 높이기 위한 목적으로 수집된 데이터입니다.제공 항목에는 과세연도, 세목명(재산세, 자동차세, 주민세 등), 체납액 구간, 체납 건수, 체납 금액, 그리고 구간별 체납 누적 건수 및 누적 체납 금액이 포함되어 있습니다.이 자료를 통해 연도별, 세목별로 어떤 체납액 규모에서 가장 많은 건수가 발생하는지, 또는 고액 체납의 비중이 어느 정도인지 등을 파악할 수 있습니다.
