description_portal: '1. 데이터 개요 : 금융권별 부보금융회사 수, 예금보험료 수입액, 예금보험금 지급액에 대한 정보 (국가데이터처 승인 국가승인통계)2. 데이터 단위 : 부보금융회사(개), 예금보험료 수입 및 예금보험금 지급액 (억원)3. 부보금융회사 통계- 금융업권은 은행, 보험(생명보험, 손해보험), 금융투자업권(증권회사, 자산운용사, 선물사), 상호저축은행(중앙회 포함), 종합금융회사로 구분- 업권별 예시· 은행 : 국민은행 등 시중은행, 부산은행 등 지방은행 및 케이뱅크은행 등 인터넷 전문은행 포함, 수출입은행 등 특수은행 제외· 생명보험 및 손해보험 : 교보생명 등 생명보험회사 및 삼성화재 등 손해보험회사 포함, 코리안리 등 재보험사 제외· 금융투자회사 : 증권사, 자산운용사, 선물사 및 한국증권금융 포함· 종합금융회사 : 우리종합금융· 저축은행 : 참저축은행 등 저축은행 및 상호저축은행중앙회 포함4. 예금보험료 수입 현황 통계- 예금보험료 : 보험사고 발생시 예금보험금 지급이나 자금지원을 위해 부보금융회사로부터 수납하는 금전- 각 업권별 예금보험료 수납시기· 은행 : 매 분기 종료 후 1개월 이내 (1년 4회)· 은행 외 업권 : 매 사업연도 종료 후 6개월 이내 (1년 1회)5. 예금보험금 지급 현황 통계- 예금보험금 : 부보금융회사가 예금의 지급정지, 인·허가의 취소, 해산·파산 등 예보법상 보험사고로 인하여 고객의 예금을 지급할 수 없는 경우 예금보험공사가 해당 금융회사를 대신하여 지급하는 금전- 보험금 지급 방법 : 예금보험공사는 예금자 편의를 위해 온·오프라인 채널을 통해 지급· 오프라인 신청 : 지급대행점(농협은행 외 시중은행 5개사) 방문→실명확인 등 서류 확인→지급대행기관 직원이 공사 시스템에 신청내역 입력→지급대행기관 책임자 확인 및 이체승인→신청계좌로 보험금이체· 온라인 신청 : 공사 홈페이지 접속→보험금 조회 및 신청→본인인증절차 진행→공사 확인 및 이체승인→신청계좌로 보험금이체'
