summary_user: 신용보증기금 조사서에 기록된 기업별 개요로, 조사서 한 건마다 기업형태·상시직원수·최종업종코드·기업규모를 담은 건별 원천 파일(CSV 약 22KB, 전국·비공간)이다. 보증·투자를 받은 기업이 어떤 업종과 규모, 고용 수준에 분포하는지 보려는 정책 분석가나 연구자가 '신보 보증 기업 중 제조업 소기업의 상시직원 규모는 어느 정도인가' 같은 질문에 쓴다. 조사서ID(kodit_survey_id)로 같은 기금의 다른 조사서 파일과 잇고, 최종업종코드는 통계청 한국표준산업분류(세세분류)를 따르므로 산업분류 코드표나 업종별 통계와 맞춰 쓴다.
description_portal: 해당 파일은 신용보증기금이 운용하는 조사서 기업개요 데이터로, 기업형태, 상시직원수, 최종업종코드 등의 항목을 제공합니다.업종코드(세세분류)는 별개의 코드북 없이 통계청의 한국표준산업분류코드를 따르고 있는 바, 아래의 링크를  참고하여 주시기 바랍니다. https://kssc.kostat.go.kr:8443/ksscNew_web/kssc/main/main.do?gubun=1 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다
