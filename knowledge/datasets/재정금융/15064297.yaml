summary_user: 한국무역보험공사가 쓰는 업종코드마다 업종 한글명·영문명, 계층구분(대·중·소분류), 국내·국외 업체 업종 세그먼트, 업종코드 버전을 한 행씩 담은 코드표이며, 포털 설명상 약 2,000여 개 코드가 한국표준산업분류(KSIC) 제11차 기준을 따르는 전국 단위 비공간 자료다. 무역보험 통계나 공사 데이터를 다루는 분석가가 '이 업종코드는 어떤 산업이고 어느 상위 분류에 속하나'를 확인하거나 업종별로 묶어 집계할 때 쓴다. 업종코드(ksure_industry_cd)를 키로 업종코드가 들어 있는 공사의 다른 데이터에 붙여 업종명과 분류를 매핑한다.
description_portal: 본 데이터는 업종코드별 업종한글명, 업종영문명 등입니다. 총 약 2,000여 개의 업종코드가 수록되어 있으며, 각 코드별로 업종의 한글명, 영문명 및 계층구분 등의 컬럼이 포함되어 있습니다. 데이터는 한국표준산업분류(KSIC)의 제11차 기준을 따르고 있으며, 업종 코드 구조(계층구분)를 통해 대분류 · 중분류 · 소분류까지 구분할 수 있도록 설계되어 있습니다. 이용자는 본 데이터를 활용해 무역보험 관련 통계 사용 시 업종 기반 분류를 정확하게 매핑할 수 있으며, 산업별 위험지표, 결제정보, 보험 인수·보상 실적 등 다양한 공사 내부 데이터와의 연계 시 유용한 기준 자료로 활용 가능합니다.
