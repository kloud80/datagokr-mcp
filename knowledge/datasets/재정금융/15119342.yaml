description_portal: '상속세란 사망으로 그 재산이 가족이나 친족 등에게 무상으로 이전되는 경우에 당해 상속재산에 대하여 부과하는 세금을 말함상속세 신고·납부의무가 있는 납세의무자에는 상속을 원인으로 재산을 물려받는 “상속인”과 유언이나 증여계약 후 증여자의 사망으로 재산을 취득하는 “수유자”가 있음상속인이란 혈족인 법정상속인과 대습상속인, 사망자(피상속인)의 배우자 등을 말하며, 납세의무가 있는 상속포기자, 특별연고자도 포함- 2025년 상속세 신고자 중 과세미달을 제외하고 작성(1인이 여러 재산을 상속할 수 있어 합계인원과 자산종류별 인원의 합계는 차이가 발생함)- 총상속재산가액 등 규모별 분류기준은 6-1-2 통계표의 상속재산가액(2)과 가산하는 증여재산가액(16)을 합산한 금액임(단위 : 명, 백만원)'
