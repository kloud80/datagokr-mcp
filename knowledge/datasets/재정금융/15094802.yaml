summary_user: 한국거래소 파생상품시장의 선물·옵션 종목별 일별 시세(기준일자·시가·고가·저가·종가·정산가·거래량·미결제약정)를 담은 API로, 전체 5,497,979건이며 기간은 2025-04-10부터 2027-09-10까지다. 분석가나 투자자가 코스피200선물 같은 특정 상품의 일별 가격 흐름과 미결제약정 변화를 확인하는 질문에 쓴다. 단축코드(srtnCd)와 ISIN코드(isinCd)가 종목코드(stock_cd) 키여서, 같은 키를 가진 증권 시장 종목 원장·시세나 기업 공시 데이터와 이어 쓴다.
description_portal: '파생상품시세정보는 한국거래소에서 제공하는 파생상품 시장의 시세 데이터를 시계열 형태로 제공하는 데이터입니다. 해당 데이터는 선물 및 옵션 상품의 시장별 시세 정보를 포함하고 있습니다.이 데이터는 2개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 선물시세 : 파생상품시장에 상장된 선물 상품의 시세 정보를 제공② 옵션시세 : 파생상품시장에 상장된 옵션 상품의 시세 정보를 제공※ 선물이란?: 선물은 특정 기초자산을 미래 일정한 시점에 미리 정해진 가격으로 사고팔 것을 계약하는 상품※ 옵션이란?: 미래 특정한 날짜에 특정한 기초자산을 사전에 정해진 가격으로 사거나 팔 수 있는 권리'
team:
  dept: 금융공공데이터팀
