description_portal: 기술보증기금이 연간 지원하는 자금용도별(운전자금/시설자금) 보증지원현황 정보 데이터입니다.운전자금의 경우 인건비, 원자재 구매 등 중소벤처기업이 사업을 영위하는 데에 있어 경상적인 영업활동에 필요한 운영자금을 뜻합니다.시설자금의 경우, 중소벤처기업이 재화나 서비스를 생산하기 위한 정상적인 영업활동에 사용할 목적으로 직,간접적으로 필요한 토지, 건물, 기계기구 등의 자산을 매입, 신축 등을 하기 위해 필요한 자금을 뜻합니다.해당 자료는 한 해에 기술보증기금에서 중소벤처기업에 지원한 총보증금액으로, 보증비율에 따라서 실제 대출금액이 다를 수 있습니다. (보증비율 최대 100%, 전액보증일 경우만 보증금액과 대출금액이 일치)- 순번, 기준년월, 운전자금(억원), 시설자금(억원)본 자료는 월별로 구분되어 제공되고 있으며, 총보증금액(신규 외)으로 제공됩니다.
