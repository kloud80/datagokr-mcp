description_portal: 「공공기관의 정보공개에 관한 법률」 제7조(행정정보의 공표 등) 제1항과 「재정경제부 행정정보공개운영지침」 제5조(행정정보공표 및 대상정보) 제1항·제2항에 근거하여 공표대상 행정정보의 범위와 공표 주기·시기를 체계적으로 정하여 제공하는 자료입니다.해당 데이터는 법령에 따라 국민에게 공개해야 하는 주요 행정정보를 선별·정의한 것으로, 국민의 알권리를 보장하고 공공기관의 투명성과 책임성을 강화하기 위해 마련되었습니다.또한 본 데이터는 행정정보의 표준화된 관리체계를 기반으로 생산·수집되며, 공표 기준에 따라 정기적으로 갱신됩니다. 이를 통해 국민, 연구자, 민간기업 등 다양한 이용자가 신뢰도 높은 행정정보를 활용할 수 있도록 지원하고, 공공데이터의 민간 활용 촉진 및 정책 품질 제고에 기여하고자 합니다.
