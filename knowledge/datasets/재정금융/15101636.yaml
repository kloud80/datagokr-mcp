description_portal: "수출입신고 통관업무처리 절차를 기초로 수집한 무역자료를  항구/공항별 기준에 따라 집계한 수출입실적을 국민, 기업, 공공기관 등이 쉽고 편리하게 조회할 수 있도록 제공하는 서비스입니다. 항구공항지역코드를 이용하여 관세청 수출입통계정보의 항구 공항 지역명, 수출건수, 수출금액, 수입건수, 수입금액, 세관코드, 무역 수지등을 조회 할 수 있습니다. 통계주기는 1개월이고, 시기는 매월 15일경 수출입 신고의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화하고 있습니다.강원도가 강원특별자치도로 변경('23.6.11.)됨에 따라  참고자료에 강원특별자치도의 시도코드( 51)를 추가 반영하였습니다.※ '26.7.1.자 전남광주통합,인천 지방행정체계 개편으로 수출입신고 시도코드가 변경되었으니, 수출입실적 조회 시 참고하시기 바랍니다 - '26.7.1.이후 수출입실적 조회: 전남광주통합특별시 코드 12 - '26. 7월 이전 수출입실적 조회: 광주광역시 코드 29 / 전라남도 코드 46"
