summary_user: 생명보험 가입 현황을 기준년도·도달연령대·세제적격 여부·납입방법·모집형태·납입기간별 가입건수로 담은 전국 단위 집계 통계이며, 개인 계약 단위의 원천 기록은 아니다. 분석가나 연구자가 '연령대별로 세제적격 개인연금보험 가입이 얼마나 되고, 어떤 모집 경로와 납입기간이 많은가'와 같은 연금보험 수요 질문에 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 기준년도나 연령대 같은 이름을 맞춰 매핑하거나 같은 기관 데이터와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: "생명보험가입정보는 국내 국민의 생명보험 가입 현황 및 개인연금보험 가입 관련 정보를 제공하는 데이터입니다. 연령대별, 성별, 보험상품 유형별 가입 건수 및 보험료 통계를 통해 생명보험 시장의 구조와 연금보험 수요를 파악할 수 있습니다.이 데이터는 2개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 우리나라 국민 보험가입 현황 : 우리나라 국민 보험가입 현황의 \uFEFF기준년도, 지역, 성, 도달연령, 보험종류, 가입건수, 가입율 정보 제공② \uFEFF개인연금보험 가입정보 : 개인연금보험 가입정보의 \uFEFF기준년도, 도달연령, 세제적격, 납입방법, 모집형태, 납입기간, 가입건수 정보 제공"
