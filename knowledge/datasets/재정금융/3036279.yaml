summary_user: 예금보험공사가 발간한 도서를 한 권씩 담은 목록으로, 서명·저자·출판사·발행연도·자료형태·언어·발행국·쪽수·ISBN 등 서지 정보를 제공한다. 금융·예금보험 분야 연구자나 도서관 담당자가 '예금보험공사가 어떤 보고서·도서를 언제 냈는가'를 확인하는 데 쓴다. 다른 데이터와 잇는 전역 조인 키는 없고, ISBN이나 서명으로 국가 서지·도서관 소장 정보와 맞춰 보는 정도로만 연결한다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 서명·ISBN 같은 이름 매칭으로만 이을 수 있다. 전국 단위의 비공간 데이터라 지역별 분석에는 쓸 수 없다. 개발계정은 하루 10,000회까지 호출할 수 있다.
