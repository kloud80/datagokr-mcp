description_portal: '부산광역시에서 운영하고있는 통합자금시스템의 보고서관리정보 데이터로 엠알디(MRD)명,에스피(SP)명,등록일시,보고서(ID),보고서명,사용여부,업무구분 정로를 제공합니다.부산광역시에서 운영하는 통합자금시스템은 시 재정 업무를 보다 효율적이고 체계적으로 관리하기 위해 구축된 전산 시스템입니다. 이 시스템에서는 보고서 관리와 관련된 다양한 정보를 데이터 형태로 제공하고 있습니다. 제공되는 데이터 항목으로는 다음과 같은 것들이 있습니다.엠알디(MRD)명: 보고서의 종류나 구분을 나타내는 코드로, 각 보고서가 어떤 목적과 용도로 작성되었는지를 확인할 수 있습니다.에스피(SP)명: 보고서를 생성하거나 처리하는 프로그램 또는 스크립트 이름을 의미하며, 보고서의 자동화 처리 여부를 파악하는 데 사용됩니다.등록일시: 해당 보고서가 시스템에 등록된 정확한 일시 정보를 포함하여, 보고서 생성 시점과 관리 기록을 확인할 수 있습니다.보고서(ID): 보고서 고유 식별자로, 데이터베이스에서 보고서를 조회하거나 관리할 때 활용됩니다.보고서명: 각 보고서의 명칭으로, 보고서의 내용을 직관적으로 이해할 수 있도록 표시됩니다.사용여부: 보고서가 현재 사용 중인지, 혹은 비활성 상태인지 여부를 나타내어 관리 효율성을 높입니다.업무구분: 보고서가 속하는 업무 영역을 구분하는 항목으로, 재정, 회계, 자금관리 등 각 업무별 보고서를 쉽게 분류하고 활용할 수 있습니다.이처럼 통합자금시스템의 보고서 관리 데이터는, 부산광역시의 재정 운영과 업무 흐름을 보다 투명하고 체계적으로 관리하기 위해 필수적인 정보를 제공하며, 이를 통해 보고서의 생성, 관리, 활용 전 과정이 효율적으로 이루어질 수 있도록 지원하고 있습니다.'
