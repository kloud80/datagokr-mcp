description_portal: 이 데이터는 신용보증기금이 제공하는 보증종류별 연도별 취급현황을 나타낸 것으로, 대출보증, 지급보증, 어음보증, 납세보증, 이행보증, 시설자금 보증 등 다양한 보증 유형별 실적을 연도 단위로 확인할 수 있다. 각 보증은 용도 및 보증 방식에 따라 구분되며, ‘대출보증’은 금융기관 대출에 대한 보증, ‘지급보증’은 특정 지급의무 이행을 담보하는 보증, ‘어음보증’은 상업어음 지급을 보장하는 보증을 의미한다. 또한 ‘납세보증’은 세금 납부 유예 등에 활용되고, ‘이행보증’은 계약 이행을 담보하는 보증, ‘시설자금 보증’은 고정자산 확보에 필요한 자금에 대한 보증이다. 이 데이터를 통해 연도별 보증상품의 활용 추이, 정책 변화에 따른 보증 수요의 증감, 그리고 중소기업 자금 지원의 방식 변화 등을 파악할 수 있으며, 보증제도 운영의 전략적 방향성을 설정하는 데 기초 자료로 활용된다.
