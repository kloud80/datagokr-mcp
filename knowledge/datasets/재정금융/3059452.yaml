description_portal: 고액·상습체납자 명단은 2004년도에 최초로 공개(2년경과 체납액 10억원 이상)함공개대상 체납국세 기준이 2010년에는 10억원에서 7억원으로, 2012년에는 2년 경과 7억원에서 1년 경과 5억원으로, 2016년에는 3억원으로, 2017년에는 2억원으로 변경됨고액·상습체납자 명단공개 실적- 통계자료 공개 당시 연도 말 기준 명단공개 중인 인원과 체납 합계액에서 2차납세의무, 연대납세의무 등 중복 체납액을 제거한 금액임고액·상습체납자 명단공개자의 현금징수 실적- 명단공개로 체납자로부터 국세체납액을 현금으로 정리한 실적재산 압류 및 공매 현황- 해당연도 12.31 현재 6개 지방청별 체납자 등의 재산별 압류 현황체납자료 신용정보기관 제공 현황- 매년 연도말 현재 한국신용정보원에 체납자로 등록된 인원을 기준으로 작성
