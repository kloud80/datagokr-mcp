summary_user: 한국무역보험공사가 쓰는 업종 분류 목록으로, 업종코드·업종명과 함께 상위업종코드와 업종클래스를 한 행씩 담는 전국 단위 코드표입니다. 수출결제정보 등 무역보험공사 자료를 분석하는 사람이 '이 업종코드는 어느 대분류·상위업종에 속하나'를 확인하거나 유사 업종을 묶어 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관 데이터의 업종코드와 맞추거나 업종명으로 매핑해 이어 쓴다.
limits: 다른 기관 데이터와 바로 붙는 공통 키가 없어 코드·이름 매핑이 따로 필요하다. 지역 구분이 없는 비공간 코드 목록이라 지역별 분석에는 쓰지 못한다. 개발계정은 하루 5,000회까지 호출된다.
