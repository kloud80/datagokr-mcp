description_portal: 한국무역보험공사에서 보유한 업종목록 자료입니다. 업종목록은 업종클래스 및 상위업종으로 분류되며 각 업종코드, 업종명으로 구성됩니다. 업종 데이터는 제 11차 한국표준산업분류코드(KSIC)를 따릅니다. 업종코드를 구성하는 숫자 데이터를 통해 대분류, 중분류, 소분류를 구별할 수 있습니다. 본 API를 통해 각 대분류 업종 별 상세 업종코드 데이터를 수집하고, 이를 수출결제정보 조회에 활용할 수 있습니다. 또한, 업종클래스별 업종코드, 상위업종별 업종코드 등 업종 그룹화를 통해 여러 유사 업종에 대한 데이터를 확인할 수 있습니다.
