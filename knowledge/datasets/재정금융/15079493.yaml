description_portal: 최근 5년간의 지방세 통계 자료를 기반으로 연도별 체납현황 데이터를 제공합니다.연도별, 세목별, 체납금액 구간(10만원, 30만원, 50만원, 1백만원, 3백만원, 1천만원)별로 확인 가능합니다. 본 데이터는 지방세 체납금액의 추이를 분석하여 징수율 향상 방안, 체납 세액 회수 전략 및 체납 관리 시스템 개선에 활용됩니다.또한 연구기관과 정책기관은 이를 바탕으로 체납 발생 원인 분석, 체납 징수 정책 개선, 세수 안정성을 확보하기 위한 기초자료로 활용할 수 있습니다.체납금액 분석을 통해 납세자와 지방정부 간의 신뢰를 구축하고, 효율적인 세금 징수를 위한 정책 수립에 기여할 수 있습니다.
