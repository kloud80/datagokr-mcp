status: active
summary_user: 상장 채권의 대차거래를 종목·일자별 체결금액·상환금액·체결잔액, 시장 전체 일별 추이, 참여자 유형별(보험사·자산운용사 등) 대여·차입 금액과 비율로 나눠 담는 전국 단위 집계 API로, 3개 오퍼레이션 모두 실호출이 확인됐다. 채권 운용 담당자나 시장 분석가가 특정 채권의 대차 잔액이 언제 늘었는지, 어떤 참여자 유형이 차입을 주도하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 채권종목코드(bondItmsCd)나 종목명, 기준일자로 같은 기관의 채권 시세·발행 정보와 맞춰 잇는다.
limits: 필수 파라미터(likeBasDt)는 다른 데이터에서 받은 값을 먼저 넘겨야 호출된다. 전역 조인 키가 없어 다른 데이터와는 종목코드·이름 매핑이나 같은 기관 코드로만 연결된다. 개발계정은 하루 10,000회로 호출이 제한된다.
