description_portal: '채권대차거래정보는 상장 채권의 대차거래에 대한 다양한 통계를 제공하는 데이터입니다.채권별 대차 체결 내역, 시장 전체의 거래 추이, 투자자 유형별 거래량 등 세부 정보를 확인할 수 있습니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 채권 대차거래 내역 조회 : 종목별, 일자별 채권 대차거래 금액 및 수량 내역을 조회합니다.② 채권 대차거래 추이 조회 : 전체 시장 기준 대차거래 규모의 시계열 추이를 제공합니다.③ 참여자별 채권 대차거래내역 조회 : 참여자 유형별(예: 보험사, 자산운용사 등) 거래 내역 및 집중도를 조회합니다.※ 주의사항 ※본 개방데이터는 공공누리 4유형으로 출처표시+상업적 이용금지+변경금지에 해당합니다.'
