description_portal: '본데이터는 주택도시보증공사의 상품권 구매 사용 내역을 보여주는 데이터입니다.-자료 공개 목적 및 취지1. 투명성 제고: 공사는 공공성을 가진 기업으로서 내부 지출 집행에  대한 투명성을 강화하고, 이해관계자 등의 알 권리를 실현하기 위함입니다.2. 부정 사용 방지: 대외에 공개함으로써 상품권 집행 과정에서 발생할 수 있는 오남용 및 부정을 예방하기 위함입니다.3. 내부 효율성 제고: 내부통제의 일환으로 데이터 관리를 통해 지출의 적정성 및 효율성을 높이고, 기관 내부의 자료관리 체계 효율을 높이기 위함입니다.-자료 설명1. 본자료는 구입한 상품권의 소관부서, 구입목적, 구매단가, 수량, 구매일자, 불출수량, 불출일자, 금액 등 자료가 포함되어 있습니다.2. 자료형식은 csv형식으로 제공됩니다.'
