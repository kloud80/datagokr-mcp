description_portal: 이 데이터는 지난 2018년부터 2025(6)년까지 총 7(8)년간 제안된 주민참여예산사업의 연도별, 선정여부별, 및 구군별 사업수를 제공하는 데이터 정보입니다. 연도는 2018년부터 2025(6)년까지의 범주에 해당하며, 선정여부는 최종 예산 편성, 최종 예산 미편성, 분과위 상정, 미상정 등의 여부 등을 포함합니다. 더하여 구군은 당시에는 군위군이 대구광역시에 편입이 되지 않았던 상황이므로 중구, 동구, 서구, 남구, 북구, 수성구, 달서구, 달성군 총 8개 구군의 사업수에 한정이 됩니다. 이를 통하여 해당연도의 주민제안사업의 수를 볼 수 있습니다.(현재는 군위군도 포함되어 있습니다)
