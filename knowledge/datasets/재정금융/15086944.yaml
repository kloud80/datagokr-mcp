description_portal: '본 데이터는 2025년 부산광역시 동래구 관내에서 부과된 지방세에 대한 연도별 과세 실적을 정리한 자료입니다.지방자치단체의 재정운영, 세입 분석, 과세 정책 수립 등에 활용할 수 있도록 구성되었으며, 세목별 과세·비과세 현황을 명확히 파악할 수 있는 정량 기반의 재정 통계자료입니다.자료는 CSV 형식으로 제공되며, 다음과 같은 항목으로 구성되어 있습니다:자치단체코드: 동래구를 식별하는 고유 행정코드과세년도: 해당 과세자료가 적용되는 연도 (2025년)세목명: 지방세의 세목 종류 과세건수: 해당 세목에 대해 실제 과세된 건수과세금액: 해당 세목에서 부과된 총 세액(원 단위)비과세건수: 과세대상 중 비과세 처리된 건수비과세금액: 비과세로 분류된 금액 총합해당 자료는 부산광역시 동래구청 세무과,필요 시 추가적인 세부 항목(예: 환급금, 세목별 비과세 사유 등)은 별도 요청을 통해 확인 가능합니다.'
