summary_user: 용인시 관내에 등록된 대부업체를 업체 한 곳당 한 행으로 담은 등록 원장 파일로, 등록신청사업·등록증번호·상호·법인여부·지번 및 도로명 소재지를 포함한다. 시민이 거래하려는 대부업체가 용인시에 정식 등록된 곳인지, 사업장이 실제로 어디에 있는지 확인하거나, 분석가가 관내 개인·법인 대부업체 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 시군구의 대부업 등록 현황과는 상호·주소 같은 이름 매칭으로 잇고, 소재지 주소를 지오코딩해 위치 기반 자료와 결합한다.
description_portal: 본 데이터는 용인시 관내 대부업체의 등록정보를 체계적으로 관리하고 공개하기 위한 자료이다. 등록신청사업과 등록증번호를 기준으로 대부업체의 등록 현황을 확인할 수 있도록 구성하였으며, 상호 정보는 업체 식별을 위한 기본 항목으로 활용된다. 법인여부는 사업자의 운영 형태를 구분하는 기준이 되며, 개인사업자와 법인사업자의 현황을 파악하는 데 활용된다. 소재지와 소재지(도로명)는 업체의 위치 정보를 제공하여 시민이 사업장 위치를 명확히 확인할 수 있도록 지원한다. 본 데이터는 대부업 관리의 투명성 확보, 금융 관련 민원 대응, 등록업체 현황 분석 및 불법 금융행위 예방 정책 수립 등에 활용되는 기초 자료이다. 또한 등록된 대부업체 정보를 공개함으로써 시민의 금융 이용 안전성과 행정 신뢰도를 높이는 데 기여한다.
