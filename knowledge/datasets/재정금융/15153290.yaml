summary_user: 춘천사랑상품권 가맹점을 사업장 한 곳당 한 행으로 담은 건별 목록으로, 상호명·주소·상세주소·가맹 등록일과 종이상품권·모바일상품권 사용 가능 여부를 담는다(춘천시 범위, CSV 약 1.1MB). 시민이 '내가 가진 모바일 춘천사랑상품권을 집 근처 어느 가게에서 쓸 수 있나'를 찾거나, 분석가가 등록일로 신규 가맹점 증가 추세와 지역 상권 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소를 지오코딩하거나 상호명·주소 문자열을 맞춰 이어야 한다.
description_portal: 본 데이터는 춘천시에서 운영하는 지역경제 활성화 정책의 일환인 ‘춘천사랑상품권’의 가맹점 현황을 시민에게 투명하게 제공하기 위해 구축된 공개 데이터입니다. 데이터는 ‘상호명’, ‘주소’, ‘상세주소’, ‘등록일’, ‘종이상품권 사용여부’, ‘모바일상품권 사용여부’로 구성되어 있으며, 춘천사랑상품권을 어디에서 사용할 수 있는지 명확하게 확인할 수 있도록 체계적으로 정리되어 있습니다.‘상호명’은 가맹점의 공식 명칭으로, 시민이 상품권을 사용할 수 있는 사업장을 식별하는 기본 정보입니다. 이를 통해 음식점, 소매점, 서비스업 등 다양한 업종의 가맹점을 빠르게 찾아볼 수 있습니다. ‘주소’와 ‘상세주소’는 가맹점의 실제 위치를 나타내며, 이용자가 가까운 가맹점을 검색하거나 특정 지역 내 가맹 현황을 확인하는 데 중요한 데이터입니다. 특히 상세주소 항목은 건물명이나 호수 등 구체적인 위치를 제공하여 실제 방문 편의성을 높이고 있습니다.‘등록일’은 해당 가맹점이 춘천사랑상품권 가맹점으로 등록된 날짜를 의미합니다. 이를 통해 신규 가맹점 증가 추세나 특정 시기의 정책 효과 등을 분석할 수 있으며, 시민 입장에서는 신규 등록 여부를 파악하여 최신 가맹점을 확인하는 데 도움이 됩니다. ‘종이상품권 사용여부’는 전통적인 형태의 종이상품권을 해당 가맹점에서 사용할 수 있는지 여부를 나타냅니다. 이를 통해 사용자는 자신이 보유한 상품권 형태에 따라 이용 가능한 매장을 쉽게 구분할 수 있습니다.‘모바일상품권 사용여부’는 모바일 기반의 춘천사랑상품권을 결제 수단으로 받을 수 있는지를 나타낸 항목입니다. 디지털 기반 결제 환경이 확대되는 상황에서 모바일상품권 사용 가능 여부는 시민의 편의와 접근성을 결정하는 중요한 요소가 되고 있습니다.
