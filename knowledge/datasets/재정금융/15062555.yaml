description_portal: 국민참여예산 제안사업의 기관별 분기별 집행실적 정보를 제공합니다. 참여예산, 참여사업, 집행실적 등의 키워드를 중심으로 구성되어 있으며, 사업 제안명, 예산액, 집행액 등 주요 항목을 포함합니다. 해당 데이터는 제안된 사업의 추진 실태를 국민에게 공개함으로써 예산 집행의 투명성과 책임성을 높이는 데 기여합니다. 이 자료는 재정 운영의 신뢰성을 제고하고, 국민 참여 확대 및 재정 민주주의 실현을 위한 정책 수립에 활용됩니다. 또한 제안사업별 이행 현황을 한눈에 파악할 수 있어 정책평가와 예산분석의 기초자료로 유용합니다. 정보는 국민참여예산 누리집(https://www.mybudget.go.kr/budgetBsnsInfo/executionResultList)을 통해 제공되며, 행정자료 및 연구 목적으로도 활용 가능한 공공데이터입니다.
