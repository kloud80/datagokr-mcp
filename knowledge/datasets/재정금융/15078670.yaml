description_portal: 주민 1인당 또는 세대 당 부담된 지방세액(시도명,시군구명,자치단체코드,과세년도,주민1인당 부담금액, 세대당부담금액,지방세 금액,인구수,세대수)지방자치단체별로 주민 1인당 연도별 지방세 납부 총액을 산정한 자료입니다. 이 데이터는 인구 대비 세금 부담 수준을 평가할 수 있어, 재정 형평성 비교, 세정 정책 효과 분석, 민원 안내자료 및 세수 예측 등에 활용될 수 있습니다.분석 대상 지자체가 많거나 연도별 통계가 포함된 경우, 엑셀이나 일반 뷰어에서 일부만 표시될 수 있으므로 R, Python, GIS 등 분석 전용 도구 활용을 권장합니다.계산 기준일(인구 기준 시점), 세목 포함 범위, 환산 방식(평균값·중위값), 개인·법인 여부 분리 등 세부 정의는 해당 메타데이터나 기술문서를 참조하시기 바랍니다.
