description_portal: 이 데이터는 K‑SURE에서 신용등급을 평가한 국외 기업 중 신용불량(R급)으로 분류된 기업의 비율을 국가별로 집계한 ’신용위험지수 (Market Credit Risk Index)’ 자료입니다. 지수는 전체 평가건(A~G, R급)에 대한 R급 비율로 계산되며, 지수가 높을수록 해당 국가와의 거래 시 수출대금 미회수 위험이 높다는 것을 의미합니다. 수입자가 R급으로 평가되는 사유는 경제제재, 파산, 무역보험 사고 등 다양한 원인있으며, 2024년 R급 기업의 약 70.2%가 경제제재로 인한 것임을 확인할 수 있습니다.
