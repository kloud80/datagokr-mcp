description_portal: 그린본드 현황은 친환경 사업 추진을 위한 자금 조달 수단인 그린본드의 발행 현황을 정리한 자료입니다. 공모사채와 글로벌본드 형태로 발행된 채권의 명칭, 발행 금액, 적용 금리, 발행 연월과 만기 시점, 그리고 실제 집행 여부 등을 포함하고 있습니다. 이를 통해 투자자와 시민은 재생에너지 확대, 온실가스 감축, 친환경 발전설비 확충 등과 같은 지속가능한 프로젝트에 투입되는 자금 규모와 조건을 한눈에 파악할 수 있습니다. 또한 발행 채권의 집행 현황을 통해 계획된 사업이 실제로 얼마나 실행되고 있는지 확인할 수 있어 투명한 공공재정 운영에 기여합니다. 본 데이터는 연구자, 정책 담당자, 금융기관, 일반 시민까지 누구나 활용할 수 있으며, ESG 경영, 녹색 금융 동향, 친환경 투자 전략 수립 등에 유용한 분석 자료로 활용될 수 있습니다.
