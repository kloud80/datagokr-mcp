summary_user: 관세청 수출입 신고 자료를 전국 시도 단위·기간별로 집계한 무역통계로, 시도별 수출·수입 건수와 금액(달러), 무역수지를 담는다. 지자체 담당자나 지역경제 분석가가 '우리 시도의 월별 수출액과 무역수지가 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 통계와는 시도명(sidoNm)과 기간을 이름으로 맞춰 연결해야 하며, 같은 관세청의 품목·국가·시군구별 수출입실적과 함께 보면 지역 무역 구조를 더 세분해 볼 수 있다.
