description_portal: 지방세 부과액에 대한 세목별 징수현황을 제공지자체의 재정자주도·재정자립도 산출하는 기초 및 납세 협력도 및 조세 순응도를 확인하는 자료로 활용대전광역시 서구의 지방세 징수현황은 공공데이터포털을 통해 제공되는 자료로, 해당 지자체의 세수 운영 현황을 세목별로 상세히 파악할 수 있는 중요한 통계입니다. 이 데이터는 대전광역시 서구청 세정과에서 관리하며, 매년 12월 31일 기준으로 업데이트됩니다. 파일 형식은 CSV, XML, JSON 등 다양한 형태로 제공되어 활용이 용이합니다. 데이터 구성 및 활용 목적지방세 부과액에 대한 세목별 징수현황을 담고 있습니다. 이를 통해 지자체의 재정자주도 및 재정자립도를 산출하는 기초 자료로 활용되며, 납세 협력도 및 조세 순응도를 확인하는 데에도 유용합니다. 또한, 전자송달 시장 규모 및 편익 분석, 수수료 산정 시 기초자료로 활용될 수 있습니다.공공데이터 포털공공데이터 포털제공 형식 및 접근 방법공공데이터포털(https://www.data.go.kr)에서 "대전광역시 서구_지방세 징수현황"을 검색하면 해당 데이터를 다운로드할 수 있습니다. 파일은 CSV 형식으로 제공되며, 전체 행 수는 13행으로 구성되어 있습니다. 또한, XML 및 JSON 형식으로도 제공되어 다양한 시스템과의 연동이 가능합니다.
