description_portal: '- 전라남도 내 22개 기초자치단체(시군)에 배분된 최근 년도(2018년~2025년) 특별조정교부금에 대해 조회하실 수 있습니다.- 전라남도 특별조정교부금은 지방자치단체의 재정자립도를 고려하여, 재정이 열악한 지역에 재정 지원을 통해 균형 발전을 도모하는 제도입니다. 이는 국가가 지방자치단체에 직접 교부하는 재정 지원금으로, 재정자립도가 낮은 지역에 우선적으로 지원됩니다.- 전라남도는 재정자립도가 낮은 지역 중 하나로, 특별조정교부금을 활용하여 다양한 지역 개발 사업을 추진하고 있습니다. 예를 들어, 도로 확장, 공공시설 건설, 복지시설 확충 등 다양한 분야에 교부금을 활용하여 지역 발전을 도모하고 있습니다.'
