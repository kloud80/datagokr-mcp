description_portal: ㅇ K-IFRS회계기준 적용(2022년 결산 시 부터 ifrs17 보험회계기준 적용하였으며, 이전은 ifrs4 회계기준을 적용)ㅇ 백만원 단위를 기준으로 반올림하였으며 자산총계, 부채총계, 자본총계 기준으로 하위 계정과목의 단수차이 조정- 금융자산은 공정가치측정 금융자산, 상각 후 원가 측정 유가증권 등을 포함- IFRS17 보험부채는 잔여보장요소 및 발생사고요소로 구성되어있으며, 해당 부채는 계리적가정을 이용한 정상, 사고 계약의 예상 순 현금흐름의 현재가치 만큼을 적립  ㅇ 부채비율은 재무구조를 측정하는 대표적인 재무지표 중 하나로써, 타인의 자본과 자신의 자본에 대한 관계를 나타내는 비율이며, (부채총계 / 자산총계) * 100 으로 계산
