description_portal: 경기도 하남시의  일반회계 세외수입 현황 데이터는  회계연도,  장, 관, 항 징수결정액, 수납액, 과오납환부액, 미수납액 항목으로 구성되어 있습니다.이 데이터를 통해 일반회계 세외수입 현황을 체계적으로 확인할 수 있도록 제공됩니다. 이를 통해 특정 연도의 세외수입 변동 추이를 파악하거나 자치단체별 재정 특성을 비교·분석할 수 있으며, 회계 구분별 세부 자료를 행정업무 및 연구에 활용할 수 있습니다. 행정의 투명성과 재정운영 신뢰성을 높이고 정책 수립과 평가, 데이터 기반 행정 고도화 등 다양한 분야에서 활용 가능한 기초 자료입니다. (데이터 컬럼 안내)- 데이터 컬럼 중 항목은 세외수입의 목별 구분을 나타내며, 경상적수입(재산임대수입, 사용료수입,수수료수입, 사업수입, 징수교부금수입, 이자수입), 임시적세외수입(보조금반환수입, 기타수입, 지난년도수입 등), 지방행정제재부과금(과태료 등)으로 구분하여 표기하고 있습니다.
