summary_user: 경기도 내 자치단체별로 과세연도·세목·납세자유형·관내외 여부에 따른 지방세 납세자 수를 집계한 통계로, 범위는 시도 단위이며 공간정보는 없다. 지방세 정책 담당자나 분석가가 '우리 시군의 재산세 납세자 중 관외 거주자가 연도별로 얼마나 늘었나' 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 시도·시군구 이름이나 자치단체코드(sfrnd_cd)를 행정구역 코드에 매핑해 다른 시도·시군구 지역 지표와 잇는다.
description_portal: 이 데이터는 경기도 내 지방세 납세자 현황을 정리한 통계자료로, 자치단체별 납세자 수의 변화 추이를 파악할 수 있는 정보를 제공합니다. 주요 항목은 시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 납세자유형, 관내·관외 여부, 그리고 납세자 수로 구성되어 있습니다. 이 데이터를 활용하면 특정 세목에 대한 납세 규모나 지역별 납세자 분포, 연도별 납세 변화 경향 등을 분석할 수 있으며, 자치단체 세수 기반 강화, 조세정책 설계, 세정 운영 전략 수립 등에 참고 자료로 활용됩니다. 특히 납세자유형과 세목별 세수 구성의 관계를 분석하면, 경제활동 유형별 조세기여도를 평가하는 데 유용합니다.
