description_portal: 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주헬스케어타운 조성사업의 시설 및 용도, 면적 등에 관한 상세내역입니다. 이 데이터는 2016년 4월을 기준으로 작성되었으며, 각 항목은 분류, 구분, 면적(㎡), 건축면적(㎡), 지하층 포함 면적, 지하층 제외 면적, 건폐율(%), 용적률(%), 높이(층수), 건축물용도, 객실수 등으로 구성되어 있습니다. 분류 항목은 공공편익시설, 숙박시설, 근린생활시설 등 다양한 용도별 시설로 나뉘어 있으며, 구분은 각 분류 내 세부 시설 또는 공간 유형을 의미합니다. 면적과 건축면적은 각각 대지와 건물의 실제 면적을 나타내며, 지하층 포함 및 제외 면적은 지하 공간의 유무와 규모를 구분해 건물 전체 규모를 세밀하게 파악할 수 있게 합니다. 건폐율과 용적률은 건축물의 부지 대비 건축 면적 비율과 용적률을 의미하며, 건축물의 밀도와 공간 활용도를 나타냅니다. 높이(층수)는 건물의 층수 정보를 제공하여 건축물의 물리적 높이를 확인할 수 있고, 건축물용도 항목은 시설의 기능적 목적을 명확히 구분합니다. 객실수는 숙박시설 등에서 제공되는 객실 수를 나타내어 해당 시설의 수용 능력을 알 수 있습니다. 이 데이터는 헬스케어타운의 시설 운영, 도시계획, 건축 설계, 용도 배치, 향후 시설 확장 및 관리에 중요한 기초 자료로 활용될 수 있습니다.
