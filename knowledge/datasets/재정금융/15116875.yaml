description_portal: '한국무역보험공사의 단기수출보험, 중장기수출보험, 보증보험 및 신용보증 종목의 월별 익스포져 현황을 나타낸 데이터입니다.<종목별 설명>- 단기 : 외상 수출 후 수출대금을 회수하지 못하는 경우의 손실을 보상, 결제기간 2년 이내의 수출거래 대상- 중장기 : 중장기 수출거래에서 금융기관의 대출원리금 회수불능 위험 등을 담보하는 제도, 결제기간 2년 초과 수출거래 대상- 수출보증보험 : 금융기관이 보증서 발행 후 수입자로부터 보증채무 이행청구를 받아 이행함으로써 입게 되는 손실을 보상하는 제도- 신용보증 : 중소·중견기업이 선적 이전 물품을 제조, 가공, 조달할 수 있도록 은행으로부터 자금을 대출받거나, 수출이행서류를 근거로 은행으로부터 매입외환 대출을 받을 수 있도록 보증하는 제도'
