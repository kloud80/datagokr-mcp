summary_user: 상장법인 주식의 권리행사 일정(배당·무상증자·유상증자·주식교환·감자 등)을 사유별로 건별 담은 API로, 2010년부터 전국 약 125만 건 규모이며 권리행사 시작·종료일, 결산월일, 명부폐쇄 기간을 포함한다. 주주나 분석가가 특정 종목의 배당·증자 관련 권리행사 기간과 명부폐쇄 기간이 언제인지 확인하는 데 쓴다. 법인등록번호(crno)로 기업 공시·재무 데이터와 이어 쓰고, 같은 증권 시장 부문의 종목코드 원장·일별 시세와도 연결해 본다.
description_portal: '주식권리일정정보는 상장법인의 주식과 관련된 권리행사 일정 정보를 제공하는 데이터입니다.주주에게 추가적인 주식 배정, 현금 배당 지급, 주식 수 변화 등의 영향을 줄 수 있는 배당, 무상증자, 유상증자, 주식교환, 감자 등 다양한 권리행사를 사유별로 권리일, 기준일, 지급일 등의 세부 일정을 조회할 수 있습니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 권리행사사유별일정조회 : 기준일자, 발행회사한국예탁결제원고객번호, 주식발행회사명을 통하여 권리행사시작일자, 권리행사종료일자, 주식결산월일, 명부폐쇄시작일자, 명부폐쇄종료일자 등을 조회하는 권리행사사유별일정조회 기능※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
