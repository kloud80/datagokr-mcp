description_portal: 경상북도가 도내 시·군에 교부한 조정교부금의 연도별 예산 및 결산 현황을 제공하는 자료입니다. 조정교부금은 지방 간 재정 불균형을 완화하고 균형 발전을 도모하기 위해 광역자치단체가 기초자치단체에 배분하는 재정 자금입니다. 본 자료는 연도별 조정교부금의 예산 편성액과 실제 결산액을 비교할 수 있도록 구성되어 있으며, 교부 대상 시·군, 교부 기준, 재원 구성 등의 정보를 포함하고 있습니다. 이를 통해 사용자는 경상북도 내 조정교부금의 배분 추이와 지역 간 재정 흐름을 파악할 수 있습니다. 또한, 지방재정의 정책 방향 및 운용 실태를 이해하고자 하는 연구자, 공무원, 정책 수립자에게 유용한 자료입니다. 해당년도 교부금(일반조정교부금,특별조정교부금), 예산액,결산액, 시군별, 집행잔액, 합계 등의 정보를 제공합니다.
