description_portal: 본 데이터는 지방세 체납 규모를 금액 구간별로 구분하여 체납 발생 현황과 누적 체납 추이를 체계적으로 제공하기 위한 자료이다. 제공 항목은 체납액구간, 체납건수, 체납금액, 누적체납금액, 누적체납건수로 구성되며, 이를 통해 체납 규모별 분포와 전체 체납 누적 수준을 종합적으로 파악할 수 있다. 체납액구간은 일정 금액 단위별로 체납자를 분류한 항목으로, 소액 체납부터 고액 체납까지 구간별 현황을 확인할 수 있도록 구성된다. 체납건수는 해당 구간에 속하는 체납 발생 건수를 의미하며, 체납금액은 해당 구간의 체납 세액 합계를 나타낸다. 누적체납금액과 누적체납건수는 기준시점까지의 전체 체납 누계 현황을 보여주는 지표로서, 지방세 징수 실적, 체납관리 수준, 고액·상습 체납 비중 등을 분석하는 데 활용될 수 있다. 본 자료는 지방세 세입 확보를 위한 징수정책 수립, 체납 정리계획 마련, 체납 유형별 대응전략 수립, 재정건전성 점검 및 세정 운영 효율화의 기초자료로 활용될 수 있다. 다만 자료는 기준시점에 집계된 행정자료이므로 납부, 결손처분, 징수유예, 체납정리 등의 사유에 따라 이후 수치가 변동될 수 있다.
