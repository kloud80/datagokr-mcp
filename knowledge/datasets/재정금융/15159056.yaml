description_portal: 부산광역시 연제구에서 제공하는 "지방세 세목별 비과세 감면현황" 데이터는 세목명, 비과세감면 근거가 되는 법령, 비과세감면 건수 및 세액 등으로 항목이 구성되어 있습니다. 해당 데이터를 통해 세목별 비과세 감면 현황, 근거 법령에 따른 비과세 감면 건수 및 세액 또한 확인할 수 있습니다. 비과세액은 법률이나 조례에 따라 세금을 아예 부과하지 않는 금액이며, 감면액은 부과된 세금에서 일정 부분을 경감해주는 금액을 뜻합니다. 비과세감면율 현황은 부과금액 중에서 비과세액과 감면세액이 차지하는 비중으로 확인할 수 있습니다. 비과세감면의 근거가 되는 법령별 현황을 확인할 수 있다는 점에서 기존에 제공된 "지방세비과감면율현황" 데이터와 차이가 있습니다.
