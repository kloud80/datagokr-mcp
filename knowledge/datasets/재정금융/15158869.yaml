description_portal: 특송업체란 관세법 제222조제1항제6호에 따라 세관장에게 등록한 탁송품 운송업자를 말함특송업체부호란 관세법  제222조제1항제6호와 특송물품 수입통관 사무처리에 관한 고시에 따라 특송업체로 등록신청한 업체에 부여한 6자리 부호임본 서비스는 특송업체부호를 이용하여 세관에서 관리하고 있는 특송업체명을 조회 할 수 있는 서비스임특송업체는 자본금 3억원 이상의 법인으로서 항공사업법에 따른 상업서류송달업의 신고를 필한 자(국제무역기를 이용하는 업체), 관세법에 따른 화물운송주선업자의 등록을 필한 자(국제무역기 또는 국제무역선을 이용하는 업체)로 세관장에 등록한 탁송품 운송업자임
