description_portal: 민원인의 요청에 따라 제공되는 일회성 데이터입니다.충청북도 보은군의 2013~2024년도 지방세 비과세 감면율 현황(연도별, 과세유형별, 법적 근거별)을 다음과 같이 제공하고자 합니다.지방세 비과세 및 감면 현황을 과세연도별, 감면 구분별로 정리하여 지방세 비과세·감면 건수 및 세액을 합계와 법적 근거별로 제공합니다. 법적 근거는 지방세법, 지방세특례제한법, 감면조례, 조세특례제한법, 기타로 구분되며, 각 항목별 건수와 세액을 확인할 수 있습니다. 이 데이터는 보은군의 지방세 비과세 및 감면 운영 현황을 파악하고, 연도별 변화 추이 및 제도별 감면 규모를 분석하는 데 활용할 수 있습니다. 충청북도 보은군의 지방세 비과세감면율 현황 데이터와 관련된 기타 문의사항은 보은군청 재무과  세정팀(043-540-3142)로 연락하여 주시기 바랍니다.
