description_portal: 경기도 양주시_지방재정시스템_세목별수납일계내역 데이터는 양주시에서 발생하는 세입 현황을 세목별로 집계하여 제공한다. 주요 항목은 자치단체, 거래일자, 세목코드, 세목명, 건수, 입금액, 본세, 도시계획세, 공동시설세, 지방교육세, 관리부서명 등으로 구성되어 있으며, 총 5,318행의 데이터가 수록되어 있다. 예를 들어, 특정 세목의 일별 수납 건수와 금액이 기록되어 있어 세입 구조를 상세히 분석할 수 있다. 또한 본세와 부가세 항목(도시계획세, 공동시설세, 지방교육세 등)을 함께 제공함으로써 세금의 징수 내역을 종합적으로 파악할 수 있다. 이 데이터는 양주시의 재정 건전성 평가, 세입 추세 분석, 예산 수립 및 재정 운영 전략 마련에 유용하다. 특히 시간 단위로 누적된 세목별 세입 내역을 확인할 수 있어, 특정 기간별 세입 변화나 세목별 비중을 분석하는 데 활용할 수 있다. 더 나아가 다른 재정 데이터와 연계하면 양주시 재정의 투명성과 효율성을 높이는 기반 자료로서 중요한 의미를 가진다.
