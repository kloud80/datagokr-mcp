description_portal: '중소벤처기업진흥공단이 지원하는 기술혁신형-재창업자금의 지원현황을 개방하여, 중소기업이 기술혁신형재창업자금 신청 시 활용할 수 있도록 개방하는 것을 목적으로 두고 있습니다.기술혁신형재창업자금 지원 대상은 다음과 같습니다- 정부R&D사업 참여, 재도전성공패키지 참여, 재도전펀드를 투자받은 재창업자, 특허/실용신안 보유, 혁신성장분야 업종 영위자, 소재/부품 산업 업종 영위자세부내용은 다음과 같습니다.- 지역: 광역지자체 기준으로 대출 실행건 별 추출하였습니다.- 대출일자: 2020년부터 데이터 현행화에 따른 2024년 자료까지, 대출 실행분의 누적 데이터입니다.- 업력: 실행금액을 나타내며, 단위는 백만 원입니다.- 업종: 대출 업체의 업종을 나타냅니다.- 산업분류코드명: 대출 업체의 업종과 관련하여, 통계청 산업분류코드명을 나타냅니다.'
