description_portal: 이 데이터는 대구광역시에서 활용하는 주민참여예산정보시스템에 실려 있는 분과별 유형과 관련한 정보들을 담고 있습니다. 분과는 총 6개 분과로 구성되어 있으며 각각 경제도시분과, 복지안전분과, 문화체육관광분과, 환경수자원분과, 교통분과 그리고 청년분과로 구성되어 있습니다. 각 분과에 대한 정보들 일체가 담겨 있으며, 분과 마다 코드로 연결이 되어 있습니다. 이를 통하여 데이터 시스템에서도 분과에 대한 정보들을 보다 쉽게 파악할 수 있도록 구성되었으며, 향후 주민참여예산시스템에 나오는 분과와도 연계가 됩니다.
