description_portal: 본 데이터는 지방자치단체의 지방세 부과금액 중 비과세금액과 감면금액이 차지하는 수준을 정량적으로 파악할 수 있도록 제공하는 자료이다. 제공 항목은 비과세금액, 감면금액, 부과금액, 비과세감면율로 구성되며, 이를 통해 지방세 세원 중 실제 과세되지 않거나 법령상 경감된 규모를 확인할 수 있다. 비과세금액은 지방세법 등 관계 법령에 따라 과세대상에서 제외된 금액을 의미하고, 감면금액은 정책적 지원, 공익 목적, 산업 육성, 서민 보호 등의 사유로 법령에 따라 경감 또는 면제된 세액을 뜻한다. 부과금액은 해당 기준시점에 지방자치단체가 부과한 지방세 총액을 의미하며, 비과세감면율은 부과금액 대비 비과세금액과 감면금액이 차지하는 비율을 나타내는 지표이다. 본 자료는 지방세 비과세·감면 운영 규모와 조세지원 수준을 파악하고, 세수 구조 분석, 지방재정 운용 검토, 세제 운영의 형평성 분석 및 정책 수립의 기초자료로 활용될 수 있다. 다만 자료는 기준시점에 집계된 행정자료이므로 이후 경정, 조정, 추가 부과 등에 따라 실제 값과 차이가 발생할 수 있다.
