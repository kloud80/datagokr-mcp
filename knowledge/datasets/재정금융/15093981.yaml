description_portal: 2012년부터 2025년까지 국가예산  자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.**2022년부터는 국가재정운용계획 기준입니다.1. 이 통계집에 수록된 자료는 2018년까지는 결산, 2019, 2020년은 본예산을 기준으로 작성하였으며, 이에 의하지 않는 것은 그 기준을 “주”에 별도 표시하였습니다.2. 이 통계집에 수록된 자료는 총수입·총지출을 기준으로 작성하였으며, 총계, 통합재정 등 작성기준이 다를 경우 그 기준과 출처를 “주”에 별도 표시하였습니다.3. 이 통계집의 재정통계는 디지털예산회계시스템에 수록되어 있는 예·결산 자료를 바탕으로 한 것이며, 출처가 디지털예산회계시스템이 아닌 경우에는 그 출처를 “주”에 별도 표시하였습니다.4. 국제통계는 OECD의 Government at a Glance , IMF의 Government Financial Statistics 를 이용했으며, IMF 등 타 기관이 발표한 자료는 그 출처를 “주”에 별도로 표기하였습니다. OECD자료는 주요 재정통계 발간 후 변경될 수 있어, 이용시 주의할 필요가 있습니다.5. 모든 통계는 합계 또는 소계가 반올림되었으므로 세부 항목의 합계가 총계와 일치하지 않는 경우가 있습니다.
