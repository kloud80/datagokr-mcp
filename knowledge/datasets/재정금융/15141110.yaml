description_portal: '은평구의 담배를 매입하여 다른 도매업자 또는 소매인에게 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 담배 제조업체로부터 담배를 구입하여 편의점, 마트 등 소매인에게 공급하는 도매업체의 인허가 현황을 담고 있습니다 . 데이터에는 각 도매업체의 상호명, 주소, 최초 등록일, 현재 영업 상태(영업중, 폐업 등)와 같은 담배 유통망 관리의 핵심 정보가 포함되어 있습니다 .이 데이터는 담배라는 특수 기호품의 유통 과정을 투명하게 관리하고, 세금 징수 및 국민 건강 증진 정책을 효율적으로 시행하기 위한 기초 자료로 활용됩니다. 특히, 최근에는 궐련형, 액상형 등 전자담배의 종류가 다양해지고 유통 채널 또한 온라인, 무인점포 등으로 확대되면서 , 합법적인 유통망을 파악하고 관리하는 것이 더욱 중요해졌습니다 . 지자체는 이 데이터를 기반으로 불법적인 담배 유통을 막고, 청소년 보호 등 관련 법규 준수 여부를 감독하는 데 활용합니다.'
