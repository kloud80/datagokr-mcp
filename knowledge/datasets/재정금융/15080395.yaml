description_portal: '이 데이터는 경기도 안양시의 연도별 지방세 과세 및 비과세 현황을 세목별로 구분하여 제공하는 자료입니다.주요 세목(재산세, 자동차세, 주민세 등)에 대해 과세 건수, 과세 금액, 비과세 건수, 비과세 금액 등을 포함하고 있어, 지방세 정책 수립, 조세 혜택 분석, 재정 자립도 평가 등에 활용됩니다.- 주요 항목: 과세년도, 세목명, 과세건수, 과세금액, 비과세건수, 비과세금액- 활용 예시:- 지방세 징수 전략 수립- 비과세·감면 정책 효과 분석- 시민 조세 혜택 규모 파악- 지자체 재정자립도 및 납세 순응도 평가 이는 국민의 조세 혜택 규모를 명확히 파악하고, 지방세 감면 정책의 효과성을 심층적으로 분석하며, 미래 세수를 보다 정확하게 예측하는 데 활용될 목적으로 수집되었습니다. 세부 항목은 취득세, 등록면허세, 재산세 등 주요 지방세 세목별로 부과된 과세액, 면제된 비과세액, 실제 감면된 금액, 그리고 해당 건수 등으로 다각적으로 구성됩니다. 이 자료는 투명하고 효율적인 지방세정 운영을 지원하며, 시민들에게 합리적이고 신뢰성 있는 조세 정책 정보를 제공하는 데 크게 기여할 것으로 기대됩니다.'
