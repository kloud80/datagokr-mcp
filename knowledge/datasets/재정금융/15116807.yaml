description_portal: 항공수입 운송비용 통계는 기업이 세관에 수입 신고하는 과정에서 생산된 운임정보를 화물정보와 연계하여 항공수입 kg당 평균 운송비용을 산출·공표하는 통계자료로서, 수출입 기업, 물류업계 등에서 참고자료로 활용 가능. 공표주기 1개월, 매월 15일경 수출입 신고의 정정, 취하 등 변경내역을 반영하여 전월까지의 자료를 현행화통계제공 기준 중 항로는 주요 교역 대상국 중 미국, EU 등 원거리 지역과 중국 베트남 일본 등 인접국 간의 항로로 공항 단위가 아닌 국가·지역 단위임- 정형거래조건인 FOB(Free On Board) 조건으로 수입신고 건으로 인천공항 도착 건(실제 항공운송 계약을 통한 운임이 아닌 별도 운임표를 적용하여 신고하는 등의 수입건( 특송, 우편, 항공사 자기 운송수단 수입, 자력운항 항공기, 기타 특수조건 수입(무상견품‧광고용품으로서 20만원 이하 수입물품, 계약위반‧하자보증을 위한 무상 수입물품, 여행자 휴대품, 선‧기용품 등))은 통계산출에서 제외)단위는 원(KRW)/킬로그램(KG)
