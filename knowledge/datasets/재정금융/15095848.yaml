description_portal: 부처별 예산현황은 정부가 매년 편성·제출하고 국회가 의결한 국가 예산 중, 부처별 세출예산 금액을 집계·제공하는 재정 통계 자료입니다.(정부안과 국회 확정 금액을 비교할 수 있으며, 각 부처별 예산 규모와 비중을 한눈에 파악할 수 있도록 구성되어 있습니다.)정부는 헌법 및 국가재정법에 따라 회계연도 개시 120일 전까지 예산안을 편성하고, 회계연도 개시 90일 전까지 국회에 제출해야 하며, 국회는 회계연도 개시 30일 전까지 이를 심의·의결합니다1. 데이터 범위   * 연도별 부처별 세출예산 현황   * 부처명, 예산구분, 세출예산 금액 등2. 주요 제공 내용   * 각 부처별 총 세출예산 금액   * 부처별 예산의 비중 분석 가능 (총예산 대비 비율 제공)3. 활용 예시   * 부처별 재정투자 우선순위 분석   * 국회 심의로 인한 부처별 예산 증감 내역 파악   * 특정 정책 분야별 예산 집중도 분석   * 재정운용 전략 수립 및 정책 효과 분석 자료로 활용4. 데이터 특징   * 매우 상세한 단위(백만 원)로 제공되어 정밀 분석 가능   * 부처별 예산 변화 추이를 연도별로 시계열 분석 가능   * 국회 심의 과정에서 변동된 예산 항목 분석 가능5. 제공 형식 및 접근 방법   * CSV, XLSX 등 다양한 파일 형식으로 다운로드 가능   * 시각화 그래프 및 표 제공   * Open API 제공 (연도, 부처, 예산구분 등 조건별 상세 조회 지원)본 자료는 정부의 부처별 예산 편성과 집행 내역을 투명하게 공개하여 국민의 알권리를 충족시키고, 연구기관·언론·일반 국민이 재정 분석, 정책 효과 평가, 재정운용 전략 수립 등에 폭넓게 활용할 수 있는 중요한 재정정보입니다.
