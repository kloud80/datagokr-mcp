summary_user: KOTRA가 펴낸 국별 진출 전략 보고서, 상담 사례집, 성과보고서, 디렉토리 등 발간물을 한 건씩 담은 목록 파일(CSV, 약 47KB)로, 서명·발간년도·발간부서·종류·발간자료번호를 담는다. 수출을 준비하는 기업이나 연구자가 "특정 국가·산업에 대해 KOTRA가 최근 어떤 보고서를 냈는가"를 발간년도·발간부서·종류로 찾아볼 때 쓴다. 발간자료번호(kotra_pub_no)가 조인 키로 확인됐으나 이 번호를 공유하는 다른 데이터셋은 입력에 없으며, 국가·품목 코드가 없어 수출입 실적 같은 통계와 바로 잇기는 어렵다.
description_portal: KOTRA에서 공공데이터포털에 제공하는 발간자료 목록 데이터는 KOTRA가 발행한 다양한 국별 진출 전략 보고서, 상담 사례집, 성과보고서, 디렉토리 등 발간물 목록을 제공하는 데이터입니다. 이 자료들은 한국 기업들이 해외 진출, 수출 마케팅, 산업 동향 등에 대한 정보를 얻을 수 있는 중요한 참고 자료로 활용됩니다. 기업들은 발간자료를 저자, 발행년도, 발행처 등을 기준으로 필터링하여 필요한 자료를 쉽게 찾을 수 있습니다. 또한, 이 데이터를 통해 기업들은 해외 진출 및 수출 확대를 위한 효과적인 전략을 세울 수 있도록 지원합니다.
