description_portal: 신용카드,가상계좌 등 지방세 납부매체별 납부 현황(시도명,시군구명,자치단체코드,납부년도,세목명,납부매체,납부매체전자고지여부,납부건수,납부금액,납부매체비율) 데이터입니다. 지방세는 지방자치단체가 주민의 복지와 지역개발을 위해 직접 부과 및 징수하는 조세로 지방자치의 재정 기반을 구성하는 핵심입니다. 지방세는 지역 발전의 초석이자 주민복지 실현의 기본 재원으로 높은 납부율과 편리한 납부 수단의 정책은 성숙한 납세 문화를 반영하며, 앞으로도 지속적인 행정 혁신과 납세자 중심 서비스 확대가 중요합니다.
