description_portal: '단기금융증권발행정보는 기준일자와 발행기관(법인등록번호 등)을 기준으로 단기금융상품의 발행 현황을 종합적으로 제공하는 데이터입니다.<데이터 조회 시 유의사항>파라미터 없이 조회 시 데이터 조회 시간이 오래걸려 timeout이 발생하게 되어 필수 파라미터를 지정하였습니다.- 파라미터 조건 : 조회 시 아래의 필수 파라미터 중 최소 1개 이상을 반드시 입력해야 합니다.- 기본값 안내 : 필수 파라미터를 입력하지 않은 경우, 기준일자(basDt)는 자동으로 가장 최신 날짜로 설정되어 조회됩니다.[서비스별 필수 파라미터 목록]- 단기기업어음발행기본정보조회, ABCP발행기본정보조회 : basDt- 전자단기사채발행기본정보조회 : basDt, isinCd, crno- 발행자별단기금융증권현황_만기별발행잔액조회 : basDt, stfsExprDt, crno- CD발행정보, 발행자별단기금융증권현황_월별만기금액조회, 발행자유형별발행잔액, 종류별발행잔액, 발행금리조회 : 없음총 9개의 오퍼레이션을 통해 단기금융증권의 발행현황을 다양한 관점에서 조회할 수 있으며, 상세 내역은 다음과 같습니다.1. 단기기업어음 발행 기본 정보: 기준일자, 법인등록번호, CP발행회사명을 통하여 어음종류코드, CP발행일자, CP할인기관명, CP지급은행지점코드등을 조회하는 단기기업어음발행기본정보조회 기능2. CD 발행 정보: 기준일자, 유가증권구분코드명을 통하여 CD액면가, CD잔존일수, CD지급은행명, CD등록일자등을 조회하는 CD발행기본정보조회 기능3. 전자단기사채 발행 기본 정보 : 기준일자, 단기금융상품구분코드명을 통하여 전자단기사채발행일자, 전자단기사채모집방법코드, 전자단기사채발행금액등을 조회하는 전자단기사채발행기본정보조회 기능4. ABCP발행 기본정보 : 기준일자, 법인등록번호, ABCP발행회사명을 통하여 ABCP발행일자, ABCP만기일자, ABCP상환일자, ABCP발행금액등을 조회하는 ABCP발행기본정보조회 기능5. 발행자별 단기 금융증권 현황(만기별 발행잔액) : 기준일자, 법인등록번호, 단기금융증권발행인명을 통하여 단기금융증권만기일자, 단기금융증권만기종목수, 단기금융증권만기금액등을 조회하는 발행자별단기금융증권현황_만기별발행잔액조회 기능6. 발행자별 단기 금융증권 현황(월별만기금액) : 기준년월, 유가증권구분코드명을 통하여 유가증권쿠분코드, 단기금융증권발행금액을 조회하는 발행자별단기금융증권현황_월별만기금액조회 기능7. 발행자유형별 발행잔액 : 기준일자, 유가증권구분코드명을 통하여 발행인유형명, 유가증권발행통화코드, 단기상품잔존만기잔액등을 조회하는 발행자유형별발행잔액조회 기능8. 종류별 발행 잔액 : 기준일자, 유가증권구분코드명, 표준산업분류명을 통하여 유가증권구분코드, 신용등급발행인수, 신용등급발행금액을 조회하는 종류별발행잔액조회 기능9. 발행 금리 : 기준일자, 단기금융상품구분코드명을 통하여 통화코드, 발행인유형명, 발행금리, 단기금융증권발행금액등을 조회하는 발행금리조회 기능※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)** 유의사항본 개방데이터는 공공누리 2유형임을 참고하시기 바랍니다.이용허락범위 제2유형 : 출처표시 + 상업적 이용금지해당 데이터를 상업적으로 활용하고자 하는 이용자는 데이터 원천 소유자인 한국예탁결제원과 사용 목적과 범위에 따른 정보이용계약이 필요합니다. 정보이용계약 또는 해당 정보에 관하여 궁금한 점이 있으시면 한국예탁결제원 증권정보부(연락처: portal@ksd.or.kr)로 이메일 문의 주시기 바랍니다.'
