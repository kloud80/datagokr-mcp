summary_user: 신용보증기금이 업무 데이터베이스에서 개인정보를 뺀 채권관리 원천 데이터를 채권관리ID·일련번호 단위의 건별 행으로 담으며, 당초보증일자·보증기한·원장보증금액·보증잔액·주채무잔액·보증비율·담보부 보증 여부 등을 포함하고 범위는 전국·비공간이다. 분석가가 신용보증 채권이 어떤 주채무 과목과 자금용도로 취급되며 보증잔액과 보증비율이 어떻게 분포하는지 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주채무과목명·보증상대처명 같은 이름 매핑이나 같은 기관(신용보증기금) 데이터의 코드로만 연결한다.
description_portal: 신용보증기금의 채권관리 관련 일반 현황 데이터입니다.(업무 데이터베이스에서 개인정보 등을 제외한 공개 가능한 원천 데이터를 추출) 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
