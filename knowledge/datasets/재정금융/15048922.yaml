description_portal: '이 데이터는 기술보증기금이 보유한 사고원인 및 대출종류별 보증사고 현황을 정리한 자료로, 연도·분기별로 어떤 사고원인과 어떤 보증종류에서 법인·개인 보증사고가 얼마나 발생했는지를 보여주는 데이터입니다.각 행은 특정 연도·분기(예: 2015년1분기)에 특정 사고원인(예: 원금연체, 이자연체 등)과 보증종류(대출보증, 비은행대출보증, 기타 조합)별로 집계된 사고 실적을 나타냄. 이를 통해 어떤 사고 원인이 주요하게 발생하는지, 사고가 주로 발생하는 보증종류가 무엇인지, 그리고 법인과 개인 중 어느 쪽에서 사고가 많이 발생하는지를 비교할 수 잇씁니다.주요 항목은 다음과 같습니다.연도구분: 사고원인 및 대출종류별 사고현황을 연도와 분기 단위로 구분한 값 (예: 2015년1분기). 사고원인: 보증사고가 발생한 원인을 구분한 항목으로, 원금연체, 이자연체 등 기금이 관리하는 사고 사유를 기준으로 분류한 값임.보증종류: 사고원인별 사고 현황을 보증상품 유형에 따라 나눈 값으로, 대출보증, 비은행대출보증, 기타 등으로 구분됨.법인사고건수: 해당 연도·분기·사고원인·보증종류 조합에서 발생한 법인 보증사고 건수.법인사고금액(억원): 위 조건에서 법인에게서 발생한 보증사고 금액을 억원 단위로 집계한 값.개인사고건수: 동일 조건에서 발생한 개인 보증사고 건수.개인사고금액(억원): 개인에게서 발생한 보증사고 금액(억원 단위)으로, 개인 부문 보증사고 부담 규모.'
