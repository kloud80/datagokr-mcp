description_portal: 체납차량은 자동차세, 과태료, 범칙금 등 각종 세금이나 공공요금을 납부하지 않아 체납 상태에 놓인 차량을 말합니다. 일정 기간 이상 체납이 지속되면 해당 차량에 대해 번호판 영치, 압류, 공매 등의 행정조치가 이루어질 수 있습니다. 특히 자동차세를 2회 이상 체납한 경우에는 번호판이 강제로 떼이거나 차량 운행이 제한되며, 장기체납 차량은 지방자치단체나 유관기관의 합동 단속 대상이 된다. 해당 데이터는 대구광역시 동구 연도별 체납차량 번호판 영치실적입니다. 이 데이터는 년도, 영치대수, 체납건수, 체납금액 항목을 포함합니다.
