description_portal: '금융투자협회기타공시정보는 금융투자협회에서 수집·제공하는 기타 공시 관련 정보를 제공하는 데이터입니다. 외국투자증권의 회사별 현황과 파생결합증권의 중도상환가격비율 정보를 중심으로 구성되어 있습니다.이 데이터는 2개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 외국투자증권 회사별 현황 조회 : 외국투자증권을 취급하는 각 회사의 상품 현황과 관련 정보를 제공합니다.② 파생결합증권 중도상환가격비율 조회 : 파생결합증권의 조기상환 기준 가격 비율 및 관련 상품정보를 조회합니다.'
