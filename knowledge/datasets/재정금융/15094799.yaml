summary_user: 금융투자협회가 수집한 기타 공시 중 외국투자증권의 판매사별 현황(기준일자, 펀드 수, 주식 좌수, 순자산가치를 전월·당월·증감으로 구분)과 파생결합증권 중도상환가격비율을 담는 전국 단위 API 데이터다. 투자자나 분석가가 '어느 판매사가 외국투자증권 펀드를 얼마나 취급하고 있고 전월 대비 어떻게 바뀌었나'를 확인하는 데 쓴다. 실측 컬럼에서 법인등록번호 같은 전역 조인 키가 확인되지 않아, 다른 기업 공시·재무 데이터와는 판매사 이름 매핑이나 기준일자로만 맞춰 이어 쓴다.
limits: 파생결합증권 중도상환가격비율 오퍼레이션은 최소 파라미터 호출에서 응답이 없어, 실제로 확인된 것은 2개 중 1개 오퍼레이션뿐이다. 기업 식별 코드가 없어 다른 기업 데이터와의 정확한 결합은 이름 매칭에 의존한다.
