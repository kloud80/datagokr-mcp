description_portal: '평소 성실하게 납세하였으나 재해, 일시적인 자금경색 등으로 경영에 어려움을 겪는 납세자를 지원하는 제도입니다. 국세 등의 징수를 일정기간 늦춰 자금 마련의 시간적 여유를 주어 납세자의 생활을 보호하고 국세의 원활한 징수를 도모함에 그 목적이 있습니다. 납기연장은 신고,납부기한 만료일 3일 전까지, 징수유예는 고지된 국세의 납부기한, 체납된 국세의 독촉기한 또는 최고기한 3일 전까지 신청해야 합니다.2025년 12월 31일 기준 6개 지방청별  시도별 납세유예(기한연장, 징수유예, 체납처분유예) 건수 및 금액 현황단위 : 건수, 백만원'
