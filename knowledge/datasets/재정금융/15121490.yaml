summary_user: 우리나라가 다른 나라와 맺은 조세조약(이중과세 방지 협약)을 상대 국가별 한 행으로 담은 전국 단위·비공간 파일로, 협약명·서명일자·발효일자·비고·기준일자가 들어 있습니다. 해외 진출 기업이나 세무 분석가가 '진출하려는 나라와 조세조약이 맺어져 있고 언제 발효됐는가'를 확인할 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 국가명을 이름으로 맞춰 이어 써야 하며, 세부 부문의 시도·시군구 지역 지표와는 연결 축이 없다.
description_portal: 국가 간 소득 및 자본에 대한 이중과세를 방지하고 탈세를 억제하기 위해 체결된 조세조약의 체결 현황을 제공합니다. 2026년 7월 20일 기준으로 조세조약을 체결한 국가, 체결일, 발효일, 공표일 등 주요 항목이 포함되어 있으며, 각국과의 협약 내용에 대한 개요도 확인할 수 있습니다. 조세조약은 상호 과세권 조정을 통해 조세의 중복 부과를 방지하고, 납세자의 이중과세 부담을 완화하며, 국제적 납세환경의 예측 가능성을 제고하는 역할을 수행합니다. 이 데이터는 외국인 투자 유치, 해외 진출 기업의 세무 전략 수립, 국제조세정책 수립 및 개편, 조세 분야 국제협력 기반 마련 등에 기초자료로 활용될 수 있습니다. 국제조세, 세제정책, 외교협약, 투자환경 분석, 과세정보 공유 등 다양한 정책 분야와의 연계 활용이 가능합니다.
