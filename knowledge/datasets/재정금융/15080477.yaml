description_portal: '2017년부터 2024년까지 서천군 지방세 부과금액대비 비과세 및 감면세액 , 비과세감면율에 대한 과세자료를 제공합니다.상세내용■ 과세년도: 세금이 부과되는 연도(2017년~2024년)■ 세목: 레저세, 재산세, 주민세, 취득세, 자동차세, 과년도수입, 담배소비세, 도시계획세, 등록면허세, 지방교육세, 지방소득세, 지방소비세, 지역자원시설세■ 비과세금액: 세법에 따라 세금이 면제되어 부과되지 않은 금액■ 감면금액: 세법에 따라 부과된 세금 중에서 일정 조건을 충족한 남세자에게 감면(감액 또는 면제)된 세금의 금액■ 부과금액: 과세표준x세율/ 예산 수립, 징수계획 수립 등에 사용■ 비과세감면율: 전체 과세 대상 금액 중에서 비과세 또는 감면을 받은 비중을 백분율(%)로 나타낸 지표(행정안전부 공공데이터포털에 서천군 공공데이터 등록 및 공개)근거: 공공데이터 제공 및 이용 활성화에 관한 법률 제18조, 제22조'
