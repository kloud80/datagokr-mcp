description_portal: 본 데이터는 전라남도 해남군의 지방세 세목별 비과세 및 감면 현황과 그에 따른 비과감면율 정보를 제공합니다. 주요 항목은 시도명, 시군구명, 자치단체 고유 코드, 실제 부과된 금액, 세목명, 과세년도, 비과세된 금액, 감면 처리된 금액, 그리고 이를 바탕으로 산출된 비과세감면율로 구성되어 있습니다. 본 자료는 지방세 감면 정책의 효과성과 형평성을 분석하고, 자치단체의 재정 운용 투명성을 제고하기 위한 기초자료로 활용됩니다. 특히 세목별로 감면 규모를 비교함으로써 세제지원의 방향성과 실효성을 평가할 수 있으며, 재정 건전성 확보와 관련된 정책 수립에 필요한 참고 자료로도 유용합니다. 지역별 세수 확보와 감면 정책의 균형을 검토하기 위한 행정·분석용 데이터로 개방됩니다.
