summary_user: 신용보증기금이 조사한 기업 재무제표의 기본 속성을 재무제표식별정보ID별로 담은 파일로, 재무분석 평가 구분, 재무제표 작성 근거, 장부 기장 구분, 회계기준 구분, 삭제 여부를 담는다(전국 범위, CSV 약 24KB). 분석가가 보증 이용 기업의 재무제표가 어떤 회계기준과 기장 방식으로 작성되었는지 확인해 재무 데이터의 신뢰도를 가를 때 쓴다. 재무제표식별정보ID(kodit_fs_id)를 키로 신보의 다른 조사 재무제표 데이터와 잇는다. 기업 축(사업자번호)으로 엮으려면 이 ID와 기업을 연결하는 별도 자료가 필요하다.
description_portal: 해당 파일은 신용보증기금이 운용하는 조사 재무제표 기본정보 데이터로, 재무분석평가구분, 장부기장구분 등의 항목을 제공합니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
