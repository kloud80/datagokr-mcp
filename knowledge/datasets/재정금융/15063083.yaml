description_portal: 관세청에서는 개인정보 유출을 방지하기 위하여 개인물품 수입신고시 주민등록번호 대신 활용할 수 있는 개인통관고유부호제도를 운영하고 있습니다.현재 외국 쇼핑몰(전자상거래업체)에서 물건을 구입하는 경우 쇼핑몰이나 배송대행업체는 개정된 개인정보보호법 시행에 따라 법령에 근거가 없으면 주민등록번호 수집을 할 수 없으므로 개인통관고유부호를 발급받도록 공지를 하고 있습니다.수출입신고시 주민등록번호를 기재할 수 있는 것은 수집용이 아니라 확인용이기 때문에 개정된 개인정보보호법이 시행되어도 수입신고시 주민등록번호 또는 개인통관고유부호 모두 사용할 수 있지만, 주민등로번호는 정보 유출의 위험성이 크기 때문에 개인통관고유부호를 쓰는 것이 안전하므로 개인통관고유부호를 발급 받아 이용하는 것이 좋습니다.해외직구 등 개인통관을 위해 필요한 개인통관고유부호의 발급현황입니다.개인통관고유부호 제도가 시행된 2016년 1월 ~ 2026년 7월 기간 동안 매월 신규로 발급받은 개인통관고유부호의 월간통계자료 입니다. 재발급된 개인통관고유부호는 카운트되지 않은 데이터입니다.
