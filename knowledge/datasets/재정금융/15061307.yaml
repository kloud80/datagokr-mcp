summary_user: 손해보험사별 일반현황(임직원·설계사 수 등), 요약 재무상태표 계정, 경과손해율 등 주요 영업활동, 자본적정성 등 주요 경영지표를 기준년월(basYm) 단위 시계열로 담은 금융회사 단위 집계 통계이며, 전국 범위의 비공간 데이터다. 분석가나 소비자가 '특정 손해보험사의 자산 규모와 보험종류별 손해율, 자본적정성은 다른 회사와 비교해 어떤가'를 확인할 때 쓴다. 법인등록번호(crno)를 조인 키로 금융위원회 기업정보·재무정보 등 다른 금융회사 원장 데이터와 이어 쓰고, 업권 내 회사 구분은 금융회사코드(fncoCd)로 한다.
description_portal: '금융통계손해보험정보는 기준년월을 기준으로 손해보험사일반현황, 손해보험사재무현황, 손해보험사주요경영지표, 손해보험사주요영업활동 등의 정보를 시계열 데이터 형식으로 제공합니다.이 데이터는 4개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 손해보험사 일반현황 조회 : 기준년월등을 통하여 금융회사명, 인원수, 임직원수, 임직원 구분코드명등을 조회하는 손해보험일반현황조회 기능② 손해보험사 재무현황 조회 : 기준년월 등을 통하여 금융회사명, 자산요약재무상태표계정과목금액, 자산요약재무상태표계정과목코드, 자산요약재무상태표계정과목코드명, 자산요약재무상태표계정과목구성비율, 법인등록번호등을 조회하는 손해보험재무현황조회 기능③ 손해보험사 주요영업활동 조회 : 기준년월 등을 통하여 금융회사명, 보험종류경과손해율구분금액, 보험종류경과손해율구분코드, 보험종류경과손해율구분코드명등을 조회하는 손해보험주요영업활동조회 기능④ 손해보험사 주요경영지표 조회 : 기준년월등을 통하여 금융회사명, 자본적정성항목코드, 자본적정성항목코드명, 자본적정성항목값내용등을 조회하는 손해보험주요경영지표조회 기능'
