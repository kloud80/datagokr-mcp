description_portal: 본 데이터는 부산광역시 중구 주민의 조세 부담 수준과 지역 재정 역량을 파악하기 위해 주민 1인당 평균 지방세 부담 현황을 집계한 자료입니다. 시도명, 시군구명, 자치단체코드와 같은 행정 구역 정보와 함께 과세년도별 지방세 총액 및 인구수 대비 1인당 부담액 지표를 상세히 제공합니다. 이를 통해 연도별 세수 변동에 따른 주민의 실질적 조세 부담 추이를 분석할 수 있으며, 타 자치단체와의 비교를 통한 재정 자립도 평가 및 지역 경제 활력도 진단의 기초 자료로 활용됩니다. 특히 본 자료는 객관적인 세입 구조 분석을 바탕으로 중구의 중장기적인 재정 운영 계획 수립과 주민 복지 정책의 적정 규모를 산정하는 데 유용한 가치를 지닙니다. (※ 1인당 지방세 부담액은 연간 지방세 총 부과액을 당해 연도 주민등록 인구수로 나눈 산술 평균값임)
