description_portal: 2020년부터 2026년까지의 사회복지 분야 노인,아동·보육, 여성·가족·청소년 부문 주요 프로그램별 시계열 자료입니다.*수치가 기본단위보다 적거나 수치가 없을 경우 0으로 표시하였습니다.*아동보호 및 복지 강화 프로그램은 2018년까지 가족기능강화입니다.*가족정책 및 돌봄 지원은 2020년까지 여성·아동 인권보호 및 가족 지원이이었으며, 2021년 가족정책 및 돌봄 지원, 여성·아동인권보호로 분리되었습니다.*이 통계집 자료는 본예산을 기준으로 작성하였으며, 2023년 이전은 결산기준입니다.*이 통계집 자료는 총수입･총지출을 기준으로 작성하였으며, 총계, 통합재정 등 작성 기준이 다를 경우 그 기준과 출처를 “주”에 별도 표시하였습니다.*이 통계집의 재정통계는 디지털예산회계시스템에 수록되어 있는 예･결산 자료를 바탕으로 한 것이며, 출처가 디지털예산회계시스템이 아닌 경우에는 그 출처를 “주”에 별도 표시하였습니다.*모든 통계는 합계 또는 소계가 반올림되었으므로 세부 항목의 합계가 총계와 일치하지 않는 경우가 있습니다.*각 통계표의 계수 단위는 기본적으로 ‘억 원’ 단위이며, 필요한 경우 ‘조 원’ 단위입니다.*정부 조직개편, 재정사업 분류체계 개편 등으로 인해, 소관, 분야, 부문, 프로그램별 시계열 자료 해석 시 유의할 필요가 있습니다.*세입･세출외는 제외하되, 필요시에는 별도 항목으로 표시하였습니다.
