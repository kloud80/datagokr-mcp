description_portal: 이 데이터는 전라남도 강진군의 지방세 징수 현황을 기록한 자료로, 세목별 부과와 징수의 실적을 종합적으로 파악할 수 있도록 구성되어 있습니다. 과세년도 단위로 레저세, 재산세, 주민세, 취득세, 자동차세 등 다양한 지방세 항목에 대해 부과금액, 실제 수납된 금액, 환급금액, 결손금액, 미수납 금액 등이 포함되어 있으며, 이를 바탕으로 징수율이 산출됩니다. 데이터 항목에는 시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 부과금액, 수납급액, 환급금액, 결손금액, 미수납금액, 징수율, 데이터기준일이 포함됩니다. 이 자료는 강진군의 세수 확보 현황과 징수 효율성을 분석하는 데 유용하며, 체납 관리와 세정 정책 개선, 재정 운용 전략 수립에 중요한 기초자료로 활용될 수 있습니다.
