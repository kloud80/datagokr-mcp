summary_user: 대구광역시 동구에 등록된 대부업체를 업체별로 담은 등록 원장으로, 등록번호·관리번호·업체명·주소를 제공하며 API 전체 건수는 2건입니다. 동구 주민이나 금융소비자가 거래하려는 대부업체가 구청에 정식 등록된 업체인지, 주소가 어디인지 확인하는 데 쓴다. 주소(ADRES)를 조인 키로 삼아 다른 지역의 대부업 등록 현황이나 주소 기반 사업장 데이터와 이어 쓰며, 코드표는 없다.
limits: 대구 동구 한 곳의 등록 업체만 담고 전체가 2건뿐이어서 통계·추세 분석에는 맞지 않는다. 연락처, 등록일, 영업 상태 필드는 없고 업체 식별은 등록번호와 주소에 의존한다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
