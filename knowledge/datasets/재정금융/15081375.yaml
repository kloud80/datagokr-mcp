description_portal: '이 데이터는 사고유형별 보증사고 현황을 나타내며, 기술보증기금이 보증한 기업들에서 발생한 각종 보증 사고에 대한 정보를 제공합니다. 각 사고 유형에 따른 사고 금액을 포함하고 있어, 보증사고의 원인과 규모를 알 수 있습니다.데이터 구성기준년도: 해당 사고가 발생한 연도를 나타냅니다. 예를 들어, "2025"년 동안 발생한 사고를 다룹니다.사고사유: 사고의 원인이나 유형을 구체적으로 명시합니다. 주요 사고 유형에는 이자연체, 원금연체, 회생절차 개시 신청, 신용관리 정보 등록, 폐업 등이 있습니다.사고금액(억원): 각 사고 유형에 대해 발생한 사고 금액을 나타냅니다. 금액은 억원 단위로 기록되어 있으며, 해당 사고가 기보에 미친 재정적 영향을 분석할 수 있습니다.이 데이터는 기술보증기금이 보증한 기업들에서 발생한 보증 사고를 분석하고, 각 사고 유형별로 사고 금액을 파악할 수 있는 유용한 자료입니다.'
