summary_user: 지역사랑상품권 운영대행사들이 모은 모바일 상품권 가맹점을 한 곳씩 담은 건별 원천 데이터로, 전국 범위에서 가맹점명·주소·위경도·사업자 상태·표준산업분류 업종과 신규·변경·해지 구분을 제공한다. 동네 주민이 우리 지역에서 모바일 지역화폐를 받는 가게를 찾거나, 분석가가 지역별 소상공인 가맹점의 업종 분포와 상권을 살펴볼 때 쓴다. 사업자등록번호(brno)로 다른 사업자 데이터와 잇고, 사용처지역코드(5자리)와 읍면동코드(8자리)는 행정안전부 법정동코드의 앞자리라서 법정동코드 데이터와 지역 단위로 이어 쓴다.
description_portal: '지역사랑상품권 운영대행사들로부터 수집한 모바일 가맹점에 대한 가맹점명, 대표전화번호, 주소, 위경도, 사업자 상태, 표준산업분류코드 등을 제공한다.아래는 데이터 사용시 참고바랍니다:1) 제공기관코드:코나아이: I0000001한국간편결제진흥원: I0000002신한카드: I0000003한국조폐공사: I0000004KT: I0000005농협은행: I0000006광주은행: I0000007대구은행: I0000008ITS&G: I0000009NICE 정보통신: I0000010KIS 정보통신: I0000011인조이웍스: I0000012부산은행: I0000014비즈플레이:I00000152) 사용처지역코드(5자리):- 행정안전부에서 제공하는 법정동코드(지역코드 10자리) 중, 앞 5자리(시도코드 2자리 + 시군구코드 3자리)를 사용하고 있습니다.- 코드 정보는 참고문서를 확인바랍니다.3) 읍면동코드(8자리):- 행정안전부에서 제공하는 법정동코드(지역코드 10자리)의 앞 8자리(시도 코드 2자리 + 시군구 코드 3자리 + 읍면동 코드 3자리)를 사용하고 있습니다.- 법정동코드는 행정안전부_행정표준코드_법정동코드 API(https://www.data.go.kr/data/15077871/openapi.do)를 활용하여 조회할 수 있습니다.'
