description_portal: '해당 데이터는 신용보증기금의 1998년~2025년 재무 상태 및 경영 성과(자산, 부채, 자본, 당기순이익)를 확인하실 수 있는 자료이오니 활용에 참고하시기 바랍니다. (금액 단위: 억원)이 문서는 신용보증기금의 재무 현황 및 경영 지표에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다.해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.* 국가회계기준에서의 "재정운영결과"는 비용을 기준으로 산출되므로 이익 발생 시 음수(-)로 표시됩니다.'
