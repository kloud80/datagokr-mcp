description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시의 지방세 비과세 및 감면 현황을 체계적으로 정리한 통계자료입니다. 교육세, 재산세, 등록세 등 주요 지방세목에 대해 연도별 비과세금액과 감면금액, 전체 부과금액 대비 비과세감면율을 제공함으로써 지방세 운영의 투명성을 확보하고 있습니다. 이 데이터는 지방자치단체의 세수 현황을 분석하고, 세정 정책을 수립하며, 시민들의 세무 정보 접근권을 보장하기 위해 구축되었습니다. 연구기관, 정책입안자, 시민단체 등이 남원시의 지방세 운영 실태를 객관적으로 파악하고 분석하는 데 활용될 수 있습니다.2. 데이터 항목명시군구코드, 과세년도, 시도명, 시군구명, 세목명, 법구분명, 비과세건수, 비과세액, 감면건수, 감면세액, 부과금액3. 기대효과이 데이터는 지방세 운영의 투명성을 높이고 시민들의 알 권리를 충족시켜 행정에 대한 신뢰도를 향상시킬 수 있습니다. 또한 세정 정책 연구와 지역 간 세무행정 비교분석을 위한 기초자료로 활용되어 효율적인 지방세 정책 수립을 지원할 것입니다.
