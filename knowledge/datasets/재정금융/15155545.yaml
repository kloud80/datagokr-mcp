description_portal: 국민의 관심이 많거나 국가재정을 이해하는데 필요한 재정통계를 선별하여 그 규모와 구성·추이·국제비교 등 다양한 정보를 담고 있으며, 관련 업무에 쉽게 활용할 수 있도록 직관적이고 시각화된 자료를 제공함소수점 이하 단수조정으로 상이할 수 있음. 관리재정수지는 통합재정수지, 사회보장성기금수지로 구성되어있음예산안이란 한 회계연도의 예산안을 편성하여 심의, 확정을 받기 위하여 제출하는 의안. 지난 9월3일 2026년도 예산안을 편성하여 국회 제출. 25년 본예산 대비 54.7조원 증가, 25년 제2회 추경 대비 24.7조원 증가. 2026회계연도 자료 수록
