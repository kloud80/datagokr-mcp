description_portal: 본 데이터는 경기도 시흥시에서 부과·관리하는 지방세에 대하여 법령에 따라 적용되는 비과세 및 감면 제도의 현황을 집계한 자료입니다. 과세 대상 중 법정 요건에 해당하여 세액이 면제되거나 일정 비율로 경감된 건에 대한 적용 비율과 규모를 정리한 통계 정보로서, 연도별 감면 적용 추이와 세수 영향 규모를 파악할 수 있도록 구성되어 있습니다. 이를 통해 세제지원 정책의 운영 실적을 객관적으로 확인할 수 있으며, 재정 운용의 투명성 제고와 정책 효과 분석을 위한 기초자료로 활용할 수 있습니다. 또한 연구기관 및 시민은 과세구조와 감면제도 운영 현황을 종합적으로 이해하는 데 참고자료로 활용할 수 있습니다. 본 자료는 관련 법령과 내부 행정자료를 기준으로 작성된 공공데이터입니다.
