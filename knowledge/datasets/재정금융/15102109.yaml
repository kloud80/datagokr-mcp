summary_user: 관세청 수출입 신고에서 나온 실적을 HS 10단위 품목을 비슷한 성질끼리 묶은 성질별 분류(수출 4대·151개, 수입 3대·180개 세분류) 단위로 기간별 금액(달러)과 중량(KG)으로 집계한 전국 단위 데이터입니다. 무역 분석가나 사업자가 '최근 소비재·원자재·자본재 수입이 각각 얼마나 늘었는가', '중화학 공업품 수출 비중이 어떻게 변했는가'처럼 산업 성격별 수출입 흐름을 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 성질명코드(godsCd)를 포털의 'HSK별 신성질별_성질별 분류' 연계표로 HS코드와 매핑하거나 같은 관세청 품목·국가별 수출입실적과 이름·코드로 맞춰 연결한다.
limits: 전국 단위 비공간 집계라 시도·시군구 등 지역별 실적은 이 데이터로 볼 수 없다. 공통 조인 키가 없어 다른 데이터와는 성질 코드·이름 매핑으로만 이어 붙일 수 있다.
