description_portal: "* 성질별 분류란 1972년부터 무역통계 작성 시 활용된 분류기준이며,  HS Code 10단위 세번을 상품 특성에 맞게 유사한 성질을 가진 품목끼리 집계한 분류체계(수입•수출 별도 분류)입니다. 우리나라 산업 발전에 따라 1998년 전면 개편하였으며, 이후 5년마다 HS가 개정됨에 따라 일부 개편되고 있습니다. 수입은 3大 대분류(소비재, 원자재, 자본재), 수출은 4大 대분류(식료 및 직접소비재, 원료 및 연료, 경공업품, 중화학 공업품)하고 있으며 최하위단위(세분류) 기준 수출 151개, 수입 180개 분류로 구성되어 있습니다.* 공공데이터 포털에서 ‘HSK별 신성질별_성질별 분류’ 데이터 또는 관세청 수출입무역통계 누리집  분류수출입무역통계 → 누리집 수출입실적 → (신)성질별 통계 → (신)성질명 세부검색 및 공지사항의 ‘2022 HS 신성질별, 성질별 연계표’를 통해 각 분류에 해당하는 HS코드 확인하실 수 있습니다.* 조회기간, 수출수입구분코드, 수출입성질분류코드를 이용하여 관세청 수출입통계정보의 기간, 수출입구분, 성질명, 성질명코드, 중량, 금액, 국가코드 등을 조회 할 수 있는 서비스.* 강원도가 강원특별자치도로 변경('23.6.11.)됨에 따라  참고자료에 강원특별자치도의 시도코드( 51)를 추가 반영하였습니다.※ '26.7.1.자 전남광주통합,인천 지방행정체계 개편으로 수출입신고 시도코드가 변경되었으니, 수출입실적 조회 시 참고하시기 바랍니다 - '26.7.1.이후 수출입실적 조회: 전남광주통합특별시 코드 12 - '26. 7월 이전 수출입실적 조회: 광주광역시 코드 29 / 전라남도 코드 46"
