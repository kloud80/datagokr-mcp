summary_user: 금융회사별로 공적자금 등 자금지원 내역과 회수 실적을 담는 데이터로, 상환기금과 특별계정 구분으로 출자·대출·출연·자산매입·예금대지급 등 지원 유형별 금액과 투자·대출·파산배당·자산처분 등 회수 금액, 부실 금융회사 정리방법을 기준일자별로 제공한다. 금융 분석가나 연구자가 '특정 금융회사가 구조조정 과정에서 공적자금을 얼마나 지원받았고 그중 얼마가 회수됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 금융회사 원장 데이터와는 금융회사명(fncoNm)·업권 이름을 맞추거나 같은 기관 코드로만 연결한다.
description_portal: '금융회사 자금지원및회수정보는 금융회사에 대한 공적자금 등의 자금지원 내역과 이에 대한 회수 실적을 제공하는 데이터입니다. 자금의 지원기관, 지원일자, 지원금액, 회수금액, 지원유형 등을 기준으로 금융회사의 구조조정 이력과 자금 흐름을 확인할 수 있도록 구성되어 있습니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 금융회사 자금지원 및 회수정보 조회 : 금융회사별 자금지원 일자, 지원기관, 지원금액, 회수금액, 회수방법, 지원사유 등을 조회합니다.※ 데이터 갱신주기는 일 1회입니다.※ 금융위원회의 모든 API는 데이터 보유기관으로부터 데이터를 연계받아 수집 후 개방하고 있습니다.금융위원회에서 제공하는 모든 서비스는 실시간이 아니며, 데이터 갱신은 기준일자로부터 영업일 하루 뒤 오후 1시 이후에 업데이트됩니다.예를 들어, 금요일 데이터는 차주 월요일에 제공됩니다. (월요일이 공휴일인 경우, 다음 영업일에 제공됩니다)'
