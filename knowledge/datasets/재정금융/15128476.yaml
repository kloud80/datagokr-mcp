summary_user: NH멤버스 농산물 판매기록을 바탕으로 경기도 31개 시군에서 매출이 난 상위 15개 품목의 평균 매출단가(원)를 담은 집계표로, 행은 상품명(쌀·찹쌀·콩나물·고구마 등), 열은 시군입니다. 소비자나 분석가가 '같은 쌀이 수원과 연천에서 농협 매장 평균 얼마에 팔렸나'처럼 품목별 시군 간 판매단가 차이를 비교할 때 쓴다. 전역 조인 키는 없어서, 시군 열 이름을 시군명이나 행정코드에 직접 맞추고 품목명으로 다른 농산물 가격 자료와 이어 쓴다.
description_portal: '이 데이터는 NH멤버스 농산물 중 경기도 31개 시군에서 매출이 발생한 상위 15개 품목의 평균 매출단가(단위: 원)를 정리한 자료입니다. 각 행은 상품명(예: 쌀, 찹쌀, 콩나물, 고구마 등)을 기준으로 하며, 열은 시군별로 판매된 평균 단가를 나타냅니다. 값이 ‘0’인 경우는 해당 시군에서 매출 정보가 존재하지 않음을 의미합니다. 데이터는 농협의 실제 판매기록을 바탕으로 작성되었으며, 파일 탭 내 ‘매출 정보’를 통해 각 시군별로 매출 건수가 가장 많은 품목, 전체 매출 건수 및 총금액 등의 종합적인 통계도 함께 확인할 수 있습니다.'
