description_portal: 상기 데이터는 연도별 지방세 납부 현황을 납부매체별로 구분하여 제공함으로써 지방세 징수 과정에서 활용되는 다양한 결제 수단의 사용 추세를 종합적으로 파악할 수 있도록 한다. 납부매체별 현황을 연도별로 정리함으로써 전자송달 시장의 규모를 객관적으로 측정할 수 있으며, 납세자 편익을 분석하는 데 중요한 기초자료로 활용된다. 특히 납부년도, 세목, 납부매체, 납부건수, 납부금액, 납부매체 비율 등의 항목을 포함하고 있어 지방세 납부 행태를 세부적으로 분석할 수 있다. 이를 통해 특정 세목에서 어떤 납부매체가 주로 사용되는지, 납부금액 대비 건수의 비율이 어떻게 변화하는지를 확인할 수 있으며, 납세자들이 선호하는 결제 방식의 변화 추세를 파악할 수 있다. 또한 이러한 데이터는 수수료 산정의 근거 자료로 활용되어 각 납부매체별 비용 구조를 검토하고, 효율적인 수수료 정책을 마련하는 데 기여한다.
