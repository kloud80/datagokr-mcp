description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에서 발생한 지방세 미환급 상황을 체계적으로 정리한 행정 자료입니다. 등록면허세, 지방소득세, 재산세 등 다양한 지방세 항목에서 납세자에게 환급되어야 하나 아직 처리되지 않은 세금의 건수와 금액을 과세연도별, 납세자 유형별로 상세히 제공합니다. 이 데이터는 지방세 환급 업무의 투명성을 확보하고 효율적인 환급 정책을 수립하기 위해 마련되었으며, 시민들의 알 권리를 보장하고 세무행정을 개선하는 데 기여합니다.2. 데이터 항목명시도명, 시군구명, 세목명, 과세연도, 미환급유형, 납세자유형, 당해미환급건수, 당해미환급금액, 누적미환급건수, 누적미환급금액, 누적미환급금액증감3. 기대 효과이 데이터를 통해 지방세 환급 업무의 투명성이 크게 향상되고 시민들은 자신의 환급 상황을 보다 쉽게 파악할 수 있게 됩니다. 나아가 지방자치단체는 미환급 현황을 심층 분석하여 환급 정책을 개선하고 세무행정 서비스의 품질을 더욱 높일 수 있을 것으로 기대됩니다.
