description_portal: 우리 공사에서 취급하고 있는 전세자금대출특약보증(주택도시보증공사(HUG)가 금융기관(은행)에 전세자금대출의 원리금 상환을 책임져 주는 보증 상품)의  월별 실적에 대한 데이터입니다. 임차인이 대출을 받아야 하는 상황에서 발생할 수 있는 대출 실행의 어려움을 은행이 겪더라도, 그 대출 원리금 상환 책임을 HUG가 보증해 주어 은행이 안심하고 전세자금대출을 내줄 수 있도록 하는 보증 제도입니다. 2015년부터 2025년 7월까지 월별로 전세자금대출특약보증 보증발급 금액과 보증발급 건수로 구성되어 있으며 해당 데이터는 1회성으로 제공되는 통계성 수시데이터입니다. 연구과제 수행, 통계 업무 등에 참고하시기 바랍니다. 감사합니다.
