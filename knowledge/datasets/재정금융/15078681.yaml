description_portal: 지방세 과세를 위해 세원이 되는 과세 대상 유형별 부과된 현황을 제공(시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 세원 유형명, 부과건수, 부과금액)지자체가 과세하는 다양한 세목(재산세, 자동차세, 지방소득세, 취득세 등)을 세원 유형에 따라 구분하여 징수 금액, 과세 건수, 세율 적용 상태 등을 정리한 자료입니다. 본 데이터는 세원별 과세 실적, 세목 간 비교, 지역별·연도별 징수 추이 분석 등을 통해 재정 운영 평가, 세제 형평성 검토, 정책 개선 및 민원 대응 등에 활용될 수 있습니다.건수·세원 유형이 많아 엑셀·메모장 등의 일반 뷰어에서는 일부만 확인될 수 있으며, 따라서 R, Python, GIS 등 분석 전용 도구를 사용한 통계 분석 및 시각화를 권장합니다.세율 기준일, 과세 기간, 세목 분류 기준, 조정 적용 기준 등이 포함된 상세 설명은 해당 지자체의 메타데이터나 기술문서를 참고해 주세요.
