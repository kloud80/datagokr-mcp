description_portal: '정선군 지방세 비과세 및 감면에 대한 감면금액, 비과감면명, 감면금액, 건수 등에 대한  현황 자료입니다.2013년 ~ 2024년 총 감면 세액은 25,706백만원 정도이며, 세부적인 감면 내용은 해당 데이터를 참고하시기 바랍니다.과세연도 : 2013년 ~ 2024년 세목 : 지방세(취득세, 재산세, 자동차세, 등록면허세 등)주요내용 : 정선군 지방세 중 해당 세목별 비과감면으로 구성된 데이터입니다.주요비과감면 - 국가 및 기초자치단체가 취득하는 재산- 자경농민이 농업 목적으로 취득하는 부동산 - 다자녀 가구 승용자동차- 장애인 소유 승용자동차 - 임대사업자의 공동주택, 오피스텔 등에 대한 비과감면- 사회복지법인이 사회복지사업에 직접사용 하기 위한 부동산 - 농어촌 정비법의 규정에 의한 농어촌주거환경정비사업에 의한 주택개량자- 종교 및 제사를 목적으로 하는 단체의 사업용 부동산 취득   등의 사유로 인한 비과세, 감면이 적용된 데이터입니다.주요 관련세법 - 지방세법 - 지방세특례제한법 - 감면조례 - 기타해당 자료에 대해 세부적으로 궁금한 내용은 정선군청 세무과 2288으로 문의 주시면 자세하게 설명드리겠습니다.'
legal_basis_portal: 지방세 비과세 감면 적용시, 지방세 정보시스템에 자동적으로 저장되어 보유하고 있습니다.
