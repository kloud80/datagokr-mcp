summary_user: 서울시에 등록된 대부업체를 업체(영업소) 단위로 담은 등록 원장으로, 상호·법인 여부·본점 여부, 등록일자와 유효기간 만료일자·폐쇄일자, 도로명 주소·전화번호를 포함한다. 시민이 연락받은 대부업체가 서울시에 정식 등록돼 있고 등록이 아직 유효한지 확인하거나, 분석가가 서울 자치구별 대부업체 분포와 폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소 같은 이름 매핑이나 같은 기관의 시군구 코드(SF_TEAM_CODE)로만 이어 쓴다.
description_portal: 서울시 대부업체 정보는 서울시 내에서 등록·운영 중인 대부업체의 행정적·운영상 세부 사항을 파악할 수 있는 중요한 공공 데이터입니다. 이 자료는 각 업체의 등록 상태, 영업 형태, 위치, 연락처, 지점 여부 등 법적·행정적 관리를 위한 핵심 요소들을 포함하고 있습니다. 시군구 코드를 통해 지역별 분포를 분석할 수 있으며, 등록증번호, 등록일자, 유효기간 만료일자 등은 업체의 합법적 운영 여부 및 등록 이력을 확인하는 데 활용됩니다. 법인 여부, 본점 여부 등의 정보는 업체 구조 파악에 도움이 되며, 도로명 주소와 전화번호는 시민이 실제로 업체를 확인하거나 문의할 때 중요한 실질적 정보입니다. 폐쇄일자나 최근 수정일자는 업체의 운영 변동 상황을 추적할 수 있는 기반 자료로 활용됩니다. 이러한 데이터는 불법 사금융 방지, 소비자 보호 정책 수립, 지역별 대부업 현황 분석, 금융 취약계층 보호 방안 마련 등 여러 공공행정 및 연구 분야에서 중요한 역할을 합니다.
