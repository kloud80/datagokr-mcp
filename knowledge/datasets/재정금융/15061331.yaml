summary_user: 리스회사별로 기준년월(basYm) 단위의 일반현황·재무현황·주요경영지표를 담는 업권별 금융통계로, 전국 범위의 비공간 데이터다. 금융 분석가나 사업자가 특정 리스사의 총자산·부채·자본 규모나 ROA·ROE 같은 수익성, 영업점 분포를 시점별로 비교하는 데 쓴다. 법인등록번호(crno)로 금융위원회 기업정보·공시 재무 등 다른 금융회사 원장 데이터와 잇는다. 금융회사코드(fncoCd)와 회사명(fncoNm)은 보조 식별자로 쓴다.
