description_portal: '금융통계리스사정보는 기준년월 및 회사명을 기준으로 리스회사의 일반현황, 재무상태, 경영성과 등을 제공하는 데이터입니다. 이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 리스사 일반현황 조회 : 설립연도, 본점소재지, 영업점 분포 등 일반정보를 제공합니다.② 리스사 재무현황 조회 : 총자산, 부채, 자본 등 리스사의 재무구조를 조회할 수 있습니다.③ 리스사 주요경영지표 조회 : ROA, ROE, 순이익률 등 주요 경영성과 지표를 제공합니다.'
