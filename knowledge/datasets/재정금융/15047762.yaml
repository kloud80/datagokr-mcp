description_portal: 2000년~2018년 기간 중 기업규모별(대기업,중견기업,중소기업) 환변동보험 인수현황을 나타낸 데이터입니다.환변동보험은 수출 또는 수입을 통해 외화를 획득 또는 지급하는 과정에서 발생할 수 있는 환차손익을 제거, 사전에 외화금액을 원화로 확정하여 환율변동에 따른 위험을 헤지(Hedge)하는 제도로, 수출(수입)기업의 경우, 환율 하락(상승) 시 환차손에 노출되나 환변동보험을 통해 K-SURE로부터 환차손을 보전 받게 되므로 환율 하락(상승)에 따른 위험이 상쇄되는 효과를 얻을 수 있습니다. 한국무역보험공사는 시중은행과 중소중견기업의 중개인 역할을 수행하고 있습니다. (보험인수 시 시중은행을 통해 전액 헷지)
