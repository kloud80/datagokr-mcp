description_portal: '○ 통계개요* 통계명 : 품목별 수입실적(구별)* 통계종류 : 서울시 품목별 수입실적을 자치구별로 제공하는 일반통계* 작성목적 : 국제적으로 공인된 통계분류방식인 SITC분류체계에 의한 무역통계를 산출간행하여 정책입안자료로 제공* 조사체계 : 세관→관세청→한국무역협회* 공표주기 : 정기* 공표범위 : 지역 - 서울시 및 자치구내용 - 식품및산동물, 음료및담배 등 SITC 분류에 의한 수입실적 현황 등○ 용어설명* SITC 별 : 계상시점은 통관면허일자 기준이고, 수출은 FOB 수입은 CIF 가격에 의하며,무환무역을 포함하고 밀수출입과 은행권 및 채권 주식 기타 유가증권은 제외,1991년 이후 상품에 관한 자료는「제3차 개정 SITC」를 기준으로 개정된한국표준무역분류(SKTC)에 관세·통계통합품목분류(HS/K)를 연계,보완○ 기 타* 품목은 SITC 기준, 분류단위는 제1단위** SITC : 표준국제무역분류라고 하며 국제연맹에서 국제간의 무역통계를 비교하기위해 만든 통계임* 달리 분류되지않은 상품 및 취급물 : 화폐용의 금, 금화 및 경화 포함'
