description_portal: 주택도시보증공사(기관명)은 재개발 재건축 등 정비사업 및 리모델링사업(업종)의 초기자금 지원을 위하여  지방자치단체(시군구,상호)로부터 융자수탁을 받아 사업을 진행하고 있습니다.주택도시보증공사(기관명)은 서울특별시(소재지) 및 경기도 성남시(소재지)의 융자지원사업에 대하여 수탁기관으로서 융자실행 및 회수 등 업무를 담당하고 있습니다. 해당 자료는 추진위원회(상호명)및 조합(상호명) 등 융자신청자에게 지원된 융자 실행금액, 상환금액 및 회수금액 융자잔액에 대해 월별 통계 데이터를 제공합니다.제공하는 항목은 아래와 같습니다.월초 융자잔액, 월별 융자실행금액, 월별 융자상환금액, 월말 융자잔액※ 해당사업과 관련한 내용은 도시 및 주거환경정비법, 주택도시기금법, 도시재정비 촉진을 위한 특별법, 서울특별시 도시 및 주거환경정비 조례, 서울특별시 도시 및 주거환경정비 조례 시행규칙, 경기도 성남시 공동주택리모델링 지원에 관한 조례, 경기도 성남시 공동주택 리모델링 기금설치 및 운용 조례, 성남시 공동주택 리모델링 기금설치 및 운용조례 시행규칙을 참조하여 주시기 바랍니다.
