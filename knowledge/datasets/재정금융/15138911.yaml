description_portal: 이 데이터는 기술보증기금이 한 해 동안 중소기업과 중견기업을 대상으로 제공한 보증공급 금액을 월별로 집계한 자료입니다. 정책보증 자금이 실제로 기업에 얼마나 공급되었는지를 보여주는 자료입니다.주요 항목은 다음과 같습니다.**‘연도’**와 **‘월’**은 자료가 집계된 기준 시점을 나타냅니다.**‘중소기업(억원)’**은 해당 월에 중소기업에 공급된 보증금액,**‘중견기업(억원)’**은 중견기업에 공급된 보증금액,**‘총 공급현황(억원)’**은 두 기업군에 대한 보증공급금액을 합산한 전체 규모를 의미합니다.여기서 중소기업은 「중소기업기본법」에 따라 업종별 상시 근로자 수, 자산총액, 매출액, 자본금 등의 기준을 충족하는 기업으로, 통상적으로 자본금 120억 원 이하 또는 연매출 1,000억 원 이하의 요건을 갖춥니다.중견기업은 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」에 따라 직전 3년 평균 매출액이 3,000억 원 미만이면서 중소기업 기준을 초과한 기업으로 정의되며, 대기업에 해당하지 않는 일정 규모 이상의 성장 기업군입니다.이 데이터는 기업규모별 보증자금 집행 흐름을 파악하고, 월별 정책금융 수요, 지원 비중, 자금공급의 편중 여부 등을 분석하는 데 활용될 수 있습니다. 이를 통해 보증제도의 운영 실태와 기업 규모별 정책 효과를 점검할 수 있는 기초자료로도 활용될 수 있습니다.
