summary_user: 주택저당증권(MBS)의 콜옵션 행사 내역을 유가증권 발행연도 기준으로 조회해, 공시 작성일자, 조기상환일자, 콜옵션 행사금액·행사비율, 행사 후 채권잔액, 이자 지급일자·지급금액을 트랜치·발행회차별로 담는 건별 공시 데이터이며, 범위는 전국·비공간이다. 채권 분석가나 MBS 투자자가 '특정 연도에 발행된 MBS 중 어느 트랜치가 언제 얼마만큼 조기상환(콜옵션 행사)됐는가'를 확인하거나 조기상환 추이를 분석하는 데 쓴다. ISIN코드(isinCd)가 실측 조인 키라서 종목코드 원장, 일별 시세, 발행 정보 등 같은 ISIN을 쓰는 증권 시장 데이터와 이어 쓴다.
limits: 조회 조건이 유가증권 발행연도라서 행사일자나 공시일자 기준으로 바로 걸러 조회하지 못한다. 개발계정은 하루 10,000회로 호출이 제한되고, 주택금융공사 원천 통계나 거시 금리 지표는 이 데이터에 들어 있지 않다.
