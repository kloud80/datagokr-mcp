description_portal: '모기지론콜옵션행사내역정보는 유가증권 발행연도를 기준으로 주택저당증권(MBS)의 콜옵션 행사 관련 정보를 제공하는 데이터입니다.유동화계획코드, ISIN코드, 채권분류코드(MBS), 유가증권 발행일자 및 회차, 트랜치코드명, 콜옵션 행사일자 및 행사금액, 행사비율, 이자 지급일자 및 지급금액 등의 항목들이 제공됩니다.단일 오퍼레이션으로 구성되어 있으며 자세한 정보는 다음과 같습니다.① 콜옵션행사내역조회 : 유가증권발행년도를 통하여 공시작성일자, 조기상환일자, 콜옵션행사금액, 콜옵션행사비율등을 조회하는 콜옵션행사내역조회 기능이 데이터는 MBS 콜옵션 행사 추이, 이자 지급 내역, 조기상환 구조 등을 분석등에 활용될 수 있습니다.'
