description_portal: '다자개발은행(MDB: Multilateral Development Bank) 조달시장 관련 데이터는 한국기업의 해외 조달시장 진출을 지원하기 위해 제공되는 핵심 정보입니다. 본 데이터는 세계은행(WB), 아시아개발은행(ADB), 아프리카개발은행(AfDB), 아시아인프라투자은행(AIIB), 미주개발은행(IDB), 유럽부흥개발은행(EBRD) 등 주요 MDB의 연도별 조달시장 규모와, 해당 시장에서 한국기업이 수주한 실적을 체계적으로 수집·정리한 것입니다.각 MDB가 발주하는 인프라, 교통, 에너지, 환경, ICT 공공사업 등 다양한 개발 프로젝트의 시장 규모와 국가별 실적 현황을 분석할 수 있으며, 한국 기업의 수주 경쟁력을 진단하고 해외 개발 프로젝트 진출전략 수립에 활용될 수 있습니다. 데이터는 연도별 시장규모, 한국기업 수주실적 및 점유율 등 주요 지표로 구성되어, 조달시장 동향 파악과 진출 가능성 분석에 유용한 기초 자료를 제공합니다.'
