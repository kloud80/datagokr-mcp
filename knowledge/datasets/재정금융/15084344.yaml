description_portal: 신용보증기금의 연도별 보증취급 및 보증잔액, 사고 금액 및 사고율, 대위변제 금액 및 대위변제율, 구상권 회수금액 등에 관한 정보를 나타냅니다1. 2013년부터 분기 기준 데이터를 제공2. 사고율 및 대위변제율은 연간 환산 기준3. 보증공급은 매 분기말 기준 당해연도 누적 공급액, 보증잔액은 매 분기말 현재 총 보증잔액 기준4. 총 사고는 채권자(금융회사 등, 이하 동일)가 사고통지한 매 분기말 현재 당해연도 누적 사고액 기준5. 순사고는 사고통지후 거래 정상화·자진상환 등의 사유로 정상화가 된 업체를 제외한 최종적으로 사고처리 된 기업의 매 분기말 현재 당해연도 누적 사고액 기준
