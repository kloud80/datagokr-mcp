description_portal: 전라남도 목포시에서 제공하는 지방세 징수현황 데이터입니다. 본 데이터는 과세년도별로 세목명, 부과금액, 수납금액, 환급금액, 결손금액, 미수납금액 및 징수율 정보를 포함하고 있습니다. 이를 통해 지방세의 부과 및 징수 현황을 종합적으로 파악할 수 있으며, 재정 운용 및 세수 분석에 활용됩니다. 데이터는 세목별, 연도별 체계적 분류로 구성되어 있어 세금 징수의 효율성 평가 및 정책 수립에 중요한 기초 자료로 활용됩니다. 공공기관 및 관련 연구자에게 정확한 지방세 통계 제공을 목표로 작성되었으며, 행정 투명성 강화와 시민 이해 증진에 기여합니다.
