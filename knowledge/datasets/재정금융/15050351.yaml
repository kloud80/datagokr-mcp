description_portal: 자유무역지역(FTZ, Free Trade Zone)은 관세법·대외무역법 등에 대한 특례를 적용하여 자유로운 제조, 물류, 유통, 무역 활동을 보장하기 위해 정부가 지정한 지역으로서, 해당 데이터는 마산자유무역지역,군산자유무역지역, 대불자유무역지역, 동해자유무역지역, 율촌자유무역지역, 울산자유무역지역, 김제자유무역지역 등 기업활동을 촉진하고 외국인 투자를 유치하기 위해 조성된 자유무역지역 내 입주한 입주기업들의 수출 실적과 수입 실적을 비롯하여 수지 실적, 업체수 등 전반적인 자유무역지역 내 입주기업 수출입실적 통계를 제공하는 데이터입니다.
