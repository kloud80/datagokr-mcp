description_portal: 이 데이터는 기술보증기금 재기지원센터에서 회수한 양도담보물의 매각 내역을 정리한 자료입니다. 양도담보물은 보증채무자가 제공한 담보자산으로, 채무불이행 발생 시 기금이 회수하여 공매, 매각중개, 수의계약 등의 방식으로 매각합니다.‘영업점명’은 매각 업무를 수행한 재기지원센터의 명칭이며, 수원·대구·경남울산·부산·인천·서울동부 등 전국 각지 센터가 포함됩니다.‘매각방법’은 공매, 매각중개, 수의계약, 기타 등으로 구분되며, 공매는 공개입찰을 통한 처분 방식이고, 매각중개는 외부 업체를 통한 중개 판매, 수의계약은 제한적 직접계약 방식입니다.‘상태’는 대부분 ‘매각완료’로 표시되어 있으며, 입찰 및 개찰일자 정보는 공매 방식에서만 기재되어 있습니다.‘감정금액’과 "매각금액’은 각각 사전에 평가된 자산가치와 실제 낙찰금액을 의미하며, 낙찰가가 감정가보다 현저히 낮은 사례도 일부 확인됩니다.‘공매품목’은 밀링기, CNC 선반, 머시닝센터, 방전가공기, 사출성형기, 생산라인 설비 등으로 다양하며, 중소 제조기업에서 활용하는 산업기계 중심입니다.‘공매품목’은 머시닝센터, 선반, 사출성형기, 생산설비 등 중소 제조업 관련 장비가 주를 이룹니다.이 데이터는 재기지원 업무의 실적 관리와 자산 회수 성과 파악에 활용될 수 있으며, 품목별 회수 흐름을 분석하는 기초자료로도 활용될 수 있습니다.
