description_portal: 데이터는 충청북도 옥천군 관내에서 부과된 지방세 중 납부 기한 내에 납부되지 않아 체납 처리된 세금의 현황을 기록한 자료입니다. 체납 세목에는 주로 취득세, 재산세, 자동차세, 지역자원시설세 등이 포함되며, 각 세목별 체납 세액, 체납 건수, 체납자 수 등 다양한 지표로 구성되어 있습니다.특히 이 데이터는 연도별 추이, 체납률(부과액 대비 체납액 비율), 체납 기간(1년 미만~3년 이상), 고액 체납자 유무, 행정처분 건수(압류·공매 등) 등 체계적인 분류를 통해 옥천군의 세정 행정 중 미수납 세액에 대한 구조를 파악할 수 있게 해줍니다.또한 읍·면 단위의 체납 분포, 징수 및 결손 처리 실적, 체납 사유 유형 분석 등을 통해 특정 지역 또는 대상군에 대한 집중적인 체납관리 전략 수립이 가능합니다. 본 데이터는 옥천군 재정 건전성 진단, 납세 문화 개선 정책, 행정감사 대응 자료로 활용될 수 있으며, 주민과 기업에게는 투명한 세정 정보로서 공공성과 신뢰성을 확보하는 데 중요한 역할을 합니다.
