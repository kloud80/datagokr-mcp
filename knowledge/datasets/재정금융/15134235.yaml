summary_user: 주택도시기금대출 심사시스템인 기금e든든에 등록된 주택도시기금 수요자대출 상품의 기본정보를 상품 한 건 단위로 담은 약 9.8KB 분량의 전국 범위 CSV 파일이다. 대분류·중분류·소분류·상품명, 상품설명, 적용 시작·종료일, 비대면신청 가능 여부가 들어 있다. 주택 구입이나 전세자금 대출을 알아보는 국민이 "지금 적용 중인 기금 대출 상품 중 은행에 가지 않고 온라인으로 신청할 수 있는 것은 무엇인가"를 확인하는 데 쓴다. 상품명(hug_fund_product)을 키로 같은 기관의 다른 기금e든든 데이터와 이어 쓰며, 지역 코드나 공간 키는 없다.
description_portal: '"기금e든든 상품기본정보"는 주택도시기금대출 심사시스템인 기금e든든에 등록된 주택도시기금 수요자대출 상품의 기본정보 데이터에 해당함. 해당 데이터에는 내부적으로 주택도시기금 수요자대출 상품을 분류하는 기준에 따른 상품대분류명, 상품중분류명, 상품소분류명, 상품명이 포함되어 있으며, 해당 상품의 상품설명, 대출상품이 시스템에 적용된 상품적용시작일 및 상품적용 종료일, 마지막으로 은행 내방 없이 기금e든든 홈페이지를 통해 신청할 수 있는지 여부인  비대면신청 가능여부 항목이 포함되어 있음'
