description_portal: 본 데이터는 경기도 안양시에서 운영 중인 안양사랑페이의 월별 발행 및 이용 실적을 집계한 정보이다. 지역경제 활성화 및 소상공인 지원을 목적으로 도입된 안양사랑페이의 운영 현황을 파악할 수 있도록 구성되었다. 주요 항목은 시군명, 기준년월, 월별 신규 가입자 수(명), 월별 충전액(백만원), 월별 사용액(백만원)으로 이루어져 있으며, 이를 통해 특정 시점의 이용 추세 및 경제적 효과를 분석할 수 있다.또한, 지역화폐의 확산 정도와 시민 참여율을 가늠할 수 있는 기초자료로서의 가치가 있다. 본 정보는 안양시의 소비 패턴과 지역 내 자금 순환 구조를 이해하는 데 유용하며, 향후 유사 사업의 기획 및 개선 방향 설정에 참고자료로 활용될 수 있다.
