description_portal: 지방세 세원 유형별 과세현황 데이터는 경상북도 영양군에서 과세된 지방세를 세목별·세원 유형별로 구분하여 제공하는 행정 재정자료입니다. 시도명, 시군구명, 자치단체코드, 과세년도, 세목명, 세원 유형명, 부과건수, 부과금액 등의 항목으로 구성되어 있으며, 영양군의 세수 구조를 정밀하게 분석하는 데 활용됩니다. 본 데이터는 주택, 건축물, 토지, 자동차 등 세원 유형별 부과 실적을 통해 어떤 자산군이 실제 지방세 수입에 기여하고 있는지를 보여주며, 세원 편중 여부, 과세 기반의 안정성, 행정자원 배분 효율성 등을 진단하는 데 유용합니다. 또한 세목 내 세원 유형 간 형평성 확보, 감면 제도 설계, 세무 정책 개선 등 다양한 행정·정책 수립의 기초자료로서 활용 가능성이 높습니다.
