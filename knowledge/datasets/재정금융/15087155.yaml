description_portal: '본 데이터는 2025년 부산광역시 동래구 관내에서 부과된 지방세에 대한 징수 실적을 정리한 자료로,세목별 부과와 실제 수납 현황을 비교하여 징수율과 재정 운용의 효율성을 파악할 수 있도록 구성된 지방세 통계 데이터입니다.이 자료는 지방세 징수율 분석, 세입 예측, 결손 관리 등 지방재정 정책 수립 및 세무행정 효율화를 위한 기초자료로 활용됩니다.데이터는 CSV 형식으로 제공되며, 주요 항목은 다음과 같습니다:자치단체코드: 동래구를 식별하는 고유 행정코드과세년도: 해당 과세 및 징수 실적이 발생한 연도세목명: 취득세, 재산세, 주민세, 자동차세 등 지방세 세목의 명칭부과금액: 해당 연도에 부과된 총 세액수납금액: 실제로 납세자가 납부한 금액환급금액: 과오납 또는 감면 등에 따라 환급된 세액결손금액: 징수가 불가능하다고 판단되어 결손 처리된 금액미수납금액: 연도 말까지 납부되지 않은 체납 잔액징수율: 부과금액 대비 실제 수납금액의 비율 (%, 세수 확보 지표)이 데이터를 통해 동래구의 세목별 징수 효율성, 결손 규모, 체납 관리 상태, 연도별 징수추세 등을 종합적으로 분석할 수 있으며,세수 확보를 위한 전략 수립, 고질 체납 대응, 세무행정 성과 평가 등 다양한 분야에 활용할 수 있습니다.본 자료는 부산광역시 동래구청 세무과에서 관리하며,필요 시 세목별 상세 내역, 월별 징수 흐름, 체납자 유형 분석 등 추가 정보는 별도 요청을 통해 확인할 수 있습니다.'
