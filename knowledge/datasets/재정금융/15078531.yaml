description_portal: 본 자료는 대구광역시 서구의 세목별 지방세 과세현황을 연도별로 정리한 통계이다. 자치단체별로 비과세 금액, 감면 금액 및 부과 금액을 바탕으로 산출된 비과세감면율을 포함하고 있으며, 해당 수치는 세수 전반에 대한 면제 및 감면 비율을 분석하는 데 활용된다. 자료는 교육세, 재산세, 주민세 등 개별 세목을 기준으로 구성되어 있으며, 자치단체 코드와 과세년도에 따라 구분된다. 이를 통해 지방자치단체의 조세감면 규모와 정책적 특성을 파악할 수 있으며, 지방세의 재정 기여도 및 감면 효과 분석 등에 유용하게 활용된다. 또한 세원 관리의 투명성과 공공재정 운용의 합리성을 제고하는 기초자료로서의 기능을 수행한다.
