description_portal: 한국무역보험공사(K-SURE)가 수출입기업의 환위험 관리를 위해 제공하는 환율 정보에 대한 데이터입니다. 1995년부터 2023년까지 기준일자별 전세계 통화별 매매기준율 및 미화환산율을 담고 있으며, 데이터를 활용하여 기간별 환율 변동에 대해 확인하실 수 있습니다. 관련된 공사 제도로는 환변동보험이 있으며, 환변동보험은 수출 또는 수입을 통해 외화를 획득 또는 지급하는 과정에서 발생할 수 있는 환차손익을 제거, 사전에 외화금액을 원화로 확정하여 환율변동에 따른 위험을 헤지(Hedge)하는 제도입니다.
