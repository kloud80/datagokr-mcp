summary_user: 신용보증기금 매출채권보험의 계약자·인수 관련 정보를 담은 파일 자료(zip, 약 144KB)로, 실측 컬럼은 보험 인수금지 기업별 관리 ID와 인수금지 사유 코드, 총자산·매출금액·부채비율, 구매자별 총보험금액과 책임잔액으로 이루어져 있습니다. 중소기업 거래대금 회수 위험을 연구하는 분석가가 '매출채권보험 인수가 거절된 기업은 자산 규모와 부채비율이 어떤 수준인가'를 확인하는 데 씁니다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 기업명·코드 매핑이나 같은 기관 자료끼리만 연결합니다.
description_portal: 이 데이터는 신용보증기금의 대표적인 중소기업 경영 안정 지원 제도인 매출채권보험의 운용 현황과 계약자 특성을 종합적으로 집계한 자료로, 계약자 변경 심사, 보험고객 기업형태 동향, 매출채권보험 미결업무 정보, 매출상담 내용, 패키지보험연계정보표 등의 핵심 테이블을 포함하고 있다. 본 데이터는 매출채권보험에 가입한 기업들의 다각적인 계약 및 상담 정보를 일부 제공함으로써, 중소기업의 거래대금 회수 불이행 위험 관리 실태와 보험 제도 운영의 효율성을 다각도로 분석할 수 있는 기반을 제공한다.
