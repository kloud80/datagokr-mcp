description_portal: 광주광역시 동구 계약정보공개시스템에서 관리하는 대금지급 데이터는 공공 계약이 체결된 후 계약 상대자에게 지급되는 금액의 내역을 투명하게 공개하기 위해 정리된 자료입니다. 이 데이터는 계약의 집행 단계에서 언제, 어떤 종류의 대금이, 어떤 기준으로 지급되었는지를 명확히 파악할 수 있도록 구성되어 있어 행정 투명성을 높이고 주민의 신뢰를 확보하는 데 중요한 역할을 합니다.각 지급 건은 순서와 번호를 통해 정리되며, 계약대장번호를 통해 특정 계약과 지급 내역이 서로 연결되도록 구성되어 있습니다. 지급이 어떤 성격인지 확인할 수 있도록 지급종류구분이 포함되어 있으며, 공사가 진행되는 회차별로 분할 지급되는 경우 이를 파악할 수 있도록 회차 정보가 함께 제공됩니다.실제 대금이 언제 지급되었는지는 지급일을 통해 확인할 수 있으며, 해당 차수에서 지급된 금액의 총합은 지급합계에 기록됩니다. 또한 지급 비율을 나타내는 지급율 항목은 전체 계약 금액 중 어느 정도가 지급되었는지를 한눈에 파악할 수 있도록 돕습니다.대금지급 정보의 조회 편의를 위해 정렬순서가 포함되어 있고, 내부 시스템 간 정보가 동일하게 반영되었는지 여부는 동기화여부를 통해 확인할 수 있습니다. 마지막으로 데이터기준일자는 해당 지급 정보가 어느 시점을 기준으로 업데이트되었는지를 보여 주어 자료의 신뢰성과 최신성을 판단하는 데 도움을 줍니다.이와 같은 대금지급 데이터는 공공사업 집행의 공정성과 투명성을 확보하는 데 중요한 근거가 되며, 주민에게는 공공재정이 어떻게 사용되고 있는지를 이해할 수 있게 하는 유용한 정보로 활용됩니다.
