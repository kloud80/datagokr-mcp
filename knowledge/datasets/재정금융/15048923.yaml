description_portal: '이 데이터는 기술보증기금의 지역별 대출 종류별 보증 및 사고 현황을 나타냅니다. 각 지역구분과 보증종류에 따라 보증 건수, 잔액, 사고 건수, 사고 금액 및 사고 비율을 제공합니다.데이터 구성연도구분: 보증 및 사고 현황이 기록된 연도와 분기 (예: 2015년1분기)지역구분: 보증 및 사고 현황을 구분하는 지역 (예: 수도권, 영남권)보증종류: 보증의 종류 (예: 대출보증, 비은행대출보증, 기타)법인보증건수: 법인에 대한 보증 건수법인보증잔액(억원): 법인에 대한 보증 잔액 (억원 단위)개인보증건수: 개인에 대한 보증 건수개인보증잔액(억원): 개인에 대한 보증 잔액 (억원 단위)법인사고건수: 법인에 발생한 보증사고 건수법인사고금액(억원): 법인에 발생한 보증사고 금액 (억원 단위)법인사고율: 법인에 대한 보증사고 발생 비율 (퍼센트 단위)개인사고건수: 개인에 발생한 보증사고 건수개인사고금액(억원): 개인에 발생한 보증사고 금액 (억원 단위)개인사고율: 개인에 대한 보증사고 발생 비율 (퍼센트 단위)이 데이터는 기술보증기금의 보증사고 현황을 지역별 및 보증 종류별로 분석할 수 있도록 돕습니다. 각 지역과 보증 종류에 따른 보증 건수, 사고 건수, 사고 금액을 파악할 수 있으며, 이를 통해 특정 지역과 보증 종류에서 발생한 사고의 규모와 발생 비율을 확인할 수 있습니다.'
