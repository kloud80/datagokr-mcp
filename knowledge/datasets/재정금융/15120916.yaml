summary_user: 신용보증기금이 접수·수행한 기술가치평가를 평가 건(기술가치평가ID)별로 담은 파일로, 국제특허분류·산업기술분류·과학기술분류와 제품명, 기술성·권리성·시장성·사업성 평가 범위, 경제적 수명·할인율·기여도 로열티율 같은 평가 변수를 담는다. 기술금융 분석가나 정책 담당자가 '어떤 기술 분야의 평가가 많고, 평가에 쓰인 할인율·로열티율은 어느 수준인가'를 살펴보는 데 쓴다. 전역 조인 키(사업자번호 등)는 없으므로 다른 데이터와는 국제특허분류명·산업기술분류명 같은 분류 이름을 맞춰 붙이거나 같은 신용보증기금 자료끼리만 이어 쓴다.
description_portal: 해당 자료는 신용보증기금의 경영지원중 기술가치평 접수 및 평가에 관련된 데이터로,접수 및 평가내용 등의 항목을 제공합니다. 이 문서는 신용보증기금의 업무 및 보증제도에 대한 종합적 안내 자료로서, 정책 설계자 및 이용자 모두에게 정보 접근성과 이해도를 높이기 위한 목적을 가지고 제작되었습니다. 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다.
