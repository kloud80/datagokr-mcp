description_portal: 회계연도별로 용도(행정재산, 일반재산)를 기준으로 분류된 용도별 국유지 현황 정보를 제공하는 데이터입니다. 항목에는 회계연도, 용도 구분, 필지 수(천), 면적(제곱킬로미터), 비율(퍼센트), 금액(억원)이 포함됩니다. 국유재산이란 국가가 행정목적을 수행하기 위해 필요로 하여 소유하고 있는 일체의 재산 및 국가의 부담이나 기부의 채납, 법령 또는 조약에 따라 국가소유로 된 재산을 말합니다. 국유재산은 그 용도에 따라 행정재산과 일반재산으로 구분되며, 행정재산의 종류는  공용재산(국가가 직접 청사, 관사 등으로 사용하는 재산), 공공용재산(국가가 직접 도로, 하천 등으로 사용하는 재산), 기업용재산(정부기업이 직접 사무용, 기업용 등으로 사용하는 재산), 보존용재산(국가유산, 국유림 등 국가가 보존하기로 결정한 재산)이 있습니다. 일반재산은 행정재산 이외의 모든 국유재산으로서 장래 행정목적, 재정수입 등에 제공하기 위해 보유한 자산입니다.
