description_portal: '부산광역시에서 운영하는 통합자금시스템은 시 재정과 자금 운용을 보다 효율적이고 체계적으로 관리하기 위해 다양한 재정 데이터를 제공합니다. 그중 기준잔고 데이터는 각 계좌의 자금 현황을 정확하게 파악하고 관리하는 데 핵심적인 역할을 합니다. 제공되는 데이터 항목은 다음과 같습니다.거래순번: 각 거래를 고유하게 식별할 수 있는 번호로, 거래 내역을 조회하고 관리할 때 기준이 됩니다.계좌번호: 자금이 관리되는 계좌의 고유 번호로, 각 계좌별 잔고와 거래 내역을 정확하게 추적할 수 있습니다.금고은행: 해당 계좌가 속한 은행을 나타내며, 시 재정 자금이 실제로 어디에 보관되고 운용되는지를 파악할 수 있습니다.기준금액: 특정 기준일을 기준으로 해당 계좌에 남아 있는 자금의 금액으로, 자금 운용과 재정 계획에 중요한 기준이 됩니다.이전기준금액: 이전 기준일의 계좌 잔고를 나타내어, 자금 변동과 흐름을 비교 분석하는 데 활용됩니다.자치단체코드: 계좌가 속한 자치단체를 식별하는 코드로, 시 및 구·군 단위의 자금 현황을 체계적으로 관리할 수 있습니다.최종자료변경일자: 데이터가 마지막으로 수정된 날짜를 기록하여, 최신성과 변경 이력을 확인할 수 있습니다.회계년도: 해당 데이터가 속한 회계 연도를 나타내며, 연도별 자금 관리와 회계 계획을 세우는 기준이 됩니다.회계코드: 계좌와 관련된 회계 항목을 구분하는 코드로, 예산, 결산, 자금 운용 등 다양한 회계 업무를 체계적으로 관리할 수 있습니다.이처럼 기준잔고 데이터는 부산광역시와 각 자치단체의 자금 현황을 정확하게 파악하고 관리하는 데 필수적인 정보를 제공하며, 체계적이고 효율적인 재정 운영을 지원하는 중요한 역할을 합니다.'
