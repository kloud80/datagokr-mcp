summary_user: 한국무역보험공사가 현지조사기관을 통해 수집한 해외 화장품 관련 바이어 기업 정보를 기업 한 곳당 한 행으로 담은 CSV 파일(약 64KB)로, 업종·상호·주소·전화·팩스·이메일·홈페이지를 포함한다. 화장품 수출기업이 "특정 국가에서 연락할 수 있는 화장품 바이어는 어디인가"를 찾아 해외 거래처 발굴과 마케팅 대상 선정에 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·업종명 같은 이름 매칭이나 같은 기관(무역보험공사)의 다른 바이어 정보와 업종코드 기준으로만 이어 쓴다.
