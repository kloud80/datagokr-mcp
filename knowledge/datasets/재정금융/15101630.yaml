summary_user: 관세청 수출입신고 자료를 대륙별·월별로 집계한 무역통계로, 대륙(아시아·북미·유럽·중남미·중동·오세아니아·아프리카 등)마다 수출·수입 건수와 금액(달러), 무역수지를 전국 단위로 담는다. 분석가나 수출기업이 "올해 중동 수출이 작년보다 늘었는가, 대륙별 무역수지는 어떻게 바뀌었는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 관세청의 국가별·품목별 수출입실적과는 대륙·국가 부호(statCd)와 이름을 맞춰 연결한다.
limits: 대륙 단위 집계라서 품목(HS)별·시도별 구성은 알 수 없고, 다른 데이터와 바로 묶을 공통 키가 없어 이름이나 코드를 직접 대응시켜야 한다. 행정구역 구분이 없는 전국 단위 통계다.
