summary_user: 중소기업은행이 제공한 2018년 1분기(1~3월) 통화별 재정환율을 기준통화·상대통화 쌍마다 월별 값 한 열씩 담은 1,460바이트짜리 CSV 집계 파일로, 포털 설명상 USD·JPY·GBP 등 43개 통화를 다룬다. 수출입 사업자나 분석가가 2018년 초 특정 외화와 원화 사이 기준 환율이 월별로 어떻게 움직였는지 확인하는 데 쓴다. 필드에 전역 조인 키가 없어서, 다른 환율·무역 데이터와는 통화 이름(통화코드) 매핑으로만 붙여 쓴다.
