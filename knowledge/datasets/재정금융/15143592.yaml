description_portal: '2026 중앙재정 유형별 재정운용 추이를 나타냅니다.* 2024년까지는 결산, 2025년, 2026년은 예산 기준•‌2026년 세입·수입 총계 규모는 2022년 결산 대비 212조 2,399억 원 증가(연평균 3.0%)- ‌ ‌ ‌ 국세수입은 같은 기간 5조 7,059억 원 감소(이하 연평균 0.1%), 자체수입은 66조 4,531억 원(5.2%), 정부내부수입 및 기타는120조 7,492억 원(4.4%), 보전수입 및 여유자금회수는 30조 7,435억 원(3.2%) 증가•‌2026년 세출·지출 총계 규모는 2022년 결산 대비 226조 4,390억 원 증가(연평균 3.2%)- 일반지출은 같은 기간 65조 2,779억 원(3.2%), 정부내부지출 및 기타는 106조 9,957억 원(4.7%), 보전지출 및 여유자금운용은54조1,655억 원(4.2%) 증가일반회계, 특별회계, 기금의 데이터를 포함합니다.•‌일반회계: 국세 등을 세입으로 하여 국가의 일반적 재정사업에 사용•‌특별회계: 목적세, 일반회계 전입금 등을 세입으로 하여 특정 목적사업에 사용•‌기금: 부담금, 기여금 등을 수입으로 하여 특정 목적사업에 사용- 기금은 예산과 달리 여유자금을 운용함에 따라 자산운용위원회의 설치 및 관련 지침 제정을 의무화이 자료는 2026회계기금 운용구조의 자료로서 공통적인 일러두기 사항은 아래와 같습니다.1. 본 자료집에 수록된 자료는 2024년도까지는 결산, 2025년도, 2026년도는 본예산 기준으로 작성하였습니다.가. 결산자료는 세입·세출외를 포함하지 않습니다.2. 본 자료집에 수록된 자료는 총계·총수입·총지출 기준으로 작성하였으며, 작성 기준이 다를 경우 그 기준을 별도 표시하였습니다.3. 본 자료집에 수록된 자료는 디지털예산회계시스템(dBrain+)에 기록되어 있는 예·결산 자료를바탕으로 작성하였습니다.4. 본 자료집에 수록된 자료는 소수점 이하 첫째 자리에서 반올림되었으므로, 세부 항목의 소계가합계와 일치하지 않을 수도 있습니다.'
