summary_user: 경기도가 사전정보공표로 공개하는 사업비 30억 원 이상 주요 사업 목록을 사업 1건 단위로 담으며, 사업시작연도·사업구분·실국·부서·사업내용과 국비·도비 금액이 들어 있다. 도민이나 분석가가 '경기도가 청년지원·도서관 건립 같은 대규모 자체사업에 어느 부서를 통해 도비를 얼마나 배정했는가'를 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 전역 조인 키가 없어, 실국·부서 이름이나 사업명을 매핑해 경기도 예산·세출 자료와 이어 써야 한다.
description_portal: 이 데이터는 경기도에서 사업비가 30억 원 이상인 주요 정책 사업 현황을 정리한 자료입니다. 항목으로는 사업구분명, 실국명, 부서명, 사업내용, 도비 등이 포함되어 있으며, 부서별 주요사업의 재정 배분 상태를 분석할 수 있습니다. 특히 청년지원, 여성복지, 도서관 건립 등 다양한 분야의 대규모 사업이 포함되어 있으며, 자체사업으로 분류되어 중앙정부 지원 없이 도 예산으로만 추진되고 있는 사업들이 주로 기록되어 있습니다. 데이터는 정책기획, 예산집행의 투명성 확보, 도민 대상 정보공개 등의 목적에 활용되며, 대규모 예산사업의 효과성 평가 및 타당성 분석 자료로도 활용 가능합니다..* 경기도의 사전정보공표자료 30억이상 주요사업 현황 2014년 이후 자료
