description_portal: 본 데이터는 지방세 세원이 되는 과세물건 유형별 부과 현황을 제공한다. 지방자치단체의 재정 수입원인 지방세를 세목과 세원 유형에 따라 구분하여 실적을 나타낸다. 과세년도, 세목명, 세원 유형명, 부과건수, 부과금액 등의 항목을 포함한다. 세목명은 취득세, 재산세 등 지방세법에 규정된 세금 종류이며, 세원 유형명은 각 세목별 과세 대상 물건이나 행위의 구체적 분류를 의미한다. 부과건수는 해당 세원 유형에 대한 과세 건수이고, 부과금액은 부과된 세액 총액이다. 본 데이터로 지역 재정의 세입 구조와 세원별 과세 규모를 파악할 수 있으며, 지방세 정책 수립과 재정 분석 기초 자료로 활용된다. 연도별 추이 분석으로 지역 경제 동향과 세수 변화를 확인할 수 있다.
