description_portal: 해당 파일은 신용보증기금이 운용하는 조사서 SMART 등급 데이터로, SMART등급명, 권리등급명, 기술등급명 등의 항목을 제공합니다.SMART등급은 별개의 코드북 없이 한국발명진흥회의 특허 등급 평가 서비스(SMART5)를 따르고 있는 바, 아래의 링크를  참고하여 주시기 바랍니다. https://smart.kipa.org/intro/valmodel.do 해당 자료는 내부 업무 개선, 정책 수립을 위한 참고자료, 대국민 안내 및 홍보용으로도 유용하게 활용될 수 있는 콘텐츠입니다. 또한, 다양한 사용자층의 이해 수준을 고려하여 시각적 요소와 함께 정보 접근성을 강화하였으며, 교육용 및 정책 홍보 자료로서도 활용도가 높습니다
