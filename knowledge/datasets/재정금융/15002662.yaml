description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 2014년 4월 30일 기준으로 관리한 휴양형 주거단지에 대한 세부 정보를 정리한 자료입니다. 데이터 항목은 구분, 면적, 건축면적, 건축연면적, 건폐율, 용적률, 높이(층수), 건축물용도, 객실수로 구성되어 있으며, 각 항목은 주거단지 내 건축 계획 및 시설 구성 현황을 구체적으로 나타냅니다. 면적과 건축면적, 건축연면적 항목은 부지 규모 및 건축물 규모를 파악할 수 있도록 수치로 제공되며, 건폐율과 용적률은 각 부지의 건축 효율성을 평가하는 지표로 활용됩니다. 높이 항목은 층수 기준으로 표시되어 있고, 건축물용도는 숙박시설, 상업시설, 복합시설 등 다양한 유형으로 구분되어 주거단지 내 기능별 구성을 보여줍니다. 객실수 항목은 숙박시설이나 복합시설 등 객실이 포함된 건축물에 한해 실제 객실 수가 명시되어 있으며, 해당하지 않는 용도는 ‘해당없음’으로 처리되어 있습니다. 이 데이터는 휴양형 주거단지의 공간 배치, 용도별 건축물 규모 비교, 시설 구성 비율 분석 등 다양한 도시계획 및 개발 전략 수립에 활용될 수 있는 기반 자료입니다.
