description_portal: '이 데이터는 광주광역시 서구 관내의 병원 및 보건기관 등의 집단급식소에 대한 기본 현황을 담고 있습니다. 각 집단급식소의 업태명(예: 병원, 요양병원, 복지시설 등), 업체명, 도로명 주소 및 지번 주소 등의 정보가 포함되어 있으며  CSV 파일 형태로 정리되어 있습니다.이 데이터는 관내 다중이용시설의 식품위생 관리 현황 파악, 위생점검 대상 선별, 공공급식 정책 수립 등에 활용될 수 있습니다. 특히 주소정보가 포함되어 있어 공간 분석(GIS) 기반의 급식소 분포 파악 및 감염병 확산 시 대규모 집단급식소 연계 대응 방안 수립에도 유의미한 참고자료로 활용됩니다.또한, 업태별(예: 요양병원, 복지시설 등) 급식시설 밀집 현황 파악을 통해 복지정책, 노인건강정책 등과 연계한 공공정책 기획 시 기초 자료로도 활용 가능합니다.'
