description_portal: '1. 구분: 건강보험(시트 1), 의료급여(시트 2)2. 주상병코드: I50, I11.0, I13.0, I13.23. 진료년도: 2014년~2023년4. 연령 기준:   - 건강보험: 연말 기준 19세 이상  - 의료급여: 30대 이상, 10세 단위 연령대로 구분5. 진료인원 및 건수: 중복제외 한 진료인원 수 및 진료 건수6. 입내원일수: 입원일수 혹은 외래 내원일수7. 진료비 : 공단부담금(기관부담금)과 본인부담금을 합한 요양급여 총액  - 단위: 건강보험은 천 원 단위, 의료급여는 원 단위   - 진료일 기준(한의분류 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 지급분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음※ 개인정보 보호를 위해 5 미만의 자료는 * 처리됩니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.* 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고'
