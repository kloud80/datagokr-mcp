description_portal: 이 데이터는 광주광역시 서구에서 발생한 코로나19 확진자 수를 일자별로 집계한 공공데이터로, 확진일자와 해당 일자의 확진자 수, 데이터 작성 기준일 등의 항목으로 구성되어 있습니다.지역 내 감염병 발생 현황을 시계열로 파악할 수 있으며, 방역 정책 수립, 감염병 대응 체계 마련, 학술연구 및 통계 분석 등에 활용도가 높습니다.또한 일자별 누적 데이터를 통해 감염병 유행 양상 및 확산 속도를 정량적으로 분석할 수 있어 행정기관 및 연구기관, 언론사, 시민들에게 중요한 기초자료로 제공됩니다.데이터는 csv 형식으로 연 1회 이상 갱신되며, 이용에 제한이 없는 공공저작물로 자유롭게 활용이 가능합니다.
