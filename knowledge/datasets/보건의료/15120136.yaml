summary_user: 만 20세 이상 건강보험 가입자·의료급여수급권자 중 뇌내출혈 관련 상병(I60-I62) 환자의 진료에피소드를 발생년도·성별·5세 연령군·소득수준·시도·구시군별로 집계해, 인년·실인원수·입원에피소드 발생건수·발생 28일 내 사망건수를 담은 전국 단위 파일이다. 보건 연구자나 지자체 담당자가 '우리 지역·소득계층에서 뇌출혈 발생률과 28일 내 치명률이 어느 정도인가'를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 광역시도·구시군 이름이나 코드 매핑, 또는 같은 공단 데이터의 코드로만 이어 쓴다.
description_portal: 'o 모집단: 해당년도 만 20세 이상 국민 건강보험 가입자 또는 의료급여수급권자(외국인 포함) o 내용: 해당년도 주·부상병 조건(I60-I62)의 만 20세 이상 환자의 진료에피소드 및 사망건수 o 진료에피소드 구축기준  - 진료개시일 간 간격이 28일 이내인 경우 동일한 진료에피소드로 간주함  - 선별조건    ① 1일 이상 입원 또는 1일 내 사망 또는 응급실 방문 또는 (최초발생 7일 내) 기관 간 전원    ② (최초발생 7일 내) 주 이용기관이 급성기병의원(요양병원 제외)인 경우    ③ (최초발생 7일 내) 주 이용기관에서 주·부상병 조건인 경우※ 국민건강보험공단과 원주세브란스기독병원 환경보건센터 공동 개발'
