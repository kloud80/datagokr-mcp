summary_user: 경기도 안양시 관내 병원·의원·치과·한의원 등 의료기관을 한 곳당 한 행으로, 종별·기관명·도로명주소·대표 전화번호만 담은 시 단위 현황 파일이다. 주민이 집 근처 의원이나 치과의 위치와 연락처를 찾거나, 분석가가 안양시 동네별 병의원 분포와 상권 신호를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 기관명이나 주소를 맞춰 붙여야 하며, 인허가 LOCALDATA나 건강보험 요양기관 정보와 잇는 것도 이 방식에 기댄다.
description_portal: '경기도 안양시의 의료기관 정보는 관내 병원, 의원, 치과, 한의원 등 다양한 의료시설의(의료기관종별,의료기관명,의료기관주소,의료기관전화번호)현황입니다.- 의료기관종별: 종합병원, 병원, 의원, 치과의원, 한의원 등- 의료기관명: 예) 안양샘병원, 한림대성심병원, ○○의원- 의료기관주소: 도로명주소 또는 지번주소- 의료기관 전화번호: 대표 연락처2025년 6월 26일 기준으로, 총 918개 의료기관이 등록되어 있습니다.데이터활용예시-응급의료기관 및 야간진료 병원 찾기- 지역별 의료기관 분포 분석- 보건소 및 공공의료시설 정책 수립- 병원·의원 위치 기반 서비스 개발공공데이터포털의 안양시 의료기관 정보에서 csv파일로 다운로도하거나 오프API를 통해 활용할 수 있습니다.'
