summary_user: 식약처가 승인한 의약품 임상시험을 건별로 담으며, 시험마다 신청자, 승인일, 실시기관명, 제품명, 시험제목, 임상 단계, 임상시험정보 일련번호가 들어 있다(전국 범위, 비공간). 제약사·연구자가 "특정 제품이나 신청 업체의 임상시험이 언제 어느 단계로 승인됐고 어느 병원에서 하는가"를 확인하거나, 환자가 특정 의료기관에서 진행 중인 임상시험을 찾는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 식약처 허가정보 같은 데이터와는 제품명·신청자(업체명)·실시기관명 같은 이름 매칭으로만 연결해야 한다.
limits: 품목기준코드나 표준코드 같은 전역 키가 실측 컬럼에 없어, 심평원 약가·급여 목록과 코드로 바로 붙일 수 없다. 이름으로 매칭할 때는 표기 차이를 맞춰야 한다.
