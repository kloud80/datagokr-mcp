summary_user: 서귀포시에서 2025년 추석 연휴(10월 3일~9일) 동안 문을 여는 병원·의원·약국을 기관 한 곳당 한 행으로 담은 파일로, 읍면동·의료기관 종별·기관명·주소·대표전화와 날짜별 운영 여부를 포함한다. 주민이나 안내 콘텐츠 제작자가 "연휴 중 특정 날짜에 우리 동네에서 문 여는 병원·약국은 어디인가"를 확인하거나, 행정기관이 연휴 비상진료 공백 지역을 점검하는 데 쓴다. 전역 조인 키는 없어 다른 의료기관 인허가 데이터와는 기관명·주소를 맞춰 이어야 하고, 지역 단위 비교는 읍면동 이름(읍면동구분)으로 묶는다.
description_portal: 제주특별자치도 서귀포시가 제공하는 ‘연휴의료기관진료현황’ 데이터는 추석 등 긴 연휴 기간 동안 지역 내에서 운영되는 병원, 의원, 약국 등의 정보를 정리한 공공자료입니다.이 데이터에서는 읍·면·동 행정구역, 의료기관 종별(병원·의원·약국 등), 기관명, 주소, 대표 전화번호, 각 날짜별 운영 여부(연휴 첫날부터 종료일까지), 데이터 기준일자 등을 포함하고 있어 연휴 기간 중 의료 접근 가능한 시설의 분포와 운영 현황을 한눈에 파악할 수 있습니다.이를 통해 비상진료 정책 기획, 응급의료 안내 시스템 제작, GIS 기반 의료 접근성 분석, 보건 행정의 연휴 대응체계 점검, 민원 대응 및 지역 주민 안내 콘텐츠 제작 등 다양한 목적에 활용할 수 있으며 행정기관, 의료 정책 연구자, 응급 대응 체계 설계자 등에게 유용한 데이터입니다.
