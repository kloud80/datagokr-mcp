summary_user: 경상남도 창녕군에 등록된 한의원을 한 곳당 한 행으로 담은 파일로, 한의원 이름, 도로명 주소, 전화번호, 진료과목이 들어 있습니다(약 1.5KB csv). 창녕군 주민이나 방문객이 집 근처 한의원과 연락처를 찾을 때, 분석가가 군내 한의원 분포를 주소 단위로 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 한의원 이름이나 주소 문자열로 맞춰 이어 써야 하며, LOCALDATA 의료기관 인허가 자료와 대조할 때도 같은 방식으로 연결한다.
description_portal: 경상남도 창녕군의 의료기관 중 한의원 현황에 대한 정보입니다.1. 본 자료에는 창녕군에 등록된 한의원의 명칭, 대표자 성명, 한의원 주소(도로명 주소 기준), 연락처(일반전화번호) 등의 기본적인 정보를 포함하고 있으며, 창녕군 내 한의원 현황을 파악할 수 있도록 구성되어 있습니다.2. 데이터 기준일은 2026년 5월 8일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 보건소 보건정책과 의약관리팀(055-530-7523)으로 문의 주시기 바랍니다.
