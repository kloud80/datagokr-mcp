summary_user: 경기도 내 안경업체를 사업장 한 곳씩 담은 건별 인허가 자료로, 인허가일자·영업상태·폐업일자·소재지 주소와 좌표, 연면적, 그리고 시력표·표본렌즈·정점굴절계·렌즈절단기 같은 안경조제·시력검사 장비 보유 수를 담는다. 분석가나 창업 예정자가 "우리 시군에 영업 중인 안경점이 몇 곳이고 최근 몇 곳이 문을 닫았나"처럼 지역별 분포와 개폐업 흐름, 장비 보유 수준을 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 정제 주소를 이름·코드로 매핑해 같은 기관(경기도)의 다른 인허가 현황이나 행정구역 자료와 잇는다.
description_portal: '이 데이터는 각 지방자치단체 내 안경업체의 운영 현황을 파악할 수 있는 자료로, 업체의 인허가 정보, 영업상태, 소재지, 사용 중인 의료기기 및 시설 면적 등의 정보를 포함하고 있습니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태명, 소재지시설전화번호, 연면적, 시력표 수, 표본렌즈 수, 측정의자 수, 동공거리측정기 수, 정점굴절계 수, 조제용연마기 수, 렌즈절단기 수, 가열기 수, 안경세척기 수 등이 있으며, 일부 항목은 안경조제 및 시력검사 관련 의료기기 보유 여부를 수치로 제공하고 있습니다. 이 데이터는 지역 내 안경업체 분포 및 장비 보유 현황을 분석하거나, 보건정책 수립, 소비자 접근성 향상, 의료기기 보급현황 파악 등 다양한 공공 및 민간 목적에 활용될 수 있습니다.이해가능성 점수 : 17.6점 (키워드 7개, 설명 478자)(3) 용어해설 :정점굴절계 : 눈의 굴절 이상(근시, 원시, 난시 등)을 자동으로 측정하는 장비조제용연마기 : 안경 렌즈를 안경테에 맞춰 연마하는 장비로, 렌즈 제작에 필수적임표본렌즈 : 시력 측정을 위한 다양한 도수의 렌즈로 구성된 렌즈 세트동공거리측정기 : 안경 제작 시 좌우 눈동자 중심 사이의 거리(PD)를 측정하는 장비'
