summary_user: 국립나주병원 한 곳의 입원 재원자 수를 진료일별로 건강보험·의료급여·산업재해·자동차보험·차상위 등 보험유형 열로 나눠 담은 집계 파일(CSV, 약 164KB)이다. 공공의료 연구자나 정책 담당자가 국립 정신의료기관 입원 환자 중 의료급여·차상위 등 취약계층 비중이 날짜에 따라 어떻게 달라지는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 진료일(날짜)이나 기관명으로만 맞춰 이어 쓴다.
description_portal: 국립나주병원에 입원 중인 재원자 수를 일별로 정리한 이 데이터는 병원의 의료서비스 제공 현황과 재원자 분포를 파악할 수 있는 자료입니다.이 데이터는 진료일, 보험유형(건강보험,비보험,산업재해,의료급여1종,의료급여2종,의료급여2종 장애인,임상,자동차보험,차상위1종,차상위2종,차상위2종 장애인)으로 구분되어 있습니다.이러한 데이터는 입원 환자들의 유형별 분포를 분석하거나, 정책 수립을 위한 기초자료로 활용할 수 있습니다.또한 환자군별로 필요한 의료서비스나 지원 방안을 마련하는 데 도움을 줄 수 있습니다.
