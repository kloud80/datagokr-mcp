summary_user: 대전광역시 대덕구 관내 의료기관이 보유한 특수의료장비(MRI·CT·유방촬영장치)를 장비 한 대당 한 행으로 담은 파일이며, 기관명·도로명 주소·전화번호·장비명·용도 또는 부위·모델명·형식명을 포함한다. 구민이 'MRI나 유방촬영 검사를 받을 수 있는 대덕구 병원이 어디인가'를 찾거나, 분석가가 지역 내 고가 영상장비의 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 의료기관명이나 도로명 주소(의료기관소재지)를 맞춰 이어 써야 한다.
description_portal: 대전광역시 대덕구 관내 의료기관에서 보유중인 특수의료장비 현황에 대한 정보입니다.특수의료장비 28대에 관한 자료가 등록되어있습니다.(자기공명영상촬영장치(MRI) 7대, 전산화단층촬영장치(CT) 8대, 유방촬영용장치 13대)데이터는 의료기관명, 의료기관 주소, 전화번호, 의료장비명, 의료장비 용도 및 부위, 형식명, 모델명, 데이터 기준일로 구성되어 있습니다.해당 데이터는 구민들에게 지역 내 의료자원 분포 파악자료 및 의료기관을 효율적으로 선택하고 이용하는 데 도움을 주며 특수의료장비 설치 등에도 참고자료로 활용될 수 있습니다.
