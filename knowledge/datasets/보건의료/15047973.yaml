summary_user: 부산 금정구 관내에 의료기기 수리업으로 신고된 업소를 한 곳당 한 행으로 담은 작은 목록 파일(csv 약 1.4KB)로, 순번·영업소명·도로명 소재지만 들어 있다. 금정구에서 고장 난 의료기기를 맡길 수리업소가 어디 있는지 찾는 병원·사업자나, 관내 수리업소 분포와 지도점검 대상을 파악하려는 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명이나 도로명 주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 이 자료는 관내에서 「의료기기법」 제16조 및 같은 법 시행규칙 제35조에 따라 의료기기를 수리하는 업(의료기기 수리업)으로 신고된 업소의 현황을 정리한 것입니다.각 영업소의 순번, 영업소명, 소재지(도로명 주소) 항목으로 구성되어 있습니다.의료기기 수리업이란, 고장이나 이상이 발생한 의료기기를 점검·정비하거나 부품 교체 등의 방식으로 성능을 회복시키는 업무를 말하며, 관련 사업자는 해당 법령에 따른 시설 기준과 책임관리자 지정 요건을 갖추고 관할 관청에 신고해야 합니다.본 데이터는 의료기기 수리업소의 분포 현황 파악, 행정관리 및 지도점검 등을 위한 기초자료로 활용되며, 데이터에 포함된 항목의 해석이나 세부 기준은 「의료기기법」 및 관련 지침을 참고해 주시기 바랍니다.
