summary_user: 포항시 관내에서 의약품 공급업을 하는 업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 영업소명·도로명 소재지·전화번호·데이터기준일로 구성되며 파일 크기가 572바이트에 불과한 소규모 자료다. 포항 지역 약국이나 의료기관, 관련 사업자가 "포항시 안에 있는 의약품 도매·공급업체는 어디이고 연락처는 무엇인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 도로명 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: 포항시의약품공급업체공공데이터는시민과의료기관,약국,관련사업자가지역내의약품유통및공급기반현황을쉽게확인할수있도록제공하는자료이다.본데이터는포항시관내에서의약품공급업을영위하는업체의기본현황을정리한것으로,의약품유통체계의기초자료이자관련행정업무의투명성과활용성을높이기위한목적으로구축된다.주요항목은영업소명,영업소소재지,영업소전화번호로구성되어있다.영업소명은해당공급업체의정식명칭을나타내며,영업소소재지는업체의실제영업장위치를확인할수있는정보로현장확인,위치파악,행정관리등에활용된다.영업소전화번호는업체와의연락을위한기초정보로민원응대,업무문의,유관기관협조시에유용하게사용될수있다.이자료는의약품공급업체현황을체계적으로파악하여지역보건의료자원의분포를이해하고,관련기관의업무효율성을높이는데의의가있다.또한시민에게는지역내의약품공급관련사업체정보를제공하고,행정기관에는지도·점검,현황관리,정책기초자료로활용될수있는공공데이터이다.필요시최신인허가사항변동에따라현행화될수있다.
