description_portal: 서울특별시 용산구 담배꽁초상습무단투기지역현황(연번, 도로명주소, 지번주소, 상세위치)에 대한 정보를 제공합니다. 해당지역은 주무관이 경험적으로 자주 단속하는 지역이며 관리 데이터가 아님을 안내드립니다. 용산구는 현대적 오피스공간과 전통적 주거공간이 혼재된 지역이 많습니다. 선정된 지역들은 다이소 남영역점 옆 골목, 한강대로변의 주상복합인 호만써밋에이디션 인근, 삼각지의 평양집 앞 골목 등입니다. 이들의 공통점은 역세권이며 직장인들의 사무실에서 가깝고 식당가가 밀집되어 있는 지역입니다. 직장인들이 식사를 마치고 인근의 골목으로 들어가 흡연을 하고 꽁초를 버리는 공통점이 발견되고 있습니다. 이에 용산구는 이들 공통점에 주목하여 대로변과 주택가가 혼재되어 유동인구가 많은 곳 위주로 담배꽁초 단속구역을 확대하고 있습니다. 이 구역에 대해서는 무단투기단속원들의 수시순찰과 계도활동, 현장단속 과태료부과가 실시되고 있습니다. 구청에서는 오피스 밀집 건물들에 대한 홍보활동에 주력하고 각 오피스 내 흡연장 설치등을 권고하는 활동에도 주력하고 있습니다.
