description_portal: '평택시 자동심장충격기(AED) 위치 데이터는 평택시 대표 홈페이지 DB 데이터로서, 심정지 환자 발생 시 골든타임 내 신속한 대응을 가능하게 하고, 시민의 생명·안전 보호를 강화하기 위해 AED 설치 장소와 접근성을 체계적으로 관리하여 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 주변 AED의 위치와 이용 가능 시간을 쉽게 확인할 수 있으며, 민간·연구기관은 응급의료체계 분석, 안전지도 서비스 개발, 긴급출동 지원 시스템 구축, 지역별 안전취약도 평가 등 다양한 분야에서 데이터를 활용할 수 있습니다. 본 데이터에는 AED 설치 주소, 설치 건물명, 기기대수, 세부 위치 등이 포함되어 있어 지역 응급의료 인프라를 정확하게 파악하는 데 중요한 정보를 제공합니다. 이러한 자료는 심정지 대응 역량 강화, 응급안전 정책 수립, 시민 안전 교육, 민관 협력 기반의 응급대응 서비스 고도화 등 공공·민간에서 활용할 수 있는 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
