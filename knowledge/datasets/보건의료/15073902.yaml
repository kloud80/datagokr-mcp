summary_user: 의료기기 GMP(제조 및 품질관리 기준) 심사를 신청한 품목을 건별로 담으며, 허가번호·품목명·등급·형명, 제조자명·국가·주소, 심사청·심사방식·최초심사 여부·진행상태·수출용 여부 등을 포함하고 범위는 전국이다. 의료기기 제조·수입업체나 분석가가 "우리 품목의 GMP 심사가 지금 어느 단계에 있고 어느 심사청에서 처리 중인가"를 확인하거나 심사 지연 현황을 모니터링하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 허가번호·품목명·제조자명 같은 이름·번호 매핑으로만 식약처 의료기기 품목허가 정보 등과 이어 쓴다.
limits: 공통 조인 키가 없어 다른 데이터와 자동으로 정확히 결합하기 어렵고, 이름 매칭에 의존해야 한다. 개발계정은 하루 10,000회 호출 한도가 있다.
