summary_user: 서울특별시 관악구 안의 약국을 한 곳씩 담은 목록 파일로, 약국명·소재지 도로명주소·전화번호·데이터기준일을 개별 업소 단위로 제공한다. 주민이나 행정 담당자가 '우리 동네 가까운 약국은 어디이고 연락처는 무엇인가', 분석가가 '관악구 생활권별로 약국이 얼마나 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 약국명이나 도로명주소를 맞춰 붙이거나 주소를 지오코딩해 이어 써야 한다.
limits: 관악구 한 시군구만 담으므로 서울 전체나 다른 구와의 비교에는 다른 자치구 데이터를 따로 모아야 한다. 고유 식별 코드가 없어 다른 약국·인허가 데이터와 이으려면 이름·주소 매칭에 의존해야 한다.
