description_portal: '- 전라남도내 시군의 보건소현황(보건소명, 전화번호, 도로명 주소, 위치 등)에 관한 데이터를 조회하실 수 있습니다.- 보건소는 지방자치단체(시·군·구)가 운영하는 공공의료기관으로, 지역 주민의 건강을 증진하고 감염병을 예방하며 보건 행정을 수행하는 지역 보건의 중심기관입니다.- 보건소는 1차 진료, 건강검진, 예방접종, 만성질환·모자보건·정신건강 등 종합 보건 서비스를 제공합니다.- 각 보건소에는 보건진료소 및 보건지소가 산하에 있어 읍·면 주민들도 가까운 곳에서 이용할 수 있습니다.- 전화번호로 운영시간, 검진 항목, 접종 가능 여부 등 구체적인 정보 문의가 가능합니다.- 운영 시간: 보통 평일 오전 9시 ~ 오후 6시 (점심시간 12~1시)'
