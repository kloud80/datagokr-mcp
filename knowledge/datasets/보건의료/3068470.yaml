summary_user: 전라남도 시군 보건소를 한 곳씩 담은 목록 파일로, 보건소명·일반전화·팩스·우편번호·도로명주소·진료과목·진료시간을 개별 기관 단위로 담는다(csv 약 2.3KB). 주민이나 분석가가 '우리 군 보건소 주소와 전화번호, 진료과목·진료시간은 무엇인가'를 확인하거나 시군별 보건소 위치를 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 보건소·지역 건강지표 데이터와는 보건소명이나 도로명주소의 시군 이름으로 맞춰 이어 써야 한다.
