summary_user: 은평구 내 기업·기관·군부대 등이 소속 구성원과 가족의 건강관리를 위해 개설한 부속의료기관을 건별로 담은 인허가 원천 데이터로, 사업장명·소재지(지번·도로명)·인허가일·폐업일·영업상태·중부원점TM 좌표·병상 수 등을 포함한다. 분석가나 지자체 담당자가 '은평구에서 현재 운영 중인 사내 부속의원은 어디이고 언제 개설·폐업했나'를 확인하거나 관내 부속의료기관 관리·감독의 기초 자료로 쓴다. 실측상 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 개방자치단체 코드(OPNSFTEAMCODE)·관리번호 기준으로만 이어 쓰며, 같은 LOCALDATA 인허가 형식의 타 시군구·병의원 데이터와 나란히 비교하는 데 적합하다.
description_portal: '은평구의 부속의원, 부속병원, 군부대시설, 의무대 등 해당 소속 지원, 종업원 및 그 가족의 건강관리를 위한 의료기관 정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내의 기관 또는 기업이 소속 직원, 구성원 및 그 가족의 건강관리를 위해 개설한 부속의료기관의 인허가 현황을 담고 있습니다 . 데이터에는 각 부속의료기관의 명칭, 소재지 주소, 최초 신고(허가)일, 현재 영업 상태(영업중, 폐업 등)와 같은 특정 집단의 건강관리를 위한 의료시설 운영의 핵심 정보가 포함되어 있습니다 .이 데이터는 일반 대중을 진료 대상으로 하지 않는다는 점에서 일반 병·의원 데이터와 구분됩니다. 부속의료기관은 「의료법」에 따라 그 개설 목적이 소속 구성원의 건강관리로 한정되어 있으며, 외부인 진료는 원칙적으로 금지됩니다 . 따라서 이 데이터는 특정 기업이나 단체의 직원 복지 수준과 건강 관리 시스템 운영 현황을 파악하는 데 활용될 수 있습니다. 또한, 지자체는 이를 통해 관내 부속의료기관을 관리·감독하고, 관련 법규가 제대로 준수되고 있는지 확인하는 기초 자료로 사용합니다 .'
