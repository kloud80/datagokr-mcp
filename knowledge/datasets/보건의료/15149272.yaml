description_portal: '본 데이터는 대전광역시 관내 2023년과 2024년 신증후군출혈열(HFRS) 현황을 담고 있으며, 이는 설치류에 존재하는 한타바이러스(예: 한탄바이러스, 서울바이러스 등) 감염 및 전파와 관련된 정보를 제공합니다. 한타바이러스는 설치류 체내에 존재하며, 이들의 배설물(침, 분변, 소변 등)을 통해 공기 중으로 퍼져 사람에게 감염을 일으킬 수 있습니다. 데이터에는 환자의 검사일, 성별, 나이(검사일 기준), 그리고 검사 결과(음성, 미결정, 양성) 등이 포함되어 있으며, 지역사회 내 신증후군출혈열 발생 추이를 분석하고 예방 및 방역 정책 수립에 활용될 수 있습니다. 또한, 이를 통해 특정 시기나 집단에서의 감염 양상을 파악하고, 향후 감염병 관리 체계 고도화를 위한 기초자료로 활용하는 데 의미가 있습니다.'
