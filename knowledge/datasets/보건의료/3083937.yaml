description_portal: '서울특별시 동대문구에 소재한 공중위생업소 현황(* 공중위생업소 : 숙박업, 목욕장업, 이용업, 미용업, 세탁업, 건물위생관리업)2. “숙박업”이라 함은 손님이 잠을 자고 머물 수 있도록 시설 및 설비등의 서비스를 제공하는 영업을 말한다. 다만, 농어촌에 소재하는 민박등 대통령령이 정하는 경우를 제외한다.3. “목욕장업”이라 함은 다음 각목의 어느 하나에 해당하는 서비스를 손님에게 제공하는 영업을 말한다. 다만, 숙박업 영업소에 부설된 욕실 등 대통령령이 정하는 경우를 제외한다.가. 물로 목욕을 할 수 있는 시설 및 설비 등의 서비스나. 맥반석ㆍ황토ㆍ옥 등을 직접 또는 간접 가열하여 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스4. “이용업”이라 함은 손님의 머리카락 또는 수염을 깎거나 다듬는 등의 방법으로 손님의 용모를 단정하게 하는 영업을 말한다.5. “미용업”이라 함은 손님의 얼굴, 머리, 피부 및 손톱ㆍ발톱 등을 손질하여 손님의 외모를 아름답게 꾸미는 다음 각 목의 영업을 말한다.가. 일반미용업: 파마ㆍ머리카락자르기ㆍ머리카락모양내기ㆍ머리피부손질ㆍ머리카락염색ㆍ머리감기, 의료기기나 의약품을 사용하지 아니하는 눈썹손질을 하는 영업나. 피부미용업: 의료기기나 의약품을 사용하지 아니하는 피부상태분석ㆍ피부관리ㆍ제모(除毛)ㆍ눈썹손질을 하는 영업다. 네일미용업: 손톱과 발톱을 손질ㆍ화장(化粧)하는 영업라. 화장ㆍ분장 미용업: 얼굴 등 신체의 화장, 분장 및 의료기기나 의약품을 사용하지 아니하는 눈썹손질을 하는 영업마. 그 밖에 대통령령으로 정하는 세부 영업바. 종합미용업 : 가목부터 마목까지의 업무를 모두 하는 영업6. “세탁업”이라 함은 의류 기타 섬유제품이나 피혁제품등을 세탁하는 영업을 말한다.7. “건물위생관리업”이라 함은 공중이 이용하는 건축물ㆍ시설물등의 청결유지와 실내공기정화를 위한 청소등을 대행하는 영업을 말한다.'
