summary_user: 코로나 전화상담이 가능한 센터를 기관 한 곳당 한 행으로 담은 전국 범위의 원천 목록으로, 기관명·시도·시군구·주소·전화번호·운영 시작일·위경도 좌표를 포함한다. 국민이 '우리 동네에서 코로나 관련 전화상담을 받을 수 있는 곳과 연락처는 어디인가'를 확인하거나, 분석가가 상담 가능 기관의 지역별 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름 매칭이나 위경도 좌표 기반의 공간 결합으로 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 코로나 전화상담 가능 센터 정보입니다.
