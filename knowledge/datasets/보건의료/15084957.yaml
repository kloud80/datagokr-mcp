description_portal: '○ 통계개요* 통계명 : 청소년 구강건강* 통계종류 : 조사통계, 일반통계* 근거법령 : 국민건강증진법 제19조* 작성목적 : 청소년(중·고등학생)의 건강행태에 대한 현황파악을 통해 청소년건강증진사업 계획 및 평가를 위한 기초자료 제공* 조사체계 : 표본학교→보건복지부(질병관리본부) - 학교컴퓨터실에서 일괄조사* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 청소년 구강보건에 대한 응답률○ 용어설명* 칫솔질 실천율 : 최근 7일 동안 학교에서 점심식사 후 칫솔질을 "항상" 또는 "대부분" 한 사람의 분율* 연간 실란트(치아홈메우기) 경험률: 최근 12개월 동안 실란트(치아홈메우기)를 받은 적이 있는 사람의 분율* 운동이나 사고로 인한 치아 파절률: 최근 12개월 동안 치아가 깨지거나 부러진 사람 중에서 운동이나 사고로인해 치아가 깨지거나 부러진 사람의 분율○ 기타* 중1~고3 학생을 대상으로 실시'
