description_portal: 전라남도 함평군은 군민의 건강 보호와 생활환경 위생 수준 향상을 위해 관내 공중위생업소 현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군에 등록된 이·미용업, 숙박업, 목욕장업 등 다양한 공중위생업소에 대한 정보를 포함하고 있으며, 업종명, 업소명, 영업소 주소, 소재지 전화번호 등의 항목으로 구성되어 있습니다. 해당 데이터는 지역별 업종 분포 파악, 위생 점검 대상 관리, 감염병 대응 및 민원 처리 기반 마련 등에 활용될 수 있으며, 공공위생 정책 수립, 생활안전 정보 시스템 구축, 위생업소 이용자 안내 서비스 등 다양한 행정 및 민간 서비스 개발에도 유용한 공공자원입니다.
