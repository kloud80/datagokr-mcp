summary_user: 간호간병통합서비스를 운영하는 의료기관의 병동 수와 병상 수를 기준년도(포털 설명상 2015~2022년)·종별(상급종합병원·종합병원·병원)·기관명·병동구분(일반·재활)별로 담은 전국 단위 파일(csv)입니다. 분석가나 환자·보호자가 '어느 병원이 간호간병통합서비스 병동을 몇 병상 운영하며 연도별로 얼마나 늘었는가'를 확인하는 데 쓴다. 기관 코드 같은 공통 조인 키가 없어 요양기관 기본정보 등 다른 데이터와는 기관명 매칭으로만 이어 쓴다.
description_portal: '□ 데이터 개요간호간병통합서비스를 운영하는 기관의 병동 및 병상 현황을 연도별로 정리한 자료로, 의료기관 종별 및 병동구분에 따라 병동 수와 병상 수를 제공합니다.□ 주요 항목 설명1. 기준년도: 2015년부터 2022년까지 연도별 현황2. 종별: 의료기관의 종별 구분(상급종합병원, 종합병원, 병원)3. 병동구분: 병동의 운영 유형(일반, 재활)4. 병동수: 해당 기준년도, 종별, 병동구분에 따른 병동의 수5. 병상수: 해당 기준년도, 종별, 병동구분에 따른 병상의 수* 본 자료는 민원인의 요청에 따라 2023년 8월 10일 기준으로 발췌된 데이터입니다.'
