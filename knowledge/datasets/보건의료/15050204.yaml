summary_user: 국세청 국세통계연보를 바탕으로 연도별 전국 주세 부과세액(백만 원)과 그 구성비를 탁주·맥주·희석식 소주·위스키 등 13개 주종과 합계로 나눠 담은 집계 파일입니다. 음주폐해예방 정책 분석가나 연구자가 어떤 주종에서 주세가 얼마나 걷히고 그 비중이 해마다 어떻게 바뀌었는지 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 주종 이름을 맞춰 연결해야 하며, 같은 기관의 절주(알코올 조세 및 가격) 지표와 함께 쓰는 것이 자연스럽다.
description_portal: 음주폐해예방 관련 지표- 국세청 국세통계연보 자료를 바탕으로, 주요 주종별 부과세액과 그 구성비를 산출한 것입니다. - 부과세액은 백만 원 단위로 제시되며, 합계와 함께 탁주, 약주, 청주, 맥주, 과실주, 증류식 소주, 희석식 소주, 위스키, 브랜디, 일반 증류주, 리큐르, 기타 주류, 주정 항목으로 구분되어 집계됩니다. - 2005년부터 2007년까지는 수입분을 제외한 부과세액을 기준으로 하였고, 2008년부터 2019년까지는 수입분을 합산하여 산출하였습니다. 다만 2020년 이후부터는 수입분 과세표준이 통계자료로 생산되지 않아 합산하지 않고, 국내분 기준으로만 제시됩니다.
