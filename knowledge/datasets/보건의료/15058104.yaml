summary_user: 경기도 내 정신의료기관(정신건강의학과 병원·의원)을 기관 한 곳당 한 행으로 담은 목록으로, 시군명·병원구분·기관명·지번/도로명 주소·우편번호·WGS84 위경도·전화번호·홈페이지를 포함한다. 경기도 주민이나 분석가가 '우리 시군에 정신건강의학과 의원이 어디에 몇 곳 있는가'처럼 정신과 진료 기관의 위치와 연락처, 지역별 분포를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명으로 시군 단위 통계와 묶거나 위경도·주소로 다른 위치 데이터와 공간 매칭해 이어 쓴다.
description_portal: 이 데이터는 보건복지부에서 제공하는 경기도 내 정신의료기관(정신건강의학과) 현황을 정리한 자료입니다. 주요 항목에는 시군명, 병원구분명, 기관명, 소재지 지번주소와 도로명주소, 소재지 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL이 포함되어 있습니다. 이를 통해 경기도 내 정신건강의학과 전문 병원 및 의원의 분포를 확인할 수 있으며, 기관별 위치와 연락처, 홈페이지를 통해 구체적인 진료 서비스 정보를 파악할 수 있습니다. 해당 데이터는 지역사회 정신건강 인프라 분석, 병상 및 의료자원 배치, 정신질환 치료 접근성 평가, 보건의료 정책 수립 및 연구에 활용될 수 있습니다.
