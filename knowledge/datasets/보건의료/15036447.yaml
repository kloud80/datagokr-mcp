summary_user: 대전광역시 유성구 관내 의료기관이 보유한 특수의료장비를 장비 한 대 단위로 담은 파일로, 의료기관명·종별·도로명 소재지와 장비 종류·모델명·형식명·제조번호, 관리기관 정보를 포함하며 포털 설명상 32행 규모입니다. 주민이나 분석가가 '유성구에서 특정 특수의료장비를 갖춘 병의원이 어디에 있는가'를 확인하거나 관내 장비 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가·현황 데이터와는 의료기관명이나 도로명 주소를 맞춰 이어 써야 한다.
description_portal: 대전광역시 유성구 특수의료장비 현황에 대한 데이터를 제공합니다.해당 데이터는 의료기관명, 의료기관종별, 의료기관 소재지, 의료장비종류, 모델명, 형식명, 제조번호, 관리기관명 등의 데이터를 포함하여, 총 32개의 행으로 구성되어 있습니다.해당 데이터는 정기적으로 현행화하여 공개하고 있습니다.이 데이터는 유성구 관내 의료기관의 특수의료장비종류 현황 등의 정보를 포함하고 있어 데이터 이용자의 정보 접근성과 행정자료 검색의 효율성 향상에 기여할 수 있습니다. 이를 통해 정책 분석, 행정자료 활용, 공공행정 연구 등 다양한 분야의 기초 자료로 활용이 가능합니다.
