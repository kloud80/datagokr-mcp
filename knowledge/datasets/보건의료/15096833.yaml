summary_user: 제주특별자치도의 만성질환 급여 현황을 기준 연도·시군구·질병 구분별로 진료실인원, 내원일수, 급여일수, 진료비, 급여비(천원)로 집계한 통계로, 포털 설명상 2006~2019년을 다루며 출처는 KOSIS 국가통계포털이다. 보건 분석가나 지자체 담당자가 '제주시와 서귀포시에서 고혈압·당뇨 같은 만성질환 진료비와 환자 수가 연도별로 어떻게 변했나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구 이름이나 질병 구분 이름을 맞춰 연결해야 한다.
description_portal: '제주특별자치도 만성질환 급여 현황 데이터로, 2006~2019년 제주 질병 구분별 진료실인원과 내원일수, 급여일수 등의 정보를 제공합니다.급여비: 총 진료비 중 법이 정한 환자 본인 부담금을 제외하고 보험자가 요양기관에 지급한 금액입니다.진료비: 요양기관에서 건강보험 환자 진료에 소요된 비용으로 공단 부담금과 환자 본인 부담금을 합한 금액이며, 의료기관에서 청구한 총 진료비 중 심사 결정된 진료비입니다.급여일수: 내원일수에 원내 투약일수를 포함한 일수. 단, 내원과 투약이 중복된 날은 1일로 산정, 약국 처방 건의 요양일수는 투약일수를 의미합니다.내원일수: 진료비 청구 명세서상 기재된 건강보험, 의료급여, 보훈환자 및 자동차보험 환자가 실제로 요양기관에 방문 또는 입원한 일수입니다.진료실인원: 건강보험 가입자 중 1년간 실제 진료받은 환자 수입니다.데이터 제공처: KOSIS 국가통계포털'
