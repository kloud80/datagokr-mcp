summary_user: 인천광역시 계양구 관내 의원을 기관 한 곳당 한 행으로 정리한 파일로, 의료기관명·종별·도로명 주소·전화번호를 담는다(시군구 범위, 개별 주소 단위). 계양구 주민이 집 근처 의원을 찾아 연락처를 확인하거나, 분석가가 구 안의 의원 분포를 주소 기준으로 살펴보는 데 쓴다. 공통 조인 키가 없어 LOCALDATA 병의원 인허가 자료나 다른 의료기관 목록과는 기관명·도로명 주소를 맞춰 이어 써야 한다.
limits: 전역 조인 키(기관 코드 등)가 없어 다른 데이터와의 연결은 이름·주소 매칭에 의존하므로 표기 차이로 누락·오매칭이 생길 수 있다. 계양구 한 곳만 다루므로 인천시 전체나 타 지역과 비교하려면 다른 자료가 필요하다.
