description_portal: '은평구의 의료기기를 수리하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다이 데이터는 **서울특별시 은평구 내 의료기기수리업 영업소에 대한 인허가 현황 및 상세정보(예: 사업장명, 주소, 전화번호, 영업상태, 인허가일자 등)**를 제공합니다.각 사업장별로 수리하는 의료기기 종류, 지번/도로명 주소, 인허가 및 폐업일자, 좌표정보 등의 컬럼을 포함하고 있으며, 의료기기 관리, 보건의료 안전 강화, 창업입지 분석, 지역 의료 인프라 연구 등 다양한 분야에서 활용 가능합니다.컬럼 예시사업장명 (수리업소 상호)사업장주소 (지번/도로명)전화번호영업상태명 (정상, 휴업, 폐업 등)인허가일자 (YYYY-MM-DD)폐업일자 (있을 시)수리대상 의료기기 유형 (예: 영상진단기기, 환자감시장치 등)좌표정보 (중부원점TM, EPSG:2097)지정번호/사업자번호(해당시)자치구명활용 예시의료기기 안정성, 서비스 가이드라인 정책 수립불법·무등록 영업소 단속, 보건 안전성 모니터링창업·폐업 등 인허가 동향 분석 및 정책자료로 활용응급·보건서비스 인프라 지도 및 DB 분석수집 및 최신성은평구청 스마트정보과에서 「의료기기법」, 각종 보건·위생 관리 규정에 의거, 사업자 인허가 및 변경사항을 상시로 수집·등록하며, 주소 좌표는 TM(중부원점) 좌표계 기준으로 제공됨.기타 유의사항사업장 정보는 행정등록 기준, 일부 영업상태 변경 및 폐업 반영까지 일정 지연이 있을 수 있음좌표정보는 중부원점TM만 제공(위경도 미포함), 활용 시 변환 필요'
