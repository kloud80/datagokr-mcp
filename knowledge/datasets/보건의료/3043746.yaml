summary_user: 원주시 안에 있는 의원급 의료기관을 기관별 한 행으로 담은 CSV 파일(약 64KB)로, 기관명·도로명 주소·전화번호·병상 수·관리기관을 기록한다. 시민이 '우리 동네 근처 의원 연락처와 병상 규모'를 찾거나, 분석가가 원주시 의원 분포를 주소 단위로 살펴볼 때 쓴다. 전역 조인 키(기관 코드 등)가 없어 다른 의료기관 데이터와는 의료기관명이나 주소를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 강원특별자치도 원주시 내에 소재한 의원급 의료기관, 한의원, 보건진료소 등 지역 의료 시설의 상세 정보를 투명하게 공개하여 시민의 의료 이용 편의를 획기적으로 증진시키기 위해 구축되었습니다. 해당 기관의 등록 및 운영 신고 정보를 공적 자료를 통해 주기적으로 수집하고 정제했습니다. 시민들이 신속하고 정확하게 의료기관 정보를 파악할 수 있도록 데이터의 신뢰성을 최우선으로 확보했습니다. 모든 정보는 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있으며, 시민들의 보편적인 의료 접근성 향상에 기여하는 것을 목표로 합니다.
