description_portal: 동물약국 인허가 정보는 반려동물·축산동물에 사용하는 의약품을 소매 판매할 수 있도록 허가받은 약국의 인허가일자, 영업상태명, 소재지주소, 업종분류 등 행정 정보를 포함한다. 동물약국은 처방전 없이 구매 가능한 일반 동물약품을 공급하는 기능을 담당하여 반려동물 건강관리의 접근성을 높인다. 본 자료는 중부원점TM(EPSG:2097) 좌표계 기반의 위치정보만 제공하며 위경도는 미포함, GIS 기반 분포 분석 시 변환이 필요하다. 또한 3일 전 기준 최신 인허가 정보를 제공하여 업소의 영업 변동을 신속히 관리할 수 있다. 동물약국 데이터는 동물의약품 접근성 평가, 반려가구 증가 대비 정책 수립, 품질·규제 관리에 활용된다.
