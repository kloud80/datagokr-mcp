summary_user: 대전광역시 내 약국, 안전상비의약품판매업소(편의점 등), 의약품도매상을 업소 한 곳당 한 행으로 담은 현황 파일이며, 2023년 1월 1일 기준 업종·업체명·소재지 주소·전화번호를 담는다. 시민이 "우리 동네에서 상비약을 살 수 있는 곳이나 가까운 약국이 어디인가"를 찾거나, 분석가가 대전 자치구별 의약품 판매처 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·주소를 맞추는 방식으로만 잇고, 주소를 좌표로 바꿔 의료기관 위치 데이터와 겹쳐 보는 정도로 쓴다.
