summary_user: 부산광역시 기장군 관내 산후조리원을 시설 한 곳당 한 행으로 담은 목록 파일로, 원명·도로명/지번주소·위경도·전화·이용시간·주차·와이파이 여부·대표자명이 들어 있으며 파일 크기가 348바이트에 불과해 수록 시설은 몇 곳 안팎이다. 기장군에 사는 산모나 가족이 '집 근처 산후조리원이 어디 있고 연락처·주차 여부는 어떤가'를 확인하거나, 분석가가 군 단위 산후조리 시설 분포를 지도에 올리는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소 문자열 매칭이나 위경도 좌표로 이어 붙여야 하며, LOCALDATA 산후조리원 인허가 자료와 대조할 때도 같은 방식으로 연결한다.
