summary_user: 서울 강서구 관내 치과기공소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 사업장명·주소·전화·인허가일자·폐업일자·영업상태와 함께 기공용 장비(전기로·주조기·석고트리머 등) 보유 수량 항목이 들어 있다. 강서구에서 지금 영업 중인 치과기공소가 어디에 몇 곳 있는지, 최근 어떤 업소가 새로 문을 열거나 폐업했는지 확인하는 데 쓰며, 의료업 개폐업을 지역 상권 신호로 보는 분석에도 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 전역 조인 키가 없어서, 같은 LOCALDATA 인허가 계열 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호나 사업장명·주소 매칭으로 연결한다.
description_portal: 서울특별시 강서구 관내 치과기공소에 대한 인허가 관련 정보를 제공합니다. 이 데이터는 인공치아나 의치 등의 치과 보철물을 제작하거나 보수하는 전문기술업소에 대한 것으로, 사업장명, 주소, 전화번호, 인허가일자, 영업상태 등의 항목이 포함되어 있습니다. 기공소는 치과의사의 처방에 따라 치과보철물을 제작하는 역할을 하며, 보건복지부의 관련 기준에 따라 등록된 업소만이 기공 업무를 수행할 수 있습니다. 해당 정보는 강서구 내 치과기공소의 분포 및 운영현황을 파악하고 의료기공 산업의 지역별 현황을 이해하는 데에 활용될 수 있습니다.
accrual_periodicity: 수시
