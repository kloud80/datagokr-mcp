description_portal: 본 데이터는 2020년 1월부터 2023년 8월까지 서울특별시 강동구 관내 코로나바이러스감염증-19(COVID-19) 확진자 및 사망자 발생 현황을 행정동별·월별로 집계한 통계 자료입니다.강동구 각 행정동의 월별 확진자 수와 사망자 수를 제공하여, 코로나19 유행 기간 동안 지역별 감염 확산 양상과 시기별 발생 추이를 확인할 수 있습니다. 이를 통해 특정 행정동 또는 기간별 감염병 발생 규모를 비교·분석하고, 지역 내 감염병 확산 패턴을 파악할 수 있습니다.본 자료는 감염병 확산 모델링, 지역별 보건·의료 정책 연구, 방역 취약지역 분석, 향후 감염병 대응체계 수립 등을 위한 기초자료로 활용할 수 있습니다.
