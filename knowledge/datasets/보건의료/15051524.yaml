summary_user: 근로복지공단 소속 산재병원의 외래환자 수(명)를 연도·병원별로 요양기간 구간(6개월 미만부터 10년 이상까지 7구간)에 따라 나눠 담은 집계 통계로, 범위는 전국이며 위치 정보는 없다. 정책 분석가나 산재 재활 담당자가 '어느 산재병원에 요양기간 10년 이상인 장기 외래환자가 많은가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원 이름을 맞추거나 같은 기관(근로복지공단)의 다른 소속병원 통계와 연도·병원명으로만 이어 쓴다.
description_portal: '이 데이터는 근로복지공단 소속병원(산재병원)을 이용한 산재 외래 환자의 현황을 요양 기간별(6개월 미만, 1년 미만, 2년 미만, 3년 미만, 5년 미만, 10년 미만, 10년 이상)로 세분화하여 집계한 통계 자료입니다. 통계는 각 연도별, 병원별로 요양 기간 구간에 해당하는 외래 환자 수(명)를 제공합니다. 이 자료는 산재 근로자들이 재해 후 치료 및 재활을 위해 공단 병원을 이용하는 장기 요양 수요의 패턴을 명확하게 보여줍니다. 특히, 요양 기간이 10년 이상인 만성기 환자의 규모와 지역별 분포를 파악하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 산재 재활 서비스의 효율적인 자원 배분 및 만성기 환자 관리 정책 수립에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 요양 기간이 장기화되는 환자(예: 5년 이상, 10년 이상)의 추이와 그들이 이용하는 병원의 특성을 분석할 수 있습니다. 이를 통해 장기 요양 환자를 위한 특화된 재활 프로그램이나 심리 사회적 지원의 필요성을 진단하고, 만성기 환자 관리 시스템을 강화하는 방안을 모색할 수 있습니다. 또한, 이 통계는 소속병원별 외래 진료의 효율성과 재활 사업의 성과를 평가하는 데 기여할 수 있다고 판단됩니다.'
