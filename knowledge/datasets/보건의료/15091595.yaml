summary_user: 보건소 모바일 헬스케어 사업 참여자가 채움건강앱에 직접 입력하거나 체성분기기로 연동한 체성분 측정 기록을 건별로 담으며, 측정일자·대상자 식별코드·체중·체질량지수로 구성된 전국 범위의 비공간 CSV 파일(약 88KB)이다. 보건 분석가가 모바일 헬스케어 참여자의 체중과 체질량지수가 측정일에 따라 어떻게 변하는지 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 사업의 다른 측정 파일과는 식별코드로 맞춰 보는 정도로만 잇고, 지역 단위 건강지표와는 직접 연결하지 않는다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.보건소 모바일 헬스케어 사업의 대상자가 채움건강앱을 통해 체성분을 수기 입력하거나 체성분기기를 통해 연동하는 체성분 정보로서 측정일자, 식별코드, 체중, 체질량지수가 있습니다.
