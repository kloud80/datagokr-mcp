summary_user: 부산광역시 서구 관내 약국을 한 곳당 한 행으로 담은 목록 파일로, 약국명칭·전화번호·도로명 소재지를 제공한다(포털 설명 기준 2026년 5월 100개소). 주민이 서구에서 가까운 약국의 위치와 연락처를 찾거나, 분석가가 구 단위 약국 분포를 동별로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 약국명이나 도로명 주소를 맞춰 붙여야 한다.
description_portal: '부산광역시 서구 소재 약국에 대한 데이터로 관내 약국(100개소) 의 업소명, 소재지(도로명), 전화번호 등의  항목을 제공합니다. 신규 개설, 폐업, 이전, 명칭 변경, 소재지 변경 등의 변경 사항이 있을 경우 데이터를 수정하고 있으며, 분기별 업데이트 예정입니다.해당 약국 리스트 클릭 시 약국정보를 볼 수 있습니다. 2026년 2월 기준 98개소 -> 2026년 5월 기준 100개소(2개소 개설)입니다.서구  약국은 동대신동13개소, 서대신동 26개소, 부민동 2개소, 아미동21개소, 충무동19개소, 남부민동7개소, 암남동12개소입니다.서구 공공심야약국은 2개소( 정화약국:서대신동 소재, 영광약국: 동대신동 소재)이 지정되어 있습니다. (22:00~01:00운영)https://www.e-gen.or.kr/egen/egenmain.do 응급포털 사이트로 확인하고 방문하시기 바랍니다.기타 문의사항: 부산 서구 보건소 보건행정과 의약계 담당자(051-240-4871) 문의'
