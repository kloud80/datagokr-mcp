description_portal: 서울특별시 강서구 내에서 발생한 흡연 관련 민원건수, 단속실적, 지정된 흡연구역(흡연부스) 위치 및 수량 등에 대한 종합적인 정보를 제공합니다. 특히 공공장소에서의 간접흡연 피해를 줄이기 위한 민원접수 현황과 행정기관의 단속 건수는 지역 내 금연정책의 실행력을 측정하는 중요한 지표로 활용될 수 있습니다. 흡연부스의 설치 위치나 설치 수량 등의 공간정보도 포함되어 있으며, 주민의 생활권 내 흡연행태 분석, 금연구역 정책 수립, 흡연자 편의와 비흡연자 보호 간의 균형을 맞추는 행정적 근거자료로서 의미가 큽니다. 또한, 건강도시 조성과 관련된 주민 생활환경 평가나 공공시설 이용 실태와 연계한 분석도 가능하여, 향후 도시계획, 공공보건정책, 금연구역 지정 확대 등에 있어 참고자료로 활용될 수 있는 데이터입니다.
