summary_user: 인천 중구(현 영종구) 관내 휴일 지킴이 약국의 약국명·전화번호·소재지를 약국 한 곳당 한 행으로 담은 소규모 CSV 파일(약 4.6KB)이다. 주말·공휴일·명절에 문을 연 가까운 약국을 찾으려는 주민이나, 지역 휴일 약국 안내 서비스를 만드는 개발자가 '이번 휴일에 우리 동네에서 문 연 약국이 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 약국·의료기관 데이터와는 약국명이나 소재지 주소를 맞춰 연결해야 한다.
description_portal: 인천광역시 중구 관내에 위치한 휴일 지킴이 약국 현황에 대한 데이터 입니다.휴일지킴이 약국에 대한 공공데이터는 주말, 공휴일, 명절 등 일반 약국이 문을 닫는 날에도 운영하는 약국의 정보를 제공하는 데이터입니다. 이 데이터는 국민들이 응급 상황이나 급작스러운 약 복용이 필요한 경우 가까운 휴일 운영 약국을 빠르게 찾을 수 있도록 돕기 위해 제공됩니다. 주요 항목에는 약국명, 주소, 전화번호, 운영 시간, 위치 좌표 등이 포함되어 있으며, 보건복지부 및 각 지방자치단체와 연계되어 주기적으로 갱신됩니다. 이 데이터는 응급약 처방, 해열제 구입 등 시민 건강과 직결되는 중요한 정보로 활용됩니다. 공공데이터 포털 및 응급의료포털을 통해 접근 가능하며, 모바일 앱 등 다양한 서비스에서도 응용되고 있습니다.파일명 인천광역시_중구_휴일 지킴이 약국 현황파일내용 약국명칭, 전화번호, 소재지 등
