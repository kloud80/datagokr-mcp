description_portal: '이 데이터는 전북특별자치도 내에 운영 중인 모든 장사시설의 현황을 종합적으로 정리한 목록입니다. 화장장, 공설 자연장지, 공설 봉안시설(납골당) 등 시설의 종류별로 구분되어 있으며, 각 시설의 공식 명칭, 시군 단위의 위치, 관리 주체(예: 시군청, 시설관리공단, 민간 법인), 연락처, 그리고 최초 설치 연도까지 상세하게 기록되어 있습니다. 이 자료는 도민들에게 필요한 장례 정보를 제공하는 공공 서비스의 일환이며, 지역별 장사시설의 분포와 운영 현황을 파악하여 관련 정책을 수립하고 관리하는 데 중요한 기초 자료로 활용됩니다.'
