description_portal: 영도구 홈페이지에서 제공하고 있는 관내 의료기관에 대한 정보를 포함하고 있는 데이터입니다.해당 데이터는 의료기관명칭과 의원, 치과의원, 한의원 등 의료기관 종별, 민간 및 국공립 등 설립 구분, 의료기관 소재지으로 구성되어 있습니다.관내 의료기관에서는 지역 주민의 의료 접근성을 높이기 위해 종합병원, 의원, 치과, 한의원 등 다양한 진료과목의 기관으로 구성되어 있습니다. 응급의료, 전문 진료, 예방·건강관리 서비스를 제공하며, 지역보건소와 연계해 공공보건 기능도 수행함을 알려드립니다.
