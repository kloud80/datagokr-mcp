summary_user: 경기도 공공의료기관의 간호간병통합서비스 운영 현황을 의료기관별로 기준연도·월 단위로 담은 통계로, 시군명과 함께 병상 수와 서비스 제공 건수를 수록한다. 정책 분석가나 지자체 담당자가 "경기도 어느 시군의 공공병원에서 간호간병통합서비스 병상이 부족한가"처럼 지역 간 제공 격차를 비교하는 데 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)이나 의료기관명(medinst_nm) 같은 이름 매핑으로만 다른 의료기관·지역 데이터와 연결한다.
description_portal: 이 데이터는 경기도 내 공공의료기관에서 제공되는 간호간병통합서비스의 운영 현황을 시군별로 정리한 통계자료입니다. 각 의료기관별로 연도와 월 기준으로 병상 수와 실제 서비스 제공 건수를 수록하고 있어, 지역 간 의료서비스 제공 격차 분석이나 간호간병통합서비스 확대 정책 수립 시 유용하게 활용될 수 있습니다. 주요 항목은 ‘기준년도’, ‘기준월’, ‘시군명’, ‘의료기관’, ‘병상수’, ‘서비스수’로 구성되어 있으며, 공공보건정책, 병상자원 관리, 지역 간 의료 불균형 해소 등의 다양한 분석 목적에 적합합니다. 간호간병통합서비스의 지역별 운영 규모와 서비스 제공 상황을 파악할 수 있습니다.
