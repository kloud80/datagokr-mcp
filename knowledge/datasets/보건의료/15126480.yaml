description_portal: '1. 데이터명: 경산시 폐의약품 수거함 현황2. 데이터 개요:본 데이터는 경상북도 경산시 관내에 설치된 폐의약품 수거함의 소재지 명칭 정보를 제공하는 공공데이터입니다.불용·유효기간 경과 의약품의 올바른 처리를 유도하고, 시민의 보건 안전 및 환경 보호를 도모하기 위해 제공되는 자료로,시민들이 가까운 수거함 설치 장소를 쉽게 파악하고 활용할 수 있도록 지원합니다.3. 포함 항목:수거함 설치 장소의 명칭, 도로명 주소4. 활용 목적:폐의약품의 안전한 배출과 환경오염 방지시민 대상 분리배출 캠페인, 행정 안내자료 기반약국 및 보건소 등 수거 협력 기관의 효율적 관리5. 기대 효과:시민들의 폐의약품 분리배출 실천을 유도하고,불법 투기 및 환경오염을 예방하여 지속가능한 생활환경 조성에 기여합니다.또한 공공기관의 의약품 관리 행정에도 참고자료로 활용됩니다.'
