summary_user: 성남시 관내에서 안전상비의약품을 파는 점포를 한 행씩 담은 목록으로, 구별·판매점포명·도로명 소재지·전화번호·데이터기준일자를 담는다. 시민이 "우리 구에서 밤에 해열제·소화제를 살 수 있는 편의점이 어디인가"를 찾거나, 분석가가 구별 판매처 분포로 의약품 접근성을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구 이름이나 도로명 주소를 매칭해(필요하면 주소를 좌표로 변환해) 약국·의료기관 목록 등과 이어 쓴다.
description_portal: 성남시 안전상비 의약품 판매업 현황 자료는 성남시 관내에서 안전상비 의약품을 판매하는 점포들의 정보를 담고 있습니다. 이 자료는 구별, 판매점포명, 주소, 전화번호, 데이터 기준일자 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 응급상황에서 가까운 판매처를 쉽게 찾아 이용할 수 있도록 돕고, 의약품 접근성 향상을 위한 기초자료로 활용 할 수 있습니다.
