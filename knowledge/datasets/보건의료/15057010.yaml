summary_user: 경기도 안 의료법인을 사업장 한 곳당 한 행으로 담은 인허가 현황으로, 명칭·인허가일자·영업상태·지번/도로명 주소·위경도 좌표·특수/일반 구급차 대수가 들어 있다. 시군별 의료법인 분포와 폐업 여부를 확인하거나, 어느 지역에 구급차를 갖춘 법인 병원이 모여 있는지 비교하려는 보건정책 분석가와 지자체 담당자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 법인명·주소 매칭이나 경기도 시군코드(SIGUN_CD)로 잇고, 위경도로 공간 결합한다.
description_portal: 이 데이터는 경기도 내 의료법인의 현황을 정리한 자료로, 의료법인 명칭, 인허가일자, 영업 상태, 소재지 주소, 병상 수, 종업원 수, 구급차 보유 대수 등의 정보를 포함하고 있습니다. 의료법인은 병원·요양병원·의료원 등을 운영하는 비영리 조직으로, 지역 내 의료 서비스 공급의 중추적 역할을 수행합니다. 본 자료는 각 법인의 설립 현황과 운영 상태, 보유 자원(병상, 구급차, 인력 등)을 파악할 수 있어 지역별 의료 인프라 수준을 비교·분석하는 데 활용됩니다. 또한 보건의료 정책 수립, 응급의료 체계 개선, 공공성과 민간 의료 협력 모델 설계 등에서 중요한 기초자료로 사용될 수 있습니다.
