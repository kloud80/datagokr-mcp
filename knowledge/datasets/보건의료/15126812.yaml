summary_user: 2020~2022년 월별로 전국·17개 시도(수진자 주민등록지 기준)별 특정 정신질환 주상병(F20~F41, F70~F90, F95)에 대해 연령(20세 미만/이상)·요양기관종별·진료과목(정신건강의학과 여부)별 진료인원·진료건수·진료비(천원)를 집계한 파일이다. 정신건강 정책 담당자나 분석가가 '시도별로 우울·불안 관련 상병 진료인원이 어떻게 변했고, 정신건강의학과 이외 진료과에서 얼마나 진료받는가' 같은 질문에 쓴다. 전역 조인 키가 없어 시도명·상병코드(KCD)·진료년월을 이름·코드 매핑으로 맞춰 다른 지역·질병 통계와 이어 쓴다.
description_portal: '1. 진료년월: 2020~2022년 월단위(진료일기준)2. 주소지: 전국 및 17개 시도 단위(수진자 주민등록지 기준)3. 주상병코드: F20~F41, F70~F90, F95(주상병명 본 파일 확인)4. 연령: 20세 미만, 20세 이상(연말기준)5. 요양기관종별: 상급종합병원, 종합병원, 병원, 정신병원, 의원 등6. 진료과목코드: 정신건강의학과, 정신건강의학과 이외7. 각 구분별 건강보험 급여실적(의료급여 제외)이며 한의분류 및 약국 제외, 비급여 제외  - 2023년 6월 지급분까지 반영※ 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라   일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음※ 민원인의 공공데이터 제공 신청에 의해 2024-02-21 발췌'
