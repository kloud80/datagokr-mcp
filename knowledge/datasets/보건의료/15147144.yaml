summary_user: 서울 강북구의 병원·종합병원·치과병원 등 입원시설을 갖춘 의료기관을 인허가 건별로 담으며, 인허가일·폐업일·영업상태, 소재지 주소, 병상·병실 수, 면적, 중부원점TM 좌표(X·Y)를 포함한다. 분석가나 창업자가 '강북구에서 최근 문을 닫거나 새로 연 병원은 어디인가'처럼 병원 개폐업을 상권 변화 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 구·업종의 LOCALDATA 인허가 자료와는 같은 기관 코드(OPNSFTEAMCODE)나 사업장명·주소 매칭으로 이어 쓴다.
description_portal: '서울시 강북구 병원 인허가 정보: 강북구의 병원, 종합병원, 치과병원 등 의사가 환자를 진찰 및 진료하는데 필요한 설비가 갖춰있으며, 30명 이상의 환자를 수용할 수 있는 시설을 갖춘 의료기관 정보* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
