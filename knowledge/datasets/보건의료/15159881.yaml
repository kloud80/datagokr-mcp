description_portal: '본 데이터는 한국보건산업진흥원의 원본 데이터를 기반으로, 대구광역시 수성구 관내 소재 의료기관 현황만을 추출 하여 작성한 맞춤형 데이터셋 입니다. 글로벌 의료관광에 대한 수성구의 의료 인프라를 파악할 수 있는 자료 데이터로, 외국인 환자가 안심하고 방문할 수 있는 관내 병·의원, 한의원, 치과의원 등의 정보를 포함하고 있습니다.주요 내용: 유지 상태, 의료기관 상호명, 대표자명, 기관 구분(병원/의원/한의원 등), 소재지 지역 및 상세 주소활용 추천 분야: 외국인 의료관광 앱/웹 서비스 개발, 수성구 스마트 헬스케어 인프라 분석, 다국어 의료기관 맵 제작, 상권 및 의료 자원 분포 연구 등특이사항: 주소지 기준 대구광역시 수성구 관내 의료기관 데이터입니다. 기관의 상태 정보(유지 등)는 수시로 변동될 수 있으므로 주기적 확인이 필요합니다.'
