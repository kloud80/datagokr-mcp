summary_user: 김해시에서 보건증(건강진단결과서)을 발급하는 민간의료기관을 기관 한 곳당 한 행으로 담은 파일(약 1.2KB)이며, 병원명·전화번호·주소·위도·경도와 함께 보건증·채용신체검사·기숙사진단서의 소요기간(일)과 비용을 싣는다. 김해시에서 식품·위생 업종 취업이나 기숙사 입소를 준비하는 사람이 "집 근처 어느 병원에서 보건증을 가장 빨리, 싸게 받을 수 있나"를 비교하는 데 쓴다. 전국 공통 조인 키는 없어 행정동코드·행정동명으로 김해시 행정동 단위 자료와 맞추거나, 위도·경도로 지도·상권 자료에 겹쳐 쓰고, 다른 의료기관 자료와는 병원명·주소를 대조해 연결한다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 의료기관 인허가(LOCALDATA) 등 다른 자료와는 병원명·주소 매칭으로만 이을 수 있다. 범위는 김해시 한 곳의 민간의료기관에 한정되며, 보건소 발급 정보나 다른 시군구 기관은 들어 있지 않다.
