description_portal: '본 데이터는 경상북도 김천시 관내에 설치된 자동심장충격기(AED)의 위치와 기본 정보를 포함한 공공안전·응급의료 기반 데이터입니다.시민의 심정지 등 응급상황에 대한 초기 대응력 확보, 심폐소생 응급장비의 접근성 향상, 공공시설 내 생명보호 인프라 확충을 목적으로 제공됩니다.주요 설치장소는 김천시 보건소, 보건지소, 보건진료소 및 다중이용 공공건물(도서관, 체육관, 터미널, 주민센터 등)이며,제공 항목에는 설치기관명, 설치 장소명(건물명 및 위치), 주소 정보(도로명·지번 포함), 위도/경도 좌표, 전화번호가 포함되어 있습니다.이 데이터는 위치기반 지도 서비스(GIS)와 연계하여 응급환자 발생 시 주변 AED 위치 확인, 공공안전계획 수립, 심폐소생술 교육 및 대응 네트워크 구축 등 다양한 응용 분야에서 활용이 가능합니다.유의사항 : 설치장소가 건물 내부에 있는 경우, 개방 시간 외 이용이 불가할 수 있으므로 위치 외에 이용 가능 시간 확인이 필요합니다.'
