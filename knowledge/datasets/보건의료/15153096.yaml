summary_user: 전국 보건소의 사업장명, 인허가일자, 영업상태, 폐업일자, 진료과목, 의료인 수, 병상 수, 병실 수, 도로명·지번 주소, 위도·경도 같은 현황을 보건소 한 곳씩 담는다. 주민이나 분석가가 우리 시군구 보건소가 어디에 있고 어떤 진료과목과 의료인력을 갖췄는지, 지금 운영 중인지 확인할 때 쓴다. 전역 조인 키는 실측되지 않아 시군구코드(SGG_CD)·시군구명이나 보건소 이름으로 맞춰 지역사회 건강조사 같은 시군구 단위 건강지표와 잇고, 위경도로 지도에 올려 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 지역정보개발원에서 제공하는 보건소 현황(진료과목, 위치, 의료인수 등) 정보입니다.\""
