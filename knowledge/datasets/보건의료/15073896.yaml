summary_user: 의료기기 유해사례 보고 건별로 대상업체, 유해사례 인지일·발생일·종료일, 의료기기와의 인과관계, 최초보고일자, 대상 제품의 수입·판매·보유 수량 등을 담는 전국 단위 API 데이터입니다. 분석가나 업체 담당자가 특정 제조·수입업체 제품에서 보고된 유해사례가 언제 발생해 얼마나 지속됐고 의료기기와 인과관계가 있다고 판단됐는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 업체명이나 사업자등록번호(BRNO) 같은 이름·번호 매칭, 또는 같은 식약처 데이터의 코드로만 이어 쓴다.
limits: 전역 조인 키가 없어 의료기기 품목허가 등 다른 데이터와 바로 연결되지 않고, 업체명·번호 매칭에 의존해야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 분석에는 맞지 않는다. 개발계정은 하루 10,000회까지 호출할 수 있다.
