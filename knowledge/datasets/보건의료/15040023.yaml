description_portal: 본 공공데이터는 인천광역시 서구 내 위치한 산후조리원 현황을 정리한 데이터입니다. 본 공공데이터는 인천광역시 서구관내에 위치한  산후조리원의 업소명, 소재지, 전화번호 등 항목을 포함하여 정리된 데이터파일입니다. 본 공공데이터를 통하여 지역 주민들은 인천 서구 내 산후조리원 위치 및 분포를 손쉽게 파악할 수 있습니다. 이를 통하여 주민 및 이용자들은 정식으로 등록된 산후조리원 정보를 파악하여 안심할 수 있는 서비스를 이용하는데 도움을 줄 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
