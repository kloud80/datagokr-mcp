description_portal: '이 데이터는 한국한의약진흥원이 수집·정제한 한약 실험정보 중 독성 시험의 일반증상 예측 데이터로, 한약재별 실험 조건과 독성 측정 결과를 체계적으로 정리한 정형 자료입니다. 주요 필드는 한약재 ID, 투여약물유형, 추출용매, 투여용량, 투여(용량)단위, 독성측정 값으로 구성되며, 각 행은 특정 한약재 추출물 또는 화합물의 투여 조건과 일반증상 독성 시험에서 얻은 결과(예: NEGATIVE)를 일관된 형식으로 기록하고 있습니다. 물 추출물(WATER)이나 NA 처리된 시료가 다양한 투여량(mg/kg)으로 시험된 결과가 제시되어 있습니다. 이 데이터는 한약재별 독성 관련 실험 조건과 일반증상 예측 결과를 표준화해 제공함으로써 한약재 안전성 평가, 연구 자료 관리 및 후속 분석의 기초 자료로 활용될 수 있도록 지원합니다.'
