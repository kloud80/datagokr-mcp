summary_user: 부산광역시 16개 구·군 보건소에서 받을 수 있는 건강·예방 검사를 검사 종류·검사명·비용(testPrice) 단위로 담고, 각 검사를 구·군별 보건소가 시행하는지 여부를 열로 나란히 보여주는 현황 데이터다. 부산 시민이 "우리 구 보건소에서 이 검사를 받을 수 있고 비용은 얼마인가"를 확인하거나, 분석가가 구·군 보건소 간 검사 제공 범위를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드가 없어 다른 보건소·행정구역 데이터와는 구·군 이름(열 이름)을 매핑해서만 이어 쓴다.
description_portal: '부산광역시 구군 보건소에서 건강 및 예방 차원의 목적으로 검사 가능한 정보 현황에 대한 데이터로 구,군별 보건소 검사 항목 및 비용 정보와 검사 여부 현황에 대한 정보를 제공하고 있습니다.* 부산시 해당 보건소 : 16개 구군 보건소(중구,서구,동구,영도구,부산진구,동래구,남구,북구,해운대구,사하구,금정구,연제구,강서구,수영구,사상구,기장군)* 제공항목: 16개 구군 보건소 검사 항목 및 비용정보, 검사 여부 현황* 좀 더 세부적인 검사 항목 및 비용, 주소지 관련 검사 가능 여부 등은 해당 보건소 홈페이지 또는 전화 문의하여 확인하시기 바랍니다.'
