description_portal: 한국보훈복지의료공단 산하 광주보훈병원에서 개방한 거주지별 내원환자 자연인 현황 데이터는 병원을 방문한 환자들의 거주지 정보를 기반으로 정리된 통계자료입니다. 이 데이터는 특정 연도를 기준으로 하여 환자의 거주 지역을 시도와 시군구 단위로 구분하고 있으며, 자연인 기준의 내원 건수 또는 환자 수를 포함하고 있습니다. 이는 환자의 개별 신원이 아닌 통계적 수치를 통해 지역별 의료 수요를 파악하는 데 활용됩니다. 데이터에는 환자의 방문 년도, 거주지 시도명, 시군구명, 그리고 해당 지역에서 내원한 자연인 수(중복 없이 개인 수)를 포함하여, 의료기관의 지역별 이용 현황을 분석하거나 보훈 대상자의 지역 분포 특성을 파악하는 데 유용합니다.
