summary_user: 대전광역시 중구에 등록된 안전상비의약품 판매업소(편의점 등 약국이 아닌 점포)를 점포 한 곳당 한 행으로 담은 목록이며, 점포명·도로명 우편번호·도로명주소가 들어 있습니다. 주민이 '중구에서 밤에 해열제나 소화제를 살 수 있는 편의점이 어디 있나'를 찾거나, 분석가가 동네별 상비약 접근성을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 점포명으로 맞춰 이어야 하며, 지도에 올리려면 주소를 좌표로 바꾸는 작업이 따로 필요합니다.
description_portal: '대전광역시 중구 안전상비의약품 판매업 현황 (순번, 판매점포명, 도로명 우편번호, 도로명주소) 정보를 제공합니다.                관련근거: 약사법 제44조의2(안전상비의약품 판매자의 등록) 및 약사법 시행규칙 제20조(안전상비의약품 판매자 등록기준) 등                 약사법 제44조의2(안전상비의약품 판매자의 등록): 안전상비의약품(일반의약품 중 주로 가벼운 증상에 시급하게 사용하며 환자 스스로 판단하여 사용할 수 있는 것으로서                 해당 품목의 성분, 부작용, 함량, 제형, 인지도, 구매의 편의성 등을 고려하여 20개 품목 이내의 범위에서 보건복지부장관이 정하여 고시하는 의약품을 말한다. 이하 같다)을                 약국이 아닌 장소에서 판매하려는 자는 시장ㆍ군수ㆍ구청장에게 안전상비의약품 판매자로 등록하여야 한다.'
