summary_user: 질병관리청 국민건강영양조사를 바탕으로 만 19세 이상 성인 중 최근 1년간 한 달에 1회 이상 술을 마신 비율(월간음주율)을 연도별로 집계한 전국 단위 통계 파일로, 성별 구분(구분)과 거주지(동·읍면), 연령대(19-29세부터 70세 이상까지)별 수치를 담는다. 연구자나 보건정책 담당자가 '지난 20년 가까이 20대와 60대의 월간음주율은 어떻게 달라졌는가', '도시(동)와 농어촌(읍면) 거주자의 음주율 차이는 얼마인가' 같은 질문에 쓴다. 시군구·보건소 코드 같은 전역 조인 키가 없어서 다른 데이터와는 연도와 성별·연령대 구분을 이름으로 맞춰 이어 쓴다.
description_portal: 음주폐해예방 관련 지표- 질병관리청 국민건강영양조사를 바탕으로 만 19세 이상 성인을 대상으로 최근 1년간 한 달에 1회 이상 음주한 경험 비율을 산출한 지표입니다. - 연령과 성별에 따라 산출된 음주율을 확인할 수 있으며, 조사 시기별 차이를 수치로 비교할 수 있습니다.- 데이터는 거주지역, 연령으로 구분하여 월간음주율을 제공하고 있으며, 데이터 연도 범위는 2005년~2023년입니다. - 본데이터는 음주폐해예방 및 절주 문화 확산을 위한 학계 등의 연구에 널리 활용될 것으로 기대됩니다.
