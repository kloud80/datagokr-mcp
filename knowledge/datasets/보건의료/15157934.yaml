description_portal: '질병관리청에서는 2011년 이후 매년 행정안전부 폭염대책기간에(5월~9월경) 전국 500여개 의료기관과 관할 지자체가 참여한 온열질환 응급실 감시체계를 운영하고 있으며, 내원한 환자 중 온열질환자에 대한 감시 보고를 통해 일일 감시 현황 데이터를 제공(질병관리청 홈페이지)하고 있습니다. ※ 운영기간: 2020년(5. 20.~9. 13.), 2021년(5. 20.~9. 30.), 2022년(5. 20.~9. 30.), 2023년(5. 20.~9. 30.), 2024년(5. 20.~9. 30.)다만 온열질환자에 대한 동반질환(암, 당뇨병 등) 여부에 대한 정보는 공개되지 않아, 2020년~2024년 발생한 온열질환자 중 동반질환을 가진 인원 수에 대한 정보를 분류한 자료입니다.'
