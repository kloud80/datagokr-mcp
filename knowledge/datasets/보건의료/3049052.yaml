summary_user: 웹EDI로 들어온 건강보험 전자신고 건수를 연도·월별로, 사업장 변경·탈퇴, 직장가입자 자격 취득·상실, 피부양자 취득·상실, 보수월액 변경, 납부확인서 발급 등 신고서 종류별로 나눠 전국 단위로 집계한 파일(CSV 약 10KB)입니다. 분석가나 정책 담당자가 '직장가입자 자격 취득·상실 신고가 어느 달에 몰리는가', '전자신고 업무 중 어떤 서식이 가장 많이 쓰이는가'처럼 신고 유형별 월간 추이를 볼 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 연도·월 기준으로만 맞춰 볼 수 있습니다.
description_portal: '본 데이터는 **건강보험공단의 전자적 대민 서비스인 웹EDI(Web Electronic Data Interchange)**를 이용 중인 사업장의 현황을 제공합니다.사업장은 건강보험 관련 주요 신고 및 업무 처리를 웹EDI 시스템을 통해 실시간으로 전자 제출하며, 이 데이터는 전자신고 유형별 처리 이력을 기준으로 구성됩니다.공단이 보유한 웹EDI 적용사업장 현황 1) 업무처리 유형    - 사업장 내역변경신고    - 사업장 탈퇴신고    - 사업장가입자 명부발급     - 사업장가입자 취득/상실신고 등2) 신청일자 및 처리일자3) 신청 채널: 웹EDI 또는 기타 경로4) 업무 처리 상태: 완료, 보완요청, 반려 등'
