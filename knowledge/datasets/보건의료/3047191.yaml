summary_user: 국립나주병원 한 곳의 외래·입원 수입금을 월 단위로 집계한 표로, 입원과 외래 각각을 일반·건강보험·의료급여 재원별로 나눠 담는다(포털 설명상 2014년 1월~2025년 12월, 약 8.5KB CSV 파일). 공공 정신의료기관의 진료 수입이 건강보험과 의료급여 중 어디에 얼마나 기대는지, 입원 대비 외래 수입이 해마다 어떻게 바뀌는지를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 년월(년월) 기준 시계열 비교나 같은 기관 이름으로만 이어 쓴다.
description_portal: 제공된 자료는 2014년 1월부터 2025년 12월까지의 월별 의료비용을 분석한 표입니다. 표는 입원 및 외래 진료에 대한 일반, 건강보험, 그리고 의료급여 유형별 비용을 구분하여 보여줍니다. 이를 통해 각 항목에 따른 월별 지출 변화를 파악할 수 있으며, 다양한 의료비 지불 주체의 재정적 기여도를 시사합니다. 전반적으로 이 자료는 특정 기간 동안의 의료 서비스 이용 및 관련 비용 추이를 이해하는 데 중요한 통계 정보를 제공합니다.
