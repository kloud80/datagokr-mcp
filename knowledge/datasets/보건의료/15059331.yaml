summary_user: 경기도 세척제 제조업체를 사업장 한 곳당 한 행으로 담은 인허가 원천 자료로, 시군, 인허가일·폐업일, 영업상태, 위생업종·업태, 소재지 면적, 도로명·지번 주소, WGS84 위·경도를 포함한다. 사업자나 분석가가 "우리 시군에 영업 중인 세척제 제조업체가 어디에 몇 곳 있고 최근 폐업한 곳은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)나 시군명, 주소·좌표를 기준으로 같은 기관의 다른 경기도 인허가 데이터나 지도 자료와 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 세척제 제조업체의 인허가 및 운영 현황을 정리한 자료로, 사업장별 행정 정보와 공간 정보를 포함합니다. 각 업체의 인허가일자, 폐업일자, 영업상태, 위생업종 및 업태 구분과 함께 도로명주소, 지번주소, 우편번호, WGS84 위·경도 좌표가 기록되어 있어 지역별 분포와 입지를 확인할 수 있습니다. 또한 다중이용업소 여부와 종업원 관련 정보도 일부 포함되어 있어 사업장의 규모나 운영 특성을 파악하는 데 유용합니다. 이 데이터는 위생안전 관리, 화학제품 제조업 인프라 분석, 지역별 산업 현황 비교, 행정 관리 및 정책 수립 등 다양한 분야에서 활용될 수 있습니다.
