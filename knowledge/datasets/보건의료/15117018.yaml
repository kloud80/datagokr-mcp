description_portal: 본 자료는 한국의약품안전관리원의 의약품 부작용 피해구제 부담금 부과 및 징수 등에 대한 통계 자료입니다.의약품부작용피해구제 사업이란, 의약품 부작용으로 사망, 장애, 질병피해를 입은 유족 및 환자에게 사망일시보상금, 장애일시보상금, 진료비 및 장례비를 지급하는 사업입니다.식품의약품안전처(주관기관)에서는 의약품부작용 피해구제 사업관리 및 의약품부작용 심의위원회 운영 등 을 진행하고,한국의약품안전관리원(운영기관) 에서는 의약품부작용 피해구제 신청 접수, 피해조사 및 피해구제 급여 지급관리 등 을 진행합니다.관련하여 보상범위(보상금 종류, 보상 제외범위 등) 및 신청방법은 한국의약품안전관리원 대표홈페이지 '부작용 피해구제'메뉴에서 확인하실 수 있으며,동일 메뉴 아래 공지사항 게시판을 통해 "의약품 부작용 피해구제 접수 및 심의 현황" 등의 정보를 추가 확인하실 수 있습니다.
