summary_user: 국민건강증진종합계획(HP2020)의 안전환경보건 분야 지표(식중독 발생 환자수, 수입식품 검사 부적합률, 손상사망률, 손상입원률 등)를 지표별·연도별로 담은 전국 단위 집계 파일로, 기준값·목표값·예측값·현재값·달성도와 지표정의·설정근거·자료출처를 함께 담는다. 건강증진 연구자나 정책 분석가가 '손상사망률이 HP2020 목표치 대비 어느 정도 달성됐는가'처럼 국가 건강목표의 추이와 달성 여부를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지표명이나 연도(대상년도)를 기준으로 맞춰 이어 써야 하며, 같은 기관의 다른 HP2020 분야 지표 파일과 나란히 비교하는 방식이 현실적이다.
limits: 전국 단위 비공간 집계라 시도·시군구별 비교나 보건소 단위 분석에는 쓸 수 없다. 공통 코드 형태의 조인 키가 없어 다른 데이터와 연결할 때는 지표명·연도를 직접 대조해야 한다.
