description_portal: 국민건강증진종합계획(HP2020) 관련 안전환경보건 지표입니다. 본 데이터에서는 안전환경보건와 관련하여, 식중독 발생 환자수, 수입식품 검사 부적합률, 손상사망율, 손상입원율 등의 정보를 제공합니다. 2008년부터 2020년까지 각 연도별로 지표별 목표치, 예측치, 현재값 등의 자료로 구성되어있으며, 지표별로 지표정의, 지표설정근거, 자료출처 정보도 제공하고 있습니다. 본 데이터는 건강증진 및 보건의료 관련 연구 시 기초자료로 활용될 수 있으며, 일반 국민들에게는 안전보건환경의 국내 현황을 보여주는 자료입니다.
