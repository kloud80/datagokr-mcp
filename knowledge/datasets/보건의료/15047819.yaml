summary_user: 건강보험심사평가원에 청구된 급여의약품의 사용량(수량)과 금액을 진료년월·보험자구분·조제처방구분 기준으로 약효분류군·ATC코드·성분별로 나눠 지역·의료기관 종별·상병별로 집계해 담는다. 제약사나 보건의료 분석가가 특정 약효군이나 성분 의약품이 어느 시도·시군구에서 얼마나 쓰였는지 비교하는 데 쓴다. 시도코드(sidoCd)가 행정구역 코드 키여서 지역 통계와 붙여 쓰고, 약효분류코드는 약제급여목록표, 지역코드는 병원코드정보서비스의 주소코드와 맞춰 쓴다.
description_portal: 건강보험심사평가원으로 청구되는 급여의약품 사용 정보- 진료년월, 보험자구분, 조제처방구분 등을 기준으로 약효분류군 / ATC코드별 / 성분별의 지역별 / 의료기관 종별 / 상병별 사용량을 조회하는 서비스입니다.- 지역코드는 HIRA보건의료빅데이터개방시스템(opendata.hira.or.kr) > 서비스 소개 > 용어설명 > 코드조회 또는 '병원코드정보정보서비스 Open API'의 주소코드조회를 참고하여 주시기 바랍니다.- 약효분류코드는 건강보험심사평가원 홈페이지(hira.or.kr) > 제도·정책 > 약제기준정보 > 목록표 > 약제급여목록표를 참고하여 주시기 바랍니다.
