summary_user: 의료기기 GMP(제조·품질관리기준) 심사 신청의 품목별 재보완 내역을 신청·품목 일련번호 단위로 담으며, 보완 내용·보완 구분, 재보완 필요 항목 수, 재보완 제출일·심사일·심사 결과, 진행 상태와 함께 의료기기 분류번호·등급, 제조원 국가·이름·주소를 건별로 싣는다. 의료기기 제조·수입 사업자나 분석가가 특정 품목의 GMP 심사가 재보완 단계에서 어떻게 진행되고 결과가 어땠는지, 어떤 제조원·등급에서 재보완이 잦은지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식약처 의료기기 품목허가 데이터와는 의료기기 분류번호(MDEQ_CLSF_NO)나 제조원 이름 같은 이름·코드 매칭으로만 이어 쓴다.
