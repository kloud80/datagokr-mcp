summary_user: 'KCD 4단 상병코드(주진단·부진단 전체)별·시도별로 건강보험 환자수와 명세서 청구건수를 진료년도 단위로 집계한 파일로, 범위는 전국 시도이고 한방 상병은 빠져 있다. 분석가나 연구자가 특정 질병(예: 당뇨병 세부 상병)의 환자가 어느 시도에 많은지, 연도별로 어떻게 달라지는지를 비교하는 데 쓴다. 전역 조인 키가 없어 시도명이나 상병코드를 매핑해 같은 심평원의 다른 진료 통계나 심평원 상병마스터(KCD 코드표)와 이어 쓴다.'
description_portal: 'KCD 4단 상병별(주진단, 부진단 전체) 지역별(시,도) 환자수 및 명세서 청구건수 / 진료일자 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024.1월~12월, 심사년월: 2024.1월~2025.4월 / 보험자: 건강보험 /한방 상병 제외※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 작성되었습니다.※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있습니다.※ 상병코드란 통계청 "한국표준질병·사인분류(KCD)"를 기본으로 건강보험심사평가원에서 관리하는 요양급여비용 청구에 필요한 문자와 숫자로 이루어진 기호입니다. 해당자료는 건강보험심사평가원 홈페이지(www.hira.or.kr) > 제도정책 > 보험인정기준 > 자료실 > 상병마스터 검색에서 찾아보실 수 있습니다.'
