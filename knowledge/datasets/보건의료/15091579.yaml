summary_user: 보건소 모바일 헬스케어 사업 참여자에게 제공된 상담 기록을 상담 순번·차수 단위로 담은 파일로, 차수별 안전 목표 심박수, 활동 처방 구분, 하루 활동 칼로리와 활동 시간, 활동 유효 한계가 들어 있다. 공공보건 분석가가 "모바일 헬스케어 상담이 회차를 거듭할 때 처방되는 하루 활동량이 어떻게 달라지는가"를 볼 때 쓴다. 상담 순번(mhc_counsel_seq)이 조인 키여서 같은 사업의 다른 파일(대상자·측정 등)과 순번 기준으로 이어 쓰고, 보건소코드나 시군구코드 같은 지역 키는 필드에 없다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.보건소 모바일 헬스케어 사업에서 참여한 대상자들의 정보를 확인하여 제공된 상담서비스 정보로 상담입력순번, 안전목표심박수, 상담차수, 활동처방구분, 하루활동칼로리, 하루활동시간, 활동유효한계를 제공합니다.
