summary_user: 서울 구로구의 목욕장업 사업장을 한 곳씩 담은 인허가 원천 자료로, 인허가일자·영업상태·폐업일자·주소·좌표·업태·건물 층수·욕실 수 등을 사업장 단위로 기록한다. 구로구에서 영업 중인 목욕탕·사우나가 어디에 있는지, 최근 어떤 곳이 폐업하거나 휴업했는지 확인하려는 시민이나 동네 상권 변화를 보는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·좌표나 사업장명, 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 목욕장업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 목욕장업 시설의 면적, 건축물 연면적, 업태구분, 법인명 등 주요 속성이 기록된다. 또한 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 시설 운영 현황 파악에 활용된다. 행정기관은 이를 통해 지역 내 목욕장업을 관리하며, 시민은 합법적 운영 여부를 확인할 수 있다. 데이터는 정기적으로 갱신되어 최신 행정정보를 반영하므로 정책 수립, 연구 분석, 민원 처리 등에 활용된다. 좌표정보는 지도 서비스 및 공간 분석에 연계 가능하여 행정 투명성과 정보 접근성을 높이는 기반 자료로 기능한다.
