summary_user: 보건소 모바일 헬스케어 사업에서 쓰는 영양관리 코드표로, 영양 대분류·중분류·소분류의 코드와 이름, 단위, 사용 여부, 정렬 순서를 코드 한 건당 한 행으로 담은 전국 단위 비공간 파일(csv, 약 13KB)입니다. 모바일 헬스케어 관련 데이터를 분석하는 사람이 '이 영양 코드가 어떤 항목이고 어떤 단위로 기록되는가'를 확인할 때 쓴다. 영양 중분류·소분류 코드(mhc_nutrition_cd)가 조인 키이므로, 같은 사업의 영양 기록 데이터에서 코드값을 이름과 단위로 풀어 읽는 데 이어 쓴다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.보건소 모바일 헬스케어 사업에서 사용되는 영양관리 코드 정보를 제공합니다. 엔티티는 영양_대분류_명, 영양_중분류_코드, 영양_중분류_명, 영양_소분류_코드, 영양_소분류_명, 단위_명, 영양_코드_순번, 사용_여부, 정렬_순서입니다.
