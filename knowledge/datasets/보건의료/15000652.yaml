summary_user: 전국에 설치된 자동심장충격기(AED)를 설치 장소 단위로 한 건씩 담은 원천 데이터로, API 전체 62,611건이며 설치 주소·좌표, 관리기관, 요일별 사용 가능 시간, 제조사·모델 정보를 포함한다. 급성 심정지 상황에서 가까운 AED가 어디 있고 지금 쓸 수 있는지 찾으려는 국민이나, 지역별 설치 현황을 보려는 분석가가 쓴다. 주소(buildAddress)와 위도·경도(wgs84Lat, wgs84Lon)가 조인 키라서 지도·길찾기, 응급의료기관 등 좌표나 주소를 가진 다른 응급의료 데이터와 이어 쓴다.
description_portal: 전국에 설치된 자동심장충격기(AED)의 설치 정보를 제공하는 Open API 서비스입니다. 시·도, 시·군·구 등 행정구역 및 주소를 기준으로 AED 설치 현황을 조회할 수 있으며, 설치기관명, 설치 위치, 상세 주소, 관리기관, 운영시간 등 관련 정보를 제공합니다. 관리정보 조회, 위치정보 조회 및 FullData 다운로드 기능을 제공하여 조회 조건에 따른 설치 정보를 확인할 수 있습니다. 또한 시·도, 시·군·구, 주소 등의 조회 조건을 활용하여 원하는 자동심장충격기 설치 정보를 검색할 수 있으며, 검색 결과를 통해 설치 현황을 확인할 수 있습니다.※ 제공되는 위치정보 및 운영시간은 참고용으로 제공되며, 실제 운영 현황과 차이가 있을 수 있습니다.
