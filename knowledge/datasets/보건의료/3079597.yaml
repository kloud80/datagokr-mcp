summary_user: 광양시 관내 보건진료소를 한 곳당 한 행으로 담은 작은 목록 파일(csv 약 1.7KB)로, 진료소명·주소·추진업무·근무인원·전화번호·데이터기준일을 담는다. 주민이 '우리 마을에서 가까운 보건진료소는 어디이고 무슨 업무를 하며 연락처는 무엇인가'를 확인하거나, 행정·연구자가 광양시 농촌 보건 인프라와 인력 배치를 살펴보는 데 쓴다. 전역 조인 키나 기관 코드가 없어 다른 데이터와는 진료소명·주소를 이름으로 맞추거나 주소를 지오코딩해 행정구역 단위로 붙여야 하고, 시군구 건강지표(지역사회 건강조사)와는 광양시 단위로만 이어 쓴다.
description_portal: 이 데이터는 지역 내 보건진료소 현황을 제공하는 자료로, 보건진료소명, 주소, 추진업무명, 근무 인원, 전화번호 등의 정보를 포함하고 있습니다. 이를 통해 주민은 가까운 보건진료소의 위치와 제공되는 주요 서비스 및 연락처를 확인할 수 있으며, 기본적인 의료·보건 서비스를 보다 편리하게 이용할 수 있습니다. 행정기관은 본 데이터를 활용하여 지역별 보건 인프라 현황을 관리하고, 의료 인력 배치 및 보건정책 수립에 기초 자료로 삼을 수 있습니다. 또한 데이터 기준일을 명시하여 최신성과 신뢰성을 확보하고, 공공데이터 개방을 통해 국민 건강 증진과 의료 접근성 향상에 기여합니다. 연구기관과 보건 관련 단체도 이를 바탕으로 지역 보건 서비스 개선 및 정책 연구에 활용할 수 있습니다.
