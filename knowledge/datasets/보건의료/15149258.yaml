summary_user: 건강보험료 경감 대상 지역(섬·벽지·농어촌)을 경감지역 구분, 법정동·리·도로명 코드, 건물·지번 번호 범위, 적용 시작·종료 연월 단위로 정리한 전국 범위의 주소 단위 기준 목록이다. 섬이나 농어촌에 사는 가입자나 민원 담당자가 특정 주소가 보험료 경감 지역에 해당하는지, 언제부터 언제까지 적용되는지 확인하는 데 쓴다. 법정동코드(bjd_cd)를 조인 키로 삼아 행정구역 코드표나 법정동 단위 지역 통계와 이어 쓴다.
description_portal: '□ 개방 데이터 설명  ○ 이 데이터는 건강보험료 경감 제도의 적용 대상이 되는 지역을 체계적으로 정리하여 제공하는 자료로, 섬·벽지·농어촌 등 특수지역에 대한 경감 가능 여부를 한눈에 확인할 수 있도록 구성되어 있습니다. 해당 데이터는 경감 대상 지역의 세부 분류와 코드 체계를 명확히 제시하여, 정책 수립 및 민원 응대 시 신뢰할 수 있는 기준 자료로 활용할 수 있습니다. - 섬·벽지지역 구분: ‘11’은 섬 지역, ‘12’는 벽지 지역을 의미하며, 보험료 경감 고시에 따른 경감 가능 지역과 유사하게 지역별 적용 여부를 확인할 수 있습니다. - 농어촌지역 표출: ‘13’은 농어촌지역으로, 읍·면 단위 지역을 중심으로 세부 행정구역이 표시되어 있어 농어촌 지원 정책 적용 대상 확인에 용이합니다.※  데이터값이 공란인 부분은 미집계 데이터입니다.'
