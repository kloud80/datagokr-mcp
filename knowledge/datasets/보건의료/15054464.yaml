summary_user: 회수·판매중지된 위해의약품을 제품·제조번호 단위로 기준일까지 누적해 담은 전국 단위 파일로, 제품명·표준코드·품목기준코드·회수의무자·회수일자·회수사유·위험등급(1~3등급)·회수종료일자를 건별로 싣는다. 약국·의료기관·유통업체가 보유 재고의 특정 제조번호가 회수 대상인지, 그 위험등급이 몇 등급인지 확인하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않아, 표준코드나 품목기준코드를 같은 기관의 약가·급여 목록이나 식약처 의약품 허가 정보와 코드 매핑해 잇는다.
description_portal: '의약품 안전성·유효성에 문제가 있는 회수, 판매중지 위해의약품 정보 제공- 제품명, 표준코드, 품목기준코드, 회수일자, 제조번호, 회수사유, 위험등급 등- 기준일까지 누적 현황※ 식품의약품안전처 의약품안전나라 > 고시/공고/알림 > 안전성정보 > 회수·폐기 참조※ 위험등급별 설명 · 1등급: 완치불가능한 중대한 부작용을 초래하거나 사망에 이르게 하는 경우, 치명적 성분이 섞여 있는 경우, 표시기재가 잘못되어 생명에 영향을 미칠 수 있는 경우 · 2등급: 일시적 또는 의학적으로 완치 가능한 부작용을 일으키는 경우, 주성분의 함량이 초과되는 등 식약처장이 정하여 고시하는 품질기준에 맞지 아니하거나 치명적이지 아니한 경우 · 3등급: 부작용을 거의 초래하지 아니하나 유효성이 입증되지 못하는 경우, 부작용을 거의 초래하지 아니하나 색깔이나 맛의 변질 또는 포장재의 변형 등이 발생하여 안전성·유효성에 문제가 있는 경우'
