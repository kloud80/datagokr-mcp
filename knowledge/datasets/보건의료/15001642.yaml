summary_user: 부산광역시 사상구에 개설등록한 치과기공소를 업소 한 곳당 한 행으로 담은 건별 목록 파일(약 1.7KB CSV)로, 기공소명·도로명 소재지·전화번호·운영상태를 담는다. 사상구 안에서 운영 중인 치과기공소가 어디에 있고 연락처가 무엇인지 확인하려는 치과 관계자나, 구 단위 보건의료 업소 현황을 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 인허가·의료기관 데이터와는 기공소명이나 도로명 주소를 맞춰 이어 쓴다.
description_portal: 의료기사 등에 관한 법률에 제11조의2조에 따라 부산광역시 사상구청에 개설등록한 치과기공소의 현황입니다.부산광역시 사상구 내에 위치한 치과기공소 현황(업종, 업소명, 소재지, 전화번호, 운영상태 등) 데이터 제공 및 안내입니다.치과기공소는 치과의사가 발행한 치과기공물제작의뢰서에 따라 치과기공사가 치과 기공물을 제작하는 곳으로 치과의사가 아닌 개인이 제작을 의뢰하거나 이용하는 것은 불가하오니, 틀니 및 크라운 등 보철물 제작을 원할 경우 반드시 의료기관을 방문하여 치과의사의 진료를 받으시기 바랍니다.
