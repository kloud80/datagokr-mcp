summary_user: 부산광역시 해운대구에 신고된 안전상비의약품 판매업소(편의점 등)를 점포 한 곳당 한 행으로 담은 목록 파일로, 점포명·도로명 소재지·전화번호를 제공한다. 해운대구 주민이 밤이나 휴일에 가까운 곳에서 해열제·소화제 같은 상비약을 살 수 있는 점포를 찾거나, 분석가가 구 안의 상비약 판매처 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 점포명이나 도로명 주소를 맞춰 붙이는 방식으로만 연결된다.
