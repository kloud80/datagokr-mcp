summary_user: 국민건강증진종합계획(HP2020)의 건강생활실천 분야 지표를 지표별·대상연도별로 담은 전국 단위 집계 파일로, 2008~2020년 각 연도의 기준값·목표값·예측값·현재값·달성도·변화율과 지표정의·설정근거·자료출처를 함께 담는다. 건강증진 연구자나 정책 담당자가 '흡연·음주·신체활동 같은 건강생활실천 지표가 HP2020 목표에 얼마나 다가갔는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어, 지표명이나 지표번호를 기준으로 같은 기관의 다른 HP2020 분야 지표 파일과 이름 매핑으로만 이어 쓴다.
limits: 범위가 전국·비공간이라 시도·시군구별 비교에는 쓰지 못한다. 공통 코드가 없어 지역사회 건강조사 등 다른 통계와는 지표명을 직접 맞춰야 한다. 포털 설명에는 '감염질환관리'라는 문구가 있지만 담긴 내용은 건강생활실천 지표다.
