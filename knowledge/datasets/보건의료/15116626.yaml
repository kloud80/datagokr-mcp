summary_user: 구로구 안경업소의 인허가 내역을 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소와 좌표(X, Y), 시력 측정·렌즈 가공 장비 수와 총면적 등 시설 규모를 포함한다. 구로구에서 지금 영업 중인 안경점이 어디에 몰려 있는지, 최근 폐업이 늘어난 동네가 어디인지를 확인하려는 분석가나 창업 예정 사업자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 인허가 원천에서 나온 다른 업종 자료와 함께 상권 분석에 쓴다.
description_portal: 안경업 인허가 정보는 구로구에서 안경·콘택트렌즈 판매 및 시력 측정 서비스를 제공하는 안경업소의 인허가 내역을 관리한 데이터이다. 인허가일자, 영업상태명, 소재지주소·좌표, 업종분류, 시설규모 등이 포함되어 있으며, 이를 통해 지역 내 시력보건 서비스 공급 수준을 파악할 수 있다. 안경업소는 주민 건강관리의 최전선 시설 중 하나이므로, 영업상태와 위치 정보는 지역별 시력관리 접근성, 상권 밀집도, 의료·보건시설과의 연계성 분석에 활용된다. 또한 이 자료는 청소년·고령층 대상 시력관리정책, 취약지역 지원정책, 보건서비스 공급망 분석 등 다양한 행정 분야에서 사용된다.
