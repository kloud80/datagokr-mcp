summary_user: 식약처가 정한 의료기기 분류번호 코드체계를 분류번호 1건 단위로 담으며, 분류레벨·상위분류번호·등급·품목군·한글/영문명·사용목적·추적관리대상 여부 등의 속성을 함께 제공하는 전국 단위 기준표다. 의료기기 제조·수입 사업자가 자사 제품이 어느 분류번호와 등급에 해당하는지, 추적관리대상인지를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 의료기기 품목허가 등 다른 식약처 데이터와는 분류번호나 한글 품목명으로 맞춰 이어 써야 한다.
description_portal: 식품의약품안전처 「의료기기 분류번호」 OpenAPI는 의료기기를 분류하는 코드체계 및 속성 정보를 제공합니다. 제공 항목에는 의료기기분류번호, 분류번호레벨, 상위분류번호, 분류번호등급, 품목류/품목구분, 원자재관리품목 여부, 전문정보, 사용목적, 사용여부, 추적관리대상 여부, 품목군코드, 분류번호내용, 한글명, 영문명, 의료기기구분코드 정보 등이 포함되어 있습니다.이를 통해 사용자는 특정 의료기기의 분류번호 체계와 해당 품목이 속한 분류레벨, 추적관리 대상 여부 등의 기준을 확인할 수 있습니다.
