summary_user: 경기도 시군별로 지정·운영되는 유기동물 보호센터의 업체명·대표자·계약기간·수용능력·협력동물병원·주소·좌표를 보호시설 단위로 담는다. 시민이 "우리 시군에서 잃어버린 반려동물을 찾거나 분양을 신청하려면 어느 보호센터에 연락해야 하나"를 확인하거나, 분석가가 시군별 보호시설 수용능력 편차를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 경기도 시군 데이터와 이름·코드를 맞춰 연결한다.
description_portal: 이 데이터는 유기된 반려동물을 보호하는 보호시설의 운영 현황을 시군 단위로 수록한 자료로, 동물보호법에 따라 지정·운영되는 유기동물 보호센터의 주요 정보를 제공합니다. 포함된 항목에는 업체명(ENTRPS_NM), 대표자명(REPRSNTV_NM), 계약기간(CONTRACT_PERD), 수용능력수(ACEPTNC_ABLTY_CNT), 협력동물병원내역(CORPR_ANIMAL_HOSPTL_DTLS), 주소정보(REFINE_ROADNM_ADDR), 좌표정보(REFINE_WGS84_LAT, REFINE_WGS84_LOGT) 등이 있으며, 시민의 유실동물 찾기 및 유기동물 분양 신청에 실질적으로 활용되는 데이터입니다.해당 자료는 지역 내 동물복지 인프라 현황을 파악하거나 반려동물 정책을 수립할 때 기초자료로 사용되며, 민간 보호단체 및 동물의료기관과의 협업을 통한 지역 동물보호망 개선에 기여할 수 있습니다. 또한 보호센터별 수용능력 및 위치 정보가 포함되어 있어, 유기동물의 분포나 보호 여건의 지역 간 편차를 분석하는 데에도 유용합니다. 유기견, 유기묘 등 동물유형 구분은 명시되어 있지 않으나, 보호시설 운영상황 전반을 분석할 수 있는 기반 자료로 활용도가 높습니다.
