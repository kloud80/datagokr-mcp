summary_user: 인천 미추홀구 관내 치매안심기관을 기관 한 곳당 한 행으로 담은 파일로, 유형·기관명·도로명주소·전화번호·운영유형·지정번호와 위도·경도 좌표가 들어 있다. 치매 상담이나 조기검진이 필요한 주민과 가족이 "우리 동네 가까운 치매안심기관이 어디이고 연락처는 무엇인가"를 찾거나, 구 보건·복지 담당자가 기관 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 이어 쓰며, 지정번호(지정번호)는 같은 체계를 쓰는 데이터가 있을 때만 연결에 쓸 수 있다.
limits: 미추홀구 한 개 시군구만 다루므로 인천 전체나 다른 구와 비교하려면 각 구 자료를 따로 모아야 한다. 보건소코드·시군구코드 같은 표준 키가 실측 컬럼에 없어 지역사회 건강조사 등 시군구 지표와 붙일 때는 이름·주소로 직접 매핑해야 한다.
