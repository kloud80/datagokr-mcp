summary_user: 서울 종로구에 있는 병원·종합병원·치과병원 등 입원시설을 갖춘 의료기관의 인허가 현황을 사업장 한 곳당 한 행으로 담는 원천 목록이다. 인허가일과 취소일, 영업상태, 폐업일, 휴업기간, 소재지·도로명 주소와 좌표, 의료인 수·병상 수·입원실 수·면적, 진료과목이 들어 있다. 종로구에서 어느 병원이 최근 문을 열거나 닫았는지, 병상이 어디에 몰려 있는지를 보려는 분석가나 상권 조사자가 쓰고, 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구에 소재한 병원, 종합병원, 치과병원 등 의료기관에 대한 인허가 현황을 수록한 자료입니다. 해당 의료기관은 의사가 환자를 직접 진료할 수 있도록 필요한 설비를 갖추고 있으며, 30명 이상의 환자를 수용할 수 있는 입원시설을 포함하고 있습니다. 본 자료에는 의료기관 유형, 인허가 상태, 개설 위치, 관리번호, 행정처리 이력 등 관련 정보가 포함되어 있으며, 지역 내 의료서비스 접근성, 병상 수용력 분석, 의료시설 분포 파악 등에 활용됩니다. 특히 보건의료 수요에 따른 지역별 격차 해소, 응급의료 체계 보완, 병상 운영 효율성 향상 등을 위한 행정계획 수립과 보건의료 자원 관리에 있어 기초자료로 제공될 수 있습니다.
