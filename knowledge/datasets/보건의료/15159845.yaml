description_portal: 경남 함안군 관내의 핵심 의료 자원과 위생 관리 현황을 한눈에 파악할 수 있는 데이터입니다.본 데이터는 함안군 내에 소재한 병원급 의료기관 5개소를 대상으로 하고 있으며, 지역 보건 행정 및 의료 서비스 모니터링에 필수적인 핵심 정보들을 투명하게 제공합니다. 주요 제공 항목으로는 각 의료기관의 의료 수용 능력을 나타내는 ‘관내 병원 허가병상 수’가 포함되어 있어, 지역 내 입원 치료 가능 규모를 직관적으로 확인할 수 있습니다.이와 함께 다수의 환자와 의료진에게 식사를 제공하는 ‘집단급식소 설치 여부’와 위탁 또는 직영 등 ‘급식소 운영방식’에 대한 세부 항목을 수록하였습니다.본 데이터는 2026년 6월 11일 현재 기준으로 작성된 최신 자료입니다.이를 통해 감염병 예방, 맞춤형 위생 점검, 비상시 의료 및 급식 자원 동원 계획 수립 등 다각적인 보건위생 연구와 행정 업무에 유용하게 활용할 수 있습니다.
