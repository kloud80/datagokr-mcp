summary_user: 서울특별시 성동구에서 자동판매기로 식품을 파는 업소를 업소 단위로 담은 인허가 원천 데이터로, 인허가일자·폐업일자·영업상태·소재지 주소·좌표(X, Y)·업태 등을 포함한다. 성동구에서 지금 영업 중인 식품자동판매기 업소가 어디에 있는지, 최근 몇 곳이 폐업했는지 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 같은 LOCALDATA 공통 인허가 형식의 다른 업종 데이터와 나란히 비교하는 데 쓴다.
description_portal: 성동구의 자동판매기를 이용하여 식품을 판매하는 업소정보입니다. 개방서울특별시 성동구 자동판매기 식품 판매업소 현황 정보는 자동판매기를 통해 식품을 판매하는 업소의 위치와 영업 현황을 체계적으로 제공하는 공공데이터입니다. 데이터 항목에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 있어 각 업소의 인허가 정보와 현재 영업 상태를 정확히 확인할 수 있습니다. 이를 통해 소비자는 안전하게 관리된 자동판매기를 통해 식품을 구매할 수 있으며, 업소 선택 시 참고 자료로 활용할 수 있습니다. 또한 행정기관은 업소 관리, 위생·안전 점검, 인허가 현황 모니터링 등 행정 업무 수행에 활용할 수 있으며, 필요 시 인허가 갱신 또는 취소 조치를 체계적으로 관리할 수 있습니다. 연구기관이나 정책 담당자는 업소 분포, 영업 상태, 자동판매기 운영 현황 등을 분석하여 정책 개선, 소비자 보호, 식품 안전 관리 강화, 지역 맞춤형 지원 계획 수립 등에 활용할 수 있습니다. 본 데이터는 성동구 내 자동판매기 식품 유통의 투명성과 안전성을 확보하고, 주민 건강 보호와 소비자 신뢰 증진을 위한 핵심 자료로 활용될 수 있습니다.자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드등을 제공합니다.
