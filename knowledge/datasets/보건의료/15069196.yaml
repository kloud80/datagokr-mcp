summary_user: 전라남도 병원급 이상 의료기관(병원·종합병원·한방병원·치과병원 등)을 기관 한 곳당 한 행으로 담은 CSV 파일로, 시군명·기관명·종류·병상수·주소를 담는다(파일 크기 약 17.9KB). 주민이나 분석가가 '우리 시군에 병상을 갖춘 병원급 의료기관이 어디에 몇 곳 있고 병상은 얼마인가'를 확인하거나 시군별 병상 분포를 비교하는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 시군명이나 의료기관명·주소를 이름 매칭으로 이어 써야 한다.
description_portal: '- 전라남도 병원급 이상 의료기관(종별, 의료기관명, 주소, 병상수, 등)에 관한 정보입니다.- 종별 : 병원, 한방병원, 치과병원, 종합병원 등으로 구분됩니다.- 전라남도에는 병원급 이상의 의료기관이 다양한 지역에 분포하여 도민들에게 의료 서비스를 제공하고 있습니다. 이러한 의료기관들은 병원, 종합병원, 한방병원, 치과병원 등으로 구분되며, 각 기관은 병상 수, 진료 과목, 위치 등에 따라 특성이 다릅니다.- 전라남도의 의료기관은 지속적인 발전과 성장을 거듭하고 있으며, 다양한 연령층과 수준에서 활발한 활동이 이루어지고 있습니다. 앞으로도 전남도청의 노력과 지원을 통해 더욱 많은 인재들이 의료 분야에서 꿈을 키워나가기를 기대합니다.'
