summary_user: 동물의약품별로 식품에 남아도 되는 잔류허용기준(MRL)을 의약품명·식품명(국문·영문) 단위로 담고, 시행시점·단계·잠정기준 적용 여부·폐지 여부를 함께 제공하는 전국 범위의 기준 목록이다. 축산물 수입·유통 사업자나 식품안전 분석가가 특정 동물용 의약품이 소고기·우유 같은 식품에서 얼마까지 허용되는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의약품명·식품명 매핑이나 같은 기관(식약처) 데이터의 코드로만 연결한다.
description_portal: 동물의약품별 식품에 대한 잔류량 허용 기준 정보로 시행시점, 단계, 잔류허용(MRL) 정보 등의 항목을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
