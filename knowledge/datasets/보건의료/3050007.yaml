description_portal: 본 데이터는 한국보건산업진흥원이 지원한 보건의료 연구개발(R&D) 과제의 최종보고서 및 요약서를 수집·정리한 자료이다. 최종보고서URL을 통해 보고서를 확인하면 과제별로 연구개요, 수행기관, 연구목표, 연구개발 성과 및 기대효과, 연구개발기간, 수행과정 등의 상세정보가 포함되어 있으며, 보고서 원문 등이 제공된다. 본 자료는 연구개발 결과의 확산 및 활용을 촉진하고, 유사 연구기획 및 전략 수립 시 참고자료로 활용될 수 있도록 구성되었다. 데이터는 사업명, 과제명, 연구기관명, 연구책임자, 연구결과요약, 요약문한글, 요약문 영문, 한글키워드, 영문키워드로 분류되어 있으며, 보건의료기술 발전과 산업화 촉진을 위한 실증 기반 자료로 기능하다. 정기적으로 조사되고 있었으나, 조사 주기가 수시로 변경됨에 따라 업데이트 주기가 불규칙하지만, 조사결과가 정책수립기관, 연구기관, 학계, 산업계 등 다양한 수요자에게 활용 가치를 제공한다.
