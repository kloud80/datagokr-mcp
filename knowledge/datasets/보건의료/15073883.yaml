summary_user: 의료기기 회수의무자가 제출한 회수·폐기 계획 보고를 건별로 담으며, 보고 구분, 보고 제출·승인일자, 업소명·업종·주소, 보고 상태, 소비자가 취해야 할 행동, 제품 이미지 ID를 전국 범위로 제공한다. 소비자나 의료기관이 '지금 쓰는 의료기기가 회수 대상인지, 어떤 조치를 해야 하는지'를 확인하거나, 분석가가 업체별 회수 보고 이력을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 업소명·사업자등록번호(BRNO) 같은 이름·번호 매칭이나 같은 식약처 데이터와의 대조로만 연결한다.
description_portal: 이 공공데이터는 회수폐기계획에 대한 정보를 담고 있으며 회수폐기보고구분코드, 회수폐기보고구분, 보고승인일자, 보고제출일자, 업소명, 대표자명,업종구분코드, 업종명,업소주소,공개마감일상태코드 등의 정보를 제공합니다.회수의무자는 시행규칙 제52조제3항 또는 제57조제2항에 따라 회수계획서를 제품별로 작성하여야 합니다.회수계획서에는 회수의무자 정보, 회수대상 제품의 정보, 회수 사유(위해성 정도 및 회수 결정 경위) 회수 대상량, 회수 통보 방법 등의 정보를 제공하여야 하며. 회수계획서는 의료기기 신속한 회수에 기여하고 있습니다.
