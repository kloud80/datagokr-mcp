description_portal: '특정 질병 및 약제코드 조건에 따른 진료인원1. 진료일기준(한의분류 제외, 약국 제외)2. 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외- 2023년 6월 심사분까지 반영3. 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음4. 주상병코드: I270 (원발성 폐동맥고혈압), I272(기타 이차성 폐동맥고혈압), I278(기타 명시된 폐성 심장질환), I279(상세불명의 폐성 심장병)5. 약제주성분코드: 485201ATB (bosentan), 553301ATB (Sildenafil), 564702ATB (ambrisentan), 632201ATB (macitentan)512430BIJ (treprostinil), 471430CSI (iloprost), 652302ATB (selexipag)*(추가요청코드) 652301ATB, 652303ATB, 564701ATB, 512431BIJ, 512432BIJ※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터입니다.'
