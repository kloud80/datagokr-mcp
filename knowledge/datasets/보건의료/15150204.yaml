description_portal: ATC 코드값과 ATC 코드명으로만 구성되어 있습니다. ATC(Anatomical Therapeutic Chemical) 코드는 세계보건기구(WHO)에서 제정한 의약품 분류체계로, 인체 해부학적 기관(Anatomical), 치료적 목적(Therapeutic), 화학적 특성(Chemical)에 따라 다단계로 의약품을 구분합니다.이를 통해 동일 성분의 의약품뿐만 아니라 유사한 치료 목적이나 약리 작용을 가진 의약품을 체계적으로 분류할 수 있습니다. 본 데이터는 각 의약품의 ATC 코드값과 그에 해당하는 코드명으로 구성되어 있어, 연구자와 분석자가 처방 데이터와 연계하여 의약품의 계통적 분류 및 약효군 단위 분석을 수행할 수 있도록 지원합니다. 데이터 건수가 많으므로, 엑셀이나 메모장보다는 R, Python, SAS, SQL 등 분석 전용 소프트웨어를 활용하는 것이 권장됩니다.
