description_portal: '- 전라남도내 보건지소(기관명, 소재지, 전화번호, 진료과목, 진료시간 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도 내 보건지소는 시·군 보건소의 분소 형태로, 인구가 비교적 많은 읍·면 지역 주민들에게 일차 진료, 예방접종, 방문간호 등 보건 서비스를 제공하는 공공의료기관입니다.- 설립 시기: 1960~80년대, 특히 농어촌 개발과 보건 확충 시기에 집중 설립됨- 인력 구성: 보통 1~7명의 공중보건의·간호인으로 운영- 서비스 영역: 일상 진료, 만성질환·모자·노인·임산부 건강, 방문 간호, 예방접종 등- 보건지소는 보건소의 하위 조직으로, 주로 읍·면 지역에 설치되어 주민들에게 기초 의료 서비스를 제공하는 공공의료기관입니다. 보건소가 시·군 단위라면, 보건지소는 그보다 한 단계 작은 단위로 면 단위 중심지에 위치합니다.'
