summary_user: 충청남도 논산시 안의 의료기관을 한 곳당 한 행으로 담은 현황 파일로, 기관명·의료기관 구분·행정동·도로명/지번 주소·전화번호·기준일자를 담는다(CSV 약 19KB). 주민이 우리 동네 가까운 병원·의원·치과·한의원의 위치와 연락처를 찾거나, 분석가가 논산시 행정동별 의료기관 분포와 밀집도를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소를 맞춰 붙여야 하며, LOCALDATA 병의원 인허가 원천과 이렇게 대조해 개폐업 흐름을 볼 수 있다.
limits: 논산시 한 개 시군구만 담으며 다른 지역 비교에는 다른 시군의 파일이 따로 필요하다. 표준 기관 코드나 공통 키가 없어 인허가·심평원 데이터와의 연결은 이름·주소 매칭에 의존하므로 오매칭에 주의해야 한다.
