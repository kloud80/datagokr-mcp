summary_user: 경상북도 영천시에 있는 의료기기 판매업소를 업소 한 곳당 한 행으로 담은 원천 목록이며, 상호·소재지·전화번호를 담는다(CSV 약 9KB). 영천시 주민이나 사업자가 '우리 동네 어디에서 의료기기를 살 수 있고 연락처는 무엇인가'를 확인하거나, 분석가가 시내 판매업소의 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 문자열 매칭으로만 이어 쓰며, 식약처 품목허가 코드나 심평원 목록과 직접 연결되는 코드는 없다.
