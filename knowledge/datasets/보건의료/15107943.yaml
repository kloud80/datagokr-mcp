legal_basis_portal: '감염병예방법 제51조: 소독 의무제51조는 **“소독 의무 (Disinfection Duty)”**를 규정하고 있습니다. 법 제51조 제3항에서는, 공동주택·숙박업소 등 여러 사람이 거주하거나 이용하는 시설 중 대통령령으로 정한 “소독의무대상시설”을 관리하거나 운영하는 자는, 보건복지부령이 정한 바에 따라 감염병 예방에 필요한 소독을 해야 한다고 명시하고 있습니다. 국민참여입법센터제51조 제4항에서는, 이러한 소독 대상 시설의 관리·운영자는 직접 소독을 하거나, 또는 정식 신고를 한 “소독업자”에게 소독을 의뢰해야 한다고 규정하고 있습니다. 다만, 일정 요건을 갖춘 주택관리업자가 있을 경우 그가 직접 소독할 수 있다는 예외도 있습니다.'
