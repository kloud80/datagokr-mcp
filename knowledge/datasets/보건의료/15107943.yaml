description_portal: 경기도 구리시는 감염병 확산을 예방하기 위해 소독 의무 대상 시설에 대한 상세하고 종합적인 정보를 제공하고 있습니다. 이러한 지정은 「감염병의 예방 및 관리에 관한 법률 시행령」 제24조에 근거하며, 정기적이고 체계적인 소독이 필요한 시설의 유형을 명확히 규정하고 있습니다. 이를 통해 지역사회 감염 위험을 줄이고 공중보건을 강화하며, 시민과 방문객 모두에게 더욱 안전하고 쾌적한 환경을 제공하는 것을 목표로 하고 있습니다.소독 의무가 부과되는 시설의 범위는 매우 넓으며, 일반 시민들이 일상적으로 많이 이용하는 다중이용시설이 대부분 포함됩니다. 그 예로, 호텔·게스트하우스 등 숙박시설, 음식점, 도시버스·농어촌버스·마을버스 등 대중교통 수단이 있으며, 사람들의 이동이 잦고 밀집도가 높아 정기 소독이 중요한 장소들입니다. 또한, 사용 목적상 위생 관리가 특히 필요한 장의차량도 소독 의무 대상에 포함됩니다.이와 더불어 주요 교통 거점과 관련 시설도 소독 의무가 적용됩니다. 여기에는 공항시설, 연면적 300㎡ 이상인 대형 대기실, 여객운송시설, 철도차량, 철도역 및 역사 시설 등이 포함되며, 많은 사람들이 동시에 머무르거나 이동하는 환경이기 때문에 감염병 예방을 위한 지속적인 소독이 요구됩니다.또한 일상생활과 밀접하게 관련된 고밀집 시설도 소독 의무 대상입니다. 대형마트, 하루에도 많은 이용자가 방문하는 의료기관, 여러 사람이 공동 생활하는 기숙사·생활시설, 다수의 인원이 모이는 공연장, 그리고 학생들이 밀집해 활동하는 학교 및 학원 등이 이에 해당합니다. 이러한 시설은 이용자 간 접촉이 잦거나 공간을 공동으로 사용하는 특성이 있어 정기 소독이 필수적입니다.
