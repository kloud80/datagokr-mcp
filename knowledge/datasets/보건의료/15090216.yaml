summary_user: 서울 송파구에 있는 산후조리원을 한 곳당 한 행으로 담은 현황 파일로, 명칭·주소·연락처·비고가 들어 있으며 포털 설명상 총 9개소다. 송파구에서 출산을 앞둔 가족이 가까운 산후조리원의 위치와 연락처를 확인하거나, 분석가가 구 단위 산후조리 시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 명칭이나 주소를 맞춰 붙여야 하며, 산후조리원 인허가 LOCALDATA 같은 원천 자료와 대조하는 용도로 쓴다.
limits: 송파구 안의 시설만 담고 있어 다른 구나 서울 전체와는 비교할 수 없다. 시설 코드 같은 공통 키가 없어 다른 데이터와 이으려면 명칭·주소를 직접 맞춰야 한다.
