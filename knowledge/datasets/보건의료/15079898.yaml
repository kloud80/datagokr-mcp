summary_user: 국립나주병원이 보유한 약품을 한 품목씩 정리한 목록 파일(csv, 약 13KB)로, 병원 내부 약품코드·성분명·주성분명과 약품분류·약품구분(내복·외용·주사, 일반·향정신성)을 담는다. 국립 정신건강 병원이 어떤 성분의 약, 특히 향정신성 의약품을 어떤 제형으로 갖추고 있는지 확인하려는 분석가나 연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 식약처 품목기준코드나 심평원 약가 목록과는 성분명·주성분명 이름 매칭으로만 이을 수 있다.
