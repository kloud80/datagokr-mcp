description_portal: 광주광역시 남구의 한약국 현황 및 정보(약국명, 연락처, 소재지도로명주소 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 보건행정과(☎062-607-4352)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 한약국은 한약사가 한의사의 처방전에 따라 한약을 조제하거나, 보건 복지 가족부 장관이 고시한 100가지 처방을 조제하는 곳으로, 해당 데이터를 통하여 행정적으로는 한약 조제기관의 분포 파악, 지역별 한약 서비스 접근성 분석, 감염병·재난 대응 시 취약 지역 확인 등에 활용할 수 있을 것으로 보미여, 민간에서는 위치 기반 서비스, 지도 플랫폼, 한약 소비자 정보 서비스 개발 등에도 유용하게 쓰일 수 있을 것으로 보입니다.
