summary_user: 분기·시도·요양기관 종별로 일반 엑스선 촬영장치, CT, MRI, 콘빔CT, 양전자단층촬영장치, 골밀도검사기, 인공신장기 등 의료장비 보유 대수를 집계한 전국 단위 파일입니다. 보건정책 분석가나 의료기기 사업자가 'MRI·CT 같은 고가 영상장비가 어느 시도의 어떤 종별 기관에 몰려 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도별 통계(인구·의료기관 수 등)와는 시도명·분기·요양기관종별 이름을 맞춰서만 이어 쓴다.
description_portal: 한국보건산업진흥원에서 운영하는 보건산업 고객 맞춤형 통합 서비스 포털을 통해 보건의료빅데이터 플랫폼 의료장비 현황 정보를 제공합니다. 이 데이터는 분기 구분 및 시도별로 요양 기관 종별 현황을 세분화하여 파악할 수 있도록 구성되어 있습니다. 주요 항목으로는 일반 엑스선 촬영장치, 전산화 단층 촬영장치(CT), 자기 공명 영상 진단기(MRI), 인공 신장기 등 다양한 종류의 의료 장비 보유 현황을 포함하고 있어, 국내 보건의료 자원 분포 및 활용 실태를 분석하는 데 유용합니다. 해당 정보는 의료 기기 시장 분석과 보건 정책 수립의 기초 자료로 활용됩니다.
