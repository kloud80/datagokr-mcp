summary_user: 광주광역시 남구 관내 의료기기 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 영업소명과 소재지 도로명주소, 데이터기준일자를 담는다. 주민이 집 근처에서 혈압계·혈당측정기 같은 의료기기를 파는 곳을 찾거나, 분석가가 남구 안 판매업소 분포를 주소 단위로 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명·도로명주소를 맞추거나 같은 기관(남구) 기준으로만 이어 쓴다.
description_portal: 광주광역시 남구 관내 의료기기판매업소 현황 및 정보(영업소명, 소재지도로명주소)를 제공합니다. 해당 데이터는 광주광역시 남구청 보건행정과(☎062-607-4352)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 의료기기 판매업소는 병원, 의원, 약국, 가정 등에서 사용하는 다양한 의료기기를 판매하는 업체로, 취급하는 물품으로는 혈압계, 체온계, 혈당측정기 같은 개인용 진단 기기부터 재활보조기구, 치료 장비, 의료용 소모품 등이 있습니다. 이러한 업소는 관련 법령에 따라 허가 또는 신고를 거쳐 운영되며, 제품의 안전성과 품질을 유지하기 위해 보관·취급 기준을 준수해야 합니다. 의료기기 판매업소는 환자 진단과 치료, 건강 관리에 필요한 기기 접근성을 높여 시민 건강 증진에 기여합니다.
