summary_user: 전북특별자치도 내 공공장소·다중이용시설에 설치된 자동심장충격기(AED)를 설치기관 단위로 한 줄씩 담은 건별 파일 데이터로, 검증 수신 2,993행이며 설치기관명·주소·관할보건소·건물 내 설치위치를 포함한다. 심정지 상황에서 시민이나 구급대원이 가까운 AED가 어디 있는지, 또는 시군구별 설치 분포가 어떤지 확인하는 질문에 쓴다. 설치기관 주소(address)를 조인 키로 삼아 주소 기반의 다른 시설·지도 자료와 이어 쓰며, 필드 목록에는 별도의 코드표가 없다.
