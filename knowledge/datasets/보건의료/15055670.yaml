description_portal: 데이터 설명본 데이터는 전북특별자치도 내 공공장소 및 다중이용시설에 설치된 자동제세동기(AED)의 현황을 상세히 담고 있는 공공안전 정보입니다. 각 자동제세동기의 설치기관명, 정확한 소재지 주소, 그리고 건물 내의 구체적인 설치 장소 정보를 포함하고 있습니다. 특히, 모든 설치 지점의 위도와 경도 좌표값까지 제공하여 지도 기반 서비스나 응급상황 발생 시 일반 시민이나 구급대원이 신속하게 가장 가까운 장비를 찾는 데 매우 유용합니다. 이 자료는 심정지 환자의 생존율을 높이는 "골든타임" 확보를 위한 필수적인 사회 안전망 인프라 현황을 보여주며, 공공보건 및 재난 대응 체계 구축을 위한 핵심 데이터로 활용됩니다.
