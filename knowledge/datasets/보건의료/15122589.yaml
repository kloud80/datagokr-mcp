summary_user: 국민건강보험공단이 건강보험 진료 내역에서 주상병이 열 및 빛의 영향(T67 계열)인 온열질환 진료인원을 2020년 1월~2024년 12월 진료분에 대해 전국 단위로 집계한 소규모 파일(142바이트 CSV)이며, 컬럼은 구분·진료개시년도·환자 수로 구성된다. 보건 분석가나 기자가 "최근 5년간 열사병·일사병 등 온열질환으로 진료받은 사람이 해마다 늘었는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 기상청 폭염일수 등 다른 통계와는 연도(진료개시년도)를 기준으로 수작업으로 맞춰 이어 쓴다.
limits: 전국 합계만 담고 있어 시군구·연령·성별 구분은 할 수 없고, 제목은 '월별'이지만 실측 컬럼은 진료개시년도이므로 받은 뒤 시간 단위를 확인해야 한다. 5 미만 값은 비식별 처리된다. 확정 진단이 아닌 청구 주진단명 기준이라 실제 확정 질병과 다를 수 있다.
