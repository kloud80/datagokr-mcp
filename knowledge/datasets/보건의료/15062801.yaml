description_portal: 경상북도 관내에서 의료법에 따라 개설 허가되어 운영 중인 요양병원의 세부 관리 현황을 제공하는 데이터입니다. 본 자료는 지역별 노인 의료 요양 시설의 분포를 확인할 수 있도록 각 병원의 명칭과 개설 장소(소재지) 정보를 핵심적으로 포함하고 있습니다. 또한, 장기 요양 및 치료 서비스의 수용 규모를 가늠할 수 있는 허가 병상 수(개) 통계와 병원의 운영 이력을 파악할 수 있는 허가 일자 정보를 상세히 수록하고 있습니다. 아울러 이용 상담 및 문의를 위한 전화번호 정보를 함께 제공하여, 도민의 의료 접근성 향상 및 고령 사회 대비를 위한 보건 정책 수립의 기초 자료로 활용됩니다.
