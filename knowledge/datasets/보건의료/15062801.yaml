summary_user: 경상북도 관내에 개설 허가되어 운영 중인 요양병원을 병원 한 곳당 한 행으로 담은 파일로, 명칭·개설장소(소재지)·허가병상 수·허가일자·전화번호를 수록한다(CSV 약 10KB). 지역별 요양병원 분포와 병상 규모를 보고 "우리 시군에 요양병원이 몇 곳, 병상이 얼마나 있나"를 확인하려는 도민이나 고령화 대비 보건정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 병원 명칭이나 소재지 주소를 맞춰 연결해야 하고, 의료기관 인허가 LOCALDATA와는 이름·주소 매칭으로 이어 쓴다.
limits: 기관코드 같은 공통 식별자가 없어 건강보험 의료기관 정보 등과 정확히 결합하기 어렵고, 명칭·주소 매칭에 의존해야 한다. 범위가 경상북도 한 곳이며 좌표가 없는 비공간 데이터라서, 지도에 표시하려면 주소를 따로 지오코딩해야 한다.
