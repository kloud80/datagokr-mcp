summary_user: 서천군 관내에서 운영 중인 약국을 한 곳씩 담은 현황 목록으로, 약국 명칭·소재지 주소·연락처·개설자명·등록일자·데이터기준일자를 포함한다(포털 설명상 28개소, 시군구 범위의 개별 주소 단위). 주민이 '우리 동네 가까운 약국은 어디이고 전화번호는 무엇인가'를 확인하거나, 분석가가 군 내 읍면별 약국 분포와 의약품 접근성을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 약국명이나 주소를 직접 맞춰 이어야 하며, 인허가 원천인 LOCALDATA 약국 데이터나 지도 좌표와 연결할 때도 주소 매칭이 필요하다.
limits: 약국 코드 같은 공통 식별자가 없어 다른 약국·의료기관 데이터와 자동으로 결합되지 않고, 명칭·주소 매핑에 의존한다. 서천군 한 곳만 다루는 파일이라 다른 시군과의 비교나 영업시간·휴일 운영 정보는 이 데이터로 확인할 수 없다.
