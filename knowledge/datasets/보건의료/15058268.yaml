summary_user: 경기도 내 동물용 의료용구 판매업체의 인허가 현황을 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·WGS84 좌표를 포함한 시도 범위의 건별 원천 데이터다. 동물병원·농장에 진단·치료 기기를 공급하는 업체가 우리 시군에 몇 곳 영업 중인지, 최근 어디서 개업·폐업했는지 확인하려는 사업자나 정책 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 시군코드(SIGUN_CD)나 주소·좌표, 사업장명을 기준으로 다른 LOCALDATA 인허가 데이터나 지도와 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 동물용 의료용구 판매업체에 대한 인허가 현황을 제공하며, 동물치료를 목적으로 하는 의료기기를 취급하는 업소의 정보를 담고 있습니다. 항목에는 시군명, 사업장명, 인허가일자, 영업상태, 주소(도로명 및 지번), 전화번호, 업태구분, 소재지면적, 종업원 수, 좌표(WGS84), 축산업무구분명, 축산물가공업구분명, 축산고유번호 등이 포함됩니다. 동물병원, 농장 등에서 사용하는 각종 진단 및 치료 기기 공급 업체 현황을 파악할 수 있으며, 축산업 및 동물복지 인프라의 현황 분석, 관련 정책 수립, 산업 동향 파악 등 다방면의 활용이 가능합니다. 이 데이터는 주간 단위로 갱신되며 Open API를 통해 자동화된 접근도 지원합니다.
