description_portal: '이 데이터는 중앙암등록본부(국립암센터 지정)가 국가암등록통계사업을 통해 수집한 [2023년 암등록통계]자료로 1999년부터 2023년도 까지의 암발생 통계 정보를 제공합니다. (단위 : 명, 10만 명 당 발생률) 국내에서 발생한 암에 대한 연도별 통계 정보를 제공하며, 성별, 연령대, 암종별로 구분된 자료를 포함하고 있습니다. 암의 발생 규모와 분포를 파악할 수 있는 기초 자료로서, 보건의료 정책 수립과 질병 예방 연구에 폭넓게 활용됩니다. 국가암등록통계를 기반으로 신뢰성 있게 구축되어 있어, 암 발생 추세 분석 및 관련 연구의 근거 자료로 활용 가능합니다.'
