summary_user: 인천광역시 연수구에서 금연구역으로 지정된 공동주택(아파트 단지)을 한 단지당 한 줄로 담은 개별 목록으로, 지정번호·지정 시행일자·단지명·소재지·위도·경도·지정범위(복도·계단·엘리베이터 등)를 포함한다. 연수구 주민이 '우리 아파트가 금연아파트로 지정됐는지, 언제부터 어느 구역까지인지'를 확인하거나, 보건 분석가가 구내 금연아파트 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 단지명·주소 문자열 매칭이나 위도·경도 좌표로만 이어 쓰며, 공동주택 단지 정보나 지역사회 건강조사 같은 시군구 지표와 붙이려면 주소를 시군구 단위로 정리해 맞춰야 한다.
