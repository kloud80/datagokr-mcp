description_portal: 이 데이터는 서울특별시 광진구 관내에서 의료기기를 판매하거나 임대하는 업소에 대한 인허가 정보를 제공합니다.의료기기판매(임대)업은 「의료기기법」에 따라 의료기기 제조업체 또는 수입업체로부터 제품을 공급받아, 병원, 의원, 개인 등에게 의료기기를 판매하거나 대여하는 영업 형태를 포함합니다.데이터에는 업소명, 소재지, 업종구분, 인허가일자, 영업상태, 관리기관 등이 수록되어 있으며, 지역 내 의료기기 유통망 파악, 의료시설 연계 장비 접근성 분석, 의료기기 시장 현황 파악, 행정 점검 대상 확보 등에 활용할 수 있습니다.특히 호흡기, 심전도, 재활기기 등 주요 의료기기의 대여 서비스 수요 증가에 따라, 임대영업에 대한 규제 및 품질 관리 중요성이 커지고 있습니다.※ 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도는 포함되지 않음에 유의해야 합니다.※ 본 데이터는 3일 전 기준으로 최신화된 인허가 정보를 반영합니다.
