description_portal: 폐의약품 수거함 현황 공공데이터는 국민들이 가까운 곳에서 폐의약품을 안전하게 배출하고 환경오염을 예방할 수 있도록 마련된 수거함의 설치·운영 정보를 제공합니다. 이 데이터에는 수거함이 위치한 설치장소명, 시·도명, 시·군·구명 등 행정구역 정보와 더불어, 시민들이 쉽게 찾아갈 수 있도록 소재지 도로명 주소 및 소재지 지번 주소가 포함되어 있습니다. 또한 위치를 정확히 확인할 수 있도록 위도와 경도 좌표가 제공되며, 수거함의 구체적인 위치를 설명하는 세부위치 정보도 함께 제공됩니다.아울러, 수거함의 유지·관리 주체를 알 수 있도록 관리기관명과 관리기관 전화번호가 기재되어 있어 이용자가 문의나 불편사항을 즉시 전달할 수 있습니다.
