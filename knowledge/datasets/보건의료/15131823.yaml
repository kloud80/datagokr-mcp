summary_user: 건강보험 양방 청구분(약국 제외)을 심사 결정 기준으로 집계한 당뇨병(E10~E14, 주상병) 진료 통계로, 진료년도·시도·시군구·성별·연령구분별 환자수·입내원일수·요양급여비용을 전국 시군구 단위로 담는다. 지자체나 분석가가 "우리 시군구 요양기관에서 당뇨병으로 진료받은 환자가 몇 명이고 진료비가 얼마인가"를 연도·성·연령별로 비교할 때 쓴다. 공통 조인 키(행정코드 등)가 없어 다른 지역 통계와는 시도·시군구 이름을 매핑해 이어 쓰며, 같은 심평원 진료 통계와 묶어 보는 방식으로 연결한다.
description_portal: '- 보험자 구분: 건강보험 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024년 1월~12월, 심사년월: 2024년 1월~2025년 4월 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 대상질병: E10(1형 당뇨병), E11(2형 당뇨병), E12(영양실조 관련 당뇨병), E13(기타 명시된 당뇨병), E14(상세불명의 당뇨병) *한국표준질병·사인분류(2020), 통계청 기준※ 질병은 주상병 기준이며 의료기관에서 의사가 진료 시 환자의 호소, 증세에 따라 일차적으로 진단명을 부여하여 진료비 청구가 이루어짐에 따라 실제 최종 확정된 질병과는 차이가 발생할 수 있음※ 지역은 요양기관 소재지 기준이며 수진자의 거주지와 다를 수 있음※ 연령별 환자는 명세서에 기재된 수진자의 만(滿)나이 기준으로 범주 내 동일인의 중복을 제거한 값이지만, 진료시점에 따라 중복집계될 수 있으며 다른 범주와 단순합산할 경우 중복이 발생할 수 있음※ 건수가 10 미만인 경우 "0"으로 기재함'
