description_portal: '- 국민건강증진사업 중 국가금연지원서비스의 일환으로 운영되는 단기금연캠프에 대한 정보를 제공하고 있습니다. - 개방데이터는 캠프운영지역, 캠프주체기관명, 캠프유형, 캠프시작일자, 캠프종료일자, 캠프 서비스 정원에 대한 정보를 제공하며, 제공건수는 총 160건으로 구성되어있습니다. - 본 개방 데이터는 각 지역에서 운영중인 단기금연캠프 정보를 개방함으로써, 금연에 관심이 있는 국민에게 정보를 공유하고 금연캠프 참여를 독려할수 있으며, 장기적으로 흡연자의 금연유도에 기여할 수 있습니다.'
