summary_user: 국가금연지원서비스의 하나인 단기금연캠프를 캠프 한 건 단위로 담은 전국 파일 데이터로, 운영기관 유형·지역·기관명·서비스유형·캠프장소·일정·시작/종료일자·서비스정원을 담는다. 금연을 원하는 흡연자나 보건 담당자가 '우리 지역에서 언제 어떤 단기금연캠프가 열리고 정원은 몇 명인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 지역명이나 기관명을 이름으로 맞춰 이어 써야 한다.
limits: 보건소코드·시군구코드 같은 표준 코드가 없어 지역사회 건강조사 등 시군구 지표와 바로 붙일 수 없고, 지역·기관명 문자열 매핑이 필요하다. 좌표가 없는 비공간 데이터라 지도 위치 분석에는 바로 쓰지 못한다.
