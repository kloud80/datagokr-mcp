summary_user: 인천광역시에 등록된 외국인환자 유치의료기관을 기관별 한 행으로 담은 파일로, 상호·대표자명·연락처·기관구분·지역·주소·유치대상국가·등록 상태를 담는다. 의료관광 사업자나 외국인 환자 지원 담당자가 "인천에서 특정 국가 환자를 유치하는 병의원은 어디에 있는가"를 찾을 때 쓴다. 전역 조인 키가 없어 의료기관 인허가(LOCALDATA) 등 다른 데이터와는 상호·주소를 맞춰 이어 써야 한다.
description_portal: '1. 목록명: 인천광역시 외국인환자 유치의료기관 등록현황2. 키워드: 외국인환자, 의료, 관광, 보건, 보건의료, 유치기관 3. 데이터 설명: 인천광역시의 외국인환자 유치의료기관 등록 현황에 대한 데이터를 제공하고 있습니다. 이 데이터에는 지역, 기관명, 주소 등의 항목이 포합되어 있습니다. 더욱 자세한 사항은 외국인환자 유치 정보시스템( https://www.medicalkorea.or.kr/korp/)을 통해 상시 등록 정보를 확인할 수 있으며, 데이터는 연간 업데이트 되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, CSV 형식으로 제공됩니다.'
