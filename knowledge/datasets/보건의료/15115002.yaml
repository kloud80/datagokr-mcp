summary_user: 서울특별시 송파구의 의원 인허가 정보를 의원 한 곳씩 건별로 담고, 인허가일·취소일, 영업·상세 상태, 폐업·휴업 일자, 주소·전화, 좌표(X·Y), 진료과목, 병상·입원실 수와 면적 같은 항목이 들어 있다. 상권 분석가나 창업 예정자가 "송파구에서 최근 새로 문을 열거나 폐업한 의원이 어느 동네에 몰려 있나"를 확인할 때 쓰며, 병의원 개폐업은 상권 신호로 읽힌다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 구·병원·치과 등의 LOCALDATA 인허가 데이터와는 같은 기관 코드(OPNSFTEAMCODE)·관리번호나 사업장명·주소 매칭으로 이어 쓴다.
