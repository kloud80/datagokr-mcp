description_portal: '○ 통계개요* 통계명 : 보건소 인력현황* 통계종류 : 서울시 보건소의 인력현황을 제공하는 일반ㆍ보고통계* 근거법령 :「지역보건법」및 서울시조례에 따라 설치된 지역보건소의 인력현황* 작성목적 : 지역보건소의 설치 및 의료인력 등에 관한 사항을 파악하여 사회구성원들이건강한 생활을 영위할 수 있도록 보건복지정책 수립의 기초자료로 활용하는것을 목적으로 함* 조사체계 : 보건소 → 자치구 → 서울특별시 보건의료정책과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 보건소의 의료면허자격(의사, 간호사, 위생사 등) 및일반(보건직, 행정직 등) 인력현황○ 용어설명* 보건소 : 국가 보건행정의 합리적 운영과 국민보건의 향상을 도모하기 위한 의료기관.보건소는 지방자치단체의 조례가 정하는 바에 따라 전국의 각 구ㆍ시ㆍ군에 설치되어지역 보건 활동에 중추적 역할을 함'
