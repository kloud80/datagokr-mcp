summary_user: 서울 종로구에 등록된 이용업소(이발소 등)의 인허가 현황을 업소 한 곳당 한 행으로 담은 원천 자료로, 인허가일자·폐업일자·영업상태·소재지 주소·좌표·사업장명·의자 수 같은 항목이 들어 있다. 창업자나 상권 분석가가 '종로구에서 영업 중인 이발소가 어디에 몇 곳 있고 최근 폐업한 곳은 어디인가'를 확인하거나, 위생 점검 대상을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관(지자체) 코드로만 이어 붙이며, 같은 형식의 다른 구 인허가 자료와 행 단위로 합쳐 쓰기 좋다.
description_portal: 본 데이터는 서울특별시 종로구 관내에서 이용업을 영위하기 위해 등록된 업소의 인허가 현황을 정리한 자료입니다. 주요 항목에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 「공중위생관리법」에 따라 인허가를 받은 이용업소의 행정 처리 이력을 확인할 수 있습니다. 해당 자료는 이·미용업소 중 이발, 커트, 면도 등의 서비스를 제공하는 업소의 영업상태, 등록·폐업 이력, 관리번호 등을 체계적으로 파악할 수 있도록 구성되어 있습니다. 본 데이터는 위생 관리 및 공중보건 향상, 지역 서비스업 현황 분석, 정책 수립 및 민원 대응, 이용업소 안전점검 대상 선정 등 공공위생행정 전반에 걸쳐 기초자료로 활용됩니다.
