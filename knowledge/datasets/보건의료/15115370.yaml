summary_user: 서울특별시 중랑구에서 편의점 등 안전상비의약품을 파는 업소를 한 곳씩 담은 인허가 원천 목록으로, 관리번호·인허가일자·영업상태·폐업일자·주소·전화번호·사업장명·중부원점TM 좌표를 담는다. 주민이나 분석가가 '우리 동네에서 지금 영업 중인 상비약 판매 편의점이 어디 있나'를 찾거나, 업소의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(개방자치단체코드)로만 잇는다.
description_portal: '서울특별시 중랑구의 편의점 등 안전상비의약품으로 지정된 의약품을 판매하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
