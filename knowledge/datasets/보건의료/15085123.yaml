description_portal: '○ 통계개요* 통계명 : 지역사회 건강통계(건강행태)* 통계종류 : 서울시 및 자치구 건강통계를 제공하는 일반·보고통계* 근거법령 : 지역보건법 제4조(지역사회건강실태조사) 및 동법 시행령 제2조(지역사회건강실태조사 방법 및 내용)* 작성목적 : 지역주민의 건강상태를 파악하여 근거에 기반 한 보건정책을 수립·평가하기위한 통계자료 산출을 위해 지역사회건강조사 실시* 조사체계 : 시군구 보건소 → 시도 → 운영위원회 → 보건복지부 질병관리청* 공표주기 : 정기(매년)* 공표범위 : 지역 ? 서울시 및 자치구내용 ? 흡연율, 음주율, 비만율, 스트레스인지율 등의 백분율○ 용어설명* 현재흡연율 : 평생(지금까지) 5갑(100개비) 이상 흡연한 사람으로서 현재 흡연하는 사람("매일 피움" 또는 "가끔 피움")의 분율* 현재흡연자의 금연시도율 : 담배 종류와 상관없이 현재흡연자 중 최근 1년 동안 담배를 끊고자 24시간 이상 금연을 시도한 적이 있는 사람의 분율* 월간음주율 : 최근 1년 동안 한 달에 1회 이상 술을 마신 적이 있는 사람의 분율* 연간음주자의 고위험음주율 : 최근 1년 동안 음주한 사람 중에서 남자는 한 번의 술자리에서 7잔 이상(또는 맥주 5캔 정도), 여자는 5잔 이상(또는 맥주 3캔 정도)을 주 2회 이상 마시는 사람의 분율* 중강도이상 신체활동실천율 : 최근 1주일 동안 고강도 신체활동을 1일 20분 이상 주 3일 이상 또는 중강도 신체활동을 1일 30분 이상 주 5일 이상 실천한 사람의 분율* 걷기실천율 : 최근 1주일 동안 1회 10분 이상, 1일 30분 이상 걷기를 주 5일 이상 실천한 사람의 분율* 스트레스인지율 : 평소 일상생활 중 스트레스를 "대단히 많이" 또는 "많이" 느끼는 사람의 분율* 우울감경험률 : 최근 1년 동안 연속적으로 2주 이상 일상생활에 지장이 있을 정도의 우울감(슬픔이나 절망감 등)을 경험한 사람의 분율* 주관적 건강수준 인지율 : 평소에 본인의 건강이 "매우 좋은" 또는 "좋은"'
