summary_user: 2018~2022년 진료년도별로 전국 시군구 단위의 천식(J45·J46), 아토피성 피부염(L20), 비염·감기(J00·J30·J310) 주상병코드별 진료인원(중복제외)과 진료건수(중복허용)를 담은 집계 파일이다. 우리 지역의 아토피·비염 진료인원이 다른 시군구보다 많은지, 몇 년 사이 늘었는지를 보려는 지자체 보건 담당자나 환경보건 분석가가 쓴다. 전역 조인 키나 행정구역 코드는 없어서, 다른 지역 통계와는 시도·시군구 이름을 맞춰 연결하고 질병은 KCD 주상병코드로 맞춘다.
description_portal: '1. 진료년도: 2018~2022년2. 주상병코드:   - 천식 관련 : J45(천식), J46(천식지속상태)  - 아토피 관련 : L20(아토피성 피부염)  - 비염 관련 : J00(급성 비인두염[감기]), J30(혈관운동성 및 알레르기성 비염), J310(만성 비염)3. 진료인원 및 진료건수: 해당 연도에 진료받은 인원(중복제외) 및 건수(중복허용)  - 진료일 기준(한의분류 제외, 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2023년 6월 지급분까지 반영  - 개인정보 보호를 위해 시군구 단위의 5인 미만 자료는 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터'
