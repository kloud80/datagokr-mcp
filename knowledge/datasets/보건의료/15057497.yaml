summary_user: 경기도 내 30병상 이상 정신병원을 사업장 한 곳씩 담은 인허가 원천 목록으로, 인허가일·영업상태·폐업일, 병상·허가병상·입원실·의료인 수, 진료과목, 주소와 위도·경도를 포함한다. 정신건강 정책 담당자나 연구자가 "우리 시군에 영업 중인 정신병원이 몇 곳이고 병상은 얼마나 되나" 같은 질문에 쓰고, 병의원 개폐업 흐름을 보는 신호로도 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 시군 코드·명(SIGUN_CD)이나 사업장명·주소 매칭, 좌표를 이용한 공간 결합으로 다른 데이터와 잇는다.
description_portal: 「정신병원 현황(병원급)」 데이터는 경기도 내 30병상 이상 환자를 수용할 수 있는 정신병원의 인허가 및 운영 정보를 제공하는 자료입니다. 주요 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 병상수(SICKBD_CNT), 허가병상수(PERMISN_SICKBD_CNT), 의료인수(MEDSTAF_CNT), 입원실수(HOSPTLRM_CNT), 진료과목내용(TREAT_SBJECT_CONT), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT) 등입니다. 또한 일반구급대수(GENRL_AMBLNC_CNT), 특수구급대수(SPECL_AMBLNC_CNT), 구조사수(RESCUPSN_CNT) 등 응급대응 역량 관련 정보도 포함됩니다. 이 데이터는 경기도 31개 시군별 정신의료기관 현황을 확인할 수 있어 정신건강 치료 인프라 파악, 의료 자원 배치, 정책 수립 및 연구, 응급의료체계 평가 등에 활용될 수 있습니다.
