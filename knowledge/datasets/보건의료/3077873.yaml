summary_user: 인천광역시 계양구 관내에서 휴일에도 문을 여는 휴일지킴이 약국을 약국 한 곳당 한 행으로 담은 파일로, 약국명·전화번호·도로명 주소와 평일·토요일·일요일 운영시간을 담는다. 계양구 주민이 일요일이나 공휴일에 지금 문 연 가까운 약국이 어디인지, 몇 시까지 여는지 찾을 때 쓴다. 전역 조인 키가 없어 다른 약국·의료기관 데이터와는 약국명이나 도로명 주소를 맞춰 이어야 한다.
description_portal: 인천광역시 계양구 관내 휴일지킴이 약국 현황 데이터는 약국 명칭, 약국 전화번호, 약국 도로명 주소, 운영시간 등의 주요 정보를 포함하고 있습니다. 이 데이터는 계양구 내 휴일에도 운영하는 약국들의 위치와 연락처, 운영시간을 체계적으로 관리하여 주민들이 응급 상황이나 휴일에도 필요한 의약품을 편리하게 구할 수 있도록 돕습니다. 또한, 보건행정과에서는 약국 관리 및 운영 지원 업무에 중요한 기초자료로 활용합니다. 데이터에 관한 추가 문의는 인천광역시 계양구 보건행정과(032-430-7805)로 연락해 주시기 바랍니다.
