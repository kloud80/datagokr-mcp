description_portal: 본 데이터는 인천광역시 미추홀구 관내의 소독업소 현황을 수록한 자료로, 공동주택, 숙박업소 등 여러 사람이 거주하거나 이용하는 시설 중 대통령령으로 정하는 시설을 관리운영하는 자가 보건복지부령으로 정하는 바에 따라 감염병 예방에 필요한 소독을 하여야 하는 경우에 이용할 수 있는 소독업소의 정보를 담고 있습니다. 업소명칭과 사무실 도로명 주소, 위도 및 경도, 전화번호 항목으로 구성되어 있으며, 일부 연락처 정보는 비어 있을 수 있습니다. 주소는 도로명 형식으로 제공되어 위치 확인 및 지도 기반 시각화에 적합하며, 위경도 정보는 행정구역별 분포 분석이나 접근성 평가 등에 활용될 수 있습니다. 본 데이터는 감염병 예방 대책 수립, 시설별 소독주기 점검, 위생관리 대상지 지정 등 다양한 공공 보건 행정 업무에 활용되며, 해당 데이터는 정기적인 정보 갱신이 이루어집니다.
