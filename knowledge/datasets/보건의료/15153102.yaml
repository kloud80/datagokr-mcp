summary_user: 서울시설공단이 운영하는 시립승화원 자연장지의 유형별 요금표로, 감면 대상(국가유공자, 국가유공자 배우자, 의사상자 등)에 따른 기본 요금, 할인 금액, 감면 적용 시작일을 행 단위로 담은 소규모 CSV 파일(약 9KB)이다. 유족이나 장례 준비자가 '국가유공자 배우자는 자연장 요금을 얼마나 감면받나'를 확인하거나, 분석가가 공공 장사시설의 감면 체계를 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 자연장지 이름이나 감면 대상 명칭을 직접 맞추는 방식으로만 이어 쓴다.
description_portal: 서울특별시 장사시설(시립승화원) 자연장은 서울시설공단이 운영·관리하는 공공 장사시설로, 다양한 이용자에게 공정하고 투명한 요금 체계를 제공합니다. 자연장 이용과 관련된 정보는 자연장지의 유형, 감면 대상, 감면 적용 시작일, 기본 이용요금, 등록·수정 일시, 할인 금액 등 세부 항목으로 구성되어 있어 이용자가 본인의 조건에 맞는 요금을 쉽게 확인할 수 있도록 체계적으로 정리되어 있습니다. 특히 국가유공자, 국가유공자 배우자, 의사상자 등 여러 지원 대상별 감면 기준을 명확히 제시하여 사회적 배려계층이 합리적인 비용으로 장사 서비스를 이용할 수 있도록 하는 데 중점을 두고 있습니다. 이러한 데이터는 행정의 투명성을 높이고 시민 편의를 향상시키는 중요한 기반 자료로 활용됩니다.
