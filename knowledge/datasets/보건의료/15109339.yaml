summary_user: 광주광역시 도시철도 역 인근 약국을 약국 한 곳씩 담은 파일로, 역명과 역까지의 거리(미터), 인허가일자, 영업상태, 도로명주소, 위도·경도를 포함한다. 시민이나 보건 분석가가 '이 지하철역 근처 몇 미터 안에 영업 중인 약국이 어디 있나', '역별로 약국이 얼마나 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 실측에서 찾지 못해 다른 데이터와는 관리번호나 약국명·주소 매칭, 또는 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 광주광역시 도시철도 역 인근 약국 현황을 상세히 기록한 자료로, 각 약국의 위치, 영업 상태, 인허가 정보 등을 포함하고 있습니다. 주요 항목에는 문화노선도명(역명), 역과의 거리(미터), 인허가일자, 사업장명(약국명), 상세영업상태코드 및 명칭, 위도·경도 좌표, 관리번호, 도로명 전체 주소, 영업상태구분코드 및 명칭, 데이터 갱신일자와 갱신구분이 포함됩니다.이 자료를 통해 지하철 역세권 내 약국 분포를 분석할 수 있으며, 접근성 평가, 응급 의약품 공급 거점 파악, 시민 의료 편의성 개선 계획 등에 활용할 수 있습니다. 특히 좌표 데이터와 결합해 지도 시각화를 수행하면, 역별 의료 인프라 밀집도 분석, 취약 지역 식별, 보건 정책 수립 등에 유용하며, 약국 개·폐업 변동 추적을 통한 상권 변화 연구에도 활용 가능합니다.
