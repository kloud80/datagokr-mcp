summary_user: 국가건강검진기관별 교통편(지하철·시내·시외·마을·공항버스) 정보 입력 여부와 공공건물 위치 입력 여부, 신청·변경 일시 같은 상세정보를 기관 단위로 담는 API로, 범위는 전국이고 위치는 개별 주소·좌표 수준이다. 건강검진을 받으려는 국민이나 서비스 개발자가 '이 검진기관은 대중교통으로 찾아가기 쉬운가, 기본정보와 검진 항목·예약 정보는 어떤가'를 확인하는 데 쓴다. 요양기관기호(ykiho)가 필수 파라미터이자 조인 키이므로, 이 기호를 주는 다른 의료기관 목록 데이터에서 먼저 값을 받아 넘겨 연결한다.
description_portal: 검진기관별 정보제공 조회 서비스인 해당 API는 5개의 오퍼레이션을 제공하고 있습니다.국가건강검진기관별 상세정보를 체계적으로 제공하는 서비스로, 지역 기반 검색은 물론 검진 항목 구성, 운영 환경, 시설 규모, 접근성 등 다양한 조건을 비교할 수 있습니다. 기관별 진료 역량과 최신 운영 현황을 확인해 사용자가 보다 적합한 검진기관을 선택하도록 돕습니다. 또한 이용자 중심의 정보 구성으로 각 기관의 예약 절차, 부대 서비스, 교통 편의성을 한눈에 파악할 수 있어 검진 준비 과정을 효율적으로 관리할 수 있으며, 정확히 도와주고 지원합니다.
