description_portal: 한국보건의료연구원은 <공공데이터 제공 및 이용 활성화에 관한 법률>에 따라 연구보고서 목록을 공공데이터로 제공하고 있습니다. 이 데이터는 2009년부터 현재까지 우리 연구원이 수행한 보건의료 분야 연구 결과 보고서 목록을 담고 있습니다.이 데이터는 한정된 의료자원의 효율적 배분과 보건의료정책 의사결정 지원을 위한 과학적 근거 자료로 활용될 수 있습니다. 특히, 의료기술평가, 임상근거연구, 보건의료 정책 연구 등 다양한 분야의 연구보고서 목록을 제공함으로써 국민과 정책 입안자들이 우리 연구원의 연구 현황을 손쉽게 파악하고, 새로운 연구나 정책 개발에 활용할 수 있도록 돕습니다.
