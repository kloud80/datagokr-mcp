summary_user: 의료기기 이상사례 보고에 쓰는 국제조화(IMDRF) 간편표준코드를 코드 단위로 담은 코드집으로, FDA 출처코드(FDA_ORI_CD)와 NCIT 코드, 원인분류, FDA 우선 한글·영문 용어명, 한글·영문 정의를 담는다. 의료기기 취급자가 사용 중 발생한 이상사례를 보고할 때 "이 증상이나 고장은 어떤 표준코드로 입력해야 하나"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 FDA·NCIT 코드값이나 용어명 매핑으로만 이어 쓴다.
limits: 이 데이터는 코드 정의 사전이며 실제 이상사례 발생 건수나 보고 내역은 담지 않는다. 의료기기 품목허가 등 다른 식약처 데이터와 바로 이을 공통 키가 없다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
