summary_user: 대구광역시 9개 구·군에서 현재 운영 중인 의료기관(상급종합병원부터 의원·한의원·치과의원·부속의원까지)을 기관 한 곳당 한 행으로 담은 파일로, 종별·병상 수(일반·정신·요양·중환자·격리·무균 병상, 임종실)·도로명 소재지·전화번호를 포함하며 포털 설명상 전체 4,179개소입니다. 주민이나 분석가가 '우리 구에 요양병상이나 중환자병상을 갖춘 병원이 어디에 몇 곳 있는가'처럼 구·군별 의료기관 분포와 병상 규모를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 구군명이나 의료기관명·주소 문자열을 맞춰 이어야 하며, 의료기관 인허가 원천(LOCALDATA)이나 심평원 병원정보와 연결할 때도 이름·주소 매칭에 의존한다.
description_portal: '- 대구광역시 9개 구, 군의 전체  의료기관(상급종합병원, 종합병원, 병원, 정신병원, 요양병원, 한방병원 치과병원, 의원, 한의원, 치과의원, 부속의원)의 현황입니다.- 전체 의료기관 수는 4,179개소로 중구 483개소, 동구 506개소, 서구 272개소, 남구 257개소, 북구 599개소, 수성구 910개소, 달서구 871개소, 달성군 264개소, 군위군 17개소 입니다.- 해당 데이터는 상호, 종별, 의료기관 명칭, 병상 수, 소재지, 연락처 등 현재 운영 중인 의료기관의 세부내역이 등재되어 있습니다.- 해당 데이터는 구, 군에서 제공받았습니다.'
