description_portal: '전북특별자치도 전주시 내 치과기공소를 제공하며 사업장명, 인허가일자, 소재지전화번호, 도로명주소, 지번주소, 위도, 경도 등을 제공합니다.치과기공소는 인공 치아를 제작하거나 보수하는 업소활용 포인트 :  지역 내 치과기공소 분포 현황을 파악 가능,  주소 및 연락처 정보를 통해 시민들이 기공소 접근성 향상 ,  보건 정책 담당자는 치과 의료 인프라 확충 계획 수립에 활용연구자나 기업은 치과 산업 현황 및 지역별 수요 분석 자료로 활용 가능이 데이터는 전주시민의 치과 의료 서비스 품질과 접근성을 높이고, 행정기관이 지역 보건·산업 정책을 설계하는 데 중요한 기초자료입니다. 담당부서: 보건행정과'
