description_portal: 정기간행물 목록에 관한 데이터로 중재원에서 발간하는 의료분쟁 조정·중재 통계 연보, 의료중재원 감정사례집, 조정 사례집 목록에 관한 자료이다.통계 연보는 의료분쟁 조정·중재 기관으로서의 활동을 투명하게 공개함으로써, 일반 국민이나 의료계, 정책 입안자 등이 현황을 파악하고 제도 개선 방향을 모색할 수 있게 한다.감정사례집은 실제 의료감정 사례를 수록하여, 의료인, 법률가, 환자 등이 과거 사례를 통해 분쟁 예방, 진단, 해결 전략에 대해 배울 수 있도록 돕는다.의료사고예방 소식지는 조정 중재뿐 아니라 예방하는 차원에서 중요한 역할을 하며, 의료 현장의 안전 문화를 조성하는 데 기여한다.정기간행물명, 다운로드 위치(URL), 첨부파일명, 작성일, 사용가부 등의 내용을 해당 개방데이터로 확인 가능하다.
