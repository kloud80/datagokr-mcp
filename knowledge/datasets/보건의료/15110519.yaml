summary_user: 대구광역시 동구 안의 한의원을 한 곳씩 담은 목록으로, 등록번호(REG_NO)와 영업소명·주소·전화번호를 담는다. 동구 주민이 집 근처 한의원의 위치와 연락처를 찾거나, 분석가가 동구 안 한의원 분포를 주소 단위로 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명·주소를 맞춰 보거나 같은 기관(동구) 자료끼리만 이어 쓴다.
limits: 범위가 대구 동구 한 곳이라 다른 시군구나 전국 비교에는 쓰지 못한다. 공통 코드 키가 없어 LOCALDATA 인허가 자료 등과 연결하려면 이름·주소 매칭이 필요하다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
