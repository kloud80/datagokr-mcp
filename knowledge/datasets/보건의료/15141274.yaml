summary_user: 서울 금천구 내 약국을 한 곳씩 담은 인허가 원천 데이터로, 인허가일자·취소일자, 영업상태와 상세 영업상태, 폐업일자, 휴업 시작·종료일, 지번·도로명 주소, 전화번호, 사업장명, 약국 영업면적(PHARMTRDAR), 지정일자, 좌표(X, Y)를 담는다. 창업 예정자나 분석가가 "금천구에서 지금 영업 중인 약국은 어디에 몰려 있고, 최근 몇 곳이 문을 닫았나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 본 데이터는 금천구 내 약국의 인허가 정보를 체계적으로 정리한 자료로, 약국 현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명 등 기본 정보는 물론, 약국 영업면적, 지정일자, 인허가 구분 등 실제 운영과 관련된 세부 항목까지 포함하고 있습니다. 이를 통해 약국 창업 계획 수립, 지역 내 의약품 접근성 분석, 보건 정책 개발, 약국 분포 현황 파악 등 다양한 분석과 정책 수립에 활용할 수 있으며, 지역 보건 인프라의 현황을 보다 정밀하게 이해하는 데 도움을 줍니다.
