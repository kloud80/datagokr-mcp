description_portal: 이 데이터는 한국한의약진흥원이 수집·정제한 한약 실험정보 중 약력학 시험의 생체 내(In vivo) 데이터로, 표에 제시된 항목 그대로 한약재별 실험 정보를 구조화해 담고 있습니다. 주요 필드는 한약재 ID, NCBI Taxonomy ID, 연구대상질환명, 국제질병분류(ICD11) ID, 시험종류, 세포주 이름, 실험체 상태, 추출용매, 투여약물명, 검사대상 유형과 이름, 측정항목, 측정결과 등으로 구성됩니다. 예시 데이터에는 한약재 ID KMH158이 Alzheimer’s disease(08A20) 모델에서 사용된 기록이 포함되어 있으며, 각 행은 투여약물명, 검사대상, 측정항목, 측정결과 등을 동일한 형식으로 정리하여 한약재의 생체 내 시험 조건과 측정 결과를 체계적으로 제공하는 것이 특징입니다.
