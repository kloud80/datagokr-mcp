description_portal: 이 데이터는 충청남도 서산시의 월별 코로나19 확진자 및 사망자 수 현황을 정리한 공공자료이다. 항목은 날짜(년), 날짜(월), 확진자수, 누적확진자수, 사망자수, 누적사망자수로 구성되어 있으며, 지역 내 감염병 발생 추이를 파악하고 방역 정책 수립에 활용된다. 확진자수는 월별 신규 확진 사례 수이며, 누적확진자수는 전체 누계를 의미한다. 사망자수는 해당 월 발생한 사망자 수이며, 누적사망자수는 지금까지 집계된 전체 사망자를 나타낸다. 본 자료는 시민에게 감염병 정보를 제공하고, 행정기관 및 민간의 분석, 연구, 보건정책 수립에 필요한 기초자료로 사용된다.
