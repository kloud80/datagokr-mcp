description_portal: '- 전라남도 보건환경연구원 홈페이지에 게시된 하천수 호소수 관련 검사항목 및 수수료에 관한 사항을 정리한 파일입니다.- 전라남도 보건환경연구원(전남연구원)은 전라남도 전체 지역의 보건·환경 분야 시험, 조사, 분석 및 민원 서비스를 책임지는 공공 연구기관입니다.- 전남도 내 보건·환경 분야의 공신력 있는 분석결과와 국제 수준의 시험 정확성을 자랑하는 기관입니다.- 검사의뢰 안내:- 미생물, 식품·약품, 수질, 폐수·폐기물, 대기, 소음·진동 등 다양한 항목 시험 가능 - 관련 양식, 수수료, 처리기한, 시험량 정보는 홈페이지 자료실 및 공공데이터에서 열람 가능- 본원 (무안군): 보건연구부(미생물, 감염병, 식품·약품 분석 등)와 환경연구부(대기, 수질, 토양·폐기물, 소음·진동 등) 운영 - 동부지원(순천시 해룡면): 대기보전, 산업폐수, 악취, 감염병 조사, 농산물 검사 업무 담당'
