summary_user: 제주특별자치도 안의 응급의료기관을 기관 한 곳당 한 행으로 담은 작은 파일(CSV 625바이트)로, 응급의료센터 구분, 기관명, 소재지 주소, 전화번호, 데이터기준일자를 담는다. 제주 도민이나 관광객이 '제주에서 가장 가까운 응급실이 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 제주 지역 응급의료센터 배치를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키(기관코드 등)가 없어 다른 응급의료·의료기관 데이터와는 기관명이나 주소를 직접 맞춰서만 연결해 쓴다.
description_portal: '제주특별자치도 내 소재하는 응급의료기관 데이터를 제공합니다.항목: 의료기관, 소재지, 전화번호 등*권역응급의료센터: 보건복지부장관이 응급의료에 관한 법률 제26조에 따라 상급종합병원 또는 300병상을 초과하는 종합병원 중에서 지정함*지역응급의료센터: 시·도지사가 응급의료에 관한 법률 제30조에 따라 종합병원 중에서 지정함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1261'
