description_portal: 1.  데이터 개요헬스맵(HealthMap)은 시도·중진료권·시군구 등 지역 단위의 공공보건의료 현황을 시각화하여 제공하는 WebGIS 기반 서비스입니다. 본 데이터세트는 헬스맵 서비스에서 제공하는 의료수요, 의료자원, 의료이용, 건강결과 모니터링 지표 및 의료취약지 현황, 의료이용 유출입 정보 등을 기초자료 형태로 공개하여, 공공보건의료 정책수립, 연구, 지역분석 등에 활용할 수 있도록 구성되었습니다.2. 데이터 상세설명① 기관정보- 지역별 의료기관 종별(상급종합병원, 종합병원, 병원, 의원 등) 위치 정보 제공- 진료과목 개설 여부, 시설현황, 응급의료기관 구분, 공공의료기관 구분 등 현황 포함- 지역별 의료자원의 공급 수준 및 변화 추이를 파악하는 데 활용 가능② 의료이용 유입·유출 통계 데이터- 환자가 거주지 외 지역의 의료기관을 이용하는 흐름을 분석한 자료- 지역 간 의료이용 이동 패턴(유입·유출), 진료유형별 이용 규모 포함- 지역의 의료이용 접근성·의존도·자족도 분석에 활용 가능- (지역1 기준) 해당 지역으로 유입되는 의료이용량(입원명세서 건수) 파악 가능- (지역2 기준) 해당 지역에서 유출되는 의료이용량(입원명세서 건수) 파악 가능③ 분야별 의료취약지 현황 데이터- 분야별(분만, 응급, 소아청소년과, 인공신장실) 의료취약지 선정 결과 및 산출 지표(접근성취약인구율, 기준시간내의료이용률(TRI)등) 지역 통계 제공- 의료취약지역 선정 및 정책지원 우선순위 도출에 활용 가능④ 지역별 모니터링 지표- 의료수요, 의료자원, 의료이용, 건강결과 등 지역 공공보건의료 전반을 평가하기 위한 지표 제공- 지역 간 의료격차 진단 및 정책성과 모니터링에 활용 가능- 코드 A는 시도, B는 중진료권, C는 시군구 단위를 구분하는데 활용
