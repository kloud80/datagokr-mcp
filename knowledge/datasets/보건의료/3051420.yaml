summary_user: 노인장기요양보험 등급판정 결과를 전국 단위로 집계한 통계 파일로, 구분별로 판정 대상자 전체 수와 1~5등급·인지지원등급 인정자 수, 등급외A·B·C 등급외자 수를 담는다(약 2.6KB 크기의 CSV). 장기요양 정책 담당자나 연구자가 '장기요양 인정자는 등급별로 어떻게 분포하고 등급외자는 얼마나 되나'를 확인하고 서비스 제공 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 항목의 이름을 맞추거나 같은 기관(국민건강보험공단)의 장기요양 통계와 나란히 놓고 비교하는 방식으로만 연결한다.
description_portal: '□ 데이터 개요본 데이터는 국민건강보험공단이 관리하는 노인장기요양보험의 등급판정 결과에 따른 인정자 및 등급외자 현황을 집계한 통계 자료입니다.장기요양 급여 수급 대상자의 등급별 분포와 등급외자 현황을 파악할 수 있어 장기요양 서비스 정책 수립 및 운영에 중요한 기초자료로 활용됩니다.□ 주요 내용 1) 전체계: 장기요양보험 급여판정을 받은 전체 대상자 수 2) 인정자소계: 장기요양 등급별 인정자 수    - 1등급부터 5등급까지의 세부 등급    - 인지지원등급(인지기능 저하로 돌봄이 필요한 대상자) 3) 등급외자소계: 등급 판정은 받았으나 등급 외 구분에 해당하는 자    - 등급외A, 등급외B, 등급외C 등 세부 구분 포함□ 활용 안내본 자료는 노인장기요양보험 서비스 대상자의 등급별 분포 및 특성을 분석하여 장기요양서비스 제공 계획 수립, 급여 관리 및 정책 평가에 활용됩니다.'
