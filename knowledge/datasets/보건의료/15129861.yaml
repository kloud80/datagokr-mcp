summary_user: 전국 시군구(수진자 주소지 기준)별·진료과목별로 월 단위 건강보험 진료인원과 진료건수를 담은 집계 파일이며, 포털 설명상 2022~2023년 월별 자료입니다. 보건 분석가나 지자체 담당자가 '우리 시군구에서 어느 진료과목 이용이 많고 월별로 어떻게 변하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도·시군구 이름이나 진료과목코드를 매핑해 다른 지역·진료 통계와 이어 붙여야 한다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 이름 매칭으로만 다른 데이터와 연결된다. 공단 자료는 자격 기준이라 심평원의 청구 기준 통계와 값이 다르므로 섞어 비교할 때 주의한다.
