summary_user: 대구광역시 서구 관내 병원급·의원급 의료기관과 보건소를 기관 한 곳당 한 행으로 담은 파일로, 의료기관명·종별(병원·의원·치과·한의원·요양병원·정신병원·보건소 등)·도로명주소·전화번호를 수록한다. 서구 주민이 동네에서 진료받을 치과나 한의원을 찾거나, 분석가가 서구 안에서 종별 의료기관이 어떻게 분포하는지 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명주소를 맞춰 붙여야 하며, 주소를 좌표로 바꿔 지도나 LOCALDATA 병의원 인허가 자료와 대조하는 방식으로 이어 쓴다.
limits: 범위가 대구 서구 한 시군구에 한정되어 다른 지역과 비교하려면 별도 자료가 필요하다. 기관 코드 같은 공통 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결할 수 있고, 이 과정에서 매칭 오류가 생길 수 있다.
