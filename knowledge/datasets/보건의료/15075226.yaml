description_portal: '보건복지부에서 2017년부터 2023년까지 조혈모 세포 기증 현황(기증연, 기증장기, 지역, 성별, 연령, 혈액 등)에 대한 정보를 제공합니다.<통계 데이터 이용 시 참고사항>1. 통계 데이터에 값이 없는 경우는 공백으로 표기하였습니다.2. 장기기증일은 적출일을 기준으로 작성하였습니다.3. 조혈모세포 : 혈액과 면역체계의 모체세포로서 생존유지에 절대적으로 필요하며 보통 골수, 말초혈액이나 아기의 탯줄, 태반에 존재4. 데이터 출처 : 장기이식의료기관, 장기이식등록기관 등으로부터 기증(희망)자 정보, 이식자 정보, 대기자 정보를 장기조직혈액통합관리시스템을 통해 통보받아 통계 작성'
