summary_user: 부산광역시 서구 관내 의료기관별로 의료기관명·종별·병상수와 CT·MRI 특수의료장비 공동활용 동의 여부를 기관 한 곳당 한 행으로 담은 소규모 파일(csv 477바이트)이다. 보건행정 담당자나 분석가가 '서구에서 CT·MRI 공동활용에 동의한 병원은 어디이고 병상 규모는 어떤가'를 확인하거나 장비 중복 설치·공동활용 실태를 파악할 때 쓴다. 전역 조인 키나 기관 코드가 없어 다른 의료기관 인허가 데이터(LOCALDATA 병원·의원 등)와는 의료기관명으로 맞춰 이어 써야 한다.
description_portal: 본 자료는 부산광역시 서구 관내 의료기관의 특수의료장비 공동활용 동의 현황입니다.관내 의료기관 간의 자원 공유 및 협력 실태, 특수의료장비 운영 합리화, 의료서비스 접근성 향상 등의 정책적 판단에 기초자료로 활용될 수 있으며,의료기관 간 협력 구조 파악, 장비 설치 기준 이행 현황 분석, 보건의료 행정 효율성 제고를 위한 근거 자료로도 활용 가능합니다.또한, 장비의 중복 설치 방지, 지역 간 의료 형평성 확보, 보건의료 계획 수립 등과 관련한 행정적‧정책적 용도로도 유용하게 사용될 수 있습니다.데이터는 의료기관명, 의료기관종별, 병상수, 전산화단층촬영장치(CT) 동의 현황, 자기공명영상촬영장치(MRI) 동의 현황 등의 항목을 포함하고 있습니다.
