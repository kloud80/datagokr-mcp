summary_user: 경기도 내 의료기관별로 건강보험심사평가원이 만성폐쇄성폐질환(COPD) 진료 적정성을 평가한 등급(1~5등급)을 기관 한 곳당 한 행으로 담고, 시군명·주소·위경도를 함께 제공한다. 경기도 주민이 사는 시군에서 COPD 평가등급이 높은 병원이 어디인지 찾거나, 분석가가 시군별 등급 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)나 기관명·주소 매칭으로만 이어 쓰며, 위경도로 지도 위에 다른 의료기관 데이터와 겹쳐 볼 수 있다.
description_portal: 이 데이터는 경기도 내 의료기관을 대상으로 만성폐쇄성폐질환(COPD)에 관한 치료 및 관리 수준을 평가한 병원평가 정보를 제공합니다. 건강보험심사평가원이 수행한 이 평가는 해당 질병의 진료 적정성, 치료결과, 관리체계 등을 종합적으로 고려하여 병원별 치료 역량을 1~5등급으로 나눈 결과를 포함하고 있습니다. 주요 항목은 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 주소정보(도로명, 지번), 우편번호 및 위도·경도 좌표 등으로 구성되어 있습니다.평가등급은 종합점수 기준으로 1등급(80점 이상)부터 5등급(35점 미만)까지 세분화되며, 대상 환자 수가 적거나 평가지표 미충족 기관은 등급에서 제외됩니다. 이 데이터는 지역 주민의 의료기관 선택에 도움을 주고, 행정기관이나 연구기관이 의료 질적 수준을 분석하거나 지역 의료서비스 개선방안을 수립하는 데 활용할 수 있습니다. 또한, 병원별 COPD 대응능력 비교, 공공보건정책 수립, 의료자원 배분 전략 등 다양한 보건행정 업무에 실효성 있는 지표로 쓰일 수 있습니다. 데이터는 Open API 방식으로 제공되어 실시간 연계 및 활용이 가능하며, 질병 중심 의료평가 데이터로서 공공성과 활용성을 겸비한 자료입니다.
