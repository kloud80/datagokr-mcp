summary_user: 식약처가 허가·신고한 의료기기의 형명(모델명)을 품목일련번호 단위로 담은 전국 범위 API로, 허가번호·품목명·허가일자, 취소·취하 여부와 일자, 상품명과 모델명, 수출 여부를 함께 제공한다. 병원 구매 담당자나 유통업자가 특정 모델명의 의료기기가 정식 허가를 받았는지, 허가가 취소·취하되지 않았는지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 확인되지 않아, 의료기기 품목허가 데이터 등과는 허가번호(MEDDEV_ITEM_NO)나 품목명 같은 이름·코드 매칭으로 이어 써야 한다.
limits: 전역 조인 키가 없어 다른 데이터와의 연결은 이름·코드 매핑이나 같은 기관 코드에 의존한다. 개발계정은 하루 10,000회로 호출이 제한되며, 지역 단위가 없는 비공간 전국 데이터라 지역별 분석에는 맞지 않는다.
