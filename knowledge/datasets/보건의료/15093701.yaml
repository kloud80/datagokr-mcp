summary_user: 대구광역시 서구보건소에서 받을 수 있는 검사(간기능·콜레스테롤·혈당·혈액·소변·성병 및 에이즈·건강진단서용 검사 등)를 검사별로 한 줄씩 정리한 안내표로, 검사명·검사내용·수수료(원)·비고를 담은 1KB 남짓의 작은 CSV 파일이다. 서구 주민이나 채용·기숙사용 건강진단서가 필요한 사람이 "보건소에서 이 검사를 받으려면 얼마이고 공복 등 무엇을 준비해야 하나"를 확인하는 데 쓴다. 실측 컬럼에 보건소코드·시군구코드 같은 전역 조인 키가 없어 다른 데이터와는 검사명이나 기관명(대구 서구보건소)으로만 맞춰 이어 쓴다.
description_portal: 대구광역시 서구보건소에서 받을 수 있는 각종 검사들에 대한 데이터 입니다. 각각의 검사내용들과 수수료 등의 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구청 소속 서구보건소에서 실시하는 다양한 건강검사 항목과 검사내용, 수수료, 유의사항 등을 정리한 안내 자료이다. 주요 항목으로는 간기능검사, 콜레스테롤검사, 혈당 및 당화혈색소검사, 혈액검사, 소변검사, 성병 및 에이즈검사, 건강진단서 발급용 검사가 있으며, 검사별로 필요한 사전 조건이나 공복 유지 여부 등도 명시되어 있다. 특히 채용 및 기숙사용 건강진단서에 포함되는 검사 항목과 수수료 정보가 함께 제공되어 수검자의 사전 준비에 도움을 준다. 일부 항목은 무료로 제공되며, 진단서 발급 시 오프라인과 온라인의 수수료 차이도 안내되어 있다. 본 자료는 보건서비스 이용자의 검사 항목 선택, 사전 준비 및 비용 예측에 유용하게 활용될 수 있다.
