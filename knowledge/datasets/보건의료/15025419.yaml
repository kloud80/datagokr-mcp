summary_user: 부산광역시 연제구에 있는 의약품 도매상·한약 도매상 업소를 한 곳씩 상호명, 도로명 주소, 연락처로 담은 목록 파일입니다(약 3KB 규모의 CSV, 포털 설명상 2025.7.17. 기준). 연제구에서 영업 중인 의약품 도매업소가 어디에 있고 연락처가 무엇인지 확인하려는 약국·병원 구매 담당자나 지역 유통 현황을 보는 분석가가 쓴다. 공통 조인 키나 업소 코드가 없어 다른 데이터와는 상호명·주소 문자열을 맞추거나 주소를 지오코딩해 이어 쓴다.
description_portal: 부산광역시 연제구 의약품업소(의약품 도매상, 한약 도매상)현황 데이터입니다.(2025.7.17.기준)상호명, 소재지를 제공합니다.제45조(의약품 판매업의 허가) ①제44조 제2항 제2호에 따른 한약업사 및 의약품도매상이 되려는 자는 보건복지부령이 정하는 바에 따라 시장ㆍ군수ㆍ구청장의 허가를 받아야 한다. 허가 받은 사항을 변경할 경우에도 또한 같다.② 제1항에 따라 허가를 받으려는 한약업사 또는 의약품 도매상은 다음 각 호의 구분과 같이 시설을 갖추어야 한다.1. 한약업사는 영업소와 그 밖에 대통령령으로 정하는 기준에 맞는 시설2. 의약품 도매상은 영업소와 창고 및 그 밖에 대통령령으로 정하는 기준에 맞는 시설. 이 경우 창고의 면적은 165제곱미터 이상이어야 한다. 다만, 수입의약품ㆍ시약ㆍ원료의약품만을 취급하는 경우에는 창고의 면적이 66제곱미터 이상이어야 하고, 동물용의약품만을 취급하는 경우에는 창고의 면적이 33제곱미터 이상이어야 하며, 한약ㆍ의료용고압가스 및 방사성의약품만을 취급하는 경우에는 창고의 면적기준을 적용하지 아니한다.
