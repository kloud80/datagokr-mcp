summary_user: 세종특별자치시에 있는 병원·의원을 한 곳당 한 행으로 담은 파일로, 의료기관명·종별(종합병원, 병원, 요양병원, 한방병원, 치과병원 등)·도로명주소·전화번호를 담는다. 시민이 집 근처 정신건강의학과 의원이나 요양병원을 찾을 때, 분석가가 세종시 생활권별 의료기관 분포와 종별 구성을 볼 때 쓴다. 기관 코드 같은 전역 조인 키가 없어 다른 의료기관 데이터와는 기관명이나 도로명주소를 맞춰 이어 쓰고, 주소를 좌표로 바꾸면 지도·상권 분석에도 쓴다.
description_portal: 세종특별자치시에 있는 병원, 의원 정보를 제공합니다.데이터는 순번, 의료기관명, 의료기관 분류(한방병원, 병원, 종합병원, 치과병원, 요양병원 등), 의료기관 주소, 의료기관 전화번호로 구성되어 있습니다.세종특별자치시에 등록된 총 457개의 병의원 정보를 포함하고 있으며, 강남세종한방병원, 의료법인 영제 의료재단 엔케이세종병원, 단국대학교 치과대학 세종치과병원의료법인은혜의료재단 은혜병원, 의료법인 선은의료재단 중앙요양병원, 마인드랩공간정신건강의학과의원, 오케이마취통증의학과의원 등이 있습니다.
