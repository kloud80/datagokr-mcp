description_portal: 해당 데이터는 보건산업통계시스템에서 제공하는 국가별 보건산업 관련 지도 통계 정보를 담고 있습니다. 주요 컬럼으로는 지도ID, ISO국가코드, 연도, 분야, 데이터값, 상태관리, 국가명이 포함되어 있어, 전 세계 국가를 대상으로 연도별, 분야별 보건산업 지표를 파악하는 데 활용됩니다.분야 항목은 MEDI(의료기기), PHARMA(제약), HSERVICE(보건 서비스) 등의 보건산업 세부 영역을 나타내며, 데이터 컬럼은 각 분야의 경제적 규모 또는 관련 지표 값을 포함하고 있습니다. 이를 통해 사용자는 특정 연도 및 분야에서 각 국가가 차지하는 비중이나 추이를 비교 분석할 수 있습니다.
