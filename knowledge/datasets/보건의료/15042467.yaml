summary_user: 2025년도 보건소 모바일 헬스케어 사업의 대상자 등록 목표를 보건소(기관)별로 담은 집계 파일로, 시도·기관명과 목표등록자수·대상자수·등록률을 전국 범위로 제공한다(2025.11.20 기준). 지자체 보건 담당자나 분석가가 "우리 시도 보건소들이 모바일 헬스케어 등록 목표를 얼마나 채웠나"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 보건소코드·시군구코드 같은 코드로 바로 잇지 못하고, 다른 보건소·지역사회 건강조사 자료와는 시도명·기관명을 매핑해야 연결된다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.2025년도 보건소 모바일 헬스케어 사업 대상자 등록 목표인원 정보로서 추출시점, 시도, 기관명, 등록율, 목표등록자수, 대상자수 정보를 제공합니다.(2025.11.20기준)
