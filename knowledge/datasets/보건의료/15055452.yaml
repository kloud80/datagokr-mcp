summary_user: 경상남도 창원시 진해구에 있는 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 종합병원·병원·요양병원·의원·치과의원·한의원 등 종별, 기관명, 도로명 주소, 대표 전화번호를 담는다. 진해구 주민이나 분석가가 '우리 동네에 어떤 종류의 병의원이 어디에 있고 전화번호는 무엇인가'를 확인하거나 구 안의 의료기관 분포를 살펴보는 데 쓴다. 전역 조인 키(요양기관기호 등)가 없어 심평원 요양기관 정보 등 다른 데이터와는 기관명이나 주소를 맞춰 대조하는 방식으로만 이어 쓴다.
limits: 진해구 한 개 구만 다루므로 창원시 전체나 다른 지역과 비교하려면 별도 데이터가 필요하다. 요양기관기호 같은 공통 코드가 없어 진료과·병상·진료시간 등 상세 정보와 연결할 때는 이름·주소 매칭 오류에 주의해야 한다.
