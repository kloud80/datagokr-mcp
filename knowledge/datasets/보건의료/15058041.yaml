summary_user: 마약류 및 원료물질 취급 승인 건별로 업체명·업체 소재지·취급승인번호·취급 시작일과 종료일을 담은 전국 범위 원천 API다. 제약·연구 업계 관계자나 규제 분석가가 '이 업체가 지금 마약류 취급 승인 기간 안에 있는가'처럼 업체별 승인 현황과 취급 기간을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소를 매칭하거나 같은 식약처 데이터의 코드로만 이어 붙인다.
description_portal: 식품의약품안전처에서 제공하는 마약류 및 원료물질 정보 데이터는 의약품  관련 분야에서 마약류 및 그 원료물질의 취급, 성분, 허가 등 행정 정보를 조회할 수 있도록 구성된 공공데이터입니다. 취급승인번호, 업체명, 업체 소재지, 취급 시작일자, 취급 종료일자 등 다양한 세부 항목으로 구성되어 있습니다. 이 데이터를 활용하면 마약류 취급 승인 현황을 업체별로 확인하고, 허가 기간이나 취급 이력을 체계적으로 파악할 수 있으며, 규제 현황 분석, 법적 준수 여부 평가, 연구 목적 활용 등에 참고할 수 있습니다.
