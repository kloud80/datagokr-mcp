description_portal: 우리 원 병상별 입원환자 통계에 대한 정보를 제공하는 데이터 입니다.1인실, 4인실, 5인실, 6인실, 신관1인실, 격리병실(음압격리 1인실, 음압격리 다인실), 낮병동 입원실 총 9개의 항목에 대한 입원환자 통계정보를 제공하고 있습니다. 1월부터 12월까지 12개월간에 병동에 입원한 환자에 대한 전체적인 수치도 알 수 있을 뿐더러 월별로 병상에 입원한 현황도 파악할 수 있으며 이를 통해 전체적인 병동 운영 현황을 파악할 수 있습니다.(다만 년도별로 병실등급은 상이할 수 있으며 해당 년도에 병실운영은 통계에 제공한 것과 동일합니다.)
