summary_user: 국립재활원 한 기관의 입원환자 수를 병실등급(1인실·4인실·5인실·6인실·신관1인실·음압격리 병실·낮병동 등 9개 항목)별로 1월~12월 월별 집계한 작은 파일(약 523바이트)이다. 국립재활원 병동 운영 현황, 예컨대 어떤 병실등급에 어느 달 입원이 몰렸는지를 보려는 분석가나 재활의료 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병실등급 이름이나 같은 기관 기준으로만 맞춰 이어 쓴다.
limits: 한 기관의 병실등급별 월 집계라 환자 단위 분석이나 다른 병원과의 비교에는 쓰지 못한다. 범위가 '전국'으로 분류돼 있지만 내용은 국립재활원 한 곳의 통계이며, 연도별로 병실등급 구성이 달라질 수 있어 연도 간 비교 때 항목을 맞춰 봐야 한다.
