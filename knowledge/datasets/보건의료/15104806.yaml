summary_user: 천식(J45·J46) 상병과 관련 약제 처방 조건을 충족한 진료에피소드 건수를 요양개시년월·시군구·성별·연령군별로 집계한 파일로, 2006년 1월~2025년 12월 범위를 외래·입원 합계와 입원만 두 갈래로 담는다. 보건·환경 분석가가 "특정 시군구에서 어린이 천식 진료가 어느 달에 늘었나" 같은 지역·연령별 천식 의료이용 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구 이름과 연월을 맞춰 대기오염·인구 통계 등과 이어 쓰며, 심평원 청구 기준 통계와는 기준이 달라 값을 그대로 비교하지 않는다.
description_portal: "1. 사례정의 : 상병코드 AND 약제 (1일 이상 처방)­ J45 천식- J46 천식지속상태- 호흡기내과 전문의의 자문을 거쳐 선정된 천식 관련 흡입제 및 경구제, 단일제제 및 복합제(주성분 약 270 여종)를 반영2. 구축방법○ 전체 청구상병 테이블(주상병(=1상병) 및 주상병 이외의 모든 부상병 포함)에서 해당 상병코드가 포함된 모든 청구건 추출○ 해당 상병코드로 진단 받은 모든 청구건을 중복제거 후 진료에피소드로 묶고, 건수를 산출함.    - 각 청구건의 날짜 간격이 42일 이내인 경우 하나의 진료에피소드로 구축함.    - 방법론 참조 : 국립환경과학원 '국민건강보험공단 빅데이터를 이용한 가습기살균제 건강피해 규명 연구(II)'(2020),                        '가습기살균제 호흡기계 건강피해 통합 판정체계 구축 연구'(2021)○ 2006년 1월~2025년 12월까지 주·부상병 조건의 진료에피소드 건수    - 하나의 진료에피소드에 포함된 여러 청구건들 중에서 해당 상병코드가 주상병 또는 제2상병으로 1회 이상 청구된 경우임.○ 2006년 1월~2025년 12월까지 \"외래 및 입원\"과 \"입원\"의 진료에피소드 건수    - \"입원\" 진료에피소드는 하나의 진료에피소드에 포함된 여러 청구건들 중 하나 이상의 입원 청구건이 포함된 경우임.○ 시군구, 요양개시년월, 입원/외래, 성별, 연령군별 진료에피소드 건수를 산출함.    - 외래 및 입원 주·부상병 조건의 진료에피소드 건수(파일명: 외래입원주부상병)    - 입원 주·부상병 조건의 진료에피소드 건수(파일명: 입원주부상병)3. 레이아웃○ 요양개시년월○ 주소(시군구)○ 성별(남자, 여자)○ 연령군(0-5세, 6-11세, 12-17세, 18-44세, 45-64세, 65세이상)○ 진료에피소드 건수※ 국민건강보험공단과 원주세브란스기독병원 환경보건센터 공동 개발"
