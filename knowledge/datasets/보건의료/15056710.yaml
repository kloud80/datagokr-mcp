summary_user: 국내에서 특허 심판이나 소송이 제기된 의약품을 사건 단위로 담으며, 성분명·제품명·심판 종류·특허등록번호·사건번호·청구일자·심결일자와 심결문 열람 URL이 포함된다. 제네릭 개발사나 특허 분석가가 "이 성분의 오리지널 특허에 어떤 심판이 걸려 있고 언제 심결이 났는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 식약처 허가정보 등 다른 의약품 데이터와는 성분명·제품명 같은 이름이나 특허등록번호(KOR_PAT_NO)로 맞춰 이어야 한다.
limits: 품목기준코드 같은 공통 코드가 없어 다른 데이터와의 연결은 이름 매핑에 의존하므로 표기 차이에 따른 누락이 생길 수 있다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
