description_portal: 식품의약품안전처 「국내소송 의약품(특허) 정보」 OpenAPI는 국내에서 특허 관련 심판이나 소송이 제기된 의약품의 현황을 제공하는 공공데이터입니다. 제공 항목에는 성분명, 제품명, 심판종류, 특허등록번호, 사건번호, 청구일자, 심결일자, 심결문 등이 포함되어 있습니다. 이 데이터를 통해 사용자는 특정 의약품이 어떤 성분과 제품명으로 특허 심판 대상이 되었는지, 사건번호와 청구·심결일자를 통해 진행 과정을 확인할 수 있으며, 심결문과 URL을 통해 실제 판정 내용을 직접 열람할 수 있습니다.
