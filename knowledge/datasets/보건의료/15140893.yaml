summary_user: 서울 광진구 관내 약국의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일·취소일, 영업상태와 상세상태, 폐업·휴업 기간, 지번·도로명 주소, 사업장명, 좌표(X·Y)를 포함한다. 광진구 주민이나 분석가가 '우리 동네에서 지금 영업 중인 약국은 어디이고 최근 문을 닫은 곳은 어디인가'를 확인하거나, 약국 개폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소를 맞춰 보거나, 같은 기관 코드(OPNSFTEAMCODE)·관리번호 체계를 쓰는 LOCALDATA 계열 인허가 데이터와만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 약국 인허가를 받고 운영 중인 업소의 현황 정보를 제공합니다. 약국은 「약사법」에 따라 약사가 의약품을 조제하거나 판매하기 위해 운영하는 시설로, 국민의 건강 유지와 질병 예방, 치료를 위한 필수 보건의료기관입니다. 본 데이터에는 약국명, 소재지, 인허가일자, 업종 구분 등 주요 항목이 포함되어 있으며, 이를 통해 지역 내 의약품 접근성 파악, 감염병 예방 대응, 의약품 공급체계 분석, 보건소 및 병·의원과의 연계 체계 구축 등에 활용됩니다. 특히 의약품 안전관리, 복약지도 등 국민 건강증진 활동과도 밀접한 관계가 있습니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않으므로 지도 기반 서비스 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 자료로 정기적으로 갱신되며, 광진구 내 약국 분포와 보건의료 기반 정책 수립에 유용한 기초자료로 사용됩니다.
