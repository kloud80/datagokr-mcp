description_portal: '입원환자 연령군별 건강보험 진료비 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024년 1월~12월, 심사년월: 2024년 1월~2025년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함 / 입원환자(입원명세서) 대상※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 연령별 환자는 명세서에 기재된 수진자의 만(滿)나이 기준으로 범주 내 동일인의 중복을 제거한 값이지만, 진료시점에 따라 중복집계될 수 있으며 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
