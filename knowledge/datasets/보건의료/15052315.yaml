summary_user: 건강보험 입원환자(입원명세서, 약국 제외·양방만)의 진료 실적을 진료년도·성별·연령군별로 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액으로 집계한 전국 단위 통계 파일이다. 보건정책 분석가가 '어느 연령대·성별에서 입원 진료비와 입원일수가 많이 늘었는가'처럼 연령군별 입원 의료이용과 비용 추이를 볼 때 쓴다. 전역 조인 키는 없으며, 같은 기관의 외래·연령별 진료 통계와 진료년도·성별·연령군 값을 이름으로 맞춰 이어 쓴다.
limits: 지역·질병(KCD) 구분 없이 전국 합계만 담아 시군구나 상병별 분석에는 쓸 수 없다. 심평원 청구·심사 기준 값이라 공단(자격 기준) 통계와 수치가 다르며, 연령군별 환자수는 범주 간 중복이 있을 수 있어 단순 합산하면 안 된다.
