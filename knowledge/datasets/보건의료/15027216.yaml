summary_user: 전국 공공의료기관(보건소·보건지소 등 공공보건기관 제외)의 기관별 현황을 한 행에 한 기관씩 담은 파일로, 요양종별·관계 행정기관·근거 법령과 조례·설립형태·응급지정 여부·허가병상수·주소·연락처를 담는다. 정책 분석가나 지자체 담당자가 "우리 지역 공공병원은 어디이고 응급의료기관으로 지정돼 있으며 병상은 몇 개인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 의료기관명이나 주소를 매칭해 이어 써야 한다.
