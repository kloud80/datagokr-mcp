summary_user: 부산광역시 동래구에 있는 정신건강증진시설(정신요양시설·정신재활시설 등)을 시설 한 곳당 한 행으로 담은 목록이다. 구분·유형·정원과 도로명주소·전화번호·위도·경도가 들어 있고, 파일 크기는 323바이트로 몇 건 안 되는 소규모 현황이다. 동래구 주민이나 가족이 근처에서 만성 정신질환자를 입소시키거나 재활 프로그램을 이용할 시설이 어디 있고 정원이 얼마인지 찾을 때 쓴다. 전역 조인 키나 기관 코드는 없어서, 다른 데이터와는 시설명·주소로 맞추거나 위도·경도로 지도에 겹쳐 연결한다.
description_portal: '부산광역시 동래구 정신건강증진시설 현황에 대한 데이터로 구분, 시설명, 도로명주소, 전화번호, 유형, 정원, 위도, 경도, 데이터기준일자 등의 항목을 제공합니다.정신요양시설은 가족의 보호가 어려운 만성 정신질환자를 입소시켜 요양 및 보호함으로써 이들의 삶의 질 향상 및 사회복귀 도모정신의료기관에 입원하거나 정신요양시설에 입소하지 않은 정신질환자등이 지역사회에서 직업활동과 사회생활을 할 수 있도록 상담 교육 취업 여가 문화 거주 사회참여 등 각종 재활활동및 복지서비스 제공법적근거: 정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률 제26조 (정신재활시설의 설치 및 운영)                  정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률 제22조 (정신요양시설의 설치 및 운영)'
