summary_user: 허가된 의약품을 시판 후 안전성·유효성 자료로 다시 검토한 재평가 결과를 품목 단위로 담으며, 업체명·품목명·품목허가번호·허가일자·재평가 제출대상·대상년도·처리일자 등이 들어 있고 범위는 전국입니다. 의료기관·약사·제약사가 '이 의약품이 재평가 대상이었는지, 언제 처리됐는지'를 확인하거나 자사 품목의 허가사항을 관리하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어, 식약처 허가정보 등 다른 의약품 데이터와는 품목명·품목허가번호 같은 이름·코드 매핑으로만 이어 씁니다.
description_portal: 식품의약품안전처 「의약품 재평가 정보」 OpenAPI는 허가된 의약품에 대해 시판 후 안전성·유효성 자료 등을 종합적으로 검토하여 재평가한 결과를 제공합니다. 이 데이터에는 업체명, 업허가번호, 대표자명,품 목명, 약효군번호, 품목허가번호, 허가일자, 재평가제출대상, 재평가대상년도, 처리일자 등 주요 항목이 포함되어 있습니다.이 데이터를 통해 의료기관과 환자는 의약품 사용 시  안전하고 신뢰할 수 있는 정보를 확보할 수 있고, 제약사는 허가사항 관리 및 품질 개선에 참고·활용할 수 있습니다.
