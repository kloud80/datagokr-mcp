description_portal: 부산시에서 운영한 22년~25년 엔컨에서 운영하는 의료버스 합성데이터 입니다.의료버스는 "찾아가는 시민 건강버스" 입니다. 이 버스는 의료 취약계층이나 의료 접근성이 낮은 지역 주민들을 대상으로 무료 의료 서비스를 제공하는 이동식 진료소입니다.서비스 대상은 사회복지시설 입소자, 장애인, 다문화 가족, 외국인 근로자 등 의료 취약계층과 고령화 지역 주민이고내과, 한방과, 건강검진, 건강상담, 응급처치 교육 등의 서비스를 제공합니다.의료버스는 버스의 특성상 특정 지역이나 시설을 직접 방문할 수 있어, 의료 혜택이 부족한 곳에 맞춤형 의료 서비스를 제공할 수 있습니다.
