summary_user: 요양기관 소재지 시도별·진료년도별로 의료행위(검사·수술 등) 행위코드마다 환자수, 명세서건수, 총사용량, 청구금액을 집계한 건강보험 진료 통계로, 심사결정된 요양급여비용 명세서를 기준으로 하며 약국은 제외한다. 분석가나 의료기관 관계자가 '특정 검사·수술이 어느 시도에서 얼마나 많이 시행되고 청구금액은 얼마인가'처럼 지역별 의료행위 이용 규모를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 행위코드는 심평원 수가마스터(EDI 행위코드) 파일과 코드값으로 맞추고 시도는 이름으로 다른 지역 통계와 연결한다.
description_portal: '요양기관 소재지 기준 지역(시도)별 진료행위(검사·수술등)별 건강보험 진료 통계 / 진료일자 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024.1월~12월, 심사년월: 2024.1월~2025.4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대한 심사결정한 내용을 기준으로 작성되었습니다.※ 행위코드란 환자가 의료기관에서 받은 의료행위(검사, 수술 등)을 분류한 숫자 또는 숫자+문자 분류기호로서, 의료기관에서 요양급여비용을 청구할 때 사용됩니다. 자세한 사항은 건강보험심사평가원 홈페이지(www.hira.or.kr) > 제도·정책 > 보험인정기준 > 자료실 > 수가마스터 파일에서 확인하실 수 있습니다.※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있습니다.'
