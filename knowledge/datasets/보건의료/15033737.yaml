description_portal: '이 데이터는 질병관리청이 관리하는 말라리아의 민간인 연령별 발생 현황 자료입니다. 법정감염병 3군에 속하는 모기 매개 감염병인 말라리아의 발생 현황을 제공합니다.이 자료는 강원도 철원군, 인천광역시 강화군 지역의 2010년부터 2017년까지의 지역별/연령별(5세단위), 지역별/성별, 지역별/직업별, 지역별/주별 통계자료를 포함하고 있습니다. (단위: 건)이 자료는 말라리아 발생의 역학적 특성을 파악하고, 특정 연령층 및 지역을 대상으로 한 맞춤형 방역 대책을 수립하는데 중요한 기초자료로 활용될 수 있습니다.매개체 감염병의 감시 체계와 공중보건 정책의 효과를 평가하는데 필수적인 정보를 제공합니다.'
