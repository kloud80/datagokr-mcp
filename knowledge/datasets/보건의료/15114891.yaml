summary_user: 서울 성동구의 약국·의약품 판매업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호·인허가일자·인허가취소일자·영업상태·폐업일자·휴업기간·소재지 주소·좌표·사업장명이 들어 있다. 창업 예정자나 상권 분석가가 '성동구에서 최근 문을 닫거나 새로 연 약국이 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)나 주소·사업장명으로 매핑하거나, 같은 LOCALDATA 체계의 병원·의원 인허가 데이터와 나란히 놓고 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 약사가 의약품의 조제 또는 판매를 주요 목적으로 운영하는 약국 및 의약품 판매업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 의약품의 안전한 유통과 국민 보건 향상을 위해 약국 창업, 이전, 폐업 등 행정 관리가 매우 중요하며, 본 데이터는 이러한 현황을 투명하게 파악할 수 있도록 설계되었습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 행정적 인허가 이력, 영업 개시 및 종료, 현 영업상태 등 주요 정보가 포함되어 있습니다. 성동구청 등 관할 행정기관에서 정기적으로 정보 확인 및 갱신을 실시하여 데이터의 신뢰성과 최신성을 확보하고 있습니다. 해당 데이터는 약국 위치 및 현황 파악, 의약품 유통 관리, 약사 인력 운영, 정책 수립, 공중보건 연구, 상권 분석, 업계 동향 조사 등 다양한 분야에서 실질적으로 활용될 수 있습니다. 시민과 업계, 정책입안자 모두에게 투명하고 신뢰할 수 있는 정보를 제공합니다. 데이터는 정기적으로 최신화됩니다.
