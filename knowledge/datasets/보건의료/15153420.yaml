summary_user: 시도별·연도별(발생연도)로 식중독 발생 건수와 환자 수를 원인균별로 나눠 담은 집계 통계로, 원인균에는 병원성대장균·살모넬라·장염비브리오·캠필로박터·황색포도상구균·퍼프린젠스·바실루스 세레우스·노로바이러스·원충·자연독·화학물질·원인불명 등이 있으며 범위는 전국입니다. 보건·식품안전 분석가가 특정 원인균, 예를 들어 노로바이러스나 살모넬라 때문에 생긴 식중독이 해마다 얼마나 발생했고 환자가 몇 명이었는지 추이를 비교하는 데 씁니다. 시도·시군구 코드로 보이는 필드(STDG_CTPV_CD)가 있지만 실측에서 전역 조인 키로 확인되지 않아, 다른 데이터와는 시도명·코드 매핑이나 같은 기관(재난안전데이터 공유플랫폼) 데이터끼리만 이어 씁니다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 시도별 원인균별 식중독 발생수 정보입니다.\""
team:
  dept: 재난안전데이터과
