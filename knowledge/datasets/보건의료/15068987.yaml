description_portal: '서울특별시 강서구의 실외 흡연 장소 현황은 공공장소 내 금연구역 확대와 흡연자의 권리 보호 간의 균형을 위해 마련된 정보를 포함하고 있습니다. 해당 데이터는 실외 흡연 시설의 자치구별 위치, 시설 구분(예: 흡연부스, 흡연구역), 시설형태(이동식 또는 고정식), 설치 위치, 규모(㎡), 설치일자, 설치 주체(지자체 또는 민간), 관리주체 및 관리 여부 등의 정보를 담고 있습니다. 이를 통해 지자체의 흡연 공간 조성 현황을 파악할 수 있으며, 공중보건 정책 수립 및 실내 금연 정책의 효과 분석 등에 유용하게 활용될 수 있습니다. 특히, 금연정책과 흡연자의 이용 행태 간의 상호작용을 분석하거나, 장소별 민원 발생 여부 등을 파악하여 향후 개선 방안 마련에도 기여할 수 있습니다.'
