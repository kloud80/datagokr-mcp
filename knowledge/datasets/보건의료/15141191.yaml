summary_user: 서울특별시 양천구 안의 미용업소(헤어·메이크업·네일 등)를 업소 한 곳당 한 행으로 담은 인허가 원천 자료로, 업소명, 인허가일, 영업상태와 폐업일, 주소, 소재지면적, 업태, 건물 층수 같은 항목을 포함한다. 주민은 동네 미용실이 정식 신고된 영업 중인 업소인지 확인하는 데 쓰고, 분석가는 양천구에서 미용업소가 언제 얼마나 문을 열고 닫았는지 보는 상권 분석에 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙는 전역 조인 키가 없어서, 다른 구의 같은 인허가 자료와는 자치단체 코드(OPNSFTEAMCODE)와 관리번호로, 다른 데이터와는 업소명이나 주소 매칭으로 잇는다.
description_portal: 본 데이터는 서울특별시 양천구 내 미용업소의 인허가 현황을 종합적으로 관리하고 공개하기 위해 구축된 자료이다. 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 좌석수 등의 항목이 포함된다. 이를 통해 주민과 이용자는 미용업소의 안전성과 적법성을 확인할 수 있으며, 행정기관은 데이터 분석을 통해 인허가 관리 및 위생 점검 계획 수립에 활용할 수 있다. 또한 자료는 정기적으로 갱신되어 최신성을 유지하며, 이용자가 정보를 명확히 이해할 수 있도록 표준화된 형식으로 제공된다. 본 데이터는 공중위생 향상과 주민 편의 증진에 기여한다.* 미용업 인허가 정보 - 헤어, 메이크업, 네일아트와 같이 얼굴, 머리, 피부 등을 손질하여 외모를 아름답게 꾸미는 업소
