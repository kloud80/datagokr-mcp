summary_user: 서울특별시 강북구에 있는 의약품도매상을 영업소 한 곳당 한 행으로 담은 현황 파일로, 영업종별·영업소명·소재지 주소·전화번호·데이터기준일로 구성되며 파일 크기가 392바이트에 불과한 소규모 목록이다. 강북구에서 의약품을 받을 도매상을 찾는 약국·의료기관 사업자나, 지역 의약품 유통업체 분포를 파악하려는 분석가가 '강북구에 어떤 의약품도매상이 어디에 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업소명이나 소재지 주소를 매칭하거나 같은 기관(강북구) 자료끼리만 이어 쓴다.
description_portal: 의약품이란 대한민국약전에 실린 물품(의약외품을 제외)과 사람이나 동물의 질병을 진단, 치료, 겸감, 처치, 예방할 목적으로 사용하는 물품 중 기구, 기계, 장치가 아닌 것을 말합니다. 이런 의약품을 판매하는 도매상이 되려는 경우에는 약사법에서 일정한 요건을 충족한 사업자에게 허가를 부여하도록 되어 있어, 법령에서 정한 기준과 요건을 갖추어 허가를 받아야 합니다. 기준요건으로 시설, 자본금, 관리자가 필요합니다.서울특별시 강북구 의약품도매상현황 데이터는 순번, 영업종별, 영업소명, 영업소 소재지, 전화번호, 데이터기준일로 구성된 자료입니다.
