description_portal: '본 데이터는 연도 말 기준 사업장 규모별 직장가입자 적용인구 현황을 나타냅니다. 대상은 자격을 유지하고 있는 직장가입자입니다.1. 개요: 사업장 규모별 적용인구 현황: 연도 말 자격유지자의 직장 대상2. 용어정의 가. 사업장: 직장가입자의 적용대상이 되는 근로자가 사업주에게 고용되어 근로를 제공하는 장소적 개념의 ‘사업소 또는 사무소’ 나. 피부양자: 직장가입자에 의하여 주로 생계를 유지하는 보수 또는 소득이 없는 자로 보험료를 부담하지 않는 자 다. 공·교: 공무원 및 사립학교 교직원 라. 직장: 근로자 및 사용자, 공무원·군인·사립학교 교직원, 피부양자'
