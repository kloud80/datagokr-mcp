description_portal: 부산광역시 연제구 내 산모신생아건강관리 지원사업 제공기관 현황 정보를 제공(제공기관명, 영업소재지, 제공인력수, 제공기관면적)합니다.산모신생아 건강관리 지원사업은 출산가정에 건강관리사를 파견하여 산모의 산후 회복과 신생아의 양육을 지원하고, 출산가정의 경제적 부담을 경감해줍니다. 신청 기한은 출산예정일 40일 전부터 출산일로부터 60일까지입니다. 산모의 주민등록 주소지 관할 보건소 방문 또는 온라인(복지로) 신청 가능하며, 바우처 유효기간은 출산일로부터 90일 이내입니다. 단 미숙아, 선천성 이상아 출산 등으로 입원한 경우는 신생아의 퇴원일로부터 90일 이내입니다.
