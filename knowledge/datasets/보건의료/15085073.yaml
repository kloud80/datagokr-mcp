description_portal: '○ 통계개요* 통계명 : 법정감염병 발생현황* 통계종류 : 서울시 자치구별 법정감염병 발생현황을 제공하는 일반ㆍ보고통계* 근거법령 :「감염병의 예방 및 관리에 관한 법률」에 의거 보고된 법정감염병 발생* 작성목적 : 국가 감염병 감시체계를 통한 보고자료를 분석하여 국민들에게 감염병발생현황 관련 정보를 제공하고 감염병 예방ㆍ관리 정책수립을 위한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 보건소 및 민간의료기관 → 시도 → 질병관리본부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 해당기관내용 - 서울시 법정감염병(1군감염병, 2군감염병, 3군감염병,4군감염병 및 지정감염병)○ 용어설명* 제1군감염병 : 마시는 물 또는 식품을 매개로 발생하고 집단 발생의 우려가 커서발생 또는 유행 즉시 방역 대책을 수립하여야 하는 감염병(콜레라,장티푸스, 파라티푸스, 세균성이질 등 6종)* 제2군감염병 : 예방접종을 통하여 예방 또는 관리가 가능하여 국가예방접종 사업의대상이 되는 전염병(디프테리아, 백일해, 파상풍, 홍역, 유행성이하선염,풍진, 폴리오 등 10종)* 제3군감염병 : 간헐적으로 유행할 가능성이 있어 지속적으로 그 발생을 감시하고방역대책의 수립이 필요한 감염병(말라리아, 결핵, 한센병, 성홍열,수막구균성,구막염 등 19종)* 제4군감염병 : 국내에서 새롭게 발생하였거나 발생할 우려가 있는 감염병 또는국내유입이 우려되는 해외유행 감염병으로서 보건복지부령으로 정하는감염병(페스트, 황열, 뎅기열 등 17종)* 지정감염병 : 제1군감염병부터 제5군감염병 외에 유행여부를 조사하기 위하여감시활동이 필요하여 보건복지부 장관이 지정하는 감염병○ 기 타* 3군감염병 중 결핵발생 - 결핵관리현황의 결핵신환자수결핵사망 - 통계청「사망원인통계」 호흡기결핵(A15-A16) 사망자수※ 호흡기결핵 : 호흡기(비강,후두,기관,기관지,폐)에 결핵균이 감염된 것○ 출 처 : 질병관리본부, 서울특별시 생활보건과'
