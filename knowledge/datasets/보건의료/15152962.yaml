description_portal: GABA-A 수용체(alpha-1/beta-2/gamma-2), CDK2/cyclin A, CDK5/CDK5 activator 1, AMPK 복합체 등 다양한 단백질 복합체 및 관련 단백질을 대상으로 한 protein complex format 실험 데이터입니다. 대상유형은 PROTEIN COMPLEX, PROTEIN COMPLEX GROUP, SINGLE PROTEIN 등으로 구성되며, 각 복합체를 구성하는 단백질에 대한 UniProt ID, 대상생물종(사람, 쥐, 소, E. coli 등)이 함께 제공됩니다. 생물학적활성시험매개변수에는 Ki, IC50, EC50, Residual Activity 등이 포함되며, 상세결과값으로 “= 23.0 nM”, “Residual Activity = 1.01”처럼 정량적인 결합/억제/잔여활성 정보가 기록되어 있습니다. 이 데이터는 화합물이 키나제-사이클린 복합체나 이온채널 복합체 등 복합 단백질 타깃에서 보이는 저해/활성 패턴을 분석하고, 복합체 기반 약물표적 발굴·구조기반 설계 등 고도화된 기전 연구에 활용할 수 있습니다.
