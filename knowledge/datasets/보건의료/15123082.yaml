description_portal: 강원특별자치도 홍천군의 2025년 3월 10일 기준으로 작성된 장애인 유형별 등록 현황 데이터입니다. 본 자료는 강원특별자치도에서 관할하는 행정구역 중 홍천군에 거주하는 장애인의 등록 유형을 파악할 수 있도록 구성된 것으로, 각 구성 항목에는 시도명, 시군구명, 읍면, 장애 유형별 인원 수(지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐성, 정신, 신장, 심장, 호흡기, 간, 안면, 장루·요루, 뇌전증 등), 그리고 관리기관명, 관리기관 전화번호, 데이터 기준일자 등이 포함되어 있습니다. 시도명 항목은 전부 강원특별자치도로 고정되어 있으며, 시군구명 역시 모두 홍천군으로 표기되어 있습니다. 읍면 항목을 통해 세부 행정단위별 장애인 등록 현황을 확인할 수 있고, 각 장애 유형별 항목은 정수 형식으로 구성되어 있어 실제 등록된 인원 수를 파악할 수 있습니다. 또한, 관리기관명과 전화번호를 통해 해당 정보에 대한 문의나 관리를 담당하는 주체를 확인할 수 있으며, 데이터 기준일자는 날짜 형식으로 명시되어 데이터의 최신성을 판단하는 기준이 됩니다. 이 데이터는 향후 장애인 복지 정책 수립이나 지역 맞춤형 복지 서비스 제공 시 기초 자료로 활용될 수 있습니다.
