summary_user: 인천광역시 안에서 응급환자 진료를 맡는 응급의료기관을 기관 한 곳당 한 행으로 담은 작은 목록 파일(csv 약 2.3KB)로, 권역·지역 응급의료센터 등 구분, 병원명, 위치·주소, 대표 및 응급 연락 전화번호를 담는다. 시민이 '우리 동네에서 가장 가까운 응급실은 어디이고 응급 시 어느 번호로 연락하나'를 확인하거나, 분석가가 인천 내 응급의료기관의 지역별 분포와 취약 지역을 살피는 데 쓴다. 실측 컬럼에 기관코드(hpid) 같은 전역 조인 키가 없어, 다른 응급의료·병상 데이터와는 병원명이나 주소를 맞춰 이어 써야 한다.
description_portal: '인천광역시 응급의료기관 현황 공공데이터는 인천시 내에서 응급 환자 진료를 담당하는 의료기관의 상세 정보를 제공합니다응급의료에관한법률에 의거 권역응급의료센터 2개소, 지역응급의료센터 9개소, 지역응급의료기관 10개소로 총 21개소가 운영되고 있습니다.<활용>보건 정책 및 재난 대비: 시 정부는 응급의료기관의 지역별 분포 및 역량을 분석하여 응급 의료 취약 지역을 해소하고, 대형 재난 발생 시 효율적인 의료 자원 분산 및 대응 계획을 수립하는 데 이 데이터를 활용합니다.해당 데이터는 인천시 정보공개포털 또는 공공데이터포털에서 확인할 수 있습니다.'
