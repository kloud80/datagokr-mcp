description_portal: '입력 파라미터를 이용하여 대구광역시 서구_비원건강센터 금연클리닉 현황의 연령대 구분, 등록 현황 명, 4주 금연 성공 확률 퍼센트, 6주 금연 성공 확률 퍼센트, 12주 금연 성공 확률 퍼센트, 6개월 금연 성공 확률 퍼센트 항목을 제공하는 서비스[용어설명]금연클리닉: 보건소 또는 의료기관 등에서 운영하는 프로그램으로, 흡연자가 체계적인 상담과 지원을 통해 금연에 성공할 수 있도록 돕는 무료 공공서비스입니다. 건강증진을 목적으로 금연을 시도하는 사람들에게 다양한 금연 보조물품과 전문 상담, 약물치료 등을 제공합니다.[대상]1. 흡연자 누구나 가능 (청소년, 성인, 임산부 등 포함)2. 단, 일부 프로그램은 고위험군(청소년, 임산부, 만성질환자 등)을 우선 지원하기도 함[참여 방법]1. 신분증 지참 후 관할 보건소 금연클리닉 방문2. 또는 보건복지부 금연상담전화 ☎ 1544-9030 통해 안내받기3. 금연두드림 홈페이지에서 온라인 정보 확인'
