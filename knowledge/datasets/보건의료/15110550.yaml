summary_user: 대구 서구 비원건강센터 금연클리닉의 등록 현황을 연령대별로 나눠 4주·6주·12주·6개월 금연 성공률(퍼센트)을 담은 집계 데이터이다. 보건소 담당자나 분석가가 "이 센터 금연클리닉에서 어느 연령대의 장기(6개월) 금연 성공률이 낮은가"를 확인하는 데 쓴다. 실측 컬럼에 보건소코드·시군구코드 같은 전역 조인 키가 없어, 다른 지역 보건소 금연클리닉 자료나 지역사회 건강조사의 흡연 지표와는 기관명·지역명을 맞춰 연결해야 한다.
limits: 대구 서구 한 센터의 연령대별 집계라 개인별 이력이나 다른 시군구와의 직접 비교 근거로는 부족하다. 공통 키가 없어 다른 데이터와는 이름 매핑으로만 붙일 수 있다. 호출에는 포털 활용신청 후 발급되는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
