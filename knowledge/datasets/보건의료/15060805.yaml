summary_user: '부산광역시 동구에 있는 의원급 의료기관(의원·치과의원·한의원)을 기관 한 곳당 한 행으로 담은 현황 파일로, 종별·기관명·도로명주소·전화번호를 담는다. 동구 주민이 근처 의원이나 한의원을 찾거나, 분석가가 동구 안의 의원 분포를 종별·주소로 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명주소를 맞춰 잇는다(예: LOCALDATA 병의원 인허가 자료와 이름·주소 매칭).'
description_portal: 의료기관이란 의사, 치과의사, 한의사, 조산사가 의료행위 또는 조산행위를 하는 기관 모두를 의료기관이라 지칭한다. 의료법에 따르면 주로 외래 환자를 대상으로 하는 의원급 의료기관과 주로 입원 환자를 대상으로 하는 병원급 의료기관 그리고 조산사가 임산부의 분만을 돕는 조산원으로 크게 나눌 수 있다. 병원급 의료기관을 전문성, 병상 수에 따라 병원, 치과병원, 한방병원, 요양병원, 정신병원, 종합병원으로 세부적으로 분류되며, 의원급 의료기관은 의원, 치과의원, 한의원으로 분류한다.현 자료는 부산광역시 동구에 소재한 의원급 의료기관 현황(종별, 명칭, 주소, 연락처)이다.
