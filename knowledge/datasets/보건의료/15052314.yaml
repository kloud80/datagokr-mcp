summary_user: 건강보험 입원환자 중 일반·소아·신생아 중환자실 입원료 대상자를 진료년도·성별·연령군별로 묶어 환자수, 명세서 청구건수, 중환자실 입원일수, 진료행위 청구금액을 담은 전국 단위 집계 파일(csv, 약 1.8KB)이다. 보건의료 분석가나 병상 정책 담당자가 '고령층과 신생아 중 어느 연령군에서 중환자실 입원일수와 진료비가 많이 늘었는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 진료년도·성별·연령군 같은 공통 항목을 이름으로 맞춰 다른 심평원 연령군별 진료 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '건강보험 중환자실 입원환자 연령군별 진료비 통계 / 진료일자 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024.1월~12월, 심사년월: 2024.1월~2025.4월 / 보험자: 건강보험 / 입원환자(입원명세서) 중 일반, 소아, 신생아 중환자실 입원료 대상(중환자실 전담의 및 격리관리료 포함X)※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 연령별 환자는 명세서에 기재된 수진자의 만(滿)나이 기준으로 범주 내 동일인의 중복을 제거한 값이지만, 진료시점에 따라 중복집계될 수 있으며 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
