summary_user: 2021~2025년 장기요양기관 정기평가 결과를 기관·평가 회차 단위로 담은 건별 파일로, 전국 기관의 급여종류·설립주체·관할 시도·시군구와 평가일자, 평가등급, 총점, 영역별 점수를 담는다. 부모님을 맡길 요양시설이나 방문요양 기관을 고르는 가족이 '우리 동네 기관 중 최근 평가등급이 좋은 곳은 어디인가'를 확인하거나, 분석가가 설립주체·지역별 평가 수준을 비교하는 데 쓴다. 장기요양기관기호(ltc_instt_cd)를 키로 장기요양기관 검색·상세·좌표 정보와 이어 쓰고, 관할 시도·시군구명으로 지역 고령인구 통계와 맞춰 본다.
description_portal: '1. 2021년~2025년까지 장기요양기관의 정기평가결과  - 급여종류별 3년주기로 평가 수행: (’21년) 시설 → (’23년) 재가 홀수 → (’24년) 재가 짝수 → (’25년) 시설   * 코로나로19로 인해 2021년 시설 평가 연장으로 2022년까지 진행2. 평가구분, 장기요양기관기호, 장기요양기관명, 급여종류, 설립주체, 관할시도명, 관할시군구명, 평가일자. 평가등급, 평가총점, (2021년~2024년) 기관운영, 환경 및 안전, 수급자 권리보장, 급여제공과정, 급여제공결과, (2025년) 기관운영, 수급자존중, 서비스제공, 서비스결과* 2025년도 정기평가부터 평가영역 5개 → 4개로 변경※ 2026. 6. 25. 기준 발췌자료로 기존 제공되던 장기요양기관 평가등급 현황과 목록명 동일'
