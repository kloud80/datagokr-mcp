description_portal: '○ 통계개요* 통계명 : 방문건강관리사업 방문전문인력당 취약가구수* 통계종류 : 보건복지부 "지역사회 건강조사", 통계청 "인구주택총조사", 서울특별시"주민등록인구" 등을 활용한 가공통계* 작성목적: 서울 시민들의 건강문제를 진단하고, 건강격차에 대한 인식과 관심을 증가시켜건강한 공공보건정책 수립의 기초자료 제공* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 자치구별○ 용어설명* 상대격차 : 상대위험도(relative risk)나 상대격차백분율(relative gap)로 제시- 상대위험도는 해당집단의 표준화율을 기준집단의 표준화율로 나누어준 값으로상대위험도가 1.3이라는 것은 기준집단에 비해 위험이 1.3배 높다는 것을 의미함- 상대격차백분율은 {(해당집단 표준화율 - 기준집단 표준화율) /기준집단 표준화율 ×100}* 절대격차 : 해당집단의 표준화율에서 기준집단의 표준화율을 뺀 값* 각 값은 반올림한 값이기 때문에 표준하율들의 비와 제시된 값이 일치하지않을 수 있음'
