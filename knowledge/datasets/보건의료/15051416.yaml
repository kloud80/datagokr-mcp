description_portal: 공중위생관리법 제2조의 공중위생업소 중 이용업(손님의 머리카락 또는 수염을 깎거나 다듬는 등의 방법으로 손님의 용모를 단정하게 하는 영업), 미용업(손님의 얼굴, 머리, 피부 및 손톱, 발톱 등을 손질하여 손님의 외모를 아름답게 꾸미는 영업) 현황 리스트 데이터입니다. 관내 위치한 이용업, 미용업의 영업장 정보를 개인정보를 제외하여 작성한 리스트입니다. 관내 이용업, 미용업소의 상호, 소재지, 연락처라 필요하신 경우 해당 자료를 참고하여 주시기 바랍니다. 영업자의 휴대폰 연락처나 성명 등은 개인정보에 해당하여 이 자료에는 포함되어 있지 않으니 참고하시기 바랍니다.
