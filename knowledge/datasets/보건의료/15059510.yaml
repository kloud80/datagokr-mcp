summary_user: 경기도 내 상급종합병원·종합병원·병원·의원별로 외래 주사제 처방률에 따른 건강보험심사평가원 평가등급(1~5등급, 낮을수록 적정)을 기관 한 곳당 한 행으로 담고, 시군명·주소·우편번호·위경도를 함께 싣는다. 환자가 "우리 동네에서 주사제를 덜 처방하는 의원은 어디인가"를 찾거나, 분석가가 시군별 처방 적정성 수준을 비교할 때 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 기관명·주소 매칭이나 시군 코드(SIGUN_CD) 단위로 잇고, 위경도로 지도 위에 겹쳐 쓴다.
description_portal: 이 데이터는 건강보험심사평가원이 제공하는 병원평가 자료로, 경기도 내 의료기관을 대상으로 외래 진료 시 주사제 처방률에 따라 평가한 정보를 수록하고 있습니다. 주사제는 필요한 경우에만 제한적으로 처방되어야 하는 약제로, 과도한 사용은 의료 안전성과 비용 측면에서 문제가 될 수 있습니다. 평가 결과는 병원의 주사제 처방 비율에 따라 백분위 순위로 산출된 등급(1등급~5등급)으로 나뉘며, 숫자가 낮을수록 주사제를 적절하게 사용하는 기관임을 의미합니다.공개 대상은 상급종합병원, 종합병원, 병원, 의원 등이며, 평가등급 외에도 시군명(SIGUN_NM), 기관명(INST_NM), 평가내역(DIV_NM), 소재지 주소(도로명, 지번), 우편번호, 위도 및 경도 좌표 등이 포함되어 있습니다. 평가 기준에 따라 진료건수가 100건 미만인 의료기관은 등급에서 제외됩니다.본 데이터는 주사제 처방의 적정성에 대한 지역 의료기관의 수준을 비교·분석할 수 있는 근거자료로 활용되며, 환자들이 합리적이고 안전한 의료기관을 선택하는 데 도움을 줍니다. 또한 행정기관, 의료정책 입안자, 시민단체 등은 본 자료를 활용하여 의료서비스의 질 관리, 의료비 절감, 합리적 처방 문화 조성 등의 정책 수립에 기여할 수 있습니다. Open API를 통해 제공되어 정보 연계성이 뛰어나며, 의료기관의 진료 행태 개선을 위한 평가자료로서의 활용가치도 높습니다.
