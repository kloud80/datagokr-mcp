summary_user: 국립목포병원 한 곳의 외래 환자 수를 진료년월별로 집계한 파일로, 초진·재진 환자 수와 보험·의료급여·일반 등 보험종별 환자 수를 담는다(파일 크기 374바이트의 소규모 집계표). 공공병원 운영을 살피는 분석가나 연구자가 '국립목포병원 외래 환자가 월별로 어떻게 변했고 신환자와 재방문 환자 비중은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원 이름이나 같은 기관 코드로 직접 매핑해야만 연결된다.
description_portal: '- 국립목포병원 외래환자 현황은 데이터는 항목은 진료년월로 초진, 재진, 의보, 국비, 일반, 성인 아동 등의 항목으로 구분되어 있는 데이터입니다.** 칼럼별 상세설명[초진] 신환자수로 병원에 처음 온 환자 수의 합계[재진] 처음 진료받고(초진) 3개월 이후에 다시 진료를 위해 방문한 환자 수와 3개월 이전에 온 환자수 * 3개월 이후 재방문한 환자는 재초진으로 구분하며, 3개월 이전 재방문한 환자는 재진으로 구분합니다.[의보] 보험종별 구분의 한가지로  의료급여 환자 수의 합계[성인] 18세 이상의 환자 수의 합계[아동] 18세 미만의 환자 수의 합계'
