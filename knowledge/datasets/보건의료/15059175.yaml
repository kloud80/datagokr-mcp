summary_user: 경기도 내 노인 전문병원 6개소를 병원 한 곳당 한 행으로 담으며, 병상 수, 진료 과목 수와 내역, 홈페이지, 지번·도로명 주소, WGS84 위경도를 포함한다. 지역 노인의료 인프라를 보는 분석가나 가족이 '우리 시군에 노인 전문병원이 있고 병상은 몇 개인가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 시군 코드(SIGUN_CD)·시군명이나 병원명·주소를 매칭하거나 위경도로 다른 의료기관 인허가 데이터와 공간적으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 노인 전문병원 6개소에 대한 현황 정보를 제공하는 자료로, 고령자 대상 전문 진료 및 요양 서비스를 제공하는 의료기관의 병상 수, 진료 과목 수 및 내역, 홈페이지 주소, 위치정보(WGS84 위도·경도 포함), 소재지 주소 등 총 17개 항목으로 구성되어 있습니다. 고령화 사회 대응을 위한 의료 자원 분포 파악, 지역별 노인의료 인프라 분석, 병상 수급 정책 수립 등에 활용될 수 있습니다. 데이터는 보건의료정책과에서 연간 단위로 갱신되며, 상업적 이용 및 콘텐츠 변경이 가능하며, Open API를 통해 시스템 연계도 지원됩니다.
