summary_user: 전국 시도별·의료기관 종별로 건강보험 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액을 진료년도 단위로 묶은 집계 통계로, 약국과 한방은 빠지고 양방만 담는다. 분석가나 지역 보건정책 담당자가 '우리 시도에서 상급종합병원과 의원 중 어느 쪽에 건강보험 진료비가 더 많이 쓰이는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명·종별명·진료년도를 이름으로 맞춰 이어 써야 한다.
limits: 시도·종별 단위 집계라 개별 요양기관(ykiho)과 연결하거나 시군구 단위로 내려가 볼 수 없다. 환자수는 범주 안에서만 중복을 뺀 값이라 시도나 종별을 단순 합산하면 중복이 생기고, 금액에는 비급여가 빠져 있다.
