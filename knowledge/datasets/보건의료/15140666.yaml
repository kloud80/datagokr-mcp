summary_user: 서울 은평구에 신고된 소독업체의 인허가 정보를 업소 한 곳당 한 행으로 담고, 상호, 지번·도로명 주소, 인허가일과 취소일, 영업·상세 영업 상태, 폐업일, 중부원점TM 좌표(X, Y), 사무실 면적과 분무기·방독면 같은 소독 장비 보유 수량을 포함한다. 공동주택이나 다중이용시설 관리자가 은평구에서 정식으로 신고하고 지금 영업 중인 소독업체가 어디 있는지 확인할 때, 분석가가 관내 소독업체의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 관리번호(MGTNO)·개방자치단체코드 같은 같은 기관 코드나 업체명·주소 매칭으로만 이어 쓴다.
description_portal: '은평구의 전염병 및 각종 세균이나 유해 해충의 소독을 목적으로 만들어진 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 감염병 예방을 목적으로 소독 업무를 전문적으로 수행하는 업체들의 인허가 현황을 담고 있습니다. 데이터에는 각 소독업체의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등), 그리고 행정처분 이력과 같은 공중보건 관리의 핵심 정보가 포함되어 있습니다 .이 데이터를 통해 다중이용시설, 공동주택 등 법적 소독 의무가 있는 시설 관리자나 일반 주민이 정식으로 신고된 신뢰할 수 있는 소독업체를 확인하고 서비스를 의뢰하는 데 활용할 수 있습니다. 또한, 주소 정보를 기반으로 지역 내 소독 서비스의 공급망 분포와 접근성을 분석할 수 있으며, 신규 및 폐업 업체 현황을 통해 감염병 발생 추이나 공중 보건에 대한 사회적 관심도 변화를 간접적으로 파악할 수 있습니다. 이는 보건 당국이 관내 소독업체를 체계적으로 관리·감독하고, 감염병 확산 방지를 위한 방역 정책을 수립하는 데 필수적인 기초 자료가 됩니다 .'
