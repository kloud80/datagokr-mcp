summary_user: 서울시 안에 설치된 자동심장충격기(AED)를 설치 건별로, 설치 주소·설치 장소, 설치기관, 관리자·연락처, 모델·제조사, 위경도 좌표와 함께 담는다. 시민이나 응급대응·안전 담당자가 '지금 있는 곳에서 가장 가까운 AED가 어디 있고 누가 관리하나'를 찾거나, 분석가가 지역별 AED 배치 공백을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 위경도 좌표(WGS84LON·WGS84LAT)나 주소·기관명 매칭으로만 잇는다.
description_portal: '서울시 내의 자동심장 충격기 설치 위치, 모델, 관리자, 설치기관, 제조사 등의 정보*용어설명- 자동심장충격기(AED)란, 심장이 정상적으로 뛰지 못하고 심실세동(ventricular fibrillation)이나 무맥성 심실빈맥(pulseless ventricular tachycardia) 상태에 빠졌을 때 전기 충격을 가해 심장의 리듬을 정상으로 회복시키는 장치, 쉽게 말해, 심정지 환자에게 전기 충격을 주어 심장을 다시 뛰게 하는 응급 구급 장치※ 제공부서 : 서울특별시 시민건강국 보건의료정책과(02-2133-9672)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
