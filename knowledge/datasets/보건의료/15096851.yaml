summary_user: 제주특별자치도 내 공설 봉안당별로 기준 연도마다 봉안능력·봉안기수·반환기수를 구(유골 수) 단위로 담은 시설별 연도 집계 자료이며, 포털 설명상 2019~2021년분이다. 장사 행정 담당자나 분석가가 '도내 어느 공설 봉안당이 여유 공간이 부족해 확충이 필요한가'를 판단할 때 봉안능력 대비 봉안기수를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 장사시설·화장 통계와는 봉안당명이나 기준 연도로 직접 맞춰 이어 써야 한다.
description_portal: 이 데이터셋은 제주특별자치도가 2019년부터 2021년까지 집계하여 공개한 ‘공설 봉안당 운영 현황’에 관한 공공데이터로, 도내 공설 봉안당(납골당 포함)의 전체 봉안능력, 봉안기수, 반환기수 및 봉안 가능기수 등의 정보를 연도별·시설별로 체계적으로 정리한 자료이다. 자료 형식은 CSV로 제공되며, 제공기관은 제주도청이다. 본 통계는 화장 후 유골의 납골 또는 봉안 시설 이용 현황을 객관적으로 보여주는 기초 자료로서, 장례 및 장사 행정, 유골 관리 정책, 사회복지 및 공공장사 시설 운영, 공간 수요 예측, 추모 공간 확보 현황 분석 등에 중요한 근거가 된다. 또한, 봉안 능력과 기수, 반환 기수 등의 수치를 통해 현재 봉안당의 수요-공급 균형, 미래 봉안공간 여유 여부, 반환된 유골 처리량 등의 관리 실태를 파악할 수 있어, 지자체의 장사 정책 설계, 시설 확충 필요성 검토, 장례복지 계획 수립, 유골 반환 및 봉안 절차 운영 개선 등 행정적-정책적 판단을 위한 기초 통계를 제공하는 의미가 있다.
