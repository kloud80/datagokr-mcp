description_portal: '치매안심센터는 국가 치매 책임제의 일환으로 설립된 기관으로, 치매 환자와 가족들이 겪는 고통을 분담하고 체계적인 통합 서비스를 제공하는 지역 거점 센터입니다.1. 주요 서비스 및 역할치매의 조기 발견부터 재활, 가족 지원까지 전 과정을 책임지는 역할을 수행합니다.치매 선별 및 정밀 검사: 60세 이상 어르신을 대상으로 기억력 검사를 실시하고, 결과에 따라 협약 병원과 연계하여 치매 여부를 정확히 판별합니다.환자 등록 및 관리: 치매 확진 시 센터에 등록하여 실종 방지 인식표, 조치 비용 지원, 기저귀 등의 조례 물품을 지원받을 수 있습니다.쉼터 프로그램: 경증 치매 환자의 악화를 막기 위해 인지 재활 프로그램(원예, 미술, 음악 등)을 제공합니다.가족 지원: 간병 스트레스를 덜어주기 위한 자조 모임, 가족 교실, 심리 상담 등을 운영합니다.2. 이용 방법 및 이점전국 모든 시·군·구 보건소에 설치되어 있어 접근성이 매우 높으며, 대부분의 서비스가 무료로 제공됩니다.'
