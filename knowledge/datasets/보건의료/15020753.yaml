summary_user: 중앙보훈병원 욕창진료센터 환자의 치료 기록을 건별로 담은 파일로, 환자번호·성별·접수일·시작일·시행일과 함께 한 번에 최대 8개 부위의 치료부위·방향·치료단계·소요시간(분)을 담는다(CSV 약 2.6MB). 병원 운영 분석가나 연구자가 욕창 부위별 치료단계 분포와 처치에 드는 시간이 얼마인지 살펴보는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 같은 기관의 다른 보훈병원 진료 데이터와 이름·코드를 맞춰서만 연결된다.
description_portal: '보훈병원 환자의 진료시작일,종료일,종료사유,진단명,치료부위명,치료단계.소요시간 등에 대한 데이터입니다보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
