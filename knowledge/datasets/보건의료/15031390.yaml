summary_user: 경기도 양주시에 등록된 치과기공소를 한 곳씩 담은 목록으로, 등록일자·기공소명·도로명 소재지·전화번호·관리기관명을 담는다(파일 크기 840바이트의 소규모 CSV). 시민이나 치과 관계자가 '양주시에서 영업 중인 치과기공소는 어디이고 연락처는 무엇인가'를 확인하는 데 쓰고, 등록일자를 보아 지역 의료 관련 업소의 개설 흐름을 살피는 보조 자료로도 쓴다. 전역 조인 키가 없어 다른 데이터와는 기공소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓰며, LOCALDATA 의료 인허가 자료나 주소 기반 위치 데이터와 대조할 때 그렇게 연결한다.
limits: 양주시 한 곳만 다루므로 다른 시군구나 전국 단위 비교에는 쓸 수 없다. 공통 식별 코드가 없어 다른 데이터와 붙일 때 이름·주소 매칭의 오차를 감안해야 한다.
