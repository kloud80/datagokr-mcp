limits: 점검 대상 기관을 식별하는 키가 없어 개별 병원의 인허가·개폐업 이력과 건 단위로 맞춰 볼 수 없다. 범위는 남동구 한 곳에 한정되므로 다른 시군구나 전국 비교에는 별도 자료가 필요하다.
