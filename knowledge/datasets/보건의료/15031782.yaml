summary_user: 성남시에서 설 연휴 동안 문을 여는 종합병원·병원·의원·약국을 기관 한 곳당 한 행으로 담은 파일로, 구, 기관명, 도로명주소, 전화번호와 연휴 5일간 날짜별 운영시간을 함께 적는다. 성남 시민이 설 연휴 중 집 근처에서 진료받을 병원이나 약을 살 약국이 언제 문을 여는지 확인할 때 쓴다. 전역 조인 키는 없어 다른 의료기관 인허가 데이터와는 기관명이나 도로명주소를 맞춰서만 이을 수 있다.
description_portal: 성남시 설날연휴 의료기관 및 약국 운영 현황은 명절 기간 동안 시민들이 응급 상황이나 약품 구매에 불편함이 없도록 개방되는 병원과 약국 정보를 정리한 자료입니다. 이 자료에는 구별, 병원분류(종합병원, 병원, 의원, 약국), 의료기관 및 약국의 기관명, 소재지 주소, 전화번호, 연휴기간 운영시간(응급실 운영, 시간 등)이 포함되어 있어, 설 연휴 중 진료 및 약국 이용이 가능한 곳을 쉽게 확인할 수 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.
