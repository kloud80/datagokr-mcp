summary_user: 식약처가 발행한 의약품 안전성 서한을 서한 한 건 단위로 담고, 서한번호·제목·공고구분·공고일자·요약·상세내용·조치사항·담당부서·첨부파일을 전국 범위로 제공한다. 의료기관이나 약사·환자가 '최근 특정 성분 의약품에 어떤 안전성 경고와 조치 권고가 나왔는가'를 확인하거나, 분석가가 시기별 안전성 서한 발행 추이를 살피는 데 쓴다. 품목기준코드 같은 전역 조인 키가 없어 허가정보·DUR·약가 데이터와는 제목·본문의 성분명이나 제품명을 이름으로 매핑해 연결해야 한다.
limits: 실측 컬럼에 품목·성분 코드가 없어 다른 의약품 데이터와 키로 바로 조인하지 못하고 이름 매칭에 의존한다. 개발계정은 하루 10,000회 호출로 제한된다.
