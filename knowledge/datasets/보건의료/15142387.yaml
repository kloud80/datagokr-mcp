summary_user: 서울특별시 마포구 관내 약국의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·주소·전화번호·중부원점TM 좌표가 들어 있다. 동네에 새로 문을 연 약국이나 문을 닫은 약국이 어디인지, 특정 지역의 약국 영업 현황을 확인하려는 주민·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 자치단체코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 LOCALDATA 형식의 병의원 인허가 데이터와 나란히 개폐업 흐름을 비교하는 데 쓴다.
description_portal: '서울특별시 마포구의 약사가 의약품을 조제 또는 판매를 주목적으로 하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 약국을 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 약국의 위치, 취급 품목과 운영 현황을 파악하고, 지역사회 건강 증진과 의약품 안전관리를 효과적으로 지원할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
