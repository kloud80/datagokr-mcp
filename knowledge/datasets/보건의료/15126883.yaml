description_portal: '1. 2018~2023년 진료일기준(한의분류 제외, 약국 제외), 연령(연말기준)2. 건강보험 및 의료급여 실적이며, 비급여는 제외  - 2023년 6월 심사분까지 반영3. 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라     일차진단명을 부여하고 청구한 내역 중 주진단명으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음4. 분류 조건<그룹1> 아래의 주상병코드 and 수가코드  ○ 주상병코드 : I60(거미막하출혈), I61(뇌내출혈), I62(기타 비외상성 두개내출혈), I63(뇌경색증),                                I65(뇌경색증을 유발하지 않은 뇌전동맥의 폐쇄 및 협착), I66(뇌경색증을 유발하지 않은 대뇌동맥의 폐쇄 및 협착)   ○ 수가코드 : M6636, M6637, M6639, O2056, O2059<그룹2> 아래의 주상병코드 and 수가코드  ○ 주상병코드 : I20(협심증), I21(급성 심근경색증), I22(후속심근경색증), I23(급성 심근경색증 후 특정 현존 합병증), I25(만성 허혈심장병)   ○ 수가코드 : M6638, M6639, O0260, O1950 수가코드 설명은 KOICD(질병분류정보센터)에서 확인하시기 바랍니다.  - 개인정보 보호를 위해 5인 미만의 값은 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
