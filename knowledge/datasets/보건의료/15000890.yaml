summary_user: 성남시 관내 병원·의원·치과의원·한의원 등 의료기관을 기관 한 곳당 한 행으로 담은 명부 파일로, 구별·기관명·종별·도로명주소·전화번호·데이터기준일자를 담는다. 시민이 "우리 구에 있는 치과의원은 어디인가"를 찾거나, 분석가가 구별·종별 의료기관 분포를 보고 의료 인프라를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·주소 문자열을 맞추거나 구 이름으로 묶어 연결해야 한다.
description_portal: 성남시 의료기관 현황 자료는 성남시 관내 병원, 의원 등 의료기관의 정보를 체계적으로 정리한 자료터입니다. 이 자료는 보건의료 분야의 자료로 구별, 의료기관명, 의료기관 종별(의원, 치과의원, 한의원 등), 주소, 전화번호 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 성남시 의료 인프라 현황을 파악하여 가까운 의료기관을 이용하거나 보건정책 수립시 기초자료로 활용 할 수 있습니다.
