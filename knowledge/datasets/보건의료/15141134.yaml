description_portal: '은평구의 출산 이후 임산부 및 신생아의 건강과 위생을 관리하기 위한 시설 정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 산후조리업소에 대한 인허가 정보를 담고 있으며,  신생아 및 산모의 회복을 위한 시설 운영 현황을 파악할 수 있는 자료입니다.  상호명, 주소, 인허가일자, 시설 형태, 운영방식, 수용 가능 인원 등의 정보를 포함하고 있으며,  산후조리 환경 개선과 산모건강 정책 수립의 기초자료로 활용됩니다.  또한 소비자 보호를 위한 서비스 품질관리, 인허가 기준 개선, 안전 점검의 기반 자료로도 사용되며,  지역 보건복지서비스의 적절성 평가에 필요한 통계로 활용될 수 있습니다.  민간시장 구조를 이해하는 데에도 유용한 데이터입니다.'
