summary_user: 금천구 내 안전상비의약품 판매업소(편의점 등 약국 외 판매처)를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가·취소일자, 영업상태와 폐업·휴업 기간, 소재지·도로명 주소, 전화번호, 좌표(X·Y), 매장면적을 포함한다. 주민이나 지역 보건 담당자가 '우리 동네에서 지금 영업 중인 상비약 판매처가 어디인가', '폐업으로 상비약 공백이 생긴 지역이 있는가'를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 같은 서울시 인허가 체계의 다른 업종 자료와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호로, 그 밖의 자료와는 주소나 좌표 매칭으로 연결한다.
description_portal: 금천구 내 안전상비의약품 판매업소의 인허가 현황을 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 업태 구분, 영업면적 등 주요 정보를 포함하며, 폐업·휴업·재개업 등 영업상태 변동 이력도 함께 확인할 수 있습니다. 이를 통해 지역 내 의약품 접근성을 분석하고 안전상비의약품 유통 현황을 파악하는 데 활용할 수 있습니다. 또한 응급의약품 접근성 개선, 약국 외 판매업소 현황 조사, 지역 보건 정책 수립, 의약품 공급망 관리, 취약지역 의약품 접근성 강화 등 다양한 분야에서 유용한 기초 자료로 쓰일 수 있습니다.
