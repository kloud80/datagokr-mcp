description_portal: 본 데이터는 한국보건산업진흥원이 제공하는 국민영양통계 원본자료를 기반으로, 2020년부터 2023년까지 개별 식품의 평균섭취량을 식품군별로 구분하여 정제·가공한 파일데이터이다. 기존에 연도별, 성별, 연령층별, 지역별로 분리되어 제공되던 자료를 하나의 파일로 통합하고, 연도, 분석기준, 기준값, 식품군, 식품명, 평균섭취량 및 표준오차 항목으로 재구성하였다. 이를 통해 개별 식품의 평균적인 섭취 수준과 성별·연령층·지역별 차이, 연도별 소비 변화를 세부적으로 확인할 수 있다. 식품소비 패턴 분석, 식생활 및 영양정책 수립, 식품안전 및 위해평가 기초자료, 식품산업 상품기획, 급식 및 식단구성, 학술연구, 통계분석 및 인공지능 기반 식품수요 예측 등에 활용할 수 있다.
