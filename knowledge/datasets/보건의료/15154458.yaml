summary_user: 전국 지자체가 관리하는 병원·종합병원·치과병원 등 30명 이상 수용 의료기관의 인허가 정보를 개별 기관 단위로 담으며, API 전체 8,316건에 인허가일자·영업상태·병상수·진료과목·주소·좌표 등이 있다. 상권 분석가나 지역 사업자가 특정 지역에서 병원이 언제 개업·폐업했는지, 영업 중인 병원이 몇 곳인지 알아보는 질문에 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 키로 다른 주소 기반 데이터와 잇고, 개방자치단체코드와 기준일자는 다른 데이터에서 받아 조회 조건에 넘긴다.
description_portal: '건강_병원 데이터는 병원, 종합병원, 치과병원 등 의사가 환자를 진찰 및 진료하는데 필요한 설비가 갖춰있으며, 30명 이상의 환자를 수용할 수 있는 시설을 갖춘 의료기관 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 병원 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 보건복지부 의료기관정책과 / 044-202-2481 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
