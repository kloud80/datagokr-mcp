description_portal: 본 자료는 한국보건산업진흥원이 보건산업 전반의 최신 동향을 시각적으로 쉽게 전달하기 위해 제공하는 인포그래픽 기반의 정보 콘텐츠이다. 디지털헬스케어 기술 발전, 외국인환자 유치 현황, 영양 및 식품소비 통계, 보건산업 연구개발(R&D) 동향, 산업별 시장 규모 등 주요 이슈를 주제로 하여 핵심 정보를 시각화하였다. 시계열별 변화 추이, 산업 간 구조 비교, 항목별 세부 수치 등 다양한 분석 결과를 직관적인 인포그래픽 형식으로 표현함으로써 복잡한 통계자료의 접근성과 이해도를 향상시킨다. 본 자료는 연구자, 보건의료 정책입안자, 산업 관계자 및 일반 국민에게 유용한 정보로 제공되며, 보건산업 관련 정책 수립과 대국민 소통 자료로도 적극 활용 가능하다.
