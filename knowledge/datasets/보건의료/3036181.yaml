summary_user: 국민건강증진기금으로 수행된 건강증진 연구보고서를 과제 1건당 한 행으로 담은 목록 파일로, 과제명·수행기관·연구책임자·수행연도·연구기간·연구비와 흡연·음주·비만 등 30여 개 주제 분류 표시, 결과보고서 첨부파일명과 바로가기 링크를 포함한다. 연구자나 정책 담당자가 "특정 연도에 금연·절주 분야로 어떤 기관이 얼마의 연구비로 연구했고 보고서는 어디서 보나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·과제명 같은 이름 매핑으로만 연결한다.
description_portal: 건강증진 분야와 관련된 연구자료본데이터는 보건복지부 건강증진정책의 일환으로 추진되는 건강증진연구 보고서에 대한 정보를 제공합니다. 데이터는 과제명, 연구서행기관, 연구책임자, 수행연도, 연구비, 연구주제 등으로 구성되어있습니다. 본데이터는 보건의료 및 건강증진에 관심이 있는 연구자들을 대상으로 연도별로 완료된 연구에 대한 정보 및 결과보고서 링크를 제공함으로써, 보건의료분야 연구활성화에 기여할 수 있으며, 관심이 있는 국민에게 국민건강증진기금으로 수행되는 연구결과를 공개하고 있습니다.
