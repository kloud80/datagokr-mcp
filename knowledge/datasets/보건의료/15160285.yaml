summary_user: 요양급여 청구 내역을 바탕으로 산출한 전국 분만 가능 의료기관 목록으로, 기관 한 곳이 한 행이며 시도·시군구·종별·기관명·주소·전화번호·야간 분만 여부를 담는다. 임신부나 가족이 '우리 시군구에서 분만할 수 있는 병원은 어디이고 야간 분만도 되는가'를 확인하거나, 분석가가 지역별 분만 인프라 공백을 살피는 데 쓴다. 요양기관 기호(ykiho) 같은 전역 조인 키가 없어, 심평원 병원정보 등 다른 요양기관 데이터와는 기관명·주소 또는 시도·시군구 이름 매칭으로만 이어 쓴다.
description_portal: '분만 가능한 의료기관을 국민이 사전에 확인할 수 있게 함으로서 적정 의료기관 선택 등 효율적인 출산계획 수립을 가능하게 함. ※ 의료기관에서 건강보험심사평가원에 요양급여를 청구한 내역을 기반으로 산출하였으며, 실제 분만 가능 여부는 방문전에 해당 기관에 확인하기 바랍니다.- 산출기간: 진료년월 2025.1.1.~2026.4.30(심사년월 2025.1.1.~2026.4.30.) 기준- 보험구분: 건강보험, 의료급여 포함/ 청구유형 DRG 포함- 산출 수가 등은 첨부한 산출기준 파일을 참고하기 바랍니다'
