description_portal: '서울특별시 용산구 흡연구역 현황(자치구명, 시설구분, 시설형태, 서울특별시 용산구 설치 위치, 위도, 경도)에 대한 데이터를 제공합니다. 이 데이터에는 자치구명, 시설 구분(예: 흡연부스 등), 시설 형태, 설치 위치, 위도 및 경도 등의 항목이 포함되어 있으며, 총 76건의 흡연구역 정보가 연간 주기로 업데이트됩니다. 데이터는 CSV 형식은 물론 XML·JSON 기반 API 형태로도 제공되어, 누구나 열람과 활용이 가능합니다. 최근에는 용산구가 서울역 광장 일대를 금연구역으로 지정하면서 변화가 나타났습니다. 2025년 6월 1일부터 서울역 광장 일대(총 면적 약 6,570㎡)가 금연구역으로 지정되어, 해당 구역 내에서는 흡연 시 과태료 10만 원이 부과됩니다. 이 조치와 함께 서울역 광장 인근에 흡연부스 하나가 설치되어, 흡연자들은 해당 부스를 이용할 수 있도록 안내됩니다'
