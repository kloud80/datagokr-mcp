description_portal: '제주특별자치도 내 읍면동별 성인병 건강실태분석 관련 데이터를 제공합니다.항목: 비만율, 흡연율, 스트레스 인지율 등*도민의 정신질환 예방과 정신질환자의 의료 및 사회복귀에 필요한 사업을 추진하기 위해 정신질환실태 역학조사를 실시하고 결과를 발표*정신보건법 제4조의 2에 의하면 보건 복지부장관은 매 5년마다 전국 정신질환자 실태조사를 하도록 규정되어 있어, 2001, 2006, 2011년에 조사를 실시 하였으나 제주도민은 인구수가 작아 표본추출에서 매 회 제외되어 왔으며, 이번 조사는 2015년 5월 31일을 기준하여 주민등록인구통계상에서 제주에 주소를 두고 제주에 실제로 거주하는 만18세∼만74세의 도민 900명을 대상으로 2015년 10월 12일부터 12월 13일까지 실시함*본 조사는 5년마다 진행됩니다'
