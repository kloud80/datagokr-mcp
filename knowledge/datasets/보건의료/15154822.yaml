summary_user: 전국 자치단체가 관리하는 약국 인허가 정보를 한 서식으로 모은 업소 단위 건별 원천으로, 사업장명·인허가일자·영업상태·폐업·휴업일자·주소·좌표·약국영업면적을 담으며 API 전체 70,658건 규모다. 동네에 새로 문을 열거나 폐업한 약국이 어디인지, 특정 지역에 영업 중인 약국이 몇 곳인지 확인하려는 주민·예비 개업 약사·상권 분석가가 쓴다. 지번·도로명 주소(LOTNO_ADDR, ROAD_NM_ADDR)로 다른 주소 기반 데이터와, 개방자치단체코드(행정표준 기관코드)로 지자체 단위 데이터와 잇고, 병의원 등 다른 LOCALDATA 인허가 데이터와 같은 틀로 묶어 개폐업 흐름을 본다.
description_portal: '건강_약국 데이터는 약사가 의약품을 조제 또는 판매를 주목적으로 하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 약국 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 보건복지부 약무정책과 / 044-202-2495 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
