summary_user: 2021~2023년 진료개시년도별로 입원·외래 진료형태, 수진자 주민등록주소지 기준 전국 시군구, 22대 주상병분류별 진료인원(중복제외)과 진료비(억 원)를 담은 건강보험 급여실적 집계 파일이다. 분석가나 지자체 담당자가 '우리 시군구 주민의 순환계통 질환 입원 진료비가 다른 지역보다 높은가'처럼 지역별 질병군 진료 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어 시도·시군구 이름을 매핑해 인구 통계 등과 이어야 하며, 심평원 청구 기준 통계와는 기준이 달라 값이 다르다.
description_portal: '국민건강보험공단_진료형태별 시군구별 22대 주상병분류별 진료인원 및 진료비 1. 진료개시년도: 2021년~2023년2. 진료형태: 입원, 외래3. 시도, 시군구: 수진자의 수진 시점 주민등록주소지 기준4. 주상병 분류: 22대 분류 기준(파일데이터 참고)5. 진료인원(명) 및 진료비(억 원): 해당 구분별 진료인원(중복제외) 및 진료비  - 진료일 기준(한의분류 제외, 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 지급분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음  - 개인정보 보호를 위해 5 미만의 자료는 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
