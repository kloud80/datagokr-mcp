description_portal: 이 자료는 서귀포시 지역에서 생성된 코로나19(COVID-19) 감염병에 대한 월별 확진자 수와 사망자 수의 통계를 정리한 데이터입니다. 연도별로 각 월마다 등록된 확진자와 사망자 수치를 통해 지역 내 감염병 발생과 치명률 변화 추이를 분석할 수 있습니다. 지자체 보건당국은 이를 토대로 방역 정책의 효과 검토, 의료자원 배분 및 대응 전략 수립을 진행할 수 있으며, 연구자 및 시민은 인구 대비 확진률, 사망률 변화, 시기별 위험도 등을 비교 분석해 감염병 대응의 지역별 특징을 파악할 수 있습니다.
