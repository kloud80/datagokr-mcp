description_portal: 서울특별시 양천구가 제공하는 본 데이터는 관내 의료유사업체의 인허가 현황을 체계적으로 정리하여 제공하는 자료이다. 데이터에는 인허가 번호, 사업장명, 소재지주소, 업태구분명, 영업상태, 종업원수, 병상수, 총면적 등 주요 항목이 포함되어 있어 각 업체의 운영 실태와 인허가 상태를 정확히 확인할 수 있도록 구성되어 있다. 본 자료는 행정 담당자가 의료유사업체 관리 및 감독, 정책 수립, 지역 보건 안전 점검 등의 목적으로 활용할 수 있으며, 연구자 및 시민은 지역별 의료유사업체 분포와 서비스 특성을 분석하고 의료 자원의 효율적 배치를 검토하는 데 유용한 정보 자원으로 활용할 수 있다.* 양천구의 안마시술소, 안마원 등 안마를 목적으로 운영하는 업소정보입니다.
