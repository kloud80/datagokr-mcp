description_portal: '* "21년도부터는 질병관리청 소관으로 해당 통계 생산이 이루어져 "20년도까지의 데이터를 제공함을 알려드립니다.* 단위 : 신고 수(인구 십만명 당 발생률)1) 표본감시체계를 통하여 신고된 자료는 제외2) 각 질병별로 규정된 신고 범위(환자, 의사환자, 병원체보유자)의 모든 보고 건 3) B형간염은 감염병의 진단기준 고시 개정(2016. 1. 7.)에 따라 급성B형간염에 한해 신고토록 변경됨4) 반코마이신내성황색포도알균(VRSA) 감염증은 감염병의 진단기준 고시 개정(2019. 4. 30.)에 따라 반코마이신중등도내성황색포도알균(VISA) 감염증(3건)을 포함함5) 2020년 신종감염병증후군은 코로나19(COVID-19)로 신고·보고된 건수임6) 감염병 사망은 해당 감염병으로 인한 사망으로 진단한 경우 신고함(단, 제3군 CRE 감염증 사망은 혈액에서 CRE가 분리된 사람이 검체 채취 후 30일 이내에 사망한 경우 신고함)'
