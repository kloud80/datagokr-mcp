summary_user: 경상남도 함양군에서 명절·휴일에 문을 여는 의료기관, 약국, 안전상비의약품 판매점을 한 곳씩 담은 파일로, 업소별 유형 구분·이름·도로명주소·위도·경도·전화번호·데이터 기준일을 담는다(포털 설명상 병원·의원 2곳, 약국 4곳, 편의점·휴게소 등 판매점 14곳). 함양군 주민이나 방문객이 '명절 연휴에 함양에서 진료하는 병원이나 문 연 약국, 상비약 살 곳은 어디인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 업소명·주소로 맞추거나 좌표(위도·경도)로 지도·거리 기반 결합을 한다.
description_portal: 경상남도 함양군의 명절 및 휴일 진료 의료기관 현황을 유형별로 구분한 데이터로 의료기관 구분, 의료기관 명칭, 의료기관의 소재지 도로명주소, 위도 및 경도, 전화번호, 데이터 기준일자로 구성되어 있으며, 명절 및 휴일에 진료하는 의료기관 뿐만 아니라 약국, 안전상비 의약품 판매점정보를 포함하고 있습니다. 의료기관에는 함양성심병원, 한마음의원 등 2개 기관이 있고, 한들약국, 행복약국, 새동산약국, 동해물약국 등 4개 약국과  GS25함양용평점, 세븐일레븐함양교산점, CU함양한들점, CU함양안의점, 함양휴게소(서울방향), 함양휴게소(통영방향), CU함양서상점, GS25함양교산점 등 14개의 안전상비의약품판매점 정보를 제공합니다.
