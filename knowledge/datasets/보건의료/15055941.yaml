summary_user: 광산구 내 응급의료기관(지역응급의료센터·지역응급의료기관 등)을 기관 한 곳당 한 행으로 담은 파일로, 응급의료 종류·종별·기관명·주소·전화번호·진료과목·병상수·위도·경도를 포함한다. 광산구 주민이나 방문객이 "지금 가까운 응급실이 어디이고 어떤 진료과목을 보는가"를 확인하거나, 분석가가 구 단위 응급의료기관 분포를 지도에 올릴 때 쓴다. 전역 조인 키(기관 코드 등)가 없어 다른 응급의료 데이터와는 기관명·주소로 맞추거나 위도·경도로 공간 결합해야 한다.
description_portal: 광주광역시 광산구 내에 위치한 응급의료기관( 「의료법」 제3조에 따른 의료기관 중에서 「응급의료에 관한 법률」 에 따라 지정된 권역응급의료센터, 전문응급의료센터, 지역응급의료센터 및 지역응급의료기관을 말함)의 현황에 대해 안내드립니다. 이 데이터는 광산구 지역 주민과 방문객들이 응급 상황 발생 시 신속하게 적절한 의료기관을 찾을 수 있도록 도움을 주기 위한 것으로, 응급의료기관의 종류(지역응급의료센터, 지역응급의료기관 등), 각 기관의 명칭, 위치(주소), 운영 중인 진료과목, 응급실 운영 여부 등 다양한 정보를 포함하고 있습니다. 해당 자료는 응급환자 발생 시 골든타임 확보 및 효율적인 응급의료서비스 제공을 위한 기초 자료로 활용될 수 있습니다.
