summary_user: 전남광주통합특별시에서 외국인환자를 유치할 수 있도록 등록된 의료기관을 기관 한 곳당 한 행으로 담은 파일(csv, 약 5KB)로, 기관명·기관구분·대표자·도로명주소·유치목표국가가 들어 있으며 포털 설명상 2025년 11월 17일 기준이다. 의료관광 사업자나 외국인 환자 안내 담당자가 '이 지역에서 특정 국가 환자를 대상으로 하는 병의원은 어디인가'를 찾을 때 쓴다. 공통 조인 키가 없으므로 다른 의료기관 인허가 데이터와는 기관명이나 주소를 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 기관명·주소 매칭으로만 다른 데이터와 이을 수 있다. 시도 단위로 기관별 주소만 담으며, 실제 외국인환자 수나 진료 실적은 담지 않는다.
