summary_user: 서울특별시 광진구에 있는 산후조리원을 시설 한 곳당 한 행으로 정리한 파일로, 이름·전화번호·주소와 이용기간, 가격(만원), 비고를 담는다(csv 320바이트의 소규모 목록). 광진구에서 출산을 앞둔 예비 부모가 "구 안의 산후조리원은 어디이고 2주 이용에 얼마인가"를 비교하고 예산을 세울 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 조리원 이름이나 주소 문자열을 맞춰 붙여야 하며, LOCALDATA 산후조리업 인허가 자료와 주소 기준으로 대조하는 방식으로 이어 쓴다.
limits: 광진구 한 개 시군구만 다루므로 다른 구나 서울 전체와 비교하려면 각 구 자료를 따로 모아야 한다. 인허가번호 같은 공통 키가 없어 인허가·개폐업 자료와의 연결은 이름·주소 매칭에 의존한다.
