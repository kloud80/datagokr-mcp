status: active
summary_user: 의원급 의료기관(약국 제외, 양방만)의 진료년도·표시과목·주상병코드별 건강보험 진료비를 집계한 전국 단위 통계로, 환자수·명세서청구건수·입내원일수·보험자부담금·요양급여비용총액을 담는다. 분석가나 개원 준비 의사가 "내과·이비인후과 같은 표시과목 의원에서 어떤 상병의 환자와 진료비가 많은가"를 볼 때 쓴다. 전역 조인 키는 없어 주상병코드를 질병분류(KCD) 코드표와, 표시과목을 진료과목 이름으로 맞춰 다른 상병·진료과 통계와 이어 쓴다.
limits: 요양기관 식별번호가 없어 개별 의원 단위로 연결하거나 지역별로 나눠 볼 수 없고 전국 합계만 본다. 질병은 청구 시 부여한 주상병 기준이라 최종 확정 진단과 다를 수 있고, 환자수는 범주 안에서만 중복을 제거한 값이라 다른 범주와 단순 합산하면 중복이 생긴다. 진료비는 비급여를 제외하며, 심사분은 진료년도 이후 4개월까지 반영된다.
