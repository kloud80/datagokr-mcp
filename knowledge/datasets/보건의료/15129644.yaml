description_portal: '<시트1> 요양보호사 종사자 수1. 기준연월: 해당 연도별 종사자수 누적 기준연월2. 시도/시군구: 충청권(대전, 세종, 충북, 충남), 기준연월 시점의 장기요양기관 소재지 기준3. 요양보호사 수 - "요양보호사(중복제거)"는 급여종류(재가/시설)별 중복 제외 - "전체(중복제거)"는 시군구별 중복제외, 시도별 중복허용 - 요양보호사1급+2급 중복인원 제거<시트2> 요양보호사 자격증 발급자 수1. 기준연월: 해당 연도별 자격증 발급자 수 누적 기준연월2. 시도: 충청권(대전, 세종, 충북, 충남), 구 단위 발췌 불가3. 자격증 발급자 수: 한국지역정보개발원 새올 정보시스템으로부터 연계된 자료로 주민등록번호 기준으로 발췌※ 민원인의 공공데이터 제공 신청에 의해 발췌 및 구성된 데이터이며, 향후 업데이트 계획이 별도 없는 1회성 자료입니다.기타 지역에 대한 정보는 "국민건강보험공단_장기요양보험통계연보"* 를 확인하시기 바라며, 요양보호사 자격증 발급에 관한 사항은 국민건강보험공단 수행 업무가 아님에 따라, 각 지자체에 문의해주시기 바랍니다.* (바로가기) https://www.data.go.kr/data/15103041/fileData.do'
