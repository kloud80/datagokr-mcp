summary_user: "진료년도·3단 주상병코드·의료기관종별(약국 제외, 양방만) 단위로 건강보험 환자수, 명세서 청구건수, 입내원일수, 보험자부담금과 요양급여비용총액을 묶은 전국 집계 통계로, 건별 진료 원천이 아니다. 분석가나 연구자가 '특정 질병(예: 당뇨)의 진료비와 환자가 상급종합병원·병원·의원 중 어디에 몰리는가'처럼 질병별 의료기관 이용 구조를 볼 때 쓴다. 전역 조인 키는 없고 주상병코드(KCD 3단)나 의료기관종별 이름으로 다른 상병·종별 통계와 맞춰 이어 쓴다."
limits: 요양기관 개별 단위나 지역별 분석은 안 되며(전국·비공간), 요양기관 원장의 기관 코드와 직접 연결되는 키가 없다. 질병은 청구 시 부여한 주상병 기준이라 최종 확정 질병과 다를 수 있고, 환자수는 범주 안에서만 중복 제거되어 다른 범주와 단순 합산하면 중복이 생긴다. 금액은 비급여를 제외한 건강보험 급여분만 담는다.
