description_portal: 본 데이터는 한국보건산업진흥원이 수집·관리한 외국인환자 유치 관련 국가별 정보를 정리한 통계자료이다. 국가별 외국인환자 유입 규모, 주요 진료 분야, 진료기관 유형, 체류 목적 등 항목으로 구성되어 있으며, 연도별 변화를 반영하여 국가 간 비교 분석이 가능하다. 본 자료는 의료관광 정책 수립, 해외 마케팅 전략 수립, 유치성과 분석 등 다양한 분야에 활용된다. 데이터는 국가별 맞춤형 전략 기획, 의료서비스 수요 분석, 유입 패턴 예측 등 실무적 활용에 적합하다. 통계는 표준화된 분류체계에 따라 정리되어 있으며, 정기적으로 갱신되어 최신성과 신뢰성을 유지한다. 공공기관, 연구기관, 의료산업 관계자 등에게 실증 기반의 유용한 참고자료로 제공된다.
