summary_user: 식품의약품안전처가 관리하는 의료기기 품목분류 문서정보를 품목분류번호 단위의 목록으로 담으며, 각 분류번호에 해당하는 품목등급과 국제규격 정보를 함께 제공하고 범위는 전국(비공간)이다. 의료기기 제조·수입 사업자나 인허가 담당자가 "이 품목분류번호는 몇 등급이고 어떤 국제규격이 적용되는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 의료기기 품목허가 등 다른 데이터와는 품목분류번호나 품목명을 이름·코드로 맞춰 연결해야 한다.
description_portal: 이 공공데이터 정보는 식품의약품안전처에서 관리하는 의료기기의 고유한 품목분류번호, 세분화된 품목등급, 상세한 국제규격 등의 분류 문서정보를 표 형태의 목록으로 제공하는 공공데이터입니다. 이 공공데이터 안에 있는 품목분류번호에 해당하는 품목 등급, 국제규격정보 등을 한눈에 파악할 수 있습니다. 그리고 사용자는 해당 품목분류번호에 해당하는 자세한 국제규격정보를 확인하고 싶을 시 해당 국제규격 정보를 웹사이트에 검색하시면 상세한 내용을 확인하는 데 큰 도움을 받으실 수 있습니다.
