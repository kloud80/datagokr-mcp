summary_user: 서울 종로구 관내 안전상비의약품 판매업소(편의점 등)의 인허가 정보를 업소 한 곳당 한 행으로 담는다. 사업장명(BPLCNM), 인허가일자·취소일자, 영업상태·상세상태, 폐업일자, 휴업 시작·종료일, 전화번호, 지번·도로명 주소, 좌표가 들어 있다. 시민이 '종로구에서 밤에 해열제나 감기약을 살 수 있는 편의점이 어디인가'를 찾거나, 분석가가 판매업소의 신규 인허가·폐업 추이와 동네별 분포를 볼 때 쓰고, 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 관리번호·자치단체 코드로만 잇는다.
description_portal: '본 데이터는 서울특별시 종로구 관내 안전상비의약품 판매업소에 대한 인허가 정보를 정리한 자료입니다. 해당 업소는 약국 외의 장소에서 해열진통제, 감기약, 소화제, 해열제 등 긴급상황 시 복용 가능한 일반의약품을 판매할 수 있도록 지정된 곳으로, 자료에는 사업장명, 인허가일자, 인허가취소일자, 영업상태 등이 포함되어 있습니다. 본 데이터는 판매업소 운영 실태, 인허가 추이, 지역별 분포 현황 등을 파악하는 데 활용할 수 있으며, 시민의 의약품 접근성 향상, 공공의료 안전망 강화, 편의점 등 민간 유통망 기반의 복약환경 조성 등에 기초자료로 제공됩니다. 행정처분 관련 정보는 포함되어 있지 않으며, 단순 인허가 현황 중심의 자료입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
