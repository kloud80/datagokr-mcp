summary_user: 서울 구로구에서 안전상비의약품 판매 허가를 받은 편의점 등 업소를 한 곳씩 담은 건별 인허가 원천 데이터로, 상호명·인허가일자·취소일자·영업상태·폐업일자·지번/도로명 주소·중부원점TM 좌표(X, Y)를 포함한다. 주민이나 분석가가 "우리 동네에서 밤이나 공휴일에 해열제·파스를 살 수 있는 영업 중인 편의점이 어디 있나", "판매업소가 부족한 지역은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 위치 분석에는 좌표 변환을 거쳐 약국·의료기관 위치 데이터와 겹쳐 본다.
description_portal: 안전상비의약품 판매업소 인허가 정보는 약국 외에서도 해열제·지사제·파스 등 필수 의약품을 판매할 수 있도록 허가받은 편의점 등 업소의 인허가일자, 영업상태명, 소재지주소, 업종구분 등을 기록한 데이터이다. 안전상비의약품 판매 체계는 야간·공휴일 등 약국 이용이 어려운 시간대에도 주민의 기본 의약품 접근성을 보장하기 위한 중요한 공공보건 정책이다. 이 데이터는 지역 내 판매 가능 업소의 분포를 분석하여 건강격차 해소, 응급 상황 대응 환경 조성에 활용 가능하다. 또한 본 자료는 중부원점TM(EPSG:2097) 좌표계 기반의 위치정보만 제공하며 위경도는 포함되지 않음, GIS 이용 시 좌표 변환이 필요하다. 3일 전 자료 제공 규칙으로 최신 인허가 현황을 반영하여 규제 준수 여부를 신속히 확인하는 데 유리하다.
