description_portal: '1. 진료연도: 2018년~2022년2. 성별구분: 남, 여3. 질환구분: 암, 심장질환, 뇌혈관질환, 희귀질환, 중증난치성질환4. 지역: 전국 17개 광역시·도5. 연령구분: 만 18세 이하, 연도말 기준 만나이 - 0세/1~4세/5~9세/10~14세/15~18세 그룹 구분6. 진료인원수: 질환구분별 보건복지부고시 「본인일부부담금 산정특례에 관한 기준」(이하 "고시")에 해당하는 특정기호로 진료받은 진료인원 수  * 요양기관의 청구 소멸시효(3년)가 미도래한 진료연도의 경우, 진료인원수가 모두 반영되지 않았을 수 있음<용어설명>- 암: 고시 [별표 3] 중증질환자 산정특례 대상의 구분1에 해당하는 경우로, 암 산정특례 등록 질환자가 등록 암 및 해당질환으로 인한 합병증으로 진료받은 경우- 심장질환: 고시 [별표 3] 중증질환자 산정특례 대상의 구분3에 해당하는 경우로, 고시 해당상병 수술 및 약제투여 진료받은 경우- 뇌혈관질환: 고시 [별표 3] 중증질환자 산정특례 대상의 구분2에 해당하는 경우로, 고시 해당상병 수술 및 급성기 입원 진료받은 경우- 희귀질환: 고시 [별표4] 희귀질환자 산정특례 대상에 해당하는 경우로, 희귀질환(극희귀질환, 기타염색체 이상질환, 상세불명 희귀질환 포함) 산정특례 등록 질환자가 희귀질환 및 희귀질환으로 인한 합병증으로 진료받은 경우- 중증난치성질환: 고시 [별표4의2] 중증난치질환자 산정특례 대상의 구분1~5에 해당하는 경우로, 중증난치 산정특례 등록 질환자가 중증난치질환 및 중증난치질환으로 인한 합병증으로 진료받은 경우 * 4대 중증질환은 암, 심장, 뇌혈관, 희귀난치성질환을 의미하나, 「희귀질환관리법」에 따라 2019.1.1.부터 희귀난치성질환이 희귀질환과 중증난치질환으로 분리됨에 따라 5개 그룹으로 나누어 산출하였으며, 분리 전 내역은 특정기호에 따라 각각 희귀질환과 중증난치질환으로 분리하여 작성함※ 민원인의 제공 신청에 따른 제공 건으로 2023.9.6. 발췌'
