description_portal: 강릉관광개발공사가 관리하는 관내 자동심장충격기(AED) 설치 현황을 정리한 데이터입니다. 이 자료에는 각 AED가 설치된 관리기관, 시설명, 시설 주소, 구체적인 설치위치(로비, 안내데스크, 체육관 등), 설치대수와 데이터 기준일자가 포함되어 있습니다. 해당 데이터는 심정지 등 응급 상황 발생 시 신속한 응급처치를 가능하게 하고, 공공시설 내 AED 접근성을 높이기 위한 안전 기반 정보를 제공합니다. 또한, 시설별 AED 분포와 접근성을 분석하여 관리·점검 주기 계획, 응급 구조 동선 설계, 행사 및 혼잡 시 응급 의료 배치, 정책 수립 등 공공보건·안전 관리에 활용할 수 있습니다. 이를 통해 주민과 방문객은 가까운 AED 위치를 사전에 확인하고, 행정기관은 시설 안전 관리와 시민 생명 보호 정책을 효과적으로 추진할 수 있습니다.
