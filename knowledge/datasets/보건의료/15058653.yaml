summary_user: 경기도 의료취약지역 보건진료소를 시설 한 곳당 한 행으로 담는 시설 현황 데이터로, 시군명·사업장명·인허가일자·영업상태·폐업일자·병상수·의료인수·진료과목·주소와 위경도를 포함한다. 경기도 농어촌 지역에서 가까운 보건진료소가 어디 있고 아직 운영 중인지 확인하거나, 시군별 보건진료소 분포와 의료인력 배치를 비교하는 데 쓴다. 전역 조인 키는 없으므로 시군코드(SIGUN_CD)나 시군명으로 같은 경기도 데이터와 묶고, 주소·위경도로 다른 의료기관·인구 자료와 공간적으로 대조한다.
description_portal: 이 데이터는 경기도 내 의료취약지역에 위치한 보건진료소의 현황을 제공합니다. 보건진료소는 농어촌 등 의료 접근성이 낮은 지역 주민들에게 기본적인 보건의료 서비스를 제공하기 위해 운영되는 시설입니다. 항목에는 사업장명, 진료과목, 병상수, 의료인 수, 인허가일자, 입원실 수, 위치정보 등이 포함됩니다. 해당 데이터는 보건의료 인프라의 지역별 분포 파악, 의료 접근성 향상 정책 수립, 공공보건서비스 강화 등의 목적으로 활용될 수 있습니다.※ 본 데이터는 2018년 9월 6일자로 갱신이 중단되었습니다.
