summary_user: 식약처가 지정한 희귀의약품을 성분 단위로 담은 API로, 지정번호·제품명·제조소명·대상질환·지정일자와 지정취소일자, 성분코드·성분명을 행마다 제공한다. 환자 단체나 의료기관이 특정 질환 치료제나 제품이 희귀의약품으로 지정됐는지(또는 취소됐는지) 확인하고, 정책 분석가가 질환별 지정·취소 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식약처 의약품 데이터와는 성분코드(CPNT_CD)·제품명 같은 이름·코드 매핑으로만 연결한다.
description_portal: 식품의약품안전처 「희귀의약품성분 정보」 OpenAPI는 국내 식약처가 지정한 희귀의약품의 성분 관련 정보를 제공하는 공공데이터입니다. 제공 항목으로는 희귀의약품 지정번호, 제조소명, 대상질환, 제품명, 제제명, 지정일자, 지정취소일자, 접수번호, 성분일련번호, 성분코드, 성분명 등이 포함되어 있습니다. 이를 통해 환자 단체 및 의료기관에서도 치료 대상 질환과 제품명을 근거로 희귀의약품 여부를 체크할 수 있으며, 정책 분석가 및 제약개발자는 희귀의약품 지정·취소 추이를 분석해 희귀 질환 치료 전략 수립과 연구 우선순위 결정에 참고자료로 활용할 수 있습니다.
