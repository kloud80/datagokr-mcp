description_portal: 음주폐해예방 관련 지표- 세계보건기구(WHO) 알코올 정보 시스템(GISAH)을 통해 산출된 자료로, 만 15세 이상 인구의 1인당 알코올 총 소비량을 세계 지역 단위로 집계한 값입니다. - 공식적으로 기록된 소비량뿐만 아니라 비공식적으로 소비된 양과 관광객에 의한 소비량을 합산‧보정한 수치입니다. - 단위는 리터(ℓ)이며, 아프리카·미주·동남아시아·유럽·동부 지중해·서태평양·전 세계 7개 권역의 연도별 변화를 비교할 수 있습니다.- 본데이터는 음주폐해예방 및 절주문화 확산을 위한 국가간 비교 연구 시 기초자료로 활용될 수 있습니다.
