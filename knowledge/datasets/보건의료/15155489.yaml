description_portal: '"제주특별자치도 내 건강검진지정 의료기관 현황 데이터를 제공합니다.항목: 검진기관명, 읍면동, 일반, 영유아, 구강, 위암, 대장암, 간암, 유방암, 자궁경부암, 폐암*일반검진의 경우 건강보험 직장가입자 중 비사무직 근로자는 매년, 사무직 근로자는 2년에 1회 받을 수 있다. 세대주인 지역가입자와 20세 이상 피부양자 및 세대원, 의료급여수급권자도 2년마다 검진을 받을 수 있다.*암 검진은 연령별 고위험군을 대상으로 실시된다. 자세한 사항은 제주특별자치도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/bodo/list.htm"'
