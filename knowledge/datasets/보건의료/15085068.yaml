description_portal: '○ 통계개요* 통계명 : 만성질환 급여현황* 통계종류 : 서울시 만성질환 급여 현황을 제공하는 일반·보고통계(승인번호35003)* 작성목적 : 환자의 거주지역별 의료이용 특성, 주요 암질환 특성 및 만성질환 특성 등을통계자료로 생산함으로써 전국 지자체 뿐 아니라 보건의료기관 및 학술연구기관이 지역 보건현황을 파악하도록 돕고, 나아가 지역별로 효과적인보건의료정책을 수립하는 데 기여하기 위함* 조사체계 : 요양기관→건강보험심사평가원→국민건강보험공단 지급* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용- 진료실인원, 내원일수, 급여일수, 진료비, 급여비○ 용어설명* 의료기관 : 환자를(에게) 진료(투약)하는 기관으로서, 종합전문요양기관, 종합병원, 병원,의원, 치과병원, 치과의원, 조산원, 보건의료원, 보건소, 보건지소, 보건진료소, 한방병원,한의원임* 진료실인원 : 건강보험 및 의료급여 가입자중 1년간 실제 진료받은 환자수로 상병별,월별, 요양기관종별로 실인원을 각각 산정, 총 실인원수와 일치하지 않음.* 내원(입원)일수 : 진료비청구명세서상에 기재된 건강보험 및 의료급여 환자가 실제로요양기관에 방문 또는 입원한 일수* 급여일수(진료일수) : 진료비청구명세서에 기재된 총 투약일수를 포함한 일수* 진료비 : 요양기관에서 건강보험 및 의료급여 환자진료에 소요된 비용으로 공단부담금과환자본인 부담금을 합한 금액이며, 의료기관에서 청구한 총진료비 중 심사결정된 진료비* 급여비(공단부담금) : 심사결정된 총진료비(약제비)중 법이 정한 환자본인부담금을제외하고 보험자(공단)가 의료기관에 지급한 금액○ 기 타* 지역별의료이용통계는 환자가 요양기관에서 진료받은 수진 월 기준이며, 진료비, 급여비및 급여일수에 약국진료실적 포함* 급여비는 건강보험 가입자의 진료에 소요된 총진료비 중 공단이 부담한 금액임* 질병통계는 가입자가 해당질병이 의심되어 진료 받은 1차진단명을 요양기관이 청구한내역의 주상병 기준으로 최종 확정된'
