summary_user: 서울 용산구의 안전상비의약품 판매업소(편의점 등)를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일자·취소일자, 영업·상세영업 상태, 폐업·휴업 일자, 전화번호, 지번·도로명 주소, 사업장명, 좌표(X·Y)를 포함한다. 주민이나 분석가가 '용산구에서 지금 영업 중인 상비약 판매 편의점은 어디인가', '야간에 상비약을 살 수 있는 곳이 동네별로 얼마나 분포하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관(개방자치단체) 코드로만 이어 쓴다.
description_portal: 서울시 용산구에서 운영 중인 안전상비의약품판매업자에 대한 정보는 「서울시 용산구 안전상비의약품판매업 인허가 정보」 공공데이터를 통해 제공되며, 이 데이터는 매일 갱신됩니다. 주요 항목으로는 관리번호, 인허가일자(APVPERMYMD), 인허가취소일자(APVCANCELYMD), 영업상태코드·영업상태명(TRDSTATEGBN / TRDSTATENM), 상세영업상태코드·상세영업상태명(DTLSTATEGBN / DTLSTATENM), 폐업일자(DCBYMD), 휴업시작일자·휴업종료일자(CLGSTDT / CLGENDDT), 재개업일자(ROPNYMD), 전화번호(SITETEL), 소재지 정보(지번주소 • 도로명주소), 우편번호, 사업장명(BPLCNM) 등이 포함되어 있습니다.요약하자면, 이 공공데이터는 인허가 및 영업 상태 변동, 폐업 및 휴업 일정, 연락처, 정확한 주소 정보, 사업장명 등을 포함하여, 용산구 내 안전상비의약품판매업자의 운영 현황을 실시간에 가깝게 추적할 수 있는 매우 유용한 자료입니다. 연구, 행정 업무, 시민 건강 접근성 분석 등 다양한 목적으로 활용 가능합니다.
