summary_user: 국립공주병원 한 곳의 비급여 진료 항목을 항목별로 담은 파일로, 행위·치과·제증명수수료 대분류 아래 검사료·심리검사·처치 및 수술 등 분류별 코드·명칭·비용·비고를 한 줄씩 기록합니다. 환자나 보호자가 이 병원에서 심리검사나 진단서 발급 같은 비급여 항목에 얼마를 내야 하는지 미리 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 병원 비급여 자료와는 항목 명칭이나 코드를 직접 맞춰 비교해야 한다.
description_portal: 보건복지부 국립공주병원에서 진료시의 비급여에 관한 공공데이터입니다.대분류에서는 행위와 치과, 제증명수수료로 분류하였고, 분류에는 이화학치료, 이화학요법료, 검사료, 전산화 신경인지 기능검사, 주의력검사, 스트레스 진단검사, 심리검사, 처치 및 수술, 제증명수수료, 코드, 명칭, 비용, 비고 등이 포함된 데이터입니다.이를 통해 병원 내 비급여 진료 항목의 상세 내역과 비용 구조를 파악할 수 있습니다.-보건복지부 국립공주병원 누리집(knmh.go.kr)에서 진료비와 비급여 진료비 확인하실 수 있습니다.
