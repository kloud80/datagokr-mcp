summary_user: 경기도 하남시에 등록된 의약품 도매상을 업소 한 곳당 한 행으로 담은 파일로, 업종 구분·업소명·소재지 주소·전화번호·데이터기준일자를 개별 주소 단위로 담는다. 하남시에서 의약품을 공급받을 도매상을 찾으려는 약국·의료기관 사업자나, 시 안의 도매상 분포를 확인하려는 분석가가 '하남시 어디에 어떤 의약품 도매상이 있나'를 알아보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소 매칭으로만 이어 쓸 수 있고, 식약처 품목기준코드 같은 의약품 코드로 약가·허가 정보와 직접 연결되지는 않는다.
limits: 범위가 하남시 한 곳으로 한정되어 다른 시군구나 전국 도매상 현황은 담지 않는다. 업소 고유번호 같은 조인 키가 없어 인허가 원천 데이터와 연결하려면 이름·주소를 직접 대조해야 한다.
