summary_user: 건강보험 특정기호 F021(난임진료) 청구 중 남성불임·여성불임·인공정액주입·시험관수정·기타 보조수정 상병 그룹별로 2018~2022년 진료인원(중복제외)과 진료건수를 수진자 주소지 시도와 연말 기준 연령으로 나눠 담은 집계 파일이다. 지역별·연령대별로 난임 시술 이용이 어떻게 늘거나 줄었는지, 예컨대 30대 후반 여성의 시험관수정 진료인원이 시도마다 얼마나 다른지 살피는 정책 분석가나 연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 통계와는 시도명·연도·연령 같은 이름 매핑으로만 맞춰 쓴다.
description_portal: '1. 특정기호 : F021(「국민건강보험법 시행령」 별표 2 제3호카목에 따른 보건복지부장관이 정하여 고시하는 난임진료에 대한 요양급여비용)2. 주상병코드 : 그룹화  - N46(남성불임), N97(여성불임)  - Z311(인공정액주입), Z312(시험관수정), Z313(기타 보조수정방법)3. 진료연도: 2018년~2022년4. 주소지: 수진자 주민등록주소지5. 연령: 연말 기준6. 진료인원 및 진료건수: 해당 구분별 진료인원(중복제외) 및 건수  - 진료일 기준(한의분류 제외, 약국 제외) 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2023년 6월 지급분까지 반영  - 해당 질병통계 자료는 요양기관에서 환자 진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터'
