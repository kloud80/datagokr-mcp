summary_user: 경기도 안의 군부대 의무대, 기업·학교 부속의원 같은 부속의료기관을 사업장 한 곳당 한 행으로 담는다. 각 행에는 인허가일·영업상태·폐업일, 병상·의료인·병실 수, 구급차 수, 주소와 좌표가 들어 있다. 보건 정책 담당자나 분석가가 "우리 시군에 일반 병의원과 별개로 특정 집단만 진료하는 부속의료기관이 몇 곳 있고, 병상과 구급차를 얼마나 갖췄는가"를 확인할 때 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 같은 기관(경기도) 데이터의 코드, 사업장명·주소·좌표 매핑으로 다른 의료기관 인허가 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 부속의료기관의 현황을 정리한 자료로, 군부대 내 의무대, 기업·학교 등 특정 기관에 소속된 부속의원 등 다양한 형태의 의료기관 정보를 포함하고 있습니다. 이를 통해 기관별 운영 특성과 규모를 파악할 수 있습니다. 부속의료기관은 일반 의료기관과 달리 특정 집단을 대상으로 한 의료 지원 기능을 수행하기 때문에 지역 의료 인프라 분석 시 별도의 특성을 반영해야 합니다. 본 자료는 군·기업·학교 단위 의료체계의 분포 현황을 보여주며, 응급의료 지원, 보건 정책 수립, 민간·공공 의료 협력 체계 구축에 중요한 기초자료로 활용될 수 있습니다.
