summary_user: 의원·치과의원·한의원·보건소 등 특정 요양기관종별에서 발생한 건강보험 의약품 청구 약품비(천원)를 진료년월·진료과목·원내/원외 구분별로 전국 시군구 단위에 집계한 통계 파일입니다. 분석가나 지자체 담당자가 '우리 시군구 의원급의 원외처방 약품비가 월별·진료과목별로 얼마인가'처럼 지역별 1차 의료기관 약품비 규모와 추이를 비교하는 데 씁니다. 전역 조인 키가 없으므로 다른 지역 통계와는 시도·시군구 이름과 진료년월을 맞춰 연결하며, 심평원 청구 기준 통계와 함께 쓸 때는 기준 차이를 감안합니다.
description_portal: 본 데이터는 요양기관 종별(의원, 치과의원, 한의원, 보건소 등)에서 발생한 의약품 청구 내역을 시군구 단위로 집계한 통계자료로, 진료일 기준으로 구성되어 있습니다.1. 진료일기준, 요양기관종별(의원, 치과의원, 한의원, 보건소)2. 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2023년 6월 심사분까지 반영※ 2023.10.26. ※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.
