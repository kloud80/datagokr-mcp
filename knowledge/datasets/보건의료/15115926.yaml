description_portal: '서울특별시 중구 내에서 수의약품을 전문적으로 취급하며 병원이나 약국 등으로 약품공급을 담당하는 업체의 영업허가 및 관리 현황을 통합하여 제공합니다. 각 전문유통 업체에 부여된 관리번호, 현재의 영업 상태(개설, 폐쇄 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 관련 약품공급 분야 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 전문유통 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 동물병원 및 약국 등 최종 사용자에게는 품질관리 기준을 충족하며 영업허가를 득한 업체를 통해 안전하게 수의약품을 공급받을 수 있는 투명한 정보를 제공하여 동물 보건위생 관리에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
