summary_user: 호흡기(J00-J98, U04)·정신(F01-F99)·순환기(I00-I99)·비뇨생식기(N00-N99) 네 가지 주상병 그룹별로 2010~2023년 시군구 단위의 진료인원(중복제외)과 진료비(천원)를 담은 연도별 집계 파일입니다. 보건 분석가나 지자체 담당자가 '우리 시군구의 정신질환 진료인원과 진료비가 해마다 어떻게 바뀌었나'처럼 지역별 질환군 진료 추이를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시도·시군구 이름이나 주상병코드 그룹을 맞춰 연결해야 한다.
description_portal: '1. 주상병코드 그룹: J00-J98 U04 / F01-F99 / I00-I99 / N00-N992. 진료년도: 2010년~2023년3. 시도, 시군구: 주민등록 실거주지 기준4. 진료인원: 해당 구분별 진료인원(중복제외)5. 진료비: 공단부담금(기관부담금)과 본인부담금을 더한 금액, 요양급여(의료급여비용)총액   - 진료일 기준(한의분류 제외, 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 지급분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음  - 개인정보 보호를 위해 5 미만의 자료는 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터'
