description_portal: '1. 상병코드: M32(전신홍반루푸스), M34(전신경화증) 2. 구분: 1(전체 수가코드), 2(EB431, EB432, EB433)3. 보험자구분: 건강보험, 의료급여4. 진료년도: 2021~2022년 - 2023년 6월 심사분까지 반영함. 청구권 소멸시효 완성(3년)이전 자료는 변동될 수 있음 - 진료개시일 기준의 건강보험/의료급여 진료실적이며, 비급여,  한의분류 및 약국 제외5. 시도/시군구: 요양기관 소재지 기준6. 총환자수: 해당하는 환자의 수(명) - 개인정보 보호를 위해 시군구 단위의 5인 미만 건강보험 자료는 "*" 처리됨 - 위 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라 일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음※ 민원인의 제공 신청에 따른 제공 건으로 2023.10.16. 발췌※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
