summary_user: 식약처가 승인한 의약품 임상시험 계획마다 대상자 선정기준을 건별로 담고, 의뢰자·소재지·원개발사와 국가·승인일자·국문/영문 제목·대상 성별·연령대(18세 미만/18~65세 미만/65세 이상)를 함께 제공하며 범위는 전국이다. 환자나 연구자가 특정 질환 임상시험에 어떤 조건의 대상자가 참여할 수 있는지, 고령자 대상 시험이 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 임상시험 정보와는 임상시험정보일련번호(CLNC_TEST_SN)나 의뢰자·제목 같은 이름으로 맞춰 이어야 한다.
description_portal: 식품의약품안전처 「의약품 임상시험 계획 선정기준 정보」 OpenAPI는 임상시험 대상자 선정과 관련된 기준 정보를 제공하는 공공데이터입니다. 이 데이터는 임상시험 계획 승인과 함께 관리되는 항목으로, 연구자가 임상시험을 설계하거나 참여 기관에서 임상시험을 운영할 때 참고할 수 있도록 마련되어 있습니다.주요 항목으로는 임상시험 의뢰자, 임상시험 대표자, 임상시험 소재지, 원개발사 명칭(업체), 원개발사 국가, 최근(변경)승인일자, 임상시험정보  승인일자, 임상시험제목(국문, 영문), 선정기준,  성별 , 연령(18세미만/18세이상~65세미만/65세이상) 정보를 제공합니다.
team:
  dept: 데이터혁신기획팀
