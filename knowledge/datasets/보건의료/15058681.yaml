summary_user: 경기도 내 병원별 혈액투석 진료 평가 결과를 기관 한 곳당 한 행으로 담으며, 병원명·종별 구분·평가등급과 시군, 지번·도로명 주소, 우편번호, WGS84 좌표를 포함한다. 만성신장질환 환자나 가족이 "우리 시군에서 혈액투석 평가등급이 높은 병원은 어디인가"를 찾을 때, 분석가가 시군별 투석 의료기관의 분포와 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원명·주소 매칭이나 시군 코드(SIGUN_CD)를 같은 기관(경기도) 데이터와 맞추는 방식으로 잇고, 좌표로 지도 위에서 다른 시설과 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 병원들의 혈액투석 관련 진료 수준에 대한 평가 결과를 정리한 자료로, 각 병원의 명칭, 시군 위치, 평가등급, 주소, 좌표(WGS84 기준) 등의 정보를 포함하고 있습니다. 의료기관의 혈액투석 진료 품질을 등급으로 분류하여 제공되며, 이는 만성신장질환 환자들이 적절한 의료서비스를 제공받을 수 있는 기관 선택에 활용될 수 있습니다. 이 데이터는 질병 중심의 의료평가 기반 자료로서, 보건의료 정책 수립, 만성질환 관리 체계 개선, 의료자원 분산 평가, 지역별 치료 접근성 분석, 공공의료기관 운영 효율화 등에 활용될 수 있습니다.
