summary_user: 식품의약품안전처가 관리하는 우선판매품목허가 의약품을 품목 단위 목록으로 담으며, 주성분·품목명·함량·제형·허가 신청일·우선판매 관련 일자를 전국 범위로 제공한다. 제약사나 연구자가 '이 성분의 제네릭은 언제부터 판매할 수 있나'처럼 특정 의약품의 우선판매 허가 여부와 동일의약품 판매금지 기간을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 품목기준코드나 의약품 표준코드로 직접 잇지 못하고, 다른 식약처 허가정보나 심평원 약가·급여 목록과는 품목명·주성분 이름 매칭으로만 연결한다.
limits: 품목기준코드 같은 공통 코드가 없어 다른 의약품 데이터와 정확히 조인하기 어렵고 이름 매칭에 따른 오류를 감안해야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓰지 못한다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
