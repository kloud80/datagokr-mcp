description_portal: 식품의약품안전처에서 관리하는 우선판매품목허가 의약품(주성분, 품목명, 함량, 제형, 우선판매품목 허가일, 동일의약품 등에 대한 판매금지 기간) 정보를 목록으로 제공합니다.  이를 통해 사용자는 어떤 의약품이 우선 허가되었는지, 얼마나 오래 판매금지 기간이 적용되는지 및 제형과 함량 등의 기본 제약 조건을 확인할 수 있습니다. 또한 제약사 및 연구자는 우선판매 의약품 기반으로 개발 우선순위 설정이나 제품 출시 전략 참고 가능하며,  보건당국과 정책 담당자는 공공의료 필요성에 따른 허가 정책 평가 및 개선 방향 설정에 활용할 수 있는 자료로 활용 가능합니다.
