summary_user: 식약처가 관리하는 의약품 낱알(알약 등) 한 품목마다 모양·색깔·앞뒤 표시·분할선·크기(장축·단축·두께)·제품 이미지와 품목명·업체명·전문/일반 구분·품목허가일자를 담은 전국 단위 품목별 정보다. 약사·의료인이나 일반인이 손에 든 알약의 각인과 색·모양으로 "이 약이 무슨 약이고 어느 업체 제품인가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 품목일련번호(ITEM_SEQ)·품목명 등 같은 식약처 코드나 이름 매핑으로 허가정보·e약은요·DUR과 잇는다. 명세상 보험코드(EDI_CODE)·표준코드(STD_CD)도 있어 심평원 약가·급여 목록과 연결을 시도할 수 있다.
description_portal: 「의약품 낱알식별 정보」 OpenAPI는 식품의약품안전처  관리하는 의약품의 낱알(알약 등) 식별에 필요한 기본 정보들을 제공하는 공공데이터입니다. 제공 항목으로는 품목 기준 코드, 품목명, 업체명, 사업자등록번호, 의약품의 모양, 색 등이 포함되어 있습니다. 이를 통해 사용자는 특정 약의 이름과 제조 또는 수입업체, 품목기준 코드와 같은 고유 식별 정보를 직접 확인할 수 있습니다. 또한, 알약의 모양과 이름을 확인해 오남용을 예방하고, 의료 현장과 소비자 모두의 안전한 복용을 돕는 데 활용될 수 있습니다.
