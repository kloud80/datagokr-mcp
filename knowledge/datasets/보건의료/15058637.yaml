summary_user: 경기도 내 휴게소·산간벽지 등 특수장소에서 일반의약품을 취급하도록 지정된 업소를 한 행에 한 곳씩 담으며, 시군명, 업소명, 인허가·지정·폐업일자, 영업상태, 도로명·지번 주소와 위도·경도를 포함한다. 운전자나 지역 주민이 "근처 고속도로 휴게소에서 상비약을 살 수 있는 곳이 어디인가"를 찾거나, 분석가가 시군별로 의약품 접근이 어려운 지역에 지정소가 얼마나 영업 중인지 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드(SIGUN_CD)·시군명, 주소·좌표를 기준으로 다른 경기도 데이터나 약국·의료기관 위치 데이터와 이름 또는 공간 매칭으로 이어 쓴다.
description_portal: 이 데이터는 휴게소, 산간벽지, 도서지역 등 의료 접근이 어려운 지역에 설치된 특수장소 의약품 취급업소(지정소)의 운영 현황을 보여주며, 의약품을 취급할 수 있도록 지정된 장소들의 위치, 운영 상태, 인허가 정보 등을 포함합니다. 각 업소는 응급상황에서 일반의약품을 구입할 수 있는 기능을 수행하며, 인허가일자, 지정일자, 폐업여부와 같은 행정 정보와 함께, 도로명 주소 및 지번 주소, 위도·경도 정보가 포함되어 있어 공간 분석과 접근성 평가에도 유용합니다. 이 데이터는 의료 취약지역의 공공 보건 인프라 현황 파악, 의약품 접근성 향상 방안 마련, 보건복지 정책 설계 등에 활용될 수 있습니다.
