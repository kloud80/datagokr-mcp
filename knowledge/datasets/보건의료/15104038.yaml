description_portal: 본 데이터는 전북특별자치도 익산시에 소재한 정신건강의학과 의료기관에 대한 현황을 수록한 자료이다. 정신건강 관련 진료를 제공하는 병·의원 및 의료기관의 상호, 도로명주소, 지번주소, 위도, 경도, 전화번호 등의 정보를 포함하며, 시민의 정신건강 증진과 지역보건 향상을 위한 의사결정에 필요한 기초자료로 활용할 수 있다. 또한, 지역 내 정신건강 서비스 접근성 파악 및 보건의료 정책 수립을 위한 자료로도 활용할 수 있다. 해당 데이터는 주기적으로 갱신되며, 익산시 관내 정신건강 관련 의료자원의 분포와 특성을 파악하는 데 유용하다.
