description_portal: '서울특별시 중구 관내에서 동물용의약품을 전문적으로 취급하는 약국의 개설등록 및 운영 현황을 종합적으로 관리하여 제공하는 정보입니다. 각 등록된 약국에 대한 관리번호, 현재의 영업 상태(개설, 폐쇄 등), 상세 위치정보 등에 대한 항목들로 구성되어 있습니다. 이 자료는 동물용 동물용의약품 관련 유통관리 분야 창업을 준비하는 사업자에게는 중구 지역의 시장 분포 현황 및 개설등록 요건을 파악할 수 있는 중요한 기초 정보를 제공합니다. 또한, 시민들에게는 신뢰할 수 있는 약사가 운영하며 처방전 기반의 안전한 동물용의약품을 구입할 수 있는 약국의 위치정보를 투명하게 제공하여 가축 및 반려동물의 보건위생 관리에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
