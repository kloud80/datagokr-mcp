summary_user: 마약류 취급 승인을 받은 기관이 취급을 끝냈다고 보고한 내역을 담는다. 기관 한 곳당 한 건이며, 각 건에는 취급승인번호, 자료구분, 업소명, 취급종료일자(TRMT_END_YMD)가 들어 있고 범위는 전국이다. 규제 담당자나 분석가가 특정 업소의 마약류 취급 권한이 언제 끝났는지 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명을 맞춰 보거나 같은 식약처 데이터의 취급승인번호로만 잇는다.
description_portal: 식품의약품안전처에서 제공하는 마약류 취급완료보고 정보 데이터는 마약류 취급 승인이 완료된 기관들의 관련 정보를 조회할 수 있도록 구성된 공공데이터입니다. 제공되는 주요 항목으로는 취급승인번호, 자료구분, 업소명, 대표자명, 취급종료일자 등이 포함되어 있으며, 이를 통해 어떤 기관이 언제까지 마약류 취급 권한을 가지고 있었는지를 명확히 확인할 수 있습니다. 이 데이터는 마약류 취급 이력 관리, 규제 준수 여부 모니터링, 행정 행태 분석, 보고 이력 기준 현황 파악 등의 목적으로 활용될 수 있습니다.
