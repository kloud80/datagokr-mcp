summary_user: 서울 강북구에서 의료업을 목적으로 설립된 의료법인의 인허가 정보를 법인(사업장)별로 담으며, 인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM(EPSG:5174) 좌표 등 LOCALDATA 공통 인허가 항목을 포함한다. 분석가나 사업자가 '강북구에서 운영 중이거나 폐업한 의료법인은 어디이고 언제 인허가·폐업했는가'를 확인하거나 병의원 개폐업을 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 연결한다.
description_portal: '서울특별시 강북구 의료법인 인허가 정보: 강북구의 의료업을 목적으로 설립된 법인 정보입니다. 의료 기관의 개설이나 경영, 의학에 관한 연구나 조사, 의료 관계자의 양성 따위의 사업을 할 수 있는 법인을 말합니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
