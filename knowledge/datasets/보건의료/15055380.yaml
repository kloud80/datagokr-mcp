summary_user: 서울특별시 강북구 관내 의료기기판매업소를 업소 한 곳당 한 행으로 담은 파일이며, 영업소명·도로명 소재지·전화번호·데이터기준일로 구성된다(CSV 약 39KB). 주민이나 사업자가 '강북구 안에서 의료기기를 파는 업소가 어디에 있고 연락처가 무엇인가'를 확인하거나, 분석가가 동네별 의료기기 판매업소 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 의료기기"란?사람이나 동물에게 단독 또는 조합하여 사용되는 기구ㆍ기계ㆍ장치ㆍ재료ㆍ소프트웨어 또는 이와 유사한 제품으로서 다음 각 호의 어느 하나에 해당하는 제품을 말하며,다만, 「약사법」에 따른 의약품과 의약외품 및 「장애인복지법」 제65조에 따른 장애인보조기구 중 의지(義肢)ㆍ보조기(補助器)는 제외됩니다. 의료기기는 「의료기기에 관한 법률」에 따라 엄격하게 관리되고 규제되는 업종입니다.서울특별시 강북구 관내 의료기기판매업소현황에 관련한 데이터는 연번, 영업소명 자료, 영업소소재지(도로명)자료, 영업소전화번호 자료, 데이터기준일로 구성되어 있습니다
