description_portal: '국민건강보험공단_특정 약제주성분코드 그룹 및 주상병별 진료인원1. 약제주성분코드 : 첨부파일 중 데이터 설명 파일(hwpx)확인2. 주상병코드 및 주상병명 : 첨부파일 중 해당 데이터 파일(csv) 확인 - 요양기관에서 환자 진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라 일차진단명을 부여하고 청구한 내역 중    주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음3. 진료년도: 2020~2022년4. 진료월: 전체 값은 중복을 제외한 인원으로 월별 단순 합계와 차이가 있음5. 진료인원: 해당 구분별 진료인원(중복제외)  - 진료일 기준(한의분류 제외, 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2023년 6월 심사분까지 반영※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
