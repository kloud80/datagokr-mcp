description_portal: 강원특별자치도 내 시군별 공중위생업소 및 위생용품 제조·처리업체의 전반적인 운영 및 등록 현황에 대한 통계 정보를 제공합니다. 주요 제공 항목으로는 도내 시군 행정구역 분류를 시작으로, 공중위생관리법에 따른 숙박업(일반·생활), 목욕장업, 이용업, 미용업(일반·피부·네일·종합 등), 세탁업, 건물위생관리업의 세부 업종별 개소수 현황이 수록되어 있습니다. 이와 함께 공공 보건 및 생활 위생과 직결되는 위생물수건처리업 및 위생용품제조업의 지역별 업체 수 통계를 종합적으로 포함하고 있는 것이 특징입니다.
