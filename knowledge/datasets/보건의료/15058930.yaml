summary_user: 의료기기 제조·수입업체의 GMP(제조 및 품질관리 기준) 적합인정 심사 건을 업소·품목군 단위로 담은 건별 원천 데이터로, 업소명·주소·사업자등록번호, 적용 기준, 진행 상태, 적합인정번호·인정일자·유효기간, 품목군·품목명, 제조자·제조국을 포함하며 전국 138,556건이다. 의료기기 구매 담당자나 규제 분석가가 특정 업체가 해당 품목군에 대해 GMP 적합인정을 받았는지, 인정이 언제까지 유효한지 확인하는 데 쓴다. 사업자등록번호(BRNO)로 사업자 정보나 의료기기 품목허가 데이터와 잇고, 업소·제조자 주소로 지역을 붙이며, 제조자국가코드(ISO 3166 2자리)로 수입 제조국별 집계를 한다.
description_portal: 해당 공공데이터는 의료기기 제조·수입업체의 GMP(제조 및 품질관리 기준) 지정 현황을 통합 제공하여, 유효한 GMP 적합인증 보유 업체 현황 모니터링 및 품질관리 강화를 목적으로 수집되었습니다.- 업체명·제조자·대표자·주소·전화번호 등 기본정보와 적용 기준, 심사 상태, 적합인정 번호 및 인증 유효 기간, 허가 일자 등의 세부 항목을 포함합니다.- 이를 통해 제조·수입안정성 및 규제 준수 현황을 투명하게 공개하며, GMP 적합인정 보유 업체 수 및 결과 분석, 제조·수입업체 판매 업무의 적정성 여부 평가 등 다양한 활용 기대효과가 있습니다.
