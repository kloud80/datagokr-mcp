description_portal: '지역별 요양비(인공호흡기 기침유발기) 지급 현황은  대한민국 국민건강보험공단에서 제공하는 공공데이터 중 하나로, 2개 품목에 대한 요양비 정보를 포함한 데이터입니다.이 데이터는 연도별, 지역별, 요양비를 지급한 금액에 대한 정보를 제공하여, 의료 서비스의 이용 현황을 파악하는 데 유용합니다.1. 품목: 「국민건강보험법」제49조(요양비)에 따른 인공호흡기 및 기침유발기2. 연도: 2020~2024년3. 발췌 기준: 지급, 재지급, 환입, 환수 포함  ※ 홈페이지 경영공시 발췌 기준과 동일 ① 연도구분: 요양비 지급일자 기준 ② 지역구분: 수진자 주민등록주소지 기준 17개 시도단위 ③ 건수: 청구에 대한 지급건수 ④ 금액: 공단부담금 총액※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
