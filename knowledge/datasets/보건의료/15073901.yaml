summary_user: 식약처가 공고한 의료기기 동등제품 정보를 품목 건별로 담으며, 동등공고번호·공고품목명·공고일자, 동등제품 허가번호, 동일성제품 여부, 의료기기 품목허가번호·품목명·허가일자, 취소·취하 여부 같은 항목을 포함한다. 의료기기 제조·수입업체나 인허가 담당자가 "새로 허가받으려는 제품과 동등하다고 공고된 기존 허가 제품은 무엇이고 지금도 유효한가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 식약처 의료기기 품목허가 데이터와는 품목허가번호·품목명 같은 이름·번호 매칭으로만 잇는다.
limits: 다른 데이터와 공통으로 쓰는 표준 조인 키가 없어 연계 때 허가번호나 품목명 문자열 매칭에 의존해야 한다. 전국 단위의 비공간 데이터이므로 지역별 분석에는 맞지 않는다. 개발계정은 하루 10,000회 호출 제한이 있다.
