summary_user: 2023년 건강보험 당뇨병 등록환자 수, 요양비 수급자 수, 당뇨병소모성재료 등 유형별 요양비 지급현황을 환자유형·월·17개 시도별로 집계한 xlsx 파일(시트 3개)입니다. 시도별로 당뇨병 등록환자와 소모성재료 요양비 수급자가 월별로 어떻게 다른지 보려는 분석가나 지자체 보건 담당자가 쓴다. 전역 조인 키는 없어서 시도명(열 이름)과 연도·월을 기준으로 다른 시도별 진료·인구 통계와 이름을 맞춰 붙인다.
limits: 건별 원천이 아니라 시도×월 단위 집계여서 시군구나 개인 단위 분석에는 쓰지 못한다. 공단(자격 기준) 수치이므로 심평원(청구 기준) 통계와 값이 다를 수 있다. 시도가 열로 펼쳐진 형태이고 공통 코드가 없어서 다른 데이터와 붙일 때는 시도명을 직접 매핑해야 한다.
