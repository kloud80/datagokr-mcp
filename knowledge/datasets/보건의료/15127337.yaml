description_portal: 경상남도 창원시의 치매프로그램 운영현황입니다. 항목은 사업명, 대상, 사업내용, 관리기관 전화번호, 관리기관명, 데이터 기준일자 입니다.창원시  총인구는 감소하고 있으나 65세 이상 노인 인구의 증가 및 고령화로 치매 관리가 필요성이 증가 됨에 따라 창원치매안심센터에서 운영 중인 사업명, 대상, 사업내용, 관리기관 전화번호를 안내하고 있습니다. 지역주민 대상 치매조기검진사업, 치매안심센터에 등록된  인지저하자 및 경도인지장애 진단자로 치매고위험군 대상으로  인지강화교실을 운영하며 인지선별검사상 정상군 대상으로 치매예방교실 운영, 연령, 진단, 치료, 소득기준을 모두 충족하는 치매치료약을 복용중인 대상으로 치료관리비를 지원하고 있습니다. 재가 치매환자 대상으로 조호물품을 지원하고 있습니다.
