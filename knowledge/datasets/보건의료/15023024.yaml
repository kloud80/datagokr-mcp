description_portal: 안마원이란 의료법 제82조에 따라 자격인정을 받은 안마사가 안마, 마사지, 지압 등 각종 수기요법이나 전기기구의 사용, 그 밖의 자극요법으로 인체에 물리적 시술행위를 행하는 곳을 의미한다.  안마원은 안마사에 관한 규칙에 따라 규정된 시설 기준 및  개설자 준수사항을 지키는 곳을 정식 안마원으로 인정한다.현자료는 부산광역시 남구 소재지에 신고된 안마원 현황으로 명칭, 주소, 전화번호 정보를 포함하고 있으며, 신고하지 아니하고 안마 등 인체에 물리적 시술을 행하는 경우 위법행위로 분류한다.
