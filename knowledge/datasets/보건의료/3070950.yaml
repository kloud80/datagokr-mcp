summary_user: 강원특별자치도 속초시 관내 약국을 한 곳씩 약국명, 도로명 소재지, 전화번호로 정리한 소규모 파일(csv 약 3KB)이다. 속초 시민이나 방문객이 근처에서 이용할 약국과 연락처를 찾거나, 분석가가 시내 약국 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 약국명이나 도로명 주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 본 데이터는 강원특별자치도 속초시 관내 약국 현황 정보를 제공하는 자료이다. 시민과 방문객이 의약품 구매 및 약국 이용에 필요한 정보를 쉽고 편리하게 확인할 수 있도록 약국명, 소재지, 연락처 등 관련 정보를 정리하여 개방한다. 지역 보건의료 서비스 접근성 향상과 시민 편의 증진을 목적으로 구축된 자료이며, 의약품 구매 및 약국 이용 시 참고자료로 활용할 수 있다. 또한 지역 내 약국 분포와 운영 현황을 파악하고 공공보건 정보 접근성을 높이고자 한다. 데이터는 속초시 관내 약국 등록 현황을 기준으로 관리하며 관련 변동 사항을 반영하여 현행화한다. 이용자는 해당 정보를 통해 지역 내 약국 운영 현황과 위치 정보를 확인할 수 있다. 요청이 있을 시 제공되는 수시(1회성) 데이터입니다.
