description_portal: '공개되는 가상 모델 데이터는 전자파 인체 영향 연구를 위한 “복합 전파 환경에서의 국민건강 보호 기반 구축” 사업 수행 결과 중 일부로, 전자파 노출에 대한 가상 시뮬레이션 이외에도 의료 기술 분야에 활용 가능한 범용적 데이터입니다. 구현방법: MRI 영상 및/또는 해부 영상 기반으로 조직 구역화하여 인체 전신을 3차원 모델로 구현.  적용포맷: MS excel 뿐만 아니라 다양한 계산 SW에서 읽을 수 있는 CSV 포맷과, Maya, 3ds Max와 같은 3D 모델링 SW에서 용이하게 입력 및 편집이 가능한 STL 포맷 모두 제공되므로 사용자 tool에 맞게 변형 가능.세부내용:  CSV 폴더(VK-female 폴더, VK-male 폴더), STL 폴더(VK-female 폴더, VK-male 폴더), docx 파일(etri.re.kr-인체 및 원숭이 모델, etri.re.kr-human and monkey models)'
