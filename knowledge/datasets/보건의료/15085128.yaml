description_portal: '○ 통계개요* 통계명 : 구강보건사업* 통계종류 : 서울시 구강보건사업 실시 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「구강보건법」에 근거하여 실시되는 구강보건사업* 작성목적 : 대상이 되는 개인 또는 집단의 특성ㆍ건강수준 등에 따라 적절한 보건사업을실시하고, 모든 국민이 건강생활을 실천할 수 있도록 보건복지정책 수립의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 보건소 → 자치구 → 서울특별시 건강증진과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 구강(홈메우기, 의치·보철, 불소용액 양치 등) 관련 보건사업의사업별 대상자 및 수혜자 수 현황○ 용어설명* 구강보건사업 : 구강질환의 예방ㆍ진단, 구강건강에 관한 교육ㆍ관리 등을 행함으로써구강 건강을 유지ㆍ증진시키는 사업을 말함'
