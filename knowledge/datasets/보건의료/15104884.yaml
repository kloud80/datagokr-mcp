summary_user: 전북 군산시에 있는 요양병원을 기관 한 곳당 한 줄로 정리한 목록 파일로, 종별·기관명·도로명주소·전화번호·병실수·병상수를 담으며 파일 크기는 1,267바이트로 작다. 군산에 사는 가족이 부모를 모실 요양병원을 찾을 때 어느 병원이 어디에 있고 병상이 몇 개인지 확인하는 데 쓰고, 분석가는 시 단위 요양 병상 규모를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명주소를 맞춰 붙여야 하며, LOCALDATA 병원 인허가 자료와도 이 방식으로만 연결된다.
limits: 군산시 한 곳의 요양병원만 담아 다른 시군과 비교하려면 별도 자료가 필요하다. 기관 코드 같은 공통 키가 없어서 기관명·주소 매칭으로 연결하면 오매칭이 생길 수 있다.
