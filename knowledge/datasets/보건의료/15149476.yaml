description_portal: '□ 개요 전문요양실 시범사업은 노인요양시설 내 의료 및 간호처치 욕구가 있는 수급자에게 의료의  연계를 통한 체계적인 간호서비스 제공으로 요양과 건강관리를 통합 제공하는 제도입니다. - (이용대상) 전문요양실 입실기준에 해당하는 수급자(1~4등급자) - (참여기관) 정원 50인 이상의 노인요양시설 - (제공서비스) 전문요양실 서비스 범위 내 간호관리* 및 교육․상담․건강증진 활동 등 상시 건강관리 서비스를 제공   * 영양관리, 배설관리, 호흡관리, 상처관리 등본 데이터는 국민건강보험공단에서 제공하는 전문요양실 시범사업 월별입퇴소 내역입니다. □ 주요 내용- 대상년월: 2025년 7월- 총인원수: 대상년월기간 동안의 전문요양실 입실 총인원수 - 평균입소자인원수: 월평균 전문요양실 입실 인원수   ※ 발췌일자 기준 장기요양 전문요양실 시범사업에 참여중인 기관 기준으로 집계'
