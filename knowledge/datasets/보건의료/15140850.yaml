summary_user: 서울 광진구에서 안전상비의약품 판매 인허가를 받은 편의점·마트 등 업소를 한 곳씩 담은 건별 인허가 원천 데이터로, 업소명·지번/도로명 주소·인허가일·폐업일·영업상태·중부원점TM 좌표를 포함한다. 주민이나 분석가가 '우리 동네에서 심야에 해열제·감기약을 살 수 있는 영업 중인 편의점은 어디인가'를 찾거나 구 내 판매업소 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE)로만 이어 쓰며, 식약처 의약품 표준코드 같은 품목 정보와 직접 연결되지 않는다.
description_portal: '이 데이터는 서울특별시 광진구 내에서 안전상비의약품을 판매할 수 있도록 인허가를 받은 업소의 정보를 담고 있습니다. 안전상비의약품이란 의사의 처방 없이도 일반인이 사용할 수 있도록 보건복지부 장관이 지정한 의약품으로, 해열진통제, 감기약, 소화제, 파스류 등이 포함됩니다. 주로 편의점, 마트 등 일상생활에서 접근 가능한 장소에서 판매되며, 응급 상황이나 심야 시간대에도 의약품을 구입할 수 있는 환경을 조성하는 데 기여합니다. 본 데이터는 각 업소의 명칭, 소재지, 영업상태 등의 정보를 포함하고 있으며, 공공 보건정책 및 시민 건강안전망 구축을 위한 기초자료로 활용됩니다.※ 좌표 안내: 중부원점TM(EPSG:2097) 좌표계 기준 위치 정보를 포함하며, 위경도 좌표는 제공되지 않습니다.※ 본 데이터는 3일 전 기준으로 제공됩니다'
