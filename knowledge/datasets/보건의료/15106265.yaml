summary_user: 건강보험 급여실적 중 특정 암·심혈관·뇌혈관 질병코드와 지정 행위코드(상급종합병원 20개, 상급종합병원+종합병원 86개)에 대해 진료년도·성별·연령별 환자수와 진료건수를 담은 전국 단위 집계 파일이다. 특정 수가코드 진료가 연령·성별로 몇 명, 몇 건 이루어졌는지 보려는 분석가나 의료 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 수가코드(구분)나 질병코드 이름·코드를 매핑해서만 이어 쓴다.
limits: 요양기관·지역별 구분이 없는 전국 집계라 기관·지역 단위 분석에는 쓰지 못한다. 조인 키가 없어 EDI 행위코드나 KCD 마스터와는 코드·이름을 직접 매핑해야 한다. 포털 설명에 따르면 주진단명 기준이라 확정 질병과 다를 수 있고, 5명 미만은 '*'로 비식별 처리되어 있다.
