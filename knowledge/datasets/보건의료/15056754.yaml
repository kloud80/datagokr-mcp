summary_user: 경기도 안에서 안전상비의약품을 파는 업소(주로 편의점)를 한 행에 한 곳씩 담은 인허가 현황으로, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·전화번호·WGS84 위경도 좌표를 담는다. 주민이나 지자체 보건 담당자가 '밤에 약국이 문을 닫았을 때 우리 동네에서 해열제를 살 수 있는 영업 중인 편의점이 어디 있나'를 찾거나, 시군별 약국 외 의약품 접근성을 지도로 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 이름 매칭이나 공간 결합을 해서 이어 쓴다.
description_portal: 경기도 내 안전 상비의약품 판매업소 인허가 현황입니다. 안전 상비의약품 판매업소는 편의점 등 안전상비의약품으로 지정된 의약품을 판매하는 업소(체)입니다.이 데이터는 경기도 내 안전상비의약품을 판매하는 업소(주로 편의점 등)의 현황을 정리한 자료입니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태, 도로명 및 지번주소, 전화번호, 위도·경도 좌표(WGS84), 도로명우편번호, X/Y좌표값 등이 포함되며, 각 업소의 위치 및 운영 상태를 파악할 수 있습니다. ‘안전상비의약품’이란 처방전 없이 구매 가능한 의약품으로, 타이레놀, 소화제, 해열제 등 경증 증상에 사용되는 약물이며, 주로 편의점 등에서 판매됩니다. 본 데이터는 지역별 의약품 접근성 평가, 약국 외 판매채널 분석, 응급의약품 공급체계 보완, 보건의료 사각지대 해소 전략 수립 등에 활용될 수 있습니다. 위치정보는 GIS 기반의 시각화와 네트워크 분석에 유용하며, 데이터는 식품의약품안전처 및 지자체 보건부서에서 수집한 공공보건정보입니다.
