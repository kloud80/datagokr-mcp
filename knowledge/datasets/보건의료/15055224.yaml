summary_user: 전북특별자치도 순창군 안의 의약품 판매업소를 업소 한 곳당 한 행으로 구분(영업종별), 업소명, 전화번호, 소재지 주소를 담은 소규모 파일(약 2KB csv)이다. 순창군 주민이나 분석가가 '우리 동네에서 의약품을 파는 업소는 어디이고 연락처는 무엇인가', '군내 의약품 판매업소가 종별로 어떻게 분포하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(순창군) 자료끼리로만 이어 쓴다.
limits: 업소 식별 코드나 식약처·심평원 코드가 없어 의약품 품목·약가 정보와 직접 연결되지 않는다. 범위가 순창군 한 시군구에 한정되며, 포털 설명상 미집계로 인한 공란이 있을 수 있다.
