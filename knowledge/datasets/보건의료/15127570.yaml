summary_user: 2024년 3월 31일 기준 일차의료 만성질환관리 시범사업에 참여 중인 환자등록의원을 의원 한 곳당 한 행으로 담은 전국 목록으로, 요양기관명·우편번호·주소·전화번호만 들어 있다. 고혈압·당뇨 등 만성질환을 동네 의원에서 관리받으려는 환자가 "우리 동네에 시범사업 참여 의원이 어디 있나"를 찾거나, 분석가가 지역별 참여 의원 분포를 파악하는 데 쓴다. 요양기관기호(ykiho) 같은 공통 조인 키가 없어 심평원 요양기관 정보와는 기관명·주소를 맞춰 대조하는 방식으로만 연결된다.
description_portal: '□ 데이터 개요본 데이터는 2024년 3월 31일 기준으로 일차의료 만성질환관리 시범사업에 참여 중인 환자등록의원 정보를 제공합니다.□ 주요 내용대상: 2024년 3월 31일 기준 일차의료 만성질환관리 시범사업에 참여하는 환자등록의원제공 정보:  - 요양기관명  - 주소  - 전화번호□ 활용 안내본 데이터는 시범사업 참여 의료기관 현황을 파악하는 데 활용되며, 관련 정책 수립 및 사업 평가에 참고할 수 있습니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
