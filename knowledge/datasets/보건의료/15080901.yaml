summary_user: 전국 6개 보훈병원(중앙·부산·광주·대구·대전·인천)의 비급여 진료항목별 수가를 항목 코드·명칭, 분류(대·중·소), 가격과 최저·최고 가격, 약제·치료재료 포함 여부 단위로 담는 API입니다. 보훈대상자나 환자가 보훈병원에서 특정 비급여 검사·처치를 받을 때 비용이 얼마인지, 병원별로 가격 차이가 있는지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키를 찾지 못해, 다른 병원 비급여 가격 자료와는 항목 명칭·코드를 맞춰 보거나 병원 코드(h_code)로 같은 기관 데이터끼리만 연결한다.
