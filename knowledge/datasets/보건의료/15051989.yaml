summary_user: 부산광역시 강서구 안에 있는 약국을 한 곳씩 담은 목록 파일로, 약국명칭·전화번호·도로명 소재지를 담는다(약 4KB 규모의 CSV). 주민이 "우리 동네 가까운 약국이 어디고 전화번호가 뭔가"를 확인하거나, 분석가가 강서구 안 약국 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키(인허가번호·기관코드 등)가 없어서, 다른 데이터와는 약국명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
