summary_user: 「의료기기법」에 따라 식품의약품안전처가 승인한 의료기기 임상시험계획을 승인 건별로 담은 전국 단위 목록으로, 승인번호·승인일자·제품명·제조수입업소명·신청업소명·임상시험 구분 등을 제공한다. 연구자나 환자가 특정 의료기기나 업체의 임상시험이 언제 승인됐는지, 어떤 구분의 임상시험인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 식약처 의료기기 데이터와는 업소명·제품명 매핑이나 같은 기관 코드(의료기기 분류번호, 사업자등록번호 등)로만 이어 쓴다.
description_portal: 이 공공데이터는 식품의약품안전처에서 제공하는 의료기기 임상시험계획승인신청 목록을 확인할 수 있는 공공데이터로「의료기기법」 제10조(임상시험계획의 승인 등)에 따라 식품의약품안전처에게 의료기기 임상시험계획 승인을 받은 내용 중 일부가 공개되고 있습니다. 연구자와 환자의 임상정보 활용도 및 편의성 제고를 위하여 식품의약품안전처에서 공개 중인 의료기기 임상시험 승인정보를 목록으로 제공하고 있습니다. 제공되는 정보는 임상시험 승인번호, 승인일자, 제목, 업소명 등 입니다.
