summary_user: 의약품 제조소별 GMP(제조 및 품질관리기준) 적합판정서 발급 현황을 건별로 담으며, 업체명·공장소재지·완제/원료 구분·제형군 또는 제조방법 분류·유효기간을 전국 범위로 제공한다. 제약사나 연구자가 '이 제조소가 해당 제형에 대해 GMP 적합 판정을 받았고 유효기간이 아직 남았는가'를 확인하거나 위탁생산 후보 업체를 추리는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 업체명·주소 매핑으로 다른 식약처 의약품 허가 데이터와 잇고, 사업자등록번호(BIZRNO) 필드가 있으면 사업자 단위 대조에 쓸 수 있다.
limits: 품목기준코드·의약품 표준코드 같은 공통 키가 없어 심평원 약가·급여 목록이나 품목허가 데이터와 바로 조인되지 않으며 이름·주소 매칭에 기대야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
