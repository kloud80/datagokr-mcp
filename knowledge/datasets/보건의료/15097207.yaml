description_portal: 식품의약품안전처 「의약품GMP적합판정서발급현황」 OpenAPI는 의약품 제조소의 GMP(제조 및 품질관리기준) 적합 판정 발급 현황을 제공하는 공공데이터입니다. 제공 항목에는 업체명, 공장소재지, 완제 또는 원료 구분, 제형군/제조방법 분류, 유효기간 등이 포함되어 있습니다. 이 데이터를 통해 제약사와 연구자는 GMP 적합 판정을 받은 제조소 정보를 참고해 위탁생산 가능 업체를 검토하거나, 해당 제조소가 기본적인 품질관리 기준을 충족했는지를 확인하는 자료로 활용할 수 있습니다.
