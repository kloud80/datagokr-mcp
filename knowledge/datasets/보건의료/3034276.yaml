description_portal: 건강보험 22대 질병분류별 급여현황에 대한 데이터로 진료실인원, 내원일수, 급여일수, 진료비, 급여비에 대한 통계를 제공합니다.1. 건강보험 재정은 결산 기준이며, 진료현황 및 질병통계는 환자가 요양기관에서 진료 받은 진료일 기준임2. 건강보험 진료현황은 가입자 주민등록지 기준이고, 심사실적은 요양기관 소재지 기준임3. 질병통계는 가입자가 해당질병이 의심되어 진료 받은 1차 진단명을 요양기관이 청구한 내역으로 청구한 내역의 주상병 기준으로 최종 확정된 질병과는 차이가 있을 수 있음4. 청구건수는 요양기관에서 환자에게 진료(투약)한 후 건강보험 요양급여비용 청구방법에 의거 작성한 요양급여비용 명세서 건수임5. 보험급여비는 피보험대상자의 진료에 소요된 총 진료비 중 공단이 부담한 금액이며 결산 기준, 지급 기준, 심사 결정 기준으로 구분하여 수록함6. 통계표 중 전년도 연보와 일치하지 않는 것은 금년 호에서 정정된 것임7. 계수가 단위 미만수는 반올림을 하였으므로 내용과 총수가 일치되지 않는 경우가 있음
