summary_user: 경기도 소재 의료기관의 중환자실 평가 결과를 기관·평가항목 단위로 담으며, 시군명·시군코드, 기관명, 평가항목, 등급(1~5등급, 숫자가 작을수록 우수, 등급제외 포함)과 도로명·지번 주소, WGS84 좌표를 함께 제공한다. 보호자나 환자가 '우리 시군에서 중환자실 평가 등급이 높은 병원은 어디인가'를 확인하거나, 분석가가 시군별 중환자실 치료 수준을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기관명·주소 매칭이나 시군코드(SIGUN_CD) 같은 행정구역 코드로만 이어 쓰며, 좌표를 이용한 지도·GIS 결합이 현실적인 연계 방법이다.
description_portal: 병원평가정보(중환자실) 현황은 건강보험심사평가원이 제공하는 개방 API로, 경기도 소재 의료기관의 중환자실 구조‧진료 역량을 종합한 평가 데이터를 담고 있습니다. 행정구역 식별(SIGUN_NM, SIGUN_CD), 기관명(INST_NM), 평가항목(DIV_NM)과 핵심 지표인 GRAD를 포함하며, 등급은 1‧2‧3‧4‧5등급(숫자가 작을수록 우수) 및 등급제외로 구분됩니다. 또한 응답 메타필드 LIST_TOTAL_COUNT, CODE, MESSAGE, API_VERSION이 함께 반환되어 호출 결과 확인이 가능합니다. 위치 정보는 도로명·지번 주소(REFINE_ROADNM_ADDR, REFINE_LOTNO_ADDR), 우편번호(REFINE_ZIP_CD), 그리고 세계 표준 지리좌표계인 WGS84 위도·경도(REFINE_WGS84_LAT, REFINE_WGS84_LOGT)로 제공되어 GIS 분석과 내비게이션 연계가 용이합니다. 본 데이터는 지역별 중환자실 치료 수준 비교, 응급 의료 자원 배치, 병원 선택 지원 지도 서비스, 보건정책 수립 등 다양한 활용 가능성이 있으며, 등급 해석 시 “값이 낮을수록 의료 질이 높다”는 점을 반드시 유의해야 합니다.
