summary_user: 국내에서 제조되거나 해외에서 수입된 의약품의 최근 연도 실적을 생산금액(백만원)·수입금액(달러)·생산·수입연도 항목으로 담은 전국 단위 비공간 데이터입니다. 제약사·유통업체·연구기관이 '최근 연도에 국내 의약품 생산과 수입 규모가 얼마였나'를 확인하고 시장 규모·수급 동향을 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품목명 등 이름 매핑이나 같은 식약처 코드로만 이어 쓰며, 심평원 약가·급여 목록과 잇는 데 필요한 품목기준코드·표준코드 포함 여부는 확인되지 않았다.
limits: 전역 조인 키가 없어 허가정보·약가 데이터와 바로 결합하기 어렵고 이름 매핑에 의존해야 한다. 생산금액은 백만원, 수입금액은 달러로 단위가 달라 그대로 합산·비교하면 안 된다. 개발계정은 일 10,000회 호출로 제한된다.
