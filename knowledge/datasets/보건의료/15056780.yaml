description_portal: 식품의약품안전처 「의약품안전사용서비스(DUR) 성분정보」 OpenAPI는 의약품의 구성 성분별로 안전사용 관련 정보를 제공합니다. 주요 제공 항목은 DUR번호, DUR유형, 단일/복합, DUR성분코드, DUR성분(영문), DUR성분, 복합제, 관계성분, 제형, 고시일자, 금기내용 등을 포함하고 있습니다.이 데이터를 통해 의료진과 약사는 DUR 성분정보를 통해 환자 상태에 맞는 처방·조제를 지원할 수 있으며, 환자는 불필요한 부작용이나 약물 상호작용 위험을 줄이는 데 도움을 받을 수 있습니다
