legal_basis_portal: 의료기기법 제17조, 의료기기법 시행규칙 제37조* 의료기기법 제17조(판매업 등의 신고) ① 의료기기의 판매를 업으로 하려는 자(이하 “판매업자”라 한다) 또는 임대를 업으로 하려는 자(이하 “임대업자”라 한다)는 영업소마다 총리령으로 정하는 바에 따라 영업소 소재지의 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)에게 판매업신고 또는 임대업신고를 하여야 한다.* 의료기기법 시행규칙 제37조(판매업 또는 임대업의 신고 등) ① 법 제17조제1항에 따라 의료기기의 판매나 임대를 업으로 하려는 자는 별지 제36호서식의 신고서(전자문서로 된 신고서를 포함한다)를 판매업소 또는 임대업소를 관할하는 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 제출하여야 한다. 이 경우 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서(법인인 경우만 해당한다)를 확인하여야 한다.
