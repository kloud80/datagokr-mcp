summary_user: 부산광역시 금정구 관내에 의료기기 판매업 또는 임대업으로 신고된 업소를 한 행에 한 곳씩 담은 건별 목록으로, 순번·영업소명·도로명 소재지만 들어 있다(CSV 약 42KB). 금정구 주민이나 사업자가 동네에서 혈압계·보호대 같은 의료기기를 사거나 빌릴 수 있는 업소가 어디 있는지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 자료는 관내에서 「의료기기법」 제17조에 따라 의료기기를 판매하거나 임대하는 업소의 현황을 정리한 것으로, 업소별 순번, 영업소명, 소재지 정보를 포함하고 있습니다.「의료기기법」 제2조에 따르면, 의료기기란 사람 또는 동물의 질병 진단·치료·완화·처치 또는 예방을 목적으로 사용되는 기기·기구·장치 및 재료 등을 말하며, 사람의 구조나 기능에 영향을 주기 위해 사용되는 제품도 포함됩니다. 본 자료에 포함된 의료기기에는 체온계, 목 보호대, 주사기, 저주파자극기, 혈압계 등 다양한 일반·전문 의료기기가 포함됩니다.이 데이터는 관할 지자체에 의료기기 판매업 또는 임대업으로 신고된 업소를 대상으로 수집된 것으로, 신고 요건은 「의료기기법 시행규칙」 제37조에 따라 별도로 규정되어 있으며, 해당 시설 요건  등의 요건을 갖춰야 합니다.보다 자세한 분류기준이나 항목 해석은 지침 또는 「의료기기법」을 참고해 주시기 바랍니다.
