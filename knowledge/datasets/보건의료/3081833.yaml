summary_user: 부산광역시 남구 관할 의약품 도매업소를 업소 한 곳당 한 행으로 담은 소규모 목록(CSV 약 1.7KB)이며, 영업소명·도로명 소재지·전화번호를 담는다. 남구에서 의약품을 공급받을 도매상을 찾는 약국·의료기관 운영자나, 관내 도매업소가 어디에 몰려 있는지 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명이나 도로명 주소를 맞춰 붙여야 하며, 식약처 품목코드나 심평원 약가 데이터와 직접 이어지지 않는다.
description_portal: 부산광역시 남구 관할  의약품 도매업소 현황(영업소명, 전화번호, 소재지) 을 제공하기 위해 2026.06.17.자 기준으로 업데이트 한 내용입니다.의약품 도매상은 약사법  제44조(의약품 판매) 제2항에 의거하여 의약품을 판매하거나 판매할 목적으로 의약품을 취득할 수 있다.의약품도매상이 되려는 자는 보건복지부령이 정하는 바에 따라 영업소와 창고 및 그 밖에 대통령령으로 정하는 기준에 맞는 시설을 갖추어 시장ㆍ군수ㆍ구청장의 허가를 받아야 한다.또한 허가를 받은 의약품 도매상은 약사를 두고 업무를 관리하게 하여야 한다. 다만  다른 의약품 도매상에 의약품의 보관ㆍ배송 등 유통관리 업무를 위탁하는 경우에는 업무관리자를 두지 아니할 수 있으며, 해당 유통관리 업무를 위탁받는 자는 보건복지부령으로 정하는 바에 따라 제5항에 따른 업무관리자를 두어야 한다.
