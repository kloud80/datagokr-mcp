summary_user: 강북구 안의 헤어·메이크업·네일 등 미용업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 영업 중인 곳과 폐업한 곳이 함께 들어 있다. 상권 분석가나 창업 예정자가 "강북구에서 최근 문을 열거나 닫은 미용실이 어느 동네에 몰려 있나"를 인허가일자(APVPERMYMD)·폐업일자(DCBYMD)·영업상태와 주소로 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하고, 같은 형식의 다른 구 인허가 데이터와 이어 붙여 비교한다.
description_portal: '서울특별시 강북구 미용업 인허가 정보 데이터는 강북구의 헤어, 메이크업, 네일아트와 같이 얼굴, 머리, 피부 등을 손질하여 외모를 아름답게 꾸미는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
