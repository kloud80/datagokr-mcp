description_portal: "1. 자료 개요: 국민건강보험공단, 한국사회보장정보원, 행정안전부, 통계청, 건강보험심사평가원을 통하여 희귀질환 산정특례 등록자 정보, 주소정보, 사망정보, 진료정보를 지속적, 체계적으로 수집, 분석 및 정리하여 그 결과를 국민에게 제공하고 희귀질환 관리 정책 수립의 근거 자료로 활용하고자 본 연보를 작성하였습니다. 2. 주요내용:  질병관리청 공고 국가관리대상 희귀질환을 기준으로 희귀질환자 발생, 사망, 진료이용 통계를 제공하고 있습니다. 그 중에서 질병분류코드 I27.0 원발성 폐동맥고혈압의 '19~'20년도 성별,  연령별(1세미만, 1~4세,  5~9세, 10~14세, 15~19세, 20~24세, 25~29세, 30~34세, 35~39세, 40~44세, 45~49세,50~54세,  55~59세, 60~64세,  65~69세, 70~74세, 75~79세, 80세이상, 알수없음) 발생자 수 자료를 제공해드립니다. 3. 유의사항:  희귀질환자수는 개인 특정이 될 우려가 있어 개인정보보호를 위해 3명이하의  데이터는 \"*\"로 표시하고 있습니다.추가 관련 자료는 질병관리청 희귀질환 헬프라인에서 확인 가능합니다."
