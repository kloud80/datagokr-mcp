description_portal: 본 데이터는 한국보건산업진흥원이 수집한 외국인환자 유치를 위한 국내 의료기관의 연도별·지역별 현황을 정리한 통계자료이다. 광역시도별 연도별로 외국인환자 유치읠 기관에 대한 통계자료를 제공하고 있다. 본 자료는 광역시도 지역에서 의료관광 전략 수립, 유치전략 수립, 의료기관 지원 등 다양한 분야에서 활용된다. 데이터는 연도, 광역시도 지역 기준으로 분류되며, 지방자치단체, 연구기관, 산업계 등에서 정책 수립과 의료자원 배분의 기초자료로 사용된다. 해당 자료는 비정기적으로 갱신되며, 유치기관에 대한 통계 자료가 취합되어 완성될 시 제공된다. 외국인환자 유치역량 평가와 보건의료산업 기반 확충을 위한 실증 기반 자료로 제공된다.
