description_portal: '인천광역시 중구  금연구역 현황 및 실내외 흡연실 현황에 대한 내용입니다.금연시설, 금연구역, 실내흡연실여부, 실회흡연실여부 등의 정보를 포함하고 있습니다.공공기관과 민간시설은 간접흡연 피해를 최소화하기 위해 건물 외부 또는 환기·차단 설비가 갖춰진 별도의 흡연실을 설치·운영하고 있습니다.실내 흡연실은 내부 공간 보호와 편의를 위해, 실외 흡연실은 공공 환경 보호와 접근성을 위해 각각 설계·운영됩니다.관련 법령: 건강증진법, 인천광역시 중구 금연환경 조성 및 간접흡연피해 방지에 관한 조례담당부서: 보건소 건강증진과(032-760-6062)'
