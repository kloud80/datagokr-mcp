summary_user: 경상북도 영주시에서 금연치료를 제공하는 의료기관을 기관별로 한 건씩 담은 목록으로, 등록번호·의료기관명·주소·전화번호를 담는다. 영주시 주민이 가까운 금연치료 병원을 찾아 전화로 예약하거나, 보건소·분석가가 시 안에서 금연치료 기관이 어느 지역에 몰려 있고 어디가 비어 있는지 살피는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 의료기관명이나 주소(INST_ADRES)를 맞춰 붙여야 한다.
limits: 영주시 한 시군구만 다루므로 다른 지역이나 전국 비교에는 쓸 수 없다. 표준 기관코드가 없어 의료기관 인허가·건강보험 데이터와 붙일 때는 이름·주소 매칭에 의존해야 하며, 이 과정에서 오매칭이 생길 수 있다.
