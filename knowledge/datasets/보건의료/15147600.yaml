summary_user: 강북구의 대중목욕탕·찜질방·사우나 등 목욕장업 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 영업 중인 곳과 폐업한 곳을 모두 포함하며 인허가일·폐업일·영업상태, 주소, 시설 면적·층수·욕실 수 등을 담는다. 창업 예정자나 상권 분석가가 "강북구에서 최근 몇 년 사이 폐업한 목욕탕·찜질방은 어디이고 지금 영업 중인 곳은 몇 곳인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 매칭이나 같은 기관(개방자치단체) 코드로만 잇고, 좌표(X, Y)는 중부원점TM(EPSG:5174)이라 지도에 올리려면 좌표 변환이 필요하다.
description_portal: '서울특별시 강북구 목욕장업 인허가 정보 데이터는 강북구의 대중목욕탕, 찜질방, 사우나 등 물로 목욕 할 수 있거나 맥반석ㆍ황토 등에게 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스를 제공하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
