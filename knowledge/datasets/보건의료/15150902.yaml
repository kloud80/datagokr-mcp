description_portal: 본 데이터는 경기도 고양시 정신건강복지센터 이용자 및 등록자 데이터로 기관, 집계연도, 이용자수, 등록자수 등의 항목을 제공합니다. ☞ 자살예방센터, 중독관리통합지원센터, 아동청소년정신건강복지센터는 포함하지 않습니다. 이용자수는 등록자수와 상담인원(실인원)의 합계입니다.※ 고양시 정신건강복지센터는 고양시민의 우울, 스트레스, 자살예방 등 정신질환에 대한 예방, 조기발견, 치료연계 뿐만 아니라 정신질환으로 어려움을 겪는 분들과 그 가족, 나아가 고양시민 모두가 건강한 마음을 통해 더욱 더 행복하고 평안하기를 바라는 마음으로 지역주민과 함께 하고자 합니다. 이용대상은 고양시에 거주하는 정신장애인과 가족, 정신건강에 대한 도움을 받고자 하는 모든 지역주민 및 유관기관이며, 위치는 "고양시 일산동구 중앙로 1100 일산동구보건소 별관 4층" 입니다.
