summary_user: 식약처가 마약류 원료물질 취급승인을 내준 업체별로 승인 품목의 품명, 승인 수량, 취급 시작일자·종료일자, 비고를 건별로 담는 전국 단위 API이다. 규제·정책 분석가가 특정 업체가 어떤 원료물질을 얼마만큼, 언제부터 언제까지 취급하도록 승인받았는지 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품명 등 이름 매핑이나 같은 기관(식약처) 데이터의 코드로만 이어 쓸 수 있다.
description_portal: 식품의약품안전처에서 제공하는 마약류원료물질 취급승인 취급품목정보 데이터는 마약류 원료물질의 취급 승인을 받은 업체별 품목 정보를 조회할 수 있도록 구성된 공공데이터입니다. 주요 제공 항목에는 품명, 승인 수량, 취급 시작일자, 취급 종료일자, 비고 등이 포함됩니다. 이를 통해 특정 업체가 어떤 원료물질을 어떤 이름으로 얼마만큼, 그리고 언제부터 언제까지 취급할 수 있도록 승인받았는지를 확인할 수 있습니다. 이 데이터는 마약류 원료물질 관리 현황 파악, 업체별 취급 이력 점검, 규제 준수 모니터링, 정책 분석 및 연구 목적으로 활용될 수 있습니다
