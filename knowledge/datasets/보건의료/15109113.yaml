description_portal: 이 데이터는 한국한의약진흥원이 생산·도출한 실험정보 기반의 한약재 성분정보 정형데이터로, 표에 제시된 항목 그대로 한약재별 화합물 구성과 출처를 구조적으로 기록하고 있습니다. 주요 필드는 한약재성분 ID, 한약재 ID, 화합물 ID, 원료약재학명, 성분정보출처이며, 각 행은 특정 한약재에 포함된 개별 화합물과 해당 화합물의 데이터 출처(Database, PMID 등)를 일관된 형식으로 제공합니다. 예시에서는 한약재 ID KMH2(terminalia chebula)에 대해 여러 화합물 ID와 관련 데이터베이스 및 문헌 출처가 연결되어 있어, 한약재의 성분 구성, 데이터 근거, 출처별 수집 현황을 체계적으로 파악하고 관리할 수 있도록 지원하는 것이 특징입니다.
