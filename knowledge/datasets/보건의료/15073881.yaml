description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 의료기기 자발적보고 정보입니다.  의료기기 제조업체나 수입업체가 제품의 안전성 문제나 품질 결함을 발견했을 때 자발적으로 식약처에 신고한 내용을 체계적으로 관리하여 소비자 안전을 보장합니다.  이 데이터는 업소명과 업소주소 업종 대표자명을 통해 보고 업체의 위치를 명확히 파악할 수 있습니다.  회수폐기보고코드와 회수폐기보고구분은 신고 유형을 분류하며 보고상태코드와 보고상태로 처리 현황을 확인할 수 있습니다 보고제출일자와 보고승인일자는 신고 접수와 승인 과정의 시간적 흐름을 보여주며 회수보고구분과 이전보고상태를 통해 조치 내용과 진행 과정을 파악할 수 있습니다.
