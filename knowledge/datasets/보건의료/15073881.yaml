status: active
summary_user: 의료기기 제조·수입업체가 제품의 안전성 문제나 품질 결함을 발견해 식약처에 자발적으로 신고한 보고를 건별로 담으며, 업소명·주소·업종, 회수폐기 보고 구분, 보고 상태와 이전 상태, 보고 제출일·승인일, 소비자 권고 행동 정보를 포함한다(범위 전국, 개별 주소 단위). 소비자나 의료기관이 '내가 쓰는 의료기기를 만든 업체가 회수·폐기 보고를 낸 적이 있는지, 그 처리 상태가 어떤지'를 확인하거나 분석가가 업체별 자발적 회수 보고 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명이나 사업자등록번호(BRNO) 같은 이름·코드 매칭, 또는 같은 식약처 데이터의 코드로만 이어 쓴다.
limits: 품목기준코드 같은 전역 조인 키가 없어 의료기기 품목허가나 건강보험 급여 목록과 바로 연결되지 않고, 업소명·코드 매칭에 의존해야 한다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 일 10,000회로 제한된다.
