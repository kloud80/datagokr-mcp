description_portal: 본 데이터는 한국보건산업진흥원이 수행한 보건신기술(NET) 인증 결과를 체계적으로 정리하여 제공하는 공공정보이다.보건신기술 인증제도는 보건의료 분야에서 개발된 우수한 신기술의 조기 시장진입과 산업 활성화를 지원하기 위해 운영되며,기술성, 안전성, 유효성 등을 종합적으로 평가한 결과를 기반으로 한다.데이터에는 인증 기술의 명칭, 신청기관, 기술 개요, 인증일자 및 유효기간 등이 포함되어 있어, 기술개발자 및 의료기관, 관련 산업계의 활용도를 높인다.또한 보건의료기술의 상용화 촉진과 기술이전, 투자유치 등에 기여할 수 있는 실효성 있는 자료로 구성되어 있다.정책 수립, 연구개발, 시장분석 등 다양한 목적으로 활용 가능하며, 인증 현황을 한눈에 파악할 수 있도록 정보 접근성을 고려하여 구축되었다.
