description_portal: 군 제휴 안경점에 대한 데이터입니다. 군 저시력자 안경 조달체계 렌즈 제작을 위한 군 제휴 안경 업소 목록으로, 세부 사항을 근무처(안경점 명), 지부, 분회, 근무처 전화번호, 근무처 우편번호, 근무처 주소, 근무처 상세 주소 등으로 나누어 상세하게 나타내고 있습니다. 해당 데이터를 통해, 고도수, 고난시 등 무관하게 1조당 2만 원에 제작 가능한 대한안경사협회 소속 군 제휴 안경 업소를 확인하는 것이 가능합니다. 또한, 저시력자(고도수, 고난시 등)들이 안경을 맞출 때, 보다 저렴한 가격으로 편한 안경을 제작하는 데에 도움을 줍니다.
