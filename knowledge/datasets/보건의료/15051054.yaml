summary_user: 보건복지부장관이 지정한 전국 전문병원을 기관 한 곳씩 담은 목록 파일로, 구분·지정분야(관절·척추·심장 같은 질환이나 산부인과·안과 같은 진료과목)·의료기관명·소재지·종별을 담는다(약 5KB 규모의 CSV). 환자나 보호자가 '우리 지역에서 척추나 관절 분야 전문병원으로 지정된 곳은 어디인가'를 확인하거나, 분석가가 지역별·분야별 전문병원 분포를 볼 때 쓴다. 요양기관기호(ykiho) 같은 공통 조인 키가 없어서, 심평원 병원정보서비스 등 요양기관 원장 데이터와는 의료기관명과 소재지를 맞춰 보는 방식으로만 연결한다.
description_portal: '전문병원이란 병원급 의료기관 중에서 특정 진료과목이나 특정 질환 등에 대하여 난이도가 높은 의료행위를 하는 병원으로 보건복지부장관이 지정하는 병원입니다. 전문병원 지정을 위한 평가업무를 심사평가원에 위탁하였으며 심사평가원은 매년 지정기준 충족여부 확인(절대평가) 및 상대평가에 해당하는 지정·평가를 수행하고, 지역별·분야별 균형을 고려하여 보건복지부장관이 최종 지정합니다.- 지정분야: 의과질환(관절, 뇌혈관, 대장항문, 수지접합, 심장, 알코올, 유방, 척추, 화상, 주산기), 한방질환(한방중풍, 한방척추), 의과진료과목(산부인과, 소아청소년과, 신경과, 안과, 외과, 이비인후과), 한방진료과목(한방부인과)- 제4기: (1차) 2021년~2023년, (2차) 2022년~2024년, (3차) 2023년~2025년- 제5기: (1차) 2024년~2026년, (2차) 2025년~2027년※ 기수별 지정결과는 보건복지부 홈페이지(www.mohw.go.kr) > 알림 > 공지사항 > 공고를 참고하여 주시기 바랍니다.'
