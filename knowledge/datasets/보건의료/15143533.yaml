description_portal: 본 데이터는 은평구 16개 동의 건강행태 및 건강수준 지표를 포함하고 있어, 지역 간 건강 격차 분석, 고위험군 지역 식별, 생활습관과 건강수준 간 상관관계 분석 등에 활용 가능합니다. 예를 들어 흡연율과 금연시도율의 관계, 고위험음주율과 우울감 경험률 간 상관분석, 걷기실천율과 비만율 간 회귀분석 등 다양한 통계적 접근이 가능합니다. 군집분석(K-means)을 통해 유사한 건강특성을 가진 동을 그룹화하거나, 시계열 데이터와 결합 시 추세 분석도 가능합니다. 보건소의 지역 맞춤형 건강증진사업 기획, 민간기관의 건강관리 솔루션 개발에도 기초자료로 활용될 수 있습니다.시각화 자료는 매년 은평데이터광장(http://stat.ep.go.kr)에서 확인가능합니다.
