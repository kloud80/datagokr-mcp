description_portal: 서울특별시 중랑구 코로나 백신접종현황입니다. 코로나 백신접종 현황은 보건의료 카테고리에 해당합니다. 백신접종률, 보건의료 계획, 감염병 개선, 데이터 분석 등에 활용될 수 있는 데이터입니다.통계자료는 질병보건통합시스템에 따른 잠정수치로 변동가능합니다. 시스템상 2021.6. 이전 수치는 표출되지 않아 6월 말 자료부터 제공합니다. 4차 누적 접종현황까지의 집계 자료입니다. 또한 자세한 데이터를 확인하실 경우 엑셀파일을 다운로드 받아서 확인하여 주시기 바랍니다. 감사합니다.
