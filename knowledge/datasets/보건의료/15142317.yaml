summary_user: 건강정보고속도로(의료 마이데이터 중계 시스템)에 참여하는 의료기관을 기관 1곳당 1행으로 담은 파일로, 포털 설명 기준 상급종합병원 47개소와 종합병원 120개소의 의료기관명·소재지 주소·대표번호를 전국 범위로 담는다. 국민이 내 진료기록을 건강정보고속도로로 받아볼 수 있는 병원이 근처에 있는지 확인하거나, 분석가가 의료 마이데이터 참여 병원의 지역 분포를 볼 때 쓴다. 전역 조인 키나 기관 코드가 없어 다른 의료기관 데이터(인허가 LOCALDATA, 의료기관 인증 등)와는 의료기관명·소재지 주소를 맞춰 이어 써야 한다.
description_portal: '재단법인 한국보건의료정보원 건강정보고속도로 참여 의료기관(상급종합병원 47개소, 종합병원 120개소) 에 대한 연번, 의료기관명, 소재지, 대표번호 정보를 제공합니다.건강정보 고속도로 사업이란?공공기관 및 의료기관이 보유 중인 본인의 개인 의료데이터(PHR, Personal Health Records)를 본인이 열람할 수 있도록 표준화된 형식으로 제공하고, 본인 동의를 기반으로 원하는 곳에 안전하고 효율적인 전송을 지원하는 의료 마이데이터 중계 시스템 구축 및 운영* 구축근거 : 의료법 시행령 제10조의3(본인진료기록 열람지원시스템의 구축·운영 등)'
