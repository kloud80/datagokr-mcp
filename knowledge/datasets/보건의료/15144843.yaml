description_portal: '본 데이터는 국민건강보험공단에서 제공하는 장애인 건강주치의 시범사업 참여 의료기관의 전국 단위 목록입니다.장애인 건강주치의 제도는 장애인의 건강권 보장과 의료접근성 향상을 위해 전문의가 지속적이고 포괄적인 건강관리를 제공하는 제도로, 아래와 같은 내용을 포함하고 있습니다.1. 의료기관 구분: 의과, 치과2. 요양기관명3. 서비스유형: 구강건강관리, 일반건강관리, 주장애관리, 통합관리4. 의료기관 주소 - 기준일: 2025년 7월 21일해당 데이터는 2025년 7월 21일 기준으로 등록된 장애인 건강(치과)주치의 시범사업 의료기관 현황을 수록하고 있으며, 신청인의 공공데이터 요청에 따라 수시로 1회성 제공된 자료입니다.※ 본 데이터는 공공데이터 제공 신청을 바탕으로 일부 정보를 선별·가공하여 제공된 것으로, 건강보험 제도 전반(자격, 보험료, 급여, 장기요양 등)에 관한 문의는 국민건강보험공단 대표번호(☎ 1577-1000)로 문의해 주시기 바랍니다.'
