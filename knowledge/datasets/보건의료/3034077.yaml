summary_user: 국립부곡병원 한 곳의 정신질환(일반·알코올·약물 등) 진료통계를 연도별로 집계한 파일로, 실측 컬럼은 연도·진단코드(KCD)·진단명·성별별 신환·초진·재초진·재진 환자 수입니다. 정신건강 분야 분석가나 연구자가 '이 병원에서 알코올·약물 관련 진단 환자 중 신환과 재진 비중이 연도별로 어떻게 달라졌나' 같은 질문에 씁니다. 전역 조인 키는 없으므로 다른 진료통계와는 진단코드(KCD)·진단명이나 연도·성별을 맞춰 이어 써야 합니다.
description_portal: '국립부곡병원이 정신질환자 대상 진료서비스를 제공 과정에서 발생하는 정신질환(일반, 알코올, 약물 등으로 분류) 관련 진료통계로 내부 임상데이터웨어(CDW)시스템에서 진료실적, 환자현황, 퇴원환자분석에 대한 데이터를 년도별로 추출하여 제공 주1) 진료실적 : 외래환자수, 입원환자수, 퇴원환자수 및 일평균 환자수 주2) 환자현황 : 보험유형별, 성별, 연령별, 진단명별, 입원유형별 환자현황 주3) 퇴원환자분석 : 퇴원환자수, 재원일수를 환자구분별, 입원유형별로 제공* 제공 데이터 항목에 대해서는 추후 제공 과정에서 지속 업데이트 예정'
