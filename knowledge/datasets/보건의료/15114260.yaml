description_portal: '이 공공데이터는 경상남도 사천시가 희귀질환자 및 그 가족들의 과도한 경제적 부담을 경감하고 적절한 치료를 지속하도록 지원한 실적을 정리한 자료입니다. 해당 정보는 2023년 6월 1일을 기준으로 집계되었으며, 연도별 및 월별로 세분화된 시계열 통계를 제공합니다.자료의 주요 항목은 다음과 같습니다.연도별/월별: 지원이 이루어진 시점을 구분하여 시간의 흐름에 따른 변화 추이를 파악할 수 있습니다.지원인원: 해당 기간 동안 사천시에서 의료비 지원 혜택을 받은 희귀질환자의 수를 나타냅니다.지원금액: 지원된 총 의료비 규모를 원(\) 단위로 명시하여, 시의 복지 예산 투입 현황 및 지원 효과를 계량적으로 확인할 수 있습니다.이 현황 자료는 사천시의 보건 복지 정책 수립 및 평가의 기초 자료로 활용되며, 희귀질환자를 위한 사업의 효율성과 수혜 범위를 분석하는 데 중요한 역할을 합니다. 특히 저소득층 희귀질환자의 삶의 질 향상에 기여한 성과를 보여줍니다.'
