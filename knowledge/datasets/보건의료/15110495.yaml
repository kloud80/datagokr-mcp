summary_user: 대구광역시 서구 관내 병의원별로 출입문 형태, 휠체어 출입 가능 여부, 출입구 폭·턱 높이, 경사로 유무·폭·각도, 장애인 화장실과 주차장 유무 등 교통약자 접근성 항목을 기관 한 곳당 한 행으로 담은 건별 자료이며, 위치는 주소 단위로 주어진다. 휠체어 이용자나 보호자가 '서구에서 턱 없이 들어갈 수 있고 장애인 화장실이 있는 의원이 어디인가'를 미리 확인하거나, 정책 담당자가 무장애 환경 개선이 필요한 병의원을 추리는 데 쓴다. 공통 조인 키가 없으므로 병의원 인허가(LOCALDATA) 같은 다른 자료와는 상호명(b_store_name)과 주소를 맞춰 이어 쓴다.
description_portal: 대구광역시 서구 관내 병의원 현황을 바탕으로 출입구 폭, 휠체어 출입가능 유무, 장애인 화장실 유무 등의  교통약자를 위한 상세데이터를 제공하는 서비스본 데이터는 대구광역시 서구 내 병의원에 대한 교통약자 접근성 정보를 포함한 상세 항목을 수록한 자료이다. 각 병의원의 출입문 구조, 휠체어 출입 가능 여부, 출입구 폭과 유효거리, 턱 유무 및 높이, 경사로 유무, 손잡이 설치 여부 등 이동 편의와 관련된 물리적 조건을 포함하고 있으며, 장애인 화장실 및 주차장 등 편의시설의 존재 여부 또한 함께 제공된다. 이를 통해 교통약자 및 보호자는 병의원 이용 시 사전 정보를 확인하고 이동 경로 및 시설 접근성을 예측할 수 있다. 본 자료는 민간 및 공공 부문에서 교통약자 배려 정책 수립 및 무장애 환경 조성을 위한 기반 자료로 활용될 수 있다.
team:
