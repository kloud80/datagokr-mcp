summary_user: 부산광역시 서구에 있는 한의원을 한 곳씩 담은 목록 파일로, 기관명·도로명 주소·대표 전화번호를 담는다(포털 설명 기준 28개소, 2026년 5월 20일 기준). 서구 주민이나 방문객이 '근처 한의원이 어디 있고 전화번호는 무엇인가'를 확인할 때 쓰고, 분석가는 한의원 분포를 상권 신호로 볼 때 보조 자료로 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 자료와는 기관명·주소를 맞춰 이어야 한다.
description_portal: '본 데이터는 부산광역시 서구 관내에 주소지를 둔 한의원 의료기관 현황 정보 데이터입니다. 이 데이터는 각 한의원의  의료기관 명칭, 의료기관 주소(도로명 주소),  문의 및 안내를 위한 의료기관 대표 전화번호에 관련된 정보가 포함되어 있어 의료기관 방문이나 문의가 필요한 경우 유용하게 활용될 수 있습니다.* 부산광역시 서구 소재 한의원: 28개소(기준일자: 2026. 5. 20.자)* 이 정보는 서구 주민이나 방문객들이 한의원을 선택하고 이용하는 데 필요한 기본적인 연락처와 위치 정보를 한눈에 파악할 수 있습니다.'
