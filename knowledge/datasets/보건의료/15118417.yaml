description_portal: '1. 질병그룹: 민원인의 요청에 의한 것으로 (그룹1) S, T, (그룹2) O, S, T, F04~F99, Q00~Q04, A50~A64, K00~K08 제외한 모든 질병코드2. 진료년도: 2020~2022년  - 진료일기준(한의분류 제외, 외래진료)  - 2023년 6월 지급분까지 반영3. 성별: 남자, 여자4. 연령: 0세, 1~99세(5세 단위), 100세 이상, 연도말 기준5. 외래일수(일): 민원인의 요청에 따라 특정 요양기관종별(상급종합병원)로 청구된 내용 기준   - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소,증세 등에 따라 일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음※ 민원인 요청에 따른 제공 건으로 2023-08-10 발췌※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
