description_portal: 보건복지부의 정신건강사례관리 시스템과 범정부 사회보장정보시스템인 "행복이음" 간의 효율적인 데이터 연계 및 행정 처리를 위해 관리되는 전국 행정지역 기초 정보 데이터입니다. 데이터에는 경기도, 서울특별시, 경상북도 등 전국 지방자치단체의 행정구역 정보 총 3,886건의 표준 데이터가 포함되어 있습니다.제공되는 주요 항목으로는 지역별 고유 식별 체계인 "지역코드", 읍·면·동 단위를 구분하는 "행정동명", 광역자치단체를 식별하는 "시도명", 기초자치단체를 의미하는 "시군구명"이 포함되어 체계적인 지역 분류 구조를 제공합니다. 이에 더해 해당 행정구역 코드가 시스템에 최초 등록된 시점인 "생성일자", 행정구역 개편 등으로 코드 효력이 상실되는 시점을 명시한 "폐지일자"(유효 코드의 경우 9999-12-31로 표기), 그리고 데이터의 정합성을 검증하기 위한 "삭제여부"까지 총 7개의 컬럼으로 구성되어 있습니다.
