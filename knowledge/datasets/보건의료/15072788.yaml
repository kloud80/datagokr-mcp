summary_user: 건강보험 양방 요양기관(약국 제외)이 청구해 심사 결정된 명세서를 바탕으로, 진료년도·암 상병별로 환자수·명세서 청구건수·입내원일수·보험자부담금·요양급여비용총액을 전국 단위로 집계한 파일이다. 분석가나 연구자가 "특정 암의 연간 환자수와 건강보험 진료비가 해마다 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 진료 통계와는 진료년도와 암 상병명(이름 매칭)으로만 이어 쓴다.
description_portal: '암 상병별 진료비 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2022년 1월~12월, 심사년월: 2022년 1월~2023년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음※ 암 상병 산출기준은 ‘첨부자료’ 참고'
