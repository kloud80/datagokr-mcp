summary_user: 안산시 관내 보건소·보건지소·보건진료소·건강생활지원센터를 시설 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 1.3KB)로, 시설 구분, 시설명, 도로명·지번 주소, 진료과목, 전화번호를 담는다. 안산 주민이 '대부도나 원곡동 근처에서 한방·치과 진료를 받을 수 있는 공공 보건시설이 어디인가'를 찾을 때, 또는 분석가가 시군구 단위 공공보건 시설 분포를 정리할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매핑으로만 잇고, 주소를 좌표로 바꾸면 의료기관 인허가나 응급의료 위치 데이터와 겹쳐 볼 수 있다.
