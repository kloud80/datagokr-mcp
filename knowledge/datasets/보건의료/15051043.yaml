summary_user: 기준년월에 개업·폐업·휴업한 병원·의원·약국을 기관 단위로 담는 API로, 요양기관명·요양종별·표시과목·주소·전화번호·개업일자를 제공하며 전체 2,429건, 전국 범위다. 지역에서 최근 문을 닫거나 새로 연 병원·약국이 어디인지 살피려는 분석가나 사업자가 쓴다. 암호화된 요양기호(ykiho)로 심평원의 다른 요양기관 API와, 시도코드(sidoCd)와 주소(addr)로 지역 단위 데이터와 이어 쓴다.
