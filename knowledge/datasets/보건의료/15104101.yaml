description_portal: 코로나19 입원·격리자 생활지원비는 격리기간 동안 생계비를 지원하는 제도로, 2023년 6월부터 양성 확인 통지를 받은 후, 입원하거나 보건소에 격리 참여 신청한 사람이 격리기간 종료일로부터 90일 이내 정부24, 보조금24 앱, 또는 주민등록지의 읍·면·동 행정복지센터를 통해 신청을 받았으며, 2023년 8월 31일부로 코로나19가 제4급 감염병으로 전환됨에 따라 생활지원비(및 유급휴가비) 사업이 종료되었습니다. 대전광역시 서구 관내에서 신청·접수한 현황을 행정동, 신청방법(온라인 또는 방문접수), 지원결과(적합 또는 부적합)별로 건수를 제공합니다.
