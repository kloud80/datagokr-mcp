description_portal: '이 데이터는 국립암센터에서 수집한 담도암 환자의 수술 및 관련 시술 검사 정보를 포함하는 메타데이터입니다. 수술명, 수술일자, 수술 부위, 수술 방식, 수술 중 합병증 여부, 병리학적 절제연 조치 등 주요 수술 관련 정보와 함께, 치료 전후 시행된 시술 검사(예: 내시경적 역행성 담췌관 조영술, 경피적 담도배액술 등)에 대한 메타데이터가 포함되어 있습니다. 이 데이터는 담도암 환자의 수술 치료 특성 분석, 수술 후 예후 예측, 시술의 적절성 평가 등 임상적 연구에 활용될 수 있으며, 의료행위 표준화 및 수술 성과 향상에도 기여할 수 있는 중요한 기초자료입니다.'
