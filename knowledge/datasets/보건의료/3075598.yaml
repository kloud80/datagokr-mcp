summary_user: 부산광역시 해운대구에 신고된 의료기기 판매업·판매(임대)업 영업소를 한 곳씩 담은 건별 현황 파일로, 영업소명·영업 구분·도로명 소재지를 담는다(CSV 약 86KB, 해운대구 한 시군구 범위). 해운대구에서 의료기기를 사거나 빌릴 수 있는 업소가 어디에 있는지 찾는 주민이나, 지역별 의료기기 판매업소 분포를 보려는 분석가가 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 영업소명·주소 문자열 매칭이나 같은 기관(해운대구) 기준으로만 이어 쓴다.
description_portal: 부산광역시 해운대구 의료기기 판매업 및 판매(임대)업 신고 현황에 대한 데이터로 의료기기 판매업소의 영업소명, 영업의 구분, 주소 등의 정보를 제공한 데이터 입니다.영업소명은 각 의료기기 판매업의 공식 상호명을 나타내며, 이는 정확한 식별 및 검색을 위한 기준이 됩니다.영업의 구분은 의료기기 판매의 영업 형태를 나타내며, 각 영업소의 종류로 어떤 형태로 운영하고 있는지의 정보를 확인할 수 있습니다. 의료기기 판매업의 소재지는 의료기기 판매업 영업소가 실제 어디에 있는지를 알려주는 가장 실용적인 정보로, 도로명 주소를 기본으로 제공하고 있습니다.현황은 신규 신고, 폐업, 휴업, 소재지, 변경 등의 이유로 변경될 수 있습니다.
