summary_user: 근로복지공단 산재병원의 의료 현황을 담은 API로, 포털 설명상 연도별 환자 진료 현황, 협력병원, 전국 산재 지정 의료기관·약국의 주소와 연락처, 관할 지사, 재활 인증기관 정보를 포함하며 범위는 전국이고 위치는 주소·좌표 단위의 개별 기관입니다. 산재 근로자나 가족이 '우리 지역에 산재 지정 병원이나 약국이 어디 있나'를 찾거나, 분석가가 지역별 산재 의료 인프라와 연도별 진료 추이를 비교하는 데 씁니다. 실측 컬럼은 지역 구분(jiyeokFg), 지역 세부 구분, 내용, 연도 정도이고 전역 조인 키가 없어, 다른 데이터와는 지역명·기관명 매칭이나 같은 기관 코드로만 이어 씁니다.
