description_portal: 제주특별자치도 서귀포시에서 제공하는 음식점 위생등급 지정 현황 데이터는 관내 공인 식당의 위생 수준을 평가한 결과를 담은 공공데이터입니다. 각 기록에는 업소명, 지정번호, 소재지(도로명 주소 기준), 지정등급(매우우수·우수·좋음 등급), 지정일자 및 데이터 기준일자 등이 포함되어 있어, 지역 내 식당의 위생 상태를 한눈에 확인할 수 있습니다. 총 146건이 수록되며, 식품의약품안전처 기반의 위생등급제에 따라 평가된 결과를 연간 형태로 제공합니다 . CSV 파일은 로그인 없이 무료로 다운로드할 수 있으며, XML/JSON 오픈API와 연계 활용도 가능합니다 . 이 데이터는 소비자 안전 정보 제공, 외식업 위생 관리 강화, 관광객 대상 위생 우수 식당 안내, 정책 수립 및 학술 연구 등 다양한 목적에 활용될 수 있습니다.
