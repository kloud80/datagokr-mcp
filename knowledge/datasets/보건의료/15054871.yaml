summary_user: 울산광역시 중구에 있는 요양병원·요양원을 기관 한 곳당 한 행으로 담은 소규모 파일(csv 약 2.6KB)로, 기관명·기관종류·급여종류·대표자·주소·전화·팩스·정원을 시군구 단위 개별 주소로 담는다. 중구에 사는 가족이 부모를 모실 요양시설을 찾으며 "우리 동네 어느 시설이 어떤 급여를 제공하고 정원이 몇 명인가"를 확인하거나, 분석가가 중구의 노인 돌봄 시설 분포와 공급 규모를 파악하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 기관명이나 주소(기관주소)를 맞춰 붙여야 하며, 의료기관 인허가(LOCALDATA) 같은 자료와도 이름·주소 매칭으로만 연결한다.
limits: 실측 컬럼에 기관 코드 같은 공통 키가 없어서 다른 데이터와 연결할 때는 이름·주소 매칭에 의존하므로 표기 차이에 주의해야 한다. 범위는 울산 중구 한 곳뿐이어서 다른 시군구와 비교하려면 별도 자료가 필요하다.
