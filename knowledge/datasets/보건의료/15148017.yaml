description_portal: 서울특별시 구로구에서 제공하는 집단급식소 인허가 정보 데이터는 지역 내 집단급식소의 인허가 현황과 영업 상태를 종합적으로 정리한 공공자료이다. 데이터에는 관리번호, 인허가일자, 인허가취소일자, 영업상태명, 상세영업상태명, 폐업일자, 휴업 및 재개업일자 등 주요 변동사항이 포함된다. 또한 전화번호, 소재지면적, 지번주소와 도로명주소, 우편번호, 사업장명 등 기본정보와 업태구분명, 좌표정보(X,Y), 위생업태명, 영업장주변구분명 등이 수록되어 있다. 남성 및 여성 종사자 수, 본사 종업원 수, 생산·판매·사무직 종업원 수, 총인원 등 인력 현황과 함께 급수시설, 건물소유구분, 시설총규모, 보증액, 월세액, 다중이용업소 여부 등 경영 및 시설 관련 자료도 포함된다. 이를 통해 집단급식소의 설립, 운영, 휴업, 폐업에 이르는 전반적 현황을 확인할 수 있으며, 위생관리 및 식품안전 정책 수립의 기초자료로 활용된다. 행정기관은 본 데이터를 활용하여 인허가 적정성을 점검하고, 위생기준 충족 여부와 다중이용업소 관리 상태를 확인할 수 있다. 또한 위치정보와 종사자 현황을 분석해 지역 내 급식소 분포를 파악하고, 취약지역을 진단하여 영업환경 개선 대책 마련에 활용할 수 있다. 연구기관은 자료를 기반으로 집단급식소의 운영실태, 종사자 구조, 시설규모와 영업 지속성 간의 관계를 분석할 수 있으며, 공중보건 연구와 식품위생 정책 연구에 기여할 수 있다. 시민은 합법적으로 허가된 집단급식소를 확인하여 신뢰할 수 있는 급식서비스를 이용할 수 있으며, 생활권 내 위생환경 이해를 높일 수 있다. 본 데이터는 식품안전 확보, 공중보건 향상, 건전한 급식 환경 조성에 기여하는 중요한 기반자료이다. 정기적 갱신과 품질관리를 통해 최신성과 정확성이 확보되어 누구나 공공데이터포털을 통해 자유롭게 활용할 수 있다.
