description_portal: '○ 통계개요* 통계명 : 응급실 월별 이용 현황* 통계종류 : 보고통계* 작성목적 : 권역·전문·지역응급의료센터 등의 응급환자진료 정보를 이용하여 응급실이용자들의 현황을 파악하고 분석하여 응급환자 진료체계 개선 및 지역별응급의료 시행계획 수립에 대한 기초자료와 국민건강보호 보호 등 국가적정책자료에 이용가능한 정보를 제공* 조사체계 : 시·군·구(응급의료 관련과)→시·도→국립중앙의료원 중앙응급의료센터NEDIS가 구축된 병원→국립중앙의료원 중앙응급의료센터* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 응급실 월별, 성별, 연령별 이용자 수 등○ 용어설명* 응급환자 : 응급의료에 관한 법률 제2조(정의) 제1호에 해당하는 응급환자로서 질병,분만, 각종 사고 및 재해로 인한 부상이나 그 밖의 위급한 상태로 인하여즉시 필요한 응급처치를 받지 아니하면 생명을 보존할 수 없거나 심신에중대한 위해(危害)가 발생할 가능성이 있는 환자 또는 이에 준하는 사람○ 기타* 응급의료기관 중 NEDIS를 구축하고 진료정보를 전송하고 있는 서울지역 31개 지역응급의료센터급 이상의 현황자료임** NEDIS : 전국의 응급의료기관으로부터 전송되는 진료관련 정보를 실시간으로 수집하여 선진국형 응급의료체계 구축 기반마련 및 응급의료에 관한 연구와 정책수립의기초자료 제공을 위하여 응급의료에 관한 법률 제15조(응급의료정보통신망의 구축),제17조(응급의료기관등에 대한 평가) 에 근거하여 2003년에 구축○ 출 처 : 국립중앙의료원 중앙응급의료센터 「국가응급진료정보망(NEDIS) 통계연보」'
