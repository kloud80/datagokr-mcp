description_portal: '한국장기조직기증원은 장기 및 조직기증 활성화를 위해 의료진을 대상으로 체계적인 교육을 실시하고 있습니다. 이 교육은 뇌사추정자 및 사후 잠재 조직기증자 발견과 적절한 통보를 유도하고, 장기기증의 전 과정에 대한 이해를 높여 기증 문화 확산과 실질적인 기증률 제고를 목적으로 합니다.1. 권역별 분류교육은 전국적으로 시행되며, 지리적 특성과 운영 효율성을 고려하여 아래의 세 개 권역으로 구분되어 운영되고 있습니다.- 중부지부: 수도권 및 강원 지역 의료기관 중심. 상급종합병원이 다수 포함.- 충청/호남지부: 대전, 충청, 전라도 지역 중심. 권역응급의료센터 중심 운영.- 영남지부: 부산, 대구, 경상도 전역. 중환자 및 응급환자 주치 의료기관 중심.2. 교육 대상 및 세부 분류의료진 교육은 기증과정 전반에 관여할 수 있는 다양한 직군을 대상으로 하며, 직종별로 다음과 같이 세분화되어 있습니다.1) 의사는 신경외과,신경과,응급의학과,중환자의학과,기타 등 세부 분류하고2) 간호사는 중환자실,응급실,수술실,병동 간호사로 세부 분류하고 있습니다3) 비의료인은 사회복지사,장례지도사, 행정직, 전산관리자 등이 있습니다.3. 교육 주요 내용의료진 교육은 장기·조직기증 관련 실무역량을 높이는 데 중점을 두며, 아래와 같은 핵심 주제를 중심으로 구성됩니다.- 뇌사추정자 및 사후 잠재 조직기증자 통보 절차 안내, 기증자 조기 발견과 효율적인 통보체계 정착을 위한 실무 지침 제공.- 장기기증 과정 및 뇌사판정 절차에 대한 이해, 뇌사 평가 단계, 판정위원 구성, 법적 요건 등에 대한 체계적 설명.- 한국장기조직기증원의 역할과 지원체계 소개, 기관의 법적 권한, 의료기관 협업 구조, 현장 대응 방식 공유.- 사례 기반 실무교육 및 윤리적 고려사항, 실제 임상사례를 통한 의사결정 훈련과 기증윤리 인식 제고4. 활용 목적해당 통계는 각 지부 및 연도별 교육 실적을 파악하고, 지역 간 편차 또는 대상군의 사각지대 유무를 확인하는 데 활용됩니다.'
