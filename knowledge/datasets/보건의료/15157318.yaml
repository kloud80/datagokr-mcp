description_portal: 이 데이터는 국립춘천병원 의료부 내과에서 시행된 영상의학과 검사 실적을 연월 단위로 집계해 제공하는 공공데이터입니다.※ 2025년 12월까지 "내과 검사실적"으로 일괄 개방하였던 데이터 3개 중 1개입니다.※ 아래 검사 관련 설명은 참고 사항일 뿐 법적책임은 없음을 밝혀드립니다. 자세한 내용은 전문가와 상담하시기를 바랍니다.데이터는 구분, 흉부, 복부, 사지, 척추, 두부로 구성되어 있습니다.구분은 연월 정보를 담고 있습니다, 이 데이터를 통해 검사실적 데이터를 시간의 흐름 등에 따라 분석할 수 있습니다.구분 이외의 열은 촬영 부위별 검사(촬영) 건수를 제공합니다. 흉부 항목은 폐나 심장 관련 질환 진단과 연관된 검사 활용도를 가늠할 수 있고, 복부 항목은 소화기 및 장기 질환 진단 흐름을 파악하는 데 도움이 됩니다. 사지와 척추 항목은 외상, 근골격계 질환, 퇴행성 변화 등과 관련된 의료 수요를 반영하며, 두부 촬영을 통해 두개골 및 안면부 골절 등을 확인할 수 있습니다.
