description_portal: 최근 반려동물 양육 가구가 급증함에 따라 반려동물의 건강과 복지를 관리하는 동물병원의 중요성 또한 높아지고 있습니다.동물병원이란 자격이 있는 수의사가 적법하게 개설 신고를 하고 동물진료업을 하는 장소로서 반려동물 및 다양한 동물을 진찰·진료하는 곳을 의미합니다.동물진료업이란 농림축산식품부장관의 면허를 받은 수의업무를 담당하는 자 가 동물을 진료하거나 동물의 질병을 예방하는 업을 말하며, 동물이란 소, 말, 돼지, 양, 개, 토끼, 고양이, 조류, 꿀벌, 수생동물 등을 의미합니다.현재 부산광역시 남구 내에서 운영하는 동물병원의 공개 내용으로는 상호명, 전화번호, 위치 등이 있으며, 국가동물보호정보시스템(https://www.animal.go.kr/)에서  전국 동물병원 현황(병원명, 전화번호, 소재지, 인허가번호)을 조회할 수 있습니다.이와 관련한 추가적인 문의 및 질의사항이 있으시면 남구청 일자리경제과☎ 051-607-4489으로 연락 주시기 바랍니다.
