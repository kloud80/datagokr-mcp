summary_user: 국립법무병원 의료진이 처방에 쓰는 의약품 용법을 코드화한 마스터 파일로, 용법코드·용법명·관리기관명·담당부서와 복용시간·복용방법·부위 같은 용법 정보를 담는다(csv 1,424바이트의 작은 코드표). 의료정보 담당자나 분석가가 '이 병원 처방 기록의 용법코드가 어떤 복용 방법을 뜻하나'를 풀이하거나 자체 용법 코드 체계를 설계할 때 참고 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 식약처 품목기준코드나 의약품 표준코드로 허가정보·약가 목록과 직접 잇지 못하며, 같은 기관 자료와 용법코드·용법명 매핑으로만 연결한다.
description_portal: '국립법무병원은 범법정신질환자인 피치료감호자의 치료 및 정신감정유치자의 정신감정 업무를 수행하고 있습니다. 국립법무병원에서 사용하는 의약품의 용법 코드 마스터로 기본정보는 용법코드, 용법명, 관리기관명, 담당부서로 구성되었습니다. 의약품별 복용시간, 복용방법, 부위 등 관련정보를 포함하고 있습니다.병원 의료진이 환자 처방시 사용하는 의약품에 대한 용법을 코드화하여 수집한 자료로 관련 업무의 참고자료로 활용될 수 있습니다.*피치료감호자 : 1호(심신장애), 2호(알코올, 마약 등 중독자), 3호(정신성적 장애)'
