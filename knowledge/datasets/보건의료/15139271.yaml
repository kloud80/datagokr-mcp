summary_user: 대전광역시 관내 응급 신고 한 건마다 신고 연월일, 사건 발생 위치, 출동한 안전센터, 이송 병원명을 기록한 건별 원천 파일이다. 분석가나 시 담당자가 "어느 안전센터 관할에서 출동이 몰리고, 환자가 주로 어느 병원으로 이송되는가"를 파악하는 데 쓴다. 전역 조인 키는 없어서 병원명·안전센터명을 이름으로 맞춰 응급의료기관 목록 등 다른 데이터와 이어 붙여야 한다.
description_portal: 대전광역시 응급 이송 자료는 관내 다양한 응급 신고 발생 시 각 신고연월일, 사건이 발생한 위치 정보, 출동한 안전 센터, 이송 병원명 등 세부 내역을 체계적으로 정리한 데이터입니다. 본 자료에는 개별 신고 시점 별 응급 상황이 발생한 지역, 현장에 출동한 안전 센터, 각기 다른 병원 이송처 정보가 포함되어 있어 응급의료자원의 지리적 배치와 병원 연계 현황을 파악할 수 있습니다. 이를 통해 출동 현황 및 응급 의료 기관 별 이송 건수, 시간별·장소별 위험 집중지대, 실제 현장에서의 응급 대응 절차 및 병원 분포 현황까지 분석 가능합니다.
