description_portal: 대구광역시 동구에서 보유중인 신생아BCG무료접종의료기관 공공데이터는 핵 예방을 위해 국가에서 지정한 병원이나 보건소 등으로, 생후 4주 이내 신생아를 대상으로 BCG(결핵 예방) 백신을 무료로 접종해주는 병원의 정보를 가지고 있습니다. 해당 데이터는  기관명, 소재지, 주소, 접정요일, 접종가능시간, 연락처 등의 정보를 포함하고 있습니다.이 의료기관들은 대부분 보건복지부나 질병관리청이 운영하는 예방접종도우미 사이트에서 조회 가능하며, 접종 방식은 피내용과 경피용 두 가지가 있으므로 기관별로 제공 방식이 다를 수 있습니다. 일부 의료기관은 사전 예약이 필요하고, 산모 수첩이나 아기 주민등록번호 등의 신분 확인 서류를 요구하기도 합니다. 접종 후에는 접종 부위에 염증이나 흉터가 생길 수 있어 관리에 주의가 필요합니다.이 제도는 경제적 부담을 줄이고 전국적으로 결핵 예방률을 높이기 위한 공공 예방접종 사업의 일환으로 시행되고 있습니다.
