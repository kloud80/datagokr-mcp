summary_user: 전국 요양기관의 폐업 내역을 기관별 한 행으로 담은 파일 데이터로, 2000-01-01부터 2025-12-31까지 97,670건이 들어 있다. 지역별·종별로 병원·의원·약국이 언제 폐업했는지 알고 싶은 분석가나 국민이 시도·시군구 단위 폐업 추이를 볼 때 쓴다. 전역 조인 키가 없어 요양기관명과 시도·시군구명 같은 이름·지역 매핑으로 같은 심평원 요양기관 원장 데이터와 연결해야 하고, 폐업 기관은 요양기호가 소멸되어 암호화 요양기호(ykiho)도 제공되지 않는다.
description_portal: 요양기관 폐업 현황(요양기관명, 요양기관종별, 요양기관소재지(시도명, 시군구명), 요양기관 폐업일자)  / 연1회 업데이트- 연도말 기준 자료이며, 기준일까지 누적된 요양기관의 폐업 정보를 제공하고 있습니다.- 국민건강보험법 제43조(요양기관 현황에 대한 신고) 및 동법 시행규칙 제12조(요양기관 현황 신고 등)에 따라 요양기관이 건강보험심사평가원에 신고한 기준으로 작성되었습니다.※ 폐업된 요양기관의 경우, 요양기호가 소멸됨에 따라 암호화된 요양기호는 별도로 제공하지 않으므로 참고하시기 바랍니다.
