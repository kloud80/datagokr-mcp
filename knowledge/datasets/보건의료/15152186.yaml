summary_user: 메디컬코리아포털에서 외국인 환자가 자주 찾는 병원을 병원 단위로 담은 파일 데이터로, 전국 14,403행에 병원명·지역·주소·연락처·의사 수·병상 수·적용 가능 보험사·기타 서비스를 일·중·러 다국어로 싣는다. 의료관광 업무 담당자나 해외 환자 유치 기관이 외국인 환자에게 안내할 병원의 언어별 정보와 보험 적용 여부를 찾을 때 쓴다. 이어 쓸 수 있는 키는 주소(주소1·주소2 계열)뿐이며, 이를 기준으로 다른 의료기관 인허가·위치 자료와 대조하되 별도의 기관 식별코드나 코드표는 없다.
description_portal: 메디컬코리아포털에서 외국인 환자가 자주 검색하는 병원들의 상세현황 정보입니다. 병원명, 지역, 연락처, 의사 수, 병상 수, 주소, 소개 등 정보와 외국인 환자 적용 가능 보험사, 기타 서비스 등 유치 필수 정보를 담고 있습니다. 특히, 일본어, 중국어, 러시아어 등 다국어 버전의 병원명, 소개, 주소, URL, 이메일, SNS 등의 상세 정보를 제공하여 해외 환자 유치 및 의료 관광 활성화에 직접적으로 활용됩니다. 의료기관의 서비스 제공 범위 및 특화 분야에 대한 구체적인 내용도 포함되어 있으며, 조회 수 등 관리 정보도 제공됩니다. 해외 마케팅 자료로도 유용하게 사용됩니다.
