description_portal: '□ 데이터 개요본 데이터는 2022년 8월부터 12월까지의 기간 동안, 입소형 장기요양기관에서 발생한 코로나19 감염 사례에 대한 신고 현황을 기록한 자료입니다.장기요양기관의 감염관리 현황을 지역별로 파악하고, 집단 감염 대응 및 방역정책 수립의 기초자료로 활용하기 위해 구축되었습니다.□ 주요 내용대상 기관: 2022년 8~12월 기준 입소형 장기요양기관신고 대상자: 입소자 및 해당 기관에 근무하는 종사자제공 항목: 시도, 시군구별, 급여종별 코로나19 발생 건수 및 신고 건수 등※ 본 데이터는 감염병 대응체계 강화와 장기요양서비스의 안전성 확보를 위한 정책자료로 활용됩니다.'
