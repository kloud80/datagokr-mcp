summary_user: 차상위계층 본인부담경감 지원대상자 수를 연도와 구분(희귀난치성·중증질환자, 만성질환자, 18세 미만 등)별로 집계한 전국 단위 통계 파일로, 포털 설명상 2009년부터 2025년까지를 담는다. 복지·보건 분석가가 소득인정액 기준 중위소득 50% 이하 세대의 본인부담 경감 대상자가 연도별·대상 유형별로 어떻게 변해 왔는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 구분명(대상 유형) 이름을 맞춰서만 이어 쓴다.
description_portal: '보건복지부에서 2009년부터 2025년까지 차상위계층 본인부담경감 지원대상자 통계현황(희귀난치성.중증질환자, 만성질환자, 18세미만)에 대한 데이터를 제공하고 있습니다.<통계 데이터 이용 시 참고사항> * 차상위 본인부담경감대상자 지원사업 : 의귀질환, 중증난치질환·중증질환자, 6개월 이상 치료를 받고 있거나 치료가 필요한 사람 또는 18세 미만 아동 중 세대의 소득인정액이 기준 중위소득의 50% 이하이고, 부양요건을 충족하는 자에 대해 요양급여비용 중 본인이 부담하는 본인부담금을 경감하여 주는 사업'
