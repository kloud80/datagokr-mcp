description_portal: 이 데이터셋은 근로복지공단이 산재보험 급여로 지급한 진료비 지급 실적(2012년 기준)을 의료 서비스 제공 주체별로 세분화하여 분석한 종합 통계 자료입니다. 이 자료는 크게 두 가지 측면에서 병원 운영과 산재 의료 정책을 조망합니다.첫 번째 파일(근로복지공단_의료기관 등급별 진료비 지급현황(2012).csv)은 의료기관 등급별(상급종합병원, 종합병원, 병원, 의원 등) 진료비 지급 현황을 다룹니다. 핵심 항목은 수급자 수(명), 총 지급 일수(일), 진료비 지급 총액(백만원), 1인 평균 지급 일수(일), 그리고 1일 평균 진료비(원)와 같은 기본 통계입니다. 특히, 진료비가 기본 진료료, 약가, 행위 진료료 등으로 어떤 비율로 구성되어 있는지를 상세히 제공하여, 등급별 병원의 진료 형태와 원가 구조를 심층적으로 비교·분석할 수 있습니다.두 번째 파일(근로복지공단_의료기관별 입통원 진료비 지급현황(2012).csv)은 의료기관별 입원 및 통원(외래) 진료비 지급액의 2006년부터 2012년까지의 장기 시계열 추이를 담고 있습니다. 이를 통해 시간이 지남에 따라 각 의료기관 유형(상급종합병원, 종합병원 등)에서 입원과 외래 진료의 재정적 비중이 어떻게 변화해 왔는지 파악할 수 있습니다.이 통합 데이터는 산재보험 진료의 재정 효율성을 평가하고 의료 자원 배분의 적절성을 진단하는 데 필수적입니다. 정책 입안자는 이 자료를 활용하여 의료기관 등급별로 나타나는 진료비 지급 구조의 차이를 분석하고, 효율적인 공공 의료 재정 운용과 산재 환자의 합리적인 의료기관 선택을 유도하기 위한 정책적 근거를 마련할 수 있습니다.
