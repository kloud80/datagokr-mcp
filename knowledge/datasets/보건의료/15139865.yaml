summary_user: 대전광역시 중구에 설치신고된 자동심장충격기(AED)를 장비 한 대씩 담은 건별 원천 파일로, 설치기관명·도로명주소·사용여부·제조사·제조국·모델명·건물 안 설치장소를 담는다. 주민이나 시설 관리자가 '우리 동네 어느 건물 몇 층에 쓸 수 있는 AED가 있나'를 확인하거나, 분석가가 중구 내 AED 사용 가능 장비 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치기관명이나 도로명주소를 매칭해 붙여야 하며, 좌표가 필요하면 주소를 지오코딩해 응급의료기관 위치 등과 겹쳐 본다.
description_portal: 본 공공데이터는 대전광역시 중구 응급의료장비(AED) 설치신고현황에 대한 데이터로 순번, 설치기관명, 도로명주소, 장비사용여부, 제조사, 제조국가명, 모델명, 설치장소 등을 포함합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 장비사용여부는 설치신고된 해당 장비의 사용여부를 표기하고 있습니다.데이터 컬럼 중 설치장소는 해당 장비의 위치에 대한 상세정보를 표기하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
