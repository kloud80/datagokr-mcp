description_portal: '1. 검진사업년도: 2022년~2023년2. 직역: 공교, 지역, 직장3. 연령기준: 19세 이하, 20세~84세, 85세 이상(5세 단위)4. 대상인원 : 당해년도 일반건강검진 대상자 수5. 수검인원 : 당해년도 일반건강검진 수검자 수6. 정상 A : 검진 결과 건강이 양호한 자7. 정상 B : 검진 결과 건강에 이상이 없으나 식생활습관, 환경개선 등 자기관리 및 예방조치가 필요한 자8. 일반질환의심 : 검진결과 질환으로 발전할 가능성이 있어 추적검사나 전문 의료기관을 통한 정확한 진단과 치료가 필요한 9. 고혈압·당뇨병 질환의심 : 검진 결과 고혈압·당뇨병이 의심되어 치료와 관리가 필요한 자10. 유질환자 : 고혈압, 당뇨병, 이상지질혈증, 폐결핵으로 판정받고, 현재 약물 치료를 받고 있는 자 * 발췌기준   - 건강검진일자 : 당해 1월1일 ~ 당해 12월 31일  - 검진비지급일자: 당해 1월1일 ~ 다음해 3월31일※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
