summary_user: 경기도의료원이 외국인 근로자를 대상으로 시행하는 무료이동진료사업의 실적을 연월·병원 단위로 집계한 데이터로, 실인원·연인원 기준 진료실적과 지원금액을 담는다. 정책 분석가나 의료 지원 단체가 '병원별로 매달 외국인 근로자를 몇 명 진료했고, 지원금이 얼마나 집행됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 의료기관 데이터와는 병원명(HOSPTL_NM) 이름 매칭으로만 이어 쓴다.
description_portal: 경기도의료원에서 외국인 근로자를 대상으로 지원하는 공공의료사업인 무료이동진료사업의 실적 현황입니다. 연월별 지원금액, 지원인원 등의 정보를 제공합니다.이 데이터는 경기도에서 시행하는 외국인 근로자 대상 무료이동진료사업의 월별 실적을 병원 단위로 정리한 자료입니다. 항목에는 진료 시행 년월, 병원명, 실인원 기준 진료실적, 연인원 기준 진료실적, 지원금액이 포함됩니다. 해당 사업은 의료 사각지대에 있는 외국인 근로자들의 건강권 보장을 목표로 하며, 각 병원이 어느 정도 규모로 진료를 제공하고 있는지를 수치로 확인할 수 있습니다. 데이터는 진료 접근성 분석, 지역별 의료자원 분포, 정책 효과 분석 등에 활용 가능하며, 실적 및 지원금액 데이터를 통해 예산 집행의 효율성도 평가할 수 있습니다.
