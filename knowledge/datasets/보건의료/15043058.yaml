summary_user: 대구광역시 달성군 내 약국을 한 곳씩 담은 건별 목록으로, 사업장명·인허가일자·영업상태·도로명주소·위경도를 포함하며 포털에서 csv 파일(약 13KB)로 받는다. 달성군 주민이나 분석가가 '우리 동네 영업 중인 약국은 어디에 있고 언제 문을 열었나'를 확인하거나, 약국 개폐업을 지역 상권 신호로 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 위경도 기반 공간 결합으로 이어 써야 하며, 관리번호는 같은 인허가 체계(LOCALDATA) 자료와 대조할 때 참고한다.
limits: 실측 컬럼에서 전국 공통 조인 키가 확인되지 않아 다른 기관 데이터와 직접 키 결합은 안 되고 이름·주소 매칭에 기대야 한다. 범위는 달성군 한 곳의 개별 약국 단위라 다른 시군구나 전국 비교에는 별도 자료가 필요하다.
