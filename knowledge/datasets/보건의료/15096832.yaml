summary_user: 제주 지역 주민 건강 설문조사의 건강 인지율을 기준 연도와 시군구별로 집계한 통계로, 응답자 수, 조율(粗率), 표준인구 기준 표준화율, 각 비율의 표준오차를 담는다. 보건 담당자나 분석가가 '제주시와 서귀포시의 주민 건강 인지율이 연도별로 어떻게 다르고, 인구 구조를 보정해도 차이가 남는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 기준 연도와 시군구 이름을 맞추는 방식으로만 연결한다.
description_portal: 이 데이터셋은 제주특별자치도가 제공하는 ‘건강 인지율’ 통계로서, 제주 지역 주민을 대상으로 한 건강 관련 설문조사 결과를 정리한 것이다. 자료에는 “조율율”(전체 모집단 대비 발생건수 비율), “표준화율”(표준인구 기준으로 보정한 비율), 그리고 통계의 표준오차가 포함되어 있어, 인구 구조 차이를 고려한 비교 가능성과 통계적 신뢰성을 확보하고 있다. 이 데이터는 주민의 주관적 건강 인지도, 고혈압·당뇨 등 만성질환 수치 인지율, 스트레스나 건강행태 관련 인식 정도 등을 파악할 수 있는 근거 자료로 활용되며, 보건정책 수립, 건강증진 사업 설계, 지역 맞춤형 의료 서비스 제공, 공공보건 자원 배분, 건강 형평성 평가 등 보건 행정·정책의 기초 통계로 매우 유용하다.
