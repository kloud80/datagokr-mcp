summary_user: 부산광역시 연제구 관내에서 영업 중인 치과기공소를 한 곳씩 담은 목록 파일로, 상호명·도로명 소재지·우편번호·전화번호를 담는다(csv 약 5KB). 연제구에서 치과 보철물 제작을 맡길 기공소를 찾거나, 구 단위 치과 관련 업소 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 상호명으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 부산광역시 연제구 치과기공소 현황입니다.영업 중인 관내 치과기공소 데이터를 제공합니다.상호명, 소재지(도로명 주소), 우편번호, 전화번호의료기사 등에 관한 법률 제11조의2① 치과의사 또는 치과기공사가 아니면 치과기공소를 개설할 수 없다.② 치과의사 또는 치과기공사는 1개소의 치과기공소만을 개설할 수 있다.③ 치과기공소를 개설하려는 자는 보건복지부령으로 정하는 바에 따라 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장(자치구의 구청장에 한한다. 이하 같다)에게 개설등록을 하여야 한다. ④ 제3항에 따라 치과기공소를 개설하고자 하는 자는 보건복지부령으로 정하는 시설 및 장비를 갖추어야 한다.
