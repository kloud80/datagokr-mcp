summary_user: 경기도 시군별 정신건강복지센터를 센터 한 곳당 한 행으로 담고, 센터명·시군명·도로명/지번 주소·우편번호·전화번호·위경도 좌표와 집계년도(SUM_YY)를 함께 제공한다. 도민이나 상담 연계 담당자가 '우리 시군의 정신건강복지센터는 어디이고 연락처는 무엇인가'를 찾을 때나, 분석가가 시군별 센터 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD)로 맞추거나 위경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 「정신 건강 복지센터 현황」 데이터는 경기도 내 각 시군에 설치된 정신건강복지센터의 정보를 제공하는 자료입니다. 주요 항목은 센터명(CENTER_NM), 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 우편번호(REFINE_ZIP_CD), 전화번호(TELNO), 위도·경도 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT) 등입니다. 정신건강복지센터는 도민 누구나 이용할 수 있으며, 우울증, 조현병, 조울증 등 정신질환 예방과 치료 지원, 심리상담, 위기개입 서비스를 제공합니다. 이 데이터는 경기도민의 정신건강 인프라 분포를 파악하고, 보건복지 정책 수립, 지역별 상담 서비스 접근성 분석, 의료·복지기관 연계 연구 등에 활용할 수 있습니다. 또한 집계년도(SUM_YY) 항목이 포함되어 있어 연도별 센터 운영 현황을 비교·분석하는 데에도 유용합니다.
