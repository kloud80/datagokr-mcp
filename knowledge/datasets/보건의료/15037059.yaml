summary_user: 청주시 병의원 등에서 운영하는 진단용 방사선 발생장치와 특수의료장비를 장비 1대 단위로 담은 원천 목록이며, 의료기관 종별·기관명·주소·장치 명칭·모델명·형식명·자료기준일 7개 항목이 구청별 시트로 나뉜 엑셀 파일(약 127KB)이다. 보건 담당자나 분석가가 '청주시 어느 구에 CT·MRI 같은 장비를 둔 의료기관이 몰려 있는가'처럼 지역별 장비 분포나 방사선 안전관리 대상을 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의료기관 인허가 데이터와는 의료기관명·주소를 맞춰 이어 써야 한다.
description_portal: 충청북도 청주시 병원 등에서 운영하고 있는 진단용 방사선 발생장치 및 특수의료장비 현황 데이터입니다. 제공되는 데이터는 2개의 파일(엑셀)이며, 하나의 파일로 압축되어있습니다. 진단용 방사선 발생장치는 및 특수의료장비 현황 데이터는 의료기관종별, 의료기관명, 의료기관주소, 장치명칭, 장치모델명, 장치형식명, 자료기준일으로  총 7개 항목으로 각각 이루어져 있습니다. 구청별로 시트를 구분하여 제공하고 있습니다. 이 데이터는 방사선 안전관리, 의료장비 수급계획 수립, 응급의료 대응체계 강화, 지역 간 의료격차 분석 등 다양한 보건정책 수립의 기초자료로 활용될 수 있습니다. 특히 공공보건기관, 연구기관, 의료기기 산업체 등에서 의료자원 배분과 정책 타당성 검토에 실질적인 근거자료로 활용 가능합니다.
