summary_user: '경주시 관내에 설치된 폐의약품 수거함을 한 곳당 한 행으로 담은 파일로, 설치장소와 도로명 주소가 들어 있다(csv 약 3.8KB 규모). 시민이 집 근처에서 유통기한 지난 약을 버릴 수 있는 수거함이 어디 있는지 찾거나, 분석가가 수거함 배치가 지역별로 고른지 살펴보는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 도로명 주소를 지오코딩하거나 설치장소 이름(예: 약국·보건소 명칭)으로 맞춰 이어 쓴다.'
description_portal: 본 데이터는 경상북도 경주시 관내에 설치된 폐의약품 수거함의 위치 및 관리 현황을 정리한 파일 형태의 공공데이터이다. 폐의약품은 가정 등에서 사용하고 남은 약 중 유효기간이 지났거나 사용하지 않는 의약품으로, 일반 쓰레기로 배출될 경우 수질오염과 생태계 교란 등 환경 문제를 유발할 수 있다. 이에 따라 경주시는 약국, 보건소, 공공기관 등에 폐의약품 수거함을 설치하고 이를 통해 안전하고 체계적인 약품 회수·처리 체계를 운영하고 있다. 데이터에는 수거함 설치 장소, 도로명 주소 등의 항목이 포함되어 있으며, 시민 참여형 환경보호 및 올바른 약물 폐기를 위한 정책 기반 자료로 활용 가능하다. 본 자료는 정기적으로 갱신되며, 약물 오남용 예방 및 폐기물 행정에 활용될 수 있도록 개방된다.
