summary_user: 경기도의료원 소속 공공의료기관이 운영하는 중증장애인치과의 진료 실적을 병원별·월별로 집계한 자료로, 진료 연인원, 대불금액, 감면금액을 담는다. 장애인 보건정책 담당자나 분석가가 '경기도 각 의료원 병원에서 중증장애인 치과 진료가 매달 몇 명에게 이뤄지고 감면 지원 규모는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 의료기관 데이터와는 병원명(HOSPTL_NM)으로 이름을 맞추거나 같은 기관 자료끼리 연결해야 한다.
description_portal: 경기도의료원에서 제공하는 공공의료사업인 중증장애인치과운영 실적 현황입니다. 진료인원, 대불금액, 감면금액 등의 정보를 제공합니다.이 데이터는 경기도 내 공공의료기관에서 운영하는 중증장애인치과의 진료 실적 현황을 월별로 집계한 자료입니다. 주요 항목에는 진료가 이뤄진 년월, 병원명, 진료실적(연인원), 대불금액, 감면금액이 포함되어 있으며, 이를 통해 지역별 병원에서 중증장애인을 대상으로 한 치과 진료 지원 규모를 파악할 수 있습니다. 본 데이터는 공공의료 접근성 분석, 장애인 대상 보건복지 정책 수립, 진료 비용 지원 제도의 효과 평가 등에 활용 가능하며, 실적별 예산 집행 현황과 감면 혜택 범위를 파악하는 데도 유용합니다.
