description_portal: '○ 통계개요* 통계명 : 모자보건사업* 통계종류 : 서울시 모자보건사업 실시 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「모자보건법」에 근거하여 실시되는 모자보건사업* 작성목적 : 대상이 되는 개인 또는 집단의 특성ㆍ건강수준 등에 따라 적절한 보건사업을실시하고, 모든 국민이 건강생활을 실천할 수 있도록 보건복지정책 수립의기초 자료로 활용하는 것을 목적으로 함* 조사체계 : 보건소 → 자치구 → 서울특별시 건강증진과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 임산부와 영유아 등록 및 건강검진사업 실적 현황○ 용어설명* 모자보건사업 : 모성과 영유아에게 전문적인 보건의료서비스 및 그와 관련된 정보를제공하고, 모성의 생식 건강 관리와 임신ㆍ출산ㆍ양육 지원을 통하여이들이 신체적ㆍ정신적ㆍ사회적으로 건강을 유지하게 하는 사업을 말함○ 기 타* 관할 보건소 모자보건사업 실적에 한함'
