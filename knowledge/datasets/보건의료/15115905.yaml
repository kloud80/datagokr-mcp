summary_user: 서울 중구 안에서 편의점·휴게소처럼 약국이 아닌 곳에서 안전상비의약품을 팔도록 인허가를 받은 업소를 업소 한 곳당 한 행으로 담는다. 각 행에는 사업장명, 인허가·취소일자, 영업상태와 상세상태, 지번·도로명 주소, 전화번호, 중부원점TM 좌표(X, Y)가 들어 있다. 중구 주민이나 분석가가 '밤에 약국이 닫았을 때 근처에서 해열제를 살 수 있는 편의점이 어디인가'를 찾거나 판매업소 분포를 볼 때 쓰며, 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '본 데이터는 서울특별시 중구 관내에서 안전상비의약품을 판매할 수 있도록 인허가를 받은 업소에 대한 정보를 수록한 자료입니다. 수록 항목에는 업소명, 대표자, 소재지, 인허가일자, 허가상태, 업소유형, 관리기관 등으로 구성되어 있으며, 지역 주민의 응급 의약품 접근성을 높이기 위한 목적으로 제공됩니다. 해당 자료는 「약사법」에 따라 등록된 편의점, 휴게소 등 일반 판매시설의 정보를 기반으로 하며, 일반 시민이 약국 이외의 장소에서 필요한 의약품을 빠르게 구입할 수 있도록 지원합니다. 보건 당국 및 관련 기관은 이를 통해 의약품 접근성 평가, 판매업소 관리, 보건정책 수립 등의 업무에 활용할 수 있습니다. 데이터는 정형화된 구조로 제공되어 다양한 통계 분석 및 서비스 개발 등에 재사용이 가능합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
