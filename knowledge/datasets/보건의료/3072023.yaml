description_portal: '부산광역시 기장군  관내 의료기관의 특수의료장비(MRI, CT, Mammography)의  설치현황(의료기관명, 총 병상수, 자체 병상수, 공동활용 병상수, 의료장비명, 의료장비 제조사, 의료장비 제조국 등)을 등록합니다. 또한  관내 설치되어 운영중인 특수의료장비(MRI, CT)의 공동활용병상 현황(총병상수, 자체병상수, 공동활용병상수)을 등록합니다.[참고 1] 특수의료장비의 종류: 자기공명 영상 촬영장치(MRI), 전산화 단층 촬영장치(CT), 유방촬영용장치(Mammography)[참고 2] 특수의료장비의 설치인정기준 중 시설기준: 자기공명영상촬영장치(200병상 이상인 의료기관), 전산화단층촬영장치(200병상 이상인 의료기관)단, 200병상 미만인 의료기관이 특수의료장비를 설치하려면 다른 의료기관과 공동활용 하여야 하고, 이 경우 공동활용하기 위하여 특수의료장비 공동활용 동의서를 제출한 의료기관과의 병상합계가 200병상 이상 되어야 한다.'
