description_portal: '강원특별자치도 보건기관* 및 의료기관의 공중보건의사 배치 현황에 대한 자료로 공중보건의사 근무기관, 근무지 주소, 행정전화번호 등으로 구성된 데이터입니다.  * 보건기관: 보건소, 보건의료원, 보건지소  * 근무기관      1) 보건기관: 보건소, 보건의료원, 보건지소      2) 국가·지자체·공공단체가 설립·운영하는 병원으로서 보건복지부장관이 정하는 병원: 지방의료원, 권역재활병원 등      3) 공중보건사업의 위탁사업을 수행하는 기관 또는 단체: 한국한센복지협회 등      4) 보건의료정책을 수행할 때 공중보건의사의 배치가 필요한 기관 또는 시설: 이동진료반, 응급의료 관련 기관 등  * 의사종별: 의과, 치과, 한의과  * 진료부서 및 전문과목: 공중보건의사의 진료과 및 전문과목  * 행정전화번호 및 주소: 공중보건의사의 근무지 정보[참고] 공중보건의사는 「농어촌 등 보건의료를 위한 특별조치법」에 따라,  공중보건업무에 종사하기 위하여  「병역법」제34조제1항에 따라 공중보건의사에 편입된 의사, 치과의사 또는 한의사로서 보건복지부 장관으로부터 공중보건업무에 종사할 것을 명령 받은 사람을 말합니다.'
