summary_user: 서울특별시 양천구 관내 치과기공소(인공 치아를 만들거나 고치는 업소)의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일·폐업일·영업상태·소재지 주소·좌표와 함께 기공용 장비 종류별 보유 대수를 포함한다. 양천구에서 지금 영업 중인 치과기공소가 어디에 있고 언제 문을 열거나 닫았는지, 장비를 얼마나 갖추고 있는지 알아보는 데 쓰고, 병의원 개폐업처럼 지역 의료 관련 업소의 변동을 보는 신호로도 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관(개방자치단체) 코드로만 이어 붙인다.
description_portal: 서울특별시 양천구가 제공하는 본 데이터는 관내 치과기공소의 인허가 정보를 종합적으로 집계한 자료이다. 데이터에는 인허가 날짜, 업체명, 영업상태, 소재지 외에도 치아기공에 필요한 장비갯수 등의 핵심 항목이 포함되어 있어 각 치과기공소의 설립과 운영 실태를 체계적으로 확인할 수 있도록 구성되어 있다. 본 자료는 행정 담당자가 시설 관리, 감독, 안전 점검, 정책 수립 등 행정 업무에 활용할 수 있으며, 연구자와 시민은 지역별 치과기공소 분포, 장비 현황, 서비스 제공 실태 분석에 유용한 정보 자원으로 활용할 수 있다.*양천구의 인공 치아를 제작하거나 보수하는 업소정보입니다.
