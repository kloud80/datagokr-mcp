summary_user: 광양시 관내 응급실을 병원 한 곳당 한 행으로 담은 파일(315바이트의 소규모 CSV)로, 응급의료기관 구분(권역·지역응급의료센터·응급실), 병원명, 주소·우편번호, 전화번호, 전문의 인원, 데이터기준일이 들어 있다. 광양 시민이 밤에 갈 수 있는 응급실과 연락처를 확인하거나, 분석가가 시 안의 응급실 분포와 전문의 배치를 살필 때 쓴다. 전역 조인 키(기관코드 등)가 없어 다른 응급의료 데이터와는 병원명·주소를 맞춰 붙여야 한다.
description_portal: 응급실 운영 현황은 지역 내 응급 의료체계의 가용성을 보여주는 자료입니다. 주요 항목에는 연번, 구분(권역응급의료센터·지역응급의료센터·응급실), 병원명, 위치, 주소, 전화번호, 우편번호, 전문의, 데이터기준일이 포함됩니다. 이를 통해 해당 지역의 응급실 분포, 전문의 인력 배치 현황, 병원의 위치 정보와 연락 수단을 종합적으로 파악할 수 있습니다. 해당 자료는 응급환자 발생 시 신속한 이송 및 치료 체계 확립을 위한 기초 자료로서, 시민들이 응급의료 접근성을 확인하거나 지자체가 응급의료 자원을 관리·계획하는 데 중요한 참고 자료로 활용됩니다. 또한 지역별 의료 불균형 해소, 권역별 응급의료 네트워크 강화, 응급 대응 시간 단축을 위한 정책적 의사결정에 기여합니다.
