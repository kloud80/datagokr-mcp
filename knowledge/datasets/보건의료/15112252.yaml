description_portal: 본데이터는 관악구 안심귀가스카우트의 연도·월별 이용실적 현황을 나타낸 데이터입니다. 본데이터는 이용연월, 이용실적(건수), 데이터기준일자를 항목으로 포함합니다. 각 월별 귀가지원 요청 건수를 통해 지역 내 야간 보행 안전수요의 변화 흐름을 확인할 수 있으며, 특정 시기 증가·감소 패턴 분석도 가능합니다. 본 데이터는 여성·청소년 안전정책 평가, 심야 시간대 안전서비스 공급계획 수립, 귀갓길 취약지역 보완 등 정책적 활용에 적합합니다. 또한 다른 방범 인프라(안심비상벨, CCTV, 가로등 보강 등)와 연계한 안전망 구축 효과를 검토하는 기초자료로도 활용할 수 있습니다.서울특별시 관악구 2020년 2월부터 집계한 코로나 19 일별·행정구역(동)별 확진자 통계- 관악구 주민 외 우리구에서 검사 받은 타구 및 타지역 확진자 포함
