summary_user: 경상남도 창녕군 안의 치과의원을 기관 한 곳당 한 행으로 담은 현황 파일로, 기관명·도로명주소·전화번호·진료과목(통합치의학과, 보철, 소아치과, 교정과 등)이 들어 있다. 창녕군 주민이 집 근처에서 소아치과나 교정 진료를 하는 치과를 찾고 연락처를 확인할 때 쓰며, 분석가는 군 단위 치과 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 자료 등과는 기관명이나 도로명주소를 맞춰서만 이을 수 있다.
description_portal: 경상남도 창녕군의 의료기관 중 치과의원 현황입니다.1. 치과의원의 명칭, 치과의원의 대표자, 치과의원의 주소(도로명주소), 진료과목(통합치의학과, 보철, 소아치과, 치주과, 교정과, 예방치과 등), 치과의 연락처(일반 전화번호) 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 8일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 보건소 보건정책과 의약관리팀 055-530-7523으로 문의 주시기 바랍니다.
