summary_user: 국립춘천병원 한 곳의 입원·외래 수입금을 연월(구분) 단위로 집계한 파일로, 입원은 건강보험·의료급여·일반, 외래는 건강보험·의료급여·일반·기타로 나눠 환자 납부액을 담는다. 공공병원 재정 분석가가 이 병원의 월별 수입이 건강보험과 의료급여 중 어디에 얼마나 기대는지, 입원과 외래 비중이 어떻게 바뀌는지 볼 때 쓴다. 다른 데이터와 묶을 전역 조인 키는 없어 연월 기준이나 같은 기관(국립춘천병원) 이름으로만 다른 진료실적·예산 자료와 맞춰 쓴다.
description_portal: 국립춘천병원의수입금 현황 데이터입니다. 구분 항목에는 연월 정보가 담겨 있어 특정 기간의 데이터를 쉽게 식별할 수 있습니다. 입원과 외래 수입금은 건강보험, 의료급여, 일반, 기타 등으로 세분화되어 있으며, 각 항목은 해당 수납 방식 및 보험적용 여부를 기반으로 환자들이 납부한 금액을 의미합니다. 입원건강보험과 외래건강보험은 건강보험 혜택을 받은 환자가 납부한 금액을, 입원의료급여와 외래의료급여는 기초생활수급자 혜택을 적용받은 환자의 납부 금액을 나타냅니다. 입원일반과 외래일반 항목은 보험 혜택 없이 납부한 금액을 나타내며, 외래기타 항목은 그 외의 기타 환자들의 납부 내역을 포함합니다.
