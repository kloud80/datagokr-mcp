summary_user: 충청남도 보령시 안의 의료기관을 한 곳씩 담으며, 기관명·전화번호·주소·의료기관 구분·정보 기준일자를 개별 주소 단위로 조회하는 API이다. 보령시 주민이나 분석가가 "보령에서 이 이름의 병원·의원 연락처와 주소는 무엇인가"를 확인하거나 지역 병의원 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소 문자열을 맞춰서만 이어 쓸 수 있다.
description_portal: 의료기관명을 통해 전화번호, 주소 등의 의료기관정보를 조회하는 보령시의료기관조회서비스
