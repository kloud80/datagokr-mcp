description_portal: '서울특별시 서초구 관내 의료기기판매(임대)업에 대한 인허가 정보를 제공합니다. 의료기기판매업은 병원, 의원, 약국, 요양시설 등 의료기관에 필요한 각종 의료기기를 구매 또는 임대 방식으로 공급하는 사업을 의미하며, 이 데이터는 해당 업소들의 인허가일자, 영업상태, 전화번호, 주소, 사업장명 등을 포함합니다. 의료기기 임대는 고가 장비나 단기간 사용 목적의 장비를 효율적으로 활용할 수 있도록 지원하는 중요한 방식입니다. 이 데이터는 지역 내 의료기기 유통현황을 파악하거나 보건소 및 공공기관의 장비 수급 계획 수립, 긴급 의료장비 공급체계 마련 등 보건의료 행정 전반에 활용될 수 있으며, 민간의료기관의 장비 도입에도 유용한 참고자료가 됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
