description_portal: 질병관리청은 결핵 감시체계를 통해 전국에서 발생하는 결핵환자에 대한 신고와 보고를 관리하며, 이를 기반으로 국가 차원의 결핵 발생 동향을 체계적으로 파악하고 있습니다. 본 자료는 국가승인통계인 ‘결핵환자신고현황’의 일부로, 연도별 및 월별 결핵환자 발생 통계를 제공합니다. 제공 범위는 2005년 1월부터 2025년 12월까지의 월별 신고 건수로 구성되어 있으며, 이를 통해 장기 추세 분석과 연도 간 비교가 가능합니다. 또한 결핵환자 신고현황 연보에 포함되는 공식 통계수치는 매년 익년 3월 말경 확정되어 공표되므로, 본 자료는 결핵 감시 및 예방정책 수립을 위한 기초 자료로 활용될 수 있습니다.
