summary_user: 경기도 내 병원의 폐렴 진료 평가 결과를 의료기관 한 곳당 한 행으로 담으며, 시군명·기관명·구분·평가등급과 지번·도로명 주소, 우편번호, WGS84 좌표가 들어 있다. 환자나 가족이 '우리 시군에서 폐렴 진료 평가등급이 좋은 병원은 어디인가'를 찾거나, 분석가가 시군별 폐렴 진료 병원 분포를 지도로 비교하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명으로 다른 경기도 시군 단위 데이터와 묶거나, 기관명·주소·좌표를 매칭해 의료기관 인허가 등 다른 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 병원의 폐렴 진료에 대한 평가 정보를 제공하며, 의료기관명, 시군명, 평가등급, 소재지 주소, 위치정보(WGS84 좌표) 등을 포함하고 있습니다. 폐렴 진료 서비스 수준이 양호한 병원의 정보를 확인할 수 있으며, 공공의료 및 만성질환 대응 정책 수립의 기초자료로 활용됩니다. 이 데이터는 지역별 폐렴 진료 인프라의 질적 분석, 감염병 대응 역량 평가, 환자 정보 제공, 의료기관 운영 평가, 보건의료 균형정책 마련 등에 활용할 수 있습니다. 데이터는 지역 보건의료체계 내 폐렴 진료 전문성 확보 및 감염병 예방 대응을 위한 근거자료로 사용됩니다.
