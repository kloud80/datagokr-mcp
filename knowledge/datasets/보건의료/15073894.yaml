summary_user: 의료기기 유해사례 보고 건별로 대상업체명, 유해사례 인지일·발생일·종료일, 최초보고일자, 보고일련번호와 함께 품질관리 수거검사·사용중지·회수폐기·서한발송 등 후속조치 유형을 담은 전국 범위의 원천 데이터다. 특정 업체나 의료기기에서 유해사례가 보고된 뒤 회수·사용중지 같은 행정조치가 실제로 내려졌는지, 그 조치가 언제 이뤄졌는지를 확인하려는 의료기관·제조수입업체·안전성 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 식약처 의료기기 데이터와는 업체명이나 사업자등록번호(BRNO) 같은 이름·코드 매핑으로만 연결한다.
limits: 다른 데이터와 바로 이어 붙일 공통 키가 없어 업체명·사업자번호 매핑에 의존해야 한다. 행정구역 단위 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓰지 못한다. 호출은 포털 활용신청 후 serviceKey로 하며 개발계정은 하루 10,000회로 제한된다.
