description_portal: 이 공공데이터는 식품의약품안전처에서 제공하는 의료기기 유해사례별 후속조치 정보입니다.  이 공공데이터는 대상업체명과 유해사례인지일 발생일 종료일을 통해 사건의 기본 정보와 시간적 경과를 파악할 수 있습니다 보고일련번호로 각 사례를 고유하게 식별하며 조치대상을 명시하여 대응 범위를 명확히 합니다.  후속조치는 품질관리 수거검사, 사용중지, 회수폐기, 시험검토, 자문요청, 서한발송, 홍보요청, 홈페이지공개 기타내용 등 다양한 행정조치를 포함합니다.  그 외 최초보고일자도 확인할 수 있습니다.
