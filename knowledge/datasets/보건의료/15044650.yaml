summary_user: 경상북도 영천시 관내에 등록된 안전상비의약품 판매업소를 업소 한 곳당 한 행으로 담은 목록 파일(csv, 약 4KB)로, 상호·소재지 주소·전화번호를 담는다. 시민이 "밤늦게 집 근처에서 해열제나 소화제 같은 상비약을 파는 편의점이 어디 있나"를 찾거나, 보건소·분석가가 읍면동별 판매업소 분포를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호나 주소 문자열을 맞추는 방식으로만 이어 쓰며, 주소를 좌표로 바꾸면 약국·의료기관 위치 데이터와 겹쳐 볼 수 있다.
