summary_user: 식약처장이 지정한 의료기기 비임상시험실시기관을 기관 한 곳씩 담은 목록으로, 지정번호·지정일자·기관명·주소와 시험분야·시험항목을 전국 범위로 제공한다. 의료기기 제조·수입업체가 생체적합성 시험을 맡길 때 "이 시험항목을 수행할 수 있는 지정기관이 어디에 있는가"를 찾는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 기관명이나 주소를 기준으로 맞추거나 같은 식약처 데이터와 이름 매핑으로만 연결한다.
description_portal: 이 공공데이터는 「의료기기법 시행규칙」제24조의2(비임상시험실시기관이 지정 등) 제7항에 따라 식약처장이 지정한 의료기기 비임상시험실시기관의 명칭, 소재지 및 대표자 등을 공개하고 있습니다. 의료기기 제조·수입업체가 필요한 생체적합성 시험의뢰시에 시험 가능한 비임상시험실시기관의 접근 편의성 제고를 위하여 식품의약품안전처(MFDS)에서 공개 중인 의료기기 비임상시험실시기관 지정정보를 목록으로 제공하고 있습니다. 제공하는 목록으로는 비임상시험실시기관일련번호,기관지정번호,지정일자,기관명,주소,시험분야,시험항목 등이 있습니다.
