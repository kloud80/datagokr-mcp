description_portal: 전북특별자치도 순창군 관내의 의무 소독 대상시설 현황(시설구분, 시설명,  주소)입니다. 시설명과 도로명 주소를 포함하고 있습니다. 호텔 및 여관 관광숙박업소 현황과 식품접객업소 현황, 운수업체 및 대합실 현황, 대규모점포 현황, 병원 현황, 집단급식시설 현황, 기숙사 등 현황, 학교시설 현황 등의 데이터입니다.본 데이터는 전북특별자치도 순창군 관내에서 관련 법령에 따라 의무적으로 소독을 실시해야 하는 시설의 현황을 수록한 자료입니다. 숙박업소, 식품접객업소, 병원, 교육기관, 대중교통시설, 전통시장, 공연장, 공동주택 등 다양한 업종의 시설이 포함되어 있으며, 시설명, 도로명 주소, 업종 정보를 포함합니다. 해당 데이터는 감염병 예방 및 위생관리 강화를 위한 정책 수립, 방역대상 파악, 민원 대응 등의 행정업무에 활용될 수 있습니다. 또한, 주민의 위생환경 정보 접근성을 제고하고, 공공 보건안전 증진을 위한 기초자료로 제공됩니다. 데이터는 공공기관 및 민간의 효율적인 방역 대응을 지원합니다.
