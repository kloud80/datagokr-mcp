description_portal: 전국 어린이집을 대상으로 실시하는 흡연위해예방교육 신청정보 - 년도, 구분, 지역, 교육활동, 교육시작일자, 교육종료일자, 방문기관수 등의 항목을 제공합니다.- 유아에게 흡연의 위해성에 관한 올바른 정보를 제공하여, 평생 건강한 생활을 유지할 수 있도록 교육서비스 등을 제공- 유아는 가까운 어른의 행동을 따라 하는 욕구가 있으므로 흡연의 위해성 지식 함양으로 올바른 판단을 할 수 있도록 도와주어야 하며, 청소년기 이전 조기 흡연예방교육이 필요- 전국 유치원, 어린이집 등을 직접 찾아가 유아의 눈높이에 맞는 흡연위해예방교육을 제공하며, 아이들이 흡연의 위해성에 대한 올바른 지식을 함양할 수 있도록 교육하는 프로그램- 놀이형 체험관을 운영하여 아이들이 놀이하며 체험할 수 있는 공간을 제공
