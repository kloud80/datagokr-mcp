description_portal: 경상북도 경주시에서 관리하는 외국인 환자 유치 등록 의료기관 현황 데이터이다. 본 자료는 「의료 해외진출 및 외국인환자 유치 지원에 관한 법률」에 따라 외국인 환자 유치 등록을 완료한 의료기관의 정보를 제공한다. 데이터는 번호, 의료기관명, 주소(도로명주소) 항목으로 구성되어 있으며 등록 의료기관의 명칭과 소재지를 확인할 수 있다. 행정기관은 외국인 환자 유치 정책 추진과 의료서비스 현황 관리에 활용할 수 있으며, 관련 기관은 의료관광 기반시설 및 서비스 제공 현황을 파악하는 자료로 활용할 수 있다. 또한 국내외 이용자는 외국인 환자 진료가 가능한 등록 의료기관 정보를 확인하는 데 참고할 수 있다. 본 데이터는 경주시 의료서비스 경쟁력 향상과 의료관광 활성화를 지원하기 위한 기초자료이다.
