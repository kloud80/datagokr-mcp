description_portal: 광주광역시 동구의 동별 전동보장구 지급현황 데이터는 지역 내 거동이 불편한 주민들을 지원하기 위해 지급된 전동보장구의 현황을 정리한 자료로, 2016년부터 2021년까지 13개 동에서 이루어진 지급 내역을 포함하고 있습니다. 이 데이터는 전동휠체어, 전동스쿠터 등 이동 보조기구가 어떤 동에서 얼마나 지급되었는지를 파악할 수 있도록 구성되어 있으며, 복지 정책의 수요 분석과 향후 지원 계획 수립에 중요한 근거가 됩니다.해당 자료를 통해 연도별·동별 지급 추이를 비교함으로써 특정 지역에서 얼마나 많은 전동보장구 요청이 있었는지, 장애인·고령층 등 이동취약계층의 분포가 어떻게 변화하고 있는지를 파악할 수 있습니다. 또한 지급량 증감에 따라 지역별 복지 인프라의 필요성을 평가하거나 향후 예산 배분과 복지정책 방향을 설정하는 데에도 활용됩니다.이 데이터는 동구의 이동복지서비스 제공 현황을 투명하게 보여주는 자료이자, 주민의 이동권 보장과 생활 편의 증진을 위한 행정적 기반 정보를 제공합니다.
