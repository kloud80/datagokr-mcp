summary_user: 보건소 모바일 헬스케어 앱에서 서비스관리자와 참여자가 소통하려고 작성한 커뮤니티 게시글을 글 한 건 단위로 담으며, 작성일·제목·내용 세 항목으로 구성된 약 9.9KB 규모의 작은 CSV 파일입니다. 보건소 모바일 헬스케어 사업 담당자나 분석가가 "참여자에게 어떤 안내·공지가 언제 나갔고, 소통 주제는 무엇이었나"를 살펴보는 데 쓴다. 보건소코드·시군구코드 같은 전역 조인 키가 없어 다른 데이터와는 작성일 기준 시기 비교나 같은 기관(한국건강증진개발원) 자료와의 수작업 대조로만 이어 쓴다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.보건소 모바일 헬스케어 모바일 앱에서 서비스관리자와 서비스 참여자간 소통창구의 목적으로 작성된 커뮤니티 정보입니다. 작성일, 제목, 내용 정보를 제공합니다.
