description_portal: 식품의약품안전처에서 제공하는 ‘분류별 마약류품목정보’ 데이터는 국내에서 허가·관리되고 있는 마약, 향정신성의약품, 대마 등 마약류의 품목 현황을 분류 기준에 따라 제공합니다. 이 데이터에는 품목명, 성분명, 제형, 마약류 구분, 허가일자, 제조·수입업체, 취하·취소 여부 등의 항목이 포함되어 있어 마약류의 관리 현황을 확인할 수 있습니다. 이를 통해 의료기관과 약국은 마약류 취급 시 법적 요건을 준수할 수 있고, 연구기관과 제약사는 합법적 연구 및 의약품 개발에 참고할 수 있습니다. 또한 보건당국은 마약류 유통 관리, 정책 수립, 안전성 확보, 연구·분석 등 다양한 분야에서 본 데이터를 활용할 수 있어 사회적 위해 예방에 기여합니다.
