summary_user: 국내에서 허가·관리되는 마약류(마약·향정신성의약품·대마 등)의 품목 현황을 분류별로 담은 전국 단위 비공간 API입니다. 다만 실제 필드는 허가일자(PRDLST_PRMSN_YMD)와 수입·제조·향정·마약·대마·원료 등 구분별 건수로 보여, 품목 원천 목록보다는 허가일자별 분류 집계에 가깝습니다. 연구자나 보건당국이 특정 시기에 허가된 마약류 품목이 향정신성의약품과 마약 중 어느 쪽에 많았는지, 제조와 수입 중 어느 쪽이 많았는지 볼 때 쓰며, 전역 조인 키가 없어 다른 식약처 품목·약가 데이터와는 날짜나 이름 매핑으로만 이어 쓴다.
limits: 실측 컬럼에 품목기준코드 같은 전역 조인 키가 없어 심평원 약가·급여 목록 등과 직접 연결하지 못하고, 날짜·이름 매핑이나 같은 기관 코드로만 연결한다. 필드 명세에 의미 설명이 비어 있어, 각 건수 항목의 정확한 정의는 원 명세나 실제 응답으로 확인해야 한다.
