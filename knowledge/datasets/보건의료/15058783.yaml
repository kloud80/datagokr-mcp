summary_user: 경기도 내 위생처리업(주로 물수건 위생처리업) 사업장을 한 행씩 담은 인허가 원천 목록으로, 사업장명·인허가일자·폐업일자·영업상태·위생업종과 업태, 도로명·지번 주소와 WGS84 좌표를 포함한다. 위생 행정 담당자나 분석가가 '우리 시군에서 영업 중인 물수건 위생처리업체는 몇 곳이고 어디에 있는가', '최근 폐업이 늘었는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 같은 기관의 다른 경기도 인허가 데이터나 행정구역 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 위생처리업체의 인허가 및 운영 현황을 정리한 자료로, 주로 물수건 위생처리업을 중심으로 구성되어 있습니다. 각 사업장별 인허가일자와 폐업일자, 영업상태(운영중·폐업 등), 위생업종 및 업태명이 기록되어 있으며, 도로명주소·지번주소·우편번호와 함께 WGS84 기준의 위도·경도 좌표가 제공됩니다. 이를 통해 지역별 업체 분포와 운영 현황을 파악할 수 있으며, 위생관리 기준 충족 여부나 업소 관리 추세를 분석하는 데 활용할 수 있습니다. 이 데이터는 위생 안전 관리, 지역 위생업 인프라 분석, 다중이용시설의 위생 점검, 공공위생 정책 수립 등 다양한 연구 및 행정적 목적으로 유용하게 쓰일 수 있습니다.
