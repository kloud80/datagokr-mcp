summary_user: 대전광역시 서구에 지정된 감염병 표본감시 의료기관을 기관 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 2KB)로, 기관명·지번/도로명 주소·행정동·법정동·전화번호를 포함한다. 서구 주민이나 보건 담당자가 '우리 동네에서 감염병 표본감시에 참여하는 의료기관은 어디이고 연락처는 무엇인가'를 확인하거나, 동별 분포를 볼 때 쓴다. 법정동코드(bjd_cd)를 키로 다른 법정동 단위 통계·의료기관 인허가(LOCALDATA) 자료와 잇고, 행정동코드로 행정동 단위 인구·보건 통계와 맞춰 볼 수 있다.
description_portal: 이 데이터는 대전광역시 서구에 지정된 표본감시 의료기관의 현황을 기록한 자료로, 감염병 감시 및 보건 행정의 기초자료로 활용됩니다. 표본감시 의료기관은 법정 감염병 중 일부를 지속적으로 감시·보고하는 기관으로, 지역사회 내 감염병 발생 동향을 파악하고 조기 대응하기 위한 중요한 역할을 수행합니다.데이터에는 각 기관의 순번, 기관명, 주소를 포함하여, 지번주소와 도로명주소가 함께 제공되어 의료기관의 정확한 위치를 확인할 수 있도록 구성되어 있습니다. 또한, 행정동과 법정동, 그리고 각각의 행정동코드 및 법정동코드가 포함되어 있어, 행정구역 단위의 통계 분석이나 보건정책 수립 시 활용도가 높습니다.이 자료는 감염병 예방 및 대응, 보건의료 서비스의 지역 분포 분석, 의료기관과의 협력체계 구축 등 보건 행정 전반에 활용되며, 지역사회의 건강안전망 강화를 위한 기반 정보를 제공합니다.
