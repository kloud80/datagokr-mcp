summary_user: 경상남도 창녕군에 있는 병원(일반병원·요양병원)을 기관별로 한 행씩 담은 현황 파일이며, 기관명·도로명주소·전화번호·진료과목을 담는다(약 1.6KB 규모의 소량 csv). 군민이나 분석가가 '창녕군에서 정형외과나 정신건강의학과를 보는 병원이 어디이고 연락처는 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 기관명이나 주소를 맞춰 보는 방식으로 이어 쓰며, LOCALDATA 병원 인허가 자료나 같은 군의 의원·약국 현황과 대조하는 데 쓴다.
description_portal: 경상남도 창녕군의 의료기관 중 병원(일반병원, 요양병원) 현황입니다.1. 병원의 명칭, 병원 대표자, 병원의 주소(도로명주소), 병원 내 병실수, 진료하는 과목(내과, 한방내과, 외과, 정형외과, 소아청소년과, 이비인후과, 정신건강의학과, 신경과, 영상의학과 등)병원의 연락처 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 8일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 데이터에 대하여 추가적인 문의사항이 있거나 세부 설명이 필요한 경우에는 창녕군청 보건소 보건정책과 의약관리팀 055-530-7523으로 문의 주시기 바랍니다.
