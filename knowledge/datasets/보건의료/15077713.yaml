description_portal: '행위별 상대가치 통계- 대상: 건강보험 / 작성기준: 심사년도- 의료행위통계는 요양기관에서 청구한 요양급여비용 명세서에 대한 심사결정한 내용을 기준으로 작성되었습니다.- 행위별 항목은 현재 등재된 행위 항목에 관한 건강보험 진료내역입니다.(제외코드: 금액제 고시 항목, 포괄수가영역의 진료내역, 시범사업 및 기타 정액수가 행위 등)- 관리진료과는 상대가치점수 개정연구시, 행위단위의 상대가치 관리하는 대표진료과를 의미하며, 요양급여비용 청구명세서 상 병원은 진료과목(의원은 표시과목)과는 다른 개념입니다.- 장/절분류는 건강보험요양급여비용 책자에 분류된 행위그룹을 의미합니다.'
