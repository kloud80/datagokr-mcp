summary_user: 건강보험 요양급여비용 명세서의 심사결정 내용을 바탕으로, 현재 등재된 의료행위(수가코드)별 2025년 총 실시횟수와 가산 적용 금액을 관리진료과·장절분류와 함께 담은 전국 단위 집계 통계 파일입니다. 분석가나 의료기관 관계자가 '특정 진료과가 관리하는 행위 중 실시횟수가 많은 항목은 무엇이고 진료비 규모는 얼마인가'를 살필 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 수가코드나 행위 한글명을 기준으로 심평원의 다른 수가·행위 코드 자료와 매핑해 이어 쓴다.
limits: 금액제 고시 항목, 포괄수가 영역 진료내역, 시범사업·정액수가 행위는 빠져 있어 전체 진료비를 대표하지 않는다. 관리진료과는 상대가치 관리용 대표진료과로, 명세서의 진료과목(의원은 표시과목)과 다른 개념이다. 지역 구분이 없는 전국 집계라 지역별 분석에는 쓸 수 없다.
