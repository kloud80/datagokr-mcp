summary_user: 인천광역시 영종구 안 의료기관을 한 곳씩 행으로 담은 파일로, 기관명·종별·도로명주소·전화번호·병상 수를 담는다(csv 약 9.5KB 규모). 주민이 "영종구에서 병상이 있는 병원이 어디이고 전화번호는 무엇인가"를 찾거나, 분석가가 지역 병의원 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터(LOCALDATA 인허가 등)와는 의료기관명·도로명주소를 맞춰 이어 쓴다.
description_portal: '인천광역시 영종구의 의료기관에  대한 데이터로 의료기관명, 종별, 주소 등 기본정보를 포함한 의료기관 현황을 제공합니다.주민들은 가까운 의료기관 정보를 쉽게 확인할 수 있어 신속한 의료 접근이 가능합니다.또한 진료 가능 과목이나 진료 시간 등을 미리 확인함으로써 효율적인 의료 서비스를 이용할 수 있습니다.이러한 데이터를 통해 의료서비스 이용의 효율성과 만족도가 크게 향상될 수 있기를 바랍니다.○ 인천광역시 영종구_의료기관 현황 : 순번, 의료기관명, 의료기관종별, 의료기관주소(도로명), 의료기관전화번호, 병상'
