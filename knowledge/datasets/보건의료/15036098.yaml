description_portal: 고령화 사회 진입과 질병 패턴 변화로 정밀 진단에 대한 의료 수요가 증가하는 가운데, 방사선 안전관리 강화 및 의료장비의 체계적인 관리·감독을 위한 현황 파악 필요성이 높아지고 있습니다. 충청남도 보령시는 관내 의료기관이 보유한 X-ray 등 진단용 방사선발생장치의 기관별 보유 현황 데이터를 제공합니다. 본 데이터는 의료기관명, 주소, 연락처, 의료장비명 항목으로 구성되어 있으며, CSV 파일 형태로 공공저작물 이용허락범위에 제한 없이 제공됩니다. 환자 및 시민은 본 데이터를 통해 필요한 진단장비를 보유한 의료기관을 확인하고 의료서비스 이용 계획 수립에 활용할 수 있습니다. 또한 지자체 및 보건당국은 관내 방사선 진단장비 보유 현황 분석을 통해 방사선 안전관리 감독업무 및 보건의료 정책 수립에 본 데이터를 활용할 수 있습니다.
