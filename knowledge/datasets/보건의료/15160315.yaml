description_portal: 질병관리청 의료감염관리과에서 제공하는 해당 데이터는 2017년부터 2025년까지의 카바페넴내성장내세균목(CRE) 감염증 의료기관 종별 월별 신고 현황을 정리한 자료입니다.CRE 감염증은 2017년 6월부터 전수감시 대상으로 전환되었으며, 본 데이터는 방역통합정보시스템에 신고된 자료를 활용하여 생성되었습니다.데이터는 연도, 월, 의료기관 종별 및 신고 건수로 구성되며, 의료기관 종별은 상급종합병원, 종합병원, 병원, 요양병원 및 기타로 구분됩니다.신고 건수는 해당 연도와 월에 의료기관 종별로 신고된 CRE 감염증 신고 건수를 의미합니다.본 자료는 CRE 감염증의 의료기관 종별 발생 현황과 월별 신고 추이를 파악하고 관련 연구 및 통계 분석의 기초자료로 활용될 수 있습니다.
