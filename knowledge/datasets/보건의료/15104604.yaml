description_portal: 경상남도 진주시에 소재지를 두고 운영중인 정신의료기관에 대하여 명칭과 주소, 전화번호, 입원병상여부, 입원병상수 등을 제공하고 있다. 진주시는 경상남도 중 서부경남에 위치하고 있으며 이곳에 위치한 정신의료기관은 총 12개가 있다. , 정신의료기관 중 종합병원의 경우 대학병원 정신건강의학과 1개, 정신병원은 2개, 정신건강의학과의원은 9개로 구성되어 있고, 의료기관은 초전동, 충무공동, 상대동, 칠암동, 평거동, 평안동, 본성동, 문산읍 등 고르게 분포하고 있으며, 입원치료는 칠암동, 문산읍에 소재하고 있는 대학병원 정신건강의학과, 정신병원 2개소에서 가능하다.
