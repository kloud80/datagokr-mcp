summary_user: 울산광역시 중구 관내 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 의료기관 종별·개설일자·전문과목·진료과목·도로명 주소·전화번호와 입원실·병상 수, 의사·간호사·의료기사 등 직종별 종사자 수, 총면적을 포함한다. 중구에서 특정 진료과목 의원이 어디에 몇 곳 있는지, 동네별 병상과 의료인력이 어떻게 분포하는지 알고 싶은 주민·개원 준비자·지역 보건정책 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소를 맞춰 붙여야 하며, 병의원 개폐업을 상권 신호로 보려면 LOCALDATA 병원·의원 인허가 자료와 이름·주소로 대조해 쓴다.
limits: 범위가 울산 중구 한 곳뿐이라 다른 시군구와 비교하려면 지역별 파일을 따로 모아야 한다. 기관 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭 오류가 생길 수 있다.
