description_portal: '은평구의 동물을 진료하거나 동물의 질병을 예방하는 기관정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 반려동물 등 동물을 진료하고 질병을 예방하는 동물병원의 인허가 현황을 담고 있습니다. 데이터에는 각 동물병원의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같이 반려동물 양육가구에 필수적인 정보가 포함되어 있습니다.동물병원은 「수의사법」에 따라 자격을 갖춘 수의사만이 개설·운영할 수 있는 전문 의료기관입니다. 이 데이터는 반려동물 보호자들이 합법적으로 등록된 신뢰할 수 있는 병원을 쉽게 찾고 이용할 수 있도록 돕습니다. 또한, 지자체는 이를 기반으로 관내 동물 의료기관 현황을 정확히 파악하고, 동물 진료 및 방역 체계를 관리·감독하여 동물의 건강을 보호하고 인수공통감염병 등을 예방하는 데 중요한 기초 자료로 활용합니다.'
