summary_user: 전국 지자체의 응급환자이송업(구급차 이송 업소) 인허가 정보를 업소별 한 건씩 담은 원천 데이터로, 전체 170건이며 1999-11-05부터 2026-09-29까지의 인허가일을 포함한다. 응급환자 이송업체가 우리 지역에 어디 있고 영업 중인지, 구급차 종류(일반·특수)와 인원은 어떠한지 확인하려는 국민·분석가가 쓴다. 지번주소·도로명주소(address) 키로 다른 주소 기반 데이터와 이어 쓰고, 좌표(X·Y)로 위치 분석에 쓰며, 호출에 필요한 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: '건강_응급환자이송업 데이터는 응급환자를 의료기관 등으로 이송하는 영업을 하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 응급환자이송업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 보건복지부 재난의료정책과 / 044-202-2642 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
