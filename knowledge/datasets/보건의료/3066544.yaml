description_portal: '충청북도 충주시에 등록된 미용업소의 기본 정보를 제공하는 데이터입니다.자치단체명, 업종명, 업소명, 도로명주소, 지번주소, 전화번호, 담당부서 및 문의전화 등으로 구성되어 있으며, 지역 내 미용업소 분포 현황과 위생관리 대상 정보를 확인할 수 있습니다.주소는 도로명주소와 지번주소가 함께 제공되며, 실제 위치나 표기 방식은 사업자 등록 당시 기준입니다.전화번호는 업소 대표번호이며, 운영 시간이나 서비스 종류 등은 해당 업소에 직접 문의가 필요합니다.업종명은 「공중위생관리법 시행규칙」에 따른 표준 업종 기준을 따르며, 미용업 외 타 공중위생업종(예: 이용업, 피부미용 등)과 구분됩니다.본 데이터는 공중위생 지도·점검, 민원 응대, 생활편의시설 안내자료 제작, 지역 경제·상권 분석 등 다양한 행정 및 민간 분야에서 활용 가능합니다.※ 실제 영업 여부나 정보 변경 가능성이 있으므로 최신 정보 확인이 필요하며, 관련 사항은 충주시청 위생과(043-850-3463)로 문의 바랍니다.'
