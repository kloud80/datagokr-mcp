summary_user: 한국건강증진개발원 금연자료실(영문)에 올라온 자료를 건별 목록으로 담은 파일로, 각 행은 메뉴명·제목·작성자·연도·등록일자·첨부 파일명·바로가기 링크로 이루어진다(CSV 약 14KB, 전국·비공간). 해외 담배규제 담당자나 국제협력 분석가가 'FCTC 당사국에 공유된 한국의 금연정책·흡연예방·금연지원 영문 자료에는 어떤 것이 있나'를 찾을 때 쓴다. 보건소코드·시군구코드 같은 전역 조인 키가 없어 다른 데이터와는 제목·연도 같은 이름 매칭이나 같은 기관 자료끼리로만 이어 쓴다.
description_portal: FCTC 당사국 간 원활한 소통과 정보 교류를 위해 우리나라의 금연정책, 흡연예방, 금연지원사업 관련 자료를 제공합니다.개방데이터는 한국의 주요 금연정책 방향, 청소년 및 성인 대상 흡연예방사업, 보건소 금연클리닉 및 병의원 금연치료 등 금연지원서비스 현황을 포함하며, 국제사회와의 협력을 위해 영문으로 정리된 자료를 제공합니다.본 데이터는 세계보건기구(WHO) 담배규제기본협약(FCTC) 당사국 회의 및 국제 협력 과정에서 한국의 정책 사례를 공유하는 근거 자료로 활용될 수 있으며, 글로벌 담배규제 정책 발전과 국제적 금연 네트워크 강화에 기여할 수 있습니다.
