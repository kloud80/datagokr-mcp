summary_user: 제주특별자치도 내 공공 보건소 인력을 기준 연도, 인력 구분(대분류·소분류), 성별로 나눠 인원 수(명)로 집계한 통계로, 포털 설명상 2012~2020년을 다룬다. 지역 보건행정 분석가가 '제주 보건소의 간호사·간호조무사·행정 인력이 연도별로 어떻게 늘거나 줄었나'를 확인해 인력 배치나 충원 근거를 찾는 데 쓴다. 실측 컬럼에 보건소코드·시군구코드 같은 전역 조인 키가 없어, 다른 공공보건 데이터와는 연도와 인력 구분 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터셋은 제주특별자치도가 2012년부터 2020년까지 제주도내 공공 보건소의 인력현황을 연도별, 인력 구분별, 성별로 집계해 제공한 통계자료이다.  이 자료는 보건소별 직원 수, 예컨대 간호사, 간호조무사 등 보건의료 및 행정 인력의 분포와 변동을 파악할 수 있어, 지역 보건행정의 자원 배분, 의료 서비스 제공 역량, 주민 건강 접근성 분석 등에 기초가 된다. 또한 인구 구조 변화, 보건 수요 변화, 질병 유행, 공공보건 정책의 수요 예측 과정에서 보건 인력의 충분성 또는 불균형을 진단하고, 향후 인력 확보, 배치 조정, 복지·건강 정책 설계 등에 근거 자료로 활용될 수 있다.
