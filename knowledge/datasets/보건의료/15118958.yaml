summary_user: 건강보험심사평가원 의약품관리종합정보센터가 국내 허가 의약품에 WHO ATC분류 기준으로 부여한 ATC코드를 제품 단위로 담은 전국 단위 코드 매핑 파일(CSV, 약 2.5MB)입니다. 제약 시장 분석가나 연구자가 "이 제품코드의 약이 어떤 해부학적·치료적 계열(ATC)에 속하는지"를 확인하고 처방·급여 자료를 약효군별로 묶어 집계하는 데 쓴다. 제품코드·주성분코드·식약분류 컬럼이 있어 약제 급여목록이나 심평원 처방·청구 통계와 같은 기관 코드로 이어 쓰지만, 실측상 전역 조인 키로 확인된 컬럼은 없어 코드 값 대조나 이름 매핑으로 연결해야 한다.
description_portal: 건강보험심사평가원의 의약품관리종합정보센터에서 국내 허가된 의약품에 WHO 의약품통계협력센터의 ATC분류 가이드라인에 따라 부여·관리하고 있는 ATC코드입니다.- 의약품 분류번호, 주성분코드, 제품코드/제품명, 업체명, ATC코드/ATC코드명칭 데이터 제공※ 해당 자료는 아래 경로에서도 확인이 가능합니다. · 건강보험심사심사평가원 홈페이지(www.hira.or.kr) > 기관소식>  HIRA소식 > 공지사항 · 의약품관리종합정보센터 홈페이지(biz.kpis.or.kr)  > 고객센터 >  공지사항※ ATC코드(Anatomical Therapeutic Chemical Classification System)는 의약품을 분류하기 위해 사용되는 코드입니다. 이 코드는 세계보건기구(WHO) 산하의 의약품 통계 방법을 위한 협력센터에서 관리하며, 약물이 작용하는 장기나 계통, 화학적 특성에 따라 분류됩니다. ATC코드는 총 5단계로 구성되어 있으며, 7자리의 영문자 및 숫자로 이루어져 있습니다.※ 주성분코드란 식품의약품안전처에서 의약품이 허가된 후 의약품의 성분·함량·제형에 따라 건강보험심사평가원에서 부여하는 코드입니다. 주성분코드는 주성분 일련번호, 함량 일련번호, 투여경로, 제형코드의 9자리 숫자 및 영문자로 구성되며, 보건복지부에서 고시하는 "약제 급여목록 및 급여 상한금액표"를 참고하시기 바랍니다.
