summary_user: 건강보험 행위코드 EX871(원격심박기술에 의한 심전도 감시, 1일당)에 대해 2024년 진료분을 주상병코드·진료과목별로 묶어 진료인원·진료건수·수가금액(천원)을 담은 전국 단위 집계 파일입니다. 의료 분석가나 의료기기 사업자가 원격 심전도 감시가 어떤 진단명 환자에게 얼마나 쓰이고 급여 규모가 얼마인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 주상병코드를 KCD 질병분류 코드표와, 행위코드를 EDI 행위 코드 마스터와 코드 매핑으로 이어 쓴다.
limits: 진료일 기준 건강보험 급여실적만 담아 의료급여·비급여·한방·약국은 빠지고, 2025년 6월 심사분까지만 반영된다. 주상병은 청구 시 일차진단명이라 최종 확정 질병과 다를 수 있고, 5 미만 값은 '*'로 가려져 합계 계산에 주의해야 한다. 지역·요양기관 단위 구분은 없다.
