summary_user: 보훈대상자가 진료받을 수 있는 보훈병원 위탁병원을 기관 한 곳 단위로 담은 전국 목록으로, 병원명·주소·시도/시군구·전화·팩스·우편번호·위도·경도·사용 여부를 포함한다. 국가유공자나 그 가족이 '우리 동네에서 가장 가까운 보훈 위탁병원이 어디인가'를 찾거나, 분석가가 지역별 위탁병원 분포와 보훈병원 접근성 공백을 지도로 확인하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 병원명·주소로 대조하거나 위도·경도 좌표로 공간 결합해 이어 쓴다.
limits: 표준 기관 코드 같은 공통 키가 없어 건강보험 요양기관 정보나 LOCALDATA 인허가 자료와 정확히 1:1로 연결하려면 이름·주소 매칭이 필요하다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며, 개발계정은 하루 100,000회로 제한된다.
