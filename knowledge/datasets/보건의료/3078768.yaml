summary_user: 익산시 관내 의료기관을 한 곳당 한 행으로 정리한 현황 파일로, 종별(종합병원·요양병원·한방병원·의원 등), 기관명, 도로명주소, 전화번호를 담는다(CSV 약 32KB). 주민이 우리 동네 요양병원이나 한방병원의 위치·연락처를 찾거나, 분석가가 익산시의 의료기관 종별 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
