description_portal: 전라남도 해남군_코로나19 확진자 현황 공공데이터입니다.이 데이터는 2020년 ~ 2023년  총4년간의 월별 코로나 확진자 발생 현황 데이터 항목을 제공합니다.코로나-19(Covid-19)는 코로나19바이러스 감염에 의한 급성호흡기질환으로 호흡기 비말에 의해 전파됩니다.임상증상은 발열(37.5도 이상), 기침, 가래, 소화기증상(오심, 구토, 설사 등), 혼돈, 어지러움, 콧물, 코막힘, 객혈, 흉통, 결막염, 피부증상등이 동반될 수 있습니다.잠복기는 1~14일(평균 5~7일)이며 감염 첫주 내에 상부 호흡기 바이러스 양이 최고점에 도달한 후 점진적으로 감소합니다.
