description_portal: '전북특별자치도 전주시 내 병원을 제공하며 사업장명, 인허가일자, 상세영업상태, 소재지전화번호, 도로명주소, 지번주소, 위도, 경도 등을 제공합니다.병원, 종합병원, 치과병원 등 의사가 환자를 진찰 및 진료하는데 필요한 설비가 갖춰있으며, 30명 이상의 환자를 수용할 수 있는 시설을 갖춘 의료기관전북특별자치도 전주시내에 위치한 각종 병·의원의 현황을 정리한 데이터입니다. 이 자료는 종합병원, 병원, 의원, 치과, 한방병원 등 다양한 종류의 의료기관 목록을 포함하며, 각 기관의 명칭과 주소, 연락처 정보를 상세히 제공합니다. 이 데이터는 도민들이 갑작스러운 질병이나 건강 문제 발생 시 가까운 병원을 찾거나, 특정 진료 과목의 의료 서비스를 이용하고자 할 때 유용한 정보를 제공합니다. 또한, 보건의료 정책을 수립하는 기관에서는 지역별 의료 인프라의 분포와 현황을 파악하여, 의료 서비스의 균형 발전을 위한 계획 수립에 활용할 수 있습니다.담당부서: 보건행정과'
