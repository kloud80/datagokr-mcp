summary_user: 전주시 안에 있는 병원(종합병원·병원·치과병원 등)을 사업장 한 곳당 한 행으로 담은 인허가 원천 파일로, 사업장명·인허가일자·영업상태·주소·위경도와 의료인수·병상수·진료과목 등이 들어 있다. 전주 시민이 집 근처의 특정 진료과목 병원을 찾거나, 분석가가 지역별 병원 분포와 개폐업 흐름을 상권 신호로 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 위경도 기반 공간 결합으로 잇는다.
limits: 공통 기관 코드 같은 조인 키가 실측 컬럼에 없어 건강보험·심평원 등 다른 의료기관 데이터와 정확히 1:1로 연결하기 어렵다. 범위는 전주시 한 곳뿐이라 다른 시군과 비교하려면 별도 데이터가 필요하다.
