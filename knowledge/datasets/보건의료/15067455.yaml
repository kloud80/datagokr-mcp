summary_user: 의료이용지도에서 제공하는 의료자원 대비 인구 정보를 의료자원 구분(코드·명)별로 인구대비 기준수 형태로 담은 693바이트짜리 소규모 전국 단위 집계 파일입니다. 보건의료 분석가나 정책 담당자가 '의료인력·병상·CT/MRI 같은 의료자원을 인구 몇 명당 기준으로 셈하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 의료이용지도의 지역별 의료기관·의료인력·장비 현황 자료와는 의료자원구분코드명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 건강보험심사평가원 보건의료빅데이터개방시스템에서 서비스하는 의료이용지도의 의료자원대비 인구정보* 해당 자료는 다음 경로를 통해 상세하게 확인하실 수 있습니다. HIRA보건의료빅데이터개방시스템 > 의료이용지도(http://gisopendata.hira.or.kr/map.do) - 지역별 종별 의료기관, 진료과목별 의료기관, 특수의료기관 현황 조회  - 지역별 의료인력(의사, 간호사), 의료시설(병상, 응급실 등), 의료장비(CT, MRI, PET) 현황 조회 - 인구대비 의료기관, 의료인력, 의료시설, 의료장비 통계 등 조회 가능
