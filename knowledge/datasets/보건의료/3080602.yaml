description_portal: 경기도 양주시 소독의무대상시설 현황 데이터입니다.본 데이터는 「감염병의 예방 및 관리에 관한 법률」에 따라 소독의무 대상에 해당하는 시설의 현황을 제공하며, 시설구분, 업소명, 소재지, 관리기관, 관리기관 전화번호, 데이터기준일자 등의 정보를 포함하고 있습니다.해당 데이터는 소독의무대상시설의 위치와 관리 현황을 체계적으로 확인할 수 있도록 제공되며, 감염병 예방 및 방역업무 지원, 소독 이행 대상 관리, 공중위생 관리, 보건행정 업무, 시설 현황 분석, 정책 수립 및 행정서비스 제공 등에 활용할 수 있습니다.또한 시설별 관리기관과 연락처 정보를 함께 제공하여 시설 관리 및 행정업무에 활용할 수 있으며, 데이터는 기준일자를 기준으로 작성되어 최신 소독의무대상시설 현황을 확인하는 기초자료로 활용됩니다.
