description_portal: 질병관리청에서는 행정안전부 폭염대책기간(5.15.~9.30.)동안 전국 500여개 응급실 감시체계 참여 의료기관에 내원한 환자 중 온열질환자에 대한 감시 보고를 통해 일일 감시 현황 데이터를 제공하고 있습니다.2024년은 3,704명 발생 건을 확인할 수 있으며, 올해 2025년 9월 25일까지의 발생 건인 4,460명 신고 건에 대한 조건별 데이터를 확인할 수 있습니다.해당 조건은 발생일자, 성별, 나이, 발생시도, 발생시군구, 실내외구분, 발생장소에 대한 신고 데이터를 확인할 수 있습니다.본 제공 데이터는 기역 집계 기준 변경에 따라, ~2018년까지의 데이터는 의료기관 소재지 기준, 2019년부터~현재까지 데이터는 발생지역 기준 값으로 신고된 데이터 임을 안내드립니다.
