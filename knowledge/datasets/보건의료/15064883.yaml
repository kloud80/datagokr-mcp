description_portal: 인천광역시가 제공하는 보건교육실적 (건강생활실천 교육) 공공데이터는 관내 보건소 및 관련 기관에서 실시한 주민들의 건강한 생활 습관 형성을 위한 교육의 운영 실적을 집계한 통계 자료입니다. 이 데이터는 지역 주민들의 주요 건강 위험 요인에 대한 인식 개선 노력과 건강 증진 사업의 효과를 파악하고, 지역 보건 정책 및 건강 증진 프로그램 수립에 필수적인 기초 자료로 활용되는 것을 목적으로 합니다.인천광역시 보건교육실적 건강생활실천교육 (금연, 영양, 절주, 운동, 비만, 구강보건 등)에 대한 데이터의 교육 명수를 제공하는 데이터입니다. (단위:명)
