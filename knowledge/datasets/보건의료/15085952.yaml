summary_user: 법정감염병별로 환자수·명세서 청구건수·입내원일수·보험자부담금·요양급여비용총액을 진료년도 기준으로 모은 전국 단위 집계 파일로, 건강보험 청구명세서의 진단코드(양방, 약국 제외)를 기준으로 작성됐다. 보건 분석가나 연구자가 특정 법정감염병으로 건강보험 진료를 받은 환자가 몇 명이고 진료비가 얼마 들었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없고, 감염병명과 한국표준질병분류(KCD) 부호를 매개로 다른 질병별 진료 통계나 질병관리청 감염병 통계와 이름·코드 매핑으로 연결한다.
description_portal: '법정감염병에 대한 환자수, 명세서청구건수, 입내원일수, 보험자부담금, 요양급여비용총액에 대한 진료 통계 / 진료년도 기준(심사년월은 각 진료년+4개월) (예) 진료년월: 2024년 1월~12월, 심사년월: 2024년 1월~2025년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 질병관리청에서 공표하는 법정감염병을 대상으로 작성되었으며(「2024년 감염병 신고 현황 연보」 부록Ⅵ-5. 법정감염병 한국표준질병분류(KCD)부호), 상세내용은 첨부한 산출기준 참고※ 해당 통계는 청구명세서 상 의사가 기재한 진단코드를 기준으로 작성된 통계자료로, 질병관리청에서 제공하는 감염병 통계와 다를 수 있음   ※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임'
