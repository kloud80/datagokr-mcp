description_portal: '1. 개요 시도별 세대수 및 가입자 변동 현황(지역)  가. 연도말 지역가입자의 자격 취득자 또는 상실자 현황을 수록  나. 주민등록 실거주지 기준  다. 연도말 지역가입자의 자격 변동현황을 수록하여 세부적으로 파악할 수 있도록 함2. 작성기준: 지역가입자 중 매월 자격상실자 또는 취득자 기준3. 용어정의   - 지역취득: 직장가입자 상실, 피부양자 상실   - 지역상실: 직장가입자 취득, 피부양자 취득   - 지역취득 기타: 출생, 주민등록 재등록, 국적 취득, 영주 귀국 신규 등록 등   - 지역상실 기타: 사망, 실종, 국적 상실, 거주 불명 등록, 해외 이주 말소 등   - 월별: 월중 처리한 대상자'
