summary_user: 의료기기 표준코드(UDI-DI)별로 라텍스 포함 여부, 프탈레이트류 포함 여부, MRI 환경 안전성, 제품정보 버전 같은 제품 특성을 담는 API이다. 병원·구매 담당자나 규제 대응 담당자가 특정 의료기기에 라텍스나 프탈레이트가 들어 있는지, MRI 검사실에서 써도 되는지 확인하는 질문에 쓴다. 전역으로 쓸 조인 키는 실측에서 확인되지 않아, 이름·코드 매핑이나 같은 기관(식약처) 코드로만 다른 의료기기 데이터와 이어 쓴다.
description_portal: 해당 공공데이터는 의료기기 표준코드별 통합정보는 의료기기 표준코드(UDI-DI)를 기준으로 제품에 포함된 특정 물질 및 특성을 포함하여 제공하는 공공데이터입니다. 주요 제공 항목으로는 UDI-DI 코드, 라텍스 포함 여부, 프탈레이트류 포함 여부, 자기공명영상(MRI) 환경에서의 안전 노출 여부, 해당 제품 정보의 버전 등 제품에 대한 추가 설명이 포함됩니다. 이 공공데이터를 통해 제품 상세 특성을 파악하는 데 도움이 되어 의료기기 선택, 관리, 규제 대응에 효과적으로 활용될 수 있습니다.
