summary_user: 전남 장흥군 관내에서 집단급식소를 설치·운영하는 병원을 한 곳당 한 행으로 정리한 목록 파일로, 병원명·병상수·주소·대표 전화번호를 담는다(파일 크기 301바이트의 소규모 자료). 군 위생 담당자나 분석가가 '장흥군에서 급식소를 운영하는 병원은 어디이고 병상 규모는 얼마인가'를 확인해 위생 점검 대상을 정할 때 쓴다. 전역 조인 키가 없어 병원명이나 주소를 기준으로 의료기관 인허가(LOCALDATA) 자료나 집단급식소 신고 자료와 이름 매칭으로 이어 쓴다.
description_portal: 장흥군 관내에 설치된 집단급식소 운영 병원에 대한 현황을 정리한 데이터로, 지역 내 의료기관의 급식 운영 실태와 기본 정보를 파악할 수 있도록 제공됩니다. 해당 자료에는 병원의 명칭, 병상 수, 병원 소재지 주소, 대표 전화번호 등의 정보가 포함되어 있어 집단급식소 관리 및 위생 점검, 관련 행정업무 수행에 활용될 수 있습니다. 또한 지역 내 집단급식소 운영 병원의 분포와 규모를 확인하고, 식품위생 및 안전관리 정책 수립을 위한 기초자료로 활용할 수 있습니다. 이를 통해 행정기관은 효율적인 관리와 감독을 수행할 수 있으며, 관련 부서 간 정보 공유 및 현황 파악에도 도움이 됩니다. 데이터는 관내 병원 중 집단급식소가 설치·운영되는 의료기관을 대상으로 정리되어 있으며, 지속적인 현황 관리와 행정 서비스 지원을 위한 참고자료로 활용됩니다.
