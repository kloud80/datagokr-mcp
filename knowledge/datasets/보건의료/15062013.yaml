description_portal: 전라남도 무안군 청사 내 흡연실 설치현황 데이터는 공공기관 청사 및 공중이용시설 내 흡연실 운영 현황을 체계적으로 관리하기 위해 구축된 자료입니다.데이터에는 연번, 시도명, 자치구명, 공중이용시설구분, 흡연시설구분, 흡연시설형태, 흡연시설설치위치, 흡연시설규모, 흡연시설설치일, 흡연시설설치주체, 흡연시설관리여부, 흡연시설관리기관 등의 컬럼이 포함되어 있습니다.이를 통해 무안군 내 청사 및 공공시설의 흡연실 설치 현황과 관리 주체를 명확히 파악할 수 있으며, 금연 정책 이행 점검, 시설 안전관리, 보건 환경 개선 정책 수립에 활용할 수 있습니다.또한 시설별 위치와 규모 정보는 방문객과 직원들의 이용 편의를 높이고, 관리 여부 및 기관 정보를 통해 효율적인 유지 및 관리 체계를 마련하는 데 기초 자료로 쓰입니다.이 데이터는 공중보건 증진과 쾌적한 생활환경 조성을 위한 행정적 근거로서 중요한 역할을 합니다.
