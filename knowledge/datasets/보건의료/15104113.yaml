description_portal: '대전광역시 서구 동물용의약품도매상 등록현황 파일은, 관내에서 동물용 의약품을 유통하는 도매업체들의 업체명, 행정동 및 지번·도로명 주소, 상세주소, 전화번호 등의 항목을 담고 있습니다. 동물의약품은 동물이 아플 때 치료하거나 건강을 지켜주기 위해 사용하는 약이며, 사람이 먹는 약이 따로 있듯이, 동물도 각각의 몸에 맞는 전용 약이 필요합니다.종류에는 치료용 약: 감염병이나 상처를 치료하는 항생제, 소염제 등 / 예방용 약: 병에 걸리지 않도록 돕는 백신 / 영양·보조제: 면역력이나 성장에 도움을 주는 비타민, 미네랄제 등/ 구충제: 개나 고양이의 심장사상충, 소·돼지의 기생충을 없애는 약이 있으며 대상 동물에는 반려동물(강아지, 고양이 등), 가축(소, 돼지, 닭 등), 말이나 양 등 축산업에 쓰이는 동물까지 모두 포함됩니다.  관리기관은 대전광역시 서구이며, 연간 업데이트로 최신 정보 반영이 가능합니다'
