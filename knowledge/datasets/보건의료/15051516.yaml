summary_user: 근로복지공단이 2012년 4분기 동안 집계한 산재 환자 진료 건수를 지사·지역본부별로 상급종합병원, 종합병원, 병원, 의원, 치과, 한방 6개 의료기관 유형으로 나눠 담은 집계 파일(csv, 약 3.7KB)이다. 산재보험 분석가나 연구자가 "2012년 말 어느 지사 관할 지역에서 산재 환자가 상급종합병원이나 한방 진료를 다른 지역보다 많이 이용했는가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지사명(지사명)을 이름으로 맞추거나 같은 근로복지공단의 지사 단위 자료와만 연결할 수 있다.
limits: 개별 의료기관이나 환자 단위 원천이 아니라 지사별 유형 합계라서 특정 병원의 진료 실적이나 행정구역(시군구) 단위 분석에는 쓰지 못한다. 2012년 4분기 한 시점의 자료라 시계열 비교에는 다른 분기 파일이 따로 필요하다. 표준 지역코드가 없어 지역 데이터와 붙일 때 지사명 매핑을 직접 해야 한다.
