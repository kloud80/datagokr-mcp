description_portal: 이 데이터는 근로복지공단에서 2012년 4분기 동안 집계한 전국의 지사 및 지역본부별 산재(산업재해) 환자의 진료 건수 현황을 담고 있습니다. 데이터의 핵심은 근로복지공단의 산재보험 적용 대상 환자들이 어떤 의료기관 유형을 주로 이용했는지 지역별로 상세하게 파악할 수 있다는 점입니다.포함된 의료기관 분류는 상급종합병원, 종합병원, 병원, 의원, 치과, 한방 총 6가지입니다. 이를 통해 전국 근로복지공단 지사가 관할하는 지역별로 산재 환자들의 의료 접근성 및 선호하는 진료 패턴을 분석하는 데 활용됩니다. 예를 들어, 특정 지사 관할 지역에서 상급종합병원이나 한방 진료의 비중이 타 지역과 어떻게 다른지 비교할 수 있습니다. 특히, 2012년 당시의 의료이용 행태를 분석하는 데 중요한 기초 자료로 사용될 수 있으며, 지역별 의료자원 분포와 산재보험 재정 집행의 효율성을 평가하는 데 유의미합니다. 데이터의 구조는 '지사명'을 기준으로 각 6가지 의료기관 유형별 진료 건수가 수치로 기록되어 있습니다.
