summary_user: 경상남도 거제시에 설치된 보건지소와 보건진료소를 시설 한 곳당 한 행으로 담은 목록 파일로, 구분(지소/진료소)·시설명·도로명/지번 주소·위도·경도·상세위치·전화번호·기준일자를 담는다(csv 약 3.9KB 규모). 거제시 주민이 가까운 보건지소·진료소 위치와 연락처를 찾거나, 분석가가 면 지역의 공공보건시설 분포와 접근 취약지를 지도로 살피는 데 쓴다. 전역 조인 키(보건소코드·시군구코드 등)가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경상남도 거제시에 설치된 보건지소 및 보건진료소의 현황 정보를 제공하며, 구분(보건지소/보건진료소), 시설명, 주소, 위도·경도 좌표, 전화번호, 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 지역 내 보건의료 서비스의 공간적 분포와 시설 현황을 체계적으로 파악할 수 있습니다.좌표 정보를 활용하면 의료서비스 접근성이 낮은 지역이나 보건취약지를 시각적으로 분석할 수 있으며, 응급의료 및 방문보건 서비스 계획 수립에 도움이 됩니다.전화번호 항목은 지역 주민의 직접적인 상담이나 진료 예약 등에 활용 가능하며, 기준일자를 통해 데이터의 최신성 여부를 확인할 수 있습니다.
