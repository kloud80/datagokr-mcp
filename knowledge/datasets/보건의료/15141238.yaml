summary_user: 서울특별시 금천구 관내 소독업체의 인허가 내역을 업체별 건 단위로 담으며, 인허가일자·영업상태·폐업일자·전화번호·지번/도로명 주소·좌표와 함께 사무실 면적, 분무기·보호구 등 소독 장비 보유 수량이 들어 있다. 주민이 금천구에서 지금 영업 중인 소독업체와 연락처를 찾거나, 창업 예정자·분석가가 관내 소독업체의 개업·폐업 추이를 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구의 같은 형식 인허가 자료와는 관리번호(MGTNO)·개방자치단체코드·상호명·주소로 맞춰 잇고, 좌표(X, Y)로 지도 위에 겹쳐 쓴다.
description_portal: '본 자료는 서울특별시 금천구에서 운영 중인 소독업체의 인허가 현황을 체계적으로 정리한 것입니다. 각 업체의 인허가일자, 영업 상태, 폐업한 경우 폐업일자, 전화번호, 주소, 상호명 등의 정보를 포함하여 주민 여러분께 신뢰도 높은 정보를 제공하고자 마련되었습니다.소독업은 위생과 안전을 위한 필수 서비스로, 주거 환경 및 공공장소, 상업시설 등에서 해충 및 병원균을 효과적으로 관리하는 중요한 역할을 담당하고 있습니다. 본 자료를 활용하시면 관내 소독업체의 위치와 운영 상태를 손쉽게 확인할 수 있으며, 전화번호를 통해 서비스 내용과 예약 문의도 미리 하실 수 있습니다.폐업 여부를 함께 제공하여 혼선을 방지하며, 신규 업체 탐색이나 긴급 상황 시 적합한 업체를 빠르게 찾는 데 큰 도움이 될 것입니다. 또한, 관련 산업 종사자나 창업 예정자께서도 시장 현황을 파악하고 전략을 수립하는 데 유용한 기초 자료로 활용하실 수 있습니다.우리 구는 앞으로도 주민 여러분의 쾌적하고 안전한 생활환경 조성을 위해 생활밀착형 서비스 관련 정보를 투명하게 공개하고, 신속하고 정확한 정보 제공에 최선을 다하겠습니다.(담당부서 : 금천구 보건소 보건정책과)'
