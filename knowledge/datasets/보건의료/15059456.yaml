summary_user: 경기도 내 종합병원 산부인과의 인허가 현황을 사업장 한 곳당 한 행으로 담는다. 행마다 사업장명, 인허가일자, 영업상태, 폐업일자, 병상수, 의료인수, 입원실수, 진료과목, 소재지 주소와 WGS84 위경도가 들어 있다. 분석가나 정책 담당자가 '우리 시군에 분만·부인과 진료가 가능한 종합병원이 몇 곳이고, 병상과 의료인 규모는 어떤가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군 코드·이름(SIGUN_CD)이나 주소·좌표를 기준으로 맞춰 이어 쓴다.
description_portal: '이 데이터는 경기도 내 종합병원 산부인과의 인허가 현황 정보를 포함하고 있으며, 사업장명, 인허가일자, 병상수, 의료인수, 입원실수, 진료과목, 소재지 주소 및 위치좌표(WGS84 위경도) 등의 정보를 제공합니다. 종합병원은 외래환자를 진료하고 100병상 이상을 보유한 의료기관으로 정의되며, 본 데이터는 여성 의료서비스 수요 분석, 병원 설립 정책 수립, 공공의료 자원 분포 조사 등에 활용될 수 있습니다. 데이터는 XML 또는 JSON 형식으로 제공되며, 시군명과 코드로 검색 가능합니다. 용어해설 - 종합병원: 입원환자 100명 이상을 수용할 수 있고, 다양한 진료과를 운영하며 외래환자도 진료할 수 있는 대형 의료기관으로 보건복지부 지정 기준을 충족해야 합니다.- 산부인과: 여성의 임신, 출산 등을 전문으로 진료하는 의학과목입니다. 주로 여성 질환 진단, 치료, 분만 및 부인과 수술 등을 담당합니다.'
