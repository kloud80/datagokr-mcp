summary_user: 서울 은평구에 등록된 의료법인의 인허가 내역을 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 사업장명·인허가일자·영업상태·폐업일자·주소·중부원점TM 좌표(X, Y)·병상 수 등을 포함한다. 분석가나 사업자가 은평구에서 의료법인이 운영하는 병원이 언제 개설되고 폐업했는지 확인하고, 이를 지역 의료공급이나 상권 변화의 신호로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '은평구의 의료업을 목적으로 설립된 법인 정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 의료법인으로 등록된 기관들의 기본 정보와 인허가 내역을 담고 있습니다.  의료법인은 공공성과 전문성을 동시에 갖춘 조직으로, 병원 및 요양기관의 법적 운영주체가 됩니다.  해당 데이터는 법인명, 소재지, 인허가일자, 대표자 정보, 개설 유형 등의 세부 사항을 포함하여  공공보건계획 수립, 보건정책 평가, 지역의료공급 분석 등에 활용될 수 있습니다.  또한 의료산업의 구조 이해 및 지역 내 병원 네트워크 분석 등 민간 분야 활용도도 높습니다.  보건의료 자원의 공정한 배분과 민관 협업체계 구축에 기초자료가 되는 중요 데이터입니다.'
