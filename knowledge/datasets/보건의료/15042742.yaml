summary_user: 경기도 의정부시 관내 의원을 한 곳당 한 행으로 담은 파일로, 인허가일자·영업상태(정상·휴업·폐업)·주소·전화·의료인수·병상수·진료과목·구급차 보유 등을 개별 주소 단위로 담는다. 주민이 우리 동네에서 특정 진료과목을 보는 영업 중인 의원을 찾거나, 분석가가 의정부시 의원의 개폐업 추이를 상권 신호로 살펴보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소 매칭으로 잇거나, 같은 LOCALDATA 인허가 체계의 관리번호를 기준으로 병원·치과·한의원 등 다른 업종 파일과 함께 본다.
limits: 의정부시 한 시군구만 담아 다른 지역과 비교하려면 지역별 파일을 따로 모아야 한다. 실측 컬럼에 전역 조인 키가 없어 건강보험 요양기관 정보 등과 붙일 때는 이름·주소 매칭의 오차를 감안해야 한다.
