summary_user: 인천광역시 동구(현 제물포구) 관내 의료기기판매업소를 업소 한 곳당 한 행으로 담은 파일로, 영업소명·도로명 소재지·전화번호를 담는다. 주민이나 사업자가 '동구에서 의료기기를 파는 업소가 어디에 있고 연락처가 무엇인가'를 확인하거나, 분석가가 관내 판매업소 분포를 지도로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명이나 도로명 주소를 맞춰 잇거나, 주소를 좌표로 바꿔 공간정보와 겹쳐 쓴다.
limits: 범위가 인천 동구 한 시군구로 한정되어 다른 지역과 비교하거나 전국 현황을 보는 데는 쓰지 못한다. 식약처 품목기준코드 같은 공통 코드가 없어 의료기기 품목허가 데이터와 키로 바로 연결되지 않으며, 이름·주소 매칭에 기대야 한다.
