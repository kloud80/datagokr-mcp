description_portal: 공공보건의료인력 학습지원정보는 공공보건의료교육훈련센터에서 제공하는 교육과정 기본정보(과정명, 등록연도, 수료기준, 교육시간)에 대한 데이터로 구성되어 있습니다.● 본 데이터는 공공보건의료교육훈련센터에서 제공하는 온라인 교육과정으로 2020년부터 2025년까지 제공하고 있는 과정으로 구성되어 있습니다. 교육 과정은 공공보건의료교육훈련센터에서 직접 개발하여 운영중인 자체개발 과정, 외부 콘텐츠를 대여하여 활용하고 있는 임대 과정으로 구분되어 있습니다. 보다 더 자세한 교육과정 설명은 공공보건의료교육훈련센터 홈페이지(www.edunmc.or.kr)의 이러닝 사이버연수원 홈페이지를 참고하여 주시기 바랍니다.  ● 데이터 출처  - 공공보건의료교육훈련센터 ● 데이터 문의   - 공공보건의료교육훈련센터 교육전략기획팀  ● 데이터 기준  - 2025년 11월 12일 ● 제공항목   - 데이터순번, 교육코드, 과정종류, 과정명, 차수연도, 설명(수료기준), 교육시간, 설문여부 * CSV 파일을 엑셀로 실행할 경우 0으로 시작하는 값이 다르게 표시될 수 있습니다.
