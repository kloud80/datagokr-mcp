summary_user: 서울특별시 중구 약국의 인허가 정보를 약국 한 곳당 한 행으로 담는 건별 원천 자료로, 인허가일·취소일, 영업상태와 폐업·휴업 일자, 지번·도로명 주소, 상호, 영업면적(PHARMTRDAR), 중부원점TM 좌표가 들어 있다. 중구에서 지금 영업 중인 약국이 어디인지, 최근 문을 열거나 닫은 약국이 어느 동네에 몰려 있는지 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구 약국 인허가나 병의원 인허가 자료와는 같은 기관 코드(OPNSFTEAMCODE)·주소·상호를 맞춰 잇는다.
description_portal: '본 데이터는 서울특별시 중구에서 약국의 영업 허가 및 사업자 등록 정보를 제공하는 자료입니다. 이 데이터는 약국의 위치, 인허가일, 영업면적 등에 대한 상세한 정보를 포함하고 있습니다. 이를 통해 사용자는 약국의 영업 허가 현황을 파악할 수 있으며, 관련 정책 수립 및 보건 행정 개선에 활용할 수 있습니다. 데이터는 정기적으로 업데이트되어 최신 정보를 제공하며, 공공데이터포털을 통해 누구나 접근할 수 있습니다. 본 데이터는 보건 행정의 투명성을 높이고, 지역사회의 건강 관리 수준을 향상시키는 데 중요한 자료로 활용될 수 있습니다. 또한, 정책 결정자들이 약국 영업 허가 현황을 분석하고, 효과적인 보건 정책을 수립하는 데 유용한 정보로 활용될 수 있습니다. 데이터의 활용을 통해 지역사회의 보건 및 건강 관리 수준이 향상될 것으로 기대됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
