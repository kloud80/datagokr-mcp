description_portal: '■ 데이터 개요임신‧출산에 따른 진료비 부담 완화를 위한 지원 사업의 일환으로, 국민건강보험공단에서 제공하는 임신출산 진료비 지원 현황 자료입니다. 연도별로 직장가입자와 지역가입자 구분에 따른 총 지원금액을 확인할 수 있습니다.■ 제공 기간2009년 ~ 2023년■ 주요 항목 설명1. 연도: 지원금이 지급된 연도2. 직장가입자 지원금액 (천원): 해당 연도 직장가입자에게 지원된 임신출산 진료비 총액3. 지역가입자 지원금액 (천원): 해당 연도 지역가입자에게 지원된 임신출산 진료비 총액■ 기타 참고사항1. 단위는 모두 천원(KRW) 기준입니다.2. 본 데이터는 정책 분석 및 보건복지 분야 연구 등에 활용 가능합니다.'
