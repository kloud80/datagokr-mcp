summary_user: 전국 진료권별로 지정된 권역·지역책임의료기관의 목록을 기관 한 곳당 한 행으로 담으며, 권역/지역 구분, 시도, 진료권, 기관명을 제공하는 작은 CSV 파일(약 3.5KB)이다. 지역 주민이나 보건정책 분석가가 "우리 시도·진료권의 책임의료기관은 어디인가" 또는 "책임의료기관이 지정되지 않은 진료권은 어디인가"를 확인하는 데 쓴다. 전역 조인 키나 기관 코드가 없어 다른 의료기관 데이터와는 기관명·시도 이름을 맞춰 연결해야 한다.
limits: 요양기관기호 같은 기관 코드가 없어 병원 정보·인허가 데이터와 이으려면 기관명 문자열 매칭에 의존해야 하며, 동명·표기 차이에 주의해야 한다. 행정단위는 시도 수준이고 주소·좌표는 없다.
