summary_user: 부산 수영구 관내 의료기관별로 의료기관명·종별·병상 수와 CT·MRI 공동활용병상 동의 여부를 기관 한 곳당 한 행으로 담은 소규모 파일(csv, 약 1KB)이다. 특수의료장비 설치 기준 병상을 채우려는 의료기관이나 지역 의료자원을 살피는 분석가가 '수영구에서 CT·MRI 공동활용에 동의한 병원은 어디인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 자료와는 의료기관명을 맞춰 이어 써야 한다.
description_portal: 부산광역시 수영구는 구민들의 건강권 보장과 의료 서비스 이용 편의 증진을 위해, 관내 의료기관 중 특수의료장비(MRI, CT 등) 시설 기준에 해당하는 병상 수 공동활용 동의 현황을 투명하게 공개하고 있습니다. 이 정보는 단순히 의료기관명과 도로명 주소만을 제공하는 것을 넘어, 각 의료기관이 MRI와 CT 장비에 대해 공동 활용 병상 동의 여부를 명확히 표기함으로써 구민들이 필요한 전문 의료 서비스를 효율적으로 이용할 수 있도록 지원합니다. 이러한 정보 공개는 특정 의료 장비의 접근성을 높이고, 의료 자원의 효율적 배분을 유도하여 구민들이 최적의 진료를 받을 수 있는 환경을 조성하는 데 기여하며, 궁극적으로 지역 내 의료 서비스의 질적 향상과 구민들의 의료 복지 증진을 목표로 합니다.
