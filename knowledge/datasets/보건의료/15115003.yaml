summary_user: 서울 송파구의 부속의료기관(사업장 안에 둔 의무실 등) 인허가 내역을 사업장 단위로 담은 LOCALDATA 형식 원천 데이터로, 인허가일·취소일, 영업·상세 영업상태, 폐업일, 휴업 기간, 소재지·도로명 주소, 좌표, 의료인 수·병실 수·병상 수·면적, 진료과목 등을 담는다. 송파구 안에서 어떤 부속의료기관이 운영 중이거나 폐업했는지, 개폐업 흐름이 어떤지를 확인하려는 분석가나 주민이 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 LOCALDATA 인허가 데이터와는 자치단체 코드(OPNSFTEAMCODE)·관리번호 같은 기관 내부 코드나 사업장명·주소 매칭으로만 잇는다.
