summary_user: 전국 요양기관이 신고한 의료장비 보유 내역을 장비 단위로 담은 파일 데이터로, 711,808행이 시군구 단위 소재지와 함께 들어 있다. 지역별로 특정 장비(대분류·세분류)를 가진 병원이 어디에 몇 대 있는지 따지는 분석가나 사업자가 쓴다. 암호화된 요양기호가 있어 같은 심평원 요양기관 데이터와 연결하지만, 전역 조인 키는 없어 기관명·코드 매핑이나 같은 기관 코드로만 잇는다.
description_portal: 전국 요양기관의 장비보유 상세 현황(요양기관명, 소재지, 종별, 장비대분류, 장비소분류, 장비허가번호 등) / 연 1회 업데이트- 국민건강보험법 제 43조(요양기관 현황에 대한 신고) 및 동법 시행규칙 제 12조(요양기관 현황 신고 등)에 의해 요양기관이 건강보험심사평가원에 신고한 기준으로 작성되었습니다.- 요양기호는 1:1로 매칭한 암호화된 요양기호로 제공하고 있으며, 별도의 복호화 방법 또는 요양기호는 제공하고 있지 않습니다.※ 과거 자료는 아래 경로에서 다운로드 가능합니다. https://opendata.hira.or.kr/op/opc/selectOpenData.do?sno=11924&publDataTpCd=&searchCnd=&searchWrd=%EC%9E%A5%EB%B9%84&pageIndex=1※ 본 자료는 요양기관이 신고한 보건의료자원 현황을 토대로 산출하였으며, 요양기관에서 착오신고 또는 신고 누락 시 실제 정보와 다를 수 있습니다.
