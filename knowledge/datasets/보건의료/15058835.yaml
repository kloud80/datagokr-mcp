summary_user: 경기도 내 병원급 한방병원의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 시군, 인허가·폐업일자, 영업상태, 병상·입원실·의료인 수, 진료과목, 구급차 수, 완화의료 항목, 주소와 WGS84 좌표를 포함한다. 분석가가 "경기도 시군별로 영업 중인 한방병원과 병상은 어디에 얼마나 있고, 최근 개업·폐업은 어떻게 변했나"를 볼 때 쓰며, 병의원 개폐업을 상권 신호로 읽는 데도 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)·시군명이나 주소·좌표, 사업장명 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 병원급 한방병원의 인허가 현황을 제공하는 자료로, 30병상 이상을 갖춘 한의사가 외래환자를 진료하는 의료기관의 정보를 담고 있습니다. 총 31개 항목으로 구성되며, 사업장명, 진료과목내용, 병상수, 의료인수, 입원실 수, 연면적, 최초지정일자, 일반 및 특수구급차 수, 완화의료 관련 항목, 의료기관종별, 위치정보(WGS84 위도·경도), 소재지 주소 등이 포함됩니다. 고령자나 만성질환자를 위한 한방의료 수요 파악, 지역 의료자원 분포 분석, 정책 수립 등에 활용될 수 있으며, 데이터는 행정안전부에서 주간 단위로 갱신되고 Open API를 통해 제공됩니다.
