summary_user: 2018~2024년 응급의료기관 수를 연도·시도별로 중앙·권역·전문·지역응급의료센터와 지역응급의료기관 종별로 나눠 센 집계 파일입니다. 보건 정책 분석가나 지자체 담당자가 '우리 시도의 권역·지역응급의료센터 수가 연도별로 어떻게 바뀌었고 다른 시도와 비교해 어떤가'를 살피는 데 쓴다. 전역 조인 키가 없어 시도명과 연도를 기준으로 시도별 인구·의료기관 통계 등과 이름 매칭으로만 이어 붙인다.
description_portal: 보건복지부에서 2018년~2024년까지 응급의료기관 종별 현황을 시도별로 분류하여 데이터를 제공하고 있습니다.○ 권역응급의료센터：응급환자의 진료, 대형 재해 등 발생 시 재난의료 제공, 권역 내에 있는 응급의료종사자에 대한 교육･훈련 등의 업무 수행을 목적으로 종합병원 중 보건복지부장관과 시･도지사가 협의하여 지정한 기관(응급의료에 관한 법률 제26조)○ 전문응급의료센터：소아･화상 및 독극물중독 환자 등에 대한 응급의료 업무 수행을 목적으로 종합병원 중 보건복지부 장관이 시･도지사와 협의하여 지정한 기관(응급의료에 관한 법률 제29조)○ 지역응급의료센터：지역의 주민에게 적절한 중증응급환자 진료를 목적으로 종합병원 중 시･도지사가 지정한 기관(응급의료에 관한 법률 제30조)○ 지역응급의료기관：관할 지역 내 주민에게 적정한 응급의료 제공을 목적으로 의원 및 병원 중에서 시장･군수･구청장이 지정한 기관(응급의료에 관한 법률 제31조)
