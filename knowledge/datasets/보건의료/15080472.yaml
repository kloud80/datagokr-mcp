description_portal: 본 데이터는 대전광역시 대덕구에 등록된 소독업소 영업중 현황을 제공하는 공공데이터 입니다.소독업의 정의는 감염병 예방 및 위생 관리를 위해 특정 시설이나 공간, 물건 등에 대해 소독, 멸균, 방역 등의 작업을 전문적으로 수행하는 사업을 말합니다.즉, 건물 내부 및 외부의 소독, 해충 및 병원균 방제, 의료기관, 학교, 음식점 등의 위생관리용 소독 등 감염병 확산을 막기 위해 다음과 같은 업무를 수행하는 업체가 해당됩니다:데이터에는 2025년 소독업 업체명, 사업자소재지, 사업자 소재지행정번호 영업소 전화번호 등 주요 정보가 포함되어 있습니다.일년에 한번 정기적으로 갱신되는 본 데이터는 최신정보를 반영하여 행정의 투명성과 효율성을 높이는데 기여합니다. 소독업 관련하여 관내 현황에 대해 검색할 시 쉽게 찾아볼수 있는 자료입니다.
