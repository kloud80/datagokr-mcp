summary_user: 서울 금천구 안경업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가·폐업일자, 영업상태, 주소·좌표, 전화번호와 시력표·정점굴절계·렌즈절단기 등 장비 보유 수량을 포함한다. 안경원 창업을 준비하는 사업자가 금천구 안에서 영업 중인 안경업소가 어디에 몇 곳 있고 최근 개폐업 흐름이 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 주소·사업장명 매칭이나 같은 자치단체 코드(OPNSFTEAMCODE), 좌표(X, Y)로 연결한다.
description_portal: 금천구 내 안경업소의 인허가 정보를 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명 등 기본 정보와 함께 시력표, 표본렌즈, 측정의자, 동공거리측정기, 정점굴절계, 조제용연마기, 렌즈절단기, 안경세척기 등 주요 장비 보유 현황도 포함되어 있습니다. 이를 통해 안경업 창업 준비, 기존 업소 현황 분석, 지역 내 안경업 서비스 접근성 평가, 관련 정책 수립 등에 활용할 수 있습니다. 또한 장비 보유 수준을 기반으로 서비스 품질 평가나 업소 간 비교 분석이 가능하여, 안경업계 경쟁력 강화와 소비자 만족도 향상에 기여하는 기초 자료로도 유용합니다.
