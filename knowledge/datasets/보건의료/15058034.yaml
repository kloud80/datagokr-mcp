summary_user: 식약처가 허가한 의약품 중 재심사 대상 품목을 품목 단위로 담으며, 업체명·소재지, 품목명·품목허가번호(ITEM_NO), 재심사 시작일, 연차 보고 기한과 보고 구분, 결과일자를 전국 범위로 제공한다. 제약사·약사·분석가가 '이 신약은 언제부터 재심사 대상이었고 연차 보고와 결과 통보는 어떤 상태인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식약처 허가정보와는 품목명·업체명 매핑이나 같은 기관 코드(품목허가번호, 사업자등록번호 BIZRNO)로만 맞춰 이어 쓴다.
description_portal: 식품의약품안전처 「의약품 재심사 정보」 OpenAPI는 허가된 의약품에 대한 재심사 현황을 조회할 수 있는 공공데이터입니다. 제공항목에는 업체명, 대표자명, 품목명, 품목허가번호, 허가일자, 연차구분(재심사 대상 기간), 보고구분, 결과일자, 업체 소재지 등이 포함되어 있습니다.데이터를 통해 사용자는 어떤 업체가 언제 재심사 대상으로 지정되었는지, 재심사 대상 기간은 얼마인지, 보고 구분이 어떤 상태인지 등의 정보를 직접 확인할 수 있습니다. 또한 재심사 결과 발표일자 등을 기준으로 의약품의 안전성 또는 유효성 유지 여부와 재심사 절차의 투명성을 검토하는 데 기초 자료로 활용 가능합니다.
