description_portal: '국민건강보험공단에서 지정한 국가암검진기관의 명칭, 주소, 연락처 및 암종별 검진 실시 여부를 포함한 자료.지역 내 암 조기 발견을 위한 검진서비스 제공 현황을 파악할 수 있으며, 보건소 사업계획 수립 및 주민 건강관리 정책의 기초자료로 활용됨.활용 목적 및 특징– 지역 내 암검진 가능 의료기관 분포 및 항목별 제공 현황 파악– 6대 암종별(위, 간, 대장, 유방, 자궁경부, 폐암) 검진 여부 확인 가능– 암검진 수요자 대상 기관 정보 제공 및 이용 편의성 제고– 보건행정 정책 수립, 검진기관 지정 및 평가자료로 활용 가능주요 항목 설명● 주소지: 검진기관이 위치한 도로명 또는 지번 주소● 검진기관명: 국가암검진을 시행하는 병·의원 명칭● 전화전호: 해당 기관의 대표 연락처● 일반검진: 기본 건강검진 가능 여부● 위암 / 간암 / 대장암 / 유방암 / 자궁경부암 / 폐암: 해당 암종별 검진 가능 여부 (Y/N 등)'
