summary_user: 전북특별자치도에 신고된 의료기기 수리업체를 업체 한 곳당 한 행으로 담은 파일로, 영업신고번호·신고일자·상호·소재지·전화번호·대표자명·수리 가능한 의료기기 유형·겸업 여부를 담는다(포털 설명상 2020년 10월 기준). 병원·요양시설이나 개인이 '전북에서 전동휠체어나 치과 장비를 고쳐 줄 정식 신고 업체가 어디인가'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·소재지 주소 같은 이름 매핑으로만 이어 쓴다.
limits: 식약처 품목기준코드 같은 공통 코드가 없어 의료기기 품목허가·건강보험 데이터와 키로 직접 연결할 수 없다. 범위는 전북특별자치도 한 곳이며, 업체별 개별 주소 단위 목록이라 다른 시도 현황은 따로 구해야 한다.
