summary_user: 식약처가 허가한 의료기기 제조업체·수입업체를 업소 단위로 담은 API로, 전국 15,850건에 업소명·업종구분·휴폐업 상태·허가일자·주소·사업자등록번호가 들어 있다. 의료기기 거래처나 수입업체가 허가를 받은 업소인지, 운영 상태가 어떤지 확인하려는 사업자·분석가가 쓴다. 사업자등록번호(BRNO)로 다른 사업자 정보와, 주소(ADRES1·ADRES2)로 지역 데이터와 이어 쓴다.
limits: 검증 때는 전체 15,850건 중 1,000행만 받았으므로 전량 수집하려면 페이지를 16회 이상 반복 호출해야 한다. 개발계정은 일 10,000회까지 호출할 수 있고, 필드 명세에 코드표가 없어 업종·휴폐업 코드의 뜻은 별도로 확인해야 한다.
