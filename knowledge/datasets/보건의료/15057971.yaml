description_portal: 해당 공공데이터는 식품의약품안전처에서 관리하는 의료기기 제조업체 및 수입업체의 상세 정보를 제공합니다. 이 공공데이터에는 업소명, 업종구분코드, 휴업·폐업·재개 구분코드, 허가일자, 업소 주소, 업허가번호 등의 항목이 포함되어 있으며, 국내에서 의료기기를 제조하거나 해외에서 수입하여 유통하기 위해 식품의약품안전처로부터 허가를 받은 업체에 대한 현황을 파악할 수 있도록 구성되어 있습니다. 사용자 혹은 관련 업종 종사자가 특정 업체의 인허가 여부나 운영 상태를 확인하는 데에도 활용될 수 있습니다.
