summary_user: 용인시 통합 홈페이지에 공개된 안전상비의약품 판매업소(편의점 등 약국 외 판매처)를 업소 한 곳당 한 행으로 담은 시군구 단위 파일로, 업소명·소재지 주소·전화번호와 보건소 지역코드, 데이터기준일자를 담는다(CSV 약 91KB). 용인시 주민이 야간·휴일에 약국이 닫혔을 때 "우리 동네에서 해열제·소화제를 살 수 있는 곳이 어디인가"를 찾거나, 분석가가 지역별 판매업소 분포를 볼 때 쓴다. 전국 공통 조인 키는 없어 소재지 주소를 지오코딩하거나 업소명·주소 문자열로 다른 약국·의료기관 목록과 맞추고, 보건소지역코드는 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 용인시 통합 홈페이지를 통해 제공되는 안전상비의약품 판매업소 정보를 체계적으로 관리하기 위한 자료이다. 판매업소일련번호와 보건소 지역코드를 기반으로 의료기관명, 소재지, 업소전화번호를 기록하여 시민이 약국 외 장소에서 안전상비의약품을 구매할 수 있는 위치와 기본 정보를 신속히 확인할 수 있도록 구성하였다. 이를 통해 야간·휴일 등 약국 이용이 어려운 상황에서도 필요한 의약품 접근성을 높일 수 있으며, 기관별 연락처는 운영 여부 확인과 이용 안내를 지원한다. 본 데이터는 지역 보건 안전망을 강화하고 의약품 판매업소 관리의 투명성을 확보하기 위한 행정 자료로 활용되며, 시민 건강 보호와 편의 증진에 기여한다.
