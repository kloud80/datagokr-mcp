summary_user: 대구 달성군 안의 의약품 공급업체를 업체 한 곳당 한 행으로 담은 소규모 파일(csv 약 3.4KB)이며, 시설명·업종·도로명주소·위도·경도·영업상태·운반차량과 저장시설 보유 여부·전화번호를 포함한다. 달성군에서 영업 중인 의약품 도매·공급업체가 어디에 있고 저장시설을 갖췄는지 확인하려는 사업자나 보건 행정 담당자가 쓴다. 전역 조인 키가 없어 식약처 허가정보나 심평원 약가 목록과는 업체명 매칭으로만 잇고, 위도·경도나 주소로 다른 시설 데이터와 지도 위에서 겹쳐 본다.
description_portal: 의약품을 공급하는 업체의 기본 현황 정보를 정리한 자료로, 업체 명칭, 위치, 업종 유형 등 의약품 유통 및 공급 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 의약품 공급업체의 분포 현황과 관리 대상 업체의 운영 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 의약품 공급업체 현황에 대한 체계적인 관리를 통해 의약품 유통 구조와 공급 체계를 분석하고, 안정적인 의약품 수급 관리 및 보건 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 의약품 공급업체에 대한 행정 관리, 지도·점검 및 민원 대응 업무 수행과 함께 관련 통계 산출 및 보건 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 의약품의 안전한 유통과 품질 관리를 위한 관리 체계를 강화하고, 지역 보건의료 환경의 안정적 운영과 국민 건강 보호를 위한 정책 추진의 기초자료로 활용되며, 지속적인 보건 위생 및 보건 행정 업무 수행을 지원하는 행정자료로 활용된다.
