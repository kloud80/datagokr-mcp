description_portal: '□ 개요 전문요양실 시범사업은 노인요양시설 내 의료 및 간호처치 욕구가 있는 수급자에게 의료의  연계를 통한 체계적인 간호서비스 제공으로 요양과 건강관리를 통합 제공하는 제도입니다. - (이용대상) 전문요양실 입실기준에 해당하는 수급자(1~4등급자) - (참여기관) 정원 50인 이상의 노인요양시설 - (제공서비스) 전문요양실 서비스 범위 내 간호관리* 및 교육․상담․건강증진 활동 등 상시 건강관리 서비스를 제공   * 영양관리, 배설관리, 호흡관리, 상처관리 등 본 데이터는 국민건강보험공단에서 제공하는 전문요양실 시범사업 서비스코드별 단가차액입니다. □ 주요 내용- 적용시작일자: 2025년에 적용되는 노인요양시설(현행법) 수가 적용시작일(2025-01-01로 일괄발췌)- 적용종료일자: 2025년에 적용되는 노인요양시설(현행법) 수가 적용종료일(9999-12-31로 일괄발췌)- 장기요양급여수가명: 시설급여 중 노인요양시설의 등급 당 1일 이용수가, 외박수가, 입소 수가, 퇴소수가 등- 단가차액: 전문요양실 이용수가에서 노인요양시설 이용수가를 제외한 차액    ※ 발췌일자 기준 장기요양 전문요양실 시범사업에 참여중인 기관 기준으로 집계'
