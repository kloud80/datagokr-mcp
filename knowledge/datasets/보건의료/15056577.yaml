summary_user: 경기도 내 기타 위생용품제조업 사업장을 한 곳씩 담은 인허가·영업 현황 자료로, 시군, 사업장명, 인허가일자, 영업상태(운영중·폐업), 폐업일자, 정제된 도로명·지번 주소와 위경도 좌표를 포함한다. 분석가나 사업자가 "우리 시군에 영업 중인 위생용품 제조업체는 몇 곳이고 최근 몇 곳이 폐업했나" 같은 질문에 지역별 분포와 개폐업 추이를 보는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소 문자열, 좌표로 다른 경기도 인허가 자료나 행정구역 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 ‘기타 위생용품제조업’에 속하는 사업장의 인허가 및 영업 현황을 정리한 자료입니다. 주요 항목에는 시군명, 사업장명, 인허가일자, 영업상태명(운영중·폐업 등), 폐업일자, 다중이용업소 여부, 위생업종명, 위생업태명, 소재지 도로명주소 및 지번주소, 우편번호, WGS84 좌표(위도·경도)가 포함되어 있습니다. 이 데이터는 지역별 위생용품 제조업 분포 현황을 파악하고, 운영 중인 업체와 폐업 업체의 변화를 분석하는 데 유용합니다. 또한, 위생산업 정책 수립, 안전 관리 강화, 중소기업 지원 정책, 지역 제조업 환경 분석 등에 활용될 수 있습니다.
