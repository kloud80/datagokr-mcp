summary_user: 경상남도 18개 시·군에 있는 22개 보건소의 명칭, 소재지 주소, 대표 전화번호, 우편번호를 보건소 1곳당 1행으로 담은 목록 파일이다(약 1.7KB CSV). 도민이 '우리 시·군 보건소는 어디에 있고 전화번호는 무엇인가'를 확인하거나, 분석가가 경남 보건소 위치를 지도에 올릴 때 쓴다. 보건소코드나 시군구코드 같은 공통 조인 키는 없으므로, 다른 보건·인구 데이터와는 시군명이나 보건소명을 이름으로 맞춰 연결해야 한다.
description_portal: <데이터 수집목적 및 과정>본 데이터는 2026년 2월 기준 경상남도 내 18개 시·군(22개 보건소)에 설치된 보건소의 명칭, 소재지, 연락처, 우편번호에 대한 정보를 제공합니다.보건소는 지역 주민의 기초 건강관리, 감염병 예방, 만성질환 관리, 모자보건 등 다양한 보건서비스를 제공하는 지역 기반 의료기관으로, 도민의 건강 증진과 의료 접근성 향상에 중요한 역할을 수행하고 있습니다.해당 데이터는 경상남도 행정기관에서 직접 수집 및 정리한 자료로, 각 시군 보건소의 최신 운영 정보를 기반으로 구성되었습니다.<데이터 현행화 시기>본 데이터는 연 1회 현행화되며, 차기 업데이트 예정일은 2027년 2월입니다.
