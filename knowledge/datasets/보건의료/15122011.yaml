description_portal: 본 데이터는 경기도 광주시청에서 관리하는 예방접종 의료기관 현황 자료입니다. 주요 제공 항목은 의료기관명, 전화번호, 어린이 국가예방접종, HPV 국가예방접종, B형주산기지원사업, 인플루엔자(어린이), 인플루엔자(어르신), 인플루엔자(임신부), 폐렴구균(어르신), 코로나19, 우편번호, 주소 등으로 구성되어 있습니다. 이 데이터는 광주시 관내 보건의료 기관별 예방접종 실적과 다양한 접종 서비스 제공 항목을 체계적으로 파악할 수 있게 지원합니다. 시민 및 관계기관은 어린이, 어르신, 임신부 등 대상자별 접종 서비스 현황을 신속하게 확인할 수 있으며, 지역사회 건강관리 정책 수립과 의료기관 선택에 활용됩니다.
