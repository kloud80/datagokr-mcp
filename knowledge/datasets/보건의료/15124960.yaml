description_portal: 이 데이터는 질병관리청이 관리하는 인플루엔자 예방접종 사망신고에 대한  자료입니다. 2020년 9월부터 12월까지 발생한 인플루엔자 예방접종 사망신고에 대한 정보를 담고 있으며, 이 데이터에는 신고된 제조사별 백신, 지역별 사망신고 건수, 연령별 사망신고 건수를 포함하고 있습니다. 이 자료는 예방접종의 안전성을 평가하고, 이상반응 발생 양상을 분석하여 백신 안전 관리 정책을 수립하는데 기초 자료로 활용될 수 있습니다. * 2020년 9월~12월 인플루엔자 예방접종 사망신고 사례로 인플루엔자 예방접종과 사망 간 인과성이 인정된 사례는 없으며, 지역별 데이터에서 제주특별자치도는 호남권 수치에 포함되어 있음
