summary_user: 국립중앙의료원이 제공하는 의료기관별 실시간 병상·장비 가용 정보를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 담는 데이터로, 응급실·수술실·중환자실 종류별·일반병동 가용 병상과 CT·MRI·혈관조영장비·인공호흡기·인큐베이터 가용 여부, 당직의 정보, 입력·수정 시각이 기관 한 곳 단위로 들어 있다. 응급 상황에서 "지금 근처 병원 응급실이나 중환자실에 빈 병상이 있고 CT를 찍을 수 있는가"를 확인하려는 국민·구급 관계자, 지역별 병상 여력을 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기관 식별값(BFR_INST_ID)을 같은 기관 코드 체계로 맞추거나 기관명 매핑으로만 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 보건복지부 국립중앙의료원에서 제공하는 의료기관 실시간 병상 정보입니다.\""
