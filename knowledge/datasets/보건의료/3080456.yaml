description_portal: 등록된 소독업소 등록 정보로 영업상태, 업소명칭,업소 소재지, 업소 전화번호 등의 정보를 제공합니다.소독업 인허가 정보 데이터는 해충, 유해 미생물 등 감염병 매개체를 제거하는 소독업체의 인허가 현황을 담고 있는 자료입니다. 이 데이터는 보건 위생 관리 및 감염병 예방 활동을 위한 기초 자료로 될 수 있습니다. 이 데이터는 소독업체를 관리하고 감독하는 데 활용됩니다.  소독 작업의 품질을 관리하여 공중 보건 위생을 강화하는 역할을 할 수도 있으며 감염병이 확산될 우려가 있는 경우, 인근 소독업체 정보를 신속하게 파악하여 방역 활동에 투입하는 데도 유용할 수 있습니다.
