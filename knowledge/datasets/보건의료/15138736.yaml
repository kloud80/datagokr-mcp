description_portal: 본 데이터는 광주광역시에 소재한 요양보호사 교육기관을 이수한 응시자의 연도별.회차별로 시행된 요양보호사 자격시험의 접수자 수, 응시자 수, 남성 합격자 수, 여성 합격자 수, 전체 합격자 수, 그리고 10대부터 90대 까지의 연령대별 응시 및 합격 현황을 제공하고 있습니다.2010년 제1회 요양보호사 자격시험부터 2024년도 제43회 요양보호사 자격시험(2024.10.14.) 기준입니다.이 데이터는 다음과 같은 목적과 활용 가능성을 가지고 있습니다. - 정책 수립에 필요한 기초자료로 활용 - 지역 사회의 직업 및 인재 수급 현황 파악에 기여 - 공공데이터 분석 및 민간 활용 기반 제공
