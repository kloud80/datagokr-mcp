summary_user: 제주특별자치도가 한방 난임 치료(한방 진료와 첩약 3개월) 지원사업에 참여하는 한의원을 한 곳당 한 행으로 담은 목록으로, 한의원명·전화번호·소재지·데이터기준일자를 담는 작은 CSV 파일(약 2.5KB)이다. 제주에 사는 난임부부가 "집 근처에서 한방 난임 지원을 받을 수 있는 한의원이 어디인가"를 찾고 연락처를 확인하는 데 쓴다. 전역 조인 키가 없어 의료기관 인허가(LOCALDATA) 한의원 목록 등 다른 데이터와는 한의원명이나 주소를 직접 맞춰서만 이어 쓴다.
description_portal: '제주특별자치도에서 관리하는 한방 난임 치료지원 한의원과 관련한 데이터를 제공합니다.항목: 한의원명. 연락처, 주소 등*목적: 제주특별자치도와 제주특별자치도 한의사회에서는 한의학적 치료법으로 난임부부의 건강 개선 및 출산장려 시책의 일환으로 난임부부의 출산 문제 해결과 경제적 부담 경감을 통해 출산 친화적 사회 환경 조성*지원내용: 한방 난임 진료 및 첩약 3개월 제공 지원 (진료 내용에 따라 본인부담금 추가 발생 가능)자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/news/news/data.htm?act=view&seq=1406768'
