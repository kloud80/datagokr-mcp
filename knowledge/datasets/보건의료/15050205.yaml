description_portal: 음주폐해예방 관련 지표- 국세청 국세통계연보 자료를 바탕으로, 정부 세입에서 주세가 차지하는 비율을 나타낸 것입니다. - 세입은 자진납부세와 고지결정세액 중 납부세액을 합한 금액에서 환급액을 차감한 수납액을 기준으로 산출됩니다. - 자료는 연도별 세입 총액과 주세 수입, 그리고 세입 대비 주세 비율이 함께 제시되며 단위는 백만 원과 퍼센트로 구분돼 이를 통해 특정 연도의 정부 전체 세수 가운데 주세가 차지하는 비율을 수치로 확인할 수 있도록 구성되어 있습니다.- 본 데이터는 음주폐해예방 및 절주문화 확산 관련 연구 시 기초자료로 활용될 수 있습니다.
