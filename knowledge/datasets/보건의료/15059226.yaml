summary_user: 건강보험심사평가원의 외래처방약품비 고가도지표(OPCI) 평가결과를 경기도 의료기관별로 담은 데이터로, 기관명·평가내역·평가등급(5등급, 숫자가 작을수록 동일평가군 내 약품비가 낮음)과 시군·주소·위경도를 한 행에 둔다. 시민이 '우리 동네 의원 중 약품비 처방 수준이 낮은 곳은 어디인가'를 확인하거나, 분석가가 시군별 약품비 등급 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명·주소 매칭이나 시군코드(SIGUN_CD)·위경도 기준으로만 이어 쓴다.
description_portal: 이 데이터는 건강보험심사평가원이 제공하는 병원평가자료로, 외래진료에서 발생한 약품비용에 대한 평가결과를 제공합니다. 주요 평가지표는 외래처방약품비 고가도지표(OPCI, Outpatient Prescribing Costliness Index)이며, 환자당 투약일 기준으로 처방된 약품비의 평균치를 기준으로 의료기관의 약물비용 수준을 5등급으로 구분합니다. 숫자가 작을수록 동일평가군 내에서 약품비가 낮은 기관을 의미합니다.평가 대상은 상급종합병원, 종합병원, 병원, 의원 등이며, 진료월이 6개월 미만이거나 명세서건수가 120건 미만 등 일정 조건에 해당하는 의료기관은 등급에서 제외됩니다.제공 항목에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 주소정보(REFINE_ROADNM_ADDR, REFINE_LOTNO_ADDR, REFINE_ZIP_CD), 위치정보(WGS84 위도·경도) 등이 포함됩니다.이 데이터는 보건정책 분석, 의료기관의 약물비용 효율성 평가, 시민의료정보 접근성 개선, 약품비 절감 정책 수립 등에 활용될 수 있으며, Open API를 통해 손쉽게 접근할 수 있어 다양한 플랫폼과 연구에서 실용적으로 사용할 수 있습니다.
