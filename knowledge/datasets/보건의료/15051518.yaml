summary_user: 근로복지공단 소속병원의 2014년 12월 기준 진료 실적과 보건사업 운영 결과를 연도별·병원별로 집계한 통계 파일이며, 실측 필드 기준으로는 연도별 일반검진·특수검진·채용신검·보건관리대행·작업환경측정 건수를 담는다. 산재·직업보건 분석가가 '공단이 연도별로 건강진단과 작업환경측정을 얼마나 수행해 왔는가'처럼 직업병 예방 서비스의 장기 추이를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 병원 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 근로복지공단 소속병원의 2014년 연간 진료 실적 및 보건 사업 운영 결과를 종합적으로 집계한 방대한 통계 자료입니다. 본 자료는 총 8개의 세부 CSV 파일로 구성되어 있으며, 공단 소속 병원의 운영 효율성, 산재 진료 특성, 그리고 공공 보건 기여도를 다각도로 평가할 수 있는 핵심 지표를 제공합니다.진료 현황 관련 파일들은 권역별, 병원별, 급여 유형별 환자 수와 진료 수익을 상세히 분석합니다. 특히, 산재 환자에 대해서는 병원별 입원 및 외래 환자 수를 파악할 수 있을 뿐만 아니라, 이들의 요양 기간을 6개월 미만부터 10년 이상까지 세분화하여 산재 재활 및 만성기 관리의 장기적 수요와 병원별 중증 치료 역량을 심층적으로 진단하는 근거를 제공합니다. 또한, 산재보험 외 건강보험, 의료급여 환자의 진료 인원과 수익 정보를 포함함으로써, 공단 병원이 지역 사회의 종합 공공 의료 안전망으로서 수행하는 역할을 재정적으로 평가할 수 있습니다.더 나아가 병원별 일평균 환자 진료 현황을 통해 병상 수와 허가 병상 가동률 등 핵심 경영 지표를 제시하여 의료 인프라의 활용 효율성을 분석하게 합니다. 마지막으로, 연도별 건강진단 및 작업환경측정 현황은 1977년부터 2014년까지의 장기 시계열 데이터를 포함하며, 공단이 직업병 예방 및 근로자 건강 증진 영역에서 수행해 온 공공 보건 서비스의 역사와 규모를 실증적으로 보여줍니다.※ 해당 목록에는 2014. 12월 기준 데이터만 존재합니다.
