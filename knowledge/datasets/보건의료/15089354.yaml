summary_user: 치매 상병(F00~F03, G30)이 있고 치매 약제를 처방받아 해당 연도에 입원·외래 의료 이용이 있는 환자 수(분자)를 건강보험 가입자·의료급여수급권자 수(분모)로 나눈 치매의료이용률을 연도·전국 시도·시군구별로 집계한 파일 자료다. 지자체 보건 담당자나 분석가가 '우리 시군구의 치매 의료이용률이 다른 지역보다 높은가, 해마다 어떻게 변했나'를 비교하는 데 쓴다. 공통 조인 키(행정구역 코드)가 없어 다른 지역 통계와는 시도·시군구 이름과 지표연도를 맞춰 이어 써야 한다.
description_portal: '본 데이터는 해당 연도에 치매로 인해 입원 또는 외래 의료 이용이 발생한 환자의 비율을 산출한 자료입니다. 치매 환자는 주상병 코드(F00~F03, G30)를 보유하고 치매 치료 약제를 처방받은 자로 정의되며, 산출식은 건강보험 가입자 또는 의료급여수급권자 전체 대비 치매로 의료기관을 이용한 환자의 비율(%)입니다. ○ 내용: 해당년도 치매로 의료 이용이 있는 환자의 비율○ 대상: 해당년도 입원 또는 외래로 요양기관을 방문한 치매 환자○ 산출식   - 분자: 치매로 입원 또는 외래 의료이용이 있는 실인원 수   - 분모: 건강보험 가입자 또는 의료급여수급권자 수※ 치매 환자: 치매 상병 코드(F00~F03, G30)가 있고 치매 약제를 처방 받은 환자'
