summary_user: 전국 보건소와 금연지원센터별로 금연사업 담당자·금연상담사·금연지도원 등 금연지원서비스 인력을 인력구분과 최종학력(고등학교 이하·전문대·대학교·대학원)별 인원수로 집계한 파일 데이터입니다. 지역 보건정책 담당자나 분석가가 "우리 시도 보건소의 금연상담 인력은 몇 명이고 학력 구성은 어떤가"처럼 지역별 금연사업 인력 배치 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 보건소·지역사회 건강조사 데이터와는 지역명·기관명(보건소명) 문자열 매칭으로만 이어 쓴다.
