summary_user: 부산광역시 서구에 등록된 의료기기 판매업소를 업소 한 곳당 한 행으로 담은 목록 파일로, 일련번호·영업소명·도로명 소재지 주소를 담는다. 주민이나 분석가가 '서구 안에서 의료기기를 살 수 있는 곳이 어디에 있나', '편의점 등 겸업 업소를 포함해 판매업소가 어느 동네에 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에 업소 코드 같은 전역 조인 키가 없어 다른 데이터와는 영업소명이나 도로명 주소를 맞춰 이어 쓰고, 주소를 지오코딩해 서구 내 의료기관·약국 위치 데이터와 겹쳐 본다.
description_portal: '이 데이터는 부산광역시 서구 의료기기 판매업소에 대한 데이터입니다.수집 항목에는 영업소명, 영업소 소재지(도로명), 순번 등이 포함되어 있으며, 이를 통해 의료기기 취급 업소의 위치·접근성 파악, 관내 의료 인프라 현황 분석 등 활용이 가능합니다.예시 데이터에는 ‘동남메디칼’, ‘CU부민캠퍼스후문점’, ‘씨유 서구보건소점’ 등 의료기기 판매업을 겸하거나 취급하는 업소들의 도로명 주소 정보 등이 포함되어 있습니다.** 항목별 설명순번: 데이터 내 각 업소의 번호로, 조회 및 관리 편의를 위해 부여된 일련번호영업소명: 의료기기판매업으로 등록된 사업장의 공식 명칭영업소소재지(도로명): 업소의 도로명 기반 주소'
