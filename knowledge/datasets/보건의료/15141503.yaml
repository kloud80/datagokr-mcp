description_portal: 이 데이터는 종로구 관할 내 집단급식소의 인허가 이력을 수록한 행정 정보입니다. 집단급식소는 학교, 기업, 병원, 복지시설 등에서 일정 수 이상의 인원에게 식사를 제공하는 시설로, 식품위생법상 철저한 위생관리와 행정 감독 대상입니다. 해당 데이터는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등을 포함하여 급식소의 개설, 변경, 폐업 등의 행정이력을 상세히 보여줍니다. 공공보건 정책, 위생감시 체계, 영양개선 사업, 급식 안정성 확보 등 다양한 행정 및 연구 목적에 활용할 수 있는 기초 자료입니다.
