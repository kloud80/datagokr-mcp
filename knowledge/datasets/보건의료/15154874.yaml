summary_user: 전국 자치단체가 관리하는 의원 인허가 정보를 개별 의원 단위로 취합한 원천 데이터로, 전체 125,797건에 인허가일자·영업상태·폐업일자·진료과목·병상수·주소·좌표를 담는다. 상권 분석가나 지자체 담당자가 특정 지역에서 의원이 최근 개업·폐업했는지 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 address 키로 삼아 다른 주소 기반 데이터와 이어 쓴다.
description_portal: '건강_의원 데이터는 의원, 보건소, 한의원 등 진료시설을 갖추고 환자를 대상으로 의사가 의료행위를 하는 의료기관 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 의원 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 보건복지부 의료기관정책과 / 044-202-2481 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
services:
  - op: /info
    name: 건강_의원 데이터 조회
    endpoint: https://apis.data.go.kr/1741000/clinics/info
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[LCPMT_YMD::GTE]
        required: false
        desc: 인허가일자 이상의 값(YYYYMMDD)
      - name: cond[LCPMT_YMD::LT]
        required: false
        desc: 인허가일자 미만의 값(YYYYMMDD)
      - name: cond[SALS_STTS_CD::EQ]
        required: false
        desc: 영업상태코드 와 일치하는 값
      - name: cond[ROAD_NM_ADDR::LIKE]
        required: false
        desc: 도로명주소 을(를) 포함하는 값
      - name: cond[MDLCR_INST_BTP_NM::LIKE]
        required: false
        desc: 의료기관종별명 을(를) 포함하는 값
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
      - name: cond[BPLC_NM::LIKE]
        required: false
        desc: 사업자명 을(를) 포함하는 값
