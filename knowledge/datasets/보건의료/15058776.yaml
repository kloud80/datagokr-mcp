summary_user: 경기도의료원 산하 병원별로 가정간호사업의 월별 실적(지원 인원, 방문 횟수, 진료비 지원 금액)을 집계한 자료로, 건별 원천이 아닌 병원·연월 단위 집계입니다. 공공의료 정책 담당자나 분석가가 '경기도 공공병원 중 어느 곳이 가정간호 방문을 가장 많이 했고 진료비 지원은 얼마였나' 같은 병원별·시기별 비교 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원명(HOSPTL_NM) 이름 매칭이나 연월 기준으로만 이어 쓴다.
description_portal: 경기도의료원에서 제공하는 공공의료사업(가정간호사업)실적 현황입니다.  약재 및 재료비, 처치비, 방문비, 교통비 등 진료비 지원 금액 및 방문횟수, 지원인원 등에 대한 정보를 제공합니다.이 데이터는 경기도에서 시행하는 공공의료사업 중 하나인 ‘가정간호사업’의 실적 현황을 정리한 자료로, 병원별로 시행된 방문간호 활동의 규모와 진료비 지원 내역을 월별로 집계하여 제공합니다. 주요 항목은 **년월, 병원명, 지원실적(총 인원), 지원실적(방문 횟수), 진료비(원 단위)**로 구성되어 있으며, 지역 내 공공의료기관이 가정 간호 서비스를 통해 얼마나 많은 대상자에게 의료를 제공했는지를 보여줍니다.가정간호사업은 병원 방문이 어려운 만성질환자, 노약자, 퇴원환자 등을 대상으로 간호사가 환자의 가정을 직접 방문하여 의료 처치, 건강관리, 투약 지도, 재활 교육 등을 수행하는 서비스입니다. 해당 사업은 지역 간 의료접근성 격차 해소, 장기입원 감소, 병원 내 감염 예방, 가정 중심 건강관리 체계 구축 등에 기여하고 있으며, 특히 진료비 지원은 공공재정이 투입되는 복지의료서비스로서의 역할을 강화합니다.본 자료는 병원별 사업 실적 비교, 지역 간 의료서비스 편차 분석, 공공의료 예산 배분 평가, 의료 복지 수요 예측, 방문간호 확대 정책 기획 등에 활용될 수 있으며, 경기도 및 관할 보건의료기관이 수집한 공공데이터입니다.
