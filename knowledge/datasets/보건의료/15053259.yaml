summary_user: 전주시 내 의료기기 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 영업소명·도로명 소재지·위도·경도·데이터기준일을 포함한다(CSV 약 27만 바이트). 주민이나 분석가가 "우리 동네 근처에서 의료기기를 살 수 있는 판매업소가 어디에 몇 곳 있나"처럼 지역 내 의료기기 유통망과 접근성을 볼 때 쓴다. 전역 조인 키나 업소 코드가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 업소 코드·허가번호 같은 공통 키가 없어 식약처 의료기기 품목허가나 인허가 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 전주시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
