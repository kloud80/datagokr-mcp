description_portal: 이 데이터는 한국한의약진흥원이 수집·정제한 한약 실험정보 중 독성 시험의 치사율 예측 데이터로, 한약재별 투여 조건과 치사율 측정 결과를 표준 형식으로 정리한 정형 자료입니다. 주요 항목은 한약재 ID, 투여약물유형, 추출용매, 투여용량, 투여(용량)단위, 독성측정 값(%)으로 구성되며, 각 행은 특정 한약재 추출물 또는 화합물의 투여 조건과 치사율 시험에서 얻은 결과값을 일관되게 제공합니다. 예시에는 KMH9, KMH6, KMH39, KMH48 등의 한약재가 다양한 추출용매와 투여량으로 시험된 치사율 수치가 기록되어 있어, 한약재별 치사율 예측 정보를 체계적으로 확인하고 관리할 수 있습니다.
