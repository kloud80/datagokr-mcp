description_portal: 재활의학 영역에서 가장 널리 사용되고 있는 일상생활동작 수행능력의 평가방법으로 수정바델지수(Modified Barthel Index, MBI)가 있다. 이는 일상생활에 필요한 10개 항목(개인위생, 목욕하기, 식사하기, 용변처리, 계단 오르기, 옷 입기, 대변 조절, 소변 조절, 보행, 이동)으로 구성되어 있다. 각 항목은 1) 과제를 수행할 수 없는 경우, 2) 최대의 도움이 필요한 경우, 3) 중증도의 도움이 필요한 경우, 4) 최소의 도움이나 감시가 필요한 경우, 5) 완전히 독립적인 경우의 5단계로 구분되어 있으며, 전 대상 항목에 대해 수행을 전혀 할 수 없는 경우 수정바델지수는 0점, 독립적으로 완전하게 수행할 수 있는 경우 100점이 된다.
