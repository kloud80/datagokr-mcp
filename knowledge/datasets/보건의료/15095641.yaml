summary_user: 인천광역시에 등록된 약국을 한 곳씩 담은 CSV 파일로, 군구명·업종·시설명·소재지 주소를 시도 범위에서 개별 시설 단위로 제공한다. 시민이 "우리 구에 있는 약국은 어디인가"를 찾거나, 분석가가 군구별 약국 분포를 세어 약국이 적은 지역을 가려내는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 군구명이나 시설명·주소 같은 이름 기준 매핑으로만 연결하며, 인구 통계 등과 결합하려면 군구명을 행정구역 코드로 직접 맞춰야 한다.
