summary_user: KCD 4단 상병(주진단·부진단 전체, 한방상병 제외)별로 성별·5세 단위 연령군에 따른 건강보험 환자수와 명세서 청구건수를 진료년도 단위로 집계한 전국 통계 파일이다. 분석가가 '특정 질병의 환자가 어느 성별·연령대에 몰려 있는가'처럼 상병별 인구학적 분포를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 상병코드를 KCD 상병명 코드표와 이름·코드로 매핑하거나 같은 기관(심평원)의 다른 진료 통계와 코드 기준으로 맞춰 쓴다.
description_portal: 'KCD 4단 상병별(주진단, 부진단 전체) 성별, 5세 단위 연령군별 환자수 및 청구건수 / 진료일자 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024.1월~12월, 심사년월: 2024.1월~2025.4월 / 보험자: 건강보험 / 한방상병 제외※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 연령별 환자는 명세서에 기재된 수진자의 만(滿)나이 기준으로 범주 내 동일인의 중복을 제거한 값이지만, 진료시점에 따라 중복집계될 수 있으며 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
