description_portal: '-부산광역시 남구 목욕업소의 업소명,주소, 소재지 전화에 대한 설명자료-목욕업소를 운영하기 위한 영업신고 절차는 다음과 같습니다. "공중위생관리법"에 따라 관할 시/군/구청의 위생 관련 부서(보건소 등)에 신고해야 합니다.1. 사전 준비 및 확인 사항건축물 용도 확인: 해당 건물이 목욕장업에 적합한 용도인지 확인해야 합니다. 건축물대장을 통해 "근린생활시설" 등으로 되어 있는지 확인하고, 위반 건축물 여부를 미리 점검해야 합니다. (위반 건축물은 영업신고가 불가할 수 있습니다.)토지이용계획 확인: 토지의 용도에 따라 영업이 제한될 수 있으므로 토지이용계획확인서를 통해 확인합니다.정화조 용량 확인: 하수처리시설 또는 개인정화조 용량이 목욕장 영업에 충분한지 확인합니다.교육환경보호구역 저촉 여부 확인: 주변에 학교 등이 있을 경우 교육환경보호구역에 저촉되는지 확인이 필요할 수 있습니다.시설 및 설비 기준 충족 여부:욕실, 욕조, 샤워기를 갖춘 목욕실과 탈의실, 발한실(찜질방 등)을 각각 설치해야 합니다. (단, 서비스 종류에 따라 일부 면제될 수 있음)발한실 내 발열기 설치 시 방열 및 불연소재 안전망을 설치해야 합니다.목욕실, 발한실, 탈의실, 편의시설, 휴식실은 각각 별도로 구획해야 합니다.실내 공기 정화를 위한 환풍 및 정화시설 또는 환기용 창을 설치해야 합니다.목욕물의 수질기준 및 수질검사 방법을 준수해야 합니다.위생교육 이수: 영업신고 전에 공중위생영업자 위생교육을 미리 이수하는 것이 좋습니다. 일반적으로 (사)한국목욕업중앙회에서 교육을 주관하며, 집합교육 또는 온라인 교육으로 이수할 수 있습니다. (교육필증 필수 제출)안전 관련 증명서 준비:소방시설 등 완비증명서: 찜질방이 있거나 특정 면적 이상(욕실 내 면적 제외 300㎡ 이상)의 목욕장업은 소방서장이 발급하는 안전시설 등 완비증명서가 필수입니다.전기안전점검 확인서: 한국전기안전공사에서 발급하는 전기안전점검 확인서가 필요합니다.액화석유가스(L'
