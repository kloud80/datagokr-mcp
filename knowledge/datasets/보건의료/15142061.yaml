summary_user: 서울 마포구 관내 병원·종합병원·치과병원 등 입원시설을 갖춘 의료기관을 사업장 한 곳당 한 행으로 담은 인허가 원천 자료로, 인허가일자·영업상태·폐업일자·주소·좌표와 병상 수·의료인 수·진료과목 같은 시설 정보가 들어 있다. 주민이나 상권 분석가가 '마포구에서 최근 문을 열거나 닫은 병원은 어디인가', '우리 동네 병원의 진료과목과 병상 규모는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에서 전국 공통 조인 키를 찾지 못해, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
description_portal: 서울특별시 마포구의 병원, 종합병원, 치과병원 등 의사가 환자를 진찰 및 진료하는데 필요한 설비가 갖춰있으며, 30명 이상의 환자를 수용할 수 있는 시설을 갖춘 의료기관 정보 현황 정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 병원을 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민과 관계 기관은 관내 병원의 위치, 진료 과목, 시설 규모 및 운영 현황을 쉽고 정확하게 파악하고, 보건의료 정책 및 주민 건강 관리에 활용할 수 있습니다.
