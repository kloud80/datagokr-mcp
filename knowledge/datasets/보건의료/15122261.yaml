description_portal: '□ 데이터 개요국민건강보험공단_건강보험 산정기준_개편 데이터는 2018년 건강보험료 부과체계 1단계 개편 이후, 지역가입자의 건강보험료 산정을 위해 적용된 산정기준 정보를 담고 있는 기준 데이터입니다. 이 데이터는 지역가입자의 세대 소득, 재산, 자동차 보유 여부, 임차료(월세) 등 다양한 요소를 반영하여 보험료를 산정하는 과정에서 사용되는 변수들을 연도별·기준기간별로 정리한 것입니다.□ 주요 변수(컬럼) 설명적용시작년월 / 적용종료년월: 해당 산정기준이 적용되는 시작과 종료 시점 (YYYYMM 형식)세대최고경감율 / 피부양자경감율 / 평가소득세대경감율 / 최저보험료세대경감율: 세대 또는 조건별 보험료 경감 비율월세공제금액 / 월세환산계수 / 월세상한율: 임차료에 대한 공제 및 환산 기준자동차감액기준년단위 / 자동차감액기준감액율: 자동차 보유 기준 및 감액율소득최저점수 / 소득상한환산점수 / 최저보험료환산점수: 보험료 산정을 위한 점수 기준보험료환산금액 / 보험료환산계수 / 보험료율: 점수에 따라 환산된 보험료 계산 요소최저보험료 / 최대보험료: 보험료 산정 시 적용 가능한 최소 및 최대 한도적용여부: 해당 기준이 실제 적용되었는지 여부(Y/N)'
