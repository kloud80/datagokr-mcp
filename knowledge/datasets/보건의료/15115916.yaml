description_portal: '본 데이터는 서울특별시 중구 내에서 보조기구 등 다양한 품목을 유통업 형태로 취급하거나 대여서비스를 제공하는 업체의 영업신고 및 관리 현황을 통합적으로 제공합니다. 각 등록 업소의 관번호, 현재의 영업 상태(개설, 폐쇄 등), 상세 소재지현황, 좌표정보 등의 주요 항목들로 구성되어 있습니다. 이 자료는 관련 유통업 및 대여서비스 분야 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 규모와 업소관리 현황을 파악할 수 있는 중요한 기초 분석 정보를 제공합니다. 나아가, 시민들에게는 신뢰할 수 있는 경로를 통해 안전성이 확보된 보조기구를 구입하거나 대여할 수 있도록 투명한 정보를 제공하여 국민건강 증진에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
