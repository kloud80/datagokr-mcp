summary_user: 질병관리청 국민건강영양조사를 바탕으로 19세 이상 성인이 평생 술을 1잔 이상 마셔본 비율(평생음주율)을 연도별로 산출한 전국 단위 집계 지표로, 거주지(동·읍면)와 연령대(19-29세부터 70세 이상까지)로 나눠 담는다. 연구자나 절주 정책 담당자가 '도시와 농촌, 연령대별로 평생 음주 경험률이 2007년 이후 어떻게 달라졌나' 같은 질문의 기초자료로 쓴다. 전역 조인 키가 없어 다른 음주 지표나 건강조사 자료와는 연도·연령대·거주지 구분 이름을 맞춰 붙여 써야 한다.
description_portal: 음주폐해예방 관련 지표- 질병관리청 국민건강영양조사 결과를 바탕으로, 19세 이상 성인이 지금까지 살아오면서 술을 1잔 이상 마셔본 적이 있는 비율을 산출한 것입니다. - 데이터는 거주지역, 연령별로 구분하여 성인의 평생음주율을 제공하고 있으며, 데이터 연도범위는 2007년~2020년입니다. - 2021년, 2022년, 2023년에는 해당 지표가 미발표되어 수치가 제시되지 않았습니다.- 본 데이터는 음주폐해예방 및 절주문화 확산을 위한 학계 등의 연구 시 기초자료로 활용될 수 있습니다.
