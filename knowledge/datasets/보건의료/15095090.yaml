description_portal: 본 데이터는 보험급여 현황 중 입내원 1일당 및 급여 1일당 진료비와 급여비를 의료기관 및 약국 구분별로 연도별 제공한 통계자료입니다.본 자료는 의료비 지출 구조 분석, 재정 관리 및 보험 정책 수립 등에 활용할 수 있습니다.○ 보험급여 현황- 입내원1일당 진료비,급여비- 급여1일당 진료비,급여비○  의료기관(입원, 외래), 약국(처방, 직접) 별 입내원 1일당 진료비, 입내원 1일당 급여비, 급여 1일당 진료비, 급여 1일당 급여비를 연도별로 제공 합니다.주 1) 지급기준주 2) 약국의 처방 조제 입내원일수는 총계의 입내원일수에서 제외함, 약국 진료비는 약제비 포함*2022년 주요통계 기준
