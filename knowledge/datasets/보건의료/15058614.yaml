summary_user: 경기도 31개 시군의 피부미용업 인허가 업소를 사업장 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·WGS84 위경도·면적·침대 수·남녀 종사자 수가 들어 있다. 창업 준비자나 상권 분석가가 '우리 동네에 영업 중인 피부관리실이 몇 곳이고 최근 몇 곳이 문을 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 시군코드(SIGUN_CD)나 주소·위경도를 기준으로 다른 업종 인허가 데이터나 행정구역 자료와 이름·좌표 매칭으로 잇는다.
description_portal: 경기도 내 미용업 인허가 현황으로 헤어 메이크업 네일아트 피부관리와 같은 업소 정보를 담고 있으며 시군명과 시군코드 사업장명 인허가일자와 취소일자 영업상태와 폐업일자 소재지 주소 도로명 지번 우편번호 시설 전화번호 및 면적 WGS84 위도 경도와 XY좌표 업태구분명과 위생업태명 건물 층수 지상 지하 사용 시작 끝 층수 한실 양실 욕실 발한실 여부 의자 침대 세탁기 회수건조 시설 수 종사자 수 남녀 구분 조건부 허가 사유 및 기간 건물 소유 구분 다중이용업소 여부 등이 포함되어 있습니다 또한 경기도 31개 시군의 인허가 데이터를 제공하며 피부미용업 현황만 확인하려면 업태구분명을 피부미용업으로 위생업태명을 미용업피부로 선택하여 조회하면 됩니다
