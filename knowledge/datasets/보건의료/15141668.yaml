description_portal: 이 자료는 행정동 단위에서 코로나19 확진자와 사망자 수를 모두 포함하는 다층적 보건 통계로, 지역별 감염 강도뿐 아니라 치명률까지 파악할 수 있게 구성되어 있다. 확진자 수만 제공되는 일반 통계와 달리 사망자 데이터가 포함되어 지역별 의료 접근성, 고위험군 분포, 공공보건 취약성을 평가하는 데 매우 유용하다. 월별 데이터 구조는 장기간 팬데믹의 파급 효과를 관찰할 수 있게 하며, 특정 기간의 급증·급락 원인을 생활방역 정책, 계절 변화, 돌발 감염 요인과 연계해 분석할 수 있게 해준다. 구로구 보건행정이 감염관리뿐 아니라 생명·안전 중심 의사결정을 수행하는 데 필요한 핵심 참조 데이터이다.
