description_portal: 음주폐해예방 관련 지표- TV, 라디오, 인쇄, 온라인 등 다양한 매체를 기준으로 집계된 주류광고비를 연도별로 정리한 지표입니다. - 매체별로 구분된 광고비 지출 규모를 확인할 수 있으며, 특정 매체에서의 지출 비중과 연도별 변화를 비교할 수 있도록 제시되어 있습니다.- 매체는 지상파TV, 종편TV, 케이블TV, 라디오, 신문, 잡지로 구성되어있으며, 데이터 범위 연도는 2000년~2024년입니다. - 본 데이터는 주류업계가 음주를 조장하기 위하여 광고비로 집행하는 비용을 제공함으로써, 음주폐해예방연구에 활용될 것으로 기대합니다.
