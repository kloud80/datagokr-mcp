summary_user: 전주시 안에 있는 의료기기수리업 업소를 한 곳씩 담은 파일 데이터로, 사업장명·인허가일자·상세영업상태·전화번호·도로명/지번주소·위도·경도와 수리대상 의료기기 유형, 겸업 여부를 포함한다. 병원·의료기관 관리자나 사업자가 '전주에서 특정 유형의 의료기기를 수리하는 영업 중인 업체가 어디에 있는가'를 찾거나, 분석가가 지역 내 수리업체 분포를 지도에 올리는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로만 이어 쓴다.
