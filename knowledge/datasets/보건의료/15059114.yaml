summary_user: 식품의약품안전처가 안전성 문제·품질 부적합·행정처분 등으로 회수되거나 판매가 중지된 의약품을 건별로 담으며, 품목명·업체명·회수사유·강제회수 여부·승인일자·회수명령일자를 제공하고 범위는 전국이다. 약국·의료기관이나 환자가 '지금 쓰는 이 약이 회수 대상인가, 왜 회수됐나'를 확인하거나, 제약·유통업체가 자사·거래 품목의 회수 이력을 점검하는 데 쓴다. 실측 컬럼에서 공통 조인 키가 확인되지 않아 식약처 의약품 허가정보·e약은요 등과는 품목명·업체명 매칭으로 이어 써야 하며, 품목기준코드가 확보되면 심평원 약가·급여 목록과도 연결할 수 있다.
description_portal: 식품의약품안전처 「의약품 회수·판매중지 정보」 OpenAPI는 안전성 문제, 품질 부적합, 행정처분 등 사유로 인해 회수 또는 판매가 중지된 의약품의 현황을 제공하는 공공데이터입니다. 주요 제공 항목으로는 품목명,업체명,회수사유내용,구분(강제여부),승인일자,회수명령일자 등을 포함하고 있어 해당 의약품의 유통 차단 현황과 안전관리 조치 진행 상황을 객관적으로 파악할 수 있습니다. 이를 통해 의료기관과 환자는 문제 의약품 사용을 예방할 수 있으며, 제약사와 유통업체는 회수 절차 및 관리 체계를 점검할 수 있습니다.
