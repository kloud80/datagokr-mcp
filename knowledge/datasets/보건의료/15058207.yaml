summary_user: 식품의약품안전처가 국민 보건에 필수적인 의약품으로 지정한 품목을 의약품별로 담은 전국 단위 목록으로, 포털 설명상 필수의약품명·적응증·지정일자 등을 제공한다. 제약사·의료기관·연구자가 '어떤 약이 언제 필수의약품으로 지정됐고 어떤 적응증에 쓰이는가'를 확인하거나 지정 추이를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 심평원 약가·급여 목록이나 식약처 허가정보와는 의약품명 매핑으로만 이어 쓴다.
limits: 품목기준코드 같은 공통 키가 확인되지 않아 다른 의약품 데이터와의 연결은 이름 대조에 의존하며 오매칭 위험이 있다. 공급량·재고·품절 현황은 포함되지 않고, 개발계정은 하루 10,000회까지 호출할 수 있다.
