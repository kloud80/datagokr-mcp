summary_user: 경기도 보건소·보건지소별 공중보건의 배치 정보를 기관 한 곳당 한 행으로 담으며, 시군명·시군코드, 기관명, 전화번호, 홈페이지, 지번·도로명 주소, 우편번호, 위경도 좌표, 집계일자(SUM_DE)로 구성된다. 보건정책 담당자나 연구자가 '우리 시군 보건소·보건지소에 공중보건의가 어떻게 배치돼 있고 의료 취약지역은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로, 같은 경기도 데이터와는 시군코드(SIGUN_CD)로, 다른 기관 데이터와는 시군명·주소 매칭이나 위경도 좌표로 잇는다.
description_portal: 경기도 보건의료기관별 공중보건의 배치 현황 데이터는 도내 보건소 및 보건지소에 근무하는 공중보건의 배치 정보를 담고 있으며, 시군명, 보건소명, 전화번호, 소재지 주소(지번·도로명), 우편번호, 위도·경도 좌표, 공중보건의 수(의과, 한의과, 치과) 등의 항목으로 구성되어 있습니다. 해당 데이터는 지역별 의료 인력 분포를 파악하고, 공중보건의의 전문분야별 배치를 분석하는 데 활용됩니다. 또한 보건소별 의사, 한의사, 치과의사 배치 수를 통해 지역 의료 서비스의 균형성과 취약지역 의료 지원 현황을 평가할 수 있습니다. 위도·경도 좌표가 포함되어 있어 GIS 기반 공간 분석 및 의료 접근성 연구에도 활용할 수 있으며, 보건정책 수립, 지역 보건자원 배분, 의료 인프라 개선 등에 중요한 기초자료로 제공됩니다.
