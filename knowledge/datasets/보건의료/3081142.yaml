description_portal: '본 자료는 서울특별시 금천구 관내에서 운영 중인 안경업소의 기본 정보를 정리한 것입니다. 각 업소의 상호명, 주소, 전화번호가 포함되어 있어 주민 여러분께서 필요한 경우 가까운 안경점을 쉽게 찾고, 필요한 상담이나 문의를 편리하게 하실 수 있도록 구성되어 있습니다.안경은 단순한 시력 보정을 넘어 일상생활과 건강, 패션까지 영향을 미치는 중요한 생활 필수품입니다. 이 자료를 활용하시면 시력검사, 안경 및 렌즈 구입, 제품 수리 등을 위해 신뢰할 수 있는 지역 내 안경업소를 손쉽게 찾으실 수 있으며, 전화번호를 통해 운영 시간이나 취급 품목 등을 미리 확인하실 수 있습니다.또한, 자녀의 시력 관리나 고령자의 돋보기 처방 등 가족 단위의 이용이 필요한 경우에도 가까운 업소를 미리 파악해 두시면 생활에 많은 도움이 될 것입니다. 새로 전입하신 주민이나 거주 지역을 옮기신 분들께도 지역 정보로서 유용하게 활용하실 수 있습니다.우리 구는 앞으로도 주민 여러분의 건강하고 편리한 생활을 지원하기 위해 생활 밀접 업종의 정보를 투명하게 공개하고, 누구나 쉽게 활용하실 수 있도록 지속적으로 자료를 제공해 나가겠습니다.(담당부서 : 금천구 보건소 의약과)'
