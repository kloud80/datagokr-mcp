description_portal: '1. 데이터 개요본 데이터는 「국민건강보험공단_영유아건강검진 건강보험료 분위별 종합현황」으로, 영유아건강검진 사업의 대상자·수검자 및 검진 결과(정밀평가 필요) 현황을 건강보험료 분위별로 집계한 통계 자료입니다.2. 자료 기준가. 건강검진사업년도: 2019년 ~ 2024년나. 보험료 분위: 1분위 ~ 20분위다. 단위: 명3. 검진차수 구분검진차수는 월령 기준에 따라 **생후 14~35일, 4개월(4~6개월), 9개월(9~12개월),2세(18~24개월), 3세(30~36개월), 4세(42~48개월),5세(54~60개월), 6세(66~71개월)**로 구분하였습니다.4. 엑셀 시트 구성가. 시트 1: 영유아건강검진 대상자 수 및 수검자 수 현황나. 시트 2: 영유아건강검진 결과 중 ‘정밀평가 필요’ 현황※본 데이터는 개인정보가 포함되지 않은 집계 통계 자료이며, 자격·보험료·급여·장기요양 관련 문의는 공단 대표번호(☎ 1577-1000)로 문의하시기 바랍니다.'
