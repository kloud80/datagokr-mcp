description_portal: '이 데이터는 2025년 12월에 공표한 [2023년 암등록통계] 자료 중, 우리나라 암 환자의 24개 암종별 5년 상대 생존율 자료입니다. 국내 주요 24개 암종에 대해 성별, 연령대, 진단시기 등을 기준으로 산출된 상대생존율 정보를 제공합니다. 상대생존율은 암 환자가 동일 연령대 일반인과 비교했을 때 생존할 확률을 의미하며, 암 치료 성과 및 환자 예후를 평가하는 데 중요한 지표로 활용됩니다.본 데이터는 장기적 암 관리 전략 수립과 생존율 개선 연구를 위한 근거 자료로 활용될 수 있습니다. (단위 : 명, %)'
