summary_user: 2018~2022년 암 산정특례 등록자 수를 연도·신청구분(신규암·재등록암·중복암)·성별·5세 단위 연령대별로 집계한 전국 단위 파일입니다. 보건의료 분석가가 '연도별로 새로 암 산정특례에 등록한 사람과 특례기간 종료 후 재등록한 사람이 성별·연령대별로 어떻게 달라지는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 산정특례·진료 통계와는 연도·성별·연령대 같은 이름 매핑으로만 맞춰 쓴다.
description_portal: '1. 연도: 2018년 ~ 2022년2. 구분: 신규암, 재등록암, 중복암    * 보건복지부 고시 「본인일부부담금 산정특례에 관한 기준」 [별지제1호서식]의 신청구분3. 성별: 남, 여4. 연령: 5세 단위(연도말 기준 만 나이)  - 단, 0세와 1~4세 구분(0세, 1~4세/5~9세/…/100세 이상)5. 등록자수: 연도 내 신청접수구분별 중복 제거6. 구분질환 설명①암: 보건복지부 고시 「본인일부부담금 산정특례에 관한 기준」(이하 ‘복지부 고시’)[별표 3] 중증질환자 산정특례 대상의 구분1에 해당하는 경우②신규암: 신청 당시 암 산정특례 등록이력이 없거나, 기등록된 암의 특례기간 종료 이후 추가 발생한 암을 등록 · 신청하는 경우③재등록암: 암 산정특례 기간 종료 시점에 재등록 사유가 발생하여 등록 · 신청하는 경우  * (재등록 사유) 암환자가 특례기간 종료시점에 잔존암, 전이암이 있거나, 추가로 재발이 확인되는 경우로서       암조직의 제거ㆍ소멸을 목적으로 수술, 방사선ㆍ호르몬 등의 항암치료 중인 경우이거나, 항암제를 계속 투여 중인 경우④중복암: 암 산정특례 적용기간 중 등록한 암과 다른 암종이 추가로 발생(전이암 제외)하여 등록 · 신청하는 경우※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
