summary_user: 국가금연지원서비스에 등록한 대상자 한 명씩의 흡연자평가 표준문항 답변을 담은 파일 데이터로, 지난 1년 금연시도 여부, 시도 방법, 실패 이유, 금연하려는 이유, 흡연을 참기 힘든 시기, 금연동기·자신감·준비 정도와 함께 기관유형·지역·제공기관·출생년도·성별·등록유형이 들어 있다(범위 전국, zip 약 3.8MB). 금연상담 담당자나 보건 분석가가 '보건소 금연클리닉 등록자들이 주로 어떤 이유로 금연에 실패하고 언제 흡연 욕구가 가장 큰가'를 연령·성별·지역별로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역·제공기관 이름을 매핑하거나 같은 기관의 다른 국가금연지원서비스 등록정보 파일과 이어 써야 한다.
limits: 보건소코드·시군구코드 같은 표준 조인 키가 없어 지역사회 건강조사 등 시군구 지표와 바로 붙일 수 없고 이름 매핑이 필요하다. 문항 컬럼(문항1-1 등)은 번호로만 되어 있고 명세에 답변 코드 의미가 없어 포털 설명의 문항 순서와 맞춰 해석해야 한다.
