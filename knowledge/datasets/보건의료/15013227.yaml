summary_user: 장성군 관내 병의원을 기관 한 곳당 한 행으로 담은 소규모 CSV 파일(약 3.5KB)로, 의료기관명·도로명 주소·전화번호·병상 수를 담는다. 주민이 '장성군에서 입원 병상이 있는 병원이 어디고 연락처가 무엇인가'를 찾거나, 분석가가 군 단위 의료기관 분포와 병상 규모를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 이어야 하며, LOCALDATA 병원·의원 인허가 자료나 주소 기반 좌표 변환 결과와 이렇게 대조해 쓴다.
