description_portal: '국립암센터 중앙암등록본부에서 제공하는 협력병기조사(대상 암종: 위암, 결장암, 직장암, 유방암)의 결과 데이터입니다.이 데이터는 국립암센터 위암 환자의 협력병기 조사 정보를 제공하는 서비스입니다. 위암의 병기 분류(예: TNM 병기)와 관련된 환자별 진단 정보가 포함되어 있으며, 암 진행 상태 평가와 치료 계획 수립에 활용됩니다. 협력병기별 환자 분포 분석, 예후 예측, 치료 효과 평가 및 임상 연구에 유용합니다.해당 데이터는 중앙암등록본부 자료제공홈페이지를 통해서도 신청 및 사용하실 수 있습니다. *자료제공홈페이지: https://kccrsurvey.cancer.go.kr/index.do'
