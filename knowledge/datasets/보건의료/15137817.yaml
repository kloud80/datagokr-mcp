description_portal: 본 데이터는 한국보건산업진흥원이 보유한 공공데이터에 적용된 주요 키워드 정보를 정리한 자료이다. 각 데이터에 부여된 대표 키워드와 관련 키워드를 포함하며, 주제 영역, 활용 목적, 분류 기준 등을 바탕으로 체계화되었다. 본 자료는 공공데이터 포털 등재 시 이해가능성 지표 향상과 검색 최적화를 지원하며, 메타데이터 정비 및 품질 관리에도 활용 가능하다. 키워드는 내부 기준과 외부 표준 분류체계를 참고하여 구성되었으며, 사용자 접근성과 검색 편의성 제고에 기여한다. 해당 자료는 정기적으로 검토 및 갱신되며, 공공기관, 연구자, 민간 활용자, 데이터 기획자 등이 데이터 연계와 기준 수립을 위한 참고자료로 활용할 수 있다.
