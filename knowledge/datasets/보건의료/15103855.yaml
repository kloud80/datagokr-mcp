description_portal: '국민건강보험공단_특정 질병에 대한 김천시 수진자의 관내외 진료현황1. 진료연도: 2021년2. 수진자 주소지: 경상북도 김천시3. 요양기관 소재지: 수진자가 진료받은 요양기관 주소지로서 시군구 단위4. 진료인원 수: 2021년 한 해 동안 경상북도 김천시가 주소지인 수진자가 각 지역 요양기관에서 해당 상병(붙임; 상병코드 설명 참고)으로 진료받은 인원 수 - (관내) 김천시, (관외) 그 외 지역 - 건강보험 급여 실적이며, 한의분류 및 약국, 의료급여 및 비급여 제외 - 2022년 6월 지급분까지 반영 - 해당 질병통계 자료는 요양기관에서 환자 진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라   일차 진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음 - 시군구 단위 자료는 개인정보 보호를 위해 5인 미만은 * 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터'
