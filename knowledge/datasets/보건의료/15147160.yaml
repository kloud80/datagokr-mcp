summary_user: 서울특별시 강북구의 약국·한약국 인허가 정보를 업소 한 곳당 한 건으로 담으며, 인허가일·폐업일, 영업상태(정상영업·폐업), 상호, 지번·도로명 주소, 중부원점TM 좌표를 포함한다. 동네 약국이 언제 문을 열고 닫았는지 확인하거나, 상권 분석가가 강북구 안 약국 개폐업 흐름을 상권 신호로 볼 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 주소·상호 매핑이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 강북구 약국 인허가 정보 데이터는 대한민국 약사법에 의거, 약사나 한약사가 의약품을 조제 또는 판매를 주목적으로 하는 업소정보 입니다약국과 한약국 정보가 같이있으며 영업상태에 폐업과 정상영업으로 구분됩니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
