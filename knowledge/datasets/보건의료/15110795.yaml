description_portal: '국립소록도병원에 입원해있는 재원자 수에 대한 데이터입니다. 월별 재원자수를 보험, 급여, 일반으로 구분하여 제공합니다.입원 환자들의 유형별 분포를 분석하거나, 정책 수립을 위한 기초자료로 활용할 수 있습니다.<데이터 이용 시 참고사항>1. 건강보험: 국민건강보험법에 따라 건강보험을 적용받는 환자 수입니다.2. 의료급여: 의료급여법 시행에 따라 1종 또는 2종의 의료급여를 수급하는 환자 수입니다.3. 차상위: 의료급여법 1종 또는 2종의 의료급여를 수급하며 국민건강보험법 시행령 별표2의 본인부담금 감경대상자인 경우의 분류입니다.4. 일반: 보험을 적용받지 않는 환자수입니다.'
