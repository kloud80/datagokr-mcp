summary_user: 군산시 안의 한의원을 한 곳당 한 행으로 담은 목록 파일로, 의료기관명·도로명 주소·전화번호를 수록한다(CSV 약 6.9KB, 시군구 범위의 개별 주소 단위). 군산 주민이나 방문자가 '집 근처 한의원이 어디 있고 연락처가 무엇인가'를 찾을 때, 또는 분석가가 군산시 한의원 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명 주소를 맞춰 붙여야 하며, LOCALDATA 한의원 인허가 자료나 건강보험 요양기관 목록과 이름·주소 매칭으로 이어 쓴다.
