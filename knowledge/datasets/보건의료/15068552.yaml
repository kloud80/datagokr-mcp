description_portal: '보건복지부에서 2024년 1월 말 기준 보건복지부 소관 특수법인 현황 정보(유형, 명칭, 대표자, 소재지, 설립근거, 설립일자, 설립목적, 담당부서)를 제공하고 있습니다. 보건복지부 소관 특수법인은 공공복지, 보건의료, 사회서비스 등 국가 복지정책을 지원하기 위해 설립된 기관들입니다. 국민연금공단, 건강보험공단, 한국보건산업진흥원, 사회보장정보원 등이 있으며, 각 기관은 법률에 근거하여 공적 역할을 수행합니다.<데이터 이용 시 참고사항>1. 준정부기관 : 정부가 주요 기능을 위임한 기관으로, 공공성과 책임성이 높은 업무를 수행2. 기타 공공기관 : 준정부기관보다 규모는 작지만, 공익 목적의 정책을 지원하는 기관3. 기타 특수법인 : 특정 법률에 따라 설립된 비영리 법인으로, 전문 분야에서 공공기능을 수행'
