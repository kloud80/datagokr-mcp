description_portal: 총 164개의 레코드로, subcellular format 실험을 통해 도파민 수송체, 아미노산 수송체, NF-κB 복합체, DNA topoisomerase I, NMDA 수용체 등 다양한 단백질·조직·세포소기관 수준의 표적에 대한 데이터를 포함합니다. 대상유형은 SINGLE PROTEIN, PROTEIN COMPLEX GROUP, SUBCELLULAR, TISSUE, ADMET 등으로 구분되며, 대상명·대상생물종(주로 쥐, 사람, 생쥐, 세균)과 (해당 시) UniProt ID가 함께 제공됩니다. 생물학적활성시험매개변수에는 IC50, Activity, Ratio IC50, ADMET 관련 지표 등이 포함되며, 상세결과값에는 “= 88.8 nM”, “= 0.51 mg/L”처럼 단위까지 포함된 정량 데이터가 기록되어 있습니다. 특정 화합물이 세포소기관/막/조직 수준에서 수송, 신호전달, 독성(ADMET) 등에 미치는 영향을 비교·분석하고, 세포소기관 타깃 기반 작용기전 연구나 독성 예측 모델 구축에 활용할 수 있는 자료입니다.
