summary_user: 2007년부터 2024년까지 연도별로 의료기관에서 활동 중인 의사·한의사·치과의사·간호사·약사 1인당 국민 수를 전국 단위로 담은 집계 통계 파일이다(csv, 572바이트). 보건정책 분석가나 연구자가 '직종별 보건인력 1인당 담당 국민 수가 해마다 어떻게 줄거나 늘었는가'처럼 의료인력 공급 추이를 볼 때 쓴다. 전역 조인 키가 없고 연도만 있어, 다른 연도별 전국 통계와 연도 기준으로 맞춰 쓰는 정도로만 연결된다.
description_portal: '2007년부터 2024년까지 의료기관에서 활동하고 있는 보건의료인력 1인당 국민 수 현황 정보를 제공하고 있습니다.※ 데이터 항목인 의사, 한의사, 치과의사, 간호사, 약사는 의료기관에서 활동중인 보건인력으로, 각 항목의 데이터는 1인당 국민 수임을 나타냅니다.<통계 이용 시 주의사항>1) 의료기관: 상급종합병원, 종합병원, 병원, 요양병원, 정신병원(2021년부터), 의원, 치과병원, 치과의원, 한방병원, 한의원, 조산원2) 국민 수 : 2024년 12월 기준 [주민등록 인구통계] (행정안전부) 활용3) 의사, 치과의사, 한의사: 의료기관 전속 기준4) 간호사: 의료기관에 근무하는 간호사와 전문간호사(가정전문, 보건전문, 마취전문, 정신전문)5) 약사: 의료기관에 근무하는 약사, 한약사로 주 16시간 이상 근무 기준'
