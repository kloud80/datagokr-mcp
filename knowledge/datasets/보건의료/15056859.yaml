summary_user: 경기도 내 전문병원급 산부인과 의료기관을 기관 한 곳당 한 행으로 담은 목록으로, 기관명·병원종류·시군명과 지번·도로명 주소, 우편번호, WGS84 위경도를 포함한다. 분석가나 정책 담당자가 "우리 시군에서 가장 가까운 전문병원급 산부인과는 어디이고, 산부인과가 없는 지역은 어디인가"처럼 분만·산부인과 접근성과 의료 취약지를 따지는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시군명·기관명 같은 이름 매핑이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 전문병원급 산부인과 의료기관의 현황을 제공하며, 각 기관의 명칭, 소재지, 주소, 병원종류, 시군명 등의 정보를 포함하고 있습니다. 위치정보는 지번주소, 도로명주소, 우편번호는 물론 위도(WGS84위도)와 경도(WGS84경도)까지 제공되어 공간기반 서비스 구축에 활용이 가능합니다. 본 데이터는 공공의료서비스 제공 현황 분석, 의료 취약지역 파악, 산부인과 접근성 연구, 의료시설 위치기반 시스템 구축, 출산 정책 수립 등에 활용될 수 있습니다. 이 데이터는 산부인과 전문 의료서비스의 지역적 분포 및 접근성을 분석할 수 있는 기초 자료로도 활용될 수 있습니다.
