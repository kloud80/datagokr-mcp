summary_user: 경기도 내 결핵 요양시설을 시설 한 곳당 한 건으로 담은 인허가 원천 데이터로, 시군명·사업장명·인허가일자·폐업일자·영업상태와 함께 도로명/지번 주소·위도경도 좌표, 소재지면적, 입소정원, 자격소유 인원수·총 인원수를 담는다. 보건정책 분석가가 "경기도 어느 시군에 결핵 요양시설이 영업 중이고 입소정원은 얼마인가"를 파악하거나, 시설 개폐업 추이로 결핵 관리 인프라 분포를 살피는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명으로 시군 단위 통계와 맞추거나 좌표·주소로 다른 시설 데이터와 공간 결합한다.
description_portal: 이 데이터는 경기도 내 결핵 요양시설의 인허가 및 운영 현황을 담고 있으며, 결핵균이 검출되지 않았으나 장기간 보호와 관리가 필요한 환자를 위한 시설 정보를 포함합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태명, 소재지 주소(도로명/지번), 우편번호, 위도·경도 좌표, 소재지면적, 입소정원, 자격소유 인원수, 총 인원수 등으로 구성되어 있습니다. 해당 데이터는 감염병 예방 및 관리 정책 수립, 결핵환자 치료 인프라 분석, 공공의료 자원 분포 파악, 시설 운영 현황 분석 등 다양한 공공보건 및 복지 정책 수립에 활용될 수 있습니다. 데이터는 행정안전부에서 제공하며, 경기도 31개 시군의 인허가 자료를 기반으로 구축되었습니다.
