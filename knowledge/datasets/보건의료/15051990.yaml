summary_user: 부산광역시 강서구 관내 병원·의원·치과·한의원 등 의료기관을 한 곳씩 나열한 목록으로, 기관 구분·의료기관명·도로명주소·전화번호를 담는다(포털 설명 기준 총 119개소, 내려받은 CSV는 약 12KB). 주민이 강서구 안에서 가까운 한의원이나 치과의원을 찾거나, 분석가가 강서구 의료기관의 종별 분포와 위치를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명주소를 맞춰 붙여야 하며, 전국 병의원 인허가(LOCALDATA) 자료와 대조해 개폐업 여부를 확인하는 식으로 이어 쓴다.
