description_portal: 본 데이터는 한국보건산업진흥원이 보유한 공공데이터의 활용성과 이해도를 높이기 위해 구성한 추천 키워드 정보이다. 각 데이터셋의 특성과 주제에 적합한 연관 단어를 추출하여 정리하였으며, 키워드 기반 탐색, 유사 데이터 연계, 메타데이터 품질 개선 등에 활용된다. 추천 키워드는 데이터 속성, 활용 목적, 검색 수요 등을 고려해 선별되었으며, 주제 분류체계에 따라 체계적으로 구성되어 있다. 본 자료는 공공데이터 포털 등재 시 이해가능성 지표 개선과 검색 편의성 제고에 기여한다. 또한 데이터 간 의미 기반 연결 및 탐색 효율 향상에도 활용된다. 해당 데이터는 정기적으로 갱신되며, 공공기관, 기획자, 개발자 등에게 실무적으로 유용한 자료로 제공된다.
