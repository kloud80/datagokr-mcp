description_portal: '□ 데이터 개요본 데이터는 국민건강보험공단이 관리하는 노인장기요양보험 급여비 지급 현황에 관한 통계 자료입니다.장기요양급여비는 노인장기요양보험 수급자에게 제공되는 서비스에 대해 공단이 지급하는 비용으로, 시설급여(요양시설 서비스), 재가급여(가정 내 요양 서비스), 현금급여비(현금 지원) 등 다양한 급여 유형별 지급 내역을 포함합니다.□ 주요 내용지급명세서 건수: 장기요양급여 지급을 위한 명세서 건수총급액: 장기요양급여비 지급 총액(단위: 백만원)공단 부담금: 국민건강보험공단이 부담한 금액(단위: 백만원)급여 유형: 시설급여, 재가급여, 현금급여비 등 구분 포함단위: 건(명세서 건수), 백만원(금액)□ 활용 안내본 자료는 노인장기요양보험 급여비 지급 현황을 투명하게 공개함으로써 정책 수립 및 관련 연구 등에 활용될 수 있습니다.'
