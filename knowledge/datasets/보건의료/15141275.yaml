summary_user: 금천구 내 병원의 인허가 건별 정보로, 인허가일자·취소일자, 영업상태와 폐업일자, 사업장명·주소·전화번호·좌표, 의료기관종별, 의료인 수, 입원실·병상 수, 진료과목 등을 사업장 단위로 담는다. 금천구에서 어떤 병원이 언제 개설·폐업했고 병상과 진료과목이 어느 지역에 몰려 있는지 확인하려는 분석가나 병원 개원을 검토하는 사업자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 금천구 내 병원의 인허가 현황을 종합적으로 제공하는 데이터로, 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명 등 기본 정보와 함께 의료기관종별, 의료인 수, 입원실 및 병상 수, 진료과목, 구급차 보유 현황, 완화의료 지정 등 병원 운영에 필요한 다양한 정보를 포함합니다. 해당 자료는 병원 설립 계획 수립, 의료자원 분포 분석, 지역 보건 정책 개발, 의료서비스 개선, 응급의료 체계 강화 등 폭넓은 분야에서 활용 가능하며, 지역 내 의료 인프라의 현황을 정확히 파악하고 효율적인 자원 배분을 지원하는 데 기여할 수 있습니다.
