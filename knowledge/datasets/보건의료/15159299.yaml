description_portal: 호흡기바이러스 통합감시 현황은 급성호흡기감염증 환자에게서 확인된 주요 호흡기바이러스 검사 현황을 제공하는 자료입니다. 호흡기 표본감시의료기관에 내원한 환자의 검사 결과를 바탕으로 검사건수, 검출건수, 검출률, 주차별 검출 현황, 바이러스 종류별 검출 결과를 확인하실 수 있습니다. 감시 대상 바이러스는 아데노바이러스, 사람 보카바이러스, 파라인플루엔자바이러스, 호흡기세포융합바이러스, 사람 코로나바이러스, 사람 메타뉴모바이러스, 리노바이러스, 인플루엔자바이러스, 코로나19 바이러스 등입니다. 연도, 월, 주차, 바이러스 종류별 검출 결과를 통해 호흡기 감염병의 발생 흐름과 유행 경향을 살펴보고, 감염병 확산 예방, 유행 상황 파악, 보건 대응 자료로 활용하실 수 있습니다. 자료 관련 문의는 054-339-8234로 하시기 바랍니다.
