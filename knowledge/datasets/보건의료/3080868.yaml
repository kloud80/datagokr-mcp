description_portal: 이 데이터는 2018년 12월 31일 기준, 전북특별자치도 내 의료급여 수급권자의 현황을 유형별로 상세히 분류한 사회복지 통계입니다. 의료급여는 국민기초생활보장제도에 따라 생활이 어려운 저소득 국민의 의료 문제를 국가가 보장하는 공공부조제도입니다. 이 자료는 수급권자를 1종과 2종 등 법정 기준에 따라 구분하여 각 유형에 해당하는 인원이 지역 내에 얼마나 분포하는지를 보여줍니다. 이를 통해 지역 사회의 의료 안전망이 필요한 인구의 규모를 정확히 파악하고, 취약계층을 위한 보건 및 복지 정책을 수립하며 관련 예산의 효율적 배분을 위한 중요한 기초 자료로 활용될 수 있습니다.
