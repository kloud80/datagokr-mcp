description_portal: '이 데이터는 근로복지공단 소속 직영 병원(산재 병원)에서 진료를 받은 산업재해 환자(외래 및 입원)의 진료 인원을 병원별, 연도별로 집계한 통계 자료입니다. 통계 항목은 인천, 안산, 창원, 대구, 순천, 대전, 태백, 동해, 정선, 경기, 서울 등 각 소속 병원별로 해당 연도에 진료를 받은 환자 수(명)를 제공합니다. 이 자료는 지역별 산재 의료 수요에 대한 공공 병원의 대응 규모를 명확하게 보여주며, 특히 지역별 산업재해 발생 및 의료 이용 패턴의 변화를 파악하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 산재 의료 전달 체계의 효율성과 지역 의료 인프라 계획 수립에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 지역 병원(예: 산업 밀집 지역의 병원)의 진료 인원 변화 추이를 분석함으로써, 지역별 산업재해 발생 규모와 환자 유입 정도를 진단할 수 있습니다. 이를 통해 공단 소속 병원의 진료 역량을 강화하거나, 특정 지역에 재활 시설을 확충하는 등 효율적인 의료 자원 배분 방안을 모색하는 데 활용할 수 있습니다. 또한, 이 통계는 공단 병원이 지역 사회 산재 환자의 진료 거점으로서 얼마나 기능하고 있는지를 평가하고, 공공 의료 서비스의 접근성을 개선하는 데 기여할 수 있다고 판단됩니다.'
