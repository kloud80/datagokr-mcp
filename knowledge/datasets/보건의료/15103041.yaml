description_portal: 이 데이터는 국민건강보험공단에서 발간하는 장기요양보험통계연보 자료를 제공합니다. 노인장기요양보험 주요사업실적을 통계로 작성 , 발간하여 보건복지정책 수립과 노인장기요양보험제도 발전의 기초자료 제공을 목적으로 합니다. 주요 수록내역은 다음과 같습니다.   - 장기요양보험 제도 개요 및 소개   - 의료보장인구 현황   - 장기요양 신청 및 인정 현황   - 장기요양 급여실적 현황   - 장기요양기관 및 인력 현황   - 장기요양 재정현황   - 부록(통계설명)※ 장기요양급여비용은 노인장기요양보험법 시행규칙 제14조에 따른 비급여대상으로 정한 항목의비용을 제외한 공단부담금과 본인부담금을 포함한 금액입니다※ 공단부담금은 수급자에게 제공된 장기요양급여(비급여 제외) 비용 중 본인부담금을 제외하고 공단이부담한 금액이며, 지급기준 또는 결산기준으로 구분하여 수록되어 있습니다
