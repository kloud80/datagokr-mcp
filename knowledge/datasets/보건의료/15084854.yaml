description_portal: '○ 통계개요* 통계명 : 보건교육(건강생활실천교육)* 통계종류 : 서울시 건강생활실천에 관한 보건교육 실적 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「국민건강증진법」에 근거하여 실시되는 보건교육 실적* 작성목적 : 대상이 되는 개인 또는 집단의 특성ㆍ건강수준 등에 따라 적절한 보건교육을실시하고, 모든 국민이 건강생활을 실천할 수 있도록 보건복지정책 수립의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 보건소 → 자치구 → 서울특별시 건강증진과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 건강생활실천(금연, 영양, 절주, 운동, 비만 등) 관련 보건교육의 실시 횟수 및 인원 현황○ 용어설명* 보건교육 : 국민건강증진법에 의거 개인 또는 집단으로 하여금 건강에 유익한 행위를자발적으로 수행하도록 하는 교육을 말함'
