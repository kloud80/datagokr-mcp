description_portal: '본 데이터는 서울특별시 중구 관내에서 반려동물을 포함한 동물의 질병 예방 및 치료를 목적으로 운영되는 수의진료기관의 개설신고 및 운영 현황을 통합적으로 제공합니다. 각 진료기관에 부여된 관번호, 현재의 영업 상태(개설, 폐쇄 등), 상세 위치현황 등의 항목들로 구성되어 있습니다. 이 자료는 반려동물 관련 산업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 진료기관 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 자신이 기르는 반려동물의 보건 관리를 위해 정식으로 개설신고를 마친 신뢰할 수 있는 수의진료기관을 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
