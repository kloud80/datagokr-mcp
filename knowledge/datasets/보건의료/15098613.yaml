description_portal: '충청남도 당진시 치과 현황 안내(데이터 기준일자: 2025년 6월 1일)충청남도 당진시는 시민의 구강건강 증진과 의료 접근성 향상을 위해 관내 치과 의료기관의 운영 현황을 관리하고 있습니다.본 자료는 당진시 지역에 위치한 치과의 기본 정보를 정리한 것으로, 다음 항목들을 포함하고 있습니다:의료기관명전화번호도로명주소지번주소위도 / 경도본 자료는 구강보건 정책 수립, 지역 보건의료 자원 관리, 응급진료 체계 정비,GIS 기반 분석, 대시민 의료기관 안내 등 다양한 행정 및 공공서비스 목적에 활용될 수 있습니다.'
