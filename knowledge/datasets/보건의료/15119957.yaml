summary_user: 만 20세 이상 건강보험 가입자·의료급여수급권자 중 허혈성심장질환(I20-I25) 환자의 진료에피소드 발생건수와 발생 28일 내 사망건수를 발생년도·성별·5세 연령군·소득수준·시도·시군구별로 집계한 파일(csv)이다. 보건 분석가나 지자체 담당자가 '우리 지역·소득계층에서 인구 대비 허혈성심장질환 입원 발생과 단기 사망이 얼마나 되는가'를 비교할 때, 인년을 분모로 발생률을 계산하는 데 쓴다. 전역 조인 키는 없어 시도·시군구 코드나 이름을 매핑해 지역 인구·의료자원 통계와 붙이고, 심평원 청구 기준 통계와 함께 볼 때는 공단 자격 기준 값이라 서로 다를 수 있다는 점을 감안한다.
description_portal: 'o 모집단: 해당년도 만 20세 이상 국민 건강보험 가입자 또는 의료급여수급권자(외국인 포함) o 내용: 해당년도 주·부상병 조건(I20-I25)의 만 20세 이상 환자의 진료에피소드 및 사망건수 o 진료에피소드 구축기준   - 진료개시일 간 간격이 28일 이내인 경우 동일한 진료에피소드로 간주함   - 선별조건      ① 1일 이상 입원 또는 1일 내 사망 또는 응급실 방문 또는 (최초발생 7일 내) 기관 간 전원      ② (최초발생 7일 내) 주 이용기관이 급성기병의원(요양병원 제외)인 경우      ③ (최초발생 7일 내) 주 이용기관에서 주·부상병 조건인 경우※ 국민건강보험공단과 원주세브란스기독병원 환경보건센터 공동 개발'
