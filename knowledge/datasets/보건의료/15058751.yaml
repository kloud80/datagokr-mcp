summary_user: 경기도가 제공하는 자동제세동기(AED) 설치 장소별 원천 목록으로, 설치기관명·설치 위치·지번/도로명 주소·위도·경도, 제조사·모델명, 관리자 연락처, 요일·공휴일별 사용 가능 시간과 일요일 주차별 사용 가능 여부를 한 건씩 담는다. 시민이 '지금 내 근처에서 쓸 수 있는 AED가 어디 있나'를 찾거나, 분석가가 지역별 AED 접근성과 야간·휴일 공백을 평가하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어 좌표(REFINE_WGS84_LAT·LOGT)나 주소·기관명으로 응급의료기관 등 위치 데이터와 공간·이름 매칭해 이어 쓴다.
description_portal: 이 데이터는 전국 공공기관, 학교, 경찰서 등 다양한 장소에 설치된 자동제세동기(AED)의 위치 및 운영 정보를 담고 있으며, 심정지 등 응급상황 시 신속한 대응을 가능하게 하는 공공 응급장비 현황을 제공합니다. 설치 장소와 주소, 위도·경도 등의 위치 정보뿐 아니라 장비의 제조사, 설치기관명, 연락처, 가용시간(요일별, 시간대별) 등도 포함되어 있어 시민의 접근성과 응급 상황 대응 체계 분석에 유용합니다. 데이터는 AED의 실제 운영 가능 여부나 특정 요일 및 시간대의 사용 가능성까지 포함하고 있어, 응급의료 시스템 최적화, 지역별 응급장비 접근성 평가, 생존율 향상을 위한 정책 수립 등에 활용될 수 있습니다.
