summary_user: 경기도 시군에 등록된 동물판매업·동물수입업·동물생산업 사업장의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·도로명/지번 주소·전화번호·업종 구분 등이 들어 있다. 반려동물을 분양받으려는 사람이 거주 시군에서 정상 영업 중인 등록 판매업체를 확인하거나, 분석가가 시군별 반려동물 판매·생산업체 분포와 개폐업 추이를 보는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 주소·우편번호를 이름·코드 매핑해 같은 기관의 다른 시군 단위 데이터와 연결하고, 좌표 값이 있으면 지도 위에 겹쳐 본다.
description_portal: 이 데이터는 경기도 31개 시군에 등록된 반려동물 관련 판매업체의 인허가 현황을 담고 있으며, 동물판매업, 동물수입업, 동물생산업 세 가지 업종을 포함합니다. 판매업은 가정용 반려동물을 일반 소비자에게 판매하거나 중개하는 업종이며, 수입업은 동물을 수입해 판매하고, 생산업은 동물을 번식시켜 다른 판매업자 또는 수입업자에게 판매하는 형태입니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태, 주소(도로명 및 지번), 전화번호, 총종업원수 등으로 구성되어 있습니다. 이 데이터는 동물복지 정책 수립, 반려동물 산업 규모 분석, 관련 사업체 분포 조사, 불법 유통 방지 등을 위한 기초자료로 활용될 수 있습니다. 데이터는 주간 단위로 갱신되며, Open API를 통해 효율적으로 접근할 수 있습니다.
