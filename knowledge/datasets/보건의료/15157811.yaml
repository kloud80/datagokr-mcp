summary_user: 경상북도 영천시 관내에 등록된 안전상비의약품 판매업소(편의점 등)를 업소 한 곳당 한 행으로 담은 목록으로, 상호·소재지 주소·전화번호를 담는다. 영천시 주민이나 방문객이 밤이나 휴일에 해열제·소화제 같은 상비약을 살 수 있는 가까운 곳을 찾거나, 분석가가 시내 판매업소 분포를 파악하는 데 쓴다. 필드에 업소 코드나 표준 조인 키가 없어서 다른 데이터와는 상호명이나 주소(소재지)를 직접 맞춰 이어 써야 한다.
description_portal: 해당 경상북도 영천시 내 안전상비의약품판매업 현황 데이터입니다. 본 데이터는 영천시 관내에 등록된 안전상비의약품 판매업소의 상세 정보를 포함하고 있으며, 각 업소의 위치, 업소명, 전화번호, 영업장소 주소 등을 체계적으로 정리하였습니다. 이를 통해 영천시 내 안전상비의약품 판매업소의 현황 파악과 관련 정책 수립에 유용하게 활용될 수 있습니다. 전화번호 부재 및 개인정보의 경우 공란으로 표기하였습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 보건소 보건위생과로 연락주시기 바랍니다.
