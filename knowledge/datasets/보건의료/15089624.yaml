summary_user: 의료행위(검사·수술 등) 행위코드별로 진료년도·성별·연령군에 따른 환자수, 명세서 청구건수, 총사용량, 청구금액을 담은 전국 단위 건강보험 진료 집계 통계입니다. 특정 검사나 수술이 어느 성별·연령대에서 얼마나 시행되고 비용이 얼마나 청구되는지 알고 싶은 분석가나 의료 관련 사업자가 시장 규모와 이용 추이를 파악하는 데 쓴다. 전역 조인 키는 없어 행위코드를 심평원 수가마스터 파일의 행위명과 코드 매핑해 붙이거나 같은 기관의 다른 행위코드 기반 통계와 코드로 이어 쓴다.
limits: 전국 단위 집계라 지역·요양기관별 분석에는 쓸 수 없고, 다른 데이터와 바로 붙일 공통 조인 키가 없어 행위코드 매핑을 따로 거쳐야 한다. 포털 설명상 환자수는 범주 안에서만 중복을 제거한 값이라 성별·연령군 범주를 단순 합산하면 중복이 생기고, 약국·서면·DRG 청구는 제외된다.
