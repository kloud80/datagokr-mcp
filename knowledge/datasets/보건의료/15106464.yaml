description_portal: 대구광역시 정신의료기관(종합병원, 정신병원, 의원) 현황에 대한 데이터로 의료기관명, 주소, 연락처를 제공합니다. 의료법에 따른 의료기관 중 주로 정신질환자를 치료할 목적으로 정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률 제19조(정신의료기관의 개설, 운영 등)에 따라 시설 기준 등에 적합하게 설치된 정신병원, 정신과의원 및 병원급 이상의 의료기관에 설치된 정신건강의학과가 해당이 됩니다. 정신질환은 누구나 겪을 수 있는 문제이며, 조기 치료가 중요합니다. 급성 정신질환자에 대한 적정진료를 통해 일상생활 유지 및 조기 사회복귀 도모하고 있으며, 지역별 정신의료기관에 대한 정보를 제공합니다.
