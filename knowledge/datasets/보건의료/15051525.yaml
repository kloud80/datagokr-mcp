summary_user: 근로복지공단 소속 산재병원의 환자 진료수익(천 원)을 연도와 급여 유형(산재보험·건강보험·의료급여·자동차보험·일반)별로 합산한 전국 단위 집계 통계로, 1.5KB 남짓한 작은 CSV 파일입니다. 정책 담당자나 분석가가 '산재병원 전체 수익에서 산재보험 진료수익이 차지하는 비중이 해마다 어떻게 달라지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 급여 구분 이름을 맞추는 방식으로만 연결한다.
description_portal: 이 데이터는 근로복지공단 소속병원(산재병원)에서 발생한 환자 진료 수익을 급여 유형별(산재보험, 건강보험, 의료급여, 자동차보험(자보), 일반급여)로 상세하게 집계한 통계 자료입니다. 통계는 각 연도 및 급여 구분별 진료수익(천 원) 총액을 제공합니다. 이 자료는 공단 소속 병원의 전체 재정 구조와 공공 의료 전달 체계에서의 역할을 명확하게 보여줍니다. 특히, 산재보험 수익과 기타 보험(건강보험, 의료급여 등) 수익의 비율 변화를 분석하여, 공단 병원의 본래 설립 목적인 산재 의료 서비스 제공 기능과 공공 병원으로서의 기능을 균형적으로 평가하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 공공 병원의 재정 효율성 및 역할 분석에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 산재보험 진료 수익이 전체 수익에서 차지하는 비중의 변화 추이를 분석함으로써, 공단 병원의 산재 전문성 유지와 강화에 대한 투입 노력 및 성과를 진단할 수 있습니다. 또한, 건강보험이나 의료급여 등 일반 공공 의료 수익 추이를 분석하여 지역 사회 공공 의료 거점으로서의 기여도를 평가하고, 병원 경영 개선 및 재정 안정화 방안을 모색하는 데 활용할 수 있습니다. 이 통계는 공공 병원의 효율적인 운영과 산재 전문 의료 서비스의 지속 가능성을 평가하는 데 기여할 수 있다고 판단됩니다.
