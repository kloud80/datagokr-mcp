description_portal: 본 데이터는 한국보건산업진흥원이 운영하는 메디컬코리아에서 제공하는 의료관광 관련 유용한 사이트 목록 정보를 정리한 자료이다. 국내 의료관광 이용자 및 해외 환자 유치를 위한 정보 접근성을 높이기 위해 구성된 자료로, 각 사이트의 명칭을 영어, 일본어, 중국어, 러시아어 등 다국어로 제공한다. 해당 데이터는 의료서비스 정보, 비자 및 입국 안내, 숙박·교통 정보 등 다양한 주제의 관련 사이트 목록으로 구성되어 있으며, 외국인 환자와 관계자들이 필요한 정보를 보다 쉽게 찾을 수 있도록 설계되었다. 본 자료는 의료관광 인프라 안내, 이용자 맞춤형 콘텐츠 구성, 국제 홍보자료 기획 등 다양한 분야에서 활용 가능하며, 정기적으로 갱신되어 제공된다.
