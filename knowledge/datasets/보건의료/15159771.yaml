description_portal: 집단급식소는 학교, 기업, 병원, 관공서 등 특정 다수인에게 계속하여 식사를 제공하는 비영리 시설로, 운영 방식에 따라 '직영'과 '위탁'으로 구분됩니다.직영 운영은 급식소가 속한 기관이 주체가 되어 식당을 직접 관리하는 방식입니다. 영양사와 조리사를 직접 고용하고 식재료 구매부터 식단 구성, 위생 관리까지 모든 과정을 책임집니다. 영리를 목적으로 하지 않아 식재료비 비중을 높일 수 있고, 기관의 요구사항을 급식에 즉각 반영할 수 있다는 장점이 있습니다. 반면, 메뉴가 고착화되기 쉽고 인사·노무 관리 부담과 식중독 사고 발생 시 모든 법적·도의적 책임을 기관이 직접 져야 한다는 부담이 있습니다.위탁 운영은 급식 운영 전반을 대기업이나 전문 급식업체에 맡기는 방식입니다. 기관은 위탁업체에 일정 단가나 관리비를 지급하고, 업체는 본사의 대량 구매 물류망과 축적된 레시피를 활용해 트렌디한 메뉴를 효율적으로 제공합니다. 인력 채용 및 교육, 노무 관리를 외주화하여 경영 효율성을 높일 수 있고 위생 사고 시 일차적 책임을 업체가 부담한다는 장점이 있습니다. 다만, 업체의 이윤(마진) 확보 과정에서 식재료 질이 떨어질 우려가 있고, 소통 과정이 직영보다 복잡할 수 있습니다.요약하자면 직영은 구성원의 만족도와 소통을 최우선으로 할 때 유리하며, 위탁은 전문성을 통한 운영 효율화와 관리 부담 경감을 원할 때 적합한 선택입니다.
