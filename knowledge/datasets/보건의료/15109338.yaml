summary_user: 광주광역시 도시철도 역(문화노선도명) 인근 병원을 한 행에 한 곳씩 담은 파일로, 역과의 거리(미터), 병원명, 업태(의원·치과의원·요양병원 등), 인허가일자, 영업상태, 도로명주소, 위도·경도를 기록한다. 시민이나 분석가가 '이 역에서 가까운 영업 중인 의원은 어디이며 몇 m 떨어져 있나', '역세권별 병의원 개·폐업 추이는 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 자료와는 병원명·주소 매핑이나 관리번호 같은 인허가 관리 체계로 맞추거나, 좌표로 지도에서 겹쳐 쓴다.
description_portal: 이 데이터는 광주광역시 도시철도 역 인근 병원 현황을 상세히 기록한 자료로, 각 병원의 위치·영업 상태·인허가 정보 등을 포함합니다. 주요 항목에는 문화노선도명(역명), 역과의 거리(미터), 인허가일자, 사업장명(병원명), 상세영업상태코드와 명칭, 최종수정시점, 위도·경도 좌표, 관리번호, 도로명 전체 주소, 영업상태구분코드와 명칭, 데이터 갱신일자 및 구분, 그리고 업태구분명(의원, 치과의원, 요양병원 등)이 포함되어 있습니다.이 자료를 활용하면 지하철 역세권의 의료 인프라 분포를 분석할 수 있으며, 접근성 평가, 응급·일반 진료기관 확보 현황 파악, 시민 의료 서비스 개선 정책 수립 등에 기여할 수 있습니다. 또한 좌표 데이터를 활용한 지도 시각화를 통해 역별 의료시설 밀집도 분석, 의료취약지역 식별, 보건·복지 인프라 확충 계획 수립이 가능하며, 병원 개·폐업 변화를 추적해 지역 상권 및 의료 수요 변화 분석에도 활용할 수 있습니다.
