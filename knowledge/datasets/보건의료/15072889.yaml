summary_user: '4단 상병(주상병코드)별·성별·연령군별로 연도 단위 건강보험 진료 실적(환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액)을 담은 전국 집계 파일이며, 약국을 뺀 양방 요양기관이 청구해 심사 결정된 명세서를 기준으로 한다. 분석가나 연구자가 특정 질병(예: 2형 당뇨병 세부 상병)의 환자가 어느 성별·연령대에 많고 진료비가 얼마나 드는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 주상병코드를 질병분류(KCD) 코드명과 이름·코드로 매핑하거나, 같은 기관(심평원)의 다른 진료 통계와 상병코드·연도로 맞춰 이어 쓴다.'
limits: 전국 단위 비공간 집계라 시군구 등 지역별 분석은 할 수 없다. 심평원 통계는 청구 기준이어서 공단(자격 기준) 통계와 값이 다르다. 연령군별 환자수는 범주 안에서만 중복을 제거한 값이라 다른 범주와 단순 합산하면 중복이 생긴다.
