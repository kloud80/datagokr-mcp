summary_user: "경기도 1인가구 병원안심동행서비스의 이용실적을 구분(div)별로 총이용건수, 병원동행·유사서비스연계·서비스상담 이용건수, 이용자 수로 집계한 자료로, 포털 설명상 월별 실적이며 운영 시군 범위(예: 6개 시군, 11개 시군)가 비고에 함께 표시된다. 지자체 복지·보건 담당자나 분석가가 '혼자 사는 사람의 병원동행 수요가 운영 시군 확대 뒤 얼마나 늘었는가' 같은 서비스 성과 평가와 확대 검토에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 이름이나 기간을 맞춰 수작업으로 연결해야 한다."
description_portal: '본 데이터는 경기도의 1인가구 병원안심동행서비스의 월별 이용현황을 보여주는 자료로, 병원동행, 유사서비스 연계, 서비스 상담 등 다양한 항목별 이용건수 및 이용자 수를 포함하고 있습니다. 각 항목은 "총이용건수(건)", "병원동행이용건수(건)", "유사서비스연계이용건수(건)", "서비스상담이용건수(건)", "이용자수(명)", "비고"로 구성되어 있으며, 특정 시군(예: 6개시군, 11개시군 등) 단위로 운영된 실적을 확인할 수 있습니다. 이 데이터는 이동이 불편한 취약계층의 병원 방문을 돕기 위한 공공서비스의 이용실태를 분석하거나, 서비스 운영성과를 평가하고 향후 확대 방안을 도출하는 데 활용될 수 있습니다..'
