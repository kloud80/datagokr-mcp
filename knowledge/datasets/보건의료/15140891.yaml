summary_user: 서울 광진구 관내 기업체·학교·군부대 등에 소속된 부속의료기관의 인허가 정보를 기관별 한 건씩 담으며, 인허가·취소·폐업일자, 영업상태, 소재지 주소, 중부원점TM 좌표, 의료인 수·병상 수·면적 등의 항목이 들어 있다. 광진구에 어떤 부속의원·학교부속진료소가 운영 중이거나 폐업했는지 확인하려는 보건행정 담당자나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 자치구의 같은 LOCALDATA 인허가 데이터나 병의원 인허가 자료와는 관리번호(MGTNO)·지자체 코드·주소·기관명 매칭으로 잇는다.
description_portal: 본 데이터는 서울특별시 광진구 관내에 위치한 부속의료기관에 대한 인허가 정보를 제공합니다. 부속의료기관은 기업체, 학교, 군부대 등 특정 조직에 소속된 구성원(임직원, 군인, 학생 등) 및 그 가족의 건강관리를 목적으로 설치된 의료시설로, 일반인을 대상으로 하는 의료기관과는 구분됩니다. 주요 유형으로는 부속의원, 부속병원, 군부대 의무대, 학교부속진료소 등이 있으며, 이들은 「의료법」 등 관련 법령에 따라 인허가를 받아 운영됩니다. 데이터에는 기관명, 소재지, 인허가일자, 의료기관 구분 등의 정보가 포함되어 있으며, 기관별 보건 인프라 현황 파악, 조직 내 의료복지 체계 관리, 공공보건 정책 수립, 응급 대응 기반 구축 등 다양한 행정 및 분석 목적으로 활용할 수 있습니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 제공되지 않으므로 GIS 등 지도 서비스 연동 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준의 최신 자료로 정기적으로 갱신되며, 광진구 내 기관별 보건관리 체계 분석에 유용한 기초자료입니다.
