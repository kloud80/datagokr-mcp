summary_user: 식약처가 승인한 의약품 임상시험 계획을 건별로 담으며, 임상시험 제목·대상질환·임상단계·시험용 의약품 성분과 제품명·원개발사·목표대상자수·진행현황·실시기관 소재지를 포함하고 범위는 전국이다. 환자나 연구자가 '특정 질환을 대상으로 지금 어떤 약이 몇 상 임상을 진행 중인지'를 확인하거나, 제약사가 중복 연구를 피하려고 경쟁 성분의 임상 설계를 살펴볼 때 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 성분명·제품명이나 원개발사 이름을 맞춰 식약처 의약품 허가정보와 이어 쓰는 방식에 그친다.
