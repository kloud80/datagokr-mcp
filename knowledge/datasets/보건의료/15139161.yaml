summary_user: "2019년 이후 의료용 마약류 처방을 연 단위로 효능·마약류구분·성분별로 집계해 처방기관수·처방의사수·처방환자수·처방건수·처방량을 담은 전국 단위 집계 데이터입니다. 정책 분석가나 연구자가 '특정 성분(예: 식욕억제제·수면제 성분)의 처방환자수와 처방량이 해마다 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의약품 데이터와는 성분명·효능명 같은 이름 매핑으로만 연결한다."
description_portal: 연별 의료용 마약류 효능별·성분별 처방 현황 서비스는 2019년 이후의 데이터(취급년월, 효능명, 마약류구분명, 성분명, 처방기관수, 처방의사수, 처방환자수, 처방건수, 처방량)를 제공합니다.각 약효·성분의 의료용 마약류의 처방 추이를 확인할 수 있습니다.※ 이 데이터는 「마약류 관리에 관한 법률」 제11조에 따른 '마약류 취급보고 제도'가 2018년 5월부터 시행됨에 따라 '마약류통합정보관리센터' 및 '마약류통합관리시스템' 운영을 통해 보고된 의료용 마약류 취급 기관, 의사 및 환자 수 등을 기반으로 집계됩니다.
