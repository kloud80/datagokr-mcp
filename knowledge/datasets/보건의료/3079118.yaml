summary_user: 부산광역시 동구 안의 의료기기 판매업소를 영업소 한 곳당 한 행으로 담은 파일로, 영업소명·도로명 주소·전화번호를 수록한다(포털 설명상 2025년 9월 18일 기준, CSV 약 28KB). 주민이 동구에서 의료기기를 살 수 있는 판매업소와 연락처를 찾거나, 구청·분석가가 관내 판매업소 분포를 지도·점검 대상으로 파악할 때 쓴다. 전역 조인 키나 업소 코드가 없어 다른 데이터와는 영업소명이나 도로명 주소를 맞춰 잇는 방식으로만 연결된다.
description_portal: 2025년 9월 18일 기준 부산광역시 동구 내 의료기기 판매업소의 현황을 정리하여 제공합니다. 본 자료에는 각 영업소의 기본 정보가 포함되어 있으며, 구체적으로 영업소명, 영업소 소재지(도로명 주소 기준), 영업소 전화번호 등의 항목을 수록하였습니다. 해당 현황 자료는 관내 의료기기 판매업소의 분포와 현황을 한눈에 파악할 수 있도록 구성된 기초 데이터로, 향후 행정 관리, 지도·점검, 통계 분석, 주민 안내 등 다양한 분야에서 실질적인 참고자료로 활용될 수 있습니다.※실제 영업소 운영 여부 및 세부 정보는 변동될 수 있으므로 활용 시 유의하시기 바랍니다.
