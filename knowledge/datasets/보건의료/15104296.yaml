description_portal: 경남 창원시 관내 등록된 정신건강 의료기관 현황입니다. 항목은 지역, 의료기관명, 종별, 주소, 전화번호, 위도, 경도가 있습니다. 관내 지역주민 중 정신적으로 우울감,불안감을 호소하거나 정신질환이 의심되시는 분은 정신건강의료기관을 방문하여 전문 상담 및 약물치료를 받을 수 있습니다. 주소 및 전화번호를 참고하셔서 자택과 가까운 위치에 있는 의료기관 확인하시고 방문 전 전화문의 후 내방하시기 바랍니다. 의료기관 외에 보건소 정신건강복지센터에서도 정신건강 상담 및 사례관리가 가능합니다.
