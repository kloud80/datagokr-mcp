summary_user: 경기도 내 병원급 요양병원을 사업장 한 곳당 한 행으로 담은 건별 현황으로, 시군·사업장명·인허가일자·영업 상태·폐업일자·병상 수·의료인 수·입원실 수·진료과목·주소와 위경도 좌표를 포함한다. 보호자나 분석가가 "우리 시군에 영업 중인 요양병원은 어디이며 병상과 의료인력은 얼마나 되는가"를 확인하거나, 지역 간 요양병원 공급 격차를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 시군명으로 경기도의 다른 시군 단위 자료와 묶고, 주소·좌표나 사업장명으로 LOCALDATA 병원 인허가 자료와 이름 매칭해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 병원급 요양병원의 현황을 정리한 자료로, 각 병원의 인허가일자, 영업 상태, 병상 수, 의료인 수, 입원실 수, 진료과목 등의 정보를 포함하고 있습니다. 요양병원은 장기적인 치료와 요양이 필요한 환자를 대상으로 한 의료기관으로, 특히 고령사회에서 필수적인 보건 인프라로 기능합니다. 본 자료는 지역별 요양병원의 분포와 규모, 진료과목 다양성, 의료인력 확보 수준 등을 파악할 수 있으며, 보건 정책 수립과 지역 간 의료 격차 분석에 중요한 기초 자료가 됩니다. 또한 의료 인프라의 수급 계획, 노인·만성질환자 지원 정책, 의료 접근성 개선 전략 마련에도 활용될 수 있습니다.
