summary_user: 의약품 품목별로 병용금기·특정연령대 금기·임부 금기·용량주의·투여기간주의·노인주의·효능군 중복주의·서방정분할주의 같은 DUR 안전사용 정보를 담는 전국 범위의 API로, 품목명·업체·DUR 성분·금기내용·고시일자 등이 건별로 나온다. 약사나 의료진이 "이 약과 함께 처방하면 안 되는 성분이 있는가, 임부나 노인에게 주의할 약인가"를 확인하거나, 소비자가 복약 전 주의사항을 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 품목기준코드(ITEM_SEQ)·DUR 성분코드 같은 식약처 자체 코드나 품목명 매핑으로 같은 기관의 허가정보와 잇고, 표준코드를 거쳐 심평원 약가·급여 목록과 연결하는 방식을 검토한다.
limits: 2026-10-03 실호출에서 6개 오퍼레이션 중 1개만 응답했고, 병용금기·노인주의·DUR 품목정보·특정연령대 금기 등은 최소 파라미터로는 응답이 없어 추가 파라미터 확인이 필요하다. 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑으로만 연결된다. 개발계정은 하루 10,000회로 호출이 제한된다.
