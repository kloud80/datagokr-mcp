description_portal: 식품의약품안전처 “의약품안전사용서비스 (DUR) 품목정보” OpenAPI는 의약품의 안전사용 주의사항을 다양하게 조회할 수 있는 공공데이터입니다. 제공 기능에는 병용금기, 특정연령대 금기, 임부 금기, 용량주의, 투여기간주의, 노인주의, 효능군 중복주의, 서방정분할주의, DUR 품목 정보 조회  등이 있습니다. 이 데이터를 통해 의료진이나 약사 등은 성분별 금기사항과 주의사항을 확인하여 처방·조제 오류를 줄일 수 있고, 환자와 소비자는 복약 전 주의사항을 확인함으로써 부작용 위험을 낮출 수 있는 기초 자료로 활용 가능합니다.
