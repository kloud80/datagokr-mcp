summary_user: 서울 종로구 관내 목욕장업 업소를 한 건씩 담은 인허가 원천 데이터로, 업소명·인허가일자·폐업일자·영업상태·주소·좌표·욕실 수·건물 층수 같은 항목을 업소별로 담는다. 주민이나 창업 예정자가 "종로구에 지금 영업 중인 목욕탕·찜질방은 어디이고, 최근 몇 곳이 폐업했나"를 확인하거나, 분석가가 목욕시설의 개폐업 추이를 상권 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 주소·좌표를 기준으로 다른 LOCALDATA 인허가 업종과 겹쳐 볼 수 있다.
description_portal: 본 데이터는 서울특별시 종로구 관내에서 운영되는 공중위생 관련 업소 중 목욕시설의 인허가 현황을 제공하는 공공자료입니다.자료에는 지방자치단체 코드, 관리번호, 인허가일자, 인허가 취소일자, 영업상태 코드 및 명칭 등 행정 관리에 필요한 세부 항목이 포함되어 있습니다.이 데이터는 지방자치단체와 보건당국이 위생관리 실태를 점검하고, 영업 허가 및 취소 현황을 체계적으로 관리하기 위한 근거자료로 활용됩니다.또한 신규 인허가 심사, 위생점검 계획 수립, 공중위생 서비스 개선 등 다양한 행정업무 지원에 활용되며, 연구기관과 민간에서는 목욕시설의 운영 현황 분석, 영업 지속성 평가, 공중위생 관리정책 검토 등에도 활용할 수 있습니다.종로구의 공중위생 서비스 품질과 안전성 확보를 위해 중요한 행정자료입니다.
