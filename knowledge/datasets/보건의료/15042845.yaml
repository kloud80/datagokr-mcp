summary_user: 연도별·시군구별로 항생제 사용량을 인구 1,000명당 1일 사용량(DDD/1000명/일)으로 산출한 전국 집계 자료이며, 건별 처방 원천이 아니라 건강보험 가입자와 의료급여 수급권자를 분모로 한 지표값을 담는다. 보건 정책 담당자나 연구자가 "우리 시군구의 항생제 사용량이 전국 다른 지역보다 많은가, 해마다 줄고 있는가"를 비교하는 데 쓴다. 전역 조인 키(행정코드 등)는 없고 시도·시군구 이름과 지표연도로만 다른 지역 통계와 맞춰 이어 써야 한다.
description_portal: '본 데이터는 연도별 질병에 따른 항생제 종류별 사용량을 산출한 자료입니다. 대상은 해당 연도 기준 국민건강보험 가입자 또는 의료급여 수급권자입니다.○ 지표 산출 방식   - 지표값: 1일 사용량/1,000명 (단위:DDD/1000명/일)   - 분자: 해당 연도 항생제 전체 처방 용량 X 1,000명   - 분모: 국민건강보험 가입자 또는 의료급여 수급권자 수 X 365일※ (해석) 항생제사용량 25.68(DDD/1,000명/일)일 경우, 인구 1,000명 중 하루 평균 25.68명이 항생제를 사용한다는 의미로 해석할 수 있음※  DDD는 성인 기준 표준 복용량을 의미하며, 항생제 사용량 비교에 활용됨.'
