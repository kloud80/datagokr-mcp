summary_user: 대전광역시 대덕구 관내 폐의약품 수거 장소를 장소별로 한 행씩 담은 파일 데이터로, 수거 장소명·수거구분·도로명주소·전화번호·데이터기준일자를 담는다. 대덕구 주민이 '집 근처에서 남은 약을 어디에 버릴 수 있나'를 찾을 때나, 구 단위로 수거 거점 분포를 살피는 분석에 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 도로명주소를 지오코딩하거나 장소명(약국·공공기관 이름)을 맞춰 이어 써야 한다.
limits: 범위가 대전 대덕구 한 곳뿐이라 다른 시군구 수거 장소는 각 지자체 데이터를 따로 모아야 한다. 좌표·표준 코드 같은 조인 키가 실측 컬럼에 없어 주소·이름 매핑 없이는 의약품 허가·약국 정보와 바로 연결되지 않는다.
