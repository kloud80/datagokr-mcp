description_portal: '통계개요* 통계명 : 부정 의료행위 단속(의료인)* 통계종류 : 서울시 부정 의료행위에 대한 의료인 단속 현황을 제공하는 일반ㆍ조사통계* 근거법령 :「의료법」제48조 규정에 따른 의료기관 및 의료인력 단속현황* 작성목적 : 의료기관 및 의료인력의 지도감독에 따른 부정행위 단속 현황을 파악하여안전한 의료서비스를 제공 할수 있도록, 의료관련 정책수립의 기초자료로활용하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 보건의료정책과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 의료인 의료위반(면허대허, 성감별 행위, 무자격자에게 의료행위 사주 등) 및 처리(면허취소, 자격정지, 경고, 고발,기타) 현황'
