summary_user: 전국 지자체가 관리하는 의료기기 판매(임대)업 인허가 정보를 업소 단위로 취합한 원천 데이터로, API 전체 250,132건에 사업장명·인허가일자·영업상태·소재지 주소·좌표를 담는다. 소비자나 분석가가 특정 지역에 영업 중인 의료기기 판매·임대업소가 어디인지, 폐업·휴업 상태는 어떤지 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)가 조인 키라서 주소 기준으로 다른 업소·시설 데이터와 이어 쓰며, 업소 고유 식별 키는 확인되지 않는다.
