summary_user: 국민건강보험공단의 임신·출산 진료비 바우처(국민행복카드) 사용 실적을 연도·월과 시도별로 묶어 인원수·사용건수·사용금액으로 담은 집계 파일이며, 포털 설명상 2009년부터 2024년 10월까지 전국을 시도 단위로 다룬다. 지역별 출산 지원 정책을 살피는 분석가나 지자체 담당자가 "어느 시도에서 임신·출산 진료비 바우처 이용 인원과 금액이 어떻게 변해 왔나"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 시도 단위 통계(출생아 수, 인구 등)와는 시도코드나 시도명을 이름·코드로 맞춰 연결한다.
description_portal: '임신·출산 진료비 지원제도란, 임산부와 영유아의 의료비 부담을 경감하여 출산친화적인 환경을 조성하고자 임신·출산 관련 진료비 등(급여·비급여)의 본인부담금 결제에 사용할 수 있는 이용권(국민행복카드*)을 제공하는 제도  * 국민행복카드 : 국가에서 시행하는 다양한 바우처를 하나의 카드로 이용할 수 있는 통합형 바우처 카드1. 적용년월: 2009년 ~ 2024년(10월까지) 각 월  - 각 연도별 "전체"월 데이터는 해당 연도의 주민등록번호별 중복제거된 총 인원수2. 시도코드, 시도명3. 인원수: 임신출산진료비 바우처를 사용한 인원수4. 사용건수, 사용금액: 임신출산진료비 바우처 사용건수 및 사용금액'
