description_portal: '이 데이터는 근로복지공단 소속 직영 병원(산재 병원)에 입원한 산재 환자의 현황을 요양 기간별로 세분화하여 집계한 통계 자료입니다. 통계 항목은 각 연도별, 병원별로 요양 기간 구간(6개월 미만, 1년 미만, 2년 미만, 3년 미만, 5년 미만, 10년 미만, 10년 이상)에 해당하는 입원 환자 수(명)를 제공합니다. 이 자료는 산재 근로자들이 재해 후 치료를 위해 공단 병원을 이용하는 장기 요양 수요의 패턴을 명확하게 보여줍니다. 특히, 요양 기간이 10년 이상인 만성기 환자의 규모와 지역별 분포를 파악하고, 산재 재활 서비스의 효율적인 자원 배분을 계획하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 산재 재활 서비스의 효율적인 자원 배분 및 만성기 환자 관리 정책 수립에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 요양 기간이 장기화되는 환자(예: 5년 이상, 10년 이상)의 추이와 그들이 이용하는 병원의 특성을 분석할 수 있습니다. 이를 통해 장기 요양 환자를 위한 특화된 재활 프로그램이나 심리 사회적 지원의 필요성을 진단하고, 만성기 환자 관리 시스템을 강화하는 방안을 모색할 수 있습니다. 또한, 이 통계는 소속 병원별 입원 진료의 효율성과 재활 사업의 성과를 평가하고, 산재 근로자의 안정적인 치료 환경 구축에 기여할 수 있다고 판단됩니다.'
