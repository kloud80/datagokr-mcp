summary_user: 광주 남구 관내 공공심야약국을 약국 한 곳당 한 행으로 담은 파일로, 약국명·도로명주소·운영요일·평일/주말/공휴일 운영 시작·종료 시간·전화번호를 담는다(csv 535바이트의 소규모 목록). 주민이나 보호자가 '지금 밤늦게 남구에서 문 연 약국이 어디인가'를 확인하거나, 분석가가 구 단위 심야 의약품 접근성을 볼 때 쓴다. 전역 조인 키나 기관 코드가 없어 다른 약국·의료기관 데이터와는 약국명이나 도로명주소를 맞춰 이어 쓰고, 좌표가 필요하면 주소를 지오코딩해야 한다.
description_portal: 광주광역시 남구 관내 공공심야약국 현황 및 정보(약국명, 소재지도로명주소, 운영요일 · 시간, 전화번호 등)를 제공합니다.  해당 데이터는 광주광역시 남구청 보건행정과(☎062-607-4352)에서 제공합니다. ※ 공공심야약국이란 평일 · 주말 · 공휴일의 심야시간대 의약품 구입 불편을 해소 및 의약품 접근성 개선을 위해 지자체에서 지정한 약국입니다. 부득이한 사정으로 해당 약국이 심야시간대 운영하고 있지 않을 수 있으므로, 사전 연락 후 약국 방문 가능 여부를 확인하시기 바랍니다. 공공심야약국에 대한 추가 정보는 다음을  참고하여 주시기 바랍니다.https://www.pharm114.or.kr/
