summary_user: 경기도 포천시에 있는 한의원을 한 곳당 한 행으로 담은 목록 파일로, 기관명·종별·도로명 주소·전화번호를 담는다(csv 약 1.8KB 규모). 주민이나 분석가가 '포천시 안에서 우리 동네 가까운 한의원은 어디이고 연락처는 무엇인가', '읍면별로 한의원이 어떻게 분포하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 붙이거나, 주소를 좌표로 바꿔 지역 단위로 묶어 연결한다.
description_portal: 경기도 포천시에서 제공하는 한의원 현황 데이터 입니다. 순번, 의료기관명, 의료기관종별, 의료기관주소, 전화번호 등 항목들을 포함하고 있습니다. 의료기관명은 각 한의원의 명칭을 나타내며, 의료기관종별은 한의원으로 분류되는 의료기관의 종별 구분을 의미합니다. 의료기관주소는 한의원이 소재한 도로명 주소를 나타내며, 전화번호는 해당 기관과의 연락을 위한 정보입니다. 이 데이터는 지역 보건의료 서비스 현황 파악, 의료 접근성 분석, 지역 의료자원 분포 검토, 의료기관 점검 및 행정관리, 민원 대응 및 지역 보건정책 수립의 기초자료로 활용될 수 있으며, 정기적으로 갱신되어 최신 의료기관 정보를 반영합니다.
