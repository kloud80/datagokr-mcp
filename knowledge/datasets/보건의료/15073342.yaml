description_portal: '2016년~2025년까지 시군구별치매현황 데이터를 제공합니다. (단위 : 명, %)<데이터 이용 시 참고사항>1) 2024년 지역명 변경(강원도 -> 강원특별자치도, 전라북도 -> 전북특별자치도)2) 2025년 추정 환자 수 및 유병률은 2025년 주민등록연앙인구(국가데이터처, 2026)에 2023년 치매역학 실태조사(보건복지부 중앙치매센터, 2024) 성·연령별 유별률을 적용하여 산출하였음3) 추정치는 주민등록연앙인구에 유병률을 곱하여 산출하기 때문에 반올림되어진 수치의 경우 합계가 1이상 차이날 수 있음 * 추정 경도 환자(67.7%), 추정 중등도 환자(29.5%), 추정 중증 환자(2.8%) * 주민등록연앙인구는 년의 중앙인구로 국가데이터처에서 작성하고 있으며, 주민등록인구의 전년말자료와 금년말 자료의 산술평균으로 구해짐을 알려드립니다.  - (예) 2023년주민등록연앙인구 = (2022년12월31일 주민등록인구+2023년12월31일 주민등록인구)/2'
