summary_user: 경상남도 안에 설치된 자동심장충격기(AED)를 한 대씩 담은 개별 목록으로, 모델명·설치기관·설치 위치 설명·주소·전화번호·위경도 좌표·사진 주소를 제공한다. 주민이나 응급 대응 앱 개발자가 "지금 내 주변에서 가장 가까운 자동심장충격기는 어디에 있나"를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·시군명(city_name)이나 좌표(lat, lng)를 기준으로 위치를 맞춰 이어 쓰며, 응급의료기관 목록과도 공통 키 없이 좌표로 겹쳐 본다.
description_portal: 경상남도 자동심장충격기현황 정보(모델명, 설치기관, 설치주소, 전화번호, 좌표 등)를 제공하는 서비스 입니다.
