description_portal: '본 데이터는 국민건강보험 가입자 및 의료급여수급권자를 대상으로 해당 연도 당뇨병 환자의 진료 비율을 산출한 것입니다. 당뇨병 환자는 주상병 코드(E10~E14)를 보유하고 당뇨병 치료 약제를 처방받은 자로 정의됩니다. 산출식은 전체 가입자 또는 수급권자 중 당뇨병 환자의 비율(%)입니다.○ 내용: 해당년도 당뇨병 환자의 비율○ 대상: 해당년도 국민 건강보험 가입자 또는 의료급여수급권자○ 산출식   - 분자: 당뇨 환자 수   - 분모: 건강보험 가입자 또는 의료급여수급권자 수※ 당뇨 환자: 당뇨 주상병 코드(E10~E14)가 있고 당뇨 약제를 처방 받은 환자'
