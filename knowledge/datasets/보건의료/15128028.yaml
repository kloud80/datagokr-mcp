summary_user: 2015~2024년 입원진료 병상 수(허가병상 기준)를 연도·시도별로 종합병원·요양병원·일반병원·의원·특수병원(결핵·한센·정신)·치과·한방·부속의원·조산원 등 의료기관 종류별로 집계한 파일입니다(전국, 시도 단위). 분석가나 지역 보건 담당자가 '우리 시도의 요양병원 병상이 10년 새 얼마나 늘었고 다른 시도와 비교하면 어떤가' 같은 질문에 쓴다. 전역 조인 키가 없어 시도 이름과 연도를 맞춰 인구·의료인력·의료기관 수 통계 등 다른 시도별 집계와 이어 쓴다.
description_portal: 보건복지부에서 2015년부터 2024년까지 의료기관별로 입원진료 병상 수(병원 및 의원이 보유하고 있는 전체 병상수)를 의료기관 종류별/시도별로 분류하여 정보를 제공하고 있습니다.<통계 이용 시 참고사항>1. 병상 수는 허가병상 기준임2. 병원：의사, 치과의사 또는 한의사가 각각 그 의료를 행하는 곳으로서 입원환자 30인 이상을 수용할 수 있는 시설을 갖추고 주로 입원환자에 대하여 의료를 행할 목적으로 개설하는 의료기관3. 의원：의사, 치과의사 또는 한의사가 각각 그 의료를 행하는 곳으로서 진료에 지장이 없는 시설을 갖추고 주로 외래환자에 대하여 의료를 행할 목적으로 개설하는 의료기관4. 요양병원：의사 또는 한의사가 그 의료를 행하는 곳으로서 요양환자 30인 이상을 수용할 수 있는 시설을 갖추고 주로 장기요양을 요하는 입원환자에 대하여 의료를 행할 목적으로 개설하는 의료기관
