description_portal: 본 데이터는 서울특별시 종로구 관내에 설치·운영 중인 흡연부스 현황을 제공하는 자료입니다. 해당 자료에는 흡연부스의 설치위치, 설치연도, 운영여부, 시설 형태 등 세부 항목이 포함되어 있으며, 간접흡연을 예방하고 쾌적한 공중위생 환경을 조성하기 위한 기초자료로 활용됩니다. 종로구는 보행 환경 개선과 금연정책 강화를 위해 흡연부스를 지정·관리하고 있으며, 본 데이터는 이러한 시설의 분포 현황과 관리 실태를 종합적으로 파악할 수 있도록 구성되었습니다. 이를 통해 행정기관은 신규 설치 후보지 검토, 노후 시설 개선, 운영 효율성 평가 등 정책 의사결정을 지원할 수 있고, 연구기관이나 민간에서도 금연구역 효과 분석 및 흡연환경 관리 정책 연구에 활용할 수 있습니다. 자료는 종로구청의 현장조사와 행정관리 기록을 기반으로 작성·관리됩니다.
