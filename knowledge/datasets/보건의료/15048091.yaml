summary_user: 부산광역시 연제구 관내 의료기관에 설치된 CT·MRI·유방촬영장치 같은 특수의료장비를 장비 한 대씩 기관명·의료기관 종별·장비명·용도 또는 부위·모델명·형식명·제조사로 담은 파일(csv, 약 4KB)이다. 연제구 주민이나 분석가가 '우리 동네 어느 병원에 MRI나 CT가 있고, 어느 제조사의 어떤 모델인가'를 확인할 때 쓴다. 전역 조인 키(기관 코드 등)가 없어 다른 의료기관 인허가 데이터와는 의료기관명을 이름으로 맞춰 이어 써야 한다.
