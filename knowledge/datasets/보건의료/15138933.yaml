description_portal: '이 데이터는 2019년도부터 2023년도까지 개인별 건강보험료 부과금액, 급여비, 부당수급, 일반검진비 등 다양한 건강보험 관련 통계를 연도별로 제공하며, 각 시트는 다음과 같은 정보를 담고 있습니다(시트1) 내외국인 연도별 건강보험료 부과금액보험료: 직장부과보험료(사용자부담금 포함) + 지역부과보험료 기준으로 연간 누계 금액(시트2) 외국인 국적별 건강보험료 부과금액2023년 기준 가입자 수 상위 10개 국가의 외국인 국적별 연도별 부과금액주의사항: 국가 분류 오류 수정으로 기 제공된 수치와 차이가 있을 수 있음(시트3) 내외국인 연도별 건강보험 급여비급여비: 건강보험 급여실적(의료급여 및 비급여 제외), 약국 포함, 현금급여 및 건강검진비 제외(시트4) 외국인 국적별 건강보험 급여비2023년 기준 가입자 수 상위 10개 국가의 외국인 국적별 연도별 급여비 현황주의사항: 각 단위는 반올림되어 있음(시트5) 내외국인 연도별 건강보험 부당수급 현황부당수급 유형별: 내외국인의 부정수급 유형별 연도별 적발인원, 결정건수, 결정금액(시트6) 외국인 국적별 자격상실후 부정수급 현황외국인 부정수급 중 "자격상실후 부정수급" 연도별 상위 10개 국가의 적발인원 및 결정금액(시트7) 내외국인 연도별 일반검진비연도: 2019 ~ 2023년외국인(재외국민 포함) 및 내국인의 연도별 일반건강검진 지급금액 (공단 전액부담)* 보험급여 비용 청구 시효(3년)에 따라 일부 자료 변동 가능(시트8) 외국인 국적별 일반검진비 지급2023년 기준 가입자 수 상위 10개 국가의 외국인(재외국민 포함) 국적별 연도별 일반건강검진비 지급 현황'
