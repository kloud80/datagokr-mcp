summary_user: 국민건강보험공단이 2019~2023년 내국인과 외국인의 건강보험료 부과금액, 급여비, 부당수급, 일반검진비를 연도별로 집계한 전국 단위 엑셀 통계 파일이며, 외국인은 2023년 가입자 수 상위 10개 국적별 수치를 따로 담는다. 외국인 가입자가 낸 보험료와 받은 급여비가 내국인과 비교해 어느 정도인지, 어떤 국적에서 자격상실 후 부정수급이 많은지 살펴보려는 정책 분석가나 언론이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·내외국인 구분·국적명을 이름으로 맞춰 연결해야 한다.
limits: 전국 합계만 있어 지역별·개인별 분석에는 쓰지 못하며, 금액은 억원 단위로 반올림된 집계값이다. 표준 코드 같은 조인 키가 없어 다른 통계와 기계적으로 결합하기 어렵다.
