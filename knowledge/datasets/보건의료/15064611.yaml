summary_user: 국민건강보험 가입자와 의료급여 수급권자 가운데 이상지질혈증 주상병(E78)이 있고 관련 약제를 처방받은 환자의 비율을 연도·시도·시군구 단위로 집계한 파일로, 분모(가입자·수급권자 수)와 분자(환자 수), 비율(%)을 함께 담는다. 보건 정책 담당자나 분석가가 '우리 시군구의 이상지질혈증 약물치료 환자 비율이 다른 지역보다 높은가'를 비교하거나 만성질환 관리 수준을 지역별로 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키(행정구역 코드 등)가 없어 다른 시군구 통계와는 시도·시군구 이름을 매핑해서만 이어 쓸 수 있다.
description_portal: '□ 데이터 개요본 데이터는 해당 연도 국민건강보험 가입자 및 의료급여 수급권자를 대상으로 이상지질혈증 환자의 의료 이용 현황을 파악하기 위해 작성되었습니다. 이상지질혈증 진단과 함께 관련 약제를 처방받은 환자 비율을 산출하여, 국민의 만성질환 관리 수준과 의료서비스 이용 실태를 평가하는 데 활용됩니다.○ 내용: 해당년도 이상지질혈증 환자의 비율○ 대상: 해당년도 국민 건강보험 가입자 또는 의료급여수급권자○ 산출식   - 분자: 이상지질혈증 환자 수   - 분모: 건강보험 가입자 또는 의료급여수급권자 수※ 이상지질혈증 환자: 이상지질혈증 주상병 코드(E78)가 있고 이상지질혈증 약제를 처방 받은 환자'
