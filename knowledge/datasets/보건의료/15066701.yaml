summary_user: 구례군 안에서 집단급식소를 운영하는 병원을 한 곳씩 담은 목록 파일로, 병원명·병상수·주소·전화번호와 데이터기준일자가 들어 있습니다(파일 크기 302바이트의 소규모 원천 목록). 구례군 주민이나 급식·위생 담당자가 '군내 어느 병원이 급식소를 두고 있고 병상 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 병원명이나 주소를 기준으로 LOCALDATA 병원 인허가 자료나 집단급식소 신고 현황과 맞춰 이어 쓴다.
limits: 표준 기관 코드 같은 공통 식별자가 없어 다른 데이터와는 병원명·주소 매칭으로만 연결된다. 범위는 구례군 한 곳에 한정되며, 급식소의 식수 인원이나 운영 내용은 담고 있지 않다.
