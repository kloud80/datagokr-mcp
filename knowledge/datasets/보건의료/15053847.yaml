summary_user: 부산광역시 기장군 관내 한의원을 한 곳당 한 행으로 모은 목록으로, 기관명·도로명 주소·전화번호를 담은 작은 CSV 파일(약 3KB)이다. 기장군 주민이 집 근처 한의원을 찾아 연락하거나, 분석가가 기장군 안의 한의원 분포와 접근성을 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명 주소를 맞춰 붙여야 하며, 의료기관 인허가(LOCALDATA) 자료와도 이름·주소 매칭으로 대조한다.
description_portal: 2026.07.10. 기준 부산광역시 기장군 관내 한의원 현황에 대해(명칭, 소재지, 전화번호) 등의 항목을 제공합니다.한의원 데이터 현황은 기장군에 소재하고 있는 한의원의 정보를 모아놓은 자료로, 군민이 한의원을 쉽게 찾고 이용할 수 있도록 돕기 위해 제공됩니다.이 데이터에는 한의원의 명칭, 소재지, 전화번호 등의 정보가 담겨있습니다.이 자료는 관할 보건소에서 수집 및 관리되며 지역별 한의원 분포나 접근성, 의료 인프라 현황 등을 파악할 수 있어 보건 정책 수립이나 의료 자원 계획을 세우는 데에 기초 자료로 사용됩니다.
