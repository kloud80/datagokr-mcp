description_portal: 서울특별시 서초구내 병원등에서 운영하고 있는 진단용방사선발생장치 현황 데이터입니다. 제공되는 데이터는 2개의 파일(엑셀)이며, 하나의 파일로 압축되어있습니다. 진단용 방사선 발생장치는 및 특수의료장비 현황 데이터는 번호, 장치명칭, 장치모델명, 장치형식명, 의료기관명, 의료기관종별, 소재지도로명주소, 소재지지번주소, 위도, 경도, 데이터기준일자로 총 11개 항목으로 각각 이루어져 있습니다. 방사선발생장치(Radiation Generator, RG)는 방사성 동위원소와 달리, 전기를 공급하여 하전입자(전자, 양성자 등)를 가속함으로써 인위적으로 방사선을 만들어내는 장치를 말합니다.우리가 일반적으로 병원에서 보거나 들었더거로는 흔히 보는 X-ray 장비나 CT가 이에 해당합니다. 방사선 장치들은 우리가 눈으로 볼 수 없는 내부를 들여다보거나, 물질의 성질을 변화시키는 데 주로 사용됩니다.우리나라 여러산업분야에서 사용되고 있는데 진단이나 치료목적으로 의료분야에서 사용되고 있고, 비파괴검사나 성분분석및 멸균목적으로 산업분야에서 사용되고 있습니다.그리고, 공항의 수하물 검색대나 컨테이너 검색에 사용되고, 기초과학 연구를 위한 가속기 시설등에서도 사용되고 있습니다.이 데이터는 방사선 안전관리, 의료장비 수급계획 수립, 응급의료 대응체계 강화, 지역 간 의료격차 분석 등 다양한 보건정책 수립의 기초자료로 활용될 수 있습니다. 특히 공공보건기관, 연구기관, 의료기기 산업체 등에서 의료자원 배분과 정책 타당성 검토에 실질적인 근거자료로 활용 가능합니다.
