summary_user: 2015~2024년 건강보험 적용인구를 연도·17개 시도(주민등록 실거주지 기준)별로 직장(근로자, 공무원·사립학교교직원)과 지역으로 나눠 집계한 전국 단위 통계로, 직역별 적용인구·비율·가입자·피부양자와 지역 세대수·가입자를 담는다. 분석가나 지자체 담당자가 "우리 시도에서 직장가입자 대비 피부양자 비중이나 지역가입자 규모가 연도별로 어떻게 변했나"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시도별 통계와는 연도와 시도 이름을 맞춰 연결한다.
limits: 시도 단위 집계라 시군구 이하나 개인·사업장 단위 분석은 할 수 없다. 표준 행정코드 같은 조인 키가 없으므로 다른 데이터와 붙일 때 시도 명칭 표기를 직접 맞춰야 한다.
