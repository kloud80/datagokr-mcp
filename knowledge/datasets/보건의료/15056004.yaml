description_portal: '제주특별자치도 내에 위치하고 있는 난임시술 지정 병의원과 관련한 데이터를 제공합니다.항목: 의료기관명, 주소, 전화번호, 시술내용 등*난임부부에게 시술비 일부를 지원하여 경제적 부담을 경감시킴으로서 행복한 가정을 영위케 하고 저 출산 극복효과를 달성하기 위함*신청시점 난임부부(여성)이 제주특별자치도에 주소를 두고 거주하고 있어야 하며, 난임시술을 요하는 의사의 ‘난임진단서’ 제출자(난임진단서는 지침상 서식이어야함)자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=2078'
