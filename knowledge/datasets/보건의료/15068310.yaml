summary_user: 한국건강증진개발원 금연자료실에 올라온 흡연예방·금연지원 홍보·교육·지침 자료의 목록을 자료 한 건당 한 행으로 담은 CSV 파일(약 368KB)로, 카테고리·제목·대상·제작기관·제작년도·파일명·바로가기 링크를 담는다. 보건소 금연클리닉 담당자나 학교 보건교사가 '학교흡연예방이나 군·의경 금연사업에 쓸 교육자료·지침이 어떤 것이 있고 어디서 받나'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 제작기관 이름이나 같은 기관 코드로만 느슨하게 이어 쓸 수 있으며, 보건소코드·시군구코드로 지역사회 건강조사 같은 지표와 직접 연결되지 않는다.
description_portal: '흡연예방 및 금연지원사업을 위한 홍보/교육/지침 등 자료 제공- 흡연예방 : 학교흡연예방사업, 유아흡연위해예방사업- 금연지원 : 보건소 금연클리닉, 찾아가는 금연지원서비스, 단기금연캠프, 병의원금연치료, 군의경금연사업 등-해당 자료는 중앙 및 지역 단위에서 추진되는 다양한 금연정책과 사업의 실행을 지원하기 위한 기초자료로 활용되며, 교육 현장과 보건소, 군·의경 등 다양한 기관에서 실무적으로 참고할 수 있는 실질적인 지침과 홍보자료를 포함하고 있습니다. 또한 국민에게 금연 필요성과 지원 서비스를 효과적으로 알리고, 흡연율 감소 및 건강증진 정책 성과 제고에 기여할 수 있습니다.'
