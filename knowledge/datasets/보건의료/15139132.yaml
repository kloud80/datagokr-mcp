description_portal: '1. 행위코드: D4290, D4480, D4390, D4381, D4410, D5030, D5010, HC341, HC342* 행위코드명은 건강보험심사평가원 진료행위코드 조회(https://opendata.hira.or.kr/op/opc/olapDiagBhvInfoTab1.do#none) 참고2. 진료년도: 2021년~2023년3. 요양기관: 소속시도 및 시군구, 종별4. 진료과목 및 주상병: 요양기관에서 청구한 명세서 연계 자료로서 빈 값(값없음) 존재 가능5. 진료인원 및 건수: 해당 구분별 진료인원(중복제외) 및 진료건수  - 진료일 기준(한의분류 제외, 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 심사분까지 반영  - 개인정보 보호를 위해 5 미만의 자료는 "*" 처리  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터※ 본 연락처는 공공데이터 포털로 제공 중인 데이터의 개방 및 관리를 총괄하는 부서로 해당 데이터의 내용(항목별 설명, 발췌 기준 등)과 무관한 건강보험제도, 개인의 자격,징수,급여 관련 https://all.data.go.kr/lms/drm/selectFileDataInsertView.do#문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
