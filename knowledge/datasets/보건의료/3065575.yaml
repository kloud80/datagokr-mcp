summary_user: 경상남도 거창군 약국을 한 곳씩 담은 건별 목록으로, 약국명·인허가일자·영업상태·폐업일자·도로명/지번 주소·위도·경도·전화번호를 담는다(포털 기준일 2025-08-01, CSV 약 6KB). 주민이 집 근처에서 영업 중인 약국과 연락처를 찾거나, 분석가가 거창군 약국의 개업·폐업 흐름과 읍면별 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 약국명·주소를 맞추거나 위도·경도로 공간 결합해야 하며, 병의원 인허가 데이터와 나란히 놓고 지역 의료 접근성을 볼 때 이어 쓴다.
description_portal: '○ 경상남도 거창군 약국 현황에 대한 데이터로 경상남도 거창군 약국 약국명, 경상남도 거창군 약국 소재지도로명주소, 경상남도 거창군 약국 소재지지번주소, 경상남도 거창군 약국 위도, 경상남도 거창군 약국 경도 전화번호를 제공합니다.○ 데이터 기준일 : 2025. 08. 01.○ 약국은 의사의 처방에 따라 의약품을 정확히 조제하고 판매하는 전문 의료기관으로, 일반의약품 및 의약외품을 함께 취급합니다. 약사는 환자의 복약 이력과 건강 상태를 분석하여 약물 상호작용과 부작용을 예방하고, 복약 지도와 건강 상담을 통해 치료 효과를 극대화합니다. 또한 의약품 안전관리와 품질 보증, 재고 관리, 보험 청구 업무를 수행하며 지역사회 건강 증진에 기여합니다.'
