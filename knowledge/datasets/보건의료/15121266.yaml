summary_user: 의료급여 수급권자 진료에 쓰이는 상병기호와 상병명을 통계 대분류·중분류·소분류 체계로 묶어 놓은 코드표 성격의 파일(CSV 약 1.1MB)로, 건별 진료 기록이나 집계 수치가 아니라 전국 단일 기준의 분류표다. 분석가나 연구자가 의료급여 진료 통계에 찍힌 상병기호가 어떤 질환이고 어느 통계 분류에 속하는지 확인하거나, 질환군별로 묶어 집계하려 할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 진료·처방 통계 등 다른 데이터와는 상병기호 값(또는 상병명)을 직접 맞대어 이어 쓴다.
description_portal: '□ 데이터 개요본 데이터는 국민건강보험공단이 관리하는 의료급여 수급권자의 질환별 상병 정보를 체계적으로 분류하여 제공하는 자료입니다.의료급여 수급권자의 진단된 상병 기호 및 명칭을 통계 분류체계에 따라 대분류, 중분류, 소분류로 구분하여 나타내어, 질환별 현황 파악 및 분석에 활용됩니다.□ 주요 내용상병기호: 각 질환을 식별하는 고유 코드상병기호명: 상병기호에 해당하는 질환명통계대분류: 상병의 통계적 대분류 구분통계중분류: 대분류 내 중분류 세부 구분통계소분류: 중분류 내 소분류 세부 구분※ 본 데이터는 의료급여 수급권자의 질환 현황 분석, 정책 수립 및 연구 등에 활용할 수 있습니다.'
