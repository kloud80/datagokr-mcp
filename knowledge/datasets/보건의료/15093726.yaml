summary_user: 한국보건산업진흥원이 지원하는 의료 연수지원 병원 8곳을 병원 한 곳당 한 행으로 담은 파일로, 병상·의사·간호사·지원인력 수, 병원 소개, 진료·연구센터 정보, 연수 프로그램과 혜택을 함께 싣는다. 보건의료 전문가나 연수 담당자가 '어느 병원에서 어떤 분야 연수를 받을 수 있고 어떤 지원을 받는가'를 비교할 때 쓴다. 전역 조인 키는 없어 병원명이나 주소를 기준으로 의료기관 인허가(LOCALDATA)·의료기관 정보와 이름 매칭으로만 잇는다.
description_portal: 본 정보는 한국보건산업진흥원이 지원하는 총 8개 의료 연수지원 병원에 대한 상세한 안내를 제공합니다. 각 병원의 기본 정보(병상, 의사, 간호사, 스태프 수 등)를 비롯하여, 병원의 특성과 주요 진료 분야를 소개하는 상세한 정보가 담겨 있습니다. 또한, 각 병원별로 특화된 연수 프로그램, 신청 자격, 연수 기간, 지원 내용 등 연수에 필요한 모든 정보를 제공하여 보건의료 분야 전문가들의 역량 강화와 기술 습득을 돕습니다. 연수지원 병원의 특징과 장점을 한눈에 파악할 수 있도록 구성되어 있으며, 효율적인 정보 탐색을 통해 개인의 경력 개발 목표에 부합하는 최적의 연수 기회를 모색할 수 있습니다.
