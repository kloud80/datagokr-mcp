summary_user: 충청북도 11개 시군의 보건지소를 한 행에 한 곳씩 담은 목록으로, 시군·지소명·전화번호·우편번호·주소를 담는다(포털 설명 기준 청주시 13개소, 충주시 13개소, 괴산군 12개소 등, 2026년 6월 30일 기준). 주민이 "우리 면에서 가장 가까운 보건지소는 어디이고 전화번호는 무엇인가"를 확인하거나, 분석가가 시군별 보건지소 배치 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·주소 문자열을 매칭해 잇는다. 지역사회 건강조사처럼 시군구 단위 건강지표와 연결할 때는 시군명을 시군구코드로 직접 매핑해야 한다.
limits: 보건소코드나 행정구역코드가 없어 다른 데이터와 붙이려면 이름·주소로 매칭해야 한다. 좌표 컬럼이 없어 지도에 표시하려면 주소를 별도로 지오코딩해야 한다. 진료 과목, 운영 시간, 이용 실적 같은 정보는 담지 않는다.
