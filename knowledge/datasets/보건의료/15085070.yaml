description_portal: '○ 통계개요* 통계명 : 한센등록자 현황* 통계종류 : 서울시 자치구별 한센등록자 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「감염병의 예방 및 관리에 관한 법률」에 의거한 한센병 관리* 작성목적 : 국내의 한센병 관리 및 유병실태를 파악하여 한센병관리사업의 추진성과를측정하고, 관리 대책의 방향설정 및 수행방법을 개선시키기 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 보건소 및 민간의료기관 → 시도 → 질병관리본부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 해당기관,내용 - 서울시 등록(신고) 한센병환자수의 거주 형태별, 관리구분별 현황 및신환자, 사망자수 현황○ 용어설명* 요치료 : MDT치료 대상자* 서비스대상자 : 재발관리 대상자, 재활복지사업 대상자'
