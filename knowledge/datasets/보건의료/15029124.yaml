description_portal: 연제구 공중이용시설 내 흡연실 설치 현황에 대한 데이터로 흡연실 설치 여부,  해당 공중이용시설 주소에 대한 정보를 현행화하여 제공합니다.흡연실 설치는 금연구역 의무지정 해당 공중이용시설의 관리자 등이 하여야 합니다.어린이, 청소년 이용시설 및 의료기관 등은 실내 설치 불가하며 그 외에는 실내 설치 가능합니다.흡연실 설치 시 흡연실 표지 부착 의무가 있으며 위반 시 과태료 부과합니다.실내 흡연실 설치 시 공동으로 이용ㅎ아는 시설인 사무실, 화장실, 복도, 계단 등의 공간을 흡연실로 사용해서는 안됩니다.또한 실내로 담배연기가 유입되지 않도록 실내와 완전히 차단된 밀폐공간으로 해야하며 흡연실의 연기를 실외로 배출할 수 있도록 환풍기 등 환기시설을 설치해야 합니다.
