summary_user: 부산광역시 연제구 관내 약국과 한약국을 한 곳당 한 행으로 담은 목록 파일로, 약국명·전화번호·도로명 우편번호·도로명 소재지를 담는다(포털 설명상 2025년 7월 21일 기준 108개소). 연제구 주민이 동네 약국 위치와 연락처를 찾거나, 분석가가 구 단위 약국 분포를 주소로 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어 다른 약국·의료기관 데이터와는 약국명과 도로명 주소를 맞춰 잇는 방식으로만 연결한다.
description_portal: '부산광역시 연제구에서 개방하고 있는 공공데이터 개방 목록 현황 데이터로 관내 약국 및 한약국의 약국명, 약국 주소, 약국 전화번호 등에 대한 정보를 다음과 같이 제공합니다.1. 약국 순번 : 약국(한약국) 목록의 순번2. 약국명: 약국(한약국)의 영업소명3. 약국 전화번호: 약국(한약국)의 전화번호4. 약국 우편번호: 약국(한약국)의 우편번호5. 약국 소재지: 약국(한약국)의 주소지(소재지)* 2025.7.21.기준 연제구 관내 약국(한약국)은 108개소입니다.* 약사법 제20조(약국 개설등록)제1항: 약사 또는 한약사가 아니면 약국을 개설할 수 없다.* 약사법 제21조(약국의 관리의무)제1항: 약사 또는 한약사는 하나의 약국만을 개설할 수 있다.'
