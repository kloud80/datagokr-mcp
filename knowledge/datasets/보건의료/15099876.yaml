description_portal: '서울특별시 마포구의 법정동별 코로나19 확진자 수 현황에 대한 정보입니다.이 데이터에는 2020년 1월부터 2023년 8월가지의 코로나19 유행기간 동안 각 확진 사례가 속한 구체적인 행정 구역 정보(예: 시도명, 시군구명, 법정동명)와 발생 시점을 기준으로 한 월별 확진자 수가 포함되어 있습니다. 또한, 세부적인 발생 위치는 법정동 단위로 구분되며, 해당 지역의 확진자 수에 대한 현황 등이 함께 제공됩니다.이 데이터를 통해 주민들은 자신의 거주지 주변의 감염병 발생 현황을 확인하고, 방역 수칙을 보다 철저히 준수하며 예방 활동에 활용할 수 있습니다. ※2023년 9월부터 코로나19 확진자 집계가 수행되지 않아 본 데이터는 더이상 업데이트 되지 않습니다.'
