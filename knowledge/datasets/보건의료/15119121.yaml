summary_user: 전라남도(현 전남광주통합특별시) 안에서 정부가 지정한 응급의료기관이 아닌 일반 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 시군구·기관명·기관분류·의료기관분류·도로명주소·우편번호가 들어 있으며 파일 크기는 932바이트입니다. 주민이나 분석가가 '우리 시군에서 응급의료기관이 아닌 병원·의원·보건소는 어디에 있나'를 확인하거나 응급의료기관 목록과 나눠 보는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 기관명·주소 문자열 매칭이나 시군구 이름으로만 연결한다.
description_portal: '- 전라남도의 응급의료기관 외의 의료기관 현황을 정리한 공공데이터입니다.(시군구, 기관명, 기관분류, 의료기관 분류, 기관주소, 우편번호 포함)- "응급의료기관 외의 의료기관"은 말 그대로 정부가 지정한 응급의료기관이 아닌 일반 의료기관을 의미합니다.- 응급의료기관이란?응급환자에게 신속하고 적절한 진료를 제공하기 위해 보건복지부 장관이나 시·도지사가 지정한 기관.- 응급의료기관 외의 의료기관이란?다음에 해당하는 비응급의료기관들을 의미합니다.- 의원급 (동네 병·의원): 1차 진료 중심, 주로 낮에 운영- 병원/종합병원:입원 가능, 전문과목 진료 운영- 요양병원: 만성질환자나 노인 대상 장기 요양- 전문병원: 특정 진료 분야에 특화 (ex. 정형외과, 재활의학과 등)- 보건소/보건지소: 예방접종, 감염병 대응, 기본 진료 등- 한방병원/한의원: 한의학 중심의 진료 제공'
