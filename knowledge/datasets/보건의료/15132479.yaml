summary_user: 전국 보건소 294곳의 기본정보(관리번호·기호·명칭·행정구역 코드·주소)와 국가암검진·일반검진·영유아검진 담당자 연락처를 보건소 1곳당 1행으로 담은 파일 데이터다. 내 지역 보건소의 검진 담당 부서에 어떻게 연락하는지 찾는 국민이나, 보건소 위치 현황을 정리하는 분석가가 쓴다. 시도코드(admin_area_code)와 주소(address)를 키로 다른 행정구역·위치 자료와 이어 쓰며, 시군구코드와 보건소관리번호는 조인 키로 확인되지 않았다.
limits: 검진 결과나 검진 실적, 건강보험 진료·급여 통계는 담지 않고 연락처와 소재지 정보만 있다. 포털 설명상 연락처는 보건소별 입력 최신값 기준이라 실시간 변동 가능성이 있어 통화 전 확인이 필요하다. 보건소 분류는 보건의료 부문으로 이동하자는 제안이 있어 분류 위치가 바뀔 수 있다.
