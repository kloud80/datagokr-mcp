description_portal: 진주시 의약업소 현황 자료로, 관내에서 운영 중인 각종 의료·의약 관련 업소의 기본 정보를 제공합니다. 종합병원, 병원, 일반의원, 치과의원, 한의원, 한약방을 비롯해 안마시술소, 치과기공소, 약국, 안경원 등 다양한 업종이 포함됩니다. 또한 의료기기 판매업소, 안전상비의약품 판매처, 의약품도매업소, 산후조리원, 의료기관세탁물처리업체, 소독업소 등의 운영 현황도 함께 제공하여 지역 보건·의료서비스 인프라 파악과 정책 수립, 시민 편의 증진을 위한 행정 업무 지원에 폭넓게 활용할 수 있는 자료입니다.
