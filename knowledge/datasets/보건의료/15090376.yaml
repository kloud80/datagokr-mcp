summary_user: 식약처가 승인한 의약품 임상시험 계획별로 대상자 제외기준을 담은 건별 목록으로, 의뢰자·대표자·소재지·원개발사와 국가·승인일자·국문/영문 시험제목·성별·연령구간(18세 미만, 18~65세 미만, 65세 이상)을 함께 제공한다. 임상시험 참여를 고려하는 환자나 연구자가 특정 시험에서 어떤 조건의 사람이 대상에서 빠지는지 확인하거나, 분석가가 연령·성별별 제외 경향을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 임상시험 정보(선정기준·승인 목록 등)와는 시험제목·의뢰자명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
limits: 공통 식별 키가 없어 약가·급여 목록이나 품목허가 정보와 코드로 정확히 연결되지 않으며 이름 매칭 오차를 감안해야 한다. 개발계정은 일 10,000회 호출 제한이 있다.
