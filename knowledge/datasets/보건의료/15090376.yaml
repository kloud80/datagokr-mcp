description_portal: 식품의약품안전처 「의약품 임상시험 계획 제외기준 정보」 OpenAPI는 임상시험 대상자 선정을 위한 제외 기준(어떤 경우에 임상시험 대상에서 제외되는지)을 목록으로 제공하는 공공데이터이며, 임상시험 대상자 적합성을 평가하고 안전성을 확보하는 데 활용됩니다. 주요 항목으로는 임상시험 의뢰자, 임상시험 대표자, 임상시험 소재지, 원개발사 명칭(업체), 원개발사 국가, 최근(변경)승인일자, 임상시험정보  승인일자, 임상시험제목(국문, 영문), 선정기준, 성별, 연령(18세미만/18세이상~65세미만/65세이상) 정보를 제공합니다.
