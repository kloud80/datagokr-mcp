summary_user: 아토피성 피부염(주상병 L20)으로 건강보험 진료를 받은 인원을 진료년도·시도·시군구·성별·10세 단위 연령대별로 집계한 전국 파일로, 포털 설명상 2017~2023년 자료이며 수진자 주소지 기준이다. 보건 연구자나 지자체 담당자가 '우리 시군구의 아동·청소년 아토피 진료인원이 연도별로 어떻게 변했고 다른 지역과 비교해 어떤가'를 살피는 데 쓴다. 전역 조인 키(행정구역 코드)는 없어 시도·시군구 이름을 매핑해 인구 통계나 다른 시군구별 진료인원 데이터와 연결해야 한다.
description_portal: '국민건강보험공단_시군구별 아토피성 피부염 진료인원1. 주상병코드: L20(아토피성 피부염)2. 진료년도: 2017~2023년3. 수진자 주소지 기준(주소를 찾을 수 없는 자료 제외)3. 연령: 0~79세(10세 단위), 80세 이상, 연말기준4. 진료인원: 해당 연도에 진료받은 인원(중복제외)  - 진료일 기준(한의분류 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 지급분까지 반영의미 : 국내 아토피성 피부염에 대한 현황 등에 대한 정보 공개를 통해 관련 정책 및 연구 등을 지원하기 위하여 개방함 ※ 개인정보 보호를 위해 5인 미만의 시군구 단위 자료는 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
