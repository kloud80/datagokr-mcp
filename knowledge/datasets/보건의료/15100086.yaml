description_portal: '전라남도 해남군 코로나 확진자 및 사망자 현황 데이터입니다.이 데이터는 2020년 1월부터, 2023년  6월까지 월별로  확진자 및 사망자 데이터를 제공합니다.코로나 19는 코로나19바이러스 감염에 의한 급성호흡기질환으로 호흡기 비말에 의해 전파됩니다.  - 임상증상:   - 발열(37.5도 이상), 기침, 호흡곤란, 오한, 근육통, 두통, 인후통, 후각, 미각소실 등   - 기타 피로, 식용감소, 가래, 소화기증상(오심, 구토, 설사 등), 혼돈, 어지러움, 콧물, 코막힘, 객혈, 흉통, 결막염, 피부증상 등이 동반될 수 있음 - 잠복기: 1~14일(평균 5~7일)'
