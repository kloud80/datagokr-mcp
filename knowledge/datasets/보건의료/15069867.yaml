description_portal: '제주특별자치도 내 소재하는 소독업체 현황 데이터를 제공합니다.항목: 업소명, 소재지, 연락처 등*「감염병의 예방 및 관리에 관한 법률」에 따라 특별자치도지사 등은 감염병을 예방하기 위하여 청소나 소독을 실시하여야 한다. - 소독을 업으로 하려는 자는 보건복지부령으로 정하는 시설ㆍ장비 및 인력을 갖추어 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장에게 신고하여야 함- 소독업자는 보건복지부령으로 정하는 기준과 방법에 따라 소독하여야 함- 소독업자가 소독하였을 때에는 보건복지부령으로 정하는 바에 따라 그 소독에 관한 사항을 기록ㆍ보존하여야 함- 소독업자는 소독업무 종사자에게 소독에 관한 교육을 받아야 함'
