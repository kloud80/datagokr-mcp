summary_user: 의료기기 GMP(제조 및 품질관리 기준) 품질심사 신청 건별로 업소명·대표자·주소·업종, 심사청과 심사 방식, 기관접수일·보고일, 최초심사 여부, 진행 상태 등을 담은 전국 단위 원천 데이터이며 업소 주소 단위로 기록된다. 의료기기 제조·수입업체의 GMP 심사 신청 이력과 진행 상태를 확인하거나, 분석가가 접수일부터 보고일까지의 심사 처리 기간을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명 매칭이나 같은 식약처 데이터의 코드로만 이어 쓸 수 있다.
description_portal: 본 데이터는 의료기기 GMP(제조 및 품질관리 기준) 품질심사 신청 과정의 기본 정보를 제공하여, 심사 절차 투명성과 행정 효율성을 강화하고자 수집되었습니다.- GMP 품질심사 신청서를 기반으로 하며, 세부 항목으로는 업소명, 대표자명, 업소 주소 및 우편번호, 업종, 심사청, 심사 방식, 기관접수일, 보고일, 최초심사 여부, 진행 상태, 담당자 승인 여부 등이 포함됩니다. - 이 데이터를 통해 의료기기 GMP 심사 대응 현황 모니터링, 제조·수입업체의 신청 이력 및 심사 상태 분석, 심사 소요 기간 및 처리 기간 분석 등의 활용 효과가 기대됩니다.
