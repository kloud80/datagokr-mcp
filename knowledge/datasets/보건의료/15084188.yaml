description_portal: 성남시 내 진단용방사선발생장치 현황 데이터로 구별,의료장비명칭, 모델명, 장치형식, 용도, 장비형태, 장비상태, 제조연월, 신고일자, 의료기관명, 주소 항목 등으로 구성되어 있습니다. 경기도 성남시는 분당, 중원, 수정구에 걸쳐 대형 병원과 중소형 의료기관이 밀집된 지역으로, 진단용 방사선 발생장치의 설치와 활용 수준이 높은 편이다. 진단용 방사선 발생장치는 X-ray, CT, 유방촬영기 등으로 다양하며, 「진단용방사선 발생장치의 안전관리 규칙」에 따라 의료기관 개설 시 등록이 의무화됩니다. 특히 성남시에는 분당서울대학교병원, 분당차병원, 성남시의료원 등 고난이도 진단이 가능한 종합병원이 다수 존재하여 고해상도 장비의 보유 비중이 높습니다.
