summary_user: 서울 동작구의 이용업(이발·미용 등) 사업장을 건별로 담은 인허가 원천 자료로, 사업장명, 인허가일자, 영업상태(정상·휴업·폐업), 폐업일자, 지번·도로명 주소, 좌표, 시설 면적, 건물 층수 같은 항목을 한 행에 담는다. 동네에서 새로 문을 열거나 폐업한 이발소·미용업소가 얼마나 되는지, 영업 중인 업소가 어디에 몰려 있는지 같은 상권·생활업종 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 같은 기관 코드(OPNSFTEAMCODE)나 주소·사업장명 매칭으로만 잇는다. 같은 형식의 다른 LOCALDATA 인허가 자료와 이렇게 함께 쓴다.
description_portal: 이용업 인허가 정보 데이터는 미용, 이발, 피부관리 등 이용업체의 영업 현황과 인허가 상태를 기록합니다.영업상태 항목은 사업장이 정상, 휴업, 폐업 중 어느 상태인지 확인할 수 있습니다.사업장명 항목은 각 이용업체의 공식 명칭을 제공합니다.위생업태명은 해당 이용업체가 제공하는 서비스 유형과 위생 관리 범위를 나타냅니다.데이터는 이용업 운영 현황과 업종별 분포를 평가하는 기초 자료로 활용됩니다.영업상태를 분석하면 활성화된 사업장과 관리가 필요한 사업장을 구분할 수 있습니다.사업장명 정보를 통해 업체별 위치와 규모를 파악할 수 있습니다.
