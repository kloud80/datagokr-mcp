description_portal: '□ 데이터 개요본 데이터는 해당 연도 직장가입자 중 근골격계질환 관련 의료 이용이 있는 환자의 비율을 산출한 자료입니다. 근골격계 질환은 주상병코드 첫 글자가 ‘M’인 질환으로 정의하며, 의료 이용률은 해당 질환으로 진료를 받은 환자 수를 직장가입자 전체 수로 나눈 비율입니다.□ 주요 내용대상: 해당 연도 직장가입자산출 기준: 연도말 기준산출 방법:분자: 근골격계질환 관련 주상병코드(첫 글자 ‘M’)를 진료받은 환자 수분모: 직장가입자 전체 인원 수의료 이용률: (분자 ÷ 분모) × 100 (%)□ 활용 안내본 데이터는 직장인 근골격계 질환의 의료 이용 현황을 파악하여, 건강관리 정책 및 예방 프로그램 수립에 활용될 수 있습니다.'
