description_portal: '마포구 관내 불용의약품 수거함 설치 현황에 대한 정보입니다.이 데이터에는 마포구 내 설치된 불용의약품 수거함의 도로명 주소와 구분 및 설치장소(예: 보건소, 아현지소, 서강지소, 동주민센터, 아파트 재활병원 등)가 포함되어 있습니다. 각 수거함이 설치된 장소의 전화번호(대표번호)도 함께 제공됩니다. 이를 통해 주민들은 가까운 곳에서 불용의약품을 안전하게 배출할 수 있어 지역 환경 보호에 기여하며,관계 기관은 의약품의 효율적인 수거와 관리를 통해 공공 위생과 건강 증진을 강화할 수 있습니다.'
