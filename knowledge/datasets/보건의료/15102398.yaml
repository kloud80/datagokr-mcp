summary_user: 한랭질환과 온열질환의 월별 진료비를 진료년월과 주상병코드(상병명)별로 집계한 전국 단위 파일로, 환자수·명세서 청구건수·입내원일수·보험자부담금·요양급여비용총액을 담는다(건강보험, 약국 제외, 양방만). 보건 분석가나 지자체 담당자가 "폭염이 심했던 달에 열사병 등 온열질환 진료 환자와 진료비가 얼마나 늘었나" 같은 계절별 질환 부담을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 진료년월로 기상 통계와 시점을 맞추거나 주상병코드를 KCD 질병분류 코드로 매핑해 다른 진료 통계와 잇는 방식으로만 연결한다.
description_portal: '계절성질환(한랭 및 온열질환) 월별 진료비 통계 / 진료년월 기준(심사분은 각 진료분+4개월) (예) 온열질환 진료년월: 2024년 6월~9월, 심사년월: 2024년 6월~2025년 1월, 한랭질환 진료년월: 2024년 11월~2025년 2월, 심사년월: 2024년 11월~2025년 6월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 질병은 주상병 기준이며 의료기관에서 의사가 진료 시 환자의 호소, 증세에 따라 일차적으로 진단명을 부여하여 진료비 청구가 이루어짐에 따라 실제 최종 확정된 질병과는 차이가 발생할 수 있음※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음※ 세부 산출기준은 첨부된 "계절성 질환 통계 산출기준" 참고'
