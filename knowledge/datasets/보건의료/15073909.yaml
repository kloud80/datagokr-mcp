summary_user: 식약처가 의료기기를 기능·사용 목적·작동 원리에 따라 나눈 중분류 체계인 품목군을 품목군코드·품목군명·품목군설명 단위로 담는 전국 단위 비공간 코드 목록이다. 의료기기 사업자나 분석가가 "이 제품은 어느 품목군에 속하고, 그 품목군의 특성·기준은 무엇인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 의료기기 품목허가 정보 등 다른 식약처 데이터와는 품목군코드(PRDGR_CD)나 품목군명을 이름·코드 매핑으로 맞춰 이어 써야 한다.
description_portal: 의료기기 품목군은 의료기기를 기능, 사용 목적, 작동 원리 등에 따라 분류한 중분류 체계로  식품의약품안전처(MFDS)에서 의료기기의 품목 및 등급을 효율적으로 관리하기 위해 설정한 체계입니다. 이 공공데이터는 의료기기의 분류체계를 나타내는 품목군코드, 품목군명, 품목군설명 등의 정보를 포함하고 있습니다 이 데이터를 통해 의료기기의 분류 단위를 명확하게 파악할 수 있습니다. 또 품목군설명으로  품목군별 제품 특성과 기준 정보를 신속하고 체계적으로 이해하는 데 활용할 수 있습니다.
