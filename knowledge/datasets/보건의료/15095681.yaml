summary_user: 의약품이 시중에 출하되기 전 국가가 승인한 내역을 출하승인 건별로 담으며, 접수번호·검체형식·제품명·제조·수입업자·제조번호·결과일시·검정규격·유효기간을 전국 단위로 제공한다. 약사·유통업자·분석가가 특정 제품의 특정 제조번호 로트가 언제 출하승인을 받았고 유효기간이 언제까지인지 확인하는 데 쓴다. 전역 조인 키(품목기준코드·표준코드 등)가 실측 컬럼에 없어, 식약처 허가정보 등 다른 데이터와는 제품명·업체명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 식품의약품안전처 「의약품 국가출하승인정보」 OpenAPI는 의약품이 시중에 출하되기 전 국가에서 승인한 내역을 확인할 수 있는 공공데이터입니다. 데이터에는 접수번호, 검체형식, 제품명, 제조·수입업자, 제조번호, 결과일시, 검정규격명, 유효기간 등이 포함되어 있습니다. 이를 통해 특정 의약품이 언제 승인되었는지, 어떤 업체가 제조하거나 수입했는지, 제조번호와 유효기간은 어떻게 되는지를 직접 확인할 수 있습니다. 또한 검체형식과 검정규격 정보를 통해 해당 의약품이 어떤 방식과 기준으로 검정을 거쳤는지도 알 수 있어 승인 과정을 객관적으로 파악하는 데 활용할 수 있습니다.
