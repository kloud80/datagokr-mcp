summary_user: '광주광역시 남구에 있는 의원(1차 의료기관)을 기관 한 곳당 한 행으로 담은 목록 파일로, 의료기관명·도로명 주소·전화번호·데이터기준일자를 담는다(csv 약 14KB). 남구 주민이 집 근처 의원의 연락처와 위치를 찾거나, 분석가가 남구 안에서 동네별 의원 분포와 의료 접근성을 살펴볼 때 쓴다. 전역 조인 키나 기관 코드가 없어서, 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 이어야 한다(예: LOCALDATA 의원 인허가 자료, 주소를 좌표로 바꾼 뒤 지도에 겹치기).'
