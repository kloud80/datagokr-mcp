description_portal: 양평관내 이용업, 미용업, 세탁업, 목욕장업, 건물위생관리업에 대한 데이터로  업종명, 업소명, 소재지도로명주소, 소재지지번주소 등의 정보를 제공합니다.공중위생영업이라 함은 다수인을 대상으로 위생관리서비스를 제공하는 영업으로서 숙박업, 목욕장업, 이용업, 미용업, 세탁업, 건물위생관리업을 말한다.숙박업은 손님이 잠을 자고 머물 수 있도록 시설 및 설비 등의 서비시를 제공하는 영업을 말하며 농어촌에 소재하는 민박 등 대통령령이 정하는 경우를 제외한다.목욕장업은 물로 목욕할 수 있는 시설 및 설비 등의 서비스를 손님에게 제공하는 영업을 말한다.이용업은 손님의 머리카락 도는 수염을 깎거나 다듬는 등의 방법으로 손님의 용모를 단정하게 하는 영업을 말한다.미용업은 손님의 얼굴, 머리, 피부 및 손톱발톰 등을 손질하여 손님의 외모를 아름답게 꾸미는 영업을 말한다.세탁업은 의류 기타 섬유제품이나 피혁제품등을 세탁하는 영업을 말한다.건물위생관리업은 공중이 이용하는 건축물 시설물 등의 청결유지와 실내공기정화를 위한 청소등을 대행하는 영업을 말한다
