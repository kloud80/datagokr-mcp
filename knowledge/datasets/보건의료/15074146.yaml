description_portal: 이 데이터는 국립암센터에서 수집한 PRE(선행) 위암 환자의 내시경 검사에 대한 메타정보로, 위암 진단을 위한 주요 시각적 검사인 상부위장관 내시경(Gastroscopy)의 기록을 포함합니다. 내시경 검사 일자, 병변 위치, 크기, 모양, 병소 수, 점막 상태, 출혈 여부, 의심 소견 등 다양한 항목이 포함되며, 진단적 목적의 생검 시행 여부 및 병리결과 연계 가능성도 포함됩니다. 본 데이터는 조기 위암의 병소 발견 및 정밀 진단에 필수적인 정보를 제공하며, 진단 정확도 향상과 선행치료 적응증 평가, 병기 설정, 수술 및 내시경 절제술의 적절성 판단에 핵심적으로 활용됩니다. 또한 위암 조기진단모델 개발, 내시경 영상 분석 연구, 임상 진단 프로세스 평가 등 다양한 보건의료 및 학술 연구에 활용 가능한 고가치 데이터를 제공합니다.
