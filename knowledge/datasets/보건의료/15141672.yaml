summary_user: 정선군시설관리공단이 운영하는 체육·장사·야영장·관광유원시설에 설치된 자동심장충격기(AED)를 시설 한 곳당 한 행으로, 시설명·전화번호·소재지·시설 내 설치위치·위도·경도와 함께 담은 소규모 파일(csv 약 2KB)이다. 정선 종합경기장이나 화암동굴, 캠핑장 같은 시설 방문객이나 안전 담당자가 "이 시설 안 AED가 어디에 있고 누구에게 연락하나"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 AED·응급의료 데이터와는 시설명·주소를 맞춰 보거나 위도·경도로 거리 기준 결합해 이어 쓴다.
description_portal: 정선군시설관리공단 사업장 자동심장충격기(AED) 설치 현황에 대한 데이터로 설치사업장, 주소, 위치, 기관 연락처 등의 정보를 제공합니다.응급상황 발생 시 누구나 신속하게 AED를 확인하고 활용할 수 있도록 정보를 제공합니다.정선종합경기장(체육관, 주경기장), 정선골프연습장, 정선국민체육센터, 민둥산아리센터, 정선군농민문화체육센터, 고한생활체육공원, 하늘공원 등 체육 및 장사시설,화암약수, 동강전망자연휴양림, 생태체험학습장, 회동솔향캠핑장 등의 야영장 시설, 화암동굴, 벅스랜드, 가리왕산케이블카 등의  관광유원시설에 설치되어 있습니다.AED는 누구나 찾기 쉽게 시설 로비 및 복도 중앙, 현관 입구 등에 설치됩니다.
