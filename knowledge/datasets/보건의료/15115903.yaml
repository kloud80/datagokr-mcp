summary_user: 서울 중구 안에서 병원·의료기관에 부속된 진료 지원 기관의 인허가 정보를 사업장 한 건씩 담으며, 인허가·취소일자, 영업상태와 상세상태, 휴·폐업일, 소재지 주소, 사업장명, 병상·병실 수와 면적, 중부원점TM 좌표를 포함한다. 주민이나 분석가가 '중구에서 지금 영업 중인 부속의료기관은 어디이고 최근 폐업한 곳은 어디인가'처럼 의료지원 시설의 위치와 개폐업 흐름을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 LOCALDATA 인허가 자료와는 같은 자치단체 코드(OPNSFTEAMCODE)나 사업장명·주소 매핑으로 연결한다.
description_portal: '본 데이터는 서울특별시 중구 내에서 병원 또는 의료기관에 부속된 진료 지원용 기관에 대한 인허가 정보를 수록한 자료입니다. 수록 항목에는 부속기관명, 대표자, 소재지, 허가일자, 시설유형, 허가상태, 관리기관 등이 포함되며, 지역 내 의료지원 인프라의 현황을 파악하는 데 활용됩니다. 해당 자료는 「의료법」 및 관련 법령에 따라 허가 또는 신고된 부속의료기관을 대상으로 작성되었으며, 보건행정의 효율성과 투명성 제고를 위한 기초자료로 제공됩니다. 일반 시민은 진료 연계 기관의 위치 및 운영 현황을 확인할 수 있고, 행정기관 및 연구기관은 지역 보건의료체계 분석, 정책 수립, 시설 관리 등 다양한 목적으로 본 데이터를 활용할 수 있습니다. 데이터는 구조화된 형식으로 제공되어 재이용성과 행정 연계 활용이 용이합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
