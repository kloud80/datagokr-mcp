summary_user: 보건소(보건의료원 포함)·보건지소(도시 보건지소 포함)·보건진료소·건강생활지원센터의 개수를 연도별·시도별로 집계한 파일로, 2018~2024년 전국 시도 단위 현황을 담는다. 정책 분석가나 지자체 담당자가 "우리 시도의 공공보건기관 수는 다른 시도와 비교해 어떻고 연도별로 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시도명과 연도를 기준으로 인구·지역사회 건강조사 같은 시도 단위 통계에 이름을 맞춰 붙여 쓴다.
description_portal: 보건복지부에서 2018년~2024년까지 보건소, 보건지소, 보건진료소, 건강생활지원센터 현황에 대해 시도별로 분류하여 정보를 제공하고 있습니다.<통계 데이터 이용 시 참고사항>1) 보건소에는 보건의료원까지 포함된 데이터입니다.2) 보건지소 개수에는 도시(동지역)보건지소 개수가 포함된 것입니다.3) ʼ15년부터 건강생활지원센터 현황이 포함되었습니다.4) 보건소에서 시･도를 거쳐 보건복지부로 제출하는 보고통계로 건강보험심사평가원 자료와는 기준 등의 차이로 통계현황이 다를 수 있습니다.
