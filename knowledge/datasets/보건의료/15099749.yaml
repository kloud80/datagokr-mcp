summary_user: '양평군과 안전분만 진료 협약을 맺은 인근 시군(서울·경기·강원 등) 산부인과 의료기관 13곳의 목록으로, 기관별 이름·도로명/지번 주소·전화번호·협약일을 한 행씩 담는 작은 파일(csv, 약 1.9KB)이다. 군내 산부인과 분만 중단(2019년 5월) 이후 양평군 산모나 가족이 "분만하러 어느 병원으로 가야 하고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 의료기관 데이터(예: 병의원 인허가 LOCALDATA)와는 의료기관명이나 주소를 맞춰 연결해야 한다.'
description_portal: 경기도 양평군에 소재한 OO산부인과의 분만이 2019년 5월 30일 중단된 이후 외래진료만 이루어 지고 있으며, 외래진료를 받는 산모들이 분만을 위해 인근 시군의 산부인과로 전원을 해야 하는 상황입니다.양평군 산모들이 전원을 안전하고 신속하게 할 수 있도록 양평군과 인접해있는 산부인과(서울특별시, 경기도, 강원도 등)와 안전분만 관련 진료 협약을 2019년 10월 14일에 맺은 이후 2025년 11월 12일  총 13개의 의료기관과 협약을 맺었습니다. 13개 의료기관의 연번, 의료기관명, 소재지도로명주소, 소재지지번주소, 전화번호, 협약일 현황입니다.
