description_portal: 본 데이터는 전북특별자치도 익산시에서 집계한 코로나19 월별확진자수 데이터이다. 코로나19는 2019년 12월 중국 우한시에서 발생하여 세계적으로 확산된, 새로 발견된 신종 코로나바이러스에 의한 호흡기 감염질환으로, 2023년  8월 31일 코로나가 4급 법정감염병으로 하향되었다. 이 자료는 2020년 1월에서 2023년 8월까지의 데이터를 제공하고 있다. 해당 데이터는 방역 정책 수립 및 감염병 대응에 필요한 기초자료로 활용되며, 월별 확진자 변동 추이를 통해 감염병 확산 경향을 분석할 수 있다.
