summary_user: 질병관리청 국민건강영양조사 결과로 산출한 19세 이상 성인의 고위험 음주율(최근 1년간 주 2회 이상, 1회 평균 남자 소주 7잔·여자 5잔 이상 마신 사람의 분율)을 연도별로 담은 전국 단위 집계표이며, 거주지(동·읍면)와 연령대(19-29세부터 70세 이상까지)별 값을 함께 제공한다. 절주 정책 담당자나 연구자가 '고위험 음주율이 연도별로, 또 연령대나 도시·농촌 거주지에 따라 어떻게 달라지는가'를 확인하는 기초자료로 쓴다. 전역 조인 키가 없어 다른 음주·건강 지표 파일과는 연도와 연령·거주지 구분 이름을 맞춰 이어 쓴다.
description_portal: 음주폐해예방 관련 지표- 질병관리청 국민건강영양조사 결과를 활용하여, 19세 이상 성인의 고위험 음주율을 산출한 지표입니다. - 고위험 음주율은 최근 1년 동안 주 2회 이상 음주하면서, 1회 평균 음주량이 남자는 소주 7잔 이상, 여자는 소주 5잔 이상인 사람의 분율을 의미합니다.- 데이터는 거주지역, 연령별로 구분하여 고위험음주율을 제공하고 있으며, 데이터 연도범위는 2005년~2023년 입니다. - 본 데이터는 국내 음주폐해예방 및 절주문화 확산 관련 연구 수행 시 기초자료로 활용될 수 있습니다.
