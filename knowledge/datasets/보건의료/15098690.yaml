description_portal: 코로나19로 인한 서울특별시 금천구 내 사망자 현황을 연도와 월별, 내국인·외국인 구분, 각 행정동별로 집계한 데이터입니다. 가산동, 독산동, 시흥동 등 지역별 사망자 수와 전체 합계, 데이터 기준일 등 다양한 정보를 포함하며, 2023년 8월 31일까지의 누적 자료를 제공합니다. 이 데이터는 감염병 치명률 분석, 지역별 위험도 평가, 보건 정책 수립, 학술 연구 등 여러 분야에서 활용할 수 있으며, 일자별로 정리되어 있어 시계열적 변화 추적이 용이합니다. (확진자 집계가 2023.8.31.자로 마감되어 해당일자까지의 데이터만 제공)
