description_portal: 초기 코로나-19 발생 시점인 2020년 1월 부터 22년12까지 서울특별시 중구에서 발생한  확진자 현황을 일별로 정리하여 제공하고자 합니다. 데이터는 각 코로나 확진일, 확진자 수, 누적 확진자 수 등의 정보를 제공합니다. 이 자료는 지역사회 감염별 발생의 시계열적 추이를 분석하고 대응 방안을 마련하는 데 중요한 기초 정보를 제공합니다. 나아가, 일반 시민 및 정책 담당자에게는 코로나19 감염병 발생 상황의 투명한 현황을 확인할 수 있도록 지원합니다. 서울특별시 중구는 본 데이터를 개방함으로써 코로나19 감염병 대응 환경 조성에 기여하고자 노력하고 있습니다.
