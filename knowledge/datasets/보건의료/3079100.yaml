summary_user: 전북특별자치도 익산시에 있는 의약품 판매업소를 업소별로 한 행씩 담은 원천 목록으로, 영업소명·도로명 소재지·전화번호·영업종별을 담는다(CSV 파일 약 1.7KB 규모). 시민이나 사업자가 '익산시에 어떤 의약품 판매업소(도매상 등)가 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 지역 의약품 유통업소 현황을 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명·주소 문자열 매칭으로만 이어 쓰며, 식약처 품목코드 기반의 허가·약가 데이터와 직접 연결되지 않는다.
description_portal: 본 데이터는 전북특별자치도 익산시의 의약품 판매업소 정보를 수집한 자료로, 의약품 판매업소의 영업소명, 영업소 도로명주소, 영업소 전화번호, 영업종별 등의 데이터를 제공하고 있다. 지역 의약품 도매업소의 운영 실태 파악을 위한 기초자료로 이용될 수 있으며 또한 지역보건 산업 현황 분석과 관련 연구에 중요한 자료로 활용 가능하다. 해당 데이터는 데이터 미집계로 인한 공란이 있을 수 있다. 공공데이터 포털에서 정기적으로 갱신되어 최신정보를 반영하며, 키워드와 설명을 통해 이용자들에게 신뢰성 있는 정보를 제공한다.
