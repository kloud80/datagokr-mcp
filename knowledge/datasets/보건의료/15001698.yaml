summary_user: 요양기관이 심평원에 신고한 기준으로 전국 병원·의원의 기관별 기본정보(병원명·종별·주소·좌표·전화·개설일자)와 의과·치과·한방별 전문의·레지던트·인턴·일반의 인원수를 한 기관 한 행으로 담는 원장형 데이터다. 국민이나 분석가가 '우리 동네 가까운 종합병원이 어디이고 전문의는 몇 명인가' 같은 질문에 쓰고, 좌표와 거리 값으로 위치 기반 조회에 쓴다. 암호화된 요양기호(ykiho)로 심평원의 다른 요양기관 API(진료과·병상·장비·진료시간 등)와 묶어 쓰고, 주소와 시도코드로 지역 데이터와 잇는다.
description_portal: 건강보험심사평가원에서 관리하는 병원 정보를 조회하는 서비스입니다.- 국민건강보험법 제 43조(요양기관 현황에 대한 신고) 및 동법 시행규칙 제 12조(요양기관 현황 신고 등)에 의해 요양기관이 건강보험심사평가원에 신고한 기준으로 작성되었습니다.- 요양기호는 1:1로 매칭한 암호화된 요양기호로 제공하고 있으며, 별도의 복호화 방법 또는 요양기호는 제공하고 있지 않습니다.- 지역코드 등 API 활용을 위한 코드는 보건의료빅데이터개방시스템(opendata.hira.or.kr) > 서비스 소개 > 용어설명 > 코드조회를 참고하여 주시기 바랍니다.
