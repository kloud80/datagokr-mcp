description_portal: 이 데이터는 국립암센터에서 수집한 PRE(선행) 위암 환자의 기본 인구통계학적 정보를 포함하는 메타데이터입니다. 환자의 성별, 생년, 진단 시 연령, 최초 진단 연도, 등록번호(식별 불가능한 가명값 처리), 진료 시작일 및 종료일, 등록 병원 등 위암 진단 및 치료 전반에 걸쳐 활용되는 기본 정보가 포함되어 있습니다. 해당 데이터는 위암 환자의 연령대별 분포, 성별 특성, 연도별 진단 추이 등 역학적 분석과 인구 기반 질병 연구에 기초 자료로 사용될 수 있습니다. 또한 임상 특성과의 연계 분석, 치료 접근성 비교, 국가 암 관리 정책 수립 등에 필요한 기초정보로 메타데이터 활용이 가능합니다.
