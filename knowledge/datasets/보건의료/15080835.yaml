status: active
summary_user: 중앙보훈병원 욕창진료센터 환자의 진료 시작일·종료일, 진단명, 치료부위(최대 10곳)와 부위별 방향·치료단계 등을 환자 번호(PT_NO) 단위로 담은 건별 진료 기록이다. 욕창 치료 연구자나 보훈 의료 분석가가 욕창이 주로 어느 부위에 생기고 치료단계가 어떻게 바뀌는지를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원명이나 기관 코드 수준으로만 연결된다.
limits: 환자 번호는 기관 내부 식별자라 다른 의료·보훈 데이터와 환자 단위로 결합할 수 없다. 공간 정보가 없는 비공간 데이터이며, 중앙보훈병원 한 곳의 욕창진료센터 기록으로 다른 보훈병원이나 일반 병원 현황을 대표하지 않는다.
