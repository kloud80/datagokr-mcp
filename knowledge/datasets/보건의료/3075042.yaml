description_portal: 2019년도까지의 예방접종 후 이상반응 발생 현황에 대한 통계(접종건수, 이상반응 신고건수, 보상건수, 기각건수) 제공하고 있습니다.예방접종 이상반응의 연도별 통계는 접종 10만건당 신고건수를 담고 있으며 신고선수는 접종 건수 대비 확인할 수 있습니다. 보상 건수, 기각 건수, 10만건당 신고율, 10만건당 보상건수를 각각 산출하여 제공합니다. 자세한 내용과 수치는 첨부된 표를 통해 확인하실 수 있습니다. 1994년부터 2011년까지의 접종건수는 시스템 및 내부 사정으로 산출하지 않았으며, 이와 관련하여10만건당 신고율과 보상건수도 산출되지 않았음을 양해바랍니다.
