summary_user: 전남광주통합특별시 북구 관내 약국을 한 곳씩 담은 목록으로, 약국명칭·도로명 소재지(끝에 법정동 괄호 표기)·약국구분(약국/한약국)과 데이터기준일자를 CSV 파일로 제공한다. 주민이나 분석가가 '북구 어느 동에 약국·한약국이 몇 곳 있는가', '우리 동네 가까운 약국은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 약국명칭이나 도로명주소를 맞춰 붙이거나, 주소 끝 법정동명으로 동별로 묶어 다른 북구 통계와 함께 본다.
description_portal: '전남광주통합특별시 북구에 소재한 약국의 현황 데이터입니다.전남광주통합특별시 북구 관내 약국명칭, 약국소재지(도로명), 약국구분의 항목에 대한 정보를 공공데이터 포털을 통해 CSV 파일로 제공합니다.* 약국소재지 컬럼에 기재한 주소는 모두 도로명주소 기준으로 작성되었습니다. 단, 약국소재지 컬럼의 각 셀마다 주소 끝부분에 추가로 별도 기재한 괄호 안의 지역 동명은 모두 법정동 기준으로 작성되었습니다.** 약국구분: 2종 (약국 / 한약국)※ 전남광주통합특별시 북구 약국현황 공공데이터는 전남광주통합특별시 북구보건소 보건행정과에서 제공하고 있습니다.'
