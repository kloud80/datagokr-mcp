description_portal: 부산광역시 서구 금연시설 내 흡연구역 정보(시설명, 게임제공업소/목욕장 등의 공중이용시설 구분, 실내/외 구분, 주소지, 흡연구연개수)에 대한 데이터부산광역시 서구의 흡연구역은 일반적으로 금연구역으로 지정된 공간 내에서 관리자가 법령에 따라 따로 마련한 흡연 가능한 장소를 일컫습니다. 「부산광역시 서구 금연환경 조성에 관한 조례」에 따라 금연구역은 공원, 통학로, 대중교통 출입구 등 사람들이 많이 모이는 장소로 지정되며, 해당 구역 내에서는 안내 표지판 설치 의무가 있고 흡연실을 법적 기준에 맞춰 설치할 수 있습니다(밀폐 구조, 환기 설비 포함). 어린이·청소년 시설이나 의료기관 등에서는 설치가 금지되며, 설치 시에도 실내 유입 차단과 외부 배기 조건을 충족해야 합니다.
