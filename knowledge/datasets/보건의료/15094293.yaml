summary_user: 서울 서초구에서 편의점 등 약국이 아닌 곳에서 안전상비의약품을 팔도록 허가받은 업소를 업소 한 곳당 한 행으로 담은 인허가 자료입니다. 업소명, 지번·도로명 주소, 전화번호, 인허가일과 취소일, 영업상태(영업·폐업 등), 폐업일, 좌표(X·Y)가 들어 있습니다. 주민은 밤이나 휴일에 우리 동네에서 상비약을 살 수 있는 곳을 찾을 때 쓰고, 보건소나 분석가는 판매업소가 어떻게 분포하는지와 현장 점검 대상을 파악할 때 씁니다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 다른 자료와 합칠 때는 주소·업소명으로 맞추거나 자치단체 코드(OPNSFTEAMCODE)·관리번호 체계를 기준으로 붙여야 합니다.
description_portal: 본 데이터는 서울특별시 서초구내 안전상비의약품 판매업소 현황을 정리한 자료로, 약국 외 장소에서 안전상비의약품을 취급·판매하는 업소가 어디에 위치하는지를 확인할 수 있도록 구성되어 있습니다. 안전상비의약품이란, 의사의 처방 없이 구입 가능한 일반의약품 중에서 국민의 생명과 건강에 밀접한 관련이 있고, 응급상황이나 야간·휴일 등 약국 이용이 어려운 시간대에도 필요할 수 있는 약을 보건복지부가 지정한 품목을 말한다. 안전상비의약품 판매업소는 보건복지부 장관이 지정한 안전상비의약품을 약국이 아닌 장소(편의점 등)에서 판매하기 위해 관련 법령에 따라 관할 보건소의 허가를 받은 업소를 말하며 일정한 시설 요건을 갖추고 비상시에 일반인이 쉽게 의약품을 구매할 수 있도록 하는 역할을 합니다. 안전상비의약품을 취급하는 업소의 분포를 파악하거나, 판매 가능한 장소를 확인하는 데 활용할 수 있으며, 지역 내 판매 편의성 검토, 관련 행정 관리, 현장 점검 등의 기초자료로 사용할 수 있습니다.
