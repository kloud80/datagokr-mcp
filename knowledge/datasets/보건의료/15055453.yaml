summary_user: "창원시 마산합포구·마산회원구에 있는 의료기관을 한 곳당 한 행으로 담은 목록으로, 기관명·종별(종합병원·병원·요양병원·의원·치과의원·한의원 등)·도로명 주소·전화번호를 담는다(포털 설명 기준 2026년 1월 488개소). 주민이 '우리 동네 가까운 치과의원이나 한의원은 어디이고 전화번호는 무엇인가'를 찾거나, 분석가가 두 구의 의료기관 종별 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명 주소를 맞춰 잇는다(예: LOCALDATA 병의원 인허가 자료, 주소 지오코딩)."
