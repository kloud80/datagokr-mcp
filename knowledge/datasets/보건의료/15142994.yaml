description_portal: 광주광역시 남구 관내 안전상비의약품 판매업소 현황 및 정보(기업명, 소재지도로명주소)를 제공합니다. 해당 데이터는 광주광역시 남구청 보건행정과(☎062-607-4352)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 안전상비의약품 판매업소는 약국이 문을 닫는 심야나 공휴일 등 긴급 상황에서도 시민이 기본적인 의약품을 구입할 수 있도록 지정된 판매처입니다. 주로 편의점이나 일부 소매점이 해당하며, 해열제, 진통제, 소염제, 소독제, 파스 등 가벼운 증상에 사용할 수 있는 의약품을 취급합니다. 이 제도는 의약품 접근성을 높이고 경미한 증상 완화에 도움을 주기 위해 운영되며, 판매업소는 지정 요건을 갖추고 보관·진열 기준을 준수해야 합니다.
