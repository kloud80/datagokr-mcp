description_portal: '- 전라남도의 설치된 구강보건 인프라 현황 정보로(시군별 보건소 구강보건실 설치현황, 특수학교 구강보건실 설치현황, 초등학교 구강보건실 설치현황)의 정보를 조회할 수 있습니다.- “구강보건실”은 지역 주민의 구강 건강 증진을 목적으로 운영되는 공공 보건기관 내 진료 또는 교육 공간입니다. 주로 보건소 또는 보건지소에 설치되어 있으며, 아동·노인·장애인 등 취약계층을 대상으로 한 예방 중심의 치과 서비스를 제공합니다.- 운영 기관 : 시군구 보건소 또는 지소 (지자체)- 주요 대상 : 아동, 노인, 장애인, 저소득층 등- 운영 목적 : 구강질환 예방, 건강한 생활습관 형성, 조기 치료 유도- 서비스 성격 : 예방 중심, 일부 치과 치료 병행 (기관마다 다름)'
