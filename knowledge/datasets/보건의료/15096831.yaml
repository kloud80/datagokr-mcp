description_portal: '제주특별자치도 내 사회적 거리두기 실천율 정보 데이터를 제공합니다.항목: 연도, 시도, 시군구, 응답자수, 조율, 조율표준오차, 표준화율, 표준화율표준오차 등* 제주특별자치도에서 코로나19 방역 조치의 일환으로 시행된 사회적 거리두기 실천율에 대한 통계 자료입니다. 실천율은 일반 인구가 거리두기 지침을 얼마나 잘 따르는지를 나타내며, 조율(원 데이터 비율)과 표준화율(2005년 통계청 추계인구 기준으로 보정)이 함께 제공됩니다. 또 표준오차 정보도 포함되어 있어 조사 정확성 및 표본 신뢰도 파악이 가능합니다.* 활용 분야 : 방역 정책의 효과 모니터링 및 개선, 주민 참여 증진 및 커뮤니케이션 전략 수립 등데이터 제공처: KOSIS 국가통계포털'
