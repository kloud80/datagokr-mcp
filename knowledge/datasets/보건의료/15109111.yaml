description_portal: 이 데이터는 한국한의약진흥원이 수집하고 정제한 실험정보 기반의 표준용어 정형데이터로, 한약재의 기본 식별과 분류 정보를 체계적으로 제공합니다. 주요 필드는 한약재 ID, 일반명, 영문명, 라틴명, 기원종목록, 학명목록, 약용부위로 구성되며, 각 행은 특정 한약재의 표준명과 원식물 종, 학명, 사용 부위 등을 일관된 형식으로 담고 있습니다. 예를 들어 한약재 ID KMH2는 ‘가자’로, 영문명 Terminalia Fruit, 라틴명 Terminaliae Fructus, 기원종 ‘가자·융모가자’, 학명 Terminalia chebula 등으로 기록되어 있어 한약재의 명칭과 기원 및 약용 부위를 표준화해 관리할 수 있도록 지원합니다.
