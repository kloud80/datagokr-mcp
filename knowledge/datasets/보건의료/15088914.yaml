summary_user: 서울특별시 병의원을 기관 한 곳당 한 행으로 담으며, 기관명·주소·대표전화, 병원분류, 응급의료기관 구분과 응급실 운영 여부, 요일별 진료 시작·종료 시간, 위도·경도를 포함한다. 시민이나 분석가가 '우리 동네에서 지금 진료 중이거나 응급실을 운영하는 병의원은 어디인가', '구별 의료기관 접근성은 어떤가' 같은 질문에 지도 기반으로 답할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 기관명 매칭이나 같은 기관 코드 체계(HPID)를 쓰는 데이터와의 연결에 그치고, 좌표로 공간 결합하는 방식도 함께 고려해야 한다.
description_portal: 이 데이터셋은 서울특별시 내 병원 및 의원의 위치 정보를 담고 있으며, 주소, 병원분류 및 병원분류명, 응급의료기관 코드 및 명칭, 응급실 운영 여부, 상세 기관 설명, 간이약도, 기관명, 대표전화, 진료시간, 위도·경도 등의 항목을 제공하고 있습니다. 매월 1회 갱신됩니다. 이 데이터는 위치기반 분석, 보건의료 서비스 접근성 평가, 응급실 이용 가능기관 매핑, 지도 시각화 및 AI학습데이터로의 활용 가능성이 높습니다. 다만 ‘파일내려받기’ 항목이 바로 나타나지 않을 수 있고, 모든 정보가 항상 최신 상태일 수 있으므로 분석 전에 갱신일자와 자료 구조를 확인하는 것이 좋습니다.
