description_portal: '본 데이터는 2025년 기준 고창군 읍·면별 영양플러스사업 수혜인원 현황을 집계한 자료로, 각 행정구역별 영양플러스사업 수혜 규모를 파악할 수 있도록 제공됩니다. 데이터는 읍·면 단위로 영양플러스사업에 참여하는 수혜 인원 수를 기준으로 구성되어 있으며, 지역별 영양지원 수요 분석 및 모자보건 정책 수립을 위한 기초자료로 활용할 수 있습니다.데이터 구성은 연번, 행정동, 영양플러스사업 수혜인원 항목으로 이루어져 있으며, 행정구역별 수혜 인원 현황을 확인할 수 있습니다. 해당 자료는 보건사업 수행 과정에서 집계된 행정자료를 기반으로 작성되었습니다.본 데이터는 지역별 영양취약계층 분포를 공시적으로 분석하거나, 특정 지역의 영양지원 수요 변화를 파악하는 데 활용할 수 있습니다. 또한 공공데이터를 활용하여 다음과 같은 분석 및 연구에 활용이 가능합니다.단순 예시 사례이니 참고 바랍니다.○ 지역별 분포 분석: 읍·면별 영양플러스사업 수혜인원 현황을 통해 지역 간 영양지원 수요 차이를 파악하고 정책 수립에 활용할 수 있습니다.○ 수혜 대상자 규모 파악: 영양플러스사업 참여 인원 규모를 분석하여 향후 지원 계획 수립에 활용할 수 있습니다.○ 취약계층 영양지원 분석: 임산부 및 영유아 등 대상자 분포를 기반으로 영양지원 사각지대 해소를 위한 기초자료로 활용할 수 있습니다.'
