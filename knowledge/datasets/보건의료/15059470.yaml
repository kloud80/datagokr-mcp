summary_user: 경기도 내 병원의 폐암 진료 평가 결과를 병원 단위로 담으며, 병원명·구분·평가등급과 시군, 지번·도로명 주소, 우편번호, 위도·경도 좌표가 함께 들어 있다. 경기도에 사는 환자나 가족이 폐암 치료를 받을 병원을 고를 때 우리 시군에 평가등급이 높은 병원이 있는지 확인하거나, 분석가가 시군별 폐암 진료 질의 격차를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 병원명·주소 문자열 매칭, 좌표를 이용한 위치 결합으로 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 병원들의 폐암 진료 관련 평가 결과를 정리한 자료로, 병원명, 시군명, 평가등급, 소재지 주소, 위도·경도 등 위치정보가 포함되어 있습니다. 병원별 폐암 치료의 질적 수준을 ‘1등급’ 등으로 구분하여 제공하고 있으며, 지역별 암 치료 서비스의 질적 격차 및 의료자원 분포를 분석하는 데 활용됩니다. 이 데이터는 공공의료 정책 수립, 환자 대상 병원 선택 정보 제공, 지역 간 의료격차 해소 방안 마련, 국가 암 관리사업 기초자료, 질병중심 의료 서비스 품질 향상 등 다양한 공공보건 영역에서 유용하게 사용될 수 있습니다.
