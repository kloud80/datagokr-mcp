summary_user: 경기도 안에서 응급의료 전용헬기(닥터헬기)가 사전 허가를 받아 이착륙하며 환자를 인계할 수 있는 지점을 한 행에 한 곳씩 담은 목록으로, 시군명·지점명·도로명/지번주소·위도·경도로 구성된다. 소방·응급의료 담당자나 분석가가 "우리 시군에서 가장 가까운 닥터헬기 인계점은 어디이고, 응급의료기관까지 거리는 얼마인가"를 확인할 때 쓴다. 전역 조인 키는 없으므로 시군명(sigun_nm)으로 행정구역 단위 자료와 붙이거나, 위경도 좌표로 응급의료기관·병원 위치 데이터와 공간 결합해 쓴다.
description_portal: '이 데이터는 경기도 내 응급의료전용헬기(닥터헬기)의 착륙 및 환자 인계가 가능한 지점에 대한 정보를 제공하며, 시군명, 지점명, 도로명주소, 지번주소, 위도, 경도 항목으로 구성되어 있습니다. 각 지점은 응급환자 발생 시 헬기를 통한 신속한 이송이 가능하도록 선정된 곳으로, 관공서, 병원, 운동장 등 공공시설이 주로 활용됩니다. 위치 정보는 위도와 경도를 함께 제공하여 공간 정보 기반의 분석이 가능하며, 응급의료 대응 체계 구축, 헬기 운용 경로 최적화, 응급상황 시 골든타임 확보 등을 위한 기반 자료로 활용됩니다.(인계점: 환자를 태우거나 내리게 할 수 있도록 사전에 이∙착륙을 허가받은 지점)'
