summary_user: 부산광역시 서구에 주소를 둔 치과의원을 한 곳당 한 행으로 담은 명부 파일로, 의료기관명·도로명주소·전화번호만 들어 있다(포털 설명 기준 2026년 7월 35개소). 서구 주민이 집 근처 치과를 찾거나, 분석가·사업자가 동네별 치과 분포와 개폐업 변화를 상권 신호로 볼 때 쓴다. 전역 조인 키나 기관 코드가 없어, 다른 의료기관 인허가(LOCALDATA) 자료와는 기관명·도로명주소를 맞춰 이어 써야 한다.
description_portal: '부산광역시 서구에 주소지를 두고있는 치과의원에 대한 정보 데이터를 제공합니다.의료기관 명칭 , 의료기관 주소(도로명주소), 의료기관 전화번호 정보에 대한 데이터를 제공하고 있으며,신규 개설, 폐업, 이전, 명칭 변경 등의 변경사항이 있을 경우 데이터를 수정하고 있습니다.(2026년 7월 기준 치과의원 35개소)치과의원: 치과의사가 주로 외래환자를 대상으로 의료행위를 하는 의료기관치과병원: 치과의사가 주로 입원환자를 대상으로 의료행위를 하는 의료기관으로 30개 이상의 병상을 갖추어야 함'
