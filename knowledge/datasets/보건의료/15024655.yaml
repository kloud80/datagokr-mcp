summary_user: 부산광역시 사하구 관내 의료기관이 쓰는 CT·MRI·유방촬영용장치 같은 특수의료장비를 장비 한 대 단위로 담은 파일(csv, 약 5KB)로, 의료기관명·도로명 소재지·장비 종류·형식명·사용 상태·최근 검사일자를 담는다. 사하구 주민이나 분석가가 '집 근처에서 MRI나 CT를 갖춘 의료기관은 어디이고 장비 검사는 언제 받았나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가·병의원 데이터와는 의료기관명이나 소재지 주소를 맞춰 이어 써야 한다.
