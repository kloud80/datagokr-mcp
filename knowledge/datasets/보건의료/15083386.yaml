summary_user: 부산광역시에 있는 종합병원을 기관 한 곳당 한 행으로 담은 목록 파일로, 종별·의료기관명·대표자·도로명주소·위도·경도·전화번호·허가병상수·인허가일자를 담는다(csv 약 4KB). 부산 시민이나 분석가가 '우리 구 근처에 병상 규모가 큰 종합병원이 어디 있고 언제 허가됐나'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명·주소 매칭이나 위도·경도 기반 공간 결합으로 이어 쓰며, 세부 조건(진료과목·장비 등) 검색은 건강보험심사평가원 병원 찾기 자료와 기관명으로 대조한다.
description_portal: '부산광역시에 소재한 종합병원 데이터를 제공합니다.(종별, 의료기관명, 대표자, 도로명주소, 위도, 경도, 전화번호, 병상수, 인허가일자)※ 병상수: 허가병상수건강보험심사평가원에서는 세분화된 의료기관 찾기가 가능합니다.(지역별, 종별, 진료과목별, 병상별, 장비별, 특수운영기관별, 기타)세부조건 별 의료기관 찾기는 건강보험심사평가원에서 가능합니다.https://www.hira.or.kr/ra/dtlCndHospSrch/dtlCndHospSrch.do?pgmid=HIRAA050200000000%29'
