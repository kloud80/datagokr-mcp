summary_user: 충청남도 당진시 관내 의원(개인병원) 한 곳당 한 행으로 의료기관명·전화번호·도로명주소·지번주소를 담은 시군구 범위의 개별 기관 목록 파일(약 13KB CSV)이다. 당진시민이 '우리 동네에서 가까운 의원과 연락처'를 찾거나, 분석가가 읍면동별 1차 진료기관 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터(LOCALDATA 병의원 인허가 등)와는 기관명·주소를 맞춰 연결해야 한다.
description_portal: '충청남도 당진시 의원 현황 안내(데이터 기준일자: 2025년 6월 1일)충청남도 당진시는 시민의 기초진료 접근성과 지역의료체계 강화를 위해 관내 의원급 의료기관의 운영 현황을 체계적으로 관리하고 있습니다.본 자료는 당진시에 위치한 의원(개인병원)의 기본 정보를 정리한 것으로, 다음 항목들을 포함하고 있습니다:의료기관명전화번호도로명주소지번주소위도 / 경도본 자료는 1차 진료기관 분포 파악, 지역 보건정책 수립, 응급의료 대응계획 수립, GIS 기반 분석,대시민 의료정보 제공 등 다양한 행정 및 공공서비스 목적에 활용될 수 있습니다.'
