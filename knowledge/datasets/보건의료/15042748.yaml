summary_user: 국립나주병원 한 곳의 퇴원 환자를 퇴원일별로 묶어, 건강보험·비보험·산업재해·의료급여(1종·2종·2종 장애인)·임상·자동차보험·차상위(1종·2종·2종 장애인) 등 보험 유형마다 퇴원환자수·재원일수·평균재원일수를 담은 집계 파일(CSV 약 31만 바이트)이다. 공공 정신의료기관의 입원 기간이 의료급여·건강보험 등 보험 유형에 따라 어떻게 다르고 시기별로 어떻게 변하는지 살피려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 퇴원일(날짜) 기준으로 맞추거나 같은 기관명으로만 이어 쓴다.
limits: 단일 병원의 집계 통계라 환자 개인 단위나 다른 의료기관과의 직접 비교 분석에는 쓸 수 없다. 기관 코드 같은 전역 조인 키가 없어 의료기관 인허가 등 다른 데이터와 연결하려면 이름 매핑이 필요하다. 활용신청 없이 파일로 받는다.
