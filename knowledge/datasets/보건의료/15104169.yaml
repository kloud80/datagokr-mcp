summary_user: 인천광역시 부평구 안의 한의원을 기관 한 곳당 한 행으로 담은 목록 파일로, 기관명·의료기관종별·우편번호·도로명주소·전화번호를 수록한다. 부평구 주민이 집 근처 한의원과 연락처를 찾거나, 분석가가 구 안 한의원이 어느 동네에 몰려 있는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·도로명주소를 맞춰 붙이거나 우편번호 단위로 묶어 이어 쓴다.
description_portal: '한의원의 명칭, 종별, 주소, 우편번호, 전화번호 등을 수록한 자료.전통의학 기반 진료를 수행하는 지역 내 한의의료기관 현황을 파악할 수 있으며, 보건의료 서비스 분포 분석, 의료 접근성 향상 및 지역 건강관리 정책 수립 등에 활용됨.활용 목적 및 특징– 지역 내 한의원의 분포 및 종별(개원/의료법인 등) 현황 파악– 전통의학 기반 진료기관 정보 제공으로 의료서비스 선택권 확대– 우편번호 기반 공간 분석 및 주소 체계 정비 자료로 활용– 지역 보건의료 인프라 현황 진단 및 정책 수립 기초자료 제공주요 항목 설명● 의료기관명: 한의원의 명칭● 의료기관종별: 의료기관 업종 형태에 따른 분류● 우편번호: 도로명 주소 기준 우편번호● 도로명주소: 한의원이 위치한 도로명 주소● 전화번호: 진료 문의 등을 위한 대표 전화번호'
