description_portal: '안마시술소(안마원)의 업종 구분, 명칭, 소재지, 우편번호, 전화번호 등을 정리한 자료.의료유사업소에 해당하는 안마시설의 운영 현황을 파악할 수 있으며, 위생관리, 고령자 건강복지, 관내 유사의료업소 지도·점검 등 보건행정의 기초자료로 활용됨.활용 목적 및 특징– 안마원 소재지 및 운영 현황 분석을 통한 관리 대상 파악– 관내 의료유사업소의 분포 및 종별 현황 진단 가능– 민원 대응, 위생점검, 시설 지도계획 수립을 위한 자료로 활용– 고령자, 만성질환자 등 대상 건강복지서비스 연계 기반 마련주요 항목 설명● 종별: 안마시술소의 업종 구분● 의료유사업소명: 해당 업소의 명칭● 사업장소재지(도로명): 업소의 도로명 주소● 사업장우편번호(도로명): 도로명 주소 기준 우편번호● 사업장전화번호: 업소 대표 전화번호'
