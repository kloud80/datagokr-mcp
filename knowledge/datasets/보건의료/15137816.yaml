description_portal: 본 데이터는 한국보건산업진흥원이 수집·관리하는 외국인환자 유치 현황 중 국가별 유치 실적과 특성을 정리한 통계자료이다. 국가별 외국인환자 수, 주요 진료과목, 체류기간, 유치경로 등 항목을 포함하며, 연도별 변화를 통해 국가 간 비교 분석이 가능하다. 본 자료는 의료관광 정책 수립, 해외 유치 전략 설계, 국가별 맞춤형 마케팅 등 다양한 분야에 활용된다. 외국인환자의 의료수요와 유입 특성을 실증적으로 파악할 수 있으며, 보건의료산업의 국제 경쟁력 강화에도 기여한다. 해당 데이터는 표준화된 구조로 제공되며, 매년 갱신되어 최신성과 활용성을 유지한다. 공공기관, 연구기관, 산업계에서 의료시장 분석과 정책 기획의 근거자료로 폭넓게 사용된다.
