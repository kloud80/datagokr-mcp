summary_user: 대구광역시가 지정·운영하는 공공심야약국을 약국 한 곳당 한 행으로 담은 파일로, 구군·약국명·주소·전화·운영시간을 담는다(885바이트 CSV의 소규모 목록). 대구 시민이 밤늦게 약이 필요할 때 '지금 우리 구에서 문 연 공공심야약국이 어디이고 몇 시까지 하나'를 찾는 데 쓴다. 전역 조인 키나 기관 코드가 없어 다른 약국·의료기관 데이터와는 약국명·주소를 문자열로 맞춰 잇거나 구군 이름으로 묶어 써야 한다.
description_portal: 대구시는 시민들의 야간 약품 구입 불편을 해소하고자 ‘공공심야약국’을 지정·운영하고 있습니다. 이 정책은 평일 및 공휴일 심야시간대 약국을 운영해 응급 상황이나 경미한 질병에 대비할 수 있도록 돕습니다. 또한 약사와의 상담을 통해 약물 오남용 예방 및 약화사고를 예방할 수 있습니다. 공공심야약국 데이터에는 약국명, 주소, 운영시간 등의 정보가 포함되어 있어 시민들이 가까운 공공심야약국을 쉽게 찾을 수 있습니다. 이러한 공공데이터는 대구시청 홈페이지 또는 공공데이터포털(data.go.kr)을 통해 제공됩니다.
