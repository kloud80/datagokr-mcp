description_portal: 감염병 예방 및 위생관리를 위해 각 지자체에 등록된 소독업소에 대한 정보를 포함하는 자료입니다. 본 데이터는 방역·소독 관련 민간 영업소의 지역별 분포와 행정현황을 파악하고, 감염병 대응, 위생관리 정책 수립, 민원처리, 지도점검 등의 행정업무에 활용될 수 있습니다.본 자료는 공중위생관리법 및 관련 지침에 따라 등록된 업소 정보를 기반으로 하며, 데이터가 많을 경우 엑셀 또는 일반 문서 뷰어에서 일부 정보가 누락될 수 있으므로 분석 전용 소프트웨어(R, Python 등)의 사용을 권장합니다.항목에 대한 상세한 정보는 제공기관의 메타데이터 설명서나 공공데이터포털의 기술문서를 참고하시기 바랍니다.
