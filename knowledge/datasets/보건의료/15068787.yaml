summary_user: 보건소 모바일 헬스케어 사업 참여자가 보건소를 처음 방문해 받은 영양상담·운동상담·건강상담 내용을 비식별 사용자 단위로 담은 전국 범위의 건별 원천 파일(csv, 약 426KB)이다. 분석가가 "건강위험군이 첫 상담에서 어떤 영양·운동·생활습관 조언을 주로 받는가"를 텍스트로 살펴보거나 상담 내용 유형을 분류할 때 쓴다. 전역 조인 키가 없고 비식별 사용자 번호만 있어 보건소코드·시군구코드로 지역 건강지표와 잇지 못하며, 같은 기관이 낸 다른 모바일 헬스케어 파일과 사용자 번호로만 연결을 시도해 볼 수 있다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.보건소 모바일 헬스케어 사업 중 서비스 참여 대상자가 보건소에 최소 방문하여 상담받은 데이터로서 영양상담, 운동상담, 건강상담, 상담 메모 내용입니다.
