description_portal: 본 데이터는 안양시 관내 심폐소생 자동제세동기(AED) 설치 현황 정보를 제공합니다. 응급 상황 발생 시 시민의 생명을 보호하고 골든타임 확보에 기여하며, 심정지 환자의 소생률을 높이는 목적으로 수집되었습니다. 세부 항목으로 각 AED의 설치기관명, 소재지 도로명 주소, 전화번호, 데이터 관리부서, 데이터 기준일자 정보가 포함됩니다. 안양시 내 AED 설치 장소를 파악하여 위급 상황 발생 시 신속한 위치 확인과 활용을 가능하게 합니다. 시민 안전망을 강화하고 응급 의료 체계를 효율적으로 운영하는 데 활용될 것으로 기대합니다.
