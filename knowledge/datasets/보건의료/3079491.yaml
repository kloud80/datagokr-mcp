summary_user: 안양시 관내에 설치된 심폐소생 자동제세동기(AED)를 설치기관 단위로 한 건씩 담은 파일로, 설치기관명·도로명 주소·전화번호·관리부서·기준일자를 담는다(CSV 약 37KB). 시민이나 시설 관리자가 '우리 동네·근처 건물 중 AED가 있는 곳은 어디인가'를 확인하거나, 분석가가 안양시 내 AED 설치 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소를 지오코딩해 위치로 맞추거나 설치기관명을 이름 매칭하는 방식으로만 이어 쓴다.
limits: 범위가 안양시 한 곳뿐이라 다른 시군구나 전국 AED 현황은 알 수 없고, 의료기관 식별자(hpid)나 좌표 같은 공통 키가 실측 컬럼에 없어 응급의료기관 데이터와 바로 결합되지 않는다. 실시간 정보가 아닌 기준일자 시점의 설치 현황 파일이다.
