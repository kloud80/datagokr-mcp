description_portal: '인천광역시가 제공하는 수의사 통계 현황 공공데이터는 2017년부터 2019년까지 관내에 등록된 수의사의 수를 성별(남/여) 및 직업별로 세분화하여 집계한 통계 자료입니다. 이 데이터는 지역 동물 보건 의료 인력의 구조와 변화 추이를 구체적으로 파악하고, 수의 분야의 인력 수급 계획, 공중 보건 기여, 동물 복지 증진 정책 수립에 필수적인 기초 자료로 활용되는 것을 목적으로 합니다.<주요 구성 항목은 다음과 같습니다>*통계 연도: 2017년부터 2019년까지의 연도별 데이터를 제공합니다.*성별 구분: 수의사를 남성과 여성으로 구분하여 인원수를 제공합니다.*직업별 구분: 수의사의 주요 활동 분야를 세분화합니다.-행정: 시·군·구 등 공공기관에 종사하는 수의사입니다.-연구: 연구기관에 종사하는 수의사입니다.-공수의: 공중방역수의사 등 특수 직역 인원입니다.-개업수의: 동물병원 등을 개설하여 운영하는 수의사입니다.-학교: 교육기관에 종사하는 수의사입니다.-기타: 위 분류에 해당하지 않는 수의사 인원입니다.'
