description_portal: 식품의약품안전처 「장애인 의약품 안전사용 정보(음성·수어영상)」 OpenAPI는 장애인이 의약품을 안전하게 사용할 수 있도록 돕는 영상정보를 제공하는 공공데이터입니다. 주요 제공 항목에는 품목일련번호, 품목명, 표준코드, 업소명, 동영상 파일경로 등이 포함되어 있습니다. 이 데이터를 통해 장애인 대상 의약품 사용 안내의 접근성을 높이는 데 활용될 수 있으며, 의료기관과 약국은 의약품 복용법 안내 자료로, 복지기관과 서비스 개발자는 안전사용을 위한 영상 기반 정보 제공 서비스에 활용할 수 있습니다.
