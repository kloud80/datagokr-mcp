summary_user: 의약품 품목별로 장애인용 안전사용 안내 영상(음성·수어)의 파일 경로를 품목일련번호·품목명·표준코드·업소명과 함께 담은 전국 범위의 건별 OpenAPI입니다. 약국·복지기관·서비스 개발자가 '이 약의 복용법을 수어나 음성 영상으로 안내할 수 있는가'를 확인하고 해당 영상을 서비스에 연결하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 품목일련번호(ITEM_SEQ)나 의약품 표준코드(STD_CD), 품목명을 기준으로 식약처 허가정보·e약은요나 심평원 약가 목록과 이름·코드 매핑으로 이어 쓴다.
limits: 전역 조인 키가 확인되지 않아 다른 데이터와는 품목명·코드 매핑으로만 연결되며, 매핑 결과는 별도로 검증해야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓰지 못하고, 개발계정 호출은 하루 10,000회로 제한된다.
