description_portal: '- 미래 세대 흡연예방 사업 추진을 위해 교육 현장 인력의 역량 강화가 필수적이며, 온라인 금연교육과정을 통해 지속 가능한 금연실천 환경을 조성- 표준화된 교육을 통한 국가 금연지원 서비스 품질 제고 및 국가 금연정책 지원 사업의 효율적인 운영 도모- 시·공간 제약 없는 다양한 교육 기회 제공에 대한 요구 및 안정적 온라인 교육 환경 조성과 운영의 필요성 대두- 유아 흡연위해예방, 학교 흡연예방사업, 금연전문가 과정 등 세분화된 온라인 교육과정 제공- 교육 참여자 관리(이수 현황, 만족도 조사 등)를 통한 운영 성과 관리 및 향후 교육과정 개선 방향성 도출'
