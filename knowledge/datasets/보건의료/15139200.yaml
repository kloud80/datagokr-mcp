summary_user: 노인장기요양기관 중 복지용구 급여로 지정된 기관의 신규 지정 수, 폐업 수, 전월 누적 기준 지정기관 수를 전국 시도·시군구별, 연월별로 집계한 파일이다(포털 설명상 2008년 5월~2024년 10월, 시트 3개). 복지용구 사업자나 지자체·분석가가 '우리 시군구에 복지용구 업체가 해마다 얼마나 새로 생기고 문을 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 기관코드나 행정구역코드 같은 전역 조인 키가 없어, 다른 장기요양·인구 통계와는 시군구 이름을 맞춰서만 이어 쓴다.
description_portal: '<데이터 수치값 오류가 발견되어 수정 파일 업로드합니다._2024.11.13.>1. 발췌기준 연월: 2008년 5월 ~ 2024년 10월2. 지역: 전국시도 및 시군구3. 노인장기요양기관 중 급여종류가 복지용구로 지정된 기관 -(시트1) 연월별 시군구별 신규 지정기관-(시트2) 연월별 시군구별 폐업기관-(시트3) 연월별 시군구별 신규 지정기관 - 폐업기관 + 전월기준 누적 지정기관(단순 합계)* 전국 지자체(행복e음) 자료 연계로 변동 있을 수 있음※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격, 징수, 급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
