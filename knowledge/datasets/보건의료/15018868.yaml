summary_user: 국립암센터가 보유한 호스피스완화의료 전문기관 목록을 기관 한 곳당 한 행으로 담은 전국 단위 파일(csv, 약 8KB)로, 기관명·기관종류·지역·우편번호·주소·문의전화가 들어 있다. 환자 가족이 '우리 지역에서 호스피스 진료를 받을 수 있는 병원과 연락처는 어디인가'를 찾거나, 분석가가 지역별 호스피스 전문기관 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 기관명이나 주소를 맞춰 연결해야 한다.
description_portal: 이 데이터는 국립암센터에서 보유하는 호스피스완화의료 전문기관에 대한 지역별 병원 목록 리스트로 호스피스 완화의료, 전문기관 병원 리스트를 제공하고 있습니다.기관명, 소재지, 연락처, 제공 서비스 유형(입원형, 가정형, 자문형 등) 등의 정보를 담고 있어, 호스피스 완화의료 서비스의 접근성과 분포를 파악하는 데 유용합니다. 해당 데이터는 보건의료 정책 수립, 서비스 제공 기관의 현황 분석, 국민의 의료 서비스 이용 안내 등 다양한 분야에서 활용될 수 있습니다. 또한, 호스피스 완화의료 서비스의 질 향상과 지역 간 균형 있는 서비스 제공을 위한 기초 자료로 사용됩니다.
