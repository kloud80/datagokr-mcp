summary_user: 경기도의료원이 운영하는 공공의료 치과사업인 행복치아만들기사업의 실적을 병원별·연월별로 집계한 자료로, 진료년월, 병원명, 진료실적(연인원), 지원금액을 담는다. 보건정책 분석가가 "경기도의료원 산하 병원별로 노인·취약계층 치과 치료비 지원 인원과 금액이 해마다 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원명(HOSPTL_NM) 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 경기도의료원에서 제공하는 공공의료사업인 행복치아만들기사업의 실적 현황입니다. 연월별 진료인원, 지원금액 등에 대한 정보를 제공합니다.이 데이터는 경기도에서 시행하는 공공의료 치과사업 중 하나인 '행복치아만들기사업'의 병원별 월별 실적을 집계한 자료입니다. 항목에는 진료가 이뤄진 년월, 병원명, 진료실적(연인원), 지원금액이 포함되어 있으며, 이는 주로 노인 및 취약계층을 대상으로 한 치과 치료비 지원 내역을 의미합니다. 본 데이터는 공공의료를 통한 구강건강 향상 효과 분석, 예산 투입 대비 지원 성과 평가, 병원별 집행 실적 모니터링 등 다양한 보건의료정책 평가에 활용될 수 있습니다. 특히 지역 간 진료 접근성 격차나 연도별 지원금 추이를 비교하는 데에도 유용한 기초자료입니다.
