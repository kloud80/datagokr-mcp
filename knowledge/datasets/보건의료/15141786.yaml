summary_user: 서울 용산구 관내 치과기공소를 사업장 한 곳당 한 행으로 담은 인허가 원천 데이터로, 사업장명·주소·전화, 인허가·폐업 일자, 영업상태와 함께 기공용 장비(전기로, 주조기 등) 보유 수량을 담는다. 치과기공소 개설·폐업 흐름을 보려는 분석가나 사업자가 '용산구에서 지금 영업 중인 치과기공소는 어디이고 언제 문을 열었나' 같은 질문에 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했다. 다른 자치구 LOCALDATA 인허가 자료와는 같은 기관 코드(OPNSFTEAMCODE)·관리번호나 사업장명·주소 매칭으로만 이어 쓴다.
description_portal: 서울특별시 용산구에 소재한 치과기공소의 인허가 현황과 관련된 다양한 행정 정보를 제공합니다. 이 데이터에는 치과기공소의 사업장명, 소재지 주소, 전화번호와 같은 기본 정보뿐만 아니라, 인허가를 받은 신고·허가 일자, 현재 영업 중인지 여부를 나타내는 영업상태 구분, 영업을 종료한 경우의 폐업일자 등이 포함됩니다. 또한 변경신고 이력, 업종 구분, 인허가 관할 기관 등 행정관리와 관련된 세부 사항을 함께 제공하여 관내 치과기공소 운영 현황을 종합적으로 파악할 수 있습니다. 이를 통해 시민, 사업자, 행정기관이 치과기공소의 개설·변경·폐업 흐름을 쉽게 확인하고, 의료기사법 및 관련 규정 준수 여부를 모니터링하는 데 활용할 수 있습니다. 이 자료는 공공데이터 포털을 통해 주기적으로 갱신되며, 용산구 보건소에서 관리합니다.
