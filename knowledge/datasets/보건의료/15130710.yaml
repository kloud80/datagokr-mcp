summary_user: 경상남도 거제시에 있는 요양병원을 한 곳당 한 행으로 담은 목록 파일로, 의료기관명·대표자명·도로명주소·전화번호·위도·경도와 데이터기준일자를 담는다(파일 크기 376바이트로 소수 기관 규모). 거제시 주민이나 보호자가 '집 가까운 요양병원이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시내 요양병원 분포와 접근성을 지도로 볼 때 쓴다. 공통 조인 키는 없어 다른 데이터와는 의료기관명·주소 문자열 매칭이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경상남도 거제시에 위치한 요양병원의 현황을 수록한 공공데이터입니다. 각 요양병원의 이름, 소재지 도로명주소, 지번주소, 위도 및 경도 좌표, 연락처 등의 정보를 포함하고 있으며,  노인·만성질환자 대상 의료 인프라의 분포를 확인하는 데 유용합니다. 이를 통해 시민들은 가까운 요양병원 위치를 쉽게 찾을 수 있고, 행정기관은 지역 내 의료시설 접근성과 의료복지 수요 분석에 활용할 수 있습니다. 또한, 고령사회 대응과 의료복지 정책 수립을 위한 기초자료로 활용됩니다. 또한, 고령화 사회에 대응한 지역별 요양 의료서비스 현황을 파악하고, 의료복지 자원 배치의 자료로 활용될 수 있습니다.
