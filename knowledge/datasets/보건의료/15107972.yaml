description_portal: 대구광역시 달서구 내 수술실을 보유한 의료기관에 관한 데이터를 제공하여 1년마다 주기에 따라 업데이트합니다.아래 컬럼을 참고하시길 바랍니다.위도, 경도, 순번, 의료기관명, 의료기관종별, 의료기관주소(도로명), 수술실 병실수, 병상수, 진료과목, 관리부서, 기준일자 등으로 구성되어있습니다.개방데이터를 공유함으로써 병원의 위치, 수술실 병실수, 수술실 병상수가 나오며 가장 가까운 의료시설을 신속히 확인할 수 있습니다. 진료과목이 어떻게 진행되는지에 관한(내과, 신경과, 외과, 정형외과, 신경외과, 마취통증의학과, 산부인과 등) 정보를 통해 참고자료로 확인 가능합니다.
