summary_user: 대구광역시 달서구에서 수술실을 보유한 의료기관을 기관별로 한 행씩 담은 파일로, 의료기관명·종별·도로명주소·위도경도와 수술실 병실수·병상수, 진료과목, 기준일자가 들어 있으며 범위는 달서구 한 시군구입니다. 주민이나 분석가가 '달서구에서 수술실을 갖춘 가까운 병원은 어디이고 수술실 규모와 진료과목은 어떤가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 의료기관 데이터와는 의료기관명·주소를 맞추거나 좌표(위도·경도)로 공간 결합해 이어 쓴다.
