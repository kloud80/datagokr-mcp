summary_user: 대구광역시 수성구 관내에서 의약품·의약외품을 공급하는 업체를 업소 단위로 정리한 목록으로, 업종·업소명·소재지·연락처를 담는다(csv 파일 약 7KB). 약국이나 의료기관 관계자, 지역 보건 담당자가 '수성구에 있는 의약품 도매·공급업체는 어디이고 연락처는 무엇인가'를 확인하거나 업체 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 소재지 주소를 매칭하는 방식으로만 이어 쓴다.
