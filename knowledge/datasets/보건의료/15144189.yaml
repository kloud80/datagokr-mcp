summary_user: 2025년 1월 21일 기준으로 금연치료 사업에 참여 신청했고 교육을 이수한 의료인이 1명 이상 있는 전국 의료기관을 기관별 1행으로 담은 파일 데이터이며, 검증 때 15,222행을 받았다. 금연을 원하는 국민이 사는 지역(시도·시군구)에서 금연상담·치료를 받을 수 있는 병·의원을 찾는 질문에 쓴다. 주소(address)를 키로 다른 의료기관 인허가·공공보건 데이터와 이어 쓸 수 있고, 시도명·시군구명으로 지역별 집계도 가능하다.
description_portal: '1. 발췌기준: 금연치료 의료기관으로 참여신청하고, 금연치료 의료인 교육을 이수한 의료인이 1명 이상 근무하는 의료기관2. 발췌기준일자: 2025.1.21.이 데이터는 2025년 1월 21일 기준, 금연치료사업에 참여 신청한 의료기관 중 금연치료 관련 교육을 이수한 의료인이 1인 이상 상주하고 있는 전국의 의료기관 현황을 발췌한 것입니다. 국민건강보험공단의 기준에 따라 금연치료 서비스 제공 요건을 충족한 기관만 포함되며, 금연상담 및 치료를 받을 수 있는 실제 운영 의료기관 정보를 담고 있습니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
