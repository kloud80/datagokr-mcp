description_portal: '○ 통계개요* 통계명 : 의료기관 (구별)* 통계종류 : 서울시 의료기관 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「의료법」제3조에 의한 의료기관 현황* 작성목적 : 우리나라의 의료기관 종류와 의료인력의 분포 등에 관한 사항을파악하여 의료관련 정책수립의 기초자료로 활용하는 것을목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 보건의료정책과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 의료기관(종합병원, 병원, 의원 등)병원수 및 병상수 현황○ 용어설명* 의료기관 : 의료법 제3조에 의거 의료인이 공중 또는 특정한 다수인을 위하여의료ㆍ조산의업을 행하는 곳'
