summary_user: 동작구 보건소가 보건증 검사업무를 중단하면서 동작구와 인근 지역에서 보건증을 발급하는 민간 의료기관을 기관별로 정리한 소규모 목록 파일(csv 약 1.3KB)로, 자치구·병원명·전화번호·위치·주소를 담는다. 음식점 창업자나 아르바이트 지원자처럼 보건증이 필요한 주민이 "동작구 근처 어느 병원에서 보건증을 받을 수 있나"를 찾을 때 쓴다. 전역 조인 키나 기관 코드가 없어, 다른 데이터와는 병원명·주소를 문자열로 맞춰 의료기관 인허가(LOCALDATA) 같은 자료와 연결한다.
description_portal: 서울특별시 동작구 보건소의 보건증 검사업무 중단에 따라 동작구 및 동작구 인근의 보건증 발급 의료기관 현황입니다. 의료기관 현황은 단순 정보제공 목적으로 게시하였으며, 상황에 따라 비용 및 운영업무가 변동될 수 있으므로 위 기관 방문 전 반드시 전화문의 후 내방하시기 바랍니다.
