summary_user: 서울특별시 중구에 소재한 치과기공소의 개설신고·운영 현황을 업소 한 곳당 한 행으로 담는 인허가 원천 데이터로, 관리번호, 인허가·폐업 일자, 영업 상태, 지번·도로명 주소, 중부원점TM 좌표(X·Y), 기공용 장비 보유 수량 등을 포함한다. 치과기공 업계 종사자가 '중구에서 지금 영업 중인 치과기공소는 몇 곳이고 어디에 몰려 있으며 최근 개폐업은 어떤가'를 확인하거나, 시민이 보철물 제작 업소의 신고 여부를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 공통 인허가 형식의 다른 의료기관 인허가 데이터와 나란히 개폐업 흐름을 비교하는 데 쓴다.
description_portal: '본 데이터는 서울특별시 중구 내에 소재하며 치과 진료에 필요한 보철물제작 등 기공 업무를 수행하는 업소의 개설신고 및 운영 현황을 종합적으로 담고 있습니다. 각 등록업체에 대한 관리번호, 현재 영업 상태(영업/폐업), 상세 소재지 등의 필수 항목들로 구성되어 있습니다. 이 자료는 보철물제작 관련 산업에 종사하는 전문가들에게는 중구 지역의 산업 분포와 시장 경쟁 현황 분석을 위한 기초 자료로 활용될 수 있습니다. 또한, 시민들에게는 치과에서 의뢰하는 보철물의 제작 및 심미보철 업무가 법적 기준을 충족하는 시설에서 위생관리 하에 안전하게 이루어지는지 확인할 수 있는 투명한 정보를 제공합니다. 본 데이터를 공공데이터포털을 통해 개방함으로써 치과 기공 분야의 공중 보건 수준을 유지하고, 구민의 구강건강 증진에 기여하고자 합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
