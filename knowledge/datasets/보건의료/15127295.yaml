summary_user: 주상병코드 Q612(보통염색체우성 다낭성 신장)로 진료받은 건강보험 급여실적을 2018~2022년 월별·시도(수진자 주민등록 주소지)·요양기관종별로 집계한 파일로, 진료인원·진료건수·진료비(천원)를 담는다. 환자단체·의료정책 분석가가 '다낭성신장병 환자가 어느 시도에 많고, 상급종합병원과 의원 중 어디서 주로 진료받으며 진료비가 해마다 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 질병·지역 통계와는 시도명·진료년월·요양기관종별 이름을 맞춰 연결해야 하며, 같은 지표라도 심평원 청구 기준 통계와는 값이 다르다.
description_portal: '1. 진료년도 및 진료월: 2018~2022년 각 월, 진료일기준2. 수진자 주소지: 시도단위, 주민등록주소지 기준3. 요양기관종별: 상급종합병원, 종합병원, 병원, 의원, 요양병원, 보건소, 보건의료원(병원화보건소)4. 진료인원, 진료건수 및 진료비 - 주상병코드 Q612(다낭성 신장, 보통염색체우성)로 진료받은 건강보험 급여실적(의료급여 제외)이며    한의분류 및 약국 제외, 비급여 제외 - 2023년 6월 지급분까지 반영 - 개인정보 보호를 위해 시군구 단위의 5인 미만 자료는 "*" 처리 ※ 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라   일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
