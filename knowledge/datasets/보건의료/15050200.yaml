summary_user: 관세청 수입통계를 바탕으로 맥주·포도주·위스키·보드카·소주·고량주 등 HS 품목 기준 주종별 수입 주류 출고량을 연도별로 정리한 전국 단위 집계표이며, 주종별 값과 주류수입합계를 담는다(약 2.7KB CSV 파일). 음주폐해예방·절주 정책 담당자나 연구자가 "수입 맥주나 와인 출고가 해마다 어떻게 늘거나 줄었는가" 같은 수입 주류 소비 동향을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 같은 기관의 국내 주류 출고현황 등 절주 지표와 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 음주폐해예방 관련 지표- 관세청에서 제공하는 수입통계자료를 바탕으로, 주요 주류의 수입분 출고 현황을 보여주는 것입니다. - HS 품목번호에 따른 분류 기준으로 산출되며, 맥주, 와인, 위스키, 브랜디, 리큐르 등 주요 주종이 포함됩니다. - 2019년도에는 기타 리큐르(HS2208.70.2000) 통계가 미발표되어 해당 연도의 수치는 제시되지 않습니다.- 본 데이터는 음주폐해예방 및 절주문화 조성을 위한 정책 수립 및 연구 수행 시 국외 수입 주류의 출고현황 등에 대한 동향을 확인할 수 있는 자료입니다.
