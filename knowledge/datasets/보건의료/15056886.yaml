summary_user: 식약처에 보고된 의약품 공급부족 건을 품목별로 담은 전국 단위 API로, 업체명·품목명과 함께 공급부족 발생 예상일, 부족 사유, 자사 재고량과 기준일, 환자 치료 영향, 공급 정상화 계획과 예상일을 제공한다. 약국·의료기관이나 제약·유통 담당자가 '이 약이 지금 공급부족 상태인지, 언제 정상화될 예정인지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업체명·품목명 같은 이름 매핑으로만 연결하며, 식약처 품목기준코드나 의약품 표준코드로 심평원 약가·급여 목록과 바로 잇기는 어렵다.
description_portal: 식품의약품안전처 「의약품공급부족 정보」 OpenAPI는 국내 의약품의 공급 부족 상황에 대한 정보를 제공하는 공공데이터입니다. 주요 제공항목에는 업체명, 품목명, 공급부족발생예상일자, 공급부족사유, 마지막생산수입공급일자, 자사재고량기준일, 자사재고량, 환자치료에미치는영향, 공급정상화추진계획, 공급정상화예상일자 등의 내용이 포함되어 있습니다. 이를 통해  특정 의약품의  수급 불균형 상황을 파악할 수 있고, 제약사와 유통사는 공급 부족 발생 시기를 확인하여 향후 공급 안정화 방안을 마련하는 근거 자료로 활용할 수 있습니다.
