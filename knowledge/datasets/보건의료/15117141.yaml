summary_user: 식약처가 행정처분을 내린 의료기기 제조·수입업체를 처분 건별로 담은 전국 단위 API로, 업체명·업종·위반일자·적발내용·처분사유·처분내용·처분 적용 기간·근거법령·처분부서가 들어 있다. 의료기기 거래처를 고르는 병원·유통사나 규제 동향을 보는 분석가가 '이 업체가 최근 어떤 위반으로 몇 달 업무정지를 받았나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 업체명 매칭이나 사업자등록번호(BRNO)를 통해 의료기기 품목허가·업체 정보 등 다른 식약처 데이터와 이어 쓴다.
description_portal: 본 공공데이터는 행정처분이 이루어진 의료기기 제조·수입업체에 대한 세부적인 데이터를 제공하고 있습니다.식품의약품안전처에서 관리하는 의료기기 행정처분에 대한 대상구분, 업체명, 업종, 위반일자, 적발내용, 처분부서, 처분사유, 처분내용, 처분시작일, 처분종료일, 위반 및 처분법령, 처분양령 등의 데이터가 포함됩니다. 이를 통해 행정처분이 이루어진 제조·수입업체의 위반내용과 처분양령 등을 확인할 수 있으며, 향후 행정처분에 대한 처분사례를 확인하여 그에 대한 활용효과를 기대 할 수 있습니다.
