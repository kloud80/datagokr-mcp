summary_user: 부산광역시 기장군 관내 보건소·보건지소·보건진료소를 기관 한 곳당 한 행으로 담은 개별 시설 목록 파일로, 기관명·도로명/지번 주소·건축물 면적·구조·담당업무·전화번호를 포함한다(csv 약 1KB의 소규모 파일). 기장군 주민이 "우리 동네에서 가장 가까운 보건 기관은 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 읍·면별 보건 기관 배치와 시설 규모를 비교하는 데 쓴다. 공통 조인 키(기관코드·시군구코드)는 없으므로 다른 데이터와는 기관명이나 주소를 지오코딩해 이름·위치 기준으로 맞춰 이어 쓴다.
description_portal: 보건소 설치·운영 현황은 부산광역시 기장군 관내 보건소, 보건지소 및 보건진료소를 대상으로 한 데이터입니다.(본 데이터는 「지역보건법」 제7조 및 같은 법 시행령에 따른 보건소·보건지소·보건진료소의 설치 및 운영 현황 관리 업무 수행을 위해 구축된 자료입니다.)* 데이터 활용방안1. 맞춤형 보건 서비스 안내 가이드 제작2. 위치 기반 우리 동네 보건소 지도 (공간정보 시각화)(예시)"소재지도로명주소" 정보를 활용하여 지도 위에 시각화할 수 있습니다.기장읍(본소), 정관읍(지소), 철마면(지소/진료소), 장안읍(진료소) 등 지역별 의료 공백을 파악하고, 거주지에서 가장 가까운 보건 기관을 찾는 "보건 지도" 서비스를 만들 수 있습니다.3. 보건 기관 규모 및 인프라 분석4. 비상 연락처 및 민원 대응 디렉토리
