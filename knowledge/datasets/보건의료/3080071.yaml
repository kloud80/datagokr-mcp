description_portal: 은평구 관내 안경업소 현황입니다. 속성은 번호, 안경업소명칭,사업장소재지(도로명), 사업장전화번호로 구성되어있습니다.본 데이터는 지역 내 안경업소의 업소명, 소재지 등을 포함합니다.  시력보조기구를 제공하는 주요 생활밀착형 서비스 업종으로서,  안경 관련 위생 및 안전관리, 소비자 정보 제공, 공공의료 연계 등의 기초 자료로 활용됩니다.  고령화, 근시화 사회에서 안경업은 지속 확대 중인 분야이며,  시각 장애 예방, 보건소 시력검진과의 연계 행정에도 유용합니다.  또한 민원처리, 업종 지도점검, 지역 서비스균형 확보 등에 활용할 수 있습니다.
