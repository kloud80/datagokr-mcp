description_portal: '1. 수가코드(행위코드_건강보험행위분류): E6544(심전도침상감시[1일당]), E6545(심전도감시-24시간홀터기록), E6556(심전도감시-홀터기록-48시간 초과 7일 이내)2. 진료년도: 2024년3. 주상병코드 및 주상병명: A~Z (시트1) 3단 상병, (시트2) 4단 상병 구분4. 진료인원 및 진료건수: 해당 구분별 진료인원(중복제외) 및 건수5. 수가금액: 해당 수가에 대한 종별가산 적용금액- 진료일 기준(한의분류 제외, 약국 제외)- 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외- 2024년 6월 심사분까지 반영- 요양기관에서 환자 진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라 일차진단명을 부여하고 청구한 내역 중  주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터(시트2 추가하여 변경)개인정보 보호를 위해 5인 미만 또는 5개 미만의 건수는 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
