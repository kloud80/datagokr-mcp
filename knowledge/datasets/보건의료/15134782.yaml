summary_user: 심전도 침상감시(1일당), 24시간 홀터기록, 48시간 초과 7일 이내 홀터기록 세 가지 수가코드에 대해 2024년 진료분의 진료인원·진료건수·수가금액(천원)을 주상병(3단·4단 상병 시트 구분)별로 묶은 전국 단위 집계 파일이다. 의료 분석가나 의료기기·병원 사업자가 '홀터 검사가 어떤 진단명으로 가장 많이 청구되는가'처럼 심전도 감시 행위의 상병별 이용 규모와 급여 금액을 볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 주상병코드를 질병분류(KCD) 코드표와, 행위코드를 건강보험 행위 수가 목록과 코드 매핑해 이어 쓴다.
limits: 건강보험 급여실적만 담아 의료급여·비급여·한의·약국은 빠지고, 2024년 6월 심사분까지만 반영된다. 주상병은 청구 시 부여된 일차진단명 기준이라 최종 확정 질병과 다를 수 있고, 5인·5건 미만은 '*'로 가려져 합계 계산에 주의해야 한다. 지역·기관 단위 구분 없이 전국 집계만 있다.
