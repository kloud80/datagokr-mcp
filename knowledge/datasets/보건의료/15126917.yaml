summary_user: 강원·경북 일부 시군(동해·태백·삼척·영월·정선·안동·영주·영양·봉화·울진)을 대상으로 2013년과 2022년의 상급종합병원·종합병원 입원 진료인원을 주상병 그룹별로 관내와 관외로 나눈 집계 파일이며, 수진자 주소지 기준과 요양기관 주소지 기준을 함께 담는다. 지역 보건의료 분석가나 지자체가 '우리 시군 주민은 특정 질환으로 입원할 때 지역 밖 대형병원으로 얼마나 나가는가'를 따질 때 쓴다. 전역 조인 키가 없어 다른 진료 통계와는 시도·시군구 이름과 주상병코드를 직접 맞춰 이어 써야 한다.
description_portal: '1. 주소지 구분: 수진자 주소지 기준, 요양기관 주소지 기준2. 진료년도: 2013년, 2022년(진료일기준)3. (시도) 강원도, 경상북도, (시군구) 동해시, 태백시, 삼척시, 영월군, 정선군, 안동시, 영주시, 영양군, 봉화군, 울진군4. 주상병코드: 그룹 구분 해당 파일 확인5. 상급종합병원 및 종합병원의 입원 진료인원이며 건강보험 급여실적(2023년 6월 심사분까지 반영)   - 의료급여 제외, 비급여 제외, 한의분류 제외6. 관내 진료인원: 수진자 주소지와 입원 진료받은 요양기관 주소지가 일치하는 경우   관외 진료인원: 수진자 주소지와 입원 진료받은 요양기관 주소지가 일치하지 않는 경우7. 개인정보 보호를 위해 시군구 단위의 5인 미만 자료는 "*" 처리 ※ 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
