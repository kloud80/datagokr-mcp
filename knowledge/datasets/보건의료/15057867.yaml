summary_user: 경기도 내 동물병원의 인허가 현황을 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·WGS84 좌표가 들어 있다. 반려동물 보호자나 분석가가 '우리 시군에 영업 중인 동물병원이 어디에 몇 곳 있고, 최근 개업·폐업이 늘었나'를 확인하는 데 쓰며, 병의원 개폐업처럼 상권 변화 신호로도 본다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·주소·좌표를 이름·코드로 맞추거나 공간 결합하는 방식으로만 잇는다.
description_portal: 이 데이터는 경기도 내 동물병원에 대한 인허가 현황을 정리한 자료로, 동물의 질병 예방과 치료를 위한 의료기관 정보를 제공합니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태, 주소(도로명 및 지번), 전화번호, 총 종업원 수, 업태구분명, 위치좌표(WGS84) 등이 포함됩니다. 본 자료는 반려동물 보건관리, 지역별 의료인프라 분석, 동물병원 분포 모니터링, 수의학 관련 정책 수립 및 공공서비스 접근성 향상 등을 위한 기초자료로 활용될 수 있습니다. Open API를 통해 시군 단위 혹은 전체 데이터를 요청할 수 있으며, 주간 단위로 갱신되어 최신 정보를 반영합니다.
