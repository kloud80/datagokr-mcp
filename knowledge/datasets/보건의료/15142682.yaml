summary_user: 서울특별시 마포구의 의원·보건소·한의원 등 의료기관을 사업장 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일자·영업상태·폐업일자·주소·전화번호·중부원점TM 좌표와 병상·진료과목 같은 시설 정보를 함께 제공한다. 주민이 집 근처에서 영업 중인 의원을 찾거나, 상권 분석가가 마포구 병의원의 개업·폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에는 다른 데이터와 바로 이을 전역 조인 키가 없어서, 같은 개방자치단체코드를 쓰는 LOCALDATA 인허가 데이터와 묶거나 사업장명·주소를 맞춰 연결해야 한다.
description_portal: '서울특별시 마포구의 의원, 보건소, 한의원 등 진료시설을 갖추고 환자를 대상으로 의사가 의료행위를 하는 의료기관 정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 의원을 관리하는 보건 부서나 기관의 정보도 함께 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
