summary_user: 서울 중구 관내 의료법인의 인허가 정보를 법인(사업장)별 한 건씩 담은 LOCALDATA 형식 원천 자료로, 사업장명(BPLCNM)·인허가일자·영업상태와 상세상태·폐업일자·지번/도로명 주소·전화번호·중부원점TM 좌표(X, Y)·병상 수·의료인 수·진료과목 등을 담는다. 주민이 중구 내 의료기관의 운영 주체와 영업·폐업 여부를 확인하거나, 분석가가 의료기관 개폐업을 상권 변화 신호로 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)·관리번호(MGTNO) 같은 기관 내 코드로만 이어 쓴다.
description_portal: '본 데이터는 서울특별시 중구 관내에서 의료법인으로 등록된 기관의 인허가 정보를 수록한 자료입니다. 수록 항목은 법인명, 대표자, 소재지, 인허가일자, 허가상태, 관리기관, 법인구분 등으로 구성되어 있으며, 지역 내 의료법인 운영 현황을 파악하는 데 활용됩니다. 해당 정보는 「의료법」에 따라 정식 허가를 받은 기관을 대상으로 하며, 의료서비스 제공의 적정성 및 행정 관리의 투명성을 높이기 위한 기초자료로 제공됩니다. 일반 시민은 지역 내 의료기관의 운영 주체를 확인할 수 있고, 정책 담당자나 의료 관련 기관은 보건의료정책 수립, 의료 인프라 개선 등에 본 자료를 참고할 수 있습니다. 데이터는 구조화된 형식으로 제공되어 재사용 및 분석이 용이하며, 다양한 보건 행정 분야에서 유용하게 활용될 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
