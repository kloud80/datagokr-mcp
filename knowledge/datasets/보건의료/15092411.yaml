description_portal: 국가금연지원서비스 실적 정보로 주차별 금연유지평가 수행 결과에 대한 데이터를 제공합니다.본 데이터에는 서비스 유형별 이용 현황, 금연상담 참여자 수, 흡연율 변화, 금연결심율, 금연성공률 등 주요 지표가 포함되며, 전국 보건소와 지역금연지원센터에서 수집·관리한 결과가 반영됩니다.본 데이터는 금연지원사업의 효과성을 검증하고, 지역별 맞춤형 금연정책 수립 및 상담서비스 개선을 위한 근거 자료로 활용될 수 있으며, 장기적으로는 흡연율 감소를 통한 국민 건강증진에 기여할 수 있습니다.
