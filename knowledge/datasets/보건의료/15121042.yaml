summary_user: 노인장기요양보험 복지용구의 상세품목코드별 최대 사용가능 개수(급여한도)와 급여 유효 시작·종료일, 급여 적용 여부를 담은 기준표로, 해당년도 급여가능 품목을 품목 단위로 정리한 전국 단위 코드 마스터이며 파일 크기는 758바이트로 작다. 장기요양 인정자나 복지용구 사업소가 '이 품목은 한 사람이 몇 개까지 급여로 받을 수 있나, 지금도 급여 적용 중인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 복지용구 상세품목코드나 품목명 매핑으로만 이어 붙일 수 있다.
limits: 품목별 한도 기준만 담고 개인별 사용 내역이나 제품·업체 정보는 없으며, 전역 조인 키가 없어 다른 데이터와 연결하려면 상세품목코드를 직접 매핑해야 한다. 유효종료일이 9999-12-31이면 종료일이 정해지지 않은 현재 유효 기준이라는 뜻이다.
