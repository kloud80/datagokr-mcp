description_portal: 인천광역시 10개 군구별 구강보건교육, 치아홈메우기, 치면세마, 불소도포, 불소용액양치 등의 보건소 구강보건사업 실적 현황에 대한 데이터입니다.보건소 구강보건사업은 지역주민의 구강 건강증진을 위해  치아와 잇몸 질환 예방 및 관리를 중심으로 실시하는 사업입니다. 보건소 구강보건사업의 주요 내용으로는 구강검진, 불소도포, 불소용액양치, 치면세마, 치아홈메우기 등 예방 처치와 올바른 칫솔직 교육과 같은 구강위생교육 등이 있습니다.사업의 궁극적 목표로는 지역사회의 구강건강 수준 향상과 구강질환 예방·관리, 구강관리에 대한 인식제고 및 건강한 구강습관 형성 등을 도모하여 삶의 질 향상을 도모합니다.(2026년 3월 기준 1분기 현황 작성)
