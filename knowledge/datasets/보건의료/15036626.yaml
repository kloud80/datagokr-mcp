summary_user: 경기도 김포시에 있는 약국을 한 곳당 한 행으로 담은 목록으로, 약국명칭·도로명 소재지·전화번호·데이터기준일자를 담는다(시군구 범위, CSV 약 14KB). 김포 시민이 집 근처 약국의 위치와 연락처를 찾거나, 분석가가 김포시 안의 약국 분포를 주소 단위로 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 약국명이나 도로명 주소를 맞춰 붙여야 하고, 좌표가 필요하면 주소를 지오코딩해야 한다.
