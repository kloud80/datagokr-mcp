summary_user: 코로나19 대응과 관련해 경기도에서 방역소독·위생관리·건물 청소·고독사 현장 정리 같은 공공서비스를 하는 사회적기업을 업체 한 곳당 한 행으로 담은 목록으로, 시군명·업체명·사업내용·사업분야·연락처·주소·위도경도를 포함한다. 지자체 담당자나 주민이 '우리 시군에서 방역소독을 맡길 수 있는 사회적기업은 어디인가'를 찾을 때 쓰고, 분석가가 시군별 사회적경제 조직의 방역 역할을 비교할 때 쓴다. 전역 조인 키는 없으므로 시군명(sigun_nm)이나 주소 문자열, 위도·경도 좌표로 다른 지역 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 코로나19 팬데믹 대응과 관련하여 경기도 내 방역, 위생, 청소 등의 공공서비스를 수행하는 사회적기업 목록으로, 지역별 사회적경제 조직의 역할을 분석할 수 있는 자료입니다. 주요 항목으로는 시군명, 업체명, 사업내용, 사업분야, 대표전화번호, 소재지 도로명주소 및 지번주소, 홈페이지, 위도·경도 등이 포함되어 있습니다. 기업들은 고독사 현장 정리, 방역소독, 위생관리, 건물 청소 등 다양한 활동을 수행하며, 다수는 사회적 목적 실현과 함께 감염병 확산 방지에 기여하고 있습니다. 이 데이터는 사회적경제 기반 지역 방역체계 구축, 취약계층 대상 공공서비스 제공, 위기 대응 인프라로서의 사회적기업 육성 정책 수립 등에 활용될 수 있습니다.
