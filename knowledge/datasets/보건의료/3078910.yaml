description_portal: 부산광역시 동래구(명장동, 안락동, 칠산동, 낙민동, 복천동, 수안동, 명륜동, 온천동, 사직동) 관내 약국 현황에 대한 데이터입니다.데이터 기준일자의 약국명, 약국소재지(도로명주소), 전화번호 등의 항목을 제공합니다.데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식 파일 데이터 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 동래구 내 약국 분포를 파악하여 보건 정책 수립이나 민간 서비스 개발 등에 활용 될 수 있으며, 지역 주민들이 가까운 약국을 쉽게 찾아, 의료 서비스 접근성 향상에 기여하며  필요한 서비스를 이용할 수 있도록 활용할 수 있습니다.약사법 제2조에 따르면 “약국”이란 약사나 한약사가 수여할 목적으로 의약품 조제 업무[약국제제(藥局製劑)를 포함한다]를 하는 장소(그 개설자가 의약품 판매업을 겸하는 경우에는 그 판매업에 필요한 장소를 포함한다)를 말한다.
