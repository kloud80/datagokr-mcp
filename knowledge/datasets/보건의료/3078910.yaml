summary_user: 부산 동래구 관내 약국을 한 곳당 한 행으로 담은 CSV 파일로, 약국명·도로명 소재지·전화번호를 개별 주소 단위로 제공한다(파일 크기 약 12KB). 동래구 주민이 집 근처 약국과 연락처를 찾거나, 분석가가 동 단위 약국 분포를 보며 보건 접근성을 따질 때 쓴다. 전역 조인 키가 없어 다른 약국·의료기관 데이터와는 약국명이나 도로명주소를 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
