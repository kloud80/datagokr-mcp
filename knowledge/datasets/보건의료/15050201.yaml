description_portal: 음주폐해예방 관련 지표- 국세청 국세통계연보를 바탕으로, 주요 주류의 국내분 출고 현황을 보여주는 것입니다. - 통계에는 미세금분이 포함되며 수입분은 제외됩니다. - 기타 주류에는 11개의 주요 주종 이외의 주류와 술로 직접 마시는 것이 아닌 조미용 주류가 포함되며, 예시로 가야곡왕주, 김천과하주, 한라산녹용주, 롯데 백화(요리주) 등이 있습니다. - 또한 총 출고량에는 주정(타 주류 제조나 식품 제조의 원료로 사용되는 부분)은 제외하여 산출합니다.- 본 데이터는 음주폐해예방 및 절주문화 조성을 위한 주류업계 동향 분석 등 연구 시 기초자료로 활용될 수 있습니다.
