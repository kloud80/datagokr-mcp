summary_user: "국세청 국세통계연보를 바탕으로 연도별 주요 주류의 국내분 출고량을 탁주·약주·청주·맥주·과실주·증류식소주·희석식소주·위스키·브랜디·일반증류주·리큐르·기타주류 등 주종별로 담은 전국 단위 집계 파일(csv, 약 1.6KB)이다. 절주·음주폐해예방 연구자나 정책 분석가가 '최근 몇 년간 맥주와 희석식소주 출고량이 어떻게 변했는가' 같은 주류 소비 추세를 살피는 데 쓴다. 전역 조인 키가 없어 연도를 기준으로 다른 음주 관련 통계(예: 지역사회 건강조사 음주율)와 나란히 놓고 비교하는 방식으로 이어 쓴다."
