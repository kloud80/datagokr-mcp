description_portal: '인천광역시가 제공하는 보건교육실적 (성인병 예방 및 관리 교육) 공공데이터는 관내 군/구별로 실시된 주요 성인병(만성질환) 예방 및 관리를 위한 교육의 참여 인원수를 집계한 통계 자료입니다. 이 데이터는 지역 보건 교육 사업의 효과와 확산 정도를 파악하고, 만성질환 관리 정책 수립, 교육 프로그램 개선, 지역 주민의 건강 증진 계획 등에 필수적인 기초 자료로 활용되는 것을 목적으로 합니다.인천광역시 보건교육 실적 성인병예방(고혈압, 당뇨, 비만, 암예방, 아토피 등) 항목에 대한 관리교육 현황에 관한 정보입니다. (단위 : 명)'
