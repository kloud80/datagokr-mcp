description_portal: 2021. 1월부터 2023. 8월까지의 코로나19로 인한 일별 사망자 현황입니다. 날짜별 사망자수 및 누계를 제공합니다.본 데이터는 대구광역시 서구 관내에서 발생한 코로나바이러스감염증-19(COVID-19)로 인한 사망자 현황을 일자별로 정리한 자료이다. 제공 기간은 2021년 1월부터 2023년 8월까지이며, 각 날짜에 발생한 사망자 수 및 누적 사망자 수를 포함하고 있다. 본 자료는 지역 내 감염병 확산 및 대응 상황을 분석하는 데 활용할 수 있으며, 감염병 관련 정책 수립, 보건의료 자원 배분, 시민 건강 안전 확보 등을 위한 기초 자료로서의 가치가 있다. 공공 보건의 투명성과 데이터 기반 행정 강화를 위해 개방되며, 사용자는 이를 통해 시기별 사망자 변동 양상 및 누적 규모를 명확히 파악할 수 있다.
