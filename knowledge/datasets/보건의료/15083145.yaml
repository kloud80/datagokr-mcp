summary_user: 국민건강보험공단 진료정보 가운데 눈병·천식·감기·피부염 4대 질환의 진료건수를 시군구 단위·날짜별로 담은 집계 파일이며, 2023.5.1.~2024.8.31. 자료이고 그 이전은 과거 파일로 나뉜다. 지역 보건 담당자나 분석가가 "우리 시군구에서 감기·눈병 진료가 어느 시기에 늘었나" 같은 질환별 지역 유행 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군구지역코드를 행정구역 코드표와 이름·코드로 매핑해 인구·기상 등 다른 지역 자료와 잇는다.
description_portal: '본 데이터는 국민건강보험공단 진료정보 중 국민 관심도가 높은 주요 질환(눈병, 천식, 감기, 피부염)에 대한 진료건수를 시군구 단위로 제공하는 자료입니다.□ 국민건강보험공단_진료건수 정보-수요조사 결과에 따라 관심도가 높은 4대 질병(눈병, 천식, 감기, 피부염) 시군구별 과거 진료건수 제공* 2023.5.1. ~ 2024.8.31. 자료파일, 2023.5.1.이전 자료는 과거 파일 참고* 원출처 서비스: ‘국민건강알람서비스’: 해당 서비스는 2024년 2월 29일 종료됨에 따라, 데이터도 제공 종료 시점까지 제한적 제공'
