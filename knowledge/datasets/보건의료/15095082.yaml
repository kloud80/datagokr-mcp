description_portal: □ 개요본 데이터는 국민건강보험 가입자의 보험료 징수 실적을 연도별로 체계적으로 정리한 통계 자료입니다.가입자 유형을 직장가입자와 지역가입자로 구분하여, 각 유형별로 보험료 부과액과 실제 징수된 금액을 백만원 단위로 제공합니다.해당 자료는 결산 기준으로 산출되며, 건강보험 재정 운영의 투명성 확보와 징수 효율성 분석, 가입자별 보험료 납부 이행 수준을 파악하는 데 활용될 수 있습니다. 이를 통해 보험료 징수정책 수립, 납부 독려방안 마련 등 제도 운영의 효율성을 높이는 데 기여할 수 있습니다.
