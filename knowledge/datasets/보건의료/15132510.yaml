summary_user: 국가건강검진 유형(일반·구강·암·영유아·학교밖청소년 등)별로 검진기관이 청구할 수 있는 검사항목의 코드와 항목명을 담은 코드 마스터 파일이며, 암검진은 위암·대장암 등 상세 구분까지 나뉘고 2001년부터 2024년까지의 적용연도 기준 항목을 포함한다(전국 단위, 약 79KB CSV). 검진기관 청구 담당자나 분석가가 '위암 검진에서 내시경·조직검사는 어떤 코드로 청구하나'처럼 검진유형별 청구항목과 코드 의미를 확인할 때 쓴다. 건강검진검사항목코드(hc_exam_item_cd)를 키로 검진 청구·실적 자료의 항목코드를 이름과 검진유형으로 풀어 쓰는 데 연결하며, 유형구분코드·상세구분코드로 검진 종류별로 묶는다.
description_portal: '본 테이블은 건강검진 실시기준 [별표1~3]과 암검진 실시기준 [별표1]에 따라, 국가건강검진유형별로 청구할 수 있는 항목들을 제공합니다. 이 데이터는 검진기관에서 검진비용을 청구할 때 사용되는 전산시스템(업무포털시스템) 내 각 유형별 검진항목을 청구하고 확인할 수 있는 항목을 나타냅니다.1. 청구항목 기준년도적용연도: 2001년 ~ 2024년까지의 건강검진청구항목 적용연도를 기준으로 합니다.2. 청구항목 코드건강검진유형 상세구분이 ‘위암’인 경우, 해당 항목이 코드화된 형태로 나타납니다. 예: ‘상담료 및 행정비용, 위내시경검사, 조직검사 등’에 대한 코드(예: D3101001, D3101003, D3101004 등).3. 청구항목 코드명건강검진유형에 따른 상세 항목명을 코드와 함께 제공합니다. 예를 들어, ‘위암’ 검사 항목에 대해서는 ‘상담료 및 행정비용, 위내시경검사, 조직검사’ 등이 구체적으로 명시됩니다.4. 건강검진 유형구분코드건강검진의 유형을 구분하는 코드입니다. 각 검진 항목에 대해 일반, 구강, 암, 영유아, 학교밖청소년 등으로 구분됩니다. 예: ‘A’, ‘C’, ‘D’, ‘E’ 등의 코드가 해당합니다.5. 건강검진유형 상세구분코드건강검진유형이 ‘암’인 경우, 암검진 항목을 상세히 구분하는 코드입니다. 예를 들어, 위암, 대장암, 유방암, 간암, 자궁경부암, 폐암 등으로 구분됩니다. 각 암에 대한 코드가 제공됩니다. 예: ‘D31~D37’ 등.'
