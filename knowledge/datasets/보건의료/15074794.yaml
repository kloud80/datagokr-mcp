summary_user: 포괄수가제(7개 질병군) 진료비를 청구할 때 별도보상 항목으로 따로 청구할 수 있는 행위 수가코드·치료재료코드와 단가, 적용 시작·종료일을 코드 단위로 담는 전국 범위의 기준 마스터이며, 외과가산·응급수가 금액과 치료재료 중분류별 본인부담률 목록을 함께 4개 오퍼레이션으로 제공한다. 요양기관 청구 담당자나 심사·보험 분석가가 '이 질병군 입원에서 이 치료재료나 행위를 포괄수가와 별도로 청구할 수 있는가, 단가와 본인부담률은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 수가코드(mdfeeCd)·치료재료 중분류코드 같은 심평원 내부 코드나 항목명으로 맞춰 이어 쓴다.
description_portal: 포괄수가(7개 질병군) 지불제도 진료비 청구 시 별도보상 항목으로 청구가능한 수가코드 및 단가 정보를 제공하는 Open API 서비스입니다.- 질병군 외과가산/응급수가 금액 조회, 질병군 별도보상 치료재료대 중분류별 본인부담률 목록 조회, 질병군 별도보상 항목 조회(행위),  질병군 별도보상 항목 조회(치료재료)※ 수가코드, 치료재료코드 등 관련사항은 아래 경로를 통해 확인이 가능하오니 참고하시기 바랍니다.· (경로1) 건강보험심사평가원 홈페이지(https://www.hira.or.kr) > 제도·정책 > 보험인정기준 > 자료실· (경로2) 건강보험심사평가원의 요양기관업무포털(https://biz.hira.or.kr) > 심사기준종합서비스
