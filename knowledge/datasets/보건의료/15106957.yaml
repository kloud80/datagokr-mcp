summary_user: 해외에서 허가된 바이오의약품을 제품별로 담는 건별 목록으로, 국가명·제품명·유효성분명·업체명·승인일 등을 전국 단위 비공간 자료로 제공한다. 제약사나 연구기관이 '특정 바이오의약품(또는 성분)이 어느 나라에서 어떤 이름으로, 어떤 업체가 언제 허가받았는가'를 확인해 해외 진출이나 개발 전략을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식약처 허가정보나 심평원 약가 목록과는 제품명·성분명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 식품의약품안전처 「바이오의약품 해외허가제품정보」 OpenAPI는 해외에서 허가된 바이오의약품의 현황을 확인할 수 있는 공공데이터입니다. 제공 항목에는 국가명, 제품명, 유효성분명, 업체명, 승인일 및 판매일 등이 포함되어 있어 사용자는 특정 바이오의약품이 어느 국가에서 어떤 이름과 성분으로 허가되었는지, 어떤 업체가 제조 또는 판매하는지, 승인·판매 시점은 언제였는지를 확인할 수 있습니다. 이를 통해 제약사와 연구기관은 글로벌 허가 동향을 파악해 개발 전략이나 해외 진출 계획에 참고할 수 있고, 정책 담당자는 국가 간 허가 현황 비교를 통해 제도 개선과 산업 지원 방향을 검토하는 자료로 활용할 수 있습니다.
