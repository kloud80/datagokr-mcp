summary_user: 의료행위(검사·수술 등) 행위코드별로 진료년도·성별·입원외래 구분에 따른 건강보험 환자수, 명세서 청구건수, 총사용량, 청구금액을 담은 전국 단위 집계 통계 파일이다. 특정 검사나 수술이 한 해에 남녀·입원외래별로 몇 명에게 얼마나 시행되고 얼마가 청구됐는지 알아보려는 분석가·의료기관·제약·의료기기 사업자가 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 심평원 수가마스터의 행위코드로 행위명·분류를 붙이거나 같은 기관의 다른 진료 통계와 행위코드·연도로 맞춰 이어 쓴다.
limits: 전국 집계라 지역·요양기관별 분석은 할 수 없고, 다른 데이터와 붙이는 공통 키가 없어 행위코드 매핑에 의존해야 한다. 환자수는 범주 안에서만 중복을 뺀 값이라 성별·입원외래 범주를 단순 합산하면 중복이 생긴다. 포털 설명에 따르면 약국·서면·DRG 청구는 빠져 있고, 진료년 다음 해 4월까지 심사된 분만 반영된다.
