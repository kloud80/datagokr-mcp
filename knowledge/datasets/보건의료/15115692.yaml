summary_user: 전자의무기록시스템(EMR) 사용인증을 받은 의료기관을 기관 단위로 한 줄씩 담은 전국 파일로, 기관명·주소와 함께 사용 중인 인증 제품명·버전·유형, 인증일자, 대상규모를 담는다. 환자나 의료 IT 업체·분석가가 "우리 동네 어느 병의원이 인증받은 EMR을 쓰고, 어떤 제품이 많이 쓰이나"를 확인하는 데 쓴다. 전역 조인 키가 없어 LOCALDATA 병의원 인허가나 건강보험심사평가원 병원정보 등과는 기관명·주소를 맞춰 이어 붙여야 한다.
description_portal: '- EMR(전자의무기록시스템) 사용인증 데이터전자의무기록시스템 인증제는 환자 안전과 진료연속성 지원을 목적으로 국내 전자의무기록시스템에 대한 국가적 표준과 적합성 검증을 통해 업체의 표준제품 개발을 유도하여 시스템의 상호호환성 확보 등 품질 향상으로 의료소비자에게 양질의 의료 서비스를 제공될 수 있도록 하기 위한 제도입니다. EMR획득 의료기관 현황은 의료기관이 제품인증을 받은 전자의무기록시스템을 인증기준과 관련된 기능의 변경 없이 사용하고 있음을 인증하는 것입니다.'
applicable_legislation:
  - law: 의료법
    articles:
      - 23의2
    source: portal_meta:보유근거
legal_basis_portal: 의료법 제23조의2(전자의무기록의 표준화 등)①보건복지부장관은 전자의무기록이 효율적이고 통일적으로 관리ㆍ활용될 수 있도록 전자의무기록시스템, 시설, 장비 및 기록 서식 등에 관한 표준을 정하고 그 준수를 권고할 수 있음②보건복지부장관은 전자의무기록시스템이 제 1항에 따른 표준, 전자의무기록시스템 간 호환성, 정보 보안 등 대통령령으로 정하는 인증기준에 적합한 경우에는 인증이 가능함③제 2항에 따라 인증을 받은 자는 대통령령으로 정하는 바에 따라 인증 내용 표시 가능. 인증을 받지 아니한 자는 인증의 표시 또는 이와 유사한 표시를 하여서는 안됨
