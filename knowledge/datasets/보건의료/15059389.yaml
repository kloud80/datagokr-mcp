summary_user: 경기도의료원 산하 공공의료기관이 취약계층에게 지원한 진료비 실적을 년월(YM)·병원별로 집계한 자료로, 외래·입원·가정간호 각각의 실인원·지원건수·지원금액을 담는다. 정책 분석가나 도의회·복지 담당자가 '병원별로 취약계층 입원 진료비 지원이 매달 얼마나 나갔고 외래·가정간호와 비교하면 어떤가'를 따져 예산 배분이나 형평성 평가에 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 병원명(HOSPTL_NM)을 이름으로 맞춰 연결해야 한다.
description_portal: 경기도의료원에서 제공하는 공공의료사업인 취약계층진료비지원사업의 실적 현황입니다. 외래, 입원, 가정간호 등에 대한 지원인원, 지원건 수, 지원금액 등에 대한 정보를 제공합니다.이 데이터는 경기도 내 공공의료기관에서 취약계층을 대상으로 수행한 진료비 지원 사업의 월별 실적을 병원별로 집계한 자료입니다. 항목은 년월, 병원명, 외래·입원·가정간호 각 항목별 실인원, 지원건수, 지원금액으로 구성되어 있으며, 이를 통해 각 의료기관에서 제공한 진료 지원의 규모와 형태를 확인할 수 있습니다. 본 데이터는 공공의료의 접근성과 형평성을 평가하거나, 취약계층 의료비 경감 효과 분석, 복지 정책 수립 및 예산 배분 등에서 활용될 수 있습니다. 또한 외래, 입원, 가정간호 별로 세분화된 실적 정보를 통해 다양한 의료지원 유형의 효과성도 비교 가능하게 합니다.
