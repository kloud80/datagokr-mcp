description_portal: 경상북도 경주시에서 관리하는 병원 집단급식소 위탁급식 및 직영운영 현황 데이터이다. 본 자료는 관내 병원의 집단급식소 운영 방식을 파악하기 위해 제공되는 행정자료이다. 데이터는 번호, 병원명, 구분_위탁_ 직영, 허가_신고_병상 수 항목으로 구성되어 병원별 급식 운영 형태와 병상 규모를 확인할 수 있다. 행정기관은 급식소 관리, 식품위생 점검, 운영 실태 파악 등 보건행정 업무에 활용할 수 있다. 연구자와 관련 기관은 병원 급식 운영 구조와 시설 규모 분석 자료로 사용할 수 있으며, 시민은 의료기관 급식 운영 현황을 이해하는 데 활용할 수 있다. 따라서 본 데이터는 경주시 병원 집단급식소 현황을 파악하고 식품위생 업무를 지원하는 기초자료이다.
