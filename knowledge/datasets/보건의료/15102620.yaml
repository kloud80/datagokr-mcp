summary_user: 인천광역시 부평구에 신고된 의료기기 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 신고 구분(영업 여부), 영업소명, 도로명 소재지·우편번호, 전화번호를 포함한다. 주민이나 의료기관이 "부평구 안 어느 동네에 의료기기 판매업소가 있고 연락처는 무엇인가"를 확인하거나, 분석가가 구 내 판매업소 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명이나 도로명 주소를 맞춰 붙이거나 같은 기관(부평구)이 낸 자료끼리만 이어 쓴다.
limits: 부평구 한 개 시군구만 담고 있어 인천 전체나 전국 현황은 이 파일로 알 수 없다. 식약처 품목기준코드 같은 공통 키가 없어 의료기기 품목허가·건강보험 자료와 바로 연결되지 않고, 이름·주소 매칭에 기대야 한다.
