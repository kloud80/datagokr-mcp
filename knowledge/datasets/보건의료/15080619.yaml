description_portal: '본 데이터는 감염병의 예방 및 관리에 관한 법률에 의거하여 광주광역시 광산구청에 정식 신고 및 등록된 소독업체들의 최신 정보를 담고 있습니다. 지역 사회의 보건 위생을 책임지는 전문 방역 업체들의 핵심 정보를 제공함으로써, 시민들의 안전한 생활 환경 조성과 비즈니스 매칭을 돕기 위해 제작되었습니다.o 주요 포함 데이터 항목 - 데이터는 이용자의 편의를 위해 다음과 같은 세부 항목으로 구성되어 있습니다.   A. 업소명칭: 광산구 내에서 운영 중인 소독업체의 공식 상호명입니다.   B. 사무실소재지(도로명): 해당 업체의 공식 등록 주소로, 우편물 수령 및 방문이 가능한 도로명 주소 체계로 작성되었습니다.   C. 영업소 전화번호: 서비스 문의 및 상담을 위한 공식 연락처입니다.참고: 개인정보 보호를 위해 휴대전화 번호가 등록된 경우 일부 공란으로 처리되거나 대표번호로 대체될 수 있습니다.'
