summary_user: 서울특별시 종로구 관내 의료법인의 인허가 내역을 법인(사업장)별 건 단위로 담으며, 인허가일·영업상태·폐업일·주소·좌표(중부원점TM)·의료인 수·병실 수·병상 수·면적 등을 포함한다. 종로구에서 어떤 의료법인이 언제 인허가를 받았고 지금도 운영 중인지 확인하려는 분석가·사업자가 지역 의료 인프라나 병의원 개폐업에 따른 상권 변화를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 개방자치단체 코드(OPNSFTEAMCODE)로만 이어 쓰며, LOCALDATA 공통 인허가 형식을 따르는 다른 병의원·산후조리원 인허가 데이터와 나란히 놓고 쓴다.
description_portal: '본 데이터는 서울특별시 종로구 관내에서 「의료법」에 따라 의료업을 목적으로 설립된 의료법인의 인허가 현황을 정리한 자료입니다. 주요 항목에는 법인의 설립 및 변경에 관한 행정처리 정보가 포함되며, 의료기관 운영을 위한 법적 기반과 관련된 행정정보 제공을 목적으로 합니다. 해당 자료는 의료법인이 병원, 요양병원, 전문클리닉 등 의료서비스 제공시설을 개설·운영하기 위한 인허가 절차를 거친 내역을 파악하는 데 활용됩니다. 또한, 종로구의 의료서비스 인프라 분석, 의료법인 운영 실태 모니터링, 공공보건정책 수립 및 의료기관 설립 기준 검토 등 다양한 행정·정책 업무에 참고자료로 제공됩니다. 법인의 유형, 설립 일자, 운영 상태 등의 정보를 통해 지역 내 의료자원의 법적·제도적 기반 현황을 확인할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
