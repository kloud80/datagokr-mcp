description_portal: 광주광역시 산모신생아 건강관리 서비스 제공기관 현황 데이터입니다. 산모신생아 건강관리 지원 사업은 출산가정에 건강관리사를 파견하여 산모의 산후회복과 신생아의 양육을 지원하고, 출산가정의  경제적 부담을 경감시킵니다. 신청 기한은 출산예정일 40일전부터 출산일로부터 60일까지 신청 가능하며, 바우처 유효기간은 출산일로부터 90일까지 사용 가능합니다. 각 자치구 보건소에서 신청 가능합니다. 지원 대상자는 기준중위소득 150%이하 출산가정이거나 희귀질환·중증난치질환 산모, 장애인 산모 또는 장애 신생아, 쌍생아 이상, 둘째아 이상, 새터민 산모, 결혼이민 산모, 미혼모 산모, 이른둥이(미숙아) 출산가정 등입니다.
