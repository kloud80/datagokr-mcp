description_portal: 해당 데이터는 경기도 양평군 내 의료기관 현황에 대한 데이터입니다. 양평군 관내의 사업장 명칭, 종별구분, 소재지 및 전화번호 등의 항목을 알 수 있는 데이터입니다. 의료기관의 구분은 병원과 의원으로 구분되어 있으며, 병원, 요양병원, 한방병원이 있고, 의원종류에는 의원, 치과의원, 한의원이 있습니다.지역 내 의료기관 분포 파악, 민원 처리, 보건정책 수립 등 다양한 활용을 목적으로 제공합니다.또한 지역 주민의 의료접근성 향상과 의료기관 이용 편의를 높이기 위한 기초 자료로도 활용될 수 있습니다.
