description_portal: '대구광역시 서구 관내 어린이 예방접종 위탁의료기관 현황 데이터 입니다. 의료기관명, 동별, 전화번호, 접종가능한 백신 등의 데이터를 포함하고 있습니다.해당 자료는  주소와 전화번호 정보는 의료기관 이용 편의성과 신속한 문의를 위한 용도로 활용 가능하며, 행정동 단위로 분류되어 있어 지역별 확인이 용이하다. 또한 감염병 확산 예방, 소아 건강 증진, 지역 의료자원 활용을 위한 기초자료로 활용도가 높으며, 공공 예방접종 정책 수립 및 시행에도 활용될 수 있는 공공데이터이다.[어린이 국가예방접종 지원사업]- 국가에서 어린이 예방접종 비용을 지원하는 제대로 국가예방접종의 민간의료기관 접종비용을 전액 지원- 지원대상: 12세 이하 어린이- 지원대상 백신(18종): BCG(피내용), B형간염, DTaP(디프테리아/백일해/파상풍), IPV(폴리오), MMR(홍역/유행성이하선염/풍진),수두, 일본뇌염(사백신, 생백신), Td(파상풍/디프테리아), DTaP-IPV(디프테리아/파상풍/백일해/폴리오), Tdap(파상풍/디프테리아/백일해), Hib(b형헤모필루스인플루엔자), 폐렴구균, A형간염, HPV(사람유두종바이러스), Flu(인플루엔자), DTaP-IPV/hib(디프테리아/파상풍/백일해/폴리오/b형헤모필루스인플루엔자), 로타바이러스자세한 사항의 확인은 서구청 홈페이지 https://www.dgs.go.kr/health/chldIncln/list.do?mid=0203020000&token=1748578789414 에서 확인할 수 있습니다.'
