summary_user: 경상남도 창원시 의창구·성산구에 있는 의료기관(종합병원·병원·요양병원·치과병원·한방병원·의원·치과의원·한의원)을 기관 1곳당 1행으로 담은 파일이며, 기관명·종별·도로명주소·전화번호를 담는다. 주민이 집 근처 치과의원이나 한의원 연락처를 찾거나, 분석가가 두 구의 종별 의료기관 분포를 주소 단위로 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명주소를 맞춰 붙여야 하고, 의료기관 인허가(LOCALDATA) 원천과 대조하면 개폐업 변동을 확인하는 데 쓸 수 있다.
