summary_user: 충청남도 당진시 안의 금연시설물을 시설 한 곳당 한 행으로 담은 건별 파일로, 금연구역 구분, 시설명, 지정 근거, 위반 과태료, 위반 신고 전화번호, 도로명주소, 관리기관을 담는다. 시민이나 사업자가 '이 건물이나 장소가 금연구역인지, 흡연하면 과태료가 얼마이고 어디에 신고하는지'를 확인하는 데 쓴다. 전역 조인 키는 없어 도로명주소(소재지도로명주소)나 시설명, 시군구명을 매칭해 다른 지역 금연구역 데이터나 시설 데이터와 이어 쓴다.
