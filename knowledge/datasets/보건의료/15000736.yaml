summary_user: 전국 병·의원을 기관 한 곳당 한 행으로 담은 건별 목록으로, 기관명·주소·전화·요일별 진료시간·기관구분·응급실 운영 여부·위경도 좌표가 들어 있으며 전체 79,024건이다. 국민이 '지금 우리 동네에서 문을 연 의원이 어디인가'를 찾거나, 분석가가 지역별 의료기관 분포를 지도에 올릴 때 쓴다. 기관 고유 식별자(hpid)로 응급의료 계열 데이터와 잇고, 주소(dutyAddr)와 좌표(wgs84Lat·wgs84Lon)로 행정구역·상권·LOCALDATA 인허가 자료와 공간 결합하며, 기관구분·응급의료기관 분류는 NMC 코드표로 풀어 읽는다.
description_portal: 전국의 병‧의원 정보를 통합적으로 조회할 수 있는 서비스로, 사용자는 주소, 진료과목, 기관 유형 등 다양한 조건을 기반으로 의료기관을 검색하고 필요한 정보를 확인할 수 있음.
