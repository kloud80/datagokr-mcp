summary_user: 대구광역시 북구 관내에서 현재 영업 중인 의료기기 판매업소를 업소 한 곳당 한 건으로 담으며, 상호·도로명주소·전화번호를 제공한다. 주민이나 의료기기 사업자가 북구에서 혈압계·보청기 같은 의료기기를 파는 가게가 어디 있고 연락처가 무엇인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호 이름 매칭이나 도로명주소 기반 지오코딩으로만 연결한다.
description_portal: 대구광역시 북구 관내에 소재된 의료기기 판매업소 현황에 대한 데이터로, 현재 영업 중인 상호, 도로명주소, 전화번호 등의 정보를 제공합니다.「의료기기법」 제2조제1항(정의)사람이나 동물에게 단독 또는 조합하여 사용되는 기구ㆍ기계ㆍ장치ㆍ재료ㆍ소프트웨어 또는 이와 유사한 제품으로서 다음 각 호의 어느 하나에 해당하는 제품을 말한다. 다만, 「약사법」에 따른 의약품과 의약외품 및 「장애인복지법」 제65조에 따른 장애인보조기구 중 의지ㆍ보조기는 제외한다.1. 질병을 진단ㆍ치료ㆍ경감ㆍ처치 또는 예방할 목적으로 사용되는 제품2. 상해(傷害) 또는 장애를 진단ㆍ치료ㆍ경감 또는 보정할 목적으로 사용되는 제품3. 구조 또는 기능을 검사ㆍ대체 또는 변형할 목적으로 사용되는 제품4. 임신을 조절할 목적으로 사용되는 제품
