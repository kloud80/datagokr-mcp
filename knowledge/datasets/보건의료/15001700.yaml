summary_user: 병원급 이상 의료기관의 비급여 진료비를 항목 코드 정보, 항목별 병원 목록(병원별 최소·최대 가격), 종별·지역별 최대·최소·평균·중간 비용 네 가지로 나눠 담으며, 병원 목록은 기관·항목 단위 건별 가격이고 종별·지역별 정보는 집계값이다. 환자나 분석가가 도수치료나 MRI 같은 비급여 항목의 가격이 병원마다, 지역마다 얼마나 다른지 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 병원명·비급여코드 같은 이름·코드 매핑이나 심사평가원의 다른 데이터가 쓰는 같은 기관 코드로만 잇는다.
limits: 병원급 이상 의료기관만 다루므로 의원급 가격은 없고, 병원 목록의 요양기호는 암호화돼 있어 외부 데이터와 직접 조인하기 어렵다. 검증 호출에서는 1행만 받았으므로 규모를 이 결과로 판단하지 않는다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
