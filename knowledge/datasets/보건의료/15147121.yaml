summary_user: 서울 강북구의 안경업소(시력 교정, 안경 판매·수리 업소) 인허가 내역을 업소 한 건씩 담은 원천 데이터로, 인허가·폐업·휴업 일자, 영업상태, 주소, 중부원점TM 좌표, 시력표·렌즈절단기 등 장비 수와 면적을 포함한다. 창업 예정자나 상권 분석가가 '강북구에서 최근 문을 연 안경점과 폐업한 안경점은 어디이고 얼마나 되나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결한다.
description_portal: '서울시 강북구 안경업 인허가 정보: 강북구의 눈을 보호하거나 시력의 교정을 요하는 대상에게 시력의 교정 및 안경을 판매 또는 수리하는 업소정보* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.서울특별시 강북구_안경업 인허가 정보 데이터는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일자, 휴업종료일자, 재개업일자, 전화번호, 소재지면적, 소재지우편번호, 지번주소, 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신구분, 데이터갱신일자, 업태구분명, 좌표정보(X), 좌표정보(Y), 시력표수, 표본렌즈수, 측정의자수, 동곡거리측정기수, 정점굴절계기수, 조제용연마기수, 렌즈절단기수, 가열기수, 안경세척기수, 총면적으로 구성되어 있습니다.'
