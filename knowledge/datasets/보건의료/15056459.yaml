description_portal: 국비 지원사업인 "외국인근로자 등 의료지원사업" 수행을 위한 지정의료기관 현황을 제공하는 자료로, 전남대학교병원, 광주기독병원, 조선대학교병원, 첨단종합병원, 보라안과병원, 빛고을전남대학교병원 등 의료기관의 기관명, 소재지 도로명주소, 전화번호, 데이터기준일자를 포함합니다. 각 의료기관은 광주광역시 동구, 남구, 북구, 서구 등에서 운영되며, 의료지원 사업 정보 확인을 위해 활용할 수 있도록 구성되어 있습니다. 본 자료에는 수행의료기관 기본 정보 외에도 의료안전, 지역보건 등의 키워드와 연계될 수 있는 항목이 포함되어 있습니다.
