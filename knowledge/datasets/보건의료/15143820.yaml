description_portal: 한국보건의료인국가시험원에서 사업 추진의 투명성과 책임성을 확보하기 위해 선정한 사업실명제 대상사업 목록입니다. 사업명, 주요내용 등의 항목을 제공합니다. 2026년 사업실명제 대상사업으로 선정된 15건의 데이터입니다.사업 선정기준은 다음과 같습니다.1. 주요 국정 현안 및 국정과제에 관한 사항2. 재무적 영향이 큰 대규모 사업3. 국민생활에 미치는 영향이 큰 주요 서비스 제공사업 - 기관의 임무와 역할을 대표하는 사업 - 서비스의 제공범위, 관련 고객 수, 예산 규모 측면에서 국민생활과 밀접히 관련이 있다고 판단되는 사업4. 그 밖에 기관의 핵심사업※ 기관 설립법, 정관 등에서 정한 기관 고유의 사업은 원칙적으로 실명제 대상사업에 포함되어야 하나 외부공개가 곤란한 사업의 경우 제외
