description_portal: 본 데이터는 한국보건산업진흥원이 제공하는 국민영양통계 중 다빈도음식의 연령별 식품섭취량 통계 자료를 기반으로 2020년부터 2023년까지의 정보를 정제·가공하여 제공하는 파일데이터입니다. 전체 인구를 포함하여 1~2세, 3~5세, 6~11세, 12~18세, 19~29세, 30~49세, 50~64세, 65세 이상 등 연령층별로 자주 섭취되는 음식의 섭취 비율(%)과 표준오차(%) 정보를 포함하고 있습니다. 기존에 연도별로 분리 제공되던 데이터를 통합하고, 연도·기준구분·기준값 컬럼을 추가하여 이용자가 하나의 파일에서 다양한 조건으로 조회·분석할 수 있도록 데이터 구조를 개선하였습니다. 본 자료는 생애주기별 식생활 관리, 건강영양 정책 수립, 연령 맞춤형 식단 개발, 공공영양 프로그램 기획, 학술연구, 데이터 분석 및 인공지능(AI) 활용 등에 활용할 수 있으며, 국민의 연령별 식품소비 경향과 영양상태를 분석하고 건강 형평성 증진을 위한 정책 수립의 기초자료로 활용될 수 있습니다.
