summary_user: 마약 및 향정신성의약품을 취급한 뒤 보고된 사용 내역을 담는 전국 범위의 비공간 API 데이터로, 포털 설명상 보고자 구분·품목명·성분명·취급일자·취급량·소속기관·보고일자 등의 항목을 담는다. 분석가나 보건 연구자가 "특정 마약류 성분이 어느 기간에 얼마나 사용 보고되었나" 같은 사용량 추이를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 품목명·성분명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 공통 조인 키가 없어 식약처 허가정보나 심평원 약가 목록과 바로 결합되지 않고, 이름 매칭에 의존해야 한다. 서비스키(serviceKey)가 필요하고 개발계정은 하루 10,000회로 호출이 제한된다.
