summary_user: 경상남도 김해시의 공공심야약국을 약국 한 곳당 한 행으로 담은 파일로, 약국명·행정동·도로명주소·위도·경도·전화번호와 운영시간·운영일·운영주기를 포함한다. 김해시 주민이나 앱 개발자가 "오늘 밤 늦게 문을 연 가까운 약국이 어디인가"를 찾을 때 쓴다. 전역 조인 키는 없으므로 위도·경도로 지도 위 응급의료기관·야간 진료기관과 거리 기준으로 겹쳐 보거나, 약국명·주소를 이름 매칭해 다른 약국 데이터와 연결한다.
description_portal: '경상남도 김해시 공공심야약국 현황에 대한 데이터로 약국명, 행정동, 도로명주소, 위도, 경도, 전화번호, 운영시간, 근무일, 근무주기의 항목을 제공합니다.해당 데이터의 데이터 기준일자는 2025년 6월 23일로, 연간 주기로 관리하고 있습니다.* 해당 데이터는 2025년 공공데이터 개방·활용 수요조사 결과로 신규 개방된 데이터입니다.데이터 담당부서 : 진영읍, 장유2동 소관 부서(김해시서부보건소 055-330-8694), 내외동 소관 부서(김해시보건소 055-330-4505)[데이터 변동 안내]1. 신규 데이터 등록'
