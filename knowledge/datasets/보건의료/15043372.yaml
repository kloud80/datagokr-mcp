summary_user: 광주 동구 관내 약국을 한 곳씩 담은 건별 인허가 파일로, 관리번호·인허가일자·영업상태(영업·휴업·폐업)와 상세 상태·도로명주소·약국명을 담는다. 주민이 집 근처에서 지금 영업 중인 약국을 찾거나, 분석가가 동구 약국의 개업·폐업 흐름을 상권 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 약국명 매칭, 또는 같은 기관 코드로만 이어 쓴다.
