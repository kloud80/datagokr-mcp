summary_user: 경기도 고양시에 있는 응급의료센터(권역·지역응급의료센터 포함)를 기관 한 곳당 한 행으로 담은 파일로, 기관명·종별·영업상태·소재지·전화번호·입원실수·병상수·의료인수·총면적·진료과목이 들어 있다(CSV 약 1.8KB의 소규모 목록). 고양시 주민이나 분석가가 '고양시에서 특정 진료과목을 보는 응급의료센터는 어디이고 병상 규모는 얼마인가'를 확인할 때 쓴다. 전역 조인 키(기관코드 hpid 등)가 없어 다른 응급의료 데이터와는 의료기관명·소재지 주소를 맞춰 이어야 한다.
limits: 실시간 병상 가용 현황이나 응급실 운영 상태는 담지 않고, 고양시 한 곳의 범위만 다룬다. 기관 고유 코드가 없어 E-Gen 등 전국 응급의료 데이터와 연결하려면 기관명·주소 매칭이 필요하다.
