description_portal: 음주폐해예방 관련 지표- 국세청 국세통계연보를 바탕으로, 민속주의 연도별 출고 현황을 보여주는 것입니다. - 민속주는 전통문화의 전수와 보전에 필요하다고 인정되어 「문화재보호법」에 따라 농림수산식품부장관, 문화재청장 또는 지방자치단체장이 추천하는 주류와, 「식품산업진흥법」에 따라 지정된 전통식품명인 중 주류 부문 명인에 대해 농림수산식품부장관이 추천하는 주류를 의미합니다.- 본 데이터는 국내 음주폐해예방 및 절주문화 확산, 주류업계 동향분석 등을 위한 연구 시 기초자료로 활용될 수 있습니다.
