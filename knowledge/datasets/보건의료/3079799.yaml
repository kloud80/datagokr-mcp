summary_user: 전남광주통합특별시 광양시 관내 보건지소를 지소 한 곳당 한 행으로 담은 작은 파일(csv, 937바이트)로, 지소명·주소·추진업무·근무인원·전화번호·데이터기준일을 담는다. 광양시 주민이 가까운 보건지소의 위치와 연락처, 맡는 업무를 확인하거나, 분석가가 시군구 안의 보건지소 인력 배치를 살피는 데 쓴다. 전역 조인 키가 없어 다른 보건소·의료기관 데이터와는 지소명이나 주소를 매핑해서만 이어 쓴다.
description_portal: 이 데이터는 지역 내 보건지소 현황을 제공하는 자료로, 보건지소명, 주소, 추진업무명, 근무 인원, 전화번호 등의 정보를 포함하고 있습니다. 이를 통해 주민은 가까운 보건지소의 위치와 주요 업무, 연락처를 확인할 수 있으며, 의료 및 보건 서비스 이용 편의성을 높일 수 있습니다. 행정기관은 본 데이터를 기반으로 지역별 보건의료 자원 배분, 인력 관리, 보건정책 수립에 기초 자료로 활용할 수 있습니다. 또한 데이터 기준일이 명시되어 있어 최신성과 신뢰성을 확보하며, 공공데이터 개방을 통해 국민 건강 증진과 보건 서비스 접근성 향상에 기여합니다. 연구기관과 보건 관련 단체도 지역 보건 인프라 분석 및 정책 개선 자료로 활용할 수 있습니다.
