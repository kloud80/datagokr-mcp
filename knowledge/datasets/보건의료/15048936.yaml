description_portal: '- 전라남도 내 장애인거주시설(법인운영 22개소, 개인운영 16개소)에 대한 시설장, 주소, 전화번호 등의 정보를 제공합니다.- 전라남도 내 장애인 거주시설은 장애인들에게 안정적이고 지속적인 거주 환경을 제공하며, 일상생활 지원, 의료 관리, 사회적응 훈련 등 다양한 서비스를 통해 자립적인 생활을 돕는 시설입니다.- 설립 목적: 장애인의 권리 보장과 삶의 질 향상을 위해 지역사회와 연계된 전문적인 거주 서비스를 제공- 주요 서비스- 일상생활 지원: 식사, 세면, 이동 등 기본적인 생활 지원- 의료 관리: 건강 상태 모니터링 및 필요한 의료 서비스 제공- 사회적응 훈련: 대인 관계, 사회 규범 이해 등 사회 적응을 위한 교육- 여가 및 문화 활동: 취미 활동, 문화 체험 등을 통한 정서적 안정 도모'
