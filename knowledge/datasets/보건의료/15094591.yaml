summary_user: 서울특별시 동작구의 대중목욕탕·찜질방·사우나 등 목욕장 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일자(APVPERMYMD), 영업상태, 폐업일자, 전화번호, 지번·도로명 주소, 중부원점TM 좌표, 욕실 수, 건물 층수, 남녀 종사자 수 등을 포함한다. 동작구에서 현재 영업 중인 목욕탕·찜질방이 어디에 있는지, 또는 최근 폐업한 업소가 어느 동네에 몰려 있는지를 알아보려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결할 수 있고, 시군구 코드명은 '서울특별시 자치구 기관코드' 데이터셋에서 확인한다.
description_portal: '이 데이터는 서울특별시 동작구의 대중목욕탕, 찜질방, 사우나 등 물로 목욕 할 수 있거나 맥반석ㆍ황토 등에게 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스를 제공하는 업소정보를 포함하고 있습니다.이 데이터는 목욕장 인허가일자, 영업상태, 전화번호, 주소 등이 포함되어 있습니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 시군구코드명은 "서울특별시 자치구 기관코드" 데이터셋에서 확인 가능합니다.'
