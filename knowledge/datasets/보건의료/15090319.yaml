description_portal: 군내 코로나19 대응을 위한 PCR 검사 인원 실적을 기록한 자료이며, 2021년도 1월부터 6월에 해당하는 현황 데이터입니다.데이터는 기간(연도), 기간(월), PCR 검사건수현황(명), PCR 검사인원으로 구성하여 데이터를 제공하고 있습니다.해당 데이터는 군 병원, 검역소 등 군내 검사기관에서 수행된 PCR 검사 건수(인원)를 월별 또는 일별로 추적하여, 군 장병 및 관련 시설 내 감염병 확산 방지를 위한 기초 자료로 활용할 수 있습니다.현재 코로나19가 엔데믹 단계로 전환되며 PCR 검사 체계가 축소되었으나, 당시 수집 된 데이터는 향후 유사 감염병 대응 시스템 구축 시 참고할 수 있습니다.
