summary_user: 전국 약국을 한 곳씩 담은 위치정보(POI) 데이터로, 약국명·주소·대표전화·위경도와 지오메트리, 요일별·공휴일 운영 시작·종료 시각, 주말 운영 여부를 담는다. 국민이나 지도 서비스 개발자가 '지금 우리 동네에서 일요일·공휴일에 문 여는 약국은 어디인가'를 찾을 때 쓰고, 분석가는 약국 분포를 상권·의료 접근성 분석에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 약국명·주소 매칭이나 좌표(위경도·GEOM) 기반 공간 결합으로 이어 쓴다.
description_portal: "- 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 보건복지부에서 수집하는 전국 약국 정보에 대해서 전국 약국의 위치정보, 운영시간 등을 지오메트리 정보로 제공하고 있습니다."
