summary_user: 경기도 안양시 관내 의약품도매상(의약외품도매상 등 포함)을 업체 1곳당 한 행으로 담은 목록으로, 영업종별·상호·도로명 소재지·전화번호를 담는다(CSV 약 7KB). 안양시에서 의약품을 도매로 유통하는 업체가 어디에 몇 곳 있는지, 특정 지역 주변 도매상 연락처가 무엇인지 확인하려는 약국·의료기관·지역 보건 분석가가 쓴다. 전역 조인 키나 식약처 품목·업체 코드가 없어, 다른 데이터와는 상호명이나 주소를 맞춰 붙이거나 같은 기관의 다른 인허가 목록과 나란히 보는 정도로만 이어 쓴다.
description_portal: '안양시 관내 의약품도매상에 대한 (안양시 관내 영업종별,  영업소소재지명,  영업소전화번호) 현황 데이터 정보입니다.주요 항목 설명 영업종별- 의약품도매상, 의약외품도매상 등으로 구분 | 영업소명 - 해당 도매업체의 상호명 (예: ○○약품, △△메디칼)   영업소 소재지명 - 도로명주소 또는 지번주소 형식의 사업장 위치  영업소 전화번호- 업체 대표 연락처 (일부는 공란일 수 있음) 활용 예시- 의약품 유통업체 분포 지도 제작- 지역별 의약품 공급망 분석- 보건소 및 약국과의 연계 정책 수립- 도매상 허가·변경·폐업 현황 파악경기도 안양시의 의약품도매상 정보는 관내에서 의약품을 도매 형태로 유통·판매하는 업체들의 현황을 정리한 데이터입니다. 이 정보는 지역 보건행정, 의약품 유통 관리, 민원 서비스 등에 활용됩니다.'
