description_portal: 해당 데이터는 서울시 정신건강 통계간행물 목록입니다. 서울시정신건강복지센터는 서울시민의 정신건강증진을 위하여 격년 단위로 발간하는 서울시정신건강지표집을 포함하여 정신건강 통계정보를 확인할 수 있는 조사·연구보고서를 제공하고 있습니다. 원본 시스템은 서울시 정신건강 통계(https://seoulmentalhealth.kr)입니다. 데이터는 구분, 제목, 발행처/발행일, 요약본, 원본, 등록일로 구성됩니다.※ 바로가기 클릭 시 열린데이터광장에서 개방된 데이터를 확인할 수 있습니다.
