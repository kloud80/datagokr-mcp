summary_user: 경기도 내 상급종합병원·종합병원·병원·의원별로 감기(급성상기도감염) 진료 때 항생제를 처방한 정도를 건강보험심사평가원이 평가한 등급을 기관 한 곳당 한 행으로 담는다(백분위 기준 5개 등급, 숫자가 작을수록 항생제를 적게 쓰는 기관). 감기로 갈 동네 의원 중 항생제를 덜 쓰는 곳을 찾으려는 시민, 또는 시군별 항생제 처방 실태를 비교하려는 보건당국·연구자가 쓴다. 전역 조인 키는 없어 다른 병원 데이터와는 기관명·주소 매칭으로 잇고, 시군코드(SIGUN_CD)로 시군 단위 집계와 맞추며, 위경도로 지도에 올린다.
description_portal: 이 데이터는 건강보험심사평가원이 제공하는 병원평가 자료로, 경기도 내 상급종합병원, 종합병원, 병원, 의원 등 의료기관에서 감기(급성상기도감염) 진료 시 항생제 처방 여부를 기준으로 평가한 결과를 담고 있습니다. 항생제의 과잉 처방은 항생제 내성 발생의 주요 원인으로 지목되고 있어, 이를 억제하기 위한 의료 질 관리의 일환으로 평가가 이루어지고 있습니다. 항생제 처방률은 백분위 순위에 따라 5개 등급으로 나뉘며, 숫자가 작을수록 항생제를 적게 사용하는 기관으로 간주됩니다. 진료건수가 100건 미만인 기관은 평가에서 제외됩니다.공개 항목에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 도로명 및 지번 주소, 우편번호, 위도(WGS84_LAT), 경도(WGS84_LOGT) 등 의료기관의 상세 정보가 포함됩니다.이 자료는 지역별 항생제 사용 실태를 비교·분석할 수 있는 근거자료로, 항생제 오남용을 예방하고 국민 건강을 증진시키는 데 기여할 수 있습니다. 보건당국은 이 데이터를 활용하여 항생제 적정 사용을 위한 정책 수립 및 캠페인 기획에 활용할 수 있으며, 국민은 평가 결과를 통해 의료기관 선택 시 참고할 수 있는 유용한 자료로 활용할 수 있습니다. 또한 외부 개발자나 연구자는 Open API를 통해 데이터에 접근하여 보건의료 서비스 개선 연구나 모니터링 도구 개발 등에 응용할 수 있습니다.
