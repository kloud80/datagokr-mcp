summary_user: 경상남도 의령군에서 안전상비의약품(편의점 상비약 등)을 파는 점포를 한 곳당 한 행으로 담은 파일로, 판매점포명·도로명주소·전화번호·데이터기준일자를 담는다(CSV 862바이트 규모의 소량 목록). 주민이나 지역 보건 담당자가 '의령군에서 밤이나 휴일에 해열제·소화제를 살 수 있는 가게가 어디인가'를 확인하거나 상비약 접근성이 낮은 지역을 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 도로명주소나 점포명을 매칭하거나 같은 기관(의령군) 자료끼리만 이어 쓴다.
limits: 의령군 한 개 시군구 범위의 점포 목록이라 다른 지역과 비교하려면 시군별 파일을 따로 모아야 한다. 사업자번호·인허가번호 같은 공통 키가 없어 인허가(LOCALDATA) 자료나 병의원 데이터와는 주소·이름 매칭으로만 연결된다.
