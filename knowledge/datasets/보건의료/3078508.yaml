description_portal: 해당 데이터는 경기도 고양시 관내에 위치한 장례식장 현황에 대한 자료로 2025년 8월 22일 기준으로 작성되었습니다.이 데이터에는 장례식장 명칭, 대표자명, 주소, 연락처,  최초 영업개시일, 공설 및 사설 구분, 운영형태, 부지면적, 빈소수, 안치능력  등의 다양한  내용을 제공하고 있습니다. 고양시는 현재 공설 장례식장 1개소(일산병원장례식장), 사설 장례식장 6개소를 운영하고 있으며, 사설 장례식장 중 1개소는 잠정 휴업 상태입니다.장례식장 현황은 정기적인 관리를 통해 매년 업데이트 됩니다.
