summary_user: 인천광역시 서구(서해구) 안에서 금연아파트로 지정된 공동주택을 단지별로 한 행씩 담은 원천 목록으로, 금연구역 범위, 지정 근거, 최초 지정일, 위반 과태료, 신고 전화번호, 도로명·지번 주소, 관리기관을 포함한다. 주민이나 입주 예정자가 '우리 아파트 복도·계단·지하주차장이 금연구역으로 지정됐는지, 위반하면 과태료가 얼마이고 어디에 신고하는지'를 확인하거나, 보건소·분석가가 관내 금연아파트 지정 현황을 파악하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소(도로명·지번)나 아파트명을 이름 매핑해 공동주택 단지 정보, 같은 기관의 보건소·건강증진 자료와 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 금연아파트 지정 현황을 정리한 자료입니다. 본 데이터는 아파트명, 금연구역 범위, 지정근거, 지정일, 과태료, 신고 전화번호, 주소, 관리기관 등의 정보를 포함하고 있습니다.해당 자료는 공동주택 내 금연 정책의 지정 현황과 관리 체계를 확인 할 수 있는 기반이 되는 자료로, 생활환경 보호 및 간접흡연 예방을 위한 보건 정책 수립에 활용될것으로 판단됩니다.또한 금연지정 구역에 대한 행정 지도, 주민 건강 증진 사업 연계등에 참고 자료로 가능할 것으로 판답됩니다. 본 데이터는 연마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
