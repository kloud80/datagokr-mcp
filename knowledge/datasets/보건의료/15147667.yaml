summary_user: 서울특별시 강북구의 이발소 등 이용업 업소를 인허가 건별로 담으며, 영업 중인 곳과 폐업한 곳이 함께 들어 있고 인허가일·영업상태·폐업일·소재지 주소·중부원점TM 좌표(X, Y)·시설 정보를 포함한다. 강북구에서 영업 중인 이발소가 어디에 있는지, 최근 개업·폐업이 늘었는지를 보려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 강북구 이용업 인허가 정보 데이터는 강북구의 이발소와 같이 머리 또는 수염을 깎거나 다듬는 등의 방법으로 용모를 단정하게하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
