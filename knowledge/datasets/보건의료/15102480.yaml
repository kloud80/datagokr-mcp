summary_user: 주상병 코드 F900(활동성 및 주의력의 장애, ADHD 계열)으로 진료받은 인원을 2022~2024년 연도별로 구분 항목에 따라 집계한 전국 단위 소형 CSV 파일(464바이트)입니다. 연도별 ADHD 진료 인원이 얼마나 늘었는지, 어떤 연령층에 몰리는지 확인하려는 분석가·연구자·보도 작성자가 쓴다. 전역 조인 키가 없으므로 다른 질병별·연령별 진료 통계와는 구분 항목 이름이나 연도를 직접 맞춰 이어 쓴다.
