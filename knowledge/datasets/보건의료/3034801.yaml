description_portal: 이 데이터는 질병관리청이 2013년 부터 2017년까지 수행한 동물 실험 정보를 담은 자료입니다. 질병연구를 위한 동물실험의 연도와 승인번호, 소속부서, 연구책임자, 연구제목 등 상세 정보를 포함하고 있습니다. 동물보호법에 따라 관리되는 이 자료는 신종플루, 조류인플루엔자 등 인수공통감염병의 병원체 연구와 백신 및 치료제 개발에 활용된 실험 내용을 보여줍니다. 총 317건의 실험 기록을 포함하고 있으며, 이는 감염병 연구의 과학적 근거와 연구 동향을 파악하는데 도움이 됩니다.
