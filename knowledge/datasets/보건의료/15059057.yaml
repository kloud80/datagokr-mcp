summary_user: 경기도 내 보건지소를 지소 한 곳당 한 행으로 담은 목록으로, 시군·사업장명·인허가일·영업상태·병상 수·의료인 수·진료과목·주소와 위경도 좌표를 포함하며 범위는 시도, 행정단위는 읍면동이다. 지자체 보건 담당자나 분석가가 "우리 시군의 농어촌 읍면에는 보건지소가 몇 곳이고 의료인과 진료과목은 어떻게 갖춰져 있나" 같은 의료취약지역 인프라 분포 질문에 쓴다. 전역 조인 키는 없어 시군 코드·이름(SIGUN_CD)이나 주소·좌표로 지역사회 건강조사 등 시군구 단위 자료와 맞대어 쓴다.
description_portal: '이 데이터는 경기도 내 보건지소의 현황을 제공하며, 읍면동 단위로 운영되는 공공보건기관에 대한 정보를 포함합니다. 보건지소는 보건소나 의료원과 같은 기능을 수행하지만, 의료 접근성이 낮은 농어촌 등 의료취약지역에 설치되어 주민들에게 기초 건강진료, 만성질환 관리, 예방접종, 건강검진, 응급처치 등의 서비스를 제공합니다.데이터에는 각 지소의 사업장명, 의료기관 종류, 병상 수, 의료인 수, 진료과목, 위치(도로명 주소, 위경도 좌표) 등의 정보가 포함되어 있으며, 지역 보건 인프라의 분포 분석, 의료 사각지대 해소, 정책적 자원 배분, 재난 대응 거점 확보 등의 목적에 활용될 수 있습니다.※ 주의: 본 데이터는 2018년 이후 갱신되지 않아 최신 현황과는 차이가 있을 수 있으며, 보건의료 정책 수립 시 참고 자료로만 활용하는 것이 바람직합니다.'
