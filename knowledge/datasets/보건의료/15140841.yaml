summary_user: 서울 광진구 관내 병원·종합병원·치과병원 등 입원 30병상 이상 의료기관을 사업장 한 곳씩 담은 인허가 원천 데이터로, 사업장명·도로명/지번 주소·인허가일·폐업일·영업상태·병상 수·의료인 수 등을 담는다. 개원·폐업 흐름을 상권 신호로 보려는 분석가나 주민이 '광진구에서 현재 영업 중인 병원은 어디이고 최근 문을 닫은 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·사업장명·주소 같은 이름·주소 매칭이나 같은 기관(자치단체) 코드로만 이어 쓴다.
description_portal: 서울특별시 광진구의 병원 인허가 정보는 관내 병원, 종합병원, 치과병원 등 의료기관의 개설·운영 현황을 나타낸 데이터로, 의사가 환자를 진료할 수 있도록 필요한 의료 설비와 의료인력이 갖추어진 시설에 대한 정보를 포함합니다. 특히 30명 이상의 입원환자를 수용할 수 있는 병상 규모를 갖춘 의료기관이 대상이며, 각 병원의 명칭, 소재지(도로명 주소), 인허가 일자, 인허가 구분(신규, 변경, 폐업 등), 영업상태, 병상 수 등의 항목이 제공됩니다. 또한 해당 병원의 정확한 위치는 중부원점TM(EPSG:2097) 기준의 좌표값으로 제공되며, 위경도 좌표는 포함되어 있지 않습니다. 본 데이터는 최신성을 고려하여 기준일로부터 3일 전의 내용을 반영하고 있습니다. 의료 인프라 현황 파악과 지역 내 공공보건 정보 분석에 활용될 수 있습니다.
