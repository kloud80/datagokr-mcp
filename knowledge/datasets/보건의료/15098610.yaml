description_portal: '충청남도 당진시 보건소 현황 안내(데이터 기준일자: 2026년 7월 1일)충청남도 당진시는 지역 주민의 건강 증진과 예방 중심의 공공의료 서비스 제공을 위해 보건소 및 보건지소를 운영하고 있습니다. 본 자료는 당진시 관내에 설치된 보건소의 현황을 정리한 것으로, 다음 항목들을 포함하고 있습니다:기관명: 보건소 또는 보건지소의 공식 명칭기관종류: 보건소, 보건지소, 보건진료소 등 유형 구분전화번호: 대표 연락처주소: 도로명 또는 지번 기반의 주소위도 / 경도: 위치기반 서비스(GIS) 활용을 위한 좌표값본 자료는 지역 보건의료 자원 파악, 감염병 대응 계획 수립, 공공보건 정책 수립, 대시민 건강 정보 제공, GIS 기반 위치분석 등 다양한 행정 및 서비스 목적에 활용될 수 있습니다.'
