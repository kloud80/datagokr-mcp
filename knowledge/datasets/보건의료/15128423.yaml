status: active
summary_user: 건강보험 진료행위(행위코드 st5Cd)별로 연도·연령군·성별·입원외래·요양기관종별·소재지별 환자수, 총사용량, 진료금액(천 원)을 담은 전국 단위 집계 통계를 조회하는 API이다. 보건의료 분석가나 의료기관·사업자가 '특정 검사·처치 행위가 어느 연령대와 지역에서 얼마나 시행되고 진료비는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 행위코드·행위코드명을 기준으로 EDI 행위 코드 마스터 같은 다른 급여 코드 데이터와 이름·코드 매핑으로 이어 쓴다.
limits: 필수 파라미터인 행위코드(st5Cd)는 다른 데이터에서 먼저 받아 넘겨야 하므로 코드 목록 없이 단독 조회가 어렵다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 코드·이름 매핑으로만 연결된다. 개발계정은 일 10,000회 호출 제한이 있다.
