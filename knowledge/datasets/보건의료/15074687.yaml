summary_user: 경기도 구리시에서 폐의약품 수집에 협조하는 약국을 약국 한 곳당 한 행으로 담은 목록 파일로, 약국명·도로명 주소·위도·경도·전화번호·관리기관·데이터기준일자를 포함한다. 구리시 주민이 '집 근처 어느 약국에 남은 약을 반납할 수 있나'를 찾거나, 지자체·분석가가 폐의약품 수거 거점의 지역 분포를 지도로 확인하는 데 쓴다. 전역 조인 키는 없어서 약국명칭·도로명 주소 문자열 매칭이나 위도·경도 좌표로 다른 약국·의료기관 위치 데이터와 공간 결합해 이어 쓴다.
description_portal: '폐의약품 수집 참여 약국 정보 제공입니다. (약국명칭, 약국소재지, 전화번호  등)폐의약품을 안전하고 환경 친화적으로 처리하는 것은 매우 중요한 일입니다. 의약품을 잘못 처리하면 환경에 심각한 영향을 미칠 수 있고, 특히 물과 토양에 유입될 경우 생태계에 큰 피해를 줄 수 있습니다. 또한, 적절히 폐기되지 않은 의약품이 유해한 화학 물질로 변할 수 있어 인체에도 해로울 수 있습니다.따라서, 폐의약품 수거 약국과 보건소 등에서 지정된 수거함을 통해 의약품을 반납하는 것이 매우 중요합니다. 구리시 보건소: 폐의약품 수거함이 설치되어 있어 주민들이 의약품을 안전하게 반납할 수 있습니다.수택 보건지소: 구리시 수택동에 위치한 보건지소에도 폐의약품 수거함이 마련되어 있습니다.갈매 건강생활지원센터: 갈매동에 위치한 이 센터에도 폐의약품을 반납할 수 있는 장소가 제공됩니다.또한, 지정된 수거 약국들의 협조로 폐의약품을 수거하고 있으며, 이를 통해 폐의약품의 부적절한 처리로 인한 환경오염을 예방과 약화사고를 줄여  시민들의 건강을 보호 할 수 있습니다.'
