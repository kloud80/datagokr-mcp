summary_user: 제주특별자치도 공설 화장시설의 화장자 수, 개장 유골 수, 1일 평균 화장자 수를 연도별로 집계한 통계이며, 포털 설명상 2011년부터 2020년까지를 담는다. 장사행정 담당자나 분석가가 '제주의 화장 수요가 해마다 얼마나 늘었고 화장로 규모가 충분한가'를 따질 때 쓴다. 전역 조인 키는 없으므로 기준 연도를 맞춰 제주 사망자 수나 인구 같은 연도별 통계와 이름 기준으로 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도가 집계·공개한 ‘공설 화장시설 이용 현황’에 관한 통계 자료로, 2011년부터 2020년까지 제주도 내 공공 화장시설에서 이뤄진 화장자 수, 개장 유골 수, 1일 평균 화장자 수 등을 연도별로 정리하여 제공한다. 제공 형식은 CSV이며, 해당 데이터는 장례 및 장사행정, 공공시설 운영, 인구·사망 통계 연계, 장사 정책 및 사회복지 계획 수립을 위한 기초 통계로 기능한다. 본 자료를 통해 제주 지역에서 공공 화장시설 이용 규모의 변화 추이를 파악할 수 있으며, 인구 변화, 사망률 변화, 화장 수요 예측, 화장 시설의 적정 규모 산정, 장사 서비스 제공 범위 설정, 장례 복지 정책 설계, 유골 관리 및 개장 유골 처리 정책, 화장로·안치시설 확보 여부 판단 등의 행정적·정책적 판단 근거로 활용 가능하다. 또한, 공공시설 이용 현황을 투명하게 보여주는 공공데이터라는 점에서 지역 주민, 연구자, 행정기관 등 다양한 이해관계자가 제주도의 장사 인프라 현황을 객관적으로 이해하고, 향후 시설 확충 또는 운영 개선 방향을 검토할 때 중요한 기초자료 역할을 수행한다.
