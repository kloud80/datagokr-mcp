description_portal: 의료기기 표준코드별 제조·수입업자 정보는 의료기기 표준코드(UDI-DI)를 기준으로 해당 제품을 제조하거나 수입한 업체에 대한 상세 정보를 제공하는 공공데이터입니다. 제공되는 주요 항목에는 UDI-DI 코드, 업체 상호명, 의료기기 제조·수입업 허가번호 및 허가일자, 전화번호, 팩스번호, 사업장 주소, 소비자센터 명칭, 소비자센터 연락처 등이 포함될 수 있습니다. 이 데이터를 통해 의료기기 제조·수입업자 정보를 확인할 수 있으며, 의료기기 사용 중 발생할 수 있는 문제에 대한 문의, 사후관리, 소비자 대응 등을 확인할 수 있습니다. 또한 의료기기 유통과 안전관리를 체계적으로 수행하는 데 활용될 것으로 예상됩니다.
