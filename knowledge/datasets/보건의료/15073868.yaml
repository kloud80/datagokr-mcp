summary_user: 의료기기 표준코드(UDI-DI)마다 그 제품을 제조하거나 수입한 업체의 상호, 업허가번호와 허가일자, 주소, 팩스번호, 소비자센터 명칭, 사업자등록번호를 건별로 담는 전국 범위 API다. 병원 구매 담당자나 소비자가 쓰는 의료기기의 바코드 표준코드로 "이 제품을 누가 만들었거나 들여왔고, 문제가 생기면 어디에 문의하나"를 확인할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로 UDI-DI 코드를 같은 식약처의 의료기기 품목·표준코드 데이터와 맞추거나, 업허가번호·사업자등록번호를 업체 정보와 맞추는 매핑 방식으로 이어 쓴다.
limits: 실측 컬럼에서 다른 데이터와 바로 묶이는 공통 키가 없어 연결은 코드·이름 매핑에 의존한다. 개발계정은 하루 10,000회로 호출이 제한된다.
