summary_user: 약제급여목록·급여상한금액표에 고시된 제품코드를 누적 매핑한 의약품 표준코드(KD코드, 13자리) 마스터로, 의약품 제품 단위 약 30만 9천 건(309,889행)을 담는다. 제약 시장 분석가나 청구·심사 담당자가 특정 제품의 표준코드·업체·성분명코드·ATC코드가 무엇인지 확인하는 질문에 쓴다. 대표코드·표준코드 필드(조인 키 corp_rgst_no)로 다른 약가·급여 목록 자료와 이어 쓰고, 식품건강 의약품 허가 정보와는 매핑 관계로 연결된다.
description_portal: 건강보험심사평가원에서 제공하는 의약품 표준코드 매핑 정보입니다. 의약품 표준코드(KD코드; Korea Drug Code)는 개개의 의약품을 식별하기 위하여 고유하게 설정된 번호로서 국가식별코드(3자리), 제조·수입업체 식별코드(4자리), 품목코드(5자리) 및 검증번호(1자리)를 포함한 13자리 숫자로 구성됩니다.- 약제급여목록 및 급여상한금액표에 고시된 제품코드를 누적 매핑한 자료이며, 급여삭제가 되더라도 매핑목록에는 유지되어 있으므로 현 시점에서 급여여부는 약제급여목록표에서 확인하여 주시기 바랍니다.※ 약제급여목록표는 건강보험심사평가원 홈페이지(www.hira.or.kr) > 제도정책 > 약제기준정보 > 목록표 > 약제급여목록표에서 확인하실 수 있습니다.
