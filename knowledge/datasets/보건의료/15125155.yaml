summary_user: 2013~2023년 천식·비염·아토피 세 질환으로 응급의학과 응급실을 찾은 건강보험 진료건수를 진료년월·시도·시군구별로 집계한 파일로, 전국을 시군구 단위로 담고 5인 미만 값은 "*"로 가려져 있다. 보건 분석가나 지자체 담당자가 "우리 시군구의 천식 응급실 방문이 계절·연도별로 어떻게 달라졌는가"를 따질 때 쓴다. 전역 조인 키는 없어서 다른 지역 통계(인구, 대기질 등)와는 시도·시군구 이름을 맞춰 붙여야 한다.
description_portal: 2013년~2023년의 지역별, 질병별 응급실 방문 현황입니다.1. 진료일기준(한의분류 제외, 약국 제외), 연령(연말기준), 진료과목(응급의학과)2. 건강보험 급여실적(의료급여 및 비급여 제외)  - 2023년 6월 지급분까지 반영3. 아래 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라   일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음4. 질병별 상병코드  - 천식(J45), 비염(J00, J30, J31), 아토피(L20) - 개인정보 보호를 위해 5인 미만의 값은 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.
