description_portal: 이 데이터는 국립암센터에서 수집한 PRE(선행) 위암 환자의 진단 검사 정보를 포함하는 메타데이터입니다. 진단을 위해 시행된 내시경 검사, 조직생검, 영상검사, 혈액검사 등의 결과가 포함되며, 검사 시행 일자, 주요 임상소견, 암세포의 존재 여부, 병변 위치 및 범위, 병기 정보 등이 포함됩니다. 선행 치료 전 정밀 진단을 위해 수집된 이 데이터는 환자 맞춤형 치료계획 수립과 병기 설정, 치료반응 예측에 중요한 기초자료로 활용됩니다. 또한 진단 정확도 향상, 위암 조기 진단모델 개발, 예후 예측 연구, 정밀의료 기반 임상 연구 등 다양한 의료연구 및 보건정책 수립을 위한 핵심 데이터로 참고 가능합니다.
