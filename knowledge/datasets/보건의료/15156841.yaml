description_portal: 본 데이터는 한국수력원자력 원자로운전원 대상 정신건강 지원 운영을 위해 협약을 체결한 의료기관 정보를 연도별로 정리한 현황 자료입니다. 제공항목은 연도, 협약병원명1~3(해당 연도 기준 협약의료기관 최대 3개), 검진대상자 수로 구성되며, 병원명은 존재하는 경우에만 기재하고 미해당 항목은 공란으로 제공합니다. 이용자는 연도별 협약기관 구성 변화와 대상자 규모 추이를 확인하여 정신건강 상담·검진 연계 운영 현황을 이해할 수 있고, 관련 안내자료 작성, 민간 협력기관 정보 제공, 지원 서비스 홍보 및 이용자 문의 대응, 지역별 의료자원 연계 검토 등에 활용할 수 있습니다.
