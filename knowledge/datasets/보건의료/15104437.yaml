description_portal: '인천광역시 정신보건관련 기관(시설) 현황 공공데이터는 인천시 내에 있는 정신건강 관련 시설들의 정보를 담고 있습니다. 이 데이터는 시민들이 가까운 곳에서 정신 건강 서비스를 받을 수 있도록 돕고, 지역별 정신 보건 인프라를 파악하는 데 활용됩니다1. 정신건강관리사업  ･ 목 적 : 정신질환의 예방, 정신질환자의 조기 발견·상담·치료·재활 및 사회복귀 도모  ･ 사업내용    - 정신질환자 주간 및 직업재활프로그램 운영   - 정신질환자 및 가족모임·교육   - 24시간 365일 자살 등 위기관리<활용성>이 데이터는 정신 건강 정책 수립에 중요한 역할을 합니다. 정신 질환에 대한 사회적 관심이 높아지면서, 보건 당국은 이 데이터를 활용하여 특정 지역의 정신 보건 인프라가 충분한지 분석하고, 부족한 지역에 새로운 시설을 확충하는 데 활용할 수 있습니다. 해당 데이터는 인천시 홈페이지 또는 공공데이터포털에서 확인할 수 있습니다.'
