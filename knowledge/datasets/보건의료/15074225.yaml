description_portal: 식품의약품안전처 「연도별 마약류취급자 정보」 OpenAPI는 연도별로 마약류취급자 수를 제공하는 공공데이터입니다. 마약류취급자는 「마약류 관리에 관한 법률」 제2조 제5항에 따라 정의되며, 데이터에는 승인연도와 해당 연도의 취급자 수가 포함되어 있습니다. 이를 통해 특정 연도의 마약류취급자 규모를 직접 확인할 수 있으며, 연속된 여러 연도의 데이터를 비교하면 취급자 수의 증감 추세도 파악할 수 있습니다. 이 데이터는 마약류 관리 현황 모니터링, 제도 운영 평가, 학술 연구나 통계 자료 작성 등 객관적이고 다양한 분야에서 활용될 수 있습니다.
