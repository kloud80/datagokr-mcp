summary_user: 식품의약품안전처가 집계한 마약류취급자 수를 승인연도별로 담은 전국 단위 연도 집계 데이터로, 개별 취급자 명단이 아닌 연도별 총계만 제공한다. 정책 담당자나 연구자가 "최근 몇 년 사이 마약류취급자 수가 늘었는가 줄었는가"처럼 연도별 규모와 증감 추세를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 값을 기준으로 맞춰 붙이는 방식으로만 연결한다.
limits: 전국 단위 비공간 집계라 지역별·취급자 유형별·기관별 분석에는 쓸 수 없다. 공통 조인 키가 없어 식약처 품목기준코드나 의약품 표준코드를 통한 약가·DUR 데이터와의 직접 연계는 되지 않는다.
