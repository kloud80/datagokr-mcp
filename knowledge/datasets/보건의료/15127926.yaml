summary_user: 혈관색전술(수가코드 M6644)을 받은 진료인원을 2018~2022년 진료년도별로 가입자 구분(건강보험·의료급여), 주상병 3개 그룹(간암 계열, 자궁근종·자궁내막증, 분만후·이상 자궁출혈), 5세 단위 연령, 성별로 나눠 집계한 전국 단위 파일이다(CSV 약 19KB). 분석가나 연구자가 '자궁근종 환자의 색전술 이용이 연령대별로 어떻게 달라졌나'처럼 특정 질환군의 색전술 이용 규모와 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 주상병코드(KCD)나 수가코드(EDI)를 코드 마스터와 이름·코드로 맞춰 이어 쓴다.
limits: 민원 신청에 따라 특정 수가코드 하나와 주상병 3개 그룹만 발췌한 집계이므로 다른 시술·질환이나 지역별 분석에는 쓸 수 없다. 공통 조인 키가 없어 다른 통계와 연결하려면 코드·이름 매핑이 필요하다.
