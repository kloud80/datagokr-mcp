summary_user: 제주특별자치도 해녀(잠수어업인) 진료비 지원을 받을 수 있는 도내 의료기관 목록을 기관별 한 행으로 담은 파일로, 의료기관명·종별·행정시·주소·진료과목·데이터기준일자를 담는다. 제주에 사는 해녀나 가족이 "진료비 지원을 받으려면 우리 동네 어느 병원·의원에 가야 하나"를 확인하거나, 분석가가 행정시별 지원 의료기관 분포를 살피는 데 쓴다. 전역 조인 키가 없어 의료기관 인허가(LOCALDATA) 등 다른 데이터와는 기관명·주소를 맞춰 이어 써야 한다.
description_portal: '제주특별자치도에서 관리하는 해녀(잠수어업인) 진료비 지원 의료기관 관련한 데이터를 제공합니다.항목: 의료기관명, 종별, 행정시, 주소, 진료과목 등*「제주특별자치도 해녀 진료비 지원 조례」에 의거 제주도내 거주하는 해녀들이 바다에서 고된 조업환경 등으로 각종 질환에 시달리고 있음에 따라 사회보장적 차원에서 진료비를 지원하여 해녀의 건강보호를 도모함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1108'
