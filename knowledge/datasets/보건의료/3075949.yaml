description_portal: 본 데이터는 2025년 1월~12월 기간 동안  광주보건환경연구원에서 수행한 세균성 및 바이러스성 설사 질환에 대한 검사 결과를 기반으로 작성된 자료이다. 광주 지역에서 발생한 설사 질환 의심 사례(설사, 구토 등의 증상)를 대상으로 매주 협력 병원으로 부터 수집된 검체를 검사하였으며 병원체별 검사 건수 및 검출 건수에 대한 정보를 포함하고 있다.검사 대상 병원체는 세균성 10종과 바이러스성 5종으로 구성되며, 세균에는 장염 비브리오균, 살모넬라균속, 세균성 이질균, 병원성 대장균, 황색포도상구균, 예르시니아 엔테로콜리티카, 바실러스 세레우스, 클로스트리디움 퍼프리젠스, 리스테리아 모노사이토제네스, 캠필로박터균이 포함되고, 바이러스에는 노로바이러스, 로타바이러스, 아데노바이러스, 아스트로바이러스, 사포바이러스가 포함된다 세균은 배양 및 생화학적, 분자생물학적 등의 시험을 통해 확인하였고, 바이러스는 유전자 검출(PCR) 등의 방법으로 분석하였다.본 데이터는 지역 내 설사질환 발생 동향 및 주요 원인 병원체 분포를 파악하고, 감염병 예방 및 대응 정책 수립을 위한 기초 자료로 활용될 수 있다. 또한 월별 병원체 발생 경향을 분석함으로써 환경 요인과 병원체별 특성을 종합적으로 파악하는 데 활용될 수 있다.
