summary_user: 서울 중랑구 관내에서 수거한 가정 불용의약품(폐의약품)의 연도별 폐기량(kg)과 관리부서를 담은 구 단위 연간 집계 파일로, 포털 설명상 2016~2025년을 다룬다. 구민이나 지역 환경·보건 분석가가 '중랑구에서 해마다 폐의약품이 얼마나 수거되고 늘었는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 자치구의 같은 이름 데이터와는 연도 기준으로만 나란히 놓고 비교한다.
limits: 중랑구 한 곳의 연도별 합계만 있어 수거함 위치별·동별 수거량이나 의약품 종류는 알 수 없다. 식약처 품목코드 같은 공통 키가 없어 의약품 허가·약가 데이터와 직접 연결되지 않고, 연도와 기관명으로만 맞춰 쓴다.
