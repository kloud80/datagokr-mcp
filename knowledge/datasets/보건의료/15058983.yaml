summary_user: 경기도 내 의료기관이 운영 중이거나 운영했던 CT·MRI 등 특수의료장비를 장비 한 대씩 담은 건별 원천 데이터로, 시군·사업장명·영업상태와 장비 종류·모델·제조국·제조사, 사용 여부, 공동이용 여부, 설치·사용중지·폐기 일자, 주소를 포함한다. 분석가나 병원 설립을 검토하는 사업자가 '어느 시군에 CT·MRI가 부족하거나 몰려 있는가', '공동이용 가능한 장비는 어디에 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 시군명, 사업장명과 주소를 기준으로 경기도 병의원 인허가(LOCALDATA) 같은 다른 의료기관 데이터와 이름·주소를 맞춰 연결한다.
description_portal: 이 데이터는 전국 의료기관에서 운영 중이거나 운영 이력이 있는 CT 및 MRI와 같은 특수의료장비의 분포와 사용 실태를 보여줍니다. 의료장비의 사용여부, 공동이용 가능성, 운영 상태, 제조 정보 등을 포함하여 장비의 물리적 위치와 행정 구역별 분포를 함께 제공함으로써, 지역별 의료자원의 밀집도와 접근성을 분석하는 데 유용합니다. 특히 CT와 MRI는 대표적인 영상 진단 장비로써, 이 데이터를 통해 보건의료 인프라가 어떻게 분포되어 있는지, 특정 지역에 장비가 과밀 또는 부족한지를 파악할 수 있어, 의료정책 수립, 병원 설립 계획, 지역 간 건강 격차 해소 방안 마련 등 다양한 공공 및 민간 영역에서 활용 가능합니다.
