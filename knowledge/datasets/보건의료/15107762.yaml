description_portal: 이 데이터는 부산광역시 연제구에서 발생한 코로나19 확진자 월별 현황입니다.코로나 19 최초 확진자 발생(2020년 1월)부터 2023년 8월까지 코로나 확진자 현황 입니다.코로나 19 위기 단계 하향에 따라 2023년 8월 31일 이후에는 확진자 현황을 집계하지 않습니다.(2023.8.31. 이후 기존 코로나 19 전수검사에서 표본감시체계로 전환으로 확진자 현황을 집계 하지 않습니다. ) * 기존에 집계 되었던 코로나 19 확진자 현황만 공개*구민의 감염병 관련 정보 접근성과 행정의 투명성을 높이고자 개방되며, 감염병 대응체계의 과학적 기반 마련에 기여하는 데 목적이 있다. 또한, 지역사회 감염 상황을 일별로 정리함으로써 방역당국, 연구기관, 일반 국민 모두가 직관적으로 이해하고 활용할 수 있도록 제작되었다.
