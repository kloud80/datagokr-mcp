summary_user: 인천광역시 서구 내 병원의 이름, 소재지 주소, 전화번호를 병원 한 곳당 한 행으로 담은 작은 CSV 파일(약 4KB)이며, 범위는 시군구 하나이고 위치는 개별 주소 단위다. 주민이나 분석가가 '서구 안 어느 동네에 병원이 몰려 있고 연락처는 무엇인가'를 확인하거나 지역 의료자원 분포를 대략 파악할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 병원명이나 주소를 맞춰 붙이거나, 같은 기관이 낸 데이터끼리만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 병원의 명칭, 소재지, 전화번호 등 대한 기본 정보를 담고 있습니다. 본 공공데이터는 보건정책 수립, 의료 인프라 분석, 지역 건강자원 분포 파악, 공공 의료체계 개선 또는 지역 의료자원 관리 등 행정 및 연구 분야에 다양하게 활용 될 수 있을것으로 판단됩니다. 또한 주민 건강복지 향상 또는 공공의료 서비스 개선에 필요하는 기초자료로서 기능으로도 사용할 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
