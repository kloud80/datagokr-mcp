summary_user: 부산 해운대구 관내 의료기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 의료기관명·종별·도로명 주소·대표 전화번호를 담는다. 주민이 집 근처 의원이나 치과를 찾아 연락처를 확인하거나, 분석가가 해운대구 안 종별 의료기관 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 붙여야 하며, 전국 의료기관 인허가(LOCALDATA) 자료와도 같은 방식으로 연결한다.
description_portal: 해운대구 의료기관 현황입니다.해운대구 관내 의료기관현황에 대한 데이터로 의료기관명, 의료기관 종별, 주소, 연락처 등의 정보를 제공합니다.의료기관명은 각 의료기관의 공식 상호명을 나타내며, 이는 정확한 식별 및 검색을 위한 기준이 됩니다.의료기관 전화번호는 의료기관의 대표 연락처로, 운영 여부 등을 사전에 확인하는데 유용합니다.의료기관 소재지는 의료기관이 실제 어디에 있는지를 알려주는 가장 실용적인 정보로, 도로명 주소를 기본으로 제공합니다.의료기관 현황은 신규 허가 및 개설, 폐업, 휴업, 종별, 소재지, 연락처 변경 등의 이유로 수시로 변경될 수 있습니다.
