description_portal: '* 단위 : 건, 인구10만명당 발생률1) 감염병별 진단･신고기준에 따라 확진환자는 물론 의사환자 또는 병원체보유자를 포함한 집계임2) 발생률 : 연간 신고수를 당해연도 주민등록 연앙인구(인구 10만명당)로 나눈 값3) 사망신고는 제1군 및 일본뇌염의 사망환자신고에서 제1군~제4군감염병 사망환자신고로 확대됨4) C형간염, 반코마이신내성황색포도알균 감염증, 카바페넴내성장내세균속균종 감염증은 2017년 지정감염병에서 제3군감염병으로 군분류 변경되어 집계, VRSA 감염증은 반코마이신중등도내성황색포도알균 감염증(3건)을 포함함'
accrual_periodicity: 수시
