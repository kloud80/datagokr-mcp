description_portal: 세종특별자치시 방역소독업체 현황을 제공합니다.데이터는 영업신고일, 업소명, 주소 , 영업소 연락처, 등록기준일로 구성되어 있습니다.세종특별자치시에 등록되어있는 방역소독업체는 총 120개소로엘림환경, 새롬방역, 세종클린, 에코그린텍, 나사렛 방역 세종지점, 우렁여사, 주식회사 타일업클린웍스, 리빙앤, (주)케이맨서비스, 세종교육사, 사회적협동조합공유, 효재산업, 올크린종합환경, 클린컴퍼니, 주식회사 다경씨앤에스 등의 업체가 어진동, 나성동, 보람동, 아름동, 장군면, 연서면, 금남면, 조치원읍 등에 소재하고 있습니다.이 데이터는 세종특별자치시 보건소 보건의료과에서 관리하고 있는 데이터입니다.
