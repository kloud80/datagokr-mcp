summary_user: 인천 서구(서해구) 안에서 금연치료를 하는 병·의원을 한 곳씩 담은 목록 파일로, 지역·의료기관명·소재지 주소·전화번호·데이터기준일자를 담는다. 서구 주민이 집 근처에서 금연치료나 상담을 받을 수 있는 병원과 연락처를 찾을 때 쓰고, 분석가가 동네별 금연치료기관 분포를 파악할 때도 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터와는 의료기관명이나 주소를 맞춰 이어야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 위치하는 금연치료의료기관의 현황을 제공을 하고 있습니다. 본 데이터는 인천광역시 서구 내 금연치료의료기관의 지역, 의료기관명, 소재지, 전화번호 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 내 금연치료 및 상담 서비스를 제공하는 병,의원의 분포를 파악할 수 있을것이며, 이를 통해 흡연율 감소 및 건강증진 관련 사업의 성과를 볼수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
