summary_user: 인천광역시 남동구에서 폐의약품 수거에 참여하는 약국을 한 곳당 한 행으로 담은 파일로, 약국 이름·도로명주소·세부위치·전화번호와 데이터 기준일자가 들어 있다. 남동구 주민이 집에 남은 약을 버리려 할 때 "우리 동네에서 폐의약품을 받아주는 약국은 어디인가"를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 약국 이름이나 도로명주소를 맞춰 보는 방식으로만 이어 쓸 수 있으며, 식약처 품목코드 같은 의약품 코드와는 직접 연결되지 않는다.
limits: 범위가 남동구 한 곳이라 다른 시군구나 전국 단위 수거 약국 현황은 이 파일로 알 수 없다. 실측 컬럼에 공통 코드가 없어 약국 인허가나 의료기관 데이터와 붙일 때 이름·주소 매칭 오류에 주의해야 한다.
