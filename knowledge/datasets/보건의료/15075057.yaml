summary_user: 일반의약품 중 공급실적이 있는 제품의 효능·사용법·주의사항·상호작용·부작용·보관법을 제품 단위로 담은 API로, 전체 4,758건이며 전국 범위다. 소비자가 복용 전 이 약의 주의사항과 부작용을 확인하거나, 약사가 복약 지도 자료를 찾을 때 쓴다. 업체 사업자등록번호(bizrno, 조인 키 bizno)로 사업자 정보와 이어 쓰고, 품목기준코드로 심평원 약가·급여 목록과 연결하는 용도가 세부 부문 설명에 있다.
description_portal: 식품의약품안전처 「의약품개요정보 (e약은요)」 OpenAPI는 일반의약품 중 공급실적이 있는 제품들의 주요 정보를 제공하는 공공데이터입니다. 주요 제공 항목에는 업체명, 제품명, 품목기준코드, 효능, 사용법, 주의사항, 상호작용, 부작용, 보관법 등이 포함되어 있습니다. 이를 통해 소비자는 의약품의 효능, 사용법, 주의사항, 상호작용, 부작용, 보관법 등을 확인해 안전한 복용에 참고할 수 있으며, 의료진과 약사는 환자의 상태에 맞는 복약 지도를 지원하고 부작용 예방 교육 자료로 활용할 수 있습니다.
