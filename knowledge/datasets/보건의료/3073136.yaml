description_portal: '자가도뇨에 필요한 소모성재료비를 현금급여로 지원한 지급내역(이 데이터는 자가도뇨를 시행해야 하는 환자에게 국민건강보험공단이 소모성 재료 구입 비용을 현금급여 형태로 지원한 지급내역을 담고 있습니다.)국민건강보험법 제49조(요양비): 공단은 가입자나 피부양자가 보건복지부령으로 정하는 긴급하거나 그 밖의 부득이한 사유로 요양기관과 비슷한 기능을 하는 기관으로서 보건복지부령으로 정하는 기관(준요양기관)에서 질병ㆍ부상ㆍ출산 등에 대하여 요양을 받거나 요양기관이 아닌 장소에서 출산한 경우에는 그 요양급여에 상당하는 금액을 보건복지부령으로 정하는 바에 따라 가입자나 피부양자에게 요양비로 지급한다.'
