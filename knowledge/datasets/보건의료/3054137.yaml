summary_user: 서울 종로구 안에 자동심장충격기(AED)가 설치된 장소를 한 곳당 한 행으로 담은 파일로, 설치장소명·도로명주소·전화번호·데이터기준일이 들어 있다. 시민이나 응급교육 담당자가 "종로구 이 근처에서 가장 가까운 AED는 어느 건물에 있나"를 확인하거나, 구 단위 AED 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 AED·응급의료 데이터와는 도로명주소나 설치장소명을 맞춰 이어야 한다.
description_portal: 본 데이터는 서울특별시 종로구 내 자동심장충격기(AED)가 설치된 장소에 대한 정보를 정리한 공공데이터입니다. 수록 항목에는 설치장소명, 연락 가능한 전화번호, 도로명주소가 포함되어 있으며, 응급상황 발생 시 인근 AED 접근성을 높이기 위한 안전 기반 정보를 제공합니다. 본 자료는 심정지 환자 발생 시 신속한 응급처치를 가능하게 하는 공공의료장비의 분포 현황을 파악하는 데 활용되며, 공공기관, 다중이용시설, 체육시설 등 인구 밀집 지역 중심으로 설치된 AED 위치 정보 확인이 가능합니다. 또한 지역 내 응급대응 인프라 구축, 심폐소생률 제고를 위한 정책 수립, 시민 대상 응급교육 기획 등 공공보건 및 안전정책 수립의 기초자료로 활용될 수 있습니다.
