summary_user: 정부 지원 난임시술 중 자궁내정자주입술(인공수정)을 하도록 지정된 전국 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 지역·기관명·종별·주소·전화번호를 담는다. 난임부부가 시술비 지원을 받으면서 인공수정을 받을 수 있는 가까운 병의원이 어디인지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의료기관 데이터와는 기관명(요양기관명칭)이나 주소를 맞춰 이어야 한다.
description_portal: '보건복지부에서 정부지원 난임술(자궁내정자주입) 기관 지정현황(기관명, 소재지 주소, 전화번호 포함)에 대한 정보를 제공합니다.<데이터 이용 시 참고사항>1. 난임부부 시술비 지원사업 : 체외수정 시술 및 인공수정 시술 등 보조생식술을 받는 난임부부에게 건강보험 본인부담 및 비급여 일부를 보충적으로 지원하여 경제적 부담을 경감시킴으로써 난임부부가 희망하는 자녀를 갖도록 지원하기 위한 사업2. 자궁내정자주입술(IUI) : 배란이 된 여성의 자궁 내에 정자를 직접 주입하여 자연적인 수정 과정을 돕는 시술'
