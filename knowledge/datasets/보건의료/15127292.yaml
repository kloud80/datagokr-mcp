summary_user: 2012~2022년 건강보험 청구내역 가운데 수술로 분류된 명세서를 대상으로, 주상병코드 구분(A~R 일부 제외)·진료년도·성별·연령별 진료인원과 진료건수를 전국 단위로 집계한 파일이다. 보건의료 분석가가 '특정 질병군의 수술 환자 수가 연령·성별로 어떻게 달라졌는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 진단구분 이름을 KCD 질병분류와 이름·코드로 맞추거나 같은 기관의 다른 진료 통계와 연도·성별·연령 기준으로만 이어 쓴다.
description_portal: 본 데이터는 2012년부터 2022년까지의 청구내역을 기반으로, 명세서 수술구분 항목상 수술인 자료에 대하여 주상병코드와 진료 구분에 따라 건강보험 급여 실적을 제공합니다. 주상병코드별(A~R, 일부코드 제외), 연령별, 성별로 구분하여 작성하였으며, 의료급여를 제외하고, 진단 구분별로 진료 인원 및 진료 건수를 포함한 자료입니다.※ 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라     일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음
