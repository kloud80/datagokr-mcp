description_portal: '서울특별시 중구에 소재한 진단 및 치료 장비 등을 전문적으로 정비하는 업체의 정비등록 현황을 통합적으로 관리하여 제공합니다. 각 정비 업체에 부여된 관리번, 현재의 영업 상태(정비등록, 개설폐쇄 등), 상세 소재지 등의 항목들로 구성되어 있습니다. 이 자료는 관련 산업에 종사하는 이해 관계자들에게는 시장 동향 분석 및 기술인력 확보 계획 수립을 위한 기초 데이터로 활용될 수 있습니다. 또한, 시민들에게는 의료기관에서 사용되는 장비의 유지보수가 법적 기준에 따라 안전하게 이루어지고 있는지 투명하게 확인할 수 있는 근거를 제공합니다. 본 데이터를 공공데이터포털을 통해 개방함으로써 의료기기 정비 분야의 투명성을 제고하고, 궁극적으로 구민의 보건안전 수준을 확보하고자 적극적으로 노력하고 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
