summary_user: 건강보험심사평가원에 신고된 전국 약국의 기본정보(약국명·주소·전화·좌표·개설일 등)를 약국 한 곳당 한 행으로 담는 원천 API이며, 전체 25,841건이다. 국민이나 분석가가 특정 시도·시군구에 어떤 약국이 있는지, 위치가 어디인지 찾는 질문에 쓴다. 암호화된 요양기호(ykiho)로 심평원의 다른 요양기관 API와 이어 쓰고, 시도코드(sidoCd)·주소(addr)로 행정구역·지역 데이터와 맞춘다.
description_portal: 건강보험심사평가원에서 관리하는 약국 정보를 조회할 수 있는 서비스입니다. - 국민건강보험법 제 43조(요양기관 현황에 대한 신고) 및 동법 시행규칙 제 12조(요양기관 현황 신고 등)에 의해 요양기관이 건강보험심사평가원에 신고한 기준으로 작성되었습니다. - 요양기호는 1:1로 매칭한 암호화된 요양기호로 제공하고 있으며, 별도의 복호화 방법 또는 요양기호는 제공하고 있지 않습니다. - 지역코드 등 API 활용을 위한 코드는 보건의료빅데이터개방시스템(opendata.hira.or.kr) > 서비스 소개 > 용어설명 > 코드조회를 참고하여 주시기 바랍니다.
