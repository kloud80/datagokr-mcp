summary_user: 의료기기 광고에 대해 자율심의기구가 내린 심의 결과를 광고제작사(광고업소)별로 건별 담은 전국 단위 데이터로, 대표품목명·심의번호·심의결과일자·결과·재심의 여부·시정사항·심의소견서 등을 포함한다. 의료기기 광고를 준비하는 사업자나 광고대행사가 특정 제작사·품목의 광고가 어떤 판정과 시정 요구를 받았는지 확인하거나, 분석가가 심의 결과 경향을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·품목명 같은 이름 매칭이나 같은 식약처 기관 코드로만 이어 쓸 수 있다.
description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 의료기기 광고제작사별 심의내역 정보입니다. 이 공공데이터는 광고업소명 ,대표품목명,결과통보심의번호 ,결과통보심의결과일자, 결과통보결과, 결과통보재심의여부, 결과통보심의시정사항, 결과통보_심의소견서 등의 정보를 담고 있습니다.누구든지 의료기기의 광고를 하려는 경우에는 미리 해당 광고가 의료기기법령에 따른 금지되는 광고 위반여부에 대해 자율심의기구의 심의를 받아야 합니다. 심의기구로 부터 받은 심의내역을 통해 광고 시 활용가능 할 것입니다
