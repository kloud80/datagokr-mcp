summary_user: "KCD 3단 상병별(주진단·부진단 전체)로 진료년도·성별·입원외래 구분에 따른 건강보험 환자수와 명세서 청구건수를 담은 전국 단위 집계 파일로, 심사평가원이 심사 결정한 명세서를 진료일자 기준으로 산출한 것입니다. 분석가나 연구자가 '특정 질병(예: 당뇨병)으로 입원한 남녀 환자 수는 해마다 어떻게 변했나'처럼 상병별 성별·입원외래별 진료 규모를 볼 때 씁니다. 실측 컬럼에 전역 조인 키는 없고, 상병코드(KCD 3단)를 매개로 같은 기관의 다른 상병별 진료 통계나 KCD 상병명 코드표와 이름·코드 매핑으로 이어 씁니다."
description_portal: 'KCD 3단 상병별(주진단, 부진단 전체) 성별 입원외래별 환자수 및 청구건수 / 진료일자 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024.1월~12월, 심사년월: 2024.1월~2024.4월 / 보험자: 건강보험 / 한방상병 제외※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 연령별 환자는 명세서에 기재된 수진자의 만(滿)나이 기준으로 범주 내 동일인의 중복을 제거한 값이지만, 진료시점에 따라 중복집계될 수 있으며 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
