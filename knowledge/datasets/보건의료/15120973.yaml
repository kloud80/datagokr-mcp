description_portal: '■ 자료 개요1. 진료기준: 진료일기준(한방 및 약국 진료 제외), 연령은 해당 연도 말 기준2. 자료범위: 건강보험 급여실적 기준(의료급여 및 비급여 제외), 2023년 6월 지급분까지 반영3. 진단정보 주의사항: - 상병코드는 요양기관이 진단명을 최종 확정하기 전 환자의 증상 등을 기준으로 청구한 주상병을 바탕으로 함 - 최종 진단과 일치하지 않을 수 있음■ 진단구분 기준각 진단구분은 주상병 또는 부상병 코드에 따라 아래와 같이 분류됨:※ 본 데이터의 설명은 글자 수 제한으로 인해 압축파일 내 ‘데이터설명.txt’ 파일에 수록되어 있으니, 해당 파일을 참고하시기 바랍니다.* 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
