description_portal: 경상북도 호흡기바이러스 통합감시현황 AI학습용 데이터는 경상북도 내 호흡기바이러스 통합감시 결과를 주차 단위로 정리한 자료입니다. 검사건수, 검출건수, 검출율과 함께 아데노바이러스, 사람 보카바이러스, 파라인플루엔자바이러스, 호흡기세포융합바이러스, 사람 코로나바이러스, 사람 메타뉴모바이러스, 리노바이러스, 인플루엔자바이러스, 코로나19 바이러스 등 주요 호흡기바이러스별 검출 현황을 제공합니다. 본 데이터는 연도, 월, 주차별 검사 및 검출 정보를 포함하고 있어 호흡기바이러스 발생 추이 분석, 계절성 검출 패턴 확인, 바이러스별 검출 비중 비교, 감염병 감시자료 기반 예측모델 개발 등 AI 학습 및 데이터 분석에 활용할 수 있습니다. 수치형 항목인 검사건수, 검출건수, 검출율과 바이러스별 검출건수가 함께 구성되어 있어 주차별 시계열 분석, 분류·예측 모델 학습, 감염병 유행 경향 파악을 위한 기초자료로 활용 가능합니다. 자료 관련 문의는 054-339-8242로 연락하시기 바랍니다.
