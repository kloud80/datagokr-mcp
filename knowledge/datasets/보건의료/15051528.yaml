description_portal: 이 데이터는 근로복지공단 소속 직영 병원(산재병원)에서 진료를 받은 환자들의 현황을 보험 구분별(산재보험, 건강보험, 의료급여, 자동차보험, 일반)로 상세하게 집계한 통계 자료입니다. 통계 항목은 각 연도별, 보험 구분별 진료 인원(연명)과 전체 진료 인원 대비 점유율(퍼센트)을 제공합니다. 이 자료는 공단 소속 병원의 진료 실적에서 산재보험 환자가 차지하는 비중과 더불어, 공공 병원으로서 건강보험, 의료급여 환자를 포괄하는 공익적 역할의 변화 추이를 명확하게 보여줍니다. 이 통계는 산재 전문 병원의 기능 유지와 공공 의료 전달 체계 내에서의 위치를 평가하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 공공 병원의 역할 분석 및 재정 효율성 평가에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 산재보험 환자 인원 점유율의 변화 추이를 분석함으로써, 공단 병원이 본래 설립 목적인 산재 환자 진료 기능을 충실히 수행하고 있는지 진단할 수 있습니다. 또한, 건강보험 및 의료급여 환자 인원과 점유율을 분석하여 공공 보건 의료 서비스의 지역별 거점으로서 기여도를 평가하고, 병원 경영의 재정적 안정성을 확보하면서도 공익적 기능을 확대하는 방안을 모색하는 데 활용할 수 있습니다. 이 통계는 공단 병원의 공공성 및 전문성 강화 정책을 수립하는 데 기여할 수 있다고 판단됩니다.
