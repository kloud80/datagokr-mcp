summary_user: 서울특별시 용산구의 단란주점 영업 인허가를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 업소명·인허가일·영업상태·폐업일·지번·도로명 주소·좌표·시설면적 등이 들어 있다. 용산구에서 현재 영업 중이거나 최근 폐업한 단란주점이 어디에 몇 곳 있는지 확인하는 상권 분석가나 청소년 보호·위생 점검 담당자가 쓴다. 다른 데이터와 직접 이을 전역 조인 키는 없어 개방자치단체 코드(OPNSFTEAMCODE)나 관리번호, 업소명·주소로 같은 기관의 다른 LOCALDATA 인허가 데이터와 맞춰 쓴다.
description_portal: 서울특별시 용산구_단란주점영업 인허가 공공데이터는 단란주점의 영업 허가 현황 및 관련 정보를 담고 있는 데이터로, 지방자치단체와 식품의약품안전처 등 관계기관에서 수집·관리합니다. 공공데이터포털(data.go.kr)을 통해 제공되며, 업소 명칭, 소재지, 인허가일, 영업상태, 업종구분, 신고기관 등의 항목을 포함하고 있습니다. 이 데이터는 유흥시설 관리, 위생 및 안전 점검, 청소년 보호 정책 수립, 지역 상권 분석 등에 활용됩니다. 누구나 접근 가능한 개방형 데이터로, 투명한 행정 운영과 정보 활용 활성화에 기여하고 있습니다.
