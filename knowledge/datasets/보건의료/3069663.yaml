summary_user: 진도군 관내 병원·요양병원·의원·치과의원·한의원·약국을 기관 한 곳당 한 행으로 기관명·전화번호·주소만 담은 작은 현황 파일(CSV 약 3KB)이다. 주민이나 관광객이 진도읍·조도면 등 읍·면별로 가까운 의료기관과 약국의 연락처를 찾거나, 분석가가 진도군 읍·면별 의료시설 분포와 취약지역 접근성을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소 문자열을 맞춰서만 이어 쓸 수 있고, 의료기관 인허가(LOCALDATA) 원천과 대조할 때도 이름·주소 매칭이 필요하다.
description_portal: 전남광주통합특별시 진도군 의료기관 및 약국현황 공공데이터는 진도군 관내에서 운영 중인 병원, 의원, 치과의원, 한의원, 약국 등 의료 관련 기관의 현황을 확인할 수 있도록 의료기관명, 전화번호, 주소 등의 항목을 제공하는 자료입니다. 본 데이터는 주민과 방문객이 진도군 내 의료기관과 약국의 위치 및 연락처를 쉽게 확인할 수 있도록 구성되어 있으며, 필요한 의료서비스를 이용하거나 가까운 의료기관을 찾는 데 활용할 수 있습니다. 자료에는 종합적인 진료를 제공하는 병원과 요양병원을 비롯하여 내과, 외과, 안과, 정신건강의학과, 치과 등 다양한 진료 분야의 의원과 한의원, 약국 관련 정보가 포함되어 있어 진도군의 전반적인 보건·의료서비스 제공 현황을 파악하는 데 도움이 됩니다. 또한 주소 정보를 통해 진도읍뿐만 아니라 고군면, 의신면, 임회면, 지산면, 조도면 등 각 지역에 분포한 의료기관과 약국의 위치를 확인할 수 있어 읍·면별 의료서비스 접근성을 비교하거나 지역별 의료시설 분포를 분석하는 데 활용할 수 있습니다. 해당 데이터는 주민의 의료기관 이용 편의 향상, 보건의료 정책 수립, 지역별 의료서비스 공급 현황 파악, 취약지역 의료 접근성 분석, 응급 및 재난 상황에서의 의료기관 확인 등 다양한 행정업무의 기초자료로 활용할 수 있습니다. 아울러 관련 기관과 연구자, 민간에서도 지역 의료자원의 분포와 이용환경을 분석하는 데 활용할 수 있으며, 군민과 관광객에게 필요한 의료·약국 정보를 공공데이터로 제공함으로써 보건의료 정보에 대한 접근성과 행정정보의 활용성을 높이는 데 목적이 있습니다.
