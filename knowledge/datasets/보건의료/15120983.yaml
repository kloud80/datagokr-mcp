description_portal: '□ 데이터 개요본 데이터는 국민건강보험공단이 관리하는 간호간병통합서비스의 운영현황을 나타낸 자료입니다.2018년부터 2022년까지 진료 개시 연도별, 2015년 1월부터 2023년 6월까지의 심사년월별 간호간병통합서비스 이용 환자 수와 이용 일수를 집계하여 제공합니다.□ 주요 내용진료개시연도: 간호간병통합서비스가 시작된 연도(2018~2022년)심사년월: 의료비 심사 기준 연월(2015년 1월~2023년 6월)이용환자수: 해당 연도 내 중복을 제거한 간호간병통합서비스 실제 이용 환자 수이용일수: 간호·간병료 코드가 포함된 요양급여비용명세서의 총 투여 일수 합계□ 활용 안내본 자료는 간호간병통합서비스의 이용 현황 분석 및 정책 수립, 서비스 개선을 위한 기초 자료로 활용됩니다.'
