description_portal: '보건복지부에서 2003년~2024년까지 건강보험 보험료 및 요양급여의 급여액의 급여 수급 인구수, 보험료, 급여비에 대한 정보를 제공합니다.<통계 데이터 이용 시 참고사항>1) 인구수 : 인구수 항목은 적용인구로 연평균 적용인구 수를 의미함2) 보험료 : 보험료 항목은 결산기준(국고지원금 제외) 총 보험료를 의미함3) 급여비는 지급일 기준(현금급여, 건강검진비 등 제외)4) 1인당 총보험료 = 총보험료/연평균 적용인구, 1인당 급여비 = 급여비/연평균 적용인구5) 급여실적과 관련된 통계는 요양기관에서 청구한 진료비를 공단에서 지급한 월 기준이며, 보험급여비는 건강보험 가입자의 진료에 소요된 총진료비 중 공단이 부담한 금액이며 결산기준 또는 지급기준으로 구분함6) 계수가 단위미만인 수는 반올림을 하였으므로 내용과 총수가 일치하지 않는 경우가 있음'
