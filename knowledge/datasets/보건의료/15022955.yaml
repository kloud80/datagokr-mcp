summary_user: 부산광역시 금정구 관내 의료기관이 운영하는 특수의료장비(자기공명영상촬영장치·전산화단층촬영장치·유방촬영용장치)를 장비 한 대 단위로 의료기관명, 도로명 주소, 장비 종류, 모델명, 형식명과 함께 담은 건별 현황 파일(csv, 약 3.4KB)이다. 금정구 주민이나 분석가가 '집 근처 어느 병원에서 MRI나 CT를 찍을 수 있나'를 확인하거나 구 안의 고가 영상장비 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 의료기관명이나 도로명 주소를 기준으로 금정구 병의원 인허가(LOCALDATA) 자료와 맞춰 잇는다.
description_portal: '부산광역시 금정구 관내 의료기관에서 운영 중인 특수의료장비(자기공명영상촬영장치, 전산화단층촬영장치, 유방촬영용장치)를 등록하여 현황 데이테를 제공합니다.주소는 도로명 주소를 사용 하여 민원인이 알기 쉽게 제공 합니다.특수의료장비 중 자기공명영상촬영장치의 형식명은 생략 될 수 있습니다.의료기관명: 특수의료장비를 운영하고 있는 의료기관 입니다.의료기관소재지(도로명): 특수의료장비를 운영 하는 의료기관의 도로명 주소의료장비 종류: 특수의료장비 종류모델명: 특수의료장비의 대표 모델 이름형식명: 특수의료장비의 대표 형식 이름'
