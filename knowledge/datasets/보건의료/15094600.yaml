summary_user: 서울특별시 동작구에 있는 약국의 인허가 정보를 업소 한 곳당 한 행으로 담는 건별 원천 데이터로, 상호·주소·전화, 인허가일자, 영업상태(영업·폐업 등)와 폐업·휴업 일자, 중부원점TM 좌표가 들어 있다. 동작구에서 최근 새로 문을 열거나 폐업한 약국이 어디인지 확인하려는 주민·약국 개업 예정자나, 약국 개폐업을 상권 신호로 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 잇고, 시군구코드의 이름은 '서울특별시 자치구 기관코드' 데이터셋에서 확인한다.
description_portal: '이 데이터는 서울특별시 동작구 소재에 있는 약사가 의약품을 조제 또는 판매를 주목적으로 하는 업소정보를 포함하고 있습니다.이 데이터에는 약국의 운영 상태를 확인할 수 있는 영업상태 항목이 포함되어 있습니다.인허가일자 항목을 통해 약국이 인허가를 받은 시점을 확인할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 시군구코드명은 "서울특별시 자치구 기관코드" 데이터셋에서 확인 가능합니다.'
