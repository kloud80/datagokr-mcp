summary_user: 건강보험심사평가원이 식약처 허가 의약품의 성분·함량·투여경로·제형에 따라 부여한 주성분코드(일반명코드)를 일반명·분류번호·함량·단위와 함께 코드별 한 행으로 담은 전국 단위 코드 마스터 파일이다(csv 약 3.8MB). 제약사·약국·분석가가 어떤 약이 같은 성분·함량·제형으로 묶이는지, 처방·청구 자료의 주성분코드가 어떤 성분을 뜻하는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 약제 급여 목록·급여 상한금액표나 처방 통계와는 주성분코드(일반명코드) 값이나 일반명 매핑으로 이어 쓴다.
description_portal: 식품의약품안전처에서 의약품이 허가된 후 의약품의 성분·함량·제형에 따라 건강보험심사평가원에서 부여하는 주성분코드입니다.주성분코드 부여방법은 주성분 일련번호, 함량 이련번호, 투여경로, 제형으로 구성되며, 보건복지부에서 고시하는 "약제 급여 목록 및 급여 상한금액표"를 참고하여 주시기 바랍니다.※ 해당 자료는 건강보험심사평가원에서 제공하는 요양기관업무포털(https://biz.hira.or.kr) > 심사기준 종합서비스 > 의약품 > 약가정보 > 약가주성분 탭에서도 확인하실 수 있습니다.
