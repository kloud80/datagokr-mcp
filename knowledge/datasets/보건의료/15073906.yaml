summary_user: 식품의약품안전처가 관리하는 의료기기 품목의 상세 허가정보(품목일련번호, 허가일자, 등급, 제조자, 제조국가, 취소취하 이력 등)를 품목 단위로 제공하는 API이며, 전체 건수는 30건이고 범위는 전국이다. 소비자나 업계 종사자가 특정 의료기기가 허가된 품목인지, 허가·취소 이력이 어떤지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
