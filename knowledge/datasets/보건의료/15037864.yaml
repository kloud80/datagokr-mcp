description_portal: 서울특별시 양천구가 제공하는 본 데이터는 공중이용시설과 생활 주변에서 발생하는 흡연 관련 민원 처리와 단속 현황을 정리한 것이다. 데이터에는  흡연관련 연도별 흡연 민원 건수, 단속 건수, 점검 건수, 실내금연구역 개수, 실외 금연구역 개수 등이 포함되어 있으며 이를 통해 지역 내 금연 정책 이행 정도와 생활환경 개선 효과를 확인할 수 있다. 행정기관과 연구자는 본 자료를 활용하여 정책 효과를 평가하고 금연구역 관리 강화 및 위반 예방 대책 마련에 참고할 수 있다. 주민은 본 데이터를 통해 금연 환경 조성 현황을 이해하고 건강권 보호를 위한 행정 노력을 확인할 수 있다. 본 데이터는 공공데이터 포털을 통해 누구나 이용 가능하며 지역사회 건강 증진과 쾌적한 환경 조성을 위한 기초자료로 기능한다.
