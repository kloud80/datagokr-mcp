description_portal: 대구광역시 서구보건소의 진료에 대한 데이터 입니다. 이용가능한 진료내용과 본인부담금 등의 내용을 포함하고 있습니다.본 데이터는 대구광역시 서구청이 운영하는 서구보건소의 진료 항목 및 본인부담금 정보를 수록한 자료이다. 내과, 물리치료, 한방진료로 구분되며, 각각의 진료유형에 따라 제공되는 의료서비스와 이에 따른 비용이 명시되어 있다. 내과는 원외처방과 원내처치 여부에 따라 비용이 달라지며, 물리치료는 진찰과 병행하여 제공되는 물리치료의 방식에 따라 구분된다. 한방진료는 시술과 투약 여부, 투약일수에 따라 본인부담금이 달라진다. 모든 진료는 서구보건소 내에서 실시되며, 합리적인 비용으로 지역주민의 건강 증진과 의료 접근성 향상을 도모하고자 한다. 해당 데이터는 진료 항목별 비용 비교, 이용자 사전 준비, 보건소 내 서비스 범위 이해에 유용하게 활용될 수 있다.
