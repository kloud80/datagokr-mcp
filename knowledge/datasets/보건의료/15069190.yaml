description_portal: '- 전라남도 응급의료기관에 대한 데이터로  종별구분, 응급의료 취약지 여부, 병원명, 의료법상 병원분류, 지정일자, 응급의료권역, 대표전화, 주소, 허가병상수 등 항목을 제공합니다.- 전라남도는 응급환자에 대한 신속한 진료를 위해 다양한 지역응급의료기관을 운영하고 있습니다.- 응급의료센터 유형 : 전국 응급의료기관은 권역응급의료센터, 지역응급의료센터, 지역응급의료기관으로 구분됩니다. 권역응급의료센터는 중증 응급환자 진료를 담당하며, 지역응급의료센터는 지역 내 응급환자 진료를 담당합니다. 지역응급의료기관은 일반 응급환자 진료를 수행합니다.- 진료 시간: 대부분의 응급의료기관은 24시간 응급 진료를 제공합니다.'
