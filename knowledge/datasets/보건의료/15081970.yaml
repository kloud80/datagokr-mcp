description_portal: 본 데이터는 인천광역시 미추홀구 관내의 소독의무대상시설 중 숙박업소의 현황을 수록한 자료로, 소독을 해야 하는 시설 중 「공중위생관리법」에 따른 숙박업소(호텔, 모텔, 여관 등 객실 수 20실 이상인 경우만 해당), 「관광진흥법」에 따른 관광숙박업소가 해당됩니다. 데이터는 상호명, 도로명주소, 전화번호, 위도 및 경도 정보로 구성되어 있으며, 해당 지역 내 감염병 예방과 위생관리 강화를 위한 소독의무대상 숙박시설을 파악하는 데 유용합니다. 도로명주소와 위치좌표는 지도 기반 분석 및 행정구역별 시각화에 활용할 수 있으며, 전화번호 항목은 현장점검 및 민원 대응 시 유용하게 활용됩니다. 본 데이터는 정기적인 정보 갱신이 이루어지며, 방역 관리 대상 목록, 시설관리 대상 분류, 관광객 수용 관련 위생 정책 수립 등의 기반 자료로 활용할 수 있습니다.
