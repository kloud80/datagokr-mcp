summary_user: 식약처가 허가·신고한 의료기기 품목마다 사용된 원자재(원자재명·원자재코드)를 품목일련번호·품목허가번호, 허가신고 구분, 허가일자, 취소·취하 여부와 함께 담는 품목별 원천 목록이며 범위는 전국입니다. 의료기기 제조·수입 사업자나 분석가가 특정 품목에 어떤 원자재가 쓰였는지, 인체 접촉 여부가 어떤지, 현재 취소·취하되지 않은 제품인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 품목허가번호(MEDDEV_ITEM_NO)·품목명 같은 이름·코드 매핑이나 같은 식약처 의료기기 품목허가 데이터로만 연결합니다.
limits: 전역 조인 키가 없어 심평원 급여 목록 등 외부 데이터와 바로 결합되지 않고 이름·코드 매핑이 필요하다. 개발계정은 일 10,000회 호출로 제한된다.
