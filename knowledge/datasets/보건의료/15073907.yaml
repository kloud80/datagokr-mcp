description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 제공하는 의료기기 품목별 원자재정보입니다.  이 공공데이터는 의료기기품목일련번호와 의료기기품목허가번호를 통해 각 의료기기를 고유하게 식별하며 기관지역구분과 업종으로 제품 분류 체계를 제공합니다. 허가신고구분과 품목명 허가일자로 승인 상태와 시점을 확인할 수 있고 취소취하구분과 일자로 현재 유통 가능한 제품을 구분할 수 있습니다. 그리고 원자재명과 원재재코드는 사용된 원료의 구체적인 정보를 파악하는데 도움을 줍니다.
