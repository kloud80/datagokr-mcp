description_portal: '폐암 원내 사망을 예측할 수 있는 가상의 합성 훈련 데이터 및 가상의 합성 테스트 데이터입니다.이 데이터는 폐암 환자의 임상 정보를 기반으로 다기관에서 수집한 암 임상 라이브러리를 토대로 생성된 합성데이터로, 실제 임상 데이터를 바탕으로 통계적 특성을 유지하면서도 개인정보 유출 위험 없이 연구 및 분석에 활용할 수 있도록 구성되었습니다. 폐암의 진단, 치료, 예후 등 다양한 임상 변수들이 포함되어 있으며, 연구자들이 안전하게 활용할 수 있는 비식별 데이터입니다.제공 합성데이터량 : (삼성서울병원) 53,730명, (연세대학교병원) 49,514명, (국립암센터) 53,472명'
