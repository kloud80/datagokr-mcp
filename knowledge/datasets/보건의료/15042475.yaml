summary_user: 보건소 모바일 헬스케어 사업의 채움건강앱이 참여자에게 자동으로 보내는 알림의 제목과 내용(알림제목·알림내용)을 문구 단위로 담은 전국 범위의 작은 파일(약 1.9KB CSV)이다. 비대면 건강관리 서비스를 설계하는 보건소 담당자나 헬스케어 앱 기획자가 '건강위험군 참여자에게 어떤 독려 메시지를 보내는가'를 참고하는 데 쓴다. 보건소코드·시군구코드 같은 조인 키가 없어 다른 데이터와 키로 잇지 못하고, 같은 기관(한국건강증진개발원)의 보건소 프로그램 자료와 이름으로만 나란히 놓고 본다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.해당 내용은 보건소 모바일 헬스케어 앱에서 자동으로 발송되는 알림정보로서, 알림정보를 통해 사업참여대상자가 건강관리 동기를 독려받습니다. 제공되는 파일은 사업에 참여중인 대상자에게 채움건강앱을통해 알림제목과 알림 내용정보를 제공합니다.
