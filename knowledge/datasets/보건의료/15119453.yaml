summary_user: 간호·간병통합서비스 병동의 입원료 구분별 명칭·산정명칭·소정점수와 의과·치과용 및 한의과용 수가코드를 담은 코드표 파일로, 포털 설명상 2022년 12월말 기준 17개 시도 운영현황 자료도 함께 묶여 있다. 병원 원무·심사 담당자나 분석가가 "간호·간병통합서비스 입원료는 어떤 수가코드와 소정점수로 청구되는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 청구·진료비 자료와는 수가코드나 명칭을 직접 대조하는 방식으로만 연결한다.
description_portal: "※ 입원료 구분 수정이력  - (\"25.8.21.) 간호·간병통합서비스 운영현황은 현재 주기성 데이터로, 입원료 수가코드에 한하여 현행화하였습니다.   - (\"26.1.1.) \"26.1.1. 기준 수가코드 변경 사항(1인실 비급여 수가코드 수록, 입원관리료 명칭 일부 변경) 현행화  - ('26.7.1.) '26.7.1. 기준 수가 명칭 변경(중증환자전담병실 → 집중간호병실) 반영① 간호간병통합서비스 2022년 4분기 운영 현황 - 운영현황 기준: 2022년 12월말 - 소재지: 17개 시도 - 설립구분: 공공/민간 - 개시일: 전체 일시중단 후 재개시한 경우 재개시일자로 기재② 간호간병통합서비스 입원료구분 수가코드- 기준일자: 2025.7.1.- 세부데이터: 입원료구분, 명칭, 산정명칭, 소정점수, 수가코드※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다."
