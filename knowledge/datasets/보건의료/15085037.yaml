description_portal: '○ 통계개요* 통계명 : 청소년 비만 및 체중조절* 통계종류 : 조사통계, 일반통계* 근거법령 : 국민건강증진법 제19조* 작성목적 : 청소년(중·고등학생)의 건강행태에 대한 현황파악을 통해 청소년건강증진사업 계획 및 평가를 위한 기초자료 제공* 조사체계 : 표본학교→보건복지부(질병관리본부) - 학교컴퓨터실에서 일괄조사* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 청소년 비만 및 체중조절 등에 대한 응답률○ 용어설명* 비만율 : 2017년 소아청소년 성장도표 연령별 체질량지수 기준 95백분위수 이상인 사람의 분율또는 체질량지수 25 이상인 사람의 분율,** 체질량지수(BMI)=체중(kg)/[신장(m)]2* 월간 체중감소 시도율 : 최근 30일 동안 체중 감소를 위해 노력한 적이 있는 사람의 분율* 신체이미지 왜곡 인지율 : 2017년 소아청소년 성장도표 연령별 체질량지수 기준 85백분위수 미만인 자중에서 자신의 체형을 살이 찐 편이라고 인지하는 사람의 분율'
