summary_user: 식약처가 관리하는 의료기기 분야 국가표준(KS규격)을 표준 한 건 단위로 담으며, 표준번호·표준명·관련 기술위원회·제정일·최종 개정일·표준개발협력기관·국제표준 부합 여부·공고 규격 여부를 제공한다. 의료기기 제조·수입 사업자나 인허가 담당자가 '이 제품에 적용되는 KS 표준이 무엇이고 국제표준과 부합하며 언제 마지막으로 개정됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 의료기기 품목허가 데이터와는 표준번호나 표준명 같은 이름·코드 매핑으로만 연결한다.
description_portal: 식품의약품안전처에서는 의료기기 분야의 일명 산업표준 또는 KS규격이라 부르는 국가표준의 체계적 관리와 정보 접근성 향상을 위하여 관련 국가표준의 주요 속성정보를 공개하고 있습니다. 제공하는 정보에는 표준 번호, 표준명, 관련 기술위원회(Technical Commiittee), 제정일과 최종 개정일 등 기본정보 및 표준개발협력기관, 국제표준과의 부합 여부(부합화표준), 공고된 규격 등 주요 속성 정보를 포함하고 있어 산업표준이 필요한 이해관계자들이 이를 효율적으로 참고하고 적용할 수 있도록 지원하는데 목적이 있습니다.
