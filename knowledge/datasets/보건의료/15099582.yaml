description_portal: 질병관리청 연령별 신고 결핵 전체환자수 자료는 2001년부터 2024년까지 발생한 결핵환자를 연령대별로 구분하여 제공하는 통계입니다. 해당 자료는 5세 단위 연령 구간으로 세분화되어 있으며, 0~4세부터 시작해 80세 이상, 그리고 연령 미상 항목까지 포함하여 전체 연령층의 결핵 발생 현황을 폭넓게 파악할 수 있도록 구성되어 있습니다. 이러한 세부 구분을 통해 특정 연령대에서의 결핵 발생 경향을 분석할 수 있으며, 연령대별 예방 및 관리 정책 수립에 활용할 수 있는 기초 자료로 제공됩니다. 참고로 매년 결핵환자 신고현황 연보에 포함되는 공식 통계수치는 익년 3월 말경 확정되어 공표됩니다.
