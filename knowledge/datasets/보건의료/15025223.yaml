summary_user: 전국 의료기관별로 명칭·요양종별·주소·대표전화와 함께 진료기록 사본 발급 시간(평일·토요일), 주차 여부, 발급 절차, 온라인 발급 가능 여부, 사전신청 방법과 수령 소요일을 한 행씩 담은 안내용 파일(CSV 약 12KB)이다. 보험금 청구나 전원을 앞둔 환자·보호자가 "이 병원에서 진료기록 사본을 토요일에도 받을 수 있는지, 온라인으로 신청되는지"를 확인하는 데 쓴다. 전역 조인 키(기관 코드)가 없으므로 다른 의료기관 데이터(병의원 인허가 LOCALDATA 등)와는 의료기관 명칭과 시도·시군구 주소를 맞춰 이어 쓴다.
description_portal: '이 데이터는 의료기관의 기본 사항과 진료기록 발급 절차를 안내하는 정보로 구성되어 있습니다. 이용자는 의료기관명, 운영종별, 주소, 대표전화 등의 기본 정보와 함께 평일 및 토요일 발급 가능 시간, 주차 여부, 발급 절차, 사본 발급 문의처 등을 확인할 수 있습니다. 특히 온라인 발급 가능 여부를 제공하여 환자와 보호자가 보다 편리하게 진료기록을 발급받을 수 있도록 돕습니다. 이 자료는 의료서비스 접근성을 높이고, 국민이 필요한 의료기록을 손쉽게 찾고 이용할 수 있게 도와줍니다.컬럼명 : 순번,명칭,요양종별(명칭),우편번호,특별시-광역시-도,시-군-구,나머지 주소,주차여부,발급시간(평일)-1,발급시간(평일)-2,발급시간(토요일)-1,발급시간(토요일)-2,대표전화,사본발급 문의,발급절차,온라인 발급가능 여부,참고사항'
