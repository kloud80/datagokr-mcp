summary_user: 식품의약품안전처가 매년 승인한 마약류 취급 건수를 승인연도별로 집계해 전국 단위로 담는다(임시마약류·예고임시마약류·마약류·마약류 원료물질 취급 승인 건수). 정책 분석가나 연구자가 '최근 몇 년 사이 마약류 원료물질 취급 승인이 늘었는가'처럼 승인 유형별 연도 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 승인연도(TRTMNT_APPROVAL_DT)를 맞추거나 같은 기관의 다른 마약류 통계와 이름으로만 이어 쓴다.
limits: 전국 단위 연도 집계라 지역별·업체별·품목별 승인 내역은 알 수 없다. 의약품 표준코드 같은 공통 키가 없어 허가정보·약가 데이터와 직접 조인되지 않는다.
