description_portal: 「연도별 마약류취급승인정보」 OpenAPI는 식품의약품안전처 에서 관리하는 매년 마약류 및 마약류 원료물질의 취급 승인 현황을 제공하는 공공데이터입니다. 이 데이터에는 승인연도별로 임시마약류취급승인건수, 예고임시마약류취급승인건수, 마약류취급승인건수, 마약류원료물질취급승인건수 등이 포함되어 있습니다. 이 데이터를 통해 특정 연도의 각 마약류 취급 승인 유형별 건수를 정확히 확인할 수 있으며, 연도별 데이터를 비교하여 승인 현황의 수치적 차이를 직접 확인할 수 있습니다.
