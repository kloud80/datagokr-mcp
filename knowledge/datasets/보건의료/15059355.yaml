summary_user: 경기도 내 중독관리통합지원센터(알코올상담센터)를 센터 1곳당 1행으로 담은 현황 목록으로, 시군명·시군코드·센터명과 함께 포털 설명상 전화번호·홈페이지·지번/도로명 주소·우편번호·위경도가 들어 있다. 주민이 우리 시군에서 알코올·도박 등 중독 상담을 받을 수 있는 센터가 어디이고 연락처가 무엇인지 찾을 때, 분석가가 시군별 센터 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 시군명이나 경기도 시군코드(SIGUN_CD) 같은 같은 기관 코드, 센터 이름 매핑으로만 다른 데이터와 잇는다.
description_portal: '이 데이터는 경기도 내 중독관리통합지원센터의 운영 현황을 제공하며, 각 센터의 명칭, 전화번호, 홈페이지 주소, 소재지 정보(지번 및 도로명 주소), 우편번호, 그리고 위경도 좌표 등을 포함하고 있습니다. 중독관리통합지원센터는 알코올, 약물, 도박, 인터넷 등 다양한 중독 문제에 대한 예방, 치료, 재활 및 사회복귀 지원 서비스를 통합적으로 제공하는 지역 정신건강 기반 공공기관입니다. 데이터는 시군별 센터의 위치 분포 및 접근성 파악, 정신건강 정책 수립 및 자원 배분 계획 등에 활용되며, 홈페이지 및 연락처 정보는 지역 주민의 센터 이용 접근성을 높이기 위한 실무적 용도로도 유용합니다.중독관리통합지원센터 : 알코올, 약물, 도박, 인터넷 등의 중독 예방과 치료를 지원하는 공공 정신건강서비스 제공기관으로, 지역사회 정신건강서비스의 허브 역할을 수행함.'
