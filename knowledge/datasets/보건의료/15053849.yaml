summary_user: "부산광역시 기장군 관내 병원을 한 줄에 한 곳씩 담은 목록으로, 기관명·종별·도로명 주소·전화번호를 담는다(파일 크기 약 1.4KB의 소규모 CSV). 군민이 '우리 동네 가까운 병원이 어디고 전화번호가 뭔가'를 찾거나, 분석가가 기장군 병원 분포와 의료 접근성을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞추는 방식으로 이어 쓴다(예: LOCALDATA 병원 인허가 자료)."
description_portal: 부산광역시 기장군 관내 병원 현황에 대한 데이터(의료기관 명칭, 소재지(도로명 주소), 기관 전화번호) 등의 항목을 제공합니다. 병원 현황 데이터는 기장군에 소재하고 있는 병원의 정보를 체계적으로 정리한 공공 데이터로, 군민들이 가까운 병의원을 쉽게 찾고 이용할 수 있도록 돕기 위해 제공된 데이터입니다. 이 데이터에는 병원의 명칭, 주소, 전화번호 등의 기본적인 정보가 포함되어 있습니다. 해당 자료는 보건소를 통해 수집되며 의료 인프라 분석, 지역별 의료접근성 평가 등에도 활용됩니다. 의료기관의 종별에 따라 진료가 필요한 군민에게 유용한 정보를 제공합니다.
