description_portal: '은평구의 동물용의약품을 취급하는 도매 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 동물용의약품 도매상에 대한 인허가 정보를 제공하며,  업체명, 주소, 인허가 일자, 취급 품목, 영업상태, 허가기관 등으로 구성되어 있습니다.  가축전염병 예방, 반려동물 질병 치료, 동물보건 향상 등  다양한 목적에서 동물약품 유통관리가 중요해지고 있습니다.  본 데이터는 유통체계의 투명성 확보,  불법 약품 차단, 감염병 대응 준비도 평가 등에 활용됩니다.  또한 수의사, 약사 등 관련 전문가나 기관이  동물의약품을 적절히 활용할 수 있도록 기초자료로 제공됩니다.'
