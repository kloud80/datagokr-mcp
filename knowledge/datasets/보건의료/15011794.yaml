summary_user: 광주광역시 서구 관내 의료기기 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 영업 구분·영업소명·도로명 소재지·전화번호를 수록한다(CSV 약 73KB). 주민이나 사업자가 '서구에서 의료기기를 살 수 있는 판매업소가 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 동네별 판매업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(서구) 자료끼리만 이어 쓸 수 있다.
description_portal: 이 데이터는 광주광역시 서구 관내에서 운영 중인 의료기기 판매업소의 현황을 수록한 자료로, 영업소명, 도로명 주소, 전화번호 등의 항목으로 구성되어 있습니다.지역 내 보건의료 기반시설 중 하나인 의료기기 유통망 현황을 파악할 수 있어 보건정책 수립, 감염병 대응 장비 확보, 의료산업 인프라 분석, 의료 접근성 평가 등에 활용될 수 있습니다.또한 의료기기 판매·관리 기관의 분포를 기반으로 응급의료 대응 체계 구축, 의료취약지역 분석, 민간 의료시장 현황 파악 등 다양한 분야에서 실무 활용이 가능합니다.데이터는 연 1회 정기적으로 갱신되며, 공공저작물로 누구나 자유롭게 활용 가능합니다.
