description_portal: 부산광역시 북구 정기예방접종 정보에 대한 데이터로 국가예방접종 백신 종류, 접종 대상, 표준접종시기 및 접종횟수 등의 항목을 제공하고 있습니다. 국가예방접종은 국가가 예방접종 비용을 부담함으로써 국민의 질병 부담을 경감하고 예방접종 대상 감염병으로부터 국민 건강을 보호하는 목적으로 시행합니다. 국가예방접종사업의 목표는 공공기능 강화, 대국민 서비스 강화, 인프라 구축 및 관리를 통해 우리나라의 예방접종률 향상을 통한 예방접종 대상 감염병 퇴치를 목표로 합니다.국가예방접종은 감염병의 예방 및 관리에 관한 법률 , 감염병의 예방 및 관리에 관한 법률 시행령, 감염병의 예방 및 관리에 관한 법률 시행규칙에 근거하여 시행합니다.
