description_portal: 전남광주통합특별시 남구 관내에 위치한 보건소, 건강생활지원센터, 보건진료소(명칭, 전화번호, 주소, 위도, 경도)를 제공합니다.해당 데이터는 전남광주통합특별시 남구청 보건행정과(☎062-607-4314)에서 제공합니다.공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다.각 보건기관은 지역 주민의 건강증진, 예방접종, 장기기증, 보건위생, 금연사업, 방역소독, 감염병 관리 등 다양한 보건·의료 서비스를 담당합니다.이 데이터는 도로명 주소와 위도·경도 정보가 포함되어 있어 GIS 기반의 위치 분석이 가능하며, 주민들은 가까운 보건기관을 손쉽게 찾고 이용할 수 있습니다.
