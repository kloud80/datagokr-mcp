summary_user: 경기도 포천시 관내 의원급 의료기관을 한 곳당 한 행으로 담은 목록 파일로, 의료기관명·종별·도로명 주소·전화번호를 담는다(csv 약 4KB, 범위는 포천시 한 곳). 포천시 주민이나 분석가가 "우리 동네 근처에 어떤 의원이 있고 연락처는 무엇인가", "읍·면별로 의원이 고르게 분포하는가" 같은 질문에 쓴다. 전역 조인 키가 없어서 다른 데이터와는 도로명 주소를 지오코딩하거나 의료기관명을 맞춰 이어 써야 하며, LOCALDATA 의원 인허가 데이터나 행정구역별 인구 자료와 이런 방식으로 연결한다.
description_portal: 경기도 포천시에서 제공하는 의원 현황 데이터입니다. 본 데이터는 포천시 관내 의원급 의료기관의 현황을 제공하는 자료로, 의료기관명, 의료기관종별, 의료기관 주소, 의료기관 전화번호 등의 항목으로 구성되어 있습니다. 이를 통해 지역 내 의원의 위치, 의료기관 유형 및 분포 현황을 확인할 수 있으며, 주민들의 의료 접근성 분석, 지역 보건의료 현황 파악, 의료 인프라 분석 및 보건의료 정책 수립을 위한 기초자료로 활용할 수 있습니다. 또한 의료기관 주소 정보를 기반으로 행정구역, 인구, 생활편의시설 등 다양한 공공데이터와 연계·분석이 가능하여 지역별 의료서비스 현황 분석과 데이터 기반 보건 행정에 활용할 수 있는 공공데이터입니다. 본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
