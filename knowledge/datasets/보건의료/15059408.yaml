summary_user: 경기도 내 종합병원을 한 곳당 한 행으로 담은 인허가 원천 자료로, 병원명·인허가일자·영업상태·폐업일자와 병상 수·허가병상 수·의료인 수·입원실 수·진료과목·구급차 수, 주소와 위경도 좌표를 포함한다. 분석가나 보건정책 담당자가 '경기도 어느 시군에 종합병원 병상과 의료인이 부족한가'를 따지거나, 병원 개폐업 흐름을 지역 의료 인프라 변화의 신호로 볼 때 쓴다. 전역 공통 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)이나 병원명 매핑으로 같은 기관의 다른 LOCALDATA 인허가 자료와 잇고, 정제 주소·좌표로 공간 결합을 한다.
description_portal: 이 데이터는 경기도 내 병원급 종합병원의 현황을 정리한 자료로, 병원명, 인허가일자, 병상 수, 의료인 수, 입원실 수, 진료과목 등의 정보를 포함하고 있습니다. 종합병원은 다양한 진료과목을 운영하며 응급·외래·입원 진료를 종합적으로 제공하는 핵심 의료기관으로, 본 자료는 지역별 의료 인프라의 규모와 분포, 진료 서비스의 다양성, 인력 확보 현황을 분석하는 데 유용합니다. 병상 수와 진료과목은 병원의 의료 역량과 전문성을 보여주는 주요 지표이며, 의료인 수와 입원실 수는 서비스 제공 가능 범위를 나타냅니다. 이 데이터는 경기도 내 의료서비스 접근성 평가, 지역 간 의료격차 해소 전략 마련, 보건정책 수립 및 의료자원 배분에 기초 자료로 활용될 수 있습니다.
