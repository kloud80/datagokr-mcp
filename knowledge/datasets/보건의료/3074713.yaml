description_portal: '본 자료는 「검역법」에 따라 실시된 선박 검역정보 중 수입 고철에 대한 소독결과 정보로 이루어져 있음. 주요 구성 항목은 검역구분, 검역일시, 선박명, 선박국적, 출항국가, 고철적재량, 수입국가, 수입자, 소독대행업체, 소독일시, 소독약품 등으로 이루어져 있으며, 선박을 통해 수입한 고철 관련 검역 및 소독 결과에 관한 사항을 기록한 자료임.* 검역소: 감염병의 국내외 전파 방지를 위한 검역ㆍ방역에 관한 사무를 분장하기 위하여 질병대응센터센터 소속으로 국립검역소를 둔다. 총 13개의 국립검역소 중 증명서를 발급한 검역소명이 기재됨'
