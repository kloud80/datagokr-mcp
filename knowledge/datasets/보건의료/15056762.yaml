summary_user: 경기도 내 위생관리용역업 사업장을 한 곳씩 담은 인허가 현황으로, 시군명, 사업장명, 인허가일자, 영업상태와 폐업일자, 위생업종·업태, 도로명·지번 주소, 위도·경도 좌표가 들어 있다. 건물 위생관리 업체를 찾거나 시군별로 업체가 얼마나 등록·폐업했는지, 어디에 몰려 있는지 살피는 분석가·사업자가 '우리 시군에 운영 중인 위생관리용역업체는 몇 곳이고 최근 폐업은 얼마나 되나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 위생관리용역업 관련 사업장의 현황을 집계한 자료로, 각 사업장의 시군명, 인허가일자, 영업상태(운영중, 폐업 등), 폐업일자, 위생업종 및 업태명, 소재지(도로명주소 및 지번주소), 위도·경도 좌표 등을 포함합니다. 사업장명과 다중이용업소 여부 정보도 함께 제공되어, 지역 내 위생관련 용역업체의 등록·운영 현황, 지리적 분포, 영업 변동 상황을 종합적으로 파악할 수 있습니다. 해당 데이터는 위생관련 산업의 정책 수립, 건물 위생관리 서비스 수요 분석, 폐업률 및 신규등록 현황 파악, 공간정보 기반 관리 시스템 구축 등에 활용될 수 있습니다.
