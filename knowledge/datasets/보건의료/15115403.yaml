summary_user: 서울 중랑구 안에서 인공 치아를 만들거나 고치는 치과기공소의 인허가 내역을 업소 한 곳당 한 건으로 담는 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·주소·전화번호·중부원점TM(EPSG:5174) 좌표와 기공 장비 보유 수량 항목이 들어 있다. 치과 관련 창업자나 상권 분석가가 '중랑구에서 최근 문을 열거나 닫은 치과기공소가 어디이고 몇 곳인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 LOCALDATA 형식의 치과·병의원 인허가 데이터와 나란히 놓고 보는 방식이 현실적이다.
description_portal: '서울특별시 중랑구의 인공 치아를 제작하거나 보수하는 업소정보입니다. 영업상태명, 전화번호, 주소, 사업장명등의 정보를 포함합니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 주소, 사업자명, 좌표정보 등이 있습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
