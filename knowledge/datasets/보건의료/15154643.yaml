summary_user: 전국 자치단체가 관리하는 부속의료기관(사업장 소속 직원·가족 건강관리용 부속의원·부속병원) 인허가 정보를 사업장 1곳당 1건으로 담으며, 사업장명·인허가일자·영업상태·휴폐업일자·주소·좌표·병상수·의료인수 등을 포함한다. 분석가나 사업자가 '우리 지역에서 최근 폐업하거나 새로 허가된 부속의료기관은 어디인가'처럼 개폐업 추이와 위치를 확인하는 데 쓴다. 전역 조인 키는 없어 개방자치단체코드(OPN_ATMY_GRP_CD)와 주소·좌표로 다른 LOCALDATA 인허가 데이터나 행정구역 데이터와 맞춰 연결한다.
limits: 조회 시 기준일자와 개방자치단체코드를 필수로 넘겨야 하므로 해당 코드를 먼저 확보해야 하고, 이력(/history) 오퍼레이션은 최소 파라미터로는 응답이 없었다. 좌표는 보정계수가 없는 Bessel 중부원점TM(EPSG:5174)이라 지도에 올리려면 좌표 변환이 필요하다.
