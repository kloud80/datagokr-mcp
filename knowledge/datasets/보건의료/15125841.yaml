summary_user: 울산시설공단이 운영하는 공공시설에 설치된 자동심장충격기(AED)를 한 대씩 기록한 건별 원천 파일로, 시설명·주소·상세위치·운영 시작/종료 시간·연락처·위도·경도·기준일자를 담는다(CSV 약 4.8KB 규모). 울산 시민이나 응급 안내 서비스 개발자가 '지금 이 근처 공단 시설에서 쓸 수 있는 AED가 어디에 있고 몇 시까지 접근 가능한가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 AED·응급의료 데이터와는 위도·경도 좌표 근접이나 주소·시설명 매칭으로 이어 쓴다.
description_portal: 울산시설공단에서는 시민의 생명을 보호하고 응급상황에 신속히 대응할 수 있도록, 공공시설 내에 설치된 자동심장충격기(AED)의 위치 및 운영 정보를 공공데이터로 제공합니다. 이 데이터는 시설명, 주소, 상세위치, 운영 시작 시간, 운영 종료 시간, 연락처, 위도, 경도, 기준일자 등의 항목으로 구성되어 있으며, 시민들이 위급 상황 발생 시 가까운 AED 위치를 빠르게 확인하고 사용할 수 있도록 돕습니다. 특히 위도와 경도 정보는 지도 기반의 위치 안내에 유용하게 활용될 수 있으며, 운영시간 정보는 실제 접근 가능 시간대를 확인하는 데 중요한 역할을 합니다.
