description_portal: '질병관리청 감염병포털을 통해 제공하는 동물인플루엔자 인체감염증 정보로, 감염병 발생에 대한 통계, 시각화 자료 등을 제공합니다.* 의료기관 신고일 기준으로 집계함* 지역별 통계는 환자주소지 기준으로 집계함* 제1급감염병: 생물테러감염병 또는 치명률이 높거나 집단 발생의 우려가 커서 발생 또는 유행 즉시 신고하여야 하고, 음압격리와 같은 높은 수준의 격리가 필요한 감염병으로서 다음 각 목의 감염병을 말한다. 다만, 갑작스러운 국내 유입 또는 유행이 예견되어 긴급한 예방ㆍ관리가 필요하여 질병관리청장이 보건복지부장관과 협의하여 지정하는 감염병을 포함한다.'
