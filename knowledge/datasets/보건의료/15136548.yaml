description_portal: 연별 의료기관 종별 의료용 마약류 처방 현황 서비스는 2019년 이후의 데이터(취급년월, 의료기관 종별명, 처방기관수, 처방의사수, 처방환자수, 처방건수, 처방량)를 제공합니다.연간 기준으로 의료기관종별 의료용 마약류 처방 규모, 처방 의사·환자 수 변화, 처방 건수 및 총량 추이 등을 확인할 수 있습니다.※ 이 데이터는 「마약류 관리에 관한 법률」 제11조에 따른 '마약류 취급보고 제도'가 2018년 5월부터 시행됨에 따라 '마약류통합정보관리센터' 및 '마약류통합관리시스템' 운영을 통해 보고된 의료용 마약류 취급 기관, 의사 및 환자 수 등을 기반으로 집계됩니다.
