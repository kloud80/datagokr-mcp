summary_user: 2019년 이후 의료용 마약류 처방을 연도별·의료기관 종별(의료기관종별명)로 묶어 처방기관수·처방의사수·처방환자수·처방건수·처방량을 담은 전국 단위 집계 데이터이다. 정책 분석가나 연구자가 '상급종합병원·의원 등 종별로 의료용 마약류 처방 환자 수와 처방량이 해마다 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 마약류·의료기관 통계와는 연도(취급년월)와 의료기관 종별 이름을 맞춰 붙여 써야 한다.
limits: 전국 합계만 있고 지역 구분이 없어 시도·시군구별 비교에는 쓸 수 없으며, 개별 기관·의사·약품 단위 처방 내역도 담지 않는다. 공통 코드 없이 종별 이름으로만 다른 데이터와 연결되므로 명칭 표기 차이를 확인해야 한다.
