description_portal: '1. 건강검진사업년도: 2023~2024년2. 시도 및 시군구: 경기도 안산시 상록구 및 단원구 3. 성별: 남자, 여자4. 연령: 10~70대(10세 단위), 80대 이상5. 수검자수: 외국인등록상 거주지 기준 수검자수 6. 흡연자수: 공통 문진표 4번 문항에서 "2. 예"로 응답하고, 4-1번 문항에 "1. 현재 피움"으로 응답한 경우"7. 위험 음주자 - (과음) 문진7-1 일주일 음주량 : 65세 미만 남성 14잔초과, 65세 미만 여성 및 65세 이상 남성 7잔초과, 65세이상 여성 3잔 초과 - (폭음) 문진7-2 최대 음주량 : 남성 4잔초과, 여성 3잔초과8. 건강증진 신체활동:  문진 8-1, 8-2, 9-1, 9-2 신체활동 시간(분)계산 (시간(분) 값이 존재하면 주당횟수는 1로함) (고강도 신체활동 주당 횟수 * 시간(분)*2)+(중강도 신체활동 주당횟수 * 시간(분)) >= 300분이상9. 근력운동 적정자수: 문진 10번문항에서 2회이상 응답10. 고혈압 - 질환의심자: 질환의심 판정 상 사유가 "고혈압"인 자 - 유질환자: 판정 상 사유가 "고혈압"인 자11. 이상지질혈증 - 유질환자: 유질환자(D) 이상지질혈증 해당 - 질환의심자: 질환의심(R1) 이상지질혈증의심 해당12. 비만 - 저체중: BMI(kg/m2) 결과 0.1 ~ 18.4 - 과체중(정상B(경계)): BMI(kg/m2) 결과 25 ~ 29.9 - 비만(질환의심): BMI(kg/m2) 결과 30 이상13. 우울증 - 우울증상이 없음(0~4점) - 가벼운 우울증상(5~9점) - 중간 정도 우울증 의심(10~19점) - 심한 우울증 의심(20~27점)※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의'
