summary_user: 경기도 내 어린이 국가예방접종 지정의료기관을 기관 한 곳당 한 행으로 담으며, 시군명·시설명·전화번호·지정일자·도로명/지번 주소·우편번호·WGS84 위경도를 포함한다. 보호자가 우리 동네에서 아이 필수 예방접종을 받을 수 있는 병의원이 어디인지 찾거나, 분석가가 시군별 지정의료기관 분포와 접근성 격차를 지도로 볼 때 쓴다. 전역 조인 키는 없으며, 시군 코드(SIGUN_CD)·시군명으로 경기도 시군 단위 통계와 맞추거나 주소·좌표로 다른 의료기관 목록과 이름·위치를 대조해 잇는다.
description_portal: 질병관리본부에서 제공하는 경기도 내의 시군별 어린이 국가 예방접종지정 의료기관에 대한 시설명, 전화번호, 지정일자, 소재지주소 등의 현황입니다.이 데이터는 경기도 내 어린이 국가예방접종을 실시하는 지정의료기관의 현황을 정리한 자료입니다. 주요 항목으로는 시군명, 시설명, 전화번호, 우편번호, 도로명 및 지번주소, 지정일자, 위도(WGS84), 경도(WGS84) 등이 있으며, 예방접종이 가능한 병의원 정보를 체계적으로 제공하고 있습니다. 해당 의료기관들은 어린이 필수 예방접종 사업에 참여하고 있으며, 주소 및 좌표정보를 활용해 접근성 분석, 예방접종 수요-공급 불균형 해소, 공공보건 지도화(GIS) 등에 유용하게 활용될 수 있습니다. 또한, 예방접종 예약 안내, 접종 시기 관리, 지역별 접종률 모니터링 등 보건소 및 관련 기관의 업무 효율화에도 기여합니다. 데이터는 질병관리청 또는 관할 보건소에서 수집된 공공보건 정보이며, 각 기관의 위치 및 연락처 정보를 통해 국민이 가까운 지정의료기관을 쉽게 찾을 수 있도록 지원합니다.
