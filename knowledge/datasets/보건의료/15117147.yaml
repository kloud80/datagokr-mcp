summary_user: 식품의약품안전처가 혁신의료기기로 지정한 제품을 제품(모델)별로 한 건씩 담은 전국 단위 현황으로, 업소명·품목명·모델명·지정일·판매시작일시·시판후보고일·지정여부를 제공한다. 의료기기 제조사·개발자가 "이 제품은 언제 혁신의료기기로 지정됐고 언제부터 판매됐으며 시판 후 보고일은 언제인가"를 확인하거나, 의료기관이 도입 검토 중인 제품의 지정 여부를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·품목명·모델명 같은 이름 매칭이나 같은 식약처 데이터의 코드 매핑으로만 이어 쓴다.
description_portal: 식품의약품안전처 「혁신의료기기 지정 현황」 OpenAPI는 혁신 의료기기로 지정된 제품들의 기본 현황 정보를 제공합니다. 제공 항목에는 업소명, 품목명, 모델명, 지정일, 판매시작일시, 시판후보고일, 지정여부가 포함되어 있어 사용자는 특정 의료기기가 언제 지정되었고 언제 판매를 시작했으며 시판 이후 보고 절차가 적용되는지 여부를 확인할 수 있습니다. 이를 통해 의료기기 제조사와 개발자는 혁신 의료기기의 지정일, 판매 시작일, 시판 후 보고일 등을 확인해 시장 진입 및 관리 요건을 파악할 수 있고, 의료기관은 혁신 의료기기 지정 여부를 참고해 제품 검토에 활용할 수 있습니다.
