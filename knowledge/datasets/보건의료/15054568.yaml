description_portal: 생명윤리 및 안전에 관한 법률 제29조제1항에 따라 시험관 아기와 같은 체외 수정을 통해 임신 목적으로 생성되어 보존 중 배아는 동의권자가 정한 보존기간이 경과하고, 더 이상 임신 목적으로의 이용계획이 없는 경우(이를 "잔여 배아"라 한다.) 동의권자가 연구목적으로 이용에 동의하는 경우 발생학적으로 원시선이 나타나기 전까지만 체외에서 제한된 연구 목적으로 이용할 수 있디. 잔여 배아를 연구하려는 자는 같은 법 제29조제2항에 따라 시설, 인력 등을 갖추어 배아연구기관으로 등록하여야 한다.생명윤리 및 안전에 관한 법률 제29조제2항 및 같은 법 시행규칙 제26조에 따라 질병관리청에 등록완료된 배아연구기관에 대한 데이터로 등록번호, 기관명, 소재지 항목 현황을 제공합니다
