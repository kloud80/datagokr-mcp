description_portal: 본 데이터는 한국보건산업진흥원이 제공하는 국민영양통계 원본자료를 기반으로, 2020년부터 2023년까지 국민의 영양소별 평균섭취량을 정제·가공하여 제공하는 파일데이터이다. 기존에 연도별, 성별, 연령층별, 지역별로 구분되어 있던 자료를 하나의 파일로 통합하고, 연도, 분석기준, 기준값, 영양소명, 평균섭취량 및 표준오차 항목으로 재구성하였다. 이용자는 에너지 및 주요 영양소의 평균적인 섭취 수준을 확인하고, 성별·연령층·지역별 차이와 연도별 변화 추이를 비교·분석할 수 있다. 국민 영양상태 평가, 영양섭취 취약계층 발굴, 만성질환 예방정책, 건강증진사업, 식생활 교육, 학술연구, 통계분석, 정책 시뮬레이션 및 인공지능 기반 영양예측 등에 활용할 수 있다.
