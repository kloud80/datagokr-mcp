summary_user: 전국 보건소 가운데 관할 법정동을 따로 분리해 관리하는 보건소에 대해, 보건소(보건소기호·보건소명)와 그 보건소가 맡는 시도·시군구·법정동 코드 및 법정동명을 사업년도별로 행 단위로 담은 관리 내역 파일(CSV 약 19KB)이다. 특정 법정동 주민이 어느 보건소 관할인지, 또는 시군구 경계와 다르게 관할이 나뉜 보건소가 어디인지 확인하려는 분석가·행정 담당자가 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 인구·주소·행정구역 데이터나 다른 법정동 기반 보건의료 통계와 이어 쓴다.
description_portal: '본 데이터는 전국 보건소별로 관할 법정동을 별도 관리하는 경우의 분리 관리 내역을 수록한 자료입니다.□ 데이터 개요o (대상): 전국 보건소 중 일부 법정동을 분리하여 관할하는 기관이 대상o (내용): 보건소별로 관할 법정동 관리가 따로 필요한 경우, 보건소 요청에 의하여 따로 분리보건소 및 법정동 정보를 관리하고 있음- 분리보건소기호, 시도코드, 시군구코드, 법정동코드, 법정동명(분리 보건소 기호 및 식별정보, 해당 보건소가 관리하는 시도·시군구·법정동 코드 및 명칭, 관할구역 설정 목적의 행정 관리 기준)'
