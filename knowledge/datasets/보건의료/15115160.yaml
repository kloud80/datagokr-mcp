description_portal: '본 데이터는 노인장기요양보험 수급자 중 배회감지기(위치추적기) 대여 서비스를 이용한 수급자 현황을 정리한 자료로, 장기요양 등급별, 지역별(시도·시군구) 이용자 수를 연도별로 제공합니다. 배회감지기는 치매 등으로 인한 인지 저하로 실종 우려가 있는 수급자 보호를 위해 제공되는 복지용구로, 공공정책 수립, 지역별 수요분석, 고위험군 보호사업 기획 등에 활용될 수 있습니다.1. 연도: 2020~2023년2. 품목명: 배회감지기(GPS형), 배회감지기(매트형)3. 시도별4. 시군구별5. 장기요양등급별 배회감지기 대여 이용자 현황   - 1~5등급, 인지지원등급※ 민원인의 제공 신청에 따라 2023.6.22. 최조 제공 후, 2024.2.7. 수정 발췌(2023년 자료 추가)한 데이터로서,   지역(실거주지)·등급 변경 중복 및 사망자 포함※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
