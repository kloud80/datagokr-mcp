summary_user: 전국 시군구별로 주요 정신질환의 진료년도·성별·연령구분별 환자수, 입내원일수, 요양급여비용을 담은 건강보험 심사결정 기준 집계 통계 파일이다. 지자체 정신건강 담당자나 분석가가 '우리 시군구에서 우울증·조현병 같은 주요 정신질환 진료 환자가 연령·성별로 얼마나 되고 진료비는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 시도·시군구 이름을 행정구역 코드로 매핑하거나 상병구분 이름으로 다른 진료통계·인구통계와 맞춰 이어 쓴다.
description_portal: '주요 정신질환 진료통계 - 보험자 구분: 건강보험 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2024년 1월~12월, 심사년월: 2024년 1월~2025년 4월 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 질병은 주상병 기준이며 의료기관에서 의사가 진료 시 환자의 호소, 증세에 따라 일차적으로 진단명을 부여하여 진료비 청구가 이루어짐에 따라 실제 최종 확정된 질병과는 차이가 발생할 수 있음※ 지역은 요양기관 소재지 기준이며 수진자의 거주지와 다를 수 있음※ 연령별 환자는 명세서에 기재된 수진자의 만(滿)나이 기준으로 범주 내 동일인의 중복을 제거한 값이지만, 진료시점에 따라 중복집계될 수 있으며 다른 범주와 단순합산할 경우 중복이 발생할 수 있음※ 건수 10 미만은 "0"으로 기재'
