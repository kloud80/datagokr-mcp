description_portal: 이 데이터는 구로구 전체 법정동에 대해 월 단위 코로나19 확진자 수를 집계한 지역별 감염 분포 자료이다. 행정동별 확진자 규모를 동일한 시간 축에서 비교할 수 있으므로, 특정 동의 위험도, 인구 밀도 대비 감염률, 전파 취약 지역 등을 정밀하게 파악할 수 있다. 월 단위 수집 방식은 일 단위보다 변동성을 줄여 장기 추세 분석에 적합하며, 각 동의 생활환경·유동인구·주거 구조와 연계하여 감염 요인을 연구하는 데도 유용하다. 이 데이터는 지역 맞춤형 방역정책 수립, 취약 지역 집중 관리, 행정 대응 자원 배분 등 구로구 공공보건 의사결정의 기반이 된다.
