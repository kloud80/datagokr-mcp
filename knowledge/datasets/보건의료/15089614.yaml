summary_user: 4단 상병(주상병코드)과 의료기관 종별로 나눈 연도별 건강보험 진료 통계로, 환자수·명세서 청구건수·입내원일수·보험자부담금·요양급여비용총액을 담은 집계 파일이며 범위는 전국이다(약국 제외, 양방만, 심사 결정분 기준). 보건의료 분석가가 '특정 질병으로 상급종합병원과 의원을 찾은 환자 수와 진료비가 각각 얼마인가'처럼 질병별 의료기관 이용 구조와 비용을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주상병코드(질병분류 코드명 매핑)나 의료기관 종별 이름을 맞춰 연결해야 한다.
description_portal: '4단상병별 의료기관종별 건강보험 진료비 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2022년 1월~12월, 심사년월: 2022년 1월~2023년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 질병은 주상병 기준이며 의료기관에서 의사가 진료 시 환자의 호소, 증세에 따라 일차적으로 진단명을 부여하여 진료비 청구가 이루어짐에 따라 실제 최종 확정된 질병과는 차이가 발생할 수 있음※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
