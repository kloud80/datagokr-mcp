summary_user: 국세청 국세통계연보를 바탕으로 지역특산주의 전국 출고량을 연도별로 정리한 집계 파일로, 합계와 탁주·약주·청주·과실주·증류식소주·일반증류주·리큐르·기타주류 등 주종별 값을 한 행에 담는다(약 1KB 규모의 CSV). 음주폐해예방 연구자나 정책 분석가가 "지역특산주 출고가 해마다 어떻게 변했고 어떤 주종이 늘었나"를 확인하는 기초자료로 쓴다. 전역 조인 키나 지역 코드가 없어 다른 데이터와는 연도(연도) 기준으로만 이어 쓰며, 같은 기관의 다른 절주(알코올 생산과 소비) 지표와 연도로 맞춰 비교하는 방식이 현실적이다.
description_portal: 음주폐해예방 관련 지표- 국세청 국세통계연보를 바탕으로, 지역특산주의 연도별 출고 현황을 보여주는 데이터입니다. - 지역특산주는 「농어업·농어촌 및 식품산업 기본법」 제3조 제3호에 따른 농어업경영체 또는 제4호에 따른 생산자단체 중 농림수산식품부장관이 추천한 자가 직접 생산하거나, 주류제조장 소재지 관할 시·군·구 및 그 인접 지역에서 생산된 농산물을 주된 원료로 하여 제조하는 주류를 의미합니다. - 지역특산주 출고량은 국내분 탁주 및 약주 출고량에 포함되어 집계됩니다.- 본 데이터는 음주폐해예방 관련 연구 수행시 기초자료로 활용할 수 있습니다.
