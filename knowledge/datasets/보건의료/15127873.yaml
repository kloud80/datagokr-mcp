summary_user: 병원급 이상 의료기관(상급종합병원·종합병원·병원·요양병원·치과병원·한방병원·정신병원)에 종사하는 의사·치과의사·한의사·간호사·간호조무사·의료기사·약사 등 직종별 인원을 연도·시도 단위로 집계한 통계로, 2015~2023년 매년 말 기준 전국 시도를 담는다. 정책 분석가나 지역 보건 담당자가 '우리 시도 병원의 인구 대비 간호사·의사 수가 다른 시도보다 적은가, 몇 년 사이 어떻게 변했나' 같은 지역 간 의료인력 격차와 추이를 볼 때 쓴다. 전역 조인 키는 없으므로 시도 이름을 기준으로 시도별 인구·병상·의료기관 수 통계와 이름 매핑해 붙여 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 시도명 매핑으로만 연결된다. 집계 단위가 시도라서 시군구나 개별 의료기관 단위의 인력은 알 수 없다. 포털 설명에 따르면 이 통계는 2023년 말로 종결되고 2024년부터 '의료기관 종사 의료인력 수_시도별'로 개편되었으며, 매년 말 기준이어서 현재 인원과 다를 수 있다.
