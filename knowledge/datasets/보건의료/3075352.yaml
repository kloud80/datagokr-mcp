description_portal: '□ 데이터 개요본 데이터는 국민건강보험공단에서 운영하는 ‘건강모아(구 건강iN)’의 콘텐츠별 이용현황을 집계한 자료입니다.방문자 수와 페이지뷰 수를 중심으로 콘텐츠별 이용 패턴을 분석하여 서비스 운영 및 개선에 활용합니다.□ 주요 내용콘텐츠: 건강모아에서 제공되는 각종 건강정보 콘텐츠 구분방문자수: 각 콘텐츠를 방문한 이용자 수페이지뷰어: 각 콘텐츠에서 조회된 페이지 수□ 참고사항2020년 홈페이지 개편으로 인해 일부 내부 항목이 변경 및 삭제되었으며, 서비스 명칭도 ‘건강iN’에서 ‘건강모아’로 변경되었습니다.이로 인해 개편 전후 데이터 항목 간 차이가 있을 수 있으니 참고 바랍니다.'
