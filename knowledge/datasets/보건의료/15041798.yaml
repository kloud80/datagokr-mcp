summary_user: 강원특별자치도 원주시에 허가·등록된 의약품 공급업체(도매상·유통업체)를 업체 한 곳당 한 행으로 담은 파일로, 영업소명·도로명 소재지·전화번호·의약품유통품질관리기준(KGSP) 적격 여부와 데이터 기준일자가 들어 있다(CSV 약 6KB). 원주 지역 약국·의료기관이나 사업자가 "이 도매업체가 원주시에 정식 등록돼 있고 KGSP 적격인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소 문자열 매칭으로만 연결하며, 식약처 품목기준코드 같은 코드로는 이을 수 없다.
description_portal: 이 데이터는 강원특별자치도 원주시에 정식으로 허가 등록된 의약품 공급업체 (도매상 및 유통업체)의 현황을 투명하게 공개하여 의약품의 안정적인 유통과 안전 관리를 확보하며, 공중 보건 행정의 투명성을 높이기 위해 구축되었습니다. 해당 기관에서 의약품 공급업체의 허가 및 등록 정보를 공적 자료를 통해 수집하고 정제했습니다. 이 정보는 지역 내 의약품 공급망의 정식 허가 여부를 확인하는 데 필수적이며, 시민들이 신뢰할 수 있는 정보를 바탕으로 지역 보건 환경에 대한 이해도를 높이도록 지원합니다. 모든 정보는 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있습니다.
