description_portal: '○ 통계개요* 통계명 : 장기등 기증희망등록자 현황* 작성목적 : "장기등 이식에 관한 법률"에 의거 장기의 공정하고 효율적인 배분 및 관리를도모하고, 장기의 불법 매매행위를 방지하여 국민보건향상에 이바지함을목적으로 함* 법적근거 : ?장기등 이식에 관한 법률? 제10조 제2항 제4호* 조사체계 : 장기이식관련기관, 제대혈이식관련기관, 장기기증희망등록기관으로부터정보를 통보받아 작성* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 장기기증 희망을 등록한 사람의 수○ 용어설명* 장기등: 사람의 기관 또는 조직중 다른사람의 장기 등의 기능회복을 위하여 적출하여이식될 수 있는 있는 것- 신장, 간장, 췌장, 심장, 폐, 골수, 각막 등 사람의 여러 기관* 장기등 기증희망등록자 : 본인이 장래에 뇌사 또는 사망시에 장기등을 기증하겠다고장기이식등록기관에 등록한 자'
