summary_user: 시군구별로 주상병 대분류(한국표준질병사인분류 대분류)에 따른 건강보험 급여 실적을 진료년도 단위로 집계해 진료실인원, 입내원일수, 급여일수, 진료비, 급여비를 담은 전국 범위 파일이다. 지역 보건 분석가나 지자체 담당자가 '우리 시군구에서 어떤 질병 대분류의 진료 인원과 진료비가 많은가'를 다른 지역과 비교하는 데 쓴다. 전역 조인 키가 없어 시도·시군구 이름이나 질병 대분류 코드를 매핑해 인구·지역 통계와 이어 쓴다.
description_portal: '2021년 질병코드 대분류별 입원 진료 현황1. 수진기준(한의분류 제외, 약국제외)2. 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 진료기간: 2010년~2021년 (2022년 6월 지급분까지 반영)3. 아래 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소,증세 등에 따라   일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음      -주상병코드:  표 참조(한국표준질병사인분류의 대분류별)* 상병중분류(298분류코드), 상병소분류별 등 더 세분화된 분류의 자료는 그 양이 방대하여 전산매체로 제공 불가하오니 양해하여주시기 바랍니다.※ 개인정보 식별 위험이 있는 경우, 해당 지역의 데이터값 제외 후 제공'
