description_portal: 이 데이터는 충청남도 금산군 내 병원, 의원 등 의료기관에 설치되어 있는 진단용 방사선 발생장치(X‑RAY) 및 특수의료장비(CT·유방촬영용장치 등)의 현황을 제공합니다. 장비종류 및 모델명, 제조번호, 의료기관명, 장비검사일자 등을 포함해 제공하고 있으며, 2026년 7월 기준 관내 진단용 방사선 발생장치 및 특수장비는 총 213건입니다. 해당 데이터를 활용하여 지역별, 의료기관별 방사선 장비 보급률을 분석해 의료 자원이 적재적소에 배치되어 있는지 파악할 수 있습니다. 또한 보건의료 정책 수립 및 의료기기 산업체 시장 분석, 학계의 보건 통계 연구를 위한 기초 자료로 활용할 수 있습니다.
