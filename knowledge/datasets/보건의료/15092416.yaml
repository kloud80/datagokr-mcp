limits: 표준 조인 키가 없어 지역사회 건강조사 등 시군구 지표와 붙이려면 기관명·지역명을 직접 매핑해야 한다. 기관 단위 집계라 개별 교육의 일자·제목·장소 같은 건별 내역은 이 파일에 없다.
