summary_user: 의료기기 회수·폐기 건별로 회수방법 대분류·소분류와 방법별 결과 내용, 보고 구분, 보고 제출·승인일자, 업소명·대표자·업종·주소, 공개마감일을 담은 전국 단위 원천 데이터입니다. 소비자·의료기관·분석가가 "이 업체가 회수한 의료기기는 인수·개수·환자모니터링 중 어떤 방법으로 처리됐고 결과는 어땠나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 의료기기 데이터와는 업소명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 공공데이터는 회수폐기방법별결과에 대한 정보를 담고 있으며 회수방법대분류, 회수방법소분류, 회수방법결과내용, 회수폐기보고구분코드, 회수폐기보고구분,보고승인일자, 보고제출일자, 업소명, 대표자명, 업종구분코드, 업종구분명, 업소주소, 공개마감일 등의 정보를 제공합니다.회수 폐기가 의료기기법에 따라 신뢰성 있는 회수가 이뤄졌는지 확인하기 위하여, 회수폐기 방법별 결과를 작성하여야 합니다. 회수 방법에는 인수, 개수, 환자모니터링 등 다양한 처리할 수 있으며, 해당정보는 반드시 제공하여야 합니다.
