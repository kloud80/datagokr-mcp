description_portal: '이 데이터는 서울특별시 각 자치구별 코로나19 백신 접종 현황을 시기별로 정리한 통계자료이다. 2~6월 접종실적부터 시작해 7월 말, 8월 말, 9월 말, 10월 말 기준으로 1차 접종자, 2차 접종자, 추가접종자(부스터샷) 누적 인원을 포함하고 있다. 종로구·중구·용산구·성동구·광진구 등 모든 자치구의 접종 추이를 비교할 수 있으며, 시기별 증가량과 접종 속도 차이도 확인 가능하다. 이를 통해 서울시 전체의 백신 접종 확산 속도, 행정구별 접종 참여도, 방역 정책 효과 등을 분석할 수 있다. 또한 시점별 누적 수치를 제공하므로 접종률 추세 분석, 접종률 격차 파악, 행정적 대응 및 보건정책 설계에 활용하기 적합한 구조로 구성되어 있다.※ ‘21.10.31.24시 기준, 상기 통계는 질병보건통합시스템에 따른 잠정수치로 변동 가능함. ※ 시스템 상 6월 이전 수치는 표출되지 않아 6월 말 자료부터 제공 가능함.문의처 : 보건의료정책과(02-2133-9677)'
