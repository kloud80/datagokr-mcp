description_portal: 해당 데이더는 양평군 관내 안경원에 대한 현황을 나타내는 데이터입니다.안경점명, 소재지도로명주소, 전화번호에 대한 정보를 제공합니다.의료기사 등에 관한 법률에 따라 안경사가 아니면 안경업소의 개설등록을 할 수 없으며, 안경 및 콘택트렌즈는 안경업소에서만 판매하여야 합니다. 안경, 렌즈를 구매하려는 구매자 또한 안경업소에서만 구매할 수 있습니다.본 데이터는 지역내 안경업소 분포 파악, 민원 처리, 보건정책 수립 등 다양한 활용을 목적으로 제공합니다.또한 지역 주민의 안경업소 접근성 향상과 이용편의를 높이기 위한 기초자료로 활용될 수 있습니다.
