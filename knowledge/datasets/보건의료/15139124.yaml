summary_user: 마약류 취급보고 제도로 보고된 의료용 마약류 취급자 수를 전국 시도별·취급년월별로 집계해 담으며, 합계와 함께 수출입업자·제조업자·도매업자·종합병원·의원·동물병원·소매업자·학술연구자 등 취급자 유형별 보고자 수를 나눠 제공한다. 분석가나 지자체 담당자가 '우리 시도에 의원·약국 등 마약류 취급자가 몇 곳이고 다른 시도와 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명(SIDO_NM)과 취급년월을 이름·기간 기준으로 맞춰 시도별 인구·의료기관 통계 등과 이어 쓴다.
description_portal: 월별 행정구역별 마약류 취급자 분포 현황 서비스는 2019년 이후의 데이터(취급년월, 시도명, 합계보고자수, 수출입업자보고자수, 제조업자보고자수, 원료사용자보고자수, 도매업자보고자수, 종합병원보고자수, 병원보고자수, 요양병원보고자수, 의원보고자수, 치과병원보고자수, 치과의원보고자수, 한방병원보고자수, 공중보건의료보고자수, 동물병원보고자수, 소매업자보고자수, 학술연구자보고자수)를 제공합니다.지역별 의료용 마약류 취급자 현황을 확인할 수 있습니다.* 2019 ~ 2023년은 연간 데이터이며, 2024년 이후 부터 월간데이터로 구성됩니다.※ 이 데이터는 「마약류 관리에 관한 법률」 제11조에 따른 '마약류 취급보고 제도'가 2018년 5월부터 시행됨에 따라 '마약류통합정보관리센터' 및 '마약류통합관리시스템' 운영을 통해 보고된 의료용 마약류 취급 기관, 의사 및 환자 수 등을 기반으로 집계됩니다.
