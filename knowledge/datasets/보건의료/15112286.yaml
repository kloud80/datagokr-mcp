summary_user: 국립공주병원 한 곳의 2025년 외래진료 현황을 초진·재진 환자 수와 진료일수 같은 구분(구분)별로 1~12월과 합계 열에 담은 월별 집계표이며, 파일 크기는 229바이트에 불과한 소규모 CSV다. 국립 정신·공공병원의 외래 이용 추이를 보려는 분석가가 '2025년 국립공주병원 외래 초진·재진 환자는 월별로 어떻게 달라졌나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원 이름이나 같은 기관 기준으로만 맞춰 이어 쓴다.
description_portal: 보건복지부 국립공주병원 외래진료현황(초진, 재진)에 대한 정보를 제공합니다.국립공주병원은 외래진료 환자들의 외래 방문자수 및 진료 현황을 체계적으로 관리하고 공공데이터 포털 이용자들에게 투명하게 정보를 제공하기 위해 관련 데이터를 공개하고 있습니다.제공되는 데이터는 2025년 외래진료로 방문한 이용자들의 월 별, 합계, 초진(명), 재진(명) 진료일수(일)항목으로 구성되어 있습니다.이 데이터를 통해 국립공주병원의 외래진료 현황을 파악할 수 있으며, 의료 접근성 및 의료서비스 이용 현황을 분석할 수 있습니다.
