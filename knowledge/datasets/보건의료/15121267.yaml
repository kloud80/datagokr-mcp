summary_user: 의료급여 수급권자의 선택병의원 현황을 시도·시군구별, 월별(구축년월)로 집계한 통계로, 선택기관·추가선택기관·선택 한의원·치과의원 수와 희귀난치성·지정 11개 질환·기타질환·자발적 참여자별 선택자 수를 전국 시군구 단위로 담는다. 보건정책 분석가나 지자체 담당자가 '우리 시군구에서 선택병의원제를 이용하는 수급권자가 어떤 질환 사유로 얼마나 되고 월별로 어떻게 변하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름 매핑이나 구축년월 기준으로만 이어 쓰며, 요양기관 원장(ykiho)과 기관 단위로 연결되지 않는다.
description_portal: '□ 데이터 개요본 데이터는 의료급여 수급권자의 선택병의원 현황을 월별로 집계한 통계자료입니다.□ 주요 내용구축년월: 통계가 집계된 연월구축시도, 구축시군구: 해당 통계의 지역 정보(시도, 시군구)선택기관: 수급권자가 선택한 기관 수추가선택기관: 추가로 선택한 기관 수선택한의원: 선택한 한의원 수선택치과의원: 선택한 치과의원 수희귀난치성: 희귀난치성 질환 관련 선택자 수11개질환: 지정 11개 질환 관련 선택자 수기타질환: 기타 질환 관련 선택자 수자발적참여자: 자발적으로 참여한 수급권자 수처리일자: 데이터 처리 일자'
