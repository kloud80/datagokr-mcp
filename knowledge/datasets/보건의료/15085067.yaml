description_portal: '○ 통계개요* 통계명 : 외국인환자 현황(국적별)* 통계종류 : 일반·보고통계* 작성목적 : 한국의료를 이용하는 국적별 외국인환자의 이용유형을 파악하여외국인환자유치사업 추진의 기초자료로 활용* 조사체계 : 외국인환자 유치사업등록기관→외국인환자 유치기관 정보포털시스템입력 및 보고→ 한국보건산업진흥원→보건복지부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 국적별 외국인환자수○ 용어설명* 조사대상 : 한국의료기관에서 의료서비스를 받은 외국인 중 다음을 충족하는 외국인- 국적이 한국인이 아닌 외국인- 국민건강보험의 가입자, 피부양자가 아닌 외국인- 외국인등록을 하지 않은 외국인과 국내거소신고를 하지 않은 외국국적동포.단, 주한외국공관과 국제기구 직원, 주한미군 등 그 가족은 외국인등록 여부에관계없이 외국인환자에 포함'
