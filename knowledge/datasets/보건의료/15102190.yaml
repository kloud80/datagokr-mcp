summary_user: 전주시 안에서 응급환자를 의료기관 등으로 이송하는 영업 업소를 업소 1건당 1행으로 담은 원천 목록입니다. 인허가일자, 영업상태, 전화번호, 도로명·지번 주소, 위도·경도, 특수·일반 구급차 대수, 응급구조사 수가 들어 있고, 파일 크기가 487바이트라 업소 수는 많지 않습니다. 시민은 '전주에서 지금 영업 중인 사설 구급차 업체와 연락처가 어디인가'를 확인하는 데 쓰고, 정책 담당자는 지역 이송 인프라 규모를 파악하는 데 씁니다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위도·경도로 응급의료기관 위치 데이터와 공간적으로 맞대어 쓰거나, 같은 기관의 다른 인허가 데이터와 업소명·주소로 이어 써야 합니다.
description_portal: '전북특별자치도 전주시 내 응급환자이송업을 제공하며 사업장명, 인허가일자, 영업상태, 소재지전화번호, 도로명주소, 지번주소 등을 제공합니다.응급환자를 의료기관 등으로 이송하는 영업을 하는 업소담당부서 : 보건행정과활용 포인트전주시 내 응급환자 이송 서비스 인프라 현황 파악업체별 허가일자 및 운영 상태를 통해 서비스 지속성 및 안정성 분석정책 담당자는 응급 의료체계 강화 및 안전망 구축에 활용시민은 업체 연락처와 위치 정보를 통해 응급 상황 시 빠른 대응 가능이 데이터는 전주시민의 응급 의료 서비스 접근성을 높이고, 행정기관이 지역 응급의료 정책을 설계하는 데 중요한 기초자료입니다.'
