summary_user: 질병관리청 청소년건강행태조사 결과로 산출한 청소년의 연간 음주예방 교육 경험률(최근 12개월 동안 학교나 외부 기관에서 음주예방 교육을 받은 비율)을 연도별로 담은 전국 단위 집계 지표이며, 전체와 성별·학년(중1~고3)·학교급별 값이 한 행에 들어 있는 소형 CSV(774바이트)이다. 보건의료 연구자나 학교 보건 담당자가 '최근 몇 년 사이 중·고등학생이 음주예방 교육을 받은 비율이 늘었는지, 성별·학년별로 차이가 있는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 기준으로 맞춰 같은 기관의 청소년 음주행동 지표(음주율 등)와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 음주폐해예방 관련 지표- 질병관리청 청소년건강행태조사 결과를 이용해 청소년의 연간 음주예방 교육 경험률을 산출한 지표입니다.- 연간 음주예방 교육 경험률은 최근 12개월 동안 학교나 외부 기관에서 음주예방 교육을 받은 경험이 있는 사람의 분율을 말합니다.- 데이터 내 연도별 자료 중 2019년, 2020년, 2022년, 2023년 자료는 미발표되었으니 참고바랍니다. - 본 데이터는 청소년 음주폐해예방 및 금주실천을 위한 보건의료 학계의 연구 추진 시 기초자료로 활용될 것으로 기대합니다.
