description_portal: 이 데이터는 광주광역시 서구에 신고된 소독업체에 대한 정보를 제공하는 자료로, 업체명, 소재지(도로명 주소), 전화번호, 신고일자, 데이터 기준일 등의 항목으로 구성되어 있습니다.지역 내 감염병 예방 및 방역 대응을 위한 민간 방역 인프라 현황을 파악할 수 있으며, 방역사업 계획 수립, 관련 민원 처리, 위기상황 시 업체 연락망 확보 등 실무 활용도가 높은 자료입니다.또한 해당 데이터는 소독업 등록 관리 및 공중위생 서비스 체계 개선, 민간위탁업체 평가 등 행정적 기초자료로도 유용하게 활용될 수 있습니다.데이터는 연 1회 정기적으로 갱신되며, 누구나 자유롭게 사용할 수 있는 공공저작물입니다.
