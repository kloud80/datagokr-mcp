description_portal: 본 데이터는 인천광역시 미추홀구 관내의 소독의무대상시설(자동차) 현황을 수록한 자료로, 소독을 해야 하는 시설 중 「여객자동차 운수사업법」에 따른 시내버스ㆍ농어촌버스ㆍ마을버스ㆍ시외버스ㆍ전세버스ㆍ장의자동차, 「항공안전법」에 따른 항공기 및 「공항시설법」에 따른 공항시설, 「해운법」에 따른 여객선, 「항만법」에 따른 연면적 300제곱미터 이상의 대합실, 「철도사업법」 및 「도시철도법」에 따른 여객운송 철도차량과 역사 및 역 시설이 해당됩니다. 본 자료에는 미추홀구 내 소독의무 대상 자동차 시설 중 실제 운영 중인 사업체들의 상호명, 유형, 도로명주소, 전화번호, 위도와 경도 정보가 포함되어 있으며, 방역대상 시설관리 및 감염병 예방 대책 수립에 유용한 자료로 활용될 수 있습니다. 데이터는 지도 기반 시각화, 방역이행 점검, 행정관리 시스템 연계 등에 적합한 형태로 구성되어 있습니다.
