summary_user: 서울특별시 성동구에서 건강기능식품 일반판매업으로 인허가를 받은 업소를 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호·인허가일자·폐업일자·영업상태·소재지 주소·좌표·사업장명 등을 포함한다. 소비자나 분석가가 '성동구에서 현재 영업 중인 건강기능식품 판매업소는 어디이고, 최근 새로 생기거나 문 닫은 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 형식의 다른 지자체 인허가 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 기준으로 합치고, 다른 데이터와는 주소나 사업장명 매핑으로 연결한다.
description_portal: 서울특별시 성동구 건강기능식품 판매업소 현황 정보는 건강기능식품 유통전문판매업에 해당되지 않는 일반 업소에서 건강기능식품을 판매하는 업소의 위치와 영업 현황을 체계적으로 제공하는 공공데이터입니다. 데이터 항목에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 있어, 각 업소의 인허가 정보와 현재 영업 상태를 정확히 확인할 수 있습니다. 이를 통해 소비자는 신뢰할 수 있는 건강기능식품 판매처를 확인하고 안전하게 제품을 구매할 수 있으며, 업소 선택 시 참고 자료로 활용할 수 있습니다. 또한 행정기관은 업소 관리, 위생 점검, 인허가 현황 파악, 영업 상태 모니터링 등 행정 업무 수행에 활용할 수 있으며, 위생 및 안전 기준 준수 여부를 점검하고 필요 시 인허가 갱신 또는 취소 조치를 체계적으로 관리할 수 있습니다. 연구기관이나 정책 담당자는 업소 분포, 영업 상태, 제품 판매 현황 등을 분석하여 정책 개선, 소비자 보호, 건강기능식품 산업 관리, 지역 맞춤형 지원 계획 수립 등에 활용할 수 있습니다. 본 데이터는 성동구 내 건강기능식품 판매의 투명성과 안전성을 확보하고 주민 건강 보호와 소비자 신뢰 증진을 위한 핵심 자료로 활용될 수 있습니다.
