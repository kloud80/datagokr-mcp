description_portal: 성남시 약국 현황 자료는 성남시 내 약국 정보를 정리한 자료입니다. 이 자료는 구별(수정구, 중원구, 분당구), 약국명칭, 전화번호, 주소 등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 성남시 지역 내 약국 분포를 파악하여 보건 정책 수립이나 민간 서비스 개발 등에 활용 될 수 있으며, 가까운 약국을 쉽게 찾아, 필요한 서비스를 이용할 수 있도록 활용할 수 있습니다.
