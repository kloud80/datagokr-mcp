summary_user: 성남시 내 약국을 한 곳씩 담은 건별 목록으로, 구(수정구·중원구·분당구)와 약국명, 전화번호, 도로명 주소, 데이터 기준일자를 담는다(CSV 약 75KB). 주민이 '우리 구에 있는 약국과 연락처'를 찾거나, 분석가가 성남시 구별 약국 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 약국명·도로명 주소 매칭이나 구 이름 기준으로만 이어 쓴다.
limits: 약국 코드 같은 공통 식별자가 없어 다른 인허가·의료기관 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 성남시 한 곳뿐이며 좌표 컬럼은 없어 위치 분석에는 주소 지오코딩이 필요하다.
