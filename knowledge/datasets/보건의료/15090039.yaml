description_portal: '가족의 보호가 어려운 정신질환자가 입소ㆍ보호ㆍ사회적응훈련등 재활훈련을 할수 있는 정신보건관련 기관의 현황 정보 입니다.근거법령1. 정신요양시설: 정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률 제22조(정신요양시설 설치,운영), 동법 시행규칙 제14조2. 정신재활시설: 정신건강 증진 및 정신질환자 복지서비스 지원에 관한 법률 제26조(정신재활시설 설치,운영)사업목적1. 정신요양시설: 가족의 보호가 어려운 만성 정신질환자를 정신요양시설에 입소시켜 요양 및 보호함으로써 이들의 삶의 질 향상 및 사회복귀 도모2. 정신재활시설: 타 정신건강증신시설을 이용하지 않는 정신질환자등이 지역사회에서 직업활동과 사회생활을 할 수 있도록 각종 재활 활동 및 복지서비스 제공'
