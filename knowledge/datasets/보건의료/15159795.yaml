description_portal: 본 데이터는 문경시 관내 병원 집단급식소 등록 현황을 제공하는 자료입니다.문경시청 식품위생과에서 보유한 집단급식소 등록 정보를 바탕으로 작성하였으며, 병원별 허가병상수는 보건사업과에서 제공한 자료를 반영하였습니다. 해당 데이터는 공공데이터 총괄부서인 홍보전산과에서 공공데이터로 업로드하였습니다.데이터 항목은 연번, 업종명, 업소명, 소재지 도로명주소, 소재지 지번주소, 행정동명, 업태명, 운영형태, 허가병상수, 데이터기준일로 구성되어 있습니다. 운영형태는 직영 또는 위탁 여부를 나타냅니다.자료 정비 과정에서 업태가 병원으로 명시되어 있더라도 서울대학교병원인재원과 같이 실질적으로 병원에 해당하지 않는 시설은 데이터에서 제외하였습니다.또한, (의)동춘의료재단 문경제일병원의 경우 문경병원 진폐환자병동과 문경제일병원 모전동이 별도로 분리된 병원이 아니라 하나의 의료법인 병원으로 운영되고 있어, 병상수를 시설별로 구분하여 산정하기 어렵습니다. 이에 따라 대표 기관인 문경제일병원을 기준으로 기재하였습니다.
