description_portal: 부산광역시 동구의 코로나19 확진자 발생 현황을 월별로 정리된 자료입니다２０２０년부터  월별로  코로나19  확진자수에 대한 데이터를 제공합니다.코로나１９는 법정감염병으로 ４급에 해당됩니다。 코로나 바이러스 과 에 속하는 코로나 바이러스 감염에 의한 급성 호흡기 질환입니다.병원소는 사람, 개, 돼지, 고양이, 소, 박쥐 , 나탁가 해당됩니다. 신고 범위는 환자, 의사환자, 병원체 보유자이다.  신고범위별 진단기준을 살펴보면 환자는 코로나바이러스 감염증 19에부합하는 임상증상을 나타내면서 코로나바이러스 감염증 확인진단을 위한 검사기준에 따라 감염이 확인된 사람이다. 의사환자는 임상증상 및 역학적 연관성을 감안하여 의심되나 진단을 위한 검사기준에 부합하지  검사결과값이 없는 사람 또는 추정진단을 위한 검사기준에 따라 감염이 추정되는 사람을  말한다. 병원체보유자는 임상증상은 없으나 확인진단을 위한 검사기준에 따라 감염병병원체 감염이 확인된 사람을 지칭합니다.코로나바이러스 19감염증 임상증상은 37.5도씨 이상의 발열, 기침, 호흡곤란, 오한, 근육통, 두통, 인후통, 후가 미각소실 또는 폐렴 등을 나타냅니다. 진단을 위한 기준은 확인진단은 검체(비인두도말, 구인두도말, 가래 등)에서 특이 유전자 검출된 경우이다. 추정진단은 검체(비인두도말, 구인두도말, 가래 등)에서 특이항원이 검출된 경우입니다.  전파경로는 감염된 사람의 분비물과 직접 접촉 또는 비말 전파를 통해서 전파되며 잠복기는 평균 3일(2~5일) 정도입니다.  전염기간은 증상 기간 동안 전파 가능하다. 치명률은 사망은 드물게 나타납니다.코로나바이러스 감염증 19 발생시 7일 이내 신고해야 합니다. 치료는 대증치료이며, 특이적인 항바이러스제 없습니다. 예방방법은 일반적 예방방법으로 올바른 손씻기, 기침예절 준수, 실내에서 자주 환기하기, 증상 있을 시 의료기관 방문, 증상있는 사람과 접촉피하기, 손이 자주 닿는 물건들 소독하기, 유증상 기간동안 학교, 직장, 공공장소 방문하지 않기입니다.
