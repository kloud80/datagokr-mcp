summary_user: 인천광역시 부평구에 있는 의료기관을 한 곳씩 담은 파일로, 기관명·종별(병원·의원·한의원 등)·도로명 주소·전화번호를 수록한다(CSV 약 65KB, 시군구 범위의 개별 기관 단위). 부평구 주민이나 분석가가 "우리 동네에 의원·한의원이 어디에 몇 곳 있고 종별 분포가 어떤가"를 확인하거나 지역 의료 접근성을 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명 주소를 맞춰 잇거나, LOCALDATA 병의원 인허가 데이터와 이름·주소로 대조해 개폐업 정보를 보완하는 방식으로 이어 쓴다.
description_portal: '의료기관의 명칭, 종별, 도로명 주소, 전화번호 등을 수록한 데이터.의료기관의 종별 분포와 위치 현황을 파악하여 지역 보건·의료 인프라 분석, 주민 의료 접근성 향상, 보건 정책 수립 및 의료 서비스 계획 수립 등에 활용 가능하다.활용 목적 및 특징– 의료기관 종별(병원, 의원, 한의원 등) 등록 현황 분석– 도로명 주소 기반 입지 특성 및 접근성 평가– 지역 보건의료 서비스 수급 현황 및 정책 자료 활용– 주민 건강 증진 및 의료 인프라 확충 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 의료기관명: 등록된 의료기관의 명칭● 의료기관종별: 병원, 의원, 한의원 등 의료기관의 종별 구분● 의료기관주소(도로명): 의료기관이 위치한 도로명 주소● 의료기관전화번호: 의료기관 문의 및 예약을 위한 공식 연락처'
