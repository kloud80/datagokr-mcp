summary_user: 경기도에서 말라리아 등 감염병 매개 모기의 발생 동향을 감시하려고 설치한 모기채집장치(유문등)의 설치지점을 지점 단위로 담는다. 사업명, 조사 시작·종료일과 기간, 설치장소, 행정구역명, 조사지점 주소, 조사방법(주 2회 채집 등)이 들어 있어 보건소·방역 담당자나 분석가가 '우리 시군에서 모기 감시 지점이 어디에 있고 언제 조사했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 행정구역명이나 조사지점 주소를 이름 매핑해 다른 지역 통계와 연결해야 한다.
description_portal: 이 데이터는 말라리아 등 감염병 매개체인 모기의 발생 동향을 감시하기 위한 목적으로 수행되는 모기채집장치 설치지점 정보를 포함합니다. 주요 항목은 사업명, 조사기간, 설치장소, 행정구역, 조사지점, 조사방법 등으로 구성되어 있으며, 경기도 내 다양한 지역의 유문등 설치 장소 및 모기채집 빈도 정보가 기록되어 있습니다. 해당 자료는 모기 발생 밀도 분석, 지역별 위험도 평가, 방역정책 수립, 감염병 예방 전략 수립 등에 활용될 수 있습니다. 조사방법은 '유문등 설치, 주 2회 채집' 방식으로 일관되게 수행됩니다.
