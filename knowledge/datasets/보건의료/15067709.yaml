summary_user: 대구광역시 서구가 관내 약국·보건소·동행정복지센터 수거함으로 거둔 폐의약품 양(킬로그램)과 수거함 개수를 연도별로 집계한 소규모 파일(csv 165바이트)이다. 구민이나 환경·보건 담당자가 서구의 폐의약품 수거량이 해마다 어떻게 변했는지, 수거함이 몇 개 운영되는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 같은 기관(대구 서구) 기준으로만 맞춰 이어 쓴다.
description_portal: '- 대구광역시 서구 연도별 폐의약품 수거량 및 수거함 개수 안내- 폐의약품을 분리수거하여 환경오염을 예방하기 위해 관내 약국, 보건소, 동행정복지센터에 수거함을 비치하여  수거량 및 수허함 개수를 공개함으로써 수거율을 높이는 등 분리수거에 효율성을 높이고자 함본 데이터는 대구광역시 서구에서 연도별로 수거한 폐의약품의 양과 수거함 개수를 집계한 현황 자료이다. 년도별 수거량과 수거함 수를 기록하였으며, 수거량은 킬로그램 단위로 나타내었다. 폐의약품은 환경 오염 및 주민 건강에 영향을 줄 수 있으므로, 안전한 회수와 처리가 필수적이다. 데이터는 수거함의 지속적인 운영 현황과 함께 폐의약품 관리 실태를 파악하는 데 활용된다. 특히 2023년에는 수거량이 크게 증가하여 폐기물 관리 및 환경보호의 중요성이 강조된다. 본 자료는 지역 환경 개선 및 공공위생 증진을 위한 정책 수립의 기초 자료로 활용된다.'
