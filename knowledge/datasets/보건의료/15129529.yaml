summary_user: 국민건강보험공단이 건강보험 자격을 유지 중인 외국인과 재외국민을 주민등록상 실거주지 기준으로 전국 시군구별·월별(기준년월)로 집계한 적용인구 통계로, 외국인/재외국민 구분별 인원수를 담은 CSV 파일이다. 지자체 담당자나 분석가가 "우리 시군구의 외국인 건강보험 가입자가 최근 몇 달 사이 얼마나 늘었나" 같은 지역별 외국인 인구 분포와 변동 추이를 확인하는 데 쓴다. 공통 행정구역 코드 같은 전역 조인 키가 없어 다른 지역 통계와는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: '□ (개요) 월별 전국 시군구별 외국인 및 재외국민 건강보험 적용인구 현황으로,건강보험 자격을 유지하고 있는 외국인 및 재외국민을 기준으로 산정한 통계 자료임.본 자료는 행정구역별·월별 인구 분포 및 변동 추이 파악을 목적으로 하며,주소지는 주민등록상 실거주지 기준으로 집계함.□ (용어정의)   - 외국인: 출입국관리법에 의하여 외국인 등록을 한 자 또는 재외동포의 출입국과 법적 지위에 관한 법률에 의하여 국내거소 신고를 한 외국국적동포   - 재외국민: 재외동포의 출입국과 법적 지위에 관한 법률에 따른 자 중 국내에 거주하는 자로서 국내거소 신고를 한 자'
