summary_user: 서울 강북구의 의원·치과의원·한의원·보건소 인허가를 업소 한 곳당 한 행으로 담은 원천 목록으로, 인허가일·취소일·폐업일, 영업상태, 주소, 중부원점TM 좌표(X, Y), 의료인 수·병실 수·병상 수·면적, 진료과목을 포함한다. 강북구에서 최근 문을 연 의원과 문을 닫은 의원이 어디인지 확인하려는 개원 예정 의사나 상권 분석가가 병의원 개폐업을 상권 신호로 읽는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 체계의 다른 자치구 인허가 파일과 묶어 쓸 수 있다.
description_portal: '서울시 강북구 의원 인허가 정보: 강북구의 의원, 보건소, 한의원 등 진료시설을 갖추고 환자를 대상으로 의사가 의료행위를 하는 의료기관 정보입니다 업태의 종류에는 보건소, 의원, 치과의원, 한의원이 있습니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
