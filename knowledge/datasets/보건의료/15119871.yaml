summary_user: 국민건강보험 가입자와 의료급여 수급권자 중 고혈압·당뇨병·이상지질혈증 가운데 하나 이상으로 해당 주상병과 약제 처방을 함께 받은 환자의 비율을 연도·시도·시군구·성별·연령대별로 집계한 파일이다(전국 시군구 단위, 포털 설명상 2009~2023년). 지역 보건 담당자나 분석가가 '우리 시군구의 50대 남성 만성질환 의료이용률이 전국이나 다른 지역보다 높은가, 해마다 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(행정구역 코드 등)가 없어 다른 지역 통계와는 시도·시군구 이름과 연도를 맞춰 매핑해 붙여야 한다.
description_portal: '국민건강보험가입자 및 의료급여수급권자 중 고혈압 또는 당뇨병 또는 이상지질혈증 환자의 비율○ 기준연도: 2009~2023년○ 시도 및 시군구: 전국 17개 시도의 시군구별 구분  - 연초 기준 지명 구축. 연중에 지명이 바뀌는 경우 거주자 중 지명 변경 후 정보 이동이 있었던 일부만 반영○ 성별: ALL(전체), 1(남성), 2(여성)○ 연령그룹: ALL(전체), 00(10세미만), 10(10대), 20(20대), 30(30대), 40(40대), 50(50대), 60(60대), 70(70대), 80(80세이상)○ 분모(명): 국민건강보험가입자 또는 의료급여수급권자 수○ 분자(명): 고혈압 또는 당뇨병 또는 이상지질혈증이 발생한 환자 수  - 고혈압 환자: 고혈압 주상병 코드(I10~I15)와 함께 고혈압 약제를 처방 받은 환자  - 당뇨병 환자: 당뇨병 주상병 코드(E10~E14)와 함께 당뇨병 약제를 처방 받은 환자  - 이상지질혈증 환자: 이상지질혈증 주상병 코드(E78)와 함께 이상지질혈증 약제를 처방 받은 환자○ 고당지의료이용률 = 분자/분모*100(%) ※ 분모가 20 미만인 행은 정보 제공 불가* 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고'
