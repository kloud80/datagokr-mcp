services:
  - op: /getAedsList
    name: 부산 자동심장충격기현황정보
    endpoint: https://apis.data.go.kr/6260000/BusanAedsService/getAedsList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: resultType
        required: false
        example: json
        desc: JSON방식으로 호출 시 파라미터 resultType=json 입력
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
