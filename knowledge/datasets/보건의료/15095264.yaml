summary_user: 부산광역시에 설치된 자동심장충격기(AED)를 한 대씩 설치기관·모델명·주소·전화번호·좌표로 담은 개별 위치 데이터이며, 범위는 부산 시 전역입니다. 시민이 '지금 내 주변에서 가장 가까운 자동심장충격기가 어디 있나'를 찾거나, 분석가가 기기가 부족한 동네를 가려낼 때 씁니다. 전역 조인 키가 없어서 다른 데이터와는 주소 문자열이나 좌표(geom)를 기준으로 공간 매칭해 붙입니다. 예를 들어 응급의료기관 위치나 인구 분포와 겹쳐 봅니다.
description_portal: 부산광역시 부산 자동심장충격기현황 정보(모델명, 설치기관, 주소, 전화번호, 좌표 등)를 제공하는 서비스입니다. 자동심장충격기는 심정지 환자에게 전기 충격을 가해 심장의 정상적인 리듬을 회복시켜주는 응급 의료 장비이며 누구나 쉽게 사용할 수 있도록 설계되어 있고, 공공장소나 다중이용시설에 비치되어 있습니다. 위 데이터를 통해 자동심장충격기 설치 현황에 대해 알 수 있고, 기기가 비교적 부족한 지역을 파악하여 다양한 의료 정책을 수립하는데 도움을 줄 수 있습니다. 긴급 상황 시에 자동심장충격기의 위치를 신속히 파악할 수 있는 데에도 도움을 줄 수 있습니다.
team:
