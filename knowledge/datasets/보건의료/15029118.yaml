summary_user: 성남시 관내 의약품도매상을 업소 한 곳당 한 행으로 담은 파일로, 구별·영업종별(시약·원료의약품·일반종합·의료용 고압가스·한약도매 등)·영업소명·도로명 주소·전화번호·데이터기준일자를 담는다. 약국·병원 구매 담당자나 보건행정 분석가가 '성남시 어느 구에 어떤 종류의 의약품 도매업체가 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소로 맞춰 붙여야 하며, 식약처 품목코드·의약품 표준코드 같은 품목 단위 키는 담겨 있지 않다.
limits: 성남시 한 시군구 범위만 담으므로 다른 지역이나 전국 도매상 현황은 이 데이터로 볼 수 없다. 공통 식별 코드가 없어 다른 데이터와 연결할 때 이름·주소 매칭 오류에 주의해야 하고, 미수집 항목은 공란으로 들어 있다.
