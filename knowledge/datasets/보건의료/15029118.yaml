description_portal: 성남시 의약품도매상 현황 자료는 성남시 관내에서 의약품을 도매 유통하는 업체들의 정보를 정리한 자료입니다. 이 자료는 구별, 영업종별, 영업소명, 주소, 전화번호 항목을 포함하고 있습니다.데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다.제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 시약도매, 원료의약품도매, 일반종합도매, 의료용 고압가스, 한약도매 등 다양한 의약품 유통 형태를 파악할 수 있으며, 성남시 의약품 유통망 현황 파악하고, 보건행정 등의 기초자료로 활용할 수 있습니다.
