summary_user: 충청남도 계룡시 관내 보건소와 보건지소를 기관 한 곳당 한 행으로 기관명·주소·전화번호·진료안내를 담은 소규모 목록 파일(csv 303바이트)이다. 계룡시 주민이 가까운 보건소나 보건지소의 위치와 연락처, 진료 안내를 확인하거나, 분석가가 시군구별 공공보건기관 현황을 모을 때 쓴다. 전역 조인 키나 기관 코드가 없어 다른 보건소 목록이나 지역 건강지표와는 기관명·주소를 맞춰 이어야 한다.
limits: 보건소코드나 시군구코드 같은 표준 키가 없어 다른 데이터와 자동으로 연결되지 않고, 기관명이나 주소로 직접 매칭해야 한다. 범위는 계룡시 한 곳뿐이라 다른 시군구 비교에는 다른 지자체 파일을 따로 모아야 한다.
