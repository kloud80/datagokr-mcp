description_portal: 음주폐해예방 관련 지표- 세계보건기구(WHO) 알코올 정보 시스템 GISAH(Global Information System on Alcohol and Health)를 바탕으로 산출된 것으로, 2020년 기준 각 국가별 음주자의 하루 평균 알코올 섭취량을 제시합니다. - 단위는 g, 일일 순수 에탄올 소비량을 의미하며, 산출식은 알코올의 질량 0.793g/cm³를 적용하여 g/일 = 1인당 알코올 소비량 × 1000 × 0.793 / 365일로 계산됩니다. - 자료는 국가 전체, 남성, 여성으로 구분되어 있으며, 제시된 수치는 2017년부터 2019년까지의 3개년 평균치입니다.
