summary_user: WHO 알코올 정보 시스템(GISAH)을 바탕으로 국가별 음주자의 하루 평균 순수 알코올 섭취량(g/일)을 전체·남성·여성으로 나눠 담은 국가 단위 집계 표이며, 수치는 2017~2019년 3개년 평균(2020년 기준)이고 파일 크기는 약 1KB의 소규모 CSV다. 보건 정책 담당자나 분석가가 '한국 음주자의 하루 알코올 섭취량은 다른 나라와 비교해 많은가, 남녀 차이는 어떤가' 같은 국제 비교 질문에 쓴다. 전역 조인 키가 없어 다른 국외 음주 지표와는 국가명을 맞춰 연결해야 한다.
limits: 국가 단위 집계값만 있어 국내 시도·시군구별 비교나 개인 단위 분석에는 쓰지 못한다. 국가를 코드가 아닌 이름으로만 구분하므로 다른 국제 통계와 붙일 때 국가명 매핑이 필요하다.
