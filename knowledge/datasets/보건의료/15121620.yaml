description_portal: 본 데이터는 경기도 광주시청에서 관리하는 아토피천식 안심학교 지정현황 자료입니다. 주요 제공 항목은 구분(초등학교 또는 유치원 등), 지역, 보건기관, 기관, 학생수, 주소로 구성되어 있으며, 광주시 관내 아토피 또는 천식 등 알레르기질환 학생 보호를 위해 지정된 교육기관들의 현황 정보를 체계적으로 수록하고 있습니다. 해당 데이터는 안심학교 운영을 통한 학생 건강관리 실태 파악과 교육·보건 연계 정책 수립, 알레르기질환 예방환경 조성 등에 활용됩니다. 또한 지정기관별 현황 제공으로 학부모 및 지역사회의 알레르기 대응력 강화와 정보 접근성을 증진합니다.
