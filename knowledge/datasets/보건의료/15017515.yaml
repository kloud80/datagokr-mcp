summary_user: 경상남도 내 시군에서 취합한 의료기기 판매업체를 업체 한 곳당 한 행으로 담으며, 시군·업체명·전화번호·소재지·신고구분·신청일자(영업신고일자)가 들어 있다. 사업자나 주민이 '우리 시군에 신고된 의료기기 판매업소가 어디 있고 언제 신고했나'를 확인하거나, 분석가가 시군별 판매업체 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·업체명·소재지 주소를 맞춰 연결해야 하며, 식약처 품목코드 같은 코드로 이어지지 않는다.
limits: 전역 조인 키가 없어 의료기기 품목허가나 건강보험 데이터와 코드로 바로 붙일 수 없고, 이름·주소 매칭에 의존해야 한다. 포털 설명상 연 1회 식약처 보고용으로 취합한 시점의 현황이므로, 그 이후 신고·폐업은 해당 시군에 따로 확인해야 한다.
