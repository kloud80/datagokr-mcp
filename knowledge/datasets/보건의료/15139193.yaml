summary_user: 인천광역시 관내 병원·의원·요양원을 기관 한 곳당 한 행으로 담은 파일(csv, 약 216KB)로, 상호·병원구분·전화번호·우편번호·소재지주소·홈페이지를 기관별로 나열한다. 시민이 "우리 동네에 있는 요양원이나 병원 연락처와 주소는 어디인가"를 찾거나, 분석가가 인천 안에서 의료·요양기관이 어떻게 분포하는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소를 맞춰 붙이는 방식으로만 이어 쓰며, LOCALDATA 병의원 인허가 데이터와 대조할 때도 이름·주소 매칭이 필요하다.
description_portal: 인천광역시가 제공하는 병원·의원·요양원 현황 공공데이터는 관내에 소재한 의료 및 요양 기관에 대한 상세 정보를 통합적으로 제공합니다. 이 데이터는 시민들이 지역 의료 서비스 접근성을 높이고, 응급 상황 및 일상적인 건강 관리 시 필요한 의료기관을 신속하게 검색할 수 있도록 지원하는 것을 목적으로 합니다. 이 데이터는 의료자원 분포 파악, 보건 정책 수립, 시민 건강 증진을 위한 기초 자료로 활용되며, 인천시민들이 의료기관을 효율적으로 이용할 수 있도록 돕는 중요한 공공정보입니다. 공공데이터포털에서 무료로 확인할 수 있습니다.
