description_portal: '1. 2009년~2023년까지 노인장기요양 기관평가 5회 이상 A등급을 받은 기관 현황2. 평가방법 : 2016년 이후로 현행 3년 주기 평가 실시 - (2009년~2015년) 2년 주기 평가 … 예시) 시설급여-재가급여  - (2016년~현재) 3년 주기 평가 실시 … 예시) (’18년) 시설 → (’19년) 재가_짝수 → (’20년) 재가_홀수   ※ 참고사항  ① 코로나19로 2021년 시설평가 2년 간 실시(2021-2022)   ② 2016년부터 재가급여기관 평가는 기관기호 끝 번호 기준으로 짝?홀수로 나누어 평가 실시.       단, 짝수기관과 홀수기관을 동일 대표, 동일법인 운영 기관인 경우 짝수 주기에 평가(동일 지역본부* 운영 시)      * 국민건강보험공단 6개 지역본부: 서울강원본부, 부산울산경남본부, 대구경북본부, 광주전라제주본부, 대전세종충청본부, 인천경기본부 ※ 민원인의 제공 신청에 따른 제공 건으로 2024.3.22. 기준 발췌된 자료이며, 장기요양기관 정기평가 등급은 행정처분 등으로 등급조정이 발생할 수 있습니다.'
