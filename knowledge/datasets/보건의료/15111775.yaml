summary_user: 식약처가 허가·신고한 의약품을 품목 한 건씩 담고, 품목마다 업체명·제품명·허가일·품목 유효기간·갱신 신청 기한·전문/일반 구분·제조/수입 구분을 전국 범위로 제공한다. 제약사 인허가 담당자나 분석가가 '우리 회사(또는 특정 제품) 품목의 유효기간이 언제 끝나고 갱신 신청은 언제까지 해야 하나'를 확인할 때 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않았다. 다만 품목기준코드(ITEM_SEQ)로 식약처 허가정보·e약은요 등 같은 기관 의약품 데이터와 맞추고, 이 코드를 거쳐 심평원 약가·급여 목록과 이을 여지가 있으며, 사업자등록번호(BIZRNO)로는 업체 단위로 묶는다.
description_portal: 식품의약품안전처 「의약품 품목 유효기간 정보」 OpenAPI는 의약품 각 품목의 유효기간 관리 현황을 제공하는 공공데이터입니다. 제공 주요 항목에는 업체명, 제품명, 허가일자, 품목 유효기간, 갱신 신청 기한, 업종, 제조·수입 구분, 허가번호, 품목 기준 코드, 전문/일반 품목 분류, 허가/신고 속성 정보 등이 포함되어 있습니다. 이 데이터를 통해 제품이 언제 허가되었는지, 특정 의약품의 유효기간과 갱신 신청 시기를 객관적으로 파악할 수 있으며,  연구자와 제약업계에서는 이 데이터를 기반으로 유효기간 준수 상태 또는 제품 관리 감시 등에 활용할 수 있습니다.
