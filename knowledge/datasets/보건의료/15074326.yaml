description_portal: 의약품 한글명, 의약품 영문명, 적용 대상 동물, 분자식, 분자량, 계통명, IUPAC 명, CAS 명, 형태, 녹는점, 끓는점, 증기압, LOGPOW, 밀도단위, PKA, 용해도, 안정성 등을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
