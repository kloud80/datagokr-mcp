summary_user: 경기도 내 진료분야별 전문병원을 병원 한 곳씩 담은 현황 목록으로, 병원 명칭(INST_NM)·전문 분야(산부인과·안과·수지접합·재활의학과 등)·병원 종류와 함께 시군, 지번·도로명 주소, 우편번호, 위경도(WGS84)를 담는다. 주민이나 분석가가 "우리 시군에서 수지접합이나 재활 전문병원은 어디에 있나", "분야별 전문병원이 경기도 안에서 어느 지역에 몰려 있나"를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어, 병원 이름·주소를 맞추거나 같은 기관(경기도) 데이터의 시군명으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 다양한 진료분야별 전문병원 현황을 제공하며, 병원의 명칭, 분야, 시군 위치, 병원 종류, 지번주소 및 도로명주소, 우편번호, 위도(WGS84 기준)와 경도 정보를 포함하고 있습니다. 분야명에는 산부인과, 안과, 수지접합, 재활의학과 등 다양한 전문 진료과목이 포함되어 있으며, 이는 지역별 특화 진료 역량 분석과 공공의료 자원 분포 파악에 유용한 정보를 제공합니다. 본 데이터는 전문 진료 서비스 접근성 분석, 보건의료 정책 수립, 응급환자 이송체계 구축, 위치 기반 의료정보 제공 서비스 등에 활용될 수 있습니다.
