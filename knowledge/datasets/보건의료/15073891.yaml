summary_user: 의료기기 유해사례 보고 한 건(보고일련번호)마다 대상업체, 유해사례 발생·종료일과 최초보고일, 조치대상·조치사유, 수리·조사·교환·제품개선·환자상태 모니터링·안내문 전달·허가사항 변경·회수·기타 같은 조치방법과 조치 완료일을 담는 전국 단위 건별 데이터다. 분석가나 의료기관 담당자가 특정 업체의 의료기기 유해사례에 어떤 조치가 내려졌고, 조치가 언제 완료됐는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 업체명이나 사업자등록번호(BRNO) 같은 이름·코드 매핑 또는 같은 기관(식약처) 코드로만 의료기기 품목허가 등 다른 데이터와 잇는다.
description_portal: 식품의약품안전처에서 제공하는 이 공공데이터는 유해사례별 조치방법 정보를 알려줍니다. 이 공공데이터는 대상업체명과 유해사례발생일, 종료일, 최초보고일자를 통해 사건의 기본 정보와 시간적 흐름을 파악할 수 있습니다. 보고일련번호로 각 사례를 고유하게 식별하며 조치대상과 조치사유를 명시하여 대응 범위와 근거를 명확히 합니다. 조치방법으로는 수리, 조사, 교환, 제품개선, 환자상태모니터링, 안내문전달, 허가사항변경, 회수, 기타 등 다양한 대응 수단을 포함하고 있습니다. 사용자는 유해사례 대응 현황을 종합적으로 확인할 수 있습니다.
