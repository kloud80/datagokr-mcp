summary_user: 서울 강남구 관내에서 외국어 진료가 가능한 의원·한의원·치과의원 등을 기관별로 한 행씩 담은 목록 파일로, 상호·기관구분·주소·연락처·운영 상태와 가능한 외국어(유치대상국가)를 담는다. 강남구에 거주하거나 방문한 외국인, 또는 이들을 돕는 통역·관광 안내 담당자가 '근처에 영어나 중국어로 진료받을 수 있는 치과가 있는가'를 찾는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어, 의료기관 인허가(LOCALDATA) 등과 이으려면 상호·주소 문자열을 맞춰 연결해야 한다.
description_portal: 강남구 관내에 위치한 외국어 가능 의료기관의 주소, 상호명, 연락 가능한 전화번호, 가능한 외국어 목록 등에 대한 정보가 포함된 공공데이터입니다. 상태는 유지 여부등을 표시하며, 기관구분은 의원, 한의원, 치과의원 등으로 구성되어 있으며, 예를 들어 ‘의원’은 일반적인 진료가 가능한 곳을 말하고, ‘한의원’은 한방 진료를 받을 수 있는 곳, ‘치과의원’은 치과 진료가 가능한 의료기관을 의미합니다. 이처럼 기관구분 항목을 통해서 자신에게 맞는 진료 과목을 쉽게확인할 수 있습니다.각 병원마다 가능한 외국어를 표시 해 놓았습니다.  병원 방문 전에는 해당 의료기관에 직접 연락하여, 안내된 서비스가 제공되는지, 혹은 추가적인 준비가 필요한지를 미리 확인하시기 바랍니다.
