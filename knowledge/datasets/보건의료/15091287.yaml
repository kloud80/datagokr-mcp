summary_user: 경상남도 남해군 안에서 안전상비의약품을 파는 점포를 한 곳씩 담은 건별 목록으로, 점포명·도로명 주소·전화번호·데이터 기준일을 담는다(CSV 약 2KB 규모의 작은 파일). 군민이나 방문객이 밤이나 휴일에 '가까운 곳에서 해열제·소화제를 살 수 있는 편의점이 어디인가'를 찾을 때, 또는 분석가가 읍·면별 상비약 판매처 분포를 볼 때 쓴다. 전역 조인 키는 없어서 도로명 주소를 지오코딩해 지도나 약국·의료기관 위치 데이터와 공간으로 겹쳐 쓰거나, 점포명·주소 문자열 매칭으로만 다른 데이터와 잇는다.
