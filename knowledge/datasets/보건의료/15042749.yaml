summary_user: 국립나주병원 내원환자를 주진단별로 묶어 진단코드·진단명마다 외래·입원 인원수를 담은 집계 파일(csv)로, 조현병·양극성 정동장애·우울증·알츠하이머병·알코올 관련 장애 같은 정신질환과 뇌전증·수면장애 등 신경계 질환, 건강검진 같은 행정 코드가 함께 들어 있다. 국립 정신병원에 어떤 진단의 환자가 많고 진단별로 외래와 입원 중 어느 쪽 비중이 큰지 알아보려는 정신보건 분석가나 연구자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 진단코드나 진단명을 맞춰 붙이거나 같은 기관의 다른 공개 자료와 나란히 놓고 비교하는 정도로 이어 쓴다.
limits: 병원 한 곳의 진단별 인원 집계라서 환자 개인 단위나 지역별 분석은 할 수 없고, 범위는 전국·비공간으로 분류돼 있다. 다른 데이터와 바로 묶을 공통 키가 없어 진단코드·진단명을 직접 맞춰야 한다.
