description_portal: 제공된 자료는 국립나주병원의 정신 건강 및 관련 질환 진단 기록에서 발췌한 내용으로, 외래 및 입원 환자 수를 포함한 다양한 진단 코드를 보여줍니다. 여기에는 알츠하이머병, 조현병, 양극성 정동 장애, 우울증과 같은 주요 정신 질환은 물론, 알코올 및 물질 관련 장애, 불안 장애, 행동 장애, 발달 지연 등 광범위한 진단명이 포함되어 있습니다. 또한, 간질, 수면 장애, 파킨슨병과 같은 신경학적 문제와 같은 비정신과적 질환 및 일반적인 건강 검진과 같은 행정 코드도 함께 기록되어 있어, 환자들이 겪는 다양한 건강 문제와 의료 서비스 이용 현황을 파악할 수 있게 해줍니다.
