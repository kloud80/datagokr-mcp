summary_user: 국민건강보험공단 자료를 바탕으로 경기도 내 정신의료기관의 건강보험 입원 진료실인원을 기준년도와 의료기관 종별(상급종합병원·병원·의원 등)로 집계한 시도 단위 통계입니다. 정신질환 입원 진료가 어떤 종류의 의료기관에서 몇 명 규모로 이뤄졌는지 연도별로 보려는 보건정책 담당자나 연구자에게 쓰입니다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 통계와는 기준년도와 의료기관종별명(MEDINST_ASORTMT_NM)을 이름으로 맞춰 이어 써야 합니다.
description_portal: 본 데이터는 국민건강보험공단에서 제공한 경기도 내 정신의료기관별 건강보험 입원진료실 인원 현황으로, 병원, 상급종합병원, 의원 등 의료기관 종류별로 입원진료실을 이용한 건강보험 가입자 수를 연도별로 집계한 통계입니다.항목은 ‘기준년도’, ‘의료기관종별명’, ‘건강보험입원진료실인원수(명)’로 구성되어 있으며, 정신질환자들의 입원 형태와 의료기관별 서비스 이용 실태를 파악하는 데 활용됩니다* 2016년 자료는 2017년 6월 청구분까지 반영※ 국민건강보험공단의 연구 종료로 인하여 집계가 중단된 데이터입니다(향후 연구 재개 시 갱신도 재개될 수 있음).
