summary_user: 마약·향정신성의약품 등을 합법적으로 취급하도록 허가받은 업소를 한 곳씩 담은 현황 데이터로, 전국 1,702건이고 허가일 기준 1955-12-24부터 2026-09-22까지 걸친다. 분석가나 보건 담당자가 특정 업소가 마약·향정·대마 취급 허가를 받았는지, 허가 취소·재개업 이력이 있는지 확인하는 데 쓴다. 전역 조인 키는 없어서 업소명이나 표준업체코드(STD_ENTP_CD)를 이름·코드 매핑하거나 같은 기관 코드로만 다른 데이터와 잇는다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와 바로 결합되지 않는다. 검증 때는 전체 1,702건 중 1,000행만 받았으므로 전체 집계 시 페이징 호출이 필요하다. 호출에는 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
