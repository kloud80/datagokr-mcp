description_portal: 식품의약품안전처에서 제공하는 ‘마약류취급자 허가정보’ 데이터는 마약 및 향정신성의약품을 합법적으로 취급하기 위해 허가를 받은 업체(기관)의 현황을 제공합니다. 이 데이터에는 업소명, 표준업체코드, 허가일자, 허가종별/허가종명, 취급마약 여부(마약·향정·대마 등), 허가조건, 취소·재개업 이력 등의 항목이 포함되어 있어 마약류 취급 허가 현황을 확인할 수 있습니다.이를 통해 의료기관·연구기관 등은 합법적 절차에 따라 마약류를 취급할 수 있으며, 환자는 보다 안전한 환경에서 진료와 치료를 받을 수 있습니다. 또한 보건당국은 허가 현황 관리, 불법 유통 방지, 정책 수립, 연구·분석 등 다양한 분야에서 본 데이터를 활용할 수 있습니다.
