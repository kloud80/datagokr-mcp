description_portal: 국가손상정보포털은 국내에서 발생하는 다양한 손상(사고·외상)의 예방, 관리, 감시체계를 강화하기 위해 교육·예방 정보와 조사 기반 데이터를 통합적으로 구축하고 제공하는 것을 목적으로 한다.이를 통해 국민이 일상에서 안전을 지킬 수 있는 행동 지침을 습득하도록 돕고, 의료기관에서 수집된 표준화된 손상 데이터를 기반으로 국가·지자체·연구기관이 과학적인 정책을 수립할 수 있도록 지원하며, 궁극적으로는 국가 손상 발생률 감소와 건강한 사회환경 조성을 도모한다.각 데이터는 국가 및 지자체 정책 수립을 지원하고 손상 예방사업 기획 및 평가, 연구/학술 활용, 교육/훈련 자료, 의료기관 및 조사기관의 표준 운영지원, 국민생활 안전 및 행동 변화 촉진 등 “예방–감시–정책–교육–실천”을 연결하는 국가 손상관리 전반의 핵심 기반으로서 기능하는 종합 데이터이다.
