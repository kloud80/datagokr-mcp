summary_user: 경기도 내 상급종합병원·종합병원·병원·요양병원·의원·보건의료원 등 의료기관별로 건강보험심사평가원의 외래 처방전당 약품목수 평가 결과를 1~5등급(숫자가 낮을수록 약품목수가 적음)으로 담은 기관 단위 데이터이며, 시군명·주소·위경도가 함께 붙는다. 환자가 우리 동네 의원 중 처방 약 가짓수가 적은 곳을 고르거나, 분석가가 시군별 다제 처방 경향을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명·주소 매칭이나 시군코드(SIGUN_CD) 기준 집계로만 잇고, 위경도로 지도나 다른 공간 데이터에 겹쳐 쓴다.
description_portal: 이 데이터는 건강보험심사평가원이 제공하는 병원평가 자료로, 경기도 내 상급종합병원, 종합병원, 병원, 요양병원, 의원, 보건의료원 등 다양한 의료기관의 외래 처방전당 약품목수에 따라 평가한 정보를 포함합니다. 과다한 약품목 처방은 환자의 복약 순응도 저하 및 약물 상호작용 증가로 이어질 수 있으므로, 처방의 적정성과 합리성을 판단하는 주요 기준 중 하나입니다. 평가 결과는 백분위 순위에 따라 1등급부터 5등급까지 분류되며, 숫자가 낮을수록 처방전당 약품목수가 적은 기관으로 평가됩니다.공개 항목은 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 도로명 및 지번 주소, 우편번호, 위도·경도 좌표 등이 포함됩니다. 진료건수가 100건 미만이거나 원외처방이 30건 미만인 기관은 평가에서 제외됩니다.이 데이터는 지역별 의료기관의 약품 처방 행태를 비교 분석하고, 합리적인 처방문화 정착을 위한 정책 수립, 환자의 의료기관 선택 기준 강화, 보건의료 자원 효율성 제고 등 다양한 목적으로 활용될 수 있습니다. 또한 의료기관의 약물관리 수준을 간접적으로 확인할 수 있는 객관적인 자료로서 공공성과 신뢰성이 높은 공공데이터입니다. 데이터는 Open API 형태로 제공되어 타 시스템과의 연계가 용이하며, 보건의료 행정 및 연구 분야에서의 실무 활용도가 높습니다.
