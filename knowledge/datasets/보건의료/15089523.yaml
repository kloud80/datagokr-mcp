summary_user: 경상남도 18개 시·군(20개 보건소)에 설치된 보건진료소 220개소의 명칭·소재지·대표 전화번호·우편번호를 한 곳당 한 행으로 담은 목록 파일이다. 농촌 주민이나 안내 담당자가 '우리 면에서 가장 가까운 보건진료소는 어디이고 전화번호는 무엇인가'를 찾거나, 분석가가 시군별 보건진료소 분포를 확인하는 데 쓴다. 전역 조인 키(기관코드·행정구역코드)는 없어 시군구명이나 주소 문자열을 행정구역 코드표에 매핑하거나 주소를 좌표로 바꿔 보건소·의료기관 데이터와 이어 쓴다.
description_portal: <데이터 수집목적 및 과정>본 데이터는 2026년 2월 기준 경상남도 내 18개 시·군(20개 보건소)에 설치된 보건진료소(220개소)의 명칭, 소재지, 연락처, 우편번호에 관한 정보를 제공합니다.보건진료소는 의료 서비스가 상대적으로 부족한 농촌 지역 주민에게 일차 의료 서비스와 건강 상담 등 기본적인 보건의료를 제공하는 공공의료기관입니다.해당 데이터는 경상남도 행정기관에서 직접 수집·정리하였으며, 각 시군 보건진료소의 최신 운영 현황을 반영하고 있습니다.또한 지역주민의 의료기관 접근성 향상과 공공보건 서비스 안내를 위한 기초자료로 활용될 수 있습니다.<데이터 현행화 시기>본 데이터는 연 1회 현행화되며, 차기 업데이트 예정일은 2027년 2월입니다.
