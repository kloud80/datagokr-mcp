summary_user: 고창군 안의 병원·의원·요양병원을 한 곳당 한 행으로 담은 현황 파일로, 종별·업소명·소재지 주소·전화번호·병상수·집단급식소 설치 여부를 담는다(CSV 약 1KB 규모의 소규모 목록). 고창군 주민이나 분석가가 "군내 요양병원은 어디에 있고 병상은 몇 개인가" 같은 지역 의료자원 현황을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터(LOCALDATA 인허가 등)와는 업소명·주소를 맞춰 이어야 한다.
description_portal: 전북특별자치도 고창군 병의원 및 요양병원 현황자료 공공데이터는 고창군 내 의료시설의 위치 및 병상 정보를 제공합니다. 이 데이터에는 병원명, 주소, 병상수 등의 정보가 포함되며, 지역 내 의료자원의 효율적 배분과 관리에 중요한 역할을 합니다. 이를 통해 주민들은 가까운 의료시설을 신속히 확인하고, 응급 상황 발생 시 빠르게 대처할 수 있습니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다. 또한, 오픈 API를 통해 JSON/XML 형식으로 활용할 수도 있습니다. 해당 데이터는 고창군 행정지원과에서 관리하며, 연간 업데이트됩니다. 보다 자세한 내용은 공공데이터포털에서 확인할 수 있습니다.
