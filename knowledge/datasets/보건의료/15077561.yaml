description_portal: 대전광역시 공중 위생 특사경 지명 분야 ’21년 세부 추진 계획 자료는 지역 내 공중 위생 관련 업소에 대한 감독과 단속 계획을 구체적으로 안내하는 자료입니다. 무면허 행위, 면허 대여, 유사 의료 행위 등 불건전한 영업 행위를 효과적으로 차단하기 위한 세부 단속 전략이 반영되어 있으며, 특히 숙박업과 미용 업소를 대상으로 기획 단속 활동을 집중적으로 추진합니다. 각 영업장의 위생 수준 관리, 불법 행위 사전 예방, 시민 건강 보호와 위생 환경 개선을 도모하는 것이 주요 목표입니다. 해당 자료에는 연도 별 단속 수립 일정, 관리 대상 업소 별 점검 내용, 적발 사례, 위반 행위 유형, 개선·보완 방안 등 실무에 유용한 정보가 포함되어 있습니다.
