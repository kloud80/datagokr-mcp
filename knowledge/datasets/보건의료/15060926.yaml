description_portal: 안양시 흡연구역 및 흡연부스 시설(흡연구역명,구분,소재지도로명주소,소재지지번주소,위도,경도,관리기관)현황입니다.흡연구역은 담배 흡연이 허용된 공간으로, 공공장소 내 간접흡연 피해를 줄이고 흡연자와 비흡연자의 권리를 조화롭게 보장하기 위해 지정됩니다. 대한민국에서는 「국민건강증진법」과 각 지자체 조례에 따라 흡연구역과 금연구역이 구분되어 운영되고 있어요.흡연자와 비흡연자의 갈등을 해소하고 건강하고 깨끗한 안양을 만들기 위한 흡연구역 데이터를 제공합니다. 공공데이티포털의 흡연시설 현황이나 지자체별 흡연구역 안내 페이지에서 확인할 수 있으며, CSV,API형식으로 제공됩니다.
