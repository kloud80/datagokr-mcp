description_portal: '□ 개요 전문요양실 시범사업은 노인요양시설 내 의료 및 간호처치 욕구가 있는 수급자에게 의료의  연계를 통한 체계적인 간호서비스 제공으로 요양과 건강관리를 통합 제공하는 제도입니다. - (이용대상) 전문요양실 입실기준에 해당하는 수급자(1~4등급자) - (참여기관) 정원 50인 이상의 노인요양시설 - (제공서비스) 전문요양실 서비스 범위 내 간호관리* 및 교육․상담․건강증진 활동 등 상시 건강관리 서비스를 제공   * 영양관리, 배설관리, 호흡관리, 상처관리 등 본 데이터는 국민건강보험공단에서 제공하는 2025년도 전문요양실 시범사업 선정기관 목록에 관한 정보입니다.□ 주요 내용- 참여구분코드: 전문요양실 참여기관(Y로 일괄 발췌)- 사업년도: 2025년으로 일괄발췌- 적용시작일자: 2025년도 전문요양실 시범사업 적용일(2025-05-01로 일괄 발췌)- 적용종료일자: 2025년도 전문요양실 시범사업 종료일(기관별 상이)- 장기요양기관명: 전문요양실 시범사업에 참여한 장기요양기관 이름- 입소정원1: 전문요양실에 입소가능한 정원에 관한 정보(27~32명 또는 33~38명으로 일괄발췌)    ※ 발췌일자 기준 장기요양 전문요양실 시범사업에 참여중인 기관 기준으로 집계'
