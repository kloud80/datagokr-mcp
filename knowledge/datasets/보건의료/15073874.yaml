summary_user: 국내 유통 의료기기에 부여된 표준코드(UDI-DI)를 제품 단위 목록으로 담고, 코드 체계 구분, 업체명, 업체 형태(제조·수입 등), 사업자등록번호를 함께 제공하며 범위는 전국이다. 의료기관 구매 담당자나 유통업체가 '이 바코드(UDI-DI)는 어느 업체가 등록한 코드인가'를 확인하거나, 분석가가 업체별 등록 코드 현황을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 업체명(BSSH_NM)·사업자등록번호 같은 이름·코드 매핑이나 같은 식약처 의료기기 데이터의 코드로만 이어 쓴다.
limits: 표준 조인 키가 없어 다른 데이터와는 업체명·코드 매핑으로만 연결되며, 매칭 정확도를 따로 확인해야 한다. 활용신청은 자동승인이지만 개발계정은 하루 10,000회로 호출이 제한된다.
