description_portal: 이 공공데이터는 의료기기 표준코드(UDI코드)정보는 국내에서 유통되는 의료기기에 부여된 고유식별자인 UDI-DI(의료기기 표준코드)와 관련 정보를 제공하는 공공데이터입니다. 이 공공데이터는 각 의료기기의 UDI-DI 코드와 함께 코드 체계, 업체명, 업체 형태를 포함하여 목록 형태로 제공되고 있습니다. 이 공공데이터를 통해서 의료기기의 유통 현황, 이력 관리, 제품 식별이 가능해지며 추적성과 투명성을 높이고 의료기기 안전관리와 시장 분석에도 유용하게 활용될 것으로 예상됩니다.
