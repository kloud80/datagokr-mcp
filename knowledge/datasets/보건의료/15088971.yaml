description_portal: '설명자료: 경상남도 창원시 의창구 및 성산구 소재 약국 정보 제공1. 목적 및 배경경상남도 창원시 의창구와 성산구에 거주하거나 이 지역을 방문하는 시민들이 의약품을 보다 안전하고 편리하게 구매할 수 있도록, 지역 내에 위치한 약국의 현황(명칭, 주소, 전화번호 등) 을 제공하는 것입니다.이 정보는 다음과 같은 경우에 유용하게 활용될 수 있습니다:민원 응대: 의약품 접근성, 판매 여부 등에 대한 민원 발생 시 지역 약국 현황을 기반으로 신속한 안내 가능지역 보건정책 수립: 공공심야약국, 저소득층 약제 접근성 확대 등 정책 추진 시 기초 자료로 활용응급상황 대비: 응급의약품이나 특정 조제약이 필요한 경우 가까운 약국에 대한 정보를 빠르게 확보 가능온라인 의약품 구매 관련 위법 사례 점검: 오프라인 약국 현황과 비교해 불법 유통 대응 자료로도 활용2. 제공 항목 설명항목명설명약국명해당 약국의 상호명입니다. 시민들이 약국을 인지하거나 전화로 문의 시 활용됩니다.소재지(주소)도로명 주소를 기준으로 약국의 실제 위치를 나타냅니다. 모바일 지도 검색 및 내비게이션 활용이 용이합니다.전화번호약국에 직접 문의하여 의약품 보유 여부, 영업시간 등을 확인할 수 있는 연락처입니다.'
