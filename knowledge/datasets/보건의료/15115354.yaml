summary_user: 서울특별시 중랑구에 있는 병원·종합병원·치과병원 등 입원 시설을 갖춘 의료기관의 인허가 정보를 개별 의료기관 단위로 담는다. 인허가일자, 영업상태와 폐업일자, 주소, 사업장명, 좌표, 병상·의료인 수 등을 함께 담는다. 중랑구에서 어떤 병원이 언제 문을 열고 닫았는지 확인하거나, 병의원 개폐업 흐름을 상권 변화 신호로 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 자치구의 같은 LOCALDATA 인허가 데이터와는 같은 컬럼 구조와 개방서비스 기관 코드(OPNSFTEAMCODE)로 이어 붙이고, 그 밖의 데이터와는 주소·사업장명 매핑으로 연결해야 한다.
description_portal: '서울특별시 중랑구의 병원, 종합병원, 치과병원 등 의사가 환자를 진찰 및 진료하는데 필요한 설비가 갖춰있으며, 30명 이상의 환자를 수용할 수 있는 시설을 갖춘 의료기관 정보입니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 주소, 사업자명, 좌표정보 등이 있습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
