description_portal: 고령화 사회 가속화와 노인 인구 급증에 따른 장기요양 서비스 수요 폭증, 노인장기요양보험제도 도입으로 인한 체계적 요양서비스 제공 체계 구축 필요성, 그리고 코로나19 등 감염병 상황에서 노인 돌봄 서비스의 전문성과 지속성 확보 중요성이 부각됨에 따라 보령시는 관내 장기요양기관 현황을 종합적으로 관리하고 있습니다. 장기요양기관은 노인장기요양보험법에 따라 신체활동 지원, 가사활동 지원, 인지활동형 프로그램 등 다양한 장기요양급여를 제공하는 핵심 인프라로서 지역 내 거동불편 노인과 그 가족들의 삶의 질 향상에 중요한 역할을 담당하고 있습니다. 각 기관의 급여 유형과 위치 정보를 체계화하여 요양서비스 이용자들이 거주지 인근에서 적합한 서비스를 선택할 수 있도록 지원하며, 지역별 요양 인프라 분포 분석과 서비스 접근성 개선 방안 수립에 활용하고 있습니다.
