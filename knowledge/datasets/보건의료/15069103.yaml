description_portal: 광주광역시 전체 및 자치구별 공중위생법상 공중위생업소와 위생용품관리법상 위생용품제조업소에 대한 현황은, 각 자치구에서 관리·신고된 자료를 바탕으로 업종별로 체계적으로 정리된 데이터입니다. 공중위생업소에는 숙박업, 세탁업, 목욕장업, 이용업, 미용업, 피부미용업, 건물위생관리업 등 다양한 업종이 포함되며, 위생용품제조업소는 위생용품관리법에 따라 규정된 품목을 제조·관리하는 사업장을 의미합니다. 해당 데이터는 광주광역시 산하 동구, 서구, 남구, 북구, 광산구 등 모든 자치구를 대상으로 하며, 자치구별로 등록된 업소 수를 각각의 업종별로 세분화하여 제공하고 있어 지역별 공중위생 수준 및 산업 구조를 파악하는 데 유용합니다. 또한 이 데이터는 주기적으로 업데이트되어 최신 통계를 반영하여 보여줍니다
