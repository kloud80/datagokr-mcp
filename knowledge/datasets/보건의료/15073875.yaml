summary_user: 의료기기 표준코드(UDI-DI) 한 건마다 품목명·분류번호·등급·품목허가번호와 허가일자, 모델명·제품명, 인체이식형·일회용·추적관리대상·멸균 필요 여부, 사용목적·저장·유통 조건, 제조수입업체명, 요양급여대상 여부를 담는 전국 단위 제품 원천 정보이며, 검증 호출에서는 0행이 수신되어 규모는 확인되지 않았다. 병원 구매·재고 담당자나 분석가가 "이 바코드(UDI-DI)의 제품이 인체이식형 추적관리대상인지, 건강보험 요양급여 대상인지"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 품목허가번호(PERMIT_NO)나 업체명·품목명 같은 코드·이름 매핑으로 식약처 의료기기 품목허가 정보 등 같은 기관 데이터와 이어 쓴다.
description_portal: 의료기기 표준코드별 제품정보는 의료기기 표준코드(UDI-DI)를 기반으로 해당 제품의 상세 정보를 제공하는 공공데이터입니다. 주요 항목으로는 UDI-DI 코드, 품목명, 분류번호, 등급, 품목허가번호 및 허가일자, 모델명, 제품명, 인체이식형 여부, 일회용 여부, 추적관리대상 여부, 한벌구성 의료기기 여부, 조합의료기기 여부, 사용 전 멸균 필요 여부, 멸균 방법, 사용 목적, 저장 조건, 유통 취급 조건 정보, 제조·수입 업체명, 요양급여대상 여부의 정보가 포함되어 있습니다. 이 데이터를 통해 의료기기의 성격과 사용 조건을 명확히 파악할 수 있으며, 안전한 사용과 관리를 위한 기초자료로 활용됩니다. 또한 제품 확인, 이력 추적, 급여 여부 확인 등에 활용할 수 있어 의료기기 관리의 투명성과 효율성을 높입니다.
