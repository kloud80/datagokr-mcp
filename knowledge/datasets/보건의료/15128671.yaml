description_portal: 경기도 하남시 예방접종 의료기관 현황 데이터로 의료기관명, 예방접종 지원사업 유무, 도로명 주소, 연락처 등의 데이터를 제공하고 있습니다.특히 감일, 미사, 위례 등 주요 거점 지역의 내과, 소아청소년과, 이비인후과, 정형외과 등에서 B형간염, 인유두종바이러스, 인플루엔자, 폐렴구균, 코로나19 예방접종을 포함한 다양한 예방접종 서비스를 제공합니다.어린이 국가예방접종 지원사업, B형간염 주산기감염 예방사업, (인유두종바이러스) HPV 국가예방접종 지원사업, 인플루엔자 국가예방접종 지원사업, 어르신 폐렴구균 예방접종사업, 코로나19 예방접종지원사업 각각에 대한 위탁의료기관의 예방접종 지원사업 유무를 알 수 있습니다.국가예방접종에 해당하는 백신의 예방접종비용은 무료입니다.이 외 추가문의가 필요한 경우 하남시보건소 예방접종실 031-790-6575로 연락주세요.
