description_portal: 본 데이터는 전북특별자치도에서 시행하는 고혈압·당뇨병 등록관리사업의 추진 현황을 보여주는 자료입니다. 이 사업에 참여하고 있는 지역 내 의원 및 병원 등 의료기관의 목록을 상세히 제공하며, 각 기관의 주소와 연락처 정보를 포함하고 있습니다. 또한, 각 의료기관별로 사업에 등록하여 관리받고 있는 고혈압 및 당뇨병 환자의 누적 인원수를 명시하여 사업의 참여 규모와 현황을 파악할 수 있도록 합니다. 이 자료는 만성질환 환자들이 사업 참여 의료기관을 쉽게 찾도록 돕고, 공공보건 정책 입안자들이 지역별 만성질환 관리 체계의 성과를 분석하고 자원을 배분하는 데 중요한 기초 데이터로 활용됩니다
