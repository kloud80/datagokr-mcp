summary_user: 식품의약품안전처가 허가한 의약외품을 제품(품목) 단위로 담은 건별 허가 정보로, 품목명·업체명·품목 분류번호·효능·효과·용법·용량·사용상의 주의사항을 전국 범위로 제공한다. 소비자나 약사가 '이 마스크·소독제·치약 같은 의약외품이 어떤 효능으로 허가됐고 어떻게 쓰며 주의할 점은 무엇인가'를 확인하거나, 사업자가 특정 업체의 허가 품목을 찾는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못해, 식약처의 다른 허가 정보와는 품목명·업체명을 맞추는 방식으로만 이어 쓴다.
description_portal: 식품의약품안전처 「의약외품 제품 허가 정보」 OpenAPI는 의약외품의 허가 현황을 조회할 수 있는 공공데이터입니다. 제공 항목에는 품목명, 업체명, 품목 분류번호, 효능·효과, 용법·용량, 사용상의 주의사항 등이 포함되어 있습니다. 이 데이터를 통해 특정 의약외품이 어떤 효능을 가지며, 어떤 방식으로 사용해야 하고, 사용 시 주의할 점이 무엇인지 직접 확인할 수 있습니다. 또한 제품별로 제조 또는 판매 업체와 품목 분류번호를 확인할 수 있어 기본적인 제품 특성과 허가 정보를 명확히 알 수 있습니다.
