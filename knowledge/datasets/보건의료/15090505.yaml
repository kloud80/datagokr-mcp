summary_user: 전라남도 고흥군 관내 병원을 한 곳당 한 행으로 담은 파일로, 사업장명·소재지 전체주소·전화번호·업태구분을 담고 파일 크기는 659바이트로 소규모다. 고흥군 주민이나 분석가가 '고흥군에 어떤 병원이 어디에 있고 연락처는 무엇인가'를 확인하거나, 병의원 분포를 지역 상권·의료 접근성 판단의 보조 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 문자열 매칭이나 같은 기관(고흥군) 자료 기준으로만 이어 쓰며, LOCALDATA 의료기관 인허가 원천과 대조하는 용도가 자연스럽다.
limits: 인허가번호·개폐업일자·좌표 같은 코드나 키 컬럼이 없어 다른 데이터와 정확한 조인이 어렵고 이름·주소 매칭에 의존해야 한다. 범위는 고흥군 한 시군구에 한정되며, 병원 종별 외 의원·치과 등 다른 의료기관은 이 파일 제목상 포함 여부를 따로 확인해야 한다.
