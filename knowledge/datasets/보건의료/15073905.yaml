summary_user: 의료기기 GMP 심사 신청 품목별로 심사 구분·종류·사유, 전체 평가항목 수와 보완 필요 항목 수, 심사 결과와 통지일, 제조자명·국가·주소, 진행 상태, 수출용·대표품목 여부 등을 건별로 담는다. 의료기기 제조·수입업체가 'GMP 심사에서 어떤 항목이 자주 보완 요구를 받고, 우리 신청 건은 어느 단계에 있는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 품목명·제조자명이나 의료기기 분류번호(MDEQ_CLSF_NO)·등급 코드로 이름·코드 매핑해 의료기기 품목허가 정보와 맞춰 보는 방식으로만 잇는다.
description_portal: 해당 공공데이터는 의료기기 GMP 심사 과정 중 재보완 정보를 제공하여, 심사 투명성과 품질 보증을 강화하고자 수집되었습니다.- 세부 항목에는 식약처 보완 내용·보완 항목, 재보완 심사 결과·필요 항목 수, 재보완 제출일·심사일, 대표품목 여부, 품목군 제외 여부, 심사신청 번호·품목번호, 제조자명·국가·주소, 진행 상태, 수출용 여부, 담당자 승인 여부 등이 포함됩니다. - 이 데이터를 통해 제조·수입업체는 재보완이 많이 발생하는 항목을 사전에 파악하여 품질관리와 행정절차 효율화에 활용할 수 있습니다.
