summary_user: 통계청 사망원인통계를 바탕으로 알코올 관련 질환(알코올성 간 질환, 알코올 사용에 의한 정신·행동장애, 알코올 중독 등) 전체 사망자 수와 인구 10만 명당 사망률을 연도별·성별(남자·여자·총계)로 정리한 전국 단위 집계 파일입니다. 음주폐해 예방 정책 담당자나 연구자가 "알코올 관련 사망이 해마다 남녀별로 어떻게 변하고 있는가"를 확인할 때 쓴다. 전역 조인 키는 없으므로 다른 통계와는 연도와 성별을 기준으로 맞춰 이어 쓴다.
description_portal: 음주폐해예방 관련 지표- 통계청 사망원인통계에 근거하여 알코올 관련 질환 전체 사망자 수와 인구 10만 명당 사망률을 성별로 제시한 것입니다. - 단위는 명과 퍼센트이며, 사망률은 주민등록 인구를 기준으로 산출되며 해당 연도의 인구수와 이전 연도의 인구수 평균을 분모로 사용합니다. - 알코올 관련 사망에는 알코올에 의한 직접적인 질환과 중독 사고를 포함하되, 사고, 타살, 태아알코올증후군과 같은 간접적 사망은 제외됩니다. - 주요 포함 질환에는 알코올 유발성 가성 쿠싱 증후군(E24.4), 알코올 사용에 의한 정신 및 행동장애(F10), 알코올성 간 질환(K70) 등 다양한 질환과 알코올로 인한 중독 및 노출 사례가 해당됩니다.
