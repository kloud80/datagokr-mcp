summary_user: 대전광역시 서구에 있는 산후조리원을 한 곳씩 담은 건별 현황 파일로, 신고일자·영업구분·영업소명·소재지·전화번호를 담으며 파일 크기는 667바이트로 작다. 서구에서 산후조리원을 찾는 산모나 가족, 지역 산후돌봄 시설의 분포와 신고 시점을 살피는 분석가가 '서구에 어떤 산후조리원이 어디에 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업소명이나 소재지 주소를 맞춰 잇거나, 같은 기관 자료 또는 LOCALDATA 산후조리원 인허가 자료와 이름·주소로 대조해 쓴다.
limits: 서구 한 개 시군구만 다루므로 대전 전체나 다른 지역과 비교하려면 별도 자료가 필요하고, 조인 키가 없어 주소·이름 매칭에 의존한다. 포털 설명문은 석유 판매업소에 관한 내용이라 실제 필드(산후조리원)와 맞지 않으니 설명보다 필드를 기준으로 해석한다.
