description_portal: 이 데이터는 국립암센터에서 수집한 PRE(선행) 위암 환자의 외과적 병리 소견에 대한 메타정보입니다. 위암 수술 후 확보된 조직검체를 기반으로 한 병리학적 평가 결과로, 절제 연의 암 침범 여부, 병리학적 병기(pTNM), 림프절 전이 개수, 분화도, 혈관 및 림프관 침습 여부, 절제연 상태(R0, R1 등) 등 주요 항목이 포함됩니다. 선행 치료 이후의 병리 소견은 치료 반응을 객관적으로 평가하고 향후 보조 치료 여부를 결정하는 데 중요한 자료로 활용됩니다. 해당 데이터는 위암 환자의 예후 분석, 치료 전략 수립, 병리적 반응률 연구 및 정밀의료 기반 임상연구 등 다양한 보건의료 연구에 핵심적인 기초자료로 사용됩니다.
