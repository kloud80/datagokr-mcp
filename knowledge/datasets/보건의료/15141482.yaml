summary_user: 서울 종로구에서 영업 중이거나 폐업한 안경업소의 인허가 내역을 업소 한 곳당 한 행씩 담은 건별 원천 자료로, 인허가일자·취소일자·영업상태·폐업일자·소재지 주소·좌표, 시력측정기·렌즈절단기 같은 장비 보유 수, 면적을 포함한다. 종로구 안에서 지금 문을 연 안경점이 어디이고 최근 몇 곳이 폐업했는지 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 지자체코드(OPNSFTEAMCODE)·주소·업소명 매칭으로 잇고, 다른 자치구의 같은 LOCALDATA 인허가 자료와는 같은 컬럼 구조로 이어 붙여 쓴다.
description_portal: 이 데이터는 「의료기사 등에 관한 법률」 및 「공중위생관리법」에 따라 서울특별시 종로구 내에서 안경업을 운영하거나 폐업한 사업체의 인허가 현황을 수록한 자료입니다. 주요 항목은 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등으로 구성되어 있으며, 안경업소의 개설, 변경, 폐업 등 행정이력을 확인할 수 있습니다. 이 자료는 지역 보건위생 정책 수립, 안경 관련 서비스 이용현황 파악, 공공 보건 지도·점검 등 다양한 행정·정책 수요에 활용됩니다. 또한, 시력교정 및 보건의료 서비스 이용 접근성을 분석하거나, 공공 건강 관리 체계 수립 시 참고자료로 유용합니다.
