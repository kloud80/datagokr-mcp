description_portal: "이 데이터는 질병관리청이 제공하는 기관 생명윤리위원회 등록 현황 자료 입니다. 2020년까지 등록괸 기관 생명윤리위원회의 '기관명', '운영 방식', '위원회 유형'(예: '인간 대상 연구', '인체유래물 연구') 등의 정보를 담고 있습니다. 이자료는 인간 대상 연구 및 생명자원 관리의 윤리적 기준을 준수하기 위한 국가 관리 체계를 보여주며, 총 868건의 기관정보를 포함합니다. 이 데이터는 생명과학 연구의 투명성과 윤리적 기준을 파앙ㄱ하는 데 필수적인 기초자료로, 2021년부터 관련 업무가 국가생명윤리정책원으로 이관되었습니다."
