description_portal: '본 데이터는 한국보건의료인국가시험원에서 시행한 국가시험의 시험장소를 분석할 수 있는 데이터를 제공합니다.(자료 기준일 : 2026. 6. 2. 기준) 한국보건의료인국가시험원의 국가시험에 대한 시험연도, 시험직종, 회차, 응시지역, 시험장명, 시험실수, 수용인원수를 제공합니다. 이 데이터는 다음과 같은 목적과 활용 가능성을 가지고 있습니다.1.  보건의료 국가시험 시험장소 정보에 대한 기초 통계 정보를 제공합니다.2. 보건의료 국가시험 분야 인력 수급 및 시험 현황 분석, 교육 환경 분석에 활용할 수 있습니다.3. 공공데이터 분석 및 민간 활용 기반에 활용할 수 있습니다.'
