description_portal: '해당 데이터는 국민건강보험공단이 시행하는 1차 일반건강검진 및 생애전환기건강검진의 연도별·지역별 수검률을 제공하는 통계입니다.일반건강검진은 직장가입자, 지역가입자 및 피부양자 등을 대상으로 하며, 생애건강검진은 만 40세 및 66세를 대상으로 시행되는 특화된 검진입니다.본 수검률은 국가 건강검진 참여 현황을 측정하고, 지역별 수검격차를 분석하는 데 활용됩니다.○ 내용: 해당년도 일반/생애 1차 건강검진 수검자의 비율○ 대상: 해당년도 일반/생애 1차 건강검진 대상자○ 산출식  - 분자: 일반/생애 1차 건강검진 수검자 수  - 분모: 일반/생애 1차 건강검진 대상자 수'
