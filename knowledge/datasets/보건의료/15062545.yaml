summary_user: 경상남도 내 보건소 한 곳마다 명칭, 소재 시군구, 도로명주소, 대표자, 전화·팩스, 홈페이지를 담은 개별 기관 목록이며, 범위는 경상남도 한 시도입니다. 도민이 우리 시군 보건소의 위치와 연락처를 찾거나, 분석가가 경남 시군별 보건소 분포를 정리하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구 이름(sigungu)이나 보건소 명칭을 매칭해서 잇고, 지역사회 건강조사 같은 시군구 건강지표와도 이름 매핑으로 연결한다.
description_portal: 경상남도 보건소의 명칭, 내용, 소재지 등을 조회하는 경상남도 보건소 정보 조회 서비스
