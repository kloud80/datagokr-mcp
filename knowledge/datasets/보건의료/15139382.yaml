summary_user: 의료기관 종별·진료과목별(의원급은 표시과목별)로 진료년도 단위 건강보험 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액을 전국 단위로 모은 집계 통계로, 약국과 한방은 빠지고 양방만 담는다. 분석가나 정책 담당자가 '상급종합병원과 의원에서 진료과별 건강보험 진료비가 연도별로 어떻게 달라졌나'를 비교하는 데 쓴다. 전역 조인 키가 없어 요양기관 원장(ykiho) 계열 API와 직접 연결되지 않으므로, 다른 통계와는 진료년도·의료기관종별·진료과목 이름을 맞춰 이어 쓴다.
limits: 개별 요양기관이나 지역(시도·시군구) 단위 분석에는 쓰지 못하는 전국 집계이며, 비급여 진료비는 요양급여비용총액에 포함되지 않는다. 환자수는 범주 안에서만 중복을 제거한 값이라 종별·과목을 단순 합산하면 같은 환자가 중복 집계된다. 진료년도 기준 통계지만 심사분은 진료년 다음 해 4월 심사분까지 반영된 값이다.
