description_portal: 영도구 홈페이지에서 제공하는 자료는 2026년 3월 기준으로 소독의무대상시설의 명칭, 소재지(주소), 업소현황 등 상세 항목을 포함합니다. 감염병의 예방 및 관리에 관한 법률에 따라 공동주택, 숙박업소 등 여러 사람이 거주하거나 이용하는 다중이용시설은 대통령령이 정한 기준에 따라 정기적으로 소독을 실시해야 하며, 해당 자료는 관내 위생관리 실태를 모니터링하고 방역 대책을 수립하는 기초자료로 활용됩니다. 또한 주민과 관계 기관이 시설별 소독 이력 및 관리 상태를 확인하여 감염병 확산을 예방하고, 필요 시 신속한 행정적·기술적 지원을 제공하는 데 중요한 근거 자료로 활용됩니다.
