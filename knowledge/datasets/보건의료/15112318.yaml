description_portal: 시 지역 의료기관의 특수의료장비(전산화단층 촬영장치, 자기공명영상 촬영장치)설치 및 운영 시설기준은 200병상 이상 이며200병상 미만인 의료기관이 특수의료장비를 설치 및 운영 하려면 (지리적으로 인접한) 다른 의료기관과 병상을 공동활용하여 운영한다.공개하는 데이터는 부산광역시 남구 관내 의료기관의 특수의료장비 공동활용동의에 대한 것으로, 데이터는 의료기관명, 병상수, 전산화단층 촬영장치(공동활용동의 가능 여부), 자기공명영상 촬영장치(공동활용동의 가능 여부) 종류로 구성되어 있습니다
