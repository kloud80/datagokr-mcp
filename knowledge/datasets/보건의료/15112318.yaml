summary_user: 부산광역시 남구 관내 의료기관별로 병상수와 전산화단층촬영장치(CT)·자기공명영상촬영장치(MRI) 병상 공동활용 동의 가능 여부를 기관 한 건당 한 행으로 담은 소규모 파일(CSV 약 1KB)이다. 200병상 미만 병원이 CT·MRI를 설치하려고 공동활용 병상을 확보할 때, 남구에서 어느 의료기관이 동의 가능한지 찾는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가 데이터와는 의료기관명으로만 맞춰 이어 쓴다.
