summary_user: 대구광역시 9개 구·군에 개설된 요양병원을 한 곳당 한 행으로 담은 현황 파일로, 구·군 구분과 의료기관명·전화번호·소재지 주소가 들어 있습니다. 보호자가 우리 구 근처 요양병원과 연락처를 찾거나, 분석가가 구·군별 요양병원 분포를 비교하는 데 쓴다. 전역 조인 키나 기관 코드가 없어 다른 의료기관 데이터와는 의료기관명이나 주소를 맞춰 이어야 한다.
description_portal: '- 대구광역시 9개 구,군에 소재한 전체 요양병원의 현황을 제공하는 데이터 입니다.         - 현재 개설된 요양병원은 전체 67개소로 중구 1개소, 동구 8개소, 서구 11개소, 남구 7개소, 북구 12개소, 수성구 9개소, 달서구 12개소, 달성군 7개소로 등록되어있습니다.- 각 요양병원 별로 의료기관의 명칭과 소재지 및 전화번호 등이 등재되어 있습니다. - 해당 데이터는 구, 군에서 대구광역시로 제공 받아서 Excel 형식으로 구분하여 제공됩니다.- 해당 데이터의 기준 일자는 2026년 1월 1일 입니다.'
