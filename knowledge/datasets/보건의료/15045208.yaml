summary_user: 부산광역시 서구 관내 의원을 한 곳당 한 행으로 담은 목록 파일로, 의료기관명·도로명 주소·대표 전화번호만 들어 있다(포털 설명 기준 61개소). 서구 주민이나 방문객이 '집 근처에 있는 의원이 어디이고 전화번호가 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 기관 코드가 없어, 다른 데이터와 잇려면 의료기관명이나 도로명 주소를 문자열로 맞춰야 한다.
description_portal: '본 데이터는 부산광역시 서구 관내에 주소지를 둔 의원 의료기관 현황 정보 데이터입니다. 이 데이터는 각 의원의 의료기관 명칭, 의료기관 주소(도로명 주소), 문의 및 안내를 위한 의료기관 대표 전화번호에 관련된 정보가 포함되어 있어 의료기관 방문이나 문의가 필요한 경우 유용하게 활용될 수 있습니다.* 부산광역시 서구 소재 의원: 61개소(기준일자: 2026. 6. 12.자)* 이 정보는 서구 주민이나 방문객들이 의원을 선택하고 이용하는 데 필요한 기본적인 연락처와 위치 정보를 한눈에 파악할 수 있습니다.'
