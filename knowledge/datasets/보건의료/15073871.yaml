summary_user: 식약처가 관리하는 의료기기 광고 사전심의 대상 품목 정보를 품목 단위로 담으며, 품목명·품목분류번호·형명(모델)·제조(수입)국과 제조원 정보가 들어 있고 범위는 전국이다. 광고 대행사나 의료기기 업체가 특정 의료기기 모델이 광고 사전심의 신청 품목에 올라 있는지, 제조원과 제조국이 어디인지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 의료기기 품목허가 정보 등 다른 데이터와는 품목명·품목분류번호 같은 이름·코드 매핑으로만 이어 쓴다.
limits: 다른 데이터셋과 바로 붙는 공통 키가 없어 품목명·분류번호 매칭에 기대야 하므로 연결 결과를 따로 검증해야 한다. 지역 단위가 없는 전국·비공간 데이터라 지역별 분석에는 맞지 않는다. 개발계정은 하루 10,000회로 호출이 제한된다.
