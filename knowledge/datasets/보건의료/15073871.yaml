description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 의료기기 사전광고품목 정보입니다.  의료기기 광고의 사전심의 과정에서 승인받은 광고 대상 품목들의 상세 현황을 체계적으로 관리하여 광고 업계와 의료기기 업계에 투명한 정보를 제공합니다.  광고업소명과 광고업소허가번호는 광고 제작 업체의 신원과 허가 상태를 명확히 보여주며 품목명과 품목분류번호로 광고 대상 의료기기를 정확히 특정할 수 있습니다 품목허가번호와 형명 정보는 해당 의료기기의 공식 승인 상태와 구체적인 모델을 확인할 수 있게 하며 품목순번을 통해 체계적인 관리 번호를 제공합니다.
