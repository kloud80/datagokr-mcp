summary_user: 서울 양천구 관내 편의점 등 안전상비의약품 판매업소의 인허가 정보를 업소 한 곳당 한 행으로 담은 데이터로, 사업장명·주소·인허가일자·취소일자·영업상태·폐업일자·좌표(X, Y) 등을 포함한다. 주민이 집 근처에서 밤이나 휴일에 상비약을 살 수 있는 영업 중인 판매업소를 찾거나, 구청·분석가가 판매업소의 개업·폐업 추이와 분포를 점검할 때 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 전역 조인 키가 없어서, 다른 데이터와 붙이려면 사업장명·주소를 직접 맞춰 보거나 같은 기관 코드(OPNSFTEAMCODE)·관리번호 체계를 기준으로 연결해야 한다.
description_portal: 본 자료는 서울특별시 양천구 관내 안전상비의약품 판매업소의 인허가 현황을 종합적으로 수록한 데이터이다.사업장명, 소재지주소, 인허가일자, 영업상태 등의 학목을 제공하여 주민들이 안전하게 의약품을 구매할 수 있도록 구성되어 있다. 해당 데이터는 정확성을 기하기 위하여 관할 보건·의약 관련 부서에서 수집한 공식 정보를 기반으로 하며, 업소별 인허가 상태와 운영 현황을 체계적으로 확인할 수 있도록 정리되어 있다. 이를 통해 의약품 안전 관리, 정책 수립, 위생 점검 및 주민 편의 제공에 활용 가능하며, 지속 가능한 지역사회 의약품 유통 관리 체계 확립과 주민 건강 보호에 기여한다.
