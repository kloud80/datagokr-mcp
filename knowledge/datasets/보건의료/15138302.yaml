description_portal: 병원 내 내부 정보보안을 강화하고 교직원들의 업무 효율성을 증대하기 위해, 사내 포탈 시스템의 메뉴(아이콘) 접근 권한을 체계적으로 통제하고 관리할 목적으로 수집된 데이터입니다.해당 데이터는 포탈 내 특정 기능에 대한 접근 제어 현황을 담고 있으며, 세부 항목으로는 각 메뉴를 식별하는 아이콘코드, 화면 노출 순서를 나타내는 표출번호, 권한의 유효 기간을 명시하는 시작일자 및 종료일자 총 4종으로 구성되어 있습니다.학계 및 연구기관은 해당 데이터를 익명화된 인사 정보와 결합하여 대규모 조직의 내부 시스템 접근 통제 모델 연구에 활용할 수 있습니다. 또한, 향후 차세대 병원정보시스템(HIS) 고도화 시 인사 발령 데이터와 연동하여 자동으로 권한을 부여·회수하는 통합계정관리(IAM) 구축의 기초 자료로 활용될 수 있으며, 철저한 권한 부여 이력 관리를 통해 내부 보안 감사 대응 및 정보 유출 방지 체계를 강화하는 데 기여할 수 있습니다.
