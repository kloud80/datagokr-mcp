description_portal: '□ 데이터 설명본 데이터는 국가건강검진을 실시하는 의료기관의 검진 유형별 현황을 제공하기 위해 구축된 자료입니다. □ 주요 내용1. 검진유형 : 해당 의료기관에서 제공하는 검진 서비스를 유형별로 구분 - 일반건강검진: 성인 대상 기본 건강검진 - 영유아검진: 영유아 발달 및 건강 확인 - 구강검진: 치아 및 구강 건강 확인 - 암검진: 특정 암 종류별 검진 제공 여부 - 위암, 대장암, 간암, 유방암, 자궁경부암, 폐암 등2. 검진장소: 검진이 이루어지는 장소를 구분 - 내원: 검진 대상자가 의료기관을 직접 방문 - 출장: 의료기관이 대상자를 찾아가는 출장검진 - 내원+출장: 기관과 대상자가 모두 선택 가능한 혼합 방식3. 건강검진기관: 국가건강검진 실시 기관으로 지정된 의료기관 정보4. 발췌 기준: 자료는 매월 말 기준으로 수집 및 갱신*  “빈 셀은 데이터가 존재하지 않음을 의미하며, 공란(null value)으로 처리됩니다.”'
