summary_user: 서울 용산구 약국을 사업장 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가·취소일, 영업·상세영업 상태, 휴업·폐업일, 전화번호, 지번·도로명 주소, 좌표가 들어 있습니다. 주민이 집 근처에서 영업 중인 약국을 찾거나, 분석가가 용산구 약국이 언제 문을 열고 닫았는지 보고 상권 변화를 읽는 데 씁니다. 실측 컬럼에는 다른 데이터와 바로 붙는 전역 조인 키가 없어서, 사업장명·주소를 맞추거나 같은 기관의 개방서비스 코드(OPNSFTEAMCODE)·관리번호로 같은 LOCALDATA 계열 인허가 데이터와 연결합니다.
description_portal: 서울시 용산구에서 운영 중인 약국에 대한 정보는 「서울시 용산구 약국 인허가 정보」 공공데이터를 통해 제공되며, 이 데이터는 매일 갱신됩니다. 주요 항목으로는 관리번호, 인허가일자(APVPERMYMD), 인허가취소일자(APVCANCELYMD), 영업상태코드·영업상태명(TRDSTATEGBN / TRDSTATENM), 상세영업상태코드·상세영업상태명(DTLSTATEGBN / DTLSTATENM), 폐업일자(DCBYMD), 휴업시작일자·휴업종료일자(CLGSTDT / CLGENDDT), 재개업일자(ROPNYMD), 전화번호(SITETEL), 소재지 정보(지번주소 • 도로명주소), 우편번호, 사업장명(BPLCNM) 등이 포함되어 있습니다.요약하자면, 이 공공데이터는 인허가 및 영업 상태 변동, 폐업 및 휴업 일정, 연락처, 정확한 주소 정보, 사업장명 등을 포함하여, 용산구 내 약국의 운영 현황을 실시간에 가깝게 추적할 수 있는 매우 유용한 자료입니다. 연구, 행정 업무, 시민 건강 접근성 분석 등 다양한 목적으로 활용 가능합니다.
