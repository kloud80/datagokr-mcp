summary_user: 경기도 시군에 있는 부인과 한방병원의 인허가 현황을 병원 한 곳당 한 행으로 담으며, 명칭·인허가일·영업상태·폐업일·병상수·의료인 수·진료과목·주소와 위경도를 포함한다. 주민이 우리 시군에 영업 중인 부인과 한방병원이 어디에 있고 병상이 몇 개인지 찾거나, 분석가가 개폐업 추이를 지역 상권·의료 접근성 신호로 볼 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 의료기관 인허가 데이터, 행정구역 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군에 위치한 부인과 한방병원에 대한 인허가 현황을 제공하며, 병원별 명칭, 인허가일자, 영업상태, 진료과목, 병상수, 의료인 수, 주소, 위치 좌표 등 총 31개의 항목으로 구성되어 있습니다. 각 병원은 한의사가 외래환자를 대상으로 의료행위를 수행하며, 30병상 이상 수용 가능한 한방병원으로 정의됩니다. 진료과목코드와 내용, 입원실 수, 구급차 및 구조사 수, 완화의료담당부서명 등 의료 기능 관련 항목이 포함되어 있으며, 소재지에 대한 도로명주소 및 위경도 정보도 함께 제공되어 활용도가 높습니다. 이 데이터는 병원 분포 분석, 보건의료 정책 수립, 의료 서비스 접근성 연구 등 다양한 분야에서 활용될 수 있으며, 상업적 이용 및 콘텐츠 변경이 허용됩니다.
