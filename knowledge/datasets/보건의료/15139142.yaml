summary_user: 광주광역시 남구에 있는 약국을 한 곳씩 담은 목록 파일로, 약국 이름·전화번호·도로명 소재지·데이터 기준일자를 담는다(약 9KB CSV, 활용신청 없이 내려받음). 주민이나 지도·건강관리 앱 개발자가 '남구 우리 동네 근처에 어떤 약국이 있고 연락처는 무엇인가'를 확인하거나, 분석가가 남구 안의 약국 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 약국 이름이나 도로명 주소를 맞추는 방식으로만 이어 쓰며, 다른 구 약국 목록이나 LOCALDATA 인허가 자료와 비교할 때도 주소 정제가 필요하다.
