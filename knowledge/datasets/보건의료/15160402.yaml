description_portal: 본 데이터는 한국보건산업진흥원이 제공하는 국민영양통계 원본자료를 기반으로, 2020년부터 2023년까지 각 식품군을 통해 섭취한 영양소의 평균값을 정제·가공하여 제공하는 파일데이터이다. 기존에 연도별, 성별, 연령층별, 지역별로 구분되어 있던 자료를 하나의 파일로 통합하고, 연도, 분석기준, 기준값, 식품군, 영양소, 평균섭취량 및 표준오차 항목으로 재구성하였다. 이용자는 특정 영양소가 어떤 식품군을 통해 섭취되는지 확인하고, 성별·연령층·지역별 영양소 섭취구조와 연도별 변화를 분석할 수 있다. 국민 영양상태 평가, 주요 영양소 공급 식품군 분석, 식생활지침 수립, 영양취약계층 관리, 건강증진정책, 식품 및 급식산업 연구, 통계분석과 인공지능 기반 영양예측 등에 활용할 수 있다.
