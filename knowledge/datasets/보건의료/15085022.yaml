description_portal: '○ 통계개요* 통계명 : 청소년 음주* 통계종류 : 조사통계, 일반통계* 근거법령 : 국민건강증진법 제19조* 작성목적 : 청소년(중·고등학생)의 건강행태에 대한 현황파악을 통해 청소년건강증진사업 계획 및 평가를 위한 기초자료 제공* 조사체계 : 표본학교→보건복지부(질병관리본부) - 학교컴퓨터실에서 일괄조사* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 청소년의 음주에 대한 응답률○ 용어설명* 현재음주율 : 최근 30일 동안 1잔 이상 술을 마신 적이 있는 사람의 분율* 현재 음주자의 위험음주율: 현재 음주자 중에서 최근 30일 동안 1회 평균 음주량이 중등도 이상(남자: 소주 5잔 이상, 여자: 소주 3잔 이상)인 사람의 분율* 구매 시도자의 주류 구매 용이성 : 구매 시도자 중에서 최근 30일 동안 편의점이나 가게 등에서술을 사려고 했을 때 ‘많이 노력’, ‘조금만 노력’ 또는 ‘노력 없이도 쉽게’ 살 수 있었던 사람의 분율○ 기타* 중1~고3 학생을 대상으로 실시'
