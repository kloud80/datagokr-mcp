summary_user: 경기도 구리시 관할 병원·의원 등 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 기관명·의료기관 종별·도로명주소·전화번호·병상 수·총면적·영업상태·진료과목을 포함한다(CSV 약 44KB). 구리시 주민이나 분석가가 "우리 동네에 영업 중인 병상 있는 병원이나 특정 진료과목 의원이 어디에 있나"를 확인하거나 병의원 개폐업을 상권 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·도로명주소 매칭이나 LOCALDATA 병의원 인허가 원천과의 이름 대조로 이어 쓴다.
description_portal: '*병원, 종합병원, 치과병원 등 의사가 환자를 진찰 및 진료하는데 필요한 설비가 갖춰있으며, 30명 이상의 환자를 수용할 수 있는 시설을 갖춘 의료기관 정보.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 병원 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 해당 데이터 법령 소관기관 및 문의처 : 보건복지부 의료기관정책과 / 044-202-2481 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)- 보다 자세한 정보는 지방행정인허가데이터개방(localdata.go.kr)에서 확인하실 수 있습니다.* 경기도 구리시 의료기관 (병의원) 현황 자료를 제공하오니 의료기관 이용자료로 활용하여 주시기 바랍니다. * 경기도 구리시 의료기관 (병의원) 현황 자료는 1년마다 갱신하여 제공할 예정입니다.* 의료기관 (병의원) 현황 자료는 자료 특성상 의료기관 신설 및 휴폐업 등의 사유로 시차가 발생할 수 있습니다.*공공데이터 병의원 현황은 주로 **공공데이터포털**에서 전국 병의원 찾기 서비스, 건강보험심사평가원 데이터셋, 서울특별시 병의원 위치 정보, 경기도 병원 현황 등 다양한 형태로 제공되며, 이는 위치, 진료과목, 병원 종류(의원, 병원, 종합병원, 상급종합병원 등), 병상 수등의 정보를 담고 있어 사용자가 원하는 의료기관 정보를 검색하고 분석하는 데 활용됩니다. 보건복지부, 행정안전부, 건강보험심사평가원, 지자체 등이 제공하며, API 또는 파일 형태로 접근 가능합니다*보건복지부에서 2015년~2023년까지 병원 및 의원 수를 의료기관 종류별(연도, 시도, 병의원_종합병원, 병의원_요양병원, 병의원_일반병원, 병의원_의원, 특수병원_결핵, 특수병원_한센, 특수병원_정신, 치과병 의원_치과병원, 치과병 의원_치과의원, 한방병 의원_한방병원, 한방병 의원_한의원, 부속의원, 조산원)/시도별로 분류하여 데이터를 제공하고 있습니다.<통계 이용 시 주의사항>'
