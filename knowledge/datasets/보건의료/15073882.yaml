summary_user: 식약처가 허가한 의료기기 품목별 포장단위를 담은 건별 원천 데이터로, 품목일련번호·품목허가번호·품목명·허가일자·취소취하 여부와 함께 전국 범위로 제공한다. 의료기기 유통·조달 담당자나 병원 구매 담당자가 '이 허가번호 의료기기는 어떤 포장단위로 나오며 현재 허가가 유효한가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 의료기기 품목허가 데이터와는 품목허가번호(MEDDEV_ITEM_NO)·품목명 같은 이름·번호 매핑으로만 이어 쓴다.
description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 제공하는 의료기기 포장단위정보에 관한 데이터입니다.  이 공공데이터는 식품의약품안전처에서 허가된 의료기기 품목의 포장단위정보를 제공합니다. 그 외에도 사용자 편의성을 위해 의료기기품목일련번호,기관지역구분(업체 관리하는 지방청),업종,허가신고구분,의료기기품목허가번호,허가일자, 취소취하구분, 취소취하일자 등의 정보를 제공하여 사용자가 확인하고 싶은 의료기기 품목의 정보를 한눈에 파악할 수 있도록 돕고 있습니다.
