description_portal: 이 데이터는 국립암센터에서 수집한 PRE(선행) 위암 환자의 병기 정보를 포함하는 메타데이터입니다. 병기 정보는 TNM 분류 체계를 기반으로 하며, 종양의 크기 및 침윤 깊이(T), 인접 림프절 전이(N), 원격 전이(M)에 대한 세부 정보가 포함되어 있습니다. 이 외에도 임상 병기와 병리 병기, 병기 결정 일자, 병기 결정 근거(영상검사, 병리소견 등), 병기 판정 주체 등의 정보가 기록됩니다. 위암 병기 정보는 환자의 치료 계획 수립과 예후 예측에 가장 핵심적인 요소로, 수술 적응증 판단 및 항암치료 또는 방사선 치료 여부 결정에 직접적으로 활용됩니다. 또한 본 데이터는 위암 환자의 병기 분포 분석, 병기별 생존율 연구, 치료 반응 평가 등 임상 및 정책연구에 광범위하게 활용될 수 있는 중요한 기초자료입니다.
