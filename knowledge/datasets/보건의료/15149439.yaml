description_portal: '□ 개요 전문요양실 시범사업은 노인요양시설 내 의료 및 간호처치 욕구가 있는 수급자에게 의료의  연계를 통한 체계적인 간호서비스 제공으로 요양과 건강관리를 통합 제공하는 제도입니다. - (이용대상) 전문요양실 입실기준에 해당하는 수급자(1~4등급자) - (참여기관) 정원 50인 이상의 노인요양시설 - (제공서비스) 전문요양실 서비스 범위 내 간호관리* 및 교육․상담․건강증진 활동 등 상시 건강관리 서비스를 제공   * 영양관리, 배설관리, 호흡관리, 상처관리 등 본 데이터는 국민건강보험공단에서 제공하는 전문요양실 시범사업 급여비용 산정비율기본 내역입니다. □ 주요 내용- 적용시작년월: 2021.12.31까지 적용된, 인력배치기준 위반 감액 적용시작일자(전문요양실 시범사업 청구프로그램 개시일인 2021-04-01 일괄발췌) - 적용종료년월: 2021.12.31까지 적용된, 인력배치기준 위반 감액 적용종료일자(2021-12-31 일괄발췌)- 적용시작비율(단위:%): 급여비용산정비율에 따른 간호 인력의 결원시작비율- 적용종료비율(단위:%): 급여비용산정비율에 따른 간호 인력의 결원종료비율- 급여비용산정비율(단위:%): 정원초과기준에 따른 급여산정비율  ※ 보건복지부고시 제2021-324호(2021.12.27.) ‘장기요양급여 제공기준 및 급여비용 산정방법 등에 관한 고시’ 제66조(인력배치기준 위반감액) 개정으로 감액기준이 결원비율에서 결원 수로 변경됨에 따라, 적용 종료된 자료입니다.  ※ 발췌일자 기준 장기요양 전문요양실 시범사업에 참여중인 기관 기준으로 전산시스템에 등록한 자료를 기준으로 집계하였습니다.'
