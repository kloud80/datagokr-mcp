description_portal: '(시트1) 약제주성분별 요양기관종별 진료정보(시트2) 약제주성분별 주상병별 진료정보1. 진료연월: 2020~2023년 각 월2. 약제 주성분코드: 신청인이 요청한 특정 약제 주성분코드 목록으로 데이터 파일 참고  * 약제주성분 코드는 건강보험심사평가원 약제급여목록표(https://www.hira.or.kr/bbsDummy.do?pgmid=HIRAA030014050000) 참고3. 요양기관종별: 모든 요양기관4. 요양기관 소속 시도, 시군구5. 주상병코드: 해당 약제주성분코드가 청구된 전체 주상병코드6. 진료인원 및 건수: 해당 구분별 진료인원(중복제외) 및 진료(처방)건수  - 개인정보 보호를 위해 5 미만의 자료는 "*" 처리7. 수가금액: 해당 수가에 대한 금액  - 진료일 기준(한의분류 제외, 진료인원은 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 심사분까지 반영※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터'
