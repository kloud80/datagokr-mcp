summary_user: 경상북도 영주시 안의 보건지소와 보건진료소를 시설 한 곳씩 담은 목록으로, 구분·명칭·위치·전화번호·운영 시작·종료 시간·진료범위를 제공한다. 주민이 집 근처 보건진료소가 어디이고 몇 시까지 문을 여는지, 감기 같은 경증 1차 진료를 받을 수 있는지 확인하는 데 쓰고, 분석가는 취약지역 공공의료 공급 현황을 파악하는 기초 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설 이름이나 위치 주소(LC)를 기준으로 매핑해 이어 붙여야 한다.
description_portal: 경상북도 영주시 내 보건지소 및 진료소에 대한 위치, 명칭, 전화번호, 진료범위 등의 정보를 제공하는 공공API입니다. 본 API를 활용하여 가까운 보건진료소의 위치와 운영시간을 확인하여 감기 등 경증질환이나 1차 진료 서비스를 보다 효율적으로 이용할 수 있습니다.또한 공공기관에서는 취약지역의 공공의료 수요 분석, 진료소 운영 현황 파악 및 보건의료 정책 수립의 기초 자료로 활용될 수 있으며 민간 기업에서는 지역별 의료시설 검색 플랫폼, 건강관리 앱 등의 개발에 활용할 수 있습니다.REST 방식의 JSON 포맷으로 제공되어 시스템 연동에 용이합니다.
