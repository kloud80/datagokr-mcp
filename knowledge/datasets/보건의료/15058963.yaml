summary_user: 마약·향정신성의약품 등 마약류 약물 하나하나에 대해 약물번호, 한글·영문명, 분류, 이화학정보(생체 이용률·대사·반감기), 남용 시 부작용, 약물정보를 담은 약물별 정보 목록이며, 범위는 전국 단위의 비공간 데이터입니다. 교육 담당자나 연구자가 특정 약물이 어떤 마약류 분류에 속하고 남용하면 어떤 이상 반응이 생기는지 확인할 때 쓴다. 다른 데이터와 묶을 공통 조인 키가 없어서, 식약처 허가정보나 심평원 약가 목록 같은 의약품 데이터와는 약물 이름(DRFSTF·DRFSTF_ENG)을 맞추는 방식으로만 이어 쓴다.
description_portal: '식품의약품안전처에서 제공하는 마약류 약물 및 오남용 정보 데이터는 각 마약류 약물의 상세 정보를 조회할 수 있는 공공데이터입니다. 제공 항목에는 약물번호, 한글명, 영문명, 분류/구분(예: 향정신성의약품, 마약, 환각성유해화학물 등), 이화학정보(생체 내 이용률, 대사 경로, 반감기 등), 남용정보(부작용 및 이상 반응), 그리고 약물정보 등이 포함됩니다. 이를 통해 각 약물의 특성, 분류, 생물학적 동태 및 남용 시 위험 요소를 체계적으로 파악할 수 있으며, 교육 자료 활용, 법적·사회적 규제 검토, 연구 및 정책 수립 등 다양한 목적으로 활용할 수 있습니다.'
