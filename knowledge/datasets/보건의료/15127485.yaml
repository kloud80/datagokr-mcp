legal_basis_portal: 보유근거는 「의료기사 등에 관한 법률」 및 관련 규정에 따라 함안군 보건소에 개설 신고된 관내 안경업소 정보를 기반으로 하고 있습니다. 함안군 내에서 운영 중인 안경업소는 관련 법령에 따라 보건소에 신고 및 등록 절차를 거쳐야 하며, 함안군은 이를 통해 업소 현황 정보를 보유·관리하고 있습니다. 해당 자료는 지역 내 안경업소의 운영 현황을 체계적으로 관리하고 주민들에게 정확한 생활편의 정보를 제공하기 위한 목적으로 활용됩니다.
