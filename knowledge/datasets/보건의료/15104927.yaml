description_portal: 본 데이터는 경상남도 의령군 정신건강의학 및 요양병원 현황을 제공합니다. 데이터는 업체명, 주소, 전화번호, 데이터기준일로 구성되어 있습니다. 이용자는 의령군 내 정신건강의학과 및 요양병원의 명칭, 위치, 연락처, 최신 기준일을 확인할 수 있습니다. 자료는 의료시설 안내, 병원 검색, 응급 시 연락망 구축, 진료·돌봄 서비스 수요 분석 등 다양한 분야에 활용됩니다. 행정기관은 이를 토대로 의료 인프라 현황을 관리하고 보건 정책 및 지원 계획을 수립할 수 있습니다. 주소 정보는 지도 기반 경로 탐색과 주변 편의시설 안내에 유용하며, 전화번호는 예약·상담·문의 등 소통 채널로 활용됩니다. 본 데이터는 공공데이터포털에서 제공되는 의령군 의료시설 정보의 핵심 자료입니다.
