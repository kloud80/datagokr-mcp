summary_user: 2021년 기준 경상남도 18개 시군에 있는 약국을 한 곳씩 담은 일회성 파일로, 업체명·업종·소재지 주소가 들어 있으며 포털 설명상 총 1,321건이다. 경남 시군별 약국 분포를 살펴보거나 특정 지역의 약국 위치를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업체명을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: (데이터 수집목적 및 과정) 경상남도 약국 현황 데이터는 2021년 기준 경상남도에 위치한 약국에 대한 정보입니다. 경상남도 18개 시군 약국의 위치 등 현황을 조회하고 분석할 때 활용할 수 있습니다. (데이터 구성 및 세부항목) 경상남도 약국 현황 데이터는 소재지, 업체명, 위치로 구성됩니다. 총 1321건 입니다. 미집계 데이터는 공란 처리하였습니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼을 참고하여 주시기 바랍니다.
