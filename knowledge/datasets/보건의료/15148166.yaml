description_portal: 본 데이터는 한국보건의료연구원 「환자중심 의료기술 최적화 연구사업단(PACEN)」(보건복지부 보건의료기술 R&D)에서 지원하는 연구과제 목록이다. 각 과제에 대해 과제번호, 과제명이 제공된다. 심혈관·암 등 22개 주요 질환군을 포함하고 있으며, 예방·진단부터 만성기 예후 관리, 지역사회 기반 보건의료서비스·전달체계 등 보건의료 전 주기에 걸친 광범위한 중재를 다룬다. 또한, 무작위배정 임상시험(randomized controlled trial, RCT), 실용적 임상시험(pragmatic clinical trial, PCT) 등 높은 수준의 근거를 생성하는 연구 설계를 바탕으로 수행되며, 환자 중심의 공익적 임상근거 창출을 목표로 한다.
