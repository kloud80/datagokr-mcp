summary_user: 근로복지공단의 지원을 받아 설치된 직장어린이집과 공단이 운영하는 어린이집의 명칭, 소재지 주소, 우편번호, 대표 전화번호를 시설 한 곳당 한 건씩 담은 전국 목록입니다. 부모나 기업 복지 담당자가 '우리 지역에 공단 지원 직장어린이집이 어디 있고 연락처는 무엇인가'를 확인할 때 쓰고, 분석가는 지역별 직장보육시설 분포를 살펴볼 때 씁니다. 실측 컬럼에는 전역 조인 키가 없으며, 관리번호(gwanriNo)는 공단 내부 식별자입니다. 따라서 다른 보육·행정구역 데이터와 이으려면 주소를 행정구역으로 변환하거나 시설명으로 매칭해야 합니다.
description_portal: 본 API는 공단의 지원을 받아 설치된 전국 각지의 직장어린이집 및 공단 운영 어린이집의 명칭, 정확한 소재지 주소, 우편번호, 대표 연락처 등의 정보를 실시간으로 조회할 수 있는 서비스입니다. (※ 2013년 기준 심사결정서 파일 다운로드용 API 포함)시설 위치를 확인하는 수준을 넘어 민간 영역의 지도 기반 보육 시설 검색 서비스나 맞춤형 기업 복지 정보 플랫폼, 영유아 교육 및 케어 관련 애플리케이션 개발을 위한 핵심 기초 데이터로 활용될 수 있으며, 지역별 보육 수급 현황 분석이나 저출산 대응을 위한 근로복지 정책 수립 과정에서도 유용한 지표로 쓰일 수 있다고 판단됩니다.
