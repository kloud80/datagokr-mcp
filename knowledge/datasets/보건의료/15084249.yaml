summary_user: 부산광역시 종합병원의 위치를 지도에 표시하기 위한 공간정보(SHP) 파일로, 포털 설명에 따르면 기관별로 종별·의료기관명·대표자·도로명주소·위도·경도·전화번호·허가병상수·인허가일자를 담고 있으며 내려받은 압축 파일은 약 7.7KB입니다. 부산에서 종합병원이 어느 구에 몰려 있는지, 우리 동네와 가까운 종합병원은 어디이고 병상 규모는 어느 정도인지 지도로 확인하려는 시민·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 병원 인허가 LOCALDATA나 건강보험심사평가원 병원정보와는 기관명·주소를 맞춰 보는 방식으로 연결한다.
limits: 공통 기관 코드가 없어 다른 데이터와 정확히 1:1로 결합할 수 없으며, 이름이나 주소를 맞춰 볼 때 불일치가 생길 수 있다. 진료과목·장비·특수운영 같은 세부 조건 검색은 이 파일로 하지 못하고, 포털 설명은 이를 건강보험심사평가원에서 찾도록 안내한다. 병상수는 실제 가동 병상이 아니라 허가병상수다.
