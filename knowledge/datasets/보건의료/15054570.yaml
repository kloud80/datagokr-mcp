summary_user: 질병관리청이 생명윤리법에 따라 지정한 배아생성의료기관(난임 시술 등으로 배아를 생성하는 기관)을 기관 한 곳당 한 행으로 지정번호·기관명·소재지·운영 상태와 함께 담은 전국 목록 파일입니다. 난임 시술을 받으려는 사람이 우리 지역에 지정된 배아생성의료기관이 어디인지, 현재 운영 중인지 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 의료기관 인허가(LOCALDATA) 같은 병의원 목록과는 기관명·소재지 주소를 맞춰 이어 쓴다.
description_portal: 생명윤리 및 안전에 관한 법률 제22조 및 같은 법 시행규칙 제17조제에 따라 질병관리청에 지정된 배아생성의료기관에 대한 데이터로 지정번호, 기관명, 소재지 항목을  제공합니다.
