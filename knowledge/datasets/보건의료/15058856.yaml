summary_user: 장기요양기관 한 곳마다 기관코드, 협약기관명, 협약기간의 시작일과 종료일을 담는 건별 상세조회 API이며, 검증 호출에서는 전체 건수 2건(2행)이 수신됐다. 장기요양 서비스 이용자나 분석가가 '이 요양기관의 협약이 언제부터 언제까지 유효한가'를 확인할 때 쓴다. 장기요양기관코드(longTermAdminSym)를 조인 키로 삼아, 같은 코드를 쓰는 장기요양기관 검색·상세 데이터와 이어 쓴다.
limits: 응답 필드는 협약기관명과 협약기간 정도에 그쳐 운영 현황이나 서비스 내용은 이 API만으로 알 수 없다. 검증 호출에서 받은 건수는 2건뿐이어서 호출 조건에 따라 결과 범위가 달라질 수 있다. 개발계정은 하루 10,000회까지 호출할 수 있다.
