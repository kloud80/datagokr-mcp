summary_user: 경상북도 영천시 관내 약국을 한 곳당 한 행으로 담은 목록 파일로, 상호·도로명주소·전화번호·위도·경도를 개별 주소와 좌표 단위로 담는다(CSV 약 3.9KB 규모). 주민이나 앱 개발자가 '영천시에서 우리 집 근처 약국은 어디이고 전화번호는 무엇인가'를 찾거나 지도에 약국 위치를 표시할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 이름 매칭이나 위도·경도 좌표를 이용한 공간 결합으로만 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시 내 위치한 약국 정보를 제공하는 데이터입니다. 관내에 위치한 다양한 약국들의 명칭, 주소, 전화번호, 위도, 경도 정보를 포함하고 있으며, 지역 내 의료 서비스 접근성을 높이기 위해 수집되었습니다. 약국별 상세 주소와 연락처를 통해 이용자들이 필요 시 신속하게 방문하거나 문의할 수 있도록 구성되어 있습니다. 또한, 각 약국의 위치 정보를 위도와 경도 좌표로 제공하여 지도 기반 검색이나 위치 기반 서비스 활용이 가능하게 하였습니다. 해당 데이터는 공공데이터 개방 정책에 따라 누구나 자유롭게 이용 가능하며, 궁금하신 사항이 있으실 경우 영천시 보건위생과로 연락주시기 바랍니다.
