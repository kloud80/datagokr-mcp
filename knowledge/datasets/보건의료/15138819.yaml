description_portal: '본 데이터는 「의료법」 및 보건복지부 고시에 따라 관리되는 특수의료장비 공동활용 병원 현황 자료로, 고가 장비의 불필요한 중복 설치를 방지하고 지역 간 의료격차를 줄이기 위해 구축된다. 주요 항목에는 병원 명칭, 공동활용 가능한 특수의료장비 종류(예: MRI, CT, PET-CT 등), 병원 소재 도로명주소, 대표 전화번호, 활용 가능한 병상 수가 포함된다. 이 데이터는 정책적으로는 특정 지역의 특수의료장비 분포 및 공동 활용 가능 병원의 수용 능력을 평가하는 근거가 되며, 의료기관 간 장비 공동이용 협약 체결, 응급·중증 환자 이송 시 적정 병원 선택, 의료자원 배치의 효율화에 활용할 수 있다. 또한 민간에서는 응급의료정보시스템, 병원 안내 앱, 지역 의료 자원 분석 플랫폼 등에 연계하여 환자와 보호자에게 실질적인 의료접근성 정보를 제공할 수 있다.'
