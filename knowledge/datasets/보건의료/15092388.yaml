summary_user: '국가금연지원서비스 이용자가 응답한 만족도 조사 결과를 담은 파일로, 응답자별로 기관유형·지역·제공기관·출생년도·성별·등록유형과 함께 약속시간 준수, 충분한 도움, CO·혈압·체중 측정, 친절도, 이용 불편, 금연 도움 정도, 추천 의향의 7개 문항 응답을 전국 보건소와 지역금연지원센터 범위로 제공한다. 보건소 금연사업 담당자나 정책 분석가가 "어느 지역·기관유형의 금연클리닉 이용자 만족도가 낮고, 어떤 항목(예: 측정 체크, 정기 이용 불편)이 원인인가"를 따질 때 쓴다. 실측 컬럼에 보건소코드·시군구코드 같은 전역 조인 키가 없어, 다른 보건소·지역 데이터와는 지역명이나 제공기관 이름을 매핑해 이어 써야 한다.'
limits: 전역 조인 키가 없어 지역사회 건강조사 등 시군구 건강지표와 바로 결합되지 않고 이름 매핑이 필요하다. 범위는 전국이지만 좌표 등 공간 정보는 없다.
