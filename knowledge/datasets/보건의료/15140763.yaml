description_portal: '은평구의 안마시술소, 안마원 등 안마를 목적으로 운영하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 **서울특별시 은평구 소재의 의료유사업소(안마시술소, 안마원 등)**에 대한 인허가 현황 정보를 제공합니다.각 업소의 인허가 일자, 영업상태, 폐업일자, 사업장명, 소재지(지번/도로명), 전화번호 등 상세 정보가 포함되어 있습니다.은평구 내 의료유사업의 합법적 운영현황, 창업 움직임, 서비스 분포, 영업상태 모니터링 등에 활용됩니다.컬럼 예시자치구명(예: 은평구)사업장명(안마시술소명 등)인허가일자(YYYY-MM-DD)영업상태명(정상, 휴업, 폐업 등)폐업일자(해당시)지번주소/도로명주소(예: 은평구 불광동 OOO, 은평구 통일로 XX길 OO)전화번호업종명(안마시술소, 안마원 등)활용 예시위생감시 및 지도·점검 정책 수립지역 내 의료유사업소 분포 및 밀집도 파악, 창업 입지 선정공공의료서비스 정책자료 및 생활정보 서비스(지도, 플랫폼)의 기초 데이터불법·무허가 영업 방지, 감염병 예방 체계 수립데이터 수집 및 최신성은평구청 스마트정보과에서 관련 법령(안마시술소 등 관리법, 공중위생관리법 등)에 따라 허가·변경·폐업 신고를 바탕으로 상시 갱신CSV 등 개방형 표준포맷 제공, 컬럼명은 한글(영문 병기 권장)기타 유의사항업소정보는 행정등록 기준, 일부 경우 변동·폐업 후 시스템 반영까지 시차 발생 가능위치정보는 지번 및 도로명 동시 포함'
