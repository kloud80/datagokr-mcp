description_portal: '- 전라남도 필수예방접종 참여의료기관에 대하여 관할 보건소, 의료기관명, 전화번호, 주소에 대한 데이터를 제공합니다.- 필수예방접종 참여의료기관이란,정부(질병관리청 및 지자체)가 정한 **국가예방접종사업(NIP)**에 참여하여, 지정된 백신에 대해 무료로 예방접종을 시행하는 의료기관을 말합니다.- 지정 조건:예방접종 전문 인력 보유, 백신 보관·관리 기준 충족, 의료기관 신고 및 허가 완료- 접종 대상:생후 0세~12세 어린이, 65세 이상 어르신, 임산부 등- 비용 부담:전액 무료 (국가 및 지자체가 비용 지원)- 기관 종류:보건소, 보건지소, 민간 병·의원(소아청소년과, 가정의학과, 내과 등)'
