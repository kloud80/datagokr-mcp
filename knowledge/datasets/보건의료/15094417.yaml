summary_user: 서울 서초구 관내 부속의원·부속 치과의원 등 기관·회사가 소속 직원과 가족 건강관리를 위해 운영하는 부속의료기관을 사업장 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일·폐업일, 영업상태, 주소, 의료인 수, 병상 수, 총면적, 진료과목, 중부원점TM(EPSG:5174) 좌표를 포함한다. 서초구에서 어떤 회사·기관이 부속의원을 운영하고 그중 지금 영업 중인 곳이 어디인지, 개폐업 추이가 어떤지 확인하려는 분석가·사업자가 쓴다. 전역 조인 키는 없어 사업장명·주소로 매칭하거나, 같은 LOCALDATA 체계의 개방서비스 코드(OPNSFTEAMCODE)·관리번호(MGTNO)로 다른 병의원 인허가 데이터와 이어 쓴다.
description_portal: '서울특별시 서초구 관내에 위치한 부속의료기관현황 인허가정보 데이터를 제공합니다.서울특별시 서초구 관내 부속의료기관현황에 대한 데이터로 영업상태(폐업/영업중), 전화번호, 지번주소및 도로명주소, 사업장명, 의료인수, 총면적, 진료과목등의 정보를 제공합니다.서울특별시 서초구의 부속의원, 부속 치과의원 등 해당 소속 지원, 종업원 및 그 가족의 건강관리를 위한 의료기관 정보 입니다.의료기관 사업장명으로 의료기관이 실제 어떤 기관이나 어떤 회사에서 운영하는지를 알려주는 정보이다.서울특별시 서초구 부속의료기관은 구성원에게 접근성 좋은 의료서비스를 제공해 만족도와 복지를 높일 수 있고, 내부연계로 운영 효율이 생길수 있다고 봐야 될것이다.이 데이터는 CSV 형태로 제공되며 다운로드 가능합니다. 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보'
