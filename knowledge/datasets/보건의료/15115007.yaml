summary_user: 서울 송파구 약국의 인허가 정보를 사업장 한 곳당 한 행으로 담고, 인허가일·취소일·영업상태·폐업일·휴업기간·주소·전화·좌표(X, Y)·약국 영업면적(PHARMTRDAR) 같은 항목을 포함한다. 동네 약국이 언제 문을 열고 닫았는지를 확인하거나, 송파구 안의 약국 개폐업 흐름을 상권 신호로 보려는 분석가와 창업 예정자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 LOCALDATA 형식의 병의원 인허가 데이터와 함께 보면 의료 상권 변화를 볼 때 쓴다.
