summary_user: 군산시 안의 의료기기판매업소를 업소 한 곳당 한 행으로 담은 파일로, 영업소명·도로명 소재지·전화번호를 담는다(csv 약 55KB). 군산 시민이나 사업자가 '집 근처에서 의료기기를 사거나 상담받을 판매업소가 어디 있고 연락처가 무엇인가'를 확인하거나, 분석가가 시내 판매업소 분포를 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 연결된다.
