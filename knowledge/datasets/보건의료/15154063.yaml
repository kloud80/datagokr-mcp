summary_user: 질병관리청이 제공하는 감염병 발생현황을 발생연도(OCRN_YR), 감염병 군, 감염병명별 값으로 담은 전국 단위 집계 데이터이며, 지역 구분은 없습니다. 분석가나 보건 담당자가 '특정 감염병 군의 발생이 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 다른 감염병·인구 통계와는 연도와 감염병명을 이름으로 맞춰 연결한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 질병관리청에서 제공하는 기간별 감염병 발생현황 정보입니다.
