summary_user: 경기도 시군에 소재한 의료기기 수리업 인허가 사업장을 업체 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·수리대상유형·겸업여부와 도로명·지번 주소, 위경도 좌표를 포함한다. 병원 장비 담당자나 분석가가 '우리 시군 근처에서 영업 중인 의료기기 수리업체는 어디이고 어떤 장비를 수리하는가'를 확인하거나, 시군별 수리업체 분포와 폐업 추이를 파악하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 경기도의 다른 인허가 현황 또는 의료기관 위치 데이터와 맞춰 붙인다.
description_portal: 경기도 31개 시군에 소재한 의료기기 수리업체의 현황을 수록한 자료로, 의료기기의 수리 및 유지 관리를 위해 인허가를 받은 사업장에 대한 정보를 포함하고 있습니다. 주요 항목에는 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 수리대상유형(REPAIR_TARGET_TYPE_INFO), 업태구분명정보(BIZCOND_DIV_NM_INFO), 겸업여부(SIDJOB_YN), 총시설규모(TOT_FACLT_SCALE), 영업규모(BSN_SCALE), 소재지정보(도로명주소, 지번주소, 우편번호, 위경도 좌표) 및 연락처 등이 포함되어 있습니다.이 데이터는 의료기기 수리와 관련된 민간 사업체의 공간적 분포와 운영현황을 파악하는 데 유용하며, 의료기관의 장비 유지보수 수요 파악, 공공의료장비관리 정책 수립, 민간의료산업 지원 사업 등에 활용될 수 있습니다. 특히 수리대상유형과 업태구분 정보는 업체의 전문성이나 수리 가능 장비 범위를 확인하는 데 도움이 되며, 시설규모와 영업규모 항목은 물리적 역량을 파악할 수 있는 지표로 활용됩니다. 겸업여부 정보는 의료기기 수리업체의 복합 운영 여부를 확인할 수 있어 산업 다각화 분석에도 유용합니다.또한 해당 데이터는 주간 단위로 갱신되며 Open API 형식으로 제공되어 시스템 간 연계를 통해 실시간으로 최신 정보를 활용할 수 있습니다. 이를 기반으로 의료서비스 공급 안정성 제고, 민간 수리업체의 서비스 품질 관리, 의료산업 인프라 구축 등에 기여할 수 있습니다.
