summary_user: 충청남도 당진시 관내 한의원을 한 곳당 한 행으로 담은 파일로, 기관명·전화번호·도로명주소·지번주소와 데이터 기준일자를 담는다(포털 설명상 기준일자 2025년 6월 1일). 당진시 주민이 집 근처 한의원과 연락처를 찾거나, 분석가가 시 안의 한방 의료자원이 어느 동네에 몰려 있는지 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 기관명을 맞춰 붙여야 하며, LOCALDATA 의료기관 인허가 자료와도 이름·주소 매칭으로 이어 쓴다.
description_portal: '충청남도 당진시 한의원 현황 안내(데이터 기준일자: 2025년 6월 1일)충청남도 당진시는 시민의 전통의료 접근성과 건강 증진을 위하여 관내 한의원의 운영 현황을 체계적으로 관리하고 있습니다.본 자료는 당진시 지역에 위치한 한의원의 기본 정보를 정리한 것으로, 다음 항목들을 포함하고 있습니다:의료기관명전화번호도로명주소지번주소위도 / 경도본 자료는 지역 의료자원 관리, 한방진료 이용 안내, 전통의료 정책 수립,위치기반 서비스(GIS), 대시민 의료기관 정보 제공 등 다양한 행정 및 공공서비스 목적으로 활용될 수 있습니다.'
