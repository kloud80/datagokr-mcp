summary_user: 서울특별시 서초구에서 외국어 응대가 가능한 약국을 한 곳씩 담은 목록으로, 약국 명칭·도로명/지번 주소·위도·경도·전화번호·구사 가능 외국어와 데이터기준일자를 담는다(CSV 파일 약 8KB, 서초구 범위). 서초구를 찾은 관광객·주재원·유학생이나 이들을 안내하는 기관이 '근처에서 영어나 중국어로 복약 안내를 받을 수 있는 약국이 어디인가'를 찾는 데 쓴다. 전역 조인 키는 없어 다른 약국·의료기관 데이터와는 약국 명칭·주소 매칭으로 잇고, 위도·경도로 지도나 주변 시설 데이터와 위치 기준으로 겹쳐 쓴다.
description_portal: 서울특별시 서초구 외국어가능약국 현황(연번, 명칭, 주소, 전화번호, 외국어)에 대한 데이터를 제공합니다.영어를 비롯해 중국어, 일본어, 독일어 등 여러 외국어를 구사할 수 있는 직원이나 약사를 갖추고 있습니다. 이를 통해 관광객이나 주재원, 유학생 등 한국어에 익숙하지 않은 이들도 편안하게 복용하는 약에 대해서 안내를 받을 수 있습니다.서울특별시 서초구의 외국어 가능 약국은, 지역을 찾는 다양한 국적과 문화권의 사람들이 언어 장벽 없이 의료 서비스를 받을 수 있도록 돕는 소중한 역할을 하고 있습니다.서울특별시 서초구는 이러한 정보를 공공데이터 형태로 제공하여, 누구나 온라인에서 약국명, 주소, 전화번호,지원 가능 언어 등을 확인할 수 있도록 하고 있습니다. 다만, 실제로 지원 가능한 외국어 종류나 수준은 직원이나 약사 변경, 내부 사정 등에 따라 달라질 수 있으므로, 방문 전에는 반드시 전화를 걸어 해당 외국어 가능한 직원이 근무중인지 확인한 뒤 찾아가시는 것이 좋습니다.
