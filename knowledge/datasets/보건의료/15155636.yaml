description_portal: '중동호흡기증후군(메르스)는 우리나라에서 1급 감염병으로 지정하여 질병관리청에서 관리중인 감염병입니다. 1급 감염병은 "감염병의 예방 및 관리에 관한 법률" 제3장 신고 및 보고, 제11조에 따라 신고되는 감염병입니다. 우리나라에서는 2015년 5월 첫 확진자가 발생하였으며 7월 까지 발생하였다. 이 자료는 병원의원 감염병 신고서를 기반으로 생성된 자료입니다. - 기간 : 2015년 5월부터 7월까지  - 확진자 수 : 185명(중국 발생 확진환자 1명 제외)  - 기본 정보 : 환진자의 성별, 연령, 지역, 신고주차 * 신고주차는 병의원 신고일을 기준으로 산출한 자료를 주차로 변경하여 산출하였습니다.'
