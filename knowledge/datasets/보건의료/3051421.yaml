summary_user: 전국 시군구별로 자격·성별·연령구분에 따라 장기요양 신청자 수와 1~5등급·인지지원등급·등급외(A~C) 판정 인원을 집계한 파일 데이터로, 제도 초기부터의 신청일자 기준 누적 인정자 수를 담는다. 지자체 복지 담당자나 요양기관 창업을 검토하는 사업자가 '우리 시군구에 등급 인정을 받은 고령자가 성별·연령대별로 얼마나 되는가'를 파악해 돌봄 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시도·시군구 이름을 행정구역 코드로 매핑해 장기요양기관 현황이나 인구 통계와 이어 쓴다.
description_portal: '노인장기요양보험 시군구별 등급판정 현황에 대한 데이터로 성별, 연령별, 자격별 장기요양 등급판정 현황을 제공합니다.(시도, 시군구, 자격별, 성별, 연령구분, 신청자, 1등급 , 2등급 , 3등급 , 4등급 , 5등급 , 인지지원등급 , 등급외 )발췌기준 - 기준: 제도초기부터 현재까지 장기요양신청일자 기준, 인정자 수(누적) - 발췌구분: 실거주지 관할 시도-시군구별 등급판정결과 - 등급판정자: 인정자(1~5등급, 인지지원등급), 등급외자(등급외 A~C) - 인정자: 사망자 제외. 중복건수 제외 - 연령구분: 신청당시의 연령기준 ※ 기초수급, 의료급여자는 소속 시군구를 관할하는 운영센터에서 관리하고 있으니 참고하시기 바랍니다. ※ 인정자가 감소한 지역은 인정자가 다른 지역으로 주소 변경하였거나 사망자가 발생하였기 때문입니다. ※ 개인정보보호를 위해 "5" 미만 값은 비식별화하여 제공합니다.'
