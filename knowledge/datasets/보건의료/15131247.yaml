description_portal: '진료일자 기준(심사분은 각 진료년+3개월) (예) 진료년월: 2023.1월~12월, 심사년월: 2023.1월~2024.3월 / 보험자: 건강보험 / 의(치)과 외래환자 명세서 ※ 외래환자분류체계란, 외래환자를 상병, 시술, 약제, 수진자 연령 등을 이용하여 의료자원소모 및 임상적 측면에서 유사한 그룹으로 분류하는 체계입니다. ※ 질병군 코드는 외래환자분류체계 버전 2.5 기준으로 그룹구분, 시술의 난이도, 연령구분 등을 반영한 6자리의 기호입니다.  ※ 진료비는 외래 진료의 특성을 반영하여 원외 처방 약품비를 포함하고 요양기관 종별 가산율을 15%로 일괄 적용한 금액으로 실제 요양급여비용총액과 상이할 수 있습니다. ※ 신뢰도제고를 위해 진료비 중 오류그룹 청구건 및 이상치를 제외한 자료입니다.    * 이상치란, 질병군별 전체 진료비의 제1사분위수(Q1)와 제3사분위수(Q3)를 통해 사분위수 범위(IQR=Q3-Q1)을 구한 후 Q1-3.0*IQR 미만, Q3+3.0*IQR 초과 범위에 해당하는 극단값을 의미함'
