description_portal: '□ 데이터 개요본 데이터는 국민건강보험공단이 관리하는 장기요양보험 관련 주요 지표를 수록한 통계 자료입니다. 장기요양보험의 전반적인 운영 현황을 파악할 수 있도록 적용인구, 보험료, 신청 및 인정자 수, 장기요양기관 및 인력, 급여 실적 등의 주요 지표를 포함하고 있습니다.□ 주요 항목 1. 적용인구: 장기요양보험 적용 대상 인구수 2. 보험료: 납부된 장기요양보험료 총액 3. 신청/인정자: 장기요양 신청자 수, 인정자 수 4. 기관/인력: 장기요양기관 수, 종사자 수 5. 급여실적: 방문요양, 방문간호, 시설급여 등 서비스별 급여 실적□ 활용 목적장기요양보험의 수급자 규모, 제공 기관 현황, 급여 이용 실적 등을 종합적으로 분석하여 정책 수립 및 제도 개선 등에 활용할 수 있습니다.'
