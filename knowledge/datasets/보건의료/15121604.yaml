description_portal: 본 데이터는 경기도 광주시의 명절 연휴 기간 운영하는 의료기관 현황 정보를 제공합니다. 설날, 추석 등 명절 연휴 기간에 진료를 실시하는 병원과 약국의 운영 정보를 담고 있어 응급 상황에 대비할 수 있습니다. 지역(동)은 의료기관이 위치한 행정구역을 나타내며, 병원 분류는 병원, 의원, 약국 등 의료기관의 유형을 표시합니다. 의료기관명과 전화번호는 병원 명칭과 연락처를 제공하고, 도로명주소는 정확한 위치를 안내합니다. 일차별 운영시간은 명절 연휴 기간 동안 날짜별 진료 시간을 상세히 제공합니다.
