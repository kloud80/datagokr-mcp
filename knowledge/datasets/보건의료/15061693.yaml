description_portal: 전라남도 함평군은 방사선 안전관리 및 의료장비 현황의 체계적 관리를 위해 관내 진단용 방사선발생장치 현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군 내 의료기관에서 사용 중인 진단용 방사선 장비에 대한 현황을 담고 있으며, 의료기관명, 장비 용도(X-ray, CT 등), 장치 명칭 등의 항목으로 구성되어 있습니다. 해당 데이터는 지역 내 방사선 장비 분포 파악, 의료시설 장비 보유 현황 분석, 방사선 관련 안전관리 체계 구축 등에 활용될 수 있으며, 보건소·의료기관의 장비 관리, 방사선 조사 대상시설 점검, 응급진료체계 연계 등 다양한 분야에서 실질적인 행정 및 보건의료 자료로 활용될 수 있는 공공정보입니다.
