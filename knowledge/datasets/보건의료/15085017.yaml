description_portal: '○ 통계개요* 통계명 : 헌혈현황(연령별)* 통계종류 : 서울시 헌혈실적현황을 제공하는 일반, 보고통계* 근거법령 :「혈액관리법」에 따라 혈액사업을 위임받은 대한적십자사의 헌혈사업 실적* 작성목적 : 헌혈사업의 대상이 되는 개인 또는 집단에 따른 헌혈실적을 파악하여,헌혈 참여를 증진시키고 관련정책 수립의 기초자료로 활용하는 것을목적으로 함* 조사체계 : 해당기관 → 시도 → 대한적십자사 혈액관리원* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 연령별, 성별 헌혈실적건수○ 용어설명* 헌혈자 : 자신의 혈액을 혈액원에 무상으로 제공하는 자○ 기 타* 헌혈건수 실적은 동일인이 여러 차례 헌혈을 실시해도 매회 실적으로 인정* 연령은 헌혈일 당시 만나이 기준임* 서울혈액원(중앙, 동부, 남부) 채혈실적 기준** 서부혈액원이 중앙혈액원으로 명칭 변경(2018.04.)** 2017년이전 혈액원(서부, 동부, 남부) 채혈실적 기준** 2009년이전 혈액원(중앙,서부,동부,남부) 채혈실적 기준* 2005년부터 성별 추가* 헌혈이 가능한 나이 만16세~69세(2009.01.30. 변경)'
