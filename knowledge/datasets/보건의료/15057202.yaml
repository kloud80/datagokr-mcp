summary_user: 경기도 의료기관에 설치·신고된 진단용 방사선 발생장치를 장비 한 대당 한 행으로 담는 건별 원천 자료로, 장치명·모델·용도·제조사·제조국, 설치기관명, 인허가·폐업·사용중지 일자, 주소와 좌표를 포함한다. 보건 분석가나 의료기기 사업자가 '경기도 어느 시군에 CT·X선 같은 진단 방사선 장비가 몇 대 운영 중이고 어느 제조사 제품이 많은가'를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군 코드(SIGUN_CD)·시군명, 기관명, 주소나 좌표를 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 의료기관에 설치된 진단용 방사선 발생 장치의 인허가 및 운영 현황을 나타내며, 질병 진단 목적으로 사용되는 방사선 기반 의료기기의 실제 사용 상태와 분포를 확인할 수 있습니다. 의료기관 단위로 인허가를 받은 각 장비에 대해 장치명칭, 장치모델, 용도, 제조사 및 제조국가, 주소 및 위치 좌표 등의 정보를 포함하고 있어, 의료영상 진단 장비의 보급 현황 분석, 지역 의료자원 분포 파악, 방사선 노출 관리 체계 수립 등 다양한 목적으로 활용될 수 있습니다. 특히 하나의 기관에 여러 장비가 등록될 수 있기 때문에, 장비 단위의 정보 분석을 통해 세부적인 의료 인프라 현황을 파악하는 데 효과적입니다.
