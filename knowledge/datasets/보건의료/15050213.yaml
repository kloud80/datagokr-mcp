summary_user: 통계청 사망원인통계를 바탕으로 알코올 관련 질환 사망률을 인구 10만 명당 비율로 환산해 연도별·연령대별(20대~80세 이상, 전체 포함)로 정리한 전국 단위 집계 지표로, 포털 설명상 2005~2023년을 담는다. 보건 연구자나 절주 정책 담당자가 "알코올 관련 질환 사망률이 어느 연령대에서 가장 높고, 지난 20년 가까이 어떻게 변했는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(연도) 기준으로만 나란히 붙여 볼 수 있으며, 같은 기관의 다른 절주 지표나 연령별 음주율 통계와 연도·연령대 이름을 맞춰 연결한다.
description_portal: '- 통계청 사망원인통계를 활용하여 알코올 관련 질환으로 인한 사망자 수를 인구 10만 명당 비율로 환산하고, 이를 연령대별로 구분해 산출한 지표입니다. - 연령별로 분포된 사망률을 수치로 확인할 수 있으며, 특정 세대에서 발생하는 차이를 비교할 수 있도록 구성되어 있습니다.- 데이터는 2005년부터 2023년까지의 사망율을 확인할 수 있으며, 20대~80대 연령까지 데이터를 확인할 수 있습니다. - 본 데이터는 음주로 인한 건강 및 사망 영향에 대한 연구 등에 활용 될 것으로 기대하고 있습니다.'
