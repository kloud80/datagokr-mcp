summary_user: 전국 노인장기요양기관을 기관 1곳당 1행으로 담은 파일로, 기관코드·기관명·주소·지정일자·설치신고일자 같은 일반현황을 담고 포털 설명상 입소인원(정원·현원)과 인력현황도 함께 제공한다. 고령 가족의 요양시설을 찾는 국민이나 지역별 장기요양기관 공급을 분석하는 분석가가 '우리 시군구에 지정된 장기요양기관은 몇 곳이고 언제 지정됐나' 같은 질문에 쓴다. 법정동코드(bjd_cd)로 행정구역 코드표·인구·고령인구 통계와 이어 쓰고, 장기요양기관코드로 같은 공단의 장기요양기관 검색·상세 데이터와 맞춰 본다.
description_portal: '(2025.4월 이전자료) 데이터는 전국의 노인장기요양기관으로부터 입력된 정보를 기반으로, 기관별 일반 정보, 입소 인원, 인력 구성 현황을 종합하여 제공하는 자료입니다. (2026.6월 자료) 전국 지차체(행복e음)로부터 연계받은 지정자료 기준의 데이터입니다.1. 노인장기요양기관 시설별 일반현황 - 기관코드, 기관명, 지정 및 설치신고일자 등2. 노인장기요양기관 시설별 입소인원 - 기관유형코드, 정원, 현원(2025.4월 이전자료)3. 노인장기요양기관 시설별 인력현황 - 기관코드, 기관유형코드, 각 인력별 현황* B06코드: 재가노인복지시설 복지용구※ 본 데이터(2025.4월 이전자료)는 각 기관이 직접 입력한 정보를 연계하여 제공하며, 일부 항목은 미입력 등으로 인해 빈 셀이 존재할 수 있습니다.※ 민원인의 데이터 업데이트 요청에 따라 2026년 6월 10일 기준으로 업데이트※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
