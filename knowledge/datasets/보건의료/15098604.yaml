description_portal: 본 데이터는 전라남도 화순군에서 집계한 코로나19(COVID-19) 확진자수 및 사망자수 정보를 제공한다. 기간별로 누적 확진자 및 사망자 현황을 비롯하여 발생 시점, 행정구역별 통계 등 감염병 모니터링에 필요한 세부 자료를 포함하고 있다. 해당 자료에는 코로나19 발생 시기부터의 누적 통계가 반영되어 있으며, 행정기관의 방역 정책 수립이나 지역사회 감염병 대응 체계 구축에 기초 자료로 활용될 수 있다. 각 확진자 및 사망자 데이터는 공공의 건강 및 안전 확보를 위해 정확하게 관리되며, 일 단위 또는 주 단위로 최신화된다. 또한, 중앙 방역당국의 점검 기준 및 전라남도 전체 코로나19 관리지침에 근거하여 정보 신뢰성을 확보하였다. 감염병 확산 추이 분석, 방역 효과 평가, 의료 자원 배분 등 정책적 활용과 더불어 연구 및 언론 보도 시에도 기초자료로서 활용이 가능하다. 본 데이터는 향후 신종 감염병 유행 시 과학적 근거자료로서의 가치 또한 높다.
