description_portal: '이 데이터는 요양기관(병·의원 등)이 아닌 장소에서 출산한 국민건강보험 가입자에게 지급된 출산비의 지급 건수 및 금액 등에 대한 현황을 담고 있습니다. 출산비는 병원 등 의료기관이 아닌 장소에서 출산이 이루어진 경우, 국민건강보험공단이 관련 법령에 따라 산모에게 지급하는 요양비의 일종입니다.국민건강보험법 제49조(요양비): 공단은 가입자나 피부양자가 보건복지부령으로 정하는 긴급하거나 그 밖의 부득이한 사유로 요양기관과 비슷한 기능을 하는 기관으로서 보건복지부령으로 정하는 기관(준요양기관)에서 질병ㆍ부상ㆍ출산 등에 대하여 요양을 받거나 요양기관이 아닌 장소에서 출산한 경우에는 그 요양급여에 상당하는 금액을 보건복지부령으로 정하는 바에 따라 가입자나 피부양자에게 요양비로 지급한다.'
