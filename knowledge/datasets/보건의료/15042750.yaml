summary_user: 국립나주병원 한 곳이 받는 비급여 진료비와 약품 가격을 항목별로 담은 파일(csv, 약 10KB)이다. 항목은 보철·교정료, 수술료, 검사료, 입원료, 재료대, 정신요법료, 제증명료, 주사료, 투약료, 항정신병 장기지속형 주사제로 나뉘고, 각 항목에 코드·명칭·기본수량·단위·비용(원)·적용일자가 붙어 있다. 환자나 보호자가 이 병원의 진단서 발급 비용이나 장기지속형 주사제 비급여 가격을 미리 확인할 때 쓰고, 분석가는 다른 공공병원의 비급여 가격과 견줄 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 병원 고유 수가코드(수가코드)나 명칭을 손으로 맞춰야 하고, 식약처 품목기준코드나 의약품 표준코드로 심평원 약가 목록에 바로 붙일 수 없다.
description_portal: 제공된 데이터는 국립나주병원에서 제공하는 비급여 의료 서비스 및 약품에 대한 비용 정보를 담고 있습니다. 이 데이터는 크게 보철 및 교정료, 수술료, 일반 검사료, 입원료, 재료대, 정신요법료, 제증명료, 주사료, 투약료, 그리고 항정신병 장기지속형 주사제의 열 가지 주요 분류로 구성되어 있습니다. 각 항목은 고유한 코드와 명칭, 기본 수량, 단위, 비용(원), 그리고 적용 일자를 포함하여, 특정 의료 행위나 약품의 가격 기준을 명확히 제시하고 있습니다. 전반적으로 이 데이터는 환자에게 청구될 수 있는 다양한 항목들의 표준 비용을 상세하게 보여줍니다.
