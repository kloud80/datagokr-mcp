description_portal: 코로나바이러스감염증-19(COVID-19)의 월별 확진자 및 사망자 현황을 정리한 자료로, 월 단위 확진자 수와 사망자 수 등 감염병 발생 추이를 파악하는 데 필요한 주요 정보를 포함하고 있다. 본 자료는 감염병 확산 양상과 시기별 변화 추이를 종합적으로 파악하기 위한 기초 통계 자료로 활용된다.또한 월별 코로나19 확진자 및 사망자 현황에 대한 체계적인 관리를 통해 감염병 유행 추세와 방역 정책의 효과를 분석하고, 보건의료 대응 체계 수립 및 감염병 관리 정책 결정을 위한 행정적 의사결정을 지원한다. 본 자료는 감염병 대응 현황 관리, 방역 정책 검토, 주민 안내 및 관련 민원 대응 업무 수행과 함께 보건 통계 산출 및 보건 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 감염병 발생에 대한 객관적인 통계 제공을 통해 공중보건 위기 대응 역량을 강화하고, 향후 감염병 예방 및 대응 체계 구축을 위한 정책 수립의 기초자료로 활용되며, 지속적인 보건의료 및 보건 행정 업무 수행을 지원하는 행정 통계 자료로 활용된다.
