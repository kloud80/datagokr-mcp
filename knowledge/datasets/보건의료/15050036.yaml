description_portal: 서울시에서는 정신질환자가 지역사회 안에서 일상생활을 하며 직업을 유지하고 적응할 수 있도록 각종 재활 및 사례관리 서비스를 제공하는 시설을 운영하고 있습니다.서울시 소재의 자치구별, 시설유형별(정신건강복지센터, 자살예방센터, 중독관리통합지원센터, 재활훈련시설, 중독자재활시설, 종합시설) 기관 수 정보를 제공하고 있습니다. 2017년 정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률이 개정됨에 따라 2009년~2016년과 2017년 시설 유형분류에 차이가 있으니 데이터 활용 시 유의 바랍니다.
