summary_user: 전국 병의원을 기관 단위로 정리한 목록으로, 기관명·주소·병원 종별·요일별(공휴일 포함) 진료 시작·종료 시간·응급실 운영 여부·대표/응급실 전화·우편번호·좌표 필드를 담는다. 국민이나 분석가가 "일요일·공휴일에 진료하거나 응급실을 운영하는 가까운 병원은 어디인가" 같은 질문에 답하거나, 병의원 분포를 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 LOCALDATA 의료기관 인허가 등 다른 데이터와는 기관명·주소 매칭이나 좌표로 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 종합병원 등 병,의원 관련 정보입니다.\""
