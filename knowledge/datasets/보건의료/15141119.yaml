summary_user: 서울특별시 은평구에서 식용얼음판매업 인허가를 받은 업소를 한 곳씩 담은 건별 원천 데이터로, 사업장명·도로명/지번 주소·인허가 일자·영업상태·폐업일자와 중부원점TM(EPSG:2097) 좌표를 포함한다. 은평구에서 지금 영업 중인 얼음 판매업체가 어디에 있고 언제 신고·폐업했는지 확인하려는 주민·사업자, 식품위생 관리 담당자, 상권 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 이어야 하며, 좌표를 위경도로 변환하면 지도·다른 업종 인허가 데이터와 위치 기준으로 겹쳐 볼 수 있다.
description_portal: '은평구의 식용얼음을 전문적으로 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내 식용얼음판매업 인허가를 받은 업소의 운영 정보를 담고 있습니다.식용얼음판매업이란 「식품위생법」에 따라 식용얼음을 전문적으로 판매하는 영업으로, 보건소에 신고 의무가 있는 업종입니다. 일반 음식점이나 카페에서 부수적으로 얼음을 사용하는 것과 달리, 얼음 자체를 상품으로 제조·판매하는 전문업체가 해당됩니다.각 업소의 사업장명, 도로명 주소, 인허가 일자, 영업상태 등이 상세히 기록되어 있으며, TM 좌표계(EPSG:2097) 위치 정보까지 포함되어 있어 정확한 위치 파악이 가능합니다. 실제로 은평구에는 연흥얼음(연서로 41-1, 1층) 등의 업체가 운영되고 있습니다.영업신고 절차는 비교적 간단합니다. 위생교육 수료증, 건강진단결과서(보건증), 신분증 등을 구비하여 보건소에 신고하면 되며, 수수료 2만 8천원, 면허세 2만 7천원~6만 7천5백원이 소요됩니다. 처리시간은 즉시(3시간 이내)로 신속하게 처리됩니다.위생관리 기준이 엄격합니다. 신고를 하지 않고 영업할 경우 식품위생법에 따라 3년 이하의 징역 또는 3천만원 이하의 벌금이 부과되며, 정기적인 위생점검과 수질검사를 받아야 합니다.자동 갱신 시스템으로 운영되어 3일 전 자료를 실시간으로 제공하므로, 신규 업체 등록, 폐업, 영업상태 변경 등의 최신 정보를 신속하게 확인할 수 있습니다. 이는 식품안전 관리와 위생업소 관리감독에 중요한 기초 자료로 활용되고 있습니다.'
