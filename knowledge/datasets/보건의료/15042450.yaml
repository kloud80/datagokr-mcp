description_portal: 년도별 보건의날 행사 정보본데이터는 국민건강증진법에 의거하여 매년 개최되는 보건의날 행사에 대한 정보블 제공합니다. 보건의 날은 국제보건기구(WHO)의 주제 하에 대한민국 주제를 선정하여 매년 행사 및 캠페인을 추진하고 있습니다. 데이터는 행사년도, 대한미국 주제, WHO 주제, 주제 선정배경, 행사 일시 및 장소, 홍보대사 및 슬로건 내용으로 구성되어 있습니다. 2006년부터 제공되는 연도별 행사관련 정보를 통하여 국제적, 국내적 건강증진 관련 이슈 및 트렌드를 확인할 수 있습니다.
