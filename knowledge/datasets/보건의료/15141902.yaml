description_portal: '<시트1> 특정 상병코드 그룹별 진료정보<시트2> 특정 상병코드 및 약제주성분코드 그룹별 진료정보1. 진료년도: 2015~2023 (연도별, 월별)2. 보험자 : 건강보험, 의료급여 모두 포함(입원, 외래 모두 포함)3. 연령: 연말기준4. 주상병코드: 그룹1(F32 or F33), 그룹2(F51 or G47)가 주상병 또는 부상병으로 청구된 요양급여명세서 기준5. 약제주성분코드: (1) Benzodiazepine, (2) Z-class, (3) 항우울제, (4) 항정신병약, (5) 항히스타민 … 코드명 엑셀 참고6. 진료인원 및 건수: 해당 구분별 진료인원(중복제외) 및 건수7. 진료비 : 공단부담금(기관부담금)과 본인부담금을 더한 금액. 요양급여(의료급여비용)총액8. 수가금액: 해당 수가(약가)에 대한 비용  - 진료일 기준(한의분류 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 심사분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음  - 개인정보 보호를 위해 5 미만의 자료는 "*" 처리  - 의료급여는 천단위 절삭2024년 자료는 2025년 7월부터 제공 가능※ 약제주성분 코드는 건강보험심사평가원 약제급여목록표(https://www.hira.or.kr/bbsDummy.do?pgmid=HIRAA030014050000) 참고※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
