summary_user: 식약처에 통지된 의약품을 품목별 목록으로 담으며, 주성분(MCPN_CONT)·함량·제형·허가신청일자를 전국 단위로 제공한다. 제약사·연구자가 "특정 주성분으로 허가 절차가 진행 중인 의약품이 어떤 제형·함량으로 언제 신청됐나"를 확인해 시장 진입 후보 제품을 파악하는 데 쓴다. 실측 컬럼에 품목기준코드 같은 전역 조인 키가 없어, 식약처 허가정보 등 다른 의약품 데이터와는 주성분명·제형명 같은 이름 매칭으로만 연결한다.
limits: 품목기준코드·표준코드가 없어 심평원 약가·급여 목록이나 DUR 정보와 코드로 바로 잇지 못하며, 이름 매핑에 의존해야 한다. 지역 구분이 없는 전국·비공간 데이터다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
