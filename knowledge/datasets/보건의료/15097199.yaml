description_portal: 식품의약품안전처 「통지의약품 정보」 OpenAPI는 통지된 의약품의 기본 정보를 목록 형태로 제공하는 공공데이터입니다. 주요 제공 항목에는 주성분, 함량, 제형, 허가신청일자 등이 포함되어 이 데이터를 통해 사용자는 특정 의약품의 주성분과 제형, 허가신청일자를 확인할 수 있고, 허가 절차가 진행 중인 의약품 현황을 파악하는 데 도움이 됩니다.제약사와 연구자는 이 데이터 정보를 기반으로 향후 시장에 진입할 수 있는 후보 제품을 파악하거나 허가 진행 현황을 검토하는 참고자료로 활용할 수 있습니다.
