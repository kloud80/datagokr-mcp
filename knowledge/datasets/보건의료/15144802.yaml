description_portal: 1. 안내사항본 공공데이터는 국민의 알권리 충족 및 국민 편익 증진을 위해 제공되는 데이터입니다.해당 데이터는 자유롭게 열람 및 공유가 가능하며, 데이터 이용에 어떠한 제한사항이나 제약사항이 없습니다.2.데이터설명본 데이터는 충청북도 증평군 관내 의료기관 중 특수의료장비 공동활용 가능한 의료기관 및 병상 데이터를 정리한 자료이다.의료기관명, 의료기관주소(도로명), CT 및 MRI 가능여부 및 병상수 등을 제공하며 의료 인프라의 협력 체계 구축 및 정책 수립에 기초자료로 활용된다. 또한, 의료기관 상호 간 협력 강화와 장비 운용 최적화를 통해 지역 주민의 접근성과 진료 만족도를 증진시키는 데 기여한다.
