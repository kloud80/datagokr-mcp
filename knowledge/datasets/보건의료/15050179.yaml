description_portal: 국민건강증진종합계획(HP2020) 관련 사업체계 지표입니다. 본 데이터에서는 HP2020 사업체계와 관련하여, 건강생활지원센터 설치 현황, 보건소 인력 교육이수율, 건강증진기금 중 민간보조사업 예산비율 증가 등의 정보를 제공합니다. 2015년부터 2020년까지 각 연도별로 지표별 목표치, 예측치, 현재값 등의 자료로 구성되어있으며, 지표별로 지표정의, 지표설정근거, 자료출처 정보도 제공하고 있습니다. 본 데이터는 건강증진 및 보건의료 관련 연구 시 기초자료로 활용될 수 있으며, 일반 국민들에게는 건강증진종합계획 사업체계의 현황을 보여주는 자료입니다.
