summary_user: 구로구 내 약국을 한 곳씩 담은 건별 인허가 원천 자료로, 인허가일·취소일, 영업상태(TRDSTATENM)·상세상태, 폐업일, 지번·도로명 주소, 사업장명, 중부원점TM 좌표(X·Y)를 담는다. 주민이나 분석가가 '우리 동네에 영업 중인 약국은 어디이고, 최근 개업·폐업 흐름은 어떤가'를 확인하거나 약국 공백·과밀 지역을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)·관리번호로만 연결한다. LOCALDATA 형식의 병의원 인허가 자료와 연결하는 것도 같은 방식이다.
description_portal: 약국 인허가 정보는 구로구 내에서 의약품 판매·조제를 수행하는 약국의 인허가 기록, 영업상태, 소재지주소, 업종분류 등을 포함한 보건행정 자료이다. 약국은 지역 주민의 일상적인 의약품 접근성과 건강관리의 최전선에 있는 기관이므로, 약국의 위치·운영상태는 지역 보건의료 체계의 안정성과 직결된다. 본 자료는 약국의 개설·폐업 흐름을 파악할 수 있으며, 특정 지역의 의료공백·과밀 여부를 평가하는 데 활용된다. 또한 자료는 중부원점TM(EPSG:2097) 좌표계 기반의 위치정보를 제공하며 위경도는 포함되지 않기 때문에, GIS 분석 시 변환 과정이 필요하다. 3일 전 자료 제공 방식으로 최신 약국 현황을 신속하게 반영하며, 지역 의약품 접근성 평가, 감염병 대응 의약품 공급망 점검, 취약계층 보건정책 설계 등 다양한 정책적 활용이 가능하다.
