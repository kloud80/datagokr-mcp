description_portal: '□ 개방 데이터 설명○ 이 데이터는 건강보험료 경감 제도의 세부적인 기준을 한눈에 확인할 수 있도록 정리한 표로, 경감코드별·소득구간별·재산과표별로 적용되는 경감율을 퍼센트(%)로 제공하고 있습니다.   - 경감코드(섬 경감, 벽지 경감, 한부모 경감 등)   - 경감율(10%, 20%, 30% 등)       - 첨부서류: 신청시 필요한 제출서류○ 또한, 경감 제도는 적용 시작년월과 종료년월을 기준으로 소득 및 재산과표 구간별로 세분화되어 있으며, 해당 기간 동안 적용 가능한 경감율을 명확하게 조회○ 사용자는 이 데이터를 활용해 경감 자격 요건과 제출서류를 사전에 확인할 수 있으며, 공단 홈페이지에 게시된 정보와 유사한 수준으로 상세하게 안내되어 있어 실제 신청 과정에서 참고자료로 활용하기 적합※  데이터값이 공란인 부분은 미집계 데이터입니다.'
