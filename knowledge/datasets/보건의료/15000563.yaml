description_portal: 전국 응급의료기관 정보를 조회하기 위한 서비스로서 진료일, 진료과목, 응급의료기관분류, 대표전화, 응급실 전화, 병원 경도, 병원 위도 ,실시간 응급실 가용병상정보(응급실, 수술실, 뇌경색의 재관류, 복부손상의수술, 응급내시경, 병상 수 ,흉부 중환자실, 입원실, 일반 중환자실, 팩스번호, 진료 시작시간, 진료종로시간 등) 및 중증질환 수용가능정보, 경/위도를 기준으로 응급의료기관의 위치 정보 등을 조회할 수 있다. 또한 주소 및 시술명을 기준으로 중증질환자 수용정보를 조회하는 기능도 제공하고 있다.
