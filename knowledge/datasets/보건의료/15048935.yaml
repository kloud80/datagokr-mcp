description_portal: '- 전라남도 내 시군에 위치한 정신요양시설(기관명, 연락처, 우편번호, 주소 등)에 관한 데이터를 조회하실 수 있습니다.- "정신요양시설"은 정신질환자들이 일정 기간 동안 보호와 치료, 재활을 받을 수 있도록 설립된 생활형 시설입니다. 정신병원과 달리 치료 중심이 아닌 생활 및 재활 중심의 공간입니다.- 정의: 정신질환으로 장기 치료가 필요하거나 자립 생활이 어려운 사람들에게 주거, 보호, 재활 및 사회 복귀 지원을 제공하는 사회복지시설.- 근거 법령: 「정신건강복지법」 제29조 ~ 제31조, 제52조- 생활 지원: 일상생활 보조 (식사, 위생, 수면 등)- 의료 연계: 외래 정신과 진료, 약물 복약 관리 등- 재활 프로그램: 작업치료, 사회기술훈련, 직업훈련 등- 정서적 안정: 상담, 여가활동, 가족 연계 프로그램- 사회복귀 지원: 지역사회 복귀 준비 및 자립 지원'
