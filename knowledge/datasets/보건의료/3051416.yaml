summary_user: 노인장기요양보험 복지용구를 품목(대분류·세부 품목)과 월별로 나눠, 실제 이용한 수급자 수를 수급자 구분(일반·기초·감경·의료)과 장기요양등급(1~5등급·인지지원)별로 집계한 전국 단위 통계 파일입니다. 복지용구 사업자나 정책 분석가가 '어떤 품목을 어느 등급·감경 구분의 수급자가 많이 쓰는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·연월을 이름으로 맞추거나 같은 공단의 장기요양 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: '□ 데이터 개요본 데이터는 국민건강보험공단이 제공하는 노인장기요양보험제도 하에서의 복지용구 품목별 이용현황을 정리한 통계자료입니다.복지용구는 일상생활 수행에 제한이 있는 노인 또는 장기요양 수급자의 생활 편의 증진과 신체 기능 보완을 위한 보장구로, 본 자료는 수급자가 해당 복지용구를 실제로 이용한 내역을 집계한 것입니다.□ 주요 내용집계기간: 2026년 1월 1일 ~ 3월 31일집계단위: 월별분류기준 - 구분1:  품목명 또는 대분류 - 구분2:  세부 품목명수급자 구분 - 계(총계): 전체 이용자 수 - 일반: 일반수급자 - 기초: 기초생활수급자 - 경감: 감경대상자 - 의료: 의료급여 대상자 등※ 건강보험 공공데이터 제공·관리 지침 [별표]4 대국민 데이터 제공 기준에 따라 개인정보를 위해 "5" 미만 값 및 "계"값으로 유추가 가능한 경우 "계"값을 포함하여 비식별화하여 제공됩니다.'
