summary_user: 서울 구로구에 신고된 소독업 사업장을 한 곳당 한 행으로 담은 건별 인허가 원천 데이터로, 인허가·취소·폐업·휴업 일자와 영업상태, 사업장명, 지번·도로명 주소, 좌표, 사무실 면적, 분무기·방독면 같은 소독 장비 보유 수 항목을 시군구 범위로 기록한다. 주민이나 사업자가 '구로구에서 지금 영업 중인 방역·소독업체는 어디이고 언제 개업하거나 폐업했나'를 확인하거나, 분석가가 지역 소독업체의 개폐업 추이와 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 자치단체 코드(OPNSFTEAMCODE)로만 이어 쓰며, 좌표(X, Y)는 지도·공간 분석에 겹쳐 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 소독업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 소독업 시설의 면적, 건축물 연면적, 업태구분 등 주요 속성이 기록된다. 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 운영 현황을 파악하는 데 활용된다. 데이터는 정기적으로 갱신되어 정책 수립, 연구 분석, 민원 처리, 위생 관리 등에 활용된다. 좌표정보는 지도 서비스와 공간 분석에 연계 가능하여 행정 투명성과 정보 접근성을 높이는 기반 자료로 기능한다.
