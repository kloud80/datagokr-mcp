summary_user: 서울 종로구에 있는 부속의원·부속병원·의무대 같은 부속의료기관의 인허가 정보를 사업장 한 곳당 한 행으로 담는다. 사업장명, 진료과목, 영업상태, 인허가일·취소일·폐업일이 들어 있다. 분석가는 '종로구에서 최근 폐업하거나 휴업한 부속의료기관은 어디인가'를 확인하는 데 쓰고, 병의원 개폐업을 상권 신호로 읽는 데도 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소를 맞추거나 같은 기관 코드(개방자치단체코드·관리번호)로만 잇는다.
description_portal: '본 데이터는 서울특별시 종로구에 소재한 부속의료기관에 대한 인허가 현황을 정리한 자료입니다. 종로구의 부속의원, 부속병원, 군부대시설, 의무대 등 해당 소속 지원, 종업원 및 그 가족의 건강관리를 위한 의료기관 정보가 담겨져 있습니다. 본 자료에는 사업장명, 진료과목명, 영업상태, 인허가일자, 인허가취소일자 등의 항목이 포함되어 있으며, 종로구 내 부속의료기관의 운영 실태 및 행정 이력을 파악하는 데 활용됩니다. 해당 정보는 특정 조직 단위의 의료 인프라 분석, 기관별 보건관리 체계 개선, 폐업 및 휴업 현황 관리, 인허가 변동 추이 분석 등을 위한 기초자료로 제공되며, 지역 내 의료자원 분포의 특성 파악과 특수 목적 의료시설 정책 수립에도 유용합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
