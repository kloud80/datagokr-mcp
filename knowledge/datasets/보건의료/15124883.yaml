description_portal: 서울특별시 마포구에 설치된 공공흡연부스 현황에 대한 정보입니다. 이 데이터에는 각 흡연부스가 설치된 도로명 주소, 흡연시설형태(실외/개방형 등), 면적이 포함되어 있습니다.  이 데이터를 통해 흡연자 배려와 비흡연자 보호 간 균형을 도모하고, 흡연 집중지역(대학교 앞, 버스정류소, 공원 근처 등)의 흡연부스 수요를 파악할 수 있습니다. 또한 설치 위치 기반으로 도로변 공공장소 환경 정비, 비흡연 구역과의 경계 설정, 환기·냄새 저감 대책 마련, 흡연문화 개선 캠페인 등의 정책 수립에 기초 자료로 활용될 수 있습니다. 장기적으로는 공공장소 내 간접흡연 피해 저감뿐만 아니라 도시 경관 개선 및 바닥매립 쓰레기 감소에도 긍정적인 영향을 미칠 수 있습니다.
