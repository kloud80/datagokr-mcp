summary_user: 경기도 내 병원별로 건강보험심사평가원의 대장암 수술 평가 결과를 담는다. 기관명·평가내역·평가등급(1~5등급, 숫자가 낮을수록 우수)을 시군명·주소·위경도와 함께 제공한다. 환자나 가족이 "우리 시군에서 대장암 수술 평가 1등급 병원은 어디인가"를 찾거나, 분석가가 시군별 암 수술 질 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 의료기관 데이터와는 기관명·주소를 맞추거나 시군코드(SIGUN_CD)로 시군 단위로만 이어 쓴다.
description_portal: 이 데이터는 건강보험심사평가원이 제공하는 대장암 수술에 대한 병원별 평가 정보를 포함하고 있습니다. 대장암 수술 환자의 치료 전반에 대해 평가하며, 종합점수를 기준으로 1등급(90점 이상)부터 5등급(60점 미만)까지 분류됩니다. 등급이 낮을수록 대장암 치료 성과가 우수한 병원으로 평가됩니다. 평가제외 기관은 대상건수가 10건 미만이거나 세부 평가기준을 충족하지 않는 경우에 해당합니다.주요 제공 항목은 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 소재지 도로명주소 및 지번주소, 우편번호, 위치좌표(WGS84 위도·경도)입니다.이 데이터는 의료기관의 대장암 치료 역량 분석, 환자의 병원 선택 지원, 보건 정책 수립 및 암 치료 질 향상을 위한 자료로 활용될 수 있으며, API를 통해 자동화된 시스템 연계도 가능합니다.
