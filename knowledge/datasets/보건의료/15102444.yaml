summary_user: 인천광역시 서구(서해구) 안에서 건강진단결과서(보건증)를 발급하는 병·의원을 기관 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 1.6KB)로, 기관명·지역·위치·연락처와 식품·유흥(1종) 종사자용 발급 가능 여부를 담는다. 음식점이나 유흥업소 개업·취업을 앞둔 사람이 '서구에서 식품 종사자 보건증을 어느 병원에서 뗄 수 있나'를 찾을 때 쓰고, 구청 위생 담당이 관내 발급 기관 분포를 볼 때도 쓴다. 공통 조인 키가 없어 의료기관 인허가(LOCALDATA) 같은 다른 데이터와는 의료기관명이나 주소를 맞춰서만 이을 수 있다.
description_portal: 본 공공데이터는 인천광역시 서구 내 건강진단결과서(보건증) 발급이 가능한 병·의원의 명칭, 위치, 연락처, 발급 가능 항목을 포함하고 있습니다. 해당 데이터는 식품접객업, 유흥업, 공중위생 관련 업종 종사자들이 필수적으로 요구되는 건강진단결과서(보건증)를 신속히 발급받을 수 있도록 병원을 안내하는데 활용됩니다. 또한 위생관리 강화, 업종별 보건행정 지원, 지역 내 의료기관 분포 및 기능 파악 등에 기초자료로 제공될수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
