summary_user: 서울 은평구에서 인허가된 약국을 업소 한 곳당 한 행으로 담은 건별 인허가 원천 데이터로, 인허가일·폐업일·영업상태·소재지(지번·도로명)·전화번호·중부원점TM 좌표(X, Y)를 포함한다. 주민이 동네의 영업 중인 약국을 찾거나, 분석가·사업자가 은평구 안에서 약국이 언제 어디서 새로 열고 문을 닫았는지 보며 상권 변화를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 약국명·주소 매칭이나 같은 기관(지자체) 코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 형식의 병원·의원 인허가 데이터와 나란히 놓고 보는 방식이 현실적이다.
description_portal: '은평구의 약사가 의약품을 조제 또는 판매를 주목적으로 하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.약국 인허가 현황은 은평구에서 운영, 신규 또는 변경·폐업 신고된 약국의 최신 정보를 제공합니다. 약국명, 소재지(도로명), 전화번호, 인허가일, 위치 좌표 등 기본 데이터가 포함되어, 실제 영업 현황과 지역 약국 분포, 약사 인프라 확인에 필수적입니다. 본 정보는 2025년 1월 최신 기준으로 1,000여 개 행이 제공되며, 의약품 조제 및 판매를 주목적으로 하는 업소 전체를 실시간 자동 갱신 방식으로 관리합니다. 데이터는 CSV 등 개방형 포맷으로 즉시 내려받기 가능하며, 약국 접근성, 응급약국 지도, 지역보건 체계, 야간 및 휴일 운영 등 시민 건강 생활, 보건정책 등에 중심적으로 활용됩니다. 최근에는 비대면 의약품 수령 서비스, 모바일·AI 기반 약국검색 등 디지털 혁신 흐름과도 연동이 활발합니다'
