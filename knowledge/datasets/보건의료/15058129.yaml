summary_user: 식약처가 지정한 의약품 임상시험 실시기관을 기관 단위로 담는 API로, 검사기관 코드·기관명·지정일자·임상시험심사위원회 구분·소재지 필드를 둔다. 다만 검증 시 API 전체 건수와 수신 행이 각각 1건이다. 제약사나 연구자가 임상시험을 수행할 지정 의료기관이 어디인지 확인하는 데 쓰며, 소재지(ADDR1) 주소 키로 다른 의료기관 데이터와 이어 쓴다.
description_portal: 식품의약품안전처 「의약품 임상시험 실시기관 정보」 OpenAPI는 의약품 임상시험을 수행할 수 있도록 지정된 의료기관의 현황을 공공데이터입니다. 주요 제공 항목에는 검사기관 코드, 검사기관명, 대표자명(병원장), 지정일자, 임상시험심사위원회 구분, 소재지 등이 포함되어 있습니다. 이 데이터를 통해 제약사와 연구자는 임상시험 실시기관의 지정 현황과 특성을 파악할 수 있으며, 연구자와 관계 기관은 임상시험 수행기관의 분포와 현황을 객관적으로 분석하는 기초 자료로 활용할 수 있습니다.
