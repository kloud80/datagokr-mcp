summary_user: 국민건강보험공단이 요양기관정보마당 '진료지원플랫폼'에서 진료이력 질병군 분류에 쓰는 기준표로, 분류에 포함되는 KCD 상병코드를 한 행씩 담고 코드 길이와 시스템 등록·변경일시를 함께 싣는다. 요양기관이나 분석가가 환자 진료이력의 상병코드를 질병군으로 묶을 때, 특정 상병코드가 이 분류 기준에 들어가는지와 언제 등록·변경됐는지를 확인하는 데 쓴다. 상병코드(drug_cd)를 키로 KCD 상병 마스터나 상병코드가 들어 있는 진료·처방 통계와 이어 쓴다.
description_portal: '본 데이터는 국민건강보험공단이 요양기관정보마당 내 ‘진료지원플랫폼’ 서비스를 통해 요양기관에 진료이력 정보를 지원하기 위해 구축한 질병군 분류 기준 자료입니다.□ 데이터 개요o 목적: 요양기관이 환자의 진료이력을 분석하거나 질병군 기반의 진료 지원 서비스를 활용할 수 있도록 하기 위한 기준 데이터o 내용: 진료이력 상병코드에 대한 질병군 분류 기준 및 해당 상병의 시스템 등록·변경일 등 관리 정보- 상병코드: 해당 질병군 분류 기준에 포함되는 KCD 상병 코드- 길이: 상병코드의 문자열 길이- 시스템등록일시- 시스템변경일시'
