description_portal: 본 데이터는 전체 및 지역별 요양보호사 자격증 발급 현황을 국내/외국별로 구분하여  데이터를 제공합니다.2023년부터 2025년까지의 (2025.8.27. 기준) 요양보호사 직종에 대한 합격자의 시/도별, 면허발급자 수를 통계로 제공합니다.이 데이터는 다음과 같은 목적과 활용 가능성을 가지고 있습니다.1. 자격시험 현황에 대한 기초 통계 정보를 제공합니다.2. 요양보호사 분야 인력 수급 및 교육 현황 분석에 활용할 수 있습니다.3. 공공데이터 분석 및 민간 활용 기반에 활용할 수 있습니다.본 데이터는 외국인/내국인으로 구분하여 두 개의 시트로 나누어서 제공되었습니다.
