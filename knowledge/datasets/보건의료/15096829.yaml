summary_user: 제주특별자치도 내 입원실의 병실 수와 병상 수를 기준 연도·분기별로, 구분 대분류·소분류에 따라 집계한 시도 단위 통계로, 포털 설명상 2018년 7월부터 2021년 6월까지를 담는다. 보건정책 담당자나 분석가가 '제주도의 입원 병상은 분기마다 늘었나 줄었나, 어떤 구분에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기준 연도·분기·시도 이름을 맞추거나 같은 기관(제주특별자치도) 자료끼리만 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도가 집계·공개한 ‘입원실 현황’ 자료로, 2018년 7월부터 2021년 6월까지 제주도 내 병원별·분기별로 입원실의 병실 수와 병상 수를 체계적으로 정리한 공공데이터이다. 이 자료는 지역별 의료 인프라의 규모와 분포를 객관적으로 나타내며, 보건의료 자원 배치, 병상 여유도 분석, 의료 접근성 평가, 응급 및 중환자 대응력 점검, 보건 정책 및 예산 편성, 의료기관 설비 확충 여부 판단 등의 기초 통계로 활용 가능하다. 또한 시계열 정보를 포함함으로써 병상 수 변동 추이 분석, 인구 대비 병상 밀도 변화, 의료 수요-공급 간 격차 진단, 지역 간 의료 인프라 형평성 평가 등의 기반 자료로 쓰기에 적합하다.
