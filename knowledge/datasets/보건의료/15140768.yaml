summary_user: 은평구에서 안전상비의약품을 파는 편의점 등 판매업소를 업소 한 곳씩 담은 인허가 원천 데이터로, 업소명·인허가일·폐업일·영업상태·지번/도로명 주소·좌표(중부원점TM)를 포함한다. 주민이 야간이나 휴일에 '우리 동네에서 감기약·해열제를 살 수 있는 가까운 편의점이 어디인가'를 찾거나, 구청·분석가가 동네별 판매업소 분포와 폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 이어 쓰고, 좌표는 위경도로 변환한 뒤 약국·의료기관 위치 데이터와 겹쳐 본다.
description_portal: '은평구의 편의점 등 안전상비의약품으로 지정된 의약품을 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 주민들이 야간이나 휴일에 약국 이용이 어려울 때 가까운 편의점에서 기본적인 의약품을 구입할 수 있는 접근성 정보를 제공하며, 지자체는 안전상비의약품 유통 현황 파악과 의약품 접근성 개선 정책 수립에 활용할 수 있습니다. 또한 보건당국은 불법 판매 업소 단속이나 의약품 안전관리 점검 계획 수립 시 기초 자료로 활용하며, 유통업체는 신규 매장 개설 시 경쟁 현황을 분석하는 데 사용할 수 있습니다.'
