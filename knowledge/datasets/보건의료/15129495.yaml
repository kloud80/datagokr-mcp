description_portal: 본 자료는 대전광역시의 2023-2024절기 인플루엔자 예방접종에 대한 예방접종 현황을 파악하여 예방접종으로 예방 가능한 감염병 예방을 위한 정책 수립 등을 위한 기초 자료로 활용하기 위한 자료입니다.본 자료는 2024년 4월 30일 예방접종통합관리시스템에 전산 등록된 자료를 기준으로 하며, 대전광역시 관할 보건소별/대상자별(어린이, 임신부, 65세 이상)/접종기관별(의료기관, 보건소) 인플루엔자 예방접종에 대한 인구수, 접종자수, 접종률에 관한 데이터로 구성되어있습니다.아울러, 유료 접종의 경우 질병관리청 예방접종통합관리시스템에 예방접종 이력 등록 의무가 없어 실제 접종자 수와 상이할 수 있으니 해석에 주의가 필요합니다.
