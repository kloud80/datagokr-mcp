summary_user: 경상남도 하동군 관내 의료기관을 기관 한 곳당 한 행으로 정리한 현황 파일로, 명칭·도로명주소·전화번호·진료시간을 담는다(csv 약 5KB 규모의 소규모 목록). 하동군 주민이나 방문객이 "근처에 지금 진료하는 병의원이 어디이고 연락처는 무엇인가"를 확인하거나, 분석가가 군 단위 의료기관 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 LOCALDATA 병의원 인허가 데이터나 다른 의료기관 목록과는 기관 명칭·도로명주소를 맞춰 이어 써야 한다.
