description_portal: '보건복지부에서 2016년 인구 10만명 당 암 발생률 통계현황(연도, 암종(국제질병분류코드), 발생자수, 비율, 조발생률(명_10만명), 연령표준화발생률(명_10만명)) 정보를 제공하고 있습니다. 데이터에서 대부분 85세 이상군에서 암 발생률이 감소하는 경향은 병원급 이상 의료기관에서 해당 연령층에 대한 암 진단율이 낮아서 암 발생률이 낮게 산출된 것으로 추정되고 있습니다.<통계데이터 이용 시 참고사항>1. 데이터 출처 : ｢암등록통계｣, 중앙암등록본부2. 조발생률：해당 관찰기간 동안 특정 인구집단에서 새롭게 발생한 암 환자 수로, 일반적으로 인구 100,000명 당 발생하는 암 환자 수3. 연령표준화발생률：각 연령군에 해당하는 표준인구의 비율을 가중치로 한 가중평균발생률, 표준인구는 2020년 주민등록연앙인구를 사용4. 누적발생률：특정 연령군까지 각 연령군별 발생률을 합한 값'
