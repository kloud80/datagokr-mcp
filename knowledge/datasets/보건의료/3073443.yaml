summary_user: 여수시 관내 종합병원·병원·요양병원·의원·치과의원·한의원 등 의료기관을 한 곳당 한 행으로 담은 파일로, 종별·기관명·도로명주소·전화번호가 들어 있다(약 26KB CSV). 시민이나 방문객이 '여수에서 가까운 한의원이나 치과 연락처는?'을 찾거나, 분석가가 시 안에서 의료기관 종별 분포와 접근성을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 도로명주소를 맞춰 붙여야 하며, 주소를 좌표로 바꾸면 행정구역·지도 데이터와 겹쳐 볼 수 있다.
description_portal: '전라남도 여수시 관내에 위치한 의료기관 현황 정보를 제공하며, 종합병원, 병원, 요양병원, 의원, 치과의원, 한의원 등 다양한 유형의 의료기관을 포함합니다.제공 항목은 의료기관명, 소재지, 전화번호를 기본으로 하며, 지역 내 의료서비스 제공 현황을 파악하고 의료기관 검색, 위치 확인, 연락처 조회, 보건의료 관련 정책 수립 및 연구 자료로 활용할 수 있도록 구성되어 있습니다.시민과 방문객이 필요한 의료기관 정보를 쉽고 편리하게 확인할 수 있도록 지원합니다.또한 지역 보건의료 자원의 분포와 접근성을 분석하는 데 활용할 수 있으며, 응급상황이나 진료기관 선택 시 참고자료로 사용할 수 있습니다.데이터는 공공서비스 향상과 정보 제공을 목적으로 활용됩니다.* 키워드 : 병원, 한방병원, 치과병원, 요양병원, 의원, 한의원, 치과의원 등'
