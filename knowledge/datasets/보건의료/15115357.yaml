summary_user: 서울 중랑구 안의 의원·한의원 등 의료기관을 인허가 건별로 담은 원천 데이터로, 관리번호, 인허가일자, 영업상태와 폐업일자, 사업장명, 주소, 전화번호, 의료인 수·병상 수·진료과목, 중부원점TM 좌표 등을 담는다. 중랑구에서 최근 문을 열거나 닫은 의원이 어디인지 확인하려는 주민·개원 준비자나, 병의원 개폐업을 상권 변화 신호로 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중랑구의 의원, 보건소, 한의원 등 진료시설을 갖추고 환자를 대상으로 의사가 의료행위를 하는 의료기관 정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 주소, 사업자명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
