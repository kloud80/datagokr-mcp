description_portal: 관내 병원 집단급식소 설치 현황을 대상으로 작성한 데이터로, 병원명, 병상수, 급식 운영 구분(직영운영 여부), 주소, 전화번호 등의 정보를 포함하고 있습니다. 병상수는 의료기관의 허가병상(신고병상) 자료를 기준으로 작성하였으며, 병원별 집단급식소 운영 현황을 체계적으로 파악할 수 있도록 구성하였습니다.본 데이터는 지역 내 의료기관의 급식 운영 실태를 확인하고 집단급식소 관리 및 보건·위생 관련 행정업무 수행을 위한 기초자료로 활용될 수 있습니다. 또한 병원별 급식 운영 형태와 규모를 비교·분석할 수 있도록 하여 식품위생 관리, 집단급식소 지도·점검, 보건의료 정책 수립 및 통계 분석 등에 활용할 수 있습니다.데이터 항목은 병원명, 병상수, 급식 운영 구분, 소재지 주소, 전화번호 등으로 구성되어 있으며, 의료기관 현황에 대한 기본 정보를 제공함으로써 공공기관, 연구기관, 민간 사업자 및 일반 국민이 관련 정보를 보다 쉽게 활용할 수 있도록 제공됩니다. 이를 통해 지역 의료서비스 현황 파악 및 보건행정의 효율성 제고에 기여할 수 있습니다.
