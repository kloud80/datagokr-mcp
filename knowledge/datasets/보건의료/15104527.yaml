summary_user: 대전광역시 서구 관내에 설치된 자동심장충격기(AED)를 설치 장소 한 곳씩 담은 건별 목록으로, 설치기관명·전화번호·지번/도로명 주소·장비 사용 여부·제조사·제조국·모델명을 담는다. 서구 주민이 '우리 동네 가까운 AED가 어디 있고 지금 쓸 수 있는가'를 확인하거나, 구청·분석가가 동별 설치 분포와 노후·미사용 장비를 점검 대상으로 추리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(도로명)를 지오코딩하거나 설치기관명으로 맞춰 이어 쓴다.
description_portal: 대전광역시 서구 관내에 설치되어 있는 응급의료장비(AED)에 대한 상세 정보를 체계적으로 제공하기 위해 구축된 데이터로, 응급의료장비(AED)의 설치기관명칭, 전화번호,  지번주소, 도로명주소, 장비사용여부, 제조사, 제조국가명, 모델명과 같은 주요 항목을 포함하고 있습니다. 시민들은 이 데이터를 통해 인근 응급의료장비(AED)의 설치위치 등을 손쉽게 확인할 수 있어 응급상황 발생 시 신속한 대처가 가능하여 지역주민의 생명 보호에 중요한 역할을 수행합니다. 또한 행정기관은 응급의료장비(AED) 현황 분석 등에 활용할 수 있어 설치 지원 대상 선정이나 장비 점검 시 중요한 참고 자료로 활용됩니다.
