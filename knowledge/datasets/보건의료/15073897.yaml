summary_user: 식약처가 관리하는 의료기기 품목별 제조자 정보를 품목 일련번호 단위로 담으며, 품목명·허가일자·모델명(형상)·제조국·제조원 명칭·제조자 주소가 들어 있고 범위는 전국이다. 수입 의료기기 사업자나 분석가가 '특정 의료기기 품목을 실제로 어느 나라 어느 제조사가 만드는가', '한 제조사가 국내에 허가받은 품목은 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 식약처의 의료기기 품목허가 데이터와 품목 일련번호(MDEQ_PRDLST_SN)나 품목명·제조원 명칭을 맞춰 이어 쓴다.
limits: 다른 기관 데이터와 바로 연결할 공통 코드가 없어 이름 매칭에 기대야 하며, 표기 차이로 누락·오매칭이 생길 수 있다. 제조자 주소는 문자열로만 제공되어 위치 분석에는 별도 주소 정제가 필요하다. 개발계정은 하루 10,000회로 호출이 제한된다.
