summary_user: 의료기기 이상사례 보고에 쓰는 국제조화(IMDRF) 기반 간편표준코드를 코드 단위로 담은 코드집 목록으로, 코드별 상위코드·계층 수준(CD_LV)과 한글·영문 용어명 및 정의를 담는 참조용 사전 데이터이며 범위는 전국·비공간이다. 의료기기취급자나 안전성 분석가가 이상사례를 보고하거나 집계할 때 '이 의료기기문제·원인조사·건강영향 코드는 무슨 뜻이고 어느 상위 분류에 속하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 코드값이나 용어명 매핑으로만 잇고, 코드집 안에서는 상위코드(PRNT_CD)로 계층을 재구성한다.
description_portal: 해당 공공데이터는 식품의약품안전처(MFDS)에서 의료기기 이상사례 간편표준코드집 목록에 대한 정보를 제공합니다. 의료기기취급자는 의료기기 사용 중 발생한 이상사례 보고 시, 이상사례에 해당되는 의료기기문제코드, 원인조사코드(유형,소견,결론), 건강영향코드(임상징후 및 증상 또는 상태, 건강결과)등을 보고해야되며, 국제조화된 IMDRF코드를 통해 일관성 있는 안전성 정보 수집 및 분석하여 이상사례 통계분석, 의료기기 사후관리 및 안전기준을 수립하는데 활용하고 있습니다.
