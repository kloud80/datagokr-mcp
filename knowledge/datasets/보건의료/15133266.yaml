description_portal: 전북특별자치도에서 제공하는 약국현황 조회 서비스 오픈API는 도내 약국의 상세 정보를 제공하여 데이터 수요자에게 제공하고자 합니다. 본 서비스는 도민의 의료 접근성을 높이고, 공공의료서비스 향상과 지역 주민의 건강 증진을 목적으로 운영되며, 이를 통해 약국 이용 편의성과 정보의 투명성을 확보하며, 보다 신속한 의약품 접근을 지원하여응급 상황 시 이용 가능하도록 구축하였습니다. 데이터 항목은 전 북 도내 약국의 인허가일자, 소재지, 전화번호, 도로명 전체주소, 사업장명 등을 기준으로 구성되어 있습니다.
