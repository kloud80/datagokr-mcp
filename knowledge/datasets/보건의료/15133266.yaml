summary_user: 전북특별자치도 도내 약국을 한 곳씩 담은 건별 인허가 목록으로, 사업장명·인허가일자·영업상태·도로명주소·전화번호·영업면적과 중부원점TM(EPSG:5174) 좌표를 제공한다. 도민이나 분석가가 '우리 동네에서 현재 영업 중인 약국은 어디이고 언제 문을 열었나'를 확인하거나, 약국 개폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 좌표 기반 공간 결합으로만 잇는다.
limits: 전국 공통 식별 키가 없어 건강보험·LOCALDATA 등 다른 약국·의료기관 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭이 필요하다. 범위는 전북특별자치도 한 시도에 한정된다. 좌표는 EPSG:5174(중부원점TM)이므로 지도에 올리려면 좌표계 변환이 필요하다.
