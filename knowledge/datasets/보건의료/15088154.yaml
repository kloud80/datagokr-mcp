description_portal: 본 데이터는 대구광역시 서구 관내 정신보건 관련 기관의 현황을 제공하는 자료이다. 정신의료기관, 정신건강복지센터 및 정신재활시설 등으로 구분되며, 기관명, 소재지, 전화번호 정보를 포함하고 있다. 정신의료기관은 입원 및 외래 진료를 제공하는 병원 또는 의원으로, 지역 주민의 정신건강 치료 접근성을 높이는 역할을 한다. 정신건강복지센터는 지역사회 정신건강 증진 및 예방을 위한 서비스를 제공하며, 정신재활시설은 만성 정신질환자의 사회 복귀 및 자립을 지원한다. 본 자료는 해당 기관 이용자 및 복지 담당자의 정보 접근을 용이하게 하며, 정신보건 서비스 전달체계 파악 및 정책 수립의 기초자료로 활용 가능하다.
