summary_user: 의료취약지 의료지원 시범사업의 디지털의료지원시스템에서 처방할 수 있도록 등록된 상병을 코드 한 건씩 담은 전국 단위 목록으로, 상병 한글명·영어명·사용여부·등록일자를 함께 담는다(CSV 약 3.3MB). 시범사업 시스템에서 어떤 질병코드로 처방할 수 있는지, 어떤 상병이 사용 중이거나 중단됐는지를 확인하려는 분석가·연구자가 쓴다. 상병코드(drug_cd)를 키로 같은 시스템의 처방·진료 데이터나 다른 상병코드 기반 자료와 이어 쓴다.
description_portal: '한국사회보장정보원이 제공하는 의료취약지 의료지원 시범사업의 디지털의료지원시스템 등록 상병정보입니다.데이터는 시스템에서 처방가능한 상병코드, 상병 한글명, 상병 영어명, 사용여부, 등록일자로 항목이 구성되어 있습니다.이러한 공공데이터를 통해 다음과 같은 데이터분석, 연구 등의 활용이 가능합니다.*단순 예시 사례이니,  참고바랍니다.○ 기초 통계 및 추세 분석 - 상병 등록 추세 분석: 등록일자를 기준으로 시간에 따른 신규 상병 코드의 등록 빈도를 분석하여, 특정 시기에 새로운 질병이 많이 등록되었는지 확인할 수 있습니다. 예를 들어, 특정 전염병의 유행 시기에 관련 상병 코드가 급증했는지 파악할 수 있습니다. - 상병 코드 사용 현황: "사용여부" 항목을 활용해 전체 상병 코드 중 현재 사용 중이거나 사용 중단된 상병 코드의 비율을 계산할 수 있습니다. 이는 데이터 정리 및 관리 효율성을 높이는 데 도움이 됩니다.○ 질병 분류 및 패턴 분석 - 가장 흔한 질병 분류 분석: 상병코드의 첫 글자나 그룹(예: ICD-10 코드)을 기준으로 질병을 분류하여, 어떤 종류의 질병(예: 순환기계 질환, 감염성 질환)이 가장 많이 등록되었는지 분석할 수 있습니다. - 언어별 상병명 비교: 상병 한글명과 상병 영어명을 비교하여 번역의 일관성을 검토하거나, 특정 질병에 대한 한글 및 영어 표현의 차이점을 분석할 수 있습니다.'
