description_portal: '보건복지부에서 2024년 1월 기준으로 보건복지부 소관 비영리사단법인 현황의 정보(허가번호, 명칭, 대표자, 소재지, 설립근거, 허가일자, 설립목적, 회원수, 주무과)를 제공하고 있습니다.<데이터 이용 시 참고사항>1. 보건복지부 소관 비영리사단법인 : 영리를 목적으로 하지 않는 단체 중에서, 보건복지부 장관의 허가를 받아 설립된 법인을 의미합니다.2. 비영리성: 수익을 구성원에게 분배하지 않고, 사회에 환원하는 방식으로 운영됩니다.3. 사단법인: 일정한 목적을 위해 조직된 사람들의 단체로, 법인격이 부여됩니다.4. 보건복지부 소관: 사업 내용이나 목적이 보건복지와 관련이 있어 보건복지부가 설립을 허가하고 관리·감독합니다.5. 공익성: 대체로 사회복지 서비스 제공, 정책 제안, 취약계층 지원 등의 공익적 사업을 중심으로 활동합니다.'
