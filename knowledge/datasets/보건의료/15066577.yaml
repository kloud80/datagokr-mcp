summary_user: 인천광역시 중구(현 영종구) 관내 안전상비의약품 판매업소를 업소 한 곳당 한 행으로 담은 파일이며, 관할구분·판매점포명·도로명 소재지·데이터기준일 등으로 구성된다(CSV 약 17KB). 주민이 밤이나 휴일에 약국 말고 해열진통제·소화제·감기약을 살 수 있는 가까운 편의점 등 판매처를 찾을 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 판매점포명이나 도로명 주소를 매칭해 이어 쓴다.
description_portal: '인천광역시 중구 관내에 위치한 안전상비의약품 판매업소 현황으로 업소명, 주소, 연락처 등의 정보를 포함한 공공데이터 입니다.주민들이 가까운 장소에서 해열진통제, 소화제, 감기약 등 기본적인 의약품을 편리하게 구매할 수 있도록 지원하기 위해 제공됩니다.관내 판매업소의 현황을 파악함으로써 응급상황 시 약국 이외의 판매처 정보를 빠르게 확인할 수 있어 국민 건강 보호에 실질적인 도움을 줄 수 있으며관련 기관의 의약품 안전관리 및 유통 관리 체계 강화에도 기여할 수 있습니다.파일명 인천광역시_중구_안전상비의약품 판매업소 현황 : 순번, 관할구분, 판매점포명, 소재지(도로명), 데이터기준일'
