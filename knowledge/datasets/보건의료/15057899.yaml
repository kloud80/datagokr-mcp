summary_user: 의약품의 생산·수입·공급 중단 보고를 건별로 담으며, 업체명·품목명·표준코드, 최종공급일자와 공급중단일자, 자사 재고량과 재고 기준일자, 중단 사유, 공개 여부 등을 제공한다(범위 전국). 의료기관·약국이나 제약 유통업체가 '처방하던 이 약이 언제부터 공급이 끊기고 남은 재고는 얼마인지, 대체품을 찾아야 하는지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, 품목일련번호(ITEM_SEQ)·보험코드(EDI_CODE)·사업자등록번호(BIZRNO)를 이름·코드 매핑으로 식약처 허가정보나 심평원 약가·급여 목록과 맞춰 볼 수 있다.
description_portal: 식품의약품안전처 「의약품 생산·수입공급중단정보」 OpenAPI는 의약품의 생산, 수입 또는 공급이 중단된 내역을 제공하는 공공데이터입니다. 주요 항목으로는 업체명, 품목명, 표준코드, 최종공급일자, 공급중단일자, 자사 재고량, 재고 기준일자, 중단 사유, 전자민원창구 공개 여부 등이 포함되어 있습니다. 이 데이터는 공급 중단 시점과 원인, 재고 현황 등을 객관적으로 기록해 제공하기 때문에, 제약사와 유통업체는 공급망 관리와 대체 품목 검토에 활용할 수 있고, 의료기관은 환자 치료 과정에서 의약품 수급 문제를 미리 인지하는 데 참고할 수 있습니다.
