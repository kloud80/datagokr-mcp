description_portal: 서울시 정신건강복지센터 등록회원 지역사회 생활 유지율(자치구) 데이터는 자치구별로 중증정신질환 등록회원이 어느 정도 지역사회에서 입원하지 않고 생활을 유지하고 있는지를 보여주는 지표입니다. 연도와 지역명, 지역코드를 통해 시기별·자치구별 비교가 가능하며, 주민등록인구는 각 지역의 전체 인구 규모를 파악하는 기준값으로 활용됩니다. 중증정신질환 등록회원 수는 정신건강복지센터에 등록된 고위험군 규모를 나타내고, 비입원자수는 이들 중 지역사회에서 생활을 지속하고 있는 인원을 의미합니다. 유지율(%)은 비입원자수가 등록회원 수에서 차지하는 비율로, 지역사회 기반 정신건강 서비스의 효과와 안정적 생활 지원 수준을 평가하는 핵심 지표입니다. 이 데이터는 자치구별 지역사회 정신건강 돌봄 수준을 비교·분석하고, 입원 중심에서 지역사회 중심 정신보건 정책으로의 전환 정도를 파악하며, 취약 지역을 선별해 지원을 강화하는 데 중요한 기초 자료로 활용될 수 있습니다.
