description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 의료기기 광고사전심의 정보입니다.  이 공공데이터는 심의결과일자와 심의번호를 통해 각 심의 건을 고유하게 식별하며 업체명으로 광고 신청 업체를 파악할 수 있습니다.  또한 매체유형 정보는 광고가 게재될 매체의 종류를 보여줍니다. 제품명과 허가번호로 광고 대상 의료기기를 정확히 특정할 수 있으며 심의결과를 통해 해당 광고의 승인 여부를 확인할 수 있습니다 이러한 정보 공개를 통해 의료기기 광고의 투명성을 제고하고 소비자가 신뢰할 수 있는 의료기기 정보 환경을 조성하는데 기여합니다
