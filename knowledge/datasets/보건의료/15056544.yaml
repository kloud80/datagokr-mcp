summary_user: 의료기기 광고사전심의 건마다 심의결과일자·심의번호, 신청 업체명, 광고 매체 종류, 대상 제품명과 허가번호, 심의결과를 담은 건별 원천 데이터이며 범위는 전국입니다. 소비자나 업계 담당자가 '이 의료기기 광고가 사전심의를 거쳐 승인된 것인가, 어떤 매체에 실리는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 제품 허가번호(BOSS_MEDDEV_ITEM_NO)나 업체명·제품명을 매핑해 식약처 의료기기 품목허가 정보와 이어 쓰는 방식으로만 연결된다.
limits: 공통 조인 키가 없어 다른 데이터와는 허가번호·이름 매핑으로만 연결되므로 표기 차이에 따른 매칭 누락에 주의한다. 개발계정은 하루 10,000회 호출 한도가 있다.
