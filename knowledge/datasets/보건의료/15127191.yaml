summary_user: 대구광역시 달서구 주민(주민등록 주소지 기준)의 2022년 건강보험 진료인원을 5세 단위 연령과 주상병코드별로 집계한 파일로, 한의·약국·비급여·의료급여는 빠져 있다. 지역 보건 담당자나 분석가가 "달서구에서 어떤 연령대가 어떤 질병으로 많이 진료받았나"를 확인하는 데 쓴다. 전역 조인 키는 없고, 주상병코드(KCD)와 시군구명을 맞춰 다른 지역·기관의 진료 통계와 이어 쓴다.
description_portal: '1. 진료년도: 2022년, 진료일기준2. 수진자 주소지: 대구광역시 달서구(주민등록 주소지 기준)3. 연령: 5세 단위, 연도말 기준 4. 주상병코드 및 상병명: 2022년 한 해 동안 수진자 주소지 기준으로 청구된 상병코드 및 상병명5. 진료인원: 각 구분에 해당하는 진료인원 수   - 건강보험 급여실적(의료급여 제외)이며 한의분류 및 약국 제외, 비급여 제외  - 2023년 6월 지급분까지 반영  - 개인정보 보호를 위해 시군구 단위의 5인 미만 자료는 "*" 처리※ 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라     일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를 수 있음※ 민원인의 공공데이터 제공 신청에 따라 2024-03-13 발췌 및 구성한 데이터'
