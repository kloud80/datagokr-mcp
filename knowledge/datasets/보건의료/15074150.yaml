description_portal: 이 데이터는 국립암센터에서 수집한 PRE(선행) 위암 환자의 내시경 점막하 박리술(Endoscopic Submucosal Dissection, ESD)에 대한 메타정보입니다. 시술 일자, 병변 위치 및 크기, 절제 범위, 시술 시간, 출혈 및 천공 여부, 조직학적 절제 상태(완전절제 여부), 병리 결과 등으로 구성됩니다. ESD는 조기 위암 환자에게 수술 없이 병변을 제거할 수 있는 최소침습 치료법으로, 환자의 회복 기간 단축과 삶의 질 향상에 기여합니다. 해당 데이터는 위암 조기진단 및 치료 연구, 시술 성과 분석, 치료 후 재발률 예측 등 다양한 임상 및 보건의료 연구에 활용됩니다. 특히 수술 전 내시경 기반 치료의 안전성과 효과를 평가하는 데 있어 필수적인 자료로 기능합니다.
