summary_user: 경기도 내 의료기관별 고혈압 진료·관리 평가 결과를 기관 한 곳당 한 행으로 담으며, 시군, 기관명, 평가내역, 평가등급, 주소, 위경도 좌표가 함께 들어 있다. 환자나 가족이 "우리 시군에서 고혈압 평가등급이 좋은 병원이 어디인가"를 찾을 때 쓰고, 분석가는 시군별 고혈압 진료 질 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군 코드(SIGUN_CD)나 시군명, 의료기관명 대조로 묶거나 주소·좌표로 공간 결합해야 한다.
description_portal: 고혈압 병원평가정보는 건강보험심사평가원이 제공하는 자료로, 경기도 내 의료기관에서 고혈압 환자의 진료 및 관리에 대한 평가결과를 담고 있습니다. 특히 관상동맥우회술을 수행하는 의료기관에 대한 평가가 중심이며, 평가 결과는 양호한 성과를 보인 기관만 공개됩니다. 데이터는 시군명 및 코드, 의료기관명, 평가내역, 평가등급, 도로명주소, 지번주소, 우편번호, 위도·경도 등으로 구성되어 있으며, 환자들의 의료기관 선택, 고혈압 치료 질 관리, 지역별 의료서비스 수준 분석 등에 활용될 수 있습니다. 데이터는 연 1회 갱신됩니다.
