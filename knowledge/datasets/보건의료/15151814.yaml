description_portal: 경기도 화성시에서 동탄지역의 모기 발생 현황을 조사·관리하기 위해 구축한 자료이다. 본 데이터는 여름철 집중 방역기간 동안 수집된 모기 채집 결과를 중심으로 하며, 지역별 모기 개체수, 채집일자, 채집장소 등 주요 항목을 포함하고 있다. 해당 자료는 동탄 지역의 환경위생 상태를 파악하고 모기 밀도 변화를 분석하여 효율적인 방역계획 수립에 활용하기 위한 기초정보로 제공된다. 특히 시민 건강 보호와 감염병 예방을 위해 모기 발생량을 정량적으로 관리하고, 해충 확산 요인을 사전에 탐지할 수 있도록 지원하는 목적을 가진다. 본 데이터는 특정 기간에 한정하여 수집된 결과로, 시점별 모기 분포 특성을 파악하는 데 유용하다. 이를 통해 화성시는 지역 맞춤형 방역정책 수립과 모기 저감 활동의 근거자료로 본 데이터를 활용하고 있다.
