description_portal: '○ 통계개요* 통계명 : 위암검진 수진율* 통계종류 : 보건복지부 "지역사회 건강조사", 통계청 "인구주택총조사", 서울특별시"주민등록인구" 등을 활용한 가공통계* 작성목적: 서울 시민들의 건강문제를 진단하고, 건강격차에 대한 인식과 관심을증가시켜 건강한 공공보건정책 수립의 기초자료 제공* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 성별, 생애주기별, 학력별, 직업별, 자치구별○ 용어설명* 비율 : 표본조사 자료의 경우 제공된 가중치를 사용하여 가중치 적용조율로 분석가공* 3년 이동합계 평균율 : 기대여명, 건강기대여명이나 사망률을 자치구 단위로 분석하는경우 기준시점 전후 1년을 포함하여 3년을 윈도우로 하는 이동합(moving sum)을분자와 분모에 각기 적용, 3년 이동합계 평균율 산출* 표준화율 : 남녀 모두 있는 경우는 성·연령표준화를, 하나의 성만 있는 경우에는연령표준화* 신뢰도 : 표본수가 작거나 상대표준오차 큰 경우 통계 값 제외- 상대표준편차가 20%를 초과하는 경우 해석에 주의하라는 의미로 수치대신 "*"로 표시- 상대표준편차가 33.3%를 초과하는 경우 수치를 제시하지 않고 "F"로 표시'
