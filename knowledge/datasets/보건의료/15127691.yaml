summary_user: 식이장애 관련 주상병(폭식증·신경성 식욕부진증·식사장애·부적당한 식사습관 등) 별로 2018~2022년 진료년도, 수진자 주소지, 연령, 성별에 따른 진료건수와 진료비(천원)를 모은 집계 파일이며, 전국 범위를 담는다. 분석가나 정책 담당자가 '최근 5년간 신경성 식욕부진증 진료가 어느 연령·성별·지역에서 늘었는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주상병코드(KCD)나 주소지 이름을 맞춰 연결해야 한다.
description_portal: '1. 주상병코드 - F50.2(식이장애 중 폭식증), F50.3(비전형적 신경성 폭식증), F50(식사장애), 신경성 식욕부진증(F50.0),      F50.1(비전형적 신경성 식욕부진), Z72.4(부적당한 식사 및 식사습관)2. 진료년도: 2018~2022년3. 수진자 주소지: 주민등록주소지(수진시점)4. 연령: 연말시점5. 진료건수 및 진료비: 해당 구분별 진료건수 및 진료비용  - 진료일 기준(한의분류 제외, 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2023년 6월 지급분(심사분)까지 반영※ 요양기관에서 환자 진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라 일차진단명을 부여하고 청구한 내역 중      주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음'
