summary_user: 울산광역시 내 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 기관명·종별·소재지·구군·전화번호·병상수·개설일자를 수록한다(CSV 약 139KB). 시민이나 분석가가 울산의 어느 구·군에 어떤 종별의 병원·의원이 몇 병상 규모로 있는지, 언제 개설됐는지를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·주소 매칭이나 구군 단위 집계로 이어 쓴다. 예를 들어 LOCALDATA 병의원 인허가 자료와 대조해 개폐업 흐름을 보는 식이다.
limits: 표준 기관코드 같은 전역 조인 키가 없어 다른 기관 데이터와 정확히 1:1로 연결되지 않고, 이름·주소 매칭에 의존해야 한다. 범위는 울산광역시 한 곳의 개별 기관 주소 단위로 한정된다.
