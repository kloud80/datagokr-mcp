description_portal: 본 데이터는 지역 내 의료기관 현황을 제공한다. 의료법에 따라 개설된 병원, 의원, 요양병원 등 의료시설의 기본 정보를 포함한다. 의료기관명, 기관분류, 기관주소, 대표전화번호, 병상수 등의 항목을 수록한다. 의료기관명은 각 기관의 명칭이며, 기관분류는 종합병원, 병원, 의원 등 기관 종류를 나타낸다. 기관주소는 도로명주소 체계로 표시된 소재지이고, 대표전화번호는 기관 연락처이다. 병상수는 입원 가능한 병상 수로 기관 규모를 나타낸다. 본 데이터로 지역별 의료 인프라 분포와 기관 규모를 파악할 수 있으며, 시민의 의료기관 선택과 보건의료 정책 수립 기초 자료로 활용된다. 의료서비스 접근성 분석 및 의료자원 배분 계획에도 활용 가능하다.
