description_portal: '- 전라남도 보건연구원홈페이지에 게시된 수질(지하수, 상수도 등) 관련 검사항목 및 수수료에 대한 사항을 정리한 파일입니다.- 지하수와 상수도는 모두 식수와 생활용수의 중요한 공급원입니다. 특히 전라남도와 같은 농업 중심 지역에서는 지하수의 활용도가 높습니다. - 지하수는 지표면 아래의 토양층이나 암석층에 존재하는 물로, 강수나 하천수의 일부가 지하로 스며들어 형성됩니다.- 상수도는 하천수, 저수지, 댐 등에서 취수한 물을 정수하여 가정이나 산업체에 공급하는 시스템입니다.- 지하수와 상수도는 각각의 특성과 관리 필요성이 다릅니다. 지하수의 과도한 사용이나 오염을 방지하기 위해서는 지속적인 모니터링과 관리가 필요하며, 상수도의 경우 정수시설의 유지관리와 수질 관리가 중요합니다.'
