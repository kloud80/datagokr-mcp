description_portal: '함안군 정신건강의학과(의원, 병원, 종합병원) 현황, 요양병원 현황본 데이터는 함안군 내 정신건강의학과에 대한 기본 정보와 각 연도별 정신건강의학과 진료기관 목록 및 시도군에서 공익으로 운영되는 정신건강복지센터 현황을 제공합니다. 이 데이터는 정신건강 서비스를 필요로 하는 주민들에게 접근성을 높이고, 지역 내 정신건강 관리 체계의 효율성을 높이기 위해 제공됩니다. 함안군 내 정신건강의학과 기관들의 위치, 연락처 등의 정보가 포함됩니다.데이터 항목 구성정신건강의학과 기본 정보: 병원/클리닉명, 주소, 연락처 등연도별 정신건강의학과 목록: 매년 갱신되는 정신건강의학과 명단주요 변동 사항본 데이터는 주기적으로 갱신되며, 현행화 작업을 통해 최신 정보를 제공합니다. 정신건강의학과 관련 서비스의 개설 및 변경 사항을 반영하여, 실시간으로 정확한 정보를 업데이트합니다.'
