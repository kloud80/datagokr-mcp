description_portal: '금천구 관내 식품위생법 위반업소에 대한 지도점검 결과를 제공합니다. 업종명, 업소명, 소재지, 지도점검일자, 처분명, 처분일자, 처분기간 등 위반 내역과 행정처분 정보를 포함하고 있습니다. 식품위생 안전 관리, 위생 점검 현황 파악, 위반업소 모니터링, 정책 수립 및 시민 알권리 보장에 유용하며, 식품 관련 업계 종사자, 행정기관, 일반 시민 모두가 위생수준을 확인하거나 위반 사례를 참고하여, 보다 위생적인 환경에서 음식을 제공하고/제공받을 수 있도록 합니다. 데이터는 정기적으로(연 1회) 업데이트됩니다.(담당부서 : 금천구 보건소 위생과)'
