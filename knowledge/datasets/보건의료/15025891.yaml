summary_user: 부산 사상구 관내 의료기관이 운용하는 특수의료장비를 장비 한 대(행) 단위로 담은 파일로, 의료기관명·전화번호·도로명 주소와 장비 종류·명칭·용도 또는 부위·모델명·형식명이 들어 있다(CSV 약 6KB). 지역 보건 담당자나 분석가가 '사상구에서 CT·MRI 같은 특수의료장비를 갖춘 병의원은 어디이며 어떤 장비를 운용하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가 데이터(LOCALDATA 병의원 등)와는 의료기관명이나 도로명 주소를 맞춰 이어 쓴다.
description_portal: '"특수의료장비 현황" 데이터는 부산광역시 사상구 관내 의료기관에서 운용 중인 특수의료장비에 대한 상세 정보를 제공하는 자료입니다. 이 데이터에는 의료기관명, 의료기관의 전화번호 및 주소 정보 뿐만 아니라 장비종류, 장비명칭, 의료장비 용도 또는 부위, 모델명, 형식명과 같은 장비 관련 정보도 포함되어 있습니다. 이를 통해 특수의료장비 현황을 파악하거나 의료장비 현황 분석, 지역 의료자원 조사 등에 활용될 수 있습니다. 특히 특수의료장비 관련 안전관리 및 정책 수립 시 기초자료로서 중요한 역할을 할 수 있습니다.'
