summary_user: 부산광역시 금정구 관내 약국을 한 곳씩 담은 목록 파일로, 약국명칭·전화번호·도로명 소재지를 담는다. 주민이 집 근처 약국의 위치와 연락처를 찾거나, 분석가가 금정구 안 약국 분포를 주소 단위로 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 약국 이름이나 도로명 주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 부산광역시 금정구 관내 소재지 약국 현황(업소명, 소재지, 전화번호 등)입니다. 업무에 참고하시기 바랍니다. 오류가 있을 경우 신고 바랍니다약국은 약사나 한약사가 수여할 목적으로 의약품 조제업무를 하는 장소(그 개설자가 의약품 판매업을 겸하는 경우에는 그 판매업에 필요한 장소를 포함한다)를 말한다복약지도란 다음 각 목의 어느하나에 해당하는 것을 말한다. 1.의약품의 명칭,용법.용량.효능.효과 저장방법,부작용, 상호작용이나 성상등의 정보를 제공하는것 2. 일반의약품을 판매할 때 진단적 판단을 하지 아니하고 구매자가 필요한 의약품을 선택할 수 있도록 도와주는것.
