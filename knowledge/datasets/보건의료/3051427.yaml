summary_user: 전국 지역가입자의 건강보험료 부과 현황을 연도별 한 행으로 집계한 소형 파일(csv 812바이트)로, 결산 기준 보험료 총액(백만원)과 세대·적용인구 기준 1인당 월평균 보험료, 연말 세대 수와 적용인구를 담는다. 분석가나 정책 담당자가 "지역가입자 1인당 월평균 보험료가 해마다 얼마나 올랐고 가입 세대 수는 어떻게 변했나" 같은 연도별 추이 질문에 쓴다. 전역 조인 키는 없고 연도 열만 있으므로, 직장가입자 부과자료 같은 다른 연도별 건강보험 통계와는 연도를 맞춰 나란히 비교하는 방식으로만 잇는다.
limits: 전국 단위 연도 집계라 시도·시군구별이나 가입자 개인·세대 단위 분석에는 쓸 수 없다. 공통 코드 키가 없어 다른 데이터와는 연도나 이름을 맞춰 붙여야 한다.
