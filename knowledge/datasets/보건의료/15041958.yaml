description_portal: '- 전라남도 보건환경연구원 홈페이지에 게시된 각종 검사에 대한 검사처리기한 및 소요량에 관한 사항을 정리한 파일입니다.- 전라남도 보건환경연구원은 지역 주민의 건강과 환경 보호를 위해 다양한 검사를 수행하고 있습니다. - 미생물 검사 : 식품, 수질, 환경 시료에 대한 미생물 분석- 식품 및 약품 분석 : 농수산물, 가공식품, 의약외품 등의 성분 및 안전성 검사- 환경 분석 : 대기, 수질, 폐수, 폐기물 등에 대한 환경 오염도 측정- 방사능 검사 : 유통 농수산물 및 식품에 대한 방사능 오염 여부 확인- 검사 처리 기한과 소요량은 시료의 종류와 검사 항목에 따라 다릅니다.'
