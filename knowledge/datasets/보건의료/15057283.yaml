summary_user: 경기도 내 정신재활시설(주간재활시설·공동생활가정·생활시설 등)을 시설 한 곳당 한 행으로 담은 현황 목록으로, 시군명·기관명·대표전화·시설종류와 구분, 지번·도로명 주소, 우편번호, 위경도 좌표가 들어 있다. 보호자나 복지 담당자가 우리 시군에 낮 시간 재활훈련을 받을 수 있는 주간재활시설이 어디 있는지 찾거나, 분석가가 시군별 정신재활시설 분포와 접근성을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 시군명·시군 코드(SIGUN_CD)나 주소·좌표를 맞춰 이어 쓴다.
description_portal: 경기도 내의 가족의 보호가 어려운 정신질환자가 입소ㆍ보호ㆍ사회적응훈련등 재활훈련을 할수 있는 정신보건관련 기관의 현황 정보 입니다.이 데이터는 정신건강 문제로 인해 일상생활 적응이 어려운 이들을 지원하는 경기도 내 정신재활시설 현황을 나타냅니다. 포함된 항목은 시군명, 기관명, 대표전화번호, 시설종류명, 시설구분명, 소재지우편번호, 지번주소, 도로명주소, 위도 및 경도 정보 등입니다. 시설구분명에는 주간재활시설, 공동생활가정, 생활시설 등이 포함되어 있으며, 각 시설의 기능과 역할에 따라 분류됩니다. 이 데이터는 정신건강복지 정책 수립, 지역 내 서비스 분포 분석, 복지기관 연계 등에 활용될 수 있습니다. 또한 위치정보는 공간분석 및 접근성 평가에 유용하게 사용될 수 있습니다.
