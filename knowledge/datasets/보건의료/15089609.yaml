summary_user: 4단 상병(주상병코드)별·시도별로 연도 단위 건강보험 진료 실적(환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액)을 모은 전국 집계 파일로, 약국을 제외한 양방 요양기관이 청구한 명세서를 심사 결정한 내용을 기준으로 한다. 보건 분석가나 지자체 담당자가 '특정 질병으로 우리 시도에서 진료받은 환자 수와 진료비가 연도별로 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 주상병코드를 한국표준질병사인분류(KCD) 코드표와, 시도구분을 시도 이름으로 맞춰 다른 지역·질병 통계와 이어 쓴다.
limits: 주상병 기준이라 의사가 진료 시 일차로 부여한 진단명이어서 최종 확정 질병과 다를 수 있고, 환자수는 범주 안에서만 중복 제거된 값이라 다른 시도·상병과 단순 합산하면 중복이 생긴다. 심평원 청구 기준 값이므로 공단(자격 기준) 통계와 수치가 다르며, 시군구·월 단위나 비급여 진료비는 담지 않는다.
