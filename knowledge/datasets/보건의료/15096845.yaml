description_portal: '제주특별자치도 내 인구 천 명당 의료기관 병상 수 정보 데이터를 제공합니다.항목: 연도, 시도, 총 병상 수(개), 인구 천명당 의료시관 병상 수(개) 등* 제주특별자치도 내 의료기관의 병상 수 총합 및 이를 인구 1,000명당 기준으로 환산한 병상 수(의료기관 병상 밀도)를 연도별로 제공하는 자료입니다. 즉, 일정 인구 규모 대비 병상의 보유량이 어떻게 변화해왔는지를 보여주는 지표로, 의료 인프라의 양적 수준과 의료 접근성의 잠재적 기반을 나타내는 중요한 통계입니다.* 활용 분야 : 의료 시설 확충 및 병상 배치 전략, 보건의료 접근성 및 형평성 분석, 의료 정책 / 보건 예산 우선순위 설정 등- 데이터 제공처: KOSIS 국가통계포털'
