description_portal: '본 데이터는 본인부담상한제 적용 대상자에 대해 연도별 상한액 및 기준보험료 산정과 관련된 정보를 제공하는 자료입니다.본인부담상한제는 국민이 1년 동안 부담하는 건강보험 본인부담금의 총액이 소득수준에 따라 정해진 상한액을 초과할 경우, 그 초과액을 공단이 부담하여 환급하는 제도입니다.□ 데이터 개요o 대상: 본인부담상한제 환급 대상자o 내용: 본인부담상한제 대상자의 상한년도, 상한액, 직역구분, 산출건강보험료(기준보험료), 연도별 분위별 본인부담상한액 기준(첨부파일 참고)o 용도: 상한제 환급 기준 확인, 소득분위별 기준보험료 분석, 정책 기초자료 등'
