description_portal: '부산광역시 강서구청에서는 관내 장례식장에 대한 정보를 공공데이터로 제공합니다. 현재 강서구 내에는 **1개소의 장례식장(갑을녹산병원 장례식장)**이 등록되어 있습니다.해당 공공데이터는 다음과 같은 상세 정보를 포함하고 있습니다.업체명공사·설 구분 (공공시설 또는 민간시설 여부)대표자 성명도로명 주소연면적전화번호빈소 수안치 능력 (안치 가능한 시신 수)안치료 (시신 보관 요금)염습료 (시신 정리·세척 요금)빈소 임대료경도 / 위도 (위치 정보)추가 안내 사항이 데이터는 장례식장 이용 시 참고할 수 있는 다양한 정보를 포함하고 있어, 지역 주민과 관련 업계 종사자 모두에게 유용합니다.자세한 시설 정보는 공공데이터 포털에 등록된 파일 또는 링크를 통해 확인해 주세요.공공데이터 기준일자: 2025년 5월 20일담당 부서: 부산광역시 강서구청 복지교육국 생활지원과'
