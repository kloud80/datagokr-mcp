description_portal: '연제구 관내 피부과의원에 관한 데이터로서, 영업소 명칭, 소재지(도로명), 전화번호 등 정보가 제공되는 데이터 입니다.각 항목별 설명으로는 다음과 같습니다.- 명칭: 영업소 명칭을 나타냅니다- 소재지: 영업소 소재지(도로명)를 나타냅니다- 전화번호: 등록된 전화번호를 나타냅니다의료법 제33조(개설 등) ①의료인은 이 법에 따른 의료기관을 개설하지 아니하고는 의료업을 할 수 없으며, 다음 각 호의 어느 하나에 해당하는 경우 외에는 그 의료기관 내에서 의료업을 하여야 한다. 1. 「응급의료에 관한 법률」 제2조제1호에 따른 응급환자를 진료하는 경우2. 환자나 환자 보호자의 요청에 따라 진료하는 경우3. 국가나 지방자치단체의 장이 공익상 필요하다고 인정하여 요청하는 경우4. 보건복지부령으로 정하는 바에 따라 가정간호를 하는 경우5. 그 밖에 이 법 또는 다른 법령으로 특별히 정한 경우나 환자가 있는 현장에서 진료를 하여야 하는 부득이한 사유가 있는 경우②다음 각 호의 어느 하나에 해당하는 자가 아니면 의료기관을 개설할 수 없다. 이 경우 의사는 종합병원ㆍ병원ㆍ요양병원ㆍ정신병원 또는 의원을, 치과의사는 치과병원 또는 치과의원을, 한의사는 한방병원ㆍ요양병원 또는 한의원을, 조산사는 조산원만을 개설할 수 있다. 1. 의사, 치과의사, 한의사 또는 조산사2. 국가나 지방자치단체3. 의료업을 목적으로 설립된 법인(이하 “의료법인”이라 한다)4. 「민법」이나 특별법에 따라 설립된 비영리법인5. 「공공기관의 운영에 관한 법률」에 따른 준정부기관, 「지방의료원의 설립 및 운영에 관한 법률」에 따른 지방의료원, 「한국보훈복지의료공단법」에 따른 한국보훈복지의료공단③제2항에 따라 의원ㆍ치과의원ㆍ한의원 또는 조산원을 개설하려는 자는 보건복지부령으로 정하는 바에 따라 시장ㆍ군수ㆍ구청장에게 신고하여야 한다.'
