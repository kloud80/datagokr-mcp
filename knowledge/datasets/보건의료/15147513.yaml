summary_user: 서울특별시 동대문구 관내 약국을 한 곳씩 담은 인허가 원천 데이터로, 인허가일·취소일, 영업상태와 상세상태, 폐업일·휴업기간, 사업장명, 지번·도로명 주소와 우편번호, 전화번호, 좌표, 약국 영업면적 등을 담는다. 주민이 병의원이나 집 근처에서 영업 중인 약국과 연락처를 찾거나, 분석가가 약국 개폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 개방자치단체 코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드나 약국명·주소 매칭으로만 이을 수 있다.
description_portal: 해당 정보는 관내에서 운영 중인 약국 현황 정보를 제공합니다.해당 정보에는 약국명(기관명), 소재지 주소, 대표 전화번호 등이 포함되어 있으며, 주민 여러분께서 가까운 약국을 손쉽게 찾을 수 있도록 구성되어 있습니다.이를 통해 병의원 또는 자택 인근의 약국을 방문하여 전문의약품 또는 일반의약품을 편리하게 구매하실 수 있습니다.또한, 응급 상황 시 주변 약국 안내가 가능하여 위급한 상황에서도 빠르게 약국을 찾는 데에 도움이 됩니다.약국 정보를 확인 후에 약국에 방문할 경우, 방문하실 시간의 약국 운영 여부와 조제 가능 여부를 반드시 미리 전화로 확인하신 후 방문하여 주시기 바랍니다.이 데이터는 관내 주민의 의료 접근성 향상과 보건 서비스 이용 편의성 증진을 위한 목적으로 제공됩니다.
