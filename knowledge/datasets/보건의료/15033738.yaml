description_portal: '이 데이터는 질병관리청이 제공하는 신증후군출혈열의 지역별, 연도별 발생현황 자료입니다. 2006년부터 2017년 까지 법정감염병 3군에 속하는 설치류 매개 감염병인 신증후군출혈열의 연도별, 지역별(시군구), 발생 현황과 시군구별, 연령 및 성별 데이터를 담고 있습니다. 이는 유행성 출혈열의 지역별 발생 양상과 연도별 추이를 파악하는데 중요한 기초 자료로 활용됩니다. 이 자료는 공중보건 관리 정책을 수립하고, 설치류 매개 감염병의 위험 지역을 선정하는데 필수적인 정보를 제공합니다. * 2006년 ~ 2017년 기간 동안 법정감염병 중 3군에 속하는 설치류매개 감염병인 신증후군출혈열의 지역별/연도별 발생현황. (단위: 건)'
