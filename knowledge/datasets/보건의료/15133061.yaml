summary_user: 2017년 소아청소년 성장도표를 참고해 영유아 건강검진에서 성장 상태를 평가하는 기준값으로, 성장 항목(몸무게·키·머리둘레·체질량지수)·성별·개월수 구간별로 LMS 값(L, 중앙값 M, S)을 담은 전국 단위 기준표 파일(csv)이다. 아이의 키·몸무게 측정값을 같은 개월수·성별 기준에 대어 백분위나 표준점수를 계산하는 질문, 예컨대 '우리 아이 몸무게가 또래 중 어느 정도인가'를 따지는 보호자·검진기관·분석가가 쓴다. 전역 조인 키는 없고, 측정 자료의 성장 항목·성별·개월수(개월수구분코드, 시작·종료월)를 이 표의 코드에 맞춰 매핑해 붙여 쓴다.
description_portal: '이 데이터는 2017년 개정된 소아청소년 성장도표를 참고하여, 영유아 건강검진 시 연령별·성별 성장 상태를 평가하기 위한 기준값을 수록한 자료입니다. □ 개방 데이터 설명   o 내용: 2017년 소아청소년성장도표 참고 영유아건강검진 연령별‧성별 성장도표 작성위한 기준값□ 컬럼명, 세부설명 및 코드값  - 영유아성장종류코드:  01 몸무게; 02 키; 03 머리둘레; 04 체질량지수  - 성별코드:  1 남아; 2 여아  - 개월수구분코드:  00 00개월; 01 1개월; 02 2개월; 03 3개월; …    - 영유아성장도표L값  - 영유아성장도표M값: 각 성장도표 중앙값  - 영유아성장도표S값'
