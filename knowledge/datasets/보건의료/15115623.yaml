summary_user: 서울특별시 강서구 안의 의료법인(병원·의료재단 등) 인허가를 사업장 한 곳당 한 행으로 담는 LOCALDATA 형식 원천 데이터다. 인허가일자, 영업상태(영업·폐업), 폐업일자, 사업장명, 주소, 좌표, 병상·의료인 수 같은 항목이 들어 있다. 분석가나 구청 담당자가 '강서구에서 최근 개업하거나 폐업한 병원은 어디인가'를 확인하고, 병의원 개폐업을 상권 신호로 읽는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)·관리번호로 이어 붙인다.
description_portal: 서울특별시 강서구 내 의료법인의 인허가 현황을 제공하는 데이터입니다. 주요 항목으로는 인허가일자, 영업상태, 사업장명, 전화번호, 주소 등이 포함되어 있으며, 해당 법인은 병원,  의료재단 등의 형태로 운영됩니다. 이 데이터는 강서구 지역 내 보건의료 서비스 제공 기반을 파악하거나, 의료법인의 설립 및 운영 현황을 분석하는 데 활용됩니다. 또한 공공보건정책 수립, 의료기관 분포도 시각화, 의료서비스 접근성 분석, 비영리 의료기관 운영 실태 모니터링 등 다양한 행정 및 연구 목적으로 유용합니다. 향후 보건 인프라 확충이나 지역 맞춤형 의료 서비스 개발에도 참고자료로 활용될 수 있는 중요한 데이터입니다.
