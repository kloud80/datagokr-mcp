description_portal: 서울특별시 서초구 보건소 자율점검 대상 의료업소와 약업소 현황으로  업종명, 기관명, 도로명주소관련정보를 2024년 8월에 정리한 데이터를 제공합니다.자율점검 대상 의약업소는 관할 보건소별로 상이할 수 있으나, 일반적으로 병·의원, 약국, 의약품 도매상, 안전상비의약품 판매자, 의약품및 의료기기 판매(임대)업소, 의료기기업소, 안경업소, 치과기공소, 안전상비의약품 판매점, 동물병원 등이 포함됩니다. 매년 3~4월경, 약 1~2달간 온라인 또는 서면으로 진행되며, 관리책임자가 직접 법령 준수사항을 점검합니다.
