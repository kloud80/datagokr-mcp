description_portal: '○ 통계개요* 통계명 : 식중독 발생 현황* 통계종류 : 서울시 식중독 발생 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 식중독 발생 원인과 발생 시설에 대한 통계를 파악하여 식중독 관련분야의 식중독예방,식중독안전관리, 교육 및 홍보, 식중독 조기경보 등의 기초자료로 활용하고자 함* 조사체계 : 식중독 환자 또는 의사(한의사), 집단급식소 설치·운영자 → 시·군·구 → 식품의약품안전처* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 원인시설별 식중독 발생건수 및 환자수 현황○ 용어설명* 식중독 : 식품의 섭취로 인하여 인체에 유해한 미생물 또는 유독 물질에 의하여발생하였거나 발생한 것으로 판단되는 감염성 또는 독소형 질환을 말함(식품위생법 제2조제14항)* 집단식중독 : 역학적 조사 결과 식품 또는 물이 질병의 원인으로 확인된 경우로서동일한 식품이나 동일한 공급원의 물을 섭취한 후 2인 이상의 사람이유사한 질병을 경험한 사건○ 기 타* 집단급식소 중 학교는 직영, 위탁 포함* 식중독 발생신고건수 및 환자수는 집단식중독(동일한 식품의 섭취로 인하여2인 이상의 사람이 유사한 질병을 경험한 사건) 사고에 대한 통계자료임* 식중독발생 통계는 최종역학조사결과에 따라 변동될 수 있음* 신고건수및 환자수가 "0"에 가까울수록 집단식중독 발생이 적다는것을 의미'
