description_portal: '강원특별자치도 강릉시 보건지소(진료소)별 의약품 사용 통계강원특별자치도 강릉시의 보건의료 현황을 파악할 수 있는 핵심 데이터, 의약품 사용 통계정보를 개방합니다.1. 데이터 소개본 자료는 2020년부터 2024년까지의 정보공개청구 빅데이터를 분석하여, 시민들이 가장 빈번하게 요청한 의약품 통계정보를 선제적으로 제공하기 위해 사전 공표하는 공공데이터입니다.2. 데이터 활용 방안이 데이터를 통해 특정 기간 및 보건지소의 의약품 사용 패턴을 분석할 수 있으며, 지역 보건 정책 수립, 관련 연구, 공중 보건 모니터링 등의 기초 자료로 활용하여 시민의 삶에 기여하는 다양한 가치를 창출할 수 있습니다.3. 포함된 데이터 항목의약품 정보: 제약회사명, 업무명, 약품코드, 약품명사용량 정보: 외래원내, 외래원외, 입원원내, 입원원외, 합계비용 정보: 단가, 총액, 보험단가, 보험총액기관 정보: 보건지소(진료소), 기준일자'
