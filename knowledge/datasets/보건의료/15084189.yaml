description_portal: 성남시 특수의료장비 현황 데이터에는 의료장비명, 장치모델명, 장비용도,  의료기관명 등의 내용이 공개되고 있습니다.경기도 성남시는 분당구, 수정구, 중원구를 중심으로 고도화된 의료 인프라가 집중된 지역으로, 대형 종합병원과 전문병원들이 다수 입지하고 있습니다. 이에 따라 MRI, CT, PET-CT, 초음파 진단기, 혈관조영기, 내시경 등 특수의료장비의 보유 수준도 전국 평균 대비 높은 편에 속합니다. 지역 내 중소 병원 및 의원급 기관에서도 의료영상진단장비를 꾸준히 확충해 오고 있습니다.  성남시는 또한 성남시의료원을 중심으로 공공의료 영역에서도 특수의료장비 확충에 투자하고 있습니다.
