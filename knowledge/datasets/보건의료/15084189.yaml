summary_user: 성남시 의료기관이 보유한 특수의료장비(MRI·CT 등)를 장비 한 대 단위로 담은 파일로, 장비명·모델명·용도와 보유 의료기관명, 구별 구분, 공동활용 여부·병상수, 도로명·지번 주소를 함께 담는다. 분석가나 시민이 '분당구에서 MRI를 보유한 병원은 어디이고 공동활용하는 곳은 몇 곳인가' 같은 지역 의료장비 분포 질문에 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 데이터와는 의료기관명이나 소재지 주소를 맞춰 이어 쓴다.
