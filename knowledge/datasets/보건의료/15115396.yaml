summary_user: 서울특별시 중랑구의 안경업소(시력 교정, 안경 판매·수리 업소) 인허가 내역을 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·좌표와 시력검사기·렌즈절단기 같은 시설 장비 수를 포함한다. 중랑구에서 지금 영업 중인 안경점이 어디인지, 최근 어느 동네에서 안경점이 새로 문을 열거나 닫았는지를 보려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에는 전국 공통 조인 키가 없어서, 다른 구의 안경업 인허가나 다른 LOCALDATA 업종과는 개방자치단체코드(OPNSFTEAMCODE)·관리번호·주소를 맞춰 이어 쓴다.
description_portal: '서울특별시 중랑구의 눈을 보호하거나 시력의 교정을 요하는 대상에게 시력의 교정 및 안경을 판매 또는 수리하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 사업자명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
