summary_user: 국민건강보험공단이 보험급여 대상으로 고시한 장애인보조기기(전동휠체어·의료용스쿠터 등 전동보조기기, 보청기, 자세보조용구, 욕창예방방석·매트리스) 제품을 모델 단위로 한 행씩 담은 전국 단위 목록 파일로, 품목명·모델명·보청기 종류와 방식·고시금액·등록일자를 포함한다. 장애인보조기기 급여 대상자나 보호자, 판매업체가 '이 보청기 모델이 건강보험 급여 고시 제품인지, 고시금액은 얼마인지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 품목명·모델명 같은 이름 매핑이나 공단 내부 관리번호(통합품목관리번호)로만 연결한다.
description_portal: '본 데이터는 국민건강보험공단에서 보험급여 대상으로 고시한 장애인보조기기 제품 목록으로, 전동보조기기, 보청기, 자세보조용구 등 일상생활에서 이동 및 신체기능 보조가 필요한 대상자에게 제공되는 보조기기 정보를 포함하고 있습니다.□ 장애인보조기기(보청기 포함) 고시제품 목록 안내   o 내용: 전동보조기기(전동휠체어, 의료용스쿠터, 이동식전동리프트), 보청기, 자세보조용구, 욕창에방방석, 욕창예방매트리스   o 대상: 건강보험 가입자 및 피부양자 중 장애인보조기기 급여 대상자로 인정된 자   o 근거: 「국민건강보험법 시행규칙」 제26조 및 별표 7에 따른 장애인보조기기에 대한 보험급여의 기준 및 방법 등에 관한 사항※ 제품 등록 또는 급여기준 문의는 국민건강보험공단 고객센터(☎1577-1000)로 문의해 주세요.'
