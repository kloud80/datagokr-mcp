summary_user: 경기도 김포시 안의 보건소·보건지소·진료소를 시설 한 곳당 한 행으로 담은 목록으로, 구분·시설명·도로명/지번 주소·상세위치·전화번호를 담는다(csv 약 2KB 규모의 소량 파일). 김포 주민이 가까운 보건지소나 진료소의 위치와 전화번호를 찾거나, 분석가가 시군구 단위 공공보건 시설 분포를 지도에 올릴 때 쓴다. 실측 컬럼에 전역 조인 키(보건소코드·시군구코드 등)가 없어, 다른 데이터와는 주소나 시설명을 맞춰 붙이거나 같은 기관(김포시) 기준으로만 연결한다.
description_portal: 경기도 김포시의 보건소, 보건지소 및 진료소에 대한 정보를 제공합니다. 제공 항목으로는 구분, 시설명, 소재지주소, 상세위치, 전화번호, 데이터기준일자로 구성되어있으며 주소는 지번과 도로명의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 데이터를 통해 김포시 내 보건소의 위치와 연락처 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 보건행정과로 연락주시기 바랍니다.
