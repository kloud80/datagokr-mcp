description_portal: '○ 통계개요* 통계명 : 일반건강검진 판정 현황* 통계종류 : 보고통계, 일반통계* 작성목적 : 보건의료 및 건강보험 정책수립의 기초자료로서, 건강검진 사후관리,질병예방 등 지역보건의료 향상을 위한 국가 정책 방향 제시* 조사체계 : 건강검진기관 및 공단 지사 → 국민건강보험공단*작성기준 : 건강보험대상자 중 당해년도 일반건강검진 대상자 및 건강검진 수검자 대상* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 일반건강검진 판정결과 정상, 질환의심, 유질환자 등○ 용어설명* 수검인원 : 일반건강검진을 받은 전체 수검인원 수* 정상A : 검진 결과 건강이 양호한 자* 정상B(경계) : 검진 결과 건강에 이상이 없으나 식생활습관, 환경개선 등자기관리 및 예방조치가 필요한 자* 질환의심 실인원 : 유질환자 판정자를 제외하고 순수 질환의심으로 판정받은 자* 일반 질환의심 : 검진 결과 질환으로 발전할 가능성이 있어 추적 검사나 전문 의료기관을통한 정확한 진단과 치료가 필요한 자* 고혈압.당뇨병 질환의심?: 검진 결과 고혈압, 당뇨병이 의심되어 치료와 관리가 필요한 자* 유질환자 : 고혈압, 당뇨병, 이상지질혈증, 폐결핵으로 판정받고 현재 약물 치료를 받고 있는 자○ 기 타* 주민등록주소지 기준* 수검인원은 정상A, 정상B, 질환의심 실인원, 유질환자의 합을 의미함* 질환의심의 실인원은 일반질환의심과 고혈압, 당뇨병 질환의심 간 중복이 제외된 수치임'
