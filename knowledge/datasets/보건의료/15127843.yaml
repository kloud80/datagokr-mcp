description_portal: '보건복지부에서 2007년~2024년까지 급여 종류별 건강보험료 보험급여 실적에 대한 정보를 제공하고 있습니다.<데이터 이용 시 참고사항>단위 : 건, 천 원1. 요양비_건수, 요양비_금액, 본인부담액 보상금_건수, 본인부담금액, 장애인 보조기기_건수, 장애인 보조기기_금액, 본인부담상한액 초과 사후 환급금_건수, 환급금액, 임신출산 진료비_금액 항목은 현금급여 임을 알려드립니다.2. 본인부담액 항목 : 본인부담액 중 보상금 금액을 의미함3. 환급금액 항목 : 본인부담상한액 초과금 중 사후 환급금 금액을 의미함4. 2023년도 건강보험통계연보 공표 전 작성된 데이터로, 향후 공표되는 값과 차이 있을 수 있음5. 지급일 기준, 출산비는 요양비에 포함6. 계수 단위미만 수는 반올림, 내용과 총수가 일치하지 않을수 있음7. 본인부담액상한제는 2004.7.1. 신설, 사전지급은 요양급여비에 포함, 사후환급은 현금급여로 구분8. 임신･출산 진료비는 2008.12.15. 신설(예탁금 형식으로 지급건수 산출불가)9. 급여실적 통계는 요양기관에서 청구한 진료비를 공단에서 지급한 월 기준10. 보험급여비는 건강보험 가입자의 진료에 소요된 총진료비 중 공단 부담 금액 지급기준'
