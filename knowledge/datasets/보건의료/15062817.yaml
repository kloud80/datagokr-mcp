summary_user: 경상북도 내 종합병원을 기관 한 곳당 한 행으로 담은 현황 파일로, 시군명·허가일자·의료기관명·종류(종합병원으로 한정)·주소·전화번호·병상수를 기록한다(CSV 약 2KB 규모). 주민이나 정책 분석가가 '우리 시군에 종합병원이 몇 곳 있고 병상 규모는 어느 정도인가'처럼 시군별 중증 진료 인프라 분포와 접근성을 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명이나 의료기관명·주소를 이름 매칭하는 방식으로만 이어 쓸 수 있으며, 의료기관 인허가(LOCALDATA) 자료와 대조할 때도 마찬가지다.
description_portal: 본 데이터는 병원, 그중에서도 종합병원의 현황에 대한 상세 정보를 제공합니다. 이는 경상북도 내에서 지역 주민에게 고도의 의료 서비스를 제공하고, 중증 환자 진료 및 보건 인프라의 핵심 기능을 담당하는 종합병원의 운영 실태 및 규모를 파악하는 데 목적이 있습니다.주요 내용으로는 종합병원이 위치한 행정 구역을 나타내는 시군명 정보와, 해당 시설이 공식적으로 설립을 허가받은 일자 정보가 포함됩니다. 시설의 공식 명칭인 의료기관명과 시설의 구분인 종류(*본 데이터는 종합병원으로 한정됨)가 기록되어 있습니다. 이용자의 접근성을 위한 주소 및 문의를 위한 전화번호 정보도 상세히 제공됩니다.특히, 시설의 의료 서비스 제공 역량과 규모를 정량적으로 파악할 수 있도록 병상수 정보가 포함됩니다. 이 자료는 지역별 의료 인프라 분포 분석, 공공 보건 의료 정책 수립, 응급 의료 체계 구축 및 의료 서비스 접근성 평가 등에 귀중한 기초 자료로 활용됩니다.
