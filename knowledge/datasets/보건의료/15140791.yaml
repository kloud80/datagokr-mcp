summary_user: 은평구 내 건강기능식품 일반판매업소(유통전문판매업 제외)의 인허가 정보를 업소 한 곳당 한 건으로 담으며, 업소명·지번/도로명 주소·인허가일자·영업상태·폐업일자·중부원점TM 좌표(X, Y) 등이 들어 있다. 소비자나 창업자가 '우리 동네에서 건강기능식품을 파는 곳이 어디이고 지금도 영업 중인가'를 확인하거나, 분석가가 업소의 개업·폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드로만 이어 쓴다.
description_portal: '은평구의 건강기능식품을 판매하는 업소정보(건강기능식품유통전문판매업에 해당되는 업소 제외)* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.은평구 내 건강기능식품 일반판매업체에 대한 인허가 정보를 담고 있으며, 약국, 마트, 편의점, 건강식품 전문매장 등에서 기능성 제품을 소매하는 업소의 명칭, 주소, 등록일자 등이 포함됩니다. 일반판매업은 대중이 일상적으로 건강기능식품을 접하는 주요 유통 경로로, 소비자 접근성과 구매 편의성을 높이는 역할을 수행합니다. 그러나 동시에 허위 표시·광고, 부적합 제품 유통, 유사 건강제품 혼동 등 소비자 피해 발생 가능성도 존재하며, 이에 대한 감시 체계가 중요합니다. 이 데이터는 안전 유통망 구축, 위생 점검, 영업자 교육 등 공공보건 정책과 연계되어 활용되며, 특정 성분별 소비 패턴 분석, 민원 분포 모니터링, 지역별 취약 유통업소 대응 등에도 사용될 수 있습니다. 또한 고령층, 만성질환자, 어린이 등 특정 계층을 대상으로 한 맞춤형 식품 안전관리 정책 수립에도 중요한 기초 자료가 됩니다.'
