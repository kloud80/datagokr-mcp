description_portal: '전북특별자치도 순창군 정신건강 의료기관 현황 공공데이터는 군민들의 건강과 의료 접근성을 높이기 위해 군에 등록된  정신건강관련 병의원 및 요양병원 현황 정보를 담고 있습니다. 이 데이터는 명칭, 주소, 전화번호 등이 포함된 데이터이며 정부는 지역별 의료 서비스의 분포와 의료 자원 현황을 파악하여 보건 정책을 수립하는 데 활용합니다.본 데이터는 정신건강 의료서비스 취약 지역 분석 : 소재지와 진료과목 데이터를 인구 통계 데이터와 결합하여, 병상 수가 부족한 지역을 찾아낼 수 있습니다.이를 통해 정부는 보건 정책을 수립하고, 병원 설립을 유도하는 데 활용할 수 있습니다. 해당 데이터는 공공데이터포털에 공개되어 누구나 확인할 수 있습니다.'
