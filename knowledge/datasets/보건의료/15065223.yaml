description_portal: 뇌사 장기기증 통계는 한국장기조직기증원과 전국의 관리병원으로부터 수집된 데이터를 기반으로 산출된 자료이다. 해당 통계는 2015년 1월부터 월 단위로 집계되고 있으며, ‘뇌사기증관리’ 횟수와 ‘뇌사장기기증자’ 수라는 두 가지 주요 항목으로 구성되어 있다.‘뇌사기증관리’는 장기기증이 이루어지기까지의 사전 절차를 반영한 지표로, 뇌사추정자에 대한 통보를 받은 이후 가족 등으로부터 장기기증에 대한 동의를 얻고, 1차 뇌사조사를 완료하여 실제 기증관리 단계로 진입한 건수를 의미한다. 이는 실제 이식이 이루어지기 전 단계까지의 관리 활동을 수치화한 것으로, 장기기증을 위한 준비가 어느 정도 이루어졌는지를 보여주는 중요한 지표라 할 수 있다.‘뇌사장기기증’은 실제로 장기를 구득하고, 그 장기를 최소 한 명 이상의 수혜자에게 이식한 사례를 기준으로 집계한 수치이다. 이 수치는 실질적인 장기이식 성과를 나타내는 수치로, 뇌사기증관리 단계에서 최종적으로 기증이 완료된 경우에 해당한다.이처럼 뇌사기증관리와 뇌사장기기증은 각각 장기기증 과정의 준비단계와 실행단계를 나타내며, 두 항목 모두 뇌사장기기증 활성화의 수준과 흐름을 파악하는 데 중요한 자료로 활용된다.
