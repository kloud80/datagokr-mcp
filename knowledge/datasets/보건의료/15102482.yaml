summary_user: 2018~2021년 특정 행위코드분류별로 연도별 진료인원을 집계한 전국 단위 파일로, 건강보험 급여실적 기준(의료급여·비급여·한의·약국 제외)이며 연도별 수가코드 중복을 제외한 실제 진료인원과 연말기준 연령을 담는다. 분석가나 연구자가 특정 시술·처치를 받은 환자 수가 2018년부터 2021년까지 어떻게 변했는지 확인하는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행위분류 이름 매핑이나 같은 기관(국민건강보험공단) 통계와의 대조로만 이어 쓴다.
description_portal: 2018년~2021년 특정 행위코드분류별 진료 인원 현황(1. 수진기준(한의분류 제외, 약국 제외) 연령(연말기준)2. 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외...2022년6월 지급분까지 반영* 연도별 수가코드 중복을 제외한 실제 진료인원이며, 개별 환자별 입원 일수는 부존재정보 - "*" 는 5이하의 값으로 개인정보보호를 위하여 "*" 처리함
