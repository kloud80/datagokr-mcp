summary_user: 의원급 의료기관의 건강보험 진료비를 진료년도·시도·표시과목별로 묶어 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액을 담은 전국 집계 통계 파일(약 25KB CSV)이다. 분석가나 개원 준비자가 '우리 시도에서 어떤 진료과 의원의 건강보험 진료비와 환자수가 많은가'를 비교하는 데 쓴다. 기관 코드(ykiho) 같은 전역 조인 키가 없어 다른 데이터와는 시도명·표시과목명·진료년도를 이름으로 맞춰 이어 쓴다.
description_portal: '의원급 의료기관의 표시과목별 전국(시도별) 건강보험 진료비 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2025년 1월~12월, 심사년월: 2025년 1월~2026년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
