summary_user: "5단 상병코드(주상병) × 성별 × 연령군 × 진료년도 단위로 건강보험 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액을 담은 전국 집계 통계로, 약국을 제외한 양방 요양기관 청구를 심사 결정한 내용을 기준으로 한다. 분석가나 연구자가 '특정 질병(예: 당뇨)의 연령대·성별 환자수와 진료비가 해마다 어떻게 달라지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 주상병코드를 KCD 질병분류 코드표와 맞추거나 같은 기관의 다른 진료 통계와 상병코드·연령군·성별 이름으로 맞춰 이어 쓴다."
limits: 전국 단위 집계라 지역별 분석은 할 수 없고, 질병은 청구 시 부여된 주상병 기준이라 최종 확정 진단과 다를 수 있다. 환자수는 범주 안에서만 중복을 제거한 값이라 여러 범주를 단순 합산하면 중복이 생긴다. 심평원 청구 기준 값이므로 공단의 자격 기준 통계와 수치가 다르다.
