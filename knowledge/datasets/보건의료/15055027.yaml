description_portal: 본 데이터는 외국어 진료 가능 의료기관 안내를 위한 상담기관 현황을 제공한다. 다양한 외국어 사용자의 의사소통 어려움을 해결하기 위한 전문 상담 정보를 포함한다. 상담기관명, 소재지, 연락처, 지원언어, 상담서비스 내용 등의 항목을 수록한다. 외국인 환자가 건강상담 시 언어 장벽으로 정확한 증상 전달이 어려운 경우가 많다. 전문 상담기관은 다국어 통역과 동행 서비스를 제공하여 내담자의 건강상태를 파악하고 적절한 진료 가능 인근 의료기관을 안내한다. 지원 언어는 중국어, 베트남어 등 다양한 국가 언어를 포함한다. 본 데이터로 외국인의 의료 접근성을 높이고 원활한 진료 연계를 지원할 수 있으며, 다문화 사회 보건의료 서비스 향상 기초 자료로 활용된다.
