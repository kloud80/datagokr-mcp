summary_user: 울산광역시에서 외국어 진료가 가능한 병원을 안내하는 상담기관의 기관명·소재지·전화번호·홈페이지를 기관 1곳당 1행으로 담은 소규모 CSV 파일(1,682바이트)입니다. 울산에 사는 외국인이나 이들을 돕는 다문화 지원 담당자가 '병원 진료 때 통역이나 동행을 도와줄 상담기관이 어디에 있고 연락처가 무엇인가'를 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 의료기관 데이터와는 기관명이나 주소(소재지)를 직접 맞춰야만 이어 쓸 수 있습니다.
