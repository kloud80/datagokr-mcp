summary_user: 충청북도 진천군 관내에 설치된 자동심장충격기(AED)를 설치기관 단위로 한 줄씩 담은 파일로, 설치기관명·주소·연락처가 들어 있다(CSV 약 18KB). 주민이나 응급대응 담당자가 '우리 동네 어느 기관에 AED가 있고 연락은 어디로 하나'를 확인하거나, 분석가가 진천군 AED 접근성 지도를 만드는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 설치기관 주소를 지오코딩하거나 기관명을 맞춰 보는 방식으로만 잇는다.
description_portal: 이 데이터는 충청북도 진천군 관내에 설치된 자동심장충격기(AED)의 설치 현황을 제공합니다.응급상황 발생 시 심정지 환자의 생존율을 높이기 위한 공공응급장비로, 설치기관의 명칭, 도로명 주소, 지번주소, 유선 연락처 등의 정보를 포함합니다.해당 데이터는 지역 내 응급의료 대응 인프라 현황 파악, AED 접근성 지도 구축, 위급 상황 대응 체계 강화, 생존률 제고를 위한 정책 수립, 지역사회 보건안전망 강화 등 다양한 활용 가치를 갖습니다.또한 보건소, 소방서, 응급의료기관, 공공기관 등과 연계한 응급대응계획 수립에 기초 자료로 활용될 수 있습니다.
