description_portal: 경기도 부천시 관내의 소독업체에 대한 정보로 소독관련 소독업소명칭, 업체소재지(도로명,지번), 우편번호 등의 정보를 제공합니다.소독의무대상시설은 보건소에 신고한 소독업체를 통해 법에 명시된 소독횟수를 준수하여 전문적인 교육을 수료하고 장비를 갖춘 업체를 통해 소독을 진행해야합니다. 부천시 관내 소독의무대상시설에는 숙박업소, 식품접객업소, 위타급식업소, 교통시설, 유통시설, 학교, 학원, 보육시설, 공동주택, 공연장, 병원, 연면적 2000제곱미터 이상의 복합건축물 등 약 2000개소입니다. 소독의무대상시설들은 부천시가 제공하는 소독업소목록을 참고하여 소독을 맡기고 진행해야합니다.
