summary_user: 병원급 이상 의료기관(약국 제외)의 건강보험 심사결정 명세서를 진료년도·진료과목·행위코드별로 집계해 환자수, 명세서 청구건수, 총사용량, 진료행위 청구금액을 담은 전국 단위 통계 파일이다. 보건의료 분석가나 정책 담당자가 '특정 진료과에서 어떤 의료행위가 몇 명에게 얼마의 금액으로 청구됐는가'를 연도별로 비교하는 데 쓴다. 전역 조인 키는 없어 요양기관 단위 자료(ykiho)와는 직접 연결되지 않고, 행위코드를 급여 행위 코드표와 이름·코드로 맞추거나 진료과목명으로 다른 진료과별 통계와 이어 쓴다.
description_portal: '병원급 이상 의료기관의 진료과목별 행위 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2022년 1월~12월, 심사년월: 2022년 1월~2023년 4월 / 보험자: 건강보험 / 약국 제외※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
