summary_user: 대구광역시 서구보건소에서 발급하는 제증명 서류를 종류별 한 행으로 정리한 안내용 소규모 파일(csv 566바이트)로, 서류 이름·처리기간·수수료(원)·준비물·검사절차를 담는다. 서구 주민이나 위생분야 종사자·구직자가 '보건소에서 건강진단 결과서(구 보건증)나 채용 건강진단서를 받으려면 무엇을 챙기고 비용과 기간은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 서류 이름 매칭이나 같은 기관(대구 서구) 기준으로만 이어 쓸 수 있다.
description_portal: 대구광역시 서구보건소의 제증명서류들에 대한 데이터를 포함하고 있습니다. 발급가능한 서류들, 처리기간, 수수료, 준비물, 절차 등의 정보를 포함하고 있습니다.본 데이터는 대구광역시 서구청에서 제공하는 서구보건소의 제증명 발급 관련 정보를 포함한다. 각종 증명서의 종류별 이름, 처리 기간, 수수료, 준비물 및 검사 절차를 상세히 기록하였다. 예를 들어, 위생분야 종사자 건강진단 결과서, 채용 건강진단서, 운전면허 적성검사, 의약업소 폐업 확인서 등 다양한 증명서 발급과 관련된 민원 절차가 포함되어 있다. 처리 기간은 즉시부터 최대 7일(공휴일 제외)까지 다양하며, 수수료 또한 증명서 종류에 따라 차이가 있다. 준비물로는 신분증, 사진, 운전면허증 등이 요구되며, 민원실 접수부터 방사선실, 검사실, 사무실 등 발급 절차가 구체적으로 안내되어 있다. 이 데이터는 주민들이 보건소 제증명 발급 절차를 쉽고 정확하게 이해하고 신속히 이용할 수 있도록 돕는다.
