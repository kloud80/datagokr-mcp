summary_user: 완주군 관내 의료기관을 한 행씩 담은 기관별 원천 목록으로, 기관명·종별·진료과목·인허가일자·개설년도·도로명 주소·전화번호·병상 수·병실 수·기준일자를 담는다(파일 크기 약 1.7KB의 작은 CSV). 완주군 주민이 '우리 동네에 어떤 진료과목의 병의원이 있고 입원 병상은 몇 개인가'를 확인하거나, 분석가가 병의원 개설 시기를 지역 상권 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 붙여야 하며, LOCALDATA 병원·의원 인허가 데이터나 심평원 병원정보와 이렇게 대조해 쓴다.
limits: 기관 코드 같은 공통 식별자가 없어 다른 의료기관 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 완주군 한 곳뿐이어서 다른 시군과 비교하려면 별도 데이터가 필요하다.
