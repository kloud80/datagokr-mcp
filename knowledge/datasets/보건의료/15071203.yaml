summary_user: 서울특별시 용산구 안의 의료기기판매업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 주소·전화번호를 담는다. 시민이나 분석가가 '용산구 우리 동네 근처에 의료기기를 파는 곳이 어디 있고 연락처는 무엇인가'를 찾거나, 구 안의 업소 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 업소명을 맞춰 보는 방식으로만 이어 쓰며, 식약처 품목허가·약가 데이터와는 직접 연결되지 않는다.
description_portal: 서울시 용산구에서 운영 중인 의료기기판매업에 대한 정보는 「서울시 용산구 의료기기판매업 인허가 정보」 공공데이터를 통해 제공되며, 이 데이터는 매일 갱신됩니다. 주요 항목으로는 업소의 상호, 소재지 정보(도로명 주소), 전화번호 등이 포함되어 있습니다.이 공공데이터는 인허가 및 영업 상태 변동을 반영하며, 연락처(사업장 전화번호), 정확한 주소 정보, 사업장명 등이 포함되어, 용산구 내 의료기기판매업의 운영 현황을 실시간에 가깝게 추적할 수 있는 매우 유용한 자료입니다. 연구, 행정 업무, 시민 건강 접근성 분석 등 다양한 목적으로 활용 가능합니다.
