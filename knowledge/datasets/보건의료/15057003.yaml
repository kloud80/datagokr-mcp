summary_user: 경기도 내 의료급여 정신과 진료에 대한 병원 평가 결과를 의료기관 한 곳당 한 행으로 담고, 기관명·시군명·평가등급·지번/도로명 주소·우편번호·WGS84 좌표를 제공한다. 의료급여 수급자나 보호자가 '우리 시군에서 정신과 의료급여 평가등급이 높은 병원은 어디인가'를 찾거나, 분석가가 시군별 정신과 진료 질의 편차를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)·시군명, 기관명·주소 매칭, 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 의료급여 정신과 진료에 대한 병원 평가 결과를 담고 있으며, 각 기관의 명칭, 시군명, 평가등급, 주소 및 좌표(WGS84 기준) 등의 정보를 제공합니다. 평가 등급은 진료의 질과 적정성 기준에 따라 분류되어 있으며, 정신건강 분야의 공공의료서비스 질적 평가 및 기관별 진료역량 분석에 활용됩니다. 이 데이터는 정신질환자 대상 의료서비스의 접근성 평가, 의료급여 대상자의 진료 편차 분석, 공공의료 정책 수립, 정신보건 인프라 개선, 지역별 정신건강 격차 해소 등의 목적에 유용하게 활용될 수 있습니다.
