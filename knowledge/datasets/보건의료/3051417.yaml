summary_user: '국민건강보험공단이 복지용구 급여제도에 따라 등록한 복지용구 제품을 한 행에 한 제품씩 담은 전국 단위 목록 파일(CSV 약 54KB)로, 품목명·제품명·제품코드와 판매금액·대여금액, 업체명, 제조구분, 제공방식(구매·대여)을 담는다. 장기요양 수급자나 가족, 복지용구 사업소가 특정 품목(예: 휠체어·전동침대)에서 어떤 제품이 등록돼 있고 구매가와 대여가가 각각 얼마인지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제품코드·업체명·품목명 같은 이름·코드 매핑이나 같은 공단 자료의 코드로만 연결한다.'
description_portal: '□ 데이터 개요복지용구 급여제도에 따라 등록된 복지용구 제품의 정보를 항목별로 정리한 자료입니다. 본 데이터는 국민건강보험공단에서 관리하는 복지용구 품목별 등록제품의 세부 정보를 제공하며, 각 제품의 제공방식 및 가격, 제조·판매 업체명 등을 포함하고 있습니다.□ 주요 제공 항목품목명: 해당 복지용구가 분류되는 품목군 이름제품명: 제품의 상표명 또는 모델명제품코드: 복지용구 급여 등록 시 부여된 제품별 고유코드제공방식: 구매, 대여 등 제공 유형제공가격: 복지용구 급여 기준에 따라 정해진 제품 제공가격업체명: 해당 제품을 공급하는 업체(제조사 또는 판매사)'
