summary_user: 울산광역시 울주군에 있는 한의원을 한 곳당 한 행으로 담은 현황 파일로, 의료기관명·전화번호·소재지·진료과목과 요일별·공휴일 진료시간을 담는다(CSV 약 10KB). 주민이 울주군 안에서 토요일이나 공휴일에 문을 여는 한의원을 찾거나, 분석가가 군 단위 한방 의료기관 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 자료와는 의료기관명·소재지 주소를 맞춰 연결해야 한다.
