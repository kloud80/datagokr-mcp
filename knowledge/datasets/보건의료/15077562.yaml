description_portal: 대전광역시 의약품 특사경 지명 분야 ’21년 세부 추진 계획은 지역 내 의약품의 불법 조제, 불법 관리 및 불법 판매 행위를 엄격히 단속하여 시민의 건강권과 안전한 생활환경 보장을 목표로 합니다. 본 계획은 약국과 의약품 취급 업소 등을 대상으로 한 집중 점검 및 단속 활동, 안전 유통 체계 구축, 의약품 관리 실태 조사 등의 내용을 포함합니다. 연도 별 운영되는 세부 추진 일정에는 불법 행위 유형 별 선별 단속 및 관련 법령 위반 사례 관리, 부적합 의약품 회수 방안과 시민 신고·제보 체계가 반영되어 실효성 있는 실행이 이루어집니다. 또한, 관련 기관 간 협업 체계 마련, 약사법 준수 여부 점검 및 약국 종사자 교육 등 다양한 실행 방안이 포함되어 의약품 안전 관리 강화에 기여합니다.
