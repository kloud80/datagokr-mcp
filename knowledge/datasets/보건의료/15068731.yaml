description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.보건소 모바일 헬스케어 모바일 앱과 연동되는 활동량계를 통하여 수집되는 심박수 데이터로 심박측정일시, 심박층정, 최고심박, 최저심박, 심박수(배열) 정보를 제공합니다.
