summary_user: 대구광역시 서구 관내에 등록된 의료기기 판매업소와 수리업소를 업소 한 곳당 한 행으로 담은 파일로, 업종 구분·업소명·도로명 소재지·전화번호가 들어 있으며 편의점 같은 생활밀착형 판매처도 포함된다. 서구 주민이나 사업자가 '우리 동네에서 혈압계·체온계 같은 의료기기를 사거나 수리를 맡길 곳이 어디인가'를 찾을 때, 분석가가 관내 의료기기 취급 업소의 분포와 접근성을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 붙이거나 같은 기관의 다른 현황 파일과 나란히 놓고 써야 한다.
limits: 서구 한 개 시군구만 다루므로 대구 전체나 다른 지역과 비교하려면 구·군별 파일을 따로 모아야 한다. 식약처 품목기준코드나 업소 허가번호 같은 공통 코드가 없어서 의료기기 품목허가나 약가·급여 데이터와 키로 직접 잇지 못하고, 주소·이름 매칭에 기대야 한다.
