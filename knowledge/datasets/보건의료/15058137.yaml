description_portal: 식품의약품안전처 「FDA Paragraph IV 대상 의약품 특허 정보」 OpenAPI는 미국 FDA에 Paragraph IV 특허 인증을 제출한 의약품의 정보를 제공하는 공공데이터입니다. 제공 항목에는 영문성분명, 제형, 함량, 영문제품명, 제출일이 포함되어 있어 사용자는 특정 의약품이 어떤 성분과 제형, 함량으로 Paragraph IV 인증이 제출되었는지와 제출 시점을 확인할 수 있습니다. 이를 통해 미국 내 제네릭 진입 경쟁 현황과 특허 분쟁 가능성을 파악하는 기초자료로 활용하거나 제네릭 허가 및 특허제도 운영의 영향을 검토하는 참고 자료로 사용할 수 있습니다.
