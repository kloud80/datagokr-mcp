summary_user: 미국 FDA에 Paragraph IV 특허 인증이 제출된 의약품을 건별로 담으며, 영문 성분명·제형·함량·영문 제품명·제출일을 제공한다. 제약사나 분석가가 특정 성분·제형의 의약품에 대해 미국에서 언제 Paragraph IV 인증이 제출됐는지 확인해 제네릭 진입 경쟁과 특허 분쟁 가능성을 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 식약처 허가정보 등 국내 의약품 데이터와는 영문 성분명·제품명을 기준으로 이름 매핑해서만 이어 쓸 수 있다.
limits: 품목기준코드나 의약품 표준코드 같은 공통 키가 없어 국내 허가·약가 데이터와 정확히 연결되지 않고, 이름 매칭 오류에 주의해야 한다. 미국 FDA 제출 정보이므로 국내 특허 분쟁이나 국내 제네릭 허가 현황을 직접 보여 주지 않는다.
