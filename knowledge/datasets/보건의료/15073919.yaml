summary_user: 식약처가 공고한 의료기기 재평가 대상을 품목 단위로 담은 API로, 재평가 연도·공고번호·공고일자와 품목명·허가일자, 제조·수입업체와 제조국·판매국, 제출방법·제출자료, 취소·취하 구분과 그 일자를 함께 제공한다. 의료기기 제조·수입업체가 자사 허가 품목이 재평가 대상인지, 언제까지 어떤 자료를 내야 하는지 확인하는 데 쓰고, 분석가는 재평가 뒤 취소·취하된 품목이 어느 정도인지 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 의료기기 품목허가 데이터와는 품목번호(MEDDEV_ITEM_NO)나 품목명·업체명을 맞춰 이어 써야 한다.
description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 제공하는 의료기기 재평가공고에 관한 정보입니다. 이 공공데이터에는 재평가 공고에 따른 재평가 공고번호, 코드명, 공고일자, 품목명, 허가일자, 제조·수입업체명 및 국가, 제출방법 및 자료, 취소/취하 구분 등 세부 항목을 담고 있습니다. 해당 데이터 활용을 통해 품목별 대응전략 수립 및 업계 전반의 품질 향상 그리고 정부의 평가 절차 개선 등 정책적 및 산업적 파급 효과 산출 또한 기대할 수 있습니다. 또한 이 데이터는 의료기기 안전성 개선에 참고가 될 수 있습니다.
