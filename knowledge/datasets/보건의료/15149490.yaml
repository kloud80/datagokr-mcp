description_portal: 신증후군출혈열은 3급법정전염병으로 급성 발열, 요통과 출혈, 신부전을 초래하는 사람과 동물 모두에게 감염되는 바이러스 감염증입니다. 신증후군출혈열을 일으키는 한탄바이러스는 들쥐의 72-90%를 차지하는 등줄쥐의 배설물이 건조되면서 호흡기를 통해 전파된다고 추정하고 있습니다.도시의 시궁쥐와 실험실의 쥐도 바이러스를 옮깁니다.  바이러스에 감염된 쥐는 타액(침)과 대변을 통해서 약 1개월간, 소변을 통해서는 1년 이상 바이러스를 배출합니다.현재까지 감염 환자로부터 다른 사람으로 바이러스가 전파되어 환자가 발생하였다는 보고는 없습니다.광주광역시보건환경연구원에서 확인진단으로 실시한 신증후군출혈열의 2018-2025년 분석자료를 개방하고자 합니다. 지역내 에서 실시한 월별검사건수에 대한 자료를 제공합니다.
