summary_user: 병원급 이상 의료기관(약국 제외, 양방만)의 건강보험 진료비를 진료년도·시도·진료과목별로 묶은 집계 통계로, 환자수·명세서 청구건수·입내원일수·보험자부담금·요양급여비용총액을 담으며 범위는 전국 시도 단위다. 보건의료 분석가가 '어느 시도에서 어떤 진료과목의 건강보험 진료비가 크게 늘었나' 같은 지역·진료과별 의료 이용과 비용 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시도명·진료과목명 같은 이름을 매핑해 이어야 하고, 요양기관 기호(ykiho)로 묶이는 기관 단위 데이터와는 직접 연결되지 않는다.
description_portal: '병원급 이상 의료기관의 진료과목별 시도별 건강보험 진료비 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2022년 1월~12월, 심사년월: 2022년 1월~2023년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 질병은 주상병 기준이며 의료기관에서 의사가 진료 시 환자의 호소, 증세에 따라 일차적으로 진단명을 부여하여 진료비 청구가 이루어짐에 따라 실제 최종 확정된 질병과는 차이가 발생할 수 있음※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
