summary_user: 서울시 내 미용실·네일숍·피부미용실 등 미용업소를 업소별 관리번호(MGTNO) 단위로 담은 인허가 원천 자료로, 인허가·폐업·휴업 일자, 영업상태, 주소·좌표, 좌석·침대 수, 남녀 종사자 수, 다중이용업소 여부 등을 포함한다. 창업 예정자나 상권 분석가가 '우리 구에서 최근 폐업한 미용실이 얼마나 되고 영업 중인 곳은 어디에 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 주소·사업장명 매핑이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 인허가 계열 업종 자료와 나란히 비교하는 용도에 맞다.
description_portal: 서울시 미용업 인허가 정보 데이터는 서울시 내 미용실, 헤어숍, 피부미용실, 네일숍 등 미용업소의 인허가 현황과 영업 상태, 시설·인력 정보를 종합적으로 제공하는 자료입니다. 관리번호를 중심으로 인허가일자, 인허가취소일자, 폐업일자, 휴업 및 재개업일자를 통해 각 업소의 행정 처리 이력과 영업 상태 변동을 확인할 수 있습니다. 영업상태명과 상세영업상태명은 현재 영업 중인지, 폐업·휴업·조건부 허가 상태인지 등을 구체적으로 나타냅니다. 지번주소, 도로명주소, 우편번호, 좌표정보는 미용업소의 위치를 정확히 파악하고, 상권 분석이나 지도 서비스 연계에 활용할 수 있는 핵심 공간 정보입니다. 사업장명, 소재지면적, 건물 지상·지하층수, 실제 사용하는 층 정보, 한실·양실·욕실 수, 발한실 여부, 좌석수, 침대수, 세탁기 및 회수건조 설비 수 등은 업소의 규모와 시설 수준을 파악하는 데 중요한 지표입니다. 여성·남성 종사자 수는 업소별 인력 규모와 고용 구조를 분석하는 데 활용할 수 있으며, 위생업태명과 다중이용업소 여부는 공중위생 관리와 안전 관리 측면에서 중요한 항목입니다. 또한 조건부 허가 사유와 기간, 건물소유구분명, 최종수정일자, 데이터갱신일자 등은 행정 관리 이력과 데이터의 최신성을 확인하는 기준이 되어, 미용업 인허가 행정, 위생·안전 점검, 지역 상권 분석, 고용·서비스 정책 수립 등 다양한 분야에서 기초 자료로 활용됩니다.
