summary_user: 식약처가 의약품 성분별로 정한 하루 최대 투여량을 성분코드·성분명(한글·영문), 제형, 투여경로, 투여단위와 함께 성분·제형 단위로 담은 전국 단위 기준 정보 API이다. 약국·의료기관이나 복약 안전 서비스 개발자가 '이 성분을 이 제형·경로로 하루에 얼마까지 써도 되나'를 확인해 과량 처방·복용을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 식약처 의약품 데이터(허가정보·DUR 등)와는 성분코드(CPNT_CD)나 성분명 매핑으로만 연결한다.
description_portal: 식품의약품안전처 「의약품 성분별 1일 최대투여량 정보」 OpenAPI는 각 성분마다 허용되는 하루 최대 투여량 정보를 제공합니다. 제공 항목에는 성분코드, 성분명(한글 및 영문), 제형코드, 제형명, 투여경로, 투여단위, 1일 최대투여량 등이 포함되어 있으며, 의약품의 안전한 사용과 과량 복용 방지를 지원합니다. 이를 통해 의료기관과 약국은 환자별 상태에 맞는 안전한 처방·조제를 할 수 있으며, 환자는 불필요한 부작용이나 중독 위험을 예방할 수 있습니다. 또한 제약사와 연구기관은 의약품 개발 및 안전성 평가에 참고할 수 있습니다.
