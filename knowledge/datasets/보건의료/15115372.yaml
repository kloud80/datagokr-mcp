summary_user: 서울 중랑구 약국의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 관리번호·인허가일자·영업상태·폐업일자·전화번호·지번/도로명 주소·사업장명·중부원점TM(EPSG:5174) 좌표가 들어 있다. 중랑구에서 새로 문을 열거나 폐업한 약국이 어디인지 확인하려는 주민, 또는 약국 개폐업 흐름을 상권 신호로 보려는 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로 다른 자치구의 같은 LOCALDATA 인허가 파일과는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 체계나 주소·업소명 매칭으로 잇는다.
description_portal: '서울특별시 중랑구의 약사가 의약품을 조제 또는 판매를 주목적으로 하는 업소 정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 사업자명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
