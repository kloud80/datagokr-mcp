summary_user: 서울 송파구의 안경업소 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소, 좌표, 시력검사기·렌즈절삭기 같은 장비 보유 수와 면적을 포함한다. 안경원 창업을 검토하는 사업자나 상권 분석가가 송파구에서 영업 중인 안경원이 어디에 몇 곳 있고 최근 어디서 개업·폐업했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 서울특별시 송파구의 안경업 인허가 정보에 대한 데이터입니다. 안경업 인허가 정보에 대한 데이터 등을 포함하고있습니다.
