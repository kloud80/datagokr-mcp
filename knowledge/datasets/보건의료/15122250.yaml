summary_user: 부과체계 개편 이전 건강보험 보험료를 등급별로 정리한 조견표로, 적용 시작·종료 연월, 과세자료 세목 대분류·중분류 코드, 등급별 시작·종료 구간값과 해당 등급의 건강보험료를 전국 단위로 담은 CSV 파일(약 1MB)이다. 분석가가 소득·재산 등 과세자료 금액이 어느 등급 구간에 들어 개편 전 기준으로 건강보험료가 얼마였는지 산정하거나 개편 전후 보험료를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 과세자료의 세목 코드와 적용 연월·구간값을 맞춰 매핑하는 방식으로만 다른 데이터와 잇는다.
limits: 전역 조인 키가 없어 다른 데이터와 직접 결합되지 않고 세목 코드·구간값 매핑에 의존한다. 부과체계 개편 이전 기준이므로 현행 보험료 산정에는 그대로 쓰지 않는다. 지역 구분 없는 전국·비공간 자료다.
