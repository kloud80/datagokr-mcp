description_portal: '본 데이터는 한국보건의료인국가시험원에서 시행하고 있는 국가시험의 응시수수료 정보(순서, 직종명, 금액)를 제공하고 있습니다.(자료 기준일 : 2026. 6. 2. 기준)으로 국가시험 직종명, 시험년도, 응시수수료정보를 제공하고 있습니다. 이 데이터는 다음과 같은 목적과 활용 가능성을 가지고 있습니다.1.  보건국가시험 응시수수료에 대한 기초 통계 정보를 제공합니다.2. 보건의료분야 인력 수급 및 교육 현황 분석에 활용할 수 있습니다.3. 공공데이터 분석 및 민간 활용 기반에 활용할 수 있습니다.4. 직종별 응시수수료에 대한 비교 분석이 가능합니다.'
