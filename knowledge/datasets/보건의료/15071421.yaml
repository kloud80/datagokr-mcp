description_portal: "중장기개방계획에 따른 강원특별자치도 강릉시 흡연단속시스템의 흡연단속장소(금연구역) 정보입니다.본 데이터는 3개 파일(시설물 대장, 시설물 분류 연계, 단속장소관리)로 구성되어 있으며, 이 중 금연시설 목록의 기준이 되는 '(시설물 대장)' 파일은 법정동코드, 연번, 업종명, 소재지도로명주소, 업태 항목으로 구성됩니다. 각 항목의 설명은 다음과 같습니다.법정동코드: 법정동 코드연번: 시설물의 고유 식별 번호 (예: FACT000001)업종명: 'e-zen(강릉녹색도시체험센터)', 'KBS강릉방송국' 등 금연 시설의 이름소재지도로명주소: 해당 시설의 도로명 주소업태: '청사', '어린이놀이시설', '음식점' 등 금연 시설의 분류(참고) 함께 제공되는 '(시설물 분류 연계)' 파일은 업태와 분류코드를, '(단속장소관리)' 파일은 단속장소의 상세 위치를 제공합니다."
