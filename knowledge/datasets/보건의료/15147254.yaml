summary_user: 서울 동작구의 미용실·피부·메이크업·네일 등 미용업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일·영업상태·폐업일·사업장명·주소(지번·도로명)·면적·층수·좌석수와 중부원점TM 좌표(X, Y)가 들어 있다. 창업을 준비하는 사업자나 상권 분석가가 '동작구에서 최근 개업·폐업한 미용실이 어느 동에 몰려 있는가'처럼 업소 개폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 업종의 LOCALDATA 인허가 데이터와는 같은 기관 코드(OPNSFTEAMCODE)나 주소·사업장명 매핑으로만 이어 쓴다.
description_portal: '동작구의 헤어, 메이크업, 네일아트와 같이 얼굴, 머리, 피부 등을 손질하여 외모를 아름답게 꾸미는 업소정보를 제공합니다.미용실, 헤어, 피부, 메이크업, 화장, 네일 등의 미용업 인허가 정보를 포함합니다.영업상태, 전화번호, 소재지면적, 우편번호, 주소(지번, 도로명), 사업장명, 좌표정보, 층수, 좌석수 등의 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음. 좌표는 X,Y 값을 제공합니다.* 본 데이터는 3일전 자료를 제공합니다.'
