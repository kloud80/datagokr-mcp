summary_user: 전북특별자치도 각 시군에서 주말·공휴일에 문을 여는 휴일지킴이 약국을 약국 한 곳당 한 행으로 담은 목록 파일로, 약국명·도로명주소·전화번호·운영시간·근무일·근무주기를 포함한다. 주민이 '이번 일요일 우리 시군에서 문 여는 약국은 어디이고 몇 시까지 하나'를 확인하거나, 보건 담당자가 시군별 휴일 약국 분포와 공백을 살피는 데 쓴다. 전역 조인 키가 없어 다른 약국·의료기관 데이터와는 약국명과 도로명주소, 시군명을 맞춰 연결해야 한다.
limits: 약국 인허가번호 같은 공통 코드가 없어 다른 데이터와 붙일 때 이름·주소 매칭 오류가 생길 수 있다. 실시간 운영 여부가 아니라 정리된 목록이므로 방문 전 전화로 운영시간을 확인해야 한다.
