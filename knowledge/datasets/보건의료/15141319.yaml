summary_user: 금천구 내 의원 한 곳씩의 인허가 기록을 건별로 담으며, 인허가일자·영업상태(폐업·휴업 등)·주소와 좌표·진료과목·의료인 수·병상 수 등을 포함한다. 금천구에서 어떤 의원이 언제 개업·폐업했는지, 동네별 의원 분포가 어떤지 확인하려는 주민·상권 분석가·지역 보건 정책 담당자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 금천구 내 의원의 인허가 현황을 체계적으로 파악할 수 있는 데이터로, 인허가일자, 영업상태, 주소, 사업장명, 진료과목, 의료인 수, 병상 수, 입원실 수 등 의료기관의 주요 정보를 포함합니다. 폐업, 휴업, 재개업 등 영업상태 변동과 관련된 이력도 제공되어 의료기관의 운영 현황 분석에 활용할 수 있습니다. 이 데이터를 이용하여 의료기관의 위치 좌표와 우편번호, 업태 구분, 구급차 보유 현황 등 다양한 세부 정보가 포함되어 의료 정책 수립, 지역 의료 인프라 분석, 의료기관 현황 지도화 등 다양한 분야에서 활용 가능합니다.
