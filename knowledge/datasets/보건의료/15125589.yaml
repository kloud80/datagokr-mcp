description_portal: 이 데이터는 한국한의약진흥원이 수집·정제한 한약 실험정보 중 약력학 시험의 시험관 내(In vitro) 데이터로, 제공된 표에 제시된 항목 그대로 한약 실험 결과를 구조화해 담고 있습니다. 주요 필드는 한약재 ID와 NCBI Taxonomy ID, 연구대상질환명, 국제질병분류(ICD11) ID, 시험종류, 세포주 이름, 실험체 상태, 추출용매, 투여약물명, 검사대상 유형 및 이름, 측정항목, 측정결과 등으로 구성되어 있습니다. 예시 행에는 폐암(Lung cancer)과 관련된 세포주 A549에서 특정 한약재 추출물이 사용된 실험의 측정항목과 측정결과 값이 기록되어 있으며, 이처럼 각 행이 동일한 형식으로 한약재별 실험 조건과 시험관 내 측정 정보를 일관되게 제공하는 것이 특징입니다.
