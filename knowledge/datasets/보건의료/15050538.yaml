description_portal: '부산광역시 남구에 있는 이미용업에 대한 업종명,업소명,도로명주소,우편번호,전화번호에 대한 상세한 자료를 제공합니다.공중위생관리법 제2조의 공중위생업소 중 이용업(손님의 머리카락 또는 수염을 깎거나 다듬는 등의 방법으로 손님의 용모를 단정하게 하는 영업), 미용업(손님의 얼굴, 머리, 피부 및 손톱, 발톱 등을 손질하여 손님의 외모를 아름답게 꾸미는 영업) 현황 리스트 데이터입니다.– 일반미용업: 파마･머리카락 자르기･머리카락 모양내기･머리 피부 손질･머리카락 염색･머리 감기, 의료기기나 의약품을 사용하지 아니하는 눈썹손질을 하는 영업– 피부미용업: 의료기기나 의약품을 사용하지 아니하는 피부상태 분석･피부관리･제모(除毛)･눈썹 손질을 하는 영업– 네일미용업: 손톱과 발톱을 손질･화장(化粧)하는 영업– 화장･분장미용업: 얼굴 등 신체의 화장, 분장 및 의료기기나 의약품을 사용하지 아니하는 눈썹 손질을 하는 영업– 종합미용업: 가목부터 마목까지의 업무를 모두 하는 영업'
