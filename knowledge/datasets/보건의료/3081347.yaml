description_portal: '이 데이터는 부산광역시 서구에 소재한 병원 부속 장례식장에 대한 운영 정보와 시설 현황을 정리한 것입니다. 장례식장의 명칭, 연락처, 시설 규모, 운영형태, 개시일 등의 정보를 포함하며, 시민의 장례시설 이용 편의 증진과 행정적 정책 수립 자료로 활용됩니다.*항목별 설명1) 장례식장명:  병원 또는 기관에 부속된 장례식장의 공식 명칭입니다. 시민이 실제 방문하거나 문의할 때 사용하는 명칭으로 기재됩니다.2) 운영형태: 장례식장의 운영 방식으로, 병원에서 직접 운영하는 직영과 외부 업체에 임대한 임대 유형이 있습니다.3) 대표자명4) 영업개시일5) 빈소 수:  동시에 운영 가능한 장례실(빈소)의 개수입니다. 장례식장 수용 가능 규모를 판단할 수 있는 항목입니다.6) 안치가능 수: 시신을 냉장 보관할 수 있는 안치시설의 수용 가능 수입니다.'
