description_portal: '- 전라남도 정신의료기관 현황에 대하여 시군, 기관명, 병상수, 낮병동 입원 가능 환자수, 의사, 간호사, 치료사 등에 대한 데이터를 제공합니다.- 전라남도에는 정신건강 서비스와 치료를 제공하는 다양한 정신의료기관이 운영되고 있습니다. 이들은 정신질환 예방, 치료, 재활, 응급 대응 등 여러 분야에서 활동하고 있으며, 지역별로 분포하여 주민들에게 접근성을 높이고 있습니다.- 이들 기관은 정신건강복지센터, 정신요양시설, 정신재활시설 등으로 구분되며, 지역별로 분포하여 주민들에게 서비스 접근성을 높이고 있습니다. 또한, 정신건강복지센터는 22개 시·군에 설치되어 지역사회 기반의 정신건강 서비스를 제공합니다.'
