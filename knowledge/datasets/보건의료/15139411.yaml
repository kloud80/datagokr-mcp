summary_user: 2021~2023년 전국 장기요양 인정자 가운데 해당 연도에 사망한 사람 수를 연도·성별·5세 단위 연령대별로 1~5등급과 인지지원등급으로 나눠 집계한 소규모 파일(csv 약 4KB)이다. 연구자나 정책 분석가가 '고령일수록, 또는 등급이 무거울수록 장기요양 인정자의 연간 사망 규모가 어떻게 달라지는가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 장기요양·인구 통계와는 연도·성별·연령대 값을 이름으로 맞춰 이어 써야 한다.
description_portal: '이 데이터는 2021년부터 2023년까지 연령별 장기요양 인정자 및 사망인정자 현황을 집계한 자료입니다.1. 연도: 2021~2023년2. 연령 : 신청 당시 연령 기준 5세 단위 (데이터 구축 가능한 연령대로 제공)3. 용어 정의  - 인정자 : 연도말 기준, 장기요양 등급(1~5등급, 인지지원등급)이 유효한 자(중복 제외)  - 사망인정자 : 해당연도 내(1.1.~12.31.) 사망한 자(장기요양 등급별)※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
