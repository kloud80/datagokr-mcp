description_portal: '※ 관련 문의 사항 : 1544-4244(대표번호), (평일 09:00  ~ 18:00)보건복지부장관이 인정하는 외국학교 현황(직종별 인정학교 국가 및 학교명)을 제공합니다.인정학교는 "보건의료인국가시험 응시자격 관련 외국학교 등 인정기준" 제4조(재검토기한)에 의거 그 타당성을 검토하여 개선 등의 조치를 할 수 있으며, 인정현황은 인정심사 신청 시 작성된 국가 및 교명을 바탕으로 생성된 데이터이므로 현재 변경된 사항이 있을 수 있으며, 국가 및 학교명이 상이하거나 외국학교 졸업자의 응시자격 관련은 별도 문의가 필요합니다.본 데이터는 2026.6.2.기준 데이터로, 외국학교 인정심사 기간 동안에는 인정학교가 추가될 수 있습니다.이 데이터는 다음과 같은 목적과 활용 가능성을 가지고 있습니다.1. 보건의료 국가시험의 외국대학교 인정 현황 정보에 대한 기초 통계 정보를 제공합니다.2. 보건의료 국가시험 분야 인력 수급 및 교육 환경 분석에 활용할 수 있습니다.3. 공공데이터 분석 및 민간 활용 기반에 활용할 수 있습니다.외국학교 인정심사는 신청된 학교에 한해 심사가 이루어지므로, 신청되지 않은 학교에 대해서는 심사할 수 없음을 알려드립니다. 졸업하신 학교에 대한 인정심사를 희망하시는 경우 외국학교 인정심사를 신청해 주시기 바랍니다.감사합니다.'
