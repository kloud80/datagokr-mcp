summary_user: 경기도 내 감염병예방법 시행령상 소독을 해야 하는 시설(20실 이상 숙박업소, 300㎡ 이상 식품접객업소, 대규모 점포·전통시장, 병원급 의료기관, 집단급식소, 기숙사, 300석 이상 공연장 등)을 업체 한 곳당 한 행으로 담고, 시설구분(faclt_div)과 시군·주소·좌표를 함께 담는다. 보건소·방역업체·분석가가 '우리 시군에 소독 의무가 있는 대형 식당이나 숙박업소가 어디에 몇 곳 있는가'를 확인하고 방역 점검 대상을 지도에 표시하는 데 쓴다. 전역 조인 키가 없어 다른 인허가 데이터와는 업체명·주소·시군명을 맞춰 연결하고, 위경도 좌표로 공간 결합한다.
description_portal: '* 시설구분 : 감염병의 예방 및 관리에 관한 법률 시행령 제24조 중 업체가 해당하는 호<2022. 11. 29. 기준> 감염병의 예방 및 관리에 관한 법률 시행령 제24조(소독을 해야 하는 시설)법 제51조제3항에 따라 감염병 예방에 필요한 소독을 해야 하는 시설은 다음 각 호와 같다.1. 「공중위생관리법」에 따른 숙박업소(객실 수 20실 이상인 경우만 해당한다), 「관광진흥법」에 따른 관광숙박업소2. 「식품위생법 시행령」 제21조제8호(마목은 제외한다)에 따른 식품접객업 업소(이하 “식품접객업소”라 한다) 중 연면적 300제곱미터 이상의 업소3. 「여객자동차 운수사업법」에 따른 시내버스ㆍ농어촌버스ㆍ마을버스ㆍ시외버스ㆍ전세버스ㆍ장의자동차, 「항공안전법」에 따른 항공기 및 「공항시설법」에 따른 공항시설, 「해운법」에 따른 여객선, 「항만법」에 따른 연면적 300제곱미터 이상의 대합실, 「철도사업법」 및 「도시철도법」에 따른 여객운송 철도차량과 역사(驛舍) 및 역 시설4. 「유통산업발전법」에 따른 대형마트, 전문점, 백화점, 쇼핑센터, 복합쇼핑몰, 그 밖의 대규모 점포와 「전통시장 및 상점가 육성을 위한 특별법」에 따른 전통시장5. 「의료법」 제3조제2항제3호에 따른 병원급 의료기관6. 「식품위생법」 제2조제12호에 따른 집단급식소(한 번에 100명 이상에게 계속적으로 식사를 공급하는 경우만 해당한다)6의2. 「식품위생법 시행령」 제21조제8호마목에 따른 위탁급식영업을 하는 식품접객업소 중 연면적 300제곱미터 이상의 업소7. 「건축법 시행령」 별표 1 제2호라목에 따른 기숙사7의2. 「소방시설 설치 및 관리에 관한 법률 시행령」 별표 2 제8호가목에 따른 합숙소(50명 이상을 수용할 수 있는 경우만 해당한다)8. 「공연법」에 따른 공연장(객석 수 300석 이상인 경우만 해당한다)9. 「초ㆍ중등교육법」 제2조 및 「고등교육법」 제2조에 따른 학교10. 「학원의 설립ㆍ운영 및 과외교습에 관한 법률」에 따른 연면적 1천제곱미터 이상의 학'
