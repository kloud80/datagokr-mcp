summary_user: 한국방송광고진흥공사(KOBACO) 통계를 바탕으로 소주·맥주·와인·위스키·증류주·청주·탁주 및 전통주·기타 등 주종별 주류광고 지출액을 연도별(2000~2024년)로 집계한 전국 단위 지표이며, 1KB 남짓한 작은 CSV 파일이다. 음주폐해예방 정책 담당자나 연구자가 "주류회사가 어떤 주종에 광고비를 많이 쓰고, 그 규모가 해마다 어떻게 바뀌었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 지역 구분도 없어 다른 데이터와는 연도 기준으로만 맞춰 볼 수 있다.
description_portal: 음주폐해예방 관련 지표- 한국방송광고진흥공사(KOBACO) 통계에 따라 맥주, 소주, 양주 등 주종별 주류광고 지출액을 연도별로 집계한 지표입니다. - 주종별 지출 금액을 구분하여 광고비 투입의 차이를 나타내며, 연도별 변화 추이를 확인할 수 있도록 구성되어 있습니다.- 데이터에는 소주, 맥주, 와인, 위스키, 증류주, 청주 등에 대한 주종별 광고비 총액이 나타나 있으며, 데이터 연도범위는 2000년~2024년입니다. - 본 데이터는 음주를 조장하는 주류회사의 마케팅에 대한 연구 시 근거자료로 활용될 수 있습니다.
