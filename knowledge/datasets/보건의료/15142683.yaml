summary_user: 서울 마포구에 있는 부속의원·부속병원·군부대 의무대처럼 소속 직원과 가족의 건강관리를 위해 설치된 부속의료기관의 인허가 정보를 사업장 단위로 담는다(인허가일자, 영업상태, 폐업일자, 주소, 중부원점TM 좌표, 병상·면적 등). 마포구에서 어느 기업·기관이 부속의료기관을 운영하는지, 언제 개설되고 폐업했는지를 확인하려는 분석가나 상권·의료 인프라 조사자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 개방자치단체코드로만 연결하며, LOCALDATA 공통 인허가 형식이라 다른 업종 인허가 데이터와 같은 구조로 묶어 볼 수 있다.
description_portal: '서울특별시 마포구의 부속의원, 부속병원, 군부대시설, 의무대 등 해당 소속 지원, 종업원 및 그 가족의 건강관리를 위한 의료기관 정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 부속의료기관을 관리·감독하는 보건 부서나 기관의 정보도 함께 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
