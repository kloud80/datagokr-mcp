summary_user: 수입품목 허가·인증을 받기 위한 시험검사에 쓰이는 시험용 의료기기의 승인 현황을 승인 건별로 담으며, 상품명·제조국·신청업체·신청일·사용기간·모델명(형명)·수입수량·잔량·사용목적·종료보고승인일 등 11개 항목으로 전국 범위를 다룬다. 의료기기 수입업체나 분석가가 특정 업체가 어떤 해외 기기를 시험 목적으로 들여와 언제까지 쓰고 얼마나 남았는지, 종료보고까지 마쳤는지를 확인하는 데 쓴다. 전역 조인 키가 없어 의료기기 품목허가 등 다른 식약처 데이터와는 업체명·상품명·모델명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 시험용 의료기기는 의료기기 수입품목 허가 또는 인증을 받기 위한 시험검사에 사용되는 의료기기로 식품의약품안전처_시험용 의료기기 승인 정보는 시험용 의료기기 승인 현황을 제공합니다. 상품명, 제조국, 신청업체명, 신청일, 사용기간(시작일, 종료일), 형명(모델명), 수입수량, 잔량, 사용목적, 종료보고승인일 등 11가지 항목으로 구성되어 있습니다. 이 데이터는 의료기기 개발 및 연구에 사용되는 기기의 승인부터 사용 종료까지의 과정을 담고 있습니다. 이 데이터를 통해 시험용 의료기기 관련 전반적인 정보를 파악할 수 있습니다.
