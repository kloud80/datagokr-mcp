summary_user: 서울 성북구에 있는 보건소와 보건지소의 기관명, 주소, 전화번호, 위도·경도, 행정동을 기관 한 곳당 한 줄로 담은 소규모 파일(csv 409바이트)이며, 포털 설명상 2021년 1월 1일 기준이다. 성북구 주민이 집 근처 보건지소의 위치와 연락처를 찾거나, 분석가가 행정동별 공공보건시설 분포를 지도에 표시할 때 쓴다. 전역 조인 키(보건소코드·시군구코드 등)가 없어 다른 데이터와는 행정동 이름이나 위도·경도 좌표로 맞춰 이어 써야 한다.
