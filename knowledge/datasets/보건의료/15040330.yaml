description_portal: 이 데이터는 2021년 1월 1일 기준으로 서울특별시 성북구에 위치한 보건소 및 보건지소의 현황을 정리한 자료입니다. 기관명, 주소, 전화번호, 위도, 경도, 행정동으로 구성되어 있으며, 이를 통해 성북구 내 보건소와 각 지소의 위치 정보와 기본적인 연락처 정보를 확인할 수 있습니다. 주소와 함께 제공된 위도·경도 값은 시설의 정확한 위치를 지도 기반으로 조회하는 데 활용할 수 있고, 전화번호는 보건소 이용 문의 및 안내에 사용할 수 있습니다. 행정동 정보는 각 보건기관이 속한 지역 단위를 나타내며, 지역별 공공보건시설 분포를 이해하는 데 유용합니다. 이 자료는 성북구 보건소 및 보건지소의 현황을 체계적으로 파악하기 위한 기초 데이터를 제공합니다.
