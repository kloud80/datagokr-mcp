description_portal: 고령화 사회로 접어들면서 장례문화에 대한 사회적 관심이 높아지고 있습니다. 부산추모공원은 변화하는 가족 구조와 장사 수요에 대응하여 봉안, 벽식봉안담, 가족봉안묘 등 다양한 형태의 장사시설을 제공하고 있습니다. 특히 가족봉안묘는 가족 단위의 안치 수요를 반영한 대표적인 예로, 안치 가능 인원에 따라 다양한 유형이 마련되어 있습니다. 이러한 공공장례서비스는 시민의 부담을 덜고, 장례문화의 지속가능성과 효율성을 높이기 위한 방향으로 운영되고 있습니다. 자세한 이용 조건은 부산추모공원 홈페이지를 통해 확인할 수 있습니다.
