description_portal: 대전광역시 2021년 공중위생직능단체 현황 자료는 지역 내 다양한 공중 위생 관련 직능 단체의 조직 구성과 활동 현황에 관한 정보를 제공합니다. 본 자료에는 단체 소재지, 회원수, 주요 활동 및 교육 현황 등 기본 사항이 포함됩니다. 해당 자료는 지역사회 내 공중 위생 개선을 위해 활동하는 협회·조합 등 단체의 현황을 한눈에 파악할 수 있게 하며, 단체 간 네트워크 구축 및 협업 기반 마련, 위생 수준 향상 정책 개발, 맞춤형 교육 프로그램 운영 방안 도출 등 실질적인 행정·정책 지원에 활용이 가능합니다. 본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
