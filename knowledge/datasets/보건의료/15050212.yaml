summary_user: 통계청 사망원인통계 마이크로데이터를 가공해 알코올 관련 질환(알코올성 간 질환, 알코올 사용에 의한 정신 및 행동장애, 알코올 중독 등 13개 사인 코드)별 사망자 수를 연도·성별(구분)로 집계한 전국 단위 통계 파일이다. 보건 정책 담당자나 연구자가 '알코올성 간 질환 사망자가 해마다 남녀별로 어떻게 변했는가'처럼 음주폐해 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 질병 코드(사인명) 기준으로 맞춰 이어 써야 한다.
