description_portal: '(데이터 수집목적 및 과정) 경상남도 감염병 발생현황 데이터는  2023년 12월 기준으로 방역통합정보시스템으로 수집된 경상남도 및 18개 시군에 대한 감염병 발생 정보입니다. (데이터 구성 및 세부항목) 경상남도 감염병 현황 데이터는 구분, 감염질병명, 전국 및 경남도 10개시군 발생현황으로 구성됩니다. 총 63건입니다.* 1~3급 감염병 발생현황입니다.* 감염병감시체게 : 의료기관 신고 → 시군구 보건소 보고 → 시도 보고 → 질병관리청 검토 후 승인(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다.'
