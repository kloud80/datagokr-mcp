summary_user: 수면장애(G47)·비기질성 수면장애(F51)·수면무호흡(G47.3) 관련 주상병 기준으로 2022~2024년 진료년도별·시도·시군구별 진료인원(중복제외)과 진료비·급여비(천원)를 담은 전국 집계 파일이다. 분석가나 지자체 보건 담당자가 '우리 시군구의 수면장애 진료인원과 진료비가 해마다 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 시도·시군구 이름을 행정구역 코드로 매핑해야 인구·의료기관 등 다른 지역 통계와 이을 수 있다.
description_portal: '국민건강보험공단_수면장애 관련 주상병별 진료정보(舊, "국민건강보험공단_수면장애(G47) 및 비기질성수면장애(F51) 진료인원")1. 주상병코드: G47(수면장애), F51(비기질성 수면장애), G47.3(수면무호흡)2. 진료개시년도: 2022년~2024년3. 수진시점 주소지 기준4. 진료 인원: 해당 구분별 진료인원(중복제외)5. 진료비 : 공단부담금(기관부담금)과 본인부담금을 더한 금액. 요양급여(의료급여비용)총액 6. 급여비 : 요양급여비용 총액 중에서 보험자인 공단이 부담한 금액  - 진료일 기준(한의분류 제외, 진료 인원은 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2025년 6월 지급분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음  - 개인정보 보호를 위해 5 미만의 자료는 "*" 처리 -  해당 상병으로 진료를 받은 인원이 없는 경우 공란으로 처리※ 민원인의 공공데이터 제공 신청에 따라, 과거 데이터에서 상병코드 추가하여 재발췌한 데이터이며 발췌시점 차이에 따른 값 차이 있을 수 있음※ 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
