summary_user: 부산광역시 남구에 의료기기 판매(임대)업 신고를 한 업체를 한 행에 한 곳씩 담은 목록으로, 영업소명과 도로명 소재지만 있는 약 45KB 크기의 CSV 파일이다. 남구 주민이나 사업자가 동네에서 의료기기를 사거나 빌릴 수 있는 신고 업소가 어디에 있는지 찾을 때, 또는 분석가가 구 안의 의료기기 판매업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 식약처 품목허가나 다른 구 자료와는 업소명·도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 남구에 의료기기 판매(임대)업 신고를 한 등록업체들의 최신 현황입니다.**"의료기기"란? 사람이나 동물에게 단독 또는 조합하여 사용되는 기구ㆍ기계ㆍ장치ㆍ재료ㆍ소프트웨어 또는 이와 유사한 제품으로서 다음 각 호의 어느 하나에 해당하는 제품을 말하며, 다만, 「약사법」에 따른 의약품과 의약외품 및 「장애인복지법」 제65조에 따른 장애인보조기구 중 의지(義肢)ㆍ보조기(補助器)는 제외됩니다.1. 질병을 진단ㆍ치료ㆍ경감ㆍ처치 또는 예방할 목적으로 사용되는 제품2. 상해(傷害) 또는 장애를 진단ㆍ치료ㆍ경감 또는 보정할 목적으로 사용되는 제품3. 구조 또는 기능을 검사ㆍ대체 또는 변형할 목적으로 사용되는 제품4. 임신을 조절할 목적으로 사용되는 제품**의료기기는 「의료기기에 관한 법률」에 따라 엄격하게 관리되고 규제되는 업종입니다.1. 본 데이터는 의료기기 판매(임대)업의 법인 또는 상호명, 사업장 소재지(도로명주소) 자료를 제공합니다.2. 데이터 기준일은 2026년 6월 18일이며, 해당 자료는 매년 1회 정기적으로 업데이트됩니다.3. 취급 품목 세부사항의 경우 없는 데이터가 있습니다.4. 위 내용에 대하여 문의사항이 있거나 추가 설명이 필요한 경우에는 부산광역시 남구 의약관리팀(☎051-607-6489)로 문의 바랍니다.
