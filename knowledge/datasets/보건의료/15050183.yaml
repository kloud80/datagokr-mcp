summary_user: 국민건강증진종합계획(HP2020)의 암·관절염·심뇌혈관질환 등 만성퇴행성질환 관리 지표를 지표별·연도별로 담은 전국 단위 집계 파일로, 2008~2020년 각 연도의 기준값·목표값·예측값·현재값·달성도·변화율과 지표정의·설정근거·자료출처를 함께 담는다. 보건정책 분석가나 연구자가 '심뇌혈관질환 유병률 같은 지표가 HP2020 목표치에 얼마나 다가갔는가'를 확인하거나 건강증진 연구의 기초자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 지표명·연도를 이름으로 맞춰 연결해야 하며, 시군구코드·보건소코드가 없어 지역사회 건강조사 같은 지역 단위 자료와 바로 붙지 않는다.
description_portal: 국민건강증진종합계획(HP2020) 관련 만성퇴행성질환과 발병위험 요인관리 지표입니다. 본 데이터에서는 암, 관절염, 심뇌혈관질환 등 만성퇴행성질환의 유병율, 치료율 등의 정보를 제공합니다. 2008년부터 2020년까지 각 연도별로 지표별 목표치, 예측치, 현재값, 달성도, 변화율 등의 자료로 구성되어있으며, 지표별로 지표정의, 지표설정근거, 자료출처 정보도 제공하고 있습니다. 본 데이터는 건강증진 및 보건의료 관련 연구 시 기초자료로 활용될 수 있으며, 일반 국민들에게는 만성퇴행성질환의 국내 현황을 보여주는 자료입니다.
