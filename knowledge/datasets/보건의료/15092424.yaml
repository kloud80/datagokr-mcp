description_portal: 국가금연지원서비스 중 지역금연지원센터의 단기금연캠프 대상자의 흡연자 심리평가 결과 현황을 제공합니다. - 니코틴의존도, 흡연유형, 흡연갈망, 금연동기, 금연효과지각, 금연효능감, 우울감, 스트레스, 정서조절방략 - 본 데이터는 기관별, 성별, 심리평가 결과별로 구분하여 대상자의 사전사후 평가결과데이터를 제공하고 있습니다.  - 본 데이터는 금연관련 정책 또는 사업 활성화 및 단기금연캠프 참여자의 심리분석 등과 같은 연구 수행 시 기초자료 및 근거자료로 활용될 것으로 기대하고 있습니다.
