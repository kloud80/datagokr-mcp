summary_user: 충주시에 있는 병원·약국을 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·종별(종합병원·병원·약국 등)·도로명 주소·대표 전화번호와 담당부서·문의전화를 담는다. 충주 주민이나 민원 담당자가 "우리 동네 주변에 어떤 병원과 약국이 있고 연락처가 무엇인가"를 확인하거나, 지역 의료기관 안내자료를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의료기관 데이터(LOCALDATA 인허가, 건강보험 기관정보 등)와는 업소명·주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 충청북도 충주시에 위치한 병원 및 약국에 대한 정보를 제공하는 데이터입니다.업소명, 종별(종합병원, 병원, 약국 등), 도로명 주소, 전화번호, 담당부서, 문의전화 등의 항목으로 구성되어 있으며, 지역 내 보건의료시설 현황 파악에 활용됩니다.종별은 의료기관 분류 기준에 따라 구분되며, 보건복지부 고시에 따른 용어 체계를 따릅니다.주소는 도로명주소 기준으로 제공되며, 일부 지번주소와 상이할 수 있습니다.전화번호는 대표번호 기준으로 수록되었으며, 운영 시간이나 진료 과목 등은 해당 기관에 직접 문의 필요본 데이터는 응급의료체계 구축, 공공보건 정책 수립, 민원 응대, 지역의료기관 안내자료 제작 등에 활용 가능합니다.※ 병원 및 약국 정보는 변동 가능성이 높아 활용 전 최신 등록 여부 확인이 필요하며, 상세 진료정보는 국민건강보험공단 홈페이지 또는 건강정보 포털 등을 참고 바랍니다.
