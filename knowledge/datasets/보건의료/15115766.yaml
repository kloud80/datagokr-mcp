summary_user: 구로구 관내 의원·보건소·한의원 등 의원급 의료기관의 인허가 내역을 기관별 1행으로 담은 LOCALDATA 형식 원천 자료로, 인허가·폐업 일자, 영업상태, 지번·도로명 주소, 의료인수·병상수, 진료과목, 중부원점TM 좌표(X, Y)를 포함한다. 주민이나 분석가가 '구로구 내 어느 생활권에 영업 중인 의원이 부족하고, 최근 어떤 의원이 개업·폐업했는가'를 확인하는 데 쓰며, 병의원 개폐업 흐름은 상권 변화 신호로도 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구 의원 인허가나 병원·치과 등 다른 LOCALDATA 자료와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호나 주소·사업장명 매칭으로 이어 쓴다.
description_portal: 의원 인허가 정보 데이터는 구로구 관내 의원, 보건소, 한의원 등 환자를 대상으로 의사가 직접 의료행위를 수행할 수 있는 진료시설을 갖춘 의료기관을 대상으로 구축된 행정 기반 보건자료이다. 데이터에는 인허가일자, 영업상태명, 소재지전체주소, 의료기관종별명, 진료과목내용, 의료인수, 병상수 등 의료기관의 운영 실태를 파악할 수 있는 핵심 정보가 포함되어 있어 지역 의료서비스의 공급 수준을 정량적으로 분석할 수 있다. 의원급 의료기관은 주민의 일상적 진료 수요를 담당하므로, 이 자료는 지역 의료 접근성 평가와 기본 진료 인프라의 적정성 판단에 매우 중요한 역할을 한다.또한 본 데이터는 중부원점TM(EPSG:2097) 좌표계를 기반으로 시설의 위치 정보를 제공하여, 의료기관의 지리적 분포와 생활권별 접근성을 공간 분석 관점에서 정확히 파악할 수 있도록 한다. 위경도 좌표는 제공되지 않으므로 GIS 활용 시 좌표 변환이 필요한 경우가 있다. 더불어 이 데이터는 3일 전 기준으로 갱신된 최신 인허가 현황을 제공하여 개설·폐업·변경 등 의료기관의 행정적 변동 사항을 시의성 있게 반영하도록 설계되어 있다.이와 같은 구조는 단순한 의료기관 목록을 넘어, 의료 취약지 분석, 고령화 대응 정책, 지역 맞춤형 보건사업 기획 등 구로구 보건행정 전반의 의사결정에 중요한 기반 자료로 활용될 수 있다.
