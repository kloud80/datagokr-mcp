summary_user: 광산구 관내 보건소와 보건지소를 한 행에 한 곳씩 담은 소규모 시설 목록(약 1.9KB CSV)으로, 구분·명칭·전화번호·주요 업무·도로명 주소·위치설명·위도·경도·데이터기준일자를 담는다. 광산구 주민이 "우리 동네에서 예방접종이나 건강상담을 받을 수 있는 가장 가까운 보건지소는 어디인가"를 찾거나, 분석가가 보건기관 배치를 지도에 올려 볼 때 쓴다. 전역 조인 키나 보건소코드·시군구코드는 없어서 다른 데이터와는 기관 명칭이나 주소로 맞추거나 위도·경도로 공간 결합해 쓴다.
description_portal: 광주광역시 광산구에서는 관내 보건소 및 보건지소의 현황을 체계적으로 관리하여 시설명, 업무 범위에 따른 구분, 도로명 주소, 상세 위치 설명, 전화번호, 주요 업무 내용, 위도·경도, 그리고 데이터 기준일자 등을 포함한 공공데이터를 제공합니다. 각 보건기관은 지역 주민의 건강증진, 예방접종, 아동·노인·임산부 대상 건강 상담, 만성질환 관리, 식중독 예방 등 다양한 보건·의료 서비스를 담당합니다. 이 데이터는 도로명 주소와 위도·경도 정보가 포함되어 있어 GIS 기반의 위치 분석이 가능하며, 주민들은 가까운 보건기관을 손쉽게 찾고 이용할 수 있습니다. 또한 CSV, JSON, XML 등의 오픈 포맷으로 제공되어, 데이터 활용이 용이하며, 연구자나 행정기관, 시민단체에서도 공공보건 정책 수립, 서비스 배치, 보건 캠페인 기획 등에 효율적으로 활용할 수 있습니다.
