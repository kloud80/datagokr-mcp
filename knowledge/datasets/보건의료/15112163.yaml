description_portal: 서울특별시 동대문구 행정동별 코로나19 사망자 수 데이터는 관내 14개 행정동을 기준으로 발생한 감염병 사망자 현황을 체계적으로 기록한 보건 행정 자료입니다. 본 데이터는 특정 기간 동안 각 동별로 집계된 누적 사망자 수를 포함하고 있어 지역 내 감염병 취약 지역을 파악하고 향후 유사한 공중보건 위기 상황 발생 시 대응 전략을 수립하는 데 필수적인 기초 자료로 활용됩니다. 주요 항목으로는 행정동 명칭과 해당 지역의 사망자 수 정보가 명확히 명시되어 있으며 이를 통해 지역 사회의 치명률 분석이나 방역 대책의 실효성을 검토하는 지표로 사용될 수 있습니다.2020년 2월부터 2022년 12월까지 동대문구 법정동별 및 일별 코로나 확진자수 현황입니다. (질병청 시스템기준 확진자의 신고일기준으로 작성된 자료입니다.)
