summary_user: 식약처가 의약품 품목별로 연결된 국내 특허를 성분명·제품명·허가업체·제형·함량과 함께 담고, 특허등록번호·발명의 명칭·특허권자·특허 상태·존속기간 만료일·재심사(PMS) 만료일·국내소송 여부를 건별로 제공하는 전국 단위 OpenAPI입니다. 제네릭 개발을 검토하는 제약사나 연구자가 '이 성분 제품을 보호하는 특허는 무엇이고 언제 만료되며 소송이 걸려 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 품목번호(ITEM_SEQ)나 제품명·성분명·업체명으로 식약처 의약품 허가정보와 맞춰 보고, 이를 거쳐 심평원 약가·급여 목록과 잇는 방식으로 이어 쓴다.
description_portal: 식품의약품안전처 「의약품 특허정보」 OpenAPI는 의약품과 관련된 특허 현황을 조회할 수 있는 공공데이터입니다. 제공 항목에는  성분명, 제품명, 허가업체, 특허등록번호, 존속기간 만료일 등이 포함되어 있어 특정 의약품이 어떤 특허로 보호되고 있는지, 해당 특허의 만료 시점은 언제인지 등을 객관적으로 확인할 수 있습니다.이를 통해 제약사와 연구자는 기존 특허의 보호 범위와 만료 시점을 확인해 개발 일정을 조정하거나, 특허에 저촉되지 않는 새로운 연구 방향을 검토하는 데 활용할 수 있습니다.
