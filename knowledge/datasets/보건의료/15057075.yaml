summary_user: 식약처에 등록된 원료의약품(DMF)을 등록번호 단위로 한 건씩 담으며, 성분명·업체명·제조소명과 소재지·제조국가·발급일자를 전국 범위로 제공한다. 제약사나 연구자가 "이 성분의 원료를 국내에 등록한 업체와 해외 제조소는 어디이고 언제 등록됐나"를 확인해 원료 공급처를 찾는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 성분명·업체명 문자열 매칭이나 사업자등록번호(BIZRNO)로 식약처 의약품 허가정보 등과 이어 쓴다.
description_portal: 식품의약품안전처 「원료의약품등록(DMF)현황」 OpenAPI는 등록된 원료의약품(DMF)의 현황을 조회할 수 있는 공공데이터입니다. 주요 제공항목에는 등록번호, 성분명, 업체명, 제조소명, 제조소 소재지, 제조국가명, 발급일자 등이 포함되어 있어 특정 원료의약품이 어떤 성분으로 되어 있는지, 어떤 업체와 제조소에서 생산되었는지, 언제 등록되었는지를 객관적으로 확인할 수 있습니다. 또한, 제약사 및 연구자 등은 DMF 현황 파악으로 제품 개발 시 원료 사용 가능성 및 원료 제공처 파악 등에 활용할 수 있습니다.
