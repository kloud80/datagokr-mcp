summary_user: 제주특별자치도 내 의료기관(병원급·의원급·조산원), 의료관련인력(의사·간호사·약사 등), 의약품판매업소(도매상·약국 등)를 구분·상세구분별로 개소수·병상수를 집계한 소규모 현황표(CSV 373바이트)로, 건별 기관 목록이 아닌 집계 데이터다. 분석가나 도민이 '제주도에 병원급·의원급 의료기관이 몇 곳이고 병상은 얼마나 되는가'처럼 지역 의료 인프라 규모를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상세구분 이름을 맞추는 방식으로만 이을 수 있으며, 개별 기관 단위의 인허가 원천(LOCALDATA 병의원 개폐업 등)과는 집계 수준을 맞춰 대조하는 보조 자료로 쓴다.
limits: 시도 단위 합계표라 개별 의료기관의 위치·개폐업 일자나 시군 단위 분포는 알 수 없다. 실측 컬럼에 기관코드·행정코드 같은 조인 키가 없어 다른 데이터와 자동 연결이 어렵다.
