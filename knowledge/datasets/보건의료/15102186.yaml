summary_user: 전주시에서 인허가를 받은 산후조리원을 시설 한 곳당 한 행으로 담은 건별 현황 파일로, 사업장명·인허가일자·영업상태·주소·위도·경도와 임산부·영유아 정원, 실별 면적, 간호사·간호조무사 등 인력 수를 포함한다. 출산을 앞둔 임산부와 보호자가 "전주에서 영업 중인 산후조리원 중 정원과 간호 인력이 넉넉한 곳은 어디인가"를 비교하거나, 분석가가 산후조리원 개폐업 흐름을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 위도·경도 좌표로만 이어 쓴다.
description_portal: '전북특별자치도 전주시 내 인허가를 받은 산후조리 업체에 대한 상세 현황을 제공하는 데이터입니다. 출산을 앞둔 임산부와 보호자가 안전하고 전문적인 서비스를 제공하는 산후조리원을 선택할 수 있도록 돕고, 관할 지자체가 해당 시설의 적절한 운영 및 위생 관리 상태를 감독하는 데 유용한 자료입니다.산후조리원 : 출산 이후 임산부 및 신생아의 건강과 위생을 관리하기 위한 시설항목 : 사업장명, 인허가일자, 상세영업상태, 소재지전화번호, 도로명 주소, 지번주소 등데이터 담당부서 : 건강증진과(063-281-5281), 덕진보건소(063-281-8516)'
