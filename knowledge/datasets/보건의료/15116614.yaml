summary_user: 광주 남구(전남광주통합특별시 남구)에 있는 치과의원을 한 곳당 한 행으로 담은 파일로, 의료기관명·도로명 주소·전화번호·데이터 기준일자를 담는다(파일 약 9.7KB). 주민이나 서비스 개발자가 '남구에서 우리 동네 가까운 치과는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 구 단위 구강 의료 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 붙여야 하며, LOCALDATA 의료기관 인허가 자료와 이렇게 대조하면 개폐업 흐름을 볼 수 있다.
limits: 기관 고유 코드가 없어 이름·주소 매칭에 의존하므로 동명 기관이나 주소 표기 차이에서 오연결이 날 수 있다. 범위는 남구 한 곳뿐이라 다른 구와 비교하려면 각 구 파일을 따로 모아야 한다. 진료과목·진료시간·좌표는 필드에 없다.
