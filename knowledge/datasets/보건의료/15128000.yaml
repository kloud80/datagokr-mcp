summary_user: 특정 약제 주성분(644602BIJ, 644603BIJ)이 청구된 명세서를 주상병별·진료년월별(2020년 1월~2023년 12월)로 묶어 중복을 제외한 진료인원을 담은 전국 단위 집계 파일입니다. 제약사나 보건 분석가가 '이 성분의 약이 실제로 어떤 질환에 얼마나 처방되는가'를 월별 추이로 살펴보는 데 씁니다. 전역 조인 키는 없고, 약제주성분코드로 심평원 약제급여목록표와, 주상병코드로 KCD 질병분류와 코드 매핑해 이어 씁니다.
