summary_user: 찾아가는 금연지원서비스가 실제로 방문 연계한 기관을 한 건씩 담은 전국 단위 파일로, 지역금연지원센터 등 수행기관(기관유형·기관명)과 지역, 연계기관 유형·이름, 연계일자를 기록한다. 보건소나 지역금연지원센터 담당자, 정책 분석가가 '우리 지역에서는 어떤 종류의 기관(사업장·학교 등)과 언제 금연 서비스를 연계했는가'를 확인하고 사업 평가 자료로 쓴다. 실측 컬럼에 기관코드나 행정구역코드 같은 공통 조인 키가 없어서, 다른 데이터와 붙이려면 지역명이나 기관명을 문자열로 맞춰야 한다.
limits: '전역 조인 키가 없으므로 보건소코드나 시군구코드 기반 지표(예: 지역사회 건강조사)와 바로 결합하지 못하고, 이름 매핑을 거쳐야 한다. 좌표가 없는 비공간 자료라 지도에 직접 올릴 수 없다.'
