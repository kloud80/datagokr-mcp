summary_user: 전주시 관내 공공심야약국(밤 10시~새벽 1시 운영) 7개소의 약국명·주소·전화번호를 약국 한 곳당 한 행으로 담은 소규모 현황 파일(csv, 695 bytes)이다. 전주 시민이나 방문객이 "지금 밤늦게 문 연 약국이 어디인가"를 찾거나, 지역 심야 의약품 접근성을 정리하는 분석가가 쓴다. 공통 기관코드나 좌표 같은 전역 조인 키는 없어서, 약국명이나 주소를 기준으로 다른 약국·응급의료 데이터와 직접 맞춰 이어 쓴다.
description_portal: 전북특별자치도 전주시에서 제공하는 전주시 관내의  심야 운영 및  의료 취약 시간대 의약품 구입 불편 해소와 약사의 올바른 복약지도로 의약품 오남용을 예방하여 시민의 건강보호를 위해 365일 연중 무휴 심야 시간대 밤 10시부터 새벽 1시까지 운영되는 공공 심야 약국의 관련한 데이터입니다.- 공공 심야 약국은 완산구 4개소, 덕진구 3개소로  총 7개소의 심야 약국 현황 및 정보(주소, 전화번호)를 제공하고 있습니다.- 데이터항목은 연번, 기관명, 주소, 전화번호, 비고입니다.- 부득이한 사정으로 해당 약국이 심야시간대 운영하고 있지 않을 수 있으므로, 방문 전 연락 필요
