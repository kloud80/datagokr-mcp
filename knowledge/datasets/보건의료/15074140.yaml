description_portal: 이 데이터는 국립암센터에서 수집한 PRE(선행) 위암 환자의 건강 관련 일반 정보를 포함하는 메타데이터입니다. 흡연 및 음주 여부, 운동 습관, 식습관, 기저질환(고혈압, 당뇨병 등) 유무, 체질량지수(BMI)와 같은 건강지표, 복용 중인 약물 정보, 과거 병력 등 환자의 건강 상태 및 생활 습관과 관련된 폭넓은 정보가 포함됩니다. 이 정보는 위암의 발생 위험인자 분석, 질병 진행과의 연관성 파악, 치료 반응 예측 및 예후 분석에 활용될 수 있으며, 개인 맞춤형 치료계획 수립에도 해당 메타데이터를 활용할 수 있습니다.
