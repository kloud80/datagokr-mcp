description_portal: 해당 의료기기 융복합제품정보 데이터는 식품의약품안전처에서 관리하는 의료기기 융복합제품에 대한 기본적인 정보를 제공하고 있습니다. 의료기기 융복합제품이란 의료기기와 의약품, 생물의약품, 생약(한약), 의약외품 등이 결합된 제품을 의미하며, 주된 작용 기준에 따라 분류됩니다. 이 공공데이터에는 의료기기 품목일련번호, 추적관리대상 여부, 융복합 해당 여부, 주작용 코드 및 구성 성분별 융복합 내역 코드(의료기기,의약품,생물의약품,생약(한약),의약외품 여부) 등의 목록이 포함되어 있습니다.
