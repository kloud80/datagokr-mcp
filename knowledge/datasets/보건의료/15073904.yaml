summary_user: 식약처가 관리하는 의료기기 융복합제품(의료기기에 의약품·생물의약품·생약·의약외품이 결합된 제품)에 대해 품목일련번호, 추적관리대상 여부, 융복합 해당 여부, 주작용 코드, 구성 성분별 융복합 내역을 품목 단위로 담는 전국 범위 API다. 의료기기 제조·수입 사업자나 규제 분석가가 '이 의료기기 품목이 의약품 성분이 결합된 융복합제품인지, 주된 작용은 무엇인지'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키를 찾지 못해, 의료기기 품목허가 정보 등과는 품목일련번호·제품명 매핑이나 같은 기관(식약처) 코드로만 이어 쓴다.
limits: 전역 조인 키가 확인되지 않아 심평원 급여·약가 목록 등 외부 데이터와 바로 결합하기 어렵다. 개발계정은 하루 10,000회 호출로 제한된다.
