summary_user: 급성기병원의 의료기관 인증현황을 기관 단위로 담은 원천 데이터로, 인증등급·인증주기·인증서번호·인증 시작일과 종료일을 포함하며 전국 396건(2022-11-02~2030-12-27)이다. 국민이나 분석가가 특정 병원의 인증 등급과 인증 유효기간이 어떻게 되는지 확인하는 질문에 쓴다. 의료기관 주소(insttAdres)를 조인 키로 삼아 주소 기반의 다른 의료기관 인허가 데이터와 이어 쓰며, 병의원 개폐업 같은 상권 신호 분석의 보조 자료로도 쓴다.
description_portal: 의료기관평가인증원에서 운영하는 의료기관 인증제도에 따른 의료기관 인증현황 데이터를 제공합니다.의료기관 인증제도는 의료기관으로 하여금 환자안전과 의료의 질 향상을 위한 자발적이고 지속적인 노력을 유도하여 의료소비자에게 양질의 의료서비스를 제공하기 위한 제도입니다.본 데이터는 급성기병원의 의료기관 인증현황을 오픈 API 데이터 제공하는 것으로 의료기관명, 의료기관종별, 의료기관주소, 인증등급, 인증주기, 인증서번호, 인증시작일자, 인증종료일자 등을 제공합니다.
