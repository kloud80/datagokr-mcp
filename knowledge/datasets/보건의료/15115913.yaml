summary_user: 서울특별시 중구 관할 안경업소(안경원)의 인허가 현황을 업소 단위로 담으며, 관리번호·인허가일·영업상태(영업·폐업·휴업)·폐업일·소재지 주소·중부원점TM 좌표와 시력표·렌즈절단기 등 장비 보유 수를 포함한다. 중구에서 안경원을 창업하려는 사람이 주변 영업 중 업소 수와 최근 폐업 흐름으로 경쟁 상황을 가늠하거나, 시민이 집 근처에 정식 신고된 안경원이 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 개폐업 정보는 LOCALDATA 공통 인허가 원천으로서 상권 신호로 활용한다.
description_portal: '본 데이터는 서울특별시 중구 관할 지역 내에서 시력보정용 안경 및 콘택트렌즈를 전문적으로 취급하는 업소의 영업신고 및 개설등록 현황을 통합 관리하여 제공하는 공공 정보입니다. 이 데이터는 각 업소의 관리번호, 영업 상태(개설, 폐업, 휴업 등), 구체적인 사업장 소재지 등의 주요 항목으로 구성되어 있습니다. 특히, 신규 창업자에게는 중구 내 잠재적인 시장 규모와 경쟁 현황을 파악할 수 있는 중요한 기초 분석 자료를 제공합니다. 또한, 일반 시민께서는 거주지 주변에서 정식 절차를 거친 의료기사 면허 소지자가 운영하는 안경원을 확인하고 신뢰할 수 있는 시력보정 서비스를 이용할 수 있는 근거를 마련합니다. 해당 자료를 통해 안광학 분야의 산업 동향을 파악하고, 중구의 보건 행정 업무에 대한 이해도를 높이는 데 기여하고자 합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
