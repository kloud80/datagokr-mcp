description_portal: 본 데이터는 관내 주민들의 흡연 실태와 그에 따른 행정 대응 현황을 다각도로 분석할 수 있는 종합 보건 지표입니다. 본 데이터는 연도별 추이를 바탕으로 19세부터 70세 이상까지의 연령층을 세분화하여 각 그룹별 흡연율 정보를 제공함으로써 세대별 건강 위해 요인을 정밀하게 파악할 수 있도록 돕습니다. 또한 지역 사회 내 간접흡연 피해 정도를 가늠할 수 있는 흡연 관련 민원 접수 건수와 금연구역 내 위반 행위에 대한 실질적인 집행력을 보여주는 흡연 단속 건수 실적을 함께 수록하고 있습니다. 이러한 정보의 결합은 단순한 통계를 넘어 동대문구 보건소의 금연 클리닉 운영 방향이나 단속 인력의 효율적 배치 및 연령대별 맞춤형 금연 홍보 전략을 수립하는 데 필수적인 근거가 됩니다.
