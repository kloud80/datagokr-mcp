summary_user: 경상남도 창녕군 관내 의원(동네의원)의 명칭·도로명주소·전화번호·진료과목을 기관 한 곳당 한 행으로 담은 소규모 CSV 파일(약 3.8KB)이다. 창녕 주민이 집 근처에서 소아청소년과나 정형외과를 보는 의원이 어디 있는지 찾거나, 분석가가 군내 진료과목별 의원 분포를 확인할 때 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 자료와는 의료기관명·도로명주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 경상남도 창녕군의 의료기관정보 중 의원(동네의원) 현황 데이터입니다.1. 의원의 명칭, 의원 대표자, 의원 주소(도로명주소), 진료하는 과목(내과, 외과, 안과, 소아청소년과, 이비인후과, 정형외과, 피부과, 산부인과, 비뇨의학과, 마취통증의학과, 재활의학과, 가정의학과 등), 의원의 연락처 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 8일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 데이터에 대하여 추가적인 문의사항이 있거나 세부 설명이 필요한 경우에는 창녕군청 보건소 보건정책과 의약관리팀 055-530-7523으로 문의 주시기 바랍니다.
