summary_user: 경기도 내 의료기관별 급성기 뇌졸중 진료에 대한 건강보험심사평가원 병원평가 결과를 기관 단위로 담는다. 평가내역, 평가등급, 시군, 주소, 좌표가 함께 들어 있다. 경기도 주민이나 보건 분석가가 '우리 시군에서 급성기 뇌졸중 평가등급이 높은 병원은 어디인가'를 확인하거나 응급 대응 병원 분포를 지도로 그리는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 기관명이나 시군코드(SIGUN_CD), 주소·좌표 매칭으로만 잇는다.
description_portal: 이 데이터는 건강보험심사평가원이 제공하는 자료로, 경기도 내 의료기관의 급성기 뇌졸증(Acute Stroke) 치료 수준을 평가한 병원평가 정보를 수록하고 있습니다. 급성기 뇌졸증은 뇌혈관이 막히거나 터지면서 뇌가 손상되는 질환으로, 빠른 시간 내의 적절한 입원 치료가 생존률 및 후유증에 큰 영향을 미치기 때문에 병원 선택 시 신뢰할 수 있는 지표가 중요합니다. 데이터에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 도로명 및 지번 주소, 우편번호, 위도와 경도 좌표가 포함됩니다.병원은 종합평가 점수에 따라 1등급(95점 이상)부터 5등급(55점 미만)까지 구분되며, 과정지표 10개 중 3개 이하 산출된 기관은 등급에서 제외됩니다. 이 자료는 의료기관의 급성기 뇌졸증 대응역량을 객관적으로 비교·분석할 수 있어 지역 의료체계의 질 향상, 환자 중심의 병원 선택, 보건의료정책 수립 등에 효과적으로 활용됩니다. 특히 시각화 시스템이나 위치 기반 의료정보 서비스에 연계하여 응급 상황 대응 병원 분포도 작성, 지역 격차 분석, 공공보건계획 수립 등 다양한 실무 목적에 적합합니다.Open API로 제공되어 실시간 데이터 연동이 가능하며, 의료기관의 질 관리와 시민의 정보 접근성을 동시에 만족시키는 공공 데이터로서 활용도가 높습니다.
