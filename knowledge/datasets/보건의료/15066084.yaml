description_portal: 이 데이터는 인천광역시 시민들의 만성질환 현황을 파악하고, 보건 정책 수립에 활용하기 위해 국가통계포털(KOSIS)의 자료를 참고하였습니다.주요 만성질환 6종(당뇨병, 고혈압, 이상지질혈증, 심장질환, 뇌혈관질환, 폐질환)을 대상으로 합니다.인천광역시 장애인의 만성질환(6종)에 대한 진료인원 및 진료비, 1인당 연평균 진료비 현황 등을 알 수 있는 통계 자료입니다. 작성주기는 2년입니다.활용 방안이 데이터는 보건의료 분야의 AI 학습에 매우 유용합니다. AI 모델을 활용해 특정 지역이나 연령대의 만성질환 발병률을 예측하고, 맞춤형 건강 관리 프로그램을 개발할 수 있습니다.
