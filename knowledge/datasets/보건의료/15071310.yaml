summary_user: 인천광역시 미추홀구에 있는 의약품도매업 영업소를 한 곳씩 영업소명·도로명주소·전화번호·위도·경도로 담은 업소별 목록 파일이며, 범위는 미추홀구 한 개 시군구다. 지역 보건행정 담당자나 물류·약국 관계자가 '미추홀구 안 의약품 도매업체는 어디에 몰려 있고 연락처는 무엇인가'를 지도에 찍어 확인할 때 쓴다. 전역 조인 키나 식약처 품목·업체 코드는 없으므로 다른 데이터와는 영업소명·주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구에 위치한 의약품도매업 영업소의 현황을 정리한 공공데이터입니다. 영업소명, 도로명주소, 전화번호와 함께 위도·경도 좌표를 제공하여 각 도매업체의 정확한 위치 파악과 지도 시각화를 지원합니다. 의약품과 의료용 가스 등을 취급하는 도매업체 정보를 포함하고 있어 병·의원·약국의 의약품 공급망 분석, 응급의약품 물류 거점 파악, 재난 대비 의약품 분산 보관 계획 수립 등에 활용할 수 있습니다. 또한 지역 내 보건행정, 유통 허가 관리, 민간 물류 시스템 개발 등 다양한 정책·서비스의 기초 자료로 활용 가능합니다.
