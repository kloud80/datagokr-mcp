summary_user: 전국 공동주택 금연구역의 지정·해제 현황을 단지별로 담은 파일이며, 단지마다 관할 보건소, 주소, 총세대수, 복도·계단·엘리베이터·지하주차장 4곳 각각의 찬성 세대수와 지정 여부, 지정일·해제일을 기록한다. 입주민이나 이사를 앞둔 사람이 우리 아파트 계단·지하주차장이 금연구역으로 지정됐는지 확인하거나, 분석가가 지역·보건소별 공동주택 금연구역 지정 실적을 비교하는 데 쓴다. 전역 조인 키는 없어 주소·우편번호나 관할 보건소명·지역명을 이름 매칭해 공동주택 단지 정보나 보건소·시군구 단위 건강지표와 이어 쓴다.
description_portal: 국가금연지원서비스 실적으로 국민건강증진법 제9조제5항에 따른 전국 공동주택 금연구역의 지정/해제 정보를 제공합니다.- 공동주택 금연구역 지정 범위는 공용공간인 4곳(복도, 계단, 엘레베이터, 지하주차장)이며, 공동주택의 세대 대표자(입주자 대표 또는 공동주택 관리자 등)가 공동주택 거주 세대 중 2분의 1 이상의 서명을 받아 공용공간 4곳의 전부 또는 일부를 금연구역으로 지정할 것을 신청하면 특별자치시장·특별자치도지사·시장·군수·구청장은 해당 구역을 금연구역으로 지정하고, 금연구역임을 알리는 안내 표지를 설치하여야 합니다.
