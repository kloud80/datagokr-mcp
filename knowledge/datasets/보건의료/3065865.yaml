summary_user: 경상남도 양산시 관내 의료기관을 한 행에 한 곳씩 기관명, 종별(병원·의원 등), 도로명 주소로 담은 건별 현황 파일(CSV 약 32KB)이다. 양산시민이나 지역 서비스 개발자가 '우리 동네에 어떤 종별의 의료기관이 어디에 있나'를 찾거나 시 단위 의료자원 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 붙여야 하며, 주소를 좌표로 바꾸면 지도·상권 자료와 겹쳐 볼 수 있다.
description_portal: 경상남도 양산시의 의료기관 정보를 확인할 수 있는 공공데이터입니다. 양산시 관내 의료기관의 기본현황을 시민과 이용자에게 제공하기 위한 자료입니다. 의료기관의 기관명, 의료기관 종류(종별), 주소(소재지), 연락처 등 이용에 필요한 핵심정보를 포함하여, 지역 내 의료자원 현황 파악, 의료기관 검색 및 안내 서비스 구축 등으로 활용할 수 있습니다.데이터 출처는 양산시 보건소 보건행정과, 웅상보건소입니다.의료기관의 개설, 폐업, 이전, 정보 변경 등에 따라 일부 항목이 변동될 수 있습니다. 연간 주기로 업데이트 될 예정입니다.
