summary_user: 경기도 내 인허가를 받은 치과기공소를 사업장 한 곳씩 담은 목록으로, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·위경도 좌표와 함께 기공용모터·포셀린로·진공매몰기 같은 기공 장비 보유 수량을 싣는다. 지역 보건 담당자나 분석가가 "우리 시군에 영업 중인 치과기공소는 몇 곳이고 장비 규모는 어느 정도인가", 또는 개업·폐업 흐름이 어떤가를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표로 맞춰 잇고, 같은 기관(경기도)의 다른 의료기관 인허가 현황과는 시군코드로 연결한다.
description_portal: 이 데이터는 경기도 내에 인허가를 받은 치과기공소의 현황을 수록한 자료로, 인공 치아 및 치과 보철물 제작과 보수를 담당하는 사업체에 대한 정보를 제공합니다. 주요 항목에는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 시설전화번호, 주소 정보(도로명, 지번, 우편번호, 위도·경도 좌표), 업태구분명, 좌표값 외에도 세부 기공 장비에 대한 현황이 포함됩니다.특히 기공용모터(PROCSNG_MOTOR_CNT), 초음파청소기(ULTRSND_CLENER_CNT), 진공매몰기(VACUUM_BURYMCHN_CNT), 포셀린로(POCLN_CNT), 아세틸렌(ACETLN_CNT), 전기로(ELECFRNC_CNT), 트리머(TRIMER_CNT), 서베이어(SURVYR_CNT), 기공용컴프레서(PROCSNG_COMPRSR_CNT) 등 다양한 장비의 보유 수량 정보는 기공소의 장비 규모와 기술력을 판단하는 데 활용됩니다.이 데이터는 치과 보철 산업의 기반 인프라 현황을 파악하고, 지역 내 기공 인프라 분포를 분석하거나 기공소 설립 및 인허가 현황을 관리하는 데 유용합니다. 치과의료산업의 품질관리, 기공소의 설비수준 분석, 지역 의료자원의 균형 분석 등에 활용될 수 있으며, 특히 인공치아 및 교정 장치와 같은 수요 증가에 따라 기공소의 운영실태와 장비 현대화 현황을 파악하는 기초자료로 유용합니다. Open API 형태로 제공되어 정보 접근성과 데이터 연계성이 높으며, 민간 의료기관, 공공보건기관, 산업계 모두에서 실무 활용이 가능한 구조로 설계되어 있습니다.
