description_portal: '통계개요* 통계명 : 외래환자 수진율* 통계종류 : 서울시 외래환자 수진율을 제공하는 일반·보고통계(승인번호11730)* 작성목적 : 전국 의료기관을 대상으로 일정기간 동안 의료기관을 이용한 환자의 질병,상해 양상 과 의료이용 실태, 보건의료시설 및 인력을 파악하여 보건의료정책에 필요한 기초자료제공과 보건의료통계 생산을 위한 조사로 실시* 조사체계 : 보건복지부 → 시·도 → 보건소(보건의료원) → 의료기관* 공표주기 : 정기(매년)* 공표범위 : 지역 ? 서울시내용 ? 의료기관별 외래환자 수진율(인구 10만 명당)○ 용어설명* 외래환자 : 조사기준일 당일의 초진 및 재진환자를 말하며, 산부인과에서의 산전·산후진찰, 예방접종자, 개인별 신체검사자, 시력검사자, 응급실환자는 전원 외래환자로 분류* 수진율(10만명당) : (1일 환자수 / 조사대상년도 인구) × 100,000* 종합병원 : 의사 및 치과의사가 의료를 행하는 곳으로써 입원환자 100병상 이상을 수용할수 있는 시설을 갖추고 진료과목이 적어도 내과, 외과, 소아청소년과, 산부인과,영상의학과, 마취통증의학과, 진단검사의학과 또는 병리과, 정신건강의학과 및치과가 설치되어 있고 각 과마다 필요한 전문의를 갖춘 의료기관을 말함* 병원·치과병원·한방병원 : 의사, 치과의사 또는 한의사가 각각 그 의료를 행하는 곳으로써입원환자 30병상 이상을 수용할 수 있는 시설을 갖춘 의료기관을 말함. 다만, 치과병원의경우에는 그 입원시설의 제한을 받지 아니함* 의원·치과의원·한의원 : 의사, 치과의사 또는 한의사가 주로 외래환자를 대상으로 각각 그의료를 행하는 곳으로써 진료에 지장이 없는 시설을 갖춘 의료기관을 말함* 조산원 : 조산사가 조산과 임부, 해산부, 산욕부 및 신생아에 대한 보건과 양호지도를행하는 곳으로써 조산에 지장이 없는 시설을 갖춘 의료기관을 말함* 보건소, 보건지소, 보건진료소, 보건의료원:보건소법에 의해 설치 운영되는 기관을 말함'
