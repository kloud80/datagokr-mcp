summary_user: 대전광역시 서구에 설치된 특수의료장비(MRI, CT, 유방촬영용장치)를 보유 의료기관별로 담은 시군구 단위 파일로, 기관명·전화번호·도로명 소재지·장비 종류·모델명이 한 줄씩 들어 있다(CSV 약 17KB). 주민이 서구에서 MRI나 유방촬영 장비를 갖춘 병원이 어디인지 찾거나, 분석가가 지역 내 고가 영상장비 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가 데이터와는 의료기관명이나 주소를 맞춰 이어 써야 한다.
description_portal: ○ 대전광역시 서구 특수의료장비 설치 현황 데이터 파일입니다.○ 의료기관 이름, 의료장비 명(종류), 모델명, 의료기관 전화번호와 소재지(도로명주소 포함), 기준일자 데이터를 포함하고 있습니다.○ 의료장비 종류는 MRI, CT, 유방촬영용장치 로 분류되며 실제 보유한 장비 종류는 모델명 데이터 참고 바랍니다.○ 해당 데이터는 보유 현황 및 보유 의료기관 정보만을 포함하고 있으며, 모델 기종 등에 대한 상세 설명은 의료기관에 직접 문의하시거나 메뉴얼 확인 바랍니다.○ 해당 데이터는 업데이트일자 기준 최신데이터이며, 기준일 이후 신규 취득 또는 폐기 등의 변경 신고사항이 있을 경우 실제 데이터와 차이가 있을 수 있습니다.
