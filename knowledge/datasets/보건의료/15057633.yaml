summary_user: 경기도 내 시군별 보건소를 한 곳씩 담은 개별 시설 목록으로, 보건소명·의료기관 종별·진료과목·의료인 수·병상 수·인허가일자·영업상태와 지번·도로명 주소, 위도·경도 좌표를 담는다. 지역 주민이나 보건정책 담당자가 우리 시군의 보건소가 어디에 있고 어떤 진료과목을 보는지 확인하거나 보건소 분포를 지도로 분석할 때 쓴다. 전역 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)이나 주소·좌표를 기준으로 다른 경기도 데이터나 행정구역 자료와 이름 매칭으로 잇는다.
description_portal: 정신보건시설 현황 입니다.※ 지방행정데이터개방시스템(http://www.localdata.kr) 전면 개편(데이터 통합 및 데이터 개방 중단)에 따라 데이터 갱신이 2018년 9월 6일자로 중지되었습니다.이 데이터는 경기도 내 각 시군별 보건소의 운영 현황을 나타내며, 보건소명, 의료기관종별명, 진료과목, 의료인 수, 인허가일자, 영업상태, 소재지 정보, 연면적 등 총 13개 항목으로 구성되어 있습니다. 보건소는 지역 공공의료의 핵심 역할을 수행하는 기관으로, 본 데이터는 지역 내 의료서비스 분포와 인프라 수준을 파악하고자 할 때 유용합니다. 또한 의료기관의 위치(도로명주소, 위도·경도 포함)와 함께 진료과목 정보가 포함되어 있어 지역 주민의 접근성과 진료 범위 확인에 활용됩니다. 데이터는 지방정부의 보건정책 수립, 응급의료 체계 정비, 감염병 대응을 위한 보건기반시설 관리 등 행정적 활용뿐 아니라 GIS 기반 분석에도 적합합니다.
