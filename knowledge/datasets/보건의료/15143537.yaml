description_portal: "1. 데이터명: 연도별 시군구별 진료과목별 진료 정보2. 시도/시군구: 수진자 주소지 기준(주소를 찾을 수 없는 자료 제외)3. 진료과목: 주요 진료과목 기준(진료인원 5인 미만 자료 제외)4. 진료인원 및 건수: 해당 연도에 진료받은 인원(중복제외) 및 건수(중복허용)- 진료일 기준(한의분류 제외)- 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외※ 해당 자료는 세분류(시군구별) 단위의 진료과목별 진료건수 및 진료금액 등을 확인할 수 있는 자료로, 기본적인 진료과목별 진료현황에 대한 이해를 돕고자 작성되었습니다.※ 통계자료의 정합성 확보를 위해 최근 1년(~2024년)까지의 자료로 제공됩니다.※ 개인정보보호를 위해 '5' 미만 값은 비식별화하여 제공합니다. '계' 값으로 유추가 가능한 경우 '계'값을 포함하여 비식별화합니다.※ 질병통계는 요양기관에서 환자 진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라 일차 진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정 된 질병과는 다를 수 있습니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격, 징수, 급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다."
