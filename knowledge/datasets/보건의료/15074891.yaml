description_portal: 본 데이터는 서울특별시 용산구 관내 페의약품 배출 가능한 위치 현황(폐의약품수거함과 우체통의 상세위치 및 도로명주소, 관리기관, 전화번호)에 대한 내용을 담고 있습니다. 폐의약품은 생활계 유해 폐기물의 한 종류로서 매립되거나 하수구로 버려질 경우 항생물질 등 약 성분이 토양에 유입되고 빗물 등에 의해 지하수, 하천 등으로 유입될 수 있습니다. 이 경우 생태계 교란과 지속적인 항생물질 노출로 내성균의 확산을 초래하는 등 인간의 건강에 악영향을 끼칠 수 있어 적절하게 수거되어야 하며, 매립이 아닌 소각 처리되어야 합니다. 이에 따라 폐의약품 수거함이 설치된 공공기관 및 공동주택과, 폐의약품 배출이 가능한 우체통의 위치정보를 제공하여 시민들이 가까운 수거 장소에 쉽게 배출하여 안전하게 처리될 수 있도록 합니다.폐의약품 배출방법은 가루약, 알약(조제약)은 포장 및 밀봉 상태 그대로 배출, 물약은 마개를 잘 잠그고 용기 그대로 배출, 알약(캡슐), 연고 등은 겉포장지(종이)만 제거 후 포장된 상태 그대로 배출해 주십시오. 우체통에 배출 시, 폐의약품 전용 회수 봉투 또는 일반 우편봉투에 "폐의약품" 표시를 하고 밀봉 후 배출해 주시고, 물약은 우체통에 배출할 수 없으니 다른 폐의약품 배출함 이용해 주십시오.
