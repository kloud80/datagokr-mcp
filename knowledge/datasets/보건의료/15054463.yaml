summary_user: 건강보험심사평가원이 공고한 생산·수입·공급중단 보고대상 의약품 가운데 3~8호에 해당하는 품목을 품목 단위로 담은 전국 범위 목록 파일로, 공고년도·품목기준코드·업체명·제품명·대표코드·ATC코드·전문/일반 구분을 담는다. 제약사나 도매업체가 "우리 품목이 공급중단 시 사전 보고해야 하는 대상인가"를 확인하거나, 분석가가 보고대상 의약품을 ATC 분류별로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키는 확인되지 않았으며, 품목기준코드·대표코드·ATC코드를 매개로 의약품 허가정보나 약가·급여 목록과 이름·코드 매핑으로 연결해 쓴다.
description_portal: '공급중단보고 대상인 의약품 정보로, 보고대상 의약품 각 호 중 3~8호에 대한 정보만 제공합니다.- 공고년도, 품목기준코드, 업체명, 제품명, 대표코드, ATC코드, 전문/일반 구분※ 의약품관리종합정보포털(biz.kpis.or.kr) > 의약품정보검색 > 공급중단보고대상의약품 참조※ 보고대상 의약품 중 1, 2호에 대한 정보 조회방법 · 1호: 「약제의 결정 및 조정 기준」에 따른 퇴장방지의약품은 건강보험심사평가원 홈페이지에서 조회 가능합니다. · 2호: 「희귀의약품 지정에 관한 기준」에 따른 희귀의약품은 식약처 의약품안전나라에서 조회 가능합니다.※ 현재 공급중단 보고된 의약품 목록은 식약처 의약품안전나라에서 조회 가능합니다.'
