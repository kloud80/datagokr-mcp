summary_user: 서울 강북구 안의 치과기공소(보철물·교정장치 등을 만드는 업소)를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가·취소일자, 영업상태와 폐업·휴업 일자, 주소·전화, 중부원점TM 좌표, 기공 장비 보유 수량 등을 담는다. 강북구에서 지금 영업 중인 치과기공소가 어디에 몇 곳 있는지, 최근 개업·폐업 흐름이 어떤지 확인하려는 사업자나 상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 구·시도의 같은 LOCALDATA 인허가 파일과 컬럼 구조를 맞춰 함께 쓴다.
description_portal: '서울시 강북구 치과기공소 인허가 정보: 치과 의사의 진료에 필요한 작업 모형, 보철물, 충전물, 교정 장치 따위를 전문적으로 제작ㆍ수리ㆍ가공하는 곳으로 강북구의 인공 치아를 제작하거나 보수하는 업소정보 정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
