summary_user: 전북특별자치도 김제시에서 집단급식소가 설치된 병원을 한 곳당 한 행으로 담은 원천 목록 파일로, 병원명(업소명)·도로명 주소·전화번호를 담는다(csv 906바이트의 소규모 파일). 김제시 보건·위생 담당자나 분석가가 '김제시에서 단체급식을 운영하는 병원은 어디이고 연락처는 무엇인가'를 확인해 급식 위생 점검 대상을 추리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 병원명이나 도로명 주소를 맞춰 붙여야 하며, LOCALDATA 병의원 인허가 자료나 집단급식소 신고 자료와 이름·주소 매칭으로 이어 쓴다.
description_portal: 전북특별자치도 김제시에 위치한 집단급식소가 설치된 병원 정보를 제공합니다. 본 데이터는 병원 내 집단급식소 운영 실태를 확인할 수 있는 자료로, 업소의 연번, 병원명(업소명), 도로명주소, 업소 전화번호 등을 포함하고 있습니다. 이 정보는 지역 내 집단급식소의 위생 관리 현황 파악 및 보건행정 기초자료로 활용될 수 있으며, 식중독 예방, 급식 위생 점검, 의료기관 영양관리 정책 수립 등에 유용하게 활용됩니다. 의료기관 내 단체급식 시설 운영현황을 모니터링하고, 공공 급식안전 정책 수립의 참고자료로도 활용할 수 있습니다.
