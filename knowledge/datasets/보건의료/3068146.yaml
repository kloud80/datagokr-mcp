description_portal: 대한적십자사에서 제공하는 ‘대한적십자사_재난교육 현황’ 데이터는 전국 각 지사에서 실시한 심리사회적지지, 심리적 응급처치, 재해구호 등 다양한 재난교육 프로그램의 강습번호, 강습연도, 기관명, 강습구분, 강습명, 강습기간(시작일, 종료일), 강습비, 강습장소, 정원, 수료자 수, 강습시간에 대한 609건의 세부 정보를 체계적으로 기록한 공공데이터입니다. 해당 데이터를 통해 시기별, 지역별, 프로그램 유형별 교육 실시 규모와 참여자 현황, 수료율, 강습비 등의 다양한 재난교육 현황을 파악하실 수 있습니다. 이 데이터는 지역 재난교육 수준 진단, 재난교육 수요 예측, 재난교육 정책 수립, 안전문화 확산 등을 위한 관련 연구, 분석 등 다양한 목적에 활용하실 수 있습니다.
