summary_user: 경기도 포천시 관내 병원을 기관 한 곳당 한 행으로 담은 파일로, 의료기관명·종별(정신병원·요양병원·종합병원·병원 등)·도로명주소·전화번호가 들어 있으며 파일 크기는 866바이트로 작은 목록이다. 포천 주민이나 방문객이 '포천에 요양병원이나 종합병원이 어디에 있고 연락처가 무엇인가'를 확인하거나, 행정 담당자가 시 안의 병원 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명주소를 맞춰 붙여야 하며, LOCALDATA 병원 인허가 데이터와 이름·주소로 대조해 개폐업 여부를 확인하는 식으로 이어 쓴다.
limits: 포천시 한 곳만 다루므로 다른 시군과 비교하려면 별도 데이터가 필요하다. 기관 코드 같은 공통 키가 없어 이름·주소 매칭에 의존해야 하고, 표기 차이로 연결이 어긋날 수 있다. 의원·치과·한의원은 포함 여부가 확인되지 않았고, 진료과목·병상 수 항목은 없다.
