summary_user: 광주 동구를 맡는 동부소방서 관내 119응급의료지정병원을 병원 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 1.2KB)로, 기관명·위치·진료과목·의료인·환자수용능력(병상)·데이터기준일자를 담는다. 동구 주민이나 구급·응급 분석가가 '동구에서 119 구급차가 이송하는 지정병원은 어디이고 병상과 진료과목은 어떤가'를 확인하는 데 쓴다. 전역 조인 키(기관코드·hpid·좌표)가 없어 다른 응급의료기관 데이터와는 기관명이나 주소를 직접 맞춰서만 이을 수 있다.
description_portal: '광주광역시 동구 119응급의료지정병원 현황에 대한 데이터로 각 병원별 위치, 진료과목, 의료인, 환자수용능력을 설명하는 자료입니다.119응급의료지정병원은 구급차로 이송된 응급환자가 곧바로 진료를 받을 수 있도록 소방청과 보건당국이 지정한 의료기관입니다. 심근경색, 뇌졸중, 중증 외상, 호흡곤란 같은 생명이 위급한 환자가 발생했을 때 즉시 응급처치와 전문적인 치료가 가능한 병원이 바로 이 지정병원입니다. 쉽게 말해, 119 구급대와 가장 밀접하게 연결된 지역 거점 응급병원입니다.광주 동구 관내에는 응급실을 24시간 운영하며 전문 의료진과 장비를 갖춘 병원들이 지정되어 있습니다.대학병원급 의료기관: 응급실, 중환자실, 전문 의료진이 상시 대기하고 있어 중증 응급환자 치료가 가능합니다.지역 종합병원: 교통사고나 일상적 외상·질환 환자들이 신속히 치료를 받을 수 있습니다.특정 전문 분야 병원: 심혈관계, 뇌질환, 소아·산부인과 응급환자 대응이 가능한 전문 진료 병원도 포함되어 있습니다.이들 병원은 119 구급대와 실시간 협력 체계를 유지하며, 환자 이송 전 단계에서부터 병원과 정보를 공유하여 환자가 도착 즉시 응급 처치를 이어갈 수 있도록 준비합니다.지정병원의 역할은 골든타임 확보(심정지·호흡곤란 환자는 몇 분 안에 조치가 이뤄져야 생존율이 올라갑니다. 지정병원은 이 시간을 지켜내는 최전선입니다.), 연계 치료(응급실 초기 처치 후 필요 시 상급종합병원이나 전문센터로 연계 이송을 진행합니다.), 지역 안전망 조성(지역 내 어디서든 응급환자가 발생하면 가장 가까운 지정병원으로 연결되어 시민의 생명을 지키는 안전망 역할을 합니다.) 등이 있습니다.이 데이터는 광주광역시 동부소방서 관내 119응급의료지정병원 기관명, 위치, 진료과목, 의료인, 환자수용능력 등의 항목을 제공합니다.'
