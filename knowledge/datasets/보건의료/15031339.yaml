description_portal: '이 데이터는 충청남도 부여군 관내 의료기관에 설치·운영 중인 진단용 방사선발생장치 및 특수의료장비 현황을 정리한 자료입니다. 각 행은 한 의료기관 또는 장비 단위를 의미하며, 의료기관명, 장비 종류(예: X선 촬영장치, CT, MRI 등), 설치 위치, 허가·신고 정보, 장비 수량 등 방사선·특수장비 관리에 필요한 기본 정보를 포함합니다. 이 데이터는 부여군의 진단용 방사선장치 및 특수의료장비 분포와 보유 수준을 파악하고, 방사선 안전관리, 정기점검 및 사후관리 계획 수립, 의료자원 배치·확충 전략 마련, 감염병·재난 발생 시 진단 인프라 활용계획 수립 등 각종 보건의료 행정과 통계 업무의 기초 자료로 활용할 수 있습니다.'
