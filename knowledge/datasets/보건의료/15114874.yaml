description_portal: 코로나19 팬데믹 이후 감염병 예방과 백신 접종의 중요성에 대한 사회적 인식이 크게 향상되면서, 체계적이고 접근성 높은 예방접종 서비스 제공 시스템 구축의 필요성이 중요한 보건정책 과제로 대두되고 있습니다. 영유아 필수 예방접종과 성인 대상 계절 독감, 대상포진 등 다양한 백신 접종 수요 증가로 지역 내 충분한 예방접종 인프라 확보와 접종 편의성 향상이 요구되고 있으며, 감염병 예방법에 따른 국가예방접종 프로그램의 효과적 운영과 접종률 향상을 위한 위탁의료기관 관리가 중요해지고 있습니다. 예방접종 안전성 확보와 이상반응 대응을 위한 전문 의료기관의 체계적 관리와 품질 관리 시스템 구축이 필요하며, 지역 주민들의 예방접종 접근성 향상과 의료기관 선택권 보장을 위한 투명한 정보 제공이 중요합니다. 또한 감염병 대유행 상황 대비와 신속한 대량 접종 체계 구축을 위한 위탁의료기관 현황 파악의 필요성이 증대되고 있으며, 예방접종 정책 수립과 접종 서비스 개선을 위한 기초 자료 확보가 중요하게 되어, 충청남도 보령시는 관내 53개소 예방접종 위탁의료기관의 위치, 연락처 등 지역 주민의 예방접종 서비스 이용과 감염병 예방 정책 수립에 필요한 종합적인 예방접종 위탁의료기관 현황 정보를 제공하고 있습니다.
