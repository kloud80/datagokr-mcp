summary_user: 서울 구로구 안에서 기업·학교·특수기관 등이 자체 구성원을 위해 운영하는 부속의료기관을 사업장 한 곳당 한 행으로 담은 인허가 원천 자료로, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소와 좌표, 의료인 수·병상 수·면적 등을 포함한다. 보건 담당자나 분석가가 '구로구에서 지금 영업 중인 사내·교내 부속의원은 어디에 있고 언제 생기거나 문을 닫았나'를 확인하거나 지역 의료공급 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(개방자치단체코드)로만 잇고, 좌표(X, Y)로 다른 의료기관 인허가 자료와 위치를 겹쳐 본다.
description_portal: 부속의료기관 인허가 정보는 기업·학교·특수기관 등이 자체적으로 운영하는 부속의료기관의 인허가일자, 영업상태, 소재지, 의료기관종별 등을 포함한 자료로, 일반 의료기관과는 상이한 운영 목적을 가진 의료시설의 존재를 행정적으로 관리하기 위한 데이터이다. 부속의료기관은 특정 구성원(직원, 학생 등)을 대상으로 의료행위를 제공하므로, 지역사회 전체 의료공급 체계 속에서의 역할을 이해하는 데 중요한 요소이다. 인허가 변동 정보는 기관 운영의 안정성과 법적 규제 준수 여부를 판단하는 근거가 되며, 소재지 정보는 의료서비스 분포 분석 및 응급 대응 체계 구축 시 참고된다.
