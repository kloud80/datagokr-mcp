description_portal: '지역별 한국인 남녀 20세 이상 HDL, LDL 콜레스테롤 참조표준<변수설명>(1) 확장불확도(조건: K =2, 신뢰수준 약 95 %)- 사용된 정보를 기초로 하여, 측정량에 대한 측정값의 분산 특성을 나타내는 음이 아닌 파라미터(측정결과의 불확도추정 및 표현을 위한 지침)  - 측정의 한계에서 비롯된 측정값의 불확실한 정도(2) 측정량: 지역별 남녀 20세 이상 HDL, LDL 콜레스테롤 수치(mg/dL)<참조표준>"참조표준" 이란 측정데이터 및 정보의 정확도와 신뢰도를 과학적으로 분석, 평가하여 공인된 것으로 국가사회의 모든 분야에서 널리 지속적으로 사용되거나 반복사용할 수 있도록 마련된 물리화학적 상수, 물성값, 과학기술적 통계 등을 말한다. (국가표준기본법 제3조6항) <한국인 건강지수 참조표준>"한국인 건강지수 참조표준"이란 국가건강검진을 통해 측정, 수집한 데이터를 한국인의 특성에 맞게 지역별, 성별, 연령별로 나타낸 평균, 불확도, 분위수< 이용시 준수사항 >- 한국인 건강지수 참조표준을 임의로 변경하거나 왜곡하지 않아야 합니다.- 데이터의 출처를 잘못 기재하지 않아야 합니다.- 관련 법률을 침해하거나 위반하지 않는 범위 내에서 활용해야 합니다.- 본 정보는 이용자에게 통보 없이 추가, 변경, 개선, 업데이트될 수 있습니다.- 국민건강보험공단은 본 정보에 포함된 오류, 누락 등 정보의 품질 또는 정보의 활용으로 인한 손해?손실에 대한 책임을 부담하지 않습니다.- 또한, 서비스 장애 등으로 발생한 활용자의 손해에 대한 책임을 지지 않습니다.- 국민건강보험공단은 본 정보를 매개로 제3자와 발생한 분쟁에 대하여 개입할 의무가 없음을 알려드립니다.- 본 자료의 이용에 대한 책임은 전적으로 이용자에게 있음을 알려드립니다.'
