summary_user: 질병관리청 청소년건강행태조사 결과로 산출한 청소년 현재 음주자의 위험 음주율과 문제 음주율을 연도·지표 구분별로 전체, 성별, 중1~고3 학년별 비율로 담은 전국 단위 집계 파일이다. 절주·음주폐해예방 연구자나 정책 담당자가 '청소년 음주자 중 위험 음주 비율이 성별·학년에 따라 어떻게 다르고 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 청소년 건강행태 지표와는 연도·성별·학년 구분을 이름으로 맞춰 이어 쓴다.
limits: 전국 단위 비율만 있어 시도·시군구 같은 지역별 비교나 개인 단위 분석에는 쓰지 못한다. 포털 설명상 문제 음주율은 2018년부터 미발표라 최근 연도에는 값이 없을 수 있다. 공통 코드 키가 없어 다른 데이터와는 연도·구분 이름 매칭으로만 연결된다.
