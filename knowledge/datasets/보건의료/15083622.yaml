description_portal: '본 데이터는 한국보건의료인국가시험원에서 시행하는 한약사 국가시험 응시자의 현황을 분석할 수 있는 데이터를 제공합니다.(자료 기준일 : 2026. 6. 2. 기준) 시험 연도,  시험 직종, 시험 회차,성별, 연령대, 응시지역, 졸업여부, 합격여부, 학교소재지를  개인을 식별할 수 없는 형태로 제공합니다. 이 데이터는 다음과 같은 목적과 활용 가능성을 가지고 있습니다.1.  자격시험 응시 현황에 대한 기초 통계 정보를 제공합니다.2. 한약사 분야 인력 수급 및 교육 현황 분석에 활용할 수 있습니다.3. 공공데이터 분석 및 민간 활용 기반에 활용할 수 있습니다.'
