description_portal: '서울특별시 서초구 내 의료유사업소의 인허가 현황을 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명 등 기본 정보와 함께 의료유사업종별, 종업원 수, 자격증 소유자 수, 시설관리자 수, 병상 수, 욕실 수, 총면적 등 다양한 운영 정보를 포함하고 있습니다. 이를 통해 안마시술소 등 의료유사업 창업 준비, 업소 현황 분석, 위생 및 안전관리, 관련 정책 수립 등에 활용할 수 있습니다. 또한 해당 데이터는 지역 내 의료유사업소의 분포와 운영 실태를 파악하고, 서비스 품질 향상, 위생관리 강화, 이용자 안전 확보를 위한 행정·연구 분야의 기초 자료로 유용하게 쓰일 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
