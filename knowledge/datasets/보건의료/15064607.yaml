summary_user: 국민건강보험 가입자와 의료급여수급권자 가운데 해당 연도에 고혈압(주상병 I10~I15이면서 고혈압 약제 처방)으로 진료받은 환자의 비율을 전국 시군구 단위로 집계한 파일로, 연도별 분모·분자 인원과 비율(%)을 담는다. 보건 분석가나 지자체 담당자가 "우리 시군구의 고혈압 진료율이 전국 다른 지역보다 높은가, 해마다 어떻게 변하는가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름과 지표연도를 매핑해서만 이어 쓴다.
limits: 집계 비율 자료라 개인·의료기관 단위 분석이나 연령·성별 세분은 이 파일에서 하지 않는다. 공단 자격 기준 수치이므로 심평원 청구 기준 통계와 값이 다를 수 있다. 행정코드가 없어 시군구 이름 변경·통폐합이 있으면 매핑을 직접 맞춰야 한다.
