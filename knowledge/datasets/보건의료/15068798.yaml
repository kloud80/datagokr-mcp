summary_user: 인천광역시 서구 안에서 안전상비의약품을 파는 편의점 등 약국 외 판매업소를 점포 한 곳당 한 행으로 담은 파일로, 점포명·도로명 주소·등록일자·데이터기준일자를 담는다. 시민이 밤이나 휴일에 "우리 동네에서 감기약·해열진통제를 살 수 있는 편의점이 어디인가"를 찾거나, 분석가가 지역별 상비약 판매처 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소를 지오코딩하거나 점포명을 맞춰 이어야 하고, 식약처 품목코드 같은 의약품 코드와는 직접 연결되지 않는다.
description_portal: 본 공공데이터는 인천광역시 서구 내 안전상비의약품 판매업소의 점포명, 도로명 주소, 등록일자 등 기본 정보를 제공하고 있습니다. 본 데이터는 편의점 등 약국 외 판매처에서 구매 가능한 감기약, 해열진통제, 소화제 등 안전상비의약품의 접근성을 향상시키고자 구축되었습니다. 본 자료는 시민들이 긴급상황에서 쉽게 의약품을 구입할 수 있도록 안내하는데 활용되며, 의약품 안전정책 수립을 위한 기초자료로도 활용될 것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
