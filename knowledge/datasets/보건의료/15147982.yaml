summary_user: 전국에 설치된 자동심장충격기(AED)를 설치 장소 한 곳씩 담은 건별 목록으로, 설치 주소·설치 위치 설명·관리 책임자와 연락처·제조사와 모델·관리 기관·시도명·위경도 좌표를 포함한다. 시민이나 응급 대응 서비스 개발자가 '지금 내 위치에서 가장 가까운 AED는 어디이고 건물 안 어디에 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 위경도(LAT·LOT) 좌표로 공간 결합하거나 주소·시도명을 이름으로 맞춰 응급의료기관 등 다른 데이터와 잇는다.
description_portal: "- 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국립중앙의료원 중앙응급의료센터에서 수집하는 데이터를 행정안전부 생활안전지도 시스템에서 제공받아 공유하는 데이터입니다."
