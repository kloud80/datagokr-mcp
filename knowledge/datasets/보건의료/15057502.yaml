summary_user: 경기도 내 의원급 한의원을 사업장 한 곳당 한 행으로 담은 인허가 원천 데이터로, 시군 코드·이름, 인허가일, 영업상태와 폐업일, 의료인 수·병상 수·병실 수·면적, 지번·도로명 주소와 위경도를 포함한다. 시군별로 한의원이 얼마나 분포하는지, 최근 어느 지역에서 개업·폐업이 늘었는지를 보려는 보건정책 담당자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 시군명, 주소·좌표를 매핑해 잇는다.
description_portal: 이 데이터는 경기도 내 의원급 한의원의 현황을 정리한 자료입니다. 의원급 한의원은 지역 주민을 대상으로 한방 진료와 보건의료 서비스를 제공하는 1차 의료기관으로, 본 자료를 통해 지역별 한방 의료자원의 분포와 규모를 파악할 수 있습니다. 특히 의료인 수와 시설 면적은 기관의 진료 역량을 가늠할 수 있는 지표로 활용되며, 위치 정보는 지역 간 의료 인프라 불균형 분석에 유용합니다. 이 데이터는 보건 정책 수립, 한방의료 서비스 접근성 개선, 지역 주민 건강 증진 전략 마련에 기초 자료로 활용될 수 있습니다.
