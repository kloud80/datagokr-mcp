description_portal: '- 전라남도 보건환경연구원 홈페이지에 게시된 폐수 및 폐기물 관련 검사항목과 수수료에 관한 사항을 정리한 파일입니다.- 폐수와 침출수는 모두 환경오염의 주요 원인으로, 각각의 특성과 처리 방식에 따라 관리가 필요합니다.- 폐수 (Wastewater) 정의 : 산업, 농업, 생활 등 다양한 활동에서 발생하는 오염된 물로, 유기물, 무기물, 화학물질 등이 포함되어 있습니다.- 특징 : 일상적인 오염물질이 포함되어 있으며, 일반적으로 하수 처리 시설을 통해 정화됩니다.- 침출수 (Leachate) 정의 : 폐기물 매립지에서 폐기물과 빗물 등이 반응하여 생성되는 오염된 액체로, 유기물, 무기물, 중금속 등이 포함되어 있습니다.- 특징 : 매립지의 연차와 기후 조건에 따라 성분이 달라집니다. 고농도의 오염물질이 포함되어 있어 정화가 어렵습니다.'
