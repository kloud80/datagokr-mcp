description_portal: '음주폐해예방 관련 지표- 질병관리청 청소년건강행태조사 결과를 활용하여, 청소년을 대상으로 위험 음주율과 문제 음주율을 산출한 것입니다. - 위험 음주율은 최근 30일 동안 1회 평균 음주량이 중등도 이상인 사람의 분율(남자: 소주 5잔 이상, 여자: 소주 3잔 이상)을 의미하며, 문제 음주율은 최근 12개월 동안 음주 후 문제행동을 두 가지 이상 경험한 적이 있는 사람의 분율을 의미합니다.- 2018년 이후 문제음주율 통계는 미발표되었습니다.- 본 데이터는 청소년 음주폐해예방 및 절주문화 확산 관련 연구 시 기초자료로 활용할 수 있습니다.'
