summary_user: 대체 재발급된 의료기기 GMP 적합인정서를 품목 단위로 담은 건별 원천 데이터로, 재발급 순번·심사신청 품목허가번호·품목군·분류번호·품목명·모델명·제조의뢰자와 제조자(국가·명칭·주소)를 전국 범위로 담는다. 의료기기 제조·수입업체나 품질 담당자가 "이 품목의 GMP 적합인정서가 대체 재발급됐는지, 실제 제조자는 어느 나라 어느 업체인지"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 품목명·업체명 같은 이름 매핑이나 같은 식약처 데이터의 품목허가번호·분류번호(MDEQ_CLSF_NO)로만 이어 쓴다.
limits: 전역 조인 키가 없어 심평원 급여 목록 등 다른 기관 데이터와 바로 연결하기 어렵고, 이름·코드 매핑에 의존해야 한다. 호출에는 포털 활용신청(자동승인) 후 받은 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
