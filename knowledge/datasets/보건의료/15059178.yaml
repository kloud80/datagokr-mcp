summary_user: 경기도 내 의원급 의료기관을 사업장 한 곳당 한 행으로 담은 인허가 원천 데이터로, 시군, 사업장명, 인허가일자·폐업일자, 영업 상태, 병상 수, 의료인 수, 입원실 수, 진료과목, 주소와 위경도를 포함한다. 분석가나 사업자가 '우리 시군에 소아청소년과 의원이 몇 곳 영업 중이고 최근 폐업이 늘었는가' 같은 1차 의료 분포·개폐업 추세를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군 코드·이름(SIGUN_CD), 정제 주소·우편번호, 위경도 좌표를 이용해 다른 경기도 데이터나 행정구역·공간 데이터와 이름·주소·좌표 매칭으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 의원급 의료기관의 현황을 정리한 자료로, 병원명, 인허가일자, 영업 상태, 병상 수, 의료인 수, 입원실 수, 진료과목 등의 정보를 포함하고 있습니다. 의원급 의료기관은 지역 주민이 가장 쉽게 접근할 수 있는 1차 진료기관으로, 내과·외과·소아청소년과·이비인후과 등 다양한 진료과목을 운영하며 일상적 건강 관리와 초기 진단을 담당합니다. 본 자료는 시군별 의원급 의료기관의 분포와 규모, 진료과목 다양성, 인력 현황을 파악하는 데 유용하며, 이를 통해 지역 간 의료 격차 분석과 1차 의료 서비스 강화 정책 수립에 활용될 수 있습니다. 또한 고령화 및 만성질환 관리 체계 마련, 응급환자 연계 체계 설계, 지역 보건소와의 협력 모델 구축에도 기초 자료로 활용될 수 있습니다.
