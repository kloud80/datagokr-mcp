summary_user: 식약처가 허가한 의료기기 제조업·수입업 업체를 건별로 담으며, 업체명·허가일자·소재지·휴폐업 상태·체외진단용 여부 등이 들어 있고 전국 15,854건 규모다. 국민이나 사업자, 분석가가 특정 의료기기 수입업체가 허가를 받았는지, 휴업이나 폐업 상태는 아닌지 확인하는 질문에 쓴다. 사업자등록번호(BRNO)와 소재지 주소(ENTP_ADDR)를 조인 키로 삼아 다른 사업자·인허가 데이터와 이어 쓰며, 품목 단위 코드는 이 데이터의 키에 없다.
description_portal: 이 공공데이터는 식품의약품안전처에서 제공하는 의료기기 수입 및 제조 업허가 상세에 관한 공공데이터입니다. 의료기기 제조 또는 수입을 업으로 하려는 자는 식품의약품안전처장의 허가를 받아야 하며, 의료기기 제조업 또는 수입업 허가를 받은 업체명, 업종, 허가일자, 소재지 등 인허가 현황 관련 정보를 제공하고 있습니다. 사용자는 국내 의료기기 제조업체 혹은 수입업체에 관한 전반적인 정보를 한눈에 파악할 수 있습니다. 업소의 휴폐업 상태와 체외진단용 의료기기 여부도 확인 가능합니다.
