description_portal: 한전KDN(주)소화기설비 관리현황과 관련된 데이터로 사내 분말 소화기 보유 현황입니다.번호,위치,층,품목,제조업체명,제조년월,세부위치,관리번호  항목을 제공하고 있습니다.이 데이터를 통해 한전KDN의 소방 안전 관리 노력을 투명하게 공개하고, 시설 이용자들의 안전을 확보하고자 합니다.또한, 소방 설비 관리 기준 준수 여부 확인 및 개선 방안 마련을 위한 기초 자료로 활용될 수 있습니다.본 데이터는 공공기관의 안전 관리 책임 이행을 입증하고, 관련 이해관계자들이 시설 안전 현황을 명확히 파악할 수 있도록 지원합니다.사용법1.고정되어 있는 벨트를 앞으로 당겨 풀고 소화기를 꺼냅니다.2.왼손으로 손잡이를 잡고 오른손 검지손가락으로 안전핀을 당겨 뽑습니다.3.노즐을 잡고 불이 난 곳을 향하게 한 다음 바람을 등지고 손잡이를 누릅니다.
