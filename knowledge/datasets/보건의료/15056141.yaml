summary_user: 제주시 안의 보건지소와 보건진료소를 기관 한 곳당 한 행으로 정리한 목록 파일(csv, 약 3.7KB)이다. 각 행에는 기관 유형(구분), 명칭, 위치, 담당 관할구역, 전화번호, 데이터기준일자가 들어 있다. 제주시민이나 보건행정 담당자가 '우리 마을(읍·면·동)을 맡는 보건지소·진료소는 어디이고 연락처는 무엇인가'를 확인할 때 쓰며, 전역 조인 키나 기관코드가 없어 다른 데이터와는 기관 명칭이나 위치(주소) 문자열을 맞춰 붙여야 한다.
description_portal: 이 데이터는 제주특별자치도 제주시 소재 보건지소 및 보건진료소 현황을 정리한 공공데이터입니다.해당 데이터의 담당 부서는 제주보건소이며, 제주시 지역 내 보건지소와 보건진료소의 운영 현황을 한눈에 파악할 수 있도록 구성되어 있습니다.데이터 항목은 구분, 명칭, 위치, 관할구역, 전화번호로 이루어져 있습니다.구분 항목을 통해 보건지소와 보건진료소를 유형별로 확인할 수 있으며, 명칭과 위치 정보를 통해 각 기관의 기본 현황과 소재지를 파악할 수 있습니다.또한 관할구역 항목에는 각 기관이 담당하는 지역 정보가 포함되어 있어, 지역별 보건서비스 제공 범위를 확인하는 데 활용할 수 있습니다.이 데이터는 제주시민이 가까운 지역 보건의료기관 정보를 쉽게 확인할 수 있도록 돕는 기초자료이며, 지역 보건행정 업무, 공공보건 서비스 안내, 생활권 건강정보 제공 등 다양한 목적으로 활용할 수 있습니다.
