summary_user: 경기도 내 응급의료기관을 기관 1곳당 한 행으로 담은 현황 자료로, 시군명·병원명·업무 구분(지역응급의료기관/지역응급의료센터)·대표전화·도로명·지번 주소·우편번호·위도·경도를 포함한다. 경기도민이나 분석가가 '우리 시군에서 가장 가까운 응급의료기관은 어디이고 연락처는 무엇인가', '응급의료기관이 부족한 시군은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 병원명·주소 매칭, 시군명 매칭 또는 좌표(WGS84 위도·경도) 기반 공간 결합으로 연결한다.
description_portal: 이 데이터는 경기도 내 응급의료기관의 현황을 시군 단위로 정리한 자료로, 각 병원의 명칭, 업무 구분(지역기관 또는 지역센터), 대표전화번호, 도로명 및 지번 주소, 우편번호, 그리고 병원의 위도·경도 좌표 정보 등을 포함하고 있습니다. 이 데이터는 응급환자의 신속한 이송 및 응급의료 접근성을 높이기 위한 기초 자료로 활용되며, 지역 응급의료체계 구축 및 정책 수립에 기초 데이터로 쓰일 수 있습니다. 또한 위치 기반 분석을 통해 지역 간 응급의료 서비스 분포의 불균형 해소나 병원 접근성 개선 전략 수립에도 유용합니다.
