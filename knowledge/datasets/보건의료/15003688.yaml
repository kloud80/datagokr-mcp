summary_user: 국립공주병원이 원내에서 사용하는 의약품 목록을 약품 한 품목당 한 행으로 담은 파일로, 약품코드·영문명·한글명·규격과 주성분의 코드·한글명·영문명을 담는다(csv 약 29KB). 정신건강 진료 병원에서 어떤 약품과 성분을 쓰는지 확인하려는 분석가나 연구자가 '이 병원 원내 처방집에 어떤 성분의 약이 있는가'를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 식약처 허가정보나 심평원 약가 목록과는 약품명·성분명 매핑이나 성분코드 대조로만 이어 쓴다.
description_portal: 보건복지부 국립공주병원에서 사용하고 있는 의약품 목록 데이터입니다.구분 항목은 약품 코드, 약품 영문명, 약품 한글명, 규격, 성분코드, 성분 한글명, 성분 영문명으로 구성되어 있습니다.약품 영문명과 약품 한글명은 표준 명칭 사용으로 의약품 검색을 통해 해당 약품의 정보 확인이 가능하며, 성분 한글명은 해당 약의 주 성분을 확인하실 수 있습니다.보건복지부 국립공주병원에서 제공하는 이 데이터는 병원 내에서 의약품의 처방 및 사용 현황을 분석하거나, 의료 서비스의 질을 향상시키는 자료로도 활용될 수 있습니다.
