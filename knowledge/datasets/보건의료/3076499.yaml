summary_user: 부산광역시 16개 구·군 보건소의 명칭, 우편번호, 도로명 주소, 대표 전화·팩스번호, 위치 설명과 위도·경도를 보건소 한 곳당 한 행으로 담은 작은 현황 파일(약 2KB CSV)이다. 시민이 "우리 구 보건소가 어디 있고 대표번호가 무엇인가"를 찾거나, 분석가가 부산 보건소 위치를 지도에 찍고 주변 인구·시설과의 접근성을 볼 때 쓴다. 전역 조인 키나 보건소코드·시군구코드 컬럼이 없어, 다른 데이터와는 보건소명(구·군 이름) 매핑이나 위도·경도 좌표로 이어 쓴다.
description_portal: '부산광역시 소재 16개 구(군) 보건소 기본 정보인 보건소 명칭, 전화번호, 주소 등 현황에 대한 자료를 제공합니다.1. 보건소명: 16개 구군 보건소 명칭    -중구,서구, 동구, 영도구, 부산진구, 동래구, 남구, 북구, 해운대구, 사하구, 금정구, 연제구, 강서구, 수영구, 사상구, 기장군2. 우편번호3. 주소: 도로명 주소4. 전화번호: 보건소 대표번호5. 팩스번호: 보건소 대표 팩스번호6. 위치(위도, 경도 포함): 보건소 위치 찾기 상세설명 및 위도, 경도 정보 이 외 보건소  사업담당자 연락처, 부서별 추진사업및 사업내용, 사업별 프로그램 안내 등은 보건소 개별 홈페이지를 활용하시기 바랍니다.'
