description_portal: '기관생명윤리위원회 정보포털(https://irb.or.kr)은 국가생명윤리정책원이 운영하는 홈페이지로,「생명윤리 및 안전에 관한 법률」에 따른 기관위원회의 설치 및 등록, 운영에 관한 정보를 제공 및 공유하여 이용자의 법률 및 관련 정책에 대한 이해도를 높이기 위해 마련되었습니다. 해당 공공데이터는  기관생명윤리위원회(IRB) 인증기관 현황 안내, 기관생명윤리위원회 인증 결과 공고 등 기관생명윤리위원회 정보포털 공지사항의 게시글과 첨부파일 데이터를 포함합니다.(데이터 산출기간: 2025년 1월 1일~2025년 12월 31일)'
