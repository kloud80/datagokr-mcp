summary_user: 국립나주병원이 입원·외래 진료비를 건강보험심사평가원·근로복지공단 등에 청구한 현황을 년월 단위로 집계한 통계 파일로, 건강보험·의료급여·기타(산재 및 자동차보험)별 청구 건수, 청구액, 실지급액을 담는다. 공공의료 분석가가 이 병원의 보험 유형별 진료비 청구액과 실제 지급액 차이가 월별로 어떻게 변했는지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 년월이나 기관명을 기준으로 직접 맞춰 이어야 한다.
