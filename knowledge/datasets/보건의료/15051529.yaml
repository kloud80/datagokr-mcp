summary_user: 근로복지공단 직영 산재병원(인천·안산·창원·대구·순천·대전·태백·동해·정선·경기·서울 등)별로 입원·외래 환자 수(연명 기준)를 2005년부터 2025년까지 연도별 열로 집계한 소규모 통계 파일(csv 약 3.7KB)이다. 정책 담당자나 분석가가 "태백·정선 같은 광업 지역 산재병원의 입원·외래 환자가 20년간 어떻게 줄거나 늘었나"를 확인해 병상·인력 조정 근거로 삼는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 병원 이름(산재병원)을 기준으로 의료기관 인허가 정보 등과 직접 매핑해야 한다.
