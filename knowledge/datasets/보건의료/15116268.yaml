description_portal: 본 데이터는 희귀질환 진단·치료 목적 등으로 국내에 대체 제품이 없어 식품의약품안전처장이 긴급 도입 필요성을 인정하거나 안정적 공급 지원이 요구되는 의료기기 현황을 제공한다. 제품명, 모델명, 제조사·제조국, 사용목적, 치료재료 등재 여부 및 코드, 최초등재일, 포장단위, 공급가 등 주요 속성을 갖추고 있어 임상현장, 정책 수립, 보험 급여 검토 및 시장 접근성 분석에 활용 가능하다. 법령 근거인 「희귀질환관리법」 관련 정의를 반영하며, 지정 제품의 식별과 추적, 수입·공급 지원 근거 마련, 대체 불가 치료재료의 공공성 확보에 기여한다. 최신 데이터는 반기 주기로 갱신되어 현행성 확보에 유리하다. 조달·급여 검토의 근거로 유용하다.
