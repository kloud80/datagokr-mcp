summary_user: 서울특별시 은평구에 신고된 치과기공소를 업소별 한 행으로 담은 인허가 원천 데이터로, 상호명·지번/도로명 주소·인허가일·폐업일·영업 상태와 함께 기공용 장비 보유 수량(전기로, 진공소성로 등) 항목, 중부원점TM 좌표(X, Y)를 포함한다. 치과 의원이나 구민이 은평구에서 정식 신고된 치과기공소가 현재 영업 중인지 확인하거나, 분석가가 지역 내 치과기공소 개업·폐업 추이를 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, LOCALDATA 공통 인허가 형식이므로 다른 구의 같은 업종 데이터와 같은 컬럼 구조로 이어 붙여 쓴다.
description_portal: '은평구의 인공 치아를 제작하거나 보수하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 「의료기기법」에 따라 인공 치아(틀니, 브릿지, 크라운 등)를 제작하거나 수리·보수하는 치과기공소의 인허가 현황을 담고 있습니다. 데이터에는 각 치과기공소의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같이 의료기기 제조업 관리의 핵심적인 정보가 포함되어 있습니다.치과기공소는 치과의사의 처방에 따라 환자 개인별 맞춤형 치과보철물(의치, 교정장치, 임플란트 등)을 정밀하게 제작하는 전문 의료기기 제조업체입니다. 이 업종은 관할 구청에 신고해야 하며, 치과기공사 면허를 소지한 전문 인력과 적절한 시설 기준을 갖춰야 합니다. 특히, 환자의 구강 건강과 직결되는 의료기기를 다루므로 철저한 위생 관리와 품질 관리가 필수적입니다.이 데이터는 치과 병원이나 의원에서 정식으로 신고된 신뢰할 수 있는 치과기공소를 확인하고 선택하는 데 도움을 줍니다. 또한, 지자체는 이를 기반으로 지역 내 치과기공소 현황을 파악하고 정기적인 위생 점검을 실시하는 등 구민의 구강 건강과 의료 안전을 확보하기 위한 핵심적인 기초 자료로 활용합니다.'
