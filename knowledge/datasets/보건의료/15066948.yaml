summary_user: 부산 연제구 관내에서 의료법에 따라 개설 신고·허가된 병원급·의원급 의료기관을 기관 한 곳당 한 행으로 담은 명부 파일로, 기관명·종별·도로명 주소와 우편번호·전화번호를 담는다(파일 약 38KB). 주민이 연제구에서 가까운 의원이나 치과·한의원을 찾거나, 분석가가 동네별 병의원 분포를 상권 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소(의료기관주소(도로명))를 맞춰 LOCALDATA 인허가 자료나 다른 시군구 의료기관 현황과 이어 쓴다.
description_portal: '연제구 관내 병원급 및 의원급 의료기관에 관한 데이터로서, 의료기관 명칭, 소재지(도로명), 종별 등 정보가 제공되는 데이터 입니다.의료법 제33조(개설 등), 같은 법 시행규칙 제25조(의료기관 개설신고), 제27조(의료기관 개설허가)에 의거하여 인허가된 의료기관 정보입니다.각 항목별 설명으로는 다음과 같습니다.- 명칭: 의료기관 명칭을 나타냅니다- 소재지: 의료기관의 소재지(도로명)를 나타냅니다- 종별: 의료기관 종류를 나타냅니다의료법 제33조①의료인은 이 법에 따른 의료기관을 개설하지 아니하고는 의료업을 할 수 없으며, 다음 각 호의 어느 하나에 해당하는 경우 외에는 그 의료기관 내에서 의료업을 하여야 한다.1. 「응급의료에 관한 법률」 제2조제1호에 따른 응급환자를 진료하는 경우2. 환자나 환자 보호자의 요청에 따라 진료하는 경우3. 국가나 지방자치단체의 장이 공익상 필요하다고 인정하여 요청하는 경우4. 보건복지부령으로 정하는 바에 따라 가정간호를 하는 경우5. 그 밖에 이 법 또는 다른 법령으로 특별히 정한 경우나 환자가 있는 현장에서 진료를 하여야 하는 부득이한 사유가 있는 경우'
