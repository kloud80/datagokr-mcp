summary_user: 여수시 관내에서 운영 중인 약국과 한약국을 한 곳씩 담은 목록 파일로, 포털 설명 기준 약국 119개소·한약국 12개소의 구분, 명칭, 도로명 소재지, 전화번호를 담는다. 시민이 생활권 근처에서 문을 연 약국이나 한약국을 찾고 연락처를 확인할 때, 분석가가 여수시 안의 약국 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 약국명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
