summary_user: 대구광역시 서구 치매안심센터가 지정한 치매안심약국을 약국 한 곳당 한 행으로 담은 명단으로, 등록번호·약국명·소재지 주소·대표자명·전화번호를 제공하며 범위는 서구 한 시군구입니다. 서구 주민이나 치매 환자 가족이 '우리 동네에서 치매 상담과 정보 안내를 받을 수 있는 약국이 어디인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 약국명이나 소재지 주소를 매칭하거나, 같은 기관(대구 서구) 데이터끼리만 연결한다.
limits: 약국 코드나 시군구 코드 같은 공통 키가 없어 건강보험 약국 목록 등과 이으려면 이름·주소 문자열 매칭에 의존해야 한다. 대구 서구 한 곳만 다루므로 다른 지역의 치매안심약국은 이 데이터로 찾을 수 없다.
