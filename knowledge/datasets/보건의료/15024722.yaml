summary_user: 부산광역시 동구 의료기관이 보유한 특수의료장비 현황을 기관별로 담은 작은 파일(약 1.5KB CSV)로, 의료기관명·종별·소재지·장비 종류와 총병상수·자체병상수·공동활용병상수를 담는다. 동구 주민이나 분석가가 'CT·MRI 같은 특수의료장비를 갖춘 동구 병원이 어디이고 병상을 공동활용하는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 자료와는 의료기관명이나 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 부산광역시 동구 의료기관의 특수의료장비 보유 현황(의료기관명, 총 병상수, 자체 병상수, 공동활용 병상수 등) 정보를 제공합니다. 제공되는 정보에는 의료기관명, 소재지, 공동활용병상 여부 등의 항목이 포함됩니다. 이 데이터는 특수의료장비 운영의 효율성을 높이고 지역 의료서비스의 접근성 향상에 도움이 됩니다. 이를 통해 지역 주민에게 보다 안전하고 신뢰할 수 있는 의료서비스 제공에 기여합니다. 또한, 변경 사항 발생 시 최신 정보가 반영될  수 있도록 지속적으로 관리됩니다. 기타 자세한 사항은 부산광역시 동구 의약팀(051-440-6568)으로 문의하시면 안내해 드리도록 하겠습니다.
