description_portal: '국민건강보험공단_특정 수가코드 그룹별 연도별 진료인원1. 주상병코드: A00~N99 또는 P00~T98  * 주상병코드별 코드명은 질병분류정보센터(https://www.koicd.kr/kcd/kcd.do)에서 확인 가능2. 수가코드: 청구인 요청에 의한 구분 ① 인공심박동기삽입술 : O0203, O0204, O2004, O0230 ② 이식형제세동기삽입술 : O0211, O2211 * 수가코드 정보는 건강보험심사평가원 진료행위코드 조회(https://opendata.hira.or.kr/op/opc/olapDiagBhvInfoTab1.do#none)에서 확인 가능 3. 심사년도: 2018~2022년4. 연령: 5세 단위, 연말기준5. 진료인원: 해당 연도에 진료받은 인원(중복제외)  - 심사일 기준(한의분류 제외, 약국 제외)  - 건강보험 및 의료급여 실적이며, 비급여는 제외  - 2023년 6월 심사분까지 반영※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터'
