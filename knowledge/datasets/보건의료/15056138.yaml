description_portal: '공공데이터에 등록된 본 데이터는 경상남도 내 의료법인 현황을 제공합니다. 상세 제공 주요 항목으로는 일련번호, 도, 시군, 법인명, 주요운영의료기관명, 소재지, 연락처 등  정보들을 제공합니다.  * 참고 : 경상남도 관할 시군명 안내(창원시 창원, 창원시 마산, 창원시 진해, 진주시, 통영시, 사천시, 김해시, 밀양시, 거제시, 양산시, 의령군, 함안군, 창녕군, 고성군, 남해군, 하동군, 산청군, 함양군, 거창군, 합천군) * 참고 : 의료법인 설립 : 의료법 제48조(설립 허가 등) ①제33조제2항에 따른 의료법인을 설립하려는 자는 대통령령으로 정하는 바에 따라 정관과 그 밖의 서류를 갖추어 그 법인의 주된 사무소의 소재지를 관할하는 시ㆍ도지사의 허가를  받아야 한다.'
