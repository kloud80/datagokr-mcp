description_portal: '부산광역시 서구 코로나 확진자 현황에 대한 데이터입니다.코로나19 유행 시기 동안 지역사회 감염 추세를 파악하고, 방역 정책의 효과성 검토 및 향후 감염병 대응 전략 수립을 지원하는 데 목적이 있습니다.데이터에는 월별 확진자 수, 누적 확진자 수, 사망자 수, 관리기관 등의 항목이 포함되어 있으며, 이를 통해 기간별 감염 추세, 증가·감소 시점 분석, 방역 정책의 영향 등을 체계적으로 확인할 수 있습니다.예시 데이터에는 2020년 2월부터 2021년 12월까지 약 2년간의 월별 확진자 발생 현황이 포함되어 있으며, 초기 소규모 감염부터 대규모 확산기까지의 변화 추이를 한눈에 파악할 수 있습니다.** 항목별 설명연번: 데이터의 순번월별: 확진자 통계가 집계된 연월확진자 수: 해당 월에 신규 발생한 확진자 수총 확진자: 해당 시점까지의 누적 확진자 수사망자수: 해당 월에 발생한 코로나19 관련 사망자 수관리기관: 데이터를 수집·관리하는 기관명 (부산광역시 서구)'
