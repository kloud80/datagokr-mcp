summary_user: "충청남도 서산시 관내 의료기관을 기관 한 곳당 한 행으로 정리한 파일로, 종별·기관명·도로명 우편번호와 주소·전화번호·병상 수·데이터 기준일을 담는다(약 18KB CSV). 서산시민이나 보건행정 담당자가 '우리 동네에 어떤 종별의 병의원이 있고 병상은 얼마나 되는가'처럼 관내 의료시설 분포와 병상 규모를 확인할 때 쓴다. 실측 컬럼에 기관코드 같은 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 붙이는 방식(예: LOCALDATA 병의원 인허가 자료와 이름·주소 매칭)으로만 연결한다."
limits: 서산시 한 시군구만 다루므로 다른 지역과의 비교나 전국 분석에는 다른 자료가 필요하다. 요양기관기호 같은 공통 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭 오류에 주의해야 한다.
