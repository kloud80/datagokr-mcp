description_portal: 국가금연지원서비스 대상자의 니코틴의존도 평가 데이터로 6개의 표준 조사항목에 대한 결과를 제공합니다.조사항목은 아침에 일어나서 얼마만에 첫 담배를 피우는지, 금연구역(도서관, 병원, 영화과 등)에서 흡연을 참기가 어려운지, 하루 중 가장 담배 맛이 좋은 때는 언제인지, 하루에 보통 몇 개비를 피우는지, 아침에 일어나서 첫 몇시간동안 하루 중 다른 시간보다 더 자주 담배를 피우는지, 몸이 아파 하루종일 누워있을 때도 담배를 피우는지 등을 파악하여 상담 시 보조 수단으로 니코틴 보조제 지급여부를 판단합니다.- 전국 보건소, 지역금연지원센터
