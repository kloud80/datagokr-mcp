summary_user: 국가금연지원서비스(전국 보건소·지역금연지원센터)에 등록한 대상자별 니코틴의존도 평가 응답을 담은 전국 범위 파일 데이터로, 기관유형·지역·제공기관·출생년도·성별·등록유형과 함께 6개 표준 문항(첫 담배까지 시간, 금연구역 흡연 참기, 하루 흡연 개비 수 등) 결과가 들어 있다. 금연 정책 분석가나 보건소 담당자가 지역·성별·연령대별로 금연 서비스 등록자의 니코틴 의존 수준이 어떻게 다른지, 니코틴 보조제가 필요한 고의존 흡연자가 어느 정도인지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명·제공기관명 같은 이름 매핑이나 같은 기관(한국건강증진개발원)의 다른 국가금연지원서비스 등록정보와 맞춰 이어 쓴다.
limits: 보건소코드·시군구코드 같은 표준 코드가 없어 지역사회 건강조사 등 시군구 지표와 바로 결합되지 않고 이름 매핑이 필요하다. 개인 식별자가 없어 같은 사람의 금연 성공 여부나 추적 결과는 이 파일만으로 알 수 없다.
