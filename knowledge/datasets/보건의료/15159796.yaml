summary_user: 대구광역시 동구 안에서 집단급식소를 설치해 운영하는 병원을 업소 한 곳당 한 행으로 담은 현황 파일로, 업종·업태, 업소명, 도로명주소, 전화번호, 위탁·직영 운영방법을 담는다(CSV 약 2KB 규모의 소량 목록). 구청 위생 담당자나 분석가가 '동구 병원 급식소 중 위탁 운영과 직영 운영은 각각 어디이고 점검 대상은 몇 곳인가'를 파악하거나 현장 점검 연락처를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명주소를 맞춰 LOCALDATA 병원 인허가·집단급식소 신고 자료와 이어 써야 한다.
description_portal: '1. 데이터 개요 및 활용 목적이 데이터는 대구광역시 동구 내에서 운영 중인 집단급식소설치 병원의 현황 정보를 체계적으로 정리한 자료입니다. 병원에서 다수의 인원에게 식사를 제공하는 집단급식소를 대상으로 하며, 각 급식소의 기본 정보를 한눈에 파악할 수 있도록 구성되어 있습니다.해당 자료는 식품안전관리와 급식소 위생 점검 계획 수립, 지역 내 급식 운영 실태 파악 등의 행정적 목적에 활용됩니다. 이를 통해 공공기관과 지자체는 보다 체계적이고 효율적인 급식소 관리를 추진할 수 있으며, 궁극적으로는 공중보건 수준 향상과 식품위생 안전성 확보에 기여할 수 있습니다.2. 데이터 항목업소명: 집단급식소의 명칭(병원의 명칭)도로명주소: 시설의 정확한 위치 정보전화번호: 해당 기관 연락처운영방법(위탁, 직영) : 위탁 또는 직영 구분이와 같은 항목 구성은 지역별 급식소의 운영 규모를 구체적으로 파악하는 데 도움이 되며, 필요 시 신속하게 연락하거나 현장 점검을 진행하는 데도 유용합니다.3. 기대 효과이 데이터를 활용하면 대구광역시 동구 내 집단급식소 설치 병원에 대한 현황을 보다 체계적으로 파악할 수 있어, 식품안전사고를 사전에 예방하고 급식 위생관리 수준을 높이는 데 실질적인 도움을 줄 수 있습니다. 또한, 지역별 급식 수요 분석과 행정자원의 효율적 배분을 가능하게 하여, 정책 수립 및 행정서비스 개선을 위한 기반 자료로도 활용될 수 있습니다.'
