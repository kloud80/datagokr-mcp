summary_user: 보건소 모바일 헬스케어 사업의 OPEN API로 연동되는 건강관리 디바이스 등록 현황을 제품 단위로 담은 전국 범위의 작은 목록 파일(약 2.6KB)로, 연번·제품명·제품코드명만 들어 있다. 보건소 모바일 헬스케어 서비스에 연동할 기기를 만들거나 앱을 개발하는 사업자가 어떤 제품이 이미 등록돼 있고 어떤 제품코드로 식별되는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 제품명이나 제품코드명을 직접 맞춰 보거나 같은 기관 자료끼리만 연결한다.
description_portal: 보건소 모바일 헬스케어 사업은 ICT기술을 활용한 보건소 기반의 공공형 건강관리서비스로 국민의 일상 속 건강생활 실천 및 만성질환 예방을 목적으로 합니다.지역보건의료기관인 보건소는 국민건강증진법, 지역보건법 등에 따라 지역주민의 건강생활실천 및 만성질환 예방, 취약계층 건강관리 업무 등을 추진하고 있으며, 이러한 보건소를 기반한 ‘모바일 헬스케어 사업’은 국가건강검진 결과, 건강위험군을 대상으로 일상 속 건강생활실천 유도 및 만성질환으로 이행예방을 목적으로 시작 되었습니다. ICT기술을 활용한 비대면 건강관리서비스로서 경제적, 시간적, 공간적 제약으로 건강관리서비스에 접근성이 떨어지는 건강취약계층에 집중하고 있습니다.보건소 모바일 헬스케어 사업 활용을 위한 OPEN API를 활용한 건강관리 디바이스 등록 현황 데이터로서 연번, 제품명, 제품코드명을  제공합니다.
