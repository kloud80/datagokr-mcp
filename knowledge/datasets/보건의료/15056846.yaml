summary_user: 경기도 31개 시군의 약국 인허가 정보를 약국 한 곳씩 담으며, 사업장명·도로명/지번 주소·인허가일자·영업상태(영업·휴업·폐업)·폐업일자·약국 영업면적·전화번호·WGS84 위경도 좌표가 들어 있다. 분석가나 약국 개업 예정자가 "우리 시군에서 최근 몇 년간 약국이 얼마나 새로 생기고 문을 닫았나" 또는 "주거지에서 가까운 영업 중 약국이 있나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드·시군명, 주소, 좌표를 맞춰 연결해야 하며, 같은 LOCALDATA 계열 병의원 인허가 데이터와 시군 단위로 나란히 보는 방식이 현실적이다.
description_portal: 경기도 내 약국 현황입니다. 약사가 의약품을 조제 또는 판매를 주목적으로 하는 업체(소)의 정보를 제공합니다.※경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내 약국의 운영 현황을 정리한 자료로, 각 약국의 위치, 인허가일자, 영업상태, 약국면적, 좌표정보(X·Y), 전화번호 등을 포함합니다. 주요 항목으로는 시군명, 사업장명, 도로명주소, 지번주소, 우편번호, 영업상태(영업중·폐업), 인허가일자 및 폐업일자 등이 있으며, 위도·경도 좌표를 활용해 GIS(공간정보시스템) 기반 분석도 가능합니다. 해당 자료는 약국 서비스의 지역별 분포 파악, 보건의료 접근성 분석, 약국 신설·폐업 동향 파악, 공공보건정책 수립 등에 활용될 수 있습니다. 또한 약국 운영 면적 정보를 통해 지역 약국의 규모나 운영 형태를 유추할 수 있으며, 의료 취약지역의 약국 접근성 확보에도 기초자료로 쓰일 수 있습니다. 데이터는 보건복지부 또는 관할 지자체의 보건행정 시스템을 통해 수집된 표준 공공데이터입니다.
