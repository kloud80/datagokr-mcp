summary_user: 전국 자치단체가 관리하는 의료기관 세탁물처리업 인허가 정보를 업소 건별로 담으며, 전체 265건에 1990-07-28부터 2026-09-23까지의 인허가일자·영업상태·사업장명·주소·좌표가 들어 있다. 의료기관 세탁물 위탁처리 업체가 어디에 있고 영업 중인지 확인하려는 사업자나 분석가의 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)가 주소 키라서 같은 주소 키를 가진 다른 의료기관 인허가 데이터와 이어 쓴다.
description_portal: '생활_의료기관세탁물처리업 데이터는 의료기관에서 사용하는 세탁물을 전문적으로 세탁하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 의료기관세탁물처리업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 보건복지부 의료기관정책과 / 044-202-2481 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
