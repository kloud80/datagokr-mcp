summary_user: 아토피성 피부염(상병코드 L20)으로 청구된 건강보험 청구건을 56일 간격 기준으로 묶은 진료에피소드 건수를 시군구·요양개시년월·성별·연령군별로 집계한 파일로, 외래및입원과 입원 두 갈래로 나뉘며 포털 설명상 2006년 1월~2025년 12월을 담는다. 환경보건 연구자나 지자체 담당자가 "우리 시군구의 아토피 진료 에피소드가 월별로 어떻게 변했고 어느 연령·성별에 몰리는가"를 보는 환경성질환 감시 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구 이름(SGG)과 기준년월을 다른 지역·기간 통계와 이름 매핑으로 맞춰 이어 쓴다.
description_portal: "1. 배경 : 환경성 질환을 평가하기 위해 지속적인 감시가 필요함.2. 목적 : 건강보험 빅데이터를 이용한 질병 발생자료를 구축하여           월별, 인구사회학적 특성(성/연령/시군구) 및 의료이용행태 특성(입원/외래)의 자료를 제공함으로써           감시체계 자료원으로 활용하고자 함.3. 사례정의 : 상병코드○ L20 아토피성 피부염4. 구축방법○ 전체 청구상병 테이블(주상병(=1상병) 및 주상병 이외의 모든 부상병 포함)에서 해당 상병코드가 포함된 모든 청구건 추출○ 해당 상병코드로 진단 받은 모든 청구건을 중복제거 후 진료에피소드로 묶고, 건수를 산출함.    - 각 청구건의 날짜 간격이 56일 이내인 경우 하나의 진료에피소드로 구축함.    - 방법론 참조 : 국립환경과학원 '국민건강보험공단 빅데이터를 이용한 가습기살균제 건강피해 규명 연구(II)'(2020),                        '가습기살균제 호흡기계 건강피해 통합 판정체계 구축 연구'(2021)○ 2006년 1월~2025년 12월까지 주·부상병 조건의 진료에피소드 건수    - 하나의 진료에피소드에 포함된 여러 청구건들 중에서 해당 상병코드가 주상병 또는 제2상병으로 1회 이상 청구된 경우임.○ 2006년 1월~2025년 12월까지 \"외래 및 입원\"과 \"입원\"의 진료에피소드 건수    - \"입원\" 진료에피소드는 하나의 진료에피소드에 포함된 여러 청구건들 중 하나 이상의 입원 청구건이 포함된 경우임.○ 시군구, 요양개시년월, 입원/외래, 성별, 연령군별 진료에피소드 건수를 산출함.    - 외래 및 입원 주·부상병 조건의 진료에피소드 건수(파일명: 외래입원주부상병)    - 입원 주·부상병 조건의 진료에피소드 건수(파일명: 입원주부상병)※ 국민건강보험공단과 원주세브란스기독병원 환경보건센터 공동 개발"
