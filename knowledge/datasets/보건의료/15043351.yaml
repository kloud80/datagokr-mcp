summary_user: 목포시 관할에서 집단급식소를 설치·운영하는 의료기관을 병원 한 곳씩 담은 현황 파일로, 업종(급식소 종류), 업소명, 소재지 주소, 연락처를 담는다(CSV 약 4KB의 소규모 목록). 목포에서 어느 병원이 환자·직원용 집단급식소를 운영하는지, 위생점검이나 식품안전 행정 대응 때 연락할 곳이 어디인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 인허가·급식소 데이터와는 업소명이나 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 본 데이터는 전라남도 목포시 관할 내 집단급식소를 설치한 의료기관에 대한 현황 자료입니다. 병원명, 급식소의 종류, 병원 주소 및 연락처 정보를 포함하고 있으며, 지역 내 급식 운영 실태를 파악하거나 관련 정책 수립 시 참고 자료로 활용할 수 있습니다. 주소 정보는 시설 분포 분석 및 지역별 급식소 현황 파악에 활용될 수 있으며, 연락처 정보는 직접적인 문의나 행정 대응 시 필요한 기본 자료로 유용합니다. 본 데이터는 공공보건, 위생관리, 식품안전, 의료행정 등 다양한 분야에서 활용 가능하도록 구성하였습니다.
