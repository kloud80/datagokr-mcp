summary_user: 서초구 내 의원·한의원·보건소 등 의료기관을 사업장 한 곳당 한 건으로 담은 인허가 원천 데이터로, 인허가일자·폐업일자·휴업 기간·영업상태와 주소·좌표, 의료인 수·병상 수·진료과목 등을 포함한다. 서초구에서 최근 문을 연 의원이나 폐업·휴업한 의원을 확인하려는 주민, 병의원 개폐업을 상권 신호로 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울특별시 서초구_의원 인허가 정보(http://data.seoul.go.kr/dataList/OA-16235/S/1/datasetView.do)입니다.서초구의 의원, 보건소, 한의원 등 진료시설을 갖추고 환자를 대상으로 의사가 의료행위를 하는 의료기관 정보입니다.관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일, 휴업종료일, 재개업일자, 전화번호 도로명주소, 지번주소,사업장명 등으로 구성된 데이터입니다. 서초구는 구민의 건강과 안전을 최우선으로 하여, 의원(醫院) 인허가 정보를 체계적으로 공개하고 있습니다.해당 페이지에서는 의료기관 개설, 변경, 폐업 등 각종 인허가 현황과 절차 정보를 정확하게 확인할 수 있습니다. 서초구 의원 인허가 정보 페이지를 통해 신뢰할 수 있는 의료기관 정보를 보다 편리하게 이용해보시기 바랍니다.
