description_portal: '대구광역시는 감기약, 해열제, 소화제 등 안전상비의약품을 편의점 등에서도 손쉽게 구매할 수 있도록 ‘안전상비의약품 판매업소’를 지정하여 24시간, 연중무휴 운영 현황을 관리·공개하고 있습니다. 해당 데이터는 ▲업종 ▲업소명 ▲주소 등 주요 정보를 포함하며, 대구시 데이터허브 및 공공데이터포털을 통해 CSV 및 API 형태로 제공합니다.대구시 데이터는 매년 또는 수시로 갱신되며, 최신 수정일 기준 2025년 9월 8일 공개되었습니다. 시민들은 본 데이터를 통해 거주지 인근 편의점에서 안전상비의약품 구매 가능 여부를 항상 확인할 수 있으며, 응급상황 대비나 야간·휴일 의약품 구입을 위한 접근에 유용합니다. 또한, 보건행정 담당자는 위치 기반 분석, 서비스 효율성 평가, 취약지역 발굴 등에 데이터를 활용할 수 있고, 민간에서는 앱 개발·알림 서비스·위치기반 지도 연동 등 다양한 활용 사례가 활발히 이루어지고 있습니다.데이터는 공공데이터포털(data.go.kr)과 대구시 D-데이터허브(data.daegu.go.kr)에서 다운로드 및 OpenAPI 형태(예: JSON/XML)로 사용이 가능합니다. 관리 기관은 보건복지부 및 대구시 해당 부서로, 민원·오류 신고 시 연락·피드백 체계도 갖추고 있습니다.'
