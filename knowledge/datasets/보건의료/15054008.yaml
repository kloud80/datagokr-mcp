summary_user: 대구광역시 안에서 안전상비의약품(감기약·해열제·소화제 등)을 파는 편의점 등 판매업소를 업소 한 곳당 한 행으로 담은 파일이며, 업종·업체명·도로명 소재지를 포함한다. 시민이 '우리 집 근처에서 밤이나 휴일에 상비약을 살 수 있는 편의점이 어디인가'를 확인하거나, 보건행정 담당자가 판매업소가 부족한 지역을 찾는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 업체명이나 도로명 주소를 매칭해서만 이을 수 있고, 주소를 좌표로 바꾸면 약국·의료기관 위치 데이터와 지도에서 겹쳐 볼 수 있다.
