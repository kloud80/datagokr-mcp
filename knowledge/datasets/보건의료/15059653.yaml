summary_user: 진료분야를 기준으로 의료영상 건마다 진료구분, 검사영상번호, 환자 성별·나이, 의료기기 종류(modality), 촬영 부위를 담는 전국 범위의 비공간 통계 조회 데이터입니다. 인공지능 의료영상 판독 소프트웨어를 개발하거나 연구하는 기업·연구자가 "어떤 진료분야에서 어떤 장비로 어느 부위를 촬영한 영상이 확보돼 있는가"를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키를 찾지 못해, 진료분야명·촬영부위명 같은 이름 매핑이나 심평원 내 같은 코드로만 연결한다.
limits: 전역 조인 키가 없어 요양기관·지역·질병코드 단위 통계와 직접 결합하기 어렵다. 범위는 전국이며 시군구 등 지역 구분이 없다. 개발계정은 하루 10,000회까지 호출할 수 있다.
