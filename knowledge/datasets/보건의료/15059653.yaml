description_portal: 진료분야 기준으로 의료영상데이터의 진료 및 의료기기 촬영정보 통계 현황을 조회하는 서비스입니다.- 진료구분, 검사영상번호, 환자성별, 환자나이, 의료기기구분, 촬영분류부위 등 제공※ 건강보험심사평가원은 인공지능 의료영상 판독 소프트웨어 개발 또는 연구를 목적으로 의료영상데이터가 필요한 기업들을 대상으로 데이터의 반출 없이 인공지능 모델/알고리즘의 개발이 가능한 딥러닝용 고성능(GPU) 서버 및 개발 인프라 환경을 제공하고 있으며, 신청을 원하는 경우 HIRA보건의료빅데이터개방시스템(https://opendata.hira.or.kr) > 서비스소개를 참고하여 주시기 바랍니다.
