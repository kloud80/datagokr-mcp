summary_user: 경기도 내 민간 응급환자이송업체를 사업장 1곳당 한 행으로 담는 인허가 현황으로, 사업장명·인허가일자·영업상태·폐업일자와 일반/특수 구급차 대수, 구조사 수, 주소와 위도·경도 좌표를 포함한다. 응급의료 분석가나 지자체 담당자가 "우리 시군에 영업 중인 민간 구급업체와 특수구급차는 몇 대이고 어디에 몰려 있나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시군 코드(SIGUN_CD)·주소·업체명 매핑이나 WGS84 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 응급환자이송업에 대한 인허가 및 운영 정보를 담고 있으며, 경기도 내에서 응급환자를 이송하기 위해 운영되는 민간 구급업체의 현황을 제공합니다. 사업장명, 인허가일자, 영업상태, 폐업일자 등의 행정 정보와 함께, 구급차 대수(일반/특수), 구조사 수, 위치 정보(주소, 위도·경도, 좌표) 등이 포함되어 있어, 민간 응급이송 서비스의 지역별 분포와 자원 현황을 파악하는 데 활용됩니다. 특히, 이 데이터는 지역 응급의료체계 보완, 긴급상황 대응력 분석, 응급의료자원 배치 최적화 등에 유용하며, 민간 주도 이송서비스의 역할과 활용 가능성을 평가하는 기반 자료로서의 가치가 높습니다.
