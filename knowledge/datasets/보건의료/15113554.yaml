description_portal: 폐의약품수거함현황공공데이터는가정내방치되거나무분별하게폐기될경우토양·수질오염및안전사고를유발할수있는폐의약품을적정하게회수·처리하기위한기초자료이다.본데이터는포항시관내각읍면동별로설치된폐의약품수거함의위치와수량을체계적으로제공함으로써시민이생활권내수거거점을쉽게확인하고,불용의약품을생활폐기물이나하수구로배출하지않도록유도하는데목적이있다.주요항목은행정구역단위인읍면동,수거함이설치된구체적장소,해당지점의수거함수량으로구성되며,지역별설치현황과접근성을한눈에파악할수있다.이자료는시민의올바른의약품폐기실천을지원하는동시에,환경보전및생활안전관리정책수립을위한기초행정자료로활용될수있다.또한수거취약지역분석,추가설치대상검토,홍보계획수립등폐의약품회수체계의효율적운영을위한근거자료로도의의가있다.해당데이터를통해시민편의성과행정의현황관리기능을함께높일수있다.
