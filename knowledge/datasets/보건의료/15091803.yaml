description_portal: 이 데이터는 국립암센터에서 수집한 담도암 환자의 수술 관련 정보를 포함한 메타데이터입니다. 수술 여부, 수술일자, 수술명, 수술 부위, 절제 범위, 병리학적 절제연 상태(R0, R1, R2) 등 수술과 관련된 주요 항목이 포함되어 있으며, 수술 방법(개복, 복강경, 로봇수술 등)과 함께 수술 중 합병증이나 수술 소요 시간 등의 부가 정보도 포함될 수 있습니다. 이 데이터는 담도암의 치료 전략 수립, 수술 성과 분석, 생존율 및 예후 예측 연구 등에 유용하게 활용됩니다. 특히 수술 치료의 적절성 평가 및 환자 맞춤형 치료계획 수립, 임상진료지침 개선을 위한 기반 자료로 활용될 수 있습니다.
