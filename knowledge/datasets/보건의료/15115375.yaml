summary_user: 서울특별시 중랑구에서 의료업을 목적으로 설립된 의료법인의 인허가 정보를 사업장 한 곳당 한 행으로 담은 시군구 단위 원천 데이터로, 인허가일자·영업상태·폐업일자·주소·전화번호·중부원점TM(EPSG:5174) 좌표 등을 포함한다. 분석가나 사업자가 '중랑구에서 최근 개설되거나 폐업한 의료법인 사업장은 어디인가'처럼 병의원 개폐업 흐름을 상권 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 이어 쓰며, 다른 자치구의 같은 LOCALDATA 인허가 파일과 컬럼 구조를 맞춰 붙여 쓰는 방식이 현실적이다.
description_portal: '서울특별시 중랑구의 의료업을 목적으로 설립된 법인 정보 데이터입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
