description_portal: '부산광역시 내 전문병원으로 지정된 의료기관 명단과 각 의료기관의 지정분야, 의료기관 명칭, 소재지와 전화번호, 위도, 경도에 대한 정보를 제공합니다.전문병원이란 병원급 의료기관으로서  특정질환 또는 진료과목에 대하여 난이도가 높은 의료행위를 하여 보건복지부장관이 지정한 병원으로, 전문병원으로 지정받은 의료기관은 3년마다 평가를 실시하여 전문병원으로 재지정하게 됩니다.본 데이터는 제5기(2024년~2026년) 부산광역시 내 전문병원으로 지정된 의료기관 현황에 대한 정보이며 현재 부산광역시 내 전문병원은 총 14개소로 각 전문 분야는 다음과 같습니다.  - 질환별: 관절 6개소, 수지접합 1개소, 알코올 1개소, 유방 1개소, 척추 1개소, 화상 1개소, 한방척추 1개소  - 진료과목별: 안과 1개소, 외과 1개소'
