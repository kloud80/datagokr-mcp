description_portal: '은평구의 의료기기를 판매하거나 임대하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 의료기기 판매 및 임대업에 대한 인허가 정보를 포함하고 있으며,  사업장 명칭, 위치, 인허가 일자, 취급기기 범주, 허가기관 정보 등을 담고 있습니다.  의료기기 산업은 고령사회 진입과 재택의료 확대에 따라  시장 규모가 급성장 중이며, 이에 따라 철저한 관리가 요구됩니다.  본 데이터는 불법 의료기기 유통 차단, 소비자 보호,  의료기기 접근성 제고, 의료서비스 안전성 강화 등  다양한 정책 목적에 기여할 수 있습니다.  또한, 지역 내 의료기기 공급 체계의 현황을 파악하고  관련 인프라 조성에도 참고할 수 있는 자료입니다.'
