summary_user: 우울증(F32·F33), 조울증(F31), 조현병 계열(F20·F21·F231·F232·F25) 주상병코드별로 2010~2023년 연도별 전국 진료인원과 진료건수를 담은 집계 파일(약 1.4KB CSV)이다. 분석가나 정책 담당자가 '최근 10여 년간 우울증 진료인원이 얼마나 늘었고 조현병과 비교하면 어떤가' 같은 질문에 쓴다. 전역 조인 키는 없으며, 주상병코드(KCD)와 진료년도를 기준으로 다른 질병별 진료 통계와 이름·코드 매핑으로 이어 쓴다.
limits: 전국 단위 연도별 집계라 지역·연령·성별 분석이나 개인 단위 추적에는 쓸 수 없다. 건강보험 급여실적 기준으로 의료급여·비급여·한의·약국 환자는 빠져 있고, 확정 진단이 아닌 청구 주진단명 기준이다. 5 미만 값은 비식별 처리되며, 심평원(청구 기준) 통계와 값이 다를 수 있다.
