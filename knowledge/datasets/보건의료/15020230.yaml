summary_user: 건강보험 본인부담상한제에 따라 공단이 부담한 초과 본인부담금을 연도별로 사전급여(요양기관 청구분)와 사후환급(환자 현금 환급분)의 건수·금액으로 나눠 담은 전국 단위 집계 파일(약 707바이트)이다. 연간 의료비 상한 초과로 환급·지급된 규모가 해마다 어떻게 변했는지, 사전급여와 사후환급 중 어느 방식 비중이 큰지를 확인하려는 분석가·정책 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 기준으로만 맞춰 볼 수 있고, 지역·기관 단위 연계는 되지 않는다.
description_portal: 본 데이터는 건강보험 본인부담상한제 적용 현황에 대한 정보입니다.본인부담금 총액이 연간 상한액을 초과한 경우, 그 초과액을 국민건강보험공단이 부담하며, 다음과 같이 구분됩니다1) 사전급여: 동일 요양기관에서 연간 본인부담금이 상한액을 초과한 경우, 요양기관이 초과금액을 공단에 청구하여 지급받는 방식입니다. 환자는 초과금액을 요양기관에 직접 납부하지 않습니다.2) 사후환급: 본인부담 총액이 상한액을 초과하였으나 사전급여를 받지 않은 경우, 공단이 초과금액을 환자에게 현금으로 환급합니다.※ 이 제도는 국민의 과도한 의료비 부담을 경감하기 위한 건강보험 재정지출 방식 중 하나로, 상한액은 연도별 소득분위에 따라 차등 적용됩니다.
