description_portal: 본 데이터는 한국보건산업진흥원이 관리하는 외국인환자 유치 실적 정보를 정리한 통계자료이다. 연도별 유치 인원, 진료과목, 환자 국적, 의료기관 유형, 체류 형태 등의 항목으로 구성되어 있으며, 외국인환자 진료 현황과 특성을 종합적으로 파악할 수 있도록 설계되었다. 본 자료는 외국인환자 유입 분석, 의료관광 정책 수립, 보건산업 전략 기획, 해외 마케팅 분석 등 다양한 분야에 활용된다. 통계는 국가 및 지역 단위로 분류되어 있으며, 시계열 분석이 가능하도록 연도별로 갱신된다. 데이터는 표준화된 구조와 분류체계를 기반으로 제공되며, 공공기관, 연구기관, 의료기관, 민간 기업 등에서 의료시장 분석과 정책 수립의 기초자료로 사용된다.
