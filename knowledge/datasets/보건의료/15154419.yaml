summary_user: 국가건강검진기관을 기관 한 곳씩 담는 건별 목록으로, 전국 범위에서 기관명·종별·주소·좌표·전화번호와 일반·영유아·구강검진, 위·대장·간·유방·자궁경부암 검진을 맡는지 여부를 담는다. 국민이 '우리 동네에서 위암·대장암 검진을 함께 받을 수 있는 가까운 병원이 어디인가'를 찾거나, 분석가가 지역별 검진기관 분포를 볼 때 쓴다. 전역 조인 키는 없어 검진기관번호(hmcNo)·기관명·주소로 같은 기관을 맞추거나, 시도·시군구 코드와 좌표로 지역·공간 데이터에 붙여 쓴다.
description_portal: 검진기간 찾기 조회 API는 총 4개의 오퍼레이션을 제공하는 서비스입니다. 국가건강검진기관별 상세정보를 체계적으로 제공하는 서비스로, 지역 기반 검색은 물론 검진 항목 구성, 운영 환경, 시설 규모, 접근성 등 다양한 조건을 비교할 수 있습니다. 기관별 진료 역량과 최신 운영 현황을 확인해 사용자가 보다 적합한 검진기관을 선택하도록 돕습니다. 또한 이용자 중심의 정보 구성으로 각 기관의 예약 절차, 부대 서비스, 교통 편의성을 한눈에 파악할 수 있어 검진 준비 과정을 효율적으로 관리할 수 있으며, 정확히 도와주고 지원합니다.
