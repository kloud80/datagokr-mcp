description_portal: 음주폐해예방 관련 지표- 질병관리청에서 발표한 청소년건강행태조사 결과를 이용해 청소년의 현재 음주율을 산출한 지표입니다.- 현재 음주율은 최근 30일 동안 술을 1잔 이상 마신 적이 있는 사람의 분율을 의미합니다. - 데이터는 남여, 중고등학교별로 현재음주율을 제공하고 있으며, 2015년도부터 일반계고, 특성화계고 통계는 미발표되고 있습니다.- 본 데이터는 청소년 음주폐해예방 및 금주문화 확산을 위하여 보건의료 등 학계에서 연구 수행 시 연구 기초자료로 활용될 것으로 기대됩니다.
