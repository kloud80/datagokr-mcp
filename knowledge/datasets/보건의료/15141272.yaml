summary_user: 서울 금천구 안 의료법인의 인허가 내역을 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가일자·영업상태·폐업일·주소·좌표·의료기관 종별·의료인 수·입원실·병상 수·진료과목 등을 포함한다. 분석가나 개원 준비 사업자가 금천구에서 최근 문을 열거나 닫은 병원이 어디인지, 병상과 진료과목이 어느 지역에 몰려 있는지를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, LOCALDATA 공통 인허가 형식이라 다른 구의 병의원 인허가 데이터와 나란히 비교하기 쉽다.
description_portal: 금천구 내 의료법인의 인허가 정보를 체계적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명 등 기본 정보와 함께 의료기관 종별, 의료인 수, 입원실 및 병상 수, 진료과목, 구급차 보유 현황, 완화의료 지정 여부 등 의료법인 운영에 필요한 다양한 항목을 포함하고 있습니다. 이를 통해 의료법인 설립 절차, 지역 내 의료자원 분포 분석, 보건 정책 수립, 의료 서비스 개선 등 여러 분야에서 활용할 수 있습니다. 또한 해당 데이터는 지역 의료 인프라 현황 파악, 의료 접근성 평가, 응급의료 체계 강화, 장기적인 보건·복지 계획 수립에 있어 중요한 기초 자료로 기능합니다.
