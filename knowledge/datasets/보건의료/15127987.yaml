summary_user: 부산광역시가 지정한 공공심야약국 19곳을 약국별 한 행씩(약국명·도로명 주소·전화번호·관리지역·데이터 기준일) 담은 시도 단위 파일 데이터이다. 밤에 급히 약이 필요한 시민이나 관광객, 약국 분포와 접근성을 보려는 분석가가 "지금 가까운 심야약국이 어디인가"를 확인하는 데 쓴다. 조인 키는 도로명 주소(address)뿐이라 같은 주소 체계를 쓰는 의료기관·응급의료 데이터와 주소로 맞춰 잇는다.
description_portal: 이 데이터는 부산광역시에서 지정한 공공심야약국의 상세 운영 정보를 제공합니다. 공공심야약국은 시민이 야간 시간(22시~익일 01시) 및 휴일 등 의료 취약 시간대에 의약품을 안전하게 구입할 수 있도록 연중무휴로 운영되는 약국입니다. 데이터에는 약국명, 도로명 주소, 전화번호, 위도 및 경도(위치 좌표), 관리지역, 데이터 기준일 등의 정보가 포함되어 있으며, 시민들이 위치 기반으로 가까운 심야약국을 찾을 수 있도록 좌표 정보도 함께 제공합니다. 본 데이터는 응급환자, 야간근무자, 관광객 등 심야 약국 정보가 필요한 일반 시민에게 실질적 도움을 줄 수 있으며, 의료기관, 응급의료체계 운영자, 연구기관, 약사회 등은 이를 활용하여 심야 약국의 분포 및 접근성 분석, 정책 개선, 서비스 사각지대 해소 등의 목적으로 사용할 수 있습니다. 특히 보건의료정책 수립, 지역 약국 분포 지도 제작, 약국 이용 현황 조사, 야간 약물 접근성 개선 등에 활용가치가 높습니다.이 데이터는 부산광역시에서 지정한 ‘공공심야약국’의 운영 현황을 정리한 것입니다. 공공심야약국은 밤 10시부터 다음 날 새벽 1시까지 연중무휴로 운영되어, 심야·휴일 등 의료 사각지대 해소에 기여하는 약국입니다. 데이터에는 약국명, 도로명 주소, 전화번호, 위도·경도(위치좌표), 관리지역, 데이터 기준일 등 총 7개 항목이 포함되어 있습니다. 시민들은 이 정보를 통해 위치 기반으로 가까운 심야약국을 확인하고 응급상황에 대비할 수 있습니다. 특히 관광객, 야간근무자, 독거노인, 만성질환자 등 의료 취약계층이 심야에 의약품을 신속히 구매할 수 있도록 도와줍니다. 또한 지방자치단체, 보건소, 응급의료기관, 연구기관 등은 이 데이터를 활용해 약국의 지역별 분포 분석, 의료접근성 평가, 약국 정책 개선, 응급의약품 제공 전략 수립 등에 유용하게 활용할 수 있습니다. 향후 약국 배치의 형평성 검토, 약국 공공성 강화, 지역 건강 불균형 해소 자료로도 폭넓게 활용될 수 있습니다.
