summary_user: 2020년 7월 기준 경기도 내 신천지 관련 시설(교회·숙소·부속기관 등)별로 시군명, 소재지 주소, 우편번호, 위경도, 시설 구분, 방역 조치 현황을 시설 한 곳당 한 행으로 담은 1회성 조사 자료다. 감염병 위기 때 특정 종교시설에 대한 방역 조치가 어느 시군에서 어떻게 이뤄졌는지 되짚어 보려는 분석가나 방역 담당자가 유사 사례 대응 전략을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·주소 문자열 매칭이나 위경도 기반 공간 결합으로만 이어 쓴다.
description_portal: '이 데이터는 2020년 7월 기준으로 경기도 내 신천지 관련 시설의 코로나19 방역조치 현황을 기록한 자료로, 감염병 확산 방지를 위한 긴급 대응의 일환으로 수집되었습니다. 주요 항목은 데이터기준일시, 시군명, 소재지주소, 우편번호, 위도, 경도, 시설구분명(교회, 숙소, 부속기관 등), 조치현황(예: 방역처리완료) 등으로 구성되어 있으며, 위경도 정보를 통해 감염병 대응 시설의 지리적 분포 파악도 가능합니다. 해당 데이터는 감염병 위기 시 특정 종교시설의 대응 현황 분석, 방역정책 효과 평가, 유사사례 대응 전략 수립에 활용될 수 있습니다. 특히 시군별로 분류된 주소 데이터는 지역 방역관리 체계 운영과도 밀접한 관련이 있으며, 방역 사각지대 해소 및 공공 안전 확보에 기여할 수 있습니다.※ 2020년 7월 기준 조사된 자료로, 코로나 방역을 위해 조사된 1회성 자료이므로 이용에 참고하여 주시기 바랍니다.'
