summary_user: 서울특별시 용산구 안경업소의 인허가 정보를 업소 한 곳당 한 건으로 담는 원천 자료로, 사업장명·주소·전화번호, 인허가일자와 취소일자, 영업상태와 폐업일자, 좌표(X·Y), 시력표·검안기·렌즈절단기 등 장비 보유 수와 면적을 포함한다. 용산구에서 지금 영업 중인 안경원이 어디에 있는지, 최근 개업·폐업이 늘었는지를 보고 상권 변화를 살피려는 사업자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 인허가 계열의 다른 업종 자료와 나란히 놓고 쓴다.
description_portal: 서울특별시 용산구에 위치한 안경업소의 인허가 현황과 관련된 다양한 행정 정보를 제공합니다. 데이터에는 각 안경업소의 사업장명, 소재지 주소, 전화번호와 같은 기본 정보뿐 아니라, 개설 시점의 인허가 일자, 현재 영업 중인지 여부를 확인할 수 있는 영업상태 구분, 영업 종료 시 기록되는 폐업일자가 포함됩니다. 또한 변경신고 이력, 업종 세부 구분, 인허가를 처리한 관할 행정기관 등의 정보가 수록되어 있어, 관내 안경업소의 개설·변경·폐업 현황을 체계적으로 파악할 수 있습니다. 이 자료는 시민, 업계 종사자, 행정기관이 안경업소 운영 동향을 분석하고, 「의료기사법」 및 관련 법령 준수 여부를 점검하는 데 유용하게 활용됩니다. 정보는 용산구 보건소에서 관리하며, 공공데이터 포털을 통해 주기적으로 갱신됩니다.
