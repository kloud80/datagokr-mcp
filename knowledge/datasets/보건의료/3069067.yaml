description_portal: '본 데이터는 전주시 관내 소독업체의 등록 및 운영 현황 정보를 제공하는 공공데이터입니다.소독업체의 사업장명, 인허가일자, 영업상태명, 도로명주소, 지번 주소, 위치정보(위도·경도) 및 시설·장비 관련 정보 등을 포함하고 있으며, 시민 생활환경 위생관리와 감염병 예방 관련 정보 제공을 목적으로 개방됩니다.데이터에는 도로명주소와 지번주소를 함께 제공하여 위치 기반 서비스 및 공간정보 분석에 활용할 수 있도록 구성하였으며, 업소 운영현황과 시설·장비 보유 여부 등을 통해 지역 내 소독업체 현황 파악 및 관련 정책 수립에 활용 가능합니다.또한 본 데이터는 공공기관의 방역 및 위생관리 행정업무 지원, 시민 대상 생활편의 정보 제공, 민간 플랫폼 서비스 개발 등 다양한 분야에서 활용 가능한 기초자료로 제공됩니다.제공부서 : 감염병관리과'
