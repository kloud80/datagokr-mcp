description_portal: '○ 통계개요* 통계명 : 식품위생업 현황(구별)* 통계종류 : 서울시 식품위생업소 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「식품위생법」에 의거 자치구에 영업허가 또는 신고를 한 식품위생 관련업소* 작성목적 : 식품위생업소의 현황을 파악하여, 사업체에 대한 효율적인 지원과 식품위생관련 정책 수립을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 보건소 → 자치구 → 서울특별시 식품안전과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 식품접객업, 집단급식소, 식품제조업 및 가공업,판매ㆍ운반ㆍ기타업, 건강기능식품 제조ㆍ수입ㆍ판매업소의 개소수'
