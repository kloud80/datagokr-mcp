description_portal: '"제주특별자치도 내 연령대별 13세 이상 인구 의료서비스 이용률 정보 데이터를 제공합니다.항목: 기준연도, 시도, 연령대, 병의원 구분, 이용율 등* 제주특별자치도 내 13세 이상 인구를 대상으로, 연령대별 및 병의원 구분(병원 vs 의원 등)하여 의료서비스 이용률을 조사한 통계자료입니다. 이용률이란 최근 일정 기간 내에 진료(검사 또는 치료)를 받은 비율을 뜻하며, 병의원 종류에 따라 이용율의 차이가 있을 수 있습니다.료시설 접근성·이용 패턴의 연령별 격차 파악, 보건의료 정책 기획, 의료자원 분배 및 의료 취약계층 식별 등에 활용될 수 있는 기초 자료입니다.* 활용 분야 : 연령대별 의료 접근성 및 이용 격차 분석, 만성질환 예방 및 관리 정책 설계 등"'
