summary_user: 충청남도 당진시 관내 병원의 명칭, 종별, 전화번호, 도로명·지번 주소를 기관 한 곳당 한 행으로 담은 현황 파일이다(데이터 기준일자 2025년 6월 1일, csv 약 1.8KB). 시민이나 분석가가 '당진시에 어떤 종류의 병원이 어디에 있고 연락처는 무엇인가'를 확인하거나, 응급의료 대응계획·시설 분포 분석의 기초 목록으로 쓴다. 전역 조인 키는 없어 의료기관명이나 주소를 기준으로 다른 의료기관 인허가(LOCALDATA) 자료나 주소 기반 공간 데이터와 맞춰 이어 쓴다.
description_portal: '충청남도 당진시 병원 현황 안내(데이터 기준일자: 2025년 6월 1일)충청남도 당진시는 시민의 건강 증진과 의료 접근성 향상을 위하여 관내 병원·의료기관 현황을 관리하고 있습니다. 본 자료는 당진시 지역에 위치한 병원의 기본 정보를 수록한 것으로, 다음 항목을 포함하고 있습니다:기관명: 병원 또는 의료기관의 공식 명칭기관종류: 종합병원, 병원, 요양병원, 의원 등 분류전화번호: 대표 연락처주소: 병원이 위치한 도로명 또는 지번 주소위도 / 경도: 공간정보 시스템(GIS) 기반의 위치 좌표본 자료는 당진시 의료자원의 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 보건의료 정책 수립, 응급의료 대응계획 마련, GIS 기반 시설 분석, 시민 안내자료 제작 등 다양한 행정 및 공공목적으로 활용될 수 있습니다.'
