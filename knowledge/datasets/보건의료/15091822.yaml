description_portal: 이 데이터는 국립암센터에서 수집한 위암 환자의 수술 관련 주요 정보를 포함하는 메타데이터입니다. 위절제술(부분 또는 전절제), 림프절 절제 범위, 수술 방법(개복 또는 복강경), 수술 소요 시간, 출혈량, 수술 중 합병증 발생 여부 등의 항목이 포함됩니다. 수술정보는 치료 경로 분석, 수술 성과 평가, 재원 기간 예측, 수술 후 합병증 관리 등 임상적 의사결정에 필수적인 자료로 활용됩니다. 또한 환자 맞춤형 치료 계획 수립과 위암 수술 표준화 연구, 치료 효과 비교 분석 등에 중요한 기초자료로 활용되며, 건강보험 정책 수립 및 의료 질 향상 정책에도 기여합니다.
