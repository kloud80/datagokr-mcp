description_portal: '□ 개요장기요양 재택의료센터 시범사업은 재가에 거주하는 거동이 불편한 장기요양 수급자에게 방문형 의료-요양 통합서비스를 제공하는 제도입니다. - (이용대상) 재가 장기요양 수급자로 거동이 불편하고 재택의료가 필요한 사람(1~2등급 우선)으로 의사가 판단한 경우 - (참여기관) 장기요양 재택의료센터 시범사업 지정기관(의원, 한의원, 지방의료원, 보건소) - (제공서비스) 방문진료(월 1회), 간호(월 2회 이상) 제공 및 지역사회 돌봄서비스 연계본 데이터는 국민건강보험공단에서 제공하는 장기요양 재택의료센터 기관별 협력기관 수 현황으로, 장기요양 재택의료센터 시범사업 참여기관별 협약을 맺은 협력기관의 수를 집계한 자료입니다.□ 주요 내용- 발췌 일자: 2025년 8월 21일- 분류 기준: 시·도, 시·군·구, 재택의료센터 기관명, 협력기관 수- 시·도 및 시·군·구: 장기요양 재택의료센터 기관 소재지 기준- 재택의료센터 기관명: 발췌일자 기준 장기요양 재택의료센터 시범사업에 참여중인 기관- 협력기관 수: 장기요양 재택의료센터별 협약을 맺은 협력기관(의료기관, 장기요양기관)의 수  ※ 장기요양 재택의료센터에서 협력기관 및 협약사항을 전산시스템에 등록한 자료를 기준으로 집계하였습니다.'
