summary_user: 의료기기 분류번호별로 일상 명칭·다른 표현 같은 유사어를 한 건씩 담은 목록이며, 유사어 일련번호·분류번호·유사어·분류번호 등급을 담는 전국 단위 비공간 기준 데이터다. 의료기기를 수입·제조하려는 사업자나 분석가가 "흔히 부르는 이 기기 이름은 어느 분류번호이고 몇 등급인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의료기기 분류번호나 명칭 매핑으로 식약처 의료기기 품목허가 정보 등과 이어 써야 한다.
limits: 유사어와 분류번호·등급만 담고 있어 개별 제품의 허가 여부나 업체 정보는 이 데이터만으로 알 수 없다. 전역 조인 키가 없어 다른 데이터와는 분류번호·명칭 매칭에 의존해야 한다. 개발계정 호출은 일 10,000회로 제한된다.
