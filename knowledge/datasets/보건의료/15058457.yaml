summary_user: 의약품 제조·수입·유통 업체에 내려진 행정처분을 건별로 담으며, 처분 일련번호·업체명·소재지·제품명·위반 법령·위반 내용·처분명·최종 확정일자 등을 전국 범위로 제공한다. 병원·약국이나 유통업체가 '이 제약사나 이 제품이 최근 어떤 위반으로 업무정지·판매정지 처분을 받았는가'를 확인할 때 쓴다. 실측상 전역 조인 키는 확인되지 않았으므로, 품목 일련번호(ITEM_SEQ)·업체 허가번호·사업자등록번호를 식약처 의약품 허가정보 등과 이름·코드 매핑으로 맞춰 이어 쓴다.
description_portal: 식품의약품안전처 「의약품 행정처분 정보」 OpenAPI는 의약품에 대해 행정 처분이 내려진 내역을 조회할 수 있는 공공데이터입니다. 주요 제공 항목으로는 행정처분일련번호, 업체명, 업체소재지, 업허가번호, 제품명, 위반법명, 위반내용, 행정처분명, 행정처분일자(최종확정일자), 행정처분기간 등을 포함하고 있어 의약품의 관리·감독 상황을 투명하게 확인할 수 있습니다. 이를 통해 의료기관과 환자는 해당 의약품의 안전성 및 신뢰도를 파악할 수 있고, 제약사와 유통업체는 규제 준수와 품질관리 체계를 점검할 수 있습니다.
