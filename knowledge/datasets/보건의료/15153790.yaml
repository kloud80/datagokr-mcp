summary_user: 대구광역시 내 권역응급의료센터 등 응급의료기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 기관명·구분·주소·연락처와 위도·경도·공간좌표(POINT)를 포함한다. 시민이나 분석가가 '대구에서 중증 응급환자를 받는 권역응급의료센터는 어디이며 연락처는 무엇인가'를 지도 위에서 확인하거나 응급의료자원 분포를 볼 때 쓴다. 전역 조인 키(기관 고유코드 등)가 없어 다른 응급의료 데이터와는 의료기관 이름 매칭이나 위도·경도 좌표 근접으로만 이어 쓴다.
limits: 기관 식별코드가 없어 실시간 병상·진료정보 등 다른 데이터와 정확히 조인하기 어렵고, 이름 매칭 시 표기 차이에 주의해야 한다. 범위는 대구광역시 한 곳의 개별 기관 목록이며 실시간 병상 현황은 담지 않는다.
