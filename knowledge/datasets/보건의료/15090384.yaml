summary_user: 식약처가 승인한 의약품 임상시험 계획별로 지정된 시험책임자 정보를 목록 형태로 담는 OpenAPI이며, 범위는 전국이다. 연구자·제약사가 특정 임상시험의 책임자가 누구인지 확인하거나, 환자가 참여를 고민하는 임상시험의 시험책임자를 찾아볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 임상시험명·기관명 같은 이름 매핑이나 같은 기관의 코드로만 이어 쓸 수 있으며, 식약처 임상시험 승인정보 등 같은 부문 데이터와 함께 보는 용도다.
description_portal: 식품의약품안전처 「의약품 임상시험 계획 시험책임자 정보」 OpenAPI는 임상시험 계획에 지정된 시험책임자에 대한 정보에 대한 공공데이터입니다. 연구자와 환자의 임상정보 활용도 및 편의성 제고를 위해 식품의약품안전처에서 공개중인 의약품 임상시험 승인정보를 목록으로 제공합니다.이 데이터를 통해 임상시험의 책임자 정보와 관리 현황을 투명하게 파악할 수 있어,연구자와 제약사는 임상시험 수행 역량과 적합성을 확인할 수 있으며, 의료기관과 환자는 시험책임자의 전문성을 참고하여 임상시험 참여 여부를 결정할 수 있습니다.
