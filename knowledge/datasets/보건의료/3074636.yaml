description_portal: 질병관리청 국립보건연구원에서 수행하는 만성감염질환코호트 사업을 통해 수집된 자료입니다. 한국 HPV 코호트 연구는 자궁경부암을 유발하는 사람유두종바이러스(HPV)의 지속감염에 대한 위험인자를 규명할 수 있도록 국가적 차원의 사람유두종바이러스 코호트 구축 및 운영을 위해 다기관 전향적 코호트로 수행되고 있습니다. HPV 코호트에 등록된 대상자들의 현황을 파악하기 위한 년도별 등록인수, 조사건수, 종결인수, 대상자들의 등록 당시 연령 현황 등의 데이터를 제공합니다.
