summary_user: 대전광역시 서구 관내 의료기기판매업 영업소를 한 곳씩 담은 건별 목록으로, 영업소명과 도로명 소재지를 담는다(CSV 파일 약 88KB). 동네에서 의료기기를 파는 곳이 어디 있는지 찾는 주민이나, 서구 안 판매업소가 어느 동에 몰려 있는지 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명이나 도로명주소를 맞춰 붙이거나 주소를 좌표로 바꿔 지도 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 대전광역시 서구 관내 의료기기판매업 영업소의 등록 현황을 정리한 자료입니다. 의료기기판매업은 의료기기의 유통·판매 과정에서 안전성과 적정한 관리가 요구되는 업종으로, 관련 영업소의 위치 정보를 체계적으로 관리하고 확인할 수 있도록 구성되어 있습니다. 데이터에는 각 영업소를 식별할 수 있는 영업소명과, 해당 영업소의 정확한 위치를 확인할 수 있는 영업소소재지(도로명주소) 항목이 포함되어 있어, 관내 의료기기판매업소의 분포 파악 및 행정 관리에 활용할 수 있습니다.
