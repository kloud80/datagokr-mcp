summary_user: 의료기기 임상시험계획 승인 건별로 승인번호·승인일자, 제조·수입업체와 신청업체, 제품명, 임상시험 제목, 임상시험 구분과 세부 구분, 의료기기 분류번호를 담는 전국 단위 API입니다. 의료기기 업체나 연구자가 특정 제품이나 업체의 임상시험계획이 언제 승인됐는지, 어떤 종류의 임상시험인지 확인하는 데 씁니다. 실측 컬럼에는 전역 조인 키가 없어서, 사업자등록번호(BRNO)나 의료기기 분류번호·품목 일련번호처럼 식약처 안에서 쓰는 코드, 또는 업체명·제품명 매칭으로 의료기기 품목허가 등 같은 기관 데이터와 잇습니다.
description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 제공하는 의료기기 임상시험계획승인신청 상세 관한 공공데이터입니다.「의료기기법 시행규칙」 제21조(임상시험기관 지정기준 및 절차 등) 제8항에 따라 식약의약품안전처장이 지정한 의료기기 임상시험기관의 명칭, 소재지, 대표자 등을 공개하고 있습니다. 의료기기 제조·수입업체 및 연구자들의 임상시험기관 접근 편의성 제고를 위하여 식품의약품안전처에서 공개 중인 의료기기 임상시험기관 지정 정보를 목록으로 제공하고 있습니다.
