description_portal: '이 데이터는 MRI 장비를 공동으로 활용할 수 있는 의료기관의 현황을 한눈에 파악하기 위해 수집된 정보입니다. 각 항목이 기관 식별에서부터 위치, 운영 형태, 연락처, 규모, 최신 갱신일자까지 포함하여 체계적으로 정리되어 있습니다.연번: 고유 식별을 위한 순번으로, 각 의료기관을 구분합니다.의료기관명: 병원·클리닉 등 해당 기관의 공식 명칭입니다.소재지: 시·도 및 시·군·구 단위의 상세 주소로, 기관 위치를 표시합니다.의료기관종별: 종합병원·병원·요양병원·한방병원 등 해당 기관의 종류를 구분합니다.전화번호: MRI 공동활용 문의 및 예약을 위한 대표 연락처입니다.병상수: 해당 기관이 보유한 총 병상 수로, 규모를 가늠할 수 있습니다.데이터기준일자: 위 정보가 갱신된 시점을 나타내며, 최신성을 확인할 수 있습니다.이를 통해 각 지역별 MRI 공동활용 기관의 연락처와 운영 정보를 효율적으로 관리하고 비교할 수 있습니다.'
