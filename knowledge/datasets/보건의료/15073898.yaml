description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 제공하는 의료기기 유해사례별 검토 및 평가결과 정보입니다. 이 공공데이터는 대상업체명과 유해사례인지일 발생일 종료일을 통해 사건의 기본 정보와 시간적 경과를 파악할 수 있습니다 보고일련번호로 각 사례를 고유하게 식별하며 조치대상을 명시하여 평가 범위를 명확히 합니다.  의료기기사용년월과 취득년월 정보로 제품 이력을 추적할 수 있으며 의료기기인과관계코드와 최초보고일자를 통해 종합적인 평가 결과를 확인할 수 있습니다
