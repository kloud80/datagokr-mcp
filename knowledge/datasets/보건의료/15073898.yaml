summary_user: 식약처가 접수한 의료기기 유해사례를 보고일련번호 단위 한 건씩 담고, 대상업체명·유해사례 인지·발생·종료일, 의료기기·이상사례·환자상태에 대한 검토·평가 내용, 인과관계 판정, 사용·취득년월, 최초보고일자를 함께 제공하는 전국 범위 API다. 의료기기 제조·수입업체나 안전성 분석가가 특정 업체 제품에서 보고된 유해사례가 어떻게 평가됐고 기기와의 인과관계가 어느 정도로 판정됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 사업자등록번호(BRNO)나 업체명으로 같은 기관의 의료기기 품목허가·업체 정보와 이름·코드 매핑으로만 연결한다.
limits: 품목기준코드 같은 공통 키가 없어 의료기기 품목허가나 심평원 급여 목록과 직접 조인되지 않고 업체명·사업자번호 매칭에 의존한다. 위치 정보가 없는 비공간 데이터라 지역별 분석에는 쓰지 못한다. 개발계정은 하루 10,000회로 호출이 제한된다.
