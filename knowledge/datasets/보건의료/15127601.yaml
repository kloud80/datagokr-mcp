summary_user: 국민건강보험공단 건강보험 급여실적 중 주진단명이 다낭성 난소증후군(E28.2)인 진료인원을 2018~2022년 진료년도·시도(수진 시점 주민등록주소지)·5세 단위 연령별로 집계한 파일이다. 지역·연령대별 다낭성 난소증후군 진료인원이 어떻게 변해 왔는지 보려는 보건 분석가나 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 통계와는 시도 이름과 연도·연령 구간을 직접 맞춰 이어 쓴다.
limits: 의료급여·비급여·한의분류·약국은 빠진 건강보험 급여 기준 진료인원이며, 확정 진단이 아닌 청구 시 주진단명 기준이라 실제 유병자 수와 다를 수 있다. 공단(자격 기준) 값은 심평원(청구 기준) 통계와 다르므로 섞어 비교하지 않는다.
