description_portal: 정신건강복지센터에 등록하여 정신건강 서비스를 이용하는 중증정신질환자 중 최근 2년 이내에 장기간 병원에 입원한 경험이 있는 당사자 수에 대한 정보입니다. 장기재원 경험률은 최근 2년 이내에 6개월 이상 입원한 경험이 1회라도 있는 사람 분율을 의미합니다.이 데이터셋은 서울시정신건강복지센터에 등록된 중증정신질환자(정신병적장애, 분열정동장애, 양극성정동장애, 반복성우울장애 진단자)를 대상으로 최근 2년 이내 6개월 이상 입원한 경험이 있는 사람의 비율(장기재원 경험률)을 자치구별로 집계한 통계입니다.  등록회원 수와 장기 입원 경험 여부를 바탕으로 자치구 간 비교가 가능하며, 정신건강 서비스의 재원 관리 상태나 지역별 중증정신질환자 입원 경향 등을 파악하는 데 활용될 수 있습니다.
