summary_user: 서울 종로구의 의원 인허가 정보를 의원 한 곳당 한 행으로 담은 LOCALDATA 형식 원천 자료로, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소, 사업장명, 좌표, 의료인 수·병상 수·진료과목 같은 항목을 포함한다. 주민이 집 근처에 영업 중인 의원과 진료과목을 찾거나, 분석가가 종로구에서 최근 몇 년간 의원이 얼마나 개업·폐업했는지를 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 사업장명·주소 매칭이나 같은 개방자치단체 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 본 데이터는 서울특별시 종로구에서 관리하는 의원 인허가 현황을 정리하여 제공하는 자료입니다. 의원은 「의료법」에 따라 의사가 지역 주민에게 외래 중심의 진료 서비스를 제공하기 위해 개설하는 의료기관으로, 지역 보건의료체계의 기초를 담당합니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 취소 일자, 영업상태, 영업상태명, 소재지 주소 등 기본 항목이 포함되어 있으며, 이를 통해 종로구 내 의원의 개설 및 폐업 현황을 체계적으로 확인할 수 있습니다. 주민은 해당 자료를 활용하여 가까운 의원 정보를 파악할 수 있고, 행정기관은 인허가 현황을 분석하여 보건의료 정책 수립 및 의료 서비스 수급 조정에 활용할 수 있습니다. 또한 연구자는 의원 분포 현황을 기초자료로 삼아 지역 의료 인프라의 균형과 접근성 제고 방안을 모색할 수 있습니다. 본 자료는 종로구민의 건강 증진과 공공의료 서비스 향상을 지원하기 위하여 개방됩니다.
