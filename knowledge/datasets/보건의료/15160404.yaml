description_portal: 본 데이터는 한국보건산업진흥원이 제공하는 국민영양통계 원본자료를 기반으로, 2020년부터 2023년까지 주요 영양소의 섭취에 기여한 식품의 순위와 섭취량을 정제·가공한 파일데이터이다. 기존에 연도별, 성별, 연령층별, 지역별로 분산되어 있던 자료를 하나의 파일로 통합하고, 연도, 분석기준, 기준값, 순위, 식품명, 섭취량, 표준오차, 비율 및 누적비율 항목으로 재구성하였다. 이용자는 특정 영양소의 주요 공급원이 되는 식품과 각 식품이 전체 영양소 섭취에 기여하는 정도를 확인할 수 있으며, 성별·연령층·지역별 급원식품 차이와 연도별 변화를 분석할 수 있다. 영양소 섭취원 분석, 식생활지침 및 영양정책 수립, 영양과잉·결핍 관리, 건강증진사업, 식품산업 연구, 식단개발, 학술연구 및 인공지능 기반 영양분석 등에 활용할 수 있다.
