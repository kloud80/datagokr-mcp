summary_user: 진료정보교류 사업에 참여하는 전국 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 의료기관명·우편번호·주소·등록일자를 담는다(포털 설명상 2024년 4월 말 기준). 환자나 의료인이 '내가 다니는 병원이 다른 병원과 진료기록을 전자로 주고받을 수 있는 곳인가'를 확인하거나, 분석가가 지역별 참여 기관 분포와 참여 시점을 살피는 데 쓴다. 공통 기관 코드 같은 전역 조인 키가 없어 LOCALDATA 병의원 인허가나 의료기관 목록과는 의료기관명·주소를 맞춰 이어 써야 한다.
description_portal: '보건복지부에서 2024년 4월 말 기준으로 진료 정보를 교류하는 의료기관의 우편번호, 주소, 등록일자 등을 제공하고 있습니다.<데이터 이용 시 참고사항>1. 진료정보교류 : 환자의 진료 시 의료인이 생성한 진료기록을 의료인 간에 전자적인 방식으로 교류문서를 상호 교환하는 방식2. 진료정보교류 사업 : 의료의 연속성을 보장하기 위해 개인정보 제공에 동의한 국민(환자)에 대하여 본인의 진료기록을 원하는 의료기관에 전자적 방식으로 안전하게 송수신하여, 의사가 환자 진료에 참조할 수 있도록 교류하는 서비스'
