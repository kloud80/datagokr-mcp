summary_user: 경상남도 함안군 안에서 폐의약품을 받는 수거함과 수집에 참여하는 약국·보건소 등 수거지점을 한 곳당 한 행으로 담은 파일(csv, 약 2.7KB)로, 기관명·주소·전화번호를 담는다. 함안군 주민이 집에 남은 약을 어디에 버려야 하는지, 가장 가까운 수거 약국이나 보건소가 어디인지 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 기관명을 맞춰 붙여야 하며, 주소를 좌표로 바꾸면 지도 서비스나 인근 시군의 수거함 데이터와 함께 쓸 수 있다.
description_portal: 이 정보는 가정에서 사용이 끝난 폐의약품을 안전하고 올바르게 처리할 수 있도록 돕기 위해 제공됩니다. 폐의약품은 환경에 해로울 수 있기 때문에, 적절한 방법으로 배출하는 것이 매우 중요합니다. 이를 위해 약국, 보건소 등과 같은 1차 수거지점에서 폐의약품을 수거하고 있습니다. 이 수거지점들은 주민들이 손쉽게 폐의약품을 처리할 수 있는 곳으로, 해당 장소에 대한 구체적인 정보—수거 장소의 이름, 주소, 전화번호 등을 제공하고 있습니다.이 정보를 통해 주민들은 가까운 수거 장소를 찾아 폐의약품을 배출할 수 있으며, 불법적인 배출이나 환경 오염을 예방하는 데 기여할 수 있습니다. 또한, 이러한 수거 시스템은 폐의약품이 적절히 처리될 수 있도록 해 환경 보호와 공공 건강을 지키는 데 중요한 역할을 합니다.
