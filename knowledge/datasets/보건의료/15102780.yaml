summary_user: 국민건강보험공단의 장기요양급여 실적을 인정 등급별·급여 종류별(방문요양·방문목욕·방문간호·주야간보호·단기보호·복지용구·노인요양시설·노인요양공동생활가정·통합재가서비스)로 집계한 전국 단위 통계 파일이며, 건별 원천이 아닌 집계표이다. 장기요양 정책 분석가나 연구자가 '등급별로 어떤 급여를 얼마나 이용하고 공단부담금은 얼마인가'를 파악하는 데 쓴다. 실측 컬럼에 기관코드 같은 전역 조인 키가 없어 다른 장기요양 통계와는 등급명·급여 종류명을 맞춰 연결해야 한다.
