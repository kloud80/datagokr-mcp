description_portal: '주석 1) 본 데이터의 지급 기준에는 급여 대상자 중 사망자의 급여 실적도 포함되어 집계되었습니다. 2) 통계는 매년 연도 말 기준으로 수급자의 주민등록 주소지를 기준으로 작성되었으며, 실제 거주지와는 다를 수 있습니다. 3) ‘계’ 항목의 급여 이용 수급자 및 급여 제공 기관 수는 급여 종류별, 인정 등급별 중복을 제외한 순수 수치를 의미합니다. 4) 2013년부터 항목명이 다음과 같이 변경되었습니다:       - 요양실인원 -> 급여이용수급자       - 요앙실기관-> 급여제공기관       - 요양일수 -> 급여제공일수       - 총요양비 -> 급여비용       - 요양급여비 -> 공단부담금'
