summary_user: 대구광역시 군위군 관내 의료기관을 기관별로 한 줄씩 담은 소규모 원천 목록 파일(csv, 약 1KB)로, 업종구분·의료기관명·주소·전화번호를 담는다. 군위군 주민이나 보건행정 담당자가 "우리 지역에 어떤 병원·의원·약국이 어디에 있고 연락처는 무엇인가"를 확인하거나 생활권별 의료시설 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 의료기관명·주소를 이름 매칭하거나 주소를 지오코딩해 공간 결합하는 방식으로만 이어 쓴다.
limits: 기관 코드 같은 공통 키가 없어 LOCALDATA 인허가 데이터나 건강보험 요양기관 정보와 자동으로 정확히 연결되지 않는다. 범위는 군위군 한 곳에 한정되고 좌표 없이 주소만 있어, 다른 지역과의 비교나 GIS 분석에는 별도 지오코딩과 다른 시군구 자료가 필요하다.
