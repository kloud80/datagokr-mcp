summary_user: 2022년 의료급여 수급자 가운데 본인부담 면제·경감 대상자를 월별로 전국 시도·시군구 단위로 집계한 통계로, 노숙인·희귀난치성질환자·중증질환 및 화상환자·등록 결핵 질환자(1종)와 조산아·저체중 출산아(2종) 유형별 인원과 실인원, 면제·경감 건수를 담는다. 지자체 복지 담당자나 분석가가 "우리 시군구의 의료급여 본인부담 면제 대상자 규모와 유형 구성이 다른 지역과 얼마나 다른가"를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키(행정구역 코드 등)가 없어, 다른 지역 통계와는 시도·시군구 이름을 코드로 매핑해 연결해야 한다.
description_portal: 이 데이터는 2022년 기준 의료급여 수급자 중 본인부담 면제 대상자에 대한 월별 통계를 시도 및 시군구 단위로 집계한 자료입니다.건강취약계층에 대한 의료복지 지원 실태와 지자체별 의료급여 운영 편차 등을 비교 분석하는 데 활용될 수 있습니다.[2022년 기준 의료급여 본인부담면제자 월 통계]구축년월, 구축시도, 구축시군구,노숙인1종, 신 희귀난치성질환자 1종, 신 중증 질환 및 화상환자 1종,실인원, 등록 결핵 질환자 1종, 등록 조산아 및 저체중 출산아 2종,본인부담면제건수, 본인부담경감건수
