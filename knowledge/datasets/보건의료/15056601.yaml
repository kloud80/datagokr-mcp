summary_user: 경기도 시군에서 인허가받은 동물용 의약품 도매상을 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·주소·연락처·WGS84 좌표를 포함한다. 축산 농가나 동물병원, 유통 분석가가 '우리 시군에 영업 중인 동물약품 도매상은 어디이고 몇 곳인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 시군명, 주소·좌표를 기준으로 다른 경기도 인허가 데이터나 지도와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군에서 인허가 받은 동물용 의약품 도매상 현황을 제공하며, 가축과 반려동물 등에 사용되는 의약품을 유통·판매하는 도매업소의 정보를 포함합니다. 항목으로는 시군명, 사업장명, 인허가일자, 영업상태, 소재지 주소(도로명 및 지번), 연락처, 업태정보, 종업원 수, 좌표값(WGS84), 축산업무 구분명, 축산물 가공업 구분명, 고유번호 등으로 구성되어 있습니다. 해당 데이터는 동물약품 유통현황 파악, 지역별 약품공급 구조 분석, 축산업계 방역 및 동물의료 체계 점검, 정책 수립 등을 위한 기초 자료로 활용될 수 있습니다. API를 통해 실시간으로 접근 가능하며, 주간 단위로 갱신되어 최신성을 유지합니다.
