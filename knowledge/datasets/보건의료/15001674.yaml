summary_user: 건강보험심사평가원이 관리하는 특수진료병원(전문병원 등)을 병원 단위로 조회하는 API로, 전국 범위에서 병원명·종별·주소·시도/시군구·전화번호·홈페이지·개설일자를 기관별로 담는다. 환자나 보호자가 '우리 지역에서 특정 진료 분야 전문병원은 어디인가'를 찾거나, 분석가가 시도·시군구별 특수진료병원 분포를 파악하는 데 쓴다. 암호화된 요양기호(ykiho)가 조인 키라서 심평원 병원정보·진료과목·시설·인력 등 다른 요양기관 API와 기관 단위로 이어 쓰고, 시도·시군구 코드로 지역 집계와 연결한다.
