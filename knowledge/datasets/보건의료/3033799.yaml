summary_user: 대전광역시 중구 안의 병원·의원·치과·한의원·보건소 등 의료기관을 한 곳당 한 행으로 담은 목록 파일로, 의료기관 종별·이름·도로명주소·전화번호·우편번호를 담는다. 주민이 '중구에서 가까운 치과의원이나 한의원이 어디 있고 전화번호가 무엇인가'를 찾거나, 분석가가 중구 내 의료기관 종별 분포와 입지를 살펴보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 의료기관명·도로명주소를 맞추거나 주소를 좌표로 바꿔 LOCALDATA 병의원 인허가 정보 같은 자료와 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 병원 및 의원 정보(연번, 의료기관종별, 의료기관명, 의료기관주소, 의료기관전화번호, 의료기관우편번호) 현황을 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 의료기관종별은 병원, 보건소, 보건지소, 보건진료소, 의원, 일반요양병원, 조산원, 종합병원, 치과병원, 치과의원, 한방병원, 한의원 등으로 구성되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
