description_portal: 이 데이터는 국립춘천병원 의료부 내과에서 시행된 진단의학과 검사의 실적을 연월 단위로 집계해 제공하는 공공데이터입니다.※ 2025년 12월까지 "내과 검사실적"으로 일괄 개방하였던 데이터 3개 중 1개입니다.※ 아래 검사 관련 설명은 참고 사항일 뿐 법적책임은 없음을 밝혀드립니다. 자세한 내용은 전문가와 상담하시기를 바랍니다.데이터는 구분, 생화학검사, 혈액학검사, 면역혈청검사, 뇨분석검사, 갑상선검사, 약물검사로 구성되어 있습니다.구분은 연월 정보를 나타냅니다. 이를 통해 월별, 연도별 비교·분석이 가능합니다.구분을 제외한 모든 항목은 해당 기간 실시된 검사의 건수를 제공합니다. 생화학검사는 혈액 및 요 검체를 이용하여 체내에 있는 전해질, 단백질, 효소, 지질, 탄수화물 등을 검사하며, 전해질 평형이나 신진대사의 상태 또는 우리 몸에 있는 장기들의 기능(간, 신장, 췌장 등)을 간접적으로 살펴볼 수 있는 검사입니다.혈액학검사는 혈액 속에 있는 세포 즉 백혈구, 적혈구, 혈소판의 수와 모양 등을 분석하는 검사로 백혈병 세포, 빈혈, 출혈 경향 등 혈액질환 및 증상을 알 수 있습니다. 면역혈청검사는 항원-항체 반응을 이용하여 바이러스 관련 질환을 검사합니다.뇨분석검사는 소변을 이용하여 검사하는 것으로 신장 및 우리 몸의 건강 상태를 확인하는 검사입니다. 소변의 산성, 단백질, 당, 케톤, 혈액 등이 포함되어 있는지 확인합니다.갑상선검사는 갑상선 기능을 평가하는 데 필요한 호르몬들의 수치를 측정하는 검사들의 조합으로, 갑상선자극호르몬(TSH), 삼요오드티로닌(T3), 유리 티록신(Free T4)을 검사합니다.약물검사는 혈액 안 특정 약물의 농도를 측정하는 것으로, 혈중 약물 농도가 치료적인 범위 내에 있는지를 확인하는 검사입니다.
