summary_user: 전국 시군구 단위로 학교급·구분별 학교흡연예방사업 예산(원)과 SENSE·Jr.END·END·CROWN 프로그램 운영계획을 담은 계획 현황 파일(csv)이다. 교육청·보건 담당자나 분석가가 "우리 지역 초·중·고에서 흡연예방 프로그램을 얼마의 예산으로 몇 개나 계획했나"를 비교하는 데 쓴다. 전역 조인 키는 없어 시도명·시군구명을 이름으로 행정구역 코드에 매핑해 지역사회 건강조사 등 시군구 건강지표와 잇는다.
description_portal: '- 미래 세대 중심인 청소년들이 담배에 접근하는 것을 사전에 차단하고, 조기 금연을 유도하기 위한 사업 계획 현황- 효과적 사업 추진을 위한 교육 대상자별(교사, 학생, 학생 흡연 여부 등) 맞춤형 교육 프로그램을 진행- 교사 대상 프로그램  학교 흡연예방사업 담당교원 직무연수, 중학교 교과 연계 흡연예방 교육, 흡연학생 이해 및 관리 연수 (CROWN 운영 교사용), 금연 상담·사업 전문가 과정- 학교 대상 프로그램  SENSE 표준 교육 프로그램, 온라인 초등 흡연예방 프로그램, 자유학기제 연계 중학생 프로그램, Jr.END(초등학생), END(중·고등학생), CROWN(고도 흡연 청소년)'
