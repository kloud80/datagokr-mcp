summary_user: 인천광역시 10개 군·구 보건소에 1개소씩 설치된 치매안심센터의 소재지 주소와 연락처를 센터 한 곳당 한 행으로 담은 소규모 CSV 파일(약 1KB)이다. 치매 진단·예방 상담이 필요한 시민이나 가족이 "우리 구 치매안심센터는 어디에 있고 전화번호는 무엇인가"를 확인하거나, 지역 돌봄 안내 서비스에 센터 목록을 넣을 때 쓴다. 실측 컬럼에 보건소코드·시군구코드 같은 전역 조인 키가 없어서, 다른 보건소·지역사회 건강조사 데이터와는 군·구 이름(구분)이나 주소를 맞춰서만 이을 수 있다.
description_portal: 인천광역시  10개 군구(강화군, 옹진군, 중구, 동구, 미추홀구, 남동구, 연수구, 부평구, 계양구, 서구) 치매안심센터 주소 및 연락처를 포함한 데이터 현황입니다. (2026년 7월 24일 기준)치매 진단 및 예방 관리에 관심이 있는 시민은 군구 보건소에 1개소씩 설치되어 있는 치매안심센터로 연락하시면 올바른 정보를 얻을 수 있습니다.치매는 예방이 가능하고 조기 발견 및 관리 시 악화를 늦출 수 있으므로 전문가의 도움으로 치매환자와 가족의 삶의 질 향상에 도움이 됩니다. 본 자료를 활용하여 인천시 내 치매안심센터 정보를 확인할 수 있으며, 데이터는 분기별로 업데이트되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, CSV 형식으로 제공됩니다.
