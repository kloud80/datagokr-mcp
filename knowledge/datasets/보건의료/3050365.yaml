summary_user: 국립춘천병원 한 곳의 입원 재원자 수를 연월별로 정리한 집계 파일로, 건강보험 적용(보험)·의료급여 적용(급여)·비적용(일반) 환자 수를 나눠 담는다(약 3KB CSV). 공공병원 분석가나 정책 담당자가 "이 병원 입원환자 중 의료급여 환자 비중이 월별로 어떻게 달라지나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월이나 기관명을 기준으로 직접 맞춰 이어야 한다.
description_portal: 국립춘천병원에 입원 중인 재원자 수를 월별로 정리한 이 데이터는 병원의 의료서비스 제공 현황과 재원자 분포를 파악할 수 있는 자료입니다. 구분 항목에는 연월이 기록되어 있습니다. 보험 항목은 건강보험 혜택을 적용받는 입원 환자의 수를 나타내며, 급여 항목은 의료급여를 적용받는 환자의 수를 나타냅니다. 일반 항목은 보험이나 급여 혜택 없이 입원 중인 환자의 수를 나타냅니다. 이처럼 각 항목은 병원의 입원환자 구성과 보험·급여 적용 여부를 상세히 보여줍니다. 이러한 데이터는 입원 환자들의 유형별 분포를 분석하거나, 정책 수립을 위한 기초자료로 활용할 수 있습니다. 또한 환자군별로 필요한 의료서비스나 지원 방안을 마련하는 데 도움을 줄 수 있습니다.
