description_portal: 인천광역시 법정 감염병 발생 및 사망과 관련한 현황 데이터입니다. 지역 내 감염병 확산 추세를 파악할 수 있으며, 보건 정책 수립 및 감염병 예방 활동에 유용하게 활용할 수 있습니다.수요자는 이 데이터를 분석하여 지역 보건관리와 감염병 대응 전략 수립에 참고할 수 있습니다. 법정감염병 89종에 대한 신속 대응 및 감시체계 강화를 목표로 할 수 있습니다.* 감염병의 예방 및 관리에 관한 법률에 근거하여 국가 감염병 감시체계를 통하여 보고된 2024년 감염병 환자 발생 신고를 기초로 집계되었습니다.
