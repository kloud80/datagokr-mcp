summary_user: 식약처가 관리하는 체외진단의료기기 보유업체의 현황을 업체 단위로 담은 API 데이터로, 전국 820건에 업체명·허가일자·소재지 주소·휴폐업 구분·관할청 등이 있고 허가일자 기간은 1974-07-29부터 2026-09-11까지다. 국민·사업자·분석가가 특정 체외진단기기 업체가 허가를 받았는지, 지금 영업 중인지 휴폐업 상태인지 확인하는 질문에 쓴다. 사업자등록번호(BRNO)와 소재지 주소(BSSH_ADDR)를 조인 키로 삼아 다른 사업자·인허가 데이터와 이어 쓴다.
description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 체외진단의료기기 보유업체 현황 정보입니다 체외진단의료기기를 제조 수입 판매하는 업체들의 전반적인 현황을 체계적으로 관리하여 업계 투명성을 제고하고 관련 정보를 공개합니다. 업허가일자는 해당 업체가 언제부터 허가를 받고 영업을 시작했는지를 보여주며 소재지 주소 정보를 통해 업체의 위치를 파악할 수 있습니다. 휴폐업구분은 현재 영업 중인 업체와 휴업 또는 폐업한 업체를 구분하여 실제 운영 현황을 정확히 파악할 수 있도록 합니다.  업허가번호와 관할청 정보는 행정적 관리 체계를 명확히 하여 업체 관리의 효율성을 높입니다
