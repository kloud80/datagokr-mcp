description_portal: '보건복지부에서 2017년부터 2023년까지 인체조직기증현황(기증연, 기증자의성별, 연령, 시도, 기증형태, 기증건수)에 대해서 정보를 제공합니다.<데이터 이용 시 참고사항>1. 데이터 출처 : 장기이식의료기관, 장기이식등록기관 등으로부터 기증(희망)자 정보, 이식자 정보, 대기자 정보를 장기조직혈액통합관리시스템을 통해 통보받아 통계 작성2. 인체조직 : 「장기등 이식에 관한 법률」 제4조제1호에 따른 장기등에 속하지 아니한 것으로 법령으로 정하고 있는 조직*    * 뼈, 연골, 근막, 피부, 양막, 인대 및 건, 심장판막, 혈관, 신경, 심장막3. 기증유형 : 장기기증 시점에 따라 뇌사, 사후, 생존 시로 구분4. 통계 데이터에 값이 없는 경우는 공백으로 표기하였습니다.'
