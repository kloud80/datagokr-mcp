summary_user: 경기도에서 동물장묘시설 허가를 받은 업체를 사업장 단위로 담은 현황 목록이며, 시군명, 사업장명, 전화번호, 지번·도로명 주소, 우편번호, WGS84 위도·경도로 구성된다. 반려동물 보호자가 '우리 시군에서 허가받은 반려동물 장례업체가 어디 있나'를 찾거나, 분석가가 시군별 장묘업체 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명이나 주소 문자열 매칭, 또는 위경도 좌표(refine_wgs84_lat·refine_wgs84_logt)를 이용한 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 동물장묘시설에 대한 허가를 받은 업체의 현황을 나타내며, 시군명, 사업장명, 전화번호, 주소(지번 및 도로명), 우편번호, WGS84 좌표(위도 및 경도) 항목으로 구성되어 있습니다. 반려동물의 사후 처리를 위한 장례 서비스를 제공하는 사업장들의 위치 및 기본 정보가 포함되어 있으며, 지도기반 위치 확인 및 공간분석이 가능한 좌표 정보도 함께 제공됩니다. 이 데이터는 반려동물 보호정책 수립, 관련 산업 분석, 시민 편의를 위한 업체 정보 제공 등에 활용될 수 있습니다. 또한, 장묘업체의 허가 상태를 파악하여 합법적 운영 여부를 확인하는 데에도 유용합니다.
