summary_user: 보령시 당직의료기관을 기관별로 담은 원천 목록으로, 기관명·주소·전화·좌표와 진료시간·휴일진료·진료구분 등을 담는다(범위는 보령시, 개별 주소·좌표 단위). 주말이나 공휴일에 보령시에서 문을 연 병원·약국을 찾는 주민이나, 지역 야간·휴일 의료 공백을 지도에 그려 보려는 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명·주소 매칭이나 위경도(lat, lon) 기반 공간 결합으로 잇는다.
description_portal: 의료기관명을 통해 진료시간, 주소 등의 당직의료기관정보를 조회하는 보령시당직의료기관조회서비스
