description_portal: '인천광역시 중구 권역응급의료센터, 지역응급의료기관, 기관분류, 기관명, 주소, 연락처에 대한 공공데이터 정보로 응급의료기관의 주소,  전화번호 등 기본 정보를 제공합니다.갑작스러운 위급 상황이 발생시 관내 권역응급의료센터와 지역응급의료기관을 방문하여 응급의료 서비스 제공 받음으로써 위급 상황에서 신속하게 도움을 받을 수 있습니다. 구민의 안전을 지키는 공공의료서비스로 응급상황에 신속한 진료와 치료를 제공하여 안전하게 대응할수있습니다.○ 인천광역시 중구 응급의료기관 현황 : 권역응급의료센터(1개소), 지역응급의료기관(1개소)'
