summary_user: 부산 동래구 관내 의료기관에 설치된 특수의료장비(MRI·CT·유방촬영장치)를 의료기관별·장비별로 정리한 목록 파일로, 의료기관명·종별·장비종류·모델명을 담는다(파일 크기 약 3.5KB의 소규모 CSV). 동래구 주민이 가까운 병원 중 MRI나 CT를 갖춘 곳을 찾거나, 분석가가 구 단위 고가 영상장비 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가 데이터(LOCALDATA 병의원 등)와는 의료기관명을 기준으로 이름 매칭해서 이어 써야 한다.
description_portal: 의료기관은 보건의료 시책상 적정한 설치와 활용이 필요하여 보건복지부장관이 정하여 고시하는 의료장비인 특수의료장비를 설치ㆍ운영하려면 보건복지부령으로 정하는 바에 따라 시장ㆍ군수ㆍ구청장에게 등록하여야 하며, 보건복지부령으로 정하는 설치인정기준에 맞게 설치ㆍ운영하여야 합니다.관내 의료기관의 특수의료장비 자기공명촬영장치(MRI), 전산화촬영장치(CT), 유방촬영용장치(mammography)에 대하여 정리하였으며, 매년 매분기마다 업데이트된 내역을 공개합니다.
