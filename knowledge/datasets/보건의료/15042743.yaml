summary_user: 경기도 의정부시 관내 부속의료기관을 한 곳씩 담은 인허가 원천 목록으로, 사업장명·인허가일자·영업상태·주소·좌표·의료기관 종별·의료인 수·총면적·진료과목을 기관 단위로 담는다(파일 크기 약 2KB의 소규모 CSV). 의정부시에서 어떤 부속의료기관이 어디서 영업 중이거나 폐업했는지, 개폐업 흐름을 상권·의료자원 분포 신호로 보려는 분석가와 주민이 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소 매칭이나 좌표 기반 공간 결합으로 잇고, 같은 LOCALDATA 계열 병원·의원 인허가 파일과 항목 구조를 맞춰 함께 쓴다.
limits: 실측 컬럼에서 공통 조인 키를 찾지 못해 다른 기관·전국 데이터와는 이름·주소 매칭으로만 연결된다. 범위는 의정부시 한 곳의 개별 사업장이라 시군구 간 비교에는 다른 지역 파일을 따로 모아야 한다.
