summary_user: 국내 마약류 취급 업체별로 실적년도·품명·포장유형에 따라 허가량과 실제 생산(수출입)량을 담은 업체·품목 단위 실적 데이터로, 범위는 전국이며 지역 구분은 없다. 마약류 수급 현황을 조사하는 분석가나 정책 담당자가 '어느 업체가 어떤 마약류를 어느 해에 허가량 대비 얼마나 생산·수출입했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명(BSSH_NM)·품명 같은 이름 매칭이나 식약처 내부 코드(허가종별·포장유형 코드)로만 이어 쓴다.
limits: 품목기준코드 같은 공통 키가 없어 심평원 약가·급여 목록 등과 곧바로 조인할 수 없고, 이름 매칭에 기대야 한다. 전국 단위 비공간 데이터라 지역별 분석에는 쓰지 못한다. 개발계정은 하루 10,000회 호출 한도가 있다.
