summary_user: 국민건강보험공단이 관리하는 의료급여 기관 중 종합전문병원의 기관별 등록·변경·폐쇄 이력을 담은 전국 단위 소형 파일(csv 약 2KB)로, 요양기관기호·기관 구분·등록일자·폐쇄일자·변경일시를 기관 한 건씩 담는다. 의료급여 업무 담당자나 분석가가 어떤 종합전문병원이 언제 의료급여기관으로 등록되거나 폐쇄·변경됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 요양기관기호를 같은 기관 코드 체계를 쓰는 요양기관 원장 자료와 맞추거나 기관명·코드 매핑으로 이어 써야 한다.
limits: 기관명·주소·진료과·병상 같은 기관 기본정보는 없어, 이 파일만으로는 어느 병원인지 식별하기 어렵다. 공용 조인 키가 확인되지 않아 심평원 요양기관 API(ykiho) 체인과 바로 연결된다고 보장할 수 없다.
