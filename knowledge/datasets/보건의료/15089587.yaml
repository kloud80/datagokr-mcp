summary_user: 3단 상병(주상병코드) × 시도 × 진료년도 단위로 건강보험 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액을 집계한 전국 통계 파일입니다(약국 제외, 양방만, 심사 결정 기준). 분석가나 지자체 보건 담당자가 '특정 질병의 환자수와 진료비가 어느 시도에서 많은가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 주상병코드는 KCD 질병분류명과, 시도구분은 시도 이름 매핑으로만 다른 지역·질병 통계와 연결한다.
limits: 주상병 기준의 청구 진단명이라 실제 확정 질병과 다를 수 있고, 환자수는 범주 안에서만 중복을 제거해 상병·시도를 단순합산하면 중복이 생긴다. 심평원 청구 기준 값이라 공단(자격 기준) 통계와 수치가 다르며, 비급여 진료비는 포함하지 않는다.
