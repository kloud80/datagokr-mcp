summary_user: 국립춘천병원 연간 입원환자 실인원을 연도(구분)별 한 행으로, 환자 주소지 기준 17개 시·도와 '주소없음', 총계 열로 나눠 담은 집계 파일입니다(csv 563바이트의 소규모 표). 강원권 정신건강 입원 병상이 실제로 어느 지역 주민에게 쓰이는지, 강원 밖 원거리 입원이 연도별로 얼마나 되는지 알고 싶은 정책 담당자·분석가가 쓴다. 전역 조인 키는 없어 시·도 이름을 행정구역 코드나 지역별 인구·의료기관 통계와 이름으로 맞춰 이어 쓴다.
description_portal: 강원도 춘천시에 위치한 국립춘천병원에서 제공하는 연간 입원환자 지역별 실인원 데이터로 연도와 함께 각 지역의 입원환자 수를 기록한 자료입니다. 연도별 구분하여 나타내며, 주소지 기준으로 서울, 부산, 강원, 인천 등 해당 지역에서 내원한 입원환자 수를 나타냅니다. 또한 ‘주소없음’ 항목을 통해 주소지가 확인되지 않은 환자 수도 포함되어 있습니다. 이 데이터를 통해 각 지역별 환자 분포 현황을 확인할 수 있으며, 병원의 의료자원 배분, 환자 치료계획 수립, 지역보건의료 정책 마련 등에 중요한 기초자료로 활용됩니다. 더불어 총계 항목은 전체 환자 수를 집계하여, 연도별 병원 이용 현황을 한눈에 파악할 수 있게 해줍니다. 이러한 자료는 병원 내외의 연구 및 지역보건 향상에도 기여합니다.
