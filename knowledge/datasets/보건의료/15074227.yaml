summary_user: 전국 마약류취급자(마약·향정신성의약품·대마를 합법적으로 다루는 업체)의 허가 현황을 분류별로 담은 API로, 실측 필드는 허가일자·업종 코드·업종명·건수(CNT)로 구성되어 업소별 원천보다는 분류별 집계에 가깝습니다. 분석가나 보건 담당자가 '마약류취급자 허가가 업종(허가종별)별로 몇 건이고 언제 허가됐는가'를 파악하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종명 매핑이나 같은 식약처 코드 체계로만 이어 씁니다.
description_portal: 식품의약품안전처에서 제공하는 ‘분류별 마약류취급자 정보’ 데이터는 마약, 향정신성의약품, 대마 등으로 구분된 마약류를 합법적으로 취급할 수 있는 업체의 현황을 분류별로 제공합니다. 이 데이터에는 업소명, 표준업체코드, 허가일자, 허가종별, 취급물질, 허가조건, 취소·재개업 이력 등의 항목이 포함되어 있어 마약류 취급 허가 현황을 체계적으로 확인할 수 있습니다. 이를 통해 보건당국은 분류별 취급 현황을 기반으로 불법 유통 방지, 정책 수립, 관리·감독에 활용할 수 있으며, 연구·분석 자료로도 유용하게 쓰일 수 있습니다.
