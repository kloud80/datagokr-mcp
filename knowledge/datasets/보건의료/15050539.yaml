description_portal: '부산광역시 남구의 세탁업 현황에 대해 설명해 드리겠습니다.세탁업은 공중위생관리법에 따라 관리되는 업종 중 하나로, 남구에서도 관련 법규 및 조례에 따라 운영 및 관리가 이루어지고 있습니다.1. 세탁업 신고 및 관련 법규영업신고: 세탁업을 운영하기 위해서는 관할 구청(남구청 위생과)에 영업신고를 해야 합니다. 이는 공중위생관리법 제3조 제1항 및 동법 시행규칙 제3조 제1항에 근거합니다.처리 절차: 영업신고는 일반적으로 즉시 처리되며, 별도의 수수료는 없으나 면허세(18,000원 ~ 67,500원)가 부과될 수 있습니다. 건축물관리대장 등 관련 서류가 필요합니다.위생관리 기준: 세탁업자는 공중위생관리법 및 시행규칙에 따라 다음과 같은 위생관리 기준을 준수해야 합니다.석유계 용제 사용 시: 유해 물질 발생을 억제하기 위해 용제를 회수할 수 있는 밀폐형이나 용제회수기가 부착된 세탁용 기계를 설치·사용해야 합니다.세탁물 잔류물 관리: 세탁물에 세제, 유기용제 또는 얼룩제거 약제가 남지 않도록 해야 합니다.세탁물 위생 관리: 업소에 보관 중세탁업 공중위생서비스평가는 「공중위생관리법」 제13조에 근거하여 이루어지는 중요한 평가입니다. 이는 세탁업소를 포함한 공중위생업소의 위생관리 수준을 높이고 서비스의 질적 향상을 도모하여 국민 건강과 삶의 질 향상에 기여하기 위한 목적을 가지고 있습니다.1. 평가 목적 및 근거목적: 공중위생업소의 위생관리 수준 제고 및 서비스 질 향상, 국민 건강 증진.법적 근거:공중위생관리법 제13조(위생서비스수준의 평가)공중위생관리법 제14조(위생관리등급 공표 등)같은 법 시행규칙 제20조, 제21조, 제22조 (평가 주기, 등급 구분, 공표 절차 등)2. 평가 주기 및 대상평가 주기: 일반적으로 2년마다 한 번씩 평가가 실시됩니다.평가 대상: 공중위생관리법에 따라 신고된 모든 세탁업소가 대상이 됩니다.3. 평가 항목 및 내용세탁업 공중위생서비스평가는 크게 3가지 영역으로 구'
