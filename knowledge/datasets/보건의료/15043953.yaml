summary_user: 광주 광산소방서 관내에 119응급의료지정병원으로 지정된 병원을 병원별 한 행으로 담은 작은 현황 파일(CSV 755바이트)로, 병원명·의료기관 분류(지역응급의료센터/지역응급의료기관)·도로명주소·데이터기준일자를 담는다. 광산구 주민이나 구급 업무 담당자가 '광산구에서 응급실이 있는 지정병원은 어디이고 어느 등급인가'를 확인하는 데 쓴다. 전역 조인 키(기관코드 등)가 없어 다른 응급의료기관 데이터와는 병원명이나 주소를 맞춰 이어 써야 한다.
description_portal: 광주광역시 광산소방서 관내에 지정된 응급의료 지정병원에 관한 데이터로 응급실이 있는 병원 현황 등의 내용을 담고 있습니다. - 광주광산소방서 119응급의료지정병원은 지역응급의료센터와 지역응급의료기관으로 분류됩니다. - 지역응급의료기관 지정병원은 다음과 같습니다.   · 하남성심병원(산정동), 광주수완병원(수완동), 신가병원(신가동), 한국보훈복지공단광주보훈병원(산월동), 광주센트럴병원(신가동) - 지역응급의료센터 지정병원은 다음과 같습니다.    · 첨단종합병원(쌍암동), KS병원(수완동)
