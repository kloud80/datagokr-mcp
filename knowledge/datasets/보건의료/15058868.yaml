summary_user: 경기도가 정신질환 상병별로 연도마다 집계한 진료 현황으로, 기준년도·상병명별 진료실인원, 입·내원일수, 총진료비, 공단부담금을 담는다(건별 원천이 아닌 연간 집계). 보건 분석가나 정책 담당자가 '조현병·망상성 장애·뇌전증 등 질환별로 한 해 몇 명이 진료받고 건강보험 재정이 얼마나 쓰였나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상병명·상병코드(DISEA_CD_INFO) 이름·코드 매핑이나 같은 기관 자료끼리만 연결한다.
description_portal: 이 데이터는 정신질환 환자의 상병별 진료 현황을 연도별로 집계한 자료로, 의료 이용 규모와 비용 부담 현황을 파악하는 데 활용됩니다. 주요 항목에는 기준년도, 상병명내역, 전체 실인원수, 입·내원일수(입원 및 외래 진료 일수), 총진료비, 공단부담금 등이 포함되어 있습니다. 상병명에는 정신분열증(조현병), 망상성 장애, 뇌전증, 기타 정신 및 행동장애 등이 있으며, 해당 질환별로 연간 진료받은 환자 수와 치료 일수, 비용이 집계됩니다. 이 데이터는 정신질환 치료 수요 분석, 건강보험 재정 지출 구조 평가, 보건의료 자원 배분 및 정책 수립에 활용될 수 있습니다. * 2016년 자료는 2017년 6월 청구분까지 반영
