description_portal: '□ 데이터 개요본 데이터는 의료급여 제도의 운영 과정에서 발생하는 방대한 기초자료를 효율적으로 관리하기 위해 마련된 행정관리용 메타데이터입니다. 실제 환자 진료나 급여 내역과 같은 세부 데이터가 아니라, 연도별 자료 처리 구간을 관리하기 위한 기본적인 기준 정보를 제공합니다. □ 주요 내용데이터는 총 3개의 항목으로 구성됩니다.\1. 자료구분: NHIDRM 등과 같이 영문 코드로 표시되는 값으로, 의료급여 관련 원시자료의 유형·출처(원천 DB)를 구분하기 위한 내부 관리용 코드2. 공통행정코드: 3010000 등과 같이 숫자로 구성된 공통 행정 코드값3. 처리년도: 해당 의료급여 자료가 속하는 기준 연도4. 처리시작일련번호: 연도 내에서 특정 자료 관리 구간이 시작되는 고유 번호5. 처리종료일련번호: 연도 내에서 자료 관리 구간이 종료되는 고유 번호* “빈 셀은 데이터가 존재하지 않음을 의미하며, 공란(null value)으로 처리됩니다.”'
