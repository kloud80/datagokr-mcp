summary_user: 보훈병원이 진료를 맡긴 전국 위탁병원을 병원 한 곳 단위로 담은 API로, 병원명·주소·전화번호·종별·병상 수와 지역 대분류(시도)·소분류(시군구) 구분이 들어 있다. 보훈대상자나 가족이 '우리 동네(시군구)에서 보훈 위탁진료를 받을 수 있는 병원은 어디인가'를 찾을 때, 분석가가 지역별 위탁병원 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의료기관 데이터와는 병원명·주소를 맞추거나 시도·시군구 이름(region_big, region_small)으로 묶어 이어 쓴다.
description_portal: '보훈병원 위탁병원에 대한 진료정보 제공보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)지역 분류 추가 참고사항* region_big(지역(도)) - 대분류 지역: 서울특별시, 광역시, 도  (예, 서울, 부산, 경기 등)* region_small(지역(시)) - 소분류 지역: 시, 군, 구  (예, 춘천시, 인제군, 관악구 등)'
