summary_user: 의료기기 경미한 변경보고를 건별로 담으며, 업체명·품목명·품목구분·등급·보고구분·보고일자·변경항목·변경일자·보완차수를 전국 범위로 제공한다. 의료기기 제조·수입업체 담당자나 분석가가 '이 변경사항이 경미한 변경보고 대상으로 보고된 사례가 있는가', '어떤 변경항목이 자주 보고되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·품목명 같은 이름 매핑이나 변경항목코드 기준으로만 이어 쓴다.
description_portal: 본 데이터는 의료기기의 경미한 변경 보고 시에 '의료기기 허가∙신고∙심사 등에 관한 규정'(식약처고시) [별표 3] 경미한 변경사항에 명시된 사항이 적절하게 보고 되었는지 확인하기 위하여 수집되고 있습니다. 적절한 사항으로 보고되었는지 확인하기 위하여 업체명, 품목명, 품목구분, 등급, 보고구분, 보고일자, 변경항목코드, 변경항목명, 변경일자 등이 포함되어 있습니다. 본 데이터를 통하여 경미한 변경 보고에 대한 통계 분석 및 민원인 안내서 개정 시 적합, 부적합 사례로 활용하고 있으며, 향후 경미한 변경민원 접수 시에 오접수 사례를 줄일 수 있을 것으로 기대되고 있습니다.
