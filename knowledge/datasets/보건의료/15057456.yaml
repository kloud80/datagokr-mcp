summary_user: 식품의약품안전처가 허가한 의료기기의 품목허가 정보를 건별로 담은 원천 데이터로, 품목명·품목등급·품목허가번호·허가일자·품목상태·업체명을 제공하며 전국 213,871건 규모다. 의료기관 종사자나 업체 담당자가 특정 의료기기의 허가 여부와 등급, 품목 상태를 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관(식약처) 코드로만 이어 쓴다.
description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 관리하고 있는 의료기기 품목허가의 정보를 제공하기 위하여 구축된 공공데이입니다.  의료기기의 품목명, 품목등급, 품목허가번호, 허가일자, 품목상태, 업체명 등을 주요 항목으로 제공하고 있습니다. 해당 데이터를 통하여 허가된 의료기기 제품 정보에 대한 접근성 보장, 의료기관 및 전문가의 안전한 제품 선택 지원 및 산업계의 제품 기획과 개발 전략 수립 등으로 다양하게 활용될 것으로 예상됩니다. 그 외 일반인도 허가된 의료기기에 대한 정보를 쉽게 알 수 있습니다.
