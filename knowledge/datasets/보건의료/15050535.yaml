description_portal: 부산광역시 남구 필수예방접종 위탁의료기관 현황(의료기관명,대표자명,전화번호 등) 자료 제공 및 참여 백신정보 제공- 62개 예방접종 위탁의료기관 현황이 데이터는 부산광역시 남구에서 필수 예방접종을 시행하는 위탁 의료기관 현황을 담고 있습니다.필수 예방접종은 [감염병 예방 및 관리에 관한 법률] 제24조에 따라 특별자치시장, 특별자치도지사 또는 시장-군수-구청장이 관할 보건소를 통해 시행해야 하는 예방접종을 말합니다.남구보건소는 관내 62개 의료기관에 위탁하여 운영하고 있습니다.필수예방접종은 전국 지정 위탁의료기관에서 무료로 접종 가능하며, 전국 현황은 예방접종 도우미 (https://nip.kdca.go.kr/irhp)에서 확인 가능합니다.
