description_portal: '□ 데이터 개요본 자료는 국민건강보험공단이 보유한 의료보장 적용인구 현황에 대한 통계로, 의료보험 및 건강보험 체계 하에서 직장가입자, 지역가입자, 의료급여 수급자 등 의료보장 대상자의 연도별 적용 인구 현황을 제공합니다. 더불어 각 제도별 적용 기관(사용장)의 개소 수 정보도 함께 포함되어 있습니다.□ 주요 내용집계기준: 연도별보장유형: 의료보험, 건강보험, 의료급여가입자 구분: 직장가입자, 지역가입자제공항목: 연도, 보장유형, 가입자유형별 적용 인구 수, 사용장 개소 수활용예시: 의료보장제도의 인구 보장범위 추이 분석, 건강보험과 의료급여의 보장 확대 정책 수립 기반자료, 제도 간 보장인구 비교분석 등* 2023년 통계연보 기준(단위: 명)* 연도말 기준* 군위군이 경북에서 대구로 편입됨(2023.7.1.)에 따라 군위군 적용인구는 대구에 모두 포함하였으며, 작성기준에 따라 다른 통계자료집과 수치가 상이할 수 있음'
