summary_user: 경기도 내 의료기관별로 건강보험심사평가원의 관상동맥우회술 평가 결과(평가내역과 1~5등급 또는 등급제외)를 기관 한 곳당 한 행씩 담고, 시군명·시군코드, 도로명·지번 주소, 우편번호, 위경도 좌표를 함께 제공한다. 심장 수술을 앞둔 환자나 가족이 '우리 시군에서 관상동맥우회술 평가 1등급 병원은 어디인가'를 찾거나, 분석가가 시군별 고난이도 심장수술 역량 분포를 볼 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)로 시군 단위 통계와 묶거나, 기관명·주소를 맞춰 의료기관 인허가(LOCALDATA) 같은 다른 병원 데이터와 이어 쓴다.
description_portal: 이 데이터는 건강보험심사평가원이 제공하는 관상동맥우회술에 대한 병원 평가 정보를 포함하고 있습니다. 관상동맥우회술은 심장근육에 혈액을 공급하는 관상동맥이 막혔을 때 새로운 혈관을 연결해 혈류를 우회시키는 고난이도 수술입니다. 데이터는 병원별 관상동맥우회술에 대한 치료 성과를 종합적으로 평가하여, 1등급(90점 이상)부터 5등급(60점 미만)까지 구분하여 제공합니다. 등급이 낮을수록 수술 수행 능력이 우수한 기관으로 해석됩니다. 등급제외 기관은 평가지표별 건수가 3건 미만인 경우에 해당합니다.제공 항목은 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 소재지 도로명 및 지번 주소, 우편번호, 병원 위치 좌표 정보(WGS84 위도·경도) 등입니다.이 데이터는 환자의 병원 선택을 돕고, 의료 질 향상을 위한 정책 수립 및 연구, 병원 평가 시스템 개발 등 다양한 보건의료 분야에서 활용될 수 있으며, API를 통한 외부 연계도 지원됩니다.
