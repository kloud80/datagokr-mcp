summary_user: 군산시에서 집단급식소를 설치한 병원을 한 행에 한 곳씩 담은 목록 파일로, 병원명·병상 수·도로명주소·전화번호를 담는다(csv 1,823바이트 규모의 소량 파일). 위생 담당자나 급식 납품 사업자가 "군산시에서 급식소를 둔 병원은 어디이며 병상 규모는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 병원명이나 도로명주소를 맞춰 의료기관 인허가(LOCALDATA) 자료 등과 연결한다.
limits: 표준 기관코드나 사업자번호 같은 공통 키가 없어 다른 데이터와 붙일 때는 이름·주소 매칭에 기대야 한다. 범위는 군산시 한 곳의 개별 병원뿐이라 다른 시군 비교나 급식 인원·위생점검 결과 분석에는 쓸 수 없다.
