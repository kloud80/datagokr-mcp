summary_user: 부산광역시 서구에 있는 종합병원을 기관 한 곳당 한 행으로 담은 현황 파일로, 기관명·도로명 소재지 주소·병상수·입원실 수·진료과목·전화번호를 담는다(csv 약 1.5KB 규모). 서구 주민이 입원이나 특정 진료과 진료가 가능한 종합병원을 찾아 연락처를 확인하거나, 분석가가 서구의 종합병원 병상 규모를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가(LOCALDATA) 자료나 타 지역 종합병원 목록과는 기관명·주소를 맞춰 이어 쓴다.
description_portal: 대한민국 부산광역시 서구에 위치한 종합병원(100개 이상의 병상을 갖추고 내과,외과,소아청소년과,산부인과,영상의학과,마취통증의학과,진단검사의학과 또는 병리과,정신건강의학과 및 치과를 포함한 9개 이상의 진료과목을 갖추고 각 진료과목마다 전속하는 전문의를 둔 병원) 현황정보 데이터입니다. 이 데이터는 각 의료기관명, 의료기관 주소(도로명주소), 병상수,  입원실 수, 진료과목, 전화번호와 관련된 정보가 포함되어 있어 의료기관 방문이나 문의가 필요할 경우 유용하게 활용될 수 있습니다.
legal_basis_portal: 병원급 의료기관은 관할 보건소에 의료기관 개설허가를 받기에 보건소에서 데이터 정보(병원 정보) 보유하고 있음
