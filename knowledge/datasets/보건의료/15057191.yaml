summary_user: 경기도 내 의료기관에 설치된 유방촬영용 특수의료장비를 장비 한 대 단위로 담은 데이터로, 기관명·영업상태와 함께 장치명·모델·제조국·제조사, 설치·신고·사용중지·폐기 일자, 도로명·지번 주소와 위경도를 담는다. 보건 분석가나 지자체 담당자가 "우리 시군에서 사용 중인 유방촬영장치가 어디에 몇 대 있고 암 검진 접근성은 어떤가"를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 시군 코드·시군명(SIGUN_CD)이나 사업장명·주소·위경도로 다른 의료기관 인허가 데이터나 CT·MRI 등 다른 특수의료장비 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 의료기관에 설치된 유방촬영용 특수의료장비의 현황을 제공합니다.유방촬영장치는 유방암을 포함한 유방 관련 질환의 조기 발견 및 진단을 위해 필수적인 방사선 의료기기로, 종괴의 크기, 모양, 유선의 섬유화 등 세밀한 병변 분석에 사용됩니다.데이터에는 장치명, 장치모델, 제조국가 및 회사, 설치 및 신고일자, 위치(도로명 주소 및 위경도), 사용여부, 폐기여부 등 상세한 장비 정보가 포함되어 있어,지역별 의료장비 분포 분석, 암 검진 접근성 평가, 보건 인프라 현황 파악,공공의료시설 투자 판단 근거로 활용될 수 있습니다.주의사항:해당 데이터는 유방촬영기기에 한정되며, CT, MRI 등 기타 장비는 별도 데이터셋에서 제공됩니다.일부 장비는 폐기되었거나 사용중지 상태일 수 있으므로, 실시간 현황 파악을 위해서는 해당 기관 확인이 필요합니다.
