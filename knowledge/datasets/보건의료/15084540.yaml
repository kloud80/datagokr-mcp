description_portal: 충청북도 각 시군의 의료기관 목록입니다. 병원, 요양병원, 정신병원, 종합병원, 치과병원, 한방병원 정보를 포함합니다. 의료기관별 영업상태, 설립구분, 주소, 전화번호 등에 관한 자료로 충청북도 각 시군의 의료기관 현황을 손쉽게 알 수 있는 정보입니다. 해당 의료기관 이용 시 사전에 운영시간 및 진료과목 등을 문의하시어 방문하시기 바랍니다. 본 자료는 "의료법" 제3조(의료기관)에 의한 "병원급 의료기관" 현황임을 알려드립니다.  또한 의료기관 영업상태에 따라 의료기관 목록은 변동될 수 있음을 알려드리니 병원 방문 시 유선 확인 후 방문하시기 바랍니다. 기타 문의사항은 의료기관 관할 시군 보건소로 문의하시기 바랍니다.
