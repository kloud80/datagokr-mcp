description_portal: 부산광역시 연제구 관내 난임진단서를 제출한 난임부부(법률혼, 사실혼포함)에게 국가 난임 시술을 시행하고 있는  제공의료기관  현황 안내에 대한 자료입니다. 난임시술은 출산당 총25회 지원으로 체외수정20회(신선, 동결), 인공수정은 5회 지원 가능합니다. 난임시술비 중 전액본인부담금 90% 및 비급여3종(배아동결, 유산방지, 착상보조)이 지원되며 남은 한도내에 약제비 지원이 가능합니다. 등본상 연제구민이며 건강보험이 적용이 되어야 하며 건강보험 잔여 횟수가 없는경우 정부지원이 불가합니다.
