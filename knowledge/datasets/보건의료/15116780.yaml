summary_user: 광주 남구에 설치된 자동심장충격기(AED)를 한 대씩 설치기관·기관주소·설치위치·제조사·제조번호·설치일자로 담은 시군구 단위 개별 목록 파일(CSV)이다. 주민이나 위치 안내 앱 개발자가 '우리 동네 어느 건물 어디에 AED가 있나'를 확인하거나, 보건 담당자가 설치일자를 보고 오래된 기기를 점검할 때 쓴다. 전역 조인 키가 없어 다른 AED·응급의료 데이터와는 기관명이나 주소를 맞춰 붙여야 한다.
description_portal: 광주광역시 남구에 설치되어 있는 자동심장충격기 설치 현황으로 설치기관, 설치위치, 제조사 및 제조번호, 설치일자의 항목을 제공합니다. 해당 데이터는 광주광역시 남구청 보건행정과(☎062-607-4314)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 자동심장충격기(AED) 설치 현황은 심정지 환자 발생 시 즉각적으로 활용할 수 있는 응급 의료장치의 배치 정보를 제공하는 자료입니다. 자동심장충격기는 심장이 멎은 환자에게 전기 충격을 가해 정상적인 박동을 회복시키는 장치로, 공공기관, 학교, 체육시설, 지하철역, 다중이용시설 등에 우선적으로 설치됩니다. 해당 데이터는 설치 위치, 관리기관, 이용 가능 여부 등을 포함하여 주민과 방문객이 위급 상황에서 신속히 기기를 찾을 수 있도록 지원합니다. 지자체는 이를 통해 응급의료 대응 체계를 강화하고, 심폐소생술 교육과 결합하여 생존율을 높이는 정책을 수립할 수 있습니다. 민간에서는 자동심장충격기 위치 안내 애플리케이션, 안전 교육 자료, 응급 대응 연구 등 다양한 분야에서 응용할 수 있으며, 결과적으로 지역사회 안전망 구축과 생명 구조율 향상에 기여할 수 있습니다.
