description_portal: '1997년~2010년 통계 데이터○ 통계개요* 통계명 : 공중위생업 현황(동별)* 통계종류 : 서울시 공중위생업소 현황을 각 자치구 동단위로 제공하는 일반ㆍ보고통계* 근거법령 :「공중위생관리법」에 의거 자치구에 영업신고를 한 공중위생 관련 영업소및 위생용품 제조업소* 작성목적 : 공중위생업소의 현황을 파악하여, 사업체에 대한 효율적인 지원과 공중위생관련정책 수립을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 보건소 → 자치구 → 서울특별시 생활보건과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구 동별 공중위생영업 및 위생용품 제조업소의 개소수○ 용어설명* 공중위생영업 : 다수인을 대상으로 위생관리서비스를 제공하는 영업으로서 숙박업,목욕장업, 이용업, 미용업, 세탁업, 위생관리용역업을 말함○ 기타* 숙박업에 관광호텔 포함* 관련법 개정(2008년)으로 분류기준 변경○ 출 처 : 서울특별시 생활보건과'
