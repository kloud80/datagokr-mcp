summary_user: 동일 성분이나 유사 특성을 가진 의약품을 대표 제품과 함께 묶어, 대표 제품과 묶인 개별 품목의 제품명·업소명·제조소·허가일자·취소·취하 여부를 전국 범위로 담는 품목 단위 API입니다. 약사·분석가가 '이 약과 같은 묶음에 속한 다른 제품은 무엇이고, 그중 취소·취하된 품목은 어느 것인가'를 확인하는 데 쓴다. 포털 설명상 품목기준코드·심평원 제품코드·ATC코드가 제공되어 심평원 약가·급여 목록과의 연결이 기대되지만, 실측 컬럼에서는 전역 조인 키가 확인되지 않아 현재는 제품명·코드 매핑이나 식약처 다른 데이터의 같은 코드로 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와 붙일 때는 코드 값을 직접 대조해 매핑해야 한다. 지역 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓰지 못하며, 개발계정은 하루 10,000회로 호출이 제한된다.
