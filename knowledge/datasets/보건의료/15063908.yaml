description_portal: 식품의약품안전처 「묶음의약품정보서비스」 OpenAPI는 동일 성분이나 유사 특성을 가진 의약품을 대표 제품과 함께 묶어서 제공하는 공공데이터입니다. 이 데이터의 주요 제공 항목에는 대표 품목기준코드, 대표 제품명, 대표 주성분, 대표 함량, 대표 업소명, 대표 제조소, 대표 허가일자, 대표 심평원 주성분코드, 대표 심평원 제품코드, 대표 ATC코드, 취소·취하명 등이 포함되어 있습니다. 또한, 품목기준코드, 제품명, 업소명, 제조소, 허가일자, 심평원 제품코드, 취소·취하명 등의 항목도 추가적으로 제공합니다.
