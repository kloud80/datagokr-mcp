summary_user: 경기도 내 병원급 치과병원의 인허가 현황을 사업장 한 곳당 한 행으로 담는다. 사업장명, 인허가·폐업일자, 영업상태, 병상·입원실·의료진 수, 구급차 보유 수, 진료과목, 도로명·지번 주소와 위경도 같은 항목이 들어 있다. 분석가나 정책 담당자가 '경기도 시군별로 병원급 치과가 어디에 몇 곳 있고 최근 문을 닫은 곳은 어디인가'를 확인할 때 쓰며, 개폐업 흐름은 상권 변화를 읽는 신호로도 본다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시군 코드·시군명(SIGUN_CD)이나 사업장명·주소를 이름으로 맞추고 위경도로 공간 매칭해서 잇는다.
description_portal: 이 데이터는 경기도 내 30병상 이상을 갖춘 병원급 치과병원에 대한 인허가 현황을 제공하는 자료입니다. 치과의사가 외래환자를 대상으로 진료를 수행하는 의료기관의 사업장명, 진료과목내용, 의료진 수, 병상 수, 입원실 수, 일반·특수 구급차 보유 수, 연면적, 최초 지정일자, 위치정보(WGS84 위도·경도 포함) 등 총 31개 항목으로 구성되어 있습니다. 지역별 치과 의료자원 분포 분석, 의료 접근성 연구, 치과시설 수급정책 수립 등에 활용될 수 있으며, 행정안전부에서 주간 단위로 갱신하고 Open API 형태로 제공됩니다.
