summary_user: 서울 구로구 안 이용업소(이발소)를 업소 하나당 한 행으로 담은 인허가 원천 자료로, 인허가일자·영업상태·폐업일자 같은 영업 변동과 주소·좌표·면적·건물 층수·다중이용업소 여부를 기록한다. 주민은 동네에 정식 허가를 받아 영업 중인 이발소가 어디인지 확인하는 데 쓰고, 분석가는 지역 이용업소의 개업·폐업 추이를 상권 변화 신호로 보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 자치구나 다른 업종 인허가 자료와는 관리번호(MGTNO)·사업장명·주소를 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓴다.
description_portal: 서울특별시 구로구에서 제공하는 이용업 인허가 정보 데이터는 지역 내 이용업소의 인허가 현황과 영업 상태를 종합적으로 정리한 공공자료이다. 데이터에는 관리번호, 인허가일자, 인허가취소일자, 영업상태명, 상세영업상태명, 폐업일자, 휴업 및 재개업일자 등 영업 변동사항이 포함된다. 또한 전화번호, 소재지면적, 지번주소와 도로명주소, 사업장명, 우편번호 등 기본정보와 업태구분명, 좌표정보(X,Y), 위생업태명, 주변구분명 등이 기록되어 있다. 시설총규모, 건물소유구분, 보증액, 월세액, 급수시설, 건물용도, 다중이용업소 여부 등 영업장 환경에 관한 세부자료도 수록된다. 이를 통해 이용업소의 설립, 운영, 휴업, 폐업에 이르는 전반적 현황을 확인할 수 있으며, 위생관리와 생활서비스 품질 관리의 기초자료로 활용된다. 행정기관은 본 데이터를 활용하여 인허가 적정성 검토, 위생시설 충족 여부, 다중이용업소 관리 상태를 점검할 수 있다. 또한 위치정보와 시설규모를 바탕으로 지역 내 이용업소 분포를 분석하고, 취약지역 진단 및 서비스 품질 개선 방안을 마련할 수 있다. 연구기관은 자료를 활용해 이용업 운영실태, 시설규모와 영업 지속성 간의 관계를 분석할 수 있으며, 생활위생 연구와 공중보건 정책 연구에도 기여할 수 있다. 시민은 합법적으로 허가된 이용업소를 확인하여 신뢰할 수 있는 서비스를 이용할 수 있고, 생활권 내 위생환경에 대한 이해를 높일 수 있다. 본 데이터는 생활위생 강화, 공중보건 향상, 서비스 품질 개선에 기여하는 기반자료이다. 특히 소규모 자영업자의 영업 안정성 지원, 지역 생활서비스 균형 발전, 시민의 안전한 서비스 이용 보장을 위해 활용도가 높으며, 정기적 갱신과 품질관리를 통해 최신성과 정확성이 보장되어 누구나 공공데이터포털을 통해 활용할 수 있다.
