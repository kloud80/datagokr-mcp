description_portal: '○ 통계개요* 통계명 : 일반건강검진 수검률* 통계종류 : 해당연도의 건강보험적용인구 중 건강검진 대상자 및 수검자를 대상으로하는 보고·일반통계* 작성목적 : 보건의료 및 건강보험 정책수립의 기초자료로서, 건강검진 사후관리,질병예방 등 지역 보건의료 향상을 위한 국가정책방향 제시* 조사체계 : 전국 검진기관 및 건강보험공단 지사* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 건강검진 수검률 등○ 용어설명* 일반건강검진 : 건강보험 적용인구 중 건강검진 대상자 및 수검자를 대상으로 실시* 수검률 = 수검인원 / 대상인원 * 100○ 기타* 주민등록주소지 기준* 건강보험 대상자를 기준으로 작성(의료급여수급권자 자료는 제외)'
