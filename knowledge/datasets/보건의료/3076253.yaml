summary_user: 울산광역시 남구의 병원·의원을 기관 한 곳당 한 행으로 담은 파일로, 의료기관명·종별(병원·의원 등)·도로명 주소·전화번호·진료과목이 들어 있다. 남구 주민이 가까운 곳에서 특정 진료과목을 보는 의원을 찾거나, 분석가가 남구 안에서 진료과목별 의료기관 분포와 부족 분야를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명 주소를 맞춰 붙여야 하며, LOCALDATA 병의원 인허가 자료나 주소 기반 좌표 변환과 함께 쓰는 식이다.
