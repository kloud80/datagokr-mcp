summary_user: 의료취약지 의료지원 시범사업의 디지털의료지원시스템에 참여하는 의료기관을 기관 한 곳당 한 행으로 담은 전국 단위 파일이며, 시도·시군구, 기관명·기관유형, 협진 그룹, 보건(지)소·보건진료소 연계 여부, 의사·간호사·기타 인원을 함께 싣는다. 보건정책 분석가가 "우리 시군구에서 어떤 기관이 원격 협진에 참여하고, 보건진료소와 연계된 곳은 어디인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 시도·시군구 코드(행정표준코드)로 지역 통계와 맞추거나 기관명·기관코드로 의료기관 인허가 데이터와 이름·코드 매핑해 잇는다.
description_portal: 의료취약지 의료지원 시범사업의 디지털의료지원시스템  참여기관 정보 입니다.참여하고 있는 의료기관의 시도, 시군구,  기관명, 협진 그룹정보 등 내용을 확인 할 수 있습니다.보건(소)지소 및 보건진료소와 연계 유무 정보 통하여 디지털의료지원시스템과 연계하고 있는 기관도 가능합니다.(유의) 의료취약지 의료지원 시범사업에 미참여 기관일 경우 참여현황 데이터에 포함되지 않음, 코드 정보의 경우 대한민국의 주요 시도코드(법정동/행정표준코드)를 따릅니다. 코드에 대한 설명은 행정표준코드관리시스템을 참고 부탁드립니다.
