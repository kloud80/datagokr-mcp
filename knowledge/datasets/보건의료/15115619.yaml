summary_user: 서울 강서구 안의 대학교·기업체·복지시설 등에 딸린 부속의료기관을 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일자·취소일자, 영업상태와 폐업일자, 사업장명·전화번호·지번/도로명 주소, 좌표(X·Y), 의료인 수·병상 수·면적 같은 항목을 포함한다. 보건 분석가나 헬스케어 사업자가 "강서구에서 지금 운영 중인 사업장·학교 부속 의료기관은 어디이며 언제 개설·폐업했나"를 확인하고, 산업체·교육기관 건강관리 자원의 분포를 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 붙이며, 같은 LOCALDATA 체계의 병원·의원 인허가 데이터와 나란히 개폐업 흐름을 비교하는 데 쓴다.
description_portal: 서울특별시 강서구 내 부속의료기관의 인허가 관련 정보를 제공하는 데이터로, 대학교, 기업체, 복지시설 등에 부속되어 있는 의료기관에 대한 현황을 포함합니다. 제공 항목에는 인허가일자, 영업상태, 사업장명, 전화번호, 주소 등이 포함되며, 이는 해당 의료기관의 개설 및 운영 여부를 파악하고, 공공의료자원 분포를 분석하는 데 활용됩니다. 특히 지역 내 산업체 및 교육기관의 건강관리 체계를 이해하는 데 도움이 되며, 의료접근성 평가, 보건 정책 수립, 민간 헬스케어 기업의 협력기관 발굴 등에도 활용 가능합니다. 부속기관 특성상 일반 병원과는 다른 기능 및 운영 주체를 가지므로 특수한 의료수요에 대한 분석이 가능합니다.
