summary_user: 부산광역시 연제구 의료기관 가운데 CT·MRI 등 특수의료장비 설치를 위해 병상을 공동활용할 수 있는 기관을 기관 단위로 정리한 작은 파일(약 3KB CSV)로, 장비 종류·기관명·종별·주소·전화번호·병상 수·공동활용 여부를 담는다. 연제구에서 장비 설치 병상 기준을 맞추려는 소규모 의료기관이나 지역 의료자원 담당자가 "구 안에서 병상을 합산할 수 있는 상대 기관이 어디이고 병상이 몇 개인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 의료기관 인허가(LOCALDATA) 등 다른 데이터와는 의료기관명이나 주소를 맞춰 이어 써야 한다.
description_portal: 부산광역시 연제구 의료기관 중 특수의료장비에 대해 공동활용가능한  현항 데이터로 의료기관의 명칭, 소재지, 병상수 등을 제공합니다 특수의료장비 공동활용가능병상이란  의료기관이 CT·MRI 등 특수의료장비를 설치하기 위해 필요한 병상 기준에 미달할 경우, 인근 의료기관과 병상을 합산해 기준을 충족할 수 있도록 한 제도입니다. 동일 시·군·구 또는 인접 지역의 의료기관 간 협약이 필요하며, 치과병원,정신병원·요양병원, 치과의원, 한의원 등 일부 기관은 제외됩니다.이는 자체 보유 병상수가 부족한 소규모 기관의 장비 설치를 돕고, 공공데이터로 병상 수·장비 활용 현황을 정비해 지역 의료 자원 관리에 활용됩니다
