description_portal: '1. 기준년월: 2023년 1월~2025년 5월2. 특정 질환구분: 폐암(C34), 위암(C16), 유방암(C50) ※ 중증질환 산정특례제도는 보건복지부고시 「본인일부부담금 산정특례에 관한 기준」 제7조(산정특례 등록 신청 등)에 의하여 본인 또는 보호자가 신청하여야 하므로, 암으로 진단을 받았다고 하더라도 암 환자가가 모두 산정특례 등록자인 것은 아니며, 의료급여 수급권자의 경우 발췌 자료에 포함되지 않습니다. ※ 산정특례제도는 ‘등록된 산정특례 대상 질환’과 ‘등록된 산정특례 대상 질환과 의학적 인과관계가 명확한 합병증’까지 적용되므로, 해당 등록 기간 내에는 전이암 및 암 치료로 인한 합병증 치료까지 포함되어 최종 진단명과 다를 수 있습니다.   - 암: 보건복지부고시 「본인일부부담금 산정특례에 관한 기준」 [별표 3] 중증질환자 산정특례 대상 의 구분1에 해당하는 경우    - 신규암: 신청당시 암 산정특례 등록 이력이 없거나, 기 등록된 암의 특례기간 종료 이후 추가 발생한 암을 등록·신청하는 경우(모든 신규암 대상자가 그 해 첫 발병이 된 것을 의미하는 것은 아님)* 산정특례 등록신청 접수일자 기준 ※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
