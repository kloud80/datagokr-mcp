description_portal: '<시트1. 특정 주상병코드(N46, N97) 진료현황>1. 진료년도: 2010년~2023년2. 요양기관 주소지 기준3. 연령: 20세미만/20세부터 1세단위(연말 기준)4. 주상병코드: N46, N975. 진료인원: 해당 구분별 진료인원(중복제외)  - 진료일 기준(약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 지급분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음<시트2. 특정 주상병코드(O03-O06) 진료현황>1. 진료년도: 2010년~2023년2. 연령: 20세미만/20세부터 1세단위3. 주상병코드: O03-O064. 진료인원: 실수진자수는 연인원이며, 연단위 중복 환자 제외됨 - 2024년 6월 심사분까지 반영 - 5명 미만 시 마스킹 처리, 약국제외(참고) 동 자료는 학술연구에는 적합하지 않을 수 있으며, 공단에 맞춤형 DB연구를 신청하면 연구자가 직접 분석을 수행하실 수 있음을 안내드립니다.* 맞춤형 DB신청에 대한 자세한 내용은 자료공유홈페이지(nhiss.nhis.or.kr)를 참고바랍니다.* 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
