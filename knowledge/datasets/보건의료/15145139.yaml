description_portal: '1. 구분: 건강보험2. 진료년도: 2023년, 2024년 3. 행위코드: D4311(CA-125[정밀면역검사]), D4370(인간 부고환 단백 4[정밀면역검사])4. 주상병코드: 한의분류 및 약국 제외 - 질병통계자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라 일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종확정 된 질병과는 다를 수 있음5. 진료인원(중복제외) 및 진료건수(중복포함) - 진료일 기준 - 건강보험 급여실적 기준(의료급여, 비급여 제외) - 2025년 6월 심사분까지 반영6. 요양기관종별: 상급종합, 종합, 병원, 의원 구분 - 병원급이상: 진료과목, 의원급: 표시과목※ 개인정보 보호를 위해 5인미만 자료는 비식별화(*) 후 제공합니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격, 징수, 급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
