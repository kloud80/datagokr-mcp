summary_user: 인천 부평구 안에서 영업 중인 약국을 한 곳당 한 행으로 담은 파일 데이터로, 약국 이름·도로명 주소·우편번호·전화번호가 들어 있다(CSV 약 22KB). 주민이 '우리 동네 가까운 약국이 어디고 연락처가 무엇인가'를 찾거나, 분석가가 아파트 밀집지·병의원 위치와 비교해 약국이 부족한 동네를 가려낼 때 쓴다. 전국 공통 조인 키(인허가 번호·기관 코드 등)는 없어서, 다른 의료기관·인허가 데이터와는 도로명 주소나 약국 이름을 맞춰 연결해야 한다.
description_portal: '부평구 내에서 영업 중인 약국의 명칭, 도로명 주소, 우편번호, 전화번호 등을 수록한 데이터입니다. 지역 보건 의료 체계의 핵심인 약국 배치를 분석하여 주민들의 의료 접근성을 높이고, 효율적인 보건 행정 정책 수립 및 소비자 이용 편의 증진에 활용할 수 있습니다.🎯 활용 목적 및 특징보건 의료 접근성 분석: 주거 밀집 지역(아파트 단지 등) 및 의료 취약 지구 대비 약국 배치 현황을 확인하여 공공심야약국 지정 등 의료 공백 해소 전략 수립지역별 상권 및 업종 밀집도 분석: 병·의원과 약국의 연계성을 분석하여 신규 개업 입지 선정 및 상권 활성화 기초 자료로 활용보건 행정 및 소상공인 지원: 지역 내 약국 현황을 기반으로 한 의약품 안전 관리 점검 및 소상공인 대상 맞춤형 행정 지원 체계 구축소비자 정보 제공: 인근 약국의 정확한 위치와 연락처 정보를 제공하여 긴급 상황 시 주민들의 조제 및 복약 편의성 제고'
