summary_user: 경기도 내 코로나19 대응용 임시선별검사소를 검사소 한 곳당 한 행으로 담으며, 시군명·설치위치·도로명주소·지번주소·담당 보건소명이 들어 있다. 시민이나 분석가가 '우리 시군에 어느 보건소 주관 임시선별검사소가 어디에 설치됐었나'를 확인하거나, 코로나19 시기 시군별 검사소 배치를 되짚어 보는 데 쓴다. 전역 조인 키는 없어 시군명이나 주소 문자열을 매핑해 다른 보건소·의료기관 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 코로나19 대응을 위해 설치된 임시선별검사소의 현황 정보를 제공하며, 시군명, 설치위치, 도로명주소, 지번주소, 담당 보건소명, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 각 검사소는 지역 보건소 주관으로 운영되며, 설치 위치와 정확한 주소 정보가 포함되어 있어 접근성을 높입니다. 이 데이터는 감염병 확산 상황에서 신속한 검사소 위치 파악 및 행정적 자원 배치, 지역별 방역 현황 모니터링, 공공보건 대응 계획 수립 등에 활용될 수 있으며, 위기상황 시 실시간 정보 제공을 위한 기반 자료로도 유용하게 사용됩니다.※ 코로나 감염병 등급 하향에 따라 갱신이 중단된 데이터입니다.
