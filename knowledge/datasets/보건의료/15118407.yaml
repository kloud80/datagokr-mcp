summary_user: 서울특별시 성동구 관내에서 제과점·즉석판매제조가공업·유통판매업에 해당하지 않으면서 마트처럼 일정 규모 이상 영업장에서 식품을 직접 파는 업소의 인허가 정보를 업소 1곳당 1행으로 담는다. 인허가일자·영업상태·폐업일자·소재지 주소·좌표·시설 면적 등을 담고 있어, 성동구에서 대형 식품판매 업소가 언제 문을 열고 닫았는지, 지금 영업 중인 곳은 어디인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 체계의 코드나 업소명·주소 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 성동구 관내에서 제과점, 즉석판매제조가공업, 유통판매업에 해당하지 않고, 마트와 같이 일정 규모 이상의 영업장에서 식품을 직접 판매하는 업소의 정보를 제공하기 위해 수집되었습니다. 포함 항목으로는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 있으며, 각 영업장의 행정정보와 인허가 이력, 운영 현황을 명확히 확인할 수 있습니다. 데이터는 시기별 관리와 감독을 위해 행정기관에서 지속적으로 점검하여 신뢰성이 확보되어 있으며, 대형 식품 판매업장의 인허가 및 폐업 추세 분석이 가능합니다. 관련 정책 수립, 식품 안전 감시, 업종별 시장 동향 분석, 소비자 정보 제공 등 다양한 분야에 활용될 수 있습니다. 정기적으로 최신 정보로 갱신하고 있습니다.
