summary_user: 전국 의료기관(약국 제외, 양방만)의 건강보험 진료비를 진료년도·시도·시군구 단위로 집계해 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액(비급여 제외)을 담은 통계 파일이다. 지역 보건 분석가나 지자체 담당자가 '우리 시군구 주민의 건강보험 진료비와 이용량이 다른 지역에 비해 얼마나 많은가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도·시군구 이름을 행정구역 코드에 매핑해 인구·지역 통계와 이어 쓴다.
description_portal: '전체 의료기관의 시군구별 건강보험 진료비 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2025년 1월~12월, 심사년월: 2025년 1월~2026년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음'
