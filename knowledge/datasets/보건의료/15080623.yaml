description_portal: '"대구광역시 서구_코로나 확진자 일자별 현황"에 대한 데이터로 2020년부터 대구광역시 서구에서 발생한 코로나 확진자에 대한 일자별 현황을 제공합니다.본 데이터는 대구광역시 서구 관내에서 발생한 코로나바이러스감염증-19(COVID-19) 확진자에 대한 일자별 현황을 제공한 자료이다. 수록 기간은 2020년 2월부터 2022년 9월까지이며, 각 일자의 신규 확진자 수와 누적 확진자 수를 포함하고 있다. 본 자료는 감염병의 시기별 확산 추세를 파악하고, 보건·방역 정책 수립 및 평가에 활용할 수 있도록 구성되었다. 시민의 감염병 관련 정보 접근성과 행정의 투명성을 높이고자 개방되며, 감염병 대응체계의 과학적 기반 마련에 기여하는 데 목적이 있다. 또한, 지역사회 감염 상황을 일별로 정리함으로써 방역당국, 연구기관, 일반 국민 모두가 직관적으로 이해하고 활용할 수 있도록 제작되었다.'
