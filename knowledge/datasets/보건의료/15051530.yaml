summary_user: 근로복지공단 소속병원(산재병원)의 산재 환자 진료 실적을 연도별·권역별(소속병원 관할 지사 기준)로 입원 환자 수와 외래 환자 수로 집계한 통계 파일로, 건별 원천이 아닌 집계이며 전국 범위의 비공간 자료다(csv 약 3KB). 정책 담당자나 분석가가 '어느 권역에서 산재 입원·외래 환자가 많고 입원 대비 외래 비중은 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 권역(관할 지사) 이름과 연도를 직접 맞춰 이어야 한다.
description_portal: 이 데이터는 근로복지공단 소속병원(산재병원)의 산재 환자 진료 실적을 권역별(소속병원 관할 지사 기준)로 집계한 통계 자료입니다. 통계 항목은 각 연도별, 권역별로 입원 환자 수(명)와 외래 환자 수(명)를 제공합니다. 이 자료는 지역별 산재 환자의 의료 이용 규모와 패턴을 명확하게 보여주며, 특히 지역별 산업재해 발생 및 의료 수요에 대한 공공 병원의 대응 능력과 환자 이용 행태(입원과 외래의 비중)의 변화를 파악하는 데 필수적인 근거 정보입니다. 이 자료는 지역 사회의 산재 의료 접근성을 높이고, 공공 의료 인프라의 효율적인 운영 방향을 설정하는 데 중요한 기반을 제공합니다. 권역별 통계는 지역 간 의료 서비스 격차를 분석하고 의료 자원 배분의 적정성을 평가하는 데 유용한 자료입니다.본 데이터는 지역 보건 의료 정책 및 산재 재활 서비스 계획 수립에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 특정 권역에서 입원 환자 수나 외래 환자 수가 높게 나타나는 이유를 분석함으로써, 해당 지역의 산업재해 위험 수준과 재해 후 장기 요양 수요를 진단할 수 있습니다. 이를 통해 지역별 산재 환자를 위한 맞춤형 재활 프로그램과 시설 확충의 필요성을 진단하고, 공단 병원이 지역 사회 산재 환자의 진료 거점으로서 얼마나 기능하고 있는지를 평가하는 데 기여할 수 있다고 판단됩니다.
