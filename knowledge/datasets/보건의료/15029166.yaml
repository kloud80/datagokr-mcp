description_portal: '해당 데이터는 공공장소의 흡연 구역 설치 현황을 체계적으로 파악할 수 있는 기반 자료입니다. 주요 항목은 구분(예: 실내·실외 흡연실), 소재지(도로명 주소), 위도·경도, 면적, 설치일, 설치 주체(지자체, 기관 등)로 구성됩니다. 이를 통해 지자체는 흡연구역의 위치·공간 규모·관리 주체 등을 명확히 파악하여 흡연 규제 정책 운영과 안전 관리에 활용할 수 있으며, 연구기관이나 시민단체는 설치 현황 분석, 접근성 평가, 공간 활용도 조사 등에 참고할 수 있습니다. 정기 갱신으로 최신 설치 정보가 반영되며, 도시 공공환경 개선 및 건강 증진을 위한 정책 설계에 기여하는 핵심 공공데이터입니다.'
