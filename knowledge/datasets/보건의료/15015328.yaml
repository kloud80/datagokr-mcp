description_portal: 소방학교에서 제공하는 공기용기 충전 현황을 공개하여 공기용기 충전 서비스를 홍보하고 공공데이터를 활성화 하고자 합니다.(2025.12.31. 기준)광주광역시 공기호흡기용기 관리는 광주광역시 소방학교에서 총괄 관리, 충전, 세척 등을 하고 있으며, 개별 관리는 각 소방기관(광주소방안전본부, 동부소방서, 서부소방서, 남부소방서, 북부소방서, 광산소방서, 광주소방학교)에서 관리하고 있습니다. 데이터 파일 기준 2025년 공기호흡기 용기 충전량은 14,086개이며, 세척량은 3,383개입니다. 자세한 사항은 데이터 파일을 참고하여 주시길 바랍니다.
