summary_user: 경상남도 진주시 관내 의료기관별로 기관명·도로명 주소·행정동과 입원실 수, 병상 수를 한 행씩 담은 기준일자 시점의 현황 파일(CSV, 약 5KB)이다. 보건행정 담당자나 지역 분석가가 '진주시 어느 행정동에 입원 병상이 몰려 있고 어디가 부족한가'처럼 동별 병상 공급 수준과 기관 간 시설 규모를 비교할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 의료기관명·도로명 주소 또는 행정동 이름을 맞춰 연결해야 한다. 이렇게 이름으로 맞춰 LOCALDATA 병의원 인허가 자료 등과 이어 쓴다.
limits: 요양기관기호 같은 공통 코드가 없어 기관명·주소 문자열 매칭에 의존하므로 표기 차이로 연결이 누락될 수 있다. 범위가 진주시 한 곳이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
