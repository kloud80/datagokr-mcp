description_portal: 경상남도 진주시 의료기관별 병상현황 데이터는 관내 의료기관의 병상 운영을 종합적으로 파악할 수 있도록 구성된 자료입니다. 의료기관명, 의료기관 주소, 행정동 정보는 물론 입원실, 병상 수 등 주요 의료자원 현황을 세부적으로 제공합니다. 이를 통해 지역 내 병상 공급 수준 분석, 의료 수급 불균형 파악, 응급·입원 의료 대응체계 개선 등 보건행정 정책 수립에 활용할 수 있습니다. 또한 의료기관 간 시설 규모 비교, 지역 의료 인프라 현황 조사, 의료서비스 접근성 평가 등 다양한 연구·분석 업무에도 활용 가능한 기초 자료입니다.
