description_portal: '본 데이터는 서울특별시 중구의 안마시술소, 안마원 등 안마를 목적으로 운영하는 업소정보를 제공하는 자료입니다. 이 데이터는 의료유사업체의 영업 허가 및 사업자 등록 정보를 포함하고 있으며, 업체의 위치, 영업 상태 등에 대한 상세한 정보를 제공합니다. 이를 통해 사용자는 의료유사업체의 인허가 현황을 파악할 수 있으며, 관련 정책 수립 및 보건 행정 개선에 활용할 수 있습니다. 데이터는 정기적으로 업데이트되어 최신 정보를 제공하며, 공공데이터포털을 통해 누구나 접근할 수 있습니다. 본 데이터는 보건 행정의 투명성을 높이고, 지역사회의 건강 관리 수준을 향상시키는 데 중요한 자료로 활용될 수 있습니다. 또한, 정책 결정자들이 의료유사업체 인허가 현황을 분석하고, 효과적인 보건 정책을 수립하는 데 유용한 정보로 활용될 수 있습니다. 데이터의 활용을 통해 지역사회의 보건 및 건강 관리 수준이 향상될 것으로 기대됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
