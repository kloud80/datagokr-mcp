summary_user: 전국 의료기기 유통업체를 사업장 한 곳당 한 건으로 담은 건별 원천 데이터로, 사업장명·업종 구분·주소·인허가일자·허가기관·사업자등록번호·폐업일자를 포함한다. 우리 지역에서 영업 중인 의료기기 판매·임대업체가 어디인지, 특정 업체가 정식 인허가를 받았고 폐업하지 않았는지를 확인하는 데 쓰며, 분석가는 지역별 분포와 폐업 추이를 보는 데 쓴다. 실측 컬럼에 전역 조인 키는 없고, 사업자등록번호(BRNO)나 사업장명·주소를 매칭해 다른 사업자·의료기기 데이터와 이어 쓴다.
description_portal: 해당 공공데이터는 식품의약품안전처에서 제공하는 의료기기 유통업체 관련 정보입니다. 전국 의료기기 유통업체의 사업장명, 업종 구분, 기본주소 및 상세주소, 인허가일자, 허가기관, 사업자등록번호, 폐업일자 등의 항목이 포함되어 있으며, 의료기기 유통업체의 인허가 이력과 운영 여부 등을 종합적으로 확인할 수 있도록 구성되어 있습니다. 본 데이터를 통해 의료기기 유통업체의 지역 분포 현황은 물론, 폐업 추이 등을 분석할 수 있어서 업계 종사자나 연구자에게도 참고자료로 제공될 수 있습니다.
