summary_user: 건강보험 진료분 가운데 약국을 제외한 양방 진료비를 진료년도·3단 주상병코드·성별·입원외래구분별로 묶어 환자수, 명세서청구건수, 입내원일수, 보험자부담금, 요양급여비용총액을 담은 전국 단위 집계 파일입니다. 보건의료 분석가가 "특정 질병으로 입원한 남녀 환자 수와 진료비가 해마다 어떻게 달라지는가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 주상병코드(KCD 3단)를 질병분류 코드표나 같은 기관의 다른 진료 통계와 코드 매핑으로 이어 쓴다.
limits: 지역 구분이 없는 전국 집계라 시군구·요양기관별 분석에는 쓸 수 없고, 청구 기준 심평원 값이라 자격 기준인 공단 통계와 수치가 다르다. 주상병은 진료 시 일차 진단명이라 최종 확정 질병과 다를 수 있다. 환자수는 범주 안에서만 중복을 제거한 값이므로 성별·입원외래 범주를 단순 합산하면 같은 사람이 중복 집계된다.
