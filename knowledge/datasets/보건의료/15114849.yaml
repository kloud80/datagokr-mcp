description_portal: 발달장애 아동과 언어 발달 지연 아동의 조기 발견과 전문적 치료 서비스에 대한 사회적 관심이 높아지면서, 발달재활 서비스의 중요성과 접근성 향상 필요성이 중요한 사회적 과제로 대두되고 있습니다. 자폐스펙트럼장애, ADHD, 언어 발달 지연 등 다양한 발달 문제를 가진 아동들의 증가로 전문적이고 체계적인 치료 서비스 제공 기관 확충의 필요성이 증대되고 있으며, 장애인복지법과 발달장애인법에 따른 발달재활서비스 제공과 품질 관리를 위한 기관 현황 파악이 중요해지고 있습니다. 조기 개입과 지속적인 치료를 통한 아동의 발달 향상과 사회 적응 능력 증진을 위한 전문 치료기관의 역할이 확대되고 있으며, 부모와 가족의 치료기관 선택권 보장과 서비스 품질 비교를 위한 투명한 정보 제공이 요구되고 있습니다. 또한 지역별 발달재활 서비스 격차 해소와 균등한 서비스 제공을 위한 치료기관 분포 현황 분석의 필요성이 증가하고 있으며, 발달장애 정책 수립과 치료 서비스 개선을 위한 기초 자료 확보가 중요하게 되어, 충청남도 보령시는 관내 6개소 발달재활 및 언어치료기관의 위치, 연락처, 치료 프로그램 등 발달장애 아동과 가족의 치료 서비스 이용과 발달재활 정책 수립에 필요한 종합적인 치료기관 현황 정보를 제공하고 있습니다.
