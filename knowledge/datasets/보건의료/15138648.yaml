summary_user: 경기도 이천시 관내 공공기관에 설치된 폐의약품 수거함을 설치 기관 한 곳당 한 행으로 정리한 시군구 단위 파일로, 기관명칭·행정동·도로명주소·전화번호를 담는다. 시민이 "우리 동네에서 남은 약을 버릴 수 있는 공공기관 수거함이 어디인가"를 찾거나, 보건소·환경 담당자가 행정동별 설치 분포와 미설치 지역을 확인하는 데 쓴다. 전역 조인 키나 기관 코드가 없어 다른 데이터와는 행정동 이름이나 도로명주소를 문자열로 맞추거나 주소를 좌표로 변환해 이어 쓴다.
description_portal: 본 데이터는 경기도 이천시 관내 공공기관에 설치된 폐의약품 수거함의 설치 현황을 정리한 자료로, 연번, 기관명칭, 행정동, 도로명주소, 전화번호 등 5개 항목으로 구성되어 있습니다. 폐의약품 수거함은 가정에서 발생한 잔여 의약품의 안전한 회수 및 처리, 환경오염 예방을 위해 공공기관에 설치되며, 본 자료는 수거함의 위치와 운영기관 정보를 제공합니다. 데이터는 행정구역별 설치 분포, 접근성 분석, 수거함 미설치 지역 파악 등을 통해 시민 편의 증진과 환경보건 정책 수립에 활용될 수 있으며, 보건소·환경과 등 관련 부서에서 수거체계 구축, 홍보자료 제작, 민원 응대 시 기초자료로도 사용됩니다. 또한, 도로명주소 기반 정보는 공간정보 시스템(GIS)과 연계한 시각화 및 거점 분석에도 적합합니다.
