description_portal: 음주폐해예방 관련 지표- 국세청 국세통계연보를 바탕으로, 총 주요 주류의 연도별 출고 현황을 보여주는 것입니다. - 총 출고량은 국내분 출고량과 수입분 출고량을 합산한 수치로 산출되며, 2016년도 출고량부터는 면세 주류 중 수출분을 제외하고 군납품 주류 등을 포함하여 집계됩니다. - 이를 통해 국내 유통과 소비를 위한 전체 주류 출고 규모를 파악할 수 있도록 구성되어 있습니다.- 본 데이터는 음주폐해예방 및 절주문화 확산을 위한 보건의료 분야 등 학계의 연구 추진 시 기초자료로 활용될 수 있습니다.
