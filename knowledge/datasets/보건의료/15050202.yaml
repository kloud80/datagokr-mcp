summary_user: 국세청 국세통계연보를 바탕으로 전국 단위 주요 주류의 연도별 출고량을 총 출고량과 탁주·맥주·희석식소주·위스키 등 주종별로 담은 연도별 집계 파일(csv, 약 1.7KB)이다. 절주·음주폐해예방 연구자나 보건 분석가가 '해마다 국내에 풀린 술의 양이 어떻게 변했고, 어떤 주종이 늘거나 줄었나'를 확인하는 기초자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 기준으로 맞춰 붙이거나 같은 기관의 절주 관련 지표와 나란히 놓고 쓴다.
limits: 전국·비공간 집계라서 시도·시군구별 출고나 지역 음주율 비교에는 쓸 수 없고, 보건소코드·시군구코드 같은 키가 없다. 포털 설명에 따르면 2016년 출고량부터 면세 주류 중 수출분을 빼고 군납품 주류 등을 포함하도록 집계 기준이 바뀌어, 그 전후 수치를 그대로 이어 비교할 때 주의해야 한다.
