summary_user: 경기도 시군·보건소별로 생후 14일~66개월 영유아의 건강검진 대상자 수, 실제 수검자 수, 총 수검률을 데이터 기준일자와 함께 담은 집계 데이터다. 보건 담당자나 분석가가 "우리 시군 보건소의 영유아 건강검진 수검률이 도내 다른 지역보다 낮은가"를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·보건소명 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 영유아 건강검진 수검률 집계 현황을 담고 있으며, 생후 14일부터 66개월까지의 영유아를 대상으로 각 시군 보건소별 건강검진 참여 실적을 기록하고 있습니다. 데이터에는 시군명과 보건소명별로 검진 대상자 수와 실제 수검자 수, 그리고 이를 기반으로 산출된 총 수검률이 제공되어 있어, 지역별 영유아 건강검진 참여율을 비교할 수 있습니다. 또한 데이터 기준일자가 함께 포함되어 시점별 추이를 확인할 수 있어, 영유아 건강관리 정책의 효과성 평가와 향후 개선 방향을 설정하는 데 중요한 참고 자료로 활용될 수 있습니다.
