summary_user: 전국 시군구별 건강보험 적용인구 수를 기준년월·성별·연령대·직역(직장/지역)별로 나눠 월 단위로 집계한 통계 파일로, 건강보험 자격을 가진 내국인과 가입 외국인을 함께 센다. 지자체·보건 분석가가 '우리 시군구의 지역가입자 비중이나 고령 적용인구가 월별로 어떻게 변하나' 같은 질문에 쓴다. 전역 조인 키(행정구역 코드)가 없어 다른 지역 통계와는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: '본 데이터는 전국 시군구 단위의 건강보험 적용인구 수를 월별로 집계한 통계자료로, 건강보험 자격을 보유한 인구(내국인 및 외국인 포함)를 기준으로 구성되어 있습니다.□ 월별 전국 시군구별 건강보험 적용인구 현황   - 대상: 건강보험 자격 유지자 기준으로 작성(내국인 및 건강보험에 가입된 외국인 포함)   - 연령 기준: 해당 연도의 연말(12월 31일) 기준 연령 정보 사용   - 주소 기준: 주민등록상 실거주지 주소에 따라 시군구 단위로 분류□ 용어정의   - 직장: 근로자 및 사용자, 공무원, 군인, 사립학교 교직원 등과 그 피부양자 포함   - 지역: 건강보험 가입자 중 직장가입자와 그 피부양자를 제외한 자(자영업자, 프리랜서 등 포함)'
