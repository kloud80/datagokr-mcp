summary_user: 경기도 안양시 관내 의료기기 판매·임대업소를 업소 한 곳당 한 행으로 담은 파일로, 영업 구분·영업소명·도로명 소재지·전화번호·데이터 기준일을 수록한다. 시민이나 의료기관이 '우리 동네에서 의료기기를 사거나 빌릴 수 있는 업소가 어디인가'를 찾을 때, 분석가가 안양시 안의 의료기기 유통업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 식약처 품목허가 등 다른 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '안양시 관내 의료기기 판매 및 임대업소 현황 영업소명 영업소 소재지 영업소 전화번호 등 데이터 정보 현황입니다.데이터 설명: 안양시_의료기기 판매업소 정보 현황이 데이터는 「의료기기법」 및 관련 법령에 따라 경기도 안양시 관내에서 의료기기 판매 및 임대업을 영위하는 업소의 현황을 수록한 자료입니다. 의료기기 판매업소는 의료기관, 개인, 기업 등에 의료기기를 공급하거나 임대하는 사업체로, 본 데이터는 다음과 같은 항목으로 구성되어 있습니다:- 영업소명: 의료기기 판매업소의 상호명- 소재지 주소: 업소의 도로명 주소- 전화번호: 업소 연락처- 관할 행정구역: 만안구, 동안구 등 행정동 기준 분류- 데이터 기준일자: 정보가 수집된 기준 날짜이 데이터는 지역 내 의료기기 유통 현황 파악, 보건의료 정책 수립, 민간 의료기기 수요 분석, 시민 정보 제공 등에 활용될 수 있으며, 특히 의료기기 접근성 및 유통 안정성 확보를 위한 기초자료로 유용합니다.'
