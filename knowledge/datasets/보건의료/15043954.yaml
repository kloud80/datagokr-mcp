summary_user: 광주 서부소방서 관내 119응급의료지정병원의 병원명, 도로명주소, 의료기관 구분, 관할 구역을 병원 한 곳당 한 행으로 담은 소규모 파일(csv 526바이트)이며, 범위는 시도 단위이고 각 행은 개별 주소를 가진다. 서부소방서 관내 주민이나 분석가가 "우리 동네 119 지정병원은 어디이고 어떤 종별 의료기관인가"를 확인할 때 쓴다. 전역 조인 키(기관코드·hpid 등)가 없어서 다른 응급의료기관 데이터와는 병원 이름이나 주소를 맞춰 연결해야 한다.
description_portal: 119응급의료지정병원 공공데이터는 국민의 생명과 직결되는 응급의료 서비스 제공을 위해 수집·관리되는 중요한 정보 자원입니다. 2024년 12월 31일 기준 광주광역시 서부소방서 데이터에는 지역별 지정병원의 명칭, 주소, 연락처, 응급실 운영 여부, 전문 진료과목, 병상 수, 의료 인력 현황, 가용 장비 및 시설 정보 등이 포함됩니다. 이를 통해 국민은 가까운 지정병원의 위치와 응급 진료 가능 여부를 쉽게 확인할 수 있고, 119구급대와 관계 기관은 환자 상태에 따라 적합한 의료기관을 신속히 선택할 수 있습니다.
