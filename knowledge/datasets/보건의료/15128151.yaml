summary_user: 독거노인·장애인 응급안전안심서비스 운영기관이 보유한 댁내 장비(게이트웨이, 활동량 감지기, 화재감지기, 출입문 감지기, 응급호출기, 웨어러블 등)를 기관명·장비구분·등록일시 단위로 담은 전국 시군구별 파일로, 약 137MB 규모의 CSV입니다. 지자체 복지 담당자나 분석가가 '우리 시군구 운영기관에 화재감지기·응급호출기가 몇 대 등록돼 있고 언제 보급됐나'처럼 지역별 장비 보급 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 시도·시군구 이름이나 기관명을 매칭해 독거노인·장애인 인구 통계 등 다른 지역 데이터와 이어 쓴다.
description_portal: '보건복지부에서 관리 중인 응급안전안심 운영기관 보유장비 정보(연도, 시군구, 등록일시, 장비구분, 기관명)로 시도, 시군구별로 분류하여 제공하고 있습니다.<데이터 이용 시 참고사항>1. 응급안전안심서비스(독거노인･장애인 응급안전안심서비스) : 응급상황 모니터링, 대상자 안전확인 및 대응조치, 안전교육, 사후관리 등 독거노인･장애인의 안전한 생활을 지원하기 위해 제공되는 서비스2. 댁내 장비 구성 : 게이트웨이(전면부 레이더센서에 활동량감지센서, 온도센서, 습도센서, 조도센서 포함), 활동량 감지기(대상자 활동 유무를 감지하여 게이트웨이로 활동량 감지 정보 전송), 화재감지기(연기를 감지 할 경우 게이트웨이에 정보를 전송, 119에 자동신고), 출입문 감지기(대상자 댁내 출입문의 개폐 여부를 감지), 응급호출기(응급버튼(빨간색)을 누르면 게이트웨이에 정보를 전송하여 119에 자동 신고), 웨어러블 장비(대상자 심박수, 호흡수 등 건강 데이터 수집)'
