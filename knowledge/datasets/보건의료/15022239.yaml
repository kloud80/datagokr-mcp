description_portal: '연제구 관내 안마업소(안마원, 안마시술소)에 관한 데이터로서, 영업소 명칭, 소재지(도로명), 전화번호 등 정보가 제공되는 데이터 입니다.의료법 제82조(안마사)에 의거하여 인허가된 안마업소 정보입니다.각 항목별 설명으로는 다음과 같습니다.- 명칭: 영업소 명칭을 나타냅니다- 소재지: 영업소 소재지(도로명)를 나타냅니다- 전화번호: 등록된 전화번호를 나타냅니다의료법 제82조(안마사) ① 안마사는 「장애인복지법」에 따른 시각장애인 중 다음 각 호의 어느 하나에 해당하는 자로서 시ㆍ도지사에게 자격인정을 받아야 한다.1. 「초ㆍ중등교육법」 제2조제5호에 따른 특수학교 중 고등학교에 준한 교육을 하는 학교에서 제4항에 따른 안마사의 업무한계에 따라 물리적 시술에 관한 교육과정을 마친 자2. 중학교 과정 이상의 교육을 받고 보건복지부장관이 지정하는 안마수련기관에서 2년 이상의 안마수련과정을 마친 자② 제1항의 안마사는 제27조에도 불구하고 안마업무를 할 수 있다.③ 안마사에 대하여는 이 법 중 제8조, 제25조, 제28조부터 제32조까지, 제33조제2항제1호ㆍ제3항ㆍ제5항ㆍ제8항 본문, 제36조, 제40조, 제59조제1항, 제61조, 제63조(제36조를 위반한 경우만을 말한다), 제64조부터 제66조까지, 제68조, 제83조, 제84조를 준용한다. 이 경우 “의료인”은 “안마사”로, “면허”는 “자격”으로, “면허증”은 “자격증”으로, “의료기관”은 “안마시술소 또는 안마원”으로, “해당 의료관계단체의 장”은 “안마사회장”으로 한다.④ 제3항에도 불구하고 국가나 지방자치단체가 관계 법령에 따라 시행하는 장애인일자리 사업 등을 수행하는 자로서 보건복지부령으로 정하는 자가 그 사업 수행과정에서 안마사를 고용하는 경우에는 제66조제1항제2호를 준용하지 아니한다.⑤ 안마사의 업무한계, 안마시술소나 안마원의 시설 기준 등에 관한 사항은 보건복지부령으로 정한다.'
