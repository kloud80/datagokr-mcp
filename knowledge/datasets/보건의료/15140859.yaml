description_portal: 이 데이터는 서울특별시 광진구 관내에 동물용 의약품을 전문적으로 취급하는 도매상의 인허가 현황을 제공합니다. 동물용의약품도매상은 「약사법」 및 관련 법령에 따라 등록되어야 하며, 가축 및 반려동물 등의 질병 예방 및 치료를 위한 항생제, 백신, 영양제 등의 의약품을 유통하는 업소입니다.본 데이터에는 업소명, 사업장 소재지, 인허가 일자, 영업상태, 업종 구분, 관할 행정기관 등이 포함되며, 지역 내 수의방역체계 지원, 의약품 유통 추적, 허가 현황 모니터링 및 동물보건 정책 수립에 필요한 기초자료로 활용될 수 있습니다.또한, 불법 유통 단속, 약품 유효기간 관리, 수의사 처방제 적용 여부 점검 등 공공 행정 수요에 대응하는 데이터입니다.※ 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 정보는 포함되지 않습니다.※ 본 데이터는 3일 전 기준의 최신 인허가 내용을 반영하고 있습니다.
