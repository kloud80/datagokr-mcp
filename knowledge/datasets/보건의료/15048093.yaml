description_portal: '연제구 관내 안경업소에 관한 데이터로서, 영업소 명칭, 소재지(도로명), 등록일자 등 정보가 제공되는 데이터 입니다.의료기사 등에 관한 법률 제12조(안경업소의 개설등록 등), 같은 법 시행규칙 제13조(안경업소의 개설등록 등)에 의거하여 등록된 안경업소 정보입니다.각 항목별 설명으로는 다음과 같습니다.- 명칭: 안경업소 명칭을 나타냅니다- 소재지: 안경업소 소재지(도로명)를 나타냅니다- 등록일자: 안경업소로 등록된 일자를 나타냅니다제12조(안경업소의 개설등록 등) ① 안경사가 아니면 안경을 조제하거나 안경 및 콘택트렌즈의 판매업소(이하 “안경업소”라 한다)를 개설할 수 없다.② 안경사는 1개의 안경업소만을 개설할 수 있다.③ 안경업소를 개설하려는 사람은 보건복지부령으로 정하는 바에 따라 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 개설등록을 하여야 한다.④ 제3항에 따라 안경업소를 개설하려는 사람은 보건복지부령으로 정하는 시설 및 장비를 갖추어야 한다.⑤ 누구든지 안경 및 콘택트렌즈를 다음 각 호의 어느 하나에 해당하는 방법으로 판매 등을 하여서는 아니 된다.1. 「전자상거래 등에서의 소비자보호에 관한 법률」 제2조에 따른 전자상거래 및 통신판매의 방법2. 판매자의 사이버몰(컴퓨터 등과 정보통신설비를 이용하여 재화 등을 거래할 수 있도록 설정된 가상의 영업장을 말한다) 등으로부터 구매 또는 배송을 대행하는 등 보건복지부령으로 정하는 방법⑥ 안경사는 안경 및 콘택트렌즈를 안경업소에서만 판매하여야 한다.<신설 2011. 11. 22.>⑦ 안경사는 콘택트렌즈를 판매하는 경우 콘택트렌즈의 사용방법과 유통기한 및 부작용에 관한 정보를 제공하여야 한다.'
