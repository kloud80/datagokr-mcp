summary_user: 울진군 관내 병원·요양병원·의원을 기관 한 곳당 한 행으로 정리한 목록 파일로, 종류(구분)·명칭·소재지·연락처·병상수·기준일자를 담는다(csv 약 1.6KB 규모의 소량 파일). 주민이나 분석가가 '울진군에 입원 병상이 있는 병원은 어디이고 병상은 몇 개인가'처럼 군 단위 의료기관 분포와 병상 규모를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관 명칭이나 소재지 주소를 맞춰 연결해야 하며, 같은 성격의 LOCALDATA 병의원 인허가 자료와도 이름·주소 매칭으로 대조한다.
