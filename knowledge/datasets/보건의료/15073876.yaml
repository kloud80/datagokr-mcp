summary_user: 의료기기 광고의 본심의 전에 자율심의기구가 실시한 예비심의를 건별로 담으며, 심의결과일자·심의번호·예비심의 결과·광고업체명·대표품목허가번호·대표품목명이 포함되고 범위는 전국입니다. 의료기기 광고를 준비하는 사업자가 비슷한 품목·문구가 예비심의에서 어떤 결과를 받았는지 확인하는 데 쓰고, 분석가는 최초·이전 광고심의번호를 따라 한 광고의 심의 이력을 추적하는 데 씁니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 대표품목허가번호나 품목명을 의료기기 품목허가 데이터와 이름·번호로 대조하는 방식으로만 연결합니다.
description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 의료기기 예비 심의내역 정보입니다. 누구든지 의료기기의 광고를 하려는 경우에는 미리 해당 광고가 의료기기법령에 따른 금지되는 광고 위반여부에 대해 자율심의기구의 심의를 받아야 합니다. 의료기기 광고의 본심의 이전에 실시되는 예비심의 과정의 상세한 결과를 체계적으로 관리하여 광고 제작 시 사전 검토 자료로 활용할 수 있도록 지원합니다. 이 데이터는 결과통보 항목에 심의결과일자와 심의번호 결과를 포함하여 각 예비심의 건의 최종 처리 현황을 명확히 보여줍니다. 최초광고심의번호와 이전광고심의번호는 심의 과정의 연속성을 추적할 수 있게 하고 대표품목허가번호와 대표품목명으로 광고 대상 의료기기를 정확히 특정할 수 있습니다.
