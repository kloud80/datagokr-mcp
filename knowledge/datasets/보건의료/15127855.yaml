summary_user: 전국 시도별로 연도마다 종합병원·요양병원·일반병원·의원·특수병원(결핵·한센·정신)·치과병의원·한방병의원·부속의원·조산원 수를 센 집계표로, 포털 설명상 2015~2024년을 담는다. 정책 분석가나 의료 사업자가 '우리 시도에 요양병원이나 한의원이 최근 10년간 얼마나 늘었나' 같은 지역별 의료기관 공급 추이를 볼 때 쓴다. 전역 조인 키나 행정구역 코드가 없어 시도 이름과 연도를 맞춰 인구·의료인력 같은 다른 시도별 통계와 이어 쓰고, 개별 기관 단위는 병의원 인허가(LOCALDATA) 원천 데이터로 따로 확인한다.
