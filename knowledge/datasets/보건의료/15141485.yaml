summary_user: 서울 종로구 관내에 등록된 치과기공소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가·취소·폐업 일자, 영업상태, 소재지 주소와 좌표, 기공용 장비 보유 수량 등을 포함한다. 종로구에서 영업 중이거나 최근 폐업한 치과기공소가 어디에 몇 곳 있는지 파악하려는 분석가나 사업자가 쓴다. 전역 조인 키가 없어 다른 자료와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 LOCALDATA 형식의 다른 구·업종 인허가 데이터와 나란히 붙여 비교하는 데 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내에서 치과기공 업무를 수행하기 위해 보건당국에 등록된 사업체의 행정 정보를 제공합니다. 수록 항목은 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등으로 구성되어 있으며, 해당 업소의 개설 및 폐업 이력, 운영 상태 등을 체계적으로 파악할 수 있도록 설계되었습니다. 치과기공소는 「의료기사 등에 관한 법률」 제10조 및 제12조에 따라 보건복지부장관 또는 시·도지사에 의해 관리되며, 치과 보철물 및 기공물의 제작·수리를 전문으로 수행하는 기관입니다. 본 데이터는 보건의료 인프라 분포 분석, 지역별 의료기공 수요 예측, 산업 변화 동향 파악 등에 활용될 수 있습니다. 또한 위생관리, 자격인력 운영, 유사 의료시설과의 비교 분석 등 정책 수립과 행정 점검의 기초자료로도 활용 가능합니다. 정보는 정기적으로 갱신되며, 공공데이터 제공 및 이용 활성화에 관한 법률에 따라 개방됩니다.
