description_portal: 경상북도 청도군관내에 지정된 흡연구역 위치정보를 제공합니다. 본 자료는 청도군이 관리하고 있는 흡연 가능 공간의 현황을 정리한 것으로 구역명, 소재지 도로명주소, 소재지 지번주소, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 흡연구역은 비흡연자의 간접흡연 피해를 줄이고, 흡연자에게는 지정된 공간 내에서의 흡연을 유도함으로써 공중보건과 질서 있는 도시환경을 조성하기 위한 목적에서 지정되며,해당 데이터는 공공기관, 공원, 전통시장, 버스정류장 인근, 공공청사 외곽, 관광지 등 다양한 장소에 위치한 흡연구역의 위치를 시민들이 손쉽게 확인하고 이용할 수 있도록 제공합니다.
