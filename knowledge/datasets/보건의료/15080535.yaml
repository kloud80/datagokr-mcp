description_portal: '- 「감염병의 예방 및 관리에 관한 법률」에 근거하여, 부산광역시 수영구에 운영 중인 소독업체 현황입니다.- 해당 자료는 반기(6개월)마다 등록되며, 순번, 소독업소 명칭, 사무실 소재지(도로명 주소), 사무실 우편번호, 영업소 연락처를 포함한 최신 정보를 제공하고 있습니다.- 감염병 예방 및 관리의 일환으로, 공중위생을 보호하고 지역 내 감염병을 매개하는 위생해충 및 병원체 확산을 차단하기 위해 관내 소독업 신고업체 정보를 제공하고 있으며 이를 통해 주민들이 모기, 파리, 진드기, 바퀴벌레 등 각종 해충 방역 또는 살균 소독이 필요할 때 방역소독 서비스를 선택할 수 있도록 지원합니다.'
