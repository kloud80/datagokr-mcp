description_portal: '- EMR(전자의무기록시스템) 제품인증전자의무기록시스템 인증제는 환자 안전과 진료연속성 지원을 목적으로 국내 전자의무기록시스템에 대한 국가적 표준과 적합성 검증을 통해 업체의 표준제품 개발을 유도하여 시스템의 상호호환성 확보 등 품질 향상으로 의료소비자에게 양질의 의료 서비스를 제공될 수 있도록 하기 위한 제도입니다. EMR획득 제품현황은 의료정보업체 또는 의료기관에서 개발한 전자의무기록시스템이 인증기준에 부합함을 인증하는 것입니다.'
