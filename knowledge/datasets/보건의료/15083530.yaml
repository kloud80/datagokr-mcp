description_portal: '본 데이터는 한국보건의료인국가시험원에서 시행한  2급 장애인재활상담사 국가시험 응시자의 성적 현황을 분석할 수 있는 데이터를 제공합니다.(자료 기준일 : 2026. 6. 2. 기준) 연도, 직종, 회차, 일련번호, 과목명, 과목별 점수, 총점, 합격여부, 성별을  개인을 식별할 수 없는 형태로 제공합니다. 이 데이터는 다음과 같은 목적과 활용 가능성을 가지고 있습니다.1.  자격시험 성적 현황에 대한 기초 통계 정보를 제공합니다.2. 장애인재활상담 분야 인력 수급 및 교육 현황 분석에 활용할 수 있습니다.3. 공공데이터 분석 및 민간 활용 기반에 활용할 수 있습니다.'
