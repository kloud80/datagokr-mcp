summary_user: 서울 은평구 관내 축산가공업소(식육·알·원유를 가공해 소시지·전난분·우유 등을 만드는 업소)의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일·폐업일·휴업기간·영업상태와 지번·도로명 주소, 중부원점TM 좌표 등을 포함한다. 식품위생 담당자나 분석가가 '은평구에서 지금 영업 중인 축산가공업소는 어디이고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)·관리번호로만 연결한다.
description_portal: '은평구의 식육, 알, 원유 등을 가공하여 소시지, 전난분, 우유 등으로 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.서울특별시 은평구 관내에서 운영되고 있는 축산가공업소에 대한 인허가 정보를 수록한 데이터입니다. 축산가공업은 도축된 가축의 고기 및 부산물을 가공하여 햄, 소시지, 베이컨, 육포, 통조림 등 다양한 육가공품을 생산하는 업종으로, 식품위생과 관련된 법령에 따라 인허가 절차를 거쳐야 합니다. 본 데이터는 업체명, 영업상태, 소재지 주소, 영업자명, 허가일자, 업태 및 종목 등의 주요 항목으로 구성되어 있으며, 지역 내 축산물 유통 및 식품 안전 관리를 위한 기초자료로 활용될 수 있습니다. 특히 가공된 축산물의 유통 경로를 파악하고, 식품위생 점검이나 위생관리 정책 수립에 필요한 행정 자료로도 유용합니다.'
