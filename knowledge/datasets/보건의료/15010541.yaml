description_portal: '제주특별자치도에 소재하고 있는 정신요양시설과 관련한 데이터를 제공합니다.항목: 구분, 시설명, 소재지, 수용인원, 종사자수, 연락처 등*정신요양시설: 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조 제6호에 의거 정신질환자를 입소시켜 요양 서비스를 제공하는 시설을 말함*정신재활시설: 정신질환자 또는 정신건강상 문제가 있는 사람 중 기질성 정신장애, 알코올 또는 약물중독에 따른 정신장애, 조현병 또는 망상장애, 기분장애, 정서장애, 불안장애 또는 강박장애, 그 밖에 이에 준하는 장애를 가진 사람(이하 “정신질환자등”이라 함)의 사회적응을 위한 각종 훈련과 생활지도를 하는 시설자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1264'
