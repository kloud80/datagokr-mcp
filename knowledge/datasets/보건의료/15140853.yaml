description_portal: '이 데이터는 서울특별시 광진구에 위치한 산후조리업소의 인허가 현황을 제공하는 정보로, 출산 후 산모와 신생아의 건강 및 위생을 전문적으로 관리하는 시설에 대한 내용을 담고 있습니다. 각 업소의 명칭, 소재지, 운영 상태, 인허가 관련 사항 등을 포함하며, 산후조리 서비스 제공 여부와 같은 행정적 정보를 제공합니다. 특히 산모의 회복과 신생아 케어를 위한 전문시설 현황을 파악하고, 지역 내 보건 복지 정책 수립 및 서비스 개선 자료로 활용될 수 있습니다.※ 좌표 안내: 본 데이터는 중부원점TM(EPSG:2097) 좌표계 기준 위치 정보를 포함하고 있으며, 위도 및 경도 좌표는 제공되지 않습니다.※ 본 데이터는 3일 전 기준으로 제공됩니다.'
