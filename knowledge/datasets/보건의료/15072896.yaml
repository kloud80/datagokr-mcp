summary_user: '진료년도별로 4단 상병코드(주상병) × 성별 × 입원·외래 구분마다 환자수, 명세서 청구건수, 입내원일수, 보험자부담금, 요양급여비용총액을 담은 전국 단위 건강보험 진료 집계 파일이다. 보건의료 분석가나 연구자가 특정 질병(예: 당뇨병 세부 상병)의 남녀별 입원·외래 환자수와 진료비 규모를 비교할 때 쓴다. 전역 조인 키는 없으므로 주상병코드를 KCD 질병분류 코드표와 맞춰 상병명을 붙이거나, 같은 심평원의 다른 상병별 진료 통계와 진료년도·상병코드로 이어 쓴다.'
limits: 전국 단위 집계라 지역별 분석은 할 수 없고, 청구 기준인 심평원 통계는 자격 기준인 국민건강보험공단 통계와 값이 다르다. 환자수는 범주 안에서만 중복을 제거한 값이라 성별·입원외래 등 다른 범주를 단순 합산하면 중복이 생기며, 약국과 한방은 빠지고 주상병은 최초 진단명 기준이다.
