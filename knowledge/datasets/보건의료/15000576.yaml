summary_user: 전국 약국 25,434건을 약국 한 곳씩 건별로 담는 API로, 약국 이름·주소·전화번호·요일별 운영 시간·위경도 좌표를 준다. 국민이 "우리 동네에서 지금 문을 연 약국이 어디인가"를 찾거나 분석가가 지역별 약국 분포를 볼 때 쓴다. 주소(dutyAddr)와 좌표(wgs84Lat·wgs84Lon)로 지도·주소 데이터와 잇고, 기관 식별자(hpid)로 같은 기관 키를 쓰는 다른 의료기관·응급의료 데이터와 이어 쓴다.
description_portal: 전국 약국 정보를 조회할 수 있는 서비스로, 사용자는 조건을 입력하여 운영 중인 약국을 검색하고 상세 정보를 확인할 수 있다.
