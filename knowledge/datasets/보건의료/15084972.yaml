description_portal: '○ 통계개요* 통계명 : 지역사회 건강통계(질병이환)* 통계종류 : 서울시 및 자치구 건강통계를 제공하는 일반·보고통계* 근거법령 : 지역보건법 제4조(지역사회건강실태조사) 및 동법 시행령 제2조(지역사회건강실태조사 방법 및 내용)* 작성목적 : 지역주민의 건강상태를 파악하여 근거에 기반 한 보건정책을 수립·평가하기위한 통계자료 산출을 위해 지역사회건강조사 실시* 조사체계 : 시군구 보건소 → 시도 → 운영위원회 → 보건복지부 질병관리청* 공표주기 : 정기(매년)* 공표범위 : 지역 ? 서울시 및 자치구내용 ? 고혈압, 당뇨병 진단경험률 등○ 용어설명* 고혈압진단경험률 : 의사에게 고혈압을 진단받은 30세 이상 사람의 분율* 당뇨병진단경험률 : 의사에게 당뇨병을 진단받은 30세 이상 사람의 분율* 관절염 진단경험률 : 의사에게 관절염을 진단받은 50세 이상의 분율(~2017년)* 뇌졸중(중풍) 조기증상 인지율 : 뇌졸중(중풍) 조기증상에 대해 모두 맞힌 사람의 분율 - 2017년 신규조사* 심근경색(심장발작)증 조기증상 인지율 : 심근경색증 조기증상에 대해 모두 맞힌 사람의 분율 - 2017년 신규조사* 연간 미충족의료율(병의원) : 최근 1년 동안 본인이 병의원(치과 제외)에 가고 싶을 때 가지 못한 사람의 분율○ 기 타* 조율 : 해당 연도 및 지역의 인구 구성비를 그대로 반영하여 산출된 결과* 표준화율 : 연도 및 지역간 비교를 위해 인구구성 차이에 따른 영향을 표준인구로 보정한 결과'
