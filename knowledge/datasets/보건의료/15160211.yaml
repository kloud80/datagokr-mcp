description_portal: 강원특별자치도 내에서 운영 중인 정신보건 관련 기관 및 시설의 전반적인 현황 정보를 제공합니다. 데이터는 크게 '정신건강증진(복지)센터', '중독관리통합지원센터', '정신의료기관', '정신재활시설' 등 4가지 기관 유형별 항목으로 세분화되어 구성되어 있습니다. 주요 제공 항목으로는 시설이 위치한 시군명, 광역 및 기초 등의 구분 정보, 공식 시설명, 운영을 맡은 수탁기관명, 시설의 상세 소재지 주소, 그리고 문의 및 상담을 위한 연락처(전화번호) 등이 포함되어 있습니다. 본 데이터는 정신건강 관리가 필요한 수요자 및 보호자의 복지 접근성을 높이고, 지역별 정신보건 인프라 분석 및 관련 보건의료 정책 수립을 위한 기초 통계 자료로 유용하게 활용될 수 있습니다.
