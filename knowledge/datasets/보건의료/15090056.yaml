description_portal: 제주특별자치도 관내에 소재하고 있는 각 보건소에서 관리하는 소독의무시설과 관련한 현황 정보 (소관, 업소명, 소재지) 데이터를 제공합니다.감염병의 예방 및 관리에 관한 법률제51조(소독 의무)③ 공동주택, 숙박업소 등 여러 사람이 거주하거나 이용하는 시설 중 대통령령으로 정하는 시설을 관리·운영하는 자는 보건복지부령으로 정하는 바에 따라 감염병 예방에 필요한 소독을 하여야 한다.④ 제3항에 따라 소독을 하여야 하는 시설의 관리·운영자는 제52조제1항에 따라 소독업의 신고를 한 자에게 소독하게 하여야 한다. 다만, 「공동주택관리법」 제2조제1항제15호에 따른 주택관리업자가 제52조제1항에 따른 소독장비를 갖추었을 때에는 그가 관리하는 공동주택은 직접 소독할 수 있다.
