description_portal: 본 데이터는 은평구 각 행정동별로 월 단위로 집계된 코로나19 관련 사망자 수를 담고 있으며,  연도, 행정동 코드, 월, 사망자 수 등의 항목으로 구성되어 있습니다.  지역별 피해 규모를 정량적으로 비교할 수 있어 방역 정책 평가,  건강 취약 지역 분석, 의료 대응 전략 마련 등에 유용합니다.  또한, 인구 대비 사망률을 도출함으로써 고위험군 분포 파악과  맞춤형 대응 정책 수립이 가능합니다.  방역 관련 정책의 공간적 효과를 검증하거나,  코로나 이후의 지역 간 건강 불평등 연구에도 기반자료로도 활용이 됩니다. 조금 더 자세한 내용은 서울시 열린데이터나 보건소로 문의 바랍니다.
