summary_user: 인천 부평구에서 안전상비의약품을 파는 점포(주로 편의점 등)의 명칭, 도로명 소재지주소, 우편번호, 전화번호를 점포 한 곳당 한 행으로 담은 건별 목록 파일(CSV, 약 34KB)이다. 주민이 심야나 휴일에 집 근처에서 해열제·감기약·소화제를 살 수 있는 곳을 찾을 때, 또는 분석가가 부평구 안의 판매점 분포와 접근성을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지주소나 우편번호를 지오코딩·문자열 매칭해 이어 쓴다. 이렇게 이은 뒤 약국·응급의료기관 위치 데이터와 겹쳐 보는 식이다.
limits: 범위가 부평구 한 곳뿐이라 인천 전체나 다른 시군구와 비교하려면 각 지자체 파일을 따로 모아야 한다. 식약처 품목코드 같은 표준 키가 없어 판매 품목, 의약품 허가정보와는 직접 연결되지 않는다.
