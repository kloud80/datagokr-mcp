summary_user: 시도별·연도별 식중독 발생 건수와 환자 수를 학교, 집단급식, 음식점, 기타, 원인불명 같은 발생 시설 유형별로 나누고 합계와 함께 담은 전국 단위 집계 통계입니다. 보건·급식 담당자나 분석가가 '우리 시도에서는 학교와 음식점 중 어디서 식중독이 더 자주 발생했고 환자는 몇 명이었나' 같은 질문에 쓴다. 전역 조인 키는 없으므로 다른 시도 단위 통계와는 시도 코드(STDG_CTPV_CD)나 시도명을 매핑해 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 시도별 시설별 식중독 발생수 정보입니다.\""
