summary_user: 국민건강보험공단이 신규로 중증(암) 산정특례에 등록된 환자 수를 시도별·암유형별로 집계한 파일(CSV)로, 환자의 주민등록 주소지를 기준으로 전국 시도 단위 등록인원수를 담는다. 보건 분석가나 지자체 담당자가 '우리 시도에서 새로 등록된 암 환자 중 어떤 암이 많은가'처럼 지역별 신규 암 등록 규모와 암종 구성을 비교하는 데 쓴다. 전역 조인 키는 없어 시도명과 암유형 이름으로 다른 시도별 인구·진료 통계와 맞춰 이어 써야 한다.
limits: 시도 단위 집계라 시군구·개인 단위 분석은 할 수 없고, 연결할 공통 코드가 없어 시도명·암유형 이름을 직접 매핑해야 한다. 공단 자격(주민등록지) 기준 값이라 심평원의 청구(요양기관 소재지) 기준 통계와 수치가 다를 수 있다.
