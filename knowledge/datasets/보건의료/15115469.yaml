status: active
summary_user: '의약외품 품목별로 어느 연도에 어떤 업체가 생산 또는 수입했는지와 그 금액을 품목·업체·연도 단위 건별로 담는 전국 범위 데이터다. 사업자나 분석가가 특정 의약외품(예: 마스크·소독제)의 연도별 생산·수입 규모와 주요 업체를 비교해 시장 규모를 가늠하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으나, 식약처 품목기준코드(ITEM_SEQ)와 업일련번호·사업자번호로 같은 기관의 의약외품 허가정보나 업체 정보와 이름·코드 매핑으로 이어 쓴다.'
limits: 다른 기관 데이터와 바로 붙는 전역 조인 키가 없어 연계는 품목기준코드·업체명 등 이름·코드 매핑에 의존한다. 금액 단위가 생산은 백만원, 수입은 천달러로 섞여 있어 생산·수입구분을 확인한 뒤 합산·비교해야 하며, 지역별 분석은 불가한 전국·비공간 데이터다.
