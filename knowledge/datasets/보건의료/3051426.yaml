summary_user: 직장가입자 건강보험료 연말정산 처리 현황을 귀속연도별로 근로자·대표자로 나눠 대상자 수, 처리 수, 처리율을 담은 전국 단위 집계 통계입니다(806바이트 CSV). 분석가나 정책 담당자가 "해마다 연말정산 대상 직장가입자 중 기한 내 신고·처리된 비율은 얼마이고 근로자와 대표자 간 차이는 어떤가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 귀속연도를 기준으로 같은 기관의 가입자·보험료 통계와 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 합계만 있어 지역·업종·사업장별로 나눠 볼 수 없고, 연결용 공통 키가 없어 다른 데이터와 행 단위로 결합하지 못한다. 포털 설명상 수치는 천명·백분율 단위이고, 최근 3년간 신고 이력이 없는 미신고자는 제외되어 있으므로 전체 직장가입자 수로 해석하면 안 된다.
