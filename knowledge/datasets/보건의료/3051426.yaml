description_portal: '본 자료는 직장가입자를 대상으로 한 건강보험료 연말정산 처리 현황을 상세히 제공하는 통계입니다. 이 데이터는 건강보험료 정산 과정의 투명성 확보 및 정책 수립, 보험료 부과 체계 개선에 활용될 수 있습니다.또한 연말정산 신고율 향상과 효율적인 보험료 관리 방안 마련에도 중요한 참고 자료가 될 것입니다.1) 단위 : 천명 및 백분율(%)로 표기2) 처리 건수와 처리율은 연말정산 신고 기한 내 신고한 가입자를 기준으로 산출3) 최근 3년 이내 신고 이력이 없는 미신고자는 본 집계에서 제외    - 근로자: 매년 4월 18일 기준    - 대표자: 매년 8월 1일 기준    - 모든 수치는 소수점 이하를 절상 처리하여 정확도를 높임'
