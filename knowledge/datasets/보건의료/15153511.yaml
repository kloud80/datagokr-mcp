summary_user: 전국 의료기관별로 코로나19 진료 여부, 호흡기환자 진료 가능 여부, 검사 유형, 진료예약 전화번호, 주소·시도·시군구, 개설일자, 의사 수, 좌표를 한 건씩 담는다. 국민이나 분석가가 "우리 동네에서 호흡기 진료나 코로나 검사를 하는 병의원이 어디인가"를 찾을 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 기관명·주소나 시도·시군구 이름·코드(STDG_SGG_CD), 좌표를 맞춰 지역 단위로 연결해야 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 코로나 진료여부, 검사유형 등의 정보입니다.
