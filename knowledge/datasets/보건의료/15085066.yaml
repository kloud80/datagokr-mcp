description_portal: '○ 통계개요* 통계명 : 결핵관리 현황* 통계종류 : 서울시 자치구별 결핵관리 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「감염병의 예방 및 관리에 관한 법률」및「결핵예방법」에 의거한 결핵환자 관리* 작성목적 : 결핵은 제3군 법정감염병으로서 결핵발생환자 발생 및 관리 현황을 파악하여,결핵예방을 위한 보건의료정책수립의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 보건소 및 민간의료기관 → 시도 → 질병관리본부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 해당기관내용 - 서울시 등록(신고) 결핵환자수, 결핵예방접종실적, 결핵검진실적 등○ 용어설명* 결핵(tuberculosis) : Mycobacterium tuberculosis라는 세균의 감염에 의해 생기는 질환* 신환 : 과거 치료력이 없거나, 1개월(30일 기준)미만의 치료력이 있는 환자* 재발 : 과거 완치자가 다시 발병하여 상기 결핵진단기준에 해당하는 환자* 초치료 실패 : 과거 치료에 실패(계속적으로 균양성 혹은 균음성에서 다시 균양성으로전환)하여 새로운 처방으로 재치료가 요구되는 환자* 중단후 재등록 : 과거 치료력이 1개월 이상이면서, 치료를 2개월 이상 중단한 환자* 전입 : 과거 치료력이 1개월 이상이며, 치료를 2개월 이상 중단하지 않은 상태에서 치료장소를 옮겨 내소(원) 한 환자* 만성배균자 : 재치료(2차 결핵약제 포함)에 실패하고 계속 균양성환자○ 기 타○ 출 처 : 서울특별시 생활보건과'
