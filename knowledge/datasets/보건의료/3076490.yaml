description_portal: 은평구 관내 보건소, 보건분소, 보건지소 현황입니다. 속성으로는 번호,명칭,소재지주소,연락처,규모,시설현황으로 구성되어있습니다.서울특별시 은평구 내 4개의 주요 보건기관인 은평구보건소, 불광보건분소, 구산보건지소, 응암보건지소의 명칭, 소재지 주소, 연락처, 건물 규모, 그리고 주요 시설 현황을 체계적으로 정리한 데이터입니다. 각 기관은 지하 1층부터 지상 4~7층 규모의 건물을 보유하고 있으며, 주민들의 건강 증진과 예방, 치료를 위한 다양한 전문 시설과 서비스를 제공합니다. 은평구보건소는 건강관리센터, 금연상담실, 건강검진실, 모자보건센터 등 폭넓은 보건 서비스를 운영하며, 불광보건분소는 치매안심센터와 정신건강복지센터 등 정신건강 관련 시설을 갖추고 있습니다. 구산보건지소와 응암보건지소는 만성질환 예방관리, 재활보건, 방문보건 서비스와 더불어 노인 돌봄 및 심리지원 프로그램을 통해 지역 주민 맞춤형 보건 서비스를 제공하고 있습니다. 이 데이터는 은평구 내 보건의료 체계와 주민 건강 복지 향상을 위한 중요한 정보를 담고 있습니다.
