description_portal: '대구광역시 군위군의 폐의약품 수거함 설치현황으로 폐의약품 설치장소의 명칭 구분, 주소, 관리기관명, 데이터기준일의 항목을 제공합니다. 가정에서 발생한 폐의약품을 안전하게 수거·처리하기 위해 설치된 수거함의 위치 정보를 담은 공공데이터입니다. 이 데이터는 환경오염 예방, 시민 안전, 공공의료 서비스 개선, 행정 효율성 제고에 매우 중요하게 활용됩니다. 설치장소의 명칭 구분은 시설 유형 또는 장소 구분을 의미하며, 약국, 보건소, 보건지소/진료소, 종합병원/의료기관, 행정복지센터/주민센터, 기타(공공기관, 학교 등)의 유형이 있으며, 수거함 설치 기관 유형별 분포 분석, 접근성 및 커버리지(수거함 밀도) 평가, 민간·공공 부문 협력 사업 설계, 특정 기관(예: 약국) 대상 홍보 및 점검 정책 수립에 활용됩니다. 주소는 지도 시각화(GIS), 접근성 평가, 행정관리, 내비게이션 연계에 활용됩니다.'
