summary_user: 국립마산병원 한 곳의 입원 재원자수를 건강보험·의료급여·일반으로 나눠 1월부터 12월까지 월별 열로 정리한 소규모 집계 파일(csv, 약 2.4KB)이다. 결핵 등 공공병원 입원 이용 추이나 보험 유형별 재원 환자 구성 변화를 살펴보려는 분석가·연구자가 '이 병원의 월별 입원 환자 중 의료급여 비중은 어떻게 변하나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 같은 기관(질병관리청 소속 병원)의 다른 현황 파일과 이름으로만 맞춰 잇는다.
limits: 건별 환자 정보가 아닌 병원 단위 월별 합계이며 전국 범위로 분류돼 있지만 실제로는 한 병원의 수치라 지역·기관 간 비교에는 쓰기 어렵다. 조인 키가 없어 다른 의료기관 데이터와 자동 연결이 안 되고, 열이 월(1~12) 형태로 펼쳐져 있어 연도 구분은 파일 내용에서 따로 확인해야 한다.
