description_portal: '본 데이터는 서울특별시 종로구 내 산후조리업소에 대한 인허가 정보를 정리한 공공데이터입니다. 주요 항목에는 사업장명, 인허가일자, 인허가취소일자, 영업상태, 관리번호, 업종명 등이 포함되어 있으며, 산모와 신생아의 건강 회복 및 안정적인 산후 관리를 위한 민간시설 운영 현황을 확인할 수 있습니다. 본 자료는 산후조리원 설치 및 운영 실태, 인허가 변동 이력 등을 종합적으로 파악하여 보건복지 정책 수립, 신생아 안전관리 기준 강화, 서비스 품질 평가 등에 기초자료로 활용됩니다. 특히 산후조리 수요 증가에 따른 지역 내 시설 공급 상황을 분석하여 지속 가능한 산후 건강관리 인프라 조성에 기여할 수 있는 정보입니다. * 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
