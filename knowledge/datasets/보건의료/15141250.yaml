summary_user: 서울특별시 금천구의 목욕장업 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·주소·좌표·위생업태·건물 층수·욕실 수·종사자 수 등이 들어 있다. 금천구에서 지금 영업 중인 목욕탕·찜질방이 어디에 있고 최근 몇 곳이 폐업했는지 확인하려는 주민·창업 예정자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 업종 인허가(LOCALDATA) 데이터와는 같은 기관 코드(OPNSFTEAMCODE)나 사업장명·주소 매칭으로 이어 쓴다.
description_portal: 목욕장업 인허가 정보는 인허가일자, 영업상태, 사업장명, 주소, 전화번호를 비롯해 위생업태, 건물 층수, 욕실 수, 좌석 수, 종사자 수 등 다양한 항목을 포함하여 제공되는 데이터입니다. 또한 위치 좌표, 업종 구분, 건물 정보 등이 함께 수록되어 있어 공간적 분석이 가능하며, 지역 내 목욕장업 시설의 분포와 운영 현황을 체계적으로 파악할 수 있습니다. 이 데이터는 위생 관리 및 안전 관리 체계 강화, 관련 정책 수립, 창업 입지 선정, 시설 운영 개선 등 여러 분야에서 활용도가 높습니다. 공공기관은 물론 연구자와 일반 시민도 목욕장업 관련 현황을 확인하고 참고할 수 있어 실질적인 도움이 되며, 지역사회 공중위생 수준 향상과 생활 인프라 분석에도 중요한 기초 자료가 됩니다.
