description_portal: 부산광역시 아토피천식 안심학교 현황으로 연번, 보건소명, 안심학교명, 도로명주소, 위도, 경도 항목에 대한 정보를 제공합니다.생활환경의 변화로 인한 알레르기 질환의 악화요인 증가와 소아 감염성 질환 감소에 의한 면역체계 변화 등 알레르기 질환이 증가 함으로써  부산 아토피천식 교육정보센터에서 안심학교 교육을 진행하고 있습니다.  현재 부산의 안심학교 등록한 학교로 구성된 데이터 입니다. 파일 내 학교를 참고하여 주시기 바랍니다. 학교중심 사업추진으로 알레르기 질환 아동의 결석일수 감소와 학습능력 및 삶의 질 향상을 위해서 많은 도움을 줄 것입니다. 아토피천식 안심학교 대상으로 천식 아나필락시스 응급키트 지원, 알레르기질환 예방 관리 물품 지원, 현장방문, 아토피피부염 환아 모니터링을 실시하고 있습니다. 학생뿐만 아니라, 학부모 대상으로 온라인 아카데미를 운영하고 있고, 교사들 대상 및 보건소 담당자 교육을 실시하고 있습니다. 물품으로 보습제 , 교육책자 등을 지원하고 있습니다. 많은 이용 협조하여 주시기 바랍니다.
