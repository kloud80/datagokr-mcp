summary_user: 식약처가 실시한 의료기기 재평가를 품목 건별로 담는 전국 단위 API로, 재평가년도·업체명·품목명·등급·신청일·진행 상태·재평가 결과와 결과일을 제공한다. 병원 구매 담당자나 의료기기 업체가 특정 품목이 재평가 대상이었는지, 결과가 적합으로 나왔는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 의료기기 품목허가 정보와는 품목 일련번호(MEDDEV_ITEM_SEQ)나 업체명·품목명 매핑, 사업자등록번호(BRNO)를 이용해 같은 기관 데이터끼리 맞춰 이어야 한다.
description_portal: 국민의 건강과 안전을 확보하기 위해 식품의약품안전처가 수집·관리하는 의료기기 재평가 정보를 제공하기 위해 구축된 정보로, 의료기기의 허가정보, 회수·판매 현황, 제조소 품질관리(GMP) 관련 자료 등을 포함하며, 매년 재평가 대상 품목의 허가 적정성 여부를 분석하는 데 활용된다. 주요 제공 항목은 재평가년도, 업체명, 품목허가번호, 품목명, 재평가 결과 등이다. 해당 데이터는 의료기기 안전관리를 위한 정책 수립, 유통 중인 제품의 사후관리, 제조소 심사 시 참고자료 등으로 다양하게 활용될 수 있다.
