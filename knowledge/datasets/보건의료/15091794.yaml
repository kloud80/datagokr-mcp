description_portal: 이 데이터는 국립암센터에서 수집한 담도암 환자의 진단 시점에 확인된 주요 합병증 관련 정보를 포함하는 메타데이터입니다. 진단과 동시에 동반된 간기능 이상, 담도폐쇄, 감염, 황달 등의 임상적 합병증 정보를 제공하며, 환자의 건강 상태를 종합적으로 이해하는 데 활용됩니다. 이 데이터는 담도암 환자의 치료 전략 수립과 예후 예측, 중증도 평가에 유용하며, 합병증 발생에 따른 의료 자원 사용 및 치료 성과 분석에도 기초자료로 쓰일 수 있습니다. 연구자들은 이를 통해 진단 시 합병증 유무가 환자 생존율이나 치료 반응에 미치는 영향을 분석할 수 있습니다.
