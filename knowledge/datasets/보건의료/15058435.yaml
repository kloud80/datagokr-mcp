summary_user: 경기도 안에서 천식 진료 평가 결과가 '양호' 등급인 의료기관을 기관별 한 행으로 담는 목록이며, 기관명, 시군, 종별 구분, 평가등급, 지번·도로명 주소, 우편번호, 위경도가 들어 있다. 경기도 주민이 '우리 시군에서 천식 관리를 잘한다고 평가받은 병원이 어디인가'를 찾거나, 분석가가 시군별 우수기관 분포를 지도로 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 기관명·주소 매칭, 또는 위경도 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 천식 환자에 대한 병원별 평가 정보를 제공하며, 기관명, 시군명, 평가등급, 위치 주소, 위도·경도 등의 정보를 포함하고 있습니다. 병원의 평가 결과가 ‘양호’ 등급인 의료기관의 정보를 제공하여  천식 등 호흡기 질환 관리 역량이 우수한 기관을 식별할 수 있습니다. 지역 기반의 만성질환 대응체계 분석과 의료 자원의 분포 현황 파악에 활용될 수 있습니다. 본 데이터는 질병 중심의 보건정책 수립, 만성질환 예방 및 관리 프로그램 설계, 의료서비스 질 향상, 공공 보건의료체계 개선, 지역 간 건강불균형 해소 등의 목적으로 활용 가능합니다.
