summary_user: 서울 서초구 내 대중목욕탕·찜질방·사우나 등 목욕장업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일자·폐업일자·영업상태, 소재지 주소와 좌표, 욕실 수·발한실 여부·건물 층수 같은 시설 정보를 함께 담는다. 서초구에서 지금 영업 중인 찜질방·목욕탕이 어디 있는지, 최근 몇 년간 신설·폐업이 얼마나 있었는지 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, LOCALDATA 공통 인허가 형식이라 다른 업종 인허가 파일과 같은 방식으로 나란히 비교하는 데 쓴다.
description_portal: 서울특별시 서초구 내에서 대중목욕탕, 찜질방, 사우나 등 물을 이용한 목욕이나 맥반석, 황토 등에서 발생되는 열기 또는 원적외선 등을 활용해 땀을 낼 수 있는 다양한 시설과 설비를 갖추고 서비스를 제공하는 업소 정보를 체계적으로 제공하기 위해 구축되었습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등의 항목이 포함되어 있어 각 업소의 인허가 이력, 영업개시와 종료, 영업상태의 변동 등 행정관리 현황을 명확히 파악할 수 있습니다. 서초구청 등 관할 행정기관이 정기적으로 현장 확인과 정보 갱신 절차를 수행하여 데이터의 신뢰성 및 최신성을 높이고 있습니다. 본 데이터는 목욕장 및 찜질업 관리, 이용자 안전 확보, 신설·폐업 현황 통계 분석, 정책 수립, 시장 동향 파악, 위생·서비스 기준 점검과 업계 연구 등 다양한 분야에 폭넓게 활용될 수 있습니다. 시민과 업계, 관계기관에 객관적인 정보를 제공하며 데이터는 최신 기준에 맞춰 지속적으로 업데이트됩니다.
