description_portal: '건강_치과기공소 데이터는 인공 치아를 제작하거나 보수하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 치과기공소 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 보건복지부 의료자원정책과 / 044-202-2421 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
