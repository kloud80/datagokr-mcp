summary_user: 만 20세 이상 건강보험 가입자·의료급여수급권자(외국인 포함) 중 뇌졸중(I60-I64) 주·부상병 환자의 진료에피소드를 발생년도·성별·5세 연령군·소득수준·시도·시군구별로 집계해 인년, 실인원수, 입원에피소드 발생건수, 발생 28일 내 사망건수를 담은 전국 단위 CSV 파일이다. 보건 분석가나 지자체 담당자가 '우리 시군구의 성·연령·소득수준별 뇌졸중 발생률과 28일 치명률은 어느 정도인가'를 따질 때 쓴다. 전역 조인 키는 없어 광역시도명·구시군 이름이나 시도 코드를 매핑해 인구·의료자원 등 다른 지역 통계와 이어 쓴다.
