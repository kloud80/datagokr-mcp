summary_user: 아산시 관내 약국을 한 곳씩 담은 목록으로, 영업구분·약국명·전화번호·도로명 주소·의약분업예외지역 여부를 시군구 범위의 개별 주소 단위로 담는다(약 16KB CSV 파일). 주민이 우리 동네에서 의약품을 사거나 복약상담을 받을 약국을 찾거나, 분석가가 아산시 안에서 약국이 어느 지역에 몰려 있고 의약분업예외지역 약국이 어디인지 파악하는 데 쓴다. 공통 조인 키가 없어 다른 약국·의료기관 데이터와는 약국명이나 도로명 주소를 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 LOCALDATA 인허가나 건강보험 약국 정보와 붙일 때는 이름·주소 매칭에 의존해야 한다. 아산시 한 곳만 다루므로 다른 시군과 비교하려면 지역별 파일을 따로 모아야 한다.
