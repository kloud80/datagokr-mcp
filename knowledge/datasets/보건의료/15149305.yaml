summary_user: 장기요양 재택의료센터 시범사업에 참여 중인 기관을 한 기관당 한 행으로 담은 전국 목록으로, 시도·시군구·기관명·기관 종별(의원·한의원·지방의료원·보건소)·주소를 담는다(포털 설명상 2025년 8월 21일 발췌, CSV 약 18KB). 거동이 불편한 재가 장기요양 수급자나 가족이 "우리 시군구에서 방문진료·방문간호를 해 주는 재택의료센터가 어디인가"를 찾을 때, 또는 분석가가 지역별 참여기관 분포를 볼 때 쓴다. 요양기관 기호 같은 공통 조인 키가 없어 다른 요양기관·장기요양 데이터와는 기관명·주소 또는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: '□ 개요장기요양 재택의료센터 시범사업은 재가에 거주하는 거동이 불편한 장기요양 수급자에게 방문형 의료-요양 통합서비스를 제공하는 제도입니다. - (이용대상) 재가 장기요양 수급자로 거동이 불편하고 재택의료가 필요한 사람(1~2등급 우선)으로 의사가 판단한 경우 - (참여기관) 장기요양 재택의료센터 시범사업 지정기관(의원, 한의원, 지방의료원, 보건소) - (제공서비스) 방문진료(월 1회), 간호(월 2회 이상) 제공 및 지역사회 돌봄서비스 연계본 데이터는 국민건강보험공단에서 제공하는 장기요양 재택의료센터 시범사업 참여기관 목록입니다.□ 주요 내용- 발췌 일자: 2025년 8월 21일- 분류 기준: 시·도, 시·군·구, 재택의료센터 기관명, 재택의료센터 기관 종별, 주소- 시·도 및 시·군·구: 장기요양 재택의료센터 기관 소재지 기준- 재택의료센터 기관명: 발췌일자 기준 장기요양 재택의료센터 시범사업에 참여중인 기관- 재택의료센터 기관 종별: 의원, 한의원, 지방의료원, 보건소(보건지소, 보건의료원 포함)- 주소: 장기요양 재택의료센터 기관의 주소'
