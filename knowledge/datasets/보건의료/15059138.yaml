summary_user: 경기도 내 동물용 의약품을 취급하는 동물약국을 사업장 한 곳씩 담은 인허가 원천 목록으로, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·위경도 좌표·축산고유번호 등을 담는다. 반려동물 보호자가 우리 동네에서 영업 중인 동물약국을 찾거나, 분석가가 시군별 동물약국 분포와 개폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·주소·사업장명 매칭이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 동물약국의 인허가 현황을 수록한 자료로, 동물용 의약품을 취급하는 약국들의 사업장 정보와 행정 구분별 위치 정보를 제공합니다. 항목으로는 시군명, 사업장명, 인허가일자, 영업상태, 주소(도로명 및 지번), 전화번호, 총종업원 수, 업태구분명, 위도·경도 좌표, 축산업무 구분명, 축산고유번호 등이 포함됩니다. 이 데이터는 반려동물 및 가축에 대한 의약품 접근성 파악, 지역별 의약품 유통 현황 분석, 동물보건 정책 수립, 불법 유통 감시 체계 구축 등의 목적에 활용될 수 있습니다. 주간 단위로 갱신되며, Open API를 통해 다양한 방식으로 활용 가능하며, 위치 기반 서비스나 지도 시각화에도 유용합니다.
