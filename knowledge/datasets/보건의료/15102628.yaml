summary_user: 인천 부평구에 등록된 의약품 도매상 영업소를 한 곳당 한 행으로 담은 건별 목록 파일로, 업종 구분·영업소명·도로명 주소·우편번호·전화번호를 담는다(약 4KB 규모의 CSV). 약국·의료기관 담당자나 구민이 '부평구 안에 어떤 의약품 도매상이 어디에 있고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키나 식약처 품목·업체 코드는 없어서, 다른 데이터와는 영업소명·주소 문자열을 맞춰 보거나 같은 기관(부평구)의 다른 인허가 자료와 나란히 놓는 방식으로만 이어 쓴다.
description_portal: '부평구 내 등록된 의약품 도매상 영업소의 업종, 명칭, 주소, 전화번호 등을 정리한 자료의약품 유통관리, 보건의료기관 공급처 확인, 민원 대응 등에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 관내 의약품 도매상 분포 및 운영 현황 파악– 약국 및 의료기관 대상 공급업체 정보 제공– 약사법에 따른 등록업소 관리 및 행정 자료 활용– 의약품 유통경로 확인 및 민원 응대 기반 자료 활용주요 항목 설명● 영업종별: 의약품 도매상 업종 구분 (예: 전문의약품, 일반의약품 등)● 영업소명: 등록된 도매상 영업소의 명칭● 영업소소재지(도로명): 도로명 기준의 영업소 주소● 영업소우편번호: 소재지에 해당하는 우편번호● 영업소전화번호: 영업소 운영 및 유통 문의를 위한 연락처'
