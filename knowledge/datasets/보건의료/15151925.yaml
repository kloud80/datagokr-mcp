summary_user: 식품의약품안전처가 정한 동물용의약품별 잔류허용기준을 재난안전데이터 공유플랫폼을 통해 전국 단위(비공간)로 제공하는 기준 목록으로, 의약품 한글명·식품 한글/영문명·잔류허용기준값(MRL)·시행일자·잠정기준 적용 여부·삭제 여부 등을 담는다. 축산물·수산물 수입·유통 사업자나 검사기관이 특정 동물용의약품이 어떤 식품에 얼마까지 남아도 되는지, 그 기준이 언제부터 시행됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 의약품명이나 식품명을 이름으로 맞추는 방식으로만 잇는다.
