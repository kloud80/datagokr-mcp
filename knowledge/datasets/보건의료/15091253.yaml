summary_user: 인천광역시 서구(서해구) 안에 있는 요양병원을 한 곳당 한 행으로 업소명·소재지 주소·전화번호·데이터기준일자를 담은 작은 목록 파일(csv 약 1.1KB)이다. 우리 동네 가까운 요양병원이 어디 있고 연락처가 무엇인지 찾으려는 주민이나, 서구 내 노인 대상 의료시설 분포를 살피는 보건 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 기준으로 맞춰 이어야 하며, 의료기관 인허가(LOCALDATA) 자료와 대조할 때도 이름·주소 매칭에 의존한다.
description_portal: 본 공공데이터는 인천광역시 서구 지역 내 요양병원의 현황을 정리한 자료입니다. 본 자료는 인천광역시 서구 내 요양병원의 업소명, 소재지, 주소 등으로 구성이 되어 있습니다. 본 데이터를 통해 노인 대상의 지역 의료시설 분포를 확인 할 수 있으며, 이를 통해 시민의 의료접근성 향상, 공공보건계획 수립 등 다양한 행정 활용이 가능할것으로 판단이 됩니다. 또한 지역 보건자원의 균형적 분포 및 수요 예측에도 도움이 될것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
