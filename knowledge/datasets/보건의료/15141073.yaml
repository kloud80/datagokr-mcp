description_portal: '- (시트1) 주상병코드 기준- (시트2) 주상병코드 + 행위코드 그룹 기준1. 보험구분: 건강보험, 의료급여2. 주상병코드: F32.2(정신병적 증상이 없는 중증의 우울에피소드)3. 진료연도/월: 2018년~2023년, 각 월 및 전체4. 진료형태: 입원, 외래5. 행위코드 그룹(시트2 해당)     1) 그룹1 (개인정신치료): NN001, NN002, NN003, NN004, NN005  2) 그룹2 (집단정신치료): NN021, NN022, NN023  3) 그룹3 (가족치료): NN031, NN032  4) 그룹4 (작업 및 오락요법): NN040  5) 그룹5 (약물이용면담): NN050  6) 그룹6 (인지행동치료): NN061, NN062  7) 그룹7 (전기충격요법): NN071, NN072  8) 그룹8 (지속적수면요법): NN081, NN082, NN083  9) 그룹9 (정신의학적재활요법): NN090  10) 그룹10 (정신의학적응급처치): NN100  11) 그룹11 (정신의학적사회사업): NN111, NN112, NN113, NN1146. 진료 인원 및 건수: 해당 구분별 진료인원(중복제외) 및 건수7. 수가금액 : 해당 행위코드에 대한 수가 비용  - 진료일 기준(한의분류 제외, 진료 인원은 약국 제외)  - 건강보험 및 의료급여 실적이며, 비급여는 제외  - 2024년 6월 심사 및 지급분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음  - 개인정보 보호를 위해 5 미만의 자료는 "*" 처리※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
