description_portal: '제주특별자치도 내 규칙적 운동 여부에 따른 유병률 통계 데이터를 제공합니다.항목: 연도, 시도, 규칙적운동여부, 유병률, 유병자의 평균 유병일수(일), 유병자의 평균 입원하거나 누워 지낸 일수(일) 등* 제주특별자치도 내 주민들을 대상으로 규칙적으로 운동을 하는 사람과 그렇지 않은 사람 사이의 유병률(prevalence) 차이를 조사한 자료입니다. 여기서 “규칙적 운동”은 주기적 또는 일정 빈도 이상 운동을 실천하는지를 의미하며, 유병률은 특정 질환 또는 만성질환 상태가 해당 집단에서 얼마나 존재하는지를 나타냅니다.* 활용 분야 : 예방의료 및 건강증진 프로그램 기획, 의료비 및 만성질환 부담 완화 전략 마련 등데이터 제공처: KOSIS 국가통계포털'
