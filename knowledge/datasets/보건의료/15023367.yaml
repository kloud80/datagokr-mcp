summary_user: 부산광역시 금정구에 있는 치과기공소를 업소 한 곳당 한 행으로 담은 현황 파일로, 기공소명·도로명 소재지·전화번호를 담는다. 치과나 의료기관이 금정구 안에서 협력할 치과기공소를 찾거나, 구청이 관내 기공소 위치를 파악해 점검 대상을 정리할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기공소명이나 도로명 주소를 맞춰 붙여야 하며, 주소를 좌표로 바꾸면 지도·상권 데이터와 겹쳐 볼 수 있다.
limits: 코드형 조인 키가 없어 LOCALDATA 인허가 자료 등과 이을 때 이름·주소 매칭에 기대야 하고, 범위가 금정구 한 곳에 한정된다. 개업·폐업 일자 같은 인허가 이력은 없어 개폐업 추이 분석에는 쓰기 어렵다.
