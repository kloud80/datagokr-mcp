summary_user: 전북특별자치도 내 의료기관을 사업장 단위로 담은 건별 인허가 데이터로, 사업장명·의료기관 종별·진료과목·인허가일자·영업상태와 병상수·입원실수·의료인수·구급차 보유, 도로명주소와 좌표(중부원점TM)를 함께 제공한다. 도민이 우리 동네에서 영업 중인 특정 진료과목 의원을 찾거나, 분석가가 시군별 병의원 개폐업 추이를 상권 신호로 볼 때 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 좌표(EPSG:5174) 기반 공간 결합으로만 이어 쓴다.
limits: 범위가 전북특별자치도 한 개 시도에 한정되어 전국 비교에는 다른 시도·LOCALDATA 원천이 따로 필요하다. 전역 조인 키가 없어 건강보험 요양기관 등과의 연결은 이름·주소 매핑에 의존하며 불일치가 생길 수 있다. 개발계정은 하루 10,000회 호출 제한이 있다.
