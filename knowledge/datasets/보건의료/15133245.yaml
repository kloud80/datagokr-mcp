description_portal: 전북특별자치도 내 의료기관 현황 조회 서비스를 제공하는 오픈API로 데이터 수요자에게 제공하고자 합니다.. 데이터 항목은 인허가일자, 소재지 전화, 도로명 전체주소, 업태 구분명, 사업장명, 진료과목 내용명 등을 기준으로 구성되어 있습니다. 도민 및 의료 관련 기관이 지역 의료 환경을 쉽게 조회하고 활용할 수 있으며, 보건 정책 수립, 연구, 민원 처리 등 다양한 분야에서 활용 가능합니다. 개인정보는 포함되지 않도록 하였으며, 데이터의 정확성과 신뢰성을 확보를 위해 노력하였습니다. 궁금한 점이나 추가 문의사항이 있으시면 보건의료과로 문의하여 주시기 바랍니다.
