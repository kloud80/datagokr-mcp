description_portal: 본 데이터는 경기도 광주시에서 산모와 신생아를 위한 건강관리 서비스를 제공하는 기관의 현황 정보를 제공합니다. 산모신생아 건강관리 서비스는 출산 가정에 전문 관리사를 파견하여 산모의 산후 회복과 신생아 돌봄을 지원하는 정부 지원 사업입니다. 제공기관명을 통해 서비스를 제공하는 기관을 확인할 수 있으며, 행정동 및 주소 정보는 각 기관의 위치를 안내합니다. 전화번호는 서비스 신청 및 상담을 위한 연락 창구로, 출산을 앞두거나 출산한 가정이 필요한 지원을 받기 위해 직접 문의할 수 있습니다. 이를 통해 산모와 신생아의 건강한 출발을 돕고 육아 부담을 경감할 수 있습니다.
