summary_user: 서울 강서구 관내 병원급 의료기관을 사업장 한 곳당 한 행으로 담은 LOCALDATA 인허가 원천 데이터로, 인허가·폐업일자, 영업상태, 사업장명, 지번·도로명 주소와 좌표, 병상·입원실·의료인 수, 총면적, 진료과목 등을 포함한다. 분석가나 창업자가 강서구에서 최근 개업하거나 폐업한 병원이 어디이고 진료과목·병상 규모가 어떤지 확인해 의료 인프라 분포나 상권 변화를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 연결하며, 좌표(X·Y)로 공간 결합하는 방식도 쓸 수 있다.
description_portal: 서울특별시 강서구 병원 인허가 정보는 강서구 관내 병원급 의료기관에 대한 행정 인허가 및 운영 현황을 포함한 상세 데이터를 제공합니다. 본 데이터는 인허가일자, 영업상태, 사업장명, 주소, 전화번호뿐 아니라, 병상수, 입원실 수, 의료인 수, 진료과목 내용, 총면적, 구급차 보유현황, 지정취소 여부 등 다양한 항목을 포함하고 있어 병원의 운영 규모 및 기능적 특성을 체계적으로 파악할 수 있습니다. 또한 의료기관종별명과 허가 병상 수, 지정일자 및 재개업일자 등의 정보는 의료 인프라 분석, 응급의료 자원 배분, 보건의료 서비스 수급계획 수립에 있어 핵심 지표로 활용될 수 있으며, 공공의료 정책 수립이나 병상 확보 전략 등 다양한 보건행정 의사결정의 기초자료로 활용됩니다. 특히 지역 내 종합병원 및 전문병원 등 병원급 기관 분포와 진료기능을 분석하여 의료 접근성과 공공보건 대응력을 평가하는 데 중요한 역할을 합니다.
