summary_user: 국립법무병원이 환자 처방에 쓰는 의약품의 효능을 코드화한 마스터 파일로, 효능코드·효능명·관리기관명·담당부서를 담는 1,782바이트 규모의 소형 CSV 코드표입니다. 법무병원 처방 자료나 치료감호 관련 의약품 사용 기록을 분석할 때 '이 효능코드가 어떤 약효군을 뜻하는가'를 풀이하는 참고표로 쓴다. 실측 컬럼에 전역 조인 키가 없어 식약처 품목기준코드나 의약품 표준코드로 바로 연결되지 않으며, 같은 기관의 의약품 자료와 효능코드·효능명 매핑으로만 이어 쓴다.
description_portal: '국립법무병원은 범법정신질환자인 피치료감호자의 치료 및 정신감정유치자의 정신감정 업무를 수행하고 있습니다. 국립법무병원에서 사용하는 의약품의 효능 코드 마스터로 기본정보는 효능코드, 효능명, 관리기관명, 담당부서로 구성되었습니다. 의약품에대한 설명을 포함하고 있으며, 병원 의료진이 환자 처방시 사용하는 의약품에 대한 효능을 코드화하여 수집한 자료로 관련 업무의 참고자료로 활용될 수 있습니다.*피치료감호자 : 1호(심신장애), 2호(알코올, 마약 등 중독자), 3호(정신성적 장애)'
