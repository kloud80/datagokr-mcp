summary_user: 의원급 의료기관의 진료년도별·표시과목별·행위코드별로 환자수, 명세서 청구건수, 총사용량, 진료행위 청구금액을 집계한 전국 단위 통계 파일이며, 건강보험 심사 결정분을 기준으로 한다. 분석가나 의료 정책 담당자가 '내과 의원에서 어떤 진료행위가 가장 많이 청구되고 금액은 얼마인가' 같은 과목별 진료행위 이용 규모를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행위코드를 심평원 의·치과 수가파일의 행위명과 맞추거나 표시과목 이름으로 매핑해 이어 쓴다.
limits: 요양기관 식별 코드가 없어 개별 의원 단위나 지역별 분석은 할 수 없고 전국 집계로만 본다. 환자수는 범주 내 중복만 제거한 값이라 과목·행위를 단순 합산하면 중복이 생기며, 2019년 진료분부터 서면·DRG 청구건은 빠져 있다.
