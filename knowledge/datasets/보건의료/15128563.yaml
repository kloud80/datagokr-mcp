summary_user: 천안시 내 의료기관별로 CT·MRI 등 특수의료장비의 공동활용 가능 여부와 병상수를 기관 단위 한 행씩 담은 소규모 파일(csv 약 3KB)로, 기관명·도로명주소·전화번호가 함께 있다. 천안 시민이나 보건 행정 담당자가 'CT나 MRI 검사를 받을 수 있는 천안 지역 병원이 어디이고 병상은 몇 개인가'를 확인할 때 쓴다. 전역 조인 키(기관 코드 등)가 없어 다른 의료기관 인허가 데이터(LOCALDATA 등)와는 의료기관명이나 주소를 맞춰 연결해야 한다.
description_portal: 충청남도 천안시 특수의료장비 공동활용 병상 데이터는 지역 내 의료기관에서 보유하고 있는 CT, MRI 등 특수의료장비의 활용 가능 여부와 병상 현황을 파악하여 작성된 데이터입니다. 순번과 의료기관명은 각 기관을 식별하는 기본 정보이며, 의료기관주소와 전화번호는 이용자와 의료기관 간의 신속한 접근과 문의를 돕습니다. CT·MRI 가능여부는 해당 기관에서 특수 진단 장비를 실제로 이용할 수 있는지를 판단하는 정보입니다. 본 데이터는 지역 내 의료자원 공동 활용 체계 구축, 응급·정밀 검사 연계 강화, 공공의료 정책 수립 등 다양한 보건 행정 업무에 활용될 수 있습니다.
