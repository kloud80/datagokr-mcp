summary_user: 경기도 내 소독업체를 사업장 단위로 담은 인허가 원천 자료로, 인허가일자·영업상태·폐업일자, 도로명·지번 주소와 좌표, 사무실·소독차량 차고 면적, 초미립자살포기·휴대용 소독기·동력분무기·방독면·보호복 등 장비 보유 수를 함께 담는다. 지자체 위생 담당자나 분석가가 '우리 시군에 영업 중인 방역업체가 몇 곳이고 장비를 얼마나 갖췄는가'를 확인하거나, 사업자가 지역별 소독업 개폐업 추이를 살피는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소, 위경도 좌표를 기준으로 다른 경기도 인허가·행정구역 자료와 이름·위치 매핑으로 잇는다.
description_portal: 이 데이터는 경기도 소독업체의 인허가 및 영업 현황을 정리한 자료로, 공중보건과 위생 관리를 위한 방역업체 정보를 포함하고 있습니다. 주요 항목에는 시군명, 사업장명, 인허가일자 및 인허가취소일자, 영업상태구분코드 및 영업상태명, 폐업일자, 소재지 주소와 시설 전화번호, 우편번호가 있으며, 업체 보유 장비와 관련된 세부 정보도 함께 제공됩니다. 초미립자살포기, 휴대용 소독기, 동력분무기 등의 보유 현황이 포함되어 있습니다. 이 데이터는 지역별 방역업체 분포, 장비 보유 수준, 공중위생 관리 정책 수립, 감염병 대응 체계 강화 등 다양한 분야에서 활용될 수 있습니다.
