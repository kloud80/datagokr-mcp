description_portal: '전북특별자치도 전주시 내 부속의료기관을 제공하며 사업장명, 인허가일자, 상세영업상태, 소재지전화번호, 도로명 주소, 지번주소, 위도, 경도 등을 제공합니다.부속의원, 부속병원 등 해당 소속 지원, 종업원 및 그 가족의 건강관리를 위한 의료기관*부속의료기관은 1건만 임담당부서 : 보건행정과활용포인트 : 전주시 내 의료 접근성 및 지역별 의료기관 분포 분석 가능진료과목별 현황을 통해 특정 분야(예: 치과, 내과)의 공급 수준 파악보건 정책 담당자는 지역 의료 인프라 확충 계획 수립에 활용연구자나 시민은 의료기관 위치 및 연락처 정보를 통해 생활 편의성 향상이 데이터는 전주시민의 의료 서비스 접근성을 높이고, 행정기관이 지역 보건정책을 설계하는 데 중요한 기초자료입니다.'
