description_portal: 세종특별자치시에서 운영하고 있는 "세종 똑똑건강 앱"보유 세종시민 건강데이터 중 자세 측정 정보입니다.데이터는 성별, 나이, 주거 행정동, 어깨 기울기 소견, 골반 기울기 소견 등의  정보로 구성되어 있습니다.똑똑건강앱은 시민들의 건강개선과 이용자 만족도를 제공하기 위해 다양한 건강콘텐츠를 제공하고 있습니다.이자료는 세종특별자치시 보건정책과에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.문의사항은 세종시청 보건정책과 똑똑건강 담당자(044-300-5716)에게 연락하시기 바랍니다.
