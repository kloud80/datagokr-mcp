summary_user: 서울시 자치구가 운영하는 건강증진센터를 센터 한 곳당 한 행으로 담은 표준 데이터로, 명칭·구분, 도로명·지번 주소와 위경도, 주요 업무, 운영 시작·종료 시각과 휴무일, 면적, 의사·간호사·사회복지사·영양사 등 인력 수, 운영기관 연락처를 포함한다. 서울 시민이 우리 동네에서 금연·운동·영양 같은 건강 프로그램을 받을 수 있는 센터가 어디이고 언제 여는지 찾거나, 분석가가 자치구별 건강증진 인프라와 인력 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 보건소·건강지표 데이터와는 기관코드(INSTTCODE)나 센터명·주소 매칭으로 잇고, 위경도로 지도상 거리 분석에 붙여 쓴다.
description_portal: 이 데이터는 서울시 전 자치구에서 운영하는 건강증진센터의 주요 정보를 제공한다. 각 센터의 명칭, 위치(주소), 연락처, 운영시간, 그리고 제공하는 건강 프로그램 종류가 포함되어 있어 지역주민이 이용 가능한 공공 건강서비스의 현황을 한눈에 파악할 수 있다. 센터별로 금연·운동·영양 등 생활습관 개선 프로그램부터 만성질환 예방 교육, 지역 특화 건강관리 서비스까지 다양한 정보가 제공된다. 이를 바탕으로 자치구 간 건강서비스 접근성 비교, 주민 참여도 분석, 정책 대상자 발굴 등 공공보건 정책 수립에 유용하다. 또한 시민 대상 안내자료 제작, 건강 프로그램 추천 시스템 구축, GIS 기반 건강 서비스 분포 분석 등 실무 활용도가 높다. 데이터는 행정·정책지원, 연구·통계 활용, 시민 정보 제공 등 여러 분야에서 활용 가능한 구조로 구성되어 있다.※ 데이터 내용에 관한 문의사항은 각 자치구별 담당자에게 문의바랍니다.
