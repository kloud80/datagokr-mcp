description_portal: 뇌사추정자 전체 통보 현황은 국내에서 발생한 뇌사추정자의 수와, 그 중 사후에 잠재적으로 조직기증이 가능하다고 판단된 대상자의 수를 연도 및 월 단위로 정리한 종합 통계 자료이다. 본 통계는 뇌사 및 조직기증 관련 정책 수립과 현황 분석에 있어 기초자료로 활용되고 있다.2017년 4월부터는 장기 및 조직 구득기관의 통합 운영에 따라, 한국장기조직기증원이 사후 잠재 조직기증자에 대한 통보를 일원화하여 관리하고 있다. 이에 따라 해당 시점 이후부터는 조직기증 가능성이 있는 사망자의 정보가 보다 체계적으로 수집·분류되고 있다.본 통계에서 ‘뇌사추정자 통보’란, 전국의 의료기관 등에서 뇌사로 의심되는 환자에 대해 한국장기조직기증원으로 통보한 건수를 의미한다. 이는 뇌사 기증 가능성을 사전에 포착하기 위한 중요한 단계로, 장기 및 조직 기증 절차의 시작점에 해당한다.‘사후 잠재 조직기증자 통보’는 사망한 사람 중 조직기증이 가능하다고 판단되어 통보된 건수를 의미하며, 이 수치는 조직기증 실현 가능성을 반영하는 주요 지표로 사용된다.조직기증은 다양한 인체조직을 대상으로 이루어질 수 있으며, 해당 통계에 포함되는 조직 종류에는 피부, 뼈, 인대 및 건, 혈관, 연골, 심장판막, 근막, 신경, 심낭 등이 포함된다. 생존 시 기증이 가능한 양막 역시 해당 범주에 포함되어 관리된다.이러한 통계를 통해 우리는 뇌사추정자와 조직기증의 연계 가능성, 의료현장에서의 통보체계 작동 현황, 기증자 발굴 및 연결 시스템의 효율성 등을 종합적으로 분석할 수 있다. 또한 향후 조직기증 활성화를 위한 제도적 개선 및 홍보 전략 수립에도 기초 자료로서의 기능을 수행한다.
