description_portal: 서울특별시 서초구 행정동별 월별 코로나 확진자 현황으로, 기타 항목은 주소 불명확, 타구 확진자 등에 대한 현황입니다.본 자료는 지역 내 감염병 확산 및 대응 상황을 분석하는 데 활용할 수 있으며, 감염병 관련 정책 수립, 보건의료 자원 배분, 시민 건강 안전 확보 등을 위한 기초 자료로서의 가치가 있다. 공공 보건의 투명성과 데이터 기반 행정 강화를 위해 개방되며, 사용자는 이를 통해 시기별 사망자 변동 양상 및 누적 규모를 명확히 파악할 수 있다.2019년 11월 17일 중국에서 최초 보고[19] 된 범유행전염병이자 사람과 동물 모두 감염되는 인수공통전염병이다. 2023년 5월 5일, 세계보건기구는 코로나19의 국제적 공중 보건 비상사태(PHEIC)의 해제를 발표하였다. PHEIC가 선언된 3년 4개월 동안 공식적으로 6억 8700만 명 이상의 확진자와 약 690만 명의 사망자가 발생했고, 약 133억 회의 백신이 접종되었다.
