summary_user: 직장가입자 건강보험료를 연도별 전국 집계로 담은 소규모 통계 파일(csv 842바이트)로, 결산 기준 보험료 총액(백만원), 가입자·적용인구 1인당 월평균 보험료, 연도말 직장가입자 수와 적용인구 수를 한 해에 한 행씩 담는다. 분석가나 기자가 '직장가입자 1인당 월평균 건강보험료는 해마다 얼마나 올랐나'를 확인하거나 가입자 수 증가와 보험료 총액 추이를 비교할 때 쓴다. 전역 조인 키가 없어 다른 자료와는 연도(연도) 기준으로만 맞춰 쓰며, 같은 공단의 지역가입자 부과 통계 등과 연도별로 나란히 놓고 비교하는 정도로 연결한다.
limits: 전국 단위 연도별 총계만 있어 시도·시군구별, 사업장 규모별, 소득 구간별 분석은 할 수 없다. 다른 데이터와 이어 붙일 공통 코드가 없어 연도 이름 매핑으로만 연결된다.
