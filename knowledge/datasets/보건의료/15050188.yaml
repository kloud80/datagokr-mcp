summary_user: WHO 알코올 정보시스템(GISAH) 기반의 15세 이상 1인당 알코올 소비량(리터, 3개년 평균에 비공식 소비·관광객 보정 합산)을 연도·구분별 행에 36개 국가 열(국가_01~국가_36)로 펼쳐 담은 국가 단위 집계 파일(csv, 약 11KB)입니다. 연구자나 절주 정책 담당자가 '한국의 1인당 알코올 소비량이 다른 나라에 비해 어느 수준이고 연도별로 어떻게 변해 왔나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 국가명을 이름으로 맞춰서만 이어 쓸 수 있습니다.
description_portal: 음주폐해예방 관련 지표 - 세계보건기구(WHO) 알코올 정보시스템(GISAH)을 기반으로 공식 집계된 1인당 알코올 소비량(3개년 평균)에 비공식 소비량(밀주 등 추정치)과 관광객 소비 보정치를 합산하여 리터(ℓ) 단위로 제시하는 지표입니다. - 국가 간 비교를 통해 알코올 소비 수준의 국제적 차이를 파악할 수 있으며, 연도별 추세도 확인 가능합니다. - 소비량을 산출하는 주종의 종류로는 맥주, 와인, 증류주, 기타 주종 등이 있습니다.  - 본 데이터는 음주폐해예방 및 절주문화 확산을 위한 국가간 비교 연구에 기초자료로 활용될 수 있습니다.
