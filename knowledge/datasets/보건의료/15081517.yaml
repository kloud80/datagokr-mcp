description_portal: '건강검진기본법 제14조에 따라 국가건강검진 실시기관으로 지정된 인천광역시 강화군 관내 의료기관 현황을 정리한 자료로서, 주민의 건강관리와 예방 중심 보건의료 서비스 제공을 지원하기 위해 작성되었습니다. 강화군에서는 건강검진 제도의 원활한 운영과 주민 의료 접근성 강화를 위해 관련 의료기관 정보를 관리하고 있으며, 해당 자료는 건강검진, 영유아 건강검진, 암검진을 수행하는 기관의 분포 현황을 이해하는 데 참고할 수 있습니다.공공데이터 제공신청(제공신청 번호 : 73340)을 통해 1회성으로 개방하는 데이터이므로 정기적 갱신이나 현행화를 진행하지 않습니다.'
