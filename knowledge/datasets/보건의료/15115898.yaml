summary_user: 서울 중구 내 의원의 인허가 정보를 사업장(관리번호) 단위로 담은 건별 원천 데이터로, 인허가일·폐업일·영업상태, 진료과목, 소재지 주소, 중부원점TM 좌표, 의료인·병상 수 등을 포함한다. 주민이나 상권 분석가가 '중구에서 최근 새로 문을 열거나 폐업한 의원은 어디이며 어떤 진료과목인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관의 개방서비스 코드(OPNSFTEAMCODE)로만 연결하며, 같은 LOCALDATA 공통 인허가 형식의 병원·치과·약국 등 데이터와 함께 쓴다.
description_portal: '본 데이터는 서울특별시 중구 내 의원의 인허가 현황을 체계적으로 정리한 자료로서, 지역 내 의료기관의 운영 실태를 파악하고자 하는 행정 및 연구 목적에 활용될 수 있습니다. 데이터에는 각 의원의 인허일자, 진료과목, 의료기관 유형, 위치정보 등 다양한 항목이 포함되어 있어, 중구 지역의 보건의료 서비스 분포와 특성을 분석하는 데 유용합니다. 또한 행정구역별 의원 수, 등록일자, 기관명 등의 정보는 정책 수립 및 자원 배분에 필요한 기초자료로 활용될 수 있으며, 의료 접근성과 관련된 연구에도 기여할 수 있습니다. 이와 같은 정보는 시민의 건강권 보장과 지역 의료체계의 효율적 운영을 위한 기반 자료로서 중요한 의미를 갖습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
