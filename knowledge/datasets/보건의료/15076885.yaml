summary_user: 식약처가 정리한 기구·용기·포장 및 식의약품 분야 용어를 단어 하나당 한 건으로 담은 용어사전으로, 단어·외국어 표기·설명·연관어·출처·최종수정일을 전국 단위 비공간 정보로 제공한다. 식품 용기·포장 업계 종사자나 식의약 안전 정보를 다루는 개발자·분석가가 '이 표시·규격 문서에 나온 전문용어가 무슨 뜻이고 영어로는 무엇인가'를 확인하거나 용어 검색·챗봇 서비스의 사전으로 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키나 코드표가 없어, 다른 식약처 데이터와는 단어(WORD) 이름을 문자열로 맞춰 연결해야 한다.
description_portal: 용어사전(기구용기포장∙식의약품용어집)에 대한 속성정보를 제공합니다. 속성정보로는 단어 , 외국어 , 설명 , 연관어 , 출처 , 최종수정일이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
