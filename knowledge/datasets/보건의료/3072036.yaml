summary_user: 부산광역시 기장군 관내 치과기공소를 한 곳당 한 행으로 담은 소규모 현황 파일(CSV 489바이트)로, 기공소명·도로명 소재지·전화번호를 담는다. 치과의원이나 보철물 관련 사업자가 기장군 안에서 거래할 치과기공소가 어디에 몇 곳 있는지 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기공소명이나 도로명 주소를 맞춰 붙이거나, 같은 기장군 의료기관 인허가 자료와 주소 기준으로 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 2025.08.11. 기준 부산광역시 기장군 관내 치과기공소 현황에 대한 데이터(명칭, 소재지, 전화번호) 등의 항목을 제공합니다.치과기공소 현황 데이터는 치과 치료에 필요한 보철물이나 기공물을 제작하는 치과기공소에 대한 정보를 모은 공공데이터입니다.이 자료에는 치과기공소의 명칭, 소재지, 전화번호 등의 기본적인 정보를 포함되어 있습니다.이 데이터를 통해 치과기공소가 얼마나 분포되어 있는지 확인할 수 있고, 관련 산업 종사자나 의료기관, 행정기관에서 의료인프라 분석 등을 위해 활용할 수 있습니다.
