summary_user: 제주특별자치도에서 활동하는 의료인력 수를 기준 연도·분기별로 의료인력 대분류·소분류(의사, 간호사, 기타 의료직 등)에 따라 집계한 통계 파일이며, 포털 설명상 기간은 2009년 1월부터 2021년 6월까지입니다. 보건정책 담당자나 연구자가 '제주의 간호사 수가 분기마다 어떻게 늘거나 줄었나'처럼 직종별 인력 구성 변화와 지역 의료 인프라 수준을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·분기나 직종 이름을 맞춰 연결해야 하며, 같은 시기의 제주 인구 통계나 의료기관 인허가(LOCALDATA) 자료와 나란히 놓고 비교하는 방식으로 쓴다.
description_portal: 이 자료는 2009년 1월부터 2021년 6월까지 제주특별자치도 내에서 활동 중인 의료 인력의 종류별(의사, 간호사, 기타 의료직 등) 수를 분기 및 연도 단위로 집계한 통계자료로, 인력 유입과 이탈, 종별 인력 구성 변화 등을 시간 흐름에 따라 살펴볼 수 있게 구성되어 있다. 제공기관은 KOSIS 국가통계포털이며, 파일은 CSV 형식으로 공개되어 누구나 다운로드 및 분석이 가능하다. 이 데이터는 지역 의료 인프라 수준 평가, 의료 자원 배분, 보건 정책 수립, 의료 서비스 접근성 분석, 의료인력 확보 및 관리 방안 검토 등에 기초 자료로 활용할 수 있다. 또한 인구 구조 변화, 의료 수요 변화, 노인 인구 증가 등에 따른 의료 인력 수급 현황을 연구하거나, 다른 지역과의 비교 분석을 통해 제주 지역 의료 인프라의 특성 및 취약점을 검토하는 데 유용한 통계자료다.
