description_portal: '해당 데이터는 2023년 12월부터 2024년 4월까지 5개월간의 국민건강보험 가입 사업장 수 및 직장가입자 수에 대한 통계 현황을 제공합니다.□ 주요 내용 - 대상 기간: 2023년 12월 ~ 2024년 4월 (총 5개월) - 직장가입자:임의계속가입자 제외    ※ 임의계속가입자: 퇴직 후 일정 요건을 충족하여 직장가입 자격을 일정기간 유지하는 가입자□ 데이터 컬럼  - 기준년월 - 사업장수 - 직장가입자수※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
