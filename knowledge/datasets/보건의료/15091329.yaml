summary_user: 인천광역시 남동구에 있는 안과의원을 한 곳씩 담은 목록 파일로, 업체명·전화번호·소재지 주소와 데이터 기준일자를 담는다(파일 크기 약 1.4KB의 소규모 CSV). 남동구 주민이 집 근처 안과를 찾아 연락처를 확인하거나, 분석가가 구 안의 안과 분포를 주소 단위로 살펴보는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰 붙여야 하며, LOCALDATA 의료기관 인허가 자료와 이름·주소로 대조하는 방식으로 이어 쓴다.
limits: 전역 조인 키(기관 코드 등)가 없어 다른 의료기관 데이터와 정확히 연결하려면 이름·주소 매칭에 기대야 한다. 범위가 남동구 한 시군구로 한정되어 인천 전역이나 다른 구의 안과 현황은 담지 않는다.
