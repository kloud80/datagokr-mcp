summary_user: 2019년 이후 의료용 마약류(완제의약품 기준)의 연간 수출실적을 마약류 구분별로 집계해 수출업체수·수출국가수·품목수·수출수량·수출금액으로 담는 전국 단위 집계 데이터이다. 제약 수출업계나 정책 분석가가 '향정신성의약품 등 의료용 마약류 수출이 해마다 얼마나 늘거나 줄었나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 취급년월·마약류구분명 같은 이름 매핑이나 같은 식약처 마약류 통계와 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 의료용 마약류 연간 수출실적 서비스는 2019년 이후의 데이터(취급년월, 마약류구분명, 수출업체수, 수출국가수, 품목수, 수출수량, 수출금액)를 제공합니다.연도별 의료용 마약류 수출 현황을 종합적으로 제공함에 따라 의료용 마약류 수출 현황의 추이를 확인할 수 있습니다.※ 완제의약품 대상으로 산출되었습니다.※ 이 데이터는 「마약류 관리에 관한 법률」 제11조에 따른 '마약류 취급보고 제도'가 2018년 5월부터 시행됨에 따라 '마약류통합정보관리센터' 및 '마약류통합관리시스템' 운영을 통해 보고된 의료용 마약류 취급 기관, 의사 및 환자 수 등을 기반으로 집계됩니다.
