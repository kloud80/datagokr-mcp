description_portal: 금연표지판은 공공장소 및 다중이용시설에서 흡연을 예방하고 간접흡연으로부터 국민의 건강을 보호함과 동시에 관련 법령에 따른 금연구역을 명확히 안내하여 쾌적하고 안전한 환경을 조성하기 위해 설치됩니다.이 데이터는 지역 내 공원 및 주요 야외 공간에 설치된 금연표지판의 현황을 정리한 자료로, 시군명, 행정읍면동, 법정읍면동, 공원 구분 또는 표지판 고유번호, 설치장소, 지번주소, 설치일자 등의 항목으로 구성되어 있으며, 설치 위치는 주로 공원 및 녹지 지역에 분포되어 있습니다. 일부 항목은 ‘원고잔-7’, ‘전망공원-2’, ‘와동공원-3’ 등 개별 식별명을 통해 금연구역 내 세부 구역까지 명시되어 있으며, 설치일자를 통해 연식을 쉽게 파악할 수 있습니다.
