description_portal: '본 데이터는 서울특별시 중구 관내에서 인허가를 받은 산후조리업 관련 시설의 정보를 수록한 자료입니다. 수록 항목에는 업체명, 대표자, 소재지, 인허가일자, 허가상태, 시설유형, 관리기관 등으로 구성되어 있으며, 지역 내 산모와 신생아를 위한 보건서비스 제공 현황을 파악하는 데 활용됩니다. 해당 자료는 「모자보건법」 등 관련 법령에 따라 허가를 받은 시설을 기준으로 하며, 산후조리업 운영의 적정성과 안전성을 확보하기 위한 행정 기반자료로 제공됩니다. 일반 시민은 시설의 위치 및 인허가 여부 등을 확인할 수 있고, 보건행정기관은 서비스 질 관리, 정책 수립 및 점검 업무에 본 데이터를 참고할 수 있습니다. 데이터는 표준화된 구조로 제공되어 다양한 통계 분석, 정보 활용 및 행정 연계 서비스 개발에 재사용이 가능합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
