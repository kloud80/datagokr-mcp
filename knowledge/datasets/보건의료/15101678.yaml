summary_user: 2020년 1월~2021년 12월 요양급여비용 명세서 가운데 일반·특수 전기충격요법(행위코드 NN071·NN072)이 청구된 환자 중, 경도우울에피소드(F32)·재발성 우울장애(F33)를 주상병으로 진료받은 전국 환자 수를 상병코드·행위코드별로 집계한 통계 파일입니다. 우울증 환자에게 전기충격요법이 얼마나 쓰였는지 규모를 확인하려는 연구자·정책 분석가가 '2020~2021년 우울장애로 전기충격요법을 받은 환자는 몇 명인가' 같은 질문에 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상병코드(KCD)나 행위코드 이름·코드 매핑으로만 연결합니다.
description_portal: 해당 데이터는 2020.1.~2021.12. 기간 내, NN071(일반전기충격요법) 및 NN072(특수전기충격요법)이 청구된 요양급여비용 명세서 기준 환자 중, 상병코드 F32(경도우울에피소드) 및 F33(재발성 우울장애)를 주상병으로 진료받은 환자 수에 대한 통계입니다.※ 요청 상병 코드, 행위코드별 진료인원 수 입니다. 해당 데이터는 공공데이터 포털 신청자가 요청한 레이아웃에 맞게 업데이트 합니다. 1. 개인정보보호법에 따라, 5이하의 환자수는 5(csv)또는 *(excel)로 비식별 처리함.2. 신청자 요청에 따라, 여러 레이아웃을 제공하기 위해 엑셀 파일로 제공함.※ 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고※ 일부 질병코드의 경우 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라 일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를수 있습니다. 한의분류 및 약국 청구분은 제외 되었습니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.
