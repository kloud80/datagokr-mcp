description_portal: '○ 통계개요* 통계명 : 의약품 제조 및 판매업 현황(동별)* 통계종류 : 서울시 의약품 제조 및 판매업 현황을 각 자치구 동단위로 제공하는 일반·조사 통계* 작성목적 : 국민의 건강과 밀접한 관련이 있는 의약품 제조 및 판매에 관한 실태를 파악하여, 보건정책 수립 및 추진에 기초자료로 활용할 수 있도록 제공하는 것을목적으로 함* 조사체계 : 해당기관 → 자치구 → 서울시 보건정책과, 식품의약품안전처* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구ㆍ행정동내용 - 서울시 각 자치구 동별 의약품 제조업소(의약품, 의약외품, 의료기기,화장품) 및 판매업소(약국, 한약국, 약업사,의약품도매상, 한약도매상등) 개소수○ 용어설명○ 기 타* 약국은 약국과 한약국, 도매상은 의약품도매상과 한약도매상, 의료기기는 판매업과임대업으로 유형 세분화함* 의약외품에 의약품위탁제조판매업소(2개소) 포함'
