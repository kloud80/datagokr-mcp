description_portal: 식품의약품안전처 「의약품 국내 특허현황」 OpenAPI는 국내에서 등록된 의약품 특허의 기본 정보를 제공하는 공공데이터입니다. 제공 항목에는 품목일련번호, 제품명, 주성분명(국문 및 영문), 특허권 등재자, 등재 특허권자, 등재일자, 특허번호 등이 포함되어 있습니다. 이 데이터를 통해 제약사와 연구기관은 국내 의약품의 특허 등재 현황을 확인하여 연구·개발 과정에서 참고할 수 있으며, 정책 관련 기관 및 담당자는 특허 제도 운영과 산업 관리 현황을 검토하는 등의 기초 자료로 활용할 수 있습니다.
