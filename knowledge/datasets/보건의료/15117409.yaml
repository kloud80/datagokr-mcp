summary_user: 국내에 등재된 의약품 특허를 품목 단위로 담은 건별 원천 데이터로, 품목일련번호·제품명·국문/영문 주성분명·특허권 등재자·등재 특허권자·등재일자·특허번호를 전국 범위로 제공한다. 제약사나 연구기관이 '이 성분의 오리지널 의약품에 어떤 특허가 언제 등재됐고 특허권자는 누구인가'를 확인해 제네릭 개발 시점을 검토할 때 쓴다. 실측상 전역 조인 키는 확인되지 않아, 식약처 의약품 허가정보 등과는 품목일련번호(PTNT_PRDLST_CRTR_CD)나 제품명·주성분명을 이름 매핑해 연결해야 한다.
limits: 다른 데이터와 바로 붙는 공통 조인 키가 실측에서 확인되지 않아 제품명·성분명 매칭이나 식약처 내부 코드로만 연결된다. 공간 정보 없이 전국 단위로만 제공되며, 개발계정은 일 10,000회 호출 제한이 있다.
