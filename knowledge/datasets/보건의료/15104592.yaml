description_portal: 강원특별자치도 홍천군의 2025년 03월 14일 기준으로 작성된 요양병원 정보입니다. 각 구성 항목으로는 요양기관명, 소재지도로명주소, 소재지지번주소, 위도, 경도, 설립연월, 의사인원수, 간호사인원수, 사회복지사인원수, 기타인원현황, 운영기관대표자명, 운영기관전화번호, 관리기관전화번호, 관리기관명, 데이터기준일자로 구성되어 있습니다. 요양 기관명 항목은 연호요양병원이고 설립연월은 날짜형식으로 나타나 있습니다. 관리기관명 항목은 홍천군보건소이고 데이터기준일자는 2025-03-14입니다. 의사인원수 항목은 4이고 간호사인원수 항목은 22로 나타나 있습니다.
