summary_user: 식약처가 허가한 의약품을 품목 단위로 담는 API로, 품목명·주성분·업체·허가일자·허가번호·취하 여부 등을 제공하며 전체 42,707건, 전국 범위다. 약사나 분석가가 특정 성분의 의약품이 언제 누가 허가받았는지, 전문의약품인지 일반의약품인지 확인하는 질문에 쓴다. 사업자등록번호(BIZRNO, 조인 키 bizno)로 업체 정보와 잇고, 품목기준코드(ITEM_SEQ)와 보험코드(EDI_CODE)로 심평원 약가·급여 목록이나 DUR 같은 안전 정보와 연결한다.
description_portal: 식품의약품안전처에서 관리하는 의약품 품목, 주성분, 제조원, 포장단위, 저장방법, 성상등의 품목정보와 허가일자, 허가번호, 허가정보, 희귀의약품 여부 등의 허가받은 의약제품정보를 조회
