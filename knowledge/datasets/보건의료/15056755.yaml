summary_user: 경기도 내 요양병원별로 건강보험심사평가원의 평가내역과 평가등급(1~5등급, 숫자가 낮을수록 우수)을 담고, 시군·병원명·도로명/지번 주소·우편번호·위경도 좌표를 함께 제공한다. 보호자나 노인복지 담당자가 '우리 시군에서 평가등급이 좋은 요양병원은 어디인가'를 확인하거나, 분석가가 요양병원 질 수준의 지역 편차를 볼 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)나 병원명·주소 매칭, 위경도 기반 공간 결합으로 이어 쓴다.
description_portal: 병원평가정보(요양병원) 현황은 건강보험심사평가원이 제공하는 경기도 내 요양병원에 대한 평가 데이터로, 중풍, 치매 등 노인성 질환 및 만성질환 환자에게 입원 치료를 제공하는 기관의 구조적 특성과 진료 서비스 수준을 종합적으로 평가한 결과를 담고 있습니다. 평가등급(GRAD)은 1~5등급으로 구분되며, 낮은 숫자가 우수한 평가를 의미합니다. 주요 항목은 시군명(SIGUN_NM, SIGUN_CD), 병원명(INST_NM), 평가내역(DIV_NM), 주소정보(REFINE_ROADNM_ADDR, REFINE_LOTNO_ADDR, REFINE_ZIP_CD)와 GPS 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT) 등을 포함합니다. 평가결과는 구조부문과 진료부문을 통합한 종합 점수를 기반으로 하며, 진료부문 지표가 8개 미만이거나 입원료 차등제를 미신고한 경우 등급 제외됩니다. 본 데이터는 요양병원 간 의료서비스 질 비교, 의료취약지역 분석, 노인복지정책 설계 등 다양한 용도로 활용 가능하며, 등급 해석 시 평가제외 사유를 함께 고려해야 합니다.
