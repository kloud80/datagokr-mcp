description_portal: '1. 산출기준(신규등록) 각 연도별 산정특례 신규등록자 수(연도말 적용) 각 연도말 기준 산정특례 적용자 수2. 연도: 2015년~2023년(9년) 전산자료 보존 기간 10년으로, 2015년 등록 및 적용자료부터 제공3. 질환구분* 보건복지부 고시 「본인일부부담금 산정특례에 관한 기준」 (이하, ‘고시’) 에 해당하는 질환자가 공단의 산정특례 등록기준 및 필수검사항목에 따라 의료진이 진단확진 및 본인(또는 가족)이 신청한 경우 등록 가능- 중증화상: 고시 [별표 3] 중증질환자 산정특례 대상질환 구분4- 중증치매(V800): 고시 [별표4의2] 중증난치질환자 산정특례 대상질환 구분6 (2017.10.1. 시행)- 중증치매(V810): 고시 [별표4의2] 중증난치질환자 산정특례 대상질환 구분7 (2017.10.1. 시행)- 희귀질환: 고시 [별표4] 희귀질환자 산정특례 대상 질환(극희귀질환·기타염색체이상질환·상세불명희귀질환 포함)- 중증난치질환: 고시 [별표4의2] 중증난치질환자 산정특례 대상질환 구분 1~5※ 「희귀질환관리법」에 따라 2019.1.1.부터 희귀난치성 → 희귀질환/중증난치질환으로 분리, 이전 연도에 대하여는 분리된 질환구분 기준으로 작성- 결핵(V000): 고시 [별표5] 시행령 별표2 제3호 가목 3)에 따른 결핵질환의 적용 범위의 결핵질환 (본인부담이 면제되는 결핵질환, 2016.7.1. 시행)- 암: 고시 [별표 3] 중증질환자 산정특례 대상 의 구분1에 해당하는 경우- 신규암: 신청 당시 암 산정특례 등록 이력이 없는 경우- 중복암: 암 산정특례 적용기간 중 기 등록한 암과 다른 암종이 추가로 발생(전이암 제외)한 경우 (2017.7.1. 시행)※ ‘암’은 연도말 적용 시 구분, ‘신규암’ 및 ‘중복암’ 은 신규 등록 시 구분4. 성별: 남, 여5. 연령: 0세, 1~4세, 5세부터는 5세 단위 구분6. 건수: 등록건수 및 적용건수'
