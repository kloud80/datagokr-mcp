description_portal: 이 데이터는 제주보건소 관할 내 제주특별자치도 제주시 소독의무대상 시설 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 제주보건소이며, 감염병 예방과 공중위생 관리를 위해 소독 의무가 적용되는 시설의 현황을 파악할 수 있도록 구성되어 있습니다.데이터 항목은 시설구분, 업소명, 주소로 이루어져 있습니다. 시설구분 항목에는 소독의무 대상이 되는 시설의 유형이 구분되어 있으며, 여기에는 숙박업소, 관광숙박업소, 식품접객업소, 공항시설, 시내버스, 마을버스, 전세버스, 장의자동차, 대형마트, 대규모점포, 전통시장, 종합병원, 병원, 요양병원, 정신병원, 한방병원, 집단급식소, 위탁급식, 기숙사, 공연장, 학교, 사무실용 건축물, 복합용도 건축물, 어린이집, 유치원, 공동주택 등이 포함됩니다.업소명 항목에서는 해당 시설 또는 사업장의 명칭을 확인할 수 있으며, 주소 항목을 통해 각 시설의 위치를 파악할 수 있습니다. 이를 통해 제주시 내 소독의무대상 시설의 분포와 현황을 보다 체계적으로 확인할 수 있습니다.이 데이터는 공중위생 및 감염병 예방 관련 행정업무의 기초자료로 활용될 수 있으며, 소독 대상 시설 관리, 지역 보건환경 점검, 시설 유형별 현황 파악, 생활환경 안전정보 제공 등 다양한 목적으로 활용할 수 있습니다.
