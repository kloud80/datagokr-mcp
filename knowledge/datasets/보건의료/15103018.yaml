description_portal: 국민건강보험공단_건강보험통계연보□ 개요국민건강보험공단에서 매년 발간하는 「건강보험통계연보」는 건강보험 제도 운영 전반에 대한 통계자료를 집대성한 연간보고서입니다. 본 연보는 건강보험 적용 인구, 재정, 보험료 부과 및 징수, 진료비, 급여현황 등 공단의 주요 정책 및 제도 운영성과를 수록하고 있으며, 공단 대표 홈페이지를 통해 누구나 열람할 수 있도록 공개되어 있습니다.· 활용방식해당 데이터는 국민건강보험공단 대표홈페이지 내 게시된 건강보험통계연보의 온라인 링크를 통해 열람하거나, 필요한 경우 직접 다운로드하여 통계분석 등에 활용할 수 있도록 제공됩니다.
