description_portal: 본 데이터는 공중위생서비스 평가에서 최우수 등급을 받은 업소의 현황 정보이다. 업소별 명칭, 소재지, 업종 내용을 포함한다. 공중위생서비스 평가는 숙박업, 목욕장업, 이용업, 미용업 등 공중위생업소의 위생 관리 수준을 평가하여 등급을 부여하는 제도이다. 해당 자료는 공중위생 관리 정책 수립, 우수 업소 홍보, 위생 수준 향상 유도에 활용된다. 최우수 업소 정보 공개를 통해 시민들이 위생적이고 안전한 업소를 선택할 수 있도록 지원한다. 또한 업소의 자발적인 위생 관리 개선을 유도하고 공중위생 업계 전체의 서비스 품질 향상을 도모한다. 우수 업소에 대한 인센티브 제공 및 홍보 지원 정책에도 활용된다.
