description_portal: 대구광역시 서구 관내 공중위생업소(이·미용업)의 위생서비스평가등급현황에 대한 데이터(업종,업소명,소재지,소재지전화,평가구분)로써 전반적인 위생관리수준을 2년마다 평가하며 이에 따라 최우수(녹색등급), 우수(황색등급), 일반관리대상(백색등급)으로 등급을 구분합니다.본 데이터는 대구광역시 서구 관내 이용업, 네일미용업, 미용업, 일반미용업, 피부미용업, 화장·분장 미용업 등 다양한 이미용업종에 대한 영업소명, 주소, 연락처, 그리고 공중위생관리 등급을 포함하고 있다. 등급은 녹색(최우수), 황색(우수), 백색(일반)으로 구분되어 있으며, 각 업소별 위생관리 수준을 한눈에 파악할 수 있도록 구성하였다. 해당 정보는 시민들의 위생 안전 확보와 위생 상태에 대한 신뢰도 향상을 목적으로 하며, 행정기관의 관리 및 지도에도 활용된다.
