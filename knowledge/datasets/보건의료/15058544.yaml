summary_user: 경기도 내 의료기관별 수술 시 예방적 항생제 사용 적정성 평가 결과를 기관 한 곳당 평가내역과 평가등급(GRAD), 시군명·주소·위경도와 함께 담은 목록이다. 환자나 가족이 수술 받을 병원을 고를 때 우리 시군 병원의 항생제 평가 등급을 확인하거나, 분석가가 시군별 등급 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군코드·시군명으로 행정구역 자료와, 기관명·주소·좌표로 의료기관 인허가(LOCALDATA) 같은 다른 병원 목록과 이름·위치를 맞춰 연결한다.
description_portal: 이 데이터는 건강보험심사평가원에서 제공하는 수술 시 예방적 항생제 사용에 대한 병원평가 정보를 포함하고 있습니다. 수술부위 감염을 예방하기 위해 투여되는 항생제의 사용 적정성을 평가하며, 각 의료기관의 항생제 사용률을 기준으로 5개 등급으로 분류합니다. 1등급은 90점 이상, 5등급은 30점 미만이며, 점수가 낮을수록 항생제를 적절히 사용한 기관으로 간주됩니다. 등급 산정 제외는 평가지표 건수가 5건 미만일 경우 해당됩니다.제공 항목으로는 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 기관명(INST_NM), 평가내역(DIV_NM), 평가등급(GRAD), 소재지 정보(도로명주소, 지번주소, 우편번호), 위치좌표(WGS84 위도·경도) 등이 포함됩니다.이 자료는 외과계 병원들의 항생제 사용 패턴 분석, 환자 감염 예방 정책 수립, 병원 선택 정보 제공, 건강보험 재정 효율화 등 다양한 보건의료 분석에 활용될 수 있으며, API로도 제공되어 시스템 연계 및 자동화된 분석도 가능합니다.
