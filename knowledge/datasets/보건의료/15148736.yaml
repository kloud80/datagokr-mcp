description_portal: 본 데이터는 「마약류 관리에 관한 법률」 제2조(정의) 및 같은 법 시행령 [별표 1]~[별표 8]에서 규정한 마약, 향정신성의약품, 대마, 원료물질의 법적 분류 체계를 기반으로 구축되었습니다.자료는 법령에 규정된 목록을 우리 홈페이지에서 체계적으로 정리·등록한 것으로, 최신 법령 개정 사항을 반영하지 않습니다.데이터에는 마약구분, 마약상세구분, 마약한글명, 마약영문명, 마약분류명, 마약종류명, 효과내용, 조회수 등이 포함되어 있으며, 이를 통해 마약류의 기본 정보와 특성을 한눈에 확인할 수 있습니다.본 데이터는 마약류 정책 수립, 법 집행, 학술 연구, 대국민 홍보 및 교육 자료 등 다양한 분야에서 활용이 기대됩니다.- 본 데이터는 우리 홈페이지에 게재된 자료를 기준으로 하며, 법률 개정 등으로 내용이 변경될 수 있으니 자세한 내용과 최신 현황은 「마약류 관리에 관한 법률」 및 해당 시행령을 반드시 확인하시기 바랍니다.- 데이터 건수가 많아 일반 문서 편집기에서는 일부 항목만 표시될 수 있으므로, 분석 전용 소프트웨어 사용을 권장합니다.- 본 데이터는 참고용으로 활용하시고, 보다 자세하고 정확한 내용은 식품의약품안전처의 마약정보데이터베이스(https://www.nifds.go.kr/toxinfo/kind/)를 참고하시기 바랍니다.
