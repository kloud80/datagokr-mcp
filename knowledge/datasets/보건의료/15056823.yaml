summary_user: 경기도에서 야생동물을 구조·치료하는 기관을 기관 한 곳당 한 행으로 담은 현황 목록이며, 시군명, 기관명, 전화번호, 지번·도로명 주소, 우편번호, 위경도 좌표를 포함한다. 다친 야생동물을 발견한 주민이 "우리 시군에서 가장 가까운 구조기관은 어디이고 연락처는 무엇인가"를 찾는 데 쓰고, 지역별 구조기관 분포를 보는 정책 담당자도 쓴다. 전역 조인 키는 없어서, 시군 코드(SIGUN_CD)나 시군명으로 경기도 다른 시군 단위 데이터와 맞추거나 위경도 좌표로 지도·GIS 자료와 겹쳐 쓴다.
description_portal: 경기도에서 야생동물을 구조치료하는 기관 현황입니다. 구조기관명, 구조기관전화번호, 소재지주소(도로명, 지번) 등의 정보를 제공합니다.이 데이터는 대한민국 내 야생동물 구조 및 치료를 수행하는 기관들의 현황 정보를 담고 있습니다. 각 기관이 위치한 시군명, 구조기관명, 구조기관 전화번호, 우편번호, 지번 주소, 도로명 주소, 위도 및 경도 좌표 등 총 8개의 주요 항목으로 구성되어 있으며, 이를 통해 각 지역 내 구조기관의 분포 및 접근성을 파악할 수 있습니다. 특히 도로명주소와 위경도 정보를 활용하여 위치기반 서비스 구축이나 GIS 시스템 연계에 유용하게 활용될 수 있으며, 야생동물 보호정책 수립, 구조기관 간 네트워크 형성 및 협력 방안 마련 등의 정책 기획에도 기초자료로 사용될 수 있습니다. 또한 구조기관의 실제 위치와 연락처 정보가 포함되어 있어, 민간인이 야생동물을 발견했을 때 신속한 연락 및 구조 요청이 가능하도록 지원합니다.
