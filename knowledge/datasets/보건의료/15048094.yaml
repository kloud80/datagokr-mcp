summary_user: 부산광역시 연제구 관내에 신고된 의료기기 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 영업소명·도로명 소재지·우편번호를 담는다. 연제구에서 의료기기를 사려는 주민이나 관내 의료기기 판매업 현황을 보려는 사업자·분석가가 '우리 동네 어디에 의료기기 판매점이 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 도로명 주소나 우편번호를 기준으로 주소·좌표 데이터나 다른 구의 같은 현황 파일과 맞춰 이어 쓴다.
description_portal: '연제구 관내 의료기기판매업소에 관한 데이터로서, 업소명칭, 사업장소재지(도로명), 우편번호 등 정보가 제공되는 데이터 입니다.의료기기법 제17조(판매업 등의 신고), 같은 법 시행규칙 제37조(판매업 또는 임대업의 신고 등)에 의거하여 신고된 의료기기 판매업소 정보입니다.각 항목별 설명으로는 다음과 같습니다.- 상호: 상호명을 나타냅니다- 사업소주소: 사업소의 주소를 나타냅니다의료기기법 제17조(판매업 등의 신고)① 의료기기의 판매를 업으로 하려는 자(이하 “판매업자”라 한다) 또는 임대를 업으로 하려는 자(이하 “임대업자”라 한다)는 영업소마다 총리령으로 정하는 바에 따라 영업소 소재지의 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)에게 판매업신고 또는 임대업신고를 하여야 한다.② 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따른 신고를 하지 아니할 수 있다. 1. 의료기기의 제조업자나 수입업자가 그 제조하거나 수입한 의료기기를 의료기기취급자에게 판매하거나 임대하는 경우2. 제1항에 따른 판매업신고를 한 자가 임대업을 하는 경우3. 약국 개설자나 의약품 도매상이 의료기기를 판매하거나 임대하는 경우4. 총리령으로 정하는 임신조절용 의료기기 및 의료기관 외의 장소에서 사용되는 자가진단용 의료기기를 판매하는 경우③ 제1항에 따른 신고에 대하여는 제6조제1항제2호ㆍ제4호ㆍ제4호의2ㆍ제5호, 제12조 및 제14조제1항을 준용한다. 이 경우 “제조”는 “판매 또는 임대”로, “제조업허가”는 “판매업신고 또는 임대업신고”로, “제조업자”는 “판매업자 또는 임대업자”로 각각 본다.④ 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장은 제1항에 따른 판매업신고 또는 임대업신고를 받거나 제3항에 따른 폐업신고 또는 휴업신고를 받은 날부터 3일 이내에 신고수리  여부를 신고인에게 통지하여야 한다.'
