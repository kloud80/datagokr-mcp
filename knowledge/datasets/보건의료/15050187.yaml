description_portal: 음주폐해예방 관련 지표- 세계보건기구(WHO) 알코올 정보 시스템(GISAH)을 바탕으로, 만 15세 이상 인구의 1인당 알코올 총 소비량을 산출한 값입니다. - 공식적으로 집계된 소비량뿐만 아니라 비공식 경로를 통해 소비된 알코올, 그리고 관광객에 의한 소비량을 3개년 평균치로 합산 및 보정하여 계산된 값으로 단위는 리터(ℓ)이며, 국가별·연도별 비교가 가능합니다.- 데이터는 총 36개국의 소비량으로 구성되어있으며, 데이터 연도 범위는 2013년~2022년입니다. - 본데이터는 음주폐해예방 및 절주문화 확산을 위한 국가간 비교 연구의 기초자료로 활용될 수 있습니다.
