description_portal: '□ 데이터 개요본 데이터는 국민건강보험 가입자 및 의료급여 수급권자를 대상으로 지역별 질병에 따른 항생제 처방률을 집계한 자료입니다. 각 지역에서 항생제 처방 건수가 전체 처방 건수에서 차지하는 비율을 산출하여 제공하고 있습니다.□ 주요 내용대상: 국민건강보험 가입자 및 의료급여 수급권자산출 기간: 해당 연도 기준산출 방법:분자: 항생제 처방 건수분모: 전체 처방 건수데이터 항목: 지역별 처방 건수, 항생제 종류별 처방 건수, 처방률 등□ 활용 안내본 데이터는 지역별 항생제 사용 현황을 파악하고, 항생제 남용 방지 및 적정 사용 정책 수립에 활용할 수 있습니다.'
