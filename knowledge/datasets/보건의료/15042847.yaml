summary_user: 국민건강보험 가입자와 의료급여 수급권자의 처방을 전국 시군구 단위로 연도별 집계해, 전체 처방 건수(분모)와 항생제 처방 건수(분자), 항생제 처방률을 담은 집계 자료입니다. 보건정책 분석가나 지자체 담당자가 "우리 시군구의 항생제 처방률이 다른 지역보다 높은가"를 확인하고 항생제 적정 사용 정책 대상 지역을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름을 행정구역 코드로 매핑하거나 같은 공단의 지역별 진료·처방 통계와 이름으로 맞춰 이어 쓴다.
limits: 행정구역 코드 같은 공통 조인 키가 없어 시군구 이름 매핑이 필요하고, 행정구역 개편 시 이름 불일치에 주의해야 한다. 공단 자료는 자격 기준이라 청구 기준인 심평원 통계와 값이 다를 수 있다.
