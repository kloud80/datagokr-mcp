summary_user: 재발급(대체교부)된 의료기기 GMP 적합인정서를 건별로 담으며, 업소명·업종·주소, 제조자·제조의뢰자, 심사구분·종류·적용기준, 발급사유, 적합인정번호·인정일, 유효기간, 심사청, 대체교부일자를 전국 범위로 제공한다. 의료기기 제조·수입업체나 거래처를 검토하는 사업자가 '이 업체의 GMP 적합인정서가 왜 재발급됐고 지금도 유효기간 안에 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 사업자등록번호(BRNO)나 적합인정번호·업소명 매핑으로 다른 식약처 의료기기 데이터와 맞춰 써야 한다.
description_portal: 이  공공데이터는 재발급된 의료기기 GMP 적합인정서 데이터를 체계적으로 제공하고 있습니다. - 이 공공데이터의 세부 항목으로는 업소명·업종·대표자명·주소·우편번호, 제조자명 및 주소, 제조의뢰자명, 심사구분·종류·적용기준, 발급사유 및 세부내용, 적합인정일·번호, 유효기간, 심사청, 재발급일자 등이 포함됩니다.- 이 공공데이터를 통해 사용자는 제조·수입업체는 재발급된 적합인정서의 승인 배경과 유효성 정보를 즉시 확인할 수 있으며, 품질관리 위험 파악, 사실관계 확인 등 다양한 활용이 기대됩니다.
