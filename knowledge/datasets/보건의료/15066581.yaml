summary_user: 인천 영종구(구 중구) 관내 의약품 도매상을 영업소 한 곳당 한 행으로 담은 시군구 단위 파일로, 업종·영업소명·도로명 소재지·전화번호·데이터기준일자를 담는다(파일 크기 263바이트로 소수 업체 목록). 약국·의료기관이나 사업자가 '우리 지역에서 의약품을 받을 수 있는 도매상이 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소명이나 주소를 기준으로 맞춰 이어 써야 한다.
limits: 식약처 품목코드나 사업자 식별 코드가 없어 의약품 허가·약가 데이터와 직접 연결되지 않고, 영업소명·주소 매칭에 의존해야 한다. 범위가 한 시군구 관내로 한정돼 광역·전국 도매상 분포 분석에는 다른 지자체 자료를 모아야 한다.
