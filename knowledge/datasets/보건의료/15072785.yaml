summary_user: 희귀질환 상병코드별로 진료년도 단위 환자수·명세서 청구건수·입내원일수·요양급여비용총액·보험자부담금을 담은 전국 단위 건강보험 진료비 집계 파일이다. 특정 희귀질환에 해마다 환자가 몇 명이고 건강보험 진료비가 얼마나 드는지를 알고 싶은 분석가·환자단체·정책 담당자가 쓴다. 전역 조인 키는 없어서, 희귀질환 상병코드(KCD)를 매개로 같은 기관의 다른 질병별 진료 통계나 상병코드 이름표와 맞춰 이어 쓴다.
description_portal: '희귀질환 건강보험 진료비 통계 / 진료년도 기준(심사분은 각 진료년+4개월) (예) 진료년월: 2022년 1월~12월, 심사년월: 2022년 1월~2023년 4월 / 보험자: 건강보험 / 요양기관 종별: 약국 제외 / 양방만 포함※ 해당 통계는 요양기관에서 청구한 요양급여비용 명세서에 대해 심사 결정한 내용을 기준으로 산출됨※ 질병은 주상병 기준이며 의료기관에서 의사가 진료 시 환자의 호소, 증세에 따라 일차적으로 진단명을 부여하여 진료비 청구가 이루어짐에 따라 실제 최종 확정된 질병과는 차이가 발생할 수 있음※ 요양급여비용총액은 요양기관에서 건강보험 환자의 진료에 소요된 비용(비급여 제외)으로 보험자부담금과 본인부담금을 합한 금액임※ 환자수는 범주 내 동일인의 중복을 제거한 값이지만, 다른 범주와 단순합산할 경우 중복이 발생할 수 있음※ 상병코드가 있는 희귀질환 대상으로 작성되었으며, 산출기준은 유의사항 및 ‘첨부자료’ 참고'
