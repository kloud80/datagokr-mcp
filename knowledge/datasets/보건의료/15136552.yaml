description_portal: 의료용 마약류 연간 수입실적 서비스는 2019년 이후의 데이터(취급년월, 마약류구분명, 수입업체수, 수입국가수, 품목수, 수입수량, 수입금액)를 제공합니다.연도별 의료용 마약류 수입 현황을 종합적으로 제공함에 따라 의료용 마약류 수입 현황의 추이를 확인할 수 있습니다.※ 완제의약품 대상으로 산출되었습니다.※ 이 데이터는 「마약류 관리에 관한 법률」 제11조에 따른 '마약류 취급보고 제도'가 2018년 5월부터 시행됨에 따라 '마약류통합정보관리센터' 및 '마약류통합관리시스템' 운영을 통해 보고된 의료용 마약류 취급 기관, 의사 및 환자 수 등을 기반으로 집계됩니다.
