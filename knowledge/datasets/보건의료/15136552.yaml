summary_user: 2019년 이후 의료용 마약류(완제의약품 기준)의 수입 현황을 취급년월과 마약류 구분별로 집계해 수입업체 수, 수입국가 수, 품목 수, 수입수량, 수입금액을 담은 전국 단위 집계 데이터다. 정책 분석가나 제약·유통 사업자가 "마약·향정신성의약품 등 구분별 수입 규모와 수입 금액이 해마다 어떻게 변하는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 마약류 구분명이나 취급년월을 이름·시점 기준으로 맞춰 이어 써야 하며, 식약처 품목기준코드 같은 품목 단위 키로는 연결되지 않는다.
limits: 품목·업체·국가별 내역이 없는 전국 집계라 개별 의약품이나 수입국, 지역별 현황은 볼 수 없다. 전역 조인 키가 없어 심평원 약가·급여 목록 등 품목코드 기반 데이터와 직접 연결할 수 없다.
