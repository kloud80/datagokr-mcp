summary_user: 식약처가 허가한 의료기기 품목의 원자재(원재료) 이름과 코드를 담은 표준 코드 목록으로, 원자재 코드·명칭과 상위 원자재 코드, 대표 여부를 행 단위로 제공하며 범위는 전국·비공간이다. 의료기기 품목허가를 준비하는 제조·수입 사업자가 '이 원재료를 허가 신청서에 어떤 표준 명칭과 코드로 적어야 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 원자재 이름·코드 매핑이나 같은 식약처 의료기기 데이터의 코드로만 이어 쓰며, 상위 원자재 코드(UPR_CMDT_CD)로 목록 안의 계층을 따라갈 수 있다.
description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 제공하는 의료기기 원자재(원재료) 관한 공공데이터입니다. 이 공공데이터는 식품의약품안전처에서 허가 받은 의료기기 품목의 원자재(원재료) 및 관련 코드를 한눈에 파악할 수 있습니다.의료기기 원자재(원재료)는 의료기기 품목 허가 받을 시 반드시 작성해야하는 항목 중 하나입니다.  원자재(원재료) 항목 작성에 관한 자세한 내용은 확인하고 싶다면 의료기기 허가·신고·심사 등에 관한 규정 제10조(원재료)를 참고하시면 도움을 받으실 수 있습니다.
