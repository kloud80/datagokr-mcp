summary_user: 서울특별시 중구 안 병원의 인허가 내역을 사업장 한 곳당 한 건으로 담은 원천 데이터로, 사업장명·인허가일·영업상태·폐업일·지번/도로명 주소·중부원점TM 좌표·병상 수·진료과목 등을 포함합니다. 중구에서 최근 새로 문을 열거나 폐업한 병원이 어디인지, 진료과목별 병원 분포가 어떤지 확인하려는 주민·의료 서비스 기획자·상권 분석가가 씁니다. 실측 컬럼에 전역 조인 키는 없으므로, 다른 자치구 병원 인허가 데이터나 의원·치과·약국 인허가 자료와는 같은 형식의 관리번호(MGTNO)·사업장명·주소를 맞춰 붙여 씁니다.
description_portal: '서울특별시 중구의 병원 인허가 정보는 해당 지역 내 의료기관의 설립 및 운영에 필요한 행정 절차와 관련된 데이터를 포함합니다. 병원의 명칭, 소재지, 인허가 일자, 병상 수, 진료 과목 등 다양한 항목으로 구성되어 있으며, 이를 통해 지역 의료 인프라의 현황을 파악할 수 있습니다. 또한 신규 병원 개설 동향이나 기존 병원의 운영 변화를 분석하는 데 활용됩니다. 행정기관, 연구자, 의료 서비스 기획자 등 다양한 분야의 관계자들이 정책 수립 및 서비스 개선을 위한 기초 자료로 활용할 수 있으며, 공공 보건 향상을 위한 전략 수립에도 기여합니다. 데이터는 정기적으로 갱신되며, 정확성과 신뢰성을 확보하기 위해 관련 법령에 따라 관리됩니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
