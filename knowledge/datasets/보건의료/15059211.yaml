summary_user: 경기도 내 의원급 조산원을 사업장 한 곳당 한 행으로 담은 인허가 원천 자료로, 시군명·인허가일자·영업상태와 폐업일자·병상 수·입원실 수·의료인 수·진료과목·면적·주소와 위경도 좌표를 포함한다. 임산부나 보건 행정 담당자가 '우리 시군에 운영 중인 조산원이 있는가, 병상 대비 의료인력은 충분한가'를 확인하거나, 분석가가 병의원 개폐업 흐름을 지역 신호로 볼 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 인허가 데이터, 지역 출생·인구 통계와 이름·위치 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 의원급 조산원 현황을 보여주는 자료입니다. 조산원은 30병상 미만 규모로 운영되며, 임산부의 출산과 산후관리, 신생아 돌봄을 제공하는 의료기관입니다.데이터에는시군명 및 사업장명인허가일자와 영업상태(운영/폐업)병상수, 입원실 수, 의료인 수진료과목 및 시설 면적소재지 주소 및 위경도 좌표등이 포함되어 있습니다.이 데이터를 활용하면 경기도 내 출산 환경 현황을 파악할 수 있습니다. 예를 들어, 특정 시군에서 조산원이 부족하다면 임산부가 인근 대도시로 이동해 출산해야 하는 불편이 생길 수 있습니다. 반대로 조산원이 다수 분포된 지역은 산부인과 접근성이 높아 안전한 분만 환경이 마련되어 있다고 볼 수 있습니다.또한 병상 수와 의료인 수를 비교하면 시설 규모 대비 의료인력 적정성을 평가할 수 있습니다. 이를 통해 지역 간 출산 인프라 격차 해소 정책, 공공 산후돌봄 서비스 확대 등 보건복지 행정에 활용할 수 있습니다.
