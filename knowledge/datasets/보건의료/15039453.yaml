description_portal: '세종특별자치시시설관리공단은 시민들이 합리적이고 투명하게 장례 서비스를 이용할 수 있도록, 은하수공원에서 제공하는 장례용품 가격정보 데이터를 공개하고 있습니다.이 데이터에는 장례 절차에 필요한 다양한 물품이 포함되어 있으며, 크게 수의류, 부속류, 목관류 등으로 구분됩니다.데이터는 다음과 같은 항목으로 구성됩니다.품명: 장례용품의 기본 분류(예: 수의류, 목관류 등)상세품명: 해당 품목의 구체적인 이름(예: 양초(대), 멧베, 한지 등)규격: 크기·재질 등 물품의 세부 사양단위: 판매 기준 단위(예: 세트, 개, 장 등)금액: 실제 판매 또는 제공되는 가격이 데이터를 통해 시민은 장례용품의 종류·규격·가격을 사전에 확인할 수 있으며, 예산과 상황에 맞게 합리적으로 선택할 수 있습니다. 또한 공단은 가격 정보를 투명하게 공개함으로써 불필요한 비용 부담을 예방하고, 시민이 신뢰할 수 있는 장례 서비스를 제공합니다.세종특별자치시시설관리공단은 앞으로도 장례 서비스의 공공성을 강화하고, 시민의 부담을 덜 수 있도록 가격정보를 지속적으로 갱신·관리하겠습니다.'
