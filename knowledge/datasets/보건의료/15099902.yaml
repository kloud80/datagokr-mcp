description_portal: 경상남도 양산시 소독업소 현황 데이터는 양산시 관내에서 소독업을 하는 업소의 기본 정보를 체계적으로 정리한 공공데이터입니다. 주요 항목은 소독업소명, 사무실 소재지(주소), 전화번호 등으로, 시민이 생활권 내 소독 서비스를 제공하는 업소를 쉽고 빠르게 확인·조회할 수 있도록 돕고 위생·방역 서비스 접근성을 높입니다. 또한 행정기관의 업소 관리, 위생·감염병 예방 관련 민원 대응, 지역별 업소 분포 파악 및 방역 관련 정책 수립·홍보를 위한 기초자료로 활용될 수 있습니다. 데이터 업데이트 주기는 연간이며, 데이터 출처는 양산시 보건소 보건행정과 및 웅상보건소입니다.
