description_portal: 본 데이터는 한국보건산업진흥원이 보건산업 분야의 통계정보를 생산·활용하는 과정에서 사용되는 주요 통계용어를 정리한 자료이다. 각 용어는 정의, 활용 맥락, 관련 지표, 분류 기준 등과 함께 제공되며, 보건산업 통계 해석과 활용의 정확성을 높이기 위한 기초자료로 활용된다. 본 자료는 통계 생산자와 이용자 간 이해 격차를 줄이고, 용어 해석의 일관성을 확보하기 위해 제작되었다. 의료서비스, 제약, 바이오, 건강관리 등 다양한 산업 분야에서 사용되는 용어가 포함되어 있으며, 표준화 기준과 작성 지침이 반영되어 있다. 본 데이터는 정책 수립, 연구, 교육, 실무 등 다양한 분야에서 활용 가능하며, 정기적인 검토를 통해 최신성과 신뢰성을 유지한다.
