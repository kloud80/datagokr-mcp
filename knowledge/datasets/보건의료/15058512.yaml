summary_user: 경기도 내 병원급 산부인과 의료기관을 기관 한 곳당 한 행으로 담은 인허가 원천 자료로, 시군·기관명·인허가일자·영업상태와 폐업일자·병상 수·의료인 수·입원실 수·연면적·주소와 좌표를 포함한다. 예비 산모나 모자보건 정책 분석가가 "우리 시군에서 지금 영업 중인 병원급 산부인과는 몇 곳이고 병상은 얼마나 되나"를 확인하거나 지역별 분만 인프라 격차를 비교하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 기관명·주소로 다른 경기도 데이터와 맞추고, 위경도 좌표로 공간 결합하는 방식으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 병원급 산부인과 의료기관의 현황을 정리한 자료로, 병원명, 인허가일자, 병상 수, 의료인 수, 입원실 수, 연면적, 주소 등의 정보를 포함하고 있습니다. 산부인과 병원은 여성 질환 진료와 임신·출산 의료서비스를 전문적으로 제공하는 기관으로, 본 자료는 지역별 여성건강 의료 인프라의 규모와 분포, 인력 확보 상황을 파악하는 데 유용합니다. 병상 수와 입원실 수는 출산 및 산과 진료 수용 능력을 보여주며, 의료인 수는 전문성 확보 수준을 나타냅니다. 이 데이터는 모자보건 정책 수립, 산부인과 의료 서비스 접근성 평가, 지역 간 의료 격차 해소 전략 마련에 기초 자료로 활용될 수 있습니다.
