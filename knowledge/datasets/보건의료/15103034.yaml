description_portal: 본 데이터는 「2020년 주요수술통계연보」를 기반으로, 국민관심도가 높은 주요 수술에 대한 현황을 다각도로 분석·제공하는 통계자료입니다. 성별, 연령별, 수술시기, 의료기관 소재지 및 환자 주소지 등을 기준으로 수술 실적을 분류하였으며, 전국의 주요 수술 트렌드를 파악하고 정책 수립 및 연구, 산업계 활용에 유용한 정보를 제공합니다.   ○ 주요 수록내용 - 연령별 성별 수술현황 - 시도별 의료기관종별 수술현황 - 수진월별 수술현황 - 의료기관시도별 수술현황 - 주요 수술통계 지표 - 다빈도 수술질환별 순위 20위 - 부록(주요수술통계연보 해설서)
