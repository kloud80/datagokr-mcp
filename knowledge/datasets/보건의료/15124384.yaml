summary_user: 대전광역시 중구 관내 의료기기 판매업·판매(임대)업 영업소를 업소 한 곳당 한 행으로 담은 건별 목록으로, 영업 구분·영업소명·도로명 소재지·우편번호를 담는다. 주민이나 사업자가 중구에서 의료기기를 사거나 빌릴 수 있는 업소가 어디에 있는지 확인할 때, 분석가가 동네별 판매업소 분포를 볼 때 쓴다. 전역 조인 키는 없고 도로명주소·우편번호로 주소 매칭하거나 업소명으로 다른 인허가 목록과 대조해 잇는다.
description_portal: 본 공공데이터는 대전광역시 중구 관내 의료기기판매(임대)업소 현황에 대한 데이터로 전체 데이터 개수(연번), 업종, 영업소명, 소재지, 우편번호를 확인할 수 있습니다.데이터 업데이트 주기는 연간으로, 활용 자료의 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 영업의구분은 판매업, 판매(임대)업으로 구성되어 있습니다.데이터 컬럼 중 영업소소재지는 도로명주소 기준으로 작성되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
