summary_user: 세종특별자치시에 등록된 약국을 한 곳씩 담은 목록으로, 약국 이름·도로명 주소·데이터 작성 기준일자·일련번호를 제공한다. 주민이나 분석가가 '내 동네 근처에 약국이 어디 있나', '세종시 읍면동별로 약국이 얼마나 분포하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 약국명이나 도로명 주소(roadNmAddr)를 맞춰 잇거나, 같은 기관의 데이터끼리만 연결한다.
limits: 세종특별자치시 한 곳만 다루므로 다른 시도 약국은 없다. 공통 식별 코드가 없어 건강보험 약국 정보 등과 붙일 때는 이름·주소 매칭에 기대야 하고 오매칭에 주의해야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며 개발계정은 하루 5,000회까지다.
