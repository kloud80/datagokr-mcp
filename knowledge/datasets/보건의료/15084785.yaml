description_portal: '○ 통계개요* 통계명 : 활동제약 비율(서울시 건강격차 모니터링 지표)* 통계종류 : 보건복지부 "지역사회 건강조사", 통계청 "인구주택총조사", 서울특별시"주민등록인구" 등을 활용한 가공통계* 작성목적: 서울 시민들의 건강문제를 진단하고, 건강격차에 대한 인식과 관심을 증가시켜건강한 공공보건정책 수립의 기초자료 제공* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 성별, 생애주기별, 학력별, 직업별, 자치구별○ 용어설명* 3년 이동합계 평균율 : 기대여명, 건강기대여명이나 사망률을 자치구 단위로 분석하는경우 기준시점 전후 1년을 포함하여 3년을 윈도우로 하는 이동합(moving sum)을분자와 분모에 각기 적용, 3년 이동합계 평균율 산출* 상대격차 : 상대위험도(relative risk)나 상대격차백분율(relative gap)로 제시- 상대위험도는 해당집단의 표준화율을 기준집단의 표준화율로 나누어준 값으로 상대위험도가1.3이라는 것은 기준집단에 비해 위험이 1.3배 높다는 것을 의미함.- 상대격차백분율은{(해당집단 표준화율 - 기준집단 표준화율) / 기준집단 표준화율 ×100}* 절대격차 : 해당집단의 표준화율에서 기준집단의 표준화율을 뺀 값* 각 값은 반올림한 값이기 때문에 표준화율들의 비와 제시된 값이 일치하지 않을 수 있음'
