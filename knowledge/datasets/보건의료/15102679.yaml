summary_user: 인천 부평구에 등록된 치과기공소를 한 곳당 한 행으로 담은 파일로, 기공소명·도로명 주소·우편번호·전화번호를 담는다(csv 약 3.6KB 규모). 치과 병·의원이나 주민이 부평구 안에서 보철물·교정장치를 맡길 치과기공소가 어디에 있고 연락처가 무엇인지 확인할 때 쓴다. 전역 조인 키가 없어 다른 의료기관 인허가 자료와는 기공소명이나 주소를 맞춰 잇거나 같은 기관(부평구) 자료끼리만 연결한다.
description_portal: '부평구 내에 등록된 치과기공소의 명칭, 위치, 우편번호, 연락처 정보를 정리한 자료의료기관 또는 치과 병·의원과 협력해 보철물, 교정장치 등을 제작하는 전문업소로, 관련 기관 조회나 보건행정 자료로 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 지역 내 치과기공소 운영 현황 파악– 보건의료 인프라 분포 및 업무 협력체계 분석– 치과기공 관련 민원 처리 및 정보 제공– 치과 병·의원과의 연계업체 확인 및 행정자료 활용주요 항목 설명● 치과기공소명: 등록된 기공소의 정식 명칭● 소재지(도로명): 도로명 기준의 사업장 주소● 우편번호: 해당 주소에 대한 우편번호● 전화번호: 기공소 운영 문의 및 업무 관련 연락처'
