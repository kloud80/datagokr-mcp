summary_user: 식약처장이 지정한 의료기기 임상시험기관의 명칭·소재지·대표자 등을 기관 한 곳씩 목록으로 담는 전국 범위의 원천 데이터다. 의료기기 제조·수입업체나 연구자가 "우리 제품의 임상시험을 맡길 수 있는 지정 기관이 어느 지역에 있나"를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 의료기관·인허가 데이터와는 기관명이나 주소를 직접 맞춰 이어야 한다.
limits: 검증 호출에서 수신된 행이 0건이어서 실제 응답 필드와 건수는 확인되지 않았으므로, 호출 파라미터를 먼저 확인해야 한다. 공통 기관 코드가 없어 심평원 요양기관 정보 등과의 연결은 이름·주소 매핑에 의존한다.
