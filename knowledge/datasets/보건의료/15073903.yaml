description_portal: 이 공공데이터는 식품의약품안전처(MFDS)에서 제공하는 의료기기 임상실시기관정보에 관한 공공데이터입니다.「의료기기법 시행규칙」 제21조(임상시험기관 지정기준 및 절차 등) 제8항에 따라 식품의약품안전처장이 지정한 의료기기 임상시험기관의 명칭, 소재지, 대표자 등을 공개하고 있습니다. 의료기기 제조·수입업체 및 연구자들의 임상시험기관 접근 편의성 제고를 위하여 식품의약품안전처에서 공개 중인 의료기기 임상시험기관 지정 정보를 목록으로 임상실시기관에 대한 정보를 파악하는데 도움이 될 것입니다.
