summary_user: 인천광역시 연수구에 주소를 둔 건강보험 가입자가 2020~2022년 인천 각 구의 요양기관에서 받은 진료를 진료년도·요양기관 소재 구·주상병 중분류(질병중분류 001~298)·10세 단위 연령·성별로 묶어 진료인원과 진료비(천원)를 담은 집계 파일이다. 연수구 주민이 어떤 질병으로 구 안과 다른 구 중 어디에서 진료를 받는지, 예를 들어 노년층 순환기 질환 진료가 관외로 얼마나 빠져나가는지를 보려는 지자체·보건 분석가가 쓴다. 전역 조인 키는 없어서 다른 지역의 관내외 진료정보나 심평원 통계와는 질병중분류명·연령구간·구 이름을 맞춰 붙여야 한다.
description_portal: '1. 진료년도: 2020~2022년(진료일기준)2. 수진자 주소지: 인천광역시 연수구3. 요양기관 주소지: 인천광역시 각 구(區)4. 주상병중분류: 질병중분류코드(001~298)5. 연령: 10세 기준(10세 미만, 10세 이상 … 80세 미만, 80세 이상), 연도말 기준6. 진료인원(입원, 외래) 및 진료비(입원, 외래, 약국)  - 건강보험 급여실적(의료급여 제외)이며, 한의분류 및 비급여 제외  - 2023년 6월 지급분까지 반영  - 개인정보 보호를 위해 시군구단위의 5인 미만 자료는 "*" 처리됩니다.※ 해당 질병통계 자료는 요양기관에서 환자진료 중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라   일차진단명을 부여하고 청구한 내역 중 주진단명 기준으로 발췌한 것이므로 최종 확정된 질병과는 다를 수 있음'
