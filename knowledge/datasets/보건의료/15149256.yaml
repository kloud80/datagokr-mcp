description_portal: □ 개방 데이터 설명     ○ 이 데이터는 건강보험료 경감 제도의 세부적인 기준을 체계적으로 제공하는 표로, 각종 경감코드와 기준점수별 경감율(%)을 상세히 정리하고 있습니다. 이를 통해 지역 특성이나 직업군별로 적용되는 경감 항목을 한눈에 확인할 수 있으며, 공단 정책 변화나 제도 개편 내역을 살펴보는 데도 활용할 수 있습니다.  ○ 경감코드별, 기준점수별 경감율 퍼센트 표현   - 경감코드(읍면지역, 녹지지역, 개발제한구역/ 농업인, 어업인, 임업인)   - 경감율(정률지원, 정액지원-금액, 미지원)  ○ 적용시작년월에서 적용종료년월까지 기준점수별 경감율 퍼센트 확인 가능   - 농어업인 지원 퍼센트가 과거부터 어떻게 변경되었는지 확인 가능   - 농어업인 정액 지원금액이 과거부터 어떻게 변경되었는지 확인 가능※  데이터값이 공란인 부분은 미집계 데이터입니다.
