summary_user: 전라남도 고흥군 내 의원을 한 곳씩 담은 LOCALDATA 형식의 인허가 원천 파일로, 사업장명·주소·좌표와 인허가일자·폐업일자, 영업상태, 의료기관 종별, 의료인수·병상수, 진료과목을 담는다. 주민이 고흥군에서 특정 진료과목을 보는 의원이 어디에 있고 지금 영업 중인지 확인하거나, 분석가가 의원의 개업·폐업 흐름을 상권 신호로 읽는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 소재지 주소·좌표나 사업장명 매칭, 또는 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
limits: 고흥군 한 시군구만 다루므로 다른 지역이나 전국 비교에는 다른 시군구 파일을 따로 모아야 한다. 건강보험 요양기관 기호 같은 공통 식별자가 없어 다른 의료 데이터와 정확히 맞추려면 이름·주소 매칭이 필요하다.
