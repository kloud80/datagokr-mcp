summary_user: 인천광역시 영종구(포털 설명상 옛 중구) 관내에 설치된 폐의약품 수거함을 한 곳씩 구분·명칭·도로명 소재지로 담은 건별 목록 파일로, 시군구 범위의 개별 주소 단위 데이터다. 주민이 집에서 쓰고 남은 약을 버리려 할 때 "우리 동네에서 가장 가까운 폐의약품 수거함이 어디인가"를 찾는 데 쓴다. 전역 조인 키나 코드 필드가 없어 다른 데이터와는 도로명 주소를 지오코딩하거나 같은 기관의 시설 목록과 명칭·주소로 맞춰 이어 쓴다.
description_portal: '인천광역시 중구 폐의약품 수거함 위치 및 명칭을 포함한 공공데이터로 가정에서 사용하고 남은 의약품의 올바른 폐기를 유도하기 위해 제공됩니다.폐의약품은 일반쓰레기나 하수도로 배출될 경우 환경오염을 유발하고, 인체에도 해를 끼칠 수 있어 안전한 수거 및 처리 체계가 중요합니다.본 자료를 통해 관내 수거함 설치 현황을 파악하고, 주민들이 가까운 수거 장소를 쉽게 확인하여 의약품을 안전하게 폐기할 수 있도록 돕습니다.또한 의약품 폐기 관리체계 개선, 국민 인식 제고 등 다양한 공공목적에도 활용될 수 있습니다.○ 인천광역시 중구_폐의약품 수거함 현황 :  구분, 명칭, 소재지(도로명), 데이터기준일'
