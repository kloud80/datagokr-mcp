summary_user: 광양시 의료기관이 보유한 특수의료장비를 기관·장비 단위로 담은 소규모 파일(약 2KB CSV)로, 의료기관명·전화번호·도로명 소재지, 자체 병상수와 공동활용 병상수, 장비명·모델명·형식명을 담는다. 광양시 주민이나 보건 담당자가 'CT·MRI 같은 정밀 진단 장비를 갖춘 병원이 시내 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터(병의원 인허가 LOCALDATA 등)와는 의료기관명이나 도로명 주소를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 의료기관의 특수의료장비 보유 현황을 제공하는 자료로, 의료기관명, 전화번호, 소재지(도로명), 자체 병상수, 공동활용 병상수, 의료장비명, 모델명, 형식명 등의 정보를 포함하고 있습니다. 이를 통해 국민은 지역 내 의료기관의 장비 보유 현황과 진료 인프라를 확인할 수 있으며, 응급 상황이나 정밀 진단이 필요한 경우 적합한 의료기관을 선택하는 데 도움을 받을 수 있습니다. 행정기관은 본 데이터를 활용하여 의료자원 관리, 의료서비스 격차 해소, 보건 정책 수립에 기초 자료로 삼을 수 있습니다. 또한 데이터 기준일이 명시되어 있어 최신성과 신뢰성을 보장하며, 공공데이터 개방을 통해 의료서비스의 투명성을 높이고 국민 건강 증진과 의료 인프라 개선에 기여합니다.
