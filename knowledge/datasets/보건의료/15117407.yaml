summary_user: 식약처가 제공하는 의료기기 통합업체 정보로, 업체(사업장) 한 곳을 한 행으로 사업장명·업종구분·주소·인허가일자·허가기관·사업자등록번호·폐업일자를 담는다. 검증 호출에서는 전국 범위 49건이 수신되었고, 의료기기 업체의 허가·폐업 여부나 소재지를 확인하려는 분석가나 사업자가 쓴다. 사업자등록번호(BRNO)와 사업장 주소 필드를 키로 다른 사업자·인허가·의료기관 데이터와 이어 쓴다.
limits: API 전체 건수가 49건이고 확인된 인허가일자가 2012-12-28 하루뿐이다. 다만 이 날짜는 검증 호출 조건(PRMT_YMD=20121228) 기준이라 데이터 자체의 최신성과 다를 수 있어 오래된 데이터로 단정할 수 없다. 포털 활용신청은 자동승인이며 개발계정은 일 10,000회까지 호출할 수 있다.
