description_portal: '1. 주상병코드: G36(기타 급성 파종성 탈수초)2. 진료년월: 2020년~2023년 연도별 및 월별3. 요양기관 주소지 기준4. 진료인원 및 건수: 해당 구분별 진료인원(중복제외) 및 건수5. 진료비 : 공단부담금(기관부담금)과 본인부담금을 더한 금액. 요양급여 총액   - 진료일 기준(한의분류 제외, 진료인원은 약국 제외)  - 건강보험 급여실적(의료급여 제외)이며, 비급여는 제외  - 2024년 6월 지급분까지 반영  - 질병통계 자료는 요양기관에서 환자진료중 진단명이 확정되지 않은 상태에서의 호소, 증세 등에 따라    일차진단명을 부여하고 청구한 내역중 주진단명 기준으로 발췌한 것이므로 최종확정된 질병과는 다를수 있음※ 개인정보 보호를 위해 5 미만의 자료는 * 처리됩니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
