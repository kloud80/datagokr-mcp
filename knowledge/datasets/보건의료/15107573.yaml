summary_user: 희귀질환 치료에 필요한 희귀필수의약품을 치료용의약품, 자가치료용 마약류, 긴급도입 보험등재·미등재·마약류의약품 등 5개 목록으로 나눠 품목 단위로 담고, 성분·약품명·적응증·투여경로·보험약가·용법용량 등을 제공하는 전국 단위 API다. 희귀질환 환자·보호자나 약국·의료기관이 특정 성분의 희귀필수의약품이 어떤 적응증과 보험약가로 공급되는지 확인할 때 쓴다. 응답 필드에 품목기준코드 같은 전역 조인 키가 확인되지 않아, 심평원 약가·급여 목록이나 식약처 허가정보와는 약품명·성분명 매칭으로만 이어 쓴다.
description_portal: 식품의약품안전처 「희귀필수의약품 정보」 OpenAPI는 희귀 질환 치료에 필요한 필수의약품의 현황을 제공하는 공공데이터입니다. 식품의약품안전처에서 제공하는 치료용의약품 , 자가치료용마약류의약품,긴급도입보험등재의약품 , 긴급도입보험미등재의약품 , 긴급도입마약류의약품 정보를 목록으로 제공합니다.샘플로 치료용 마약류의 주요 제공항목은 성분, 약품명, 적응증, 원료분량, 투여경로, 보험약가, 약가고시일자, 포장단위, 제형, 저장방법, 효능효과, 용법용량, 사용상의주의사항 등입니다.
