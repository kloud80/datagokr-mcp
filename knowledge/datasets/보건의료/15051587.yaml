summary_user: 부산광역시 남구 관내에 등록된 치과기공소를 한 곳씩 담은 목록 파일로, 운영상태·기공소명·도로명 소재지·전화번호를 담는다(약 3KB 규모의 CSV). 구민이나 치과 관계자가 남구에서 영업 중인 치과기공소의 위치와 연락처를 찾을 때 쓰고, 분석가는 기공소 개폐업을 지역 상권 신호로 볼 때 보조 자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 기공소명이나 도로명 주소를 맞춰 잇거나 같은 기관(남구) 자료끼리만 연결한다.
description_portal: 부산광역시 남구 관내 등록 된  치과기공소현황으로 순번, 운영상태, 치과기공소명, 소재지 , 전화번호 등의 항목을 공공데이터 포털을 통해 제공합니다.치과기공소에서는 교정장치, 충전물 작업모형, 보철물, 치과기공물의 디자인, 제작, 수리 또는 가공  등 치과의사의 진료에 필요한 치과기공물을 가공합니다.민원신고 종류는 치과기공소개설등록, 치과기공소 양도 양수, 치과기공소 폐업 또는 등록사항 변경신고가 있으며등록기준은 의료기사 등에 관한 법률  제11조의2(치과기공소의 개설등록 등) 및 같은 법 시행규칙  제12조의4(치과기공소의 시설 및 장비) 규정에 적합하고 건축물 용도가 근리생활시설인 경우 개설등록 가능합니다
