description_portal: 강원특별자치도 동해시에 위치한 정신건강의학과, 요양병원, 정신건강센터의 주소, 전화번호, 위경도 정보를 안내하여드립니다.공공데이터 정신건강의학과 요양병원 정신건강센터 현황데이터의 활용 분야는 다음과 같습니다.1. 정신건강 정책 수립 및 개선  - 지역별 정신건강 인프라 불균형 파악 및 개선 방안 마련.  - 특정 정신질환의 유병률 및 진료 현황 분석을 통한 예방 및 관리 정책 개발.  - 취약 계층(고령자, 청소년 등)의 정신건강 서비스 접근성 향상을 위한 정책 수립.  - 정신건강 서비스 전달체계의 효율성 증대 방안 모색.2. 보건의료 서비스 제공 및 개선  - 정신건강의학과, 요양병원, 정신건강센터 등 관련 기관 간 협력 체계 구축.  - 지역 기반의 맞춤형 정신건강 서비스 개발 및 제공.  - 환자 맞춤형 치료 및 관리 프로그램 개발에 필요한 기초 자료 제공.  - 응급 상황 시 정신건강 서비스 연계를 위한 정보 활용.
