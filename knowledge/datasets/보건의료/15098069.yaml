summary_user: 국립춘천병원 한 곳의 외래환자 실인원을 연도별(구분)로 나누고, 환자 주소지 기준 17개 시도와 '주소없음'별 인원 및 총계로 집계한 소규모 파일(csv 724 bytes)이다. 병원 운영·정책 분석가가 '국립춘천병원 외래환자는 강원 외 어느 시도에서 얼마나 오는가'처럼 정신건강 공공병원 이용의 지역 분포와 원거리 이용 정도를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명 열이나 연도를 이름 기준으로 맞춰 시도별 인구·의료기관 통계와 나란히 비교하는 방식으로만 잇는다.
description_portal: 강원도 춘천시에 위치한 국립춘천병원이 제공하는 연간 외래환자 지역별 실인원 데이터입니다. 구분 항목은 연도별 구분을 나타내며, 서울, 부산, 강원, 인천 등 주소지 기준으로 해당 지역에서 병원을 찾은 외래환자 수를 보여줍니다. 또한 ‘주소없음’ 항목을 통해 주소지가 확인되지 않은 외래환자 수를 포함하고 있어, 실제 방문환자 현황을 보다 정확히 파악할 수 있도록 돕습니다. 총계 항목은 연도별 전체 외래환자 수를 한눈에 확인할 수 있도록 집계되어 있습니다. 이 데이터를 통해 병원의 외래환자 분포를 분석하고, 지역별 의료서비스 접근성 분석 등에 기초자료로 활용할 수 있습니다.
