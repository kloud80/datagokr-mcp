summary_user: 편의점 등에서 판매가 허용된 안전상비의약품의 제품명, 업체명, 유효기간, 저장방법을 품목별로 담은 API로, 전국 기준 전체 13건이다. 소비자가 구입할 약의 제조사와 보관 방법을 확인하거나 유통업체가 판매 가능 품목을 파악하는 질문에 쓴다. 사업자등록번호(BIZRNO, 키 bizno)로 업체 단위 데이터와 이어 쓸 수 있고, 약가·급여 목록 연결은 식약처 품목기준코드가 필요한데 이 API에는 해당 필드가 없다.
limits: 전체가 13건뿐이라 안전상비의약품 외 일반 의약품 정보나 효능·용법, DUR 정보는 이 데이터로 알 수 없다. 품목기준코드 필드가 없어 심평원 약가·급여 목록과는 직접 조인되지 않는다. 필드 명세상 의미와 코드표가 비어 있어 유효기간 등 값의 해석은 호출 결과로 확인해야 한다.
