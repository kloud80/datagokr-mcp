summary_user: 경기도 의원의 인허가 현황을 사업장 한 곳당 한 행으로 담은 건별 원천 자료로, 인허가일자, 영업상태와 폐업·휴업 일자, 진료과목, 의료인·병실·병상 수, 지번·도로명 주소와 좌표를 포함한다. 분석가나 창업 준비자가 '특정 시군에서 최근 몇 년간 의원 개업과 폐업이 어떻게 늘고 줄었는가'를 확인해 상권 신호나 지역 의료 접근성을 볼 때 쓴다. 실측상 전역 조인 키가 없어, 시군코드(SIGUN_CD)나 주소·사업장명을 매핑해 같은 LOCALDATA 계열의 병원·치과·한의원 인허가 자료와 이어 쓴다.
description_portal: 본 데이터는 전국 의료기관 중 경기도 의료기관의 인허가 현황을 정리한 자료로, 시군별 의료기관의 인허가일자, 사업장명, 영업상태, 진료과목 정보 등을 포함합니다. 총 37개의 열로 구성되어 있으며, 행정적 정보와 의료 서비스 제공 현황을 함께 제공합니다. 데이터는 의료기관의 설립 및 폐업 동향, 특정 지역의 진료과목 분포 파악, 보건정책 수립을 위한 기초자료로 활용될 수 있습니다. 의료기관 현황을 통계적으로 분석하거나 의료 접근성 평가, 지역별 의료 서비스 분석 등 다양한 분야에 유용하게 활용될 수 있습니다.인허가자료 관련 자세한 내용은 지방행정인허가시스템(https://www.localdata.kr/)을 참고해주시기 바랍니다.
