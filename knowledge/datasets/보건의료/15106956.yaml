summary_user: 해외에서 승인된 바이오의약품 임상시험을 건별로 담으며, 임상시험 제목·적응증·연구설계(중재)·의뢰자/실시기관·임상단계·게시일자를 제공한다. 제약사나 연구기관이 특정 적응증에 대해 해외에서 어떤 설계와 단계의 바이오의약품 임상이 진행 중인지, 누가 의뢰했는지 파악해 개발 전략을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식약처 허가정보나 심평원 약가 데이터와는 적응증·의뢰자 이름 매핑으로만 이어 쓸 수 있다.
description_portal: 식품의약품안전처 「바이오의약품 해외임상승인현황」 OpenAPI는 해외에서 승인된 바이오의약품 임상시험의 주요 정보를 제공하는 공공데이터입니다. 제공 항목에는 임상시험제목, 적응증, 연구설계, 의뢰자/실시기관, 임상단계, 게시일자가 포함되어 있어 사용자는 특정 임상시험이 어떤 적응증을 대상으로 어떤 설계로 진행되는지, 누가 의뢰·실시하는지, 현재 임상 단계가 어디까지 진행되었는지를 확인할 수 있습니다. 또한, 제약사와 연구기관은 해외 임상시험 동향과 연구 설계 방식을 파악해 개발 전략을 수립하는 등 참고자료로 활용할 수 있습니다.
