summary_user: "제주특별자치도에서 신고된 법정 감염병 발생 건수를 기준 연도와 법정감염군 대분류·소분류별로 묶은 시도 단위 집계 통계로, 포털 설명상 2017~2019년을 담는다. 보건 분석가나 방역 담당자가 '제주에서 이 기간 어떤 감염병군이 늘거나 줄었나'를 연도별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 감염병명을 이름으로 맞춰 잇는다(예: 연도별 인구 통계로 발생률 계산)."
description_portal: 이 데이터셋은 제주특별자치도가 2017년부터 2019년까지 도내에서 신고된 법정 감염병의 발생 건수를 법정감염군 대분류 및 소분류별로 집계해 공개한 통계자료이다. 파일은 CSV 형식으로 누구나 접근할 수 있으며, 각 감염병명과 연도, 발생 건수가 표기되어 있어 도내 감염병 유행 현황을 시계열로 파악할 수 있다. 이 정보는 공중보건 정책 수립, 방역 자원 배분, 감염병 유행 경향 분석, 보건 의료 대응 체계 점검, 감염병 예방 캠페인 설계, 긴급 대응 우선순위 설정 등의 기초 통계로 활용 가능하다. 또한 인구 대비 발생률, 특정 질병의 증가 또는 감소 추세, 지역 간 비교 분석 등을 통해 감염병 관리 및 건강 안전망 강화, 감시체계 운영, 보건 교육 계획, 질병 위험도 평가 등에 객관적인 근거를 제공한다.
