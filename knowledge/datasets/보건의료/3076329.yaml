summary_user: 경상남도 내 의료기관을 기관 한 곳당 한 행으로 담은 파일로, 의료기관명·병상수·소재지 주소·설립구분(민간/공공)·개설일자·전화번호·데이터기준일자를 담는다. 도민이나 분석가가 "우리 시군에 공공 의료기관은 어디이고 병상은 얼마나 되나", "최근 몇 년 사이 개설된 병의원이 어느 지역에 몰렸나" 같은 질문에 쓰며, 병의원 개설 추이는 상권 신호로도 본다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 소재지 주소를 맞춰 붙여야 하고, LOCALDATA 병원·의원 인허가 데이터와 이름·주소 매칭으로 보완해 쓴다.
limits: 기관 코드 같은 공통 식별자가 없어 다른 의료기관 데이터와 정확히 1:1로 잇기 어렵고, 이름·주소 매칭에 오차가 생길 수 있다. 포털 설명상 병상수와 전화번호는 수집되지 않은 기관이 비어 있다. 범위는 경상남도에 한정된다.
