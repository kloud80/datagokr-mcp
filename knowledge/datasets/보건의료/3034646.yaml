summary_user: 부산광역시 남구 관할 약국을 한 곳씩 담은 목록 파일로, 약국명칭·전화번호·도로명 소재지를 담는다(약 9KB 규모의 CSV). 남구 주민이 집 근처 약국 연락처를 찾거나, 분석가가 남구 안 약국 분포를 주소 단위로 살펴볼 때 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 약국명이나 도로명 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 부산광역시 남구 관할 약국 현황으로 약국명칭, 전화번호, 소재지(도로명)가 있습니다.2026.06.17.자로 등록한 데이터입니다.약사법 제20조(약국 개설등록)에 의거하여, 약사 또는 한약사가 아니면 약국을 개설할 수 없으며 약국을 개설하려는 자는 보건복지부령으로 정하는 바에 따라 시장ㆍ군수ㆍ구청장에게 개설등록을 하여야  하며, 등록된 사항을 변경할 때에도 또한 같습니다.결격사유 1. 제76조에 따라 개설등록이 취소된 날부터 6개월이 지나지 아니한 자인 경우2. 약국을 개설하려는 장소가 의료기관의 시설 안 또는 구내인 경우3. 의료기관의 시설 또는 부지의 일부를 분할ㆍ변경 또는 개수(改修)하여 약국을 개설하는 경우4. 의료기관과 약국 사이에 전용(專用) 복도ㆍ계단ㆍ승강기 또는 구름다리 등의 통로가 설치되어 있거나 이를 설치하는 경우
