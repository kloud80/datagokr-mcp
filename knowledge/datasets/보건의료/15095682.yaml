summary_user: 의약품을 제조·수입·판매하려고 허가를 받은 업체를 업체허가번호·허가일자·공장 단위로 담은 식약처 API이며, 범위는 전국이고 검증 호출에서는 전체 건수 1, 수신 1행이 확인됐다. 사업자나 분석가가 특정 의약품 업체가 허가를 받았는지, 어느 공장 주소에서 운영되는지 확인하는 질문에 쓴다. 사업자등록번호(BIZRNO)와 공장주소(FCTRY_ADDR1·2)를 키로 다른 사업자·인허가 데이터와 잇고, 식약처 품목기준코드를 쓰는 품목 허가정보를 거쳐 심평원 약가·급여 목록까지 연결하는 용도로 쓴다.
limits: 검증 호출에서 전체 건수가 1건뿐이어서 실제 전체 규모와 갱신 주기는 확인되지 않는다. 오퍼레이션 /getDrugBsshListInq01은 최소 파라미터로 응답이 없었으므로 호출 시 파라미터 조정이 필요하다. 업체 단위 자료라 개별 품목의 허가나 약가는 이 데이터만으로 알 수 없다.
