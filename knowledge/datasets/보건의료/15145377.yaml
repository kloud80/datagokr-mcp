description_portal: "1. 기준년월: 2023년 1월~2025년 6월2. 질환별 상병코드(하위코드 포함): 두경부암(C00, C01, C02, C03, C04, C05, C06, C09, C10, C11, C12, C13, C14), 식도암(C15), 간암(C22), 대장암(C18, C19, C20 ), 담도암(C22,23,24) - C22는 간암 및 담도암에 모두 포함하여 제공 요청하여 각각 1건씩 집계함* 중증질환 산정특례제도는 보건복지부고시 「본인일부부담금 산정특례에 관한 기준」 제7조(산정특례 등록 신청 등) 에 의하여 본인 또는 보호자가 신청하여야 하므로, 암으로 진단을 받았다고 하더라도 암 환자가가 모두 산정특례 등록자인 것은 아니며, 의료급여 수급권자의 경우 발췌 자료에 포함되지 않습니다.* 산정특례제도는 ‘등록된 산정특례 대상 질환’과 ‘등록된 산정특례 대상 질환과 의학적 인과관계가 명확한 합병증’까지 적용되므로, 해당 등록 기간 내에는 전이암 및 암 치료로 인한 합병증 치료까지 가능하므로 최종 진단명과 다를 수 있습니다.' - 암: 보건복지부고시 「본인일부부담금 산정특례에 관한 기준」 [별표 3] 중증질환자 산정특례 대상 의 구분1에 해당하는 경우' - 신규암: 신청당시 암 산정특례 등록 이력이 없거나, 기 등록된 암의 특례기간 종료 이후 추가 발생한 암을 등록·신청하는 경우'(모든 신규암 대상자가 그 해 첫 발병이 된 것을 의미하는 것은 아님)* 산정특례 등록신청 접수일자 기준* 취소 제외* 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다."
