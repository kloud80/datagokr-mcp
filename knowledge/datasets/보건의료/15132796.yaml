description_portal: 본 데이터는 충청북도 충주시의 ‘굿충주헬스케어’ 사업에 참여한 환자의 처방식단 섭취 현황을 기록한 자료로, 환자 고유식별값(pk), 섭취 인분 수, 섭취 칼로리(kcal), 식사시간 등의 항목으로 구성되어 있음. 이는 헬스케어 프로그램 내에서 제공된 식단에 대한 실제 섭취 내용을 기록한 자료로, 식사량과 섭취 열량을 통해 개인별 영양 상태 및 건강관리를 모니터링할 수 있도록 설계됨. 해당 데이터는 환자의 생활습관 교정, 만성질환 예방, 식사시간대별 섭취 패턴 분석 등에 활용될 수 있으며, 영양처방의 효과를 정량적으로 평가하거나 지속적인 건강관리 시스템 구축을 위한 기초자료로도 유용함.
