summary_user: 전라남도 22개 시군의 병원·의원·보건소·치과·한의원을 기관 한 곳당 한 행으로 담은 현황 파일로, 등록기관(시군), 종별, 의료기관명, 전화번호, 지번·도로명 소재지, 인허가일자를 포함한다. 주민이 우리 군에 있는 치과나 한의원의 위치와 연락처를 찾거나, 분석가가 시군별 의료기관 분포와 개설 시점을 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 의료기관명·주소 문자열 매칭이나 시군 이름으로만 이어야 하며, LOCALDATA 병의원 인허가 데이터와 대조할 때도 같은 방식으로 연결한다.
description_portal: '- 전라남도 병의원 현황입니다. - 시군별(목포, 여수, 순천, 나주, 광양, 담양, 보성, 해남, 영암, 영광, 화순, 강진, 무안, 고흥, 함평, 장성, 장흥, 완도, 신안, 진도, 구례, 곡성), 종별(병원,  의원,  보건소,  치과,   한의원), 의료기관명, 연락처, 소재지, 인허가일자 등에 관한 정보를 제공합니다.- 전라남도청 및 각 시군청의 공식 웹사이트에서는 지역 내 병원과 의원에 대한 정보를 제공하고 있습니다. 예를 들어, 목포시청, 여수시청, 순천시청 등의 웹사이트에서 의료기관 안내를 확인하실 수 있습니다.- 보건복지부의 의료기관 정보 포털에서는 전국의 병원과 의원에 대한 상세 정보를 제공합니다. 지역, 진료과목, 의료기관 유형 등을 기준으로 검색이 가능하며, 각 의료기관의 위치, 연락처, 진료시간 등의 정보를 확인하실 수 있습니다.'
