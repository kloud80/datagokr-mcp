summary_user: 경기도 구리시 관내 한의원을 한 곳당 한 행으로 담은 건별 현황 파일로, 의료기관명·도로명주소·위도·경도·전화번호·관리기관명·데이터기준일자를 담는다. 구리시 주민이 집 근처 한의원 위치와 연락처를 찾거나, 분석가가 구리시 안 한방 의료기관의 분포와 개폐업 흐름을 상권 신호로 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 기관명·주소로 맞추거나 위도·경도로 공간 결합하는 식으로 이어 쓰고, LOCALDATA 한의원 인허가 데이터와 대조하는 데 쓴다.
description_portal: 본 데이터는 전국 한의원에 대한 현황 정보로,한의원명, 주소, 개설자, 진료과목, 운영 여부 등 주요 항목으로 구성되어 있다.해당 데이터는 국민의 의료기관 선택 편의성을 높이고,지역별 한방 의료서비스 분포 분석 및 보건의료 정책 수립을 위한 참고 자료로 활용될 수 있다.
