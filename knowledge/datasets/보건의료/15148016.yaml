summary_user: 서울 구로구 내 위탁급식 영업장을 업소(관리번호) 단위로 한 건씩 담은 인허가 원천 자료로, 인허가일자·영업상태·폐업일자, 도로명·지번 주소와 좌표, 종사자 수, 시설규모, 보증액·월세액 등을 포함한다. 구로구에서 영업 중이거나 폐업한 위탁급식업체가 어디에 있는지, 언제 허가받고 문을 닫았는지 확인하려는 사업자·분석가나 급식 위생 점검을 준비하는 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소를 맞추거나 같은 기관의 지방자치단체 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울특별시 구로구에서 제공하는 위탁급식영업 인허가 정보 데이터는 지역 내 위탁급식 영업장의 인허가 현황과 영업 상태를 체계적으로 정리한 공공자료이다. 데이터에는 관리번호, 인허가일자, 인허가취소일자, 영업상태명, 상세영업상태명, 폐업일자, 휴업 및 재개업일자 등 영업 변동사항이 포함된다. 또한 전화번호, 소재지면적, 지번주소와 도로명주소, 사업장명, 우편번호, 업태구분명, 좌표정보(X,Y), 위생업태명, 주변구분명 등이 수록되어 있다. 시설총규모, 건물소유구분, 종사자 현황, 보증액, 월세액, 다중이용업소 여부, 급수시설 등 경영 및 시설 관련 자료도 포함된다. 이를 통해 위탁급식 영업장의 설립, 운영, 휴업, 폐업에 이르는 전반적 현황을 확인할 수 있으며, 위생관리와 식품안전 정책 수립의 기초자료로 활용된다. 행정기관은 본 데이터를 활용하여 인허가 적정성 검토, 위생시설 기준 충족 여부, 다중이용시설 관리 상태 등을 점검할 수 있다. 또한 위치정보와 시설규모를 바탕으로 영업장 분포를 분석하고, 취약지역 진단 및 안전관리 대책 수립에 기여할 수 있다. 연구기관은 자료를 활용해 위탁급식 운영실태, 종사자 구조, 시설특성과 영업 지속성 간의 관계를 분석할 수 있으며, 공중보건 연구와 식품안전 정책 연구에도 활용할 수 있다. 시민은 합법적으로 허가된 영업장을 확인하여 신뢰할 수 있는 급식서비스를 이용할 수 있고, 생활권 내 위생환경에 대한 이해를 높일 수 있다. 본 데이터는 식품위생 강화, 공중보건 향상, 안전한 급식환경 조성에 기여하는 중요한 기반자료이다. 특히 대규모 급식수요 관리, 취약계층 영양지원, 안전한 집단급식 환경 조성을 위한 행정정책 수립에도 유용하며, 정기적 갱신과 품질관리를 통해 최신성과 정확성이 확보되어 누구나 공공데이터포털을 통해 자유롭게 활용할 수 있다.
