summary_user: 서울 성동구에서 편의점 등 안전상비의약품을 파는 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일자·취소일자, 영업상태(영업·폐업 등), 폐업일자, 소재지 지번·도로명 주소, 전화번호, 업소명, 좌표를 담는다. 주민이나 분석가가 '약국이 문 닫은 밤에 우리 동네에서 상비약을 살 수 있는 편의점은 어디인가', '성동구에서 상비약 판매업소가 언제 늘고 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소를 맞추거나 같은 기관 코드(개방자치단체코드)로만 잇고, 좌표(X·Y)는 약국·응급의료기관 위치 데이터와 거리 비교를 할 때 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 편의점 등에서 안전상비의약품으로 지정된 의약품을 판매하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 안전상비의약품은 일반 의약품 중 국민 생활에 필수적이고 긴급하게 필요할 수 있는 품목으로, 약국 이용이 어려운 시간이나 상황에서 신속하게 구입할 수 있도록 판매가 허용된 의약품입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 인허가 이력, 영업 개시 및 종료, 폐업 여부 등 주요 행정 정보가 포함되어 있습니다. 성동구청 등 관할 행정기관에서 정기적 점검과 정보갱신을 통해 데이터의 신뢰성과 최신성을 유지하고 있습니다. 본 데이터는 지역 내 안전상비의약품 판매 업소 현황 파악, 정책 수립, 응급의약품 접근성 분석, 의약품 유통 관리, 업계 동향 분석 등 다양한 목적으로 활용할 수 있습니다. 시민, 공공기관, 연구자, 관계자가 신뢰할 수 있는 정보 제공을 통해 보건안전과 서비스 품질 향상에 기여합니다. 데이터는 정기적으로 최신화됩니다.
