description_portal: 서울시 코로나19 확진자(전수감시) 발생동향 데이터는 2023년 8월 31일 이전 기간을 대상으로 서울시와 전국의 코로나19 확진, 치료, 퇴원, 사망 및 의심환자 현황을 일별로 정리한 자료입니다. 서울시 기준일별 확진자 수, 추가 확진, 치료중, 퇴원, 추가 퇴원, 사망 정보를 포함하며, 전국 단위의 확진, 추가 확진, 치료중, 퇴원, 사망 및 의심환자 전체, 검사중, 검사결과(음성) 현황도 함께 제공합니다. 또한 해외입국자와 접촉자에 대한 자가격리자 현황(감시중·감시해제)과 확인중 확진자, 서울시 및 전국 당일 사망자 수 등 방역관리와 위험도 평가에 필요한 세부 지표도 포함되어 있습니다. 이 데이터는 시기별 감염 확산 추이 분석, 방역 정책 효과 평가, 의료·격리 자원 수요 추정, 향후 유사 감염병 대응 전략 수립을 위한 기초 통계자료로 유용하게 활용될 수 있는 공중보건 행정의 핵심 데이터입니다.
