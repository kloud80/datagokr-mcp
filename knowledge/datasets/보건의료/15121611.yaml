description_portal: 본 데이터는 경기도 광주시에 설치된 수유시설의 현황 정보를 제공합니다. 수유시설은 영유아를 동반한 부모가 공공장소에서 편안하게 수유 및 기저귀 교환을 할 수 있도록 마련된 공간으로, 육아 가정의 외출 편의를 지원합니다. 시설명과 상세위치를 통해 각 수유시설의 명칭과 구체적인 설치 장소를 확인할 수 있으며, 도로명주소는 방문 시 정확한 위치 안내를 제공합니다. 이용대상 항목은 해당 시설을 이용할 수 있는 대상자를 명시하여 접근성을 높이며, 관리부서 전화번호는 시설 이용 문의 및 불편 사항 신고를 위한 연락 창구입니다.
