description_portal: '전북특별자치도 전주시 내 의원을 제공하며, 사업장명, 인허가일자, 상세영업상태, 전화번호, 도로명주소, 지번주소 등을 제공합니다.의원, 보건소, 한의원 등 진료시설을 갖추고 환자를 대상으로 의사가 의료행위를 하는 의료기관활용 포인트전주시 내 의료기관 분포 현황을 분석 가능진료과목별 의원 수를 통해 특정 분야의 공급 수준 파악정책 담당자는 지역 의료 인프라 확충 계획 수립에 활용시민은 의원 위치 및 연락처를 통해 생활 편의성 향상즉, 이 데이터는 전주시민의 의료 서비스 접근성을 높이고, 행정기관이 지역 보건정책을 설계하는 데 중요한 기초자료입니다.담당부서 : 보건행정과'
