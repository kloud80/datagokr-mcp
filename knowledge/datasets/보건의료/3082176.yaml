summary_user: 부산시내 종합병원·병원·요양병원·의원 등 의료기관을 기관별 한 건씩 담는 현황 데이터로, 기관명·종별·도로명주소·전화번호·진료과목·요일별 진료시간·휴일 운영 여부와 좌표(위경도)를 제공한다. 부산 시민이 '우리 동네에서 일요일에 문 여는 내과 병원이 어디인가'를 찾거나, 분석가가 구·동별 의료기관 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·주소 매칭이나 위경도 기반 공간 결합으로만 이어 쓰며, LOCALDATA 병의원 인허가 자료와 대조해 개폐업 흐름을 보는 보조 자료로 쓴다.
description_portal: 부산시내 종합병원, 병원, 요양병원, 의원 등 현황에 대한 자료로 의료기관명, 주소, 전화번호 등의 항목을 제공합니다.
