description_portal: 감염병의 예방 및 관리에 관한 법률에 의거하여 주기적인 소독을 실시해야하는 부산광역시 서구 소독의무시설 현황입니다.감염병 예방을 위해 다중이용시설의 소독은 법적으로 의무화되어 있습니다. 소독이 필요한 시설의 종류 및 관내 소독의무시설명, 주소, 위치 등을 데이터화하였습니다. 1. 숙박 및 식품접객업소 관련 시설 2. 교통 및 공공시설 3. 대규모 유통 및 문화시설 4. 의료·교육·기숙시설 코로나19 이후 감염병 예방의 중요성이 강조되면서, 다중이용시설의 소독 의무가 법적으로 강화되었습니다.소독의무시설은 업종별 숙박, 식품접객업소, 역사시설, 마트시장은 4~9월 1개월에 1회이상 10~3월 2개월에 1회이상소독하여야 하며, 집단급식소, 위탁급식소 기숙사, 학교 기타 어린이집 유치원, 복합건축물은 4~9월 2개월에 1회, 10~3월 3개월에 1회소독하여야 하며, 공동주택은 연간3회 이상 소독하여야 하는 의무가 있습니다
