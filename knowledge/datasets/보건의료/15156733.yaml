description_portal: 경기도 남양주시 소독의무대상시설 현황입니다.  소독의무대상시설은 「감염병의 예방 및 관리에 관한 법률」에 따라, 다수의 사람이 거주하거나 이용하는 시설 중 정기적으로 소독 및 방역 조치를 시행해야 하는 법적 의무가 있는 시설입니다. 본 데이터는  감염병 예방 및 공중보건 강화를 위해 관련 법령에 따라 정기적으로 소독을 의무화한 시설들의 현황을 정리한 자료입니다. 시설구분, 업소명, 및 주소 항목을 포함하고 있습니다. 해당 데이터는 방역 체계의 기초가 되며, 감염병 예방 및 방역 관리,  방역 및 청소 서비스 제공 등에 활용될 수 있습니다.
