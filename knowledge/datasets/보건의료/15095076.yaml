summary_user: 재외국민과 외국인의 건강보험 적용인구를 연도말 기준으로 집계한 전국 단위 통계로, 직장가입자·피부양자와 지역가입자·세대수를 재외국민과 외국인으로 나눠 담은 작은 CSV 파일(930바이트)이다. 외국인·재외국민의 건강보험 가입이 해마다 어떻게 늘거나 줄었는지, 직장과 지역 중 어느 쪽 비중이 큰지를 보려는 정책 담당자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 항목 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: '□ 데이터 개요본 자료는 국민건강보험공단이 관리하는 재외국민 및 외국인 건강보험 적용인구 현황으로, 연도별로 재외국민과 외국인에 대한 건강보험 적용 인구수를 제공하는 데이터입니다. 직장가입자와 지역가입자 유형별로 구분되어 있으며, 건강보험 제도의 외국인 적용 현황을 파악할 수 있는 기초 통계로 활용됩니다.□ 주요 내용집계기준: 연도말 기준대상구분: 재외국민, 외국인가입자유형: 직장가입자, 지역가입자제공항목: 연도, 대상구분, 가입자 유형, 적용 인구 수활용예시: 외국인 건강보험 적용 추세 분석, 정책 기초자료 활용, 지자체별 외국인 건강보장 확대 기획 등*2023년 건강보험통계연보 기준'
