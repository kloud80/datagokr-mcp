description_portal: 해당 자료는 경상남도 합천군 관내 소재하고 있는 정신건강의학과(정신질환을 치료하는 병원의 진료과) 및 요양병원(돌봄 시설)에 대한 현황 관한 자료입니다.본 데이터는 경상남도 합천군 정신건강의학과 및 요양시설의 시설명, 주소, 전화번호, 비고(구분) 등의 데이터를 포함합니다.이를 통해 합천군 내 정신건강 및 요양 관련 의료 인프라의 분포와 특성을 파악할 수 있습니다.향후 정신건강질환자 치료 체계 강화, 지역 내 요양병원 접근성 향상, 의료 취약지 개선 등과 관련된 정책 수립에 활용할 수 있습니다.데이터 제공 기준일은 2022년 8월 17일 입니다.
