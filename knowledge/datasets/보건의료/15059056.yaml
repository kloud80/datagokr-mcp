summary_user: 식약처가 회수·판매중지 등 유통 중 추적이 필요하다고 지정한 의료기기를 품목 단위로 담으며, 업체명·품목명·품목 일련번호·허가일자·제조원·제조국가를 전국 범위로 제공한다. 의료기관이나 유통업체가 '지금 다루는 이 의료기기가 추적관리 대상인지, 언제 허가됐고 어느 나라 제조원 제품인지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 의료기기 품목허가 데이터와는 품목명·업체명 매칭이나 같은 식약처 품목 일련번호(MEDDEV_ITEM_SEQ)·사업자등록번호(BRNO)로만 맞춰 붙인다.
limits: 전역 조인 키가 없어 건강보험 급여·약가 목록 등 타 기관 데이터와 코드로 바로 연결되지 않고, 이름·코드 매핑이 필요하다. 지역 정보가 없는 전국 단위 비공간 데이터라 지역별 분석에는 쓰지 못한다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 일 10,000회로 제한된다.
