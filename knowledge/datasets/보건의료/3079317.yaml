summary_user: 경상남도 거제시에 있는 안전상비의약품 판매점을 점포 한 곳당 한 행으로 담은 파일(csv, 약 24KB)로, 판매점포명·도로명주소·최초등록일자·기준일자를 담는다. 주민이 집 근처에서 밤이나 휴일에 해열제·소화제 같은 상비약을 살 수 있는 편의점이 어디인지 찾거나, 분석가가 거제시 안에서 판매점이 어느 지역에 몰려 있는지 볼 때 쓴다. 전역 조인 키(사업자번호·시설 코드 등)는 없으므로 다른 데이터와는 점포명이나 도로명주소를 맞춰 붙이거나, 주소를 좌표로 바꿔 약국·의료기관 위치 데이터와 겹쳐 본다.
description_portal: 이 데이터는 경상남도 거제시에 위치한 안전상비의약품 판매점 현황을 제공하는 공공데이터입니다. 판매점포명, 주소, 최초등록일자, 기준일자 등의 정보를 포함하여 판매점의 위치와 등록 현황을 확인할 수 있습니다. 가까운 판매점 위치 확인과 안전상비의약품 구매 계획에 활용하실 수 있으며, 기업이나 연구자는 상권 분석, 유통 전략 수립, 보건 서비스 계획 등 다양한 목적에 참고자료로 활용할 수 있습니다. 또한 지역 약국 및 편의점 연계 서비스 개발, 모바일 지도 앱 구축 등에도 활용 가능하여 공공·민간 분야에서 폭넓게 활용될 수 있습니다.
