summary_user: 서울특별시 마포구에서 의료업을 목적으로 설립된 의료법인의 인허가 정보를 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가일자·영업상태·폐업일자·주소·중부원점TM 좌표(X, Y) 등을 포함한다. 마포구에서 어떤 의료법인이 언제 인허가를 받았고 지금도 영업 중인지, 최근 폐업한 곳은 어디인지 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 다른 지자체의 같은 형식 LOCALDATA 인허가 파일과 나란히 붙여 쓰는 데 맞다.
description_portal: '서울특별시 마포구의 의료업을 목적으로 설립된 법인 정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 의료법인을 관리·감독하는 보건 부서나 기관의 정보도 함께 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
