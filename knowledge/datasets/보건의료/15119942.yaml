summary_user: 만 20세 이상 건강보험 가입자·의료급여수급권자 중 급성 심근경색(I21-I22) 환자의 진료에피소드 발생건수와 발생 28일 내 사망건수를 발생년도·성별·5세 연령군·소득수준·시도·시군구별로 집계한 전국 단위 파일입니다. 지역별·소득별 급성 심근경색 발생률과 조기 사망 수준이 어떻게 다른지 비교하려는 보건 분석가나 지자체 담당자가 인년·실 인원수를 분모로 써서 발생률과 치명률을 구하는 데 씁니다. 전역 조인 키는 없고 광역시도·구시군 코드와 이름을 매핑해 다른 지역 통계와 연결합니다.
