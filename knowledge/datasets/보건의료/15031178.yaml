description_portal: '이 데이터는 음성군에 의료기관에 설치된 진단방사선발생장치 및 특수장비의 현황을 기록한 자료로, 장비의 종류, 모델, 설치 기관 등의 정보를 포함하고 있습니다. 의료장비의 보급 현황을 파악하고, 장비 관리 및 정책 수립에 활용될 수 있습니다.*장치종류: 장비의 분류를 나타냅니다 *장치명칭: 장비의 고유 명칭 또는 제품명입니다. 제조사에서 부여한 이름일 수 있습니다*장치모델명: 장비의 모델 번호 또는 버전입니다. 장비의 세부 사양을 구분하는 데 사용됩니다*의료기관명: 해당 장비가 설치된 의료기관의 공식 명칭입니다*의료기관주소: 의료기관의 소재지 주소로, 지역별 장비 분포를 분석할 수 있습니다*전화번호:  의료기관의 대표 연락처입니다. 장비 관련 문의나 확인 시 활용됩니다*데이터기준일자: 해당 정보가 수집된 기준 날짜입니다. 최신성 및 데이터 갱신 여부 판단에 사용됩니다※ 활용예시- 지역별 방사선 장비 보급률 분석- 특정 장비의 제조사별/모델별 설치 현황 파악- 의료기관의 장비 보유 현황 모니터링- 정책 수립 및 장비 교체 주기 검토'
