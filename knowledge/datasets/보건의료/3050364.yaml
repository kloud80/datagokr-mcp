summary_user: 국립춘천병원 외래 환자 수를 구분 항목별로 보험·급여(의료급여)·일반 환자로 나눠 담은 기관 단위 집계 파일(csv, 약 2.9KB)이다. 병원 운영 분석가나 공공보건 연구자가 이 병원 외래 이용자 중 의료급여·비보험 환자 비중이 어느 정도인지 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명 매칭이나 같은 기관(국립춘천병원) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 국립춘천병원에 내원한 외래 환자 수를 세부적으로 분류한 정보입니다. 구분 항목을 통해 외래 환자 수의 분류를 확인할 수 있으며, 보험환자 수, 급여환자 수, 일반환자 수로 나뉩니다. 보험환자 수 항목은 의료보험에 가입된 환자들의 방문 수를 나타내고, 급여환자 수는 급여 혜택을 받는 환자들의 내원 수를 보여줍니다. 일반환자 수 항목은 의료보험이나 급여 혜택을 받지 않는 환자들의 방문 수를 나타냅니다. 이를 통해 병원의 외래 환자 분포를 파악할 수 있으며, 환자군별 의료 접근성 및 의료서비스 이용 현황을 분석할 수 있습니다.
