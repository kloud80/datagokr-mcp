summary_user: 간호간병통합서비스를 운영하는 전국 의료기관을 기관 한 곳 단위로 담은 파일 데이터로, 종별·기관명·병동구분·지역·주소·병동수·병상수가 들어 있다. 환자 가족이 사는 지역에서 보호자 없이 입원할 수 있는 병원을 찾을 때, 분석가가 시도별 운영 병상 분포와 취약지역을 따질 때 쓴다. 실측 컬럼에 전역 조인 키(요양기관기호 등)가 없어서, 다른 의료기관 데이터와는 기관명·주소를 맞춰 보는 방식으로만 연결한다.
description_portal: '데이터 소개국민건강보험공단_간호간병통합서비스 운영기관 현황은 대한민국 국민건강보험공단에서 제공하는 공공데이터 중 하나로, 간호간병통합서비스 정보를 제공하고 있습니다.간호간병통합서비스를 제공하는 운영기관의 정보를 제공하고 있으며, 이를 통해서 사용자가 서비스의 운영현황 및 취약지역 등 필요로 하는 자료를 얻을 수 있을 것으로 기대하고 있습니다. 데이터는 분기에 한 번 업데이트 되는 자료입니다.주요 데이터 정보기관명: 간호간병통합서비스를 제공하는 의료기관의 공식 명칭기관 유형: 병원, 요양병원 등 기관의 종류주소: 기관의 위치병동수: 기관 병동수병상수: 기관 병상수활용예시위치 기반 검색: 사용자의 위치를 기반으로 가까운 간호간병통합서비스 제공 기관을 찾을 수 있습니다.서비스 제공 여부 확인: 특정 기관이 간호간병통합서비스를 제공하는지 여부를 확인할 수 있습니다.※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.'
