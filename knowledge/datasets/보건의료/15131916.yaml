description_portal: 이 데이터는 대구광역시 수성구 홈페이지를 통해 발급 신청된 건강카드 관련 정보를 수록한 자료로, 등록 ID, 예약일자, 신청 유형, 신청자 이름, 휴대전화번호, 생년월일, 주소, 피부질병 유무, 개인정보 수집 동의 여부, 사용 여부, 등록일자 등의 항목으로 구성되어 있다. 건강카드는 식품위생 분야 종사자가 위생교육 후 발급받는 증빙서류로, 본 자료는 신청자의 개인정보를 비식별 처리하여 제공되며, 카드 발급 이력 및 발급 여부 확인, 건강 이상 여부 파악 등에 활용될 수 있다. 수성구는 위생 행정의 효율성과 투명성 강화를 위해 건강카드 신청 현황을 체계적으로 관리하고 있으며, 본 데이터는 민원 대응, 위생교육 관리, 식품안전 제도 개선 등 행정목적의 분석자료로 유용하다. 본 자료는 정기적으로 갱신되어 최신 현황을 반영한다.
