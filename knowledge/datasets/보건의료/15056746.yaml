summary_user: 경기도 시군별 병원(요양병원·정신병원 등 종별 포함)을 한 곳씩 담은 인허가 원천 목록으로, 인허가일·영업상태·폐업일·휴업기간, 병상수·입원실수·의료인수, 진료과목, 도로명·지번 주소와 위경도를 담는다. 분석가가 '우리 시군에서 최근 문을 닫거나 새로 연 병원은 어디이고 병상 규모는 얼마인가'처럼 병원 개폐업 흐름이나 지역별 입원 수용능력을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 병원명·주소 같은 이름 매칭이나 시군구 단위 집계, 위경도 좌표로 이어 쓴다.
description_portal: '이 데이터는 경기도 내 시군별 병원에 대한 상세 현황을 제공하며, 각 병원의 인허가정보, 병상수, 의료인수, 입원실수, 진료과목, 영업상태, 주소(도로명 및 지번), 위도·경도 등의 위치 정보가 포함되어 있습니다. 또한 병원의 운영 상태(영업, 폐업, 휴업, 재개업 등)와 구조사 수, 구급차 대수, 지정취소일자 등의 세부 사항도 함께 제공됩니다. 본 API는 XML 또는 JSON 형식으로 이용할 수 있으며, 공공보건 정책 수립, 응급의료체계 분석, 병원 정보 검색 시스템 등 다양한 용도로 활용될 수 있습니다.- 의료기관종별명: 병원, 요양병원, 정신병원 등 의료기관의 운영 형태를 분류하는 항목으로, 보건복지부에서 정한 분류 기준에 따릅니다.- 병상수: 환자가 입원하여 치료를 받을 수 있는 침대 수를 의미하며, 병원의 수용능력을 나타내는 주요 지표입니다.- 영업상태명: 의료기관의 현재 운영 상태를 나타내며, ‘영업중’, ‘폐업’, ‘휴업’, ‘재개업’ 등의 상태로 구분됩니다.'
