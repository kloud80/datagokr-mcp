summary_user: 서울 서초구 관내 병원급 의료기관(병원·치과병원·한방병원·요양병원·종합병원 등)의 등록 현황을 기관 한 곳당 한 행으로 담은 CSV 파일(약 3KB)로, 의료기관명·도로명주소·전화번호·데이터기준일자가 들어 있다. 서초구 주민이 집 근처 병원급 의료기관과 연락처를 찾거나, 분석가가 구 단위 병상·의료기관 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 의료기관명이나 도로명주소를 매칭해 LOCALDATA 병원 인허가 데이터 등과 이어 써야 한다.
description_portal: 서울특별시 서초구 관내에 위치한 병원 현황입니다. 병원급(병원, 치과병원, 한방병원, 요양병원, 어린이병원, 종합병원) 등록 현황으로 의료기관 등록 시 의료기관명, 의료기관주소(도로명) 및 의료기관전화번호등의 정보를 제공합니다.의료기관 현황은 병상 수급 계획 수립 자료에 활용 가능하고, 의료기관을 이용하고자 하는 시민들에게 정보를 제공함으로써 의료기관 선택 시 시민의 접근성 등 유용한 자료활용으로 국민보건향상에 기여할 수 있습니다.※ 제공되는 데이터는 등록 변경(신규, 폐업, 변경) 등 처리로 인하여, 별도로 제공되는 데이터와 차이가 있을 수 있습니다.해당 데이터는 서초구 보건소 의료지원과에서 제공합니다.
