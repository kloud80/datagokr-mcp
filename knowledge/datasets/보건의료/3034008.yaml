description_portal: '국립부곡병원에서 실시되는 약물중독자에 대한 치료보호실적으로 대상 년도별, 진단별(한국표준질병 및 사인분류(KCD)), 지역별(병원소재지인 경남 위주), 입원유형별, 실인원, 연인원 데이터를 운용 중인 병원정보시스템에 등록된 정보에서 추출하여 제공  주1) 지역별 : 대한민국 전체를 대상으로 지역 제한은 없으나 병원소재지가 경상남도임을 고려 필요  주2) 입원유형 코드 : 응급, 자의, 동의, 보호, 검찰의뢰, 치료위탁, 기타로 분류  주3) 실인원/연인원 : 실인원은 일자별 중독이 제외되며, 연인원은 일자별 중복을 포함한 누적환자수'
