summary_user: 국내 허가 의료기기를 UDI-DI 코드 단위로 한 건씩 담는 원천 데이터로, 소분류 품목명·등급·업체명·품목허가번호·모델명·요양급여(EDI) 코드를 포함하며 전체 2,356,463건, 등록 기간은 2019-08-13~2024-01-16이다. 의료기관·유통업체·소비자가 특정 의료기기가 요양급여 대상 치료재료인지, EDI 코드가 무엇인지 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않아, 품목허가번호나 UDI-DI 코드, EDI 코드를 같은 기관의 다른 의료기기·급여 코드 자료와 이름·코드 매핑으로 이어 써야 한다.
description_portal: 의료기기 UDI/EDI 정보 조회 서비스는 국내에서 허가된 의료기기의 상세 정보를 체계적으로 제공하는 공공데이터입니다. 이 데이터는 각 의료기기에 부여된 고유식별자(UDI-DI)를 중심으로 구성되어 있으며, 이를 통해 의료기기의 식별 및 추적이 가능합니다. 주요 제공 항목에는 의료기기 소분류 품목명, 제품의 등급, 제조·수입 업체명, 제품명, 품목허가번호, 모델명, 고유식별자(UDI-DI) 코드, 요양급여 대상 치료재료 여부, 요양급여(EDI) 대상 치료재료 코드, 통합정보 등록일이 포함됩니다. 이를 통해 의료기관, 유통업체, 소비자 등이 의료기기의 정보와 급여 적용 여부를 손쉽게 확인할 수 있으며, 안전한 유통과 사용을 지원합니다. 이 데이터는 의료기기의 투명한 정보 공개와 이력 관리 체계를 구축하는 데 핵심적인 역할을 하며 의료 시장 분석에도 활용될 수 있습니다.
