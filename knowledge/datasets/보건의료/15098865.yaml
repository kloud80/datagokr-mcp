description_portal: '경상남도 거창군의 2020년 ~ 2023년 월별 코로나19 관련 확진자 및 사망자 수 현황 데이터로 월별 확진자 수와 사망자수 정보를 제공합니다.○ 데이터 기준일 : 2023. 09. 07.○ 코로나19(COVID-19)는 2019년 말 중국 우한에서 처음 발생한 신종 코로나바이러스(SARS-CoV-2)에 의해 유발되는 호흡기 감염병입니다. 주로 비말이나 접촉을 통해 전파되며, 발열, 기침, 호흡곤란, 후각·미각 상실 등의 증상을 동반할 수 있습니다. 고령자나 기저질환자는 중증으로 진행될 위험이 높으며, 전 세계적으로 대유행(Pandemic)을 일으켜 사회, 경제, 교육 등 다양한 분야에 큰 영향을 미쳤습니다. 백신 접종과 방역 수칙 준수는 감염 예방과 확산 억제에 중요한 역할을 했습니다.'
