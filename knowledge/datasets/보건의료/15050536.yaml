summary_user: 부산광역시 남구에 소재한 의료기관을 한 곳당 한 행으로 종별(병원·의원·치과·한의원 등), 기관명, 주소, 전화번호를 담은 개별 기관 목록이며 휴업 중인 기관도 포함한다. 주민이 남구에서 가까운 치과나 한의원을 찾거나, 분석가가 남구 내 의료기관 종별 분포와 동네별 밀집도를 파악하는 데 쓴다. 공통 기관코드 같은 전역 조인 키가 없어 LOCALDATA 병의원 인허가 데이터나 다른 의료기관 목록과는 기관명·주소를 맞춰 대조해 이어 쓴다.
description_portal: 의료기관이란 의사, 치과의사, 한의사, 조산사가 의료행위 또는 조산행위를 하는 기관 모두를 의료기관이라 지칭한다. 의료법에 따르면 주로 외래 환자를 대상으로 하는 의원급 의료기관과 주로 입원 환자를 대상으로 하는 병원급 의료기관 그리고 조산사가 임산부의 분만을 돕는 조산원으로 크게 나눌 수 있다.  병원급 의료기관을 전문성, 병상 수에 따라 병원, 치과병원, 한방병원, 요양병원, 정신병원, 종합병원으로 세부적으로 분류되며, 의원급 의료기관은 의원, 치과의원, 한의원으로 분류한다.현자료는 부산광역시 남구에 소재한 의료기관 현황(종별, 명칭, 주소, 연락처)이며 휴업 중인 의료기관을 포함한다.
