description_portal: 강원특별자치도 내 18개 시·군에서 운영 중인 보건소, 보건의료원, 보건지소, 보건진료소 등 지역보건의료기관의 현황을 담고있습니다. 공공 의료 자원의 위치와 접근성이 도민의 건강권 보장에 직결되는 만큼, 이용자가 필요한 정보를 직관적으로 파악할 수 있도록 구성되었습니다.데이터의 주요 개방 항목은 기관명, 기관유형, 도로명주소, 전화번호, 운영시간입니다. 특히 기관유형을 7가지(보건소, 건강증진형보건지소, 일반보건지소, 보건진료소, 건강생활지원센터, 보건의료원, 통합보건지소)로 상세히 분류하여, 이용자가 일반 진료부터 건강 증진 프로그램까지 목적에 맞는 최적의 기관을 쉽게 확인할 수 있습니다.해당 데이터는 분기별로 현행화되어 제공될 예정이므로 이용 시 참고하시기 바랍니다.
