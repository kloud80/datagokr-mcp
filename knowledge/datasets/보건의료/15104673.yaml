description_portal: 이 데이터는 광주광역시 서구청에서 제공한 ‘방역민원접수현황’으로, 2015년부터 2020년까지 접수된 방역 민원에 대한 구체적인 내용을 담고 있습니다. 항목은 민원 접수일과 방역일, 민원제목, 원인 해충의 종류, 민원이 발생한 행정동, 실제 방역이 이루어진 위치, 위도·경도 정보로 구성되어 있으며, 시간적·공간적 정보를 함께 포함하고 있어 다양한 분석에 활용이 가능합니다. 특히 위생해충(모기 등)으로 인한 지역별 민원 발생 분포 및 방역 대응 이력을 파악할 수 있어, 향후 방역 정책 수립 및 감염병 예방 대응 방안 마련에 있어 중요한 기초자료로 활용될 수 있습니다. 연도별 변화 추이 분석, 동별 민원 밀집도 분석, 계절별 해충 발생 경향 분석 등으로도 확장 활용이 가능하며, 시민 생활환경 개선 및 공공 보건행정의 데이터 기반 의사결정에 기여할 수 있는 실효성 있는 데이터입니다.
