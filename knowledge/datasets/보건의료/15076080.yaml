summary_user: 서울특별시 서초구 관내 소독업체의 인허가 정보를 업체 한 곳당 한 건으로 담으며, 사업장명·주소·전화번호·인허가일자·폐업일자·영업상태와 사무실 면적, 분무기·연무기·방독면·보호복 같은 소독장비 보유 수량이 들어 있다. 주민이나 관리사무소가 "서초구에서 지금 영업 중인 소독업체는 어디이고 장비는 얼마나 갖췄나"를 확인하거나, 분석가가 소독업체의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 관리번호(MGTNO)와 자치단체 코드로 같은 서울시 인허가 계열 데이터와 맞추거나 주소·업체명으로 매칭해 이어 쓴다.
description_portal: 서울특별시 서초구에서는 지역 내 감염병 예방과 공중위생 수준 향상을 위하여 소독 관련 영업을 수행하는 업체의 인허가 정보를 체계적으로 관리하고 있습니다. 본 데이터에는 사업자명, 주소, 전화번호, 인허가일자, 영업상태, 업태명, 보호구 수량 등의 항목이 포함되어 있습니다. 이를 통해 관내 방역 서비스의 질을 확보하고, 주민 안전과 직결되는 위생관리 체계를 강화하기 위한 행정 기반을 마련하고자 한다.이용자는 본 데이터를 통해 특정 업체의 자격 요건, 운영 현황, 관련 규정 준수 여부를 명확히 파악할 수 있어 서비스 선택 시 객관적 판단이 가능해진다. 또한 해당 정보는 감염병 발생 대비, 위생 취약지역 점검, 사업자 관리·감독 업무 등 다양한 행정 절차에서 활용될 수 있으며, 공공서비스 제공의 투명성 제고에도 기여한다. 아울러 데이터는 최신 상태를 지속적으로 유지하여 정책 수립과 지역 보건환경 개선을 위한 자료로 활용될 수 있도록 체계적으로 관리되고 있습니다. 위치정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공되며, 위경도 형식은 제공되지 않습니다. 본 데이터는 최근 3일 내 갱신된 자료로, 지역 방역 대응 체계 강화, 소독업 등록 현황 파악, 위생정책 수립 등에 활용 가능합니다.
