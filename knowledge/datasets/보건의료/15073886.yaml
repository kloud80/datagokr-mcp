summary_user: 식약처에 제출된 의료기기 회수·폐기 종료보고를 보고 한 건 단위로 담은 원천 데이터로, 보고 구분·제출일·승인일, 업소명·업종·주소, 보고 상태, 소비자가 취해야 할 행동과 제품 이미지 ID를 전국 범위에서 제공한다. 소비자나 의료기관 구매 담당자가 특정 업체의 의료기기 회수가 끝났는지, 언제 종료가 승인됐는지 확인하는 데 쓴다. 명세에는 사업자등록번호(BRNO)와 업소명이 있으나 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·사업자번호 매핑이나 같은 식약처 데이터끼리만 이어 쓴다.
description_portal: 이 공공데이터는 의료기기 회수폐기종료보고에 관한 내용을 담고 있으며 회수폐기보고구분, 보고승인일자, 보고제출일자, 업소명, 대표자명, 업종구분코드, 업종구분명, 업소주소 등의 정보를 제공합니다. 회수의무자는 회수가 끝나면 회수 종료일로부터 5일 이내에 시행규칙 제54조제3항 또는 제57조제2항에 따른 회수종료 보고를 하여야 합니다. 회수 종료보고서는 회수의무자, 회수대상제품정보, 회수대상 제품량, 회수기간 회수결과 등의 정보를 제공하며, 회수가 법에 따라 절차대로 시행되었음을 확인할 수 있습니다.
