summary_user: 충청북도 11개 시군에 있는 보건진료소를 한 곳당 한 행으로 담은 목록 파일로, 시군·진료소명·전화번호·우편번호·주소를 담는다(포털 설명 기준 청주 23개소, 음성 19개소 등). 농촌 주민이나 보건 정책 분석가가 '우리 군에 보건진료소가 몇 곳이고 어디에 있으며 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 보건소·지역사회 건강조사 자료와는 시군 이름이나 주소를 문자로 맞춰 연결해야 한다.
description_portal: 충청북도 내에 소재하고 있는 보건진료소에 대한 현황 정보를 제공합니다. (시군, 진료소명, 전화번화, 우편번호, 주소)  - 청주시 갈산진료소 등 23개소, 충주시 장록진료소 등16개소, 제천시 옥전진료소 등 11개소, 보은군 강신진료소 등 14개소, 옥천군 석탄진료소 등 16개소, 영동군 화신진료소 등 16개소, 증평군 남차진료소 1개소, 진천군 사석진료소 등 7개소, 괴산군신기진료소 등 17개소, 음성군 삼생진료소 등 19개소, 단양군 가대진료소 등 15개소 - 기타 자세한 사항(전화번호, 우편번호, 주소)은 붙임파일 참고부탁드립니다.
