description_portal: '장애인의 지역사회 참여와 자립을 지원하기 위한 재활시설의 명칭, 위치, 면적, 정·현원, 운영주체 및 인가일 등을 포함한 현황 자료.장애인의 일상생활 복귀, 사회적응, 문화·정서·의료적 재활 등을 위한 복합지원시설로, 지역 중심의 통합복지체계 수립을 위한 기초자료로 활용됨.활용 목적 및 특징– 재활시설의 대지·건물 규모 기반 시설 인프라 적정성 분석– 종사자 및 이용자 정·현원 비교를 통한 운영현황 진단– 지역 밀착형 서비스 기반으로 복지전달체계 개선 자료 활용– 인가일 및 운영주체 정보 기반 시설 연혁 및 관리 책임 구분 가능주요 항목 설명● 연번: 시설 항목에 부여된 고유 식별번호● 시설명: 장애인 지역사회 재활시설의 명칭● 소재지: 해당 시설의 도로명 또는 지번 주소● 전화번호: 시설의 대표 연락처● 대지규모(㎡) / 건물규모(㎡): 부지 및 건축 면적 정보● 운영주체: 시설을 운영하는 법인 또는 기관● 종사자수(정원)/(현원): 인가된 인원 대비 실제 종사 인원 수● 인가일: 행정기관의 설치 인가일● 이용자수(정원)/(현원): 수용 가능 및 실제 이용 중인 장애인 수● 비고: 이용자 장애유형(시각장애, 뇌병변장애 등)'
