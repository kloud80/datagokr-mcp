description_portal: 총 153개의 실험 레코드로, NPC 계열 화합물들이 DNA, RNA, quadruplex DNA, i-motif DNA 등 다양한 핵산 구조와 상호작용하는 데이터를 담고 있습니다. 각 행에는 실험유형(nucleic acid format), 화합물ID, 대상 핵산명/생물종, (해당 시) 유니프롯ID, 그리고 Kb, IC50, EC50, Activity, INH 등 생물학적 활성 시험 매개변수와 결과값이 정리되어 있습니다. 자료출처는 CHEMBL 액티비티 ID로 관리되어 있어, 원 논문·실험 세부정보를 추적하거나 추가 해석을 할 수 있는 구조입니다. 주로 핵산 결합 친화도, 억제/활성 여부를 통해 해당 화합물의 핵산 결합 특성 및 잠재적 약리기전을 파악하는 데 활용할 수 있는 데이터입니다.
