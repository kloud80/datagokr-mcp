summary_user: 건강보험심사평가원이 경기도 내 병원의 위암 수술·치료 성과를 평가해 1~5등급(GRAD, 숫자가 낮을수록 우수)으로 매긴 결과를 병원 단위로 담고, 시군명·병원명·평가내역과 도로명·지번 주소, 좌표가 함께 들어 있다. 위암 수술을 앞둔 환자나 가족이 '우리 시군에서 위암 치료 등급이 좋은 병원은 어디인가'를 확인하거나, 분석가가 지역별 암 치료 접근성을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원명·주소 매핑이나 시군코드(SIGUN_CD)로 잇고, 좌표로 공간 결합한다.
description_portal: 병원평가정보(위암) 현황은 건강보험심사평가원이 경기도 내 병원의 위암 수술 및 치료성과를 종합적으로 분석해 등급화한 데이터입니다. 등급(GRAD)은 종합 점수에 따라 1~5등급으로 구분되며, 숫자가 낮을수록 치료 성과가 우수한 기관입니다. 평가결과는 위절제술, 내시경절제술, 보조항암화학요법 지표 등 다양한 임상 정보를 기반으로 하며, 특정 기준(평가 건수 미달, 보조요법 지표 3개 미만 등)에 해당하는 기관은 등급제외 처리됩니다. 데이터에는 시군명(SIGUN_NM, SIGUN_CD), 병원명(INST_NM), 평가내역(DIV_NM), 병원주소 및 좌표(REFINE_ROADNM_ADDR, REFINE_LOTNO_ADDR, REFINE_ZIP_CD, REFINE_WGS84_LAT, REFINE_WGS84_LOGT)가 포함됩니다. 이 데이터는 위암 치료 병원 비교, 암 치료 접근성 분석, 지역별 의료 역량 평가, 보건정책 수립 등의 목적으로 활용할 수 있으며, 등급 해석 시 "점수가 높을수록 치료 효과는 낮음"이라는 점을 주의해야 합니다.
