description_portal: 동물용의약품도매상 인허가 정보는 반려동물·축산동물에 사용되는 의약품을 도매 유통하는 업체의 인허가일자, 영업상태명, 소재지주소, 업종분류 등을 포함하는 자료로, 동물의약품의 유통 안전성과 품질 관리를 위해 필수적으로 관리해야 하는 행정 데이터이다. 의약품 도매업체는 동물병원과 사육시설 등으로 의약품을 공급하는 중심 역할을 하기 때문에, 업체 수·영업상태·공간적 분포는 지역 동물보건 인프라의 안정성을 평가하는 중요한 기준이 된다. 본 자료는 중부원점TM(EPSG:2097) 좌표계를 사용하여 위치를 제공하며 위경도 좌표는 제공되지 않는다, 따라서 GIS 분석 시 좌표 변환이 필요하다. 또한 3일 전 기준으로 갱신된 최신 인허가 상태를 제공하여, 불법 유통 방지, 동물약품 관리 정책, 품질관리 체계 구축 등 행정적 대응에 신속히 활용할 수 있다.
