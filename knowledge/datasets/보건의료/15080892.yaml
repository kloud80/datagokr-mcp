summary_user: 중앙보훈병원 욕창진료센터 환자의 진료 건별 진단 정보를 담는 API로, 환자번호(PT_NO) 단위로 진료 시작일·종료일, 종료사유, 진단 코드와 진단명, 입원·처방 관련 일자를 제공합니다. 병원 운영 분석가나 연구자가 보훈병원 욕창 환자는 어떤 진단으로 얼마 동안 치료받고 어떤 사유로 치료를 마치는지를 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 진단 코드(DISS_CD)·진단명 같은 이름·코드 매핑이나 같은 기관의 다른 보훈병원 데이터와만 이어 쓴다.
description_portal: '보훈병원 환자의 진료시작일,종료일,종료사유,진단명,치료부위명,치료단계.소요시간 등에 대한 데이터보훈병원: 보훈병원은 1981년 보훈공단 설립 이후 250병상 규모의 원호병원에서 출발하여 정부의 보훈대상자 의료지원 범위 확대 및 고령화에 따른 복합·만성질환으로 의료수요가 증가함에 따라 의료시설을 단계적으로 확충하였으며 자세한 소재지는 아래와 같음1. 중앙보훈병원(강동구 진황도로 61길 53)2. 부산보훈병원(사상구 백양대로 420)3. 광주보훈병원(광산구 첨단월봉로 99)4. 대구보훈병원(달서구 월곡로 60)5. 대전보훈병원(대덕구 대청로 82번길 147)6. 인천보훈병원(미추홀구 인주대로 138)'
