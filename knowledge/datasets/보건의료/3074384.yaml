summary_user: 건강보험 치료재료의 급여·비급여 목록을 품목 단위로 조회하는 API로, 품목명·제조·수입업체명·규격·단위·상한단가·급여구분과 대·중분류 코드를 담는다. 요양기관이나 의료기기 업체, 분석가가 특정 치료재료의 급여 여부와 상한단가가 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어서 품목명·분류코드 매핑이나 같은 기관의 다른 코드 데이터(약가·EDI 행위·KCD 등)와 코드 기준으로 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 기관 데이터와는 이름·코드 매핑을 직접 해야 한다. 검증 호출에서는 전체 건수 1, 수신 1행만 확인되어 실제 수록 규모와 갱신 주기는 이 자료로 알 수 없다. 적정성 평가·검진·DUR·재정 정보는 이 범위에 포함되지 않는다.
