summary_user: 전국 요양기관별로 혈액투석·항생제 처방률·주사제 처방률·약품목수·만성폐쇄성폐질환·폐렴·중환자실 등 평가항목별 병원평가등급(1~5등급 또는 등급제외)을 기관 단위로 담고, 기관명·종별·주소도 함께 제공한다. 환자나 보호자가 "우리 동네에서 항생제 처방률 평가가 좋은 의원은 어디인가", "혈액투석 1등급 병원은 어디인가" 같은 질문을 확인하는 데 쓴다. 암호화된 요양기호(ykiho)를 키로 심평원 병원정보서비스의 병원기본목록 등 요양기관 API와 연결해 진료과·병상·인력·진료시간 정보와 함께 본다.
limits: 요양기호는 1:1로 암호화된 값만 제공되고 복호화 방법이나 원래 요양기호는 제공되지 않으므로, 다른 기관 데이터와 연결하려면 심평원 API의 ykiho를 거쳐야 한다. 평가 등급만 담고 있어 등급 산출에 쓰인 세부 지표값은 이 필드 목록으로 확인할 수 없다. 개발계정은 일 10,000회로 호출이 제한된다.
