summary_user: 대구광역시 서구 관내 약국을 한 곳씩 담아 약국명·주소와 함께 출입문 유형, 휠체어 출입 가능 여부, 출입구 폭·턱 높이, 경사로, 테이블 높이, 장애인 주차장·화장실 설비 같은 접근성 항목을 기록한 건별 데이터다. 휠체어 이용자나 고령자가 서구에서 턱이 없고 장애인 화장실이 있는 약국을 미리 찾거나, 분석가가 약국 접근성 수준을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 약국·의료기관 데이터와는 약국명(b_store_name)이나 주소로 맞춰 이어 써야 한다.
description_portal: 대구광역시 서구 관내 약국 현황을 바탕으로 출입구 폭, 휠체어 출입가능 유무, 장애인 화장실 유무 등의  교통약자를 위한 상세데이터를 제공하는 서비스본 데이터는 대구광역시 서구청이 제공하는 교통약자를 위한 약국의 접근성 및 편의시설 정보를 담고 있는 자료이다. 데이터는 약국의 명칭과 주소, 출입문 유형(미닫이문, 여닫이문, 자동문 등), 휠체어 출입 가능 여부, 출입구 폭, 전면 유효거리, 턱 높이, 입구 경사로 설치 여부, 손잡이 및 점자 표기 유무, 미끄럼 방지판 설치 여부 등의 항목으로 구성된다. 이외에도 테이블 배치 여부와 높이, 장애인 전용 주차장 및 화장실 설치 유무, 세면대와 변기 관련 항목이 포함되어 있다. 본 데이터는 교통약자가 약국 이용 전 시설의 접근성과 편의성을 사전에 확인하는 데 유용하며, 향후 공공시설 접근성 향상 및 정책 수립을 위한 기초자료로도 활용 가능하다.
