description_portal: 서울시 주관적 정신건강 수준 데이터는 시민이 스스로 평가한 정신건강 상태를 연도별·지역별로 파악하기 위해 구축된 통계 자료입니다. 이 데이터는 조사 대상 지역과 해당 연도에 속한 주민들이 자신의 정신건강을 좋은편, 보통, 좋지 않은편, 모름·무응답으로 응답한 결과를 수치로 정리한 것입니다. 이를 통해 각 지역에서 정신건강을 긍정적으로 인식하는 인구와 부정적으로 인식하는 인구의 비율을 비교할 수 있으며, 특정 지역에 정신건강 취약 계층이 상대적으로 많은지, 또는 전반적으로 안정적인지를 판단할 수 있습니다. 또한 시기별 변화를 분석함으로써 사회·경제적 변화, 정책 시행, 지역 정신건강 서비스 확대 등이 시민 정신건강 인식에 미친 영향을 추정하는 데 활용할 수 있습니다. 이 데이터는 정신건강 증진 사업 기획, 상담 및 치료 인프라 확충, 지역 맞춤형 복지 정책 설계 등 실질적인 정책 수립의 기초 자료로 활용 가치가 높은 자료입니다.
