summary_user: 국립목포병원 한 곳의 입원·외래 진료 수입금을 보험유형과 외래/입원 구분, 작업년월별로 집계한 파일로, 건수·연인원(입원 1명이 10일이면 10명으로 셈)·총진료비·급여총액·비급여총액·본인부담액·조합부담액·개인부담액을 담는다(csv 약 6.8KB). 공공병원 운영을 분석하는 사람이 '이 병원의 외래와 입원 진료비 가운데 보험 유형별 환자 본인부담은 얼마이고 월별로 어떻게 바뀌나' 같은 질문을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 같은 기관 코드, 작업년월을 맞춰 이어 쓴다.
description_portal: 국립목포병원 입원 및 외래 수입금에 관련된 데이터로, 종별 구분, 연인원, 총진료비, 비급여총액, 본인부담금 등의 외래/입원 수입금 현황을 제공합니다.입원 및 외래 수입금 현황은 국립목포병원 입원환자와 외래환자 진료에 따른 수입금의 현황과 관련된 데이터로 종별(보험유형), 구분(외래, 입원), 작업년월, 건수, 연인원, 총진료비, 급여총액, 비급여총액, 본인부담액, 조합부담액, 개인부담액으로 구성되어 있습니다.데이터 칼럼 상세설명○ [종별] 칼럼은 보험구분(보험유형)○ [구분] 칼럼은 외래 또는 입원에 따른 분류○ [연인원]  총 인원수를 설명하는 데이터 * 실인원과는 다른 데이터로 환자 1명이 입원치료를 10일간 한 경우 실인원은 1명, 연인원은 10명으로 합산합니다.
