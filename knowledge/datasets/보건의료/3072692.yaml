summary_user: 2025년 기준 전국 지역보건의료기관(보건소·보건지소·보건진료소) 3,607곳을 기관별 한 행으로 담은 원천 목록이다. 주민이 사는 시군구에서 가까운 보건기관의 이름·주소·대표전화를 찾는 질문이나, 분석가가 시도·시군구별 보건기관 분포를 살피는 질문에 쓴다. 주소(address) 필드를 키로 다른 주소 기반 데이터와 이을 수 있고, 시도·시군구 이름으로 지역 단위 통계와 맞춰 볼 수 있다.
description_portal: '2025년 기준 전국 지역보건의료기관 현황으로 시도, 시군구, 보건기관 유형, 상위 보건기관명, 보건기관명, 주소, 읍면동명, 도서지역여부, 대표전화번호 등에 대한 정보를 제공합니다.<데이터 이용 시 참고사항>1. 전국의 지역보건의료기관은 지역 주민의 건강을 증진하고 질병을 예방하기 위해 설립된 공공의료기관2. 보건소 : 예방접종, 감염병 관리, 만성질환 관리, 건강검진 등 포괄적인 보건서비스 제공3. 보건지소 : 보건 지원기능, 1차 진료, 건강관리, 임산부/노인 대상 서비스4. 보건진료소 : 방문진료, 응급처치, 기초진료, 건강상담 등의 역할'
