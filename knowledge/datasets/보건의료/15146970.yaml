summary_user: 서울 강서구 소독업체의 인허가 정보를 업소별로 담은 원천 데이터로, 인허가일·취소일, 영업상태와 상세상태, 폐업·휴업 일자, 주소·좌표, 사무실 면적과 분무기·방독면·보호복 같은 소독 장비 보유 수량을 포함한다. 주민이나 시설 관리자가 '강서구에서 지금 영업 중인 적법한 소독업체는 어디인가'를 확인하거나, 분석가가 소독업체 개폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해서, 다른 데이터와는 업체명·주소 매핑이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 연결하며 관리번호는 같은 인허가 원천 안에서 업소를 구분하는 데 쓴다.
description_portal: 서울시 강서구 내 소독업체에 대한 인허가 정보는 감염병 예방 및 위생 환경 개선을 위한 핵심 자료입니다. 해당 데이터는 소독을 목적으로 하는 시설, 병원, 다중이용시설 등에 위생 방역 서비스를 제공하는 업체들의 인허가 현황을 포함하고 있습니다. 이를 통해 행정기관은 법정 전염병 예방 활동의 기반을 마련하고, 위생취약지역의 방역망을 촘촘하게 구축할 수 있습니다. 또한 민원 처리 시 소독 업체의 적법성 확인, 사업자 유효성 판단 등에 활용되며, 감염병 대응 역량을 높이기 위한 데이터 기반 행정에 활용됩니다. 인허가일, 운영 상태, 관리번호 등의 정보를 통해 시계열 분석 및 위생정책 수립에 유용합니다.
