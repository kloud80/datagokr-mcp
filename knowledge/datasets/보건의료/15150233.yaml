description_portal: '□ 데이터 개요본 데이터는 의료급여 제도의 운영과 관련하여 질환별 상병 정보를 관리하기 위해 구축된 행정관리용 메타데이터입니다. 실제 환자 진료 내역이나 민감 개인정보를 포함하지 않고, 질환 유형별 상병 발생 및 관리 기간 정보를 기록함으로써 의료급여 관련 자료를 행정적으로 관리하는 체계를 제공합니다. □ 주요 내용데이터는 총 4개의 항목으로 구성됩니다.1. 질환종류구분: 의료급여 대상 질환을 행정·진료 목적에 따라 네 가지 유형으로 구분    A: 희귀난치성질환 → 발생 빈도가 낮고 치료가 어려운 질환    B: 고시질환 → 보건복지부 고시에 의해 지정된 질환    C: 기타질환 → 위 유형에 속하지 않는 일반 질환    D: 중증등록질환 → 중증으로 등록되어 관리되는 질환2. 변경일자: 상병 관련 정보가 변경된 일자3. 상병시작일자: 해당 상병이 발생하거나 관리가 시작된 일자4. 상병종료일자: 상병 관리가 종료된 일자* “빈 셀은 데이터가 존재하지 않음을 의미하며, 공란(null value)으로 처리됩니다.”'
