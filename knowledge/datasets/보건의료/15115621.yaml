summary_user: 서울 강서구의 안전상비의약품 판매업소(편의점 등)를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일자·폐업일자·영업상태·사업장명·지번/도로명 주소·전화번호·좌표(X, Y)를 포함한다. 주민이나 위치 기반 서비스 개발자가 '밤에 우리 동네에서 상비약을 살 수 있는 영업 중인 편의점이 어디인가'를 확인하거나, 분석가가 강서구 안의 상비약 판매처 분포를 살피는 데 쓴다. 다른 데이터와 공통으로 쓸 전역 조인 키는 없어서, 다른 구의 같은 인허가 데이터나 의약품 데이터와는 사업장명·주소를 맞추거나 개방자치단체 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울특별시 강서구 내 안전상비의약품 판매업소에 대한 인허가 정보를 제공하는 데이터로, 해당 업소는 의사의 처방 없이도 구매 가능한 일반의약품을 판매하는 편의점, 약국 등을 포함합니다. 제공 항목은 인허가일자, 현재 영업상태, 사업장명, 주소, 전화번호 등으로 구성되며, 시민들이 응급 상황 시 손쉽게 의약품을 구매할 수 있는 접근성을 판단하는 데 활용됩니다. 또한, 지역 내 의약품 공급의 분포와 편의성 분석, 보건 정책 수립, 민간 기업의 위치 기반 서비스 개발 등 다양한 용도로 활용할 수 있는 실질적인 자료입니다. 공공보건, 응급약품 유통망 관리, 시민 건강권 보장 등과 관련한 행정 및 민간 활용 사례에도 적합한 데이터입니다.
