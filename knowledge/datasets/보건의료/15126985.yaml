description_portal: '서울특별시 마포구 관내에 위치한 병원급 의료기관의 정보입니다. 이 데이터에는 각 병원이 위치한 구체적인 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 도로명 주소 또는 지번 주소가 포함되어 있어, 병원의 정확한 위치를 확인할 수 있습니다.또한, 의료기관명 등 기본적인 정보가 제공됩니다. 또한  위경도와 전화번호, 면적 등의 세부사항도 포함되어 있습니다.이 데이터를 통해 주민들은 가까운 병원의 위치, 진료 과목, 운영 여부 등을 쉽게 파악하여 필요한 의료 서비스를 빠르게 이용할 수 있으며, 행정기관은 관내 의료 인프라의 분포 및 현황을 체계적으로 관리하고 보건의료 정책 수립, 응급의료체계 운영 등에 활용할 수 있습니다.'
