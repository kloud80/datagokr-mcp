description_portal: 울산광역시 북구의 코로나19 일자별 확진자 현황으로 2020. 1. 1.부터 2020. 12. 31.까지의 정보가 제공됩니다.해당데이터에 포함된 연도 정보는 코로나 확진자수가 증가하기 시작한 시기로, 확진자에 대한 격리 정책이 순차적으로 진행되던 시기의 데이터 입니다.데이터로 방역정책의 효과, 계절과 기온이 코로나 확진자수에 미치는 상관관계, 보건 인프라에 따른 대처율, 기간별 감영 집중도 분석 등에 활용할 수 있습니다.최근에는 백신의 개발, 확진자수의 감소, 많은 변형으로 확진자수가 유의미한 데이터가 아니라고 판단하여 업데이트 되지 않고 있으니 참고 바랍니다.
