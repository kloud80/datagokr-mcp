description_portal: 이 데이터는 질병관리청이 제공하는 HIV 검사 참여 기관에 대한 정보입니다. HIV (항원/항체) 검사와 관련된 공공기관 및 민간 기관의 목록을 담고 있으며, '강원도광릉보건소', '강원보건연구원' 등 전국 각지의 보건소 및 보건연구원 정보가 포함됩니다. 총 272개의 기관 정보가 있으며, 이는 HIV 검사의 지역별 접근성과 감염병 관리를 위한 공공 인프라를 파악하는데 중요한 기초자료로 활용됩니다. HIV 감염병 예방 및 관리 정책을 수립하고, 검사 체계를 효율적으로 운영하는데 필수적인 정보를 제공합니다.
