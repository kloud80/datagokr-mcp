description_portal: '○ 통계개요* 통계명 : 장기기증 및 이식* 작성목적 : "장기등 이식에 관한 법률"에 의거 장기의 공정하고 효율적인 배분 및 관리를도모하고, 장기의 불법 매매행위를 방지하여 국민보건향상에 이바지함을목적으로 함* 법적근거 : ?장기등 이식에 관한 법률? 제10조 제2항 제4호* 조사체계 : 장기이식관련기관, 제대혈이식관련기관, 장기기증희망등록기관으로부터정보를 통보받아 작성* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 장기, 안구, 골수기증자 수 및 이식건수○ 용어설명* 장기등: 사람의 기관 또는 조직중 다른사람의 장기 등의 기능회복을 위하여 적출하여이식될 수 있는 있는 것- 신장, 간장, 췌장, 심장, 폐, 골수, 각막 등 사람의 여러 기관* 기증자 : 다른 사람의 장기등의 기능회복을 위하여 대가없이 자신의 특정한 장기등을제공하는 자* 이식 : 장기등을 이식 받은 경우* 뇌사자 : 뇌사판정기준 및 뇌사판정 절차에 따라 뇌 전체의 기능이 되살아날 수 없는상태로 정지되었다고 판정된 사람* 뇌사기증자 : 뇌사자로서 장기등을 기증한 자* 뇌사이식 : 뇌사기증자로부터 장기등을 이식받는 경우* 생존시기증자 : 살아있는 사람으로서 장기등을 기증한 자(신장, 간장, 췌장, 췌도, 소장, 골수)* 생존시이식 : 살아있는 사람으로부터 장기등을 이식받는 경우* 골수이식 : 정식명칭은 골수조혈모세포이식이며, 백혈병이나 암 환자에게 적절한 시기에이식을 하여 새 생명을 얻게 하는 치료행위'
