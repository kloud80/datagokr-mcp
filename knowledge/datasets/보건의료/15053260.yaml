description_portal: '본 데이터는 전주시 내 안경업 인허가 정보를 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명 등 기본 정보와 함께 시력표, 표본렌즈, 측정의자, 동공거리측정기, 정점굴절계, 조제용연마기, 렌즈절단기, 안경세척기 등 주요 장비 보유 현황도 포함되어 있습니다. 이를 통해 안경업 창업 준비, 기존 업소 현황 분석, 지역 내 안경업 서비스 접근성 평가, 관련 정책 수립 등에 활용할 수 있습니다. 또한 장비 보유 수준을 기반으로 서비스 품질 평가나 업소 간 비교 분석이 가능하여, 안경업계 경쟁력 강화와 소비자 만족도 향상에 기여하는 기초 자료로도 유용합니다.안경업 : 눈을 보호하거나 시력의 교정을 요하는 대상에게 시력의 교정 및 안경을 판매 또는 수리하는 업소항목 : 사업장명, 인허가일자, 상세영업상태, 소재지전화번호, 도로명주소, 지번주소, 위도, 경도 등데이터 제공부서 : 보건행정과'
