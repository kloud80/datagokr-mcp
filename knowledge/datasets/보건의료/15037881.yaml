description_portal: 본 데이터는 서울특별시 중랑구의 연도별 흡연민원, 금연구역 내 흡연 단속, 중랑구 내 흡연시설 및 부스 운영 현황 등 흡연과 관련된 정보들을 제공합니다.1. 2013년 ~ 2026년 연도별 흡연 관련 민원 (중랑구 관내 흡연행위 단속 및 지도 요청, 금연구역 지정, 흡연부스 설치 요청 등)2. 2013년 ~ 2026년 연도별 국민건강증진법 제9조 및 서울특별시 중랑구 간접흡연 피해방지 조례 제5조에 의거한 금연구역(시설) 내 흡연행위 위반 단속 건수3. 2013년 ~ 2026년 연도별 서울특별시 중랑구 내  흡연자의 편의 등을 위해 지정된 흡연 가능 구역 또는 설치형 구조물의 수- 흡연시설 및 부스에 대한 위치, 시설명, 개소수 등 자세한 정보는 연도별 제공되지 않으며, 서울특별시_중랑구_흡연시설 현황에서 확인 가능합니다.- 흡연시설 및 부스에 대한 위치, 시설명에 대한 정보는  금연구역(시설)의 이설, 개업, 폐업 등에 따라 실제 자료와 차이가 있을 수 있음을 알려드립니다.- 서울특별시 중랑구 금연구역(시설)은 서울특별시_중랑구_금연구역 현황에서 확인 가능합니다.
