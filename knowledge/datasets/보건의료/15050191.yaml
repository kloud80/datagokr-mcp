summary_user: 질병관리청 청소년건강행태조사 응답을 바탕으로, 평생 음주 경험이 있는 청소년이 처음 1잔 이상 술을 마신 평균 연령을 연도별로 전국 단위 집계한 지표로, 전체·남녀·중1~고3 학년별 값을 담은 작은 CSV 파일(621 bytes)이다. 청소년 음주예방 사업 담당자나 연구자가 '청소년의 첫 음주 연령이 해마다 낮아지고 있는가, 성별로 차이가 있는가'를 확인할 때 쓴다. 전역 조인 키가 없고 지역 구분 없는 전국 값이라, 같은 기관의 다른 청소년 음주행동 지표와 연도 열을 기준으로 나란히 놓아 비교하는 방식으로 이어 쓴다.
limits: 전국 단위 비공간 집계라 시도·시군구 등 지역별 비교에는 쓸 수 없다. 포털 설명상 2016년부터 학년별 통계가 발표되지 않아 이후 연도의 학년별 값은 비어 있을 수 있다. 공통 조인 키가 없어 다른 데이터와는 연도 등 이름 매핑으로만 연결된다.
