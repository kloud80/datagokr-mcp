description_portal: 음주폐해예방 관련 지표- 질병관리청 청소년건강행태조사 응답을 바탕으로 청소년이 처음으로 음주를 경험한 평균 연령을 산출한 지표입니다. - 음주시작연령은 평생 음주 경험자 중에서 처음으로 1잔 이상 술을 마신 연령의 평균이며, 2016년부터 학년별 통계는 미발표되고 있습니다.- 데이터는 남여, 중학교1학년부터 고등학교 3학년까지 학년별로 구분하여 최초 음주 연령을 제공하고 있습니다. - 본 데이터는 청소년 음주폐해예방 및 절주문화 확산을 위한 연구 시 기초자료로 활용될 수 있습니다.
