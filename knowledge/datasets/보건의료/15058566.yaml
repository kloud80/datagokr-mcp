summary_user: 경기도 시군별 동물장묘 허가업체를 업체 한 곳당 한 행으로 담으며, 사업장명·대표자·전화번호·지번/도로명 주소·우편번호·WGS84 좌표를 포함한다. 반려동물 보호자가 우리 시군에 허가받은 동물 장례식장·화장장·봉안시설이 있는지 찾거나, 분석가가 시군별 장묘시설 분포와 접근성을 점검할 때 쓴다. 전역 조인 키는 없어서 시군명(SIGUN_NM)이나 주소 문자열 매칭으로 다른 시군구 데이터와 잇고, 좌표로 지도·거리 분석에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 동물장묘 허가업체 현황을 제공하는 자료로, 반려동물 장례식장, 화장장, 납골시설 등 동물전용 장묘시설의 정보를 포함하고 있습니다. 항목으로는 시군명, 사업장명, 대표자명, 전화번호, 지번주소 및 도로명주소, 위도·경도 좌표값 등이 포함되어 있어, 해당 지역 내 반려동물 장묘시설의 분포 및 접근성을 파악할 수 있습니다. 반려동물 증가에 따라 장례문화의 중요성이 커지는 상황에서, 본 데이터는 동물복지정책 수립, 시설 인프라 점검, 서비스 제공 현황 분석 등 다양한 행정 및 연구 목적에 활용될 수 있습니다. 데이터는 반기 단위로 갱신되며, Open API를 통해 실시간 정보 접근이 가능합니다.
