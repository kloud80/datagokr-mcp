description_portal: 울산광역시 중구에 소재한 예방접종 지정기관들에 대한 데이터로 병원명, 연락처, 주소, 접종항목 등의 항목을 제공합니다.울산광역시 중구에서는 가까운 병‧의원을 통해 인플루엔자, 폐렴구균 등 다양한 예방접종을 받을 수 있습니다. 여러 의료기관이 참여하고 있으며, 어린이 국가예방접종과 어르신 인플루엔자, 폐렴구균 예방접종은 물론 일부 기관에서는 HPV 예방접종과 임신부 대상 접종도 가능합니다.각 병원별로 접종 가능 백신과 주소, 전화번호가 안내되어 있으므로, 필요한 경우 가까운 의료기관으로 직접 문의해 접종 일정을 확인하실 수 있습니다. 예방접종은 감염병을 예방하고 건강을 지키는 가장 효과적인 방법이므로, 시민 여러분께서는 기간 내 의료기관을 방문해 접종을 완료하시기 바랍니다.
