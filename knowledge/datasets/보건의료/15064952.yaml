summary_user: 인천광역시 군·구별로 보건지소와 보건진료소에 근무하는 인력 수를 의사(의무직·계약직·공중보건의), 치과의사, 한의사, 약사, 간호사, 의료기사, 간호조무사, 행정·보건·기능직 등 직종별로 집계한 작은 통계 파일(CSV 686바이트)이다. 우리 군·구 보건지소에 공중보건의나 간호사가 몇 명 있는지, 어느 군·구가 보건 인력이 상대적으로 적은지를 비교하는 데 쓴다. 전역 조인 키나 코드 컬럼이 없어 다른 보건소·시군구 통계와는 군·구 이름(군구별)을 맞춰 연결해야 한다.
description_portal: 인천광역시 보건지소 및 보건진료소 인력 통계 현황 공공데이터는 우리 동네 보건소에 어떤 보건 전문가들이 몇 명이나 일하고 있는지를 알려주는 자료입니다.  이 데이터에는 각 보건소의 의사, 간호사, 보건직 등 인력의 직종별, 성별, 연도별 인원수가 기록되어 있습니다. 시민들은 이 정보를 통해 우리 동네 보건 서비스의 규모를 알 수 있고, 정부는 보건 인력이 부족한 지역을 파악하여 인력을 효율적으로 재배치하거나 보건 서비스의 질을 높이기 위한 정책을 수립하는 데 활용합니다.해당 데이터는 국가통계포털(KOSIS)에서 참고 하였으며 공공데이터포털에서도 무료로 다운로드 할 수 있습니다.
