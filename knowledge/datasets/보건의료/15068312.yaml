summary_user: 한국건강증진개발원의 유아 흡연위해예방 교육자료를 유아 교육기관이 신청한 내역을 교재 제목·신청 시작일·종료일·신청자 수 단위로 담은 전국 단위 소규모 파일(CSV 약 501바이트)이다. 보건교육 담당자나 정책 분석가가 "개발원이 배포한 유아 흡연예방 교재가 현장에서 얼마나 신청·활용됐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 지역·기관 코드가 없어 다른 데이터와는 교재 제목이나 같은 기관 기준으로만 느슨하게 이어 볼 수 있다.
description_portal: 유아흡연위해예방교육을 위한 교재 신청 정보 - 본 데이터는 2018년 부터 유아를 대상으로 교육을 수행하는 기관에서 교육자료를 신청한 정보를 제공합니다.  - 데이터는 신청한 교육자료의 제목, 교육자료 신청시작일자, 신청종료일자, 교육자료를 신청한 신청자수 등의 항목을 제공합니다. - 본 데이터서는 현장에서 유아 흡연예방을 위한 교육수행 시 한국건강증진개발원의 교육자료를 어느정도 활용 했는지 확인할 수 있습니다.  - 참고사항으로 2021년 이후로는 신규로 신청한 사례가 없습니다.
