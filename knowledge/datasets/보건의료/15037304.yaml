summary_user: 전라남도(현 전남광주통합특별시) 안에 있는 보건진료소를 한 곳당 한 행으로 담은 목록 파일로, 시군명·기관명·도로명 주소·전화번호·진료과목·진료시간을 담는다(약 37KB 규모의 CSV). 농어촌·도서·산간 주민이나 보건 담당자가 "우리 동네 가장 가까운 보건진료소는 어디고 언제 진료하나"를 확인하거나, 분석가가 시군별 공공 1차 진료기관 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 보건소·의료기관 데이터와는 시군명·기관명 이름 매칭이나 도로명 주소 기반 지오코딩으로만 이어 쓴다.
description_portal: '- 전라남도 내에 소재하고 있는 보건진료소 현황에 대한 데이터를 제공합니다. (시군명, 기관명, 소재지, 전화번호, 진료과목, 진료시간 등)- 전라남도 내 각 지역에 위치한 보건진료소(보건소·지소보다는 규모는 작지만, 일차진료·예방접종·노인·가정 방문 건강관리 등을 담당하는 공공의료기관)입니다.- 각 시군의 보건소·보건지소 웹사이트에서 진료소별 연락처, 운영시간, 제공 서비스(예: 예방접종·건강 상담 등)를 확인하실 수 있습니다.- "보건진료소"는 주로 농어촌·도서·산간 지역 주민들의 건강을 책임지는 공공 1차 진료기관입니다. 규모는 작지만, 주민 밀착형 보건 서비스를 제공하는 중요한 의료 거점입니다.'
