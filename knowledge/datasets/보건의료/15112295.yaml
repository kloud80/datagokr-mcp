summary_user: 부산광역시 사상구 관내 의료기관별로 의료기관명·개설자명·종별·허가 병상 수와 CT·MRI 특수의료장비 공동활용병상 동의 현황을 담은 기관 단위 원천 파일(csv, 399바이트)이다. 사상구에서 CT·MRI를 설치하려는 의료기관이나 행정 담당자가 인근 어느 병원이 공동활용병상 제공에 동의했는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 의료기관 인허가 자료(LOCALDATA 등)와는 의료기관명 매칭으로만 이어 쓴다.
description_portal: 부산광역시 사상구 관내 의료기관 특수의료장비 동의현황자료는 사상구 관내에서 공동으로 활용 가능한 병상 현황을 파악할 수 있도록 구성되어 있습니다. 이를 통해 인접 의료기관은 특수의료장비 운용을 위한 행정적 요건을 검토하고, 공동활용 동의 여부를 확인할 수 있습니다.■ 소분류(세부 항목) 구성본 자료는 다음과 같은 세부 항목으로 구성되어 있습니다.의료기관명사상구 관내에 등록된 의료기관의 공식 명칭을 기재합니다.개설자명해당 의료기관을 개설·운영하는 개인 또는 법인의 명칭을 표시합니다.의료기관 종별병원, 의원, 종합병원 등 의료법에 따른 의료기관의 유형을 구분하여 제공합니다.병상 수해당 의료기관이 보유하고 있는 총 허가 병상 수를 나타냅니다.공동활용병상 동의 현황특수의료장비 공동활용을 위해 병상 제공에 동의한 병상 수 및 동의 여부를 표시합니다.
