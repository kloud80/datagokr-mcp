description_portal: 이 데이터는 특정 지역과 상병그룹에 따른 진료인원을 분석한 데이터입니다. 2011년부터 2020년까지의 월별 진료 현황을 포함하며, 서울, 인천, 대전, 대구, 광주, 울산, 부산 등 7개 대도시와 시군구 단위로 세분화된 데이터를 제공합니다.<시트1. 특정 지역 및 상병그룹별 진료인원><시트2. 특정 지역 및 상병그룹별 시군구별 진료인원>* 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다.
