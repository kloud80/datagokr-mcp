description_portal: '□ 데이터 개요본 데이터는 의료급여 수급권자의 출산비 지급 내역을 출산 구분별로 정리한 조견표입니다. 각 출산 유형에 대해 적용 시작일자와 종료일자에 따른 지급 금액을 제공하여, 지급 시점별 지급액 변동 내역을 파악할 수 있도록 구성되어 있습니다.□ 주요 내용 - 출산구분: 자연분만, 제왕절개 등 출산 유형별 구분 - 적용시작일자, 적용종료일자: 해당 지급액이 적용되는 기간 - 지급액: 출산 유형 및 적용 기간에 따른 지급 금액(단위: 원)□ 활용 안내본 데이터는 의료급여 출산비 지급 기준과 변동사항 확인, 정책 분석 및 연구 등에 활용될 수 있습니다.※ 데이터는 최신 지급 기준을 기준으로 작성되었으며, 향후 제도 변경 시 갱신될 수 있습니다.'
