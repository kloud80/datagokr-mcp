summary_user: 부산 북구 관내에서 특수의료장비(CT·MRI) 설치 기관의 공동활용 병상 요청에 동의한 의료기관을 기관 한 곳당 한 행으로 담은 작은 파일(csv 약 1.8KB)로, 기관명·도로명주소와 CT·MRI별 동의 여부(Y/N)를 담는다. 자체 병상이 부족해 CT·MRI 설치 기준을 맞추려는 의료기관이나 지역 의료자원 분석가가 '북구에서 병상 공동활용에 동의한 병원은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관 데이터(LOCALDATA 인허가 등)와는 의료기관명이나 도로명주소를 맞춰 이어 쓴다.
description_portal: 부산 북구 관내 의료기관 현황입니다. 그중에 특수의료장비를 설치한 의료기관에 공동활용 병상 동의한 의료기관 현황입니다. CT 동의여부와 MRI 동의여부에 Y는 동의, N는 미동의 입니다.CT(전산화단층촬영장치)는 회전하는 X선관과 검출기를 이용해 인체내부를 단면으로 잘라내어 영상화하는 장치입니다.MRI(자기공명영상촬영장치)는 자기장과 고주파의 상호작용을 이용해 인체내부를 세부적으로 묘사하는 장비입니다.의료기관에서 특수의료장비를 설치 운영하려면 시설기준 병상수를 충족해야한다. 자체 병상수가 부족한 경우 인접한 의료기관의 병상을 공동활용하여 운영할 수 있다.
