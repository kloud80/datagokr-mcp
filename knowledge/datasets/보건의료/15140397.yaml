description_portal: 국립소록도병원 임상병리실에서 실시한 진단검사 건수 데이터로 각종 검사별 검사건수(ELISA, 혈액학검사, 뇨화학검사, 면역학검사 등)를 제공합니다.<통계 이용 시 참고사항>1. ELISA 검사 (Enzyme-linked immunosorbent assay)는 항원-항체 반응을 이용하여 특정 물질 (항원 또는 항체)의 존재 유무나 양을 측정하는 분석 방법입니다.2.혈액학 검사는 혈액 내 세포 성분(백혈구, 적혈구, 혈소판)의 수와 형태를 분석하여 질병을 진단하는 검사입니다. 3. 요화학검사는 소변을 이용한 검사로, 요시험지봉을 사용하거나 화학적 검사, 요침사 검사 등을 통해 신체 전반의 건강 상태를 확인하는 검사입니다.4. 면역학 검사(Immunoassay)는 항원-항체 반응을 이용하여 특정 물질을 검출하고 정량하는 검사 방법입니다.
