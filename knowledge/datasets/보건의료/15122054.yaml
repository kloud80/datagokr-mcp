description_portal: 본 데이터는 2020년 2월부터 2023년 8월까지 서울특별시 강동구 관내에서 발생한 코로나바이러스감염증-19(COVID-19)의 확진자 발생 및 감염 관리 현황을 일자별로 기록한 시계열(Time-series) 데이터입니다. 코로나19 사태의 시작점부터 감염병 등급이 하향 조정되어 엔데믹(풍토병화) 단계에 접어든 시기까지, 약 3년 6개월간의 구 전체 보건 및 방역 지표 흐름을 한눈에 파악할 수 있도록 구축되었습니다.본 자료는 단순한 확진자 발생 추이를 넘어 일별 신규 및 누적 확진자 수, 완치자 및 누적 완치자 수, 사망자 수, 자가격리 인원 등 코로나19와 관련된 전반적인 관리 지표를 포괄적으로 제공합니다.이러한 통계 자료는 강동구의 과거 감염병 대응 기록을 투명하게 보존하는 가치를 지닐 뿐만 아니라, 향후 지역사회 감염병 확산 모델링, 보건·의료 정책 효과 분석, 그리고 전염병이 미치는 사회·경제적 영향 연구 등 다양한 분야에 유용하게 활용될 수 있습니다.
