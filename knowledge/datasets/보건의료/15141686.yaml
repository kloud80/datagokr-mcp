summary_user: 서울특별시 용산구 관내 소독업체를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가·취소·폐업 일자, 영업상태, 소재지 지번·도로명 주소와 좌표, 사업장명, 분무기·방독면·보호복 등 보유 장비 수를 담는다. 구민이 "용산구에서 지금 영업 중인 소독업체는 어디이고 연락처는 무엇인가"를 확인하거나, 분석가가 소독업체의 신규 인허가·폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 이어 붙이며, 같은 LOCALDATA 형식의 다른 구 소독업 인허가 파일과 합쳐 서울 단위로 넓혀 쓴다.
description_portal: 서울특별시 용산구_소독업 인허가 정보에 대해 인허가 일자, 영업상태, 폐업일자, 전화번호, 주소, 사업장명, 분무기수, 방독면에 대한 정보를 제공합니다. 본 데이터는 서울특별시 용산구 관내에서 운영 중인 소독업체의 인허가 현황을 상세히 제공하는 자료입니다. 데이터에는 각 소독업체의 인허가 일자, 영업상태, 폐업 일자, 전화번호, 사업장 주소, 사업장명, 보유 분무기 수 등 소독업과 관련된 주요 정보가 포함되어 있습니다. 해당 자료는 「감염병의 예방 및 관리에 관한 법률」을 비롯한 관련 법령에 근거하여 등록 및 관리되고 있습니다.법적 기준에 따라 체계적으로 관리되는 소독업체 현황을 투명하게 공개함으로써, 구민들이 정확한 정보를 바탕으로 신뢰할 수 있는 소독 서비스를 선택할 수 있도록 지원하는 중요한 역할을 수행합니다. 또한 본 데이터는 정기적으로 갱신되어 최신 정보를 유지할 예정이며, 이를 통해 구민들은 소독업체의 영업상태 및 신규 인허가 현황 등의 변동 사항을 신속히 확인할 수 있습니다.결과적으로, 본 데이터는 서울특별시 용산구 내 소독업 인허가 현황을 투명하게 공개하여 구민의 신뢰를 제고하고, 관련 법령에 따른 관리와 정기적인 정보 갱신을 통해 지역사회의 공중위생 증진에 기여하고자 합니다.
