summary_user: 전국 의료기관별로 중환자실(성인·소아·신생아)과 격리병실 병상수를 한 기관당 한 행으로 담은 파일 데이터이며, 검증 시 765행이 수신됐다. 감염병 유행이나 중증환자 발생 때 지역별로 중환자실·격리병실을 갖춘 병원이 어디에 있는지 찾는 분석가나 지자체 담당자가 쓴다. 조인 키는 주소(address)뿐이어서 같은 심평원 요양기관 정보와는 주소 문자열로 맞춰 이어 쓰며, 요양기호는 제공되지 않는다.
description_portal: 데이터기준일 기준으로 제공하는 감염병 및 중증환자 치료를 위한 전국 의료기관별 중환자실 및 격리병실 병상 정보에 해당합니다.- 요양기관명, 요양기관 소재지(시도명, 시군구명, 주소), 요양기관종별, 표시과목, 중환자실 병상수 소계, 성인 중환자실 병상수, 소아 중환자실 병상수, 신생아 중환자실 병상수, 격리병실 병상수를 포함하는 데이터입니다.※ 치과병원, 치과의원, 한의원, 한방병원, 조산원, 약국은 제외하였으니 데이터 열람 시 참고하시기 바랍니다.※ 요양기호는 별도로 제공하고 있지 않으므로 참고하시기 바랍니다.
