summary_user: 국민건강보험가입자와 의료급여수급권자 가운데 고혈압 또는 당뇨병 진단과 함께 해당 약제를 처방받은 환자의 비율을 기준연도·전국 시도·시군구·성별·연령그룹(10세 단위)별로 집계한 파일이다. 지역 보건 담당자나 분석가가 '우리 시군구의 50대 남성 고혈압·당뇨 의료이용률이 전국보다 높은가'와 같은 지역·연령별 만성질환 관리 수준 비교에 쓴다. 실측 컬럼에 전역 조인 키(행정구역 코드 등)가 없어, 다른 통계와는 시도·시군구 이름과 기준연도를 맞춰 이어 써야 한다.
description_portal: '국민건강보험가입자 및 의료급여수급권자 중 고혈압 또는 당뇨병 환자의 비율○ 시도 및 시군구: 전국 17개 시도의 시군구별 구분  - 연초 기준 지명 구축. 연중에 지명이 바뀌는 경우 거주자 중 지명 변경 후 정보 이동이 있었던 일부만 반영○ 성별: ALL(전체), 1(남성), 2(여성)○ 연령그룹: ALL(전체), 00(10세미만), 10(10대), 20(20대), 30(30대), 40(40대), 50(50대), 60(60대), 70(70대), 80(80세이상)○ 분모(명): 국민건강보험가입자 또는 의료급여수급권자 수○ 분자(명): 고혈압 또는 당뇨병이 발생한 환자 수  - 고혈압 환자: 고혈압 주상병 코드(I10~I15)와 함께 고혈압 약제를 처방 받은 환자  - 당뇨병 환자: 당뇨병 주상병 코드(E10~E14)와 함께 당뇨병 약제를 처방 받은 환자○ 고당의료이용률 = 분자/분모*100(%) ※ 분모가 20 미만인 행은 정보 제공 불가* 상병코드명은 질병분류 정보센터(https://www.koicd.kr) 참고'
