description_portal: 경상남도 거제시에서 실시한 가축 전염병 예방주사 실적을 보여줍니다. 소, 돼지, 개 등 가축의 질병 예방을 위해 접종한 주사 건수를 질병별로 구분했습니다. 예방한 질병에는 광견병, 뉴캐슬병, 소유행열, 돼지열병 등이 포함됩니다. 각 항목별 숫자는 실제 접종한 마릿수 또는 횟수를 나타냅니다. 기타 항목은 표에 없는 다른 전염병 예방접종을 뜻합니다.이 자료는 또한, 지역 축산 농가의 질병 예방 현황을 파악하는 데 도움이 될 수 있고 가축 방역 정책 수립이나 지역 전염병 관리에 활용될 수 있습니다. CSV 또는 엑셀 형식으로 제공되며, 누구나 열람하고 사용할 수 있습니다.
