description_portal: 이 데이터는 2020년부터 2023년까지 구로구 지역의 일별 코로나19 확진자 발생량을 연도별로 비교할 수 있도록 구성된 시계열 공공보건 통계자료이다. 모든 관측치는 ‘기준월일’을 기준으로 동일 날짜에 대해 4개 연도의 확진자 수를 나란히 배치하여, 특정 시점에서의 감염 추세 변화, 계절적 요인, 연도별 방역 강도 효과 등을 분석할 수 있게 한다. 이 구조는 방역정책 수립, 의료 수요 예측, 지역사회 위험도 판단, 긴급 대응 체계 구축과 같은 행정적 목적에 특히 유용하다. 단일 연도 자료가 아닌 다년 비교형 데이터라는 점에서 코로나 유행 패턴의 연속성·변동성을 정량적으로 파악할 수 있는 중요한 기초 자료 역할을 한다.
