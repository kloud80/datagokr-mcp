summary_user: 질병관리청 청소년건강행태조사 결과로 산출한 청소년 평생 음주 경험률(술을 1잔 이상 마셔본 적 있는 비율)을 연도별로 담은 전국 단위 집계 파일로, 전체·성별·학교급(중·고, 일반계고·특성화계고)별 값을 제공하며 파일 크기는 825바이트로 작다. 연구자나 보건 담당자가 '남녀 청소년, 중·고등학생의 음주 경험률이 해마다 어떻게 달라졌나'를 확인하거나 절주·음주폐해예방 연구의 기초자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나 같은 기관의 다른 절주 지표와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 음주폐해예방 관련 지표- 질병관리청에서 발표한 청소년건강행태조사 결과를 이용해 청소년의 평생 음주 경험률을 산출한 지표입니다. - 평생 음주 경험률이란 평생 동안 술을 1잔 이상 마셔본 적이 있는 사람의 분율을 말합니다.- 데이터는 성별, 중, 고등학교별로 음주 경험율을 제공하고 있으며, 2015년도부터 일반계고, 특성화계고 통계는 미발표되고 있습니다.- 본 데이터는 청소년 음주폐해예방 및 절주문화 확산을 위한 보건의료분야 학계의 연구 추진 시 기초자료로 활용될 수 있을 것으로 기대됩니다.
