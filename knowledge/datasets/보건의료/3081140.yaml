summary_user: 서울특별시 금천구 관내 의약품 도매·소매업소를 업소 한 곳당 한 행으로 담은 파일로, 영업소명·도로명주소·지번주소·위도·경도·기준일자를 포함한다. 주민이 집 근처 의약품 판매업소를 찾거나, 분석가가 금천구 안 의약품 판매처가 어느 동네에 몰려 있는지 지도로 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 좌표로 위치를 맞추거나 업소명을 대조해 이어 쓴다.
