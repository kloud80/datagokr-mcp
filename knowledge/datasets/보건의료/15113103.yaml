summary_user: 대구광역시 수성구 관내에 설치된 폐의약품 수거함을 한 곳씩 담은 건별 목록으로, 관할·설치 기관명·소재지 주소·세부 설치위치·전화번호를 담는다(시군구 범위, 주소 단위). 수성구 주민이 "유효기간 지난 약을 집 근처 어느 기관 수거함에 버리면 되나"를 찾거나, 보건·환경 담당자가 동별 수거함 분포와 설치가 부족한 지역을 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소·기관명칭을 문자열로 맞추거나 주소를 좌표로 바꿔 행정동·약국·보건소 위치 자료와 이어 쓴다.
description_portal: 이 데이터는 대구광역시 수성구 관내에 설치된 폐의약품 수거함의 위치 및 설치 현황을 정리한 자료로, 수거함 관할, 기관명칭, 소재지, 수거함 세부위치, 전화번호 등의 항목으로 구성된다. 폐의약품 수거함은 사용 기한이 지난 약품, 파손된 약품, 과잉 복용 후 남은 약품 등을 안전하게 회수하여 환경오염 및 오·남용을 방지하는 역할을 수행한다. 본 자료는 설치 위치와 운영 기관별 분포를 파악하여 환경보호 정책 기획, 폐의약품 회수율 평가, 안전한 약품처리 인프라 확충, 공공보건 교육 활동 등에 활용될 수 있다. 또한 주민 접근성을 높이기 위해 설치 밀도 분석, 취약 지역 파악, 추가 설치 지역 선정을 지원하며, 민원 응대, 지역 캠페인 기획, 보건 정책 수립 등 행정 실무에도 유용하다. 데이터는 정기적으로 갱신되어 최신 설치 현황을 반영하며, 공공기관, 보건소, 환경부서, 약사회 등 다양한 주체에서 활용할 수 있다.
