description_portal: 본 데이터는 전라남도 목포시에서 수집한 코로나19 확진자 현황을 연월별로 정리한 통계 자료입니다. 제공 항목에는 매월 발생한 신규 확진자 수와 누적 확진자 수가 포함되며, 지역 내 감염 추세 및 시기별 확산 정도를 확인할 수 있도록 구성되어 있습니다. 이 자료는 방역 정책 수립, 감염병 대응 전략, 보건 자원 배분 등 보건행정에 필요한 기초자료로 활용이 가능하며, 시민과 연구자에게 지역 내 코로나19 상황을 체계적으로 알리는 데 목적이 있습니다. 전염병 관리 및 공공 보건 연구 분야에서도 활용도가 높은 자료입니다. 공공데이터로 개방하여 정책 결정 및 정보 제공에 기여하고자 합니다.
