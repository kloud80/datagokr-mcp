summary_user: 전국 장기요양기관을 기관 한 곳당 한 행으로 담고, 장기요양기관기호·기관명·주소와 함께 방문요양 인지활동형, 방문간호(최초 치매수급자), 주야간보호 치매전담형·인지활동형, 노인요양시설·공동생활가정 치매전담실 같은 치매 관련 급여의 제공 여부를 표시한 파일이다. 치매 어르신을 둔 가족이 '우리 동네에서 치매전담형 주야간보호나 인지활동형 방문요양을 하는 기관이 어디인가'를 찾거나, 분석가가 지역별 치매 돌봄 기관 분포를 볼 때 쓴다. 장기요양기관기호(ltc_instt_cd)를 키로 다른 장기요양기관 목록·평가 데이터와 잇고, 주소로 지역 단위 집계나 지도화에 쓴다.
description_portal: "1) 장기요양기관기호 2) 기관명 3) 주소  4) 제공급여: 방문요양 인지활동형, 방문간호 최초 치매수급자, 주야간보호 치매전담형, 주야간보호 인지활동형, 노인요양시설 치매전담실, 공동생활가정 치매전담실(1인 경우 해당, 2인 경우 비해당)* 요청자료 중 '장기요양 가족휴가제'는 기관의 모집·참여 형태로 운영되는 사업이 아닌, 월 한도액과 관계없이 단기보호급여 또는 종일 방문요양급여를 이용할 수 있는 제도로 장기요양 가족휴가제 제공 가능기관은 [노인장기요양보험 홈페이지(http://www.longtermcare.or.kr) > 검색서비스 > 치매관련급여 > 장기요양 가족휴가제 급여제공 기관]에서 확인하실 수 있습니다.※ 민원인의 최신 데이터 제공 요청에 따라 2025.8.7. 기준으로 작성※ 민원인의 공공데이터 제공 신청에 따라 발췌 및 구성된 데이터이며 본 데이터와 무관한 건강보험제도, 개인의 자격,징수,급여, 장기요양 관련 문의는 공단 대표번호(1577-1000)로 하시기 바랍니다."
