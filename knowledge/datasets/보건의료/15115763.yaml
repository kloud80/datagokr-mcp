summary_user: 구로구 관내 병원·종합병원·치과병원 등 입원 30명 이상 의료기관의 인허가 내역을 사업장 한 건씩 담은 LOCALDATA 형식 원천 자료로, 인허가·폐업일자, 영업상태, 주소, 의료기관 종별, 진료과목, 병상수·의료인수, 중부원점TM 좌표를 포함한다. 구로구에서 어떤 진료과목 병원이 언제 문을 열고 닫았는지, 병상 규모가 지역별로 어떻게 분포하는지 확인하려는 주민·분석가·개원 검토 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)로만 이어 쓰고, 지도에 올리려면 좌표 변환이 필요하다.
description_portal: 병원 인허가 정보 데이터는 구로구 관내 병원, 종합병원, 치과병원 등 의사가 환자를 진찰·진료하는 데 필요한 필수 설비를 갖추고 있고, 30명 이상의 환자를 수용할 수 있는 의료기관을 대상으로 한 행정 기반 보건자료이다. 해당 데이터는 의료기관의 인허가일자, 영업상태명, 소재지전체주소, 의료기관종별명, 진료과목내용명, 병상수, 의료인수 등 핵심 정보를 정교하게 기록하여, 지역 의료 인프라의 공급 수준과 운영 실태를 분석할 수 있도록 구성되어 있다. 병상수와 의료인력 규모는 지역 내 의료 대응 역량을 가늠하는 중요한 지표가 되며, 진료과목 정보는 특정 진료 분야에서의 공급 불균형을 식별하는 데 활용된다.또한 본 데이터는 중부원점TM(EPSG:2097) 좌표계 기반의 좌표정보만 제공하고 있어, GIS 시스템 연계 시 해당 좌표계를 사용하는 행정·공간정보 체계와 호환되도록 설계된 것이 특징이다. 위경도 좌표는 별도로 제공되지 않기 때문에, 필요 시 좌표 변환이 요구될 수 있다. 아울러 본 자료는 3일 전 기준의 최신 인허가 현황을 제공하여, 의료기관의 개설·변경·폐업과 같은 변동 사항을 신속하게 확인할 수 있는 시의성을 확보하고 있다. 이러한 데이터 구조는 구로구의 의료 접근성 평가, 응급·재난의료체계 구축, 의료 취약지 분석 등 공공보건 행정 전반의 의사결정에 중요한 역할을 수행한다.
