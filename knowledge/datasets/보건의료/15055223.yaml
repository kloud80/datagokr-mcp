description_portal: 전북특별자치도 순창군 관내 「약사법」 및 관련 규정에 따라 등록 및 운영중인 의약업소병원 및 의원 현황에 관한 데이터 입니다. 지역 내 의약품 판매 및 공급체계를 파악하고, 공공보건 서비스·민간 연구·정책 수립에 활용할 수 있는 기초자료입니다. 지역 보건의료 정책 및 의약품 공급망 관리, 응급재난 시 의약품 접근성 분석, 민간서비스(지도,검색,헬스케어 앱 등) 및 학술산업 연구, 의약품 유통 및 소비 패턴 분서, 고령화 지역 약국 접근성 연구 등 재난 및 감염병 대응 고령봐 및 복지 서비스 기획 같은 다양한 분야에 활용하실 수 있습니다.- 구분(약국, 요양병원 등), 업소명(약국명 또는 영업소 명칭), 전화번호, 소재지로 구성되어 있습니다.
