summary_user: 식약처가 회수·판매중지 조치를 내린 의료기기를 건별로 담으며, 제조·수입업체명, 품목명, 품목허가번호, 등급, 모델명, 제조번호·제조일자, 회수·판매중지 사유, 공표·명령일이 들어 있고 범위는 전국이다. 병원·약국 구매 담당자나 소비자가 "지금 쓰는 이 모델·제조번호 제품이 회수 대상인가"를 확인하거나, 분석가가 업체별 회수 이력을 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 의료기기 품목허가 정보 등 다른 식약처 데이터와는 업체명·품목명 같은 이름 매칭이나 같은 기관의 코드로만 이어 쓴다.
limits: 오퍼레이션 4개 중 2개(업체명 목록, 품목명 목록)는 최소 파라미터로 호출했을 때 응답이 없었으므로 호출 조건을 따로 확인해야 한다. 공통 조인 키가 없어 다른 데이터와 붙일 때 이름 매칭 오류가 생길 수 있다.
