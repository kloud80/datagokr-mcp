description_portal: '□ 데이터 개요국민건강보험공단에서 보유한 건강보험 자동차보험료 산정 시 활용되는 자동차 세액표 가액 기준 자료입니다. 연식과 차종에 따른 과세표준 금액 정보를 포함하고 있으며, 해당 정보는 자동차 보유자의 재산평가 및 보험료 부과에 활용됩니다. 공단 내부 기준에 따라, 데이터는 2023년 이후 생성일시를 기준으로 연도별 발췌되어 제공됩니다.□ 데이터 설명 - 내용: 연식·차종별 과세표준 금액 - 발췌기준: 생성일시 기준 2023년 이후 연도별 자료 - 제공제한: 합계 자동차 금액이 100 이하인 경우는 개인정보보호 및 통계적 유의성 확보를 위해 제공되지 않음'
