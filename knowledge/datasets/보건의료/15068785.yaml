summary_user: 보건소 모바일 헬스케어 앱에서 식사일기를 입력할 때 쓰는 식품 목록으로, 음식 한 가지마다 음식명·카테고리·섭취단위를 담은 기준 목록 파일(CSV, 약 155KB)이다. 앱 개발자나 영양 분석가가 '보건소 식사일기에서 이 음식은 어떤 분류이고 어떤 단위로 섭취량을 기록하나'를 확인하거나, 비슷한 식사 기록 서비스의 음식 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 음식명 문자열 매칭으로만 이어 쓸 수 있다.
limits: 음식명·카테고리·섭취단위만 있고 열량·영양성분 값은 없으며, 공통 코드가 없어 식품영양성분 DB 등과 연결하려면 음식명을 직접 맞춰야 한다. 지역 구분이 없는 전국·비공간 목록이라 보건소별·지역별 분석에는 쓸 수 없다.
