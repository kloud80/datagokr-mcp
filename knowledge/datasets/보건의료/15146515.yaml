description_portal: 이 데이터는 서울지역 하수 중 코로나19 바이러스 농도 측정 자료로, 다음과 같은 메타데이터 요소를 포함합니다.샘플 채취 날짜데이터 수집 시점을 기록한 필드입니다.‘2025년 6월’처럼 연·월 단위와 조사 주차 단위로 제공되어 시계열 분석에 활용할 수 있습니다.샘플 채취 주차‘23주차, 24주차, … 26주차’와 같이 주 단위로 구분된 정보입니다.연속적인 변화를 모니터링하거나 특정 주차별 변동을 비교하는 데 유용합니다.하수처리장 샘플 채취 지점서울 내 주요 하수처리장별 구분(서남, 난지, 탄천, 중랑A, 중랑B)을 나타냅니다.공간적 메타데이터로서, 지역별 감염 확산 정도를 구분하는 지표가 됩니다.코로나19 바이러스 농도 (copies/mL)하수 내 검출된 바이러스 농도를 수치화한 값으로, 단위는 copies/mL입니다.데이터셋의 핵심 측정값으로, 시공간별 비교 및 확산 추세 파악에 활용됩니다.
