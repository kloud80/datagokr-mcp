summary_user: 전국에서 운영 중인 산후조리원을 한 곳당 한 행으로 담은 파일로, 시도·시군구, 운영주체, 이름, 주소, 전화번호, 일반실·특실 이용금액(만원, 14일 기준)을 2023년 12월 31일 기준으로 제공한다. 출산을 앞둔 가정이 우리 지역 산후조리원의 위치와 2주 이용 비용을 비교하거나, 분석가가 시군구별 산후조리원 분포와 가격 수준을 살피는 데 쓴다. 전역 조인 키는 없어 시도·시군구 이름이나 주소, 산후조리원 이름으로 행정구역 코드나 LOCALDATA 산후조리원 인허가 자료와 맞춰 이어 써야 한다.
limits: 휴업·폐업한 산후조리원은 빠져 있어 개폐업 추이나 상권 변화 분석에는 쓸 수 없다. 금액은 같은 등급 안에서 가장 높은 금액만 적혀 있어 실제 요금 범위를 보여 주지 않는다. 일반실이나 특실이 없는 곳은 칸이 비어 있다. 코드 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다.
