summary_user: 광주광역시 관내에서 운영 중인 산후조리원을 시설 1곳당 1행으로 담은 소규모 목록 파일(637바이트)로, 이름·소재지·전화번호·정원 현황과 데이터 기준일을 담는다. 출산을 앞둔 가족이 광주 자치구별로 어느 산후조리원이 있고 정원이 몇 명인지 확인하거나, 분석가가 지역 산후조리 시설 공급 규모를 가늠할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 산후조리원명·주소를 맞춰 잇는 방식으로만 연결하며, 요금 등 상세 정보는 보건복지부 전국 산후조리원 현황과 이름으로 대조해 보완한다.
