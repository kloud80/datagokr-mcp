description_portal: 광주광역시에서 운영 중인 산후조리원 데이터를 제공합니다. 관내 산후조리원은 총 7개이며, 자치구별로 서구 1개소(미즈), 남구 1개소(모아), 북구 3개소(에덴, 빛고을, 마더힐), 광산구 2개소(더블유, 더엘)입니다.전국 산후조리원 현황은 보건복지부 공공데이터 "전국 산후조리원 현황"에서 확인 가능합니다. (주소, 전화번호, 일반실/특실 금액 등 자세한 정보 제공하고 있습니다.)<데이터 이용 시 참고사항>1. 제공된 데이터는 휴업 및 폐업된 산후조리원이 제외된 자료입니다.2. 2025년 12월 31일 기준 정보입니다.
