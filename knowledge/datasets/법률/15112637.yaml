description_portal: 1. 매일 발생하는 수용자의 자비구매물품 목록을 교정기관별로 구매한 물품의 주문 자료를 일자별로 제공합니다.2. 제공 항목은 공급연월일, 공급업체명, 주문 교정기관, 공급 품목명, 주문수량(건수)입니다.3. 세부적으로 제공되는 주요 항목에 대한 설명은 공급업체명의 경우 입찰을 통해 공급자격을 획득한 업체명이며, 주문 교정기관은 해당 자비구매물품을 주문한 교도소 및 구치소 이름입니다.4. 공급 품목명은 수용자가 구매를 희망하여 지정한 물품이름이며, 주문수량은 영치금을 사용하여 실제 구매까지 이루어진 건 수 입니다.해당 데이터는 매일 발생하는 데이터 이며, 누적하여 관리할 경우 전국 교정기관에서 월별, 년도별, 지역별로 발생하는 수용기관의 수용자 구매 데이터를 확보할 수 있습니다.
