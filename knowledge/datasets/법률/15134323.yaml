description_portal: 법무부 인천공항출입국.외국인청의 사무소 코드데이터는 각 사무소를 고유하게 식별하기 위해 부여된 사무소 코드(OFFI_CD)와 해당 사무소 명(OFFI_KOR_NM)을 제공하고 있습니다.  이 데이터는 행정 업무와 정보시스템 운영에서 효율적인 식별과 관리가 가능하도록 구성된 자료입니다. 그리하여 이 데이터는 사무소명과 사무소 코드 두 항목만으로 사무소 정보를 표준화하여 정확하게 기록하고있으며, 행정시스템과 연계하여 업무처리와 정보조회의 편리성을 높이는 것을 목적으로 합니다.
