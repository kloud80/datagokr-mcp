status: active
summary_user: 국내에 체류 중인 결혼이민자(국민의 배우자·결혼이민 영주·자녀양육·혼인단절 체류자격 소지자) 수를 연·월, 국적(지역), 성별로 나눈 전국 단위 집계 파일이다. 특정 국적 결혼이민자의 성비나 월별 증감을 확인하려는 다문화 정책 담당자나 연구자가 "베트남 국적 결혼이민자 중 여성은 몇 명이고 최근 어떻게 변했나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 체류 외국인 통계와는 연·월과 국적명을 이름으로 맞춰 이어 써야 하고, 지역 단위 컬럼이 없어 시군구 인구 자료와 바로 연결되지 않는다.
limits: 전국·비공간 집계라 시군구 등 지역별 결혼이민자 분포는 이 파일로 알 수 없다. 국적 코드가 아닌 이름으로 연결해야 하며, 귀화로 한국 국적을 얻은 혼인귀화자는 집계에서 빠진다.
