summary_user: 국내에 체류 중인 외국국적동포(재외동포 F-4를 비롯해 F-1·H-2·F-5 등 체류자격 보유자) 수를 년·월과 국적(지역)별로 집계한 전국 단위 파일입니다. 분석가나 정책 담당자가 '최근 몇 년간 중국·러시아·우즈베키스탄 등 어느 국적 동포가 얼마나 늘거나 줄었나' 같은 국적별 동포 체류 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 출입국·체류 통계와는 년·월과 국적명을 맞춰 이어 붙여야 한다.
limits: 전국 단위 비공간 집계라 시군구 같은 지역별 동포 거주 분포는 이 데이터로 알 수 없다. 공통 코드가 없어 국적은 이름 매핑으로만 다른 데이터와 연결된다.
