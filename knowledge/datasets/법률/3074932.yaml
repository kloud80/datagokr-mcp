status: active
summary_user: 출입국심사에서 집계한 외국인 입국자(승무원 제외)를 대륙·국가·성별별로 나누고 5세 단위 연령대(0~4세부터 80세 이상까지)별 인원과 총합계로 담은 전국 단위 연간 집계 파일이다. 관광·교육·이민정책 분석가가 "특정 국적의 20~30대 입국자가 남녀별로 얼마나 되는가"처럼 국적·연령 구성으로 입국 수요를 파악하는 데 쓴다. 전역 조인 키나 국가 코드 필드가 없어, 다른 출입국·체류 통계와는 국가명·대륙명을 문자열로 맞춰 연결해야 한다.
limits: 입국 횟수를 누적 집계하므로 한 사람이 여러 번 입국하면 중복으로 세어져 실제 인원 수로 해석하면 안 된다. 전국·비공간 집계라 시군구 등 지역별 분석이나 체류자격·월별 분석에는 쓸 수 없다.
