summary_user: 외국인 체류자격(A~F계열과 기타)의 신약호, 법령상 명칭, 체류자격명, 자격별 설명을 담은 코드표 파일로, 전국 단위의 비공간 참조 데이터다(CSV 약 20KB). 체류 외국인 통계나 비자 관련 자료에 나온 'E-9', 'F-6' 같은 약호가 어떤 자격을 뜻하는지 확인하려는 분석가·사업자·외국인 지원기관이 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 체류자격 신약호나 체류자격명을 같은 기관(법무부)의 체류 외국인·등록외국인 통계의 체류자격 항목과 이름·코드로 맞춰 해석용 코드표로 붙여 쓴다.
description_portal: '○ 외국인에게 발급하는 체류자격은 일반체류자격과 영주자격으로 나뉘며, 일반체류자격은 단기체류자격(90일 이하 체류)과 장기체류자격(90일 초과 체류)으로 구분○ 국내 체류 외국인 중 노동시장 진입(취업활동)이 허용된 외국인력은 전문인력, 비전문인력, 기타(거주, 재외동포, 영주 등) 자격자로 구분○ A계열 : 외교, 공무, 국가간 협정에 따라 체류 하는 사람 / B계열 : 사증면제협정, 상호주의 등에 따라 입국이 허용된 사람 / C계열 : 90일 이내 일시 체류목적으로 입국하는 사람 / D계열  : 교육, 문화, 투자 관련 활동을 위해 체류하는 사람 / E계열 : 전문분야, 비전문분야 활동을 위해 체류하는 사람 / F계열 : 가족동반, 거주, 동포, 영주, 결혼이민 자격으로 체류하는 사람 / 기타 : 협정에 의한 취업, 인도적 사유로 체류 하는 사람 등'
