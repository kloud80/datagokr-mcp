summary_user: 출입국관리법에 따라 91일 이상 체류하려고 외국인등록을 한 등록외국인 수(불법체류자 포함)를 연·월과 국적(지역)별로 집계한 전국 단위 파일(CSV)입니다. 특정 국적 등록외국인이 월별로 어떻게 늘고 줄었는지 보려는 분석가나 정책 담당자가, 예를 들어 '베트남 국적 등록외국인이 최근 몇 년 사이 얼마나 늘었나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연·월과 국적명을 이름으로 맞춰 붙여야 하며, 같은 법무부의 다른 출입국·체류 통계와 국적·월 기준으로 이어 쓴다.
limits: 전국 단위 비공간 집계라 시군구 등 지역별 외국인 분포는 이 파일로 알 수 없다. 국적 코드가 아닌 국적(지역) 이름만 있어 다른 데이터와 연결하려면 이름 매핑이 필요하다.
