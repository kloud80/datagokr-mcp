summary_user: 고용허가제로 들어오는 외국인근로자(비전문취업 E-9)에게 법무부가 발급한 사증발급인정서 건수를 국적별·성별로 나누고, 제조업·건설업·농업·어업·서비스업 세부 업종별로 집계한 전국 단위 통계 파일이다. 노동·이민 분석가가 '어느 나라 출신 외국인근로자가 어떤 업종으로 주로 들어오는지, 성별 구성은 어떤지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 출입국·체류 통계와는 국적 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 0. 재외공관에서 근로계약이 체결된 외국인근로자가 별다른 절차없이 국내 입국에 필요한 사증을 받을 수 있도록 국내에서 입국을 허락한 인정서인 고용허가제에 대한 국가별 사증발급인정서 발급 현황을 국가별, 성별로 제공- 해당 통계는 연도별 통계이며 매년 10월 경 업데이트 예정입니다. -  출입국 외국인 정책본부 홈페이지의 통계연보에서도 확인하실 수 있습니다.- 출입국외국인정책본부 홈페이지 URL은 아래와 같습니다. https://www.immigration.go.kr/immigration/1570/subview.do- 우리부 사증 발급 인정서 통계이며 고용노동부의 통계와 일부 상이할 수 있습니다.
