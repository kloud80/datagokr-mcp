summary_user: 국내에 체류 중인 외국국적동포 가운데 영주(F-5) 자격 소지자 수를 년·월과 국적(지역)별로 집계한 전국 단위 파일(csv)입니다. 법무·이민 분석가나 연구자가 "중국·미국 등 어느 국적의 동포 영주권자가 매월 얼마나 늘고 있나"를 확인하는 데 쓴다. 전역 조인 키는 없으며, 년·월과 국적(지역) 이름을 맞춰 같은 기관의 다른 체류자격별 동포 통계(F-4 등)나 출입국 통계월보와 나란히 놓고 쓴다.
description_portal: '국내 체류중인 영주(F-5) 자격 소지자의 국적(지역)별 현황을 월별로 제공하고 있습니다.*외국국적동포 : 재외동포의 출입국과 법적지위에 관한 법률 제2조에 따라 대한민국의 국적을 보유하였던 자(대한민국정부 수립 전에 국외로 이주한 동포 포함) 또는 그 직계비속으로서 외국국적을 취득한 자 중 대통령령으로 정하는 자(F4를 비롯한 기타체류자격 보유자의 합이며, 그 중 이 데이터는 F5체류자격을 보유한 사람들의 국적별 통계이며 동일 한 통계를 통계월보에서도 확인하실 수 있습니다)출입국외국인정책본부 통계월보의 경로는 아래와 같습니다. https://www.immigration.go.kr/immigration/1569/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaW1taWdyYXRpb24lMkYyMjclMkY1OTU0MjYlMkZhcnRjbFZpZXcuZG8lM0ZwYXNzd29yZCUzRCUyNnJnc0JnbmRlU3RyJTNEJTI2YmJzQ2xTZXElM0QlMjZyZ3NFbmRkZVN0ciUzRCUyNmlzVmlld01pbmUlM0RmYWxzZSUyNnBhZ2UlM0QxJTI2YmJzT3BlbldyZFNlcSUzRCUyNnNyY2hDb2x1bW4lM0QlMjZzcmNoV3JkJTNEJTI2'
