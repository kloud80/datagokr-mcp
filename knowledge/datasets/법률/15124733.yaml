summary_user: 문화체육관광부 지침에 따른 중국 단체관광 전담여행사를 통해 입국한 중국인 단체관광객 수를 2013년 1월부터 2025년 4월까지 전국 단위 월별(연도·월·입국인원)로 집계한 자료입니다. 관광업계나 분석가가 "중국 단체관광객 입국이 특정 시기 이후 얼마나 줄고 회복했는가" 같은 월별 추이를 확인하는 데 쓴다. 전역 조인 키는 없고 연도·월만 있으므로, 다른 월별 출입국·관광 통계와는 기간(연·월)을 맞춰 나란히 비교하는 방식으로만 잇는다.
limits: 지역 구분 없는 전국·비공간 집계라 시군구별 분석에는 쓸 수 없고, 전체 중국인 입국자 수나 한국관광공사 방한 외국인 통계와는 다른 통계다. 입국자 수는 한 사람이 여러 번 입국하면 누적 집계되므로 실제 인원 수로 해석하면 안 된다.
