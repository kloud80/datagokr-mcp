summary_user: 91일 이상 체류하려고 국내거소신고를 한 외국국적동포의 수를 국적(지역)별·월별로 집계한 파일 데이터로, 전국 단위이며 시군구 등 지역 구분은 없습니다. 재외동포 정책 담당자나 연구자가 "어느 나라 출신 동포의 거소신고가 최근 몇 달 사이 늘었는가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 같은 기관의 다른 체류외국인 통계와는 년·월과 국적명을 맞춰 연결한다.
