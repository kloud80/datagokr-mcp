summary_user: 91일 이상 체류하려고 외국인등록을 한 등록외국인(불법체류자 포함, 단기체류·거소신고 외국인 제외)의 수를 전국 시군구별·월별로 집계해 담은 파일이다. 지자체·연구자·사업자가 "우리 시군구에 사는 등록외국인이 몇 명이고 매달 어떻게 늘거나 줄었나"를 확인해 다문화·노동·주거·상권 분석의 기초로 쓴다. 전역 조인 키(행정구역 코드)가 없어 시도·시군구 이름을 행정구역 코드에 매핑한 뒤 년·월과 함께 주민등록 인구 같은 시군구 × 월 지역 통계와 이어 쓴다.
description_portal: 입국한 날로부터 91일 이상 대한민국에 체류할 목적으로 「출입국관리법」제31조에 따라 체류지를 관할하는 지방 출입국· 외국인관서의 장에게 외국인등록을 하고 고유한 등록번호를 부여받은 외국인의 거주지역 (시군구)별 현황을  월별로 제공전체 체류외국인 중 단기체류외국인과 거소신고 외국인을 제외한 등록외국인의 시·군·구별 거주현황(불법체류자 포함)원본 데이터는 출입국외국인정책본부 홈페이지의 통계월보에서 확인하실 수 있으며 경로는 아래와 같습니다.당월 통계월보 - 한글파일- 등록외국인 현황 - 등록외국인 시·군·구별 거주현황https://www.immigration.go.kr/immigration/1569/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaW1taWdyYXRpb24lMkYyMjclMkY1OTU0MjYlMkZhcnRjbFZpZXcuZG8lM0ZwYXNzd29yZCUzRCUyNnJnc0JnbmRlU3RyJTNEJTI2YmJzQ2xTZXElM0QlMjZyZ3NFbmRkZ
