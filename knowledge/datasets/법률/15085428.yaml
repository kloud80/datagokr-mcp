description_portal: '대검찰청에서 발간하는 범죄분석은 3종의 범죄통계원표를 기반으로 작성하는 자료이며 이 중 본 데이터는 정신장애범죄자의 범행동기별 범죄 통계임. (단위: 명)※발생통계원표 : 각급 수사기관이 피해신고, 고소/고발, 자체인지 등에 의해서 범죄의 발생을 확인한 후 형사입건한 경우에 작성※검거통계원표 : 각급 수사기관이 형사입건한 사건에 대해서 피의자를 검거한 경우에 작성※피의자통계원표 : 피의자 1명에 대해 1장을 작성하므로 사람(인원) 단위로 작성되며, 피의자 중 법인이 포함된 경우 법인에 대해서도 피의자통계원표를 작성'
