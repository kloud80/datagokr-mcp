summary_user: 인천광역시 경찰서 관할별로 피의자 수를 최종 학력(대학교·고등학교·중학교·초등학교의 졸업·중퇴·재학, 불취학, 기타)에 따라 나눈 집계표로, 필드상 2018년 한 해 값만 담긴 925바이트 크기의 작은 CSV 파일이다. 인천 지역 범죄 피의자의 학력 분포가 경찰서별로 어떻게 다른지 보려는 분석가나 범죄 예방·재활 정책 담당자가 기초 자료로 쓴다. 전역 조인 키가 없어 경찰서 이름을 기준으로 다른 인천 범죄 통계나 경찰청 발생 통계와 이름 매핑해 붙여 써야 한다.
limits: 표준 행정코드 등 전역 조인 키가 없어 시군구 단위 자료와는 경찰서 이름을 직접 매핑해야 연결된다. 건별 원천이 아닌 경찰서별 집계이고 필드상 2018년 값만 있어 개인 단위 분석이나 연도별 추세 비교에는 쓸 수 없다.
