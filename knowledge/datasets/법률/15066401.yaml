description_portal: 인천광역시가 제공하는 학력별 피의자 현황 공공데이터는 시에서 발생한 주요 범죄 유형별 피의자를 경찰서 관할별로 분류하고, 피의자의 최종 학력에 따라 세분하여 집계한 통계 자료입니다. 이 데이터는 범죄 발생과 교육 수준 간의 상관관계, 학력별 범죄 취약 집단 등을 파악하고, 교육 복지 강화, 사회 재활 프로그램 개발, 맞춤형 범죄 예방 대책 수립의 기초 자료로 활용됩니다.인천 경찰서별 피의자의 학력에 대한 정보(대학교 졸업 중퇴 재학, 고등학교 졸업 중퇴 재학 등)과 관련된 데이터 입니다.해당 데이터는 공공데이터포털에서 확인할 수 있습니다.
