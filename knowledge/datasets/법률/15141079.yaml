    - name: lawNm
      title: 법령명
      type: code
      null_rate: 0.0
      sample_values:
        - 대한민국과 일본국 간의 재산 및 청구권에 관한 문제의 해결과 경제협력에 관한 협정
        - 구 태평양전쟁 전후 국외 강제동원희생자 등 지원에 관한 법률
        - 구 태평양전쟁 전후 국외 강제동원희생자 등 지원에 관한 법률 시행령
      stats:
        unique: 3
    - name: provision
      title: 조
      type: number
      null_rate: 0.0
      sample_values:
        - '2'
        - '5'
        - '18'
      stats:
        min: 2
        p50: 5
        max: 18
        unique: 4
    - name: provision2
      title: 의
      type: code
      null_rate: 1.0
      stats:
        unique: 0
    - name: clause
      title: 항
      type: number
      null_rate: 0.2
      sample_values:
        - '1'
        - '3'
      stats:
        min: 1
        p50: 1
        max: 3
        unique: 2
    - name: item
      title: 호
      type: code
      null_rate: 1.0
      stats:
        unique: 0
    - name: subItem
      title: 목
      type: code
      null_rate: 1.0
      stats:
        unique: 0
    - name: etc
      title: 기타
      type: code
      null_rate: 0.6
      sample_values:
        - 국가는 미수금피해자 또는 그 유족에게 미수금피해자가 일본국 또는 일본 기업 등으로부터 지급받을 수 있었던 미수금을 당시의 일본국 통화 1엔에 대
        - 구 태평양전쟁 전후 국외 강제동원희생자 등 지원에 관한 법률 시행령 제16조 및 별지 제13호 서식 제3항, 한일청구권협정 제2조 제1항, 제3
      stats:
        unique: 2
    - name: endRsta
      title: 종국결과
      type: code
      null_rate: 0.0
      sample_values:
        - 각하
        - 합헌
      stats:
        unique: 2
