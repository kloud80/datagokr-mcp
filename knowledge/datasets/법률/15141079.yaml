    endpoint: https://apis.data.go.kr/9750000/IncidentInfoService/getIncidentInfoList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        desc: 페이지번호
      - name: numOfRows
        required: false
        desc: 한 페이지 결과 수
      - name: type
        required: false
        desc: 응답결과 출력형식(xml,json) 기본값:xml
      - name: fields
        required: false
        desc: '응답에 노출할 필드명 콤마(,)로 구분해서 입력, 기본 : 모든필드 출력'
      - name: eventNm
        required: true
        desc: 사건명에 포함된 키워드 검색
      - name: endRsta
        required: false
        desc: 종료된 사건일 경우 최종적인 종국결과값 (위헌, 헌법불합치, 한정위헌, 한정합헌, 인용, 합헌, 기각, 각하, 취하, 기타)
      - name: inqDate
        required: false
        desc: 사건이 접수된 년월일 (8자리)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
