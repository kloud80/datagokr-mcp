summary_user: 난민을 신청한 외국인 수를 연도별·신청사유별(종교, 정치적 의견, 특정 사회집단 구성원, 인종, 국적, 가족결합, 기타 등) 건수로 담은 전국 단위 집계 파일이며, 연도말 시점 통계입니다. 분석가나 연구자가 '국내 난민 신청 사유 가운데 정치적 의견과 종교 비중이 해마다 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로 연도(년)와 신청사유 이름을 기준으로 같은 기관의 다른 난민 통계와 맞춰 이어 쓴다.
