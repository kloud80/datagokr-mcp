summary_user: 충청남도 마을변호사 무료법률상담을 연결해 주는 시군·읍면동 담당 직원의 행정전화 연락처를 읍면동 단위로 담은 명부 파일이다(포털 설명상 15개 시군, 160개 읍면동). 법률 문제로 상담을 원하는 도민이 "우리 동네 마을변호사 상담은 어디로 전화해야 하나"를 찾을 때 쓴다. 전역 조인 키는 없고 시도·시군·읍면동 이름으로만 행정구역 코드표나 다른 지역 데이터와 맞춰 이어 쓴다.
description_portal: '○ 도민들이 생활 속에서 접하는 법률 문제를 쉽고 편리하게 상의하고 법률적 조언을 받을 수 있도록 마을마다 변호사를 배치하여 법률서비스 제고  - 공개정보: 15개 시군 및 160개 읍면동의 담당 직원 연락처(행정전화) 제공 - 상담방법: 상담인 거주지역의 시군 또는 읍면동 담당 직원과 연락 후 마을변호사와 전화, 서신을 통해 무료법률상담 진행 - 상 담 료: 무료(재능기부)   * 사안에 따라 마을변호사와 대면상담 진행'
