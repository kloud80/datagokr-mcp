status: active
summary_user: 법무부 사증발급인정서 발급 건수를 대륙·국가·성별 행마다 체류자격(공무, 단기일반, 의료관광, 학사유학, 교수 등)별 열로 나눠 담은 전국 단위 연도별 집계 통계 파일이다. 특정 국가 출신 유학생이나 단기취업(농업·어업) 인력의 사증발급인정서 발급이 어느 체류자격에 몰리는지 확인하려는 분석가나 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가명·체류자격 이름을 기준으로 체류 외국인·출입국 통계 같은 법무부의 다른 출입국 통계와 맞춰 써야 한다.
limits: 지역(시군구) 구분 없이 전국 단위 비공간 집계라서 지역별 외국인 분석에는 바로 쓰지 못한다. 공통 코드 키가 없어 다른 데이터와 연결할 때 국가명·체류자격명을 직접 맞춰야 한다.
