description_portal: '° 범죄피해구조금- 범죄로 인하여 사망하거나 장해, 중상해를 입고도 피해의 전부 또는 일부를 보상받지 못한 경우 국가가 피해자나 유족에게 일정 한도의 구조금을 지급하는 제도° 구조금 지급 요건- 지역적 요건 : 대한민국의 영역 안에서 발생한 범죄※ 외국에서 발생한 범죄 피해에 대하여는 구조금 지급 불가. 단, 대한민국의 선박이나 항공기 안에서 발생한 범죄피해에 대해서는 가능- 인적 요건 : 대한민국 국민에게 적용하며, 외국인이 피해자이거나 유족인 경우 해당 국가의 상호보증*이 있는 경우 또는 범죄피해 당시 대한민국 국민의 배우자이거나 대한민국 국민과 혼인관계(사실혼 포함)에서 출생한 자녀를 양육하고 있고, 장기체류자격(F-3 제외)을 소지하고 있는 경우 상호보증과 무관하게 구조금 지급 가능* 상호보증이란, 해당 국가에서도 범죄피해자가 된 우리나라 국민에게 구조금을 지급하는 경우를 말함** 외국인에게 적용되는 상호보증의 예외 규정은 2025. 3. 21. 이후 범죄피해가 발생한 사건부터 적용("25. 3. 21., 범죄피해자 보호법 일부개정법률안 시행)- 대상 범죄 : 생명 또는 신체를 해하는 죄 중 고의범죄에 해당하는 행위※ 과실범죄에 의한 피해는 제외° 구조금을 지급 받을 수 있는 자- 유족구조금 : 배우자(사실혼 포함), 피해자의 자녀, 부모, 손자·손녀, 조부모 및 형제자매. 단, 「범죄피해자보호법」에서 정하고 있는 유족의 순위에 따라 이 중 가장 앞선 순위 유족에게 지급되며 동순위 유족이 여러명인 경우 똑같이 나누어 지급- 장해구조금 : 「범죄피해자보호법 시행령」 [별표1] 신체장해등급표(총 14급) 상 1~14급의 장해 해당자- 중상해구조금 : 2개월 이상의 치료를 요하는 상해를 입은 자※ 범죄피해를 원인으로 「국가배상법」, 「산업재해보상보험법」, 「자동차손해배상보장법」 등 기타 법령에 의한 급여, 보상금 등을 지급 받을 수 있는 경우나, 가해자로부터 손해배상을 받은 때에는 그 금액 한도내에서 구조금을 지급하지 않음'
