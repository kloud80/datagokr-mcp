description_portal: '○ 통계개요* 통계명 : 등록외국인 현황(연령별/동별)* 통계종류 : 서울 체류 외국인의 현황을 연령별, 동별로 제공하는 일반ㆍ보고통계* 근거법령 : 「출입국관리법 시행령」제12조* 작성목적 : 서울 체류 외국인의 체류자격을 파악하여 정책수립의 기초자료로활용하는 것을 목적으로 함* 조사체계 : 출입국관리사무소 → 법무부* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 서울 체류 외국인의 연령별, 동별 현황○ 용어설명* 등록외국인은 출입국관리법에 의해 90일 초과 장기체류자 중에서 작성기준일 현재외국인 등록표에 등재된 자의 집계결과로서 실제로 국내에 거주하고 있는외국인 수와는 차이가 있을 수 있음○ 기 타* 자세한 내용은 www.immigration.go.kr 참조'
