description_portal: 해당 통계는 국내 공항별 입항, 출항한 항공기 수 및 승무원 수 통계입니다.인천공항, 김해공항, 김포공항, 대구공항, 제주공항, 청주공항, 무안공항, 양양공항 및 성남공항 현황입니다.해당 통계는 매년 1번 업데이트 됩니다. 다음 통계는 27년 1월 업데이트 예정입니다.입항 항공기수 / 입항승무원 수/ 출항항공기수/ 출국항승무원 수 칼럼으로 구분됩니다.이때 승무원은 내외국인 포함입니다.기타  국적별 통계 등은 출입국외국인정책본부 홈페이지의 통계연보를 참고하여 주시기 바랍니다.https://www.immigration.go.kr/immigration/index.do
