summary_user: 도로교통법 위반으로 1심 선고된 벌금의 건수와 총 벌금액을 연도별로, 무면허운전·사고후미조치·음주운전·음주측정거부 네 사유로 나눠 담은 전국 단위 집계표입니다(617바이트 CSV 파일 한 개). 음주운전 벌금 건수와 벌금액이 해마다 어떻게 변했는지, 사유별 규모를 비교하려는 분석가·정책 담당자가 쓴다. 전역 조인 키가 없어 연도 기준으로 경찰청 교통사고·음주운전 단속 통계 같은 다른 범죄·교통 통계와 나란히 놓고 보는 방식으로만 이어 쓴다.
limits: 전국·비공간 집계여서 지역별 비교나 시군구·월 단위 분석에는 쓸 수 없고, 다른 데이터와 붙일 공통 코드가 없다. 연도는 위반 발생일이 아니라 1심 선고일 기준이므로 단속·발생 통계와 연도가 어긋날 수 있다. 한 열(건_원)에 건수와 금액이 함께 구분되어 있어 단위를 확인하고 해석해야 한다.
