summary_user: 전국 시군구별로 국내에 체류 중인 재외동포(F-4) 자격 소지자 수를 성별과 세부 자격(기여동포·일반동포·직계가족·대학 졸업자·60세 이상자 등)으로 나눠 담은 집계 파일이며, 포털 설명상 2020년 말일 기준 시점 통계입니다. 지자체·연구자가 '우리 시군구에 사는 재외동포는 어떤 세부 자격으로 들어와 있고 남녀 구성은 어떤가'를 파악해 다문화·노동·주거 정책의 기초 자료로 쓴다. 전역 조인 키나 행정코드가 없어 시도·시군구 이름을 맞춰 주민등록 인구 등 지역 통계와 붙여 쓴다.
limits: 행정구역 코드 없이 이름만 있어 다른 데이터와 연결할 때 시군구 명칭을 직접 맞춰야 한다. 포털 설명에 따르면 2020년 말 한 시점 통계이고 현재와 세부자격 기준이 다를 수 있어 시계열 추이나 현행 자격 체계 분석에는 맞지 않는다.
