description_portal: 수용자는 특별한 사유가 없는 한 교정시설의 외부에 있는 사람과 접견할 수 있습니다.접견의 유형으로는 민원인이 직접 교정기관으로 찾아와서 접촉차단시설이 있는 장소에서 실시하는 일반접견, 접촉차단시설이 없는 개방된 공간에서 실시하는 장소변경 접견, 민원인의 스마트폰 또는 PC를 이용하여 화상으로 접견하는 스마트접견과 수용자의 재판 준비를 위한 변호인 접견 등이 있습니다.교정시설 수용자의  접견 유형별 현황으로 제공항목은  일반접견, 화상접견, 장소변경접견, 변호인접견 등 의 통계를 제공1. 연 단위로 일반접견의 실행 건수의 합계를 제공하고 있습니다.2. 연 단위로 화상접견의 실행 건수의 합계를 제공하고 있습니다.3. 연 단위로 장소변경접견 실행 건수의 합계를 제공하고 있습니다.4. 연 단위로 변호인접견의 실행 건수의 합계를 제공하고 있습니다.
