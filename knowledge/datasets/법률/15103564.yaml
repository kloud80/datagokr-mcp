description_portal: '특정활동(E-7) 자격은 대한민국 내의 공‧사기관 등과의 계약에 의하여 법무부장관이 특히 지정하는 활동에 종사하고자 하는 전문 외국인력을 대상으로 발급되는 사증으로 특정활동(E-7)이 허용되는 직종에 대한 코드 자료를 제공제공신청에 따른 수시데이터로 2022년 기준입니다. 현재와 다를 수 있음(도입직종의 유형) 한국표준직업분류 상 대분류 항목과 직능수준 등을 감안하여 전문직종, 준전문직종, 일반기능, 숙련기능직종으로 구분- (관리 전문직종) 대분류 항목 1(관리자)과 2(전문가 및 관련 종사자)의 직종(직능 수준 3, 4) 중 법무부 장관이 선정한 67개 직종*   * 경제이익단체 고위 임원 등 15개 직종 관리자와 생명과학전문가 등 52개 직종- (준전문직종) 대분류 항목 3(사무종사자)과 4(서비스종사자), 5(판매종사자)의 직종(직능 수준 2, 3) 중 법무부 장관이 선정한 10개 직종*  * 항공운송사무원 등 5개 직종 사무종사자와 운송서비스 종사자 등 5개 직종 서비스 종사자- (일반기능직종) 대분류 항목 6(농림어업 숙련종사자), 7(기능원 및 관련 기능 종사자), 8(장치기계조작 및 조립종사자)의 직종(직능수준 2) 중 법무부 장관이 선정한 11개 직종*  * 일반 : 동물사육사, 양식기술자, 할랄도축원 등 기능원 및 관련 기능인력- (숙련기능직종) 일반 기능직종 과 동일한 조건 중 점수제가 적용되는 3개 직종 *  * 점수제 : 농림축산어업, 제조, 건설 등 분야 숙련기능인력'
