summary_user: 전국 공항·항만에서 출국심사를 마친 국민(승객) 출국자 수를 기준년·기준월별로 5세 단위 연령대(0~4세부터 80세 이상까지)로 나눠 담은 전국 단위 월별 집계 파일입니다. 여행·항공업계나 정책 분석가가 '어느 연령대의 해외 출국이 언제 늘고 줄었는가'처럼 연령별 출국 수요의 계절성과 추세를 볼 때 쓴다. 전역 조인 키는 없고 기준년·기준월로만 다른 월별 출입국·인구 통계와 시점을 맞춰 붙여 쓴다.
limits: 지역(시군구) 구분이 없는 전국·비공간 집계라 지역 정보와 바로 연결하지 못하며, 공통 코드 없이 연월로만 맞춰야 한다. 출국 건수를 누적 집계하므로 한 사람이 여러 번 출국하면 중복으로 세어져 실제 출국 인원 수로 해석하면 안 된다.
