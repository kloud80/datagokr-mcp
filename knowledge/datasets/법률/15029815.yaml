description_portal: 법무부 범죄예방정책국(치료처우과)의 소속기관인 국립무병원(치료감호소)는 치료 감호 전문 의료기관으로, 치료감호법에 따라 치료감호 처분을 받은 정신질환자, 약물중독자, 성범죄자를 수용, 감호, 치료하고 정신감정 및 재범 방지 연구를 수행하는 곳입니다. 본 자료는 국립법무병원에 수용된 대상자 건수를 제공하며, 자료는 연도별, 질환별(정신분열증, 정신지체, 조울증, 성격 장애, 간질 등) 수용 건수로 구성됩니다. 해당 자료는 학술 연구, 행정업무, 범죄예방 및 재범 방지 대책 수립 등으로 활용 가능합니다.
