description_portal: 수형자의 경비처우급은 형집행법 제74조(경비처우급) 제1항 각호에 의하여 개방처우급(가장 높은 수준의 처우가 필요한 수형자), 완화경비처우급(통상적인 수준보다 높은 수준의 처우가 필요한 수형자), 일반경비처우급(통상적인 수준의 처우가 필요한 수형자), 중경비처우급(기본적인 처우가 필요한 수형자)로 구분되며, 해당 데이터에서 기타는 분류심사 유예자, 제외자, 거부자의 연령별 경비처우급 현황을 나타냅니다.또한, 분류처우 업무지침 제7조에 따라 분류심사 대상자를 지정하고 제8조와 제9조에 따라 분류심사 제외자와 유예자를 선정합니다. 이후 심사 종류에 따라 신입심사, 재심사, 부정기심사를 실시하여 수형자에 대한 분류처우를 결정하고 이를 기반으로 통계를 산출합니다.
