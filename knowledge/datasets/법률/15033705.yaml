summary_user: 강원특별자치도 읍면동마다 배정된 마을변호사 이름과 시군·읍면동 마을담당공무원 연락처를 한 행씩 담은 명부 파일(csv, 약 7.8KB)이다. 변호사를 만나기 어려운 지역 주민이나 상담 창구 담당자가 '우리 읍면동 담당 마을변호사는 누구이고 어디로 연락하나'를 확인하는 데 쓴다. 전역 조인 키나 행정코드가 없어서, 다른 데이터와는 시도·시군·읍면동 이름을 행정구역 코드표에 맞춰 이어 쓴다.
description_portal: '강원도 마을변호사 정보(시도명, 시군구명, 읍면동명, 성명, 연락처) 데이터를 제공합니다.* 마을변호사란? : 마을변호사 제도는 변호사를 접하기 어려운 지역에 거주하는 주민들이 각 마을에 배정된 담당 마을변호사와 손쉽게 법률상담을 진행할 수 있는 제도입니다.마을변호사는 전화, 이메일 등 원격 상담이 원칙이며, 경우에 따라 마을을 직접 방문하여 상담을 진행하기도합니다.마을변호사 이용 방법은 문제발생시 읍면동사무소 또는 각 지방변호사회에서 해당 지역 마을변호사 연락처를 확인하여 상담을 의뢰하며, 법률구조대상자의 경우 대한법률구조공단 등에 소송으로 연계 해주는역할을 하고 있습니다.'
