description_portal: 국가소송 사건 수행과 관련하여 정부법무공단이 수행한 법률자문 업무에 대한 고객기관 만족도를 조사하여 점수화한 데이터입니다. 해당 데이터는 중앙부처, 자치단체, 공공기관을 대상으로 법률자문 서비스의 품질을 객관적으로 평가하고, 공단의 법률지원 역량 강화 성과를 측정하기 위한 핵심 지표로 활용됩니다. 행정·공공기관은 정책 수립과 집행 과정에서 발생 가능한 법률문제를 사전에 검토함으로써, 불필요한 분쟁과 손실을 예방할 수 있고, 행정의 적법성을 확보하는 목적으로 고객의 피드백을 기반으로 법률자문 과정의 문제점을 개선하고, 법률지원 역량 강화를 위한 정책 수립에 반영하며, 연도별로 데이터를 업데이트합니다.
