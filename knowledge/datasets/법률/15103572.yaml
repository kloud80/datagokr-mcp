summary_user: 법무부가 시험에 쓰는 법학과목의 코드와 과목 정보를 순번별로 담은 코드표 파일(csv)이며, 건별 원천이나 집계 통계가 아니고 전국 단위의 비공간 자료다. 시험 관련 자료를 분석하는 사람이 다른 자료에 나온 법학과목 코드가 어떤 과목을 뜻하는지 확인하는 데 쓴다. 법학과목코드(bar_exam_subject_cd)가 유일한 조인 키이므로 같은 코드를 쓰는 시험 자료와 이어 쓰며, 지역이나 시점 키는 없다.
description_portal: 해당데이터는 판사·검사·변호사 또는 군법무관이 되려고 하는 자에게 필요한 학식과 능력의 유무 등을 검정하기 위한 제도로 법무부에서 시행하였던 사법시험 법학과목 코드 정보이다.사법시험법이 2017년 폐지되었으며 동법 시행령 및 시행규칙은 2018년도 폐지되어 사법고시 업무도 폐지되었다.법무부에서느 사법시험 폐지 이후에는 변호사시험으로 대체하여 시행 중이다.변호사시험은 2012년 1회로 최초 시행되었으며 2025년 현재까지 14회까지 시행되었다.변호사시험은 사법시험과 다르게 법학전문대학원 졸업자 및 졸업예정자만 응시가 가능하며 5년 이내 5회까지만 응시 가능하다
