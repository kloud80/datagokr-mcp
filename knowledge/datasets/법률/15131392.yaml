description_portal: 법무부 인청공항출입국.외국인청_항구코드는 각 항구를 고유하게 식별하기 위해 부여된 항구코드와 해당 항구명을 제공하여 항만 행정업무와 정보시스템 운영에서 효율적인 식별과 관리가 가능하도록 구성된 자료입니다. 이 데이터는 항구명과 항구코드 두 항목만ㅇ느로 항구 정보를 표준화하여 정화하게 기록하며, 행정시스템과연계하여 업무처리와 정보조회이 편리성을 높이는 것을 목적으로 합니다. -항구정보를 관리하는 자료로 항구코드는 각 도시 또는 항구 이름을 기준으로 지정된 다섯자리 코드, 항구명은 전 세계항구의 영문항구명으로 된 데이터를 제공
