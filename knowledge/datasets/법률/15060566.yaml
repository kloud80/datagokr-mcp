description_portal: 법무부 홈페이지에 매월 업데이트하는 전국 변호사 현황에 대한 정보입니다.이 정보를 통해 변호사 현황에 대한 객관적인 자료와 통계에 활용하실 수 있습니다.접근방법-법무부 홈페이지-법무정책서비스-법무법인-자료실에서 엑셀파일로 다운받으실 수 있습니다.해당 파일의 내용은 개업변호사/법무법인/법무법인(유한) 소속 변호사로 구분하고 광역시와 도별로 총원을 보여주고 세부 지역별로 다시 구분하여 변호사의 증감현황을 구분하여 제공하고 있습니다.매월 업데이트 되는 자료를 통해 비교가능한 자료를 제공합니다.
