summary_user: 정보통신망법상 사이버 명예훼손 사건에 대한 검찰의 접수·처분 결과를 전국 단위 연도별로 집계한 파일로, 구속·불구속 기소, 약식기소, 혐의없음, 기소유예 등 처분 유형별 수치를 사건 수와 인원 수(건_명)로 나눠 담는다. 분석가나 기자가 '온라인 명예훼손 고소 사건 중 실제 기소되는 비율이 해마다 어떻게 변했나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대검찰청 처분결과 통계나 경찰청 발생 통계와는 연도와 죄명을 기준으로 맞춰 이어 쓴다.
description_portal: 사이버 명예훼손이란 "정보통신망 이용촉진 및 정보보호 등에 관한 법률"에 따라 사람을 비방할 목적으로 정보통신망을 통해 공공연하게 사실이나 거짓의 사실을 드러내어, 타인의 명예를 훼손한 자에 대해 적용하는 죄목을 말하며, 이에 대한 검찰의 처분결과(구속구공판, 불구속구공판, 구약식, 혐의없음, 기소유예, 죄가안됨, 공소권없음, 각하, 기소중지, 참고인 중지, 공소보류, 소년보호사건송치, 가정보호사건송치, 타관이송)를 연도별로 사건수와 인원수로 구분하여 제공합니다.(집계기준:접수건(명)수, 처분건(명)수)
