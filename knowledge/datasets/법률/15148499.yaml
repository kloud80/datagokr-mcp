description_portal: 국가소송 사건 수행과 관련하여 정부법무공단이 수행한 소송 업무에 대한 고객기관 만족도를 조사하여 점수화한 데이터입니다. 해당 데이터는 소송수행 서비스의 품질을 객관적으로 평가하고, 공단의 소송수행 역량 강화 성과를 측정하기 위한 핵심 지표로 활용됩니다. 고객기관의 설문조사를 기초로 데이터 통계를 추출하여 PCSI 2.0 방식으로 평균값이 아닌 가중치에 의한 점수를 표현하고 있습니다.고객의 피드백을 기반으로 소송 수행 과정의 문제점을 개선하고, 법률지원 역량 강화를 위한 정책 수립에 반영합니다.
