summary_user: 1900년대 대검찰청과 산하기관이 생산한 판결문 기록물철의 목록으로, 국가기록원이 원본을 스캔해 수집한 기록물철마다 관리번호·제목·생산년도·생산기관·형태·건수를 담는다(전국 범위, 약 297KB 크기의 CSV 파일). 형사·사법제도 연구자나 기록물 이용자가 "특정 연도에 어느 검찰 기관이 어떤 판결문철을 몇 건 남겼는가"를 찾고 원문 열람 대상을 고르는 데 쓴다. 다른 데이터와 바로 이을 전역 조인 키는 없으며, 생산기관 이름이나 생산년도를 기준으로 이름을 맞춰 연결해야 한다.
limits: 판결문 원문이 아니라 기록물철 목록이며, 원문에는 개인정보가 있어 열람하려면 대검찰청 등 관계 기관에 별도로 확인해야 한다. 부분 제공 자료이고 시군구·죄명·월 단위 범죄 통계가 아니어서 지역 범죄 지표나 경찰청 발생 통계와 직접 비교할 수 없다.
