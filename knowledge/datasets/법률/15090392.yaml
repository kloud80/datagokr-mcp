description_portal: 이 데이터는 1900년대 대검찰청 및 그 산하기관에서 생성된 판결문 기록물로, 사법기록의 역사적 가치를 보존하기 위해 국가기록원이 원본 스캔 방식으로 수집한 자료입니다. 해당 판결문에는 사건 당사자들의 개인정보가 포함되어 있어, 원문 열람이 필요한 경우에는 대검찰청 등 관계 기관에 별도로 열람 가능 여부를 확인해야 합니다. 이 자료는 형사·사법제도 연구, 검찰사무 이력 파악, 근대기 법무행정의 변천 과정을 이해하는 데 활용될 수 있으며, 부분 제공되는 데이터입니다.
