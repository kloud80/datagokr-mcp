description_portal: 범죄피해자 지원기관 현황 자료로  제공 항목은 범죄피해자지원분류코드, 범죄피해자지원기관분류코드명, 범죄피해자지원기관코드, 범죄피해자지원기관명을 제공- 범죄피해자지원포털이란?피해자 사건조회에서 지원제도 안내, 진행상황 확인까지 피해자 관점에서 시기별, 제도별 피해자에게 필요한 서비스를 일괄 제공하는 피해자 중심의 포털 서비스 구축합니다.- 범죄피해자 지원제도 안내1.피해자 지원제도를 경제적 지원, 법률/심리 지원, 신변보호 등으로 분류하여 피해자가 쉽게 이해할 수 있도록 안내2.선택된 분류 내에서 각 제도별로 지원요건을 직접 선택할 수 있는 체크리스트 개발3.지원 가능 제도별로 제도의 내용, 주관기관, 절차, 기간, 연락처 등의 상세 정보 제공4.각 제도를 쉽게 설명해주는 시각화 이미지 적극 활용5.지원대상 및 요건에 대한 추가 설명을 위한 도움말 제공6.피해자 지원제도와 관련된 FAQ 기능 제공
