description_portal: 1. 형의 집행 및 수용자의 처우에 관한 법률 시행규칙 제90조에 따라 수형자는 경비처우급에 따라 개방처우금 원5회이내,     완화경비처우급 월 3회 이내의 전화통화가 허용되며, 분류처우업무지침에 따라 허용 횟수를 2회 늘릴 수 있으며,     일반경비처우급, 중경비처우급의 경우에도 처우상 특히 필요한 경우 월 2회 이내에서 하가가 가능하다.2. 수용자의 처우관련 통계로 수용자 전화 사용 현황을 제공( 사용건수, 1일평균 인원, 1인당 평균사용건수) 년단위 통계를 제공한다.    - 1년 단위로 수용자가 전화를 사용한 건수의 합계 제공    - 1년 단위로 전국 기관에 수용된 수용자의 수를 1일 평균으로 계산하여 수용된 수용자의 인원을 제공    - 1년 단위로 교정시설 수용자의 1인당 전화 사용 건수를 전국 기관에 수용된 수용자의 1일 평균 수용 인원으로 나누어 1인당 연 평균 사용 건수를 계산하여 제공
