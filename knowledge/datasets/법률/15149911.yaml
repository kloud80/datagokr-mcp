summary_user: 국내 체류외국인 전체(90일 이내 단기체류자와 등록외국인·외국국적동포 국내거소신고자를 포함한 장기체류자)의 수를 연·월과 국적(지역)별로 집계해 담으며, 검증 호출에서 전국 단위 209행을 받았다. 분석가·정책 담당자가 "특정 월에 어느 국적의 체류외국인이 가장 많고, 전년 같은 달보다 얼마나 늘었나" 같은 질문에 쓴다. 전역 조인 키는 없어서, 다른 출입국 통계나 인구 자료와는 연·월과 국적명(country)을 이름으로 맞춰 이어 쓴다.
limits: 전국 단위 비공간 집계라 시군구 등 지역별 체류외국인 분포는 이 데이터로 알 수 없다. 국적이 코드가 아닌 이름으로만 제공돼 다른 자료와 연결하려면 국적명 매핑이 필요하다. 개발계정은 하루 1,000회로 호출이 제한된다.
