description_portal: 해당 통계 자료는 행정소송의 현황과 질적·양적 변화를 측정·분석하여 행정 정책 및 소송 관리 전략 수립을 위한 기초 자료로 활용하기 위해 작성된 통계입니다. 연도별(기준일로부터 10년)로 행정기관을 당사자로 하는 소송에 대한 현황을 담고 있으며, 주요 항목으로는 접수건수(해당 연도에 접수된 행정소송 수), 처리건수(해당 연도에 판결 등으로 종결된 사건 수), 승소건수(행정기관이 승소한 건수), 승소율(처리건수 대비 승소 비율), 패소건수(행정기관이 패소한 건수), 패소율(처리건수 대비 패소 비율) 등이 포함되어 있습니다. 이 자료를 통해 연도별 행정소송의 추이와 행정기관의 법적 대응 성과를 파악할 수 있으며, 행정 효율성 및 소송 관리 역량 분석에도 활용됩니다.
