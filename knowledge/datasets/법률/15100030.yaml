summary_user: "취업자격 체류외국인 가운데 전문인력(C-4, E-1~E-7: 교수·회화지도·연구·기술지도·전문직업·예술흥행·특정활동 등)의 인원을 연·월과 체류자격별로 집계한 전국 단위 통계 파일이다. 분석가나 정책 담당자가 '최근 몇 년 사이 특정활동(E-7)이나 회화지도(E-2) 자격 전문인력이 매월 어떻게 늘고 줄었나'를 확인하는 데 쓴다. 전역 조인 키는 없어 연·월과 체류자격 이름을 맞춰 같은 기관의 다른 체류외국인 통계와 이어 쓴다."
limits: 전국 단위 비공간 집계라 시군구 등 지역별 분포는 알 수 없다. 공통 코드 키가 없어 다른 데이터와는 연월·자격명 문자열을 맞춰 연결해야 한다.
