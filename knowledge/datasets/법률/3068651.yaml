description_portal: 해당 통계 자료는 연도별 국가배상 소송의 현황과 변화를 측정·분석하여 배상 정책 수립 및 소송 관리에 활용하기 위해 작성된 통계입니다. 연도별(기준일로부터 10년)로 국가가 당사자인 배상 소송에 대한 현황을 담고 있으며, 주요 항목으로는 접수건수(해당 연도에 접수된 국가배상 소송 수), 처리건수(해당 연도에 판결 등으로 종결된 사건 수), 인용건수(국가배상 청구가 인용된 건수), 인용율(처리건수 대비 인용 비율), 기각건수(청구가 기각된 건수), 기각률(처리건수 대비 기각 비율) 등이 포함되어 있습니다. 이 자료를 통해 연도별 국가배상 소송의 추이와 국가의 법적 대응 성과를 파악할 수 있으며, 배상 정책의 효율성 및 소송 관리 역량 분석에도 활용됩니다.
