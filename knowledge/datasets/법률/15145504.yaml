summary_user: 서울 집계구(OA_CD) 단위로 특정 날짜·시간대별 단기체류 외국인 생활인구를 담은 집계 데이터로, 총 생활인구와 중국인·기타 외국인 체류인구 수를 나눠 담는다. 상권 분석가나 구청 담당자가 '어느 지역에 몇 시에 단기체류 외국인이 많이 머무는가'를 보고 관광·상권·다문화 정책 대상을 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동 코드(ADSTRD_CODE_SE)나 집계구 코드를 이름·코드 매핑해 주민등록 인구 등 지역 데이터와 연결해야 한다.
