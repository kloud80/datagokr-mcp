summary_user: 국내 체류 외국인을 대륙·국적·성별로 나누고 0~4세부터 60세 이상까지 5세 단위 연령대별 인원을 담은 전국 단위 집계 파일로, 해당 연도말 시점 기준이며 불법체류자와 단기(관광) 체류자까지 포함한다. 분석가나 정책 담당자가 '특정 국적 체류 외국인 중 20~30대 비중이 얼마인가', '국적별 성비와 연령 구조가 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국적명·대륙명 같은 이름 매핑으로만 이어 쓰며, 지역 정보가 없어 시군구 주민등록 인구와 직접 연결되지는 않는다.
limits: 전국·비공간 집계라 시군구 등 지역별 외국인 분포나 월별 추이는 알 수 없다. 조인 키가 없어 다른 출입국 통계와 붙이려면 국적·대륙 이름을 직접 맞춰야 한다.
