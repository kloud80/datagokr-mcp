summary_user: 사회통합프로그램·이민자 조기적응프로그램 참여자를 건별로 담은 원천 파일로, 참여자의 성별·생년·국적과 관할 출입국사무소, 운영기관과 주소, 과정명·세부과정·이수 구분을 전국 범위로 담는다(CSV 약 70MB). 다문화·이민정책 분석가가 "어느 지역 운영기관에서 어떤 국적의 이민자가 한국어·한국사회 이해 과정을 얼마나 이수하는가"를 따지는 데 쓴다. 전역 조인 키는 없어 국적명·관할사무소명 같은 이름 매핑이나 운영기관주소를 시군구로 바꿔 지역별 체류 외국인·주민등록 인구 통계와 잇는다.
