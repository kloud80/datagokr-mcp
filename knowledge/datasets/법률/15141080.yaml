id: '15141080'
tier: verified
title: 헌법재판소_선고사건 조회 서비스
sector: 법률/법무및검찰/crime-statistics
agency:
  id: '9750000'
  name: 헌법재판소
kind: API
channel: portal
portal_url: https://www.data.go.kr/data/15141080/openapi.do
synonyms:
  - 선고사건일정
  - 선고목록
  - 최근주요결정목록
  - 헌재 결정
  - 헌법재판 선고
  - 위헌 결정
  - 헌법소원
  - 탄핵심판
  - 종국결과
  - 결정요약
  - 헌재 판례
summary_user: 헌법재판소가 선고한 사건을 사건 단위로 담는 API로, 년월별 선고 일정과 선고 목록, 사건번호·사건명·종국일자·종국결과, 최근 주요결정의 결정요약문 같은 상세정보를 제공한다. 국민이나 법률 실무자가 '이번 달 헌법재판소 선고 일정은 언제이고, 특정 헌법소원 사건은 어떤 결과로 종국됐나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 사건번호(eventNo)·사건명으로 다른 판례·법령 자료와 이름 매칭하거나 주요사건일련번호(seqNo)로 같은 API의 상세 조회에 이어 쓴다.
description_portal: 헌법재판소 선고사건 조회 서비스는 년월 기준 선고선고 일정, 선고목록, 선고시작/종료일 , 종국결과 , 사건명 기준 최근 주요결정 목록 및 상세정보를 제공하는 API로, 최근 선고사건 정보를 쉽게 조회할 수 있습니다.
team:
  dept: 정보화기획과
services:
  - op: /getSentenceSchduleList
    name: 선고사건 일정 조회
    endpoint: https://apis.data.go.kr/9750000/SentenceCaseService/getSentenceSchduleList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        desc: 페이지번호
      - name: numOfRows
        required: false
        desc: 한 페이지 결과 수
      - name: type
        required: false
        desc: 응답결과 출력형식(xml,json) 기본값:xml
      - name: fields
        required: false
        desc: '응답에 노출할 필드명 콤마(,)로 구분해서 입력, 기본 : 모든필드 출력'
      - name: year
        required: true
        desc: 선고년(YYYY)
      - name: month
        required: false
        desc: 선고월(mm)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
