      - name: fields
        required: false
        desc: '응답에 노출할 필드명 콤마(,)로 구분해서 입력, 기본 : 모든필드 출력    '
      - name: adjudgeDateTime
        required: true
        desc: 선고년월시간 모두포함
    paging:
      page: pageNo
