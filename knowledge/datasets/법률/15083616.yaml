summary_user: 서울시 공공데이터와 통신데이터로 추정한 장기체류 외국인 생활인구를 기준일·시간대별, 행정동(읍면동) 단위로 담은 집계 데이터로, 총생활인구와 중국인·중국 외 외국인 체류인구를 나눠 제공한다. 상권·주거·다문화 정책 분석가가 '특정 행정동에 어느 시간대에 장기체류 외국인이 얼마나 머무는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드(ADSTRD_CODE_SE)를 서울시 행정동 코드·명칭과 매핑해 주민등록 인구나 다른 서울생활인구 자료와 이어 쓴다.
description_portal: '서울시가 보유한 공공데이터와 통신데이터로 측정한 특정시점에 서울의 특정 지역에 존재하는 장기체류 외국인 정보입니다.기준일, 시간대구분, 행정동코드, 총생활인구수, 중국인체류인구수, 중국외외국인체류인구수를 제공합니다.※ Sheet, Open API는 최근 2개월 데이터만 제공합니다.*원천시스템 : 서울시 빅데이터분석활용시스템제공부서는 서울특별시 디지털도시국 데이터전략과(02-2133-4267)입니다.※ 바로가기 클릭 시 서울특별 열린데이터광장 개방 데이터로 이동합니다.'
