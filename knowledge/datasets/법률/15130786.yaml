summary_user: 국민권익위원회가 비실명대리신고를 지원하려고 구성한 자문변호사단의 명단 파일로, 변호사 한 명당 한 행에 성명·소속회·주요경력·상담분야를 담는다(전국 범위, 비공간). 부패·공익침해 행위를 신원을 밝히지 않고 신고하려는 사람이 "어떤 분야를 상담하는 대리신고 변호사가 있나"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 변호사 명부나 법무 데이터와는 성명이나 소속회 이름을 직접 맞춰야만 이을 수 있다.
description_portal: 국민권익위원회는 부패 및 공익침해 행위에 대한 신고 활성화를 위해 비실명대리신고 제도를 운영하고 있으며, 이를 지원하기 위해 자문변호사단을 구성하고 있습니다. 변호사 명단과 각 이력 및 소개에 대한 정보는 청렴포털을 통해 공개되며, 신고자가 신원을 밝히지 않고도 변호사를 통해 신고할 수 있도록 지원합니다. 자문변호사단은 법률적 자문을 제공하고, 신고자의 권익 보호를 위한 역할을 수행합니다. 이 제도는 신고자의 신변 보호와 부패 행위의 효과적인 제재를 동시에 달성하는 데 기여합니다. ​
