description_portal: '2006년 통계 데이터○ 통계개요* 통계명 : 등록외국인 현황(국적별/동별)* 통계종류 : 서울 체류 외국인의 현황을 국적별(주요국가)로 제공하는 일반ㆍ보고통계* 작성목적 : 서울 체류 외국인의 변동추이를 파악하여 정책수립의 기초자료로활용하는 것을 목적으로 함* 조사체계 : 출입국관리사무소 → 법무부* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울 체류 외국인의 국적별 현황○ 용어설명* 등록외국인은 출입국관리법에 의해 90일 초과 장기체류자 중에서 작성기준일 현재외국인 등록표에 등재된 자의 집계결과로서 실제로 국내에 거주하고 있는외국인 수와는 차이가 있을 수 있음○ 기 타* 영국인에는 영국 속국민, 외지민, 외지 시민 포함* 러시아 한국계 러시아인 포함* 홍콩인에는 홍콩거주 난민 포함'
