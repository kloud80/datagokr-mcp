description_portal: 법무부, 대한변호사협회, 행정안전부가 운영하는 마을변호사 제도는 변호사가 개업하지 않은 무변촌, 도서산간 지역 및 지방소도시 읍면동을 중심으로 운영됩니다. 이에 현재 서울특별시, 대전광역시, 광주광역시에는 마을변호사를 위촉하고 있지 않으며, 대구광역시, 부산광역시, 울산광역시, 인천광역시에는 법률서비스 접근성이 취약한 읍면동 단위의 마을에 한정하여 마을변호사를 위촉하고 있습니다. 마을변호사는 읍면동 단위로 마을을 담당하게 됩니다. 담당할 수 있는 마을의 개수에는 특별한 제한이 없으므로, 마을변호사 1명이 여러 개의 마을을 담당할 수 있으며, 반대로 1개의 마을에 여러 명의 마을변호사가 위촉될 수도 있습니다.
