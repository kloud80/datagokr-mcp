summary_user: 국내에 체류 중인 외국인 유학생(유학 D-2, 한국어연수 D-4-1, 외국어연수 D-4-7)의 수를 년·월, 국적(지역), 구분별로 집계한 전국 단위 통계 파일로, 공간 단위 구분은 없습니다. 유학생 유치 정책 담당자나 대학·어학원 분석가가 "어느 나라 유학생이 월별로 얼마나 늘거나 줄었나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 출입국·체류 통계와는 년·월과 국적명을 이름 그대로 맞춰 이어 쓴다.
