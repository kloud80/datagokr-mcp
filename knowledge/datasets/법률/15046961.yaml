description_portal: '○ 통계개요* 통계명 : 등록외국인 현황(체류자격별/구별)* 통계종류 : 서울 체류 외국인의 현황을 체류자격별로 제공하는 일반ㆍ보고통계* 근거법령 :「출입국관리법 시행령」제12조* 작성목적 : 서울 체류 외국인의 체류자격을 파악하여 정책수립의 기초자료로 활용하는것을 목적으로 함* 조사체계 : 출입국관리사무소 → 법무부* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울 체류 외국인의 체류자격별 현황○ 용어설명* 등록외국인은 출입국관리법에 의해 90일 초과 장기체류자 중에서 작성기준일 현재외국인 등록표에 등재된 자의 집계결과로서 실제로 국내에 거주하고 있는외국인 수와는 차이가 있을 수 있음* 외국인 체류자격 설명- 문화예술(D-1) : 수익을 목적으로 하지 않는 학술 또는 예술상의 활동을 하려고 하는 자- 유학(D-2) : 전문대학 이상의 교육기관 또는 학술연구기관에서 정규과정의 교육을받거나 특정의 연구를 하고자 하는 자- 기술연수(D-3) : 법무부장관이 정하는 연수조건을 갖춘 자로서 국내의 산업체에서연수를 받고자 하는 자- 일반연수(D-4) : 유학(D-2) 자경에 해당하는 교육기관 또는 학술연구기관 외에 교육기관이나 기업체?단체 등에서 교육 또는 연수를 받거나 연구활동에 종사하려는 자- 기타(G-1) : 외교(A-1)부터 결혼이민(F-6), 관광취업(H-1) 및 방문취업(H-2) 자격에해당하지 아니하는 활동. 산업재해 청구, 치료중인 자와 보호자, 외국인환자 등- 관광취업(H-1) : 대한민국과 관광취업에 관한 협정이나 양해각서를 체결한 국가의국민으로서 관광을 주된 목적으로 하면서 이에 수반되는 관광경비 충당을 위하여단기간 취업활동을 하려는 자'
