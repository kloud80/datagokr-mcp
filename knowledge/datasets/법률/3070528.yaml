description_portal: 범무부 범죄예방정책국 소속기관인 소년보호기관(소년원, 분류심사원 등)은 소년범에 대한 위탁, 수용, 조사 등 교육과 재사회화와 관련된 업무를 수행합니다. 본 자료는 법원 소년부에서 소년분류심사원에 위탁한 소년에 대한 분류심사와 비수용 소년에 대한 상담조사를 통한 비행원인 진단과 재범 방지 교육, 그리고 학교 부적응자·기소유예자·법원에서 의뢰 또는 결정한 교육대상자에게 실시하는 대안교육  조사 자료(분류심사, 상담조사, 대안교육 )의 연도별 건수를 제공합니다. (학술연구, 행정 업무, 범죄예방정책 수립 등 자료 활용 목적)
