summary_user: 2011~2025년 출입국심사를 마친 출입국자 수를 연도·출국/입국 구분·국민/외국인 구분별로 집계한 전국 단위 파일로, 한 사람이 여러 번 드나들면 매번 따로 센 연인원 통계다. 여행·항공 업계나 정책 분석가가 '최근 몇 년간 내국인 출국자와 외국인 입국자가 어떻게 늘고 줄었나' 같은 연도별 추이를 볼 때 쓴다. 전역 조인 키는 없고 지역 구분도 없어, 다른 데이터와는 연도와 출입국·내외국인 구분 이름을 맞춰 붙이는 방식으로만 연결한다.
description_portal: 2011년부터 2025년까지 연도별  출국 및 입국심사 완료된 출입국자 수를 국민과 외국인으로 분류 하여 제공 (연도, 출입국구분, 내외국인 여부, 출입국자수)1. 해당 통계는 중복으로 집계되는 통계이며 한명이 여러번 출입국 한 경우 다수로 집계 됨2. 해당 통계는 출입국외국인정책본부 홈페이지의 통계연보에서도 확인하실 수 있습니다. ( 출입국외국인정책본부 홈페이지 - 빅데이터 통계 - 통계연보 - 해당연도 통계연보 게시물)3. 통계연보의 경로는 다음과 같습니다.https://www.immigration.go.kr/immigration/1570/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaW1taWdyYXRpb24lMkYyMjglMkY1OTY0NjQlMkZhcnRjbFZpZXcuZG8lM0ZwYXNzd29yZCUzRCUyNnJnc0JnbmRlU3RyJTNEJTI2YmJzQ2xTZXElM0QlMjZyZ3NFbmRkZVN0ciUzRCUyNmlzVmlld01pbmUlM0RmYWxzZSUyNnBhZ2UlM0QxJTI2YmJzT3BlbldyZFNlcSUzRCUyNnNyY2hDb2x1bW4lM0QlMjZzcmNoV3JkJTNEJTI2
