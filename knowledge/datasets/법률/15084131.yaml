description_portal: '-대국민포털의 상황통계 현황 자료로 제공 항목은  경찰사건진행상황조회건수, 검찰사건진행상황조회건수, 법원사건진행상황조회건수, 미납벌과금조회건수, 벌과금납부내역조회건수 등을 제공합니다.-대국민 형사사법포털 서비스의 기능은  형사사법포털 및 모바일 앱을 통하여 형사사건 진행정보 및 온라인 민원, 벌과금 납부조회 등 대국민 형사사법 서비스 제공합니다.-민원신청 38종, 통지서 27종, 증명서발급 14종 등 79종의 서비스  사건관계인 등 일반 국민이 PC 또는 스마트폰 앱을 통해 사건조회‧벌과금 조회‧온라인 민원서비스 등을 제공받을 수 있는 형사사법포털(www.kics.go.kr) 운영민원서비스(총 79종) : 민원신청(38종), 통지서조회(27종), 증명서발급(14종)'
