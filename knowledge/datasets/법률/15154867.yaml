description_portal: '대전광역시 유성구 관내 장애인전용주차구역에서 발생한 단속 위반 현황을 월별로 집계한 자료입니다.불법주차, 주차방해, 표지위반 등 「장애인·노인·임산부 등의 편의증진 보장에 관한 법률」에 따라 단속되는 주요 위반유형에 대해 발생월, 단속유형코드, 위반 건수, 과태료 부과총액 등을 구조화하여 제공합니다.데이터는 단속 처리 시스템에서 산출된 월별 확정 통계를 기반으로 하며, 동일 월 내 신고·현장단속·이첩 건 등이 모두 포함됩니다.각 행(row)은 특정 월의 특정 단속유형(예: 불법주차)의 총 건수와 해당 건에 따른 과태료 금액 합계를 의미합니다.■ 데이터 구성시군구명: 단속 발생 지역(대전광역시 유성구)단속유형코드: 불법주차(1), 주차방해(3), 표지위반(5) 등 위반 유형을 나타내는 내부 코드발생월(YYYYMM): 해당 단속 건수가 확정된 기준월단속유형명: 장애인전용주차구역 불법주차·주차방해·표지위반 등건수: 해당 월·유형별 확정 단속 건수(중복 없음)과태료합계: 위반 건수에 대한 부과 과태료 총액(원 단위)■ 데이터 특이사항 및 해석 유의점단속유형코드는 행정 내부 분류코드이며, 유형별 상세 기준은 관련 법령 및 지침에 따릅니다.과태료 금액은 직권부과·현장부과·민원 처리 결과 등이 포함되며, 감경·가산 등 이후 변동사항은 반영되지 않을 수 있습니다.자료는 월 단위로 확정된 통계값이므로 개별 사건별 원시 데이터는 포함하지 않습니다.CSV 형태로 제공되며, 총 205행 수준의 소규모 통계자료로 일반적인 분석 도구에서 바로 활용 가능합니다.데이터는 민원 증가 추이 분석, 주차환경 개선 계획 수립, 장애인 편의시설 정책연구 등 행정·정책적 활용을 위해 작성되었습니다.■ 활용 예시장애인전용주차구역 위반 증가·감소 추세 분석월별 주요 위반유형 파악 및 단속 인력 배치 계획지역별 불법주차 예방 정책 수립 근거'
