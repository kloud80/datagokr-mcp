description_portal: 해당 통계 자료는 국가소송의 현황과 질적, 양적변화 등을 측정 분석하여 송무정책 수립 등의 자료로 사용하기 위하여 작성된 통계로연도별(기준일로부터 10년)로 국가가 당사자인 소송에 대한 통계를 담고 있습니다. 주요 항목으로는 접수건수(해당 연도에 접수된 국가소송 수), 확정건수(판결이 확정된 건수), 승소건수(국가가 승소한 건수), 승소율(확정건수 대비 승소 비율), 패소건수(국가가 패소한 건수), 패소율(확정건수 대비 패소 비율) 등이 포함되어 있습니다. 이를 통해 연도별 국가소송의 추이, 국가의 법적 대응성과 성과를 파악할 수 있으며, 행정 효율성과 소송 관리 역량 분석에 활용될 수 있습니다.
