description_portal: '- 북한의 행정구역에 관한 내용입니다.(연번,행정구역명,시·도 구분,시·군·구역·지구 구분,구·읍·면·동·리 구분)- 북한의 행정구역 체계 기준    기준 행정구역 : 북한은 법적으로 1직할시, 2특별시 9도, 1특별행정구역으로 구성됩니다.    세부 단위까지 분류 : 도->시/군->구역->리/동/읍 단위로 세분화되어 있습니다.    북한 자체 통계 및 자료(예 : 조선중앙연감)- 인권침해 사건과의 연계 정리- 업데이트 및 검증- 북한 행정구역 체계는 통일부(통일부 간행물, 북한자료센터, 북한이해 등)에서 얻을수 있으며, 통계청(북한 인구지리 관련 공식 통계 정리)에서도 얻을수 있습니다.'
