summary_user: 난민법 시행 이후 2013년부터 2022년까지 연도별·국적별 난민신청자, 난민인정자, 인도적 체류허가자 수를 담은 전국 단위 집계 파일입니다. 연구자나 정책 담당자가 특정 국적의 난민 신청이 해마다 어떻게 늘고 줄었는지, 신청 대비 인정·인도적 체류허가가 어느 정도인지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 출입국·체류 통계와는 연도와 국적명을 맞춰 붙여야 한다.
limits: 신청 100건 미만인 국가는 신원 특정 우려로 '기타'로 묶여 있어 소수 국적의 개별 현황은 알 수 없다. 지역 구분이 없는 전국 집계라 시군구별 분석에는 쓸 수 없고, 다른 데이터와 잇는 공통 코드가 없어 국적명 매핑이 필요하다.
