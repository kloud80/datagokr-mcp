description_portal: 난민법 시행 이후인 2013년부터 2022년까지의 연도별, 국적별, 난민신청자, 난민인정자, 인도적 체류허가자의  자료를  제공- 다만, 난민인정 신청 100건 미만의 국가의 경우 난민신청자의 신원이 특정 될 우려가 있어 [공공기관의 정보공개에 관한 법률] 제9조제1항제1호 및 제2호, [난민법] 제17조에 따라 제공불가하여   100건 미만인 경우 기타로 표기됨.G-1-5 비자는 대한민국에서 난민 신청을 한 외국인에게 발급되는 체류 자격입니다. 이 비자는 난민 신청 심사 기간 동안 국내 체류를 허가하며, 난민 인정을 받지 못하더라도 인도적인 차원에서 체류를 허가받은 경우에도 발급될 수 있습니다. 인도적 체류허가자의 체류자격은 주로 "기타(G-1-6)" 체류자격이 부여되며, 1년 단위로 체류기간 연장이 가능합니다. 배우자와 미성년 자녀에게는 "G-1-12" 체류자격이 부여됩니다. 난민인정자에게는 F-2-4 체류자격이 주로 부여등록외국인의 세부자격별/지역별 현황은 출입국외국인정책본부 홈페이지를 통해 분기별 공개중
