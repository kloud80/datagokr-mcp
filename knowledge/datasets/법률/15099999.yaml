summary_user: 법무부가 전자여행허가(K-ETA)를 신청한 외국인의 신청 건수를 연·월과 입국목적(관광, 방문, 사업, 질병치료, 회의, 행사, 스포츠경기, 기타 등)별로 집계한 전국 단위 통계 파일입니다. 관광·마이스·출입국 분야 분석가가 '최근 K-ETA 신청자 중 관광 목적과 사업·회의 목적 비중이 월별로 어떻게 달라졌나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 출입국·체류 통계와는 연·월과 입국목적 명칭을 맞춰 붙여야 한다.
limits: 전국 합계만 담고 있어 지역별 분석에는 쓰지 못하고, 국적별 구분도 이 데이터의 필드에는 없다. 공통 조인 키가 없어 다른 데이터와는 연·월이나 목적 명칭으로만 맞춰 연결해야 한다.
