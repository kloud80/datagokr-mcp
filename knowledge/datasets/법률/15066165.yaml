summary_user: 인천광역시 소년범죄를 연도별로 강력범·절도범·폭력범·지능범·풍속범·기타형법범·특별법범 건수로 나눠 담은 시 단위 집계표이며, 파일 크기가 166바이트에 불과한 소규모 CSV입니다. 인천 지역 청소년 범죄가 연도별로 어떤 유형에서 늘거나 줄었는지 살펴보려는 분석가나 청소년 선도·학교폭력 예방 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 '인천광역시'라는 이름으로만 맞춰 붙여야 하며, 경찰청 범죄 발생 통계 같은 같은 개념의 지역 범죄 지표와 나란히 비교하는 용도로 쓴다.
description_portal: 인천광역시가 제공하는 소년범죄 현황 공공데이터는 시에서 발생한 주요 범죄 유형별 건수를 연도별로 집계한 통계 자료입니다. 이 데이터는 지역 청소년 범죄 발생 추이, 사회 안전 문제, 범죄 유형별 변화 등을 파악하고, 학교 폭력 및 청소년 범죄 예방 대책, 맞춤형 선도 프로그램, 치안 환경 개선 등의 정책 수립 기초 자료로 활용됩니다. 이 자료는 지역 사회의 치안 상황 및 청소년 선도 대책을 수립하는 데 필수적입니다.해당 데이터는 국가통계포털(KOSIS)에서 참고 하였으며, 공공데이터포털에서 CSV파일을 무료로 다운로드 할 수 있습니다.
