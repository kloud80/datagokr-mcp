summary_user: 91일 이상 체류하려고 국내 거소신고를 한 외국국적동포(불법체류자 포함, 단기체류자·등록외국인 제외)의 수를 년·월·시도별로 집계한 전국 단위 통계 파일이다. 지자체나 분석가가 '어느 시도에 외국국적동포 거소신고자가 얼마나 늘었나'를 월별로 보며 다문화·노동·주거 수요를 가늠하는 데 쓴다. 전역 조인 키는 없어 시도 이름과 년·월을 맞춰 주민등록 인구나 등록외국인 지역별 현황 같은 다른 지역 통계와 이어 쓴다.
description_portal: 「재외동포의 출입국과 법적지위에 관한 법률」제2조제2호에 따라 91일 이상 체류하기 위해 지방 출입국· 외국인관서의 장에게 국내 거소신고를 한 외국국적동포 국내거소 신고자의 거주지역별 현황을 월별로 제공 전체 체류외국인 중 단기체류자 및 등록외국인을 제외한 외국국적동포 거소신고자의 거주지역별 현황(불법체류자 포함)통계월보의 경로는 아래와 같습니다. 해당월 통계월보 한글파일, 체류관리현황-외국국적동포 중 거소신고자 현황https://www.immigration.go.kr/immigration/1569/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaW1taWdyYXRpb24lMkYyMjclMkY1OTU0MjYlMkZhcnRjbFZpZXcuZG8lM0ZwYXNzd29yZCUzRCUyNnJnc0JnbmRlU3RyJTNEJTI2YmJzQ2xTZXElM0QlMjZyZ3NFbmRkZVN0ciUzRCUyNmlzVmlld01pbmUlM0RmYWxzZSUyNnBhZ2UlM0QxJTI2YmJzT3BlbldyZFNlcSUzRCUyNnNyY2hDb2x1bW4lM0QlMjZzcmNoV3JkJTNEJTI2
