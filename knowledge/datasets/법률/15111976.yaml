description_portal: 교정시설에서는 수용자의 위생과 건강관리를 위해 의류, 침구, 그밖의 생활용품을 주기적으로 지급 교체 하고 있습니다.수용자 자비구매물품의 공급에 관한 지침에 따라 공급업무의 관리, 위원회구성, 자비구매물품 품목 통보, 제품 검사, 판매가격의 결정등을 근거로 운영됩니다.교정기관별로 수용자가 영치금을 이용한 자비 구매 물품의 주문 자료 이며, 제공되는 데이터 항목은 공급연월, 공급업체명, 주문 교정기관, 공급품목명, 주문수량(건수)을 제공합니다.1.  공급업체명은 자비구매 공급 자격을 획득한 업체입니다.2. 공급 품목명은 공급 자격별 제공가능한 품목을 수용자가 선택한 내역입니다.3. 주문수량은 실제 보관금을 이용하여 주문 및 구매가 완료된 건수를 의미합니다. 해당 데이터를 분석하면 수용기관별, 지역별 구매 항목 및 수량등의 파악이 가능하며 수용생활 처우 개선을 위한 다양한 자비구매 품목 정보를 분석할 수 있습니다.
