summary_user: 법무부가 체류 외국인 관리용으로 정보시스템에 보유한 국적(지역) 코드표로, 국적(지역)의 한글명과 영어명을 담은 소형 CSV 파일(약 5KB)이며 ISO 3166-1을 준용하되 해체·소멸된 국가(지역)도 일부 포함한다. 법무부 체류 외국인·출입국 통계를 다루는 분석가가 통계에 나온 국적 표기를 한글·영문 국가명으로 맞춰 읽거나 국가별로 묶을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 국적(지역)명 문자열 매칭이나 법무부 출입국·체류 통계의 같은 기관 코드로만 연결한다.
description_portal: 데이터 제공 신청이 접수되어 제공하는 일회성 데이터입니다.법무부에서 국내 체류하고 있는 외국인 관리하기 위해,  정보시스템을 통해  보유하고 있는 국적(지역) 코드입니다.일반적으로 ISO(국제표준화기구) 3166-1 을 준용하여 국가 및 지역에 대한 코드를 관리하고 있으나  과거에 한국에 입국하여 체류하고 있는 외국인들도 있어 일부 해체된 국가(지역) 혹은 사라진 국가(지역) 코드가  일부 포함되어 있습니다. 국가(지역)의 공식 명칭이 아니며, 관리목적의 행정자료임을 주지하시고 활용에 유의하여 주시기 바랍니다.
