summary_user: 법무부 범죄예방정책국 소속 소년원(수용기관)과 청소년비행예방센터의 기관 코드, 정식 기관명, 주소, 대표번호, 팩스번호를 기관 한 곳당 한 행으로 담은 전국 단위 기관 목록 파일(csv 약 3KB)이다. 보호자나 관계 기관이 특정 소년원·비행예방센터의 위치와 연락처를 찾거나, 분석가가 소년보호 관련 통계·사건 자료에 나오는 기관 코드를 실제 기관명과 주소로 풀어 볼 때 쓴다. 기관 코드(juvenile_instt_cd)가 조인 키라서 같은 KICS 기관 코드를 쓰는 소년보호 사건·통계 자료와 이어 쓰고, 주소로 시군구 단위 지역 정보와도 연결한다.
description_portal: 법무부 범죄예방정책국 소속기관 소년원(수용기관), 청소년비행예방센터에 대한 KICS 기관 코드, 주소, 대표 번호 등으로 구성된 자료 입니다. 해당 자료는 전국 단위 기관 정보를 통합 관리하기 위한 데이터로, 소년원 및 소년보호 기관별 업무 특성상 대상자 이송, 사건 연계, 통계 산출 등 기관 간 협력 과정에서 필수적으로 활용됩니다. 기관코드는 각 기관을 구분하기 위한 고유 식별자값이고 기관명은 해당 기관의 정식 명칭으로 관리되며, 주소 값은 방문 및 우편조회, 이송경로 등에 활용되고 있습니다.
