summary_user: 전국 공증사무소를 사무소 한 곳당 한 행으로 담는 목록 데이터로, 관할 검찰청과 사무소 이름·주소·우편번호·전화·팩스를 제공한다. 국민이나 사업자가 '우리 지역 검찰청 관할에 있는 공증사무소는 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키는 없어서 관할 검찰청 이름이나 주소를 문자열로 맞춰 지역 정보·검찰청 단위 자료와 연결해야 한다.
limits: 사무소 코드나 행정구역 코드 같은 공통 키가 없어 다른 데이터와는 이름·주소 매칭으로만 이을 수 있다. 사무소 위치·연락처 목록일 뿐이므로 공증 처리 건수나 범죄·사건 통계는 이 데이터로 알 수 없다. API 호출에는 포털에서 발급한 서비스키가 필요하고, 개발계정은 하루 10,000회로 제한된다.
