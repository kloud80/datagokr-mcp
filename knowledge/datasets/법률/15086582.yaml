description_portal: '- 교정시설에서 수용자의 건전한 사회복귀와 심성순화를 위해 준법태도, 친사회성, 자기통제 등 다양한 주제로 구성된 참여형 인성교육, 문화예술프로그램, 감사쓰기 등 다양한 교화프로그램을 실시.- 수용자 문화프로그램은 한국 문회예술 진흥원의 협조로 서예, 악기, 도자기 제작  등 다양한 형태로 운영 되고 있음- 수용자의 정서안정과 심성순화를 위해 실시하는 교화프로그램의 연도별 현황 자료 제공(참여 횟수, 참여 인원 등 제공)- 수용자 교육교화 관련 프로그램은 내부 우수인력 양성을 위해 교정교육 전문 강사 자격 취득시험을 운영하고 있음'
