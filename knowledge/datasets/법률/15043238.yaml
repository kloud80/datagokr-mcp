description_portal: 법무부에서는 법무부 해외진출 중소기업 법률자문단 운영규정 (법무부 훈령 제965호 일부개정 2014. 10. 13)에 따라 해외로 진출하는 우리 중소기업의 법률 자문을 무료로 지원하고 있습니다. 2019년   해외진출 중소기업 법률자문단이  법률 지원한  결과에 대한  분쟁국가별  법률지원  통계입니다.분쟁국가 총 61개국  339건을 법률지원 하였고, 법률 지원 순위 국가로는  1)중국(63건), 2) 미국(42건), 3) 베트남(27건),  4)독일(16건) 5) 일본, 인도(각 14건),  6), 영국, 싱가포르(각 13건) 순으로 법률을 지원하였습니다.
