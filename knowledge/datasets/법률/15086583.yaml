description_portal: '- 교정시설에서는 일반 학과교육, 전문대학 위탁교육, 방송통신대학교육 등 다양한 교육 기회를 제공하고 있음- 정규 교육과정(초,중,고등학교)을 이수하지 않거나 중간에 그만두었던 수형자들의 교육기회를 확대하고 사회의 정규교육과 연계하기 위하여 매년 초,중,고 졸업학력 검정고시반 운영- 대학과정은순천교도소에 순천제일대학교 전문대학 위탁교육과정을 설치운영하고 있으며, 검정고시반, 방송통신고등학교 및 전문대학 위탁교육과정과 연계하기 위해 여주교도소, 전주교도소, 청주여자교도소 포항교도소 등에 방송통신대학교를 설치 운영 중- 수용자 연도별 교육 이수 현황 자료로 방송통신고등학교과정(인원), 방송통신대학교과정(인원), 전문대학위탁교육(인원), 학사고시반교육(인원), 인성교육(횟수), 인성교육(인원) 등 자료 제공'
