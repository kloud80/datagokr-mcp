description_portal: 출정이란 법정에 나가는 일이라는 사전적 의미를 가지고 있지만 실무적으로는 수용자가 교정기관에서 벗어나 법률이 정하는 형사, 민사, 가사재판 등의 법정 철자에 참여하는 것과 검찰의 수사상 필요에 따라 검찰청에 출석하는 것을 의미합니다. 교정시설 방문조사(공무상접견)은 사법경찰관리, 외교관, 기타 공무소의 직원 등이 수사, 영사업무 수행 등 공무상 필요에 의하여 수용자와 접견하는 것을 의미한다.수용자의 법원 재판 출석, 검찰 조사를 위한 검찰청 출석 현황으로서, 수용자가 교정기관에서 벗어나 법률이 정하는 형사 민사 등의 법정 절차에 참여하는 것과 검찰의 수사상 필요에 따라 검찰청에 출석했던 현황 등을 제공합니다.
