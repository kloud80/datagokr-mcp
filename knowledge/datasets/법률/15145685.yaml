description_portal: '경기도 양평군 마을변호사 현황에 대한 데이터로, "담당읍면", "성명", "소속", "전화번호"의 정보를 포함하고 있습니다.주민이 일상에서 접하는 법률에 관련된 궁금증을 해소하고, 손쉽게 법률상담을 진행할 수 있도록 마을변호사(법률상담관) 제도를 무료로 운영하고 있으며,"대면상담"과 "전화상담" 두가지 방법으로 상담이 가능합니다.○ 마을변호사 대면(방문) 상담  - 일시 : 매월 첫째주, 셋째주 월요일 14:00~17:00(3시간)  - 장소 : 양평군청 별관2층 상담실  - 상담대상 : 대면하여 상담을 원하는 군민(사전 예약제)  - 문의처 : 기획예산담당관 법무팀(☎031-770-2071)  ○ 마을변호사 전화(수시) 상담  - 상담관 : 읍·면 담당 마을변호사  - 상담대상 : 전화로 상담을 원하는 군민  - 문의처 : 기획예산담당관 법무팀(☎031-770-2071)'
