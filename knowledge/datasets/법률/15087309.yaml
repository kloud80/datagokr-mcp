summary_user: 형사사법포털(대국민포털)에서 쓰는 행정구역 분류표로, 분류코드와 대분류·중분류 번호·이름을 담은 전국 단위의 작은 코드표 파일(약 8KB CSV)이다. 형사사법포털의 사건·민원 데이터나 범죄 통계에 나오는 지역 코드가 어느 시도·시군구를 가리키는지 확인하려는 분석가가 쓴다. 실측 컬럼에서 법정동코드 같은 전역 조인 키는 찾지 못했다. 따라서 다른 지역 데이터와는 대분류명·중분류명을 이름으로 맞추거나, 같은 기관 데이터의 행정구역분류코드로 이어 쓴다.
description_portal: '- 대국민포털에서 사용하는 행정구역 분류정보로 제공항목은  행정구역분류코드, 행정구역 대분류번호, 행정구역대분류명, 행정구역중분류번호, 행정구역중분류명 등 제공합니다.-대국민 형사사법포털 서비스의 기능은 형사사법포털 및 모바일 앱을 통하여 형사사건 진행정보 및 온라인 민원, 벌과금 납부조회 등 대국민 형사사법 서비스 제공합니다.-민원신청 38종, 통지서 27종, 증명서발급 14종 등 79종의 서비스 사건관계인 등 일반 국민이 PC 또는 스마트폰 앱을 통해 사건조회‧벌과금 조회‧온라인 민원서비스 등을 제공받을 수 있는 형사사법포털(www.kics.go.kr) 운영됩니다.민원서비스(총 79종) : 민원신청(38종), 통지서조회(27종), 증명서발급(14종)'
