description_portal: 2010년부터 2025년까지 12월 기준 외국국적동포의 체류자격별 현황입니다. 매년도 12월 통계월보 자료와 동일합니다.외국국적동포는 국적 및 체류자격을 기준으로 단기 등을 포함한 체류외국인을 기준으로 산정합니다.F4(재외동포) 와 H2(방문취업)를 포함하여, F5(영주), F1(방문동거)그외 자격을 포함합니다.F4, F5, H2의 국적별 현황 및 외국국적 동포 전체의 국적별 현황 또한 제공하고 있사오니 참고하여 주시기 바랍니다.해당 통계는 통계연보(6월말) 업데이트 시점에 맞추어 연도별로 7월 경 1번 업데이트 됩니다.해당 통계의 원본 통계는 출입국외국인정책본부 홈페이지의 통계연보를 참조하여 주시기 바랍니다.
