summary_user: 전자여행허가(K-ETA)를 거쳐 입국한 외국인 수를 연·월과 국적(지역)별로 묶은 집계 통계로, 전국 단위이며 지역(시군구) 구분이 없는 CSV 파일이다. 출입국 정책 분석가나 관광·항공 업계가 어느 국적의 K-ETA 입국자가 월별로 늘거나 줄었는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 출입국·체류 통계와는 연·월과 국적명(국적지역) 이름 매칭으로만 이어 쓴다.
