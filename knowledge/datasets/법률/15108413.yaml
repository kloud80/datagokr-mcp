summary_user: 전국 시군구별로 등록외국인 수를 성별과 국적(한국계중국인·베트남·중국 등 40여 개 국적 열과 총합계)로 나눠 담은 연도말 시점 집계 파일입니다. 지자체 담당자나 상권·노동 분석가가 '우리 시군구에 어느 나라 출신 등록외국인이 몇 명 사는가'를 확인해 다문화 지원이나 주거·상권 분석의 기초로 쓴다. 전역 조인 키나 행정구역 코드가 없어 시도·시군구 이름을 행정구역 코드에 매핑한 뒤 주민등록 인구 등 다른 시군구 통계와 이어 쓴다.
