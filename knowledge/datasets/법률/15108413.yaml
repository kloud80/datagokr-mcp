description_portal: '국내 체류중인 등록외국인의 시군구별 성별 국적별로 데이터를 제공 (제공 항목 : 시도, 시군구, 성별, 국적별) 해당 통계는 제공신청에 따른 2022-2023년 통계임입국한 날로부터 91일 이상 대한민국에 체류할 목적으로 「출입국관리법」제31조에 따라 체류지를 관할하는 지방 출입국· 외국인관서의 장에게 외국인등록을 하고 고유한 등록번호를 부여받은 외국인의 국적(지역)별 현황을 연도별로 제공1. 해당 통계는 연도말 시점 통계임2. 해당 통계는 출입국외국인정책본부 홈페이지의 통계연보에서도 확인하실 수 있습니다.(출입국외국인정책본부 홈페이지 - 빅데이터 통계 - 통계연보 - 해당연도 통계연보 게시물 )3. 상기 경로는 다음과 같습니다.https://www.immigration.go.kr/immigration/1570/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaW1taWdyYXRpb24lMkYyMjglMkY1OTY0NjQlMkZhcnRjbFZpZXcuZG8lM0ZwYXNzd29yZCUzRCUyNnJnc0JnbmRlU3RyJTNEJTI2YmJzQ2xTZXElM0QlMjZyZ3NFbmRkZVN0ciUzRCUyNmlzVmlld01pbmUlM0RmYWxzZSUyNnBhZ2UlM0QxJTI2YmJzT3BlbldyZFNlcSUzRCUyNnNyY2hDb2x1bW4lM0QlMjZzcmNoV3JkJTNEJTI24. 월별 등록외국인의 국적(지역)별 통계는 매월 통계월보를 통해 확인 가능'
