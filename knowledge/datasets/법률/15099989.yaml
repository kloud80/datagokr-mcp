summary_user: 법무부 출입국심사 기준으로 월별·국적(지역)별 외국인 입국자 수를 담은 전국 단위 집계 파일로, 연도·월·국적지역·입국자수 네 항목으로 구성된다. 관광·항공·숙박 업계나 정책 분석가가 "특정 국가에서 온 입국자가 월별로 어떻게 늘고 줄었나"를 확인하는 데 쓴다. 전역 조인 키나 국가 코드가 없어 다른 데이터와는 국적 이름과 연·월을 맞춰 연결해야 하며, 지역(시군구) 정보가 없어 시군구 단위 체류 외국인·주민등록 인구와는 직접 이어지지 않는다.
