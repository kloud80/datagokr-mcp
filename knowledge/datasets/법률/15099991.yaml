summary_user: '출입국심사 기준으로 외국인 입국자 수를 년·월과 체류자격별로 집계한 전국 단위 통계 파일이며, 지역 구분은 없습니다. 특정 체류자격(예: 비전문취업 E-9)으로 들어오는 외국인이 월별로 얼마나 늘고 줄었는지 보려는 정책 분석가나 외국인 인력을 쓰는 사업자가 쓴다. 전역 조인 키는 없고, 년·월과 체류자격 이름을 맞춰 같은 법무부의 체류 외국인·등록외국인 월별 통계와 이어 본다.'
