summary_user: 전국 보호관찰소(준법지원센터)·지소와 심사위원회를 기관 한 곳당 한 행으로 담은 기관 목록 파일로, KICS 기관번호·공식 기관명·주소·대표전화·팩스번호를 담는다. 보호관찰 대상자나 민원인이 "우리 지역 관할 보호관찰소 주소와 전화번호는 어디인가"를 찾거나, 분석가가 보호관찰 관련 자료의 기관코드를 기관명으로 풀어 쓸 때 쓴다. 기관번호(probation_instt_no)를 조인 키로 삼아 같은 기관코드를 쓰는 보호관찰 실적·사건 자료와 잇고, 주소를 기준으로 지역 정보에 붙인다.
description_portal: 법무부 범죄예방정책국 소속 기관인 보호관찰소(준법지원센터)의 KICS 기관코드명과 주소 및 대표전화에 대한 자료(전국 58개 보호관찰소와 6개 심사위원회의 코드 등)로, 기관코드는 각 보호관찰소 및 지소를 구분하기 위한 고유 식별값으로, 타시스템 연계 및 데이터 표준화 등을 위해 사용된다. 기관명은 해당 기관의 공식 명칭으로 행정 문서, 화면 표시, 검색 조회 시 활용되어 명칭 변경 시 이력관리가 필요한 데이터이다.  주소 정보는 방문 및 우편 업무를 위해 제공하였고 전화번호 및 팩스번호는  기관 업무 문의 , 대상자 상담 민원 안내 등 실무 운영을 위해 제공하였다
