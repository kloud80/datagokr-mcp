summary_user: 취업자격 체류외국인 가운데 특정활동(E-7) 자격 외국인의 인원을 연·월, 세부 유형(전문인력·준전문인력·일반기능인력·숙련기능인력 등), 국적(지역)별로 집계한 전국 단위 통계 파일이다. 노동·이민 정책 분석가가 "E-7 숙련기능인력은 어느 국적에서 얼마나 늘고 있나" 같은 월별 추이 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체류 통계와는 연·월과 국적 이름을 맞춰서만 이어 쓴다.
