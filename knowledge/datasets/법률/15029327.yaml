description_portal: '대검찰청에서 발간하는 범죄분석을 토대로 무고죄의 발생, 처분 상황(기소, 기소이외 처분, 기소율)을 제공합니다.* 기소 : 구공판, 구약식* 기소 이외 처분 : 혐의없음, 기소유예, 죄가안됨, 공소권없음, 기소중지, 참고인중지, 보호사건 송치(소년, 아동, 성매매, 가정), 공소보류  * 가소율(%) = 기소 인원 / 처분인원 * 100(%)※ 2002~2016년에 대한 데이터를 제공하고 있습니다.(제공요청에 따른 1회성 데이터)※발생통계원표 : 각급 수사기관이 피해신고, 고소/고발, 자체인지 등에 의해서 범죄의 발생을 확인한 후 형사입건한 경우에 작성※검거통계원표 : 각급 수사기관이 형사입건한 사건에 대해서 피의자를 검거한 경우에 작성※피의자통계원표 : 피의자 1명에 대해 1장을 작성하므로 사람(인원) 단위로 작성되며, 피의자 중 법인이 포함된 경우 법인에 대해서도 피의자통계원표를 작성'
