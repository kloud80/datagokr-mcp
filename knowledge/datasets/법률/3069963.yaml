summary_user: 등록외국인(90일 미만 단기체류자 제외)을 대륙·국적·성별로 나누고, 문화예술(D1)부터 방문취업(H2)까지 체류자격별 인원을 열로 펼친 전국 단위 집계표(csv 약 34KB)이다. 연구자나 정책 담당자가 '어느 국적 외국인이 유학·비전문취업·결혼이민 등 어떤 자격으로 많이 머무는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 통계와는 국적명을 국가코드로 매핑하거나 같은 법무부 통계끼리 이름으로 맞춰 이어 쓴다.
description_portal: 내·외국인의 입국 및 출국 상황을 파악하여 출입국 관리 업무와 관련된 정책 판단 및 수립의 기초 자료(등록 외국인의 국적별 체류 정보)해당 통계는 등록외국인을 대상으로 작성한 국적(지역)별 통계로, 90일 미만 단기체류자는 제외한 통계입니다.해당  통계를 통해 체류자격 대분류별 한국에 거주하고 있는 등록외국인의 거주 유형을 파악할 수 있습니다.법무부 출입국외국인정책본부 홈페이지를 통해  통계연보 등록외국인 국적별(지역별)  현황을 매년 공개하고 있습니다.참고로, 등록외국인의  지역별(시군구별) 현황은 분기별로 공개하고 있습니다.
