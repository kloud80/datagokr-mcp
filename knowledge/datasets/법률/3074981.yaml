summary_user: 법무부가 발급한 사증발급인정서(비자 허가승인) 건수를 국적·성별별로 나누고 체류자격(공무, 단기방문, 단기취업, 유학, 일반연수, 결혼이민, 방문취업 등)별 열로 집계한 전국 단위 통계로, 포털 설명상 2010~2015년 연도별 자료이며 3.6KB 남짓의 작은 CSV 파일이다. 출입국·다문화 정책 분석가가 '어느 나라 출신이 유학·결혼이민·방문취업 비자를 많이 받았는가'처럼 국적별 비자 수요 구성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국적명을 국가 코드표에 이름으로 맞추거나 같은 법무부 출입국 통계(체류 외국인·등록외국인 현황)와 국적·체류자격 이름으로 이어 쓴다.
