summary_user: 제주 무사증 입국 외국인 현황을 2010~2018년 연도별로 담은 241바이트 분량의 소규모 집계 CSV로, 연도가 열로 펼쳐진 표 형태다. 제주 무사증 제도 시행 이후 무사증 입국자 규모가 해마다 어떻게 변했는지 확인하려는 분석가·연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 출입국·관광 통계와는 연도를 기준으로 맞춰 이어 써야 한다.
description_portal: 제주도무사증, 불법체류자, 제주도입국자해당 체류자격에 따른 입국자 현황입니다. 해당연도 기준 통계이며 출입국자 통계는 누적 집계되는 통계이므로 한명이 여러번 입국한 경우에는 다중집계될 수 있음(불법체류자는 체류기간 도과자이므로 체류기간 도과 이후 거주지를 파악할 수 없음)해당 통계는 신청에 의한 일회성 수시데이터입니다.기타 최신 출입국 통계는 출입국외국인정책본부의 통계월보 및 통계연보 참조 부탁드립니다.https://www.immigration.go.kr/immigration/1569/subview.do
