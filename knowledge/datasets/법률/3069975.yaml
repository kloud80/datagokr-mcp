summary_user: 연도말 기준 체류외국인 수를 대륙·국적(지역)과 성별로 나누고, 외교·유학·비전문취업·재외동포·영주·결혼이민 등 체류자격별 인원을 열로 담은 전국 단위 집계표이며, 불법체류자 등 체류기간을 넘긴 사람도 포함한다. 정책 담당자나 분석가가 '특정 국적 외국인 중 비전문취업(E9)이나 결혼이민(F6) 자격으로 머무는 사람이 남녀별로 몇 명인가'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 국가별 통계와는 국적 이름을 맞춰 연결하고, 지역 데이터와는 직접 연결할 수 없다.
description_portal: 체류자격 대분류별 국적별(지역별)을 성별로 분류하여 제공해당 시점(연도말) 기준 통계이며 원본 통계는 출입국외국인 정책본부 홈페이지 통계연보에서 확인하실 수 있습니다. 아래 URL을 통해서 접속하실 수 있습니다.https://www.immigration.go.kr/immigration/1570/subview.do해당연도 통계연보 클릭-엑셀 압축파일 - 국적(지역) 및 체류자격별 체류외국인 현황연도별 데이터이며 통계연보는 매년 6월말경 게재됩니다.해당 통계는 불법체류자 등 체류기간 도과자 모두 포함한 전체 외국인 입니다.
