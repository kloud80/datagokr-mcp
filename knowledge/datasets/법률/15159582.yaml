description_portal: '서울시 외국인(등록+거소) 자치구별 체류자격별 현황 데이터입니다.(체류자격: D-1~10, E-1~10, F-1~6, H-1, H-2, 기타 / 자치구: 가나다순 25개)  ※ 개인정보 보호를 위해 5인 미만의 값은 비식별화하여 "*"로 표기하였습니다.등록외국인이란 입국한 날로부터 91일 이상 대한민국에 체류할 목적으로 「출입국관리법」 제31조에 따라 체류지를 관할하는 지방출입국·외국인관서의 장에게 외국인등록을 하고 고유한 등록번호를 부여받은 외국인을 의미합니다.외국국적동포 국내거소 신고자란 「재외동포의 출입국과 법적지위에 관한 법률」 제2조 제2호에 따른 외국국적동포가 91일 이상 체류하기 위해 같은 법  제6조에 따라 거소지 관할 지방출입국·외국인관서의 장에게 국내 거소신고를 한 자를 의미합니다. (F-4, H-2 등)해당 통계는 데이터 제공 신청에 의한 수시 데이터 입니다.'
