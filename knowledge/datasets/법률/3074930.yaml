status: active
summary_user: 연도별 외국인 입국자 수를 대륙·국적·성별로 나누고 외교(A1)부터 관광상륙(T1)·승무원까지 체류자격별 인원과 총합계로 담은 전국 단위 집계 파일(csv)이다. 한 사람이 여러 번 입국하면 그만큼 다중 집계되는 누적(flow) 통계로, 분석가가 '특정 국적의 비전문취업(E9)이나 유학(D2) 입국이 해마다 어떻게 달라졌나'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 출입국·체류 통계와는 국적명·체류자격 코드 같은 이름 매핑으로만 이어 쓴다.
limits: 입국 횟수 기준 누적 집계라 실제 입국한 사람 수나 현재 체류 인원으로 읽으면 안 된다. 범위가 전국·비공간이라 시군구 등 지역별 분석에는 쓸 수 없고, 월별 체류자격별 입국 현황은 이 파일에 없어 통계 월보를 따로 봐야 한다.
