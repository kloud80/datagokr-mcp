summary_user: 경기도 양주시 읍면동별로 배치된 마을변호사의 성명과 연락처를 담은 명단 파일로, 시군구 범위를 읍면동 단위로 나눈 건별 목록이다(csv 425바이트 규모의 소량 파일). 양주시 주민이 '우리 동네에 배정된 무료 상담 변호사가 누구이고 어떻게 연락하나'를 확인할 때 쓴다. 전역 조인 키나 행정코드는 없어 시도명·시군구명·읍면동명 이름을 행정구역 명칭과 맞춰서만 다른 지역 데이터와 이어 쓴다.
description_portal: 변호사를 접하기 어려운 읍면동 거주 주민들에게 무료로 법률 상담을 해드리는 제도로 경기도 양주시 마을변호사 현황입니다.읍면동별 배치된 변호사 명단, 연락처를 확인할 수 있습니다.법률 접근성이 낮은 주민들을 위한 무료 상담 제도입니다.시민의 권익 보호와 지역 법률복지 향상을 위해 개방합니다.
