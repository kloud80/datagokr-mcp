summary_user: 헌법재판소의 변론 일정(연·월·일·시간)과 변론 사건 목록, 사건번호·사건명별 변론 상세 내용(등록일·수정일 포함)을 건별로 담은 전국 단위 API이다. 헌법재판 사건을 추적하는 국민·기자·법률 분석가가 '이번 달 헌법재판소에서 어떤 사건의 공개변론이 언제 열리는가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못했으며, 사건번호(eventNo)·사건명으로 헌법재판소의 다른 사건 데이터와 이름 매칭으로만 연결한다.
description_portal: 헌법재판소 변론사건 조회 서비스는 연월 기준 변론 일정 및 변론목록과 사건번호, 사건명 기준 주요 변론 일정 및 상세 정보를 제공하여 헌법재판 변론 관련 데이터를 조회할 수 있는 API입니다.
