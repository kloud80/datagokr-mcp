summary_user: 91일 이상 체류하려고 외국인등록을 한 외국인(불법체류자 포함) 수를 연·월 × 시도 단위로 집계한 파일 데이터로, 범위는 전국입니다. 지자체·연구자가 '우리 시도에 등록외국인이 몇 명 살고, 월별로 어떻게 늘거나 줄었나'를 확인해 다문화·노동·주거·상권 분석의 기초 자료로 쓴다. 전역 조인 키는 없으므로 시도 이름을 행정구역 코드에 맞춰 붙인 뒤, 같은 연월의 지방행정 주민등록 인구 등 시도별 통계와 이어 쓴다.
