summary_user: '2014년부터 연도별로 전국 공항·항만별 국민과 외국인의 출국·입국 심사 처리 인원을 집계한 파일 데이터로, 연도·공항만·출입국 구분·내외국인 구분별 출입국자 수를 담는다. 공항이나 항만별로 해마다 출입국 인원이 어떻게 바뀌었는지, 내국인과 외국인의 이용 비중은 어떤지를 보려는 관광·교통·지역 분석가가 쓴다. 전역 조인 키는 없어 공항만 이름이나 연도를 기준으로 다른 출입국·체류 통계(예: 국적·체류자격별 외국인 입국자)와 이름 매핑으로 맞춰 쓴다.'
