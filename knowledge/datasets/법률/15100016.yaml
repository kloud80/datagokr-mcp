summary_user: 전국 체류외국인 수를 월별·체류자격별로 집계한 파일로, 90일 이내 단기체류외국인과 등록외국인·외국국적동포 국내거소신고자(장기체류)를 합친 수치이며 불법체류자를 포함한다. 분석가가 '특정 체류자격(취업·유학·관광 등) 외국인이 최근 몇 년간 월별로 어떻게 늘고 줄었는가'를 볼 때 쓴다. 전역 조인 키는 없고 년·월과 체류자격 이름으로만 다른 출입국 통계와 맞춰 붙일 수 있다.
limits: 전국 단위 집계라 시군구 등 지역별 분포는 알 수 없고, 다른 데이터와 공통 코드 키가 없어 체류자격 명칭을 직접 매핑해야 한다. 단기·장기체류 구분 없이 합산된 체류자격별 수치이므로 해석에 주의한다.
