description_portal: 법무부 인권침해 진정사건 단서별 현황입니다.법무부 인권국 인권조사과에 설치된 인권침해신고센터는 법무부와 그 소속 기관(검찰,교정,출입국,범죄예방 등) 공무원이 업무 수행 과정에서 피의자, 수용자, 보호외국인, 보호소년 등에게 가한 인권침해 행위에 대한 진정 사건 접수 및 처리를 담당하고 있습니다.법무부 인권침해신고센터에서 접수한 피진정기관 및 피진정인에 대한 각 연도별로 법무행정 관련 인권 침해 진정사건의 단서별(우편, 인지, 전화, 방문접수 등) 현황 건수를  포함하는 자료입니다.
