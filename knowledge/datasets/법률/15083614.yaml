summary_user: 서울 장기체류 외국인의 생활인구를 기준일·시간대별로, 자치구 단위 행정코드(ADSTRD_CODE_SE)마다 총 인구, 중국인, 중국 외 외국인으로 나눠 담은 집계 데이터입니다. 상권 분석가나 구청 담당자가 '어느 자치구에 어느 시간대에 장기체류 외국인이 많이 머무는가'를 보고 다문화 지원이나 상권·주거 분석의 기초로 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 자치구 코드나 이름을 매핑해 주민등록 인구나 체류 외국인 통계 같은 지역 자료와 이어 쓴다.
limits: 호출하려면 서울 열린데이터광장(data.seoul.go.kr)의 인증키를 따로 받아야 하며, 공공데이터포털 활용신청과는 별개입니다. 공통 조인 키가 없으므로 다른 데이터와 붙일 때는 코드·이름 매핑을 직접 해야 한다.
