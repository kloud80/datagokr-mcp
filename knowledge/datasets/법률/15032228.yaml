description_portal: '서울시 마을변호사란?구민들이 생활속에서 접하는 법률문제를 쉽고 편리하게 상의하고 법률적 조언을 받을수 있도록각 동 주민센터별 정기 무료법률 상담일을 지정운영 하고 있습니다.1. 운영현황    - 각 동별 정기 무료법률 상담일 지정운영         동별 정기상담일 운영, 중랑구민은 거주지 주소와 관계없이 방문이 편리한 동 주민센터에서 상담가능          ※ 동별로 정기상담일이 다르며, 정기상담일과 연락처는 인터넷 홈페이지  "서울시 법무행정서비" 에서 확인 가능2. 이용방법   - 마을변호사에게 어떻게 법률 상담을 받을 수 있나요?     * 동 주민센터별 마을변호사 상담일 확인     * 상담예약 : 동 주민센터에 방문하여 법률 상담카드를 작성 제출하거나, 해당 동 주민센터에 전화로 상담접수 또는 인터넷 홈페이지 "서울시 법무행정서비스" 에서 예약     * 예약날짜에 상담  ♡ 가까운 동주민센터에 상담 신청하세요!!'
