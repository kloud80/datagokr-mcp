summary_user: 서울 중랑구 각 동 주민센터에서 운영하는 마을변호사 무료 법률상담의 동별 운영 현황을 담은 작은 파일(약 2KB csv)로, 운영 동 이름·상담장소·정기상담일·담당자 전화번호를 한 행씩 담는다. 중랑구민이 "우리 동네 주민센터에서는 무료 법률상담을 언제 받을 수 있고 어디로 예약 전화를 하나"를 확인하는 데 쓴다. 전역 조인 키나 행정코드가 없어, 다른 데이터와는 동 이름(운영동명칭)을 행정동 이름과 맞춰 붙이는 방식으로만 이어 쓴다.
