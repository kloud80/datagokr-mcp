summary_user: 법무부가 취업자격 체류외국인 가운데 방문취업(H-2) 자격 외국인 수를 연·월과 국적(지역)별로 집계한 전국 단위 통계 파일(CSV)입니다. 노동·이민 분석가가 "중국 동포 등 특정 국적의 방문취업 체류자가 월별로 어떻게 늘고 줄었나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 체류외국인 통계와는 연·월과 국적명(국적지역)을 이름으로 맞춰 이어 쓰며, 시군구 구분이 없어 지역 인구 자료와 직접 연결되지 않는다.
