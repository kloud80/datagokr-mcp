summary_user: 법무부 출입국외국인정책본부의 등록외국인 수를 전국 시군구 단위로 나누고, 0세부터 1세 단위 연령과 남녀 성별로 집계한 통계 파일입니다(건별 원천이 아닌 집계표). 지자체 담당자나 분석가가 '우리 시군구에 사는 외국인 중 학령기 아동이나 20~30대 남성이 몇 명인가'처럼 지역별 외국인 연령·성별 구성을 확인해 다문화·노동·주거·상권 분석의 기초로 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어, 시도·시군구 이름을 매핑해 주민등록 인구 등 시군구 단위 지역 통계와 이어 쓴다.
description_portal: 출입국외국인정책본부 홈페이지 통계월보  메뉴를 통해 분기별(3개월)로 제공하고 있는 등록외국인(지역별,연령별) 현황의 1세단위 통계입니다.(성별구분)시군구 단위로 구분됩니다. 해당 데이터는 분기별로 업데이트 되며, 24년 6월 30일 통계부터 제공됩니다.https://www.immigration.go.kr/immigration/1569/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaW1taWdyYXRpb24lMkYyMjclMkY1OTcyMTElMkZhcnRjbFZpZXcuZG8lM0ZwYXNzd29yZCUzRCUyNnJnc0JnbmRlU3RyJTNEJTI2YmJzQ2xTZXElM0QlMjZyZ3NFbmRkZVN0ciUzRCUyNmlzVmlld01pbmUlM0RmYWxzZSUyNnBhZ2UlM0QxJTI2YmJzT3BlbldyZFNlcSUzRCUyNnNyY2hDb2x1bW4lM0QlMjZzcmNoV3JkJTNEJTI2
