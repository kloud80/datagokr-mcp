description_portal: 법조인에게 필요한 직업윤리와 법률지식 등 법률사무를 수행할 수 있는 능력을 검정하기 위해 법무부에서 시행한  사법시험의  고사장(학교) 정보이다.사법시험법이 2017년 폐지되었으며 동법 시행령 및 시행규칙은 2018년도 폐지되어 사법고시 업무도 폐지되었다.법무부에서는 사법시험 폐지 이후에는 변호사시험으로 대체하여 시행 중이다.변호사시험은 2012년 1회로 최초 시행되었으며 2025년 현재까지 14회까지 시행되었다.변호사시험은 사법시험과 다르게 법학전문대학원 졸업자 및 졸업예정자만 응시가 가능하며 5년 이내 5회까지만 응시 가능하다
