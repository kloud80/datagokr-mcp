summary_user: 2018~2022년 최근 5개년 불법체류 외국인 수를 체류자격별(사증면제·관광통과·단기방문·유학·비전문취업·방문취업 등 상위 12개 자격과 기타)과 국적별(상위 10개국)로 정리한 전국 단위 연도별 집계표입니다. 출입국 정책 분석가나 연구자가 "어떤 비자로 들어온 외국인이 불법체류로 많이 이어지는가, 그 추이는 어떤가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 체류자격명이나 국적명을 이름으로 맞춰 연결해야 하며, 같은 기관의 체류 외국인·등록외국인 통계와 체류자격 기준으로 나란히 비교하는 용도에 적합하다.
description_portal: 최근 5개년(2018~2022) 불법체류 외국인 현황을  국적별/체류자격별로 정리한 데이터로, 국적별 자료는 불법체류 다발 상위 10개국을 중심으로 작성, 체류자격별 자료는 불법체류  다발 상위 12개 체류자격을 중심으로 작성된 통계자료를 제공* 체류자격 항목 중  기타(G-1)은 체류자격명 G-1비자를 의미하며,  기타는 상위 12개 체류자격을 제외한 나머지 체류자격을 의미함.최신 통계는 출입국외국인정책본부 통계연보를 통해 확인할 수 있음* 2024년 통계연보 기준 제6장 불법체류외국인 - 불법체류외국인 현황 - 체류자격별 현황(표6-2),  국가별 현황(표 6-4)
