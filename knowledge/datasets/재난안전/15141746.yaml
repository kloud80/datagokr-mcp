summary_user: 서울 용산구의 민방위 비상급수시설을 인허가 건별로 담은 원장으로, 관리번호·인허가일·영업상태·폐업/철거일·지번/도로명 주소·좌표(XCRD, YCRD)·시설 구분과 시설명/건물명·비상시설 위치를 한 행씩 기록한다. 주민이 '단수나 재난 때 우리 동네에서 물을 받을 수 있는 급수시설이 어디 있고 지금도 운영 중인가'를 확인하거나, 분석가가 대피·구호시설의 위치 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·시설명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 좌표로 민방위 대피시설 등 다른 대피·구호시설 데이터와 지도상에서 겹쳐 볼 수 있다.
description_portal: 민방위 비상급수시설은 전쟁, 대규모 재난, 지진, 화재, 수돗물 공급 중단 등 비상 상황 발생 시 주민에게 안전하고 깨끗한 생활용수를 공급하기 위해 설치된 공공 급수시설입니다. 이 시설은 평상시에는 일반적으로 사용되지 않지만, 위기 상황에서 신속하게 개방되어 시민의 생존에 필수적인 식수 및 생활용수를 제공합니다. 보통 지하수 관정을 이용하며, 전기 공급이 끊겨도 수동 펌프나 비상 발전 장치를 통해 물을 끌어올릴 수 있도록 설계되어 있습니다. 수도관과 연결되지 않은 독립형 구조이기 때문에 상수도 파손이나 오염 시에도 안전한 공급이 가능합니다. 또한 수질 검사를 주기적으로 실시해 음용수 시설은 위기 상황에서도 음용 가능한 수질을 유지하도록 하고 있습니다. 민방위 비상급수시설은 대형 재난 시 생존율을 높이는 중요한 기반 시설로, 평소 위치를 파악해 두는 것이 안전 확보에 도움이 됩니다.
