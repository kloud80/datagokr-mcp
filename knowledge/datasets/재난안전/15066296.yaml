description_portal: 이 데이터는 서울특별시 성북구의 연도별 소방안전 관련 현황을 정리한 자료입니다. 각 연도의 화재 발화요인(방화의심, 방화명확, 자연적 요인, 기타, 부주의, 교통사고, 가스누출, 화학적 요인, 기계적 요인, 전기적 요인, 미상), 화재 발생건수, 화재 피해액(천원) 등이 포함되어 있습니다. 또한 119 구급활동과 관련된 출동건수, 이송건수, 이송 인원(남·여), 구급환자 유형(급·만성질환, 교통사고, 사고부상) 등의 항목도 포함되어 있어 화재 및 구급 활동 전반의 통계를 함께 확인할 수 있습니다. 마지막으로 장소 유형별 발생건수 정보가 제공되며, 이를 통해 성북구 지역의 화재·사고 발생 특성과 주요 위험요인을 파악하는 데 활용할 수 있습니다.
