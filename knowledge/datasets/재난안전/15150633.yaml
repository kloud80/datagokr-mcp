summary_user: 전국의 범죄예방환경설계(CPTED) 대상지를 위치 포인트 단위로 건별 기록한 데이터로, 필드상 설계 대상·종류·진행 상황·설계 일자, 관할 경찰관서, 지번주소, 좌표가 함께 실려 있다. 지자체 안전 담당자나 생활안전 분석가가 '우리 지역 어느 곳에 CPTED 설계가 적용됐거나 진행 중인가'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, CCTV·안전비상벨 같은 다른 방범 인프라 데이터와는 경찰관서 코드·이름, 지번주소, 좌표를 기준으로 이름이나 위치를 맞춰 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 정보로 범죄예방환경설계 정보를 제공하고 있습니다.
