summary_user: 경찰청이 2014년부터 2019년까지 경범죄처벌법 범칙 행위에 대해 통고처분한 적발 건수를 범칙년월·관서·죄명별로 집계한 전국 단위 통계 파일입니다. 지역 치안을 분석하는 사람이 '특정 경찰서 관할에서 노상방뇨 같은 경범죄 적발이 어느 달에 많았는가'를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어, 다른 경찰서 단위 범죄 발생·검거 통계와는 관서명을 이름으로 맞춰 연결해야 합니다.
description_portal: 경찰청 범죄예방정책과에서 제공하는 경범죄처벌법 관서별 통고처분 현황 통계는 2014년부터 2019년까지 경범죄처벌법에 규정된 범칙 행위에 대한 통고처분 현황을 보여주는 자료입니다.제공된 데이터는 범칙 년월, 관서명, 죄명, 그리고 적발 건수를 포함하고 있습니다. 예를 들어, 2014년 10월 서울 종로부에서 '길에서의 노상방뇨'로 188건이 적발되어 통고처분된 것을 확인할 수 있습니다. 이 통계는 각 관서별, 죄명별 경범죄 통고처분 현황을 파악하고, 특정 시기나 지역에서 발생하는 경범죄의 특징을 분석하는 데 활용될 수 있습니다. 또한, 경범죄 예방 및 관리 정책 수립의 기초 자료로 활용될 수 있습니다.
