summary_user: 민간이 소유·운영하는 시설물의 수를 시설물 종류와 종별(1·2·3종 등)로 나눠 전국 단위로 집계한 통계표로, 포털 설명상 2025년 12월 31일 기준이며 1KB 남짓한 작은 CSV 파일이다. 민간 교량·건축물 등 안전관리 대상 시설물이 종류·종별로 각각 몇 개인지 알고 싶은 분석가나 정책 담당자가 규모를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 시설 안전 데이터와는 시설물 종류·종별 이름을 맞춰 연결하거나 같은 기관의 공공시설물 종별 현황과 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 국토안전관리원에서 제공하는 데이터이며 민간시설물, 종별, 개수 통계현황의 CSV형식의 파일데이터를 제공합니다. 25년 12월 31일 기준을 알려드립니다.민간시설물이란 국가, 지방자치단체, 공공기관 등이 아닌, 개인이 소유하거나 운영하는 시설물을 말합니다."시설물"은 교량, 터널, 항만, 댐, 건축물 등 건설공사를 통해 만들어진 구조물과 부대시설을 포괄하는 넓은 의미의 용어입니다. 민간시설물 예시:민간기업이 소유한 쇼핑몰, 건물, 공장 등, 개인 또는 민간단체가 건설하거나 관리하는 놀이시설, 주차장 등
