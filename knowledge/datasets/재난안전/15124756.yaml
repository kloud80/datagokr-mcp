summary_user: 과천시 안의 기계설비 성능점검 대상 건축물을 건물 한 동씩 담은 목록으로, 건물명·도로명주소·연면적·세대수·데이터기준일을 담는다(CSV 파일 약 6KB). 시설관리 담당자나 분석가가 '과천에서 성능점검을 받아야 하는 큰 건물은 어디이고 연면적·세대수 기준으로 어떤 순서로 살펴야 하나'를 따질 때 쓴다. 전역 조인 키가 없어 건축물대장 등 다른 데이터와는 도로명주소나 건물명을 맞춰 붙여야 한다.
limits: 건물 고유번호 같은 공통 키가 없어 다른 시설 안전 원장과 바로 연결되지 않고, 주소·이름 매칭에 기대야 한다. 범위는 과천시 한 곳뿐이어서 다른 시군구와 비교하려면 각 지자체 자료를 따로 모아야 한다.
