summary_user: 한국전기안전공사가 용량 75kW 이상 4,500kW 미만 자가용전기설비(공장·빌딩 등)에 수행하는 전기안전관리대행의 유지 호수(건수)와 가중치를 2023~2024년 지역별·연도별·구분별로 집계한 파일(csv, 약 2KB)이다. 지역별로 공사의 대행 물량이 얼마나 되는지, 연도 간 대행 호수와 가중치가 어떻게 달라졌는지 비교하려는 분석가나 전기안전 관련 사업자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 지역 명을 행정구역 이름으로 맞추거나 같은 기관의 전기안전 데이터와 이름 기준으로 이어 쓴다.
