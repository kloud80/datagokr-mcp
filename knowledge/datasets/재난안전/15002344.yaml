description_portal: 한국전기안전공사에서는 자가용전기설비(용량 75kW 이상 전기설비(위험시설 20kW 이상))에 대해서 전기안전관리대행업무를 진행하고 있습니다. 전기안전관리대행 대상의 기준은 전기설비 용량 75kW이상 4,500kW미만의 공장, 빌딩 등이 해당됩니다.관련 법정 근거는 전기안전관리법 제22조제3항 및 같은 조 제6항, 제7항, 같은 법 시행령 제11조제3항부터 제6항까지, 같은 법 시행규칙 제26조, 제27조, 제31조, 제32조가 해당됩니다.이 데이터는 한국전기안전공사에서 2023년~2024년에 지역별로 전기안전관리대행 유지 호수 및 가중치를 제공하는 데이터입니다.
