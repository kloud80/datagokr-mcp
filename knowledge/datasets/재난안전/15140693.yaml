description_portal: '은평구의 민방위사태 발생 시 즉시 대피할수 있는 공간으로 사용되는 시설정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에 위치한 민방위 대피시설의 현황 정보를 담고 있습니다. 공습, 포격 등 민방위 사태 발생 시 주민들이 즉시 대피하여 생명과 재산을 보호할 수 있도록 정부가 지정한 공식 대피 공간의 목록입니다 . 데이터에는 각 시설의 명칭, 소재지 주소, 시설 규모(면적) 및 최대 수용 가능 인원, 그리고 공공건물 지하, 지하철역, 아파트 지하주차장 등 시설의 유형과 같은 국가 비상 대비 자원의 핵심 정보가 포함되어 있습니다 .이 데이터를 통해 주민들은 비상 상황 시 ‘안전디딤돌’ 앱이나 온라인 지도를 이용하여 자신의 현 위치에서 가장 가까운 대피소를 신속하게 확인하고 대피 경로를 파악할 수 있습니다 . 또한, 정부와 지자체는 이를 기반으로 대피시설을 주기적으로 점검 및 관리하고, 지역별 수용 능력을 분석하여 필요시 추가로 지정하는 등 국민 보호 체계를 유지하고 강화하는 데 필수적인 기초 자료로 활용합니다 .'
