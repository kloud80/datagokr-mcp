summary_user: 울산광역시 울주군 방사능 방재 체계에서 화재 진압·인명 구조·방사능 오염 환자 이송과 제염을 맡는 울주소방서, 119안전센터, 구조대의 위치와 대응 자원 정보를 시설 건별로 담는다. 군 주민이나 방재 담당자가 "방사능 사고가 나면 가장 가까운 소방 거점은 어디이고 제염 장비를 갖추었는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 울주군의 경찰서·병원·군청 방재정보와는 기관명이나 주소를 맞춰 지도 위에 겹쳐 쓰는 방식으로만 잇는다.
