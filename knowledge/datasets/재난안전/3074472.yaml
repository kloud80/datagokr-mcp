description_portal: 본 데이터는 2024년 경찰청에 검거된 피의자의 학력 및 교육 정도를 범죄 유형별로 집계한 통계입니다. 범죄 대분류와 중분류에 따라 불취학, 초·중·고교(재학·중퇴·졸업), 전문대학 및 대학(재학·중퇴·졸업), 대학원, 기타, 미상 등 상세한 교육 배경 정보를 제공합니다. 2017년 이후 제공이 중단되었으나, 데이터 개방 확대에 따라 기존 "범죄자"에서 "피의자"로 목록 명칭을 변경하여 연 단위 정기 공표를 재개하였습니다. 범죄 발생과 교육 환경 간의 상관관계 분석 및 맞춤형 범죄 예방 정책 수립, 사회적 안전망 구축을 위한 심층 연구 자료로 활용 가능합니다.
