summary_user: 전국 산악지대에서 발생한 사고에 대해 소방이 수행한 구조활동을 신고 건별로 담은 CSV 파일(약 1.2MB)로, 신고·출동 일시, 발생장소(시·구·동·리·번지), 사고원인과 사고종별, 구조인원이 들어 있다. 등산 안전 담당자나 분석가가 "어느 지역·어느 계절·어느 시간대에 실족·조난 같은 산악사고가 몰리는가"를 확인해 탐방로 관리나 안전 캠페인 대상을 정하는 데 쓴다. 전역 조인 키는 없어, 발생장소의 시·구·동 이름을 행정구역 코드표에 이름으로 매핑하거나 같은 소방청의 다른 소방 통계와 지역명·날짜로 맞춰 이어 쓴다.
description_portal: “전국 산악사고 구조활동현황” 데이터는 전국 각지의 산악지대에서 발생한 사고에 대해 소방당국이 수행한 구조활동 실적을 집계한 통계자료입니다. 이 데이터에는 연도별·지역별 산악사고 발생 건수와 구조 인원, 사고 유형(추락, 실족, 조난, 실종, 탈진, 동상 등), 구조 소요 시간, 투입된 인력 및 장비 현황 등이 포함됩니다. 이를 통해 계절별·지역별로 산악사고 발생 양상을 비교할 수 있으며, 등산객이 많이 몰리는 특정 시기나 장소에서의 사고 빈도를 객관적으로 확인할 수 있습니다.  산악 안전 캠페인 기획, 탐방로 관리·개선, 산악 기상 조건별 대응 전략 마련 등 국민 안전 확보를 위한 기반자료 활용 가능합니다.
