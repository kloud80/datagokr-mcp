description_portal: '해양오염신고는 해양환경관리법 제22조에 따라 기름, 유해화학물질, 폐기물 등의 오염물질이 바다에 유출되었거나 유출 우려가 있을 경우 해양경찰서로 해양오염신고 접수된 실적을 표출합니다.신고접수가 해양오염사고 현황은 아니며, 신고접수 후 해양경찰서 직원이 현장확인 결과에 따라 사고처리 방향성이 결정됩니다. 신고접수는 각 해경서별로 연간 으로 표기되며, 해양오염신고 통계는 119 등 유선(전화)신고와 파출소, 해경서 방문신고, 온라인(신문고 등)을 실적을 모두 포함한 실적입니다. 2018년부터 년간 각 해양경찰서별 접수된 해양오염신고 실적을 연도별, 해양경찰별로 데이터를 제공합니다.※ 사천해양경찰서 개서일 : 2022. 3. 31. / 강릉해양경찰서 개서일 : 2025. 3. 31.'
