description_portal: 이 데이터는 대전광역시 서구에 위치한 공공시설물의 내진설계 적용 여부 및 내진성능 평가 결과 등을 기록한 자료입니다. 지진 발생 시 피해를 최소화하기 위해 각 시설물이 어느 정도의 내진 성능을 갖추고 있는지를 확인하고, 필요한 보강 조치 여부를 파악할 수 있도록 구성되어 있습니다.주요 항목에는 시설물의 종류와 명칭, 내진설계가 적용되었는지 여부, 내진성능 평가 실시 여부 및 그 결과, 내진보강이 이루어졌는지 여부, 최종 내진성능 수준, 담당 부서 등이 포함됩니다. 이를 통해 해당 시설이 구조적으로 어느 정도 안전한지, 추가적인 보강이 필요한지를 한눈에 파악할 수 있습니다.데이터는 시설물의 구조적 안정성을 점검하고, 향후 보수·보강 계획 수립과 관리 책임 주체 간의 역할 수행을 지원하는 데 활용됩니다.
