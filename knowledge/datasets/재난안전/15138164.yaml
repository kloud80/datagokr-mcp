description_portal: 한국승강기안전공단이 수행하는 승강기 안전검사 업무 중, 이미 입력·집계(마감)된 결과를 사후 정정하기 위해 ‘마감 해지’가 이루어진 이력을 정리한 데이터입니다. 각 기록은 마감일자, 마감해지 일자, 마감 처리자(내부 계정은 식별 보호를 위해 마스킹된 ID)로 구성됩니다. 본 자료의 목적은 검사결과 정정의 절차성과 추적가능성을 확보하여 감사·사후검증·통계 정비·민원 대응의 근거를 제공하고, 마감 해지 사유에 따른 후속 조치(검사기준일 변경, 제원 정정, 수수료 재정산 등) 연계를 지원하는 데 있습니다. 범위는 공단 전산에서 ‘마감 해지’로 상태가 변경된 건을 대상으로 하며, 동일 검사건이라도 단계별 처리에 따라 복수 이력이 남을 수 있습니다. 일부 항목은 상위 시스템(업무결재, 사유코드, 지사 코드 등)과 연계되어 상세 사유가 별도 관리될 수 있고, 등록·실행 시점 간 시차가 존재할 수 있습니다. 개인정보(피검사자 성명·연락처 등)는 포함하지 않으며, 법적 효력 판단이나 최신 상태 확인은 원본 시스템의 해당 건 상세 화면을 기준으로 해야 합니다.
