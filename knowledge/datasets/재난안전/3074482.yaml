description_portal: 경찰청 수사기획담당관실에서 제공하는 장물 처분 방법 및 금전 소비 용도 통계는 전국 경찰관서에 형사 입건된 강도, 절도, 공갈, 사기, 횡령 범죄 사건에서 발생한 장물의 처분 방법과 피의자가 취득한 금전을 소비한 용도를 보여줍니다.장물 처분 방법은 매각, 증여, 폐기, 피의자 소비 등으로 분류되어 건수가 제시됩니다. 금전 소비 용도는 유흥, 오락, 생활비, 도박, 학비, 증여, 소지 중, 기타, 미상 등으로 분류되어 건수가 제공됩니다. 예를 들어, 절도 범죄의 경우 생활비로 소비된 금액이 가장 많은 것을 확인할 수 있습니다. 이 통계는 범죄의 경제적 동기와 장물 처리 과정을 파악하고, 범죄 수사 및 예방 전략 수립에 활용될 수 있는 중요한 자료입니다.
