description_portal: 경찰청이 제공하는 2019~2025년 연도별 차종별 교통사고 건수 통계로, 승용차·승합차·화물차·이륜차·개인형 이동장치·이농기계·기타 등 차종별 사고 발생 추이를 비교할 수 있다. 전체적으로 승용차 사고는 2019년 151,365건에서 2025년 130,492건으로 감소세를 보이고, 이륜차도 20,898건에서 14,129건으로 줄었다. 반면 개인형 이동장치 사고는 2019년 447건에서 2023년 2,389건까지 급증한 뒤 2025년 1,915건으로 다소 감소하였다. 차종별 교통안전 취약 분야, 이동수단 변화에 따른 사고 위험, 맞춤형 예방정책 수립 등에 활용할 수 있다.
