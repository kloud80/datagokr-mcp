description_portal: 한국산업안전보건공단에서 제공하는 이동식크레인 및 고소작업대 조종자 교육을 2019년~2023년동안 공단에서 수료한 인원에 대한 데이터로연번, 교육연도, 수료인원에 대한 칼럼을 제공하고 있습니다.*산업안전보건법 제140조(자격 등에 의한 취업 제한 등) ① 사업주는 유해하거나 위험한 작업으로서 상당한 지식이나 숙련도가 요구되는 고용노동부령으로 정하는 작업의 경우 그 작업에 필요한 자격ㆍ면허ㆍ경험 또는 기능을 가진 근로자가 아닌 사람에게 그 작업을 하게 해서는 아니 된다.*유해ㆍ위험작업의 취업 제한에 관한 규칙 부칙 제2조(이동식 크레인ㆍ고소작업대 조종작업 유경험자에 대한 특례)이 규칙 시행 당시 이동식 크레인 또는 고소작업대의 조종작업을 3개월 이상 수행한 경험이 있는 사람으로서 2019년 12월 31일까지 한국산업안전보건공단에서 실시하는 이동식 크레인ㆍ고소작업대 조종전문교육을 이수한 사람은 제22호의 개정규정에도 불구하고 이동식 크레인ㆍ고소작업대 조종자격이 있는 것으로 본다.
