description_portal: 한국가스공사 평택기지본부에서 보유하고 있는 재난관리자원 공유장비 현황 정보입니다. 재난 및 안전관리 기본법 제34조에 의거하여 긴급구조지원기관으로서의 역할 수행을 위해 보유장비 현황을 민간에 개방합니다. 데이터 구성 항목으로는 재난 유형별(지진, 풍수해, 산불 등) 자원명, 관리번호, 세부품명, 보유량, 보관장소, 보관장소의 세부 위치 등 장비의 상세 정보가 포함됩니다. 본 데이터를 활용하면 평택기지본부가 보유한 재난대응 장비의 종류와 규모, 배치 현황을 종합적으로 파악할 수 있습니다. 이를 통해 지진, 풍수해, 산불 등 자연재해 발생 시 화재 진압 및 복구 등 재난대응활동에 효과적으로 활용할 수 있으며, 지역 재난 대응 계획 수립, 유관기관 간 협력체계 구축, 재난 관리 정책 수립, 지역사회 안전망 강화 연구에 참고자료로 활용됩니다.
