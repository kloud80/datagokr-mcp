summary_user: 서울 강남구의 민방위 비상급수시설을 시설 한 곳씩 담은 인허가 원장으로, 인허가·폐업 일자, 영업상태, 주소, 좌표(XCRD·YCRD), 시설 구분과 위치 같은 항목을 담는다. 주민이나 재난 대응 담당자가 '민방위 사태로 수돗물이 끊기면 우리 동네 어디서 물을 받을 수 있나'를 확인하거나, 운영 중인 급수시설 분포를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 대피·구호시설 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
