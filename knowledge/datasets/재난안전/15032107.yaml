description_portal: '- 광주광역시 관내에서 발생한 화학사고 발생 및 대응현황을 민원인에게 정보를 공유 합니다.- 출동일자, 발생장소, 인명피해, 조치사항 등을 자료를 제공합니다. * 인명피해에는 사망, 부상 등 별도 구분이 되어있지 않습니다. * 조치사항은 현장에 출동했던 대원이 조치한 사항을 개략적으로 표기한 것이므로 단순 참고자료로만 활용바랍니다.- 광주119특수대응단에서는 화학사고에 특화된 대응을 위해 전문인력을 구성하여 운영중입니다.- 데이터기준일은 2025. 1. 1. 이며 업데이트 주기는 매년입니다.'
