description_portal: '전북특별자치도 전주시 민방위급수시설 현황 데이터 자료로 민방위급수시설구분, 민방위급수시설, 소재지 주소 정보 등을 포함하고 있습니다.관련내용은 전주시청 홈페이지 내의 민방위 비상급수시설 목록에서도 찾아볼 수 있으며, 국민재난안전포털에서도 관련 정보 확인이 가능합니다.전북특별자치도 전주시 내 민방위급수시설을 제공하며, 시설명(건물명), 지정일자,  도로명주소, 지번주소, 위도,경도, 시설구분명 등을 제공합니다.민방위 및 재난안전 정책 수립, 재난 대응 시스템 구축, 비상급수시설 위치 안내 서비스, 도시 안전관리 및 공간분석 , 시민 안전정보 제공자료로 활용할 수 있습니다.제공부서 : 재난안전과'
