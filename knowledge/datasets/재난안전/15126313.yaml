description_portal: '- 전라남도 시군별 및 고속도로 교통사고 통계 정보를 조회하실 수 있습니다. - 시 ·군  사고건수, 사망자 수, 부상자 수 통계입니다.- 교통사고 통계는 도로 환경, 교통량, 고령화 등 다양한 요인에 따라 지역별로 차이를 보입니다.- 전라남도는 교통사고 감소를 위해 다양한 정책과 사업을 추진하였습니다 :어린이·어르신 보호구역 확대 : 어린이 보호구역 및 마을 주민 보호구간을 100곳 이상 확대하였습니다.교통안전 캠페인 : 모범운전자회, 녹색어머니회 등과 함께 교통안전 캠페인을 실시하였습니다.교차로 개선 및 스마트 시설 설치 : 보행신호 자동연장시스템, 스마트교차로, 교차로 횡단보도 조명타워 등을 설치하여 교차로 안전성을 높였습니다.'
