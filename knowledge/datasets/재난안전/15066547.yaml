summary_user: 2020년 2월 21일부터 4월 2일까지 코로나19 확진환자 급증에 따라 전국 구급대 동원령으로 대구에 파견된 119구급대 규모를 소방본부별 차량 대수와 인원으로 집계한 작은 파일(csv, 201 bytes)입니다. 감염병 재난 때 시·도 소방본부가 구급차와 대원을 얼마나 지원했는지, 예컨대 "어느 시·도가 대구에 구급차를 가장 많이 보냈나"를 확인하는 사례 분석에 쓴다. 전역 조인 키가 없어 다른 소방·재난 데이터와는 소방본부(시·도) 이름을 맞춰 연결해야 한다.
description_portal: 코로나19 대응 대구지역 119구급대 동원 현황(’20.2.21~4.2), 두류정수장(대구시 소재)"20. 2월 말  대구지역에서 코로나19 확진환자가 급속히 증가함에 따라대구소방본부 구급대로만 대응이 불가하여 소방청장은 전국 구급대 동원령을 총 4회에 걸쳐 발령,구급차 및 구급대원을 동원하여 확진환자 및 유증상자를 병원과 생활치료센터로 이송한 현황관련 데이터 로 감염병 재난 시 중앙정부와 시·도의 협력 구조가 어떻게 작동했는지를 드러내는 사례 데이터입니다.(서울·부산·대전·인천 등 전국 광역단체에서 구급차와 인력을 대구에 파견)
