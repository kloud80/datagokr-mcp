summary_user: 특정 연도·차수별로 정기안전검사 신청이 필요한 승강기를 한 대씩 나열한 전국 단위 목록 파일로, 승강기 관리번호·호기·검사유효기간 만료일자·수수료를 담는다. 건물 관리자나 분석가가 "이번 차수에 검사유효기간이 끝나 검사를 신청해야 하는 승강기는 몇 대이고 수수료는 얼마인가"를 확인하거나 검사 물량을 추정하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 다른 승강기 원장과는 승강기 관리번호를 같은 기관 자료의 번호와 맞춰 보는 방식으로만 이어 쓴다.
description_portal: ‘한국승강기안전공단_승강기 검사신청 대상’의 데이터는 특정 연·월 차수별로 정기안전검사 신청이 필요한 승강기 목록을 제공하는 행정기초 데이터입니다. 주요 필드는 대상년도·대상차수, 승강기 관리번호(1·2), 검사유효기간 만료일자, 호기, 수수료로 구성됩니다. 예시처럼 “2011년 9차수” 등 기간 단위로 분리·축적됩니다. 본 자료는 유효기간 도래 설비의 자동 추출, 검사 안내·청구서 발송, 수수료 산정 및 수납 계획, 지역·기기별 물량 예측, 검사인력 배치와 일정 수립, 민원 응대 및 정책 통계 근거로 활용됩니다. 관리번호는 개별 승강기를 식별하기 위한 행정 식별자이며, 개인 식별정보는 포함하지 않습니다.
