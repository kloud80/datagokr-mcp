summary_user: 한국승강기안전공단이 관리하는 승강기 고유번호의 변경 이력을 한 행당 한 건의 번호 변경 사건으로 담은 전국 단위 파일(CSV 약 176KB)로, 대상 승강기·건물 관리번호와 기존·변경 고유번호를 쌍으로 기록한다. 과거 검사·유지관리 기록에 남은 옛 고유번호가 현재 어떤 번호로 바뀌었는지 확인하려는 분석가나 관리 주체가 기록을 소급 조회하거나 정합성을 점검할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 다른 승강기 데이터와는 승강기 고유번호 값을 직접 맞추는 방식으로만 연결한다.
description_portal: 본 데이터는 한국승강기안전공단 내부 전산에서 관리하는 승강기 고유번호(식별번호)의 변경 이력을 체계적으로 제공하기 위한 자료입니다. 대상 승강기 및 건물의 관리번호(1·2)와 더불어 기존 고유번호와 변경 후 고유번호를 쌍으로 기록하여, 식별체계 정비·번호 체계 개편·중복·오입력 정정 등 행정처리 결과를 투명하게 추적할 수 있도록 구성되었습니다. 표준 스키마는 “대상 승강기 관리번호1/2, 대상 승강기 건물 관리번호1/2, 기존 승강기 고유번호, 변경 승강기 고유번호”로 이루어지며, 단위 행(row)은 한 건의 번호 변경 사건을 의미합니다. 본 자료는 검사 성적서, 유지관리 이력, 수수료 정산, 민원·사고 이력 등 외부 테이블과 조인 시 기준키로 활용되어 데이터 정합성 점검, 연계 시스템 간 참조키 통일, 과거 기록의 소급 조회에 유용합니다. 개인정보는 포함하지 않습니다.
