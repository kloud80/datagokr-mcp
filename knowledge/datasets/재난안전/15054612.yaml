summary_user: 남부소방서가 화재·구조·구급·행정업무에 쓰는 소방차량을 차량별로 한 줄씩 담은 소규모 파일(약 2KB CSV)로, 차량종류·차명·운용부서와 데이터 기준일자를 담는다. 시민이나 분석가가 "남부소방서에 펌프차·물탱크차·구급차가 각각 몇 대이고 어느 부서가 운용하나"를 확인하거나 출동 대응 장비 구성을 비교할 때 쓴다. 전역 조인 키가 없어 다른 소방서 차량 현황이나 119안전센터 자료와는 운용부서 이름을 맞추거나 같은 기관 기준으로만 이어 붙인다.
description_portal: 남부소방서 차량보유 현황 데이터는 각종 화재, 구조, 구급 및 행정업무 수행에 사용되는 차량의 종류,  차종별 용도 등의 정보를 포함하고 있습니다. 주요 차량으로는 펌프차, 물탱크차, 고가사다리차, 구급차, 지휘차, 구조차, 지원차 등이 있으며, 이 데이터는 출동 대응력 확보와 장비 운영의 효율성을 분석하는 데 활용됩니다. 또한 차량의 노후화 상태를 점검하여 적정 시기에 교체하거나 보강할 수 있도록 계획을 수립하는 데 기초 자료로 사용됩니다. 이를 통해 재난 대응 능력을 높이고, 신속한 현장 출동과 안전한 업무 수행이 가능하도록 지원합니다.
