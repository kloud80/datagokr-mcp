summary_user: 부산교통공사가 관리하는 부산도시철도에서 2010년부터 2020년까지 일어난 철도사고 건수를 열차사고·사상사고·화재사고·시설파손 등 사고유형별, 연도별로 집계한 476바이트 분량의 소형 CSV 통계표이며, 비고란에 사고 원인이나 상황을 적는다. 철도 안전 분야 연구자나 정책 담당자가 '부산도시철도 사상사고가 10년 사이 늘었나 줄었나'처럼 유형별 사고 추이를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사고유형 이름이나 연도로 맞춰 붙여야 하며, 도로·경찰 교통사고 다발지역 데이터와 같은 사고 개념으로 나란히 비교하는 정도로 쓴다.
limits: 연도·유형별 집계 건수만 담고 사고 위치·역·일시 같은 건별 정보는 없어 다발지점 분석에는 못 쓴다. 공통 조인 키가 없어 다른 데이터와 연결하려면 유형명·연도를 직접 맞춰야 한다.
