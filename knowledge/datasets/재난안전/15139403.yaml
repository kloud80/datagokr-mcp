summary_user: 재난안전데이터 공유플랫폼에서 제공하는 일상생활 안전 국민행동요령 콘텐츠를 담으며, 행동요령 내용(actRmks)과 콘텐츠 주소, 1~3단계 카테고리 명칭·코드가 함께 들어 있는 전국 단위 비공간 데이터다. 국민이나 안전교육·서비스 개발자가 '물놀이나 산행 때 지켜야 할 안전수칙은 무엇인가'처럼 생활 속 상황별 행동요령을 찾아 안내하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 카테고리 이름이나 코드를 매핑해 잇는 수준으로만 연결하며, 재난 특보·대피시설 같은 재난안전 데이터 옆에 안내 문구로 붙여 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 일상 생활에서의 국민행동 요령 정보로, 콘텐츠 내용, 카테고리1명칭~카테고리3명칭 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바랍니다.※  링크의 데이터 상세 페이지에서 해당 데이터 이용신청이 가능하며, 승인 후 API 서비스키를 발급 받을 수 있습니다.
