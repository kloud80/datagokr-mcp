summary_user: 한국남동발전이 보유 설비의 설계 안전성을 검토한 내역을 검토 건별로 담은 파일로, 포털 설명 기준 661건이며 설비(사택아파트, 터빈/발전기 건물 등)·업무 분야(건축, 기계, 전기 등)·공종(토공사, 콘크리트 공사 등)·설계/시공도면 유무·물적 위험성(파손, 파열 등)·인적 위험성(떨어짐, 끼임 등)을 기록한다. 건설안전 연구자나 발전소 안전관리 담당자가 '콘크리트 공사 같은 공종에서 어떤 인적·물적 위험이 자주 지적되는가'처럼 공종별 위험 패턴을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공종·위험유형 이름을 맞추거나 같은 기관(한국남동발전) 단위로만 이어 쓴다.
description_portal: 한국남동발전이 보유하고 있는 설비의 설계 안전성을 검토한 내역이며, 총  661건의 데이터를 확인할 수 있습니다. 개방 데이터는 (설비) 사택아파트, 종합폐수처리 건물/구조물, 터빈/발전기 건물/구조물, 시험 및 연구건물 등, (업무) 건축, 계측제어, 기계, 전기 토목,  (공종) 토공사, 콘크리트 공사 등, (설계도면) Y/N, (시공도면) Y/N, (물적위험성) 파손, 넘어짐, 파열 등,  (인적위험성) 떨어짐, 끼임·깔림 등의 정보를 포함합니다.  해당 데이터를 활용하여  공종별 위험 패턴을 파악하고, 데이터 기반의 건설안전 연구와 예방 정책을 수립하여 실질적인 사고 감소에 기여합니다.
