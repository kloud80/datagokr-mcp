summary_user: 대구광역시 동구에 설치된 스마트 그늘막을 한 대씩 등록번호 단위로 담은 시설 목록으로, 행정동·설치일자·설치장소·주소·비고를 제공하며 범위는 동구 한 개 시군구다. 동구 주민이 폭염 때 가까운 그늘막 위치를 찾거나, 분석가가 행정동별 설치 분포를 보고 추가 설치가 필요한 곳을 가늠하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 주소 문자열(ADRES)을 기준으로 무더위쉼터 등 다른 대피·구호시설 목록이나 기상 정보와 맞춰 이어 쓴다.
limits: 다른 데이터와 바로 붙일 공통 코드가 없어 행정동 이름이나 주소를 직접 매핑해야 한다. 대구 동구 한 곳만 다루므로 다른 구·군이나 대구시 전체 현황은 이 데이터로 알 수 없다.
