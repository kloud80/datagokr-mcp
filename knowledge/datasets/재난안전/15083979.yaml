summary_user: 전국 다중이용업소 154,873건을 영업장 단위로 담은 파일 데이터로, 상호·주소·영업장면적·업종·영업상태와 영업장별 고유번호(MU번호)를 싣는다. 분석가나 지자체 담당자가 특정 지역에 노래연습장·PC방 같은 불특정 다수 이용 시설이 몇 곳, 어디에 있는지 확인하는 질문에 쓴다. 주소(address)를 조인 키로 삼아 같은 주소 기준의 다른 소방·시설 안전 데이터와 이어 쓴다.
description_portal: 해당 데이터는 전국 각 시·도에서 운영되는 다중이용업소의  현황(일련번호, 상호, 주소, 면적, 업종, 영업상태) 및 MU번호 데이터 입니다. 다중이용업소란 「다중이용업소의 안전관리에 관한 특별법」에 따라 노래연습장, PC방, 영화관, 학원, 유흥주점, 게임장 등 불특정 다수인이 동시에 이용하는 시설을 말하며, 화재·안전사고 예방 차원에서 관리가 엄격히 이루어집니다.
