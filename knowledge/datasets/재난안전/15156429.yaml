description_portal: 이 데이터는 한국승강기안전공단이 수행한 승강기 정밀안전검사 결과를 기반으로, 각 승강기에 설치된 주요 안전부품의 현황을 기록한 자료입니다. 각 행은 하나의 승강기에 대한 검사 결과를 나타내며, 주요 필드에는 ‘건물명’, ‘승강기고유번호’, ‘승강기구분’, ‘검사일자’, ‘정밀안전검사회차’, ‘정밀안전검사연장여부’ 등이 포함됩니다.안전부품 관련 필드는 ‘어린이손끼임 방지장치’, ‘승강장문이탈방지장치’, ‘카의 상승과속 방지장치’, ‘브레이크시스템’, ‘자동구출운전수단’, ‘과속역전방지수단’, ‘스커트 디플랙터’, ‘핸드레일’ 등으로 구성되어 있으며, 각 부품의 설치 여부는 “설치”, “미설치”, 혹은 값이 없는 상태로 구분됩니다. 승강기 종류별로 설치 대상 부품이 다르기 때문에 설치 대상이 아닌 부품의 경우, 해당 칼럼의 데이터가 비어 있는 경우도 존재합니다.이 데이터는 승강기별로 안전부품의 설치 상태를 파악하고, 정밀안전검사 결과와의 연계를 통해 부품 보급 현황, 미설치 위험요소 식별, 유지관리 정책 수립 등에 활용될 수 있습니다.
