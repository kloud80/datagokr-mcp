summary_user: 한국승강기안전공단의 정밀안전검사 결과를 바탕으로 승강기 한 대당 한 행씩 어린이 손끼임 방지장치, 승강장문 이탈방지장치, 상승과속 방지장치, 브레이크, 자동구출운전, 스커트 디플랙터·핸드레일 같은 안전부품의 설치·미설치를 담은 전국 단위 원장 파일(CSV 약 107MB)입니다. 시설 관리자나 정책 분석가가 '우리 건물 승강기에 어린이 손끼임 방지장치가 설치돼 있는가', '승강기 종류별로 미설치 부품이 얼마나 남아 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 승강기고유번호나 건물명을 이름·코드 매핑하는 방식으로 같은 기관의 승강기 관련 데이터와 이어 쓴다.
limits: 표준 조인 키가 없어 다른 기관 데이터와는 승강기고유번호·건물명 매칭에 의존해야 하며, 행정구역 코드가 없는 비공간 데이터라 지역별 집계에 바로 쓰기 어렵다. 승강기 종류별로 설치 대상 부품이 달라 빈 칸은 미설치가 아니라 설치 대상이 아님을 뜻할 수 있다.
