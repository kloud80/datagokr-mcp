description_portal: 이 공공데이터는 2016년부터 2024년까지 강원도경찰청에서 수집한 가정폭력범죄 피해자의 성별 현황을 정리한 자료입니다. 피해자의 성별은 남성, 여성, 불상(미확인)으로 구분되며, 연도별로 발생 건수가 제공됩니다. 해당 데이터는 성별에 따른 피해자 비율을 분석함으로써 성인지적 관점에서의 가정폭력 대응 정책 수립과 실효성 있는 피해자 보호 대책 마련에 기초자료로 활용됩니다. 경찰청, 지자체, 여성가족부, 복지기관 등에서는 이 데이터를 바탕으로 가정폭력 예방 교육, 성별 맞춤형 상담 및 지원 서비스 운영, 정책 개선 등의 방향을 설정할 수 있으며, 연구기관 및 언론에서도 성별 기반 범죄 분석과 공공 인식 제고에 활용할 수 있습니다.
