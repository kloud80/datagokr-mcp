summary_user: 광주 동구를 관할하는 동부소방서 관내 소방통로 확보 대상 지역을 한 행씩 담은 목록 파일(약 2KB CSV)로, 지역명·구간거리(m)·도로 폭(m)·세대수와 데이터기준일자를 담는다. 소방 실무자나 지역 안전 분석가가 '동구에서 도로가 좁고 세대가 많아 소방차 진입이 어려운 구간이 어디인가'를 살펴 불법 주정차 단속이나 합동훈련 우선지역을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 데이터와는 지역명을 이름으로 맞추거나 같은 기관(동부소방서) 자료끼리만 연결한다.
