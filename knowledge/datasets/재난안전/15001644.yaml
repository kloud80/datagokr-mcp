summary_user: 전국 독성가스 유통량을 연도별로 집계한 파일로, 액화가스(천ton)와 압축가스(천m3) 각각의 사용량·제조량·수입량을 담으며 포털 설명상 2013~2018년 자료다. 가스안전 분야 분석가나 정책 담당자가 '국내 독성가스 사용·제조·수입량이 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 지역 구분도 없는 전국 단위라서, 다른 데이터와는 연도를 기준으로 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '한국가스안전공사에서 대형 가스사고를 예방하고자  관리하고 있는 독성가스에 대한 정보를 사용량, 제조량, 수입량에 따라 구분하여 제공하는 데이터입니다.해당 데이터는 연도별 액화가스와 압축가스의 사용량, 제조량, 수입량으로 구성되어 있습니다.국내 독성가스 유통량 현황을 통하여 독성가스로 인한 가스사고를 예방 및 관리하는데 활용할 수 있습니다.※ 해당 정보는 2013년에서 2018년 사이의 정보로 구성되어 있습니다.※ 해당 정보는 타 유관기관에서 자체 수집, 관리를 통해 제공하는 정보와 일부 상이할 수 있음을 참고 바랍니다.-데이터 기준일자 : 2018년 12월 31일'
