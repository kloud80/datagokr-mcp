summary_user: 대전광역시 안에 방범 목적으로 설치된 CCTV를 대당 한 건씩 담은 원천 목록으로, 관리번호·관리기관·CCTV 유형·지번/도로명 주소·좌표를 개별 지점 단위로 제공한다. 분석가나 자치구 담당자가 "우리 동네 골목 중 방범 CCTV가 없는 취약 구역은 어디인가"를 지도에서 확인할 때 쓴다. 전역 조인 키는 없으므로 좌표(crdntX·crdntY)로 다른 안전 인프라나 대피시설 위치와 공간 결합하거나, 주소 문자열로 행정구역을 매핑해 이어 쓴다.
description_portal: 대전광역시 방범용 CCTV 자료는 대전시 내 방범 목적으로 설치·운영되고 있는 CCTV의 위치, 설치 목적, 운영 현황 등 구체적인 정보를 제공합니다. 해당 데이터는 각 CCTV별 설치 지점, 운영 상태, 설치 시기, 촬영 범위, 관리 기관 및 유지보수 이력 등의 세부 항목을 포함하고 있으며, 범죄 예방 및 시민 안전 확보, 사건·사고 분석, 도시 방범 정책 수립에 유용하게 활용됩니다. 자치구별 CCTV 분포 정보와 관리 현황을 통해 다양한 범죄 유형별 대응방안 마련이나 미연의 사고 예방체계 구축, 지역별 취약지대 파악 및 행정자원의 효율적 배분 등에 기여할 수 있습니다.2022년 대전광역시 공공데이터 기업매칭사원사업으로 개발한 데이터입니다.
