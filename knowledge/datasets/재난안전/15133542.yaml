summary_user: 기상청 국가지진종합정보시스템(NECIS)의 지진관측지점 메타정보를 담은 파일로, 관측지점별 개시·종료일자·통신방법·위경도와 지점별 채널·기록계·센서 모델 정보를 관측지점·채널 단위로 담는다(전국 범위, zip 약 100KB). 지진 관측자료를 분석하는 연구자나 분석가가 "어느 관측지점에 어떤 센서·기록계가 설치돼 있고 현재 사용 중인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 관측망코드·관측지점코드·채널코드를 기준으로 기상청의 다른 지진 관측·발생 자료와 코드 매핑으로만 이어 쓴다.
description_portal: '기상청 국가지진종합정보시스템(NECIS)에서 제공하고 있는 지진관측지점에 대한 메타정보에 관한 사항입니다.  - COM_OBS_TIDE_SITE:  관측지점과 간만조(조석)지점 관리 정보입니다.   - META_CONF_SITE2SYS: 메타-관측지점-단위시스템   - META_EQK_SITE: 메타-관측지점 코드, 관측개시일자, 관측종료일자, 통신방법, 회선속도, 위경도 등에 관한 정보입니다.    - META_EQK_SITECHAN: 메타-관측지점-채널코드, 기록계모델코드, 센서모델코드 등에 관한 정보입니다.'
