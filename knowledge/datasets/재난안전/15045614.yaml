description_portal: '소방활동(출동) 시 골든타임 확보를 위하여 광주광역시 광산소방서 관내에 소방차량 진입이 곤란한 지역을 사전에 파악한 지역입니다.화재 현장“골든타임”의 정의 ○ 화재가 성장하여 최성기에 이르면 화염이 일시에 분출하여 거주자 생존이 어렵다는 ‘최성기 8분 도달 이론’을 토대로 인명피해 최소화를 위해 골든타임(화재 현장 소방차 도착시간)을 7분으로 설정   - (최성기 8분 도달 이론) 화재가 발생하고 8분이 지나면 모든 물체가      가열돼 화염이 일시에 분출하며 거주자 등이 생존할 수 없음 - 과거엔 목조건물이 많아 최성기 5분 이론을 따랐으나, 최근엔       내화구조 건물 증가에 따라 8분 이론으로 전환되는 추세(미국·영국 등)□ 7분 내 도착 달성률 계산식  연간 총 화재건수 추출    ※ 비정상 출동 제외(사후 화재조사, 신고접수~차고출발 4분 초과, 차량속도 100㎞/h 초과 등)  목표시간(7분) 내 도착건수 추출  목표시간(7분) 내 도착건수 ÷ 총 화재건수 = 7분 도착 달성률□ 출동 거리별 목표 시간 도착률 병행 관리 ○ 신속한 소방활동을 위하여 화재 현장 7분 내 도착을 지향하되, 물리적으로 달성 불가능한(기준거리* 초과) 경우는 목표시간을 보정하는 출동거리별 목표시간 도착률 병행 관리* 기준거리(2.5km) : 신고 접수 후 현장 도착까지의 기준시간인 7분 내에 소방차량 평균 주행속도(약 30km/h)로 도달할 수 있는 거리   - 기준거리 이내 출동 시에는 목표시간 7분 그대로 적용   - 기준거리 초과 시 0.5km 당 1분씩 목표시간 추가'
