summary_user: 광주 광산소방서 관내에서 소방차 진입이 어려워 소방통로 확보가 필요한 지역을 한 행에 한 지역씩 담은 파일 데이터이며, 지역명과 해당 구간의 거리·도로 폭(미터), 세대수, 기준일자를 담는다(파일 크기 약 1.7KB의 소규모 목록). 소방·안전 분석가나 주민이 '우리 동네 골목이 소방차 진입 곤란 구역인지, 구간 길이와 폭은 얼마인지'를 확인하거나 골든타임 7분 도착을 위협하는 좁은 길 구간을 파악하는 데 쓴다. 전역 조인 키는 없어 지역명을 주소·행정구역과 이름으로 맞추거나 같은 기관의 다른 소방 데이터(소방용수·비상소화장치 위치 등)와 이름 기준으로 이어 쓴다.
limits: 좌표나 표준 행정코드가 없어 지도 위 위치나 다른 데이터와의 정확한 연결은 지역명 매칭에 의존한다. 광산소방서 관내 목록뿐이라 다른 소방서 관할이나 실제 출동·도착시간 실적은 담지 않는다.
