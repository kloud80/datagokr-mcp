description_portal: 이 데이터는 경찰청에서 일회성으로 제공하는 범죄자 송치의견 자료로서, 범죄 사건 처리 결과를 상세히 기록하고 있다. 데이터는 범죄대분류, 범죄중분류, 범죄소분류, 기소-구속, 기소-불구속, 불기소-기소유예, 불기소-기소중지, 불기소-혐의없음, 불기소-죄안됨, 불기소-공소권없음, 소년보호송치, 이송, 참고인중지, 가정보호송치, 아동보호사건, 기타 항목으로 구성된다. 경찰 사건 처리 결과의 이해를 돕고자 각 사건별 기소 및 불기소 유형과 보호조치 현황, 참고인 조사 결과 등을 포괄적으로 제공한다. 본 자료는 사건 처리 과정의 투명성을 확보하고 범죄 예방, 사건 분석, 경찰 정책 수립에 활용할 수 있도록 설계되었다. 이를 통해 경찰 사건 처리 현황을 심층적으로 파악할 수 있다.
