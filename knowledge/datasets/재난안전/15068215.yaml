description_portal: 본 데이터는 「응급의료에 관한 법률」 제47조 및 「심폐소생술 교육·자동심장충격기 설치 등에 관한 규칙」에 따라,심정지 발생 시 응급 대응을 위해 설치된 자동심장충격기(AED)의 설치 위치 정보를 제공하는 공공보건 데이터입니다.**충청북도 증평군 관내 공공기관, 다중이용시설, 민간 사업장, 체육시설, 학교 등 AED 설치 대상기관의 정보(기관명, 위치 설명, 주소, 연락처)**를 포함하며,시민의 AED 접근성 확보, 심정지 골든타임 확보, 응급의료 네트워크 구축을 위한 정책적 목적과생활 안전망 강화를 위한 민간 활용을 동시에 고려한 데이터입니다.
