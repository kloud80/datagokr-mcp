description_portal: 17개 시도 재난심리회복지원센터에서 위촉한 재난심리활동가 현황입니다. 재난경험자 심리상담 지원을 위한 상담센터 지정현황 및 전문가 등 관련 정보를 제공하며, 활동가 현황을 시도별,의사,교수,정신건강전문요원,임상심리사,심리상담사 등,간호사,사회복지사,pss 강사,기타로 구분하고 있습니다.  재난심리활동가는 재난 발생 초기 현장에 투입되어 재난경험자를 대상으로 심리적 응급처치(PFA)를  중심으로 심리상담, 심리관련 정보와 심리안정 물품을  지원하는 등 재난심리회복지원 서비스를  제공하고 있습니다. 재난심리회복지원센터 상담 전화는 1670-9512로 전국 어디서든 전화 또는 방문 상담이 가능합니다.
