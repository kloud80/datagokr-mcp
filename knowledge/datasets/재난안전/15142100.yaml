summary_user: 재난안전데이터 공유플랫폼이 제공하는 복구사업 관련 지방재정(e호조) 세출 현황으로, 회계연도·지역·자치단체·회계구분·세부사업별로 예산현액, 국비·시도비·시군구비, 지출금액 등을 담으며 범위는 전국입니다. 재난 복구사업에 자치단체별로 예산이 얼마나 잡혔고 실제로 얼마나 집행됐는지 비교하려는 분석가나 지자체 재정 담당자가 쓴다. 전역 조인 키는 없어 지역명·자치단체명(또는 지역·자치단체 코드)을 이름·코드 매핑하거나 같은 기관 코드로만 다른 재난·재정 데이터와 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 복구사업에 대한 E호조세출입현황 정보로,회계연도, 지역명, 자치단체명, 회계구분명, 예산현액, 지출금액, 편성금액 등을 제공하고 있습니다. 데이터의 갱신주기는 1일입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
