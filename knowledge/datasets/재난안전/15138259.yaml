summary_user: 한국승강기안전공단이 정밀안전검사 실시가 연장된 승강기를 건별로 기록한 전국 범위 파일(CSV 약 35KB)로, 각 행에 접수일자·승강기관리번호(두 열로 분리)·등록일자를 담는다. 건물 관리자나 안전 분석가가 특정 승강기의 정밀안전검사가 연장된 적이 있는지, 언제 접수·등록됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 승강기 고유번호 단위의 다른 승강기 원장과는 관리번호 두 열을 맞춰 보는 매핑을 거쳐야 이어 쓸 수 있다.
description_portal: 본 데이터는 한국승강기안전공단이 관리하는 정밀안전검사 ‘실시 연장’ 대상 승강기 목록을 표준 형식으로 정리한 것입니다. 각 행은 접수일자를 기준으로 승강기관리번호(복수 식별 구성을 위해 1·2열로 분리 제공)와 등록일자를 포함하며, 정밀안전검사의 법정 주기 또는 운영 일정에 따라 검사가 연장된 사례를 행정적으로 추적·이력화하기 위한 기록입니다. 관리번호는 설비별 고유 식별을 위한 조합값으로, 실제 주소나 소유자와 같은 민감 정보는 포함하지 않습니다. 동일 설비가 기간·사유에 따라 중복 표출될 수 있으며, 접수일자와 등록일자는 상이할 수 있습니다.
