summary_user: 경찰청 유실물 통합포털에 올라온 포털기관(지하철·공항·쇼핑몰·놀이공원 등) 보관 습득물을 물건 하나 단위로 담은 건별 원천 API이며, 전국 1,788,448건(2021-11-30~2026-10-01)이다. 물건을 잃어버린 시민이 습득 지역·기간·물품명·보관 장소로 검색해 자기 물건이 접수됐는지 확인하는 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 잇고, 경찰관서 위치 같은 같은 부문 데이터와 보관 장소(depPlace)를 맞춰 보는 식으로 쓴다.
