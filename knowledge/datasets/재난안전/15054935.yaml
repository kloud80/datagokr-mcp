description_portal: 광주광역시 동구 관내 화재발생 현황에 대한 데이터로 화재건수, 사망, 부상, 재산피해(부동산, 동산)을 설명하는 자료입니다.광주 동부소방서 관할 지역은 주거지, 전통시장, 상가 밀집 지역이 많아 화재 발생 위험이 상대적으로 높은 편입니다. 특히 겨울철에는 난방기기 사용 증가로 주택 화재가 잦고, 여름철에는 전기 사용량 급증과 부주의로 인한 화재가 발생하기 쉽습니다. 통계적으로도 주거시설 화재 비중이 가장 높으며, 그 다음이 상가·공장·차량 화재 순으로 나타나는 것이 일반적입니다.화재의 주된 원인은 부주의가 가장 많습니다. 담배꽁초 처리 부주의, 음식 조리 중 자리를 비운 경우, 전기제품 장시간 사용 등이 대표적 사례입니다. 이외에도 전기적 요인(합선, 과부하), 기계적 요인(기계 과열, 오작동), 그리고 방화 추정 사고 등의 사고가 일부 포함됩니다.
