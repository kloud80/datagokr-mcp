description_portal: 본 데이터는 충청남도 부여군 관내 가로보안등(보안등) 고장·불편 신고의 접수부터 조치 완료까지 유지관리 이력을 건(件) 단위로 제공한다. 2024-12-30부터 2025-12-30까지 접수된 3,437건을 포함하며, 신고 위치는 부여군 16개 읍·면의 주소 정보로 구성됩니다. 주요 항목은 접수번호, 접수일자, 표찰번호(시설 식별값), 고장신고위치(주소), 고장상태(불점등/점멸/주간점등/시간조정/기타 등), 고장상세설명(선택), 완료일자, 처리내용이다. 이를 통해 읍·면별 고장 발생 추이, 고장 유형 비중, 처리기간(접수~완료) 분석, 반복 고장 시설(표찰번호) 관리가 가능하며, 야간 보행 안전 확보와 유지보수 인력·예산 배분, 예방정비 우선순위 설정 등 시설물 관리 행정에 활용할 수 있습니다.
