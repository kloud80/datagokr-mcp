summary_user: 부여군 관내 가로보안등의 고장·불편 신고를 접수부터 조치 완료까지 건 단위로 담은 원천 이력 파일로, 접수일자·표찰번호(시설 식별값)·고장신고위치 주소·고장상태(불점등·점멸·주간점등 등)·완료일자·처리내용을 기록한다. 군 시설관리 담당자나 분석가가 '어느 읍·면에서 어떤 유형의 보안등 고장이 잦고, 접수부터 완료까지 며칠 걸리며, 같은 표찰번호에서 고장이 반복되는가'를 따지는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 고장신고위치 주소의 읍·면 이름을 맞추거나 같은 기관 자료와 표찰번호로 맞춰 이어 써야 한다.
limits: 표준 행정코드나 좌표 같은 전역 조인 키가 없어 다른 지역·기관 데이터와 바로 결합되지 않고, 주소 문자열 매핑이 필요하다. 범위는 부여군 한 시군구에 한정되며 보안등 설치 현황 전체가 아니라 신고된 고장 이력만 담는다.
