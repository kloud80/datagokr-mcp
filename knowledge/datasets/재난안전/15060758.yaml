summary_user: 울산광역시도시공사가 관리하는 공공시설물을 시설물 한 건당 한 행으로 담은 안전관리 원장으로, 시설물명·구분·종류·준공일자·종별 등급·최종 안전점검결과와 최종·차기 정기/정밀점검 일자, 도로명주소, 관리책임자를 포함합니다(파일 크기 1,822바이트의 소규모 CSV). 울산 시민이나 분석가가 '공사가 관리하는 시설물 중 다음 정밀점검이 곧 도래하거나 안전등급이 낮은 곳은 어디인가'를 확인하는 데 쓴다. 공통 조인 키는 없어서, 다른 시설물 안전·점검 데이터와는 시설물명이나 도로명주소를 맞춰 보는 방식으로 이어 쓴다.
description_portal: 이 데이터는 「시설물의 안전 및 유지관리에 관한 특별법」(시설물안전법)에 따라 울산광역시도시공사에서 관리하고 있는 주요 공공시설물의 안전관리 현황을 체계적으로 기록한 데이터셋입니다.공사의 관리대상 시설물별로 명칭, 구분, 종류, 준공일자, 정기 및 정밀점검 이력, 안전등급 등을 포함하며, 시설물의 유지관리 및 안전진단 수행 현황을 종합적으로 관리하기 위해 구축되었습니다.데이터에는 시설물명(FCLTS_NM), 시설물구분(FCLTS_DIV), 시설물종류(FCLTS_KND), 준공일자(CMCN_YMD) 등 기본 정보 외에도, 시설물의 구조적 안전성과 관리 주기를 나타내는 시설물종별등급구분(CLASS), 최종정기점검일자(LAST_FDRM_CHCK_YMD), 최종정밀점검일자(LAST_PCS_CHCK_YMD), 차기정기점검도래일자(NEXT_FDRM_CHCK_YMD), 차기정밀점검도래일자(NEXT_PCS_CHCK_YMD) 등의 정기적인 점검 주기 관리 항목이 포함되어 있습니다. 또한, **최종안전점검결과(SAFECHK_GD)**를 통해 각 시설물의 최근 안전등급을 확인할 수 있으며, **도로명주소(ROAD_NM_ADDR)**를 통해 위치 기반의 시설물 분포 분석도 가능합니다.
