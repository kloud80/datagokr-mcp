summary_user: 방염성능검사에 합격한 방염물·소방용품에 부착하는 합격표시의 교부 내역을 건별로 담으며, 접수번호·합격표시번호·제조업체명·품명·형식명·검사일자로 구성된 전국 단위 비공간 파일이다. 현장에서 확인한 방염 합격표시 번호가 실제로 교부된 것인지, 어느 제조업체의 어떤 품목에 언제 발급됐는지 확인하려는 소방 점검자·건축주·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제조업체명·품명 같은 이름 매칭으로만 연결한다.
description_portal: 『소방시설 설치유지 및 안전에 관한 법률』 에 따라 검사기준을 만족하는  소방용품 및 방염물에 부착하는  합격표시 정보를 제공합니다.합격표시 교부정보는 접수번호, 교부합격표시번호, 제조업체명, 검사품목, 검사일자 데이터로 구성되어 있습니다.- 방염성능검사의 합격표시에 한함※ 형식승인, 성능인증, KFI 제품검사의 품목별 합격표시 정보는 제조업체의 영업상 기밀에 해당되어 제외됨합격표시 교부번호에 대한 자세한 정보는 한국소방산업기술원 홈페이지 (https://kfi.or.kr/portal/openData/openData/opnPsmrk.do?menuNo=500336) 에서 확인할 수 있습니다.
