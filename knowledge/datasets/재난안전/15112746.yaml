summary_user: 경상북도에 등록된 기계설비 성능점검업체를 업체 1곳당 1행으로 담은 목록 파일로, 등록번호·등록일자·상호·소재지·연락처를 담으며 파일 크기는 약 1.6KB로 작다. 건축물 소유자나 기계설비 관리자가 '우리 지역에서 성능점검을 맡길 수 있는 등록업체가 어디이고 연락처는 무엇인가'를 찾을 때 쓰고, 행정기관이 시군별 업체 분포를 볼 때도 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호명이나 소재지 주소를 매칭해서만 이을 수 있다.
limits: 업체 등록 목록일 뿐 점검 실적, 점검 결과, 업체 평가는 담지 않는다. 표준 조인 키가 없어 사업자등록·건축물 데이터와 연결하려면 상호·주소 매칭에 의존해야 한다.
