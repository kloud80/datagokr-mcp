summary_user: 서울특별시경찰청 관할 경찰서별로 살인·강도·강간및추행·절도·폭력 5대 범죄의 발생 건수와 검거 건수를 담은 2024년 기준 집계 파일(csv, 약 6KB)이다. 분석가나 주민이 '우리 지역 경찰서 관할에서 절도가 몇 건 발생했고 그중 몇 건이 검거됐나'처럼 관서별 치안 수준과 검거율을 비교하는 데 쓴다. 실측 컬럼(구분·죄종·발생검거·건수)에 전역 조인 키가 없어, 다른 데이터와는 경찰서 이름을 직접 매핑하거나 경찰관서 위치 같은 같은 기관 자료와 이름으로 맞춰 이어 쓴다.
