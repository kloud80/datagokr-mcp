description_portal: 해당 데이터는 경기도북부경찰청 내 남양주시에서 발생한 사이버 성폭력 범죄 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 사이버 성폭력 범죄는 불법 성영상물, 아동 성착취물, 불법 촬영물, 불법 합성물로 구분되어 있습니다. 2015년부터 2019년까지의 현황을 발생건수, 검거건수로 구분하여 제공하고 있어, 해당 기간 동안의 연도별 남양주시 사이버 성폭력 범죄 발생 및 검거 현황을 파악할 수 있습니다. 이를 통해 특정 연도에 남양주시에서 발생 및 검거한 사이버 성폭력 범죄 건수를 비교하여 분석할 수 있습니다. 이 자료는 사이버 범죄 및 성범죄와 관련된 경찰 활동을 보여주며, 해당 현황은 남양주경찰서 수사과에서 제공합니다.
