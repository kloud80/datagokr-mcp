summary_user: 경기도 수원시 안에서 재난으로 이재민이 생겼을 때 쓰는 임시 수용시설을 시설 한 곳당 한 행으로 담은 원천 목록이며, 구·동, 시설 구분과 이름, 도로명주소와 위도·경도, 수용가능면적과 인원, 내진설계 여부, 사용 여부, 담당부서 연락처를 함께 싣는다. 수원 시민이 '홍수나 지진 때 우리 동네에서 가족이나 거동이 불편한 이웃을 데려갈 수 있는 가장 가까운 수용시설은 어디이고 몇 명까지 들어가나'를 확인하거나, 분석가가 구·동별 수용 인원이 충분한지 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구청명·동명 같은 이름 매칭이나 위도·경도 기반 거리 계산으로 붙여 쓰며, 민방위 대피시설·무더위쉼터 등 다른 대피·구호시설 목록이나 재난 위험지역 데이터와 겹쳐 보는 용도에 맞다.
description_portal: 재해구호법 제 4조의2(임시주거시설의 사용등)에 따라 각종 재난재해로 인하여 경기도 수원시 내 이재민발생시 즉시 이용 가능한 임시 수용시설 현황 데이터를 제공합니다. 홍수, 태풍, 지진 등 자연재난 발생 시 가까운 수용시설 위치를 미리 알고 있으면, 안전하게 대피 할 수 있어 생명과 재산을 보호할 수 있습니다. 노약자, 어린이, 장애인 등 돌봄이 필요한 가족이나 이웃을 수용시설로 신속하게 안내할 수 있습니다. 시민 누구나 공공데이터로 수용시설 위치를 확인할 수 있어 재난 시 혼란을 최소화하고 행동  계획을 세우는데에 활용할 수 있습니다.
