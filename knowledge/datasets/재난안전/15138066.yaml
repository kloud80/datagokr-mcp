description_portal: 이 데이터는 한국승강기안전공단에 접수된 ‘유지관리업체 변경 신청’ 처리 현황으로, 각 행은 한 건의 신청을 나타냅니다. 필드는 접수번호, 접수일자, 통보일자, 기존 유지관리업체, 변경 유지관리업체로 구성되며, 특정 승강기의 유지관리 주체 변경 사실을 행정적으로 확인·기록하는 데 목적이 있습니다. 기관·업체 간 계약 변동에 따른 책임 주체 명확화, 점검·정기검사 연락 창구 최신화, 지역·기간별 유지관리 시장 동향 파악 등에 활용할 수 있습니다. 동일 접수번호가 반복되거나 문자열 표기가 상이한 사례가 포함될 수 있으므로, 분석 시 접수번호+통보일자 기준 중복 정리, 업체명 표기 정규화(지사·사무소 구분, 괄호 표기 일치) 등 사전 정합성 검증이 필요합니다. 수록 범위는 공단 시스템에 실제 접수·통보된 변경 신청으로 한정되며, 자료는 업무 절차·서식 개정에 따라 항목 정의나 표기가 일부 달라질 수 있습니다.
