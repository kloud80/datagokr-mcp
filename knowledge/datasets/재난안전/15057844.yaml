summary_user: 경기도 내 자전거 사고 다발지를 지점 단위로 정리한 집계 자료로, 사고년도·시군·읍면동·관할 경찰서와 함께 지점별 발생 건수, 사망·중상·경상·부상신고 인원, 위도·경도와 다발지역 폴리곤 정보를 담는다. 시군 교통안전 담당자나 분석가가 "우리 시군에서 자전거 사고가 몰리는 지점은 어디이고 인명피해는 얼마나 되나"를 확인해 안전시설 설치 위치를 정할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군명·읍면동명 같은 이름이나 법정동코드(LEGALDONG_CD_NO)·시군코드 매핑, 위경도 좌표로 도로·경찰 교통사고 다발지역 데이터와 같은 개념으로 맞대어 쓴다.
description_portal: 이 데이터는 자전거 사고 다발지역 현황을 지역별로 정리한 자료로, 사고 발생 위치, 사고 유형, 발생 건수, 사상자 수 등의 정보를 포함합니다. 사고년도, 시군명, 읍면동명, 법정동코드 등의 행정구역 정보와 함께, 사고위치를 식별할 수 있는 위도, 경도, 위치코드 및 사고다발지역의 폴리곤 형태의 공간정보(GIS)도 제공됩니다. 해당 데이터는 자전거 교통사고가 집중되는 지역을 분석하여 교통안전시설 설치, 정책 수립, 위험지역 사전 경고 시스템 개발 등 다양한 분야에서 활용될 수 있습니다. 사고 유형은 모두 '자전거사고다발지'로 분류되며, 사망자수, 중상자수, 경상자수, 부상자수 등 세부적인 인명피해 정보도 포함되어 있습니다.
