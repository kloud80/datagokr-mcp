description_portal: ‘승강기 검사 기타수수료 산정표’는 한국승강기안전공단이 안전검사 과정에서 발생하는 부가·부대 비용의 기준액을 기간별로 정리한 자료입니다. 적용시작일자·적용종료일자, 수수료(부가세 별도), 분류코드 설명을 포함하며, 설비유형(엘리베이터, 에스컬레이터, 수평보행기, 덤웨이터, 소형·경사형 엘리베이터, 휠체어리프트)과 대민서비스(문자 SMS/LMS/MMS·알림톡, 웹팩스, 정보이용료) 항목을 포괄합니다. 2014-03-01~2018-02-28, 2018-03-01~2020-03-31, 2020-04-01~(현행) 등 구간별 금액 변동을 확인할 수 있어 제도 변화, 면제·감면(일부 0원 구간) 추세 파악에 유용합니다. 목적은 수수료 산정의 투명성 제고와 민원·청구·회계 정산의 표준화이며, 지자체·유지관리업체·검사기관은 시스템 요율 매핑, 예산 편성, 과금 검증 등에 활용할 수 있습니다. 실제 청구액은 법령·고시 및 현장 조건에 따라 달라질 수 있으므로 최신 공고와 분류코드 정의를 반드시 병행 확인하시기 바랍니다.
