description_portal: '○ 통계개요* 통계명 : 자연재해위험 개선지구* 통계종류 : 일반통계, 보고통계* 근거법령 :「자연재해대책법」에 따라 지정ㆍ고시되는 상습침수지역ㆍ산사태위험지역등 지형적인 여건 등으로 인하여 재해가 발생할 우려가 있는 지역* 작성목적 : 재해 발생의 우려가 있는 지역 현황을 파악하여, 자연재해로 인한 피해를미연에 방지하고 재해발생시 신속하게 대처할 수 있도록 정책을 마련하는데기초자료로 활용하는 것을 목적으로 함* 조사체계 : 서울시 및 자치구 담당부서 → 서울특별시 하천관리과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 자연재해위험 개선지구(침수위험ㆍ유실위험ㆍ고립위험ㆍ붕괴위험지구 등) 지정 현황○ 용어설명* 자연재해위험 개선지구 지정기준- 침수위험지구 : 하천의 외수범람과 내수배제 불량으로 인한 침수가 발생하여 인명 및건축물ㆍ농경지 등의 피해를 유발하였거나 침수피해가 예상되는 지역- 붕괴위험지구 : 산사태, 절개사면 붕괴, 낙석 등으로 건축물이나 인명피해가 발생한지역 또는 우려되는 지역* 자연재해위험 개선지구 등급분류 기준- 가 등급 : 재해발생시 인명피해 발생우려가 매우 높은 지역- 나 등급 : 재해발생시 건축물(주택, 상가, 공공건축물)의 피해가 발생하였거나 발생할우려가 있는 지역- 다 등급 : 재해발생시 기반시설(공업단지, 철도, 기간도로)의 피해가 발생할 우려가있는 지역, 농경지 침수발생 및 우려지역- 라 등급 : 붕괴 및 침수 등의 우려는 낮으나, 기후변화에 대비하여 지속적으로 관심을갖고 관리할 필요성이 있는 지역○ 기 타○ 출 처 : 서울특별시 하천관리과'
