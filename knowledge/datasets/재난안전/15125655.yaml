description_portal: '재난배상책임보험사업장의 시설정보, 신규가입대상시설물정보, 갱신가입대상시설물정보, 가입제외시설물정보, 미가입시설물정보 등 데이터 사용시 참고바랍니다. 가. 시설물업종구분코드(tpbiz_se_cd):지하상가 : 01,주유소 : 02,장례식장 : 03,여객자동차터미널 : 04,음식점 : 05,숙박업 : 06,물류창고 : 07공동주택 : 08,박물관 : 09,도서관 : 10,국제회의시설 : 11,경마장 : 12,경륜장 : 13,관광숙박업 : 14과학관 : 15,미술관 : 16,경정장 : 17,장외매장 : 18,전시시설 : 19,장외발매소 : 20,농어촌민박 : 21나. 휴폐업상태코드(biz_stts_cd): 사업자등록번호 수집 중으로 휴폐업상태 정보가 누락된 데이터가 있을 수 있습니다.계속사업자 : 01휴업자 : 02폐업자 : 03다. 좌표데이터(epsg_x, epsg_y):  도로명주소에서 사용하는 EPSG:5179 좌표계라. 모든 정보는 행정청 인허가 절차에 따라 실제 데이터와 1~2일 차이가 있을 수 있습니다.'
