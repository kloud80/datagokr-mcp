summary_user: 재난배상책임보험 가입 대상 사업장을 시설물 단위로 담은 전국 건별 데이터로, 시설 정보와 신규·갱신 가입 대상, 가입 제외, 미가입 시설물을 주소·좌표와 함께 제공한다. 지자체 담당자나 분석가가 '우리 지역 음식점·숙박업소 중 재난배상책임보험에 아직 가입하지 않은 곳은 어디인가'처럼 업종별·지역별 의무보험 가입 현황을 확인하는 데 쓴다. 사업자등록번호(brno)와 법인등록번호(crno)로 사업자·법인 데이터와 잇고, 법정동코드로 행정구역 통계와, EPSG:5179 좌표로 대피시설·소방 등 다른 재난안전 공간 데이터와 겹쳐 쓴다.
limits: 주소·좌표 단위의 개별 시설 정보라서 집계 통계는 직접 계산해야 하며, 좌표는 도로명주소 체계의 EPSG:5179이므로 위경도 지도에 올리려면 변환이 필요하다. 포털 설명에 따르면 사업자등록번호를 수집하는 중이어서 휴폐업 상태가 빠진 건이 있고, 인허가 절차상 실제 현황과 1~2일 차이가 날 수 있다. 개발계정 호출 한도는 하루 10,000회다.
