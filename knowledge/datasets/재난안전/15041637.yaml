description_portal: '- 전라남도 시군에 위치한 섬지역긴급이송지원시스템 출동현황 (신고 일시, 출동 시각, 출동안전센터 등)에 관한 데이터를 조회하실 수 있습니다.- 여객선 운항 지원 : 전라남도는 섬지역과 육지를 연결하는 여객선 운항을 지원하여 주민들의 이동 편의를 도모하고 있습니다. 여객선 운항 시간표와 요금 등은 각 시군청 또는 해당 항만의 공식 웹사이트에서 확인할 수 있습니다.- 섬지역 교통 인프라 개선 : 섬지역의 도로, 교량, 항만 등의 교통 인프라를 개선하여 주민들의 이동 편의성을 높이고 있습니다. 이러한 사업은 전라남도청의 교통과 또는 해당 시군청의 교통부서에서 추진하고 있습니다.- 긴급 상황 대응 시스템 : 섬지역에서 발생할 수 있는 긴급 상황에 대비하여, 응급 의료, 소방, 경찰 등의 긴급 대응 시스템을 구축하고 있습니다. 이러한 시스템은 전라남도청의 재난안전과 또는 해당 시군청의 재난안전부서에서 관리하고 있습니다.'
