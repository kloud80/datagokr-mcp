summary_user: 울산종합운동장 안에 설치된 119 ZONE을 지점별로 시설명·주소·운동장 내 상세 위치·설치 목적·연락처·비치 장비 종류·위도·경도와 함께 담은 작은 파일(약 1.6KB)이다. 운동장 이용객이나 행사 안전 담당자가 '경기장 안에서 응급 상황이 생기면 가장 가까운 119 ZONE은 어디이고 어떤 장비가 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표나 주소로 공간 매칭해 소방·대피시설 데이터 등과 겹쳐 본다.
description_portal: 울산시설공단은 시민의 안전을 위해 울산종합운동장 내 주요 지점에 설치된 119 ZONE의 현황을 데이터로 제공하고 있습니다. 이 데이터는 시설명, 주소, 상세 위치, 설치 목적, 연락처, 기준일자, 설치된 장비의 종류, 그리고 위치 좌표 정보(위도 및 경도) 등 다양한 항목으로 구성되어 있습니다. 시설명과 주소를 통해 119 ZONE이 설치된 구체적인 장소를 확인할 수 있으며, 상세 위치 항목은 운동장 내에서의 정확한 위치 파악을 돕습니다. 설치 목적에는 긴급 상황 발생 시 신속한 구조 활동과 시민의 안전 확보가 주요 내용으로 포함되며, 이를 통해 시민 누구나 위급한 상황에서 빠르게 대처할 수 있도록 합니다. 이 데이터는 기준일자를 통해 최신성을 확인할 수 있으며, 공공기관 및 시민 모두에게 유용한 안전 정보로 활용됩니다.
