summary_user: 전국 시군구 단위로 가스사고 발생건수를 집계한 통계로, 전체 발생건수(WHOL_OCRN_NOCS)와 사망자·부상자 수, 등급, 시도·시군구명과 좌표·공간정보를 함께 담는다. 지자체 안전 담당자나 분석가가 어느 시군구에서 가스사고와 인명피해가 많은지 비교하고 점검·예방 대상 지역을 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 시도·시군구 코드(STDG_SGG_CD)나 시도·시군구명을 매핑해 인구·시설 통계 등 다른 시군구 단위 데이터와 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 시군구별 가스사고 발생건수 정보입니다.
