description_portal: 광주광역시 동부소방서 관내 119소년단 현황에 대한 데이터로 각 119소년단 소속 학교별 주소, 인원, 연락처 등에 대한 정보를 설명합니다.119소년단은 어린이와 청소년이 소방안전 지식을 배우고, 안전문화를 직접 실천하는 단체입니다. 쉽게 말해, “어린이 안전 홍보대사”이자 미래의 안전리더라고 할 수 있습니다. 초등학교, 중학교, 고등학교 학생들로 구성되며, 동부소방서와 학교가 협력해 운영합니다.동부소방서 관할 지역에는 여러 학교 119소년단이 활동하고 있습니다. 각 학교 단위로 조직된 소년단은 정기적인 교육과 체험 활동에 참여하며, 소방서와 함께 지역 사회 안전 캠페인에도 적극 동참합니다. 이들은 단순히 이론을 배우는 것이 아니라 현장 체험과 실습 중심의 교육을 통해 실제 상황에서도 침착하게 행동할 수 있는 역량을 키웁니다.광주 동부소방서 관내 119소년단은 어린이와 청소년이 안전을 배우고 실천하며, 지역사회의 작은 안전 지킴이로 성장하는 소중한 조직입니다. 이들의 활동은 단순한 체험을 넘어, 가족과 이웃에게까지 안전 문화를 확산시키며 향후 세대의 안전 의식을 높이고, 모두가 더 안전한 지역사회를 만드는 밑거름이 되는 등의 큰 의미가 있습니다.이 데이터는 동부소방서 관내 학교명, 주소, 인원, 연락처, 데이터 기준일자 등의 항목을 제공합니다.
