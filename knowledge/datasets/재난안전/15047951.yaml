description_portal: 이 자료는 경찰청 생활안전교통국 교통안전과에서 2014년부터 2016년까지 집계한 차량 용도별 졸음운전 교통사고 현황 공공데이터입니다. 승용차, 화물차, 버스, 이륜차 등 다양한 차량 용도에 따른 사고 건수, 사망자 수, 부상자 수를 포함하고 있습니다.제공된 표는 비사업용, 사업용, 기타 용도로 분류된 차량들의 사고 데이터를 보여줍니다. 특히, 비사업용 차량의 사고 건수와 부상자 수가 가장 높은 비중을 차지하고 있으며, 연도별로 소폭의 변동을 보입니다.이 데이터는 졸음운전의 심각성과 차량 용도에 따른 사고 특성을 심층 분석하는 데 활용될 수 있습니다. 구체적으로는 교통안전 정책 수립, 졸음운전 예방 캠페인 기획 및 실행, 차량별 안전장치 개발 연구, 연구기관의 교통사고 관련 연구, 그리고 민간 보험사의 리스크 분석 등 다방면에서 중요한 기초 자료로 사용될 수 있습니다. 졸음운전으로 인한 사회적 비용 감소와 교통안전 증진에 기여할 것으로 기대됩니다.
