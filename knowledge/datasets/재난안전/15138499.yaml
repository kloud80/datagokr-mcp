description_portal: 본 자료는 한국승강기안전공단이 승강기 안전인증 시 발행하는 안전인증서에 적용되는 제원 범위를 표준 항목으로 정리한 데이터입니다. 레코드 단위는 특정 해당인증번호에 연결된 개별 제원이며, 필드는 해당인증번호, 제원적용순번, 제원명, 제원값으로 구성됩니다. 하나의 인증번호에 다수의 제원이 순번에 따라 기록되며, 제원명에는 모델명, 비상통화장치 종류, 정격전압(V), 연결국수(ch), 통화장치 모델, 무선모뎀 형명, 통신선(category) 등 전기·통신 관련 항목이 포함됩니다. 또한 인증 구분(개별승강기/최초 등), 승강기 구분(엘리베이터 등), 구조별 종류(전기식), 승강로 구획(밀폐식), 용도별 종류(승객용), 출입구 구조(수평), 구동기 위치(권상식), 구동기 및 제어반 모델, 속도(m/s) 등 설비의 구조·운전 특성을 나타내는 정보가 함께 제시됩니다. 건축주소와 같은 설치 식별 정보가 포함될 수 있으며, 동일 인증번호 내 제원 간의 관계를 일관된 형식으로 확인할 수 있도록 구성되었습니다.
