description_portal: 이 파일은 전라북도 내에서 연도별로 집계된 기초질서 위반 행위에 대한 단속 현황을 정리한 자료로, 공공장소에서의 경미한 법규 위반을 유형별로 분류하여 단속 건수를 제공합니다. 주요 항목으로는 ▲무임승차 및 무전취식, ▲광고물 무단부착, ▲음주소란, ▲노상방뇨, ▲불안감 조성 행위, ▲기타 기초질서 위반 등이 포함되며, 각 항목별 연도별 발생 건수가 구체적으로 수록되어 있습니다. 이 자료를 통해 전북 지역에서의 공공질서 유지 실태와 위반 행위의 유형별 변화 추세를 분석할 수 있으며, 기초질서 확립을 위한 예방활동 강화, 단속 전략 수립, 지역사회 안전환경 개선 등 다양한 정책적 활용이 가능합니다.
