summary_user: 인천광역시경찰청 관할 경찰서(중부·미추홀·남동·부평·서부·계양·강화·연수·삼산·논현)별 112 신고 접수 건수를 연도별로 집계한 파일로, 한 행이 한 해이고 경찰서가 열로 놓인 1KB 남짓의 작은 CSV다. 분석가나 지역 주민이 '인천에서 112 신고가 가장 많은 경찰서는 어디이고 해마다 어떻게 변했나' 같은 치안 수요 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 경찰서 이름을 맞추거나 연도 기준으로만 이어 쓰며, 경찰관서 위치나 지역 단위 범죄 발생·검거 통계와 함께 볼 때도 경찰서명 매핑이 필요하다.
description_portal: 인천광역시경찰청에서 제공하는 112 전화 신고 접수 건수 데이터는 각 경찰서별, 연도별로 신고 건수를 집계한 자료입니다. 주요 항목으로는 경찰서명, 연도, 신고 건수 등이 포함되어 있습니다. 경찰서명 항목은 인천 지역 내 각 경찰서의 명칭을 나타내며, 연도 항목은 해당 통계가 집계된 연도를 의미합니다. 신고 건수 항목은 해당 경찰서에서 해당 연도에 접수된 112 신고의 총 건수를 보여줍니다. 이 데이터는 지역별 치안 수요 분석, 신고 트렌드 파악, 정책 수립 및 연구에 활용될 수 있습니다. 데이터는 매년 최신 정보로 갱신되어 지속적인 분석과 모니터링이 가능합니다.
