summary_user: 대전광역시 유성구의 이재민 임시주거시설을 시설 1곳당 1행으로 담은 원장 파일로, 행정동·시설명·지번/도로명 주소·위도·경도·면적·수용인원·데이터기준일자를 포함한다(csv 약 7KB). 재난 발생 시 주민이 '우리 동에서 이재민이 머물 수 있는 시설은 어디이고 몇 명까지 수용하나'를 확인하거나, 분석가가 행정동별 수용 능력을 따져 보는 데 쓴다. 전역 조인 키는 없어 다른 대피·구호시설 데이터와는 행정동 이름·주소 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 대전광역시 유성구 이재민 임시주거시설 현황 데이터는 자연재해 등 긴급 상황 발생 시 주민들이 임시로 거주할 수 있는 대피시설 정보를 제공합니다. 데이터에는 연번, 행정동, 시설명, 소재지지번주소, 소재지도로명주소, 위도·경도, 면적(㎡), 수용인원, 데이터 기준일자 등의 항목이 포함되어 있습니다. 해당 정보는 재난 대응 계획 수립, 대피소 위치 확인, 수용 능력 분석 등에 활용될 수 있으며, 유성구의 재해 대비 및 복구 체계 구축에 기초 자료로 활용됩니다.해당 데이터는 주기적으로 현행화하여 공개하고 있습니다.
