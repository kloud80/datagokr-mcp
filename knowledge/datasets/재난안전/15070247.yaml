description_portal: 이 공공데이터는 2024년 12월 31일 기준으로 집계된 강원특별자치도 내 각종 총포의 소지 및 보관 현황을 정리한 자료입니다. 항목에는 권총, 소총, 엽총, 공기총, 가스발사총, 마취총, 타정총, 기타총, 폭발물분쇄기 등 다양한 총포류가 포함되며, 각 종류별로 허가된 소지 수량과 실제 보관 상태에 대한 정보를 제공합니다. 이 데이터는 총포류에 대한 안전관리 및 허가제도 운영 실태를 파악하고, 불법 유통 방지 및 사고 예방을 위한 정책 수립에 기초 자료로 활용될 수 있습니다. 경찰, 지자체, 국방·치안 관련 기관 등에서 총포 소지자 관리와 보관시설 점검, 제도 개선에 참고할 수 있으며, 연구기관과 언론에서도 총기 관리 제도의 실효성 등 유용하게 사용할 수 있습니다.
