summary_user: 전북특별자치도 소방공무원의 공상(부상)과 순직(사망) 인원을 연도별로 집계한 통계로, 공상은 화재·구조·구급·교통사고·교육훈련·기타로, 순직은 구조·일반으로 나눠 담는다(파일 크기 192바이트의 소규모 CSV). 소방 안전 담당자나 분석가가 "전북 소방관 부상은 어떤 활동 중에 가장 많이 발생하나"처럼 직무 유형별 위험 빈도를 확인하고 안전교육·근무환경 개선 방향을 잡는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 기준으로 맞추거나 같은 기관(전북 소방)의 화재 발생·출동 통계와 이름으로 대조해 이어 쓴다.
