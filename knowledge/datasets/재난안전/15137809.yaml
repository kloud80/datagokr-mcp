description_portal: '이 자료는 한국승강기안전공단의 엘리베이터 안전검사에서 사용하는 세부 “검사기준”을 정형화해 정기·수시·설치·정밀 등 검사종류별로 조회할 수 있게 구성한 기준표입니다. 각 행에는 결과입력 코드와 기준항목(예: 승강로, 매다는장치/제동·권상, 기계류 공간 등), 변수/세부항목, 법정·기술 규정에 근거한 검사기준내용이 서술되며, 해당 기준의 적용에서 제외되는 제원(검사기준 제외 제원)과 형식·종류 식별을 위한 승강기형식코드/승강기종류코드, 제원항목 컬럼명과 화면용 표시 텍스트가 함께 제공됩니다. 또한 현장에서의 조치 방향을 요약한 “표준시정권고요약”을 포함해 판정·조치의 일관성을 지원합니다. 일부 항목에는 기준 관리의 현황 파악을 위한 메타 지표(수치항목 등록건수)가 부가되지만, 제공 표본은 형식 이해를 위한 일부분으로 전체 규모나 분포를 나타내지 않습니다. 개인정보는 포함하지 않으며, 조항 번호·용어는 관련 안전기준 원문을 인용한 것입니다.'
