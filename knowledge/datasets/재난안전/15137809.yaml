summary_user: 엘리베이터 안전검사에서 쓰는 세부 검사기준을 검사종류(정기·수시·설치·정밀 등)별로 정리한 전국 단위 기준표로, 각 행에 기준항목·세부항목·검사기준내용·적용 제외 제원·표준시정권고요약을 담으며 개별 승강기 검사 결과가 아닌 기준 자체의 목록이다. 승강기 관리주체나 유지보수업체가 '정기검사에서 승강로나 제동·권상 장치는 어떤 기준으로 판정되고 지적 시 어떻게 시정하라고 권고하는가'를 확인할 때 쓴다. 전역 조인 키는 없고, 승강기형식코드·승강기종류코드를 같은 기관의 승강기 원장·검사 결과 데이터의 형식·종류 코드와 맞춰 연결하는 방식으로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 코드·이름 매핑으로만 연결된다. 승강기 고유번호 단위의 검사 이력이나 판정 결과는 담지 않으므로 개별 승강기의 합격 여부는 이 표로 알 수 없다.
