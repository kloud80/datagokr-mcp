summary_user: '광주광역시 소방서별 119안전센터의 소재지 도로명주소와 관할 법정동(관할구역)을 안전센터 한 곳당 한 행으로 정리한 소규모 원천 목록(CSV 약 3KB)이다. 시민이나 분석가가 "우리 동네(예: 충장동·화정동)는 어느 119안전센터 관할인가"를 확인하거나 소방서별 관할 범위를 정리할 때 쓴다. 전역 조인 키나 코드가 없어 관할구역의 동 이름이나 도로명주소 문자열을 행정동·법정동 코드표나 주소 정보와 이름으로 맞춰 다른 소방·재난 데이터와 이어 쓴다.'
description_portal: 본 데이터는 광주광역시 소방서 및 119안전센터의 위치와 관할구역 현황을 정리한 자료입니다. 소방서명, 안전센터명, 소재지 도로명주소, 관할구역, 데이터기준일로 구성되어 있으며, 동부소방서·서부소방서를 포함한 각 소방관서별 관할 정보를 확인하실 수 있습니다. 대인119안전센터, 용산119안전센터, 지산119안전센터, 화정119안전센터, 염주119안전센터 등 안전센터별로 충장동, 계림동, 산수동, 학동, 지산동, 동명동, 화정동, 농성동, 유덕동, 양동, 광천동 등 상세 관할지역이 함께 제공되어 있습니다.
