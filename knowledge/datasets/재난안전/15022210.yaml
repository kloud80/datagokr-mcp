description_portal: 경상북도경찰청은 지역 경제의 안정성과 공정한 거래질서를 확보하기 위해 매년 경제범죄에 대한 단속 및 검거 현황을 체계적으로 수집하고 있다. 본 데이터는 관할 구역 내에서 발생한 사기, 횡령, 배임, 유사수신행위, 불법 다단계 영업 등 주요 경제범죄 유형별로 검거 건수와 관련 통계를 포함한다. 또한 범죄 발생 장소, 시기, 피의자 수, 수사 진행 상황 등의 세부 정보를 제공하여 경제사범의 발생 양상을 시계열적으로 분석할 수 있도록 구성되어 있다. 이 데이터는 범죄 예방정책 수립, 연구 분석, 사회적 대응전략 마련 등을 위한 기초자료로 활용될 수 있으며, 행정기관, 학계, 민간 등 다양한 분야에서 이용이 가능하다. 자료는 공공데이터포털을 통해 CSV 형태로 개방된다.
