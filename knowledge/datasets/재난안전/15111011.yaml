description_portal: '국토안전관리원에서 제공하는 시설물을 대상으로 탄산화 시험의 결과 데이터 입니다.시설물은 교량, 터널, 댐, 상하수도, 하천, 항만 6가지로 구분되어 있습니다.시설물의 용도에 따라 교량은 도로교량, 철도교량으로 구분되어 있으며, 댐은 다목적댐, 발전용댐, 용수전용댐으로 개별 구분되어 있습니다.개별 시설물에 대해 탄산화깊이, 탄산화속도계수, 탄산화되는 시간, 평가등급 등 데이터를 제공 드립니다.데이터는 10개의 열과 2,658개의 행으로 구성되어 있습니다.데이터 공란사유 : 데이터 미집계(보고서 내 데이터 없음)'
