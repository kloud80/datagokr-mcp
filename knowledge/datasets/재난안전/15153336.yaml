summary_user: 전국의 물놀이 관리지역을 지역 한 곳씩 담은 목록으로, 시도·시군구명, 지역 이름, 주소, 좌표(X·Y 및 도형), 위험구역 구분, 물놀이 사고 관련 항목, 안전조치 사항 등을 담는다. 여름철 지자체 안전 담당자나 피서객이 '우리 시군구의 물놀이 위험구역은 어디이고 어떤 안전조치가 되어 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 재난안전 데이터(위험지역·대피시설 등)와는 시도·시군구명 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 물놀이 관리지역에 대한 정보입니다.\""
