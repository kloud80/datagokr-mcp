description_portal: '공공데이터 제공 신청건으로, 강원특별자치도 강릉시 계곡별 인명구조함 비치 현황 데이터입니다.본 데이터는 7개 항목(컬럼)으로 구성되며, 각 항목의 설명은 다음과 같습니다.계곡명: 응급구조함이 비치된 계곡의 이름 (예: 얼음골, 단경골)주소: 비치된 장소의 상세 주소구비개수: 해당 장소에 구비된 구조함의 수량비고: "인명구조봉 형태", "인명구조함" 등 구조함의 형태 및 특이사항관리기관: 구조함을 관리하는 기관명 (예: 강원도 강릉시 재난안전과)연락처: 관리 기관의 전화번호데이터기준일: 해당 현황을 조사한 기준 날짜이 7개 항목의 조합을 통해, 계곡명과 주소를 기준으로 비치된 인명구조함의 구비개수와 관리기관 정보를 데이터기준일에 맞춰 파악할 수 있습니다.'
