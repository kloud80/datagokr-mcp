summary_user: 전국 건설 현장의 지반조사 보고서를 전산화한 자료 가운데 굴절법 탄성파 시험의 부정보를 측선 단위로 담은 파일(csv 약 376KB)로, 프로젝트코드·측선번호·순번과 측선 시작·종료 좌표, TM 위치좌표를 개별 위치 수준으로 담는다. 설계·시공 분석가가 특정 부지 주변에서 과거에 탄성파 탐사가 어느 측선으로 실시됐는지 확인하고 지반 조사 이력을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 국토지반정보 계열 자료와는 프로젝트코드로, 다른 공간 데이터와는 좌표로 맞대어 연결한다.
