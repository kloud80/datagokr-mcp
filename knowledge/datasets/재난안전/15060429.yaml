summary_user: 대구광역시 달서구 안의 공공시설물 한 곳마다 시설물구분·종류, 내진성능 확보 여부, 도로명·지번 주소, 위도·경도, 담당부서, 기준일자를 담은 건별 현황 파일(csv 약 19KB)이다. 달서구 주민이나 재난안전 담당자가 '우리 동네 공공시설 중 내진성능을 갖춘 건물은 어디인가'를 확인하거나 지진 때 대피 장소를 고르는 데 쓴다. 전역 조인 키가 없어 대피소·시설 안전 데이터와는 주소나 좌표, 시설물명을 맞춰 연결한다.
description_portal: 대구광역시 달서구 내 공공시설물 현황은 지진 피해 예방을 위해 내진성능을 향상시키는 기존 공공시설물의 확보 여부를 확인할 수 있도록 정보를 제공하며 1년마다 주기에 따라 업데이트합니다.항목은 위도, 경도, 시설물구분, 시설물명, 시설물종류, 내진성능, 소재지도로명주소, 소재지지번주소, 담당부서, 기준일자로 구성되어있습니다.데이터를 개방함으로써 지진 시 공공시설로 대피 등 목적으로 활용 가능합니다.해당 데이터에 대한 문의는 달서구청 안전도시과 053-667-3442로 연락주시기 바랍니다.
