summary_user: 제주특별자치도에서 2018~2020년 발생한 만 12세 이하 어린이 교통사고를 연도·시간대별로 묶어 사고 건수, 사망자 수, 부상자 수를 담은 집계 통계이다. 제주 지역 교통안전 담당자나 분석가가 '어린이 사고가 등교·하교·저녁 중 어느 시간대에 몰리는가'를 확인해 보호구역 운영 시간이나 등하교 교통 지도 계획을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준 연도·시간대 같은 이름 매핑으로만 이을 수 있고, 같은 개념인 교통사고다발지역 표준데이터나 도로·경찰 교통사고 통계와 나란히 비교하는 식으로 쓴다.
description_portal: 이 데이터셋은 2018년부터 2020년까지 기간 동안 제주특별자치도에서 발생한 만 12세 이하 어린이의 교통사고를 시간대별로 구분해 사고 건수, 사망자 수, 부상자 수를 집계한 공공 통계자료이다. 시간대별 사고 발생 현황을 제공함으로써, 아침 등교 시간대, 하교 및 방과 후 시간대, 저녁 시간대 등 어린이 활동 패턴에 따라 사고 위험이 높은 시점을 분석할 수 있다. 해당 정보는 어린이 보호구역 운영 시간대 설정, 교통 신호 및 횡단 안전 시설 배치, 등하교 교통 지도 계획 수립, 어린이 통행 안전 캠페인 설계 등 보행 안전 정책 및 교통안전 대책 마련에 유용한 기초자료로 활용될 수 있다. 데이터 제공기관은 제주특별자치도이며, CSV 형식으로 누구나 다운로드 가능한 공개 데이터이다. 시간대별 사고 분포 분석을 통해 지역 교통 환경의 취약 시점 파악, 정책 우선순위 설정 및 안전 교육·홍보 기획에 참고 가능한 실무 중심 통계이다.
