summary_user: 시추조사로 얻은 암반 수압시험(루전시험)의 부정보를 시추공·시험 차수 단위로 담은 파일 데이터로, 주입량·수압·루전값·투수계수·총수위 같은 측정값이 들어 있고 범위는 전국이다. 지반 설계·시공 기술자나 분석가가 특정 사업지 주변 암반의 절리·균열 정도와 투수성이 어느 수준인지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 지반정보 계열의 수압시험 주정보나 시추공 정보와는 프로젝트코드·시추공코드(시추공코드) 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 시추조사를 통해 생산된 지반조사결과 중 수압시험의 부정보를 제공합니다. 지반조사 수압시험(Lugeon Test)은 암반층의 투수성을 파악하기 위해 시추공에 물을 가압 주입하여 그 주입량과 압력을 측정하는 현장시험입니다. 이 시험을 통해 얻는 Lugeon 값은 암반 내 절리나 균열의 정도를 나타내며, 시험 결과는 구조물 설계 및 시공에 필요한 암반의 투수성 데이터를 제공하는데, 본 데이터는 시스템에 구축된 부정보를 제공하고 있습니다.
