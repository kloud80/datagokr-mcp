summary_user: 해양경찰청에 신고·접수된 해양오염사고를 건별로 담은 파일 데이터로, 해경서·발생일시·장소·좌표·오염원·원인·물질(최대 3종)·유출량을 싣고 검증 수신 기준 전국 2,128행(2017-01-01~2024-12-30)이다. 분석가나 방제 담당자가 어느 해역에서 어떤 오염원이 어떤 원인으로 기름을 얼마나 흘렸는지 같은 질문에 쓴다. 경도·위도의 도·분·초 좌표 필드가 조인 키라서 같은 좌표 체계의 파출소·인명구조함 위치나 해역 단위 해양사고 데이터와 위치로 이어 쓴다.
description_portal: '1. 해양경찰청(해양경찰서)으로 신고, 접수 된 해양오염사고의 상세데이터이다. (발생해경서, 일시, 장소, 경위도, 오염원구분, 발생개요, 물질명, 유출량 등) * 유출량1,2,3의 단위는 리터(L)   2. 유출된 오염물질 종류 및 유출량은 최대 3가지를 제공하고 있습니다.  ※ 물질 1 : 대표물질 / 물질2,3 : 기타물질  < 최근 5년간(‘20∼’24) 유형별 현황 >  ○ (총  괄) 총 1,273건 발생, 1,734.5㎘ 유출(연 평균 254건, 346.9㎘ 유출) ○ (원인별) 건수는 ‘부주의’(429건, 33.7%), 유출량은 ‘해양사고’(1,471.7㎘, 84.8%)가 최다   - (건수) 부주의(429건, 33.7%) > 해양사고(33.4%) > 파손(25.5%) > 고의(4.5%) > 미상(2.9%)   - (유출량) 해양사고(1,471.7㎘, 84.8%) > 파손(8.6%) > 부주의(4.9%) > 고의(1.5%) > 미상(0.2%) ○ (오염원별) 건수는 ‘어선’(544건, 42.7%), 유출량은 ‘기타선’(812.4㎘, 47%)이 최다   - (건수) 어선(544건, 42.7%)>기타선(24.1%)>유조선(10.6%)>육상(10.2%)>화물선(9.5%)>미상(2.9%)   - (유출량) 기타선(812.4㎘, 47%)>어선(27.8%)>화물선(17.2%)>육상(4.6%)>유조선(3.2%)>미상(0.2%) ○ (해역별) ‘남해’ 해역이 건수(491건, 38.6%) 및 유출량(911.3㎘, 52.5%) 모두 최다   - (건수) 남해(491건, 38.6%)>서해(25.5%)>중부(16%)>동해(11.5%)>제주(8.4%)   - (유출량) 남해(911.3㎘, 52.5%)>서해(22.8%)>제주(14.9%)>중부(6%)>동해(3.8%) ○ (물질별) ‘경질유’가 건수(526건, 41.3%) 및 유출량(1,145.5㎘, 66%) 모두 최다 ○ (유출량) ‘1㎘ 미만’사고건수(1,173건, 92.1%)가 최다'
