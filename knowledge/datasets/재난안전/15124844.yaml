description_portal: 이 데이터는 한국남부발전이 전사적으로 운영하는 표준작업 위험성평가 현황을 정리한 자료입니다. 기계, 전기, 제어 등 주요 분야별로 작업을 대분류·중분류로 구분하고, 각 작업별 위험성평가 표준안 건수를 기록하고 있습니다. 예를 들어 증기터빈(ST), 보일러 및 석탄취급설비, 가스터빈(GT)과 배열회수보일러(HRSG), 발전기·변압기, 계측기·스위치 등 다양한 설비와 작업이 포함되어 있습니다. 이를 통해 발전소 운영 과정에서 발생할 수 있는 잠재적 위험요소를 체계적으로 관리하고 있음을 알 수 있으며, 산업안전 강화와 재해 예방을 위한 기초자료로 활용할 수 있습니다. 본 자료는 공기업의 안전관리 체계 확립, 위험성평가 제도 운영 현황 분석, 향후 안전정책 수립 및 개선에 중요한 참고자료가 됩니다.
