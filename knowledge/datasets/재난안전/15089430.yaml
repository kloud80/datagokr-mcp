summary_user: 인천광역시 서구(서해구) 안에서 주민에게 개방된 비상급수시설을 시설 하나당 한 행으로 담은 소규모 원천 목록(CSV 약 1.2KB)으로, 시설종류·용도·시설명칭·시설유형·도로명/지번 주소·일일 급수용량(톤)을 담는다. 단수나 재난 상황에서 주민이 "우리 동네에서 가장 가까운 비상급수시설은 어디이고 하루에 몇 톤을 공급하나"를 확인하거나, 구청·분석가가 지역별 비상급수 공급능력을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 주소(도로명·지번)나 시설명칭을 맞춰 이어 쓰고, 지도에 올리려면 주소를 좌표로 바꾸는 지오코딩을 거쳐야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 개방된 비상급수시설의 현황을 담고 있습니다. 본 자료는 인천광역시 서구 내 개방 비상급수시설의 시설종류, 용도, 시설명칭, 시설유형, 소재지(도로명,지번) 등의 정보를 수록하고 있습니다. 본 데이터를 통해 주민들에게 주변 비상급수시설의 위치를 제공함으로써 재해 대비 능력을 높일 수 있을것이며, 또한 각 공공기관의 위기 대응 체계 강화에도 기여할 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
