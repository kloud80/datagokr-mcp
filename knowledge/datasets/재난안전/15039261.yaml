summary_user: 전국 성범죄 발생 건수를 연도별로 아파트·주택, 노상, 상점·노점, 목욕탕·숙박업소, 유흥업소, 역대합실, 지하철, 기타교통수단, 학교, 기타 등 발생 장소 유형별로 나눠 담은 전국 단위 집계 파일(csv, 586 bytes)이다. 분석가나 정책 담당자가 "지하철이나 노상에서 일어나는 성범죄는 줄고 주거지 발생은 늘었는가" 같은 장소별 추세를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나 같은 경찰청 범죄통계와 이름으로 대조해 이어 쓴다.
description_portal: '제공된 경찰청 성범죄 통계에 따르면, 아파트/주택/노상이 가장 빈번한 발생 장소이며, 최근 3년간 기타 장소의 비중도 매우 높게 나타났습니다.최다 발생지: 아파트/주택 발생 건수는 2016년 5,106건에서 2024년 9,257건으로 가장 큰 폭으로 증가했습니다.유흥업소/숙박업소: 2023년에 숙박업소(3,609건) 및 유흥업소(4,098건) 발생이 급증했으나, 2024년에는 각각 3,552건과 4,023건으로 소폭 감소했습니다.주요 감소: 노상 발생은 2017년 4,447건에서 2024년 1,807건으로 가장 크게 감소했습니다. 지하철 발생도 2017년 1,661건에서 2024년 695건으로 절반 이하로 줄었습니다.기타 장소 증가: 기타 장소 발생 건수는 2016년 11,419건에서 2024년 11,533건으로 꾸준히 높은 비중을 차지하며, 2022년에는 15,028건으로 정점을 찍었습니다.'
