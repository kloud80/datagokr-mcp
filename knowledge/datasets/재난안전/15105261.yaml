description_portal: '본 공공데이터는 인천광역시 서구 내 제설함의 설치 현황을 제공합니다. 본 자료는 인천광역시 서구 내 각 제설함의 관리번호, 위치, 전화번호, 도로명 주소 및 설치 사유(예: 경사로, 응달, 소방도로 등 취약요인)를 포함하고 있습니다. 본 데이터를 통해 겨울철 눈과 빙판으로 인한 교통안전 문제를 예방하기 위해 설치된 제설함의 분포 및 특성을 파악할 수 있습니다. 이로 인해 제설함 유지관리와 제설함 신설 계획 수립에 참고할 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.'
