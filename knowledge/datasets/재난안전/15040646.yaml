summary_user: 수원시 관내 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 원천 목록으로, 관할 구청·행정동, 지정구분, 용도, 급수용량(톤), 도로명·지번 주소와 위도·경도를 포함한다. 단수나 지진·가뭄 같은 비상 상황에서 시민이 "우리 동네에서 가장 가까운 급수시설은 어디인가"를 찾거나, 분석가가 구·동별 급수용량 분포를 점검하는 데 쓴다. 전역 조인 키는 없어 행정동명·구청명 같은 이름 매칭이나 좌표를 기준으로 대피소·소방서·병원 등 다른 재난시설 데이터와 지도 위에서 겹쳐 쓴다.
limits: 수원시 한 곳만 다루므로 다른 시군과 비교하려면 지역별 데이터를 따로 모아야 한다. 행정코드 같은 공통 키가 없어 다른 데이터와는 이름이나 좌표로만 연결된다.
