summary_user: 울산광역시 남구에 설치된 가로보안등을 한 기씩 담은 건별 원천 파일로, 관리번호·주소·위도·경도와 등기구·램프 종류, 램프 용량(W)·수량, 등주 종류 같은 사양을 함께 싣는다. 주민이나 분석가가 '남구에서 야간 보행로 중 보안등이 드문 구간은 어디인가', '아직 고와트 램프가 남아 교체가 필요한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 주소를 기준으로 CCTV·안전비상벨 같은 방범 시설 위치 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 해당 데이터는 지역 내 야간 보행 안전과 도시 조명 인프라 관리에 활용되는 기초 자료입니다. 항목으로는 관리번호, 시설종류, 지번주소, 도로명주소, 등기구 종류, 램프 종류, 램프 용량(W), 램프 수량, 등주 종류, 위도, 경도, 데이터 기준일자 등이 포함되어 있으며, 각 보안등의 설치 위치와 사양을 상세히 확인할 수 있습니다. 이 데이터는 보안등 시설의 현황 관리, 고장 대응, 에너지 효율 분석, 정비 계획 수립 등에 활용될 수 있으며, 행정기관은 물론 연구자와 시민에게도 유용한 공공정보입니다. 정기적인 갱신을 통해 최신 상태를 반영하며, 도시 안전과 생활환경 개선을 위한 정책 수립의 기반 자료로 기능합니다.
