summary_user: 충청남도 금산군이 관리하는 가로등·보안등을 개소 단위로 담은 원천 목록이며, 포털 설명상 총 9,759개를 관리번호, 지번 주소, 위도·경도, 램프 종류·용량, 등기구·등주 형태, 설치일자와 함께 싣는다. 금산군 주민이나 생활안전 분석가가 '우리 동네 어두운 골목에 보안등이 어디 있고 얼마나 오래됐나'를 확인하거나, 지자체가 노후 등기구 교체 대상을 고르는 데 쓴다. 전역 조인 키는 없어서 위도·경도 좌표나 지번 주소로 CCTV·안전비상벨 같은 다른 방범 시설 데이터와 지도 위에서 겹쳐 쓴다.
description_portal: 이 데이터는 가로등 및 보안등 설치 현황을 체계적으로 정리한 자료로, 우리군은 총 9,759개의 가로등 및 보안등을 관리하고 있습니다.각 가로등 및 보안등에 대한 관리번호, 설치개수, 설치 주소, 위도·경도 좌표, 램프 종류와 용량, 등기구 및 등주 형태, 설치일자등에 대한 다양한 정보를 포함하고 있습니다. 또한 가로등 및 보안등에 대한 관리기관 및 관리기관 전화번호를 안내하고 있습니다.해당 데이터는 신설 및 노후 설비 교체를 위한 기초 자료로 활용될수 있으며, 데이터는 연간 주기로 업데이트 되어 공개되고 있습니다.
