summary_user: 광주 북구 안 횡단보도 인근 등에 설치된 그늘막을 한 기씩 담은 시설 목록으로, 관리번호·종류(고정형·스마트형)·행정동·설치장소명·지번주소·설치일자를 담는다(CSV 약 19KB). 주민이나 구청 담당자가 '우리 동네 어느 횡단보도에 그늘막이 있고 스마트형은 어디인가'를 확인하거나 폭염 대비 시설 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어 행정동 이름이나 지번주소를 매핑해 무더위쉼터 등 같은 구의 다른 대피·구호시설 자료와 이어 쓴다.
description_portal: '전남광주통합특별시 북구에 위치한 그늘막 설치 현황 데이터입니다.2018년부터 전남광주통합특별시 북구 내 횡단보도 인근 등의 위치에 설치되어 운영 중인 그늘막의 관리번호, 종류(고정형, 스마트형), 읍면동(행정동 기준), 설치장소명, 설치위치지번주소, 설치일자에 대한 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 설치장소명은 지정되지 않은 경우 공란※ 스마트(형) 그늘막: 사물인터넷(IoT)과 태양광 기술 등을 접목한 시설로, 온도와 바람의 세기를 분석하는 감지 센서를 통해 자동으로 펴지고 접히는 그늘막'
