description_portal: '- 전라남도 소방용수시설  현황에 대한 정보를 제공하고 있습니다.- 설치연도, 소방서명, 안전센터명, 수리종별, 수리번호, 시군명, 지번주소, 도로명주소, 위경도, 출수압력, 배관구경, 사용가능여부, 보호틀 여부 등에 대한 데이터를 제공합니다. - 전라남도는 소방용수시설을 체계적으로 구축하여 화재 발생 시 신속한 대응과 효율적인 소방 활동을 지원하고 있습니다. 이러한 시설은 도민의 생명과 재산 보호를 위한 중요한 인프라로, 지속적인 점검과 유지보수가 이루어지고 있습니다.- 전라남도 소방본부는 소방용수시설의 효율적인 운영을 위해 정기적인 점검과 유지보수를 실시하고 있습니다. 또한, 소방용수시설의 위치와 상태를 기록하여 신속한 화재 대응이 가능하도록 관리하고 있습니다.'
