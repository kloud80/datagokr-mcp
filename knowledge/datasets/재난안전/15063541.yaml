summary_user: 한국119소년단의 현황을 소방본부별로 집계한 자료로, 유치원(어린이집)·초등학교·중학교·고등학교·대학교·기타(지역단)별 단(기관) 수와 대원 수를 담으며 전국 범위의 917바이트짜리 작은 CSV 파일이다. 청소년 안전교육 담당자나 정책 분석가가 "어느 시도 소방본부에 119소년단 대원이 많고, 학교급별 참여는 어떻게 나뉘는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소방본부 이름(본부별)을 시도명에 맞춰 이어 붙이는 방식으로만 연결한다.
description_portal: 해당 데이터는 소방청이 운영하는 청소년 안전봉사 조직인 한국119청소년단의 현황을 정리한 자료입니다. 한국119청소년단은 1963년 창단하여 어려서부터 안전에 대한 의식과 습관을 기르고, 안전을 중시하는 건전하고 건강한 어린이 육성을 목표로 청소년들에게 화재 예방, 생활안전, 응급처치 등 안전의식을 심어주고 자율적인 봉사활동을 장려하기 위해 조직된 단체로, 전국 초·중·고교 및 청소년 시설을 중심으로 운영되고 있습니다. 이 데이터에는 연도별 단원 수, 학교·기관별 가입 현황 등을 나타내며 이를 통해 해마다 청소년 안전교육 참여 규모가 어떻게 변화했는지 알 수 있습니다. 또한 청소년 안전봉사 활동의 활성화 정도를 보여주는 지표로 활용되어, 소방청 및 지자체가 차세대 안전리더 육성 정책을 수립하고 교육 콘텐츠를 보완하는 데 기초자료가 될 수 있고 학교 현장에서는 안전 교육 프로그램의 효과를 점검하고, 청소년들에게 안전의식을 생활화할 수 있도록 지도하는 데 중요한 참고자료로 쓰일 수 있습니다.
