summary_user: 한국가스공사가 정압기지·고압가스 저장소 등에 설치한 지진가속도계측기 기준 반경 50km 이내에서 감지된 지진을 건별로 담은 파일로, 감지시각·규모·진앙지(위도·경도)·관측소명·진앙거리·최대지반가속도(PGA)를 기록한다. 가스시설 안전 담당자나 분석가가 '특정 가스 관리소 주변에서 어떤 규모의 지진이 얼마나 가까이 발생했고 지반가속도는 얼마였나'를 확인하는 데 쓴다. 전역 조인 키는 없어 관측소명으로 같은 기관 시설 자료와 맞추거나, 진앙 위도·경도와 감지시각으로 기상청 지진 정보 등과 좌표·시간 기준으로 이어 쓴다.
description_portal: '지진발생 현황은 지진대책법에 따라 설치된 한국가스공사의 지진가속도계측기로부터 50km 이내 지진 발생 이력을 나타낸 데이터입니다.* 한국가스공사 지진가속도계측기 설치 기준 : 내진 특등급, 1등급의 정압기지, 고압가스 저장소* 데이터 구성 : 감지일시(연,월,일,시간), 지진 규모, 진도, 진앙지(위도, 경도), 해당 관측소명, 관측소와 진앙간 거리, 최대지반가속도(Peak Ground Acceleration)※ 발생된 지진에 대한 세부 정보는 기상청 홈페이지 등을 통해 확인 가능합니다.※ 지진가속도계측기 설치 기준은 지진대책법 등에서 확인 가능합니다.'
