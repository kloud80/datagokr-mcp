summary_user: 서울시 비상소화장치를 장비 한 대당 한 행으로 담은 위치 원장으로, 장치 고유번호·일련번호와 X·Y 좌표, 사용구분(사용가능·고장), 삭제여부, 업데이트 날짜가 들어 있다. 자치구·소방 담당자나 분석가가 "우리 동네 반경 안에 지금 쓸 수 있는 비상소화장치가 있는가, 고장 난 장치는 어디에 몰려 있는가"를 확인하거나 안전지도를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 좌표를 이용한 공간 결합이나 이름 매핑으로만 이어지며, 소방용수 위치·화재 발생 건별 자료와 함께 놓고 보는 것이 이 부문의 주된 활용이다.
description_portal: '서울시 비상소화장치 위치정보 데이터는 화재 등 긴급 상황 발생 시 시민이 활용할 수 있는 비상소화장치의 위치와 관리 현황을 파악하기 위한 자료입니다. 연번, 비상소화장치일련번호, 비상소화장치고유번호, 일련번호를 통해 개별 장비를 식별할 수 있으며, X좌표와 Y좌표는 각 비상소화장치의 공간적 위치를 나타내어 지도 서비스나 공간분석에 활용할 수 있습니다. 사용구분은 장비의 용도나 설치 형태 등을 구분하는 데 활용되며, 삭제여부와 업데이트날짜는 장비의 설치·이전·철거 여부 및 데이터의 최신성을 확인하는 기준이 됩니다. 이 데이터는 자치구 및 소방당국의 화재 예방 정책 수립, 시민 대상 안전지도 제작, 생활권 내 비상소화장치 접근성 분석 등 도시 안전 인프라 개선을 위한 기초 자료로 활용될 수 있습니다.※ 사용구분값의 52201~52202 : 사용가능, 52203~52207 : 고장위치정보 값의 X, Y 속성의 좌표계는 ITRF2000_MTM(TM20만60만, 중부원점) 입니다.'
