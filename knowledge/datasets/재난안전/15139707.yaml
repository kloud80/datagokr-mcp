summary_user: 재난안전데이터 공유플랫폼에서 제공하는 지역방역 사전대상(방역 취약지역) 정보를 대상지 한 건씩 담으며, 관리번호·행정동·법정동 코드, 지번·도로명 상세주소, 취약지역 유형과 이름, 선정일자, 조치내용이 들어 있고 범위는 전국이다. 지자체 방역 담당자나 분석가가 '우리 동네에서 방역 취약지역으로 선정된 곳은 어디이며 어떤 유형인가'를 확인하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 행정동·법정동 코드(STDG_CD)나 주소를 이름·코드 매핑해 행정구역 통계나 다른 재난안전 위험지역 데이터와 붙여 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지역방역 사전대상정보로, 관리번호, 행정동코드, 법정동코드, 산주소여부, 주지번, 부지번, 상세주소, 취약지역유형코드, 취약지역명, 선정일자 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
