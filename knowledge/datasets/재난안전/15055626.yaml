description_portal: 이 데이터는 2015년부터 2019년까지 5년간 전북특별자치도 119 종합상황실에 접수된 신고 현황을 유형별로 집계한 통계입니다. 화재, 구조, 구급과 같은 실제 재난 대응 출동 건수뿐만 아니라, 대민 출동, 유관기관 이첩, 안내 민원 등 다양한 비긴급성 활동 내역을 포함하고 있습니다. 또한 오접속, 무응답, 오인 신고 건수도 별도로 분류하여 119 신고 시스템의 운영 효율성을 분석할 수 있는 데이터를 제공합니다. 이 자료는 지역 내 재난 발생 유형과 빈도를 파악하고, 소방 및 구급 자원의 효율적인 배분과 운영 계획을 수립하는 데 중요한 기초 자료로 활용됩니다.
