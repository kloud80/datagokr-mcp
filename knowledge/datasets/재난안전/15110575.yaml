summary_user: 대구광역시 동구가 지정한 안심귀갓길을 구간 단위로 담은 API로, 구간마다 등록번호, 지정 연도, 구간 이름, 시작·끝 구간 설명, 길이(미터)가 들어 있습니다. 동구 주민이 '우리 동네 어느 길이 안심귀갓길로 지정됐고 언제부터인가'를 확인하거나, 분석가가 연도별 지정 구간 수와 총 연장을 집계하는 데 씁니다. 실측 컬럼에는 다른 데이터와 바로 붙일 공통 조인 키가 없으므로, CCTV·안전비상벨·보안등 같은 방범 인프라 데이터와 합치려면 구간 이름(SCTN_NM)의 도로명·지명을 직접 맞춰야 합니다.
limits: 좌표가 없는 비공간 데이터라서 지도에 바로 올리거나 다른 시설과의 거리를 계산할 수 없습니다. 범위는 동구 한 곳의 시군구 단위로 한정됩니다. 호출에는 serviceKey가 필요하고, 개발계정은 하루 10,000회까지 호출할 수 있습니다.
