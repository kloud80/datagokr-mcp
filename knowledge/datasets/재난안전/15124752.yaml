summary_user: 경기도 양주시 안의 기계설비 성능점검 대상 건축물을 한 건물씩 담은 원장 파일로, 건축물 용도·건물명·주소·연면적·세대수와 관리부서·전화번호가 들어 있다. 시 담당자나 건물 관리자가 '우리 건물이 성능점검 대상인지, 담당 부서가 어디인지'를 확인하거나, 분석가가 연면적·세대수 규모별로 점검 대상 분포를 살피는 데 쓴다. 전역 조인 키가 없어 건축물대장 등 다른 데이터와는 주소나 건물명을 맞춰 붙여야 한다.
description_portal: 본 데이터는 경기도 양주시 내 기계설비 성능점검 대상 현황을 제공한다. 데이터에는 건축물의 용도, 건물명, 주소, 연면적, 세대수, 관리부서명, 관리부서전화번호 등이 포함되어 있다. 이를 통해 양주시 내 주요 건축물의 시설 현황과 기계설비 점검 대상 여부를 확인할 수 있으며, 공공기관·의료기관·공장·판매시설 등 다양한 건축물의 정보를 제공한다. 데이터는 건축물의 안전성 및 성능을 관리하는 기반 자료로 활용될 수 있고, 특히 연면적·세대수와 같은 수치를 통해 규모별 성능점검 관리가 가능하다. 또한 관리부서 및 담당 연락처를 포함하여 실제 점검·관리 체계에 즉각적으로 활용할 수 있도록 구성되어 있다. 이 데이터는 공공 안전관리, 건축물 유지보수, 행정업무 지원, 정책 수립 등에 중요한 기초자료로서 기능한다.
