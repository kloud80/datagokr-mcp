summary_user: 광주 서부소방서 관내 119청소년단을 단(유치원·초등학교·청소년수련시설 등)별로 한 행씩 담은 소규모 현황 파일로, 단 이름·단원 수·도로명주소·연락처·데이터 기준일자를 담는다(포털 설명상 2024년 12월 31일 기준 4개 단, 단원 141명). 학부모나 지역 안전교육 담당자가 '우리 동네 어느 학교·시설에서 119청소년단을 운영하고 몇 명이 활동하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 주소(도로명)나 단 이름으로 학교·청소년시설 목록, 다른 소방서의 같은 현황 파일과 맞춰 이어 쓴다.
limits: 공통 코드가 없어 다른 데이터와는 주소·이름 매칭으로만 연결된다. 서부소방서 관내 몇 개 단만 담은 아주 작은 파일(348바이트)이라 시도 전체나 다른 소방서 현황을 대표하지 않는다.
