summary_user: 광주 동부소방서 관내 고층건축물 수를 업종별로 나눠 대인·용산·지산 119안전센터별 건수와 합계(계)로 담은 집계표이며, 건물별 원장이 아니라 1157바이트 크기의 작은 CSV 파일이다. 소방 안전관리 담당자나 분석가가 "동부소방서 관내 어느 안전센터에 공동주택·업무시설 같은 고층건축물이 많은가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 안전센터 이름이나 업종 이름을 맞춰서만 이어 쓰며, 같은 기관의 다른 소방서 고층건축물 현황과 나란히 비교하는 정도로 쓴다.
description_portal: 광주광역시 동부소방서 관내 고층건축물 현황2025년 광주광역시 동부소방서 고층건축물 현황에 대한 데이터로 동부소방서 관내 안전 센터별 고층건축물 현황에 대한 항목을 제공합니다.‘고층건축물’이란 통상 30층 이상 또는 높이 120m 이상의 건축물을 의미하며, 공동주택, 업무시설, 오피스텔 등이 포함됩니다.이 현황은 각 119안전센터별로 구분되어 제공되어,  연 1회 갱신됩니다. 고층건축물 수나 구성 변화는 그 시기 이후 반영될 것입니다.광주광역 동부소방서에 등록된 고층건축물 현황 정보로 업종, 계, 119안전센터, 최종 데이터기준일자 등의 항목을 제공합니다.
