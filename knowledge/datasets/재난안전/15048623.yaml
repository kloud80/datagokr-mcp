description_portal: 광주광역시 광산소방서 공무직 운영현황에 대한 데이터로 해당부서, 정원, 현원, 담당업무 등의 내용을 담고 있습니다.. 총칙1. 목적이 지침은 「공무직 근로자 인사관리 규정」과 「근로기준법」, 「기간제 및 단시간근로자 보호 등에 관한 법률」등 노동관계 법령의 합리적이고 원활한 시행 및 채용절차의 공정성 제고를 위하여 필요한 사항을 구체적으로 정하려는 것임2. 근거「공무직 근로자 인사관리 규정」(중소벤처기업부 훈령 제34호, 이하 "인사관리규정"이라 함)과 「근로기준법」, 「기간제 및 단시간근로자 보호 등에 관한 법률」 등 노동관계 법령3. 적용범위이 지침은 중소벤처기업부 및 그 소속기관에 적용하되, 소속기관의 경우 각 기관의 전반적인 인력운용계획, 예산사정 등을 고려하여 이를 달리 정하여 적용할 수 있음4. 정의가. "채용비리"란 채용 전형 관리자 또는 채용 업무에 직ㆍ간접적으로 관여한 자가 고의 또는 중대한 과실로 정당한 사유 없이 특정인 또는 특정 집단의 합격 또는 불합격을 가능하게 하기 위하여 응시 자격, 평정 기준, 평정 결과 산정, 기타 채용절차에 대하여 법령, 내부 규정상 의무 및 공고된 사항을 위배하여 업무 처리를 함으로써 채용 공정성에 대한 신뢰를 훼손하거나 채용기관 내ㆍ외부에서 사실상 영향력을 미칠 수 있는 자가 이러한 행위를 하도록 강요ㆍ지시ㆍ청탁하는 것을 의미한다.나. "부정합격자"란 가목의 채용비리로 인한 합격자이거나, 「공무원임용시험령」제51조제1항 또는 제2항에 규정된 행위를 하여 합격한 자를 말한다.5. 시행일
