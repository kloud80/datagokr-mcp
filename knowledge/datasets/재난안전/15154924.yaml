description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증 관련 수수료 접수 내역을 정리한 자료입니다. 각 행은 하나의 인증 신청 건에 대한 수수료 구성과 접수 상태를 나타냅니다. 주요 항목으로는 ‘인증 신청 순번’, ‘서류 심사 수수료’, ‘공장 심사 수수료’, ‘안전성 시험 수수료’, ‘인증서 발급 수수료’, ‘출장비’, ‘위탁 수수료’, ‘현장 심사 수수료’, ‘노임단가’, ‘수수료 총합’, ‘수수료 변경 순번’, ‘수수료 확정 여부’ 등이 포함되어 있습니다. 이 데이터는 인증 프로세스의 각 단계별로 부과되는 수수료 항목을 개별적으로 구분해 기록하고 있으며, ‘수수료 총합’을 통해 전체 비용을 계산할 수 있습니다. ‘수수료 확정 여부’는 해당 수수료가 공식 확정되었는지 여부를 ‘Y/N’으로 표시합니다. 이를 통해 승강기 안전인증 관련 행정 처리의 투명성 확보와 회계관리, 예산 분석 등 다양한 목적으로 활용이 가능합니다.
