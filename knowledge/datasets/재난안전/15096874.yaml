summary_user: 제주 지역에서 발생한 렌터카 교통사고 건수·부상자 수·사망자 수를 기준 연월과 용도(대분류·소분류)별로 묶은 집계 통계로, 포털 설명상 2005~2019년을 다루며 사고 건별 원천 자료가 아니다. 렌터카 사고가 해마다 늘었는지 줄었는지, 사망·부상 규모가 어떻게 변했는지를 보고 관광객 교통안전 대책이나 렌터카 운전자 교육을 기획하는 행정기관·연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 자료와는 기준 연월이나 용도 이름을 맞춰 이어야 하며, 도로·경찰 교통사고 통계나 교통사고다발지역 표준데이터와 같은 개념으로 나란히 비교하는 데 쓴다.
description_portal: 제주특별자치도 렌터카 교통사고 현황 데이터는 2005년부터 2019년까지 제주 지역에서 발생한 렌터카 운행 차량의 교통사고 건수, 부상자 수, 사망자 수를 연도 및 용도별로 집계한 공공 통계자료이다. 이 자료는 렌터카라는 특수한 운송수단이 전체 교통사고에서 어느 정도의 비중을 차지하는지, 사고 발생 추이와 피해 규모를 분석할 수 있도록 구성되어 있다. 특히 관광지로서 렌터카 이용이 많은 제주 특성을 감안할 때, 렌터카 사고 통계는 교통안전 정책, 관광객 안전 대책, 차량 관리 지침, 도로 환경 개선 등의 기초 근거로 매우 중요하다. 또한 연구자나 행정기관은 렌터카 사고의 연도별 변화, 사망 및 부상자 규모, 사고 유형 변화 등을 분석해 렌터카 운전자 교육 프로그램 설계, 안전 캠페인 기획, 사고 예방을 위한 인프라 조성 등에 활용할 수 있다.
