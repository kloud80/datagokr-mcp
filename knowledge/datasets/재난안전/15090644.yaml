description_portal: '국토안전관리원이 제공하는 위험요소 프로파일 데이터입니다.즉, 건설현장의 공사목적물, 주변 건축물, 가설구조물 등의 안전과 작업자들의 안전을 저해하는 발생가능한 위험요소를 발굴하여 공종별 위험요소를 분류한 기본 표준자료입니다.총 55,546건의 위험요소 관련 정보를 설명하고 있으며, 시설물과 공종, 위험발생객체, 위치를 대, 중, 소로 나누어서 상세히 설명하고 있습니다.데이터에서 위험발생위치는 내부는 대략 19,000건이었으며, 외부가 22,000건 정도였습니다. 이외에는 외벽과 건설현장주변, 지붕 등의 발생위치가 존재했습니다.* 데이터 내 코드 설명1. 사고가능성(P열) : 해당 위험요소의 발생빈도 - H(High) :  빈번히 발생함 - M(Medium) : 발생가능성 있음 - L(Low) : 거의 발생하지 않음2. 사고심각성(Q열) : 해당 위험요소의 손실크기 - H(High) : 사망, 장기적인 장애를 일으키는 부상, 질병 - M(Medium) : 단기적인 장애를 일으키는 부상, 질병 - L(Low) : 상해가 없거나 응급처치 수준의 상해'
