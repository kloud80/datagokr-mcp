summary_user: 충주시 관내 산림·주변 지역을 지점 단위로 나누어 관리번호, 읍면동(areaNm), 주소, 위도·경도, 산불위험 종합점수와 등급을 담은 평가 결과 파일입니다(2022년 재난위험요인DB 구축분, zip 약 62KB). 충주시 산불 예방 담당자나 분석가가 '관내 어느 읍면동·지점이 산불위험 등급이 높아 감시 인력과 예방 캠페인을 먼저 배치해야 하나'를 따지는 데 쓴다. 전역 조인 키는 없어서 읍면동 이름으로 행정구역 자료와 맞추거나, 위도·경도로 산림·대피시설·소방 등 다른 공간 레이어와 겹쳐 쓴다.
limits: 특정 시점의 평가 기준으로 매긴 상대적 위험도라서 실시간 산불 위험이나 실제 발생 가능성을 나타내지 않는다. 명세상 한 번 만든 뒤 바뀌지 않는 이벤트성 자료이고 범위는 충주시 한 곳뿐이다. 공통 코드 키가 없어 다른 자료와는 이름 매칭이나 좌표로만 연결해야 한다.
