summary_user: 한국가스안전공사가 긴급 신고 전화 등으로 접수한 가스 사고를 건별로 담은 원천 파일로, 전국 18,252건(2020-09-05~2026-06-30)이며 사고번호·접수지사·처리지사·사고일자·신고자 소속·사고가스 항목이 있다. 분석가나 안전관리 담당자가 지역별·가스 종류별 사고 신고가 어디에 몰리는지 보는 사전 예방 분석에 쓴다. 조인 키는 주소(address)뿐이어서 같은 주소 기준의 다른 지역 데이터와 이어 쓰며, 사고번호는 키로 확인되지 않았다.
description_portal: '한국가스안전공사에서 긴급 신고 전화 등을 통해서 접수된 가스 관련 사고에 관한 접수 현황 정보를 제공합니다. 해당 데이터는 사고번호, 공사 관할 접수지사, 사고접수 일자 및 요일, 처리지사, 사고 발생일자, 신고자 소속, 사고발생 주소, 사고가스 등 제공 가능한 정보가 수록되어 있습니다. 사고 발생 현황 분석을 통한 사전 예방, 안전관리 강화 등을 위한 통계성 참고자료 등으로 활용 가능합니다.※ 2021년 1월 부터 집계된 통계 정보를 제공하며, 연간 주기로 업데이트 됩니다.- 데이터기준일 : 2026년 6월 30일'
