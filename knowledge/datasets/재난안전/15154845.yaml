description_portal: 이 데이터는 한국승강기안전공단에서 승강기 안전인증 심사를 위해 발생한 출장 여비 내역을 기록한 정보입니다. 각 행은 특정 인증 신청 건에 대한 출장 경비 내역을 포함하고 있으며, ‘인증 신청 순번’, ‘출장 인원 수’, ‘출장 박 수’, ‘출장 일 수’, ‘철도 운임’, ‘자동차 운임’, ‘일비’, ‘숙박비’, ‘식비’, ‘전일 식비’, ‘여비 총합’ 등의 항목으로 구성되어 있습니다. ‘인증 신청 순번’은 심사와 관련된 인증 건을 식별하며, 출장 인원과 기간에 따라 다양한 항목의 비용이 산정됩니다. 철도 및 자동차 운임은 교통비를 나타내고, 일비와 숙박비는 심사원이 현장에서 체류하면서 발생한 일상 경비를 의미합니다. 식비 항목은 식사와 관련된 비용이며, ‘여비 총합’은 해당 출장에서 발생한 모든 경비의 합계를 나타냅니다. 이 데이터는 심사 관련 예산 집행 내역을 투명하게 관리하고, 인증 제도 운영의 행정 효율성을 분석하는 데 활용될 수 있습니다.
