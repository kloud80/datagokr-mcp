description_portal: 본 데이터는 한국승강기안전공단이 검사 합격한 승강기에 부착하는 ‘검사 합격필증’의 일자별 재고 현황을 정리한 자료입니다. 필드는 재고 구분(정상분/훼손분), 수량, 등록일자로 구성되며, 정상분은 현장 부착이 가능한 사용 가능 재고, 훼손분은 불용·폐기 또는 재발급 관리 대상 재고를 의미합니다. 등록일자는 시스템 기준일로 동일 일자에 복수 건이 존재할 수 있으며, 시간 경과에 따른 재고 변화 추세 파악에 적합합니다. 본 자료는 합격필증의 수급·발주 계획 수립, 파손률 및 소모량 분석, 재고 안전수준 설정, 회계·감사 근거 마련 등 자재 관리 전 주기에 활용될 수 있습니다. 시설·지역 단위 정보는 포함하지 않으므로 입고·불출 등 수불 데이터와 결합 분석 시 재고 흐름을 정밀하게 추적할 수 있습니다.
