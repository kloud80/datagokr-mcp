description_portal: 한국전기안전공사에서는 첨단 교육장비와 고품질 교육 서비스를 통해 에너지 산업 인재양성을 위해 전기안전인재개발원을 운영하고 있으며, 2026년 교육 일정을 데이터로 제공합니다.각 교육 과목마다 신청일자, 신청종료일자, 교육시작일자, 교육종료일자, 정원으로 구성되어 있으며, 수강 과목으로는 동아 마이스터고 전기설비 실무 , 미리캠퍼스 전기설비의 이해 Basic 과정, 수배전설비실무, 보호계전실무, 시공업체대상 시공기술책임자 인증, 전기설비 기초실무, 전기안전관리자 직무고시, 공무원 교육 전기안전 정책관리자 과정을 운영하고 있습니다.
