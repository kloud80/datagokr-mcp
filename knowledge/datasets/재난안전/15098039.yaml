description_portal: 최근 5년간(2021년~2025년) 관서별 연안사고 현황에 관한 데이터로서, 연도,인천서,평택서,태안서,보령서,군산서,부안서,목포서,완도서,여수서,통영서,창원서,부산서,울산서,포항서,울진서,동해서,속초서,제주서,서귀포서 등의 항목을 제공합니다.연안에서 발생한 안전사고는 주로 해수욕장, 해안가, 해양 등에서의 물놀이 중 익수하거나 표류, 항포구, 방파제(테트라포드), 갯바위 등에서 낚시 중 실족 또는 음주로 인한 실족 또는 차량 조작 미숙 등의 원인으로 추락, 갯벌에서 해루질, 관광 중 물때 미인지로 인한 고립 등의 사고가 대부분 입니다.사고의 원인으로는 구명조끼 미착용, 음주 상태로 활동하는 등 활동객 부주의에 기인하여 사고가 발생하고 있습니다.
