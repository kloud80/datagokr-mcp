summary_user: 인천광역시 관내 소방시설 공사업·감리업·설계업·방염업체를 업체 한 곳당 한 행으로 담은 원장으로, 상호·대표자·주소·업종·분야(전문/일반)·소방시설업 등록번호·등록일자·폐업여부를 포함한다. 건물주나 시공 발주자가 공사를 맡기기 전에 해당 업체가 인천에 소방시설업으로 등록돼 있고 폐업하지 않았는지 확인하는 데 쓴다. 사업자등록번호(bizno)를 조인 키로 국세청 휴폐업 조회나 다른 사업자 원장과 이어 쓰고, 주소를 기준으로 인천 내 세부지역별 업체 분포를 볼 수 있다.
limits: 범위는 인천광역시 한 시도에 한정되므로 타 시도에 등록된 업체는 확인할 수 없다. 업종·분야·폐업여부에 대한 코드표가 명세에 없어 값의 의미는 실제 파일 내용을 보고 해석해야 한다.
