description_portal: 경상북도경찰청이 제공하는 ‘기초질서위반 사범 단속현황’은 공공장소에서의 질서 저해 행위에 대해 연도별 단속 실적을 집계한 공공데이터이다. 주요 단속 항목에는 노상 음주소란, 쓰레기 무단투기, 불법 노점영업, 거리 노숙, 불법 전단 배포, 공공시설 훼손 등이 포함된다. 경찰서별 단속 건수 및 위반 유형 통계가 포함되어 있으며, 지역별 질서 위반 양상 분석과 생활안전 정책 수립에 기초 자료로 활용될 수 있다. 본 데이터는 환경정비 행정, 계도 활동 기획, 치안 대응력 강화, 기초질서 유지 및 시민 인식 제고 등 다양한 행정 목적에 유용하게 사용될 수 있으며, 공공데이터포털을 통해 CSV 형식으로 제공된다. 누구나 열람 및 분석이 가능하다.
