summary_user: 제주특별자치도에서 발생한 교통사고를 교차로 형태(대분류·소분류)와 기준 연월별로 묶어 사고 건수·부상자 수·사망자 수를 담은 집계 통계로, 건별 사고 원천이 아니다. 교통안전 담당자나 분석가가 '제주에서 회전교차로와 사지교차로 중 어느 형태에서 사고와 사상자가 더 많이 나는가'를 비교할 때 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어서, 교통사고다발지역 표준데이터나 경찰 교통사고 통계와는 교차로 형태 이름이나 기준 연월을 직접 맞춰 이어 쓴다.
description_portal: '제주특별자치도 교차로 형태별 교통사고 현황 데이터는 2018년부터 2020년까지 제주특별자치도 내에서 발생한 교통사고를, 교차로의 형태별(예: 삼지, 사지, 회전교차로 등)로 구분해 사고 건수, 사망자 수, 부상자 수를 집계한 공공 통계자료이다. 이 자료는 각 교차로 유형이 교통사고 발생에 어떤 영향을 미치는지를 파악할 수 있도록 설계되었으며, 도로 설계 개선, 사고 다발 지점 분석, 교통 안전 정책 수립의 기초 자료로 활용된다. 제공 기관은 제주특별자치도이며, 데이터는 CSV 형식으로 공개되어 누구나 다운로드 가능하다. 이 통계는 교차로 구조와 사고율 간의 상관관계를 분석하거나, 특정 유형의 교차로에 대한 안전 대책 마련, 교통 인프라 개선 우선순위 설정 등에 유용한 실무 기반 자료로 사용할 수 있다. 또한, 해당 데이터를 통해 교통사고 경향 분석, 도시 교통 설계 정책의 근거 마련, 지역별 교통 안전 평가 등을 진행할 수 있다.'
