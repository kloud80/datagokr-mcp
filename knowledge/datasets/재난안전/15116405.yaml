summary_user: 울산광역시 남구 가로보안등의 고장신고를 건별로 담은 원천 파일로, 관리번호·시설구분·시설종류와 보수접수일·작업시작일·작업완료일·완료확인일, 작업내용과 진행상태를 한 행에 기록한다. 주민이나 구 담당자, 분석가가 "남구에서 보안등 고장 신고가 접수된 뒤 수리 완료까지 며칠이 걸리는가" 같은 처리 기간과 고장 유형을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 관리번호나 시설명을 같은 기관의 보안등 현황 자료와 이름으로 맞춰 잇는 수밖에 없다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 코드로 바로 결합할 수 없다. 범위는 남구 한 시군구에 한정되고 좌표 등 공간 정보가 없어 지도 분석에는 바로 쓰기 어렵다.
