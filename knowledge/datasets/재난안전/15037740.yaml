description_portal: 경찰청 생활안전교통국 청소년보호과에서 제공하는 사전등록 접수 현황 통계입니다.전체 등록 건수의 약 90% 이상을 차지하는 18세 미만 아동의 경우, 제도 도입 초기인 2013년(약 108만 건)에 정점을 찍은 뒤 점진적으로 감소하며 최근에는 연간 20만 건대를 유지하고 있습니다. 이는 대상자들의 등록이 상당 부분 완료된 점과 저출생으로 인한 대상 아동 감소가 반영된 결과로 보입니다.반면, 치매 환자 등록은 2012년 2,127건에서 2025년 53,644건으로 약 25배 급증하며 지속적인 우상향 곡선을 그리고 있습니다. 이는 고령화에 따른 치매 인구 증가와 실종 예방을 위한 사회적 관심도가 높아진 결과입니다. 지적·자폐성 장애인의 경우 연간 3천~1만 건 수준에서 변동성을 보이며 등록이 꾸준히 이어지고 있습니다.
