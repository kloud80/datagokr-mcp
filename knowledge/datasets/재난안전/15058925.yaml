summary_user: 12세 이하 보행어린이가 다치거나 사망한 교통사고 가운데, 반경 200m 안에 3건 이상(사망 포함 시 2건 이상) 발생한 다발지점을 지점별로 담은 전국 단위 API이다. 학교·통학로 안전 대책을 짜는 지자체 담당자나 분석가가 "우리 지역에서 어린이 보행사고가 잦은 곳은 어디인가"를 확인할 때 쓴다. 법정동코드(bjd_cd), 시도·시군구명(sido_sgg_nm), 경도·위도 좌표(lo_crd, la_crd)로 다른 지역·위치 데이터나 도로·경찰 교통사고 데이터와 이어 쓴다.
description_portal: '12세이하 보행어린이 교통사고에 대한 사고다발지역 정보- 대상사고 : 1년간 발생한 12세 이하 보행어린이가 다치거나 사망한 교통사고- 다발지역 선정 조건 : 반경 200m 내 대상사고 3건 이상 발생지점(사망사고 포함 시 2건 이상)- WMS 형태의 API 정보는 교통사고정보개방시스템(https://opendata.koroad.or.kr/api/sample.do)을 통해 확인하실 수 있습니다.* 해당자료는 교통사고분석시스템(https://taas.koroad.or.kr) 데이터를 기반으로 함'
