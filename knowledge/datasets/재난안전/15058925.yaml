services:
  - op: /getRestFrequentzoneChild
    name: 보행어린이사고다발지역정보 Rest 조회
    endpoint: https://apis.data.go.kr/B552061/frequentzoneChild/getRestFrequentzoneChild
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: searchYearCd
        required: true
