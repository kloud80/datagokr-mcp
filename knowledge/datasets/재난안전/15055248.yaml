summary_user: 광주 광산소방서 관내 위험물 제조소·저장소·취급소를 시설 한 곳당 한 행으로 담은 파일로, 관할 119안전센터, 제조소등 구분(옥외탱크저장소·주유취급소 등), 대상명, 데이터 기준일자가 들어 있다. 소방·안전 분석가가 '광산구 어느 안전센터 관할에 어떤 종류의 위험물 시설이 몰려 있는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 대상명이나 센터 이름을 맞춰 붙이거나, 같은 기관의 다른 소방 데이터와 나란히 놓고 보는 방식으로만 잇는다.
limits: 주소·좌표나 허가번호 같은 공통 키가 없어 지도화나 다른 시설 원장과의 정확한 매칭이 어렵다. 명세상 연간 또는 이벤트 주기로 만들어지는 시점 자료라서 기준일 이후의 허가 변동은 반영되지 않는다.
