summary_user: 전국 건설현장 시추조사 성과를 전산화한 지반정보 중 시추공별·심도 구간별 시험 결과를 담은 건별 CSV 파일(약 768KB)이다. 지반·구조 설계자나 분석가가 특정 시추공의 깊이별 P파·S파 속도, 포아송비, 전단탄성계수, 영률, 현장밀도로 지반 강성을 확인하는 데 쓴다. 전역 조인 키는 없고, 같은 기관이 쓰는 시추공코드로 국토교통부 지반정보의 다른 파일(시추공 기본정보 등)과 이어 쓴다.
limits: 파일에 좌표·행정구역 컬럼이 없어 이 파일만으로는 위치 기반 조회나 지도화를 하지 못하며, 위치는 시추공코드로 다른 지반정보 자료와 연결해야 알 수 있다. 다른 기관 데이터와 잇는 공통 키가 없어 이름·코드 매핑이 필요하다. 제목은 콘관입시험이지만 실제 컬럼은 탄성파 속도·탄성계수 위주이므로 필드 구성을 먼저 확인한다.
