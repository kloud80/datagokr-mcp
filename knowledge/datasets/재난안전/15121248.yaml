summary_user: 인천광역시 서구(서해구) 관내에서 산사태가 났을 때 주민이 대피할 임시주거시설 지정 현황을 시설 한 곳당 한 행으로 담은 작은 파일(약 1KB)이며, 시설명·시설구분·상세주소·수용가능면적·수용가능인원·내진설계 여부·사용여부·지정일자가 들어 있다. 주민이나 담당자가 "우리 동네 산사태 때 어디로 대피하고, 그곳에 몇 명까지 들어갈 수 있나"를 확인하거나, 지역 대피소의 수용 여건과 내진 여부를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 대피·구호시설이나 산사태 위험지역 데이터와는 상세주소나 시설명을 맞춰서 연결해야 한다.
limits: 시설코드 같은 공통 키가 없어 다른 데이터와 붙이려면 주소·시설명 매칭이 필요하다. 범위는 서구 한 시군구뿐이라 인천 전체나 다른 지역 대피소는 담지 않는다.
