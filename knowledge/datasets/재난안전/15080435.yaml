description_portal: '경상남도 거창군의 2015년 ~ 2021년 사이 물놀이 익사사고에 대한 데이터로 사고발생 날짜, 사망자 수, 사고장소명, 사고위치(지번) 정보를 제공합니다.○ 데이터 기준일 : 2021. 03. 31. (일회성 데이터)○ 물놀이 익사사고란 수영장, 강, 바다, 계곡 등에서 물놀이 중 발생하는 익사 사고를 의미합니다. 주로 수영 미숙, 안전장비 미착용, 음주 후 수영, 급류나 깊은 수심에 대한 부주의 등으로 인해 발생하며, 특히 여름철과 휴가철에 빈번하게 일어납니다. 어린이와 청소년, 음주자, 수영 미숙자에게 위험성이 높으며, 구조 지연이나 주변의 안전시설 부족도 사고를 악화시킬 수 있습니다. 예방을 위해서는 구명조끼 착용, 안전요원 배치, 물놀이 전 안전교육 등이 필수적이며 비가 오면 하천에서 즉시 대피하여야 합니다.'
