summary_user: 인천광역시경찰청 관할 경찰서별(중부·미추홀·남동·부평·서부·계양·강화·연수·삼산·논현)로 성매매처벌법 위반 단속 건수를 연도별로 집계한 작은 CSV 파일(875바이트)로, 건별 원천이 아닌 연도×경찰서 집계표다. 인천 지역 단속 실적이 연도별로 어떻게 변했는지, 어느 경찰서 관할에서 단속이 많은지 비교하려는 분석가·연구자가 쓴다. 전역 조인 키가 없고 경찰서가 열 이름으로 들어 있으므로, 다른 경찰 통계나 경찰관서 위치 데이터와는 경찰서 이름을 맞춰 연결해야 한다.
description_portal: 인천광역시지방경찰청 관할 각 경찰서별 성매매 단속현황 데이터는 「성매매 알선 등 행위의 처벌에 관한 법률」에 해당되는 단속 건수를 기준으로 집계된 자료입니다. 이 현황은 성매매 알선, 권유, 강요, 장소 제공 등 법률상 처벌 대상이 되는 모든 성매매 관련 행위를 포함하여 통계에 반영합니다. 다만, 약취나 유인 범죄에서 성매매가 부수적으로 포함된 경우는 본 통계에서 제외하여, 성매매 단속 실적의 정확성과 신뢰성을 높이고 있습니다. 해당 데이터는 인천광역시지방경찰청에서 관리하며, 각 경찰서별로 집계된 성매매 단속 실적을 확인할 수 있어 지역별 단속 현황 파악에 유용하게 활용됩니다.
