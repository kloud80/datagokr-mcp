description_portal: '이 자료는 제주특별자치도에서 제공하는 “안전데이터분석자료-05: 초등학교 주변 위험 준경험 지점 데이터”로, 제주 지역 내 초등학교 주변에서 보호자 또는 학생이 경험한 ‘위험 또는 준위험 지점’ 정보를 정리한 데이터셋입니다. 각 데이터 항목에는 학교명, 위도·경도, 그리고 해당 지점에서 보고된 위험요소 또는 준경험 내용이 포함되어 있으며, 전체 1,156건의 기록으로 구성되어 있습니다. 이 데이터는 안전맵 작성, 스쿨존 보행환경 개선 구역 파악, 위험지점 집중 관리, 정책 수립을 위한 기초자료로 활용할 수 있으며, 지리정보(GIS) 연계 또는 시각화 작업을 통해 위험지점 분포 및 패턴을 분석하는 데 유용합니다.'
