summary_user: 인천 영종구(포털 설명상 옛 중구 관내) 재난 시 이재민이 머무는 임시주거시설을 시설 한 곳당 한 행으로 담은 파일로, 시설구분·시설명·주소·위경도·수용가능면적·수용가능인원·내진설계·지정일자 등을 담는다. 주민이나 재난 담당자가 '우리 동 근처에 이재민이 머물 수 있는 시설이 어디 있고 몇 명까지 들어가나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 대피시설 데이터와는 관할동명·주소 같은 이름 매핑이나 위도·경도 기반 공간 결합으로 잇는다.
description_portal: 인천광역시 중구 관내에 위치한 임시주거시설에 대한 데이터 입니다.임시주거시설은 재난 발생 시 이재민 등이 대피하거나 일시적으로 거주할 수 있도록 제공되는 시설로현재 중구 관내의 임시주거시설은 총 35개소 입니다.임시주거시설은 재해구호법에 의해 구청장의 지정으로 선정됩니다.우리 구에서는 대규모 일시대피자가 발생하여도 장기적으로 체류가 가능하도록숙박시설을 임시주거시설로 지정하였습니다.파일명 인천광역시_중구_이재민임시주거시설파일내용 시설구분, 시설명, 상세주소, 수용가능인원 등
