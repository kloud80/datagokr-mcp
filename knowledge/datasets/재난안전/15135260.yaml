description_portal: 산불진화현황은 산림청과 소방당국이 공동으로 관리하는 긴급구조시스템 기반의 자료로, 산불 발생 시기, 진화 참여 인원, 진화 완료 시점, 헬기 투입 내역 등이 포함됩니다. 특히 대형 산불의 확산 경로와 진화 방식을 분석하고, 이후 유사 사고 대응 체계를 구축하는 데 기초 자료로 활용됩니다. 일부 데이터만 포함되어 있어 보완 필요합니다.* 본 자료는 긴급구조표준시스템에서 추출한 자료로 일부 정보만 포함되어 있음* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
