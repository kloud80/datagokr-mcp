summary_user: 경기도에서 발생한 대형화재를 한 건씩 담은 원천 데이터로, 건마다 집계연도, 시군, 발생 일시, 발생장소, 화재원인, 인명피해 규모, 재산피해액(천원 단위)을 기록한다. 소방·안전 분석가가 경기도 시군별로 대형화재가 언제, 어떤 원인으로 나고 피해가 얼마였는지 비교할 때 쓴다. 전역 조인 키는 없어서, 다른 시군 단위 통계와는 시군명·시군코드(SIGUN_CD)를 이름·코드로 맞춰 연결해야 한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 경기도 대형화재 발생현황 정보로, 집계연도, 시군명, 발생일자, 발생시각, 발생장소, 화재원인 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
