description_portal: 이 데이터는 경찰청이 일회성으로 제공하는 자료이며, 2020년 12월 31일 기준으로 피의자의 생활정도, 혼인관계 및 부모관계 현황을 집계한 통계자료이다. 범죄대분류와 범죄중분류별로 생활정도(하류, 중류, 상류, 미상), 혼인관계(유배우자, 동거, 이혼, 사별), 미혼자부모관계(실(양)부모, 계부모, 실부계모, 실부무모, 실모계부, 실모무부, 계부무모, 계모무부, 무부모)로 구성된다. 식별정보는 포함하지 않으며, 통계 분석용 집계 형태로 제공된다. 본 자료는 범죄자의 사회적 배경과 가족관계 현황을 이해하고, 예방 및 재범 방지 대책 수립에 활용된다. 공공데이터 개방을 통해 경찰청 정보 공유와 투명성을 높이며, 국민 알권리 보장과 공공서비스 개선에 기여한다. 범죄통계 분석, 정책 수립, 연구, 교육 등 다양한 분야에 활용 가능하며, 경찰행정의 신뢰성과 사회 안전망 구축을 지원한다.
