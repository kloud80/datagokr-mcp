summary_user: 경기도 안산시에 설치된 소화전을 한 개씩 행으로 담은 위치 원장으로, 행정·법정읍면동, 지번 기준 주소, 경도·위도, 소화전 형식(지상쌍구 등), 설치일자를 포함한다. 소방·안전 담당자나 분석가가 '우리 동네 건물 주변 가까운 곳에 소화전이 있는지, 설치된 지 오래된 소화전은 어디에 몰려 있는지'를 확인하는 데 쓴다. 전역 조인 키는 없어서 읍면동 이름으로 다른 행정구역 자료와 맞추거나 경도·위도로 대피시설·소방서 위치 등 다른 공간 데이터와 겹쳐 쓴다.
limits: 안산시 한 곳의 소화전만 담아 다른 시군과 비교하려면 별도 자료가 필요하다. 표준 행정코드 같은 공통 키가 없어 읍면동 이름 매핑이나 좌표로만 연결된다. 주소는 '○○번지 인근' 형태라 정확한 지점은 좌표로 확인한다.
