description_portal: 이 데이터는 화재 발생 시 초기 대응을 위해 지역 내에 설치된 소화전의 위치 및 기본 정보를 정리한 자료입니다. 시군명, 지형지물부호(소화전), 행정읍면동 및 법정읍면동, 소화전 설치 위치(지번 기준), 소화전 형식(지상쌍구 등), 설치일자 등의 항목으로 구성되어 있으며, 단원구 초지동·고잔동과 상록구 월피동·이동·본오동 등 생활권 중심지에 주로 분포하고 있습니다. ‘지상쌍구’ 형식의 소화전이 대부분으로, 도로변 또는 건물 인근 접근성이 우수한 장소에 설치되어 있어 긴급 소방 활동 시 활용이 용이합니다. 주소는 ‘○○동 ○○번지 인근’ 형태로 표기되어 있으며, 일부 항목은 설치 시기가 1980년대까지 거슬러 올라가는 장기 노후 시설도 포함되어 있습니다.
