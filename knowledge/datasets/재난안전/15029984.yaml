description_portal: 이 데이터는 경찰청이 일회성으로 제공하는 데이터로 2000년부터 2017년까지 집계한 불법무기 자진신고 현황을 정리한 자료이며, 연도별 구분, 권총, 소총, 엽총, 공기총, 기타총, 도검류, 포탄류, 실탄류, 폭발물류 항목을 포함한다. 데이터는 연도별 각 유형별 자진신고 건수를 기록하여 불법무기 자진신고 현황과 추이를 분석하고, 무기류 안전관리 및 불법무기 근절을 위한 정책 수립에 기여한다. 경찰청은 이를 통해 자진신고의 연도별 변화를 파악하고, 효율적인 불법무기 관리 및 예방 대책 수립에 활용한다. 데이터는 공공데이터포털을 통해 개방되며, 불법무기 연구 및 정책 개발의 참고자료로 제공된다. 본 자료는 공공안전 확보와 무기류 안전 관리 강화를 위한 기반자료로 의미를 가진다.
