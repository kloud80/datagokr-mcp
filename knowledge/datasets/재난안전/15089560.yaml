description_portal: 해당 데이터는 소방청이 전국 각지에서 운영하는 이동형 소방안전체험차량의 운영 실적과 현황을 집계한 자료입니다. 소방안전체험차량은 화재, 지진, 연기, 심폐소생술(CPR) 등 다양한 재난 상황을 실제와 유사하게 체험할 수 있도록 제작된 특수차량으로, 학교, 공공기관, 지역축제 등에서 시민을 대상으로 운영됩니다.이 데이터에는 지역소방본부, 소방안전체험차량 대수, 소방안전체험차량소방관서, 체험인원수가 포함됩니다. 이를 통해 소방본부별 소방안전교육 참여가 얼마나 이루어졌는지 파악할 수 있고, 지역별 안전체험 수요가 높은 지역을 분석할 수 있습니다.소방안전 체험차량 운영 현황에 대한 데이터 입니다.제공하는 항목은 에 대한 정보를 제공합니다.
