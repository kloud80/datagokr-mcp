description_portal: 한국산업안전보건공단에서 제공하는 화학 설비 및 기구 정보에 대한 데이터로 민간 위탁 사업과 관련하여지원년도, 업종, 생산품, 주요설비명, 설비용량규격, 화학설비단위명, 설비수 등에 대한 내용을 확인하실 수 있습니다.*산업안전보건기준에 따른 화학설비 종류가. 반응기ㆍ혼합조 등 화학물질 반응 또는 혼합장치나. 증류탑ㆍ흡수탑ㆍ추출탑ㆍ감압탑 등 화학물질 분리장치다. 저장탱크ㆍ계량탱크ㆍ호퍼ㆍ사일로 등 화학물질 저장설비 또는 계량설비라. 응축기ㆍ냉각기ㆍ가열기ㆍ증발기 등 열교환기류마. 고로 등 점화기를 직접 사용하는 열교환기류바. 캘린더(calender)ㆍ혼합기ㆍ발포기ㆍ인쇄기ㆍ압출기 등 화학제품 가공설비사. 분쇄기ㆍ분체분리기ㆍ용융기 등 분체화학물질 취급장치아. 결정조ㆍ유동탑ㆍ탈습기ㆍ건조기 등 분체화학물질 분리장치자. 펌프류ㆍ압축기ㆍ이젝터(ejector) 등의 화학물질 이송 또는 압축설비
