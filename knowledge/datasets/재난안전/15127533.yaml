summary_user: 경상북도 영천시의 가로등 분전함을 한 건씩 담은 파일로, 분전함 아이디·이름, 행정동, 주소, 위도·경도를 개별 시설 단위로 기록한다. 시설 관리자나 분석가가 영천시 어느 동에 가로등 분전함이 얼마나 있는지, 특정 지점 근처 분전함이 어디인지 확인하는 데 쓴다. 전역 조인 키는 없으므로 행정동 이름이나 좌표 근접성으로 보안등·CCTV 같은 다른 방범 인프라 데이터와 맞춰 쓴다.
description_portal: 이 데이터는 경상북도 영천시의 가로등 분전함 현황을 상세하게 기록한 자료입니다. 영천시 내 각 행정동 별로 위치 정보, 분전함 이름, 위도와 경도 좌표, 주소, 교차로명 등 다양한 정보를 포함하고 있으며, 이를 통해 지역 내 전력 공급 및 유지보수 업무의 효율성을 높일 수 있습니다. 데이터는 분전함의 위치를 정확하게 파악할 수 있도록 위도와 경도 좌표를 제공하며, 주소와 교차로명 등 상세 위치 정보도 함께 수록되어 있어 사용자들이 쉽게 찾고 활용할 수 있습니다. 다만 가로등의 운영 특성 상 정확한 가로등 분전함의 위치는 제공이 되지 않을 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 건설과로 연락주시기 바랍니다.
