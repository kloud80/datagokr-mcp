description_portal: 본 데이터는 한국승강기안전공단의 안전검사 업무 규모를 월 단위로 파악하기 위해, 접수년도·접수월 기준으로 검사접수 수수료와 접수 승강기 대수를 집계한 내역입니다. 제공 항목은 ①접수년도 ②접수월 ③수수료(원) ④승강기대수(해당 월 접수된 설비 수) ⑤등록일자(시스템 반영일)로 구성됩니다. 동일 월에 복수 행이 존재할 수 있으며, 이는 내부 집계 단위(지사/센터, 검사종류, 회계분개 등)별 분리 기재 또는 정정 반영에 따른 것입니다. 자료는 ‘접수’ 시점을 기준으로 산출되므로 환불·취소·감액 등 사후 변동은 별도 자료(검사 환불 내역, 지로 입금 처리내역, 세금계산서 발행내역 등)와 교차 확인이 필요합니다. 활용 예시는 연·월별 접수 추이 및 성수기 분석, 검사유형·지역별 업무량 산정, 수입 예측과 예산 수립, 민원·인력 배치 최적화 등입니다. 개인정보 및 개별 사업자 식별정보는 포함하지 않으며, 공단이 관리하는 주요 검사유형(완성·정기·수시·연장·정밀 등)을 포괄합니다.
