summary_user: 해양경찰청 해양안전통신국 송수신소와 해상교통문자방송(Navtex) 송신소의 위치를 지역·송수신소명·주소 단위로 담은 소규모 목록 파일(csv 386바이트)로, 전국 범위의 개별 시설 주소를 담는다. 수색·구조 담당자나 선박 운항 계획을 세우는 사람이 "이 해역에서 가장 가까운 조난 통신 거점은 어디인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명이나 주소를 기준으로 맞추거나 같은 기관의 파출소·인명구조함 위치 데이터와 이름으로 대조해 이어 쓴다.
description_portal: 해양에서 발생하는 조난 신호를 신속하게 청취하고 대응 통신을 수행할 수 있는 해양안전통신국 송수신소와, 항해 중인 선박에게 안전 정보를 전달하기 위한 해상교통문자방송(Navtex) 송신소의 위치 정보를 제공합니다. 이를 통해 조난 상황 발생 시 어느 지역에서 신호 수신 및 교신이 가능한지 명확히 파악할 수 있으며, 구조 대응 기관과 선박이 가장 가까운 통신 거점을 빠르게 확인해 효과적인 비상 통신 체계를 구축할 수 있도록 지원합니다. 이러한 정보는 해상 안전 관리, 수색·구조 활동, 선박 운항 계획 수립 등 다양한 실무에서 활용 가치가 높습니다.
