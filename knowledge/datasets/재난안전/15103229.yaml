summary_user: 한국전기안전공사가 2024년에 소유자·점유자 요청으로 실시한 자가용전기설비 안전진단 결과를 민원신청 건별로 담은 전국 단위 파일로, 사업소·점검주기·업종명·점검년월·점검결과를 제공한다. 분석가가 어떤 업종의 자가용전기설비 진단에서 부적합 결과가 많이 나오는지, 사업소별 진단 실적이 어떻게 분포하는지를 볼 때 쓴다. 사업소 코드(kesco_office_cd)와 민원신청번호(kesco_civil_appl_no)를 키로 한국전기안전공사의 다른 점검·검사 데이터와 이어 쓰며, 주소나 좌표가 없는 비공간 데이터라 지역 데이터와 직접 연결하는 키는 없다.
description_portal: 한국전기안전공사에서는 자가용전기설비에 대한 안전진단을 수행합니다. 안전진단은 전기설비 소유자 또는 점유자가 해당 전기설비에 대하여 전문적이고 객관적인 안전진단을 받고자 요청하여 수행하는 업무이며, 전기설비 고장이나 사고와 관련하여 컨설팅 차원에서 우리공사에 안전진단을 요청하여 수행하는 업무입니다.법정근거는 전기안전관리법 제33조제10호에 해당됩니다.이 데이터는 2024년 한국전기안전공사에서 자가용안전진단을 실시한 결과를 사업소, 민원신청번호, 점검주기, 업종명, 점검년월, 점검결과로 제공하는 데이터입니다.
