summary_user: 재난안전데이터 공유플랫폼의 재난 대응용 시설자원을 자원 한 건 단위로 담는 전국 범위 데이터로, 시설명·건물 총면적·수용 가능량과 현재 수용량·대표자와 관리자 연락처·도로명과 지번 주소·급수·급식·화장실 등 편의시설 보유 여부를 포함한다. 지자체 재난 담당자나 분석가가 "우리 지역에서 이재민을 더 받을 수 있는 시설이 어디이고 남은 수용 여력은 얼마인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 매칭, 도로명주소코드(ROAD_NM_ADDR_CD)나 관리 행정동·법정동 코드, 기관코드 같은 코드 매핑으로만 이어 쓰며, 같은 분류의 대피·구호시설이나 재난 위험지역 데이터와 함께 본다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 시설자원 정보로, 자원아이디, 자원소분류코드, 시설명, 건물총면적, 수옹가능량, 현재수용량, 연락처, 도로명주소, 상세주소 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
