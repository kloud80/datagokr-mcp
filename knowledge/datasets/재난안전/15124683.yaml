summary_user: 인천광역시 영종구(포털 설명상 중구 건축과 취합) 관내 기계설비 성능점검 대상 건축물을 건물 단위로 담은 목록으로, 연면적 1만㎡ 이상 1.5만㎡ 미만 건축물과 500세대 이상 1000세대 미만 공동주택의 용도·건물명·도로명주소·우편번호·연면적을 기록한다. 건물 관리자나 기계설비 유지관리 업체가 '우리 건물이 올해 성능점검 대상에 들어가는가'를 확인하거나, 지역 점검 수요를 파악하는 데 쓴다. 전역 조인 키는 없으므로 도로명주소나 건물명을 기준으로 건축물대장 등 다른 시설 안전 데이터와 맞춰 이어 쓴다.
description_portal: 인천광역시 중구에 소재하는 기계설비 성능점검 대상 현황에 대한 데이터입니다. 파일 데이터에 포함된 내용은 기계설비 성능점검 대상에 해당하는  연면적 1만제곱미터 이상 1.5만제곱미터 미만 건축물과 500세대 이상 1000세대 미만 공동주택입니다. 파일내용은 건축물용도, 건물명, 도로명주소, 우편번호, 연면적(제곱미터)이 기록되어 있습니다.데이터 기준일자는 2025년 11월 27일이며, 차기등록예정일은 2026년 11월입니다.  인천광역시 중구 건축과에서 취합하여 작성하였음을 안내드립니다.
