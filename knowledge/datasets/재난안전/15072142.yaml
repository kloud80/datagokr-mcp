summary_user: 서울특별시 119종합방재전산정보시스템에 등록된 소방대상물을 한 건씩 좌표(X, Y, ITRF2000)와 주소·명칭·용도·지상층수 등과 함께 담은 공간정보 원천 데이터로, 범위는 서울 시 전역이다. 소방·안전 분석가나 자치구 담당자가 '우리 구의 특정소방대상물은 어디에 몰려 있고, 가까운 119안전센터나 소방용수와는 얼마나 떨어져 있나' 같은 질문에 지도 위에서 답할 때 쓴다. 전역 공통 조인 키는 확인되지 않아 다른 데이터와는 좌표 기반 공간 결합이나 주소(NEWADDR)·명칭 매핑으로 이어 쓰며, 같은 세부 부문의 화재 발생·소방용수·119안전센터 위치 데이터와 함께 보는 것이 자연스럽다.
limits: 내려받으려면 서울 열린데이터광장(data.seoul.go.kr)의 별도 인증키가 필요하며 공공데이터포털 활용신청과는 별개다. 실측 컬럼에 전역 조인 키가 없어 다른 기관 데이터와는 이름·코드 매핑이나 좌표로만 연결된다.
