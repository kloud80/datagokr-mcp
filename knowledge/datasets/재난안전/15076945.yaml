description_portal: '"수상레저기구의 등록 및 검사에 관한 법률"에 따라 실시되는 동력수상레저기구의 안전검사 현황에 대한 데이터 입니다.2006년~2025년 동안 안전검사 대행기관(한국해양교통안전공단(KOMSA), (사)한국수상레저안전협회, (사)한국수상레저안전연합회)에서 실시한 등록대상 동력수상레저기구 4종(모터보트, 고무보트, 수상오토바이, 세일링요트)에 관한 안전검사 실시 건수이며,등록대상이 아닌 카약, 카누, 서프보드 등 아닌 무동력 수상레저기구에 대한 정보는 없습니다. 법령상 등록 및 검사의 의무가 있는 수상레저기구에 대한 내용은  해당법령 참고하시기 바랍니다.해당 통계는 해마다 집계중이며, 연말 기준으로 작성된 통계 입니다. 해양수산부에서 등록하는 기타선(플레저보트)와는 별개로 선박검사에 관한 사항은 포함되지 않습니다.'
