summary_user: 세종특별자치시에 설치된 스마트 그늘막을 한 개씩 담은 시설 목록 파일로, 설치장소명·높이·펼침지름·설치일자·도로명/지번 주소·위도·경도를 개별 시설 단위로 담는다(포털 설명상 총 227개). 시민이나 분석가가 "폭염 때 우리 동네 횡단보도 근처 어디에 그늘막이 있나"를 확인하거나, 읍면동별 설치 분포를 지도로 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도 좌표나 주소 문자열로 공간 매칭해 무더위쉼터 등 다른 대피·구호시설 목록과 함께 본다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 데이터와 붙이려면 주소·좌표를 직접 매칭해야 한다. 범위는 세종특별자치시 한 곳뿐이라 다른 시도 그늘막과 비교할 수 없다.
