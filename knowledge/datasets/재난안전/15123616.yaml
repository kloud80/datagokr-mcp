summary_user: 구미시 안에서 산사태취약지역으로 지정된 지점을 필지 단위로 한 줄씩 담은 원천 목록으로, 지번·위도·경도와 취약지역 유형, 지정 사유, 토지 소유 구분을 담는다. 주민이나 부동산 사업자가 '이 산 밑 필지가 산사태취약지역에 들어가는가'를 확인하거나, 지자체 담당자가 사면 보강·사방댐 같은 예방 사업을 국공유지와 사유지로 나눠 계획할 때 쓴다. 전역 조인 키가 없으므로 지번 문자열이나 위도·경도 좌표로 지적도·토지이용규제 레이어, 다른 재해위험지구·급경사지 자료와 공간 매칭해 이어 쓴다.
description_portal: 경상북도 구미시의 산사태취약지역지정현황 데이터는 산사태 발생 가능성이 있는 지역을 선제적으로 파악하고 체계적으로 관리하기 위해 구축된 공공자료입니다.해당 데이터에는 연번, 지번과 위도·경도, 산사태의 위험 유형을 나타내는 취약지역유형, 해당 지점이 왜 위험지역으로 지정되었는지를 설명하는 지정사유, 그리고 해당 토지의 소유 형태 정보가 포함되어 있습니다. 이러한 자료는 지자체가 재해에 취약한 지역을 효율적으로 모니터링하고, 사면 보강, 사방댐 설치 등 필요한 예방 대책을 수립하는 데 중요한 근거가 됩니다. 특히 소유별 정보는 공공부문과 민간부문 간의 관리 책임을 명확히 구분하는 데 활용되며, 예산 투입이나 유지관리 조치를 결정하는 기준이 됩니다. 결과적으로 이 데이터는 지역 주민의 안전을 보호하고, 산림재해에 대한 사전 대응체계를 마련하는 데 필수적인 기초자료로 활용됩니다.
