summary_user: 재해구호기금의 사용 내역을 집행 건별로 담으며, 기금사용일련번호·연도·재난유형·재난일련번호·지역코드·집행금액·집행일자로 한 건을 이룬다. 재난 담당자나 분석가가 특정 재난에 구호기금이 어느 지역에 언제 얼마나 집행됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 공유플랫폼의 재난 정보와 재난일련번호(MSTN_SN)나 지역코드·재난유형코드를 이름·코드 매핑으로 맞춰야 이어 쓸 수 있다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 재해구호기금 정보로, 기금사용일련번호, 연도, 재난유형코드, 재난일련번호, 지역코드, 집행금액, 집행일자 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
