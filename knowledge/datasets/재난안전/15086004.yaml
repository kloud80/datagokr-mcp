description_portal: 해당 데이터는 경기도북부경찰청 관내에서 발생한 성매매 범죄 단속 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 경기북부경찰청 소속 경찰서(의정부, 고양, 일산동부, 일산서부, 남양주남부, 남양주북부, 파주, 양주, 동두천, 구리, 포천, 가평, 연천)에서 2016년부터 2025년까지 발생한 성매매 범죄 단속 건수에 대한 데이터를 경찰서 별로 구분하여 제공하고 있어, 각 경찰서의 성매매 범죄 단속 현황을 파악할 수 있습니다. 이 자료는 성매매 범죄와 관련된 경찰 활동을 보여주며, 해당 현황은 경기북부경찰청 범죄예방대응과에서 제공합니다.
