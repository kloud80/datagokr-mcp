summary_user: 울산광역시 울주군의 방사능 재난 대비 구호소를 개별 시설 단위로 담으며, 포털 설명상 구호소 이름·16방위 기준으로 주소·전화번호·원전으로부터 거리·수용인원·공간정보(주소·좌표)를 조회한다. 원전 사고 시 울주군 주민이 "우리 마을 방향의 가장 가까운 구호소는 어디이고 몇 명을 수용하나"를 확인하거나, 분석가가 방위별 인구 대비 대피 수용력을 따져 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 대피·구호시설 데이터와는 구호소 이름·주소나 좌표를 맞춰 붙여야 한다.
description_portal: 울산광역시 울주군_방사능 방재정보 구호소 조회 서비스는 방사능 재난이라는 특수하고 위험한 상황에 대비하기 위해 구축된 중요한 공공 데이터 자원이다.이 데이터는 주민의 생명과 안전을 최우선으로 하여, 신속한 대피와 체계적인 방재 대응을 가능하게 하는 핵심 기반 정보로 활용될 수 있습니다.각 구호소별로 수용 가능한 인원수나 시설 규모가 포함되어 있어, 인구 대비 대피 계획을 수립하는 기초 자료가 됩니다.본 API에서 제공하는 데이터는 다음과 같습니다.구호소의 이름, 16방위 코드 등을 기준으로 구호소 주소, 전화번호, 원전으로부터 거리, 수용인원, 공간정보 등의 조회
