summary_user: 전국 우수 어린이놀이시설로 지정된 놀이시설을 시설 한 곳 단위로 담는다. 놀이시설 일련번호·명칭, 지역명과 지역분류코드, 우수시설 지정일로 보이는 항목, 관리 기관명이 함께 들어 있다. 부모나 지자체 담당자가 "우리 지역에 우수 어린이놀이시설로 지정된 곳이 어디인가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 시설 안전 데이터와는 놀이시설명·지역명(RGN_NM)이나 기관 코드로 맞춰 이어 쓴다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 재난안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 전국우수어린이놀이시설 정보입니다.
