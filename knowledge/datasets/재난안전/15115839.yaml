description_portal: 경찰청이 제공하는 2017~2025년 연도별 요일별 교통사고 건수 통계로, 일요일부터 토요일까지 요일별 사고 발생 규모와 연도별 변화를 비교할 수 있다. 전반적으로 2017~2019년에는 금·토요일 사고가 상대적으로 많았으나, 2020년 이후 전체 사고 건수가 감소하면서 대부분 요일에서 감소세가 나타난다. 2025년 기준으로는 수요일 29,489건, 월요일 28,975건, 금요일 28,193건 순으로 많고, 일요일은 20,241건으로 가장 낮다. 요일별 교통량, 출퇴근·주말 이동 특성, 교통안전 취약 시간대 분석 및 맞춤형 사고 예방대책 수립에 활용할 수 있다.
