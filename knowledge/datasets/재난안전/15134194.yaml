description_portal: 전북특별자치도 군산시의 기계설비 성능점검 대상 건축물 현황 정보입니다.성능 점검 대상인 동 당 면적 10,000㎡ 이상의 군산시 내 건축물 중 창고 시설은 제외한 건축물의 목록이며 500세대 이상의 공동 주택을 포함하고 있습니다.본 자료는 연번, 건축물명, 도로명주소, 연면적(건축물), 주용도, 기준일로 구성된 데이터입니다.기준일은 8월 16일이며 최근 준공된 건축물은 준공일이 기준일이며 기준일로부터 1년이내 성능점검을 받아야합니다.국토부 고시에 따라 대상 건축물은 변경될 수 있으며, 이 경우 데이터는 업데이트 예정입니다.그 밖의 자세한 사항은 기계설비법을 참고해주시기 바랍니다.
