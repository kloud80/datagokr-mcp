summary_user: 서울특별시가 산사태 발생 때 쓰는 임시대피소를 한 곳씩 담은 건별 원천 파일로, 대피장소·주소, 대피가능 인원수, 응급시설 내용, 담당부서와 전화번호를 담는다. 주민이나 자치구 재난 담당자가 '우리 동네 산사태 위험 때 어느 대피소로 가고, 몇 명까지 수용되며 누구에게 연락하나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 보유기관지역코드나 대피소주소를 기준으로 다른 대피시설·산사태 위험지역 데이터와 이름·주소 매칭으로 잇는다.
