description_portal: 국토안전관리원에서 제공하는 위탁관리대상 사장교 교량의 풍향풍속계 설치 현황 데이터입니다.총 60개의 풍향풍속계가 설치되어 있으며, 총 24개의 사장교에 관한 정보를 포함합니다.데이터는 연변, 교량명, 형식, 센서명, 설치위치, 측정방식의 열로 구성되어 있습니다.1개의 센서를 보유하는 곳은 한 곳 뿐이며, 한 곳을 제외한 모든 교량은 2~3개의 풍향풍속계 센서가 설치되어 있습니다.측정방식은 프로펠러형과 초음파형 두가지로 구분되며, 프로펠러형이 주를 이루고, 9개의 풍향풍속계 센서만이 초음파로 측정합니다.
