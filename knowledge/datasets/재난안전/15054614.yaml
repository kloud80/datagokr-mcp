summary_user: 광산소방서가 보유한 개인안전장비(방화복·방화헬멧·방화장갑·방화신발·방화두건·면체·용기·보조마스크·등지게 등)를 품목별 한 행으로 정리해 보유기준, 보유수량, 보유율을 담은 작은 집계 표(CSV 374바이트)이다. 소방행정 분석가나 시민이 '이 소방서가 공기호흡기 용기 같은 장비를 기준만큼 갖추고 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 소방서의 같은 현황표와는 품목명(구분)을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와 코드로 바로 결합할 수 없고, 품목 이름 매칭이나 같은 기관 기준으로만 연결된다. 소방서 하나의 비공간 집계표라 대원별·안전센터별 배분이나 장비의 노후 상태는 알 수 없다.
