description_portal: 본 데이터는 광주광역시 광산소방서의 개인안전장비 보유현황을 정리한 자료입니다. 연번, 구분, 보유기준, 보유수량, 보유율(퍼센트), 데이터기준일자로 구성되어 있습니다.주요 장비별 현황을 살펴보면, 방화복은 보유기준 1,384벌 대비 1,952벌을 보유하여 141%의 보유율을 보이고 있으며, 방화헬멧은 218개 기준 295개(135%), 방화장갑과 방화신발, 방화두건, 면체는 각각 기준 대비 123%~183%의 높은 보유율을 기록하고 있습니다. 반면 용기의 경우 보유기준 461개 대비 435개를 보유하여 보유율 94%를 나타내고 있습니다. 그 외 보조마스크와 등지게는 각각 144%의 보유율을 유지하고 있습니다.모든 정보는 2026년 4월 29일을 기준으로 정리된 자료로, 각 품목별 정확한 보유 상태를 표 형식으로 확인하실 수 있습니다.
