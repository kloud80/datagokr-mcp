summary_user: 인천광역시 계양구 관내 이재민 임시주거시설을 시설 한 곳당 한 행으로 담은 목록으로, 구분·행정동·시설명·주소·면적·수용인원·위치상세·전화번호를 담는다. 재난으로 집을 잃은 주민이나 구청·구호 담당자가 "우리 동에서 이재민을 몇 명까지, 어느 시설에 수용할 수 있나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 행정동 이름이나 주소를 기준으로 다른 대피·구호시설 목록이나 행정동 단위 인구 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 인천광역시 계양구 관내 이재민 임시주거시설 현황을 상세히 담고 있습니다. 포함된 항목은 연번, 구분, 행정동, 시설명, 주소, 면적, 수용인원, 전화번호 등으로, 각 시설의 위치와 규모, 수용 가능 인원 및 연락처 정보를 제공합니다. 이 데이터는 재난 상황 발생 시 신속한 지원과 임시 주거 공간 확보를 위한 중요한 자료이며, 행정기관에서 주기적으로 갱신하여 최신 정보를 유지합니다. CSV 형식으로 제공되어 다양한 분석 및 긴급 대응 체계 구축에 활용 가능하며, 공공데이터포털을 통해 누구나 무료로 다운로드할 수 있습니다. 재난관리와 주민 안전 강화를 위한 필수 데이터입니다.
