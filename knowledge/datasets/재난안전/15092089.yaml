summary_user: 전국 시도청별 경찰서(및 경찰청)마다 경찰관 정원 수를 한 행씩 담은 집계 파일로, 포털 설명상 2023년 12월 기준이며 연도·시도청·경찰서·정원 4개 항목으로 구성된다. 분석가나 지자체 담당자가 '우리 지역 경찰서의 정원이 같은 시도 안 다른 경찰서보다 많은가 적은가'처럼 시도·경찰서별 인력 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 경찰관서 위치나 지역별 범죄 발생·112신고 데이터와는 시도청·경찰서 이름을 맞춰 연결해야 한다.
description_portal: 제공된 데이터는 2023년 12월을 기준으로 전국 시도청 내 각 경찰서 및 경찰청의 경찰관 정원 현황을 보여줍니다.시도청 정보와 각 관서명을 확인할 수 있습니다. 또한 해당 관서의 총 경찰관 정원 수를 나타냅니다.이 데이터는 특정 시점의 시도청별 경찰 인력 분포를 파악하는 데 유용한 자료입니다. 각 지역 경찰서의 규모를 비교 분석하여 치안 수요에 따른 인력 배치 현황을 짐작할 수 있으며, 향후 인력 운용 계획 수립의 기초 자료로 활용될 수 있습니다. 특히, 시도 내에서도 경찰서별 관할 면적, 인구 밀도, 범죄 발생률 등을 고려한 인력 배분 상황을 간접적으로나마 이해하는 데 도움이 될 것입니다.
