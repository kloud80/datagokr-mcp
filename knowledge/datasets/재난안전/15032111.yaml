summary_user: 광주광역시 119특수대응단 산악구조대가 무등산국립공원에서 출동한 산악사고를 출동 건별로 담은 파일로, 출동일자·장소·사고내용 및 조치사항·인명피해(명)를 기록한다. 등산객이나 안전관리 분석가가 무등산에서 어느 장소·시기에 사고가 잦고 인명피해가 얼마나 나는지 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 장소명 같은 이름 매칭이나 같은 기관 자료 기준으로만 이어 쓴다.
description_portal: 광주광역시 119특수대응단 소속 산악구조대의 무등산 국립공원 산악사고 출동 현황으로 출동일자, 장소, 사고내용, 인명피해 등에 관한 데이터를 제공합니다.산악구조대는 무등산국립공원 원효분소 사무소 인근에 위치해 있으며, 무등산국립공원 산악사고를 비롯하여 전반적인 안전관리 역할을 담당하고 있습니다.데이터는 2016.1.1.부터 작성되어있으며 데이터기준일자는 2026. 1. 1.입니다. 데이터 업데이트 주기는 매년 입니다. 더 궁금하신 사항은 119특수대응단 산악구조대로 연락주시면 친절히 답변해드리겠습니다.
