summary_user: 경찰청 CCTV위치도 가운데 교통CCTV의 위치(도형)와 설치 속성 정보를 조회하는 외부 API로, 범위는 전국이다. 도로 위 교통CCTV가 어디에 설치돼 있는지 파악하려는 분석가나 서비스 개발자가 쓰며, 영상 자체는 이 데이터에 없다. 실측 컬럼(locate, cctvname)에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 영상정보는 제공하지 않고 CCTV의 위치와 설치 정보만 담으며, 호출에는 포털 활용신청과 별개로 vworld.kr 인증키(query 파라미터 key)가 필요하다. 전역 조인 키가 없어 다른 데이터와 결합할 때 이름·코드 매핑 작업이 필요하다.
