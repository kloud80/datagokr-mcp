summary_user: 대구광역시 남구의 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명/지번주소·위도·경도와 급수 규모(톤)·심도(m), 그리고 정부지원·자체·민간시설 구분을 담는다. 남구 주민이 단수나 비상사태 때 가장 가까운 급수시설이 어디인지 찾거나, 재난 담당자가 동네별 비상 식수 공급 능력을 점검하는 데 쓴다. 전역 조인 키는 없어서 다른 대피·구호시설 데이터와는 주소나 위도·경도 좌표로 위치를 맞춰 연결한다.
limits: 남구 한 개 시군구만 다루므로 대구 전체나 다른 지역 급수시설은 담지 않는다. 행정구역 코드 같은 공통 키가 없어서 다른 데이터와는 시설명·주소 문자열이나 좌표로만 이어야 한다.
