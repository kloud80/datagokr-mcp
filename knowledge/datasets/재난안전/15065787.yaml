description_portal: 이 데이터는 일회성 데이터로  2020년 기준 경찰청에서 집계한 아동안전 수호천사 인원별 운영 현황을 제공하는 공공데이터입니다. 야쿠르트 배달원, 집배원, 모범택시기사, 태권도 사범 등 다양한 직군의 인원들이 자발적으로 참여하는 아동 보호 활동 인원이 구분되어 수록되어 있으며, 지역사회 기반 아동 보호 인력의 규모와 직업군별 분포를 파악할 수 있습니다. 이 데이터는 경찰의 민간 협력형 치안 인력 운영 전략 수립, 지자체의 아동 안전망 보완 정책, 연구기관의 사회적 보호체계 분석, 공공기관의 아동 대상 보호 프로그램 운영 실태 진단 등에 활용됩니다.
