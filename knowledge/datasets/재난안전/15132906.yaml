summary_user: 전주시 안에서 소방자동차 전용구역 설치 의무가 법적으로 적용되는 공동주택(아파트) 단지를 단지별 한 행으로 담은 목록 파일로, 단지명·도로명/지번주소·관할소방서·건축허가 신청일·주택건설사업계획 승인 신청일과 좌표(X·Y)를 포함한다(CSV 약 2KB 규모의 소량 파일). 소방 당국이나 입주민·관리주체가 '우리 단지가 소방차 전용구역 설치 의무 대상인가, 관할 소방서는 어디인가'를 확인하거나, 대상 단지를 지도에 올려 재난 대응 계획을 세우는 데 쓴다. 전역 조인 키는 없으므로 도로명주소·법정동명·행정동명 같은 주소 문자열이나 좌표로 소방용수·화재 발생·119안전센터 위치 데이터 등 다른 소방 데이터와 맞춰 쓴다.
limits: 표준 코드(건물관리번호·법정동코드 등) 같은 전역 조인 키가 실측 컬럼에 없어 다른 데이터와는 이름·주소 매칭이나 좌표로만 연결된다. 범위는 전주시의 법률 적용 대상 단지에 한정되며, 실제 전용구역 설치·단속 여부는 담지 않는다.
