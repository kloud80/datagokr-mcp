description_portal: 해당 자료는 의왕시 생활안전 융합분석을 위해 구축된 시간대별 생활인구 통계 데이터로, 특정 시점의 거주·체류 인구를 기반으로 생활안전 취약성을 분석할 수 있도록 구성된 자료입니다. 월별 변화와 시간대별 생활인구 수를 제공하며, 평일·주말 구분은 물론 성별 및 연령대별 인구 특성까지 세분화해 제시합니다. 이를 통해 특정 시간대에 생활권 내 인구가 집중되는 패턴을 파악하여 생활안전시설물 확충이나 안전취약시간대 선정 등에 활용할 수 있습니다. 해당 데이터는 2022년 기준 생활안전융합데이터 중 시간대 기반 인구 특화자료로 참고용으로 활용하는 것이 적합합니다.
