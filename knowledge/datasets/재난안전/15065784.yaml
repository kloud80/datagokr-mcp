description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2020년 기준 경찰청에서 집계한 아동안전지킴이집의 사업장 유형별 현황을 제공하는 공공데이터입니다. 24시 편의점, 약국, 문구점, 상가 등 다양한 사업장을 기준으로 지킴이집 지정 수량을 파악할 수 있으며, 이는 실생활에서 아동이 위급 시 도움을 요청할 수 있는 거점의 민간 협력 인프라 현황을 보여줍니다. 이 데이터는 경찰의 민간연계 아동보호 전략 수립, 지자체의 아동안전망 확대 사업 기획, 연구기관의 생활권 보호체계 분석, 공공기관의 아동 대상 위험예방 홍보 전략 수립 등에 활용됩니다.
