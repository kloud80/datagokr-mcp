description_portal: 서울지방경찰청 치안통계를 기반으로 112 신고 접수 후 5분 내 현장 도착률(2009년 이전) 현황을 제공하는 자료이다. 연도별 112 신고 접수 건수와 5분 내 현장에 도착한 건수를 집계하여 신속 대응 수준을 나타내는 도착률(%)을 제공한다. 본 자료를 통해 경찰의 현장 출동 대응 속도와 치안 서비스 수준의 변화를 분석할 수 있으며, 긴급상황 대응체계 운영 성과를 평가하는 데 활용할 수 있다. 또한 치안행정 정책 수립, 출동체계 개선, 경찰 인력 및 장비 배치 효율성 분석, 시민 안전서비스 향상, 지역사회 안전도 평가 등을 위한 기초 통계자료로 활용 가능하다.키워드 20개
