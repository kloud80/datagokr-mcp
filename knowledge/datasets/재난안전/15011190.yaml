summary_user: 경기도 시군별로 사용연월(사용기간)마다 염화칼슘·소금·친환경제설제·모래 사용량(톤 또는 ㎥)을 담은 집계 데이터이며, 담당 부서명과 데이터 수집일자가 함께 들어 있다. 도로관리 담당자나 분석가가 "어느 시군이 겨울마다 염화칼슘을 얼마나 쓰고, 친환경제설제 비중은 늘고 있는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)을 이름으로 맞추거나 같은 기관 코드로만 연결한다.
description_portal: '이 데이터는 각 시군의 제설작업을 위한 제설제 사용 현황을 나타내며, 사용연월(사용기간)을 기준으로 염화칼슘, 소금, 친환경제설제, 모래의 사용량(단위: 톤 또는 ㎥)을 포함하고 있습니다. 데이터에는 시군명, 관련 부서명, 비고, 데이터 수집일자 항목이 포함되어 있어 지역별, 연도별 제설 자재 사용 추세를 분석할 수 있습니다. 이 데이터는 겨울철 도로 안전 확보 및 효율적인 제설 자원 배분 정책 수립에 활용될 수 있으며, 특히 친환경제설제 사용량 분석을 통해 환경 영향을 고려한 도로관리 방안을 검토하는 데 유용합니다.'
