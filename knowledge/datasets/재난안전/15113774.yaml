summary_user: 충청남도 예산군 안의 임시주거시설(옛 이재민 대피시설)·지진 대피소·민방위 대피소를 시설 한 곳당 한 행으로 담은 파일로, 시설명·구분·주소·면적·수용인원을 담는다(약 10KB CSV). 주민이나 지역 앱 개발자가 "예산군에서 우리 집 가까운 대피소는 어디이고 몇 명까지 들어가나"를 확인하거나, 재난 대비 훈련·민방위 교육 자료를 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 시설명을 매핑하거나 같은 기관 기준으로만 이어 쓰며, 주소를 지오코딩해 재난 위험지역·다른 시군 대피소 자료와 지도 위에서 겹쳐 본다.
description_portal: 임시주거시설(구)이재민 대피시설), 지진 대피소, 민방위 대피소에 대한 시설명, 구분, 주소, 좌표값 면적, 수용인원을 포함합니다.이 데이터는 충청남도 예산군 내 재난 발생 시 주민이 긴급하게 대피할 수 있는 지정 대피소의 위치 및 주요 정보를 제공합니다.대피소는 지진, 태풍, 화재 등 자연재해나 사회재난 발생 시 군민의 생명과 안전을 보호하기 위해 지정된 공공시설입니다데이터를 통해 주민은 가장 가까운 대피소를 사전에 확인하거나, 민간 지도 서비스와 연계하여 대피 안내 서비스를 구축할 수 있습니다.이 데이터는 재난 대비 훈련, 민방위 교육, 비상대응 매뉴얼 작성 시 활용됩니다.
