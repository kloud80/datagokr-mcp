summary_user: 서울시가 고농도 미세먼지 때 시민이 일시 대피해 실내에 머무를 수 있도록 지정한 시설을 시설 1곳당 한 행으로 담은 목록이며, 행정동·시설명·주소·시설유형·이용가능인원·면적·평일/주말 이용시간·회원제 여부·좌표를 포함한다. 시민이 '미세먼지가 심한 날 우리 동네에서 지금 누구나 들어갈 수 있는 대피소는 어디인가'를 찾거나, 분석가가 행정동별 수용 여력과 대피소 접근성을 따져 추가 설치가 필요한 지역을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름·주소 매칭이나 좌표(XCRD·YCRD) 기반 공간 결합으로 이어 쓰며, 무더위·한파쉼터 등 다른 대피·구호시설 목록과 함께 놓고 보는 용도에 맞다.
description_portal: 서울시 미세먼지대피소 데이터는 고농도 미세먼지 발생 시 시민들이 일시적으로 대피하여 실내 활동을 할 수 있는 시설 정보를 제공하는 자료입니다. 행정동 이름과 시설 이름, 주소를 통해 대피소의 위치를 명확히 확인할 수 있으며, 시설유형은 복지시설, 공공청사, 주민센터 등 어떤 성격의 공간인지를 구분하는 데 활용됩니다. 이용가능인원과 면적 정보는 시설의 수용 규모와 혼잡도 예상, 지역별 대피 여력 분석에 중요하게 사용됩니다. 평일이용시간과 주말이용시간은 실제 이용 가능 시간대를 알려주어 시민들이 상황에 맞게 대피소를 선택할 수 있도록 돕고, 회원제 여부는 누구나 이용 가능한 개방형 시설인지, 특정 회원만 이용 가능한지에 대한 판단 기준이 됩니다. X좌표와 Y좌표는 지도 서비스 및 공간 분석에 활용되어 미세먼지 취약지역 인근 대피소 분포 파악, 접근성 분석, 추가 설치 필요 지역 검토 등에 활용될 수 있습니다.
