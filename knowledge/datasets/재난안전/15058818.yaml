summary_user: 경기도 내 치안센터를 한 곳씩 담은 시설 목록으로, 시군명, 관할 경찰서, 치안센터 명칭, 지번·도로명 주소, 우편번호, WGS84 위도·경도를 개별 시설 단위로 제공한다. 우리 동네 가까운 치안센터가 어디인지 찾거나, 시군별 치안 인프라 분포를 보고 범죄예방·여성안심귀가 정책 대상 지역을 고르는 분석가가 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명으로 경기도 다른 데이터와 맞추거나, 좌표로 대피시설·소방 등 다른 안전시설 위치 데이터와 공간 결합해 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 치안센터의 현황을 제공합니다. 치안센터는 주민 밀착형 치안서비스를 제공하는 생활안전 기반 시설로, 경찰서 산하에 설치되어 여성안심귀가 등 특별치안활동을 지원하며, 범죄예방, 재난안전, 지역 치안환경 개선에 기여합니다. 데이터에는 경찰서명, 구분명, 명칭, 소재지주소(도로명 및 지번), 소재지우편번호, WGS84 위도·경도 좌표 등 상세한 기관 정보를 포함하고 있습니다. 이 데이터를 활용하여 지역별 치안 인프라 분포를 파악하고, 범죄예방 정책 수립, 여성 안전 정책 개발, 긴급상황 대응체계 구축, 도시계획 및 생활권 분석 등에 활용할 수 있습니다. 데이터 활용 시 치안센터 신설, 이전, 폐지 등 최신 행정정보를 반영하는 것이 필요합니다.
