summary_user: 부산광역시 영도구 관내 급경사지(옹벽·사면 등)를 한 곳씩 관리번호·급경사지명·시행청·소관부서·주소(시도~상세주소)와 재해위험도 평가등급·평가종류와 함께 담은 개별 목록이며, 4973바이트 규모의 작은 CSV 파일이다. 영도구 주민이나 안전 분석가가 '우리 동네 근처에 재해위험도 등급이 높은 급경사지가 어디 있나'를 확인하거나 우기 전 점검 대상을 추릴 때 쓴다. 전역 조인 키는 없어서 시군구·읍면동 이름이나 상세주소로 다른 급경사지·인명피해우려지역·대피시설 데이터와 맞추고, 주소를 지오코딩해 지도 레이어와 겹쳐 쓴다.
description_portal: 부산광역시 영도구 급경사지 정보 * 「급경사지 재해예방에 관한 법률」 제2조 및 같은법 시행령 제2조에서 정의하는 급경사지옹벽, 사면 등 인명피해 및 재산 피해 등이 발생할 수 있는 급경사지에 대해 재해 예방을 위한 안전점검을 실시하고, 관내 안전을 위해 급경사지 관련 데이터를 최신화 하고자함에 목적이 있음.연 2회 주요 급경사지를 안전점검하고, 인명피해 우려지역 및 붕괴위험지구로 지정하여, 안전을 위한 노력을 실시하며, 지속적인 감시, 감찰을 통해 안전관리에 최선의 노력을 다하며,그 관련 데이터를 최신화하여 등록하고자 함.
