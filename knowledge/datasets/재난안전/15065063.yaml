description_portal: 데이터는 2018년 12월 기준으로 전국 17개 시‧도의 취약계층 가구에 설치된 주택용 소방시설 보급 실적을 집계한 통계입니다. 주요 항목은 ▲구분(시‧도명), ▲총 보급대상 가구수, ▲보급 가구수, ▲보급률(%)로 구성되어 있으며, 이 데이터는 지자체별 보급 규모와 속도의 편차를 한눈에 보여주며, 당시 지역적 차이를 볼 수 있으며 특히 대규모 대상 지역은 절대 보급 가구 수는 많지만 비율은 낮게 나타나는 경향이 확인 할 수 있습니다. 이 자료는 취약계층 안전 정책의 균형성과 지역별 맞춤형 지원 필요성을 평가하는 기초자료로 활용될 수 있습니다.
