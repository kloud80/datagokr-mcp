description_portal: 생활안전교통국 여성안전기획과에서 제공하는 가정폭력 검거 및 조치 현황 통계입니다.제공된 표는 2017년부터 2024년까지 경찰청 생활안전교통국 여성안전기획과가 집계한 가정폭력 검거 및 조치 현황 통계입니다. 이 자료는 연도별 가정폭력 사건의 검거 건수, 총 검거 인원, 그리고 구속 인원, 불구속 인원, 가정보호사건으로 조치된 인원의 변화를 보여줍니다.표에 따르면 2019년 검거 건수와 총인원이 크게 증가했으나, 2020년 이후 다소 감소세를 보입니다. 특히 2022년부터 불구속 인원 수가 현저히 줄어들고, 2024년에는 검거 건수와 인원이 다시 감소한 것을 알 수 있습니다. 이는 가정폭력 사건의 처리 방식과 규모가 매년 변화하고 있음을 시사합니다.
