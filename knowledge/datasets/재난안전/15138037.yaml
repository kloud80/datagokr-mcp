description_portal: 본 자료는 한국승강기안전공단에서 운영하는 승강기 교육센터 웹사이트 내 게시판별 게시 현황을 집계한 데이터입니다. 교육센터는 승강기 안전과 관련된 다양한 교육과 소통 기능을 제공하는 온라인 플랫폼으로, 본 데이터에는 게시판별 제목, 최초 등록일자, 게시글 건수가 포함되어 있습니다. 이를 통해 공단이 제공하는 정보와 자료가 어떤 분야에 집중되어 있는지, 게시판별 이용 활성화 정도를 객관적으로 확인할 수 있습니다. 주요 항목에는 소통-공지사항, Q&A, 자료실(직무교육, 승강기관리교육, 이용자안전교육 등), 사업자맞춤형교육, 컨소시엄 교육 관련 게시판, 안전교실(알아보아요, 익혀요, 배워요, 불러요, 읽어요, 즐겨요) 등 다양한 카테고리가 포함되어 있으며, 각 게시판별 게시글 수를 통해 이용자의 관심과 참여 수준을 가늠할 수 있습니다.
