description_portal: 집회 및 시위의 신고 및 개최 현황 데이터는 2011년부터 2025년까지 전라남도에서 발생한 집회 시위 건수를 전라남도경찰청에서 수집한 공공데이터입니다. 이 데이터는 연도별로 집회 및 시위의 신고 건수, 인원을 포함하고 있으며, 분야별(사회, 경제, 공공)로 구분되어 제공됩니다. 이를 통해 전라남도 내 집회 및 시위의 추이를 파악하고, 지역별 치안 정책 수립 및 사회적 이슈 분석에 활용할 수 있습니다. 또한, 연구기관이나 민간에서도 사회적 동향 분석 및 정책 수립을 위한 기초자료로 활용할 수 있습니다.
