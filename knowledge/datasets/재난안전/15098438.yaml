summary_user: 세종특별자치시에 설치된 안전비상벨을 한 건씩 담은 위치 원천 데이터로, 설치목적·설치장소 유형·도로명/지번 주소·위경도와 경찰·경비업체·관리사무소 연계 여부, 부가기능, 설치연도, 최근 점검일·점검결과를 담는다. 시민이 '우리 동네 공원이나 골목 어디에 비상벨이 있고 누르면 경찰로 바로 연결되는가'를 확인하거나, 분석가가 세종시 안전비상벨 분포와 점검 상태를 살피는 데 쓴다. 전역 조인 키는 없어서 주소·좌표로 CCTV·보안등 같은 다른 방범 인프라 위치와 공간적으로 겹쳐 보거나, 관리기관명으로 연결하는 방식으로 이어 쓴다.
