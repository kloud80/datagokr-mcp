description_portal: 본 데이터는 한국가스공사 인천기지본부에서 경상정비용으로 사용하는 위험물 관리현황 정보를 제공합니다. LNG 시설 정비작업에 필요한 위험물의 안전한 관리와 정보 공개를 목적으로 수집되었습니다. 데이터의 세부 항목으로는 구분, 정비명, 위험물질 종류(제1석유류~제4석유류), 사용용도, 사용주기, 사용량, 재고량, 입고량 등이 포함되어 있습니다. 본 데이터는 위험물 관련 자재 납품업체, 안전관리 기관, 소방서, 환경부, 유사시설 운영기관, 산업안전보건공단이 위험물 관리 현황 파악 및 안전대책 수립에 활용할 수 있습니다. 재난·안전 예방과 리스크 관리 고도화에 기여할 것으로 기대됩니다.
