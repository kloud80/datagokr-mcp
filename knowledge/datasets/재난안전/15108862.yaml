summary_user: 의왕시 관내 가로등·보안등·과속방지턱·횡단보도·방호울타리·육교 등 생활안전 관련 도로시설물을 시설 한 건씩 분류명·관리번호·위도·경도·행정동명으로 담은 건별 위치 자료다. 분석가나 시 담당자가 '어느 행정동에 보안등이나 과속방지턱이 부족한가' 같은 안전 취약 지역을 지도에서 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표로 공간 결합하거나 행정동명을 이름으로 맞춰 연결한다.
description_portal: 해당 자료는 생활안전융합데이터를 구축하기 위해 의왕시 관내 생활안전 관련 도로시설물의 위치정보를 정비·통합한 데이터입니다. 각 시설 유형별 위치를 수록하고 있으며, 가로등, 보안등, 과속방지턱, 미끄럼방지시설, 방호울타리, 교량, 터널, 철도, 중앙분리대, 횡단보도, 표지판, 정류장, 주차장, 자전거도로, 자전거보관소, 장애인편의시설, 육교 등 다양한 도로시설물이 포함됩니다. 단일 시설물이 아닌 생활안전 관련 도로 인프라 전반을 위치기반으로 통합 관리할 수 있도록 구성되어 있으며, 시설물의 분포 상태를 지도상에 시각화해 위험 요인 파악 및 안전 취약 지역 분석에 활용할 수 있습니다. 본 데이터는 생활안전 정책 수립 및 공간융합 분석 지원을 위한 기반 자료로서, 의왕시 생활안전수준 진단 및 개선 방안 도출 참고용으로 활용하기 위한 데이터입니다.
