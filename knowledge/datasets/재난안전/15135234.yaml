description_portal: ERSS 구조정보는 대구광역시 구조구급시스템에서 수집된 구조 출동 기록을 기반으로 하여, 긴급 구조 활동의 전반적인 흐름과 결과를 데이터 형태로 정리한 자료입니다. 주요 항목으로는 출동 요청 시간, 사고 위치, 구조 유형(추락, 고립, 매몰 등), 출동대 구성, 구조 성공 여부, 구조 소요 시간, 장비 투입 여부 등이 포함되어 있습니다. 이 데이터를 통해 구조 활동의 효율성을 분석하거나, 특정 유형의 사고에 어떤 구조 전략이 효과적인지를 파악할 수 있습니다. 예를 들어 고립 사고에서 구조 소요 시간이 평균보다 긴 경우, 대원 수나 장비 구성을 바꾸는 식의 정책 조정이 가능해집니다. 또한 구조 실패 사례에 대한 이력을 통해 반복되는 문제점이나 현장 위험 요인을 사전에 식별할 수 있어 예방 중심의 구조 체계를 설계하는 데도 도움이 됩니다.* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
