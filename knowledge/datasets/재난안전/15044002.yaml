summary_user: 2010~2017년 화재로 인한 인명피해 인원을 전국 시·도별로 남자·여자·성별미상으로 나눠 연도별 열로 정리한 집계 파일(csv, 약 2KB)입니다. 분석가가 '어느 시·도에서 화재 인명피해가 많았고 남녀 비중은 어떻게 달랐나'를 연도별로 비교하는 데 쓴다. 전역 조인 키는 없고, 시·도명(구분)을 행정구역 이름·코드로 매핑해야 다른 시도 단위 화재·인구 통계와 연결된다.
limits: 시·도 단위 연도별 합계만 담아 건별 화재나 시군구 단위 분석에는 쓸 수 없다. 표준 행정코드가 없어 다른 데이터와 붙이려면 시·도명을 직접 맞춰야 하며, 필드 목록상 2016년에는 성별미상 열이 없다.
