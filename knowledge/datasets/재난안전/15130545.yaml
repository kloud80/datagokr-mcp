summary_user: 경상남도소방본부 소속 소방차량의 연간 출동 기록을 출동 건별로 담은 파일로, 신고접수일시·재난종별·지번주소·출동차량번호·차량 소속 소방서와 부서가 한 행에 들어 있다(CSV 약 41MB). 소방 분석가나 지자체 담당자가 '경남에서 어느 소방서·부서 차량이 어떤 재난 유형에 얼마나 자주 출동했는가'를 지역·시기별로 따질 때 쓴다. 전역 조인 키는 없어 지번주소를 주소·좌표 데이터와 맞추거나 소방서 이름으로 119안전센터·화재 발생 데이터와 이어 쓰는 방식으로만 연결한다.
description_portal: <데이터 수집목적 및 과정> 경상남도소방본부는 119신고에 따라 소방차량이 출동한 경우, 신고자에게 출동정보를 확인할 수 있는 URL 을 포함한 문자메시지를 발송하며, 시스템 명칭은 "119출동알림서비스" 입니다.<데이터 구성 및 세부항목> 이 파일 데이터는 경상남도소방본부 소속 차량의 연간 출동 현황 자료로써 신고접수일시, 재난종별, 주소, 출동차량번호, 차량 소속 소방서, 차량 소속 부서를 확인하실 수 있습니다.<데이터 현행화 시기> 연 단위 현행화되는 데이터로, 차기 업데이트 예정일은 26. 10. 31. 입니다.
