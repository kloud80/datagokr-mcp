description_portal: '해당 통계는 "수상에서의 수색, 구조 등에 관한 법률"을 근거하여 작성 및 관리되고 있음. 조난사고란 수상에서 사람의 생명, 신체 또는 선박 등의 안전이 위험에 처한 상태라고 정의하고 있으며, 선박의 기준은 선박법에 정의된 선박 중에서 기선, 범선, 부선으로 정하여 통계 집계함. 해상조난사고는 선박의 운용과 관련하여 발생한 조난사고를 해양경찰 관서별(총 21개소) 사고의 발생인원 인명현황을 나타냄* 관서별 : 인천, 평택, 태안, 보령, 군산, 부안, 목포, 완도, 여수, 통영, 사천, 창원, 부산, 울산, 포항, 울진, 동해, 속초, 강릉, 제주, 서귀포'
