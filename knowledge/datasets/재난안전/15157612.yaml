status: active
summary_user: 공단 화학물질정보 시스템에서 검색되는 화학물질별 물질안전보건자료(MSDS)의 목록과 상세 내용을 물질 단위로 담는 API로, 6개 오퍼레이션 모두 실호출이 확인됐다. 사업장 안전관리자나 분석가가 특정 화학물질의 유해성·취급 주의사항을 MSDS 작성·검토 때 참고하려는 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 물질명 등 이름 매핑으로만 이어 쓰며, 상세 조회에는 목록 조회에서 받은 물질 식별값(chemId)을 넘겨야 한다.
limits: 상세 조회의 필수 파라미터(chemId, 검색조건·검색어)는 먼저 목록 조회 등으로 받아서 넘겨야 하며, 개발계정은 하루 1,000회로 호출이 제한된다. 공단 자료는 MSDS 작성·검토 참고용이며 실제 MSDS 작성·제공 의무는 제조·수입자에게 있다.
