description_portal: '공단 화학물질정보 시스템(https://msds.kosha.or.kr/MSDSInfo/)에서 검색가능한 화학물질 안전보건자료의 목록 및 내용을 제공합니다.- 물질안전보건자료대상물질 : 화학물질 또는 이를 포함한 혼합물로서 산업안전보건법 제104조에 따른 유해인자 분류기준에 해당하는 것(다만, 산업안전보건법 시행령 제86조에 따른 물질은 제외)※ 공단에서 제공하는 화학물질정보는 MSDS 작성과 검토 시 참고용으로만 활용이 가능하며 산업안전보건법 110조 및 11조에 의거하여 MSDS 작성과 제공은 화학물질 제조·수입자의 의무입니다.'
