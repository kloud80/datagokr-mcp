description_portal: 경찰청에서 제공하는 2024년 범죄발생부터 검거까지의 기간 통계입니다.제공된 2024년 범죄 발생부터 검거까지의 기간 통계에 따르면, 전체 범죄의 86.6%가 1년 이내에 검거되었으며, 특히 1개월 이내 검거율이 69.8%로 가장 높았습니다. 이는 신속한 초동 수사가 이루어지고 있음을 보여줍니다.범죄 유형별로는 "강력범"죄 중 강도가 85.9%, 살인도 76.5%가 1개월 이내에 검거되어 빠른 검거율을 기록했습니다. "폭력범"죄는 1개월 이내 검거율이 91.1%로 대부분 신속히 해결되었습니다. "절도범"죄는 81.3%가, "지능범"죄는 60.1%가 1개월 내 검거되었습니다. "사기" 범죄는 1년 초과 검거율이 15.6%로 상대적으로 장기 수사가 필요한 경우가 많았습니다.
