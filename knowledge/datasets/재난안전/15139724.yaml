summary_user: 재난안전데이터 공유플랫폼의 토양유효수분 정보를 기준일자와 행정지역코드별로 담고, 각 행에 가뭄상태와 1개월·3개월 가뭄전망, 최종수정일시, 행안부 입수일자를 함께 싣는다. 농업인·지자체 담당자·분석가가 "우리 지역의 현재 토양 가뭄 상태와 앞으로 1~3개월 전망이 어떤가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 행정지역코드(PBADMS_ZONE_CD)를 다른 행정구역 코드표나 지역명과 따로 맞춰야 다른 데이터와 이을 수 있다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 토양유효수분 정보로, 기준일자, 행정지역코드, 가뭄상태, 가뭄1개월전망, 가뭄3개월전망, 최종수정일시, 행안부입수일자 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
