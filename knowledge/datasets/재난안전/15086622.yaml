summary_user: 한국전기안전공사가 2020년 11월부터 12월까지 전기설비 정기검사를 희망한 건물별 대상의 상호, 주소, 희망일을 건별로 담은 전국 범위 파일(csv)이다. 전기안전 분야 분석가나 지자체 담당자가 특정 지역에서 그 시기에 어떤 사업장·건물이 정기검사를 언제 희망했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설 안전 데이터와는 주소나 상호를 매칭해서만 이어 쓸 수 있다.
description_portal: 한국전기안전공사에서는 발전소 등 사업용 전기설비 및 아파트, 공장, 상가 등 자가용 전기설비에 대한 사고를 사전에 예방하기 위하여 전기설비의 유지·운용상태가 전기설비기술기준에 적합한 지의 여부에 대한 검사를 기후에너지환경부장관 또는 시·도지사로부터 위탁받아 일정한 주기로 검사를 시행합니다.관련근거는 전기안전관리법 제11조, 제43조제2항, 같은 법 시행규칙 제8조, 제9조가 해당됩니다.이 데이터는 한국전기안전공사에서 2020년 11월 부터 12월까지  정기검사를 희망한 대상의 상호, 주소, 희망일을 제공하는 데이터입니다.
