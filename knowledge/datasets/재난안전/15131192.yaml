description_portal: 경상남도 남해군 내 해변, 하천 등 물놀이 하는 곳의 안전 요원을  지원하는 현황 데이터 입니다. 개방 데이터 항목으로는 읍면, 물놀이 하는 곳의 명칭, 세부주소, 그리고 안전관리요원 수, 안전관리요원 운영 기간(시작일, 종료일)에 대한 내용을 포함하고 있습니다. 남해군 내의 지정된 해수욕장 또는 물놀이 시설이 아닌, 마을 내 하천 또는 해변 등 물놀이를 많이 하는 곳의 안전을 위해 안전관리요원을 지원하는 사항입니다. 참고하시어 자료를 활용하시면 되겠습니다. 또한 안전관리요원 운영 기간에만 해당되는 사항이니 참고하시기 바랍니다.
