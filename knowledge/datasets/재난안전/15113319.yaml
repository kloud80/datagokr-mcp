description_portal: "세종특별자치시 어린이보호구역에 대한 정보를 제공합니다.데이터는 시설종류(초등학교, 어린이집, 유치원, 특수학교), 대상시설명, 주소, 위도, 경도, 관리기관명, 관할 경찰서, 지정일자, 지정근거, 지정절차로 구성되어 있습니다.2019~2022년 어린이보호구역, 지정근거, 지정절차를 담고 있으며, 지정절차는 신청(대상시설의 장)+조사+지정협의(경찰청장)+지정(시장/주출입문 기준 반경 300m 이내 도로 중 일정구간)입니다.해당 자료는 공공데이터포털에서 '전국어린이보호구역표준데이터'로 통합 개방하고 있으니 이용에 참고하시기 바랍니다.※ 확인방법 :  공공데이터포털 > 검색: 전국어린이보호구역표준데이터 > 스크롤 하단 확인"
