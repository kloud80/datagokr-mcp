summary_user: 세종특별자치시 어린이보호구역을 대상시설(초등학교·어린이집·유치원·특수학교) 한 곳당 한 행으로 담은 건별 파일로, 시설명·도로명주소·위도·경도·관리기관·관할 경찰서·CCTV 설치 여부·지정일자·지정근거·지정절차를 포함한다. 학부모나 교통안전 분석가가 '우리 아이 학교 주변이 언제 어떤 근거로 보호구역으로 지정됐고 CCTV가 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 시설명 매칭으로 이어 쓰며, 전국 단위는 '전국어린이보호구역표준데이터'와 함께 본다.
limits: 공통 코드 키가 없어 다른 데이터와 붙일 때 시설명·주소·좌표 매칭에 의존해야 한다. 범위는 세종시 한 곳에 한정된다.
