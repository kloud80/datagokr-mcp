summary_user: 승강기 제조 공장별로 공장 코드·공장명·주소·업종·업태와 인증 단계, 인증기관명, 인증발행일을 한 행씩 담은 전국 단위 원천 목록이다(CSV 약 396KB). 승강기 발주처나 유지관리 업체가 특정 제조 공장이 어느 인증 단계까지 통과했고 언제 어느 기관에서 인증을 받았는지 확인하거나, 분석가가 지역별 승강기 제조 공장 분포를 볼 때 쓴다. 다른 데이터와 맞물리는 전역 조인 키는 없어 공장명·주소 문자열을 맞추거나 같은 기관의 공장 코드로만 이어 쓴다.
description_portal: '이 데이터는 한국승강기안전공단이 관리하는 승강기 제조 공장 정보로, 승강기 제조와 관련된 사업체의 기본 정보 및 인증 현황을 포함하고 있습니다. 각 행은 하나의 제조 공장에 대한 정보를 나타내며, 주요 필드는 ‘공장 코드’, ‘업종’, ‘업태’, ‘주소’, ‘공장 명’, ‘인증 단계’, ‘인증기관명’, ‘인증발행일’ 등입니다.‘공장 코드’는 각 제조공장을 고유하게 식별하는 번호이며, ‘업종’ 및 ‘업태’는 해당 공장의 주요 사업 영역(예: 제조업, 서비스업 등)을 분류합니다. ‘주소’와 ‘공장 명’을 통해 실제 위치 및 명칭을 확인할 수 있으며, ‘인증 단계’는 해당 공장이 어느 인증 절차 단계까지 통과했는지를 나타냅니다. ‘인증기관명’과 ‘인증발행일’은 인증을 발급한 기관과 발급 날짜를 기록하여 인증 이력을 추적할 수 있도록 구성되어 있습니다.이 데이터는 제조사 관리, 인증 유효성 검토, 지역별 제조 역량 분석 등 행정적·산업적 목적에 활용될 수 있습니다.'
