summary_user: 행정안전부 재난안전데이터 공유플랫폼이 재난 경보와 관련한 위기 징후를 건별로 담은 데이터로, 위기일련번호·보고일자·위기형태·경보단계·관리부서·발령일자 등을 전국 단위(비공간)로 제공한다. 재난안전 분석가나 행정 담당자가 '어떤 위기 유형에 어느 경보단계가 언제 발령·보고되었고 어느 부서가 관리하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 재난 특보·위험지역, 대피시설 등 다른 재난안전 데이터와는 위기형태·경보단계 코드의 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 재난 경보에 대한 위기 징후 관리 정보로, 위기일련번호, 보고일자, 위기형태코드, 경보단계코드, 관리부서명, 발령일자 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청 변수 및 출력 결과는 링크를 통하여 접속한 후 데이터 상세 내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
