summary_user: 울산광역시 울주군의 방사능 비상 시 주민이 먼저 모이는 집결지(마을회관·놀이터·공터 등)를 마을(행정반) 단위로 담은 개별 시설 데이터로, 범위는 울주군 한 개 시군구이며 주소·좌표 수준의 위치를 담는다. 울주군 주민이나 방재 담당자가 "우리 마을의 방사능 대피 집결지는 어디이고 거기서 어느 구호소로 가는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대피·구호시설 데이터 같은 다른 자료와는 시설명·주소 매칭이나 같은 기관(울주군) 자료끼리만 이어 쓴다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 집결지 조회 서비스는 방사능 비상 상황 발생 시 주민들이 안전하게 대피하기 위해 1차적으로 모이는 약속된 장소에 관한 데이터입니다.각 마을(행정반) 단위로 지정되어 있으며, 주민들이 사고 소식을 듣고 가장 먼저 모여야 하는 마을 회관, 놀이터, 공터 등의 위치 정보를 제공합니다.지자체에서 제공하는 대피 버스가 도착하는 장소로, 여기서 인원 파악을 마친 뒤 버스를 타고 최종 '구호소'로 이동하게 됩니다.주민의 거주지(행정반)와 집결지 사이의 거리, 그리고 집결지에서 구호소로 나가는 경로를 확인할 수 있습니다.
