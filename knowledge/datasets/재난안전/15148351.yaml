description_portal: 이 데이터는 대구광역시 수성구청 관할 지역에 설치·운영 중인 무더위 쉼터의 현황을 수집·정리한 자료입니다. 무더위 쉼터는 폭염으로부터 주민을 보호하기 위해 제공되는 공공시설로, 데이터에는 쉼터 식별자, 명칭, 주소 및 상세주소, 유형, 공간 면적, 수용 인원, 냉방 장비(선풍기·에어컨) 현황, 냉방 가능 여부, 휴게시설 유무, 야간 및 주말 운영 여부 등이 포함됩니다. 또한 전기사용 여부, 안내 표지판 설치, 홍보 여부, 온도 관리 정보, 위도·경도 좌표 등도 제공되어 위치 기반 서비스 및 GIS 분석에 활용할 수 있습니다. 아울러 쉼터별 담당자와 연락처 정보가 포함되어 행정 관리 및 주민 안내에도 유용합니다. 본 데이터는 폭염 대응 정책 수립, 주민 생활 안전망 강화, 재난 안전 연구, 모바일 안내 서비스 개발 등 다양한 분야에서 활용 가능한 기초 자료입니다.
