description_portal: 본 데이터는 해외 주요 국가별 총 화재 및 전기화재 발생 건수를 매년 취합하여, 전체 사고 대비 전기화재의 점유율과 변동 추이를 분석한 통계입니다.최근 사회적으로 큰 이슈가 되고 있는 전기차(EV) 및 ESS(에너지저장장치) 등 리튬이온 배터리 기반의 신종 화재 사고 예방 정책 수립을 위한 필수 기초 자료입니다.또한, 기후 변화로 인한 이상 기후 속에서 데이터 센터 등 국가 국제 전기 사고 동향을 파악하여 안전 기준 고도화,  정책 수립을 위한 기초 자료로 사용될 수 있습니다. [데이터 기반 행정] 및 [스마트 안전 관리 시스템] 구축을 위한 정책 근거 자료로써, 민간 분야의 화재 예측 AI 모델 개발 및 안전 컨설팅 산업 활성화에도 기여할 수 있는 높은 시의성을 갖춘 데이터입니다.
