summary_user: 2019년 전라북도 전주시에서 119에 신고된 교통사고를 건별로 담은 파일로, 신고일시, 발생 위치(행정동·도로명·좌표), 사상자 구분(운전자·보행자·자전거 등), 연령·성별, 환자 분류(응급~사망)를 기록한다. 전주시 교통안전 담당자나 연구자가 '어느 시간대·어느 동네에서 보행자나 고령자 사고가 몰리는가'를 따져 신호 조정이나 안전교육 대상을 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 행정동 이름이나 좌표를 맞춰 붙이는 방식으로만 이어 쓴다.
limits: 내려받은 파일의 컬럼명이 모두 'Unnamed'로 읽혀 머리글 행 위치를 직접 확인하고 다시 지정해야 한다. 표준 행정코드 같은 공통 키가 없어 다른 지역·연도 자료와 바로 결합되지 않으며, 메타의 범위 표기(전국·비공간)와 실제 내용(전주시 2019년)이 달라 범위는 내용 기준으로 봐야 한다.
