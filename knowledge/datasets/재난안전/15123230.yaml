description_portal: '이 데이터는 경상북도 봉화군의 산사태 취약 지역 현황을 제공합니다. 해당 데이터는 각 지역에 대한 산사태 발생 가능성을 평가하고, 필요한 예방 및 대응 조치를 수립하기 위한 기초 자료로 사용됩니다. 본 데이터에는 지역별 주소, 위도 및 경도, 산사태 발생 위험에 대한 설명, 그리고 소유 지구 및 기준일 등의 정보가 포함됩니다. 데이터는 2025년 2월 14일 기준으로 제공되며, 분석을 통해 자연재해 예방 및 대응 계획에 활용될 수 있습니다.컬럼 설명:순번: 각 지역의 고유 번호입니다.주소: 산사태 취약 지역의 상세 주소입니다.위도: 해당 지역의 위도 좌표입니다.경도: 해당 지역의 경도 좌표입니다.지정사유: 산사태 위험을 유발할 수 있는 특이 사항이나 사유입니다.소유지구분: 해당 지역의 소유 구분(사유지, 공유지 등)입니다.데이터기준일: 본 데이터가 기록된 기준 날짜입니다.'
