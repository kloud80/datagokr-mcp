summary_user: 경상북도 봉화군 안에서 산사태 취약지역으로 지정된 곳을 한 지점씩 담은 목록으로, 지점마다 주소·위도·경도와 지정사유, 소유지구분(사유지·공유지 등), 데이터기준일이 들어 있다. 주민이나 군 방재 담당자, 분석가가 '우리 마을 근처에 산사태 취약지역이 있는지, 왜 지정됐는지'를 확인하거나 예방·대피 계획의 대상지를 고를 때 쓴다. 전역 조인 키는 없어서 위도·경도 좌표로 대피소·급경사지 같은 다른 재난 위험지역 데이터와 지도 위에서 겹쳐 보거나, 주소를 이름 매칭해 붙여 쓴다.
limits: 봉화군 한 시군구만 담고 있어 다른 시군과 비교하려면 지역별 파일을 따로 모아야 하며, 공통 코드 키가 없어 주소 문자열이나 좌표로만 연결된다. 명세상 연간·이벤트 주기로 만들어지는 파일이라 실시간 위험 경보 용도로 쓰기 어렵고, 현재 지정 상태는 데이터기준일을 보고 판단해야 한다.
