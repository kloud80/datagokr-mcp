summary_user: 일반주택·소규모 빌딩 등 75kW 미만 일반용 전기설비 정기점검 결과를 연도(2016~2024년)와 16개 시도 단위로 집계해 점검실시 호수, 부적합 건수, 부적합률을 담는다. 분석가나 지자체 담당자가 "우리 시도의 전기설비 부적합률이 전국 다른 지역보다 높은지, 해마다 줄고 있는지"를 비교할 때 쓴다. 표준 행정구역 코드 같은 전역 조인 키는 없으므로, 시도 이름을 행정구역 코드로 직접 매핑해야 다른 시도별 통계와 이어 쓸 수 있다.
