description_portal: 경찰청 사이버범죄수사과의 2014-2019년 시도별 인터넷 사기 발생 및 검거 현황 통계입니다. 서울, 부산, 대구 등 주요 도시를 포함한 전국 18개 지방경찰청의 연도별 범죄 건수를 비교할 수 있습니다. 발생 건수와 검거 건수가 명시되어 있어 검거율 추이 분석에 용이하며, "0" 값은 미집계 데이터를 나타냅니다. 시도별, 연도별 증감 추이를 통해 사이버 사기 범죄의 변화 양상을 파악하는 데 활용될 수 있습니다.2020년도는 해당데이터 제공 부서에서 정비중이라고 합니다. (2020년도 하반기에 경찰청 홈페이지를 통해 상세 데이터 내역 공개 예정)
