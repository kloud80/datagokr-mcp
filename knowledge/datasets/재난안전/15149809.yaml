summary_user: 보호구 안전인증서의 안전인증 번호('-' 포함)를 넣으면 해당 인증서의 진위 여부(docAuthYn)와 발급일자를 건별로 돌려주는 전국 범위 조회 API다. 보호구를 납품받거나 구매하는 사업자·안전관리자가 "이 KCs 인증서가 실제로 발급된 진짜 인증서인가"를 확인하는 데 쓴다. 응답에 전역 조인 키가 없어 다른 데이터와는 안전인증 번호나 제품명 같은 이름 매핑, 또는 같은 기관(한국산업안전보건공단) 데이터 기준으로만 이어 쓴다.
limits: 인증 번호 한 건씩 진위만 확인하는 조회라 인증 품목 목록이나 제조사별 현황 같은 집계·전수 조회에는 쓸 수 없다. 개발계정은 하루 1,000회로 호출이 제한된다.
