description_portal: 한국산업안전보건공단에서 제공하는 보호구 안전인증서 진위확인 조회서비스입니다.- 발급된 증명서의 안전인증 번호를  입력하세요.("-"포함입력)※ 보호구 안전인증 (KCs마크) 제도란?안전인증 대상은 위험기계·기구의 방호장치와 유해 위험한 작업장에서 근로자가 착용하는 보호구입니다. 의무안전인증을 받아야 하는 품목과 제조하는 자가 방호장치·보호구 안전인증기준에 의거하여 스스로 안전성을 확인하고 이를 우리 공단에 자율안전확인 신고를 하는 품목으로 구분됩니다. 이를 통해 안전인증기준을 만족하는 제품에 KCs마크를 부착·판매토록 하여 근원적인 안전성과 신뢰성이 확보된 제품이 제조, 유통 및 사용 되도록 함으로써 산업재해를 예방하고자 추진하는 제도입니다.
