description_portal: 이 공공데이터는 강원특별자치도경찰청에서 관리하는 공기총의 구경별 소지허가 현황을 정리한 자료입니다. 제공 항목은 단탄 4.5mm, 5.0mm, 5.5mm, 6.4mm 및 공기권총 등 다양한 구경별로 구분되며, 각 구경에 대한 소지 및 보관 허가 건수를 포함하고 있습니다. 해당 데이터는 공기총류의 합법적 소지 현황과 안전관리 실태를 파악하는 데 유용하며, 총기 관련 정책 수립, 불법 소지 예방, 사격·수렵 활동 관련 관리업무 등에 기초자료로 활용될 수 있습니다. 경찰청, 지자체, 총기관리기관뿐 아니라 연구기관에서도 총기 안전관리 제도 개선이나 지역별 총기 분포 특성 분석을 위한 참고자료로 폭넓게 활용될 수 있습니다.
