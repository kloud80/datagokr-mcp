summary_user: 광주광역시경찰청과 관할 5개 경찰서(광산·동부·서부·남부·북부)별로 2022~2025년 5대 범죄(살인·강도·성범죄·절도·폭력) 건수를 연도·범죄유형·구분에 따라 열로 나눠 담은 집계 파일입니다(약 1.8KB CSV). 광주 시민이나 지역 분석가가 "우리 동네를 맡은 경찰서 관할에서 절도·폭력이 해마다 늘고 있나" 같은 질문에 답할 때 씁니다. 전역 조인 키가 없어 다른 지역 범죄통계나 인구 자료와 이어 쓰려면 경찰서 이름을 자치구에 직접 대응시켜야 합니다.
description_portal: 광주광역시경찰청은 2022년부터 2025년까지 광주광역시 자치구별(시경찰청 및 5개경찰서) 5대 범죄(살인, 강도, 성범죄, 절도, 폭력) 현황에 대한 4년간 상세 데이터를 시민들에게 제공하고 있습니다. 이 데이터는 자치구별로 세분화되어 범죄 발생 현황을 명확하게 보여주며, 각 범죄 유형에 대한 발생 추이를 분석할 수 있도록 돕습니다. 이를 통해 광주광역시 지역 주민들은 자치구별 치안 상황을 더 잘 이해할 수 있으며, 경찰은 보다 효과적인 범죄 예방과 대응 전략을 수립할 수 있습니다. 광주경찰청은 이 데이터를 지속적으로 관리하고 제공함으로써 지역 사회의 안전을 강화하고, 시민들의 신뢰를 쌓아가고 있습니다.
