description_portal: 한국승강기안전공단이 수행하는 승강기 안전검사와 관련해 발송된 검사수수료 입금요청 내역을 정형화한 자료입니다. 건별로 전송일자, 고객안내번호(식별 안전을 위해 부분 마스킹 처리), 청구 금액, 입금기한을 포함하며, 회계·수납 시스템의 정산 및 납부 기한 관리, 발송 이력 추적, 미납 대응 근거 확보를 지원하는 것을 목적으로 합니다. 동일 고객 또는 동일 건물의 여러 호기에 대한 청구가 배치로 전송될 수 있어 같은 날짜에 다수 행이 존재할 수 있으며, 재전송·정정 시에는 최신 전송건이 기준이 됩니다. 데이터의 범위는 공단이 발송한 “입금요청” 단계의 과금 정보에 한정되며, 실제 입금·취소·환불 등의 결과 처리 데이터는 별도 시스템에서 관리됩니다. 주민등록번호, 주소 등 민감정보는 포함하지 않으며, 금액은 원화 기준, 날짜는 발송(전송) 기준입니다.
