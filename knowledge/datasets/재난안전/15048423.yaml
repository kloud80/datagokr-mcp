description_portal: 이 데이터는 일회성데이터로 2020년 12월 31일 기준 경찰청에서 집계한 서울 및 경기지역의 2종 소형 운전면허 소지자 현황을 제공하는 공공데이터입니다. 수원, 성남, 용인, 고양 등 주요 행정구역별로 2종 소형 면허(주로 오토바이·스쿠터 등 이륜차) 보유자 수가 구분되어 있어 지역별 소형 면허 수요 분포, 교통안전 교육 필요성, 면허 발급 집중도 등을 분석할 수 있습니다. 이 데이터는 경찰의 이륜차 면허 정책 수립, 교통안전 교육 강화, 연구기관의 도시별 교통 인프라 분석, 공공기관의 지역 맞춤형 면허제도 개선 등에 활용됩니다.
