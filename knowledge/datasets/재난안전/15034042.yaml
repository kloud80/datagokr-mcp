summary_user: 대전광역시 중구가 관리하는 주요 방재시설물을 시설 한 곳당 한 행으로 담은 파일(CSV 약 11KB)로, 유지관리부서·분야(하천시설, 하수도, 사방시설, 재난예경보시설 등)·세부시설·시설명칭·위치를 담는다. 주민이나 방재 분석가가 '중구에 어떤 방재시설이 어디에 있고, 어느 부서가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치(지번·도로명주소)를 주소 매핑하거나 시설명칭·같은 기관 기준으로만 이어 쓴다.
limits: 표준 시설물 번호 같은 공통 조인 키가 없어 안전등급·점검 결과 원장과 바로 연결되지 않는다. 범위는 대전 중구 한 시군구이고 좌표가 없는 비공간 자료라서, 지도에 표시하려면 위치 주소를 따로 지오코딩해야 한다.
