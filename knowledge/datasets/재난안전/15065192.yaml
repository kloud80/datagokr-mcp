description_portal: 경찰청 장비운영과의 차량 연식 현황 통계(2025년 12월 31일 기준)에 따르면, 경찰청 보유 차량은 2010년대 중반부터 급격히 증가하여 장비 현대화가 가속화된 양상을 보입니다. 1997년부터 2000년대 초반식 차량은 극소수(연간 2대 수준)인 반면, 2013년(179대)을 기점으로 수량이 세 자릿수로 올라서며 본격적인 교체가 이루어졌습니다.특히 2017년부터 2023년까지는 매년 1,300대에서 최대 2,359대(2020년)가 도입되어 현재 경찰 전력의 핵심을 구성하고 있습니다. 2024년 이후 수치가 감소하는 것은 교체 주기 및 통계 집계 시점에 따른 현상으로 풀이되며, 전반적으로 최근 10년 내 생산된 신형 차량 중심의 운영 체계를 갖추고 있습니다.
