summary_user: 2024년 서울특별시경찰청 관할 31개 경찰서가 서울 25개 자치구에서 단속한 교통법규 위반 결과를 위반 법조항, 차종, 차량 용도, 위반 장소별로 정리한 파일로, zip 묶음으로 활용신청 없이 내려받는다. 교통안전 정책 담당자나 분석가가 "어느 경찰서 관할에서 어떤 법조항 위반이 어떤 차종·장소에 많이 단속됐나"를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 경찰관서 위치나 지역별 교통사고 데이터와는 경찰서 이름이나 자치구 이름을 맞춰서만 이어 쓴다.
limits: 표준 행정코드나 경찰서 코드 같은 공통 키가 없어 다른 데이터와의 연결은 이름 매핑에 의존한다. 메타상 범위는 전국·비공간으로 표기되지만 포털 설명상 실제 내용은 서울 관할 2024년도 단속분이다. 이 데이터의 등급은 보조로 분류돼 있다.
