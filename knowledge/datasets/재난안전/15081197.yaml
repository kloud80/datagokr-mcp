description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2021년 8월 13일 기준 경찰청에서 집계한 인터넷 직거래 사기 현황을 제공하는 공공데이터입니다. 연도별 인터넷 직거래 사기 발생 건수, 피해 금액, 검거 실적 등의 정보가 포함되어 있어 온라인 거래에서의 피해 추세, 주요 사기 수법, 범죄 대응 현황을 분석할 수 있습니다. 이 데이터는 경찰의 사이버 범죄 대응 강화, 온라인 플랫폼의 안전 관리, 연구기관의 전자상거래 안전 분석, 민간 보안 서비스 개발, 공공기관의 소비자 보호 캠페인 등에 폭넓게 활용됩니다.
