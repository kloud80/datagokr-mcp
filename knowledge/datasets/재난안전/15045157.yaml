description_portal: 본 데이터는 2013년부터 2021년까지의 기간 동안 인천, 평택, 태안, 군산, 목포, 제주, 서귀포, 통영 등 주요 해역을 대상으로 한 단속 현황을 정리한 자료이다. 각 해역별 단속 건수, 단속 유형, 연도별 추세 등을 포함하고 있어 지역별 해양치안 활동의 변화와 특성을 파악하는 데 활용할 수 있다. 또한 특정 해역에서의 위반 행위 발생 양상, 단속 집중 구간, 시기별 증가·감소 요인을 분석하는 기초자료로도 유용하다. 본 데이터는 해양 안전관리 정책 수립, 단속 전략 마련, 지역별 위험도 평가 등 다양한 행정·연구 목적에 활용될 수 있는 기반 자료이다.
