summary_user: 한국가스안전공사가 우수 LPG판매업체로 인증한 업소를 업소 한 곳당 한 행으로 담은 전국 파일(CSV 약 11KB)로, 기준연도·지역·업소명·전화번호·우편번호·주소와 인증 유효 시작일·종료일을 담는다. 가스를 들이려는 국민이 우리 동네에서 인증이 유효한 LPG판매점을 찾거나, 지자체·분석가가 지역별 인증업체 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(지오코딩)나 업소명·지역 이름 매칭으로만 연결한다.
description_portal: '전국 LPG판매업체 중 한국가스안전공사에서 인증한 우수판매업체 정보를 공개하여 국민들에게 유용한 정보를 제공하기 위한 데이터입니다.해당 데이터는 기준연도, 지역, 업소명, 전화번호, 우편번호, 주소, 유효 시작일, 유효 종료일에 대한 정보를 제공합니다.데이터 기준일자 기준 유효 시작일과 유효 종료일 범위 내 자료로, 유효 시작일 기준 2023년 이후의 정보를 제공하고 있습니다.※ 수시성 데이터로 추후 현행화를 통한 인증업체 현황을 업데이트하여 등록 예정입니다.- 데이터 기준일자 : 2025년 11월 26일'
