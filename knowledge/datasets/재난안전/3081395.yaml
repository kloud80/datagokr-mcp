summary_user: 부산광역시 남구가 지진 대비 이재민 임시거주시설로 지정한 내진성능 확보 시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·주소·면적(제곱미터)·수용인원을 담는다. 남구 주민이나 재난 담당자가 지진으로 집을 잃었을 때 남구 안 어느 시설에 몇 명까지 머물 수 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 주소나 시설명을 맞춰 연결하고, 전국 현황은 국민재난안전포털의 임시거주시설 목록과 대조해 쓴다.
description_portal: 재해구호법 제4조, 같은법 시행령 제3조에 의거 지정된이재민 구호를 위한 임시거주시설 중내진성능이 확보된 지진 대비 이재민 수용가능 시설에 관현 데이터입니다.  데이터 포함자료는 시설명, 주소, 면적 및 수용가능 인원이며내진성능 확보된 수용시설 2개소 추가 지정한 사항을 현행화하여 최신 테이터를 공개하고자 합니다. 전국 임시거주시설의 현황은국민재난안전포털에서 검색하실수 있습니다. . https://www.safekorea.go.kr/idsiSFK/neo/sfk/cs/sfc/res/acmdfcltyList.html?emgPage=Y&menuSeq=859
