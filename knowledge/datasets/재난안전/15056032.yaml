description_portal: 제주특별자치도 제주시에서 관리하는 자연재해위험개선지구 현황 데이터는 태풍, 집중호우, 해일 등으로 인해 상습 침수나 침식 등의 재해가 발생할 우려가 있어 집중 관리가 필요한 지역 정보를 제공합니다. 본 데이터는 위험 지역의 구체적인 행정구역을 나타내는 위치, 각 관리 대상 구역의 명칭인 지구명, 침수·유실·고립 등 재해 원인별 분류를 보여주는 유형, 해당 지역의 위험 정도를 나타내는 위험등급, 그리고 법적으로 위험지구로 지정·효력이 발생한 시점을 명시한 지정일자 등의 핵심 정보를 제공하여 체계적인 예방 사업 추진과 취약 지역 모니터링을 위한 방재 기초 자료로 활용됩니다.
