summary_user: 제주시가 관리하는 자연재해위험개선지구를 지구 한 곳당 한 행으로 담은 파일로, 위치·지구명·재해 유형·위험등급·지정면적·지정일자와 함께 개선사업의 기간·내용·사업비·완료 여부까지 기록한다. 주민이나 방재 담당자가 '우리 동네 근처에 침수·유실 위험지구로 지정된 곳이 있고 정비사업은 끝났는가'를 확인하거나, 분석가가 지구별 사업비와 완료 현황을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위치(행정구역)나 지구명을 이름으로 맞춰 이어야 하며, 다른 시군의 같은 이름 데이터와도 이 방식으로 묶는다.
limits: 행정코드나 좌표 같은 공통 키가 없어 지도 레이어나 토지 규제 데이터와 바로 겹쳐 보기 어렵고, 이름 매칭이 필요하다. 범위는 제주시 한 곳뿐이며, 명세상 연간·이벤트 단위로 만들어지는 정적 파일이라 실시간 재난 상황 판단에는 맞지 않는다.
