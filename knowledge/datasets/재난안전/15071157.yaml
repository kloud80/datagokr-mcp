summary_user: 한국전기안전공사가 2024년에 정기점검한 일반용 전기설비(75kW 미만 저압 설비)의 부적합 건수를 점검주기(1~3년), 업종, 부적합 유형(절연저항·인입구배선·누전차단기·개폐기차단기·옥내외배선·접지상태)별로 묶은 전국 단위 집계 파일이다. 전기안전 정책 담당자나 분석가가 "어떤 업종에서 누전차단기나 접지 불량 같은 부적합이 많이 나오는가"를 확인하는 데 쓴다. 지역 코드나 시설 번호 같은 공통 조인 키가 없어 다른 데이터와는 업종명·부적합 유형 이름을 맞추거나 같은 기관의 다른 점검 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 한국전기안전공사에서는 일반주택, 소규모 빌딩 등 저압에 해당하는 용량 75kW(제조업 및 심야전력은 100kW) 미만의 일반용 전기설비에 대하여 전기설비의 유지, 운용상태가 적합한지 여부를 설비 유형에 따라 1~3년 주기로 점검하는 업무로 산간·오지의 안전 취약시설부터 수도권 등 도심지역까지 정기점검을 진행하고 있습니다.관련 법정근거는 전기안전관리법 제12조, 같은 법 시행규칙 제12조에 해당됩니다.이 데이터는 2024년 정기점검을 진행한 설비의 점검주기(1년 ~ 3년)별, 부적합 유형별(절연저항, 인입구배선, 누전차단기, 개폐기차단기, 옥내외배선, 접지상태) 현황을 제공하는 데이터입니다.
