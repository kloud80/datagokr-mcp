summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 학교 정보로, 학교 한 곳마다 학교유형·학교명·지번 주소와 도로명 주소, 법정동·행정동 코드, 특이사항, 삭제 여부와 수정일시를 한 행에 담는다. 재난이나 안전 분석가가 특정 읍면동 안에 어떤 학교가 있는지 확인하고, 재난 대응 대상 시설 목록을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 법정동코드(STDG_CD)·행정동코드나 학교명·주소를 매핑해 행정구역 통계나 대피시설 같은 다른 안전 데이터와 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 학교 정보로, 지역코드, 학교유형, 학교명, 법정동코드, 산주소여부, 특이사항, 행정동코드, 도로명상세주소 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
