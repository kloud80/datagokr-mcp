summary_user: 구급차 교통사고 건수를 원인구분(인적·차량적·도로환경 요인)과 세부 사고원인별로 나눠 2024년 한 해 값으로 담은 전국 단위 집계 통계이며, zip 파일 크기가 1,111바이트인 작은 표다. 소방 안전 분석가나 구급차 운영 담당자가 '구급차 사고는 전방주시태만 같은 운전자 요인과 노면 미끄러움 같은 도로 요인 중 어디서 많이 나는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어, 같은 소방청 통계와 원인 항목 이름을 맞춰 나란히 보는 방식으로만 이어 쓴다.
description_portal: 구급차 교통사고를 각 시도 소방본부별, 사고 원인별로 분류한 통계 자료입니다.구급차 교통사고 각 시도 소방본부별 데이터는 구급대원 부상신고, 경상, 중상, 사망자가 있는 경우만 해당됩니다.사고 원인별로는 인적요인 9개 항목(전방주시태만, 환경요인에 의한 발견지연, 심리적 요인에 의한 판단잘못, 차량조작잘못, 보행자 부주의, 불명, 심신건강상태 불량, 해당없음, 기타)과차량적요인 6개 항목(제동장치불량, 조향장치불량, 엔진장치불량, 해당없음, 기타) 및 도로환경요인 10개 항목(도로구조에 의한 시계불량, 장애물에 의한 시계불량, 이상기후에 의한 시계불량, 야간 시계불량, 노상장애물(방치물차량 등), 노면 미끄러움(결빙적설 등), 선형불량, 불명, 해당없음, 기타)입니다.원인구분은 모두 선택해야 합니다.  예를 들어, 구급차 교통사고가 121건이라면 인적요인 121건, 차량적요인 121건, 도로환경요인 121건이 작성됩니다.
