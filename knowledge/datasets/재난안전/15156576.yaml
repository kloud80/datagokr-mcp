description_portal: 강릉관광개발공사 CCTV 설치 현황 데이터는 공사가 관리·운영하는 시설 및 사업장 내에 설치된 영상정보처리기기의 운영 현황을 정리한 자료입니다. 본 데이터는 범죄 예방과 시설 안전 관리, 이용자 보호 등 영상정보 수집 목적에 따라 설치된 CCTV의 설치 대수, 설치 위치 및 촬영 범위를 체계적으로 제공하여 CCTV 운영 현황을 한눈에 확인할 수 있도록 구성되어 있습니다.또한 관리부서를 함께 제공함으로써 영상정보처리기기의 관리·운영 책임 주체를 명확히 하고, 관련 법령에 따른 개인정보 보호와 적정한 영상정보 관리 체계 준수 여부를 확인하는 데 활용될 수 있습니다. 본 자료는 공공시설 이용자의 알 권리를 보장하고, 공사의 안전 관리 및 개인정보 보호에 대한 투명성을 제고하기 위한 기초 자료로 활용됩니다.
