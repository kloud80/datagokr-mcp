summary_user: 울산광역시 울주군 관내 유치원의 위치와 학급 수·원아 수·교직원 수 등 현황을 방사능 방재 목적으로 시군구 범위에서 제공하는 API입니다. 방사능 비상 시 대피 우선순위를 정하거나, 유치원별 수송 버스 대수와 인솔 인력을 산정하려는 방재 담당자·분석가가 '어느 유치원에 유아가 몇 명 있고 몇 대의 버스가 필요한가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 유치원 이름·주소 매핑이나 같은 기관(울주군) 코드로만 연결하며, 대피·구호시설 데이터와 함께 보는 것이 자연스럽다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 유치원 조회 서비스는 방사능 비상 상황 시 재난 취약계층인 유아들을 안전하게 보호하고, 체계적인 대피를 지원하기 위해 관내 유치원의 위치와 현황 정보를 제공하는 데이터입니다.방사능 재난 발생 시 성인의 도움 없이 스스로 대피하기 어려운 유아들이 모여 있는 장소를 파악하여, 구조와 대피의 우선순위를 결정하는 근거가 됩니다.각 유치원의 학급 수, 원아 수, 교직원 수 등의 정보를 포함하고 있어, 대피 시 필요한 수송 버스 대수와 인솔에 필요한 행정 인력을 산정하는 기초 자료로 활용됩니다.
