description_portal: 이 데이터는 경상북도 김천시 관내에 설치된 안전 비상벨의 설치 현황 및 위치 정보를 수록한 공공데이터로,시민의 범죄 예방, 위급 상황 대응, 공공안전 확보를 위한 스마트 방범 시설물인 ‘비상벨’의 물리적 위치 및 연동 정보를 제공합니다.각 비상벨의 설치 목적, 설치 장소 유형(공원, 도로, 주택가 등), 정확한 주소 및 좌표(WGS84 기준 위도/경도) 외에도,경찰·경비업체·관리사무소 연계 여부, 설치 연도 등의 정보가 포함되어 있어도시안전 정책 수립, 범죄취약지역 분석, 스마트시티 통합관제 시스템 설계 시 핵심적인 기초자료로 활용됩니다.
