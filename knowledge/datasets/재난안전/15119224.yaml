description_portal: '서울특별시 마포구 관내에 위치한 임시주거시설 현황에 관련된 데이터입니다. 이 데이터에는 각 임시주거시설이 위치한 소재지의 도로명 주소 및 법정동, 시설을 담당하는 행정동이 포함되어 있습니다. 또한, 시설의 이름과 시설명, 시설의 대표전화번호, 구분(예: 학교, 관공서, 자치회관, 기타 등), 시설의 면적(단위:㎡)과 수용인원(단위: 명), 내진설계적용여부 등의 세부 정보도 함께 제공됩니다. 공공56개소, 민간9개소를 합하여 총 65개소가 있습니다.이 데이터를 통해 지방자치단체와 유관 기관은 긴급 상황 발생 시 신속하게 거주 지원 체계를 가동할 수 있으며, 시민들은 위기 상황에서 이용 가능한 임시주거공간에 대한 정보를 쉽게 확인할 수 있습니다.'
