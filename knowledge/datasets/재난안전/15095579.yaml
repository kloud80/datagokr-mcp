summary_user: 울산광역시 울주군에서 방사능 비상 때 대응 거점이 되는 군청·읍면 행정복지센터와 소방서·경찰서·군부대 같은 협력 기관의 위치를 점 데이터로 담는다. 원전 사고 같은 방사능 비상 상황에서 대책본부와 현장 대응소가 어디에 설치되는지 확인하려는 주민이나 방재 계획 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기관명·주소 같은 이름 매핑이나 같은 기관 코드로만 이을 수 있다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 지자체 조회 서비스는 방사능 비상 상황 시 통합적인 재난 관리와 의사결정을 수행하는 지방자치단체(울주군청 및 관련 행정기관)의 대응 거점 정보를 제공하는 데이터입니다.방사능 방재 대책 본부(현장 지휘소)가 설치되는 울주군청, 각 읍·면 행정복지센터 등 행정적 의사결정이 이루어지는 주요 기관의 위치를 포함합니다.소방서, 경찰서, 군부대 등 지자체와 협력하여 방재 작전을 수행하는 공공 지원 기관들의 위치 정보가 담겨 있습니다.본부(군청)부터 현장 대응소(읍·면사무소)까지 이어지는 행정 지휘 체계를 지도상에 점(Point) 데이터로 구현하여 제공합니다.
