summary_user: 경찰청이 제공하는 음주운전 적발 건별 기록으로, 성별·적발횟수·나이·알코올농도·측정거부 여부·측정일시·관할경찰서를 한 행씩 담은 전국 범위 CSV 파일(약 6.4MB)이다. 분석가가 "어느 관할경찰서에서 재범(2회 이상 적발) 비율이나 고농도 적발이 많은가" 같은 질문에 답하거나 음주운전 예방 정책의 기초 자료를 만드는 데 쓴다. 관할경찰서(police_office)를 키로 경찰관서 위치 데이터나 지역 단위 교통사고·범죄 통계와 이어 쓴다.
description_portal: 경찰청 생활안전교통국 교통안전과에서 제공하는 음주운전 통계입니다.이 통계를 보면 남성 운전자의 음주 적발 건수가 여성 운전자보다 훨씬 많은 것으로 나타납니다. 적발 횟수는 1회인 경우가 가장 많지만, 5회 이상 적발된 사례도 확인됩니다. 연령대는 다양하게 분포되어 있으며, 알코올 농도는 0.0%부터 0.9%까지 측정되었습니다. 측정일시는 구체적으로 제시되지 않았으나, 관할 경찰서는 서울, 부산, 인천, 대전, 광주, 울산 등 전국적으로 분포되어 있습니다. 이 자료는 음주운전 예방을 위한 기초 자료로 활용될 수 있으며, 성별, 적발 횟수, 연령, 알코올 농도 등을 분석하여 음주운전의 특징 및 추세를 파악하는 데 도움이 될 것으로 보입니다.
