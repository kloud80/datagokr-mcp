description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 JDC지정면세점 매장 내 설치된 영상정보처리기기(CCTV)에 대한 2019년도 기준 현황 정보입니다. 각 구성 항목으로는 해당연도, 설치 대상, 책임자, 담당자 등의 관리 주체 정보와 더불어 영상정보처리기기 운영 현황이 구체적으로 나와 있습니다. 운영 현황은 공개장소와 비공개장소로 나뉘며, 공개장소는 고객 접근이 가능한 매장 출입구, 판매 공간, 복도 등이며, 비공개장소는 직원 전용 구역이나 보안구역 등을 의미합니다. 또한 공개된 장소에 설치된 CCTV는 범죄 예방, 화재 및 안전사고 감시, 고객 분실물 확인, 시설 관리 등의 목적별로 분류되어 있으며, 이 중 범죄 예방 목적의 설치 수량 및 위치가 별도로 표기되어 있습니다. 이 데이터는 JDC가 운영하는 면세점 내 영상정보처리기기의 설치 현황과 목적을 투명하게 관리하고, 개인정보 보호법 및 영상정보 보호지침을 준수하는지 확인하기 위한 기반 자료로 활용될 수 있으며, 보안체계 개선, 고객 안전관리 강화, 내부 보안사고 예방 등의 정책 수립에도 유용하게 활용될 수 있습니다.
