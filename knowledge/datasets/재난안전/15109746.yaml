summary_user: 울산광역시도시공사가 설치·운영하는 CCTV를 개소별로 담은 파일 데이터로, 주소·위도·경도·상세위치와 설치목적, 카메라 대수·화소, 촬영방면, 보관일수, 설치연월, 비상벨 설치 여부, 작동현황, 관리부서·관리자를 기록한다(파일 크기 약 6.5KB로 소규모). 주민이나 분석가가 '도시공사 관리 사업지구·공원·아파트 단지 주변에 방범용 CCTV가 어디에 몇 대 있고 비상벨이 함께 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 CCTV·안전비상벨·보안등 데이터와는 위도·경도 좌표나 주소로 공간 매칭해 이어 쓴다.
description_portal: 이 데이터는 울산광역시도시공사에서 설치·운영 중인 CCTV(폐쇄회로 텔레비전) 시설의 제원, 위치, 설치 목적 및 관리 현황을 종합적으로 기록한 데이터셋입니다.도시공사에서 관리하는 주요 사업지구, 공공시설, 산업단지, 공원, 아파트 단지 등 다양한 지역에 설치된 CCTV의 현황을 체계적으로 관리하고, 도시 안전 및 방범 기능을 강화하기 위한 기반자료로 활용하기 위해 구축되었습니다.데이터에는 관리기관명(INST_NM), 관리부서(MNG_DEPT), 관리자(MNGR_MAIN), 부관리자(MNGR_SUB) 등 CCTV의 운영 및 관리 책임 주체에 대한 정보가 포함되어 있습니다.또한 소재지 도로명주소(ROAD_NM_ADDR), 지번주소(LOTNO_ADDR), 상세위치(DTL_PSTN), 위도(LAT), 경도(LOT) 등의 공간정보를 통해 CCTV의 정확한 위치를 파악할 수 있으며, 설치목적구분(PURPOSE) 필드를 통해 방범, 교통, 시설안전, 재난예방 등 목적별 설치 현황을 분석할 수 있습니다.
