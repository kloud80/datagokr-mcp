summary_user: "광주 북부소방서 관할의 소방용수시설(급수탑·저수조·지상식·지하식 소화전 등)을 시설 한 곳당 한 행으로 담은 개별 원장으로, 시설 구분·동·도로명주소·데이터기준일자를 담는다(포털 설명상 총 1031개소). 소방·건축 담당자나 주민이 '우리 동네(예: 문흥동)에 소화전·급수탑이 어디에 몇 개 있는가'를 확인하거나 동별 소방용수 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 동 이름이나 도로명주소를 기준으로 다른 소방서의 소방용수 현황, 화재 발생 건별 자료, 행정동 단위 통계와 이름 매칭으로 이어 쓴다."
limits: 표준 코드(행정동 코드 등)나 좌표 컬럼이 없어 다른 데이터와는 동 이름·주소 문자열 매칭으로만 연결해야 한다. 북부소방서 관할만 담고 있어 광주 전체나 다른 소방서 관할은 별도 파일이 필요하다.
