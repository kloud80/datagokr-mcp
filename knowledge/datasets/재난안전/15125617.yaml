summary_user: 성남시가 감염병 예방을 위해 지정한 안심식당을 한 곳당 한 행으로 담은 건별 목록으로, 식당명·업종·업종상세·전화번호·도로명주소·데이터기준일자를 포함하며 범위는 성남시 한 곳이다(CSV 약 30KB). 시민이 "우리 동네에서 위생 관리가 인증된 안심식당은 어디인가"를 찾거나, 분석가가 구별·업종별 안심식당 분포를 살필 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 도로명주소를 지오코딩하거나 식당명·주소를 문자열로 맞춰 일반음식점 인허가 자료 등과 이어야 한다.
description_portal: 성남시 안심식당현황 자료는 감염병 예방과 안전한 외식 환경 조성을 위해 지정된 ‘안심식당’의 정보를 담고 있는 자료입니다. 이 자료는 식당명, 업종, 주소, 전화번호 등의 항목이 포함되어 있습니다.데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 시민들이 안심하고 이용할 수 있는 음식점을 쉽게 확인할 수 있으며, 위생 정책의 기초 자료등으로 활용할 수 있습니다. 이를 통해 성남시 내 음식점 이용의 안전성을 높이고, 지역 외식업계의 신뢰도를 향상시키는 데에도 중요한 역할을 합니다.
