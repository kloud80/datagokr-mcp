summary_user: 서울특별시경찰청 소속 경찰서별로 112신고 접수 후 출동한 건수를 연도별(2011~2025년) 열로 펼쳐 담은 집계 표이며, 파일 크기가 약 3KB인 작은 CSV입니다. 분석가나 지역 주민이 '우리 동네 관할 경찰서의 112 출동 건수가 최근 몇 년간 늘었는가'처럼 경찰서 간·연도 간 치안 수요를 비교하는 질문에 쓴다. 전역 조인 키가 없어 경찰서 이름을 관할 자치구나 경찰관서 위치 데이터와 이름으로 직접 매핑해야 이어 쓸 수 있다.
description_portal: 서울특별시경찰청 소속 31개 경찰서별 112신고 접수 후 출동한 사건에 대한 통계 자료입니다. 이 자료는 2011년부터 2025년까지의 데이터를 포함하고 있고, 연도별 경찰서별로 신고가 접수된 사건들의 출동 현황을 기록하고 있습니다. 112신고 출동 건수에 대한 분석을 통해  관할 경찰서(자치구)에서 발생한 사건들을 효과적으로 파악하고, 경찰 자원의 배치 및 대응 전략을 개선할 수 있습니다. 이 통계는 치안 개선 및 지역 사회 안전, 범죄 예방 대응을 위한 중요한 기초 자료로 활용될 수 있습니다.
