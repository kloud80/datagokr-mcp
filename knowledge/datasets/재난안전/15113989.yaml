description_portal: 기후변화로 인한 집중호우, 태풍, 폭설 등 극한기상 현상 증가와 자연재해 규모 대형화에 따른 선제적 재해대응 체계 구축 필요성, 시민 생명과 재산 보호를 위한 재해예방 인프라 확충 요구 증대에 따라 보령시는 체계적인 재해예방 및 응급복구사업을 추진하고 있습니다. 이를 통해 재해 발생 전 예방시설 구축과 재해 발생 후 신속한 복구를 통한 시민 안전망 강화, 지역 사회기반시설의 재해 취약성 해소에 기여하고자 합니다. 보령시에서 추진하는 각종 재해예방시설 설치사업과 응급복구사업의 사업내용, 추진현황, 예산정보 등을 포함한 종합적인 사업현황 정보를 제공하고 있습니다.개방 데이터는 보령시 재해예방 및 응급복구사업 5건의 상세정보로 연번, 사업명, 위치, 사업량, 사업시작년도, 사업종료년도, 총사업비, 총사업비 상세, 담당부서, 데이터기준일 등 총 10개 항목 5건의 정보를 제공합니다.재해대응기관은 지역 재해대비 현황 파악과 대응계획 수립에 활용하고, 건설업계는 재해예방 관련 사업 참여와 기술개발 방향 설정에 활용하며, 연구기관은 재해예방 정책 효과성 분석과 재해관리 연구에 활용할 수 있습니다. 또한 시민들은 거주지역 재해예방 사업현황 파악과 안전정보 확인에 기여할 수 있습니다.
