description_portal: 전체 피해 건수는 2019년에 40~50대를 중심으로 정점을 찍은 후 감소세를 보이다가, 최근 2024년부터 다시 반등하는 추세입니다. 가장 눈에 띄는 변화는 피해 중심축의 이동입니다. 과거 핵심 타깃이었던 30~40대의 비중은 눈에 띄게 줄어든 반면, 20대 이하와 60대 이상의 비중이 급격히 확대되었습니다.특히 60대는 2016년 1,261건에서 2025년 5,801건으로 약 4.6배 폭증하며 가장 가파른 상승 곡선을 그렸고, 20대 이하 역시 2022년부터 꾸준히 5,000건 이상을 기록하며 고위험군으로 부상했습니다. 이는 범죄 수법이 대출 빙자형(중장년층)에서 기관 사칭 및 디지털 취약점 공략(청년·고령층)으로 교묘하게 변모했음을 시사합니다.
