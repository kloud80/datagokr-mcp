description_portal: 이 데이터는 경찰청이 일회성으로 제공하는 데이터로 2020년 8월 14일 기준으로 보유한 과학수사 장비의 현황을 정리한 자료로, 장비별 구분, 이름, 설명이 포함되어 있다. 데이터에는 CCTV 판독시스템, 지문자동검색시스템, 족윤적시스템, 몽타주시스템, 뇌지문탐지시스템 등 다양한 과학수사 장비의 명칭과 주요 기능, 용도가 상세히 기술되어 있다. 본 자료는 과학수사 장비의 체계적인 관리와 효율적 운용을 위해 작성되었으며, 경찰청의 과학수사 역량 강화 및 범죄수사 효율화에 기여한다. 데이터는 공공데이터포털을 통해 개방되며, 과학수사 연구 및 장비운용 개선을 위한 참고자료로 활용된다. 본 자료는 첨단 과학기술을 접목한 범죄수사의 기반자료로 중요한 의미를 가진다.
