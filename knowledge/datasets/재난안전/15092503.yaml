description_portal: '2023년 건설재해예방전문지도기관에 대한 평가 결과로 지정관서, 기관명, 지도구분, 주소, 전화번호, 평가등급 데이터를 제공합니다.(매년 평가 진행, 고용노동부 공표일: 2024. 1. 25.)평가목적: 중·소규모 건설현장의 기술지도를 담당하는 재해예방 전문지도기관의 업무수행능력을 평가하고 그 결과를 반영하여 차등 관리함으로써 중․소규모 건설현장에 대한 안전보건서비스 수준 향상을 유도*산업안전보건법 시행규칙 제91조(건설재해예방전문지도기관의 평가 기준 등)① 공단이 법 제74조제3항에 따라 건설재해예방전문지도기관을 평가하는 기준은 다음 각 호와 같다.1. 인력ㆍ시설 및 장비의 보유 수준과 그에 대한 관리능력2. 유해위험요인의 평가ㆍ분석 충실성 및 사업장의 재해발생 현황 등 기술지도 업무 수행능력3. 기술지도 대상 사업장의 만족도'
