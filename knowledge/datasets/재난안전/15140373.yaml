description_portal: '국토안전관리원에서 수행중인 연도별 안전관리 수준평가 현황을 공사규모별로 확인 할 수 있는 엑셀형식 데이터 파일입니다.안전관리 수준평가는 건설공사 참여자들의 자발적인 안전관리 역량 강화를 유도하기 위해 안전관리 수준을 평가하는 제도입니다. 이 평가는 「건설기술진흥법」에 근거하며, 국토교통부에서 주관하고 국토안전관리원에서 위탁 수행합니다.평가 대상 및 목적목적: 건설공사 참여 주체별 안전관리 수준을 파악하고, 평가 결과를 공개하여 자발적인 안전관리 활동을 촉진합니다.평가 대상: 총공사비 200억 원 이상(전기·소방·통신 공사비 제외, 관급자재비 포함)의 공공 발주 건설공사 참여자입니다. 2025년부터는 민간 공사로 단계적 확대가 예정되어 있습니다.참여자: 발주청, 시공자, 건설사업관리용역사업자(감리) 등이 포함됩니다.'
