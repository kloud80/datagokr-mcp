description_portal: 부산광역시 사상구 어린이활동공간 관리대상 현황에 대한 데이터로 시설명, 소재지 등(2026.1.1. 기준)을 제공합니다어린이활동공간이란 어린이가 주로 활동하거나 머무르는 공간으로서 어린이놀이시설, 어린이집 등 영유야 보육시설, 유치원, 초등학교 등 [환경보건법 시행령] 제1조의2에서 정의하는 시설을 말합니다.어린이활동공간의 위해성 관리(환경보건법 제23조제1항내지 제9항)-어린이활동공간 관리자는 환경안전관리기준을 지켜야하며(제4항) 시장,군수,구청장 또는 교육감은 어린이활동공간 관리자가 환경안전관리기준을 위반하는 경우에는 시설개선이나 환경안전관리기준을 준수하도록 명할 수 있습니다.(제5항)-어린이활동공간 관리자는 확인검사를 받아야하며(제6항), 시장,군수,구청장 또는 교육감은 확인검사를 받지 아니한 어린이활동공간 관리자에게 확인검사를 받도록 명할 수 있습니다.(제9항)
