summary_user: 충주시 관내 산림과 주변 지역의 산불발생 위험도를 평가해 지점(주소·위도·경도) 단위로 정리한 시군구 범위 데이터로, 관리번호·읍면동·위험 점수·등급을 담는다. 충주시 산림·재난 담당자나 분석가가 '충주시에서 산불 위험 등급이 높은 읍면동은 어디이고, 감시 인력과 예방 캠페인을 어디에 먼저 배치할까'를 정할 때 쓴다. 전역 조인 키가 없어 읍면동 이름이나 좌표로 대피시설·소방 등 다른 재난안전 데이터와 공간적으로 겹쳐 쓴다.
limits: 위험 점수와 등급은 특정 시점 평가 기준에 따른 상대적 위험도이며, 이벤트성으로 한 번 생성된 뒤 갱신되지 않는 자료라 실시간 산불 위험이나 당일 기상 반영 위험도로 해석하면 안 된다. 응답은 GeoJSON 형태(type·properties·geometry)로 오므로 속성값은 properties 안에서 꺼내 써야 하고, 다른 데이터와 연결할 공통 코드가 없다.
