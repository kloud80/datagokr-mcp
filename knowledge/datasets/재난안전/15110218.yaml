description_portal: '본 데이터는 2022년 공공데이터 기업매칭 지원사업을 통해 구축된 충청북도 충주시 재난위험요인DB 중 산불발생위험지역 현황 자료입니다.충주시 관내 산림 및 주변 지역의 산불발생 위험도를 평가하여 공간 단위로 정리한 데이터로, 산불 예방 정책 수립과 대응계획 수립에 활용됩니다.주요 항목으로는 관리번호, 읍면동, 주소, 위도·경도 좌표, 산불위험 점수, 등급 등이 포함되어 있으며,위험도 점수는 지역의 산림 밀도, 경사도, 기상 조건, 인접 시설, 과거 산불 이력 등 다양한 위험인자를 종합 평가하여 산출됩니다.등급은 해당 점수를 기준으로 상대적인 산불 발생 가능성 수준(예: 매우높음/높음/보통/낮음 등)으로 구분됩니다.해당 데이터는산불 예방 우선순위 지역 도출지역별 대응 자원 배치 전략 수립실시간 모니터링 체계 연계산림보호 및 안전 캠페인 대상 지역 선정등에 활용할 수 있으며, 위도·경도 기반의 공간분석(GIS) 자료로도 적합합니다.※ 본 데이터는 해당 시점의 평가 기준에 따른 상대적 위험도 정보를 제공하며, 실제 산불발생 가능성은 기상 여건 등 복합 요인에 따라 달라질 수 있음에 유의해야 합니다.'
