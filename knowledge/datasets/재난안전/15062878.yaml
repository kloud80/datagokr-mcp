summary_user: 서울 송파구 안의 민방위 대피시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·시설구분·도로명/지번 주소·위도·경도·면적·대피가능인원·개방여부·관리기관을 포함한다(CSV 약 33KB). 주민이나 재난 대응 담당자가 '우리 동네에서 가장 가까운 민방위 대피소는 어디이고 몇 명까지 들어갈 수 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 시군구의 같은 민방위대피시설 파일과는 같은 항목 구성으로 이어 붙이고, 주소나 위도·경도로 지도 데이터나 다른 대피·구호시설과 공간적으로 맞춰 쓴다.
