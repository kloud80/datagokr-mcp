legal_basis_portal: '소방기본법 제10조 (소방용수시설의 설치 및 관리 등)제1항: 시·도지사는 소방활동에 필요한 소화전(消火栓), 급수탑(給水塔) 및 저수조(貯水槽)(이하 `소방용수시설`이라 한다)를 설치하고 유지·관리하여야 한다. 다만, 「수도법」 제45조에 따라 소화전을 설치하는 일반수도사업자는 설치 사실을 관할 소방서장에게 통지하고, 그 소화전을 유지·관리하여야 한다.제2항: 시·도지사는 소방자동차의 진입이 곤란한 지역 등 화재발생 시 초기 대응이 필요한 지역으로서 대통령령으로 정하는 지역에 소방호스 또는 호스 릴 등을 소방용수시설에 연결하여 화재를 진압하는 시설이나 장치(이하 **`비상소화장치`**라 한다)를 설치하고 유지·관리하여야 한다.제3항: 소방용수시설과 비상소화장치의 설치기준은 행정안전부령으로 정한다.'
