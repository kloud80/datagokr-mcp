summary_user: 광주 광산소방서 관할의 소화전·급수탑·저수조·비상소화장치 등 소방용수시설을 시설 1건당 1행으로 담은 위치 원장으로, 주소와 위경도, 담당 안전센터, 사용가능 여부, 설치연도, 배관 지름·깊이, 출수압력을 함께 담는다. 소방·안전 분석가나 지자체 담당자가 '우리 동네 반경 안에 쓸 수 있는 소화전이 있는가, 용수시설이 비어 있는 구역은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 위경도로 화재 발생·대피시설 등 다른 위치 데이터와 공간 결합하거나, 시군구코드·안전센터명으로 같은 기관 데이터와 이어 쓴다.
limits: 실측 컬럼에서 전국 공통 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 좌표로만 연결된다. 범위는 광산소방서 관할 시설 개별 단위라 다른 소방서·시도 현황은 별도 파일을 모아야 한다.
