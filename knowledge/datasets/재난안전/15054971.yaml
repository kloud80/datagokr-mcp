description_portal: '소방용수시설이란 화재 진압 시 소방자동차에 물을 공급하거나 직접 화재를 진압하기 위해 설치된 필수 시설을 말합니다. 시민의 생명과 재산을 보호하기 위한 핵심 기반 시설이므로 다음 내용을 반드시 확인하여 주시기 바랍니다.소방용수시설의 종류소화전: 도로 및 인도에 설치되어 소방호스를 연결해 용수를 공급하는 장치입니다.급수탑: 소방차량 위쪽에서 다량의 물을 신속하게 급수하기 위한 시설입니다.저수조: 상수도 연결이 어려운 상황에 대비하여 지면에 물을 저장해 둔 시설입니다.비상소화장치: 소방차 진입이 곤란한 지역에 설치되며, 소방대 도착 전 인근 주민이 초기 진압에 사용할 수 있는 장비입니다.'
