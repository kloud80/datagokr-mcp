summary_user: 대전광역시경찰청 산하 6개 경찰서(중부·동부·서부·대덕·둔산·유성)별로 2020~2024년 5대 범죄(살인·강도·강간강제추행·절도·폭력)의 발생건수와 검거건수를 연도별로 집계한 작은 CSV 파일이다. 대전 시민이나 분석가가 "우리 동네 관할 경찰서에서 최근 5년간 절도나 폭력이 늘었나, 검거율은 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 관서명(경찰서 이름)을 자치구 이름에 직접 매핑하거나 같은 기관의 다른 범죄통계와 이름으로 맞춰 붙여야 한다.
