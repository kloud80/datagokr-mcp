summary_user: 전북특별자치도 소방본부와 덕진·완산·군산·익산·정읍·남원·김제·완주·순창·고창·부안·무진장 등 산하 소방서별로 소방준감부터 소방사까지 계급별 소방공무원 수를 집계한 표로, 421바이트 크기의 작은 CSV 파일이다. 도민이나 분석가가 '전북 지역 소방서마다 소방 인력이 몇 명이고 계급 구성은 어떻게 되는가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 관서명(소방서 이름)을 직접 맞춰 이어야 하며, 소방서별 화재 발생·119안전센터 데이터와 관서명 기준으로 붙여 인력 대비 출동 부담을 보는 식으로 쓴다.
description_portal: 이 데이터는 전북특별자치도 소방본부 및 산하 소방서들의 인력 현황을 계급별로 상세하게 정리한 자료입니다. 소방준감부터 소방사까지 각 계급에 해당하는 소방공무원의 수를 본부, 덕진, 완산, 군산, 익산 등 각 관서별로 집계하여 보여줍니다. 이를 통해 전북특별자치도 내 소방 조직의 전체적인 규모와 각 지역별 인력 배치 현황을 한눈에 파악할 수 있습니다. 본 자료는 지역별 소방력의 분포와 조직 구성을 분석하고, 공공안전 및 재난 관리 시스템의 인적 자원 구조를 이해하는 데 중요한 기초 정보를 제공합니다.
