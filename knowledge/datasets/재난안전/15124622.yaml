summary_user: 인천광역시 남동구에서 기계설비 성능점검 대상에 해당하는 일반건축물을 건물 한 동씩 담은 목록 파일로, 건물명·용도·주소·연면적(제곱미터)을 담는다. 관리주체나 설비 점검업체가 '남동구에서 성능점검을 받아야 하는 건물이 어디이고 규모가 얼마인가'를 확인하거나, 구 단위 점검 대상 분포를 파악하는 데 쓴다. 전역 조인 키(건축물대장 번호 등)가 없어 다른 건축물·안전 데이터와는 주소나 건물명을 맞춰 붙여야 한다.
limits: 고유 식별 번호가 없어 건축물대장·점검 결과 데이터와의 연결은 주소·건물명 매칭에 의존하므로 표기 차이로 누락·오매칭이 생길 수 있다. 범위는 남동구 한 곳에 한정되며, 이 목록만으로 실제 점검 이행 여부나 점검 결과는 알 수 없다.
