summary_user: 한국전기안전공사 사업소 60개소가 2024년에 실시한 전기설비 정기검사 결과를 사업소별·구분(발전, 수전)별 합격 건수와 불합격 건수로 집계한 전국 단위 파일 데이터입니다. 분석가나 지역 안전 담당자가 '어느 사업소 관할에서 정기검사 불합격 비율이 높은가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소 명을 이름으로 맞추거나 같은 기관의 다른 데이터와 연결해야 합니다.
limits: 설비·건물 단위의 건별 검사 원장이 아니라 사업소별 합계라서 개별 시설의 검사 결과나 위치는 알 수 없습니다. 사업소 코드 같은 공통 키가 없어 행정구역 등 외부 데이터와는 이름 매칭으로만 연결됩니다.
