summary_user: 경기도 지진조기경보시스템이 긴급재난문자(EAS) 제어 명령을 보낸 뒤 받은 응답을 발송 건별로 담은 원천 기록으로, 지진통보 관리문서 정보·전송결과·에러코드·등록일자·순번으로 이루어진다. 재난안전 담당자나 분석가가 "지진 조기경보 메시지가 정상 전달됐는지, 실패했다면 어떤 오류였는지"를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 재난 특보·대피시설 데이터와는 등록일자나 기관 기준의 이름 매핑으로만 느슨하게 이어 쓴다.
description_portal: 「지진조기경보시스템 EAS 제어 발송 응답 결과」 데이터는 경기도가 제공하는 지진 조기경보 관련 응용 데이터로, 지진 발생 시 긴급재난문자(EAS, Emergency Alert System) 제어 명령이 발송된 후의 응답 상태를 기록한 자료입니다. 주요 항목은 지진통보관리문서, 전송결과, 에러코드, 등록일자, 순번으로 구성되어 있으며, 각 발송 건별로 시스템 응답을 확인할 수 있습니다. 본 데이터는 지진 조기경보 메시지가 실제로 얼마나 정상적으로 전달되었는지, 오류 발생 여부는 무엇인지 등을 점검하는 데 활용됩니다.
