summary_user: 한국산업안전보건공단 인증원이 안전인증한 가설기자재(파이프서포트 등)를 인증 건별로 담은 전국 단위 파일로, 인증품명·안전인증번호·제조수입회사·형식모델·정격 용량등급·인증일자와 인증취소·반납 사유 및 일자를 담는다. 건설 현장 관리자나 발주처가 반입하려는 가설기자재 모델이 안전인증을 받았는지, 인증이 취소·반납되지 않았는지 확인하는 데 쓴다. 안전인증번호(kosha_safety_cert_no)를 키로 보호구·기계 등 다른 안전인증 현황이나 제품 표시 정보와 이어 쓴다.
description_portal: 한국산업안전보건공단 인증원에서 제공하는 가설기자재 인증 현황으로 인증품명, 안전인증번호, 신청사업장명, 형식모델, 정격 등을 확인할 수 있도록 보호구에 대한 정보를 제공합니다.*산업안전보건법 제84조(안전인증) ① 유해ㆍ위험기계등 중 근로자의 안전 및 보건에 위해(危害)를 미칠 수 있다고 인정되어 대통령령으로 정하는 것(이하 “안전인증대상기계등”이라 한다)을 제조하거나 수입하는 자(고용노동부령으로 정하는 안전인증대상기계등을 설치ㆍ이전하거나 주요 구조 부분을 변경하는 자를 포함한다. 이하 이 조 및 제85조부터 제87조까지의 규정에서 같다)는 안전인증대상기계등이 안전인증기준에 맞는지에 대하여 고용노동부장관이 실시하는 안전인증을 받아야 한다.
