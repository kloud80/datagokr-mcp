description_portal: '- 광주광역시 CCTV통합관제센터에서 관제 및 운영중인 연도별 CCTV 현황에 대한 자료입니다.- 광주광역시 CCTV통합관제센터는 광주광역시에서 관리하고 있으며 5개의 구(동구, 서구, 남구, 북구, 광산구)에 설치되어 운영 중에 있습니다.- 이 자료는 CCTV를 설치목적 별로 구분하고 있으며 그 용도는 방범, 어린이보호(보호구역), 어린이보호(도시공원), 초등학교 교내, 차량번호인식, 재난(산불, 하천), 교통정보수집, 주정차단속연계로 나누어져 있습니다.- 이 자료는 광주광역시 5개 구에 설치된 CCTV의 용도별 현황 정보를 제공하는 데이터입니다.- 데이터 기준일: 2022년 12월 31일- CCTV 현황: 3,662개소, 9,878대'
