summary_user: 행정안전부 재난안전데이터 공유플랫폼이 제공하는 자연재난 발생 시 국민행동요령 콘텐츠를 담으며, 행동요령 문구(actRmks)와 콘텐츠 주소, 3~4단계 카테고리 코드·명칭으로 분류된 전국 단위의 비공간 안내 정보다. 국민이나 안내 서비스 개발자가 "태풍이나 지진이 났을 때 무엇을 해야 하나"를 재난 유형별로 찾아 보여 주는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 재난 특보·위험지역이나 대피시설 데이터와는 재난 유형 카테고리 명칭을 이름으로 맞춰 붙여 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 자연재난 발생 시 국민행동 요령 정보로, 콘텐츠 내용, 카테고리1명칭~카테고리3명칭 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바랍니다.※  링크의 데이터 상세 페이지에서 해당 데이터 이용신청이 가능하며, 승인 후 API 서비스키를 발급 받을 수 있습니다.
