description_portal: '- 전라남도 의용소방대 현황(본대, 지역대, 전문대, 전담대 수 및 본대, 지역대, 전문대, 전담대 대원 수 현황)에 대해 조회할 수 있습니다.- 전라남도 의용소방대는 지역 주민의 안전을 지키는 중요한 역할을 수행하는 자원봉사 조직입니다. 소방 활동을 보조하며, 화재 예방, 구조·구급 지원, 재난 대응 등 다양한 분야에서 활동하고 있습니다.- 설치 근거 : 「소방기본법」 제35조에 따라 각 시·군에 설치됩니다.- 주요 활동 : 1) 화재 진압 및 구조·구급 활동 지원 2) 재난 발생 시 초기 대응 및 피해 복구 지원 3) 소방 안전 교육 및 캠페인 실시 4) 지역 행사 및 축제에서의 안전 관리- 전라남도 의용소방대는 지역사회의 안전을 지키는 든든한 버팀목입니다. 관심 있는 분들의 많은 참여와 지원을 바랍니다.'
