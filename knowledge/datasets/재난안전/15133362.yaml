summary_user: 자연재해위험개선지구의 정비 현황을 지역별로 정비대상과 정비완료 수로 집계한 전국 단위 파일로, 285바이트 규모의 작은 비공간 표입니다. 지자체 방재 담당자나 분석가가 '우리 시도의 재해위험개선지구 중 정비를 마친 비율은 얼마인가'를 확인할 때 쓴다. 전역 조인 키가 없어 지역 이름을 행정구역 코드에 매핑하거나 같은 기관의 다른 방재 데이터와 지역명으로 맞춰 이어 쓴다.
description_portal: 호우,태풍 등 자연재해로 인한 재해피해 우려가 높은 지역에 대하여 7개 지구유형(침수위험, 붕괴위험, 고립위험, 유실위험, 해일위험, 상슴가뭄재해, 취약방재시설)으로 구분해 지구지정하여 위험을 관리합니다.국내·외 연구결과에서 재해예방사업의 효과는 잠재복구비용 등 편익이 비용 대비 3~4배입니다. '00년 이후부터 재해예방사업의 투자 규모가 증가할수록 인명(사망, 실종) 및 재산 피해는 감소합니다. 특히, '09년 중점 투자년도 기준으로 이전 재산피해액 평균은 약 15,130억원, 이후 재산피해액 평균은 약 4,093억원으로 약 4배 감소하였습니다.
