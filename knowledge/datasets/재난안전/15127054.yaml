summary_user: 화성도시공사가 운영하는 체육센터·공원·화장실 등 공공시설에 설치된 안심비상벨을 한 대씩 기록한 건별 현황 파일(csv 약 29KB)로, 설치 목적·장소 유형·세부 위치·도로명/지번 주소·위도·경도, 경찰·경비업체·관리사무소 연계 여부, 설치연도와 최종 점검 일자·결과를 담는다. 시민이나 안전 앱 개발자가 '동탄·봉담 체육센터 화장실이나 탈의실에서 가까운 비상벨이 어디에 있고, 경찰과 바로 연결되는가'를 확인하거나, 시설 관리자가 점검이 오래된 기기를 골라내는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표 기반 공간 결합이나 시설명 매칭으로 잇는다. 같은 방범 인프라 분야의 CCTV·안심지킴이집·보안등 현황이나 대피시설 데이터와 함께 지도에 올려 쓴다.
description_portal: '본 데이터는 화성도시공사가 운영하는 체육센터, 공원, 화장실 등 공공시설물 내에 설치된 **"안심비상벨 설치 및 운영 현황"**에 관한 통합 데이터입니다.위급 상황 발생 시 시민들이 즉각적인 도움을 요청할 수 있도록 설치된 비상벨의 위치와 관리 상태를 담고 있으며, 화성시의 "사회안전망" 구축 현황을 보여주는 중요한 자료입니다.1. 주요 제공 데이터 항목 (엑셀 데이터 기준)설치 위치 및 유형: 비상벨이 설치된 시설 명칭(동탄·봉담체육센터 등)과 구체적인 장소 유형(화장실, 탈의실 등) 및 세부 위치 정보를 제공합니다.운영 목적 및 방식: 방범용, 안전사고 예방 등 설치 목적과 단방향/양방향 등 통신 연계 방식을 명시합니다.유관기관 연계 현황: 경찰청, 경비업체, 관리사무소와의 실시간 연계 유무를 포함하여 비상 상황 발생 시 대응 체계를 파악할 수 있습니다.시설 상태 및 사양: 경보음, 경보위치 알림 등 부가기능 정보와 설치 연도, 최신 점검 일자 및 점검 결과 정보를 제공하여 기기의 신뢰도를 입증합니다.위치 정보: 위도와 경도 좌표를 포함하여 지도 기반 서비스(GIS)와의 결합이 용이합니다.2. 데이터의 전략적 가치 및 활용 분야스마트 안전 서비스 개발: 민간 지도 앱 및 내비게이션과 연계하여 "안심 귀가 서비스"나 "가까운 비상벨 찾기" 등 시민 체감형 안전 앱 개발의 핵심 데이터로 활용됩니다.안전 취약지구 분석: 비상벨 설치 밀도와 위치 정보를 분석하여 범죄 취약 지역을 도출하고, 신규 설치 및 순찰 강화 지역을 결정하는 행정 자료로 활용합니다.시설 관리 효율화: 최종 점검 일자와 점검 결과를 데이터화하여 체계적인 유지보수 계획을 수립하고 기기 고장으로 인한 안전 공백을 방지합니다.'
