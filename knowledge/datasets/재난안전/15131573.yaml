summary_user: 경기도 지진조기경보시스템의 메뉴 구조를 메뉴 한 건 단위로 담은 시스템 관리용 자료로, 메뉴단계·순서·상위 메뉴코드·메뉴명·경로·권한·사용여부·등록일자를 담는다. 시스템 구축·감사 담당자나 분석가가 '이 경보시스템은 경보 발송·수신·기관 연계 기능을 어떤 메뉴와 권한 체계로 나눠 운영하는가'를 파악할 때 쓴다. 다른 데이터와 잇는 전역 조인 키는 없으며, 내부적으로는 상위코드(up_cd)와 메뉴코드(menu_cd)로 메뉴 계층을 구성하고 외부 연결은 메뉴명이나 기관 단위 매핑으로만 가능하다.
description_portal: 「지진조기경보시스템 통보메뉴」 데이터는 경기도가 제공하는 시스템 관리용 자료로, 지진 발생 시 경보 발령을 관리하고 모니터링하는 기능별 메뉴 구조를 정리한 것입니다. 주요 항목은 메뉴단계, 메뉴순서, 상위코드, 메뉴코드, 메뉴명, 메뉴경로, 메뉴권한, 사용여부, 등록일자, 풀URL여부로 구성되어 있으며, 각 메뉴의 기능과 권한 정보를 제공합니다. 실제 시스템 운영과 관련된 세부 기능이 포함되어 있어, 지진조기경보시스템이 어떤 메뉴 구조를 통해 경보 발송, 수신, 시스템 관리, 기관 연계 등을 수행하는지 체계적으로 파악할 수 있습니다.
