description_portal: '- 전라남도 민방위 주민대피시설(총 794개소)에 대한 정보(시군별, 읍면동별, 민방위 주민대피시설 명칭, 도로명 주소, 확보면적, 대피 가능인원)를 조회할 수 있습니다.- 민방위 주민대피시설은 전쟁, 자연재해, 화재, 대규모 사고 등 국가적 위기 상황에서 주민들이 안전하게 대피할 수 있도록 마련된 장소입니다. 대한민국에서는 「민방위기본법」과 관련 지침에 따라 전국적으로 지정·운영되고 있습니다.- 주민대피시설의 주요 목적: 공습, 재난 등 위기 상황 발생 시 주민의 생명과 재산을 보호, 일시적인 대피 공간 제공, 위기 대응 및 민방위 훈련 장소로도 활용 가능-  대피 시 유의사항: 지정된 가까운 대피소 위치 미리 파악해두기, 라디오, 휴대전화, 손전등, 비상식량 등 준비, 상황에 따라 대피령에 즉시 따르기, 훈련 시 적극 참여해 비상 행동 요령 숙지'
