summary_user: 전라남도 민방위 주민대피시설을 시설 한 곳당 한 행으로 담은 파일로, 시군·읍면동, 시설 명칭, 도로명 주소, 확보면적, 대피 가능인원을 담는다(포털 설명 기준 총 794개소). 주민이 '우리 동네에서 가장 가까운 민방위 대피소는 어디고 몇 명까지 들어가나'를 확인하거나, 분석가가 읍면동별 대피 수용능력을 비교하는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 시군·읍면동 이름이나 도로명 주소를 매칭해 이어 써야 한다.
