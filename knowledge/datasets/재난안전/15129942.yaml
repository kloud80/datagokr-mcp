summary_user: 한국전기안전공사가 2024년 국가·공공기관 요청 등으로 실시한 특별안전점검을 점검 대상 시설 한 건씩 담은 건별 원천 데이터로, 점검유형(취약계절·선거시설·명절연휴·국제행사 등), 시도 소재지, 시설 명칭, 점검일자, 시설 유형, 전압·용량, 적합·부적합 결과를 전국 범위로 담는다. 지자체 안전담당자나 분석가가 "선거·명절·대형행사 때 어느 지역 어떤 유형의 시설에서 전기설비 부적합이 많이 나왔나"를 따지는 데 쓴다. 전역 조인 키가 없어 다른 시설 안전 데이터와는 시설 명칭이나 시도명을 맞춰 이어 써야 한다.
description_portal: 한국전기안전공사에서는 국가 및 공공기관 등에 요청에 따른 특별안전점검을 진행하고 있습니다.이 데이터는 2024년 한국전기안전공사에서 진행한 특별안전점검 내역을 점검유형(취약계절 안전점검, 정부요청 합동점검, 사고재발 방지점검, 안전정책 특별점검, 국내행사 안전점검, 수학능력 안전점검, 선거시설 안전점검, 명절연휴 안전점검, 국제행사 안전점검), 소재지(시 도별), 명칭, 점검일자, 유형상세(판매, 유통시설, 복지시설, 의료시설, 기타시설 등), 전압, 용량, 점검결과(부적합, 적합), 점검자를 제공하는 데이터입니다.
