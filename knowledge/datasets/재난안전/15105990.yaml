summary_user: 인천광역시 소방본부가 화재안전 중점관리대상으로 선정한 건축물·시설을 한 건씩 담은 목록으로, 대상 유형(구분)·대상명·지번 및 도로명 주소·지상층과 지하층·연면적·관리 등급을 기록한다. 시민이나 건물 관계자가 우리 동네의 어떤 건물이 중점관리대상이고 몇 등급인지 확인할 때, 또는 분석가가 인천 내 고위험 대형 시설의 분포와 규모를 파악할 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 주소(지번·도로명)나 대상명을 매칭해 이어 써야 하며, 소방용수·119안전센터 위치나 화재 발생 건별 자료와 함께 볼 때 주소 기반으로 연결한다.
description_portal: '*「화재의 예방 및 안전관리에 관한 법률」에 근거한 관련 화재안전 중점관리대상 선정 및 관리규칙에 따라 중점관리대상 선정인천광역시 중점관리대상 현황 공공데이터는 지역 내 주요 관리가 필요한 건축물 및 시설의 정보를 체계적으로 제공하는 자료입니다. 이 데이터는 안전 관리, 도시계획, 재난 대응 및 행정 점검에 활용됩니다. 주요 구성 항목은 구분을 통해 관리 대상의 유형을 분류하고, 대상명으로 시설이나 건물의 명칭을 명시합니다. 또한 지번주소와 도로명주소를 함께 제공하여 위치를 정확히 확인할 수 있습니다. 건물 구조와 관련해 지상층·지하층 정보를 기록하며, 연면적을 통해 규모를 파악할 수 있습니다. 마지막으로 등급 항목은 관리 중요도나 안전성 수준을 나타내어 행정기관이 우선적으로 관리해야 할 대상을 식별할 수 있도록 합니다. 이 자료는 도시 안전망 강화와 효율적인 시설 관리에 필수적인 기초 데이터입니다.'
