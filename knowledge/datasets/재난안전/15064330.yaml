description_portal: "본 통계는 청문 민원 서비스를 이용한 고객의 연령별 만족도를 세부 항목으로 나누어 분석한 결과입니다.연령별 만족도 추이: 종합만족도는 **60대 이상(92.8점)**에서 가장 높게 나타났으며, **30대(91.7점)**가 그 뒤를 이었습니다. 반면 **20대 이하와 40대(각 90.6점, 90.8점)**는 상대적으로 낮은 만족도를 보였습니다.항목별 강점: 모든 연령층에서 '청렴성' 항목이 93~95점대로 가장 높게 평가되었으며, 특히 60대 이상은 95.5점으로 경찰의 투명성을 높게 신뢰했습니다. **'담당자 응대'**와 '공정성' 항목 역시 전반적으로 우수한 평가를 받았습니다.상대적 취약 항목: **'시설 및 신속성'**과 '지원성' 항목은 80점대 후반에서 90점대 초반에 머물러 타 항목 대비 점수가 낮았습니다. 특히 20대 이하는 **지원성(89.4점)**과 시설(89.6점) 부분에서 가장 낮은 만족도를 보였습니다.청문 민원 서비스는 높은 청렴성을 유지하고 있으나, 저연령층이 체감하는 시설 편의성과 지원 서비스는 보완이 필요한 것으로 분석됩니다."
