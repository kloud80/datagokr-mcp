description_portal: 본 자료는 한국승강기안전공단의 안전검사에서 불합격 판정을 받은 승강기에 대한 사후관리 이력을 표준 스키마로 정리한 것입니다. 각 행은 한 건의 검사 결과를 의미하며, 필드는 승강기관리번호1·2, 검사차수, 검사일자, 불합격 처리기한, 등록일시로 구성됩니다. 관리번호는 동일 대상에 대한 복수 식별 체계를 반영하며, 검사차수는 최초·재검 구분을 나타냅니다. 불합격 처리기한은 개선조치 및 재검사 신청이 완료되어야 하는 목표일로, 검사일자와 일정 간격을 두고 설정됩니다. 날짜 값은 모두 YYYY-MM-DD 형식(일 단위)으로 제공되며, 등록일시는 행정시스템에 결과가 반영된 시점을 뜻합니다. 동일 관리번호가 검사차수 또는 일자에 따라 반복될 수 있어 변경 이력 추적이 가능하며, 한 번의 시설에 대해 여러 차수의 기록이 연속 등장할 수 있습니다. 데이터는 불합격 대상의 식별, 조치기한 준수 여부, 재검 진행 상태 등 사후관리 흐름을 일관된 형식으로 확인할 수 있도록 구성되었습니다.
