description_portal: 해당 데이터는 경기도 가평군 관내에서 발생한 산사태의 현황을 기록한 자료로, 자연재해로 인한 피해 상황을 파악하고 재해 예방 및 복구 대책 수립에 활용할 수 있는 기초 정보를 제공합니다. 데이터 항목에는 항목순번, 산사태 발생일자, 발생 지점의 지번주소, 피해규모, 데이터 기준일자 등이 포함되어 있습니다. 산사태는 집중호우나 태풍, 지반 약화 등으로 인해 산지의 토사나 암석이 급격히 붕괴되어 흘러내리는 현상으로, 주거지 및 도로, 농경지 등에 심각한 피해를 초래할 수 있습니다. 이 자료는 산사태의 발생 위치와 피해 수준을 체계적으로 관리하고, 향후 재해 대응 및 산림관리 정책 수립에 활용될 수 있습니다. 특히 산사태 위험 지역에 대한 사전 대비 및 주민 안전 확보에 중요한 참고 자료로 활용됩니다.
