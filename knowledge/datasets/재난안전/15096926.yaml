summary_user: 제주특별자치도에서 발생한 만 12세 이하 어린이 교통사고를 기준 연도와 도로 종류별로 묶어 사고 건수·사망자 수·부상자 수를 담은 집계 통계이며, 포털 설명상 2016~2020년을 다룬다. 제주 지역 교통안전 담당자나 분석가가 어린이 사고가 어떤 도로 유형에서 많이 나는지 확인해 보호구역 지정이나 안전시설 배치를 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 교통사고 데이터와는 연도·도로 종류 이름을 맞춰 붙여야 하며, 개념상 교통사고다발지역 표준데이터나 경찰 교통사고 통계와 같은 주제로 함께 본다.
description_portal: 이 데이터셋은 2016년부터 2020년까지 기간 동안 제주특별자치도 내에서 발생한 만 12세 이하 어린이 교통사고를, 도로의 종류별로 구분해 사고 건수, 사망자 수, 부상자 수를 집계한 공공 통계자료이다. 구체적으로 일반도로, 보행자 전용도로, 어린이보호구역 등 도로 유형에 따라 어린이 사고 발생 현황을 나눠 보여 주므로, 어떤 도로 유형에서 사고가 빈번한지 분석이 가능하다. 이 데이터는 보행 안전 대책 수립, 어린이 보호구역 지정 검토, 도로 설계 및 안전시설 배치, 정책 기반의 교통안전 계획 마련 등 행정 및 학술 목적에서 실질적인 기초 자료로 활용될 수 있다. 제공 기관은 제주특별자치도이며, 데이터는 CSV 형식으로 공개되어 누구나 접근 및 다운로드가 가능하다.
