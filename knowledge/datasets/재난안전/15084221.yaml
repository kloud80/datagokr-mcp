summary_user: 국토안전관리원이 관리하는 공공 안전취약시설물(D·E등급, 공동주택 제외)을 시설물 한 건씩 적은 CSV 파일로, 전국 212행에 시설물명·종별·주소·D·E등급 판정일·차기 점검일·사용제한 및 주민공지 여부를 담는다. 지자체 담당자나 분석가가 우리 지역에 사용이 제한됐거나 주민 공지가 된 취약시설물이 어디에 있고 다음 점검이 언제인지 확인하는 데 쓴다. 조인 키는 주소(address)뿐이라 같은 주소 필드를 가진 다른 시설·재난안전 데이터와 주소 일치로 이어 쓰며, 별도의 시설물 번호 키는 필드에 없다.
description_portal: '국토안전관리원에서 제공하는 공공시설물(공동주택 제외) 중 안전취약시설물(D,E등급)의 최근 D,E등급 판정일, 차기안전점검일, 사용제한여부, 주민공지여부 등이 포함된 CSV형식 파일데이터입니다.안전취약시설물은 「시설물의 안전 및 유지관리에 관한 특별법」(이하 시설물안전법) 상의 제1·2종 시설물에 해당하지 않으면서, 안전에 취약하거나 재난 발생 위험이 높아 지속적인 관리가 필요한 소규모 시설물을 의미합니다. 이러한 시설물은 국민 생활과 밀접한 관련이 있어 정기적인 안전 점검 및 유지관리가 중요하게 다루어집니다.관리 및 점검관리 주체: 주로 지방자치단체 및 관련 기관(국토안전관리원 등)에서 관리합니다.법적 근거: 「시설물안전법」에 따라 관리되며, 안전관리 의무가 강화되고 있습니다.점검 의무: 관리 주체는 해당 시설물에 대한 정기 안전 점검, 정밀 안전 진단 등을 실시해야 합니다. 특히 노후화되거나 재난 위험이 높은 시설물은 정밀 안전 진단이 의무화될 수 있습니다.정보 확인: 특정 시설물의 안전 관리 현황은 시설물통합정보시스템(FMS)에서 확인할 수 있습니다.'
