summary_user: 서울 서대문구가 관리하는 보안등을 한 개씩 담은 건별 위치 데이터로, 표찰명·지번주소·위도·경도·설치형태·관리기관을 기록한다. 주민이나 구청·분석가가 야간 귀갓길에 보안등이 부족한 골목이 어디인지, 범죄 취약지역에 추가 설치가 필요한지 따질 때 쓴다. 전역 조인 키는 없어 다른 방범 시설(CCTV·안전비상벨 등) 데이터와는 좌표 근접이나 지번주소 매칭으로 이어 쓴다.
description_portal: 「주택건설기준등에 관한 규정」 등에 따라 국민들의 안전한 생활환경 조성 및 편의 증진을 위하여 서울시 서대문구에서 관리하는  보안등 위치(위, 경도) 정보입니다.보안등 위치 정보 데이터는 도시의 안전과 보안을 강화하기 위해 설치된 보안등의 위치, 종류, 관리 정보 등을 담고 있는 데이터베이스입니다. 이 데이터는 위도와 경도 좌표를 포함하여 보안등이 정확히 어디에 있는지 알려주며, 설치된 지자체, 관리 주체 같은 세부 사항도 함께 제공합니다. 이 데이터를 활용해 범죄에 취약한 지역에 보안등을 추가로 설치하거나, 기존 보안등의 간격을 조절하여 도시의 야간 조도를 최적화할 수 있습니다.
