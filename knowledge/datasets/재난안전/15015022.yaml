summary_user: 부산광역시 영도구 관내 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 2.3KB)로, 운영주체·동명·시설명·위치(주소)와 음용수/생활용수 구분을 포함한다. 영도구 주민이 단수나 재난 때 우리 동네에서 물을 받을 수 있는 비상급수시설이 어디인지 찾거나, 분석가가 동별 비상급수시설 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어 다른 대피·구호시설 데이터와는 동명이나 주소 문자열로 맞춰 이어 써야 한다.
description_portal: 부산광역시 영도구 관내  민방위 비상급수시설 현황을 표기한 자료입니다. 해당 자료는 운영주체, 동명, 시설명, 위치(주소)를 포함하고 있습니다.분기별로 수질검사를 하고 있으며, 음용수는 1년 4회, 생활용수는 3년에 1회 수질검사를 실시합니다.1,2,4분기는 1리터 무균채수병에 채수하고, 3분기는 전 항목 검사로 2리터 유리병과 2리터 무균채수병에 채수합니다. 채수 후 보건환경연구원(만덕)에 시료를 운송하여 수질검사를 의뢰합니다. 수질검사 결과 부적합을 받은 시설에 한해 재검사 의뢰를 요청합니다.
