summary_user: 부산 강서구의 가로등(도로조명시설) 설치 현황을 도로명별 설치 대수(등수)로 정리한 집계 파일로, 파일 크기가 253바이트에 불과한 소규모 목록입니다. 주민이나 분석가가 "강서구의 어느 도로에 가로등이 몇 개 설치돼 있나"를 확인하거나, 야간 보행 안전·범죄예방 환경을 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명 문자열을 맞춰 연결해야 하며, 같은 기관의 보안등·CCTV 현황과 나란히 비교하는 정도로 이어 쓴다.
description_portal: 부산광역시 강서구 도로조명시설 설치대수에 대한 정보로서, 주요 가로등 설치 지역 및 설치대수 정보를 제공하는 데이터입니다.이는 야간 시간대 차량 및 보행자의 안전을 확보하고, 도시 미관을 증진하며, 범죄 예방에 기여하는 등 매우 중요한 공공 시설물의 관리 현황을 나타냅니다.이러한 정보는 강서구청 도시관리과에서 관리하며 공공데이터포털과 강서구청의 관련 부서를 통해 데이터 파일 형태로 제공하여 가로등 설치 지역 및 설치대수 정보를 확인하기 위하여 해당 포털에 접속하여서 열람할 수 있습니다.
