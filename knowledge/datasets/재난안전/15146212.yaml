description_portal: '서울특별시 소방용수시설 현황은 시설번호, 시설유형코드, 시도명, 시군구명, 시군구코드, 소재지도로명주소, 소재지지번주소, 위도, 경도, 상세위치, 안전센터명, 보호틀유무, 사용가능여부, 설치연도, 관할소방서명, 관할소방서전화번호, 데이터기준일자 등의 정보를 제공합니다.*용어설명 : 소방용수시설은 화재 진압을 위해 필요한 물을 안정적으로 공급하는 시설- 소방차나 소방대가 신속하게 물을 확보할 수 있도록 설치되며, 「소방기본법」과 「화재예방, 소방시설 설치·유지 및 안전관리에 관한 법률」 등에 의해 규정제공부서는 서울특별시 소방재난본부 재난대응과(02-3706-1413)입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
