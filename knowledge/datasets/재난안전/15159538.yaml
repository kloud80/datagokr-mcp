description_portal: 본 데이터는 경찰청 국제협력담당관실에서 관리하는 「경찰 주재관 및 인터폴 파견_현원기준_현황」 통계로, 2024년 기준 재외공관 등에 파견된 경찰 주재관과 인터폴 파견 인력의 배치 현황을 정리한 자료이다. 제공 항목은 구분, 지역, 국가, 도시, 계급별 현원(경무관·총경·경정·경감), 비고로 구성되어 있으며, 아시아·태평양, 북미, 중남미, 구주, 아중동 등 권역별 경찰 인력 배치 규모와 국가·도시별 파견 현황을 확인할 수 있다. 이를 통해 해외 치안협력 거점 분포, 국제공조수사 지원체계, 재외국민 보호 및 국외도피사범 송환 대응 기반 등을 분석할 수 있으며, 향후 주재관 증원·재배치, 국제기구 파견 확대, 권역별 치안수요 대응전략 수립 등에 활용할 수 있다.
