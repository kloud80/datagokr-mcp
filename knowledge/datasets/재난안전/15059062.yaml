summary_user: 경기도 내 유해화학물질을 취급하는 사업장을 한 곳씩 담은 현황 목록으로, 시군명·업체명·주소·업종·연간 취급량 상한(톤)·화학사고 발생 여부 기준일자·위도·경도를 담는다. 주민이나 지자체 안전 담당자가 '우리 시군이나 주거지 주변에 유해화학물질 취급 사업장이 어디 있고 취급 규모는 어느 정도인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명·주소 같은 이름 매핑이나 좌표 기반 공간 중첩으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 유해화학물질을 취급하는 사업장에 대한 현황을 정리한 자료로, 화학물질의 안전관리 및 사고 예방을 위한 기초 정보를 제공합니다. 항목에는 시군명, 업체명, 도로명주소 및 지번주소, 업종구분, 연간 취급량 상한선(톤 단위), 화학사고 발생 여부 기준일자, 사업자등록번호, 우편번호, 위도·경도 좌표(WGS84)가 포함되어 있습니다. 본 자료는 『화학물질관리법』에 따라 유해화학물질의 유통·사용·저장 사업장을 관리하고, 화학사고 예방 대책 수립, 고위험 사업장 집중관리, 환경영향평가 기반자료, 지자체 환경안전정책 추진 등에 활용될 수 있습니다.
