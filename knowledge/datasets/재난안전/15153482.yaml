summary_user: 전기시설 안전점검 결과를 전국 범위로 담으며, 필드 구성(시도명·점검연도·점검 건수와 비율로 보이는 항목)으로 보아 개별 시설 건별 원천보다 시도·연도 단위 집계에 가깝습니다. 분석가가 "어느 시도에서 전기시설 점검 부적합 비율이 높고 연도별로 어떻게 달라졌나" 같은 질문에 씁니다. 전역 조인 키는 없어 시도명(CTPV_NM)과 점검연도를 이름 매핑해 같은 시설 안전 부문의 가스 안전·시설물 점검 데이터나 시도별 통계와 이어 씁니다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 전기시설안전점검결과 정보입니다.\""
