description_portal: 본 자료는 경남지역 범인성 유해업소에 대한 단속 현황을 연도별로 정리한 자료로, 2016년부터 2025년까지의 단속 실적을 수록하였습니다. 성매매업소, 불법 게임장 및 기타 범인성 유해업소를 대상으로 실시한 단속 현황을 연도별로 비교·분석할 수 있도록 구성하였으며, 범죄 예방과 사회질서 확립을 위한 경찰의 지속적인 단속 활동을 확인할 수 있습니다. 또한 범인성 유해업소의 변화 추이와 단속 실적을 객관적으로 파악할 수 있는 기초자료로 활용할 수 있으며, 안전한 지역사회 조성과 건전한 영업질서 확립을 위한 경찰의 예방 및 단속 정책을 이해하는 데 도움을 주고자 합니다.
