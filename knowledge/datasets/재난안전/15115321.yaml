description_portal: '재난 및 안전관리 기본법, 재난문자방송 기준 및 운영규정에 따른 영도구 안전안내분자  발송 내역입니다○지난문자방송은 재난 발생으로 인한 인명 및 재산피해가 예상되는 때 그 피해를 예방하기 위하여 CBS* 수신 기능이 탑재된 휴대폰과 차량용 DMB** 수신기,  DMB 특수경보기 등의 매체를 통해 전달하는 문자방송    ** Cell Broadcasting Service : 휴대전화에 특정 수신ID(채널)를 입력시켜 기지국으로부터 전송되는 데이터 정보(문자)를 수신할 수 있도록 만든 이동통신시스템을 응용한 서비스    ** Digital Multimedia Broadcasting : 방송사업자의 채널을 이용하여 전송되는 데이터 정보를 수신할 수 있도록 만든 방송서비스 ○ 이동통신사(SKT, KT, LGU+)와의 협정에 따라 무료로 운영 ○ 개인정보 침해 없이 재난정보 전달 가능, 전국~읍면동 단위 송출 가능   - 휴대전화 번호 등록 없이, 기지국과 통신 중인 단말기는 문자 수신 가능'
