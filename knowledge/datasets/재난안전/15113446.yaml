summary_user: 광주광역시 서구에 설치된 가로등을 한 개씩 담은 건별 위치 자료로, 표찰번호·설치 지번주소·위도·경도를 행정단위 개별(주소·좌표) 수준으로 담는다. 구청 시설 담당자나 생활안전 분석가가 '야간 보행 경로 중 가로등이 드문 구간은 어디인가'처럼 조명 사각지대를 찾거나 유지보수 대상 가로등을 현장에서 표찰번호로 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도 좌표로 공간 결합하거나 지번주소를 문자열로 매칭해 CCTV·안전비상벨·보안등 같은 방범 인프라 위치와 겹쳐 본다.
description_portal: 본 데이터는 광주광역시 서구 지역 내 설치된 가로등의 위치 및 설치 정보에 관한 자료로, 표찰번호, 설치된 도로의 지번주소, 위도 및 경도 좌표를 포함하고 있습니다. 이는 각 가로등의 정확한 위치 및 식별 정보를 제공하여, 야간 보행 안전 확보, 도시 조명계획 수립, 시설 유지보수 및 도시방범 인프라 개선 등 다양한 행정·정책적 목적에 활용될 수 있습니다.또한 본 데이터는 2026년 4월 14일 기준의 최신 자료로, 총 9,048건의 상세 위치 정보가 CSV 형태로 제공되며, 공간정보(GIS) 기반 시스템과 연계 시 활용도가 매우 높은 공공시설물 위치정보 데이터입니다. 특히 좌표(위도/경도) 정보를 포함함으로써 지도 시각화 및 위치기반 분석에 최적화되어 있으며, 가로등 유지보수·점검 시 현장 기반 업무 효율성 향상에도 크게 기여할 수 있습니다.
