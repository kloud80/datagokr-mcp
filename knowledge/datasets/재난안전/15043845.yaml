summary_user: 한국가스안전공사가 관리하는 고압가스 분야(저장탱크·용기·실린더 등 가스용품) 해외 제조공장의 등록 현황을 공장 1곳당 1행으로 담으며, 등록번호·업소명·최초등록일·만료일·등록종류·제조기준·대표자·소재지·국가를 제공한다. 수입업자나 가스용품 사용 사업자가 특정 해외 공장이 국내에 등록돼 있는지, 등록이 언제 만료되는지 확인할 때 쓴다. 다른 데이터와 공통으로 쓸 조인 키는 없어 업소명이나 국가명 같은 이름 매칭으로만 연결한다.
description_portal: '한국가스안전공사에서 관리하는 해외제조공장 현황 정보(고압가스분야)입니다.고압가스 분야의 저장탱크, 용기, 실린더 등 가스용품에 대한 국외 제조공장 현황에 대한 정보가 수록되어 있습니다.해당 데이터는 등록번호, 업소명, 등록일자, 만료일자, 등록종류(유형), 제조기준, 대표자, 주소 및 소재국가 정보를 제공합니다.- 해당 자료는 산업통상자원부와 공동 검증을 통해 제공됩니다.(2025년 4월까지 수집 확인된 정보임을 참고바랍니다)- 해당데이터는 타 유관기관 또는 민간에서 수집 및 관리하는 정보와는 상이할 수 있습니다. - 해당데이터는 수시성 주기 데이터로 비정기적으로 제공됩니다.- 데이터기준일 : 2025년 4월 30일'
