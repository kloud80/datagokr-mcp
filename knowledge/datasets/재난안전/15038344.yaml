description_portal: '국토안전관리원에서 시설물 유지관리 사업 관련하여 3종 시설물 정보(시설물명, 시설물 구분, 시설물 종류(공동주택 제외), 지정일자, 3종지정기관)를 정리하여 "25년 12월 말 기준의 파일데이터(csv)형식으로 개방합니다.3종 시설물이란 시설물의 안전 및 유지관리에 관한 특별법에 따라 안전 관리가 필요한 소규모 시설물이나 재난 발생 위험이 높거나 지속적으로 관리해야 하는 시설물을 의미합니다.3종 시설물의 범위는 아래와 같습니다. 토목 분야: 준공 후 10년이 경과된 교량, 터널, 육교, 지하차도, 옹벽, 그 밖의 건설공사를 통해 만들어진 구조물과 부대시설.건축 분야: 준공 후 15년이 경과된 공동주택, 공동주택 외 건축물'
