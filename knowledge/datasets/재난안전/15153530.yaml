summary_user: 지하철 노선·역·출구별 불법촬영(성범죄) 위험도 등급을 담은 데이터로, 노선 코드·역 코드·이름과 기준 연도, 위험 등급(RSK_GRD)으로 구성되며 범위는 전국입니다. 이용자나 안전 분석가가 '내가 자주 쓰는 역 출구의 불법촬영 위험 등급이 높은가'를 확인하거나 순찰·CCTV 보강 대상 역을 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 지하철·역 데이터와는 노선명·역명 또는 노선·역 코드의 이름 매핑으로 이어 써야 한다.
