description_portal: '- 전라남도 소방본부 119구급대  조직(지역대 포함), 차량(A형, 음압, 예비) 및 인력 운영(응급구조사 1급, 응급구조사 2급, 간호사 등), 119항공대 현황에 대해 조회하실 수 있습니다.- 전라남도는 도민의 생명과 안전을 보호하기 위해 119구급대 운영에 만전을 기하고 있습니다. 각 시군별로 119구급대 및 구조대가 배치되어 있으며, 전문적인 응급처치와 구조 활동을 수행하고 있습니다.- 전라남도는 구급대원들의 역량 강화를 위해 다양한 훈련과 경연에 참여하고 있습니다. 최근 개최된 제6회 대한민국 119구급활동 경연대회에서는 전라남도 소속 대원들이 우수한 성과를 거두었습니다.- 전라남도는 119구급대와 구조대의 전문성을 바탕으로 도민의 안전을 최우선으로 하고 있습니다.'
