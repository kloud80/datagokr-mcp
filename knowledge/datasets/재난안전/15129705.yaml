description_portal: 서울시설공단 자산관리혁신처에서 매년 수행한 자체 정밀안전점검 대상 시설물의 연도별 현황 정보를 제공합니다. 해당 데이터는 각 연도별로 공단이 직접 점검을 수행한 교량, 지하차도 등 자동차전용도로 내 주요 시설물의 명칭, 시설물 종류, 소속 노선, 준공년도 등의 기본 정보를 포함하고 있습니다. 정밀안전점검 결과나 기술적 세부사항보다는, 어느 해에 어떤 시설물들이 점검 대상이었는지를 한눈에 파악할 수 있도록 구성된 개요형 데이터입니다. 본 자료는 도로 인프라 자산의 주기적 관리 이력 분석, 시설물별 유지관리 계획 수립, 안전관리 체계 점검 등 다양한 행정·연구 목적으로 활용될 수 있습니다.
