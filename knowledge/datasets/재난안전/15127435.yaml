summary_user: 울산광역시 중구에 설치된 가로등을 한 개씩 기록한 건별 원천 파일로, 분전함 표찰·등주 표찰 번호와 위도·경도 좌표를 담는다. 구청 담당자나 주민이 특정 위치 가로등의 고장 신고·유지보수 대상을 표찰 번호로 찾거나, 분석가가 야간 보행 안전 취약 구간을 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표로 공간 결합하는 방식으로 이어 쓰며, 같은 지역의 CCTV·보안등·안전비상벨 위치 데이터와 겹쳐 보는 데 쓴다.
description_portal: 울산광역시 중구 가로등현황에 대한 자료로, 울산광역시 중구 가로등현황정보를 제공합니다. 본 데이터는 미용업 현황의 분전함표찰, 등주표찰, 위도, 경도  등의 현황을 확인할 수 있습니다. 데이터 출처는 울산광역시 중구 건설과 건설행정계(052-290-3810)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 3월 26일입니다. 다음 업데이트는 2027년 3~4월 중 제공됩니다.본 자료는 울산광역시 중구 가로등의 위치별 설치 현황 파악, 도로 조명시설 관리 및 유지보수 계획 수립, 야간 보행 안전 및 도시환경 개선을 위한 정책 수립 등의 기초자료로 활용할 수 있습니다.
