description_portal: 부산광역시의 안전관리업무 이행 실태가 우수한  업소를 안전관리  우수 다중이용업소의 데이터를 제공합니다.(업종, 업소명, 도로명 주소, 관할소방서,  위도, 경도, 인증시작일, 인증종료일, 신규, 갱신) ○  우수업소 지정 요건 ( 최근 3년 동안)1. 피난방화시설 폐쇄, 훼손 등 위반행위가 없을 것, 2.소방, 건축, 전기, 가스 관련 법령 위반 사실이 없을 것, 3. 화재 발생 사실이 없을 것, 4. 종업원 소방교육 또는 소방훈련을 정기적으로 실시하고 보관하고 있을 것 ○ 안전관리 우수업소 인센티브 제공  - 소방안전교육 ․ 화재안전조사 2년간 면제(갱신 대상 포함)  - 우수업소에 대하여 소방서장 표창 수여  - 부산광역시 홈페이지 안전관리 우수업소 공개(사전정보공표)  - 네이버 통합검색 및 안전관리 우수업소 검색서비스 표출(PC/모바일)
