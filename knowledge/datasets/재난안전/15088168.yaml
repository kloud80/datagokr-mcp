summary_user: 부산광역시 소방이 지정한 안전관리 우수 다중이용업소를 업소 한 곳당 한 행으로 담은 건별 명부로, 업종·업소명·도로명 주소·위도·경도·관할 소방서·인증 시작일과 종료일·신규/갱신 구분을 포함한다(시도 범위, 15KB 규모의 CSV). 시민이 방문하려는 노래방·음식점 같은 다중이용업소가 최근 3년간 위반·화재 없이 안전관리 우수업소로 인증받았는지, 인증이 언제까지 유효한지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞추거나 위도·경도로 지도 위에 겹쳐 소방서·대피시설 등 재난안전 데이터와 함께 본다.
limits: 업소 고유번호 같은 공통 키가 없어 인허가·소방 점검 데이터와 정확히 1:1로 잇기 어렵고, 이름·주소 매칭에 의존해야 한다. 부산광역시 지정 업소만 담으므로 다른 시도나 전국 현황은 이 데이터로 알 수 없다.
