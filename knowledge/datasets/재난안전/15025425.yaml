summary_user: 전국 소방항공대 헬기 활동을 연도·소방본부별로 집계한 통계 파일로, 총운항시간·총구조인원과 구조·구급·화재출동·산림화재·홍보·교육훈련·순찰배치·업무지원·정비시험 등 목적별 출동 건수를 담는다. 분석가가 "어느 소방본부에서 헬기가 구조·구급과 산불 대응 중 어디에 주로 쓰였고, 운항시간 대비 구조인원은 얼마인가"를 비교할 때 쓴다. 전역 조인 키가 없어 다른 소방 통계와는 연도와 소방본부(시·도) 이름을 맞춰 연결해야 한다.
