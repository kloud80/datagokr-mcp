summary_user: 대전광역시 전역에 설치된 차량방범용 CCTV를 한 대(관리번호) 단위로 담은 건별 시설 목록으로, 관리기관·CCTV 유형·지번·도로명 주소·좌표·관할 경찰서를 담는다. 시민이나 분석가가 "우리 동네 주요 도로나 주차 구역에 차량방범 CCTV가 어디에 있는가", "자치구·경찰서 관할별로 차량방범 CCTV가 얼마나 고르게 깔려 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표로 공간 결합하거나 관할 경찰서·관리기관 이름을 맞춰 연결하며, 방범용 CCTV·안전비상벨 같은 생활안전 인프라 데이터와 겹쳐 보는 용도에 맞다.
limits: 표준 행정코드 같은 공통 조인 키가 없어 다른 데이터와 연결하려면 이름 매핑이나 주소·좌표 기반 결합이 필요하다. 범위는 대전광역시 한 곳에 한정된다.
