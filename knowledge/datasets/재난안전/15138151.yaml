description_portal: '본 자료는 한국승강기안전공단의 안전검사 업무에서 사용하는 승강기 제원코드 관리 현황을 표준 형식으로 정리한 데이터입니다. 각 레코드는 검사 입력값에 대응하는 코드 정의를 의미하며, 필드는 코드종류, 코드, 코드상세, 등록일자로 구성됩니다. 코드종류는 항목군(예: 브레이크 유형 B1, 설치 위치 B2, 적용 여부 B3, 정지장치 B4, 에스컬레이터 부품형식 B5, 고정부재 B6, 구동방식 B7 등)을 식별하고, 코드에는 해당 군 내 세부 값이 부여됩니다. 코드상세는 “로프브레이크/이중브레이크/카브레이크”, “카벽/천정/해당없음”, “클램핑/멈춤쇠/비상정지/크리핑”, “스텝/팔레트/벨트”, “로프/랙피니언/체인/스크류너트/유압구동” 등 실제 검사 입력에서 선택되는 의미값을 서술합니다. 또한 완충기 분류(선형에너지축적형·에너지분산형 등), 베어링 형태(바빗식·체결식), 단차 유무, 피트 사다리 형태, 균형로프/체인 등 안전·구조·운전 관련 세부 항목이 포함됩니다. “해당없음/기타”와 같은 예외 코드 및 “교체안함/교체함”, “완성제조사/조립제조사”와 같은 관리용 코드도 함께 관리되며, 등록일자는 코드 정의가 시스템에 반영된 시점을 나타냅니다.'
