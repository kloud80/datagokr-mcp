summary_user: 부산광역시 북구에서 열리는 민방위 교육의 종류, 교육일자·종료일자, 소요시간, 대상, 장소, 소속 민방위대를 교육 건별로 담은 작은 CSV 파일(1,847바이트)이다. 북구 민방위 대원이 자기 연차·소속에 해당하는 교육이 언제 어디서 열리는지 확인하거나, 구청 담당자가 교육 일정과 장소 배분을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교육장소명이나 민방위대명을 이름으로 맞추거나 같은 기관(북구) 데이터끼리만 연결한다.
limits: 교육장소에 좌표나 표준 코드가 없어 대피시설 원장 등과 바로 결합할 수 없고, 이름 매칭에 의존해야 한다. 북구 한 시군구 범위의 데이터라 다른 지역 교육 일정은 담지 않는다.
