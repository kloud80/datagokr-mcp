summary_user: 인천시에 등록된 기계설비성능점검업 업체를 업체 1곳당 한 행으로 담은 등록 원장 파일로, 등록번호·등록일자·상호명·위치·연락처를 담는다(csv 약 3.7KB). 건물 관리주체가 인천 지역에서 기계설비 성능점검을 맡길 등록 업체를 찾거나, 분석가가 지역 내 점검업체 등록 현황과 등록 시기를 살피는 데 쓴다. 전역 조인 키가 없어 다른 시도의 성능점검업 현황이나 시설 안전 데이터와는 상호명·위치(주소) 같은 이름 매핑으로만 이어 쓴다.
description_portal: 기계설비산업의 발전을 위한 기반을 조성하고 기계설비의 안전하고 효율적인 유지관리를 위해 제정된 기계설비법은 2020.4.18. 시행되어 설비의 안전한 사용 및 쾌적한 환경을 유지하기 위해 기계설비성능점검을 받도록 제정하였으며 인천시는 기계설비성능점검업의 등록 및 관리함으로써 관리주체가 법을 준수할 수 있도록 하고 있음. 기계설비 성능점검업은 유지관리에 필요한 성능을 점검하는 활동으로 각 시,도에 등록된 업체 및 관리주체가 수행가능하며, 인천시에 등록된 업체에 대한 정보를 분기별로 제공함.
