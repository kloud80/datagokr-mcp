summary_user: 급경사지통합관리시스템(NDMS)에서 추출한 전국 급경사지 목록을 급경사지 단위로 담은 파일 데이터로, 급경사지명·시도·시군구·읍면동·상세주소 등을 포함하며 검증 시 37,778행을 받았다. 지자체 재난안전 담당자나 분석가가 우리 동네에 등록된 급경사지가 어디에 몇 곳 있는지 확인하는 질문에 쓴다. 주소 계열 필드(상세주소·도로명상세주소·산주소여부)가 조인 키라서 주소 기준으로 다른 위치·지역 데이터와 이어 쓰고, 같은 재난 특보·위험지역 부문의 재해위험지구 자료나 토지 규제 레이어와 함께 본다.
description_portal: 해당 자료는  「급경사지 재해예방에 관한 법률」제2조(정의)제5호의 각 목의 행정기관 및 공공기관(급경사지 관리기관_지방자치단체 등)에서 등록하여 관리중인 전국의 급경사지 현황이며 급경사지명, 시도, 시군구, 세부주소 등이 포함되어 있음. 자료의 기준일은 2026년도 06월 이며, 출처는 급경사지통합관리시스템(NDMS)에서 추출한 자료임.해당 자료는 급경사지 목록별 위치  정보 제공 데이터로 개인이 소유·관리하는 등 사유지(사유시설)가 포함된 급경사지 목록은 제공이 제외될 수 있으며 제공 기준일 이후의 자료는 일부 변동이 있을 수도 있음.
