summary_user: 한국산업안전보건공단 인증원이 안전인증한 보호구를 인증번호 단위로 담은 전국 원장으로, 인증 품목명·형식명(모델명)·등급·제조사·인증 취소 또는 반납 사유를 제공한다. 사업장 안전관리자나 구매 담당자가 납품받은 안전모·방진마스크 같은 보호구의 인증번호가 실제로 인증된 형식인지, 취소·반납된 인증은 아닌지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 인증번호(crtfcNo)나 제조사명·품목명 같은 이름 매칭으로만 잇는다.
description_portal: 한국산업안전보건공단 인증원에서 제공하는 보호구 안전인증 현황으로 용량/등급, 방호장치보호구형식명, 인증번호, 신청분야,종류, 제조공장명 등을 확인할 수 있도록 보호구에 대한 정보를 제공합니다. (※ 신청분야는 보호구 코드인 BH 필수입력, 향후 보호구 외 신청분야 추가 될 수 있습니다.)-안전인증 대상은 위험기계·기구의 방호장치와 유해 위험한 작업장에서 근로자가 착용하는 보호구입니다. 의무안전인증을 받아야 하는 품목과 제조하는 자가 방호장치·보호구 안전인증기준에 의거하여 스스로 안전성을 확인하고 이를 우리 공단에 자율안전확인 신고를 하는 품목으로 구분됩니다. 이를 통해 안전인증기준을 만족하는 제품에 KCs마크를 부착·판매토록 하여 근원적인 안전성과 신뢰성이 확보된 제품이 제조, 유통 및 사용 되도록 함으로써 산업재해를 예방하고자 추진하는 제도입니다.
