description_portal: 민유총기보관현황은 민간이 보유한 총기의 안전한 관리와 감시를 목적으로 작성되는 문서또는 자료입니다. 이는 총기류의 불법 사용을 방지하고, 관련 법규에 따라 총기의 보유 및 보관 현황을 체계적으로 관리하기 위한 것입니다.해당 현황은 경찰청 범죄예방대응국 범죄예방정책과에서 제공하며, 다음과 같은 항목으로 구성되어 있습니다.총기 종류별 구분(권총, 소총, 엽총, 공기총, 기타 총기류)의 총수량으로써 해당 데이터는 2013년부터 최근 연도인 2024년까지의 기간을 포험하고 있으며 민간 총기 보유의 변동 추이 및 관리 실태를 파악하는 데 활용됩니다.
