description_portal: 제주특별자치도경찰청의 총포 소지 허가 현황 데이터는 15년부터 24년까지 연도별로 총기 유형별 소지 허가 건수를 제공하는 공공안전 통계 자료입니다. 권총, 소총, 엽총, 공기총, 가스발사총, 마취총, 산업용총, 기타총 등으로 구분되며 각 총기종별 허가 건수를 통해 지역 내 총기 관리 현황과 추이를 정량적으로 파악할 수 있습니다. 이 데이터는 총기 관리에 대한 정책 수립, 연구자료, 범죄 예방을 위한 위험 요인 분석 기초자료로 활용될 수 있으며, 공공 치안 강화와 총기 안전 관리에도 중요한 기초데이터로 활용됩니다. 데이터 현행화 주기는 1년으로 9월 말에 최신화 됩니다.
