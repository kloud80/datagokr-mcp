summary_user: 광주 동구 관내에서 발생한 침수 피해를 한 건씩 피해위치(주소)와 읍면동으로 정리한 파일로, 범위는 시군구 하나이고 행정단위는 읍면동입니다. 구청·연구자가 '동구에서 침수 피해가 잦은 동네는 어디인가'를 동별로 세어 배수시설 개선 우선순위나 위험지역 표시를 검토할 때 쓴다. 전역 조인 키는 없으므로 읍면동 이름이나 피해위치 주소를 지오코딩해 다른 재해위험지구·대피시설 데이터와 이름·주소 기준으로 맞춰 쓴다.
description_portal: 본 데이터셋은 광주광역시 동구 관내에서 발생한 침수 피해 현황을 체계적으로 정리하여 제공하는 자료입니다. 데이터는 일련번호를 나타내는 '연번', 침수가 발생한 구체적인 주소 정보를 담은 '피해위치', 그리고 해당 위치가 속한 행정 구역을 분류한 '읍면동' 등 총 3개의 직관적인 칼럼으로 구성되어 있습니다.전체 데이터 규모는 총 571건이며, 행정동별 분포를 살펴보면  침수 피해 기록이 포함되어 있어 지역별 침수 취약도를 직관적으로 비교·분석할 수 있습니다.본 자료는 광주광역시 동구의 수해 방재 대책 수립, 하수도 및 배수 시설 개선 사업의 우선순위 선정, 기후변화 대응을 위한 침수 위험 지구 지정 등의 기초 행정 자료로 높은 가치를 지닙니다. 아울러 민간 및 학계에서는 침수 위험 예측 인공지능(AI) 모델 개발, 내비게이션 및 안전 지도 서비스 내 침수 위험 지역 알림 기능 탑재 등 재난 안전 플랫폼 구축과 고도화를 위한 연구 분석 데이터로 유용하게 활용될 수 있습니다.
