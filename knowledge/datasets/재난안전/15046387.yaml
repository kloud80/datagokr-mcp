description_portal: '○ 통계개요* 통계명 : 교통안전지수* 통계종류 : 서울시 교통안전지수 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 교통사고를 종합적이고 체계적으로 분석하여 교통안전대책 수립,학술연구 등의 기초자료 및 국민의 교통안전의식 제고에 활용하기 위함* 조사자료 : 교통사고자료, 자치단체별 기초자료 → 도로교통공단* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 교통안전지수○ 용어설명* 교통안전지수 : 전국 기초자치단체를 대상으로 교통사고 심각도별 사고건수와 사상자수를 기초로인구수와 도로연장을 고려하여 지자체별 교통안전도를 평가한 지수임○ 기타* 평가기준은 100점을 기준으로 점수가 높을수록 교통안전도가 높은 것을 의미함* 서울시 교통안전지수는 각 자치구 교통안전지수를 단순 산술평균한 값임* 2016년 교통안전지수 산출방식 개편'
