summary_user: 서울특별시에서 발생한 화재를 한 건씩 기록한 원천 데이터로, 포털 설명상 2022년분이며 발생 일시·요일, 사망·부상·재산피해, 출동소요시간·진압시간, 동원 인원·장비, 발화층·화재유형·발화요인·장소 분류, 발생 당시 기온·습도·풍속·풍향을 시군구·읍면동 단위로 담는다(CSV 약 632KB). 자치구 안전 담당자나 분석가가 "어느 동에서 화재가 잦고 출동이나 진압에 오래 걸리는가", "바람·습도가 피해 규모와 관련이 있는가"를 따질 때 쓴다. 행정구역 코드 같은 공통 조인 키가 없어서 시군구·읍면동 이름을 행정구역 코드표에 맞춰 붙인 뒤 동별 인구, 소방용수·119안전센터 위치 같은 다른 소방 데이터와 이어 쓴다.
description_portal: 해당 데이터는 2022년 서울특별시에서 발생한 화재를 읍면동 단위로 기록한 데이터셋입니다구성 항목은 화재발생(년), 화재발생(월), 화재발생(일), 화재발생(시), 화재발생(분), 요일, 사망, 부상, 재산피해소계, 출동소요시간(초), 화재진압시간(초), 시군구, 읍면동, 발화층, 화재유형, 발화요인대분류, 소방동원명수, 동원장비소계, 펌프, 온도(섭씨), 습도, 풍속, 풍향, 장소대분류로 되어 있어 이를 통해 자치구·동별 화재 발생 밀집 지역과 취약 요인을 식별할 수 있고, 기상과 화재 확산의 상관성도 연구할 수 있습니다. 따라서 이 데이터는 서울시 화재의 시간·공간·환경적 맥락까지 포괄하는 고해상도 통계로, 지역 맞춤형 안전정책과 과학적 화재 예방 연구에 핵심 기반 자료가 될 수 있습니다.
