summary_user: 전라남도 내 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일로, 시군·읍면동, 용도, 시설명, 도로명주소, 하루 급수용량(톤), 사용가능 인원을 담는다. 주민이나 재난 담당자가 '단수나 재난 때 우리 동네에서 물을 받을 수 있는 비상급수시설은 어디이고 몇 명까지 쓸 수 있나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군명·읍면동 이름이나 도로명주소를 매핑해 민방위 대피시설 등 다른 대피·구호시설 데이터와 이어 쓴다.
description_portal: '- 전라남도 내 179개소 민방위 비상급수시설에 대한 정보를 조회하실 수 있습니다.- 시군명, 읍면동, 용도, 시설명칭, 도로명주소, 급수용량, 사용가능 인원 등에 대한 데이터를 제공합니다.- 전라남도에는 민방위 비상급수시설이 주요 지자체를 중심으로 구축되어 있으며, 각 시설은 비상 상황 시 주민들에게 식수와 생활용수를 공급하는 역할을 합니다.- 비상급수시설은 재난 발생 시 주민들의 생명과 안전을 지키는 중요한 역할을 합니다. 각 시설의 운영 및 관리에 대한 자세한 정보는 해당 시군의 상하수도사업소나 전라남도청 상하수도과에 문의하시기 바랍니다.'
