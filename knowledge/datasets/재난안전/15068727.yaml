summary_user: 소화기에 붙이는 합격표시의 교부 내역을 건별로 담으며, 접수구분·품명·합격표시번호·형식명(소화기 재료·무게)·검사일자로 구성된 전국 단위 비공간 데이터이다. 소비자나 소방안전관리자가 보유한 소화기의 합격표시번호가 실제로 교부된 번호인지, 언제 검사를 받았는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 합격표시번호나 형식명 같은 이름·번호 매칭으로만 이을 수 있다.
description_portal: 『소방시설 설치유지 및 안전에 관한 법률』 에 따라 검사기준을 만족하는 소방용품 중 소화기에 부착하는 합격표시 정보를 제공합니다.합격표시 교부정보는 접수구분, 품명, 교부합격표시번호, 형식명(소화기재료, 무게), 검사일자 데이터로 구성되어 있습니다.※ 형식승인, 성능인증, KFI 제품검사의 품목별 합격표시 정보는 제조업체의 영업상 기밀에 해당되어 제외됨합격표시 교부번호에 대한 자세한 정보는 한국소방산업기술원 홈페이지 (https://kfi.or.kr/portal/openData/openData/opnPsmrk.do?menuNo=500336) 에서 확인할 수 있습니다.
