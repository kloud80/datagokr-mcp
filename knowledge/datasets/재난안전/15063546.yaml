description_portal: “소소심 익히기 소방안전교육 현황” 데이터는 소방청이 추진하는 대국민 응급처치 및 안전교육 프로그램인 소소심(소화기·소화전·완강기) 교육의 실시 현황을 정리한 통계자료입니다. 해당 데이터에는 연도별 교육 횟수와 참여 인원, 교육 대상(학생, 직장인, 일반 시민 등), 지역별 운영 현황 등이 포함되어 있어 국민들이 기초 소방안전 지식과 응급처치 능력을 얼마나 습득하고 있는지를 수치로 확인할 수 있습니다. 특히 화재 초기 대응에 필요한 소화기·소화전 사용법과 화재시 피난을 할 수 있도록 하는 완강기 사용법을 제공하는 특성상, 국민 안전 역량 강화와 안전문화 확산을 위한 대표적인 지표로 활용됩니다. 또한 이 데이터를 통해 지역 간 교육 격차, 연도별 참여 추이 등을 분석하여 향후 교육 정책 개선과 맞춤형 안전 프로그램 개발에 기초자료로 사용할 수 있습니다.
