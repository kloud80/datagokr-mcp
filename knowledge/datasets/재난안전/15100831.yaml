summary_user: 경상남도 안에서 관리하는 비상소화장치를 한 건씩 담은 1회성 파일로, 시설번호·시군구·도로명·지번 주소·위도·경도·관할 소방서와 전화번호를 담는다(포털 설명 기준 2024년 6월, 555건). 소방·지자체 담당자나 분석가가 "우리 동네 골목에 비상소화장치가 어디 있고 어느 소방서 관할인가"를 확인하거나 시군구별 설치 분포를 살필 때 쓴다. 전역 조인 키는 없어서 시군구코드·시군구명이나 관할소방서명으로 소방용수·화재 발생 데이터와 맞추고, 위도·경도로 지도 위에서 겹쳐 쓴다.
description_portal: (데이터 수집목적 및 과정) 경상남도 비상소화장치 데이터는 2024년 6월 기준 경상남도 내에서 관리하고 있는 비상소화장치에 대한 정보입니다. 도내 비상소화장치의 위치 및 현황, 관할 소방서 등을 분석할 때 활용할 수 있습니다. (데이터 구성 및 세부항목) 경상남도 비상소화장치 데이터는 시설번호, 시도명, 시군구명, 소재지 위도, 경도, 관할 소방서, 소방서 번호로 구성됩니다. 총 555건입니다. 미집계 데이터는 공란처리합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터며 현행화 되지 않습니다.
