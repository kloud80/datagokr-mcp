summary_user: 인천광역시 미추홀구 안에서 기계설비 성능점검 의무대상인 건축물을 한 건물당 한 행으로 정리한 목록 파일로, 건물명·주소·구분(공동주택/건축물)과 세대수 또는 연면적(㎡)을 담는다(CSV 약 6KB). 점검 용역사나 관리기관, 구청 담당자가 '미추홀구에서 올해 성능점검을 받아야 하는 공동주택과 대형 건축물은 어디이고 규모가 얼마인가'를 확인하고 점검계획을 세우는 데 쓴다. 전역 조인 키(건축물대장 번호 등)가 없어 다른 데이터와는 주소나 건물명을 맞춰 붙여야 한다.
description_portal: 본 데이터는 인천광역시 미추홀구 내 기계설비 성능점검 대상 건축물 정보를 정리한 공공데이터입니다. 건물명, 주소, 구분(공동주택·건축물), 세대수 또는 연면적(㎡) 데이터가 포함되어 있으며, 성능점검 의무대상 건축물의 규모와 특성을 파악할 수 있습니다. 공동주택의 경우 세대수를 통해 난방·환기·급수·소방 관련 기계설비 규모와 점검 대상 범위를 확인할 수 있고, 일반 건축물은 연면적 기준으로 점검 대상 여부를 판단할 수 있습니다. 이 데이터는 정기 점검계획 수립, 유지관리 비용 산정, 시설물 위험도 분석, 관련 행정 절차 처리, 공공안전 관리체계 구축 등에 활용됩니다. 특히 건물 관리기관, 지자체, 안전 점검 용역사, 에너지진단 기관 등에서 실무 기반 자료로 사용할 수 있는 가치 높은 건축물 기반 시설관리 데이터입니다.
