description_portal: '한국승강기안전공단의 ‘승강기 검사 스마트브리핑’에서 사용하는 부품코드 기준 표입니다. 검사기준 종류(예: 0B)별로 부품분류명, 대표부품분류코드, 부품대·중분류명을 정합된 체계로 제공하여, 현장 검사자가 스마트브리핑 화면에서 동일한 명칭과 코드로 설비 위치·기능을 신속히 식별하고 점검 결과를 표준화해 입력할 수 있도록 돕습니다. 대분류는 기계실·승강로·피트·승강장 등 공간/설비 축으로 구성되며, 중분류·세부분류(예: 제어반, 파워유니트, 카문, 레일, 완충기, 승강장문 등)로 세분화되어 항목 누락과 중복을 최소화합니다. 목적은 코드 일원화에 따른 데이터 품질 향상(불량/정비 이력의 검색 용이성, 통계 집계의 일관성, 부품별 위험요인 분석 기반 마련)이며, 범위는 공단이 관리하는 스마트브리핑 적용 대상 검사업무 전반의 코드 목록입니다. 본 자료는 코드 정의서 성격으로, 실제 현장 기록·불합 여부·수량 등 결과값은 포함하지 않습니다. 동일 설비라도 검사기준 개정 또는 화면 사용성 개선에 따라 코드가 보완될 수 있으며, 상세 정의서(설명, 예시 사진, 변경이력)는 내부 시스템에서 관리됩니다.'
