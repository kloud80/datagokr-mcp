summary_user: 승강기 고장으로 119에 신고·출동된 사례를 건별로 담은 CSV 파일(약 30KB)로, 119 접수일자, 승강기고유번호, 시스템 등록일시로 구성되며 범위는 전국입니다. 시설 관리자나 분석가가 승강기 고장 출동이 어느 기간에 몰리는지, 같은 승강기에서 출동이 반복되는지를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 승강기 고유번호 단위 원장(검사이력·고장 통계 등)과는 승강기고유번호 값을 맞춰 보는 방식으로만 연결한다.
description_portal: 본 자료는 승강기 고장으로 인해 119에 신고·출동된 사례를 한국승강기안전공단이 수집·정리한 현황 데이터입니다. 승강기 종합정보망에서 관리되는 설비 식별정보와 119 접수 이력을 연계해 구축되며, 주요 항목은 119접수일자(신고 시점), 승강기고유번호(설비 식별), (제공 시) 건물관리번호, 등록일시(시스템 반영 시점)로 구성됩니다. 시계열 형태의 원시 이력을 통해 기간·지역·설비별 출동 추세 파악, 반복 고장 설비 식별, 위험 시간대 분석, 유지관리 우선순위 설정, 소방·지자체 대응평가 등 정책·현장 활용이 가능합니다. 동일 설비의 중복 신고, 입력 지연·누락 등 품질 이슈가 있을 수 있어 정제·중복 제거가 필요하며, 고장통계·검사이력·유지관리정보와 결합 시 위험도 기반 점검 및 예지보전 등 고도화 분석의 기초자료로 유용합니다.
