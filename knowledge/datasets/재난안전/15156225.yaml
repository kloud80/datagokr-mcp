description_portal: 산업안전보건법에서 규정하는 위험성평가에 대한 표준모델을 제공하여  중소규모 사업장에서 위험성평가의 가이드라인으로 활용하기 위한 자료입니다.위험성평가 표준모델은 한국가스공사 현장의 주요작업의 위험성평가 결과를 참조하여 총 103종의 작업에 대한 위험성평가 예시 데이터입니다.각각의 표준모델은 작업구분, 작업공종순서, 작업공종별 유해위험요인, 유해위험요인별 위험성 감소대책을 포함하고 있습니다.* 유사작업의 위험성평가 수행시 유해위험요인 발굴 및 감소대책 수립의 참고자료로 활용할 수 있습니다.
