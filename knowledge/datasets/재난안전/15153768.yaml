summary_user: 「지하안전관리에 관한 특별법」에 따라 등록된 지하안전평가 전문기관을 업체 한 곳당 한 행으로 담은 전국 목록 파일이며, 상호·소재지·담당관리기관·전화번호·등록일자를 담는다. 지하 개발 사업 시행자나 발주처가 "우리 지역에서 지하안전평가를 맡길 수 있는 등록 전문기관은 어디이고 언제 등록됐나"를 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호(업체명)나 소재지 주소를 맞춰 이어야 한다.
description_portal: 국토안전관리원에서 제공하는 지하안전평가 전문기관 현황 입니다."지하안전관리에 관한 특별법"에 따라 등록된 지하안전평가 전문기관은 **지하안전정보시스템(JIS)**에서 최신 현황을 확인할 수 있습니다.지하안전평가란 지하를 안전하게 개발하고 이용하기 위해 「지하안전관리에 관한 특별법」(이하 지하안전법)에 따라 시행되는 제도로, 지하 개발 사업이 지하 안전에 미치는 영향을 사전에 조사, 예측, 평가하여 지반침하로 인한 재해를 예방하거나 줄일 수 있는 방안을 마련하는 것을 말합니다. 목적 및 법적 근거2014년 석촌 지하 차도 침하 사고 등을 계기로 지반 침하 사고를 예방하고 공공의 안전을 확보하기 위해 "지하안전관리에 관한 특별법"이 제정되었으며, 2018년부터 시행되었습니다. 이 법은 지하 공간을 안전하게 개발하고 이용하기 위한 안전 관리 체계를 확립하는 것을 목적으로 합니다. 평가 종류 및 대상지하안전평가는 굴착 깊이에 따라 주요 평가와 소규모 평가로 나뉘며, 시기에 따라 사후 평가도 있습니다.
