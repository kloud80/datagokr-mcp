description_portal: '- 전라남도 소방본부 전남소방홈페이지 내 이동안전차량체험 교육 현황(관한소방서, 단체명, 체험일시 등)을 조회할 수 있습니다.- 전라남도는 도민의 안전을 위해 다양한 소방안전교육 프로그램을 운영하고 있습니다. 이 중에서도 이동안전체험차량 교육은 특히 주목받는 프로그램으로, 도민들이 실제 상황을 체험하며 소방안전 지식을 습득할 수 있는 기회를 제공합니다.- 이동안전체험차량은 소방안전교육을 현장에서 직접 체험할 수 있도록 설계된 차량으로, 다양한 소방안전 장비와 시설을 갖추고 있습니다. 이 차량은 전라남도 내 각 지역을 순회하며, 도민들에게 소방안전교육을 제공합니다.'
