summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 이재민 수용시설을 시설 한 곳당 한 건으로 담으며, 시설명·수용가능인원·면적·주소·전화번호·편의시설과 내진 여부·좌표 등을 포함한다. 지자체 재난 담당자나 분석가가 "우리 동네에서 이재민을 몇 명까지 어디에 수용할 수 있나"를 확인할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아 행정동·법정동 코드(DONG_CD, STDG_CD)나 시도·시군구 이름, 주소를 매핑해 다른 대피시설·재난위험 데이터와 연결해야 한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 수용시설 정보로, 지역코드, 수용시설일련번호, 수용시설구분코드, 행정동코드, 상세주소, 이재민수용시설명, 수용가능인원, 기타편의시설여부, 시설면적, 상세주소 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
