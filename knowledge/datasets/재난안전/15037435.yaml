summary_user: 2018년 12월 31일 기준 전국 시·도 소방본부별로 주택용 소방시설(소화기·감지기 등) 설치 여부를 설문조사한 집계 결과를 담는다. 시·도별 응답 가구 수, 모두 설치했다고 답한 수, 설치율(%)이 들어 있어, 정책 담당자나 분석가가 '어느 시·도에서 주택용 소방시설 설치가 덜 되어 홍보·지원을 강화해야 하나'를 비교하는 데 쓴다. 전역 조인 키는 없으며, 시도본부 명칭을 시·도 이름으로 맞춰 화재 발생 통계 등 다른 소방 데이터와 연결한다.
description_portal: '해당 데이터는 2018년 12월 31일 기준으로 전국 시·도별 주택용 소방시설(소화기·감지기 등) 설치율을 설문조사 방식으로 집계한 결과입니다.주요 항목은 - 시도본부: 시·도별 소방본부 명칭 - 설문인원: 조사에 참여한 가구 수 - 모두 설치응답: 해당 가구 중 “모든 주택용 소방시설을 설치했다”라고 응답한 수 - 설문결과: 설치율(%) – 모두 설치응답 ÷ 설문인원 × 100입니다.또한 주택용 소방시설 설치 의무화 제도의 정착 정도를 보여주는 지표로, 지자체별 정책 집행력과 주민 안전 의식 수준을 비교하는 데 할 수 있습니다. 설치율이 낮은 지역은 홍보·지원 정책 강화 대상으로, 설치율이 높은 지역은 정책 효과 분석의 사례로 참고할 수 있습니다.'
