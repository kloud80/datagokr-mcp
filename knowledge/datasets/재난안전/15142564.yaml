description_portal: 광주광역시 소방안전본부에서 관리하는 연간 소방 자체점검 대상 시설 현황 데이터입니다.본 자료는 시설물 구분별 및 5개 관할소방서별 점검대상 개소수를 세부적으로 제공하여,관내 주요 시설물의 소방안전 관리 현황을 한눈에 파악할 수 있도록 구성되었습니다.이 데이터는 화재 예방 정책 수립, 위험 시설 선제관리, 점검 자원 배분 최적화, 관할소방서별 점검계획 수립 등행정기관의 정책 결정과 현장 관리에 활용할 수 있는 핵심 기반 자료입니다.또한 시민 안전 확보와 과학적 소방행정을 지원하기 위한 기초 데이터로서, 소방안전 정책 수립 시우선순위 설정과 취약시설 집중 관리에 중요한 근거를 제공합니다.
