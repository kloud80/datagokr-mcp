summary_user: 울산 울주군 각 읍·면 행정복지센터(구 주민센터)의 위치와 방사능 비상 시 대응 거점 정보를 건별로 담은 API로, 범위는 울주군 한 시군구입니다. 방사능 비상 때 주민이나 방재 담당자가 '우리 읍·면의 현장 지휘 거점이 어디인가'를 확인하거나, 사고 지점에서 각 행정구역 대응 거점까지의 위치를 지도로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 대피소·구호시설 같은 다른 방재 데이터와는 읍·면 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 주민센터 조회 서비스는 방사능 비상 상황 시 행정의 최일선에서 주민 보호 업무를 수행하는 각 읍·면 행정복지센터(구 주민센터)의 위치와 대응 거점 정보를 제공하는 데이터입니다.방사능 비상이 발령되면 각 읍·면의 주민센터는 해당 지역의 현장 지휘소 역할을 수행하며, 주민들에게 상황을 전파하고 대피를 진두지휘하는 거점이 됩니다.갑상선 방호약품 배부, 대피 안내, 거동 불편자 파악 등 주민에게 직접적으로 전달되는 모든 방재 행정 서비스의 출발점 정보를 담고 있습니다.울주군 전체 행정망을 지도상에 구현하여, 사고 지점으로부터 각 행정 구역의 대응 중심지가 어디에 있는지를 보여줍니다.
