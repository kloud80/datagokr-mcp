summary_user: 제주특별자치도 내 풍수해(태풍·호우 등)로 생긴 재산 피해액을 기준 연도·시군구·구분별로 천원 단위로 집계한 자료로, 포털 설명상 2016~2019년을 다룬다. 지역 재난 담당자나 분석가가 '제주시와 서귀포시 중 어느 쪽이 해마다 풍수해 피해가 더 컸나' 같은 연도별·지역별 피해 추이를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 재난 특보·위험지역 자료와는 시군구 이름이나 연도로 맞춰 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도가 2016년부터 2019년까지 제주도 내에서 발생한 풍수해(태풍, 폭우, 호우 등)로 인한 재산 피해액을 연도별로 집계하여 정리한 공공데이터이다. 제공기관은 제주도 디지털혁신과이며, 자료 형식은 CSV로 공개되어 있어 누구나 활용 가능하다. 본 자료는 풍수해로 인한 피해 규모를 객관적으로 파악할 수 있는 기초 통계로, 재난 대응 및 복구 정책 수립, 피해 패턴 분석, 보험 및 보상 제도 설계, 재정 대비 및 재난 대비 예산 편성, 기후변화 및 자연재해 대비 전략 수립 등 다양한 분야에서 유용하게 사용될 수 있다. 또한 연도별 피해 추이를 통해 제주 지역의 풍수해 취약성 평가, 재해 예방 대책 마련, 지역 안전 인프라 강화 필요성 진단 및 위험 지역 지정·관리 등에 참고 가능한 신뢰도 높은 기초 자료이다.
