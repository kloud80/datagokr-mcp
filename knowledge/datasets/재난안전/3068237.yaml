summary_user: 인천광역시 연수구 안의 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 3KB)로, 권역, 시설명, 도로명 주소, 수질 구분, 양수량(톤), 지정 구분을 기록한다. 주민이 단수나 재난 때 우리 동네에서 물을 받을 수 있는 시설이 어디인지 찾거나, 구·유관기관이 권역별 급수 용량이 부족한 곳을 가리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소를 지오코딩하거나 시설명·권역 이름으로 맞춰 이어야 하며, 같은 부문의 민방위 대피시설·무더위쉼터 등 대피·구호시설 자료와 위치 기준으로 함께 본다.
