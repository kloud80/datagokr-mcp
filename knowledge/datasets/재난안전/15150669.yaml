summary_user: 행정안전부가 재난안전데이터 공유플랫폼을 통해 제공하는 전국 경찰서·파출소·지구대의 위치정보로, 시설 한 곳마다 소속 시도경찰청·경찰서 이름, 시설 유형, 주소·도로명주소, 전화번호, 좌표를 담는다. 주민이나 분석가가 "우리 동네에서 가장 가까운 파출소나 지구대는 어디이고 연락처는 무엇인가"를 확인하거나 지역별 치안시설 분포를 볼 때 쓴다. 전역 조인 키는 확인되지 않아 다른 데이터와는 시도·시군구 코드(STDG_CTPV_CD, STDG_SGG_CD)나 주소·좌표로 맞춰 이어 쓴다. 대피·구호시설이나 소방시설 위치 데이터와 함께 지역 안전시설을 묶어 보는 데 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 경찰서, 파출소, 지구대 위치정보입니다.
