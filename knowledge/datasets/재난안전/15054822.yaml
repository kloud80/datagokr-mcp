summary_user: 광주 남부소방서 생활안전대의 출동 실적을 활동 유형(시건개방, 동물포획, 벌집제거 등)별로 나누어 송하·월산·봉선·대촌 119안전센터와 구조대별 건수로 담은 집계표이며, 건별 출동 원천 기록이 아니다(파일 크기 202바이트의 작은 표). 소방 행정 분석가나 주민이 '남부소방서 관내에서 어느 안전센터가 벌집제거나 동물구조 같은 생활안전 출동을 가장 많이 처리했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 소방서의 생활안전활동 현황이나 119안전센터 위치 자료와는 안전센터 이름을 맞춰 연결해야 한다.
description_portal: '광주광역시 남부소방서 생활안전대 활동내역입니다.-상세내용: 관내 119안전센터별 출동건수 및 유형별 분류(시건개방, 동물포획, 벌집제거 등)본 데이터는 남부소방서 생활안전대의 출동 현황을 기반으로 작성한 데이터입니다.문 시건개방, 동물 구조 및 포획활동, 벌집제거, 장애물 처리, 피해복구 지원 등 다양한 생활안전활동을 통해 얻어진 결과물입니다.생활안전 활동이란 119생활안전활동이란 ‘119에 접수된 출동요청 중에서 위험성은 있으나 긴급성을 요하지 않는(준긴급 또는 잠재긴급) 구조 및 위험요인제거 등 생활안전 지원활동’이라고 정의하고 있습니다. 생활안전대의 편성ㆍ운영 목적으로는 ‘119에 접수된 국민의 생활안전과 위험제거 활동을 수행함으로써 효율적인 구조서비스 제공’이라고 정의되어 있으니 데이터 활용시 참고바랍니다.'
