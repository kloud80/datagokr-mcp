description_portal: '○ 통계개요* 통계명 : 보행자 사고현황* 통계종류 : 서울시 보행자의 사고현황을 통행유형별로 제공하는 일반ㆍ보고통계* 근거법령 :「도로교통법」제2조에 규정하는 도로에서 차의 교통으로 인하여 발생한인적 피해를 수반하는 교통사고* 작성목적 : 교통위반 및 사고 현황을 종합적이고 체계적으로 분석하여 교통안전대책수립, 학술연구 등의 기초자료 및 국민의 교통안전의식 제고에 활용하는것을 목적으로 함* 조사체계 : 경찰서 → 지방경찰청 → 경찰청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 보행자의 사고유형별 사망자수, 부상자수○ 용어설명* 보행자 : 도로를 보행하거나 노상 작업중인 자, 노상 유희중인 자, 도로에 서 있거나누워있는 사람, 장애자용 휠체어를 타고 있거나 밀고 가는 사람, 세발자전거나모형자동차에 타고 있는 아이 또는 이를 밀고 가는 사람, 이륜차 원동기장치자전거자전거를 끌고 가는 사람(단, 이륜자동차, 원동기자전거, 자전거 이외의 차량을밀고 있는 사람은 당해 차량의 운전자로 봄)* 사망: 교통사고 발생일로부터 30일이내에 사망한 경우* 부상: 교통사고로 인하여 3주이상 5일 미만의 치료를 요하는 부상을 입은 경우○ 기타* 사고발생지역 단위(서울시) 기준임* 경찰DB: 경찰에 신고되어 처리된 교통사고DB로 도로교통법 제2조에 규정하는 도로에서 차의 교통으로인하여 발생한 인적, 물적피해가 따르는 사고를 대상으로 함'
