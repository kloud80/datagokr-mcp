summary_user: 서울특별시가 집중호우·하천 범람 때 예상되는 침수 위험 지역을 침수단계별로 나눈 공간 객체(폴리곤) 자료로, 객체마다 공간 ID·일련번호·침수단계(FLDG_STG)를 담는다. 주민이 자기 동네의 예상 침수 수준을 확인하거나, 분석가·도시계획 담당자가 하수·배수 시설 정비나 재난 대비 시나리오를 세울 때 어느 지역이 침수 취약한지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 속성 키가 아니라 공간 중첩(EPSG:5186 좌표 기준)으로 잇는다. 이렇게 겹쳐 볼 대상으로는 재해위험지구·토지 규제 레이어·대피시설 위치가 있다.
description_portal: 서울시 풍수해 침수예상도 공간정보 데이터는 집중호우나 하천 범람 등으로 발생할 수 있는 침수 위험 지역을 단계별로 표현한 공간정보 자료입니다. 공간id와 일련번호를 통해 각 공간 객체를 식별하며, 침수단계 항목을 통해 지역별 예상 침수 수준을 구분하여 제공하고 있습니다. 좌표 정보는 GRS80 타원체 기반의 한국 중부원점에서 Y축으로 600000미터를 이동시킨 EPSG:5186 좌표계를 사용하고, 인코딩은 windows-949를 적용하고 있어 데이터 활용 시 좌표계 설정과 문자셋 설정에 유의해야 합니다. 이 데이터는 침수 취약 지역의 사전 파악, 도시계획 및 하수·배수 시설 정비 계획 수립, 재난 대비 시나리오 작성, 침수 위험 지역 거주민 보호 대책 마련 등 풍수해 예방과 대응을 위한 핵심 기초 공간정보로 활용될 수 있습니다.
