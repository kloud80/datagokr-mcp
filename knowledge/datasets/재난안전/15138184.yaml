summary_user: 한국승강기안전공단에 접수된 승강기 설치신고를 건별로 담은 원천 파일로, 승강기관리번호·건물관리번호·건물명·설치신고번호와 신고일자·시공 업체명·실제 설치일자를 전국 범위로 기록한다. 건물 관리자나 분석가가 특정 건물 승강기가 언제 어느 업체에 의해 설치·신고됐는지, 업체별·시기별 설치 현황이 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 승강기 검사·유지관리 자료와는 승강기관리번호나 건물명 같은 이름·코드 매핑으로 이어 써야 한다.
description_portal: 한국승강기안전공단에 접수된 승강기 설치신고의 이력을 정형화한 자료입니다. 건별로 승강기관리번호(1·2), 건물관리번호(1·2), 건물명, 안전관리자명(부분 마스킹), 설치신고번호·설치신고일자, 시공(또는 납품) 업체명, 실제 설치일자를 포함합니다. 본 자료의 목적은 법정 설치신고의 처리 경로와 결과를 추적·검증하고, 이후의 검사·인증·유지관리·사고예방 업무와의 연계를 지원하는 데 있습니다. 동일 건물 내 다수 호기나 동일 신고번호의 여러 호기가 별도 행으로 기록될 수 있으며, 기관 원장 시스템의 정정·변경 이력에 따라 명칭이나 날짜가 갱신될 수 있습니다. 공개 범위는 행정확인에 필요한 최소 식별정보로 제한되며, 주민번호 등 민감·개인정보는 포함하지 않습니다.
