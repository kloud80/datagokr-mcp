summary_user: 울산광역시 울주군 내 어린이집을 시설 단위로 담은 방사능 방재용 조회 API로, 포털 설명상 위치와 정원·현원·교사 수 정보를 포함한다. 방재 담당자나 분석가가 방사능 비상 시 영유아 대피에 필요한 차량 대수와 인솔 인력을 시설별로 얼마나 준비해야 하는지 따질 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 어린이집 이름이나 주소를 맞추거나 같은 기관(울주군) 자료끼리만 연결한다.
