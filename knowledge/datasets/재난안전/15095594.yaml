description_portal: 울산광역시 울주군에서 제공하는  방사능 방재정보 어린이집 조회 서비스는 방사능 비상 상황 발생 시 스스로를 보호하기 어려운 영유아들의 안전을 확보하고, 우선적인 대피 및 보호 조치를 실행하기 위한 보육 시설의 지리적 정보를 제공하는 데이터입니다.재난 시 최우선 보호 대상인 영유아들이 모여 있는 시설 정보를 관리하여, 사고 초기 신속한 상황 전파와 구조 활동의 근거가 됩니다.각 어린이집의 정원, 현원, 교사 수 등의 정보를 포함하고 있어, 대피 시 필요한 차량 대수와 인솔 인력을 산정하는 기초 자료가 됩니다.
