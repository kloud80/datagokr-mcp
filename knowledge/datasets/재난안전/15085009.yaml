summary_user: 정읍시가 설치한 도로기반시설물(포털 설명상 216개, 2024-12-31 기준)을 시설물 한 건씩 담은 원장 파일로, 읍면동·설치일자·인근 정류장명을 기록한다. 시민이나 분석가가 "우리 읍면동에 도로기반시설물이 몇 개 있고 언제 설치됐는가", "어느 버스정류장 주변에 시설물이 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 행정읍면동 이름이나 정류장명을 기준으로 정읍시 정류장·행정구역 자료와 이름 매칭으로 잇는다.
description_portal: '전북특별자치도 정읍시_도로기반시설물 정보2024.12월 기준 정읍시 도로기반시설물 정보에 대한 데이터로 행정읍면동, 설치일자,  정류장명 등 자료를 제공 합니다.[데이터 안내]- 도로기반시설물 : 216개- 행정읍면동 : 정읍시 23개 읍면동(수성동, 장명동, 내장상동, 시기동, 초산동, 연지동 등)- 설치일자 : 도로기반시설물을 설치한 날짜- 정류장명 : 정류장명(공란 : 인근 정류장 미존재)- 데이터기준일자 : 2024-12-31기타 궁금한 사항은 도로기반시설물 담당부서인 정읍시청 건설과로 문의하시기 바랍니다.'
