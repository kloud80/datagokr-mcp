summary_user: 울산 울주군이 방사능 비상 때 대피 집결지·방재 거점으로 쓸 수 있는 공공체육시설의 위치와 현황을 시설(필지·건물) 단위로 담은 조회 API입니다. 울주군 방사능 방재 담당자나 분석가가 "대피 주민을 어느 체육시설에 모으고 몇 명을 수용할 수 있나"를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 대피·구호시설 등 다른 재난안전 데이터와는 시설명·주소 매핑이나 같은 기관(울주군) 기준으로만 이어 쓴다.
limits: 이벤트 때 생성된 뒤 바뀌지 않는 데이터로 분류되어 시설 현황이 최신이라는 보장이 없고, 범위도 울주군 한 곳에 한정된다. 확인된 필드는 페이지 정보(행 수·페이지 번호·전체 건수)뿐이라, 부지 면적이나 수용 인원 같은 속성이 실제로 오는지는 호출해 확인해야 한다. 개발계정은 하루 1,000회로 호출이 제한된다.
