description_portal: 이 공공데이터는 강원도 내에서 연도별로 발생한 지명수배자에 대한 현황을 정리한 자료로, 2018년부터 2024년까지의 데이터를 포함하고 있습니다. 주요 항목은 지명수배자 발생 건수, 검거 건수, 그리고 검거율로 구성되어 있으며, 수배 범죄자의 발생과 수사 성과를 종합적으로 파악할 수 있도록 구성되어 있습니다. 해당 데이터는 수사기관의 검거 역량 분석, 범죄자 추적 시스템의 효과성 평가, 지명수배자 관리 체계 점검 등에 활용될 수 있으며, 경찰 조직의 수사 전략 수립과 대응력 제고에도 기여할 수 있습니다. 아울러 언론, 학술기관, 정책연구기관 등에서도 범죄 수배제도의 실효성을 분석하거나 지역별 치안 대응 수준을 비교 분석하는 데 유용한 자료입니다.
