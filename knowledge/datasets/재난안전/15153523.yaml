summary_user: 지진해일 발생 때 주민 대피 장소로 지정된 곳의 위치 정보를 선(라인) 형태 공간객체 단위로 담은 데이터로, 범위는 전국이며 객체 관리번호·선/점 공간 일련번호·도형(GEOM) 등을 제공한다. 해안 지역 주민이나 지자체 방재 담당자가 '우리 지역 지진해일 대피소와 그 경로가 어디에 있는가'를 지도에서 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 같은 기관의 대피소 점·면 데이터와는 객체 관리번호(THINGS_MNG_NO)나 이름 매핑으로, 다른 데이터와는 도형 좌표를 공간 결합해 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지진해일 발생시 지역별 주민 대피 장소로 지정된 장소 위치 정보입니다.\""
