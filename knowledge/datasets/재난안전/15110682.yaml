summary_user: 국토안전관리원이 관리하는 성능평가 대상 시설물을 한 건씩 담은 CSV 파일로, 전국 시설물의 시설명·소재지·시설물 구분·종류·종별과 함께 종합·안전·내구·사용 성능등급, 성능평가 도래시기와 종료일을 담는다. 시설물 관리주체나 분석가가 "우리 지역의 어떤 교량·건축물이 종합성능등급이 낮고 다음 성능평가가 언제 돌아오는가"를 확인하는 데 쓴다. 실측 컬럼에 시설물 번호 같은 전역 조인 키가 없어서, 다른 시설 안전 데이터(안전등급·점검 결과 등)와는 시설명·소재지 주소를 맞춰 보는 방식으로 이어 쓴다.
description_portal: 국토안전관리원에서 관리하는 성능평가 대상시설물 시설물관리대장의 시설물 구분 정보이며, CSV형식 파일데이터 입니다.시설물 성능정보는 시설물의 구조적 안전성, 내구성, 사용성 등의 성능을 종합적으로 평가한 정보를 의미합니다. 이 정보는 주로 「시설물의 안전 및 유지관리에 관한 특별법」에 따라 관리되며, **시설물통합정보관리시스템(FMS)**을 통해 확인할 수 있습니다시설물 성능평가는 시설물의 기능을 유지하고 효율적인 유지관리 방안을 수립하는 데 필요한 정보를 제공하는 조사 및 평가 방법입니다.
