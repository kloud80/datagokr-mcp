description_portal: 본 데이터는 서울특별시 서초구에 설치된 연도별 보안등의 정보를 제공하는 자료이다. 보안등은 주택가 골목길이나 이면도로에 설치되어 야간 보행자의 안전을 확보하고 범죄를 예방하는 조명 시설입니다. 본 데이터는 ‘성범죄 예방 정책과 성범죄 발생 건수의 관계에 관한 실증분석’ 연구에 도움이 될 수 있으며, 지역별 유흥업소의 분포 현황 및 운영 실태를 체계적으로 파악할 수 있도록 구성되어 있습니다.이 정보는 성범죄 예방 정책및 성범죄 발생 건수등간의 상관관계를 고찰하는 회귀분석에도 사용될 수 있습니다. 추가적으로 관내 성범죄 정책에의 합의를 도출하는 공익적인 연구에도 활용될수 있습니다.유흥업 관리, 안전 점검, 유관기관과의 협업, 건전한 유흥문화 정착, 지역 치안 정책 수립 등 실질적인 행정 및 정책적 활용을 위한 기반 자료로 활용됩니다.
