description_portal: 본 데이터는 경찰청 여성청소년범죄수사과에서 관리하는 통계로, 2021년부터 2025년까지 발생한 성폭력범죄 검거 인원 중 과거 동일한 유형의 범죄를 저지른 이력이 있는 동종재범자 현황을 제공합니다.연도별 전체 검거 인원 대비 재범자 수의 추이를 정량적으로 파악할 수 있으며, 이를 통해 성범죄의 재발 방지 정책 및 수사 전략의 유효성을 평가하는 핵심 지표로 활용됩니다. 약 5년간의 시계열 자료는 재범 위험군에 대한 집중 관리 체계 구축과 보호 관찰 시스템 강화 등 맞춤형 예방 대책을 수립하는 데 필수적인 근거 자료입니다. 범죄 예방을 위한 정책 수립 및 사회적 안전망 구축, 관련 분야의 학술적 연구 활동을 위한 기초 통계로서 공공 및 민간 분야의 활용 가치가 매우 높습니다. 치안 데이터 개방을 통한 사회적 안전 지수 향상에 기여하고자 합니다.
