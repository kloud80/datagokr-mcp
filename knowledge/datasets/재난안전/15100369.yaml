description_portal: 경상남도경찰청 사이버범죄 발생 및 검거현황 공공데이터는 경상남도경찰청 관내에서 발생한 사이버 범죄 현황에 대한 통계 제공을 목적으로 작성된 자료입니다.  본 데이터는 사이버범죄 발생연도, 사이버 범죄 발생 건수, 사이버 범죄 검거건수로 구성되어 있으며 2009년부터 2024년까지 연도별 사이버 범죄 발생건수 및 검거 현황을 시계열적으로 파악할 수 있습니다. 해당 데이터는 경상남도경찰청 수사부 사이버수사과에서 작성하여 제공하는 통계데이터로 연도별 사이버 범죄 발생 및 검거 추이를 알아볼 수 있습니다. 데이터 업데이트는 매년 9~10월경에 이루어집니다.
