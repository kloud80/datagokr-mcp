summary_user: 감전사고 사상자를 연도별(2022~2024년)·시간대별(24시간을 2시간 단위로 나눔)로 집계해 사망자와 부상자 수를 담은 전국 단위 통계 파일이다. 전기안전 담당자나 분석가가 '감전사고 인명피해가 하루 중 어느 시간대에 몰리는가'를 확인해 작업 시간 관리나 예방 대책 시점을 정할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·시간대 값을 맞추거나 한국전기안전공사의 다른 전기재해 통계(월별·장소별 등)와 나란히 놓고 비교하는 방식으로 이어 쓴다.
description_portal: 한국전기안전공사는 감전재해 감축을 위해 올바른 정책 방향의 기초 데이터를 제시하고 감전 재해의 발생추이를 분석하여 예방 대책을 도출하기 위해 매년 전기재해 통계 분석집을 발간하고 있습니다.관련 근거로는 통계법 제18조와 동법 시행령 제24조, 전기안전관리법 제41조(전기재해 통계의 작성)가 해당됩니다.이 데이터는 감전사고에 따른 감전사상자를 연도별(2022년~2024년) 및 시간대별(24시간 기준으로 2시간 주기)로 사상자(사망자, 부상자)의 수를 제공하는 데이터입니다.
