description_portal: 이 데이터는 경찰청이 일회성으로 제공하는 데이터로 2019년 기준으로 지방청별 경비원 배치 및 폐지 건수를 정리한 자료이며, '구분', '배치(건)', '폐지(건)' 항목을 포함한다. 데이터는 서울청, 부산청, 대구청 등 지방청별 경비원의 배치 및 폐지 현황을 수치로 기록하여 경찰 인력 운용과 경비 효율성을 평가하는 데 기여한다. 경찰청은 본 자료를 통해 경비원의 지역별 배치 및 폐지 건수 추이를 분석하고, 경비 인력의 적정 배치와 운영 개선을 위한 정책 수립에 활용한다. 데이터는 공공데이터포털을 통해 개방되며, 경찰조직의 경비 인력 운영 및 연구 참고자료로 제공된다. 본 자료는 경찰 경비 운영의 효율성과 지역별 특성 파악을 위한 기반자료로 중요한 의미를 가진다.
