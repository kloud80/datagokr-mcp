summary_user: 경기도가 제공한 위험물 제조소·취급소·저장소 수를 집계연도와 시군 단위로 묶은 집계 자료로, 제조소와 주유·판매·이송·일반 취급소, 옥내·옥외·지하·간이·이동 탱크 저장소 등 시설 유형별 개수를 담는다. 지자체 안전 담당자나 분석가가 '우리 시군에 주유취급소나 지하탱크저장소가 몇 곳이고 해마다 어떻게 변했나'를 확인하거나 시군 간 위험물 시설 밀집도를 비교하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시군명(SIGUN_NM)이나 시군코드를 다른 행정구역 자료와 이름·코드로 맞춰 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 경기도에서 제공하는 위험물제조소집계현황에 대한 관련 정보입니다.\""
