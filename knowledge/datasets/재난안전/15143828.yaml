description_portal: 본 데이터는 서울시 시민생활 중요 인프라 시설인 공동구에 비치된 이동식 소화기 현황을 정리한 자료입니다. 이동식 소화기는 화재발생 시 주변에 있는 인력이 발화지점으로 소화기를 분사 등의 방법으로 사용하여 신속한 초동조치로 시설을 보호하고 골든타임을 확보할 수 있도록 해주는 소방시설 입니다. 업로드된 데이터에는 서울시 8개 공동구별로 소화기 종류가 분말 또는 청정 소화기인지 여부, 일반화재, 유류화재, 전기화재 각 화재 종류 별로 적용 가능한지 여부, 그리고 소화기 약제의 주성분과 중량, 소화기 수량에 대한 내용을 포함하고 있습니다.
