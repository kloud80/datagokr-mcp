summary_user: 한국남부발전(주)이 관리하는 법정 시설물을 시설 한 건씩 번호·소속 사업소·시설명·법적 종별로 정리한 소규모 원장 파일(CSV 약 2.3KB)로, 연료하역부두·석회석 반입부두·저탄장 호안·옹벽 같은 발전소 시설을 담는다. 발전소 인근 주민이나 안전 분야 분석가가 '남부발전 어느 사업소에 몇 종 법정 시설물이 있는가'를 확인하거나 유지보수·안전점검 대상 목록을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설물 안전등급·점검 결과 데이터와는 사업소명·시설명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
limits: 시설물 고유 코드나 좌표가 없어 다른 데이터와 키로 정확히 결합하거나 지도에 표시할 수 없다. 범위는 전국이지만 비공간 자료라 위치는 사업소 이름 수준으로만 알 수 있다.
