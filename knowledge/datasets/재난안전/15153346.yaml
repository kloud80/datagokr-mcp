summary_user: 전국에서 발생한 붕괴사고를 사고 1건당 한 행으로 담은 건별 이력이며, 발생 연·월·일자, 지번·도로명 주소, 원인, 사상자·사망자·부상자 수, 피해금액, X·Y 좌표를 포함한다. 지자체 안전담당자나 분석가가 특정 지역에서 붕괴사고가 언제 얼마나 났고 인명·재산 피해가 어느 정도였는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소(ADDR) 문자열 매핑이나 좌표 기반 공간 결합으로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 정보로 붕괴사고 발생위치를 표시한 정보입니다.\""
