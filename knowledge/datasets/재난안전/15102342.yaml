description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2016년부터 2020년까지 경찰청에서 집계한 범죄소년 검거 현황을 제공하는 공공데이터입니다. 연도별로 전국에서 검거된 범죄소년(19세 미만)의 총 인원이 포함되어 있으며, 청소년 범죄의 발생 추이와 감소 또는 증가 흐름, 사회적 환경 변화에 따른 범죄율 변동 등을 확인할 수 있습니다. 이 데이터는 경찰의 청소년 범죄 예방 정책 수립, 교육기관의 비행 방지 프로그램 설계, 연구기관의 청소년 범죄 원인 분석, 공공기관의 보호처우 개선 정책 수립 등에 유용하게 활용됩니다.
