summary_user: 울산 울주군의 원전 주변 방사선비상계획구역 공간정보를 비상계획구역 구분과 원전 코드 기준으로 조회하는 API이며, 범위는 시군구 단위이다. 울주군 주민이나 방재 담당자가 "우리 동네가 원전 비상계획구역 안에 드는지, 어느 구역 구분에 속하는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명·원전 코드 같은 이름·코드 매핑이나 같은 기관 코드로만 잇고, 대피소·토지 규제 레이어와는 공간적으로 겹쳐 보는 방식으로 쓴다.
limits: 이벤트성으로 한 번 생성된 뒤 바뀌지 않는 데이터로 분류돼 있어 실시간 방사선 수치나 비상 상황 정보는 담지 않는다. 표준 조인 키가 없어 다른 데이터와 자동 결합이 어렵다. 개발계정은 하루 1,000회로 호출이 제한된다.
