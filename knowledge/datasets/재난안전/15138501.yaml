description_portal: 본 자료는 한국승강기안전공단이 운영하는 승강기안전기술원 홈페이지의 게시판 구조와 게시 현황을 표준 항목으로 정리한 데이터입니다. 각 레코드는 게시판 단위를 기본으로 하며, 필드는 게시판제목, 카테고리 수, 확장필드 수, 게시글 수, 원본여부로 구성됩니다. 게시판제목에는 공지사항, 심사가이드 및 기술자료, 자주하는 질문, 이용안내, 민원서식 등 주요 게시판이 포함됩니다. 카테고리 수는 게시글 분류 체계의 존재 유무와 규모를 나타내고, 확장필드 수는 게시물 입력 양식에서 추가로 수집되는 속성 항목의 개수를 의미합니다. 게시글 수는 특정 시점의 누적 게시물 건수를 제공하며, **원본여부(Y/N)**는 자료가 원 게시판에서 직접 수집된 값인지 여부를 표시합니다. 표의 열 정의가 통일되어 있어 게시판별 구조, 분류 체계, 게시 축적 정도를 한눈에 파악할 수 있도록 정리되어 있습니다.
