summary_user: 전국의 인명피해 우려지역을 지구 단위 건별로 담으며, 지구명·지정 사유·지정일과 해제일·주소·예상 피해 세대와 인원·대피 대상과 대피장소 등이 들어 있다. 지자체 방재 담당자나 주민이 '우리 지역에서 인명피해 우려지구로 지정된 곳은 어디이고, 대피 대상 인원과 대피장소는 어디인가'를 확인하는 데 쓴다. 실측에서는 전역 조인 키를 찾지 못했으므로, 법정동코드(STDG_CD)·도로명주소코드 같은 주소 코드나 지구명 매핑을 통해 대피소·재해위험지구 등 같은 기관의 재난 데이터와 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 인명피해 우려지역 정보로, 지역코드, 일련번호, 피해우려지역유형코드, 지구명, 지구지정사유상세내용, 산주소여부, 도로명상세주소 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
