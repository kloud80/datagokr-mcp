summary_user: 행정안전부 재난안전데이터 공유플랫폼이 제공하는 사회재난(화재·붕괴·폭발·교통사고·화생방·환경오염·국가기반체계 마비·감염병·가축전염병 등)별 국민행동요령을 재난 분류 단계(대·중·소 분류 코드와 이름)와 행동요령 문구, 관련 콘텐츠 주소 단위로 담는 전국 단위 비공간 안내 정보다. 국민이나 안전 서비스 개발자가 "건물 붕괴나 화생방 사고가 나면 무엇을 해야 하나"를 재난 유형별로 찾아 앱·안내 화면에 띄우는 데 쓴다. 전역 조인 키는 없으므로 재난 특보·위험지역, 대피·구호시설 같은 다른 재난안전 데이터와는 재난 유형 이름이나 분류 코드를 직접 맞춰 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 자연재난 발생 시 국민행동 요령 정보로, 화재·붕괴·폭발·교통사고·화생방사고·환경오염사고 등으로 인하여 발생하는 대통령령으로 정하는 규모이상의 피해와 에너지·통신·교통·금융·의료·수도 등 국가기반체계의 마비, 「감염병의 예방 및 관리에 관한법률」에 따른 감염병 또는 「가축전염병예방법」에 따른 가축전염병의 확산 등으로 인한 피해 대비한 국민의 행동 요령을 안내하고 있습니다.
