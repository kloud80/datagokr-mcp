description_portal: 2016~2025년 보이스피싱 현황 통계를 분석한 결과, 범죄의 양상이 대출사기형에서 기관사칭형으로 급격히 변화하고 있습니다. 초기에는 대출사기 발생 건수(2019년 30,448건)가 압도적이었으나, 2023년 이후 급감하여 2025년에는 10,037건으로 낮아졌습니다.반면 기관사칭형은 2016년 3,384건에서 2025년 13,323건으로 약 4배 폭증하며 역대 최고치를 경신했습니다. 특히 2025년에는 기관사칭 관련 모든 세부 지표가 전년 대비 크게 반등하며 전체 범죄를 주도하고 있습니다. 이는 단순 대출 유도보다 공신력 있는 기관을 사칭한 정교한 수법이 기승을 부리고 있음을 시사합니다. 변동성이 큰 만큼 고도화된 사칭 수법에 대한 주의가 절실한 시점입니다.
