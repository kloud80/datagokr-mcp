summary_user: 울산시설공단이 관리하는 시설에 설치된 비상벨을 시설·설치 위치별로 한 행씩 담은 원천 목록으로, 시설명·주소·상세위치·설치목적·설치대수·연락처·종류·위도·경도·기준일자를 포함하며 파일 크기는 약 4.8KB입니다. 울산시설공단 시설을 이용하는 시민이나 생활안전 분석가가 '이 시설의 어느 곳에 비상벨이 있고, 누르면 어디로 연락되는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소 문자열이나 위도·경도 좌표로 CCTV·안심지킴이집·보안등 같은 다른 방범 인프라 데이터와 공간적으로 겹쳐 본다.
description_portal: 울산시설공단은 시민의 안전을 최우선으로 고려하여 다양한 시설 내에 설치된 비상벨의 현황 정보를 체계적으로 관리하고 있으며, 이를 기반으로 한 데이터를 제공합니다. 해당 데이터는 비상벨이 설치된 시설명, 시설이 위치한 주소, 비상벨의 구체적인 설치 장소를 나타내는 상세 위치, 설치의 주요 목적을 설명하는 설치 목적, 각 시설에 설치된 비상벨의 설치대 수, 비상 상황 시 연락할 수 있는 연락처, 비상벨의 종류, 그리고 지리적 위치를 나타내는 위도 및 경도, 마지막으로 데이터 기준 시점을 나타내는 기준일자 등의 항목으로 구성되어 있습니다.
