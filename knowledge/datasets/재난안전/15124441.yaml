description_portal: '- 연도별 태풍피해(인명 및 재산피해, 복구액 등)의 전국 대비 전라남도의 피해 현황에 대한 자료를 조회할 수 있습니다.(2005년~2023년)- 전라남도는 태풍과 집중호우로 인한 피해를 최소화하고, 재해에 대비하기 위해 다양한 예방 및 대응 조치를 추진하고 있습니다.- 재해위험지역 정비사업 추진 : 전라남도는 집중호우와 태풍 등 기상이변에 대비하기 위해 재해위험지역 정비사업을 추진하고 있습니다. 이 사업은 침수 및 산사태 위험이 높은 지역을 대상으로 하며, 하천 정비, 배수로 개선, 산사태 예방 시설 설치 등을 포함하고 있습니다.- 농업인 행동요령 안내 : 농업인들을 위한 집중호우 및 태풍 대비 행동요령이 안내되고 있습니다.'
