description_portal: '(주)한국가스기술공사에서는 안전문화 운동 추진현황 데이터 관련 지사, 지사 개소일, 개시일, 개시일부터 현재 기준일까지의 총 달성일수 등 제공합니다.안전문화운동은 조직과 지역사회 전반에 안전의식을 확산하고 무사고·무재해 환경을 실현하기 위해 시작된 활동입니다. 개시일은 안전문화 정착을 위한 공식적인 출발점으로, 안전교육, 캠페인, 시설 개선 등의 프로그램이 본격 시행되는 시점을 의미합니다. 달성일은 설정한 목표(예: 무재해 ○일 달성, 안전사고 ‘0’ 달성 등)를 실질적으로 이루어낸 날을 뜻하며, 이는 조직 구성원 모두의 참여와 지속적인 노력의 결과입니다. 개시일부터 달성일까지의 기간은 안전활동의 성과를 수치로 보여주며, 향후 안전관리 정책 개선과 목표 재설정의 근거 자료로도 활용됩니다.'
