description_portal: '해양교통안전정보시스템(MTIS)에서 제공 중인 "해양교통안전지수" 서비스는연안해역에 대해서 선종별로 운항거리 또는 선박등록척수 당 해양사고 심각도를 정량화하여 평가한 지수 입니다.해양교통안전시수 산출방법은 다음과 같습니다.운항거리 또는 등록척수 당 사고 심각도를 산출하고 사고 종류에 대한 가중치를 적용하여 선종별 지수를 산정합니다.주요 기능은 다음과 같습니다.1. 조건선택: 연도, 지역(해역) 선택2. 시각화 및 분석결과 제공: 지역 해역별 안전지수에 대한 결과를 표, 그래프 등으로 시각화 및 엑셀 파일로 즉시 다운로드 가능'
