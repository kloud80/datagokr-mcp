summary_user: 광주 남부소방서가 화재 출동 때 쓰는 화재진압장비를 부서·장비분류·모델명별로 일반/소모품 구분과 수량까지 담은 장비 목록(CSV 파일)이다. 소방 분석가나 지역 주민이 남부소방서가 전기차 화재 진압장비 등 어떤 장비를 몇 개 보유하는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소방서·부서 이름 매칭이나 같은 기관 기준으로만 이어 쓰며, 화재 발생 건별 자료나 119안전센터 자료와 소방서 단위로 나란히 비교한다.
limits: 표준 행정코드 등 전역 조인 키가 없어 다른 소방서·지역 데이터와 자동 결합이 어렵고 이름 매핑이 필요하다. 남부소방서 한 곳의 보유 현황이므로 전국이나 다른 소방서 장비 비교에는 별도 자료가 필요하다.
