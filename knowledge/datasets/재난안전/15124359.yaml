summary_user: 대전광역시 서구에 지정된 자연재해위험지구를 지구별로 한 줄씩 담은 파일로, 지구명·유형(침수·산사태 등)·등급·지정일자, 정비사업 시작·종료일과 사업비, 지번·도로명 주소와 위경도를 함께 싣는다(파일 크기 387바이트로 소량). 주민이나 도시안전 담당자가 '우리 동네 근처에 어떤 재해위험지구가 있고 정비사업은 끝났는가'를 확인하거나 위험지구를 지도에 표시하는 데 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 통계·시설 데이터와 잇고, 위경도로 대피소·급경사지 등 다른 재난안전 위치 데이터나 토지 규제 레이어와 겹쳐 본다.
description_portal: 대전광역시 서구 자연재해위험지구 현황 데이터는 지역별 재해 위험도를 분류하고, 정비사업의 진행 상태를 확인할 수 있는 핵심 자료입니다. 지구명과 유형을 통해 낙석·침수·산사태 등 어떤 위험에 해당하는지 파악할 수 있고, 지번·도로명 주소와 위경도 좌표가 함께 제공되어 지도 기반의 위험지구 시각화가 가능합니다. 등급 항목은 위험 수준을 나타내며, 지정일자 및 정비사업 시작·종료일을 통해 현재까지의 개선 진행도를 확인할 수 있습니다. 사업비 정보는 재정 투입 규모를 분석할 때 유용하며, 비고란은 지역 특성이나 추가적인 관리 사항을 기록하는 데 활용됩니다. 이러한 정보는 서구의 도시안전 정책, 재해 예방 계획, 우선 정비 대상 지역 도출에 실질적인 근거를 제공합니다.
