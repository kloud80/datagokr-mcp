summary_user: 전남 장흥군 관내 보안등 가운데 주변에 전주번호가 있어 위치 연계가 되는 것만 골라, 보안등 한 개씩 설치 주소·위도·경도와 가장 가까운 전주번호를 담은 개별 시설 단위 파일이다. 군청 시설 담당자나 분석가가 "고장 신고된 보안등이 어느 전주 옆에 있는지"를 찾아 점검·보수 위치를 특정하거나 보안등 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소 문자열이나 위도·경도 좌표 기반 공간 매칭으로 잇고, 전주번호를 쓰는 전력 설비 자료가 있으면 전주번호 값으로 맞춰 볼 수 있다.
description_portal: 전라남도 장흥군에  관내에 존재하는 보안등 주변에 위치한 전주번호의 현황을 보다 상세하게 기록한 데이터입니다. 각각의 항목은 보안등이 실제로 설치된 구체적인 주소와 해당 보안등의 위도, 경도 좌표, 그리고 그 보안등과 가장 인접하게 위치한 전주번호 정보로 구성되어 있습니다. 전체 보안등 중에서도 주변에 전주번호 값이 실제로 존재하여 위치상 연계가 가능한 보안등만을 선별하여 추출했습니다. 이를 통해 보안등과 근처 전주번호 간의 연계성을 명확하게 파악할 수 있으며, 향후 유지보수, 정기 점검, 시설물 관리, 도시 인프라 현황 분석 등 다양한 행정적·실무적 업무에 효율적으로 활용할 수 있습니다. 또한 현장 시설물의 체계적 관리, 위치 기반의 시설물 데이터 분석, 도시 안전망 구축 등 여러 방면에서 중요한 기초자료로 제공될 수 있습니다.
