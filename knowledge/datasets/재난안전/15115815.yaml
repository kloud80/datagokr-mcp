summary_user: 부산광역시가 2020년 1월 1일부터 2023년 5월 31일까지 발송한 재난문자(CBS)를 건별로 담으며, 각 건마다 일자, 재난유형, 대상지역, 송출내용, 전송시간을 기록한다. 시민이나 분석가가 '부산에서 어떤 유형의 재난문자가 언제, 어느 지역에 얼마나 자주 발송됐는가'를 확인하거나 재난 유형별 발송 추이를 분석할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 대상지역 이름이나 일자를 맞춰 기상특보·재난 발생 기록 등과 대조하는 방식으로만 연결한다.
