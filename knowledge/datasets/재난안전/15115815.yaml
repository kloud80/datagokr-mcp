description_portal: 부산광역시 재난문자 발송 현황(2020.01.01~2023.05.31.)에 대한 데이터로 일자, 재난유형, 대상지역, 송출내용, 전송시간을 제공합니다.재난문자(CBS)는 일반적으로 사용하는 SMS(Short Messaging Service) 시스템이 아닌 CBS(Cell Brodcasting Service) 시스템을 통해 재난 문자가 발송됩니다. CBS는 SMS처럼 휴대전화번호 데이터베이스를 구축하지 않아도 되고, 인원제한이나 송출 비용이 들지 않는다는 장점을 가지고 있습니다. 이동통신사 기지국에서 통해 발송 되는것이며, 행정안전부와 통신3사와 업무협약을 통해 송출비용이 무상 제공 하고 있습니다. 송출기준은 예보가 발령된 경우, 재난 발생 및 재난 발생 우려로 대국민 홍보가 필요한 경우, 공습경보, 경계경보, 화생방경보, 경보해제(민방위경보통제센터), 기관별 주관하는 재난의 국가위기경보를 발령한 경우, 초미세먼지 비상저감조치가 2개 시도 이상에 발령된 경우(환경부) 등으로 구분됩니다. 송출문안은 기관명, 재난발생상황(일시, 지역, 재난유형 등), 행동요령(안전 유의, 협조, 대피 등)을 포함하여 국민이 할 일을 알기 쉽게 안내합니다.
