summary_user: 광산소방서 관내(광산구)에 등록된 소방시설업체를 업체 한 곳당 한 행으로 담은 등록현황 파일로, 상호·소재지도로명주소·업종(설계업·공사업·감리업·방염업·소방시설관리업 등)·데이터기준일자를 담는다. 건물 관리자나 사업자가 광산구 안에서 소방시설 점검·공사·방염을 맡길 등록 업체를 업종별로 찾을 때 쓰고, 분석가는 관내 업종별 업체 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소를 지오코딩하거나 상호·업종 이름을 맞춰서만 이을 수 있고, 같은 기관의 다른 소방서 업체 현황과 합쳐 쓰는 방식이 현실적이다.
limits: 광산소방서 관내 업체만 담고 있어서, 다른 소방서 관할이나 시도 전체 현황은 따로 모아야 한다. 사업자번호 같은 공통 식별 키가 없으므로 다른 업체 데이터와 연결할 때는 상호·주소 매칭 오류에 주의해야 한다.
