description_portal: '광주광역시 광산소방서 관내(광산구)에 위치한 소방시설업체 등(소방시설 설계업, 소방시설 공사업, 소방공사 감리업, 섬유류 방염업, 합성수지류 방염업, 합판·목재류 방염업, 소방시설관리업) 등록현황입니다. 상호, 소재지도로명주소, 업종 등의 항목을 제공합니다. 1. “소방시설업”이란 다음 각 목의 영업을 말한다.가. 소방시설설계업: 소방시설공사에 기본이 되는 공사계획, 설계도면, 설계 설명서, 기술계산서 및 이와 관련된 서류(이하 “설계도서”라 한다)를 작성(이하 “설계”라 한다)하는 영업나. 소방시설공사업: 설계도서에 따라 소방시설을 신설, 증설, 개설, 이전 및 정비(이하 “시공”이라 한다)하는 영업다. 소방공사감리업: 소방시설공사에 관한 발주자의 권한을 대행하여 소방시설공사가 설계도서와 관계 법령에 따라 적법하게 시공되는지를 확인하고, 품질ㆍ시공 관리에 대한 기술지도를 하는(이하 “감리”라 한다) 영업라. 방염처리업: 「소방시설 설치 및 관리에 관한 법률」 제20조제1항에 따른 방염대상물품에 대하여 방염처리(이하 “방염”이라 한다)하는 영업2. “소방시설업자”란 소방시설업을 경영하기 위하여 제4조에 따라 소방시설업을 등록한 자를 말한다.3. “감리원”이란 소방공사감리업자에 소속된 소방기술자로서 해당 소방시설공사를 감리하는 사람을 말한다.4. “소방기술자”란 제28조에 따라 소방기술 경력 등을 인정받은 사람과 다음 각 목의 어느 하나에 해당하는 사람으로서 소방시설업과 「소방시설 설치 및 관리에 관한 법률」에 따른 소방시설관리업의 기술인력으로 등록된 사람을 말한다.'
