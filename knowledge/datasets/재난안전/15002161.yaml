summary_user: 한국가스안전공사가 가스안전관리 우수판매업체로 인증한 전국 가스판매업소를 업소 1곳당 1행으로 담은 명단 파일(CSV, 약 12KB)로, 인증번호·관할 지역본부·업소명·전화번호·주소를 담는다. 국민이 "우리 동네에서 가스안전 우수 인증을 받은 LPG 판매점은 어디인가"를 찾거나, 분석가가 지역본부별 우수업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 지역본부 이름으로만 연결한다.
description_portal: '전국 가스판매업체 중 가스안전관리 분야에서 한국가스안전공사 인증을 받은 우수판매업체 명단을 게시합니다.해당 데이터는 인증 번호, 관할 지역본부, 업소명, 전화번호, 주소 등으로 구성되어 있습니다.업계의 우수한 판매사업체를 공개하여 국민에게 도움이 됩니다. 또한 정보를 활용하여 관련한 정책 수립 등에 사용할 수 있습니다.※ 해당 데이터는 한국가스안전공사가 업무 활용을 위해 수집, 관리하는 정보로, 타 관계기관이 제공하는 정보와 상이할 수 있으니 참고 바랍니다.※ 2024년 데이터 기준일 기준 현황입니다.- 데이터 기준일 : 2020년 8월 31일'
