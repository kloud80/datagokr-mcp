summary_user: 경상북도 영천시 안의 복지회관·체육관·강당 등 지진재난 이재민 수용시설을 시설 한 곳당 한 행으로 담고, 시설명·소재지 주소·면적·수용인원·데이터 기준일자를 기록한 시군구 단위 파일(CSV 약 2.7KB)이다. 영천시 주민이나 구호 담당자가 "지진으로 집을 잃으면 우리 동네 어느 시설에 몇 명까지 임시로 머물 수 있나"를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 대피·구호시설 데이터와는 시설명·주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 데이터는 경상북도 영천시의 지진재난 이재민 수용시설 현황을 상세하게 나타낸 자료입니다. 영천시 내에 위치한 복지회관, 체육관, 강당 등 다양한 공공시설물들의 명칭, 소재지 주소, 면적, 수용인원, 데이터 기준일자 등의 정보를 포함하고 있으며, 재난 발생 시 이재민의 안전한 임시 수용을 위해 활용될 수 있는 중요한 자료입니다. 본 데이터는 영천시의 행정기관이 관리하는 시설들을 체계적으로 정리하여, 재난 대응 및 긴급 구호 활동에 필요한 기초 자료로 제공됩니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 안전재난하천과로 연락주시기 바랍니다.
