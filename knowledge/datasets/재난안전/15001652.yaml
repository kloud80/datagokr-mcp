summary_user: 한국가스안전공사가 매년 실시한 가스안전 국민의식 조사 결과를 분야(인식·공감, 경험, 실천)·성별·연령대·거주지역·직종 구분별로 2018~2020년 연도별 값으로 담은 전국 단위 집계표(약 1KB CSV)이다. 가스안전 정책 담당자나 연구자가 '연령대나 지역에 따라 가스안전 실천 수준이 어떻게 다르고, 해마다 어떻게 변했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분명(지역·연령대 등 이름)을 맞춰 연결해야 한다.
description_portal: '한국가스안전공사가 가스안전의 정책방향과 대국민 의식 전환에 참고를 위해 매년 실시하고 있는 가스안전 의식조사 결과 현황을 구분(분야별, 성별, 거주지역, 직종 등)하여 제공하는 데이터입니다.해당 데이터는 분야별(인식/공감, 경험, 실천), 성별, 연령별(20대~60대이상), 거주지역, 직종을 2018년에서 2020년 사이의 연도별 결과로 구성되어 있습니다. 가스안전에 관한 국민의 안전의식을 참고 할 수 있습니다.※ 해당 정보는 타 유관기관에서 자체 수집, 관리를 통해 제공하는 정보와 일부 상이할 수 있음을 참고 바랍니다.-데이터 기준일자 : 2020년 12월 31일'
