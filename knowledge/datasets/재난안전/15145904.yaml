summary_user: 한국전기안전공사가 자가용전기설비 정기검사 결과에 매긴 2025년 안전등급(A~E 5등급) 이력을 설비(상호·소재지)별 건별로 담은 전국 단위 파일이며, 수전·발전 전압(V)과 용량(kW), 검사일자·검사결과·검사자를 함께 싣는다. 시설 관리자나 분석가가 "우리 지역에서 안전등급이 낮게 나온 고압 수전설비는 어디인가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 시설 안전 데이터와는 상호명·소재지 주소를 맞춰 이어야 한다.
description_portal: 한국전기안전공사에서는 자가용전기설비의 정기검사 결괄에 대한 안전등급제를 시행하고 있습니다.전기설비 안전등급 기준은 전기적 요인(60점)과 환경적 요인(40점)으로 5등급(A등급, B등급, C등급, D등급, E등급)으로 기준을 정하고 있습니다.전기적 요인은 설비별 외관검사, 측정 및 시험, 기타 등 검사항목에 따른 평가지표를 적용하며, 환경적 요인은 사용기간, 부하율, 사용환경, 안전관리자 직무고시 이행 등 평가항목을 적용하고 있습니다.이 데이터는 2025년 안전등급 이력정보를 상호, 소재지, 수전전압, 수전용량, 발전전압, 발전용량, 검사일자, 검사결과, 검사자, 안전등급을 제공하는 데이터입니다.수전전압과, 발전전압의 단위는 볼트(V)이며, 수전용량과 발전용량의 단위는 킬로와트(kW)입니다. 그리고 설비의 특성상 수전설비는 있지만 발전설비는 없을 수 있습니다.
