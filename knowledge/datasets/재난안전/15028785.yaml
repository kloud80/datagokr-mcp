summary_user: 부산광역시 연제구가 관리하는 가로등(도로조명)을 도로명·위치 구간별로 묶어 구간마다 가로등 개수를 담은 집계형 파일(CSV, 약 12KB)이다. 주민이나 분석가가 "우리 동네 어느 도로 구간에 가로등이 몇 개 있는가", "야간 보행 안전 취약 구간은 어디인가"를 따져볼 때 쓴다. 실측 컬럼에 행정코드 같은 전역 조인 키가 없어서, 다른 데이터와는 도로명·위치 이름을 맞춰 매핑하거나 같은 기관(연제구) 자료끼리만 이어 쓴다.
description_portal: 부산광역시 연제구 관내에서 관리하는 도로조명(가로등)에 대한 공공데이터로 구간별 가로등 현황 데이터(가로등 위치, 해당 가로등 도로명, 가로등 개수) 정보를 포함합니다.도로조명이란 도로나 보행로에 인공광원을 설치하여 야간이나 악천후 시 시야를 확보하고, 교통안전과 보행자의 안전을 도모하기 위한 조명시설을 말합니다.도로조명의 목적은 다음과 같습니다.- 야간 시인성 확보- 교통사고 예방- 보행자 안전 강화우리 도시안전과에서는 도로조명(가로등)의 현행화 및 유지관리에 만전을 다하겠습니다. 감사합니다.
