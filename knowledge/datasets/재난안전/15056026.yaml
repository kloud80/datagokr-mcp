summary_user: 제주시 주민복지과가 관리하는 재난 대비 이재민 수용시설을 시설 한 곳당 한 행으로 담은 파일로, 건물명·위치·수용가능인원·관리책임자·데이터기준일자를 담는다(CSV 약 8KB). 재난 때 제주시 주민이 어느 건물로 대피·수용되는지, 담당 공무원이 지역별 수용 인원이 충분한지 확인하는 데 쓴다. 전역 조인 키나 좌표가 없어 다른 대피·구호시설 데이터와는 건물명·주소(위치)를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도 제주시 관내에서 관리하고 있는 재난 대비 이재민 수용시설 현황을 정리한 공공데이터입니다. 담당 부서는 제주시 주민복지과이며, 재난 발생 시 이재민 보호와 임시 수용을 위한 시설 정보를 파악할 수 있도록 구성되어 있습니다.주요 항목은 건물명, 위치, 관리책임자 등으로 이루어져 있으며, 이를 통해 수용시설의 명칭, 소재지, 관리 주체 등 기본 현황을 확인할 수 있습니다. 제주시 내 재난 대응용 수용시설의 분포와 관리 현황을 파악하는 데 활용할 수 있습니다.이 데이터는 재난 대응체계 운영, 이재민 임시거주시설 관리, 주민 보호계획 수립, 재난 취약지역 대비, 비상시 수용시설 안내 등 관련 행정업무와 정책 검토의 기초자료로 활용할 수 있습니다.
