description_portal: 대구광역시 서구 도심 내 안전하고 쾌적한 도시 환경 조성을 위한 현수막 게시 금지 구역입니다. 구역명, 상세구간, 담당부서, 문의처, 지정일을 포함합니다.본 데이터는 대구광역시 서구에서 지정한 현수막 제로거리의 구역별 세부 현황을 제공한 것이다. 구역명, 상세구간, 담당부서, 문의처, 지정일 등의 정보로 구성되어 있으며, 불법 현수막 게시를 사전에 예방하고 옥외광고물 관리의 효율성을 제고하기 위하여 구축되었다. 각 지점별 위치를 도로명과 인근 지번 중심으로 명확히 제시하여 이용자의 공간적 이해도를 높였으며, 지정일 정보를 통해 행정적 적용 시점을 확인할 수 있도록 하였다. 또한 담당부서와의 직접적인 문의 연계를 지원함으로써 민원 대응의 신속성을 확보하였다. 본 데이터는 도시경관의 개선과 공공질서 유지를 위한 행정적 관리 기반을 마련하고자 개방된다.
