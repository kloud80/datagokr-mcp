description_portal: 이 데이터는 경찰청에서 일회성으로 제공하는 신체피해상황 관련 자료로, 범죄 사건에 따른 남녀 피해자 수와 사망 및 상해 현황을 상세히 기록하고 있다. 데이터는 구분, 상해-남자, 상해-여자, 사망-남자, 사망-여자 항목으로 구성되며, 범죄별 피해자 수와 피해 유형별 피해자 현황을 제공한다. 이를 통해 사건별 피해 규모를 파악하고 성별 피해 분포를 이해할 수 있으며, 경찰의 피해자 보호 대책 마련과 범죄 예방, 사건 분석 및 정책 수립에 활용될 수 있는 기초자료로서 가치가 높다. 또한 피해자 현황을 체계적으로 관리하여 사건 처리의 투명성을 높이고, 경찰의 신속한 대응과 피해자 지원을 위한 자료로 사용될 수 있다. 본 데이터는 범죄 피해 현황을 명확히 파악하고 국민의 안전을 위한 정책 수립을 지원하는 데 유용하다.
