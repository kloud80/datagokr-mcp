description_portal: 본 데이터는 경기도 안양시에서 제공하는 안전귀가서비스 운영 현황을 정리한 정보이다. 해당 서비스는 시민의 안전한 귀가를 돕기 위한 목적으로 시행되며, 특히 여성 및 청소년 등 사회적 약자의 보호를 강화하기 위해 마련되었다. 데이터는 연번, 지자체명, 지자체 코드, 경도, 위도 항목으로 구성되어 있으며, 사용자는 경기도 내에서 안전귀가서비스를 제공하는 지자체를 확인할 수 있다.본 데이터는 시민의 야간 보행 안전을 증진하고, 지자체의 보호서비스 운영 실태를 투명하게 공개하는 데 목적이 있으며 지역별 치안 강화 및 공공안전 정책 수립에 활용 가능하다.
