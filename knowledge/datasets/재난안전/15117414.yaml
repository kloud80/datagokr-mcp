description_portal: 119신고자에게 긴급구조표준시스템 IVR(ARS)시스템을 통해 자동으로 응답하는 멘트정보들에 대한 세부내용이며, 자동응답멘트는 119 신고자가 전화를 걸었을 때 상황별로 제공되는 자동응답 메시지를 정리한 데이터입니다. 지진, 정전, 폭우 등 상황에 따라 제공되는 다양한 유형의 멘트가 포함되며, 긴급 상황에서 일관된 안내 제공과 시민 대응력 강화를 위한 자료로 활용됩니다. 일부 멘트만 포함된 참고용입니다.-일반적인 상황시, 지진발생시, 정전발생시, 대형화재 발생시, 폭우발생시, 태풍발생시, 동보신고 안내시, 호폭주시* 본 자료는 긴급구조표준시스템에서 추출한 자료로 일부 데이터에 오류가 있을 수 있으며 참고용으로만 활용가능* 오류 없는 정밀한 데이터를  확인하기 위해서는 관련부서로 문의 필요
