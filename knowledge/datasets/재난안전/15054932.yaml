summary_user: 광주 남부소방서와 광주광역시의 상반기(1월 1일~8월 1일) 화재건수·재산피해액·사망자·부상자를 2025년과 2024년으로 나란히 놓고 증감을 적은 333바이트짜리 비교 집계표입니다. 남부소방서 관할에서 올해 상반기 화재와 인명·재산 피해가 작년보다 늘었는지 줄었는지 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명(광주·남부소방서)이나 같은 기관의 다른 소방 데이터와 이름으로 맞춰서만 이어 씁니다.
description_portal: '광주광역시 남부소방서에서 발생한  화재발생현황 비교자료 입니다.  - 상세내용: 2025년 광주광역시 및 남부소방서 상반기 화재건수, 재산피해액,사망(명), 부상(명), 비교 증감 데이터를 나타내는 문서입니다. - 기준일자:2024년 1월1일 ~ 2024년 8월 1일 과 2025년 1월 1일 ~ 2025년 8월 1일  상반기 자료를 바탕으로 증감된 내용을 구분하였습니다  - 본 자료는 국가화재정보시스템 데이터를 기반으로 하였습니다.- 목적: 현황파악, 원인 분석, 예방 대책 등을 제시할 수 있습니다.- 국가화재정보시스템을 통해 화재발생 원인 장소 발화요인등 더욱 많은 내용등을 파악할 수 있습니다.'
