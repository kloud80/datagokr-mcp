summary_user: 재난안전데이터 공유플랫폼이 제공하는 현장 CP 정보로, 지역코드·일련번호·수용시설물 일련번호·지구명·피해예상지역명·대피장소를 건별로 담으며 범위는 전국이다. 지자체 재난 담당자나 분석가가 특정 지구의 피해예상지역 주민이 어느 대피장소로 가야 하는지 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 대피·구호시설이나 재난 위험지역 데이터와는 지역코드(RGN_CD)·지구명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 현장 CP 정보로, 지역코드, 일련번호, 수용시설물일련번호, 지구명, 피해예상지역명, 대피장소 등을 제공하고 있습니다. 데이터의 갱신주기는 5분입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
