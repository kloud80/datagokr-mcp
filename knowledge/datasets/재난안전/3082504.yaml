summary_user: 서귀포시가 재난 때 이재민이 일시 거주하도록 지정한 임시거주시설을 시설 한 곳당 한 행으로 담은 파일(csv 약 5.6KB)로, 구분·시설명·도로명 주소·위도·경도·면적·내진설계 여부를 시설 단위로 기록한다. 주민이나 행정 담당자가 "서귀포시에서 재난으로 집을 잃으면 어느 시설에 머물 수 있고, 그 시설은 내진설계가 되어 있나"를 확인하거나, 시설 위치를 지도에 표시해 안내도를 만드는 데 쓴다. 전역 조인 키는 없어서 다른 대피·구호시설 데이터나 재난 위험지역 데이터와는 주소·좌표 기반 공간 매칭이나 시설명 대조로 이어 쓴다.
description_portal: 이 데이터는 재난 발생 시 이재민 및 전재민이 일시 거주할 수 있도록 지정된 임시거주시설의 현황 정보를 담고 있습니다. 각 시설에 대해 이름, 도로명 주소, 위도·경도 좌표, 면적, 내진설계 여부 등이 포함되어 있어 공간 기반 대응 전략 수립에 사용 가능합니다. 행정기관은 재난 대응 계획을 수립할 때, 지정 시설의 위치, 규모, 접근성 및 안전성을 분석하여 시설별 활용 우선순위를 정하고, 실시간 대응 매뉴얼에 반영할 수 있습니다. 또한, 지역사회에서는 GIS 시각화를 통해 주민 안내 지도를 제작하거나, 재난훈련 시 시뮬레이션 거점으로 활용할 수 있어 초기 대응력 강화와 복구 계획 수립에 실질적인 기초 자료로서 중요한 가치를 지니고 있습니다.
