description_portal: 본 데이터는 한국승강기안전공단 대표 홈페이지의 ‘사전정보공표’ 영역에서 사용하는 분류체계를 관리하는 기준 자료입니다. 행 단위로 카테고리명, 사용여부(Y/N), 등록일시(시스템에 등록·변경된 시점)가 저장되며, 실제 공표 글(제목·본문·첨부 등) 내용은 포함하지 않습니다. 사용여부는 게시 운영에 적용 가능한 활성 상태를 의미하고, 등록일시는 카테고리 생성 또는 속성 변경의 이력을 식별하는 기준으로 활용됩니다. 데이터의 범위는 사전정보공표 메뉴에 한정되며, 다른 게시판·내부 업무시스템의 분류값은 대상이 아닙니다. 동일·유사 명칭이 시점별로 재정의될 수 있으므로 카테고리 키 관리와 중복 방지가 필요합니다. 본 자료는 공표 항목 분류, 메뉴 구조 관리, 공개·비공개 전환 이력 파악 등 홈페이지 운영의 기준코드로 활용되는 메타데이터입니다.
