summary_user: 소방청이 관리하는 소방장비를 대분류부터 세세분류까지 단계별로 나눈 전국 공통 표준 분류표로, 분류마다 내용연수·주력장비 여부·점검제외 여부·장비관리 구분을 함께 담은 코드성 파일(csv, 약 94KB)이다. 소방조직의 장비 담당자나 분석가가 "이 장비는 어느 분류에 속하고 내용연수가 몇 년이며 주력장비인가"를 확인하거나 장비 구매·예산 기준을 맞출 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방 데이터(119안전센터, 장비 보유 현황 등)와는 장비 분류명 문자열을 맞추는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 소방청이 관리하는 각종 소방장비를 목적과 기능에 따라 체계적으로 구분·정리한 자료입니다. 이 데이터에는 장비의 대분류–중분류–소분류 체계가 포함되어 있으며, 화재진압 장비, 구조 장비, 구급 장비, 개인보호 장비, 통신 장비, 지원 장비 등으로 나뉘어 있습니다. 예를 들어 화재진압 장비에는 소방펌프, 방수구, 호스 등이, 구조 장비에는 인명구조용 공구나 절단기, 구급 장비에는 자동심장충격기(AED), 산소호흡기 등이 속하는 방식입니다. 또한 장비별 코드와 명칭이 함께 제공되어 현장에서 장비를 표준화해 관리할 수 있도록 돕습니다.이 데이터의 가장 큰 특징은 전국 소방조직에서 공통적으로 사용할 수 있는 표준 장비 분류체계를 제시한다는 점으로, 장비 관리의 일관성을 확보하고, 예산 집행 및 장비 구매 시 기준을 명확히 합니다.
