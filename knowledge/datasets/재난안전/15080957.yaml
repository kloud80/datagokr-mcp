summary_user: 울산시 차량화재 신고를 다룬 CSV 파일(약 20KB)로, 필드 구성상 접수경로·접수일시·상황종료일시, 긴급구조 주소(우편번호·시도·구군·동·리), 종별·분류·규모, 관할 소방서·센터를 신고 건별로 담는다. 분석가나 소방·교통안전 담당자가 울산에서 차량화재 신고가 어느 동네·시기에 많고 접수부터 상황종료까지 얼마나 걸리는지를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 우편번호나 시도·구군·동 이름 매핑, 관할서명으로만 연결한다.
description_portal: “울산시 차량화재 종별 신고 재난 데이터”는 울산광역시에서 발생한 차량 관련 화재 신고 현황을 차종과 원인별로 구분해 기록한 통계자료입니다. 이 데이터에는 승용차, 화물차, 버스, 이륜차, 특수차량 등 차량 종류별 화재 발생 건수가 포함되며, 전기적 요인, 기계적 결함, 교통사고, 부주의 등 화재 원인별 구분도 함께 확인할 수 있습니다. 또한 연도별·월별 신고 추이를 통해 특정 계절이나 시기별로 차량 화재가 증가하는 양상을 파악할 수 있고, 노후 차량 비율이나 교통량 증가 같은 지역적 특성과의 연관성도 분석할 수 있습니다. 이를 통해 울산시에서 상대적으로 빈번하게 발생하는 차량 화재 유형을 객관적으로 확인할 수 있으며, 향후 차량 안전 점검 강화, 예방 캠페인 기획, 소방 자원 배치 최적화, 교통안전 정책 수립 등 다양한 활용이 가능합니다. 나아가 전기차·수소차와 같은 신차종의 화재 발생 현황 분석에도 기초자료로 쓰일 수 있습니다.
