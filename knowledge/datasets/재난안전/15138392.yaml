description_portal: 이 데이터는 한국승강기안전공단이 운영하는 ‘승강기안전기술원’ 홈페이지에서 콘텐츠별 활용도를 파악하기 위해 수집·집계한 지표입니다. 각 행은 개별 콘텐츠를 단위로 하며, 내부 식별용 ‘콘텐츠 순번’과 ‘콘텐츠 이름’, 그리고 사용자 행동 기반의 정량항목인 ‘콘텐츠 공유 건수’(외부 공유 버튼 클릭 등)와 ‘콘텐츠 평가 건수’(페이지별 만족도/평가 기능 응답 건수)를 포함합니다. 목적은 사이트 운영성과와 품질관리를 위한 기초 통계 제공에 있으며, 범위는 기술원 홈페이지 내 게시·민원·인증안내·회원기능 등 다양한 메뉴로 구성된 공개/회원 전용 화면을 포괄할 수 있습니다. 단, 페이지뷰, 체류시간, 유입경로 등 웹로그 지표는 포함되지 않으며, 수치의 집계 기준(일/월/누적)과 포함 기간은 원자료의 정의에 따릅니다.
