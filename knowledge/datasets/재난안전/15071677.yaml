description_portal: 산악구조장비 보유현황 공공데이터는 산악사고 발생 시 활용되는 구조장비의 종류, 수량, 보관 위치 및 운영 현황을 체계적으로 정리·관리하여 제공하는 자료입니다. 2024년 12월 31일 기준 광주광역시 서부소방서 데이터 주요 항목에는 로프, 들것, 안전모, 하네스, 카라비너, 산악용 들것, 드론, 위치추적장비, 구조차량 등 특수 장비의 보유 현황과 사용 가능 여부, 정비 및 교체 이력 등이 포함됩니다. 이 데이터를 통해 관계 기관은 산악사고 대응 능력을 객관적으로 파악하고, 장비 부족 지역이나 노후 장비의 보강 필요성을 조기에 확인할 수 있습니다.
