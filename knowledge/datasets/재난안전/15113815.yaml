summary_user: 충청북도 옥천군 안에 지정된 풍수해 대피시설을 시설별 한 행씩 담은 원천 파일로, 검증 시 311행 전체가 수신됐고 주소와 좌표(위도·경도)가 개별 시설 단위로 들어 있다. 주민이나 재난 담당자가 태풍·집중호우 때 우리 동네에서 어느 대피소로 가야 하는지, 지역별 대피소 분포는 어떤지 확인하는 데 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)를 키로 다른 대피·구호시설 데이터나 지도 데이터와 이어 쓴다.
description_portal: 충청북도 옥천군_풍수해대피소 데이터는 태풍, 집중호우 등 풍수해(風水害) 발생 시 주민의 안전한 대피를 위해 옥천군 내에 지정된 대피시설의 정보를 체계적으로 정리한 공공데이터입니다. 주요 항목으로는 시설 고유번호(연번), 시설명, 구분(마을회관, 학교 등), 도로명주소, 지번주소, 위도/경도(위치 좌표), 면적(㎡), 수용인원(명), 데이터 기준일자 등이 포함되어 있습니다. 이 데이터는 재난 발생 시 신속한 대피와 행정적 지원, 안전대책 마련에 필수적으로 활용되며, 지역별 대피소 분포와 수용능력, 접근성 분석에도 유용합니다. 또한, 관공서·지자체·공공기관 등의 재난예방 및 위기대응 계획 수립뿐만 아니라 연구기관, 기획자, 시민 누구나 공공데이터포털에서 직접 다운로드해 다양한 기초자료로 사용할 수 있는 특징이 있습니다. 대피소 정보는 정기적으로 갱신되어 최신 현황이 반영되며, 만약의 상황에 대비한 지역 사회의 실질적인 방재역량 강화를 위한 중요한 자료로 활용됩니다.
