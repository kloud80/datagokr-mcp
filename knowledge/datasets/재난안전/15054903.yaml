summary_user: 광산소방서 소속 소방공무원이 받는 특수건강검진의 필수 검사항목과 항목별 검사주기를 항목 단위로 정리한 작은 목록 파일(csv, 약 1.4KB)이다. 소방공무원이나 보건 담당자가 "소방관 특수건강검진에서 어떤 검사를 몇 년마다 받아야 하나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 검사항목 이름이나 같은 기관 기준으로만 맞춰 볼 수 있다.
description_portal: '광주광역시 광산소방서 소속 소방공무원 특수건강검진 항목에 대한 데이터로 검사항목, 주기 등의 내용을 담고 있습니다.제1조(목적) 이 고시는 「산업안전보건법」 제135조제3항에 따른 특수건강진단기관의 건강진단·분석 능력 평가 등에 관하여 필요한 사항을 규정함을 목적으로 한다.제2조(용어의 정의) ① "정도관리”란 「산업안전보건법」(이하 "법”이라 한다) 제135조제3항에 따라 특수건강진단의 정확성과 신뢰성을 확보하기 위하여 다음 각 호의 분야에 대한 검사 등 능력을 평가하는 것을 말한다.  1. 분석정도관리: 생물학적노출지표검사 중 유해물질 자체 또는 유해물질 대사산물의 농도를 측정하기 위한 무기분석 및 유기분석 능력을 평가  2. 진폐정도관리: 흉부방사선사진 촬영·폐활량 검사능력을 평가  3. 청력정도관리: 청각학적 검사 및 판정 능력을 평가  ② "생물학적노출지표검사”라 함은 근로자가 작업환경으로부터 노출되는 유해물질의 체내흡수 정도를 정확히 측정하기 위하여 혈액 및 소변 등의 시료로부터 유해물질 자체, 그 대사산물 또는 그로 인한 생화학적 변화산물을 분석하는 검사를 말한다.  ③ "표준시료”라 함은 분석정도관리의 무기 및 유기분석 검사능력 평가를 위하여 유해물질 자체 또는 그 대사산물을 표준농도별로 제조한 시료를 말한다.  ④ "기준실험실”이라 함은 분석정도관리의 공정한 평가를 위한 기준값과 신뢰범위 산정을 위하여 표준시료에 대한 분석을 의뢰할 수 있는 우수한 시설, 장비 및 인력을 보유한 국내·외 기관의 실험실을 말한다.  ⑤ "정도관리평가”란 법 제135조제3항에 따라 정기정도관리, 수시정도관리에 대한 분야별 건강진단·분석능력 평가를 말한다.  ⑥ 이 고시에서 사용하는 용어의 뜻은 이 고시에 특별한 규정이 있는 것을 제외하고는 법 및 「산업안전보건법 시행령」(이하 "영”이라 한다) 및 「산업안전보건법 시행규칙」(이하 "규칙”이라 한다)에서 정하는 바에 따른다.'
