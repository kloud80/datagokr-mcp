description_portal: 전체적인 단속 건수는 2010년 이후 장기적인 감소 추세를 보입니다. 초범(1회) 단속은 2010년 약 17.9만 건에서 2025년 약 6만 건으로 대폭 줄어들며 전체 수치 하락을 견인했습니다. 특히 2019년(윤창호법 시행 시기)을 기점으로 건수가 눈에 띄게 감소한 것이 특징입니다.반면, 상습 음주운전 양상은 다소 다릅니다. 2회 이상 재범자는 전체 감소세에 비해 하락 폭이 완만하며, 7회 이상 상습 위반자는 2010년 478명에서 2025년 935명으로 오히려 약 2배 증가했습니다. 이는 단순 적발 건수는 줄고 있으나, 일부 상습 위반자들에 대한 집중적인 관리와 근절 대책이 여전히 시급함을 시사합니다.
