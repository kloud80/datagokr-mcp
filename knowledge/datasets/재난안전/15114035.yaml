summary_user: 진주시가 태풍·집중호우 침수 위험에 대비해 지정한 수해대피소를 마을별로 시설명·대피소 구분·수용능력 인원과 함께 한 행씩 담은 작은 파일(csv 약 4KB)이다. 진주시 주민이나 재난 담당자가 "우리 마을 수해 시 어느 시설로 대피하고, 몇 명까지 수용되나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 대피시설·재난위험지역 데이터와는 마을명이나 시설명 같은 이름 매칭으로만 연결한다.
description_portal: 진주시에서는 여름철 태풍이나 집중호우 등으로 인해 침수 피해가 발생할 가능성이 있는 지역을 중심으로, 주민들의 생명과 재산을 보호하기 위한 사전 대비책으로 지역별 대피소를 지정해 운영하고 있습니다. 이 대피소 현황에는 각 마을별 대피시설의 명칭, 위치, 수용 가능 인원 등 구체적인 정보가 포함되어 있어, 위기 상황 발생 시 주민들이 안전하게 대피할 수 있도록 돕고 있습니다. 진주시는 재난 대응 체계를 강화하고, 신속하고 질서 있는 대피가 이루어질 수 있도록 지역 주민들에게 정기적으로 대피소 정보를 제공하고 있으며, 주민들도 각자의 거주지 인근 대피소 위치와 수용능력을 사전에 숙지해 둘 필요가 있습니다. 이러한 대비는 인명 피해를 최소화하고, 재난 발생 시의 혼란을 줄이는 데 큰 역할을 합니다.
