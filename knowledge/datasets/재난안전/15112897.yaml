summary_user: 대구광역시 남구 관내에서 기계설비 성능점검 대상이 되는 건축물을 건물 한 건씩 담은 목록 파일로, 소재지(법정동·대지구분·본번·부번), 건물명, 연면적, 세대수, 우편번호를 수록하며 CSV 크기는 약 4KB로 작다. 건물 관리자나 설비 점검업체가 '우리 건물이 기계설비 성능점검 대상인가'를 확인하거나, 구청·분석가가 남구 내 점검 대상 건물의 규모 분포를 살필 때 쓴다. 전역 조인 키(건축물대장 고유번호 등)는 없으므로, 법정동과 본번·부번으로 만든 지번 주소를 건축물대장이나 다른 시설 안전 원장과 맞대어 이어 쓴다.
description_portal: 본 데이터는 기계설비 성능점검이 필요한 건축물의 현황을 파악하기 위해 구축된 자료로서,대구광역시 남구 관내의 해당 건축물에 대한 위치 및 기본 정보를 포함하고 있습니다.주요 항목으로는 시군구, 법정동, 대지구분, 본번, 부번, 건물명, 연면적, 세대수, 우편번호 등 건축물의 물리적 규모와 행정식별에 필요한 정보가 수록되어 있습니다.해당 데이터는 기계설비의 안전한 유지관리 및 성능 확보를 위한 기반자료로 활용될 수 있으며,건축물 관리 주체, 설비 점검기관, 관련 행정기관 등이 해당 정보를 바탕으로 점검 대상 건축물의 선정, 점검 이력 관리, 정비 계획 수립 등을 수행할 수 있습니다.또한, 도시계획 수립, 재난대응체계 마련, 에너지 효율 개선 등 다양한 공공 정책 분야에서도 활용이 가능하며, 대민 서비스 제공 및 민원 응대에도 유용한 자료가 될 수 있습니다.
