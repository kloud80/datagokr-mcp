summary_user: 3D 스마트화재감시 시스템이 시설별로 감지한 화재 발생 이력을 건별로 담으며, 시설번호·이력번호·발생코드·발생일시·재난번호와 코드 체계(상위코드·코드단계·정렬순서) 항목이 함께 있다. 소방·안전 분석가가 특정 시설에서 화재 감지가 어느 시간대·주기로 반복되는지 보고 예방 점검 시점을 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시설번호·재난번호 같은 경기도 내부 코드나 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 3D 스마트 화재감시 시스템을 통해 수집된 화재 발생 이력 정보를 포함합니다. 주요 항목으로는 시설번호, 화재프로그램이력번호, 화재프로그램발생코드, 화재프로그램발생일시, 재난번호 등이 있으며, 이는 특정 시설 내에서 감지된 화재 사건을 시간순으로 기록하여 이력을 관리하기 위한 목적입니다. 데이터는 3D 스마트화재감지시스템의 결과를 기반으로 구성되며, 프로그램 단위로 화재 발생 상황을 식별하고, 해당 시점과 연계된 재난번호를 통해 각 사건을 추적할 수 있습니다. 이러한 데이터를 활용하면 발생일시 자료 바탕으로 화재 발생 시점에 대한 주기 등을 파악하여 예방 시스템을 고도화하는 데 활용될 수 있습니다.
