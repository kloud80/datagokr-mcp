summary_user: 충청남도 보령시가 지정한 인명피해 우려지역을 지역(시설)별 한 행으로 담은 건별 원천 파일로, 지번·도로명 주소와 위도·경도, 피해우려유형, 대피 세대·인원, 대피기준과 대피장소, 담당부서를 함께 싣는다. 보령시 주민이나 방재 담당자가 '우리 동네 침수·붕괴 위험지역은 어디이고, 그곳 주민은 어떤 기준으로 어디로 대피하나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표로 공간 매칭하거나 대피장소 이름을 대피소 데이터와 맞춰 이어 쓴다.
description_portal: 기후변화로 인한 집중호우, 태풍 등 극한 기상현상 빈발과 도시화 진행에 따른 재해 위험도 증가에 대응하여 선제적 재난관리 체계 구축의 중요성이 대두됨에 따라 보령시는 침수, 붕괴, 토사 등으로 인한 인명피해 우려지역을 체계적으로 관리하고 있습니다. 과거 피해 이력, 지형적 특성, 기상조건 등을 종합 분석하여 위험지역을 선정하고, 각 지역별 특성에 맞는 대피기준과 대피장소를 사전 지정하여 골든타임 확보와 인명피해 최소화에 중점을 두고 있습니다. GIS 좌표 정보를 활용한 정확한 위치 파악과 담당부서별 책임 관리를 통해 신속한 상황대응 체계를 운영하며, 주민 대피 훈련과 재난 대비 교육에도 핵심 자료로 활용하고 있습니다.
