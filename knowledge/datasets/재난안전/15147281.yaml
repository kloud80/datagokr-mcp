description_portal: 인천광역시 범죄 발생 통계 공공데이터는 우리 지역에서 발생하는 다양한 범죄의 현황을 수치로 보여주는 정보입니다.이 데이터를 통해 해당연도에 얼마나 많은 범죄가 일었났는지에 대해 수치로 볼 수 있어 쉽게 파악할 수 있습니다.시민들이 우리 동네의 안전 수준을 객관적으로 파악하고, 범죄 예방에 대한 관심을 높이는 데 활용될 수 있습니다.범죄발생이 얼마나 일어났는지를 보고 CCTV 추가설치, 순찰 강화 등 더 효과적인 범죄 예방 대책을 세울 수 있습니다.이 데이터는 공공데이터포털에서 무료로 다운로드 할 수 있습니다.
