summary_user: 서귀포시 내 급경사지를 지구별로 한 줄씩 담은 안전점검 결과 파일로, 연도·지구명·위치·유형·위험등급·지구지정일과 위도·경도를 포함한다(CSV 약 2.6KB 규모의 소규모 목록). 주민·여행객이나 지자체 담당자가 '내 거주지나 이동 경로 주변에 위험등급이 높은 급경사지가 있는가'를 확인하고, 우선 관리·보강 대상 지구를 고르는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도로 지도 위에 겹치거나 지구명·주소를 맞춰 붙여 쓰며, 대피시설·재해위험지구 같은 재난 위험지역 레이어나 토지 규제 레이어와 공간으로 겹쳐 보는 방식이 현실적이다.
description_portal: 이 데이터는 서귀포시 내 급경사지(경사가 매우 급한 산지나 사면 등)의 안전 점검 결과를 담고 있습니다.각 지구명과 위치, 유형, 위험등급 등이 포함되어 있어 어떤 급경사지가 위험한지, 그리고 특성이 어떠한지를 알 수 있습니다.행정기관은 이 자료를 바탕으로 우선 관리가 필요한 위험지역을 선정하고, 예방 조치나 보강 공사를 계획할 수 있습니다.주민 및 여행객은 자신의 거주지나 자주 다니는 지역 주변 급경사지의 안전 수준을 파악할 수 있습니다.공간정보 시스템(GIS)과 연계하면 사면 붕괴 가능성이 높은 구역 지도 표시, 경사도 분석, 재해 대비 경로 안내 등에 활용할 수 있습니다.
