description_portal: '서울특별시 서대문구 관내에 위치한 민방위대피시설 현황(비상시설위치, 좌표,  사업장명 등)에 대한 데이터를 제공합니다.서대문구의 민방위사태 발생 시 즉시 대피할수 있는 공간으로 사용되는 시설정보 입니다. 서대문구내 민방위대피시설의 위치와 영업 상태 파악에 유용합니다.서대문구 민방위대피시설 현황 데이터의 주요항목은 사업장명, 주소, 영업상태, 좌표, 인허가일자 등이 포함되어있습니다.이 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.  좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보'
