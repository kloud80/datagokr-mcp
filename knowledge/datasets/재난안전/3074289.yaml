summary_user: 서울특별시 관악구의 민방위 교육 일정을 교육 건별로 담은 작은 파일(CSV 899바이트)로, 연차별 교육대상자, 본교육·보충교육 구분, 집합·사이버 교육방법, 교육시간, 시작·종료일자, 교육장소를 담는다. 관악구 민방위 대원이 "올해 내 연차 교육은 언제, 어디서, 집합인지 사이버인지"를 확인하거나, 구청 담당자가 연간 교육계획과 안내 일정을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시구군 이름이나 교육장소 이름을 맞춰 붙여야 하며, 같은 부문의 민방위 대피시설 데이터와도 이름 매핑으로만 이어진다.
limits: 대피시설 위치나 좌표가 아니라 교육 일정만 담고 있어 재난 시 어디로 대피하는지에는 쓰지 못한다. 범위는 관악구 한 시군구이며, 공간 정보가 없고 코드형 조인 키도 없어 다른 지역·데이터와 자동으로 결합되지 않는다.
