summary_user: 소방청이 다중이용업소 중 안전관리 우수업소로 지정·공표한 업소를 한 행씩 담은 전국 단위 파일로, 1,043건에 2013-10-07부터 2025-11-09까지의 공표일자가 있다. 이용객이나 지자체·분석가가 특정 지역의 업종별 우수업소가 어디인지, 지정 업소가 얼마나 되는지 확인하는 질문에 쓴다. 주소(address)를 키로 다른 소방·안전 시설 자료와 위치 기준으로 이어 붙일 수 있고, 그 외 공통 코드 키는 확인되지 않는다.
description_portal: 다중이용업소의 안전관리에 관한 특별법에 따라 안전관리업무 이행 실태가 우수한 업소를 안전관리 우수업소로 지정하고 공표 * 우수업소 지정 요건은 최근 3년 동안1. 피난방화시설 폐쇄, 훼손 등 위반행위가 없을 것, 2.소방, 건축, 전기, 가스 관련 법령 위반 사실이 없을 것, 3. 화재 발생 사실이 없을 것, 4. 종업원 소방교육 또는 소방훈련을 정기적으로 실시하고 보관하고 있을 것 안전관리 우수업소로 지정되면 2년 동안 출입구에 표지를 부착할 수 있고, 소방안전교육 및 화재안전조사도 2년 동안 면제. 표지 발급한 날부터 2년이 되는 날 이후 30일 이내에 정기심사를 실시하여 갱신 여부 결정
