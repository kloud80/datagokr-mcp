summary_user: 전국 어린이놀이시설의 안전검사 결과를 놀이시설일련번호·검사번호 단위 건별로 담으며, 검사종류, 설치·검사·판정일자, 유효기간, 합격 여부, 재검사 여부, 검사기관 구분을 시군구 행정단위로 제공한다. 학부모나 지자체 담당자가 동네 놀이터의 안전검사 유효기간이 지났는지, 불합격 후 재검사를 받았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역코드·지역명이나 놀이시설명 매핑으로만 연결하고, 같은 기관의 시설 안전 원장 데이터와 묶어 본다.
description_portal: 행정안전부_전국어린이놀이시설안전검사정보서비스는 전국 어린이놀이시설의 안전검사 현황을 제공하는 공공데이터 서비스입니다. 이 서비스는 놀이시설별로 검사종류코드, 검사종류명, 설치일자, 검사일자, 유효기간, 합부판정 등 다양한 정보를 확인할 수 있습니다. 검사 대상은 조합놀이대, 그네, 미끄럼틀, 정글짐 등 다양한 놀이기구가 포함되며, 안전검사를 통해 시설의 위험요인을 사전에 점검하고 어린이 안전을 확보하는 데 목적이 있습니다. 각 놀이시설의 검사 이력과 유효기간을 체계적으로 관리하고, 안전한 놀이환경 조성 및 정책 수립 등에 활용할 수 있습니다
