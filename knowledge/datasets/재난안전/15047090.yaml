description_portal: '○ 통계개요* 통계명 : 승강기 보유 현황(용도별)* 통계종류 : 보고통계* 작성목적 : 승강기관련 종합정보전산망을 구축하여 승강기에 대한 종합정보와 각종이력관리를 통해 승강기로 인한 안전사고를 예방하고 승강기의 안전관리에필요한 각종 정보 제공하기 위함* 조사체계 : 한국승강기안전관리원* 작성방법 : 승강기안전종합정보망 입력자료 집계* 공표주기 : 매년* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 승강기 보유현황 등○ 용어설명* 승강기 : 건출물이나 고정된 시설물에 설치되어 일정한 경로에 따라 사람이나 화물을승강장으로 옮기는 데에 사용되는 시설* 승강기보유대수 : 통계시점에 존재하는 승강기 보유대수로 사용 중이거나 잠시 운행을중단한 승강기도 포함됨(다만, 철거된 승강기는 제외)○ 기 타* 2013.2.23. 승안법 개정으로 일부 변경될 수 있음* 승강기보유대수는 익년 초 마감 작업후 공표됨* 승강기는 건축물이나 고정된 시설물에 설치되어 운행되는 수직교통수단이므로 건설경기상황에 민감하며, 고가의 설치 및 교체 비용이 발생하므로 승강기 등록대수의추이는 경기상황을 판단하는 지표가 될 수 있음○ 출 처 : 한국승강기안전관리원, 승강기통계'
