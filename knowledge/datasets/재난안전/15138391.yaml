description_portal: '본 데이터는 한국승강기안전공단의 승강기 안전인증에서 ‘기준(조항)’ 단위로 산출한 통계입니다. 인증품목조합코드와 품목명(예: C2010101·일반형), 기준번호(예: 7.9.1.2, 8.2.1.3), 적용시작·종료일을 축으로 각 조항별 적용·분류·부적합 발생 건수와 해당 기준이 적용된 모델 수(모델분류건수)를 제공합니다. 이를 통해 품목·모델이 어떤 안전기준에 의해 평가되는지, 조항별 적용 빈도와 부적합 추세가 어떠한지 한눈에 파악할 수 있습니다. 기간 필드는 기준의 유효성을 나타내며, 종료일이 2099-12-31로 표기된 항목은 현행 유지(종료 미정)를 의미합니다. 본 자료는 인증 심사 계획 수립, 조항별 리스크 식별, 개정 우선순위 설정, 업체별/품목별 적합성 모니터링, 기준 적용 범위 산정 등에 활용할 수 있습니다. 개별 시험결과나 결함 원인 등 세부 진단 정보는 포함하지 않습니다.'
