summary_user: 고용노동부 고시 기준의 화학물질·물리적 인자 노출기준을 물질 한 건당 한 행으로 담은 전국 단위 목록 파일(CSV, 약 57KB)이며, 국문·영문 명칭, 화학식, 시간가중평균(TWA)과 단시간노출(STEL) 기준을 ppm과 ㎎/㎥로 담는다. 사업장 안전보건 담당자나 작업환경측정 분석가가 '우리 공정에서 쓰는 이 물질의 8시간 노출 허용 농도는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 화학물질 데이터와는 물질 명칭이나 비고란의 CAS번호를 맞춰 이어 써야 한다.
description_portal: 한국산업안전보건공단에서 제공하는 화학물질 및 물리적 인자의 노출기준에 대한 목록으로유해물질의 이름, 화학식. 노출기준 등에 대한 컬럼을 제공합니다.*화학물질 및 물리적 인자의 노출기준 제3조(노출기준 사용상의 유의사항)① 각 유해인자의 노출기준은 해당 유해인자가 단독으로 존재하는 경우의 노출기준을 말하며, 2종 또는 그 이상의 유해인자가 혼재하는 경우에는 각 유해인자의 상가작용으로 유해성이 증가할 수 있으므로 제6조에 따라 산출하는 노출기준을 사용하여야 한다.② 노출기준은 1일 8시간 작업을 기준으로 하여 제정된 것이므로 이를 이용할 경우에는 근로시간, 작업의 강도, 온열조건, 이상기압 등이 노출기준 적용에 영향을 미칠 수 있으므로 이와 같은 제반요인을 특별히 고려하여야 한다.③ 유해인자에 대한 감수성은 개인에 따라 차이가 있고, 노출기준 이하의 작업환경에서도 직업성 질병에 이환되는 경우가 있으므로 노출기준은 직업병진단에 사용하거나 노출기준 이하의 작업환경이라는 이유만으로 직업성질병의 이환을 부정하는 근거 또는 반증자료로 사용하여서는 아니 된다.④ 노출기준은 대기오염의 평가 또는 관리상의 지표로 사용하여서는 아니 된다.
