summary_user: 경상북도가 관리하는 소화전을 한 개씩 기록한 건별 위치 원장으로, 소화전 고유코드·모델구분·상태·위치명과 위도·경도 좌표를 담는다(CSV 약 2.8MB). 소방·안전 담당자나 분석가가 '우리 동네 가까운 소화전은 어디에 있고 지금 사용 가능한 상태인가'를 확인하거나 소화전 공백 지역을 찾는 데 쓴다. 전역 조인 키는 없어서, 위도·경도 좌표를 기준으로 화재 발생 위치나 119안전센터 같은 다른 소방 데이터와 공간적으로 겹쳐 쓰거나 위치명을 주소로 맞춰 연결한다.
description_portal: 경상북도에서 관리하는 소화전의 통합관리 및 운영현황을 체계적으로 제공하는 자료입니다. 이 데이터는 소화전의 위치와 상태를 종합적으로 파악할 수 있는 정보를 포함하고 있으며, 항목으로는 일련번호, 소화전 고유코드, 모델구분, 상태, 위치명, 위도, 경도가 있습니다. 사용자는 본 데이터를 통해 소화전의 정확한 위치와 현재 상태를 쉽게 확인할 수 있으며, 이는 화재 예방 및 긴급 대응 체계의 구축에 중요한 역할을 합니다. 경상북도는 데이터의 정확성과 최신성을 보장하기 위해 정기적인 업데이트를 실시하고 있으며, 이를 통해 공공 안전 관리와 관련된 정책 수립 시 필수적인 참고 자료로 활용됩니다. 소화전 통합관리 운영현황 데이터는 지역사회 안전을 강화하기 위한 기초 자료로서, 화재 발생 시 신속한 대응을 가능하게 하여 주민들의 생명과 재산을 보호하는 데 기여합니다. 자료 관련 문의는 054-880-6224 로 하시기 바랍니다.
