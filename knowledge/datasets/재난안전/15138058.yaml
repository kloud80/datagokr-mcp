description_portal: 본 자료는 한국승강기안전공단에서 운영하는 승강기 교육센터에 등록된 교육 관련 콘텐츠의 활용 현황을 체계적으로 제공하기 위한 데이터입니다. 교육센터는 온라인과 오프라인을 연계한 학습 환경을 지원하고 있으며, 본 데이터에는 콘텐츠별 공유 건수와 평가 건수 항목이 포함되어 있습니다. 이를 통해 각 콘텐츠가 학습자와 이용자들에게 어느 정도 활용되고 있는지를 객관적으로 확인할 수 있습니다. 콘텐츠 유형은 온라인 동영상교육, 온·오프라인 수강이력, 교육신청 및 안내 서비스, 공지사항, Q&A, FAQ, 회원가입 및 로그인 기능, 개인정보 관련 메뉴 등으로 다양하게 구성되어 있습니다. 또한 방문 교육 신청, 과정안내, 컨소시엄 소개, 교육소개 등과 같은 교육 지원형 콘텐츠도 포함되어 있어 교육 운영 전반을 포괄합니다. 데이터는 콘텐츠별로 실제 공유 횟수와 학습자 평가 건수를 수치로 제시함으로써, 교육자료의 활용도와 관심도를 비교·분석할 수 있도록 구성되었습니다.
