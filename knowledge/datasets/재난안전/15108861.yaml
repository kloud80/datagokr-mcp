description_portal: 해당 자료는 생활안전융합데이터 구축을 위해 의왕시 관내 교통생활안전 예방시설물 정보를 300셀 격자 단위로 정비한 통계 데이터입니다. 도로횡단시설, 과속방지턱, 신호등, 방호울타리, 중앙분리대, 표지판 등 사고 예방을 목적으로 설치된 주요 교통시설물의 존재 여부 및 분포 특성을 각 격자 내 통계값 형태로 제공하며, 시설물 설치밀도와 생활권별 안전수준을 비교·분석할 수 있도록 구성되었습니다.  이 데이터는 생활안전 취약지역을 효과적으로 탐지하고 예방시설물 확충 우선순위를 도출하는 데 활용할 수 있는 기반 자료입니다. 2022년 기준 1회성 구축된 자료로 참고용으로 활용하는것이 적절합니다.
