summary_user: 유도선 운항 수면별로 배치된 수난구조대의 관리기관, 구조대명, 수면명, 보유 구조정·모터보트 수, 보유장비 종류·수량, 대원수, 연락처를 구조대 한 곳당 한 행으로 담은 소규모 CSV 현황 파일이다(약 1.5KB, 전국 범위). 지자체·소방 안전 담당자나 분석가가 '특정 호수·강 유도선 수면에 구조대가 있고 대원과 구조정이 몇 명·몇 척인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 관리기관명이나 수면명을 이름으로 맞춰 유도선 사업장·수난사고 자료와 이어 쓴다.
description_portal: 이 파일은 유도선 관련 119 수난구조대 현황을 정리한 CSV 자료다. 수난구조대는 해상 사고나 수난사고 발생 시 구조·구급 활동을 담당하는 소방조직으로, 이 파일에는 각 시·도별로 배치된 수난구조대의 인력 현황, 장비 보유 현황, 출동 건수 등이 기록되어 있다. 예컨대 어느 지역에 몇 개 팀이 운영 중인지, 구조대원 수가 몇 명인지, 구명보트, 잠수장비 같은 특수 장비를 얼마나 보유하고 있는지 구체적인 수치를 확인할 수 있다. 또한 지역별로 출동 건수와 구조 실적이 포함되어 있어, 유도선 안전 관리 및 해상 재난 대응 능력을 평가하거나 비교하는 데 활용될 수 있다. 특히 사고 다발 지역에서 구조대의 인력과 장비가 충분히 확보되어 있는지 분석하거나, 향후 인력·장비 확충 계획 수립의 근거자료로 적합하다. 이 파일은 유도선 산업의 안전 관리뿐 아니라 국민 생명 보호와 직결되는 중요한 데이터라고 할 수 있다.
