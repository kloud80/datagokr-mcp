description_portal: 해당 통계는 '수상에서의 수색, 구조 등에 관한 법률'을 근거하여 작성 및 관리되고 있음. 조난사고란 수상에서 사람의 생명, 신체 또는 선박 등의 안전이 위험에 처한 상태라고 정의하고 있으며, 선박의 기준은 선박법에 정의된 선박 중에서 기선, 범선, 부선으로 정하여 통계 집계함.  해상조난사고는 해상(항해, 정박)에서 발생하는 선박의 운용과 관련하여 발생한 모든 물리적 사고이며, 선박의 침수, 침몰, 좌초, 전복, 충돌, 화재 등 선박에 발생한 사고로 인하여 인명 또는 선박의 안전이 위험한 상태이며, 이렇게 발생한 사고의 월별(1월~12월) 사고 인명(사망, 실종 등) 현황을 나타냄.
