summary_user: 한국승강기안전공단이 접수·조사한 국내 승강기 사고를 사고 단위 또는 같은 사고 안의 피해자 단위 행으로 담은 전국 범위 파일(CSV 약 22KB)로, 심의·의결 구분, 피해자 나이, 사고 시점 검사 유효만료일, 사고 시점 관리주체(익명 처리)를 포함한다. 안전관리 분석가나 관리주체가 '검사 유효기간이 지난 승강기에서 사고가 얼마나 났고 심의 결과는 어땠나', '어떤 연령대 피해자가 많은가' 같은 질문에 쓴다. 실측 컬럼에 승강기 고유번호 같은 전역 조인 키가 없어 승강기 원장·검사 결과 데이터와 행 단위로 바로 잇기 어렵고, 같은 기관 데이터와 이름·코드 매핑으로만 연결한다.
description_portal: 이 자료는 한국승강기안전공단이 접수·조사한 승강기 사고의 관리 현황을 표준화해 정리한 데이터입니다. 각 행은 ‘사고 단위 기록’ 또는 동일 사고 내 ‘피해자 단위 기록’을 나타내며, 심의·의결 구분명(사고에 대한 내부 심의 단계 또는 의결 결과의 식별 값), 피해자 나이(연령대 또는 실연령), 사고 시점 유효만료일(해당 설비의 안전관리·검사 관련 유효기간), 사고 시점 관리주체(건물주·관리주체 명의의 익명 처리값)가 포함됩니다. 목적은 연도별·유형별 사고 관리의 체계적 현황 파악과 사후 심의 이력의 일관된 보존이며, 범위는 공단 사고보고 체계에 들어온 국내 승강기 사고 전반을 대상으로 합니다. 개인정보 보호를 위해 성명 등 식별 정보는 마스킹되며, 동일 사고에서 다수 피해자가 별도 행으로 존재할 수 있습니다. 위치, 사고 원인·등급, 상세 경위 등은 원본 정의에 따라 미포함일 수 있으며, 표·헤더와 값의 형식 차이가 존재할 수 있어 분석 시 데이터 사전의 항목 정의와 기간 기준을 확인해야 합니다.
