summary_user: 경기도가 운영하는 3D 스마트 화재감시시스템에 설치된 감지기의 오탐신고, 장애 발생·처리 이력, 센서 정보(종류·상태·설치일시·설치층수·지하 여부 등)를 건별로 담는다. 소방·방재 담당자나 분석가가 '어느 시설의 감지기가 장애·오탐이 잦고, 원인과 처리 기간은 어떤가'를 파악해 유지관리·예측 정비 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시설번호(faclt_no)·센서일련번호 같은 내부 번호로 데이터 안에서만 묶을 수 있고, 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
description_portal: 이 데이터는 경기도에서 운영하는 3D 스마트 화재감시시스템에 설치된 감지기들의 정보를 수록한 자료로, 감지기의 오탐신고, 장애 발생 및 처리 이력, 센서 고유 정보 등을 포함합니다. 주요 항목은 ‘오탐신고일련번호’, ‘시설번호’, ‘등록시간’, ‘요청시간’, ‘센서일련번호’, ‘장애일련번호’, ‘장애발생일시’, ‘처리완료일시’, ‘장애원인내용’, ‘센서종류’, ‘센서상태’, ‘설치일시’, ‘지하여부’, ‘설치층수’, ‘사용여부’ 등으로 구성되며, 이를 통해 화재 감시 설비의 유지관리 상태 및 장애 발생 양상을 체계적으로 모니터링할 수 있습니다. 해당 데이터는 스마트 방재 시스템의 효율성 평가, 감지기별 고장 패턴 분석, 시설별 장애 빈도 추적, 예측 정비 시스템 구축 등 다양한 방재 관련 분석 및 행정기획에 활용될 수 있습니다.
