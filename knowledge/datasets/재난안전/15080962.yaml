summary_user: 세종특별자치시에서 접수된 119 신고를 일련번호·접수일시·접수경로(일반전화·이동전화·온라인 등)·타시도 신고 여부로 담은 CSV 파일(약 32MB)이며, 포털 설명상 기간은 2012~2020년입니다. 분석가가 '세종시 인구 유입기에 119 신고가 연도·시간대별로 얼마나 늘었고, 이동전화나 온라인 접수 비중은 어떻게 바뀌었나'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 소방·인구 데이터와는 접수일시에서 뽑은 연·월·시간대나 지역명을 기준으로 맞춰 이어 쓴다.
description_portal: 해당 데이터는 2012년부터 2020년까지의 세종특별자치시에서 접수된 119 신고 내역을 유형별로 집계한 자료로, 지역 내 긴급 상황 발생 현황을 객관적으로 파악할 수 있는 데이터입니다. 세종시는 행정중심복합도시로 인구 유입과 도시 확장이 빠르게 진행되고 있어, 이 데이터는 지역 내에서 신고건수 증감율, 시간대별 접수건 수, 접수방법(일반전화, 이동전화, 온라인신고, 기타 등) 등 세종시에서 접수된 119신고건에 대해 알 수 있습니다. 또한 타시도에서 접수된 건인지도 구분할 수 있는 자료 입니다.
