summary_user: 대전광역시 유성구에서 발생한 교통사고를 사고 한 건 단위로 담은 파일로, 발생일시·사상자수·사고유형·도로형태·가해운전자와 피해자의 연령·성별, 위경도 좌표, 행정동·법정동을 포함한다. 주민이나 구청·분석가가 "유성구에서 어느 동, 어떤 도로형태에서 사고가 자주 나는가"처럼 사고다발지역과 사고 특성을 파악하는 데 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 통계·시설 데이터와 잇고, 위도·경도로 지도 위 위험지역·시설 데이터와 공간 결합한다.
description_portal: '대전광역시 유성구 교통사고 현황 상세정보에 대한 데이터를 제공합니다.해당 데이터는 번호, 사고번호, 발생일시, 사상자수, 사고유형, 도로형태, 위도, 경도, 시도이름,  시군구이름, 행정동이름, 법정동이름, 기준일자 등의 항목을 포함하여 총 9,579개의 행으로 구성되어 있습니다.해당데이터는 지역별 교통안전 수준과 사고 발생 특성을 분석하는 데 활용할 수 있습니다.또한 지역별 교통안전 정책수립, 사고다발지역 분석, 도로환경 개선 등에 활용 가능합니다.이 외에도 다양한 분야에 활용할 수 있습니다.사용좌표계: EPSG 5179'
