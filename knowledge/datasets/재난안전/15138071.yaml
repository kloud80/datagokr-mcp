description_portal: 본 데이터는 한국승강기안전공단에 접수된 ‘안전관리자 선임 및 해임 통보’ 처리 내역을 제공합니다. 각 행은 한 건의 통보를 의미하며, 필드는 접수번호, 접수일자, 통보인 성명, 통보일자, 처리일자, 통보구분(선임/해임), 안전관리자 성명, 교육이수일로 구성됩니다. 목적은 안전관리자 지정·변경 사실의 행정 처리 이력을 기록·조회하고, 시설별 안전관리 체계 유지 여부와 교육 이수 상태를 확인하는 데 있습니다. 분석 시 동일 대상에 대한 정정·중복 접수를 고려해 처리일자 기준 최신 건을 우선하는 정합성 정리가 필요합니다. 성명은 개인정보 보호를 위해 마스킹되어 제공되며, 수록 범위는 공단에 실제 접수·처리된 통보 건으로 한정됩니다. 자료는 기간별·구분별 통계 작성, 교육 이수 현황 점검, 내부 행정 근거 확보 등 기본적 업무 활용에 적합하도록 구성되었으며, 공개 시점이나 내부 지침 개정에 따라 항목 정의·갱신 주기가 조정될 수 있습니다.
