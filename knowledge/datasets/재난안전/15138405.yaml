description_portal: 본 데이터는 한국승강기안전공단 대표 홈페이지에 게시된 설문조사의 운용·응답 기록을 행 단위로 정리한 메타/로그성 자료입니다. 각 행은 설문조사명, 설문시작·종료일자, 문항별 질문 내용과 문항유형(객관식 단답, 주관식 단답/장문), 객관식 답변값을 포함하며, 응답자 순번과 응답 삭제여부로 개별 응답의 상태를 구분합니다. 동일 설문 내 여러 문항이 존재하므로 ‘설문 × 문항 × 응답자’ 조합으로 중복된 설문명·기간이 반복될 수 있습니다. 객관식 문항은 사전에 정의된 선택지 값을, 주관식 문항은 자유기술 문자열을 담습니다. 데이터 범위는 홈페이지 이벤트성 만족도 조사 등 공단이 운영한 설문에 한정되며, 채널 외 설문(오프라인·타 플랫폼)은 포함하지 않습니다. 응답자 인적정보(성함·전화번호)를 수집하는 문항이 존재하므로 원자료에는 개인정보가 포함될 수 있습니다. 컬럼은 설문 메타(조사명·기간), 문항 정보(내용·유형), 응답 내용(객관식 값/서술형 텍스트), 관리 필드(응답자 순번, 삭제여부)로 구성됩니다. 시점 기준은 설문 등록일이 아닌 설문 진행기간이며, 시간대 표기는 날짜(YYYY-MM-DD) 형식입니다.
