summary_user: 울주군 전역을 원전 중심 16방위와 행정 구역(통/반) 단위로 나눈 방사능 방재용 지리 데이터를 API로 담으며, 실측 범위는 울주군 한 시군구이고 행정단위는 읍면동 수준이다. 방재 담당자나 주민이 방사능 사고 때 '우리 동네 어느 반이 어느 방위 구역에 속해 어느 방향으로 대피해야 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대피소 등 다른 데이터와는 읍면동·반 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: "울산광역시 울주군에서 제공하는 방사능 방재정보 16방위(행정반) 조회 서비스는 방사능 비상 상황 시 주민 보호 조치와 대피 계획을 수립하기 위해, 울주군 전역을 원자력 발전소 중심의 16방위와 행정 구역(통/반) 단위로 세분화한 지리 데이터입니다.행정 구역의 최소 단위인 '반(班)' 단위를 기준으로 공간을 나누어, 사고 발생 시 어떤 동네의 어떤 반 주민이 어느 방향으로 대피해야 하는지 결정하는 기초가 됩니다.16방위 체계: 원전 중심에서 북(N), 북북동(NNE), 동(E) 등 16개 방향으로 구역을 나누어 풍향에 따른 방사능 확산 예측과 연계합니다."
