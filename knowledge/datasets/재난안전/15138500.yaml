description_portal: 본 자료는 한국승강기안전공단이 실시한 안전인증의 결과로 발행되는 안전인증서에 대해, 인증서별로 부가 기재된 특이사항을 표준 항목으로 정리한 데이터입니다. 각 레코드는 하나의 안전인증번호에 연결된 개별 특이사항을 나타내며, 필드는 안전인증번호, 특이사항순번, 특이사항구분으로 구성됩니다. 특이사항순번은 동일 인증번호에 여러 건의 특이사항이 존재할 때 항목 간 식별을 위한 일련번호입니다. 특이사항구분 값에는 ‘승강기안전인증 적용례’, ‘안전부품의 파생모델 적용례’, ‘건축주소’, ‘특이사항’ 등 인증서 본문을 보완하는 설명 유형이 포함됩니다. 이 데이터는 인증서 단위의 메타정보를 행 단위로 정리하여, 인증번호—특이사항 간의 연결 관계와 특이사항의 유형 분류를 일관된 구조로 제시합니다. 값의 예시로는 특정 인증의 적용 사례 표기, 파생모델 적용 내역 표기, 건축물 주소 표기 등이 있으며, 이러한 구분을 통해 인증서에 첨부·추가되는 설명 성격을 명확히 확인할 수 있습니다.
