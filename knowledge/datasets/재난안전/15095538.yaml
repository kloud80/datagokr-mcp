summary_user: 울산광역시 울주군에서 방사능 비상 때 쓰는 방재 거점 시설(구호소, 통제소, 물품보관소, 방사선 감시 장비 설치 지점 등)을 시설 구분과 함께 한데 모아 시설 한 곳당 한 건으로 담으며, 범위는 울주군 한 개 시군구입니다. 주민이 '원전 사고가 나면 우리 동네 구호소는 어디인가'를 확인하거나, 군·방재 담당자가 비상 시 물자 배분과 공무원 배치 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 대피·구호시설 같은 다른 재난안전 데이터와는 시설명·주소를 맞추거나 같은 기관 코드로만 연결한다.
limits: 이벤트 때 만들어진 뒤 바뀌지 않는 데이터이므로 현재 시설 운영 상태를 실시간으로 보장하지 않는다. 울주군 범위만 담고 있고, 공통 키가 없어 다른 데이터와 자동으로 결합되지 않는다. 호출에는 serviceKey가 필요하며 개발계정은 하루 1,000회로 제한된다.
