summary_user: 대구광역시 북구 관내에서 허가를 받아 영업 중인 고압가스 제조업체(특정제조·충전·냉동제조·일반제조 등)를 업소 한 곳당 한 행으로 담은 현황 파일로, 업종·업소명·전화번호·도로명주소·위도·경도·데이터기준일자를 포함한다. 주민이나 안전점검 담당자가 '우리 동네 근처에 고압가스 충전·제조 시설이 어디에 있는가'를 확인하거나, 분석가가 위험시설 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명주소·좌표나 업소명으로 맞춰 이어 쓴다.
limits: 사업자번호나 허가번호 같은 공통 식별 키가 없어 다른 기관의 가스안전·점검 데이터와 바로 결합하기 어렵다. 범위가 대구 북구 한 곳뿐이라 다른 시군구와 비교하려면 각 지자체 파일을 따로 모아야 한다.
