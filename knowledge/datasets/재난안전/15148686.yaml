description_portal: 시추조사를 통해 생산된 지반조사결과 중 표준관입시험에 대한 정보를 제공합니다. 표준관입시험정보는 흙의 N값(관입 횟수)을 측정하여 상대밀도, 연경도, 지지력 등을 파악하기 위해 수행되는 지반조사 방법입니다. 63.5kg 해머를 76cm 높이에서 낙하시켜 스플리트 스푼 샘플러를 30cm 관입시키는데 필요한 타격 횟수(N값)를 측정하고, 이때 측정된 N값을 통해 흙의 특성을 평가하고 설계에 반영합니다.
