summary_user: 시추조사로 얻은 지반조사 결과 가운데 표준관입시험 기록을 시추공·시험심도별로 담은 전국 단위 원천 파일로, 63.5kg 해머 타격으로 샘플러를 관입시키는 데 든 타격횟수(N값)와 관입깊이를 담는다(약 12MB CSV). 설계·시공 기술자나 지반 분석가가 특정 조사 프로젝트 부지에서 깊이별 N값이 어떻게 변하는지, 지지층이 어느 심도에서 나타나는지 확인하는 데 쓴다. 전역 조인 키는 없고, 프로젝트코드·시추공코드로 같은 국토교통부 지반정보 계열(시추공 위치·지층 정보 등)과만 맞춰 이어 쓴다.
