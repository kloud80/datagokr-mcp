summary_user: 대구광역시 119종합상황실에 접수된 신고 건수를 화재·구급·구조·산불·자연재해·기타출동·안내 등 재난유형별(구분)로 나눠 2017년부터 2025년까지 연도별 열로 담은 집계표이며, 파일 크기는 674바이트로 작다. 대구 시민이나 소방 정책 분석가가 '최근 몇 년 사이 대구에서 구조·화재 신고가 늘었는가'처럼 유형별 119 신고 추이를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 붙일 공통 조인 키가 없어, 유형 이름을 기준으로 다른 시도의 같은 형식 통계나 대구시 소방 관련 자료와 수작업으로 맞대어 쓴다.
description_portal: 119종합상황실은 연도별 재난유형별 119 신고접수 현황을 분석하여 화재, 구조, 구급 등 각 유형별 대응 현황을 집계합니다.일년동안의 신고접수 현황을 유형별로 안내하고 있으며 그 내용은, 화재, 구급, 구조, 산불, 자연재해, 기타출동, 안내 등으로 119로 접수되는 모든 신고건수에 대한 현황입니다.자료는 2017년 부터 2025년 까지의 자료를 제공하여 있으며 올해의 경우 총 신고접수 건수는 전년 대비 소폭 감소하였으나 출동과 관련된 화재, 구조, 구조, 산불 신고접수 건수의 경우 전년 대비 상승하였음을 알 수 있습니다. 자료를 통해 시민의 안전에 대한 긴급 상황 대응 요구가 높아지고 있음을 보여줍니다. 이 자료는 재난 대응 정책 수립과 소방 자원 배치에 중요한 기초 자료로 활용됩니다.
