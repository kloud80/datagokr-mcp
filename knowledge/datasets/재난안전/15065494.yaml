summary_user: 밀양소방서 관할 119안전센터 등 현장부서별로 도로명주소, 총 인원과 화재진압·구조·구급·일근(행정) 인원, 펌프차·구급차·물탱크차·특수차 등 차량 대수를 한 행씩 담은 집계 파일(CSV 582바이트)입니다. 밀양 지역 주민이나 분석가가 우리 동네 안전센터에 구급대원과 구급차가 몇 명·몇 대 배치돼 있는지 확인하거나, 센터 간 인력·장비 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방·대피시설 데이터와는 부서명(센터명)이나 도로명주소를 이름·주소 매칭으로 이어 써야 한다.
description_portal: <데이터 수집목적 및 과정> 밀양소방서 현장부서 119안전센터 등 현황에 관한 자료로 119안전센터 주소, 인원, 직책, 119안전센터별 차량 현황 등을 제공하여 밀양소방서 지역 내 119안전센터에 관한 전반적인 사항을 확인하기 위한 데이터입니다.<데이터 구성 및 세부항목> 데이터는 부서명(119안전센터명), 주소, 총 인원, 화재진압대원, 구조대원, 구급대원 수, 일근 수, 차량 현황, 비고를 제공하는 데이터입니다.<데이터 현행화 시기> 해당 데이터는 연간 현행화 데이터입니다. 차기 업데이트 예정일은 2026년 11월 입니다.
