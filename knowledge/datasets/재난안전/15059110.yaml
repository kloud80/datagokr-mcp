summary_user: 경기도 시군별·연도별(SUM_YY)로 위험물 제조소, 주유·판매·이송·일반취급소, 옥내·옥외·탱크 유형별 저장소 수를 집계한 자료로, 개별 시설 건별 목록이 아닌 시군 단위 집계입니다. 소방·안전 담당자나 분석가가 '우리 시군에 주유취급소와 지하탱크저장소가 몇 곳이며 다른 시군과 비교해 많은가'를 확인할 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 시군명(SIGUN_NM)이나 경기도 시군코드(SIGUN_CD)를 이름·코드 매핑해 다른 경기도 시군 단위 통계와 연결한다.
description_portal: 이 데이터는 경기도 내 시군별로 위험물을 제조·저장·취급하는 시설의 집계현황을 연도별로 정리한 자료입니다. 각 시군에 존재하는 위험물 제조소, 주유취급소, 판매취급소, 이송취급소, 일반취급소와 더불어 옥내외 및 탱크 유형별 저장소 수가 포함되어 있으며, 시설의 종류별 분포 및 지역별 차이를 파악할 수 있도록 구성되어 있습니다. 이 데이터는 지역 내 위험물 시설 분포 파악, 안전관리 계획 수립, 소방 및 환경 정책 자료, 위험물 사고 예방 및 대응체계 구축, 지자체별 산업안전 현황 분석 등에 유용하게 활용될 수 있습니다.
