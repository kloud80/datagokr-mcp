description_portal: 해당 정보는 궤도운송법 제26조(보험가입) 관련하여 궤도사업자 또는 전용궤도운영자가 궤도운송사고가 발생한 경우 피해자에게 보험금을 지급하기 위하여 가입한 보험 정보로서, 궤도운송법 시행규칙 제23조(보험의 종류)에 의거하여 보험의 종류는 궤도운송 사고배상책임보험 또는 그 보험과 같은 내용이 포함되어 가입되었고, 궤도운송사고 당 배상 한도액은 2억원 이상, 1인당 배상 한도액이 2억원 이상, 연간 배상 한도액이 4억원 이상이고 해당 보험은 궤도시설을 운행하기 이전에 가입함을 원칙으로 하고 있기에, 궤도시설 운영 담당자가 가입한 정보를 제공 받아 보유하고 있는 데이터입니다.
