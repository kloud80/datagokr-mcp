summary_user: 서울특별시경찰청 산하 31개 경찰서별 경찰관 총인원을 2011년부터 2025년까지 연도별 열로 정리한 집계표로, 경찰서 한 곳이 한 행이며 CSV 파일(약 2KB)로 활용신청 없이 받는다. 서울 경찰서 사이에 인력이 어떻게 배치되어 있는지, 특정 경찰서의 경찰관 수가 연도별로 늘었는지 줄었는지를 보려는 분석가·시민이 쓴다. 전역 조인 키가 없어서 경찰서 이름을 매핑해 경찰서별 범죄 발생·검거, 112신고 같은 통계나 경찰관서 위치 데이터와 이어 쓴다.
limits: 경찰서 코드 같은 공통 키가 없어 다른 데이터와 붙이려면 경찰서 이름을 손으로 맞춰야 한다. 경찰서별 총인원만 있어 지구대·파출소 단위 배치나 계급·부서별 인원은 알 수 없다. 메타상 범위가 '전국'으로 표시돼 있지만 실제로는 서울청 31개 경찰서만 담는다.
