summary_user: 연천군시설관리공단이 관리하는 사업장 시설별 CCTV 설치 현황을 시설 단위로 정리한 파일로, 설치목적·촬영방면·보관일수·카메라 대수와 도로명주소·위도·경도를 담는다. 군민이나 시설 이용자가 '공단이 운영하는 체육관·주차장 같은 시설에 CCTV가 몇 대, 어떤 목적으로 설치돼 있는가'를 확인하거나, 안전관리 담당자가 설치 계획과 취약시설 보완을 검토할 때 쓴다. 전역 조인 키는 없어서 시설명·주소로 맞추거나 위도·경도로 다른 방범 인프라(안전비상벨·보안등 등)나 시설 안전 자료와 위치 기반으로 겹쳐 본다.
limits: 표준 코드 같은 공통 조인 키가 없어 다른 데이터와는 시설명·주소 매핑이나 좌표 근접으로만 연결된다. 연천군시설관리공단 관리 시설만 담은 작은 파일(약 2KB)이라 지역 전체의 CCTV 현황을 대표하지 않는다.
