description_portal: 경상북도 구미시의 연도별 사회재난 및 자연재난 발생 건수를 정리한 자료로, 「재난 및 안전관리 기본법」 제3조(정의)에 근거하여 집계되었습니다. 이 자료는 2016년부터의 재난 발생 현황을 포함하고 있어 연도별 재난 발생 추세를 확인할 수 있습니다. 재난의 유형과 규모를 비교·분석함으로써 위험 요인을 사전에 파악하고, 취약 지역에 대한 예방 대책을 마련하는 데 유용합니다. 또한 재난 대응을 위한 예산 계획 수립과 복구 지원 정책을 설계할 때도 참고할 수 있습니다. 나아가 시민 안전교육 자료나 재난관리 계획 보고서의 기초 데이터로도 활용이 가능합니다.
