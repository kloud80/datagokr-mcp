summary_user: 대전광역시 유성구에 있는 민방위 대피시설을 시설 한 곳당 한 행으로 담은 파일입니다. 각 행에는 시설명, 소유자, 면적, 활용인원, 현재 활용용도, 방호등급, 주소, 행정동·법정동이 들어 있습니다. 유성구 주민이 공습이나 재난 때 우리 동네에서 가까운 대피소가 어디이고 몇 명을 수용하는지 확인하는 데 쓰고, 분석가는 동별 대피시설의 수용 여력을 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시도·시군구·행정동·법정동 이름을 매핑하거나 주소로 연결하며, 다른 지역 대피시설이나 무더위·한파쉼터 데이터와 함께 지역별 대피 인프라를 비교할 때 이 방식을 쓴다.
