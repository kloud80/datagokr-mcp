  - law: 화재예방법
    source: portal_meta:보유근거
legal_basis_portal: "1. 화재의 예방 및 안전관리에 관한 법률 (화재예방법)제22조(화재안전 중점관리대상의 지정 등): 소방본부장 또는 소방서장은 특정소방대상물 중 화재가 발생할 경우 인명 및 재산피해가 클 것으로 우려되는 대상물을 화재안전 중점관리대상으로 지정하고 관리하여야 한다.제23조(화재안전조사): 중점관리대상에 대하여 주기적인 화재안전조사를 실시하여야 한다.제37조(소방안전관리자의 소방훈련 및 교육): 중점관리대상의 소방안전관리자는 근무자 및 거주자에게 불시 소방훈련 및 교육을 실시할 수 있으며, 소방서장은 이를 평가할 수 있다.2. 화재의 예방 및 안전관리에 관한 법률 시행령제25조(화재안전 중점관리대상의 지정 대상 등): 법 제22조제1항에 따라 지정하는 중점관리대상의 범위는 다음과 같다.의료시설, 노유자시설, 숙박시설, 위락시설 등 인명피해가 우려되는 시설고층건축물, 지하가 및 대형 물류창고 등 화재진압이 어려운 시설가연성 가스를 1천 톤 이상 저장·취급하는 시설그 밖에 소방청장이 정하는 기준에 따라 화재위험성이 높다고 인정되는 시설3. 화재예방 행정업무 처리 규정 (소방청 훈령)제18조(중점관리대상의 선정 등): 소방서장은 매년 11월 30일까지 다음 연도 화재안전 중점관리대상 선정을 위한 계획을 수립하여야 한다.제19조(중점관리대상 선정 심의위원회): 중점관리대상의 지정 및 해제를 심의하기 위해 소방서별로 '중점관리대상 선정 심의위원회'를 구성·운영하여야 한다.제21조(화재안전 등급부여 및 관리): 선정된 대상에 대하여 위험도 및 안전관리 수준에 따라 등급을 부여하고 차등 관리한다."
