summary_user: 광주 광산소방서가 화재 시 대형 인명·재산피해가 우려된다고 보아 지정한 중점관리대상(대형화재취약대상)을 대상물 한 곳당 한 행으로 담은 파일로, 특수장소 구분·대상명·도로명주소·연면적을 담는다. 관할 주민이나 사업자, 소방안전 분석가가 '광산구에서 숙박시설·병원·판매시설·공장 중 집중 관리되는 대형 건물은 어디이고 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 도로명주소나 대상명을 문자열로 맞춰 건축물·특정소방대상물 원장, 화재 발생 건별 자료와 연결해야 한다.
description_portal: 광주광역시 광산소방서에서 화재발생 시 대형 인명 및 재산피해를 사전에 예방하기 위하여 선정한 대형화재취약대상 현황입니다. 특수장소(구분), 대상명, 소재지도로명주소, 연먼적 등의 항목을 제공합니다.대형화재취약대상은 화재 발생 시 다수의 인명·재산 피해가 우려되는 대규모의 소방대상물을 의미하며, 숙박시설, 병원, 대형 판매시설, 공장 등이 해당될 수 있습니다. 이러한 대상들은 가연성 물질을 대량으로 취급하거나 많은 사람이 출입하는 특성 때문에 선정되며, 소방안전관리를 집중적으로 실시하여 화재 예방에 힘쓰는 곳입니다.중점관리대상이란 특정소방대상물 중에서 화재가 발생할 경우 인명이나 재산 피해가 클 것으로 우려되는 곳을 의미합니다. 소방본부장이나 소방서장이 지정하며, 일반적인 대상물보다 더 엄격한 소방시설 유지관리와 주기적인 소방점검, 그리고 소방훈련이 실시되는 곳입니다.
applicable_legislation:
