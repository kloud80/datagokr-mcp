summary_user: 재해구호기금의 지역(지역코드)·연도별 기금 총액, 실적립액, 법정적립액, 이월액, 이자·기타 수입, 목표액을 담은 전국 단위 집계 자료다. 지자체 재정 분석가나 연구자가 "우리 시도는 법정 적립 기준만큼 재해구호기금을 실제로 쌓아 두었나"를 연도별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 지역코드(RGN_CD)를 행정구역 이름·코드표에 매핑해 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 재해구호기금 정보로, 지역코드, 연도, 기금총금액, 실적립금액, 법정적립금액, 이월금액, 이자수입금액 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
