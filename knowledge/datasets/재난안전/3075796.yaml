description_portal: 민간 다중 이용건축물의 각종 위기 상황 발생 시 인명, 재산 피해를 최소화하기 위해 위기상황 매뉴얼 작성, 관리 및 훈련 실태를 점검하여 재난 대응 역량을 강화하고자관내 민간 다중 이용 건축물을 지정하여 점검하고 있습니다.다중이용시설에 대한 위기상황 매뉴얼 작성방법 및 훈련 여부등을 확인, 위기상황 대비 평상시 예방, 대비 활동 여부를 확인합니다.(층별 피난계획도의 작성 및 재해 약자 파악 여부, 재집결지 선정 여부, 개인별 임무카드 작성 숙지 여부 등 체크리스트 활용하여 작성 제출합니다 (상/하반기 2번)민간 다중이용건축물의 소유자, 관리자 또는 점유자는 위기상황에 대비한 매뉴얼을 작성하고, 훈련을 매년1회 이상 실시하여, 실제 위기상황에서 매뉴얼이 원활하게 현장에 적용될 수 있도록 지속적으로 보완, 발전시켜야한다해운대구 다중 이용시설업 현황에 대한 자료입니다.해운대구에는문화 및 집회시설, 종교시설, 판매시설, 종합병원, 숙박시설 등이 등록되어 있습니다.상호는 각 다중이용시설업의 공식 명칭을 나타내며, 이는 정확한 식별 및 검색을 위한 기준이 됩니다.전화번호는 각  이용시설업의 대표 연락처로, 운영 여부 등을 사전에 확인할 때 유용합니다.소재지는 각 이용시설업이 실제 어디에 있는지를 알려주는 정보로, 도로명 주소를 기본으로 제공합니다.등록일자, 변경일자, 업종, 상호, 소재지(지번, 도로명), 영업상태에 대한 정보를 확인하실 수 있습니다.
