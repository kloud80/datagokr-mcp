description_portal: 이 공공데이터는 2016년부터 2020년까지 강원도 내에서 발생한 여성 및 아동 대상 폭력 범죄에 대한 연도별 현황을 정리한 자료입니다. 제공 항목은 성폭력, 가정폭력, 성매매, 기타 범죄로 구성되어 있으며, 아동과 여성을 대상으로 한 피해 건수를 각각 구분하여 제공합니다. 해당 데이터는 사회적 약자인 여성과 아동을 대상으로 한 범죄의 발생 양상과 변화 추이를 분석하는 데 유용하며, 폭력 예방 정책 수립, 보호시설 운영 계획, 맞춤형 상담 및 법률 지원 체계 구축 등 공공안전 및 복지 정책의 근거자료로 활용될 수 있습니다. 여성가족부, 경찰청, 지자체, 복지기관, 시민단체, 연구기관 등에서 효과적인 피해자 보호 및 예방 대책 마련을 위해 널리 활용 가능합니다.
