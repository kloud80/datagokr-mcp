description_portal: 한국승강기안전공단이 수행하는 승강기 안전검사 업무 중 외부 검사보조자 계약내역을 정리한 데이터입니다. 각 행은 검사자 코드, 계약 시작·종료일, 계약 대수(위탁 처리 한도 등 업무계약상 수량 의미), 등록일자 등 기본 정보를 포함하며, 기간별 위탁 인력 운용 현황과 계약 변동 이력을 체계적으로 확인할 수 있도록 표준화되어 있습니다. 본 자료의 목적은 외부 보조 인력에 대한 계약 근거를 명확히 하여 검사 수요 대응, 인력·물량 배분, 예산·성과 관리, 감사 및 추적 가능성 확보에 기여하는 것입니다. 제공 범위는 공단 전산에 등록된 계약 건 중 공개가 가능한 항목에 한하며, 개인식별정보·보수 조건 등 민감 정보는 포함하지 않습니다. 동일 인력의 갱신·기간 조정·중도 종료에 따른 다중 행 존재, 정정 등록으로 인한 중복에 유의하시기 바랍니다.
