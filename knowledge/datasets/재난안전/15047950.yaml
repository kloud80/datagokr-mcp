description_portal: 경찰청에서 제공하는 차종별 졸음운전 교통사고 현황 통계는 2018년부터 2020년까지 승용차, 승합차, 화물차, 특수차, 이륜차를 대상으로 졸음운전으로 인해 발생한 교통사고 건수, 사망자 수, 부상자 수를 나타냅니다. 이륜차는 50cc 미만 원동기장치자전거를 포함합니다.통계에 따르면 승용차의 졸음운전 사고 건수, 사망자 수, 부상자 수가 다른 차종에 비해 가장 높은 비율을 차지하는 것을 확인할 수 있습니다. 전반적으로 졸음운전으로 인한 교통사고는 매년 발생하고 있으며, 이로 인한 인명 피해 또한 적지 않습니다. 이 자료는 졸음운전 예방을 위한 정책 수립 및 홍보 활동의 근거 자료로 활용될 수 있으며, 특정 차종 운전자의 졸음운전 위험성을 강조하는 데 기여할 수 있습니다.
