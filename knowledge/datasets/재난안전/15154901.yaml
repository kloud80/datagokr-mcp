description_portal: 이 데이터는 한국승강기안전공단이 관리하는 승강기 안전인증 관련 ‘현장 정보’를 담고 있으며, 승강기가 설치되거나 인증 심사가 이루어지는 실제 현장에 대한 정보를 포함합니다. 각 행은 하나의 현장에 대한 기록으로 구성되며, 주요 항목으로는 ‘현장순번’, ‘현장명’, ‘주소’, ‘상세주소’, ‘사용여부’, ‘등록 일시’ 등이 있습니다. ‘현장순번’은 각 현장을 식별하는 고유 번호이며, ‘현장명’은 해당 현장의 명칭으로 아파트, 기업 또는 시험기관 등을 포함합니다. ‘주소’ 및 ‘상세주소’는 현장의 위치를 구체적으로 나타내며, 정확한 위치 확인과 현장 심사에 활용됩니다. ‘사용여부’는 해당 현장이 현재 인증 절차나 심사에 사용 중인지 여부를 나타내며, ‘사용’ 또는 ‘사용안함’으로 구분됩니다. 마지막으로 ‘등록 일시’는 해당 현장 정보가 시스템에 등록된 날짜를 나타냅니다. 이 데이터는 승강기 설치 및 심사 현장의 이력 관리, 지역별 인증 활동 분포 분석 등에 활용할 수 있습니다.
