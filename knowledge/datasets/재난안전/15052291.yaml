summary_user: 건설사업정보시스템에 18개 지방국토관리사무소가 등록한 일반국도 시설물(주로 교량·터널)을 시설물 한 건씩 담은 전국 단위 관리현황 원장 파일로, 지방국토관리청·관리주체·노선번호·종류·종별·시설물명·준공일을 담는다. 도로 안전 분석가나 지역 주민이 '특정 국도 노선에 있는 교량·터널 중 준공된 지 오래된 시설은 어디이고 누가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시설물 안전등급·점검 데이터와는 시설물명·노선번호 같은 이름 매핑이나 관리기관 기준으로만 이어 붙인다.
