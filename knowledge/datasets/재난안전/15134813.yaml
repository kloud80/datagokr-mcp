description_portal: 광주광역시 서구 대표 홈페이지에서 제공하는 「발화요인별 화재 발생현황」 데이터는 서구 지역 내에서 발생한 화재 사고를 발화 원인에 따라 구분한 통계자료입니다. 본 데이터는 연도별로 전기적 요인, 기계적 요인, 화학적 요인, 인위적 요인(부주의, 방화, 방화의심 등), 자연적 요인 등 다양한 발화 원인에 따른 화재 발생 건수를 수록하고 있으며, 화재 예방 정책 수립 및 재난 대응 체계 개선을 위한 기초자료로 활용될 수 있습니다. 또한, 화재 예방 교육이나 안전 점검 시 주요 발화요인을 분석하여 위험요소를 사전에 차단하는 데에 기여할 수 있는 실질적인 참고자료입니다. 특히 발화요인 미상에 대한 수치도 포함되어 있어 통계적 사각지대를 파악하고 추가 조사의 필요성을 제시할 수 있습니다.
