summary_user: 서울특별시 중랑구에서 민방위사태로 급수가 끊겼을 때 쓰는 비상급수시설을 시설 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·시설 구분·중부원점TM 좌표가 들어 있다. 중랑구 주민이나 재난 대응 담당자가 '단수 시 우리 동네 가까운 비상급수시설이 어디이고 지금 운영 중인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하고, 좌표(XCRD·YCRD)를 변환하면 지도 위에서 다른 대피시설과 겹쳐 볼 수 있다.
description_portal: '서울특별시 중랑구의 민방위사태 발생 시 급수가 불가능 한 경우 비상급수에 사용되는 시설정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
