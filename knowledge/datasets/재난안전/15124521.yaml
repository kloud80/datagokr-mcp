summary_user: 전국 어린이놀이시설에 설치된 놀이기구를 기구 한 대 단위로 담은 원천 목록으로, 놀이시설명·기구명·관리번호·설치위치·설치일자·설치업체, 폐기일자와 폐기사유, 제조업체·생산국·인증번호, 놀이기구 유형을 함께 제공한다. 지자체 담당자나 분석가가 "우리 지역 놀이터에 설치된 지 오래된 기구나 이미 폐기된 기구는 무엇인가"를 확인하는 데 쓴다. 놀이시설일련번호(pfctSn)로 같은 기관의 놀이시설 정보와 잇고 지역분류코드로 지역별로 묶지만, 실측에서 전역 조인 키는 확인되지 않아 다른 기관 데이터와는 시설명·지역명 같은 이름 매핑으로만 연결한다.
description_portal: 행정안전부_전국어린이놀이시설기구정보서비스는 전국 어린이놀이시설에 설치된 놀이기구의 세부 정보를 제공하는 공공데이터 서비스입니다. 이 서비스는 놀이시설명, 기구명, 관리번호, 설치장소, 설치일자, 설치업체, 설치자 등 다양한 정보를 체계적으로 확인할 수 있도록 지원하고 있습니다. 이를 통해 각 놀이시설에 설치된 놀이기구의 현황과 이력을 효율적으로 관리할 수 있으며, 놀이시설 개선 등 어린이 놀이시설의 안전한 놀이환경 조성을 위한 다양한 업무에 적극적으로 활용하실 수 있습니다.
