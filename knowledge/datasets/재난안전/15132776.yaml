summary_user: 서울 종로구 안에 지정된 지진 대피소를 한 곳당 한 행으로 담은 원천 목록으로, 장소명·구분·관리번호·행정동·법정동·도로명주소·지번·면적(제곱미터)·데이터 기준 일자를 담는다(CSV 약 3.8KB). 종로구 주민이나 재난 담당자가 '우리 동네에서 지진이 나면 가까운 대피소는 어디이고 면적은 얼마인가'를 확인하거나 동별 대피 공간을 점검하는 데 쓴다. 전역 조인 키는 없어서 다른 대피·구호시설 데이터나 행정구역 자료와는 행정동·법정동 이름이나 도로명주소·지번을 맞춰 연결한다.
limits: 실측 컬럼에 좌표나 표준 코드 같은 전역 키가 없어 지도 표시나 타 데이터 결합에는 주소 지오코딩이나 이름 매칭이 따로 필요하다. 범위는 종로구 한 곳이라 서울 전체나 다른 시군구 대피소는 담지 않는다.
