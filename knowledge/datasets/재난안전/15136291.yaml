description_portal: 이 자료는 대구시 구조구급시스템에서 수집된 ‘구급관제의 출동대 정보’로, 실제 응급상황 발생 시 어떤 출동대가 어떠한 경로로 움직였고, 어떤 환자를 이송하였는지를 상세하게 기록한 데이터입니다. 포함된 항목은 출동 시각, 출동대 식별번호, 배치된 차량 종류, 인력 구성, 현장 도착 시간, 응급처치 수행 여부, 병원 이송 여부 등이 있습니다. 이 정보는 구급대의 동선 최적화, 관제센터의 지령 정확도 분석, 병원 연계 대응 체계 평가 등에 활용됩니다. 예를 들어 유사한 사고에서 출동대의 구성이나 이송 병원이 반복될 경우, 지역 편중이나 의료자원 분산 여부를 검토하는 데도 도움을 줍니다. 또한 응급처치 수행 여부에 따라 구급대원의 처치 역량과 현장 대응의 품질을 가늠할 수 있는 기준이 됩니다.* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
