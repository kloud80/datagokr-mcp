summary_user: 대전광역시 중구에 있는 무더위·한파쉼터를 쉼터 한 곳당 한 행으로 담은 목록 파일로, 쉼터명칭·운영여부·도로명/지번주소·시설유형·면적·이용가능인원과 평일·토요일·일요일·공휴일별 개방여부와 개방시간을 담는다. 주민이 '이번 주말 폭염 때 우리 동네에서 문 여는 쉼터가 어디고 몇 시까지 여는가'를 확인하거나, 분석가가 중구 내 쉼터 수용인원 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어 다른 데이터와는 주소(도로명·지번)를 지오코딩하거나 이름으로 맞춰 이어 써야 하며, 다른 시군구 쉼터 목록과는 같은 항목 구성을 기준으로 합쳐 쓴다.
description_portal: '무더위 한파쉼터 목록은 대전광역시 중구에 위치한 무더위 및 한파쉼터의 정보를 포함하고 있습니다.쉼터명칭, 운영여부, 주소, 운영시간 등 데이터를 포함하고 있습니다.평일, 토요일, 일요일, 공휴일 간 개방시간이 상이할 수 있으니 해당하는 요일 시간을 확인하시기 바랍니다.경로당 8개소 - 폭염특보시 연장운영 / 운영기간: "25.7.14.~8.31. / 연장운영시간: 18:00~21:00업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.해당 데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락하여 주시기 바랍니다.'
