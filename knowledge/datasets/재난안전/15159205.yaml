description_portal: 「자연재해대책법」 제33조의4(한파피해 예방 및 경감 조치) 및 「무더위·한파 쉼터 운영·관리 지침」 관련됩니다.겨울철 자연재난에 따른 시민의 생명과 재산을 보호하기위한 사항으로극한 한파(극저온)에 따른 노숙인 및 취약계층 등의 한랭질환 발생을 최소화 하기 위해 창원시에서 지정·운영 중인 한파쉼터 지정 현황 입니다.운영기간은 겨울철 자연재난 대책기간인 11월15일 부터 3월15일까지 이며, 네이버지도, 다음지도 등 포털사이트에서 한파쉼터로 검색 가능합니다.한파로 인한 체온 저하 등 한랭질환 발생 우려 시 시설을 이용하여 주시기 바랍니다.
