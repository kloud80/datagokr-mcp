summary_user: 은평구 안의 민방위 비상급수시설을 시설 한 곳씩 담은 인허가 원장으로, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소, 중부원점TM 좌표(XCRD·YCRD), 시설 구분과 위치를 담는다. 주민이 단수·재난 때 우리 동네에서 가장 가까운 비상급수시설이 어디인지 찾거나, 구가 급수시설이 부족한 동네를 가려낼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 주소·시설명 매칭이나 좌표 기반 공간 결합으로 잇는다.
description_portal: '은평구의 민방위사태 발생 시 급수가 불가능 한 경우 비상급수에 사용되는 시설정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 재난 대응 기관이 비상급수 계획 수립 시 활용하거나, 지역 주민들이 응급상황 발생 시 가까운 급수시설을 파악하는 데 유용합니다. 또한 지자체는 급수시설의 지역별 분포를 분석해 취약지역 파악 및 추가 시설 설치 계획을 세우는 정책 기초자료로 활용할 수 있으며, 연구자들은 재해 대비 인프라의 공간적 접근성을 평가하는 연구에 사용할 수 있습니다.'
