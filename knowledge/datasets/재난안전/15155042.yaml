summary_user: 전국 자치단체가 관리하는 실외 공공목적 CCTV를 설치 지점 한 건씩 담은 원천 데이터로, 설치목적·지번/도로명 주소·WGS84 위경도·카메라 대수·화소수·촬영방면·보관일수·설치연월·관리기관 연락처를 포함하며 API 전체 381,158건이다. 주민이나 분석가가 '우리 동네 골목에 방범용 CCTV가 몇 대, 어디를 향해 설치돼 있는가'나 지역별 CCTV 공백 구역을 확인하는 데 쓴다. 소재지 주소(address)와 위경도(coord)로 안전비상벨·보안등·범죄 통계 등 위치 기반 데이터와 붙이고, 개방자치단체코드(OPN_ATMY_GRP_CD, 행정표준 기관코드)로 지자체 단위 자료와 연결한다.
description_portal: 'CCTV정보 데이터는 교통정보, 범죄예방 등의 공공목적용으로 실외에 설치된 CCTV 데이터로 관리기관명, 설치위치, 설치목적, 카메라대수 등의 데이터로 설치목적 구분, 소재지 주소 및 위·경도 기반 위치 정보와 함께 카메라 대수, 화소수, 촬영방면 등 장비 특성 정보와 설치연월, 관리기관명·연락처 등 관리 정보를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 CCTV 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 CCTV정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 개인정보보호위원회 신기술개인정보과 / 02-2100-3064 * 좌표계 : WGS(World Geodetic System)84 위경도좌표계 사용'
team:
  dept: 지역디지털협력과
services:
  - op: /info
    name: CCTV정보 데이터 조회
    endpoint: https://apis.data.go.kr/1741000/cctv_info/info
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[LCTN_ROAD_NM_ADDR::LIKE]
        required: false
        desc: 소재지도로명주소 을(를) 포함하는 값
      - name: cond[INSTL_YM::GTE]
        required: false
        desc: 설치연월 이상의 값
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
      - name: cond[DAT_CRTR_YMD::GTE]
        required: false
        desc: 데이터기준일자 이상의 값(YYYYMMDD)
      - name: cond[DAT_CRTR_YMD::LT]
        required: false
        desc: 데이터기준일자 미만의 값(YYYYMMDD)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /history
    name: CCTV정보 데이터 이력조회
    endpoint: https://apis.data.go.kr/1741000/cctv_info/history
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[BASE_DATE::EQ]
        required: true
        desc: 데이터기준일자(YYYYMMDD) 미만의 값(해당 일자기준의 상태값을 확인할 수 있습니다.)
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: true
        desc: 개방자치단체코드
      - name: cond[DAT_CRTR_YMD::GTE]
        required: false
        desc: 데이터작성기준일자 이상의 값(YYYYMMDD)
      - name: cond[DAT_CRTR_YMD::LT]
        required: false
        desc: 데이터작성기준일자 미만의 값(YYYYMMDD)
      - name: cond[LAST_MDFCN_PNT::GTE]
        required: false
        desc: 최종수정시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[LAST_MDFCN_PNT::LT]
        required: false
        desc: 최종수정시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[LCTN_ROAD_NM_ADDR::LIKE]
        required: false
        desc: 소재지도로명주소 을(를) 포함하는 값
      - name: cond[INSTL_YM::GTE]
        required: false
        desc: 설치연월 이상의 값
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: false
