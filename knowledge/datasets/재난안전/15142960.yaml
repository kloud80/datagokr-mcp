description_portal: '제주특별자치도에서 발송한 재난문자 현황입니다.재난문자 발송 날짜, 시간, 구분, 문자전송내용으로 구성되어 있습니다.*구분: 기상특보, 지진, 교통, 사회재난, 산불, 화재발생*재난문자방송"이란 재난 발생으로 인한 인명 및 재산피해가 예상되는 때 그 피해를 예방하기 위하여 운용되는 문자방송을 말한다. "재난정보"란 재난상황 및 이에 따른 행동요령 등에 관한 것으로서 재난문자방송을 통해 기간통신사업자 및 방송사업자에게 송출을 요청하는 정보를 말한다. *. "CBS(Cell Broadcasting Service)"란 휴대폰에 특정 수신ID(채널)를 입력시켜 기지국으로부터 전송되는 데이터 정보(문자)를 수신할 수 있도록 만든 이동통신시스템을 응용한 서비스를 말한다.'
