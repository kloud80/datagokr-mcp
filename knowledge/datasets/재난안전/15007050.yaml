description_portal: 울산광역시 지역 내 자주 발생하는 교통 법규 위반 내용 중 음주, 무면허, 통고처분, 무인단속, 범법, 보행자 관련 단속 현황을 데이터화하여 공개합니다. 2014년이후 데이터를 항목별로 수치로 제공하며합니다. 음주, 무면허, 통고처분, 무인단속, 범법은 운전자(소계)에 포함이 되는 내용이며, 보행자는 운전과 상관없는 무단횡단 같은 보행자 위반 수치입니다.  울산광역시 지역에서 발생하는 교통법규위반 내용을 공개함으로써 국민의 교통안전과 알 권리를 위하고자 합니다. 업데이트 주기는 1년입니다.
