summary_user: 전국 추락·낙상사고를 신고 건별로 담은 데이터로, 신고 일시(DCLR_DT)·신고 위치·사고 신고 연월, 출동 자원 유형·위치, 진행 상황, 시도·시군구·읍면동 코드와 좌표 필드가 있습니다. 지자체 안전담당자나 분석가가 "우리 지역에서 추락·낙상사고 신고가 어느 동네, 어느 달에 몰리는가"를 확인하는 데 씁니다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시도·시군구·읍면동 코드나 지역명을 매핑해 다른 재난안전 데이터(대피·구호시설, 소방 등)와 지역 단위로 이어 씁니다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지역별 출가, 낙상사고 발생위치 정보입니다."
