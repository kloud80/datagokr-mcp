description_portal: '○ 통계개요* 통계명 : 소방서당 담당인구* 통계종류 : 소방서ㆍ소방공무원 대비 담당인구 수 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 현재 관할 지역의 소방서와 인구 수를 비교하고, 소방공무원 1인당 담당인구수 현황을 파악하여 효율적인 소방행정과 사고방지 및 대응 등의관리를 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 소방서 → 서울소방재난본부 소방행정과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 소방서내용 - 소방서당 인구 및 소방공무원 1인당 담당인구 수 현황○ 용어설명○ 기타* 인구는 주민등록상 인구로 외국인은 제외* 소방공무원에 본부, 종합방재센터, 소방학교, 청와대소방대, 항공대소속 소방직은 제외○ 출 처 : 서울특별시 소방재난본부'
