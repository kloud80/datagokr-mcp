description_portal: 한국승강기안전공단이 수행하는 승강기 안전검사와 관련하여 수납 미완료 금액의 관리 현황을 정형화한 데이터입니다. 각 행은 고객안내번호와 건물관리번호(1·2)로 대상 건을 식별하고, 청구금액과 해당 시점 기준의 미수잔액을 함께 제공합니다. 본 자료의 목적은 검사 수수료의 청구·수납 진행상황을 투명하게 기록하여 채권 관리, 회계 결산, 내부 통제 및 사후 점검의 근거로 활용할 수 있도록 하는 데 있습니다. 제공 범위는 공단 전산에 등록된 미수 관련 항목 중 공개 가능한 최소 식별정보와 금액 정보에 한하며, 납부자 성명·연락처, 계좌정보 등 민감·개인정보는 포함하지 않습니다. 금액은 입력(또는 마감) 시점의 스냅숏으로, 이후의 납부·환불·정정에 따라 변동될 수 있습니다. 정정·재발행 등 처리 사유로 동일 식별자의 다중 행이 존재할 수 있으며, 최종 확정 수납 여부 및 세부 사유는 원장 시스템의 결재·전표 기록 등 부가 메타데이터에서 관리됩니다.
