description_portal: 본 데이터는 경찰청이 집계한 2021~2025년 실종아동 등 및 가출인 발생 현황으로, 대상자를 18세 미만 아동, 지적·자폐성·정신장애인, 치매환자, 가출인(실종성인)으로 구분하여 연도별 접수·해제·미해제 건수를 제공합니다. 가출인 접수 건수가 매년 가장 많으며, 18세 미만 아동과 치매환자 접수는 전반적으로 증가하는 추세입니다. 특히 2025년에는 18세 미만 아동과 가출인의 미해제 건수가 크게 늘어 장기·미해제 사례에 대한 분석 필요성이 나타납니다. 대상별 발생 규모, 해제 추이, 미해제 비중 및 연도별 증감률 분석을 통해 실종 예방, 신속 발견, 취약계층 보호 정책 수립의 기초자료로 활용할 수 있습니다. 단, 접수·해제 건수에는 이전 연도 이월 사건이 포함될 수 있어 단순 차감값과 미해제 건수가 일치하지 않을 수 있습니다.
