summary_user: 대전광역시 서구에 있는 이재민 임시 수용시설을 시설 한 곳당 한 행으로 담은 목록 파일(약 3.6KB CSV)로, 구분·시설명·위치·면적(제곱미터)·수용 인원과 데이터 기준일자가 들어 있다. 서구 주민이나 재난 담당자가 "집을 잃었을 때 우리 동네에서 몇 명까지 머물 수 있는 시설이 어디 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 대피·구호시설 데이터나 같은 서구 자료와는 시설명·주소 문자열을 맞춰 이어 쓴다.
description_portal: '대전광역시 서구의 이재민수용시설은 재난 등으로 인해 주거를 잃은 시민들이 임시로 머물 수 있도록 마련된 공공시설입니다. 이 시설은 긴급 상황 발생 시 이재민에게 임시 거처를 제공하여 안전과 기본 생활을 지원하는 역할을 합니다.이재민수용시설의 주요 기능으로는임시 거처 제공: 자연재해, 화재 등 긴급 상황 시 이재민이 임시로 머물 수 있는 공간을 제공합니다.또한기본 생활 지원: 식수, 전기, 위생 등 최소한의 생활 편의를 지원합니다.아울러재난 대응 및 복구 연계: 재난 발생 시 신속한 대피와 초기 복구, 심리 상담 등 다양한 지원이 이루어집니다.공공데이터로서의 활용으로는정책 및 행정 지원: 지자체와 공공기관은 이재민수용시설 현황을 공공데이터로 관리하여, 재난 대응 정책 수립과 현장 지원에 활용합니다.시민 안내 및 정보 제공: 시민들은 온라인 지도, 공공데이터 포털 등에서 시설 위치 등을 확인할 수 있습니다.이재민수용시설은 대전 서구를 포함한 각 지자체에서 재난 대비와 시민 안전을 위해 필수적으로 운영되는 공공 인프라입니다'
