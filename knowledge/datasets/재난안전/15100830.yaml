summary_user: 경상남도 소방용수시설(소화전 등)을 시설 한 곳당 한 행으로 담은 위치 원장으로, 도로명·지번 주소와 위도·경도, 관할 소방서·안전센터, 수리형식, 설치연도, 배관깊이·지름, 출수압력, 사용가능 여부, 보호틀·표지 설치 여부를 포함한다. 소방·재난 담당자나 분석가가 "우리 동네 반경 안에 쓸 수 있는 소화전이 몇 개이고 오래된 시설은 어디인가"처럼 소방용수 공백 지역과 노후 시설을 찾는 데 쓴다. 전역 조인 키는 없어 좌표·주소로 다른 위치 데이터(화재 발생 건, 특정소방대상물 등)와 공간 결합하거나, 시군구명·시군코드·관할소방서명 같은 이름·코드 매핑으로 소방서별·시군별 통계와 잇는다.
