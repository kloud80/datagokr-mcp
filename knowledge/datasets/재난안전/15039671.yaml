description_portal: 제주도는 관광지, 도시, 농·어촌이 혼재된 지역으로 차량 운행량이 많고, 관광객 운전자도 많은 특성상 교통법규 위반에 대한 지속적인 단속과 관리가 필요합니다. 본 데이터는 2015년부터 음주운전, 무면허, 신호위반, 과속, 안전띠 미착용, 중앙선 침범 등 주요 교통법규 위반 항목에 대한 단속 건수를 월별로 제공하고 있습니다. 이를 통해 계절별 위반 유형의 변화를 파악하거나 특정 위반행위에 대한 집중단속 필요성을 분석할 수 있으며, 교통안전 정책 수립과 홍보 전략 설계에 활용 가능합니다. 개인정보는 포함되지 않으며, 해당 자료는 매년 1회(9월) 업데이트 합니다.
