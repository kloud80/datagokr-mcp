summary_user: 전남광주통합특별시 동부소방서 관내 생활안전출동(벌집 제거, 승강기 갇힘, 동물 포획, 가스 누출 등)을 항목(구분)별로 묶어 2024년과 2025년 각 1~10월 건수와 증감율을 담은 소규모 집계 파일(CSV 459바이트)이다. 지역 주민이나 소방·안전 분석가가 '올해 벌집 제거나 승강기 갇힘 출동이 작년 같은 기간보다 얼마나 늘었나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 소방서의 같은 형식 자료나 승강기 등 시설 안전 원장과는 항목 이름 대조나 기관 단위로만 이어 쓴다.
description_portal: '동부소방서 관내 생활안전 활동현황에 대한 데이터로 2024년과 2025년 동안의 항목별 증감율을 설명하는 자료입니다.소방서는 단순히 화재 진압만 하는 곳이 아닙니다. 일상 속에서 발생하는 다양한 위험 상황 벌집 제거, 가스누출, 승강기 갇힘, 동물 포획, 실종자 수색 등에도 출동합니다.이를 통틀어 생활안전출동이라고 부르며, 동부소방서 역시 매년 수천 건의 생활안전출동을 수행하고 있습니다.생활안전출동 현황은 다음과 같습니다.벌집 제거: 여름철·가을철에 특히 많으며, 매년 전체 출동의 상당 부분을 차지합니다. 벌쏘임 사고 예방을 위해 반드시 소방대원이 안전장비를 갖추고 제거합니다.승강기 갇힘: 아파트와 상가 밀집 지역 특성상 엘리베이터 사고 출동이 빈번합니다. 빠른 구조로 시민 불안을 최소화하고 있습니다.동물 포획 및 구조: 길고양이나 유기동물, 뱀 등으로 인한 신고가 이어지며, 동부소방서는 안전하게 포획해 시민 피해를 막습니다.가스 및 위험물 누출: 주택, 음식점 등에서 가스냄새가 난다는 신고가 들어오면 즉시 확인해 폭발 위험을 예방합니다.기타 구조 활동: 낙상, 문 개방(집 안에서 움직이지 않는 가족 확인 등), 각종 생활 불편 해소를 위한 지원도 포함됩니다.'
