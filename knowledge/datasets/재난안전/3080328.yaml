summary_user: 서울 강북구가 지정한 이재민 대피시설(재난으로 집을 잃거나 머물 수 없는 주민이 임시로 지내는 곳)을 시설 한 곳당 한 행으로 담은 파일로, 위치·시설명·수용인원·전화번호·데이터기준일자를 담는다(csv 약 2.6KB). 강북구 주민이 우리 동네에서 가까운 임시 거주 대피시설과 그 수용 가능 인원을 확인하거나, 분석가가 구 단위 이재민 수용 능력을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어, 다른 대피·구호시설 데이터와는 시설명·주소 문자열을 맞추거나 같은 기관 기준으로만 이어 쓴다.
limits: 범위가 강북구 한 곳뿐이라 서울 전체나 다른 구와 비교하려면 별도 데이터를 모아야 한다. 좌표·코드 같은 공통 키가 없어 지도 표시나 다른 데이터와의 결합에는 주소 지오코딩·이름 매칭이 필요하다.
