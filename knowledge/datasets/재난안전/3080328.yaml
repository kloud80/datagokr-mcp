description_portal: 서울특별시 강북구 이재민 대피시설은 각종 재난으로 인해 주거시설을 상실하거나 사실상 주거가 불가능한 경우 이재민 및 일시대피자의 임시 거주를 위하여 제공되는 시설물입니다.평상시 가까운 대피시설을 확인하시고, 긴급 재난 발생 시 안전을 위하여 신속 대피하실 수 있도록 확인하여 주세요서울특별시 강북구 이재민 대피시설 지정현황은 위치, 시설명, 수용인원, 전화번호, 데이터기준일자로 구성되어 있습니다.데이터 항목의 컬럼은 위치(문자형), 시설명(문자형), 수용인원(숫자형), 전화번호(문자형), 데이터기준일자(문자형)으로 구성되어 있습니다.
