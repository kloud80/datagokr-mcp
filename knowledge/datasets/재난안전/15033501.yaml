summary_user: 경상북도 구미시에 설치된 안심무인택배함별로 시설명·설치장소와 2025년 6월부터 2026년 5월까지 월별 이용 건수를 담은 소규모 집계 파일(CSV 711바이트)이다. 구미시 담당자나 지역 분석가가 어느 택배함이 많이 쓰이고 월별 수요가 어떻게 변하는지 보고, 추가 설치나 재배치가 필요한지 판단하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 데이터와는 설치장소 이름을 주소·행정동에 수작업으로 맞추거나 같은 기관(구미시) 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경상북도 구미시에 설치된 안심무인택배함의 운영 현황을 정리한 자료로, 각 택배함의 시설명, 설치 장소, 그리고 월별 이용 건수가 포함되어 있어, 택배함의 위치별 이용 빈도와 수요 추이를 분석하는 데 활용할 수 있습니다. 이 데이터는 여성 및 취약계층의 안전을 고려한 생활 편의 서비스의 효과를 측정하고, 향후 추가 설치 필요성이나 운영 효율성 개선을 위한 정책 수립에 중요한 기초자료로 활용됩니다.또한 지역별 이용률을 비교함으로써 시설의 접근성과 활용도를 평가할 수 있으며, 구미시의 범죄 예방 및 생활 안전 인프라 강화와 관련한 행정 계획 수립에도 유용합니다.
