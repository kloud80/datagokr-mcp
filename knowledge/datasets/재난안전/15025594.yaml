summary_user: 부산광역시 사상구 관내 급경사지를 한 곳씩 담은 건별 목록으로, 소재지와 높이·길이·경사, 위험등급, 비탈면 유형·기능·보호구조, 관리주체와 시설관리부서를 담는다. 주민이나 안전 분석가가 사상구에서 위험등급이 높은 비탈면이 어디에 있고 어느 부서가 관리하는지 확인하는 데 쓴다. 전역 조인 키가 없어 소재지 주소를 지오코딩하거나 이름으로 맞춰 재해위험지구·대피시설 등 다른 재난안전 데이터와 겹쳐 본다.
limits: 사상구 한 곳만 다루는 시군구 범위 데이터라 부산 전역이나 다른 구와 비교하려면 구별 파일을 따로 모아야 한다. 공통 코드 키가 없어 다른 데이터와 연결할 때는 주소·이름 매칭에 의존해야 하고, 명세상 갱신은 연간 또는 이벤트성이어서 실시간 위험 상태를 반영하지 않는다.
