summary_user: 용인도시공사가 관리하는 체육시설·문화시설·주차장 등 공공시설에 설치된 CCTV를 설치위치별로 촬영범위와 운영 대수, 데이터기준일자와 함께 담은 소규모 현황 파일(csv 약 3KB)이다. 공사 시설 이용 시민이 '이 주차장이나 체육시설의 어느 구역이 CCTV로 촬영되고 몇 대가 운영되는가'를 확인할 때 쓰거나, 분석가가 공공시설 방범 인프라 현황을 정리할 때 쓴다. 전역 조인 키가 없어 다른 CCTV·시설 데이터와는 설치위치의 시설 이름을 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 용인도시공사에서 운영하고 있는 CCTV 설치 및 촬영 현황에 관한 정보입니다. 이 자료는 우리 공사가 관리하는 체육시설, 문화시설, 주차장 등 다양한 공공시설에서 시민의 안전을 확보하고 범죄를 예방하며, 시설물의 보호와 효율적인 관리 운영을 위해 설치된 CCTV의 위치, 촬영 범위, 운영 대수 등을 시민 여러분께 투명하게 공개하기 위해 제공되는 것입니다. 또한 공개되는 정보는 매년 1회 이상 정기적으로 갱신하여 최신성을 유지하고 있으며, 시민들이 공공데이터를 통해 보다 안심할 수 있는 생활환경을 누릴 수 있도록 지속적으로 관리하고 있습니다.
