description_portal: '광주광역시 동부소방서 의용소방대 현황에 대한 데이터로 동부소방서 의용소방대 종류별 정원 및 현황에 대한 자료를 제공합니다.의용소방대는 소방공무원과 함께 지역의 안전을 지키는 자원봉사 조직입니다. 화재, 재난, 사고 현장에서 소방관을 지원하고, 평소에는 안전 캠페인과 봉사활동을 통해 지역 사회 안전망을 보완하는 역할을 합니다.  “이웃을 지키는 시민 소방관”이라 할 수 있습니다.동부소방서 관내에는 남성대, 여성대, 전문대 등 다양한 의용소방대가 조직되어 있습니다. 의용소방대원들은 소방서 정식 훈련을 받고, 화재 진압 지원부터 대민 봉사까지 폭넓은 활동을 하고 있습니다.1. 화재 및 재난 현장 지원: 소방차 진입 안내, 인명 대피 지원, 장비 이송 등 소방관과 협력2. 예방 활동: 주택용 소방시설(감지기, 소화기) 보급, 전통시장 소방훈련 참여3. 안전 캠페인: 불조심 캠페인, 심폐소생술 체험 교육, 교통안전 계도 활동4. 지역 봉사: 독거노인·취약계층 안전 점검, 봉사활동, 재난 피해 주민 구호등의 활동을 하고 있으며, 의용소방대의 가치는 단순한 봉사단체가 아니라, 지역민 스스로 안전을 지켜내는 시민 협력 조직입니다. 실제 화재 현장에서 소방관 인력만으로 부족할 때 큰 힘이 되고, 평상시에도 안전 문화 확산에 앞장섭니다. 또한 주민과 가장 가까운 위치에서 활동하기 때문에 신속성과 친근성이 큰 장점입니다.이 데이터는 동부소방서 관내 의용소방대 정원, 현황 등의 항목을 제공합니다.'
