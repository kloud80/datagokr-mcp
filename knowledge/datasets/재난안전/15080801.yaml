description_portal: 이 데이터는 일회성으로 제공하는 데이터로  2019년 12월 31일 기준 경찰청에서 집계한 성범죄별 발생 건수와 가해자 성별 현황을 제공하는 공공데이터입니다. 강간, 강제추행, 성희롱, 불법촬영 등 범죄 유형별 발생 건수와 남성·여성 가해자 수, 연도별 추이 등이 포함되어 있어 성범죄의 유형별 특성, 성별 가해자 비율, 사회적 위험 요인을 분석할 수 있습니다. 이 데이터는 경찰의 성범죄 예방 정책, 연구기관의 성범죄 실태 분석, 민간의 안전 프로그램 개발, 공공기관의 피해자 보호 및 교육 자료 등에 활용됩니다.
