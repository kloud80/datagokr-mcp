summary_user: 안전인증을 받은 유해·위험 기계·기구·설비를 제작하거나 설치하는 사업장의 이름, 사업자등록번호, 사업장관리번호, 대표자명을 사업장별로 담은 전국 단위 파일(csv)이다. 산업안전 담당자나 구매 담당자가 납품·설치 업체가 안전인증 대상 기계를 다루는 사업장 목록에 올라 있는지 확인할 때 쓴다. 사업자등록번호(bizno)와 사업장관리번호(ei_workplace_mgmt_no)를 키로 사업자 상태 정보나 고용·산재보험 사업장 데이터와 이어 쓴다.
description_portal: 한국산업안전보건공단에서 생성되는 안전인증을 받은 기계·기구·설비를 제작 설치하는 사업장 정보를 확인할 수 있는 데이터입니다.*산업안전보건법 제84조(안전인증) ① 유해ㆍ위험기계등 중 근로자의 안전 및 보건에 위해(危害)를 미칠 수 있다고 인정되어 대통령령으로 정하는 것(이하 “안전인증대상기계등”이라 한다)을 제조하거나 수입하는 자(고용노동부령으로 정하는 안전인증대상기계등을 설치ㆍ이전하거나 주요 구조 부분을 변경하는 자를 포함한다. 이하 이 조 및 제85조부터 제87조까지의 규정에서 같다)는 안전인증대상기계등이 안전인증기준에 맞는지에 대하여 고용노동부장관이 실시하는 안전인증을 받아야 한다.
