description_portal: "해당 통계는 '수상에서의 수색, 구조 등에 관한 법률'을 근거하여 작성 및 관리되고 있음. 조난사고란 수상에서 사람의 생명, 신체 또는 선박 등의 안전이 위험에 처한 상태라고 정의하고 있으며, 선박의 기준은 선박법에 정의된 선박 중에서 기선, 범선, 부선으로 정하여 통계 집계함. 해상조난사고는 해상(항해, 정박)에서 선박의 운용과 관련하여 발생한 선박과 관련된 모든 물리적 조난사고로 이 사고로 인하여 인명 또는 선박의 안전이 위험한 상태를 말한다. 해당 통계는 선종별 인명 피해 현황을 나타냄* 선종 : 어선, 낚시어선, 레저선박, 관공선, 화물선, 예부선 여객선, 유조선, 유도선, 기타선"
