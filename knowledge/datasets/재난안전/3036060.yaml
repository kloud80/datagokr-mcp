summary_user: 전라남도 소방시설 설계업체를 업체 한 곳당 한 행으로 담은 명부로, 지역·상호·주소·업종·분야·소방시설업 등록번호·등록일자·폐업여부를 시도 범위에서 개별 주소 단위로 제공한다. 건축주나 시공사가 "우리 시군에 영업 중인 소방시설 설계업체가 어디인가"를 찾거나, 분석가가 지역별 설계업체 분포와 폐업 현황을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소 문자열 매칭이나 같은 기관의 소방 관련 데이터와 지역명 기준으로만 이어 쓴다.
limits: 표준 사업자번호나 행정코드 같은 공통 키가 없어 다른 업체·시설 데이터와 정확히 연결하기 어렵고, 주소·상호 매칭으로 연결해야 한다. 업체별 서비스 내용·견적·실적 정보는 담지 않는다.
