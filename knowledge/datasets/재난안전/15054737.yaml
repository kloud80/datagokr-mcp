summary_user: 서울특별시경찰청 관할에서 발생한 5대 범죄(살인·강도·강간및추행·절도·폭력)를 범죄명과 발생 장소별로 묶어 발생건수를 담은 2024년 기준 집계표로, 건별 원천이 아닌 작은 CSV 파일(약 7KB)이다. 치안 정책 담당자나 연구자가 '서울에서 절도나 폭력은 어떤 장소에서 가장 많이 일어나는가' 같은 장소 유형별 범죄 분포 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 범죄 발생·검거 통계와는 범죄명·장소 이름을 맞춰 연결해야 한다.
description_portal: 5대범죄 발생 장소별 현황 데이터는 2024년 기준으로 서울특별시경찰청 관할 구역 내에서 발생한 5대 범죄의 발생 장소별 통계 현황을 제공하는 자료입니다. 살인, 강도, 강간 및 추행, 절도, 폭력 등 5대 범죄를 대상으로 각 범죄 유형별로 어떠한 장소에서 얼마나 많이 발생하였는지를 나타내며 범죄명, 발생 장소, 발생 건수 등의 정보를 포함합니다. 이 정보는 범죄 예방 및 치안 정책 수립에 활용 할 수도 있습니다. 그리고  공공안전 분야 분석 및 연구에도 중요한 기초자료로 활용될 수도 있는 공공데이터입니다.
