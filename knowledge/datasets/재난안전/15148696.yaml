summary_user: 시추조사로 얻은 암석 시료의 일축압축시험 결과를 시험 건별로 담은 전국 범위 파일(CSV 약 7.7MB)로, 시추공·시료심도별 일축압축강도·탄성계수·포아송비·비중·공극율·흡수율·탄성파속도 등을 기록한다. 토목 설계자나 분석가가 "터널·사면 공사 예정지 주변 암반이 얼마나 단단하고 굴착이 어려운가"를 판단할 때 쓴다. 전역 조인 키는 없으며, 같은 기관의 지반정보 데이터(시추공 정보 등)와는 프로젝트코드·시추공코드로 맞춰 이어 쓴다.
description_portal: 시추조사를 통해 생산된 지반조사결과로 암석시험 중 일축압축 시험의 정보를 제공합니다. 암석의 일축압축 시험은 시료에 한 방향으로 압축 하중을 가했을 때, 암석이 파괴되지 않고 견딜 수 있는 최대 압축 응력인 일축압축강도를 측정하는 시험입니다. 이 시험을 통해 암석의 탄성계수와 포아송비 등 역학적 특성을 파악할 수 있으며, 터널, 사면 등 토목 공사에서 암석의 굴착 난이도와 파괴 특성을 평가하는 데 중요한 지표로 활용됩니다.
