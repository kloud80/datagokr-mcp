summary_user: 성남시가 폭염·한파 대응을 위해 지정한 무더위(한파)쉼터를 쉼터 한 곳당 한 행으로 담은 원장으로, 쉼터명·쉼터유형(경로당·복지관·주민센터·마을회관 등)·도로명주소·평일/주말 운영시간이 들어 있다. 성남시 주민이나 복지·재난 담당자가 '우리 동네에서 주말에 문 여는 무더위쉼터는 어디인가'를 찾거나 쉼터 배치 현황을 점검하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 도로명주소를 지오코딩하거나 쉼터명·주소를 맞춰 연결해야 하며, 같은 부문의 민방위 대피시설·지진 대피장소 등과 주소 기준으로 함께 본다.
description_portal: 성남시 무더위(한파) 쉼터 현황 자료는 폭염과 한파등으로부터 시민의 건강과 안전을 보호하기 위해 지정된 쉼터들의 정보를 담고 있는 자료입니다. 이 자료는 쉼터명, 쉼터유형(경로당, 복지관, 주민센터, 마을회관 등), 주소, 평일 및 주말 운영시간 등의 항목이 포함되어 있습니다. 데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 폭염 및 한파 대응 정책, 재난관리 계획 수립등을 위한 기초자료로 활용할 수 있습니다.
