description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증 심사 과정에서 품목별로 부과되는 수수료 정보를 정리한 자료입니다. 각 행은 특정 인증품목에 대한 심사 수수료 기준을 나타내며, 주요 필드에는 ‘인증품목조합코드’, ‘인증품목명’, ‘인증서 신규 발급 수수료’, ‘인증서 변경 발급 수수료’, ‘설계심사 수수료’, ‘안전성시험 수수료’, ‘국내 공장심사 수수료’, ‘국외 공장심사 수수료’, ‘부분 수수료’, ‘개정명’, ‘시작일’, ‘종료일’ 등이 포함되어 있습니다.이 데이터는 승강기 부품의 인증 단계별로 부과되는 비용을 구체적으로 분류하고 있으며, 각 품목에 대한 심사 및 시험에 소요되는 금액이 명시되어 있습니다. ‘개정명’, ‘시작일’, ‘종료일’ 항목을 통해 해당 수수료가 적용되는 기간을 확인할 수 있어, 시간에 따른 수수료 기준 변화도 추적 가능합니다. ‘부분 수수료’ 항목은 인증 절차의 일부 항목만 해당될 때 적용되는 수수료 정보를 제공합니다.이 자료는 인증 행정 비용 분석, 품목별 수수료 비교, 제도 개선을 위한 근거자료로 활용할 수 있습니다.
