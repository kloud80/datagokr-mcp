summary_user: 광주소방안전본부 소방공무원 전원에 대한 특수건강검진 결과를 연도·구분별로 집계한 파일로, 2023~2025년의 검진인원, 검진비용, 일반질병·직업병의 관찰·소견 인원을 담는다(파일 크기 244바이트의 소규모 집계표). 소방 인력 보건을 살피는 분석가나 행정 담당자가 "매년 직업병 소견을 받는 소방공무원이 늘고 있는가, 검진비용은 얼마인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 기관명(같은 기관 코드)으로만 맞춰 이어 쓴다.
description_portal: 광주광역시 소방공무원 특수건강검진 실시 결과(검진인원, 검진비용, 일반질병 등)의 2023~2025년 기록은 광주소방안전본부 소방공무원 전원에 대한검진인원, 검진비용, 일반질병(관찰), 일반질병(소견), 직업병(관찰), 직업병(소견)으로구성된 데이터입니다. * 소방공무원은 직무특성상 각종 유해물질에 노출되기 쉬워 매년 건강진단을 실시하고 있으며, 건강진단은 배치전진단, 정기진단, 수시진단과 정밀건강진단으로 구성되어 있습니다.   임용 전 신규직원에게는 배치전진단을 실시하며, 재직중 직원에게는 매년 1회 정기진단 실시 후 필요 시 정밀건강진단을 실시하며, 대형 재난현장 등 활동 후 필요 시 수시진단을 실시합니다.
legal_basis_portal: 소방공무원의 검진에 대한 비용 및 결과를 매년 데이터화 하여 유지관리하기 위함
