description_portal: '2025년 통계에 따르면 전체 음주운전 적발 건수에서 남성이 여성보다 압도적으로 높은 비중을 차지하며, 특히 연령대가 높아질수록 상습적인 재범 경향이 뚜렷하게 나타납니다.성별 및 연령별 특징: 30대 남성이 1회 적발(14,111건) 및 2회 재범에서 가장 높은 수치를 기록했으나, 3회 이상 상습 재범으로 넘어가면 40대와 50대 남성의 비중이 급격히 높아집니다.상습성 분석: 7회 이상 적발된 초고위험군 역시 **50대 남성(360명)**과 **60대 남성(296명)**에 집중되어 있어, 중장년층 남성의 음주운전 관성 및 법적 불감증이 심각한 수준임을 보여줍니다.여성 지표: 여성의 경우 모든 연령대에서 남성 대비 적발 건수가 현저히 낮으며, 2회 이상의 재범률 또한 남성에 비해 매우 낮은 수치를 유지하고 있습니다.'
