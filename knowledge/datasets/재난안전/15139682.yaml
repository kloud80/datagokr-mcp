summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 지역 대규모 공사장 목록으로, 공사장별로 지정연도, 공사장 유형, 공사명, 지역·법정동 코드와 지번·도로명 주소, 총공정률과 당해 공정률, 착공일과 준공예정일, 시공사 등을 담는다. 지자체 안전 담당자나 주민이 '우리 동네에서 진행 중인 대규모 공사장은 어디이며 공정이 얼마나 진행됐는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아서, 다른 데이터와는 법정동코드(STDG_CD)·지역코드 같은 코드나 주소를 매핑해 연결하고, 재난 위험지역·시설 안전 데이터와 함께 본다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지역 대규모 공사장 정보로, 지정연도, 공사장유형코드, 공사명, 지역코드, 법정동코드, 주지번, 부지번, 상세주소, 총공정율, 당해공정율 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
