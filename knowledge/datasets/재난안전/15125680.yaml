description_portal: '국토안전관리원에서 제공하는 건설공사 참여자의 안전관리 수준평가의 평가횟수에 따른 평균점수 현황이 포함된 CSV형식 파일데이터 입니다.건설공사 안전관리 수준평가의 평가 횟수는 평가 대상 주체(발주청, 건설사업관리용역사업자, 시공자) 및 평가 유형(현장평가, 본사평가)에 따라 다릅니다. 주요 참여자별 평가 시기 및 횟수는 다음과 같습니다:발주청 (본청 또는 본사): 대상 공사 수와 관계없이 해당 회계연도별로 1회 실시합니다.건설사업관리용역사업자 및 시공자:현장평가: 공기가 20% 진행되었을 때부터 1회 실시합니다.본사평가: 현장평가 대상 건설공사를 보유한 경우, 해당 회계연도별로 1회 실시합니다. 이러한 안전관리 수준평가는 「건설기술진흥법」에 근거하며, 국토교통부장관으로부터 위탁받은 국토안전관리원에서 시행합니다. 평가 결과는 발주청의 공공기관 안전 등급제(경영평가)나 시공자의 시공능력평가제도(신인도) 등에 반영될 수 있습니다. 자세한 내용은 건설공사 안전관리 종합정보망(CSI) 또는 국토안전관리원 웹사이트에서 확인할 수 있습니다.'
