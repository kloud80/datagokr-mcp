description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2013년부터 2023년까지 경찰청에서 집계한 착한운전 마일리지 연도별 서약 인원 현황을 제공하는 공공데이터입니다. 착한운전 마일리지는 교통법규를 준수하고 무위반·무사고를 실천한 운전자에게 마일리지를 부여하는 제도로, 연도별 서약 참여자 수, 누적 인원, 연도별 증가율 등이 포함됩니다. 이 데이터는 교통안전 정책, 운전자 의식 개선 캠페인, 연구기관의 교통문화 분석, 민간 보험사 인센티브 프로그램 설계, 공공기관의 교통안전 홍보 자료 등에서 활용됩니다.
