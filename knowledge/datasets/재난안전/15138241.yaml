description_portal: '본 데이터는 한국승강기안전공단이 운영하는 콤비스마트 업무시스템의 ‘마이메뉴(My Menu)’ 설정 내역을 표 형태로 정리한 자료입니다. 필드는 마이메뉴ID(기능·화면 식별 코드), 메뉴명(화면/기능 명칭), 마이메뉴순서(마이메뉴 내 표시 순서를 나타내는 정수), 등록일자(해당 설정이 시스템에 기록된 일자, YYYY-MM-DD)로 구성됩니다. 마이메뉴ID는 영문·숫자·하이픈 조합의 코드 체계를 사용하며 예시는 ‘EL01-010’, ‘AA01-010’, ‘DB01-030’ 등입니다. 동일한 마이메뉴ID 또는 메뉴명이 서로 다른 마이메뉴순서·등록일자와 함께 여러 번 나타날 수 있으며, 각 행은 한 건의 설정 기록을 의미합니다. 마이메뉴순서는 0, 1, 2 …와 같이 정수값으로 저장되며 동일 순서값의 중복이 존재할 수 있습니다. 메뉴명에는 시스템 표기에 따라 특수문자(예: ‘일일근태등록*’)가 포함될 수 있습니다.'
