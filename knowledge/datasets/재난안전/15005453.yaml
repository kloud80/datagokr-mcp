summary_user: 서울 송파구 안의 비상급수시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명칭·시설종류·읍면동·도로명 주소·하루 급수 규모(톤)·준공일·운영 지정일이 들어 있다. 송파구 주민이나 재난 대응 담당자가 단수·재난 때 우리 동네에서 가장 가까운 비상급수시설이 어디이고 하루 몇 톤을 공급하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 도로명 주소나 읍면동 이름을 맞춰 연결해야 한다.
limits: 범위가 송파구 한 곳이라 다른 시군구나 서울 전체 현황은 이 파일로 볼 수 없다. 법정동·행정동 코드 같은 공통 키가 없어 다른 데이터와 붙일 때 주소·이름 매칭 오류에 주의해야 한다.
