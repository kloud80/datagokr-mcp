summary_user: 포털 설명상 전국 자전거 사고다발지역 정보를 지구 단위로 담지만, 실제 필드는 위험지구 관리번호·명칭·등급·유형, 지정일과 사유, 해제일, 사망자·부상자 수 등 위험지구 관리 항목으로 구성되며, 범위는 전국이고 비공간 데이터이다. 지자체 안전 담당자나 분석가가 "우리 지역에 지정된 사고 위험지구는 어디이고 언제 지정·해제됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 지역코드(DST_RSK_DSTRCT_RGN_CD)나 지구·시설 명칭을 매핑해 재난 위험지역, 대피시설, 시설 안전 등 같은 기관의 다른 재난안전 데이터와 이어 쓴다.
