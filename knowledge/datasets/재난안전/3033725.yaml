summary_user: 광주광역시 남구 관내 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 2.7KB)로, 시설명·도로명/지번 주소·용량·인원·설치(지정)년도·비상발전기 보유·용도·구역을 기록한다. 단수나 재난 때 남구 주민이 우리 동네에서 식수·생활용수를 받을 수 있는 가장 가까운 급수시설이 어디인지 확인하거나, 구역별 급수 용량이 인원 대비 충분한지 따져보는 데 쓴다. 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 주소나 시설명을 매칭해 이어 쓰며, 좌표 컬럼이 없으므로 지도에 올리려면 주소를 지오코딩해야 한다.
description_portal: 광주광역시 남구 관내의 민방위 비상급수시설 현황 및 정보(시설명, 도로명주소, 지번주소, 용량, 설치년도, 용도 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 안전총괄과(☎062-607-2933)에서 제공합니다. 비상발전기를 보유한 시설의 경우에만 현황 데이터를 명시하였으며, 소재지도로명주소가 조회되지 않는 경우 소재지지번주소를 기입하였으니 이용에 참고하시기 바랍니다. ※ 민방위 비상급수시설은 재난이나 전쟁, 대규모 단수와 같이 상수도 공급이 중단되는 상황에서 주민에게 식수와 생활용수를 제공하기 위해 설치된 시설입니다. 지하수나 저장수원을 활용해 비상시 안전한 물을 공급하며, 평상 시에는 유지·관리와 수질 검사를 통해 위기 발생 시 즉시 사용할 수 있도록 준비합니다. 이러한 시설은 주민 생존과 위생을 보장하는 필수 기반 시설로, 위기 대응 역량 강화를 위해 정기적으로 점검·정비됩니다.
