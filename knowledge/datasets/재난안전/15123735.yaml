summary_user: 경상북도 고령군에 지정된 산사태취약지역을 지역 한 곳당 한 행으로 담은 파일(csv, 약 16KB)로, 시도·시군구와 소재지 지번주소, 데이터기준일자가 들어 있다. 주민이나 지자체·방재 담당자가 '우리 마을 근처에 산사태취약지역으로 지정된 곳이 있는가', '집중호우 때 어느 지번을 우선 점검하고 대피계획에 넣어야 하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소나 시군구 이름을 맞춰 연결해야 하며, 토지 규제 레이어나 대피소 데이터와 겹쳐 보는 용도에 쓴다.
description_portal: 경상북도 고령군에 지정된 산사태취약지역의 현황을 정리한 것으로, 태풍이나 집중호우 시 인명, 주택, 농경지 등에 피해가 발생할 우려가 있는 지역을 포함합니다. 경사가 급한 지형, 풍화암 및 마사토로 구성된 불안정한 토양, 수목이 전혀 없는 무임목지, 집중호우로 인해 지반이 약화된 급경사지, 그리고 대형 산불로 식생이 훼손된 지역 등이 주요 지정 대상에 해당합니다. 본 자료는 산사태로 인한 재해 발생 가능성이 높은 지역을 사전에 파악하고, 체계적으로 관리하기 위한 기초자료로 활용되며, 취약지역에 대한 정비사업 계획 수립, 예방 시설 설치, 주민 대피계획 마련 등과 같은 재해 예방 조치를 효과적으로 추진하는 데 활용됩니다. 또한 산사태 위험 지역의 공간 분포를 행정구역별로 분석함으로써, 산림재해 대응 정책 수립과 지역별 위험도 평가, 재해예방 예산의 합리적 배분 등 행정적·정책적 활용에 중요한 기반이 됩니다.
