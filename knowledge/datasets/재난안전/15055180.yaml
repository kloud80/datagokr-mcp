summary_user: 서울 동작구의 안심귀가 스카우트 서비스 실적을 월별(년월)로 집계한 파일로, 귀가지원 횟수와 순찰 횟수, 관리부서를 담으며 포털 설명상 2017년 1월부터 2026년 4월까지를 다룬다. 구청 안전정책 담당자나 분석가가 '동작구에서 안심귀가 동행 이용과 순찰 실적이 해마다 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 년월 기준으로 맞추거나 같은 기관(동작구) 단위로만 이어 쓴다.
