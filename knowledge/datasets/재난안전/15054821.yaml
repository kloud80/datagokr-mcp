summary_user: 광주광역시 소방안전본부의 생활안전활동(벌집제거·동물처리·잠금장치개방·피해복구지원 등)을 활동 유형별로 2024년과 2025년 건수, 전년 대비 증감 건수·비율로 정리한 소규모 집계 파일(CSV 678바이트)이다. 시민이나 분석가가 '119 생활안전 출동 중 어떤 유형이 가장 많고, 지난해보다 어떤 활동이 늘거나 줄었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방·재난 데이터와는 활동 유형 이름이나 같은 기관 기준으로만 맞춰 본다.
description_portal: '광주광역시 소방안전본부 생활안전활동 현황입니다.(2024년~2025년)-생활안전활동(처리) : 벌집제거, 동물처리, 장애물처리, 잠금장치개방, 비화재보확인, 피해복구지원, 생활끼임제거, 기타생활안전처리-생활안전활동(지원) : 안전조치, 기타활동❍ 2025년도 생활안전활동 출동건수는 12,258건으로 전년도 대비 7.2% 감소하였고, 처리건수도 11,242건으로 전년도 대비 9.1% 감소하였음.❍ 전년도에 이어 벌집제거(3,605건, 32.1%)에 가장 많은 출동을 하였고, 피해복구지원(802건, 309.2%)의 높은 증가율은 2025년도 여름철 집중호우로 인해 출동요청이 급증(462건/배수조치 등)한 것이 그 원인으로 분석됨.'
