summary_user: 인천광역시 서해구(포털 설명상 서구)에서 재난 때 이재민을 수용하도록 지정한 임시주거시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 9KB)로, 시설구분·시설명·상세주소·내진설계 여부·수용가능면적과 인원·데이터기준일자를 담는다. 구청 재난 담당자나 주민이 '우리 동네에서 이재민이 머물 수 있는 시설은 어디이고 몇 명까지 수용하며 내진설계가 되어 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 대피·구호시설 자료와는 상세주소나 시설명을 매칭하는 방식으로만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내에서 재난 발생 시 이재민을 수용하기 위해 지정된 임시주거시설 현황을 수록한 자료입니다. 본 자료는 인천광역시 서구 내 이재민 임시주거시설의 시설명, 상세주소, 내진설계, 수용가능면적의 정보를 수록하고 있습니다. 본 데이터를 통해 재해 및 재난 상황 발생시 이재민의 신속한 보호와 임시거주 지원에 도움이 될것으로 판단이 됩니다. 또한 행정기관의 긴급대응 체계 등 다양한 분야에 활용이 될 것으로도 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
