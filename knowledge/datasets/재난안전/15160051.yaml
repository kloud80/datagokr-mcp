description_portal: 본 공공데이터는 전북경찰청 관할 지역에서 발생한 보이스피싱 범죄의 발생 현황과 검거 실적을 유형별로 체계적으로 제공하는 데이터이다. 데이터는 보이스피싱 범죄를 기관사칭형, 대출사기형, 메신저피싱형, 몸캠피싱형 등 주요 범죄 유형으로 구분하여 관리하며, 각 유형별 발생 건수, 검거 건수, 검거 인원 수 등의 정보를 포함한다. 이를 통해 보이스피싱 범죄의 유형별 발생 추세와 수사 성과를 객관적으로 파악할 수 있으며, 범죄 예방 정책 수립과 치안 서비스 개선을 위한 기초자료로 활용될 수 있다.기관사칭형은 경찰, 검찰, 금융감독원, 금융기관 등 공공기관이나 금융기관을 사칭하여 피해자를 기망하는 범죄를 의미하며, 대출사기형은 저금리 대환대출이나 신용등급 상향 등을 미끼로 금전을 편취하는 범죄를 의미한다. 메신저피싱형은 가족, 지인, 직장동료 등을 사칭하여 메신저를 통해 금전을 요구하는 수법이며, 몸캠피싱형은 영상통화 또는 음란 영상물을 이용하여 피해자를 협박하고 금전을 갈취하는 범죄를 의미한다.데이터 항목에는 연도별 또는 기간별 범죄 발생 건수, 검거 건수, 검거 인원 수 등이 포함되며, 이를 통해 특정 시기 또는 특정 유형의 범죄 증가 여부와 검거율 변화를 분석할 수 있다. 또한 범죄 유형별 특성과 수사 대응 현황을 비교·분석할 수 있어 학계, 연구기관, 지방자치단체, 치안 관련 기관 및 일반 국민이 보이스피싱 범죄 동향을 이해하고 예방 대책을 마련하는 데 유용하게 활용할 수 있다. 특히 지역사회 범죄 예방 교육, 금융사기 예방 홍보, 정책 수립, 연구 분석, 공공서비스 개선 등 다양한 분야에서 활용 가능한 공공데이터로서 높은 공익적 가치를 가진다.
