summary_user: 구미시 어린이 공원에 설치된 CCTV를 설치 위치 단위로 담은 건별 현황 데이터로, 읍면동명·구주소·신주소·상세 위치·카메라 수량·관리번호를 포함하며 범위는 구미시 한 곳이다. 시민이 자녀가 가는 공원에 CCTV가 있는지 확인하거나, 분석가·담당자가 어린이 공원 방범 사각지대와 추가 설치 후보지를 찾을 때 쓴다. 전역 조인 키는 없어서 읍면동명이나 주소를 이름 매핑해 공원 목록·생활안전 시설 데이터와 이어 쓴다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 데이터와 연결하려면 주소·읍면동명 문자열을 직접 맞춰야 한다. 구미시 범위의 데이터라 다른 시군과 비교하려면 지자체별 데이터를 따로 모아야 한다. API는 활용신청 후 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한된다.
