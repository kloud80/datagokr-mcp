summary_user: 전국 자전거길을 노선별로 구성하는 선형 정보를 담는 데이터로, 자전거길 번호(ROAD_SN)와 노선명·도로 유형 아래 라인을 이루는 점들의 순번과 좌표, 길이, 공간 도형(GEOM)이 행 단위로 들어 있다. 자전거 이용자나 지도·관광 서비스 개발자가 특정 자전거길이 어느 경로로 이어지는지 지도 위에 그릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자전거길 이름이나 좌표 기반 공간 매칭으로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 전국 자전거길에 대한 관련 정보입니다.\""
