summary_user: 부산광역시 소방 출동 기록을 바탕으로 사고가 자주 나는 위험 지점별로 시군구, 상세위치, 장소구분, 사고유형, 출동횟수, 사망·중상·경상 인원, 개선의견과 경위도 좌표를 정리한 지점 단위 집계 파일입니다. 지자체·소방·경찰 담당자나 분석가가 '부산에서 출동이 잦고 인명피해가 큰 사고위험 지점은 어디이며 어떤 개선이 제안됐는가'를 확인해 순찰·예방 자원 배치를 정할 때 쓴다. 전역 조인 키는 없어 시군구명 같은 이름 매칭이나 경도·위도 좌표로 다른 공간 데이터(급경사지·재해위험지구 등)와 겹쳐 보는 방식으로만 연결한다.
description_portal: 소방의 빅데이터(출동현황)를 활용한 일자, 시군구명, 위험지역명, 상세위치주소, 사고 피해 정도, 개선의견, 장소구분명, 사고빈도, 유형 분석 등이 나와있는 데이터입니다. 관계기관과 협력하여 주요 안전사고 발생 빈발지역을 정리하여  개선방안을 강구하고자 만들어진 데이터로 부산광역시의 사고위험지역과 그와 관련한 데이터들이 굉장히 상세하게 나타나 있습니다. 위 데이터는 지방자치단체, 소방, 경찰 등이 안전 예방을 위해 참고할 수 있으며 이를 통해 효율적인 인력 및 자원 배치를 할 수 있습니다.
