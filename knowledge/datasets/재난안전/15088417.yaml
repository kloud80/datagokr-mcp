description_portal: '2001년-2023년  해양경찰청 간행물에 관한 데이터로 발행 기관,주관 부서,간행물 제목,발간 주기,발간 용도,발간 매체,페이지수,신청 일자,발간 등록번호 등에 관한 항목을 제공합니다.간행물은 「공공기록물 관리에 관한 법률」 제3조 제1항에서 정하는 ‘공공기관’이 그 기관의 목적이나 업무수행의 내용을 기관 내부, 일반인에게 전달하기 위해 발간하는 자료입니다.공공기관 : 국가기관, 지방자치단체, 그 밖에 대통령령으로 정하는 기관간행물은 정책수행 과정 및 결과, 각종 통계, 연구조사 결과 등을 포함하고 있어 조사·연구의 기초자료 뿐만 아니라 국가정책 입안 및 주요 행정참고자료로도 활용할 수 있습니다.｢간행물 컬렉션｣은 1953년부터 2015년까지 각급 기관에서 발간하여 국가기록원에 이관한 간행물 240,486권의 목록정보와 169,222권의 원문 이미지를 제공하고 있습니다.본 컬렉션에서는 이용자의 검색 편의성을 위해 키워드 검색, 발행연도 검색, 발행기관별 검색, 간행물 유형별 검색 등을 제공하고 있습니다.'
