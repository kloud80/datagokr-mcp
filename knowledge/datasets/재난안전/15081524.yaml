description_portal: 대전광역시 기존 공공 시설물 내진 성능 현황 자료는 내진 보강 대책에 따라 대전 내 공공시설물의 내진 성능 확보 여부를 상세히 제공합니다. 해당 자료에는 공공건축물, 도로시설 등 총 9종 시설물의 내진 설계 적용 여부, 내진 성능 평가 및 결과, 내진 보강 시행 여부, 개별 시설 준공일, 담당 부서 등 세부 내역이 포함됩니다. 이 데이터는 각 시설물의 내진 보강 상태와 평가 결과를 체계적으로 관리할 수 있어, 지역 내 시설 별 내진 안전 관리 현황을 구체적으로 파악하고 잠재적 지진 위험에 선제적 대응이 가능합니다. 또한 시설 유형 별, 지역 별 내진 성능 추진 현황을 비교·분석할 수 있어 향후 내진 보강 정책 수립, 예산 배분, 시설 관리 계획 개선 등 폭넓은 업무에 활용 가치가 높습니다.
