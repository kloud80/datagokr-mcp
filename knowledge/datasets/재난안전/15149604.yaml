summary_user: 청소년활동 시설·단체의 안전점검 결과를 시설 단위 건별로 담으며, 전국 291건이 확인됐다. 시설별로 점검연도, 종합점검 결과 등급, 건축·토목·기계·전기·소방·가스·위생 분야별 점검 결과 내용을 본다. 소재지주소(lctnAddr)를 주소 키로 삼아 같은 주소 기준의 다른 시설 안전 자료나 지역 데이터와 이어 쓴다.
description_portal: 성평등가족부 청소년활동 행정정보공동이용센터 시설단체 안전점검 결과 연계 정보는 청소년활동 시설 및 단체의 안전관리 현황을 체계적으로 확인하고 관리하기 위해 제공되는 자료입니다. 각 시설의 점검 일자, 점검 항목, 점검 결과, 시정 조치 사항, 담당자 정보를 포함하며, 이를 통해 기관에서는 시설 안전 관리 현황을 종합적으로 분석하고 개선 방안을 마련할 수 있습니다. 또한 연계 정보를 활용하면 청소년 활동 참여자의 안전 확보, 위험 요인 사전 예방, 점검 주기 관리, 정책 개선 및 행정 효율화에도 중요한 근거 자료로 활용됩니다.
