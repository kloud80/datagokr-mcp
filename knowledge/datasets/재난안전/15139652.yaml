summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 방역사전대상지역(방역 취약지역) 정보를 지역 건별로 담으며, 행정동·법정동 코드, 지번·도로명 주소, 취약지역 유형과 이름, 선정일자, 조치내용을 포함한다. 보건소나 지자체 방역 담당자, 분석가가 '우리 동네에서 방역 취약지역으로 선정된 곳은 어디이고 어떤 조치가 이뤄졌는가'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서, 행정동코드(DONG_CD)·법정동코드와 주소를 행정구역 코드표나 다른 재난안전 데이터(위험지역, 대피시설 등)에 이름·코드로 맞춰 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 방역사전대상지역 정보로, 행정동코드, 법정동코드, 산주소여부, 주지번, 부지번, 상세주소, 취약지역유형코드, 취약지역명, 선정일자, 조치내용 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
