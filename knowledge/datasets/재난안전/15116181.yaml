summary_user: 서울 중구의 민방위 비상급수시설을 인허가 건별로 담으며, 관리번호·인허가일·영업상태·폐업일·지번/도로명 주소·비상시설 위치·시설명과 중부원점TM 좌표(XCRD·YCRD)를 포함한다. 주민이나 재난 담당자가 '단수 같은 비상시 우리 동네에서 식수를 받을 수 있는 급수시설이 어디에 있고 지금도 운영 중인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·시설명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓰며, 다른 대피·구호시설 데이터와 주소·좌표 기준으로 함께 본다.
description_portal: '서울특별시 중구의 민방위사태 발생 시 급수가 불가능 한 경우 비상급수에 사용되는 시설정보입니다. 해당 데이터에는 관리번호, 비상시설위치, 영업상태, 시설명, 주소, 좌표정보 등의 정보를 제공합니다.민방위급수시설은 재난이나 비상상황 시 주민에게 신속히 식수를 공급하기 위한 시설이며, 긴급 상황에서도 안전한 식수 공급이 보장됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
