summary_user: 충청북도 단양군 가로등관리시스템에 등록된 가로등 분전함(제어함)을 한 건씩 담은 원천 목록으로, 위치(법정동·지번), 관리기관, 제어함 용도·종류, 한전 계약종별·계약용량, 분기회로 수, 점멸방식, 설치일자, 연결 등 수량을 포함한다(csv 약 3KB의 소규모 파일). 지자체 시설 담당자나 분석가가 '어느 마을에 분전함이 몇 개 있고 각각 몇 개의 등을 어떤 점멸방식으로 제어하는가', '오래 설치된 분전함은 어디에 있는가' 같은 질문에 쓴다. 법정동코드(bjd_cd)를 키로 같은 지역의 보안등·CCTV·안전비상벨 등 다른 생활안전 시설 데이터나 법정동 단위 통계와 이어 쓴다.
description_portal: 충청북도 단양군의 가로등관리시스템 분전함 현황을 정리한 데이터입니다. 행정구역코드, 법정동코드, 행정일련번호, 지번코드, 지번, 관리기관, 제어함용도, 제어함종류, 계량기번호, 계약종별, 전원전압, 한전계약용량, 분기회로수, 점멸방식, 설치일자, 최종승인여부, 등수량, 표찰재질, 데이터기준일자 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 가로등관리시스템 분전함 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 11월 28일입니다. 담당부서는 단양군청 관광건설국 균형개발과이며 문의주시면 최신의 충청북도 단양군 가로등관리시스템 분전함 현황을 열람하실 수 있게 도와드립니다.
