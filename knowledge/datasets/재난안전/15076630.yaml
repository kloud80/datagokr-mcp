description_portal: '"제주특별자치도 내 안전데이터분석자료-04-제주보행자사고(TAAS)좌표데이터 데이터를 제공합니다.항목: 사고번호, 발생일시, 발생시간, 발생요일, 시, 읍명동, 사고내용, 사망자수, 중상자수 등* 제주특별자치도에서 수집한 보행자 사고 정보로, TAAS (교통사고분석시스템) 를 통해 제공된 좌표 데이터가 포함됩니다. 사고 발생일시, 시간, 요일, 행정구역(시, 읍/면/동), 사고 유형, 피해자 수(사망자, 중상자, 경상자 등), 기상 및 도로 상태, 법규 위반 여부 등의 다양한 속성이 포함되어 있어 사고가 발생한 맥락을 다각도로 이해할 수 있습니다.* 활용 분야 : 데이터 연계, 시스템 자동화, 시각화 작업, 정책 의사결정 지원 등"'
