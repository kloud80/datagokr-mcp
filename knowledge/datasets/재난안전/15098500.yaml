summary_user: 세종특별자치시의 지진옥외대피소를 한 곳씩 담은 시설 원장으로, 대피소명·유형·도로명주소·위경도 좌표·최대면적·수용 가능 인원·운영상태·편의시설·이용 주민대피지구·내진 적용 여부와 설계등급·관리기관을 담는다. 세종시 주민이나 방재 담당자가 '지진이 나면 우리 동네에서 가장 가까운 옥외대피소는 어디이고 몇 명까지 수용하는가'를 확인하거나 지도에 대피소 위치를 표시하는 데 쓴다. 전역 조인 키는 없으므로 다른 대피시설·재난 위험지역 데이터와는 주소나 좌표(la, lo)를 기준으로 공간 매칭하거나 시설명으로 맞춰 이어 쓴다.
description_portal: 세종특별자치시 지진옥외대피소명, 유형, 주소, 면적, 수용 가능 인원수, 운영상태, 전화번호, 편의시설, 이용 주민대피지구, 내진 적용 및 설계 정보, 관리기관  정보를 제공합니다.
