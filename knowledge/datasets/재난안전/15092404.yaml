summary_user: 대구광역시 서구 관내 공원·어린이공원 등에 설치된 어린이놀이시설을 시설 한 곳당 한 행으로 담고, 놀이시설명·주소·설치일자·검사일자·검사 유효기한·검사종류(정기시설검사, 설치검사)를 수록한 파일(약 2.7KB CSV)이다. 학부모나 주민이 '우리 동네 놀이터는 안전검사를 언제 받았고 유효기한이 지나지 않았나'를 확인하거나, 구청 담당자가 유효기한이 다가오는 시설을 골라 정기검사 일정을 잡는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 주소나 놀이시설명을 기준으로 맞춰 이어 쓴다.
limits: 고유 시설번호 같은 공통 조인 키가 없어 전국 어린이놀이시설 데이터나 다른 시설 안전 원장과 바로 결합할 수 없고, 주소·이름 매칭에 의존해야 한다. 범위는 대구 서구 한 개 시군구에 한정된다.
