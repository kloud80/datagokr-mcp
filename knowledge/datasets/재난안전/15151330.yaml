description_portal: 이 데이터는 광주광역시 지역주민의 건강행태와 안전의식 수준을 종합적으로 파악하기 위한 보건‧안전 분야 통계자료입니다.운전 시 안전벨트 착용률, 스트레스 인지율, 고위험 음주율 등 시민의 일상생활과 밀접한 주요 건강지표를 수록하여지역사회 건강 수준 진단, 건강증진정책 수립, 생활안전 문화 확산을 위한 기초자료로 활용할 수 있습니다.○ 운전 시 안전벨트 착용률자치구별 운전자가 차량 운행 중 안전벨트를 착용하는 비율을 의미하며, 교통사고 발생 시 인명피해를 최소화하기 위한 안전문화 지표입니다.이 지표는 KOSIS 국가통계포털 기반으로 집계되며, 교통안전 정책, 홍보 캠페인, 어린이·고령자 대상 교통안전 교육 계획 수립에 활용됩니다.○ 스트레스 인지율일상생활 중 평소 스트레스를 “많이” 또는 “대단히 많이” 느낀다고 응답한 자치구별 응답자 비율을 의미하는 정신건강 관련 주요 지표입니다.이 지표는 KOSIS 국가통계포털 기반으로 집계되며  이를 통해 정신건강 증진사업, 상담서비스 확충, 근로자·청년층 대상 심리방역 프로그램 등 정책적 대응방안 수립의 근거자료로 활용됩니다.○ 고위험 음주율고위험 음주율은 음주습관 중 건강에 부정적 영향을 미칠 수 있는 과도한 음주 행태를 보이는 자치구별 응답비율을 의미합니다.이 지표는 KOSIS 국가통계포털 기반으로 집계되며  이는 음주 관련 질환, 사고, 사회적 문제 발생 위험을 평가하는 핵심 보건지표로 사용됩니다.
