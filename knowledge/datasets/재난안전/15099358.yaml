description_portal: '경상남도 거창군의 2019년(태풍 미탁) ~  2020년(태풍 마이삭) 까지의 거창군 자연재난 현황 데이터로써, 재난명, 피해현황, 피해원인, 시설등급 등의 정보를 제공합니다.○ 데이터 기준일 : 2022. 03. 15. (일회성 데이터)○ 태풍 미탁은 2019년 10월 발생한 제18호 태풍으로, 남부지방을 중심으로 기록적인 폭우를 동반하며 큰 피해를 남겼습니다. 특히 경상북도와 강원도 지역에 집중호우가 쏟아져 산사태와 침수 피해가 발생했고, 인명 피해도 적지 않았습니다. 미탁은 상대적으로 강풍보다는 집중호우로 인한 수해가 두드러졌던 태풍으로 평가됩니다. 태풍 마이삭은 2020년 8월 말 발생한 제9호 태풍으로, 중심기압 935hPa, 최대풍속 초속 49m의 매우 강한 세력을 지닌 채 한반도에 상륙했습니다. 9월 3일 새벽 부산에 상륙한 마이삭은 강풍과 폭우를 동반하며 전국에 걸쳐 정전, 시설물 파손, 인명 피해를 초래했습니다. 특히 제주도와 영남 지역에 큰 영향을 미쳤으며, 사망자 7명, 부상자 92명, 실종자 42명의 피해를 남겼습니다.'
