summary_user: 경상남도 사천시 관내 풍수해 대피소를 시설 한 곳당 한 행으로 담은 파일로, 시설명·시설 구분·도로명주소·위도/경도·면적·수용인원을 개별 시설 단위로 제공한다. 사천시 주민이나 재난 담당자가 '태풍·호우 때 우리 동네에서 가장 가까운 대피소는 어디이고 몇 명까지 들어갈 수 있나'를 확인하거나 대피 계획을 세울 때 쓴다. 전역 조인 키는 없어 도로명주소나 위도·경도 좌표로 재난 위험지역·특보 데이터나 다른 대피·구호시설 목록과 공간적으로 맞춰 쓴다.
description_portal: '경상남도 사천시 관내에 위치한 풍수해 대피소의 상세 현황 정보를 공공데이터로 제공하고 있습니다. 이 정보는 재난 발생 시 시민의 안전 확보를 위해 긴요하게 활용됩니다.제공되는 주요 데이터 항목은 다음과 같습니다:시설명:대피소로 지정된 건물의 공식 명칭시설구분:시설의 종류 (예: 학교, 경로당, 체육관 등)도로명주소:신속한 위치 확인을 위한 정확한 주소위도:지리 정보 시스템(GIS) 활용을 위한 좌표면적:대피소로 사용 가능한 공간의 크기수용인원:비상 상황 시 수용 가능한 최대 인원이 데이터는 사천시의 재난 안전 관리 체계를 강화하고, 시민과 관계자들이 신속하게 대피 계획을 수립하는 데 중요한 역할을 합니다.'
