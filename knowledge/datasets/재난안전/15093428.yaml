summary_user: 경상남도 양산소방서 관내(물금읍·중앙동·덕계동·원동면 등) 도로변에 설치된 가로변 비상용 소화기함의 위치(주소)를 한 건씩 정리한 xlsx 파일이다. 주민이나 지역 안전 담당자가 '우리 동네 어느 길가에 비상 소화기가 있나'를 확인하거나, 소방용수·비상소화장치 같은 소방시설 위치와 함께 초기 소화 자원 분포를 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·읍면동 이름을 맞춰 연결하는 수밖에 없다.
