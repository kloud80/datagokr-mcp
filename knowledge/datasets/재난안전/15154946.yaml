description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증 접수 모델 정보를 담고 있으며, 각 인증 신청 건에 대해 어떤 모델이 접수되었는지를 기록한 자료입니다. 주요 필드에는 ‘접수 번호’, ‘신청업체’, ‘인증품목조합코드’, ‘수수료’, ‘정산금액’, ‘모델 명’, ‘메모’ 등이 포함되어 있습니다.‘접수 번호’는 개별 신청을 식별하는 고유 ID이며, ‘신청업체’는 해당 승강기 모델을 인증 신청한 기업 이름을 나타냅니다. ‘인증품목조합코드’는 모델에 적용된 품목의 조합을 의미하고, ‘수수료’는 해당 인증 건에 대한 기본 수수료 금액입니다. ‘정산금액’은 수수료 조정이나 환불 등을 통해 실제로 정산된 금액을 기록하며, 양수 또는 음수 형태로 나타납니다. ‘모델 명’은 인증 대상 승강기의 구체적인 제품 모델명을 포함하고 있으며, ‘메모’란에는 공장심사 생략 등의 특이사항이 기재될 수 있습니다.이 데이터는 신청 모델별 수수료 통계, 업체별 신청 분석, 정산내역 검토 및 인증 트렌드 분석에 유용하게 활용될 수 있습니다.
