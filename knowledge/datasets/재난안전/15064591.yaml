description_portal: 이 데이터는 1회성으로 제공되는 데이터로 2019년 12월 31일 기준 경찰청에서 집계한 지방청별 범죄소년 검거 인원 현황을 제공하는 공공데이터입니다. 각 시·도 경찰청별로 범죄소년의 검거 인원, 범죄 유형별 통계, 연령별 분포 등이 포함되어 있어 지역별 청소년 범죄 현황, 유형별 특징, 검거 실적을 분석할 수 있습니다. 이 데이터는 경찰의 청소년 범죄 예방 정책, 지역별 맞춤형 대응, 연구기관의 청소년 범죄 분석, 학교·지역사회 협력 프로그램 설계, 민간단체의 청소년 지원 사업 등에 활용됩니다.
