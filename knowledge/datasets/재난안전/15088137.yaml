summary_user: 서울시가 지진 등 대규모 재난 때 이재민이 임시로 머무는 시설(지진겸용)을 시설 한 곳당 한 행으로 담은 원장으로, 시설명·주소·시설면적·경위도 좌표를 포함한다. 시민이나 구청·재난 담당자가 '우리 동네에서 지진 후 임시로 머물 수 있는 시설은 어디이고 규모는 얼마인가'를 확인하거나 자치구별 시설 분포를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 법정동코드·행정동코드나 시군구명으로 행정구역 단위 통계와 맞추거나 좌표로 다른 대피·구호시설 데이터와 공간 결합해 이어 쓴다.
description_portal: 서울시 이재민임시주거시설(지진겸용) 데이터는 지진 등 대규모 재난 발생 시 이재민이 임시로 거주할 수 있는 시설의 위치와 규모를 제공하는 자료입니다. 시설번호, 시설일련번호, 수용시설명을 통해 각 시설을 식별할 수 있으며, 시도명, 시군구명, 법정동코드, 행정동코드, 도로명주소코드, 상세주소는 행정구역별 시설 분포와 정확한 위치 파악에 활용됩니다. 시설면적 정보는 수용 가능한 규모와 시설 활용도를 평가하는 데 유용합니다. 경도, 위도, X좌표, Y좌표는 지도 기반 서비스 구축, 내 주변 대피·임시거주시설 찾기, 이동 경로 안내, 접근성 분석 등에 활용될 수 있어, 재난 시 신속한 대피와 체계적인 이재민 보호를 위한 기초 자료로 활용됩니다.
