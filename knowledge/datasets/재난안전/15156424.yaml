summary_user: 한국승강기안전공단이 관리하는 승강기 설치 건물의 명칭·주소·경도·위도를 건물 한 곳당 한 행으로 담은 원천 파일이며, 전국 357,387행이 수신되었다. 지자체 담당자나 분석가가 지역별 승강기 설치 건물 분포를 지도에 올리거나 특정 지역에 설치 건물이 얼마나 있는지 확인하는 데 쓴다. 건물주소(address)와 경도·위도(coord) 키로 주소·좌표 기반 다른 데이터와 이어 쓰며, 같은 시설 안전 원장 부문의 승강기 고유번호 단위 자료와 연계를 검토할 수 있다.
description_portal: 이 데이터는 한국승강기안전공단이 관리하는 승강기 설치 건물의 위치 정보를 담은 자료로, 승강기가 설치된 각 건물의 명칭, 주소, 좌표(경도 및 위도)를 포함하고 있습니다. 각 행은 하나의 설치 건물에 대한 정보를 나타내며, 주요 필드는 ‘건물명’, ‘건물주소’, ‘경도’, ‘위도’로 구성되어 있습니다.‘건물명’은 승강기가 설치된 건물의 이름을 나타내며, ‘건물주소’는 행정구역 및 도로명을 기반으로 한 상세 주소 정보를 제공합니다. ‘경도’와 ‘위도’는 건물의 실제 위치를 좌표값으로 표현한 항목으로, 지도 기반 분석이나 위치 시각화에 활용할 수 있습니다.이 데이터는 승강기 분포 현황 분석, 지역별 승강기 설치 밀도 파악, 공간 기반 안전관리 계획 수립, 위치 기반 민원 대응 체계 구축 등 다양한 공공서비스 및 연구 목적으로 활용할 수 있습니다.
