summary_user: 용인시에 설치된 재난 CCTV를 지점(함체) 단위로 한 줄씩 담은 원천 목록으로, 통합관제지점명·중계채널명·운영 여부·용도·주소·위도·경도를 포함하며 범위는 용인시 한 곳이다. 시민이나 분석가가 "우리 동네 하천·취약지 주변에 재난 감시 CCTV가 어디에 있고 지금 운영 중인가"를 확인하거나, 지도에 올려 감시 공백 지역을 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 위도·경도를 기준으로 공간 결합해 쓰고, 재난 위험지역·대피시설 같은 재난안전 데이터와 겹쳐 본다.
description_portal: 본 데이터는 경기도 용인시 내에 설치된 재난 CCTV의 스트리밍 운영 현황을 제공한다. 주요 항목은 통합관제지점명, 중계채널명, 운영 여부, 지역, 주소, 용도, 함체번호, 위도, 경도, 데이터 기준일자 등으로 구성되어 있으며, 이를 통해 지역별 재난 감시망의 위치와 운영 상태를 체계적으로 파악할 수 있다. 본 자료는 재난 대응 체계 구축, 도시 안전 관리, 긴급 상황 모니터링 및 예방 활동 등에 활용되며, 위치 좌표를 포함하고 있어 공간 기반 분석과 GIS 활용에도 적합하다. 행정기관은 본 데이터를 통해 재난 취약 지역에 대한 CCTV 설치 현황을 점검하고, 추가 설치 계획이나 유지보수 전략 수립에 참고할 수 있다. 또한 연구자는 본 자료를 활용하여 도시 안전 정책, 범죄 예방, 재해 대응 시뮬레이션 등 다양한 분석을 수행할 수 있다. 시민은 데이터 공개를 통해 지역 내 안전 관리 체계와 재난 감시망 현황을 확인할 수 있으며, 이는 생활 안전에 대한 신뢰성을 높이는 데 기여한다. 본 데이터는 최신 기준일자를 반영하여 정기적으로 갱신되며, 공공데이터 개방을 통해 도시 안전 관리의 투명성과 활용도를 강화하고, 지속 가능한 재난 대응 및 안전한 생활환경 조성을 지원하는 것을 목표로 한다.
