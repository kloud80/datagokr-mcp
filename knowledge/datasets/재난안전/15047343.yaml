summary_user: 서울 119안전센터별 관할구역 공간정보를 안전센터 단위로 담으며, 고유번호·부서 식별값·센터명과 위경도(WGS1984) 좌표를 포함한다. 시민이나 분석가가 "우리 동네는 어느 119안전센터 관할인가", "안전센터 관할구역별로 화재 발생이나 소방용수 분포가 어떻게 다른가"를 따질 때 쓴다. 전역 조인 키는 없어서, 화재 발생 건별 자료나 소방용수 위치 원장과는 센터명·부서 코드 매핑이나 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: '119종합방재전산정보시스템의 안전센터관할 공간정보로 좌표(위경도)등의 정보를 제공하는 서비스 입니다.  ※ 서울의 모든 공간정보는 공간정보담당관(2133-2842)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)※ 제공부서 : 서울특별시 서울종합방재센터 전산통신과(02-726-2282)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
