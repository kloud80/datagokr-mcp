summary_user: 대구광역시 내 화학물질 취급 업체를 업체 1곳당 1행으로 담은 파일로, 업체명·우편번호·주소와 자체방재 대상 여부·자체방재 수립 여부가 들어 있습니다(CSV 약 118KB, 시도 범위·개별 주소 단위). 소방·안전 분석가가 '우리 구 안에서 자체방재 대상인데 아직 방재계획을 세우지 않은 화학업체는 어디인가'를 확인하는 데 쓰고, 활용신청 없이 내려받습니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소·우편번호를 매칭해서 잇습니다. 이 방식으로 위험물·유해화학물질 사업장 목록이나 대피시설 위치와 겹쳐 봅니다.
description_portal: 화학업체정보는 긴급구조표준시스템을 통해 수집된 데이터로, 대구지역 내 화학물질을 취급하는 업체의 위치, 관리 상태, 위험물 종류 등에 대한 정보를 담고 있습니다. 이 데이터는 화재 및 폭발 사고 예방, 유해물질 노출 방지, 긴급 출동 경로 설정 등에서 중요한 자료로 활용되며, 일부 정보만 포함된 상태이므로 실제 대응 시에는 추가 정보 확보가 필요합니다.* 본 자료는 긴급구조표준시스템에서 추출한 자료로 일부 정보만 포함되어 있음* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
