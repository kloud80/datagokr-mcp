summary_user: 인천광역시경찰청 관할 경찰서별·범죄분류별로 아파트연립·단독주택·노상·지하철·유원지·해상 등 20여 개 발생 장소의 범죄 건수를 집계한 표로, 건별 원천이 아닌 집계 통계이며 4.6KB 남짓의 CSV 파일로 받는다. 지역 치안 분석가나 지자체 담당자가 '인천의 어느 경찰서 관내에서 어떤 범죄가 주로 노상이나 주거지에서 발생하는가'를 파악해 취약 장소별 예방 대책을 세우는 데 쓴다. 전역 조인 키는 없어 경찰서 이름(경찰서)과 범죄분류 명칭을 맞춰 같은 기관의 범죄 발생·검거·112신고 통계나 다른 시도청의 장소별 통계와 이어 쓴다.
