description_portal: 경찰청 형사국 강력범죄수사과에서 제공하는 2018년부터 2024년까지의 5대 범죄(살인, 강도, 강간·강제추행, 절도, 폭력) 발생 건수 통계 자료입니다. 이 자료는 각 범죄 유형별로 지난 7년간의 발생 추이를 한눈에 보여줍니다.전반적인 추세는 대부분의 범죄가 2018년 대비 2024년에 감소하는 경향을 보입니다. 특히 강도와 폭력 범죄의 감소가 두드러집니다. 강도 범죄는 2018년 818건에서 2024년 457건으로, 폭력 범죄는 286,599건에서 219,798건으로 크게 줄었습니다.반면, 살인 범죄는 다른 범죄들과 다른 양상을 보입니다. 2018년 791건에서 2021년 652건까지 감소하며 안정세를 보이는 듯했으나, 이후 다시 증가하여 2024년에는 772건을 기록했습니다. 이는 2018년과 유사한 수준으로, 감소 추세가 역전된 것을 알 수 있습니다.절도와 강간·강제추행은 등락을 반복하는 모습입니다. 절도 범죄는 2021년 최저치(166,251건)를 기록한 후 다시 증가세를 보였고, 강간·강제추행도 2021년 이후 다시 늘어나는 경향을 보이다가 2024년에 소폭 감소했습니다.2024년 통계는 강도, 강간·강제추행, 절도, 폭력 범죄가 전년 대비 소폭 감소했으나, 장기적인 추세를 고려할 때 지속적인 관심이 필요해 보입니다. 이 자료는 치안 정책의 효과를 평가하고 미래 범죄 예방 대책을 수립하는 데 중요한 기초 자료로 활용될 수 있습니다.
