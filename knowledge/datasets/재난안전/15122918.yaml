summary_user: 경기도 산사태 취약지역 지정 현황을 시군(sigun_nm)별로 집계한 자료로, 산사태·토석류 취약지역 지정 개소 수, 지정 면적, 거주 인원, 대피장소 개소 수를 담는다. 도·시군 방재 담당자나 분석가가 '어느 시군에 산사태 취약지역과 그 안의 거주 인원이 많은데 대피장소는 충분한가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 이름을 매핑해서만 연결한다.
description_portal: 이 데이터는 경기도 내 산사태 취약지역 현황을 정리한 자료로, 집중호우나 태풍 등으로 인해 발생할 수 있는 산사태 및 토석류 피해 위험 지역을 파악하기 위해 구축되었습니다. 각 취약지역의 위치 정보와 함께 관리 현황이 포함되어 있어, 지역별 산사태 위험도를 평가하고 예방 대책을 수립하는 데 중요한 기초자료로 활용됩니다. 특히 토석류는 산사태 발생 시 토사와 암석이 빗물과 함께 하류로 급격히 흘러내려 큰 피해를 유발할 수 있기 때문에, 이 데이터는 주민 안전 확보와 재난 대응 역량 강화를 위한 핵심적인 자료라 할 수 있습니다.
