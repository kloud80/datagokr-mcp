summary_user: 충청북도 안의 교통약자 이용시설과 그 주변 교통사고 다발지역을 짝지어, 시설명·주소, 다발지점명·사고 종류·위경도, 시설과 지점 사이 거리(미터)를 행 단위로 담은 파일(csv, 약 1.6MB)이다. 지자체 교통안전 담당자나 분석가가 '어린이·노인·장애인 이용시설 가운데 반경 몇 미터 안에 사고다발지점이 있는 곳은 어디인가'를 가려 개선 우선순위를 정하는 데 쓴다. 전역 조인 키는 없어서, 다발지점 위경도로 경찰·도로 교통사고다발지역 표준데이터와 위치를 맞추거나 시설명·주소로 다른 시설 목록과 이어 쓴다.
description_portal: 충청북도 내 교통약자 이용시설과 해당 시설 주변의 교통사고 다발지역 간의 연관 정보를 매핑한 데이터로, 교통약자의 안전한 이동 환경 조성을 위한 분석 자료로 활용됩니다. 이 데이터는 노약자, 장애인, 어린이 등 교통약자가 주로 이용하는 시설과 그 인근의 사고다발지역을 연계하여 제공하며, 각 사고다발지역의 GPS 좌표(위도 및 경도)를 포함하고 있어 위치 기반 분석이 가능합니다. 또한 이용시설과 사고다발지점 간의 거리 정보를 함께 제공함으로써, 시설 접근 시 잠재적인 위험 요소를 사전에 파악할 수 있습니다. 이를 통해 지자체는 교통안전 취약지점을 우선적으로 개선하거나 시설 주변의 교통안전 대책을 수립하는 데 활용할 수 있으며, 교통약자 보호를 위한 정책적 대응과 시설 배치의 합리성을 높이는 데 기여합니다.
