description_portal: 본 자료는 한국승강기안전공단에서 수행하는 승강기 안전검사 과정 중 월마감이 해지된 이력을 기록한 데이터입니다. 승강기 안전검사는 정기·수시·정밀검사 등 다양한 형태로 진행되며, 검사 종료 후 결과가 확정되면 월 단위로 마감 처리됩니다. 그러나 검사 과정에서 발생한 입력 오류, 제원 오입력, 층수 변경 누락, 수시검사 구분 착오, 장비번호 잘못 입력, 전면교체·부분교체 구분 오류 등과 같은 사유로 이미 처리된 마감을 해지해야 하는 경우가 발생합니다. 본 데이터는 이러한 사유와 내역을 체계적으로 관리하기 위해 구축되었습니다. 데이터에는 대상연도, 대상월, 마감해지 일자, 마감해지 사유가 포함되어 있으며, 특정 연도·월에 대한 검사 결과 정정 사유와 시점을 명확히 확인할 수 있습니다.
