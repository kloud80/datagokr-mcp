summary_user: 국토안전관리원 특수교통합관리계측시스템이 관리하는 특수교량(현수교·사장교·아치교·트러스교 등)을 교량 한 건당 한 행으로 담은 CSV 목록이며, 교량명·교량코드·국도명·위치를 담는다(파일 크기 약 1.9KB의 소규모 목록). 시설 안전 분석가나 지자체 담당자가 '어느 국도에 어떤 특수교량이 있는가'를 확인하는 데 쓴다. 교량코드(special_bridge_cd)를 키로 같은 기관의 특수교량 계측·점검 데이터와 이어 쓴다.
description_portal: 국토안전관리원에서 특수교량을 관리하는 업무 중 해당 교량의 정보를 공개하는 데이터 입니다.특수교통합관리계측시스템에서 관리하는 특수교량에 대한 위치정보 및 국도정보가 포함된 CSV형식 파일데이터 입니다.해당 데이터의 컬럼은 교량명이 추가로 되었으며 교량코드, 국도명, 위치가 포함되어있습니다.특수교량이란 현수교, 사장교, 아치교, 트러스교 등 상부 구조를 특수한 가설 공법으로 시공하거나, 주탑과 케이블 등을 이용해 상판을 공중에 매단 형식이거나 교각 사이 거리가 50미터 이상인 긴 곡선 다리를 의미합니다.
