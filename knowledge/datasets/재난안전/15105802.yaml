description_portal: 재난 발생 시 신속한 자원 확보 및 지원으로 피해확산을 방지하고 대응에 필요한 자원을 현장 대응 중심으로 효율적 관리, 운영하고자 소방응원협정을 체결하고 있음.위 데이터는 2021년부터 응원협정 체결기관의 현황을 나타내는 것임. 정기적으로는 연도별 1회 현황관리를 실시하고, 각 소방서에서 필요시 수시로 협정체결을 하고 있음. 2025년 기관현황은 총 118개 기관이며, 장비현황에는 펌프차, 화학차, 물탱크, 구급차, 고가차, 굴절차, 굴착기, 견인차, 선박 등이 있음. 인원과 장비의 경우 매년 업데이트하기 때문에, 실제 현황과는 차이가 있음.
