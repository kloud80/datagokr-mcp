summary_user: 서울 마포구에 있는 민방위 비상급수시설을 시설별 인허가 건 단위로 담은 원장으로, 인허가일자·영업상태·폐업일자, 지번·도로명 주소, X·Y 좌표, 비상시설 위치, 시설구분이 들어 있다. 재난이나 단수 때 우리 동네에서 식수를 받을 수 있는 급수시설이 어디에 있고 지금도 운영 중인지 확인하려는 주민과 구청 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 대피·구호시설 데이터와는 개방자치단체코드(OGDP_INST_CD)나 주소·시설명 매핑, 좌표 기반 위치 대조로 이어 쓴다.
description_portal: 서울특별시 마포구에 설치된 민방위급수시설 인허가 정보에 대한 설명입니다. 이 데이터에는 각 급수시설의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 소재지면적, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 비상시설위치, 시설구분명, 그리고 이 급수시설을 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 시민과 관계 기관은 재난 또는 비상 상황에서 식수 확보가 가능한 민방위급수시설의 위치와 급수 가능 여부를 정확하게 확인할 수 있습니다.
