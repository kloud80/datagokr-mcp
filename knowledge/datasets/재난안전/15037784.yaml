summary_user: 부산 남구 관내에 설치된 폭염 대비 그늘막을 한 개씩 행으로 담은 시설 목록으로, 동·위치·설치일자·제조사·펼침지름이 들어 있다(CSV 약 5KB 규모). 주민이나 구청 담당자가 '우리 동 어느 횡단보도·정류장에 그늘막이 있고 언제 설치됐나', '그늘막이 부족한 동은 어디인가'를 확인할 때 쓴다. 전역 조인 키나 좌표 컬럼은 없어 행정동 이름으로 남구의 무더위쉼터 등 다른 대피·구호시설 자료와 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 「부산광역시 남구_그늘막 설치 현황」 데이터는 폭염으로부터 주민의 안전을 보호하기 위해 남구 관내에 설치된 그늘막의 위치 및 운영 정보를 체계적으로 관리한 자료입니다. 본 데이터에는 설치 위치(주소 또는 좌표)설치일자와 같은 주요 정보가 포함되어 있습니다. 이를 통해 하절기 보행자 안전 확보, 버스정류장·횡단보도·통학로 등 생활권 중심의 폭염 취약 구간 파악, 추가 설치 필요 지역 분석 등 정책적 의사결정에 활용이 가능합니다. 또한 그늘막 유지관리 계획 수립, 예산 편성, 도시환경 개선, 생활 안전 인프라 확충 등 남구의 폭염 대응 체계를 강화하는 데 기초자료로 활용됩니다.
