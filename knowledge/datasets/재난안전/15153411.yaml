summary_user: 국토안전관리원이 관리하는 시설물 수를 민간·공공 부문별로 나눈 전국 단위 집계 통계입니다. 필드 이름으로 보아 교량·터널·항만·댐·건축물·하천·상하수도·옹벽·절토사면·공동구 같은 시설물 종류별 수와 합계를 담고, 건별 원장은 아닙니다. 분석가가 "관리 대상 교량이나 터널 가운데 민간 소유와 공공 소유 비중은 얼마인가"를 볼 때 쓰며, 전역 조인 키가 없어 다른 시설 안전 데이터와는 시설물 종류 이름을 맞추거나 같은 기관 데이터끼리만 이어 씁니다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국토교통부 국토안전관리원에서 제공하는 민간 및 공공시설물 부문별 통계 정보입니다.\""
