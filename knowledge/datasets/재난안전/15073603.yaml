description_portal: 대전광역시는 공휴일 및 특정 시간대에 도심 내 주정차를 탄력적으로 허용하여 시민 편의와 지역 상권 활성화를 도모하고 있으며 이는 교통량과 시민 편의를 고려하여 특정 도로 구간에 대해 시간대별로 주정차를 허용하는 탄력적 주정차임. 주정차 허용이 되는 해당 구간은 도로명, 시점, 종점, 허용 구분(편측 또는 양측), 연장 거리, 허용 시간, 허용 일자, 비고(체육, 복지관, 공원, 종교 등)의 항목으로 구성되어 있음. 해당 시간대에 주차를 하더라도 허용을 하겠다는 의미이므로, 주차 지역의 탄력적 운영을 도모하며 교통 관련 연구기관 및 서비스개발을 통해 시민들의 교통 편의 증진에 기여할수 있도록 이 데이터를 제공함
