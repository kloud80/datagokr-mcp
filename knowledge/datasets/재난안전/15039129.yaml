description_portal: 본 데이터는 2026년 4월 30일을 기준으로 경찰청에서 관리하는 허가업종별 경비업체의 인원 규모별 현황을 집계한 통계입니다. 시설·호송·신변보호·기계·특수경비 및 혼잡교통경비업 등 총 6개 업종을 대상으로 하며, 업체 규모를 최소 1인에서 1,000명 이상까지 7개 구간으로 세분화하여 제공합니다.해당 통계는 특정 시점의 현황을 기록한 것으로, 과거 데이터를 소급하여 산출할 수 없는 단발성 시점 자료라는 점에 유의해야 합니다. 특히 '혼잡교통경비업' 항목은 2025년 1월 31일 관련 법령에 따라 신설된 통계로, 이전 시점과의 비교 분석 시 이를 고려해야 합니다. 업종별 인력 분포를 통해 국내 경비 산업의 구조와 규모를 파악할 수 있으며, 치안 정책 수립 및 민간 경비 산업 연구의 기초 자료로 활용 가치가 높습니다.
