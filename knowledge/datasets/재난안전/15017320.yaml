summary_user: 지방자치단체가 관리하는 보안등을 위치 단위로 담은 표준데이터로, 검증 시 50,000행을 받았고 주소·좌표가 개별 행으로 들어 있다. 시민이나 분석가가 우리 동네 보안등이 어디에 몇 개 설치돼 있는지, 설치 시기와 형태는 어떤지 확인하는 질문에 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)를 키로 CCTV, 안전비상벨 같은 다른 방범 시설 데이터와 위치 기준으로 이어 쓴다.
