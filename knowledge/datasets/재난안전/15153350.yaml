summary_user: 전국 사방시설(산사태·토사 유출을 막는 시설)의 안전점검 결과를 점검 건별로 담으며, 점검 시작·종료·완료일, 점검 세부 유형, 점검기관, 안전등급, 점검 내용과 후속 관리 조치를 포함한다. 지자체 담당자나 재난안전 분석가가 특정 기간에 어떤 사방시설이 어떤 안전등급을 받았고 후속 조치가 무엇이었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설 안전 데이터와는 점검기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 사방시설안전점검결과 정보입니다.\""
