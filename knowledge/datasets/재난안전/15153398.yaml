summary_user: 국토안전관리원이 관리하는 전국 절토사면 시설물을 시설물 번호 단위로 담은 원장으로, 시설물명·위치·관리주체·종별·주요 제원·준공일과 상태등급, 최근·차기 정밀점검·진단일, 전경·정면 사진 정보를 건별로 제공한다. 지자체 안전 담당자나 도로·건설 분야 분석가가 '우리 지역 절토사면 중 상태등급이 낮고 차기 점검일이 임박한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시설물 안전 데이터나 재난 위험지역 데이터와는 시설물 번호(FCLTY_NO)·시설물명·위치 문자열 매칭으로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국토교통부 국토안전관리원에서 제공하는 절토사면 안전점검 관련 정보입니다.\""
