description_portal: '한국가스안전공사는 도서, 산간 등 원거리 지역 가스 사고 발생시 신속한 초동조치로 골든타임 확보, 가스 관련 민원에 효율적으로 대응하기 위해 민간 전문가로 구성된 가스안전보안관 제도를 운영하고 있습니다.해당 목록은 최근 3년간 가스안전보안관이 가스 사고 신고접수를 통해 출동한 내역을 제공하고 있습니다.본 데이터는 신고 접수지사 및 일시, 처리지사, 조사구분, 처리현황 정보가 수록되어 있으며, 통계 분석 및 가스 안전관리 고도화 등에 활용할 수 있습니다.※ 해당 목록은 현행 임기종료 등에 따른 보안관에서 해임된 자, 기타 처리유형(단순민원, 오인신고 등)에 대한 정보를 기준으로 제공됩니다.* 보안관업체 현황 등 상세정보는 한국가스안전공사 홈페이지(www.kgs.or.kr)에서 참조※ 데이터 기준일 : 2024년 12월 31일'
