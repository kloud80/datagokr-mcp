description_portal: 경찰청 형사국 강력범죄수사과에서 제공하는 4대 강력범죄 발생건수 통계입니다.2018년부터 2024년까지의 4대 강력범죄 발생 건수를 살펴보면, 절도가 가장 높은 비중을 차지하며, 그 뒤를 이어 폭력 발생 건수가 많았습니다. 살인과 강도는 상대적으로 발생 건수가 적은 편입니다. 전반적으로 폭력 발생 건수는 2021년에 크게 감소한 이후 소폭 등락을 반복하고 있습니다. 절도 발생 건수는 2021년까지 감소하는 추세를 보이다가 2022년부터 뚜렷하게 증가하는 양상을 나타냅니다. 살인 사건은 2021년에 가장 적게 발생한 이후 다시 증가했으며, 강도 사건은 전반적으로 감소하는 추세를 보입니다. 최근 절도 범죄의 증가에 대한 주의가 필요해 보입니다.
