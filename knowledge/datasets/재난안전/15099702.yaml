description_portal: 이 데이터는 경찰청에서 일회성으로 제공하는 지문 등 사전등록 현황 자료로서, 0~17세 미만 아동 및 청소년의 지문 등 사전등록 현황을 연령대별로 상세히 기록하고 있다. 데이터는 구분, 0세-7세, 8세-17세미만, 비고 항목으로 구성되며, 각 연령대별 대상자 수와 등록 실적을 포함한다. 이를 통해 아동·청소년의 사전등록 현황을 파악하고, 실종 및 유괴 등 사건 발생 시 신속한 신원 확인 및 보호 활동을 지원하는 경찰의 예방적 조치에 유용하게 활용될 수 있다. 특히 연령별 등록 현황을 분석하여 등록률 제고 및 경찰의 아동·청소년 보호 정책 수립에 기여하며, 국민 안전을 강화하기 위한 기초자료로 중요하다. 본 데이터는 경찰 및 관련 기관에서 아동·청소년 안전 관리, 보호 정책 개선, 예방 활동 강화 등을 위해 활용할 수 있는 필수 자료이다.
