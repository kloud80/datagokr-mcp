description_portal: 이 데이터는 경찰청이 2014년부터 2018년까지 집계한 즉결심판 청구유형 및 선고결과 현황을 정리한 자료로, 연도별 즉결심판 청구 건수, 죄종별(경범, 특별법범, 형법범) 건수, 심판 결과별(구류, 벌금, 과료, 청구기각, 무죄, 선고유예 및 형면제, 면소 및 공소기각) 건수를 포함한다. 데이터는 연도별 청구유형과 선고결과를 기록하여 즉결심판 운영과 처리 현황을 분석하고 정책 수립에 기여한다. 경찰청은 즉결심판 처리 변화와 경향을 파악하고, 법 집행 공정성과 효율성을 높이기 위한 자료로 활용한다. 데이터는 공공데이터포털을 통해 개방되며, 연구 및 정책 참고자료로 제공된다. 본 자료는 즉결심판제도 개선과 법 집행 신뢰성을 높이는 기반자료로 중요한 의미를 가진다.
