description_portal: '1. 해당 데이터는 김해동부소방서 관내 수난구조인명구조함에 관한 자료로, 관리부서, 설치지역, 위치, 설치년도 등에 대한 데이터를 제공합니다.2. 수난구조인명구조함은 수상(水上)에서 인명 구조가 필요할 때 누구나 쉽게 사용할 수 있도록 구명조끼, 구명튜브, 구명줄 등 구조 장비를 보관·관리하는 설비입니다. 주로 호수, 저수지, 하천, 해수욕장 등 사고 위험이 높은 지역에 설치되어, 긴급 상황에서 신속한 구조 활동을 지원합니다. 3. 수난구조인명구조함의 주요 구성 및 사용법주요 장비: 구명조끼, 구명튜브, 구명줄 등 설치 장소: 호수, 저수지, 하천, 해수욕장, 수변공원, 낚시터, 교량 아래 등 익수 사고 위험이 높은 곳 사용 방법:구조자는 구명조끼를 착용합니다.구명튜브를 꺼내어 사용합니다.구명줄과 구명튜브를 연결해 물에 빠진 사람을 구조합니다.'
