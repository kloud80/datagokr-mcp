summary_user: 국토안전관리원이 관리하는 지하도상가 시설물 수를 종별(행)과 시도별(열)로 집계한 전국 통계표로, 건별 원장이 아닌 308바이트 크기의 작은 CSV 집계 파일이며 포털 설명상 2025년 12월 31일 기준이다. 어느 시도에 지하도상가 시설물이 얼마나, 어떤 종별로 분포하는지 확인하려는 분석가나 지자체 안전 담당자가 지역별 관리 대상 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도 이름을 행정구역 코드에 매핑하거나 같은 기관의 다른 시설물 통계와 시도명 기준으로 맞춰 이어 쓴다.
