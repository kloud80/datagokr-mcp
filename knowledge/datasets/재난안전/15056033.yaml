summary_user: 제주시 관할 붕괴위험 급경사지를 지구별로 한 줄씩 담은 지정 현황 파일로, 지역명·위치(지번)·위험도 등급·지정면적(㎡)·지정고시일·정비 추진상황·사업비(백만원)·담당부서를 포함하며 CSV 전체 크기가 382바이트에 불과한 소규모 목록이다. 제주시 주민이나 방재 담당자가 '우리 동네 근처에 붕괴위험지역으로 지정된 급경사지가 있는지, 정비가 어디까지 진행됐는지'를 확인하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 재해위험지구·급경사지 데이터와는 지역명·지번 같은 이름 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 제주특별자치도 제주시에서 관리하는 붕괴위험 급경사지 지정 현황 데이터는 제주시 관할 구역 내에서 집중호우나 태풍 등으로 인해 붕괴 발생 우려가 높아 체계적인 관리가 필요한 급경사지 정보를 제공합니다. 본 데이터는 급경사지의 명칭을 나타내는 지역명(지구명), 구체적인 행정구역과 지번을 포함한 위치, 재해 위험성에 따라 분류된 위험도 등급, 관리 대상의 규모를 나타내는 지정면적, 그리고 현재 정비나 보강이 어떻게 진행되고 있는지 보여주는 추진상황 등의 지역 주민의 안전 도모와 방재 대책 수립을 위한 기초 자료로 활용됩니다.
