description_portal: 시흥도시공사는 「시설물의 안전 및 유지관리에 관한 특별법」에 따라 대상시설물에 대한 안전점검을 매년 정기적으로 실시합니다. 신규 시설이 생길 경우 이를 현행 점검대상에 즉시 반영하며, 점검은 상반기와 하반기로 나누어 연 2회 진행됩니다. 점검시설에는 공원, 주차장, 복지시설 등 시민 생활과 밀접한 주요 건축물과 구조물이 포함됩니다. 노후 시설에 대해서는 정밀진단과 별도 특별점검을 시행해 안전취약요인을 선제적으로 관리합니다. 점검유형은 정기점검, 정밀점검, 기계설비 성능점검 등으로 구분되어 전문위원의 자문을 받으며 체계적으로 이뤄집니다. 최근 회의에서는 시설 마감재 붕괴 등 동종사고 방지대책, 건물안전관리 강화방안 등이 핵심 논의 안건으로 다뤄졌습니다. 점검 결과 등급이 부여되며, D등급(보수·보강 필요), E등급(위험·사용제한 필요) 지정 시 신속한 유지보수와 안전조치가 이루어집니다. 시설물 유지관리를 위해 현장근로자 건강장해 예방 및 재난대비 훈련도 계획에 포함되어 있습니다. 관리데이터는 공공데이터포털을 통해 파일·오픈API 형식으로 공개되어 투명하게 관리됩니다. 종합적으로 공사는 시민의 안전을 최우선으로 하며 전문성·지속가능성을 반영하여 시설물 안전관리를 실천하고 있습니다.
