description_portal: 통영시 도시정보시스템에서는 석축옹벽의 현황을 정확하게 파악하고 효율적으로 관리하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 옹벽의 위치와 식별이 가능하며, 관리기관과 도로구간번호는 행정적 관리와 유지보수를 위한 근거 자료로 활용됩니다. 또한 재질, 연장, 폭원, 최대·최소 높이 등 구조적 특성을 담아 실제 현장 점검과 안전 진단에 필요한 구체적인 정보를 제공합니다. 이러한 데이터는 석축옹벽의 안전성 확보와 체계적 관리에 중요한 기반 자료로 사용됩니다.
