summary_user: 밀양소방서가 중점관리대상물로 지정한 밀양시 내 대규모 점포·종합병원·요양병원·호텔·공장·창고 등 화재 취약 대상을 대상별 한 행으로 담은 목록이며, 지역·대상명·위치·면적·용도로 구성된 작은 CSV 파일(833바이트)이다. 밀양 지역 주민이나 사업자, 소방 분석가가 '밀양시에서 소방서가 중점 관리하는 큰 건물은 어디이고 어떤 용도인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드가 없어 다른 데이터와는 대상명·주소 문자열 매칭이나 같은 기관(경상남도·소방) 데이터와의 이름 대조로만 이어 쓴다.
