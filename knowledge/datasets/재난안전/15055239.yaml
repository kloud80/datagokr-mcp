description_portal: '광주광역시 동부소방서 관내 특별조사대상에 대한 데이터로 동부소방서 관할 소방특별조사대상을 119안전센터별로 구분한 자료를 설명합니다.소방특별조사는 불특정 다수의 시민이 이용하거나 대형 화재로 이어질 위험이 큰 건축물·시설을 대상으로 실시하는 정밀 점검입니다. 일반 점검보다 더 세밀하게 소방시설, 피난·방화 관리 상태를 확인해 안전 취약 요인을 사전에 차단하는 것을 목표로 합니다. 쉽게 말해, “대형 화재를 막기 위한 집중 안전검진”이라 할 수 있습니다.동부소방서 관내에는 다양한 소방특별조사대상 시설이 존재합니다.다중이용시설: 전통시장, 대형 상가, 학원, 공연장 등 사람들이 많이 모이는 곳노유자 시설: 요양원, 어린이집, 병원처럼 스스로 대피하기 어려운 사람들이 많은 곳산업시설: 공장, 물류창고 등 대형 화재로 확대될 가능성이 높은 곳지하 및 고층 건축물: 대피가 어려운 구조를 가진 시설이러한 건물들은 화재 발생 시 피해 규모가 크고 대피가 어려우므로 특별 관리가 필요합니다.이 데이터는 동부소방서 각 119안전센터 내에서 관리하는 업종별 수량에 대한 정보를 제공합니다.'
