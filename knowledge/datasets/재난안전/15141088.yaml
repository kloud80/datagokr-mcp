description_portal: '경기도 평택시 내 산사태취약지역에 대한 데이터로 취약지역유형, 지정위치, 지정면적, 지정일자 등을 제공합니다.태풍 및 집중호우 시 인명, 가옥, 농경지 등의 피해가 우려되는 지역과 경사가 급하고 풍화암, 마사토 지형, 수목이 없는 무임목지, 집중호우로 지반이 약해진 급경사지, 대형 산불 피해지 등을 포함한 산사태취약지역 지정현황입니다. 해당 자료는 산사태위험지역을 체계적으로 관리하고, 취약지역에 대한 정비 및 예방 조치를 위한 기초자료로 활용되며, 산사태 피해 저감 정책 수립에 활용됩니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※문의 : 평택시 산림녹지과(031-8024-4251)'
