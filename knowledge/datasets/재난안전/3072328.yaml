description_portal: 2025년 7월 22일 기준, 범죄예방대응국 범죄예방정책과에서 발표한 경비업체 현황에 따르면 전국적으로 총 4,224개의 경비업체가 운영 중입니다. 지역별로는 서울청이 1,349개 업체로 가장 많아, 국내 경비산업의 중심임을 보여줍니다.주요 경비 서비스 중 '시설경비'는 대부분의 업체가 제공하는 가장 보편적인 서비스입니다. 주목할 점은 2025년 1월 1일 신설된 '혼잡교통유도경비' 업무가 빠르게 정착되고 있다는 것입니다. 서울에서만 145개 업체가 이 서비스를 제공하며, 이는 기존 5가지 경비업무(시설, 호송, 신변보호, 기계, 특수)에 더해진 새로운 경비 수요를 반영합니다. 반면, '호송경비'는 상대적으로 적은 업체가 제공하는 것으로 나타났습니다.
