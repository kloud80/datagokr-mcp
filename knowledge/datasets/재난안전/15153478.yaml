summary_user: 재난배상책임보험 대상 시설을 시설 한 건씩 담은 전국 단위 데이터로, 업종 구분, 건물·상호명, 도로명주소와 시도·시군구·읍면동, 의무보험 대상 여부와 보험기간 해당 여부 같은 항목이 필드 목록에 있다. 우리 동네 음식점·숙박시설 같은 다중이용 업소가 재난배상책임보험 의무가입 대상인지, 보험기간 안에 있는지 확인하려는 주민·사업자·지자체 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 시설 안전 데이터와는 도로명주소·법정동코드로 보이는 필드(STDG_CD)·시설명을 맞춰 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 재난배상책임보험에 대한 관련 정보입니다.\""
