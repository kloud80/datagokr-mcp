description_portal: 본 자료는 「승강기안전관리법」에 근거해 운영되는 승강기 교육의 기본정보와 개설 현황을 정리한 데이터입니다. 공단 본부·지역본부·컨소시엄 등 교육기관에서 제공한 교육의 구조와 편제를 일목요연하게 확인할 수 있도록 표준화된 항목으로 구성되었습니다. 데이터는 크게 ① 개설정보(교육기관, 과정분류, 과정명, 차수, 교육 시작·종료일자), ② 과목정보(과정대분류, 과목명), ③ 기본정보(과정대분류·중분류·과정명), ④ 교육설문(과정명, 질문내용, 응답유형), ⑤ 교육장소(교육기관, 교육장명, 주소)로 구분됩니다. 과정분류에는 법정교육, 안전교육, 전문기술인력교육, 컨소시엄, 내부·직원·산업안전교육 등이 포함되며, 과목은 관계법령, 구조·원리, 설치·검사 기준, 자체점검, 시퀀스 제어, 진동·소음, 이용자 안전 등 실무 중심 주제로 구성됩니다. 개설정보에는 차수별 일정이 기록되어 연도·기관·유형별 교육 편성 현황을 비교할 수 있고, 교육설문에는 만족도·교재·시설 평가 등 항목이 표준화되어 있습니다. 본 자료는 승강기 교육 체계와 과정 편성의 범위를 체계적으로 보여주는 기초 정보로서, 온·오프라인 교육장 주소와 기관별 운영 현황을 함께 제공합니다.
