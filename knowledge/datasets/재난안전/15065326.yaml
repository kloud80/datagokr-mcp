summary_user: 경남소방본부 소속 119구조대와 119안전센터 한 곳당 한 행으로, 소방서명·센터명·도로명/지번 주소·WGS84 위경도 좌표와 담당 읍면동 관할구역을 담은 개별 시설 원장입니다. 우리 동네(읍면동)를 담당하는 119안전센터가 어디이고 얼마나 떨어져 있는지 확인하거나, 분석가가 센터 위치와 관할 범위를 지도에 올려 소방 서비스 공백 지역을 살피는 데 쓴다. 전역 조인 키는 없어 관할구역의 읍면동명이나 시군명을 이름으로 맞춰 행정구역 자료와 잇고, 좌표로 화재 발생·소방용수 위치 같은 다른 소방 데이터와 공간 결합해 쓴다.
description_portal: <데이터 수집목적 및 과정>경남소방본부 119구조대 및 119안전센터 주소와 위치 좌표(WGS84), 그리고 각 센터의 읍면동 단위 관할구역 정보를 제공합니다. 이 데이터는 소방 관련 데이터 분석 등 다양한 행정 및 공공 목적에 활용될 수 있습니다. 소방 관서의 위치와 관할을 쉽게 확인할 수 있도록 경남소방본부에서 필요 시 갱신합니다.<데이터 구성 및 세부항목>데이터는 소방서명, 119구조대/119안전센터명, 주소, 좌표(WGS84 위도·경도), 관할 읍면동명 등으로 구성되어 있습니다. 각 소방서 및 센터별로 실질적으로 담당하는 지역 단위(읍·면·동)가 명확히 표기되어 있어, 지역별 소방서비스 이용 현황 분석 및 정책 자료로 활용이 가능합니다.<데이터 기준 시점>해당 데이터는 2023년 12월 말 기준 데이터입니다.
