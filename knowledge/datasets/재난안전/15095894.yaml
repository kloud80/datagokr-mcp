status: active
summary_user: 대구광역시 북구가 관리하는 급경사지(택지·도로·공원 등에 딸린 자연·인공 비탈면과 접한 산지)를 한 곳씩 위치(상세주소)·지번주소·관리 부서·위험 등급(A~D, D로 갈수록 위험)과 함께 담은 시군구 단위 개별 목록이다. 주민이나 안전관리 담당자가 '우리 동네 근처에 위험 등급이 높은 급경사지가 있는가, 담당 부서는 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 지번주소(ADRES)를 주소·좌표로 변환하거나 이름을 맞춰 다른 재해위험지구·대피시설 데이터와 겹쳐 본다.
limits: 대구 북구 관할만 담고 있어 다른 시군구나 전국 현황은 이 데이터로 볼 수 없다. 주기적으로 갱신되기보다 한 번 만들어진 뒤 바뀌지 않는 이벤트성 데이터로 분류돼 있으므로, 최신 등급 변동 여부는 별도로 확인해야 한다. 공통 코드 키가 없어 다른 데이터와 잇기 위해서는 주소 매칭이 필요하다.
