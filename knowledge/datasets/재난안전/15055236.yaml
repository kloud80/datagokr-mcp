summary_user: 광주광역시 남구를 관할하는 남부소방서의 특정소방대상물 수를 업종 구분별·119안전센터(송하·월산·봉선·대촌)별로 집계한 작은 파일(약 855바이트)이며, 건별 대상물 목록이 아닌 개수 집계표다. 소방 행정 분석가나 지역 안전 담당자가 남구 안전센터 관할별로 공동주택·근린생활시설·공장 같은 특정소방대상물이 얼마나 분포하는지 비교할 때 쓴다. 전역 조인 키가 없어 다른 소방서의 같은 형식 현황표나 화재 발생·소방용수 데이터와는 안전센터 이름이나 업종 구분 이름을 맞춰서만 이어 쓴다.
description_portal: <2026.2.3.기준>소방시설 설치 및 관리에 관한 법률 시행령 제5조(특정소방대상물)에 의거 분류되는 특정소방대상물 정보광주광역시 남부소방서 특정소방대상물 데이터를 제공합니다.관할 소방서별 31개 업종으로 분류되는 대상물의 개수를 제공합니다.(광주광역시 남구)공동주택, 근린생황시설, 문화및집회시설, 종교시설, 판매시설, 운수시설, 의료시설, 교육연구시설, 노유자시설, 수련시설운동시설, 업무시설, 숙박시설, 위락시설, 공장, 창고시설, 위험물저장시설, 항공기 및 자동차 등
