summary_user: 전국의 지진해일 긴급대피장소를 장소 한 곳씩 담은 원장으로, 대피장소명·수용인원·해발고도·사용여부·도로명주소와 경도·위도 좌표를 포함한다. 해안 지역 주민이나 지자체 방재 담당자가 '해일이 오면 가장 가까운 높은 대피장소는 어디이고 몇 명을 받을 수 있나'를 확인하는 데 쓴다. 전역 조인 키는 실측되지 않아, 다른 대피시설·재난 데이터와는 지역코드(ARCD)나 도로명주소코드 같은 코드 매핑, 또는 위경도 좌표 기반 공간 결합으로 이어 쓴다.
