description_portal: 이 데이터는 한국남부발전 전 사업장에서 관리되는 PSM(Process Safety Management) 대상물질 현황을 정리한 자료입니다. 각 사업소별로 사용되는 대상물질의 종류와 주요 용도를 확인할 수 있으며, 연료유, 수소, 암모니아, 염산, 천연가스 등 발전소 운영 과정에서 활용되는 다양한 화학물질이 포함되어 있습니다. 예를 들어, 수소는 발전기 냉각용으로, 암모니아는 탈질설비 환원제로 사용되며, LNG는 가스터빈 주연료로 활용됩니다. 본 자료는 발전소 운영에서 안전관리가 필요한 주요 물질의 현황을 파악할 수 있도록 하여, 공정안전관리 체계 구축과 위험물 관리 정책 수립에 중요한 기초자료로 활용될 수 있습니다. 또한 산업안전 강화를 통한 재해 예방과 친환경적 설비 운영 방안을 마련하는 데에도 참고할 수 있는 유용한 데이터입니다.
