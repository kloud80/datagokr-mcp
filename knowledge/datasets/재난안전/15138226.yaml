description_portal: 한국승강기안전공단에서 민원인 안내·통지에 활용하는 전자민원서식의 등록 이력을 정리한 자료입니다. 각 행은 서식제목, 사용여부, 등록일자 등 기본 메타정보로 구성되며, 정기·정밀안전검사 안내, 안전부품 설치·이행 관련 통지, 안전관리자 교육 안내, 보험·환불·연장 신청 등 민원 절차 전반에서 사용되는 공문 형식의 안내·신청 서식을 포함합니다. 본 데이터의 목적은 전자서식의 생성·변경·활성화 상태를 체계적으로 관리해 민원 서비스의 일관성·정합성을 확보하고, 각 서식의 적용 시점과 현행 여부를 추적하는 데 있습니다. 제공 범위는 공단 시스템에 등록된 서식 단위 기록(메타데이터)이며, 파일 본문, 버전 이력, 배포 채널, 담당부서, 수신 대상 등 추가 정보는 별도 관리 체계에 존재할 수 있습니다. 동일 제목의 개정본이 별도 행으로 존재할 수 있고, 일부 항목은 예시로 제시된 것으로서 전체 규모나 분포를 대표하지 않습니다. 개인정보는 포함하지 않으며, 법령·내부지침에 따라 식별정보는 제한·관리됩니다.
