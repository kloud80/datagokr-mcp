description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘국가안전대진단 점검결과’ 데이터는 서귀포시 관내 다중이용 시설, 교량, 복지·공공시설 등을 대상으로 실시한 국가안전대진단 결과를 정리한 공공데이터입니다.데이터는 회차, 점검분야, 시설명, 소재지, 점검결과, 조치계획, 비고 및 데이터 기준일자 등을 항목으로 포함하며시설별 정밀 점검 결과와 후속 조치 계획을 체계적으로 제공하므로 재난예방 안전 정책 수립, 시설 관리 및 개선 우선순위 결정, 행정의 책임성과 투명성 확보에 활용할 수 있습니다.또한 시설별 안전 등급 분류, 위험요소 지도화, 점검 회차 추이 분석, GIS 기반 모니터링 체계 구축 등에도 유용합니다.서귀포시 안전 담당 부서나 재난관리 기관, 시민 안전 단체, 연구기관 등에서 실무 및 행정 계획 수립 자료로 사용할 수 있는 핵심 안전 정보입니다.
