description_portal: 경찰청 대전광역시경찰청(대전중부경찰서, 대전동부경찰서, 대전서부경찰서, 대전대덕경찰서, 대전둔산경찰서, 대전유성경찰서)에서는 교통사고율 증가하는 것에 대한 대책 수립 및 활용이 증가함에 따라,  대전광역시 기준, 시간대별 보행자 사망자 부상자 통계(2020년, 2021년, 2022년, 2023년, 2024년,2025년 6년간 통계)를 제공합니다. 본 데이터는  사고 발생 시간을 기준으로 사망자와 부상자 수를  집계하여,  특정 시간대의 보행자 교통사고 발생 위험도를 파악하는 기초 자료이며 보행 사고발생 시간대에 따른 부상자와 사망자 건수를 통해 교통사고 발생 예방 정책 수립 및 연구자료로 활용할 수 있습니다.
