description_portal: 이 공공데이터는 강원도 내 즉결심판 대상 사범(즉심사범)에 대한 연도별 처리 청구 현황을 정리한 자료로, 2019년부터 2024년까지의 데이터를 포함하고 있습니다. 항목은 경범죄, 특별법 위반 사범, 형법 위반 사범으로 구분되어 있으며, 각 범주별로 처리된 건수를 확인할 수 있습니다. 해당 데이터는 사법 행정의 실태를 파악하고, 경미범죄에 대한 처리 경향을 분석하는 데 유용합니다. 지방자치단체나 사법기관, 경찰청 등에서는 지역 내 법질서 유지 정책 수립이나 즉결심판 제도의 운영 개선에 활용할 수 있으며, 법학 연구기관이나 시민사회단체에서도 범죄 유형별 사법 처리 실태를 분석하는 기초자료로 사용할 수 있습니다.
