summary_user: 행정안전부 재난안전데이터 공유플랫폼이 제공하는 인명구조함 관련 선(line) 형태 정보로, 범위는 전국입니다. 시설물관리번호(THINGS_MNG_NO), 선·점 공간 일련번호, 시설물 종류·구성요소 코드, 변경일자, 도형(GEOM) 컬럼을 담습니다. 지자체 안전관리 담당자나 분석가가 전국의 인명구조함 관련 시설이 어디에 어떻게 기록되어 있는지 확인할 때 쓰고, 전역 조인 키가 없어 같은 플랫폼의 대피·구호시설이나 시설 안전 데이터와는 이름·코드 매핑 또는 같은 기관 코드로만 잇습니다.
