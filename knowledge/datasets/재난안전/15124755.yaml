summary_user: 시설물안전법 적용 대상인 전국 지하차도를 시설 1건 단위로 담은 CSV 원장으로, 시설물명·종별(대부분 1종)·관리주체 구분(공공·민간)·구조 형식·연장·차로 수 같은 구조 정보와 행정구역 위치를 담는다. 지자체 담당자나 분석가가 "우리 시·군에 법정 안전점검 대상 지하차도가 몇 곳이고 공공·민간 중 누가 관리하나" 같은 질문에 답하거나 침수 대비 점검 목록을 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 시설 안전 데이터나 침수 위험지역 데이터와는 시설물명이나 위치(행정구역명)를 문자열로 맞춰 이어 써야 한다.
description_portal: "전국의 지하차도 중 시설물안전법 적용 대상 지하차도에 대한 기본 정보 현황1. 형식: CSV2. 내용 요약■ 순번(No): 각 지하차도 시설의 고유 일련번호■ 시설물명: 지하차도의 명칭 (예: 원당지하차도, 남태령지하차도 등)■ 시설물구분: 해당 시설의 분류로서 대부분 '터널'로 기재됨■ 시설물종류: '지하차도'로 분류된 터널의 용도■ 종별: 구조물의 등급을 나타내며, 대부분 '1종'으로 기재■ 관리주체구분: '공공' 또는 '민간' 등 해당 시설을 관리하는 기관의 성격■ 항목명: 구조 형식(박스형 등), 연장(길이), 차로 수 등의 시설 구조 정보■ 위치: 해당 지하차도가 위치한 행정구역 (예: 경기도 고양시)3. 활용 예제■ 지자체 및 정부 기관의 지하차도 유지관리 및 정기 안전 점검 대상 목록 구축■ 도시계획 및 도로 인프라 개선을 위한 우선 정비 지역 선정■ 침수 및 붕괴 위험 대비를 위한 재난 대응 체계 수립 및 활용"
