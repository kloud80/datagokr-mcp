summary_user: '광주광역시 북부소방서 관할에서 2025년 1월 1일부터 8월 31일까지 발생한 화재 출동 102건을 주거시설·판매시설·차량·임야 등 16개 장소 구분별 건수로 집계한 통계 파일입니다. 지역 안전 분석가나 주민이 북부소방서 관할에서 어떤 장소에서 화재가 가장 많이 나는지(예: 주거시설 38건, 차량 10건)를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방서의 같은 형식 장소별 통계와는 장소 구분 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.'
