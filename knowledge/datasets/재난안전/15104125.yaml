description_portal: '해당 통계는 "수상에서의 수색, 구조 등에 관한 법률"을 근거하여 작성 및 관리되고 있음. 조난사고란 수상에서 사람의 생명, 신체 또는 선박 등의 안전이 위험에 처한 상태라고 정의하고 있으며, 선박의 기준은 선박법에 정의된 선박 중에서 기선, 범선, 부선으로 정하여 통계 집계함. 해상조난사고는 선박의 운용과 관련하여 발생한 사고 의미로 구조기관별 대응 인원을 나타냄, 구조(원조)기관이 2개 이상의 다수인 경우 5개 기관까지 등록하고있음 * 구조기관 : 해양경찰, 민간해양구조대(해양재난구조대), 어선, 해군, 자력, 기타'
