summary_user: 전기설비 구분(일반용·자가용·사업용·미상)별로 발생한 전기화재 건수를 연도별로 집계한 전국 단위 통계로, 포털 설명상 2016~2024년을 담은 작은 CSV 파일이다. 전기안전 정책 담당자나 분석가가 '전기화재는 주로 일반용 설비에서 나는가, 자가용·사업용 설비 비중은 해마다 어떻게 변하는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 기준으로 나란히 비교하거나, 같은 기관(한국전기안전공사)의 다른 전기재해 통계와 이름으로 맞춰 이어 쓴다.
