summary_user: 전국의 지역 재해위험지구를 지구별로 담는 원천 목록으로, 관리번호·지구명·등급·유형·지정일과 지정사유·해제일과 해제사유·피해주기·거주 세대와 인원·사상자 수 등을 포함한다. 주민이나 지자체·부동산 분석가가 '이 지역에 지정된 재해위험지구가 있고 등급과 지정 사유는 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 지구명·시설명 같은 이름이나 지역코드(DST_RSK_DSTRCT_RGN_CD)를 매핑해 붙이고, 대피·구호시설이나 토지 규제 레이어 같은 위험지역 자료와 함께 본다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지역 재해 위험지구 정보로, 재해위험지구관리번호, 재해위험지구명, 재해위험지구등급코드, 재해위험지구유형코드, 상세유형코드, 시설명, 지정사유, 해제일자, 해제사유, 피해주기 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
team:
