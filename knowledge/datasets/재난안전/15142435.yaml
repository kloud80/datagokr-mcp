description_portal: 인천광역시 급경사지 현황 목록 공공데이터는 관내 급경사지의 안전 관리와 재해 예방을 위해 제공되는 자료입니다. 데이터는 번호, 시도, 시군구, 관리번호, 급경사지명, 위치, 시행청명, 관리주체구분, 재해위험도 평가구분, 진행단계, 소관부서명 항목으로 구성됩니다. 번호는 데이터 식별을 위한 기본 값이며, 시도·시군구는 행정구역을 나타냅니다. 관리번호는 각 급경사지의 고유 식별 코드로 활용되고, 급경사지명과 위치는 해당 지형의 명칭과 좌표·주소 정보를 제공합니다. 시행청명과 관리주체구분은 해당 급경사지를 관리·운영하는 기관을 명시하며, 재해위험도 평가구분은 위험 등급을 통해 안전성을 판단합니다.
