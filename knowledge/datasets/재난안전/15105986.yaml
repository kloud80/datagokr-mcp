description_portal: 「화재의 예방 및 안전관리에 관한 법률 시행령」 별표 2에 따른 특정소방대상물 중 판매시설의 전통시장 현황을 업로드 하여 데이터 개방인천광역시 전통시장 및 소방시설 현황 공공데이터는 지역 내 전통시장의 분포와 안전 관리 인프라를 함께 제공하는 자료입니다. 주요 항목에는 시장명과 위치(주소)를 통해 각 전통시장의 정확한 위치를 확인할 수 있으며, 소방시설 현황을 통해 화재 예방 및 대응을 위한 안전 장비 설치 여부를 파악할 수 있습니다. 소방시설에는 소화전, 소화기, 스프링클러 등 기본 안전 장치가 포함되며, 시장별 설치 현황을 기록하여 위험 요소를 관리합니다.
