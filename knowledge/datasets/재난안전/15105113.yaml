summary_user: 경기도 안산시 안에서 산림청·지자체가 지정한 산사태·토석류 취약지역을 한 곳씩 담은 파일로, 지역마다 지정년도, 주소(행정동·산지 번호), 지정면적(㎡), 취약지역 유형(산사태 또는 토석류)이 들어 있다. 주민이 우리 집이나 통행로 근처 산지가 산사태 취약지역으로 지정됐는지 확인하거나, 방재 담당자가 집중호우 전에 점검할 토석류 위험지 목록을 뽑는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소를 지오코딩하거나 행정동 이름으로 맞춰 급경사지·대피소·토지 규제 레이어와 겹쳐 본다.
description_portal: 이 데이터는 산림청 및 지자체에서 지정한 산사태 및 토석류 발생 위험이 높은 지역의 현황을 정리한 자료입니다. 지정년도, 주소, 지정면적(㎡), 취약지역유형(산사태·토석류) 등의 항목으로 구성되어 있으며, 해당 지역은 주로 경사 급경사지, 임야 내 배수 취약지, 인접 도로 및 거주지 주변에 집중되어 있습니다. 주소 정보는 행정동·산지 번호 기반으로 수록되어 있어 공간 기반 위험지역 분석에 활용하기 용이하며, 지정면적은 수백 제곱미터부터 2만 제곱미터 이상에 이르기까지 다양합니다. ‘산사태’ 유형은 주로 경사면 침식과 붕괴에 대한 위험을 나타내며, ‘토석류’ 유형은 집중호우 시 토석이 급격히 이동하여 피해를 유발할 수 있는 지형 특성을 반영합니다. 본 자료는 다양한 산림행정 및 안전정책 수립에 활용하실 수 있습니다.
