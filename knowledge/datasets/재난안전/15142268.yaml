description_portal: '최근 정치적, 사회적인 이슈로 인해 집회 및 시위가 증가하고 있으며, 이에 따른 교통정책, 공공 질서 유지 및 안전대책 수립에 활용 가능성이 높아져감에 따라 대전광역시경찰청 분야별 집회 시위 개최 현황이 작성된 통계 자료입니다.1. 데이터의  범위 및 구성: 대전광역시 경찰청 분야별 집회 시위 개최 현황2. 주요 제공 항목:연도별 사회 횟수, 사회 인원, 경제 횟수, 경제 인원, 공공 횟수, 공공 인원 수치를 제공하여, 시기별 개최 증감 현황을 한눈에 파악할 수 있도록 구성되었습니다.3. 데이터 활용 목적:적법한 집회 및 시위를 최대한 보장하고 위법한 시위로부터 국민을 보호함으로써 집회 및 시위의 권리 보장과 공공의 안녕질서가 적절히 조화를 이루도록 하는것을 목적으로함'
