description_portal: “연도별 119구급대 현황” 데이터는 소방청이 매년 전국적으로 운영하는 구급대의 조직과 활동 기반을 수치화해 정리한 공공 통계자료입니다. 이 데이터에는 단순히 구급대 편성 수만 기록되는 것이 아니라, 지역별 구급대 배치 현황, 보유 구급차량의 수와 종류, 근무 형태(상시·순환 등), 구급대원 인력 규모(1급 응급구조사, 간호사, 2급 응급구조사 등) 및 자격 수준 등이 함께 포함됩니다. 이를 통해 특정 연도에 구급대가 얼마나 확충되었는지, 지역 간 인력·장비 배치의 불균형은 어느 정도인지, 응급 수요 증가에 따라 구급대 운영 여건이 어떻게 변화했는지를 다각도로 확인할 수 있습니다.
