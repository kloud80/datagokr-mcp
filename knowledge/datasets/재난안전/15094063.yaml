summary_user: 인천광역시 관내 지정된 어린이 보호구역 644곳을 시설 단위로 담은 파일 데이터로, 시설종류·대상시설명·도로명/지번 주소·관리기관(자치군구)·관할 경찰서·지정년도를 담는다. 학부모나 지자체·교통안전 분석가가 우리 동네 학교·유치원 주변 보호구역이 어디이고 어느 경찰서 관할인지 확인하는 질문에 쓴다. 소재지도로명주소·소재지지번주소(address 키)로 다른 주소 기반 데이터와 이어 쓰며, 좌표 필드나 시설 고유번호 키는 없다.
description_portal: 인천광역시  어린이 보호구역 지정 현황에 관한  데이터입니다.이 데이터에는 인천광역시 관내 도로교통법 제12조(어린이 보호구역의 지정‧해제및 관리) 및 어린이‧ 노인 및 장애인 보호구역의 지정 및 관리에 관한 규칙 제3조(보호구역의 지정)에 따라 지정된  어린이 보호구역의 시설명, 시설종류, 보호구역 위치(도로명주소, 지번주소) 관리기관(자치군구), 관할 경찰서, 보호구역 지정년도 등의 항목이 포함되어 있습니다.이를 통해 인천광역시 내 어린이 보호구역 지정관리에 대한  정보를 확인 할 수 있으며, 데이터는 연간 업데이트되어 최신정보를 반영 합니다.해당 데이터는 공공데이터 포털에서 무료로 다운로드 할 수 있으며, CVS형식으로 제공됩니다.
