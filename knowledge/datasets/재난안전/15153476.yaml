summary_user: 전국 자전거길에 설치된 인증 스탬프(인증센터) 한 곳씩을 한 행으로 담고, 스탬프 이름·유형·전화번호·주소·좌표와 사용 여부를 함께 제공한다. 자전거 국토종주를 계획하는 이용자가 경로 주변 스탬프 위치와 연락처를 확인하거나, 분석가가 자전거길별 인증 거점 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 스탬프 이름·주소 매칭이나 좌표 기반 공간 결합으로 잇는다. 자전거길 일련번호(ROAD_SN)는 같은 기관의 자전거길 데이터와 맞출 때 후보로 쓸 수 있으나 매핑은 확인되지 않았다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 전국 자전거길 스탬프에 대한 정보입니다.\""
