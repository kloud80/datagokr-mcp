summary_user: 한국전기안전공사에 등록된 2024년 비상용 예비전원 자가용 발전설비를 상호(사업장)별로 담은 건별 등록 목록으로, 지역(광역 단위 묶음)·발전기 전압과 용량·설비 종류와 유형(내연력발전, 무정전전원장치, 연료전지, 전기저장장치, 태양광 등)·업종·등록일을 전국 범위로 담는다. 분석가나 안전관리 담당자가 "어느 지역·업종에 비상발전기나 전기저장장치가 얼마나, 어떤 용량으로 등록돼 있나"를 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 지역명·업종명을 이름으로 맞춰 연결해야 한다.
description_portal: 한국전기안전공사에서 제공하는 2024년 비상용 예비전원 자가용(발전) 등록 현황입니다. 이 데이터는 지역(강원도, 경기도, 경상도, 전라도, 충청도, 광역시, 특별시), 상호, 발전기 전압, 발전기 용량, 설비 종류, 설비 유형(기타 발전설비, 내연력발전, 무정전전원장치, 수변전설비, 연료전지, 전기저장장치, 태양광), 업종(가스제조, 가스판매, 계절용전력, 공동주택, 공연장, 관공서, 교육기관, 군부대, 금융업, 농사용, 대규모소매점, 대학, 대형숙박, 식품, 양식업, 어업, 오수처리장, 제조업, 종교시설, 종합상가 등), 등록일을 제공하는 데이터입니다.
