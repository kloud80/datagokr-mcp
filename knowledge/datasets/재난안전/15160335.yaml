description_portal: 본 데이터는 인천광역시경찰청에서 집계한 65세 이상 범죄 피해자의 성별 및 죄종별 현황을 제공하는 통계자료이다. 피해자를 남성과 여성으로 구분하고, 강력범죄, 절도범죄, 폭력범죄, 지능범죄, 풍속범죄, 특별경제범죄, 마약범죄, 보건범죄, 환경범죄, 교통범죄, 노동범죄, 안보범죄, 선거범죄, 병역범죄, 기타범죄 등 총 15개 죄종별 피해 현황을 확인할 수 있다. 이를 통해 고령층이 주로 노출되는 범죄 유형과 성별에 따른 피해 특성을 분석할 수 있으며, 범죄 예방 정책 수립, 고령자 대상 안전대책 마련, 치안 서비스 개선, 지역별 범죄 취약계층 보호 및 관련 연구의 기초자료로 활용할 수 있다. 또한 연도별 데이터와 연계하여 고령층 범죄 피해 추세를 분석하고, 범죄 예방 교육 및 사회안전망 구축을 위한 객관적인 통계자료이다.
