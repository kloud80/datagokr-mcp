description_portal: '국토안전관리원에서 제공하는 공공기관 안전관리등급 심사의 시설물, 건설현장 분야에 대한 심사 대상연도, 심사지표 등이 포함된 CSV형식 파일데이터입니다.공공기관 안전관리등급제는 기획재정부 주관으로 공공기관의 자율적인 안전 수준 향상과 안전문화 정착을 유도하기 위해 시행되는 제도입니다. 이 제도는 공공기관의 안전관리 실태 전반을 종합적으로 진단하여 등급을 부여하며, 국민의 알 권리를 보장하기 위해 그 결과가 공개됩니다. 주요 내용주관 및 평가: 기획재정부가 주관하며, 안전관리등급 평가단이 평가를 수행합니다.평가 대상: 작업장, 건설현장, 시설물, 연구시설 등 위험 요소를 보유한 안전관리 중점 기관들이 대상입니다.평가 항목: 안전역량(안전보건경영체제 구축 및 리더십 등), 안전수준(위험성 평가 및 이행 점검 등), 안전성과(중대사고 발생 여부 등)를 종합적으로 심사합니다.등급 분류: 안전관리 등급은 **1등급(우수)부터 5등급(매우 미흡)**까지 총 5단계로 분류됩니다. 이 중 1등급은 A, 2등급은 B, 3등급은 C, 4등급은 D, 5등급은 E에 해당합니다.등급별 조치:하위 등급(4등급 이하) 기관은 안전 전문기관의 컨설팅을 받거나 경영진 및 직원 대상 안전 교육을 이수하는 등 안전 능력 제고를 위한 개선 조치를 이행해야 합니다.**최고 등급(1등급)**을 받은 기관은 아직 나오지 않았으며, 대다수의 기관이 23등급(양호보통)을 유지하고 있습니다.'
