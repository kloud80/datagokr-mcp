description_portal: '한국승강기안전공단이 관리하는 승강기 모델 식별 목록으로, 업체코드·업체명·승강기모델명 등 기본 메타정보를 정형화하여 제공합니다. 본 자료의 목적은 검사·인증·유지관리 업무에서 모델을 정확히 식별하고, 기관 간 데이터 연계를 위한 기준 참조값을 마련하는 데 있습니다. 동일 업체의 복수 모델이 개별 행으로 관리되며, 기업 상태(예: 폐업, 취소 표기)나 내부 검증 단계에서 일시적으로 사용하는 문자열(예: ‘확인불가’)이 포함될 수 있습니다. 모델명은 제조사 표기 관행에 따라 대소문자, 하이픈, 약어 등의 차이가 존재할 수 있으며, 명칭 변경·기업 합병·이관 등 이력에 따라 중복 또는 유사 항목이 나타날 수 있습니다. 수록 값은 등록·정정 시점의 스냅숏으로 이후 변경분은 원장 시스템에 반영됩니다. 공개 범위는 업체 식별과 모델 식별에 필요한 최소 항목으로 제한되며, 개인 식별정보 및 민감정보는 포함하지 않습니다.'
