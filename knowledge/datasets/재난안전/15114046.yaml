description_portal: 수해대피소 데이터는 경상북도 영양군 내 집중호우, 태풍 등 수해 발생 시 주민이 긴급히 대피할 수 있는 시설 현황을 제공하는 재난안전 기초자료입니다. 시군명, 대피소명, 읍면, 리, 대피소유형, 시설명, 시설구분, 도로명주소, 면적(㎡), 수용인원, 대체대피소명 등의 항목으로 구성되어 있으며, 영양군의 재해 취약지역에 대한 대응 전략 수립과 대피 계획 마련에 활용됩니다. 특히 수용인원과 면적 정보를 통해 시설의 적정 수용능력을 분석할 수 있고, 대체대피소 항목은 실제 재난 발생 시 주민 동선 계획과 다중시설 대응전략에 필수적입니다. 이 데이터는 기후위기에 따른 국지성 집중호우 대응, 재난안전 교육 및 훈련계획 수립, 행정구역별 형평성 있는 대피 인프라 배치 등 다양한 정책·행정 목적에 활용됩니다.
