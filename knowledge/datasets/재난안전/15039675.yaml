description_portal: 제주도는 차량이 인구대비 2배이상 많은 지역으로, 관광지로서 렌트카 및 자가 2대이상 등의 영향으로 차량이 많이 있는 지역입니다.차량이 많음으로 인해서 교통사고도 많이 발생하고 있어, 관련자료는 2011년부터 월별 사고 현황을 나타내고 있습니다.사고현황을 공개함으로서 제주지역에 왔을 때는 교통법규를 잘 지켜야 겠다는 인식을 줄 수 있고, 관련 사고 현황과 다양한 데이터를 결합하여 데이터 분석도 가능할거 같습니다. 세부적인 현황(지역, 연령 등) 공개 시 관련지역에 대한 혐오성으로 인한 부동산 하락 등의 영향을 미칠수 있어  사고건수만  개방하고있으며,매년 1회(9월) 업데이트 하고 있습니다.
