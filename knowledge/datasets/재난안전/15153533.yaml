summary_user: 전국 지하철의 노선·역·출구별 불법촬영(성범죄) 위험도 등급을 담은 데이터로, 역 코드·역명·출구 번호와 기준연도, 위험 등급이 한 행에 들어 있는 등급 집계 자료입니다. 출퇴근길에 이용하는 역이나 출구의 불법촬영 위험이 높은지 확인하려는 시민, 역사 안전시설 배치를 검토하는 기관·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 역명(STATION_NM)이나 역 코드를 이름·코드 매핑으로 맞춰 생활안전지도 범죄 위험도, 경찰관서 위치 등과 이어 쓴다.
