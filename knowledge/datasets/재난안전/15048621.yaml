summary_user: 광주 광산소방서의 소방공무원 인력을 부서(소방행정과·예방안전과·재난대응과, 하남·송정·첨단 등 119안전센터, 구조대, 휴직) 단위로 정원·현원으로 나누고, 소방정부터 소방사까지 직급별 인원을 담은 집계 파일이다. 지역 주민이나 분석가가 '우리 동네 119안전센터에 소방관이 몇 명 배치돼 있고 정원 대비 부족한가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 소방 데이터(화재 발생, 119안전센터 위치 등)와는 부서·센터 이름을 맞춰 연결해야 한다.
