description_portal: '○ 통계개요* 통계명 : 5대범죄 발생현황(장소별)* 통계종류 : 경찰청의 5대 범죄의 장소별 발생건수 현황을 제공하는 일반·보고통계* 작성목적 : 범죄발생 현황 분석 및 범죄추세를 파악하여 형사정책 및 사회 치안정책수립의 기초자료로 활용* 조사체계 : 경찰서→지방경찰청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 살인, 강도, 강간, 절도, 폭력 등 5대 범죄의 장소별 발생건수 등○ 용어설명* 발생건수 : 주기 내 총범죄 발생 건수* 폭력 : 공갈, 손괴, 상해, 폭행, 체포ㆍ감금, 협박, 약취유인, 폭력행위 등○ 기 타* 2010년부터 강간에 "성폭력범죄의 처벌 및 피해자보호 등에 관한 법률", "아동·청소년의성보호에 관한법률"에 의한 범죄 포함됨○ 출 처 : 서울지방경찰청 형사과'
