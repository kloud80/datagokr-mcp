summary_user: 울산광역시 울주군의 방사능 비상 대응 물품(방호복·마스크·제염 장비·측정기 등)을 비축한 현장물품보관소의 위치를 보관소 한 곳 단위로 주소·좌표와 함께 담은 시군구 범위의 조회 API입니다. 방재 담당자나 분석가가 방사능 사고 지점에서 가장 가까운 물품보관소가 어디이고 운반 경로를 어떻게 잡을지 판단하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대피소·구호시설 등 다른 방재 데이터와는 주소·좌표나 시설명, 같은 기관 기준으로만 맞춰 이어 쓴다.
