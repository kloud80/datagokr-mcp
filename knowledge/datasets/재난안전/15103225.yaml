summary_user: 한국전기안전공사가 실시한 2025년 연료전지 발전설비 사용전검사 내역을 검사 건별로 담은 전국 단위 파일(csv)로, 연도·용도·발전기 종류·상호·지역명·발전기 용량·검사결과가 들어 있다. 연료전지 발전사업자나 에너지 분석가가 지역별로 어떤 용량의 연료전지가 새로 설치되어 사용전검사를 통과했는지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 지역명을 문자로 맞추거나 같은 기관의 다른 사용전검사 데이터와 나란히 비교하는 식으로만 연결한다.
description_portal: 각종 발전설비, 송전,변전,배전설비 등 사업용 전기설비 및 아파트, 공장, 상가 등 자가용 전기설비의 설치공사 또는 변경공사를 완료하고 그 전기설비가 공사계획의 인가 또는 신고를 한 내용 및 전기설비 기술기준에 적합한지의 여부에 대한 검사를 하는 것이 사용전검사입니다.법정근거로 사업용전기설비는 전기사업법 제63조, 제98조제2항, 같은법 시행규칙 제31조이며, 자가용전기설비는 전기안전관리법 제9조, 제43조제2항, 같은 법 시행규칙 제6조입니다.이 데이터는 한국전기안전공사에서 제공하는 2025년 연료전지의 사용전검사 실시 내역을 용도, 발전기종류, 상호, 지역 명, 발전기 용량, 검사결과를 제공하는 데이터입니다.
