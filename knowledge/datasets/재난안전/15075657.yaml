description_portal: (데이터 수집목적 및 과정) 경상남도 김해동부소방서 관내 구조구급 위치표지목 현황 데이터는 김해동부소방서에서 관리하는 구조구급 위치표지목 현황입니다. 2024년 기준 데이터입니다. 위치표지목의 종류, 위치, 설치연도 등에 대한 현황을 분석할 때 활용하실 수 있습니다.(데이터 구성 및 세부항목) 데이터는 코스명, 산이름, 고유번호, 좌표, 설치연도 등으로 구성됩니다. 총 57건입니다. 미집계 데이터는 공란처리됩니다.(데이터 현행화 시기) 해당 데이터는 연간 데이터며 차기 업데이트일은 2025년 8월 말입니다.
