summary_user: 경상남도 김해동부소방서가 관리하는 산악 구조구급 위치표지목을 한 개씩 담은 파일로, 산 이름·설치 위치·위도와 경도·관리번호·설치연도·표지판 형태와 크기를 기록하며 포털 설명상 2024년 기준 57건입니다. 등산객이나 산악 구조 담당자, 안전 분석가가 '김해 동부 관내 어느 산의 어느 지점에 구조 위치표지목이 있고 언제 설치됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 위도·경도 좌표로 등산로·산악사고 위치 데이터와 공간적으로 겹쳐 보거나 산 이름·관서명으로 다른 소방서의 위치표지목 현황과 이어 쓴다.
limits: 김해동부소방서 관할만 담고 있어 경상남도 전역이나 다른 소방서 관내 표지목은 따로 찾아야 하며, 표준 행정코드 같은 공통 키가 없어 이름이나 좌표로만 연결된다. 파일(xlsx) 형태로 받는 연간 현황이다.
