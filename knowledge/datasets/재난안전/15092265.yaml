summary_user: 부산진구 관내에 설치된 방범용 CCTV를 설치 지점 단위로 담은 파일로, 지점마다 도로명·지번 주소, 위도·경도, 설치 목적, 카메라 대수와 화소수, 촬영 방면, 영상 보관일수, 관리기관 연락처가 들어 있다. 주민이나 분석가가 '우리 동네 골목 어디에 방범 CCTV가 있고 몇 대가 설치돼 있나'를 확인하거나, 구청이 CCTV 사각지대와 시설 보수 대상을 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소 문자열이나 위도·경도 좌표로 공간 매칭해야 하고, 안전비상벨·보안등 같은 다른 방범 인프라 자료와 지도 위에서 겹쳐 쓴다.
limits: 부산진구 한 개 구의 현황만 담기 때문에 다른 시군구와 비교하려면 지자체별 파일을 따로 모아야 한다. 공통 코드 키가 없어서 다른 데이터와 연결할 때는 주소나 좌표 매칭에 기대야 한다.
