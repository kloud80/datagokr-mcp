description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2016~2020년간 경찰청에서 집계한 족윤적 감정 활용 현황을 제공하는 공공데이터입니다. 족윤적 감정은 사건 현장에서 수집된 신발 자국, 타이어 흔적 등의 분석을 통해 범인을 특정하거나 범죄를 재구성하는 감정 방식으로, 연도별 감정 의뢰 건수, 분석 완료 건수, 사건 해결 기여 건수 등이 포함되어 있습니다. 이 데이터는 과학수사 역량 평가, 현장 수사 개선, 연구기관의 감정 기법 연구, 공공기관의 치안 정책 개발, 민간 보안 분야의 기술 참고 등에 활용됩니다.
