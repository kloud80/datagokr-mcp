summary_user: 울주군 원전 반경 30km 이내 지역을 16개 방위로 나눈 16방위 코드별 공간정보를 조회하는 API이며, 실측 범위는 시군구 단위입니다. 주민·방재 담당자·분석가가 '우리 지역이 원전 기준 어느 방위 구역에 속하는가'를 확인하고 방사능 사고 때 영향 방향을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대피소·재난문자 등 다른 재난 데이터와는 지역명·방위 코드를 직접 매핑하거나 같은 기관(울주군) 코드로만 이어 쓴다.
