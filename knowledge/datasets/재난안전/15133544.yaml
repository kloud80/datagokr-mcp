summary_user: 기상청 지진정보시스템이 관리하는 지진 관측소 메타데이터로, 관측망·관측장소·시추공·관측지점 사진 정보를 관측망코드와 관측지점코드 단위로 담은 전국 범위 파일(zip, 약 24KB)이다. 연구자나 분석가가 "어느 관측망에 속한 지진 관측소가 어디에 어떤 환경으로 설치돼 있는가"를 확인하거나 관측소별 현장 사진 촬영 이력을 살필 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 관측망코드·관측지점코드나 관측소 이름을 기상청의 다른 지진 데이터와 맞춰 이어 쓴다.
