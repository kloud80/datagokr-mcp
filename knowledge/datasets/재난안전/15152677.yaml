description_portal: 국토안전관리원에서 제공하는 소속구분별 수료데이터입니다.이는 시설물안전법 및 지하안전법 기술자를 대상으로 국토안전교육원에서 실시하는 교육과정 수료에 대한 정보입니다.소속구분은 총 7개의 항목(국토안전관리원, 그외공공기관, 중앙공무원, 지방공무원, 안전진단전문기관, 안전점검 전문기관, 개인 및 기타)으로 구성되어 있습니다.안전진단전문기관의 교육 수료인원이 3529명으로 가장 많았습니다.교육분야와 교육시작일, 교육종료일에 대한 정보가 포함되어 있으며, 각 교육의 기수도 표시되어 있습니다.
