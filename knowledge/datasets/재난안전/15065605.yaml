summary_user: 한국산업안전보건공단이 운영하는 산업안전보건 법정 직무교육(신규·보수과정)의 과정 목록을 과정 단위로 담은 전국 범위 파일로, 과정 이름·연도·수용가능인원·총교육시간·교육대상·교육내용·강의료·모바일 수강 가능 여부 등을 담는다. 새로 선임된 안전관리자나 보건관리자, 또는 이들을 둔 사업주가 기한 안에 받아야 할 신규·보수교육 과정이 무엇이고 몇 시간·얼마짜리인지 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 과정 이름이나 공단 내부 코드(교육과정코드, 교육기관코드)를 같은 기관의 다른 교육 자료와 직접 맞춰 이어야 한다.
description_portal: 한국산업안전보건공단에서 수행하는 산업안전보건 직무교육에 대한 과정현황 자료로교육과정이름, 수용가능인원, 교육 대상, 교육 내용 등에 대한 칼럼을 제공하고 있습니다.*산업안전보건법 제32조 및 시행규칙 제29조에 의한 법정 직무교육입니다. 신규과정은 선임(위촉의 경우를 포함)되거나 채용된 후 3개월(보건관리자가 의사인 경우는 1년) 이내에 신규교육을 받아야 합니다. 보수과정은 신규교육을 이수한 후 매 2년이 되는 날을 기준으로 전후 6개월 사이에 보수교육을 받아야 합니다.
