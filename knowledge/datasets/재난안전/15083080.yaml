description_portal: 건강관리가 취약한 50인 미만 소규모 사업장 근로자의 건강관리를 위하여 설치 운영중인 "근로자 건강센터" 정보를 제공합니다.근로자 건강센터에서 제공하는 서비스 - 직종별 유해요인 파악을 통한 직업병 예방 관련 상담- 건강진단 결과에 따른 사후관리 및 건강상담- 뇌심혈관질환 예방관리 상담- 직무스트레스 예방관리 상담- 작업환경(작업관리)와 관련된 상담- 안전보건교육 등- 이동 건강상담 등*근로자 건강증진활동 지침 제12조(근로자건강센터 설치ㆍ운영 등)① 고용노동부장관은 소규모 사업장 근로자의 건강을 보호ㆍ증진하기 위하여 근로자건강센터(이하 ‘근로자건강센터’라 한다)를 설치ㆍ운영할 수 있다.
