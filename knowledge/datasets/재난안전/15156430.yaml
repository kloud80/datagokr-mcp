summary_user: 한국승강기안전공단이 실시한 승강기 안전검사에서 시정권고가 내려진 사례를 승강기·검사항목 단위 건별로 담은 전국 범위 파일(CSV 약 130MB)로, 검사일자·건물명·승강기고유번호·검사항목과 그 요약·시정권고 내용을 포함한다. 유지관리업체·건물 관리자·안전정책 분석가가 "우리 건물 승강기는 어떤 항목에서 어떤 시정권고를 받았나", "전국적으로 반복 지적되는 검사항목은 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, 승강기고유번호가 승강기 단위 원장의 식별자 역할을 하므로 같은 기관의 승강기 정보·검사 결과 데이터와 이 번호로 맞춰 보는 방식으로 연결한다.
description_portal: 이 데이터는 한국승강기안전공단에서 수행한 승강기 안전검사 결과 중 시정 권고가 내려진 사례를 정리한 자료입니다. 각 행은 특정 승강기에 대한 검사 항목과 이에 따른 시정 권고 내용을 포함하고 있으며, 주요 필드에는 ‘검사일자’, ‘건물명’, ‘승강기고유번호’, ‘검사항목’, ‘검사항목요약’, ‘시정권고내용’ 등이 포함됩니다.‘검사일자’는 해당 승강기에 대해 검사가 실시된 날짜를 나타내며, ‘건물명’과 ‘승강기고유번호’를 통해 점검이 이루어진 구체적인 장소와 대상을 식별할 수 있습니다. ‘검사항목’은 검사 기준 항목의 번호이며, ‘검사항목요약’은 검사 항목의 기술적 또는 기능적 설명을 제공합니다. ‘시정권고내용’은 해당 항목에 대해 발견된 문제점과 그에 따른 권고 조치 사항을 서술한 항목으로, 실제 유지보수 및 관리 개선에 중요한 참고자료가 됩니다.이 데이터는 승강기 안전점검에서 반복적으로 지적되는 항목 파악, 시정 조치 유형별 분석, 고위험 시설 선제 대응, 정기검사 기준 개선 등 안전관리 정책 수립에 활용될 수 있습니다.
