description_portal: 인천광역시경찰청 관할에서 2019년부터 2024년까지 발생한 디지털 성범죄 피해자 성별 현황에 대한 데이터는 연도별로 남성과 여성 피해자 수를 구분하여 제공한다.이 데이터는 각 연도별로 디지털 성범죄로 인한 피해자 수를 성별로 나누어 집계한 자료로, 불법촬영, 유포협박, 사이버 성적 괴롭힘 등 다양한 디지털 성범죄 유형의 피해자 성별 현황을 포함하고 있다.해당 자료를 통해 인천 지역에서 발생한 디지털 성범죄 피해자 수의 성별 분포와 연도별 변화를 확인할 수 있다.이를 통해 특정 시기나 범죄 유형별로 피해 양상의 변화를 분석하고, 예방 및 피해자 보호 정책 수립에 필요한 기초자료로 활용할 수 있다.또한 데이터는 지역 사회의 성범죄 인식 개선과 디지털 성범죄 근절을 위한 공공정책 연구에도 중요한 참고 자료가 된다.
