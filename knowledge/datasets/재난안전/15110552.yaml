summary_user: 대구광역시 서구청이 설치한 그늘막을 한 건씩 담은 목록으로, 등록번호·읍면동 명·관리번호·도로명 주소 기반 설치 장소·설치 년월을 제공하며 범위는 서구 한 개 시군구, 행정단위는 읍면동입니다. 주민이 폭염 때 동네 어디에 그늘막이 있는지 찾거나, 구청·분석가가 읍면동별 설치 분포와 설치 시점을 비교해 추가 설치 대상지를 고르는 데 쓴다. 다른 데이터와 직접 잇는 전역 조인 키는 없으므로, 읍면동 명(EMD_NM)이나 설치 장소 주소를 이름 매핑하여 무더위쉼터 등 같은 서구의 대피·구호시설 자료와 맞춰 본다.
limits: 표준 코드나 좌표가 없어 다른 기관 데이터와 자동으로 결합하기 어렵고, 지도에 표시하려면 주소를 따로 좌표로 변환해야 한다. 범위는 대구 서구에 한정된다. 호출에는 포털 활용신청 후 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
