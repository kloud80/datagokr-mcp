summary_user: 경기도 지진조기경보가 전달되는 행정·공공기관과 부서를 최상위부서·두 번째 부서·부서 코드의 3단계로 묶은 코드 목록으로, 기관별 소속부서명·전체부서이름·순위·임시여부·등록일자·수정일자를 담는다. 경기도 재난 담당자나 분석가가 지진 경보가 발령되면 어느 시·군청, 보건소, 소방서, 도서관 부서까지 통보해야 하는지를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 재난 특보·대피시설·소방 데이터와는 기관명·부서명 매핑이나 같은 기관의 부서코드(dept_cd)로만 이어 쓴다.
description_portal: 「지진조기경보시스템 통보지역코드 정보」 데이터는 지진 조기경보가 전달되는 행정기관 및 부서 단위를 코드화하여 관리하는 자료입니다. 각 기관은 최상위부서코드, 두번째부서코드, 부서코드로 체계적으로 분류되며, 해당 기관의 소속부서명, 전체부서이름, 순위, 임시여부, 등록일자 등의 정보가 함께 기록됩니다.이 데이터는 경기도 내 시·군·구청, 각종 사업소, 도서관, 보건소, 소방서 등 다양한 행정·공공기관을 포함하며, 지진 경보가 발령될 경우 어느 기관까지 통보가 이루어져야 하는지 확인할 수 있게합니다.
