summary_user: 서울특별시 119종합방재전산정보시스템의 소방대상물을 건물·대상물 한 건씩 담은 위치 원장으로, 대상물명(OBJNAME)·도로명주소·용도·지상층수와 위경도(WGS1984) 좌표를 담는다. 소방 분석가나 자치구 안전 담당자가 '우리 동네 소방대상물이 어디에 얼마나 몰려 있고, 가까운 119안전센터나 소방용수와는 얼마나 떨어져 있나'를 지도로 확인하는 데 쓴다. 전역 조인 키는 없어서 소방용수·화재 발생 데이터와는 좌표 기반 공간 결합으로 잇고, 행정구역 데이터와는 주소나 같은 기관 코드(관할 코드로 보이는 WARDCODE)를 매핑해서 잇는다.
limits: 데이터는 서울 열린데이터광장(data.seoul.go.kr)에서 받으며, 이때 공공데이터포털 활용신청과 별도로 발급받은 인증키를 경로의 KEY 자리에 넣어야 한다. 실측 컬럼에서 법정동코드 같은 전역 조인 키가 확인되지 않아 다른 데이터와 바로 붙일 수 없다. 또한 범위가 서울시로 한정돼 다른 시도와 비교하는 데는 쓰지 못한다.
