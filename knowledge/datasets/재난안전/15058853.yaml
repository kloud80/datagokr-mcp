summary_user: 경기도 시군별 가로등 설치 수량을 나트륨등·메탈등·LED등의 와트 구간별과 기타 조명으로 나눠 담은 시군 단위 집계 데이터이며, 데이터기준일자(DATA_STD_DE)가 함께 붙는다. 정책 분석가나 시군 담당자가 "우리 시군의 가로등 중 LED 전환 비중이 다른 시군보다 높은가"처럼 조명 종류별 보급 수준과 에너지 효율 정책 효과를 비교하는 데 쓴다. 실측상 전역 조인 키는 없어서 시군명(SIGUN_NM)이나 시군코드(SIGUN_CD)를 이름·코드 매핑해 경기도의 다른 시군 단위 통계(보안등·CCTV 등 방범 인프라)와 잇는다.
description_portal: 가로등 집계 현황 데이터는 경기도 내 시군별 가로등 설치 현황을 조명 종류와 용량별로 구분하여 제공하며, 시군명, 나트륨등(와트별), 메탈등(와트별), LED등(와트별), 기타 조명 수량, 데이터기준일자 등의 항목으로 구성되어 있습니다. 본 데이터는 기존 나트륨등, 메탈등의 설치 현황과 최근 확산된 LED등 보급 현황을 비교할 수 있어, 에너지 절감 효과 및 도시 조명 정책의 변화를 분석하는 데 유용합니다. 또한 시군별 가로등 설치 규모를 통해 교통 안전, 보행 환경 개선, 에너지 효율성 향상 정책의 기초 자료로 활용됩니다. 특히 LED 가로등의 와트별 설치 현황은 친환경 조명 보급 수준을 평가하는 지표로도 쓰일 수 있으며, 향후 도시재생 및 스마트시티 정책 수립에도 중요한 참고자료가 됩니다.
