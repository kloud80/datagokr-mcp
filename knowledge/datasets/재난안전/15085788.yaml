summary_user: 해안가 인근 인명구조장비함의 위치를 건별로 담은 API 데이터로, 전국 854건이며 시도·시군구·읍면동 주소와 위도·경도, 장소 설명 필드로 구성된다. 해안에서 인명구조장비함이 가장 가까이 어디 있는지 찾으려는 국민이나 해양안전 분석가가 쓴다. 시도 필드(c_sido)가 행정구역 코드(admin_area_code) 조인 키라서 같은 코드를 쓰는 지역 단위 데이터와 이어 쓰고, 위경도로 지도 위에 겹쳐 쓴다.
