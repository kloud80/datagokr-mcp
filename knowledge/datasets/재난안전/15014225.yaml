summary_user: 재난연감 통계를 바탕으로 사고유형별 발생건수, 사망·부상·실종 인원, 재산피해(억원)를 2016년부터 2024년까지 연도별로 집계한 전국 단위 통계 파일(csv, 약 4.8KB)입니다. 정책 담당자나 분석가가 "최근 몇 년간 어떤 유형의 사고에서 사망자가 늘었나"처럼 사고유형별 피해 추세를 비교할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사고유형 이름을 직접 맞추는 방식으로만 이을 수 있고, 같은 개념인 도로·경찰 교통사고 통계나 교통사고다발지역 표준데이터와 나란히 보는 보조 자료로 쓴다.
description_portal: 매년 발간되는 재난연감 통계자료를 기초로 한 사고발생현황자료로서26가지 사고유형에 대한 자료를 매년 지역별로 집계한 자료임.자료 출처는 연 1회, 전년도 사고통계를 집계한 것으로 13개 중앙부처와 17개 시도에서  사고자료를 취합한 자료임
applicable_legislation:
