summary_user: 승강기 휴지신청(장기 미운행·공사 등으로 운행을 잠정 중단하는 절차)의 접수부터 처리까지를 접수 건별 행으로 담은 전국 단위 파일이며, 접수일자·접수번호·승강기관리번호1·2·처리일자로 구성된다. 시설 안전 담당자나 분석가가 기간별 휴지 접수·처리 추이, 처리 지연 여부, 특정 건물 승강기의 장기 휴지 패턴을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 승강기 원장 데이터와는 승강기관리번호 값을 맞춰 보는 방식으로만 연결할 수 있다.
description_portal: 본 데이터는 승강기 휴지신청(장기간 미운행·공사 등으로 운행을 잠정 중단하고 관련 행정의무를 일시 정지하기 위한 절차)에 대한 접수부터 처리까지의 이력을 행 단위로 제공하는 자료입니다. 필드는 접수일자(YYYY-MM-DD), 접수번호(내부 접수 일련), 승강기관리번호1·2(국가승강기정보 관리대장 기준 식별값), 처리일자(휴지 승인/반려 등 최종 처리 기준일)로 구성됩니다. 하나의 접수번호가 여러 관리번호와 매핑될 수 있어 동일 접수에 대한 다건 행이 존재할 수 있으며, 처리일자는 접수일자와 동일하거나 이후일 수 있습니다(기관 처리 진행 중인 건의 경우 결측 가능). 본 자료는 기간별 접수·처리 추이, 처리 지연 모니터링, 단지·건물 단위의 장기 휴지 패턴 분석, 민원 응대 SLA 점검 등의 근거로 활용할 수 있습니다. 날짜는 ISO 형식, 번호는 숫자형 일련값을 권장합니다. 개인정보 및 민감정보는 포함되어 있지 않습니다.
