summary_user: 공공시설 단위로 시설명·종류·주소, 최종 점검·진단 일자, 안전등급, 다음 점검·진단 예정일을 담은 전국 범위의 시설별 원장 데이터다. 지자체 담당자나 주민이 '우리 동네 공공시설 중 안전등급이 낮거나 점검 시기가 다가온 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 실측되지 않아 시설명·주소 매칭으로 연결하고, 시도·시군구·읍면동 법정동 코드(STDG_SGG_CD 등)와 좌표 컬럼으로 행정구역·지도 데이터와 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 공공시설 안전등급도 관련 정보입니다.\""
