description_portal: 이 공공데이터는 강원도 내 여성 및 아동폭력 피해자 지원센터의 연도별 운영 실적을 나타낸 자료로, 2016년부터 2024년까지의 데이터를 포함하고 있습니다. 주요 항목은 상담 건수, 진료 제공 건수, 증거채취 건수, 진술녹화 건수, 수사지원 건수 등으로 구성되어 있으며, 폭력 피해자에 대한 실질적인 보호 및 지원 활동 현황을 구체적으로 보여줍니다. 해당 데이터는 피해자 중심의 치안 서비스 제공 실태를 파악하고, 성폭력·가정폭력·학대 등 위기 상황에 놓인 여성과 아동에 대한 공공의 대응 수준을 평가하는 데 활용됩니다. 또한 경찰청, 지자체, 복지기관은 물론 연구기관과 시민단체에서도 피해자 보호 정책 수립, 제도 개선, 통합적 지원 체계 마련을 위한 기초자료로 폭넓게 활용될 수 있습니다.
