summary_user: 경기도 안에서 교통·수난·붕괴·기타 유형별로 선정된 사고빈발·위험지역을 지점 한 곳당 한 행으로 담고, 사고장소, 지번주소, 119 출동 건수, 위험요인, 선정연도, 정제 우편번호와 WGS84 위경도를 함께 싣는다. 지자체 안전 담당자나 분석가가 '우리 시군에서 119 출동이 잦은 위험지점은 어디이고 원인은 무엇인가'를 확인해 우선 개선지역을 고를 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 지번주소·우편번호 같은 이름 매칭이나 위경도(refine_wgs84_lat/logt)를 이용한 공간 중첩으로만 잇는다.
description_portal: 이 데이터는 경기도 내 각종 사고 유형별(교통, 수난, 붕괴, 기타) 사고빈발 및 위험지역의 위치와 사고 특성을 분석한 자료입니다. 주요 항목에는 사고유형, 사고위치(지번), 사고장소, 119출동 건수, 위험요인, 선정연도, 정제우편번호, 정제WGS84위도 및 경도 등이 포함되며, 사고다발지역의 지리적 위치와 사고 원인을 파악할 수 있습니다. 각 사고는 교차로, 보행로, 체육시설 주변 등에서 발생하며, 시설물 부족, 시야 사각지대, 낙상 위험 등의 요인이 기술되어 있습니다. 이 데이터는 안전 정책 수립, 위험지역 집중 관리, 우선 개선지역 선정, 시민안전 지도 구축, 공간 기반 사고예방 모델링 등 다양한 행정 및 방재 분야에 활용될 수 있습니다. 정제된 위경도 정보는 GIS 시각화 분석에도 적합합니다.
