summary_user: 관악구 안에 설치된 그늘막을 한 곳씩 한 행으로 담은 시설 목록으로, 종류(스마트형·고정형), 행정동, 설치장소명, 도로명·지번주소, 위도·경도, 원단, 높이·펼침지름 같은 규격을 함께 담는다. 주민이 '우리 동네 교차로나 버스정류장 근처에 그늘막이 있나'를 확인하거나, 분석가가 행정동별 폭염 대응 시설 분포와 추가 설치가 필요한 곳을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 데이터와는 행정동 이름이나 주소로 맞추거나 위도·경도로 무더위쉼터 같은 대피·구호시설 좌표와 겹쳐 본다.
description_portal: 본 데이터는 관악구 내 그늘막 설치 현황을 정리한 정보입니다. 본 데이터는 그늘막 종류, 설치 행정동, 설치장소명, 도로명·지번주소, 위도·경도, 원단 종류, 높이·지름 등 규격 정보, 스마트 기능 여부, 데이터기준일자의 항목을 포함합니다. 각 위치별로 ‘스마트형’과 ‘고정형’ 설치 구분을 제공하여 여름철 폭염 대응 시설의 분포를 파악하는 데 활용됩니다. 특히 도로변, 교차로, 버스정류장 등 보행자 대기 지점 중심으로 설치 위치가 상세히 제공되어 향후 시설 유지관리, 추가 설치 우선순위 선정, 열섬 완화 정책 수립 등에 참고자료로 활용할 수 있습니다.
