summary_user: 한전KPS의 사업소별 안전보건경영시스템 인증 현황을 건별로 담으며, 인증상태·등록번호·심사종류와 유효기간 시작일·종료일을 포함하고 범위는 전국·비공간이다. 안전관리 담당자나 협력 사업자가 '특정 한전KPS 사업소의 안전보건경영시스템 인증이 지금 유효한지, 언제 만료되는지'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소명(businessSite) 같은 이름 매핑이나 같은 기관 데이터로만 이어 쓴다.
limits: 전역 조인 키가 없어 행정구역 코드나 시설 원장과 직접 결합할 수 없고, 사업소명 문자열 매칭에 의존해야 한다. 개발계정은 하루 1,000회 호출로 제한된다.
