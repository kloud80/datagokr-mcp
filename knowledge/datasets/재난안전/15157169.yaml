description_portal: 한전 KPS의 사업소명, 인증종류, 유효기간 등을 기준으로  인증기관, 취득일, 유효기간 등 안전보건경영시스템 인증현황을 조회하는 안전보건경영시스템 인증 현황 조회 서비스입니다. 사업소별로 안전보건경영시스템 인증여부와 유효기간 시작일 및 만료일 등을 확인할 수 있습니다. 이자료는 안전보건 경영의 정착도, 법적 준수 수준, 외부 심사 대응 준비 등에 활용될 수 있으며 안전관리 담당자 및 경영진이 전략적 의사결정을 내릴 때 핵심 관리지표 역할을 할 수 있습니다.산업안전보건법에 따른 안전보건관리체계 구축·운영 및 공공기관의 사회적 책임 이행을 위해 사업소별 안전보건경영시스템 인증 현황을 관리·보유하고 있습니다.
