summary_user: 부산경찰청 관할 경찰서별로 112 치안상황실에 전화로 접수된 신고 건수를 연도 단위로 집계한 파일로, 포털 설명상 2019~2025년을 담고 한 행이 한 해, 열이 부산청 전체(계)와 중부서·해운대서 등 16개 경찰서입니다. 분석가나 시민이 '부산에서 112 신고가 가장 많은 경찰서는 어디이고 해마다 어떻게 변했나'를 확인하는 데 쓴다. 공통 조인 키는 없어서, 다른 경찰서별 범죄 발생·검거 통계나 경찰관서 위치 데이터와는 경찰서 이름을 직접 맞춰 이어 쓴다.
description_portal: 부산광역시 경찰서별 112신고 건수 데이터는 2019~2025년 부산광역시 부산경찰서 소속  경찰서별 민원인 이 112 치안 상황실로 접수한 불편 민원 등 112 전화 접수 신고 건수입니다. 해당 데이터는 부산경찰청 생활안전부 112 치안종합상활실에서 제공합니다.  112 신고접수 건수를 경찰서별로 구분 (중부경찰서, 동래경찰서 , 영도경찰서, 동부경찰서, 부산진경찰서, 서부경찰서서, 남부경찰서, 해운대경찰서 ,사상경찰서, 금정경찰서, 사하경찰서 , 연제경찰서, 강서경찰서 , 북부경찰서, 기장경찰서, 수영경찰서 )하여  제공합니다.
