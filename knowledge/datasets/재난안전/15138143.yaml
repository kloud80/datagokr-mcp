description_portal: 한국승강기안전공단이 적용하는 ‘승강기 검사수수료 산정 기준’을 체계화한 자료입니다. 검사유형(완성·정기·수시·정밀 등), 승강기 종류와 주요 제원(정원·속도·층수·용도 등)에 따른 기본 수수료, 가산·감면 항목, 적용일자와 유효기간 등 산정 규칙을 제공합니다. 제도 개정 전·후 기준을 구분해 CSV 2종(개정 전/개정 후)으로 제공하며, 각 파일은 전산 반영을 위한 코드·구분값과 주석 필드가 포함될 수 있습니다. 본 자료의 목적은 민원인의 예상 부담금 확인, 지자체·공단의 예산 수립과 수입 추계, 제도 변경에 따른 영향 분석 등 행정·정책 활용을 지원하는 것입니다.
