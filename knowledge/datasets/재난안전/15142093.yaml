summary_user: 경기도 시군별로 연도마다 집계한 재해 피해와 복구 현황을 담는다. 인명피해 수, 주택 파손·침수 동수, 농경지 피해 면적, 피해액과 복구액이 들어 있으며, 건별 원천이 아닌 집계 자료다. 지자체 담당자나 분석가가 "최근 몇 년간 경기도에서 수해 피해액과 복구비가 가장 컸던 시군은 어디인가"를 따질 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 재난·시설 데이터와는 시군 이름이나 시군코드(SIGUN_CD)를 직접 매핑해 이어 써야 한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 경기도의 재해피해 및 복구집계 정보로,집계연도, 시군명, 시군코드, 인명피해수, 주택파손동수, 주택침수동수, 농경지피해면적 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
