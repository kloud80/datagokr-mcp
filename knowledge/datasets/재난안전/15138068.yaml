description_portal: 본 자료는 한국승강기안전공단이 불합격·검사유효기간 초과 등 사유로 지자체에 발송한 통보 문서의 처리현황을 정리한 데이터입니다. 각 레코드는 통보 대상 건이며, 필드는 통보기준일자, 접수일자, 접수번호, 기안일자, 제외여부, 제외사유로 구성됩니다. 통보기준일자는 대상 산정일, 접수일자는 접수 시점, 기안일자는 통보 문서의 기안일입니다. 제외여부(Y/N)는 통보 완료 등으로 발송 대상에서 제외된 건을 구분하고, 제외사유에는 ‘기 통보’, ‘통보완료’ 등이 기록됩니다. 동일 접수번호 반복은 같은 사안의 이력이나 중복 기록일 수 있으며, 통일된 열 정의로 기간별 통보 규모와 상태 변화를 확인할 수 있습니다.
