summary_user: 충주시 재난위험요인DB 중 대피시설 정보를 시설 단위로 담으며, 관리번호·읍면동·주소·위경도 좌표와 함께 주변 재난위험도·접근성·수용인원 등을 반영한 위험도 점수와 등급을 제공한다. 충주 주민이나 재난 담당자가 '우리 동네에서 가장 가깝고 적합한 대피소는 어디인가', '대피소가 부족하거나 위험도가 높은 읍면동은 어디인가'를 확인하는 데 쓴다. 응답은 공간데이터 형태(type·properties·geometry)이고 전역 조인 키가 없으므로, 다른 대피시설 표준데이터나 재난위험지역 데이터와는 읍면동 이름이나 좌표로 맞춰 이어 쓴다.
description_portal: '본 데이터는 2022년 공공데이터 기업매칭 지원사업을 통해 구축된 충청북도 충주시 재난위험요인DB 중 ‘대피시설’ 관련 정보입니다.데이터 항목은 관리번호, 읍면동, 시설 주소, 위도 및 경도 좌표, 위험도 점수, 등급 등으로 구성되어 있으며,자연재해(지진, 산불, 풍수해 등)나 사회재난 발생 시 주민들이 신속히 대피할 수 있는 지정 시설의 위치 및 위험수준 정보를 포함하고 있습니다.위험도 점수는 주변의 재난위험도, 접근성, 수용 가능 인원, 구조 안정성, 거리 특성 등을 반영하여 산출되며,등급은 대피소의 상대적 적합성을 나타내는 지표로 활용됩니다(예: 1등급~3등급 또는 고·중·저 등급 등).이 데이터는지역별 대피 가능 공간의 분포 현황 분석재난 발생 시 시민 안내용 대피 경로 설정취약 지역 우선 대피소 보강 및 신규 설치 계획 수립재난 대응 훈련 및 시나리오 설계 자료로의 활용등에 유용하며, 주민 안전 확보 및 긴급 상황 대응력을 높이는 데 기초 자료로 활용될 수 있습니다.※ 본 정보는 관할 지자체 및 재난관리부서가 현장 여건을 반영하여 주기적으로 점검·갱신하며, 실제 재난 발생 시에는 실시간 안내 체계를 병행하여야 합니다.'
