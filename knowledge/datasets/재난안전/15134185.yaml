description_portal: 한국해양교통안전공단(KOMSA)에서는 선박에서 발생하는 해양사고 예방을 위해 고위험선박 집중관리, 선박 안전진단 서비스 등 다양한 예방활동을 수행하여 국민의 생명ㆍ신체ㆍ재산을 보호하고 있습니다.해당 데이터는 한국해양교통안전공단(KOMSA)에서 운영 중인 해양교통안전정보시스템(MTIS)의 "우리지사관리" 서비스의 해양사고 예방활동 콘텐츠 정보입니다.해양사고를 예방하기 위해 다양한 사고예방 프로그램들을 추진한 실적과 관련된 데이터 입니다.데이터는 해양안전캠페인, 해양안전간담회, 해기사교육강사지원, 안전교육강사지원, 가상현실교육 추진 실적으로 구성되어 있습니다.
