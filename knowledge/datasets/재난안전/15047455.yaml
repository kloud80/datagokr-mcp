summary_user: 광주 동부소방서 관내에서 불이 나면 큰 인명·재산 피해가 우려되는 대형화재취약대상을 시설 한 곳당 한 행으로 담는다. 행마다 특수장소 구분, 대상명, 위치, 연면적이 있다. 파일은 1849바이트 CSV로 작은 목록이다. 주민이나 안전관리 담당자가 "동부소방서 관할에서 소방서가 특별히 관리하는 대형 시설은 어디이고 규모가 얼마나 되나"를 확인할 때 쓴다. 전역 조인 키나 코드가 없어서, 건축물대장·특정소방대상물 같은 다른 데이터와는 대상명이나 위치 주소를 문자열로 맞춰서만 이어 쓴다.
description_portal: 광주광역시 동부소방서 관내 대형화재취약대상 현황에 대한 데이터로 각 특수장소에 대하여 장소, 대상명, 위치 연면적 등에 대한 항목을 제공합니다.광주광역시 동부소방서 관내 대형화재취약대상 현황 데이터는, 화재 발생 시 대규모 인명과 재산 피해가 우려되는 특정 대상물들을 체계적으로 관리하기 위한 기초적 정보 자원입니다."불이 나면 큰 사고로 이어질 수 있는 건물이나 장소"를 말합니다. 사람들이 많이 모이는 대형 마트, 백화점 환자나 노약자가 많은 병원, 요양원, 아이들이 있는 학교, 유치원, 영화관, 공연장, 고시원, 찜질방 등이런 곳에서 불이 나면 한 번에 많은 사람의 생명과 재산에 큰 피해가 생길 수 있기 때문에 소방서는 이런 시설을 특별히 관리합니다. 이를*"대형화재취약대상"이라고 부릅니다.각 항목은 “특수장소 구분”, “대상명”, “위치”, “연면적” 등으로 구성되어 있어, 해당 대상물이 어떤 특성을 갖는지 파악하는데 용이합니다.
