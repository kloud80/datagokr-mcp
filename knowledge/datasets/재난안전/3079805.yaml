summary_user: 여수시의 이재민임시주거시설을 시설 한 곳당 한 행으로 담은 파일로, 행정구역·시설명·도로명 주소·시설유형·면적·수용가능인원과 냉난방·급식 가능 여부, 간판·유도표지·화재예방 상태, 지진 겸용 여부를 기록한다. 여수시 주민이 태풍·홍수로 집을 떠나야 할 때 우리 동네 어느 시설에 몇 명까지 들어갈 수 있는지 확인하거나, 분석가가 읍면동별 수용 인원이 인구에 비해 충분한지 점검하는 데 쓴다. 전역 조인 키가 없어 다른 대피시설·인구 데이터와는 행정구역 이름이나 도로명 주소를 맞춰 붙여야 한다.
description_portal: 태풍·홍수·산불·지진 같은 재난으로 집을 잃거나 거주가 어려워진 주민들을 임시로 수용하기 위한 시설 정보를 담은 공공데이터입니다. 보통 지방자치단체나 공공데이터포털에서 제공하며, 재난 대응과 대피 계획 수립에 활용※ 구체적인 목적1. 생명과 안전 보호  - 태풍, 홍수, 산불, 지진 등의 재난 발생 후 위험 지역에서 주민을 신속히 대피시켜 보호합니다.  - 추가 피해를 예방하고 안정적인 생활 공간을 제공합니다.2. 기본 생활 보장  - 숙식, 위생, 휴식 공간 등을 제공하여 이재민이 최소한의 생활을 유지할 수 있도록 합니다.  - 학교 체육관, 주민센터, 경로당, 공공시설 등이 임시주거시설로 활용됩니다.3. 심리적 안정과 회복 지원  - 재난 이후 불안과 스트레스를 겪는 이재민에게 안정감을 제공합니다.  - 최근 연구에서는 단순 대피 공간을 넘어 공동체 회복과 심리 회복 기능도 중요하게 다루고 있습니다.4. 지역사회 및 공동체 유지  - 가족 단위 생활과 주민 간 교류가 가능하도록 하여 사회적 고립을 줄입니다.  - 커뮤니티 공간과 공용시설을 통해 공동체 회복을 지원합니다.5. 재난 복구 전까지의 임시 거주 지원  - 주택 복구나 장기 거처 마련 전까지 임시로 거주할 수 있도록 합니다.  - 최근 산불 피해 지역에서는 모듈러 주택 형태의 긴급주거시설도 운영되고 있습니다.
