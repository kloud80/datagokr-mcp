summary_user: 한국전기안전공사가 전기재해 통계 분석집을 바탕으로 2018~2024년 감전사고 인명피해(사망·부상 인원)를 연도와 장소 유형(발전소·공장·공사장·주거시설·야외 등 25개 내외 구분)별로 집계한 전국 단위 파일 데이터다. 안전관리 담당자나 정책 분석가가 "공사장과 주거시설 중 어디에서 감전 사망자가 더 많이 나오고, 그 추세가 줄고 있는가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 장소 유형 이름을 직접 맞춰 붙여야 한다.
description_portal: 한국전기안전공사는 감전재해 감축을 위해 올바른 정책 방향의 기초 데이터를 제시하고 감전 재해의 발생추이를 분석하여 예방 대책을 도출하기 위해 매년 전기재해 통계 분석집을 발간하고 있습니다.관련 근거로는 통계법 제18조와 동법 시행령 제24조, 전기안전관리법 제41조(전기재해 통계의 작성)가 해당됩니다.이 데이터는  연도별(2018년~2024년), 장소별(발전소,변전소, 송배전선로, 공장, 작업장, 공사장, 공공시설(물), 통신주, 가로등주, 관공서, 군부대, 학교, 종교, 의료, 요식, 유흥, 숙박, 유통, 판매, 빌딩, 오피스텔, 주거시설, 야외, 해상, 기타) 감전사고에 따른 인명피해(사망, 부상)를 확인할 수 있는 데이터입니다.
