summary_user: 경기도 전역의 민방위 비상대피시설을 시설 한 곳당 한 행으로 담으며, 시설명·시설 구분, 도로명·지번 주소, 위경도 좌표, 면적, 수용 가능 인원, 개방 여부, 관리기관과 연락처를 포함한다. 주민이 우리 동네에서 가장 가까운 대피소가 어디이고 몇 명까지 들어갈 수 있는지 확인하거나, 분석가가 시군별 인구 대비 대피 수용 능력이 부족한 지역을 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·시설명 매칭이나 위경도 좌표 기반 공간 결합으로 잇고, 재난 위험지역이나 다른 대피·구호시설 데이터와 지도 위에서 겹쳐 보는 방식이 현실적이다.
description_portal: 이 데이터는 경기도 전역에 설치된 민방위 비상대피시설의 운영 및 공간적 특성을 나타냅니다. 평시에는 공공 또는 민간 공간으로 활용되지만, 재난 발생 시 주민이 긴급히 대피할 수 있도록 지방자치단체에서 지정한 공간입니다. 각 시설의 용도 및 개방 가능 여부, 위치 정보, 공간 크기 및 수용 가능 인원에 대한 정보가 포함되어 있어, 실질적인 대피계획 수립과 재난 대비 시뮬레이션 구축에 활용됩니다. 또한 지도 기반 시스템과 연계하여 대피소 접근성이나 공간 분포를 분석하는 데 적합하며, 주민 보호와 지역안전망 구축을 위한 정책 자료로 사용될 수 있습니다.
