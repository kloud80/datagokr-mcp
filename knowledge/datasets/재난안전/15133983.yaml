description_portal: '이 데이터는 서울시설공단 소속 각 사업소에서 실시한 재난 대응 모의훈련 정보를 제공하는 공공데이터입니다. 해당 데이터는  훈련 종류, 훈련 부서, 훈련 내용을 포함하고 있으며, 실효성 있는 재난 대응 체계 구축과 사전 대비를 위한 기반 자료로 활용됩니다. 전기차화재, 청계천 익수, 맹수탈출, 자연재해, 질식사고 등 신종재난 상황을 가정한 모의훈련을 포함하여 다양한 유형의 훈련 현황을 제공한다.본 데이터는 정기적으로 갱신되며, 재난 대비를 위한 훈련 이력의 체계적 관리 및 공공 공유, 재난 대응 역량 평가 및 훈련 정책 개선 자료로 활용, 국민과 민간 분야의 훈련 참여 유도 및 인식 제고, 기관 간 훈련 사례 공유를 통한 훈련 수준 향상 등의 목적으로 활용 가능하다. - 재난 대응 체계 개선: 훈련 이력을 분석하여 대응 정책 및 시나리오 개선- 정책 수립 지원: 유형별 훈련 통계를 바탕으로 재난 훈련 계획 수립- 대국민 공개: 시민의 재난 대응 인식 제고 및 민간 참여 유도- 기관 간 협업 증진: 훈련 사례 공유를 통한 타 기관 벤치마킹'
