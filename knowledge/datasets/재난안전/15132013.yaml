summary_user: 전주시에 있는 기계설비 성능점검 대상 건축물을 한 건물씩 담은 목록입니다. 항목은 위치 주소, 관리주체, 연면적, 세대수입니다. 건물 관리자나 시설관리 사업자는 '내 건물이 성능점검 대상인지, 같은 지역의 대상 건물은 어디에 몇 곳인지'를 확인하는 데 쓴다. 공통 조인 키는 없어서, 다른 건축물·시설 안전 데이터와는 주소(위치)를 맞추거나 같은 기관 자료끼리 이름으로 이어 써야 합니다.
description_portal: '이 데이터는 전북특별자치도 전주시에 위치한 기계설비 성능점검 대상 건축물 현황을 담고 있는 데이터입니다. 자료에는 각 점검대상 건축물의 주소, 관리주체, 그리고 연면적 등의 정보가 포함되어 있습니다. 이 데이터는 건축물 기계설비의 안전 관리, 정기적인 성능 점검 계획 수립, 안전사고 예방, 그리고 건축물 유지관리 정책 개발에 폭넓게 활용되며, 전주시의 건축물 안전 강화와 시민 보호를 위한 중요한 기초 자료로서 행정 및 현장 업무에 필수적인 역할을 수행하여 지역사회의 지속 가능한 발전과 공공 안전 증진에 이바지합니다.항목 : 연번, 시군구, 위치(주소), 관리주체, 연면적(㎡), 세대수(세대)데이터 제공부서 : 건축과'
