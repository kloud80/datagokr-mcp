description_portal: 김해서부소방서 관내(장유, 진영, 진례, 주촌, 한림,)의 관할 부서, 관할 면적, 관할 인구, 세대수, 관할구역 등의 데이터를 포함하고 있습니다.본 데이터는 경상남도 김해서부소방서 산하 각 119안전센터 및 구조대가 담당하는 행정구역(관할 구역) 현황을 상세히 제공하는 정보입니다. 김해시 서부 지역(진영읍, 주촌면, 진례면, 한림면, 장유 1·2·3동 등)의 소방 행정 서비스 범위를 체계적으로 관리하여, 재난 발생 시 신속한 출동 체계를 파악하고 시민들에게 인근 소방 관서 정보를 제공하는 것을 목적으로 합니다.
