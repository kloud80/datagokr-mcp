summary_user: 경상북도 도내 민방위 대피시설 764건을 시설별 한 행씩 담은 파일 데이터로, 시군·읍면동, 시설종류와 용도, 시설명칭, 도로명·지번 주소, 대피가능면적과 대피 가능인원을 싣는다. 주민이나 방재 담당자가 '우리 동네에서 비상시 갈 수 있는 대피시설이 어디이고 몇 명까지 들어가나'를 확인하거나 시군별 분포를 비교할 때 쓴다. 도로명 주소와 지번 주소 필드를 키로 다른 주소 기반 데이터와 이어 쓰며, 별도 좌표 필드는 명세에 없다.
description_portal: 경상북도 대피시설 현황 데이터는 도내 각 시·군의 민방위 대피시설 위치와 규모를 체계적으로 정리한 자료입니다. 읍면동 단위로 시설종류, 시설용도, 대피시설명칭, 도로명주소 및 지번주소, 대피가능면적, 대피 가능인원 등의 항목으로 구성되어 있습니다. 본 데이터는 재난 및 전시 등 비상상황 시 주민의 신속한 대피와 안전 확보를 지원하기 위해 구축되었으며, 지역별 대피시설의 분포 현황을 한눈에 파악할 수 있습니다. 또한 민방위 및 재난안전 관리정책 수립, 방재 인프라 확충, 안전행정 개선을 위한 기초자료로 활용됩니다.자료 관련 문의는 054-880-7233으로 하시기 바랍니다.
