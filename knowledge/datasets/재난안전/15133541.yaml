summary_user: 기상청 국가지진종합정보시스템(NECIS)이 쓰는 지진 관측소 메타정보를 파일(zip, 약 23KB)로 담으며, 관측소 위치, 시추공 설치 여부와 깊이, 관측 장소 사진(촬영일자·당시 날씨 포함), 화산재 정보 같은 묶음으로 구성된다. 지진 분석가나 연구자가 "특정 관측지점의 지진계는 어떤 방식과 깊이로 설치됐고 현장 환경은 어떤가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 관측망코드·관측지점코드를 기준으로 같은 기상청의 지진 관측 데이터와 코드 매핑으로만 이어 쓴다.
description_portal: '기상청 국가지진종합정보시스템(NECIS)에서 사용중인 메타파일 정보 - META_EQK_DOWNHOLE: 메타-관측장소-시추공: 지진계 설치 방식 중 하나인 시추공(Downhole) 설치 여부와 그 깊이 정보를 나타냅니다. - META_EQK_LOC_IMG: 메타-관측장소-사진: 해당 관측 장소의 실제 모습을 촬영한 이미지 또는 사진 파일 정보를 포함합니다. - META_EQK_LOCATION: 메타-관측장소: 지진계가 실제로 설치된 관측소의 지리적 정보를 나타냅니다. - VAAC_VOLCANO: 화산재 정보'
