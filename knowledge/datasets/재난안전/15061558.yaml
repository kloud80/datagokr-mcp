description_portal: 원자력발전소에서 중대사고 발생시 원전 호기별, 본부별 극한재해로부터 대비하기 위한 이동형설비의 준비현황 (후쿠시마 후속대책)- 2011년 3월 후쿠시마 원전사고 후 후쿠시마 후속조치로 중대사고 대처 강화가 요구되었고 2013년 가동원전에 대한 스트레스 테스트가 수행되었습니다. 그 후 2016년 원자력 안전법이 개정되면서 원전 운영자는 중대사고관리 계획을 포함한 사고관리계획서를 제출하도록 요구받았습니다. 원안법 개정 이후 극한재해 대비 사고관리를 위해 이동형설비(MACST설비)의 현장배치 필요성이 제기됩니다. - 국내 원전의 중대사고관리는 MACST 전략에 의해 수행되며 MACST 전략은 총 3단계로 구분됩니다. 1단계에서는 소내 고정형 설비를 이용한 노심냉각기능을 확보하고, 2단계에서는 소내 이동형설비를 이용한 노심냉각 기능을 유지합니다.-이러한 각 본부별 이동형설비의 준비현황은 공공데이터에 1년 주기로 매년 업데이트되어 등록되고 있습니다.
