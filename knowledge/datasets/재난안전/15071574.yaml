description_portal: 서울시 승강기제조및수입업체 인허가 정보는 서울시 관할 자치단체에서 인허가를 받은 승강기 제조 및 수입 관련 업체의 주요 인허가 현황과 업체 특성을 종합적으로 제공하는 공공데이터입니다. 이 데이터는 관리번호, 인허가일자, 인허가취소일자, 영업상태 및 상세영업상태, 폐업·휴업·재개업 일자 등 인허가 및 영업 이력을 통해 각 업체의 행정적 변동 사항을 파악할 수 있도록 하며, 사업장명, 전화번호, 지번주소와 도로명주소, 우편번호, 좌표정보, 소재지면적 등 기본 현황 및 위치 정보를 포함하여 업체의 실제 위치와 규모를 확인하는 데 활용됩니다. 또한 업태구분명, 업종구분명, 관리업구분명 등을 통해 승강기 제조, 수입, 유지관리 등 업체의 영업 형태와 역할을 구체적으로 구분하고, 자본금과 자산 정보를 통해 재무적 규모를 가늠할 수 있도록 지원합니다. 아울러 유지관리책임인력수, 실무기술인력수, 설계책임기술인력수, 제조책임기술인력수, 임원수, 총직원수, 기술직·기능직·사무직 직원수 및 기타 인원수 등 상세 인력 구성 정보를 제공함으로써 업체의 기술 역량과 조직 규모를 입체적으로 분석할 수 있으며, 최종수정일자, 데이터갱신구분, 데이터갱신일자, 회사구분명 등 메타 정보를 함께 제공하여 행정기관의 승강기 안전관리, 점검 계획 수립, 정책 마련 및 업체 관리뿐 아니라 시민과 민간기관이 승강기 제조·수입업체의 기본 현황과 신뢰도를 확인하는 데에도 유용하게 활용할 수 있는 인허가 기반 데이터입니다.
