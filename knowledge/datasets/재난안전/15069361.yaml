summary_user: 전국 건설현장 지반조사 성과 가운데 굴절법 탄성파 탐사 결과를 담는 파일로, 프로젝트·시추공별로 순번에 따라 구간(시작·종료 심도)마다 지층명과 밀도를 기록한 건별 원천 자료다(CSV 약 16KB). 설계·시공 분석가가 특정 조사 지점의 심도별 지층 구성과 밀도가 어떤지 확인할 때 쓴다. 전역 조인 키는 확인되지 않았으며, 같은 지반정보 계열의 다른 자료(시추·시험 결과 등)와는 프로젝트코드·시추공코드를 맞춰 이어 쓰는 방식으로만 연결된다.
limits: 실측 컬럼에서 행정구역 코드나 좌표 같은 전역 조인 키를 찾지 못해, 이 파일만으로는 위치 기반 분석이나 다른 기관 데이터와의 결합이 어렵다. 범위는 전국이지만 비공간 자료로 분류되어 있다.
