summary_user: 경상북도 청도군 관할에서 산사태취약지역으로 지정된 구역을 지번주소와 도·분·초 단위 위경도 좌표로 한 건씩 담고, 지정면적(제곱미터)·지정사유·소유구분·지정고시일·관리기관을 함께 기록한 건별 현황 파일이다. 청도군 주민이나 토지·개발 사업자가 특정 지번이나 주변이 산사태취약지역으로 지정돼 있는지, 언제 어떤 사유로 지정됐는지 확인하는 데 쓴다. 전역 조인 키는 없어 지번주소나 좌표로 다른 재해위험지구·급경사지·토지 규제 레이어와 공간적으로 겹쳐 보거나 주소 매칭으로 연결해야 한다.
limits: 표준 행정코드 같은 공통 조인 키가 없어 다른 데이터와는 주소·좌표 매칭으로만 연결된다. 범위가 청도군 한 곳이라 다른 시군이나 전국 현황은 담지 않으며, 갱신은 수시(지정 시점 기준)라 최신 지정 반영 여부는 데이터기준일자로 확인해야 한다. 좌표가 도·분·초로 나뉘어 있어 지도에 올리려면 십진 도로 변환이 필요하다.
