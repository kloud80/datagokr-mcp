summary_user: 대전광역시경찰청이 관리하는 대전 지역 범죄 발생 건수를 연도(2017~2024년)·범죄 유형(강력·절도·폭력·지능·풍속·기타형법범)별로 나누고, 심야·새벽·오전·오후·초저녁·밤 6개 시간대로 집계한 엑셀 파일이다. 대전에서 어느 시간대에 절도나 폭력 범죄가 많이 일어나는지, 그 추이가 해마다 어떻게 바뀌는지 알고 싶은 시민·연구자·치안 정책 담당자가 순찰 시간대나 안전 대책을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 지역 범죄통계나 대검 처리 통계와는 연도와 범죄 유형 이름을 맞춰서만 이어 쓸 수 있다.
limits: 경찰서·동 단위 공간 구분이 없는 대전 전체 집계라서 지역별 위험도는 비교할 수 없고, 건별 사건 정보도 담지 않는다. 대검 처리 통계와는 집계 기준이 달라 수치를 그대로 맞대어 비교하면 안 된다.
