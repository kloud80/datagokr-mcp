summary_user: 서울 양천구 관내 가로등 설치 현황을 도로구분·노선명·구간별로 가로등 본수(기둥 수)와 등수(등기구 수)를 집계해 담은 CSV 파일(약 7.5KB)이며, 범위는 양천구 한 개 시군구다. 주민이나 구 시설 담당자가 "우리 동네 어느 도로 구간에 가로등이 몇 개 설치돼 있나", "야간 보행이 어두운 노선은 어디인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 노선명·구간 같은 도로 이름을 맞추거나 같은 양천구 자료끼리 이어 써야 한다.
limits: 가로등별 좌표나 개별 시설 단위가 아닌 노선·구간 단위 현황이라 지점 단위 분석에는 쓰지 못한다. 법정동·도로명 코드 같은 표준 조인 키가 없어 타 기관 데이터와 붙일 때 이름 매칭이 필요하다.
