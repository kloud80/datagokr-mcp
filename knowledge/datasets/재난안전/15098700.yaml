description_portal: 최근 7년간(2018~2024년) 해양경찰청의 공무원 국내 위탁 교육 현황에 관한 데이터로서 연도,학사과정,석사과정,고위공무원 및 과장급,단위 등의 항목을 제공합니다.공무원 위탁교육은 공무원이 업무 수행에 필요한 지식과 기술을 습득하기 위해 대학 등 교육기관에서 교육을 받는 제도입니다. 인사혁신처에서 운영하는 인재개발정보센터를 통해 학사 및 석사과정 국내 위탁교육 훈련 계획을 확인하고 참여할 수 있으며, 고졸 공무원의 교육 기회 확대와 직무 역량 강화를 목표로 합니다. 행정환경의 변화와 행정수요의 복잡화ㆍ다양화에 따라 공직사회에 새로운 지식과 기술도입 훈련과제에 대한 심층연구를 통하여 공무원의 직무수행능력 향상 및 행정의 선진화에 기여세계화 지식정보화 사회에 능동적으로 대처할 수 있는 외국어 능력 향상
