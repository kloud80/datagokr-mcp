description_portal: 정보 제공의 목적은 전국적으로 발생하는 화학사고의 발생 현황, 원인, 물질 종류, 피해 규모 등의 정보를 체계적으로 수집·분석하여 이를 국민과 관련 기관에 투명하게 공개함으로써 국민의 알권리를 보장하고 화학물질 안전에 대한 사회적 관심과 경각심을 높이기 위함입니다. 이러한 통계는 중앙정부와 지방자치단체, 산업계, 학계 등 다양한 분야에서 화학사고 예방 대책 수립, 안전관리 정책 개발, 교육 및 훈련 자료, 연구 분석의 기초자료로 활용되며, 궁극적으로는 사고 재발 방지와 신속한 대응 체계 구축에 기여할 수 있습니다.
