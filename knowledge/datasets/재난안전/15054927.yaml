summary_user: 광주 광산소방서 관내 2025년 구조출동을 월별로 집계한 통계로, 월별 구조건수·구조인원과 각각의 연간 대비 비율을 담는다(약 300바이트의 작은 CSV 파일). 광산구에서 어느 달에 구조 출동과 구조 인원이 많은지 보고 계절별 안전사고 예방 대책을 세우려는 주민·지자체 안전 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 월(구분)이나 기관명으로만 맞춰 붙이며, 다른 소방서의 월별 구조·구급 통계나 화재 발생 통계와 나란히 비교하는 방식으로 쓴다.
limits: 월별 집계값만 있어 개별 구조 건의 장소·사고 유형·시각은 알 수 없고 공간 분석도 할 수 없다. 공통 조인 키가 없어 다른 데이터와 연결하려면 월·기관명을 직접 맞춰야 한다.
