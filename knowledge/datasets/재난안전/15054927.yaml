description_portal: '광주광역시 광산소방서 연도별 구조출동 현황(2025년)데이터 개요: 본 데이터는 「119구조·구급에 관한 법률」 제26조에 근거하여 관리되는 광산소방서 관내 구조활동 통계 자료입니다. 2025년 한 해 동안 발생한 구조출동 기록을 월별로 집계하여 시민들에게 공공데이터로 개방합니다.주요 내용:월별 구조건수: 해당 월에 발생한 전체 구조출동 건수건수 비율(%): 연간 총 구조건수 대비 해당 월이 차지하는 비중월별 구조인원: 구조활동을 통해 안전하게 구조된 인원수인원 비율(%): 연간 총 구조인원 대비 해당 월의 구조 비중데이터 활용 가치: 광산구 관내의 시기별 사고 발생 패턴을 분석하고, 지역 사회의 안전 사고 예방 및 맞춤형 안전 대책 수립을 위한 기초 자료로 활용하실 수 있습니다.데이터 출처: 광주광역시 소방안전본부 구조구급활동 통계(긴급구조통제단 운영 기록)'
