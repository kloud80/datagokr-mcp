description_portal: 경찰청 기획조정관실의 민원분야 치안고객만족도(수사) 통계는 수사 서비스에 대한 국민들의 만족도를 연령대별로 분석한 자료입니다. 종합만족도와 전반적만족도 외에도 업무처리절차, 담당자 응대 태도, 서비스 품질, 시설 및 이용환경, 신속성, 지원성, 성실성, 청렴성, 전문성, 공정성, 편리성 등 다양한 요소별 만족도를 제시합니다.전반적으로 연령대가 높아질수록 만족도 또한 상승하는 경향을 보입니다. 특히 60대 이상의 만족도가 가장 높은 반면, 20대 이하의 만족도는 상대적으로 낮은 수준입니다. 각 요소별 만족도 차이를 분석하여, 낮은 만족도를 보이는 항목에 대한 개선 방안 마련이 필요합니다.이를 통해 모든 연령대의 국민들에게 보다 나은 수사 서비스를 제공할 수 있을 것입니다.2025년부터 설문분야 축소로 인한 자료 미제공이니 참고하여 주시기 바랍니다.
