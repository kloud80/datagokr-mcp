description_portal: 이 데이터는 한국승강기안전공단에서 제공한 승강기 안전 인증 현황을 정리한 자료로, 총 2,691건의 인증 이력을 포함하고 있습니다. 주요 컬럼으로는 안전인증번호, 업체명, 주소, 인증서 발행일, 모델명, 적용 안전 기준, 인증 상태, 인증 품목명, 인증 구분, 제조국가 등이 있습니다. 이 데이터는 엘리베이터 및 에스컬레이터와 같은 승강기 설비가 국내 안전 기준을 충족했는지 확인할 수 있는 중요한 정보로, 제조 국가부터 모델 구분, 인증 상태까지 다양한 정보를 통해 안전성과 품질을 검토할 수 있습니다. 특히 제조국가는 주로 한국과 중국으로 나뉘며, 인증 상태로는 "반납" 등의 이력이 있어, 시간에 따라 상태가 변경될 수 있음을 보여줍니다.
