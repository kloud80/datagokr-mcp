summary_user: 한국승강기안전공단이 발급한 승강기·승강기 부품의 안전인증 이력을 인증서 한 건 단위로 담은 파일로, 안전인증번호·업체명·업체 주소·인증서 발행일·모델명과 파생모델명·적용 안전기준·인증서 상태·인증 품목·인증 구분·제조국가를 포함하며 범위는 전국이다. 승강기 설치·구매를 검토하는 사업자나 관리주체가 특정 제조·수입업체의 모델이 어떤 안전기준으로 인증받았는지, 그 인증이 반납 등으로 상태가 바뀌었는지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 승강기 원장이나 점검 데이터와는 업체명·모델명 같은 이름 매칭이나 같은 기관 데이터 안에서만 연결한다.
limits: 개별 설치 승강기의 고유번호나 점검 결과는 담지 않아 특정 현장 승강기의 안전 상태를 바로 알 수 없다. 공통 코드 키가 없어 다른 데이터와 붙일 때 업체명·모델명 표기 차이에 주의해야 한다.
