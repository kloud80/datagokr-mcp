description_portal: 본 데이터는 대전광역시 대덕구 관내 횡단보도 및 교통섬 부근의 폭염 대비 시설물 정보를 제공하는 공공데이터입니다. 여름철 보행자의 온열질환 예방과 쾌적한 환경 조성을 위해 목록을 개방합니다. 항목으로는 시설물의 설치장소명, 시도명, 시군구명, 소재지도로명, 소재지지번명과 위치 파악을 돕는 위도, 경도를 수록합니다. 아울러 그늘막유형, 전체높이, 펼침지름, 설치년도, 관리기관명, 관리기관전화번호를 명시하였습니다. 활용 분야로 민간 지도 서비스의 보행자 경로 안내 기능에 접목할 수 있으며, 공공 및 학계의 취약 지역 분석에 응용 가능합니다.이를 통해 시민의 안전한 통행을 돕고 기후 재난에 대응하는 인프라 확충에 기여할 것입니다.
