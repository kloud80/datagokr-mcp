summary_user: 경상남도 함안소방서가 지정한 관내 중점관리대상을 대상 건물 한 곳당 한 행으로 담은 소규모 CSV 파일(약 2.3KB)로, 대상명·위치·층수·동수·바닥면적·연면적·소방안전관리등급·주요소방시설·위험물허가량·경도·위도를 포함한다. 함안 지역 소방안전 담당자나 분석가가 "관내에서 소방서가 중점 관리하는 대형·고위험 건물은 어디이고 어떤 등급·소방시설을 갖췄는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대상명·주소 문자열 매칭이나 경도·위도 좌표로 위치 기반 연결을 해야 하며, 같은 소방서의 소방용수·화재 발생 데이터와 나란히 보는 용도에 적합하다.
limits: 건물 코드나 표준 주소 코드 같은 공통 키가 없어 건축물대장 등과 바로 조인되지 않고, 이름·주소 매칭에 의존해야 한다. 함안소방서 관할만 담은 파일이므로 경상남도 전체나 다른 소방서 관할의 중점관리대상은 포함하지 않는다.
