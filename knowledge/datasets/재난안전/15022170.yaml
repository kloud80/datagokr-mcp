description_portal: 상황허가는 전략물자에 해당되지 아니하나 그 물품 등의 구매자나 최종사용자가 이를 대량파괴무기 등의 제조, 개발, 사용 또는 보관 등의 용도로 사용할 우려가 있는 경우, 수출 전에 정부의 심사를 거치도록 하는 제도이며, 이에 대한 국제안보 및 세계평화를 위해 무역거래가 제한되거나 무역거래시 주의를 기울일 필요가 있는 단체 및 개인을 나타내는 리스트입니다.(전략물자관리시스템 www.yestrade.go.kr 에서 현재 제공하고 있는 리스트입니다.)우려거래자는 국제안보 및 세계평화를 위해 무역거래가 제한되거나 무역거래 시 주의를 기울일 필요가 있는 단체 및 개인을 말합니다.UN 안전보장이사회, 다자간 국제수출통제체제 회원국 및 각국 정부는 이러한 우려거래자를 선별하여 통보 및 게시하고 있습니다.* 상황허가 대상 우려거래자산업통상부 장관은 UN 안전보장이사회에서 이란, 알카에다, 탈레반, 북한 등 대량파괴무기 확산 국가 및 단체와 관련하여 제재하고 있는 우려거래자에 대해서는관련 법령에 따라 전략물자가 아닌 물품과 기술을 수출하는 경우에도 반드시 정부의 상황허가를 받도록 하고 있습니다.(단, 농수산물·예술품 등 일부 품목은 고시에 따라 상황허가 의무가 면제될 수 있습니다.)* 전략물자관리시스템내 우려자 검색후 모든 물품 수출 시 상황허가를 요하는 우려거래자를 통해UN 안보리 결의 우측에 상황허가 우려거래자 목록(이란, 알카에다/ISIL, 탈레반, 북한) 현행화 자료를 받아 볼 수 있습니다.(전략물자(별표2, 별표3), 상황허가대상물품(별표2의2)
