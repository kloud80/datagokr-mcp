description_portal: 본 데이터는 경상남도 의령군 지역 내 지진 발생 시 주민들이 안전하게 대피할 수 있도록 지정된 옥외 대피장소의 현황 정보를 제공합니다. 데이터는 대피장소로 지정된 시설구분, 시설의 명칭과 상세 도로명 주소, 위경도와 대피장소의 수용가능면적 및 수용가능인원, 담당부서의 연락처 정보를 제공하고 있으며 재난 대응 및 안전 관리 체계 구축을 위한 기초자료로 활용됩니다. 해당 데이터는 지역 주민들에게 재난 발생 시 신속하고 효율적인 대피를 유도하기 위한 목적으로 제공되며, 재난 대응 훈련 및 안전 교육 자료로도 활용 될 수 있습니다. 본 데이터는 정기적으로 갱신되며, 공공기관과 일반 국민 모두에게 개방되어 있습니다. 또한, 지역별 안전 인프라 현황을 파악하고 지진 대비 정책 수립에 필요한 자료로 활용될 수 있습니다.
