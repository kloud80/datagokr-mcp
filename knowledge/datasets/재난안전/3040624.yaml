summary_user: 경기도 양평군에 설치된 가로등을 시설 한 건씩 담은 원천 목록으로, 관리번호·주소·설치연도·등수·위도·경도·기준일자가 들어 있다. 주민이 고장 난 가로등을 관리번호로 신고하거나, 분석가가 밤길이 어두운 구간을 찾을 때 쓴다. 전역 조인 키는 없어서 주소나 위도·경도 좌표로 같은 지역의 CCTV·보안등·안전비상벨 같은 방범 시설 자료와 공간 결합해 쓴다.
description_portal: 경기도 양평군 지역민의 심야 귀갓길  및 활동 보장의(사고예방)  목적으로 설치된 조명 시설(가로등)에 대한 기본 자료를 오픈 함에 따라 설비의 효율적 관리와 주민의 알 권리 충족을 위하여  정보를 제공합니다.- 기본 정보 제공 내용은 관리대장의 부분 내용으로 설비의 설치 위치, 수량, 설치일, 관리 번호로 지역민이 설비 고장시 신고 접수에 필요한 항목임. - 위 내용은 양평군 가로등 및 보안등 설치.관리 조례 제9조에 따라 보유 또는 관리하는 내용의 일부임.- 향후 개방 데이터 이용량에 따라 더욱 많은 정보를 공개하고자 함.
