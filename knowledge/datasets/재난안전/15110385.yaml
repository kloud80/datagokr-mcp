description_portal: 시흥도시공사는 직원과 시민을 대상으로 정기적인 심폐소생술(CPR) 교육을 실시하고 있습니다. 이 교육은 심폐소생술 이론과 실습, 자동심장충격기(AED) 사용법, 응급상황 대처법 등을 포함하여 실제 상황과 유사한 환경에서 반복 실습이 이루어집니다. 최근에는 어린이 가족과 함께하는 교육도 진행되어 부모와 아이가 함께 응급처치법을 익힐 수 있는 기회를 제공합니다. 교육은 시흥시 다수의 센터에서 정기적으로 무료로 운영되며, 시민 누구나 참여할 수 있도록 온라인 사전 신청과 현장 접수를 병행합니다. 특히 응급처치 능력을 강화하기 위해 전문 강사와 CPR 자격증 보유 직원들이 강의를 진행하며 교육의 질을 높이고 있습니다. 교육은 직원과 이용고객을 대상으로 안전교육이 이루어졌으며, 응급상황 시 효과적인 대응 능력을 배양하였습니다. 시흥도시공사는 앞으로도 모든 연령층이 참여 가능한 맞춤형 교육 프로그램을 확대하여 시민 안전 의식을 높이고 있습니다. 유병욱 사장은 심폐소생술이 생명구조에 필수인 기술이라며 지속적 교육 강화를 약속했습니다. 이 프로그램은 지역사회 안전 증진과 시민 건강 보호에 중요한 역할을 하고 있으며, 실습을 중심으로 한 교육 방식이 높은 평가를 받고 있습니다. 앞으로도 시흥도시공사는 응급처치 역량 강화를 통해 안전하고 건강한 지역사회를 조성해 나갈 계획입니다
