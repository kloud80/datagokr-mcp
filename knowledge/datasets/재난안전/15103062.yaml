summary_user: 대구광역시 주요 교차로별로 보행신호 잔여시간 표시기가 어느 방향(동서남북 조합·대각선)에 몇 대 설치돼 있는지를 교차로 한 행 단위로 담은 CSV 파일(약 107KB)이다. 교통약자 보행 정책 담당자나 분석가가 "어느 교차로의 어느 횡단 방향에 잔여시간 표시기가 없어 추가 설치가 필요한가"를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 교차로명(교차로명)을 이름으로 맞춰 대구시 교차로·신호등·교통사고 자료 등과 이어 써야 한다.
description_portal: 대구광역시 주요 교차로에 설치된 보행신호등 보조장치(잔여시간 표시기)의 상세 현황 데이터입니다. 각 교차로 명칭을 기준으로 동서남북 각 방향별 설치 위치와 설치 대수를 정확하게 제공합니다. 이는 보행자가 신호 변경 잔여 시간을 인지하여 안전하게 횡단할 수 있도록 돕는 중요한 정보입니다. 특히 교통약자의 안전한 보행 환경 조성 및 보행 편의 증진을 위한 정책 수립의 핵심 자료로 활용됩니다.이 데이터를 통해 교차로 주변 보행 안전도를 평가하고, 잔여시간 표시기의 설치 필요 지역을 파악하여 효율적인 추가 설치 및 유지보수 계획을 수립할 수 있습니다. 또한, 장기적인 관점에서 대구광역시의 보행 안전 수준을 향상시키는 데 기여할 것으로 기대됩니다.
