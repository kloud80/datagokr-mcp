summary_user: 재난으로 집을 잃거나 머물 수 없게 된 이재민·일시대피자를 위한 임시주거시설을 시설 한 곳씩 담으며, 시설명·주소·수용 가능 인원·면적·경위도 좌표가 들어 있고 범위는 전국입니다. 지자체 재난 담당자나 주민이 '우리 동네에서 재난 때 머물 수 있는 임시주거시설은 어디이며 몇 명까지 들어가나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 행정동·법정동 코드와 도로명주소 코드로 행정구역 자료와 맞추거나 좌표로 다른 대피시설·재난 위험지역 데이터와 겹쳐 본다.
