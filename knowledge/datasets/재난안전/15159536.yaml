description_portal: 본 데이터는 경찰청 국제협력담당관실에서 관리하는 「국외도피사범 국내송환_죄종별 현황」 통계로, 2011년부터 2024년까지 해외로 도피하였다가 국내로 송환된 사범의 현황을 주요 죄종별로 집계한 자료이다. 제공 항목은 연도, 살인, 강도, 성범죄, 절도, 폭력, 사기, 횡령·배임, 마약, 위·변조, 기타 죄종별 송환 건수로 구성되어 있으며, 연도별 송환 규모와 죄종별 증감 추이를 비교·분석할 수 있다. 특히 사기, 마약, 횡령·배임 등 경제·민생침해 범죄의 해외도피 및 국내송환 변화 양상을 파악하는 데 활용 가능하며, 국제공조수사 성과 분석, 주요 도피범죄 유형 식별, 국외도피사범 대응전략 수립, 범죄인 송환 협력 강화 필요 분야 도출 등에 참고할 수 있다.
