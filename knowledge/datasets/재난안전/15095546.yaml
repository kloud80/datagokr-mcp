description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 인구(주민인구, 유동인구) 조회 서비스는 방사능 비상 상황 발생 시 구호물품 배분, 대피소 수용 계획, 구조 활동의 우선순위를 결정하기 위해 특정 구역 내의 실제 거주자와 일시적 체류 인원을 파악하는 핵심 데이터입니다.해당 지역에 주민등록을 두고 실제 거주하는 인구수로, 구호소(대피소)의 장기 수용 계획과 요오드제 등 방호 약품 배분량 산출의 기준이 됩니다.관광객, 직장인, 상업 시설 이용자 등 특정 시간대에 해당 구역에 머무르는 인구입니다. 주로 통신사 데이터나 교통량을 기반으로 추계하며, 사고 발생 시 급격히 늘어날 수 있는 대피 수요를 예측하는 데 쓰입니다.단순 전체 인구가 아니라, '16방위 행정반' 단위로 인구를 쪼개어 제공하므로 사고 지점으로부터의 거리와 방향에 따른 정밀한 피해 예측이 가능합니다.
