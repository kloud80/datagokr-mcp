summary_user: 울산광역시 울주군의 방사능 방재용 인구 정보로, 주민등록 기준 거주 인구(주민인구)와 특정 시간대 체류 인구(유동인구)를 16방위 행정반 단위로 나눠 담으며 범위는 울주군 한 시군구, 행정단위는 읍면동이다. 방재 담당자나 분석가가 원전 사고 시 사고 지점으로부터 방향·거리별로 대피소 수용 인원과 요오드제 등 방호 약품 배분량을 얼마나 잡아야 하는지 따질 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 대피·구호시설 데이터 등과는 읍면동·행정반 이름 매핑이나 같은 기관 코드로만 연결한다.
