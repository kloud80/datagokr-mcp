summary_user: 원주시 재해우려지역에 지정된 대피소를 시설 한 곳당 한 행으로 담은 소규모 CSV 파일(약 1.6KB)로, 구분·시설명·주소·수용인원과 경도·위도 좌표를 포함한다. 원주 시민이나 방재 담당자가 '집 근처 재해우려지역 대피소가 어디이고 몇 명을 수용하는가'를 확인하거나 대피 계획을 세울 때 쓴다. 전역 조인 키는 없으며, 주소나 위도·경도 좌표를 기준으로 재난 위험지역 자료나 다른 대피·구호시설 자료와 공간적으로 겹쳐 본다.
description_portal: 이 데이터는 강원도 원주시 내 재해 우려 지역에 지정된 대피소의 위치와 현황 정보를 투명하게 공개하여, 재난 발생 시 시민의 신속하고 안전한 대피를 돕고 지역의 방재 시스템을 강화하기 위해 구축되었습니다. 해당 기관에서 재해 취약 지역 분석을 기반으로 대피소의 지정 위치, 수용 인원, 재해 유형별 분류 등의 정보를 공적 자료를 통해 수집하고 정제했습니다. 이 정보는 재난 대비 계획 수립에 필수적이며, 시민들이 비상 상황 시 가장 가까운 대피 장소를 즉시 파악하도록 돕습니다. 모든 정보는 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있습니다.
