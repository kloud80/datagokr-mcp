description_portal: 통영시 도시정보시스템에서는 가로등 시설을 효율적으로 관리하기 위해 다양한 속성 정보를 제공합니다. 지형지물부호, 관리번호, 행정읍면동, 도엽번호 등을 통해 가로등의 위치와 식별이 가능하며, 관리기관과 도로구간번호는 유지관리 업무에 활용됩니다. 또한 분전함의 지형지물부호와 관리번호, 설치일자, 등기구 모형, 등주 높이·형식·재질, 암길이, 등기구 수량 등은 가로등의 구조적·기술적 특성을 나타냅니다. 광원 종류, 입력 근거, 연결 여부와 함께 위도·경도 좌표 정보까지 포함되어 있어 실제 현장 점검, 고장 대응, 시설 개선 등 다양한 업무에 활용할 수 있는 체계적인 자료를 제공합니다.
