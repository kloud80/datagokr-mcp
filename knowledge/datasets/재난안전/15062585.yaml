summary_user: 통영시 도시정보시스템에 등록된 가로등을 한 기마다 한 행으로 담은 원천 시설 대장으로, 관리번호·행정읍면동·설치일자·등주 높이와 재질·광원 종류·위도·경도 같은 위치와 구조 속성을 함께 담는다(CSV 약 637KB). 시설 관리자나 생활안전 분석가가 "통영시 어느 읍면동, 어느 도로구간에 오래된 가로등이 몰려 있고 어떤 광원을 쓰는가" 같은 질문을 살필 때 쓴다. 전역 조인 키는 없어서 위도·경도 좌표로 CCTV·안전비상벨 같은 다른 방범시설과 공간적으로 겹쳐 보거나, 행정읍면동 이름으로 맞춰 이어 쓴다.
limits: 다른 데이터와 바로 붙일 공통 코드가 없어 읍면동 이름 매칭이나 좌표 기반 공간 결합으로만 연결된다. 범위는 통영시 한 곳에 한정되어 다른 시군구와 비교하려면 별도 자료가 필요하다.
