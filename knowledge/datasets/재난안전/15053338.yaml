summary_user: 국토안전관리원 COSMIS에서 모은 시설물 사고사례를 위험발생객체·위험발생위치·작업프로세스·인적피해·물적피해·사고원인 6개 항목으로 정리한 전국 단위 비공간 파일입니다(포털 설명상 511행). 건설·시설물 안전관리자나 분석가가 굴착사면·고소 작업처럼 어떤 객체와 위치에서 매몰·추락 같은 피해가 주로 생기는지 위험성 평가와 안전교육 자료로 정리할 때 쓴다. 전역 조인 키가 없으므로 다른 시설 안전 데이터와는 위험객체·작업공정 이름을 맞춰 붙이거나 같은 기관 자료와 내용으로만 연결한다.
description_portal: 국토안전관리원 COSMIS시스템에서 제공하는 시설물사고사례 위험요소별위험성 데이터입니다.데이터는 위험발생객체, 위험발생위치, 작업프로세스, 인적피해, 물적피해, 사고원인 6개의 열과 511개의 행으로 구성되어 있습니다.위험발생객체는 146개로 다양하게 분포하며, 이중 굴착사면이 64개로 가장 많은 경우를 포함하고 있습니다.위험발생위치는 65개로, 고소에서 가장 많은 사고가 발생한 것으로 확인됩니다.인적피해는 13개로 구분되어 있으며, 매몰사고가 가장 많이 발생한 것으로 보여집니다.
