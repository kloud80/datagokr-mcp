summary_user: 한국승강기안전공단이 특정 연도에 실시한 승강기 특별점검(맞춤형 안전점검)의 개별 결과를 승강기 호기 단위 행으로 담은 전국 범위 CSV 파일(약 135KB)로, 같은 특별점검명 아래 여러 호기가 들어 있다. 점검기관·지자체 담당자나 분석가가 "이번 특별점검에서 불합격이나 미점검(접수완료 상태)으로 남은 승강기는 어느 점검 건에 몇 대인가"를 확인하고 재점검·사후조치 계획을 세우는 데 쓴다. 실측 컬럼에 승강기 고유번호 같은 전역 조인 키가 없어 다른 승강기 원장과는 특별점검명·호기 같은 이름 매핑이나 같은 기관 자료 기준으로만 이어 쓴다.
description_portal: ‘한국승강기안전공단_승강기 특별점검 결과’ 데이터는 특정 연도에 실시한 맞춤형 안전점검의 개별 결과를 제공하는 행정기초 데이터입니다. 주요 필드는 특별점검명, 승강기 호기(동일 건물 내 개별 장비 식별), 특별점검 거리(점검 이동·접근 거리 등 내부 지표), 점검여부(Y/N), 특별점검 진행상태(검사완료·불합격·접수완료 등), 특별점검 시작일로 구성됩니다. 본 자료는 불합격 기기의 신속한 사후조치, 지자체 통보·재점검 계획 수립, 위험 설비의 유형·규모 분석, 점검 인력·이동 동선 최적화, 예산·물량 산정 등에 활용됩니다.동일 점검명 아래 다수 호기 행이 존재하며, 점검여부=N인 건은 진행상태에 따라 접수완료 등으로 구분됩니다
