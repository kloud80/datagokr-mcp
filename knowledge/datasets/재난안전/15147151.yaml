description_portal: 서울경제진흥원(SBA)의 2023년 테스트베드 사업을 통해 구축된 본 데이터셋은 화재, 가뭄, 폭설, 다중운집 인파사고 등 총 44종의 재난 유형을 대상으로 수집된 기사 27,000건의 요약 데이터와, 이에 대응하는 400건의 국민행동요령 요약 데이터로 구성되어 있습니다. 이 데이터는 재난 상황을 사전에 탐지하거나 특정 유형의 사건을 분류하기 위한 핵심 키워드를 추출하고 연계할 수 있도록 설계되었습니다. 또한 공공의 안전과 이익을 목적으로 한 연구 및 분석에 활용될 수 있는 재난 말뭉치(Corpus)로, 학계·연구기관·지자체 등 다양한 주체가 재난 대응 체계 개선, 정책 수립, 인공지능 기반 재난 감지 모델 개발 등에 적극적으로 사용할 수 있는 가치 있는 공공 데이터 자원입니다.
