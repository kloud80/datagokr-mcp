summary_user: 광주 북부소방서 관내에서 소방차 진입이 어려운 소방통로 확보대상지역을 노선(구간)별로 한 행씩 담은 파일로, 위치(도로명)·구간거리·도로 폭·세대수를 함께 적는다(포털 설명상 2025년 8월 22일 기준, 파일 2,204바이트 규모). 북구 주민이나 분석가가 "우리 동네 시장 주변 골목이 소방차 진입취약지역인지, 몇 미터 구간에 몇 세대가 사는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 소방 데이터(화재 발생·소방용수 위치 등)와는 도로명 주소나 지역명을 맞춰 연결해야 한다.
description_portal: 광주광역시 북부소방서 2025년 8월 22일 기준 관내 소방통로 확보대상지역 현황 통계 자료입니다. 소방차진입취약지역, 위치, 구간거리 등으로 분류한 각 비율 데이터를 제공합니다.○ 소방차 진입지역(노선명)- 두암시장 주변 / 두암시장 주변 북구 금녕길 23 / 260m- 서방시장 주변 / 서방시장 주변 북구 동문대로 14-14 / 270m- 말바우시장 / 북구 동문대로 73,81,85,97번길(말바우시장) / 315m- 각화동 농산물 도매시장 주변 / 북구 동문대로 260 / 320m- 대원시장 주변 / 북구 임동190-1 / 150m 등등
