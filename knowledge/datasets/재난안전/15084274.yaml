description_portal: 옐로우카펫은 어린이들이 횡단보도를 건너기 전 안전한 곳에서 기다리게 하고 운전자가 이를 쉽게 인지하도록 하기 위해 바닥 또는 벽면을 노랗게 표시하는 교통안전 설치물을 말한다.대구광역시 달서구 내 설치한 옐로우카펫에 대해 정리한 자료를 파일데이터로 공공데이터를 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 설치학교명, 도로명주소, 지번주소, 수량, 설치연도, 관리부서, 기준일자 등으로 구성되어있으며 1년마다 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 어린이 교통사고 예방, 보행환경개산업 등에 참고자료로 활용됩니다.
