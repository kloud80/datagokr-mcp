summary_user: 대전광역시 유성구에 설치된 안전비상벨을 한 개소당 한 행으로 담은 원천 목록으로, 포털 설명 기준 145건이며 관리번호·주소·설치위치·위도·경도(EPSG 4326)와 행정동·법정동 정보를 함께 담는다. 주민이나 분석가가 '우리 동네 골목이나 공원 어디에 비상벨이 있는지', '어느 동에 비상벨이 적은지'를 확인하는 데 쓴다. 법정동코드(bjd_cd)로 같은 지역의 CCTV·보안등·안심지킴이집 등 다른 방범 인프라나 인구·범죄 통계와 동 단위로 잇고, 좌표로 지도 위에 겹쳐 쓴다.
description_portal: '대전광역시 유성구 비상벨 설치 현황에 대한 데이터를 제공합니다.해당 데이터는 번호, 관리번호, 주소, 설치위치, 위도, 경도, 시도이름, 시군구이름, 행정동이름, 법정동이름, 기준일자 등의 항목을 포함하여총 145건의 행으로 구성되어 있습니다.해당 데이터는 지역별 안전 인프라를 분석하는 데 활용할 수 있습니다.또한 범죄예방 정책 수립, 생활안전 서비스 개선 등에 활용 가능합니다.이 외에도 지역 안전도 분석, 생활환경 정보 제공, 시각화 콘텐츠 제작 등 다양한 분야에 활용할 수 있습니다.사용좌표계: EPSG 4326'
