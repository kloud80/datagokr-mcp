summary_user: 광주 남부소방서 관내 1급 소방안전관리자 선임 대상 특정소방대상물 수를 대상물 종류별로, 관할 안전센터(송하·월산·봉선·대촌)별로 나눠 합계와 함께 담은 집계표이며, 건물별 원장이 아니고 723바이트 크기의 작은 CSV 파일이다. 분석가나 소방 행정 담당자가 '남부소방서 관내에서 1급 선임 대상 대상물은 어떤 종류가 많고 어느 안전센터 관할에 몰려 있는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 소방서의 같은 현황표나 소방 데이터와는 안전센터 이름이나 대상물 종류 이름을 직접 맞춰야만 이어 쓸 수 있다.
description_portal: '광주광역시 남부소방서 관내 1급 소방안전관리자 선임 대상 특정소방대상물입니다. - 상세내용: 특정소방대상물 종류별 관할부서 현황 정보 데이터 제공광주광역시 남부소방서는 관내 1급 소방안전관리자 선임 대상 특정소방대상물에 대한 현황 정보를 제공합니다. 이 자료에는 특정소방대상물의 종류별 구분과 관할 부서별 관리 현황이 포함되어 있어 화재 예방과 안전관리 강화를 위한 행정적 지원에 활용됩니다. 또한 관계인은 해당 정보를 통해 법적 선임 의무를 정확히 확인하고 효율적인 안전관리 체계를 구축할 수 있으며, 시민 안전 확보를 위한 기초 데이터로서 중요한 역할을 합니다'
