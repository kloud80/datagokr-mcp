summary_user: 부산광역시 영도구의 이재민 임시대피시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 지역명·시설구분·시설명·상세주소와 수용가능 면적·인원, 담당부서·대표전화를 포함한다. 영도구 주민이 자연·사회재난 때 가까운 대피시설이 어디인지, 몇 명까지 수용하는지 확인하거나 분석가가 동네별 대피 수용력을 따질 때 쓴다. 전역 조인 키나 좌표 컬럼은 없어서, 다른 대피소·재난 데이터와는 상세주소나 시설명을 매칭하거나 지역명으로 묶어 잇는다.
description_portal: 영도구에서는 자연재난 및 사회재난 발생 시 주민들이 신속하고 안전하게 대피할 수 있도록 임시대피시설의 현황 정보를 체계적으로 제공하고 있습니다. 해당 자료에는 각 대피시설의 지역명, 시설구분, 시설명, 상세주소 등이 포함되어 있어 주민들이 주변 시설의 위치와 특성을 쉽게 확인할 수 있습니다. 더불어 재난 대응에 핵심적인 수용가능 면적과 수용가능 인원 정보를 함께 안내하여 실제 상황에서 어느 정도의 인원을 수용할 수 있는지 가늠할 수 있도록 돕습니다. 또한 긴급 상황에서 바로 연락할 수 있는 대표전화 정보도 제공해, 위기 시 필요한 정보를 한 곳에서 빠르게 확인할 수 있도록 지원합니다.
