summary_user: 부산 사상구 관내 민방위 비상급수시설을 시설 한 곳씩 담은 원천 목록으로, 시설명·소재지 주소·하루 공급 규모(톤)·용도(음용·생활용수 등)를 담는다(CSV 약 6.9KB). 주민이나 재난 대응 담당자가 상수도 공급이 끊겼을 때 우리 동네에서 가장 가까운 급수시설이 어디이고 하루 몇 톤을 대는지 확인하는 데 쓴다. 전역 조인 키나 좌표 컬럼은 없어서, 다른 대피·구호시설 데이터와는 소재지 주소를 지오코딩하거나 시설명을 맞춰 이어 써야 한다.
description_portal: 전쟁, 테러, 자연재해 등으로 인해 상수도 체계가 파괴되거나 공급이 중단되는 민방위사태가 발생할 경우, 주민에게 최소한의 음용수 및 생활용수를 안정적으로 공급하기 위해 사상구 관내에는 비상급수시설이 설치되어 있습니다. 이들 시설은 민방위기본법 및 관련 지침에 따라 평시에도 철저히 관리되고 있으며, 비상시 즉시 활용이 가능하도록 준비되어 있습니다. 각 시설은 사상구 전역에 고르게 분포되어 있으며, 시설명, 소재지, 저장용량 등의 정보를 바탕으로 효율적인 물 공급이 가능하도록 운영되고 있습니다. 이러한 비상급수시설은 민방위 사태 발생 시 주민 생존을 위한 필수 기반시설로서 중요한 역할을 하며, 정기적인 점검과 정비를 통해 안정적인 기능 유지에 만전을 기하고 있습니다.
applicable_legislation:
