    source: portal_meta:보유근거
legal_basis_portal: 「민방위기본법」 제2조(정의)민방위는 “적의 침공이나 그 밖의 국가적 재난으로부터 국민의 생명과 재산을 보호하기 위한 모든 자위적 활동”을 의미하며, 생활필수시설 확보도 포함됩니다.「민방위기본법 시행령」 제30조(비상대비자원 관리 등)비상급수, 비상식량 등 생존에 필요한 물자 및 시설을 확보하고 관리해야 함.
