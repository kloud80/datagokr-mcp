summary_user: 광주광역시 서구 관내 폭염 대응용 그늘막(폭염저감시설)을 시설 1개당 1행으로 담은 건별 원천 목록으로, 연번·종류(고정형/접이식 등)·위도·경도로 구성된 작은 CSV 파일(약 8KB)입니다. 주민이나 분석가가 '서구에서 가까운 그늘막이 어디에 있고, 폭염 취약지역에 충분히 설치돼 있는가'를 지도로 확인하거나 따져 볼 때 씁니다. 다른 데이터와 맞출 공통 조인 키는 없으므로, 좌표(위도·경도)를 기준으로 무더위쉼터 등 다른 대피·구호시설이나 열환경 자료와 공간 결합해 씁니다.
description_portal: 이 데이터는 광주광역시 서구 관내 여름철 폭염 대응을 위한 ‘그늘막(폭염저감시설)’의 설치 현황을 정리한 공공데이터입니다. 각 시설별 고유번호(연번), 설치 종류(고정형/접이식 등), 위도 및 경도 좌표 등의 항목으로 구성되어 있습니다. 해당 자료는 폭염 취약지역 보호, 시민 휴게공간 제공, 도시 열환경 개선 등 생활안전 관련 정책 수립 및 시설 확충에 활용될 수 있으며, 열섬현상 분석, 공공시설 유지관리, 재난 예방 행정업무, 민간 캠페인 기획 등 다양한 분야에 참고자료로 사용될 수 있습니다. 각 행은 하나의 그늘막 시설 정보를 담고 있으며 CSV 형식으로 제공됩니다. 좌표(X/Y)를 포함하고 있어 위치기반 공간정보 분석이 가능하며, 데이터는 주기적으로 갱신됩니다.
