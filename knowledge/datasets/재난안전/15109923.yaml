summary_user: 2021년 전국 연안해역에서 일어난 안전사고를 한 건씩 담은 원천 파일로, 사고마다 발생일자, 추락·익수·고립·표류 등 세부 사고유형, 사망·실종 인원, 도·분·초 단위 위경도 좌표를 기록한다. 지자체나 안전 분석가가 '방파제·갯바위·갯벌 가운데 어느 해안 지점에서 추락·고립 사고가 몰리는가'처럼 사고 다발 위치를 찾고 위험구역 안내나 순찰 배치를 정할 때 쓴다. 전역 조인 키나 행정구역 코드는 없으므로 도·분·초 좌표를 십진 위경도로 바꾼 뒤 파출소·인명구조함 위치나 해수욕장 같은 다른 위치 데이터와 공간으로 겹쳐 쓴다.
description_portal: '연안해역에서 안전사고 발생 현황(2021년)에 관한 데이터로서 사고가 발생한 일자,추락ㆍ익수ㆍ고립ㆍ표류 등의 사고 유형에 대한 상세 분류, 연안사고로 인해 사망한 인원 및 실종 인원, 사고 지점에 대한 세부 좌표(위도_도,위도_분,위도_초,경도_도,경도_분,경도_초) 등의 항목을 제공합니다."21년 연안사고는 총 717건 발생, 사고로 인한 인명피해는 109명 입니다.세부적으로 익수사고는 183건 발생, 67명 사망ㆍ실종, 추락사고는 234건 발생, 34명 사망ㆍ실종, 고립사고는 187건 발생, 7명 사망ㆍ실종, 표류사고는 38건 발생, 0명 사망ㆍ실종, 기타사고는 49건 발생, 2명 사망ㆍ실종 하였으며, 기타사고는 익수, 추락, 고립, 표류사고에 해당하지 않은 사고를 말합니다.(예시: 물이끼를 밟고 미끄러지는 사고 등)연안에서 발생한 사고는 주로 해수욕장, 해안가 등에서의 물놀이 중 익수, 항포구, 방파제(테트라포드), 갯바위 등에서 낚시 중 실족 또는 음주로 인한 실족 또는 차량조작 미숙 등의 원인으로 추락갯벌에서 해루질, 관광 중 물때 미인지로 인한 고립 등의 사고가 대부분 입니다.'
