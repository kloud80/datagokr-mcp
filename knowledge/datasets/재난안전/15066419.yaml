description_portal: 본 데이터는 경찰청 여성청소년범죄수사과에서 관리하는 통계로, 2014년부터 2025년까지 국내에서 발생한 성폭력범죄 피의자의 검거 후 신병 처리 현황을 담고 있습니다.연도별로 구속과 불구속 인원을 구분하여 제공하며, 이를 통해 성범죄 수사 과정에서의 강제수사 비율과 사법 처리 경향을 파악할 수 있습니다. 특히 2010년대 중반 이후 불구속 수사 원칙에 따라 불구속 인원이 점진적으로 증가하는 추세와 함께, 디지털 성범죄 및 강력 성범죄 등 사안의 중대성에 따른 구속 수사 추이를 비교 분석하는 데 유용한 기초 자료로 활용될 수 있습니다. 성폭력 범죄 근절을 위한 정책 수립 및 학술 연구의 정량적 지표로 권장합니다.
