description_portal: 대전광역시_특사경 지명 분야 별 수사(단속)활동 세부 실적 데이터는 2018년 한 해 동안 특별사법경찰의 지명 7대 분야 별 수사(단속) 업무 결과를 상세하게 기록한 자료입니다. 해당 데이터는 각 분야 별 점검 대상 업체 수, 송치(고발) 건수, 행정 처분 건수 등 주요 실적 항목을 포함하여 지명 분야 별 단속 활동의 양적·질적 현황을 객관적으로 파악할 수 있게 정리되어 있습니다. 이를 통해 연도 별 중점적으로 관리 대상이 된 분야와 처분 조치 유형, 단속 과정에서 드러난 위반 사례의 빈도 및 유형 등을 분석할 수 있어, 향후 단속 계획 수립과 정책 보완, 위반 업체 재발 방지, 법규 이행력 제고, 유관 부서 협업 체계 강화 등 행정적·실무적 활용 될 수 있습니다.
