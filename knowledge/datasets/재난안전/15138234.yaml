description_portal: 한국승강기안전공단이 승강기 안전검사 수수료 납부를 위해 발급하는 ‘검사신청 가상계좌’의 수시 발행 이력을 표준화해 제공하는 자료입니다. 각 행은 고객안내번호, 등록일자, 입금기한, 청구금액, 건물관리번호 등 발행 기본 정보를 포함하며, 동일 현장에 대한 재발행·취소 등 반복 발행이 존재할 수 있습니다. 본 데이터의 목적은 가상계좌 발행 과정의 투명성과 추적 가능성을 확보하고, 내부 행정의 정합성 점검(등록일자–입금기한 관계, 식별자 형식 검증 등)과 대국민 정보 제공의 기반을 마련하는 데 있습니다. 제공 범위는 공단이 관리하는 검사신청 건 중 수시 발행된 가상계좌의 메타정보에 한하며, 실제 입금 처리, 정산 결과, 검사 진행 여부 등 상태 값은 별도의 원장·시스템에서 관리됩니다.
