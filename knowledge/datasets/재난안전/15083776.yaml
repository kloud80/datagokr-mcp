summary_user: '대구 달서구에 설치된 CCTV를 설치 지점 한 곳당 한 행으로 담은 건별 원천 파일로, 위도·경도와 도로명·지번 주소, 설치목적, 카메라 대수·화소, 촬영방면, 보관일수, 설치연도를 함께 담는다. 주민이 집이나 통학로 주변에 방범 CCTV가 있는지 확인하거나, 분석가가 동네별 CCTV 밀도와 사각지대를 따져 볼 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 좌표 근접이나 주소 매칭으로 잇는다(예: 안전비상벨·보안등·범죄 통계).'
description_portal: 본 데이터는 안전지역 확대 및 주민 불안감 해소 등 을 위한 각종 안전위협 요인으로부터 주민의 안전을 지키고자  CCTV를 설치한 위치에 대해 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 관리기관명, 소재지도로명 주소, 소재지지번주소, 설치목적구분, 카메라대수, 카메라화소수, 촬영방면정보, 보관일수, 설치연도, 관리기관전화번호, 관리부서, 기준일자 등으로 구성되어있습니다.해당 자료는 1년마다 주기에 따라 최신정보를 반영하여 현행화합니다.
