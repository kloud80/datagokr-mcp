description_portal: 본 데이터는 2022년 공공데이터 기업매칭 지원사업을 통해 구축된 충청북도 충주시 재난위험요인DB 중 ‘복합재난위험시설’ 정보입니다.데이터 항목은 관리번호, 읍면동, 시설 주소, 위도·경도 좌표, 종합 위험도 점수, 위험 등급으로 구성되어 있으며,자연재난과 사회재난이 중첩되어 발생할 수 있는 복합재난 취약시설의 위치와 위험도를 체계적으로 정리한 자료입니다.복합재난위험시설은지형적·환경적 여건상 다중 재난 발생 가능성이 높은 시설주거지, 산업단지, 취약계층 밀집지역 등의 주요 기반시설화재, 침수, 붕괴, 폭발 등의 동시 또는 연쇄 재난이 발생할 우려가 있는 장소를 포괄합니다.위험도 점수는 시설 노후도, 인근 위험요소, 인구밀도, 대피곤란성 등을 종합 평가하여 산정되며,등급은 상대적 위험 수준을 등급화한 것으로, 위험도 분석 및 우선 대응 대상 선정에 활용됩니다.이 데이터는복합재난 예방을 위한 선제적 대응계획 수립도시 안전관리 기본계획 수립 시 취약시설 우선 점검 근거자료 제공재난 예·경보 시스템 구축 및 위기경보 발령 기준 설정재난관리 예산의 효율적 배분과 민간 협력대응 모델 개발등 다양한 정책 수립 및 대응 전략의 기반 자료로 활용 가능합니다.※ 해당 정보는 실시간 상황과 차이가 있을 수 있으며, 재난대응본부 또는 관할 부서의 현장 확인과 병행되어야 합니다.
