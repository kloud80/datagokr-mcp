summary_user: 충주시 재난위험요인DB 중 자연재난과 사회재난이 겹칠 수 있는 복합재난 취약시설을 시설 한 곳 단위로 담으며, 읍면동·주소·위도경도 좌표와 종합 위험도 점수·위험 등급을 포함한다. 시 안전 담당자나 분석가가 '충주시에서 화재·침수·붕괴가 겹칠 위험이 큰 시설은 어디이고 어느 것부터 점검해야 하나'를 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 읍면동 이름이나 좌표(지도 위 공간 겹침)로 이어야 하며, 대피·구호시설이나 다른 위험지역 데이터와 위치를 맞대어 쓰는 방식이 현실적이다.
limits: 사업 때 한 번 만들고 고치지 않는 자료라서 실시간 위험 상황을 반영하지 않으며, 현장 확인과 함께 써야 한다. 범위는 충주시 한 곳뿐이다. 응답은 지도형(type·properties·geometry) 구조이므로 위험도 점수와 등급은 properties 안에서 꺼내야 한다.
