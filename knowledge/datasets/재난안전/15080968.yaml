summary_user: 세종특별자치시 소방서·119안전센터에 접수된 신고 중 화재·구조·구급이 아닌 기타 종별 신고를 담은 CSV 파일(약 10.7MB)로, 포털 설명은 집계 자료라고 하지만 필드는 일련번호·접수일시·상황종료일시·종별·분류·규모·관할서·센터가 있어 신고 건별 기록에 가깝고, 포털 설명상 기간은 2012~2020년이다. 소방 분석가나 행정 담당자가 '세종시에서 벌집 제거·동물 포획 같은 생활안전 신고가 어느 계절, 어느 동·리, 어느 센터에 몰리는가'를 확인하는 데 쓴다. 전역 조인 키는 없고, 우편번호·동명·리명(긴급구조동명)과 관할서·센터 이름으로 행정구역 코드나 119안전센터 위치 자료에 이름 매핑해 붙인다.
description_portal: 2012년부터 2020년까지 세종특별자치시에서 발생한 각종 재난 및 안전사고 중 화재, 구조, 구급과 같이 주요 유형으로 분류되지 않는 기타 신고 건수를 집계한 자료입니다. 이 데이터는 세종시 관할 소방서 및 119안전센터에 접수된 특수·이례적 사건을 포함하며, 주로 **생활안전 관련 신고(벌집 제거, 동물 포획, 위험물 처리 요청 등)**이나 재난으로 분류되는 낙뢰, 붕괴, 가스·전기 사고 등 다양한 범주가 포함될 수 있습니다.자료에는 연도별·월별로 분류된 신고 건수와 센터별 접수 현황이 제공되어, 특정 시기나 계절에 따라 어떤 ‘기타 재난’ 신고가 늘어나는지 확인할 수 있습니다. 이를 통해 주요 사고 외에도 실제로 시민 생활에 영향을 주는 다양한 안전 수요를 파악할 수 있으며, 소방당국은 이를 토대로 예방 캠페인 기획, 장비 및 인력 보강, 안전 취약 지역 관리 등에 활용할 수 있습니다.결국 이 데이터는 세종시 내에서 자주 발생하지만 일반적 재난 통계에 포함되지 않는 신고 유형의 실태를 보여주는 자료로, 재난 관리 정책의 사각지대를 보완하는 데 중요한 의미를 갖습니다.
