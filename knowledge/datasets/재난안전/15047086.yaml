description_portal: '○ 통계개요* 통계명 : 위험물 제조소 설치현황* 통계종류 : 서울시 위험물 관련시설 설치현황을 소방서별로 제공하는 일반ㆍ보고통계* 근거법령 : 위험물안전관리법 제6조(위험물시설의 설치 및 변경 등)* 작성목적 : 위험물 제조소, 주요취급소, 저장소 등의 설치현황을 파악하여, 사고 방지 및대응 등 효과적 관리를 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 소방서 → 서울특별시 소방재난본부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 소방서내용 - 위험물 제조소 등의 설치현황 등○ 용어설명* 위험물 : 인화성 또는 발화성 등의 성질을 가지는 것으로서 대통령령이 정하는 물품* 제조소 : 위험물을 제조할 목적으로 지정수량 이상의 위험물을 취급하기 위하여허가를 받은 장소* 취급소 : 지정수량 이상의 위험물을 제조 외의 목적으로 취급하기 위한 대통령령이정하는 장소로서 허가를 받은 장소* 저장소 : 지정수량 이상의 위험물을 저장하기 위한 대통령령이 정하는 장소로서허가를 받은 장소○ 기 타* 명칭변경 : 성동소방서 → 광진소방서 (2008.01.01)○ 출 처 : 서울특별시 소방재난본부 예방과'
