description_portal: '○ 통계개요* 통계명 : 차량용도별 교통사고 현황* 통계종류 : 서울시 차량용도별로 교통사고 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「도로교통법」제2조에 규정하는 도로에서 차의 교통으로 인하여발생한 인적피해를 수반하는 교통사고* 작성목적 : 교통위반 및 사고 현황을 종합적이고 체계적으로 분석하여 교통안전대책 수립, 학술연구 등의 기초자료 및 국민의 교통안전의식 제고에활용하는 것을 목적으로 함* 조사체계 : 서울지방경찰청 → 서울특별시* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 차량용도별 교통사고의 발생건수 및 사망자·부상자 수 등○ 용어설명* 교통사고 : 도로교통법 제2조에 규정하는 도로에서 차의 교통으로 인하여 발생한 인적,물적피해가 따르는 사고* 사망 : 교통사고 발생시로부터 30일 이내에 사망한 경우(99년까지는 72시간 이내)○ 기타* 사고발생지역 단위(서울시) 기준임* 가해운전자 기준* 시내버스에 마을버스 포함* 택시 : 개인택시+법인택시, 화물 : 일반화물+개별화물+용달화물* 이륜차에 사륜오토바이( ATV), 원동기장치자전거, 개인형이동수단(PM) 등 포함* 사업용차량 기타 : 특수여객(장의), 콘크리트믹서, 위험물운송, 덤프트럭,기타건설기계 등 포함* 비사업용차량 기타 : 콘크리트믹서, 위험물운송, 기타화물차, 사발이 등 포함○ 출 처 : 도로교통공단 교통사고분석시스템(TAAS) 교통사고통계'
accrual_periodicity: 수시
