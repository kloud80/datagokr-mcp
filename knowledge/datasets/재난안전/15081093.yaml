summary_user: 세종특별자치시 안에서 지진이 났을 때 주민이 잠시 몸을 피하는 운동장·공원 같은 옥외대피장소를 한 곳씩 담은 건별 현황 파일로, 장소마다 도로명주소와 위도·경도 좌표, 수용 가능 면적과 최대 수용인원, 운영 상태, 관리기관이 들어 있다. 세종시 주민이나 학교·사업장 안전 담당자가 "지진이 나면 우리 동네에서 가장 가까운 대피장소는 어디이고 몇 명까지 들어갈 수 있나"를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 위도·경도로 다른 대피·구호시설이나 재난 위험지역 자료와 공간 결합하거나 주소·관리기관명을 맞춰 연결한다.
description_portal: 세종특별자치시 내 지진 발생 시 지역주민들이 일시적으로 대피할 수 있는 운동장, 공원 등 지진 옥외대피장소에 대한 현황 자료입니다.
