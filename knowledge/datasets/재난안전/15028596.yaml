summary_user: 부산광역시 연제구의 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 원장으로, 시설명·도로명/지번 주소·위도·경도·용량(톤수)·수질 구분·시설 구분을 담는다. 상수도 공급이 끊겼을 때 연제구 주민이 가까운 비상급수시설이 어디이고 용량이 얼마인지 확인하거나, 구청·분석가가 급수 지원 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 매칭이나 위경도 좌표로 이어 쓰고, 같은 세부 부문의 민방위 대피시설·지진해일 대피장소 등과 함께 재난 시 대피·구호 위치 지도로 묶어 쓴다.
description_portal: 부산광역시 연제구 민방위 비상급수시설 현황입니다.민방위 비상급수시설이란 전쟁 및 상수도 체계의 파괴 등과 같은 민방위 사태 발생으로 상수도 공급 중단 시 최소의 음용수 및 생활용수를 주민에게 공급하기 위한 시설입니다.시설명, 도로명 주소, 지번 주소, 위도, 경도, 용량, 수질 구분, 시설 구분 등의 정보를 제공합니다. 이를 통해 재난 상황 시 비상 대응 계획 수립 및 신속한 급수 지원이 이루어질 수 있으며, 주민의 생명과 안전을 보호하는 데 중요한 자료로 활용됩니다.자세한 정보는 연제구청 도시안전과로 문의 바랍니다.
