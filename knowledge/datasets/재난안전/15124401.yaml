description_portal: '국토교통부에서 제공하는 ‘항공장애표시등’ 데이터는 항공기의 안전한 운항을 위해 고층건축물, 송전탑, 통신탑 등 공중 장애물에 설치된 항공장애표시등의 현황을 관리하는 자료입니다. 해당 데이터는 항공안전정책 및 도시 내 장애물 관리, 비행안전 분석 등의 기초정보로 활용됩니다.1. 형식: CSV (엑셀 호환)2. 내용 요약   ■ 장애물명: 항공장애표시등이 설치된 대상물의 명칭 (예: SK빌딩, 서울타워 등)   ■ 장애물종류: 건축물, 굴뚝, 송전탑, 방송안테나 등 장애물 유형 구분   ■ 소재지: 장애물이 위치한 행정주소 (예: 서울특별시 용산구 용산2가동 산1-3)   ■ 높이(지면): 지면으로부터 장애물 상단까지의 높이(미터 단위)   ■ 장애물제한구역여부: 항공법상 제한구역 내 포함 여부 (예: 장애물제한구역 내/밖)   ■ 항공장애표시등(고광도A~저광도E): 밝기 등급별 항공장애표시등의 설치 개수     * 고광도: 고층건물, 통신탑 등 항공기 접근이 잦은 구역에 설치     * 중광도, 저광도: 상대적으로 낮은 구조물이나 보조표시용으로 사용   ■ 주간표시종류구분: 낮 시간대 식별을 위한 표시 방법(도색, 주간표지없음 등)   ■ 주간표시 설명: 도색 패턴, 주간식별 관련 추가 정보3. 활용 예제   ■ 공항 주변 또는 항공기 운항경로상의 고층 건축물 관리 및 비행안전 확보를 위한 장애물 지도 구축   ■ 항공장애표시등의 설치 유형과 위치를 분석하여 야간 항공안전 정책 및 도시 조명 계획 수립   ■ 드론 비행 허가, 항공촬영, 송전선 관리 등 저고도 비행활동 시 장애물 정보를 사전 검토하는 참고자료로 활용   ■ 지자체·항공청·소방청 간 데이터 연계를 통해 고층 건축물 안전점검, 재난대응, 항공사고 예방 업무에 활용'
