summary_user: 인천 미추홀구 안의 급경사지를 한 곳씩 담은 목록으로, 급경사지명·위치·용도·유형·구조·위험 등급·관리기관·공공/민간 구분·담당 부서를 행 단위로 담는다(시군구 범위, CSV 약 2.4KB의 소규모 파일). 주민이나 안전 담당자가 '우리 동네 근처에 위험 등급이 높은 급경사지가 어디 있고 어느 부서가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위치(주소) 문자열이나 급경사지명으로 맞추거나, 같은 재난 특보·위험지역 계열의 다른 구·시 급경사지 목록과 이름 매핑으로만 이어 쓴다.
limits: 표준 코드(법정동코드·시설 ID 등)가 없어 다른 데이터와 자동 결합이 어렵고 주소·명칭 매칭이 필요하다. 범위가 미추홀구 하나뿐이라 인천 전역이나 전국 비교에는 다른 지자체 파일을 따로 모아야 하며, 명세상 연간·이벤트 주기로 갱신되므로 실시간 위험 상태를 보여주지 않는다.
