summary_user: 경기도 파주시가 설치한 생활방범 CCTV를 카메라 1대 단위로 담은 파일(CSV)로, 카메라 형태·제조사·모델명, 녹화 채널, 고·저해상도 녹화 지정, 용도, 읍면동 단위 설치지역과 설치유형, 녹화 보존일수 제한, 저장장치 장애 복구시간(초), 관리부서를 포함한다. 분석가나 지자체 담당자가 '파주시 읍면동별로 방범 CCTV가 몇 대이고 영상은 며칠 보존되는가', '어떤 제조사·모델 장비가 주로 쓰이는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 설치지역(읍면동) 이름을 맞추는 방식으로만 연결하고, 위치 좌표는 전국CCTV표준데이터를 함께 봐야 한다.
description_portal: 경기도 파주시의 공공안전 및 범죄예방을 목적으로 설치된 생활방범 CCTV에 대한 세부정보를 제공하는 정형데이터로, 카메라의 형태, 이름, 제조사, 모델명, 녹화 채널 수, 고해상도 및 저해상도 녹화지정,용도,읍면동 단위의 설치지역,설치유형,보존 정책 정보인 녹화일수제한사용여부,녹화제한일수,저장장치 장애 발생 시 복구에 소요되는 스토리지장액복구시간(초 단위) 등으로 구성되어 있으며, 공공안전 정책 수립, CCTV 설치의 공간적 분포 분석, 영상 저장 기술 연구, 스마트시티 인프라 분석 등에 유용하며, 이를 활용한 다양한 알고리즘 개발, 데이터 시각화, 또는 공간정보 기반 보안 시스템 연구 등에 활용될 수 있습니다.설치된 위치정보와 관련한 현행화 자료는 '전국CCTV표준데이터'를 참고하시기 바랍니다.
