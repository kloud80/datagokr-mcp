description_portal: 해상집단행동 연도별 현황 데이터는 2018년부터 2025년까지 해양수산 분야에서 발생한 해상집단행동을 연도별로 집계한 통계 데이터입니다.본 데이터는 해상집단행동 발생 추이 분석, 해양수산 분야 공공갈등 관리, 정책 수립, 행정지원, 연구 및 통계분석을 목적으로 작성되었습니다.해상집단행동은 어업인, 수산단체, 지역주민 등이 선박 또는 인력을 동원하여 해상에서 실시한 집회, 시위, 항의행동, 선박행진, 집단민원 제기 등 집단적인 의사표시 활동을 의미합니다.데이터는 국책사업 관련 해상집단행동과 기타 해상집단행동으로 구분하여 발생 건수, 참여 선박 수, 참여 인원 수를 연도별로 제공합니다.국책사업은 해상풍력, 항만개발, 어항개발, 공유수면 매립, 해양개발사업, 국가 또는 지방자치단체 추진사업 등과 관련하여 발생한 해상집단행동을 의미합니다.기타는 국책사업 외 수산정책, 어업규제, 조업구역 갈등, 해양환경 문제, 지역현안, 수산업 관련 민원 등으로 발생한 해상집단행동을 의미합니다.제공 데이터는 연도, 국책사업 발생횟수, 국책사업 참여선박수, 국책사업 참여인원수, 기타 발생횟수, 기타 참여선박수, 기타 참여인원수로 구성되어 있습니다.
