summary_user: 경상남도 내 급경사지 붕괴위험지구를 지구 한 곳당 한 행으로 담은 파일로, 주소·용도·길이·높이·평균 경사도·관리기관·재해위험도 평가점수와 등급·지정 고시일과 해제일·상시 계측과 주민대피 기준 수립 여부를 개별 주소 단위로 기록한다. 주민이나 지자체 방재 담당자가 '우리 동네 근처 급경사지 중 재해위험도 등급이 높고 붕괴위험지역으로 지정된 곳은 어디이며 정비사업은 진행됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군구명·주소 문자열로 다른 재해위험지구·대피시설 데이터나 토지 규제 레이어와 맞춰 이어 써야 한다.
description_portal: 경상남도 급경사지 붕괴위험지구 지정현황을 지구명, 시도, 시군구, 주소, 용도, 분류, 길이, 높이, 평균 경사도, 관리기관명, 관리자 유형, 재해위험도 평가점수 및 등급, 붕괴위험지역 지정 고시일자, 붕괴위험지역 상시 계측 내용,  붕괴위험지역 주민대피관리기준 수립여부,  붕괴위험지역 지정해제일자, 기타 사고발생 내용, 기타 산마루측구여부, 기보, 데이터기준일자 등의 항목으로 제공합니다.* 위치, 용도, 제원 등등 다수의 항목에서 취합되지 않은 데이터 일부는 제공되지 못하는 점 양해 바랍니다.
