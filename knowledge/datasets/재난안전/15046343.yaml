description_portal: '○ 통계개요* 통계명 : 외국인 범죄현황* 통계종류 : 외국인 범죄 현황을 월별로 제공하는 일반ㆍ보고통계* 작성목적 : 범죄의 검거현황과 유형의 변화추이 등을 조사ㆍ측정하여 범죄의예방과 검거대책 수립 등 형사대책 및 사회정책 수립에 기초자료를제공하는 것을 목적으로 함* 조사체계 : 서울지방경찰청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 서울시 외국인 범죄의 범죄유형별 현황 등○ 용어설명* 외국인 범죄 : 범죄의 주체가 외국 국적을 가진 사람에 의하여 행해진 범죄로서대한민국 영토내에서 대한민국의 형벌법규에 위배되는 행위를 한 경우를 말함* 지능범 : 각종문서위·변조,공정증서원본불실기재, 사기, 횡령, 통화위조등* 기타 : 의료법, 상표법, 외국환관리법, 신용카드 위·변조, 도로교통법, 식품위생법 등○ 기타* 1999~2003년 살인, 강도, 강간의 수치가 합쳐짐* 2010년부터 성범죄는 강간에 포함하여 집계○ 출 처 : 서울지방경찰청'
