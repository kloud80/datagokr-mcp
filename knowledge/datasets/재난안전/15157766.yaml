description_portal: 국토안전관리원에서 관리하는 국내 특수교량에 이상신호가 감지된 시점을 기준으로 전후 30초씩 총 1분간 촬영된 CCTV 영상이 포함된 영상형식 파일데이터입니다. 본 데이터는 특수교량의 안전관리 및 유지관리 과정에서 수집된 영상자료로서, 이상신호 발생 전후의 현장 상황을 시각적으로 확인할 수 있도록 구성되어 있습니다. 이를 통해 교량 및 주변 환경에서 발생하는 이상 징후, 돌발상황, 통행 상태 변화 등을 파악할 수 있으며, 특수교량의 안전점검, 이상원인 분석, 사고 예방, 유지관리 업무 지원 등을 위한 기초자료로 활용될 수 있습니다. 또한 본 데이터는 영상기반  객체 검출, 이벤트 탐지, 위험상황 식별, 이상행동 분석 등 다양한 인공지능 기술 개발 및 학습데이터 구축에 활용 가능하며, 특수교량 분야의 지능형 안전관리 체계 고도화와 디지털 기반 유지관리 기술 확산을 지원하기 위해 개방하는 자료입니다.
