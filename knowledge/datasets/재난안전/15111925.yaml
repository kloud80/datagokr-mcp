summary_user: 안양시 안에서 기계설비 성능점검과 유지관리자 선임 대상인 건축물을 건물 한 동씩 담은 목록으로, 건물명·우편번호·주소·연면적이 들어 있다. 건축물 관리주체가 우리 건물이 성능점검 대상인지 확인하거나, 분석가가 안양시 안에서 점검 대상 건물이 어디에 얼마나 몰려 있는지 살펴볼 때 쓴다. 전역 조인 키는 없어서 다른 시설 안전 데이터나 건축물대장과는 주소나 건물명을 맞춰서 이어야 한다.
description_portal: 본 데이터는 "기계설비 유지관리기준"(21.8.9. 시행) 제7조에 의거, 안양시 내 기계설비 성능점검 및 유지관리자 선임대상 건축물 현황을 제공합니다. 건축물 관리주체의 유지관리 및 성능점검 계획 수립 의무 이행을 돕고, 건축물 안전과 효율적인 기계설비 관리에 활용할 목적으로 수집되었습니다. 세부 항목은 기계설비 유지관리 및 성능점검 대상 건축물의 관련 정보로 구성됩니다. 안양시 건축물의 기계설비 성능점검 대상 현황 파악을 통해 건축물 에너지 효율 관리, 노후 설비 교체 계획 수립, 안전사고 예방 등 건축물 관리의 효율성을 높이는 데 기여할 것으로 기대합니다. 시민들이 안전하고 쾌적하게 생활할 수 있는 환경 조성에 중요한 기반 자료로 활용될 것입니다.
