summary_user: 광양시가 자연재해로 인명피해가 우려되는 곳으로 지정한 지역을 지구 단위로 한 줄씩 담은 시군구 범위 파일(CSV)로, 지구명·읍면동·분류·지번 및 도로명 주소·대피장소·데이터기준일이 들어 있다. 광양시 주민이나 방재 담당자가 '우리 동네 어디가 인명피해우려지역이고, 위험 시 어디로 대피하나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 읍면동 이름이나 주소 문자열로 대피소·재해위험지구 같은 다른 위험지역 자료와 맞춰 이어 쓴다.
description_portal: 전라남도 광양시의 인명피해우려지역 지정 현황 데이터는 자연재해로 인한 인명 피해를 예방하기 위해 지정된 지역들의 기본 정보를 수록한 자료입니다. 이 데이터는 위험지역별 분포, 지정 사유, 대피 기준 및 장소 등을 포함하며, 지역 주민과 행정기관이 재난 발생 시 신속하게 대응할 수 있도록 지원합니다. 특히 분류와 대피기준 항목은 피해 유형에 따라 대응 매뉴얼을 구분하는 데 활용되며, 대피장소는 주민 대피를 위한 실질적 시설 운영에 중요합니다. 데이터기준일은 정보의 최신성을 판단하는 기준이 되며, 정기적인 업데이트가 필수적입니다. 이 데이터는 재해위험지역 현황공개, 재난안전지도 구축, 대국민 정보공개 등에 폭넓게 활용될 수 있습니다.
