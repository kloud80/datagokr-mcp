summary_user: 김포시 내 가로등을 표찰번호 단위로 한 줄씩 담은 건별 원천 데이터로, 행정동·리·지번 주소와 위도·경도, 등주형태, 총 등수, 관리기관 정보를 포함하며 CSV 파일(약 2.9MB)로 활용신청 없이 받는다. 주민이나 생활안전 분석가가 '우리 동네 어느 골목에 가로등이 부족한가'처럼 지역별 가로등 분포와 개수를 확인하고 야간 방범 취약지를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표나 행정동·지번 주소를 매핑해 CCTV·안전비상벨 같은 방범 인프라 위치와 겹쳐 보는 방식으로 이어 쓴다.
limits: 김포시 한 개 시군구만 담고 있어 다른 지역과 비교하려면 별도 데이터가 필요하다. 행정코드 같은 공통 키가 없어 연계는 주소 문자열이나 좌표 매칭에 의존해야 한다.
