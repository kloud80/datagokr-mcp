description_portal: 경기도 김포시의 가로등에 대한 정보를 제공합니다. 제공 항목으로는 표찰번호, 주소, 등주형태, 총 등수, 고객번호, 관리기관 전화번호와 기관명으로 구성되어있으며 주소는 지번과 위도, 경도의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 데이터를 통해 김포시 내 지역별 가로등 분포 위치와 개수 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 도로관리과로 연락주시기 바랍니다.
