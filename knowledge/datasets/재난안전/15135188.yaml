description_portal: 구조구급시스템을 통해 수집된 ‘심폐정지 관련 구급 활동 보고서’ 데이터는 생사의 갈림길에 선 응급환자에 대한 구체적인 출동 기록과 처치 내역을 담고 있는 중요한 자료입니다. 데이터 항목으로는 심정지 발생 시각, 목격 여부, 현장 도착 시간, CPR 시행 여부, AED 사용 기록, 환자 반응 여부, 병원 이송 여부 및 결과 등이 포함되며, 이 자료는 심폐소생술 품질 평가, 생존율 제고 정책, 응급 처치 매뉴얼 개선 등 폭넓은 분야에서 핵심 기초자료로 활용됩니다.* 본 자료는 구조구급시스템에서 추출한 자료로 일부 대상물에 대한 관한 정보만 포함되어 있음* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
