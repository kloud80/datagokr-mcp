summary_user: 광주 남구의 기계설비 성능점검 대상 건축물(연면적 1만㎡ 이상 건축물, 500세대 이상 공동주택)을 건물 단위로 모은 목록 파일로, 건물명·대지위치·주용도·연면적·사용승인일을 담는다. 건축물 관리자나 설비업체가 '우리 동네에서 기계설비 성능점검을 받아야 하는 큰 건물은 어디이고 언제 지어졌나'를 확인하거나, 분석가가 노후 대형 건물의 분포를 볼 때 쓴다. 전역 조인 키가 없어 건축물대장·주소 데이터 등과는 대지위치(주소)나 건물명을 맞춰 이어야 한다.
description_portal: 기계설비 성능점검 대상 연면적 1만제곱미터 이상 건축물 및 500세대 이상 공동주택에 대한 건물명, 대지위치 등의 데이터를 제공합니다. 해당 데이터는 광주광역시 남구청 건축과(☎062-607-4111)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 기계설비 성능점검 대상 건축물은 일정 규모 이상이거나 특별 용도의 건축물로, 냉난방·환기·급수·배수 등 기계설비의 성능을 정기적으로 점검해야 하는 시설입니다. 이러한 점검은 에너지 효율 유지, 안전사고 예방, 위생 관리, 설비 수명 연장을 위해 필수적입니다. 해당 데이터는 점검 대상 목록 관리, 점검 일정 수립, 노후 설비 교체 계획, 에너지 절감 대책 마련 등에 활용할 수 있으며, 이를 통해 건물 안전성과 운영 효율성을 높이고, 쾌적한 생활·업무 환경 조성에 기여할 수 있을 것으로 보입니다.
