description_portal: 이 공공데이터는 2014년부터 2024년까지 강원특별자치도 내에서 발생한 주요 경제범죄의 발생 및 검거 현황을 정리한 자료입니다. 제공 항목은 사기, 횡령, 배임, 증수뢰, 신용경매 관련 범죄, 통화 및 유가증권 범죄, 부수법 위반 등으로 구성되어 있으며, 각 범죄 유형별로 발생 건수와 검거 건수가 포함되어 있습니다. 해당 데이터는 지역 내 경제 질서 교란 행위의 규모와 경찰의 대응 실적을 파악하는 데 유용하며, 범죄 예방정책 수립, 수사 역량 평가, 법률 제도 개선 등의 기초자료로 활용됩니다. 경찰청, 지자체, 금융기관, 법무기관, 연구기관 등에서 경제범죄에 대한 통계 분석, 대응 체계 구축, 피해 방지 대책 수립에 유익하게 사용할 수 있으며,  참고자료로 활용 가능합니다.
