summary_user: 울산광역시 울주군이 방사능 비상 때 오염 확산을 막고 주민 이동을 통제하려고 정한 출입통제소(국도·지방도·고속도로 IC 등 길목)를 지점 단위로 담고, 통제소 이름과 16방위 코드로 주소와 공간정보를 조회하는 API이다. 방재 담당자나 분석가가 "원전 사고 때 울주군의 어느 길목이 통제되고, 대피 경로는 어떻게 짜야 하나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 대피소·병원 같은 다른 방재 데이터와는 주소·좌표나 이름 매핑으로만 이어 쓴다.
