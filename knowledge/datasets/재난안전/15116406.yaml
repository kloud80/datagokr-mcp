summary_user: 인천광역시 연수구에서 한파 때 주민이 이용하도록 지정한 한파쉼터를 쉼터별로 한 행씩 담은 목록으로, 행정동·쉼터명·도로명 주소·시설 구분(행정복지센터, 노인시설, 복지시설, 문화시설 등)을 담는다. 연수구 주민이나 돌봄 담당자가 '우리 동네에서 가장 가까운 한파쉼터가 어디인가'를 확인하거나, 분석가가 행정동별 쉼터 분포와 접근성을 따지는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 주소를 매칭해 붙여야 하며, 같은 부문의 무더위쉼터·민방위 대피시설 목록이나 연수구 인구·취약계층 통계와 함께 본다.
description_portal: 본 데이터는 인천광역시 연수구 내 한파 발생 시 시민들이 이용할 수 있도록 지정된 한파쉼터의 현황 정보를 제공하는 자료이다. 데이터에는 쉼터가 위치한 행정동, 쉼터명, 시설의 도로명 주소, 시설 구분 등의 항목이 포함되어 있으며, 행정복지센터, 노인시설, 복지시설, 문화시설 등 다양한 공공 및 민간 시설이 한파쉼터로 지정되어 있다. 해당 자료는 한파 등 겨울철 재난 상황에서 시민들이 가까운 쉼터를 쉽게 확인하고 이용할 수 있도록 지원하며, 지방자치단체의 재난 대응 정책 수립, 취약계층 보호 대책 마련, 지역별 쉼터 접근성 분석 등 다양한 공공행정 및 연구 목적으로 활용될 수 있는 기초자료로 제공된다
