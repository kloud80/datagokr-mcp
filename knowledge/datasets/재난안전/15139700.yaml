summary_user: 재난 시 이재민을 받는 수용시설을 시설 한 곳당 한 건으로 담은 전국 단위 원장으로, 시설명·수용가능인원(DSSTR_ACTC_PSBLTY_TNOP)·시설면적·지번/도로명 주소·좌표값을 포함한다. 지자체 재난 담당자나 분석가가 '우리 동네에서 이재민을 몇 명까지, 어느 시설에 수용할 수 있나'를 확인하는 데 쓴다. 전역 조인 키는 실측으로 확인되지 않아, 행정동·법정동 코드나 시설명·주소를 매핑해 민방위 대피시설·무더위쉼터 등 다른 대피·구호시설 데이터나 재난 특보·위험지역 데이터와 맞춰 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 수용시설 공간 정보로, 지역코드, 수용시설일련번호, 수용시설구분코드, 행정동코드, 상세주소, 이재민수용시설명, 이재민수용가능인원, 시설면적, 도로명상세주소 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
