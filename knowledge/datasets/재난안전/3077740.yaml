summary_user: 인천광역시 남동구의 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 7KB)로, 시설종류·용도·개방 여부·소재지 주소·비상발전기 보유 수·분기별 수질검사 결과·일일 급수능력(톤)과 사용가능인원을 기록한다. 남동구 주민이나 재난 담당자가 "단수나 재난 때 우리 동네에서 물을 받을 수 있는 가장 가까운 비상급수시설은 어디이고 하루 몇 명분을 공급하나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 대피·구호시설 데이터와는 읍면동 이름이나 소재지 주소를 맞춰 연결해야 한다.
limits: 남동구 한 개 시군구만 담으며, 좌표 컬럼 없이 주소만 있어 지도에 표시하려면 주소를 좌표로 바꾸는 작업이 따로 필요하다. 행정동 코드나 시설 고유 코드 같은 공통 키가 없으므로 타 지역·타 시설 데이터와 합칠 때는 이름·주소 매칭 오류에 주의한다.
