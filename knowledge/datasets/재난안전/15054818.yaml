summary_user: 광주광역시 소방안전본부가 관리하는 산악구급함을 한 개씩 한 행으로 담은 현황 파일로, 관할소방서·관리번호·설치년월·설치장소·관리부서를 기록한다(CSV 약 2.7KB 규모의 소량 목록). 등산객이나 산악안전 분석가가 '무등산 등 광주 관할 산에서 산악구급함이 어디에 설치돼 있고 어느 소방서가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 소방 데이터(119안전센터·소방서 현황 등)와는 관할소방서 이름이나 설치장소 지명을 맞춰 연결해야 한다.
description_portal: 광주광역시 소방안전본부 산악구급함 현황 등 정보를 제공합니다.- 포함내용은 관할소방서, 관리번호, 설치년월, 설치장소 및 관리부서 입니다.(참고사항) 119특수대응단에서 관리하는 산악구급함은 무등산국립공원 내 위치해있습니다.산악구급함 사용 희망시 국번없이 119로 신고하시면 산악구급함 사용방법(자물쇠 비밀번호 등)을 상세히 안내해드립니다.이에 대해 궁금하신점이 있으면 광주광역시 소방안전본부 119대응과 또는 관할 소방서로 연락주시면 상세히 답변해드리겠습니다.
