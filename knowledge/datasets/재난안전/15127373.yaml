summary_user: 고용노동부가 지정한 자율안전검사기관의 기관명·소재지·전화번호·지정 관서를 기관 한 곳당 한 행으로 담은 전국 단위 목록 파일입니다. 안전검사대상 기계·설비에 대해 자율검사프로그램 인정을 받은 사업주가 "우리 지역에서 자율안전검사를 맡길 수 있는 지정기관은 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 시설 안전 데이터와는 기관명이나 소재지 주소를 매칭하는 방식으로만 이어 쓴다.
description_portal: ㅇ 「산업안전보건법」 제93조(안전검사)제1항에 따라 유해하거나 위험한 기계ㆍ기구ㆍ설비에 해당하는 안전검사대상기계등을 사용하는 사업주는 안전검사대상기계등의 안전에 관한 성능이 고용노동부장관이 정하여 고시하는 검사기준에 맞는지에 대하여 고용노동부장관이 실시하는 안전검사를 받아야 합니다.  - 한편, 제93조제1항에도 불구하고 같은 항에 따라 안전검사를 받아야 하는 사업주가 근로자대표와 협의하여 같은 항 전단에 따른 검사기준, 같은 조 제3항에 따른 검사 주기 등을 충족하는 자율검사프로그램을 정하고 고용노동부장관의 인정을 받아 다음 각 호의 어느 하나에 해당하는 사람으로부터 자율검사프로그램에 따라 안전검사대상기계등에 대하여 자율안전검사를 받으면 안전검사를 받은 것으로 보고 있습니다.ㅇ 이에, 고용노동부가 지정한 자율안전검사를 수행기관의 현황 파일을 등록하오니, 해당 데이터를 활용하여 필요한 정보를 확인하시기 바랍니다.   * (항목) 연번, 기관명, 주소명, 전화번호, 지정관서
