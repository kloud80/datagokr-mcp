description_portal: 본 데이터는 지진해일(쓰나미) 발생 시 시민이 신속하게 대피할 수 있는 긴급대피장소 현황을 제공합니다.데이터에는 대피지구명, 대피장소명, 상세주소, 수용인원, 해변에서의거리, 해발고도(m),  대피소종류, 위치(경도·위도좌표) 등이 포함되어 있습니다.지진해일 특성상 신속한 이동이 중요하므로, 본 데이터는 대피 위치 확인, 대피 경로 설정, 해안가 위험지역 분석, GIS 기반 지도 서비스 활용 등에 유용하게 적용할 수 있습니다.또한 지자체의 재난대책 수립, 위험도 평가, 해안 지역 안전관리, 시민 대상 재난 대응 교육 자료로도 활용될 수 있습니다.
