summary_user: 국토안전관리원 시설물 사고사례에서 뽑은 위험요소별 위험성 자료로, 위험이 생기는 객체·위치·작업 과정과 그에 따른 인적·물적 피해, 사고 원인을 한 줄씩 담은 전국 범위의 비공간 CSV 파일(약 22KB)이다. 건설·시설물 현장 안전관리자나 분석가가 '굴착사면이나 고소 작업에서 어떤 원인으로 매몰·추락 같은 피해가 나는가'를 확인해 위험성 평가나 안전교육 자료를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위험발생객체·작업프로세스 같은 항목 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
