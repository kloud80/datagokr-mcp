summary_user: 부산광역시 중구 관내 도로별로 가로등 수량(일반·고효율·LED 구분)과 설치된 등주 수량(FRP 재질 포함)을 담은 집계 파일이며, 건별 시설 원장이 아니라 도로 단위로 묶인 현황이다. 중구 도로별 야간 조명 밀도나 LED 전환 정도를 비교하려는 주민·분석가가 "어느 도로에 LED 가로등이 적은가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명 문자열을 맞춰 연결하거나 같은 기관(중구)의 방범·생활안전 데이터와 나란히 놓고 쓴다.
description_portal: "부산광역시 중구 관내 설치 관리되고 있는 조명시설 중 가로등 현황에 대한 데이터입니다.관내 도로 별로 위치, 일반가로등, 고효율 가로등, LED가로등 수량 및설치된 등주 수량에 대한 데이터를 제공합니다.*LED :  '발광다이오드'라고 표기하며, 전류를 가하면 빛을 발하는 반도체 소자로 본 자료에서는 LED모듈로된 등기구를 말합니다.*FRP : 섬유 강화 플라스틱(Fiber Reinforced Plastic)의 약자로, 유리섬유 등 섬유로 강화된 플라스틱 복합재료입니다. 재질이 FRP인 등주를 말합니다."
