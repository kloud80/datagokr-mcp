summary_user: 양주시 가로등·보안등에 대한 고장·점등 불량·위치 오류 등 민원을 건별로 담은 원천 기록으로, 접수일자·접수매체·관리번호·신고내용·조치사항이 한 행에 들어 있다(CSV 약 1.2MB). 시 시설 담당자나 분석가가 '어느 시기에 어떤 유형의 가로등·보안등 고장 민원이 반복되고, 접수 후 어떻게 조치됐나'를 따져 예방 정비 계획을 세우는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 관리번호나 관리기관명 같은 이름 매핑으로만 붙일 수 있고, 같은 시의 보안등·CCTV 등 방범 인프라 자료와 함께 볼 때 이 방식으로 연결한다.
