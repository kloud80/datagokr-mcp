description_portal: '"제주특별자치도 내 뺑소니 교통사고 현황데이터를 제공합니다.항목: 연도, 시도, 시군구, 부상자수, 사고건수, 사망자수 등* 주특별자치도 내에서 발생한 뺑소니 교통사고의 사고 건수, 부상자 수, 사망자 수를 연도별로 정리한 공식 통계자료입니다. “뺑소니 교통사고”란 사고를 낸 운전자가 현장을 이탈하는 사고를 말하며, 일반 교통사고보다 사고 책임 추적, 응급 조치, 피해 회복 등의 면에서 어려움이 크기 때문에 교통안전 및 공공 질서 측면에서 매우 중요한 이슈입니다.* 활용 분야 : 교통안전 정책 강화 및 단속 대상 설정, 피해자 구호 및 보상 제도 개선 등"'
