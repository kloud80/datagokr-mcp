summary_user: 대구광역시 서구의 자율방범대를 처소별로 한 건씩 담은 데이터로, 장소명(PLACE)·소재지 주소·대원 수·순찰 요일과 시간 등 순찰 활동 내용을 제공한다. 주민이나 지역 안전 분석가가 '우리 동네 자율방범대 처소는 어디이고 몇 명이 언제 순찰하는가'를 확인하거나 동별 방범 인력 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서, 소재지 주소를 기준으로 같은 서구의 CCTV·안전비상벨·보안등 같은 방범 인프라 데이터와 이름·주소 매핑으로 이어 쓴다.
description_portal: '입력 파라미터를 이용하여 대구광역시 서구_자율방범대 정보데이터의 장소, 소재지, 대원 수, 순찰 활동 항목을 제공하는 서비스[용어설명]자율방범대는 지역 주민들이 자발적으로 조직한 민간 치안 협력 단체로, 경찰과 협력하여 지역의 범죄 예방과 생활 안전을 도모하는 역할을 합니다. 주민 스스로 지역을 지키는 공동체 치안 활동의 일환으로 운영됩니다.[데이터 설명]소재지: 각 행정구역에 위치한 자율방범대 처소 위치대원 수: 지역소재지별 자율방범대 대원의 수순찰활동: 순찰 도는 요일 및 시간 팀 수'
