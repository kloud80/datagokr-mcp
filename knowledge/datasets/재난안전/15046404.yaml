description_portal: '○ 통계개요* 통계명 : 감전사고 현황(연령별)* 통계종류 : 일반, 조사통계* 작성목적 : 감전재해 감축을 위해 올바른 정책방향의 기초 데이터를 제시하고감전재해의 발생추이를 분석하여 예방대책 도출하는데 목적이 있음* 조사체계 : 경찰서, 병원 → 한국전기안전공사* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 연령별 , 성별 감전사고 사망자수 및 부상자수 등○ 용어설명* 감전 : 사람의 몸을 통과하는 전류에 의한 생리.화학적 반응을 말함* 감전사고는 일반적으로 전기에너지에 의한 인적피해를 총칭하고 있어 상용전력 에너지외에도정전기 및 낙뢰에 의한 사고를 포함하고 있음○ 기타* 본 통계는 감전으로 인해 병원에서 1일 이상 치료를 받은 자의 의무기록부 및 경찰서의 변차기록부를 활용하여작성하였으므로 다른 유사통계와 다소 차이가 발생할 수 있음○ 출 처 : 한국전기안전공사「전기재해통계분석」_감전재해'
