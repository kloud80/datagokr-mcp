summary_user: 119 신고 전화를 연도별·유무선 유형별로 집계한 전국 단위 통계로, 2011~2023년 동안 화재·구조·구급·대민출동, 유관기관 이첩, 안내·민원, 장난전화, 무응답, 오접속 등 신고 내용별 건수를 담는다. 분석가나 정책 담당자가 '해마다 119 신고 중 장난전화·오접속 같은 비긴급 신고 비중이 어떻게 변했나'를 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 값을 맞춰 붙이는 식으로만 이어 쓰며, 화재 발생 건별 자료 등 소방청의 다른 소방 통계와 연도 기준으로 나란히 비교하는 정도가 현실적이다.
limits: "전국 합계 집계여서 시도·소방서별 비교나 개별 신고 건 분석은 할 수 없다. 공통 코드 같은 조인 키가 없어 연도·이름 매칭으로만 다른 자료와 연결된다. 필드 이름 앞뒤와 글자 사이에 공백이 섞여 있어(예: '화 재') 파싱할 때 공백을 정리해야 한다."
