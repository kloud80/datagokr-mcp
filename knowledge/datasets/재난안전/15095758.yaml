description_portal: 경찰청 여성안전기획과에서 제공하는 교제 폭력 형사 입건 건수 통계는 2018년부터 2023년까지의 현황을 보여줍니다(1회성 제공). 경찰청은 공식적으로 "데이트 폭력" 대신 "교제 폭력" 용어를 사용하며, 발생 건수는 별도로 관리하지 않고 형사 입건 건수를 제공합니다.통계에 따르면 교제 폭력 형사 입건 건수는 2018년 10,203건에서 2023년 13,939건으로 꾸준히 증가하는 추세를 나타냅니다. 이는 교제 관계에서의 폭력 범죄가 심각한 수준임을 시사합니다. 2019년에는 일시적인 감소를 보였으나, 이후 다시 증가하는 양상을 보입니다. 이 자료는 교제 폭력 예방 및 피해자 보호를 위한 정책 수립과 관련 수사 강화에 중요한 기초 자료로 활용될 수 있습니다.
