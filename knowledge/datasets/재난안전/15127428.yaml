summary_user: 울산광역시 울주군이 관리하는 가로등을 한 개씩 담은 건별 현황 파일로, 관리번호와 위도·경도 좌표, 관리기관명·전화번호, 데이터기준일자를 담는다. 주민이나 생활안전 분석가가 '야간에 어두운 길이 어디인지, 우리 동네 가로등이 고장 나면 어디에 연락해야 하는지' 확인하거나 조명 공백 구간을 지도에서 찾는 데 쓴다. 전역 조인 키는 없으므로 위도·경도 좌표로 CCTV·안전비상벨·보안등 같은 방범 인프라나 위험지역 데이터와 공간적으로 겹쳐 보는 방식으로 잇는다.
