summary_user: 충청북도 증평군 관내 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명/지번 주소·위도·경도와 개발연도·규모(톤)·심도(m)·용도·관리자를 기록한다. 주민이나 재난 담당자가 '상수도가 끊기면 우리 동네 어디서 식수나 생활용수를 받을 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표로 지도에 겹치거나 시설명으로 맞춰 이어 쓰며, 같은 군의 민방위 대피시설 등 다른 대피·구호시설 자료와 함께 본다.
description_portal: 충청북도 증평군 관내  민방위 비상급수시설의 위치, 개발연도, 규모, 심도, 용도 등 세부사항에 대한 자료를 공표함으로써 비상 시, 주민들에게 음용수, 생활용수 등을 효율적으로 공급할 수 있도록 함. 또한 민방위 비상급수시설은 지역주민에게 비상용수를 공급할 수 있는 지하수시설을 확보하여, 민방위사태 등으로 발생할 수 있는 상수도 공급체계 마비에 대비하기 위하여 현황을 연 주기로 업데이트 함. 민방위 비상급수시설의 운영 근거는 민방위기본법 제15조 지하양수시설(비상급수)의 준비, 같은법 제4조 재정지원 및 조건, 같은법 제15조의2 점검방식 및 목적, 같은법 제37조 제3호 민방위 응급조치 명령 불복 등의 근거 규정이 있으며, 수질관리로는 먹는물관리법 제5조 제3항 음용수의 수질검사 주기 기준, 라돈검사, 지하수법 제8조 제1항 제4호 지하수 개발 신고, 생활용수 수질검사 주기 기준, 같은 법 시행령 제14조의4, 시행규칙 제18조 제5항 시설의 사후관리 및 주기  등이 있음. 증평군은 상수도 공급체계 마비 등에 대비하여, 지역주민에게 최소한의 음용수 및 생활용수를 공급할 수 있도록 지하수를 기반으로 하는 지하 양수시설을 확보하여 제공하며, 비상급수계획을 수립하여 지역 주민에 대한 비상용수 공급 기반을 마련함. 비상급수시설의 확보 절차로는 시군구 단위 읍,동 주민 1인당 25L를 비상용수 확보소요로 산출하고, 관내 지하수시설 현황 파악, 공공용 시설 지정 확보, 민방위 비상급수시설 관리의 과정으로 운영함.
