summary_user: 광주 북부소방서 관내 가스시설(CNG·LPG 충전소, LPG 저장소·판매소, 고압가스저장소 등 총 43개소)을 시설 한 곳당 한 행으로 담은 파일이며, 상호·대표자·도로명주소·허가일자·취급가스·허가량·관할센터를 포함한다. 소방·안전 담당자나 주민이 우리 동네 119안전센터 관할에 어떤 가스시설이 얼마나 허가되어 있는지 확인하는 데 쓴다. 전역 조인 키는 없어서 도로명주소(소재지도로명주소)나 상호 이름 매칭, 관할센터 이름으로 다른 소방·시설 안전 데이터와 연결한다.
limits: 표준 시설 코드 같은 공통 조인 키가 없어 다른 데이터와는 주소·이름 매칭으로만 이을 수 있다. 북부소방서 관내만 다루므로 광주 전체나 다른 소방서 관할 가스시설은 포함하지 않는다.
