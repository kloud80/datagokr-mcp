description_portal: 대전광역시 업무분야별 특별사법경찰 지명 현황 정보는 2021년 기준으로 식품 위생, 환경, 원산지 표시 등 다양한 행정 분야에서 법 위반 행위에 대한 수사 및 단속 권한을 부여 받은 특별사법경찰관의 지명 내역과 직무 범위에 대한 정보를 포함한 자료입니다. 이 자료는 각 분야 별 특별 사법 경찰의 소속 부서, 지명 일자, 담당자 성명, 담당 업무 내용 등을 통해 법 집행 권한 분포와 실무 담당 체계를 명확하게 파악할 수 있도록 구성되어 있습니다. 이를 통해 불법 행위 단속, 관련 법령 위반 행위의 신속한 대응, 분야 별 법률 적용의 전문성 확보 등 실무적 효율성을 높이며, 지역 내 공공질서 유지와 행정 사각지대 해소에 기여합니다. 본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
