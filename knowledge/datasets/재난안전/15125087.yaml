summary_user: 소방청 화재 통계 가운데 전국 건설현장에서 난 화재 건수를 날짜별로 따로 뽑아 담은 집계 파일이다(포털 설명상 2010년 1월~2023년 9월, 날짜와 건설현장 화재 건수 두 열). 건설 안전 담당자나 분석가가 '건설현장 화재가 어느 시기에 몰리는가' 같은 시기별 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 날짜 기준으로만 맞춰 볼 수 있고, 지역 구분이 없으므로 지역별 데이터와는 직접 이을 수 없다.
description_portal: 해당 데이터는 2010년 1월 1일부터 2023년 9월 30일까지 소방청이 집계한 화재 통계 가운데 전국 건설현장에서 발생한 화재 현황을 별도로 분리하여 제공하는 자료입니다건설현장 화재는 주로 용접·용단 작업 중 발생하는 불티, 임시 전기설비 사용, 가연성 자재 적치, 안전관리 미흡 등이 원인으로 지적됩니다.설현장 안전관리 강화 정책을 수립하거나, 특정 시기·지역에서 화재가 집중되는 원인을 파악하는 데 도움이 될 수 있습니다. 또한 건설업계에서는 안전관리 지침 개선, 화재 예방 설비 도입, 작업자 교육 강화 등에 참고할 수 있습니다.
