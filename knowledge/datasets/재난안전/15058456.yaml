summary_user: 경기도에서 발생한 대규모 재난을 건별로 기록한 자료로, 집계년도·시군·재난유형·발생일시·재난규모와 사망·중상·경상자 수, 재난장소 주소와 위경도를 담는다. 정책 담당자나 분석가가 "우리 시군에서 화재·붕괴·추락 같은 대형 재난으로 인명피해가 얼마나 났는가"를 지역·유형별로 따져 볼 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시군명·시군코드(SIGUN_CD)나 주소·좌표를 매핑해 재난 특보·위험지역, 대피·구호시설, 소방 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 발생한 대규모 재난의 인명피해 현황을 기록한 자료입니다. 주요 항목은 집계년도, 시군명, 재난유형명, 재난발생일시, 재난규모구분명, 사망자 수, 중상자 수, 경상자 수, 비고사항, 재난장소 주소(도로명·지번), 우편번호, WGS84 좌표(위도·경도) 등으로 구성됩니다. 해당 자료는 대형 화재, 붕괴, 추락 등 다양한 재난 유형에 따른 피해 양상을 파악할 수 있도록 하며, 재난 안전 정책 수립, 지역별 위험도 평가, 재난 대응 계획 수립, 피해 저감 대책 마련 등에 활용될 수 있습니다. 다만, 본 자료는 수집 시점의 신고 및 집계 데이터를 기반으로 하므로 실제 피해 규모와 차이가 있을 수 있습니다.
