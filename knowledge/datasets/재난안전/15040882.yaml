description_portal: 국토안전관리원에서 제공하는 교량_사장교의 계측기 설치현황 데이터 입니다. 사장교는 주탑에서 비스듬하게 뻗어나온 케이블로 상판을 지지하는 교량 형식을 말합니다. 즉, 교량의 상판을 지지하는 케이블들이 주탑에서 비스듬하게 뻗어 나와 마치 부채꼴 모양을 이루는 것이 특징입니다.국토안전관리원은 시설물의 안전관리에 관한 특별법에 의거하여 관리원에서 해당 교량 대상을 관리하고 있습니다.계측기에는 가속도계, 경사계, 케이블가속도계, 처짐계, 동적변형률계, 지진계, 신축변위계, 하중계, GPS센서, 정적변형률계, 온도계, 시정계, 프로펠러 풍향풍속계, 초음파 풍향풍속계로 구성되어있으며 각 교량별로 계측기 설치 갯수를 알려 드립니다. "26년 7월 23일 기준으로 집계되었음을 알려 드립니다.과거 데이터와 비교하여, 삼천포대교는 계약만료로 제외되었으며, 새만금동진대교는 관리대상으로 포함되어 추가되었습니다.또한 풍향풍속계 명칭은 다음과 같이 수정되었습니다. (2D풍향풍속계→프로펠로 풍향풍속계, 3D풍향풍속계→초음파 풍향풍속계)
