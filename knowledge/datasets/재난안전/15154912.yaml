description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증 대상 항목에 대한 세부 조회 정보를 포함하고 있습니다. 각 행은 특정 인증품목에 대한 개별 평가 항목과 그 값 또는 조건을 나타내며, 주요 필드는 ‘인증품목조합코드’, ‘인증품목명’, ‘인증대상분류구분’, ‘인증대상분류구분명’, ‘인증대상항목’, ‘조회’ 등으로 구성되어 있습니다.‘인증품목조합코드’는 인증 대상 부품 또는 시스템의 조합을 나타내는 코드이며, ‘인증품목명’은 해당 조합에 포함된 구체적인 품목을 의미합니다. ‘인증대상분류구분’과 ‘인증대상분류구분명’은 각 인증 항목이 속한 분류 체계를 코드와 명칭으로 나타내며, ‘인증대상항목’은 평가 또는 확인이 필요한 기술 요소를 지칭합니다. ‘조회’는 해당 항목에 대한 적용 값 또는 조건을 의미합니다.이 데이터는 인증 대상 항목별 적용 기준 파악, 품목별 심사 기준 분류, 기술 인증 요건 분석, 세부 기술항목 관리 등에 유용하게 활용될 수 있습니다.
