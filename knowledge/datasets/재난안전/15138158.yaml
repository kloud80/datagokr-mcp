description_portal: 한국승강기안전공단 전산에서 관리되는 ‘승강기원장’의 삭제 이력을 정리한 데이터입니다. 각 행은 승강기관리번호(1·2), 건물관리번호(1·2), 호기, 운행 지상·지하층수, 모델명, 삭제일자를 포함하며, 원장 정비·통합·이관·오입력 정정 등으로 원장이 삭제(말소) 처리된 사례의 추적을 돕습니다. 목적은 관리대상 승강기의 식별·이력 정합성을 확보하고, 검사·민원·보험·사고조사 등 타 업무 시스템과의 기준값 일치, 이력 검증 및 감사 근거 제공에 있습니다. 범위는 공단 내부 전산에서 ‘삭제 완료’로 기록된 건에 한하며, 동일 호기에 대해 단계별 조치나 일괄 정비로 복수 이력이 존재할 수 있습니다. 삭제 사유의 세부코드, 담당부서, 관련 문서 경로 등 추가 메타데이터는 별도 시스템에 존재할 수 있고, 실제 조치일과 전산 반영일 간 시차가 발생할 수 있습니다. 개인정보는 포함하지 않습니다.
