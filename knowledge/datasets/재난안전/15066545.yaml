summary_user: 전국 소방본부별로 다중이용업소 수를 업종별(노래연습장, PC방, 학원, 유흥주점, 고시원, 키즈카페 등 27개 업종 열)로 집계한 표로, 범위는 전국 시도 단위이며 파일 크기는 약 2KB입니다. 연구자나 지자체 안전 담당자가 '우리 시도에는 어떤 다중이용업종이 다른 지역보다 많이 몰려 있나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 시도 단위 통계와는 소방본부 이름을 시도명에 맞춰 연결해야 한다.
description_portal: 해당 데이터는 각 소방본부별 관리하는 다중이용업소의 유형별(노래연습장, PC방, 영화관, 학원, 유흥주점, 게임장) 지정현황을 제공하는 데이터 입니다.다중이용업소란  「다중이용업소의 안전관리에 관한 특별법」에 따라 노래연습장, PC방, 영화관, 학원, 유흥주점, 게임장 등 불특정 다수인이 동시에 이용하는 시설을 말하며,  소방청 및 각 시·도 본부에서는 화재·안전사고 예방 차원에서 관리가 엄격히 이루어집니다.또한 해당 데이터를 통해 전국 모든 시·도에 분포된 다중이용업소를 개별 업소 단위로 수록하여, 특정 지역의 업종별 밀집도 등을 분석하여 재난 예방·안전관리 대책 등 다양한 연구자료로 사용 하실 수 있습니다.
