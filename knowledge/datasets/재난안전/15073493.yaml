summary_user: 광주 북부소방서 관할 화재를 장소 유형(단독주택·다가구주택·아파트 등)별로 나누고, 발화 원인(전기적·기계적·부주의·방화 등)별 건수를 집계한 통계 파일이다. 소방·안전 분석가나 주민이 '아파트 화재는 어떤 원인이 많은가'처럼 장소 유형별 주요 발화 원인을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 소방서·화재 통계와는 장소 유형 이름이나 기관 단위로 맞춰 이어 쓴다.
limits: 화재 건별 원천이 아닌 장소·원인별 집계라 개별 화재의 일시·위치를 알 수 없고, 공간 좌표가 없어 지도 분석에는 쓰지 못한다. 다른 데이터와 연결할 공통 코드가 없어 이름 매핑이 필요하다.
