description_portal: 지진옥외대피장소란 지진 발생 초기에 구조물 파손 및 낙하물로부터 안전하게 대피할 수 있는 장소로, 운동장이나 공터 등이 있습니다. 광주광역시 남구의 지진옥외대피장소 정보(시설명, 시설구분, 도로명주소, 수용가능면적)를 제공합니다. 해당 데이터는 광주광역시 남구청 안전총괄과(☎062-607-2944)에서 제공하며,  "국민재난안전포털"에서도 확인 가능합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다.※ 지진옥외대피장소는 지진이나 건축물 붕괴 등 긴급 상황 발생 시 주민들이 안전하게 모일 수 있도록 지정된 공공 공간입니다. 주로 공원, 운동장, 광장, 학교 운동장 등 건축물이 밀집하지 않고 넓은 공간에 위치해 있으며, 재난 발생 시 1차 피난 장소로 활용됩니다. 해당 데이터는 위치, 수용 가능 인원, 관리 기관 등의 정보를 제공하여 주민들이 가까운 대피 장소를 미리 확인할 수 있도록 돕습니다. 지자체는 이를 기반으로 재난 대응 계획을 수립하고, 주민 대상 안전 교육과 훈련을 실시할 수 있습니다. 민간에서는 지도 서비스, 재난 대비 애플리케이션, 연구기관의 안전 정책 분석 자료 등으로 응용할 수 있으며, 결과적으로 재해 피해를 최소화하고 지역 안전망을 강화하는 데 기여합니다.
