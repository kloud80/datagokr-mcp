description_portal: 인천광역시 중구에서 실시하는 민방위교육일정에 대한 데이터 입니다.민방위는 「민방위기본법」에 근거한 개념으로, 전시(戰時)·사변 또는 이에 준하는 국가적 비상사태, 각종 재난으로부터 국민의 생명과 재산을 보호하고 국가의 안전을 확보하기 위해 정부와 국민이 함께 수행하는 비군사적 방위 활동을 말한다. 즉 군사적 작전이 아닌 대피·구호·복구·경보 발령·대피소 운영·교육 및 훈련 등과 같은 활동을 통해 전쟁이나 재난 발생 시 피해를 최소화하고, 사회기능을 유지·회복하기 위한 제도적·조직적 체계를 말한다.
