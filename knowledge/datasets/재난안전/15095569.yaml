description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 교통통제소 조회 서비스는 방사능 재난 발생 시 오염 확산을 방지하고 대피로를 효율적으로 관리하기 위해 설정된 교통 차단 및 유도 지점에 관한 데이터입니다.출입통제소와 유사한 성격이나, 주로 도로망을 중심으로 한 차량 통제에 특화된 정보입니다.이 데이터는 '구호소(대피소)' 데이터와 함께 활용될 때 의미가 큽니다. 단순히 길을 막는 것이 아니라, 사고 지역으로 들어가는 길은 막고 구호소로 향하는 길은 개방하는 등의 교통 통제 시나리오를 구성하는 데 사용될 수 있습니다.
