summary_user: 울산광역시 울주군이 방사능 재난 때 오염 확산을 막고 대피로를 관리하려고 정한 교통 차단·유도 지점(교통통제소)을 지점별 주소·좌표 단위로 담은 시군구 범위 데이터다. 원전 인근 주민이나 방재 담당자가 '방사능 사고가 나면 울주군 어느 도로에서 차량이 통제되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 구호소(대피소)·출입통제소 데이터와는 지점 이름이나 주소·좌표, 같은 기관 기준으로만 맞춰 이어 쓴다.
