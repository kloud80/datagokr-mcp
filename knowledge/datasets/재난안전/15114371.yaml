description_portal: 본 데이터는 경상북도 내 소방관서 및 구급차량 현황 정보를 제공합니다. 각 소방관서에 소속된 안전센터 및 지역대별로 배치된 구급차량의 차량번호를 포함하고 있으며, 연번, 소속, 안전센터, 지역대, 차량번호 항목으로 구성되어 있습니다. csv 파일 형식으로 제공되며, 관서별 차량 보유 현황을 체계적으로 파악할 수 있습니다. 이 자료는 응급상황 대응 역량 분석, 차량 분포 현황 파악, 소방자원 운영계획 수립 등에 활용 가능하며, 소방 행정의 효율성과 투명성 제고에 기여합니다. 또한 지역별 구급차 접근성 분석의 참고자료로 활용됩니다. 본 데이터는 정기적으로 갱신되어 최신 현황을 반영하고 있습니다. 자료 관련 문의는  054-880-6330로 연락주시기 바랍니다.
