description_portal: '광주광역시 동부소방서 개인안전장비 보유현황에 대한 데이터로 각 품명별(방화복, 헬멧, 진압장갑 등) 보유기준 및 보유수량을 설명합니다.소방관들이 화재나 재난 현장에 출동할 때 가장 중요한 것은 자신의 안전을 확보한 상태에서 구조 활동을 하는 것입니다. 이를 위해 착용하는 보호 장비들을 개인안전장비라고 부르며, 화염·연기·낙하물·유독가스 등 각종 위험으로부터 소방관의 생명과 건강을 지켜주는 필수 장비입니다.동부소방서는 관내 소방관 전원이 안전하게 임무를 수행할 수 있도록 1인 1세트 이상 개인안전장비를 보급하고 있습니다. 주요 장비는 다음과 같습니다.소방헬멧: 충격과 고열로부터 머리를 보호하며, 일부는 통신장치가 부착되어 지휘·전달이 가능합니다.방화복(소방보호의): 고온과 화염으로부터 신체를 보호하는 내열·내화 소재로 제작되어 있습니다.소방장화와 장갑: 발과 손을 화염·낙하물·날카로운 물체로부터 지켜줍니다.공기호흡기(SCBA): 유독가스가 가득한 화재 현장에서 안전한 호흡을 할 수 있도록 산소를 공급하는 장치입니다.안전벨트·로프: 고층 건물이나 협소 공간 구조 활동 시 필수적인 추락 방지 및 확보 장비입니다.개인용 열화상카메라: 연기 속에서도 인명이나 화재 진원지를 탐지할 수 있도록 일부 소방대원에게 지급되어 있습니다.이 데이터는 동부소방서 소방대원의 장비 품명, 보유기준, 보유수량, 보유율에 대한 항목을 제공합니다.'
