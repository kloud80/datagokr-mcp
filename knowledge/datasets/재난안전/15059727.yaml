summary_user: 전북특별자치도 안의 소방본부·소방서·119안전센터·119구조대 등 소방관서를 한 행씩 담은 파일로, 시군명·관서 구분·명칭·도로명/지번 주소·전화번호를 개별 관서 단위로 담는다. 도민이 우리 동네에서 가장 가까운 119안전센터나 소방서의 위치와 연락처를 찾거나, 분석가가 시군별 소방·구조 관서가 몇 곳씩 분포하는지 비교할 때 쓴다. 전역 조인 키가 없어 시군명이나 주소 문자열로 행정구역 자료와 맞추거나 주소를 지오코딩해 화재 발생·소방용수 위치 자료와 공간적으로 겹쳐 쓴다.
