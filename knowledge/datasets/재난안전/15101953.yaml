summary_user: 국토안전관리원 시설물통합정보관리시스템에 등록된 공공시설물을 시설물 번호 단위로 담은 건별 원장으로, 시설 종류·안전등급·최종/차기 진단일·주소를 싣고 전체 27,947건, 전국 범위, 2013-12-31~2020-09-24 기간이다. 지자체 담당자나 분석가가 특정 지역 공공시설물의 안전등급과 점검 시행일이 어떤지 확인하는 질문에 쓴다. 주소 필드(addr, facil_addr)가 조인 키라서 주소 기준으로 다른 지역·시설 데이터와 이어 쓰며, 시설물 번호 외의 공통 코드표는 명세에 없다.
description_portal: 국토안전관리원에서 운영하는 시설물통합정보관리시스템에 등록된 공공시설물의 안전점검의 시행일, 등급, 위치 등이 포함된 데이터입니다.
