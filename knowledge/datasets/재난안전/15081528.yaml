description_portal: '경상남도 도내 운전면허 소지 현황에 대한 정보를 담고 있는 데이터로 2014년부터 2024년까지 운전면허 종별 (1종 대형, 1종 보통, 1종 소형, 1종 특수, 2종 보통, 2종 소형, 2종 원자) 면허 소지건수를 제공하고 있습니다. 즉, 각 수치값이 나타내는 단위는 운전면허 소지자 수가 아니라 운전면허 소지건수입니다.※ 작성 기준의 설명 : 종별이란, 한 사람이 수 종의 운전면허를 발급 받은 경우 각각의 운전면허를 모두 통계에 반영하여 작성한 것을 의미함.(예 : 1종 대형 면허와 2종 보통 면허를 함께 소지 → 1종 대형 면허와 2종 보통 면허를 각각 반영하는 것 임)※ 2종 원자 : 2종 원동기 장치 자전거의 줄임말입니다.'
