summary_user: 지진 발생 초기에 주민이 몸을 피할 외부(옥외) 대피장소를 장소 한 곳씩 담은 전국 범위 포인트 데이터로, 시설 관리번호·이름, 시도·시군구·읍면동과 도로명 주소, 좌표(XMAP_CRTS·YMAP_CRTS, GEOM)를 함께 담는다. 주민이나 지자체 담당자가 '지진이 나면 우리 동네에서 가장 가까운 옥외 대피장소는 어디인가'를 확인하는 데 쓴다. 실측상 데이터셋 사이를 잇는 전역 조인 키는 확인되지 않아, 다른 대피·구호시설 데이터와는 시군구 코드(STDG_SGG_CD)·도로명 코드나 행정구역 이름, 좌표 근접으로 맞춰 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지진발생초기 외부대피장소 정보입니다.\""
