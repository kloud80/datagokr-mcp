summary_user: 진주소방서 관내(진주시)에 등록된 소방시설관리업체를 업체 한 곳당 한 행으로 담은 등록 원장으로, 상호·주소·업종·분야가 들어 있다(CSV 829바이트의 소규모 파일). 건물 관계인이나 소방안전관리자가 '진주시에서 자체점검을 맡길 수 있는 소방시설관리업체가 어디인가'를 찾을 때 쓴다. 전역 조인 키는 없어서, 시도·시군구 이름이나 주소 문자열로 다른 소방·특정소방대상물 데이터와 맞춰 쓴다.
description_portal: 진주소방서 관내(진주시)에 등록되어 자체점검, 소방안전관리 등의 업무를 하고 있는 소방시설관리업체 현황으로, 상호명, 주소, 업종 및 분야에 대한 데이터를 제공합니다.
