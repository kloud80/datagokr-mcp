summary_user: 경기도 내 화학사고예방관리계획서 작성 대상 화학물질 취급 사업장을 사업장 한 곳씩 담은 목록으로, 시군명·사업장명·도로명/지번 주소·위경도, 취급하는 사고대비물질 내역, 가장 가까운 주민대피시설의 이름·주소·거리를 포함한다. 주민이나 지자체 방재 담당자가 "우리 동네 근처에 염소·암모니아 같은 사고대비물질을 다루는 사업장이 있고, 사고가 나면 어느 대피시설로 가야 하나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 사업자등록번호(bizregno)나 사업장명·주소 매칭, 위경도 기반 공간 결합으로 대피·구호시설이나 다른 화학사고·위험물 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 예방관리계획서 제출 대상이 되는 화학물질 취급 사업장의 분포와 사고 대비 정보, 화학물질 취급 내역을 정리한 자료입니다. 주요 항목으로는 시군명, 사업장명, 소재지(도로명주소 및 지번주소), 취급사고대비물질명, 주민대피시설명 및 거리, 위경도 정보, 사업자등록번호 등이 포함되어 있으며, 사업장이 취급하는 염소, 암모니아수, 톨루엔 등의 화학물질 목록도 제공됩니다.※ 화학물질안전원의 화학물질종합정보시스템(https://icis.mcee.go.kr) 데이터를 토대로 작성되었습니다.※ 사고위험성이 높은 화학물질을 일정수량 이상 사용하는 업체는 화학물질정보, 방재계획, 주민대피장소 등을 수록한 "화학사고예방관리계획서"를 작성하여 공개하여야 함
