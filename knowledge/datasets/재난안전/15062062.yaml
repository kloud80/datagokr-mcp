description_portal: 해당 데이터는 연도별  전국 17개 시·도에서 수행된 119생활안전활동의 통계 현황을 수록하고 있습니다. 각 지역별로 발생한 생활안전 출동 건수를 세분화하여 집계한 것으로, 119가 화재나 구조·구급 외에도 국민의 일상생활 속 안전문제에 얼마나 폭넓게 대응하고 있는지를 보여주는 대표적인 통계자료입니다. 일상생활에서 발생하는 각종 안전사고 유형으로는 벌(집)제거, 동물처리, 장애물제거 및 안전조치, 잠금장치개방, 비화재보확인, 피해복구지원, 생활끼임안전조치, 행사지원, 감염병지원, 기타생활안전활동 등으로 구분 하였습니다.이를 통해 각 안전사고 대응 현황을 한눈에 파악할 수 있는 데이터로 소방의 생활밀착형 안전활동 실태를 지역별로 가시화하였으며 , 이를 통해  지역별 안전사고의 특성과 계절별·환경적 요인을 분석할 수 있습니다.
