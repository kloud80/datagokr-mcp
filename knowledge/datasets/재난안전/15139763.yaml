summary_user: 전국 산사태 위험지구를 지구 한 곳당 한 건으로 담은 원천 목록으로, 지정일시·위험등급·붕괴위험 종류·시설등급·지정면적과 피해 우려 인명·가옥 수 등을 담는다. 지자체 방재 담당자나 주민·분석가가 "우리 지역 산사태 위험지구는 어디이고 위험등급과 피해 우려 인명·가옥은 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지구명·지번 같은 이름 매핑이나 같은 기관(재난안전데이터 공유플랫폼)의 코드로만 연결하며, GIS공간정보 일련번호(GIS_SPC_INFO_SN)는 같은 플랫폼의 공간 정보와 맞춰 보는 단서로 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 산사태 위험지구 정보로, 재해산사태위험지구일련번호, GIS공간정보일련번호, 지정일시, 위험등급, 붕괴위험종류, 시설등급, 인명, 가옥 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
