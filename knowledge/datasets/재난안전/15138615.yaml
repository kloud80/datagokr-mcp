summary_user: 전국에서 발생한 전기차 화재를 한 건씩 기록한 원천 데이터로, 건마다 화재발생 연월일, 시도·시군구, 발화요인 대·소분류, 차량 장소와 층수·지상지하 구분, 주행·주차 등 차량상태, 차량 발화지점을 담는다. 지하주차장 충전·주차 중 화재가 얼마나 되는지, 어느 지역·계절에 전기차 화재가 잦은지 따져 보려는 정책 담당자·분석가·주차시설 관리자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 날짜를 맞춰 연결해야 한다. 예를 들어 지역별 전기차 등록·보급 통계와 견주어 볼 수 있다.
limits: 행정구역 코드 같은 공통 키가 없어 지역별 보급률 등과 붙이려면 시도·시군구 이름을 직접 매핑해야 한다. 포털 설명에 있는 인명피해·재산피해·차량유형 항목은 실제 파일 컬럼에 없으므로 피해 규모 분석에는 쓸 수 없다.
