description_portal: '해당 데이터는 연도별 국내에서 발생한 전기자동차(EV) 화재사고 현황을 저장하는 데이터 입니다.주요 구성 항목으로는 1. 발생일시: 전기차 차량 화재 발생 연월일2.시·도별 발생지역: 전기차 화재 발생 위치 3. 화재 원인(대분류): 화재 원인을  전기적 요인, 부주의, 교통사고, 미상 등으로 구분4. 화재 원인(소분류): 좀 더 다양하게 구분5. 차량 장소: 화재 발생시 고속도로,일반도로,  주차장,  공지 등 장소 대분류6. 장소 소분류: 화재 장소를 좀 더 다양하게 분류7. 차량상태:  화재 시 차량이 주행 중인지 주차중인지 구분8. 차량 발화지점: 차량 화재 시 발화 위치를 구분 함연도 및 월별 발생 시기별 화재 추세 및 계절적 요인 분석 가능: 지역별 전기차 보급률과 화재 빈도의 상관관계 분석에 활용차량 구분: 승용, 버스, 화물 등 차량유형별 위험특성 파악발화 원인: 배터리 이상, 충전 중 사고, 주행 중 발화 등 주요 원인 분류인명피해 현황: 사망자·부상자 수를 포함하여 사고의 심각성 평가조치결과 및 재산피해: 대응시간, 피해 규모 등 후속 조치 분'
