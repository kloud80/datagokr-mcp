summary_user: 한국산업기술시험원(KTL)이 발행한 승강기·관련 안전장치 안전인증서를 인증서 한 건씩 담은 원장 파일로, 인증번호·발행일자·적용 안전기준·접수번호·업체명·공장 국가·인증서 상태(정상·사용금지·반납 등)를 담는다. 승강기 부품 제조·수입업체나 설치·유지관리 사업자가 특정 업체의 인증서가 아직 유효한지, 사용금지·반납으로 바뀌었는지, 어느 나라 공장 제품인지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 승강기·시설 안전 데이터와는 업체명이나 인증번호를 이름·코드 매핑으로 맞춰 이어 써야 한다.
description_portal: '이 데이터는 한국승강기안전공단이 승강기 안전인증 업무와 관련해 한국산업기술시험원(KTL)에서 발행한 안전인증서의 발행·관리 현황을 정리한 기준 정보입니다. 각 행은 KTL 안전인증번호, 발행일자, 적용 안전기준(예: 별표 규정 항목), 접수번호, 업체명, 공장국가코드/국가명, 인증서 상태(정상·사용금지·반납 등)로 구성되어 인증서의 유효성, 발행 이력, 적용 규정의 추적성을 확보합니다. 동일 인증번호의 재발행이나 상태 변경 건이 포함될 수 있어, 시간 경과에 따른 관리 상태 변화를 파악할 수 있습니다. 본 자료는 인증서 단위의 메타데이터에 한정되며, 시험 성적서, 상세 기술도면, 성능 수치 등 세부 시험 결과는 포함하지 않습니다. 적용 범위는 승강기 및 관련 안전장치의 KTL 발행 인증서에 국한되며, 타 시험기관 발행 건이나 비인증 품목 정보는 대상이 아닙니다.'
