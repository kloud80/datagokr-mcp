description_portal: 이 데이터는 서귀포시 내 지정된 지진 옥외 대피장소에 대해 고유번호, 사물주소(도로명·지번), 데이터 기준일자 정보를 포함하여 제공합니다. 공간 접근성을 높여 대피장소의 정확한 위치 확인이 가능하며, 수록된 전체 항목 수는 71건입니다. 이 자료는 안전 안내 표지판 점검, 대피 시뮬레이션, GIS 기반 지도 시각화, 민방위 또는 재난훈련, 피난소 간 거리 분석, 취약 지역 점검 등에 폭넓게 활용될 수 있는 공공안전 기반 데이터입니다. 또한, 서귀포시가 2019년에 시작한 62개소에 사물주소 부여 작업의 연장선상에서, 대피소의 위치 명확화 및 시민 안전 향상을 위한 중요한 기반이 됩니다
