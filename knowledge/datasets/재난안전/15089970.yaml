summary_user: 서귀포시에 지정된 지진 옥외대피장소마다 고유번호와 사물주소(도로명·지번), 데이터 기준일자를 한 행씩 담은 시설 단위 원천 목록이며, 포털 설명상 전체 71건이다. 주민이나 재난 담당자가 '우리 동네 지진 옥외대피장소의 정확한 위치는 어디인가'를 확인하거나 대피 안내 표지판 점검·대피 지도 제작에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 대피시설 데이터와는 시도·시군구 이름이나 사물주소 문자열을 맞춰 연결해야 한다.
