description_portal: 태풍, 호우, 강풍 등 주요 자연재해로 인해 발생한 전국 단독주택의 피해 현황을 연도별로 집계한 통계 데이터입니다. 이 자료는 각 재해 유형별 발생 횟수와 함께, 전파(완전 파손), 반파(부분 파손), 침수 등 피해 규모를 주택 수 기준으로 상세히 제공하며, 연간 총 피해액 정보도 포함하고 있습니다. 재난 관리 기관이나 보험 업계, 그리고 관련 연구자들은 이 데이터를 활용하여 과거 재해의 강도와 피해 패턴을 분석할 수 있습니다. 이는 향후 재해 예방 대책을 수립하고, 주택 안전 기준을 강화하며, 보다 효과적인 복구 및 지원 정책을 설계하는 데 필수적인 기초 자료가 됩니다.
