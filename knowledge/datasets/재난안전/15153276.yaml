summary_user: 지반침하(싱크홀) 발생 건별로 시도·시군구와 상세 위치, 위경도, 발생일, 규모(폭·연장·깊이), 지질 종류, 최초 발생 원인, 사망·부상·차량 피해, 복구 상태·방법·비용·완료일을 담은 표준 데이터다. 주민이나 지자체 안전 담당자가 "우리 시군구에서 최근 어떤 원인으로 지반침하가 났고 복구는 끝났는가"를 확인하거나, 분석가가 원인별 피해 규모를 비교하는 데 쓴다. 전역 조인 키는 없어서 시도명·시군구명 이름 매칭이나 위경도 좌표로 다른 재난 위험지역·시설 안전 데이터와 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 경기도(지자체)에서 제공하는 지반침하 제공표준에 대한 관련 정보입니다.\""
