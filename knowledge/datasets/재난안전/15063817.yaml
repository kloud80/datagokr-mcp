description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2016년부터 2020년까지 경찰청에서 집계한 불법대부업 단속 현황을 제공하는 공공데이터입니다. 연도별 단속 건수, 피의자 수, 유형별 위반 행위(미등록 대부, 고금리 이자 수취, 협박 채권추심 등)와 조치 결과 등이 포함되어 있어 불법 금융범죄의 유형별 발생 추세, 법집행 성과, 피해 예방을 위한 정책 효과 등을 분석할 수 있습니다. 이 데이터는 경찰의 불법금융 단속 전략 수립, 금융소비자 보호정책 마련, 연구기관의 사금융 실태 조사, 민간의 피해자 지원 서비스 설계, 공공기관의 예방 캠페인 기획 등에 활용됩니다.
