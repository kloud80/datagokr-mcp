description_portal: '국토안전관리원에서 관리하는 성능평가 대상시설물 중 중기관리계획 통계 정보이며, CSV형식 파일데이터 입니다.성능평가 대상시설물의 유지관리 계획은 「시설물의 안전 및 유지관리에 관한 특별법(시설물안전법)」 및 관련 지침에 따라 수립해야 합니다. 관리주체는 시설물의 생애주기를 고려하여 5년마다 중기관리계획을 수립하고, 이에 근거하여 구체적인 시설물관리계획을 수립·시행해야 합니다. 유지관리 계획의 주요 포함 사항성능평가 대상시설물의 유지관리 계획(중기관리계획)에는 다음 사항들이 포함되어야 합니다: 성능 목표 및 관리 기준 설정: 해당 시설물에 요구되는 성능(구조적 안전성, 내구성, 사용성 등) 수준을 설정하고 이를 달성하기 위한 기준을 명시합니다.성능 목표 달성 방법: 목표 성능을 확보하기 위한 구체적인 방법과 절차를 기술합니다.안전점검 및 성능평가 이행 계획: 정기적으로 실시해야 하는 안전점검, 정밀안전진단 및 성능평가의 종류, 시기, 방법 등에 관한 사항을 포함합니다.안전점검 및 성능평가 결과 반영: 과거 점검 및 평가 결과를 분석하고, 그 결과에 따른 후속 조치 계획을 수립합니다.보수·보강 계획: 성능평가 결과 발견된 결함의 종류, 정도, 시설물의 중요도 등을 고려하여 필요한 보수·보강 방법, 수준, 우선순위를 결정하고 예산을 확보하는 계획을 포함합니다.성능 변경 계획: 개축, 교체, 철거 등 시설물의 성능 변경과 관련된 장기적인 계획을 포함합니다.유지관리 조직 및 인원·장비 확보: 계획을 실행하기 위한 조직 구성, 필요한 인력 및 장비 확보 방안 등을 명시합니다.'
