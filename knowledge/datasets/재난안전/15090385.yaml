description_portal: 이 데이터는 관내에서 구조된 유기 동물의 보호 상태, 공고 이력, 발견 위치 및 보호소 정보를 수록한 자료입니다. 동물의 접수일자, 발견장소, 공고번호, 보호 상태, 품종, 색상, 나이, 성별, 공고 기간, 보호소 이름, 보호소 주소 및 좌표 정보(위도·경도) 등으로 구성되어 있으며, 품종에는 한국 고양이, 믹스견 등 다양한 반려동물 유형이 포함됩니다. 보호 상태는 ‘보호중’, ‘종료(입양, 자연사 등)’로 구분되며, 공고 고유번호는 행정처리를 위한 식별자로 활용됩니다. 사진 링크와 썸네일 이미지가 포함되어 있어 시각적 정보 제공도 가능합니다. 본 자료는 유기 동물 구조 이력 관리, 입양 활성화 기반 마련, 보호소 운영 실태 점검 등을 위한 주요 행정 자료로 활용하실 수 있습니다.
