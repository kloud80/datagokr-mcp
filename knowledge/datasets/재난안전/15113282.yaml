summary_user: 전국 소방서·119안전센터·119지역대 등 소방기관별로 실제 구급출동에 쓰이는 구급차 대수를 시도 단위까지 담은 현황 파일이며, 예비차량은 빠져 있다. 지역 구급 대응 역량을 비교하려는 분석가나 행정 담당자가 '우리 시도·소방서 관할에 구급차가 몇 대 배치돼 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 소방·구급 데이터와는 시도·소방서·안전센터 이름을 맞춰 연결해야 한다.
