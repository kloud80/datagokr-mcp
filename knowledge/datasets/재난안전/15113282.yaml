description_portal: '전국 소방서 및 119안전센터를 포함한 소방기관별 구급차 운영 현황  데이터입니다.구급대 운영 현황은 전국 소방관서 중, 실제로 구급대원과 구급차량을 배치하여 국민에게 구급서비스를 제공하고 있는 거점의 개수를 기준으로 작성하였습니다.구급차량의 대수의 경우, 실제로 구급출동에 활용되는 차량만을 집계하였으며 예비차량은 포함되지 않은 데이터값입니다.제공 항목에 대한 설명은 다음과 같습니다.-시도 : 광역지방자치단체명(소방본부)-소방서 : 해당 지역을 관할하는 소방서명-기관명 : 구급서비스를 제공하는 소방기관의 명칭(119안전센터, 119구조대, 119구조구급센터 등)-하부기관명 : 119안전센터 산하 119지역대의 명칭-수량 : 실제로 구급서비스를 제공하며 운용중인 구급 차량의 대수'
