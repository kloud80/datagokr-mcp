summary_user: '경기도 소방재난본부 소속 관서별로 무기계약근로자의 정원·결원·현원과 청원경찰 정원·현원, 그리고 사무보조·영양사·영상관리·시설관리보조·설비관리·조리사·청소원 등 직무유형별 근무 인원을 집계해 담는다. 소방서별 공무직 결원이 어디에 몰려 있는지, 직무별 인력 구성이 관서마다 어떻게 다른지를 따지는 인력 운영 분석이나 충원 검토에 쓴다. 실측 컬럼에 전역 조인 키가 없어 관서명(govofc_nm)을 이름으로 맞추는 방식으로만 다른 소방 데이터(예: 소방서별 화재 발생 집계)와 이어 쓴다.'
description_portal: 이 데이터는 관서별로 경기도 소방재난본부에 소속된 공무직 인력 현황을 담고 있으며, 무기계약근로자 및 청원경찰의 정원, 현원과 함께 직무유형별 인력 분포를 제공합니다.주요 항목에는 무기계약근로자 정원, 결원, 현원 외에 사무보조, 영양사, 영상관리, 시설관리보조, 설비관리, 조리사, 청소원 등 다양한 직무별 근무 인원 수가 포함되어 있습니다. 이 자료는 소방본부 내 각 관서별 공무직 인력 운영 상황을 파악하고, 인력 충원 필요성이나 직무별 인력 구성의 특성 분석에 유용하게 활용될 수 있습니다. 또한 조직 운영의 효율성과 인력배치 정책 수립 시 참고자료로 사용할 수 있습니다.
