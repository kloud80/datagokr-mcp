description_portal: 한국산업안전보건공단 인증원에서 제공하는 자율안전인증 면제 대상 사업장에 대한 내용으로심사종류, 사업장명, 대상품 분류, 심사완료일, 심사 결과, 이월 유무 등에 대한 데이터를 제공합니다.*산업안전보건법 제84조(안전인증) ① 유해ㆍ위험기계등 중 근로자의 안전 및 보건에 위해(危害)를 미칠 수 있다고 인정되어 대통령령으로 정하는 것(이하 “안전인증대상기계등”이라 한다)을 제조하거나 수입하는 자(고용노동부령으로 정하는 안전인증대상기계등을 설치ㆍ이전하거나 주요 구조 부분을 변경하는 자를 포함한다. 이하 이 조 및 제85조부터 제87조까지의 규정에서 같다)는 안전인증대상기계등이 안전인증기준에 맞는지에 대하여 고용노동부장관이 실시하는 안전인증을 받아야 한다.② 고용노동부장관은 다음 각 호의 어느 하나에 해당하는 경우에는 고용노동부령으로 정하는 바에 따라 제1항에 따른 안전인증의 전부 또는 일부를 면제할 수 있다.1. 연구ㆍ개발을 목적으로 제조ㆍ수입하거나 수출을 목적으로 제조하는 경우2. 고용노동부장관이 정하여 고시하는 외국의 안전인증기관에서 인증을 받은 경우3. 다른 법령에 따라 안전성에 관한 검사나 인증을 받은 경우로서 고용노동부령으로 정하는 경우
