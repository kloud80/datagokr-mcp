summary_user: 행정안전부가 재난안전데이터 공유플랫폼을 통해 제공하는 전국 인명구조함의 위치 정보를 시설물 한 건 단위로 담으며, 관리번호, 설치지역명, 시도·시군구·읍면동, 도로명 주소, 좌표(XCRD·YCRD 등)를 포함한다. 물놀이 지역이나 하천변 관리자, 지자체 안전 담당자가 특정 지역에 인명구조함이 어디에 설치돼 있는지 확인하는 데 쓴다. 실측 결과 전역 조인 키는 없어서, 다른 데이터와는 시군구 코드(STDG_SGG_CD)·시도·시군구명 같은 이름·코드 매핑이나 좌표를 기준으로 대피시설·재난 위험지역 데이터와 맞대어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 인명구조함에 대한 관련 정보입니다.\""
