summary_user: 한국수력원자력이 제공하는 원자력발전소 발전기별 출력 정보(발전출력, GNRT_OTPT)를 항목명·항목설명·실시간 갱신시각과 함께 담는 전국 단위 비공간 데이터다. 에너지 분석가나 일반 국민이 지금 각 원전 발전기가 얼마의 출력으로 가동 중인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발전기 이름 매핑이나 같은 기관 코드로만 연결한다.
