description_portal: 본 자료는 한국승강기안전공단에서 관리하는 승강기 고장원인별 코드 체계를 정리한 데이터입니다. 승강기 안전관리를 위해 발생 가능한 다양한 고장 사례를 체계적으로 분류하고 코드화함으로써, 사고 원인 분석과 사후 관리에 활용될 수 있도록 구성되었습니다. 데이터에는 고장원인 대분류 코드, 중분류 코드, 세부 코드, 고장원인 명칭, 사용 여부, 등록일자 등이 포함되어 있습니다. 주요 분류 항목은 부품 이상, 조정 불량, 노후, 천재지변 및 불가항력, 비정상 사용, 원인 불명 및 기타로 구분되며, 각 항목 내 세부 코드에는 부품 화재, 변형, 소손, 접촉 불량, 단선, 마모, 침수, 정전, 안전장치 동작 등 구체적 고장 유형이 제시되어 있습니다.
