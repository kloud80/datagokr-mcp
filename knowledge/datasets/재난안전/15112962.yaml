description_portal: 본 데이터는 경상남도 의령군 관내에 설치된 스마트그늘막의 위치 및 설치 현황 정보를 제공합니다. 스마트그늘막은 폭염 시 군민들에게 그늘을 제공하여 열사병 등 온열질환을 예방하고, 도심 열섬현상 완화에 기여하는 공공시설입니다. 본 데이터는 관리번호 및 스마트그늘막이 설치된 설치장소명, 설치장소의  주소, 그늘막 유형과 그늘막의 지름과 높이, 그늘막 설치일자, 위도, 경도, 관리기관명과 관리기관의 전화번호로 구성되어 있으며, 폭염 대응 정책 수립, 도시환경 개선, 공공시설 관리 등에 활용되며, 정기적으로 갱신되어 공공기관 및 일반 국민에게 개방됩니다. 의령군은 기후 변화에 대응하고 주민의 건강을 보호하기 위해 스마트그늘막 설치를 확대하고 있으며, 이를 통해 쾌적한 도시 환경 조성을 위해 노력하고 있습니다.
