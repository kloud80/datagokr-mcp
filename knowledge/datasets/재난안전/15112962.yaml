summary_user: 경상남도 의령군 관내에 설치된 스마트그늘막을 한 건씩 담은 원장으로, 설치장소명·주소·위도·경도와 그늘막 유형·지름·높이·설치일자·관리기관 연락처를 담는다(CSV 약 1.6KB의 소규모 파일). 폭염 때 군민이나 방문객이 "의령읍 근처에서 그늘을 피할 수 있는 스마트그늘막이 어디 있나"를 찾거나, 분석가가 폭염 대응 시설의 분포와 설치 시기를 살피는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭하거나 무더위쉼터 같은 다른 대피·구호시설 데이터와 같은 기관(의령군) 기준으로 나란히 놓고 쓴다.
limits: 관리번호는 의령군 자체 번호여서 다른 기관 데이터와 코드로 바로 이을 수 없고, 주소·좌표나 이름 매핑으로만 연결된다. 범위는 의령군 한 곳에 한정되므로 경남 전체나 다른 시군의 그늘막 현황은 들어 있지 않다.
