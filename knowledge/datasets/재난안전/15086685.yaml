description_portal: 전기로 대표되는 에너지 분야 전반에서 선제적으로 안전관리의 패러다임을 주도하는 책임·전문기관인 한국전기안전공사에서 전기안전점검을 시행할 때 사용되는 외국산 계측장비에 대한 데이터를 제공합니다.2003년 11월 6일부터 2022년 10월 5일까지 구입한 외국산 계측장비를 2024년 12월까지 운영하였습니다. 계측장비의 종류로는 (교육용) 크램프메타, (연구용) 누설전류계, (연구용) 절연저항계, (연구용)크램프메타, (연구용)휴대용적외선 열화상장비, 누설전류계, 절연저항계, 크램프메타, 휴대용 적외선 열화상장비가 있습니다.각각의 계측 장비에 대해 제작사, 모델명, 제작번호(가명처리), 구입일자를 확인 할 수 있습니다.
