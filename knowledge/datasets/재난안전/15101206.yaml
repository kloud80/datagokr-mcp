summary_user: 평택시 공중화장실에 설치된 비상벨을 화장실별로 담은 건별 현황으로, 화장실명·도로명/지번 주소·비상벨 설치장소·위도·경도·관리기관명을 담는다. 시민이나 안전 분석가가 '내 주변 공중화장실 중 비상벨이 어느 칸·위치에 설치돼 있고 누가 관리하나'를 확인하거나 방범 인프라 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 주소 매칭이나 위도·경도 좌표 기준으로 CCTV·안전비상벨·공중화장실 현황 등 다른 생활안전 데이터와 공간적으로 이어 쓴다.
description_portal: '경기도 평택시 공중화장실비상벨 현황에 대한 데이터로 화장실명, 주소, 비상벨설치장소, 관리기관명 등의 항목을 제공합니다.공중화장실 비상벨은 응급 상황 발생 시 즉시 도움을 요청할 수 있도록 설치된 장치로, 비상벨을 누르면 관리자 또는 경찰에 신속하게 연결되어 도움을 받을 수 있습니다. 데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 자원순환과(031-8024-3767)'
