description_portal: '한국가스안전공사에서 수행하고 있는 각종 안전관리 분야 연구과제 목록을 공공-민간에 공개하여 산/학/연과의 협업과제 발굴 유도하기 위해 제공하는 데이터입니다.해당 데이터는 과제분야(안전관리), 과제명, 수행부서, 과제구분(자체, 정부수탁, 민간수탁), 수탁-위탁기관, 연구시작일, 연구종료일, 연구기간(월)로 구성되어 있습니다.안전관리 분야의 발전에 따른 가스안전관리 기술의 발전 및 연구 현황을 조회하여 정책 수립 및 통계 수집, 협업 과제 발굴 등에 활용할 수 있습니다.※ 연간 주기로 현황 정보가 업데이트되며 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고 바랍니다.- 데이터기준일 : 2024년 9월 26일이후 데이터는 한국안전공사_연구개발정보 에서 확인할 수 있습니다.'
