description_portal: 본 데이터는 경찰청 여성청소년범죄수사과에서 관리하는 통계로, 2016년부터 2025년까지 발생한 성폭력범죄 피해자의 성별 및 연령대별 분포 현황을 상세히 제공합니다.남성과 여성을 구분하여 6세 이하부터 60세 초과 고령층까지 세분화된 연령 구간별 피해자 수를 기록하고 있으며, 약 10년간의 장기 시계열 자료를 통해 피해자 인구 구조의 변화와 발생 양상을 심층적으로 분석할 수 있습니다. 특히 아동·청소년 및 고령층 등 사회적 약자를 대상으로 한 범죄 추이를 정량적으로 파악할 수 있어, 맞춤형 피해자 보호 정책 수립 및 예방 시스템 강화를 위한 핵심 지표로 활용도가 매우 높습니다. 성폭력 피해 지원 체계 개선과 범죄 예방을 위한 국가 치안 행정 서비스 및 학술 연구의 신뢰도 높은 근거 자료로 적극 권장합니다.
