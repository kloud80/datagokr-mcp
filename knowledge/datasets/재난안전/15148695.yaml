summary_user: 시추조사로 얻은 암석 시료의 삼축압축시험 결과를 시험 건별로 담은 원천 파일로, 구속압 50·100·150 단계별 시료 지름·길이·최대압축강도와 점착력·내부마찰각·인장강도, 시료 채취 심도를 포함하며 범위는 전국이다. 설계·시공 기술자나 지반 분석가가 특정 사업 지역 암반의 전단강도 특성(점착력·내부마찰각)이 심도에 따라 어떻게 달라지는지 확인하는 데 쓴다. 전역 조인 키는 없고, 프로젝트코드와 시추공코드로 같은 기관의 다른 지반정보(시추공·암석시험 등) 파일과 이어 쓴다.
description_portal: 시추조사를 통해 생산된 지반조사결과의 시험내용 중 암석시험에서 수행한 삼축압축 시험에 대한 정보를 제공합니다. 암석의 전단 강도를 측정하는 시험인 암석 삼축압축시험은 암석 시료를 삼축압축시험기 안에 넣고, 암석의 자연 상태와 유사하게 3방향으로 응력을 가하여 암석의 내부마찰각, 점착력 등 흙의 강도 특성을 파악하는 시험입니다.
legal_basis_portal: 지반조사결과 전산화 및 활용에 관한 지침
