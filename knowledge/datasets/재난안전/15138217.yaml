description_portal: '한국승강기안전공단이 운영하는 콤비스마트 시스템의 그룹별 화면 권한 설정 이력을 정리한 자료입니다. 각 행은 화면ID를 기준으로 조회·등록·수정·삭제 권한의 부여 여부(예: 1=허용, 0=비허용)와 등록일시 등 최소 메타정보를 포함합니다. 본 자료의 목적은 권한 부여 현황을 체계적으로 기록·점검하여 업무 분장과 내부통제, 정보보호 준수 및 변경 추적의 근거를 제공하는 데 있습니다. 제공 범위는 시스템 내 화면 단위의 권한 스냅샷(등록 시점 기준)이며, 권한은 역할(그룹) 정책 변경이나 기능 개편에 따라 시기에 따라 달라질 수 있습니다. 사용자 개인, 업무계정 등 식별정보는 포함하지 않으며, 구체적인 그룹명·조직(부서)·역할 정의·변경 사유·승인 이력 등 부가 메타데이터는 별도 관리체계에서 운영될 수 있습니다. 동일 화면의 개정 이력이나 관리 목적상 중복 항목이 존재할 수 있으며, 본 예시는 형식 이해를 위한 일부 기록으로 전체 규모나 분포를 대표하지 않습니다. 자료는 공개 가능한 보안수준으로 제공되며, 법령·내부지침에 따라 민감 정보는 비공개 또는 익명화됩니다.'
