description_portal: '경찰청 수사국 경제범죄수사과의 2015년부터 2024년까지 불법대부업 관련 검거 및 구속 현황 통계를 보여준다.주요 내용은 다음과 같다.검거 건수: 2015년부터 꾸준히 증가하여 2019년 1,309건으로 최고치를 기록했다. 이후 2021년 523건까지 급감했다가 다시 증가세로 돌아서 2024년 1,001건을 기록했다.검거 인원: 검거 건수와 유사한 추이를 보인다. 2019년 2,575명으로 가장 많았고, 2021년 1,202명으로 최저치를 기록한 뒤 2024년 2,218명으로 다시 늘었다.구속 건수: 2015년 5건에서 2024년 79건으로 가장 높은 수치를 기록하며 큰 폭으로 증가했다.특징: 2019년에 검거 건수와 인원이 정점을 찍었고, 2021년에 최저치를 보였다. 구속 건수는 2024년이 가장 많았으며, 검거 건수 대비 구속률이 가장 높은 해이기도 하다.'
