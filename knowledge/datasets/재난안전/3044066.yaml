description_portal: '「재난 및 안전관리 기본법」 제38조의2(재난 예보ㆍ경보체계 구축ㆍ운영 등)에 근거하여 , 재난 발생이 예상되거나 발생했을 때 그 위험을 사람들에게 신속하게 알려 국민의 생명과 재산을 보호하기 위한 가장 기본적인 재난 대응 인프라 중 하나입니다.재해문자전광판(5개소) : 시각 정보를 통해 재난 상황 및 대피 정보를 직관적으로 제공하여 주민 및 운전자의 신속한 대응 유도.자동음성통보시스템(8개소) : 청각 정보를 활용하여 재난 정보에 대한 접근성이 낮은 취약 계층(고령자 등) 및 통신 음영 지역 주민에게 신속한 대피 명령 전달.강우량계(3개소) : 강우량 및 강우 강도를 정량적으로 측정하여 홍수, 산사태 등 수재해(물 관련 재해) 예측 및 경보 발령의 기초 데이터 제공.운영중.해당 데이터는 부산광역시 영도구 재난예경보시스템 현황(구분, 구군, 위치, 내역, 수량, 설치일 등)을 작성한 데이터입니다.자세한 사항은 엑셀파일 확인 바랍니다.'
