summary_user: 대전소방본부 119특수구조단이 2020년 한 해 동안 수행한 특수사고 구조 출동 실적을 가스·교통·산악·수난·승강기·인명갇힘·화재 등 구조 유형별 건수와 인원으로 정리한 연간 집계표로, 1KB 남짓의 작은 파일입니다. 소방 분야 분석가나 시민이 '대전에서 특수구조단이 어떤 유형의 사고에 가장 많이 출동했는가'를 확인하거나 유형별 구조 수요를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구조 유형 이름이나 같은 기관(대전광역시) 기준으로만 맞춰 이어 쓴다.
limits: 사고 건별 원천이 아니라 유형별 집계라서 발생 위치·일시 단위 분석은 못 한다. 공통 조인 키가 없어 다른 소방·재난 데이터와 붙이려면 유형명을 직접 매핑해야 한다.
