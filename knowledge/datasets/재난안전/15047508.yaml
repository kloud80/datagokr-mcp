summary_user: 공공시설물을 시설물 종류와 종별(1종·2종 등)로 나눠 전국 개수를 집계한 작은 CSV 파일(1445바이트)로, 건별 시설물 원장이 아니라 종류·종별별 합계를 담는다. 정책 담당자나 분석가가 "전국 공공시설물 가운데 교량·터널 같은 종류별로 종별 관리 대상이 몇 개인가"를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설물 종류명·종별 이름을 맞춰 연결하거나, 같은 기관(국토안전관리원)의 시설물 안전 데이터와 나란히 참고하는 방식으로 쓴다.
description_portal: '국토안전관리원에서 제공하는 데이터이며 공공시설물종별현황인 시설물명, 개수, 종별의 CSV 형식의 파일데이터로 제공합니다. 25년 12월 31일 기준임을 알려드립니다.공공시설물이란 불특정 다수인의 공공복리를 위해 국가나 지방자치단체 등 공공기관이 설치하고 관리하는 모든 종류의 시설을 의미합니다.여기에는 도로, 공원, 도서관, 공항, 항만, 상수도, 하천, 주차장, 학교, 운동장 등이 포함됩니다. 주요 특징공공성: 시민 전체가 이용하고 혜택을 받는 것을 목적으로 합니다.공공기관 설치 및 관리: 국가, 지방자치단체 또는 공공기관이 직접 설치하고 운영합니다.다양한 종류: 교통, 공간, 유통·공급, 문화·체육, 방재, 보건위생, 환경기초시설 등 매우 다양한 종류를 포괄합니다.'
