description_portal: "본 데이터는 산사태나 토사 유출 등 산림 재해를 예방하고 산림 환경을 보전하기 위해 제주특별자치도 제주시 관내에 지정된 '사방지(방재 목적의 토지)'의 세부 지정 현황을 담고 있는 공공 통계 자료입니다.사방지가 위치한 정확한 행정구역 상의 '소재지'와 도민들에게 익숙한 오름 등의 '속칭(예: 둔지봉, 지미봉, 망오름 등)'을 함께 제공하여 해당 방재 구역의 공간적 위치를 명확하게 파악할 수 있도록 돕습니다. 또한 지정된 토지의 전체 규모를 가늠할 수 있는 '지적(ha)' 및 실제 방재 시설이 적용된 '면적(제곱미터)' 정보와 함께, 해당 사방지의 최초 '지정일' 및 '소유자(제주특별자치도, 마을회 등)' 현황을 상세히 수록하고 있습니다.특히 '산지사방', '예방사방' 등 재해 방지 목적에 따른 '사방지 종류'가 명시되어 있어, 제주시 산림 재해 취약 지구의 체계적인 방재 인프라 관리 실태와 산림 보호 구역의 분포를 깊이 있게 분석할 수 있는 행정 데이터입니다."
