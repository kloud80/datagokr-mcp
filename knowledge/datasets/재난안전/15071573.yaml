summary_user: 서울 지역 승강기 유지관리업체를 업체(관리번호) 단위로 한 건씩 담은 인허가 원장으로, 인허가·휴업·재개업·폐업 일자와 영업상태, 주소·좌표, 자본금·자산, 유지관리책임·기술인력 수와 보수범위를 포함한다. 건물 관리자나 분석가가 "우리 동네에서 지금 영업 중이고 기술인력을 갖춘 승강기 유지관리업체는 어디인가"를 확인하거나, 업체 인력 규모와 개·폐업 추이를 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결한다.
description_portal: 서울시 승강기유지관리업체 인허가 정보는 서울 지역에서 승강기 유지관리 서비스를 제공하는 업체들의 인허가 및 영업 현황을 담은 공공데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업 및 재개업일자, 영업상태와 상세영업상태 정보가 포함되어 있어 각 업체가 현재 영업 중인지, 휴업 또는 폐업 상태인지 등 행정 이력을 파악하는 데 활용할 수 있는 자료입니다. 사업장명, 전화번호, 지번주소와 도로명주소, 우편번호, 좌표, 소재지면적, 업태구분명, 업종구분명 등의 항목을 통해 승강기 유지관리업체의 위치와 규모, 영업 형태 및 업종 특성을 확인할 수 있습니다. 자본금과 자산 정보는 업체의 재무적 기반과 규모를 가늠하게 해 주며, 회사구분명은 법인 형태나 조직 유형을 파악하는 데 도움을 주는 항목입니다. 유지관리책임인력수, 실무기술인력수, 설계책임기술인력수, 제조책임기술인력수, 임원수, 총직원수, 기술직·기능직·사무직 직원수 및 기타 인원수 등 인력 관련 정보는 승강기 안전관리의 핵심인 전문 인력 보유 현황과 조직 구조를 분석하는 데 유용한 데이터입니다. 또한 보수범위 항목은 해당 업체가 수행할 수 있는 승강기 유지관리의 범위와 역량을 보여 주어 안전관리 정책 수립과 업체 선정 기준 마련에 참고 자료가 될 수 있습니다. 최종수정일자, 데이터갱신구분, 데이터갱신일자는 정보의 최신성과 관리 이력을 확인하게 해 주며, 전반적으로 이 데이터는 승강기 안전관리 정책, 유지관리 시장 구조 분석, 전문 인력 수급 및 안전 규제 개선 등과 관련된 행정·연구·민간 서비스 기획에 폭넓게 활용할 수 있는 기반 자료입니다.
