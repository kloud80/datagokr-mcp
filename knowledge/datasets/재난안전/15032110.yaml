summary_user: 광주 관내 소방헬기 이착륙장을 한 곳씩 담은 목록 파일로, 고층건물·병원·고속도로·산악지역·공지 등 유형(구분)과 명칭(관리번호), 위치, 건물 층수, 크기, 관리주체, 크기에 따른 임무형태(착륙 또는 호이스트 구조)를 담는다. 소방·재난 담당자나 병원·건물 관리자가 '특정 건물이나 지역 근처에서 중형 소방헬기가 착륙할 수 있는 곳이 어디이고, 착륙이 안 되면 호이스트 구조가 가능한가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 소방·시설 데이터와는 위치 주소나 명칭을 맞춰 연결해야 한다.
limits: 표준 코드나 좌표 같은 공통 키가 없어 다른 데이터와 자동으로 결합하기 어렵고, 이름·주소 매칭에 의존해야 한다. 내용은 광주소방이 운영하는 중형 헬기 기준의 적용 가능 여부이므로 다른 기종이나 타 지역에는 그대로 적용하지 않는다.
