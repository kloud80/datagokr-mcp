summary_user: 대전광역시 서구 안의 소방서·119안전센터 등 소방 기관을 한 곳씩 담은 소규모 파일(CSV 약 1.7KB)로, 기관 구분·명칭·주소·행정동·법정동·위경도·관할구역·전화번호를 담는다. 구청 안전 담당자나 분석가가 '우리 동은 어느 119안전센터 관할이고 가장 가까운 소방 기관은 어디인가'를 확인하거나 소방 기관 배치를 지도에 올리는 데 쓴다. 법정동코드(bjd_cd)로 같은 코드를 가진 동별 인구·건물·화재 발생 자료와 잇고, 위경도로 소방용수·대피시설 같은 위치 데이터와 거리 기반으로 겹쳐 본다.
description_portal: 대전광역시 서구 내 소방안전 인프라 현황을 정리한 이 데이터는 지역별 화재 대응력과 긴급 구조체계의 분포를 한눈에 파악할 수 있도록 구성되어 있습니다. 소방본부, 소방서, 119안전센터 등 재난 대응의 핵심 조직이 동별로 어떻게 배치되어 있는지를 확인할 수 있으며, 각 기관의 명칭, 상세 주소, 행정동·법정동 코드와 같은 행정 정보가 함께 제공됩니다. 또한 위도와 경도 정보를 포함하고 있어 지도 기반 분석 및 재난 취약지역 파악에도 효과적으로 활용하실 수 있습니다.더불어 관할구역 범위와 연락처까지 포함되어 있어 정책수립, 안전계획, 긴급상황 시 연락 체계 구축 등 행정 실무에 직접적으로 도움이 되는 구조입니다. 이러한 데이터는 소방수요 예측, 재난 대비계획 수립, 지역 안전망 강화를 위한 기반 자료로 매우 유용합니다.
