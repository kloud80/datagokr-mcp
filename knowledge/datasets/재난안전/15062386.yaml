summary_user: 전국 119구조대의 구조활동을 건별로 담은 파일 데이터로, 2024-01-08부터 2025-12-31까지 613,150행이며 접수번호, 신고·출동 일시, 발생 시·구·동, 사고원인과 사고종별을 포함한다. 분석가나 지자체 담당자가 지역·시간대별로 어떤 유형의 구조 출동이 많은지, 신고에서 출동까지 얼마나 걸렸는지를 살필 때 쓴다. 전역 조인 키는 없어 발생 시·구·동 이름을 행정구역 코드로 매핑하거나 같은 기관 코드로만 다른 소방 데이터와 잇는다.
description_portal: '해당 데이터는 전국 소방관서 119구조대가 수행한 구조활동의 신고·출동·현장  사고 유형을  체계적으로 집계한 데이터로, 각 지역별 시간대별  사고 발생 상황과 구조대의 활동 시간을 수치로 확인 할 수 있습니다.주요 항목으로는 1. 신고시간:  사고 신고가 접수된 날짜와 시각2. 출동년시간: 소방대가 실제 출동한 시간3. 발생장소(시·군·구·읍면동):  사고가 발생한 행정구역 단위4.사고유형 / 세부유형:  교통사고, 수난, 추락, 붕괴, 동물사고 등 세분화된 유형 정보이를 통해 각 본부별  사건별 도착시간 뿐만 아니라 각 지역별, 시간대별, 사고 유형별 등을 알 수 있습니다.'
