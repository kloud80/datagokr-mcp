description_portal: 이 데이터는 경찰청에서 제공하는 사이버범죄 예방교육 현황 자료로써, 제공된 2024년 경찰청 사이버범죄 예방교육 현황 자료에 따르면, 교육은 '불법 콘텐츠 범죄'와 '정보통신망이용 범죄'의 두 가지 큰 유형으로 나뉘어 진행됩니다. '불법 콘텐츠 범죄'는 디지털 성범죄와 사이버 도박, 사이버 폭력 명예훼손·모욕에 대한 예방 교육을 포함하며, 각 범죄의 개념, 유형, 피해 사례, 처벌, 그리고 예방 및 신고 방법에 대해 다룹니다.'정보통신망이용 범죄'는 개인정보 유출, 사이버 사기, 이메일 무역 사기, 저작권 침해, 해킹·파싱에 대한 교육을 제공합니다. 이 교육들은 각 범죄의 정의와 유형, 발생 현황, 범죄 수법, 관련 법률 및 예방 방법을 포함하여, 국민들이 사이버 범죄에 대한 경각심을 갖고 스스로를 보호할 수 있도록 돕는 데 중점을 두고 있습니다.
