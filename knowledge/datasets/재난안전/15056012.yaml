summary_user: 제주특별자치도 소방본부와 제주·서귀포·서부·동부 소방서별로 직제(과·실·팀·센터·구조대 수), 정원·현원 인력, 의용소방대 대 수와 인원, 구급대 수를 한 행씩 담은 소방서 단위 집계표이며, 파일 크기는 385바이트로 몇 행 안 되는 소규모 표입니다. 제주 지역 소방 인력 배치를 살피는 분석가나 도민이 '어느 소방서의 현원이 정원에 비해 부족한가', '소방서별 의용소방대 규모는 어떤가' 같은 질문에 쓴다. 전역 조인 키가 없어 관서명(소방서 이름)으로 같은 기관의 다른 소방 데이터나 포털 설명의 읍·면·동 관할 구분과 수작업으로 맞춰 쓴다.
