description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증과 관련된 세금계산서 발행 정보를 기록한 자료입니다. 각 행은 하나의 인증 신청 건에 대해 세금계산서가 발행된 내용을 담고 있으며, 주요 필드로는 ‘인증 신청 순번’, ‘적부여부’, ‘사업장명’, ‘업태’, ‘종목’, ‘세금계산서 발행일자’가 포함되어 있습니다. ‘인증 신청 순번’은 각 인증 건을 고유하게 식별하는 번호로, 추적 및 관리를 용이하게 합니다. ‘적부여부’는 해당 인증이 ‘적합’ 판정을 받았는지를 나타냅니다. ‘사업장명’은 세금계산서가 발행된 기업명을 표시하며, ‘업태’와 ‘종목’은 사업장의 업종 특성과 관련 상품 또는 서비스의 종류를 나타냅니다. ‘세금계산서 발행일자’는 실제로 세금계산서가 발행된 날짜와 시간을 포함하여 기록됩니다. 이 데이터는 공공기관의 행정 투명성 확보, 기업별 인증 이력 확인, 세금계산서 관리 등 다양한 행정적·재무적 활용 가치가 있습니다.
