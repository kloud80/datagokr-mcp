description_portal: 해당 데이터는 경기도북부경찰청 관내에서 실시한 운전면허 행정처분 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 행정처분은 음주운전 등, 적성검사 미필 및 불합격, 교통사고 야기 도주, 정지기간 중 운전, 벌점 초과, 기타로 구분되어 있습니다. 2016년부터 2025년까지의 현황을 연도별 및 종류별로 제공하고 있어, 해당 기간 동안의 연도별 운전면허 행정처분 건수를 파악할 수 있습니다. 이를 통해 특정 연도에 실시한 각 행정처분 건수를 비교하여 분석할 수 있습니다. 이 자료는 교통 법규와 관련된 경찰 활동을 보여주며, 해당 현황은 경기북부경찰청 교통과에서 제공합니다.
