summary_user: 광주 남부소방서가 지정한 화재안전중점관리대상(대형화재취약대상)을 판매·의료·노유자·공장·창고·위험물·방송통신·복합건축물 등 업종별로 나눠 대상물명, 동수, 지하·지상 층수, 기준일자를 한 행씩 담은 소규모 CSV 파일(약 1.5KB)이다. 소방·안전 담당자나 지역 주민이 남부소방서 관할에서 어떤 건물이 집중 관리대상인지, 업종별로 몇 곳이고 규모가 어느 정도인지 확인하는 데 쓴다. 실측 컬럼에 주소·건물 코드 같은 전역 조인 키가 없어, 다른 소방·건축물 데이터와는 대상물명을 이름으로 맞추거나 같은 기관(소방서) 단위로만 이어 쓴다.
description_portal: 'ㅇ 화재안전 중점관리대상 선정 및 관리규칙[시행 2023. 4. 11.] [소방청예규 제80호]광주광역시 남부소방서 대형화재취약대상 현황을 제공합니다. -상세내용:  취약대상 업종별 분류 후 대상물명, 동수, 층수 등 정보 제공판매시설, 의료시설, 노유자시설, 공장, 창고시설, 위험물 저장 처리 시설, 방송통신시설, 복합건축물 -추진목표: 집중 안전관리를 통해 2025년 대형화재 및 화재로 인한 사망사고가 없는 年   (합동 화재안전조사, 현장 방문 행정, 안전환경 조성, 민·관 협의체 운영 등) 체계적인 민·관 안전관리를 병행하여 균형 있는 화재예방 정책 추진  (소방) 화재안전조사,예방순찰 /(민간) 자체(자율)점검, 자체 소방훈련 등'
