description_portal: 이 데이터는 1회성으로 제공하는 데이터로 경찰청이 2014년부터 2018년까지 수집한 교통단속 현황 자료로, 연도별 음주운전, 무면허운전, 신호위반, 중앙선침범, 과속, 안전운전 불이행, 기타 위반, 보행자 무단횡단 등 주요 단속 항목별 건수를 포함하고 있다. 본 데이터는 교통사고 주요 요인을 분석하고 교통위반 유형별 단속 현황을 파악하여 사고 예방과 단속 효율성 강화를 위한 정책 수립에 활용된다. 경찰청은 이를 통해 국민 교통안전의식 제고 및 정책 개발을 도모하며, 단속 현황과 변화추이를 이해하는 데 기여한다. 데이터는 공공데이터포털을 통해 개방되며, 교통정책 연구 및 참고자료로 활용된다. 본 자료는 교통사고 저감과 안전문화 확산의 기반자료로서 의의가 크다.
