summary_user: 진주소방서 관할 지역에 등록된 소방시설설계업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·시도·시군구·주소와 업종(전문·일반 설계 구분), 설계 분야를 담는다(CSV 856바이트 규모의 작은 목록). 건축 인허가를 앞둔 건축주나 사업자가 "진주 지역에서 소방시설 설계를 맡길 수 있는 등록 업체는 어디인가"를 찾을 때, 또는 행정기관이 관내 설계업체 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시도·시군구 이름이나 주소 문자열로만 이어 붙인다.
description_portal: 본 자료는 진주소방서 관할 지역 내 소방시설설계업체의 등록 현황을 정리한 것입니다. 건축물의 신축 또는 증축 시 필요한 소방시설 설계를 수행하는 업체들을 전문설계와 일반설계로 구분하여 수록하였으며, 각 업체의 상호, 소재지, 업종 및 설계 분야 정보를 포함하고 있습니다. 이를 통해 해당 지역 내 설계업체 분포와 특성을 한눈에 파악할 수 있어, 건축 인허가 절차에서의 업체 선정은 물론 행정기관의 업무 효율성 향상에도 기여합니다. 또한 지역 내 화재 예방과 대응 체계 구축을 위한 기초 자료로 활용될 수 있습니다.
