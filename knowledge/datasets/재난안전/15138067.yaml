description_portal: 본 자료는 한국승강기안전공단이 발행하는 승강기 고유번호판의 재발급 신청 현황을 표준 항목으로 정리한 데이터입니다. 각 레코드는 개별 신청 건을 나타내며, 필드는 처리상태, 신청일자, 발송일자, 승강기 고유번호, 수수료, 수납일자, 입금일자, 환불일자, 환불금액으로 구성됩니다. 처리상태는 발송완료 등 행정 처리 결과를 표시하고, 신청·발송 일자는 접수 시점과 발송 완료 시점을 구분해 제시합니다. 수수료는 재발급에 부과된 금액을 원 단위로 기록하며, 수납일자와 입금일자는 결제 및 회계 입금 처리 일자를 구분해 제공합니다. 환불 항목은 환불이 발생한 경우 일자와 금액을 함께 표기하여 금전 처리 이력을 명확히 구분할 수 있도록 하였습니다. 승강기 고유번호는 재발급 대상 설비를 식별하기 위한 키 값으로 활용되며, 동일 번호의 중복 신청 여부나 일자 간 관계를 조회할 수 있습니다. 표준화된 열 정의를 통해 기간별·상태별 신청 규모와 처리 흐름을 일관된 형식으로 확인할 수 있습니다.
