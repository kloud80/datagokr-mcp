description_portal: 경기도 수원시 화학사고대피장소(대피장소 관리번호, 시설구분, 대피장소명, 상세시설명, 수용면적, 수용인원, 관할기관, 도로명주소, 위도, 경도 등) 목록 데이터입니다. 위급 상황에서 신속하게 안전한 대피 장소를 확인할 수 있으며, 안전하게 이동할 수 있습니다. 이를 통해 사고 발생 시 혼란을 줄이고 체계적인 대응이 가능해지며 시민의 안전 확보와 인명 피해를 최소화 하고자 합니다.  본 데이터는 내난관리 체계 강화, 시민안전교육, 응급대응 계획 수립, 지역별 대피 인프라 개선 등 공공, 민간 영역에서 활용할 수 있습니다.
