summary_user: 경기도 수원시가 지정한 화학사고 대피장소를 장소 한 곳당 한 행으로 담은 목록 파일로, 시설구분·대피장소명·수용면적·수용인원·관할부서와 도로명·지번 주소, 위도·경도를 포함한다(CSV 약 2.7KB). 수원 시민이나 지역 안전 담당자가 '화학물질 누출 사고가 나면 우리 동네에서 가장 가까운 대피장소는 어디이고 몇 명까지 수용하는가'를 확인하거나 응급대응 계획을 세울 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 결합하는 방식으로 이어 쓰며, 같은 시의 대피·구호시설이나 위험물·화학사고 관련 데이터와 함께 지도에 겹쳐 보는 용도에 맞다.
limits: 수원시 한 개 시군구 범위만 담아 다른 지역이나 전국 대피장소 비교에는 따로 데이터를 모아야 한다. 대피장소관리번호는 다른 데이터셋과 맞물리는 공통 키가 아니므로 이름·주소·좌표로 연결해야 한다. 명세상 갱신은 연간 또는 이벤트 단위여서 실시간 개방 여부나 현재 수용 상황은 알 수 없다.
