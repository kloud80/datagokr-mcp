summary_user: 경기도북부경찰청 관내 13개 경찰서(의정부·고양·파주 등)별로 살인·강도·성범죄·절도·폭력 5대 범죄의 연도별 발생건수·검거건수·검거인원을 담은 집계 파일이며, 포털 설명상 2016년부터 2025년까지를 다룬다. 경기북부 주민이나 지역 치안 분석가가 '우리 지역 경찰서 관할에서 절도·폭력 발생이 몇 년간 어떻게 변했고 검거율은 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 범죄통계나 시군구 데이터와는 경찰서 이름을 시군 이름에 맞추는 수작업 매핑으로만 이어 쓴다.
