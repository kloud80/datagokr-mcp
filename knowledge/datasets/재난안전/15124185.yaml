description_portal: '해당  데이터는 119 구급대가 환자를 병원으로 이송하는 과정에서 발생하는 주요 활동과 환자 상태를 항목별 범주로 정리한 파일로 다음과 같은 항목으로 구성되어 있습니다.현장처치활동: 구급대가 환자에게 수행한 응급처치 내역, 질병 관련 정보: 이송 환자의 주요 질병 또는 증상 분류, 중증외상 정보: 사고 등으로 인한 심각한 외상 환자의 이송 현황, 의료지도: 구급대가 의료진으로부터 받은 지도·지시 관련 기록, 심폐정지 정보: CPR 수행 여부, 심정지 환자 이송 건수, 심뇌혈관 정보: 심근경색, 뇌졸중 등 심뇌혈관계 응급환자 이송 현황즉, 이 데이터는 단순히  이송라는 숫자만 담는 것이 아니라, 환자의 상태·유형별 이송 현황과 구급대의 현장 활동을 세부적으로 나누어 기록한 구조입니다.'
