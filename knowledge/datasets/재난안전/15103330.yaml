summary_user: 인천광역시 안에 지정된 재난 이재민용 임시주거시설을 시설마다 한 행씩 담은 원장 파일로, 시설구분·시설명·상세주소·수용가능면적·연락처가 들어 있다. 인천 시민이 재난 때 우리 동네 가까운 임시주거시설이 어디이고 얼마나 수용할 수 있는지 확인하거나, 분석가가 구·동별 수용 면적을 예상 이재민 규모와 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대피시설·인구 데이터와는 상세주소를 행정구역 이름으로 맞추거나 주소를 좌표로 바꿔 공간 결합하는 식으로만 잇는다.
