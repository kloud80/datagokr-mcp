summary_user: 일반주택·소규모 빌딩 등 일반용 전기설비 정기점검에서 나온 부적합 건을 유형별(절연저항, 인입구배선, 누전차단기, 개폐기·차단기, 옥내외배선, 접지상태)로 연도마다 호수와 비율로 묶은 전국 단위 집계표입니다. 전기안전 정책 분석가나 연구자가 '최근 몇 년 사이 어떤 부적합 유형의 비중이 늘었나'를 확인할 때 씁니다. 전역 조인 키가 없으며, 다른 전기안전 통계와는 연도와 부적합 유형 이름을 맞춰서만 이어 씁니다.
