summary_user: 국토안전관리원이 관리하는 전국 터널의 안전점검 정보를 시설물 번호(FCLTY_NO) 단위 원장으로 담으며, 시설물명·종류·위치·상태등급·최근 및 다음 점검진단일·준공일·주요 제원·관리기관 등을 행 단위로 제공한다. 지자체·도로 관리자나 분석가가 "우리 지역 터널 중 안전등급이 낮거나 다음 점검일이 임박한 곳은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 시설물안전관리현황(교량 등)이나 행정구역 데이터와는 시설물명·위치 문자열 또는 관리기관명으로 맞춰 이어야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국토교통부 국토안전관리원에서 제공하는 터널 안전점검 관련 정보입니다.\""
