summary_user: '고양도시관리공사가 도시재생센터·체육문화시설·주차시설 등 공사 시설의 전기·소방·승강기·조경·방역 용역을 맡긴 위탁관리업체 현황을 업체 단위로 담은 CSV 파일(약 12KB)이다. 고양시 공사 시설의 특정 관리 업무(예: 승강기, 방역)를 어느 업체가 맡고 있는지 확인하려는 시민이나 업체 현황을 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 수탁회사명 같은 이름 매칭이나 같은 기관 자료로만 이어 쓴다.'
description_portal: 경기도 고양시 고양도시관리공사에서 위탁운영하는 도시재생센터, 체육문화시설 및 주차시설 등을 공사 주요시설을 관리하는 위탁관리업체 현황 공개자료입니다. 전기, 소방, 승강기, 조경, 방역 등 공사 전반적인 시설물의 안전 및 운영에 필요한 용역을 수행함으로써 시민들이 보다 편리하고 안전하게 시설물을 이용할 수 있도록 하기위함입니다. 매년 주요 시설관리에 대한 용역업체의 데이터를 공유하고 투명하게 공개함으로써 시설이용에 불편함이 없도록 최고의 업체를 선정하여 운영하고 있습니다.
