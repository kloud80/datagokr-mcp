summary_user: 제주특별자치도경찰청 관할 동부서·서부서·서귀포서의 112신고 접수 건수를 2010년부터 2024년까지 연도별로 집계한 파일 데이터이며, 경찰서가 각각 열로 놓인 소규모 집계표입니다. 제주 지역 분석가나 정책 담당자가 "제주에서 어느 경찰서 관할의 112신고가 해마다 늘었는가"를 보고 치안 수요와 경찰 인력 배분을 따질 때 씁니다. 전역 조인 키가 없어 연도와 경찰서 이름을 기준으로 같은 기관의 범죄 발생·검거 통계나 다른 지역 단위 치안 지표와 직접 맞춰 이어 씁니다.
