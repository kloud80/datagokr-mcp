summary_user: 전국 소방시설업체(소방시설공사업·설계업·공사감리업·방염처리업)를 업체 한 건씩 담은 명부로, 지역·업종·분야·상호·대표자·본사주소·전화번호를 담는다. 건축주나 시공사가 우리 지역에서 소방시설 공사나 방염처리를 맡길 등록 업체를 찾을 때, 분석가가 지역별·업종별 업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 본사주소(지역)를 기준으로 맞춰 이어 써야 한다.
