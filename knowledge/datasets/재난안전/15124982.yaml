description_portal: '최근 3년간(2020년~2022년) 해양폐기물(해양 및 바닷가에 유입ㆍ투기ㆍ방치된 폐기물) 수거 실적에 관한 데이터입니다. ㅁ 해양쓰레기 관련 관계기관 역할 - 해양수산부: 해양쓰레기 관리 총괄, 정책수립 및 예산 지원(해양쓰레기 관리 기본계획 수립) - 해양경찰청: 해양환경관리법 제22조에 따라 선박기인 해양쓰레기 투기행위 감시, 단속 및 해양쓰레기 투기 예방 교육, 홍보 - 지방해양수산청: 국가 관리 무역항에서 오염물질 수거, 처리 및 오염물질이 퇴적된 해역에서의 오염물질 수거, 처리 - 해양환경공단: 전국 항만, 주요 해역의 해양 침적쓰레기 분포 실태조사 및 수거, 처리 - 어촌어항공단: 연근해 수산자원의 산란, 서식장의 유실, 침적된 어구 수거 및 항로 등 부유 쓰레기 수거 - 지방자치단체: 지자체가 관리하는 해양공간의 해양쓰레기 수거, 처리'
