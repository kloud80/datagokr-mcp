summary_user: 광주 동부소방서 관내 1급 소방안전관리자 선임 대상 건수를 대상물 종류별로 나누고, 안전센터(대인·용산·지산)별 수치와 합계로 정리한 집계 파일이다(약 1KB 규모의 CSV). 관내 어느 안전센터 구역에 어떤 종류의 1급 선임 대상이 몰려 있는지 확인하려는 소방 행정 담당자나 안전관리 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 안전센터 이름이나 소방서 단위로 직접 맞춰 이어 써야 하며, 다른 소방서의 같은 현황 파일과 견주는 방식이 현실적이다.
description_portal: 광주광역시 동부소방서 1급선임대상 현황에 대한 데이터로 동부소방서 관내 각 안전센터별 구분한 수치자료를 제공합니다.광주광역시 동부소방서에서 제공하는 1급 선임대상 현황은, 동부소방서 관내 여러 안전센터를 기준으로 1급 소방안전관리자 선임이 필요한 대상 건수를 항목별로 정리한 데이터입니다.소방안전관리자 선임은 화재 안전과 관련된 중요 기준으로 다수의 소방대상물을 관리하는 경우 1급 소방안전관리자의 선임이 법적으로 요구됩니다.각 안전센터 단위로 1급 소방안전관리자 선임 요구량을 한눈에 파악할 수 있습니다.
