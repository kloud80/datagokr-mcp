description_portal: '충청남도 당진시 임시주거시설 현황 안내(데이터 기준일자: 2026년 7월 1일)충청남도 당진시는 재난·재해 발생 시 이재민의 안전한 대피와 임시 주거 지원을 위해 관내 임시주거시설을 사전에 지정·확보하고 있습니다. 본 자료는 당진시 내 임시주거시설 현황을 정리한 것으로, 재난 발생 시 신속한 대피 안내와 이재민 수용계획 수립 등에 활용할 수 있습니다.본 데이터는 다음 항목들을 포함하고 있습니다.연번: 데이터 식별 및 시설 현황 관리를 위한 순번읍면동: 임시주거시설이 위치한 행정구역구분: 시설의 유형 또는 분류위치: 시설 소재지 또는 위치 정보시설명: 임시주거시설로 지정된 시설의 명칭면적: 시설의 사용 가능 면적수용: 시설 내 수용 가능한 인원 또는 규모내진적용: 시설의 내진 적용 여부본 자료는 재난안전 관리, 이재민 대피 및 수용계획 수립, 지역별 임시주거시설 분포 파악, 재난 발생 시 주민 안내, 시설 점검 및 관리 등 다양한 행정 목적에 활용될 수 있습니다.'
