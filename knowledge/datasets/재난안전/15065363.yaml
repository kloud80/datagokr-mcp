summary_user: 대구광역시경찰청 산하 11개 경찰서별 112신고 건수를 연도·관서 단위로 집계한 파일로, 포털 설명상 2021~2025년을 담고 중요범죄·일반범죄·질서유지·교통·재해재난·기타업무 같은 신고 유형별로 나뉜다. 대구 지역 분석가나 주민이 '우리 동네 관할 경찰서에는 어떤 종류의 112신고가 많고 해마다 어떻게 변했나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 경찰서·지역 치안 통계와는 관서명(구분)을 이름으로 맞춰 연결해야 한다.
description_portal: 대구광역시경찰청 관서별 112신고 현황 정보는 2021년부터 2025년까지 최근 5년간 대구광역시경찰서 산하 11개 경찰서(중부서, 동부서, 서부서, 남부서, 북부서, 수성서, 달서서, 달성서, 성서서, 강북서, 군위서)의 112 신고 건수 정보를 제공하고 있습니다.  해당 현황은 대구광역시경찰청 생활안전부 112치안종합상황실에서 제공하며, 구체적으로 연도 및 관서별 중요범죄, 기타 범죄, 질서유지, 교통, 기타경찰업무, 기타(타기관) 항목으로 구분되어 있습니다. 참고 사항으로 112는 일일이 알린다는 뜻에서 유래해 1957년 7월부터 시행되었으며, 112신고처리법에 근거하여 112신고와 접수, 처리가 이루어지고 있습니다
