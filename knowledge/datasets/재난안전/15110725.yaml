summary_user: 충주시 재난위험요인DB 가운데 소방시설 현황을 시설 한 건씩 담은 데이터로, 관리번호·읍면동·도로명 주소·위도·경도와 소방안전 점수·등급을 주소·좌표 단위로 제공한다. 충주시 안전 담당자나 분석가가 '시내 어느 읍면동이 소방안전 취약 등급이 몰려 있어 시설 보강이 먼저 필요한가'를 지도에서 확인할 때 쓴다. 응답은 위치 정보(geometry)와 속성(properties)으로 나뉜 공간 데이터 형태이며, 전역 조인 키가 없어서 다른 데이터와는 읍면동 이름이나 주소·좌표를 맞춰 연결해야 한다.
description_portal: '본 데이터는 2022년 공공데이터 기업매칭 지원사업을 통해 구축된 충청북도 충주시 재난위험요인DB 중 소방시설 현황 자료입니다.충주시 관내 소방시설의 위치 및 위험도 평가 정보를 포함하고 있으며, 재난 대응역량 강화 및 소방안전망 확보를 위한 기초자료로 활용됩니다.데이터는 관리번호, 읍면동, 도로명 주소, 위도·경도 좌표, 소방안전 점수, 등급 항목으로 구성되며,점수는 해당 지역의 소방시설 밀도, 접근성, 시설 노후도, 관할 소방서와의 거리, 화재 발생 위험 등을 종합적으로 평가하여 산출됩니다.등급은 점수를 기반으로 상대적 위험 수준(예: 1~5등급 또는 양호/보통/취약 등)으로 구분됩니다.해당 데이터는소방시설 보강 필요 지역 식별소방안전 사각지대 해소 정책 수립지역 내 우선 투자지역 선정화재 대응 시뮬레이션 모델 구축등에 활용될 수 있으며, 위도·경도 기반의 GIS 분석 및 시각화 자료로도 활용도가 높습니다.※ 실제 소방시설의 상세 기능(소화전, 스프링클러 등)이나 설치 연도 등의 추가 정보는 별도의 시설물 관리 시스템을 통해 확인 가능하며, 본 데이터는 위험요인 중심의 평가 자료임을 유의해야 합니다.'
