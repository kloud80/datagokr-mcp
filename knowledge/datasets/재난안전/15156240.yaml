description_portal: '평택시 화학사고대피장소 현황 데이터는 평택시 대표 홈페이지 DB 데이터로서 산업단지, 물류시설 등에서 발생할 수 있는 화학물질 유출·폭발 등 사고에 대비하여 시민의 신속한 대피와 안전 확보를 지원하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 가까운 대피장소의 위치 등을 쉽게 확인할 수 있으며, 민간·연구기관은 위험도 분석, 재난대응 시뮬레이션, 안전지도 서비스 개발, 지역별 취약성 평가 등 다양한 안전 관련 연구 및 서비스 개발에 활용할 수 있습니다. 본 데이터에는 대피장소의 주소, 장소 유형, 수용인원 등의 항목이 포함되어 있어 화학사고 발생 시 필요한 정보를 체계적으로 제공합니다. 이러한 자료는 재난관리 체계 강화, 시민 안전 교육, 응급대응 계획 수립, 지역별 대피 인프라 개선 등 공공·민간 영역에서 매우 높은 활용가치를 지닌 핵심 안전 기반 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
