summary_user: 국토안전관리원이 공공시설물의 시설물명·구분·종류·종별·안전등급과 최종 점검일, 차기 정밀점검·정밀진단 도래일을 시설물 단위로 담은 CSV 파일이다. 전국 88,212건이 주소·좌표 단위 개별 행으로 들어 있고 기간은 2002-12-30부터 2025-12-31까지다. 우리 동네 공공시설물의 안전등급과 다음 정밀점검 시기를 확인하려는 국민이나 분석가가 쓰며, 주소(address) 키로 다른 주소 기반 안전·시설 데이터와 이어 쓴다.
description_portal: 국토안전관리원에서 제공하는 데이터이며 공공시설물의 안전관리현황인 시설물명, 구분, 종류, 종별 등의 CSV형식의 파일데이터를 제공합니다.대한민국의 공공시설물 안전관리는「시설물의 안전 및 유지관리에 관한 특별법(이하 시설물안전법)」에 근거하여 체계적으로 이루어집니다.이 법은 시설물의 안전점검과 적정한 유지관리를 통해 재해 및 재난을 예방하고 공중의 안전을 확보하는 것을 목적으로 합니다국토안전관리원은 시설물 안전 및 유지관리에 대한 기술 지원, 정보 관리 등을 전담하는 전문 기관입니다.
