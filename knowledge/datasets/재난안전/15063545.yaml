description_portal: '해당 데이터는 소방청에서 교육하는 소방안전 교육 형태별 교육 체험자 현황을 나타내는 통계 자료입니다.주요 항목으로는 총건수·총인원, 이동체험차량 교육 건수 및 인원, 체험관 방문 교육 건수·인원, 체험교실(서) 운영 실적, 출장교육 건수와 교육 인원, 그리고 기타 교육 프로그램 실적이 포함되어 있다. 이동체험차량은 지역 접근성이 낮은 곳 및 신청한 지역에서 교육을 제공하며, 체험관 방문 실적은 전문시설을 활용한 심화 안전체험을 의미한다. 체험교실(서)는 소방서 단위에서 제공하는 체험형 교육 프로그램을 나타내며, 출장교육은 학교·공공기관·기업 등을 직접 방문해 실시한 교육을 의미한다. 또한 기타 항목에는 지역 맞춤형 교육, 캠페인형 홍보성 교육 등이 포함될 수 있다.주요 항목에 대한 설명으로는 다음과 같습니다.이동체험차량 교육(건수/인원): 차량으로 직접 찾아가는 이동식 체험 교육체험관 방문(건수/인원): 소방 체험관 같은 전문 시설을 방문해 교육받은 내역체험교실(소방서 운영 프로그램) 건수/인원출장교육(건수/인원): 학교·기업·공공기관을 방문하여 진행한 현장형 교육기타 교육(건수/인원): 행사형 교육, 캠페인, 맞춤형 안전교육 등'
