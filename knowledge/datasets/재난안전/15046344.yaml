description_portal: '○ 통계개요* 통계명 : 소년범죄 발생현황* 통계종류 : 소년범죄의 검거현황을 유형별로 제공하는 일반ㆍ보고통계* 근거법령 :「소년법」에 의해 만 20세 미만 연령인 자가 행하는 범죄* 작성목적 : 범죄의 검거현황과 유형의 변화추이 등을 조사ㆍ측정하여 범죄의예방과 검거대책 수립 등 형사대책 및 사회정책 수립에 기초자료를제공하는 것을 목적으로 함* 조사체계 : 서울지방경찰청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 해당기관내용 - 서울시 소년범죄 범죄유형별(강력, 절도, 폭력 등) 검거 건수 등○ 기 타* 2010년부터 특별법범에 속해있던 성폭력특별법 및 아동청소년의 성보호에 관한 법률 중성폭력 부분이 강력범으로 변경* 2008년부터 개정 소년법 시행(08.6.22)으로 소년범 연령을 10세이상 19세 미만 연령 적용'
