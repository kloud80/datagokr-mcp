summary_user: 충청남도경찰청 관할에서 2020년부터의 살인·강도·성범죄·절도·폭력 5대 범죄를 연도별로 발생과 검거로 나눠(유형) 건수를 담은 집계 파일로, 372바이트 csv 한 개 규모다. 충남 지역 분석가나 주민이 '최근 몇 년간 충남에서 절도·폭력 발생이 늘었는지, 범죄 유형별 검거율은 어떤지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시도청 5대범죄 통계나 대검 범죄통계와는 연도와 범죄 유형 이름을 맞춰 이어 붙여야 한다.
description_portal: 이 데이터는 충청남도 지역에서 2020년부터 최근까지 발생한 5대 범죄 유형에 대한 연도별 발생 건수와 검거 건수를 포함하고 있다. 주요 범죄로는 살인, 강도, 성범죄, 절도, 폭력 등이 포함되며, 각 범죄별로 사건의 발생과 검거 현황이 유형별로 구분되어 제공된다. 해당 데이터는 범죄 예방 정책 수립, 지역 치안 개선 전략 수립, 범죄 유형별 발생 추세 분석, 검거율 개선 방안 도출 등의 다양한 공공정책 및 연구 활용이 가능하다. 특히, 공공기관 및 연구자는 이를 통해 연도별 범죄 동향을 쉽게 파악하고, 지역사회의 안전망 강화에 기초자료로 활용할 수 있다.
