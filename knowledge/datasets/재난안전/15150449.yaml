description_portal: 지진 등 대규모 재난 발생 시 주민이 안전하게 대피할 수 있도록 지정된 옥외대피장소의 현황을 제공하는 데이터입니다.행정동별로 대피장소의 시설명, 소재지, 위도·경도 좌표, 수용가능면적 및 인원, 사용여부, 담당부서, 연락처 등의 속성을 포함합니다.이 데이터는 재난·민방위 정책 수립, 안전대피 안내 서비스, AI 기반 경로 최적화 및 수용능력 분석 등 공공 및 민간 서비스에서 활용될 수 있습니다.또한, 정기적인 점검 이력과 시설 변경 사항이 누적되면 시계열 분석을 통한 시설 관리·보완에도 활용할 수 있습니다.재난안전, 스마트시티, 위치기반 서비스와 연계될 경우 국민 안전 체감도를 높이는 핵심 데이터로 기능합니다.
