summary_user: 위험시설로 지정된 소규모 공공시설을 시설 한 곳당 한 행으로 담은 건별 표준데이터로, 8,579건에 지정일·해제일, 지정 사유, 주소와 위경도, 관리기관이 들어 있다. 시민이나 지자체 담당자, 분석가가 우리 동네에 위험시설로 지정된 시설이 어디이고 어떤 사유로 지정됐는지 확인하는 데 쓴다. 도로명주소·지번주소(address)나 위도·경도(coord)를 키로 삼아 대피·구호시설 같은 다른 주소·좌표 기반 안전 데이터와 위치로 맞춰 쓰며, 시설 고유번호 같은 별도 키는 없다.
limits: 수록 범위가 어디까지인지는 확인되지 않았고, 전국을 빠짐없이 담았다고 단정할 수 없다. 연결 키가 주소와 좌표뿐이라 다른 데이터와는 주소 표기 차이를 감안해 맞춰야 한다. 해제일자 값이 있는 행은 지정이 풀린 시설일 수 있으니 현재 위험 여부를 볼 때 확인해야 한다.
