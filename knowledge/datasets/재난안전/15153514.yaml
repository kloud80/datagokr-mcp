summary_user: 지진해일 발생 때 지역별 주민 대피 장소로 지정된 대피소의 위치를 대피소 한 곳당 한 건씩 중심점 좌표(XMAP_CRTS·YMAP_CRTS)와 시도·시군구·읍면동·도로명 주소로 담은 전국 범위 데이터다. 해안 지역 주민이나 지자체 방재 담당자가 "우리 동네에서 가장 가까운 지진해일 대피소는 어디인가"를 확인하거나 대피소 분포를 지도에 올릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 시군구 코드(STDG_SGG_CD)·도로명코드나 시도·시군구·읍면동 이름 매핑, 또는 좌표 기반 공간 결합으로 이어 붙여야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지진해일 발생시 지역별 주민 대피 장소로 지정된 장소 위치 정보입니다.\""
