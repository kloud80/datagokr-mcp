description_portal: "국토안전관리원에서 시설물안전법에 의거하여 30년이상 노후화된 공공시설물 현황 리스트 데이터를 제공합니다.시설물의 안전관리에 관한 특별법에 의거하여 국토안전관리원에서 운영중인 시설물정보관리종합시스템(FMS) 내 등록된 공공시설물(공동주택 제외)에 한하여 준공된지 30년이상 노후화된 현황(시설물명, 시설물구분, 소재지)를 제공합니다.노후 공공시설물 현황 및 종류'24년 전체 27,866개에서 '25년 29,059개로 전년도보다 1,193개 증가했습니다.비율 증가: 국내 공공건축물 중 건설 후 30년 이상 지난 노후 건물의 비율은 2021년 약 23.2%에서 2029년에는 43.3%까지 증가할 것으로 전망됩니다.주요 시설물: 다양한 종류의 공공시설물이 노후화되고 있습니다."
