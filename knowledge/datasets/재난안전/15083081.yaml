summary_user: 시설물정보관리종합시스템(FMS)에 등록된 공공시설물(공동주택 제외) 중 준공 후 30년 이상 지난 시설물을 한 건씩 시설물명·시설물구분·시설물종류·소재지로 담은 전국 단위 목록 파일이다. 지자체 담당자나 분석가가 '우리 지역에 30년 넘은 공공 교량·건축물이 몇 곳이고 어디에 있나'처럼 노후 시설물의 분포와 종류를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 시설물 안전등급·점검 데이터와는 시설물명이나 소재지 주소를 맞춰 붙여야 한다.
limits: 시설물 번호 같은 공통 키가 없어 안전등급·점검 결과 원장과 정확히 연결하기 어렵고 이름·주소 매칭에 기대야 한다. 준공연도나 안전등급 컬럼이 없어 노후 정도나 위험도는 이 파일만으로 판단할 수 없다.
