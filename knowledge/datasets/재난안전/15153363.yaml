summary_user: 전국 상습 도로 결빙 구간을 구간 단위로 담으며, 필드명으로 보아 관리기관, 대표 지역, 도로 노선명, 결빙 유형, 도로 방향 각도, X·Y 좌표와 공간 정보(GEOM)가 들어 있다. 도로 관리 담당자나 운전자, 분석가가 '겨울철 내가 다니는 노선에서 결빙이 잦은 구간은 어디인가'를 확인하고 제설·안전 대책 지점을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 관리기관명·지역명·도로 노선명 같은 이름을 맞추거나 좌표로 겹쳐서 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 상습 도로 결빙 구간에 대한 정보입니다.\""
