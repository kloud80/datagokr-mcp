description_portal: 본 데이터는 주요 국가(일본, 프랑스, 스페인)의 원자력발전소에 설치된 해외 비상대응시설 현황을 비교·정리한 자료로 국가별 발전소 명칭을 기준으로 비상대응시설의 연면적, 구조 형식, 수용 인원, 비상전원 유지시간을 포함하며, 실제 활용 목적에 따른 실구성 특징과 기타 재난 유형(면진·내진 등) 정보도 함께 제공합니다. 이를 통해 각국 원전 비상대응 인프라의 규모와 설계 개념, 운영 지속 능력을 종합적으로 파악할 수 있으며, 국내 원전 비상대응시설 설계 개선, 안전성 강화, 국제 사례 비교 분석을 위한 참고자료로 활용 가능합니다.※ 연면적의 단위는 제곱미터(㎡)이며, 수용인원 단위는 명, 비상전원유지시간의 단위는 시간입니다.
