summary_user: 광주 남부소방서 관내에 등록된 소방시설업체를 업체 한 곳당 한 행으로 담은 CSV 파일(약 1.3KB)로, 상호·업종·분야·데이터기준일자를 담는다. 건물주나 관리주체가 "남구 일대에서 소방시설 공사나 점검을 맡길 업체가 어디 있나"를 찾거나, 분석가가 관내 소방시설업 업종 구성을 볼 때 쓴다. 전역 조인 키가 없어 다른 소방서의 업체 현황이나 특정소방대상물 자료와는 상호 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
limits: 업체 주소·등록번호 같은 식별·위치 컬럼이 없어 지도 표시나 다른 원장과의 정확한 조인이 어렵고, 상호명 매칭에 의존해야 한다. 남부소방서 관내만 담아 광역 단위 현황은 다른 소방서 파일을 모아야 한다.
