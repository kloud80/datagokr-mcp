description_portal: '광주광역시 남부소방서 관내 소방시설업체 현황소방시설업은 소방시설공사업법에 따라 소방시설업, 소방공사감리업, 소방시설관리업, 방염처리업의 4가지로 나뉘며, 각 업종은 해당 법률에 규정된 업무를 수행합니다. 소방시설업은 소방시설공사업법에 의해 정의되고 규정되며, 이는 건축물 등의 소방시설의 설치·공사·점검·유지관리와 관련된 사업을 의미합니다. [법적 근거] 소방시설공사업법: 소방시설업의 정의, 종류, 등록 및 관리 기준을 규정하는 법률입니다.[소방시설업의 정의 ]소방시설공사업법에 따라 소방시설의 설치 및 관리에 필요한 업무를 하는 사업을 말합니다.[소방시설업의 종류]1. 소방시설업:건축물 등에 소방시설의 신설·개설·이전·대수선·설비의 설치 및 소방시설관리사의 업무수행에 필요한 공사(소방시설공사)를 하는 사업. 2. 소방공사감리업:소방시설공사가 설계도서나 화재안전기준에 맞게 시행되도록 감리하는 사업. 3. 소방시설관리업:소방안전관리 업무의 대행 및 소방시설 등의 점검 및 유지관리를 하는 사업. 4. 방염처리업:물품의 방염성능을 부여하기 위하여 방염처리하는 사업.'
