description_portal: '통계활용사례 등록URL 복사목록 이동서울시 원인별 화재발생(동별) 통계○ 통계개요* 통계명 : 원인별 화재발생(동별)* 통계종류 : 서울시 각 동별 화재발생 건수를 발화요인별로 제공하는 일반ㆍ보고통계* 작성목적 : 화재발생 건수를 실화, 자연적인 원인, 방화 등 원인별로 화재발생정보(동별)를 제공하여 사고 방지 및 대응 등 효과적 관리를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 소방서 → 서울소방재난본부 재난대응과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 소방서내용 - 발화요인(실화, 자연적인 요인, 방화)별 화재발생 건수 등○ 용어설명* 방화(arson) : 자택 또는 타인의 주택, 빌딩, 구조물 또는 그 외의 물품을 의도적으로연소시키는 범죄'
