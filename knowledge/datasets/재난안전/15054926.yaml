summary_user: 광주광역시 소방안전본부의 구조활동을 연도 단위로 집계한 총괄 통계로, 출동건수·구조건수·구조인원과 각각의 1일평균을 2025년과 2024년 값으로 나란히 담고 증감(건·퍼센트)까지 붙인 작은 표(csv 352바이트)다. 시민이나 분석가가 "광주에서 119 구조 출동과 구조인원이 전년보다 얼마나 늘거나 줄었나"를 확인할 때 쓴다. 지역코드·기관코드 같은 전역 조인 키가 없어서 다른 데이터와는 연도와 항목 이름(구분)을 맞춰 붙여야 하며, 다른 시도 구조활동 통계나 같은 기관의 화재 발생 통계와 연도 기준으로 비교하는 정도로 이어 쓴다.
description_portal: 광주광역시 소방안전본부 구조활동 총괄 현황입니다. 해당 자료는 119종합상황실의 신고접수 내역을 토대로 하여 각 소방관서의 현장 활동 상황을 통합하여  작성하였습니다.데이터 상세 내용으로는 출동건수, 구조건수, 구조인원, 출동건수(1일평균), 구조건수(1일평균), 구조인원(1일평균)의 자료를 제공합니다.또한, 2025년 기준 현황을 전년도(2024년)와 대비하여 증감(건) 및 증감(퍼센트)를 비교하여 제공하고 있습니다.본 데이터는 연도별 통계자료이므로 매년 자료를 통합하여 업데이트하고 있습니다.
