description_portal: 재해 발생 시 이재민 지원을 위해 비축된 구호물품의 현황 정보를 조회할 수 있도록 제공하는 공공데이터 서비스입니다.                                                                                                                                                                                                  구호물품은 재난으로 피해를 입은 이재민들에게 즉시 지급되어야 하는 생필품·구호용품으로, 해당 서비스를 통해 물품의 유형, 물품명, 보관 장소, 보관 장소 연락처, 보관 위치(위도·경도) 등의 정보를 조회할 수 있습니다. 물품 유형(type)과 물품명(dataNm)으로 검색 조건을 지정할 수 있으며, 보관 장소(place)로 특정 지역에 비축된 물품 현황을 조회하는 것도 가능합니다. 이 서비스는 재난 대응 기관 및 관련 시스템에서 다음과 같은 목적으로 활용될 수 있습니다. 첫째, 재난 발생 전 단계에서 지역별·유형별 구호물품 비축 현황을 사전에 파악하여 물품 부족 구간을 점검하고, 구호물품 보충 계획 수립 및 비축 창고 배치의 적절성을 검토하는 데 활용할 수 있습니다. 둘째, 재난 발생 시 피해 지역 인근에 어떤 물품이 얼마나 비축되어 있는지를 즉시 조회하여, 구호소별 물품 배분 계획을 신속하게 수립하고 이재민에게 필요한 물품이 적시에 전달될 수 있도록 지원합니다. 셋째, 보관 장소의 위도·경도 정보를 활용하여 GIS 기반 재난 관제 시스템에서 구호물품 창고의 위치를 지도 위에 시각화하고, 피해 지역과의 거리를 고려한 최적 물품 조달 경로를 파악하는 데 활용할 수 있습니다. 넷째, 구호소 API(relief-shelter)와 연계하여 구호소별 수용 인원 대비 인근 구호물품 보유 현황을 비교 분석함으로써, 재난 상황에서 구호 자원의 균형 있는 배분을 위한 의사결정을 지원할 수 있습니다.
