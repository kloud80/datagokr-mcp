summary_user: 전남광주통합특별시 안에 비축된 이재민 구호물품을 보관 장소별로 한 건씩 담으며, 물품 유형·물품명·보관 장소·연락처·위도·경도를 포함한다. 재난 대응 담당자나 분석가가 '피해 지역 인근 창고에 어떤 구호물품이 비축돼 있고 어디로 연락하면 되나'를 확인하거나, 지역별·유형별 비축 공백을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 보관 장소명·주소 매칭이나 좌표(위도·경도) 기반 거리 계산으로 대피소·구호소 데이터와 이어 쓴다.
