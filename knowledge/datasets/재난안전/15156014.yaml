description_portal: 본 데이터셋은 2023년부터 2024년 사이 발생한 지진의 물리적 상세 정보와 시공간 분포 현황을 제공하는 재난 안전 핵심 자료입니다. 지진이 감지된 실제 발생 시각과 기상청의 공식 발표 시각을 함께 기록하여 신속 대응 체계를 분석할 수 있으며, 진앙의 정확한 위도·경도 좌표와 지하 깊이(km), 그리고 지진의 에너지 크기를 나타내는 리히터 규모 정보를 통해 지진의 강도와 파급 범위를 정밀하게 파악할 수 있습니다.단순 수치 데이터를 넘어 발생 위치를 시각적으로 즉시 확인할 수 있는 위치도 URL과 대국민 행동 요령이 담긴 안내 정보를 포함하고 있어, 실제 재난 발생 시 상황 전파 및 의사결정 지원에 유용합니다. 이 데이터는 지역별 지진 발생 빈도와 단층 활동성을 분석하여 내진 설계 기준을 검토하거나, 지진 위험도 지도를 제작하는 등 도민의 안전을 확보하기 위한 선제적 방재 정책 수립 및 도시 안전망 구축에 필수적인 기초 데이터로 활용됩니다.
