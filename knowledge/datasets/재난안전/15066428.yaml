description_portal: 경찰청 형사국 여성청소년범죄수사과에서 제공하는 성폭력범죄 범죄자의 전과 유무 현황 통계 자료입니다. 이 자료는 2014년부터 2024년까지 성폭력 범죄로 검거된 범죄자들을 전과자와 초범으로 구분하여 연도별 인원을 보여줍니다. 통계에 따르면 전과자 수는 2014년 12,478명에서 2017년 14,527명으로 증가하다가 2024년 12,817명을 기록했습니다. 초범의 경우 2014년 12,822명에서 2022년 27,057명으로 크게 증가한 후 2024년 19,913명으로 나타났습니다. 특히 2022년에 초범의 수가 전과자의 두 배 이상을 기록하며 급증하는 모습을 보였습니다. 이 통계는 성폭력 범죄를 저지르는 인구의 특성과 재범률 추이를 파악하는 데 중요한 정보를 제공합니다.
