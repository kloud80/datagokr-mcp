description_portal: 본 자료는 해양경찰청 홈페이지에 게재된 동영상 데이터로, 서핑 시 반드시 알아야 할 필수 안전정보를 노래 형식으로 전달하는 홍보 영상을 포함하고 있다. 해당 영상은 서핑 전 확인해야 할 기상·파도 정보, 적절한 장비 착용, 포인트 선택 요령, 충돌 및 이탈 사고 예방을 위한 행동수칙 등 주요 내용을 음악과 함께 쉽고 흥미롭게 전달한다. 특히 반복적인 멜로디와 직관적인 가사를 활용하여 모든 연령층이 안전수칙을 자연스럽게 익힐 수 있도록 구성되었으며, 서핑 인구 증가에 따라 높아지는 안전사고 위험을 예방하는 데 목적을 두고 제작되었다. 본 콘텐츠는 해양안전 교육, 캠페인, SNS 홍보 등 다양한 분야에서 활용할 수 있다.
