description_portal: 해상집단행동 연도별 현황(2018~2025년) 데이터는 어업인, 수산단체, 지역주민 등이 해상에서 실시한 집단행동 중 어업권 분쟁 관련 집단행동 및 규제완화 관련 집단행동의 발생 현황을 연도별로 집계한 통계자료입니다.본 데이터는 어업구역 중첩, 조업구역 침범, 어업권 설정 및 행사, 수산자원 이용 등을 둘러싼 어업권 분쟁과 어업규제, 조업제한, 수산정책 개선 및 규제완화 요구 등과 관련하여 발생한 해상집단행동에 대한 발생 건수, 참여 선박 수, 참여 인원 수를 제공합니다.해상집단행동은 다수의 선박 또는 인원이 참여하여 해상에서 집회, 시위, 항의행동, 해상행진, 선박시위 등의 형태로 이루어진 집단적 의사표시 활동을 의미합니다.※ 발생 건수는 동일 사안이라도 발생 일자 또는 장소가 다른 경우 별도 건으로 집계될 수 있습니다.※ 참여 선박 수와 참여 인원 수는 집단행동 발생 당시 관계기관이 파악한 현황을 기준으로 작성되었으며, 사후 정정에 따라 변경될 수 있습니다.※ 본 데이터는 연도별 집계 통계자료로 개별 집단행동의 세부 위치, 단체명, 참가자 개인정보 등은 포함하지 않습니다.※ 통계 작성 기준 변경, 자료 보완 또는 오류 정정 시 과거 연도의 통계가 수정될 수 있습니다.
