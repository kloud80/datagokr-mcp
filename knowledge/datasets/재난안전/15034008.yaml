summary_user: 부산광역시가 지정한 방사선 비상 시 이재민 구호소를 시설 단위로 담은 원천 목록으로, 구호대상·구호소명·도로명주소·기준거리·전화번호·수용가능인원·관리번호와 위경도 좌표를 포함하며 포털 설명 기준 549곳(2025.5.19 기준)이다. 원전 사고 등으로 방사능이 유출될 때 우리 동네에서 가장 가까운 구호소가 어디이고 몇 명을 수용하는지 확인하려는 시민이나, 구별 수용 능력을 점검하려는 방재 담당자·분석가가 쓴다. 전역 조인 키는 없으므로 구·군 이름(autOkrug)이나 주소·위경도로 다른 대피·구호시설, 방사능 방재 자료와 위치 기준으로 이어 쓴다.
description_portal: 지진발생에 따른 원자력 발전소의 파손이나 특수 상황에서 발생할 수 있는  방사능(방사선) 유출 등의 피해로 부터 시민들이 안전하게 피신하여 방사능의 위험으로 보호받을 수 있는 이재민 구호시설 개방 데이터 입니다.개방데이터에는 구호대상, 구호소 명, 도로명 주소, 기준 거리, 전화번호, 수용가능인원, 관리번호 등이 포함되어 있습니다.해운대구 1, 중구 12, 동구 21, 수영구 23,   서구 30, 연제구 35, 영도구 36, 강서구  40, 사상구 44, 동래구 53, 북구, 58, 남구 59, 사하구 61, 부산진구 76 등 총 549 곳의 구호소가 있습니다.방사능 유출 사고 발생시 지정된 구호소를 파악하여 안전하게 대피할수 있습니다.*기준일 2025.5.19 현재
