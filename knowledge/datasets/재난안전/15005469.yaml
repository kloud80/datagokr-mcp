summary_user: 대구광역시 소방관서(부서)별로 위치, 정원, 펌프·탱크·고가굴절·화학·구조·구급 등 차종별 소방차량 보유 대수, 관할면적, 119안전센터·구조대·지역대 수를 한 행씩 담은 집계 파일이며 CSV 크기는 916바이트로 작다. 분석가나 시민이 '대구 각 소방서는 관할면적에 비해 정원과 구급차·펌프차를 얼마나 갖고 있나'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방 데이터(화재 발생, 소방용수 등)와는 부서명이나 관할 행정구역 이름을 맞춰서 연결한다.
