description_portal: '충청북도 내 교통약자를 위한 주요 시설에 대한 지오펜스(가상반경) 정보를 수록한 데이터로, 교통약자의 이동권 보장과 안전한 접근성 확보를 위한 공간 정보를 포함하고 있습니다. 데이터는 시도, 시군구, 읍면동 등 행정구역 정보를 비롯하여, 법정동코드, 시설종류(예: 복지관, 병원 등), 시설구분(공공/민간), 시설명, 시설주소 등의 기본적인 시설 정보를 제공합니다. 또한 각 시설에 대해 반경(m 단위), 경도, 위도 등의 위치 좌표와 함께, 해당 시설이 주로 어떤 교통약자 계층을 대상으로 하는지 나타내는 ‘시설대상’ 항목도 포함되어 있습니다. 이 데이터는 교통약자 이동경로 분석, 교통편의시설 설치 계획 수립, 스마트시티 정책 지원 등 다양한 공공 목적에 활용될 수 있습니다.'
