summary_user: 경기도 안산시 관내에 지정된 이재민 임시주거시설(행정복지센터·학교·체육관·경로당 등)을 시설 한 곳당 한 행으로 담은 파일이며, 시설별 도로명주소·면적·수용가능인원·대표전화·위도/경도를 포함한다. 재난으로 집을 잃은 주민이 "우리 동네에서 가장 가까운 임시주거시설은 어디이고 몇 명까지 수용하나"를 확인하거나, 담당자가 동별 수용 여력을 따져 대피·구호 계획을 세우는 데 쓴다. 전역 조인 키는 없으므로 주소나 위도·경도를 기준으로 다른 대피·구호시설 데이터, 재난 위험지역 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 안산시 관내에 지정된 이재민 수용 시설의 현황을 상세히 기록한 자료입니다. 일동, 이동, 사동, 본오동, 부곡동, 월피동, 성포동, 와동, 고잔동, 원곡동, 신길동, 초지동, 선부동, 대부동 등 안산시 전역의 행정복지센터, 학교(초·중·고), 체육관, 경로당 등 100여 곳 이상의 시설을 포함하고 있습니다. 각 시설별로 "소재지 도로명 주소"와 "지번 주소", "시설 면적(㎡)", 최대 "수용 가능 인원(명)", "대표 전화번호", 그리고 위치 좌표(위도, 경도)가 구체적으로 명시되어 있습니다. 이 자료는 재난 발생 시 신속한 대피 계획 수립, 구호 물자 배분, 이재민 보호 활동 등 재난 대응 체계를 구축하고 관리하는 데 필수적인 기초 데이터로 활용됩니다.
