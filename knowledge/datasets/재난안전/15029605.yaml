summary_user: UN번호(unno)로 조회하는 해상운송 위험물(IMDG Code) 정보로, 물질별로 IMDG 명칭(국문·영문), 종류·품목, 위험물 등급과 부등급, 포장등급, 특별규정, 포장·탱크 운송 지침, 비상조치 코드, 적재 방법을 한 건씩 담고 범위는 전국·비공간이다. 화주·포워더·선사 담당자가 "이 UN번호 화물은 몇 등급이고 어떤 용기와 적재 방법으로 선적해야 하나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, UN번호나 물질명을 기준으로 다른 위험물·화학물질 자료와 이름·코드 매핑으로 연결하는 정도로만 이어 쓴다.
