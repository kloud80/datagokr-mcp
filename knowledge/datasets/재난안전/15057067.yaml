summary_user: 경기도 시군별 민방위 비상급수시설을 시설 한 곳 단위로 담으며, 시설명·인허가일자·폐업일자·영업상태와 도로명/지번 주소, 위도·경도 좌표, 시설구분을 함께 싣는다. 단수나 재난 때 시민이 '우리 동네에서 가장 가까운 비상급수시설은 어디인가'를 찾거나, 분석가가 시군별 급수시설 분포와 운영 상태를 점검하는 데 쓴다. 전역 조인 키는 없어서 다른 대피·구호시설 데이터와는 좌표·주소 기반 공간 결합이나 시군코드(SIGUN_CD)·시설명 매핑으로 이어 쓴다.
description_portal: 이 데이터는 상수도 공급이 중단되는 비상상황에서 생활용수를 제공하기 위한 민방위 급수시설의 인허가 현황을 수록하고 있으며, 시군별로 정리된 급수시설의 위치와 행정적 상태 정보를 포함합니다. 주요 항목으로는 급수시설명(BIZPLC_NM), 인허가일자(LICENSG_DE), 폐업일자(CLSBIZ_DE), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT), 시설구분명(FACLT_DIV_NM), 비상시설위치(EMRGNC_FACLT_LOC), 시설명건물명정보(FACLT_NM_BULDNG_NM_INFO) 등이 있으며, 시민의 비상시 접근성을 높이기 위한 위치 기반 정보가 강조되어 있습니다.이 데이터는 자연재해, 대규모 단수 등 재난 상황에서 생활용수 공급 체계의 분산 배치를 분석하거나, 비상 대응 인프라 개선 및 시설 확충 계획 수립에 활용됩니다. 또한 급수시설별 인허가 이력과 운영 상태를 통해 공공급수망의 유지관리 상태를 점검하거나, 시설의 노후화 여부 등을 판단하는 기초 자료로도 활용 가능하며, 재난관리 매뉴얼 구축 및 민방위 교육 자료로도 유용한 정보를 제공합니다.
