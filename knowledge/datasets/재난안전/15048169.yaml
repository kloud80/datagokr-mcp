description_portal: 광주광역시  청사 1층에 위치한 어린이 안전체험관 현황(설치연도, 체험시설 현황, 체험가능인원 등)과 관련하여, 기타사항 등의 상기 기재된 정보를 제공하는 서비스입니다.재난 · 사고에 대응하는 방법~실제 상황처럼 구성된 10종의 안전교실을 어린이 눈높이에 맞게 몸으로 놀이로 체험하며, 안전의 중요성과 다양한 상황에 대처하는 방법을 배울 수 있는 어린이 안전체험교육 기관입니다. 체험운영은 월~금요일과 매달 2,4째주 토요일에 운영할 수 있으며, 체험시간은 1일 3시간(10시, 14시, 16시)로 소요시간은 40~70분입니다.
