summary_user: 안동시에서 기계설비 성능점검 대상인 건축물을 한 건물당 한 행으로 담은 목록이며, 건물명·주소·연면적·공동주택 세대수·데이터기준일자를 포함한다(csv 약 3KB의 작은 파일). 건물 관리주체나 시민이 '우리 건물이 기계설비 성능점검 대상인가', 분석가가 '안동시 점검 대상 건축물이 어디에 얼마나 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시설 안전 원장이나 건축물대장과는 주소·건물명을 맞춰 연결해야 한다.
description_portal: 건축물 관리주체의 유지관리 및 성능점검 계획 수립 의무 이행을 돕고, 건축물 안전과 효율적인 기계설비 관리에 활용할 목적으로 수집되었습니다. 세부 항목은 기계설비 유지관리 및 성능점검 대상 건축물의 관련 정보로 구성됩니다. 안동시 건축물의 기계설비 성능점검 대상 현황 파악을 통해 건축물 에너지 효율 관리, 노후 설비 교체 계획 수립, 안전사고 예방 등 건축물 관리의 효율성을 높이는 데 기여할 것으로 기대합니다. 시민들이 안전하고 쾌적하게 생활할 수 있는 환경 조성에 중요한 기반 자료로 활용될 것입니다.
