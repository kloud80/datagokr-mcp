summary_user: 서민층 가스시설 개선사업의 추진 실적을 시도 등 지역 구분(구분)별 행, 2011년부터 2025년(예정)까지 연도별 열로 정리한 전국 단위 집계표(1.5KB 내외 CSV 한 개)입니다. 가스안전 정책 담당자나 분석가가 "어느 지역에서 노후 가스시설 개선이 해마다 얼마나 진행됐는가"를 비교하거나 연도별 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명(시도 이름)을 직접 맞춰 이어 써야 하며, 가스사고·인구 같은 지역별 통계와 이름 매핑으로 연결한다.
limits: 개별 가구·시설 단위 원장이 아니라 지역×연도 집계표이므로 특정 시설이나 시군구 수준의 개선 여부는 알 수 없다. 표준 행정코드 같은 조인 키가 없어 지역명 매핑이 필요하다. 2025년 열은 예정치로 확정 실적과 구분해 해석해야 한다.
