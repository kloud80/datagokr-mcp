description_portal: '가스시설의 노후화로 사고가 우려되는 서민층을 대상으로 지자체와 합동으로 추진 중인 서민층 가스시설개선사업 추진 결과에 대한 연도별 자료 현황입니다.해당 데이터는 지역별 구분(서울,부산, 대구 등)과 연도별 추진현황으로 구성되어 있습니다.연도별 서민층 가스시설 개선사업 추진현황을 활용하여 가스안전관리 강화 등을 위한 통계자료, 서민층 가스안전 정책수립 등에 활용 가능합니다.※ 데이터 집계범위 : 2011년부터  2025년 11월 25일까지※ 연간 주기로 현황 정보가 업데이트되며 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고 바랍니다.- 데이터기준일 : 2025년 11월 25일'
