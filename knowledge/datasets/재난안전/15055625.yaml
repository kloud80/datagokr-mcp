description_portal: 이 데이터는 소방펌프차에 구급장비를 탑재하여 출동하는 '펌뷸런스' 시스템의 운영 현황을 보여주는 통계 자료입니다. 반기별로 응급처치 및 활동 지원을 위한 총 출동 건수를 기록하고 있으며, 출동 원인을 심정지, 심뇌혈관, 중증외상과 같은 위급상황과 교통사고, 주취, 거동불편 등 다양한 상태별로 상세하게 분류하고 있습니다. 이 자료를 통해 응급 상황의 유형별 발생 빈도와 펌뷸런스 시스템의 활동 내역을 분석할 수 있으며, 효율적인 응급의료 및 재난 대응 체계 구축을 위한 중요한 기초 데이터로 활용됩니다.
