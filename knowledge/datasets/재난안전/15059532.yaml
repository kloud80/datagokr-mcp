summary_user: 경기도 시군별 교통사고를 연도 단위로 집계한 통계로, 집계년도·시군명과 함께 발생건수·사망자수·부상자수를 담는다(건별 사고 원천이 아닌 집계). 지자체 교통안전 담당자나 분석가가 '경기도에서 교통사고 사망자가 많은 시군은 어디이고 연도별로 어떻게 변했나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군명(SIGUN_NM)이나 시군코드를 이름·코드 매핑해 인구·도로 통계나 교통사고다발지역 표준데이터 등 같은 개념의 사고 데이터와 이어 쓴다.
description_portal: 경기도 내의 시군별 교통사고 집계 현황입니다. 시군마다의 연도별 발생건수, 사망자수, 부상자수 등의 정보를 제공합니다.이 데이터는 경기도 내 각 시군에서 발생한 교통사고의 연도별 집계 현황을 제공하며, 사고의 규모와 피해 정도를 정량적으로 파악할 수 있는 자료입니다. 주요 항목은 집계년도, 시군명, 발생건수(건), 사망자수(명), 부상자수(명) 등으로 구성되어 있으며, 해당 통계를 통해 시군별 교통사고 발생 빈도, 치명률, 교통안전 수준 등을 비교할 수 있습니다. 이 자료는 교통사고 예방 대책 수립, 사고다발지역 도출, 지역별 도로안전 정책 마련, 응급의료 인프라 재배치 등에 유용하게 활용되며, 특히 고위험 시군을 선별해 맞춤형 교통안전 대책을 마련하는 데 활용될 수 있습니다. 데이터는 경찰청 또는 지방자치단체 교통안전 부서에서 수집한 공공통계입니다
