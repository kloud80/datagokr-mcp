description_portal: 본 자료는 한국승강기안전공단이 관리하는 승강기 고장통계를 정리한 데이터입니다. 구성은 ① 고장 총괄현황(보유대수·고장건수), ② 승강기 종류별 고장현황, ③ 고장 유형별 현황으로 구분되며, 표는 연도 행과 분류 항목 열로 고장건수를 제공합니다. 종류별 현황은 승객용·화물용·에스컬레이터·휠체어리프트 등으로 집계되고, 유형별 현황에는 ‘운행하려는 층으로 운행되지 않음’, ‘운행 중 정지’, ‘출입문이 열린 상태로 움직임’, ‘출입문 이탈·파손으로 정지’, ‘최상층·최하층 통과’, ‘매다는 장치 이탈·추락’ 등이 포함됩니다. 에스컬레이터 관련 항목으로는 ‘손잡이 속도 이상’, ‘상승 역행’, ‘디딤판 이탈·파손’ 등이 제공됩니다. 각 표는 연도, 승강기종류, 고장유형, 고장건수 등 표준화된 필드를 사용하며, 총괄현황에는 연도별 보유대수와 고장건수가 함께 제시됩니다. 동일한 체계로 정리되어 연도·장비유형·고장유형 간 비교가 가능합니다.
