summary_user: 서울특별시 119종합방재전산정보시스템의 소방서 관할구역 공간정보로, 소방서별로 이름(FRSTN_NM)·코드와 좌표(X·Y, 중심점 좌표 포함)를 담으며 범위는 서울 시 단위, 행정단위는 개별 주소·좌표 수준이다. 분석가나 시민이 '이 지점은 어느 소방서 관할인가', '소방서별 관할 범위와 화재·소방용수 분포는 어떤가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 소방 데이터(화재 발생 건별, 소방용수 위치, 119안전센터 등)와는 소방서 이름·코드 매핑이나 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: '119종합방재전산정보시스템의 소방서관할 공간정보로 좌표(X,Y)등의 정보를 제공하는 서비스 입니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)※ 제공부서 : 서울특별시 서울종합방재센터 전산통신과(02-726-2282)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
