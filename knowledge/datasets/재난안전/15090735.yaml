summary_user: 인천광역시 서구(서해구) 안의 급경사지와 붕괴위험지역을 한 곳씩 행으로 담은 파일 데이터로, 명칭·등급·읍면동·지번·붕괴위험지역 지정 여부·용도·구조·유형을 필지·건물 단위로 기록한다. 주민이나 구청 안전 담당자가 '우리 동네에 붕괴위험지역으로 지정된 급경사지가 어디이고 등급은 몇인가'를 확인하거나 사전 예방·정비 대상지를 고를 때 쓴다. 전역 조인 키는 없어서 읍면동·지번을 주소로 맞춰 대피시설·재해위험지구·토지 규제 레이어 등과 이름·주소 매칭으로만 잇는다.
description_portal: 본 공공데이터는 인천광역시 서구 내 급경사지 및 붕괴위험지역에 대한 정보를 제공하고 있습니다. 본 데이터는 인천광역시 서구 내 급경사 지 및 붕괴위험지역의 명칭, 등급, 읍면동, 지번, 붕괴위험지역지정여부, 용도, 구조 등의 항목으로 구성되어 있습니다. 본 데이터를 통해 위험지역에 대한 사전 예방조치 및 긴급 대응 계획 수립, 재해취약지역 정비 사업 등 다양한 안전 대비 사업에 활용이 가능할 것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
