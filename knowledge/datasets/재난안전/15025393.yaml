summary_user: 전국 시군구 단위로 지방자치단체가 지정 고시한 재해위험저수지를 저수지 한 건씩 시도·시군구·저수지명·지정일자로 담은 목록 파일이며, 파일 크기는 약 7KB(csv)이다. 주민이나 지자체·방재 분석가가 '우리 시군구에 붕괴·유실 위험으로 지정된 저수지가 있는가, 언제 지정됐는가'를 확인하거나 지역별·지정연도별로 집계하는 데 쓴다. 전역 조인 키나 행정코드는 없어서 다른 재난·위험지역 데이터와는 시도·시군구 이름이나 저수지명을 직접 맞춰야 연결된다.
description_portal: 지방자치단체가 저수지 안전점검을 실시한 후, 재해위험성(저수지 제체 및 부속 시설의 붕괴 유실 등으로 인한 피해)이 높다고 판단되는 경우 재해위험저수지로 지정고시하고 안전조치를 취하고 있습니다.(저수지댐의 안전관리 및 재해예방에관한 법률 제9조에 근거) 재해위험저수지는 관련 법령(농어촌정비법)에 따라 정밀안전진단을 실시하고 보수 보강 등 정비사업을 시행하며, 해당 데이터는 시도,시군구별 재해위험저수지 및 재해위험저수지명, 지정일자 정보를 제공합니다.  지역별로 구분하거나, 지정연도로 구분하여 사용할 수 있습니다.
