description_portal: '1. 주요 설치 시설 및 운영 현황광산구는 관내 교량, 응달 구간, 경사로 등 주요 상습 결빙지를 중심으로 결빙방지 시스템을 구축하여 관리하고 있습니다.자동 염수 분사 장치: 기온이 급격히 낮아지거나 강설이 예상될 때, 원격 제어 또는 센서 감지를 통해 도로 표면에 제설액(염수)을 살포하는 시설입니다. 초동 제설 효과가 뛰어나 사고 예방에 핵심적인 역할을 합니다.도로 열선(스노우 멜팅): 도로 포장면 아래에 열선을 매립하여 눈을 직접 녹이는 시스템입니다. 환경 오염 우려가 적고 경사로 등 제설 차량 진입이 어려운 구간에서 효율적으로 작동합니다.구간 관리: 각 시설은 도로의 특성에 맞춰 최적의 구간 길이로 설치되어 있으며, 현재(2026. 04.)까지 지속적인 점검과 유지보수가 이루어지고 있습니다.2. 향후 계획 및 업데이트 안내현재 시점을 기준으로 광산구 내에 추가적인 설치 계획은 확정된 바 없습니다. 기존에 설치된 시설물의 안정적인 운영과 효율적인 관리에 집중하고 있으며, 향후 기상 여건 변화나 도로 환경 개선 사업 등에 따라 계획이 변경될 경우 관련 자료를 즉시 업데이트할 예정입니다.3. 상세 정보 및 민원 문의도로 결빙방지시설의 정확한 지번별 위치, 구체적인 구간 연장(m), 또는 장비의 사양 등 세부적인 데이터가 필요하신 시민이나 관계자분들께서는 아래 담당 부서로 연락해 주시기 바랍니다.담당 부서: 광주광역시 광산구청 건설과담당 팀: 도로관리팀주요 문의 내용: 시설물 상세 위치 확인, 신규 설치 건의, 고장 신고 및 기타 도로 관리 관련 사항'
