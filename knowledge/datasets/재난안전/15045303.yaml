summary_user: 인천광역시 소방관서별로 로프발사총·유압전개기·열화상 카메라·화학보호복(레벨A)·잠수장비·산악구조장비 등 구조장비와 대테러 소방장비의 보유 수량을 담은 집계표이며, 3842바이트 크기의 CSV 파일 한 개로 제공된다. 소방행정 담당자나 분석가가 "어느 소방서에 매몰자 영상탐지기나 누출제어 장비가 부족한가"를 확인해 장비 배치·예산 편성을 검토하는 데 쓴다. 전역 조인 키가 없어 소방서 이름(관서별)을 기준으로 다른 소방서별 출동·화재 통계와 이름 매핑으로 이어 쓴다.
