summary_user: 한국가스안전공사가 집계한 품질경영(ISO9001)·환경경영(ISO14001)·안전보건경영(ISO45001) 인증기업 수를 연도별 한 행씩 담은 전국 단위 집계 통계로, 포털 설명상 2019~2024년을 다루며 파일 크기가 203바이트에 불과한 소규모 표다. 가스안전 정책 담당자나 분석가가 "최근 몇 년간 안전보건경영시스템 인증을 받은 기업이 늘었는가"처럼 인증 종류별 추세를 볼 때 쓴다. 전역 조인 키가 없고 연도만 있으므로, 다른 연도별 가스사고·산업재해 통계와 연도를 기준으로 나란히 놓고 비교하는 식으로만 이어 쓴다.
description_portal: '연도별 ISO인증기업현황 데이터 입니다. 해당 데이터는 품질경영시스템(ISO9001), 환경경영시스템(ISO14001), 안전보건경영시스템(ISO45001)을 연도별 현황으로 보여줍니다.가스 안전 사고와 같은 산업재해 예방 및 대응 체계 분석에 참고할 수 있으며, 가스안전관리 정책 수립 시 민간 기업과의 협력방향 제시 및 정책 우선순위 설정에 활용될 수 있습니다.※ 해당 데이터는 공사가 안전관리 업무 활용을 위해 수집, 관리하는 정보로, 타 유관기관이 제공하는 정보와 상이할 수 있으니 참고 바랍니다.※ 2019년부터 2024년까지 집계된 통계 정보를 제공합니다.- 데이터기준일 : 2025년 9월 15일'
