summary_user: 재난안전데이터 공유플랫폼의 비상급수 정보로, 재난연도·재난유형·재난일련번호별로 급수지명(RSVR_NM), 상수도·급수 유형, 상세주소, 급수 용량·인원, X·Y좌표를 담으며 범위는 전국입니다. 재난으로 단수가 났을 때 주민이나 지자체 담당자가 '우리 동네에서 가장 가까운 비상급수 장소가 어디고 몇 명분을 공급하나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 대피·구호시설 데이터와는 지역코드·법정동코드나 주소·시설명 매핑으로만 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 비상급수 정보로, 재난연도, 재난유형코드, 재난일련번호, 지역코드, 상수도유형코드, 급수유형코드, 급수지명, 상세주소, X좌표, Y좌표 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
