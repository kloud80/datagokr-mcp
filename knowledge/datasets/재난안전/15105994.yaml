summary_user: 산업안전보건법에 따라 지정받은 안전관리전문기관을 기관 한 곳당 한 행으로 담은 전국 명단 파일로, 기관명·주소·전화번호·지정관서를 담는다. 상시근로자 300명 미만 사업장의 사업주가 "우리 지역에서 안전관리자 업무를 위탁할 수 있는 지정 기관은 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소(주소명)를 문자열로 맞추거나 지정관서 이름으로 묶어 연결해야 한다.
description_portal: ㅇ 산업안전보건법 제17조에 따라 사업의 종류, 상시근로자 수 등에 해당하는 사업장의 사업주는 사업장에 안전에 관한 기술적인 사항에 관하여 사업주 또는 안전보건관리책임자를 보좌하고 관리감독자에게 지도ㆍ조언하는 업무를 수행하는 사람인 안전관리자를 두어야 합니다.  - 한편, 상시근로자 수가 300명 미만인  사업장의 사업주는 같은 법 제21조에 따라 지정받은 안전관리 업무를 전문적으로 수행하는 기관인 안전관리전문기관에  안전관리자의 업무를 위탁할 수 있습니다.ㅇ 이에 안전관리전문기관 지정 현황* 파일을 등록하오니 해당 데이터를 활용하여 필요한 안전관리전문기관 정보를 확인하시기 바랍니다.   * (항목) 연번, 기관명, 주소명, 전화번호, 지정관서
