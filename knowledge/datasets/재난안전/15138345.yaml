description_portal: '본 데이터는 한국승강기안전공단이 접수한 승강기 기술서류의 검토 과정을 정형화해 기록한 내역입니다. 각 행에는 ①서류검토일자 ②반복항목 수치값(동일 파일 내 다수 제원 항목 구분용 인덱스) ③첨부파일명(PDF·HWP 등) ④시작값(해당 항목의 기준/초기값) ⑤승인여부(상태코드: Y 등) ⑥서류제원 입력값(숫자·텍스트)이 포함됩니다. 하나의 첨부파일에 여러 제원 항목이 있어 동일 파일명이 복수 행으로 분리될 수 있으며, 동일 항목에 대해 승인·미승인 상태가 병렬로 나타날 수 있습니다. 본 데이터는 기술서류 적합성 판단 근거 추적, 기준값-실입력값 비교, 항목별 승인율·보완 추세 분석, 검토 품질관리 및 사후감사 등에 활용할 수 있습니다.'
