summary_user: 서울특별시경찰청 소속 경찰서마다 보유한 112순찰차 대수(대수)를 경찰서 한 행씩 정리한 집계 파일로, 내려받은 CSV는 415바이트 규모의 작은 표입니다. 시민이나 분석가가 '우리 지역 경찰서에는 순찰차가 몇 대 배치돼 있나', '서울 경찰서 간 순찰차 보유 규모는 어떻게 다른가'를 비교하는 데 쓴다. 공통 조인 키가 없어 경찰관서 위치나 지역별 범죄 발생·112신고 데이터와는 경찰서 이름(경찰서)을 맞춰서 연결한다.
limits: 실측 컬럼에 전역 조인 키나 행정코드가 없어 다른 데이터와는 경찰서명 매핑으로만 연결되며, 표기 차이에 주의해야 한다. 좌표가 없는 비공간 자료라 지도에 바로 올릴 수 없고, 순찰차의 운행 실적이나 지구대·파출소 단위 배치는 담지 않는다.
