description_portal: '국토안전관리원에서 제공하는 데이터이며 항만시설물, 시도별, 종별 통계현황의 CSV형식의 파일데이터를 제공합니다. 25년 12월 31일 기준 데이터 임을 알려드립니다.항만시설물이란 선박의 출입, 사람의 승선·하선, 화물 하역·보관 및 처리, 해양친수 활동 등을 위해 항만구역 안팎에 설치된 모든 구조물과 부대시설을 말합니다.여기에는 방파제, 안벽, 항로, 여객터미널, 도로, 철도 등 항만 기능의 근간이 되는 시설뿐만 아니라 화물을 가공하거나 부가가치를 창출하는 시설도 포함됩니다.항만시설물의 종류수역시설: 항로, 정박지, 선회장 등 선박의 안전하고 원활한 항행 및 정박을 위한 시설입니다.외곽시설: 방파제, 호안, 방조제 등 파랑이나 해일로부터 항만을 보호하는 구조물입니다.계류시설: 안벽, 물양장, 부잔교, 선착장 등 선박을 접안시키기 위한 시설입니다.임항교통시설: 항만과 배후 지역을 연결하는 도로, 철도, 교량 등 육상 교통시설입니다.여객시설: 여객터미널 등 여객의 승하선을 위한 시설입니다'
