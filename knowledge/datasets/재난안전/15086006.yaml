description_portal: 해당 데이터는 경기도북부경찰청 관내에서 발생한 5대 범죄 발생 건수 및 검거 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 5대 범죄는 살인, 강도, 성범죄, 절도, 폭력으로 구분되어 있습니다. 2016년부터 최근 연도인 2025년까지의 현황을 경찰서별 발생건수, 검거건수, 검거인원으로 구분하여 제공하고 있어, 해당 기간 동안의 연도별 5대 범죄 발생건수 및 검거 현황을 파악할 수 있습니다. 이를 통해 특정 연도에 발생한 5대 범죄 건수, 검거 건수 및 인원수를 비교하여 분석할 수 있습니다. 이 자료는 5대 범죄와 관련된 경찰 활동을 보여주며, 해당 현황은 경기북부경찰청 형사과에서 제공합니다.* 2025년 통계는 미확정으로 추후 수치가 변동 될 수 있음('26년 10월 중 확정 통계 등록 예정)
