description_portal: '본 자료는 전력수급 이상 발생 시 한국승강기안전공단이 유지관리업체에 상황을 알리기 위해 발송한 안내 현황을 정리한 데이터입니다. 각 레코드는 통보 대상 건을 나타내며, 필드는 단계, 통보문구, 회사명으로 구성됩니다. 단계는 예비전력 관심·주의·심각 등으로 구분되며(예: 1·2·3단계), 통보문구에는 단계별 상황 설명과 출동·구출 준비 요청 등 고정 서술이 포함됩니다. 회사명은 통보를 받은 유지관리업체를 식별하기 위한 항목으로, 동일 업체에 대해 단계 변경 또는 시점별로 복수 건이 존재할 수 있습니다. 본 자료는 전력수급 상황에 따른 통보 메시지의 유형과 수신 대상 분포를 표 형태로 제시하며, 동일 단계 문구가 여러 업체에 반복 발송된 기록이 포함됩니다. 특정 시점의 안내 포맷이 통보문구에 그대로 반영되어 있을 수 있으며, 표기 방식은 당시 사용된 명칭과 서술을 따릅니다.'
