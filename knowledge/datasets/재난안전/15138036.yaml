description_portal: 본 자료는 한국승강기안전공단에서 시행하는 승강기 안전교육 과정의 평가 운영과 관련된 통계 정보를 제공합니다. 승강기 안전교육은 교육 효과성을 검증하고 학습자의 이해도를 확인하기 위해 과정별 평가를 시행하며, 본 데이터는 해당 평가에서 활용된 평가지 현황을 집계한 것입니다. 데이터에는 시행평가 순번, 시행평가지 건수, 시행평가 문제건수, 등록일자 등이 포함되어 있어 교육 과정별 시험 운영 규모와 난이도를 객관적으로 파악할 수 있습니다. 이를 통해 교육 운영 기관은 평가 문제 수와 배점 구성 등 시험 체계의 적정성을 검토할 수 있으며, 학습자는 과정별 평가 수준을 이해하는 데 도움을 받을 수 있습니다.
