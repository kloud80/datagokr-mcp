description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)가 운영하는 JDC지정면세점(보세창고)에 설치된 영상정보처리기기(CCTV) 현황을 2019년을 기준으로 정리한 것입니다. 각 데이터는 해당연도, 설치 대상 구역, 책임자, 담당자 정보를 포함하며, 영상정보처리기기의 운영 현황은 공개장소와 비공개장소로 나누어 상세히 기록되어 있습니다. 특히 공개장소에 설치된 CCTV는 목적별로 구분되어 있으며, 대표적으로 범죄예방, 화재 및 안전사고 방지, 시설 보호, 물류 흐름 관리 등의 항목이 포함되어 있습니다. 설치 대상은 보세창고 내 특정 공간 또는 기능별 구역으로 구분되며, 책임자 및 담당자 항목은 영상정보 수집 및 운영과 관련한 관리 책임자를 명확히 하기 위한 정보로 활용됩니다. 본 데이터는 면세점 보안 체계 수립, 사고 예방 조치, 개인정보보호 법규 준수 등 다양한 분야의 점검과 평가에 활용 가능한 기초자료로 활용될 수 있습니다.
