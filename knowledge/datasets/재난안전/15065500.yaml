summary_user: 밀양소방서 관할 산악지형(천황산·재약산·가지산·운문산 등)에 비치된 구급함을 한 행에 한 개씩 담은 원장으로, 종류·관리번호·설치시기·설치·관리주체·설치장소·등산로 코스명을 담는다(CSV 약 3.6KB 규모의 작은 파일). 등산객이나 산악 구조 담당자가 '이 등산로 코스에서 가장 가까운 구급함이 어디에 있고 누가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 관할 센터·구조대 이름이나 등산로 코스명(코스명)을 문자열로 맞춰 119안전센터·산악 구조 관련 자료와 이어 쓴다.
description_portal: <데이터 수집목적 및 과정> 밀양소방서 관할지역에 비치된 구급함 위치 및 관리번호, 설치장소, 등 데이터를 활용하여 주요 산악지형(천황산, 재약산, 가지산, 화학산, 운문산, 가지산 등)에 비치된 구급함을 통해 유사시 현장대원들의 신속한 처치를 위한 데이터를 제공합니다. 뿐만 아니라 데이터를 활용하여 모든 사람에게 편리함을 제공하기 위한 데이터입니다.<데이터 구성 및 세부항목> 데이터는 종류, 관리번호, 설치시기, 설치주체, 관리주체, 장소, 설치장소, 등산로 코스명 등을 제공합니다.<데이터 현행화 시기> 해당 데이터는 연간 현행화 데이터입니다. 차기 업데이트 예정일은 2027년 2월 입니다.
