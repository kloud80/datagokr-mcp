summary_user: 고압가스안전관리법에 따라 업무를 위탁받은 전문검사기관을 한 기관씩 담은 전국 목록으로, 검사 대상 구분(특정설비·고압가스용기·LPG 용기)과 업소명, 소재지, 전화번호로 이루어진 소규모 파일(csv 약 5KB)이다. 가스업 종사자가 "우리 지역에서 LPG 용기나 특정설비 검사를 맡길 수 있는 기관은 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업소명이나 소재지 주소를 문자열로 맞춰서만 연결할 수 있다.
limits: 기관 코드나 사업자번호 같은 식별 키가 없어서 다른 가스 안전 데이터와 정확히 조인하기 어렵다. 범위는 전국이지만 좌표가 없는 비공간 데이터이므로, 지도에 표시하려면 소재지 주소를 따로 지오코딩해야 한다.
