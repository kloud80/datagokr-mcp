description_portal: '고압가스안전관리법에 따라 업무 위탁된 가스용기, 특정설비 등에 대한 전문검사기관의 지역별 현황(업소명, 소재지, 전화번호 등)을 제공하여 국민분(가스업 종사자)에게 편익을 제공하고자 공개하는 데이터입니다.해당 데이터는 구분(특정설비, 고압가스용기, LPG 용기), 업소명, 소재지, 전화번호로 구성되어 있습니다.지역별 전문검사기관 관련 통계성 정보 및 가스 안전관리 업무 등에 활용할 수 있습니다.소재지 정보 사용시 아래 정보를 확인 부탁드립니다.◈ : 검사장⊙ : 사무소※ 연간 주기로 현황 정보가 업데이트되며 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고 바랍니다.- 데이터기준일 : 2025년 9월 15일'
