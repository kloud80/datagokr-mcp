summary_user: 한국승강기안전공단이 집계한 전국 승강기 보유 현황을 지역·건물명·건물 용도·승강기 종류·정격속도별 보유 대수로 담은 파일 데이터이며, 검증 시 552,543행이 전국 범위로 수신되었다. 지자체 담당자나 분석가가 특정 지역이나 건물 용도에 승강기가 종류별로 몇 대 설치되어 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역·건물명 이름 매핑이나 같은 기관 코드로만 이어 쓸 수 있고, 같은 기관의 승강기 고유번호 단위 원장 계열과 연결해 볼 수 있다.
description_portal: 본 자료는 한국승강기안전공단에서 집계한 국내 승강기 보유 현황을 정리한 데이터입니다. 공단은 승강기 종합정보전산망을 통해 전국 승강기의 설치와 운행 현황을 관리하며, 이를 기반으로 한 다양한 통계와 정보를 제공합니다. 데이터에는 지역, 건물명, 건물 층수, 운행 층수, 승강기 종류, 건물 용도, 정격 속도, 보유 대수 등의 항목이 포함되어 있습니다. 승강기 종류는 승객용, 화물용, 병원용, 장애인용, 덤웨이터, 무빙워크, 경사형 휠체어리프트, 전망용, 자동차용 등 다양한 유형으로 분류되며, 건물 용도는 근린생활시설, 판매시설, 숙박시설, 교육연구시설, 공장, 창고시설 등으로 구분됩니다. 정격 속도는 0.13m/s에서 1.75m/s까지 다양하며, 각 건물별 보유 대수가 함께 기록되어 있어 지역별·건물별 승강기 현황을 종합적으로 파악할 수 있습니다. 본 자료는 특정 지역이나 건물 단위에서 승강기의 설치 현황을 세밀히 확인할 수 있는 기초 통계로 제공됩니다.
