description_portal: 한국전력공사가 보유한 낙뢰감시기를 통해 관측된 낙뢰 발생 지점에 대한 데이터입니다.시간, 경도, 위도, 크기 항목으로 구성되어 있습니다.(시스템 폐기로 과거 데이터를 참고용으로만 활용해주시기 바랍니다.)과거 낙뢰 발생 지점과 특성을 파악하는데 중요한 지리정보 기반 데이터로써 특정 지역의 낙뢰 발생 빈도와 강도를 상세하게 분석할 수 있습니다.위도와 경도 데이터를 기반으로 낙뢰 발생 지점과 전력설비 위치 정보를 결합하면 낙뢰로 인한 잠재적 전력설비 피해 위험 지역을 식별하는 등 다양한 분석에 활용 할 수 있습니다.또한 낙뢰가 잦았던 고위험 지역을 지도에 시각화하고 시간대별 낙뢰 발생 빈도 및 강도의 시계열 분석을 수행하는데 기초 자료로 활용할 수 있습니다.
