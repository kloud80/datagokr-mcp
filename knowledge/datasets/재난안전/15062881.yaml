summary_user: 경상남도 의용소방대 현황을 시군구별(signguNm) 집계 수량으로 담는 통계 API로, 남성·여성·전담·특수·지역 의용소방대 등 대 유형별 대원 수와 이에 대응하는 의료 관련 항목 수를 함께 제공한다. 지자체 담당자나 분석가가 경남 시군구별로 의용소방대 인력이 어떤 유형(남성대·여성대·전담대 등)으로 얼마나 편성돼 있는지 비교할 때 쓴다. 전역 조인 키는 없어 시군구 이름을 매핑해 같은 지역의 119안전센터·화재 발생 등 다른 소방 데이터와 연결한다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 시군구 이름 매칭에 의존해야 한다. 건별 원천이 아닌 수량 통계라 개별 대(隊)나 대원 단위 정보는 담지 않는다. 범위는 시도(경상남도) 단위이며 위치 좌표가 없는 비공간 데이터다.
