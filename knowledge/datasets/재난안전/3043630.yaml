summary_user: 2025년 1월 1일부터 12월 31일까지 전국 해상조난사고 4,636건을 건별로 담은 원천 파일 데이터이다. 발생일시·해역·원인·유형과 사고선박 수, 발생·구조·부상·사망·실종 인원이 건마다 들어 있어, 분석가나 해양안전 정책 담당자가 어느 해역·시간대·원인에서 조난이 잦은지 살피는 데 쓴다. 위도·경도(coord) 키로 인명구조함·파출소 위치나 해역 단위 데이터와 지도상에서 이어 쓰며, 코드표를 가진 필드는 없다.
description_portal: '해상조난사고에 대한 월별, 일자별 시간대별, 사고선박 수, 발생인원 수, 구조자 수, 부상자 수, 사망자 수, 실종자 수에 대한 정보를 제공합니다.근거법령 : 수상에서의 수색ㆍ구조 등에 관한 법률"조난사고”란 수상에서 다음 각 목의 사유로 인하여 사람의 생명ㆍ신체 또는 선박등의 안전이 위험에 처한 상태를 말한다.가. 사람의 익수ㆍ추락ㆍ고립ㆍ표류 등의 사고나. 선박등의 침몰ㆍ좌초ㆍ전복ㆍ충돌ㆍ화재ㆍ기관고장 또는 추락 등의 사고“수색”이란 인원 및 장비를 사용하여 조난을 당한 사람 또는 사람이 탑승하였을 것으로 추정되는 선박등을 찾는 활동을 말한다.“구조”란 조난을 당한 사람을 구출하여 응급조치 또는 그 밖의 필요한 것을 제공하고 안전한 장소로 인도하기 위한 활동을 말한다.해상조난사고 통계는 국내외의 해양경찰 관할 해상에서의 선박사고 발생 현황에 대한 통계로서 해양경찰의 해양안전정책 수립 및 학술연구의 기초자료로 활용국가승인통계(근거:2006 통계청 승인, 제155007호)로 공표하고 있습니다.'
