summary_user: 부산광역시 소방재난본부가 관리하는 비상소화장치를 장치 한 대씩 담은 건별 목록으로, 관할 센터, 시·구·동·리 코드와 번지, 비치 장비, 사용 여부, 지하 여부를 담는다(CSV 약 74KB, 범위는 시도·읍면동 단위). 전통시장·고지대·주택밀집지역처럼 소방차 진입이 어려운 곳에 "우리 동네에 쓸 수 있는 비상소화장치가 어디 있나"를 확인하거나, 구·동별 설치 분포를 보고 취약지역 보강을 검토하는 데 쓴다. 전역 공통 조인 키는 없어서 시·구·동 코드나 주소 이름을 매핑하거나, 센터(ID) 같은 같은 기관 코드로만 119안전센터·소방용수 자료와 잇는다.
description_portal: 부산광역시 소방재난본부에서 관리하는 비상소화장치의 정보를 제공합니다.- 개방 데이터는 부산광역시에서 관리하는 비상소화장치 데이터로  비상소화장치(ID), 센터(ID), 비상소화장치고유번호, 우편번호일련번호, 시코드, 구코드, 동코드, 리코드, 번지, 비치장비설명, 사용여부, 지하여부 등의 정보를 제공하며,- 화재 등 재난발생 시 인근 지역주민들이 해당장비를 활용하여 화재를 초기에 진압함으로써 화재골든타임 확보를 통한 시민의 생명 및 재산 보호에 기여할 수 있습니다.- 전통시장, 고지대, 주택밀집지역 등 소방차진입곤란지역에 설치하여 주민자율 화재대응체계 구축을 목적으로합니다.- 비상소화장치의 설치 및 관리 기준 제10조(비상소화장치의 조사)에 의거, 월 1회 자료조사와 병행하여 인근 지역주민들의 사용법 교육훈련을 진행합니다.<관련근거>- 소방기본법 제10조(소방용수시설의 설치 및 관리 등)- 소방기본법 시행규칙 제6조(소방용수시설 및 비상소화장치의 설치기준)- 소방기본법 시행규칙 제7조(소방용수시설 및 지리조사)- 비상소화장치의 설치 및 관리 기준<참고사항>- 부산상수도사업본부에서 관리중인 데이터와 상이할수 있으며,- 티맵 연계 비상소화장치 위치 확인 가능- 소화전 인근 불법주정차 관련 도로교통번 제32조에 따름- 매년 자체 예산 및 구군지원을 통한 취약지역 비상소화장치를 지속적으로 확대 설치하고 있으며 지역안전지수(화재분야)에 기여함- 2025년 소방용수시설 5개년 추진계획에 의거하여 분리형 비상소화장치를 일체형으로 교체추진에 있으며 사용시간 단축(10분 -> 1분 이내)으로 신속한 초기화재 진압을 목적으로 하고 있음
