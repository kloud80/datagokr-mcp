summary_user: 서울시설공단 도로시설처가 관리하는 자동차전용도로 시설물(한강교량·일반교량·터널·고가차도·지하차도 등) 164개를 시설 1건당 한 행으로 담은 파일로, 노선·시설명·종류·준공일·공용년수·안전등급·보수보강건수를 포함한다. 시민이나 분석가가 '내가 다니는 강변북로 구간의 교량·터널 중 30년 넘은 노후 시설이나 C등급 시설이 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시설물 안전 원장이나 점검 결과와는 시설명·노선 이름을 맞춰 연결해야 한다.
description_portal: 서울시설공단 도로시설처에서 관리하고 있는 자동차전용도로의 164개 도로시설물 세부 현황입니다. 한강교량, 일반교량, 터널, 고가차도, 입체교차, 지하차도, 언더패스, 복개구조에 대한 노선정보와 시설물 연장(길이) 및 준공일과 공용년수, 시설물 안전등급 현황 등 법정시설물에 대한 현황 자료를 제공합니다.  수집된 데이터 기간은 2014년부터 2026년입니다. 164개 자동차전용도로 중 A등급 시설물은 16개, B등급 시설물은 140개, C등급은 3개, 등급 미지정 시설물 5개가 있습니다. 공용년수별로 164개 도로시설물 중 30년 이상 시설물은 81개이며, 20년이상 30년 미만은 41개, 10년 이상 20년 미만은 19개, 10년 미만 시설물은 23개 입니다.
