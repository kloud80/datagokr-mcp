summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 대규모 공사장 정보를 공사장 한 곳당 한 건으로 담으며, 지정연도·공사장 유형·공사명·주소·총/당해 공정률·착공일과 준공예정일·재해위험요인·장비/자재 확보 내용 등이 들어 있다. 지자체 안전관리 담당자나 분석가가 "우리 지역에서 공정이 진행 중인 대규모 공사장은 어디이고, 재해위험요인은 무엇인가" 같은 질문에 쓴다. 전역 조인 키는 없으므로 법정동코드(STDG_CD)·행정동코드 같은 행정구역 코드나 주소를 매핑해 재난 위험지역·시설 안전 원장 등 다른 재난안전 데이터와 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 대규모 공사장 정보로, 지정연도, 공사장유형코드, 공사명, 법정동코드, 행정동코드, 상세주소, 총공정요율, 당해공정요율, 착공일자, 준공예정일자 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
