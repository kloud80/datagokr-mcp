description_portal: 광주광역시 동구지역 가스관련업소 현황에 대한 데이터로 충전소, 판매소, 저장소별로 업소명을 설명하는 자료입니다.가스관련업소는 도시가스 충전소, 액화석유가스(LPG) 판매소, 가스 충전·저장 시설, 가스 사용이 많은 음식점 및 산업시설 등을 의미합니다. 이 업소들은 시민 생활과 밀접하게 연관되어 있지만, 동시에 가연성 가스를 다루기 때문에 화재나 폭발 위험이 높아 소방의 특별 관리 대상이 됩니다. 동부소방서 관할 지역인 동구에는 주거지와 상업지, 전통시장, 음식점 밀집 지역이 많아 소규모 LPG 판매소와 가스 사용 업소가 다수 분포하고 있습니다. 또한 일부 지역에는 도시가스 공급을 위한 중간 저장소, 충전소도 운영되고 있습니다. 이 업소들은 소방특별관리대상으로 지정되어 정기적인 안전 점검을 받고 있습니다.가스관련시설은 가스 누출, 취급 부주의, 시설 노후화, 주변 환경 등의 위험 요인이 있습니다.이 데이터는 가스관련업소명, 위치, 데이터기준일자 등의 항목을 제공합니다.
