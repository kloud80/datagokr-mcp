description_portal: 경상남도경찰청의 교통사고 발생건수에 대한 공공데이터는 지역 내 교통안전 정책 수립과 사고 예방 대책 마련을 위한 자료로 활용됩니다. 이 데이터는 경상남도 전역의 교통사고 발생 현황을 기록하고 있으며, 연도별 교통사고 발생 건수, 교통사고 사망자 수, 교통사고 부상자 수, 데이터 작성 기준일에 대한 정보를 포함하고 있습니다. 해당 자료는 경상남도경찰청 생활안전부 교통과에서 작성하여 제공하고 있으여 2014년부터 2024년까지 최근 11년간 누적된 통계 데이터입니다. 데이터는 업테이트 주기는 1년이며 매년 9~10월경 업데이트가 이루어집니다.
