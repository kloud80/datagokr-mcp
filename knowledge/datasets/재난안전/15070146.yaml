description_portal: 이 공공데이터는 2014년부터 2024년까지 강원특별자치도 내에서 발생한 마약 관련 범죄의 검거 현황을 정리한 자료입니다. 주요 항목은 마약류 사범을 마약, 대마, 향정신성의 세 가지 유형으로 구분하여 검거 건수를 제공하며, 지역 내 마약류 범죄의 발생 추이와 경찰의 단속 실적을 파악할 수 있도록 구성되어 있습니다. 이 데이터는 마약류 범죄의 확산 방지, 중독 예방 대책 마련, 수사 자원 배분 등 마약 대응 정책 수립에 중요한 기초자료로 활용됩니다. 또한 경찰청, 보건복지부, 지자체, 중독예방기관, 연구기관 등에서 지역 맞춤형 마약 예방교육, 치료 및 재활 서비스 정책 수립에 유용하게 사용할 수 있습니다
