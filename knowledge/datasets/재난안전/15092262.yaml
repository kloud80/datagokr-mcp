description_portal: 본 데이터는 자동차 손해배상 보장법 제5조를 위반하여 의무보험에 가입하지 않은 채 도로를 운행하는 무보험 차량에 대한 지자체 및 사법기관의 행정·사법적 조치 결과를 통합적으로 제공합니다. 위반 사항에 대해 일정 금액의 범칙금을 부과하여 사건을 종결하는 통고처분 건수와 사안이 중대하거나 범칙금 미납으로 인해 형사 처벌 절차를 밟게 되는 검찰송치 건수를 포함하고 있습니다. 또한 수사 결과 범죄 혐의가 입증되지 않아 조사를 마무리한 내사종결 건수 및 타 관할 기관으로 사건을 인계한 이첩 건수 등의 정보를 상세히 수록하여 무보험 운행 관리의 전 과정을 투명하게 공개합니다. 이는 지역별 무보험 운행 발생 현황을 정밀하게 분석하고 교통안전 정책 수립 및 시민의 법규 준수 의식을 제고하기 위한 공신력 있는 기초 자료로 활용됩니다.
