summary_user: 경기도 안의 소방서·경찰서·지구대·파출소·치안센터를 시설 한 곳당 한 행으로 담은 목록으로, 시군명, 시설 구분, 기관명, 지번·도로명 주소, 우편번호, WGS84 위도·경도를 포함한다. 시군별로 치안·소방 시설이 어떻게 분포하는지, 우리 동네에서 가장 가까운 지구대나 파출소가 어디인지 같은 질문에 주민과 도시안전 분석가가 쓴다. 전역 조인 키는 실측에서 확인되지 않았으므로, 다른 데이터와는 시군명·시군코드(SIGUN_CD) 같은 이름·코드 매핑이나 위경도 좌표를 기준으로 붙여 쓴다.
description_portal: 이 데이터는 경기도 내에 설치된 소방서, 경찰서, 지구대, 파출소, 치안센터 등 공공안전기관의 현황을 정리한 자료로, 각 시설의 명칭, 분류(경찰관서, 파출소 등), 위치정보(지번주소, 도로명주소), 우편번호, WGS84 위도 및 경도 정보 등이 포함되어 있습니다. 해당 자료를 통해 각 시군별로 주민의 치안 및 소방안전 대응 시설의 분포를 파악할 수 있으며, 지도 기반 분석 및 공간적 격차 해소 정책 수립에 유용합니다. 본 데이터는 응급 대응시간 분석, 치안 사각지대 식별, 공공 인프라 최적 배치 등 다양한 도시안전·공공행정 분야에 활용할 수 있습니다.
