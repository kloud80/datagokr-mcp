summary_user: 기상청이 발령한 지진 통보문을 통보문번호 단위로 담고, 자동표시 여부와 국내·바다·해외 발생 구분, 등록일자·수정일자를 함께 기록한 건별 자료다. 경기도 재난안전 담당자나 분석가가 "최근 발령된 지진 통보 중 국내 육상·해역·해외 발생은 각각 몇 건인가" 같은 경보 발령 이력 확인에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 재난 특보·대피시설 데이터와는 통보문번호나 날짜를 기준으로 수작업 매핑해 이어 쓴다.
description_portal: 「지진조기경보시스템 기상청 지진 정보」 데이터는 경기도가 제공하는 재난안전 분야 자료로, 기상청에서 발령하는 지진 관련 통보문을 기반으로 한 정보를 담고 있습니다. 주요 항목은 통보문번호, 자동표시 여부, 국내 발생, 바다 발생, 해외 발생, 등록일자, 수정일자로 구성되어 있으며, 지진 발생 위치에 따른 구분(국내, 바다, 해외)을 통해 발령된 지진 정보를 체계적으로 제공합니다. 이 데이터는 지진 조기경보시스템과 연계되어 지진 발생 시 신속한 대응을 지원하며, 재난안전 기관은 이를 바탕으로 경보 발령 이력 확인, 지역별 지진 발생 빈도 분석, 해외 및 해역 지진과의 연관성 검토 등을 수행할 수 있습니다.
