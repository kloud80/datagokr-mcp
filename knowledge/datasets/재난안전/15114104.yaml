description_portal: 자동심장충격기(AED, Automated External Defibrillator)는 심장이 갑자기 멈췄을 때 심장에 전기 충격을 줘서 정상적인 리듬을 회복하도록 도와주는 응급 의료 기기입니다. 일반인도 쉽게 사용할 수 있도록 설계되어 있어, 심정지 상황에서 골든타임(약 4~6분) 내에 심폐소생술(CPR)과 함께 사용하면 생존률을 크게 높일 수 있습니다.AED 사용 순서 (일반적 절차)1. 의식 확인 & 119 신고2. AED 가져오기 및 전원 켜기3. 패드 부착 (가슴 오른쪽 위, 왼쪽 아래)4. 리듬 분석 – 자동으로 분석됨. “터치하지 마세요”라는 안내가 나옴.5. 충격 필요 시 → “충격 버튼” 누르기6. 즉시 심폐소생술(CPR) 계속창녕군시설관리공단 공공시설물 공설운동장, 군민체육관, 군립수영장, 부곡궁도장, 국민체육센터, 생태체험장, 산토끼노래동산 자동심장충격기 설치현황에 대한 데이터를 제공합니다.
