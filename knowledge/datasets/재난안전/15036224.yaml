summary_user: 강원특별자치도경찰청이 집계한 5대 범죄(살인·강도·강간 강제추행·절도·폭력)의 연도별 발생 건수를 담은 소규모 집계 파일(CSV 302바이트)이며, 포털 설명상 기간은 2016~2024년이다. 강원도 안에서 절도나 폭력 발생이 해마다 늘었는지 줄었는지 알고 싶은 시민·언론·연구자가 범죄 유형별 추세를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 경찰청의 같은 형식 자료나 인구 통계와는 연도와 지역 이름을 기준으로 직접 맞춰 이어야 한다.
description_portal: 이 공공데이터는 2016년부터 2024년까지 강원도 내에서 발생한 5대 범죄의 연도별 발생 건수를 제공하는 자료입니다. 5대 범죄는 살인, 강도, 강간, 절도, 폭행으로 구성되어 있으며, 각 범죄 유형별로 발생 건수가 구분되어 수록되어 있습니다. 해당 데이터는 지역사회의 범죄 발생 양상과 치안 수준을 진단하고, 범죄 예방 정책 수립과 경찰 자원 배치의 기초자료로 활용할 수 있습니다. 경찰청, 지자체, 범죄예방 관련 기관은 물론, 연구기관과 언론, 시민단체 등에서도 범죄 발생 추세 분석, 범죄유형별 대응 전략 마련, 사회적 안전망 강화 등 다양한 목적으로 활용 가능합니다.
