summary_user: 전국 해양경찰서에 등록된 유·도선의 면허항로를 항로 1건당 1행으로 담은 파일로, 항로명·출발/도착 선착장과 그 주소·구간거리·주정박지를 포함하며 전국 77행 규모다. 유람선이나 도선을 타려는 여행객이 어느 선착장에서 출발해 어디로 가는 배가 있는지 확인하거나, 분석가가 지역별 유도선 운항 구간과 거리를 파악하는 데 쓴다. 출발·도착 선착장 주소(출발항로_주소, 도착항로_주소)를 키로 삼아 주소 기반 행정구역·좌표 데이터나 수상레저 금지구역, 해양사고 위치 같은 수역 규제·안전 데이터와 이어 쓴다.
description_portal: 유선이란 수상에서의 고기잡이, 관광, 그밖의 유락을 제공하는 선박이고, 도선은 사람을 운송하거나 사람과 물건을 운송하는 선박으로서 「해운법」의 여객선에 적용받지 않는 선박입니다.  이용자의 원활한 유도선 이용을 위해 「유·도선 사업법」을 근거로 전국 해양경찰서에 등록된 유도선의 항로정보에 관한 데이터를 제공하기 위한 자료입니다. 제공하는 데이터로는  유도선의 면허항로명,주정박지(선착장),출항 선착장,출항 선착장 주소,입항 선착장,입항 선착장 주소,구간거리에 관한 항목을 입력하였습니다.
