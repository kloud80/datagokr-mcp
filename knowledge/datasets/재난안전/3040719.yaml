description_portal: 한국소비자원 소비자안전센터에 수집된 소비자위해감시시스템(CISS)을 기반으로 구성된 데이터로, 주요 항목으로는 위해 사례의 접수일, 위해자 성별과 연령대, 사고 발생 경위 등이 포함되어 있습니다.해당 데이터를 통해 제품이나 서비스 이용 중 발생한 안전사고의 유형과 추이를 파악할 수 있으며, 연령대나 품목군별로 위해 발생 위험이 높은 항목을 분석하는 데 활용됩니다. 나아가 소비자 안전 관련 정책 수립, 위해 예방 홍보 및 교육 자료 개발, 제조·유통업체의 안전 개선 활동 등 다양한 분야에서 실질적인 근거 자료로 활용될 수 있습니다."CISS"는 Consumer Injury Surveillance System(소비자위해감시시스템)의 영문 머리글자를 딴 약칭으로, 소비자기본법 제8조(위해의 방지), 제51조 제1항 제1호 및 제52조(위해정보의 수집 및 처리) 및 동법 시행령 제39조(위해정보제출기관의 지정·운영 등)에 의거 전국의 병원, 소방서 등을 포함한 위해정보제출기관과 소비자상담센터(www.ccn.go.kr, 전화 국번없이 1372) 을 통해 접수되는 소비자상담, 핫라인(080-900-3500) 국내외 언론 등으로부터 위해정보를 수집하고 분석·평가하여 관련 조치를 취할 수 있도록 구축된 소비자 위해상황 상시감시시스템을 말합니다.
