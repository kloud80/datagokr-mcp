description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2018년 ~ 2020년 12월 31일 기준 국립과학수사연구원이 수행한 유전자 감정 현황을 경찰청이 집계한 공공데이터입니다. 감정 의뢰 건수, 사건 유형별 유전자 분석 횟수, 성폭력·강력범죄 관련 DNA 비교 결과 등이 포함되어 있어 과학수사의 활용 수준, 유전자 데이터 기반 검거 비율, 범죄유형별 분석 수요 등을 파악할 수 있습니다. 이 데이터는 경찰의 과학수사 정책 수립, 법과학 기반 수사력 강화, 연구기관의 유전자 감식 기술 분석, 공공기관의 증거 기반 형사정책 설계 등에 유용하게 활용됩니다.
