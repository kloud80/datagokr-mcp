description_portal: 한국산업안전보건공단에서 수행하는 2023년 안전보건교육 과목 정보에 대한 자료로교육시작일자, 교육종료일자, 교육년도, 교육과목명 등에 대한 칼럼을 제공하고 있습니다.(공란은 데이터 없음)* 산업안전보건법 제29조 산업안전보건교육① 사업주는 소속 근로자에게 고용노동부령으로 정하는 바에 따라 정기적으로 안전보건교육을 하여야 한다.② 사업주는 근로자를 채용할 때와 작업내용을 변경할 때에는 그 근로자에게 고용노동부령으로 정하는 바에 따라 해당 작업에 필요한 안전보건교육을 하여야 한다. 다만, 제31조제1항에 따른 안전보건교육을 이수한 건설 일용근로자를 채용하는 경우에는 그러하지 아니하다. <개정 2020. 6. 9.>③ 사업주는 근로자를 유해하거나 위험한 작업에 채용하거나 그 작업으로 작업내용을 변경할 때에는 제2항에 따른 안전보건교육 외에 고용노동부령으로 정하는 바에 따라 유해하거나 위험한 작업에 필요한 안전보건교육을 추가로 하여야 한다.④ 사업주는 제1항부터 제3항까지의 규정에 따른 안전보건교육을 제33조에 따라 고용노동부장관에게 등록한 안전보건교육기관에 위탁할 수 있다.
