summary_user: 부산 영도구 관내 민방위 비상급수시설(음용수)별로 분기 수질검사 결과를 시설(시료명) 한 줄 단위로 담은 작은 파일(csv 약 1.3KB)로, 일반세균·총대장균군·분원성대장균군·암모니아성질소·질산성질소·과망간산칼륨소비량 측정값을 기준치와 함께 싣는다. 영도구 주민이나 재난 대비 담당자가 '우리 동네 비상급수시설 물을 비상시에 마셔도 되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 비상급수시설 위치·좌표 원장 등 다른 대피·구호시설 데이터와는 시설명(시료명)을 맞춰 이어 써야 한다.
description_portal: '영도구 관내 민방위 비상급수시설(음용수) 분기별 수질검사 결과 정보입니다(검사항목 및 적합여부)검사항목 : 일반세균, 총대장균군, 분원성대장균군, 질산성질소, 암모니아성질소(리터당 0.5mg 미만), 과망간칼륨소비량음용수는 1,2,4분기는 1리터 무균채수병에 채수하고, 3분기는 전 항목 검사로 2리터 유리병과 2리터 무균채수병에 채수해야 합니다. 생활용수는 3년에 1회 채수하며, 유리병 1리터와 채수팩 1리터에 각각 채수합니다. 채수 후 시료는 보건환경연구원(만덕)에 운송합니다.'
