summary_user: 경남소방본부 소속 소방서 18곳의 이름·도로명/지번 주소·위도·경도와 시군구·행정동·법정동 정보, 예하 119안전센터 목록을 소방서 한 곳당 한 행으로 담은 파일이다. 경남 주민이나 분석가가 '우리 시군을 맡는 소방서가 어디이고 그 아래 119안전센터는 무엇인가'를 확인하거나, 소방서 위치를 지도에 찍을 때 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시군구 코드·행정동코드·법정동코드나 시군구명·소방서명 같은 이름을 맞춰서 잇고, 좌표로 화재 발생·소방용수 위치 데이터와 공간 결합한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 소방서 관할 공간정보 데이터는 경남소방본부 소방서에 대한 정보로 각 소방서 위치 등 공간정보(주소, 좌표) 및 소방서 예하 119안전센터 목록을 제공합니다.(데이터 구성 및 세부항목) 소방서 관할 공간정보 데이터는 시군별(한글, 영문 포함, 행정동 및 법정동 모두 표기)소방서명과 소방서 주소, 전화번호, 위도, 경도, 관련 119안전센터에 대한 정보를 제공합니다. 총 18건 입니다.(데이터 현행화 시기) 경상남도 소방서 관할 공간정보 데이터는 1회성 데이터로 현행화되지 않습니다.
