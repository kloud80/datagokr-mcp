description_portal: '민방위 대원의 임무 수행 시 필요한 지식과 기술을 연마하여 민방위사태 발생 시 대처능력을 제고하고 국가와 지역사회의 재난에 대한 위기관리 능력을 배양코자 합니다. 이 데이터는 부산광역시  동래구  민방위 교육일정에 관한 데이터로 교육대상, 교육구분, 교육방법, 교육시간, 교육시작일, 교육종료일, 교육장소 등의 항목을 제공합니다. 이 데이터는 매년 업데이트 예정입니다.□ 교육기간 ❍ 상반기(4 ~ 6월): 본교육(상반기 보충교육 실시 금지) ❍ 하반기(8 ~ 12월): 보충교육(1개월 이상 분리 실시) ※ 선거기간(대통령, 국회의원, 지방의회 의원, 지방자치단체의 장) 중 민방위 교육훈련 금지'
