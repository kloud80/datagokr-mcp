summary_user: 재난안전데이터 공유플랫폼이 제공하는 공공시설 복구계획 정보로, 재난별·시설별로 피해일시, 피해지역 주소, 시설명, 피해요약과 함께 초기·시도·조사·확정 단계의 피해물량·피해액·복구물량·복구비를 담으며 범위는 전국이다. 지자체나 재난 분석가가 특정 재난에서 어떤 공공시설이 얼마나 피해를 입었고 단계별로 복구비가 어떻게 산정됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 재난연도·재난일련번호, 법정동 코드 같은 지역 코드나 시설명 매핑으로만 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 공공시설 복구계획 정보로, 재난연도, 재난일련번호, 피해일자, 피해일시, 피해시분, 피해지역, 시설명, 피해요약 등을 제공하고 있습니다. 데이터의 갱신주기는 5분입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
