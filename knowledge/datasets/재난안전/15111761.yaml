summary_user: 부산진구 관내에 조성된 여성안심귀갓길을 구간 단위로 담은 파일 데이터로, 구간마다 시작·종료 위치의 주소와 위도·경도, 설치내용, 조성연도가 들어 있다(csv 924바이트의 작은 파일). 부산진구 주민이 야간 귀가 경로로 안심귀갓길이 어디서 어디까지 있는지 확인하거나, 분석가가 조성연도를 보고 오래된 구간을 가려내는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시작·종료 좌표나 주소를 기준으로 CCTV·안전비상벨·보안등 같은 방범 시설 위치와 공간적으로 겹쳐 보는 방식으로 잇는다.
