summary_user: 서울특별시경찰청 관할 경찰서별로 관내 지구대·파출소·치안센터 개수를 2018년부터 2025년까지 연도별로 집계한 표로, 경찰서 한 곳이 한 행이고 연도별 관서 유형 수가 열로 펼쳐진 작은 CSV 파일(약 2KB)이다. 분석가나 주민이 '우리 동네 경찰서 관내 파출소·지구대가 몇 년 사이 늘었는지 줄었는지'처럼 경찰서별 지역경찰 관서 배치 추이를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 경찰서 이름을 매핑해 붙여야 하며, 같은 서울청의 경찰서별 범죄 발생·112신고 통계나 관서 위치 데이터와 이름 기준으로 이어 쓴다.
limits: 관서 개수만 담고 개별 지구대·파출소의 이름·주소·좌표는 없어 위치 기반 분석에는 바로 쓸 수 없다. 경찰서 코드 같은 공통 키가 없어 다른 데이터와 연결하려면 경찰서명을 직접 맞춰야 한다.
