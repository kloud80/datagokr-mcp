description_portal: "본 통계는 112 신고 서비스를 이용한 고객의 연령대별 만족도를 접수, 현장 대응 등 세부 항목별로 분석한 결과입니다.연령별 만족도 비례 상승: 연령대가 높아질수록 서비스 만족도가 높아지는 경향이 뚜렷합니다. 60대 이상에서 종합만족도 93.9점으로 가장 높았으며, **20대 이하(87.8점)**와 **30대(88.3점)**는 상대적으로 낮은 만족도를 보였습니다.항목별 강점: 전 연령층에서 '담당 경찰관의 전문성' 항목이 90점대 이상의 높은 평가를 받았으며, 특히 60대 이상은 95.8점이라는 높은 신뢰를 보였습니다.상대적 보완 항목: '현장 사건 처리의 신속성' 항목은 20대 이하(83.9점)와 30대(84.1점)에서 가장 낮은 점수를 기록했습니다. 이는 젊은 층일수록 현장의 즉각적인 대응 속도에 더 민감하게 반응하고 있음을 시사합니다.종합적으로 112 서비스는 고령층에서 높은 지지를 받고 있으나, 현장 출동 및 처리 신속성 부문에서 젊은 층의 체감 만족도를 높이는 것이 주요 과제로 분석됩니다."
