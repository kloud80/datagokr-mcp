summary_user: 전국 지구대·파출소 2,047곳을 관서별 한 행씩 담은 위치 목록으로, 시도청·경찰서·관서명·구분(지구대/파출소)·주소를 담는다. 가까운 지구대·파출소가 어디인지, 지역별 치안 거점 분포가 어떤지 확인하려는 국민이나 분석가가 쓴다. 조인 키는 주소(address)뿐이라 주소 지오코딩이나 다른 주소 기반 자료와 이어 쓰며, 같은 경찰관서 위치 분류의 생활안전지도·지역 범죄 통계와 주소·지역 단위로 맞춰 본다.
description_portal: 본 통계는 2025년 말 기준 전국 각 지역의 치안을 담당하는 지구대와 파출소의 상세 소재지를 나타냅니다. 서울청 관할의 을지로, 종로2가, 세검정 등 주요 도심 지역부터 부산청 소속의 부평, 충렬, 영선 등에 이르기까지 촘촘한 치안 그물망이 형성되어 있습니다.각 시설은 관할 경찰서 아래 지구대 또는 파출소 형태로 분류되며, 시민의 안전과 직결된 최일선 거점 역할을 수행합니다. 특히 명동, 이태원, 홍익 등 유동 인구가 많은 지역뿐만 아니라 성북, 동대문 등 주거 밀집 지역까지 골고루 분포하여 빈틈없는 방범 체계를 구축하고 있습니다. 이 데이터는 지역별 치안 서비스의 접근성을 파악하고 긴급 상황 대응 체계를 점검하는 핵심 지표로 활용됩니다.
