summary_user: 경상남도 양산소방서 관내 119안전센터 등 부서별로 주소, 관할구역(읍·면·동), 관할면적, 관할인구, 관할세대수, 본서와의 거리를 한 행씩 담은 소규모 집계 파일(CSV 약 855바이트)이다. 양산 시민이나 분석가가 '우리 동네는 어느 안전센터 관할이고, 그 센터가 맡은 인구·면적은 얼마인가'를 확인하거나 센터별 담당 부담을 비교하는 데 쓴다. 전역 조인 키가 없으므로 관할구역의 읍·면·동 이름을 행정구역 코드나 같은 지역의 화재 발생·소방용수 데이터에 이름 매핑으로 이어 쓴다.
