description_portal: 대전광역시 전통 시장 별 전기 화재 감지 센서 구축 현황 자료는 2020년부터 2021년까지 대전시 내 주요 전통 시장에 설치된 전기 화재 감지 센서의 구축 실적을 기록한 데이터입니다. 이 자료는 시장 별 감지 센서 설치 수량, 설치 위치(구역 단위), 설치 시기, 관리 기관 등의 정보를 포함하고 있으며, 전통 시장 내 전기 설비로 인한 화재 발생 위험을 사전에 예방하고 사고 대응을 신속히 할 수 있도록 지원하는 체계 구축에 목적을 둡니다. 해당 센서는 온도 상승 및 전기 이상 징후를 실시간 감지해 화재 초기 징후를 알려주는 역할을 하며, 화재 취약성이 높은 전통 시장의 소상공인과 시민의 생명·재산 보호에 중요한 기반이 됩니다.본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
