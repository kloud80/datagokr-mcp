description_portal: 재해 발생 시 이재민을 수용할 수 있는 구호소의 상세 정보를 조회할 수 있도록 제공하는 공공데이터 서비스입니다.구호소는 화재·홍수·지진 등 재난으로 인해 거주지를 잃거나 대피가 필요한 이재민들이 임시로 생활할 수 있는 시설로, 해당 서비스를 통해 구호소의 명칭, 소재지(시군·읍면 및 상세 주소), 수용 가능 인원, 현재 접수 인원, 연락처, 정확한 위치(위도·경도) 등의 정보를 조회할 수 있습니다.이 서비스는 재난 대응 기관 및 관련 시스템에서 다음과 같은 목적으로 활용될 수 있습니다. 첫째, 재난 발생 전 단계에서 시군·읍면 단위로 구호소 분포 현황과 총 수용 가능 인원을 사전에 파악하여, 예상 이재민 규모에 따른 구호소 배치 계획을 수립하는 데 활용할 수 있습니다. 둘째,  재난 유형별로 안전한 구호소를 선별하는 데 활용할 수 있습니다.
