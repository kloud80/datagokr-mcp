summary_user: 전남광주통합특별시 구호소를 시설 한 곳씩 담은 목록으로, 이름·시군·읍면·주소, 위도·경도 좌표, 수용인원과 접수인원이 들어 있다. 재난 대응 담당자나 분석가가 "우리 읍면에 이재민을 받을 구호소가 어디 있고, 몇 명까지 수용할 수 있나" 같은 질문에 답하거나 시군별 수용 규모를 집계할 때 쓴다. 전역 조인 키가 없어서 다른 대피·구호시설이나 재난 위험지역 데이터와는 시군·읍면 이름 매칭이나 좌표 근접으로 연결한다.
