description_portal: 본 자료는 한국승강기안전공단이 수행하는 승강기 안전인증 과정에서 사용되는 평가 항목과 적용 기간을 표준화해 정리한 데이터입니다. 각 레코드는 하나의 평가제목과 평가시작일자·평가종료일자로 구성되며, 평가제목에는 전기식 엘리베이터의 서류심사·공장심사·안전성시험 평가지와 더불어 안전부품별 평가기준이 포함됩니다. 안전부품 항목은 상승과속방지장치(로프제동형·이중브레이크형·주행안내레일 제동형·도르래제동형), 완충기(유압밸브형·유압식·우레탄식), 이동케이블(플랫·원형), 제어반(회생제동·저항제동), 추락방지안전장치(즉시/점차 작동형), 출입문잠금장치(중앙개폐·측면개폐), 휠체어리프트 관련 항목 등으로 세분됩니다. 일자 필드는 평가기준의 유효기간을 나타내며, 동일 평가명이 여러 건 존재하는 경우는 형식·대상 부품군 또는 개정 이력에 따른 중복 표기일 수 있습니다. 본 데이터는 인증 평가의 체계, 대상 부품군, 적용 기간을 한눈에 파악할 수 있도록 구성되어 평가 기준 관리와 기준서 매핑에 유용한 기초 정보를 제공합니다.
