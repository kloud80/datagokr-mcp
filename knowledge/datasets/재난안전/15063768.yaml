summary_user: 서울특별시 송파구의 여성안심귀가스카우트 이용현황을 연도별 사용건수로 담은 시군구 단위 집계 파일로, 포털 설명상 2015년부터 2024년까지를 다룬다. 구민이나 분석가가 송파구에서 늦은 귀갓길 동행 서비스 이용이 해마다 늘었는지 줄었는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 자료와는 연도와 시도명·시군구명을 이름으로 맞춰 다른 자치구의 같은 이용현황이나 지역 통계와 나란히 비교한다.
limits: 연도별 구 전체 합계만 담아 동별·월별·시간대별 이용이나 이용자 특성은 알 수 없다. 행정코드 같은 표준 키가 없어 다른 데이터와 연결하려면 시도명·시군구명을 직접 매핑해야 한다. 세부 부문은 시설 안전 원장으로 분류돼 있지만 승강기·시설물 번호 단위 원장이 아니라 서비스 이용 집계이므로 분류만 보고 기대하지 않는다.
