summary_user: 경기도 파주시에서 기계설비 성능점검 대상인 건물을 한 건씩 담은 파일로, 건물구분(건축물/공동주택), 도로명·지번 주소, 위도·경도, 건축물 용도, 연면적(㎡), 공동주택 세대수를 포함한다. 파주시 건물 관리자나 설비 점검업체가 '우리 건물이 성능점검 대상인가, 관내 대상 건물은 어디에 얼마나 분포하나'를 확인하거나 점검 일정·우선순위를 잡는 데 쓴다. 전역 조인 키는 없어 주소나 건물명을 맞추거나 위도·경도로 지도·건축물 정보와 공간 결합해 이어 쓴다.
description_portal: 경기도 파주시 기계설비 성능점검 대상 건물 현황에 대한 공공데이터로, 건물구분(건축물/공동주택), 공동주택에 한 한 건물명, 소재지의 도로명주소 및 지번주소, 위도와 경도 좌표, 건물의 특성과 규모를 파악할 수 있는 건축물의 용도와 제곱미터 단위의 연면적, 공동주택에 한 한 세대수 등으로 구성되어 있습니다. 본 데이터는 건물 위치와 용도, 연면적 등을 기반으로 기계설비 점검 우선순위 및 일정 수립, 건축물 특성에 맞춘 안전관리 및 맞춤형 유지보수 전략, 건축물 분포와 점검 대상 현황 분석을 통해 정책 수립 및 개선 방향을 도출, 기계설비 성능과 건축물 특성 간의 상관관계 분석 등의 연구, 위도·경도 정보를 활용한 GIS(지리정보시스템) 연계 공간 분석 등에 활용될 수 있습니다.
