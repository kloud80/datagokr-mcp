description_portal: 해당 데이터는 2017년 한 해 동안 서울특별시 은평구 각 행정동에서 발생한 화재 건수를 집계한 통계입니다.데이터 항목으로는 시도 구분, 은평구, 동(수색동, 녹번동, 불광동, 갈현동, 구산동, 대조동, 응암동, 역촌동, 신사동, 증산동, 진관동 등 행정동 단위), 화재발생건수(각 동별 집계된 화재 건수)로 구성되어 있습니다.이 자료는 구 단위가 아닌 동 단위까지 세분화된 화재 현황을 제공하기 때문에, 지역별 맞춤형 화재 예방 정책 및 연구 자료로 활용할 수 있습니다. (예:데이터를 통해 주거 밀집도, 상권 분포, 건축물 유형 등과 화재 발생의 상관성을 분석)
