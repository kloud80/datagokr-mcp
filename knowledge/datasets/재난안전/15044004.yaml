summary_user: 2017년 한 해 동안 서울특별시 은평구의 행정동(수색동·녹번동·불광동·갈현동 등)별 화재 발생 건수를 동 단위로 집계한 통계 파일로, 건별 원천이 아닌 집계표이며 파일 크기는 341바이트입니다. 은평구 안에서 어느 동에 화재가 많았는지 비교하려는 지자체 담당자나 연구자가 동별 예방 정책 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·구·동 이름을 맞춰 매핑하는 방식으로만 이어 쓴다.
limits: 집계값만 담아 화재 원인·시각·피해 규모 같은 건별 분석은 못 한다. 행정동 코드가 없어 다른 동 단위 통계와 붙이려면 동 이름으로 직접 매핑해야 한다. 메타데이터상 범위는 전국으로 표시되지만 실제 내용은 은평구 한 곳이다.
