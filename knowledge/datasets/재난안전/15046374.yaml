description_portal: '○ 통계개요* 통계명 : 화재발생 현황(동별)* 통계종류 : 서울시 각 동별 화재발생 현황 및 피해 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 화재발생 현황 및 인적 물적 피해 현황을 파악하여, 사고 방지 및 대응 등효과적 관리를 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 소방서 → 서울소방재난본부 재난대응과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 소방서내용 - 화재건수, 화재피해(인명ㆍ재산피해), 구조인원 현황 등○ 용어설명* 화재건수의 결정 : 1건의 화재란 1개의 발화점으로부터 확대된 것으로발화부터 진화까지를 말하지만, 다음의 경우에는 당해 각 호에 의함- 동일범이 아닌 각기 다른 사람에 의한 방화, 불장난은 동일 대상물에서발화했더 라도 각각 별건의 화재로 집계- 동일 소방대상물의 발화점이 2개소 이상 있는 다음의 화재는 1건의 화재로 함ㆍ누전점이 동일한 누전에 의한 화재ㆍ지진, 낙뢰 등 자연현상에 의한 다발화재* 세대수의 산정 : 세대수의 산정은 거주와 생계를 함께 하고 있는 사람들의집단 및 하나의 가구를 구성하여 살고 있는 독신자로서 자신의 주거에사용 되는 건물에 대하여 재산권을 행사할 수 있는 사람을 말함* 소실면적의 산정- 건물의 소실면적 산정은 소실 바닥면적으로 산정- 소손 및 기타 파손의 경우도 위 항의 규정을 준용'
