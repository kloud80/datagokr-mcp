description_portal: 대전광역시에서는 택배 및 소형 화물 차량의 원활한 운행을 위해 탄력적 주정차 허용 구간을 운영하고 있음. 이러한 구간은 시간대에 따라 주정차가 허용되며, 대전지역에서 택배 소형화물 차량의 주정차 허용 가능 여부에 대한 데이터로 허용 시점, 종점, 길이, 허용구분(양측 또는 편측), 허용시간, 허용일자(2009년부터) 등의 항목을 제공하고 있음. 참고로 탄력적 주정차 허용 구간이라 하더라도, 횡단보도, 교차로 모퉁이, 버스 정류소 10m 이내, 소방시설 주변 등은 주정차가 금지되어 있고, 황색 복선이 표시된 구간은 주정차 금지 구간이므로, 탄력적 주정차 허용 구간에 해당되지 않음.
