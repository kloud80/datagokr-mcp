summary_user: 서울 성동구 안에 지정된 지진 옥외대피장소를 시설 한 곳당 한 행으로 담은 파일(csv, 약 5KB)로, 시설구분·시설명·상세주소·수용가능면적·연락처를 담는다. 주민이 '지진이 나면 우리 동네에서 어느 공터나 운동장으로 피해야 하나'를 찾거나, 구청·분석가가 대피장소 분포와 면적 기준 수용 규모를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 대피·구호시설 데이터와는 시설명·상세주소를 맞대거나 주소를 좌표로 바꿔 이어 써야 한다.
description_portal: 서울특별시 성동구 지진옥외대피소 현황 데이터는 구 내 지진 발생 시 주민들이 안전하게 대피할 수 있는 옥외대피소 정보를 체계적으로 제공하는 공공데이터입니다. 데이터에는 시설구분, 시설명, 상세주소, 수용 가능 면적, 연락처 등이 포함되어 있어 각 대피소의 위치, 규모, 연락 방법을 쉽게 확인할 수 있습니다. 이를 통해 주민과 방문객은 긴급 상황 발생 시 가까운 대피소를 신속하게 찾아 안전하게 대피할 수 있으며, 행정기관은 대피소 분포와 수용 능력을 파악하여 비상대응 계획 수립, 점검 및 관리, 주민 안전 교육 등에 활용할 수 있습니다. 또한 연구자와 관련 기관은 재난 대응 효율성 분석, 도시 안전 인프라 평가, 재난 대비 정책 수립 등에 본 데이터를 참고할 수 있습니다. 본 데이터는 성동구의 지진 안전 체계 구축과 주민 안전 확보를 위한 중요한 기초 자료로 활용 가치가 높습니다.
