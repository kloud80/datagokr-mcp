summary_user: 경기도가 제공하는 시설물안전법상 안전취약시설물 현황으로, 시설물 한 건마다 시군명·대상 시설명·준공연도·안전등급·규모·관리대상 구분을 담는 원장형 목록이다. 지자체 안전 담당자나 분석가가 관내 어느 시군에 낮은 안전등급의 노후 시설물이 몰려 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 시설 안전 데이터와는 시군명이나 시설명을 이름으로 맞춰서만 이을 수 있다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 경기도에서 제공하는 시설물안전법 취약시설물 현황 정보입니다.\""
