description_portal: 본 자료는 한국승강기안전공단에서 승강기 안전검사 수행 과정에 투입된 외부 검사보조자 수당의 월별 산출 결과를 정리한 집계 처리내역입니다. 각 행은 전표 생성 단위의 집계 결과 1건을 의미하며, 필드는 년도, 월, 전표번호(ERP), 등록일자로 구성됩니다. 년도·월은 집계 기준 기간을 나타내고, 전표번호는 ERP에서 생성된 고유 식별자로서 동일 기간에 복수 전표가 발행될 수 있습니다. 등록일자는 전표가 ERP에 등재된 날짜로 회계 반영 시점을 표시하며, 집계 기준일과 차이가 발생할 수 있습니다. 전표번호는 숫자와 식별 문자가 결합된 고정 길이형 포맷으로 제공되며, 선두 블록에는 내부 회계 구분 또는 조직·업무 코드가 포함될 수 있습니다. 동일 월 내 분할 처리, 보정 등으로 인해 같은 기간에 여러 전표가 존재할 수 있으며, 이러한 경우 각 전표가 별도 행으로 기록되어 원시 이력이 그대로 보존됩니다. 데이터는 시간 정보 중심의 간결한 스키마를 유지해 기간별 처리 흐름과 전표 등재 시점을 명확히 파악할 수 있도록 구성되어 있습니다.
