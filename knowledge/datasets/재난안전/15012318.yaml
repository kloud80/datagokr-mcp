description_portal: 어린이놀이시설 정보는 현재 광주광역시 어린이 놀이시설에 대한 정보입니다.기본정보(시설명, 설치일자, 시설번호 등)와 시설별 설치장소 및 놀이기구 유형으로 구성된 데이터입니다.놀이기구 유형은 공동주택, 도시공원, 식품업소, 박물관 등이 주요 내용입니다.파일은 광주광역시의 어린이놀이시설 등록 설치 이후 전체 적인 현황을 모두 포함하고 있습니다.파일내 항목별 설명은 주로 신민들이 알수 있는 장소로 이루어져 있어 별도의 설명이 필요하지 않으나시설에관한 모든 데이터의 이용이 엑셀 등으로 표시되니 않으니 참고하여 이용해주시기 바랍니다
