summary_user: 전라남도(전남광주통합특별시) 소방시설 감리업체를 업체 한 곳당 한 행으로 담은 명부로, 세부지역·상호·주소·업종·분야·소방시설업 등록번호·등록일자·폐업여부를 포함하며 약 9KB 크기의 CSV 파일이다. 건축주나 시공사가 "우리 지역에서 영업 중인(폐업하지 않은) 소방시설 감리업체는 어디인가"를 찾거나, 분석가가 시군별 감리업체 분포를 살피는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으므로, 상호·주소나 소방시설업 등록번호를 이름 매칭하는 방식으로만 같은 기관의 소방 관련 데이터와 연결한다.
description_portal: '- 전라남도 소방시설 감리업체 현황 (상호명, 주소, 소방시설업 등록번호, 등록일자, 폐업여부)에 관한 데이터를 조회하실 수 있게 제공하고 있습니다.- 소방시설 감리란, 건축물이나 시설물에 설치되는 소방시설(스프링클러, 화재경보, 소화기, 비상구 등)이 관련 법령과 설계 기준에 맞게 제대로 시공되고 있는지 점검하고 확인하는 과정을 말합니다.- 「화재예방, 소방시설 설치·유지 및 안전관리에 관한 법률」에 따라 일정 규모 이상의 건축물이나 공사에서는 소방시설 감리가 의무화되어 있습니다.- 감리자는 관련 자격증(소방시설관리사, 건축사 등)을 가진 전문가가 수행합니다.'
