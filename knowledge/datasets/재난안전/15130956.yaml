summary_user: 청주시에 설치된 가로등을 위치별로 한 건씩 담은 개별 원천 데이터로, 위치명·설치개수·지번주소·위도·경도·관리기관을 포함하며 포털에서 약 3.9MB 크기의 CSV 파일로 받는다. 지자체 담당자나 분석가가 '야간 보행 안전을 위해 어느 동네에 가로등이 부족한가'를 지도에 찍어 확인하는 데 쓴다. 전역 조인 키는 없으므로 지번주소나 위도·경도 좌표로 CCTV·안전비상벨·보안등 같은 다른 방범 시설 데이터와 공간적으로 겹쳐 쓰거나 주소 이름으로 맞춰 연결한다.
description_portal: 충청북도 청주시에 설치된 가로등에 대한 데이터로 가로등위치명, 설치개수, 지번주소, 위치정보(위도, 경도), 관리기관 정보, 데아터 기준일자 등의 정보를 포함하고 있습니다.위치정보 활용 시 데이터 내 위도, 경도 값은 QGIS 등의 소프트웨어를 통하여 WGS84 좌표계의 좌표 값으로 설정하면 공간정보로도 활용할 수 있으며, 도분초(DMS) 형태로 사용하여야 하는 경우에는 값을 변환하여야 합니다.* 본 데이터는 2024년 8월 1일 기준으로 공공데이터 제공 신청 건에 대하여 제공하는 공공데이터입니다.
