summary_user: 충청남도 센싱정보 수집·연계 시스템이 관리하는 재난위험감지 계측기(급경사지 계측 센서, 수위측정소 등)의 순번, 구분, 이름, 상세주소, 위도·경도를 계측기 단위 목록으로 담은 약 13KB 크기의 zip 파일이다. 충남 주민이나 방재 담당자, 분석가가 '우리 동네 급경사지나 하천 주변에 어떤 감지 센서가 어디에 설치돼 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 상세주소·위도·경도를 기준으로 급경사지·재해위험지구, 대피시설 같은 다른 위치 데이터와 공간·주소 매칭으로 이어 쓴다.
description_portal: 충청남도 센싱정보 수집 및 연계 시스템에서 관리·제공하는 재난위험감지 센싱 정보로, 급경사지 계측관측 센서 정보, 수위측정소 정보, 위험경보 발령 정보 등 재난 발생 가능성을 실시간으로 감지·분석하기 위한 핵심 데이터를 포함하고 있습니다. 급경사지 센서 정보는 지반 변위, 기울기, 진동 등의 계측값을 통해 산사태 및 붕괴 위험을 사전에 감지하는 데 활용되며, 수위측정소 정보는 하천, 저수지 등의 수위 변화를 실시간으로 모니터링하여 침수 및 홍수 위험을 예측하는 데 활용됩니다. 또한 위험경보 발령 정보는 감지된 이상 징후를 기반으로 발령된 경보 이력과 단계별 대응 정보를 포함하여 신속한 상황 전파와 대응 조치를 지원합니다. 본 데이터는 재난 예방, 실시간 모니터링, 선제적 대응 체계 구축, 재난 대응 정책 수립 및 안전 관리 강화를 위한 핵심 기초자료로 활용됩니다.
