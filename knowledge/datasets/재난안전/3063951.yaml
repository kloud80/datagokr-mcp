summary_user: 충청북도 음성군의 주민대피시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 2.3KB)로, 시설 구분·위치·면적(제곱미터)·방호등급·대피가능인원·데이터기준일자를 담는다. 음성군 주민이나 재난 담당자가 '재난이 나면 우리 동네에서 어느 대피시설로 가야 하고, 몇 명까지 들어갈 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 대피·구호시설 데이터와는 위치 문자열이나 시설명을 맞춰 보는 방식으로만 이어 쓴다.
