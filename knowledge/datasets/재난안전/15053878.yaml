description_portal: 수상레저안전법 제5조와 시행령 제4조에 따라 추진기관 출력이 5마력 이상(단위가 킬로와트인 경우에는 3.75kw)인 동력수상 레저기구를 운항하려면 일반1·2급 또는 요트면허를 조종면허 시험 또는 면제교육을 통해 취득해야 한다. 2000년 법 제정 이후 2024년 12월 31일 까지의 취득 현황을 보면 초창기에는 응시율이 적었으나, 국민 소득 증대 및 여가 활동 확대로 취득 인원이 꾸준히 늘며 대중적 관심이 높아졌고 면허제도 정착과 함께 수상에서의  안전의식 향상에도 기여하였다.
