summary_user: 성남시 온기나눔쉼터(한파쉼터)의 설치 장소를 한 곳씩 담은 파일로, 기준년도·읍면동·설치장소명·도로명/지번 주소·위도·경도·관리기관과 전화번호를 시설 단위로 기록한다. 겨울철 한파 때 주민이나 복지 담당자가 '우리 동네에서 가장 가까운 한파쉼터가 어디이고 누구에게 문의하나'를 찾는 데 쓴다. 전역 조인 키는 없어 읍면동명·주소 같은 이름 매칭이나 좌표(위도·경도)로 다른 대피·구호시설 데이터나 행정구역 자료와 겹쳐 본다.
description_portal: 성남시의 온기나눔쉼터는 겨울철 한파로부터 취약계층의 건강과 생명을 보호하기 위해 설치된 임시 보호 시설입니다. 주거 취약계층, 야간 노출 위험이 있는 주민들을 대상으로 운영됩니다. 설치 장소는 동 행정복지센터, 주민센터, 복지관, 공공청사 로비, 지하철역사, 민간 건물 등 시민 접근성이 높은 곳 위주로 선정됩니다. 성남시는 한파대응 종합계획에 따라 매년 11월부터 다음해 3월까지 운영 기간을 설정하고, 시설 점검과 지원 인력 배치를 진행합니다. 운영 현황은 시청 홈페이지나 주민센터를 통해 안내됩니다. 이를 통해 성남시는 복지안전망 강화를 도모하고 있으며, 시민들의 체감 안전도를 높이고 있습니다.
