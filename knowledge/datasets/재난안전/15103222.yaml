summary_user: 한국전기안전공사가 위탁받아 수행하는 전기안전관리대행(자가용전기설비 75kW 이상 4,500kW 미만)의 계약·해지·유지 건수를 연도(2019~2025년)와 사업소 단위로 집계한 파일로, 건별 설비 원장이 아니라 사업소별 합계를 담는다. 전기안전 분야 분석가나 사업자가 '어느 사업소 관할에서 대행 계약이 늘거나 해지가 많았는가'처럼 지역별·연도별 대행 수요 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 사업소명·사업소코드를 이름으로 맞추거나 같은 기관(한국전기안전공사)의 사업소코드 체계로만 연결한다.
limits: 사업소별 집계라 개별 설비·건물이나 시군구 단위로 내려가 볼 수 없고, 사업소코드는 행정구역 코드와 바로 맞물리지 않는다. 파일은 3KB 남짓의 작은 csv로 활용신청 없이 내려받는다.
