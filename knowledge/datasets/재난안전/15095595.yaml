summary_user: 울산 울주군의 방사능 비상 시 보호가 필요한 요양원·노인주간보호센터·노인복지관 등 노인복지시설을 시설 한 곳씩 주소·좌표 단위로 담고, 포털 설명상 수용 인원·종사자 수·시설 규모도 포함한다. 방재 담당자나 분석가가 원전 사고 때 와상 어르신이 있는 시설이 어디이며 대피에 구급차·인력이 얼마나 필요한지 산정하는 데 쓴다. 전역 조인 키가 없어 대피소·경로당 등 다른 울주군 방재정보와는 시설명·주소나 좌표를 맞춰 이어 쓴다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 노인복지시설 조회 서비스는 방사능 비상 상황 시 자력 대피가 어렵거나 특별한 보호가 필요한 어르신들이 거주 또는 이용하는 복지 시설의 위치와 현황 정보를 제공하는 데이터입니다.'경로당' 데이터와 유사하지만, 주로 요양원, 노인주간보호센터, 노인복지관 등 좀 더 전문적인 돌봄이 이루어지는 시설들을 중점적으로 다룹니다.요양원 등 입소 시설의 경우, 거동이 불가능한 와상 환자가 많아 사고 시 구급차나 특수 수송 장비가 우선적으로 투입되어야 하는 지점들을 나타냅니다.각 시설의 수용 인원, 종사자 수, 시설 규모 등이 포함되어 있어, 대피 시 필요한 인력과 차량 규모를 산정하는 기준이 됩니다.
