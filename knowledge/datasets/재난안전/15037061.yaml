description_portal: 경찰청 생활안전교통국 여성안전기획과의 가정폭력 피해자 보호조치 현황 자료는 2017년부터 2024년까지의 추이를 보여줍니다.주요 보호조치 중 응급조치 1은 2017년 29,124건에서 2024년 78,455건으로 급격히 증가했습니다. 이는 가정폭력 현장에서 즉각적인 격리 및 접근금지 조치가 필요한 사례가 크게 늘었음을 시사합니다.반면, 응급조치 2는 2017년 5,028건에서 2024년 2,478건으로 절반 이상 감소하는 추세를 보였습니다. 이는 경찰관 직권으로 가해자를 유치장 또는 보호시설에 감치하는 조치로, 다른 조치들의 증가와 대조를 이룹니다.긴급임시조치와 임시조치 신청 건수도 꾸준히 늘어났습니다. 긴급임시조치는 2017년 1,183건에서 2024년 8,332건으로, 임시조치 신청은 같은 기간 4,436건에서 7,931건으로 증가했습니다. 이는 사법적 절차를 통한 피해자 보호 요청이 지속적으로 늘어났음을 의미합니다.전체적으로 볼 때, 가정폭력 피해자 보호를 위한 조치 건수는 시간이 지남에 따라 전반적으로 증가했습니다. 이는 가정폭력에 대한 사회적 인식 변화와 함께 피해자들이 보다 적극적으로 보호를 요청하는 경향을 반영하는 것으로 해석할 수 있습니다.
