summary_user: 부산광역시 금정구 관내 급경사지를 한 곳당 한 행으로 담은 파일 데이터로, 급경사지명·소재 행정동·주소·관리주체를 담는다(약 4.5KB 규모 CSV). 주민이나 구청·안전 분석가가 '우리 동네 어느 주소에 급경사지가 있고 누가 관리하는가'를 확인하거나, 집중호우 때 점검 대상 목록을 뽑는 데 쓴다. 전역 조인 키나 코드가 없어 행정동 이름이나 주소 문자열로 다른 재해위험지구·대피시설 데이터와 맞춰 잇는다.
description_portal: '부산광역시 금정구 내 급경사지 관련 데이터로, 위치(행정동), 급경사지명 등 관내 급경사지 현황에 대한 항목을 제공합니다. 데이터 기준일자: 2026년 4월 15일데이터에 이상이 있거나 문의 사항이 있을 경우 안전관리과로 문의하여 주시기 바랍니다. 해당 데이터는 연간 갱신됩니다.<항목 설명>연번급경사지별 목록 순서행정동해당 급경사지가 소재하는 행정동주소해당 급경사지의 주소관리주체해당 급경사지 관리 주체급경사지명해당 급경사지의 이름데이터 이용시 참고하여 주시기 바랍니다.'
