description_portal: 소규모 취약시설의 대상은 사회복지시설, 전통시장, 소규모 농어촌교량 등으로 시설물안전법 제19조에 따라 국토안전관리원이 관리하고 있습니다.소규모 취약시설로 등록된 시도별 및 세부종류별 현황(노인, 아동, 장애인 복지시설 등)이 포함된 CSV형식의 파일데이터입니다.데이터는 2025년을 기준으로 작성되었으며, 각 시도를 기준으로 소규모 취약시설의 현황에 대한 수치를 제공하고 있습니다.전국적으로 경로당의 현황 수가 가장 많으며, 결핵 및 한센시설의 현황 수가 가장 적게 분포하고 있습니다.
