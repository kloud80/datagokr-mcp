summary_user: 건설안전 종합정보망(CSI)에 신고된 건설 사고를 한 건씩 담은 전국 단위 파일로, 사고일시·날씨·시설물 분류·공종·사고객체·사고원인과 성별·내외국인·연령대별 사망자·부상자 수를 기록한다. 건설사업자나 안전 분석가가 '어떤 공종과 작업 과정에서 추락 같은 인적사고가 자주 나고 주된 원인은 무엇인가'를 따져 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설물 분류명·공종명 같은 이름 매핑으로만 이어 쓸 수 있고, 사고 위치도 좌표나 행정구역 코드가 없어 지역 데이터와 직접 붙이기 어렵다.
description_portal: 국토안전관리원에서 제공하는 민간,공공시설물 분류별 인적사고(성별 사망자, 부상자, 내외국인 사망자, 부상자, 연령별 사망자 부상자), 사고객체, 피해현황(금액, 내용), 조치계획과 방지 대책,  사고위치와 원인, 신고사유, 해당 공사비 등의 목록으로 구성된 데이터 입니다.연면적, 지상층수, 지하층수, 조치여부, 사고위치 등의 데이터들은 미집계 부분이 일부 있습니다.해당 데이터들은 건설안전 안전관리 종합정보망(CSI)에서 추출된 통계값입니다."25년 6월 말 기준으로 건설 사고집계를 하였음을 알려드립니다.
