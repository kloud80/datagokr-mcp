summary_user: 광주광역시 동구(동부소방서 관할)의 특정소방대상물 수를 업종별로 2023·2024·2025년 세 해에 걸쳐 집계하고 증감률(퍼센트)을 함께 담은 소규모 집계 파일이다(약 31행, csv 1.2KB). 소방행정 담당자나 지역 안전 분석가가 '동구에서 소방안전관리 대상이 되는 시설 중 어떤 업종이 늘고 줄었는가'를 확인해 검사 대상 변화나 인력 배치를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방서의 같은 현황이나 화재 발생 자료와는 업종명을 맞추거나 같은 기관 기준으로만 이어 쓴다.
description_portal: 광주광역시 동구 특정소방대상물 증감현황에 대한 데이터로 작년과 올해의 특정소방대상물의 업종별 증감율을 설명하는 자료입니다.특정소방대상물이란, 법적으로 소방안전관리자의 선임 의무가 있거나 화재 대응 체계상 우선적으로 관리해야 하는 시설을 말하며, 이 업종별 증감율을 통해 어떤 시설 유형이 증가하거나 감소했는지 파악할 수 있습니다. 이 정보는 소방 정책 수립, 자원 및 인력 배치, 검사 대상 변화, 그리고 장기적 트렌드 모니터링 등 다양한 행정적 활용에 유용하며, 지역 안전 역량을 강화하는 데 중요한 기초 데이터입니다.이 데이터는 총 31개 항목(행)으로 구성되어 있으며, 업종별 특정소방대상물의 작년과 올해 간 증감 현황(증감율)을 정리한 데이터입니다.광주광역시 동구 관내에서 소방 법령상 특정소방대상물로 지정되는 업종들의 현황을 연도별로 비교한 지표입니다.이를 통해 동부소방서 관할 지역의 소방안전 위험도 변화나 관리 대상 확장 등을 파악할 수 있는 유용한 지표로 활용될 것입니다.
