summary_user: 전북특별자치도 내 위험물 제조소·취급소(주유·판매·이송·일반)·저장소(옥내·옥외탱크·지하탱크·이동탱크·암반탱크 등) 개소 수를 구분 행(포털 설명상 소방서 관할별)마다 유형별로 집계한 통계로, 725바이트 크기의 작은 CSV 파일입니다. 소방·재난관리 담당자나 분석가가 '전북의 어느 소방서 관할에 주유취급소나 지하탱크저장소 같은 위험물 시설이 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 구분 열의 관할 이름을 기준으로 이름 매핑해 이어 써야 한다.
description_portal: 전북특별자치도 내에 설치된 위험물 제조소, 저장소, 취급소의 유형별 현황을 집계한 통계 데이터입니다. 이 자료는 각 소방서 관할 구역별로 주유소를 포함한 취급소, 옥내·외 탱크 저장소 등 「위험물안전관리법」에 따라 관리되는 시설의 총 개소 수를 상세히 분류하여 제공합니다. 이 데이터는 소방 및 재난 관리 부서에서 지역별 위험물 시설의 분포와 밀집도를 파악하여 화재 예방 및 대응 전략을 수립하는 데 필수적인 정보입니다. 또한, 도시 계획이나 환경 영향 평가 시 특정 지역의 안전성을 진단하는 기초 자료로 활용될 수 있습니다.
