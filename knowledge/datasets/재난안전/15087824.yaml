description_portal: 부산광역시 119 일일 소방 출동 정보 데이터를 개방합니다.소방출동은 화재나 비상, 긴급 상황에서 소방대원들이 출동하여 시민의 생명과 재산을 보호하는 활동을 말합니다. 주로 화재 진압, 구조 작업, 응급 구호 등이 있으며출동 시에는 소방대원들이 장비와 도구를 사용하여 상황에 대응하고, 주변 주민들의 안전을 최우선으로 합니다.개방되는 데이터에는 등록일, 종별, 구분, 재난 지점, 재난 규모, 관할서, 관할 구역 등의 항목이 포함되어 있습니다
