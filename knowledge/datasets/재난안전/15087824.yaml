summary_user: 부산광역시 119 소방출동을 건별로 담은 원천 데이터로, 등록일시·출동 종별·구분·재난 지점 주소·재난 규모·관할 소방서와 관할 구역을 한 행에 담는다. 시민이나 분석가가 "최근 우리 동네에서 어떤 종류의 소방 출동이 얼마나 자주 있었나"처럼 지역·유형별 출동 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 소방 데이터(화재 발생·119안전센터 등)와는 재난 지점 주소나 관할서 이름 매핑으로만 이어 쓴다.
limits: 표준 행정코드·좌표 같은 공통 키가 없어 다른 데이터와 바로 결합되지 않고, 주소·관할서 이름을 직접 맞춰야 한다. 범위는 부산광역시에 한정되며 공간 좌표가 없는 비공간 데이터다. 개발계정은 하루 10,000회 호출 제한이 있다.
