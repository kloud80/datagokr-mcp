summary_user: 경기도 재난안전 관리 분야 사업의 예산 집행 현황을 사업년도·집계반기·사업구분별로 담은 집계 데이터로, 사업내용과 예산현액·집행액·집행잔액(천원 단위)을 함께 제공한다. 분석가나 도민이 '올해 상반기 경기도 재난안전 사업 중 어느 분야에 예산이 배정됐고 실제로 얼마나 집행됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업구분 이름 매핑이나 같은 기관(경기도) 기준으로만 연결하고, 대피시설·소방·재난 위험지역 같은 재난안전 데이터와 나란히 놓고 본다.
description_portal: 이 데이터는 경기도 내 재난안전 관리 분야의 예산 집행 현황을 담고 있으며, 재난 대응 및 안전 확보를 위한 재정 운용 상황을 확인할 수 있습니다. 주요 항목은 **사업년도, 집계반기, 사업구분정보, 사업내용, 예산현액(천원), 집행액(천원), 집행잔액(천원)**으로 구성되어 있습니다. 이를 통해 각 반기별 재난안전 관련 사업이 어떤 분야에 얼마만큼의 예산이 배정되고 실제로 집행되었는지를 파악할 수 있습니다. 데이터는 재난안전 정책 효과 분석, 예산 집행 효율성 검토, 분야별 투자 우선순위 결정, 향후 안전관리 재정 계획 수립에 활용될 수 있습니다. 다만, 제공되는 금액 단위가 천원 기준임을 고려해야 하며, 예산 현액과 집행액 간의 차이가 집행잔액으로 산출된다는 점에 유의해야 합니다.
