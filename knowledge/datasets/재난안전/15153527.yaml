summary_user: 지진해일 발생 때 주민 대피 장소로 지정된 대피소의 위치를 중심점(점 객체) 단위로 담은 전국 범위의 시설별 원천 데이터로, 시설관리번호·점 일련번호·변경일자·변경사유 등을 함께 담는다. 해안 지역 주민이나 지자체 방재 담당자가 "우리 동네 지진해일 대피소는 어디에 있나"를 확인하거나, 분석가가 해안가 대피소 분포를 점검할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시설관리번호(FCLT_MNG_NO) 같은 같은 기관 내부 코드나 이름 매핑으로만 이어 쓰며, 대피·구호시설 계열 데이터와 함께 보는 것이 자연스럽다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지진해일 발생시 지역별 주민 대피 장소로 지정된 장소 위치 정보입니다.\""
