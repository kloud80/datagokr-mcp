summary_user: 2024년 1월 1일부터 12월 31일까지 전국 산악지대에서 소방에 신고된 산악사고를 건별로 담은 파일 데이터로, 수신 확인된 행은 10,134건이다. 신고 일시, 발생 시·구·동·리, 사고 원인과 종별, 처리 결과, 구조인원을 담아 산악 사고가 어느 지역에서 어떤 유형으로 많이 났는지 묻는 분석가나 안전 담당자가 쓴다. 공통으로 쓸 수 있는 조인 키는 확인되지 않아, 다른 데이터와는 발생 지역명 매핑이나 같은 기관 코드를 통해서만 이어 쓴다.
description_portal: 해당데이터는 전국 산악지대에서 발생한 사고에 대해  집계한 자료로써  데이터 구성항목은  신고년월일,신고시각,발생장소_시,발생장소_구,발생장소_동,발생장소_리,번지,사고장소코드명,사고장소기타내역,사고원인코드명_사고종별,구조인원 등으로 되어 있습니다. "산악사고’라고 하면 단순한 등산 중 사고를 넘어, 추락·실족·조난·실종·탈진·동상 등 산악환경에서 발생 가능한 다양한 사고유형을 포함하며, 사고 발생 장소, 신고·출동 시각, 구조인원 등을 확인 할 수 있습니다. 이를 통해  전국에 있는 산악지대별, 기간별, 사고 유형 등을 알 수가 있습니다.
