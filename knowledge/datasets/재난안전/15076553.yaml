summary_user: 대전광역시에서 대형·중요 화재나 인명피해 화재가 났을 때 꾸린 화재특별조사팀의 활동 내역을 담은 파일(xlsx, 약 10KB)로, 포털 설명상 시군구·읍면동, 합동 조사일, 조사 인원이 들어 있다. 분석가나 소방 행정 담당자가 '대전에서 특별조사팀이 투입된 화재가 어느 구·동에서 언제 몇 명 규모로 조사됐나'를 확인해 반복 화재 요인 분석이나 예방 대책의 기초 자료로 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 화재 발생 건별 자료나 119안전센터 자료와는 시군구·읍면동 이름을 맞추는 방식으로만 이어 쓴다.
limits: 파싱된 컬럼 이름이 모두 'Unnamed'로 나와 실제 헤더가 첫 행 아래에 있을 가능성이 크므로, 받은 뒤 헤더 위치를 직접 확인해야 한다. 행정코드 같은 공통 키가 없어 다른 데이터와 자동 조인이 어렵고, 범위는 대전 한 시도에 한정된다.
