description_portal: 겨울철 강설 및 결빙 대비, 안전한 도로 환경 조성을 위한 부산광역시 강서구 내 제설함 배치 현황 자료입니다.행정동 명, 설치 장소, 개수, 관리자, 연락처, 구군명, 데이터 기준일자, 위도, 경도 등으로 구성된 데이터입니다.겨울철 재해 우려지역 현황에 따라 제설함을 적절히 배치하였으며,  관내 지하차도 및 램프구간, 고갯길 등 제설결빙 취약구간 위주로 설치하였습니다.제설함 1개당 염화칼슘 2포(15kg), 모래주머니 40개 정도 적재되어 있으며, 도로 순찰 등을 통해 부족한 자재는 수시로 보충하고 있습니다.
