summary_user: 전주시가 교통량이 많은 지역과 횡단보도 등에 설치한 폭염 대응 그늘막을 한 기씩 담은 시설 원장으로, 관리번호·설치장소명·도로명/지번주소·설치년도·유형(고정형·스마트)·높이·펼침지름과 위도·경도를 제공한다. 시민이나 지도 서비스 개발자가 '우리 동네 횡단보도 근처 어디에 그늘막이 있나'를 찾거나, 분석가가 폭염 취약지역 대비 그늘막 배치가 부족한 곳을 가려내는 데 쓴다. 전역 조인 키는 없어서 행정동·주소 이름 매칭이나 위도·경도 좌표를 기준으로 무더위쉼터 같은 대피·구호시설 자료와 공간적으로 겹쳐 쓴다.
description_portal: '본 자료는 전주시가 폭염 대응을 위해 교통량 많은 지역 및 횡단보도 등에 설치한 그늘막 현황을 수록한 공공데이터입니다. 고정형 및 스마트 그늘막의 위치, 유형, 설치일자 등을 제공합니다. 자료는 위도·경도 정보가 포함돼 시각화 및 위치 분석에 유용합니다.폭염 취약지역 분석 및 그늘막 추가 설치 계획 수립,보행자 안전 및 도시환경 개선 정책 지원, 폭염 대응 재난안전 서비스 제공,내비게이션, 지도 서비스와 연계한 그늘막 위치 안내,시민 편의시설 정보 제공 및 공공데이터 활용 서비스 개발 에  활용 가능합니다.전북특별자치도 전주시 내 그늘막을 제공하며, 관리번호, 설치장소명, 설치위치, 설치년도, 그늘막 유형 등을 제공합니다.제공부서 : 재난안전과'
