summary_user: 대전광역시시설관리공단이 관리·운영하는 체육·환경·복지·기반 분야 공공시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설구분·시설명·준공연도·인수연도·주소·이용시간·전화번호·휴장일·주요시설물·관리부서를 담는다(포털 설명상 2025년 7월 1일 기준, CSV 약 8KB). 대전 시민이 공단 체육시설의 이용시간과 휴장일을 확인하거나, 분석가가 공단 관리 시설의 노후도(준공연도)와 담당 부서를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설 안전·점검 데이터와는 시설명이나 주소를 맞춰 이어 써야 한다.
description_portal: 대전광역시시설관리공단에서 관리 운영 중인 시설의 전체 현황 정보를 제공하고 있습니다. 공단 본부는 하수처리장 내에 위치하고 있으며 주소는 대전광역시 유성구 엑스포로 326 입니다. 공단은 체육, 환경, 복지, 기반 4개 분야의 공공시설을 관리하고 있습니다. 데이터에 표시되는 시설의 수는 신규 시설 수탁 등에 따라 변경될 수 있습니다. 해당 파일에서 제공하는 정보는 순번, 시설구분, 시설명, 준공연도, 인수연도, 주소, 이용시간, 전화번호, 휴장일, 주요시설물, 관리부서입니다. 공단 시설물 현황정보 데이터 기준일은 2025년 7월 1일 기준입니다.
