summary_user: 광주 서부소방서 관내에서 화재 위험이 크거나 인명·재산 피해가 클 것으로 보는 화재안전 중점관리대상을 대상 한 곳당 한 행으로 담은 목록으로, 2024년 12월 31일 기준 39개소의 관할 구역, 업종, 대상명, 위험도 등급(Ⅰ 4개소·Ⅱ 35개소)을 담는다. 지역 주민이나 소방·안전 분석가가 '서부소방서 관내에서 집중 관리되는 병원·복합건축물·판매시설은 어디이고 위험도 등급은 몇 등급인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방·건축물 데이터와는 대상명 같은 이름 매칭이나 같은 기관 자료끼리로만 이어 쓴다.
description_portal: 2024년 12월 31일 기준 광주광역시 서부소방서 관내 화재발생 우려가 크거나 인명 및 재산피해가 클 것으로 예상되는 화재안전 중점관리대상의 업종, 대상명 등을 나타내는 데이터이며, 총 39개소입니다. 세부내용으로는 의료시설  10개소, 복합건축물 12개소, 숙박시설 2개소, 문화시설 4개소, 위락시설 1개소, 판매시설 6개소, 업무시설 1개소, 운수시설 1개소, 공장 2개소가 있으며, Ⅰ등급 대상은 4개소, Ⅱ 등급 대상은 35개소입니다.(위험도 순은 Ⅰ 이 가장크며 Ⅱ > Ⅲ순으로 위험성이 작아집니다.)
