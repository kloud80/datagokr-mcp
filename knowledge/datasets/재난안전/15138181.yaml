description_portal: 본 자료는 한국승강기안전공단이 발급·관리하는 안전검사 합격필증의 입고 이력을 정형화한 데이터입니다. 각 레코드는 특정 일자에 입고된 합격필증 물량 1건을 의미하며, 필드는 입고일자, 수량, 시스템 등록일자로 구성됩니다. 입고일자는 실물 입고가 확인된 기준일, 시스템 등록일자는 행정시스템에 해당 건이 입력·반영된 일자를 나타냅니다. 동일 일자에 복수 행이 존재할 수 있으며, 이는 분할 입고 또는 동일 일자 여러 차수의 등록을 의미합니다. 수량 값은 장수(매수) 기준 정수로 기록되며, 대량 로트와 소량 로트가 혼재해 시점별 변동 폭이 클 수 있습니다. 일부 건은 입고일자와 시스템 등록일자가 일치하나, 물류 및 검수 절차에 따라 등록이 늦춰져 서로 다른 날짜로 기재될 수 있습니다. 스키마는 날짜—수량—등록일의 최소 필수 항목만 포함하여 기간별 입고 추이를 단순·명확하게 확인할 수 있도록 구성되어 있으며, 중복·분할 기록은 원시 이력을 보존하는 방식으로 표기됩니다.
