summary_user: 안산도시공사가 운영하는 체육시설·환경시설·자동차번호판 발급 등 이용시설물을 시설 구분별로 정리한 소규모 목록(CSV 약 8KB)으로, 주요시설·이용요금·위치·연락처를 담습니다. 안산 시민이 공사 운영 체육시설의 요금과 연락처, 학교부설주차장 야간개방 같은 사업의 위치를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 같은 이름 매칭이나 같은 기관 자료로만 이어 쓴다.
description_portal: 안산시 시설물에 대한 정보입니다.체육시설, 환경시설, 자동차번호판등에 대한 간략한 설명 자료입니다.시설에  대한 연락처 및 위치가 포함되어 있습니다. 페달로 사업종료로 삭제 및  학교부설주차장 야간개방 사업 추가하였습니다.감사합니다.
legal_basis_portal: 체육관, 수영장 기타 레저관련시설물입니다.페달로 사업종료로 삭제 및  학교부설주차장 야간개방 사업 추가하였습니다 보시고 많이 이용바랍니다.
