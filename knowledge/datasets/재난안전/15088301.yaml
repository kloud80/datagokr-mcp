description_portal: 본 자료는 「수상레저안전법」 위반 행위에 대한 단속 현황을 체계적으로 정리한 데이터입니다. 2015년부터 2025년까지 연도별 단속 추이를 포함하고 있으며, 위반 유형별로 구분하여 제공함으로써 특정 시기나 특정 위반 행위가 집중되는 경향을 한눈에 파악할 수 있도록 구성되어 있습니다. 주요 위반 항목은 무면허 조종, 주취 조종 및 측정 거부, 무등록 사업, 안전검사 미필, 안전장비 미착용, 운항규칙 미준수, 금지구역 또는 영업구역 위반, 수상레저 활동시간 미준수, 안전질서 명령 위반, 원거리 활동 미신고, 정원 초과, 미등록 기구 활동, 기타 등으로 세분화되어 있습니다. 이를 통해 단속의 주요 원인과 유형별 추세를 분석할 수 있으며, 향후 법령 개선, 단속 강화, 안전관리 정책 수립 및 예방 교육 자료로서 중요한 기초자료로 활용할 수 있습니다.
