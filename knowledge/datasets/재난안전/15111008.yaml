description_portal: '국토안전관리원에서 시설물을 대상으로 철근탐사 시험을 한 데이터입니다.시설물은 6개로 구분되며, 각 값은 교량, 터널, 댐, 항만, 하천, 상하수도 입니다.이때 교량은 도로교량과 철도교량으로 구분되며, 다른 시설물 또한 각 역할에 따라 값이 구분되어 있습니다.주철근, 배력철근, 수직근, 수평근, 띠철근 평가결과 데이터를 제공드립니다.총 30개의 열과 3,482개의 행으로 구성되어 있는 정보입니다.데이터 값 공란사유 : 데이터 미집계(시험결과 및 보고서 입력방법에 따라 데이터 미집계로 인한 공란발생)'
