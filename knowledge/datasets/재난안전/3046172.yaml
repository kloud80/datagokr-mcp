summary_user: 부산광역시 수영구의 가로등을 한 기씩 담은 시설 원장 파일로, 관리번호·소속 분전함·행정동·노선명과 램프 종류·용량(W), 등주 종류·형태, 점멸기 종류, 위도·경도를 담는다. 구민이나 분석가가 "우리 동네 어느 길에 가로등이 몇 기 있고 어떤 램프를 쓰는지"를 확인하거나, 야간 보행 안전 취약 구간을 찾는 데 쓴다. 전역 조인 키는 없어 행정동 이름이나 위도·경도 좌표로 CCTV·안전비상벨·보안등 같은 다른 방범 인프라 데이터와 공간 결합해 쓴다.
limits: 수영구 한 곳만 다루므로 다른 구·군과 비교하려면 별도 데이터가 필요하다. 표준 코드 형태의 조인 키가 없어 다른 데이터와는 행정동 이름 매핑이나 좌표 기반으로만 연결된다.
