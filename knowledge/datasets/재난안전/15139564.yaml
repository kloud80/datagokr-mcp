summary_user: 포항시 관내 대피소를 한 곳씩 담은 건별 목록으로, 대피소 이름·주소·위도·경도·면적·수용 인원과 대피소 종류, 대응 재난 종류(재난 카테고리 명)를 담는다. 포항 주민이 지진이나 해일 때 집 근처 어느 대피소로 가야 하는지, 분석가가 동네별 대피소 수용 인원이 충분한지 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표 기반 공간 매칭이나 대피소 이름 매핑으로 이어 쓰며, 재난 특보·위험지역 데이터와 겹쳐 보는 용도가 맞다.
description_portal: 포항시 대피 장소 목록에 대한 데이터로  대피소 명, 주소, 위도, 경도, 면적, 수용 수, 대피소 카테고리 명 등의 항목을 제공합니다
