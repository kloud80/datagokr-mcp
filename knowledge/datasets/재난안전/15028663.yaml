summary_user: 부산광역시 기장군 관내 도로(도로명·위치) 구간별로 가로등 설치 수량을 합계와 일반·LED·기타 고효율 유형별로, 등주 수와 함께 정리한 집계 파일(CSV, 약 4.9KB)이다. 군 담당자나 주민이 어느 도로 구간에 가로등이 적거나 LED 전환이 덜 됐는지 확인해 조명 취약구간·교체 대상을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도로명 문자열 매칭이나 같은 기관(기장군) 자료끼리만 이어 쓸 수 있다.
description_portal: 부산광역시 기장군 관내 도로구간별 조명시설(가로등) 설치 현황을 정리한 자료로, 도로명과 설치 위치정보를 기반으로 가로등의 총 설치 수량 및 유형별 현황을 확인이를 통해 지역별 조명시설 분포를 분석하고, 조명 취약구간 발굴, 노후 시설 정비 및 교체 계획 수립, 유지보수·안전점검 대상 선정 등 조명 인프라 관리업무에 활용또한 신규 설치 필요 구간 검토와 예산 편성, 사업 추진을 위한 기초자료로 활용되어 안전한 야간 보행환경 조성에 기여
