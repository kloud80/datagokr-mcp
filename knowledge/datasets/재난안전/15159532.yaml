description_portal: 본 데이터는 경찰청 국제협력담당관실에서 관리하는 「국외도피사범 국내송환_송환국별 현황」 통계로, 2011년부터 2024년까지 해외로 도피한 범죄 피의자·피고인 등이 국제공조수사, 인터폴 협력, 현지 사법기관과의 공조 등을 통해 국내로 송환된 실적을 연도별·송환국별로 집계한 자료이다. 제공 항목은 연도, 미국, 중국, 필리핀, 태국, 캐나다, 일본, 베트남, 인도네시아, 캄보디아, 기타 국가별 송환 건수로 구성되어 있으며, 국가별 송환 규모와 연도별 증감 추이를 비교·분석할 수 있다. 이를 통해 특정 국가에서의 송환 증가 여부, 아시아권 송환 비중 변화, 주요 송환국의 장기 추세, 전체 국외도피사범 송환 실적 변화 등을 파악할 수 있으며, 국제공조수사 정책 수립, 해외 도피범죄 대응전략 마련, 송환 협력 강화 필요 국가 식별, 치안 외교 및 국제협력 성과 분석 등에 활용할 수 있다.
