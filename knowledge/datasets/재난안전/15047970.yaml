description_portal: 경상남도 창원시 전통시장에 설치된 소방시설물(소화기설치여부, 비상경보설비설치여부, 자동화재탐지설비설치여부 등) 현황입니다.전통시장 내 설치된 소화기, 스프링클러, 피난안내등 등 소방 관련 시설물의 설치 현황과 상태를 포함한 자료입니다. 본 자료는 소방안전 점검, 사고 예방, 급박 상황 대응 역량 강화, 시장 상인 안전교육, 정책 수립 및 지원 계획 등에 활용될 수 있습니다.방대한 시설물 정보가 포함될 수 있어, 일반 뷰어(엑셀, 메모장 등)에서 일부 항목만 확인될 수 있으므로 R, Python, GIS 등 전용 분석 도구의 사용을 권장합니다.설치 기준일, 유지보수 주기, 점검 이력 등 자세한 정의 및 항목별 설명은 해당 지자체 또는 제공기관의 메타데이터 및 기술문서를 참고하시기 바랍니다.
