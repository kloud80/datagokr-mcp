summary_user: 남양주시에서 기계설비 성능점검을 받아야 하는 건축물을 한 건씩 담은 원천 목록으로, 건축물용도·건물명·소유자명·도로명/지번 주소·세대수·연면적을 담는다(CSV 약 43KB, 시군구 범위의 개별 주소 단위). 건물 관리자나 성능점검 업체가 '남양주시에서 성능점검 대상인 공동주택·건축물은 어디이고 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 도로명·지번 주소나 건물명을 매칭해 이어야 하며, 건축물대장이나 같은 부문의 시설 안전 원장과도 주소 기준으로 연결한다.
description_portal: 남양주시 기계설비 성능점검 대상 건축물 정보 데이터로, 소재지 주소(도로명/지번) 및 건축물 용도별 성능점검 기준(세대수/연면적) 등의 항목을 제공합니다.「기계설비법」 제15조 및 동법 시행규칙 제10조에 따라, 건축물 관리 주체는 전문 성능점검기관을 통해 주기적으로 성능점검을 받아야 합니다. 해당 데이터는「기계설비법」에 따라 일정 규모 이상의 건축물이나 시설물에 설치된 기계설비에 대해 주기적인 성능점검 및 유지관리를 의무화하는 제도의 대상이 되는 시설들의 정보를 담고 있습니다.  기계설비의 효율적인 관리와 성능 유지를 통해 건물의 에너지 효율을 높이고 사용자 안전을 확보하는 데 활용됩니다
