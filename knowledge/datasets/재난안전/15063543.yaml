description_portal: 해당데이터는 2008년 부터 2017년도 동연도별 화재경계지구 현황 데이터는 10년간 전국의 화재취약지역 지정 현황을 정리한 통계로, 시장지역·공장창고·목조건물 밀집지역, 위험물 제조소, 석유화학공단, 소방시설 미비 지역, 소방관서장 지정 지역 등 7개 유형별 건수를 연도별로 기록하고 있습니다. 화재경계지구란 소방기본법에 따라 화재 발생 우려가 높거나 화재 발생 시 피해가 클 것으로 예상되는 지역을 소방청장, 소방본부장, 소방서장이 지정한 것을 말합니다. 소방경계지구로 선정이 되면 1. 소방본부장 등은 소방특별조사를 실시하고, 필요시 소방용수시설·소화기구 등 소방설비 설치를 명할 수 있습니다. 2. 관계인에 대해 소방훈련 및 교육을 실시하며, 화재예방 및 경계에 필요한 자료를 매년 작성·관리합니다. 3. 화재경계지구로 지정된 지역은 소방관서의 관리·감독이 강화되고, 소방특별조사, 비상소화장치 점검, 소방통로 확보 훈련 등이 시행됩니다.
