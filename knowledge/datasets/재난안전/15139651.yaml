summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 도로시설 정보를 시설별로 담으며, 시설코드·일련번호·도로관리번호·행정동코드·부속시설 여부·위치 설명·수정일시가 들어 있다. 지자체 안전담당자나 분석가가 '우리 지역 행정동에 어떤 도로시설과 부속시설이 어디에 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 행정동코드(DONG_CD)나 도로관리번호를 이름·코드 매핑하거나 같은 기관(행정안전부) 코드 체계로 다른 시설 안전 데이터와 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 도로시설 정보로, 도로시설코드, 도로시설일련번호, 도로관리번호, 행정동코드, 도로부속시설여부, 도로시설위치내용 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
