summary_user: 서울시가 지정한 안심귀갓길을 링크(구간) 단위로 나눠 구간 길이, 시군구·읍면동 코드와 명칭, 안심벨·CCTV·보안등·노면표기·112 위치신고 안내판 등 시설물 개수, 안심귀갓길 ID·명칭·조성연도, 세부 위치를 담은 건별 데이터입니다. 자치구 담당자나 분석가가 '우리 동네 안심귀갓길 구간 중 CCTV나 보안등이 적은 곳은 어디인가'를 확인해 시설 확충 대상을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 시군구·읍면동 코드(SGG_CODE, EMD_CODE)나 명칭을 매핑해 같은 행정동 단위의 CCTV·안전비상벨·보안등 현황 같은 다른 방범 인프라 데이터와 이어 쓴다.
description_portal: 이 데이터는 서울시 안심귀갓길 경로 현황을 담고 있으며, 시민들이 밤길을 안전하게 귀가할 수 있도록 지정된 경로와 관련 시설물 정보를 제공합니다. 주요 항목에는 링크 길이, 시군구 및 읍면동 코드와 명칭, 설치된 안심벨 개수, CCTV 수, 노면표기, 보안등, 112 위치신고 안내판, 기타 시설물 현황, 안심귀갓길 ID와 명칭, 조성연도, 세부 위치 설명, 데이터 기준일자가 포함되어 있습니다. 이 데이터는 서울시 각 지역의 안전 인프라 구축 현황을 파악할 수 있도록 하며, 범죄 예방과 보행자 안전 강화 정책 수립에 활용됩니다. 또한 지역별 취약 구간을 분석하여 보안등·CCTV 확충 등 추가 대책 마련에도 기초 자료로 제공될 수 있습니다.
