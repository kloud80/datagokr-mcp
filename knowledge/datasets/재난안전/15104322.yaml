description_portal: 본 데이터는 경찰청에서 제공하는 2019년부터 2024년까지 6개년의 월별 교통사고 발생 건수 통계이다. 연도(2019~2024)와 월(1~12월)을 기준으로 월별 사고 건수를 수록하였다. 연간 총 사고 건수는 2019년 약 22만 9천 건에서 2024년 약 19만 6천 건으로 감소 추세를 보이며, 특히 2020년 이후 코로나19에 따른 이동량 변화 등의 영향으로 뚜렷한 감소가 나타났다. 월별로는 2월에 사고 건수가 가장 적고, 나들이 및 이동량이 증가하는 5월과 10~11월에 상대적으로 많은 계절적 패턴이 매년 반복되는 특징이 있다. 본 데이터는 교통안전 정책 수립, 계절별·월별 사고 예방 대책 마련, 교통사고 추이 분석 및 관련 연구 등에 활용될 수 있다.
