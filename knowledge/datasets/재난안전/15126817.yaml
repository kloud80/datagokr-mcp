description_portal: 예금보험공사는 예금자보호를 위해 설립된 공공기관으로, 서울 청계천로30에 공사 사옥을 보유하고 관리 중에 있습니다. 동 데이터는 예금보험공사의 층별 소화설비 보유 현황에 대한 데이터로, 층별 소화기 세부항목 및 대수, 층별 소화전 대수, 층별 기타 소화설비 종류에 관한 데이터를 제공합니다. 동 데이터 제공을 토대로 공공행정 분야의 소화설비 관련 현황을 파악하는데 유용한 정보를 제공하여 국민들의 안전관리에 보탬이 되고자 합니다. 소화기 설비는 매년 점검 및 신규 배치 등을 진행하는 중에 있으므로, 매년 데이터가 일부 상이할 수 있음을 양지하시기 바랍니다.
