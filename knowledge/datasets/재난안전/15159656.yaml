description_portal: 본 데이터는 경찰청에서 제공하는 2012년부터 2024년까지의 북한이탈주민 신변보호 대상자 성별 현황 통계로, 연도별 남성·여성 대상자 수를 구분하여 제공한다. 2012년 남성 6,905명, 여성 16,413명에서 2019년 남성 8,413명, 여성 23,502명으로 증가한 이후, 2020년부터 전반적으로 감소하는 추세를 보인다. 2024년 기준 남성 4,516명, 여성 16,316명으로 집계되며, 전 기간에 걸쳐 여성 신변보호 대상자가 남성보다 많은 구조가 확인된다. 연도별 증감 추이, 성별 구성비 변화, 보호대상 규모 변동 분석 등에 활용할 수 있다.
