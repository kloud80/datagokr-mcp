description_portal: '○ 통계개요* 통계명 : 119 구조활동 실적(구별)* 통계종류 : 119 출동건수 및 구조활동 실적을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 : 구조대 및 구급대의 편성·운영 등에 관한 규칙(행정자치부령 296호)* 작성목적 : 119구조대의 활동내역을 집계하고 현황을 진단함으로써, 구조활동이효과적으로 이루어지기 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 119구조대 → 소방서 → 서울소방재난본부 재난대응과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 자치구 및 소방서내용 - 119 구조대 출동건수 및 구조인원○ 용어설명○ 기 타* "미처리"항목은 출동했으나 이미 자력구조 등으로 119 구조대의 활동이불필요한 경우○ 출 처 : 서울특별시 소방재난본부'
