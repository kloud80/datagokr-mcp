summary_user: 부산 사하구 관내 가로등 수를 행정동(괴정동·당리동·하단동·신평동·장림동·다대동·구평동·감천동)별로 묶어 램프 종류(LED, 고압 메탈, 나트륨 및 메탈)마다 개수만 적은 집계 파일이며, 파일 크기는 280바이트에 불과하다. 구청 담당자나 주민·분석가가 "우리 동네 가로등은 LED 전환이 얼마나 됐나"처럼 동별 램프 구성과 교체 현황을 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 행정동 이름(구분)을 맞춰 붙이는 방식으로만 연결한다.
