summary_user: 재난안전데이터 공유플랫폼이 제공하는 공공시설 복구계획용 재해대장의 피해산출 정보로, 재난연도·재난유형·지역·공공시설 단위로 공종별 피해물량, 산출물량, 단가, 산출근거, 합계금액을 담는다(범위 전국, 비공간). 지자체 복구 담당자나 재난 분석가가 특정 연도 재난에서 공공시설 공종별 피해물량과 복구 산출금액이 얼마로 잡혔는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 지역코드(RGN_CD)나 재난연도·순번 같은 같은 기관 내부 코드, 또는 이름 매핑으로만 다른 재해대장·복구계획 데이터와 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 공공시설 복구계획 관련 재해대장 피해산출 정보로,재난연도, 피해물량, 산출물량, 기타피해규격, 기타피해단위, 기타피해단가 등을 제공하고 있습니다. 데이터의 갱신주기는 월 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
