description_portal: 대전광역시 서구 급경사지 현황 데이터입니다.(순번, 시도명, 시군구명, 읍면동,지번, 종류, 구조, 유형, 관리기관, 공공/민간, 등급)대전광역시 서구 급경사지 파일은 서구 관내에 분포한 급경사지의 위치, 현황, 관리대상지 등을 체계적으로 정리한 자료를 의미한다. 급경사지란 경사도가 급하여 붕괴·산사태 등 재해 위험이 높은 사면을 말하며, 「급경사지 재해예방에 관한 법률」에 따라 지방자치단체가 관리대상지를 지정하고 안전점검 및 보강사업을 수행한다. 서구는 대전의 중심 생활권으로 주거지와 산지가 밀접하게 분포해 있어, 특히 여름철 집중호우나 지진·낙석 등에 취약하다. 이에 따라 서구청은 관내 급경사지의 현황을 데이터베이스화하고, 공공관리 대상지·사유지 내 관리대상지를 구분하여 관리한다.파일에는 급경사지의 지번·위치·면적·경사도 등 기초정보뿐 아니라 위험등급, 인근 주거지·도로와의 거리, 정비 필요성 등이 포함된다. 또한 붕괴위험지역으로 지정된 곳은 정비사업 계획, 예산 투입 현황, 안전조치 이력 등이 기록되어 재난 대응 자료로 활용된다.
