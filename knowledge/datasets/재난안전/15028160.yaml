summary_user: 충청북도 제천시에 설치된 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 목록 파일(약 1KB CSV)로, 시설명·도로명주소·규모(톤)·심도(M)·데이터기준일자를 담는다. 단수나 재난 상황에서 제천 시민이 우리 동네에서 가장 가까운 비상급수시설이 어디인지 찾거나, 시 담당자·분석가가 급수 취약지역을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어, 다른 대피·구호시설 데이터와는 도로명주소를 지오코딩하거나 시설명·주소로 맞춰 이어 써야 한다.
