description_portal: '해당 통계는 시도별로 운영중인 소방조직에 관한 통계로, 소방기관별 관서 수에 대한 정보를 포함하고 있습니다.소방기관은 시도 소방본부, 소방서, 119안전센터, 119지역대 등이 있으며, 소방조직의 구성 및 행정구조를 확인할 수 있는 자료입니다.-본부별 : 시도 소방본부(광역자치단체별로 존재)-본부 조직 : 시도 소방본부 조직 구성-소방본부 : 운영중인 소방본부의 개수-소방학교 : 신규, 현직 소방대원들에 대한 교육이 이루어지는 교육기관-소방서 : 운영중인 소방서 개수- 119안전센터 : 화재진압의 기능을 수행하는 센터 수- 구조대 : 인명구조의 기능을 수행하는 기관의 수- 구급대 : 응급처치, 환자이송 등 구급 서비스를 제공하는 기관의 수- 소방항공대 : 헬기 등을 이용하여 공중에서 화재진압 및 구조, 구급 서비스를 제공하는 조직의 수- 소방정대 : 해상사고 및 선박화재 등에 대응하기 위한 선박을 운영하는 조직의 수- 119지역대 : 원거리 및 외곽에 위치하여 화재진압 및 구조, 구급에 조기 대응하는 기관의 수'
