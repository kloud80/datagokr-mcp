description_portal: '○ 통계개요* 통계명 : 주택종류별 화재발생현황* 통계종류 : 서울시 주택종류별로 화재발생 및 피해현황을 제공하는 일반ㆍ보고통계* 작성목적 : 화재발생및 피해현황을 주거종류별로 제공하여 사고 방지 및 대응 등효과적 관리를 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 소방서 → 서울소방재난본부 → 국민안전처* 공표주기 : 정기(매년, 12월 말 기준)* 공표범위 : 지역 - 서울시내용 - 주택종류별 화재발생건수 및 피해현황 등○ 용어설명* 화재 : 사람의 의도에 반하거나 고의에 의해 발생하는 연소 현상으로서 소화시설등을 사용하여 소화할 필요가 있거나 또는 화학적인 폭발현상을 말함* 사상자(사망, 부상자) : 화재현장에서 사망 또는 부상당한 사람을 말하며,부상을 당한후 72시간이내에 사망한 경우에는 화재로 인한 사망으로 봄* 단독주택 : 단일가구를 위해서 대지위에 건축하는 양식으로 건축법상 면적제한이 없음* 다중주택 : 독립된 주거형태가 아닌 주택으로 주방과 화장실을 공동 사용하는 구조로연면적이 330㎡ (100평)이하이고 층수가 3층 이하인 주택.* 다가구주택 : 주택으로 쓰이는 층수가 3개층 이하이고 주택으로 쓰여지는 바닥면적의합계가 660㎡(220평)이히이며 ,19세대 이하가 거주할 수있는 주택* 아파트 : 주택으로 쓰이는 층수가 5개층 이상인 주택* 연립주택 : 주택으로 쓰이는 1개동의 연면적이 660㎡ 를 초과하고,주택으로 쓰이는 층수가 4개층 이하인 주택.* 다세대주택 : 주택으로 쓰이는 연면적이 660㎡ 이하이고 주택으로 쓰이는층수가 4개층 이하인 주택'
