summary_user: 전국 지역별로 도시가스 보일러가 어디에 설치돼 있는지(다용도실·베란다, 전용보일러실, 거실·방, 화장실·목욕탕, 실외, 기타)를 대수로 집계한 통계 파일이며, 건별 시설 원장이 아니라 645바이트 크기의 소규모 지역 단위 집계입니다. 가스안전 정책 담당자나 분석가가 '화장실이나 거실처럼 사고 위험이 큰 실내 공간에 보일러가 많이 설치된 지역은 어디인가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름을 행정구역 명칭이나 코드에 맞춰 매핑해야만 이어 쓸 수 있습니다.
description_portal: '한국가스안전공사 업무 수행 과정에서 수집한 전국 지역별, 도시가스사별 가스보일러 설치 현황 제공합니다.해당 데이터는 지역별, 설치장소(다용도실/베란다, 전용보일러실, 거실/방, 화장실/목욕탕, 실외 등)에 따른 도시가스 보일러 설치 현황으로 구성되어 있습니다.도시가스 보일러와 관련된 가스안전관리 강화, 사고예방을 위한 정책수립 등을 위한 통계 자료 등에 활용 가능합니다.※ 해당 데이터는 한국가스안전공사가 업무 활용을 위해 수집, 관리하는 정보로, 타 유관기관이 제공하는 정보와 상이할 수 있으니 참고 바랍니다.※ 해당 데이터의 주기는 수시 데이터로 비정기적으로 제공됩니다.- 데이터 기준일 : 2020년 3월 26일'
