description_portal: 제주도는 관광지, 도시, 농·어촌이 혼재된 지역으로 치안 수요가 지역별로 상이하게 분포되어 있습니다. 이에 따라 각 경찰서의 범죄 대응력과 인력 현황을 종합적으로 파악하는 것이 중요합니다. 본 데이터는 2019년부터 2021년까지 동부·서부·서귀포 경찰관서의  살인, 강도, 강간·강제추행, 절도, 폭력 등 5대 범죄의 발생 및 검거 건수를 연도별로 제공하며, 같은 기간 경찰관 정원 및 현원 현황도 함께 수록되어 있습니다. 이를 통해 경찰서별 범죄 발생 수준과 인력 대비 대응 실태를 비교·분석할 수 있으며, 지역별 치안 정책 수립과 인력 배치 전략 마련에 활용될 수 있습니다. 개인정보는 포함되지 않으며, 자료는 1회성 입니다.
