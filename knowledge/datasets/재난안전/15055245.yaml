summary_user: 광주 북부소방서 관할 특정소방대상물 가운데 문화재(북동 천주교회, 김용학가옥, 취가정, 풍암정, 환벽당 등 5곳)를 건별로 담은 소규모 파일로, 대상물명·관할구·도로명주소·바닥면적·연면적을 제공한다. 북구 문화재 시설의 소방 안전 점검이나 화재 대응 계획을 세우는 담당자·분석가가 '관할 내 소방 관리 대상 문화재가 어디에 있고 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소(소재지도로명주소)나 대상물명으로 맞춰 이어 쓰며, 같은 소방서의 다른 특정소방대상물·소방용수 현황과 함께 본다.
