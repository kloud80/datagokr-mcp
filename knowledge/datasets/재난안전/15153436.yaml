summary_user: 밤 시간대(20~24시) 5대범죄 발생현황을 바탕으로 여성범죄 주의구간을 전국 범위로 담으며, 구간마다 유형명·유형코드, 등급(GRD), 시도·시군구 코드, 공간 정보(GEOM)가 붙어 있습니다. 귀갓길이나 거주지 주변에서 밤에 주의해야 할 구간이 어디인지 확인하려는 주민, 또는 이를 지역별 안전 대책에 반영하려는 지자체·분석가가 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시도·시군구 코드 필드의 이름·코드 매핑이나 같은 기관 데이터의 코드로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 밤(20-24시) 5대범죄 발생현황 관련 정보입니다.\""
