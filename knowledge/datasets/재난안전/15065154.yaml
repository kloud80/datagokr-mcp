description_portal: 이 데이터는 동작구 내 소방기관의 운영 현황 정보를 포함하고 있습니다.시도본부 항목을 통해 소방기관이 소속된 소방본부를 확인할 수 있습니다.소방기관명칭 항목에서는 각 소방서 및 119안전센터 등 기관명을 확인할 수 있습니다.주소 항목을 통해 소방기관의 위치 정보를 확인할 수 있습니다. 주소 정보는 도로명주소 체계를 기준으로 제공됩니다.전화번호 항목을 통해 해당 소방기관과의 연락이 가능합니다.이 데이터는 긴급 상황 시 가까운 소방기관 확인 및 행정업무에 활용될 수 있습니다.
