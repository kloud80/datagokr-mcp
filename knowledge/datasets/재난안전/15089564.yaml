description_portal: “119 구급상황관리센터 운영 현황” 데이터는 전국 시·도별로 설치·운영 중인 119 구급상황관리센터의 활동 실적과 운영 체계를 집계한 자료입니다. 이 데이터에는 연도별 센터 설치 및 운영 현황, 센터별 배치 인력 규모(의사, 간호사, 응급구조사 등), 처리된 상담 및 의료지도 건수, 응급환자 사전 상담 및 응급처치 안내 실적, 병원 연계·이송 관리 건수 등이 포함됩니다. 구급상황관리센터는 119에 걸려온 구급 신고를 접수해 환자 상태를 분류하고, 현장에서 구급대원이 수행하는 응급처치를 전문적으로 지도하며, 환자에게 적합한 이송 병원을 지정·연계하는 중요한 역할을 합니다
