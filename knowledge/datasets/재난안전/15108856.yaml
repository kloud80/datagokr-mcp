description_portal: 해당 자료는 생활안전융합데이터 구축을 위해 의왕시 생활안전 관련 주요 대상물 정보를 300셀 격자 기반으로 정리한 통계 데이터입니다. 각 격자 내에 포함된 주차장, 도시공원, 어린이보호구역, 공중화장실, 전통시장, 어린이집, 자전거보관소, 초·중등학교, 여성안심택배함, 정류장 등 생활밀착형 시설물의 존재 여부 및 분포 특성을 표준화된 공간격자 방식으로 제공합니다. 개별 시설물의 좌표 대신 생활권 단위로 집계된 통계 정보를 통해 생활안전 취약지역을 효과적으로 탐지할 수 있으며, 보행·생활환경 특성과 연계한 안전수준 분석 및 정책수요 파악이 가능합니다. 본 데이터는 안전·편의시설의 접근성과 분포 균형 여부를 시각화 및 분석하는 데 활용되며, 2022년 기준 1회성 구축된 자료로 생활안전융합분석 및 정책 참고용으로 활용하는 것이 적합합니다.
