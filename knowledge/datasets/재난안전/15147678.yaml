summary_user: 서울 강북구의 민방위 비상급수시설을 인허가 건별로 담은 데이터로, 시설명·지번/도로명 주소·인허가일자·영업상태(영업/폐업)·중부원점TM 좌표(XCRD, YCRD)를 포함하며 영업 중인 곳과 폐업한 곳이 함께 들어 있다. 구청 재난 담당자나 주민이 '단수나 민방위 사태 때 우리 동네 가까운 비상급수시설은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 대피·구호시설 데이터와는 주소·시설명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결한다.
description_portal: '서울특별시 강북구 민방위급수시설 인허가 정보 데이터는 강북구의 민방위사태 발생 시 급수가 불가능 한 경우 비상급수에 사용되는 시설정보입니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
