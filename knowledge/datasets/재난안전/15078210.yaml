summary_user: 전라남도경찰청이 집계한 살인·강도·강간·강제추행·절도·폭력 5대 범죄의 연도별 발생건수·검거건수와 검거인원(남녀, 성년·미성년, 법인체)을 담은 집계 파일로, 포털 설명상 기간은 2018~2025년이고 csv 한 건(1,826바이트)이다. 연구자나 지역 치안 담당자가 '전남에서 절도·폭력 발생과 검거율이 해마다 어떻게 변했고, 검거인원 중 미성년 비중은 얼마인가'를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 시도청 범죄 통계나 인구 통계와는 연도와 범죄 분류 이름을 맞춰서 이어 쓴다.
description_portal: 5대 범죄 발생 및 검거 현황 데이터는 2018~2025년 전라남도 지역에서 발생한 살인, 강도, 강간·강제추행, 절도, 폭력 등 주요 5대 범죄의 연도별 발생 건수와 검거 건수를 포함하는 공공데이터입니다. 이 데이터는 전라남도경찰청에서 수집하여 공공데이터포털을 통해 제공되며, 성년, 미성년, 성별 등으로 세분화된 정보를 포함하고 있습니다. 이를 통해 전라남도 내 범죄 발생 추세를 분석하고, 지역별 치안 정책 수립 및 범죄 예방 전략 마련에 활용할 수 있습니다. 또한, 연구기관이나 민간에서도 사회적 동향 분석 및 정책 수립을 위한 기초자료로 활용할 수 있습니다.
