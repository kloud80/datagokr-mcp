summary_user: 전라남도 내 소방청과 지방자치단체가 지정한 우수 다중이용업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 7KB)로, 관할 소방관서명·업소명·업종·도로명주소가 들어 있다. 음식점·숙박업소·노래방·PC방처럼 많은 사람이 이용하는 시설 가운데 '우리 동네에 소방안전 우수 업소로 지정된 곳이 어디인가'를 확인하려는 주민이나, 소방관서별 지정 현황을 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명주소를 맞추거나 관서명(소방관서) 기준으로 이어 써야 한다.
description_portal: '- 전라남도 내 우수 다중이용업소 현황(해당 소방관서명, 업소명, 업종, 도로명주소 등)에 대해 조회하실 수 있습니다.- "우수 다중이용업소"는 다중이용업소 안전관리 강화 및 화재 예방을 위해 소방청과 지방자치단체가 지정한 업소로, 주로 음식점, 숙박업소, 노래방, PC방, 영화관 등 다수의 인원이 이용하는 시설이 포함됩니다.- 우수 다중이용업소로 지정되기 위해서는 다음과 같은 기준을 충족해야 합니다:- 소방시설 완비 : 소화기, 스프링클러, 자동화재탐지설비 등 필수 소방시설이 설치되어야 합니다.- 소방안전교육 이수 : 시설 관리자 및 종사자가 정기적인 소방안전교육을 이수해야 합니다.- 소방안전관리자 지정 : 시설 내 소방안전관리자를 지정하여 안전관리를 담당해야 합니다.- 소방시설 유지관리 : 소방시설의 정기적인 점검 및 유지관리가 이루어져야 합니다.'
