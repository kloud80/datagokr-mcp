description_portal: '국토안전관리원에서 실시한 최근 3개년간 실시한 교량의 강재비파괴검사의 결함률 현황을 확인하고 준공년도에 따른 비파괴검사 물량의 선정기준을 만드는데 배경데이터로 사용한 자료를 제공합니다.강재(강철) 비파괴검사(Nondestructive Testing, NDT)는 재료나 구조물을 파괴하지 않고 내부 및 표면의 결함 유무, 건전성 등을 확인하는 기술입니다. 강구조물, 용접부 등에 널리 사용됩니다. 주요 강재 비파괴검사 방법은 다음과 같습니다.1. 초음파 탐상 검사 (UT, Ultrasonic Testing) 원리: 강재에 초음파를 전달시켜 내부 결함(균열, 기공 등)에서 반사되는 신호를 분석하여 결함의 위치와 크기를 파악합니다.적용: 주로 강재 내부 및 용접부 검사에 사용되며, 특히 면(面) 형태의 결함 검출 능력이 우수합니다. 2. 방사선 투과 검사 (RT, Radiographic Testing) 원리: X선 또는 감마선을 강재에 투과시켜 반대편에 놓인 필름에 상을 기록합니다. 결함이 있는 부분은 방사선 투과량이 달라져 필름에 다르게 나타납니다.적용: 내부 결함 검출에 효과적이며, 검사 결과를 필름 형태로 영구 보관할 수 있는 장점이 있습니다. 구형(球形) 결함(기공 등) 검출에 용이합니다. 3. 자기 분말 탐상 검사 (MT, Magnetic Particle Testing) 원리: 강재에 자성을 띠게 한 후 고운 자성 분말을 뿌리면, 표면 또는 표면 근처의 결함 부위에 자성 분말이 달라붙는 원리를 이용합니다.적용: 강자성체 재료(강재 포함)의 표면 및 표면 직하 결함 검출에 적합합니다. 4. 침투 탐상 검사 (PT, Penetrant Testing) 원리: 재료 표면에 침투액을 도포하고 일정 시간 후 제거한 다음, 현상액을 발라 결함 부위에 스며든 침투액이 표면으로 다시 나타나도록 하여 결함을 확인합니다.적용: 소재에 관계없이(강재, 플라스틱 등) 표면에 개방된 결함을 검사하는 데 사용됩니다. 원리가 단순하여 사용하기 간편합니다.'
