summary_user: '부산 동래구에 설치된 가로등을 설치장소(소재지)별로 한 건씩 담은 파일로, 관리기관·개수와 함께 암 길이·형태·재질, 등주 형상·높이·재질, 등기구·램프·안정기의 규격과 개수 같은 시설 사양을 기록한다. 구청 시설 담당자나 생활안전 분석가가 "우리 동네 어느 길에 가로등이 몇 개 있고 어떤 램프(예: 고압나트륨, 메탈)를 쓰는지"를 확인하거나 램프 교체·조도 개선 대상을 추리는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 방범 인프라(CCTV·보안등 등) 데이터와는 소재지 주소 문자열을 맞추거나 같은 기관 기준으로만 이어 쓴다.'
