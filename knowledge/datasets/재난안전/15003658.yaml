description_portal: 한국전기안전공사에서는 특화된 전문기술인력 및 첨단계측장비를 활용하여 국내 및 해외전기설비의 정밀안전진단, 시운전, 트러블슈팅을 비롯하여 해양플랜트 전기설비까지 다양한 분야에서 최상의 서비스를 제공하고 있습니다.정밀안전진단을 할 수 있는 법정 수행근거는 엔지니어링산업 진흥법 제21조 사업자 신고이며, 보유하고 있는 면허는 엔지니어링 사업자(전기설비, 산업안전), 전문설계업 1종, 종합감리업 1종, 설계감리업이 해당됩니다.이 데이터는 2024년 해외(사우디, 베트남, 인도네시아, 괌, 이라크 등)에서 정밀 안전진단을 진행한 내역 21건을 제공합니다.
