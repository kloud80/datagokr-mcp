description_portal: 디지털 기반 노후위험시설 안전관리시스템에서 제공하는 노후위험시설물 정보 데이터는 노후화로 인해 안전사고 발생 가능성이 높은 시설물의 현황을 체계적으로 관리하고, 위험요인을 조기에 파악하기 위해 구축된 기반 데이터입니다. 본 데이터는 시설물의 구조적 특성, 현장 상태, 위치 정보, 설치된 센서 유형 등 시설물 안전관리에 필요한 핵심 정보를 종합적으로 제공함으로써, 지자체·관리기관·연구기관이 위험도 평가 및 유지관리 계획을 수립하는 데 활용됩니다.데이터는 외팔보여부, 주소, 노후위험시설물구분, 노후위험시설물명, 시설물상태, 유형, 보행로폭, 위도, 경도, 설치센서타입으로 구성되어 있습니다. 외팔보여부는 시설물이 외팔보 구조를 포함하고 있는지를 나타내어 구조적 취약성 판단에 중요한 정보를 제공합니다. 주소는 시설물의 정확한 위치를 행정구역 단위로 제시하여 현장 점검 및 관리 편의를 높입니다. 노후위험시설물구분과 시설물명은 시설의 종류와 명칭을 구체적으로 나타내며, 데이터 기반 시설물 분류 및 관리대상 식별에 이용됩니다.시설물상태는 노후화 정도, 균열, 처짐, 변형 등 시설물의 현장을 평가한 상태 정보를 포함하여 위험도 판단에 핵심적인 요소입니다. 유형은 해당 시설물이 어떤 구조적·기능적 특성을 지니는지 분류하며, 보행로폭은 시설물을 이용하는 시민의 안전성과 관련된 물리적 환경 요소를 제공합니다. 위도와 경도는 정확한 위치 정보를 좌표로 표기하여 GIS 기반의 공간 분석, 위험지역 지도화, 현장 출동 경로 설정 등에 활용할 수 있게 합니다. 설치센서타입은 해당 시설물에 어떤 종류의 안전센서가 부착되어 있는지 나타내며, 변형·기울기·균열·환경 정보 등 모니터링 대상의 범위를 판단하는 데 중요한 데이터입니다.
