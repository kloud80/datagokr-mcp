description_portal: '서울특별시에 설치된 안전비상벨 설치위치 정보입니다.(개방표준 공공데이터)비상벨 위치, 용도, 관리기관, 설치위치정보 등을 제공합니다.※ 안전비상벨 : 여성 1인 가구를 위한 안전장치 패키지로, 휴대용 비상벨 외에도 이중 잠금 장치, 문열림 센서, 디지털 비디오 창 등이 포함,  신청자에 한해 최대 250가구 대상, 무단 침입 시 알려주고 112에 자동 신고하는 기능 포함 ※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.여성 1인 사업장에는 무선 비상벨 설치 가능: 벨을 누르면 CCTV 관제센터, 구청, 경찰과 3자 연결되어 즉시 대응'
