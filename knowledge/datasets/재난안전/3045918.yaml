limits: 강서구 한 구만 다루는 시군구 범위 자료이므로 부산 전체나 전국 비교에는 다른 구·시군 자료를 따로 모아야 한다. 좌표와 표준 코드가 없어 지도 표시나 자동 조인을 하려면 주소를 지오코딩하거나 이름을 매핑해야 한다.
