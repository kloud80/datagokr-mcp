description_portal: 관할서에 따른 요일별(월, 화, 수, 목, 금, 토, 일) 통계데이터로 , 요일에 따른 사망 및 실종자 수를 나타내는 데이터이다.연안에서 발생한 안전사고는 주로 해수욕장, 해안가, 해양 등에서의 물놀이 중 익수하거나 표류, 항포구, 방파제(테트라포드), 갯바위 등에서 낚시 중 실족 또는 음주로 인한 실족 또는 차량 조작 미숙 등의 원인으로 추락, 갯벌에서 해루질, 관광 중 물때 미인지로 인한 고립 등의 사고가 대부분 입니다.사고의 원인으로는 구명조끼 미착용, 음주 상태로 활동하는 등 활동객 부주의에 기인하여 사고가 발생하고 있습니다.
