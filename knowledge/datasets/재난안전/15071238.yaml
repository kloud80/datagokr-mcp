summary_user: 부산광역시 남구에 지정된 자연재해위험개선지구를 지구별로 한 줄씩 담은 소규모 파일(csv 724바이트)로, 지구명·유형·위험등급·대상 시설명·지정일자·해지일자·추진사항을 담는다. 남구 주민이나 부동산·개발 사업자가 '우리 동네나 사업 부지 근처에 재해위험개선지구가 있고, 현재도 지정 중인가 아니면 해지됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지구명·시설명 같은 이름을 맞추거나 시도·시군구 명칭으로만 연결하며, 다른 시군구의 같은 현황 파일과 합쳐 지역별 비교에 쓴다.
limits: 좌표나 경계 정보가 없는 비공간 목록이라 지도 위에 위험지구 범위를 바로 그리거나 토지 규제 레이어와 겹쳐 보는 용도로는 부족하다. 공통 코드 키가 없어 다른 데이터와는 이름 매칭에 의존해야 한다. 명세상 연간·이벤트성 갱신으로 되어 있어 최근 지정·해지 변동이 반영되지 않았을 수 있다.
