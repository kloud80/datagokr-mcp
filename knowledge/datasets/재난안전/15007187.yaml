summary_user: 전라남도경찰청에 접수된 112 긴급신고 건수를 연도·월별로 묶어 중요범죄·일반범죄·질서유지·교통·재해재난·기타업무 유형별로 나눈 집계 파일이며, 포털 설명상 2022~2025년을 다루고 파일 크기는 약 2KB(csv)이다. 전남 지역 치안 수요를 보는 분석가나 정책 담당자가 '어느 달에 어떤 유형의 112신고가 몰리는가'를 비교하는 데 쓴다. 실측 컬럼에 지역코드 같은 전역 조인 키가 없어 다른 시도청의 112신고 현황이나 범죄 발생 통계와는 연도·월 기준으로 이름을 맞춰 나란히 놓는 방식으로만 이어 쓴다.
limits: 시군구·경찰서 단위 구분이나 건별 신고 내역은 없고 전남 전체 월별 합계만 담으므로 지역 내 비교나 위치 분석에는 쓰지 못한다. 경찰 통계는 대검찰청 처리 통계와 집계 기준이 달라 직접 비교할 때 주의한다.
