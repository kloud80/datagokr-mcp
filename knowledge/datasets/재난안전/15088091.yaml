summary_user: 함안소방서 소속 부서(119안전센터 등)별로 주소, 관할 면적(제곱킬로미터), 인구수, 세대수, 본서와의 거리, 관할구역, 위도·경도(WGS84)를 한 행씩 담은 소규모 파일(csv 741바이트)이다. 함안군 주민이나 분석가가 '우리 동네는 어느 안전센터 관할이고 본서에서 얼마나 떨어져 있는가', '센터별 담당 인구·면적 부담이 어떻게 다른가'를 확인하는 데 쓴다. 전역 조인 키는 없어 관할구역의 읍·면 이름이나 위도·경도 좌표로 화재 발생 건별 자료나 소방용수 위치 자료와 맞춰 이어 쓴다.
description_portal: 함안소방서 부서별 관할현황을 부서명, 주소, 관할 면적, 인구, 세대수, 본서와 거리, 관할구역, 위도, 경도 항목으로 제공합니다.* 거리항목은 함안소방서와 부서간 거리이며, 위도 경도는 WGS84 GPS 좌표계 정보를 제공하고 있습니다.
