description_portal: 산업현장에서 발생할 수 있는 안전사고와 산업재해, 특히 중대산업재해를 예방하기 위해서는 사전에 위험요소를 발견하고 대응하는 사고예방 중심의 접근이 필수적입니다.서울시설공단은 각 사업장에서 수집된 총 280건의 아차사고(Near-Miss) 데이터를 체계적으로 정리하고 분석하였으며, 이는 작업장안전 확보와 재난사고 대응력 강화를 위한 사고사례 데이터로 공개됩니다.이러한 사례는 잠재 위험요소를 파악하는 데 효과적이며, 반복 가능성이 높은 사고 유형을 선제적으로 관리하는 기반이 됩니다.수집된 데이터는 위험성평가와 안전관리 개선을 위한 자료로 활용될 수 있으며, 사고사례 분석을 통해 유사사례 전파, 예방교육 자료 제작, 작업현장 리스크 관리 등 실질적인 재해예방 활동에 기여할 수 있습니다.아차사고란 현장 작업자의 부주의, 설비 결함, 작업환경 요인 등으로 인해 실제 사고로 이어질 수 있었던 상황이었으나, 결과적으로 피해 없이 종료된 사례를 의미합니다.
