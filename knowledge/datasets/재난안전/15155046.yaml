summary_user: 전국 자치단체가 관리하는 안전비상벨을 한 곳씩 기록한 건별 위치 데이터로, 전체 88,634건에 설치목적·설치장소 유형·주소·위경도와 경찰·경비업체·관리사무소 연계 여부, 최종 점검 정보, 관리기관 정보를 담는다. 시민이나 지자체 담당자, 분석가가 "우리 동네 어디에 안전비상벨이 있고 경찰과 연계되어 있나" 같은 질문에 쓴다. 지번주소·도로명주소와 WGS84 위도(경도 포함) 좌표로 CCTV, 안심지킴이집 같은 다른 방범·생활안전 시설 데이터나 지도와 이어 쓴다.
description_portal: '안전비상벨위치정보 데이터는 도시재정비 촉진을 위한 특별법 등에 따라 범죄예방대첵의 일환으로 설치되는 안전비상벨에 대한 데이터로 설치목적, 설치장소 유형 및 위치, 소재지 주소와 위·경도 기반 위치 정보 등 기본 정보와 경찰·경비업체·관리사무소 연계 유무와 부가기능, 점검 이력, 관리기관명·연락처 등 관리 정보를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 안전비상벨위치정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 안전비상벨위치정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 국토교통부 주택정비과 / 044-201-3391 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
