summary_user: 전국 승강기의 건물명·주소·승강기종류·호기·최종검사일자·최종검사결과·유효기간을 승강기 한 대 단위로 담은 검사 현황 파일이며, 검증 수신 866,491행에 기간은 1993-06-07~2027-01-24이다. 관리주체나 건물 이용자, 안전 분석가가 특정 건물 승강기의 최종 검사 결과와 유효기간이 어떻게 되는지 확인하는 데 쓴다. 주소(address)가 실측 조인 키이므로 같은 주소 기준의 다른 시설 안전 자료와 이어 쓰며, 승강기 고유번호 같은 별도 키는 필드 목록에 없다.
description_portal: 해당 자료는 「승강기 안전관리법」제28조(승강기의 설치검사) 및 같은 법 제32조(승강기의 안전검사)에 따른 승강기 검사현황 자료이며,데이터에는 건물명, 주소, 승강기종류, 호기, 최종검사일자, 최종검사결과, 유효기간 등이 포함되어 있음.자료의 기준일은 2024년12월31일이며, 출처는 한국승강기안전공단임.※ 승강기법에 따라 승강기 제조·수입업자는 설치를 끝낸 승강기에 대하여 설치검사를 받아야 하며, 관리주체는 승강기에 대하여 안전검사(정기검사, 수시검사, 정밀안전검사)를 받아야 함.
