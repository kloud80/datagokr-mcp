description_portal: 전국 17개 시도 재난심리회복지원 센터 현황입니다. 산불, 화재, 풍수해 등 각종 자연 및 사회재난으로 심리적 충격을 받은 재난경험자라면 누구나 상담을 받을 수 있습니다. 우리가 살아가며 경험하는 크고 작은 재난으로 발생한 심리적 충격을 완화하고 재난을 경험하기 전 일상으로 빠르게 복귀하실 수 있도록 심리적 응급처치, 심리상담 등 재난심리회복지원  서비스를 제공하고 있습니다. 재난심리회복지원센터 상담비용은 무료이며,  공통 전화번호는 1670-9512 입니다. 재난경험자라면 누구나 17개 시도 센터에서 유선 또는 방문 상담이 가능합니다,
