description_portal: '행정동별 지정된 비상대피시설의 명칭, 주소, 형태, 규모, 수용 가능 인원 등을 수록한 데이터.재난·재해 발생 시 주민의 안전한 대피를 지원하기 위한 시설 현황을 파악하고, 방재 정책 수립, 위기 대응 계획 마련, 지역 안전망 강화 등에 활용 가능하다.활용 목적 및 특징– 행정동별 비상대피시설 분포 및 시설형태 분석– 시설 규모(㎡) 및 수용 인원 기반 활용도 평가– 주민 안전 확보 및 재난 대응 행정 자료 활용– 위기 대응 체계 강화 및 지역 방재 정책 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 행정동: 시설이 위치한 행정동 명칭● 시설명: 등록된 비상대피시설의 명칭● 주소: 시설의 도로명 주소● 시설형태: 건축물, 지하공간 등 대피시설의 형태 구분● 규모(㎡): 시설의 면적(제곱미터 단위)● 대피인원(명): 수용 가능한 대피 인원 수'
