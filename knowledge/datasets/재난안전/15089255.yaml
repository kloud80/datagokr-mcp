summary_user: 인천광역시 부평구의 비상대피시설을 시설 한 곳당 한 행으로 담은 CSV 파일(약 11.7KB)로, 행정동·시설명·도로명 주소·시설형태(건축물, 지하공간 등)·면적(㎡)·수용 가능 대피인원을 기록한다. 부평구 주민이 '우리 동네 비상시 대피할 곳이 어디이고 몇 명까지 들어가나'를 확인하거나, 분석가가 행정동별 대피시설 수용인원이 인구에 비해 충분한지 따져보는 데 쓴다. 전역 조인 키나 좌표가 없어 행정동 이름이나 도로명 주소를 매개로 다른 대피·구호시설 데이터나 행정동별 인구 통계와 맞춰 써야 한다.
