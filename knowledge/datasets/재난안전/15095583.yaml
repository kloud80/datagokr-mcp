summary_user: 울산광역시 울주군의 방사능 비상 시 치안 유지·교통 통제·주민 대피 유도를 맡는 울주경찰서, 지구대, 파출소, 치안센터의 위치와 대응 거점 정보를 담은 API이며, 범위는 울주군 한 시군구로 필지·건물 단위 위치를 다룬다. 원전 사고 대비 계획을 세우는 방재 담당자나 분석가가 "사고 지점에서 가장 가까운 경찰 거점은 어디이고 주요 통제 지점까지 얼마나 빨리 닿는가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 기관의 교통통제소·출입통제소 등 다른 방사능 방재정보 데이터와는 시설 이름이나 주소를 맞춰 이어 써야 한다.
limits: 이벤트 때 만들어진 뒤 바뀌지 않는 데이터로 분류돼 있어 경찰 관서의 신설·이전이 수시로 반영된다고 보기 어렵다. 행정코드 같은 공통 키가 없어 다른 데이터와 자동으로 결합하기 어렵다. 개발계정은 하루 1,000회 호출로 제한된다.
