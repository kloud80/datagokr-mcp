description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 경찰서 조회 서비스는 방사능 비상 상황 시 치안 유지, 교통 통제, 주민 대피 유도 등을 수행하는 경찰 관서의 위치와 대응 거점 정보를 제공하는 데이터입니다.방사능 사고 시 혼란을 방지하고 주민들의 질서 있는 대피를 돕는 울주경찰서, 지구대, 파출소 및 치안센터의 위치 정보를 포함합니다.앞서 살펴본 '교통통제소'나 '출입통제소'에 실제 인력을 배치하고 운영하는 주체들의 물리적 거점을 나타냅니다.원전 사고 지점으로부터 경찰력이 얼마나 신속하게 주요 통제 지점에 도달할 수 있는지 분석하는 기초가 될 수 있습니다.
