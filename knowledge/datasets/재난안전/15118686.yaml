description_portal: 충청남도 천안시 자연재해 현황 데이터는 지역에서 발생한 각종 자연재해로 인한 피해 상황을 체계적으로 파악하기 위해 구축된 자료입니다. 시도, 시군구, 피해종류, 피해요인, 주거형태, 주택전-반파 피해면적, 기준년도 등이 표현된 데이터입니다. 시도와 시군구는 피해 발생 지역을 구분하는 기본 정보이며, 피해종류와 피해요인은 재해 유형을 파악할 수 있습니다. 주택 전·반파 피해면적은 재해로 인한 직접적 건물 피해의 규모를 면적 단위를 산정할 수 있습니다. 본 데이터는 재난대응 정책 수립, 취약지역 분석, 피해복구 계획 마련 등 다양한 재난·안전 행정 업무에 활용될 수 있는 데이터 입니다.
