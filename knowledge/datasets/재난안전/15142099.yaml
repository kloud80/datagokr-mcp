summary_user: 재난안전데이터 공유플랫폼에서 제공하는 구호기금 배정 정보로, 연도·지역코드별 배정금액과 비고, 데이터 유효구분, 등록·수정 일시를 담으며 범위는 전국이다. 분석가나 지자체 담당자가 '어느 지역에 어느 해 구호기금이 얼마 배정됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역코드(RGN_CD)를 이름·코드 매핑으로 맞추거나 같은 기관 코드로만 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 구호기금배정 정보로, 연도, 지역코드, 배정금액, 비고, 데이터유효구분코드 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
