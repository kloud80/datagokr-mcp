description_portal: 경상남도 김해시청에서 운영하고 있는 공용 수방자재함에 대한 데이터로 연번, 명칭, 주소, 상세위치, 보관물품, 설치년월, 위도, 경도, 관리부서, 데이터기준일의 항목으로 구성되어 있습니다.김해시의 공용 수방자재함은 2025년 6월에 여름철 수해예방을 목적으로 전국 최초로 설치되었습니다.공용 수방자재함에는 갈퀴, 각삽, 라바콘, 모래마대, 집게 등 수해 대응에 필요한 물품이 보관되어 있습니다.누구나 수해예방을 위해 사용할 수 있으며 사용 후 다시 넣어두시면 됩니다.장유지역에 설치된 함은 장유출장소 도시관리과(055-350-1921)에서 관리하며 그 외 지역은 김해시청 도로과(055-330-3851)에서 관리하고 있습니다.
