summary_user: 대전광역시 서구에서 지진 발생 시 주민을 수용하는 실내구호소를 시설 한 곳당 한 행으로 담은 원장으로, 시설구분·시설명·지번/도로명주소·수용가능면적·연락처·위도·경도를 포함한다(CSV 약 5KB). 서구 주민이나 재난 담당자가 '우리 동네에서 지진 때 들어갈 실내구호소는 어디이고 얼마나 넓은가'를 확인하거나 구호소 배치의 적정성을 따질 때 쓴다. 법정동코드(bjd_cd)로 다른 동 단위 통계·시설 데이터와 잇고, 행정동코드와 위도·경도로 인구 자료나 지진 옥외대피장소 등 다른 대피·구호시설 데이터와 지도 위에서 겹쳐 본다.
description_portal: 대전광역시 서구 지진실내구호소 현황 데이터는 지진 등 재난 발생 시 주민을 긴급하게 수용할 수 있는 실내구호소의 구조와 위치 정보를 체계적으로 제공하는 안전·재난관리 기반자료입니다. 이 데이터에는 각 구호소를 구분하는 순번, 구호소의 성격을 나타내는 시설구분명, 실제 이용 가능한 장소를 의미하는 시설명이 포함되어 있습니다.위치 정보는 지번주소와 도로명주소, 그리고 행정구역을 식별하는 행정동코드·행정동명, 법정동코드·법정동명으로 구성되어 있어 재난 대응 시 현장 접근성을 빠르게 확보할 수 있습니다.또한 구호소의 규모를 판단할 수 있는 수용가능면적 및 단위, 연락이 필요한 경우 사용되는 연락처, 지도와 연동되는 위도·경도 좌표가 제공됩니다. 마지막으로 데이터기준일자를 통해 자료의 최신성을 확인할 수 있습니다.이 데이터는 지진 대응 계획 수립, 구호소 배치의 적정성 평가, 취약지역 분석, 재난 시 신속한 주민대피 전략 마련 등 다양한 행정·안전 분야에서 핵심적으로 활용됩니다.
