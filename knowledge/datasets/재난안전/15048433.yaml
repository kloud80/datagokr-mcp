description_portal: 이 통계는 2024년 전국 시도별 화약류 관리 및 제조 보안책임자 면허 발급 현황을 나타낸다. 화약류관리 면허의 경우, 경기도남부(297명)와 서울(269명), 강원(269명), 전북(218명) 지역에서 발급 인원이 많았다. 반면 울산(19명), 제주(20명), 세종(23명)은 적은 수치를 보였다. 화약류제조 면허는 서울(13명)과 강원(14명), 전북(26명) 지역에서 상대적으로 많았지만, 인천, 광주, 경기북부 등 6개 지역에서는 발급 인원이 없는 것으로 나타났다. 화약류 보안책임자 3급 이하 면허는 충남에서 유일하게 1건이 발급되었다. 전반적으로 화약류 관련 면허는 지역별 산업 특성에 따라 발급 인원에 큰 차이가 있었다.
