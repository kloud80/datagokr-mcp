summary_user: 증평군 관내에 설치된 폭염 그늘막을 한 곳씩 담은 건별 시설 목록으로, 설치장소명·도로명/지번 주소·위도·경도와 그늘막 유형, 설치년도, 높이·펼침지름, 관리기관 연락처를 포함한다(CSV 파일, 약 10KB). 주민이나 지자체 담당자가 '여름철 정류장·교차로 주변에서 가장 가까운 그늘막은 어디인가', '폭염 취약 보행 구간에 그늘막이 부족한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 위도·경도나 주소를 기준으로 무더위쉼터·버스정류장 등 다른 위치 데이터와 공간적으로 겹쳐 쓰거나, 시군구명으로 같은 지역의 다른 증평군 데이터와 맞춘다.
description_portal: 충청북도 증평군 폭염그늘막 현황 데이터는 기후변화에 따라 폭염일수가 증가하고, 고령층 및 도보 이용 시민의 온열질환 예방 대책이 요구됨에 따라,증평군이 관내에 설치한 공공형 그늘막 시설의 종류, 위치, 규격 등의 운영현황을 정리한 공공안전 기반 데이터입니다.본 데이터는 공정형 그늘막, 스마트 그늘막, 차양형 시설물 등 설치 유형을 구분하여 수록하고 있으며,그늘막의 설치 위치(정류장·교차로 등), 번호, 크기(지름), 읍·면 구분 정보를 포함하고 있어,도심 보행자 열환경 개선, 폭염 취약지역 관리, 기후적응형 도시정책 수립 등 다양한 활용이 가능합니다.
