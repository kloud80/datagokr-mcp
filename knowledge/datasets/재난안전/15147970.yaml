description_portal: 경기도 성남시 내 도로 교통질서 확보와 법규 준수를 위해 설치된 주행차량번호인식 CCTV 현황을 체계적으로 기록한 자료입니다. 각 항목은 연번으로 구분되며, 관리번호는 장비별 고유 식별 값으로 행정적 관리와 유지보수에 활용됩니다. 시·구 정보와 함께 설치위치가 제공되어 지역별 분포를 구체적으로 확인할 수 있으며, 설치일자는 장비가 실제 운영되기 시작한 시점을 나타냅니다. 또한 카메라대수는 단일 위치에서 운용되는 장비의 규모를 보여주고, 위도·경도 좌표가 포함되어 있어 지도 기반 시각화와 공간분석이 가능합니다. 마지막으로 데이터기준일자가 수록되어 있어 자료의 최신성을 확인할 수 있으며, 이 데이터를 통해 성남시는 교통법규 위반 차량 단속, 실시간 교통관리, 안전한 도로환경 조성 등 다양한 행정 목적에 활용할 수 있습니다.
