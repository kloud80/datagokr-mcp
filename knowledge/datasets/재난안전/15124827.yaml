summary_user: 한국동서발전 발전소 계측소에서 감시한 지진 기록을 지진번호별로 담으며, 규모·진원시·계측소 명·전송 상태를 건별로 제공한다. 발전소 인근에서 언제 어느 규모의 지진이 계측됐는지, 계측소 자료가 정상 전송됐는지를 확인하려는 재난안전 분석가나 연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지진 자료와는 진원시·규모 같은 값이나 계측소 이름 매핑으로만 맞춰 이어 쓴다.
limits: 표준 지역코드나 좌표가 없는 비공간 자료라 지도·행정구역 단위 분석에 바로 쓰기 어렵다. 이벤트 단위로 생성된 뒤 바뀌지 않는 자료로 분류돼 있어 실시간 감시 신호로 보지 말고, 개발계정은 하루 10,000회 호출 제한이 있다.
