description_portal: 경찰청 교통기획과 통계에 따르면, 고령운전자 운전면허 자진반납 건수는 매년 큰 폭으로 증가하고 있습니다. 2015년 전국 1,906건에서 2024년 6월 기준 25만 6,654건으로 약 134배 급증했습니다.지역별로는 2024년 상반기 기준, 경기남부가 39,219건으로 가장 많았고, 서울이 25,443건, 경북이 7,946건으로 그 뒤를 이었습니다. 2024년 6월 전국 총 반납 건수는 이미 2023년 연간 총 반납 건수인 26만 654건에 육박하는 25만 6,654건을 기록하며, 고령 운전자의 안전 의식이 크게 향상되고 있음을 보여줍니다. 특히, 2020년 65세 이상에서 2022년부터 65세/전체 집계로 세분화된 후에도 증가세는 유지되고 있습니다.
