summary_user: 재난안전데이터 공유플랫폼이 제공하는 연합뉴스 기사를 건별로 담으며, 기사번호·제목·본문·작성자·부서·등록일자와 노출·알림·삭제 여부를 함께 담는다(범위 전국, 비공간). 재난·안전 상황 분석가나 관제 담당자가 "최근 특정 재난이나 사고에 대해 어떤 보도가 나왔는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기사 날짜나 제목·본문 속 지명·재난명 같은 이름 매칭으로만 이어 쓰며, 같은 영역의 재난 특보·위험지역 데이터와 시점을 맞춰 보는 방식이 현실적이다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 연합뉴스 데이터 정보로, 연합뉴스번호, 연합뉴스제목, 연합뉴스내용, 연합뉴스일자, 연합뉴스작성자명, 생성일시를 제공하고 있습니다. 데이터의 갱신주기는 5분입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
