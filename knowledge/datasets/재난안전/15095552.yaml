summary_user: 울산광역시 울주군의 방사능 방재 대상 생활기반시설(경로당·약국·보건소·병원·어린이집·유치원·소방서·경찰서 등)의 주소와 공간정보를 읍·면·동, 시설 구분, 16방위 기준으로 조회하는 시군구 범위의 건별 시설 API입니다. 방사능 사고 대비 계획을 세우는 방재 담당자나 분석가가 '원전에서 특정 방위 쪽 읍·면에 있는 노인·아동 시설과 의료시설은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시설명·주소 등 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
