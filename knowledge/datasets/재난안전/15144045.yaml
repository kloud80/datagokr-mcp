description_portal: 부산광역시 연제구에서 운영 중인 무더위쉼터 데이터로 해당동, 쉼터명, 운영시간, 주소, 지도 등의 정보를 포함하고 있습니다.무더위쉼터는 폭염 기간 동안 더위에 취약한 시민들이 더위를 피하고 휴식을 취할 수 있도록 지정된 장소를 말합니다. 주로 경로당, 동행정복지센터, 복지관, 새마을금고, 도서관  등 냉방 시설이 갖춰진 공공시설을 무더위쉼터로 지정하여 운영하고 있습니다.특별한 자격 조건없이 누구나 이용 가능하며, 특히 노인, 어린이, 저소득층 등 더위에 취약한 시민들에게  유용한 시설입니다.
