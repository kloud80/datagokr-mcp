description_portal: 해당 데이터는 2019년도에 소방청이 전국적으로 보유·운영 중인 장비와 시설의 현황을 집계해 제공하는 데이터입니다. 이 자료에는 시‧도별로 소방관서가 보유하고 있는 소방펌프차, 사다리차, 구조차, 구급차 등 차량 장비 현황을 나타내는 자료로서 각 지자체별 소방 장비인 소방펌프차, 사다리차, 구조차, 구급차, 구조정, 화학차, 조연차, 지휘차량 의 수량을 제공 함으로써  각 본부별로 어떤 차량이 많은지, 적은지 운영 현황을 알 수 있습니다. 이를 바탕으로 각 본부별 지역 간 장비·시설 배치 격차를 파악하고, 부족한 자원의 보강 필요성을 분석할 수 있는 기초자료로 볼 수 있습니다.
