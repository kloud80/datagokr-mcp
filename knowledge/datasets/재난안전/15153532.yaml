summary_user: 전국 지하철 역 단위로 노선·역 코드와 이름, 불법촬영(성범죄) 위험도 등급을 담은 데이터이며, 범위는 전국이고 좌표 없는 비공간 자료다. 시민이 출퇴근길 역의 불법촬영 위험 수준을 확인하거나, 분석가·지자체가 위험도가 높은 역을 골라 순찰·안전시설 배치 우선순위를 정하는 데 쓴다. 전역 조인 키는 확인되지 않아, 다른 지하철 역 정보나 같은 기관의 생활안전지도 데이터와는 노선·역 이름 또는 노선·역 코드(RTE_CD, STATION_CD) 매핑으로만 잇는다.
