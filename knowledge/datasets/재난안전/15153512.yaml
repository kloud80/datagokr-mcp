summary_user: 지진해일 발생 시 지역별 주민 대피 장소로 지정된 대피소의 영역(공간 형상) 정보를 대피소 단위로 담은 전국 범위 데이터로, 시설물 관리번호·지역·영역 형상(GEOM) 등을 포함한다. 해안 지역 주민이나 지자체·방재 분석가가 '우리 지역의 지진해일 대피소는 어디이고 그 영역은 어디까지인가'를 확인하거나 대피 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명(RGN) 같은 이름 매핑이나 같은 기관 시설물 관리번호로만 연결하며, 영역 형상을 이용해 다른 재해위험지구·토지 규제 레이어와 공간적으로 겹쳐 볼 수 있다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지진해일 발생시 지역별 주민 대피 장소로 지정된 장소 위치 정보입니다.\""
