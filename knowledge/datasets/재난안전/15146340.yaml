description_portal: '○ 통계개요* 통계명 : 장소별 화재발생(동별)* 통계종류 : 서울시 각 동별 화재발생 건수를 발생장소별로 제공하는 일반ㆍ보고통계* 작성목적 : 화재발생 건수를 주거, 비주거, 임야 등 장소별 정보(동별)를 제공하여사고 방지 및 대응 등 효과적 관리를 위한 기초 자료를 제공하는 것을목적으로 함* 조사체계 : 소방서 → 서울소방재난본부 재난대응과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 소방서내용 - 화재발생 장소(주거, 비주거, 임야 등)별 화재발생 건수 등○ 용어설명* 임야화재 : 숲이나 초지, 덤불, 툰드라 등 개간되지 않은 자연상태의 대지에서발생한 화재. 그러나 숲지대에서 발생한 화재의 경우에는 그 구성 관목의 종류에관계 없이 모두 임야화재로 봄○ 기타* 국가화재분류체계(2007.1.1)변경. 쓰레기소각, 음식물조리, 빨래삼기, 전기스파크 등오인처리를 화재로 분류'
