summary_user: 구미시 관내 기계설비 성능점검 대상 건축물을 건물 단위로 한 줄씩 나열한 목록으로, 시군구·법정동·대지구분·본번·부번으로 된 지번 주소와 주용도, 연면적(또는 세대수)을 담은 약 16KB 크기의 CSV 파일이다. 건축물 관리자나 설비 점검 사업자가 '내 건물 또는 이 동네 건물이 기계설비 성능점검 대상인가, 어떤 용도·규모 건물이 많은가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 건축물대장 등 다른 데이터와는 법정동명·본번·부번으로 지번을 맞춰 붙이는 방식으로만 이을 수 있다.
description_portal: 이 데이터는 경상북도 구미시 관내에 위치한 기계설비 성능점검 대상 건축물 현황을 담고 있는 공공데이터입니다. 자료에는 각 건축물의 주소, 용도, 그리고 연면적 등의 상세 정보가 포함되어 있어, 점검 대상 건축물의 위치와 규모, 용도별 특성을 체계적으로 파악할 수 있습니다. 이를 통해 건축물별 기계설비의 성능 점검 필요성을 정확히 진단하고, 효율적인 점검 일정과 자원 배분을 계획할 수 있습니다. 이 데이터는 건축물 기계설비의 안전 관리, 정기적인 성능 점검 계획 수립, 안전사고 예방, 그리고 건축물 유지관리 정책 개발에 폭넓게 활용되며, 구미시의 건축물 안전 강화와 시민 보호를 위한 중요한 기초 자료로서 행정 및 현장 업무에 필수적인 역할을 수행합니다. 아울러 관련 법규 준수 여부 점검과 건축물의 장기적 안전성 확보에도 기여하여, 지역사회의 지속 가능한 발전과 공공 안전 증진에 이바지합니다.
