summary_user: 경상남도 소재 다중이용업소 가운데 안전관리 우수업소로 공표된 곳을 업소 한 곳당 한 행으로 담은 파일이며, 업종·업소명·관할 시군·주소·화재배상책임보험 일련번호·안전시설 설치내역·공표일자·신규/갱신 구분이 들어 있다(포털 설명 기준 2025년, 33건). 경남 주민이나 분석가가 "우리 시군에서 안전관리 우수업소로 공표된 노래방·PC방 등 다중이용업소는 어디이고 어떤 안전시설을 갖췄는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(경상남도) 자료의 관할 시군 이름으로만 이어 쓴다.
description_portal: (데이터 수집목적 및 과정) 경상남도 다중이용업소 안전관리 우수업소 데이터는 2025년 기준 경상남도 소재 다중이용업소 중 안전관리 우수업소에 대한 정보입니다. 다중이용업소의 안전관리에 관한 특별법 제21조에 의거합니다. (데이터 구성 및 세부항목) 데이터는 업종, 업소명, 화재배상책임보험 일련번호, 관할시군, 주소, 안전시설 설치내역 등으로 구성합니다. 총 33건입니다. 미집계데이터는 공란처리합니다.(데이터 현행화 시기) 해당 데이터는 연간 현행화 합니다. 차기 업데이터 예정일은 2026년 9월입니다.
