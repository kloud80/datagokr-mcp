description_portal: '서울특별시 마포구 비상급수시설 현황에 대한 정보입니다. 이 데이터에는 각 비상급수시설이 위치한 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 실제 위치를 나타내는 도로명 주소 및 행정동과 설치장소(예: 공원, 고등학교, 초등학교, 놀이터, 배수지, 약수터 대학교, 빌딩 등)이 포함되어 있습니다. 또한, 시설의 구분(예: 정부지원 또는 자치구), 설치년도, 심도(단위:m), 양수량(톤/일),용도(예: 생활용, 음용수, 등)에 대한 세부 정보도 함께 제공됩니다.이 데이터를 통해 지자체는 재난 및 비상 상황에서 필요한 물 공급을 효과적으로 관리하고, 시민들은 비상 시 가까운 급수시설을 쉽게 확인하여 신속하게 물을 공급받을 수 있습니다.'
