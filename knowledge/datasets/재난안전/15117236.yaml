description_portal: 이 데이터는 인천광역시 계양구 관내 지진 옥외대피장소에 대한 현황을 정리한 공공데이터 파일로, 지진 발생 시 주민들이 신속하고 안전하게 대피할 수 있는 공간의 위치와 수용 능력을 파악할 수 있도록 구성되어 있습니다.포함된 주요 항목은 연번, 대피장소명, 주소, 대피가능인원, 면적 등이며, 재난 대응 계획 수립 및 주민 안전 확보를 위한 핵심 기초자료로 활용됩니다.연번은 각 대피장소를 식별하기 위한 고유 번호입니다.대피장소명은 해당 시설이나 공간의 공식 명칭을 나타내며, 대피소로 지정된 학교 운동장, 공원 등일 수 있습니다.주소는 실제 대피장소의 위치를 명확히 확인할 수 있는 정보입니다.대피가능인원은 해당 장소가 수용 가능한 최대 인원 수를 의미하며, 주민 대피 계획 수립 시 중요한 지표가 됩니다.면적은 대피장소의 총 넓이(㎡ 기준)를 나타내어, 공간 규모와 수용능력을 함께 판단할 수 있습니다.이 데이터는 재난관리 및 안전 행정에 활용될 뿐 아니라, 지역 주민들이 평상시에도 대피소 위치를 미리 확인하고 대비할 수 있도록 하는 데 도움을 줍니다. 계양구는 이와 같은 정보를 정기적으로 관리·공개함으로써 지역사회의 안전 역량을 높이고, 신속하고 체계적인 재난 대응 체계 구축에 기여하고자 합니다.
