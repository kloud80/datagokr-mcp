summary_user: 김해동부소방서 관내 소방용수(소화전·급수탑 등 수리) 시설을 한 건씩 담은 위치 원장으로, 관할 센터·관리번호·도로명주소·읍면동·수리형식·설치년도·유지관리 주체·센터와의 거리를 담는다. 소방 실무자나 지역 분석가가 "우리 동네 근처 소화전은 어디 있고 담당 119안전센터에서 얼마나 떨어져 있나" 같은 질문에 쓴다. 전역 조인 키는 없어 도로명주소·읍면동 이름으로 주소 매칭하거나 관서·센터 이름으로 다른 소방 데이터와 맞춰 쓴다.
limits: 표준 코드형 조인 키가 없어 다른 데이터와 연결하려면 주소·이름 매핑이 필요하다. 범위는 김해동부소방서 관내 개별 시설로 한정되어 경상남도 전체나 다른 소방서 관할은 담지 않는다.
