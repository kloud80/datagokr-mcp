summary_user: 안전인증 대상 기계·설비가 있는 사업장 중 인증 주기가 돌아온 곳을 사업장·대상품별로 담은 전국 단위 파일로, 대상품 분류(대·중·소), 검사상태, 책임 기관·지사·노동관서, 이전 검사일자, 이번 검사·합격 정보, 1~3차 안내 여부를 담는다. 안전관리 담당자나 분석가가 "우리 지역·업종에서 안전인증 주기가 돌아왔는데 아직 검사를 받지 않은 사업장과 설비는 무엇인가"를 확인하는 데 쓴다. 사업자등록번호·사업장관리번호·사업장개시번호로 다른 사업장 데이터와 잇고, 대상품 분류(safety_cert_item_clsf)로 안전인증 대상품 목록·인증 현황 데이터와 맞춰 본다.
description_portal: 한국산업안전보건공단 인증원에서 제공하는 안전인증 주기도래 사업장 내역으로사업장에 대한 정보 , 대상품 분류, 검사상태, 책임기관, 이전 검사 일자, 이번 합격 일자 등에 대한 데이터를 제공합니다.*산업안전보건법 제84조(안전인증)① 유해ㆍ위험기계등 중 근로자의 안전 및 보건에 위해(危害)를 미칠 수 있다고 인정되어 대통령령으로 정하는 것(이하 “안전인증대상기계등”이라 한다)을 제조하거나 수입하는 자(고용노동부령으로 정하는 안전인증대상기계등을 설치ㆍ이전하거나 주요 구조 부분을 변경하는 자를 포함한다. 이하 이 조 및 제85조부터 제87조까지의 규정에서 같다)는 안전인증대상기계등이 안전인증기준에 맞는지에 대하여 고용노동부장관이 실시하는 안전인증을 받아야 한다.
