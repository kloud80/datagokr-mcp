summary_user: 전국의 소규모 공공시설을 시설 1건 단위로 담은 원장 데이터로, 지역코드·시설구분·시설명·위험시설 지정 여부와 지정일, 시작·끝 구간의 법정동·도로명 코드, 연장·폭 같은 제원, 수해구역 농경지·건물 수, 관리 기관·담당자 연락처를 포함한다. 지자체 방재 담당자나 분석가가 "우리 지역 소규모 시설 중 위험시설로 지정된 곳은 어디이고 수해 시 영향받는 건물은 몇 동인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 지역코드(RGN_CD)나 구간 법정동코드를 행정구역 코드표와 맞추거나 시설명으로 매핑해 재난 위험지역·대피시설 데이터와 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 소규모 시설 관리 정보로, 지역코드, 시설구분코드, 시설명, 위험시설지정여부, 위험시설지정일자, 수해구역농경지, 수해구역건물수 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
