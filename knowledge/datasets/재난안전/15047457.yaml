summary_user: 광주광역시 북부소방서가 북구 관내에서 화재안전 중점관리대상으로 지정해 관리하는 대형화재취약대상 28개소를 대상별 한 행으로 담은 목록으로, 구분·대상명·도로명주소·면적(제곱미터)·데이터기준일자를 포함한다. 북구 주민이나 안전관리 분석가가 '우리 동네에 소방서가 중점 관리하는 대형 화재취약 건물은 어디이고 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 소방 데이터(화재 발생, 소방용수, 특정소방대상물 등)와는 도로명주소나 대상명을 매칭해 이어 쓴다.
