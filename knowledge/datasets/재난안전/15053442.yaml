summary_user: 국토안전관리원이 관리하는 다중이용건축물 시설물의 수를 종별(행)과 17개 시도(열)로 교차 집계한 통계표로, 건별 원장이 아니라 전국 시도 단위 집계이며 파일 크기는 385바이트 규모의 작은 CSV다. 지역별로 대형 다중이용건축물이 어느 종별로 얼마나 분포하는지 비교하려는 분석가나 지자체 안전 담당자가 '우리 시도에는 어떤 종별 다중이용건축물이 몇 개 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 시도 이름이 열 이름으로 들어 있는 점을 이용해 시도명 매핑으로 인구·면적 등 다른 시도 단위 통계와 이어 쓴다.
limits: 시도 단위 집계표라 개별 건축물이나 시설물 번호 단위의 위치·안전등급·점검 결과는 알 수 없고, 시군구 이하로 세분할 수 없다. 공통 코드가 없어 다른 데이터와 연결하려면 시도 이름을 코드로 직접 맞춰야 한다.
