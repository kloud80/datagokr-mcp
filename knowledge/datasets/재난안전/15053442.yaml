description_portal: 국토안전관리원에서 제공하는 데이터이며 다중이용건축물, 시도별, 종별 통계현황의 CSV형식의 파일데이터를 제공합니다. 25년 12월 31일 기준입니다.지역별 다중이용건축물시설물 통계현왕을 알려드립니다.다중이용건축물은 불특정 다수인이 이용하는 건축물로, 건축법상 바닥면적의 합계가 5,000㎡ 이상인 건축물이나 16층 이상인 건축물을 말하며, 문화집회시설, 종교시설, 판매시설, 운수시설 중 여객용 시설, 종합병원, 관광숙박시설 등 특정 용도에 해당합니다. "다중이용업소"는 이와는 별개로 다중이용업소의 안전관리에 관한 특별법에 따라 화재 등에 대한 안전 관리가 엄격한 시설(PC방, 노래연습장, 영화관 등)을 의미합니다.
