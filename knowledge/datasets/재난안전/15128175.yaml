description_portal: '서울시 자연재해위험 개선지구 행정동별 통계 데이터입니다.○ 용어설명* 자연재해위험 개선지구 지정기준- 침수위험지구 : 하천의 외수범람과 내수배제 불량으로 인한 침수가 발생하여 인명 및건축물ㆍ농경지 등의 피해를 유발하였거나 침수피해가 예상되는 지역- 붕괴위험지구 : 산사태, 절개사면 붕괴, 낙석 등으로 건축물이나 인명피해가 발생한지역 또는 우려되는 지역* 자연재해위험 개선지구 등급분류 기준- 가 등급 : 재해발생시 인명피해 발생우려가 매우 높은 지역- 나 등급 : 재해발생시 건축물(주택, 상가, 공공건축물)의 피해가 발생하였거나 발생할우려가 있는 지역- 다 등급 : 재해발생시 기반시설(공업단지, 철도, 기간도로)의 피해가 발생할 우려가있는 지역, 농경지 침수발생 및 우려지역- 라 등급 : 붕괴 및 침수 등의 우려는 낮으나, 기후변화에 대비하여 지속적으로 관심을갖고 관리할 필요성이 있는 지역'
