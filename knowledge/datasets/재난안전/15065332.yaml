summary_user: 경상남도 18개 소방서별로 펌프차·물탱크차·화학차·고가사다리차·구급차·지휘차·행정차 등 기동장비(소방차량) 보유 대수를 차종별로 집계한 파일 데이터이며, 포털 설명상 2024년 6월 기준입니다(CSV 약 2KB). 지역 안전 분석가나 지자체 담당자가 '우리 지역 관할 소방서에 고가사다리차나 화학차가 몇 대 있는가'처럼 소방서별 장비 배치 차이를 비교하는 데 쓴다. 전역 조인 키는 없어서 관서명(소방서 이름)을 기준으로 화재 발생·119안전센터 등 같은 경상남도 소방 데이터와 이름 매핑으로만 잇는다.
description_portal: <데이터 수집목적 및 과정> 경상남도 소방장비 현황 데이터는 소방장비 중 기동장비(소방차량)에 대한 정보를 제공합니다. 2024년 6월 기준 경상남도 소방차량 현황에 대하여 파악할 때 활용할 수 있습니다.<데이터 구성 및 세부항목> 데이터는 소방관서(18개 소방서)를 기준으로 기동장비(소방차량) 현황을 종류별로 구성됩니다. 해당 링크를 통해 접속하면 데이터를 조회 및 다운로드 하실 수 있습니다.<데이터 현행화 시기> 해당 데이터는 연간 현행화 데이터입니다. 차기 업데이트 예정일은 2025년 7월 입니다.
