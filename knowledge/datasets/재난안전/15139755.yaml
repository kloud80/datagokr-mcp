summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 둔치주차장의 위치 정보를 시설 한 곳씩 담으며, 시도·시군구·읍면동명, 주소와 도로명, 지하 여부, X·Y 좌표 같은 항목이 있다. 지자체 재난 담당자나 분석가가 집중호우 때 침수 위험이 있는 둔치주차장이 우리 지역 어디에 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 시군구코드(SGG_CD)·시군구명 같은 행정구역 이름·코드 매핑이나 좌표를 기준으로 재난 특보·위험지역, 대피시설 데이터와 맞춰 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 둔치주차장 정보로, 주소번호, 시군구코드, 시군구명, 읍면동명, 주소, 도로명코드, 도로명, 지하여부, X좌표, Y좌표 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
