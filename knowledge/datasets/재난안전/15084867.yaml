description_portal: '○ 통계개요* 통계명 : 사회의 가장 주된 불안요인* 통계종류 : 통계청 사회조사보고를 제공하는 지정·조사통계* 작성목적 : 사회적 관심사항, 삶의 질에 관한 사항 등 사회구성원의 주관적 관심사를파악하여 사회개발정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사대상→지방통계청→통계청* 공표주기 : 부정기(2년)* 공표범위 : 지역 - 서울시내용 - 서울시민이 생각하는 사회의 주된 불안요인을 백분율로 제공○ 용어설명* 국가안보 : 전쟁, 북핵문제 등, 자연재해 : 태풍, 홍수, 지진 등,환경오염 : 대기, 수질, 토양, 해양오염 등, 인재 : 화재, 교통사고, 건물붕괴 등,경제적 위험 : 기업파산, 실업 등, 도덕성부족 : 부정부패 등,신종질병 : 신종 바이러스 등, 범죄발생 : 유괴, 살인, 강도, 성폭력 등○ 기타* 조상대상 13세 이상 인구(2010년이전 15세 이상 인구)* 주된 응답임* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 우리 사회의 안전을 위협하는 가장 큰 불안요인은 무엇이라고 생각하십니까?'
