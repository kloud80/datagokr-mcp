summary_user: 전국 승강기의 검사 이력을 검사 1건 단위로 담은 파일 데이터로, 검사일자·검사종류(정기·정밀 등)·검사차수·검사결과(합격·조건부합격 등)·검사기관과 검사 당시 승강기 구분·형식·종류를 담는다. 정책 담당자나 분석가가 '검사종류나 승강기 형식별로 불합격·조건부합격 비율이 어떻게 다른가' 같은 안전 수준 분석에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했고 승강기 고유번호나 주소도 없어, 다른 승강기·시설 데이터와는 승강기 구분·형식 같은 이름·코드 매핑이나 같은 기관 자료로만 느슨하게 잇는다.
description_portal: 본 데이터는 한국승강기안전공단에서 제공하는 승강기 검사 결과로, 2025년 6월까지의 최신 검사 이력을 포함하고 있다. 총 63만여 건의 데이터가 수록되어 있으며, 항목에는 검사일자, 검사종류(정기, 정밀 등), 검사차수, 검사결과(합격, 조건부합격 등), 검사기관, 승강기 구분 및 형식 등이 포함된다. 해당 자료는 승강기 안전관리 평가, 정책 수립, 민간 분석 등에 활용될 수 있으며, 특히 검사 결과에 따른 승강기 안전 수준 분석에 유용하다. 일부 항목은 결측치가 존재하며, "설치수시구분" 항목은 해당되는 항목에만 데이터가 포함되어 있다. 본 데이터는 공공의 안전 확보 및 정보 공개 강화를 목적으로 개방되었으며, 지속적인 품질관리와 갱신을 통해 신뢰성 있는 자료로 제공될 예정이다.
