summary_user: 근로복지공단 산재보상 승인자료를 바탕으로 2022년에 승인된 사고재해자를 한 명씩 담은 개별자료로, 질병 재해자는 빼고 성별·연령대·근속기간·업종 대분류·사업장규모·재해자 구분(사고사망·사고부상 등)·재해유형을 전국 단위로 담는다. 산업안전 분석가나 사업주가 '5인 미만 사업장의 건설업 신입 근로자에게 어떤 유형의 사고가 많은가'처럼 업종·규모·근속별 사고 양상을 교차 집계할 때 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어, 업종 대분류나 사업장규모 같은 구간 이름을 기준으로 다른 산재 통계와 맞춰 이어 쓴다.
description_portal: 근로복지공단의 산재보상 승인자료를 활용하여 발생 연도가 아닌 "승인 연도 기준"으로 산출한 "2022년 사고재해자 개별자료"임. 동 자료에는 전체 재해자 중 질병 재해자를 제외한  사고재해자를 기준으로 작성한 것임 - 2022년도 승인된 사고재해자의 성별, 연령대, 근속기간(6개월미만/6개월~1년미만/.../5년~10년/10년 이상), 업종(산업대분류), 사업장규모(5인 미만, 5인~9인/.../500인~999인/1000인 이상), 재해자구분(사고사망자, 사고부상자, 그외사고사망자), 재해유형 등의 데이터 제공
