description_portal: 한국동서발전의 자동심장충격기(AED) 보유현황 정보 데이터입니다. 이 데이터는 각 사업소별로 설치된 AED의 위치, 수량 및 기타 비고사항을 포함하고 있으며, 항목은 사업소, 보유현황(위치), 보유수량(대), 비고로 구성됩니다. 해당 데이터는 사업장의 응급의료장비 보유 수준을 확인하고, 안전보건 체계 및 근로자 보호 장비의 분포를 파악하는 데 유용합니다. 학계 및 연구기관에서는 공공기관 내 응급대응 인프라 분석, 산업안전보건 확보 수준 연구, AED 보급과 인명구조율 상관관계 분석, 공공기관별 응급의료 대응 격차 연구 등에 활용할 수 있습니다. 또한 국가 재난대응 및 공공보건 정책 수립의 기초자료로도 활용 가치가 큽니다.
