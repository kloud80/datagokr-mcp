description_portal: CSV 파일에는  2018년 7월 이후로부터의 한국가스기술공사의 주요수상 및 인증내용이 정리되어 있습니다.인증내용으로는 주로 ISO 및 KOSHA-MS(안전보건경영시스템), 재해경감 우수기업, 품질인증, 수소전주기 센터의 공인시험기관 인증 등이 있습니다주요수상내용으로는 안전경영, 품질, 환경, 에너지 분야 등에서의 수상 내역, 국가품질경영대회 수상 내역 등이 있습니다. 최근 2025년 수상 분야로는 사회공헌, ESG경영분야입니다.기관은 인증과 관련하여 직원 누구나 접근할 수 있도록 사내 인트라넷 품질경영의 인증서 메뉴를 활용하여 등록 및 관리하고 있습니다. 인증서 원본을 첨부하고 인증서 발급일, 유효기간 등의 카테고리를 두고 담당자가 상시 모니터링하여 공개 데이터의 체계적인 관리 역량과 신뢰성 을 강화하고 있습니다.
