summary_user: 해양경찰청이 2017~2023년 전국 연안사고를 사고 건별로 기록한 파일로, 지방청·해경서, 발생일자·요일, 사고유형 세분류, 장소유형, 발생지역, 1차 사고원인, 위험구역 지정 여부를 담는다. 안전 분석가나 지자체 담당자가 "어느 해경서 관할에서 어떤 장소·원인의 연안사고가 자주 나고, 위험구역으로 지정된 곳에서 얼마나 발생하는가"를 따질 때 쓴다. 해경서명(kcg_station_nm)이 실측 조인 키여서 해경 파출소·인명구조함 위치나 수상레저 금지구역 같은 해경서 단위 자료와 이어 쓴다.
