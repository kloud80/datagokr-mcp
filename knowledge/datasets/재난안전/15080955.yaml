summary_user: 울산소방본부가 2020년 화학물질 관련 긴급구조 출동을 건별로 기록한 CSV 파일(약 28만 바이트)로, 등록일, 화학물질 한글·영문명과 CAS 등록번호, 발생 주소(시도·구군·동·도로명), 긴급구조 종별·분류·규모, 상황종료일시, 관할 소방서·센터를 담는다. 분석가나 지자체 안전 담당자가 "울산에서 어떤 화학물질 사고가 어느 동네에서 어떤 규모로 났고 어느 센터가 관할했는가"를 따질 때 쓴다. 전역 조인 키는 없어서, CAS 등록번호로 화학물질 정보와, 주소·관할서명으로 다른 소방 데이터와 이름 기준으로 맞춰 잇는다.
limits: 표준 조인 키가 없어 다른 데이터와는 화학물질명·CAS 번호·주소·소방서명을 직접 맞춰야 한다. 범위 메타데이터는 전국·읍면동으로 적혀 있지만, 제목과 설명은 울산 2020년 자료이므로 다른 지역이나 연도의 현황으로 확대 해석하지 않는다.
