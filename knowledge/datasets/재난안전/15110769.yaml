summary_user: 충주시 재난위험요인DB 가운데 다중이용시설·교육기관·종교시설·산업시설 등 사람이 많이 모이는 시설을 시설 단위로 골라 주소·좌표와 위험도 점수·등급을 붙인 데이터로, 범위는 충주시 한 곳입니다. 지자체 방재 담당자나 분석가가 "충주시에서 재난 시 인명피해 우려가 큰 시설은 어디이고, 피난계획·시설보강을 어디부터 해야 하나"를 따질 때 쓴다. 응답은 위치 정보가 담긴 지형 객체 형식(type·properties·geometry)이고 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 주소·읍면동 이름 매칭이나 좌표 기반 공간 결합으로만 잇는다.
limits: 전역 조인 키가 없어 건축물대장 등 다른 원장과 바로 연결되지 않고 이름·주소·좌표로 맞춰야 한다. 한 번 구축된 뒤 바뀌지 않는 이벤트성 데이터로 보이므로 현재 시설 이용 현황이나 최신 위험 수준을 그대로 보여준다고 보기 어렵고, 충주시 밖은 담지 않는다.
