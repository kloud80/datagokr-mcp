description_portal: '본 데이터는 2022년 공공데이터 기업매칭 지원사업을 통해 구축된 충청북도 충주시 재난위험요인DB 중 ‘대규모 인명피해 위험시설’ 관련 정보입니다.주요 항목으로는 관리번호, 읍면동, 주소, 위도 및 경도 좌표, 위험도 점수, 등급 등이 포함되어 있으며,지역 내 다중이용시설, 복합건축물, 교육기관, 종교시설, 산업시설 등 대규모 인원이 상시·일시적으로 집결하는 시설 중재난 발생 시 인명피해 우려가 높은 장소를 선별하여 등급화한 데이터입니다.위험도 점수는 건물의 구조적 안전성, 이용 인원 규모, 재난 취약도, 피난 가능성, 과거 사고 이력 등 다양한 요소를 반영해 산정되며,등급은 상대적인 위험 수준(예: 고위험, 중위험, 저위험 등)으로 분류됩니다.해당 데이터는재난안전 사각지대 사전 식별피난경로 계획 및 시설보강 우선순위 설정민방위 훈련 및 대응 시뮬레이션 자료시나리오 기반 재난 대응 훈련지역 사회 재난 대응 역량 제고등의 목적으로 활용할 수 있습니다.※ 본 데이터는 정기적인 현장 실태조사와 위험요인 분석에 기반한 것이며, 실제 위험은 시점별 시설 이용 현황 및 외부 조건에 따라 달라질 수 있습니다.'
