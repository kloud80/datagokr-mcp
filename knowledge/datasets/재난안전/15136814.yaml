summary_user: 부산교통공사 도시철도 역사별로 화재용 긴급대피마스크 보유 현황을 역 단위로 담은 파일(csv, 약 8.8KB)로, 호선·역명·역 위도·경도, 시민용 대피용품 보관함 위치, 합계와 2021-02·2022-04·2023-04·2025-10 배부 이력을 담는다. 시민이나 안전 연구자가 "내가 타는 부산 지하철역에 화재 대피마스크가 몇 개 있고 보관함은 어디에 있나"를 확인하거나, 역별 비치 수량을 비교하는 데 쓴다. 전역 공통 조인 키는 없어 역명·호선 이름으로 다른 부산 도시철도 역 데이터와 맞추거나, 위도·경도 좌표로 대피시설·소방 등 다른 좌표 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 본 데이터는 부산교통공사에서 운영하는 도시철도 역사에 비치된 화재용 긴급대피마스크의 보유 현황을 정리한 자료입니다.해당 데이터는 호선, 역명, 위도·경도 좌표, 마스크 보관함 위치, 연도별 배부 이력 등으로 구성되어 있으며, 도시철도 내 재난 발생 시 신속한 대피를 위한 현장 대응력을 높이는 데 기여합니다. 또한 승객 안전 확보 및 재난 대응 정책 수립에 필요한 기초자료로 활용될 수 있습니다. 데이터의 개방은 안전 관련 정보에 대한 시민의 접근성을 높이고, 민간 서비스 개발 및 연구 목적으로도 활용 가능성을 지니고 있습니다. 부산교통공사는 지속적인 정보 갱신과 품질 관리를 통해 공공안전 증진에 이바지하고자 합니다.
