summary_user: 전국 졸음쉼터를 한 곳씩 담은 목록으로, 쉼터 이름, 도로 종류·노선·방향, 주차면 수, 화장실 유무, CCTV 수, 기타 편의시설, 관리기관, 주소와 좌표 등의 항목이 있다. 운전자나 도로 안전 분석가가 특정 고속도로·국도 노선의 어느 방향에 화장실과 CCTV를 갖춘 졸음쉼터가 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 법정동 단위 시도·시군구·읍면동 코드(STDG_SGG_CD 등)나 노선명, 좌표를 기준으로 다른 대피·구호시설이나 지역 데이터와 맞춰 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털(www.data.go.kr)에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 졸음쉼터에 대한 관련 정보입니다.\""
