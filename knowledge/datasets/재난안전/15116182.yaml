description_portal: '서울특별시 중구에서 인허가를 받아 운영 중인 민방위 대피시설의 현황을 제공하는 자료입니다. 주요 항목에는 사업장명, 소재지 주소, 인허가 정보, 시설 유형, 영업상태(운영 중, 휴업, 폐업 등), 좌표정보 등이 포함되어 있습니다. 민방위 대피시설은 재난 발생 시 시민의 생명과 재산을 보호하기 위해 지정된 장소로, 정기적인 점검과 관리가 필수적입니다. 본 데이터는 행정기관이 대피시설의 운영 현황을 파악하고, 필요한 경우 점검 및 개선 조치를 취하는 데 활용됩니다. 시민은 자료를 통해 인근 대피시설의 위치와 운영 상태를 확인하고, 비상시 신속하게 대피할 수 있도록 준비할 수 있습니다. 또한 연구자와 정책 담당자는 대피시설의 분포와 운영 상태를 분석하여 재난 대응 정책 수립에 기초 자료로 활용할 수 있습니다. 본 데이터는 시민의 안전한 대피 환경 조성과 재난 대비 체계 강화를 위한 중요한 기반 자료입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
