summary_user: 경기도의 부정불량식품 단속 결과를 기준년도별로 집계한 자료로, 감시건수·위반건수와 무허가·위해우려식품·시설위반·성분규격위반·유통기한 위반·허위과대광고·표시기준 위반 등 위반 유형별 건수, 영업소 폐쇄·영업정지·품목제조정지·고발·시정명령·과태료·과징금 등 행정처분 건수를 담는다. 식품안전 담당자나 분석가가 "경기도에서 최근 몇 년간 어떤 유형의 식품위생 위반이 늘었고 행정처분은 어떻게 내려졌나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도나 같은 기관(경기도) 기준으로만 맞춰 이어 쓴다.
description_portal: 이 데이터는 연도별 부정불량식품에 대한 단속 결과를 종합적으로 수록한 자료로, 식품안전 관련 정책 수립 및 위반 행태 분석에 활용됩니다. 주요 항목에는 기준년도, 감시건수, 위반건수, 무허가, 위해우려식품, 시설위반, 성분규격위반, 허위과대광고, 행정처분 관련 세부 내역(영업정지, 고발, 과태료 등) 등이 포함되어 있습니다. 이를 통해 식품위생법 위반의 세부유형과 발생 빈도, 행정처분의 양상 등을 확인할 수 있으며, 식품 안전을 위협하는 위반행위의 추세를 파악하여 예방 정책 수립이나 단속 전략 수립에 유용하게 활용됩니다. 또한, 데이터는 여러 위반 유형을 항목별로 세분화하고 있어, 특정 위반 항목에 대한 분석 및 시각화 작업도 가능하게 합니다.
