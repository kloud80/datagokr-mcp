description_portal: '해당 데이터는 소방청에서 집계한 자료로  연도별 전국의 주요 사고위험지역을 유형별·지역별로 분류하여 정리한 통계자료입니다. 본 자료는 소방, 구조, 구급 등 다양한 안전관리 업무의 기반이 되는 위험지역 정보를 제공하며, 사고 예방 및 대응정책 수립에 활용될 수 있도록 구성되어 있습니다.주요 항목은 다음과 같습니다.1. 시도명 / 시군구명: 사고위험지역이 위치한 행정구역 단위2. 위험지역명: 실제로 지정된 사고위험지점 또는 구역의 명칭을 표시3. 위험유형: 해당 지역의 사고 가능성이 높은 원인 또는 환경적 특성을 분류한 항목으로, 도로교통, 산업시설, 하천, 산사태, 어린이보호구역 등 4.관리기관명: 해당 위험지역을 관리·점검하는 주체를 명시'
