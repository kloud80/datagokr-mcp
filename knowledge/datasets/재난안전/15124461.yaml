summary_user: 소방청이 정리한 전국 사고위험지역 468건을 지점별로 담은 파일 데이터이며, 시도·시군구·주소·상세위치 설명·장소구분·사고유형 항목으로 구성된다. 지역 안전관리 담당자나 분석가가 우리 지역에 어떤 유형의 사고위험 지점이 있는지 확인하는 질문에 쓴다. 주소(address)를 조인 키로 삼아 주소 기반의 다른 안전·시설 데이터와 이어 쓰며, 같은 세부 부문의 위험지구 폴리곤은 토지 규제 레이어와 겹쳐 본다.
