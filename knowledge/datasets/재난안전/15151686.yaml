description_portal: 본 데이터는 인천시설공단이 관리하는 공공시설 내 자동심장충격기(AED)의 설치·운영 현황을 시민 생명 보호와 심정지 응급대응 시간 단축을 위해 제공하는 공공보건 안전 정보입니다. 해당 데이터는 설치기관명, 설치부서명, 설치 장소 주소, 구체 설치위치(로비·안내데스크·체육관 등), 관리 담당자 연락처, 설치연도 항목으로 구성되어 있습니다 . 시설별 AED 분포와 접근성 점검, 점검·교체 주기 관리, 응급구조 동선 설계, 행사·혼잡 시 응급의료 배치, 지도 기반 안전지수 산정 등 정책·운영 의사결정에 활용할 수 있습니다.
