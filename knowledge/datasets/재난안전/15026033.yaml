summary_user: 부산 강서구 관내 급경사지를 한 곳당 한 행으로 담은 파일로, 명칭·위치·높이·연장·경사·유형·위험등급·관리부서를 기록한다(포털 설명상 총 80개소). 주민이나 방재 담당자가 우리 동네 주변에 어떤 급경사지가 있고 위험등급이 어느 수준인지, 어느 부서가 관리하는지 확인하는 데 쓴다. 전역 조인 키가 없어 위치(주소) 텍스트를 지오코딩하거나 명칭으로 다른 재해위험지구·대피시설 자료와 맞춰 써야 한다.
limits: 표준 행정코드나 시설 ID 같은 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위는 강서구 한 곳뿐이라 부산 전체나 전국 비교에는 다른 구·시도 자료를 따로 모아야 하고, 좌표 필드가 없어 지도에 바로 올릴 수 없다. 명세상 주기는 연간이지만 이벤트 주기로도 표기돼 있어 갱신 시점은 파일을 받아 확인해야 한다.
