description_portal: 부산광역시 강서구 관내 급경사지 현황 정보를 담고있습니다. 강서구 관내 급경사지는 총 80개소 입니다.강서구에서는 안전한 급경사지의 유지관리를 위하여 연 2회(해빙기, 우기 대비) 점검을 시행하고 있으며, 점검결과에 따라 조치를 시행하고 있습니다.현재 강서구 관내 급경사지 중 위험등급이 D~E등급으로 붕괴위험지역으로 지정해야 하는 급경사지는 부존재 합니다. 매년 급경사지 신규 발굴을 통해 급경사지를 새로 지정하고 있습니다.포함하는 데이터는 다음과 같습니다.(연번, 명칭, 위치, 높이, 연장, 경사, 유형, 등급, 부서)
