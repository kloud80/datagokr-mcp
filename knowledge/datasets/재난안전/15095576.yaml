summary_user: 울산광역시 울주군이 방사능 비상 때 주민이 오염 구역을 벗어나 모이거나 수송 수단을 기다리는 긴급대피장소(야외 운동장·공원·넓은 주차장 등 개방된 집결지)를 지점 단위로 담은 API입니다. 울주군 주민이나 방재 담당자가 "원전 사고가 나면 우리 동네에서 가장 가까운 집결지는 어디인가"를 확인하거나 대피 계획을 세울 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 같은 군의 구호소·교통통제소 데이터와는 장소명·주소 매칭이나 같은 기관 코드로만 이어 쓴다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 긴급대피장소 조회 서비스는 방사능 비상 상황 시 오염 구역에서 벗어난 주민들이 일시적으로 모이거나 다음 단계로 이동하기 전 대기하는 중간 집결지 및 안전한 대피 지점에 관한 데이터입니다.방사능 확산 경로에서 벗어나 주민들이 긴급하게 몸을 피할 수 있는 야외 운동장, 공원, 넓은 주차장 등 개방된 안전 지점 정보를 제공합니다.'구호소'가 숙박과 식사가 가능한 실내 거주 시설이라면, '긴급대피장소'는 사고 직후 주민들이 신속하게 모여 수송 버스를 기다리거나 개인 차량으로 이동하기 위한 집결지 성격의 데이터입니다.도로망 및 '교통통제소' 데이터와 결합하면 어느 경로를 통해 이 장소에 접근할 수 있는지 분석할 수 있습니다.
