summary_user: 경상남도 진주시가 설치한 CCTV를 설치 지점별로 한 행씩 담은 원천 목록으로, 지번 주소와 위도·경도 좌표, 설치 목적, 카메라 대수, 설치년월이 들어 있다. 시민이나 분석가가 '우리 동네 골목·통학로 주변에 방범 CCTV가 어디에 몇 대 있는가'를 확인하거나 지역별 CCTV 분포를 지도에 올려 사각지대를 찾는 데 쓴다. 다른 데이터와 이어 줄 전역 조인 키는 없으므로, 좌표 기반 공간 결합이나 지번 주소 매칭으로 보안등·안전비상벨 같은 다른 방범 인프라 데이터와 겹쳐 본다.
description_portal: 본 데이터는 경상남도 진주시에서 설치한 CCTV의 위치정보를 제공하는 자료로, 진주시청 스마트도시과에서 관리하고 있습니다. 데이터에는 CCTV의 위치, 위도·경도 좌표뿐만 아니라 설치 목적, 설치 대수, 설치 연도 등 주요 정보가 포함되어 있습니다. 이를 통해 방범, 교통 관리, 안전 모니터링 등 다양한 활용이 가능하며, 도시 안전 정책 수립과 연구, 공공데이터 기반 서비스 개발에도 중요한 자료로 활용될 수 있습니다. 나아가 시민 생활 안전 강화, 범죄 예방, 교통 흐름 분석 등 실질적 효과를 기대할 수 있으며, 향후 스마트시티 구현을 위한 기반 자료로도 활용될 수 있습니다.
