summary_user: 전국 공공시설물 가운데 옹벽을 시설물 번호(FCLTY_NO) 단위로 묶은 원장으로, 시설물명·종류·구분, 위치, 준공일, 주요 제원, 관리기관, 안전등급, 최근·차기 점검진단일, 전경·정면 사진을 건별로 담는다. 지자체 안전담당자나 주민이 "우리 동네 옹벽의 안전등급은 무엇이고, 마지막 점검과 다음 점검은 언제인가"를 확인할 때 쓴다. 다른 데이터셋과 공통으로 쓰는 조인 키는 실측 컬럼에서 확인되지 않아, 위치(주소)나 관리기관 이름을 맞추는 방식으로만 같은 플랫폼의 다른 시설 안전 원장과 연결된다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국토교통부 국토안전관리원에서 제공하는 공공시설물의 안전점검 관련 정보입니다.\""
