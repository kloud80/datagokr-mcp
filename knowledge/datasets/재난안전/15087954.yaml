summary_user: 한국전기안전공사가 위탁 수행한 2024년 사용전검사 실적을 전국 60개 사업소별로 합격·불합격·임시사용·판정보류 건수로 집계한 파일(csv, 약 1.9KB)이다. 전기설비 설치·변경공사 뒤 받는 사용전검사의 판정 결과가 지역 사업소마다 어떻게 다른지, 예컨대 어느 사업소의 불합격이나 판정보류 비중이 높은지를 살피는 분석가나 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업소 이름을 매핑하거나 같은 기관(한국전기안전공사)의 다른 사업소별 통계와 이름으로 맞춰 잇는다.
description_portal: '한국전기안전공사에서는 각종 발전설비, 송전·변전·배전설비 등 사업용 전기설비 및 아파트, 공장, 상가 등 자가용 전기설비의 설치공사 또는 변경공사를 완료하고, 그 전기설비가 공사계획의 인가 또는 신고를 한 내용 및 전기설비기술기준에 적합한 지의 여부에 대한 검사를 산업통상자원부장관 또는 시·도지사로부터 위탁받아 업무를 수행하고 있습니다.관련근거는 사업용 사용전검사 : 전기사업법 제 63조, 제98조제2항, 같은법 시행규칙 제31조, 자가용 사용전검사 : 전기안전관리법 제9조, 제43조제2항, 같은 법 시행규칙 제6조 가 해당됩니다.이 데이터는 2024년 사용전검사 실시한 내역을 한국전기안전공사의 사업소 60개소로 나눠서 합격, 불합격, 임시사용, 판정보류로 확인 할 수 있는 데이터입니다.'
