description_portal: 공공데이터 제공 신청접수건으로 강원특별자치도 강릉시 기계설비유지관리자 선임신고 대상 건축물 현황을 제공합니다.순번, 주용도, 건물명, 주소, 연면적, 비고 등의 항목을 제공합니다.본 데이터는 관내 기계설비 유지관리자 선임 대상 건축물 현황을 체계적으로 정리한 자료입니다. 각 주용도,  건물명, 주소, 연면적(㎡), 비고 항목을 포함하여 구체적인 정보를 제공합니다. 자동차시설, 공장, 의료시설, 교육연구시설, 판매시설, 공동주택 등 다양한 용도의 건축물이 포함되어 있으며, 기계설비 유지관리자 선임 기준에 따른 대상 건물 파악에 유용합니다.본 자료는 건축물별 기계설비 안전관리 및 유지보수 계획 수립에 필수적인 기초 자료로 활용됨을 목적으로 합니다.
