summary_user: 강릉시 관내에서 기계설비유지관리자를 선임해 신고해야 하는 대상 건축물을 건물 한 곳당 한 행으로 담은 파일이며, 주용도·건물명·주소·연면적(㎡)·비고를 포함한다(CSV 약 11KB). 건물주나 관리업체가 '우리 건물이 기계설비유지관리자 선임 대상인가'를 확인하거나, 설비 점검업체가 강릉시 내 대상 건물의 용도별 분포를 파악하는 데 쓴다. 전역 조인 키나 건물 고유번호가 없어 건축물대장 등 다른 시설 데이터와는 주소나 건물명을 맞춰 연결해야 한다.
limits: 건물 단위 고유 식별자가 없어 다른 데이터와 정확히 잇기 어렵고, 주소·건물명 표기 차이로 매칭이 어긋날 수 있다. 범위는 강릉시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
