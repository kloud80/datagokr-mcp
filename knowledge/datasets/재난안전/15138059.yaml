description_portal: 본 자료는 한국승강기안전공단에서 실시하는 승강기 안전교육 종료 후 진행되는 평가와 관련된 정보입니다.안전교육은 승강기 설치·운영·유지관리 과정에서 필수적인 안전 역량을 확보하기 위해 실시되며, 교육 이수자의 학습 성과를 객관적으로 검증하기 위해 평가지가 운영됩니다.데이터에는 평가지 순번, 평가지명, 평가지별 문제 건수 등이 포함되어 있어 교육의 체계성과 난이도를 파악할 수 있습니다.평가지명은 고속 및 중저속 엘리베이터, 에스컬레이터, 휠체어리프트, 자체점검 및 검사 인력 등 다양한 교육 과정별로 구분되어 있으며, 지역본부 및 연도별 세부 과정에 따른 문제 수량도 반영되어 있습니다.
