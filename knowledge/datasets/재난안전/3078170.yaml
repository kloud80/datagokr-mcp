summary_user: "서울 마포구가 운영하는 여성안심귀가서비스 '안심스카우트'의 이용 횟수를 행정동별·시간대별로 5월부터 7월까지 집계한 엑셀 파일(xlsx, 약 33KB)이다. 마포구 주민이나 생활안전 분석가가 '어느 동, 어느 시간대에 귀가 동행 수요가 많은가'를 확인해 순찰·인력 배치를 검토할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 행정동 이름을 맞추는 방식으로만 이어 쓴다(예: 마포구 CCTV·보안등·안전비상벨 위치 자료)."
limits: 파일 상단이 병합 표 형식이라 컬럼명이 대부분 비어 있어(Unnamed), 그대로 읽으면 열 의미를 알 수 없고 머리행을 직접 정리해야 한다. 건별 이용 기록이 아닌 집계이며 범위는 마포구 한 곳의 5~7월로 한정되어 다른 구 비교나 연간 추이 분석에는 쓰기 어렵다.
