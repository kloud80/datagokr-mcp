description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증 제원별 수수료 현황을 정리한 자료로, 인증 신청 건별로 시험 항목에 따른 수수료 내역을 기록하고 있습니다. 각 행은 하나의 인증 신청 건에 포함된 특정 안전성시험 항목에 대한 수수료 정보를 나타내며, 주요 필드는 ‘인증 신청 순번’, ‘안전성시험 코드’, ‘안전성시험 항목’, ‘서류 심사 수수료’, ‘공장 심사 수수료’, ‘안전성 시험 수수료’, ‘부품용 PESSRAL 비용’, ‘부품용 PRINTED 비용’ 등이 포함됩니다.‘안전성시험 항목’은 예를 들어 ‘구조확인’, ‘기능시험’, ‘측정시험’과 같이 시험의 종류를 구분하고, 각 항목에 대해 발생한 비용을 세부적으로 확인할 수 있습니다. PESSRAL과 PRINTED는 안전회로 부품에 해당하는 시험 평가 비용 항목으로, 부품 특성에 따라 별도로 계산됩니다.이 데이터는 수수료 항목별 집계, 시험 유형별 예산 분석, 제원에 따른 인증 비용의 구조를 파악하는 데 유용하며, 특히 공정하고 투명한 수수료 체계를 위한 행정 분석 자료로 활용됩니다.
