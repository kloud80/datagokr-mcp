summary_user: 광진구에 설치된 안심택배함의 월별 이용률을 시설(택배함 설치 장소)별로 담은 집계 파일로, 시설명·칸 수·연도·월·이용률(퍼센트)·데이터기준일자 항목으로 구성된다. 구청 담당자나 분석가가 "어느 시설 택배함의 이용률이 낮아 칸 수 조정이나 재배치를 검토해야 하는가" 같은 운영 효율 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명을 이름으로 맞추거나 같은 기관(광진구) 데이터끼리만 이어 쓴다.
