summary_user: 전국 건설 현장의 시추조사 보고서를 전산화한 지반조사자료 가운데 시추공 한 개를 한 행으로 담은 건별 원천 파일로, 시추공코드·고도·시추심도·지하수위·시추방법·시추공종류와 X·Y 좌표를 포함한다(CSV 약 24.5MB). 설계·시공 사업자나 분석가가 "이 부지 주변 시추공에서 지하수위와 시추심도는 얼마였나"를 확인해 추가 지반조사 범위를 정하는 데 쓴다. 다른 데이터셋과 공통으로 쓰는 조인 키는 없고, 같은 지반정보 계열의 다른 자료와는 시추공코드로, 지도·행정구역 자료와는 X·Y 좌표를 공간 매칭해 잇는다.
