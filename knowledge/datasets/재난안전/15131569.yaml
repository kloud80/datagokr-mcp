summary_user: 기상청이 관측한 지진의 진도 정보를 통보문번호별로 담은 경기도 제공 자료로, 진도 구분(계기진도·추정진도), 진도 값, 위치·그리드·지도·페이지 정보와 등록·수정일자를 담는다. 특정 지진이 났을 때 지역별로 얼마나 흔들렸는지, 최대 진도가 어디였는지 확인하려는 재난안전 담당자나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 통보문번호(ntfctn_doc_no)나 지역 이름 매핑으로만 맞춰 써야 하며, 재난 특보·대피시설 같은 재난안전 데이터와 함께 보는 용도에 맞다.
description_portal: 「지진조기경보시스템 기상청 진도 정보」 데이터는 경기도가 제공하는 재난안전 분야 자료로, 기상청에서 관측한 지진의 진도(震度)와 관련된 상세 정보를 포함합니다. 주요 항목은 통보문번호, 진도타입, 진도정보, 진도위치정보, 진도그리드정보, 진도맵정보, 진도페이지정보, 등록일자, 수정일자로 구성되어 있습니다. 이를 통해 특정 지진의 최대 진도, 지역별 진도 분포, 지도 기반 시각화 자료를 확인할 수 있으며, “진도타입” 구분을 통해 계기진도(I)와 추정진도(E)를 구분하여 지진 규모 산출과 지역별 체감 강도 분석 등에 활용할 수 있습니다.
