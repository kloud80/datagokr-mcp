description_portal: 경찰청이 제공하는 2020년 전국 범죄 발생 및 검거 현황 통계에 따르면, 서울, 경기남부, 부산 지역이 전체 범죄 발생 건수와 검거 인원에서 가장 큰 비중을 차지하며 대도시 집중 현상이 뚜렷하게 나타났습니다. 이는 높은 인구 밀집도와 경제 활동 규모에 비례하는 결과로 해석됩니다.특히 지능범죄, 절도, 폭력 등 주요 범죄 유형에서 이들 지역의 발생 건수가 두드러지며, 서울이 총 발생 건수 30만 건 이상으로 전국 최다를 기록했습니다. 반면, 강원, 충북, 전북 등은 상대적으로 낮은 총 발생 건수를 보였으나, 세부적으로는 강력범죄(살인, 강도) 등 일부 특정 유형에서 지역별 편차가 관찰되었습니다. 전반적으로 모든 시도에서 높은 검거율을 기록하고 있으나, 지역 특성에 따른 맞춤형 치안 대응 전략이 지속적으로 요구됨을 시사합니다.
