summary_user: 국토안전관리원이 제1종시설물(건축물·교량·댐·상하수도·터널·항만) 점검·진단 결과보고서에서 뽑은 철근부식도 측정 결과를 측정 위치별 한 행으로 비식별화해 담은 전국 단위 파일로, 포털 설명 기준 16개 열·6,868행이며 2022년까지 구축한 1회성 데이터다. 시설물 유지관리 분석가나 연구자가 구조형식·경과일수별로 철근 부식 전위 분포(-200mV 이상, -200~-350mV, -350mV 이하 비율)와 부식등급이 어떻게 달라지는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 시설물 안전등급·점검 결과 데이터와는 시설물명·위치 같은 이름 매핑으로만 느슨하게 이어 쓴다.
description_portal: 국토안전관리원에서 제공하는 제1종시설물 대상 점검, 진단 결과보고서의 철근부식도  데이터를 비식별화 하여 엑셀형식으로 공개하는 데이터 입니다.데이터는 시설물명, 위치, 구조형식, 규모 등 16개의 열과 6,868개의 행으로 구성되어 있습니다.시설물은 건축물, 교량, 댐, 상하수도, 터널, 항만 6개로 구분되어서 제공되고 있습니다.2022년까지 수행한 DB구축 데이터로 이후 생성데이터가 존재하지 않아 1회성 데이터로 변경됨을 알려드립니다.빈값은 데이터 미집계임을 알려드립니다.
