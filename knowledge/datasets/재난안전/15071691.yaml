description_portal: '서울시 안전지대 관련 정보입니다. (좌표계: EPSG:5186)*용어설명- 안전지대는 도로에서 보행자 보호와 차량 안전을 위해 설정된 공간을 의미합니다. 이는 횡단하는 보행자가 잠시 대기하거나, 교통 상황 상 위험을 줄이기 위한 완충 공간으로 작동하며, 차량의 진입은 명백하게 금지됨-도로교통법에 따르면, 안전지대는 “도로를 횡단하는 보행자나 통행하는 차마의 안전을 위하여 안전표지나 이와 유사한 인공구조물로 표시한 도로의 부분”으로 정의※ 제공부서 : 서울특별시 교통실 교통운영관 교통운영과(02-2133-2476)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
