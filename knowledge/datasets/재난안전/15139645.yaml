summary_user: 전국의 화학사고 대피장소를 시설 한 곳씩 담은 목록으로, 시도·시군구, 시설구분, 대피장소명, 도로명주소, 위도·경도, 수용면적, 수용인원을 함께 제공한다. 주민이나 지자체 담당자가 '우리 동네에서 화학사고가 나면 어디로, 몇 명까지 대피할 수 있나'를 확인하거나, 분석가가 지역별 대피 수용능력을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 대피·구호시설 데이터와는 시도·시군구명이나 법정동 명칭(STDG_NM) 같은 이름 매핑, 또는 같은 기관 코드로 잇는다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 화학사고 대피장소 정보로, 시도명, 시군구명, 대피시설순번, 시설구분, 대피장소명, 시설상세명, 도로명주소, 위도, 경도, 수용면적, 수용인원 등을 제공하고 있습니다. 데이터의 갱신주기는 3일입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
