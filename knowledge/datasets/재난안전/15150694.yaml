summary_user: 침수 사건별로 침수가 난 구역의 흔적을 한 건씩 담는 데이터로, 침수 깊이·등급·면적, 발생 연도, 재해명과 원인, 침수 시작·종료 일시, 시도·시군구 코드, 도형 정보(GEOM)로 이루어진 전국 범위의 원천 기록이다. 주민이나 부동산·보험 실무자가 '이 동네가 과거 태풍이나 집중호우 때 실제로 물에 잠긴 적이 있는가, 얼마나 깊었는가'를 확인하거나, 지자체 분석가가 반복 침수 지역을 추릴 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 실측에서 확인되지 않았으므로, 시도·시군구 코드(STDG_CTPV_CD, STDG_SGG_CD)를 행정구역 코드표나 지역명에 맞춰 대피시설·재해위험지구 같은 같은 부문 데이터와 이어 쓴다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼'을 구축·운영하여 재난안전분야 공공데이터를 제공하고 있습니다.- 이에 따라 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 침수흔적도 정보입니다."
