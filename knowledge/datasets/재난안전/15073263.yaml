summary_user: 이륜차 배달 종사자에게 알리기 위한 사고다발구역을 구역 단위로 담은 데이터로, 구역 이름·시군구·구역 내 사고건수·중심 좌표(경도·위도)·반경을 제공한다. 검증 시 API 전체 10건, 범위는 전국이며, 배달 기사나 배달대행 플랫폼이 어느 지점이 사고 위험 구역인지 확인하는 질문에 쓴다. 전역 조인 키는 없지만 시군구코드(signguCode)로 같은 코드 체계의 지역 자료와 잇고, 중심 좌표로 지도 위에 겹쳐 쓴다. 교통사고다발지역 표준데이터와는 같은 개념으로 보고 비교한다.
description_portal: 한국산업안전보건공단엣 제공하는 이륜차 배달 종사자의 사고다발(위험) 지역 알림을 위한 서비스입니다.- 경찰청에서 제공한 사고다발구역 데이터를 기반으로 배달 종사자의 근무환경에 적합한 사사고다발구역 알람 시 배달 업무에 지장이 없도록   GIS 전문가가 사고다발지점을 300m 단위로 분석하여 노출빈도와 범위를 최소화 하였습니다.고다발구역이 개발되었습니다.- 이륜차 배달 종사자 산재발생과 청소년의 배달산업 종사문제가 사회적 이슈로 부각됨에 따라 배달산업에 대한 재헤예방 필요성이 대두되고 있습니다. 본 시스템은 Open-API 방식으로 배달 플랫폼 상에서 사고 다발지역 접근 시 알림, 안전배달시간 조회, 스팟 교육영상 서비스를 제공하고 있습니다.안전보건공단에서는 배달대행 플랫폼과 함께 종사자의 안전의식 및 안전보건관리 수준 향상을 높일 수 있도록 지속적으로 노력하고 있습니다.
