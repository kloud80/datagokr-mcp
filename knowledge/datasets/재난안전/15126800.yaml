summary_user: 대구광역시 남구 관내 급경사지를 한 곳당 한 행으로 담은 파일(약 1KB 분량의 CSV)로, 급경사지명·소재지·위험등급·비탈면 유형과 구조·시설관리부서를 기록한다. 주민이나 안전 담당자가 '우리 동네 급경사지 중 위험등급이 높은 곳은 어디이고 어느 부서가 관리하나'를 확인하거나, 분석가가 비탈면 유형별 위험 분포를 살펴보는 데 쓴다. 전역 조인 키는 없으므로 소재지 주소를 지오코딩하거나 이름으로 매핑해 다른 재해위험지구·대피시설 자료와 맞춰 쓴다.
limits: 남구 한 시군구 범위만 담아 대구 전체나 다른 지역과 비교하려면 다른 기관 자료를 따로 모아야 한다. 명세상 연간·이벤트성 갱신으로 생성 후 바뀌지 않는 성격이라 현재 위험등급과 다를 수 있으니 데이터 기준일자를 확인해야 한다. 좌표나 공통 코드가 없어 공간 결합은 소재지 주소 변환에 의존한다.
