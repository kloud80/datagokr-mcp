description_portal: 해당 데이터는 경기북부지역 소방시설 주변 절대 주정차 금지 구역에 대한 정보 제공을 목적으로 작성된 자료입니다. 경기북부지역은 의정부, 고양, 남양주, 파주, 양주, 동두천, 구리, 포천, 가평, 연천으로 구분되어 있습니다. 시군구명, 시군구코드, 상세위치, 금지구역 총 연장, 관리기관명, 관리기관 전화번호, 데이터 기준일자에 대한 정보가 포함되어 있습니다. 이 자료를 통해 경기북부지역 내 소방시설 주변 붉은색 주차금지 구역에 대한 상세 위치정보 및 관리기관 정보를 확인할 수 있습니다. 해당 현황은 경기북부경찰청 교통과에서 제공합니다.
