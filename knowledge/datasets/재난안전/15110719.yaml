summary_user: 충주시 안의 산불 확산 위험지역을 지점(주소·좌표) 단위로 하나씩 담은 원천 데이터로, 응답은 type·properties·geometry 형태의 공간 객체로 오며 포털 설명상 관리번호, 읍면동, 도로명 주소, 위도·경도, 산불확산 점수와 등급이 들어 있다. 충주시 재난·산림 담당자나 분석가가 '우리 읍면동에서 산불이 번질 위험이 가장 높은 곳은 어디이고, 예방 사업과 진화 거점을 어디부터 둬야 하나'를 따질 때 쓴다. 전역 조인 키는 없으므로 읍면동 이름이나 좌표로 대피시설·소방 시설, 다른 재해위험지구, 토지 규제 레이어 같은 공간 데이터와 겹쳐 본다.
limits: 한 번 만들어진 뒤 바뀌지 않는 데이터라서 그날의 풍속이나 건조도를 반영한 실시간 산불 위험 예보로 쓸 수 없다. 범위가 충주시 하나뿐이고 공통 코드 키가 없어서, 다른 시군 데이터와 바로 맞붙여 비교하기는 어렵다.
