summary_user: 부산광역시 중구 관내 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일로, 시설 구분·시설명·도로명/지번주소·급수능력(톤)·급수인원 수·관리기관명·데이터 기준일자를 담는다(CSV 약 1.1KB 규모). 전쟁이나 풍수해로 상수도가 끊겼을 때 중구 주민이 '우리 동네에서 물을 받을 수 있는 비상급수시설이 어디이고 몇 명분을 공급하나'를 확인하거나, 구청·분석가가 지역별 비상급수 용량을 점검하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 대피·구호시설 데이터와는 주소나 시설명을 매칭하거나 같은 기관 데이터끼리 묶어 쓴다.
limits: 부산 중구 한 개 구만 다루므로 다른 구·시와 비교하려면 각 기관 파일을 따로 모아야 한다. 행정코드나 시설 ID 같은 공통 키가 없어 다른 데이터와 연결할 때는 주소 문자열 매칭에 의존한다.
