summary_user: 경기도 남양주시 관내에 설치된 구급함을 한 곳씩 담은 위치 목록으로, 설치위치명·도로명/지번 주소·위도·경도·관리기관과 전화번호·구성품을 시군구 범위의 개별 지점 단위로 제공한다(CSV 약 2.8KB의 소규모 파일). 시민이나 안전 서비스 개발자가 '지금 있는 곳에서 가장 가까운 구급함은 어디이고, 안에 무엇이 들어 있는가'를 찾을 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도 좌표나 주소 문자열로 이어 쓰며, 남양주시의 대피·구호시설이나 소방 시설 위치 데이터와 지도 위에 겹쳐 보는 방식으로 연결한다.
description_portal: 경기도 남양주시의 구급함 위치 정보에 대한 데이터로, 설치위치명, 설치 상세주소(도로명/지번), 위도 및 경도, 관리기관명, 관리기관 전화번호, 구성품의 항목을 제공합니다.이 자료는 위급 상황 발생 시 시민들이 신속하게 응급처치를 하거나 필요한 비상 의약품을 확보할 수 있도록 돕는 데 목적이 있습니다시민 안전 증진 및 응급 상황 대비 체계를 강화하는 데 활용됩니다. 안전 관련 서비스에서 활용되어 사용자에게 가장 가까운 구급함 위치를 안내함으로써 위급 상황 시 초기 응급처치를 빠르게 수행할 수 있도록 지원합니다.
