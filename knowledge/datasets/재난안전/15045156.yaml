description_portal: 최근 7년간(2018년~2024년) 허가수역 내 불법 외국어선 조업 현황에 관한 데이터로서 매월(1월~12월) 조업 현황을 제공합니다. (단위:척수)허가수역 중국어선이란 한국 정부로부터 조업 허가를 받아 한국의 배타적경제수역(EEZ)에서 합법적으로 조업하는 중국어선을 의미하지만, 허가받은 조업 수역과 조건을 위반하여 불법 조업을 하거나 단속을 피하는 중국어선도 많아 해경의 단속 대상이 되고 있습니다. 한국 정부의 허가를 받아 허가수역에서 조업하는 중국어선이 있으나, 허가받은 조업수역이나 허가받은 업종, 어획량 등 조건을 어겨 불법 조업을 하는 경우해양경찰청은 성어기 등 특정 시기에 맞춰 불법 외국어선에 대한 특별 단속을 실시하며, 위반 어선에 대한 단호한 대응을 강조하고 있습니다.
