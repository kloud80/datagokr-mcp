summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 이재민 수용시설 원장으로, 시설 한 곳당 한 건씩 시설명·구분, 수용 가능 인원(DSSTR_ACTC_PSBLTY_TNOP), 면적, 지하 여부, 주소, 좌표(경위도 포함), 관리 담당자와 출입문 개방 시간 등을 담는다. 주민이나 지자체 재난 담당자가 '우리 동네에서 재난 때 이재민이 머물 수 있는 시설은 어디이고 몇 명까지 받는가'를 확인할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 다른 대피·구호시설이나 재난 위험지역 데이터와는 행정동·법정동 코드, 주소, 좌표를 맞추는 방식으로 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 수용 공간시설 정보로, 수용시설구분코드, 행정동코드, 상세주소, 이재민수용시설명, 이재민수용가능인원, 시설면적, 사용구분코드, 지하여부, X좌표, Y좌표 등을 제공하고 있습니다. 데이터의 갱신주기는 5분입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기  바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
