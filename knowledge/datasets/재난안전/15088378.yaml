description_portal: 본 자료는 수상레저 활동과 관련하여 발생한 피해 사고 현황을 연도별, 유형별로 세분화하여 정리한 데이터입니다. 2015년부터 2025년까지 총 11년간의 사고 발생 추이를 포함하고 있으며, 각 연도별로 어떠한 유형의 사고가 얼마나 발생했는지를 한눈에 비교할 수 있도록 구성되어 있습니다. 사고 유형은 침몰, 화재, 전복, 좌초, 표류, 충돌, 기타 등 7개 항목으로 구분되어 있어 유형별 특징과 빈도를 체계적으로 파악할 수 있습니다. 이를 통해 특정 시기에 발생이 집중되는 사고 유형을 분석하거나, 안전관리 정책과 예방대책의 우선순위를 설정하는 근거 자료로 활용할 수 있습니다. 나아가 수상레저 활동의 위험 요인을 객관적으로 진단하고, 이용자 안전을 강화하기 위한 제도적·행정적 보완책을 마련하는 데 기초자료로서 중요한 의미를 가집니다.
