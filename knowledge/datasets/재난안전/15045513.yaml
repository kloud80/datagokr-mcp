summary_user: 광주 광산소방서 관내 다중이용업소(노래연습장·PC방·음식점 등)를 업소 한 곳당 한 행으로 상호명과 지번 소재지 주소를 담은 건별 원장 파일(CSV, 약 75KB)이다. 광산구 주민이나 분석가가 "우리 동네에 소방 특별관리 대상 다중이용업소가 어디에 몰려 있나"를 주소 기준으로 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 지오코딩하거나 상호명·주소를 맞춰 이어 써야 하며, 같은 기관의 다른 소방서 다중이용업소 현황이나 119안전센터·소방용수 위치 데이터와 주소 기준으로 겹쳐 본다.
description_portal: 광주광역시 광산소방서 관내 소방시설 설치 적정여부 확인, 관계자 교육 등을 위해 관리중인 다중이용업소의 상호, 주소 현황입니다.광주광역시 광산구 다중이용업소 현황에 대한 데이터로 광산소방서 관할 119안전센터 업종별 수치를 나타내는 자료입니다.다중이용업소는 불특정 다수의 시민이 동시에 이용하는 영업시설을 말합니다. 대표적으로 노래방, PC방, 음식점, 학원, 목욕탕, 영화관, 유흥주점 등이 이에 해당합니다. 이런 업소는 한 번에 많은 인원이 머무는 만큼, 화재나 사고가 발생하면 대규모 인명 피해로 이어질 위험이 크기 때문에 소방에서 특별히 관리합니다.광주 광산소방서 관할 구역은 주거지와 상권, 전통시장, 공장단지, 교육시설이 밀집해 있어 다중이용업소가 다양하게 분포하고 있습니다. 특히 노래연습장, PC방, 음식점이 가장 많으며, 일부는 지하에 위치해 대피가 어렵고 화재 확산이 빠른 구조적 특성을 가지고 있습니다. 이러한 업소들은 「다중이용업소의 안전관리에 관한 특별법」에 따라 소방안전교육과 안전시설 설치가 의무화되어 있습니다.광주 광산소방서 관내 다중이용업소는 시민 생활과 밀접한 공간이지만, 동시에 화재와 안전사고 위험이 높은 시설입니다. 소방서는 철저한 관리와 교육으로 안전을 확보하고 있으며, 시민들이 이용할 때 조금만 주의를 기울인다면 피해를 크게 줄일 수 있습니다. 결국, 다중이용업소 안전은 소방과 업주, 시민이 함께 만들어가는 공동의 과제라고 할 수 있습니다.이 데이터는 광주광역시 광산소방서 각 119안전센터에서 관리하는 관할 구역 내의 업종별 수 등의 정보를 제공합니다.
