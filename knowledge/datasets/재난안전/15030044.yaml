summary_user: 전라남도 소방본부와 소방서에 배치된 소방공무원 인원을 관서별로 집계해, 총인원과 소방감부터 소방사까지 직급별 인원을 담은 작은 CSV 파일(935바이트)이다. 지역 소방 인력 배치를 살피는 분석가나 주민이 '어느 소방서에 어떤 직급의 인력이 몇 명 배치돼 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 관서명(소방서 이름)을 기준으로 같은 기관의 화재 발생·119안전센터 등 소방 데이터와 이름 매핑해 이어 쓴다.
description_portal: '- 전라남도 소방본부 및 소방서에 배치된 소방인력에 대한 데이터로 관서별, 직급별 소방공무원 인력 배치 현황 정보를 제공합니다.- 전라남도 소방공무원은 도민의 생명과 재산을 보호하기 위해 다양한 분야에서 활동하고 있습니다. - 전라남도 소방본부 및 소방서에 배치된 소방공무원 인력 현황은 공공데이터포털에서 확인하실 수 있습니다. 이 데이터는 관서별, 직급별로 상세히 제공되며, CSV 형식으로 다운로드 가능합니다. 데이터는 연간 업데이트됩니다.- 더 자세한 정보나 특정 사항에 대한 문의가 있으시면 전라남도 소방본부 공식 웹사이트를 방문하시거나, 해당 부서에 직접 문의하시기 바랍니다.'
