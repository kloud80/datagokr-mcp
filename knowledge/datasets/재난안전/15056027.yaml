description_portal: '본 데이터는 제주특별자치도 제주시에서 자연재해 및 각종 재난 발생 시 신속한 대응과 복구를 위해 확보·관리 중인 방재장비의 보유 현황을 수록한 자료입니다. 지역 안전망 강화를 위한 재난 대비 체계를 구축하고, 재해 유형별 장비 운영의 효율성을 높이기 위한 기초자료로 활용됩니다.주요 항목구분: 장비의 대분류 항목(예: 수방장비, 제설장비, 구조장비 등)상세: 장비의 세부 명칭 또는 기종(예: 양수기, 모래주머니, 발전기 등)보유량: 제주시에서 현재 보유하고 있는 장비의 수량데이터기준일: 해당 데이터가 집계되거나 갱신된 기준 일자활용 목적이 데이터는 제주시 안전총괄과 점검·갱신하며, 실시간 재해 대응 체계의 기초자료로 제공됩니다.'
