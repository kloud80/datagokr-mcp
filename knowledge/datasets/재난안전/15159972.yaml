description_portal: 경찰청 경기도남부경찰청이 관할 지역 내 기초질서 위반사범 유형별 단속 현황을 조사한 자료입니다.해당 데이터는 2021년부터 2025년까지 5년간의 데이터를 집계하였습니다.위반 유형별 단속 현황은 쓰레기 등 투기, 음주소란, 인근소란, 광고물 무단 부착, 노상방뇨, 기타(불안감 조성, 무임승차, 무전취식, 거짓신고 등)로 나누어 집계 하였습니다. 이를 통해 경기남부지역 기초 질서에 대한 범죄 현황을 알 수 있고 치안 정책과 예방 캠페인 수립 시 근거 자료로 사용할 수 있습니다. 해당 데이터는 범죄 예방 정책 개선과 실무 활용성에 기여할 수 있는 자료입니다. (연간 1회 갱신되는 구조로 제공됩니다.)
