description_portal: "본 통계는 112 신고 서비스를 이용한 남성과 여성 고객의 만족도를 연령대 및 세부 항목별로 분석한 결과입니다.성별 종합 만족도: 남성의 종합만족도는 평균 90.3점, 여성은 평균 91.4점으로 여성이 남성보다 다소 높은 만족도를 보이는 것으로 나타났습니다. 특히 **60대 이상 여성(95.1점)**에서 전 계층 중 가장 높은 만족도를 기록했습니다.항목별 주요 특징: 남녀 모두 **'담당 경찰관의 전문성'**과 '사건 처리의 공정성' 항목에서 90점대 이상의 높은 신뢰를 보였습니다. 반면, '현장 도착의 신속성' 항목은 20~30대 남녀 모두에서 80점대 중반을 기록하여 타 항목 대비 개선 요구가 높았습니다.연령별 추이: 남녀 공통적으로 연령대가 높아질수록 만족도가 상승하는 경향을 보이며, 특히 현장 대응 및 사후 처리 과정에서 고령층의 긍정적 평가가 두드러집니다.종합적으로 112 서비스는 여성과 고령층에서 더 높은 신뢰를 얻고 있으나, 젊은 층이 체감하는 출동 신속성 부문은 보완이 필요한 것으로 분석됩니다."
