description_portal: 경찰청 범죄예방정책과에서 제공하는 경범죄처벌법 통고처분 현황 통계는 2014년부터 2018년까지 경범죄처벌법상 규정된 위반 행위에 대한 통고처분 건수를 보여줍니다. 주요 위반 행위로는 오물투기, 음주소란, 인근소란, 노상방뇨, 광고물 무단 부착 등이 포함되어 있으며, 무임승차 및 기타 경범죄 항목도 함께 제시됩니다.전반적으로 오물투기 건수가 가장 높은 수치를 보이며, 연도별로 변동 폭이 큰 특징을 나타냅니다. 음주소란과 인근소란 또한 비교적 높은 발생 건수를 보입니다. 이 통계는 경범죄 발생 추이 및 주요 유형을 파악하고, 특정 경범죄에 대한 관리 및 예방 대책 수립의 기초 자료로 활용될 수 있습니다. 또한, 사회 질서 유지 및 시민 생활 불편 해소를 위한 정책 방향 설정에 참고 자료가 될 수 있습니다.
