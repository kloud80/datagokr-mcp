summary_user: 2024년 기준 서울특별시경찰청 관할 31개 경찰서별로 살인·폭력 죄종 사건의 송치의견별 범죄자 수(인원)를 집계한 통계 파일로, 건별 사건 원천이 아니라 경찰서·죄종·송치의견 단위 집계이며 파일 크기는 약 3.7KB입니다. 연구자나 정책 분석가가 '서울 경찰서마다 살인·폭력 피의자를 기소·불기소 등 어떤 의견으로 송치했는지, 그 비율이 서별로 어떻게 다른가'를 비교할 때 쓴다. 전역 조인 키가 없어 경찰서 이름(구분)을 기준으로 경찰관서 위치나 지역별 범죄 발생·검거 통계와 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 2024년 기준 서울특별시경찰청 관할 내 31개 경찰서별 살인 및  폭력에 해당하는 죄종에 대한 송치의견 통계 현황 자료입니다. 각 경찰서에서 처리한 형사사건 중 살인과 폭력 관련 사건에  대해 수사 결과로 작성된 송치의견을 분석하여 범죄 유형별 처리 경향을 파악할 수 있습니다. 이 자료는 경찰서 단위의 형사 사건 처리 현황을 이해하는 데 중요한 공공데이터입니다. 그리고 범죄통제 정책 수립, 연구기관의 통계 분석 등으로도 활용될 수 있으며 공공의 안전정책과 형사사법 제도 연구에 활용도가 있을 수 있는 공공데이터입니다.
