description_portal: 경찰청 경비국 항공과에서 제공하는 헬기 도입 현황 통계는 1986년부터 2022년까지 경찰이 도입한 헬기의 내역을 보여줍니다. 연도별로 단발 및 쌍발 구분과 기종, 도입 대수를 확인할 수 있습니다(1회성 제공).초기에는 7인승 단발 헬기를 주로 도입했으며, 1995년부터는 15인승 쌍발 헬기와 8인승 A109 쌍발 헬기 도입이 시작되었습니다. 2000년대 이후에는 28인승 MI-172 쌍발 헬기와 14인승 KUH 쌍발 헬기 도입이 주를 이루는 것을 알 수 있습니다. 2021년과 2022년에도 14인승 KUH 쌍발 헬기를 도입한 것을 알 수 있습니다. 이 통계를 통해 경찰 헬기 운용 변화와 전력 증강 추이를 파악할 수 있습니다.
