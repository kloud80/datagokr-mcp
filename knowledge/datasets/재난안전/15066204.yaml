summary_user: 인천소방본부의 119 구조활동 실적을 소방서별로 집계한 파일로, 출동건수·구조(처리)건수·구조인원·미처리(자체처리·허위 등) 건수와 화재·교통사고·수난·기계·승강기·산악·인명갇힘 등 사고종별 구조인원을 담는다(CSV 955바이트 규모의 소규모 집계표). 소방 행정 분석가나 연구자가 '인천에서 어느 소방서 관할의 구조 출동이 많고, 어떤 사고 유형에서 구조인원이 많은가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 소방 데이터(화재 발생, 119안전센터 등)와는 소방서 이름을 기준으로 맞춰 이어 써야 한다.
limits: 소방서 단위 집계라 건별 사고 위치·일시 분석은 할 수 없고, 표준 코드 키가 없어 다른 데이터와는 소방서 이름 매핑으로만 연결된다. 범위는 인천광역시 시도 단위의 비공간 데이터로, 좌표·행정동 수준 분석에는 쓰지 못한다.
