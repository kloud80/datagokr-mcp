description_portal: 한국전기안전공사에서는 일반주택, 소규모 빌딩 등 저압에 해당하는 용량 75kW(제조업 및 심야전력은 100kW) 미만의 일반용 전기설비에 대하여 전기설비의 유지, 운용상태가 적합한지 여부를 설비 유형에 따라 1~3년 주기로 점검하는 업무로 산간·오지의 안전 취약시설부터 수도권 등 도심지역까지 전국 60개 사업소에서 약 2,300만호에 대하여 점검 실시하고 있습니다.법정근거는 전기안전관리법 제12조, 같은 법 시행규칙 제12조에 해당됩니다.이 데이터는 정기점검 재점검 실시현황을 연도별(2015~2024)로  재점검 실시, 재점검 부적합, 개수확인점검 실시, 개수확인점검 부적합, 최종개수, 최종 미개수 건수를 제공합니다.
