summary_user: 한국전기안전공사가 일반용 전기설비 정기점검 뒤 실시한 재점검 결과를 전국 단위 연도별(포털 설명상 2015~2024년) 건수로 담은 집계 파일로, 재점검 실시·부적합, 개수확인점검 실시·부적합, 최종 개수·미개수 건수가 들어 있다. 분석가나 안전 정책 담당자가 정기점검에서 부적합 판정을 받은 설비가 해마다 얼마나 고쳐지고 끝내 미개수로 남는지 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 같은 기관(한국전기안전공사)의 정기점검 통계를 기준으로 맞춰 붙여야 한다.
