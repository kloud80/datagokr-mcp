summary_user: 광주 동부소방서 관할 119안전센터(대인·용산·지산)별로 다중이용업소 수를 업종별로 집계한 소규모 표 파일(csv 약 1KB)로, 업소 건별 원장이 아닌 업종×안전센터 집계를 담는다. 소방 안전관리 담당자나 분석가가 '동구 관내 어느 안전센터 구역에 노래연습장·PC방·음식점 같은 다중이용업소가 많은가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업종명이나 119안전센터 이름으로 맞추거나, 같은 기관의 소방 데이터(화재 발생·소방용수 등)와 이름 기준으로 나란히 놓고 비교한다.
description_portal: 광주광역시 동구 다중이용업소 현황에 대한 데이터로 동부소방서 관할 119안전센터 업종별 수치를 나타내는 자료입니다.다중이용업소는 불특정 다수의 시민이 동시에 이용하는 영업시설을 말합니다. 대표적으로 노래방, PC방, 음식점, 학원, 목욕탕, 영화관, 유흥주점 등이 이에 해당합니다. 이런 업소는 한 번에 많은 인원이 머무는 만큼, 화재나 사고가 발생하면 대규모 인명 피해로 이어질 위험이 크기 때문에 소방에서 특별히 관리합니다.동부소방서 관할 구역은 주거지와 상권, 전통시장, 교육시설이 밀집해 있어 다중이용업소가 다양하게 분포하고 있습니다. 특히 노래연습장, PC방, 음식점이 가장 많으며, 일부는 지하에 위치해 대피가 어렵고 화재 확산이 빠른 구조적 특성을 가지고 있습니다. 이러한 업소들은 「다중이용업소의 안전관리에 관한 특별법」에 따라 소방안전교육과 안전시설 설치가 의무화되어 있습니다.광주 동부소방서 관내 다중이용업소는 시민 생활과 밀접한 공간이지만, 동시에 화재와 안전사고 위험이 높은 시설입니다. 소방서는 철저한 관리와 교육으로 안전을 확보하고 있으며, 시민들이 이용할 때 조금만 주의를 기울인다면 피해를 크게 줄일 수 있습니다. 결국, 다중이용업소 안전은 소방과 업주, 시민이 함께 만들어가는 공동의 과제라고 할 수 있습니다.이 데이터는 동부소방서 각 119안전센터에서 관리하는 관할 구역 내의 업종별 수 등의 정보를 제공합니다.
