summary_user: 경기도(지자체)가 제공하는 소방장비현황으로, 장비 구분·용도 구분·장비명별 보유수량(HLD_QTY_CNT)을 담은 집계 현황이며 위치 정보는 없다. 소방 행정 분석가나 연구자가 '어떤 종류의 소방장비를 용도별로 몇 대씩 보유하고 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 소방 데이터(화재 발생, 119안전센터 등)와는 장비명·구분명 같은 이름으로 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 경기도(지자체)에서 제공하는 소방장비현황에 대한 관련 정보입니다.\""
