summary_user: 광주 동부소방서 소속 119안전센터·구조대별 위치(주소), 관할 행정동, 관할 인구, 1인당 담당인구를 센터 단위로 정리한 소규모 현황표(CSV 306바이트)입니다. 동구 주민이나 분석가가 '우리 동은 어느 안전센터가 맡고, 센터 대원 1명이 몇 명을 담당하나'를 확인하거나 센터별 대응 부담을 비교하는 데 씁니다. 전역 조인 키는 없어서 관할 행정동 이름이나 주소를 기준으로 화재 발생·소방용수 위치 원장 같은 다른 소방 데이터와 이름 매칭으로 잇습니다.
