description_portal: 제설함은 겨울철 눈이 많이 내리는 시기에 시민들이 안전하게 보행하고 차량을 운행할 수 있도록 도로 및 보도에 설치되는 설비입니다.주로 눈이 자주 쌓이는 횡단보도 주변, 언덕길, 학교 앞, 골목길 등 주요 취약 지점에 설치되며, 내부에는 염화칼슘이나 모래 등 제설 자재가 비치되어 있습니다.해당 데이터는 부천시 관내 제설함 위치 데이터로 관리번호, 소재지도로명주소, 소재지지번주소, 위도, 경도, 상세위치, 제설함규격, 염화칼슘주머니수, 염화칼슘배치량, 모래주머니수, 모래배치량, 관리기관명, 데이터 기준일자에 대한 내용이 포함되어 있습니다.※2024년 11월 데이터로 현재 위치 변경한 제설함이 존재할 수 있으니 참고 부탁드립니다.부천시 내 존재하지 않은 데이터는 공백으로 작성하였으니 참고 부탁드립니다.
