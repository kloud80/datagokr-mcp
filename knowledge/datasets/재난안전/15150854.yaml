summary_user: 경기도 3D 스마트 화재감시시스템이 설치된 시설물을 시설 단위로 담은 원장으로, 시설번호·관할소방서·설치센서 수·업종·화기취급 여부·층·지번 위치와 신고번호·발생일자 같은 신고 이력 항목이 들어 있다. 소방·방재 담당자나 분석가가 '어느 시군구·업종에 스마트 화재감시 센서가 몰려 있고, 화기를 다루는 시설 중 센서가 적은 곳은 어디인가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 시도·시군구·법정동 코드와 이름(sido_cd, signgu_nm 등)이나 관할소방서명으로 다른 소방·행정구역 데이터와 맞춰 잇는다.
description_portal: 이 데이터는 경기도의 3D 스마트 화재감시시스템이 설치된 시설물에 대한 정보를 담은 자료로, 각 시설의 기본 식별번호, 최초등록일시, 관할소방서, 설치센서 수, 업종, 화기 취급 여부 등 다양한 정보를 제공합니다. 주요 항목은 ‘시설번호’, ‘최초등록일시’, ‘최종수정일시’, ‘설치센서수’, ‘관할소방서명’, ‘업종’, ‘화기취급여부’, ‘법정동번호’, ‘시도명’, ‘시군구명’, ‘읍면동일련번호’, ‘신고번호’, ‘발생일자’ 등이 있으며, 이를 통해 스마트 방재 장비가 설치된 대상 시설의 공간적 분포, 산업 유형, 위험요인 분포 등을 파악할 수 있습니다. 또한 센서 설치 수량과 신고 이력 등은 위험 시설물 모니터링 및 방재 정책 수립에 참고자료로 활용할 수 있습니다.
