summary_user: 전국 해양사고를 건별로 담은 발생이력으로, 발생 연월일·시각, 관할 해양경찰서, 발생 위치와 사고유형, 원인, 기상상태, 위경도 좌표를 한 행에 기록한다. 해양 안전 분석가나 지자체 담당자가 '어느 해역·관할 해경서에서 어떤 유형의 사고가 어떤 기상일 때 잦은가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관할 해경서 이름이나 사고유형 코드 매핑, 또는 위경도 좌표를 이용한 공간 대조로 연결한다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 재난안전분야 공공데이터를 제공하고 있습니다.- 이에 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 해양사고 발생이력 정보입니다."
