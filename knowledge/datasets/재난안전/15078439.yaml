summary_user: 서울 동작구에 설치된 보안등을 한 개씩 담은 건별 목록으로, 위치명·도로명/지번 주소·위도·경도·설치년도·설치형태(한전주, 벽부주 등)·관리기관을 함께 담는다. 주민이나 생활안전 분석가가 "우리 동네 골목길 중 보안등이 드문 구간은 어디인가"를 지도로 확인하는 데 쓴다. 전역 조인 키는 없어서 위도·경도로 CCTV·안전비상벨 같은 방범시설과 공간 결합하거나, 주소를 이름 매칭해 다른 동작구 데이터와 잇는다.
limits: 동작구 한 개 시군구만 다루므로 다른 구나 서울 전체와 비교하려면 각 구 데이터를 따로 모아야 한다. 표준 코드 같은 공통 키가 없어 다른 데이터와는 좌표나 주소 문자열로만 연결된다.
