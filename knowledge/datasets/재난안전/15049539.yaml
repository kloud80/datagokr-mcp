summary_user: 경상남도 소방의 119 출동 건수를 출동일자별로 집계해 화재·구조·구급·기타(벌집제거·용수공급 등 단순 민원) 출동 건수로 나눠 담은 일 단위 집계 파일이며, 포털 설명상 2024년도 출동을 다룬다. 분석가나 지자체 담당자가 '봄철에 화재 출동이 늘어나는가', '여름에 구조·기타 출동이 몇 건씩 증가하는가'처럼 계절·월별 출동 증감을 살펴보는 데 쓴다. 전역 조인 키는 없고 출동일자로만 날씨·행사 같은 일별 데이터와 맞춰 볼 수 있으며, 다른 소방 데이터와는 기관(경상남도) 단위로만 연결된다.
limits: 경상남도 전체를 합친 시도 단위 일별 건수라 시군·소방서·위치별 비교나 개별 출동 건의 내용은 알 수 없다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 날짜나 기관명으로만 맞춰야 한다.
