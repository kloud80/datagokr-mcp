summary_user: 한국전기안전공사가 일반용전기설비의 설치·변경공사 뒤 전기 공급 전에 한 사용전점검 결과를 점검 건별로 담은 2019년 경상북도 파일로, 점검일자·주소·건물유형·점검결과로 구성된다. 사업자나 분석가가 경상북도에서 어떤 건물유형의 신규·변경 전기설비가 사용전점검에서 부적합 판정을 많이 받았는지 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소 문자열을 매핑하거나 같은 기관의 다른 시도 사용전점검 파일과 컬럼 이름을 맞춰 이어 쓴다.
description_portal: 한국전기안전공사에서는 일반용전기설비의 설치공사 또는 변경공사 완료 후 전기를 공급 받기 전 설치 상태가 기술 기준에 적합하게 시공 되었는지 여부를 점검하고 있습니다.일반용전기설비 사용전점검 관련 법령은 전기안전관리법 제12조 및 같은 법 시행규칙 제11조 입니다. 일반용전기설비의 사용전검검 대상 및 절차 등을 명시하고 있습니다.이 데이터는 한국전기안전공사에서 제공하는 2019년 경상북도 사용전점검 결과 데이터입니다. 점검일자, 주소, 건물유형, 점검결과를 확인하실 수 있습니다.
