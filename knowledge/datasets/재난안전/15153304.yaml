summary_user: 전국 승강기의 안전검사 이력과 부적합 내역을 승강기 고유번호 단위로 담은 원장 데이터로, 건물명·주소·시도·시군구와 함께 승강기 종류·형식·운행층수·정격속도·최대정원·제조업체·설치일, 검사 실시일·검사 종류·판정 결과·검사 유효기간·검사기관을 담는다. 건물 관리자나 이용자가 "우리 건물 승강기가 최근 검사에서 합격했고 유효기간이 언제까지인가"를 확인하거나, 분석가가 지역별·제조사별 부적합 판정 비율을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 승강기 고유번호(ELVTR_UNQ_NO)를 같은 기관의 승강기 데이터와 맞추거나 시도·시군구 이름, 건물 주소를 매핑해 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 승강기 안전검사이력 및 부적합내역 정보입니다.
