description_portal: 경상북도 소방관련 정보(도내 시군별 의용소방대 인원, 남대, 여대 구분)의용소방대는 비상근으로서 소방활동상 필요에 의하여 소집된 때에는 출동하여 소방본부장 또는 소방서장의 소방업무를 보조하는 자발적인 민간봉사단체입니다. 의용소방대는 의용소방대 설치 및 운영에 관한 법률(소방본부장 또는 소방서장은 소방업무를 보조하게 하기 위하여 특별시, 광역시와 시 읍 면에 의용소방대를 두며 그 지역의 주민중 희망하는 사람으로서 구성)에 의거 만들어진 협조 단체입니다.
