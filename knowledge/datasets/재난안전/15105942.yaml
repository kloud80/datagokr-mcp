description_portal: '이 데이터는 "(주)한국가스기술공사"에서 수소충전소의 중대사고를 예방하기 위한 고장모드에 따른 위험도 분포를 정리한 자료입니다. 데이터는 총 5개의 행으로 구성되어 있으며, 각 행은 서로 다른 위험도 수준("고고 위험도", "고 위험도", "중 위험도", "저 위험도", "저저 위험도")을 나타냅니다. 각 위험도 수준에 대해 두 가지 기준으로 분포를 제시하고 있습니다: 첫 번째는 **"위험도 행렬 기준"**으로, 위험의 심각도와 발생 가능성을 교차 평가한 지표이며, 두 번째는 "RPN(Risk Priority Number)" 기준으로, 고장모드 및 영향 분석(FMEA)을 기반으로 도출된 정량적 위험 우선순위입니다.'
