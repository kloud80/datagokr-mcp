description_portal: 본 데이터는 전북특별자치도 내 연도별 기초소방시설 보급 현황을 체계적으로 정리한 통계 자료입니다. 주요 항목으로는 각 연도별 전체 가구수와 보급된 소화기 및 감지기 수량이 포함되어 있습니다. 특히, 소방시설 보급은 예산사업과 비예산사업으로 구분되어 집계되어 있어, 공공재원 투입 여부에 따른 보급 현황을 한눈에 확인할 수 있습니다. 예산사업은 지방자치단체 또는 중앙정부에서 지원하는 재원으로 추진되며, 비예산사업은 자체 예산이나 민간 지원 등으로 진행되는 경우를 뜻합니다. 2010년부터 2016년까지 7년간의 데이터를 통해, 소화기와 감지기 보급량이 전반적으로 증가하는 추세를 볼 수 있습니다. 특히 2016년에는 전체 가구수와 소화기, 감지기 수가 급격히 늘어나면서, 소방 안전 인프라 확충에 큰 진전이 있었음을 알 수 있습니다. 이 자료는 지역사회의 화재 예방과 안전 강화 정책 수립, 예산 배분의 효율성 평가, 향후 소방시설 확충 계획 수립 등에 중요한 기초 자료로 활용됩니다.
