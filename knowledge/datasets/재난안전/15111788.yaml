summary_user: 충주시 안에서 산불이 났을 때 확산 위험이 높은 지점을 관리번호별로 담은 파일로, 읍면동·도로명 주소·위도·경도와 함께 위험 점수(totalScore)와 그 점수로 나눈 상대 등급(totalClass)이 들어 있다. 충주시 재난·산림 담당자나 분석가가 '시내에서 산불 예방 순위를 먼저 매겨야 할 지역은 어디인가', '어느 산림 인접 주민에게 먼저 안내해야 하는가'를 판단하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동 이름이나 주소로 맞추거나 위도·경도로 공간 중첩해 잇는다. 대피소·소방시설 위치 같은 재난안전 데이터와 겹쳐 보는 방식이다.
description_portal: 본 데이터는 2022년 공공데이터 기업매칭 지원사업을 통해 구축된 충청북도 충주시 산불확산위험지역 정보를 제공하는 자료입니다.산불 발생 시 확산 위험이 높은 지역을 사전에 파악하고, 재난 대응 전략 수립 및 예방 사업 추진에 활용하기 위해 구축된 데이터로, 각 지역의 위험도 평가 결과를 포함합니다.데이터는 관리번호, 읍면동, 도로명 주소, 위도·경도 좌표, 산불확산 점수(위험도), 등급 항목으로 구성되어 있으며, 등급은 점수를 기반으로 상대적 위험 수준을 구분한 정보입니다.위험 점수는 풍속, 지형, 식생, 인근 접근도로 등 산불 확산에 영향을 주는 요소들을 반영하여 산출되며, 등급은 보통 1~5등급 또는 고위험/저위험 식으로 분류됩니다.이 데이터는지역별 산불 예방 순위 지정재난관리 예산의 우선 배분소방대응 거점 확보산림 인접지역 주민 안내등 다양한 재난관리 목적에 활용될 수 있습니다.※ 위도·경도 정보는 GIS 기반의 공간정보 분석 및 시각화에 활용 가능하며, 실시간 위험 예측 모델 개발이나 산림정책 기획 시 참고자료로도 유용합니다.
