summary_user: 전국의 상습 도로 결빙 구간을 구간 단위로 담은 데이터로, 필드명으로 보아 구간번호·관리기관명·대표지역·도로노선명·결빙 유형과 구간 시작·끝 좌표, 도로 방향 각도, 형상 정보가 들어 있다. 겨울철 운전자나 도로·재난 분석가가 '내가 다니는 노선에 상습 결빙 구간이 어디 있는가'를 확인하거나 결빙 취약 구간을 지도에 표시하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 관리기관명·도로노선명 같은 이름 매칭이나 시작·끝 좌표를 이용한 공간 결합으로 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 상습 도로 결빙 구간에 대한 정보입니다.\""
