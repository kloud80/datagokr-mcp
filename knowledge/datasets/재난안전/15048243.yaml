summary_user: 전국 시·도 소방본부 아래 설치된 소방서를 한 곳당 한 행으로 정리한 목록으로, 소속 본부명·소방서명·도로명주소·대표 전화번호·팩스번호를 담는다(CSV 파일 약 22KB). 특정 지역을 관할하는 소방서의 위치와 연락처를 찾거나, 시·도별 소방서 수와 분포를 비교하려는 국민·분석가가 쓴다. 공통 조인 키는 없어서 본부명(시·도명)이나 소방서명을 문자열로 맞추거나 주소를 지오코딩해 119안전센터·화재 발생 데이터와 이어 쓴다.
description_portal: '전국  시·도별로 설치된 소방서의 위치, 명칭 등을 포함한 행정 조직 정보를 체계적으로 정리한 자료입니다. 이 데이터는 각 소방서의 명칭, 소속 시·도 본부, 주소,대표 전화번호, 팩스번호 등으로 구성되어 있습니다.     1. 소방 조직의 행정 체계 기반 구조    우리나라의 소방 조직은 시도소방본부(광역자치단체) → 소방서(기초 단위 재난 대응 기관) → 119안전센터 및 지역대 순으로 구성됩니다.    이 데이터는 그중 "소방서"를 중심으로 시도별 전체 현황을 정리한 것으로, 광역 행정구역별 대응 인프라의 공간 분포와 밀도, 조직 구성을 파악할 수 있는 근간이 됩니다.    2. 포함 정보 항목     - 시도본부명: 소방서가 속한 상위 광역자치단체(예: 서울특별시, 경기도 등)     - 소방서명: 각 지역별 소방서의 고유 명칭     - 주소: 도로명주소 기반의 상세 위치 정보 (건물번호 포함)     - 전화번호: 민원 및 소방업무 관련 연락 가능한 대표  번호     - 팩스번호: 민원 및 소방업무 관련 팩스 번호'
