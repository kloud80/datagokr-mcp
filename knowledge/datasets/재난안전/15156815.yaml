description_portal: 한전KDN은 감전재해 감축을 위해 올바른 정책 방향의 기초 데이터를 제시하고 감전 재해의 발생추이를 분석하여 예방 대책을 도출하기 위해 매년 전기재해 통계분석집을 발간하고 있습니다. 이 데이터를 통해 본사와 협력회사의 2022부터 2024년까지 산업재해 현황 데이터를 통해 부상자 수, 사망자 수, 근로손실재해율(LTIFR) 등 주요 지표를 파악할 수 있습니다.이 데이터를 통해 사고의 빈도와 유형을 분석하고, 위험 요소를 미리 식별하여 사고 예방에 활용할 수 있습니다. 또한, 이 데이터는 안전 관리 시스템의 기초 자료로 사용되어, 예방 대책을 수립하고, 안전 교육 및 훈련의 효과를 평가하는 데 유용하게 활용됩니다.
