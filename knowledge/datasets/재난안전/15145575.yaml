description_portal: '서울시에서 제공하는 자치구별 안심귀가 스카우트 이용현황입니다.용어 설명 : 안심귀가 스카우트는 늦은 밤, 여성·청소년 등 범죄 취약계층이 안전하게 귀가할 수 있도록 2인 1조의 스카우트 대원이 도보로 동행해 주는 서울시의 안전지원 사업입니다. 스카우터들은 단순 동행에 그치지 않고, 우범지역 순찰과 범죄예방 캠페인도 함께 수행합니다. 운영 시간: 월요일: 오후 10시 ~ 자정 (22:00~24:00)화요일 ~ 금요일: 오후 10시 ~ 익일 1시 (22:00~01:00)단, 1~2월(겨울) 및 **78월(여름)**은 단축 운영 (화금요일: 22:00~24:00), 월요일 휴무'
