description_portal: '○ 통계개요* 통계명 : 뺑소니 교통사고 현황* 통계종류 : 서울시 뺑소니 교통사고 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「도로교통법」에 의거 차의 교통으로 발생한 인적 피해를 수반하는 사고* 작성목적 : 교통사고를 종합적이고 체계적으로 분석하여 교통안전대책 수립, 학술연구등의 기초자료 및 국민의 교통안전의식 제고에 활용하는 것을 목적으로 함* 조사체계 : 교통사고조사 경찰관 → 경찰청, 도로교통공단* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 뺑소니사고건수, 사망자수, 부상자수 등○ 용어설명* 교통사고 : 도로교통법 제2조에 규정하는 도로에서 차의 교통으로 인하여 발생한 인적,물적피해가 따르는 사고(단,1984년부터의 통계는 인적피해 사고만을 의미하며 물적 피해사고는 미포함)* 뺑소니 : 교통사고 후에 도주하는 것(대법원 판례는 인명피해가 발생한 경우에 뺑소니에해당한다고 보는데, 운전자가 교통사고를 낸 후 피해자에 대해 적절한 조치없이 도주하는 것을 의미함)* 사망자수 : 교통사고 발생시로부터 30일 이내에 사망한 경우(99년까지는 72시간 이내)* 부상자수 : 중상자수+경상자수+부상신고자수** 중상 : 교통사고로 인하여 3주 이상의 치료를 요하는 부상을 입은 경우** 경상 : 교통사고로 인하여 5일 이상 3주 미만의 치료를 요하는 부상을 입은 경우** 부상신고 : 교통사고로 인하여 5일 미만의 치료를 요하는 부상을 입은 경우○ 기 타* 지방경찰청 단위가 아닌 사고발생지역 단위(서울시) 기준임'
