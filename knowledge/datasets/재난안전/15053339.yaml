summary_user: 시설물 사고를 건별로 담은 데이터로, 사고명·사고일자·시설물명·종류·주소, 사고 발생 단계와 부위, 원인·내용, 사망·부상자 수와 재산피해액을 전국 범위에서 개별 주소 단위로 제공한다. 시설물 관리자나 안전 분석가가 '교량·건축물 같은 시설 종류별로 어떤 부위에서 어떤 원인의 사고가 반복되는가'를 확인하고 점검 계획에 반영하는 데 쓴다. 전역 조인 키가 없어 다른 시설 안전 데이터와는 시설물명·주소 같은 이름 매핑이나 같은 기관 데이터 기준으로만 이어 쓴다.
limits: 실측 컬럼에 시설물 번호 같은 공통 키가 없어 안전등급·점검 결과 원장과 정확히 1:1로 연결되지 않으며, 이름·주소 매칭에 기대야 한다. 개발계정은 하루 10,000회까지 호출된다.
