description_portal: 서울특별시 광진구 민방위대피시설 인허가 정보는 광진구 내 민방위사태, 재난, 전시 또는 비상상황이 발생할 경우 주민들이 신속하게 대피할 수 있도록 마련된 시설들의 인허가 현황을 제공하는 데이터입니다. 해당 데이터에는 대피시설명, 소재지 주소, 인허가 일자, 인허가 상태(정상, 폐쇄 등), 시설유형, 지정기관, 건물용도 등의 정보가 포함되어 있으며, 실제 대피 시 활용 가능한지 판단할 수 있도록 다양한 행정 정보가 제공됩니다. 이를 통해 재난 대비 및 민방위 계획 수립, 지역별 안전망 확보 현황 분석에 활용할 수 있습니다. 좌표 정보는 중부원점TM(EPSG:2097) 기준으로 제공되며, 위경도 좌표는 포함되어 있지 않습니다. 본 데이터는 3일 전 기준으로 최신 정보를 반영하여 제공됩니다.
