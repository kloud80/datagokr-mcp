description_portal: 이 데이터는 대구광역시 수성구 관할 지역에 설치된 비상급수시설 현황을 수집·정리한 자료입니다. 비상급수시설은 재난·재해 등으로 상수도 공급이 중단될 경우 주민들에게 생활용수를 제공하기 위해 구축된 공공시설입니다. 데이터에는 시설 번호, 행정동, 시설명, 주소, 저장 용량(톤), 심도(미터), 주요 용도, 개방 여부, 설치 연도, 위도·경도 좌표 등이 포함됩니다. 또한 시설별 수질검사 결과(1~4회차)와 관리주체 정보가 함께 제공되어 시설 안전성과 운영 상태를 확인할 수 있습니다. 본 데이터는 재난 대응 계획 수립, 지역 내 급수 취약지 분석, 공공 안전망 강화, GIS 기반 위치 안내 서비스, 주민 생활 안전 및 환경 연구 등 다양한 분야에서 활용될 수 있는 기초 자료입니다.
