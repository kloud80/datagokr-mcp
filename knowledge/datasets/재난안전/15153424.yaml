summary_user: 전국을 범위로 어린이(13세 이하) 대상 범죄가 우려되는 주의구간을 한 건씩 담고, 각 구간에는 유형(TYPE_NM)과 등급(GRD), 시도·시군구 코드, 도형 정보가 붙는다. 학부모나 학교·지자체 담당자가 "우리 동네 통학로 주변에 아동범죄 주의구간이 있고 등급은 어느 정도인가"를 확인하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 다른 생활안전지도·범죄 발생 데이터와는 시도·시군구 코드 매핑이나 이름 대조로 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 어린이(13세이하) 대상 범죄발생현황 정보입니다.\""
