summary_user: 한국산업안전보건공단 인증원이 안전인증한 보호구를 인증번호 한 건씩 담은 원장 파일로, 신청·제조 사업장명, 인증일자, 인증품명·형식모델, 용량등급·정격, 인증 취소·반납 사유와 일자를 포함한다. 사업장 안전관리자나 구매 담당자가 '납품받는 보호구가 유효한 안전인증을 받았는지, 인증이 취소·반납되지는 않았는지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 제조사업장명·인증번호 같은 이름·번호 매칭으로만 이어 쓴다.
