description_portal: 한국산업안전보건공단 인증원에서 제공하는 보호구 인증 현황으로 인증품명, 안전인증번호, 제조사업장, 형식 모델, 인증품목명,정격 등을 확인할 수 있도록 보호구에 대한 정보를 제공합니다.*산업안전보건법 제83조(안전인증기준) ① 고용노동부장관은 유해하거나 위험한 기계ㆍ기구ㆍ설비 및 방호장치ㆍ보호구(이하 "유해ㆍ위험기계등"이라 한다)의 안전성을 평가하기 위하여 그 안전에 관한 성능과 제조자의 기술 능력 및 생산 체계 등에 관한 기준(이하 "안전인증기준"이라 한다)을 정하여 고시하여야 한다.② 안전인증기준은 유해ㆍ위험기계등의 종류별, 규격 및 형식별로 정할 수 있다.
