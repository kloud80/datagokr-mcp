description_portal: 10년간의 통계를 살펴보면, 전체 피해 규모는 2019년(남성 21,424건, 여성 16,243건)에 정점을 기록한 후 감소세를 보이다 최근 다시 반등하는 양상을 보입니다. 성별로는 대체로 남성의 피해 건수가 여성보다 높게 나타나는 경향이 뚜렷합니다. 특히 2022~2024년 사이에는 남성 피해가 여성보다 약 1.3~1.9배가량 많아지며 성별 격차가 크게 벌어지기도 했습니다.그러나 2025년 데이터에서는 여성 피해가 11,202건으로 전년 대비 약 25% 급증하며 남성(12,158건)과의 격차를 다시 좁히고 있습니다. 이는 과거 남성 중심의 대출 빙자형 사기뿐만 아니라, 최근 여성을 타깃으로 한 기관 사칭형 등 변종 수법이 다시 기승을 부리고 있음을 시사합니다. 결과적으로 특정 성별에 국한되지 않는 전방위적인 예방책 마련이 시급한 시점입니다.
