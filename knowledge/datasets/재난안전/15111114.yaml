description_portal: 대전광역시 2021년 특사경 목표관리제(MBO)계획 자료는 연간 특별사법경찰의 단속, 수사 등 민생범죄 예방과 공공질서 확립을 위한 중점 추진 목표와 관리 지표, 달성 전략, 부서 별 책임 분담 및 세부 실천 계획을 포괄적으로 담고 있습니다. 형사소송법 근거에 따라 수립된 본 계획에는 지명 7대 분야 단속 일정 등 특사경 조직의 업무 계획이 세부적으로 정리되어 있습니다. 이를 통해 각종 불법 행위 근절, 시민 생활 안전 강화, 범죄 예방 효과 창출을 위한 전략적·체계적 대응이 가능합니다. 본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
