description_portal: '인명 피해 우려 지역은 자연재해나 사고 발생 시 인명 피해가 발생할 가능성이 높은 지역을 의미합니다.여름철 인명피해 우려지역은 태풍, 호우 대비 인명피해 최소화를 위해 시도별 인명피해 우려지역을 지정, 관리하며  산사태, 급경사지, 저수지·댐, 자연재해위험개선지구, 경사지 태양광, 침수취약시설, 해안시설, 여가시설 등으로 분류하여 관리합니다.○ 인명 피해 우려 지역의 예시  - 침수 위험 지역: 하천 주변, 저지대, 지하차도 등 집중호우 시 침수될 가능성이 높은 지역.   - 산사태 위험 지역: 급경사지, 산림 붕괴 위험 지역 등 산사태 발생 시 인명 피해가 우려되는 지역.   - 급경사지 : 택지·도로·철도 및 공원시설 등에 부속된 자연 비탈면, 인공 비탈면(옹벽 및 축대 등 포함) 또는 이와 접한 산지.'
