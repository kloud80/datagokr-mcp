description_portal: '○ 통계개요* 통계명 : 5대범죄 발생현황* 통계종류 : 경찰청의 5대범죄의 발생 및 검거 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 범죄의 검거현황과 유형의 변화추이 등을 조사ㆍ측정하여 범죄의예방과 검거 대책수립 등 형사대책 및 사회정책수립에 기초자료를제공하는 것을 목적으로 함* 조사체계 : 서울지방경찰청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 5대범죄(살인, 강도, 강간, 절도, 폭력)의 발생, 검거 건수 등○ 용어설명* 발생건수 : 주기 내 총범죄 발생 건수* 검거건수 : 주기 내 총범죄 검거 건수* 폭력 : 공갈, 손괴, 상해, 폭행, 체포ㆍ감금, 협박, 약취유인, 폭력행위 등○ 기 타* 2010년부터 강간에 "성폭력범죄의 처벌 및 피해자보호 등에 관한 법률", "아동ㆍ청소년의 성보호에 관한법률"에 의한 범죄 포함됨* 구별은 경찰관서별 주소지 기준임(서울지방경찰청은 종로구에 포함되며 검거건수만 집계)○ 출 처 : 서울지방경찰청 형사과'
