summary_user: 경기도 31개 시군의 민방위 대피시설을 시설 한 곳당 한 건으로 담으며, 관리번호·인허가일자·영업상태·도로명/지번 주소·시설면적·좌표(X, Y)·시설구분을 포함한다. 주민이나 지자체 담당자가 '우리 동네에서 비상시 가장 가까운 대피시설은 어디이고 수용 면적은 얼마인가'를 확인하거나 대피 안전지도를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 시설명 매칭으로 잇는다. 같은 대피·구호시설 부문의 지진/해일 대피장소, 무더위/한파쉼터, 재난 위험지역 데이터와 위치 기준으로 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 31개 시군에 위치한 민방위 대피시설에 대한 인허가 정보를 담고 있으며, 민방위사태 또는 비상사태 발생 시 시민이 대피할 수 있는 공간의 정보를 제공합니다. 주요 항목에는 관리번호, 인허가일자, 인허가취소일자, 상세 영업상태 및 폐업일자, 소재지 정보(도로명주소, 지번주소, 우편번호), 시설면적, 시설명, 사업장명, 좌표정보(X, Y), 시설구분 등이 포함됩니다. 해당 데이터는 민방위 관련 시설의 개설 및 운영 상태를 파악하거나 재난 발생 시 신속한 대피 안내 시스템 구축 등에 활용될 수 있습니다. 특히, 각 시설의 도로명주소 및 좌표 정보를 통해 GIS 기반의 대피 경로 시각화 및 안전지도 제작에 유용하게 사용될 수 있습니다. 데이터는 행정안전부에서 수시로 갱신하며, 지방행정 데이터 개방시스템을 통해 제공됩니다. 상업적 이용 및 콘텐츠 변경이 가능하며, Open API 형식으로도 활용할 수 있어 자동화된 시스템 연동이 가능합니다.
