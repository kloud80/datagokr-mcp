summary_user: 한국승강기안전공단 승강기 안전인증 업무에서 '모델관리번호–공장' 조합을 한 행으로 하여 기본모델명, 공장명, 업태, 접수번호, 발행일자, 안전인증서 변경건수 등을 담은 전국 단위 파일 데이터(CSV 약 1MB)다. 승강기 부품·모델 제조사나 분석가가 특정 인증 모델이 어느 공장에서 생산되며 인증서가 몇 차례 변경됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 인증·제원 자료와는 모델관리번호나 기본모델명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: '본 데이터는 한국승강기안전공단의 승강기 안전인증 업무에서 모델별 생산 거점 정보를 체계적으로 관리하기 위한 기준 자료입니다. 각 행은 ‘모델관리번호–공장’ 조합을 단위로 하며, 기본모델명, 공장명, 업태(제조/건설/서비스 등), 접수번호와 발행일자 등 행정 식별정보를 포함합니다. 인증의 변동 사항을 파악할 수 있도록 ‘안전인증서 변경건수’와 ‘안전인증서번호 변경건수’를 별도 컬럼으로 보유하며, 동일 모델의 공장 변경·이전 등 이력성 정보를 기록합니다. 일부 항목에는 모델제원값(예: 스위치 방식 등)과 발행일자 기준 적용환율이 병기되어 시점별 사양과 환율 정보를 함께 확인할 수 있습니다. 자료의 범위는 공단에 접수되어 인증이 발행(또는 변경)된 모델에 한정되며, 시험 세부 결과나 적합 판정 수치, 생산량 정보는 포함하지 않습니다. 표준화된 코드·명칭 체계를 사용해 다른 인증·제원 자료와의 연계를 전제로 구성되어 있으며, 날짜·숫자형 필드는 발행 또는 접수 기준으로 기록됩니다.'
