summary_user: 서울시 지진옥외대피소를 대피소 한 곳씩 담은 원장으로, 시설번호·수용시설명·시군구·법정동/행정동 코드·상세주소·시설면적·경위도 좌표를 포함한다. 시민이 '지진이 나면 우리 동네 어디로 대피하나'를 찾거나, 분석가가 구별 대피소 분포와 면적 기준 수용 규모를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 대피·구호시설 데이터와는 법정동·행정동 코드나 시군구명 매핑, 또는 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 서울시 지진옥외대피소 데이터는 지진 등 재난 발생 시 시민이 대피할 수 있는 옥외대피소의 위치와 규모, 행정구역 정보를 제공하는 자료입니다. 시설번호, 시설일련번호, 수용시설명으로 개별 대피소를 식별할 수 있으며, 시도명, 시군구명, 법정동코드, 행정동코드, 상세주소를 통해 행정구역별 대피소 분포와 위치를 정확히 파악할 수 있습니다. 시설면적 정보는 대피소의 수용 가능 규모를 평가하는 데 활용되며, 경도·위도 및 X·Y좌표는 지도 서비스, 내 주변 대피소 찾기, 공간분석 등에 활용되어 지진 대비 안전망 구축에 중요한 기초 자료로 쓰입니다.
