summary_user: 구미시 관내에 설치된 생활 방범 CCTV를 설치 지점 한 곳당 한 행으로 담은 현황 데이터로, 읍면동·지번주소·도로명주소·상세위치와 카메라 수량(camera_qy), 관리번호를 포함한다. 주민이 우리 동네 어디에 방범 CCTV가 있는지 확인하거나, 분석가·지자체가 읍면동별 CCTV 분포와 밀집도를 비교해 방범 사각지대를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름이나 주소 문자열을 매칭하거나 주소를 좌표로 변환해 이어 붙여야 한다.
limits: 범위가 구미시 한 곳이라 다른 시군구와 직접 비교할 수 없다. 표준 행정코드 같은 공통 키가 실측 컬럼에서 확인되지 않아 범죄 통계·인구 등 다른 데이터와 연결하려면 이름·주소 매핑이 필요하다. 개발계정은 하루 5,000회로 호출이 제한된다.
