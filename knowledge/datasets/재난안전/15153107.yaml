summary_user: 불법으로 운행되는 승강기에 대한 신고 내역을 신고일자, 시도, 신고유형, 승강기 구분·형식·세부형식·종류 단위로 담은 전국 범위의 비공간 데이터다. 안전관리 분석가나 지자체 담당자가 어느 시도에서 어떤 종류·형식의 승강기에 불법운행 신고가 많은지, 신고 추이가 어떤지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 승강기 고유번호가 없어 승강기 원장·점검 결과와는 바로 이어 붙일 수 없고, 시도명이나 승강기 종류·형식 같은 이름을 맞춰 집계 수준에서만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 불법운행승강기신고 관련 정보입니다.\""
