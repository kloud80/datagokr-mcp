description_portal: 대전광역시_어린이방범용CCTV 자료는 대전시 내 초등학교 주변, 어린이보호구역 등 어린이 안전이 특히 요구되는 주요 위치에 설치된 어린이방범용 CCTV의 위치, 개소 수, 관리현황 등 상세 정보를 제공합니다. 해당 데이터는 어린이 대상 범죄 및 위험 상황의 예방을 위한 주요 기반자료로, 자치구별 설치 현황, 유지·보수 이력, 작동 여부 등 세부적인 관제 정보를 포함하고 있습니다. 어린이 보호 및 방범 목적의 현장감시, 범죄 예방 효과 분석, 실시간 현장 대응, 정책적 안전 대책 수립, 지역사회 안전 강화 등 다방면에서 활용될 수 있습니다.2022년 대전광역시 공공데이터 기업매칭사원사업으로 개발한 데이터입니다.
