summary_user: 대전광역시 초등학교 주변·어린이보호구역 등에 설치된 어린이방범용 CCTV를 개소별로 담은 건별 원천 데이터로, 관리번호·관리기관·CCTV명·지번/도로명 주소·좌표·관할 경찰서를 담는다. 학부모나 지역 안전 분석가가 "우리 아이 통학로 주변에 방범 CCTV가 어디에 있는가", "CCTV가 부족한 학교 주변은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소·좌표(crdntX, crdntY)로 학교·어린이보호구역·안전비상벨 같은 위치 데이터와 공간 결합하거나 관할 경찰서 이름으로 묶어 쓴다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 데이터와는 주소 문자열·좌표·기관명 매핑으로만 연결된다. 포털 설명에 있는 유지·보수 이력이나 작동 여부는 실측 필드 목록에서 확인되지 않는다. 범위는 대전광역시에 한정된다.
