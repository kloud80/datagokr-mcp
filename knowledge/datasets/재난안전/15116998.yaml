summary_user: 부산광역시 동래구 안에서 재난 이재민 수용시설로 지정된 학교·체육관·주민센터 등을 시설 한 곳(세부 수용공간)마다 한 행으로 담은 원장 파일로, 주소·위도·경도와 수용가능면적·인원, 내진설계 여부, 사용여부, 지정일자를 포함한다(CSV 약 5.8KB). 주민은 '우리 동네에서 재난 때 이재민으로 어디에 머물 수 있나'를, 구청·분석가는 '동별 수용가능인원이 인구에 비해 충분한가'를 확인하는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 데이터와는 좌표(위도·경도)나 주소·지역명 문자열로 맞춰 대피소·무더위쉼터 등 다른 대피·구호시설 데이터와 함께 지도에 겹쳐 쓴다.
description_portal: '본 데이터는 부산광역시 동래구 관내 재난 발생 시 이재민을 안전하게 수용하기 위해 지정된 수용시설에 대한 현황 정보를 포함하고 있으며,재해·재난 대응계획 수립, 위기상황 대비 훈련, 지역안전관리 체계 강화 등을 위한 기초 인프라 자료로 활용됩니다.자료는 CSV 형식으로 제공되며, 다음과 같은 주요 항목으로 구성되어 있습니다:지역명: 시설이 위치한 행정구역 단위시설구분: 학교, 체육관, 주민센터, 종교시설 등 시설 유형시설명: 수용시설의 공식 명칭상세시설명: 해당 시설 내 실제 수용공간의 명칭(예: ○○학교 체육관)상세주소: 도로명 기반의 위치 정보위도 / 경도: 시설의 GPS 좌표 정보수용가능면적(㎡): 이재민 수용에 활용 가능한 공간 면적수용가능인원(명): 해당 시설에 수용 가능한 최대 인원 수대표전화: 시설 관리자 또는 대표 연락처내진설계 여부: 건축물의 내진 성능 확보 여부사용여부: 현재 수용시설로 지정 및 활용 가능한 상태인지 여부지정일자: 해당 시설이 재난 이재민 수용시설로 지정된 날짜이 데이터를 통해 동래구 내 재난 시 대피 및 수용계획을 공간 기반으로 체계적으로 수립할 수 있으며해당 데이터는 정기적으로 검토 및 갱신되며, 시설의 실제 운영 가능 여부나 이용 조건, 협력 기관 현황 등 추가 정보가 필요한 경우에는부산광역시 동래구청 도시안전과 또는 관련 부서를 통해 확인하시기 바랍니다.'
