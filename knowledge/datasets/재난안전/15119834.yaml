summary_user: 경기도 안전특별점검단이 관리하는 안전취약시설물(시설물안전법상 정기점검·정밀진단 결과 D·E등급 시설) 현황을 시설 한 건당 한 행으로 담으며, 시군명·대상명·준공년도·안전등급·규모·관리대상(민간/공공)을 포함한다. 주민이나 지자체 담당자가 '우리 시군에 보수·보강이나 사용제한이 필요한 노후 연립주택·교량이 어디 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설 안전 데이터와는 시군명·시설명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 안전특별점검단에서 제공하는 자료로, 경기도 내 재난예방을 위해 관리되고 있는 안전취약시설물 현황을 담고 있습니다. 안전취약시설은 「시설물의 안전 및 유지관리에 관한 특별법(시설물안전법)」에 따라 정기 안전점검 또는 정밀진단 결과 안전등급이 D등급(보수·보강 필요) 또는 E등급(위험, 사용제한 필요)으로 분류된 시설물을 말합니다. 데이터는 시군명, 대상명, 준공년도, 안전등급, 규모(층수 또는 교량의 길이/폭), 관리대상(민간/공공)으로 구성되어 있으며, 노후 연립주택, 아파트, 상가, 교량 등 다양한 구조물의 상태를 포함합니다.
