description_portal: 이 데이터는 경찰청에서 제공하는 사이버범죄 세부유형별 발생 및 검거 현황 자료로서, 연도별로 다양한 사이버범죄 유형별 발생 및 검거 건수를 상세히 기록하고 있다. 데이터는 연도, 구분, 해킹(계정도용), 해킹(단순침입), 해킹(자료유출), 해킹(자료훼손), 서비스거부공격, 악성프로그램, 정보통신망 침해형 범죄, 사이버 음란물(일반·아동·불법촬영물유포), 사이버 도박(스포츠토토, 카지노 등), 사이버 명예훼손(모욕), 사이버 스토킹, 기타 불법 컨텐츠 등 다양한 항목으로 구성된다. 이를 통해 사이버범죄의 세부 유형별 발생 추이와 대응 현황을 파악할 수 있으며, 경찰의 사이버범죄 예방 및 대응 강화에 유용하게 활용될 수 있다. 특히 사이버범죄 발생 패턴과 검거율 분석을 통해 국민 보호와 정보보안 강화를 위한 정책 수립에 기여할 수 있는 기초자료로 중요하다.* 사이버음란물 항목의 경우 2019년도부터 통계로 집계되므로 14~18년도는 0건으로 표시됩니다.* 사이버스토킹은 2021년부터 전담부서가 변경(여성청소년수사과)됨으로 인해 0건으로 표시됩니다.
