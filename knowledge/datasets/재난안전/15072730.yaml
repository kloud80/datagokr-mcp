summary_user: 대전광역시에서 2022년 한 해 동안 발생한 화재를 지역별로 집계·분석한 엑셀 파일로, 사망·부상 인명피해, 발화 요인별 분류, 화재 유형별 빈도를 담는다(포털 설명 기준). 소방 관계자나 분석가가 '대전에서 어떤 발화 요인과 지역에 화재가 몰렸는가'를 보고 예방 대책과 자원 배분 근거를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 대전광역시 화재 발생 현황 분석 자료는 2022년 한 해 동안 발생한 모든 화재 사례를 지역 별 정보에 따라 집계·분석한 데이터로, 인명피해 통계(사망·부상자), 발화 요인 별 분류, 유형 별 빈도 등 화재 발생 경향 등이 포함됩니다. 이 자료는 반복 발생 요인과 취약 지역, 고위험 발화 요인을 식별하여 지방자치단체나 소방 관계 기관이 화재 예방 정책, 위험 요인 집중 관리, 효율적 자원 배분 및 맞춤형 안전 대책을 수립하는 데 근거 자료로 활용됩니다. 특히 소방 관할 구역 별 비교 분석을 통해 지역 별 대응 역량과 정책 효과를 평가하여, 향후 유사 사고 재발 방지와 화재 안전 대책 마련 등에 활용될 수 있습니다.
