summary_user: 충청북도 전역의 민방위 대피시설을 시설 한 곳당 한 행으로 담은 원장 파일로, 시설명·시설구분·주소·위도·경도·면적·대피가능 인원수·개방여부·평상시 활용 유형·관리기관명과 전화번호를 포함한다. 도민이나 지자체 담당자가 "우리 동네에서 가장 가까운 대피시설은 어디이고 몇 명까지 들어갈 수 있나"를 확인하거나, 시군별 대피 수용능력을 점검하는 데 쓴다. 데이터 안에 법정동코드 같은 전역 조인 키가 없으므로, 다른 대피·구호시설 데이터나 행정구역 자료와는 주소 문자열이나 위도·경도 좌표를 기준으로 공간 매칭해 이어 쓴다.
description_portal: 이 데이터는 충청북도 전역에 분포된 민방위대피시설의 위치 및 기본 현황 정보를 포함하고 있으며, 정기적으로 갱신되지 않는 수시 제공 데이터입니다. 주요 항목은 시설명, 시설 구분, 주소, 위도, 경도, 면적, 대피가능 인원수, 개방 여부, 평상시 활용유형, 관리기관 유형, 관리기관명 등으로 구성되어 있습니다. 이를 통해 도내 민방위시설의 지리적 분포 및 수용능력을 파악할 수 있으며, 재난 발생 시 신속한 대피 안내, 민방위 훈련 계획 수립, 안전 인프라 점검 등 다양한 활용이 가능합니다. 특히 위치 정보(GPS 좌표)를 포함하고 있어 지도 기반 시스템이나 응급 대응 플랫폼과의 연계에도 적합한 자료입니다.
