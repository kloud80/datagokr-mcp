description_portal: 대전광역시 자율방범대 운영 및 예산 현황 자료는 2021년 한 해 동안 대전시 관내 자율방범대의 운영 실적과 예산 집행 내용을 통합 정리한 데이터입니다. 본 자료는 방범대 별 조직 인원, 순찰 횟수, 활동 구역, 참여 실적 등 활동 내역과 함께, 연간 예산 배정액, 예산 항목 별 사용 현황, 장비 지원 등 재정 집행 실적을 포함하고 있습니다. 자율 방범대는 지역 주민의 참여를 기반으로 지역 범죄 예방, 청소년 선도, 야간 순찰, 취약 지역 모니터링 등의 활동을 수행하며 지역 공공 안전망의 핵심적 역할을 담당하고 있습니다. 해당 자료는 방범대 운영의 효율성 분석, 향후 예산 지원 계획의 타당성 검토, 인력·장비 보완 방향 설정 등 정책 수립에 기초 자료로 사용될 수 있습니다. 본 자료 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
