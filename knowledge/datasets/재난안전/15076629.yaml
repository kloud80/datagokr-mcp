description_portal: '이 자료는 제주특별자치도가 제공하는 “안전데이터분석자료-03: 초등학교 주변 위험 선택지점 데이터”로, 제주 지역 내 초등학교 주변에서 주민들이 직접 ‘위험하다고 느낀 지점’ 정보를 정리한 데이터셋입니다. 각 데이터 항목에는 학교명, 해당 지점의 위도·경도, 그리고 해당 위치를 ‘위험’ 또는 ‘주의 필요’로 판단한 이유(위험지역 사유)가 포함되어 있으며, 총 6,779건의 기록이 CSV 형식으로 제공됩니다. 이 데이터는 보행자 안전 개선, 스쿨존 정비, GIS 기반 안전지도 작성, 위험구간 모니터링 및 정책 우선순위 설정 등 다양한 공공 안전·통학 환경 개선 활동을 위한 기초자료로 활용될 수 있습니다.'
