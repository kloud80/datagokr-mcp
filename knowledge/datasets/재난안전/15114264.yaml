summary_user: 충청북도 청주시 도로 등에 설치된 그늘막을 한 곳씩 담은 건별 현황으로, 시도·시군구·읍면동, 설치장소와 도로명·지번주소, 유형(고정형·스마트), 전체높이, 펼침지름, 설치일시를 담는다. 시민이나 담당 공무원이 "폭염 때 우리 동네 횡단보도 근처에 그늘막이 어디 있고 스마트형인지"를 확인하거나, 읍면동별 그늘막 분포를 비교하는 데 쓴다. 전역 조인 키나 좌표 컬럼은 없어서, 다른 대피·쉼터 데이터와는 읍면동 이름이나 주소를 맞춰 붙여야 한다.
description_portal: 충청북도 청주시의 그늘막 설치 현황 데이터로 그늘막이 설치되어 있는 시도, 시군구, 읍면동, 장소 및 그늘막의 유형, 높이, 설치일자 등을 제공합니다. 그늘막은 폭염 피해 등을 예방하고 줄이기 위하여 도로 등에 설치하는 구조물로 한낮에 천막 등을 펼처서 그늘을 만드는 시설을 의미합니다. 고정형 그늘막은 보통 바닥에 고정된 파라솔 형태이며, 스마트 그늘막은 온도, 바람, 시간에 따라 자동으로 접히고 펴지는 그늘막을 말합니다.* 본 데이터는 2023년 6월 기준으로 공공데이터 포털 공공데이터 제공 신청 건에 대하여 제공하는 공공데이터입니다.
