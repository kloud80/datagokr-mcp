summary_user: 전국 무더위쉼터를 시설 한 곳당 한 건으로 담으며, 쉼터명·상세주소·면적·이용가능인원, 선풍기·에어컨 보유 수, 야간·주말 개방 및 숙박 가능 여부, 운영시간, 경위도 좌표를 포함한다. 폭염 때 주민이 '우리 동네에서 주말·야간에 문을 여는 가까운 쉼터는 어디인가'를 찾거나, 분석가가 지역별 쉼터 수용인원과 냉방 설비를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역코드(ARCD)·관리부서코드 같은 기관 내부 코드, 시설명·주소 매칭, 또는 경위도 좌표를 이용한 공간 결합으로 이어 쓴다.
description_portal: 쉼터시설번호, 년도, 지역코드, 시설구분, 쉼터명칭, 상세주소, 면적, 이용가능인원, 냉방기보유선풍기, 냉방기보유에어컨 등 무더위쉼터 데이터를 제공합니다.
