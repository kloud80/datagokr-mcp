description_portal: 당진도시공사 CCTV 운영현황은 공사 관리 사업장(박물관, 수목원, 캠핑장, 스포츠센터 등)의 시설안전, 화재예방, 범죄예방을 위해 운영된다. 총 557대 이상의 카메라가 설치되어 있으며, 24시간 연중무휴 촬영 후 30일간 자동 저장·보관한다. 추가 위탁 시설 또는 설치가 필요한 시설이라면 추가 설치 할 수있다. 당진도시공사의 모든 CCTV는 당진도시공사 영상정보처리기기 운영관리방침에 따라 운영되며, 개인정보 보호를 준수한다. 자세한 내용은 공사 홈페이지에서 상세 방침 공개 중이다.
