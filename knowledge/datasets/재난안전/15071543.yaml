summary_user: 서울시에 설치된 민방위 비상급수시설을 시설 한 곳씩 담은 인허가 원장으로, 인허가·취소일자, 영업상태(운영·휴업·폐업 등), 시설구분, 설치 건물·위치, 지번·도로명 주소, 좌표(X·Y), 소재지면적, 지정 해제일자를 포함한다. 재난 시 우리 동네에서 지금 쓸 수 있는 비상급수시설이 어디에 있는지 확인하려는 시민이나, 자치구별 비상급수 인프라 분포와 해제 추이를 분석하는 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 대피·구호시설 데이터와는 주소·좌표나 시설명 매칭, 또는 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: 서울시 민방위급수시설 인허가 정보는 서울시에 설치·관리되는 민방위 비상급수시설의 행정 이력과 위치·시설 특성을 파악할 수 있는 공공데이터입니다. 인허가일자·인허가취소일자와 영업(운영)·휴업·폐업·재개업 등 영업상태 관련 항목을 통해 각 시설의 설치·운영 이력과 현재 활용 가능 여부를 확인할 수 있습니다. 사업장명, 비상시설위치, 시설명·건물명, 시설구분명 등의 정보를 통해 해당 급수시설이 어떤 유형의 시설이며 어느 건물·장소에 설치되어 있는지를 파악할 수 있습니다. 또한 지번·도로명 주소, 우편번호, 좌표(X·Y), 소재지면적, 전화번호 등의 항목을 통해 공간적 위치와 규모, 연락처를 확인할 수 있습니다. 해제일자 정보는 민방위급수시설 지정이 해제된 시점을 보여 주어, 시설의 존속 여부를 시간 흐름에 따라 추적하는 데 활용됩니다. 이러한 정보는 비상용 급수 인프라의 분포, 유지관리 현황, 재난 시 활용 가능 자원을 분석·관리하는 데 유용한 인허가 기반 데이터입니다.
