summary_user: 서울특별시 동작구의 민방위 대피시설 인허가 정보를 시설 한 곳당 한 건으로 담으며, 시설명·관리번호·인허가일·영업상태·지번/도로명 주소·중부원점 TM 좌표(XCRD, YCRD)가 들어 있다. 동작구 주민이나 재난 대응 담당자가 "민방위 사태가 나면 우리 동네에서 가장 가까운 대피시설은 어디인가"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 대피·구호시설 데이터와는 주소나 시설명을 맞추거나 같은 기관 코드(OGDP_INST_CD)로 이어 쓴다.
