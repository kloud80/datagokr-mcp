summary_user: 2021~2025년 연안사고 사망자 수를 연도별로 갯바위·갯벌·항포구·방파제·해수욕장·해안가·해양·기타 등 사고 장소 유형으로 나눠 담은 전국 단위 집계표이며, 파일 크기는 190바이트 수준의 소형 CSV다. 낚시객·관광객의 안전 안내를 준비하는 지자체 담당자나 분석가가 '연안 사망사고가 어떤 장소에서 가장 많이 나고 해마다 어떻게 변하는가'를 확인하는 데 쓴다. 지역 코드나 시설 코드 같은 전역 조인 키가 없어서, 다른 해경 사고 통계와는 연도와 장소 유형 이름을 맞춰 붙여야 한다.
description_portal: 최근 5년간(2021년~2025년) 장소별 연안사고 사망자 현황에 관한 데이터로서, 연도,갯바위,갯벌,방파제,항포구,해수욕장,해안가,해양,기타 등의 항목을 제공합니다.연안에서 발생한 안전사고는 주로 해수욕장, 해안가, 해양 등에서의 물놀이 중 익수하거나 표류, 항포구, 방파제(테트라포드), 갯바위 등에서 낚시 중 실족 또는 음주로 인한 실족 또는 차량 조작 미숙 등의 원인으로 추락, 갯벌에서 해루질, 관광 중 물때 미인지로 인한 고립 등의 사고가 대부분 입니다.사고의 원인으로는 구명조끼 미착용, 음주 상태로 활동하는 등 활동객 부주의에 기인하여 사고가 발생하고 있습니다.
