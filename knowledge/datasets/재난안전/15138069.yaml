description_portal: 본 자료는 한국승강기안전공단에서 집계한 승강기 운행중지 안내 현황을 정리한 내용입니다. 전체 기록은 34,122건이며, 기간은 2018년 12월 10일부터 2020년 4월 13일까지입니다. 접수 항목에는 접수일자, 접수번호, 검사 시작과 종료 시간, 호기, 설치장소, 비고가 포함되어 있습니다. 설치장소는 총 3,858개소가 확인되었고, 호기는 최소 1호기에서 최대 191호기까지 분포하고 있습니다. 전체 중 9,835건은 비고가 작성되어 있으며 이는 전체의 약 28.82%를 차지합니다. 자료에는 검사 시간 정보가 상세히 기록되어 있어 운행중지 사유 추적과 관리에 도움이 됩니다. 이 데이터는 특정 기간 동안 발생한 승강기 운행중지 현황을 종합적으로 보여주며, 안전관리와 점검 계획을 세우는 데 기초 자료로 활용할 수 있습니다. 또한 지역별·장소별 분석을 진행하면 사고 예방과 승강기 운영의 신뢰성을 높이는 데 기여할 수 있습니다.
