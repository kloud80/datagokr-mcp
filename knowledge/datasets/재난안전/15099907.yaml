summary_user: 광주광역시경찰청 산하 경찰서별로 소속 지구대·파출소 등 지역관서의 이름, 구분(지구대/파출소), 주소를 관서 한 곳당 한 행으로 담은 작은 CSV 파일(약 2.4KB)이다. 광주 시민이 '우리 집에서 가장 가까운 지구대나 파출소는 어디이고 어느 경찰서 소속인가'를 확인하거나, 분석가가 구별 지역관서 분포를 살피는 데 쓴다. 전역 조인 키나 기관 코드가 없어서, 다른 경찰관서 위치 자료나 지역 범죄·112신고 통계와는 경찰서명·관서명을 이름으로 맞추거나 주소를 좌표로 바꿔 공간적으로 이어 쓴다.
limits: 관서를 식별하는 공통 코드가 없어 다른 데이터와 붙일 때 이름 표기 차이를 직접 맞춰야 한다. 좌표 필드가 없어 지도에 올리려면 주소를 따로 지오코딩해야 하며, 전화번호·관할구역 경계 같은 정보는 담겨 있지 않다.
