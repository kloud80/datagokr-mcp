description_portal: '본 자료는 한국승강기안전공단이 운영하는 ‘콤비스마트(CombiSmart)’ 내부 시스템의 메뉴 구조를 정리한 목록입니다. 각 행은 메뉴ID, 메뉴명, 상위메뉴ID, 등록일자를 포함하며, 트리(계층) 형태의 정보 설계·운영을 위해 사용됩니다. 메뉴ID는 기능 영역을 식별할 수 있도록 영문+숫자 조합 규칙(예: AD01-050)을 따르며, 상위메뉴ID를 통해 모듈–하위기능 간 종속 관계를 복원할 수 있습니다. 동일 기능의 권한/조직 버전(예: 본원·지원·기술원)이나 메뉴 개편 이력으로 인해 유사 명칭이 병존할 수 있고, 등록일자는 최초 생성 또는 개편 반영 기준일일 수 있습니다. 명칭에는 업무 성격(검사, 기준, 코드, 장비, VOC 등)이 반영되어 있어 업무 범주 파악이 가능합니다.'
