summary_user: 경기도 이천시가 폭염 대비로 설치한 그늘막을 설치 장소 한 곳당 한 행으로 담은 원천 목록으로, 기준연도·읍면동·설치장소명·지번주소·관리번호·그늘막 유형이 들어 있다(CSV 약 13KB). 시민이나 분석가가 '우리 동네 어느 교차로에 그늘막이 있고 어떤 형태인가', '폭염 취약지역 대비 그늘막이 부족한 동은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 읍면동명이나 지번주소를 매칭하거나 주소를 좌표로 변환해 무더위쉼터 등 다른 대피·구호시설 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 이천시에서 운영 중인 폭염 피해 예방용 그늘막의 설치 현황 정보를 제공합니다. 항목은 기준연도, 행정동, 설치장소명, 지번주소, 관리번호, 그늘막 유형, 기준일자 등으로 구성되어 있으며, 위치별로 그늘막의 설치 여부와 유형을 확인할 수 있습니다. 본 데이터는 폭염 대응 기반시설 관리, 도심 열섬 현상 완화, 취약계층 보호, 보행환경 개선, 생활밀착형 안전정책 수립 등의 행정업무에 활용됩니다. 특히 그늘막 설치 장소와 유형 정보는 열지도 기반 분석이나 보행자 동선과의 연계 활용에 유용하며, 향후 도시 내 탄소중립형 생활인프라 확충에도 기초자료로 활용될 수 있습니다.
