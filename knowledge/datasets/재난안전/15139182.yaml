description_portal: '한국산업안전보건공단에서 제공하는 건설현장 안전 신호등 데이터입니다.건설재해예방전문지도기관 기술지도 대상 현장(중· 소규모 건설 현장)의 최근 기술지도 결과를 확인할 수 있습니다.※  callApiId = 1020 (고정값으로 필수 입력)※ 재해예방 기술지도 진행중인 사업장만 표출※ 활용참고: 안전보건공단 홈페이지(www.kosha.or.kr) > 일일 건설안전관리 상황판 > 건설현장 안전 신호등(점검결과를 색으로 구분하여 활용 가능)※ 관련: 산업안전보건법 제73조(건설공사의 산업재해 예방 지도)    ①  대통령령으로 정하는 건설공사의 건설공사발주자 또는 건설공사도급인(건설공사발주자로부터 건설공사를 최초로 도급받은 수급인은 제외한다)은 해당 건설공사를 착공하려는 경우 제74조에 따라 지정받은 전문기관(이하 “건설재해예방전문지도기관”이라 한다)과 건설 산업재해 예방을 위한 지도계약을 체결하여야 한다.     ② 건설재해예방전문지도기관은 건설공사도급인에게 산업재해 예방을 위한 지도를 실시하여야 하고, 건설공사도급인은 지도에 따라 적절한 조치를 하여야 한다.     ③ 건설재해예방전문지도기관의 지도업무의 내용, 지도대상 분야, 지도의 수행방법, 그 밖에 필요한 사항은 대통령령으로 정한다.'
