summary_user: 건설재해예방전문지도기관이 기술지도 중인 전국 중·소규모 건설현장별로 최근 점검일자와 점검 결과(양호·주의·경계 3단계, chckRsltVl), 현장명·주소·위경도, 지도기관명을 한 건씩 담은 API 데이터입니다. 주민이나 지자체 담당자가 "우리 동네 공사현장의 최근 안전 점검 결과가 주의나 경계인가"를 확인하거나, 분석가가 지도기관별·지역별 점검 결과 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표 기반의 공간 매칭이나 사업장명·지도기관명 같은 이름 매핑으로만 이어 쓴다.
limits: 재해예방 기술지도가 진행 중인 현장만 나오므로 지도가 끝났거나 대상이 아닌 대규모 현장은 빠진다. 공통 코드 키가 없어 사업장 재해 통계 등과 정확히 결합하기 어렵다. 호출 때 callApiId=1020을 고정값으로 넣어야 하고, 개발계정은 하루 1,000회로 제한된다.
