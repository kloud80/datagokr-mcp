summary_user: 부산광역시 중구 관내 이재민 임시주거시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명주소·상세위치·수용면적·수용인원·지진 겸용 여부·지정일자를 제공한다(csv 약 1.4KB, 주민센터·학교·복지관 등 10여 곳). 재난으로 집을 잃었을 때 중구에서 어느 시설에 몇 명까지 머물 수 있는지, 지진 때도 쓰이는 곳인지 확인하려는 주민·구호 담당자가 쓴다. 전역 조인 키는 없어 다른 대피·구호시설 데이터와는 시설명이나 도로명주소를 맞춰 연결해야 한다.
description_portal: '부산광역시 중구 관내 이재민 임시주거시설에 대한 데이터로 종류, 소재지, 시설명, 면적, 수용인원, 지진 시 겸용 여부 등의 항목을 제공합니다.지정현황: 광일초등학교, 중앙동주민센터, 보수동주민센터, 중구노인복지관, 중구보훈회관, 남포동주민센터, 보수동책방골목문화원, 중구노인복지관 분관, 부산디지털고,민주공원, 중구종합사회복지관, 영주2동주민센터, 봉래초등학교이 데이터는 공공데이터 포털과 부산시 빅데이터웨이브(http://data.busan.go.kr)에서도 확인하실 수 있습니다.'
