summary_user: 대전광역시가 지진 등 대규모 재난 때 주민이 일시적으로 머물도록 지정한 지진겸용 임시주거시설을 시설 한 곳당 한 행으로 담은 파일로, 시설구분·시설명·위치(주소)·수용가능면적(제곱미터)·연락처를 기록한다. 대전 시민이나 구호 담당자가 '우리 동네에서 지진 후 임시로 머물 수 있는 시설은 어디이고 얼마나 넓은가'를 확인하거나, 분석가가 자치구별 시설 분포와 수용 면적을 비교하는 데 쓴다. 공통 조인 키가 없어 다른 대피·구호시설 데이터(지진 옥외대피장소, 민방위 대피시설 등)와는 시설명이나 주소 문자열을 맞추거나 주소를 좌표로 변환해 위치 기준으로 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키나 좌표 필드가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 대전광역시 한 시도 범위만 담으므로 다른 지역 시설은 이 파일로 확인할 수 없다.
