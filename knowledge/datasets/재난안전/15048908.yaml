summary_user: 인천광역시 군구별로 지정된 지진옥외대피소의 위치를 사물주소 체계로 정리한 건별 목록으로, 시군구·사물유형·사물명·사물주소·고지완료일자를 대피소 한 곳당 한 행으로 담는다. 인천 시민이 지진이 났을 때 우리 동네 가까운 옥외 대피 장소가 어디인지 찾거나, 분석가가 군구별 지진옥외대피소 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 대피시설·재난 데이터와는 시군구 이름이나 사물주소(주소 문자열)를 맞춰서만 이어 쓴다.
description_portal: 인천광역시 군구별 지진옥외대피소 사물주소현황에 관한 데이터로 시군구, 사물유형, 사물명, 사물주소, 고지완료일자를 제공하겠음.이 공공데이터는 인천광역시 관내에 지정된 지진옥외대피소의 위치 정보를 사물주소 체계로 정리하여 제공하는 행정 자료입니다. 시민들이 지진 발생 시 안전하게 대피할 수 있는 공간을 신속히 확인할 수 있도록 지원합니다.<활용 목적 >이 자료는 지진 등 재난 발생 시 시민들이 가까운 대피소를 빠르게 찾을 수 있도록 돕고, 행정기관은 대피소 관리·운영 현황을 체계적으로 파악하여 안전 정책을 수립하는 데 활용됩니다. 또한 연구기관은 도시 안전 인프라 분석에 참고할 수 있습니다.
