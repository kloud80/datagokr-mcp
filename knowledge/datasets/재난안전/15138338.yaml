description_portal: 본 데이터는 한국승강기안전공단의 승강기 안전검사 수수료에 대한 전자세금계산서 발행 이력을 제공하여 회계·세무 투명성을 높이고 이용자 편의를 지원하기 위한 것입니다. 각 건은 접수일자·접수번호를 키로 하며, 세금계산서 발행일자, 공급가액, 세액(VAT), 등록일자를 포함합니다. 이를 통해 월·연도별 발행 추이 분석, 발행 지연·누락 점검, 공급가액 대비 세액 산정 검증, 수납/환불 데이터와의 대사 등 실무 활용이 가능합니다. 범위는 공단이 발행한 검사수수료 관련 세금계산서 전반으로, 정정·취소(역발행) 건은 원자료 관리방식에 따라 별도 표기되거나 제외될 수 있습니다.
