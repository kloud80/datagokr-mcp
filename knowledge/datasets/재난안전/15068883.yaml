description_portal: '대전광역시경찰청은 도로 폭이 협소하거나 구조적으로 대형 차량의 통행이 어려운 구간을 대상으로 8톤 이상 화물차량의 통행을 금지하고 있습니다. 이러한 통행금지 구간은 다음과 같은 정보를 포함하고 있습니다. 시점, 경유지, 종점(통행금지 구간의 시작점, 경유지, 종점), 거리(통행금지 구간의 길이), 통행금지 사유(도로 폭 협소, 구조물 보호 등), 데이터 기준일, 비고(시간대): 통행금지 적용 시간대 등 추가 정보​ 입니다. 교통 질서 유지 및 안전을 위한 연구 자료로 대전지역 도로중 노폭이 협소하여 8톤 이상 대형 화물차량에 대한 통행을 금지하는 데이터로 구간(시점,경유,종점), 거리, 통행금지사유, 비고(시간대) 등을 제공합니다.'
