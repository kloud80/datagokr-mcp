description_portal: '- 위기관리 체계의 이해 및 재난, 안전관리, 재난관리 매뉴얼 체계와 훈련실무에 관한 데이터로서 재난 관련 업무에 있어서 참고할 수 있도록 제공됩니다.- 재난관리는 사람의 생명, 재산, 사회 기반시설 및 환경을 보호하기 위해 자연재해나 사회적 재난에 대응하고 관리하는 모든 체계적인 활동을 말합니다. 정부, 지자체, 민간기관, 지역사회가 함께 수행하며, 예방부터 복구까지 전 과정을 포함합니다.- 재난관리란 재난이 발생하기 전의 예방 및 대비부터, 재난 발생 시의 대응, 재난 이후의 복구까지 포함하는 통합적이고 종합적인 관리 체계입니다.- 관련 법: 「재난 및 안전관리 기본법」 제3조- 자연재난: 태풍, 폭우, 지진, 가뭄, 산사태 등- 사회재난: 화재, 감염병, 붕괴, 환경오염, 대규모 사고 등- 복합재난: 자연 + 사회적 원인이 결합된 재난'
