summary_user: 하천 둔치에 있는 주차장의 영역 정보를 담은 데이터로, 시설물관리번호(THINGS_MNG_NO), 공간 일련번호, 시설물 종류·구성요소 코드, 지역, 영역 도형(GEOM)이 들어 있고 범위는 전국이다. 집중호우나 하천 범람 예보 때 어느 둔치주차장이 침수 위험 구역에 드는지, 차량 대피 안내 대상이 어디인지 확인하려는 지자체 재난담당자나 분석가가 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 찾지 못했으므로, 재난 특보·위험지역 데이터와는 지역명 매핑이나 같은 기관(행정안전부) 시설물 코드로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 둔치주차장(영역)에 대한 정보입니다.\""
