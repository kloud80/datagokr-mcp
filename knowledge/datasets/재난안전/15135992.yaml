description_portal: ‘재난관리정보’ 데이터는 대구시 긴급구조표준시스템에서 수집한 다차원적 재난대응 시나리오와 관리 계획이 요약된 자료입니다. 포함된 항목은 대응 대상 재난 유형(자연재해, 화재, 테러 등), 대응 단계별 절차, 기관별 역할 분담, 협업 네트워크, 예방 및 사후복구 계획 등입니다. 이 데이터는 실제 재난 발생 시 신속한 대응을 위한 매뉴얼 개발, 기관 간 커뮤니케이션 체계 구축, 모의훈련 시나리오 구성 등에 활용될 수 있습니다. 또한 유사 재난 유형 간 대응 전략을 비교함으로써 복합재난 대응 전략 강화에도 기여합니다. 특히, 병원, 경찰, 지방자치단체 등과의 연계체계를 포함함으로써 단일 기관 중심이 아닌 통합적인 재난대응 모델을 설계할 수 있는 기반 자료로 활용됩니다.* 본 자료는 시스템DB에서 추출한 자료로서 데이터에 오류가 있을수 있으며, 정확한 자료를 원할 경우 담당부서로 문의해 주시기 바랍니다.
