description_portal: 본 데이터는 경찰청에서 제공하는 2021년부터 2025년까지의 시도청별 가정폭력 신고건수 현황을 연도별·지역별로 정리한 통계자료이다. 서울, 부산, 대구, 인천 등 전국 시도청 관할별 가정폭력 신고 규모를 확인할 수 있으며, 연도별 증감 추이와 지역 간 신고 발생 수준을 비교·분석하는 데 활용할 수 있다. 이를 통해 특정 지역의 신고 증가·감소 양상, 인구 규모와 지역 특성에 따른 가정폭력 대응 수요, 치안행정 자원 배분 필요성 등을 파악할 수 있다. 가정폭력 예방정책 수립, 피해자 보호·지원체계 강화, 지역 맞춤형 범죄예방 활동 및 관련 연구자료로 활용 가능하다.※ 참고사항으로는 이 데이터는 112신고시스템 의  "가정폭력" 코드 기준으로 산출된 자료임. 2026년 데이터는 2027년 6월 업데이트 예정
