description_portal: 이 데이터는 광주광역시 지역 내 교통사고 및 화재·구조 관련 안전사고 현황을 체계적으로 수집·관리하여,시민의 생활안전 수준을 진단하고 지역안전지수 산출 및 안전정책 수립에 활용하기 위한 기초자료입니다.사고 발생 원인과 유형, 인명피해 현황, 기상 및 도로환경 등 안전사고의 주요 요인을 다각도로 분석할 수 있도록 구성되어 있습니다.교통사고 현황광주광역시 관내에서 발생한 교통사고 정보를 수록한 자료로, 사고내용, 인명피해(사망·중상·경상·부상신고자 수) 및사고유형(대분류·중분류·세부유형), 가해자·피해자 특성, 도로환경, 사고위치 등을 포함하고 있습니다.해당 데이터는 경찰청 교통사고 통계자료 및 지역 교통안전 조사 결과를 기반으로 구축되며,가해자 법규위반, 노면상태, 기상상태, 도로형태, 음주·무면허·뺑소니 여부, 어린이·노인·무단횡단사고 여부 등사고 발생의 세부요인 분석이 가능한 구조로 되어 있습니다.이를 통해 지역별 교통사고 다발지점 파악, 취약계층(어린이·노인) 보호대책 수립, 교통안전시설 개선 등정책적 의사결정에 근거자료로 활용할 수 있습니다.화재·구조 현황광주광역시 내에서 발생한 화재 및 구조 출동 현황을 나타낸 데이터로,행정구역(구·동)별 발생 건수, 장소, 유형, 원인 등이 포함되어 있습니다.자료는 광주소방안전본부 통계자료를 기반으로 산출되며,주거지·산업시설·공공시설 등 장소유형별 발생현황과 주요 원인(전기, 부주의, 기계적 요인 등)을 파악할 수 있습니다.이를 통해 지역별 화재취약 요인을 분석하고 예방활동, 안전시설 보강, 화재위험 저감정책 수립 등에 활용할 수 있습니다.
