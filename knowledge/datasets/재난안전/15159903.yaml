description_portal: 본 데이터는 인천광역시  응급의료 전용헬기(닥터헬기)의 환자 인계점 현황 정보를 제공합니다. 인계점은 중증 응급환자의 신속하고 안전한 이송을 위해 지정된 헬기 이착륙 육상 거점입니다.데이터는 이용자의 편의를 위해 시군구명, 인계점 명칭, 상세 주소, 정확한 지리적 위치를 파악할 수 있는 좌표(위도 및 경도), 그리고 기타 특이사항을 확인 수 있는 비고 항목으로 구성되어 있습니다.응급의료 취약지 및 도서 지역의 응급환자 발생 시 최적의 이송 경로 구축, 응급의료 자원 공백 해소, 재난 및 응급 상황 대응을 위한 공공 안전 지도 제작 등 다양한 응급의료 서비스 고도화 및 학술 연구 분야에서 기초 자료로 유용하게 활용할 수 있습니다.
