description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2020년 기준 경찰청에서 집계한 아동안전지킴이집 장소별 운영 현황을 제공하는 공공데이터입니다. 유치원, 초등학교, 아파트단지, 놀이터, 공원 등 어린이 보호시설 유형별 지킴이집 지정 수량이 포함되어 있어 지역 사회의 아동 보호 인프라 분포와 생활권 내 아동안전망 현황을 확인할 수 있습니다. 이 데이터는 경찰의 아동보호 정책 수립, 교육청·지자체의 보호구역 지정, 연구기관의 아동 안전 실태 분석, 공공기관의 맞춤형 보호시설 운영 전략 수립 등에 폭넓게 활용됩니다.
