summary_user: 밀양소방서 본서와 소속 119안전센터별로 주소, 관할면적(㎢), 관할인구, 소방관 1인당 인구수, 본서와의 거리(km), 관할구역(읍·면·동)을 한 행씩 담은 소규모 집계 파일이다(CSV 약 720바이트). 밀양시 주민이나 분석가가 '우리 읍·면은 어느 안전센터가 맡고, 그 센터의 소방관 한 명이 몇 명의 인구를 담당하나'를 확인하거나 센터 간 담당 부담을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 소방·인구 데이터와는 부서명이나 관할구역의 읍·면·동 이름을 맞춰 연결해야 한다.
description_portal: <데이터 수집목적 및 과정> 밀양소방서 센터별 관할현황은 밀양시청에서 제공하는 인구현황의 인구수 데이터를 활용하여 소방관 1인당 담당하는 인구수 및 119안전센터가 관할하는 관할구역 및 담당인구, 본서(밀양소방서)와의 거리(km)를 제공하여 밀양소방서가 관할하는 센터별 관할현황을 제공합니다.<데이터 구성 및 세부항목> 데이터는 부서명, 해당부서의 주소, 관할면적(km), 관할인수(명), 소방관 1인당 인구수(명), 본서와의 거리(km), 관할구역의 정보를 제공합니다.<데이터 현행화 시기> 해당 데이터는 연간 현행화 데이터입니다. 차기 업데이트 예정일은 2026년 11월 입니다.
