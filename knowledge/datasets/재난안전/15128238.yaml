summary_user: 경상북도 구미시가 관리하는 가로등을 한 개씩 담은 건별 원천 파일로, 분전함·등표찰 번호, 좌표(X·Y)와 지번 주소, 등주 형태·등기구 종류, 설치일자, 램프·용량·계약전력 정보를 담는다. 시민이나 분석가가 '우리 동네 어두운 골목 주변에 가로등이 어디에 몇 개 있는가'를 확인하거나, 시설 담당자가 노후 등기구·전력 사용 현황을 파악하는 데 쓴다. 전역 조인 키는 없어서 행정동·법정동 이름이나 좌표로 CCTV·보안등·안전비상벨 같은 다른 방범 시설 데이터와 공간적으로 겹쳐 본다.
description_portal: 경상북도 구미시에서 관리하는 가로등 정보 데이터는 분전함번호, 등표찰번호, X좌표와 Y좌표를 통한 정확한 위치 정보, 등주 형태와 등기구 종류, 설치일자 등 가로등의 세부 사항을 포함하고 있습니다. 이와 더불어 전체 램프 정보, 총 등주 수, 총 등수, 총 용량, 계기번호, 계약 전력, 최초 사용일자, 지번주소 등의 항목도 제공되어 가로등 운영 및 관리를 위한 포괄적인 정보를 제공합니다. 이 데이터는 구미시의 가로등 유지보수, 에너지 관리, 안전 점검 및 도시 환경 개선에 활용되며, 효율적인 공공시설 관리와 예산 편성, 도시 미관 향상을 위한 기초 자료로서 중요한 역할을 합니다. 또한, 스마트 시티 구축과 연계하여 공공조명 자동화, 에너지 절감 정책 수립 등에도 기여할 수 있어, 지속 가능한 도시 발전과 시민 안전 확보에 필수적인 정보를 담고 있습니다.
