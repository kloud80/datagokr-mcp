summary_user: 소방청과 시도 소방본부·소속기관이 보유한 드론을 소속 기관(1~4차 소속)별로 기종과 용도와 함께 정리한 전국 단위 보유 현황 파일(CSV, 약 60KB)입니다. 소방 행정 담당자나 분석가가 "어느 시도 본부·소방서에 어떤 기종의 드론이 어떤 용도로 배치돼 있는가"를 확인해 재난 대응 장비 배치와 확충을 검토하는 데 쓴다. 전역 조인 키가 없어 다른 소방 데이터(119안전센터, 화재 발생 등)와는 소속 기관 이름을 맞춰 연결해야 한다.
description_portal: 해당 데이터는 소방청 및 시도본부 및 소속기관에서 보유한 드론 현황에 대한 데이터로 주요 항목으로는 드론 보유 갯수, 드론 종류(멀티콥터, 고정익 등), 운용 목적, 도입 연도, 운영 부서 등이 있으며, 해당 데이터를 통해 소방청이 보유·운용하는 드론 자원의 규모와 성능, 지역별 분포, 활용 현황을 객관적으로 보여줍니다. 화재 현장 감시, 인명 수색·구조, 산불 및 수해 등 재난 상황 대응을 위한 활용 현황을 확인할 수 있습니다. 이를 통해 지역별 드론 장비 분포와 운용 추세를 파악할 수 있고, 재난 대응 장비의 효율적 배치와 향후 장비 확충 정책 수립에 기초자료로 활용됩니다.
