summary_user: 부산 연제구청이 관리하는 연미초교 일원 공공용 승강기의 현황을 승강기번호·호기 단위로 담은 소용량 파일(csv 980바이트)로, 소재지·운행층수·관리주체·유지관리업체·안전관리자·설치일자·검사 유효기간·탑승인원·적재하중·속도 같은 원장 정보를 담는다. 주민이나 안전 담당자가 "연미초교 근처 공공 승강기는 누가 관리하고 검사 유효기간은 언제까지인가"를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 승강기번호나 소재지·건물명을 이름 매핑해 다른 승강기·시설 안전 원장 데이터와 맞춰 써야 한다.
limits: 연제구 한 곳의 개별 승강기만 다루므로 구 전체나 부산시 전체 승강기 현황으로 확장해 해석하면 안 된다. 공통 조인 키가 없어 다른 데이터와는 승강기번호·주소 같은 이름 매칭으로만 연결된다.
