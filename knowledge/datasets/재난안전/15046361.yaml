description_portal: '1985년~2006년 통계 데이터○ 통계개요* 통계명 : 소방장비* 통계종류 : 소방서별 소방장비 보유 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 현재 소방서별 보유하고 있는 소방장비의 현황을 파악하여 사고 방지 및대응 등 효과적 관리를 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 소방서 → 소방재난본부 안전지원과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 소방서내용 - 소방서별 소방장비(소방자동차 등)보유현황○ 용어설명* 소방자동차 : 소방자동차에는 고가차, 굴절차, 방수탑차, 화학차, 배연차, 조명차,펌프차, 물탱크차, 행정차, 소방정, 소방헬기, 유조차, 기타 등이 포함됨* 고가차 : 대형 고층건물에 소방대가 진입하거나 인명을 구출할 때 필요한 장비로,대형화재 또는 폭발 등 사고로 건물에 있는 계단이나, 엘리베이터를 이용하지못하게 되는 경우 사용* 굴절차 : 바스켓에 화재진압용 방수포가 설치되어 있어 진압 대원이 탑승하여높은 곳의 화재에도 용이하게 화재진압* 화학차 : 포(泡)분말 소화약제가 다량 탑재되어 있어, 물로 진화 불가한 화재가발생한 경우에 사용* 배연차 : 연기가 많이 발생하는 지하층 화재 등 실내화재에서 연기를 효과적으로흡입하고 배출하여 소방대원의 시야를 확보함으로써 신속한 화재진압과인명구조에 도움을 주는 차량임'
