summary_user: 전북경찰청이 정리한 2013~2025년 살인·강도·강간추행·절도·폭력 5대 범죄의 연도별 발생·검거 건수와 검거율을 담은 집계 파일(CSV, 약 1KB)이다. 전북 지역에서 특정 강력범죄가 해마다 늘었는지, 검거율이 어떻게 변했는지를 확인하려는 분석가나 지역 치안 정책 담당자가 쓴다. 전역 조인 키가 없어 다른 시도청 범죄통계나 지역 지표와는 연도(년도별)와 범죄 유형 이름을 맞춰 연결해야 한다.
description_portal: 이 파일은 전북경찰청이 수집한 2013년부터 2025년까지의 주요 강력범죄에 대한 연도별 발생 및 검거 현황을 정리한 통계 자료입니다. 살인, 강도, 강간 및 추행, 절도, 폭력 등 5대 강력범죄를 대상으로 각 연도별로 발생 건수와 검거 건수가 유형별로 구분되어 수록되어 있으며, 범죄 유형별 추세 및 검거율 변화 등을 분석할 수 있도록 구성되어 있습니다. 이 자료는 범죄 발생의 사회적 변화 양상을 이해하고, 범죄 예방 및 수사 역량 강화 정책 수립에 필요한 기초자료로 활용될 수 있습니다. 특히 특정 범죄의 발생 증가 여부, 지역별 특성, 검거 실적 등을 종합적으로 분석함으로써 향후 치안 정책의 방향성과 자원 배분의 효율성을 높이는 데 기여할 수 있습니다.
