description_portal: 이 공공데이터는 강원특별자치도 내에서 2021년부터 2024년까지 발생한 외국인 범죄에 대한 단속 현황을 정리한 자료입니다. 주요 항목은 범죄 유형별로 살인, 강도, 성범죄, 절도, 폭력, 지능범죄, 마약, 기타 범죄로 구성되어 있으며, 각 범죄에 대한 조치 결과로 구속 및 불구속 건수도 포함되어 있습니다. 해당 데이터는 외국인 범죄 발생 양상과 수사 결과를 통합적으로 파악할 수 있는 기초자료로, 지역 내 치안 정책 수립과 외국인 대상 범죄 예방 활동에 활용될 수 있습니다. 또한 경찰청, 출입국·외국인청, 지자체 등에서 다문화 사회의 안전관리 정책을 마련하는 데 유용하며, 학술기관이나 언론에서도 외국인 범죄의 실태와 대응력을 분석하는 데 참고자료로 활용될 수 있습니다.
