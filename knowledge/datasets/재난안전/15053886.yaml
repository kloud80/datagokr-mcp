description_portal: 본 데이터는 2014년부터 2024년까지 경찰청에서 집계한 불법콘텐츠 범죄의 연도별 발생 건수와 검거 건수를 상세히 기록한 통계 자료입니다. 주요 세부 유형으로는 사이버 성폭력, 사이버 도박, 사이버 명예훼손·모욕, 사이버 스토킹 및 기타 범죄 항목을 포함하고 있습니다.데이터의 흐름을 살펴보면, 특히 사이버 명예훼손·모욕 범죄가 10년 사이 약 2~3배 급증하며 가장 큰 비중을 차지하고 있으며, 2021년 이후 사이버 스토킹 수치가 별도 관리되지 않는 등의 법제 및 분류 체계 변화를 확인할 수 있습니다. 2024년 최신 수치까지 포함되어 있어 국내 사이버 범죄의 변천사와 검거 효율성을 분석하는 기초 자료로 가치가 높습니다. 수사 정책 수립 및 사이버 범죄 예방 교육, 학술 연구 등의 목적으로 폭넓게 활용 가능합니다.
