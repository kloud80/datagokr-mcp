summary_user: 영등포구에 설치된 CCTV를 설치 지점(도로명 기반 안심주소와 위경도 좌표)별로 담은 건별 현황 파일로, 지점마다 방범·어린이보호구역 같은 설치 목적과 대수를 함께 기록한다. 주민이나 정책 분석가가 "우리 동네 골목이나 어린이보호구역 주변에 방범 CCTV가 얼마나 촘촘히 있는가"를 지도에서 확인하거나 사각지대를 찾는 데 쓴다. 공통 조인 키가 없으므로 다른 데이터와는 좌표 기반 공간 결합이나 시군구명 매칭으로 잇는다. 예를 들어 안전비상벨·보안등 위치나 다른 구의 CCTV 현황과 겹쳐 본다.
description_portal: 본 데이터셋은 영등포구 내 시민 안전 강화 또는 방범 등의 목적으로 설치된 CCTV의 설치현황 정보를 제공합니다. 시도명, 시군구명, 안심주소, 용도, WGS 기반 x 좌표, WGS 기반 y 좌표, 수량, 데이터기준일자 등의 항목을 포함하고 있습니다. 안심주소는 CCTV가 설치된 도로명 기반 위치이며, WGS x·y좌표는 WGS 기반으로 측정된 위경도 값입니다. 용도는 방범, 어린이보호구역 등 설치 목적을 나타냅니다.해당 데이터셋은 영등포구 내 CCTV 설치 위치와 분포 현황을 확인할 수 있어, 생활안전 인프라 현황 파악 및 안전 정책 수립·연구 등 다양한 분야에서 활용 가능합니다.
