description_portal: 본 통계는 경찰청이 집계한 2026년 상반기(1~6월) 어린이보호구역 지정 건수 현황으로, 시·도(경기남부·경기북부 포함) 및 시설 유형별 지정 건수를 제공합니다. 시설 유형은 초등학교, 일반유치원, 병설유치원, 특수학교, 어린이집, 학원, 외국인학교·대안학교·국제학교·초·중등교육법 제12조제1항제4호에 따른 학교, 조례로 정하는 시설·장소로 구분됩니다. 본 자료는 지역별 어린이보호구역 지정 현황을 파악하고 시설 유형별 분포를 비교·분석하는 데 활용할 수 있으며, 어린이 교통안전 정책 수립, 보호구역 관리 및 운영, 관련 연구와 행정업무의 기초자료로 활용 가능합니다. 통계 기준은 2026년 1월부터 6월까지의 지정 건수입니다.
