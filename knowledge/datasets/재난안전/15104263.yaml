summary_user: 인천광역시 소방본부에 접수된 119 신고 건수를 연도별로 집계한 표로, 2020~2025년의 총 신고 건수와 화재·산불·구조·구급 같은 출동 유형, 안내·기관통보·오인·오접속·무응답·자동응답(ARS)·타시도이첩 같은 접수 처리 상태를 한 행에 담는다. 소방 행정 분석가나 시민이 '인천의 119 신고에서 구급 신고 비중이 해마다 늘고 있나, 오접속·무응답 같은 비출동 신고는 얼마나 되나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 연도(년도)와 인천광역시라는 기관명으로만 맞춰 붙여 쓴다.
description_portal: '제공된 표는 2020년부터 2025년까지 인천광역시 소방본부에 접수된 119 신고 건수를 재난 유형별로 집계한 공공데이터입니다.<주요 내용>이 데이터는 종합 신고 건수를 비롯하여, 화재, 산불, 구조, 구급 등 주요 출동 유형과, 기타출동, 오인/오접속, 무응답, 자동응답(ARS) 등 신고 접수 및 처리 상태별 상세 내역을 연도별로 비교할 수 있도록 제공합니다.-핵심 항목: 연도별 총 신고 건수 변화와 구급, 구조 등 재난 대응 신고의 비중 변화를 파악할 수 있습니다.데이터 분석을 통해 재난 대응 시스템 개선의 기초 자료로 활용할 수 있습니다..'
