summary_user: 대전광역시 중구에 있는 안전지킴이집을 한 곳씩 담은 목록으로, 명칭·도로명주소·위도·경도와 여성용인지 아동용인지를 나타내는 유형(구분)을 시설 단위로 담는다. 주민이나 학부모가 '우리 동네·통학로 근처에 위급할 때 들어갈 수 있는 아동·여성 안전지킴이집이 어디 있나'를 찾거나, 분석가가 중구 내 안심 거점의 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 도로명주소를 기준으로 CCTV·안전비상벨·보안등 같은 방범 인프라 위치 데이터와 공간적으로 겹쳐 보는 방식으로 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구에 위치한 안전지킴이집 정보(연번, 명칭, 도로명주소, 위도, 경도, 구분)입니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 구분은 안전지킴이집 유형을 여성 또는 아동으로 구분하여 표기하고 있습니다.주소는 도로명 주소 기준으로 작성되었습니다.도로명주소와 더불어 위도 및 경도를 포함하여 지도 상 위치를 표기하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
