description_portal: 이 데이터는 한국승강기안전공단의 승강기 인증 발행신청 목록을 정리한 자료입니다. 주요 항목으로는 ‘신청 일자’, ‘신청 업체 명’, ‘안전 인증 번호’, ‘발행 일자’, ‘처리 상태’, ‘이전 안전 인증 번호’가 있으며, 각 행은 하나의 발행 신청 건을 나타냅니다. ‘신청 일자’는 발행이 접수된 날짜이며, ‘신청 업체 명’은 발행을 신청한 회사 또는 공장명입니다. ‘안전 인증 번호’는 관련된 인증서의 고유 식별자이며, ‘발행 일자’는 해당 인증서가 발급된 날짜를 의미합니다. ‘처리 상태’는 발행 신청이 ‘처리완료’ 등 어떤 상태에 있는지를 보여주며, ‘이전 안전 인증 번호’는 변경이나 갱신이 이루어진 경우 기존 인증서를 참조할 수 있도록 제공됩니다.
