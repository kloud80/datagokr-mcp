description_portal: '데이터 개요이 데이터는 대구광역시 관내 500세대 이상 공동주택 단지의 긴급자동차(소방차 등) 진출입로 위치 좌표(X, Y) 정보입니다.긴급 출동 시 신속한 진입을 지원하기 위해 구축하였으며, 내비게이션·상황실 시스템·기관 업무 등에 활용할 수 있도록 공개합니다.구축 배경 및 목적한국부동산원(공동주택관리정보시스템 K-apt 운영기관)은 대구소방안전본부와 협업하여 공동주택 입주민의 안전관리와 긴급 출동 지원을 위해 본 데이터를 구축했습니다.이를 통해 긴급차량이 단지 내 진출입 지점을 빠르게 찾을 수 있도록 돕고자 합니다.수집 및 검증 방법수집(현장 조사): 대구 관할 소방서검증(현장 확인): 해당 공동주택 관리사무소검증 내용 예시: 진출입로 위치가 실제 출동 가능한 지점인지, 좌표 입력 오류 여부 등제공 시점 및 갱신 계획기준 시점: 2025년 6월갱신 계획: 매년 대상 범위를 확대하여 수집·공개 예정(※ 갱신 주기/범위는 관계기관 협의 및 수집 여건에 따라 달라질 수 있음)데이터 항목(컬럼) 설명단지코드(K-apt 코드): 공동주택 단지를 식별하는 고유 코드단지명: 공동주택 단지 이름단지주소: 도로명주소(제공 파일 기준)X, Y 좌표: 진출입로 위치를 나타내는 지도 좌표메모: 조사자가 남긴 참고사항(현장 특이사항 등)이용 시 유의사항(중요)본 데이터는 긴급 출동 지원 목적으로 구축되었으며,현장 여건(공사, 통제, 일시적 장애물 등)에 따라 실제 진입 가능 여부가 달라질 수 있습니다.생산/운영기관 안내한국부동산원은 「공동주택관리법 시행령」 제93조에 따라 국토교통부 위탁을 받아 공동주택관리정보시스템(K-apt)을 구축·운영하고 있습니다.'
