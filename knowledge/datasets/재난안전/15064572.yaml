description_portal: 본 통계는 2017년부터 2024년까지 경찰청이 집계한 사이버 사기 발생 및 검거 현황을 보여줍니다.직거래 사기가 매년 가장 많은 비중을 차지하는 가운데, 2024년에는 전체 발생건수가 100,539건으로 전년 대비 크게 증가했습니다. 특히, 2024년에는 이전 통계에 없던 신종 유형인 **사이버투자 사기(12,851건)**와 **연예빙자 사기(2,253건)**가 대규모로 출현했습니다.검거율 측면에서 보면, 게임 사기(68.7%)와 직거래 사기(62.0%)는 비교적 높으나, 신종 유형인 사이버투자 사기(30.3%)와 연예빙자 사기(20.9%)는 상대적으로 낮은 검거율을 보였습니다. 이는 신종 범죄에 대한 대응과 수사가 시급함을 시사합니다."23년까지는 직거래사기, 쇼핑몰사기, 게임사기, 이메일무역사기 등의 항목이었고, "24년부터는 연예빙자사기(신설), 사이버투자사기(신설) 등이 신설되었습니다.
