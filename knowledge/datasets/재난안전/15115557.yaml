summary_user: 부산광역시 북구가 발송한 재난문자를 건별로 일자·재난유형·대상지역·제목·요청내용과 함께 담은 파일(CSV 약 58KB)이다. 북구 주민이나 분석가가 어떤 재난유형의 문자가 언제 얼마나 자주 발송됐는지 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자나 재난유형·대상지역 이름을 맞춰 연결하거나 같은 기관(북구) 자료끼리만 이어 쓴다.
description_portal: 재난문자방송 혹은 안전 안내 문자는 대한민국에서 정부나 기관 등에서 모든 국민에게 휴대전화로 문자 메시지를 보내어 국민의 안전과 관련된 필요한 정보와 알림 등을 전달하는 메시지이다. 《재난 및 안전관리 기본법》 제38조의2항에 따라 명시되어 있으며, 재난 발생시에 신속한 경보와 대피, 피난을 유도하고 있다.대한민국 정부(행정안전부)에서 관리를 담당하고, 재난 발생 지역이 위치한 지방자치단체가 송출 권한을 갖는다. NDMS 시스템을 사용하여 대규모 재난 상황 발생(홍수,폭염,태풍,지진,해일 등 자연 재난) 시  해당 기지국에 연결된 휴대전화로 문자를 보내 인명 재산피해를 최소화하기 위해 공익을 목적으로 하는 서비스
