description_portal: 17개 시도 재난심리회복지원센터의 연간 심리상담 실적으로, 성별, 연령별, 상담유형별, 재난유형별(자연재난, 사회재난)로 구분한 상담실적 데이터입니다.  특히 재난유형별 분류에서는 "재난안전기본법"에 따른 재난유형을 고려하여 자연재난은 풍수해, 혹서,한기, 지진 등으로, 사회재난은 화재, 교통사고, 산불, 감염병 등으로 세분화하였습니다. 재난경험자는 직접 경험자, 재난대응인력, 기타 일반국민 등 재난을 경험한 자누구나 해당되며, 재난심리상담은  다양한 심리상담 기관에서 이루어질 수 있습니다. 본 데이터는 그 중 17개 시도 재난심리회복지원센터 실적임을 참고해 주시기 바랍니다.
