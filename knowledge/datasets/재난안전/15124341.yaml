description_portal: 대전광역시 서구 지진옥외대피장소 데이터는 지진 등 대규모 재난 발생 시 주민이 안전하게 대피할 수 있는 야외 공간의 위치와 수용 규모를 정리한 자료입니다. 시설구분명과 시설명을 통해 학교 운동장, 공원, 공공청사 등 어떤 유형의 공간이 대피장소로 지정되어 있는지 확인할 수 있고, 지번·도로명 주소와 행정동·법정동 정보가 함께 제공되어 동별 분포와 접근성을 분석할 수 있습니다. 또한 각 대피장소의 수용가능 면적과 연락처, 위도·경도 좌표, 데이터기준일자가 포함되어 있어 실제 수용 가능 인원 추정, 지도 시각화, 재난 대응 계획 수립 등에 활용하기에 적합한 기초 안전 인프라 데이터입니다.
