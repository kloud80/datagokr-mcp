summary_user: 김포시에 설치된 그늘막을 한 개씩 담은 건별 원장으로, 관리번호·설치장소명·도로명/지번 주소·위도·경도와 높이·펼침지름·원단 같은 규격, 해당 연도 운영 시작·종료일자를 담는다. 여름철 폭염 때 시민이 집 근처나 횡단보도 주변 그늘막 위치를 찾거나, 분석가가 읍면동별 그늘막 배치와 운영 기간을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 읍면동명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 무더위쉼터 등 대피·구호시설 데이터와 이어 쓴다.
limits: 김포시 한 곳의 시군구 범위만 담아 다른 지역과 비교하려면 각 시군의 데이터를 따로 모아야 한다. 법정동 코드 같은 공통 키가 없어 행정구역 코드 기반 결합은 이름·주소 매핑에 의존한다.
