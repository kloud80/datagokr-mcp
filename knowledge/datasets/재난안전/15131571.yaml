summary_user: 경기도 지진조기경보시스템이 긴급재난문자 시스템(EAS)으로 내보내는 대피 알림 설정을 담은 자료로, 지진통보 대상자 구분별 대피알림문구·알림소리·사용여부와 등록·수정 이력을 행 단위로 기록한다. 재난안전 담당자나 분석가가 지진 규모 구간별로 어떤 경보 문구와 대피 요령이 어떤 소리와 함께 송출되도록 설정돼 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 재난 특보·대피시설 같은 다른 재난안전 데이터와는 대상자 구분 이름을 맞추거나 같은 기관 기준으로만 이어 쓴다.
description_portal: 「지진조기경보시스템 EAS 제어 결과」 데이터는 경기도가 제공하는 재난안전 분야 자료로, 지진 발생 시 긴급재난문자 시스템(EAS, Emergency Alert System)을 통해 송출되는 대피 알림 메시지와 제어 결과를 기록한 것입니다. 주요 항목은 지진통보 대상자 구분, 대상자 구분값, 대피알림문구, 대피알림소리, 사용여부, 등록일자, 등록자, 수정일자, 수정자로 구성되어 있습니다.데이터에는 지진 규모 구간에 따른 경보 문구와 대피 행동 요령이 포함되어 있으며, 알림소리 코드와 함께 송출 여부를 확인할 수 있습니다.
