summary_user: 전국 옹벽시설물 수를 종별(행)과 17개 시도(열)로 교차 집계한 통계표로, 시설물 하나하나의 원장이 아니라 25년 12월 31일 기준 집계값을 담은 357바이트짜리 작은 CSV 파일이다. 지자체 담당자나 분석가가 '우리 시도에 관리 대상 옹벽이 종별로 몇 개 있고 다른 시도와 비교하면 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시도 단위 통계와는 시도 이름(열 이름)을 맞춰 붙여야 하고, 같은 기관의 시설물 안전 통계와 나란히 비교하는 정도로 이어 쓴다.
description_portal: 국토안전관리원에서 제공하는 데이터이며 옹벽시설물, 시도별, 종별 통계현황의 CSV형식의 파일데이터를 제공합니다. 25년 12월 31일 기준입니다.지역별 옹벽시설물 통계현황을 알려드립니다.옹벽시설물이란 토사가 무너지는 것을 막기 위해 설치하는 벽체 구조물을 말합니다. 흙의 붕괴를 막아 경사면을 안정화하고, 주로 도로, 건축 부지, 하천 주변 등에서 사용됩니다. 콘크리트, 철근콘크리트, 석재 등 다양한 재료로 만들며, 중력식, L형, 보강토식 등 다양한 구조가 있습니다.토목 공학 분야의 주요 시설물 중 하나이며, 건축법상으로는 건축물에 해당하지 않는 토목 구조물입니다.시설물안전법에 따라 관리 대상 시설물로 분류되기도 합니다.
