summary_user: 전국 단위 연도별(2009~2024년) 전기화재 집계 데이터로, 해마다 총 화재건수, 전기화재 건수, 사망·부상 인명피해, 재산피해(백만원)를 한 행씩 담은 소규모 CSV 파일이다. 전기화재가 전체 화재에서 차지하는 비중과 인명·재산 피해가 연도별로 어떻게 변했는지 보려는 정책 담당자, 연구자, 안전관리 분석가가 쓴다. 전역 조인 키는 없으며, 소방 화재통계 같은 다른 연도별 통계와는 연도 값을 기준으로 직접 맞춰 붙여 쓴다.
description_portal: 한국전기안전공사는 감전재해 감축을 위해 올바른 정책 방향의 기초 데이터를 제시하고 감전 재해의 발생추이를 분석하여 예방 대책을 도출하기 위해 매년 전기재해 통계분석집을 발간하고 있습니다.관련 근거로는 통계법 제18조와 동법 시행령 제24조, 전기안전관리법 제41조(전기재해 통계의 작성)가 해당됩니다.이 데이터는 연도별(2009년 ~ 2024년) 전기화재 분석 데이터로, 연도별 총 화재건수, 전기화재 건수, 인명피해(사망), 인명피해(부상), 재산피해(백만원 단위)를 확인 할 수 있는 데이터입니다.
