description_portal: 상습 결빙구간이란 겨울철에 도로 표면이 자주 얼어붙어 교통사고 위험이 높은 구간을 말합니다.기온이 갑자기 내려갈 때 녹았던 눈이나 비가 다시 얼어붙으면서 발생하는데, 눈에 잘 띄지 않아 블랙아이스(Black Ice) 현상이 주로 나타나는 곳이기도 합니다. 특히, 교량 위, 터널 입출구, 산모퉁이, 음지 등 햇볕이 잘 들지 않아 결빙이 쉽게 발생하는 곳이 많습니다. 이러한 상습결빙구간에서는 일반 도로보다 사고 발생 위험이 높기 때문에 운전자들의 각별한 주의가 필요합니다. 겨울철 상습 결빙구간 정보에 대한 데이터는  구간번호, 관리청, 도로분류,도로명,총길이,기점 등의 항목을 제공합니다.
