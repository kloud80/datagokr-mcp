summary_user: 울산광역시 울주군이 방사능 비상 시 대피 취약 어르신이 모이는 경로당(노인복지시설)의 위치 정보를 시설 건별로 담은 API이며, 범위는 울주군 한 시군구이고 필지·건물 단위다. 원전 사고 등 방사능 비상 때 방재 담당자나 분석가가 '우선 안내·구조가 필요한 경로당이 어디 있고 대피 집결지와 얼마나 가까운가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 대피소·집결지 등 다른 방재 데이터와는 시설명·주소 같은 이름 매핑이나 같은 기관(울주군) 데이터끼리로만 연결한다.
limits: 선거처럼 이벤트 때 만들어진 뒤 바뀌지 않는 데이터로 분류돼 있어 경로당 신설·폐지 같은 수시 변경 반영을 기대하기 어렵다. 공통 조인 키가 없어 다른 시설·주소 데이터와 자동 결합이 어렵고, 개발계정은 하루 1,000회 호출 제한이 있다.
