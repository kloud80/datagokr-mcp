description_portal: 다중이용업 통계정보는 대구광역시 민원정보시스템으로부터 수집된 자료로, 다중이용업소에 대한 행정 처리 및 점검 현황 등의 통계 수치를 포함합니다. 항목에는 업소 수, 점검 결과, 위반 사례 등 다양한 통계가 있으며, 이는 정책 수립과 안전 강화 대책 마련에 유용한 기초자료가 됩니다. 데이터는 참고용으로 일부만 수록되어 있어, 통계 분석 시에는 원본 자료와의 대조가 필요합니다.* 본 자료는 민원정보시스템에서 추출한 자료로 일부 대상물에 대한 관한 정보만 포함되어 있음* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
