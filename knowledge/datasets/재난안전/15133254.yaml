summary_user: 국토지반정보 포털시스템이 제공하는 전국 건설 현장 지반조사자료 중 전기비저항탐사 결과를 측선·순번별 측점 단위로 담은 파일로, 측점마다 좌표(시작·종료, TM, 경위도)와 겉보기 비저항(ohm-m)을 기록한다. 건설·지반 분석가가 특정 지역의 지하 지반 상태나 공동·연약층 가능성을 사전 검토할 때 해당 위치의 비저항 분포를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 지반정보 데이터와는 프로젝트코드나 좌표 기준의 공간 매칭으로 이어 쓴다.
