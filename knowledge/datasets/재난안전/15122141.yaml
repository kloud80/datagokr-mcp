description_portal: 광주광역시 남구 급경사지 현황에 대한 데이터로 급경사지 명칭, 주소, 연장, 높이, 경사도, 등급현황을 제공합니다. 해당 데이터는 광주광역시 남구청 안전총괄과(☎062-607-2942)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 급경사지는 경사가 급하여 비·눈 등 기상 상황이나 토질 특성에 따라 붕괴·산사태 등 위험이 발생할 수 있는 지형을 의미합니다. 해당 데이터는 재해 취약 지역을 사전에 파악하고, 산사태·낙석 등 자연재해 예방 대책을 마련하는 데 활용될 수 있으며, 지자체는 이를 기반으로 사면 보강 공사 계획, 안전점검 및 정비 사업, 주민 대피계획 수립 등을 추진할 수 있습니다. 또한 연구기관이나 민간에서는 재해 위험도 분석, 도시 개발 시 지반 안전성 검토, 재해 예방 교육 자료 제작 등에 활용할 수 있습니다.
