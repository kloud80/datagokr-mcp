description_portal: 서울특별시 공동구 침수대비 각 관리소 별 보유하고 있는 이동식 양수기 현황입니다. 이동식 양수기는 우수 또는 상수도관로 파손 등 다량의 물이 공동구 내부로 유입될 때 공동구 내부에 있는 펌프만으로 처리가 되지 않을 경우 신속하게 현장으로 이동하여 내부의 물을 바깥으로 배출시켜 줄 수 있도록 해주는 장비입니다. 각 공동구별로 이동식 양수기를 보유하여 재해상황시 신속히 현장으로 출동 및 활용하여 침수대비 초동조치를 할 수 있도록 도와줍니다. 본 자료에서는 이동식 양수기의 펌프형식, 수량, 용량, 양정, 토출량에 대한 내용을 포함하고 있습니다.
