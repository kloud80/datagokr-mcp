description_portal: '한국산업안전보건공단에서 제공하는 직업건강에 대한 데이터로 국소배기장치 설치현황에 대한 내용입니다.업종, 생산품, 공정명, 물질상태, 후드형식, 제어풍속값, 측정결과값, 국소배기장치 적정 여부 등에 대한 내용을 알 수 있습니다.* 국소배기장치의 후드 형식 : 포위식 포위형, 포위식 후드, 외부식 측방흡인형, 외부식 하방흡인형, 외부식 상방흡인형산안전보건기준에 관한 규칙 <관리대상 유해물질에 의한 건강장해의 예방>제422조(관리대상 유해물질과 관계되는 설비)○ 사업주는 근로자가 실내작업장에서 관리대상 유해물질을 취급하는 업무에 종사하는 경우에 그 작업장에 관리대상 유해물질의 가스·증기 또는 분진의 발산원을 밀폐하는 설비 또는 국소배기장치를 설치하여야 한다. 다만, 분말상태의 관리대상 유해물질을 습기가 있는 상태에서 취급하는 경우에는 그러하지 아니하다.'
