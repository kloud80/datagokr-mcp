description_portal: 한국소방산업기술원 소방산업 통계 조사는 소방산업의 진흥에 관한 법률 제18조(소방산업에 관한 정보의 관리)에 의거하여 국내 소방산업 전반에 관한 정보를 수집, 조사하여 체계적이고 종합적인 관리 및 보급을 목적으로 실시합니다.본 통계조사 결과는 소방산업 활동을 영위하는 기업체 분포와 고용구조 및 경영실태 등을 종합적으로 파악하여 소방산업 육성 및 진흥 등을 위한 국가 및 지방자치단체의 각종 정책과 기업의 경영계획 수립 및 평가, 학계, 연구소 등의 연구 분석 등을 위한 기초자료 제공, 활용을 위하여 제공합니다.본 통계조사는 국가승인통계로 지정되어 있으며 자세한 통계정보는 통계청에 게시된 "이용자용통계정보보고서"에  수록되어 있습니다.데이터는 통계조사집(pdf), 소방산업 매출액, 업체수, 종사자수, 업종별 매출액 및 종사자수(csv) 데이터로 구성되어 있습니다.
