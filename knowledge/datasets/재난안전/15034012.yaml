description_portal: 부산광역시에서 측정한 44개소의 방사능 분석결과 데이터를 개방합니다.방사능은 원자핵이 붕괴할 때 방출되는 에너지의 양을 의미하며, 방사선은 이러한 방사능이 방출할 때 나오는 전자기파나 입자를 나타냅니다. 우라늄, 라듐, 세슘 등은 자연적으로 방사능을 갖는 대표적인 원소들입니다. 일반적으로 일상생활에서도 방사능이 발생하지만 인체에 영향을 줄 정도는 아닙니다. 하지만  높은 농도의 방사선은 인체에 해로워 이를 모니터링하는 것이 중요합니다. 방사선에 노출될 경우 구토, 피부손상, 탈모, 백혈병, 갑상선암 등의 질병이 발생할 수 있습니다. 개방되는 데이터에는 방사능 측정연월, 방사능 종류, 측정지점, 측정기간, 요요드131, 세슘134, 세슘137 검출여부를 포함합니다.
