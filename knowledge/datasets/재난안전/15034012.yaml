summary_user: 부산광역시가 측정한 44개 지점의 방사능 분석결과를 측정연월·방사능 종류·측정지점·측정기간별로 담고, 요오드131·세슘134·세슘137(필드에 삼중수소 항목도 있음)의 검출 여부를 기록한다. 부산 시민이나 분석가가 "우리 지역 측정지점에서 최근 세슘이나 요오드가 검출된 적이 있는가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 측정지점 이름(rshLoc)을 매핑하거나 같은 기관 데이터끼리만 연결한다.
limits: 표준 지점 코드나 좌표 같은 공통 조인 키가 없어 다른 방사능·환경 데이터와 바로 결합하기 어렵다. 주기는 이벤트 단위로 분류돼 정기 갱신을 전제하면 안 되며, 범위는 부산 시도 단위로 한정된다.
