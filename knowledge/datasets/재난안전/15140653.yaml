description_portal: 이 데이터는 광주광역시 서구 관내 폭염 예방 및 열환경 개선을 위해 설치된 쿨링포그(물안개분사장치)의 현황을 정리한 공공데이터입니다. 시설별  연번, 위도 및 경도 좌표, 관리기관명 등의 항목으로 구성되어 있습니다. 해당 자료는 여름철 고온기 시민 체감온도 저감, 도심 열섬현상 완화, 보행자 중심 안전 환경 조성, 기후 변화 대응 인프라 구축 등 정책 수립과 시설 확충에 활용될 수 있습니다. 행정기관의 유지보수 계획 수립, 재난취약지역 분석, 공간정보 기반 안전지도 제작, 민간 안전캠페인 추진 등 다양한 행정 및 공공서비스 분야에서 참고자료로 유용합니다. 각 행은 하나의 쿨링포그 설치 지점을 의미하며, CSV 형식으로 정기 갱신됩니다.
