description_portal: 스마트빅보드는 사물인터넷 등 IT 기술을 활용 다양한 재난정보를 수집하여 지도상에 재난 발생 위치와 유형 등 현장상황을 실시간으로 표출, 신속한 의사결정을 지원하는 재난상황관리시스템IT기술 활용 다양한 재난정보(강우, 풍향, 풍속, 등)를 수집, 지도에  위치 유형 등 재난상황표출, 신속한 의사결정을 지원하는 시스템각종 재난 정보(CCTV, 기상관측 센서 등) 통합 관리 ㅇ 現在 활용사례   - 태풍 및 집중호우 발생시 초단기(0~2시간) 집중호우 예측 시스템과 기상청 및 市 기상정보를 활용, 재난 상황관리 및 초등 대응   - 누적 강우량 150mm 이상 발생시 산사태 예경보 시스템을 활용, 행정동 단위 및 5m×5m 간격 산사태 위험정도 확인   - 재난, 방범, 유관기관(소방, 교통 등) 등 모든 공공 CCTV를 통합 연계를 통해 재난취약지 등 부산전역 영상관제   - APEC 기후센터 협력 도시침수 예측 시스템 통한 침수재난 발생 2시간적 예측 분석으로 골든타임 확보
