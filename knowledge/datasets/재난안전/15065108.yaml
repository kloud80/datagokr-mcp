description_portal: '해당 데이터는 2019년 119구급대가 심정지 환자 발생 신고를 접수해 출동한 사례를 집계한 자료로, 응급의료 대응의 실태를 보여주는 중요한 통계입니다. 이 데이터에는 연도별·지역별 출동 건수, 환자 상태별 분류, 심폐소생술(CPR) 실시 여부, 자동심장충격기(AED) 사용 여부, 환자 이송 현황 등이 포함됩니다. 이를 통해 월별 , 지역별 심정지 환자가 많이 발생하는지 알 수 있으며  특히 심정지 환자는 골든타임 확보가 생존율에 직결되므로, 해당 자료는 구급대 활동의 효과성을 확인하고 정책 개선 방향을 제시하는 데 중요한 의미를 가집니다. 또한 지역 간 응급처치 격차, 시간대별 발생 패턴, 환자 이송 성공률 등을 분석해 심정지 환자 대응 체계 강화, 구급대 교육 및 장비 보강, 시민 대상 CPR 교육 확대 등 실질적 개선 활동에 활용할 수 있습니다.(참고 : 구급활동일지의 환자증상(호흡정지, 심정지) 또는 환자분류(사망, 추정) 또는 응급처치 CPR(실시, 거부, DNR, 유보) 중 하나라도 체크된 경우임)'
