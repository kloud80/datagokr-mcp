summary_user: 광주광역시 남구에서 발생한 침수 피해를 피해연도·구분·발생장소(도로명주소) 단위로 한 건씩 기록한 시군구 범위의 파일 데이터입니다. 주민이나 분석가가 '남구에서 침수 피해가 반복된 동네나 도로는 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 도로명주소를 주소 매칭이나 지오코딩해 다른 재해위험지구·대피시설 데이터와 위치 기준으로 겹쳐 본다.
description_portal: 광주광역시 남구 침수 피해 현황 및 정보(피해연도, 구분, 발생장소 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 안전총괄과(☎062-607-2942)에서 제공합니다. ※ 침수 피해란 집중호우나 하천 범람 등으로 물이 도로·건물·농경지 등에 침범하여 발생하는 모든 피해를 말합니다. 침수 피해 예방 및 대응 방법은 다음과 같습니다. ○ 사전 대비 - 배수로·제방 점검 - 저지대 주택·시설 피난 계획 마련○ 사고 발생 시 - 즉시 상부로 대피 - 재난문자·기상정보 수시 확인 - 전기 차단 및 가스 밸브 잠금○ 사후 복구 - 내벽 청소·소독 - 피해 사진 기록 후 보험·지자체 지원 신청
