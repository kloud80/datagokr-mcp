summary_user: 광주 서부소방서 관내 화재예방강화지구인 양동시장 일대(양동·복개·수산·건어물·경열로·닭전길)에 설치된 소방설비 현황을 항목별로 집계한 작은 파일(csv, 496바이트)로, 포털 설명상 2024년 12월 31일 기준 소화기 855개, 소방용수시설 14개, 건물 155동, 등록 업체 969곳 등을 담는다. 전통시장 화재 대비 수준을 점검하는 시장 상인회·지자체 담당자·안전 분석가가 '양동시장에 소화기와 소방용수시설이 건물·업체 수에 비해 얼마나 갖춰져 있나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 소방 데이터(소방용수 위치 원장, 화재 발생 건별 자료 등)와는 시장명·지역명을 손으로 맞춰서만 이어 쓴다.
