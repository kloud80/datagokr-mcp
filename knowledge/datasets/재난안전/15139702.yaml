summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 소규모 공공시설을 시설 일련번호 단위로 담은 원장으로, 시설 구분·시설명, 위험시설 지정 여부·지정일자·고시번호, 시작·끝 구간 주소, 연장·폭 같은 제원, 관리 공무원·주민 연락처가 들어 있다. 지자체 안전 담당자나 분석가가 "우리 지역 소규모 공공시설 가운데 위험시설로 지정된 곳은 어디이고, 담당 부서는 어디인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 시설 안전·재난 위험지역 데이터와는 지역코드(RGN_CD)나 구간 법정동 코드, 시설명·주소 매핑으로 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 소규모 공공시설 정보로, 지역코드, 소규모공공시설일련번호, 시설구분코드, 시설명, 위험시설지정여부, 위험시설지정일자, 상세주소 등을 제공하고 있습니다. 데이터의 갱신주기는 1시간입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
team:
