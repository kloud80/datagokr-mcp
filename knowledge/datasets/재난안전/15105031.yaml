description_portal: '이 자료는 경기도 여주시 관내에 설치된 안전비상벨의 위치 및 관리 현황에 대한 종합적인 정보를 담고 있습니다. 주요 항목으로는 각 비상벨의 고유 식별을 위한 안전비상벨 관리번호가 있으며, 설치 목적이 명시되어 있어 범죄예방, 긴급상황 대응, 생활 안전 확보 등 각 장치의 기능적 의도가 구분됩니다. 설치 장소의 유형(예: 공원, 도로, 학교 주변, 아파트 단지 등)과 구체적인 설치 위치, 도로명 주소 및 지번 주소가 함께 제공되어 시민들이 직접 위치를 확인하고 접근할 수 있습니다. 또한, 위도 및 경도 좌표가 포함되어 있어 지도 기반의 위치 분석이나 시스템 연계가 용이합니다'
