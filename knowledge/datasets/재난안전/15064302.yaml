description_portal: '이 통계는 경찰청 생활안전교통국 교통안전과에서 제공하는 이륜차 위반법규별 단속 현황입니다.단속 현황 주요 요약전체적인 추이: 2020~2021년 코로나19 시기 배달 수요 증가로 단속 건수가 급증했으나, 이후 점진적인 감소세를 보입니다.주요 위반 항목: 신호위반과 보호장구 미착용이 가장 높은 비중을 차지합니다. 신호위반은 2021년 86,915건으로 정점을 찍은 후 2025년 59,408건으로 감소했습니다.급격한 변화: 안전운전 의무 위반 단속 건수는 2022년 4,135건에서 2023년 856건으로 급감하며 뚜렷한 변화를 보였습니다.보도통행 및 기타: 보도통행은 1~2만 건 수준을 유지하고 있으며, 기타 항목은 2021년(127,593건)에 크게 증가했다가 다시 완만해지는 추세입니다.종합적으로 2020년대를 기점으로 단속 강도가 높았으나, 최근에는 전반적인 수치가 안정화되고 있는 양상을 띱니다.'
