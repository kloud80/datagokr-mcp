summary_user: 군산시 내 유해화학물질 취급 업체를 한 건씩 담은 파일로, 업체명·지번주소·허가업종·취급물질명과 연간취급량·저장탱크·운반장비·보관시설 능력, 산단 종류를 시군구 범위의 개별 주소 단위로 수록한다. 주민이나 지자체 방재 담당자가 '우리 동네·산업단지 주변에 어떤 화학물질을 얼마나 다루는 업체가 있는가'를 확인하거나, 화학사고 대비 주민 보호계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·사업자번호·주소를 이름 매칭하거나 같은 기관(군산시) 자료끼리만 이어 쓰며, 지번주소를 좌표로 바꾸면 대피시설·위험지역 데이터와 겹쳐 볼 수 있다.
description_portal: 이 데이터는 「군산시 화학물질안전관리 및 알 권리에 관한 조례」 제22조에 따라 공개된 유해화학물질 취급시설의 설치 현황을 나타낸 자료로, 군산시 내 화학물질을 취급하는 주요 시설의 위치, 설치 여부, 관련 정보 등을 포함하고 있다. 해당 자료는 시민의 안전과 건강을 보호하고, 지역 내 화학물질 사고 예방 및 대응 체계 구축을 위해 제공되며, 유해물질 관리의 투명성과 공공 알 권리를 보장하기 위한 목적을 가진다. 특히 이 데이터는 유해화학물질의 지역 내 분포 상황, 관리 대상 시설 수, 법적 기준에 따른 설치 및 운영 현황 등을 파악하는 데 유용하며, 화학물질 안전 관리 정책 수립, 환경영향 평가, 주민 보호계획 수립 등에 활용된다. 공공기관, 연구기관, 시민사회 모두에게 중요한 정보로 기능한다.
