summary_user: 충청남도 보령시 관내에 설치된 폭염저감시설(그늘막)을 한 곳씩 담은 건별 목록으로, 종류·설치장소명·도로명/지번 주소·위도·경도·설치일자·관리기관·연락처를 함께 싣는다. 보령시 주민이나 보행자가 "우리 동네 버스정류장이나 공원 근처 어디에 그늘막이 있나"를 확인하거나, 분석가가 읍면동별 그늘막 분포를 지도에 올려 폭염 대응 공백 지역을 찾는 데 쓴다. 전역 조인 키는 없어서 주소·위도경도나 읍면동(행정동) 이름을 맞춰 무더위쉼터 등 다른 대피·구호시설 데이터와 공간적으로 겹쳐 본다.
description_portal: 기후변화로 인한 이상고온 현상 빈발과 폭염 강도 증가에 따른 시민 건강 보호 필요성 증대, 고령인구 증가와 야외 근로자 및 보행자의 온열질환 예방을 위한 그늘 인프라 확충 요구, 그리고 폭염특보 발령 빈도 증가와 도시열섬현상 완화를 위한 폭염대응 정책 강화에 따라 보령시는 관내 설치된 폭염저감시설(그늘막) 현황을 체계적으로 관리하고 있습니다. 그늘막은 직사광선을 차단하여 표면온도와 체감온도를 낮추는 물리적 폭염저감시설로서 버스정류장, 공원, 산책로, 어린이놀이터 등 시민들이 자주 이용하는 공간에 설치되어 폭염 시 임시 대피공간 역할을 담당하고 있습니다. 그늘막 종류별 차양 효과와 내구성을 분석하여 지역 특성에 맞는 최적의 시설 설치 기준을 마련하고, 설치 위치별 이용률과 효과성을 평가하여 향후 확충 계획과 관리 방안 수립에 활용하며, 폭염 대응 체계의 핵심 인프라로 활용하고 있습니다.
