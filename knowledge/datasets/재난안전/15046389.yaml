description_portal: '○ 통계개요* 통계명 : 어린이 교통사고 현황* 통계종류 : 서울시 어린인 교통사고 현황을 사망·부상자별로 제공하는 일반·보고통계* 근거법령 :「도로교통법」제2조에 규정하는 도로에서 차의 교통으로 인하여발생한 인적피해를 수반하는 교통사고* 작성목적 : 교통위반 및 사고 현황을 종합적이고 체계적으로 분석하여 교통안전대책 수립,학술연구 등의 기초자료 및 국민의 교통안전의식 제고에 활용하는 것을 목적으로 함* 조사체계 : 교통사고조사 경찰관 → 경찰청, 도로교통공단* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 어린이 교통사고의 발생건수, 사망자수, 부상자수 등○ 용어설명* 어린이 교통사고 : 만13세 미만의 어린이 사상자가 발생한 교통사고* 어린이보호구역 교통사고:학교 앞 등과 같이 어린이보호구역으로 지정된 도로부분에서 발생한 사고를 말함* 보행자: 보행자는 도로를 보행하거나 노상 작업중인 자, 노상 유희중인 자, 도로에 서 있거나 누워있는 사람,장애자용 휠체어를 타고 있거나 밀고 가는 사람, 세발자전거나 모형자동차에 타고 있는 아이 또는이를 밀고 가는 사람, 이륜차 원동기장치자전거 자전거를 끌고 가는 사람(단, 이륜자동차, 원동기자전거, 자전거 이외의 차량을 밀고 있는 사람은 당해 차량의 운전자로 봄)* 사망 : 교통사고 발생시로부터 30일 이내에 사망한 경우(99년까지는 72시간 이내)* 부상 : 중상(3주이상의 치료) + 경상(5일이상 3주미만의 치료) + 부상신고(5일미만의 치료)○ 기타* 어린이 : 13세 미만* 2007년부터 구별자료로 확대 및 항목변경* 2007년부터 지방경찰청 단위가 아닌 사고발생지역 단위(서울시) 기준임'
