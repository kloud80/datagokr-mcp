summary_user: 충주시에 설치된 보안등을 한 기마다 한 행으로 담은 원천 목록으로, 표찰번호·지역·상세위치·주소·위도·경도·관리기관을 담는다. 주민이나 분석가가 "우리 동네 골목길 어디에 보안등이 있고, 고장 신고할 때 표찰번호가 무엇인가" 또는 "야간 보행 취약구간에 보안등이 부족한 곳은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 위도·경도로 CCTV·안전비상벨 같은 다른 방범시설 좌표와 공간 결합하거나 주소·지역명을 매칭해 이어 쓴다.
description_portal: 본 데이터는 충청북도 충주시의 보안등 관리 현황을 제공하는 자료로, 표찰번호, 지역, 상세위치, 주소, 위도, 경도, 관리기관 등의 항목으로 구성되어 있음. 보안등은 주로 골목길, 이면도로, 주택가 등 취약지역에 설치되어 야간 보행 안전을 확보하는 역할을 하며, 해당 데이터는 각 보안등의 설치 위치와 관리 정보를 체계적으로 파악할 수 있도록 함. 이 자료는 야간 안전환경 조성, 범죄 예방, 에너지 관리, 유지보수 계획 수립 등 다양한 행정적 활용이 가능하며, GIS 기반 지도 시각화와 결합하면 지역별 보안등 분포 및 관리 효율성을 높이는 기초자료로도 유용함.
