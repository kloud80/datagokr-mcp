summary_user: 울산 울주군에서 방사능 비상 때 피폭·부상 환자 치료를 맡는 종합병원·병원·의원을 병원 단위로 담은 API입니다. 포털 설명에는 위치, 방사선 비상진료 지정 여부, 병상·병실·의사 수가 있다고 되어 있으며, 범위는 울주군 한 시군구입니다. 원전 사고 대비 계획을 세우는 담당자나 분석가가 '구호소나 사고 지점에서 환자를 어느 병원으로 옮기고, 몇 명까지 받을 수 있나'를 따질 때 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못해 구호소·대피시설 데이터와는 병원명·주소 같은 이름 매핑이나 같은 기관 코드로만 연결합니다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 병원 조회 서비스는 방사능 비상 상황 시 발생할 수 있는 환자(방사선 피폭, 일반 부상 등)의 치료와 긴급 의료 지원을 담당하는 의료기관의 위치 및 대응 역량 정보를 제공하는 데이터입니다.사고 발생 시 즉각적인 치료가 가능한 종합병원, 병원, 의원의 위치 정보를 포함합니다. 특히 방사선 비상 진료 지정 병원 여부 등이 중요한 정보가 됩니다.각 병원의 병상 수, 병실 수, 의사 수 등 시설 제원 정보가 포함되어 있어, 대규모 환자 발생 시 수용 가능 인원을 예측하는 기준이 됩니다.사고 지점이나 '구호소'로부터 환자를 이송하기에 가장 적합한 병원을 지도상에서 분석할 수 있습니다.
