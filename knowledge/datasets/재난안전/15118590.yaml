description_portal: 빅데이터 분석을 통해 연안사고 다발구역을 예측한 모델의 2025년도 자료입니다.연안을 격자단위로 나누어 각 격자별로 위험도를 예측하였습니다.위험지수별 위험등급:고위험<=1, 위험<=0.9, 주의<=0.6, 보통<=0.4, 안전<=0.2격자좌표정보(geometry)에서 사용된 좌표계는 EPSG:5179 입니다.연안사고 예측모델은 최근 5년간의 조석·기상 및 지형 등 해양사고와 관련된 빅데이터 분석을 통해 사고위험이 높은 시기와 지역의 예측 값을 도출하는 시스템이다.  격자좌표정보(geometry)의 데이터 길이가 길어서 엑셀로 열기에 제한이 있을 수 있습니다.(엑셀은 한 칸에 들어갈 수 있는 최대 글자수가 제한되어 있음) 엑셀보다 메모장과 같은 문서뷰어 프로그램, 또는 공간정보프로그램을 통해 열어보아야 데이터가 명확하게 표시됩니다.
