description_portal: '해양오염 방제훈련은 해양환경관리법 및 국가긴급방제계획에 따라 바다에 오염물질(기름, 유해화학물질, 폐기물 등)이 유출된 경우를 대비하여 실시하는 방제훈련을 말하며, 종류는 해상방제훈련, 위험유해물질 훈련, 해안방제훈련, 도상훈련, 긴급동원훈련, 자체훈련, 타기관 등 훈련 지원으로 구분됩니다.  ※ 해상방제훈련 : 바다에 기름이 다량으로 유출된 경우을 대비하여 실시되는 훈련      위험유해물질 훈련 : 바다에 유해화학물질이 다량으로 유출된 경우를 대비하여 실시되는 훈련      해안방제훈련 : 유출된 기름이 조류 및 바람에 따라 해안가로 부착된 경우를 대비하는 훈련      도상훈련 : 다량의 오염물질이 유출된 경우을 가정하여 실시되는 도상훈련(방제대책본부 가동 훈련)      긴급동원훈련 : 방제기자재 등을 신속하게 사고현장으로 이동 및 배치하기 위한 훈련      자체훈련 : 해양오염사고를 대비하여 해양경찰이 자체적으로 실시하는 훈련      타기관 지원훈련 : 해양오염의 관련기관(지자체, 환경부 등) 주관으로 하는 훈련에 지원하는 경우'
