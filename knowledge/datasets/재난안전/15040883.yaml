description_portal: 국토안전관리원이 제공하는 현수교 등 다양한 교량의 계측기 설치 현황 데이터입니다.데이터는 총 9개의 교량에 대한 데이터를 설명하고 있으며, 교량은 강상형교 1개, 아치교 3개, 현수교 5개에 관한 정보를 나타냅니다.순번, 형식, 교량명으로 교량을 구분하고 있으며, 각 교량은 가속도계, 경사계, 케이블가속도계, 처짐계, 동적변형률계 등 총 16개 종류의 계측기 설치 수를 설명합니다.모든 교량이 가속도계와 온도계가 설치되어 있으며, 하중계, 광섬유변형률계, 광섬유온도계는 설치되어 있는 교량이 없는 상황입니다.
