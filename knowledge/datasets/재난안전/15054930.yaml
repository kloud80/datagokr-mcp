summary_user: 광주 남부소방서 관내 4개 119안전센터(송하·월산·봉선·대촌)별로 출동건수, 이송인원, 대원 1명당 이송인원, 평균 도착 소요시간·거리를 항목(구분)별 행, 센터별 열로 정리한 집계표이며 파일 크기는 255바이트에 불과한 소규모 CSV다. 분석가나 지역 주민이 '남부소방서 관내에서 어느 안전센터의 구급 출동이 가장 많고, 현장 도착까지 평균 몇 분·몇 km가 걸리는가'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 안전센터 이름을 매핑하거나 같은 기관의 다른 소방 데이터와 나란히 놓고 보는 방식으로만 잇는다.
