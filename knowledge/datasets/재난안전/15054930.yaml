description_portal: '광주광역시 남부소방서 관내 구급출동 현황 정보 입니다.남부소방서에는 총 4개소의 119안전센터가 있으며 송하119안전센터(송하동), 봉선119안전센터(방림동), 대촌119안전센터(지석동)에 구급차 1대씩, 월산119안전센터(월산동)에 2대의 구급차가 배치되어 있어 총 5대의 구급차를 운용중에 있습니다.  - 상세내용: 센터별(4개소) 출동건수, 이송인원,  대원1명당 이송인원, 센터별 평균 도착 소요시간, 센터별 평균 도착 소요거리 정보 데이터 제공 - 출동건수: 월산119안전센터 > 봉선119안전센터 > 송하119안전센터 > 대촌119안전센터'
