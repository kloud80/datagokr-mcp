description_portal: 이 공공데이터는 2016년부터 2020년까지 강원도 내에서 발생한 성범죄의 피해자를 성별로 구분하여 제공하는 자료입니다. 항목은 연도별로 나뉘며, 여성 피해자, 남성 피해자, 성별이 불분명하거나 확인되지 않은 "불상" 항목을 포함하고 있습니다. 이 데이터는 성별에 따른 피해자 분포와 성범죄 양상을 분석할 수 있도록 구성되어 있어, 성인지 기반 정책 수립, 피해자 보호체계 개선, 성범죄 예방 교육 자료로 활용됩니다. 경찰청, 지자체, 여성가족부, 인권·복지기관 등에서 정책 설계와 실태 분석을 위해 사용할 수 있으며, 학술기관과 언론, 시민단체에서도 성범죄 대응력과 보호체계의 실효성을 평가하는 자료로 폭넓게 활용 가능합니다.
