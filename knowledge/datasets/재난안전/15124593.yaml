description_portal: '서울특별시 마포구 관내에 위치한 기계설비 성능점검에 대한 정보입니다. 이 데이터에는 점검 대상 기계설비가 실제로 설치된 장소의 도로명 주소와 행정동이 포함되어 있습니다.또한, 각 기계설비의 분류(예: 연면적1만평방미터 이상 등), 건물명과 우편번호, 연면적, 세대수(예: 일반건축물, 주상복합 등), 주용도(예: 판매시설, 교육연구시설, 아파트, 업무시설 등)에 대한 세부 사항이 함께 제공됩니다. 이 데이터를 통해 건축물 소유자 및 관리자는 해당 기계설비의 성능을 주기적으로 확인하고, 필요한 유지보수나 교체를 적기에 진행할 수 있어 에너지 절감과 시설 안전을 동시에 확보할 수 있습니다.'
