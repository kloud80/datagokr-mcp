description_portal: 본 데이터는 경찰청 여성청소년범죄수사과에서 관리하는 통계로, 2006년부터 2025년까지 국내에서 발생한 성폭력범죄의 발생건수, 검거건수, 검거인원 및 신병 처리(구속·불구속) 현황을 제공합니다.약 20년간의 장기 데이터를 통해 국내 성폭력범죄의 발생 추이와 경찰의 검거 역량 변화를 정량적으로 파악할 수 있습니다. 특히 연도별 발생 건수 대비 검거율 산출이 가능하며, 피의자에 대한 구속 및 불구속 조치 현황을 포함하고 있어 사법 처리 지침의 변화나 수사 환경의 흐름을 분석하는 데 유용합니다. 성범죄 예방을 위한 정책 수립, 치안 행정 서비스 개선, 관련 분야 학술 연구 및 사회적 안전망 구축을 위한 기초 통계 자료로 활용 가치가 높습니다.
