summary_user: 인천광역시 서구(서해구) 안에서 산사태취약지역으로 지정된 곳을 한 행씩 담은 파일로, 소재지 지번·지목·지정면적·지정일·데이터기준일자를 담는다(929바이트 크기의 소규모 CSV). 주민이나 부동산·개발 사업자가 '이 지번 땅이 산사태취약지역으로 지정돼 있는가, 언제 얼마만큼 지정됐는가'를 확인하거나, 방재 담당자가 예방·정비 대상지를 추리는 데 쓴다. 전역 조인 키가 없어 소재지 지번 주소를 기준으로 지번·주소 체계나 토지 규제 레이어, 같은 기관의 다른 재해위험지역 자료와 이름·주소 매칭으로 이어 쓴다.
limits: 표준 코드(법정동코드·PNU 등) 컬럼이 없어 다른 데이터와는 지번 문자열 매칭으로만 연결된다. 범위가 서구 한 시군구에 그치고, 명세상 연간 갱신이라 지정 변경이 바로 반영되지 않을 수 있으므로 데이터기준일자를 확인해야 한다.
