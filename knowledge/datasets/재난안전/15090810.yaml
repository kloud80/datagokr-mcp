description_portal: 본 공공데이터는 인천광역시 서구 내 산사태 발생 우려가 있는 지역을 대상으로 지정된 산사태취역지역의 현황을 정리한 자료입니다. 본 데이터의 각 항목에는 소재지 지번, 지목, 지정면적, 지정일, 기준일자 정보가 포함되어 있습니다. 본 자료를 통해 지역별 산사태 위험도를 파악하고 효율적인 재난 예방 및 관련 정책 수립에 활용 될 것으로 판단됩니다. 또한 지정된 면적과 위치 정보를 통하여 서구 지역 내 재해 취약구간에 대한 선제적 대응 및 정비 계획 수립에 유용한 기초자료로 사용 할 수 있을것으로 판단됩니다.
