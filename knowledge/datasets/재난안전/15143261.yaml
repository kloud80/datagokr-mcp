description_portal: '경찰청 경기도남부경찰청이  경기남부 지역 내 가정폭력 사건의 검거 및 조치 현황을 집계한 공공데이터입니다. 연도별로 가정폭력 발생 건수, 검거 인원, 조치 사항(예: 보호처분, 접근금지 명령 등)이 포함되어 있어 지역별 가정폭력 발생 양상을 분석하는 데 유용합니다. 경찰의 대응 현황과 범죄 예방을 위한 조치가 명확히 구분되어 있으며, 가정폭력 예방 정책 수립 및 피해자 보호 대책 마련 시 근거 자료로 활용될 수 있습니다. 또한 사회복지 기관, 여성 보호 단체, 지역 자치단체 등에서도 지역별 문제를 파악하고 맞춤형 예방 활동을 계획하는 데 사용할 수 있습니다. 데이터는 범죄 피해자 보호 정책 개선과 실무 활용성에 기여할 수 있는 핵심 자료입니다.'
