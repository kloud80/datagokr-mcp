description_portal: 경상북도 산사태취약지역 지정현황은 산사태에 취약한 지역을 조사하고 지정한 정보를 정리하여 제공하는 자료입니다. 이 데이터는 시군구 읍면동 리 지번 등 행정구역 정보를 포함하며 위도와 경도를 도 분 초 단위로 구분하여 위치를 세부적으로 파악할 수 있도록 구성됩니다. 또한 토석류 등 취약지역 유형과 지정면적을 함께 수록하여 위험 정도를 판단하는 데 도움이 되며 지정일자 정보를 통해 시점별 변동 사항을 확인할 수 있습니다. 자료는 표 형태로 제공되며 지역별 위험 분포를 파악하고 사전 대비 계획을 수립하는 데 활용됩니다. 산지 재해 예방과 관리 정책 수립을 위한 기초 자료로도 활용되며 장기적 분석을 통해 산사태 발생 가능 지역을 예측하는 데에도 사용됩니다. 자료 관련 문의는 054-880-8333으로 하시기 바랍니다.
