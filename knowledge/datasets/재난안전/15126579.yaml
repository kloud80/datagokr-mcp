summary_user: 경상북도 안에서 산사태취약지역으로 지정된 곳을 지번 단위로 한 줄씩 담은 표 파일로, 시군구·읍면동·리·지번, 도·분·초로 나뉜 위도·경도, 취약지역 유형(토석류 등), 지정면적(제곱미터)을 수록한다. 주민이나 토지 매수 검토자가 '내 땅이나 마을 뒷산이 산사태취약지역에 들어가는가'를 확인하거나, 방재 담당자가 시군별 취약지역 분포를 보고 사전 대비 계획을 세우는 데 쓴다. 전역 조인 키는 없어서 행정구역 이름과 지번을 주소 매핑해 다른 자료와 잇거나, 도·분·초 좌표를 십진 좌표로 바꿔 대피소·급경사지 같은 재난 위험지역 자료와 위치로 겹쳐 쓴다.
limits: 행정코드나 PNU 같은 공통 키가 없어 다른 데이터와는 이름·지번 매칭으로만 연결된다. 명세상 연간 단위로 생성되는 자료라서 실시간 위험 경보나 특보 용도로는 쓸 수 없고, 지정 이후의 변동은 다음 갱신본에서 확인해야 한다.
