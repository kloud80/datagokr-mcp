summary_user: 부산광역시 서구에 설치된 가로등 수량을 도로명별로 집계한 파일로, 관리기관·도로명·등수(가로등 수량)·데이터 기준일자를 담는다(개별 가로등 위치 건별 원천이 아니라 도로 단위 집계이며, 파일 크기는 약 1.3KB). 구청 시설 담당자나 지역 분석가가 "서구에서 어느 도로에 가로등이 많고 적은가"를 확인해 야간 조명 유지관리·예산 편성·생활안전 개선 대상을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 문자열 매핑이나 같은 기관(서구) 기준으로만 이어 쓰며, 같은 지역의 보안등·CCTV·안전비상벨 현황과 도로명 단위로 나란히 비교하는 용도가 적합하다.
description_portal: 부산광역시 서구의 가로등에 대한 데이터로, 서구의 도로명 주소별로 위치한 가로등의 위치, 개수에 대한 데이터를 제공합니다.이 데이터는 주요 도로 및 생활도로에 설치된 가로등 수량을 도로명별로 분류해 관리함으로써, 도시 조명 인프라의 유지관리, 안전 확보, 예산 편성 및 개선 계획 수립에 활용할 수 있도록 구성돼 있습니다.수집 항목에는 관리기관, 연번, 도로명, 등수(가로등 수량), 데이터 기준일자가 포함되어 있으며, 이를 통해 각 도로별 가로등 분포와 조명 인프라 규모를 한눈에 파악할 수 있습니다.예시 데이터에는 감천로, 구덕로, 꽃마을로, 대영로, 송도해변로, 암남공원로, 천마산로, 충무대로, 해돋이로 등 서구 주요 도로가 포함되어 있으며, 도로별로 5개에서 575개까지 다양한 가로등 수량이 기록돼 있습니다.‘기타’ 항목에는 개별 도로명으로 분류되지 않은 소규모 생활도로 또는 기타 지역의 가로등 현황이 포함됩니다.
