summary_user: 전국 화재를 시군구 단위로 담은 파일로, 화재 발생일·시도·시군구·사망·부상·재산피해(천원)를 행 단위로 담고 있어 건별 기록에 가까워 보인다. 농촌·축산 분야 정책 담당자나 분석가가 '최근 몇 년간 어느 시군구에서 화재 인명·재산 피해가 컸는가'를 따지는 데 쓴다. 전역 조인 키나 행정코드가 없어 다른 통계와는 시도·시군구 이름을 맞춰 연결해야 한다.
description_portal: 해당 데이터는 2013년~2022년   축사화재 건수를  나타내는 데이터입니다. 연도별·지역별로 발생한 축사 화재 건수, 전체 화재 발생 건수, 인명 피해(사망·부상자), 재산 피해 규모가 포함됩니다.농촌 지역 화재 예방 정책을 수립하거나, 축사 전기시설 안전점검, 농가 대상 화재 예방 교육 추진 시 중요한 근거 자료로 활용됩니다. 또한 연구자들은 해당 데이터를 통해 축사 화재의 비중, 계절별 발생 패턴, 지역별 피해 특성을 분석할 수 있으며, 시민들에게도 농업·축산업 분야의 화재 안전 중요성을 인식 시킬 수 있습니다.
