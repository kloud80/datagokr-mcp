description_portal: '부산광역시 금정구에 소재한 어린이 놀이시설에 대한 데이터로  놀이시설 설치일자, 설치장소, 운영여부 등의 정보를 제공합니다.설치일자: 해당 어린이 놀이시설이 최초로 조성된 연월일설치장소코드: 놀이시설이 설치된 장소를 고유하게 식별하기 위한 관리 코드설치장소: 놀이시설이 실제 위치하고 있는 장소의 공식 명칭 (예: 특정 아파트 단지, 어린이공원 등)의무시설여부: 관련 법규에 따라 해당 장소에 의무적으로 설치해야 하는 시설인지의 여부 (의무/임의 등)민간공공구분: 놀이시설의 소유 및 1차적 관리 주체가 민간인지 공공기관인지에 대한 구분시설운영구분: 현재 해당 놀이시설이 정상적으로 운영 중인지, 혹은 보수/폐쇄 상태인지를 나타내는 운영 상태 정보실내외구분: 놀이시설이 건물 내부에 위치하는지, 야외에 위치하는지에 대한 공간적 구분지역분류: 놀이시설이 위치한 금정구 내의 세부 행정/법정동 등 지역 단위 분류 기준'
