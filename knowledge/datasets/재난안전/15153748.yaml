description_portal: '국토안전관리원이 제공하는 특수교 통합계측관리시스템에서 관리대상 교량들의 재난관리 기준 항목을 제공합니다.교량에 따른 교량 코드와 교량명을 제공하고, 교량의 위치, 센서코드를 공개합니다.데이터 종류와 상하한 구분의 레벨 범위에 따른 데이를 제공합니다.특수교 재난관리기준은 국토교통부에서 일반 국도 상의 **특수교량(현수교, 사장교 등)**에 대한 안전을 확보하고 재난 발생 시 신속하게 대응하기 위해 마련된 일련의 기술적 기준 및 절차를 의미합니다.목적: 특수교량의 안전성 및 기능성을 유지·관리하여 재난을 예방하고, 시설물의 효용성을 증진시키며 과학적인 유지관리를 체계화하는 데 목적이 있습니다.적용 대상: 교각 간 최대 거리가 50m 이상인 교량, 현수교, 사장교, 아치교, 트러스교 등 구조적 특수성을 지닌 교량들이 해당됩니다.관리 주체: 주로 국토교통부 도로시설안전과 또는 국토안전관리원 등 재난관리책임기관에서 관리합니다.교량 코드는 교량명의 영문명약자입니다.센서 코드는 교량에 부착된 센서 제품입니다.데이터 종류 열에서 DT_10은 10분 주기, DT_trigger은 이상신호입니다.상하한구분 열에서 RV_MinMax은 재낸관리 기준 레벨 범위 최소 최대값을 나타내는 구분기호 입니다.'
