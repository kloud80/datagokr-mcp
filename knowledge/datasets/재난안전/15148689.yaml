summary_user: 시추조사로 얻은 지반조사 결과 가운데 루전시험(암반 수압시험)의 차수별 수압·주입량·루전값을 프로젝트 단위로 담은 전국 범위 파일(CSV 약 180KB)이다. 댐·터널 기초 설계자나 지반 분석가가 특정 조사 프로젝트 구간 암반의 투수성이 얼마나 되는지, 그라우트 보강이 필요한지를 판단하는 데 쓴다. 전역 조인 키는 없고, 프로젝트코드·프로젝트명으로 같은 국토교통부 지반정보(시추·지층 등) 데이터와 이름·코드 매핑으로만 연결한다.
description_portal: 시추조사를 통해 생산된 지반조사결과 중 수압시험을 통해 파악한 루전시험의 결과를 제공합니다. 루전시험(Lugeon Test)은 암반의 투수성을 평가하는 현장 시험법으로, 시추공에 패커를 설치하여 물을 주입하고 주입량과 주입압력을 측정하여 루전 계수(Lu)를 계산하는 시험입니다. 이 계수를 통해 기초 암반의 틈새 발달 여부, 투수 패턴, 그라우트 주입 효과 등을 파악할 수 있으며, 댐 기초 암반 등의 지반 보강 설계에 중요한 정보를 제공합니다.
