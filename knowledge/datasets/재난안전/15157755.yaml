description_portal: 본 데이터는 2001년도에 발생한 각종 자연재해로 인한 피해액을 정리한 자료이다. 태풍, 호우, 강풍, 대설 등 다양한 재해 유형별로 집계된 금전적 피해 규모를 포함하며, 행정적 대응 및 복구 정책 수립에 활용될 수 있도록 구성되어 있다. 피해액은 공공 집계 기준에 따라 산정된 수치로서 지역별·유형별 비교 분석이 가능하도록 정리되어 있다. 또한 과거 재해 이력 파악과 재난 대응 역량 강화를 위한 기초자료로 활용 가능하다. 데이터는 재해 발생 시기와 유형에 따른 피해 특성을 이해하는 데 도움을 주며, 정책 수립, 연구 분석, 시민 정보 제공 등 다양한 목적에 활용할 수 있다. 본 자료는 공공데이터 이용 활성화 및 투명한 정보 제공을 목적으로 개방된다.
