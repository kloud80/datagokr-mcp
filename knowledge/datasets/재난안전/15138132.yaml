description_portal: 본 자료는 한국승강기안전공단이 관리하는 승강기 형식별 제원항목을 표준 항목으로 정리한 데이터입니다. 각 레코드는 승강기형식, 승강기세부형식, 제원항목, 적용시작일자, 적용종료일자로 구성되며, 형식·세부형식 조합에 따라 해당 제원항목이 어떤 기간에 적용되는지 일관된 구조로 제시합니다. 형식 예시는 권상식·유압식, 세부형식 예시는 직류무기어·교류 등이 확인됩니다. 제원항목은 치수(카치수, 카출입구치수(폭/높이), 카바닥면적), 구조·안전(문개폐방식, 카도어 유무·록, 추락방지안전장치, 완충기, 비상브레이크, 승강로 구획), 전기(정격전압·정격전류, 조명/신호/안전회로 사용전압, 제어방식), 운전·기계(정격속도, 최대정원, 권상기형식, 로핑, 매다는 장치의 가닥수·지름), 부속·설치(카벽 구출구, 피트사다리 설치방법, 출입구 2개 이상, 투명창) 등으로 세분됩니다. 일자 필드는 제원 적용의 유효 구간을 나타내며, 동일 형식 내 제원 정의의 변동 시점을 구분할 수 있도록 구성되어 있습니다.
