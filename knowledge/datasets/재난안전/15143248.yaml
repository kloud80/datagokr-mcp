summary_user: 전국의 지진겸용 임시주거시설을 시설 한 곳씩 담은 목록으로, 시설명·상세주소·도로명주소·이재민 수용가능인원·시설면적 등을 함께 제공한다. 지진으로 집을 잃었을 때 우리 동네에서 어느 시설에 몇 명까지 머물 수 있는지 확인하려는 주민이나, 지역별 임시주거 수용력을 점검하는 지자체·분석가가 쓴다. 실측상 전역 조인 키는 확인되지 않았으므로 법정동·행정동 코드(BDONG_CD 등)나 시설명·주소 매핑으로 다른 대피·구호시설 데이터와 잇고, 표준데이터 15072622와 연결해 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지진겸용 임시주거시설 정보로, 수용시설일련번호, 상세주소, 이재민수용시설명, 이재민수용가능인원, 도로명상세주소 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
