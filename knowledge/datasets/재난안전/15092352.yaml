summary_user: 김해시가 관리하는 급경사지를 한 곳씩 지번주소·위도·경도와 함께 담은 건별 현황 파일(CSV 약 18KB)로, 용도·구조·유형·지구명·공공/민간 구분·위험 등급을 함께 싣는다. 주민이나 지자체·방재 분석가가 '우리 동네(읍면동) 근처에 위험 등급이 높은 급경사지가 어디 있는가'를 확인하거나 집중호우 때 점검 대상을 추릴 때 쓴다. 전역 조인 키는 없으므로 읍면동명·지번주소로 이름 매칭하거나 위도·경도로 지도에 올려 대피시설·재해위험지구 같은 다른 공간 데이터와 겹쳐 본다.
description_portal: 경상남도 김해시 급경사지 현황에 대한 데이터로 시도명, 시군구명, 읍면동, 지번주소, 용도, 구조, 유형, 지구명,  관리기관, 공공 또는 민간 구분, 등급, 위도, 경도, 좌표 상태의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2026년 1월 2일로, 연간 주기로 관리하고 있습니다.* 해당 데이터는 관리기관이 김해시인 자료만 포함되어 있으니 이용에 유의하시기 바랍니다.* 해당 데이터는 분석·연계하여 정책 수립 및 지역 사회 문제 해결 등 다양한 분야에 활용하실 수 있습니다.[데이터 변동 안내]1. 데이터 현행화2. 데이터 설명 수정
