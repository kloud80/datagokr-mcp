summary_user: 대구광역시 북구가 지정한 인명피해 우려지역을 지구별로 한 건씩 담은 목록으로, 지구명·주소·피해 예상 지역(징검다리·도로 등)·지정 유형·재해 유형·피해 유형(급류휩쓸림·침수 등)을 담는다. 여름철 태풍·호우 때 북구 주민이나 방재 담당자가 "우리 동네 하천 징검다리가 급류 위험 지역으로 지정돼 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 주소(ADRES)나 지구명을 기준으로 대피시설·재해위험지구 같은 다른 재난 데이터와 이름·주소 매핑으로만 잇는다.
description_portal: 입력 파라미터를 이용하여 대구광역시_북구청_인명피해우려지역현황 데이터의 번호,지구 명,주소,피해 예상 지역,지정 유형,재해 유형 ,피해 유형,비고를 조회하는 서비스입니다.인명 피해 우려 지역은 자연재해나 사고 발생 시 인명 피해가 발생할 가능성이 높은 지역을 의미합니다.여름철 인명피해 우려지역은 태풍, 호우 대비 인명피해 최소화를 위해  인명피해 우려지역을 지정합니다.대구 북구 내의 대표적인 피해예상지역은 징검다리, 도로가 있으며, 피해유형에는 급류휩쓸림과 침수가 있습니다.
