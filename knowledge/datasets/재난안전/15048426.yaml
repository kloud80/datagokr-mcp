description_portal: 제공된 자료는 2020년 12월 말 기준으로 경찰청에서 집계한 운전면허 소지자의 연령별 현황을 세부적으로 보여줍니다. (1회성으로 제공됨)16세부터 99세까지 1세 단위로 구분하여, 각 연령대별 1종 대형, 1종 보통, 1종 소형, 대형견인, 소형견인, 구난차 면허 소지자 수를 확인할 수 있습니다.좌측에는 남성 운전면허 소지자 수가, 우측에는 여성 운전면허 소지자 수가 각각 제시되어 있어 성별에 따른 면허 취득 현황 비교가 용이합니다.이 통계는 연령별 운전면허 취득 추이를 파악하고, 특정 연령대의 면허 소지 현황을 분석하여 교통 정책 수립이나 안전 교육 대상 선정 등 다양한 분야에서 활용될 수 있습니다.
