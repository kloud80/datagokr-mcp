description_portal: 본 데이터는 경찰청 여성청소년범죄수사과에서 관리하는 통계로, 2023년부터 2025년까지 발생한 성폭력범죄 범좌자의 성별 및 연령대별 분포 현황을 상세히 제공합니다.남성과 여성을 구분하여 20세 이하부터 71세 이상까지 10세 단위의 연령 구간별 범죄자 수를 기록하고 있으며, 이를 통해 특정 연령대나 성별에 따른 성범죄 발생 양상을 심층적으로 분석할 수 있습니다. 최근의 인구 구조 변화와 사회적 흐름이 반영된 단기 시계열 자료로서, 연령별 맞춤형 범죄 예방 교육 정책 수립이나 재범 방지 대책 마련을 위한 핵심 지표로 활용도가 매우 높습니다. 또한, 성별·연령대별 정량적 수치를 바탕으로 한 관련 분야 학술 연구 및 민간 사회 공헌 사업의 치안 데이터 근거 자료로 권장합니다.
