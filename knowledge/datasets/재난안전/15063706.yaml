description_portal: '○ 대구광역시 시전견문정보시스템("살피소"시스템)은 「대구광역시 시정통보제도 운영규정」에 따라 소속공무원으로 하여금 시정의 누수현상을 조기에 발견 통보하여 신속히 대처함으로써 시정의 발전을 도모하고 시민의 복리증진에 기여함을 목적으로 하여 운영되는 시스템입니다.○ 해당 시스템에서 추출되는 데이터는 살피소 시스템을 통해 제보되는 각종 시민불편사항(도로시설, 공원녹지, 현수막, 광고물, 환경청소, 건축건설 도로적치물 등)의  연간 제보 및 처리 현황으로, 대구광역시 소관기관(부서) 및 각 구,군별 제보 접수 건수와 접수된 제보내역 중 처리완료, 미처리(처리중), 반송 건수 등의 구체적인  제보건수에 대한 처리 현황을 제공합니다.※ 대구광역시 관내 살피소 접수 및 처리기관(부서) ○ 대구광역시  - 대구광역시 도시관리본부  - 대구광역시 상수도사업본부○ 대구광역시 소방안전본부 ○ 구군 : 중구, 동구, 서구, 남구, 북구, 수성구, 달서구, 달성군, 군위군'
