summary_user: 부산광역시 동래구 관내 여성안심비상벨을 설치 위치별로 한 행씩 담은 파일로, 관리기관명·구분·설치위치·설치대수·설치연도와 위도·경도 좌표를 포함한다(약 1KB 규모의 작은 CSV). 주민이나 분석가가 "동래구에서 밤길 귀가 경로 주변에 여성안심비상벨이 어디에, 몇 대 설치돼 있나"를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도 좌표로 공간 결합하거나 설치위치 주소·명칭을 맞춰 CCTV·보안등 등 다른 방범시설 현황과 함께 본다.
limits: 동래구 한 곳만 다루므로 부산 전체나 다른 구와 비교하려면 각 구 데이터를 따로 모아야 하고, 공통 코드가 없어 주소·좌표 기준으로 직접 맞춰야 한다. 포털 설명상 항목이 사정에 따라 바뀌거나 삭제될 수 있으므로 받을 때마다 컬럼 구성을 확인해야 한다.
