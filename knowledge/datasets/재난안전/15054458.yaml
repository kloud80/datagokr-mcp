description_portal: 본 데이터는 경찰청에서 집계한 2024년 기준 범죄 유형별 피의자 구속 및 불구속 현황 통계입니다. 범죄 대분류, 중분류, 소분류에 따라 현행범체포, 긴급체포, 사전영장, 체포영장 등 구속 유형과 불구속 입건, 검사불청구, 판사기각 등 불구속 사유를 상세히 제공합니다. 2017년 이후 제공이 중단되었다가, 최근 데이터 개방 정책에 따라 기존 '범죄자'에서 '피의자'로 목록 명칭을 변경하여 다시 연 단위 정기 공표를 시작하였습니다. 수사 과정에서의 신병 처리 현황을 파악하고 형사 정책 연구 및 범죄 예방 전략 수립을 위한 기초 자료로 활용 가치가 높습니다.
