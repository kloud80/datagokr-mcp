description_portal: 경찰청에서 일회성으로 제공하는 피의자 범행 시 전과 및 재범 여부 현황 자료로서, 범죄 사건별 피의자의 전과 횟수와 재범 여부를 상세히 기록하고 있다. 데이터는 범죄대분류, 범죄중분류, 없음, 전과(1~9범이상), 미상 항목으로 구성되며, 사건별로 전과 유무와 재범 여부를 파악할 수 있다. 이를 통해 피의자 재범 패턴을 분석하고, 경찰의 재범 예방 및 대응 전략 수립에 유용하게 활용될 수 있다. 특히 전과 및 재범 분석을 통해 범죄 경향성을 파악하고, 예방대책 및 수사방향 설정에 기여할 수 있으며, 국민 안전 확보 및 경찰력 강화를 위한 기초자료로 중요하다. 본 데이터는 경찰 수사 및 범죄예방 정책 수립, 범죄 재범 방지 대책 마련에 유용하게 활용될 수 있다.
