summary_user: 인천광역시 내 특정소방대상물을 단지·동 단위로 한 건씩 담은 원천 목록으로, 관할 소방서·119안전센터, 등급, 주용도, 도로명·지번 주소, 바닥면적·연면적, 지상·지하 층수, 사용승인일을 담는다. 소방 안전 분석가나 지자체 담당자가 '우리 소방서 관할에 어떤 용도·규모의 특정소방대상물이 몰려 있고 오래된 건물은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 도로명·지번 주소를 주소 매칭해 건축물대장 등과 붙이거나, 소방서·센터 이름으로 화재 발생·소방용수 등 같은 기관의 소방 데이터와 이어 쓴다.
description_portal: '이 데이터는 「화재의 예방 및 안전관리에 관한 법률」에 따라 소방시설을 의무적으로 설치하고 화재 안전 관리를 해야 하는 특정소방대상물의 인천광역시 내 현황을 제공합니다.이터의 목적 및 내용특정소방대상물이란 건축물의 규모, 용도, 수용인원 등을 고려하여 화재 위험이 높거나 인명·재산 피해 우려가 있어 법적으로 소방시설 설치 및 관리가 지정된 건물이나 시설을 말합니다. (예: 공동주택, 판매시설, 공장, 병원, 학교 등)이 데이터는 소방시설의 설치 및 유지관리 상태 파악, 지역별 화재 위험성 분석, 그리고 소방 안전 정책 수립에 핵심적인 역할을 합니다.'
