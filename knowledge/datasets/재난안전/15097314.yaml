summary_user: 2019년 이전 제1종시설물의 점검·진단 결과보고서에서 뽑은 외관조사 데이터를 시설물 단위로 비식별화해 담은 전국 범위 API이며, 시설물명·위치·구조형식·연장·시설물 구분·종별·점검진단 구분 같은 항목을 제공한다. 시설물 안전을 분석하는 연구자나 유지관리 담당자가 '과거 정기점검·정밀안전진단에서 어떤 구조형식의 1종 시설물이 외관조사를 받았는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설물 안전 데이터와는 시설물명·위치 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 전역 조인 키가 없어 시설물 번호로 다른 원장과 정확히 맞물리지 않으며, 이름·위치 매칭에 의존해야 한다. 데이터는 비공간이라 좌표 기반 분석에는 바로 쓰기 어렵다. 개발계정은 하루 10,000회로 호출이 제한된다.
