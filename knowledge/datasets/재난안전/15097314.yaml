description_portal: '2019년 이전의 제1종시설물 대상 점검,진단 결과보고서 외관조사 데이터를 비식별화(공개대상이 아닌 데이터 포함에 따른 비식별화 후 공개)하여 공개하는 데이터입니다.시설물 외관조사는 시설물의 물리적, 기능적 결함 및 잠재적 위험 요인을 육안이나 간단한 점검 기구를 통해 발견하고, 이에 대한 적절한 보수·보강 방안을 제시하여 시설물의 안전을 확보하는 것을 목적으로 합니다. 이는 정기점검, 정밀점검, 정밀안전진단 등 안전관리의 첫 단계로 수행됩니다.주요 목적현재 상태 파악: 시설물의 현재 상태를 정확히 판단하고, 이전에 기록된 상태로부터의 변화를 확인합니다.안전성 평가 데이터 확보: 각종 측정·시험 장비에 의한 정밀조사에 앞서 필요한 기초 데이터를 확보합니다.위험 요소 조기 발견: 시설물에 내재된 균열, 변형, 누수 등의 위험 요인을 조기에 발견하여 대형 사고를 예방합니다.유지관리 계획 수립 지원: 발견된 결함을 바탕으로 신속하고 적절한 보수·보강 방법 및 조치 방안을 제시, 효율적인 유지관리 계획 수립을 돕습니다.'
