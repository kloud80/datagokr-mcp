description_portal: '본 데이터는 2023년부터 2025년까지 전국 18개 시도경찰청 관할 구역에서 발생한 전화금융사기(보이스피싱) 피해 금액 현황을 수록하고 있습니다.통계에 따르면 전국의 모든 지역에서 피해 규모가 매년 가파르게 상승하는 강한 우상향 추세를 보입니다. 특히 서울(1,604→4,028)과 경기남부(846→2,364) 등 수도권 지역의 피해액이 단기간에 약 2.5배 이상 폭증하며 전체 수치를 견인하고 있습니다. 또한 부산, 인천, 대구 등 대도시권을 중심으로 피해가 집중되는 경향이 뚜렷하나, 세종과 제주를 포함한 전 지역에서 예외 없이 수치가 증가하고 있어 범죄의 전국적 확산세를 확인할 수 있습니다.(금액 단위 : 억원)본 자료는 연도별·지역별 범죄 대응 정책 수립 및 민생 치안 강화를 위한 기초 자료로 활용 가치가 높으며, 보이스피싱 범죄의 지능화와 조직화에 따른 사회적 비용 변화를 분석하는 데 유용합니다.'
