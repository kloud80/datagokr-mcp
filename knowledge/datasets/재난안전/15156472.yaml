summary_user: 한국승강기안전공단의 승강기 정기검사 일정 변경 신청을 승강기 한 대·신청 한 건 단위로 담은 건별 원천 파일로, 신청일자, 건물명·주소, 검사종류, 희망일과 공단 확정일을 담고 전국 범위를 개별 주소 수준으로 다룬다. 건물 관리자나 분석가가 '변경 희망일과 실제 확정일이 얼마나 차이 나고, 어느 지역에서 일정 조정이 많은가'를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, 승강기고유번호로 같은 공단의 승강기 원장·검사 결과 자료와 맞춰 보거나 건물주소를 주소 매칭해 지역별로 묶어 쓴다.
description_portal: 이 데이터는 한국승강기안전공단의 승강기 정기검사에 대해 일정 변경을 신청한 내역과 그 처리 결과를 담은 자료입니다. 각 행은 하나의 승강기에 대해 일정 변경 요청이 있었던 기록을 나타내며, 주요 필드는 ‘신청일자’, ‘건물명’, ‘건물주소’, ‘검사종류’, ‘승강기고유번호’, ‘검사 일정 변경 희망일’, ‘검사일정 확정 일자’ 등으로 구성되어 있습니다.‘신청일자’는 일정 변경 요청이 접수된 날짜이며, ‘건물명’과 ‘건물주소’를 통해 해당 승강기가 설치된 위치를 확인할 수 있습니다. ‘검사종류’는 신청된 검사의 유형을 나타내며, 대부분 ‘정기’로 표기됩니다. ‘승강기고유번호’는 개별 승강기를 식별하는 식별자이며, ‘검사 일정 변경 희망일’은 사용자가 희망한 새로운 검사 날짜를 의미합니다. ‘검사일정 확정 일자’는 공단이 최종적으로 확정한 실제 검사 일정을 나타냅니다.이 데이터는 검사 일정 변경 처리 속도 분석, 희망일과 확정일의 차이 분석, 지역별 일정 조정 현황 파악, 검사 예약 시스템 개선 등 승강기 검사 행정의 효율성 향상에 활용될 수 있습니다.
