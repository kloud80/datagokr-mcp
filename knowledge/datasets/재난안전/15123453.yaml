description_portal: 본 자료는 한국승강기안전공단이 관리하는 승강기 사고통계를 연도별로 정리한 데이터입니다. 구성은 ① 총괄현황(보유대수·사고건수), ② 건물용도별 사고현황, ③ 사고원인별 사고현황, ④ 승강기종류별 사고현황, ⑤ 피해자 구분별 사고인원, ⑥ 피해정도별 사고인원으로 구분됩니다. 연도 범위는 2007~2023년이며, 각 표는 연도 행과 분류 항목 열로 구성되어 사고 건수 또는 인원 수를 제공합니다. 건물용도는 공동주택, 근린생활시설, 판매·운수·의료·교육연구복지시설 등으로, 사고원인은 이용자·작업자·관리주체·유지관리업체·제조업체 과실 및 기타로 분류됩니다. 승강기종류에는 승객용, 병원용, 화물용, 주택용, 장애인용, 소형화물용, 에스컬레이터, 무빙워크 등 주요 설비가 포함되며, 피해자 구분은 이용자, 건물 관리자, 승강기 기술자로, 피해정도는 사망·부상으로 집계됩니다. 본 데이터는 연도·시설용도·장비유형·원인·피해 수준을 동일 체계로 제시하여 사고 양상을 정량적으로 파악할 수 있도록 구성되어 있습니다.
