description_portal: 지난 10년간 지역별 피해 양상은 수도권 집중화와 전국적 증감 동조화로 요약됩니다. 서울과 경기남부는 매년 압도적인 발생 건수를 기록하며 전체 피해의 상당 부분을 차지했습니다. 특히 서울은 2019년 10,494건으로 정점을 찍었으며, 이후 감소세를 보이다 2025년 다시 6,000건대를 돌파하며 반등하고 있습니다.지방의 경우 부산, 대구, 인천 등 주요 광역시를 중심으로 피해가 빈번했으나, 2022년 이후 대부분 지역에서 감소 혹은 보합세를 보였습니다. 눈에 띄는 점은 세종의 경우 2019년 본격적인 집계 이후 꾸준히 수치가 증가하고 있다는 점입니다. 2025년 기준으로는 서울, 경기남부, 인천 등 인구 밀집 지역의 피해가 여전히 심각하며, 경남과 대구 또한 최근 다시 증가세로 돌아서며 지역별 맞춤형 예방 대책이 시급함을 시사합니다.
