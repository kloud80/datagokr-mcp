description_portal: 경상북도경찰청은 사회적 보호가 필요한 대상자들이 일정 시간 행방이 확인되지 않는 사례를 기록하여 관련 통계를 제공하고 있다. 대상에는 미성년자, 고령 치매환자, 지적 장애인, 가출 의심 성인 등이 포함되며, 연도별로 접수된 신고 건수와 조치 결과가 정리되어 있다. 통계 항목에는 성별, 연령대, 실종 발생 위치, 발견 시점, 발견까지 소요된 시간 등이 포함되며, 경찰서 단위로 데이터를 구분하여 지역별 현황을 분석할 수 있도록 구성되어 있다. 이 자료는 유사 사례 예측, 조기 대응 체계 구축, 정책 방향 수립, 사회안전망 개선 등 행정 전반에 활용될 수 있다. 공공데이터포털을 통해 누구나 접근 가능하며, CSV 형식으로 제공되어 연구 및 교육 목적에도 적합하다.
