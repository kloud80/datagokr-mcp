summary_user: 국토안전관리원이 관리하는 공동구시설물 수를 종별(행) × 17개 시도(열)로 집계한 전국 통계표로, 2025년 12월 31일 기준 312바이트 크기의 작은 CSV 한 건이다. 정책 담당자나 분석가가 '어느 시도에 어떤 종류의 공동구가 몇 개 있는가'를 확인할 때 쓴다. 전역 조인 키는 없고 열 이름이 시도명이므로, 다른 시도별 통계와는 시도명을 맞춰 붙여 쓴다.
description_portal: '국토안전관리원에서 제공하는 데이터이며 공동구시설물, 시도별, 종별 통계 현황 등의 항목으로 구성된 데이터를 제공합니다. 25년 12월 31일 기준입니다.지역별 공동구시설물 통계현황을 알려드립니다.공동구시설물이란 전기, 통신, 상·하수도, 가스, 난방 등과 같은 다양한 지하매설물을 공동으로 수용하기 위해 지하에 설치하는 인공 구조물을 말합니다. 도시의 미관 개선, 도로 구조의 보전, 반복적인 도로 굴착 방지 및 교통의 원활한 소통을 목적으로 하는 도시 기반 시설입니다.주요 목적도시 미관 개선: 전선이나 각종 배관이 지상에 노출되지 않아 도시 경관이 깔끔해집니다.도로 구조 보전 및 교통 소통 원활: 도로를 반복적으로 굴착할 필요가 없어 도로 파손을 방지하고 교통 혼잡을 줄입니다.시설물 통합 관리 및 안전성 향상: 다양한 생활 필수 시설을 한곳에 모아 효율적으로 관리하고 재난 발생 시 신속하게 대응할 수 있습니다.사회간접비용 절감: 반복적인 공사로 인한 사회적 비용을 줄일 수 있습니다.'
