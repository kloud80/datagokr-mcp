summary_user: 위험성평가 인정을 받은 사업장을 한 건씩 사업장명·공사장명·인정일·관할 노동지청명으로 담은 전국 단위 파일이며, 포털 설명상 2022년 10월부터 2025년 12월까지 인정된 사업장이 대상이다. 사업주나 원청·발주처가 특정 사업장이 위험성평가 인정을 받았는지, 언제 인정받았는지 확인하는 데 쓴다. 전역 조인 키나 사업자번호 같은 식별 코드가 없어 다른 데이터와는 사업장명·노동지청명 같은 이름을 맞춰서만 이어 쓸 수 있다.
description_portal: 한국산업안전보건공단에서 제공하는 위험성평가 인정사업장의 사업장명, 공사장명, 인정일, 관할노동지청 등 인정일 기준 현황을 제공합니다. (2022.10.~ 2025.12. 인정 사업장)- 위험성평가 인정 사업장은 인정 결정된 날부터 3년간 유효함(다만 인정이 취소된 경우에는 인정취소 사유 발생일 전날까지)- 유효기간 만료일 3개월 전부터 재인정 신청을 할 수 있으며, 재인정 사업장의 인정 유효기간은 이전 위험성평가 인정 유효기간의 만료일 다음날입니다.- 공사현장(또는 지점)이 없는 경우 공사장명이 공란
