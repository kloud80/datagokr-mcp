summary_user: 경찰청이 제공하는 실종자 검색 정보를 재난안전데이터 공유플랫폼을 통해 건별로 담으며, 실종 발생일시·발생장소·성명·현재 나이·성별·대상 구분·인상착의 등이 항목으로 들어 있고 범위는 전국입니다. 실종 가족을 찾는 국민이나 실종자 지원 서비스를 만드는 개발자가 '최근 특정 지역에서 실종된 아동·노인이 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 공통 조인 키는 확인되지 않아, 발생장소 이름을 행정구역명으로 맞추는 식으로만 다른 안전관리 데이터와 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털((https://www.data.go.kr)에서 연계하여 제공하고 있습니다.- 해당 데이터는 경찰청에서 제공하는 실종검색에 대한 관련 정보입니다.\""
