summary_user: 한국산업안전보건공단에 등록된 건설업 기초안전보건교육기관을 기관별 한 행으로 담은 전국 목록이며, 담당 공단 일선기관, 교육기관명, 전화·팩스번호, 우편번호, 주소를 포함한다(CSV 약 8KB). 일용근로자를 채용하는 건설업 사업주나 근로자가 "우리 지역에서 건설업 기초안전보건교육을 받을 수 있는 등록 기관은 어디인가"를 찾을 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소의 지역명이나 공단 일선기관명을 기준으로 이름 매칭해 잇는다.
description_portal: '한국산업안전보건공단에서 제공하는 건설업기초안전보건교육기관 등록현황으로 공단담당일선기관, 교육기관명, 주소 등을 확인하실 수 있습니다.*산업안전보건법 제31조(건설업 기초안전보건교육)에 따른 필수교육건설업 기초안전보건교육은 건설일용근로자가 타 현장으로 이동할 때마다 받아야하는 건설현장단위의 채용시 교육을 대체하여 건설업 차원에서 받도록 한 교육- 교육의무주체 : 일용근로자를 채용한 건설업 사업주(기초안전보건교육은 사업주 의무이므로 교육 소요비용은 사업주가 부담하여야함)'
