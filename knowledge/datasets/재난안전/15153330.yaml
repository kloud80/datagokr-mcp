summary_user: 전국 하천 둔치주차장을 시설 한 곳당 한 행으로 담는 속성 데이터로, 시설명·시도·시군구·하천명·시설 형태·주차 가능 대수·위험등급·변경일자를 포함한다. 집중호우 때 우리 지역 어느 하천 둔치주차장이 위험등급이 높고 몇 대가 주차되는지 확인하려는 지자체 담당자나 분석가가 침수 위험 점검과 차량 통제 대상 선정에 쓴다. 실측 기준으로 전역 조인 키는 확인되지 않아 다른 데이터와는 시군구 코드(STDG_SGG_CD)나 시도·시군구 이름, 하천명으로 맞춰 재난 특보·위험지역이나 대피시설 데이터와 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 둔치주차장(속성)에 대한 정보입니다.\""
