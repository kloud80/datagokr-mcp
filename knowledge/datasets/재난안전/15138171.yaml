description_portal: 본 자료는 한국승강기안전공단이 수행하는 승강기 안전검사에 대해 검사수수료가 접수된 내역을 행 단위로 정리한 데이터입니다. 레코드는 한 건의 접수를 의미하며, 필드는 접수일자, 검사수수료, 부가세로 구성됩니다. 접수일자는 수수료 접수 기준일을 나타내고, 검사수수료와 부가세는 원화 정수로 기록됩니다. 부가세 금액은 수수료와 분리된 별도 열에 표기되며, 동일한 날짜에 여러 건이 연속 입력될 수 있습니다. 예시 구간에는 2011년 12월 말 접수 기록이 집중되어 있으며, 90,000원·103,500원 등 반복되는 금액 조합이 존재합니다. 숫자 값에는 천 단위 구분자 없이 숫자만 기재되고, 각 행은 세 필드가 모두 채워진 형태로 제공됩니다. 파일은 날짜—금액 쌍을 중심으로 균일한 스키마를 유지하며, 금액 필드는 비교·정렬이 용이하도록 일관된 형식을 따릅니다.
