summary_user: 경기도 119 구급대의 출동 활동을 출동 건 단위로 담은 것으로 보이며, 출동 소방서·안전센터, 신고·출동·현장도착·귀소 시각, 현장거리, 환자 연령·성별·국적, 증상·사고 종류, 구급대원 자격 등급을 함께 담는다. 분석가가 "우리 시군에서 구급차가 신고 후 현장에 도착하기까지 얼마나 걸리고, 어떤 증상의 환자가 많은가"를 따져 구급 인력·장비 배치를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없고, 시군명·시군 코드(SIGUN_CD)나 출동 소방서·안전센터 이름을 같은 경기도 소방 데이터와 이름·코드로 맞춰 잇는다.
description_portal: 경기도의 구급활동 현황입니다. 출동소방서명, 신고시각, 접수경로, 현장거리, 환자연령, 환자증상 등의 정보를 제공합니다.이 데이터는 경기도 내 119 구급대의 출동활동 현황을 나타내며, 출동소방서 및 안전센터, 출동 연도와 지역, 환자의 연령 및 성별, 외국인 여부, 국적, 구급처치 장소, 환자 증상 등에 대한 정보를 포함하고 있습니다. 이를 통해 각 시군별 응급의료 수요, 출동 빈도, 응급환자의 특성 등을 파악할 수 있으며, 응급의료 체계의 개선과 효율적인 인력·장비 배치를 위한 기초자료로 활용될 수 있습니다. 또한 외국인 환자 발생 비율이나 구급활동의 공간적 분포 분석 등 다양한 정책적·연구적 활용이 가능합니다.
