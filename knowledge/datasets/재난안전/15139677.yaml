summary_user: 재난안전데이터 공유플랫폼이 제공하는 재난 발생 시 홍보시설 목록으로, 시설 한 건마다 지역코드·홍보시설코드·시설명·직업코드·비고·삭제여부·수정일자를 담으며 범위는 전국이고 좌표가 없는 비공간 데이터다. 지자체 재난 담당자나 분석가가 '우리 지역에 재난 홍보에 쓰이는 시설이 어디이고 최근 변경·삭제된 것은 무엇인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 지역코드(RGN_CD)나 시설명을 이름·코드 매핑하거나 같은 기관의 대피·구호시설 등 공유플랫폼 데이터와 같은 코드 체계로만 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 재난 발생 시 홍보시설 정보로, 지역코드, 홍보시설코드, 홍보시설명, 직업코드, 비고, 삭제여부, 수정일자 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
