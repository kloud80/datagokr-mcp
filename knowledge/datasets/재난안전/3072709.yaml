summary_user: 경찰청이 처리한 습득물을 연도별로 유실자 반환, 습득자 취득, 보관, 양여, 폐기, 국고귀속 건수로 나눠 담은 전국 단위 집계 파일(csv, 522 bytes)이다. 분석가나 정책 담당자가 "주운 물건 가운데 주인에게 돌아간 비율이 해마다 늘었는가"처럼 습득물 처리 결과의 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도 기준으로 맞추거나 같은 기관 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 제공된 경찰청 습득물 처리 현황에 따르면, 2015년부터 2024년까지 총 습득물 처리 건수는 꾸준히 증가하는 추세입니다. 유실자 반환 건수는 2015년 368423건에서 2024년 753551건으로 약 2배 이상 증가하며 가장 큰 비중을 차지합니다. 습득자 취득/보관 건수 또한 같은 기간 5169건에서 15670건으로 3배가량 늘어났습니다.특히, 2022년과 2024년에 양여 처리 건수가 각각 959건, 20846건으로 크게 증가한 점이 특징적입니다. 폐기 처리 건수도 2015년 144738건에서 2024년 277751건으로 증가했으나, 반환 건수 증가율이 더 높게 나타났습니다. 이는 습득물이 증가하는 동시에 유실자에게 되돌아가는 비율도 높아지고 있음을 시사합니다.
