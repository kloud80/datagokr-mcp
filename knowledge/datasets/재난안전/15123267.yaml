summary_user: 경상북도 의성군 관내 산사태취약지역으로 지정된 곳을 필지(리·지번) 단위로 한 건씩 담은 파일로, 위치는 도·분·초로 나뉜 위도·경도와 지정사유 및 목적, 국·사유지 구분을 함께 기록한다. 주민이나 토지 소유자가 '우리 마을 이 지번이 산사태취약지역에 들어 있는지, 왜 지정됐는지'를 확인하거나, 분석가가 의성군 내 취약지역 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍·면·리 이름과 지번을 매핑하거나 도분초 좌표를 십진 좌표로 바꿔 공간적으로 겹쳐 연결한다.
description_portal: 경상북도 의성군이 보유하고 있는 산사태취약지역지정현황에 대한 데이터입니다.본 데이터는 주소_도, 시_군, 면_읍, 리, 지번, 위도, 위분, 위초, 경도, 경분, 경초, 지정사유 및 목적, 국 사유지 구분 등의 항목을 포함하여 이를 통해 산사태취약지역에 대한 세부 정보를 확인할 수 있습니다. 또한, 의성군 관내 산사태 취약지정현황을 공개하여 공공의 알권리를 보장하고 산사태로부터 국민의 생명과 재산 및 산림자원을 보호하며 공공의 이해와 활용을 돕는 데 목적이 있습니다. 이는 정책 수립, 민원 응대, 지역 분석 등 다양한 분야에서 활용 가능합니다.
