description_portal: 기반시설관리법'은 1970년대 건설된 도로, 철도, 항만, 상수도 등 주요 기반시설의 노후화 문제에 대응하여, 이 시설들을 체계적으로 유지관리하고 성능을 개선하여 국민의 안전하고 편리한 생활을 보장하기 위해 제정된 법률(지속가능한 기반시설 관리 기본법)로, 개별법에 산재된 관리체계를 통합하고, 표준화된 관리 계획 수립 및 이행을 의무화하는 공통의 관리 기준을 제공합니다. 국토안전관리원에서 관리하는 기반시설관리법 상 철도 시설에 대하여 소재지 별 점검진단 연간 집계 금액에 대한 파일데이터임을 알려드립니다.다만 집계 금액은 소재지 기준으로, 관리주체는 중앙행정기관 및 지자체 등 다양함을 유의하여 주시길 바랍니다.
