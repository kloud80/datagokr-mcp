summary_user: 2024년 한국전기안전공사가 사업소별로 진행한 태양광 발전설비 사용전검사 결과를 합격·불합격 구분별 건수로 집계한 전국 범위 파일(csv)이다. 분석가나 태양광 사업자가 '어느 사업소 관할에서 태양광 설비 사용전검사 불합격 비중이 높은가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업소 이름 매핑이나 같은 기관(한국전기안전공사) 자료끼리만 연결한다.
