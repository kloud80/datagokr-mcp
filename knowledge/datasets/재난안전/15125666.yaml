description_portal: 국토안전관리원 하자심사분쟁조정위원회에서 제공하는 공동주택을 대상으로 하자심사와 분쟁조정에 대한 신청 및 처리 현황 데이터입니다.데이터는 2018년부터 2025년까지 1년 단위의 정보이며, 2025년은 데이터 생성시점에 따라 1년 전체가 아닌 1월부터 10월까지의 10개월 동안의 내용입니다.추후 데이터 제공 시, 2025년 전체 건수에 대한 정보를 제공할 예정입니다.신청건수는 2021년 7686건으로 최고치를 기록하였고, 2021년을 제외하면 매년 평균적으로 3855건 정도 분쟁조정에 대한 신청이 발생합니다.처리건수는 매년 비슷한 수치를 보이며, 평균적으로 1년동안 4407건 정도를 처리하였습니다.csv파일을 통해서는 판정이 어떻게 되었는지 구분을 확인할 수 있습니다.
