description_portal: 출동관제내역 데이터는 긴급구조시스템에서 추출된 자료로, 긴급 상황 발생 시 관제센터에서 발행한 출동 명령 및 그 이행 과정을 포함합니다. 각 출동 건의 지령 시간, 목적지, 출동대 정보, 응답 시간 등 다양한 관제 항목이 포함되어 있으며, 응급 대응 체계의 신속성과 효율성을 진단하는 데 활용됩니다. 일부 데이터만 수록된 상태이므로 전수 확인은 별도 자료 요청이 필요합니다.* 본 자료는 긴급구조표준시스템에서 추출한 자료로 일부 정보만 포함되어 있음* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
