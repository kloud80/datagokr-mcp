description_portal: 본 데이터는 여수광양항만공사에서 게시한 안전보건경영 관련 공지사항을 정리한 자료로, 각 게시글의 순번, 제목, 내용, 조회수, 게시일, 수정일을 포함하고 있습니다. 공지사항은 항만 작업장의 안전사고 예방, 온열질환 예방 수칙, 항만안전특별법 시행 안내, 건강관리실 운영 등 안전·보건 관련 정보를 종사자에게 전달하기 위한 목적으로 작성되어 있습니다.상세한 안전지침과 안내사항을 포함하고 있어 공사의 안전관리 체계와 안전 커뮤니케이션 활동을 분석하기 위한 기초자료로 활용할 수 있습니다. 게시일·조회수 정보는 공지 확산도와 관심도 파악에도 도움이 됩니다.
