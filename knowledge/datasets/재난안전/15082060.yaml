summary_user: 부산광역시 관내 방범용 CCTV를 한 대씩 담은 건별 파일로, 구·군, 장비종류, 관리번호, 설치장소 명칭, 위도·경도를 행으로 기록한다. 주민이 우리 동네 골목이나 학교 앞에 방범 CCTV가 있는지 확인하거나, 분석가가 구·군별 CCTV 설치 밀도와 사각지대를 지도 위에서 따져 볼 때 쓴다. 전역 조인 키는 없어 구·군 이름 매칭이나 위도·경도 좌표를 기준으로 안전비상벨·보안등·범죄 통계 같은 다른 공간 데이터와 겹쳐 쓴다.
description_portal: '자료 개요본 자료는 부산광역시 관내 방범용 CCTV의 설치 위치 및 세부 속성을 공간정보 기반으로 정리한 자료입니다.CCTV 통합관제시스템에 등록된 원자료를 바탕으로 표준화된 형식으로 정리하였으며, 관제 운영, 유지관리, 시설 개선, 정책 수립 등을 위한 기초자료로 활용됩니다.주요 포함 정보1. 좌표 정보(위도, 경도) - 각 CCTV의 정확한 지리적 위치를 나타내는 위도(latitude)와 경도(longitude) 정보 - GIS 기반의 지도서비스 또는 관제시스템 상 투망감시 구현에 활용 가능2. 행정구역 정보(구·군) - 각 CCTV가 설치된 행정단위 정보 - 구·군 단위의 설치 현황 분석 및 통계, 민원 대응 등에 활용3. CCTV 관리번호 - CCTV 개별 장비의 고유 식별번호 - 설치기관, 설치목적 등을 기준으로 체계적으로 부여되어 장비 식별 및 관리에 활용 - 관제 운영, 장애유지보수 이력 관리 등 행정 기술적 관리의 기준 정보로 활용4. 설치장소 명칭 - CCTV가 설치된 위치를 식별할 수 있는 대표 장소명(예: ○○초등학교 앞, △△사거리 등) - 관제센터 및 현장 작업자 간의 위치 공유에 활용'
