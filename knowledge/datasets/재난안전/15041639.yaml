description_portal: '- 전라남도 소방본부홈페이지 소방안전교육 교육참가 신청 현황(단체명. 교육일시, 시간)에 관한 데이터를 조회하실 수 있습니다.- 전라남도는 도민의 안전을 위해 다양한 소방안전교육 프로그램을 운영하고 있습니다. 이러한 교육은 화재 예방, 응급처치, 소방시설 사용법 등 다양한 분야를 포함하며, 도민들의 안전 의식을 높이고 실제 상황에서의 대응 능력을 향상시키는 데 중점을 두고 있습니다.- 교육 일정과 장소는 매년 변경될 수 있으므로, 최신 정보를 확인하시기 위해 전라남도 소방안전유용 공식 웹사이트를 주기적으로 방문하시기 바랍니다.- 전라남도의 소방안전교육은 도민들의 안전한 생활을 위한 중요한 프로그램입니다. 많은 분들의 참여를 통해 안전한 전라남도를 만들어 가시기 바랍니다.'
