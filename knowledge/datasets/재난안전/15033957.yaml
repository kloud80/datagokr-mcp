summary_user: 전라남도 해남군에 설치된 가로등을 한 개씩 기록한 건별 원천 데이터로, 위치명·도로명/지번 주소·위도·경도·설치연도·설치형태·관리기관을 담는다(포털 설명 기준 2024년 11월 3,565개). 주민이나 안전 분석가가 '우리 동네 어두운 골목 주변에 가로등이 어디에 얼마나 있고 언제 설치됐나'를 확인하거나 읍면별 조명 공백을 따질 때 쓴다. 전역 조인 키는 없어서 주소나 좌표로 CCTV·보안등·안전비상벨 같은 다른 방범 인프라 데이터와 공간적으로 겹쳐 보거나, 같은 기관(해남군) 데이터끼리 이름으로 맞춰 쓴다.
description_portal: 전라남도 해남군 가로등에 대한 데이터입니다.이 데이터에는 표찰번호, 설치위치, 위도, 경도, 설치년도, 설치형태, 관리기관 등의 항목을 제공합니다.2024년 11월 기준 가로등은 총 3,565개 가로등이 설치되어 있습니다.해남읍 1,185개, 산이면 424개, 송지면 419개, 화원면 313개, 현산면 248개 등의 순으로 설치되어 있습니다.가로등 또는 보안등에 부착된 QR코드를 통해 수시로 고장신고를 받아 유지 관리하고 있으며 매년 LED램프로 교체하는 사업을 진행하고 있습니다.
