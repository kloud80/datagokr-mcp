summary_user: 충청남도 구급활동 실적을 구분 항목별로 집계한 파일로, 출동건수·이송건수·이송인원과 함께 이송인원을 질병·사고부상·교통사고·임산부 유형으로 나눈 값을 담는다(csv 746바이트의 작은 집계표). 도내 구급 수요가 어느 정도이고 이송 환자 중 질병과 사고 비중이 어떻게 나뉘는지 보려는 분석가나 소방·응급의료 정책 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 소방·응급의료 자료와는 구분 값(지역명이나 연도 등)을 이름으로 맞추어 이어 써야 한다.
description_portal: 충청남도 소방활동(구급활동) 현황 데이터는 도내 구급 출동 및 응급환자 이송 실적을 체계적으로 제공하는 공공안전 기반 자료이다. 주요 항목으로는 구급 출동 건수, 환자 이송 인원, 질병·외상·교통사고 등 환자 유형별 통계, 현장 응급처치 내용, 출동·이송 시간, 시군별 세부 현황 등이 포함된다. 또한 중증도 분류, 연령대·성별별 환자 특성, 이송 병원 정보 등 구급 서비스의 전 과정 데이터를 제공해 지역별 응급의료 수요를 정확히 파악할 수 있다. 이 자료는 신속한 구급대 배치, 응급의료체계 개선, 재난 대응 정책 마련 등에 활용될 수 있는 기초정보로 제공된다.
