summary_user: 인천광역시 미추홀구 내 민방위 비상대피시설을 시설 한 곳당 한 행으로 담은 건별 원장으로, 관할동·시설용도·시설명·도로명 주소·확보면적·대피 가능인원·구축/지정연도·위도·경도를 포함한다. 주민이 '우리 동네에서 가장 가까운 민방위 대피시설은 어디인가'를 찾거나, 분석가가 동별 대피 수용 능력과 대피소 접근성을 따지는 데 쓴다. 전역 조인 키(행정코드 등)는 없어 관할동 이름이나 도로명 주소로 다른 데이터와 맞추고, 위도·경도로 인구·건물 등 공간 데이터와 겹쳐 쓴다.
limits: 표준 코드 형태의 조인 키가 없어 다른 데이터와는 동 이름·주소 매칭이나 좌표 기반으로만 연결된다. 범위는 미추홀구 한 곳이라 인천 전체나 다른 시군구 대피시설은 별도 데이터가 필요하다.
