description_portal: 이 자료는 전라남도 강진군에 위치한 총 33개의 임시주거시설 정보를 정리한 데이터로, 학교 체육관·다목적강당을 비롯해 복지회관, 관공서 등 다양한 공공시설이 포함되어 있다. 각 시설은 주소, 면적, 수용 가능 인원 등이 상세히 제시되어 재난 발생 시 주민들이 신속하게 이용할 수 있도록 구성된 것이 특징이다. 또한 강진읍뿐 아니라 군동면, 칠량면, 도암면, 마량면 등 군 전역에 고르게 분포해 지역별 대피 접근성을 높이고, 대규모부터 소규모까지 다양한 수용 규모의 시설을 확보함으로써 효율적인 재난 대응 계획 수립에 활용될 수 있다.
