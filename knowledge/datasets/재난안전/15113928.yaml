summary_user: 전라남도 강진군의 재난 시 임시주거시설을 시설별로 한 행씩 담은 원천 목록으로, 포털 설명상 학교 체육관·복지회관·관공서 등 33곳의 시설명·주소·면적·수용 인원을 담는다. 강진군 주민이나 재난 대응 담당자가 "우리 면에서 가장 가까운 대피시설은 어디이고 몇 명까지 들어갈 수 있나"를 확인하거나 읍·면별 수용 능력을 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대피소·재난위험 데이터와는 주소나 시설명을 맞춰 붙이거나 같은 기관 데이터끼리만 연결한다.
limits: 표준 코드나 시설 ID 같은 공통 키가 없어 다른 데이터와 자동으로 결합하기 어렵고, 주소·시설명 문자열 매칭이 필요하다. 범위는 강진군 한 곳뿐이라 다른 시군과 비교하려면 별도 파일을 모아야 하며, 이 데이터셋은 보조 등급으로 분류되어 있다.
