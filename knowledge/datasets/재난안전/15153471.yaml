summary_user: 전국 자전거 사고다발지역마다 그 지역의 반경 정보와 사고 현황을 지역 한 곳당 한 행으로 담은 집계 데이터이며, 필드명으로 보아 발생 건수와 사망·중상·경상·부상신고자 수, 좌표와 도형(GEOM)이 들어 있는 것으로 보인다. 자전거 이용자나 지자체 교통안전 담당자가 '우리 동네 어느 구간에서 자전거 사고가 몰려 나는가'를 확인하고 안전시설 설치 우선순위를 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시도·시군구명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 전국 자전거 사고다발지역 반경 정보입니다.\""
