summary_user: 대전광역시 동구에 있는 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 원장 파일로, 시설명·주소·규모(톤)·수질검사결과가 들어 있다. 주민이나 재난 담당자가 '상수도가 끊기면 우리 동네에서 가장 가까운 비상급수시설은 어디이고 수질은 적합한가'를 확인하는 데 쓴다. 전역 조인 키나 코드 컬럼은 없어서, 다른 대피·구호시설 데이터나 타 시군구 비상급수시설 현황과는 시설명이나 주소 문자열을 맞춰서 이어 쓴다.
description_portal: '대전광역시 동구 민방위 비상급수시설 현황(전쟁 및 상수도 체계 마비 등과 같은 비상사태 발생으로 상수도 공급중단시 최소의 음용 및 생활용수를 주민에게 공급하기 위한 시설) 자료입니다.세부 항목으로는 시설명, 시설주소, 규모(톤), 수질검사결과를 제공하고 있습니다.이 데이터는 재난 대응 계획 수립, 시설 관리, 예산 배정 등 다양한 행정 업무에 활용될 수 있습니다.해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2026. 7. 31.'
