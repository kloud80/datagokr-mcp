description_portal: '본 통계는 전국 주요 경찰관서를 대상으로 종합만족도, 민원분야, 112신고처리 세 항목을 조사한 결과입니다.전반적 상향 평준화: 조사 대상 관서 대부분이 종합만족도 90점대 이상의 높은 점수를 기록하며 전반적으로 우수한 치안 서비스를 제공하고 있습니다.분야별 특징: 민원분야는 대다수 95~98점 사이의 매우 높은 만족도를 보인 반면, 112신고처리는 80점대 후반에서 90점대 초반에 분포하여 상대적으로 민원 서비스에 비해 점수가 낮게 형성되었습니다.상위 관서: 시도경찰청 중에서는 **전남경찰청(95.4)**과 **세종경찰청(94.9)**이 종합 점수에서 강세를 보였고, 기초 관서 중에서는 부산동부경찰서(95.2) 등이 최상위권의 만족도를 기록했습니다.전반적으로 시민들은 경찰의 행정적 민원 서비스에 가장 크게 만족하고 있으며, 긴급 상황 대응인 112 처리에는 보다 엄격한 잣대를 적용하는 경향이 확인됩니다.'
