summary_user: 충청북도 안에서 영업하는 소방시설 방염처리업체를 업체 한 곳당 한 행으로 담은 목록 파일(csv, 약 5KB)로, 업체명·주소·전화번호·업종을 담는다. 의원·숙박시설·다중이용업소처럼 방염성능기준 이상의 실내장식물을 설치해야 하는 시설의 관리자나 사업자가 "우리 지역에서 실내장식물 방염처리를 맡길 업체가 어디인가"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 소방·시설 데이터와는 주소나 업체명 문자열을 맞춰서만 이어 쓸 수 있다.
description_portal: 충청북도 내 소방시설에 대한 방염처리 업체에 대한 정보를 제공합니다. 상호, 주소, 업종, 분야, 전화번호 등의 정보로 구분되어 있습니다.소방시설설치 및 관리에 관한 법률 시행령 제30조(방염성능기준 이상의 실내장식물 등을 설치해야하는 특정소방대상물)에 따라 해당되는 대상은 실내장식물 방염처리를 위해 해당 정보를 사용하여 업체를 확인하실 수 있습니다.근린생황시설 중 의원, 조산원, 산후조리원, 체력단련장, 공연장, 종교집회장옥내의 문화집회시설, 종교시설, 운동시설의료시설, 교육연구시설 중 합숙소, 노유자시설, 수련시설, 숙박시설, 방송국 및 촬영소, 다중이용업소, 11층이상(아파트 제외)
