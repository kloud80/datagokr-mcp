description_portal: 본 데이터는 한국가스공사 평택기지본부의 정비고 보유 현황 정보를 제공합니다. LNG 시설의 긴급 정비작업 수행 역량 확보 및 재난 대응 체계 구축을 목적으로 수집되었습니다. 데이터의 세부 항목으로는 구분, 용도, 단면적, 단면적 계산식, 피트제원, 피트제원 계산식, 수용장비, 작업가능 범위 등이 포함되어 있습니다. 해당 정비고에서는 긴급작업이 가능하여 인근 재난 발생 시 유관기관과 협조하여 조기 정상화에 기여할 수 있습니다. 본 데이터는 재난안전 관리기관, 유사시설 운영기관, 정비계획 담당자, 안전연구기관, 소방서, 지자체가 재난·안전 예방 및 리스크 관리에 활용할 수 있습니다.
