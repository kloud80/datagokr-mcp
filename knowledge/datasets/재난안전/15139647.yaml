summary_user: 전국 고립예상지역을 고립예상관리번호 단위로 한 건씩 담고, 상세주소, 고립위험사유, 고립예상 세대수·인원수, 무전기·휴대전화 등 통신수단 수, 헬기구조·고지대대피 가능 여부 같은 대책 정보를 제공한다. 지자체 재난담당자나 분석가가 "고립 예상 인원이 많은데 헬기 구조나 고지대 대피가 어려운 지역은 어디인가"를 확인하는 데 쓴다. 실측에서는 전역 조인 키를 찾지 못했으므로, 대피·구호시설이나 재난위험지역 데이터와는 주소·지역 코드 성격의 필드(STDG_CD 등)를 이름·코드 매핑해 연결해야 한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 고립 예상 지역 대책 정보로, 고립예상관리번호, 상세주소, 고립위험사유, 고립예상세대수, 고립예상인원수, 무전기수, 휴대전화기수, 헬기구조가능여부, 고지대대피가능여부 등을 제공하고 있습니다. 데이터의 갱신주기는 1분입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
