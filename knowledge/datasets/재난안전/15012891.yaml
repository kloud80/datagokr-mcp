summary_user: 지방자치단체가 지정한 어린이보호구역을 시설 단위로 한 건씩 담은 원천 데이터이며, 14,642건에 시설종류·대상시설명·주소·좌표·관리기관·관할경찰서·CCTV 설치 현황·도로폭이 들어 있다. 학부모나 지자체 안전 담당자, 분석가가 우리 동네 학교·어린이집 주변 보호구역의 CCTV 설치 여부와 관할 경찰서가 어디인지 확인하는 질문에 쓴다. 도로명주소·지번주소와 위도·경도가 조인 키여서, 같은 주소·좌표 체계를 쓰는 교통사고다발지역 표준데이터 등과 위치로 이어 쓴다.
