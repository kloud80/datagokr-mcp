description_portal: '‘한국승강기안전공단_승강기 안전교육 안내 정보’는 승강기 유지관리·안전관리 종사자의 교육 유효기간 만료에 따라 교육 재이수 안내가 필요한 대상을 식별·통지하기 위한 행정자료입니다. 안내연도, 과정코드(예: 100000, 100001, 100026 등), 안내일자, 수강생명(성명 일부 마스킹)을 포함하며, 과정별·기간별 만료자 현황 파악, 안내 발송 로그 관리, 재교육 대상 추출 및 교육 일정 수립에 활용됩니다. 동일인이 여러 과정코드에 중복 표기될 수 있으므로, 과정코드+수강생 식별 조합으로 중복 정제 후 사용을 권장합니다. 또한 안내연도와 실제 안내일자 간 시차가 존재할 수 있어 통계 산출 시 기준일(안내일자)을 명확히 설정해야 합니다. 개인정보는 최소화된 상태로 제공됩니다.'
