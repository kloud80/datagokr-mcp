summary_user: (주)한국가스기술공사의 천연가스 매설 주배관 근처 굴착민원 처리 건수를 처리부서(지사)별로 2019년부터 2024년 상반기까지 연도 열로 나눠 집계한 소형 파일(csv, 497바이트)이다. 가스안전 담당자나 분석가가 "어느 지사 관할에서 굴착민원이 늘고 있는가"처럼 지역별 민원 빈도와 연도별 증감을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지사·지역 이름을 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 지사·연도 단위 집계이므로 개별 굴착 위치나 민원 건별 내용, 시설물 단위 원장 정보는 담지 않는다. 비공간 자료이며 표준 행정코드 같은 조인 키가 없어 지역 데이터와 붙일 때는 지사명을 수작업으로 매핑해야 한다.
