summary_user: 울산광역시에서 여름철 119가 벌집제거로 출동한 건을 한 건씩(보고번호 단위) 담은 원천 자료로, 출동 소방서·센터, 신고·출동 일시, 발생 장소(시·구·동·리·지번)와 위도·경도, 벌 종류를 기록한다. 소방·지자체 담당자나 분석가가 '울산의 어느 동네에서 어느 시기에 말벌 등 벌집 출동이 몰리는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 행정구역 이름(구·동)이나 위경도 좌표로 다른 생활안전 출동 통계, 119안전센터 위치 자료와 맞춰 쓴다.
description_portal: 해당 데이터는 울산 지역에서 여름철(주로 6~10월) 동안 119구조대가 출동 실적 중  생활안전 출동 통계 중에서, 계절·유형을 “벌집제거”에 한정해 따로 뽑아 정리한 형태의 자료입니다.구성 항목으로는 출동소방서, 출동소방서, 출동안전신고센터 등 출동 구조대 항목과 신고 접수 시간, 출동 시간, 발생지역, 벌의 종류로 구성되어 있습니다. 이를 통해서 울산광역시 안에 지역별로 벌집이 많이 위치해 있는지 기간별로 언제 가장 많이 나타나는지를 확인 할 수 있습니다. 또한 다른 데이터와 비교해 울산지역이 생활안전 출동 건 수중 벌에 대한 출동 비율을 확인 할 수 있습니다.
