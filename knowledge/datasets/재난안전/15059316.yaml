summary_user: 경기도 내에서 발생한 대형 화재를 사건 한 건씩 담은 원천 데이터로, 집계년도·시군과 함께 발생일자·시각·장소, 화재원인, 인명피해 재난규모, 재산피해액을 기록한다. 소방·안전 분석가나 지자체 담당자가 "우리 시군에서 대형 화재는 주로 어떤 원인과 시간대에 일어나고 피해 규모는 어느 정도인가"를 살필 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 시군명이나 시군코드(SIGUN_CD)를 같은 경기도 기관 데이터와 이름·코드로 맞춰 이어 쓴다.
description_portal: 「대형 화재발생 현황」 데이터는 경기도 내에서 발생한 대형 화재 사건의 정보를 제공하는 자료입니다. 주요 항목은 발생일자(OCCUR_DE), 발생시각(OCCUR_TM), 발생장소(OCCURPLC), 화재원인(FIRE_CAUSE), 인명피해재난규모(HUMNLF_DAMAGE_CALMTY_SCALE), 재산피해액(PRPRTY_DAMAGE_AMT), 시군명(SIGUN_NM), 집계년도(SUM_YY) 등입니다. 이 데이터는 특정 시군 단위로 화재 발생 현황을 확인할 수 있으며, 화재 발생 원인과 피해 규모를 분석하여 지역별 위험 요인을 파악하는 데 유용합니다. 또한 인명 및 재산 피해 항목을 포함하고 있어 화재 예방 정책 수립, 안전관리 계획 수립, 도시계획 및 소방인프라 강화 연구 등에 활용될 수 있습니다. 시간대별, 장소별 발생 특성을 분석하면 화재 취약 지역이나 시기를 도출하는 데에도 도움이 됩니다.
