summary_user: 강진군 관내에 설치·운영 중인 CCTV를 한 대(설치 지점)씩 담은 건별 원천 파일로, 설치주소·도로명주소와 관리기관, 설치 목적(방범·어린이보호·도시공원·시설물관리·재난재해), 카메라 대수와 화소수, 촬영 방면, 영상 보관일수, 설치 연월을 담는다. 군민이나 분석가가 '우리 동네 어린이보호구역이나 공원에 방범 CCTV가 있고, 영상은 며칠 보관되는가'를 확인하거나, 지자체가 방범 인프라가 부족한 지역을 찾는 데 쓴다. 전역 조인 키는 없어서 주소(소재지도로명주소)를 기준으로 안전비상벨·보안등 같은 다른 방범시설 현황이나 재난 위험지역·대피시설 데이터와 이름·주소 매핑으로 이어 쓴다.
description_portal: 본 데이터는 전라남도 강진군 관내 전 지역에 설치되어 운영 중인 CCTV 현황을 체계적으로 정리한 공공데이터이다. 각 CCTV에 대해 설치 주소와 관리기관, 설치 목적(방범, 어린이보호, 도시공원, 시설물관리, 재난재해), 카메라 대수와 화소수, 촬영 방면 정보, 영상 보관일수, 설치 연월, 데이터 기준일 등 세부 항목을 포함하고 있다. 본 자료는 범죄 예방과 군민 안전 확보, 어린이 보호구역 및 공원 안전 관리, 공공시설 유지관리, 재난·재해 감시와 신속 대응 체계 구축 등 다양한 행정 업무와 정책 수립을 위한 기초 자료로 활용된다.
