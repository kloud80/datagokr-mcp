summary_user: 서울 강북구에 설치된 가로등 분전함을 한 건씩 담은 파일로, 도로명·분전함 관리번호·위치·데이터기준일로 구성된다. 구청 시설 담당자나 분석가가 "우리 동네 이 도로의 가로등 분전함은 어디에 있고 관리번호는 무엇인가"를 확인하거나 야간 조명·방범 인프라 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명·위치 같은 이름 매핑이나 같은 기관 자료끼리로만 이어 쓴다.
description_portal: 분전함(voltage distribution box)은 전기 분배를 조절하는 장치를 담는 데 쓰이는 상자이다. 야외에서는 대개 가로등 근처에서 볼 수 있으며 보통 어느 정도 내구도가 보장되면서도 저렴한 철로 제작한다. 내부에는 전기 분배를 조절하기 위한 차단기들과, 야간에도 차단기를 볼 수 있도록 해주는 작은 전구가 장착되어 있다.강북구 가로등 분전함 자료는 지역 내 전력 공급 및 유지보수 업무의 효율성을 높일수 있습니다. 위치가 표기되어 있지만 가로등의 운영 특성 상 정확한 가로등 분전함의 위치는 제공이 되지 않을 수 있습니다.서울특별시 강북구 가로등 분전함 데이터는 순번, 도로명, 분전함 관리번호, 위치, 데이터기준일로 구성되어 있습니다.
