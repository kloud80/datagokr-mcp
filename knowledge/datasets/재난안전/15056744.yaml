summary_user: 경기도 시군별 소방서 단위로 119구급대의 구급차 수(대)와 구급대원 수(명)를 집계년도별로 담은 집계 자료다. 소방행정 담당자나 분석가가 "우리 시군 소방서의 구급차·구급대원이 다른 시군에 비해 부족한가, 해마다 어떻게 바뀌었나"를 비교하는 데 쓴다. 전역 조인 키는 실측되지 않았으며, 시군명·시군코드(SIGUN_CD)나 소방서명으로 같은 경기도 소방 데이터(119안전센터, 화재 발생 등)나 시군 단위 인구·출동 통계와 이름·코드 매핑으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군에 소속된 소방서를 중심으로 119구급대의 구급차 수와 구급대원 수를 집계한 자료입니다. 주요 항목은 집계년도, 시군명, 구분명(119구급대), 기관명(소방서명), 구급차수(대), 구급대원수(명)으로 구성되어 있으며, 지역별 응급의료 대응 역량 및 자원 분포를 파악하는 데 활용됩니다. 본 데이터는 지역 간 구급차 보유 현황, 구급대원 인력 배치, 응급환자 대응 체계 분석, 재난 대응력 평가, 소방행정 자원계획 수립 등에 유용하게 사용될 수 있으며, 특정 시기의 자원 변화 추이 분석에도 적합합니다.
