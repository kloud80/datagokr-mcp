description_portal: 한국서부발전은 안전하고 안정적인 전력 공급을 위해 꾸준히 재난대응 훈련을 실시하고 있습니다. 훈련은 실제 발생 가능한 재난 상황을 가정하여 신속한 의사결정 및 효과적인 대응 체계를 점검하는 데 집중합니다. 훈련 종류는 불시 메시지 기반의 상황별 훈련부터 정기적인 종합 훈련까지 다양하게 구성되어 있습니다. 각 훈련 데이터는 준비결과 분석을 통해 개선점을 도출하는 데 이용될 수 있습니다. 훈련 데이터는 훈련 일시, 유형, 명칭, 시간, 그리고 불시 메시지 내용을 포함하며, 이러한 정보는 재난대응 역량 강화에 기초 자료로 활용될 수 있습니다.제공항목은 훈련일시,훈련유형,훈련명,훈련시간,불시메시지 데이터를 제공합니다.
