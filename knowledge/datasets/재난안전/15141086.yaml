description_portal: 제주도는 관광지, 도시, 농·어촌이 혼재된 지역으로 차량 운행량이 많고, 도로 특성상 과속으로 인한 교통사고 발생 위험이 높습니다. 이를 예방하기 위해 제주경찰청은 주요 도로에 이동식 단속부스를 설치하여 과속 및 신호위반 등 교통법규 위반 행위를 단속하고 있습니다. 본 데이터는 서귀포시 등 제주도 내 주요 도로에 설치된 이동식 단속부스의 위치(주소), 경·위도 좌표, 제한속도 등의 정보를 포함하고 있으며, 도로 안전관리와 교통사고 예방을 위한 기초자료로 활용됩니다. 위치 기반 교통안전시설 데이터로서 내비게이션 업체, 스마트시티 기반 교통관리 시스템 등에도 응용될 수 있으며, 자료는 1회성 자료입니다.
