description_portal: '해양사고 데이터 중 부유물감김 사고데이터와 항행장애물 수거 위치 데이터를 활용하여 밀도 기반의 군집 알고리즘인 DBSCAN을 통해 계절별 0.2해리 내 부유물감김 사고가 3회 이상 발생한 사고 위치의 군집 데이터입니다.* 용어 정리- 부유물감김: 추진기에 해상부유물이 감기어 항해를 계속할 수 없게 된 것- 항행장애물: 선박에서 떨어졌거나 침몰, 좌초된 선박에서 유실된 물건 따위와 같이, 선박이 항행하는데 장애가 되는 물건- DBSCAN(Density-Based Spatial Clustering of Applications with Noise): 밀도 기반 클러스터링 알고리즘 기법 중 하나로 데이터 포인트의 밀도를 기준으로 클러스터를 형성하고 노이즈를 식별'
