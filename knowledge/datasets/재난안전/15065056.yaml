summary_user: 전국 119안전센터를 센터 한 곳당 한 행으로 담은 명부 파일로, 소속 시도본부·소방서명·센터명·도로명 주소·대표 전화·팩스번호를 담는다. 지자체·연구기관이 '우리 동네에서 가장 가까운 119안전센터는 어디이고 연락처는 무엇인가', '시군구별로 안전센터가 고르게 배치되어 있는가'를 따질 때 쓴다. 전역 조인 키나 코드표가 없어 시도본부·소방서 이름이나 주소 문자열로 맞춰 화재 발생·소방용수 위치 등 다른 소방 데이터와 연결해야 한다.
description_portal: '해당데이터는 전국에 설치된 119안전센터의 소속 시도본부, 소속 소방서명, 안전센터 주소, 대표 전화번호, 팩스번호 등을 제공하는 데이터이며, 항목은 아래와 같습니다.- 시도본부명: 센터가 소속된 광역 시·도 소방본부 (예: 서울특별시)- 소방서명: 센터가 소속된 지역 소방서명 (예: 강남소방서)- 119안전센터명: 개별 센터의 명칭 (예: 개포119안전센터)- 주소: 도로명 주소 기준의 위치 정보 (예: 서울특별시 강남구 논현로 10길 19)- 전화번호:  연락 가능한 대표 번호- 팩스번호:  연락 가능한 대표 팩스주요 활용 사례로는, 국민의 안전 서비스 접근성 분석, 지역별 센터 분포도 작성, 비상연락체계 마련, 소방 인력 배치 효율성 평가 등에 유용하며, 지방자치단체, 연구기관, IT 서비스 개발자 등 다양한 주체의 활용이 가능합니다.'
