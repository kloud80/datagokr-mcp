description_portal: 한국산업안전보건공단에서 제공하는 작업환경측정 결과 데이터로업종별 유해인자(물리적, 화학적인자 등)별 실시 및 초과 사업장에 대한 정보를 제공합니다.산업안전보건법 제125조(작업환경측정) ① 사업주는 유해인자로부터 근로자의 건강을 보호하고 쾌적한 작업환경을 조성하기 위하여 인체에 해로운 작업을 하는 작업장으로서 고용노동부령으로 정하는 작업장에 대하여 고용노동부령으로 정하는 자격을 가진 자로 하여금 작업환경측정을 하도록 하여야 한다.② 제1항에도 불구하고 도급인의 사업장에서 관계수급인 또는 관계수급인의 근로자가 작업을 하는 경우에는 도급인이 제1항에 따른 자격을 가진 자로 하여금 작업환경측정을 하도록 하여야 한다.
