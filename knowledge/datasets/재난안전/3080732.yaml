description_portal: 부산광역시 동구 관내 행정동별로 설치된 적사장(제설함)의 위치 및 관리 현황을 정리하여 제공하는 자료입니다.적사장은 겨울철 강설 및 결빙 시 보행자와 차량의 안전을 확보하기 위해 제설모래를 비치해 두는 시설로, 행정동명, 설치장소, 도로명/지번 주소, 설치 수량, 관리기관 및 연락처 등이 포함됩니다.이를 통해 지역 내 제설함 분포를 한눈에 확인할 수 있어 주민 안전관리, 동절기 제설대책 수립, 위치 기반 안전정보 제공 서비스 개발 등에 활용할 수 있습니다. 특히, 지도 기반 행정지원 시스템이나 재난안전 관리 업무에 필요한 기초 자료로 유용하게 사용됩니다.
