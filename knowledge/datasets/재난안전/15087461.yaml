description_portal: 한국산업안전보건공단에서 제공하는 중대재해 발생현황 데이터로발생연도, 센터, 고용부관서, 발생일자에 대한 정보를 제공합니다.*산업안전보건법 제44조사업주는 사업장에 대통령령으로 정하는 유해하거나 위험한 설비가 있는 경우 그 설비로부터의 위험물질 누출, 화재 및 폭발 등으로 인하여 사업장 내의 근로자에게 즉시 피해를 주거나 사업장 인근 지역에 피해를 줄 수 있는 사고로서 대통령령으로 정하는 사고(이하 “중대산업사고”라 한다)를 예방하기 위하여 대통령령으로 정하는 바에 따라 공정안전보고서를 작성하고 고용노동부장관에게 제출하여 심사를 받아야 한다. 이 경우 공정안전보고서의 내용이 중대산업사고를 예방하기 위하여 적합하다고 통보받기 전에는 관련된 유해하거나 위험한 설비를 가동해서는 아니 된다..
