summary_user: 성남시에 설치된 생활안전 CCTV를 설치 지점 한 곳당 한 행으로 담은 건별 원천 파일이며, 시·구·동, 관리번호, 지번·도로명주소, 설치일자, 카메라대수, 위도·경도를 포함한다. 주민이 우리 동네 골목에 방범 CCTV가 몇 대 있는지 확인하거나, 분석가가 CCTV가 부족한 범죄 취약 지역을 지도로 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 구·동 이름이나 주소 문자열을 맞추거나 위도·경도로 공간 결합해 이어 쓰며, 보안등·안전비상벨 같은 방범 인프라 자료와 겹쳐 보는 용도에 맞는다.
limits: 범위가 성남시 하나라서 이 파일만으로 다른 시군구와 비교할 수 없다. 표준 행정코드 같은 공통 키가 없어 다른 데이터와 붙일 때 이름·주소 매핑이나 좌표 결합에 기대야 한다.
