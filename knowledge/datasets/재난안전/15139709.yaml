summary_user: 전국의 급경사지를 관리번호 단위로 한 건씩 담은 원천 목록으로, 급경사지명, 시행청, 관리주체 구분, 법정동코드, 지번·도로명 주소, 시점·종점 위경도(도·분·초로 나뉨)를 포함한다. 지자체 방재 담당자나 주민이 '우리 동네에 관리 대상 급경사지가 어디에 있고 누가 관리하나'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서, 법정동코드(STDG_CD_1)나 주소를 행정구역 코드표에 맞추거나 같은 기관의 다른 재난 위험지역 데이터와 이름·코드로 연결해 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지역급경사지 정보로, 급경사지관리번호, 급경사지명, 시행청명, 관리주체구분코드, 법정동코드, 상세주소, 위경도 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기  바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
