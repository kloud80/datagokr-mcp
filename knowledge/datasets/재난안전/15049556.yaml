description_portal: 서울시 건축물 내진 통계 현황 상세조회 데이터는 지진 발생 시 안전성과 직결되는 건축물의 내진 확보 현황을 시군구 및 분류별로 정리한 자료입니다. 시군구와 분류명, 제목을 통해 어느 지역, 어떤 구분의 건축물을 대상으로 한 통계인지 알 수 있습니다. 전체 건축물 수량, 내진 확보 수량, 내진 미확보 수량, 내진율 항목은 건축물 개수 기준으로 내진 성능 확보 정도를 보여줍니다. 또한 내진 대상 수량은 법·기준상 내진 설계 또는 보강 의무가 있는 건축물의 규모를 나타냅니다. 전체 건축물 면적, 내진 대상 면적, 내진 대상 확보 및 미확보 면적과 내진율(면적) 항목은 연면적 기준으로 내진 보강 실적을 파악할 수 있게 해 건축물 수뿐 아니라 실제 이용 규모까지 반영한 위험도 평가가 가능합니다. 이 자료는 지진재해 예방정책 수립, 내진 보강 우선순위 설정, 지역별 내진 안전도 비교 분석 등에 활용되는 중요한 기초 통계입니다.
