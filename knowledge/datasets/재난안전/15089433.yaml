summary_user: 인천광역시 서구(서해구) 관내 생활용수 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 7.5KB)로, 시설종류·용도·시설명칭·시설유형·도로명/지번 주소·일일 급수용량(톤)을 수록한다. 단수나 재난 상황에서 주민이 '우리 동네에서 물을 받을 수 있는 비상급수시설이 어디이고 하루에 얼마나 공급하나'를 확인하거나, 행정기관이 지역별 급수 능력 공백을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명·지번 주소나 시설명칭으로 매칭해 이어 쓰며, 같은 부문의 민방위 대피시설·무더위/한파쉼터 등 대피·구호시설 자료와 주소 기준으로 겹쳐 본다.
description_portal: 본 공공데이터는 인천광역시 서구 관내에 설치 된 생활용수용 비상급수시설에 대한 정보를 포함하고 있습니다. 본 자료는 인천광역시 서구 내 생활용수 비상급수시설의 시설종류, 용도, 시설명칭, 시설유형, 소재지(도로명,지번) 등의 정보를 수록하고 있습니다. 본 데이터를 통해 행정기관의 위기 대응 계획 수립, 지역 재난안전 인프라 보강, 시민 대상 비상 대응 안내자료 제작 등 다양한 분야에 활용이 가능할것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
