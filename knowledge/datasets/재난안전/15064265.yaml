description_portal: 산업재해통계에 대한 내용으로 산업중분류별 사업장수 데이터입니다. 산업중 분류별, 규모별, 사업장수 등의 정보를 제공합니다.(2004년~2023년 데이터)*산업재해통계업무처리규정제6조(자료관리) 공단은 고용노동부 및 근로복지공단이 전송한 산업재해 발생 관련 자료 및 업무상재해 관련 자료를 관리하여야 한다.제7조(통계업무 처리) 공단은 제6조에 따라 전송받은 자료를 집계ㆍ분석하여야 한다.제9조(재해통계 등) ① 고용노동부 산업재해통계업무 담당자는 분기별ㆍ연도별 재해발생현황을 작성하여야 한다.
