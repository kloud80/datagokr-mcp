summary_user: 부산광역시 서구 관내 인명피해우려지역을 지구 한 곳당 한 행으로 담은 현황 파일로, 지구명·위치·표지판 설치·위험요인(지정사유)·대피계획인원·대피장소·통제수단·홍보수단·통제 및 주민대피 방법을 기록한다. 서구 주민이나 방재 담당자가 '우리 동네 위험지구에서 비상시 몇 명을 어디로 대피시키고 어떻게 통제하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지구명·위치 문자열이나 같은 기관 기준으로만 맞춰 이어 쓰며, 대피소·재해위험지구·급경사지 같은 다른 재난 위험지역·대피시설 데이터와 함께 본다.
description_portal: 부산광역시 서구 인명피해우려지역 현황 데이터는 부산광역시 서구 관내 인명피해우려지역 지정 현황에 대한 데이터로 인명피해우려지구 이름 , 인명피해우려지구의 위치, 그리고 표지판 갯수, 위험요인, 대피계획인원, 대피장소, 통제수단, 홍보수단, 통제기준 및 주민대피로 구성된 데이터입니다.파일내 항목별 코드설명은 데이터항목 정보를 참고해 주시기 바랍니다.부산광역시 서구는 현재 총8개의 인명피해우려지역을 관리하고있으며, 관리부서는 구민안전과, 건축과, 해양산림과가 분야별로 관리하고 있습니다.
