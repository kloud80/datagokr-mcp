description_portal: '최근 7년간(2018년~2024년) 해양경찰관서 현황에 관한 데이터로서 연도, 지방해양경찰청, 해양경찰서, 파출소, 출장소 등의 항목을 제공합니다.소속기관1차 : 8개 (교육원(1), 중특단(1), 정비창(1), 지방청(5))2차 : 44개 (연구센터(1), 특구대(2), 부산정비창(1), 해경서(21), VTS(19))3차 : 97개 (파출소(97)) * 출장소 223개해양경찰의 주요임무① 해양경찰은 해양에서의 수색ㆍ구조ㆍ연안안전관리 및 선박교통관제와 경호ㆍ경비ㆍ대테러작전에 관한 직무를 수행한다.② 해양경찰은 해양에서 공공의 안녕과 질서유지를 위하여 해양관련 범죄의 예방ㆍ진압ㆍ수사와 치안정보의 수집ㆍ작성ㆍ배포에 관한 직무를 수행한다.③ 해양경찰은 해양오염 방제 및 예방활동에 관한 직무를 수행한다.④ 해양경찰은 직무와 관련된 외국 정부기관 및 국제기구와 협력하여야 한다.'
