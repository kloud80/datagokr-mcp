summary_user: 경상남도 소방본부 소속 소방서의 위치를 시설 한 곳당 한 행으로 담은 파일로, 시군명·시설구분·기관명·도로명/지번 주소·우편번호·WGS84 위경도를 포함한다(csv 약 2KB 규모의 소량 목록). 도민이나 행정 담당자가 '우리 시군을 관할하는 소방서가 어디에 있고 주소·우편번호가 무엇인가'를 확인하거나, 분석가가 소방서 위치를 지도에 찍어 화재 발생 지점과의 거리를 볼 때 쓴다. 전역 조인 키는 없어 시군명이나 기관명 같은 이름으로 맞추거나 위경도 좌표로 화재 발생·소방용수 위치 데이터와 공간 결합해 이어 쓴다.
limits: 표준 행정코드 같은 공통 키가 없어 다른 데이터와는 이름 매칭이나 좌표 기반 결합에 의존해야 한다. 범위는 경상남도 한 시도에 한정되며 개별 시설의 주소·좌표만 담고 관할 구역 경계나 인력·장비 정보는 없다.
