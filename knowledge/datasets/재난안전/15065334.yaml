description_portal: <데이터 수집목적 및 과정>본 데이터는 경남소방본부 소속 각 소방서의 위치 정보를 제공하기 위해 구축되었습니다. 소방서별 주소(도로명/지번), 우편번호, 위경도 좌표(WGS84) 등 핵심 위치 정보를 포함하고 있어, 소방 관련 민원 응대, 위치 안내, 행정 자료 등 다양한 용도로 활용할 수 있습니다. 데이터는 경남소방본부에서 필요 시 비정기적으로 수집·갱신합니다.<데이터 구성 및 세부항목>데이터는 소방서명, 시설구분, 주소(도로명 및 지번), 우편번호, 위도, 경도(WGS84) 등으로 구성되어 있습니다. 각 소방서의 명칭과 구분, 상세 주소, 우편번호 및 위경도 좌표를 확인할 수 있어, 소방 시설 위치 파악과 공간분석, 대민 서비스에 활용이 가능합니다.<데이터 기준일>해당 데이터는 2024년 1월 초 기준입니다.
