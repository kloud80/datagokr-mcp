description_portal: 우리 시  관내 설치되어 있는 소방활동에 필요한 소방용수시설 현황입니다. 5개 관할소방서별 소화전(지상식, 지하식), 저수조, 급수탑 등의 현황을 제공합니다. 소방용수시설 유지·관리를 통한 화재현장 급수지원체계 구축,  소방용수시설 보강(신설·교체 등)으로 화재안전 사각지대 해소 추진합니다. 소화전은 화재 발생 시 소방관이 물을 공급받기 위해 사용하는 설비입니다. 도로변이나 건물 내부에 설치되며, 소방호스를 연결해 화재를 진압할 수 있도록 물을 제공합니다. 소화전은 화재 대응에 필수적인 안전시설입니다.
