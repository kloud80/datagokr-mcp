summary_user: 전남광주통합특별시 관내 소방용수시설을 관할소방서(구분)별로 지상식소화전·일반지하식소화전·저수조·급수탑 개수로 집계한 작은 표(CSV 259바이트)로, 개별 시설 위치 원장이 아니라 소방서 단위 집계다. 소방·안전 분석가가 '어느 소방서 관할에 소화전이나 급수탑이 상대적으로 적은가'처럼 소방용수 보강이 필요한 구역을 가늠할 때 쓴다. 전역 조인 키가 없어 다른 소방 데이터(화재 발생, 119안전센터 등)와는 관할소방서 이름을 맞춰서만 이어 쓴다.
limits: 소방서별 합계만 있어 개별 소화전의 위치나 상태는 알 수 없고, 행정구역 코드나 좌표가 없어 지도·공간 분석에 바로 쓰기 어렵다. 다른 데이터와 붙일 때는 소방서 이름을 직접 매핑해야 한다.
