summary_user: 강원특별자치도경찰청 관내에서 2016~2020년에 발생한 성범죄 건수를 연도별로, 아파트·단독주택·노상·숙박업소·학교·공원 등 27개 장소 유형 열로 나눠 담은 집계 파일(csv, 598 bytes)이다. 강원 지역에서 성범죄가 어떤 장소에서 많이 일어나는지, 장소별 순찰이나 범죄예방 환경설계(CPTED) 우선순위를 어디에 둘지 따져보려는 경찰·지자체·연구자가 쓴다. 전역 조인 키가 없고 연도 열만 있으므로, 다른 시도청의 같은 장소별 통계나 강원 지역 범죄 발생·검거 자료와는 연도와 장소 유형 이름을 맞춰 나란히 비교하는 식으로 이어 쓴다.
description_portal: 이 공공데이터는 2016년부터 2020년까지 강원도 내에서 발생한 성범죄 사건의 장소별 현황을 정리한 자료입니다. 총 27개 장소 유형이 포함되어 있으며, 아파트, 단독주택, 고속도로, 노상, 상점, 숙박시설, 학교, 공원, 주차장 등 다양한 환경에서 발생한 성범죄 건수를 확인할 수 있습니다. 해당 데이터는 성범죄의 공간적 특성과 위험 장소의 유형을 분석하는 데 유용하며, 지역사회 치안 강화와 범죄예방 환경 설계(CPTED), 장소별 맞춤형 순찰 정책 수립 등에 기초자료로 활용될 수 있습니다. 특히 성별·연령별 분석과 연계하여 피해 취약계층을 위한 정책 개발에도 효과적이며, 경찰청, 지자체, 여성·아동 보호기관, 연구기관 등에서 실효성 있는 범죄 예방 전략 마련에 폭넓게 활용할 수 있습니다.
