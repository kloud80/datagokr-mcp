summary_user: 대구광역시 동구 안에서 기계설비 성능점검 대상이 되는 건축물을 한 건물씩 목록으로 담은 원장 파일로, 시군구·법정동·본번·부번·건물명을 담는다(csv 약 10KB 규모). 건물 관리자나 구민이 '우리 건물이 기계설비 성능점검 의무 대상인가'를 확인하거나, 분석가가 동구 내 점검 대상 건물이 어느 동에 몰려 있는지 볼 때 쓴다. 전역 조인 키는 없어서, 법정동명과 본번·부번으로 지번 주소를 만들어 건축물대장 같은 건물 데이터와 이름 매칭 방식으로 이어 쓴다.
description_portal: 대구광역시 동구에서 제공하는 "기계설비 성능점검 대상 건축물" 공공데이터는 지역 내 주요 건축물의 기계설비 안전관리를 위한 핵심 자료입니다. 이 데이터는 법정동, 본번, 부번, 건물명 등의 정보를 포함하고 있습니다. 이 데이터는 "기계설비법"에 따라 일정 규모 이상의 건축물에 설치된 기계설비의 성능점검을 의무화한 법적 요구사항을 충족하기 위해 수집되었습니다. 예를 들어, 연면적 1만㎡ 이상의 건축물이나 500세대 이상의 공동주택 등이 성능점검 대상에 포함됩니다. 이를 통해 건축물의 기계설비 안전성을 확보하고, 화재나 설비 고장 등으로 인한 사고를 예방하는 데 기여합니다.
