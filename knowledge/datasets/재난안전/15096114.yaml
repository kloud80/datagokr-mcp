summary_user: 창원시 주요도로에서 2021년 8월 21일부터 9월 17일까지 수집한 포트홀, 수직·수평·피로균열, 낙하물 쓰레기, 도로 수리 훼손 같은 도로 위험물을 한 건씩 담은 원천 데이터로, 건마다 위험물 유형, 수집 날짜, 위경도, 노드링크·시작·끝 노드, 도로명주소가 붙어 있다(CSV 약 9.3MB). 도로관리 담당자나 분석가가 창원시 어느 도로 구간에 포트홀·균열이 몰려 있었는지 보고 보수 우선순위나 사고 위험 구간을 가늠하는 데 쓴다. 검증된 전역 조인 키는 없어서, 다른 데이터와는 위경도·도로명주소로 공간 매칭하거나 노드링크·노드 번호를 도로 노드링크 자료와 이름·코드 매핑해서 잇는다.
description_portal: 2021년 8월 21일부터 9월 17일까지 수집한 창원시 주요도로의 도로 위험물 정보(포트홀, 수직균열, 수평균열, 피로균열, 쓰레기(낙하물), 도로수리훼손) 현황 데이터입니다.화학물질·인화성 물품 등 다양한 위험물 운송 및 저장 활동이 도로 인근에서 발생하는 지점과 현황을 담은 자료입니다. 본 데이터는 위험물 적재·하역 장소, 운송 경로 인접 지역, 관리 주체 등을 파악하는 데 유용하며, 도로 안전관리, 사고 예방, 응급 대응 계획 수립, 환경안전 정책 수립 등에 활용될 수 있습니다.정보량이 많은 경우 일반 뷰어(엑셀·메모장 등)에서 일부만 확인될 수 있으므로, R, Python, GIS 등 전용 분석·시각화 도구 사용을 권장합니다.위험물 종류, 저장·취급 기준, 점검 주기, 사고 이력 등 세부 내용은 제공기관의 메타데이터 또는 기술문서를 참고해 주세요.
