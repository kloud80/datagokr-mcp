summary_user: 광주소방안전본부 소속 소방공무원의 순직·공상 승인 건수를 연도별로 화재진압·구조구급·출동사고·교육훈련·근무과로·기타 6개 원인으로 나눠 담은 집계 파일입니다(2021~2025년, 약 1KB CSV). 소방 인력 안전을 연구하는 분석가나 정책 담당자가 '어떤 업무 중에 소방관 부상·순직이 가장 많이 승인됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지역 소방 공사상 통계나 출동·화재 통계와는 연도(년도) 기준으로 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
