description_portal: '광주광역시 소방공무원의 공사상 현황은 광주소방안전본부 소속의 소방공무원의 순직 또는 공상 발생 건수로 구성된 데이터입니다.연도 및 발생 원인으로 분류하였습니다. 발생원인은 업무 특성상 다양하게 발생되어 6개로 분류하였으며 (원인별) 화재진압, 구조구급, 출동사고, 교육훈련, 근무과로, 기타로 나눴습니다. 기타에는 출퇴근 중 발생한 사고, 출장중 발생한 사고, 사무실 내에서 발생한 사고 등 현장 출동으로 발생한 사고 외의 건들을 포함하였습니다.○ 기간: 2021년~2025년○ 작성기준: 순직 또는 공상 발생연도 기준이 아닌, 승인결정이 통보된 일자의 해당연도 기준으로 작성된 자료입니다.  * 순직 또는 공상 발생연도 기준으로 작성 시, 연도 중 순직 또는 공상승인이 결정되면 데이터 변동이 지속적으로 발생하게 되어 매년 이전 연도의 데이터를 현행화하고자 합니다.'
