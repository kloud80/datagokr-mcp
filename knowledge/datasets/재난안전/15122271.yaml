description_portal: 메타관리시스템 기반 공공데이터 개방계획 수립 및 이행을 위한 수상구조사 시스템의 수상안전종합관리 게시물정보는 수상안전 관련 데이터와 자격 제도를 체계적으로 관리하고 국민에게 투명하게 제공하기 위한 핵심 체계를 의미합니다. 이 시스템은 여러 핵심 항목으로 구성되며, 먼저 첨부파일관리(Attachment Management)를 통해 첨부파일의 고유 식별자, 생성일자, 생성시간, 사용 여부 등을 관리하여 자료의 신뢰성과 추적성을 확보합니다. 또한 첨부파일상세(Attachment Details) 항목에서는 파일 ID, 파일 내용, 파일 확장자 등 구체적인 속성을 기록하여 데이터 활용 시 필요한 세부 정보를 제공합니다. 더불어 게시판관리정보(Board Management Information)는 게시판의 ID, 소개, 명칭 등을 포함해 다양한 수상안전 관련 게시글을 체계적으로 분류하고 관리할 수 있게 합니다. 마지막으로 메뉴정보(Menu Information)는 메뉴명, 메뉴 설명, 메뉴 순서를 정의하여 사용자들이 필요한 정보를 손쉽게 탐색할 수 있도록 돕습니다.
