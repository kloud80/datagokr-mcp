summary_user: 경상남도 거제시 가로등 7,761건을 건별로 담은 원천 목록이며, 표찰번호·종류·지번주소·위도·경도와 램프 종류별(CDM·나트륨·LED) 수량, 설치년도를 싣는다. 시민이나 담당자가 우리 동네 가로등이 어디에 어떤 램프로 설치돼 있는지, 노후·교체 대상이 얼마나 되는지 확인하는 데 쓴다. 지번주소(address)와 위도·경도(coord)가 조인 키라서 CCTV, 보안등, 안심지킴이집 같은 다른 방범·생활안전 시설 위치 데이터와 좌표나 주소로 겹쳐 쓴다.
description_portal: 경상남도 거제시 가로등 현황 공공데이터는 표찰번호, 종류, 지번주소, 위도·경도 등의 위치 정보와 함께 설치된 조명 종류(CDM램프, 나트륨램프, LED램프) 및 설치년도 정보를 포함하고 있습니다. 해당 데이터는 가로등의 설치 현황을 체계적으로 관리하고 유지보수 및 개선 작업에 활용됩니다. 특히 조명 종류별 분포를 파악함으로써 에너지 효율성 분석 및 친환경 조명 교체 계획 수립에 유용합니다. 또한, 시민 안전을 위한 야간 조도 확보 및 도시 미관 개선을 위한 기초 자료로 활용됩니다. 지자체 및 관련 기관의 스마트도시 인프라 구축과 공공조명 정책 수립에도 기여할 수 있습니다.
