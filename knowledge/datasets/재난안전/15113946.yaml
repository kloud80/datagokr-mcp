summary_user: 충청남도 보령시가 재난 때 이재민을 수용하려고 사전 지정한 임시주거시설을 시설 한 곳당 한 행으로 담은 파일로, 읍면동·시설명·도로명/지번 주소·위도·경도·면적·수용인원·지정분야·연락처를 포함한다. 보령시 주민이나 재난 담당자가 '태풍·홍수로 집을 잃으면 우리 동네에서 어느 시설로 가고, 그곳에 몇 명이 들어갈 수 있나'를 확인하거나, 읍면동별 수용 능력을 따져보는 데 쓴다. 전역 조인 키는 없어 읍면동 이름이나 주소·좌표로 다른 대피시설·재난 위험지역 데이터와 맞춰 써야 한다.
description_portal: 충청남도 보령시_이재민임시주거시설지정현황기후변화로 인한 자연재해 빈발과 태풍, 홍수, 산사태 등 대규모 재난 발생 시 이재민 보호와 안전한 임시 거주 공간 확보의 중요성이 사회적 과제로 대두되면서, 체계적인 재난 대응 체계 구축과 이재민 지원 시설 운영이 중요한 재난 관리 정책으로 인식되고 있습니다. 재난 및 안전관리 기본법에 따른 효과적인 재난 대응과 이재민 보호를 위한 임시주거시설의 사전 지정과 체계적 관리가 필요하며, 재해 발생 시 신속한 이재민 수용과 기본적인 생활 서비스 제공을 위한 시설 운영 준비 체계 구축이 요구되고 있습니다. 지역별 재해 위험도와 인구 분포를 고려한 적정한 임시주거시설 배치와 수용 능력 확보를 통한 재난 대응 역량 강화가 중요해지고 있으며, 이재민들의 인간다운 생활 보장과 신속한 일상 복귀를 위한 임시주거시설의 시설 기준과 운영 방안 개선이 필요합니다. 또한 재난 상황별 맞춤형 대응과 효율적인 자원 배분을 위한 임시주거시설 현황의 체계적 관리와 정보 공유 체계 구축이 중요하며, 재난 안전 정책 수립과 재해 대응 계획 수립을 위한 기초 자료 확보의 필요성이 증대되고 있어, 충청남도 보령시는 관내 88개소 이재민 임시주거시설의 위치, 수용 인원, 시설 규모, 지정 분야 등 재난 대응과 이재민 보호에 필요한 종합적인 임시주거시설 지정 현황 정보를 제공하고 있습니다.
