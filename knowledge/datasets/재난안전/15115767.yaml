summary_user: 서울특별시 송파구의 민방위 비상급수시설을 인허가 건별로 담은 원천 데이터로, 관리번호·인허가일·영업(운영)상태·폐업일·소재지 주소·좌표·시설 구분과 시설(건물)명 등을 시설 한 곳당 한 행으로 담는다. 주민이나 재난안전 담당자가 '단수나 재난이 났을 때 송파구에서 가장 가까운 비상급수시설은 어디이고 지금도 운영 중인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(지번·도로명)나 시설명 매칭, 좌표(XCRD·YCRD) 기반 공간 결합, 또는 같은 기관 코드(OGDP_INST_CD)로 이어 쓰며, 다른 구의 민방위 대피시설·급수시설 데이터와 묶어 대피·구호시설 지도를 만드는 데 쓴다.
description_portal: 서울특별시 송파구의 민방위급수시설 인허가 정보에 대한 데이터입니다. 민방위급수시설 인허가 정보에 대한 데이터 등을 포함하고있습니다.
