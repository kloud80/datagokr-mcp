summary_user: 경기도 내에서 발생한 유해화학물질 사고를 사고 한 건 단위로 담으며, 시군명·시군코드(SIGUN_CD), 사고일자, 사고내용, 원인, 지번·도로명 주소, 우편번호, WGS84 위도·경도를 포함한다. 지자체 안전 담당자나 분석가가 '최근 우리 시군에서 화학사고가 어디서 어떤 원인으로 났는가'를 확인하고 사고 유형과 위험지역을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 시군명·시군코드 매핑이나 좌표 기반 공간 결합으로 다른 경기도 재난·시설 안전 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 발생한 유해화학물질 사고의 전반적인 현황을 기록한 자료로, 사고 발생지역, 사고일자, 사고내용, 원인, 주소, 위도·경도 등의 정보를 포함하고 있습니다. 사고는 다양한 산업현장에서 발생하며, 사고의 위치정보는 지번 및 도로명 주소뿐 아니라 공간 분석이 가능한 좌표 형태로도 제공됩니다. 데이터는 지역사회 화학물질 사고 예방 정책 수립, 사고 유형 분석, 위험지역 파악, 산업안전 시스템 개선, 응급대응체계 구축 등에 활용할 수 있으며, 향후 화학사고 재발 방지를 위한 기반자료로도 중요합니다.
