summary_user: 제1종시설물 점검·진단 결과보고서에서 뽑은 콘크리트코어 시험 결과를 시료 한 건씩 비식별화해 담은 파일로, 포털 설명상 23개 열·808행이며 건축물·교량·상하수도·터널·하천·항만 6개 시설물 구분과 측정위치·채취직경·탄산화깊이·압축강도(MPa) 등을 포함한다. 시설물 유지관리 연구자나 진단 기술자가 시설물 종류와 경과일수에 따라 콘크리트 강도와 탄산화 깊이가 어떻게 달라지는지 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설 안전 데이터와는 시설물명·시설물구분 같은 이름 매핑으로만 느슨하게 이어 쓴다.
description_portal: 국토안전관리원에서 제공하는 제1종시설물 대상 점검, 진단 결과보고서의 콘크리트코어 데이터를 비식별화하여 엑셀 형식으로 공개하는 데이터입니다.데이터는 시설물명, 위치, 시설물구분, 점검진단구분, 경과일수, 측정위치 등 23개의 열과 808개의 행으로 구성되어 있습니다.시설물은 건축물, 교량, 상하수도, 터널, 하천, 항만의 6개로 구분되어 제공되고 있습니다.2022년까지 수행한 DB구축 데이터로 이후 생성데이터가 존재하지 않아 1회성 데이터로 변경되었음을 알려드립니다.
