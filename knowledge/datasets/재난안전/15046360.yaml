description_portal: '○ 통계개요* 통계명 : 특정 소방대상물 현황(구별)* 통계종류 : 서울시 특정 소방대상물 현황을 자치구별로 제공하는 일반ㆍ보고통계* 작성목적 : 가연성 물질을 대량으로 저장ㆍ취급하거나 대형화재 취약대상물 등 특정소방대상물, 다중이용업소 등의 현황을 파악하여 사고 방지 및 대응 등효과적 관리를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 소방서 → 서울소방재난본부 예방과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 소방서내용 - 특정 소방대상물(근린생활시설, 문화집회 및 운동시설 등) 현황○ 용어설명* 특정 소방대상물 : 소방시설을 설치하여야 하는 소방대상물* 소방시설 : 소화설비, 경보설비, 피난설비, 소화용수설비 그 밖에 소화활동 설비* 지하가 : 지하의 공작물 안에 설치되어 있는 점포, 사무실 및 그 밖에 이와 비슷한시설로서 연속하여 지하도에 면하여 설치된 것과 그 지하도를 합한 것 등* 지하구 : 전력ㆍ통신용의 전선이나 가스ㆍ냉난방용의 배관 또는 이와 비슷한 것을집합 수용하기 위하여 설치한 지하공작물로서 사람이 점검 또는 보수하기 위하여출입이 가능한 것 중 폭 1.8미터 이상이고 높이가 2미터 이상이며 길이가 50미터이상인 것 등* 문화재 : 「문화재보호법」에 따라 문화재로 지정된 건축물* 기타 자세한 사항은「소방시설유지 및 안전관리에 관한법 시행령」(별표 2)특정소방대상물 (제5조관련) 참조'
