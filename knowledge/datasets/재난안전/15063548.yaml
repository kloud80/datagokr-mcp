description_portal: 해당 데이터는 ‘소방안전교육사’ 자격시험 합격자를 연령대별로 집계한 자료(2008~2018)입니다. 소방안전교육사는 「소방기본법」 17조의2에 근거한 자격으로, 국민에게 체계적인 소방안전교육을 실시할 수 있는 전문 인력을 양성하기 위해 2012년부터 도입되었습니다.  자격요건은  소방공무원으로 3년 이상 근무한 경력이 있는 사람,  중앙소방학교 또는 지방소방학교에서 2주 이상의 소방안전교육사 관련 전문교육과정을 이수한 사람,  「초·중등교육법」 제21조에 따라 교원의 자격을 취득한 사람,  「유아교육법」 제22조에 따라 교원의 자격을 취득한 사람,  「영유아보육법」 제21조에 따라 어린이집의 원장 또는 보육교사의 자격을 취득한 사람,  교육학과, 응급구조학과, 의학과, 간호학과 또는 소방안전 관련 학과 등 소방청장이 고시하는 학과에 개설된 교과목 중 소방안전교육과 관련하여 소방청장이 정하여 고시하는 교과목을 총 6학점 이상 이수한 사람 등 입니다.
