description_portal: 부산시 내 각 구별 배수펌프장 현황에 대한 데이터로 배수펌프장명, 위치, 펌프시설, 설계빈도, 배수량, 비상발전기, 유수지 등 관련 정보 제공합니다.배수펌프장은 주로 침수 방지를 위해 저지대나 홍수 위험 지역에 설치하는 시설로 빗물이나 하천의 물을 강제로 퍼내어 하천이나 바다로 방류하는 역할을 합니다. 빗물펌프장이라고도 불립니다. 주요 역할로 집중호우로 하천 수위가 상승하면 저지대로 물이 역류할 수 있는데, 배수펌프장은 펌프를 이용해 물을 강제로 외부로 배출하여 침수 피해를 막아줍니다. 또  도시 지역의 우수관로를 통해 들어온 빗물을 하천으로 안전하게 내보내 도시 기능이 마비되지 않도록 합니다.* 펌프시설엔진  등 데이터미집계로 인한 일부 공란이 있습니다.
