summary_user: 전국 승강기의 재난 피해를 사건별 1행으로 담은 건별 원천 파일로, 2021-08-02부터 2025-09-24까지 2,080행이 있다. 승강기 안전 담당자나 분석가가 재난유형·피해유형별로 어떤 승강기 부위(피해장소)가 얼마나 피해를 입었는지 살필 때 쓴다. 건물주소(address)를 조인 키로 다른 시설 주소 자료와 이어 쓰며, 승강기고유번호는 승강기 단위 원장과 연결하는 식별자이나 실측 조인 키로 확인된 것은 건물주소뿐이다.
description_portal: 이 데이터는 한국승강기안전공단이 수집한 전국 승강기의 재난피해 발생 현황을 기록한 자료로, 각 행은 하나의 재난사건에 해당하는 승강기 피해 정보를 포함하고 있습니다. 주요 필드는 ‘건물명’, ‘건물주소’, ‘승강기고유번호’, ‘승강기 구분’, ‘재난유형’, ‘재난종류’, ‘피해유형’, ‘피해장소’, ‘발생일시’ 등으로 구성되어 있습니다.‘건물명’과 ‘건물주소’는 피해가 발생한 건물의 위치 정보를 제공하며, ‘승강기고유번호’는 해당 승강기를 식별할 수 있는 고유 식별자입니다. ‘승강기 구분’은 엘리베이터 등 승강기의 종류를 나타내며, ‘재난유형’ 및 ‘재난종류’는 자연재해 또는 사회재난 등 재난의 성격과 세부 원인을 구분합니다. ‘피해유형’은 침수, 파손 등 실제 피해 형태를 기록하고, ‘피해장소’는 피트, 승강로 등 피해가 발생한 승강기 부위 정보를 제공합니다. ‘발생일시’는 사고가 일어난 날짜와 시간을 나타냅니다.이 데이터는 재난유형별 피해 사례 분석, 승강기 설치환경의 위험도 평가, 재난 대응 정책 수립, 시설물 유지관리 개선 등에 활용될 수 있습니다.
