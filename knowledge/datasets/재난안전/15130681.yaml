summary_user: 경기도 안전예방핫라인(옛 도민안전점검청구제)에 따라 도민이 요청해 수행된 안전점검 건수를 연도·월 단위로 집계한 통계로, 범위는 경기도(시도 단위) 전체이며 지역별 위치 정보는 없습니다. 도민 참여형 안전점검이 어느 해, 어느 달에 많이 이뤄졌는지 보고 점검 인력 배치나 홍보 시기를 정하려는 지자체 담당자·정책 분석가가 쓴다. 기준연도(crtr_yr)·기준월(crtr_mm) 외에 전역 조인 키가 없어, 다른 재난·시설안전 통계와는 연·월 기준으로만 맞춰 비교한다.
description_portal: 이 데이터는 경기도에서 시행 중인 도민안전점검청구제에 따라 수행된 점검 활동의 현황을 연도 및 월 단위로 기록한 통계 자료입니다.  이 제도는 주민이 직접 생활 주변의 위험요소를 점검해 줄 것을 요청할 수 있는 안전 행정 참여 방식으로, 국민 참여형 안전문화 정착을 목적으로 하고 있습니다. 이 데이터는 도민 참여를 기반으로 한 안전 관리 활동의 빈도와 시기적 분포를 파악하는 데 유용하며, 재난 예방 정책 수립, 월별 점검 트렌드 분석, 연도별 점검 강화 시점 결정 등 공공안전 향상을 위한 기초자료로 활용될 수 있습니다.*도민안전점검청구제 -> 안전예방핫라인으로 명칭 변경되었습니다.
