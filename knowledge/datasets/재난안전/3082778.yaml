description_portal: '본 데이터는 제주특별자치도 제주시 관내에 설치된 특정 토양오염 관리대상 시설의 연도별 설치 및 운영 현황을 수록한 자료입니다. 「토양환경보전법」에 따라 토양오염 유발 가능성이 높은 시설을 체계적으로 관리하고, 환경오염 사전 예방과 오염 확산 방지를 위한 정책 수립에 활용하기 위해 수집됩니다.주요 항목상호: 관리대상 시설의 업체명 또는 사업장 명칭업종: 해당 시설이 수행하는 산업 또는 영업의 업종 구분소재지: 시설이 설치된 도로명 주소 또는 행정구역상의 위치배출물질: 해당 시설에서 토양오염을 유발할 수 있는 주요 배출물질(예: 중금속, 석유류, 유기용제 등)활용 목적이 데이터는 지역 내 토양오염 유발 가능 시설에 대한 모니터링, 환경 지도점검, 오염원 추적 및 사전 차단 조치 등의 행정 업무에 활용되며, 제주시에서 정기적으로 갱신하여 최신 정보가 반영되도록 유지됩니다.'
