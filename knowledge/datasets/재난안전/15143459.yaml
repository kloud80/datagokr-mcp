description_portal: 서울특별시 은평구에서 제공하는 방범용 CCTV 설치 현황 데이터입니다. 본 데이터는 은평구 관내 방범 목적으로 설치된 CCTV에 대한 상세 정보를 담고 있으며, 항목으로는 설치 위치(도로명 주소 및 지번), 위도·경도 좌표, 설치 목적, 카메라 대수 및 화소수, 촬영 방향, 영상 보관일수, 설치 연월, 관리기관 정보 등이 포함되어 있습니다. 총 1,700여 건 이상의 설치 사례를 담고 있으며, 위치 기반 인공지능 분석, 범죄 예방 모델링, CCTV 최적 배치 시뮬레이션, 시각화 기반 안전지도 제작 등에 활용될 수 있습니다. 일부 주소 정보 누락 또는 좌표 미기재 항목이 존재할 수 있으며, 데이터 기준일자는 2025년 1월 1일입니다. 데이터는 CSV 형식으로 제공되어 다양한 데이터 분석 도구 및 인공지능 모델 학습에 적합합니다.
