summary_user: 전국 졸음쉼터의 위치를 시설 한 곳씩 담은 데이터로, 시설관리번호·명칭과 시도·시군구·읍면동, 도로명주소 요소, X·Y 좌표와 공간정보(GEOM)를 포함한다. 운전자나 도로·교통 분석가가 '이 노선이나 시군구에 졸음쉼터가 어디 있고 간격은 얼마나 되나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군구 코드(STDG_SGG_CD)·도로명 코드나 행정구역 이름, 좌표 기반 공간 결합으로 이어 붙인다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털(www.data.go.kr)에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 졸음쉼터 정보입니다.\""
