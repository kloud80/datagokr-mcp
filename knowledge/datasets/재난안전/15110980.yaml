description_portal: 국토안전관리원에서 관두께 시험측정을 한 데이터입니다.측정대상은 광역상수도의 상하수도이며 종별은 1종입니다.관두께의 크기별 마다 측정하였으며 이러한 결과값을 제공하고자 합니다.데이터는 시설물구분, 시설물종류, 종별, 시설물번호 등 19개의 열과 1,086개의 행으로 구성되어 있습니다.시설물번호는 6개 존재하며, 각 시설물마다 관로계통은 모두 다릅니다.관의 종류는 DCIP, SP, SUS 3개로 구성되어 있습니다. 이 중 SP가 가장 많은 비율을 차지하고, SUS가 적은 비율을 차지하고 있습니다.
