summary_user: 경기북부경찰청 소속 13개 경찰서와 관할외(경찰서 미지정) 구분별로 112신고 접수 건수를 연도별·접수 종류별(긴급출동, 비긴급출동, 비출동)로 집계한 통계 파일이며, 포털 설명상 2016년부터 2025년까지를 담는다. 지역 치안 분석가나 지자체 담당자가 고양·남양주·파주 같은 경기북부 지역에서 긴급 출동 신고가 해마다 어떻게 늘고 줄었는지, 경찰서별로 비교할 때 쓴다. 전역 조인 키나 행정코드가 없어 경찰서 이름을 관할 시군과 직접 대응시켜 다른 지역 범죄·인구 통계와 연결해야 한다.
description_portal: 해당 데이터는 경기도북부경찰청 소속 경찰서별 112신고 접수 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 112신고 접수 종류는 긴급신고(출동), 비긴급신고(출동), 비출동신고로 구분되어 있습니다. 경찰서는 의정부, 고양, 일산동부, 일산서부, 남양주남부, 남양주북부, 파주, 양주, 동두천, 구리, 포천, 가평, 연천으로 구분되어 있습니다. 2016년부터 최근 연도인 2025년까지의 현황을 접수 종류별 및 경찰서 별로 구분하여 제공하고 있어, 해당 기간 동안의 각 경찰서별 및 연도별 112신고 접수 현황을 파악할 수 있습니다. 이 자료는 112신고 접수와 관련된 경찰 활동을 보여주며, 해당 현황은 경기북부경찰청 112치안종합상황실에서 제공합니다.
