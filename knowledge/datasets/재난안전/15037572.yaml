summary_user: 경상남도 창원시의 주택용 소방시설(소화기·단독경보형감지기 등) 보급 가구수를 연도·관할소방서별로 집계한 작은 파일(csv 약 2KB)로, 총계와 취약계층·기타(일반가구·화재없는마을 등) 보급 가구수를 나눠 담는다. 창원시 소방 담당자나 분석가가 "소방서 관할별로 취약계층 가구에 소방시설이 해마다 얼마나 보급됐나"를 확인하고 화재 예방 사각지대를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 소방 데이터(화재 발생 건별·소방용수 원장 등)와는 연도와 관할소방서 이름을 맞춰서만 이어 쓴다.
description_portal: 경상남도 창원시의 연도별 기초소방시설보급건수 및 저소득층 화재점검기 보급건수입니다. 기초생활수급대상자 및 저소득층, 25년 이상 노후 주택을 대상으로 보급한 현황입니다.소화기, 단독경보형감지기 등 필수 소방장비와, 저소득층 가구 대상 화재점검기를 보급한 현황을 정리한 자료입니다. 이 데이터는 장비 보급 수량과 분포, 대상 지역 및 수혜자 범위를 파악할 수 있어 화재 예방 정책 수립, 안전 사각지대 발굴, 민원 대응, 보조금 관리 등에 활용될 수 있습니다.데이터 항목이 많아 엑셀 등 일반 뷰어만으로는 일부만 확인될 수 있으므로 R, Python, GIS 등 전용 분석 도구를 사용한 시각화 및 통계 분석을 권장합니다.보급 기준일, 설치 대상 시설, 장비 종류 및 규격, 집계 단위(가구·시설 등) 등 상세 기준은 해당 메타데이터 또는 기술문서를 참고해 주세요.
