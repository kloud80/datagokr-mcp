summary_user: 경상남도 소방본부 소속 소방서별로 시군명, 기관명, 전화번호, 도로명·지번주소, 관할구역, 행정동·법정동을 한 행씩 담은 시도 단위 현황 파일이며, 포털 설명상 2023년 12월 말 기준이고 파일 크기는 약 3KB로 작다. 도민이나 행정 담당자가 '우리 동네는 어느 소방서 관할이고 그 소방서 연락처와 주소는 무엇인가'를 확인할 때 쓴다. 법정동코드(bjd_cd)와 행정동코드로 화재 발생 건별 자료나 소방용수 위치 원장 같은 다른 소방·행정구역 데이터와 이어 붙인다.
description_portal: <데이터 수집목적 및 과정>본 데이터는 경남소방본부 소속 각 소방서의 현황과 관할구역 정보를 제공하기 위해 구축되었습니다. 경상남도 내 소방서의 기본 현황과 관할 행정구역 정보를 도민 및 관계기관이 쉽게 확인할 수 있도록 필요 시 비정기적으로 수집·정리하고 있습니다.<데이터 구성 및 세부항목>데이터는 집계년도, 시군명, 소방서 명칭, 주소, 관할구역, 우편번호, 행정동 및 법정동, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 각 소방서의 위치와 관할 범위, 행정구역별 소방서비스 제공 현황을 체계적으로 파악할 수 있으며, 공공행정, 통계, 정책수립 등에 활용이 가능합니다.<데이터 기준일>해당 데이터는 2023년 12월 말 기준입니다.
