summary_user: 경상남도 함안소방서 관내 소방용수(소화전·급수탑 등 수리) 시설을 한 건씩 담은 원장 파일로, 관리번호·주소·읍면동·리·형식·설치연도·관리주체·안심마을 지정여부·관할 센터와의 거리를 개별 주소 단위로 담는다. 함안군 주민이나 소방·안전 분석가가 '우리 마을 주변에 어떤 형식의 소방용수가 어디에 있고 관할 119안전센터와 얼마나 떨어져 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 주소·읍면동·리 이름이나 센터명으로 화재 발생 이력, 119안전센터, 비상소화장치 데이터와 맞춰 이어 쓴다.
description_portal: 함안소방서 관내 소방용수 현황으로, 관리번호, 수리위치 및 형식, 주변 대상물, 안심마을 지정여부, 센터와의 거리 등의 항목으로 정보를 제공합니다.* 지역대, 설치장소, 마을명칭 항목 중 적용되지 않는 행의 데이터는 제공하지 못하는 점 양해 바랍니다.
