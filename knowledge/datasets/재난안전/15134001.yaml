summary_user: 지진·태풍·화재·민방공 등 상황에서 사용기관이 발송한 긴급재난문자를 발송 건 단위로 담으며, 발송 일시·문자 내용·수신 지역·긴급 단계·재해 구분이 함께 있고 범위는 전국입니다. 분석가나 지자체 담당자가 '최근 우리 지역에 어떤 재해 유형의 재난문자가 몇 번, 어느 단계로 발송됐나'를 확인하는 데 씁니다. 전역 조인 키는 없으므로 수신 지역명(RCPTN_RGN_NM)을 행정구역 이름으로 매핑해 대피시설·재해위험지구 같은 재난안전 데이터와 이어 씁니다.
description_portal: 지진, 태풍, 화재 등 재난 및 민방공 상황발생으로 인한 인명ㆍ재산 피해가 예상되는 때,  재난 상황에서 국민의 생명과 재산을 보호하기 위해  사용기관에서 발송한 긴급재난문자 정보를 제공합니다.공공데이터포털(data.go.kr)에서 제공되던, '행정안전부_재난문자방송 발령현황' / '행정안전부_재난문자방송 발령현황(지역별)'을 대체하는 서비스입니다.기존 서비스는 조회가 제한되며 향후 폐기될 예정이므로, 앞으로 해당 정보를 이용하려는 사용자께서는 '긴급재난문자 API' 를 신청 및 활용하여 주시기 바랍니다.
