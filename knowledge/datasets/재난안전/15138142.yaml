description_portal: 한국승강기안전공단의 ‘위험예지훈련(KYT) 목록’ 데이터는 검사·유지관리 과정에서 발생할 수 있는 재해를 사전에 인지하고 예방역량을 높이기 위한 교육·훈련 자료입니다. 중요포인트, 훈련제목·내용, 사고원인, 사고예방 항목으로 표준화되어 있으며, 기계실·승강로·피트·승강장·에스컬레이터 등 다양한 작업공간에서 빈발하는 끼임, 추락, 미끄럼, 충돌, 회전체 접촉 등의 위험상황과 대응요령을 사례 중심으로 제공합니다. 전원 차단, 보호구 착용, 2인 수권조작, 사다리 고정, 발 디딜 곳 확인, 비상구출 절차 등 핵심 안전수칙을 행동지침 형태로 제시하여 현장 점검 전 지적확인과 위험성평가(RA) 개선에 활용할 수 있습니다. 본 자료는 공단이 수집·정리한 실제 사례를 기반으로 하며, 교육교안 제작, 신규 검사원 훈련, 자율안전관리 강화, 점검표 보완, 사고재발 방지대책 수립 등 공공·민간 현장에서 폭넓게 사용할 수 있습니다.
