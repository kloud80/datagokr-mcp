description_portal: 한국산업안전보건공단에서 수행하는 건설업 유해위험방지계획서 업체 현황에 대한 자료(2024. 8. 1. ~ 2025. 7. 31.(1년) 기간의 건설업 유해위험방지계획서 자체심사 및 확인업체 현황 데이터)로건설업체명, 2년 연속 여부, 시공순위에 대한 칼럼을 제공하고 있습니다.*산업안전보건법 제42조(유해·위험방지계획서의 작성·제출 등)사업주는 다음 각 호의 어느 하나에 해당하는 경우에는 이 법 또는 이 법에 따른 명령에서 정하는 유해ㆍ위험 방지에 관한 사항을 적은 계획서(이하 “유해위험방지계획서”라 한다)를 작성하여 고용노동부령으로 정하는 바에 따라 고용노동부장관에게 제출하고 심사를 받아야 한다. 다만, 제3호에 해당하는 사업주 중 산업재해발생률 등을 고려하여 고용노동부령으로 정하는 기준에 해당하는 사업주는 유해위험방지계획서를 스스로 심사하고, 그 심사결과서를 작성하여 고용노동부장관에게 제출하여야 한다. 1. 대통령령으로 정하는 사업의 종류 및 규모에 해당하는 사업으로서 해당 제품의 생산 공정과 직접적으로 관련된 건설물ㆍ기계ㆍ기구 및 설비 등 전부를 설치ㆍ이전하거나 그 주요 구조부분을 변경하려는 경우2. 유해하거나 위험한 작업 또는 장소에서 사용하거나 건강장해를 방지하기 위하여 사용하는 기계ㆍ기구 및 설비로서 대통령령으로 정하는 기계ㆍ기구 및 설비를 설치ㆍ이전하거나 그 주요 구조부분을 변경하려는 경우3. 대통령령으로 정하는 크기, 높이 등에 해당하는 건설공사를 착공하려는 경우*자체 심사 및 확인 절차자체심사 및 확인업체 사업주는 유해·위험방지계획서를 작성한 후 자체심사 및 확인을 실시하되 임직원 및 외부 전문가 중 다음에 해당하는 자 1인 이상이 참여하도록 하여야 하고 그 결과를 사업장에 갖추어 두어야함.1. 건설안전분야 산업안전지도사2. 건설안전기술사3. 건설안전기사(산업안전기사 이상 자격 취득자로서 건설안전 실무경력 3년 이상 인자 포함) 이상으로서 공단의 심사전문화교육 28시간 이상 이수한 자
