description_portal: 기초질서 위반 단속현황 정보는 2018년에서 2025년까지 최근 8년간 연도별 기초질서 위반(무임승차, 음주소란, 노상방뇨, 불안감조성) 단속 현황을 제공하고 있습니다. 경범죄 처벌법은 국민의 일상생활 주변에서 흔히 범하기 쉬운 공공질서 위반 및 사회규범에 위배되는 비교적 경미한 범죄와 이에대한 형벌을 규정한 형사법입니다. 범죄예방, 공공의 기초질서 확립 및 사회규범의 기준제시 등이 경범죄 처벌법의 입법 목적입니다. 행위태양에 따라 10만원·20만원·60만원의 이하의 벌금, 구류 또는 과료의 형으로 처벌합니다. 해당 현황은 대구광역시경찰청 생활안전부 범죄예방대응과에서 담당하고 있습니다
