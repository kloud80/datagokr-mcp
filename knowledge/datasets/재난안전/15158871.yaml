summary_user: 서울 중랑구 안의 대피시설을 시설 한 곳씩 담은 파일(CSV 약 18KB)로, 행정동·시설명·시설규모(제곱미터)·도로명주소를 담는다. 중랑구 주민이 재난 시 우리 동네에서 가장 가까운 대피시설이 어디이고 규모가 얼마나 되는지 확인하거나, 분석가가 동별 대피시설 면적을 비교하는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 행정동 이름이나 도로명주소를 매칭해 잇거나, 다른 자치구의 대피시설 데이터와는 같은 항목 기준으로 나란히 붙여 쓴다.
description_portal: 서울특별시 중랑구 대피시설 현황 데이터입니다. 제공하는 주요항목으로는 읍면동, 시설명칭, 시설규모, 도로명주소입니다. 자세한 데이터는 공공데이터 페이지에서 파일을 다운로드 받으시거나 중랑구 홈페이지의 비상대피시설 안내를 확인하여 주시기 바랍니다. 홈페이지 메뉴는 분야별정보>생활경제>재난안전>비상대피시설안내로 들어가시면 확인하실 수 있습니다. 홈페이지에서 확인하실 경우 구역번호를 클릭하시면 지도에서 확인가능합니다. 이용에 참고하여 주시기 바랍니다. 감사합니다.
