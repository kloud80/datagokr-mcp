summary_user: 경기도 소방서들이 보유한 소방장비를 장비구분·용도구분·기능구분·장비명별로 나누어 보유수량을 담은 집계 자료다. 정책 담당자나 연구자가 경기도 소방이 특정 용도·기능의 장비를 몇 대 갖추고 있는지 파악해 장비 보충이나 예산 배분을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방 데이터와는 장비명·구분명 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 소방서에서 사용 중인 다양한 소방장비의 보유 현황을 정리한 자료로, 2024년 11월 18일을 기준으로 수집되었으며 연간 단위로 갱신됩니다. 주요 항목으로는 장비의 유형을 나타내는 장비구분명(EQUP_DIV_NM), 장비의 사용 목적에 따른 용도구분명(PURPOS_DIV_NM), 수행 기능에 따른 기능구분명(SKLL_DIV_NM), 장비의 명칭을 나타내는 장비명(EQUP_NM), 그리고 각 장비의 보유수량(HOLD_QTY)이 포함되어 있습니다. 본 데이터는 소방안전 관련 정책 수립, 장비 배치 및 보충 계획, 긴급 상황에 대비한 응급대응 체계 점검 등에 활용할 수 있습니다. 특히 다양한 기능과 용도를 갖춘 장비의 분류를 통해 각 지역별 자원 분포의 불균형 여부를 확인하고 장비 운영의 효율성을 높일 수 있습니다. 또한 소방안전 계획 수립 시 핵심 자료로 활용되어 화재 대응력 향상, 재난 예방 전략 수립, 예산 분배의 합리성 확보에 기여할 수 있으며, 공공기관뿐 아니라 학술연구나 민간 안전관리 분야에서도 활용도가 높습니다. 데이터는 Open API 형태로 제공되며, 인증키를 통해 실시간으로 접근이 가능하여 정보의 접근성과 활용성을 동시에 제공합니다.
