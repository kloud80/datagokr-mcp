description_portal: '경찰청 생활안전교통국 여성안전기획과에서 제공하는 학대예방경찰관(APO) 운영 현황입니다.경찰청 통계에 따르면 학대예방경찰관(APO) 인력은 2017년부터 2024년까지 총 정원이 거의 변동 없이 유지되는 경향을 보였습니다. 2017년 총 560명으로 시작해 2024년에도 총 560명을 유지했습니다.APO 정원: APO 총 정원은 2018년 587명, 2019년 617명으로 소폭 증가했으나, 2020년부터 2024년까지 620명 수준을 유지했습니다.지역별 규모: 서울(107명), 경기남부(119명), 경북(44명) 지역에 가장 많은 인력이 배치되어 전체 APO 정원의 **43.5%**를 차지했습니다(2024년 기준).변화 추이: 인천은 2017년 18명에서 2024년 35명으로 약 2배 가까이 증가하여 가장 큰 폭의 증가율을 보였습니다. 반면, 부산(42명), 대구(37명), 대전(20명) 등 다수 지역은 2020년 이후 인력 변동 없이 정원을 유지했습니다.'
