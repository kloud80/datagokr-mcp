summary_user: 진주소방서 관할(진주시)에 등록된 소방시설공사업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·주소·업종·분야를 제공한다(csv 약 6.8KB 규모). 진주에서 소방시설 공사를 맡길 업체를 찾거나, 지역 소방공사업체가 업종·분야별로 어떻게 분포하는지 살펴볼 때 쓴다. 전역 조인 키나 업체 고유 코드는 없어서, 다른 데이터와는 상호명이나 주소(시도·시군구) 문자열을 맞춰 붙이거나 같은 기관의 소방 데이터와 나란히 보는 방식으로만 연결한다.
limits: 업체 등록번호 같은 고유 식별자가 없어, 다른 업체 데이터와 정확히 매칭하기 어렵고 상호·주소 문자열 대조에 의존해야 한다. 범위는 진주시 소재 업체에 한정되며, 시공 실적이나 등록 일자는 담겨 있지 않다.
