summary_user: 인천광역시 남동구 안에 있는 이재민 임시거주시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 5.7KB)로, 시설 구분·시설명·상세주소·수용가능면적(㎡)·연락처·내진설계 여부를 기록한다. 재난으로 집을 잃은 주민이나 구호 담당자가 '남동구에서 이재민이 머물 수 있는 시설은 어디이고 몇 ㎡를 수용하며 내진설계가 되어 있는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 대피·구호시설 데이터나 좌표 데이터와는 상세주소·시설명을 맞추는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 인천광역시 남동구 내에 위치한 이재민 임시거주시설에 관한 정보를 포함하고 있습니다. 이 자료는 재난 발생 시 피해를 입은 주민들이 안전하게 임시 거주할 수 있도록 마련된 시설들의 현황을 상세히 제공하며, 연번, 시설 구분, 시설명, 상세 주소, 수용 가능한 면적(m²), 연락처, 내진 설계 여부 등 다양한 항목을 포함하고 있습니다. 이를 통해 재난 대응 기관과 주민들은 임시 거주시설의 위치와 규모, 안전성 여부를 신속하게 파악할 수 있으며, 재난 상황 발생 시 효율적인 대피와 지원이 가능하도록 돕습니다. 또한, 데이터는 주기적으로 갱신되어 최신 정보를 반영합니다.
