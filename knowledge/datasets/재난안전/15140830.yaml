summary_user: 서울 광진구의 민방위 비상급수시설(지하수 관정·비상저수조 등)을 시설 한 곳씩 담은 인허가 원장으로, 인허가일·영업상태·폐업일·소재지 주소·시설구분과 중부원점TM 좌표(XCRD·YCRD)를 포함한다. 주민이나 구청 담당자가 '재난으로 수돗물이 끊기면 우리 동네 어느 급수시설에서 물을 받을 수 있나', '현재 운영 중인 시설은 몇 곳인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 주소·시설명 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 지역 내 민방위사태나 재난 발생 시 식수 공급이 중단될 경우를 대비하여 설치된 비상급수시설에 대한 인허가 정보를 제공합니다.민방위급수시설은 지하수 관정, 비상저수조, 급수탑 등으로 구성되며, 전쟁, 대규모 정전, 수돗물 공급 중단 등 위기상황에서 주민에게 긴급 식수를 공급하기 위해 지정·운영됩니다.데이터에는 시설명, 소재지, 시설유형, 설치일자, 관리주체 등이 포함되며, 이를 통해 지역 내 재난 대비 기반시설 현황 파악, 행정 점검 및 정비 계획 수립, 비상대응 인프라 분석 등에 활용할 수 있습니다.해당 시설은 주기적인 안전점검과 수질검사를 통해 관리되며, 재난 발생 시 주민 대피소 및 주요 생활권과의 거리도 고려하여 배치됩니다.※ 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준의 좌표값만 제공되며, 위도·경도는 포함되지 않습니다.※ 본 데이터는 3일 전 기준으로 최신화된 인허가 현황을 반영합니다.
