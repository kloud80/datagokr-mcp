description_portal: 행정안전부의 지진재해대응시스템 행정구역정보 데이터는 「지진재해대책법」 제1조(목적) 및 제7조(지진가속도계측과 관리) 등 법령에 따라, 지진 진도 분포 및 피해 예측에 필요한 공간정보를 제공합니다. 시·도, 시·군·구, 읍·면·동 단위의 행정구역 코드, 명칭, 위도·경도(최·최대), 평면 직각 좌표계 X·Y, GIS ID 및 상태 정보 등 총 3,558건이 포함되어 있습니다. 이 데이터는 CSV 형식으로 연 1회(최종 등록 2024년 8월 8일, 차기 업데이트 예정 2025년 8월 8일) 입니다. 지진재해대응시스템은 해당 행정구역 정보를 기반으로, 지진 발생 시 각 지역의 진도 및 가속도 분포를 계산하고, 즉시 중앙 및 지방 상황실에 전파해 신속한 대응을 지원합니다. 특히 GIS 공간연계 분석에 필수적인 기초 자료로 활용되며, 정책 수립, 재난 매뉴얼·훈련, 피해 예측, 학술연구, 민간 애플리케이션 개발 등의 목적으로 널리 쓰입니다.
