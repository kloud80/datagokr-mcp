description_portal: 5대 범죄 발생 및 검거 현황 정보는 2020년에서 2024년까지 최근 5년간 발생한 5대 범죄 사건에 대한 연도별, 유형별(발생, 검거) 건수로 구성된 데이터 입니다우리 사회에 심각한 영향을 끼치는 범죄 중 살인, 강도, 성범죄(강간 및 강제추행), 절도, 폭행은 대표적인 강력범죄로 분류되며, 이를 통틀어 "5대 범죄"라고 부릅니다.이 범죄들은 공통적으로 타인의 생명, 신체, 재산에 심대한 위협을 가하고, 사회 질서를 무너뜨리는 특성을 지니고 있기 때문에 대구광역시경찰청에서도 특별한 관심을 갖고 엄중하게 다루고 있으며, 해당 현황은 대구광역시경찰청 수사부 형사과에서 담당하고 있습니다.
