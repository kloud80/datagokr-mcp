summary_user: 전국의 재해위험지역을 지역 한 곳씩 담으며, 지역코드·지역명·대표주소·법정동코드·위경도·지정일자·유형·지정사유·관리기관 정보를 함께 제공한다. 주민이나 부동산·개발 사업자가 '이 동네나 이 땅이 재해위험지역으로 지정됐는지, 언제 무슨 사유로 지정됐는지'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 법정동코드(STDG_CD)나 관리기관코드, 지역명 매핑으로 행정구역 자료나 같은 재난안전 분야의 대피시설·위험지구 자료와 이어 쓰고, 위험지구 위치는 토지 규제 레이어와 겹쳐 본다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 재해위험지역 정보로,  재해위험지역코드, 재해위험지역명, 재해위험지역대표주소, 법정동코드, 위도, 경도, 지정일자등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
