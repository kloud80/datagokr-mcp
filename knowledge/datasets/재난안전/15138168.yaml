summary_user: 한국승강기안전공단에 접수·처리된 승강기 휴지(운행중지) 신청을 건별로 담은 전국 파일 데이터로, 각 행은 승강기관리번호(1·2)와 휴지시작일·휴지종료일로 이루어진다. 건물 관리자나 분석가가 특정 승강기가 언제부터 언제까지 운행을 멈췄는지, 지금도 휴지 상태인지 확인하고 검사·점검 일정을 잡는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 승강기 원장과는 승강기관리번호를 매핑하거나 같은 기관 자료끼리만 연결한다.
description_portal: 한국승강기안전공단이 관리하는 승강기 ‘휴지(운행중지) 신청’ 이력을 정리한 자료입니다. 각 행은 공단 내부 식별을 위한 승강기관리번호(1·2)와 휴지시작일, 휴지종료일(해제일)을 포함합니다. 본 데이터의 목적은 법정 안전관리와 검사 주기 산정, 사용개시·재가동 승인 등 행정 판단을 지원하고, 휴지 장비의 유지관리·점검 계획 수립에 근거를 제공하는 데 있습니다. 범위는 공단에 접수·처리된 휴지 신청 건에 한정되며, 신청 취소·연장·해제 등 상태 변화에 따라 동일 승강기에 복수 이력이 존재할 수 있습니다. 일부 건은 휴지종료일이 공란일 수 있으며 이는 당시 기준으로 휴지 상태가 지속되었음을 의미합니다. 주소·소유자·연락처 등 개인정보는 포함하지 않습니다.
