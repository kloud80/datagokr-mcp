summary_user: 세종특별자치시에 신고된 진단용방사선장비를 장비 단위로 담으며, 신고일자·설치일자, 용도, 형태, 상태, 모델명·형식명, 보유 의료기관명과 종별, 도로명주소를 포함한다. 시민이나 분석가가 "세종시에서 CT·X선 같은 진단용 방사선장비를 보유한 의료기관은 어디이고 언제 설치됐나"를 확인하는 데 쓴다. 전역 조인 키가 없어 의료기관명(mdlcInstNm)이나 도로명주소를 기준으로 다른 의료기관·시설 데이터와 이름·주소 매칭으로 이어 쓴다.
limits: 공통 조인 키가 없어 다른 데이터와 연결할 때는 기관명·주소 매칭에 의존해야 하며 오매칭에 주의한다. 범위는 세종시 한 곳으로 한정되고, 갱신은 이벤트 시 생성되는 방식이어서 최신 신고 현황을 반영하는지 확인이 필요하다. 활용신청 후 serviceKey로 호출하며 개발계정은 일 5,000회로 제한된다.
