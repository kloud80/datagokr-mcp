summary_user: 자전거가 가해자 또는 피해자 차종인 1년간의 교통사고 중, 반경 200m 내 4건 이상(사망 포함 시 3건 이상) 발생한 지점을 다발지역 단위로 담는 API이며, 검증 시 전국 범위에서 3행이 수신됐다. 지자체 도로 안전 담당자나 분석가가 자전거 사고가 잦은 지점이 어디인지 확인하는 질문에 쓴다. 법정동코드(bjd_cd), 시도시군구명(sido_sgg_nm), 경도·위도 좌표(lo_crd, la_crd)로 다른 지역·지도 데이터와 이어 쓰고, 교통사고 다발지역 표준데이터와 같은 개념의 자료로 함께 본다.
description_portal: '자전거 교통사고에 대한 교통사고 다발지역 정보- 대상 사고 : 1년간 발생한 가해자의 차종 또는 피해자의 차종이 자전거인 교통사고- 사고다발지역 선정조건 : 반경 200m 내 대상사고 4건 이상 발생지점(사망사고 포함시 3건 이상)- WMS 형태의 API 정보는 교통사고정보개방시스템(https://opendata.koroad.or.kr/api/sample.do)을 통해 확인하실 수 있습니다.*교통사고분석시스템(https://taas.koroad.or.kr)의 데이터를 기반으로 함'
team:
  dept: AI데이터전략처
services:
  - op: /getRestFrequentzoneBicycle
    name: 자전거사고다발지역정보 Rest 조회
    endpoint: https://apis.data.go.kr/B552061/frequentzoneBicycle/getRestFrequentzoneBicycle
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: searchYearCd
        required: true
        example: '2021'
        desc: 조회하고자 하는 연도값 입력(값 없을 시 공백리턴)
      - name: siDo
        required: true
        example: '11'
        desc: 코드종류 코드값전체 공백시 전체 선택서울특별시 11부산광역시 26대구광역시 27인천광역시 28광주광역시 29대전광역시 30울산광역시 31세종특별자치시 36경기도 41강원도 42충청북도 43충청남도 44전라북도 45전라남도 46경상북도 47경상남도 48제주특별자치도 50
      - name: guGun
        required: true
        example: '110'
        desc: '시도 코드종류 코드값서울특별시 강남구 680 강동구 740 강북구 305 강서구 500 관악구 620 광진구 215 구로구 530 금천구 545 노원구 350 도봉구 320 동대문구 230 동작구 590 마포구 440 서대문구 410 서초구 650 성동구 200 성북구 290 송파구 710 양천구 470 영등포구 560 용산구 170 은평구 380 종로구 '
      - name: type
        required: false
        example: xml
        desc: 결과형식(xml/json)
      - name: numOfRows
        required: true
        example: '10'
        desc: 검색건수
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지 번호
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getWMSFrequentzoneBicycle
    name: 자전거사고다발지역정보 WMS 조회
    endpoint: https://apis.data.go.kr/B552061/frequentzoneBicycle/getWMSFrequentzoneBicycle
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: layers
        required: true
        desc: 레이어를 결정 frebicycle 고정값 사용
      - name: format
        required: true
        desc: 이미지 포맷을 결정 image/png 고정값 사용
      - name: transparent
        required: true
        desc: 이미지의 투영성을 결정 TRUE 고정값 사용
      - name: service
        required: true
        desc: 서비스 형태를 결정 WMS 고정값 사용
      - name: version
        required: true
        desc: 서비스 버전을 결정 1.1.1 고정값 사용
      - name: request
        required: true
        desc: 요청 형태를 결정 GetMap 고정값 사용
      - name: srs
        required: true
        desc: 좌표계를 결정 EPSG:4326 고정값 사용
      - name: bbox
        required: true
        desc: '바운더리박스로 대각선의 좌표를 결정 기본값(전국) : 126.0,33.0,132.0,38.5'
      - name: width
        required: true
        desc: '결과 이미지의 가로 크기를 결정, 기본값 : 512'
      - name: height
        required: true
        desc: '결과 이미지의 세로 크기를 결정, 기본값 : 469'
      - name: searchYearCd
        required: true
        desc: 조회하고자 하는 연도값 입력
      - name: siDo
        required: true
        desc: 법정동 시도 코드
      - name: guGun
        required: true
        desc: 법정동 시군구 코드
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
      - xml
    error_style: http200_body_code
    verified_ok: false
