description_portal: 재난안전통신망은 LTE(Long Term Evolution) 기술을 기반으로 재난관리책임기관(국가위기관리센터, 행정안전부, 지자체, 산림청 등), 긴급구조기관(소방, 경찰, 해양경찰) 및 긴급구조지원기관(군, 의료, 전기, 가스)이 안전관리업무 및 재난현장 지휘 시 음성, 영성, 멀티미디어를 송.수신 할 수 있는 기능을 갖추며, 신속하게 소통하고 현장에 효과적으로 대응하기 위해 사용하는 전국 단일 무선 통신망으로 위기상황에서 여러 기관들이 협력하여 지휘와 통제를 효율적으로 수행할 수 있도록 한국가스공사가 보유 중인 통신망의 단말기 번호를 공공데이터로 공유하여 기관 간 공통 통화그룹 설정 및 긴급통신 등에 활용하고자 함
