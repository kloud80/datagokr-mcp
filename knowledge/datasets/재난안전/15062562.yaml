summary_user: 경상남도 내 산사태취약지역을 지정 건별로 담으며, 시군·읍면동·리·지번 소재지와 취약지역유형, 지정면적(㎡), 지정대피소를 함께 제공한다. 주민이나 지자체 방재 담당자가 "우리 동네 산사태취약지역은 어디이고 위험 시 어느 대피소로 가야 하나"를 확인하는 데 쓴다. 전역 조인 키가 없어 시군명·읍면동·리·지번 같은 이름으로 행정구역 코드나 주소 데이터, 대피소·재해위험지구 등 다른 재난 데이터와 맞춰 연결해야 한다.
description_portal: 경상남도 산사태취약지역 지정현황은 인명 및 재산 피해를 예방하기 위해 산사태 위험도가 높은 지역을 법적으로 지정하여 관리하는 방재 데이터입니다.이 데이터는 경상남도 내 18개 시군구, 읍면동, 리, 지번으로 이어지는 정밀한 소재지 정보와 행정 구분을 명시하여 위험 지역의 위치를 직관적으로 파악할 수 있게 합니다. 또한, 해당 구역이 어떤 위험에 노출되어 있는지 나타내는 취약지역유형과 대피 규모를 산정할 수 있는 지정면적(㎡)을 함께 제공합니다. 특히 재난 발생 시 주민들이 즉각 대피할 수 있는 지정대피소 정보가 매칭되어 있어, 실질적인 인명 구호와 실시간 방재 시스템 구축을 위한 필수적인 안전 지침서 역할을 합니다.
