description_portal: 경상남도경찰청에서는 물놀이 안전 사고 및 불법 촬영, 성범죄 등 휴가철 해수욕장에서 일어나는 각종 사건, 사고를 미연에 방지하고 질서 유지를 위해 여름 경찰 관서를 운영 중입니다. 경상남도경찰청 여름 경찰관서 운영 현황 공공 데이터는 구분, 지역, 장소명, 장소유형, 데이터기준일로 구성되며  해당 데이터에는 여름 경찰관서 현황 번호, 여름 경찰관서 운영 시군구, 여름 경찰관서 운영 장소명, 여름 경찰관서 운영 장소 유형 등의 정보를 담고 있습니다. 여름경찰관서는 6~8월사이 여름 경찰관서 운영이 필요하다고 판단된 경찰관서에 자체적으로 운영중에 있습니다. 최근 2~3년간 경상남도경찰청에서는 여름경찰관서를 운영하지 않고 있습니다.
