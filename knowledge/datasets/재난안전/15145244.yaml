summary_user: 충청남도 논산시 안에 설치된 CCTV를 설치 지점 한 곳씩 담은 건별 원천 파일로, 주소·위도경도와 함께 설치 목적, 카메라 대수·화소수, 촬영 방향, 영상 보관일수, 설치연월, 관리기관을 담는다. 주민이나 분석가가 '우리 동네 골목길에 방범용 CCTV가 어디에 몇 대 있고 영상은 며칠 보관되는가'를 확인하거나 행정동별 감시 공백을 따질 때 쓴다. 전역 조인 키는 없어서 행정동명·주소 문자열이나 위도·경도 좌표로 보안등·안전비상벨·대피시설 같은 다른 안전 인프라 데이터와 공간적으로 맞춰 쓴다.
description_portal: 이 데이터는 충청남도 논산시 내 CCTV 설치 현황을 정리한 자료입니다. 주요 항목에는 행정동명, 도로명 및 지번 주소, 설치 목적, 카메라 대수와 화소수, 촬영 방향 정보, 영상 보관 기간, 설치 연월, 관리기관명 및 전화번호, 위도·경도, 데이터 기준일자가 포함되어 있습니다. 본 자료는 지역 내 공공안전 강화를 위해 설치된 CCTV의 분포와 성능, 관리 현황을 파악하는 데 활용됩니다. 특히 설치 목적과 촬영 방향, 보관 기간 등의 정보는 범죄 예방 및 사건 대응의 효율성 분석에 기초 자료로 쓰이며, 도시 안전 정책과 감시 인프라의 지속적 개선에 기여합니다.
