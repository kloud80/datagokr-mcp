summary_user: 한국승강기안전공단에 등록된 전국 승강기 유지관리업체를 업체 단위로 담은 파일(CSV)로, 업체명·주소·영업상태·종목(설치·보수·유지관리, 주차설비, 기술용역, 제작 등)을 담는다. 건물 관리자나 사업자가 '우리 지역에서 영업 중인 승강기 유지보수 업체가 어디인가'를 찾거나, 분석가가 지역별 업체 분포와 휴·폐업 현황을 살피는 데 쓴다. 전역 조인 키가 없어 다른 승강기 데이터와는 업체명 매칭이나 주소 기반 지역 매핑으로만 연결한다.
description_portal: 본 자료는 한국승강기안전공단에서 관리하는 승강기 유지관리업체 등록 현황을 제공하는 데이터입니다. 승강기 안전관리는 설치 이후 정기적인 유지보수와 관리가 필수적인 분야로, 본 데이터는 전국에서 활동 중인 유지관리업체의 기본 정보를 체계적으로 정리하여 제공합니다. 데이터에는 업체명, 주소, 영업상태, 종목 등이 포함되어 있으며, 업체별로 승강기 설치·보수·유지관리, 주차설비 관리, 기술용역, 제작 등 수행 가능한 업무 분야를 확인할 수 있습니다. 또한 영업 상태 정보를 통해 현재 운영 중인 업체와 휴·폐업 여부를 구분할 수 있어, 승강기 관리 서비스 시장의 현황을 파악하는 데 도움을 줍니다. 주요 업체에는 대형 글로벌 기업과 국내 전문업체들이 함께 포함되어 있으며, 지역별로 분포된 업체 주소를 통해 전국적인 관리체계 현황도 확인할 수 있습니다.
