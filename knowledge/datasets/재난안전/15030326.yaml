description_portal: 경찰청 인사담당관실에서 제공하는 경찰공무원 포상관리 현황 통계는 2001년부터 2021년까지 훈장, 포장, 대통령표창, 행정안전부장관 표창(타부처 포함), 경찰청장 표창, 모범공무원 등 다양한 종류의 포상 수여 현황을 연도별로 보여줍니다(1회성 데이터).전반적으로 경찰청장 표창 수여 건수가 가장 많으며, 대통령표창과 행정안전부장관 표창은 상대적으로 적은 수를 기록하고 있습니다. 훈장과 포장은 매년 꾸준히 수여되고 있습니다. 2021년 이후의 데이터는 포함되지 않았습니다. 이 통계를 통해 경찰공무원 포상 운영 현황과 포상 종류별 수여 비중 변화를 파악하고, 포상 제도의 효율적인 운영 및 개선에 활용할 수 있습니다.
