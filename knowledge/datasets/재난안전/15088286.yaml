description_portal: 마약사범 단속현황에 관한 데이터로(2016~2025년)검거 건수, 검거인원, 구속, 불구속 등에 관한 항목을 제공합니다.본 데이터는 2016년부터 2025년까지 최근 10년간의 마약사범 단속 현황을 종합적으로 제공한다. 주요 항목으로는 연도별 검거 건수, 검거 인원, 구속·불구속 처리 현황 등이 포함되어 있으며, 마약 범죄의 증가·감소 추세를 체계적으로 파악할 수 있도록 구성하였다. 이를 통해 마약류 범죄의 유형별 특징과 단속 성과를 분석하고, 향후 정책 수립 및 수사역량 강화를 위한 기초자료로 활용할 수 있다. 특히 연도 간 비교가 가능하도록 표준화된 지표를 제공하여 현황 진단과 문제점 도출에 유용하게 사용할 수 있다.
