summary_user: 한국가스안전공사가 국내 유통을 허용하도록 심사를 마친 가스제품(가스레인지 등) 해외제조공장의 등록 현황을 공장(업소) 한 건씩 담은 파일로, 등록번호·업소명·최초등록일·만료일·등록종류·제조기준·소재지·국가를 포함한다. 수입업자나 소비자가 특정 해외 가스제품 제조공장이 국내 유통 등록을 마쳤는지, 등록이 언제 만료되는지 확인하는 데 쓰고, 분석가는 국가별 등록 공장 분포를 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·국가 같은 이름 매핑이나 같은 기관 데이터의 등록번호로만 이어 쓴다.
description_portal: '한국가스안전공사에서 관리하는 해외제조공장(가스레인지 등) 중 국내 유통이 가능하도록 심사완료된 업체 현황 데이터 입니다.해당 데이터는 등록번호, 업소명, 최초등록일자, 만료일자, 등록종류, 제조기준, 소재지 및 소재국가 정보를 제공합니다.해외제조공장 등록현황(가스제품분야)을 활용하여 가스 안전 관리 강화 등을 위한 통계 자료, 정책 수립 등에 활용 가능합니다.- 해당데이터는 타 유관기관 또는 민간에서 수집 및 관리하는 정보와는 상이할 수 있습니다.- 해당데이터는 수시성 주기 데이터로 비정기적으로 제공됩니다.- 데이터기준일 : 2025년 9월 30일'
