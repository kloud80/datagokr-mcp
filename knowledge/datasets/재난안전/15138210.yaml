description_portal: 한국승강기안전공단이 수행하는 승강기 안전검사의 지로(GIRO) 입금 상세 처리내역을 정리한 자료입니다. 각 기록은 수납일자, 지로금액, 지로 수수료, 등록일시 등 기본 항목으로 구성되며, 검사 수수료의 지로 수납 처리 흐름을 날짜·금액·수수료 관점에서 확인할 수 있도록 표준화되어 있습니다. 이 자료의 목적은 지로 수납 건의 처리 근거를 일원화해 회계 정산의 정확성을 높이고, 수납 채널 운영의 투명성 및 내부통제 준거성을 확보하는 데 있습니다. 제공 범위는 공단이 접수·처리한 지로 납부 건 중 공개가 가능한 항목에 한하며, 납부자 식별정보(개인·계좌 등)는 포함하지 않습니다. 동일 일자 다건 수납, 정정/취소 후 재등록 등 업무 특성상 유사 내역이 병행 존재할 수 있고, 원장 시스템에는 수납 코드, 사업장/검사유형, 전표번호 등 추가 메타데이터가 별도로 관리될 수 있습니다.
