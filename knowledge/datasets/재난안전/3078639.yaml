description_portal: 부산광역시 서구 관내에서 운영중인 도로조명시설(가로등 및 보안등) 설치 현황을 용량(와트수)별, 종류(나트륨등, 메탈등, LED등)별, 개수별로 구분하여 정리한 데이터입니다.가로등은 50W 이하 ~ 1000W 이하까지, 보안등은 50W 이하 ~ 150W 이하까지 구분되어 있으며, 나트륨등, 메탈등보다는 LED등이 다수 설치되어 있습니다.해당 데이터는 에너지 소비량 추정, 노후등 교체 계획, 유지관리 예산 산정 등 다양한 행정적, 정책적 활용이 가능합니다.또한 LED 도입 현황과 같은 최신 추세를 파악할 수 있어 에너지 절감 효과 분석 및 향후 친환경 조명 확대 전략 수립의 기초 자료로도 활용될 수 있습니다.
