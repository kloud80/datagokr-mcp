summary_user: 승강기 안전검사 접수 건별로 접수일자·접수번호, 검사차수(1차·재검 등), 자체점검자(유지관리업체·관리주체 등)의 현장 입회 여부, 시스템 등록일시를 담은 전국 단위 건별 원천 파일이다. 기간별 자체점검자 입회율이 얼마인지, 재검사 건에서 미입회가 더 잦은지 같은 질문에 공단·지자체 안전관리 담당자와 분석가가 쓴다. 실측 컬럼에 승강기 고유번호 같은 전역 조인 키가 없어, 검사결과·고장·유지관리업체 데이터와는 같은 기관의 접수번호·접수일자를 맞춰 보는 방식으로만 이어 쓴다.
limits: 승강기 고유번호·지역·기관 컬럼이 없어 이 파일만으로는 지역별·설비별 입회율을 내지 못하고, 다른 데이터와 연결하려면 접수번호 기준의 별도 매핑이 필요하다. 동일 접수에 여러 차수가 생길 수 있고 등록일시는 실제 검사일이 아닌 시스템 반영 시점이다.
