summary_user: 경기도 하남시에서 기계설비 성능점검을 받아야 하는 건축물을 한 건물(단지)당 한 행으로 담은 파일로, 용도·건축물명·도로명주소·우편번호·연면적·공동주택 세대수·점검대상 기준을 수록한다. 시설 관리자나 분석가가 '하남시에서 성능점검 대상인 대형 업무시설·공동주택이 어디에 몇 곳 있는가'를 확인하거나 용도별 점검 수요를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 건축물·시설 안전 데이터와는 도로명주소나 건축물명을 맞춰 연결해야 한다.
description_portal: 경기도 하남시 기계설비 성능점검 대상현황에 대한 데이터로 건축물용도, 건축물명, 도로명주소, 우편번호 등의 항목을 제공합니다. 총 259개 대상(건축물명 258종)을 수록했고, 합계 연면적은 약 650만 ㎡입니다. 주 용도 분포는 공동주택 94개(36.3%), 업무시설 56개(21.6%), 교육연구시설 32개(12.4%), 공장 18개(6.9%), 제1종근린생활시설 15개(5.8%) 순입니다. 공동주택은 총 8만2,191세대가 등록되어 1단지 평균 약 874세대 규모입니다. 시설별로는 ‘스타필드 하남’이 연면적 459,518㎡로 최대, 다음은 ‘미사강변 스카이폴리스’ 315,935㎡, ‘하남테크노밸리 U1 Center’ 270,406㎡입니다. 단지당 중앙값 연면적은 약 19,485㎡, 평균은 약 40,374㎡로, 대형 상업·업무시설과 다수의 공동주택이 점검대상군의 중심을 이룹니다. 전체적으로 상업·업무 집적지와 대단지 공동주택에서 점검 수요가 집중되는 구조가 명확합니다.
