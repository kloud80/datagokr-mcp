summary_user: 국토안전관리원이 시설물통합정보관리시스템(FMS)으로 관리하는 공동주택 제외 전국 공공시설물에 대해 시설물별로 이름·구분(교량·터널·옹벽·건축물 등)·소재지·종별(1~3종)·관리주체·취합기관을 한 줄씩 담은 원장형 파일이다. 지자체·공공기관 담당자나 분석가가 '우리 지역의 특정 교량이나 터널은 어느 기관이 관리하고 어디서 취합하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 시설물 안전등급·점검 결과 데이터와는 시설물명·소재지 이름 매칭이나 관리주체 기관명으로만 이어 쓴다.
description_portal: 국토안전관리원에서 시설물의안전관리에 관한 특별법에 근거하여 공공시설물(공동주택 제외) 안전관리부서 현황 데이터를 제공합니다.시설물 종은 1종, 2종, 3종으로 구분되어 있습니다.시설물 구분은 옹벽, 건축물, 교량,  상하수도, 절토사면, 터널, 하천  등 구분되어 있습니다.관리주체와 취합기관의 데이터 칼럼도 명시되어 있습니다.공공시설물의 안전관리를 위한 전담 부서는 시설물별 관리 기관의 소관 부서이며, 상위로는 국토교통부 시설안전과와 행정안전부가 관련 정책 수립 및 관리 감독을 담당합니다. 또한, 공공시설물 안전정보는 국토안전관리원의 시설물통합정보관리시스템(FMS)을 통해 관리하고 있습니다.
