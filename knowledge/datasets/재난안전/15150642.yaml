summary_user: 전국의 가스사고를 사고 한 건 단위로 담는다. 사고번호, 사망·부상자 수, 발생 일자·시간, 주소, 사고 가스 종류, 원인, 사용처, 사고 형태가 들어 있다. 안전 분석가나 지자체 담당자가 '우리 시군구에서 최근 어떤 가스·원인으로 인명피해 사고가 났는가'를 확인하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 법정 시도·시군구·읍면동 코드 필드(STDG_SGG_CD 등)나 주소를 이름·코드 매핑해 다른 지역 통계나 시설 안전 데이터와 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지역별 가스사고 발생건수 정보입니다.
