description_portal: '형식승인 및 성능인증을 득한 소방기기에 대하여 실시하며 형식승인 및 성능인증한 소방기기의 구조, 성능 등과 동일한지 여부를 검사하여 합격표시를 부착하는 제도로서 생산제품검사와 품질제품검사로 구분됩니다. - 생산제품검사: 제조자의 요청에 따라 인증 받은 소방용품의 매 생산 시마다 실시하는 검사 - 품질제품검사: 제조자의 품질관리 수준이 인정되어 자체적으로 수행하는 검사, 정기 품질체계 심사 방염성능검사는 소방법령서 정하고 있는 특정소방대상물(종합병원, 숙박시설 등)에 사용하는 커텐, 카페트 및 실내장식물이 기준에 적합한지 여부를 검사하여 합격표시를 부착하는 제도입니다. 소방용품 생산・품질 제품 검사결과 , 소방용품 KFI제품 검사결과 , 방염성능 검사결과의 통계 데이터를 제공하며 품목구분, 검사개수, 합격, 불합격 데이터를 포함하고 있습니다.'
