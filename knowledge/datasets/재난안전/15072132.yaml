summary_user: 서울특별시 119종합방재전산정보시스템의 소방서 관할 공간정보로, 관할 단위별 이름(FRSTN_NM)과 위경도(WGS1984) 좌표 등을 시도 범위의 개별 위치 단위로 담는다. 특정 주소나 지점이 어느 소방서 관할인지 확인하거나, 소방서별 관할 구역을 지도에 표시해 화재·소방용수 분포를 비교하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 소방서 이름 매핑이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: '119종합방재전산정보시스템의 소방서관할 공간정보로 좌표(위경도)등의 정보를 제공하는 서비스 입니다.※ 서울의 모든 공간정보는 공간정보담당관(2133-2849)을 경유하여 서울 열린데이터 광장에 제공됩니다.※ Shape 파일의 기본 인코딩 셋팅은 UTF-8로 설정되어 있습니다.(ArcGIS 10.2.1 version 기준)※ 제공부서 : 서울특별시 서울종합방재센터 전산통신과(02-726-2282)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
