description_portal: '광주광역시 동부소방서 구급활동 현황입니다.(구급대수, 출동건수, 이송건수, 이송인원, 1일평균, 구급대당 이송인원)동부소방서 관내 119구급대원은 갑작스러운 사고나 질병으로 긴급한 도움을 필요로 하는 시민을 위해 현장으로 달려가 응급처치를 제공하고, 필요 시 병원으로 신속히 이송하는 활동입니다.동부소방서는 광주광역시 동구 및 인근 지역의 구급을 담당하며, 매년 수천 건 이상의 출동을 통해 지역민의 생명과 건강을 지키고 있습니다.주요 출동 유형으로는교통사고 환자 이송: 도심 도로와 교통량이 많은 지역 특성상 교통사고가 발생하면 즉시 출동하여 부상자를 구조·이송합니다.심정지·호흡곤란 등 응급질환: 고령화로 인해 심장질환, 호흡기질환 환자 출동이 꾸준히 증가하는 추세입니다. 현장에서는 심폐소생술(CPR), 자동심장충격기(AED) 등을 즉시 시행합니다.낙상·골절 사고: 주거지, 공사장, 계단 등에서 발생하는 낙상 사고 환자 이송도 빈번합니다.음주·중독 및 자살 시도자 구조: 응급 심리·정신적 위기 환자에 대한 구급활동도 이루어집니다.구급대원은 단순히 환자를 이송하는 데 그치지 않고, 현장에서의 응급처치에 큰 비중을 둡니다. 환자의 호흡과 맥박을 확인하고, 출혈을 지혈하거나 골절 부위를 고정하며, 병원 도착 전까지 환자의 생명을 지탱할 수 있도록 다양한 의료 행위를 시행합니다. 또한, 전문 의료기관과 무전으로 소통하며 환자 상태를 실시간 전달해 치료 연속성을 보장합니다.'
