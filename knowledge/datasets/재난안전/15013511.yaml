description_portal: 충청북도 증평군_지진 시 옥외대피장소 현황 데이터는지진 등 대규모 자연재난 발생 시 주민이 안전하게 대피할 수 있도록 지정된 옥외대피장소의 정보를 제공하는 자료입니다.시설명, 위치(주소), 면적(㎡), 수용가능 인원 등의 항목으로 구성되어 있으며,이는 재난 대응계획 수립, 민방위 교육자료, 지역별 재해취약도 평가, 재난안전 네트워크 설계 등에 폭넓게 활용됩니다.데이터에 수록된 각 대피소는 「자연재해대책법」에 따라 지자체가 지정한 것으로,학교 운동장, 공원, 체육시설 등 넓은 개방 공간을 중심으로 선정됩니다.면적에 따라 수용 가능 인원 산정이 가능하며, 지역 내 인구 대비 대피소 확보율 등 안전복지 인프라 분석 지표로도 사용됩니다.본 자료는 증평군청 및 행정안전부 통합재난안전정보시스템과 연계되어 제공되며,정기점검 및 재지정 여부에 따라 연 1회 이상 갱신됩니다.현장 안내 표지판과 함께 GIS(지리정보시스템)에도 적용 가능하여모바일 대피안내, 재난 문자연계 서비스, 재난 시뮬레이션 지도 제작 등에도 활용됩니다.
