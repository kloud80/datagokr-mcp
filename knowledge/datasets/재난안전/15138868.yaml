summary_user: 전국의 지진 옥외대피장소(운동장·공터 등)를 대피장소 한 곳당 한 건으로 담으며, 대피장소명, 주소, 수용 가능 인원, 면적, 위경도를 제공한다. 지진이 났을 때 우리 동네에서 가장 가까운 야외 대피장소가 어디이고 몇 명을 수용하는지 확인하거나, 지자체·분석가가 지역별 대피 공간이 충분한지 점검하는 데 쓴다. 실측 결과 전역 조인 키는 확인되지 않았으므로, 행정동·법정동 코드로 보이는 필드나 위경도를 이용해 행정구역 코드표, 민방위·해일 대피시설 같은 다른 대피·구호시설 데이터와 이름·코드 매핑 또는 공간 매칭으로 이어 쓴다.
description_portal: 지진발생초기 운동장, 공터 등 구조물 파손 및 낙하물로 부터 안전한 외부대피장소 데이터로, 대피장소명, 지하여부, 위경도값 등을 제공합니다.
