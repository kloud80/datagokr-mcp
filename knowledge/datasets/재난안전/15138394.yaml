description_portal: '본 데이터는 한국승강기안전공단의 승강기 안전인증 체계에서 “인증 대상 품목” 단위를 기준으로 편성한 기본 메타정보입니다. 각 행은 인증품목조합코드와 품목명(예: 일반형, 특수구조)을 핵심 식별자로 사용하며, 해당 품목에 대해 공단에 제출된 서류의 누적 건수(품목제출서류건수)와 세부 유형 분류 건수(품목유형건수)를 제공합니다. 이를 통해 품목별 요구 문서의 양과 세분화 수준을 한눈에 파악할 수 있습니다. 자료의 범위는 안전인증 업무에 공식 등록된 품목에 한정되며, 개별 서류의 제목·내용, 심사 결과(적합/부적합), 시험 수치, 모델·공장 등 다른 엔티티의 상세 정보는 포함하지 않습니다. 동일 코드·품목이 반복 표기된 중복 레코드가 존재할 수 있으며, 이는 집계·정규화 과정에서 제거 또는 병합이 필요합니다. 컬럼 명칭은 내부 표준(인증품목조합코드, 품목명, 품목제출서류건수, 품목유형건수)을 따르며, 수치형 필드는 정수로 관리됩니다.'
