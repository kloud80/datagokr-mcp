description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2013년부터 2024년 11월 30일까지 경찰청에서 수집한 112 신고의 발신 유형별 현황을 제공하는 공공데이터입니다. 신고가 접수된 발신 수단(휴대전화, 유선전화, 공중전화, VoIP 등)별 건수, 연도별 증가·감소 추세, 긴급도별 분류 등이 포함되어 있어 시민의 신고 방식 변화, 통신환경에 따른 대응 효율성, 기술 기반 치안 서비스 개선 방향 등을 분석할 수 있습니다. 이 데이터는 경찰의 신고 대응 시스템 고도화, 긴급신고 인프라 구축, 연구기관의 커뮤니케이션 행태 분석, 공공기관의 재난·치안 대응 매뉴얼 개선 등에 활용됩니다.
