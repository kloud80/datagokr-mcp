summary_user: 전국 112신고 건수를 발신 수단(유선·무선·문자)별로 나눠 연도 단위로 집계한 작은 CSV 파일(390바이트)이며, 포털 설명상 2013년부터 2024년 11월 30일까지를 담는다. 분석가나 연구자가 '휴대전화·문자 신고 비중이 해마다 얼마나 늘고 유선 신고는 얼마나 줄었나' 같은 신고 방식 변화를 볼 때 쓴다. 전역 조인 키가 없고 연도 외에는 이을 기준이 없으므로, 다른 112신고·범죄 통계와는 연도(연도) 기준으로 나란히 비교하는 정도로만 이어 쓴다.
limits: 전국 단위 비공간 집계라 경찰서·시도청·시군구별 신고 현황은 볼 수 없다. 포털 설명에 나오는 공중전화·VoIP 구분이나 긴급도별 분류는 실제 컬럼(연도·유선·무선·문자)에 없다. 포털 설명상 일회성 제공 데이터이다.
