summary_user: 지진조기경보시스템에서 쓰는 해역별 구분코드와 그 위치의 위도·경도를 담은 기준 좌표 목록으로, 경기도가 제공하며 행정단위가 아닌 개별 좌표 단위로 수록된다. 지진 발생 위치가 어느 해역에 해당하는지 확인하거나 해역 구분의 공간 분포를 지도로 그려 보려는 재난안전 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 해역구분코드(ocean_div_cd) 값 매핑이나 위경도 좌표를 기준으로 한 공간 결합으로만 이어 쓴다.
description_portal: 「지진조기경보시스템 해역구분코드」 데이터는 경기도가 제공하는 자료로, 지진 발생 시 신속한 경보 발령을 지원하기 위해 해역별로 부여된 코드와 해당 위치의 위도·경도 좌표 정보를 포함합니다. 본 데이터는 지진조기경보시스템의 기반이 되는 공간 데이터로, 해역 구분코드에 따라 특정 바다 구역을 식별할 수 있으며, 지진파의 탐지 및 신속한 경보 발령을 위한 기초 자료로 활용됩니다. 데이터는 해역구분코드, 위도, 경도 항목으로 구성되며, 이를 통해 지진 감지 지점의 공간적 분포를 분석할 수 있습니다.
