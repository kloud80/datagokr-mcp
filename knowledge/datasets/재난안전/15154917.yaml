description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증 모델에 포함된 구성품목 정보를 정리한 자료입니다. 각 행은 특정 인증 모델이 포함하고 있는 개별 구성품목에 대한 정보를 나타내며, 주요 필드는 ‘안전인증품목분류’, ‘인증품목조합코드’, ‘인증품목명’, ‘모델구성품목조합코드’, ‘모델구성품목’ 등으로 구성되어 있습니다.‘안전인증품목분류’는 전체 품목의 분류 기준을 의미하며, ‘인증품목조합코드’와 ‘인증품목명’을 통해 해당 모델이 어떤 품목군에 속하는지 알 수 있습니다. ‘모델구성품목조합코드’는 구성품목의 조합을 나타내는 코드이며, ‘모델구성품목’은 해당 모델에 포함된 실제 부품 또는 구성요소의 명칭을 의미합니다.이 데이터는 승강기 모델별 구성요소 현황 파악, 품목 간 상호 연관성 분석, 부품 인증 및 검사 계획 수립 등 다양한 기술적·행정적 목적에 활용될 수 있습니다.
