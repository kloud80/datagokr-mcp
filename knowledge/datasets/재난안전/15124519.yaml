status: active
summary_user: 전국 어린이놀이시설을 시설 한 곳 단위로 담은 건별 원천 데이터로, 시설명·지번/도로명 주소·좌표와 설치·폐쇄·인수일자, 설치장소·실내외·민간공공·운영 여부, 우수시설 지정 여부 등을 담는다. 학부모가 우리 동네 근처에서 운영 중인 실내 놀이시설이나 우수시설을 찾을 때, 또는 분석가가 지역별 놀이시설 분포와 폐쇄 현황을 볼 때 쓴다. 전역 조인 키는 없어 주소·좌표나 지역분류코드(rgnCd)로 행정구역·대피시설 등 다른 위치 데이터와 맞춰 쓰며, 같은 주제의 표준데이터(15139210)와 연결된다.
limits: 다른 데이터와 바로 잇는 공통 키가 없어 이름·주소·좌표 매핑으로만 연결된다. 개발계정은 하루 10,000회 호출로 제한된다. 필드명은 경도(latCrtsVl)·위도(lotCrtsVl)로 표기되어 있으므로 실제 값 범위를 확인한 뒤 써야 한다.
