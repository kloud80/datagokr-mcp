summary_user: 2014년 한국전기안전공사가 시도·구군별로 누설 전류 측정 대상 수와 그 결과(적합·부적합)를 집계하고, 측정하지 못한 사유(부재종결·전선고착·집안설치·외함분리불가·기타)별 건수를 함께 담은 지역 집계 파일(csv, 약 8KB)이다. 분석가가 '2014년 어느 시군구에서 누설 전류 부적합 비율이나 부재·설치 위치 때문에 측정하지 못한 비율이 높았나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어서, 다른 지역 통계와는 시도·구군 이름을 행정구역 코드에 직접 매핑해야 이어 쓸 수 있다.
description_portal: 이 데이터는 2014년 지역별(시,도,구,군별)로 누설 전류 측정 결과의 사유에 대한 정보 제공하는 데이터입니다.부재종결(부재중으로 인한 누설 전류 측정을 하지못하고 종결), 측정대상(지역별(시,도,구,군별)로 누설 전류 측정 대상), 적합(누설 전류 측정 결과 적합인 대상)수, 부적합(누설 전류 측정 결과 부적합인 대상) 수, 전선고착(누설 전류 측정 결과 전선고착인 대상) 수, 집안설치(전류측정기기가 집안에 설치되어 있는 대상) 수, 외함분리불가(전류측정기기가 외함분리불가인 대상) 수, 기타(누설 전류 측정의 그외 사유) 수를 확인 할 수 있습니다.
