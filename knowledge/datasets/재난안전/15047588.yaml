summary_user: 충청남도에서 이루어진 생활안전 구조 출동을 유형별 건수로 집계한 통계로, 합계와 벌집제거·동물처리·잠금장치개방·안전조치·피해복구 지원·기타 항목을 시도 단위로 담는다(CSV 178바이트의 작은 파일). 소방 정책 담당자나 분석가가 '충남에서 생활안전 출동 중 벌집제거나 문 개방이 차지하는 비중은 얼마인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 소방·안전 데이터와는 기관명(충청남도)이나 항목 이름을 맞춰서만 이어 쓸 수 있다.
