description_portal: '국토안전관리원이 개방하고 있는 점검진단기관 대행실적 정보입니다. 업체명, 대표자명, 업체 구분, 등록 분야, 실적(보고수,준공액)  등의 정보를 포함하고 있습니다.점검진단기관은 「시설물의 안전 및 유지관리에 관한 특별법」 등 관련 법령에 따라 시설물, 건축물 등의 안전성을 전문적으로 조사하고 평가하여 보수·보강 대책을 제시하는 외부 전문기관입니다.점검진단기관 검색 및 확인 방법점검진단기관의 현황 및 정보는 다음 공식 웹사이트에서 확인할 수 있습니다.건축물 생애이력 관리 시스템: 건축물 점검기관 명부 현황을 검색할 수 있습니다.시설물통합정보시스템(FMS): 안전진단전문기관 현황을 조회할 수 있습니다.국토안전관리원 공공데이터포털: 등록된 안전진단전문기관 목록을 확인할 수 있습니다.'
