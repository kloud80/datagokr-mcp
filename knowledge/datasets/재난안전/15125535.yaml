description_portal: 광주광역시 동구의 기계설비성능점검 대상 건축물 현황 데이터는 지역 내 건축물의 기계설비가 법적 기준에 따라 적정하게 유지·관리되고 있는지를 확인하기 위해 정리된 자료로, 건물의 규모와 성격에 따라 점검 의무가 부과되는 건축물을 구분하는 데 활용됩니다. 이 데이터는 특히 안전관리와 시설 유지의 필수 요소인 기계설비 성능점검의 대상 건축물을 명확히 파악하기 위해 제공됩니다.데이터에는 각 건축물을 식별할 수 있는 건물명과 실제 위치를 확인하는 주소가 포함되어 있습니다. 건축물의 점검 대상 여부를 판단하는 핵심 기준으로는 연면적과 세대수가 제공되는데, 이는 건물의 용도에 따라 다르게 적용됩니다.공동주택일 경우에는 건물의 전체 세대 수가 제공되어, 일정 규모 이상의 공동주택이 기계설비 성능점검 대상인지 판단할 수 있습니다.공동주택이 아닐 경우에는 건물의 연면적이 제공되며, 연면적 기준에 따라 의무 점검 대상 여부가 결정됩니다.이 데이터는 건물의 규모뿐 아니라 용도 특성을 반영해 기계설비의 안전성을 확보하고, 정기 점검 대상 건축물을 효율적으로 관리하는 데 활용됩니다. 동구의 건축물 안전관리 체계를 강화하고, 주민과 이용자의 안전을 확보하는 행정적 기반이 되는 중요한 자료입니다.
