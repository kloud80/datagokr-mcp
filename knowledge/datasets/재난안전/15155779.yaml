summary_user: 소방청이 관리하는 특정소방대상물 중 숙박시설의 건물별 소방시설 정보를 담는 API로, 건축물일련번호·대상물명·주소·사용승인일자와 스프링클러·간이스프링클러·화재조기진압용 스프링클러의 설치 여부를 한 건씩 돌려준다. 지자체 담당자나 분석가가 특정 시도·사용승인연도의 숙박시설에 스프링클러가 설치돼 있는지 점검 대상을 고르는 데 쓴다. 주소(bassAdres, 키 address)로 다른 건축물·화재 발생·소방 관련 데이터와 이어 쓰며, 건축물일련번호는 조인 키로 지정돼 있지 않다.
description_portal: 시도명, 사용승인연도 등 파라미터를 이용하여 소방청 특정소방대상물(숙박시설)의 소방시설(스프링클러) 정보를 조회할 수 있는 서비스입니다.[소방시설(스프링클러)]건축물일련번호, 대상물명, 시도명, 시군구명, 읍면동명, 주소, 사용승인일자, 스프링클러(H)설치여부, 스프링클러(AV)설치여부, 간이스프링클러(H)설치여부, 간이스프링클러(AV)설치여부, 화재조기진압용스프링클러(H)설치여부, 화재조기진압용스프링클러(AV)설치여부[활용방법]지역별 화재위험도 분석, 스마트 소방안전 지도 서비스, 고위험 지역 선제 점검숙박예약 플랫폼 안전정보 제공, 화재 리스크 평가, 점포 화재위험 모니터링지역별 화재 발생 패턴 분석, AI 기반 화재위험 예측모델, 스마트시티 안전 인프라 평가 연구※ 숙박시설의 스프링클러 설치기준ㅇ 2004.05.30.~현재특정소방대상물의 지하층ㆍ무창층(축사는 제외한다.) 또는 층수가 4층 이상인 층으로서 바닥면적이 1천㎡ 이상인 층이 있는 경우에는 해당 층특정소방대상물에 부속된 보일러실 또는 연결통로 등ㅇ 2004.05.30.~2018.06.2611층 이상인 특정소방대상물ㅇ 2018.06.27.~현재6층 이상인 특정소방대상물ㅇ 2022.12.01.~현재숙박시설의 바닥면적의 합계가 600㎡ 이상인 모든 층 ※ 숙박시설의 간이스프링클러 설치기준ㅇ 2013.02.10.~2022.11.30숙박시설 중 생활형 숙박시설로서 해당 용도로 사용되는 바닥면적의 합계가 600㎡ 이상인 것ㅇ 2022.12.01.~현재숙박시설로 사용되는 바닥면적의 합계가 300㎡ 이상 600㎡ 미만인 시설
