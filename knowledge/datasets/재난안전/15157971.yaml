description_portal: 본 데이터는 경찰청 여성청소년범죄수사과에서 관리하는 통계로, 2023년부터 2025년까지 검거된 성폭력범죄 피의자의 직업별 분포 현황을 제공합니다.전문직, 공무원, 서비스직, 학생, 무직 등 다양한 직업군을 세분화하여 연도별 발생 추이를 기록하고 있으며, 사회 각 계층별 범죄 발생 양상을 정량적으로 파악할 수 있는 핵심 지표입니다. 이를 통해 직업군별 맞춤형 범죄 예방 교육 정책을 수립하거나, 특정 집단의 범죄 발생 원인 분석 및 재범 방지 대책 마련을 위한 기초 자료로 활용 가치가 높습니다. 약 3년간의 단기 시계열 자료로서 최신 사회적 변화를 신속하게 파악할 수 있으며, 관련 분야의 학술 연구 및 국가 치안 행정 서비스 개선을 위한 신뢰도 높은 근거 데이터로 권장합니다. 투명한 데이터 개방을 통해 보다 안전한 사회 안전망 구축에 기여하고자 합니다.
