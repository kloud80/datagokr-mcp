summary_user: 전국 도시가스(CNG) 충전소를 한 곳씩 한 행으로 담은 건별 현황 파일이며, 검증 시 192행 전체를 받았고 행정구역·지사·시설명·우편번호·주소·위도·경도 필드가 있다. CNG 차량 운전자나 버스 업계가 가까운 충전소가 어디에 있는지 찾을 때 쓴다. 주소(address)와 위도·경도(coord)가 조인 키라서 지도 좌표나 다른 주소 기반 시설 데이터와 이어 쓰며, 별도의 시설 고유번호 키는 필드에 없다.
limits: 공사가 안전관리 업무용으로 수집한 정보라 다른 유관기관 자료와 다를 수 있다. 위·경도는 2024년부터 추가되었다고 하므로 좌표 활용 시 값이 채워져 있는지 확인해야 한다. 필드 설명과 코드표가 명세에 없어 영업 여부·운영시간·가격 같은 운영 정보는 이 파일로 알 수 없다.
