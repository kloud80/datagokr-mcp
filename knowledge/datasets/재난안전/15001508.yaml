description_portal: '한국가스안전공사에서 관리하는 전국의 도시가스 충전소 현황 정보입니다. 도시가스(CNG)를 연료로 사용하는 자동차의 충전소 운영에 관한 정보를 제공하고 있습니다. 데이터는 충전소 소재 행정구역 및 주소, 시설명, 상세위치(위도, 경도)의 정보를 제공합니다.CNG 차량 운전자 및 버스 업계에 유용한 정보를 제공하기 위해 개방되었습니다.※ 2024년부터 위,경도 정보를 추가하여 업데이트 제공하고 있습니다.※ 해당 데이터는 공사가 안전관리 업무 활용을 위해 수집, 관리하는 정보로, 타 유관기관이 제공하는 정보와 상이할 수 있으니 참고바랍니다.- 데이터기준일 : 2026년 6월 29일'
