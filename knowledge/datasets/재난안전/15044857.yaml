summary_user: 광산구에 지정된 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 8.7KB)로, 구분(시설 종류)·시설명·행정동·도로명주소·1일 생산용량(톤)·지정일자·위도·경도를 담는다. 주민이나 방재 담당자가 '우리 동네에서 비상시 물을 받을 수 있는 급수시설은 어디이고 하루 몇 톤을 공급하나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 행정동 이름이나 주소·좌표(위도·경도)로 맞춰 민방위 대피시설·무더위쉼터 등 다른 대피·구호시설 자료와 함께 지도에 겹쳐 쓴다.
description_portal: 광주광역시 광산구에 설치 되어있는 민방위 급수시설의 현황에 대한 데이터로  시설명,  주소, 생산용량, 지정연도 등의 정보를 제공합니다. 광주광역시 광산구에는 민방위 비상 상황 시 주민의 생활 안정을 위해 설치된 다양한 급수시설이 운영되고 있습니다.구분 항목을 통해 각 시설이 어떤 종류의 구조로 구축되어 있는지 알 수 있으며, 시설명 항목에서는 해당 급수시설이 어떤 명칭으로 지정되었는지 명확히 확인할 수 있습니다. 주소 정보를 통해서는 실제 설치 위치를 지도상에서 정확히 파악할 수 있으며, 긴급 상황 발생 시 효과적인 수요 예측 및 주민 안내 체계를 지원합니다. 생산용량은 해당 시설이 하루 또는 시간 단위로 얼마나 많은 물을 공급할 수 있는지, 즉 방재 대응의 물적 역량을 정량적으로 보여주는 지표입니다.이 데이터는 지역 방재 계획 수립, 비상시 물 공급 효율성 검토, 주민 교육 및 안내 자료 제작, 신규 시설 지정 및 기존 시설 개선 방향을 설정하기 위한 기초 자료로 매우 유용합니다.
