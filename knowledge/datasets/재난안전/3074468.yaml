description_portal: 이 데이터는 경찰청에서 일회성으로 제공하는 피의자 범행 시 성별 정신상태 현황 자료로서, 2018년 범죄 유형별로 남녀 피의자의 정신상태를 상세히 기록하고 있다. 데이터는 구분, 남자정상, 남자정신이상, 남자정신박약, 남자기타정신장애, 남자주취, 남자미상, 여자정상, 여자정신이상, 여자정신박약, 여자기타정신장애, 여자주취, 여자월경시이상, 여자미상 항목으로 구성된다. 이를 통해 피의자 정신상태 및 성별에 따른 범죄 발생 경향을 파악하고, 경찰의 사건 분석 및 대응 전략 수립에 유용하게 활용될 수 있다. 특히 정신장애, 주취, 기타 상태별 범죄 경향을 분석하여 사건 처리의 효율성을 높이고, 범죄 예방 및 국민 안전 확보에 기여할 수 있는 기초자료로 중요하다. 본 데이터는 경찰 및 관련 기관에서 사건 분석, 예방 대책 및 범죄자 지원 정책 마련을 위해 활용할 수 있는 필수 자료이다.
