summary_user: 충청남도 안에 지정된 여성안심지킴이집을 점포 한 곳당 한 행으로 담은 파일로, 점포명·도로명/지번 주소·전화번호·관할경찰서·지정연도·운영여부를 포함한다(csv 약 2.8KB 규모). 귀가길에 불안을 느끼는 여성이나 지자체·경찰 담당자가 '우리 동네 가까운 지킴이집이 어디이고 지금 운영 중인가, 어느 경찰서 관할인가'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서, 시군구코드나 주소·관할경찰서명을 기준으로 CCTV·안전비상벨 등 다른 방범 인프라 데이터나 대피시설 데이터와 이름·코드를 맞춰 붙여 쓴다.
description_portal: 충청남도 내 여성안심지킴이집의 위치와 운영 현황을 제공하는 공공데이터입니다. 점포명, 시도명, 시군구명, 소재지도로주소 등 기본 위치 정보를 통해 도움이 필요한 여성이 가장 가까운 지킴이집을 신속히 찾을 수 있도록 구성되어 있습니다. 또한 여성안심지킴이집 전화번호와 관할경찰서 정보가 함께 제공되어 위기 상황에서 즉시 연락하거나 안전한 보호를 받을 수 있는 연계 체계를 확인할 수 있습니다. 본 데이터는 귀가 중 불안 상황, 범죄 노출 우려 등 위험에 처한 여성이 보호 요청을 할 수 있는 지역 기반 안전망 정보를 제공하며, 지자체와 경찰은 이를 활용해 여성 안전 취약지역 분석, 안전시설 확충, 범죄예방 정책 수립 등에 적극 활용할 수 있습니다.
