summary_user: 광주 남구(현 전남광주통합특별시 남구)에 설치된 보안등을 위치별로 한 행씩 담은 파일로, 위치명·지번주소·위도·경도·설치개수·설치연도·관리기관을 담는다(csv 약 3.8KB). 주민이나 분석가가 '우리 동네 어두운 골목에 보안등이 몇 개, 언제 설치됐나'를 확인하거나 야간 방범 취약지점을 지도로 찾는 데 쓴다. 전역 조인 키는 없어 위도·경도나 지번주소로 CCTV·안전비상벨 같은 다른 방범 시설 데이터와 공간적으로 겹쳐 보는 방식으로 이어 쓴다.
description_portal: 보안등이란 야간에 범죄나 사고가 발생할 염려가 있는 지역에 안전을 위하여 설치하는 등으로, 광주광역시 남구 보안등 정보(보안등 설치 위치 및 소재지, 위도, 경도, 설치개수, 담당 부서 및 연락처 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 도시계획과(☎062-607-3832)에서 합니다.아울러, 현재 해당 데이터는 전국보안등정보표준데이터(https://www.data.go.kr/data/15017320/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다. ※ 보안등은 야간 시간대에 어두운 골목길, 공원, 주택가 등에 설치되어 주민의 안전을 확보하고 범죄를 예방하기 위한 공공 조명 시설입니다. 주로 LED 조명을 사용해 에너지 효율을 높이고, 센서형 점멸기를 통해 자동 점등·소등이 가능하도록 관리됩니다. 해당 데이터는 설치 위치, 수량, 관리기관, 고장 신고 현황 등을 포함하여 지자체가 보안등 유지보수와 신규 설치 계획을 수립하는 데 활용됩니다. 주민은 이를 통해 야간 보행 안전성을 확보하고, 범죄 및 사고 위험을 줄일 수 있습니다. 민간에서는 스마트 조명 시스템 개발, 방범 서비스 플랫폼, 도시 안전 연구 등 다양한 분야에 응용할 수 있으며, 결과적으로 안전한 생활환경 조성과 지역 공동체 신뢰 강화에 기여할 수 있습니다.
