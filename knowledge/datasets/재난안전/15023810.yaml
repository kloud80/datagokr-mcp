summary_user: 광주 북구에 있는 비상급수시설을 시설 한 곳당 한 행으로 담은 CSV 파일이다(약 3.4KB). 시설 구분, 행정동, 시설명, 도로명주소, 종류가 들어 있다. 주민이나 재난 담당자가 단수·재난 때 우리 동네에서 물을 받을 수 있는 가까운 비상급수시설이 어디인지 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 행정동 이름이나 도로명주소를 맞춰 보는 방식으로 연결하고, 다른 대피·구호시설 현황과 동 단위로 함께 본다.
