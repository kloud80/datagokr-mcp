summary_user: 국토안전관리원 시설물통합정보관리시스템에 등록된 제1종·2종 건축물을 시도별, 민간·공공 부문별로 묶은 전국 단위 현황 통계로, 건별 시설물 원장이 아니라 구분명(gbn_nm)별 합계와 항목별 건수를 담는다. 정책 분석가나 연구자가 지역별로 관리 대상 1·2종 건축물이 얼마나 되는지, 민간과 공공 중 어느 쪽이 많은지를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명 같은 이름 매핑이나 같은 기관 데이터의 코드로만 연결한다.
