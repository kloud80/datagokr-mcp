description_portal: '○ 통계개요* 통계명 : 응급처리 교육* 통계종류 : 서울시 응급처리교육을 받은 시민 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 치안·화재·구급구조 등에 대비한 인력·시설 등의 배치 및 운영현황을파악하여, 도시안전망 강화 및 대국민서비스 향상을 위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 소방서 → 서울시 소방재난본부 → 소방방재청, 행정자치부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 응급처리교육 받은 시민비율○ 용어설명○ 기타* 2005년 소방방재청「주요통계 및 자료」, 2007년부터 행정자치부 내고장알리미 참조* 응급처리교육을 받은 시민 비율= {응급처리교육을 받은 시민수 ÷ 주민등록인구(내국인)} × 100- 응급처리교육을 받은 시민수는 소방공무원 및 외래강사에 의하여 심폐소생술 등교육을 받은 시민으로 견학, 출장교육 등을 포함함○ 출 처 : 소방방재청, 행정자치부 내고장알리미'
