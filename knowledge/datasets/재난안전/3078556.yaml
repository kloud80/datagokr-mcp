summary_user: 서울 성북구에서 운영한 여성 안심귀가 스카우트 서비스의 이용 건수를 연도별로 모은 집계 파일로, 포털 설명상 2021~2023년 3개 연도를 시군구 단위로 담는다. 구청 여성안전 담당자나 분석가가 '성북구 안심귀가 서비스 이용이 해마다 늘었나 줄었나'를 확인하거나 서비스 운영 평가 기초자료로 쓴다. 전역 조인 키는 없어서 다른 자치구의 같은 이름 데이터와는 시도명·시군구명·연도 이름을 맞춰 이어 붙여야 한다.
description_portal: 이 데이터는 2021년부터 2023년까지 서울특별시 성북구에서 운영된 여성안심귀가서비스의 연도별 이용 건수를 정리한 자료입니다. 연도별 서비스 이용 횟수와 데이터 기준일이 포함되어 있어 성북구 내 여성안심귀가서비스의 수요 변화와 이용 추세를 파악할 수 있습니다. 본 자료는 여성 안전정책 수립, 귀가 지원 서비스 운영평가, 지역별 안전 인프라 강화 방안 마련 등 다양한 행정·연구 분야에서 활용될 수 있으며, 연도 간 증가·감소 흐름을 통해 여성 안전지원 정책의 효과 분석에도 유용한 기초자료로 활용될 수 있습니다.
