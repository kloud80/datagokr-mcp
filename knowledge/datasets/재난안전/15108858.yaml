description_portal: 본 자료는 생활안전융합데이터 구축을 위해 의왕시 생활안전 관련 예방시설물 정보를 300셀 격자 기반으로 정비한 통계 데이터입니다. 각 격자 내 설치된 CCTV, 보안등, 안전비상벨, 가로등, 미끄럼방지시설, 장애인편의시설 등 생활안전 확보를 위한 예방시설물의 존재 여부 및 분포 특성을 집계하여 제공합니다. 위치기반 개별좌표 대신 격자단위 통계 방식으로 표현함으로써 생활권별 시설물 밀도와 취약지역을 직관적으로 분석할 수 있는 구조이며, 범죄예방·보행안전·약자보호 등 다각적인 생활안전 영역을 파악할 수 있습니다. 2022년 기준 1회성 구축된 자료로 참고용으로 활용하는 것이 적절합니다.
