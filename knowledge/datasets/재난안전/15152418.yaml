summary_user: 65세 이상 노인 대상 범죄가 주의 수준인 구간을 담은 생활안전지도 범죄 위험도 데이터로, 구간별 유형·등급과 시도·시군구 코드, 공간 형상(GEOM) 필드를 가지며 범위는 전국이다. 지자체 안전 담당자나 분석가가 "우리 시군구에서 노인 대상 범죄 주의 등급이 높은 구간은 어디인가"를 확인하고 순찰·안전시설 배치를 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 지역 범죄 통계와는 시도·시군구 코드(STDG_CTPV_CD, STDG_SGG_CD)를 이름·코드 매핑으로 맞추거나 같은 기관의 생활안전지도 레이어와 함께 써야 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 노인(65세 이상)을 대상으로 한 범죄발생현황 관련 정보입니다.
