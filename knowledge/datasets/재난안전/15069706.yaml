summary_user: 한국전기안전공사 전기재해 통계 분석집을 바탕으로 2022~2024년 감전사고 사상자(사망·부상)를 연도·요일별로 집계한 전국 단위 소규모 CSV 파일이다. 감전사고가 주말과 평일 중 어느 요일에 많이 발생하는지, 사망과 부상 비중이 요일에 따라 어떻게 다른지 보려는 안전관리 담당자·분석가가 예방 교육이나 점검 일정을 정할 때 쓴다. 전역 조인 키가 없어 같은 기관의 다른 감전사고 통계(월별·장소별 등)와 연도·구분(사망/부상) 이름을 맞춰 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 한국전기안전공사는 감전재해 감축을 위해 올바른 정책 방향의 기초 데이터를 제시하고 감전 재해의 발생추이를 분석하여 예방 대책을 도출하기 위해 매년 전기재해 통계 분석집을 발간하고 있습니다.관련 근거로는 통계법 제18조와 동법 시행령 제24조, 전기안전관리법 제41조(전기재해 통계의 작성)가 해당됩니다.이 데이터에서는 연도별(2022년 ~ 2024년) 감전 사고에 따른 감전사상자(사망, 부상)를 요일별(일요일, 월요일, 화요일, 수요일, 목요일, 금요일, 토요일)로 제공하는 데이터입니다.
