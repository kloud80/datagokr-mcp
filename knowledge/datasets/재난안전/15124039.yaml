description_portal: '- 전라남도 내 소방관련 법률별 위반 적발건수 및 과태료 부과현황(송치 및 과태료 부과건수, 과태료 부과금액)입니다.- 전라남도는 소방안전 강화를 위해 소방점검 관련 법률 위반 사항에 대해 엄격한 단속과 과태료 부과를 실시하고 있습니다.- 소방점검 관련 법률 위반은 도민의 안전과 직결되는 중요한 사항입니다. 따라서 소방시설의 정기적인 점검과 법정 보고 기한 준수는 필수적이며, 위반 시 과태료 부과 등 행정적 제재를 받을 수 있습니다.- 과태료 부과 기준은 위반의 유형과 정도에 따라 다릅니다. - (주요 위반 사례) 소방시설법 위반 : 소방시설의 설치 및 유지 관리 기준을 위반한 사례로, 소화전의 위치 변경, 소화기 수량 미달 등이 포함됩니다.'
