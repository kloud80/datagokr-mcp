summary_user: 부산 수영구의 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(xlsx)로, 음용수·생활용수 구분, 시설명, 소재지 주소, 하루 양수능력(톤/일)과 그에 따른 급수 가능 인구(1톤당 40명 기준)를 포함한다. 수영구 주민이나 재난 대응 담당자가 단수·재난 때 가까운 비상급수시설이 어디이고 몇 명분의 물을 댈 수 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 대피·구호시설 데이터와는 주소나 시설명을 맞춰 연결해야 한다.
description_portal: 부산광역시 수영구 민방위급수시설 현황 데이터 자료로 민방위급수시설구분, 민방위급수시설, 소재지 주소 정보 등을 포함하고 있습니다.급수시설 구분은 음용수 및 생활용수 구분에 따르며, 각 시설의 양수능력(톤/일)에 따라 양수 가능한 인구수(1톤당 40명)을 반영하였습니다.관련내용은 수영구청 홈페이지 내의 민방위 비상급수시설 목록에서도 찾아볼 수 있으며, 국민재난안전포털에서도 관련 정보 확인이 가능합니다.*정부지원 3개소(망미초등학교(구), 망미초등학교(신), 수영사적공원) 및 지자체 시설 1개소(수영구 스포츠문화타운), 나머지는 공공용 시설(민간시설)
