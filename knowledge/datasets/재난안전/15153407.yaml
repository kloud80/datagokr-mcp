summary_user: 국토안전관리원이 관리하는 전국 항만시설의 안전점검 현황을 시설물 번호(FCLTY_NO) 단위로 담은 원장으로, 시설명·종류·구분, 위치, 준공일, 주요 제원, 상태등급, 최근 점검·진단일과 다음 점검·진단일, 관리주체, 사진 정보를 포함한다. 항만 관리자나 안전 분석가가 "우리 지역 항만시설 중 상태등급이 낮거나 다음 정밀점검이 임박한 시설은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설 안전 데이터와는 시설명·위치 문자열이나 관리기관 이름 매칭으로만 연결한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 국토교통부 국토안전관리원에서 제공하는 항만시설 안전점검 관련 정보입니다.\""
