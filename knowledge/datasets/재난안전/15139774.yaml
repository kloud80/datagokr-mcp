summary_user: 재난안전데이터 공유플랫폼이 제공하는 산행안전지도 정보로, 관리사무소(국문·영문명)와 사이트코드별 취약구간, 취약등급, 위경도 좌표를 구간 단위로 담으며 범위는 전국이다. 등산객이나 산악 안전 담당자가 특정 관리사무소 관할 탐방로에서 취약등급이 높은 구간이 어디인지 확인하는 데 쓴다. 전역 조인 키는 없어서 관리사무소명이나 사이트코드를 이름·코드로 맞추거나, 좌표(LATNLON_XCRD·LATNLON_YCRD)를 기준으로 재난 위험지역·대피시설 데이터와 위치를 겹쳐 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 산행안전지도 정보로, 관리사무소명, 사이트코드, 사이트별취약구간, 취약등급, 위경도X좌표, 위경도Y좌표를 제공하고 있습니다. 데이터의 갱신주기는 월 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
