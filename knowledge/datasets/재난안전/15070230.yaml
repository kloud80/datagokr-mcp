description_portal: 이 공공데이터는 2015년부터 2024년까지 강원특별자치도 내에서 발생한 정보통신망 침해범죄의 연도별 현황을 정리한 자료입니다. 제공 항목은 해킹, 서비스거부(DDoS 등), 악성프로그램 유포, 기타 침해 행위 등으로 구성되어 있으며, 사이버 공간에서의 불법 행위 유형별 발생 건수를 확인할 수 있습니다. 해당 데이터는 정보통신 기반시설 보호와 사이버 보안정책 수립에 필요한 기초자료로 활용되며, 범죄 대응 체계 마련, 지역별 보안 위협 분석, 침해 유형별 대응 전략 수립 등에 유용합니다. 경찰청, 지자체, 정보보안 기관, 연구기관 등에서는 이 데이터를 바탕으로 정보보호 인식 제고와 사이버 안전망 구축에 필요한 정책과 제도를 개발할 수 있습니다.
