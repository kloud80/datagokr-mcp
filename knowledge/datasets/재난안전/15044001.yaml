summary_user: 전국 노유자시설(노인·유아 등 취약계층 이용 시설)에서 난 화재 건수를 시도·시군구 지역별로 집계한 파일로, 포털 설명상 2008~2017년 10년간을 대상으로 합니다. 소방·복지 담당자나 분석가가 '노유자시설 화재가 어느 지역에 몰려 있었나'를 확인하는 데 씁니다. 행정구역 코드 같은 공통 조인 키는 없어, 다른 소방·인구 통계와는 시도명·시군구명을 이름으로 맞춰 연결합니다.
description_portal: '해당 데이터는 2008년부터 2017년까지 10년간 전국 노유자시설(노인·유아 등 사회적 약자가 이용하는 시설)의 화재 발생 현황을 시·도 및 시·군·구 단위로 집계한 자료입니다.데이터 항목은 시도명(화재 발생이 기록된 광역 단위(강원도, 경기도 등)), 시군구명( 시·군·구 행정단위(예: 고양시 덕양구, 철원군 등)), 화재발생건(해당 지역에서 집계된 노유자시설 화재 발생 건수) 등으로 구성 되어 있습니다. 이 데이터는 일반 건축물 화재와 달리 취약계층이 이용하는 노유자시설에서 발생한 화재의 분포와 빈도를 파악할 수 있습니다.'
