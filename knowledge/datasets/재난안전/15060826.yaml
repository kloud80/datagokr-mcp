summary_user: 부산광역시 서구 관내 급경사지를 한 곳당 한 행으로 담은 현황 파일로, 읍면동·지번 위치, 관리기관, 공공·민간 구분, 위험등급, 붕괴위험지역 지정 여부와 지정일, 주변 용도·구조·유형, 소관부서를 담는다(포털 설명상 69개소). 주민이나 부동산 사업자가 '우리 동네 이 지번 근처 급경사지가 붕괴위험지역으로 지정됐는지, 위험등급은 몇인지'를 확인하거나, 분석가가 구 단위 급경사지 위험도 분포를 볼 때 쓴다. 전역 조인 키나 코드표는 없어 읍면동·지번 문자열을 주소·필지 데이터와 맞추거나 같은 기관의 재해위험지구·대피시설 자료와 이름으로 이어 쓴다.
description_portal: 부산광역시 서구 관내 급경사지(69개소)에 대한 종합 현황 자료로서, 각 급경사지의 정확한 위치, 관리기관, 위험등급, 붕괴위험지역 지정 여부 및 지정일 등 기본 정보를 포함하고 있습니다. 또한 급경사지 주변의 건물 용도, 이용 현황, 급경사지의 형태 및 유형별 분류, 관리 및 점검을 담당하는 소관 부서 등의 세부 정보까지 포함되어 있습니다. 이 자료는 급경사지의 안전관리와 유지보수, 재해 예방, 사면 안정성 확보를 위한 보강계획 수립, 정밀점검 및 정비사업 추진, 위험도 평가, 정책 결정, 재난예방대책 마련 등 각종 행정업무의 기초자료로 활용할 수 있으며, 향후 체계적이고 효율적인 급경사지 관리체계 구축에도 도움이 될 것입니다.
