summary_user: 경찰청 유실물 통합포털에 등록된 습득 휴대폰을 물건 한 건 단위로 담는 실시간 원장 API로, 전국 76,604건(2020-11-01~2026-10-01)을 조회한다. 휴대폰을 잃어버린 사람이 내 폰이 습득물로 등록됐는지 찾는 질문에 쓴다. 필드 명세에 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 경찰청 범죄예방정책과에서 제공하는 핸드폰 찾기 정보 조회 서비스는 경찰청 홈페이지를 통해 분실한 스마트폰을 포함한 휴대폰 정보를 검색할 수 있도록 지원합니다. 사용자는 분실한 핸드폰의 모델, 습득된 지역, 그리고 습득 기간 등의 정보를 활용하여 습득 여부를 확인할 수 있습니다.또한, 습득된 핸드폰의 상세 정보를 조회하는 기능을 통해, 분실자는 습득된 기기의 외관이나 특징 등을 확인하여 자신의 폰인지 판단하는 데 도움을 받을 수 있습니다. 이 서비스는 분실된 핸드폰의 신속한 반환을 돕고, 개인 정보 유출 등의 추가적인 피해를 예방하는 데 기여할 것으로 기대됩니다. 분실자는 경찰청 홈페이지를 통해 간편하게 자신의 핸드폰 습득 정보를 확인할 수 있습니다.
