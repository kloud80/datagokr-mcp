summary_user: 인천광역시경찰청 관할 경찰서 10곳(중부·미추홀·남동·부평·서부·계양·강화·연수·삼산·논현)별로 살인·강도·강간·절도·폭력 5대 범죄 유형의 112 신고 건수를 담은 집계표이며, 행은 범죄 유형(구분), 열은 경찰서로 펼쳐진 266바이트 분량의 작은 CSV 파일이다. 지역 치안을 분석하는 사람이 '인천에서 절도·폭력 112 신고가 가장 많이 들어오는 경찰서는 어디인가'처럼 관서 간 신고 양상과 치안 수요를 비교할 때 쓴다. 전역 조인 키나 기관·행정 코드가 없어서, 다른 경찰서 단위 범죄 발생·검거 통계나 경찰관서 위치 데이터와는 경찰서 이름을 직접 맞춰 이어 써야 한다.
description_portal: 인천광역시경찰청에 접수된 112 전화 신고 건수 데이터를 기반으로, 각 경찰서별로 살인, 강도, 강간, 절도, 폭력 등 5대 범죄 유형별 신고 건수를 상세히 제공합니다.이 데이터는 인천 지역 내 경찰서별로 발생한 주요 범죄에 대한 112 신고 현황을 파악할 수 있도록 구성되어 있으며, 범죄 유형별로 신고 건수의 분포와 추이를 분석하는 데 활용할 수 있습니다.이를 통해 각 경찰서의 범죄 신고 양상과 치안 수요를 비교하거나, 특정 범죄 유형의 신고 증가·감소 추세를 확인할 수 있습니다.데이터는 연간 단위로 갱신되며, 인천광역시 내 치안 상황을 종합적으로 분석하는 데 중요한 자료로 활용됩니다
