description_portal: 이 데이터는 일회성으로 제공하는 데이터로  2017년부터 2023년까지 경찰청이 집계한 전국 시도경찰청별 족적 검색 처리 현황을 제공하는 공공데이터입니다. 범죄 현장에서 확보된 족적(신발 자국 등)에 대한 분석·검색 처리 건수를 연도별, 지역별로 구분해 제공하며, 과학수사 분야에서 족적 자료의 활용 현황과 증거물 처리 실적을 확인할 수 있습니다. 이 데이터는 경찰의 과학수사 장비 투자 계획, 족적 감정 인력 배치, 연구기관의 족윤적 데이터 분석, 공공기관의 증거 기반 수사 정책 설계 등에 폭넓게 활용됩니다.
