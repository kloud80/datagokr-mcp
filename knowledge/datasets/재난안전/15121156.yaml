summary_user: 부산광역시가 관리하는 소화전 등 소방용수 시설을 한 건씩 담은 위치 원장으로, 시설 종별·배관구경·수압·지하 여부·사용 여부와 시·구·동 코드, 번지, 인근 건물까지의 거리를 읍면동 단위로 기록한 CSV 파일이다. 소방·방재 담당자나 분석가가 '우리 동네 화재 시 가까운 소화전이 있는지, 수압과 구경은 충분한지'를 점검하거나 소방용수 공백 지역을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시·구·동 코드나 번지 같은 이름·코드 매핑, 또는 같은 기관의 센터 ID로만 이어 쓴다.
limits: 표준 행정코드나 좌표 같은 전역 조인 키가 확인되지 않아 다른 기관 데이터와 바로 결합하기 어렵고, 주소·코드 매핑을 따로 해야 한다. 범위는 부산광역시 한 곳이며 읍면동 단위까지만 다룬다.
