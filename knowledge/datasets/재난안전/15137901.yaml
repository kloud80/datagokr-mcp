description_portal: 본 자료는 한국승강기안전공단에서 사용 중인 ERP(전사적 자원관리) 시스템 내 근태 코드 매핑 현황을 정리한 데이터입니다. 공단은 검사, 기술용역, 특별점검, 사무, 교육 등 다양한 업무 유형을 수행하는 과정에서 근무 및 휴무 형태를 체계적으로 관리하기 위해 ERP 시스템을 활용하고 있으며, 본 데이터는 그 구체적인 근태 코드와 매핑 정보를 제공합니다. 주요 항목에는 업무명, 근무 여부, 휴일근무 여부, 기초 MD(근무시간 단위), ERP 코드, ERP 근무명 등이 포함되어 있습니다. 예를 들어 정상근무, 국내출장, 국외출장, 연가, 대체휴무, 특별휴가, 병가, 무단결근, 휴직 등 다양한 근태 상황이 ERP 코드와 함께 매핑되어 있어 조직 내 인력 관리와 근무현황 분석에 유용합니다.
