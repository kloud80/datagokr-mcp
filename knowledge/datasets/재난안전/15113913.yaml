summary_user: 경기도 평택시에 지정된 수해대피소를 시설 한 곳당 한 행으로 담은 CSV 파일로, 구분·시설명·주소·위도·경도·면적(제곱미터)·수용 인원·기준일자를 제공한다. 평택시 주민이나 재난 대응 담당자가 '침수 위험이 있을 때 우리 동네에서 가장 가까운 대피소는 어디이고 몇 명까지 수용하나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 대피·구호시설 데이터나 재난 위험지역 데이터와는 주소나 위도·경도 좌표 기준의 공간 결합, 또는 시설명 매칭으로 이어 쓴다.
description_portal: '경기도 평택시_수해대피소경기도 평택시 내 소재한 수해대피소에 대한 데이터로 구분, 시설명, 주소, 위도, 경도, 면적, 수용(명)을 제공합니다.대피소는 주로 학교, 경로당, 주민센터 등 안전한 장소에 지정됩니다. 또한, 지하철역, 백화점 등 대형 빌딩의 지하연결도로도 대피소로 활용될 수 있습니다. 비상 시 중요한 피난처 역할을 하며, 상승하는 수위로부터 안전을 제공하고 개인을 보호합니다. 1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 안전총괄과(031-8024-4921)'
