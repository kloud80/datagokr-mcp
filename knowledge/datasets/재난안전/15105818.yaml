description_portal: 특별사법경찰관 제도는 사회발전으로 범죄수사의 전문성이 요구됨에 따라 전문성을 갖춘 공무원에게 전문성을 요하는 특별법규 위반자에 대한 사법경찰권을 부여하는 제도로 1956년도부터 시행되어 특별사법경찰의 지명 및 직무범위가 지속적으로 확대되고 있음. 형사소송법 제245조의10 제1항 및 사법경찰관리의 직무를 수행할 자와 그 직무범위에 관한 법률 제5조에 따라 시민생활과 밀접한 식품, 공중위생, 환경, 원산지, 교통(자동차) 등의 업무를 종사하는 공무원을 대상으로 소속 관서의  장의 제청에 의하여 관할 지방검찰청검사장이 지명하는 사항임.
