summary_user: 부산광역시에 등록된 소방시설업체를 업체 한 곳당 한 행으로 담은 원천 목록으로, 업체명·업종구분·위치·등록구분·연락처를 담는다(CSV 파일 약 80KB). 건물주나 관리자가 부산에서 소방시설 설계·공사·점검을 맡길 등록업체를 찾을 때, 분석가가 업종별·지역별 업체 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명이나 위치(주소) 문자열을 맞춰 이어 써야 한다.
description_portal: 부산광역시 소방시설업 현황에 대한 데이터로  번호, 업체명, 업체구분, 위치, 등록구분, 연락처 항목정보를 제공합니다.소방시설업은 화재 예방과 진압, 인명 보호를 위해 건축물이나 시설에 소방 관련 설비를 설계·시공·점검·정비하는 업종을 말합니다. 「소방시설공사업법」에 따라 등록·관리되며, 전문적인 기술과 자격을 갖춘 업체만이 수행할 수 있습니다.소방시설업은 소방시설설계업, 소방시설공사업, 소방시설관리업, 소방시설감리업 등의 업종이 있으며 생명과 재산 보호를 위해 중요성이 크다 할 수 있습니다.
