description_portal: 본 데이터는 경찰청이 집계한 2018~2025년 경비원 연령별 현황으로, 연도별 전체 인원을 20대 미만, 20~29세, 30~39세, 40~49세, 50~59세, 60~69세, 70대 이상으로 구분해 제공합니다. 전체 인원은 2018년 158,020명에서 2025년 214,833명으로 약 36% 증가했습니다. 60~69세가 모든 연도에서 가장 큰 비중을 차지하며, 70대 이상도 지속적으로 증가해 경비업 종사자의 고령화 경향이 뚜렷합니다. 반면 20대는 2018년 대비 감소했으나 2025년에는 소폭 반등했고, 30대와 40대도 최근 증가세를 보입니다. 연령대별 증감률·구성비·연평균 증가율 분석, 고령자 고용 추이 파악, 경비인력 수급 및 관련 정책 수립을 위한 기초자료로 활용할 수 있습니다.
