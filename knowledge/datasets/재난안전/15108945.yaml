summary_user: 대전광역시 유성구 관내 CCTV를 설치 지점별로 한 행씩 담은 원천 파일이며, 검증 때 받은 672행이 전체 건수와 같다. 유성구 주민이나 분석가가 동네별로 방범 CCTV가 어디에 몇 대 있는지, 카메라대수·설치위치로 확인하는 질문에 쓴다. 위도·경도 좌표, 시도코드, 법정동코드(bjd_cd)로 다른 지리·행정 데이터와 이어 쓰며, 같은 부문의 안전비상벨·안심지킴이집 같은 방범 인프라 데이터와 겹쳐 볼 수 있다.
description_portal: '대전광역시 유성구 CCTV 설치 현황에 대한 데이터를 제공합니다.해당 데이터는 관리번호, 유형, 카메라대수, 설치위치, 위도, 경도, 시도이름, 시군구 이름, 행정동이름, 법정동이름, 기준일자 등의 항목을 포함하여 총 672행으로 구성되어 있습니다.해당 데이터를 활용하여 지역별 안전 인프라와 방범환경을 분석하는 데 활용할 수 있습니다.또한 생활안전 및 범죄예방 환경 조성 등에 활용 가능합니다.이 외에도 생활안전 정보 서비스 개발, 시각화 콘텐츠 제작 등 다양한 분야에 활용할 수 있습니다.사용좌표계: EPSG 2097'
