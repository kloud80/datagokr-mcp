summary_user: 수난사고 실종자를 24시간 이내에 발견하지 못한 구조 출동을 건별로 담은 원천 파일로, 전국 349건(2012-12-04~2023-06-27)이다. 분석가나 안전 담당자가 어떤 하천·해안 지점, 수위·유속·수온 조건에서 초기 수색이 실패하기 쉬운지 확인하는 데 쓴다. 이어 쓸 키는 주소(address)뿐이고 사고지점·발견지점 좌표와 시도·시군구 필드로 지역 단위 사고 데이터와 맞춰 볼 수 있으나, 코드표 기반 조인 키는 없다.
description_portal: “수난사고 실종자 24시간 이내 미발견 구조 현황” 데이터는 하천, 호수, 해안 등 수상(水上) 환경에서 발생한 각종 수난사고 중 사고 발생 후 24시간 이내에 실종자를 발견하지 못한 사례를 집계한 통계자료입니다. 이 데이터에는 연도별·지역별 사고 건수, 미발견 인원 수, 사고 유형(익수, 선박 전복, 추락 등), 발생 시간대, 구조 활동 투입 인력 및 장비 현황 등이 포함됩니다. 이를 통해 초기 수색 단계에서 구조 성공률이 낮은 요인을 분석할 수 있으며, 시간 경과에 따른 구조 한계와 위험성을 객관적으로 보여줍니다. 또한 해당 자료는 수난사고 대응 전략 수립, 구조 장비 보강, 전문 인력 확충, 드론·수중탐지기 등 신기술 도입 필요성 검토에 중요한 기초자료로 활용됩니다. 나아가 계절·지역별 사고 특성을 반영한 맞춤형 안전대책 마련과 수난사고 예방 정책 수립에도 기여할 수 있습니다.
