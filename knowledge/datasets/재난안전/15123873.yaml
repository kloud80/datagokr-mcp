summary_user: 경상북도 영양군 관할 산사태취약지역을 필지(지번) 단위로 한 줄씩 담은 원천 목록으로, 읍면동·리·지번·지목, 위도·경도, 지정 사유와 목적, 공유·사유지 구분을 담는다(CSV 약 42KB). 영양군 주민이나 방재 담당자가 '우리 마을 근처 어느 지번이 산사태취약지역으로 지정됐고 사유지인지'를 확인하거나, 집중호우 전 사전 점검 대상지를 고르는 데 쓴다. 전역 조인 키가 없어 행정구역 이름·지번으로 맞추거나 위도·경도 좌표로 대피소·급경사지 등 다른 재난·위험지역 레이어와 공간 결합해 쓴다.
description_portal: 이 데이터는 경상북도 영양군 관할 내 산사태 우려가 높은 지역을 체계적으로 관리하기 위해 수집된 산사태취약지역 정보를 담고 있습니다. 시도, 시군구, 읍면동, 리, 지번 등의 행정구역 정보를 포함하며, 각 지점의 정확한 위도·경도 좌표를 통해 위치 기반의 분석이 가능합니다. 지정 사유 및 목적은 해당 지역이 취약지역으로 판단된 배경이나 방재 목적 등을 간략히 기술하고 있으며, 소유지구분은 공공 또는 사유지를 구분하는 항목입니다. 이 데이터는 재해 예방 대책 수립, 사전 점검 대상지 선정, GIS 기반 위험도 분석 등에 활용할 수 있으며, 데이터기준일자를 통해 최신 정보 반영 여부를 확인할 수 있습니다. 기후변화로 인한 집중호우 증가에 대비하여 선제적 대응과 예산 우선순위 결정에 필수적인 기초 자료입니다.
