description_portal: 본 자료는 수상레저 활동과 관련하여 발생한 인명피해 사고의 현황을 원인별로 구분하여 정리한 데이터입니다. 2015년부터 2024년까지 최근 10년간의 연도별 추이를 담고 있으며, 각 연도별로 어떠한 원인으로 사고가 발생했는지를 체계적으로 비교할 수 있도록 구성되어 있습니다. 주요 구분 항목은 운항부주의, 무리한 운항, 엔진 정비불량, 선체결함, 조종미숙, 기타 등으로 세분화되어 있어 사고의 직접적 원인뿐 아니라 관리상 미흡한 부분까지 확인할 수 있습니다. 이를 통해 특정 원인에 따른 사고 발생의 증가·감소 추이를 파악하고, 재발 방지를 위한 예방대책 수립에 근거 자료로 활용할 수 있습니다. 나아가 수상레저 안전정책 개선, 이용자 안전교육 강화, 장비 관리체계 확립 등 실질적 대책 마련을 위한 기초자료로 중요한 의미를 가집니다.
