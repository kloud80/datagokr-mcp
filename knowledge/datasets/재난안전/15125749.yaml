description_portal: 서울시 풍수해 대피경로 공간정보 데이터는 풍수해 발생 시 시민들이 안전한 장소로 신속하게 이동할 수 있도록 대피경로를 공간정보 형태로 제공하는 자료입니다. 공간id와 일련번호를 통해 각 대피경로 객체를 식별하며, 좌표 정보는 GRS80 타원체 기반의 한국 중부원점에서 Y축으로 600000미터를 이동시킨 EPSG:5186 좌표계를 사용합니다. 이는 국가공간정보체계에서 사용하는 표준 좌표계로, 다른 공간데이터와의 연계·분석이 용이합니다. 인코딩은 windows-949를 사용하므로 데이터 활용 시 문자셋 설정에 유의해야 합니다. 이 데이터는 지도 서비스와 연계한 풍수해 대피경로 시각화, 위험지역 인근 대피 동선 분석, 재난 대응 시나리오 수립 등 재난안전 정책과 실무에 활용할 수 있는 중요한 기초 공간정보입니다.
