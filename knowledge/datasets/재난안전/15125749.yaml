summary_user: 서울시 풍수해 발생 시 안전한 장소로 이동하는 대피경로를 공간정보 객체 단위로 담으며, 각 경로는 공간ID(SPACE_id)와 일련번호로 식별되고 좌표는 EPSG:5186(GRS80 중부원점) 기준입니다. 재난안전 담당자나 분석가가 침수 위험지역 인근에서 시민이 어떤 동선으로 대피하는지 지도에 표시하고 대응 시나리오를 세울 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 같은 좌표계로 대피소·위험지역 공간데이터와 겹쳐 보거나 이름·기관 기준으로만 연결한다.
