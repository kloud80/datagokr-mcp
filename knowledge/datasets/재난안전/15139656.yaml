summary_user: 전국 산사태 우려지역을 관리번호별 한 건씩 담은 원천 목록으로, 지구명·속칭명·법정동코드·상세주소·위험등급·고시일자와 예상 피해(세대·인명·건물 수), 대피장소명·연락처를 담는다. 지자체 방재 담당자나 주민이 '우리 동네 산사태 우려지역이 어디이고, 위험등급과 대피장소는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 법정동코드(STDG_CD)나 주소 같은 이름·코드 매핑으로 행정구역 자료나 대피·구호시설, 재난 위험지역 데이터와 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 산사태 우려지역 정보로, 지구명, 속칭명, 산림소유구분코드, 법정동코드, 상세주소, 위험등급코드, 고시일자, 대피장소명 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
