summary_user: 한국가스기술공사 지사(사업장)별로 무재해 안전문화 운동의 개시일자, 누적 달성일수, 달성실적, 달성일자를 담은 674바이트짜리 소규모 CSV 파일로, 포털 설명상 14개 지사를 다룬다. 공사 안전관리 담당자나 산업안전 분석가가 '어느 지사가 재해 없이 가장 오래 운영 중이고 언제 다시 개시했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명을 이름으로 맞추거나 같은 기관 데이터끼리만 연결한다.
description_portal: 한국가스기술공사는 사업주와 근로자가 다같이 참여하는 자율적인 산업재해 예방 운동으로 무재해 달성을 위해 안전문화 운동을 실시하고 있습니다. CSV 파일에는 한국가스기술공사 14개 지사의 안전문화 운동 개시 일자, 누적 달성 일수, 달성 실적, 달성 일자가 기재되어 있습니다.안전문화운동 추진 중 재개시하는 경우는 재해가 발생하는 경우로서 업무상 사고는 재해가 발생한 날의 다음날부터, 업무상 질병은 근로복지공단의 최초 요양 승인일의 다음날부터 다시 개시하여 안전문화운동을 통한 안전문화 의식 고취와 산업재해 근절으로 안전한 사업장 조성에 만전을 기하고 있습니다.
