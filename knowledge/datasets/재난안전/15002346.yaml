summary_user: 한국전기안전공사가 국가보훈부 명단을 받아 한국전쟁 참전유공자에게 제공한 전기안전서비스 실적을 연도별로 담은 전국 단위 집계 파일로, 2016~2023년의 대상·실시 건수와 부재·이사·입원·사망·거부·기타 사유별 미실시 건수가 들어 있습니다(csv 385바이트). 보훈·복지 분석가가 "참전유공자 전기안전점검 실시율이 해마다 어떻게 변했고, 미실시 사유 중 사망·입원 비중이 늘었는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 연도(연도) 기준으로 국가보훈부의 참전유공자 현황 통계 등 다른 연도별 집계와 나란히 놓아 비교하는 방식으로만 이어 쓴다.
limits: 전국 합계만 있어 지역·사업소별 실적이나 개별 가구·설비 단위 점검 결과는 알 수 없습니다. 시설 고유번호 같은 키가 없어 시설 안전 원장류 데이터와 건별로 연결되지 않습니다.
