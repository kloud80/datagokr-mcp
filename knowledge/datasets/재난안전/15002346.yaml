description_portal: 한국전기안전공사에서는 국가를 위해 희생하고 헌신한 국가유공자 대상 전기안전점검 및 노후, 부적합 전기설비를 개선 업무를 진행하고 있습니다.국가보훈부와 체결한 참전유공자 전기안전서비스 자원협약 관련 매년 참전유공자 지원 명단을 국가보훈부에서 회신받아 한국전기안전공사 전국 사업소에서 서비스를 지원합니다.이 데이터는 2016년부터 2023년까지 한국전기안전공사에서 한국전쟁 참전유공자 전기안전서비스 지원 내역을  대상건수, 실시건수, 미실시(부재, 이사, 입원, 사망, 거부, 기타 )건수를 제공하는 데이터입니다.
