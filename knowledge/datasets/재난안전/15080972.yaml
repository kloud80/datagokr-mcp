summary_user: 세종특별자치시 화재 신고를 고층건물·주택·차량·산불·지하화재 등 종별로 나누어 담은 CSV 파일(약 32KB)이며, 필드 구성상 신고 한 건마다 접수일시, 접수경로, 긴급구조 종별·분류·규모, 동·리·도로명, 관할 소방서·센터, 상황종료일시를 기록한다. 세종시에서 어떤 유형의 화재 신고가 어느 동네와 어느 시기에 많은지, 신고 접수부터 상황 종료까지 얼마나 걸리는지를 따지는 분석가나 지역 안전 담당자가 쓴다. 전역 조인 키는 없어서 우편번호·동명·도로명 같은 주소 이름이나 관할서명을 맞춰 다른 소방·주소 데이터와 이어 쓴다.
description_portal: “세종시 화재종별 신고” 데이터는 세종특별자치시에서 발생한 화재 사건을 유형별로 분류하여 집계한 신고 현황 자료입니다. 이 데이터에는 특정 기간 동안 발생한 화재를  고층건물(3층이상, 아파트), 기타화재, 기타화재(속보설비), 대형화재(시장, 공장), 산불, 일반화재(주택), 일반화재(차량),  지하화재 등으로 나눈 신고 건수가 기록되며, 화재 발생 장소와 원인별 특성도 함께 파악할 수 있습니다. 이를 통해 세종시 내에서 어떤 유형의 화재가 빈번하게 발생하는지, 계절이나 사회적 환경에 따라 화재 양상이 어떻게 달라지는지 추적할 수 있습니다. 또한 연도별·종별 신고 추이를 분석 가능 합니다.
