summary_user: 소방용품 형식승인·성능인증 대상과 KFI 인증 대상 품목을 기술기준 구분·품목분류·품목명 단위로 정리한 전국 단위 목록으로, 4.8KB 남짓의 작은 CSV 파일입니다. 소방용품 제조·수입 사업자가 자기 제품이 형식승인·성능인증·KFI 인증 중 어느 기술기준의 대상 품목인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명 같은 이름 매칭이나 같은 기관(한국소방산업기술원)의 다른 데이터를 통해서만 이어 쓴다.
description_portal: 소방시설 설치 및 관리에 관한 법률 및 소방용품의 품질관리 등에 관한 규칙 등에서 정하는 소방용품의 형상, 구조, 재질 성분 및 성능 등이 기준에 적합한지 여부를 검사하여 시험하고 승인하는 형식승인, 성능인증 대상 품목을 제공합니다.화재의 예방, 구조 구급 등에 사용되는 제품 중 소방관련 법령에 정한 이외의 제품 등에 대해 성능을 인정하는 KFI 인증 대상 품목을 제공합니다.데이터는 기술기준 구분, 품목분류, 품목명 등을 포함하고 있습니다.기술기준에 따라 품목이 추가, 삭제될 수 있으며 데이터 제공 시점에 유효한 기술기준별 품목 목록을 제공합니다.
