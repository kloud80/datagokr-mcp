description_portal: 이 데이터는 한국남부발전에서 발생한 산업재해 및 안전사고 사망자 현황을 연도별로 정리한 자료입니다. 직영, 도급, 건설발주 등 구분에 따라 산업재해 사망자 수가 구체적으로 기록되어 있으며, 2016년부터 2024년까지의 현황이 포함됩니다. 또한 공공기관 관리시설에서 기관 귀책사유로 인해 발생한 안전사고 사망자 통계도 함께 제공됩니다. 이를 통해 사업장 내 안전사고 발생 추이를 확인하고, 안전관리 수준과 재해 예방 활동의 효과를 분석할 수 있습니다. 이 자료는 산업안전보건 정책 수립, 재해 예방 대책 연구, 안전 관리 체계 평가 등 다양한 분야에서 기초자료로 활용될 수 있으며, 국민에게 기관의 안전 관리 성과를 투명하게 공개하는 데에도 중요한 의미를 갖습니다.
