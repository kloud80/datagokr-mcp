summary_user: 군산시 안에서 화학사고가 났을 때 주민이 가는 지정 대피장소를 시설 한 곳당 한 행으로 담은 파일이며, 시설구분·시설명·주소·대피장소와 수용면적(제곱미터)·수용인원(명)을 포함한다. 산업단지 인근 주민이나 방재 담당자가 '우리 동네에서 화학사고가 나면 어느 시설로 대피하고, 그곳에 몇 명까지 들어갈 수 있나'를 확인하거나 대피 훈련 계획을 세울 때 쓴다. 전역 조인 키는 없어서, 다른 대피·구호시설 데이터나 위험물·화학물질 취급시설 자료와는 주소나 시설명을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 전북특별자치도 군산시 내 화학사고 발생 시 시민의 신속하고 안전한 대피를 위한 지정 대피장소에 대한 정보를 제공하는 자료로, 각 시설의 명칭, 주소, 대피장소 등의 정보를 포함하고 있다. 군산시는 화학물질 취급시설이 밀집한 산업단지와 인근 지역 주민의 안전을 보장하기 위해, 「화학물질안전관리법」과 관련 조례에 따라 화학사고에 대비한 비상대응체계를 마련하고 있으며, 본 데이터는 그 일환으로 시민에게 공개된다. 주소 정보는 대피장소의 위치를 정확히 파악하는 데 사용되며, 각 시설의 명칭과 기능은 사고 대응 시 역할 구분 및 안내 체계 마련에 기여한다. 이 자료는 시민 재난대응 교육, 화학물질 사고 시 행동 매뉴얼 구축, 비상대피 훈련 계획 수립 등에도 활용될 수 있다.
