description_portal: 이 데이터는 경찰청에서 일회성으로 제공하는 범죄자 마약류 등 상용 여부 현황 자료로서, 범죄 사건별 마약류(마약, 대마, 향정신성의약품), 본드·신나, 알코올 등 사용 여부를 기록하고 있다. 데이터는 범죄대분류, 범죄중분류, 마약류_마약, 마약류_대마, 마약류_향정신성의약품, 본드신나등, 알코올, 해당무, 미상 항목으로 구성되며, 사건별 범죄자의 약물 또는 기타 물질 사용 여부를 제공한다. 이를 통해 경찰의 사건 수사 과정에서 범죄자의 약물 사용 경향을 분석하고, 약물 관련 범죄 예방과 대응 방안 수립에 유용하게 활용할 수 있다. 특히 범죄자의 마약류 및 기타 물질 사용 실태를 체계적으로 파악하여 경찰 수사의 효율성과 정책적 대응을 강화하고, 국민 안전을 위한 기초자료로 활용될 수 있다.
