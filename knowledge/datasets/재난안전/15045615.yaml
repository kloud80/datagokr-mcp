summary_user: 광주 서부소방서 관내에서 긴급 출동 때 소방차가 지나가야 하는 소방통로 확보 대상 구간을 한 행씩 담은 소규모 목록 파일(csv 약 1.5KB)로, 지역·순찰구간·도로폭·주거세대수·확보지역 구분을 담는다. 소방행정 담당자나 주민이 '우리 동네 어느 골목이 소방통로 확보 대상이고 도로폭과 세대수는 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어서 다른 소방 데이터(소방용수·비상소화장치 위치 등)와는 지역명·구간명을 직접 맞춰 이어 써야 한다.
description_portal: 소방통로 확보 대상 현황 공공데이터는 화재, 구급, 구조 등의 긴급 출동 상황에서 소방차와 구조차 및 구급차가 원활히 이동할 수 있도록 지정된 통로와 관련 건물 정보를 체계적으로 제공하는 공공데이터입니다. 2024년 12월 31일 기준 광주광역시 서부소방서 공공데이터는 대상 시설명, 유형, 주소, 소방통로 위치·폭, 확보 상태, 관리 기관 등의 항목이 포함되어 있으며, 소방행정, 도시계획, 시민 안전 정보 제공 등 다양한 목적으로 활용됩니다. GIS와 결합해 출동 경로 분석 등에도 활용 가능합니다.
