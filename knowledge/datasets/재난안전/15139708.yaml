summary_user: 재난 시 고립이 예상되는 마을을 지점 단위로 담은 전국 범위 데이터로, 마을별 가구·주민 수, 구조장비·구조대원 수, 대피시설과 수용인원, 구호세트·양곡·침구·텐트 등 비축 물자, 주소를 함께 제공한다. 지자체 재난담당자나 분석가가 "우리 시군구에서 고립 예상 마을의 주민 수에 비해 구조인력과 구호물자가 충분한가"를 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드(DONG_CD)·법정동코드·도로명주소 같은 코드나 이름을 매핑해 대피·구호시설, 재난 위험지역 데이터와 연결해야 한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지역고립 예상지점 정보로, 지역코드, 연도, 행정동코드, 마을명, 가구수, 주민수, 구조장비수, 구조대원인원수, 수용인원수, 구호세트수 등을 제공하고 있습니다. 데이터의 갱신주기는 주 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
