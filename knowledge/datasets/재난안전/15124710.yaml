summary_user: 의정부도시공사가 관리하는 공영주차장별로 안전비상벨의 설치장소와 설치개수, 주소, 관리기관명을 한 행씩 담은 소규모 현황 파일(csv 약 1KB)이다. 주차장 이용자나 지역 경찰이 '이 공영주차장 안 어디에 비상벨이 몇 개 있는가'를 확인하거나, 분석가가 주차장별 비상벨 배치 밀도를 살피는 데 쓴다. 전역 조인 키는 없어서 같은 기관의 공영주차장 CCTV·이용요금 데이터와는 주차장명(대상)이나 주소를 문자열로 맞춰 잇는다.
description_portal: 의정부도시공사에서 관리하는 공영주차장 내 안전비상벨 설치 현황(주차장명, 주소, 설치장소, 설치개수, 관리기관명)에 관한 정보입니다.주차장 시설별 비상벨 설치장소, 설치개수,  관리기관 등 공영주차장 비상벨 현황을 세부 정보로 제공하고 있습니다.공영주차장 이용자는 안전에 대한 비상상황 및 응급상황 발생시 비상벨을 눌러 신속히 조치받을 수 있습니다.해당정보는 공영주차장 이용자 및 이용희망자, 지역시민, 경찰 등 정보수요자를 위하여 정확하고 신속하게 제공되고 있습니다.기타 CCTV, 이용요금 등 공영주차장에 관한 정보는 공공데이터포털에서 확인할 수 있습니다.또한 의정부도시공사 대표 홈페이지에 접속하시면 사업소개>교통사업>공영주차장에서도 이용 정보를 확인할 수 있습니다.https://www.uiuc.or.kr/businessInfo/trafficPage/public/list.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.
