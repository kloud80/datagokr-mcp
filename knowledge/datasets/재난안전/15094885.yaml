description_portal: '국토안전관리원에서 제공하는 데이터이며, 건설엔지니어링 및 시공평가 접수 현황이 포함된 CSV형식의 파일데이터입니다.건설 엔지니어링은 건설 프로젝트의 계획, 설계, 관리 및 운영 등 전 과정에 걸쳐 건설 기술에 관한 전문적인 업무를 수행하는 분야를 의미합니다. 이는 일반적으로 시공(건설) 자체를 제외한 기술 용역 부분을 포괄합니다.주요 업무 및 역할건설 엔지니어링의 핵심 역할은 안전하고 효율적인 건설을 위한 기술적 해결책을 제공하고 전반적인 프로젝트 관리를 담당하는 것입니다. 주요 업무는 다음과 같습니다. 기획 및 타당성 조사: 프로젝트 초기 단계에서 사업의 경제성, 기술적 타당성 등을 분석합니다.설계: 건축, 토목, 설비, 전기 등 각 분야에 대한 기본 및 상세 설계를 수행합니다.건설사업관리(CM): 발주자를 대신하여 프로젝트의 기획, 설계, 조달, 시공, 사후관리에 이르는 전 과정을 통합 관리합니다.공정 및 품질 관리: 공사 기간, 방법, 인력 및 자재 투입 등을 계획하고, 설계도면에 따라 공사가 진행되는지 관리·감독하며 기술적 문제를 해결합니다.유지관리: 완공된 시설물의 효율적인 운영과 관리를 위한 기술적 지원을 제공합니다'
