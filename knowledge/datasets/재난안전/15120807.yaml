description_portal: 이 데이터는 관악구 관내 빗물펌프장 현황에 대한 정보입니다. 컬럼으로 연번, 명칭, 도로명, 건물명, 행정동, 소관부서, 구분, 주용도, 데이터기준일이 포함되어 있습니다.침수 방지 목적의 빗물펌프장은 배수펌프장과 동일한 의미로 사용되며 표준데이터셋으로 관악구 배수펌프장 현황을 공개중에 있습니다.표준데이터셋으로는 제공중인 서울특별시 관악구 배수펌프장 현황은 설치연도, 전화번호, 위경도 등을 포함하여 보다상세한 정보를 제공중입니다.매년 연간 주기로 업데이트 되며 현재(2026년 7월 7일 기준) 관악구 관내에는 3개의 빗물펌프장(배수펌프장)이 존재합니다.
