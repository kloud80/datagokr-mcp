description_portal: '국토안전관리원에서 제공하는 데이터이며 교량시설물, 시도별, 종별 통계현황의 CSV형식의  파일데이터를 제공합니다. 25년 12월 31일 기준입니다.지역별 교량시설물 통계 현황을 알려드립니다.교량시설물이란 도로, 철도, 수로 등이 하천, 계곡, 도로 등과 겹치는 부분을 연결하는 구조물 전체를 의미하며, 상부 구조와 하부 구조로 나뉩니다. 여기에는 교량뿐만 아니라 댐, 터널, 항만, 건축물 등 건설공사를 통해 만들어진 구조물 및 부대시설까지 포함됩니다.교량시설물의 구성상부 구조: 바닥판, 거더 등으로 구성되어 차량이나 사람이 통행하는 부분입니다.하부 구조: 교대, 교각, 기초 등으로 구성되어 상부 구조의 하중을 지반으로 전달합니다.교좌 장치: 상부 구조와 하부 구조를 연결하는 부분으로, 하중을 전달하고 신축을 허용합니다.'
