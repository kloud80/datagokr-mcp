summary_user: 국토안전관리원이 관리하는 교량 시설물 수를 종별(행)과 17개 시도(열)로 교차 집계한 전국 통계표이며, 개별 교량 단위 원장이 아닌 417바이트 크기의 작은 CSV 집계 파일이다. 지역별 교량 시설물이 어느 종별에 얼마나 분포하는지, 예를 들어 경기도와 경상북도의 1·2종 교량 수가 어떻게 다른지 비교하려는 분석가나 지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명이나 종별 이름을 맞춰 붙여야 하며, 시도별 인구·도로연장 같은 시도 단위 통계와 이름 기준으로 연결해 쓴다.
