summary_user: 전국 붕괴위험지구를 지구 한 곳당 한 건으로 담으며, 지구명, 재해위험도 평가 점수·등급, 지정 여부·일자·사유, 위험 해소 대책, 정비사업 계획 금액과 시행연도를 포함한다. 지자체 담당자나 분석가가 '우리 지역 붕괴위험지구 가운데 위험등급이 높은데 정비사업이 아직 시행되지 않은 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로, 다른 데이터와는 지구명 매핑이나 같은 기관 코드인 재해위험지구 관리번호(DST_RSK_DSTRCT_MNG_NO)로 행정안전부의 재해위험지구·급경사지 데이터와 맞춰 본다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 붕괴위험 지역 정보로, 관리번호, 붕괴위험지구번호, 붕괴위험지구명, 재해위험도평가점수합계, 재해위험도평가등급코드, 붕괴위험지구지정여부 등을 제공하고 있습니다. 데이터의 갱신주기는 5분입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
