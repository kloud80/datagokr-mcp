summary_user: 광주광역시 남구를 맡는 남부소방서 관내 소방용수시설 수를 119안전센터별로 집계한 표로, 지상식·지하식 소화전, 저수조, 급수탑, 비상소화장치함 수와 소계를 담으며 파일 크기는 179바이트에 불과합니다. 소방 행정 담당자나 분석가가 남구의 어느 센터 관할에 소화전이나 비상소화장치가 얼마나 있는지 비교할 때 쓴다. 전역 조인 키가 없어 다른 소방서의 같은 현황표나 119안전센터 목록과는 센터 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 남부소방서 관내 소방용수시설 현황입니다. - 소방기본법 제10조(소방용수시설)에 따라 광주광역시 남구 관내에 소방용수시설(지상식/지하식 소화전, 저수조, 급수탑, 비상소화장치) 설치갯수, 유형별 현황 등 목록 대장을 관리합니다. 또한 남부소방서 관내 센터별 소방용수시설 현황을 등록하여 센터별 관내 용수시설 수량을 확인 할 수 있으며, 화재 발생 시 신속하게 화재진압과 소방급수지원 할 수 있도록 관내 소방용수시설 상세 위치를 제공합니다. 이 정보를 제공함으로써 남구 관내 소방용수시설 세부 현황을 확인 할 수 있습니다.
