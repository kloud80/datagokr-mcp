summary_user: 행정안전부가 재난안전데이터 공유플랫폼으로 제공하는 전국 규모 2.0 이상 지진의 발생 이력이며, 지진 한 건마다 발표 일시, 위도·경도, 발생 위치, 규모를 담는다. 연구자나 주민이 특정 지역에서 최근 몇 년간 규모 몇 이상의 지진이 얼마나 자주 났는지 확인하거나, 지진 위험을 분석할 때 기초 자료로 쓴다. 시도·시군구 코드로 보이는 필드(STDG_CTPV_CD)가 있지만 실측에서는 전역 조인 키로 확인되지 않았으므로, 대피시설·재난 위험지역 데이터와는 지역명이나 좌표를 맞춰 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 지진(2.0이상) 발생위치 및 규모 관련 정보입니다.\""
