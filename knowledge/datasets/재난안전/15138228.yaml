description_portal: '‘홍보배너 게시목록’ 데이터는 소방안전, 재난 예방, 응급처치, 화재 대응 등 다양한 주제를 국민에게 알리기 위해 제작·게시된 온라인 홍보 배너 현황을 정리한 자료입니다. 해당 데이터에는 연도별·분기별 또는 시기별로 배너가 게재된 일자, 배너 제목, 주요 홍보 내용, 관련 캠페인 명칭, 게시 기간, 노출 채널 등이 포함됩니다. 이를 통해 소방청이 국민 안전의식 제고와 행동요령 전파를 위해 어떤 주제를 집중 홍보했는지 한눈에 파악할 수 있으며, 특정 시점의 사회적 이슈(예: 화재 예방 집중기간, 여름철 물놀이 안전, 설 연휴 안전 캠페인 등)에 따른 홍보 전략 변화도 확인할 수 있습니다. 또한 기관의 대국민 소통활동을 기록·분석할 수 있는 자료로 활용 가치가 큽니다.'
