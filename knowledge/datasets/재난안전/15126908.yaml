summary_user: 경기도남부경찰청 관할 경찰서(관서명)별로 살인·강도·강간강제추행·절도·폭력의 발생 건수와 검거 건수를 집계한 작은 CSV 파일(약 1.7KB)이며, 건별 사건 기록이 아닌 관서 단위 집계다. 분석가나 지자체 담당자가 '경기 남부에서 절도 발생에 비해 검거가 적은 경찰서는 어디인가' 같은 지역 치안 비교 질문에 쓴다. 전역 조인 키는 없어서 관서명을 이름으로 맞춰 경찰관서 위치나 다른 지역 단위 범죄·112신고 통계와 연결해야 한다.
description_portal: 경찰청 경기도남부경찰청 관할 구역에서 발생한 5대 범죄(살인, 강도, 강간·성폭력, 절도, 폭력)의 발생 건수와 검거 건수를 집계한 공공데이터입니다. 각 범죄 유형별로 연도별 통계가 포함되어 있으며, 범죄 발생지, 검거율 등 세부 지표도 제공하여 범죄 유형별 추세를 명확히 파악할 수 있습니다. 이 데이터는 지역별 치안 문제를 분석하거나 범죄 예방 정책 수립 시 근거 자료로 활용될 수 있으며, 특정 범죄 유형에 대한 경향 분석과 범죄 취약 지역을 파악하는 데도 유용합니다. 지방자치단체, 경찰청, 연구기관 등에서 치안 대책을 마련하거나 범죄 예방 캠페인을 기획할 때 효과적인 기초 자료로 활용이 가능합니다. 또한, 범죄 다발 지역에 대한 경보 시스템이나 지역별 범죄 안전도 평가 등에 기여할 수 있는 중요한 자료입니다.
