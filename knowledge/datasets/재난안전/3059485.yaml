summary_user: '정부기관·공공기관 등의 소방장비 구입, 소방시설 공사 등 사업 예산을 연 단위로 조사한 결과로, 사업유형(구분)별 1~4분기 발주시기 예산 금액(천원 단위)을 집계한 전국 단위 비공간 자료입니다. 소방산업체가 올해 공공부문에서 어떤 분야(예: 경보설비 공사, 소방기동장비 구매) 예산이 몇 분기에 집중되는지 파악해 영업·생산 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업유형 이름을 맞춰 연결하는 방식으로만 이어 쓸 수 있습니다.'
description_portal: 소방산업의 진흥에 관한 법률 제16조(소방산업의 수요조사 및 공개)에 의해 시행하는 조사로 연 단위 정부기관 및 공공기관 등의 소방장비 구입 및 소방시설, 공사 등의 사업 예산 조사결과를 소방산업체에 제공하여  영업,생산 및 마케팅 활용에 활용할 수 있는 자료의 제공을 목적으로 조사합니다.데이터는 수요조사 보고서(pdf) 및 사업유형별 발주시기별 예산 데이터(csv)로 구성되어 있습니다.- 사업유형은 소방시설 점검 및 방화관리, 소방시설 신축 및 개선 공사, 경보설비 공사, 소화설비 공사,  소방용품 구매, 소방기동장비 구매 등 17개 분야로 구분됨
