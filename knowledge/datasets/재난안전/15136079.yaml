description_portal: 이 자료는 건물개황이력에 대한 민원정보를 기반으로 하며, 건물의 주요 구조 변경, 용도 변경, 리모델링 이력 등 행정적 개요를 포함하고 있습니다. 대구시의 건축물 관리 이력 및 변경사항 추적에 활용되며, 시설 점검, 재난 예방, 소방 설비 배치 등의 참고자료로 활용됩니다. 데이터는 샘플 형태로 일부 정보만 포함되어 있으므로 세부 내용을 파악하려면 원자료 검토가 필요합니다.* 본 자료는 민원정보시스템에서 추출한 자료로 일부 대상물에 대한 관한 정보만 포함되어 있음* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
