description_portal: 부산광역시 부산소방재난본부 구조·구급통계는 부산 지역 내에서 발생한 구조 및 구급활동에 대한 통계 자료를 말합니다.  구조·구급대원들이 현장에 출동해 대시민에 게 구조ㅎ구조·생활안전활동 정보시스템, 119구급스마트시스템으로 전산상으로  출동 건수, 구조 대상, 사고 유형, 응급처치 사례 등을 포함하여 정확한 소방재난본부의 활동 현황을  수집하고,  체계적으로 분석하고, 평가하는 데 활용하므로 이를 통해 올바른 구조구급정책을 수립하여 재난 대응 역량 강화와 시민 안전 증진을 목표로함.
