summary_user: 행정안전부 재난안전데이터 공유플랫폼이 제공하는 전국 한파쉼터 목록으로, 쉼터 한 곳당 한 건씩 명칭·시설유형·주소·이용가능인원·평일/토요일/일요일/공휴일 운영시간·위도·경도를 담는다. 주민이 "지금 우리 동네에서 문을 연 가장 가까운 한파쉼터는 어디인가"를 찾거나, 분석가가 지역별 쉼터 수용 인원을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 쉼터명으로 매칭하거나 위경도 좌표로 공간 결합하고, 같은 부문의 무더위쉼터·민방위 대피시설 등 대피·구호시설 데이터와 함께 본다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 한파쉼터 정보로, 쉼터시설번호, 시설유형 중분류, 쉼터명칭, 상세주소, 이용가능인원, 상세주소, 평일운영시작시간, 평일운영종료시간, 위도, 경도 등을 제공하고 있습니다. 데이터의 갱신주기는 월 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
