description_portal: 본 데이터는 2025년 전국 시도경찰청별로 집계된 고령 운전자의 운전면허 자진반납 및 그에 따른 취소처분 현황 통계입니다. 65세 미만부터 90세 이상까지 연령별로 세분화하여 각 지역의 반납 추이를 상세히 제공합니다. 최근 고령 운전자 교통사고 예방을 위한 지자체별 반납 지원 제도와 맞물려 정책의 실효성을 파악하고, 고령자 교통안전 대책 수립을 위한 기초 자료로 활용됩니다. 기존의 단순 면허 취소 통계와 달리 '자발적 의사'에 의한 반납 현황을 연령대별로 수치화함으로써, 초고령 사회에 대비한 이동권 보장 및 대체 교통수단 지원 정책 기획을 위한 핵심적인 근거 데이터를 제공합니다.
