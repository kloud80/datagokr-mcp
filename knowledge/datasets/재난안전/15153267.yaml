summary_user: 한국수력원자력이 제공하는 원자력발전소 주변 지점별 방사선량 측정값(RDTN_AMNT)과 갱신 시각을 담은 측정값 단위 데이터로, 범위는 전국이며 좌표가 없는 비공간 데이터입니다. 원전 인근 주민이나 방재 담당자가 지금 우리 지역 원전 주변 방사선량이 어느 수준인지 확인할 때 씁니다. 실측 컬럼에는 전역 조인 키가 없어서 다른 원전·방사능 방재·대피시설 데이터와는 발전소나 측정 지점 이름을 매핑해야만 이어 쓸 수 있습니다.
