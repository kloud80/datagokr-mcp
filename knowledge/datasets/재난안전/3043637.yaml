description_portal: '석면해체제거 작업 현황에 대한 데이터로 공사현장명, 위치(소재지), 기간(해체시작일, 해체종료일), 석면 자재 종류 및 면적 등의 데이터를 제공합니다.관련 법령은 석면안전관리법 제27조(석면해체제거작업의 공개)입니다.석면건축자재란 다음의 건축자재 중 악티노라이트석면, 안소필라이트석면, 트레모라이트석면, 청석면, 갈석면, 백석면이 1퍼센트(무게 퍼센트)를 초과하여 함유된 건축자재를 말합니다.- 지붕재, 천장재, 벽체재료, 바닥재 , 단열재, 보온재, 분무재, 내화피복재, 칸막이, 배관재(개스킷, 패킹, 실링 등)- 그 밖에 위의 자재와 유사한 용도로 사용되는 자재로서 활석, 질석, 사문석, 해포석 자재번호: 차례를 나타내거나 식별하기 위해 붙이는 숫자입니다.석면해체제거 작업현황: 산업안전보건법 제122조에 따라 고용노동부장관에게 신고된 석면해체제거 작업입니다.공사현장명: 석면해체제거 작업현장명입니다.위치_소재지: 신고된 석면해체제거 작업 현장 주소입니다.해체시작년월일, 해체종료년월일: 해체 작업을 시작하는 일과 작업을 종료하는 일입니다.종류명: 석면해체작업의 석면자재 종류입니다.면적_부피_길이: 해체되는 석면자재의 면적 또는 부피 또는 길이 입니다.참고) 산업안전보건법 제122조제3항에 따라 석면해체제거작업 시작 7일 전까지 석면해체제거작업 신고서를 석면해체제거작업 장소의 소재지를 관할하는 지방고용노동관서의 장에게 제출하여야 합니다.'
