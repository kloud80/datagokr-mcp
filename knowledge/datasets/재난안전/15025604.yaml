description_portal: 재난예경보시스템은 홍수, 태풍, 호우 등 재난 상황 발생 시, 신속하게 위험을 알리고 인명과 재산 피해를 최소화하기 위한 시스템입니다. 이 시스템은 하천 수위, 강우량 등 실시간 데이터를 기반으로 전화, 문자, 경보방송 등 시청각적인 방법을 통해 시민들에게 위험을 알리고, 적절한 대피나 대처 방법을 안내합니다. 실시간 데이터 수집 및 분석, 신속한 상황 전파, 자동화된 경보 발령, 대처 요령 안내 및 위험지역 통제를 하는데 도움을 줍니다. 예경보시스템 현황 중 자동우량계,  재해문자전광판, 자동음성통보시스템에 관한 사항을 제공합니다.  제조사, 설치연도, 설치주소 및 설치위치, 위도, 경도 데이터를 제공합니다.
