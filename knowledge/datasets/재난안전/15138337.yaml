description_portal: 본 데이터는 승강기 안전검사 신청 시 발생하는 검사 수수료의 실제 납부 이력을 투명하게 관리·정산하기 위한 기초 자료입니다. 행(row)마다 고객납부일자(고객이 수수료를 납부한 일자), 입금액(원 단위 수납금액), 등록일자(공단 수납시스템에 반영된 일자)를 기록하며, 일자별·기간별 수납 추이 파악, 회계 정산, 미수·과오납 점검 등에 활용됩니다. 적용 범위는 공단이 수행하는 완성·정기·수시·연장·정밀검사 등 검사종류 전반의 ‘신청 수수료’에 해당하며, 데이터는 납부 건 단위로 집계됩니다. 납부일자와 등록일자 사이에는 금융결제 처리에 따른 시차가 존재할 수 있고, 동일 일자에 다건 납부가 발생할 수 있습니다.
