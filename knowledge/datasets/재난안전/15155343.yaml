description_portal: '한국원자력안전재단에서 제공하는 발전소별 집합교육 운영현황으로, 수시로 제공되는 1회성 데이터입니다. 발전소별 집합교육 운영현황에 대한 데이터는 소속기관, 과목종류, 과목, 지역, 신청횟수, 수료인원과 같은 항목으로 구성되어 있습니다.과목종류는 기본교육(방사선안전관리자/방사선작업종사자), 보수교육으로 구분되고, 과목은 크게 신고기관, 허가기관 방사선안전관리자를 위한 과목과 신규, 방사선관련 면허자 보수교육 등으로 구분되어 있습니다. 해당 데이터는 2024년 12월 기준으로, 2024년도의 원자력 발전소별 안전관리 집합교육 참여 통계 현황에 대한 데이터를 제공합니다.데이터명 : 한국원자력안전재단_발전소별 집합교육 운영현황_20241231파일명 : 발전소별 집합교육 운영현황.csv'
