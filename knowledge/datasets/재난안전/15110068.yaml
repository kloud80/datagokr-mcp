summary_user: 인천광역시경찰청과 산하 경찰서별로 주소, 대표전화번호, 근무 경찰관 인원수, 구내식당 운영 여부·방식을 한 행씩 담은 소규모 현황 파일(CSV 약 812바이트)이다. 인천 지역 경찰서의 위치·연락처를 확인하거나, 경찰서별 근무 인원 규모와 구내식당 운영 형태(직영·배달·위탁 등)를 비교하려는 시민·분석가가 쓴다. 전역 조인 키가 없어 다른 경찰관서 위치 데이터나 지역 범죄 통계와는 경찰관서명이나 주소를 기준으로 이름 매칭해 이어 써야 한다.
description_portal: 인천광역시경찰청 및 산하 각 경찰서별 현황에 대한 데이터는 주소, 전화번호, 경찰서 실근무인원수, 그리고 구내식당 유무 등 다양한 항목을 포함하여 제공됩니다.이 데이터는 인천광역시경찰청과 각 경찰서의 위치 정보를 비롯해, 시민이나 관계자가 연락할 수 있는 전화번호, 각 경찰서에 실제로 근무하는 인원 수, 그리고 경찰서 내 구내식당이 운영되고 있는지 여부를 상세하게 담고 있습니다. 또한, 구내식당의 경우 각 경찰서별로 자체 직영, 외부 배달, 민간 위탁 등 다양한 방식으로 운영되고 있으며, 인천 지역 내 10개 경찰서 대부분이 직원 복지를 위해 구내식당을 운영하고 있습니다.
