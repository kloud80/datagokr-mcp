summary_user: 광주 광산구에서 태풍·호우·대설 등 자연재난으로 생긴 피해를 건별로 담은 파일로, 포털 설명상 재난관리업무포털에 등록된 617건이며 건마다 피해일시·재해명·주소와 위경도·피해요인·시설구분·피해물량·피해액(천원)·행정동이 있다. 구청 방재 담당자나 분석가가 '광산구에서 침수 피해가 반복된 지점과 행정동은 어디이고 피해액은 얼마였나'를 확인하는 데 쓴다. 전역 조인 키는 없어 위도·경도로 재해위험지구·대피시설 등 공간 레이어와 겹쳐 보거나 행정동 이름·재해명으로 기상 특보·피해 기록과 맞춰 쓴다.
description_portal: 광주광역시 광산구에서는 지역 내에서 발생한 태풍, 호우, 대설 등 자연재난으로 인한 피해 현황을 체계적으로 관리하기 위해 재난관리업무포털에 등록된 총 617건의 데이터를 제공합니다. 이 자료는 각 자연재난 발생 시기의 피해 규모와 유형, 피해 지역, 대응 조치 내역 등을 상세히 포함하고 있어 광산구 내 재난 관리와 대응 현황을 종합적으로 파악할 수 있도록 돕습니다. 특히, 태풍이나 집중호우, 대설 등 기상 재난이 빈번해지는 상황에서 지역 사회의 안전 강화와 피해 최소화를 위한 정책 수립에 기초 자료로 활용될 수 있습니다.재난 발생 시 효과적인 자원 배분과 복구 작업 계획 수립에 필요할 수 있으며, 재난 대응 역량 강화를 위한 교육과 훈련 자료로도 사용할 수 있습니다.
