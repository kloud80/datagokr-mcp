summary_user: 경상남도경찰청과 산하 23개 경찰서별로 2018년부터 2023년까지 연도별 112신고 접수건수를 담은 집계 파일입니다(약 1KB의 작은 csv로, 관서가 행이고 연도가 열인 형태). 지역 분석가나 주민이 '우리 지역 경찰서의 112신고가 최근 몇 년간 늘었는가'처럼 관서별 신고 추이와 치안 수요를 비교할 때 쓴다. 전역 조인 키가 없어 관서명(구분)을 경찰관서 위치나 시군구 이름에 직접 매핑해야 하며, 같은 기관의 다른 범죄 발생·검거 통계와 이어 쓴다.
description_portal: 112신고는 경상남도경찰청 및 23개경찰서 상황실에서 신고접수를 받고 있습니다. 112상황실은 24시간 도민들의 위험상황을 접수받아 적절한 지령하달로 신고상황을 해결하고 있습니다. 해당 데이터는 관할별 치안신고 상황을 국민의 알권리를 위해 1년 주기로 업데이트 제공하는 데이터로 경상남도경찰청 및 산하 23개 경찰서(창원중부서, 창원서부서, 마산중부서, 마산동부서, 진주서, 김해중부서, 김해서부서,양산, 진해 등)에 접수된 112신고현황 자료입니다. 이 데이터는 경찰서별 2018년부터 2023년까지 112신고접수건수에 대한 데이터입니다.
