description_portal: '○ 통계개요* 통계명 : 특별사법경찰 구약식 처분현황* 통계종류 : 서울시 민생사법경찰단의 수사업무 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 민생사법경찰단의 사건처리(입건)에 대한 검찰 송치현황과 처분결과 현황 등을제공하여 정책 수립 등을 위한 기초자료를 제공하는 것을 목적으로 함* 작성체계 : 사건처리(입건)→사건수사→검찰청 송치→처분결과 회신(검찰, 법원)* 공표주기 : 매년(1년 주기)* 공표범위 : 지역 - 서울시내용 - 특별사법경찰의 구약식 처분현황○ 용어설명* 기소 : 검사가 사건에 대한 법원에 심판을 요구하는 일* 불기소 : 사건이 죄가 되지 않거나 범죄의 증명이 없을 때 또는 공소의 요건을 갖추지못하였을때 검사가 공소를 제기하지 않는 말'
