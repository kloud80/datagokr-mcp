description_portal: '한국가스안전공사에서 제공하는 가스안전교육 신청자격 정보입니다.가스 시설 안전관리자로 선임되기 위해서는 가스 관련 법률에서 규정하고 있는 가술 자격을 보유해야 하며,해당 목록은 가스안전교육원에서 실시하는 양성교육 또는 법정교육의 일부 과정에서 교육신청을 위해 필요한 국가기술자격을 명시하고 있습니다.※ (참고) 국가기술자격을 기준으로 목록화 한 것으로, 해당 교육 신청을 위해 반드시 국가기술자격이 필요한 것은 아님(양성교육 자격증 등으로 대체 가능)  * 교육 관련 내용은 가스안전교육원(www.kgs.or.kr/gse/index.do) 또는 사이버지사 홈페이지(cyber.kgs.or.kr)를 참조※ 데이터기준일 : 2025년 9월 17일※ 가스 관련 법률 개정 발생 시 별도 참조 필요'
