description_portal: "해당 통계는 '수상에서의 수색, 구조 등에 관한 법률'을 근거하여 작성 및 관리되고 있음. 조난사고란 수상에서 사람의 생명, 신체 또는 선박 등의 안전이 위험에 처한 상태라고 정의하고 있으며, 선박의 기준은 선박법에 정의된 선박 중에서 기선, 범선, 부선으로 정하여 통계 집계함. 해상조난사고는 선박의 운용과 관련하여 발생한 사고 의미로 원인별 선박 사고로 인한 인명피해 현황을 나타냄* 원인별 : 정비불량, 운항부주의(졸음운항, 견시소홀 등), 관리소홀, 기상악화, 연료고갈, 화기취급부주의, 적재불량, 재질불량, 기타"
