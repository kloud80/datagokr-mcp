description_portal: '부산광역시 서구에서 실시하는 연도별 민방위교육 (기본 집합교육, 사이버교육, 비상소집 보충훈련)에 대한 데이터입니다.수집 항목에는 구분, 대상, 교육 기간, 민방위대명, 데이터 기준일자 등이 포함되어 있으며, 이를 통해 집합교육·사이버교육의 일정 관리, 교육 대상자 확인, 보충 교육 계획 수립, 교육 참여 현황 분석 등 다양한활용이 가능합니다.예시 데이터에는 집합교육(대장), 사이버교육(대원), 보충 교육 등 교육 유형과 대상, 교육 기간, 민방위대 분류 정보가 포함되어 있습니다.** 항목별 설명구분: 교육 유형을 나타내며, 집합교육, 사이버교육, 보충교육 등으로 구분대상: 해당 교육의 참여 대상자로, 민방위 대원 전체 또는 본교육 불참자 등으로 구분기간: 교육이 실제로 진행되는 날짜 또는 기간민방위대명: 해당 교육 대상 민방위대의 명칭 및 구분 정보'
