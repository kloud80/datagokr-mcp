summary_user: 전국 시·도 소방본부에 설치된 소방항공대를 한 행씩 담은 소규모 파일(csv 약 1.5KB)로, 소속 본부·항공대명, 주소, 도·분·초 형식의 위도·경도를 담는다. 소방·재난 분석가나 지자체 담당자가 '우리 지역 산악·응급 항공구조 거점은 어디에 있고 얼마나 떨어져 있나' 같은 배치·접근성 질문에 쓴다. 전역 조인 키는 없어서 시·도 본부명이나 주소를 이름 매핑하거나 좌표를 십진수로 바꿔 119안전센터·대피시설 같은 위치 데이터와 공간으로 겹쳐 쓴다.
description_portal: 국 각 시·도에 설치된 소방항공대의 조직  정리한 자료로 시·도 본부명, 소방항공대명,  위치(주소), 위치의 좌표(도.분.초)소방항공대는 산악 구조, 응급환자 이송, 대형 화재 대응, 재난지역 정찰 등 고위험 재난현장에 투입되는 전문 조직으로, 이 데이터를 통해 각 지역별 소방항공대의 배치 현황과 자원 규모를 확인할 수 있습니다. 특히 헬기 보유 현황은 기종별로 구분되어 있으며, 기체 수량과 함께 실제 운항이 가능한 상태인지 여부도 기록되어 있어, 운영 실효성 및 장비 가용성을 객관적으로 파악할 수 있습니다.또한 각 항공대의 주소 정보도 함께 포함되어 있어 지리적 분포 및 접근성, 지역별 항공구조 대응 능력의 편차 등을 분석할 수 있는 기반을 제공합니다.
