description_portal: 시민명예감시관 환경방사선 측정 현황 자료는 원자력시설 주변 지역 주민을 명예감시관으로 선정하여 해당 지역의 환경 방사선량을 주기적으로 측정하고, 그 결과를 시민들에게 제공하는 자료입니다. 명예 감시관은 휴대용 공간 방사선량 측정기를 활용하여 관평동, 구즉동, 신성동 등 원자력시설 인근 여러 지점에서 정기적으로 방사선량을 측정하며, 측정 결과는 국가 기준 평상변동범위(0.05~0.30μSv/h) 내의 정상 수치를 확인하는 데 사용됩니다. 데이터에는 측정 지점별 방사선량, 측정 일시, 참여 감시관 정보 등이 포함되어 있어, 원자력시설 주변 환경의 안전성 평가, 방사선량 변화 모니터링, 주민 불안 해소, 투명한 정보 제공 등 다양한 목적에 활용됩니다.
