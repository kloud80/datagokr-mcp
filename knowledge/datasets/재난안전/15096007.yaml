summary_user: 충청남도 계룡시 관내에 설치된 재난·방범용 CCTV를 시설 한 곳씩 담은 건별 원천 데이터로, 관리기관과 전화번호, 지번·도로명 주소와 위도·경도, 설치 목적, 카메라 수와 화소 수, 설치 년월, 영상 보관 일수, 촬영 위치를 담는다. 주민이나 생활안전 분석가가 '우리 동네 골목길이나 공원 주변에 방범 CCTV가 어디에 몇 대 설치돼 있는가'를 지도로 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 좌표(위도·경도)를 기준으로 공간 매칭하거나 같은 기관 데이터끼리 이름으로 맞춰 이어 쓴다.
description_portal: 충청남도 계룡시의 '재난안전 CCTV 정보 API' 데이터는 재난 및 범죄 예방을 목적으로 관내에 설치된 CCTV 시설물의 상세 현황을 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 CCTV 정보를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 시설을 관리하는 관리기관 명과 전화번호, CCTV가 설치된 소재지 지번 주소와 도로명 주소 및 정확한 위도/경도 정보가 포함됩니다. 또한, 설치 목적 구분, 카메라 수와 화소 수, 설치 년월, 그리고 영상 보관 일수 등 기술적 상세 정보와 촬영 위치 정보까지 제공하여, 사용자나 관계 기관이 지역 방범 및 재난 대응 시스템 현황을 파악하고 관련 안전 서비스를 개발하는 데 필수적인 도시 안전 인프라 자료로 활용됩니다.
