summary_user: 장수군 7개 읍면에 있는 풍수해대피소 233개소를 시설 한 곳당 한 행으로 담은 파일로, 마을회관·노인정 같은 임시 거주시설의 구분, 읍면, 시설명, 설치일, 연면적(제곱미터), 도로명주소, 소유 구분이 들어 있다. 호우·태풍·폭염·한파 같은 자연재난 때 장수군 주민이나 방재 담당자가 "우리 읍면에서 가장 가까운 대피소는 어디이고 규모는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 대피시설·재난 위험지역 데이터와는 도로명주소나 읍면 이름을 맞춰 연결해야 한다.
description_portal: 전북특별자치도 장수군 풍수해 대피소 현황입니다. (연번, 구분, 읍면동, 시설명,설치일, 연면적, 소재지  도로명주소, 소유구분,데이터기준일 ) 항목으로 구성되어 있습니다.자연재난 발생 시(호우, 태풍, 강풍, 폭염, 한파, 지진 등) 대피할 수 있는 장수군의 임시 거주시설로 구성되어 있습니다.장수군 전역 7개 읍면의 233개소가 있으며, 마을회관, 노인정 등으로로 구성되어 있습니다. 풍수해대피소 운영시간은 시설마다 상이하며, 이용 가능한 인원도 상이하니 참고하시기 바랍니다.연면적 단위는 제곱미터입니다.풍수해대피소 운영과 관련하여 궁금한 사항이 있으신 경우 장수군청 안전재난과로 문의하여 주시기 바랍니다.
