summary_user: 경상남도 18개 시군에 지정된 산사태취약지역을 시군구·읍면동·리·지번 단위로 한 줄씩 담은 지정 현황 파일로, 취약지역 유형(토석류·산사태), 지정면적(제곱미터), 지정대피소를 함께 싣는다. 주민이나 부동산 매수 검토자가 '이 지번이 산사태취약지역으로 지정돼 있는지, 비상시 어느 대피소로 가야 하는지'를 확인하거나, 분석가가 시군별 지정 건수·면적을 비교하는 데 쓴다. 전역 조인 키는 없어 시군구·읍면동·리·지번 문자열을 주소·필지 데이터나 대피소 목록과 이름으로 맞춰 이어 쓴다.
limits: 표준 행정코드나 PNU 같은 조인 키가 없어 다른 데이터와 연결하려면 주소 문자열 정제와 매핑이 필요하다. 범위는 경상남도 한 시도에 한정되고, 명세상 주기가 연간·이벤트형으로 되어 있어 지정·해제 변경이 즉시 반영된다고 보기 어렵다. 지정 위치만 담고 있어 실제 산사태 발생 이력이나 위험도 점수는 이 데이터로 알 수 없다.
