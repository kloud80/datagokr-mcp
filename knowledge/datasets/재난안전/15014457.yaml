description_portal: 산사태취약지역이란 「산림재난방지법」 제2조제9호에 따르면 산사태취약지역이란 산사태등으로 인하여 인명 및 재산 피해가 우려되는 지역으로서 같은 법 제22조에 따라 지정 또는 변경하여 고시한 지역을 말하며,  제22조에 실태조사 등의 결과에 따라 붕괴·침식·균열 등으로 산사태 발생 위험성이 높다고 인정되는 지역을 산사태취약지역으로 지정하였으며,경상남도 내 18개시군의 산사태취약지역지정현황에 대한 공공데이터로 시군별 지정 토석류 및 산사태 상세현황을 제공합니다.
