description_portal: 해당 데이터는 경기도북부경찰청 관내에서 실시한 교통법규 위반 단속 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 교통법규 종류는 음주운전, 무면허운전, 신호위반, 중앙선 침범, 안전띠 미착용, 보행자, 기타로 구분되어 있습니다. 2016년부터 2025년까지의 현황으로 교통법규 위반 행위 별로 구분하여 제공하고 있어, 해당 기간 동안의 경기북부경찰청 교통법규 위반 단속 건수를 연도별 및 행위별 파악할 수 있습니다. 이 자료는 교통 법규와 관련된 경찰 활동을 보여주며, 해당 현황은 경기북부경찰청 교통과에서 제공합니다.
