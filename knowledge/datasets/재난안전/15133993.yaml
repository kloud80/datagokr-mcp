description_portal: 이 문서는 한전케이피에스주식회사가 제작한 ONE PAGE 형식의 교육자료로, 활선작업 시 준수해야 할 핵심 절차와 안전 수칙을 간결하고 체계적으로 정리한 가이드이다. 활선작업은 전기설비의 전원을 차단하지 않고 작업을 수행하는 고위험 작업으로, 작업자의 숙련도와 철저한 안전조치가 요구된다. 이 자료는 활선작업의 개념, 사전 준비사항(작업계획, 작업허가, 안전장비 점검 등), 작업 중 주요 안전조치(이격거리 확보, 절연 도구 사용, 감시인 배치), 사용 장비 및 보호구의 기준등을 도식과 함께 직관적으로 설명하고 있다. 특히 활선작업 전·중·후 단계별로 안전 포인트를 정리해, 작업자의 이해를 돕고 현장 적용성을 극대화하였다. 이 교안은 고전압 설비를 대상으로 작업하는 직원들의 안전사고 예방, 표준 작업절차 준수, 활선작업 교육시 활용도가 높으며, 감전사고 및 중대재해 예방에 효과적인 안전관리 자료다.
