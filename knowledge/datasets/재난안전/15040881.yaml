description_portal: 국토안전관리원이 관리하고 있는 교량 현황에 관한 데이터입니다.총 35개의 교량을 관리하고 있으며, 교량은 강상형교 1개, 아치교 5개, 현수교 5개, 사장교 24개로 구성되어 있습니다.데이터는 연번, 교량명, 형식, 연장(m), 준공시기, 관리주체, 비고의 열로 이루어져 있습니다.관리주체는 대전청, 부산청, 서울청, 원주청, 익산청이 있고, 각 청에서도 세부적으로 과가 나누어져 있습니다.이 중 익산청이 관리주체인 교량이 80%정도이며, 그중에서도 해상교량안전과가 20개 이상의 교량에 대한 관리주체입니다.
