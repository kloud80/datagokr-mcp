description_portal: 국토안전관리원에서 제공하는 위탁관리대상 현수교 등 교량의 풍향풍속계 설치 현황 데이터입니다.총 18개의 풍향풍속계가 설치되어 있으며, 현수교뿐만 아니라 아치교와 강상형교에 존재하는 풍향풍속계에 대한 현황도 존재합니다.5개의 현수교, 3개의 아치교, 1개의 강상형교 각각의 센서 설치 현황에 대한 데이터입니다.데이터는 연변, 교량명, 형식, 센서명, 설치위치, 측정방식의 데이터를 포함하고 있습니다.측정방식은 프로펠러형이 주를 이루고 있으며, 초음파로 측정하고 있는 교량도 존재합니다.
