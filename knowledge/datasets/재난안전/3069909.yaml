summary_user: 한국가스안전공사가 보유한 특허 등 산업재산권을 건별로 정리한 목록으로, 재산권 구분·명칭·기술분야·출원번호와 출원일·등록번호와 등록일·권리 상태·출원자·연계 연구과제 번호를 담은 전국 단위 CSV 파일(약 21KB)이다. 가스안전 분야 기술이전이나 공동연구를 찾는 기업·연구자가 '가스안전공사가 어떤 기술분야에서 어떤 특허를 등록·출원했는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 출원번호·등록번호로 특허청 특허정보와 대조하거나 연구과제연계번호로 같은 기관의 연구과제 자료와 맞춰 보는 정도로만 연결한다.
limits: 실측 컬럼에 다른 데이터셋과 바로 이을 공통 키가 없어 이름이나 번호를 직접 맞춰야 한다. 시설 안전 원장으로 분류돼 있지만 승강기·시설물 번호 단위의 점검·안전 정보가 아니라 기관 보유 지식재산 목록이며, 출원 단계인 건은 등록번호·등록일자가 비어 있다.
