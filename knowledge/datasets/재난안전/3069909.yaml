description_portal: '한국가스안전공사에서 보유하고 있는 산업재산권 현황 정보를 제공합니다.해당 목록은 기술 홍보 및 공공-민간 업계의 상생에 참고자료로 활용될 수 있도록 개방되었습니다.목록은 재산권구분, 재산권명, 기술분야, 출원번호, 출원일자, 재산권등록번호, 재산권등록일자, 특허출원상태 등 컬럼으로 구성되어 있습니다.가스안전관리 기술 발전 및 연구 현황을 조회하여 정책 수립 및 통계 수집, 협업 과제 발굴 등에 활용할 수 있습니다.※ 연간 주기로 현황 정보가 업데이트되며 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고 바랍니다.※ 재산권상태가 출원 단계의 경우 "재산권등록번호" 및 "재산권등록일자"는 데이터 미수집(등록번호 없음)에 따른 공란 임을 참고 바랍니다.※ 해당 목록은 2025년 부터 메타정보를 기반으로 현행화하여 제공합니다.※ 데이터기준일 : 2025년 9월 19일 현재기준'
