description_portal: 국토안전관리원에서 관리하고있는 교량별 대상으로 점검항목을 제공하는 데이터 입니다.점검 결과에 따라서 점검 조치구분(설치:I, 교체:C, 철거:R, 수리:F, 기타:E)을 다음과 같이 알려드립니다.조치내용은 교량별 상이하오니 참고하여 주시길 바랍니다.교량 점검항목 기준은 「시설물의 안전 및 유지관리에 관한 특별법」 및 관련 세부 지침에 따라 정기점검, 정밀점검, 정밀안전진단 등 점검 종류별로 상이하게 적용됩니다. 주요 점검 내용:시설물의 전반적인 외관 상태 관찰.기능적 상태가 현재의 사용 요건을 계속 만족시키는지 확인.사고 및 위험의 가능성 조사.주요 결함부의 사진 촬영 등교량코드는 교량 영문명의 약자입니다.장비코드열에서 s는 손상을 의미합니다.센서구분열에의 데이터는 센서의 종류들 입니다.장비코드(로거 또는 센서코드)열은 해당 교량의 손상된 센서를 합친 데이터 입니다.
