summary_user: 울산광역시가 관내에서 실시한 소방특별조사 결과를 구분별로 조사대상·조사수·양호/불량 건수와 불량사항에 대한 행정조치·기관통보·입건·과태료부과 건수로 집계한 작은 파일(약 499바이트 CSV)이다. 울산에서 소방특별조사를 받은 대상 중 불량 판정 비율이 얼마이고, 위반 시 과태료나 입건 같은 처분이 어느 정도 이뤄지는지 확인하려는 분석가·정책 담당자가 쓴다. 전역 조인 키가 없어 다른 소방 데이터(화재 발생 건별, 소방용수 위치 등)와는 구분 이름을 맞추거나 같은 기관 기준으로만 이어 쓴다.
description_portal: 본 데이터는 관내에서 실시한 소방 특별 조사 현황 정보이다. 조사 대상 건축물, 조사 일자, 조사 결과, 위반 사항, 조치 내용 등의 세부 사항을 포함한다. 소방 특별 조사는 다중 이용 시설, 고층 건물 등 화재 위험이 높은 대상에 대해 소방 안전 관리 실태를 점검하는 활동이다. 해당 자료는 화재 예방 정책 수립, 소방 안전 관리 강화, 위반 건축물 관리에 활용된다. 조사 결과 분석을 통해 화재 위험 요인을 파악하고 개선 조치를 이행하도록 유도한다. 또한 반복적으로 위반하는 건축물에 대한 집중 관리 및 행정 처분 강화를 통해 소방 안전 수준을 향상시킨다. 건축물 소유자 및 관리자가 소방 안전 기준을 준수하도록 유도하여 화재 사고를 예방한다.
