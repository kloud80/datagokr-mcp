summary_user: 경기도에서 접수된 벌집 제거 요청에 소방이 출동한 기록을 건별로 담으며, 출동 본부·소방서·안전센터, 신고 날짜·시각·요일, 발생 장소(시·구·읍면동·리)와 사고 원인을 포함한다. 소방·지자체 분석가가 '여름철 어느 시군·읍면동에서 벌집 출동이 몰리는가'를 따져 소방력 배치나 예방 활동 우선순위를 정하는 데 쓴다. 전역 조인 키나 행정코드가 없어서 다른 데이터와는 시군·읍면동 이름을 매핑하거나 소방서 이름으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 전역에서 벌집 제거 요청이 접수된 건에 대해 지역 소방서가 실제로 출동한 기록을 담고 있습니다. 출동이 이뤄진 날짜와 시간, 위치 정보는 시·군 단위를 넘어 읍·면·동 및 세부 지역까지 포함되어 있어, 생활안전 민원이 발생하는 시기와 지역적 특성을 정밀하게 파악할 수 있습니다. 벌집은 시민 일상과 밀접하게 관련된 위험 요소로, 이 데이터를 통해 계절별·지역별 출동 빈도와 분포를 분석하고, 소방력 배치나 예방 활동의 우선순위를 정하는 데 기초자료로 활용할 수 있습니다. * 발생장소가 동까지 있는 경우 "발생장소_리" 항목에 발생장소의 동 값이 제공됩니다.
