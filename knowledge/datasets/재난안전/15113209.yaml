summary_user: 진주시 전역의 가로등을 한 행씩 담은 원천 목록으로, 분전함번호·표찰번호, 리·지번 주소, X·Y 좌표, 램프 종류·용량, 등기구 종류·등수, 보행등 정보, 설치일자를 담는다(시군구 범위, CSV 약 1.7MB). 시설관리 담당자나 생활안전 분석가가 '우리 동네 어느 분전함에 어떤 가로등이 몇 개 있고 언제 설치됐나'를 확인하거나, 야간 조도 취약 구역을 찾는 데 쓴다. 전역 조인 키가 없어 지번 주소나 좌표를 기준으로 CCTV·보안등·안전비상벨 같은 다른 방범 인프라 데이터와 공간·주소 매칭으로 이어 쓴다.
description_portal: 진주시 가로등 정보(분전함번호, 위도, 경도, 지번주소, 설치일자 등)에 대한 데이터를 제공하며, 위경도 좌표계는 WGS(World Geodetic System)84 좌표계입니다.분전함위치 가로등 및 번호, 행정도과 법정동, 지번주소, 경도, 설치일자, 분전함 번호, 분전함 순서, 지번주소, 설치일자 등 진주시 전역에 있는 가로등 분전함 정보를 알수 있는 내용입니다.가로등 분전함위치를 파악 및 수량을 통하여 가로등 수리 및 기타사항 발생 시 대처할 수 있는 내용입니다.진주시전체 분전함수량 파악에 도움되는 데이터입니다.
