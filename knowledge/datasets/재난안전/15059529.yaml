summary_user: 경기도 시군별 보안등 설치 개소 수를 나트륨등·메탈등·LED등 조명 종류와 전력(W) 구간별로 나눠 담은 집계 자료로, 건별 시설 원장이 아니다. 시군 담당자나 분석가가 '우리 시군의 보안등 중 LED 비중은 얼마이고, 교체가 필요한 고전력 나트륨·메탈등은 몇 개소인가'를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명(SIGUN_NM)이나 시군 코드의 이름·코드 매핑으로 연결한다.
description_portal: '이 데이터는 경기도 내 시군별 보안등 설치 현황을 조명기기 종류 및 전력소비량(Watt) 구간별로 구분하여 집계한 자료입니다. 주요 항목은 시군명과 함께 나트륨등, 메탈등, LED등으로 구분되며, 각각의 조명기기 유형은 다시 세부 전력구간(예: 100~200W, 50~100W 등)별 설치 개소 수로 제공됩니다. 이 자료는 시군별 에너지 효율화 추진 현황, 노후 조명기기의 교체계획 수립, 야간 보행환경 개선 등과 관련된 정책 수립 및 현황 분석에 활용될 수 있습니다. 특히, 에너지 절약형 조명인 LED의 보급 정도를 파악하거나, 고전력 조명기기인 나트륨 및 메탈등의 대체 필요성을 판단하는 데 유용한 데이터입니다.'
