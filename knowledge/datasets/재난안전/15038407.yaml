description_portal: 본 데이터는 경상남도 의령군 이재민임시주거시설 현황을 제공합니다. 데이터는 연번, 시설명, 소재지도로명주소, 소재지지번주소, 위도, 경도, 수용가능면적, 수용가능인원, 수용시설대표전화번호, 수용시설 전화번호, 관리기관명, 관리기관 전화번호, 데이터기준일자로 구성됩니다. 이를 통해 이용자는 각 임시주거시설의 명칭, 정확한 위치, 위경도 좌표, 수용 가능한 면적과 인원, 시설 및 기관의 연락처 정보를 한눈에 확인할 수 있습니다. 이 자료는 재난 상황 시 신속한 대피 장소 파악과 안내, 관리 대상 기관 확인, 운영 현황 점검 등 실질적인 대응 준비에 유용합니다. 데이터기준일자는 최신 반영 시점을 알려 활용 시점의 적절성을 판단할 수 있게 도와줍니다. 본 데이터는 공공데이터포털에서 누구나 내려받을 수 있으며, 재난 대응 체계 향상과 지역 안전 기반 확보에 기여하는 자료입니다.
