summary_user: 경상남도 의령군의 이재민 임시주거시설을 시설 한 곳씩 담은 원천 목록으로, 시설명·도로명주소·위경도 좌표·수용 가능 면적과 인원·시설과 관리기관 연락처·데이터기준일자를 담는다(파일 약 4KB 규모). 재난으로 집을 잃은 의령군 주민이나 구호 담당자가 "우리 동네에서 가장 가까운 임시주거시설은 어디이고 몇 명까지 들어갈 수 있나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 매칭이나 위경도 좌표 기반 공간 결합으로 잇고, 다른 시군의 같은 이름 현황이나 대피소·쉼터 데이터와 함께 쓴다.
limits: 의령군 한 곳만 담아 다른 지역이나 전국 비교에는 다른 기관 파일을 따로 모아야 하고, 공통 코드 키가 없어 이름·주소·좌표로만 연결된다. 실제 운영 여부나 현재 수용 상태는 담지 않으므로 데이터기준일자를 확인하고 쓴다.
