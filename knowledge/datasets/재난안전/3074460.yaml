description_portal: 경찰청 수사기획담당관실에서 제공하는 범죄 발생부터 인지까지의 기간 통계는 전국 경찰관서에 형사 입건된 사건들을 범죄 대분류별로 나누어 발생 시점부터 인지 시점까지 소요된 시간을 다양한 구간(1시간 이내, 2시간 이내, 5시간 이내, 12시간 이내, 24시간 이내, 2일 이내, 5일 이내, 10일 이내, 1개월 이내, 3개월 이내, 3개월 초과)으로 분석한 자료입니다.강력범죄, 폭력범죄, 절도범죄, 지능범죄 등 주요 범죄 유형별로 사건 인지 속도를 파악할 수 있습니다. 예를 들어, 살인 사건의 경우 발생 후 1시간 이내에 인지되는 비율과 3개월 초과하여 인지되는 비율을 비교할 수 있습니다. 이 통계는 범죄의 긴급성 및 수사 대응 속도를 평가하고, 범죄 유형별 특성에 따른 초기 대응 전략 수립에 활용될 수 있습니다. 사건 처리의 효율성을 높이는 데 기여할 수 있는 중요한 정보입니다.
