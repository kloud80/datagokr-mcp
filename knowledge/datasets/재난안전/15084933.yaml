description_portal: '○ 통계개요* 통계명 : 사회안전에 대한 인식도* 통계종류 : 통계청 사회조사의 서울시민 사회안전 인식도를 제공하는 지정·조사통계* 작성목적 : 사회적 관심사항, 삶의 질에 관한 사항 등 사회구성원의 주관적 관심사를파악하여 사회개발정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사대상 → 지방통계청 → 통계청* 공표주기 : 정기(2년 주기)* 공표범위 : 지역 - 서울시내용 - 서울시민의 사회안전 인식도에 대한 응답을 백분율로 제공○ 용어설명* 교통사고란 자동차 교통사고와 열차 전복, 비행기 추락, 선박침몰 등을 의미* 식량 안보(곡물가 폭등, 식량부족 등)란 바이오연료 생산 증가, 농산물 수입의존,유가폭등으로 인한 곡물가 폭등, 주요 곡창지대의 가뭄, 식량수급 불균형, 식량 자급률부족 등을 의미* 정보 보안(컴퓨터바이러스, 기타 해킹 등)이란 컴퓨터 바이러스 확산 및 개인 정보 도용등을 의미* 범죄 위험에는 절도, 사기, 강도, 폭행, 성폭력, 학교 폭력, 납치, 유괴, 살인 등 범죄와관련한 위험도를 의미* 국가안보는 전쟁가능성 및 북핵문제 등* 건축물 및 시설물은 건물붕괴 및 폭발 등* 먹거리는 불량식품 및 식중독 등○ 기 타* 조사대상 13세 이상 인구(2010년이전 15세 이상 인구)* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 우리 사회가 다음 각 분야별로 어느 정도 안전하다고 생각하십니까?'
