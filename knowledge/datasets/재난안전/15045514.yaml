summary_user: 광주 서부소방서 관내 다중이용업소 수를 업종별로 집계한 파일로, 2024년 12월 31일 기준 총 1,013개소를 일반음식점·유흥주점·노래연습장·PC방 등 업종 단위로 담는다(포털 설명 기준). 소방·안전 담당자나 분석가가 "서부소방서 관내에서 화재 안전관리 대상인 다중이용업소는 어떤 업종에 몰려 있나" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 소방서의 같은 현황이나 소방 부문 데이터(화재 발생, 소방용수 등)와는 업종명·소방서명을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 2024년 12월31일 기준 광주광역시 서부소방서 관내의다 중이용업소 업종별 현황등을 나타내는 파일데이터입니다. 총 현황은 1,013개소이며, 휴게음식점 52개소, 제과점2개소, 일반음식점 314개소, 유흥주점 224개소, 단란주점 71개소, 영화상영관 4개소, 학원 1개소, 목욕장업(찜질방업) 4개소, 게임제공업 20개소, 인터넷컴퓨터게임(PC방)50개소, 복합유통게임제공업2개소, 노래연습장 210개소, 산후조리원 1개소, 골프연습장 34개소, 안마시술소 6개소, 고시원업 9개소, 전화방및화상대화방 1개소, 수면방업 1개소, 만화카페업 1개소, 키즈카페업 5개소입니다
