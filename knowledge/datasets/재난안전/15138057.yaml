description_portal: 본 자료는 한국승강기안전공단에서 운영하는 승강기 교육센터 사용자들의 시스템 이용 이력에 관한 데이터입니다. 교육센터는 승강기 안전관리 인력과 일반 국민에게 온라인 학습 및 교육 관리 서비스를 제공하고 있으며, 본 데이터는 가입 사용자의 서비스 이용 과정에서 발생하는 주요 기록을 집계하여 제공합니다. 데이터에는 사용자 순번별 로그인 실패 이력 건수, 비밀번호 찾기 이력 건수, 과정집계현황 건수가 포함되어 있습니다. 또한 과정집계현황 데이터는 각 사용자가 수강 중인 과정의 건수를 보여주어 교육 참여 현황과 학습 활동을 종합적으로 파악하는 데 기여합니다.
