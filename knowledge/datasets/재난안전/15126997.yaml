summary_user: 화성도시공사가 수탁 운영하는 공공시설물(종합경기타운, 함백산추모공원, 주차장, 공원 등)에 설치된 CCTV를 설치 장소별로 담은 건별 원천 파일로, 주소·위도·경도, 설치목적, 카메라 대수, 영상 보관일수, 관리기관 연락처를 담는다(csv 약 4KB 규모). 시민이나 분석가가 '화성시 공공시설 주차장이나 공원 중 CCTV가 있는 곳은 어디이고 영상은 며칠 보관되는가'를 확인하거나 시설 내 안전 사각지대를 살피는 데 쓴다. 전역 조인 키는 없어 다른 CCTV·안전시설 데이터와는 주소나 위도·경도 좌표를 기준으로 공간 매칭해 이어 쓴다.
