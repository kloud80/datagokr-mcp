description_portal: '본 데이터는 화성도시공사가 수탁 운영하는 공공시설물(종합경기타운, 제부도, 함백산추모공원, 주차장, 공원 등) 내부에 설치된 "CCTV(영상정보처리기기) 설치 및 상세 운영 현황" 데이터입니다.시민의 안전한 시설 이용을 보장하고 범죄 예방 및 시설물 보호를 목적으로 운용되는 기기들의 정보를 포함하고 있으며, 실제 데이터셋의 주요 항목은 다음과 같습니다.1. 주요 제공 데이터 항목 (엑셀 데이터 기준)관리기관 및 시설명: 화성도시공사 내 해당 CCTV를 관리하는 구체적인 시설(예: 화성종합경기타운, 화성함백산추모공원 등) 정보를 제공합니다.설치 위치 및 용도: CCTV가 설치된 세부 장소(주차장, 로비, 승강기 등)와 설치 목적(범죄예방, 시설관리 등)을 명시합니다.기술 사양: 촬영 방면, 화소 수, 회전 및 고정 여부 등 데이터의 품질과 감시 범위를 파악할 수 있는 사양 정보를 포함합니다.보관 및 관리: 영상 데이터의 보관 일수와 관리 부서 연락처를 제공하여 행정적 투명성을 확보합니다.2. 데이터의 전략적 가치 및 활용 분야안전 관리 체계 고도화: 시설별 CCTV 배치 현황을 분석하여 안전 사각지대를 도출하고, 효율적인 순찰 및 감시 경로를 설계하는 데 활용됩니다.스마트 시티 연계: 지능형 관제 시스템 구축 시 기초 자산 리스트로 활용되어, 사고 발생 시 신속한 대응을 위한 위치 기반 정보를 제공합니다.시민 알 권리 충족: 공공기관이 운영하는 영상 장치의 위치와 목적을 투명하게 공개함으로써, 개인정보 보호 원칙을 준수하고 공공 서비스의 신뢰도를 높입니다.'
