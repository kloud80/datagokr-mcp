summary_user: 재난안전데이터 공유플랫폼이 제공하는 재난대응기관 목록으로, 기관별로 대응기관코드, 전체기관명·기관명, 서열·차수, 최상위·차상위·대표기관코드, 대·소분류코드를 담으며 범위는 전국이고 공간 정보는 없다. 재난 대응 체계를 분석하는 사람이 특정 기관이 어느 상위기관 아래 몇 차수에 속하는지 확인할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못해, 기관명 매핑이나 같은 기관 코드 체계를 쓰는 재난특보·대피시설·소방 등 공유플랫폼 데이터와만 연결된다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 재난대응기관 정보로, 대응기관코드, 검색유형, 소분류코드, 서열, 전체기관명, 기관명, 차수, 최상위기관코드 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
