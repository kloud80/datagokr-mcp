description_portal: ○ 임시주거시설은 재해구호법 제4조 및 제4조의2에 근거하여, 재해로 인해 이재민 등이 주거시설을 상실하거나 사실상 주거가 불가능한 경우 이재민 구호를 위하여 지자체에서 사용하는 시설을 의미합니다.○ 개방 데이터는 각 지자체에서 재난 발생에 대비하여 사전에 지정하여 관리하고 있는 임시주거시설의  시도별 현황(수용면적 및 인원 등)을 제공합니다.○ 참고로 "국민재난안전포털"을 통하여 이재민 임시주거시설 및 지진 겸용 임시주거시설(내진설계가 적용되어 지진 시에도 활용 가능한 임시주거시설)을 검색 및 확인할 수 있습니다.
