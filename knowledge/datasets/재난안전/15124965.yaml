summary_user: 재해로 집을 잃은 이재민을 위해 지자체가 미리 지정해 둔 임시주거시설을 시도별·시설구분별로 묶은 집계 파일로, 개소 수와 면적(제곱미터), 수용능력을 담는다(약 3KB 규모의 CSV). 지역 재난 대비를 점검하는 분석가나 담당자가 "우리 시도에 이재민을 몇 명까지 수용할 임시주거시설이 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 인구·재난 피해 통계 같은 다른 데이터와는 시도 이름(지역)을 맞춰 연결해야 한다.
limits: 시도 단위 집계라 개별 시설의 위치·좌표나 이름은 담지 않으며, 개별 시설 검색은 국민재난안전포털을 써야 한다. 표준 행정코드 같은 조인 키가 없어 다른 데이터와 붙일 때 지역명 매핑이 필요하다.
