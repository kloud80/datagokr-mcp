description_portal: CSV 파일에는  관로검사 구간의 구간명과 차량번호, 차량 내 구비되어 있는 휴대전화의 번호, 제보 방송국(TBN)명, 제보 전화번호가 기재되어 있습니다.한국도로교통공단(TBN)과 협업을 통해 대국민 대상 사고예방 및 피해 최소화를 위한 정보제공 목적으로 재난안전통신원을 운영하고 있습니다.재난안전통신원의 역할은 가스배관 주변 가스누출, 배관 노출, 도로 유실 및 침하, 사회재난 또는 자연재난 발생 시 한국도로교통공단(TBN)에 전화 제보를 통해 해당 정보를 제공하는 것이며, 재난안전통신원은 관로검사 구간 직원 대상과 일반 국민 대상 총 2가지 유형으로 구분됩니다.각 지사별 구간 정보가 기재되어 있어 재난안전통신원의 운영 체계를 파악하는 데 유용합니다.
