summary_user: 한국가스기술공사가 한국도로교통공단(TBN)과 협업해 운영하는 재난안전통신원의 관로검사 구간 정보를 관할지사·구간별로 담은 목록 파일(CSV 약 8.9KB)로, 구간명·차량번호·제보 방송국·제보 전화번호가 행 단위로 기재된다. 지역 주민이나 안전관리 담당자가 '우리 지역 가스배관 주변에서 가스누출이나 도로 침하를 발견하면 어느 TBN 방송국 번호로 제보하나'를 확인하거나, 지사별 통신원 운영 체계를 파악하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 데이터와는 관할지사·구간명·방송국명 같은 이름을 맞춰 연결해야 한다.
