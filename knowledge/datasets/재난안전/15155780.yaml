summary_user: 전국 특정소방대상물 중 숙박시설을 건물 단위로 담는 API로, 검증 호출에서 71행이 수신됐고 사용승인 기간은 2002-01-01부터 2025-09-08까지다. 지역별 화재위험 분석이나 숙박시설 안전점검 대상 선별에서 "우리 지역의 대형화재취약 숙박시설은 어디인가"를 확인하는 데 쓴다. 주소(bassAdres)와 X·Y좌표를 키로 지도나 다른 소방 데이터(소방용수·119안전센터 등)와 위치 기준으로 이어 쓰며, 건축물일련번호는 있으나 조인 키로 지정된 것은 아니다.
limits: 검증 호출 조건(useAprvY=2002)에서 수신한 71행이 전체 건수여서 실제 전국 숙박시설 전체 규모로 단정하기 어렵고, 최신 행 날짜(2025-09-08)도 이 호출 조건 기준이라 데이터 자체의 최신성과 다를 수 있다. 개발계정은 일 1,000회 호출 제한이 있으며 serviceKey가 필요하다.
