summary_user: 경상북도 청송군 관내 산사태취약지역을 대상지 한 곳씩 담은 파일로, 조사지 주소(읍면동·리·지번), 도·분·초 단위 위도·경도, 취약지역 유형, 국유·사유 소유 구분을 필지 단위로 담는다(CSV 약 31KB). 주민이나 토지 매입을 검토하는 사람이 '이 지번 또는 우리 마을 근처가 산사태취약지역에 들어가는가'를 확인하거나, 방재 담당자가 사방사업 대상지를 고르는 데 쓴다. 전역 조인 키는 없어 시군구·읍면동·리·지번 같은 주소 문자열이나 좌표로 다른 재난 위험지역·대피시설·토지 정보와 맞춰 이어 쓴다.
description_portal: 경상북도 청송군 관내에는 급경사지 분포, 지질·토양의 취약성, 계류 발달, 집중호우 및 국지성 호우 증가, 산불 피해지 확산 등 복합적인 지형·환경적 요인으로 인해 산사태 및 토석류 발생 위험이 상존하는 지역이 다수 분포하고 있습니다. 이에 따라 인명 및 재산 피해 예방을 위한 선제적 관리와 체계적인 정보 제공의 중요성이 지속적으로 강조되고 있습니다.이에, 경상북도 청송군 관내 산사태 위험지역 및 산사태취약지역에 대한 정보를 체계적으로 제공하기 위하여, 각 대상지별 주소(소재지), 위치정보(위도·경도), 토지 소유 구분(국유지·사유지) 등을 안내합니다. 또한,본 정보는 급경사지, 계류 인접 지역, 산불 피해지 등 산사태 발생 가능성이 높은 지역을 사전에 파악하여 인명 및 재산 피해를 예방하고, 재해 발생 시 신속한 대응과 효율적인 산림재해 관리를 도모함과 동시에, 산사태 예방사업 및 사방사업 추진을 위한 기초자료로 활용되고 있습니다.
