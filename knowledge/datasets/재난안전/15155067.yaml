    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[ROAD_NM_WHOL_ADDR::LIKE]
        required: false
        desc: 도로명전체주소 을(를) 포함하는 값
      - name: cond[FCLT_NM::LIKE]
        required: false
        desc: 시설명 미만의 값
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 이하의 값(YYYYMMDDHHMMSS)
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
      - name: cond[DSGN_YMD::GTE]
        required: false
        desc: 지정일자 이상의 값(YYYYMMDD)
      - name: cond[DSGN_YMD::LT]
        required: false
        desc: 지정일자 미만의 값(YYYYMMDD)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
