summary_user: 전국 자치단체가 관리하는 민방위대피시설을 시설 한 곳당 한 행으로 담은 건별 원천 데이터로, 전체 18,833건에 시설명·시설구분·주소·지상/지하 위치·면적·최대수용인원·운영상태가 들어 있다. 시민이 "우리 동네에서 재난 시 어디로 대피하나"를 찾거나 분석가가 지역별 수용 규모를 따질 때 쓴다. 도로명·소재지 주소(ROAD_NM_WHOL_ADDR, LCTN_WHOL_ADDR)와 위경도 좌표(LAT_EPSG4326)가 조인 키라서 지도, 다른 대피·구호시설(지진/해일 대피장소, 쉼터 등) 데이터와 주소·좌표로 이어 쓴다.
description_portal: '민방위대피시설 데이터는 민방위사태가 발생 즉시 대피할 수 있는 공간으로 사용되는 시설에 대한 정보 데이터로 시설명, 시설구분, 소재지 주소 등 기본 정보와 함께 시설 위치(지상·지하), 시설면적 및 최대 수용인원 등 시설 규모 관련 데이터를 제공합니다.또한 운영상태, 지정·해제 이력, 다양한 좌표체계 기반 위치 정보와 데이터 갱신 시점 등 관리 데이터를 함께 제공합니다. - 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 민방위대피시설정보를 일괄 취합하여 전국 데이터로 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 행정안전부 민방위과 / 044-205-4367 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
