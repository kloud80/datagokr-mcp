summary_user: 부산광역시 안에 설치된 폭염 그늘막을 한 곳씩 관리번호·설치일자·상세주소·x/y좌표로 담은 개별 위치 목록이다. 시민이 여름철 집이나 출근길 근처 횡단보도에 그늘막이 어디 있는지 찾거나, 분석가가 그늘막이 부족한 구역을 찾아 폭염 대응 계획에 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소 문자열이나 좌표 근접으로만 이어 쓰며, 무더위쉼터 같은 다른 대피·구호시설 위치 자료와 지도에서 겹쳐 보는 방식이 현실적이다.
description_portal: 본 데이터는 여름철 폭염으로 인한 시민의 온열질환 예방을 위해 지자체에서 설치·운영 중인 폭염 그늘막의 설치 위치 현황을 제공합니다.관리번호, 설치일자, 상세주소, 위치(좌표) 를 포함하고 있으며 폭염 대응 정책 수립, 시민 편의 증진을 위한 기초자료로 활용될 수 있다.
