description_portal: 본 데이터는 2024년 검거된 피의자들의 공범 유무 및 관계를 범죄 유형별로 집계한 통계입니다. 단독범행 여부를 비롯하여 공범 관계가 가족, 친척, 이웃, 친구, 선후배, 동료, 애인 등인 경우를 상세히 구분하여 제공합니다. 2017년 이후 중단되었던 공표를 데이터 개방 활성화 정책에 따라 재개하였으며, 기존 '범죄자'에서 '피의자'로 목록 명칭을 변경하여 연 단위로 최신화할 예정입니다. 이 데이터는 범죄의 집단화 경향이나 사회적 관계에 따른 범죄 패턴을 분석하는 데 유용하며, 수사 전략 수립 및 범죄 예방을 위한 기초 통계로 활용 가치가 매우 높습니다.
