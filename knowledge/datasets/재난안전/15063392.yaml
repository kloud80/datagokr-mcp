description_portal: 해당 통계는 최근 5년간(2020년에서 2025년까지) 해양경찰청에서 나포한 불법조업 외국어선에 대한 지역별(관할서별), 연도별 나포 통계 자료 입니다. 불법조업이란 국가간 협약에 의하여 정해진 조업조건을 위반하거나, 무허가조업을 하는 경우에 해당합니다. 위 통계에서는 각 연도에 따라 어느 관서(경찰서)에서 각 몇 척을 나포하였는지 알 수 있으며, 인천, 서특단, 평택, 태안은 중부지방해양경찰청에 속하고, 군산, 목포는 서해지방해양경찰청, 제주, 서귀포는 제주지방해양경찰청, 통영, 부산, 울산은 남해지방해양경찰청, 동해, 포항은 동해지방해양경찰청에 속합니다.
