summary_user: 대전광역시 유성구 관내에서 발생한 화재를 건별로 담은 파일로, 발생일시·사상자수·피해액·화재유형·발화요인·장소유형·관할소방서와 행정동·법정동 위치를 함께 기록한다. 주민이나 구 안전 담당자가 '유성구에서 어느 동, 어떤 장소에서 어떤 원인의 화재가 자주 나고 피해가 큰가'를 따져 화재 예방·안전관리계획을 세우는 데 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 인구·건물·시설 데이터나 소방용수·비상소화장치 위치 등 다른 소방 데이터와 이어 쓰고, 행정동코드로 행정동 단위 통계와도 맞출 수 있다.
description_portal: 대전광역시 유성구 관내 화재발생 현황에 대한 데이터를 제공합니다.해당 데이터는 발생일시, 사상자수, 관할소방서, 화재유형, 피해액, 발화요인, 장소유형, 시도이름, 시군구이름, 행정동이름, 법정동이름 등의 항목을 제공하며, 총 937개의 행으로 구성되어 있습니다.해당 데이터는 지역별 화재 발생 특성과 안전 취약 요인을 분석하는 데 활용할 수 있으며,화재 예방 정책 수립, 안전관리계획 수립, 생활안전 환경 개선 등에 활용 가능합니다.이 외에도 지역 안전도 분석, 재난 대응 솔루션 연구 등 다양한 분야에 활용할 수 있습니다.
