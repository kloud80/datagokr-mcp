summary_user: 재난안전데이터 공유플랫폼이 제공하는 전국 병원 정보를 기관 한 곳당 한 건으로 담으며, 주소·병원분류·응급의료기관 구분·응급실 운영 여부와 전화번호, 요일별·공휴일 진료 시작·종료 시각, 주말 운영 여부, 경위도 좌표를 포함한다. 주민이 오늘 문을 연 가까운 응급실이 어디인지 찾거나, 재난 대응 담당자가 지역별 응급의료기관 분포를 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어 기관명·주소 매칭이나 같은 기관의 코드로만 잇고, 좌표(HSPTL_LAT 등)를 써서 대피·구호시설이나 소방 데이터와 공간으로 겹쳐 볼 수 있다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 병원 정보로, 주소, 병원분류, 병원분류명, 응급의료기관코드, 응급실운영여부, 간이약도, 기관명, 대표전화, 응급실전화 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
