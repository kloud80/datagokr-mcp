summary_user: 전라남도 지역 소방시설 공사업체를 업체 한 곳당 한 행으로 담은 파일 데이터로, 세부지역·상호·주소·업종·분야·소방시설업 등록번호·등록일자·폐업여부를 포함한다(csv 약 56KB). 건물주나 관리자가 "우리 시군에서 영업 중인 소방시설 공사업체가 어디인지, 폐업하지 않았는지"를 확인하거나, 분석가가 지역별 업체 분포를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·상호 이름 매칭이나 세부지역(시군) 단위로만 이어 쓰며, 같은 소방 부문의 특정소방대상물·119안전센터 데이터와 지역 기준으로 비교한다.
description_portal: '- 전라남도 소방시설 공사업체 현황 (상호명, 주소, 소방시설업 등록번호, 등록일자, 폐업여부)에 관한 데이터를 조회하실 수 있게 제공하고 있습니다.- 소방시설 공사업체는 소방시설의 설치 및 유지보수를 전문으로 하는 업체로, 전라남도 내에도 여러 업체가 활동하고 있습니다. 이들 업체는 대한소방협회에 등록되어 있으며, 관련 법규에 따라 인증을 받은 업체들입니다.- 업체 선정 시에는 사업자 등록증, 소방시설 공사 면허증, 과거 실적 등을 확인하여 신뢰할 수 있는 업체를 선택하는 것이 중요합니다.- 전라남도 내 소방시설의 설치 및 유지관리는 다음과 같은 법규 및 지침에 따라 이루어집니다- 소방시설 설치 및 유지관리 규정 : 소방시설의 설치 기준, 유지관리 방법 등을 규정한 법령입니다.- 소방안전관리 지침 : 소방안전관리자의 역할 및 책임, 소방훈련 등의 내용을 포함한 지침입니다.'
