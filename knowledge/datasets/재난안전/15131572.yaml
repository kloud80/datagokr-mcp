summary_user: 경기도 지진조기경보시스템이 경보를 보낼 통보구역의 경계 지점을 순번(no)과 위도·경도 좌표로 담은 자료로, 점들을 순서대로 이으면 통보구역 다각형이 된다. 지자체 재난 담당자나 분석가가 "지진 조기경보가 발령되면 경기도 안에서 어느 범위까지 경보가 전달되는가"를 지도로 확인할 때 쓴다. 행정코드 같은 전역 조인 키는 없어서, 다른 재난·대피시설 데이터와는 좌표를 GIS에서 공간 중첩하는 방식으로만 이어 쓴다.
description_portal: 「지진조기경보시스템 통보구역 경계 좌표」 데이터는 경기도가 제공하는 지진 대응 기반 자료로, 지진 발생 시 조기경보를 전달할 통보구역의 경계 지점을 위도·경도 좌표로 나타낸 것입니다. 주요 항목은 순번, 위도, 경도로 구성되어 있으며, 이는 특정 통보구역의 다각형 경계를 정의하는 데 활용됩니다.이 데이터는 지진조기경보시스템이 특정 지역에 정확히 경보를 송출하기 위한 기초 자료로 사용되며, GIS(지리정보시스템)와 연계하여 통보구역을 지도상에 시각화할 수 있습니다. 이를 통해 지진 발생 시 어느 지역에 경보가 발령되는지를 파악할 수 있습니다.
