summary_user: 한국산업안전보건공단이 인증한 건설업 안전보건경영시스템(KOSHA MS) 인증 사업장 목록으로, 한 행에 인증 한 건씩 인증구분(전문건설·종합건설·발주기관), 인증번호, 사업장명, 인증연도를 담은 전국 단위 파일(CSV 약 8KB)이다. 건설사나 발주기관 담당자가 특정 건설업체가 KOSHA MS 인증을 받았는지, 언제 받았는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: '한국산업안전보건공단에서 수행하는 건설업 안전보건경영시스템 인증 현황에 대한 자료로인증번호, 사업장명, 인증연도 등에 대한 칼럼을 제공하고 있습니다.현장 중심의 재해예방 사업의 한계 극복을 위해 건설업체 본사 중심의 안전보건경영시스템 인증 및 보급으로 건설업 자율안전보건활동 촉진하기 위한 사업입니다.(전문 : 전문건설업체, 종합: 종합건설업체, 발주: 발주기관)*추진 경과2003년 2월 : KOSHA 18001 인증으로 명칭 변경2019년 7월 : KOSHA-MS로 인증기준 전환*산업안전보건법 제4조제1항제4호사업주의 자율적인 산업 안전 및 보건 경영체제 확립을 위한 지원'
