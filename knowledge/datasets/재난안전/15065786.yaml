description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2020년 기준 경찰청에서 집계한 아동안전 수호천사 개소별 운영 현황을 제공하는 공공데이터입니다. 야쿠르트 배달원, 집배원, 모범택시기사, 태권도 사범 등 다양한 직업군을 기반으로 구성된 아동 보호 활동 개소 수가 포함되어 있으며, 지역사회에서 아동 대상 범죄 예방 및 위기 대응을 위한 협력 네트워크 운영 현황을 보여줍니다. 이 데이터는 경찰의 아동 보호 민간 협력체계 강화, 지자체의 참여기관 확대 전략, 연구기관의 사회적 안전망 분석, 공공기관의 아동 대상 예방교육 홍보 기획 등에 활용됩니다.
