summary_user: 광주 남부소방서 관내 다중이용업소를 업소별로 담은 파일로, 업소마다 상호, 주소, 관할 119안전센터, 영업상태, 데이터 기준일자가 한 행에 들어 있다. 사업자나 주민이 '우리 동네의 이 노래방·음식점·학원이 소방 관리 대상인 다중이용업소인지, 어느 안전센터 관할인지'를 확인하거나, 분석가가 안전센터별 다중이용업소 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 상호를 매칭하거나 관할센터 이름으로 소방서·119안전센터 자료에 붙여 쓴다.
description_portal: '광주광역시 남부소방서 관내 다중이용업소 현황입니다.다중이용업소는 「다중이용업소의 안전관리에 관한 특별법」에 따라 불특정 다수인이 이용하는 영업 중 화재 등 재난 발생 시 생명ㆍ신체ㆍ재산상의 피해가 우려되는 대통령령으로 정하는 영업을 의미합니다. 주요 다중이용업소의 종류로는 휴게음식점, 단란주점, 유흥주점, 비디오물소극장, 복합영상물제공업, 학원, 목욕탕 등이 있으며, 이러한 영업은 규모에 따라 안전 시설 설치 및 유지 의무가 있습니다. [법적 근거 및 정의 ]법률: 「다중이용업소의 안전관리에 관한 특별법」정의: 불특정 다수인이 이용하는 영업 중, 화재 등 재난 발생 시 생명ㆍ신체ㆍ재산상의 피해가 발생할 우려가 높은 것으로서 대통령령으로 정하는 영업.[다중이용업소의 종류 (예시)]법률 및 시행령에 따라 다중이용업소로 분류되는 업종 및 기준은 다음과 같습니다.영업장 규모 기준:휴게음식점, 제과점, 일반음식점: 영업장 바닥면적의 합계가 100㎡ 이상인 경우. 단, 지하층에 설치된 경우는 66㎡ 이상인 경우. 수용인원 기준:학원: 수용인원이 300명 이상인 경우. 시설물 기준:목욕탕, 찜질방: 물로 목욕할 수 있는 시설 부분을 제외한 수용인원이 100명 이상인 경우. 기타 업종 (시행령 별표1 참고):단란주점, 유흥주점 비디오물소극장, 복합영상물제공업 노래연습장 안마시술소, 헬스장, 수영장 등의 체력단련장: 영업장 바닥면적 합계가 300㎡ 이상인 경우. 의료기관: 수용인원이 100명 이상인 의료기관. 의원, 치과의원, 한의원, 접골원 중 수술 또는 시술을 하는 경우 . [주요 의무 사항]안전시설 설치 및 유지:소방시설, 비상구, 내부 피난통로 등 안전시설을 법률 및 소방시설법의 기준에 따라 설치하고 유지해야 합니다. 안전시설 등의 설계도서 신고:안전시설 등을 설치하기 전에 소방본부장 또는 소방서장에게 설계도서를 첨부하여 신고해야 합니다. 화재배상책임보험 가입:화재로 인한 피해 보상을 위해 화재배상책임보험에 가입해야'
