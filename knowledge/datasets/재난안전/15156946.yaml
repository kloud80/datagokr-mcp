description_portal: 건설공사 참여자 안전관리 수준평가는 발주청, 건설사업관리자, 시공자 등 건설공사 참여자들의 안전관리 역량을 평가하여 자발적 역량 강화와 안전사고 감소를 유도하는 제도이며, 총공사비 200억 원 이상 공공건설공사가 대상이고, 건설공사 안전관리 종합정보망(CSI)을 통해 자료 제출 및 평가가 진행되며, 평가 결과는 공개되어 참여자들의 안전관리 수준 향상에 기여합니다.국토안전관리원 건설안전평가실에서 실시하는 건설공사 참여자의 안전관리 수준평가 대상 현장별 점수 및 건축, 토목별 현장 분류에 대한 지표임을 알려드립니다.
