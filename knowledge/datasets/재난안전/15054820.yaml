summary_user: 광주광역시 소방안전본부 119종합상황실의 출동 신고접수 자료 중 화재 항목만 뽑아 2024년 1월부터 2025년 12월까지 24개월의 월별 화재 출동 신고 건수와 전년 대비 증감율(%)을 정리한 월 단위 집계 파일(csv, 510 bytes)이다. 소방 행정 담당자나 분석가가 '봄철 건조기나 여름철에 화재 신고가 전년보다 얼마나 늘거나 줄었나'를 확인해 계절별 소방력 운용과 예방 정책을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 월(연도 컬럼, 매월 1일 표기)을 기준으로 맞추거나 같은 기관의 소방 데이터와 이름으로만 이어 쓴다.
description_portal: 본 데이터셋은 광주광역시 소방안전본부 119종합상황실의 출동 신고접수 자료 중 화재 항목만을 추출하여 2024년 1월부터 2025년 12월까지 24개월간 월별 추이를 정리한 것이다. 컬럼은 연도(YYYY-MM-DD 형식, 매월 1일로 표기), 화재(해당 월 화재 출동 신고 건수), 전년 대비 화재출동 증감율(%) 세 가지로 구성된다. 2024년 연간 화재 출동은 8,747건, 2025년은 8,552건으로 전년 대비 195건(2.2%) 감소하였으며, 월별로는 2025년 7월이 1,073건으로 최다, 9월이 519건으로 최저를 기록하였다. 특히 6월(−33.6%)과 9월(−35.7%)에 큰 폭의 감소세를 보인 반면, 2~3월은 봄철 건조기 영향으로 20% 이상 증가하였다. 본 자료는 화재 발생 추이 분석, 계절별 소방력 운용 계획, 예방 정책 수립 등에 활용 가능하다.
