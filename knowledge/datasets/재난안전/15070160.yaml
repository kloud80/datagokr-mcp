description_portal: 이 공공데이터는 2015년부터 2024년까지 강원특별자치도 내에서 발생한 불법폭력시위 및 그에 따른 경찰 대응과 피해 현황을 정리한 자료입니다. 주요 항목은 불법폭력 집회·시위 횟수, 화염병 사용 시위의 횟수 및 화염병 사용 수량, 최루탄 사용 횟수 및 수량, 그리고 경찰관 부상자 수로 구성되어 있습니다. 이 데이터는 사회적 갈등 상황에서의 공공안전 유지 실태, 집회·시위 대응력, 물리적 충돌의 심각성 등을 분석하는 데 활용됩니다. 경찰청, 지자체, 인권·안전 관련 기관, 연구기관 등에서 법질서 유지 정책 수립, 시위 대응 매뉴얼 개선, 경찰관 안전관리 대책 마련 등을 위한 기초자료로 활용 가능합니다
