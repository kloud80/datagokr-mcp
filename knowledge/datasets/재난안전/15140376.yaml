description_portal: '국토안전관리원에서 관리하는 기반시설관리법 도로 시설에 대해 17개 지자체 소재지 별 점검진단 연간 집계 금액에 대한 파일데이터(중앙행정기관, 광역지자체 포함). 또한 예시로 데이터 중 경상남도로 되어 있는 금액은 합산 금액이 아니며, 소재지가 "도"로 되어있는 시설에 대한 점검진단 금액임을 유의하시길 바랍니다.기반시설관리법은 공식적으로 **「지속가능한 기반시설 관리 기본법」**을 의미하는 약칭으로. 기반시설의 체계적인 유지관리와 성능개선을 통해 국민 안전과 편의를 증진하고 국가 경제 발전에 기여하는 것을 목적으로 하는 법률입니다. 이 법은 2020년 1월 1일부터 시행되었습니다. 주요 내용목적: 기존의 사후 대응 방식에서 벗어나, 기반시설의 노후화에 대비하여 선제적이고 체계적인 관리 및 성능개선을 도모합니다.적용 대상: 「국토의 계획 및 이용에 관한 법률」 상 기반시설 중 대통령령으로 정하는 15종 시설물(도로, 철도, 공항, 항만, 상하수도, 전기, 가스, 통신, 공동구 등)에 적용됩니다.'
