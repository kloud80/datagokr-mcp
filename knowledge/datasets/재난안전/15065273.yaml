summary_user: 창녕군 내 소방용수시설(물 공급지점)을 한 건씩 담은 원장 파일로, 관할 센터(창녕·남지·영산·부곡)와 지역대, 관리번호, 수리위치, 주변 대상물, 수리형식(지상소화전·지하소화전·비상소화장치)을 기록하며 포털 설명상 관리번호는 총 440개다. 소방·방재 담당자나 주민이 '우리 마을이나 특정 건물 근처에서 쓸 수 있는 소화전·비상소화장치가 어디에 있고 어느 센터가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 소방 데이터(119안전센터, 화재 발생 건별 자료 등)와는 센터명·지역 이름을 맞춰 연결해야 한다.
limits: 좌표나 표준 행정코드 같은 전역 조인 키가 없어 지도 표시나 다른 기관 데이터와의 결합은 위치 문자열·센터명을 직접 매핑해야 한다. 범위는 창녕군 한 곳이라 다른 시군 소방용수시설은 담지 않는다.
