summary_user: 광주소방학교 호흡보호장비정비실이 보유·운영하는 공기충전기, 면체 세척기, 공기성분분석 검사기 같은 기자재를 품목별 수량으로 담은 소규모 목록 파일입니다(포털 설명 기준 2024년 12월 31일 현재 22종 56점). 소방 장비 담당자나 다른 소방학교·본부 실무자가 공기호흡기 정비실에 어떤 장비를 몇 점 갖추었는지 비교하거나 장비 확충을 계획할 때 참고로 쓴다. 컬럼이 연번·제품·수량뿐이고 전역 조인 키가 없어 다른 데이터와는 품목 이름을 직접 맞추거나 같은 기관의 소방 장비 자료와 나란히 보는 방식으로만 이어 쓴다.
description_portal: 광주소방학교 호흡보호장비정비실에서 보유, 운영중인 공기충전기 등 기자재 현황을 제공합니다.(2024. 12. 31. 기준)호흡보호장비정비실 내 기자재는 총 22종 56점이며, 세부적으로 공기충전기, 스케일제거장치, 내시경 검사기, 공기성분분석 검사기, 통합관리프르그램, 공기저장탱크, 충전접결구, 면체밀착도 검사기, 안전밸브 탈부착기, 용기텀블러, 작업대, 면체건조기, 면체 초음파 세척기, 용기 세척건조기, 면체보관대, 용기보관대, 공기호흡기 예비세트, 바코드 관리시스템, 업무용 PC, 냉장고, 용기운반대, 공기청정기가 있습니다.각 기자재 별 수량 등 세부사항은 데이터파일을 참조하여 주시길 바랍니다.
