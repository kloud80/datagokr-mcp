description_portal: '남부소방서 수난인명구조함 현황 입니다.- 상세내용: 관내 수난인명구조함 설치 위치 및 관리부서, 담당자 전화번호 등 정보 데이터 제공수변을 인접한 장소에 수난사고가 발생했을 때 인명구조에 사용할 수 있도록 구명조끼와 구명환, 로프가 갖춰져 있는 보관함에 대한 현황 데이터입니다.해당 데이터에는 대상명, 위치, 지역여건, 소방서와의 거리, 소요시간, 관리자, 전화번호 등이 기재되어 있으며, 보관하고 있는 장비에 대한 설명이 기재되어있습니다.남부소방서에서 관리하고 있는 수난인명구조함은 광주 남구 승촌보 일대에 위치하고 있으며, 수난 사고의 위험성은 굉장히 낮은 편이지만 만약의 사태에 대비하여 수난인명구조함을 지속적으로 관리 유지하고 있습니다.'
