summary_user: 광주 남부소방서가 관리하는 수난인명구조함(구명조끼·구명환·로프 보관함)의 설치장소, 설치연월, 인출형태, 담당부서와 연락처를 함 단위로 담은 작은 파일(CSV 862바이트)이다. 승촌보 일대 등 수변에서 수난사고가 났을 때 가까운 구조함이 어디 있고 누구에게 연락하면 되는지 확인하려는 주민·안전관리 담당자의 질문에 쓴다. 전역 조인 키가 없어 다른 소방서의 수난인명구조함 현황이나 대피·위험지역 데이터와는 설치장소 이름이나 같은 기관 기준으로만 맞춰 이어 쓴다.
limits: 표준 조인 키와 좌표가 없어 지도 위 위치 결합이나 다른 데이터와의 자동 연계는 어렵고, 설치장소 문자열을 직접 맞춰야 한다. 범위는 남부소방서 관할분에 한정되므로 시도 전체 현황으로 볼 수 없다.
