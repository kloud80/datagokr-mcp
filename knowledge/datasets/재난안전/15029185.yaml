summary_user: 교통사고가 밀집해 발생한 사고다발지역을 지역별 한 행으로, 사고건수·사상자수·사망자수·중상자수·경상자수와 폴리곤 정보까지 담은 표준데이터이며 검증 시 12,780행을 받았다. 운전자나 지자체 교통안전 담당자, 분석가가 우리 지역 어느 곳에 사고가 몰려 있고 인명 피해가 얼마나 큰지 확인하는 데 쓴다. 위도·경도 좌표(coord)로 다른 좌표 보유 데이터와 이어 쓰며, 도로·경찰 교통사고 데이터와는 같은 개념으로 분류돼 함께 비교할 수 있다.
