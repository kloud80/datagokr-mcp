summary_user: 시흥도시공사가 설치·운영하는 안전비상벨을 한 대씩 기록한 건별 목록으로, 설치목적·장소유형·위치, 도로명·지번 주소와 위도·경도, 경찰·경비업체·관리사무소 연계 여부, 설치연도를 담는다(CSV 파일 약 13KB). 시민이나 지역 안전 분석가가 '우리 동네 공원·화장실의 비상벨이 어디 있고 경찰과 바로 연결되는가'를 확인하거나 비상벨 공백 지역을 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 매칭해 CCTV·보안등 같은 방범 인프라 자료와 겹쳐 본다.
description_portal: 시흥도시공사에서관리하는 비상벨 현황을 공개합니다. 시흥도시공사는 시민들의 안전과 범죄 예방, 긴급 상황에 신속하게 대응하기 위해 설치·운영 중인 비상벨에 대한 현황자료를 시민에게 공개합니다. 본 공개 자료에는 비상벨의 전반적인 설치 정보와 관리 현황이 포함되어 있으며, 누구나 쉽게 확인할 수 있도록 항목별로 정리되어 있습니다. 비상벨의 위치, 목적, 유형, 장소, 소재지 주소, 위도, 경도, 연계여부,경찰연계여부, 경비업체연계유무, 관리기관명,부서명,전화번호, 설치연도, 기준일자 등을 공개합니다.
