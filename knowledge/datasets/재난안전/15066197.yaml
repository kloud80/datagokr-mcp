summary_user: 인천광역시에서 발생한 재난·안전사고의 발생 건수와 피해 규모를 현황 항목별로 나누어 연도(2021·2022)별로 정리한 집계 통계 파일로, 건별 사고 원천자료가 아니며 파일 크기는 808바이트 정도로 작습니다. 연구자나 시민단체가 인천의 재난 유형별 피해가 최근 연도 사이에 늘었는지 줄었는지 확인하고 예방 대책의 근거를 찾을 때 쓴다. 전역 조인 키가 없으므로 교통사고 다발지역 표준데이터나 재난 위험지역·대피시설·소방 데이터와는 지역명과 항목명을 직접 맞춰 이어 쓴다.
description_portal: 인천광역시 재난사고 발생 및 피해현황 공공데이터는 인천 지역에서 발생한 각종 재난 및 안전사고에 대한 통계 정보를 담고 있는 중요한 자료입니다. 이 데이터는 시민들의 안전을 위한 정책 수립과 재난 대응 역량 강화를 목적으로 공개되며, 재난 유형별 피해 규모와 발생 현황을 체계적으로 파악할 수 있도록 돕습니다.이 데이터는 연구자, 정부 기관, 그리고 시민단체가 인천의 재난 취약성을 분석하고, 예방 대책을 마련하며, 재난 발생 시 효과적인 대응 방안을 모색하는 데 중요한 근거 자료가 됩니다. 또한, 일반 시민들도 자신의 거주 지역 안전 현황을 확인하고 경각심을 가질 수 있는 유용한 정보를 제공합니다.해당 데이터는 국가통계포털(KOSIS) 자료를 참고하였습니다.
