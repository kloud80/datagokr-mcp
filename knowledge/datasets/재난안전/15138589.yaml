description_portal: 서울교통공사에서 운영 중인 1~8호선 276개 역사에 비치하여 운영 중인 화재용 긴급 대피 마스크 관련 데이터입니다.(2026년 2월 기준). 해당 데이터에는 역별 화재용 긴급 대피 마스크의 총 비치 수량 및 유효기간(5년 이상)이 포함되어 있습니다. 화재용 긴급 대피 마스크의 경우 도시철도 역사 내 법적 의무 비치 물품은 아니나 현재 공사 내부 기준에 따라 지상 역사를 제외하고 역별 150~600개 내외를 비치하여 화재 재난 상황에 대비하고 있습니다. 물품 구매는 산업표준화법 제10조에 따라 5년마다 산업표준심의위원회에서 정하는 KS 규격 표준 인증 받은 제품으로 한정하고 있습니다.
