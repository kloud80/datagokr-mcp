summary_user: 부산광역시 남구가 지정한 민방위 비상대피시설과 비상급수시설을 시설 한 곳당 한 행으로 담은 파일로, 포털 설명 기준 대피시설 94개소와 급수시설 44개소(총 138개소)의 시설구분·동명·시설명·소재지·시설형태·규모 또는 용량을 담는다. 남구 주민이 공습·포격 같은 비상시에 가까운 대피시설이나 급수시설이 어디인지 찾을 때, 또는 분석가가 동별 대피·급수 시설 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 동명·소재지 주소를 매핑하거나 같은 기관(남구) 데이터끼리만 이어 쓴다.
description_portal: 부산남구는 민방위 사태 발생에 대비하여 주민의 생명 및 재산 보호를 위한 민방위 비상대피시설 94개소와 비상시 지역주민대상 원활한 용수 공급을 위한 비상급수시설 44개소를(총 138개소) 지정확보하고 있습니다.남구는 민방위 시설들이 공습,포격의 상황에서 신속히 주민에게 개방 및 공급될 수 있도록 정기 점검을 실시하고 있으며 급수시설의 경우 음용수는 분기별, 생활용수는 3년 주기로 수질검사를 진행하고 있습니다.관내 민방위 비상대피시설과 비상급수시설 정보를 시설별로 동명, 시설명, 소재지, 시설형태, 규모(제곱미터) 및 용량(톤)에 대한 항목으로 나누어 제공합니다.
