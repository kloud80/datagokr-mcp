summary_user: 국토안전관리원 시설물점검진단시스템에 등록된 보고서 정보를 시설물번호별 보고서 구분(안전점검보고서의 총평·유지관리방안·기존보고서검토·기타청문사항, 소규모취약시설물보고서의 총평 및 건의사항 등)과 최초등록·최종수정 일시로 담은 전국 단위 파일이다. 시설 안전 분석가나 관리 주체가 특정 시설물에 어떤 유형의 점검 보고서가 언제 등록·수정되었는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 시설물 안전등급·점검 결과 데이터와는 시설물번호를 기관 내부 코드로 맞춰 이어 쓴다.
limits: 보고서 본문이나 점검 결과·안전등급 값은 없고 보고서 유형과 등록·수정 시점만 담는다. 주소·좌표가 없는 비공간 데이터라 지역별 분석에는 다른 원장과의 연결이 필요하며, 전역 조인 키가 없어 같은 기관 코드 체계로만 연결된다.
