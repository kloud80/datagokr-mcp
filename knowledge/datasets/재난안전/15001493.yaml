summary_user: 전국 도시가스 지역관리소(고객센터)별로 지역구분, 지역구, 도시가스 회사명, 고객센터명, 공급지역, 연락처를 한 행씩 담은 목록 파일(csv, 약 47KB)이다. 주민이나 사업자가 '우리 동네 도시가스 연결·검침·안전점검은 어느 회사 어느 고객센터에 연락해야 하나'를 확인하거나, 분석가가 지역별 관리소 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역구·공급지역 이름이나 도시가스 회사명을 문자열로 맞춰 이어 써야 한다.
