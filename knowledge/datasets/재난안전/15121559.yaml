description_portal: 본 안전보건 경영시스템 인증 현황 데이터는 한국중부발전의 각 사업소가 도입한 안전보건 경영시스템에 대한 인증 현황을 나타내는 자료입니다. 항목은 사업소, 인증규격, 인증기준, 인증기관, 인증년도 등으로 구성되어 있으며, 인증규격은 ISO45001 등의 국제표준이 포함될 수 있습니다. 이 안전보건 경영시스템 인증 현황 데이터는 발전소의 안전관리 수준, 경영시스템 도입 및 유지 여부, 안전보건 관리체계의 외부 인증 상태를 확인하는 데 유용합니다. 또한, 안전 관련 정책 수립 및 위험관리 기준 마련에도 활용 가능합니다.
