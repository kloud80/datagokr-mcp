description_portal: 한국전기안전공사에서는 각종 발전설비, 송전·변전·배전설비 등 사업용 전기설비 및 아파트, 공장, 상가 등 자가용 전기설비의 설치공사 또는 변경공사를 완료하고, 그 전기설비가 공사계획의 인가 또는 신고를 한 내용 및 전기설비기술기준에 적합한 지의 여부에 대한 검사를 산업통상자원부장관 또는 시·도지사로부터 위탁받아 사용전검사를 시행하고 있습니다.관련근거는 전기사업법 제 63조, 제98조제2항, 같은법 시행규칙 제31조, 전기안전관리법 제9조, 제43조제2항, 같은 법 시행규칙 제6조가 해당됩니다.이 데이터는 2024년 태양광발전설비의 사용전검사를 진행한 내역을 설비구분, 발전기종류, 상호, 지역, 검사일, 검사결과로 제공합니다.
