summary_user: 2024년 한국전기안전공사가 시행한 태양광발전설비 사용전검사를 검사 건별로 담은 전국 단위 CSV 파일로, 연도·설비구분(사업용/자가용 등)·원동기(발전기) 종류·상호·지역·검사일·검사결과를 제공한다. 지역별·월별로 태양광 설비가 얼마나 새로 준공·검사되었는지, 합격·불합격 비율이 어떤지를 보려는 에너지 정책 분석가나 태양광 사업자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름이나 상호 문자열을 맞춰 연결해야 하며, 같은 기관의 다른 전기안전 검사 데이터와 비교하는 정도로 이어 쓴다.
limits: 설비 고유번호나 사업자번호 같은 조인 키가 없어 발전사업 허가 정보나 설비 원장과 정확히 1:1로 연결할 수 없다. 지역은 이름 수준으로만 있고 좌표가 없어 지도 위치 분석에는 바로 쓰기 어렵다.
