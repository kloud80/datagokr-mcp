summary_user: 광주 북부소방서 관내에 등록된 소방시설업체를 업체 한 곳당 한 행으로 담은 파일로, 상호·대표자·전화·팩스·도로명주소와 업종(방염업·감리업·공사업·관리업 등)·분야를 기록한다. 건물주나 시설 관리자가 북구 일대에서 소방시설 공사·감리·관리나 방염을 맡길 업체를 찾을 때, 또는 분석가가 관내 업종별 업체 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 소재지 도로명주소나 상호 이름을 맞춰 연결해야 한다.
description_portal: '광주광역시 북부소방서 관내 소방시설업 현황 통계 자료입니다. 상호, 대표자, 전화번호 등 각 비율 데이터를 제공합니다.○북부소방서 관내 소방시설업 현황- 방염업: 삼성방재, 신성방염, 엘지쇼파공장, 카본텍(주)- 소방시설감리업: (주)상명이앤지, 동우이앤씨, 명이앤씨, 선진소방엔지니어링, 유한회사 이에프- 소방시설공사업: (유)엠앤시건설, (주)HK소방, (주)경일, (주)대림개방, (주)대연소방, (주)동남전력, (주)보은이앤티, (주)수양방재이앤지 등- 소방시설관리업: (주)대기산업, (주)동형, (주)수양방재이엔지, (주)천하소방 등등'
