summary_user: 울진군이 지정한 산사태취약지역을 한 곳당 한 행으로 담은 건별 원천 파일로, 주소·위도·경도와 취약지역 유형, 관리주체, 소유 구분, 면적, 대피장소와 거리, 지정면적, 지정일이 들어 있습니다(csv 약 27KB). 울진군 주민이나 방재 담당자가 "우리 마을 근처에 산사태취약지역이 있는지, 있다면 어디로 대피해야 하는지"를 확인하거나, 지역 안전관리 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소 문자열이나 위도·경도 좌표로 공간 결합해야 하며, 대피소 데이터나 토지 규제 레이어와 위치 기준으로 겹쳐 쓴다.
description_portal: 경상북도 울진군 산사태취약지역 지정 현황 데이터를 제공합니다. 제공 항목에는 주소, 위도, 경도, 취약지역 유형, 관리주체, 소유구분, 면적, 거리, 대피장소, 지정사유, 지정면적, 지정일 등이 포함되며, 산사태 예방 및 재난 대응, 지역 안전관리 계획 수립 등에 활용됩니다.
