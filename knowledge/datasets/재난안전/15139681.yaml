summary_user: 행정안전부 재난안전데이터 공유플랫폼이 제공하는 지역 산사태 위험지역 정보로, 위험지역 한 곳마다 지구명·속칭명·법정동코드·상세주소·위험등급·고시일자·산사태 예상면적과 예상 피해(세대·인원·건물), 대피장소 등을 담으며 범위는 전국입니다. 주민이나 지자체 담당자가 '우리 동네 주변에 고시된 산사태 위험지역이 있고, 위험등급과 대피장소는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 법정동코드(STDG_CD)나 주소·지구명을 매핑해 대피·구호시설이나 다른 재난 위험지역 데이터와 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지역 산사태 위험 정보로, 지구명, 속칭명, 법정동코드, 상세주소, 위험등급코드, 고시일자, 산사태예상면적 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
