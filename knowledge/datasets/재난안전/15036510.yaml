summary_user: 부산광역시경찰청 소속 16개 경찰서별로 2025년에 발생한 5대 범죄(살인·강도·성범죄·절도·폭력) 건수를 경찰서 단위로 집계한 551바이트 분량의 작은 CSV 파일이다. 부산 시민이나 지역 치안 분석가가 우리 동네 관할 경찰서에서 절도나 폭력이 다른 경찰서보다 많이 발생하는지 비교할 때 쓴다. 전역 조인 키가 없어 경찰서 이름을 관할 구·군이나 다른 경찰서별 통계와 이름으로 직접 맞춰 연결해야 한다.
