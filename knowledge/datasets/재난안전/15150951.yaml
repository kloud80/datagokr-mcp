description_portal: 한국남동발전에서 제공하는 시간대별 지진 계측 정보입니다.삼천포 계측소의 시간대별 지진계측 데이터로, 측정시각에 따른 계측값과 이에 따른 관심도를 확인할 수 있습니다. 계측값은 Z(UP-DOWN 성분값), N(남북 성분값), E(동서 성분값) 3성분 벡터합 값으로 제공됩니다. 관심도는 자유장 기준 4단계로 구분하였으며, 21.622 이상일 경우 "심각", 9.999 이상일 경우 "경계", 3.162 이상일 경우 "주의", 그 미만일 경우 "안전" 단계로 구분하였습니다. 해당 데이터는 시간에 따른 진동 계측 변화와 관심도를 포함하고 있어 AI 기반 지진 발생 예측 및 이상탐지모델 학습의 기초 데이터로 활용 가능합니다.
