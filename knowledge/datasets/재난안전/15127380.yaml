description_portal: 경찰청의 시도청별 가정폭력 검거 및 조치 현황(명)을 분석하면, 경기남부청이 9180건으로 가장 많은 검거 건수를 기록했으며, 다음으로 서울청(5815건), 경기북부청(3144건) 순으로 나타났습니다. 검거 건수가 가장 적은 지역은 **세종청(164건)**이었습니다.검거된 인원 중 송치 및 불송치 조치 현황을 보면, 전체적으로 불송치 인원(경미한 사건 등)이 송치 인원보다 더 많았습니다. 특히, 가장 많은 검거를 기록한 경기남부청은 불송치가 3256명, **송치(불구속)**가 5583명으로 나타났으며, 송치(구속) 인원은 130명으로 전국에서 가장 많았습니다.보호사건 조치 인원은 서울청이 2160명으로 가장 많았고, 기타 조치(참고인 등) 인원은 경기남부청이 294명으로 가장 많았습니다. 전반적으로 수도권 및 인구 밀집 지역에서 가정폭력 검거 및 조치 건수가 높게 나타났습니다.
