summary_user: 서울시 안심귀갓길 구간에 설치된 CCTV·보안등·비상벨 등 안전시설물을 시설물 한 건 단위로 담으며, 시군구·읍면동 코드와 명칭, 소속 안심귀갓길(ASG_ID), 설치 대수, 관리기관, 조성 연월, 세부 위치, 점 좌표(POINT_WKT)를 포함한다. 구청·경찰·연구자가 "우리 동네 귀갓길 중 비상벨이나 CCTV가 부족한 구간은 어디인가" 같은 안전 사각지대 점검과 추가 설치 검토에 쓴다. 실측상 전역 조인 키는 없어 시군구·읍면동 코드나 명칭을 다른 행정구역 데이터와 매핑하거나 좌표로 공간 결합해 이어 쓴다.
