summary_user: 광주광역시 서구에서 2021년부터 발생한 침수피해 사례를 건별로 담은 파일로, 발생연도·피해위치(주소)·위도·경도·피해내용을 기록한다. 서구 주민이나 도시계획·방재 담당자가 "우리 동네 어느 지점에서 침수가 반복됐는가"를 확인하거나 침수 취약지점을 지도에 찍어 보는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 위도·경도 좌표로 공간 결합하거나 주소 문자열을 매칭해 이어 쓴다.
description_portal: 이 데이터는 광주광역시 서구에서 2021년부터 발생한 침수피해 사례에 대한 정보로, 피해 발생 연도, 주소, 위도·경도, 피해 내용, 침수 유형 등을 포함하고 있습니다.해당 자료는 지역 내 자연재해 중 침수피해의 발생 양상과 공간적 분포를 파악할 수 있도록 구성되어 있으며, 기후변화로 인한 도시 침수 위험 평가, 재난 대응 체계 수립, 도시계획 및 재해 예방 사업의 기초자료로 활용될 수 있습니다.특히 위치 좌표 정보가 포함되어 있어 GIS 기반 공간분석 및 시각화가 가능하며, 공공기관, 연구기관, 민간 분야에서도 실효성 높은 자료로 활용됩니다.데이터는 연 1회 정기적으로 갱신되며, 공공저작물로 자유롭게 이용 가능합니다.
