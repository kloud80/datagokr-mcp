description_portal: '"전북특별자치도교육청_학교별CCTV설치대수" 데이터는 전북특별자치도 내 초등학교, 중학교, 고등학교, 특수학교를 대상으로 각 학교별로 설치된 CCTV(영상정보처리장치) 대수를 체계적으로 제공하는 공공데이터입니다. 데이터 항목에는 지역, 학교급(초·중·고·특수), 설립유형(공립·사립 등), 학교명, 그리고 해당 학교에 설치된 CCTV 대수가 포함되어 있습니다.이 정보는 각 학교의 자체 보고와 현장 점검 등을 통해 수집하며, 「학교안전법」 제17조(학교안전시설의 설치 등)에 근거해 보유 및 제공되고 있습니다. 해당 법령에 따라 교육감과 학교장은 학생 안전 확보를 위해 필요한 경우 CCTV 등 학교안전시설을 설치하고 관리해야 하며, 그 현황을 정기적으로 점검 및 보고하도록 규정되어 있습니다.데이터는 연 1회 정기적으로 갱신되며, 최신 현황을 반영하여 제공하고 있습니다. 이를 통해 학교별 학생 안전 인프라의 현황을 파악하고, CCTV 설치 확대나 교체 등 학교 안전정책 수립의 기초자료로 활용할 수 있습니다.이 데이터는 학생 안전 강화, 학교별 보안 수준 분석, 지역별 CCTV 설치 현황 비교, 교육청 및 지자체의 예산 편성, 언론 및 연구기관의 통계 분석 등 다양한 분야에서 활용됩니다. 또한, 학부모와 지역사회가 학교의 안전환경을 객관적으로 파악할 수 있도록 투명성을 높이는 데에도 기여합니다'
