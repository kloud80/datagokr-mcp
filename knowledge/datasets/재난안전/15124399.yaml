description_portal: 광주광역시 북구 관내 침수피해지 현황 데이터입니다.2021 ~ 2023년도에 광주광역시 북구에서 폭우 등으로 인해 침수 피해가 발생한 지역의 주소, 위도 및 경도, 피해발생일자[연-월-일 시:분] 항목에 대한 정보를 공공데이터포털에 CSV 파일로 제공합니다.* 침수피해지주소 컬럼에 기재한 주소는 침수피해지에 도로명주소가 부여된 경우 이를 지번주소보다 우선적으로 적용하여 작성하였습니다. 다만, 침수피해지의 정확한 도로명주소를 확인할 수 없거나 해당 위치에 도로명주소가 부여되지  않은 경우 지번주소로 작성되었습니다.** 침수피해지주소 컬럼의 도로명주소가 기재된 일부 셀에서 각각의 도로명주소 끝부분에 추가로 별도 기재한 괄호 안의 지역 동명은 모두 법정동 기준으로 작성되었습니다.
