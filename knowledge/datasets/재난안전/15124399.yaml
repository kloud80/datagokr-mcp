summary_user: 광주광역시 북구에서 2021~2023년 폭우 등으로 침수 피해가 난 지점을 건별로 주소, 위도·경도, 피해발생일시와 함께 담은 CSV 파일이다. 주민이나 분석가가 "우리 동네나 이사할 집 주변이 최근 침수된 적이 있는가"를 확인하거나 상습 침수 지점을 지도로 파악하는 데 쓴다. 전역 조인 키는 없어 주소(도로명 우선, 없으면 지번, 괄호 안 법정동명)나 좌표를 기준으로 재해위험지구·대피시설 등 다른 위치 데이터와 공간적으로 겹쳐 쓴다.
limits: 범위가 북구 한 시군구에 한정되고 기관 코드나 행정 코드 같은 공통 키가 없어, 다른 데이터와는 주소 문자열 매칭이나 좌표 기반으로만 연결된다. 피해 규모나 원인 같은 항목은 없고 위치와 발생일시만 담는다.
