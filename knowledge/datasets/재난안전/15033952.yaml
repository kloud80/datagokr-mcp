summary_user: 대전광역시 중구에 있는 이재민수용시설을 시설 한 곳당 한 행으로 담고, 시설명·도로명주소·면적(제곱미터)·수용가능인원·데이터 기준일자를 기록한 시군구 단위 파일(CSV 약 2.4KB)이다. 주민이나 구호 담당자가 '수해나 화재로 집을 잃으면 중구 안 어느 시설에 몇 명까지 머물 수 있나'를 확인할 때 쓴다. 전역 조인 키나 코드 필드가 없으므로, 다른 대피·구호시설 데이터와는 시설명이나 도로명주소를 맞춰 붙이거나 주소를 좌표로 변환해 지도에 함께 올리는 방식으로 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구에 위치한 이재민수용시설 (연번, 시설명, 도로명 주소, 면적, 수용인원, 데이터 기준일자) 정보를 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 면적은 제곱미터 단위를 기준으로 작성되었습니다.데이터 컬럼 중 수용인원은 해당 이재민수용시설의 수용가능인원을 작성하였습니다.주소는 도로명주소 기준으로 작성되었습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
