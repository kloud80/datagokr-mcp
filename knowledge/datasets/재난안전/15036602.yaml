description_portal: 해당 데이터는 경기도북부경찰청 소속 경찰서별 경찰공무원 인원 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 경찰서는 의정부, 고양, 일산동부, 일산서부, 남양주남부, 남양주북부, 파주, 양주, 동두천, 구리, 포천, 가평, 연천으로 구분되어 있습니다. 2017년부터 최근 연도인 2025년까지의 경찰공무원 인원을 현원 기준으로 경찰서 별로 구분하여 제공하고 있어, 해당 기간 동안의 각 경찰서별 경찰공무원 인원을 파악할 수 있습니다. 해당 현황은 경기북부경찰청 경무기획정보화장비과에서 제공합니다.
