description_portal: 밀수사범 검거 실적 현황에 관한 데이터로 년도(2017년~2023년), 검거 건수, 구속, 불구속, 이첩 등의 항목을 제공합니다. 2017년 국민안전처에서 해양경찰청으로 개청이후 해양 전문수사기관으로서 단속을 수행 2017년 해양경찰청 개청 및 2018년 수사경과제 시행 등 해양 수사기관의 비약적인 발전으로 2018년 대비 2019년 밀수사범 검거건수 382% 향상으로 농수산물, 가짜의약품, 가짜잡화, 담배 밀수 등 국경을 위협하는 범죄에 대해 집중 단속 중밀수란? 수출 또는 수입에 관한 정규의 수속을 거치지 않고 물품을 부정한 방법으로 수출 또는 수입하는 것. 관세법에서는 수출입에 관한 수속, 관세 납부, 수출입 금지품 등과 이를 위반하는 자에 대한 벌칙을 규정하고 있다데이터의 업데이트 주기는 "연간"이며, 데이터 관련 문의사항은 해양경찰청 외사과로 문의해주시기 바랍니다.
