description_portal: '○ 통계개요* 통계명 : 소방공무원(정원)* 통계종류 : 서울시 지방공무원 정원조례 및 규칙에 의한 소방공무원 정원 현황* 작성목적 : 소방공무원 정원의 현황을 진단하여, 소방행정 전반에 걸친 홍보 및업무 활용을 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 정원관리시스템 → 소방행정과 (소방직)소방재난본부 방호과 → 소방행정과 (의용소방대)* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 소방인력 정원 및 의용소방대 현황○ 용어설명* 소방인력 : 화재, 구조, 구급 현장활동을 위주로 근무하는 소방공무원 및소방행정 분야에서 근무하는 소방공무원을 포함(의무, 의용소방대원은 제외)* 의용소방대원 : 소방본부장 또는 소방서장이 관장하는 소방업무를 보조하기위해 각 지방단체의 필요에 의하여 조직·운영되고 있는 일선의 소방조직○ 기타* 소방인력 현황은 근무 현원이 아니라 정원을 기준으로 작성하였으므로 통계작성 주기내에서 수시로 유입되거나 퇴장하는 유량적 수치가 아님* 의용소방대원은 합계에 미포함* 명칭 변경 : 소방방재본부 → 소방재난본부, 성동소방서 -> 광진소방서 (2008.01.01)소방재난본부장 직급 상향 : 소방감 → 소방정감 (대통령령 제21689호 2009.08.18)'
