summary_user: 서울 구로구의 민방위 비상급수시설을 사업장(시설) 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·지번/도로명 주소·좌표(XCRD, YCRD)·시설 위치와 구분 등을 기록한다. 구로구 주민이나 재난 대응 담당자가 단수·재난 때 가까운 비상급수시설이 어디에 있고 지금 운영 중인지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 대피·구호시설 데이터와는 주소·좌표나 시설명, 같은 기관 코드(OGDP_INST_CD)로 맞춰 이어 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 민방위급수시설 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 민방위급수시설 시설의 면적, 건축물 연면적, 업태구분 등 주요 속성이 기록된다. 또한 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 운영 현황 파악에 활용된다. 행정기관은 이를 통해 지역 내 민방위급수시설을 관리하며, 시민은 합법적 운영 여부를 확인할 수 있다. 데이터는 정기적으로 갱신되어 정책 수립, 연구 분석, 민원 처리 등에 활용된다. 좌표정보는 지도 서비스 및 공간 분석에 연계 가능하여 행정 투명성과 정보 접근성을 높이는 기반 자료가 된다.
