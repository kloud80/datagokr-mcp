summary_user: 승강기 관리번호가 바뀐 건마다 이전 관리번호, 신규 관리번호, 변경일자를 기록한 전국 범위의 건별 변경 이력 파일(CSV, 약 145KB)이다. 예전 검사·고장 자료에 남은 옛 관리번호가 지금 어느 승강기 번호에 해당하는지 확인하려는 분석가나 관리 주체가 번호를 대조하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 승강기 원장·검사 데이터와는 관리번호 값을 직접 맞대어 이전 번호를 신규 번호로 바꾼 뒤 잇는다.
description_portal: 본 자료는 한국승강기안전공단 내부 전산시스템에서 관리하는 승강기 관리번호 변경 이력을 제공하는 데이터입니다. 승강기 관리번호는 설치 및 운영 단계에서 해당 승강기를 고유하게 식별하고 관리하기 위한 기본값으로 사용되며, 행정처리나 시스템 운영 과정에서 번호 변경이 필요한 경우 이력이 기록됩니다. 데이터에는 이전 관리번호, 신규 관리번호, 변경일자 등이 포함되어 있어 승강기별 관리이력 추적과 데이터 정합성 확보에 활용할 수 있습니다. 예를 들어 설치 정보 수정, 중복 등록 정정, 행정구분 체계 변경 등으로 인해 관리번호가 조정되면, 그 변경 내역이 본 데이터에 반영됩니다. 이를 통해 특정 승강기의 설치부터 운영, 검사, 유지관리까지 전 주기 관리 과정에서 번호 변경 이력을 확인할 수 있습니다.
