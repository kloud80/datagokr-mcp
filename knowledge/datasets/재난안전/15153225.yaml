summary_user: 한국전기안전공사가 점검한 전기 일반용설비를 설비(고객번호) 단위로 담은 건별 원천 데이터로, 시설명·지번주소·위경도와 점검일자·점검종류·점검결과·판정등급·점수를 전국 범위로 담는다. 지자체·안전관리 담당자나 분석가가 '우리 지역 일반용 전기설비 중 최근 점검에서 부적합이나 낮은 등급을 받은 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 법정동코드로 보이는 필드(STDG_CD)·주소·좌표를 이용한 지역 단위 매칭이나 같은 기관 데이터와의 이름 매핑으로 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국전기안전공사에서 제공하는 전기일반용설비의 설치 위치 및 검사일자 정보입니다.\""
