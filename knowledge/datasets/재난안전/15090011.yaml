summary_user: 2023~2024년 중대산업사고가 발생해 산업안전보건법 위반죄가 확정된 사업장을 건별로 공표한 파일로, 사업장명·소재지·재해발생일·사고내용·사망·부상자 수를 담으며 원도급과 같은 장소에서 작업한 하도급업체도 함께 싣는다(전국, 약 1.5KB 소규모 CSV). 국민이나 거래 사업자가 '이 업체가 중대산업사고로 처벌받은 이력이 있는가'를 확인하거나, 분석가가 지역별 중대산업사고 발생 사업장을 살펴보는 데 쓴다. 실측 컬럼에 사업자등록번호 같은 전역 조인 키가 없어 다른 데이터와는 사업장명·소재지 주소를 이름 매칭하는 방식으로만 잇는다.
limits: 위반죄가 확정된 사업장만 공표하므로 재판 계류 중인 사고는 빠져 있고 형 확정연도에 뒤늦게 실린다. 조인 키가 없어 사업장명·주소 문자열 매칭에 의존해야 하며, 동명 업체 오매칭에 주의한다.
