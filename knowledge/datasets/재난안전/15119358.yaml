description_portal: 해당 데이터는 광주광역시경찰청에서 제공한 분야별 집회·시위 개최현황으로, 2018년부터 2024년까지 7년간의 통계를 포함하고 있습니다. 사회, 경제, 공공, 노동, 사회문화 등 다양한 분야에서 개최된 집회 및 시위의 건수를 세분화하여 제공함으로써, 광주 지역의 사회적 흐름과 주요 이슈에 대한 종합적인 파악이 가능합니다. 이 자료는 집회와 시위의 발생 빈도 및 유형의 변화 추이를 연도별·분야별로 분석할 수 있도록 구성되어 있으며, 정책 수립, 학술 연구, 사회 문제 분석 등 다양한 분야에서 활용 가치가 높은 기초 통계 자료입니다. 특히 특정 시기나 사건 이후 집회 양상의 변화나 증가·감소 추세를 파악하는 데 도움이 되며, 공공기관이나 연구기관에서 지역사회의 갈등 요소를 분석하고 대응 전략을 수립하는 데에도 유용하게 활용될 수 있습니다.
