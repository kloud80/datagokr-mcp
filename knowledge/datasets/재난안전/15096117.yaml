description_portal: 2021년 8월 21일부터  9월 17일까지 창원시 주요도로 부속물(노면표시, 시선유도봉) 훼손 현황 데이터입니다.각 데이터의 유형, 위치 정보, 해당 도로정보가 있습니다.보도블록, 가드레일, 안내표지, 도로 경계석 등 다양한 도로 부속물이 훼손된 위치와 상태 정보를 담은 자료입니다. 이 데이터는 훼손 분포 파악, 시설물 유지보수 계획 수립, 안전점검 및 민원 대응, 도시미관 개선 등에 활용할 수 있습니다.대상 부속물이 많고 공간 정보가 포함될 경우, 일반 뷰어(엑셀, 메모장 등)에서는 일부만 보일 수 있어 R, Python, GIS 등 전문 도구 사용을 권장합니다.훼손 정도 등급, 발생 일자, 점검 주기 등 세부 기준은 제공기관의 메타데이터 또는 기술문서를 참고하시기 바랍니다.
