summary_user: 재난안전데이터 공유플랫폼에서 제공하는 전국 조위소별 관측값을 관측 날짜·시간 단위로 담은 데이터로, 풍속·순간최대풍속·풍향·기온·기압·조위 등을 포함한다. 해안가 주민이나 어업·해양 레저 사업자, 재난 대응 분석가가 '특정 조위소에서 지금 조위와 바람이 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 조위소 ID(TDSTTN_ID)를 조위소 이름·위치 정보와 따로 매핑하거나 같은 기관 데이터와 코드로만 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 실시간 조석 정보로, 조위소ID, 관측날짜, 관측시간, 풍속, 순간최대풍속돌풍, 풍향, 기온, 기압, 조위 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
