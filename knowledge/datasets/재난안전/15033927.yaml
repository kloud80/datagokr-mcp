summary_user: 소방공무원이 화재진압·구조·구급·교육훈련 등 활동 중 순직하거나 다친(공상) 인원을 시도 소방본부별로 집계한 전국 단위 파일(CSV, 약 506바이트)입니다. 소방 안전 정책 담당자나 연구자가 '어느 본부에서, 어떤 활동 중에 소방관 공상자가 가장 많이 나오는가'를 비교하는 데 쓴다. 전역 조인 키가 없어 본부 이름을 기준으로 시도별 소방 인력·출동 통계 같은 소방청의 다른 본부별 자료와 이름 매칭으로 이어 쓴다.
