description_portal: 해당 데이터는 화재, 구조·구급, 각종 재난 대응 활동 중 발생한 소방공무원의 순직 및 부상 후 순직 처리 및 공상자 현황을 집계한 데이터 입니다.  이 데이터에는 연도별 순직 인원, 부상자 수, 사고 유형(화재진압, 구조 활동, 구급 활동 등) 등으로 구분되고 있습니다. 또한 이를 통해 소방관들이 어떤 활동(화재진압, 구조활동, 구급활동, 훈련, 기타 등)에서 가장 큰 위험에 노출되는지, 특정 시기나 재난 유형에서 피해가 집중되는지를 객관적으로 파악할 수 있습니다. 또한 어느 활동에서 순직자, 공상자가 많이 발생하는지 알 수 있습니다.
