summary_user: 전국 축사(돈사·우사·계사)에서 난 화재를 한 건씩 기록한 건별 원천 자료로, 발생 일시, 시도·시군구, 사망·부상자 수, 재산피해(천원), 발화요인, 축사 종류를 담는다. 농가·지자체·보험 분석가가 "우리 시군구에서 돈사 화재는 주로 전기 요인으로 나는가, 피해 규모는 어느 정도인가" 같은 질문에 쓴다. 전역 조인 키는 없어 시도·시군구 이름을 행정구역 코드표에 매핑하거나 같은 기관(소방청)의 화재 발생 자료와 지역명으로 맞춰 이어 쓴다.
description_portal: '"소방청(국가화재정보센터)에서 제공하는 “축사 화재 현황” 공공데이터는 2013년부터 2023년까지 전국의 축사(돈사·우사·계사)에서 발생한 화재 사례를 정리한 정보입니다.이 데이터는 총 약 4,992건의 사건 기록이 포함되어 있으며, CSV, XML, JSON 형식으로 활용 가능합니다.데이터 구성은연번: 각 화재 건을 식별하는 고유 번호화재발생년월일: 실제 화재가 발생한 날짜와 시간시도·시군구: 화재 발생 지역의 행정구역사망/부상: 인명 피해 건수재산피해: 천 단위로 기록된 금전적 손실 (단위: 천원)발화요인: 화재가 시작된 원인 (예: 전기, 취급 부주의 등)장소분류: 축사의 종류 구분 (돈사·우사·계사)업데이트는 매년 이루어지며, 최신 등록일은 2025년 7월입니다이 데이터는 축사 화재의 발생 원인, 지역 분포, 인명·재산 피해 등을 분석하는 데 유용하며, 농가 안전 정책 수립, 예방 교육, 위험 등급 분류 및 대응 전략 마련 등에 활용될 수 있습니다.'
