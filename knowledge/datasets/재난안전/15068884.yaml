description_portal: '대전광역시경찰청은 도로 구조, 교통 혼잡, 보행자 안전 등을 고려하여 특정 구간에 대해 자동차 통행을 제한하고 있음. 이러한 구간은 시점, 종점, 거리, 시간대 등의 정보를 포함하고 있음. 이를 통해 도로 안전과 교통 효율성을 높이고, 교량 및 복개도로 통행 제한,  행사 및 공사로 인한 일시적 통행 제한에 사용하기 있음. 이를 통해 교통 혼잡 완화, 보행자 안전 확보(보행자 통행이 많은 시간대에 차량을 제한함으로써 보행자의 안전을 강화합니다.​), 환경 개선:차량 통행을 제한함으로써 대기 오염을 줄이고, 쾌적한 도시 환경을 조성함. 특정 차량의 통행 제한: 대형 화물차량이나 특정 차량의 통행을 제한하여 도로 구조물의 안전을 확보하고, 도로 유지보수 비용을 절.'
