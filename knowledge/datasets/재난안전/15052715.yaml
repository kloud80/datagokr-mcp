summary_user: 2017년 기준 전국 시·도 소방본부별로 119신고 접수·지령 처리 결과를 화재·구조·구급·대민 출동, 유관기관 이첩, 안내·민원, 장난전화, 무응답, 오접속 등 유형별 건수로 집계한 소규모 파일입니다(유선/무선 신고 구분 포함). 소방 행정 분석가나 연구자가 '어느 시·도 본부에 장난전화나 무응답 등 출동으로 이어지지 않는 신고 비중이 높은가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 소방 통계와는 본부(시·도) 이름을 맞춰 연결한다.
description_portal: '해당 데이터는 2017년 기준으로 전국 소방본부별 119신고 접수 및 지령처리 현황을 정리한 것입니다. 데이터 구성 항목은 - 본부: 시·도별 소방본부 구분(서울, 부산, 인천, 대구, 광주 등), 유선/무선 신고로 구분- 화재출동: 화재 관련 출동 건수- 구조출동: 구조 활동 출동 건수- 구급출동: 구급·환자 이송 출동 건수- 대민출동 및 기타: 생활안전 등 기타 민원 출동 건수- 유관기관이첩: 경찰·지자체 등 타 기관으로 이첩된 건수- 안내 및 민원: 단순 안내, 상담, 민원 처리 건수- 장난전화: 장난·허위 신고 건수- 무응답: 신고 연결 후 응답 없음- 오접속: 잘못 연결된 신고(타 번호 오인 등)- 기타: 분류되지 않은 건수로 되어 있습니다.'
