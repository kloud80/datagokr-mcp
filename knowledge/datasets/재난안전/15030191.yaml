description_portal: 경찰청 지문 감정 처리 현황은 2016년부터 2025년까지 지문 감정 결과를 신원확인, 신원미확인, 기타·감정불능 등으로 구분해 집계한 통계이다. 신원확인 건수는 2016년 9,449건에서 2024년 13,423건으로 증가하며 최고치를 기록하였고, 2025년에는 11,580건으로 다소 감소하였다. 신원미확인 건수는 2017년 4,256건 이후 전반적으로 증가해 2024년 7,244건까지 확대되었으며, 2025년에는 5,809건으로 줄었다. 본 데이터는 지문 감정 처리 결과별 추이, 신원확인 성공률, 감정불능 비중, 연도별 과학수사 수요 변화를 분석하는 데 활용할 수 있으며, 지문감식 업무량 진단과 감정 품질 개선, 과학수사 인력·장비 운영계획 수립을 위한 기초자료로 활용 가능하다.
