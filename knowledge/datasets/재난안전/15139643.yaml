summary_user: 재난안전데이터 공유플랫폼에서 제공하는 재난배상책임보험 가입률 통계로, 집계일자별·시도·시군구별로 대상 시설물 수, 가입자 수, 가입률을 담은 전국 단위 집계 자료다. 지자체 안전담당자나 분석가가 "우리 시군구의 재난배상책임보험 의무가입 대상 시설 중 실제 가입한 비율이 얼마나 되나"를 확인하거나 지역 간 미가입 격차를 비교하는 데 쓴다. 전역 조인 키는 없어서 시도명·시군구명(CTPV_NM, SGG_NM)을 행정구역 이름으로 맞춰 다른 지역 통계와 연결해야 한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 지자체별 재난배상책임보험 가입률 통계 정보로, 집계일자, 시도명, 시군구명, 총시설물수, 가입자수, 가입률 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
