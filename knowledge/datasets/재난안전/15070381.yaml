summary_user: 인천광역시경찰청 관내 10개 경찰서(중부·미추홀·남동·부평·서부·계양·강화·연수·삼산·논현)별로 절도·장물·사기·횡령·배임·재물손괴 등 재산범죄 유형별 112 신고 건수를 담은 집계표이며, 파일 크기가 305바이트에 불과한 소규모 CSV다. 인천 지역 치안 분석가나 주민이 '인천에서 사기·절도 신고가 가장 많은 경찰서 관할은 어디인가'처럼 관서별 재산범죄 신고 양상을 비교하는 데 쓴다. 전역 조인 키가 없고 경찰서가 열 이름으로 들어 있어, 다른 지역 범죄통계나 경찰관서 위치 데이터와는 경찰서 이름을 맞춰서만 이어 쓴다.
description_portal: 인천광역시경찰청에서 접수된 재산범죄 관련 112 전화 신고 건수 데이터를 기반으로, 각 경찰서별로 절도, 장물, 사기, 횡령, 배임, 재물손괴 등 다양한 재산범죄 유형별 신고 건수를 항목별로 제공합니다. 이 데이터는 인천 관내 각 경찰서에 접수된 재산범죄 신고 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 범죄 유형별 분류를 통해 지역별 범죄 발생 양상과 신고 추이를 분석하는 데 활용됩니다. 해당 자료는 연간 단위로 갱신되며, 인천지역 재산범죄 예방 및 치안 정책 수립에 필요한 기초 통계로 활용됩니다
