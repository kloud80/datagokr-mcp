description_portal: 이 파일은 전북경찰청에서 연도별로 수집·제공한 소년범죄 관련 통계 자료로, 형법범과 특별범으로 구분된 범죄 유형에 따른 검거 인원 현황을 담고 있습니다. 형법범에는 절도, 폭력, 강도, 살인, 강간 등 일반 형사범죄가 포함되며, 특별범에는 청소년보호법, 마약류관리법, 성폭력처벌법, 도로교통법 등 개별 특별법 위반 사례가 해당됩니다. 해당 자료는 각 연도별로 소년범(대체로 만 14세 이상 19세 미만)의 범죄 유형별 검거 인원 수를 제공함으로써 청소년 범죄의 추세를 분석하고, 특정 범죄 유형의 증가 또는 감소 양상을 파악할 수 있도록 구성되어 있습니다. 이를 통해 청소년 범죄 예방 정책, 법제도 개선, 교육 프로그램 마련 등 실효성 있는 대응 전략 수립에 활용될 수 있습니다.
