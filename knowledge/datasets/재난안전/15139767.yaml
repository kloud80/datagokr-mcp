summary_user: 전국 치안센터를 시설 한 곳당 한 건으로 담은 원천 목록으로, 관할기관·관할경찰서, 시설유형·시설코드·시설명, 지번·도로명 주소, 시도·시군구 코드를 담는다. 주민이나 지자체 안전 담당자가 '우리 동네 치안센터는 어디이고 어느 경찰서 관할인가'를 확인하거나, 분석가가 시군구별 치안센터 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시도·시군구 코드나 주소·경찰서 이름을 매핑해 잇는다. 같은 재난안전 묶음의 대피·구호시설, 소방 데이터와는 이 지역 단위로 함께 본다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 치안센터 정보로 관할기관명, 관할경찰서명, 시설유형, 시설코드, 시설명, 주소, 도로명주소, 시도코드, 시군구코드 등을 제공하고 있습니다. 데이터의 갱신주기는 월 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
