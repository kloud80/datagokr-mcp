description_portal: "본 데이터는 「경찰청과 그 소속기관 조직 및 정원관리 규칙」에 근거하여 대전광역시경찰청 및 관할 소속기관의 인력 운영 현황을 관리하기 위해 작성된 통계 자료입니다.1. 데이터의 범위 및 구성:대전광역시 내 6개 경찰서(대전중부·동부·서부·대덕·둔산·유성경찰서)를 대상으로 하며, 각 경찰서 본서뿐만 아니라 지구대, 파출소 등 지역경찰 관서의 인력을 모두 포함하고 있습니다. 인력 구성은 경찰공무원(치안 업무 수행)과 일반직 공무원(행정 지원 업무 수행)을 모두 포함한 '현원 기반의 정원' 통계를 제공합니다.2. 주요 제공 항목:연도별/관할 경찰서별 정원 수치를 제공하여, 시기별 인력 증감 현황을 한눈에 파악할 수 있도록 구성되었습니다.3. 데이터 활용 가치:정책 분석: 대전 지역 내 치안 수요 변화에 따른 조직 개편, 인력 재배치 및 축소 등 행정적 변동 추이를 분석하는 기초 자료로 활용될 수 있습니다.학술 연구: 지역별 경찰 인력 밀도와 범죄 발생률 간의 상관관계 연구, 공공기관 조직 진단 등 치안 행정 분야의 연구 과제 수행을 위한 객관적 지표로 활용 가능합니다.공공 서비스: 지역 주민들에게 거주지 인근 치안 유지 인력 현황에 대한 알 권리를 보장하고, 공공데이터의 투명한 공개를 통해 치안 정책에 대한 신뢰도를 제고하고자 합니다."
