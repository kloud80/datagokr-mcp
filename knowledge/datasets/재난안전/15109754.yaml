summary_user: 울산광역시도시공사가 관리하는 보안등을 시설 한 건씩 담은 원천 데이터로, 위치명·도로명/지번 주소·위도·경도와 설치연도·등주높이·등주재질·등주형식·설치간격 같은 제원, 관리번호·관리기관 정보를 함께 담는다. 도시공사 관리 구역의 보안등이 어디에 언제 설치됐는지 확인하거나, 오래된 보안등을 골라 유지보수 대상을 정하려는 시설 담당자·분석가가 쓴다. 전역 조인 키는 없어서 위도·경도나 주소를 기준으로 CCTV·안전비상벨 같은 다른 방범 시설 데이터와 공간적으로 겹쳐 보는 방식으로 이어 쓴다.
description_portal: 이 데이터는 울산광역시도시공사에서 관리하고 있는 보안등 시설물의 위치, 제원, 관리 현황 등 세부 정보를 체계적으로 정리한 시설 관리 데이터셋입니다. 데이터에는 각 보안등의 위치명(LOCATION), 상세위치(DTL_PSTN), 소재지 도로명주소(ROAD_NM_ADDR), 소재지 지번주소(LOTNO_ADDR) 등의 공간정보와 함께, 위도(LAT) 및 경도(LOT) 좌표를 포함하여 GIS 기반의 위치 분석에 활용할 수 있습니다. 또한 설치연도(INSTL_YR), 설치형태(INSTL_DIV), 설치간격(INSTL_INTRVL), 등주높이(LIGHT_HG), 등주재질(LIGHT_MTRQLT), 등주형식(LIGHT_FOM) 등 각 시설의 물리적 제원을 기록하여, 노후도 평가 및 유지보수 계획 수립에 필요한 기술자료로도 사용됩니다.그 밖에 설치개수(INSTL_CNT), 색상(COLOR), 관리기관명(INST_NM), 관리기관전화번호(INST_TELNO), 관리번호(MNG_NO), 데이터기준일자(LAST_MDFCN_YMD) 등의 관리 속성이 포함되어 있어, 각 보안등의 관리주체 및 최신 데이터 반영 시점을 명확히 확인할 수 있습니다.
