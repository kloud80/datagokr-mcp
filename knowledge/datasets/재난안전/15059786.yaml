summary_user: 국토안전관리원 소규모 취약시설 안전관리시스템(SFMS)에 등록된 소규모 취약시설물을 시설물 번호 단위로 한 건씩 담은 대장 파일이며, 전국 72,835건이 개별 주소·좌표 단위로 들어 있다. 지자체 담당자나 분석가가 우리 시군구에 노인·아동·장애인 복지시설, 전통시장 등 안전 관리 대상 시설이 몇 곳이고 어디 있는지 파악할 때 쓴다. 이어 쓸 키는 이하주소(address)뿐이며, 광역시도·시군구로 지역 단위 집계를 하고 주소 기준으로 다른 시설·안전 자료와 맞춰 본다.
description_portal: '국토안전관리원 소규모 취약시설 안전관리시스템(SFMS)에서 제공하는 소규모 취약시설물의 현황 정보소규모 취약시설이란 「시설물의 안전 및 유지관리에 관한 특별법」(이하 시설물안전법) 상 1·2종 시설물에 해당하지 않는 시설물 중, 안전에 취약하거나 재난 위험이 있다고 판단되어 대통령령으로 정하는 시설을 의미합니다. 주로 사회적 취약계층이 이용하거나 국민 생활과 밀접한 관련이 있는 시설들이 포함됩니다소규모 취약시설의 구체적인 범위는 다음과 같습니다: 사회복지시설: 「사회복지사업법」 상의 노인복지시설(경로당 포함), 아동복지시설, 장애인복지시설, 어린이집, 정신보건시설, 사회복지관, 노숙인 시설 등.전통시장: 「전통시장 및 상점가 육성을 위한 특별법」 상의 전통시장.기타 시설: 소규모 농어촌도로의 교량, 보도육교, 옹벽, 축대 및 절토사면 등(여성가족부 시설 주소 비공개)'
