summary_user: 밀양시에 설치된 스마트형·고정형 그늘막을 한 기씩 설치장소, 주소, 읍면동, 관리번호, 경도·위도, 설치연도로 담은 시군구 단위 시설 목록 파일(csv, 약 9.8KB)이다. 폭염 때 보행자가 "우리 동네 교차로·교통섬 근처에 그늘막이 어디 있나"를 찾거나, 시 담당자·분석가가 읍면동별 설치 현황과 연도별 확충 추이를 점검하는 데 쓴다. 전역 조인 키는 없어 경도·위도 좌표로 지도 위에 무더위쉼터 등 다른 대피·구호시설과 겹쳐 보거나, 읍면동 이름을 매핑해 행정구역 단위 자료와 잇는다.
description_portal: 경상남도 밀양시 스마트그늘막 현황 데이터는 스마트형 및 고정형 그늘막의 설치 위치, 주소, 읍면동, 관리번호, 위치좌표(경도·위도), 설치연도 등 주요 정보를 제공하는 생활밀착형 스마트도시 인프라 데이터입니다.스마트그늘막은 지역 내 보행자 밀집 지점에 설치되어 자동 개폐, 온도 감지, 태양열 차단, 강풍 감지, 자동 접힘 기능, 시민 휴식공간 제공 등 폭염 안전을 위한 기능을 수행하며, 밀양시는 2020년부터 주요 도로, 교통섬, 공공시설 주변 등에 스마트그늘막을 단계적으로 확충하고 있습니다. 본 데이터는 보행안전 정책 수립, 폭염·기후 대응 서비스 분석, 스마트도시 기반시설 운영 최적화, 위치기반 서비스 개발(LBS), 지도 시각화, 연구·민간 서비스 연계 등 다양한 행정·민간 분야에서 활용할 수 있도록 구성되어 있습니다.
