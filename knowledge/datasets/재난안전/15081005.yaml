summary_user: 울산시 화학물질 자료로, 물질마다 한글·영문명, CAS 등록번호·EC번호·UN번호, 상온상태·색상·냄새, 사용용도 설명을 한 행씩 담은 물질 목록 CSV 파일(약 326KB)이다. 화재·누출 현장에 출동하는 소방관이나 안전관리자가 'UN번호나 CAS 번호로 표시된 이 물질이 상온에서 어떤 상태이고 어떤 냄새가 나며 어디에 쓰이는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 화학물질 자료와는 CAS 등록번호나 UN번호 같은 물질 코드, 또는 물질명을 맞춰 매핑해 이어 쓴다.
