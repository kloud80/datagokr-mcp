description_portal: 울산광역시 지역 내에서 취급·저장·관리되는 화학물질 현황을 정리한 자료입니다. 울산은 대규모 석유화학 단지와 제조업 기반이 밀집해 있어 화학물질의 종류와 사용량이 전국에서 가장 많은 도시 중 하나입니다. 이 데이터에는 화학물질 영문명, cas_등록번호,  EC번호,  UN번호,   상온상태, 색상, 냄새, 사용용도 설명 등의 항목으로 구성됩니다. 여기서 CAS 등록번호는(Chemical Abstracts Service)는 전 세계에서 사용되는 화학물질 고유 식별번호로 화학물질의 이름, 분자식, 구조식이 달라도 동일 물질이면 같은 번호가 부여되므로, 국제적으로 화학물질을 정확하게 식별할 수 있습니다. 또한 EC 번호(European Community number)는 유럽 화학물질 관리체계에서 화학물질을 식별하기 위해 부여하는 고유 번호입니다. 유럽 화학물질청(ECHA, European Chemicals Agency)에서 발급하며, 사용 범위는 REACH(화학물질 등록·평가·허가·제한 제도) 및 CLP(분류·표시·포장 규정) 등 EU 내 화학물질 규제 전반에서 사용에 사용됩니다.
