description_portal: 소규모 취약시설의 대상은 사회복지시설, 전통시장, 소규모 농어촌교량 등으로 시설물안전법 제19조에 따라 국토안전관리원이 관리하고 있습니다. 소규모 취약시설의 준공연도별 현황을 1950년 이전부터 현재까지 10년 단위로 제공하는 CSV형식의 파일데이터입니다.소규모 취약시설은 「시설물의 안전 및 유지관리에 관한 특별법」(이하 시설물안전법) 상의 1, 2종 시설물에 해당하지 않으면서, 안전에 취약하거나 재난 위험이 있다고 판단되는 시설을 의미합니다. 주로 사회적 취약계층이 이용하는 시설이나 국민 생활과 밀접한 시설들이 포함됩니다.
