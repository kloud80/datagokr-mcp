summary_user: 전북특별자치도 안의 좁은 골목길·전통시장 등 화재 취약지역에 설치된 비상소화장치를 장치 한 대씩 관리번호, 설치위치, 경도·위도로 담은 개별 목록(CSV 약 29KB)이다. 소방·안전 부서나 분석가가 '우리 동네 골목이나 시장 주변에 주민이 직접 쓸 수 있는 비상소화장치가 있는가, 어느 지역이 비어 있는가'를 지도로 확인하고 보강 지역을 정하는 데 쓴다. 전역 조인 키는 없어서, 좌표를 기준으로 소방용수 위치나 화재 발생 지점과 공간적으로 겹쳐 보거나 설치위치 주소 문자열로 행정구역을 맞춰 이어 쓴다.
description_portal: 전북특별자치도 내 소방차 진입이 어려운 좁은 골목길이나 전통시장 등 화재 취약지역에 설치된 '비상소화장치'의 현황 데이터입니다. 이 자료는 화재 발생 시 주민들이 직접 사용하여 초기 진압에 나설 수 있도록 비치된 소화 장치의 목록으로, 각 장치의 고유 관리번호와 함께 지도에 표시할 수 있는 경도, 위도 등 정확한 위치 정보를 포함하고 있습니다. 이 데이터는 화재 발생 시 골든타임을 확보하고 대형 화재로 번지는 것을 막는 데 중요한 역할을 합니다. 소방 및 안전 관련 부서에서는 이를 통해 안전 인프라의 분포를 파악하고, 취약 지역에 대한 보강 계획을 수립할 수 있습니다.
