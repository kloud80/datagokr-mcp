summary_user: 경기도 내 「시설물의 안전 및 유지관리에 관한 특별법」에 따라 안전등급이 D 또는 E등급으로 판정된 취약시설물을 시설 한 건씩 담은 현황이며, 시군명·대상명·준공년도·안전등급·규모·관리대상(민간/공공) 구분을 포함한다. 지자체 담당자나 분석가가 "우리 시군에 E등급(위험) 시설물이 몇 곳이고 그중 공공관리 대상은 무엇인가"처럼 노후 위험시설의 분포를 확인하고 점검·보수 우선순위와 예산을 정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(SIGUN_NM)이나 시설명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: 경기도 내 재난예방을 위해 관리하고 있는 시설물안전법 D‧E등급 시설물 현황입니다.이 데이터는 경기도 내 「시설물의 안전 및 유지관리에 관한 특별법」에 따라 안전등급이 D 또는 E등급으로 판정된 취약시설물의 현황을 포함하고 있습니다. 각 시설의 시군명, 대상명, 준공년도, 안전등급, 시설규모, 관리대상 유형(민간 또는 공공)을 포함하며, 주요 항목을 통해 노후화 정도와 구조적 안전성에 대한 평가 결과를 확인할 수 있습니다. '규모' 항목은 지하층 및 지상층 수 또는 교량의 길이와 폭 등을 나타내며, '관리대상'은 해당 시설이 민간 소유인지 공공관리 대상인지를 구분합니다. 이 데이터는 지역별 노후시설물의 안전 점검, 유지보수 계획 수립, 재난예방정책 강화 등의 공공안전 행정 업무에 활용되며, 특히 D등급(주의 필요)과 E등급(위험) 시설에 대한 선제적 조치 및 예산 편성 기준 자료로 사용될 수 있습니다.
