description_portal: 최근6년간(2019년~2025년) 고래류 처리확인서 발급현황 데이터로, 종류별 고래류 처리확인서 발급건수를 나타냅니다. 고래류 처리확인서 발급현황을 관리함으로 멸종위기에 처한 고래 보호에 대한 대응방안의 기초자료로 쓰일 수 있습니다. 고래류 처리확인서는 각종 고래 혼획 또는 포획 후 위판, 폐기시에 의무적으로 발급하여야 합니다. 혼획된 고래의 경우 보호종이 아니면 위판이 가능하지만, 포획된 고래는 보호종이 아니어도 위판이 불가능, 필히 폐기하여야 합니다. 또한 혼획건수가 지나치게 많은 경우에도 기타 다른  어종의 어업활동에 사용되는 그물이나 어구등을 보완하는 방법으로 연구 해 볼수도 있습니다.
