summary_user: 한국전기안전공사가 도서·산간 오지에서 현지 전기업체나 유자격자와 계약해 운영한 전기안전보안관의 2025년 실적을 연도·구분·지역명·유형·점검결과 단위로 담은 전국 범위 CSV 파일(약 131KB)이다. 도서·산간 지역 전기 고장 대응 실적이 어느 지역에 얼마나 있었는지, 어떤 유형과 점검결과가 많았는지를 보려는 지자체 담당자나 안전 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명 같은 이름 매핑이나 같은 기관 데이터로만 이어 쓴다.
description_portal: 한국전기안전공사는 전기재해 예방을 위해 전기설비 이상 발생 시 긴급 출동하여 응급조치를 실시합니다.교통 여건상 긴급출동 고충처리 서비스를 받을 수 없는 도서 지역이나 산간 오지 주민들을 위해, 현지에 상주하는 전기 공사업체나 전기기술 유자격자와 계약을 체결하여 전기 고장으로 인한 불편을 해결해 드리고자 전기안전보안관을 운영하고 있습니다.이 데이터는 한국전기안전공사에서 2025년도에 운영한 전기안전보안관 실적을 구분, 지역명, 유형, 점검결과로 확인 할 수 있도록 제공되는 데이터입니다.
