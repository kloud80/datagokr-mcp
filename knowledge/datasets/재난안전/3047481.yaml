description_portal: 본 데이터는 한국중부발전 각 사업소의 재난관리 및 안전보건 현황을 정리한 자료입니다. 항목은 사업소, 개시일, 무재해 실적(배수), 실적일자, 무재해 목표(배수), 목표일자로 구성되어 있으며, 무재해 실적과 목표는 사고 없는 작업일 수 또는 작업량을 일정 기준 배수로 환산해 관리한 수치입니다. 해당 자료는 현장의 산업재해 예방 수준 점검, 안전관리 목표 달성도 모니터링, 사업소별 안전관리 성과 비교 등에 활용 가능합니다. 또한 안전문화 개선 활동의 효과 분석, 무재해 인증관리, 공공기관의 재난·안전 통계 관리의 기초자료로도 활용 가능합니다.
