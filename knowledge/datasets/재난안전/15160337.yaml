description_portal: 본 데이터는 인천광역시경찰청에서 집계한 65세 이상 피의자의 5대 범죄 현황을 연도별·성별로 제공하는 통계자료이다. 2021년부터 2024년까지의 데이터를 기반으로 남성과 여성 피의자를 구분하여 살인, 강도, 강간, 절도, 폭력 등 5대 범죄별 피의자 수를 확인할 수 있도록 구성되어 있다. 이를 통해 고령층 피의자의 범죄 유형별 분포와 성별 특성, 연도별 변화 추이를 분석할 수 있으며, 고령화 사회에서의 범죄 양상 변화와 치안 환경을 파악하는 데 활용할 수 있다. 또한 범죄 예방 정책 수립, 고령층 대상 재범 방지 및 사회안전망 강화, 치안 행정 지원, 학술 연구 및 정책 평가를 위한 기초자료로 활용 가치가 높다. 연도 간 비교 분석을 통해 특정 범죄의 증감 추세를 확인하고, 향후 맞춤형 범죄 예방 대책과 고령층 대상 치안 서비스 개선을 위한 객관적인 근거자료로 활용할 수 있다.
