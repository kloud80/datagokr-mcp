description_portal: 시추조사를 통해 생산된 지반조사결과의 암석시험 내용 중 점하중 시험의 결과를 제공합니다. 점하중시험은 암석을 성형하지 않고 채취한 원시료에 점하중을 가해 파괴시킬 때의 하중을 측정하는 시험으로, 일축압축강도를 간접적으로 추정하고 암석의 공학적 특성을 파악하기 위해 사용됩니다. 불규칙한 형상이나 현장에서 채취한 시료를 그대로 시험할 수 있으며, 시험편을 성형할 필요가 없어 간편하게 암석의 강도를 평가할 수 있는 장점이 있습니다.
