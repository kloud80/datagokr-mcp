summary_user: 경기도 의왕시 관내에 설치된 폭염 대비 그늘막을 시설 한 곳당 한 행으로 담은 파일로, 설치장소명·도로명/지번 주소·위도경도·설치일자·높이·펼침지름·원단·당해년도 운영 기간·관리기관 연락처를 포함한다(CSV 약 17KB). 시민이 여름철 집 근처나 횡단보도 주변 어디에 그늘막이 있는지 찾거나, 분석가가 읍면동별 그늘막 분포를 보고 추가 설치가 필요한 취약지역을 판단하는 데 쓴다. 전역 조인 키는 없어서 좌표나 주소, 읍면동명으로 무더위쉼터 등 다른 대피·구호시설 데이터와 공간·이름 기준으로 이어 쓴다.
description_portal: 이 데이터는 의왕시 관내에 설치된 그늘막 현황을 정리한 자료로, 시민의 폭염 피해를 예방하고 쾌적한 도시 환경을 조성하기 위한 시설물 정보를 포함하고 있습니다. 주요 항목으로는 설치 장소명, 도로명 및 지번 주소, 설치일자, 높이, 펼침 지름, 원단 종류 등이 있으며, 위도 및 경도 좌표를 통해 정확한 위치 확인도 가능합니다. 또한 운영 시작일자 및 종료일자, 관리기관명과 연락처를 포함하고 있어 유지관리와 운영 정보도 파악할 수 있습니다. 본 데이터는 폭염 시 시민들이 이용할 수 있는 휴식 공간의 분포와 접근성을 분석하는 데 활용되며, 도시 내 취약지역 파악, 추가 설치 필요성 판단 등의 정책 수립 자료로도 유용합니다. 특히 읍면동 단위의 행정구역 정보가 포함되어 있어 지역 맞춤형 대응이 가능하며, 도시공간의 인프라 개선과 주민편의 향상을 위한 기초자료로 쓰일 수 있습니다.
