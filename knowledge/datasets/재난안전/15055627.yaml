summary_user: 전북특별자치도 소방본부·소방서·119구조대·119안전센터·119지역대를 기관 유형별로 한 행씩 담은 시설 목록으로, 시설명·도로명/지번 주소·대표 전화번호를 포함한다(포털 설명상 2018년 3월 기준, CSV 약 15KB). 도민이나 지역 안전계획 담당자가 "우리 시군에서 가장 가까운 119안전센터는 어디이며 연락처는 무엇인가"를 확인하거나 도내 긴급구조 거점 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 시군명이나 주소를 기준으로 화재 발생 건별 자료, 소방용수 위치 자료, 대피시설 자료와 이름·주소 매칭으로 이어 쓴다.
description_portal: 이 데이터는 2018년 3월 기준, 전북특별자치도 내에 위치한 소방 관련 시설의 현황을 종합적으로 보여주는 목록입니다. 도 전체를 총괄하는 소방본부를 시작으로 각 지역의 소방서, 그리고 일선 현장의 119구조대와 119안전센터, 119지역대까지 기관의 유형별로 구분하여 정보를 제공합니다. 각 시설의 공식 명칭, 도로명 및 지번 주소, 그리고 대표 전화번호를 포함하고 있어, 지역의 재난 대응 및 긴급 구조 인프라가 어떻게 분포되어 있는지 명확하게 파악할 수 있습니다. 이는 시민 안전과 직결되는 공공기관의 현황 정보이며, 비상 연락망 구축 및 지역 안전 계획 수립에 필수적인 기초 자료입니다.
