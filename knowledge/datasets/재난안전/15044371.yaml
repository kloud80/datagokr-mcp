description_portal: 전기로 대표되는 에너지 분야 전반에서 선제적으로 안전관리의 패러다임을 주도하는 책임·전문기관인 한국전기안전공사에서 전기안전점검을 시행할 때 사용되는 국산용 계측장비에 대한 데이터를 제공합니다.2014년 7월 10일부터 2024년 11월 12일까지 구입한 국산용 계측장비가 해당되며, 계측장비의 종류로는 (교육용) 누설전류계, (교육용) 디지털다기능 계측기, IRG누설전류계, 디지털다기능 계측기, 휴대용적외선 열화상 장비가 있습니다.각각의 계측 장비에 대해 제작사, 모델명, 제작번호(가명처리), 구입일자를 확인 할 수 있습니다.
