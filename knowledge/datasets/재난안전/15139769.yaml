summary_user: 행정안전부 재난안전데이터 공유플랫폼이 제공하는 전국 폭염저감시설(그늘막 등)을 시설 한 곳씩 담은 원천 목록으로, 관리번호·설치일시·제작·설치업체·전체 높이·원단명·위경도·사용 여부 같은 항목을 포함한다. 지자체 담당자나 분석가가 '우리 동네에 폭염 그늘막이 어디에 몇 개 설치돼 있고 지금 쓰이는가'를 확인하거나 시설 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없고, 지역코드·법정동코드·행정동코드(STDG_CD, DONG_CD)로 행정구역 코드표나 대피·구호시설 같은 같은 기관의 재난안전 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 폭염저감시설 정보로, 지역코드,법정동코드, 행정동코드, 설치일시, 제품제작업체, 설치업체, 전체높이,원단명, 위경도, 사용여부 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
