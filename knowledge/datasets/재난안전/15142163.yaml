description_portal: 본 데이터는 경찰청에서 제공하는 2025년 기준 전국 시도경찰청별 112 신고 발신 유형 현황입니다. 서울청, 부산청 등 각 시도청을 기준으로 긴급신고 접수 매체를 유선, 무선(휴대전화), 문자 등 3가지로 분류하여 각각의 접수 건수를 제공합니다. 이 데이터를 통해 각 지역별 112 신고의 매체별 이용 비중과 특성을 비교 분석할 수 있습니다. 또한 무선 및 문자 신고 비율 등 치안 환경의 변화를 파악하고, 지역 맞춤형 긴급 대응 체계 개선 및 치안 자원의 효율적 배분을 위한 정책 수립의 기초 자료로 유용하게 활용할 수 있습니다.
