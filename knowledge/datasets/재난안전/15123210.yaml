summary_user: 경기도 취약계층 가구에 보급한 주택용 소방시설(분말소화기·화재경보기) 실적을 시군과 관할 관서별로 집계한 데이터로, 보급 가구 수, 소화기 수, 감지기 수를 담는다. 소방·복지 담당자나 분석가가 "우리 시군의 취약가구 중 소화기와 화재경보기를 받은 가구가 얼마나 되나"를 확인하고 지역별 보급 격차를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 화재 발생 통계 같은 다른 시군 단위 데이터와는 시군명(sigun_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 내 취약계층을 대상으로 한 주택용 소방시설 보급 현황을 담고 있습니다. 해당 사업은 화재 발생 시 인명 및 재산 피해를 최소화하기 위해 기초생활수급자, 차상위계층, 독거노인, 장애인, 소년소녀가장, 한부모가정 등 사회적 배려 대상 가구에 분말소화기와 주택용 화재경보기를 지원하는 것을 목적으로 합니다. 보급 기준은 1가구당 분말소화기 1개와 화재경보기 2개이며, 이는 최소한의 초기 대응력을 확보하기 위한 배치입니다. 데이터는 시군별 보급 실적, 보급 수량, 대상자 분포 등을 포함하여 지역별 재난 대응 역량 강화를 위한 정책 수립의 기초 자료로 활용될 수 있습니다.
