summary_user: 남원시가 지정한 이재민 임시주거시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 5KB)로, 시설 구분·명칭·위치·위도·경도·면적·수용인원·대체 지정 장소와 주소·내진설계 여부·지정일자를 담는다. 재난으로 집을 잃은 남원 시민이나 구호 담당자가 "우리 동네 근처에서 이재민이 머물 수 있는 시설은 어디이고 몇 명까지 수용하나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 대피·구호시설 데이터와는 좌표·주소나 시설명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 남원시에서 제공하는 임시주거시설의 현황과 위치 정보를 담고 있습니다. 해당 시설은 재난이나 각종 사고로 인해 인명 피해가 발생했을 때, 이재민들이 안전하게 머물 수 있도록 마련된 공간입니다.데이터에는 각 시설의 구분, 명칭, 위치, 위도와 경도, 그리고 면적, 수용 가능 인원, 대체 지정 장소 및 그 주소, 내진 설계 여부, 지정일자 등의 정보가 포함되어 있습니다. 이를 통해 재난 발생 시, 관계 기관이 보다 신속하고 체계적인 대응을 할 수 있으며, 이재민 보호와 시민들의 불안 해소에도 크게 기여할 수 있습니다.궁극적으로는 재해 상황에서의 혼란을 줄이고, 지역 사회의 안전성과 회복력을 높이는 데 중요한 역할을 할 것으로 기대됩니다.
