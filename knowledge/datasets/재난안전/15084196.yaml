summary_user: 전국 경찰서별로 사이버범죄 신고를 받는 관서의 지역, 명칭, 주소, 전화번호, 접수방법(홈페이지 등), 신고·접수 유형(사이버범죄, 불법 콘텐츠, 상담 및 제보 등)을 관서 한 곳당 한 행으로 담은 목록 파일(csv, 약 45KB)이다. 사이버 사기나 불법 콘텐츠 피해를 입은 국민이 '우리 지역에서 사이버범죄를 어디에, 어떤 방법으로 신고하나'를 확인하거나, 분석가가 지역별 신고 접수 창구 분포를 볼 때 쓴다. 공통 조인 키는 없으므로 경찰서 이름이나 주소를 매개로 경찰관서 위치 데이터나 경찰서 단위 범죄 발생·검거 통계와 맞춰 이어 쓴다.
limits: 관서별 접수 창구 안내 목록이라 실제 신고 건수나 범죄 발생 통계는 담지 않는다. 표준 기관코드 같은 전역 키가 없어 다른 데이터와 연결하려면 경찰서명·주소를 직접 맞춰야 하며, 경찰서 단위 지표는 대검찰청 처리 통계와 기준이 다르다는 점에 유의한다.
