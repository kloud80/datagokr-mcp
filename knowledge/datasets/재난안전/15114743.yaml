description_portal: 이 데이터는 해양경찰청이 2022년 12월 발간한 『의무경찰 백서』에 포함된 통계를 기반으로, 2018년부터 2022년까지 최근 5년간 전경 및 의경에게 발생한 공상자와 사상자 현황을 상세하게 정리한 자료이다. 연도별 사고 발생 규모뿐 아니라 유형별 변화 흐름을 함께 파악할 수 있어, 해양의무경찰이 수행하는 근무 환경의 위험도와 구조적 문제점을 분석하는 데 중요한 참고자료가 된다. 또한 해당 데이터는 인력관리, 안전 예방대책 수립, 교육·훈련 보완 등 정책적 의사결정 과정에서 활용될 수 있는 기초 근거로서 높은 활용 가치를 가진다.
