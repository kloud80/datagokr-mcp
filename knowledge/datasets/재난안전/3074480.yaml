description_portal: 이 데이터는 경찰청이 일회성으로 제공하는 데이터로 2012년 수집한 피의자 범행동기 현황을 정리한 자료이며, 범죄대분류, 범죄중분류별로 범행동기(생활비, 유흥비, 도박비, 허영사치심, 치부, 기타 등)와 기타 동기(사행심, 보복, 가정불화, 호기심, 유혹, 우발적, 현실불만, 부주의, 미상 등)를 수치로 기록하고 있다. 본 자료는 범죄별 주요 동기와 요인을 분석하여 범죄 예방 및 대응 정책 수립에 활용된다. 경찰청은 이 데이터를 통해 범죄자의 행동심리를 이해하고 동기별 통계 자료를 구축하여 과학적 치안활동의 기초자료로 삼는다. 데이터는 공공데이터포털을 통해 개방되며, 범죄분석 및 정책 개발에 참고자료로 제공된다. 본 자료는 범죄 예방과 치안 강화에 기여하는 기반자료로 중요한 의미를 가진다.
