description_portal: 대한민국과 중국 간 체결된 한중어업협정에 따라 서해 배타적경제수역 내에서 합법적으로 조업이 허가된 중국어선의 활동 현황을 체계적으로 수집·관리한 자료이다. 이 데이터에는 허가 등록 선박 수, 실제 조업 선박 수, 일·월별 평균 조업 척수, 조업 해역 및 기간 등의 정보가 포함된다. 이를 통해 허가 대비 실제 조업 규모를 분석하고, 조업 집중 시기와 해역을 파악할 수 있다. 또한 불법조업 단속 전략 수립, 해양 질서 유지, 한중 공동어업 관리의 객관적 근거 자료로 활용되며, 서해 수산자원 보호와 효율적인 해양경찰 경비·감시 활동을 지원하는 핵심 데이터이다.
