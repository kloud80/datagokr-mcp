summary_user: 2024년 전국 경찰서별로 살인·강도·절도·폭력 등 강력범죄 발생 건수를 한 행씩 담은 집계 통계 파일(csv)이다. 우리 동네 관할 경찰서의 폭력·절도 발생이 다른 경찰서보다 많은지 비교하려는 주민이나 지역 치안 지표를 만드는 분석가가 쓴다. 전역 조인 키가 없어 경찰서 이름을 기준으로 다른 경찰청 통계(검거·112신고 등)나 경찰관서 위치 데이터와 이름 매핑으로 연결해야 한다.
description_portal: 경찰청 형사국 강력범죄수사과에서 제공하는 2024년 전국 경찰서별 강력범죄 발생 현황 통계입니다.전국적으로 볼 때, 폭력 범죄가 다른 강력범죄에 비해 압도적으로 많은 비율을 차지하고 있습니다. 서울 지역에서는 서울강서서가 2,055건, 서울관악서가 2,248건으로 폭력 범죄 발생 건수가 특히 높았습니다. 부산에서는 부산진서가 1,697건으로 가장 많은 폭력 범죄를 기록했고, 대구에서는 대구달서서가 1,270건으로 높은 수치를 보였습니다. 인천 지역에서는 인천남동서의 폭력 건수가 2,209건으로 눈에 띄게 많았습니다.반면, 살인과 강도 같은 중대 강력범죄는 상대적으로 발생 건수가 적게 나타났습니다. 예를 들어, 살인 사건은 대부분의 경찰서에서 한 자릿수 건수를 기록했고, 강도 사건 역시 10건 미만이었습니다. 강간 범죄는 폭력 다음으로 발생 건수가 많은 편이었는데, 특히 서울강서서에서 1,014건, 서울관악서에서 1,572건이 발생해 높은 수치를 보였습니다.
