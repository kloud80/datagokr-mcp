summary_user: 공공시설물 소분류별로 건설안전사고의 사망자·부상자 수(내국인·외국인 구분)와 재산피해 금액 구간(1000만원 미만부터 5억 이상까지 7구간)별 건수를 모은 전국 단위 집계표로, 포털 설명 기준 65개 소분류 행과 12개 열로 이루어진 작은 CSV 파일이다. 건설안전 분석가나 발주·시공 사업자가 '어떤 종류의 시설물 공사에서 인명피해와 큰 재산피해가 많이 나는가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 사고·시설 안전 데이터와는 시설물 소분류 이름을 직접 맞춰 붙여야 한다.
description_portal: 국토안전관리원에서 제공하는 공공시설물 소분류별 인명피해 및 재산피해 등에 대한 데이터입니다.데이터는 소분류, 사망자정보, 부상자정보, 재산피해금액 등의 12개의 열과 65개의 행으로 구성되어 있습니다.65개의 행의 정보는 소분류로 구분되어 있는 개별 시설물에 대한 정보입니다.데이터를 보게 된다면, 사망자와 부상자 수는 공동주택 시설물에서 가장 많이 발생한 것을 확인할 수 있습니다.각 시설물의 사고로 인한 피해금액은 7가지로 분류되어 있으며, 1000만원미만의 경우에 대부분이 해당합니다.
