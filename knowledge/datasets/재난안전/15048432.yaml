description_portal: 경찰청 범죄예방정책과에서 제공하는 총포 및 화약류 관리 현황 통계는 2001년부터 2021년까지 총포 제조, 판매, 소지(엽총, 권총, 공기총, 기타), 영치 건수와 화약류 제조, 판매, 저장소, 광산 사용, 기타 사용 현황을 연도별로 보여줍니다(1회성 제공).엽총 소지 건수가 가장 많으며, 공기총 소지 건수가 그 뒤를 잇습니다. 총포 영치 건수는 소지 건수에 비해 낮은 수준입니다. 화약류는 기타 사용 건수가 가장 많고, 제조 및 판매 건수는 상대적으로 적습니다. 전반적으로 총포 소지 및 화약류 사용 건수는 큰 변동 없이 유지되는 경향을 보입니다. 이 통계는 총포 및 화약류의 안전 관리 정책 수립 및 생활 안전 관련 기초 데이터로 활용될 수 있습니다.
