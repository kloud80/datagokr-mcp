summary_user: 경상북도 119 신고에 대해 내려진 출동지령을 지령 단위로 담은 파일(CSV 약 121MB)로, 긴급구조번호·출동 소방서와 안전센터(지역대)·출동차수·지령일시와 함께 방송지령 성공·확인 여부, 출동지령서 전송·확인 여부와 시각, 예고지령 성공 여부를 기록한다. 소방 행정 분석가가 '소방서·안전센터별로 지령 후 방송지령이나 출동지령서가 확인되기까지 얼마나 걸리고 전송 실패는 얼마나 되는가' 같은 출동 절차 점검에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 소방서·안전센터 이름을 맞추거나 같은 기관 데이터의 긴급구조번호로만 이어 쓰며, 경상북도 화재 발생 건별 자료나 119안전센터 목록과 이름 기준으로 연계하는 방식이 현실적이다.
limits: 실측 컬럼에서 전역 조인 키가 확인되지 않아 신고 내용·사고 유형·피해 규모는 이 파일만으로 알 수 없고, 다른 데이터와 붙이려면 이름이나 기관 내부 코드 매핑이 필요하다. 행정단위가 비공간 자료여서 위치 기반 분석에는 소방서·안전센터 위치 자료를 따로 결합해야 한다.
