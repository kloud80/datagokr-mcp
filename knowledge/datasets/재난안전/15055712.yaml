summary_user: 전북특별자치도 내 지정된 민방위 비상대피시설(아파트 지하주차장, 공공기관 지하 시설 등)을 시설 한 곳당 한 행으로 담은 파일 데이터로, 시군구·읍면동, 도로명·지번 주소, 수용인원과 면적, 건축·지정연도, 방송·급수시설·자가발전기·내진설계·비상용품함 보유 여부를 포함한다. 도민이 '우리 동네에서 가장 가까운 민방위 대피소가 어디이고 몇 명을 수용하는가'를 찾거나, 재난 관리 담당자가 시군구별 대피 수용력과 설비 현황을 점검하는 데 쓴다. 전역 조인 키나 행정코드는 없어 시군구·읍면동 이름이나 주소 문자열로 다른 대피·구호시설(지진/해일 대피장소, 무더위/한파쉼터 등)이나 재난 위험지역 데이터와 맞춰 써야 한다.
description_portal: 전북특별자치도 내에 지정된 민방위 비상대피시설의 현황을 정리한 데이터입니다. 이 자료는 전쟁이나 기타 국가적 재난 발생 시 도민들이 안전하게 대피할 수 있도록 마련된 아파트 지하주차장, 공공기관 지하 시설 등의 목록입니다. 각 대피소의 명칭과 주소, 수용 가능 인원과 면적, 그리고 급수 및 방송 시설, 비상 발전기 보유 여부 등 중요한 정보를 포함하고 있습니다. 이 데이터는 비상 상황 시 자신의 위치에서 가장 가까운 대피소를 찾는 데 도움을 주는 필수적인 정보이며, 재난 관리 당국에서는 이를 통해 대피 시설을 체계적으로 관리하고 점검할 수 있습니다.
