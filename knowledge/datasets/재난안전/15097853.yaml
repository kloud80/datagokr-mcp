summary_user: 강릉 지역에서 도로명주소 기반 도로 가운데 폭 2.0m 이하이면서 연장 100m 이상인 소방차 진입불가 구간을 도로 단위로 모아, 도로명·도로폭·도로길이·위치 좌표를 담은 작은 CSV 파일(약 7KB)이다. 소방서나 지자체 담당자가 '펜션·관광시설이 몰린 곳 중 소방차가 들어가지 못하는 좁은 도로는 어디이며 어떤 도로부터 넓혀야 하나'를 따질 때 쓴다. 전역 조인 키는 없어 도로명으로 도로명주소 자료와 맞추거나 위치 좌표(위치좌표_x·y)로 숙박시설·소방용수·119안전센터 위치 자료와 공간적으로 겹쳐 쓴다.
limits: 표준 코드 형태의 조인 키가 없어 다른 데이터와는 도로명 문자열 매칭이나 좌표 기반 연결로만 이어진다. 포털 설명상 강릉 도로만 담은 것으로 보이며, 실측 claim의 범위 표기(전국·비공간)는 실제 컬럼(좌표 포함)과 맞지 않으므로 범위를 확인하고 써야 한다.
