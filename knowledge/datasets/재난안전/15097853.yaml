description_portal: 강원특별자치도 내 소방차 진입 불가 지역을 파악하기 위해 도로명주소 기반의 도로를 도출하고, 각 도로에 대한 실폭(도로 폭) 정보를 추가하여 구축한 데이터입니다. 폭 2.0m 이하이면서 연장 100m 이상인 도로를 소방차 진입불가 구간으로 분류합니다. 이를 기반으로 해당 구간은 펜션 등 숙박시설, 관광시설 밀집 지역에서 화재 대응에 취약한 지역으로 판단됩니다. 본 데이터는 소방기관과 행정기관에서 소방차 진입로 확보, 위험지역 관리, 도로 개선 우선순위 설정 등 소방안전 정책 수립에 활용될 수 있습니다.
