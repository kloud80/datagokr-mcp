summary_user: 해양경찰청에 신고·접수된 선박 관련 해양조난사고를 사고 한 건씩 담은 원천 데이터로, 발생일시·관할 해경서·발생해역·발생유형·원인·기상특보·인명피해(구조·부상·사망·실종)·위경도·관련 선박의 선종과 톤수를 전국 범위로 담는다. 해양안전 분석가나 연안 지자체 담당자가 "어느 해역에서 어떤 유형·원인의 사고가 기상특보 중에 자주 나는가"처럼 사고 위치와 원인 패턴을 살피는 데 쓴다. 전역 조인 키는 없어 위경도로 지도나 해역 경계와 공간 결합하거나, 관할해경서·발생해역 이름으로 같은 기관의 파출소·인명구조함 위치 데이터와 이어 쓴다.
limits: 표준 행정코드나 전역 조인 키가 없어 다른 데이터와는 이름 매핑이나 좌표로만 연결된다. 파일 내려받기 방식(csv 약 135KB)으로 제공되며, 이 데이터는 신고·접수된 사고만 담는다.
