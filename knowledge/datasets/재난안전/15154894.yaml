description_portal: 이 데이터는 한국승강기안전공단의 승강기 안전인증 평가 과정에서 요구되는 제출 서류 목록을 정리한 것입니다. 각 행은 인증 대상 품목에 대해 제출해야 하는 서류 정보를 담고 있으며, 주요 항목으로는 ‘인증품목조합코드’, '인증품목명',‘제출서류조합코드’, ‘제출서류소분류코드’, ‘제출서류명’, ‘기술서류여부’, ‘(구)제출서류명’ 등이 포함되어 있습니다. ‘인증품목조합코드’는 각 승강기 부품 또는 제품의 조합을 식별하는 코드이며, '인증품목명'은 '인증품목조합코드'에 따른 품목명을 나타냅니다. ‘제출서류조합코드’와 ‘소분류코드’는 제출서류의 유형과 세부 분류를 구분하기 위한 값입니다. ‘제출서류명’은 제출해야 할 서류의 명칭을 명확히 나타내며, ‘기술서류여부’는 해당 서류가 기술 관련 문서인지 여부를 ‘Y’ 또는 ‘N’으로 구분합니다. 과거에 사용되던 명칭은 ‘(구)제출서류명’ 항목을 통해 함께 제공되어 서류 관리의 일관성을 유지합니다. 이 데이터는 안전인증 준비 과정에서 필요한 문서를 사전에 파악하고, 제출 요건을 체계적으로 관리하는 데 활용될 수 있습니다.
