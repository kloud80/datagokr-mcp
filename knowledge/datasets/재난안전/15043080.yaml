summary_user: 성남시가 폭염 대응으로 횡단보도·교통량 많은 곳에 설치한 그늘막을 한 개소당 한 행으로 담은 원천 목록으로, 설치장소·도로명/지번 주소·위도·경도, 설치일자, 높이·펼침지름·원단, 당해년도 운영 시작·종료일, 관리기관과 고정형·스마트 구분이 들어 있다. 시민이 "우리 동네 횡단보도 어디에 그늘막이 있나"를 찾거나, 분석가가 읍면동별 그늘막 분포를 보행량·열섬 지도와 겹쳐 설치가 부족한 곳을 찾는 데 쓴다. 전역 조인 키는 없어서 읍면동명·주소로 이름을 맞추거나 위도·경도로 무더위쉼터 같은 다른 대피·구호시설 좌표 데이터와 공간 결합해 이어 쓴다.
limits: 범위는 성남시 한 곳뿐이라 다른 시군과 비교하려면 별도 자료가 필요하다. 공통 코드 키가 없어 다른 데이터와 붙일 때 주소 표기 차이나 좌표 매칭 오차를 직접 정리해야 한다.
