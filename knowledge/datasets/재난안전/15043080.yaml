description_portal: 본 자료는 성남시가 폭염 대응을 위해 교통량 많은 지역 및 횡단보도 등에 설치한 그늘막 현황을 수록한 공공데이터입니다. 고정형 및 스마트 그늘막의 위치, 유형, 설치일자, 관리자 정보 등을 제공합니다. 특히 스마트 그늘막은 IoT 기반 자동 제어가 가능해 기온이나 날씨에 따라 접히거나 펼쳐집니다. 자료는 위도·경도 정보가 포함돼 시각화 및 위치 분석에 유용합니다. 활용 시 보행자 안전 및 도시 열섬 완화 등의 정책 분석에 활용 가능하며, 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.
