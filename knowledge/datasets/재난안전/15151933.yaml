summary_user: 의정부시 안에 설치된 CCTV를 설치 지점별로 담은 원천 목록으로, 행정동·위치·경도·위도·용도(방범·교통·어린이보호구역·무단투기 단속 등)·설치갯수를 담는다(csv 약 8KB). 시민이나 분석가가 '우리 동네 어느 지점에 어떤 용도의 CCTV가 몇 대 있는가', '행정동별로 방범 CCTV가 부족한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 좌표(경도·위도)를 기준으로 보안등·안전비상벨 같은 다른 방범 인프라 데이터나 행정동 경계와 공간 결합해 쓴다.
description_portal: 경기도 의정부시 빅데이터공유활용 CCTV 현황 데이터는 시민의 안전 확보와 도시 내 방범·교통 관리 효율성을 높이기 위해 구축된 자료입니다. 해당 데이터는 고유번호, 행정동, 위치, 경도, 위도, 연결사이트, 공간정보_1, 용도, 우편번호, 설치갯수 등의 항목으로 구성되어 있습니다. 이를 통해 CCTV가 설치된 위치 정보를 공간 데이터(POLYGON 또는 좌표) 형태로 확인할 수 있으며, 행정동별 설치 현황 및 용도를 한눈에 파악할 수 있습니다. CCTV의 주요 용도는 방범, 교통 관리, 어린이 보호구역 안전, 쓰레기 무단투기 단속 등 다양한 공공 목적을 포함하며, 데이터 분석을 통해 지역별 치안 사각지대나 설치 필요 지역을 선별할 수 있습니다. 또한 경도·위도 정보를 활용하여 GIS(지리정보시스템) 기반 시각화가 가능하고, 연결사이트 항목을 통해 실제 영상 관리 시스템이나 관련 행정 포털과 연계할 수 있습니다. 이 데이터는 의정부시의 스마트시티 정책, 도시안전 인프라 확충, 주민 체감형 안전 서비스 고도화 등 다양한 분야에서 활용 가치가 높습니다.
