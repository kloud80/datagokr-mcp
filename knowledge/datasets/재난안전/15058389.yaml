summary_user: 경기도에서 발생한 화재·붕괴·자연재해 등 재해의 피해와 복구를 연도(SUM_YY)와 시군별로 집계한 데이터입니다. 피해 세대 수, 인명피해, 주택 피해·침수 동수, 농경지·농작물 피해 면적, 공공시설 피해 건수, 피해액과 복구액을 담습니다. 분석가나 지자체 담당자가 "경기도에서 어느 시군의 재해 피해액과 복구액이 해마다 컸는가"를 비교할 때 쓰고, 다른 데이터와는 전역 조인 키 없이 시군명·시군코드(SIGUN_CD)를 이름이나 같은 기관 코드로 맞춰서만 이어 씁니다.
description_portal: 경기도에서 발생된 화재, 붕괴사고, 천재지변 등에 의한 재난 재해 피해 현황 및 재난안전관리분야의 사업 집행에 대한 현황 정보를 제공합니다.이 데이터는 경기도 내 공중이용시설 중 ‘공연장’으로 인허가된 시설들의 현황을 정리한 자료로, 객석 수 1,000석 이상의 대형 공연장 시설을 포함하여, 공연예술 활동을 위한 공공 문화공간의 위생 및 운영 상태를 확인할 수 있는 공공데이터입니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태, 위생업종명, 위생업태명, 도로명 및 지번 주소, 우편번호, 위도·경도(WGS84) 등으로 구성되어 있으며, ‘공중이용시설’로 분류되어 「공중위생관리법」 및 「실내공기질관리법」 등 관련 법령의 적용을 받습니다.이 데이터는 공연장이 공중위생에 미치는 영향을 관리하고, 다중이용시설로서의 안전성과 청결성을 유지하기 위해 수집되며, 공연장 분포 분석, 위생 관리 대상 파악, 문화시설 인프라 평가, 지역별 문화 접근성 분석 등의 목적으로 활용됩니다. 특히 위경도 정보는 GIS 기반 시각화를 통해 공연장 접근성 및 지역 문화 인프라 격차 해소 정책 수립에 유용합니다. 본 자료는 경기도 및 시군 위생 부서, 문화예술 행정기관 등에서 수집한 공공데이터입니다.
