description_portal: 해당 데이터는 한국가스공사 인천기지본부에서 운용중인 경상정비용 중장비의 법정검사 실적 데이터 개방을 목적으로 함, 해당데이터 개방을 통해 국민의 공공데이터 이용권 보장 및 공공데이터 이용 활성화를 도모하고자 함. 한국가스공사 인천기지본부에서는 굴삭기, 험지형 크레인, 지게차는 건설기계관리법에 따라 1년 1회 정기검사를 수행하고 있으며, 고소작업차 및 차량탑재형 크레인은 각각 6개월 그리고 1년 마다 자동차 관리법에 따라 정기검사를 수검함. 또한 고소작업차 및 차량탑재형 크레인은 고용노동부 안전검사 또한 받아야함
