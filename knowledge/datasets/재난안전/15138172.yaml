description_portal: 한국승강기안전공단이 관리하는 승강기 비상통화장치의 설치 현황을 정리한 데이터입니다. 각 행은 개별 승강기를 식별하는 관리번호(1·2), 장치 설치여부(Y/N), 등록일자를 포함합니다. 본 자료의 목적은 현장의 안전관리와 법정 기준 충족 여부 점검, 점검·정비 우선순위 설정, 노후 설비 교체·개선 계획 수립 등 공단의 검사·관리 업무에 참고 기준을 제공하는 데 있습니다. 내용은 공단 관리대상 승강기에 한정되며, 설치 유형(유선/무선), 제조사, 고장이력, 통화 시험결과 등 상세 기술정보는 포함하지 않습니다. 등록일자는 행정시점 기록으로, 실제 설치일과 상이할 수 있으며, 동일 승강기에 대한 상태 변경·정정으로 여러 건이 존재할 수 있습니다. 주소·소유자 등 개인정보는 포함하지 않으며, 관리번호는 내부 식별을 위해 사용됩니다.
