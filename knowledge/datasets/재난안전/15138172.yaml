summary_user: 한국승강기안전공단 관리대상 승강기별로 비상통화장치 설치여부(Y/N)와 등록일자를 담은 건별 원장 파일로, 범위는 전국이며 위치정보는 없습니다. 시설 안전 분석가나 관리 주체가 '비상통화장치가 아직 설치되지 않은 승강기는 얼마나 되고 어느 것인가'를 확인해 점검·개선 우선순위를 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 승강기관리번호를 같은 기관의 다른 승강기 데이터와 맞춰 보는 방식으로만 연결한다.
