summary_user: 한국승강기안전공단에 접수된 승강기 안전인증 신청을 건별로 담은 파일로, 신청·접수일자, 모델명, 접수번호, 인증품목·인증유형·공장 코드와 함께 신청서류·부품·제출파일·제원 수 같은 접수 패키지 규모를 전국 범위로 기록한다. 승강기 부품 제조사나 분석가가 "어느 공장·인증품목에서 안전인증 신청이 얼마나 들어오고, 신청 건마다 서류·부품 구성이 얼마나 복잡한가"를 볼 때 쓴다. 접수번호(elevator_cert_rcpt_no), 인증품목조합코드(elevator_cert_item_cd), 공장코드(elevator_factory_cd)가 조인 키라서, 같은 키를 가진 공단의 다른 안전인증 관련 데이터와 접수 건·품목·공장 단위로 이어 쓴다.
description_portal: 이 데이터는 한국승강기안전공단에 접수된 ‘안전인증 신청’ 단위를 체계적으로 기록한 메타데이터입니다. 각 행에는 신청일자·모델명·접수번호·접수일자와 함께 인증품목조합코드, 인증유형코드, 모델개별구분코드, 공장코드 등 식별·분류용 정보가 포함됩니다. 또한 신청서류 수, 신청부품 수, 제출파일 수, 신청대상항목 수, 신청제원 수, 신청모델 분류 수 등 접수 패키지의 구성 규모를 나타내는 정량 필드가 제공되어, 신청건의 복잡도와 준비 수준을 간접 파악할 수 있습니다. 동일 모델의 반복 접수나 보완·정정 접수도 존재할 수 있어 신청 이력 추적이 가능합니다. 범위는 공단에 ‘신청’된 단계의 기록으로 한정되며, 심사결과(적합/부적합), 인증서 발급 번호·상태, 시험성적 등 후속 절차의 상세 결과는 포함하지 않습니다.
