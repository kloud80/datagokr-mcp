description_portal: 경찰청 경비국 항공과에서 제공하는 헬기 보유 현황 통계는 각 시도 경찰청별 헬기 보유 대수를 보여줍니다. 쌍발과 단발 헬기로 구분되며, 28인승부터 7인승까지 다양한 기종의 헬기 보유 현황을 서울, 경기, 강원, 경남, 인천, 충남, 충북, 전남, 전북, 제주, 광주, 부산, 경북, 경남 지역별로 확인할 수 있습니다(1회성 제공).서울청은 28인승과 14인승 헬기를 보유하고 있으며, 경기청은 14인승 헬기를 보유하고 있습니다. 강원청은 8인승 단발과 7인승 단발 헬기를 보유하고 있습니다. 이처럼 지역별 헬기 보유 현황을 통해 경찰 항공 전력의 지역별 배치 상황과 특성을 파악할 수 있습니다. 재난 대응 및 치안 유지 활동을 위한 헬기 운용 계획 수립에 활용될 수 있는 중요한 정보입니다.
