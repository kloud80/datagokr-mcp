summary_user: 인천광역시가 민방위 비상 상황에 대비해 지정한 비상급수시설을 시설 한 곳당 한 행으로 담은 목록이며, 군구·읍면동, 도로명·지번 주소, 음용수·생활용수 용도, 개방 여부, 하루 급수용량(톤)과 사용 가능 인원을 기록한다. 시민이 '재난·단수 때 우리 동네에서 물을 받을 수 있는 가장 가까운 급수시설은 어디인가'를 확인하는 데 쓰고, 지자체 담당자는 구별 급수용량 대비 인구를 따져 비상 식수 확보 계획을 세우는 데 쓴다. 전역 조인 키가 없으므로 다른 대피시설·인구 자료와는 군구·읍면동 이름이나 주소를 맞춰 연결해야 한다.
description_portal: 인천광역시 민방위 비상급수시설 현황으로 정부지원, 지자체, 공공공 시설 314개소가 있습니다. 각각의 시설은 음용수와 생활용수로 구분됩니다.인천광역시가 제공하는 민방위 비상 급수 시설 현황 공공데이터는 재난 발생이나 전시(戰時) 등의 비상 상황 시 시민들에게 식수를 공급하기 위해 지정된 급수 시설의 상세 정보를 집계한 목록 자료입니다. 이 데이터는 재난 대응 체계 구축, 비상 식수 확보 계획, 시설 접근성 및 관리 등을 파악하고, 민방위 대비 훈련, 도시 안전 및 복지 정책 수립의 기초 자료로 활용됩니다.
legal_basis_portal: 전쟁 및 상수도 체계의 마비 등과 같은 민방위사태 발생으로 상수도 공급 중단 시 최소의 음용 및 생활용수를 주민에게 공급하기 위함
