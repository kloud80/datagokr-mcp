description_portal: 한국전기안전공사에서는 전통시장(자가용전기설비)의 개벌 세대와 점포에 대하여 일반용전기설비 점검 기준 및 절차에 따라 주기적으로 안전점검을 실시합니다.안전점검을 진행하는 관련 법적 근거로는 전기안전관리법 제14조, 같은 법 시행규칙 제20조, 제21조에 해당됩니다.이 데이터는 2021년부터 2024년까지 전국 지역 한국전기안전공사 본부가 있는 지역별로(서울특별시, 부산울산, 경상북도, 인천광역시, 전라남도, 충청남도, 경기도, 강원도, 충청북도, 전라북도, 경상남도, 제주도)의 전통시장 정기점검 결과 적합 건수, 부적합 건수, 부재종결 건수를 제공하는 데이터입니다.
