summary_user: 경기도 시군별 지구대·파출소를 관서 한 곳당 한 행으로 담은 위치 목록으로, 소속 경찰서명·관서명·구분(지구대/파출소)·도로명·지번 주소·우편번호·WGS84 위경도를 포함한다. 주민이나 분석가가 '우리 동네 가장 가까운 파출소는 어디이고 어느 경찰서 소속인가', '시군별 치안시설 분포가 고른가' 같은 질문에 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 시군명·시군코드(SIGUN_CD)나 주소·좌표를 이용한 이름 매칭·공간 결합으로 대피시설·소방 등 다른 안전관리 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별 지구대 및 파출소의 현황을 제공합니다. 데이터에는 경찰서명, 관서명, 구분명, 소재지 주소(도로명 및 지번), 소재지 우편번호, WGS84 위도·경도 좌표 등 경찰 관서의 위치 및 식별 정보를 포함하고 있습니다. 이를 통해 경찰 행정망 분포, 재난안전 체계 구축, 범죄예방 활동, 생활 안전 정책 수립 등에 활용할 수 있습니다. 또한 긴급상황 대응 시 관할 지구대 및 파출소의 신속한 파악을 지원하며, 도시계획, 교통안전, 치안시설 배치 연구 등에도 활용 가능합니다. 데이터 활용 시 최신 행정구역 개편이나 관서 이전 등 변동사항을 확인하는 것이 중요합니다.
