description_portal: '본 자료는 한국승강기안전공단 내부에서 적용하는 출장여비 기준단가를 표준 항목으로 정리한 데이터입니다. 각 레코드는 특정 기간에 유효한 단가 규정을 나타내며, 필드는 적용시작일자, 적용종료일자, 여비기준단가, 기준분류, 등록일자로 구성됩니다. 기준분류에는 직군(예: 관리직, 일반직 등), 업무유형(예: 단기 보조자 대당 검사수당), 조직·지역 단위(예: ○○지원, ○○지소)와 같이 단가 산정의 기준이 되는 구분값이 기록됩니다. 여비기준단가는 원 단위 금액으로 저장되며, 동일 분류에 대해 기간이 달라지면 별도 행으로 관리되어 변동 이력이 남습니다. 적용종료일자에 ‘9999-12-31’ 또는 ‘9999-01-01’과 같은 특수일자가 사용될 수 있으며, 이는 종료 미정 또는 현재 적용 중 상태를 의미합니다. 등록일자는 해당 규정이 시스템에 반영된 시점을 뜻하며, 동일 날짜에 복수 규정이 함께 등록될 수 있습니다. 표준화된 열 구조를 통해 분류·기간·금액 간 관계를 명확히 확인할 수 있도록 정리되어 있습니다.'
