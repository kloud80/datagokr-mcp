description_portal: 시흥도시공사에서 운영하는 생존수영 프로그램은 초등학생을 대상으로 학교와 연계하여 진행되고 있습니다. 현재 시흥도시공사 관리 하에 있는 공공 수영장을 운영하고 있습니다. 주요 수영장으로는 시흥국민체육센터, 능곡어울림센터, 정왕평생학습관, 은계어울림센터 등이 포함되어 있습니다. 각 수영장에서는 전문 강사진과 인명구조요원이 상주하며 체계적이고 안전한 수업이 이루어집니다. 특히 학생 중 일부는 인공 파도풀을 활용한 생존수영 교육을 받아 실제 파도 환경에서의 생존 기술도 익히고 있습니다. 생존수영 교육은 생존뜨기, 수중호흡, 구조 대형 형성 등 실전 중심 프로그램으로 구성되어 있습니다. 수영장에서 프로그램을 운영하며, 안전 관리를 위해 별도의 운영 시간대를 지정해 관리하고 있습니다. 최근에는 유치원생 대상 맞춤형 생존수영 프로그램도 은계1어울림센터에서 운영되는 등 대상별 맞춤 교육을 확대하고 있습니다. 시흥도시공사는 앞으로도 지역사회와 협력하여 생존수영 교육의 질을 높이고 시민들의 수상 안전 의식을 강화해 나갈 계획입니다. 생존수영 관련 사항은 시흥시청소년수련관 청소년문화체육팀 등에서 문의할 수 있습니다.
