summary_user: 한국전기안전공사가 제공하는 전기자가용설비의 설치 위치(상호·도로명주소)와 검사 시작·종료일, 점검 종류·결과·종합의견·점수·등급을 설비 검사 건별로 담고, 범위는 전국입니다. 시설 안전 담당자나 분석가가 특정 지역 자가용 전기설비의 검사 시점과 점검 결과·등급을 확인하는 데 씁니다. 법정동코드(STDG_CD)·시군구코드·필지코드로 보이는 필드는 있지만 실측에서 전역 조인 키로 확인되지 않아, 승강기·시설물 안전등급 같은 다른 시설 안전 원장과는 주소·이름 매핑이나 행정구역 코드로만 연결합니다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 한국전기안전공사에서 제공하는 전기자가용설비의 설치 위치 및 검사일자 정보입니다.\""
