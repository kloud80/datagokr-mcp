summary_user: 인천광역시 서해구(포털 설명상 서구) 안의 비상급수시설을 한 시설당 한 행으로 담은 CSV 파일(약 10KB)로, 시설종류·용도·개방 여부·시설명·시설유형·도로명/지번 주소·일일 급수능력(톤)·데이터기준일자를 수록한다. 재난으로 단수가 됐을 때 우리 동네 어디서 물을 받을 수 있는지, 그 시설이 주민에게 개방되는지를 확인하려는 주민이나, 지역별 급수능력 공백을 점검하는 담당자·분석가가 쓴다. 전역 조인 키는 없으므로 소재지 주소를 지오코딩하거나 주소·시설명을 맞춰 민방위 대피시설·무더위/한파쉼터 등 다른 대피·구호시설 데이터와 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 지역 내 설치된 비상급수시설에 관한 현황 정보를 담고 있습니다. 본 자료는 인천광역시 서구 내 비상급수시설의 시설종류, 용도, 개방유무, 시설명칭, 시설유형, 소재지(도로명,지번) 등의 정보를 수록하고 있습니다. 본 데이터를 통해 비상상황 대응 계획 수립, 주민안전정책 마련, 급수시설 보완 계획 등 다양한 분야에 기초자료로서 활용될 수 있을것으로 판단이 되며 또한 재난 대비 기반시설 정보를 제공함으로써 주민들에게 재난 대비에 좋은 도움이 될 것으로 판단이 됩니다.
