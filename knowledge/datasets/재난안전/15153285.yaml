summary_user: 19개 국립공원을 대상으로 한 산행안전지도의 주요시설물 정보를 시설 한 건 단위로 담으며, 시설명(국문·영문), 주소, 전화번호, 고도, 경위도·지도좌표, 분류·기호 코드, 사용 여부 등이 들어 있다. 등산객이나 공원 이용 안내를 만드는 사업자가 '이 국립공원 탐방로 근처의 주요 시설은 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 시설 위치를 지도에 올릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 국립공원 관리번호나 공원사무소 코드 같은 같은 기관 코드, 시설명으로 맞추거나 경위도 좌표로 다른 공간 데이터와 겹쳐 본다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 행정안전부에서 19개 국립공원 대상 산행안전지도 정보입니다.
