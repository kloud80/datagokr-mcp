summary_user: 전국 승강기를 승강기 고유번호·호기 단위로 한 건씩 담은 설치 원장 파일로, 건물명·주소·시도·시군구, 승강기 구분·형식·종류, 정격속도·적재하중·최대정원, 제조·유지관리업체, 최초설치일자·검사유효만료일자·승강기상태를 담는다. 지자체 담당자나 분석가가 '우리 시군구에 최초 설치 후 오래된 승강기가 몇 대이고 검사 유효기간이 곧 끝나는 것은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으므로, 같은 기관의 승강기 고유번호 기반 데이터나 시도·시군구·건물주소 같은 이름 매핑으로만 다른 데이터와 잇는다.
description_portal: 본 데이터는 한국승강기안전공단에서 제공한 승강기 설치 현황 자료로, 2015년 이전과 2016년 이후로 구분된 두 개의 데이터셋으로 구성되어 있다. 총 약 86만 건의 설치 정보를 포함하며, 주요 항목으로는 건물명, 주소, 설치 위치, 승강기 고유번호, 구분 및 형식, 정격속도, 적재하중, 최대정원, 제조업체, 유지관리업체 등이 있다. 본 자료는 지역별 설치 분포, 형식별 기술 특성 분석, 노후 승강기 관리 등 정책 수립과 민간 활용에 유용한 기반 자료로 활용 가능하다. 일부 항목은 결측치가 존재하며, ‘주행길이’는 승강기 종류에 따라 데이터가 존재한다. 해당 데이터는 국민 안전 향상 및 시설물 관리 효율화 목적의 공공데이터로 개방되었으며, 품질 개선과 주기적 갱신을 통해 신뢰도 높은 자료로 제공될 예정이다.
