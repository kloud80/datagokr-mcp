summary_user: 전국 LPG 충전소 1,977곳을 한 곳당 한 행으로 담은 건별 현황 파일이며, 행정구역·업소명·주소·전화번호·관리구분·위도·경도를 싣는다. 시민이나 사업자, 분석가가 "우리 동네 가까운 LPG 충전소가 어디인가", "지역별 충전소 입지가 어떻게 분포하는가" 같은 질문에 쓴다. 주소(address)와 위도·경도(coord)가 조인 키라서 주소 기반 데이터나 지도·GIS 좌표 데이터와 이어 쓰며, 별도의 충전소 고유번호 키는 없다.
description_portal: '한국가스안전공사가 수집 및 관리하는 전국 LPG 충전소의 현황 정보를 제공합니다. LPG 충전소 소재, 충전소 대표 전화번호, 관리유형, 상세위치(위도,경도) 등의 정보를 제공합니다.충전소 운영 현황, 입지 선정, GIS 서비스 등에 활용할 수 있습니다.※ 해당 정보는 타 유관기관에서 자체 수집, 관리를 통해 제공하는 정보와 일부 상이할 수 있음을 참고 바랍니다. ※ 전화번호의 경우, 개인정보 또는 확인이 불명확한 정보에 대해서는 공란으로 처리되어 있으니 참고 바랍니다.-데이터 기준일자: 2025년 11월 27일(2025년 4분기)'
