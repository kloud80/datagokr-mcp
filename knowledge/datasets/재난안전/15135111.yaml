description_portal: 국토안전관리원에서 관리하는 2021년도 부터 지역별 설계안전성 검토결과 현황을 통계자료 나타내어 csv 파일 형식으로 데이터를 제공 합니다.설계안전성검토는 건설 사업의 설계 단계에서 잠재적 위험 요소를 사전에 발굴하고, 위험성 평가를 통해 저감 대책을 수립하여 설계에 반영함으로써, 시공 과정의 안전을 확보하고 건설 현장 사고를 예방하는 활동입니다. 이는 관련 법규인 건설기술진흥법 시행령 제75조의2(설계의 안전성검토)에 따라 시행되며, 국토안전관리원에 검토를 의뢰하여 안전한 사회를 만드는 것을 목표로 합니다
