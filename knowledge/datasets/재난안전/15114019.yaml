description_portal: 기후변화로 인한 집중호우, 태풍 등 자연재해 빈발과 재해 대응체계 강화 필요성 증대, 시민 안전 확보를 위한 선제적 재해대비 정책 추진에 따라 보령시는 관내 수방시설과 재해대응 자재의 체계적인 관리와 효율적인 배치를 통해 신속한 재해 대응능력을 제고하고자 합니다. 이를 위해 읍면동별 수방자재 비축현황과 관리기관 정보를 투명하게 공개하여 재해 발생 시 신속한 대응체계 구축과 시민 안전망 강화에 기여하고 있습니다. 각 지역별로 비축된 다양한 수방자재의 종류와 수량, 관리주체 등을 포함한 종합적인 현황정보를 제공하고 있습니다.개방 데이터는 보령시 관내 16개 읍면동과 원산출장소의 수방자재 관리현황으로 시도명, 시군구명, 읍면동, 톤백, PP포대, 천막, 비닐, 로프, 말목, 삽, 햄머, 낫, 톱, 곡괭이, 재난안전선, 양수기, 펌프, 관리기관명, 관리기관 전화번호, 데이터 기준일자 등 총 20개 항목 17건의 정보를 제공합니다.재해대응기관은 재난 발생 시 자원 배치와 신속한 대응체계 구축에 활용하고, 연구기관은 지역 재해대비 정책 분석과 재해관리 효율성 연구에 활용하며, 시민들은 거주지역 재해대비 현황 파악과 안전정보 확인에 활용할 수 있습니다. 또한 관련 업체는 재해대응 사업 참여와 자재 공급계획 수립에 기여할 수 있습니다.
