description_portal: '한국승강기안전공단이 안전검사 과정에서 수집·확인하는 승강기 제원값의 임시등록 이력을 표준화해 제공하는 자료입니다. 각 행은 접수일자·접수번호, 승강기관리번호(1·2), 제원항목값, 등록일자 등 기본 메타정보로 구성되며, 현장 점검 중 확인된 제원(예: 정격속도, 적재하중, 치수, 개폐 방식 등)을 본 등록 전에 임시로 입력·보정하는 업무 흐름을 반영합니다. 본 데이터의 목적은 제원 검증 과정의 추적 가능성과 정합성 관리를 지원하고, 검사 전후 이력의 비교·감사를 가능하게 하는 데 있습니다. 제공 범위는 공단 시스템에 기록된 임시등록 단계의 개별 제원값 단위 로그이며, 항목명·단위·해석 기준, 최종 확정 제원 및 검사 판정 결과 등은 별도 원장 또는 제원 사전(마스터)에서 관리됩니다. 동일 장비에 대해 다수 건의 임시값이 존재할 수 있고, 자료는 형식 이해를 위한 예시에 불과해 전체 규모나 분포를 대표하지 않습니다. 식별자는 법령 및 내부 규정에 따라 관리됩니다.'
