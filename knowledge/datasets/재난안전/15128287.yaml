description_portal: '"재난관리자원"은 재난이 발생했을 때 인명 구조, 피해 복구, 피해 최소화 등을 위해 활용되는 인력, 장비, 물자, 시설, 기술 등 다양한 자원을 의미합니다. 이는 재난 대응, 복구, 예방 및 대비 단계에서 핵심적인 역할을 합니다재난관리자원의 주요 구성 요소1. 인력: 소방대원, 경찰, 군인, 응급구조사, 의료진, 자원봉사자 등2. 장비: 크레인, 절단기, 드론, 탐지기 등, 응급 장비, 구급차, 소방차, 헬리콥터 등3. 물자: 식량, 생수, 의약품, 담요, 텐트 등, 개인 보호장비(PPE), 마스크, 방호복, 장갑 등4. 시설: 대피소, 응급의료센터, 통신센터, 재난상황실 등5. 기술 및 시스템: 재난경보 시스템, 위성통신, GIS(지리정보시스템), CCTVs, 재난정보 앱 등, 전문가 (재난관리사, 기술자 등)공단 자원의 자원명, 규격, 보관장소, 자원상태, 응원상태, 수량, 용량, 보유량, 취득일시, 소유자유형 등 재난관리자원에 대한 데이터를 제공합니다.'
