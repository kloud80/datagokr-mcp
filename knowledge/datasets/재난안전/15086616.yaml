description_portal: 한국전기안전공사에서는 전기안전관리법 제11조, 제43조제2항, 같은 법 시행규칙 제8조, 제9조에 따른 정기검사를 진행하고 있으며, 전기사업법 제 63조, 제98조제2항, 같은법 시행규칙 제31조 및 전기안전관리법 제9조, 제43조제2항, 같은 법 시행규칙 제6조에 따른 사용전검사를 진행하고 있습니다. 이 데이터는 전기저장장치에 대한 검사 진행 후 배터리 용량을 정리한 데이터입니다.배터리의 연도별(2019 ~ 2025년) 발전자원별(태양광, 풍력, 피크저감, 기타)로 제공하고 있으며, 단위는 배터리 MWh 입니다. 기타 부분에는 연고용 및 주파수조정용, 비상겸용, 에너지자립섬 등이 포함되었습니다.
