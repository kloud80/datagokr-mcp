description_portal: 해상에서 긴급 상황발생시 긴급 무선 주파수 대역 및 채널 현황에 대한 데이터로 구분, 전파형식, 주파수, 단위 등의 항목을 제공합니다.디지털선택호출장치(DSC; Digital Selective Calling)는 선박에서 사용하는 해상무선설비로, VHF(초단파), MF(중파), HF(단파) 등 무선 주파수 대역에서 미리 정의된 디지털 신호를 사용하여 개별 선박이나 특정 그룹을 대상으로 조난, 긴급, 안전, 일반 통신 호출을 자동으로 수행하는 장치입니다. 이는 GMDSS(글로벌 해상 조난 안전 시스템)의 핵심적인 부분으로, 선박 간 또는 해안국과의 효율적인 통신을 가능하게 합니다.조난 통신에 사용하는 주파수. 국제 조난 주파수의 경우, 무선 전신에 대해서는 500kHz, 무선 전화에서는 2,182kHz 및 156.8MHz가 사용된다.
