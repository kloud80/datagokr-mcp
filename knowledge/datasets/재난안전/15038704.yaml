summary_user: 인천광역시 중구에 있는 비상대피시설을 시설 한 곳당 한 행으로 담은 파일로, 읍면동·시설명·도로명주소와 데이터기준일자를 담는다(csv 약 4.9KB 규모). 주민이 재난이나 전시 상황에서 우리 동네 가까운 대피시설이 어디인지 확인하거나, 분석가가 읍면동별 대피시설 분포를 살펴보는 데 쓴다. 전역 조인 키는 없어 읍면동 이름이나 도로명주소를 매핑하거나 주소를 좌표로 바꿔 다른 대피·구호시설 데이터나 재난 위험지역 데이터와 이어 쓴다.
description_portal: 이 데이터는 인천광역시 중구에 설치된 비상대피시설의 현황을 체계적으로 정리한 자료로, 재난이나 전시 등 비상상황 발생 시 주민들이 일시적으로 대피할 수 있는 시설에 대한 정보를 포함합니다.주요 항목으로는 대피시설의 명칭, 소재지, 시설 유형을 포함하고 있으며 특정 기준일에 따라 수집된 데이터입니다.해당 자료는 대피시설 확충 및 개선방안 마련 등에 활용될 수 있으며, 일반 국민들에게도 비상시 활용 가능한 대피시설 정보를 제공함으로써 안전한 생활환경 조성과 국가 재난관리 체계 강화에 기여하는 것을 목표로 합니다.
