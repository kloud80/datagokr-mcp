description_portal: 이 데이터는 경찰청이 일회성으로 제공하는 데이터로 2008년부터 2017년까지 집계한 사행성 게임장 위반 및 조치 현황을 정리한 자료이며, 연도별 구분, 사행행위(환전) 위반, 개변조 위반, 무등록 위반, 등급 미필 위반, 경품취급 기준 위반, 기타 위반, 구속 조치, 불구속 조치, 즉심 조치, 행정처분 건수를 포함한다. 데이터는 연도별 위반 유형별 건수와 조치 현황을 기록하여 사행성 게임장 불법 행위 추이와 대응 현황을 분석하고 정책 수립에 기여한다. 경찰청은 단속 현황과 처리 건수 변화를 파악하고, 불법 행위 예방 대책 마련에 활용한다. 데이터는 공공데이터포털을 통해 개방되며, 단속 및 정책 연구 참고자료로 제공된다. 본 자료는 공정한 게임 환경 조성을 위한 기반자료로 중요한 의미를 가진다.
