summary_user: 울산광역시 울주군이 방사능 재난 때 쓰는 소개(대피)경로를 경로 코드별로 묶어 경로 거리와 공간정보를 담는 API입니다. 원자력 사고 시 울주군 주민이나 방재 담당자가 "우리 지역의 소개경로가 어디로 이어지고 거리가 얼마인가"를 확인하는 데 쓴다. 실측 응답에서 전역 조인 키를 찾지 못해 다른 데이터와는 경로명·지명 매핑이나 같은 울주군 기관 데이터(대피·구호시설 등)로만 이어 쓴다.
limits: 범위가 울주군 한 개 시군구에 한정되어 다른 지역의 소개경로는 없습니다. 이벤트성으로 생성된 뒤 바뀌지 않는 데이터여서 실시간 교통·통제 상황은 반영되지 않습니다. 개발계정은 하루 1,000회 호출로 제한됩니다.
