description_portal: 제주특별자치도는 도 내 초등학생을 대상으로 어린이 통학 및 통학로의 교통안전 실태를 파악하기 위해 온라인 설문조사를 수행하였으며, 설문 결과는 학교, 학년, 성별, 교통사고 경험, 등-하교길 안전요인 및 위험요인 등 항목으로 구성되어 있다. 각 학교별 응답 결과가 공개되어 있으며 이를 통해 도는 초등학생의 보행자 안전, 스쿨존 환경, 교통사고 노출도, 안전 의식 수준 등을 정량적으로 진단할 수 있다. 이 데이터는 CSV 및 오픈 API 형식으로 제공되며, 다운로드 및 활용에 별도의 이용허락 없이 자유로운 사용이 가능하다. 해당 설문조사 결과는 지역 안전 정책 설계, 스쿨존 개선, 통학환경 관리, 어린이 보행 안전 대책 마련 등 공공 안전 및 교육 정책 기초 자료로 활용될 수 있다. 데이터 제공기관은 제주특별자치도이며, 디지털혁신과가 관리 부서로 명시되어 있다.
