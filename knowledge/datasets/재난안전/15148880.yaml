description_portal: '해당 데이터는 강서구 공동주택 소방시설 목록입니다.ㅇ 완공 시기별, 규모별 대상마다 소방시설 매우 상이하므로 참고만 하시기 바랍니다.ㅇ 소방시설의 종류1. 소화설비: 소화기구, 자동소화장치, 옥내소화전설비, 스프링클러설비, 물분무등소화설비, 옥외소화전설비2. 경보설비: 단독경보형 감지기, 비상경보설비, 자동화재탐지설비, 비상방송설비, 자동화재속보설비, 누전경보기, 가스누설경보기, 통합감시시설, 시각경보기 등3. 피난구조설비: 피난기구(피난사다리, 구조대, 완강기, 미끄럼대 등), 인명구조기구(방열복, 방화복, 공기호흡기 등), 유도등, 비상조명등, 휴대용비상조명등 등4. 소화용수설비: 상수도소화용수설비, 소화수조·저수조, 그 밖의 소화용수설비5. 소화활동설비: 제연설비, 연결송수관설비, 연결살수설비, 비상콘센트설비, 무선통신보조설비, 연소방지설비ㅇ 대상물 상세구분(뒤로 갈수록 소방시설 약화) ***일반적으로 설명1. 공동주택, 스프링클러, 물분무등소화설비 설치대상: 특수한 대상물 제외하고 소방설비가 다 있을가능성이 높음2. 간이스프링클러 설치대상: 스프링클러 설비보다는 적은 소방설비가 있을 가능성이 높음3. 옥내소화전 설치대상: 스프링클러 제외하고 다 있을 가능성이 높음4. 자동화재탐지설비 설치대상: 아래 일반대상물에 화재를 자동으로 감지할수있는 연동 감지기가 들어간 대상5. 일반대상물: 기초소방시설(소화기, 단독경보형감지기), 비상경보설비 두가지만 있을 가능성이 높음ㅇ 시스템 구조상 대상별 자세한 소방시설 표출은 어려움'
