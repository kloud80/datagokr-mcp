summary_user: 경기도남부경찰청 관할에서 2020~2025년 접수된 112신고 건수를 연도별로 집계한 파일로, 연도별 총계와 긴급(CODE 0·1), 비긴급(CODE 2·3), 비출동(CODE 4) 유형별 건수를 담는다(csv 474바이트 규모의 소량 집계표). 지역 치안 담당자나 분석가가 '경기남부에서 긴급신고 비중이 해마다 어떻게 변했나' 같은 신고 유형별 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 같은 기관(경기도남부경찰청) 이름으로만 맞춰 붙이며, 다른 시도경찰청의 112신고 현황과 연도 기준으로 나란히 비교하는 방식이 현실적이다.
description_portal: 경기도남부경찰청   관할 지역에서 2020년부터 2025년까지 접수된 112신고 건수를 유형별로 집계한 공공데이터입니다. 신고 유형은 긴급신고(CODE 0,1), 비긴급신고(CODE 2,3), 비출동신고(CODE 4)로 세분화되어 있으며, 각 연도별 총 신고 건수 및 유형별 분포가 포함되어 있습니다. 본 자료는 지역 내 치안 수요 파악과 경찰력 배치의 효율화, 긴급 대응 체계 개선 등에 활용될 수 있으며, 특히 신고 유형별 변동 추이를 분석함으로써 사회적 이슈나 사건 유형 변화에도 대응할 수 있는 기초 자료를 제공합니다. 시민의 신고 패턴을 분석해 사회적 불안 요소를 조기에 감지하고, 치안 정책과 예방 캠페인 수립 시 근거 자료로 삼을 수 있습니다. 다양한 분야에서 실효성 있는 정책 도출을 위한 참고 자료로 유용합니다.
