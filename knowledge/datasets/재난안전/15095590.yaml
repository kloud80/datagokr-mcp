summary_user: 울산 울주군 안에 있는 국보·보물·사적·유형문화재 등 주요 문화재의 위치를 방사능 방재 목적으로 정리해 건별로 조회하는 API로, 범위는 울주군 한 시군구이고 필지·건물 단위 위치를 담는다. 방재 담당자나 분석가가 원전 사고 때 방사선비상계획구역(PAZ·UPZ) 안에 어떤 문화재가 있는지 확인하고 보호 인력 배치나 차단막 설치 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 방재 데이터(대피시설·재해위험지구 등)와는 문화재 이름 매칭이나 같은 기관 코드로만 연결된다.
description_portal: 울산광역시 울주군에서 제공하는 방사능 방재정보 문화재 조회 서비스는 방사능 비상 상황 발생 시 국가적 자산인 문화유산의 피해를 최소화하고 안전하게 보호 및 관리하기 위한 위치 정보를 제공하는 데이터입니다.울주군 내에 위치한 국보, 보물, 사적, 유형문화재 등 주요 문화재의 정확한 지리적 위치를 담고 있습니다.방사능 오염 시 세척(제염)이 어렵거나 손상 위험이 큰 문화재를 사전에 파악하여 전담 보호 인력을 배치하거나 차단막 설치 등의 계획을 세우는 기준이 됩니다.원전 사고 지점으로부터의 거리(PAZ, UPZ) 내에 어떤 소중한 문화유산이 포함되어 있는지 시각적으로 보여줍니다.
