summary_user: 강릉시 공간정보시스템에 등록된 도로시설물(신호등·교통표지판·가로등·과속방지턱·횡단보도·교량·터널·어린이보호구역 등)을 관리번호 단위의 건별 원장으로 담으며, 시설 종류·규격·설치일자·설치위치·도로명·읍면동·경위도 좌표를 포함한다. 강릉시 특정 읍면동이나 도로 노선에 어떤 도로안전시설이 언제 설치됐는지 확인하려는 시민·교통안전 분석가가 쓴다. 다른 데이터와 공유하는 전역 조인 키는 없어서, 행정·법정읍면동 이름이나 도로명을 매핑하거나 경위도 좌표로 위치를 겹쳐 연결한다.
