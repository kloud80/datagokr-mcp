description_portal: '동부소방서 교육시설 검사대상 현황에 대한 데이터로 동구 관내 교육시설별 소방검사대상 및 종합정밀점검대상을 설명하는 자료입니다.교육시설은 학생, 교직원 등 다수가 일정 시간 동안 머무르는 공간입니다. 초·중·고등학교, 대학교, 학원, 유치원, 어린이집 등이 대표적입니다. 이런 시설은 화재나 안전사고가 발생하면 대피가 어렵고, 특히 어린이나 청소년은 위기 대응 능력이 부족해 인명 피해로 이어질 수 있습니다. 그래서 소방서는 교육시설을 정기 검사대상으로 지정해 안전을 철저히 관리하고 있습니다.광주 동부소방서 관할 동구 지역은 교육 인프라가 밀집한 곳입니다. 초등학교와 중·고등학교는 물론, 대학 캠퍼스, 학원가, 어린이집 등이 곳곳에 자리잡고 있습니다. 이들 시설은 모두 「소방시설 설치 및 관리에 관한 법률」 등에 따라 소방특별조사 또는 정기점검 대상에 포함됩니다.동부소방서는 교육시설 검사에서 소방시설 정상 작동 여부, 피난 시설 관리 상태: 비상구 폐쇄 여부, 피난 통로 적치물 여부, 피난유도등 작동 여부 확인, 전기·가스 안전: 노후 전기배선, 과부하, 가스 누출 위험 점검, 안전교육 실시 여부: 교직원과 학생 대상 화재 대피 훈련 및 심폐소생술(CPR) 교육 여부 확인, 방화구획 관리: 건물 내부 방화문이 제대로 닫히는지, 불연재 사용 여부 확인 등을 집중적으로 확인합니다.이 데이터는 동부소방서 관내 검사대상 교육시설 현황, 교육시설명, 종합정밀점검 등의 수량에 대한 정보를 제공합니다.'
