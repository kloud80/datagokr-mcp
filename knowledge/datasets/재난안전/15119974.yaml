summary_user: 서울 성동구 안의 민방위 비상급수시설을 시설(관리번호) 단위로 담은 인허가 원장으로, 인허가·취소·폐업일자, 영업상태, 지번·도로명 주소, 좌표(XCRD·YCRD), 시설 구분과 시설명·건물명을 포함한다. 주민이나 재난 대비 담당자가 '우리 동네에서 단수 때 물을 받을 수 있는 비상급수시설이 어디에 있고 지금도 운영 중인가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 주소·시설명 매핑이나 같은 기관 코드(개방자치단체코드)로만 다른 대피·구호시설 데이터와 이어 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 민방위사태 등 비상상황 발생 시, 일반적인 급수가 불가능할 때 주민들에게 비상급수를 제공할 수 있도록 설치된 각종 비상급수시설의 정보를 체계적으로 제공하기 위해 구축되었습니다. 재난·재해, 전쟁 등 예기치 못한 상황에서의 안전한 급수체계 마련은 시민의 건강과 안전을 지키기 위한 필수적인 국가안보 및 민방위 대책의 일환입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등의 항목이 포함되어, 각 비상급수시설의 설치, 허가·폐지 이력, 현재 운영 현황 등 행정적 관리 상태를 명확하게 파악할 수 있습니다. 성동구청 등 관할 행정기관은 정기적으로 현장 점검과 자료 갱신을 통해 데이터의 신뢰성과 최신성을 보장합니다. 본 데이터는 민방위 비상대책·훈련, 재난 대비 계획 수립, 시설 현황 관리, 정책 결정, 지역 안전 향상 등 다양한 분야에서 효과적으로 활용될 수 있습니다. 데이터는 지속적으로 최신 내용을 반영하여 갱신됩니다.
