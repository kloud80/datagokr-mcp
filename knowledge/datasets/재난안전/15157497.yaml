summary_user: 한국가스안전공사가 수행한 안전관리 분야 연구과제 목록을 과제 한 건당 한 행으로 담은 파일(csv, 약 10KB)로, 과제명·수행부서·과제구분(자체·정부수탁·민간수탁)·분야·연구 시작일과 종료일로 구성된다. 산학연 연구자나 정책 담당자가 '가스안전 분야에서 최근 어떤 연구가 정부수탁으로 진행됐고 협업할 만한 주제는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 과제명·분야 이름을 맞추거나 같은 기관(한국가스안전공사) 단위로만 연결한다.
description_portal: '한국가스안전공사에서 수행하고 있는 각종 안전관리 분야 연구과제 목록을 공공-민간에 공개하여 산/학/연과의 협업과제 발굴 유도하기 위해 제공하는 데이터입니다.해당 데이터는  과제명, 수행부서, 과제구분(자체, 정부수탁, 민간수탁), 분야, 연구시작일, 연구종료일로 구성되어 있습니다.안전관리 분야의 발전에 따른 가스안전관리 기술의 발전 및 연구 현황을 조회하여 정책 수립 및 통계 수집, 협업 과제 발굴 등에 활용할 수 있습니다.※ 연간 주기로 현황 정보가 업데이트되며 외부(민간) 및 타 유관기관에서 제공하는 데이터와 일부 상이할 수 있으니 참고 바랍니다.- 데이터기준일 : 2025년 12월 31일'
