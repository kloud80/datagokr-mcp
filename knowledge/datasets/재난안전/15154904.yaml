description_portal: 이 데이터는 한국승강기안전공단에서 발급한 승강기 안전인증서의 단순 변경 이력을 기록한 자료입니다. 각 행은 하나의 인증 신청 건에 대해 변경된 정보를 보여주며, 주요 필드로는 ‘인증 신청 순번’, ‘안전인증번호’, ‘변경전 값’, ‘변경후 값’이 포함되어 있습니다. ‘인증 신청 순번’은 변경된 인증서를 식별할 수 있는 고유한 신청 번호이며, ‘안전인증번호’는 실제 발급된 인증서의 고유 번호입니다. ‘변경전 값’과 ‘변경후 값’은 인증서 내 변경된 항목의 이전 값과 수정된 값을 각각 나타냅니다.이 데이터는 인증서 발급 이후 이력 관리, 인증서 내용의 투명한 추적, 변경 이력 검토 등 행정적·관리적 목적에 활용됩니다. 또한 인증신청 기업에서 본인 기업의 인증서 내용 변경 이력을 확인하는데 이용할 수 있습니다.
