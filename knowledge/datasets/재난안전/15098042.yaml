summary_user: 2021~2025년 연도별로 전국 17개 시도(서울~제주) 연안사고 건수를 시도 이름을 열로 펼쳐 담은 집계 파일로, 원본 CSV가 336바이트에 불과한 작은 표다. 해양안전 분석가나 지자체 담당자가 '최근 5년 동안 연안사고가 가장 많이 늘어난 시도는 어디인가'처럼 시도별 추세를 비교하는 데 쓴다. 전역 조인 키가 없어 행정구역 코드 없이 시도 이름으로 맞춰 다른 시도 단위 통계(인구·해안선·관광객 수 등)와 붙여 쓴다.
description_portal: 최근 5년간(2021년~2025년) 시도별 연안사고 현황에 관한 데이터로서, 연도,서울,부산,대구,인천,광주,대전,울산,경기,강원,충북,충남,전북,전남,경북,경남,제주 등의 항목을 제공합니다.연안에서 발생한 안전사고는 주로 해수욕장, 해안가, 해양 등에서의 물놀이 중 익수하거나 표류, 항포구, 방파제(테트라포드), 갯바위 등에서 낚시 중 실족 또는 음주로 인한 실족 또는 차량 조작 미숙 등의 원인으로 추락, 갯벌에서 해루질, 관광 중 물때 미인지로 인한 고립 등의 사고가 대부분 입니다.사고의 원인으로는 구명조끼 미착용, 음주 상태로 활동하는 등 활동객 부주의에 기인하여 사고가 발생하고 있습니다.
