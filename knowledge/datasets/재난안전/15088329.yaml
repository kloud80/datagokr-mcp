summary_user: 수상레저 활동 중 발생한 피해 사고 건수를 연도별로 모터보트·고무보트·수상오토바이·요트·워터슬레드·기타 기구로 나눠 집계한 전국 단위 현황 파일이다(270바이트 CSV, 위치 정보 없음). 수상레저 안전정책 담당자나 분석가가 "어떤 기구에서 사고가 늘고 있어 안전관리를 먼저 강화해야 하나"를 연도별 추세로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도(년도)나 기구명을 맞춰 붙이는 방식으로만 연결된다.
description_portal: 본 자료는 수상레저 활동 중 발생한 피해 사고를 기구별로 구분하여 집계한 현황 자료입니다. 2015년부터 2025년까지 최근 11년간의 연도별 추세를 포함하고 있으며, 각 연도별로 어떤 기구에서 사고가 발생했는지를 비교·분석할 수 있도록 구성되어 있습니다. 사고 기구는 모터보트, 고무보트, 수상오토바이, 요트, 워터슬레드, 기타 등으로 세분화되어 있어 기구별 특성과 위험요인을 명확히 파악할 수 있습니다. 이를 통해 특정 기구에서 반복적으로 발생하는 사고 유형이나 증가 추세를 확인할 수 있으며, 안전관리 강화가 필요한 기구를 우선적으로 선정하는 데 기초자료로 활용할 수 있습니다. 또한 향후 수상레저 안전정책 수립, 장비별 안전기준 마련, 이용자 안전교육 등 실효성 있는 대책 수립을 위한 근거 자료로 중요한 의미를 가집니다.
