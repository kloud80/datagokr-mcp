description_portal: 예금보험공사는 예금자보호를 위하여 설립된 공공기관으로서, 공사 사옥(서울 중구 청계천로30) 및 관리 파산재단 등에 위급시 임직원 및 주민들의 안전을 보장하기 위하여 심장 제세동기를 보유하고 있습니다. 동 데이터는 공사에서 보유하고 있는 심장제세동기에 대한 데이터로 심장제세동기가 비치된 장소에 대한 주소, 비치수량, 비치위치, 사용가능한시간, 제조사, GPS좌표(위도, 경도 등)를 제공하고자 합니다. 이를 통하여 인근 주민 및 데이터 이용자들에게 안전관리에 이바지하고자 합니다. 동 데이터는 심장 제세동기에 대한 계약 내용이 변동되는 경우가 있을 수 있어, 매년 관리하는 제세동기 수가 일부 상이할 수 있다는 점 유의부탁드립니다.
