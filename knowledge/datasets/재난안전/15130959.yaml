description_portal: '대구광역시 북구 홈페이지 시스템에 등록된 재난대피소의 대피소명, 도로명주소, 위도, 경도, 유형을 제공합니다.지진발생초기 운동장, 공터 등 구조물 파손 및 낙하물로 부터 안전한 옥외대피소 및 실내구호소의 위치정보입니다.옥외대피소 및 실내구호소의 역할- 즉각적인 안전 확보: 건물 붕괴나 낙하물 위험을 피하기 위해 넓고 탁 트인 공간으로 대피합니다.- 여진 대비: 실내보다 여진에 덜 위험하므로 1차 대피 장소로 적합합니다.- 지자체 지정 장소: 공원, 운동장, 학교 운동장 등은 지자체에서 지정한 공식 대피소로 운영됩니다.- 질서 있는 대피 유도: 안내 방송이나 공공기관의 지시에 따라 질서 있게 대피할 수 있도록 구성되어 있습니다.- 장기적인 보호 및 지원: 지진 피해로 인해 집에 머물 수 없는 사람들을 위한 임시 거주 공간입니다.- 의료 및 생필품 제공: 응급처치, 식수, 식량, 담요 등 기본적인 생존 물품을 제공합니다.- 심리적 안정: 불안한 상황에서 심리적 안정을 도모할 수 있는 공간으로 활용됩니다.- 정보 전달 및 구조 지원: 피해 상황에 대한 정보 공유, 구조 요청, 가족과의 연락 등 다양한 지원이 이루어집니다.'
