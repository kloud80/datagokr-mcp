summary_user: 전국의 비상급수시설을 시설 한 곳 단위로 담은 원장으로, 시설관리번호·시도·시군구·읍면동명·도로명 주소·지하 여부와 좌표(XCRD·YCRD, GEOM)가 함께 들어 있다. 주민이나 지자체 재난 담당자가 단수·지진 같은 재난 때 우리 동네에서 가장 가까운 비상급수시설이 어디인지 찾는 데 쓴다. 전역 조인 키는 없어서 시군구 코드(STDG_SGG_CD)·시군구명 같은 이름·코드 매핑이나 좌표로 민방위 대피시설, 지진·해일 대피장소, 무더위·한파쉼터 같은 다른 대피·구호시설 데이터와 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 비상 급수시설 정보로, 시설관리번호, 다발지명, 사물주소일, 시군명, 시군구명, 읍면동명, 도로명, 지하여부, X좌표, Y좌표, 공간정보 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기  바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
