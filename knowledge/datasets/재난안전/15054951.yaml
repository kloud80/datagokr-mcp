summary_user: 광주 서부소방서 관내 구급활동을 항목(구분)별로 2019년부터 2024년까지 연도 열로 정리한 집계표로, 파일 크기가 190바이트인 작은 CSV입니다. 분석가나 지역 주민이 '서부소방서 관내 구급 출동·이송이 최근 몇 년간 늘었는가'처럼 연도별 추이를 볼 때 쓴다. 전역 조인 키가 없어서, 다른 소방서의 구급활동 현황과는 구분 항목 이름과 연도를 기준으로 맞춰 붙인다.
