description_portal: 구급활동현황 공공데이터는 119구급대가 수행한 다양한 출동 및 응급처치 활동에 관한 정보에 대하여 체계적으로 수집·관리하여 공개하는 자료입니다. 2024년 12월 31일 기준 광주광역시 서부소방서 공공데이터에는 출동 건수, 환자 유형(심정지, 외상, 질병 등), 응급처치 내용, 이송 병원, 지역별·시간대별 발생 현황 등이 포함됩니다. 이러한 공공데이터 정보는 구급 서비스의 이용 실태를 파악할 수 있고, 응급환자 발생 패턴을 분석하며, 지역 간 구급 수요 불균형을 개선하는 데 적극 활용됩니다.
