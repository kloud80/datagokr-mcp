description_portal: '광주광역시 남구 연도별 안전지수(2020년 ~ 2025년까지의 교통사고, 화재, 범죄, 생활안전, 자살, 감염별 등급) 정보를 제공합니다. ※ 지역안전지수는 「재난 및 안전관리 기본법」 제66조의10(안전지수의 공표)에 따라 매년 지역안전지수 안전등급을 공표하고 있는 제도로, 자치단체의 안전관리 책임성을 강화하고 취약분야에 대한 자율적 개선을 통하여 주민은 더 안전해지고, 안전사고 및 안전사고 사망자는 체계적으로 감축될 수 있도록 유도하고 있습니다. 안전등급은 1등급일수록 동일 단위 행정구역 내에서 상대적으로 안전함을 나타냅니다. 문의 : 행정안전부 예방안전제도과(☎044-205-4523) 및 국립재난안전연구원 안전연구실(☎052-928-8131)'
