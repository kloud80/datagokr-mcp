summary_user: 진주소방서 관할 구역에 등록된 소방시설 설계·감리 관련 업체를 업체 1곳당 1행으로 담은 작은 파일(csv 597바이트)로, 상호·주소·업종·분야와 시도·시군구를 담는다. 진주 일대에서 건축 행위 때 소방시설 설계나 감리를 맡길 업체를 찾는 건축주·사업자가 전문·일반 구분과 분야별로 어떤 업체가 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 시군구 이름이나 업체 주소·상호를 기준으로 다른 소방·건축 데이터와 맞춰 쓴다.
limits: 공통 조인 키가 없어 다른 데이터와는 상호·주소·시군구 이름 매칭으로만 연결된다. 진주소방서 관할 업체만 담고 있어 경상남도 전체나 다른 지역 현황은 이 파일로 알 수 없다. 제목은 감리업체 현황이지만 포털 설명은 설계업 등록현황이라고 적고 있어, 담긴 업종을 업종·분야 열로 직접 확인해야 한다.
