description_portal: 이 데이터는 일회성으로 제공하는 데이터로 2016년 기준 경찰청에서 집계한 스마트국민제보 시스템을 통한 시도청별 제보·신고 건수 현황을 제공하는 공공데이터입니다. 전국 17개 시도경찰청별로 수집된 제보 건수를 포함하며, 모바일 앱 등을 통해 국민이 직접 제보한 생활치안, 불법행위, 교통위반 등의 신고 현황을 확인할 수 있습니다. 이 데이터는 시민 참여 기반 치안활동 분석, 지역별 신고 활성도 비교, 스마트치안 서비스 개선, 공공기관의 제보 시스템 고도화 전략 수립 등에 활용될 수 있습니다.
