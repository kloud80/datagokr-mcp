description_portal: 경찰청 수사국 사이버범죄수사과에서 제공하는 사이버 금융범죄 현황 통계입니다.주어진 표는 경찰청 사이버범죄수사과에서 제공하는 2018년부터 2024년 4월까지의 사이버 금융범죄 현황 통계입니다. 이 자료는 피싱, 파밍, 메모리 해킹, 메신저 이용 사기, 사이버 금융범죄 등 여러 유형의 발생 및 검거 건수를 연도별로 보여줍니다.2024년부터 통계 분류 체계가 변경되면서, 기존의 피싱형 범죄는 "사용자의 처분행위 없이 결제가 이루어지는" 범죄로 정의되어 "정보탈취 연계형 범죄" 중분류 아래로 재편되었습니다. 이러한 통계 세부 유형 변경으로 인해 2024년 4월 이후부터는 더 이상 동일한 방식으로 통계가 제공되지 않습니다. 표는 각 범죄 유형별 발생 건수와 검거 건수를 보여주며, 이를 통해 연도별 범죄 추이와 검거율을 파악할 수 있습니다.
