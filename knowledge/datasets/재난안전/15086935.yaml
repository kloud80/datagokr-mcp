description_portal: 즉결심판 및 통고처분 적발 건수 현황은 전라남도경찰청 관할 22개 경찰서에서 처리된  경범죄 처벌법 및 즉결심판에 관한 절차법에 근거하여 수집된 공공데이터입니다. 이 데이터는 연간 단위로 업데이트되며, 2025년 각 경찰서별로 즉결심판 청구 및 통고처분의 건수를 포함하고 있습니다. 이를 통해 지역별 경범죄 발생 및 처리 현황을 파악할 수 있으며, 치안 정책 수립 및 사회 질서 유지에 활용될 수 있습니다. 또한, 연구기관이나 민간에서도 사회적 동향 분석 및 정책 수립을 위한 기초자료로 활용할 수 있습니다.
