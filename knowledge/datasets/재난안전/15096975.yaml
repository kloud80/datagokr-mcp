summary_user: 제주특별자치도의 구조·구급 활동 실적을 기준 연도와 구분별 이송인원(명)으로 정리한 시도 단위 집계 자료이며, 건별 출동 기록은 아니다. 분석가나 정책 담당자가 제주에서 해마다 구조·구급으로 이송된 인원이 어떻게 변해 왔는지 확인할 때 쓴다. 전역 조인 키가 없으므로 기준 연도와 시도 이름을 맞춰 다른 연도별 소방·응급의료 통계와 나란히 놓고 본다.
description_portal: 이 데이터는 제주특별자치도 내에서 발생한 구조 및 구급 출동과 이송 활동 실적을 정리한 공공데이터로, 출동 건수, 이송 인원 수, 구조/구급 구분 및 이송 결과 등에 관한 정보가 포함되어 있다. 이를 통해 지역의 응급출동 빈도, 구조·구급 대응 실태, 재난 또는 사고 발생 패턴, 구급 자원 배치 효율 등을 종합적으로 분석할 수 있다. 특히 응급의료 체계의 현황 진단, 인력 및 장비 배치 계획, 지역 안전망 확보, 사고 예방 및 대응 정책 수립 등에 유용한 기초 자료로 활용되며, 통계자료 분석, 정책 자료 작성, 혹은 시민 안전 제고를 위한 의사결정 기반으로 활용 가능하다. 데이터는 CSV 형식으로 공개되어 누구나 다운로드 및 분석할 수 있다.
