description_portal: '국토안전관리원에서 제공하는 공공기관 안전관리등급제 안전수준 건설현장 분야(구조물 등의 안전관리) 심사 결과에 관한 CSV형식 파일데이터 입니다.공공기관 안전관리등급제에서 건설현장 분야의 안전수준은 공공기관이 발주한 건설공사 현장의 안전관리 능력을 종합적으로 평가한 결과입니다. 이 평가는 공공기관의 **종합 안전관리등급(1~5등급)**과 별도로 위험요소별(작업장, 건설현장, 시설물, 연구시설) 안전등급으로 분류되어 결정됩니다. 평가 항목 및 기준건설현장 분야의 안전수준은 주로 다음의 심사 지표를 바탕으로 평가됩니다: 건설발주현장의 안전보건관리 업무 체계: 안전보건관리 조직 구성, 안전보건 예산 편성 및 집행, 안전관리 규정 및 지침 수립 여부 등을 포함합니다.건설공사의 착공 전 안전보건활동: 설계 단계에서의 위험성 평가, 안전관리계획 수립 및 적정성 검토, 안전 교육 실시 여부 등을 평가합니다.건설공사의 착공 후 안전보건활동: 정기/수시 안전점검 이행, 위험 작업 및 상황 관리, 안전사고 예방 활동, 법적 안전점검 이행 여부 등을 중점적으로 확인합니다.건설발주현장의 안전보건 여건: 현장 안전관리자 선임 및 배치, 안전시설 설치 및 관리 상태 등을 포함합니다'
