description_portal: 해당 데이터는 경기도북부경찰청 관내에서 발생한 사이버 범죄 현황에 대한 통계 제공을 목적으로 작성된 자료입니다. 사이버 범죄는 해킹, 서비스거부공격, 악성프로그램, 기타 정보통신망 침해형 범죄, 인터넷사기, 사이버금융범죄, 개인위치정보 침해, 사이버저작권침해, 기타 정보통신망 이용형 범죄, 사이버 성폭력, 사이버 도박, 사이버 명예훼손 및 모욕, 기타 불법 콘텐츠로 구분되어 있습니다. 2017년부터 2024년까지의 현황을 발생건수, 검거건수, 검거인원으로 구분하여 제공하고 있어, 연도별 사이버 범죄 발생건수 및 검거 현황을 파악할 수 있습니다. 이 자료는 사이버 범죄와 관련된 경찰 활동을 보여주며, 해당 현황은 경기북부경찰청 사이버수사과에서 제공합니다.
