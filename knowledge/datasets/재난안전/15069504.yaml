summary_user: 전국의 화재 발생 총 건수와 그중 전기적 요인으로 분류된 건수를 연도(2015~2024년 포털 설명 기준)와 월(1~12월) 단위로 집계한 표로, 건별 원천이 아닌 월별 집계 파일(csv, 약 2.7KB)입니다. 전기화재가 어느 달·어느 해에 많은지, 전체 화재 중 전기적 요인 비중이 늘고 있는지를 확인하려는 안전관리 담당자나 분석가가 쓴다. 지역 코드나 전역 조인 키가 없어 다른 화재 통계와는 연도·월 기준으로만 맞춰 붙여 쓴다.
description_portal: 한국전기안전공사는 감전재해 감축을 위해 올바른 정책 방향의 기초 데이터를 제시하고 감전 재해의 발생추이를 분석하여 예방 대책을 도출하기 위해 매년 전기재해 통계분석집을 발간하고 있습니다.관련 근거로는 통계법 제18조와 동법 시행령 제24조, 전기안전관리법 제41조(전기재해 통계의 작성)가 해당됩니다.이 데이터는 연도별(2015년 ~ 2024년)로 발생 한 화재의 총 건수를 월별(1월 ~ 12월)로 제공하고 있으며, 그 중 화재의 원인이 전기적 요인의 건수를 확인 할 수 있는 데이터입니다.
