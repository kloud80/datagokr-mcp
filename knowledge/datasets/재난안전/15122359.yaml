summary_user: 전라남도 지역에 등록된 소방시설 방염업체를 업체 한 곳당 한 행으로 담은 파일로, 세부지역·상호·주소·업종·분야·소방시설업 등록번호·등록일자·폐업여부를 포함하며 약 5KB 규모의 CSV입니다. 건물 관리자나 사업자가 '우리 시군에서 영업 중인(폐업하지 않은) 방염업체가 어디인가'를 확인하거나, 분석가가 지역별 방염업체 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 세부지역 이름을 행정구역 명칭으로 매핑해 잇거나, 같은 기관의 소방 관련 데이터(소방서·특정소방대상물 등)와 지역명 기준으로 나란히 보는 방식으로 쓴다.
