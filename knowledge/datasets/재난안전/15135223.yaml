description_portal: 이송기관등급 데이터는 구조구급시스템에서 수집된 자료로, 환자를 이송하는 기관의 등급 평가 결과와 등급 기준 정보를 포함합니다. 등급은 시설 수준, 의료진 구성, 병상 수, 응급대응체계 등을 종합적으로 고려하여 분류되며, 이송 전략 수립과 병원 선정 시 중요한 판단 기준이 됩니다. 일부 기관만 수록된 자료로 전수 분석에는 원본 확인이 필요합니다.* 본 자료는 구조구급시스템에서 추출한 자료로 일부 대상물에 대한 관한 정보만 포함되어 있음* 일부 데이터에 오류가 있을 수 있으며, 참고용으로만 활용 가능* 원본 데이터양이 많아 샘플로 업로드 함, 세부 데이터나 오류 없는 정밀 데이터를 확인 하기 위해서는 관련 부서로 문의 필요
