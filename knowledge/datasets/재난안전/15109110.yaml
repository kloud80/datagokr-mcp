summary_user: 경상남도 급경사지를 한 곳씩 개별 행으로 담아 지구명·시군명·관리주체, 구조·유형·종류, 위험 등급과 재해위험지역 지정 여부, 길이·높이·경사, 주소와 경위도 좌표를 제공한다. 시군 방재 담당자나 주민이 '우리 시군에서 위험 등급이 높고 지정된 급경사지는 어디이며 관리주체는 누구인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명 같은 이름으로 행정구역 자료와 맞추거나, 좌표(lng·lat)로 재해위험지구·토지 규제 레이어 등 공간 자료와 겹쳐 본다.
description_portal: 경상남도 급경사지의 정보(지구명, 시군명, 관리주체, 구조, 등급, 유형, 종류, 길이, 높이 경사, 지정여부)등을 제공하는 서비스
