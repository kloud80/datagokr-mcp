description_portal: 본 자료는 한국승강기안전공단에서 운영하는 승강기 안전교육 과정별 결과 처리 현황을 집계한 통계 데이터입니다. 승강기 관리 및 검사, 자체점검, 기술인력 양성 등 다양한 교육과정에 대한 운영 결과를 체계적으로 제공하여 교육의 성과와 운영 실태를 객관적으로 파악할 수 있도록 구성되었습니다. 데이터에는 과정연도, 과정명, 가수금 내역 건수, 수강신청 추가 필드 건수, 수강포털용 추가 필드 건수, 과정집계현황 건수, 시행평가 응시자 건수, 시행평가 제출답안 건수, 안전교육 신청 내역 건수 등이 포함되어 있습니다. 이를 통해 과정별 신청 현황과 평가 응시 및 답안 제출 규모를 확인할 수 있으며, 온라인과 오프라인, 신규와 보수 교육 등 다양한 형태의 교육 실적도 비교·분석할 수 있습니다.
