description_portal: 서울특별시 용산구 민방위대피시설 64개소에 관한 인허가 정보에 대해 인허가 일자, 영업상태, 폐업일자, 전화번호, 주소, 사업장명에 대한 정보를 제공합니다. 용산구 민방위 대피시설에는 용산도서관, 브라운스톤남산아파트, 후암동주민센터, 헤심원 등 총 64개소가 있고, 최근 민방위대피소 내 비상시 언제든지 모든 시민들이 사용할 수 있도록 비상용품함을 추가 구비하였습니다. 비상용품함 내 비치되어 있는 물품에는 램프형 랜턴, 라디오, 응급처치세트(대형), 은박형 담요(대형), 알루미늄 부목, 삼각건, 의료테이프, 비상급수팩이 있습니다.
