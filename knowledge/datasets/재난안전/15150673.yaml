summary_user: 재난 시 이재민을 수용하는 공간시설을 시설 한 곳 단위로 담는다. 시설명, 수용 가능 인원(DSSTR_ACTC_PSBLTY_TNOP), 면적, 주소·좌표, 관리 담당자 연락처, 지하 여부, 출입문 개방 시간 같은 항목이 있고 범위는 전국이다. 지자체 재난 담당자나 주민이 '우리 동네에서 이재민을 몇 명까지 받을 수 있는 시설이 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 그래서 다른 대피·구호시설 데이터와는 지역·법정동 코드나 주소, 시설명을 맞춰 보는 방식으로만 잇는다.
description_portal: -행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 재난안전분야 공공데이터를 제공하고 있습니다.- 이에 따라 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 행정안전부에서 제공하는 수용공간시설 정보입니다."
