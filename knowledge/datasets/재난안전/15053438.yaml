description_portal: 국토안전관리원에서 제공하는 데이터이며 절토사면시설물, 시도별, 종별 통계현황의 CSV형식 파일데이터입니다. 25년 12월 31일 기준입니다.지역별 절토사면시설물 통계현황을 알려드립니다.절토사면시설물은 흙을 깎아 만든 사면의 안정성을 확보하고 붕괴를 방지하기 위해 설치하는 다양한 구조물입니다. 여기에는 흙이 무너지는 것을 막는 옹벽, 낙석 방지망, 배수시설 등이 포함되며, 특히 높이나 길이가 일정 기준을 초과하는 경우 시설물안전법에 따라 안전 점검이 의무화되는 주요 시설물에 해당합니다.
