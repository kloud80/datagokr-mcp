description_portal: 이 데이터는 승강기 사고·고장 발생 시 한국승강기안전공단이 초동조사를 위해 발송한 문자(알림) 내역을 기록한 관리 목록입니다. 각 행은 특정 등록일자에 사고 알림과 고장 알림을 발송했는지 여부를 Y/N로 표시하며, 발송 채널은 문자메시지(SMS/MMS) 기준입니다. “사고문자발송여부”는 인명 피해 우려 등 사고 접수 건에 대한 조사 개시 알림의 발송 여부를, “고장문자발송여부”는 갇힘·정지 등 고장 접수 건에 대한 초기 확인·출동 안내 발송 여부를 의미합니다. 동일 일자에 여러 건이 존재할 수 있으며, 시스템 재처리나 중복 접수에 따라 같은 값이 반복될 수 있습니다. 개인·시설 식별 정보는 포함되지 않으며, 발송 대상, 내용, 사건 식별번호 등 세부 메타데이터는 별도 시스템에서 관리됩니다. 본 목록은 초동조사 알림의 실행 이력을 확인하고 운영 현황을 점검하기 위한 기초 지표로 제공되는 예시이며, 제시된 표본은 전체 분포를 대표하지 않습니다.
