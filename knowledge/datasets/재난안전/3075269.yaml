summary_user: 부산광역시 서구의 민방위 비상급수시설을 시설 한 곳당 한 행으로 담은 파일(약 3.8KB CSV)로, 시설명·관리주체·도로명/지번 주소·위도·경도·규모(톤)·수질등급·개방여부·심도·관리기관 연락처를 포함한다. 서구 주민이나 재난 대응 담당자가 '단수나 재난 때 우리 동네에서 식수를 받을 수 있는 가장 가까운 급수시설은 어디이고, 일반에 개방되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 시설명으로 맞춰 쓰며, 같은 세부 부문의 민방위 대피시설·지진/해일 대피장소 등과 지도 위에서 겹쳐 보는 방식으로 연결한다.
limits: 부산 서구 한 시군구만 다루므로 다른 구·시의 급수시설은 별도 데이터를 찾아야 한다. 실측 컬럼에 표준 코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소 매핑이나 좌표 근접으로만 연결된다.
