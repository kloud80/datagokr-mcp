summary_user: 경기도 3D 스마트화재감시시스템이 수집한 재난 발생 정보를 건별로 담으며, 신고유형·재난종별·발생일시 같은 이력 항목과 온도·연기농도·가스누출 여부 같은 센서 값, 시도·시군구·동·리·지번 위치 정보로 구성된다. 소방·재난관리 담당자나 분석가가 '어느 지역에서 어떤 종류의 재난 신고가 언제 났고, 당시 센서 수치는 어땠는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 소방·재난 데이터와는 시도·시군구·법정동 코드(sido_cd 등)나 지명 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기도의 3D 스마트화재감시시스템에서 수집한 재난 발생 관련 정보를 시스템 간 연계를 위해 XML 형식으로 구조화한 뒤, CSV 형식으로 변환하여 제공하는 자료입니다. 신고유형, 재난종별코드, 발생일시 등 재난 이력 중심의 메타데이터가 주된 구성입니다. 온도, 연기농도, 가스누출 등의 센서 항목도 일부 존재합니다. 주요 행정기관 간 위치 기반 재난 이력 공유, 재난관리시스템 연계, 공공안전 기록 통합 등에 활용할 수 있는 메타정보입니다. 또한 주소구분값, 시도코드, 시군구코드, 동·리·지번 정보 등 위치 식별 정보는 위치 기반 재난 관리체계 구축에 참고할 수 있습니다.
