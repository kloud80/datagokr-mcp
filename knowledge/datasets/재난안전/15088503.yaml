summary_user: 인천광역시 미추홀구 관내 지진옥외대피소를 대피소 한 곳당 한 행으로 담은 파일로, 대피소 이름·도로명주소·위도·경도가 들어 있다(csv 약 4.7KB 규모). 주민이나 재난 담당자가 '지진이 나면 우리 집 근처 어느 학교 운동장이나 공원으로 대피하나'를 확인하거나 지도에 대피소 위치를 표시하는 데 쓴다. 전역 조인 키나 코드는 없어서 다른 데이터와는 도로명주소나 위도·경도 좌표로 공간 매칭하거나 이름으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 관내의 지진옥외대피소 현황을 정리한 자료입니다. 주민들이 지진 발생 시 안전하게 대피할 수 있도록 확보된 공공시설의 정보를 제공하며, 주요 대피소는 학교 운동장, 근린공원 등 개방된 공간으로 구성되어 있습니다. 데이터에는 각 대피소의 명칭, 도로명주소, 위도·경도 좌표 등의 항목이 포함되어 있어 실제 재난 발생 시 신속하고 정확한 위치 파악에 활용될 수 있습니다. 이를 통해 지역 내 주민 안전을 강화하고, 지진 등 대규모 재난에 대비한 효율적인 대응 체계를 마련하는 데 기초자료로 활용됩니다. 해당 자료는 주민 보호와 재난관리 정책 수립을 지원하기 위해 정기적으로 갱신되며, 공공 안전망 구축을 위한 핵심 데이터로 제공됩니다.
