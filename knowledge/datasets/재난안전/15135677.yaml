description_portal: 이 데이터는 광주광역시 서구 관내의 연도별 화재발생 건수 및 화재로 인한 재산 피해액(천원 단위)을 집계한 공공데이터입니다. 화재 건수는 소방서 등 관계기관의 공식 통계를 기반으로 하며, 피해액은 사고 당시 현장 조사 및 피해 산정 기준에 따라 집계됩니다. 해당 자료는 지역별 화재 위험도 분석, 계절별 화재 패턴 예측, 소방 인력 및 장비 배치계획 수립, 화재 예방 정책 수립, 보험 위험평가, 생활 안전지표 작성 등 다양한 공공 및 민간 분야에서 활용할 수 있습니다. 데이터는 CSV 형식으로 제공되며, 연 1회 이상 정기적으로 갱신됩니다. 각 행은 특정 연도 기준의 화재 발생 수와 피해액 정보를 포함하고 있습니다.
