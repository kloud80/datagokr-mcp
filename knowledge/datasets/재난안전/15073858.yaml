summary_user: 서울특별시에서 2017~2019년에 발생한 119 구급차 출동 건수와 이송 건수를 연도·시군구·읍면동 단위로 집계한 파일 데이터다(약 74KB CSV). 소방·보건 분석가나 자치구 담당자가 '서울에서 구급 출동이 가장 잦은 동은 어디이고 출동 대비 이송 비율은 어떤가'를 비교하는 데 쓴다. 행정동 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 시군구·동 이름(발생시, 발생동)을 맞춰 연결해야 한다.
limits: 건별 출동 원천이 아니라 지역 단위 집계이므로 개별 사고의 시각·원인·환자 정보는 없다. 행정코드가 없어 다른 데이터와 붙이려면 동 이름 매핑이 필요하며, 범위 표기가 '전국'으로 되어 있더라도 포털 설명상 실제 내용은 서울특별시 2017~2019년분이다.
