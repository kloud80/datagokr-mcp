description_portal: 본 자료는 2012년 이전까지 한국승강기안전공단이 관리하던 사고 승강기 현황을 사고 건 단위로 정리한 데이터입니다. 각 레코드는 개별 사고를 식별하는 사고일련번호, 사고의 분류값을 나타내는 사고원인, 그리고 시스템에 기록된 입력일자로 구성됩니다. 사고원인 항목은 예시처럼 제조불량·작업자과실·이용자과실 등으로 표기되어 원인 성격을 간결히 구분하며, 입력일자는 행정 시스템에 등록된 기준일을 의미합니다. 표기 예시에는 2001년부터 2011년 사이의 기록이 확인되며, 동일 연도 내에서도 다양한 원인 유형이 함께 존재합니다. 사고일련번호는 데이터 내 고유 식별키로서 중복 없이 사고 건을 구분하고, 원인 분류는 당시 관리 체계의 분류 규칙을 따릅니다. 본 자료는 특정 기간 이전의 사고 관리 이력을 구조적으로 제시하여, 연도별·원인별 분포와 등록 시점의 흐름을 일관된 형식으로 확인할 수 있도록 구성되어 있습니다.
