summary_user: 공공기관 안전관리등급제의 안전수준 심사 중 시설물 분야에 대해 기관별 평가결과(평가결과1~8 항목)를 담은 집계 파일로, 전국 단위·비공간 자료이며 파일 크기는 약 1.1KB로 소수 기관만 수록된다. 분석가나 공공기관 안전 담당자가 '어느 공공기관이 시설물 안전관리 심사에서 어떤 결과를 받았는가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 시설 안전 데이터와는 기관명(기관명) 이름 매칭으로만 이어 쓴다.
limits: 개별 시설물 번호나 승강기 고유번호 단위의 원장이 아니라 기관 단위 심사 결과이므로 시설물별 안전등급·점검 이력을 알 수 없다. 평가결과1~8 컬럼의 뜻이 명세에 없어 각 항목 의미는 심사편람 등으로 따로 확인해야 하며, 다른 데이터와는 기관명 문자열로만 연결된다.
