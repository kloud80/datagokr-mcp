description_portal: '국토안전관리원에서 제공하는 공공기관 안전관리등급제 안전수준 시설물 분야 심사 결과에 관한 CSV형식 파일데이터 입니다.공공기관 안전관리등급제에서 안전수준(350점 만점) 시설물 분야 심사는 해당 기관이 보유하거나 관리하는 시설물에 대한 안전 관리 활동의 실질적인 수준을 평가합니다. 이 심사는 「시설물의 안전 및 유지관리에 관한 특별법」 등 관련 법령에 따른 시설물을 대상으로 하며, 국토안전관리원이 심사 보조기관으로 참여합니다. 심사 주요 항목 및 내용시설물 분야의 안전수준 심사는 주로 다음 항목들을 포함하며, 세부적인 지표는 매년 발표되는 "공공기관 안전관리등급 심사편람"에 상세히 기술되어 있습니다. 시설물 안전관리 계획 및 이행: 시설물의 안전 및 유지관리를 위한 계획 수립 및 실행 수준을 평가합니다.정기 및 정밀 안전점검/진단: 법령에 따라 요구되는 안전점검 및 정밀안전진단의 적정 실시 여부와 그 결과에 따른 조치 사항을 심사합니다.위험성 평가 실시 체계: 시설물과 관련된 위험 요소를 식별하고 평가하는 절차를 수립하고 적절하게 이행하는지를 확인합니다.노후 시설물 관리: 노후화된 시설물에 대한 특별 관리 대책 및 개선 노력 등을 평가합니다.안전 관련 법규 준수: 「지속 가능한 기반시설 관리 기본법」, 「재난 및 안전관리 기본법」 등 관련 법규의 준수 여부를 확인합니다.안전 투자 및 성과: 시설물 안전 확보를 위한 투자 수준 및 실제 안전 성과(사고 예방 노력 등)를 종합적으로 고려합니다'
