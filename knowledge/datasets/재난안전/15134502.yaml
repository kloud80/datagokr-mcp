description_portal: '경상북도 청도군 내에서 각종 재난 상황 발생 시 주민들이 안전하게 대피할 수 있도록 지정된 재난대피소에 대한 정보를 제공합니다.이 자료는 청도군 전역에 설치된 자연재해, 사회재난, 화재 등 다양한 위기 상황 발생 시 주민들의 신속하고 체계적인 대피를 지원하기 위한 공공시설 정보로 구성되어 있습니다.공개되는 항목에는 재난대피소의 종류(예: 지정대피소, 임시대피소 등), 시설 구분(학교, 마을회관, 체육관 등), 시설명, 소재지 주소, 상세 위치(건물 내 위치 또는 접근 방법 등), 수용 가능 인원 등의 정보가 포함되어 있습니다.이 데이터는 재난 발생 시 대피 계획 수립, 주민 대피 안내 체계 정비, 안전 취약지역 식별 등 다양한 행정 목적에 활용되며, 특히 읍·면 단위 재난안전대책본부 운영, 재난훈련 시나리오 작성, 대피시설 확충계획 수립 등에 있어 핵심 기초자료로 기능합니다.'
