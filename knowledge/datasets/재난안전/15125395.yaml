description_portal: '- 전라남도 소방본부의 긴급구조표준시스템에서의 기상청 정보입니다. 기상청 지점, 특보(기간 : 2023년 1월~11월), 발효시각 등에 대해 조회하실 수 있습니다.- 전라남도 긴급구조표준시스템(119 시스템)은 소방본부 및 소방서에서 화재와 구조, 응급출동 등 재난 상황을 접수·지휘·공조·모니터링하는 정보화 기반 표준 시스템입니다.- 표준화 119 시스템: 2005년 소방방재청 이후 전국 17개 시·도에서 표준적으로 운용 중인 시스템- 기능: 신고 접수, 위치 파악, 출동 지령, 현장 대응, 관계 기관(경찰·해경·소방)과 실시간 협력 기능 포함- ICT 기반 재난 대응 강화: 디지털 통신망 전환, 모바일 기반 현장지원, 실시간 상황 공유로 대응 속도와 정확성 향상'
