summary_user: 경기도 지진조기경보 시스템이 발령한 경보 한 건(컨트롤일련번호)이 통보처마다 전송·배포·수신되었는지와 등록·수신 일자, 확인시간을 기록한 건별 원천 데이터이며, 범위는 시도 단위의 비공간 자료다. 재난안전 담당자나 분석가가 "지진경보가 각 통보처에 누락이나 지연 없이 도달했는가, 수신 확인까지 얼마나 걸렸는가"를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 통보처 이름·코드 매핑이나 같은 기관(경기도) 코드로만 이어 쓰며, 재난 특보·대피시설 같은 재난안전 데이터와 맥락을 맞춰 본다.
description_portal: 「지진조기경보시스템 통보결과 상태」 데이터는 지진 발생 시 발령된 조기경보가 실제 수신처까지 전달되었는지를 기록한 자료입니다. 주요 항목으로는 컨트롤일련번호, 통보처ID, 전송여부, 배포여부, 수신여부, 등록일자, 수정일자, 수신일자, 확인시간이 있으며, 각 단계별로 경보 메시지가 어떤 경로를 통해 이동했는지와 최종 수신 여부를 확인할 수 있습니다.이 데이터는 지진경보 전송 과정에서 발생할 수 있는 누락, 지연, 장애 여부를 점검하는 데 유용합니다. 또한 여러 통보처의 수신 여부를 집계함으로써 지진경보 전달 현황을 확인할 수 있습니다.
