summary_user: "제주특별자치도에서 발생한 교통사고를 기준 연도와 도로 선형(대·중·소분류, 예: 직선·곡선·오르막/내리막)별로 묶어 사고 건수·사망자 수·부상자 수를 담은 집계 통계이며, 포털 설명상 2018~2020년 자료다. 도로 관리 담당자나 분석가가 '제주에서 곡선·경사 구간이 직선 구간보다 사고나 사망이 더 많은가'를 따져 개선 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 경찰·도로 교통사고 통계나 교통사고다발지역 표준데이터와는 연도와 도로선형 분류명을 맞춰 이어 쓴다."
description_portal: '제주특별자치도 도로 선형별 교통사고 현황 데이터는 2018년부터 2020년까지 도내에서 발생한 교통사고를 도로의 선형 유형별(예: 직선, 곡선, 오르막/내리막 등)으로 구분하여 사고 건수, 사망자 수, 부상자 수를 집계한 공공 통계자료이다. 제공기관은 제주특별자치도이며, 자료는 CSV 형식으로 배포된다. 이 데이터는 도로 구조와 지형 특성이 교통사고 발생에 어떤 영향을 미치는지 분석할 수 있게 해 주며, 도로 설계 및 유지보수, 안전 취약 구간 파악, 사고 예방 대책 수립, 정책 입안 등에 활용 가능한 실무 중심의 기초자료로 가치가 높다. 또한 도내 도로 교통 안전 수준을 점검하고, 향후 도로 개선 우선순위 설정이나 교통안전 캠페인 설계 시 참고 자료로 활용하기 적합하다.'
