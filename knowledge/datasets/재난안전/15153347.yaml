summary_user: 행정안전부 재난안전데이터 공유플랫폼이 제공하는 전국 비상급수시설의 선형(라인) 공간 정보로, 시설관리번호·선/점 공간 일련번호·시설물 종류와 구성요소 코드·변경일자·도형(GEOM)을 담는 시설 원장형 데이터입니다. 지자체 재난 담당자나 분석가가 재난 시 비상급수시설의 배관·관로 같은 선형 구성이 어디에 어떻게 놓여 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 비상급수시설 데이터와는 시설관리번호(FCLT_MNG_NO)나 코드 매핑으로만 연결하고 행정구역 코드로 다른 데이터와 바로 붙이지는 못한다.
