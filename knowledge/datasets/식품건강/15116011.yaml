summary_user: 서울특별시 중구에서 완제품 식품을 소량으로 나누어 포장하는 식품소분업 업소를 업소별로 담은 인허가 원장으로, 업소명·영업상태·인허가일자·폐업일자·소재지 주소·좌표(중부원점TM)·종사자 수 등을 담는다. 중구에서 현재 영업 중인 식품소분업체가 어디에 몇 곳 있는지, 언제 인허가를 받거나 폐업했는지 확인하려는 사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 부문의 다른 업종 인허가·위생 지정·행정처분 데이터와 나란히 보는 데 쓴다.
description_portal: '서울특별시 중구의 완제품 형태의 식품을 별도로 소분하여 포장하는 업소 정보입니다. 해당 데이터에는 업소명, 영업상태, 인허가일자, 업태구분명, 소재지 주소, 좌표정보, 종사자 수  등의 항목이 포함되어 있습니다. 식품소분업은 대량 제조된 식품을 소량 단위로 나누어 포장·판매하는 영업으로, 원재료나 성분을 변경하지 않는 것이 특징입니다. 영업자는 식품위생법에 따라 시설기준을 충족해야 하며, 작업장은 위생적으로 설계되고 세척·소독이 가능한 설비를 갖추어야 합니다. 또한 소분 식품에는 유통기한을 표시하고 적합한 재질의 포장재를 사용해야 합니다. 본 데이터는 정기적으로 갱신되어 최신 정보를 반영하며, 시민과 관계 기관이 위생 관리, 안전 점검, 정책 수립 등에 활용할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
