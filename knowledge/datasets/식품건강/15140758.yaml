summary_user: 광진구 내 방역·소독업체의 인허가 원장을 업소 한 곳당 한 행으로 담으며, 인허가·취소일자, 영업상태, 폐업·휴업 기간, 소재지 지번·도로명 주소, 중부원점TM 좌표, 사무실 면적과 분무기·방독면·보호복 등 소독장비 보유 수량이 들어 있다. 구민이나 시설 관리자가 '광진구에서 지금 영업 중인 소독업체는 어디이고 장비는 어느 정도 갖췄나'를 확인할 때, 분석가가 소독업 등록·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)·관리번호로만 이어 쓰며, 좌표는 지도 데이터와 겹쳐 보려면 좌표 변환이 필요하다.
description_portal: 서울특별시 광진구_소독업 인허가 정보는 광진구 내에서 전염병 확산 방지, 세균 및 바이러스 살균, 해충 방제 등 공중보건 향상을 위해 방역 및 소독 서비스를 제공하는 업소의 인허가 관련 정보를 제공합니다. 주요 항목에는 업소명, 대표자명, 인허가일자, 영업상태, 업종구분, 소재지 주소, 관리기관명 등이 포함되며, 감염병 예방을 위한 전문적인 소독 작업을 수행하는 업체를 식별할 수 있습니다. 해당 업소들은 가정, 학교, 병원, 공공시설 등 다양한 공간에서 위생적 환경 유지를 목적으로 활동합니다. 위치정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공되며, 위경도 형식은 제공되지 않습니다. 본 데이터는 최근 3일 내 갱신된 자료로, 지역 방역 대응 체계 강화, 소독업 등록 현황 파악, 위생정책 수립 등에 활용 가능합니다.
