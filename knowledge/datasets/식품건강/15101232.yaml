summary_user: 경상북도 청도군 관내에서 영업 중인 식품제조가공업체를 업소 한 곳당 한 행으로 담은 파일로, 업소명·업종·업태·전화번호·도로명/지번 주소·영업장 면적을 포함하며 범위는 청도군 한 개 시군구다. 청도군에서 식품 공장 창업이나 납품처를 찾는 사업자가 '관내 어느 지역에 어떤 업태의 제조가공업체가 얼마나 큰 면적으로 있나'를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가 업소 데이터와는 업소명·주소 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 경상북도 청도군 관내에서 영업 중인 식품제조가공업체에 대한 현황 정보를 포함하고 있다. 식품위생법에 따라 등록된 사업체를 대상으로 하며, 각 업체의 연번, 업소명, 업종, 업태, 소재지, 전화번호, 도로명주소, 지번주소, 영업장 면적 등의 항목으로 구성되어 있다. 본 자료는 식품위생 관리, 산업 분석, 창업 지원, 지역경제 연구 등에 활용될 수 있으며, 관내 식품산업의 분포와 특성을 파악하는 데에도 유용하다. 행정기관은 해당 정보를 기반으로 위생 점검 및 지도·감독 업무를 수행할 수 있으며, 민간에서는 상권 분석이나 시장 조사 등의 목적으로 활용 가능하다. 또한 데이터는 산업동향 분석 및 식품안전 정책 수립을 위한 기초자료로도 제공될 수 있다.
