summary_user: 서울 종로구 가축사육업 인허가 업소를 건별로 담은 원장으로, 관리번호·인허가일자·취소일자·영업상태(영업/폐업 등)·휴업기간·소재지 주소·사업장명·좌표(X, Y)를 포함한다. 주민이나 분석가가 '종로구에 현재 영업 중인 가축사육업체가 있는지, 언제 인허가·폐업했는지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 본 데이터는 서울특별시 종로구 내 가축사육업체의 인허가 현황을 제공하는 자료입니다. 가축사육업은 「가축분뇨의 관리 및 이용에 관한 법률」과 관련 규정에 따라 사업자 등록과 영업 허가를 받아야 하며, 가축의 사육 및 관리, 사료 공급, 위생 점검 등 지역 내 축산업 관리에 중요한 역할을 담당합니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등 기본 행정 정보가 포함되어 있어 종로구 내 가축사육업체의 등록 현황과 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 주민과 관련 업계는 합법적인 사육업체 정보를 확인할 수 있으며, 행정기관은 영업허가 관리, 위생 점검, 지역농업 정책 수립, 산업 안전 관리 등에 활용할 수 있습니다. 또한 연구자와 민간 기관은 가축사육 분포와 산업 동향을 분석하는 기초자료로 활용할 수 있으며, 지역 축산업 발전과 공중위생 개선에 기여할 수 있습니다.
