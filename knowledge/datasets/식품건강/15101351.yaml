summary_user: 경상북도 구미시 안의 식품제조가공업 인허가 업소를 업소 한 곳씩 적은 건별 원장으로, 399행에 1971-04-05부터 2022-05-28까지의 인허가 기록과 주소·좌표, 영업상태, 종업원 수를 담는다. 구미시 식품제조업체가 어디에 있고 지금 영업 중인지 폐업했는지 알아보려는 담당자나 분석가, 사업자가 입지와 시장을 살필 때 쓴다. 관리번호(pnu)와 소재지·도로명 주소 필드를 키로 다른 인허가·위생 관련 데이터나 지도 자료와 이어 쓴다.
description_portal: 경상북도 구미시의 식품제조가공업 현황은 지방행정인허가 데이터개방 시스템(www.localdata.go.kr)에서 제공하는 공공데이터를 기반으로 하여, 구미시 행정구역 내에 위치한 관련 업체들을 선별·추출한 자료입니다. 본 데이터는 업소명, 소재지 주소, 업태 및 업종, 인허가 일자, 영업상태(정상영업, 폐업 등), 대표자명, 관리기관 등의 세부 정보를 포함하고 있습니다. 이 자료는 식품위생 관리나 행정 점검 대상 파악뿐만 아니라, 지역 내 식품제조 산업의 현황을 분석하거나 중소기업 지원 정책 수립, 민원 대응, 통계 분석 등의 다양한 행정 목적에 활용될 수 있습니다. 또한 식품산업 관련 연구자나 기업 등 민간에서도 시장 분석, 입지 전략 수립, 사업계획 수립 등 실질적인 활용이 가능하며, 지역 식품 산업의 발전 방향을 모색하는 데에도 기초자료로 유용하게 쓰일 수 있습니다.
