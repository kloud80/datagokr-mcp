summary_user: 부산광역시 동래구 관내에 신고된 공중위생업소(이용업·미용업·숙박업·목욕장업·세탁업·건물위생관리업)를 업소 한 곳씩 업종명·업소명·도로명/지번 주소·우편번호·전화번호로 담은 파일이다. 동래구 주민이나 사업자가 '우리 동네에 미용실·세탁소·목욕탕이 어디에 몇 곳 있나'를 확인하거나, 분석가가 구 안의 업종별 업소 분포를 볼 때 쓴다. 전역 조인 키(업소 고유번호·행정코드)가 없어 다른 데이터와는 주소·업소명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 부산광역시 동래구에 소재한 공중위생업소 현황에 대한 데이터로 업종명, 업소명, 영업소주소(도로명), 우편번호(도로명), 영업소주소(지번), 우편번호(지번), 영업소전화번호 등에 대한 항목을 제공합니다.데이터항목설명1. 업종명(건물위생관리업, 미용업, 이용업, 숙박업, 목욕장업, 세탁업)2. 업소명3. 소재지(도로명)4. 소재지(지번)5. 소재지전화6. 우편번호(도로명)7. 우편번호(지번)본 파일 데이터는 부산광역시 동래구 관내에 신고된 공중위생업소 현황으로, 차후 업소 신고 내용에 따라 데이터 항목 및 내용이 변경되거나 삭제됨에 유의하시길 바랍니다.
