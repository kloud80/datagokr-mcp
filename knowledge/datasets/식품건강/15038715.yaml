summary_user: 인천광역시 중구에 있는 제과점 업소를 한 곳씩 담은 목록으로, 업종명·업소명·도로명 소재지·전화번호·데이터 기준일자를 담는다(포털 설명상 106개 업소, 2025년 6월 13일 기준). 중구에서 제과점 창업 입지를 검토하는 사업자나 동네별 제과점 분포를 보려는 상권 분석가가 '이 지역에 제과점이 어디에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)가 없어 다른 식품 인허가·위생 데이터와는 업소명이나 주소 문자열을 맞춰서만 이어 쓴다.
description_portal: '이 데이터는 인천광역시 중구에 위치한 제과점 현황에 관한 정보입니다. 총 106개의 업소에 대한 정보를 포함하며, 업종명, 업소명, 소재지주소, 소재지전화번호 등의 정보가 수록되어 있습니다.소재지주소는 도로명주소 및 지번 주소로 되어있습니다.전화번호는개인정보 포함 및 미등록 정보로 일부 데이터값을 공란처리하였습니다.이러한 데이터는 상권 분석, 소비자 트렌드 파악, 창업 전략 수립, 지역 경제 연구뿐만 아니라, 식품 위생관리 및 안전정책 수립에도 활용할 수 있습니다. 담당부서: 인천광역시 중구청 위생환경과(1청사 원도심), 친환경위생과(2청사 영종)데이터기준일: 2025년 6월 13일'
