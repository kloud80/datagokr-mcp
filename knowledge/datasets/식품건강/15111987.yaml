summary_user: 건강기능식품 GMP(제조 품질관리기준) 지정 업소를 업소 단위로 담는 API로, 인허가번호·업소명·업종명·소재지·인허가기관·영업상태·비고 필드를 제공하며 전국 482건을 검증 호출로 모두 수신했다. 소비자나 분석가가 특정 건강기능식품 제조업소가 GMP 지정 업소인지, 지금 영업 중인지 확인하는 질문에 쓴다. 인허가번호(LCNS_NO)로 식품 인허가 업소 원장과 이어 쓸 수 있지만, 실측 컬럼에서 전역 조인 키는 찾지 못해 그 밖에는 이름·코드 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 식품의약품안전처에서 관리하는 식품GMP인증업체현황서비스에 대한 인허가번호,업소명,업종,대표자,소재지,인허가기관,영업상태,비고,GMP지정일,GMP지정번호,의무적용일자,지정취소일,지정취소사유,관할기관에 대한 속성정보를 제공합니다.이 자료를 통하여 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 건강기능식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다
