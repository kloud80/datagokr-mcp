description_portal: '본 데이터는 제주특별자치도 제주시 관내에서 발생한 유기동물 구조 현황을 월별로 집계한 자료입니다. 동물보호법에 따라 구조된 유기견·유기묘의 인계 현황 및 TNR(중성화 후 방사) 실적을 포함하고 있으며, 유기동물 보호관리 및 반려동물 정책 수립의 기초자료로 활용됩니다. 구조된 동물의 처리 방식에 따라 보호소 인계, 보호자 인계, 중성화 관리 등으로 구분됩니다.주요 항목해당연월: 유기동물 구조 현황이 집계된 연도 및 월개(보호소인계 / 보호자인계): 구조된 유기견 중 보호소에 인계된 수와 보호자에게 반환된 수고양이(보호소인계 / 보호자인계 / TNR): 구조된 유기묘 중 보호소 인계, 보호자 인계, 중성화(TNR) 후 방사 처리된 수데이터기준일: 데이터가 최종 집계·갱신된 기준 일자활용 목적이 데이터는 유기동물 발생 추세 분석, 보호소 수용능력 예측, TNR 정책 효율성 평가, 지역별 구조·처리 실적 파악 등 다양한 행정 및 연구 목적에 활용됩니다. 또한 유기동물 문제에 대한 지역사회의 인식 개선과 효율적인 반려동물 보호정책 수립에 기초자료로 제공되며, 제주시 축산과에서 정기적으로 수집·갱신하여 최신 정보를 반영하고 있습니다.'
