summary_user: 서울 종로구 안에서 허가받은 위탁급식영업 업체를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(TRDSTATENM)·폐업일자·소재지 주소·좌표·업소명·시설 규모 등을 포함한다. 급식을 맡길 업체를 찾는 학교·기관 담당자나 분석가가 "종로구에서 지금 영업 중인 위탁급식업체는 어디이고 언제 허가받았는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰고, 다른 식품 인허가·위생 지정·행정처분 데이터와는 같은 방식으로 맞춰 본다.
description_portal: 본 데이터는 서울특별시 종로구 내에서 운영되는 위탁급식영업 업체의 인허가 현황을 담고 있습니다. 위탁급식영업은 학교, 기업, 공공기관, 복지시설 등 단체를 대상으로 위탁받아 급식을 제공하는 업종으로, 「식품위생법」 등 관련 법령에 따라 영업허가 절차를 거쳐야 하며 지속적인 위생관리 의무가 부과됩니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등이 포함되어 있어 종로구 내 위탁급식업체의 등록·취소 이력과 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 주민과 이용기관은 합법적으로 허가된 업체를 선택해 안전한 급식 서비스를 보장받을 수 있으며, 행정기관은 급식 위생 안전 관리, 영업장 관리 및 지도점검을 보다 효율적으로 수행할 수 있습니다. 또한 연구자 및 민간 기업은 지역 내 단체급식 운영 현황을 분석하여 식품 안전 정책 수립, 위탁급식 수요 추이 예측 등 공공성과 산업적 활용에 기초자료로 활용할 수 있습니다.
