summary_user: 대구광역시 달서구 안의 식품관련업소(식품제조가공업, 위탁급식영업, 건강기능식품유통전문판매업 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화·행정동명·위도·경도를 담는다. 달서구에서 특정 업종의 식품업소가 어느 동에 얼마나 모여 있는지 알고 싶은 주민·창업자·분석가가 업소 분포와 상권을 살펴보는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없어서 다른 데이터와는 업소명·주소·행정동명을 맞추거나 좌표(위도·경도)로 공간 결합해 이어 쓴다.
description_portal: 대구광역시 달서구 내 식품관련업소에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.데이터기준일자 위도, 경도, 번호, 업종명(식품제조가공업, 건강기능식품유통전문판매업, 위탁급식영업 등), 업소명, 소재지(도로명), 소재지(지번), 소재지전화, 행정동명, 관련부서, 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 지역 내 식품관련업소 현황을 파악하는데 유용하게 참고자료로 쓸수 있으며  행정업무에 활용 가능합니다.
