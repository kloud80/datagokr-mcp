summary_user: 경기도 관내에서 유통되는 식품을 수거해 실시한 안전성 검사를 제품별·검사항목별로 담은 자료로, 집계년도·집계분기·제품명·검사항목(INSPECT_ITEM_MATR) 등으로 구성된다. 소비자나 식품위생 분석가가 '최근 어떤 유통식품이 어떤 항목으로 검사받았는지'를 확인하고 분기·연도별 검사 경향을 보는 데 쓴다. 전역 조인 키가 없으므로 다른 회수·판매중지·부적합 데이터와는 제품명을 이름으로 맞추거나 연도·분기 기준으로 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 관내 유통 중인 식품에 대한 연도별 안전성 검사 현황을 제공하는 자료로, 각 제품에 대해 실시된 검사항목과 수거검사의뢰일 등을 포함합니다. 총 8개 항목으로 구성되어 있으며, 집계년도, 집계분기, 제품명, 검사항목 등의 정보가 제공됩니다. 식품의 안전성을 확보하고 소비자 보호를 위한 정책 수립, 유통식품의 위생관리 현황 분석, 위험 식품 사전 식별 등에 활용될 수 있으며, 데이터는 식품안전과에서 연간 단위로 갱신됩니다. 해당 자료는 상업적 이용은 가능하지만 콘텐츠 변경은 불가하며, Open API를 통해 시스템 연계가 가능합니다.
