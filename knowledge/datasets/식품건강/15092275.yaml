summary_user: 생산이 중단된 식품 제품을 건별로 담으며, 품목제조보고번호·품목보고일자·제품명·품목유형·인허가번호·업소명·생산중단일자·생산중단사유를 전국 범위로 제공한다. 소비자나 유통업자가 특정 제품이 언제 왜 생산 중단됐는지 확인하거나, 분석가가 품목유형별 생산중단 사유를 살펴보는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으나, 품목제조보고번호(PRDLST_REPORT_NO)로 같은 식품 제품 DB의 품목·바코드·영양성분 데이터와 제품 단위로 잇고, 인허가번호(LCNS_NO)나 업소명으로 식품 인허가 업소·회수/행정처분 데이터와 맞춰 볼 수 있다.
description_portal: 생산중단 된 제품의 정보로, 품목제조보고번호 , 품목보고일자 , 제품명 , 생산중단일자 , 품목유형명 , 인허가번호 , 업소명 , 구분 , 생산중단사유 등 의 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
