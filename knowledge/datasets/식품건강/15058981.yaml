summary_user: 농림수산식품교육문화정보원 레시피의 재료를 한 행에 하나씩 담은 데이터로, 레시피 번호(RECIPE_ID)별로 재료 순번·재료명·분량·재료 구분(주재료·부재료 등 유형 코드와 이름)을 담는다. 가정에서 요리하는 사람이나 식단 앱 개발자가 '이 레시피에 어떤 재료가 얼마나 들어가는가', '특정 식재료를 쓰는 레시피는 무엇인가'를 찾는 데 쓴다. 전역 조인 키는 없으며, 같은 기관이 제공하는 레시피 기본정보·과정정보와 레시피 번호로 잇고, 다른 식품 DB와는 재료명을 이름으로 맞춰 연결해야 한다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 레시피 재료정보 API는 우리 농산물을 활용한 다양한 요리 정보를 담고 있는 귀중한 데이터 자원입니다. 본 API는 요리의 기본 정보, 다양성을 고려한 다채로운 레시피, 그리고 주요 재료의 상세한 정보를 포함하고 있습니다. 이를 통해 요리를 시도하는 분들이 체계적으로 필요한 정보를 손쉽게 얻을 수 있도록 지원하므로, 특히 건강한 식단을 구성하거나 가정에서 요리할 때 유용하게 활용될 수 있습니다. 또한, 식재료에 대한 영양성분, 칼로리, 원산지 정보까지 포함되어 있어 요리 계획에 필요한 기초 데이터를 제공합니다. 현재 제공되는 주요 오퍼레이션으로는 '레시피 재료정보 조회'가 있으며, 이 기능을 통해 사용자는 각 요리 레시피에 사용되는 재료의 이름, 분량, 영양성분 등 다양한 정보를 손쉽게 조회할 수 있습니다. 이를 통해 보다 균형 잡힌 식사 계획을 수립할 수 있는 데 기여합니다.
