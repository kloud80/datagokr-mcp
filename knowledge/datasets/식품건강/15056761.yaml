summary_user: 경기도 내 고속도로에 있는 휴게음식점(음주행위가 허용되지 않은 업소)을 인허가 업소 한 곳당 한 행으로 담은 원장 자료로, 시군명·사업장명·인허가일자·폐업일자·영업상태·위생업태·종업원 수·도로명/지번 주소·WGS84 위경도를 포함한다. 고속도로 휴게소 안 음식점이 시군별로 몇 곳 영업 중인지, 언제 문을 열고 닫았는지를 확인하려는 분석가나 사업자가 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명으로 경기도의 다른 시군 단위 자료와 붙이거나, 좌표·주소로 휴게소 위치 자료와 공간 매칭해 쓴다.
description_portal: 이 데이터는 경기도 내 고속도로에 위치한 휴게음식점 현황을 담은 인허가 기반 자료입니다. 음주행위가 허용되지 않은 업소만 포함하며, 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태명, 위생업종 및 위생업태명, 급수시설 구분, 다중이용업소 여부, 등급구분명, 소재지 면적, 총시설 규모, 남녀 종사자 수, 총종업원 수, 영업장 주변 환경, 도로명·지번 주소, 우편번호, WGS84 좌표(위도·경도) 등의 항목으로 구성되어 있습니다. 이 자료는 경기도 31개 시군 전체를 대상으로 하며, 고속도로 휴게소 내 음식점 분포 파악, 지역별 관광 편의시설 분석, 교통 연계형 서비스 연구, 위생 및 안전관리 정책 수립 등에 활용할 수 있습니다. 다만, 인허가 중심 데이터이므로 실제 운영 현황과 차이가 있을 수 있습니다.
