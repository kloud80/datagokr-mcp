summary_user: 서울특별시 광진구에서 인허가를 받은 의료법인·의료기관을 업소(관리번호) 단위로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·소재지(지번·도로명)·업태·의료인 수·병상 수·입원실 수·총면적과 중부원점TM 좌표(X, Y)를 포함한다. 광진구 안에 운영 중인 병원·요양병원이 어디에 몇 곳 있고 병상 규모가 어떤지, 최근 폐업한 곳은 어디인지 확인하려는 주민·보건행정 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 법인명·주소 같은 이름 매핑이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)로만 연결하고, 좌표는 WGS84로 변환해야 지도 데이터와 겹쳐 쓸 수 있다.
description_portal: 이 데이터는 서울특별시 광진구에서 의료법인 설립 인허가를 받은 기관의 현황 정보를 제공합니다. 의료법인은 「의료법」에 따라 병원, 요양병원, 정신병원 등의 의료기관을 설립·운영하기 위해 법적으로 설립된 비영리 단체로, 안정적인 의료서비스 제공과 공공성 강화를 목적으로 합니다. 본 데이터에는 법인명, 소재지, 설립유형, 인허가일자 등 주요 항목이 포함되어 있으며, 지역 보건의료 인프라 파악, 의료서비스 접근성 분석, 공공의료 정책 수립, 병상 수급 계획 마련 등 행정 및 정책적 목적으로 활용될 수 있습니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않으므로 지도 기반 분석 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신되며, 광진구 내 의료기관 설립 및 의료자원 관리의 기초자료로 활용됩니다.
