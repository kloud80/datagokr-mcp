summary_user: 강북구 관내 단란주점(주류와 음식을 팔고 손님이 노래할 수 있는 업소)의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일·영업상태·폐업일·소재지 주소·중부원점TM 좌표·시설 규모 등을 포함한다. 강북구에서 영업 중이거나 폐업한 단란주점이 어디에 몇 곳 있는지 확인하려는 주민·창업자, 또는 유흥·주점 상권을 분석하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 자치구 인허가 데이터나 식품 인허가 업소 데이터와는 관리번호(MGTNO)·주소·업소명 매핑이나 같은 기관 코드로만 연결한다.
