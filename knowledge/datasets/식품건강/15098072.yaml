summary_user: 전북특별자치도 무주군에 있는 식품제조가공업소를 업소 한 곳당 한 행으로 담은 인허가 원장 파일로, 인허가번호·인허가일자·업소명·도로명 소재지·영업 시작일·업태명을 포함한다. 무주군에서 어떤 식품제조가공업체가 언제부터 영업하는지 확인하려는 사업자나, 지역 식품산업 현황을 파악하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소를 맞추거나 같은 기관의 다른 식품 인허가 파일과 인허가번호로 대조하는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 무주군에 존재하는 식품제조가공업소 시설 현황을 매년 갱신하여 파일데이터로 제공하고 있습니다.인허가번호, 인허가일자, 업소명, 도로명주소, 영업시작일, 업태명(식품제조가공업, 기타 식품제조가공업 등), 데이터기준일자  등으로 파일 데이터컬럼이 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다.해당 데이터는 전북특별자치도 무주군 산업건설국 안전재난과 위생관리팀에서 관리하고 있으며 자세한 내용은 063-320-2265(안전재난과)로 연락주시면 됩니다.
