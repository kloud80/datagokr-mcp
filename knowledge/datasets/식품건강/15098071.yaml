summary_user: 익산시 관내 식품제조가공업체를 업체 한 곳당 한 행으로 정리한 목록 파일로, 업종명·업소명·소재지·전화번호·우편번호를 담는다(CSV 약 29KB). 식품 원료 납품처나 위탁 제조처를 찾는 사업자, 익산 지역 식품제조업 분포를 파악하려는 분석가가 '익산에 어떤 식품제조업체가 어디에 있나'를 확인하는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 다른 식품 인허가 데이터와는 업소명·주소를 맞춰 보거나 같은 기관 자료끼리만 연결한다.
limits: 인허가번호·사업자번호·좌표가 없어 전국 식품 인허가 원장이나 행정처분 이력과 키로 바로 붙일 수 없고, 업소명·주소 문자열 매칭에 의존해야 한다. 범위는 익산시 한 곳의 제조가공업체에 한정된다.
