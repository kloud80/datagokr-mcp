description_portal: '은평구의 집단급식소를 대상으로 식품을 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 집단급식소식품판매업에 대한 전국 인허가 현황을 담고 있으며, 영업장 소재지, 사업장명, 영업자명, 인허가일자, 상태(영업중, 폐업 등) 등의 항목을 포함합니다. 집단급식소식품판매업은 기업체, 학교, 복지시설 등 단체에 식사를 제공하는 급식소에 식재료 및 완제품을 유통하는 영업 형태로, 최근 급증하는 위탁급식, 어린이·노인 복지시설, 산업체 맞춤형 식자재 납품 등의 수요 증가와 함께 중요성이 커지고 있습니다. 특히 고령화로 인한 복지시설 확대, 아동복지 및 교육기관의 식품안전 강화 정책, ESG(환경·사회·지배구조) 경영 확산에 따라 원산지 투명성, 영양 균형, 위생관리 수준이 높아지고 있으며, 이와 함께 관련 인허가 데이터에 대한 수요도 증가하고 있습니다. 본 정보는 민간 식자재 유통사, 사회복지기관, 지자체, 식품안전 관리 부처 등 다양한 주체가 활용할 수 있으며, 지역별 급식소 식자재 유통 현황을 분석하거나 위생 관련 정책 수립, 위탁급식시장 경쟁분석 등에 유용하게 활용될 수 있습니다. 또한 공급망 관리, 식중독 예방, 아동급식 품질 모니터링 등에도 연계 가능성이 높습니다.'
