summary_user: 2016년 이후 축산물 생산실적보고 내역을 업소·품목·보고년도 단위의 건별 행으로 담으며, 품목명·품목유형, 연간생산능력(KG)과 실제 생산량(KG)이 들어 있는 전국 범위 자료이다. 분석가나 사업자가 특정 축산물 품목 유형을 어느 업소가 해마다 얼마나 생산하는지, 생산능력 대비 가동 수준은 어떤지 파악하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았지만, 인허가번호(LCNS_NO)와 품목제조보고번호(PRDLST_REPORT_NO)가 있어 같은 기관의 식품 인허가 업소, 품목제조보고, 회수·행정처분 자료와는 이 번호나 업소명 매핑으로 연결한다.
description_portal: 축산물의 생산실적보고 내역(2016년~)으로  축산물 생산실적에 대한 속성정보를 제공합니다. 속성정보로는 업소명 , 품목명 , 품목구분 , 품목유형 , 인허가번호 , 보고년도 , 품목제조보고번호 , 연간생산능력(KG) , 생산량(KG)이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
