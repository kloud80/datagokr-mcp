summary_user: 식품의약품안전처의 어린이기호식품 품질인증 현황을 인증 제품 한 건씩 담으며, 인증번호·업소명·식품유형·제품명·인증일·만료일 등 전국 범위의 비공간 정보로 구성된다. 학부모나 유통사업자가 특정 어린이 간식이 품질인증을 받았는지, 인증이 언제 만료되는지 확인하는 데 쓴다. 실측상 전역 조인 키는 없으나, 품목제조보고번호(ITEM_RPT_NO)로 식품 품목 DB와 제품 단위로, 인허가번호로 식품 인허가 업소·회수/행정처분 정보와 업소 단위로 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 어린이기호식품품질인증현황 정보입니다.\""
