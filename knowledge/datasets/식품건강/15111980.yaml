summary_user: 수입식품 중 이력추적 대상 제품에 대해 업체코드, 식품이력추적관리번호, 로트 마스터 여부(MST_YN)를 담은 전국 단위 이력 속성 정보이다. 회수·판매중지된 수입식품의 이력추적관리번호로 수입업체를 확인하려는 분석가나 식품안전 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식품 이력추적·수입식품 데이터와는 업체코드나 이력추적관리번호를 같은 기관 코드로 맞춰 이어 써야 한다.
description_portal: 식품의약품안전처에서는 안전한 식품선택을 위한 소비자의 알 권리를 보장하고, 식품의 안전성 확보를 위한 신속한 유통차단과 회수조치를 위해제조·가공단계부터 판매단계까지 각 단계별로 식품 이력추적정보를 기록하고 관리하여 정보를 제공하고 있습니다.해당데이터에서는 식품 이력추적 대상제품 중 수입식품 이력 정보에 대한 업체코드,식품이력추적관리번호 및 PDTLOT 마스터 여부에 대한 속성정보 제공 등 수입식품의 이력추적에 대해 공개된 세부적인 정보를 확인할 수 있습니다.
