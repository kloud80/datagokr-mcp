summary_user: 해외 국가기관이 발표한 위해식품 회수정보를 공지 건별로 담으며, 제목·본문(해당국가, 기관, 정보출처, 국내수입여부 등)·등록일시·첨부 다운로드 주소가 들어 있다. 해외직구나 수입식품을 사려는 소비자, 수입업자가 '이 해외 제품이 외국에서 회수됐고 국내에도 수입됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 수입식품·국내 회수 데이터와는 제품명·업체명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 해외 국가기관에서 발표한 위해식품 회수정보에 대한 속성정보로 제공하고 있으며 본문내용에는 해당국가, 기관, 정보출처, 국내수입여부 등의 정보들이 포함되어 있습니다. '해외 위해식품 회수정보는 식품안전나라>위해·예방>해외직구 정보>위해식품 정보'에서 상시 현행화되고 있습니다. 이 자료를 통하여 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
