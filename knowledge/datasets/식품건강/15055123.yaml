summary_user: 충청남도 예산군에 등록된 세탁업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화번호를 담는다(약 6KB 규모 CSV, 범위는 예산군 한 곳). 주민이 동네 세탁소 위치와 연락처를 찾거나, 분석가가 예산군 안에서 세탁업소가 어느 읍·면에 몰려 있는지 볼 때 쓴다. 전역 조인 키나 코드표가 없어서 다른 데이터와는 주소나 업소명을 직접 맞춰서만 이어 쓴다.
limits: 업소 고유 식별번호나 표준 코드가 없어 다른 공중위생업소·인허가 데이터와 자동으로 연결되지 않고, 주소·이름으로 맞춰야 한다. 범위가 예산군 한 곳이라 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다.
