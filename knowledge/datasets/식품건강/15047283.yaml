summary_user: 서울시농수산식품공사가 공개하는 도매시장법인 거래 농수산물 가격을 품목·등급별로 담은 자료로, 조사일마다 품목명·등급·거래 단위와 수량·최고가·최저가·평균가를 기록한 집계 가격이다. 유통업자나 분석가가 "특정 날짜에 배추 상품 한 망의 도매 평균가가 얼마였고 등급별로 얼마나 차이 났나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 가격·수급 데이터와는 품목명(PUMNAME)·등급명과 조사일을 이름 매핑해 이어 써야 하며, 식품 제품 DB의 품목제조보고번호·바코드와는 연결되지 않는다.
description_portal: 서울시농수산식품공사 (신)유통정보 - 품목별등급별가격(도매시장법인거래) 데이터는 도매시장 법인 간 거래되는 농수산물의 품목별, 등급별 가격 정보를 제공하는 자료입니다. 품목명과 등급, 수량과 단위, 최고가, 최저가, 평균가, 조사일 등의 정보를 포함하고 있어 특정 시점에 도매시장에서 형성된 가격 수준을 세부적으로 파악할 수 있습니다. 이 데이터는 농수산물 유통 과정에서의 가격 변동 추이를 분석하고, 생산자와 유통업자, 소비자가 합리적인 거래와 의사결정을 할 수 있도록 돕는 기초 자료로 활용됩니다. 또한 시기별, 품목별, 등급별 가격 비교를 통해 시장 동향을 진단하고, 물가 관리와 유통 정책 수립, 수급 조절 및 가격 안정 대책 마련 등에 중요한 참고 자료로 활용할 수 있는 유용한 공공데이터입니다.
