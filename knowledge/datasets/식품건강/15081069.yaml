summary_user: 서울 관악구의 카페·커피숍 인허가 이력을 업소 한 곳당 한 행으로 담은 원천 파일로, 사업장명·인허가일자·영업상태·폐업일자·위생업태와 도로명·지번 주소를 포함한다. 창업 준비자나 상권 분석가가 '관악구에서 카페가 언제 많이 생기고 문을 닫았나, 영업 기간은 보통 얼마인가'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·위생 데이터와는 사업장명과 주소를 맞춰 연결해야 한다.
description_portal: 본 데이터는 관악구 카페 및 커피숍 인허가 이력에 관한 현황 데이터입니다.본 데이터는 사업장명, 인허가일자, 영업상태명, 폐업일자, 위생업태명, 도로명주소 및 지번주소 항목을 포함합니다. 2000년대 초·중반 관악구 내 커피숍 업종의 개·폐업 흐름을 확인할 수 있으며, 지역 상권 변화 분석, 창업 수요 조사, 업종별 지속 기간 파악 등에 활용됩니다. 특히 폐업일자와 인허가일자를 함께 제공하여 특정 시기 업종 변동성과 상권 침체·활성 구간을 연구하는 데 유용합니다. 관악구의 초기 카페 시장 형성과 트렌드 변화 파악에도 참고자료로 사용될 수 있습니다.
