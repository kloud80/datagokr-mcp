summary_user: 부산광역시 수영구가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 소재지·전화번호·음식 유형·주된 음식을 싣는다(포털 설명 기준 2025.12.23. 현재 13곳). 수영구 주민이나 방문객이 '수영구에서 구청이 모범음식점으로 지정한 한식당은 어디인가' 같은 외식 선택 질문에 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·도로명 주소를 맞춰 이어 써야 한다.
limits: 실측 컬럼에 업소 인허가번호 등 전역 조인 키가 없어 인허가 원장과 바로 조인할 수 없고, 이름·주소 매칭에 기대야 한다. 범위는 수영구 한 곳의 개별 업소이므로 부산시 전체나 다른 구 현황은 담지 않는다.
