summary_user: 주류제조 면허를 가진 업체 가운데 식품제조·가공영업으로 등록된 업소를 한 곳씩 담은 전국 단위 등록 원장으로, 업소명·대표자명·주소·인허가번호·업종명·허가일자·관할기관명·전화번호를 담는다. 주류 제조업체가 어떤 식품을 함께 제조·가공하도록 등록돼 있는지, 특정 지역에 그런 업체가 어디 있는지 확인하려는 사업자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 매칭, 같은 기관 코드로만 이어 쓴다.
description_portal: 주류제조.면허자 식품제조.가공영업 등록 현황 관련 정보로 주류제조·면허자 식품제조·가공영업으로 등록된 업체에 대한 속성정보를 제공합니다. 속성정보로는 업소명 , 대표자명 , 주소 , 인허가번호 , 업종명 , 허가일자 , 기관명 , 전화번호가 있습니다이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
