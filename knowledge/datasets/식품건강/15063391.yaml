summary_user: 경상남도가 게시한 위해식품 등 긴급회수 공지를 게시글 단위로 담으며, 제목·본문·작성자·연락처·조회수와 첨부파일 주소(최대 4개)를 건별로 준다. 경남 소비자나 유통·판매 사업자가 '최근 경상남도에서 회수 대상으로 공지된 식품이 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 업소 인허가·행정처분 등 다른 식품안전 데이터와는 제품명·업소명 같은 이름 매칭으로만 이어 쓴다.
limits: 업소 코드나 품목 코드 같은 공통 키가 없어 다른 데이터와 정확히 결합하기 어렵다. 공지는 회수 등 사건이 생길 때 게시되고 이후 바뀌지 않는 이벤트성 자료이며, 범위는 경상남도에 한정된다.
