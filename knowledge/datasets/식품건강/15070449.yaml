summary_user: 의료기기 품목 가운데 적용규격 대상인 품목을 일련번호, 품목분류명, 등록일 단위로 담은 전국 단위 목록 파일(CSV, 약 3.4KB)이다. 의료기기 제조·수입 사업자나 인증 담당자가 '우리 제품 품목이 적용규격 대상에 들어 있고 언제 등록됐는가'를 확인하고 시험 범위나 인증 준비를 점검할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 의료기기 품목·허가 데이터와는 품목분류명 이름 매칭이나 같은 기관의 코드 매핑으로만 이어 쓴다.
description_portal: 본 데이터는 각 의료기기 품목에 적용되는 규격 정보를 제공한다. 주요 항목은 품목코드, 품목명, 적용규격명, 등록일자, 그룹번호 등으로 구성된다. 데이터는 품목별 필수 규격의 적용 현황을 파악하여 시험 범위 산정, 인증 준비, 품질 점검에 활용된다. 품목코드와 규격명 간 매핑은 전산 등록과 심사 서류의 일관성 검증에 유용하다. 등록일자는 규격 적용 시점을 확인할 수 있는 기준이 되며, 그룹번호는 규격군 단위 분석을 가능하게 한다. 데이터는 규격 적용 현황의 전수 파악과 보고용 지표 생성에 적합하다. 품목별 규격 매핑은 설계 검토와 시험 범위 산정에 활용되고, 국제 분류 체계와 비교 분석이 가능하다.
