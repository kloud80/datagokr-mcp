summary_user: 서울 종로구 관내 축산가공업체의 인허가 원장을 업소 한 건씩 담으며, 관리번호·인허가일자·취소일자·영업상태(영업/폐업 등)·폐업일자·휴업기간·소재지 주소·좌표(X, Y)·업소명을 포함한다. 종로구에서 현재 영업 중인 햄·소시지·식육가공 업체가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하려는 위생 담당자나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 자치구·업종의 식품 인허가 데이터와 같은 구조로 묶어 볼 때 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내에서 축산물을 가공하여 식용으로 제공하는 축산가공업체의 인허가 정보를 정리한 공공데이터입니다. 주요 항목에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 축산물 위생관리법에 따라 등록된 업체의 설립 및 폐업 이력을 확인할 수 있습니다. 해당 자료는 육류, 햄, 소시지, 식육포장처리 등 축산물 가공 분야의 업소 분포 및 영업 상태를 파악할 수 있으며, 위생안전 강화, 식품안전관리, 식육 유통질서 확립 등의 정책 수립에 활용됩니다. 또한 관내 식품제조 기반 분석, 민원 대응, 지도·점검 대상 선정 등 공공식품위생 행정의 기초자료로 제공됩니다.
