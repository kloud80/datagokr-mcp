summary_user: 제주특별자치도가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일이며, 업소명·구분·행정시·도로명 소재지와 데이터기준일자를 포함한다(CSV 약 33KB). 제주 여행객이나 도민이 "제주시·서귀포시에서 도가 위생과 서비스를 인정한 음식점은 어디인가"를 찾을 때나, 분석가가 행정시별 모범음식점 분포를 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 원장이나 위생등급·안심식당 데이터와는 업소명과 도로명 주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: '제주특별자치도에 등록된 모범음식점 지정 데이터를 제공합니다.항목: 업소명, 소재지, 전화번호 등*식품접객업 영업자 중 집단급식소, 일반음식점 영업자 대상으로 연 1회 선정*평가기준：모범업소의 세부 지정기준(청결·위생·종업원서비스·가격표시 등) 및 좋은 식단 이행 기준에 의한 평가 지정*신청접수: 매년 8~9월 예정자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1468'
