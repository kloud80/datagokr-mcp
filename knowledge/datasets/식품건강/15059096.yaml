summary_user: 경기도 내 탕류를 취급하는 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·소재지면적·종업원 수·다중이용업소 여부와 도로명·지번 주소, 위경도 좌표가 들어 있다. 창업 예정자나 상권 분석가가 "우리 시군에서 영업 중인 탕류 음식점은 어디에 몇 곳이고 최근 폐업은 얼마나 되나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 식품 인허가·위생 데이터나 지도 데이터와 맞춰 붙인다.
description_portal: 이 데이터는 경기도 내에서 탕류 음식을 취급하는 일반음식점에 대한 인허가 및 영업 현황을 담고 있습니다. 음식점의 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지면적, 급수시설구분, 다중이용업소 여부, 위생업종명, 위생업태명, 종업원 수, 위치정보(도로명 주소, 지번 주소, 위도·경도) 등의 항목으로 구성되어 있습니다. 이 데이터는 위생 및 식품안전 관리, 지역별 음식점 분포 분석, 외식 산업 연구, 상권 분석 등에 활용될 수 있습니다. 특히 다중이용업소 여부나 급수시설 구분 등의 항목은 공공안전이나 위생기준 준수 여부 분석에 유용합니다. 데이터는 31개 시군 전체를 포함하고 있으며, Open API를 통해 실시간으로 연계 활용할 수 있도록 제공됩니다.
