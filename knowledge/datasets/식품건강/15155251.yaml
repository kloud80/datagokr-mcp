summary_user: 전국 자치단체의 식품 유통전문판매업 인허가 정보를 업소 한 곳씩 건별로 담은 원천 데이터이며, 전체 63,228건에 인허가일자·영업상태·사업장명·주소·좌표 등을 싣는다. 사업자가 거래할 유통전문판매업소가 영업 중인지, 어느 지역에 있는지 확인하거나 분석가가 업소 분포를 볼 때 쓴다. 지번주소·도로명주소(address)와 관리번호(pnu 키)로 다른 인허가·식품 업소 데이터와 이어 쓰고, 좌표는 Bessel 중부원점TM(EPSG:5174) 기준이다.
description_portal: '식품_유통전문판매업 데이터는 직접 제조하지 않고 식가공류 제공을 위해 판매업소에 유통하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 유통전문판매업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 식품안전정책과 / 043-719-2032 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
