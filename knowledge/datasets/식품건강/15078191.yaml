summary_user: 국내산 쇠고기 한 마리(개체식별번호) 단위로 출생일자·소 종류·성별·농가명, 도축장소·도축일자·위생검사 합격 여부, 가공일자·가공장소, 백신 최종 접종일자·차수 같은 이력 정보를 담으며 범위는 전국이다. 소비자나 유통업자가 구입한 쇠고기의 개체식별번호로 이 소가 어느 농가에서 태어나 어디서 도축·가공됐고 위생검사를 통과했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도축장·가공장 이름이나 농가명 같은 이름 매핑으로만 이어 쓰고, 개체식별번호(ENTTY_IDNTFC_NO)는 이 데이터 안에서 개체를 찾는 키로 쓴다.
description_portal: 쇠고기(국내)이력추적에 대하여 개체식별번호 , 도축장소 , 위생검사 , 도축년월일 , 도축장소주소 , 위생검사합격유무 , 가공일자 , 가공장소명 , 출생일자 , 개체상태명 , 소종류명 , 성별 , 농가명 , 백신최종접종일자 , 백신최종접종차수의 속성정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
