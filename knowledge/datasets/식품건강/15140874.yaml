summary_user: 서울특별시 광진구 관내 유통전문판매업소의 인허가 내역을 업소 한 곳당 한 행으로 담은 건별 원장으로, 업소명·인허가일자·영업상태·폐업일자·도로명/지번 주소·중부원점TM 좌표를 포함한다. 광진구에서 지금 영업 중인 식품 유통전문판매업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 폐업했는지를 확인하려는 위생 점검 담당자나 식품 유통 분석가가 쓴다. 전역 조인 키는 없어 다른 식품 인허가·위생 데이터와는 개방기관 코드(OGDP_INST_CD)·관리번호, 업소명·주소 매칭으로 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 식품을 직접 제조하지 않고, 제조된 식품(식가공품 등)을 전문적으로 유통·판매하는 유통전문판매업소에 대한 인허가 현황을 제공합니다.유통전문판매업은 제조시설 없이 자체 상표로 포장·표시된 식품을 다른 제조업체로부터 구입해 소매점이나 음식점 등에 유통하는 업태로, 식품의 위생적 취급, 보관 환경, 판매 경로의 안전성 확보가 중요한 업종입니다.데이터 항목에는 업소명, 소재지, 인허가일자, 영업상태, 업태명 등이 포함되며, 이를 통해 식품공급망의 유통경로 파악, 위생 점검 대상 관리, 지역 내 식품 유통업체 분포 파악 등에 활용할 수 있습니다.※ 본 데이터는 중부원점TM(EPSG:2097) 좌표계를 기준으로 위치 좌표를 제공하며, 위도·경도는 포함되어 있지 않습니다.※ 데이터는 3일 전 기준으로 최신화된 자료를 반영하고 있으며, 식품위생법 및 관련 규정에 따라 지속적으로 갱신·관리됩니다.
