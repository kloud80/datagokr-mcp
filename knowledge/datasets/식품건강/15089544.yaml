description_portal: '이상사례(Adverse Event/Adverse Experience, AE)란, 의약품등의 투여·사용 중 발생한 바람직하지 않고 의도되지 아니한 징후(sign, 예 ; 실험실적 검사치의 이상), 증상(symptom) 또는 질병을 말하며, 당해 의약품등과 반드시 인과관계를 가져야 하는 것은 아닙니다.(참고)- 부작용(Side Effect) : 정상적인 용량에 따라 약물을 투여할 경우 발생하는 모든 의도되지 않은 효과를 의미- 약물이상반응(Adverse Drug Reaction) : 이상사례중 해당 의약품과의 인과관계를 배제할 수 없는 경우를 의미본 자료는 한국의약품안전관리원에 접수된 의약품등 이상사례 보고 및 의약품안전나라를 통해 보고된 이상사례 보고건들에 대한 통계자료이며,본 자료에 보고된 이상사례는 해당 의약품등과의 인과관계 여부와 관계없이 보고된 것으로서 동 자료만으로는 특정 약물에 의해 이상사례가 발생하였다고 간주될 수 없습니다.* 이상사례는 온라인 보고(의약품안전나라 의약품통합정보시스템) 및 유선(한국의약품안전관리원 대표전화 1644-6223(또는 14-3330))으로 보고하실 수 있습니다.'
