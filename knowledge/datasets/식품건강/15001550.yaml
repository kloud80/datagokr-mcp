summary_user: 서울 광진구 보건소에서 인허가를 받은 집단급식소(학교·병원·복지시설·기업체 등)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·인허가일자·영업상태·폐업일자·지번/도로명 주소·좌표·전화번호·시설규모 등을 포함한다. 구청 위생 담당자나 분석가가 '광진구에서 현재 운영 중인 집단급식소는 어디이고 어느 동에 몰려 있는가'처럼 식중독 예방·위생 점검 대상을 파악하는 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 관리번호(MGTNO)·업소명·주소 같은 이름 기반 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 좌표(X·Y)는 지도 위 공간 결합에 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 내 집단급식소 인허가 현황에 대한 정보를 제공합니다. 광진구 보건소를 통해 인허가를 받은 급식소의 명칭을 통해 시설을 식별할 수 있으며, 소재지 항목은 급식소의 위치 정보를 제공해 행정 구역별 분포를 확인할 수 있습니다. 운영 여부를 통해 현재 해당 급식소가 실제로 운영 중인지 여부를 판단할 수 있고, 연락처는 직접 문의 및 위생 민원, 정보 확인 등에 활용 가능합니다. 또한 1일 급식인원 항목은 해당 시설이 하루에 제공하는 식사의 규모를 나타내며, 급식 대상 인원 규모를 파악하거나 시설의 수용 능력을 분석하는 데 유용합니다. 이 데이터는 학교, 병원, 복지시설, 기업체 등 다양한 유형의 집단급식소를 포함하고 있으며, 지역 내 식품위생 관리, 보건 안전 대책 수립, 식중독 예방 활동 등에 활용될 수 있는 기초 자료입니다.
