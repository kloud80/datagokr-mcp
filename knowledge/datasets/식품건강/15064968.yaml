summary_user: 식품위생 공통교육을 맡는 교육기관의 목록을 기관 한 곳당 한 건으로 담으며, 업소명·우편번호·주소·상세주소·전화번호·허가일자를 제공하고 범위는 전국입니다. 식품 영업 신고·허가를 앞둔 사업자가 "위생교육을 어느 기관에서 받을 수 있고 연락처는 무엇인가"를 확인하거나, 분석가가 교육기관의 지역 분포와 허가 시기를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가·위생 지정 데이터와는 업소명이나 주소 문자열을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 위생공통 교육기관내역 관련 정보로 위생공통교육기관에 대한 속성정보를 제공합니다. 속성정보로는 업소명 , 우편번호 , 주소 , 주소상세 , 전화번호 , 허가일자가 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
