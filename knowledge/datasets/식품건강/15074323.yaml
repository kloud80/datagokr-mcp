summary_user: 농약별·식품별 잔류허용기준(MRL)을 담는 기준 목록으로, 한 건이 농약명·식품명·시행시점·단계·MRL값·폐기여부를 가진 전국 단위 비공간 데이터다. 농산물 수입·유통 사업자나 분석가가 특정 농약이 특정 작물에 얼마까지 허용되는지, 그 기준이 언제 시행됐고 지금도 유효한지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 부적합·회수 정보나 수입식품 검사 결과와는 농약 한글명(AGCHM_KOR_NM)·식품 한글명을 이름으로 맞춰 연결해야 한다.
description_portal: 식품의약품안전처에서 관리하는 농약의 잔류허용기준 정보 자료입니다. 농약명, 식품명, 시행시점, 단계, MRL값, 폐기여부 항목을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
