summary_user: 대구광역시 군위군이 관리하는 유통전문판매업체 목록을 업체 한 곳당 한 행으로 담은 파일(csv, 843바이트)로, 업종명·업체명·대표자명·도로명/지번 주소와 우편번호·전화번호를 담는다. 군위군 안에서 식품 유통전문판매업으로 신고된 업체가 어디에 있고 연락처가 무엇인지 확인하려는 주민·사업자·상권 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·행정처분 데이터와는 업체명·주소를 맞춰 보거나 같은 기관 데이터끼리만 연결한다.
description_portal: 대구광역시 군위군에서 관리하고 있는 유통전문판매업체 현황입니다.(업체명, 대표자명, 우편번호, 주소, 전화번호) 특정 지역 또는 전국 단위에서 제품 유통 및 판매를 주로 수행하는 전문 업체들의 기본 정보를 제공하는 공공 또는 상업용 데이터입니다. 이 데이터는 유통산업 정책 수립, 입지분석, 소비자 접근성 개선, B2B 협력처 발굴 등 다양한 분야에서 활용됩니다. 업체명은 업체 식별의 기본 항목으로 유사 업체명과의 구분에, 우편번호는 행정구역 분류 및 주소 정제에 활용되어 GIS 기반 상권 분석이 가능합니다. 주소는 업체 위치 확인, 지도 서비스 연동이 가능하며, 상권·물류 분석, 거리 기반 마케팅이 가능합니다. 전화번호는 고객상담, 유통 파트너 상담, 업체 조사 등에 활용됩니다.
