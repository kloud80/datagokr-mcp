summary_user: 농림수산식품교육문화정보원이 제공하는 레시피의 조리 과정을 레시피별·단계별 한 행씩 담으며, 단계 번호와 조리 설명, 단계별 팁이 들어 있고 범위는 전국·비공간이다. 요리 앱이나 식단 서비스 개발자가 특정 레시피를 몇 단계로 어떻게 조리하는지 순서대로 보여 줄 때 쓴다. 전역 조인 키는 없고, 레시피 식별자(RECIPE_ID)로 같은 기관의 레시피 기본정보·재료정보와만 이어 쓴다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 당 API는 우리 농산물을 활용하여 풍성하고 맛있는 요리를 만드는 데 필요한 다양한 요리정보를 제공합니다. 이 API는 요리의 기본정보, 다양한 레시피, 주요 재료 정보를 체계적으로 수집하고 제공함으로써 사용자들에게 보다 쉽고 효과적인 요리의 길잡이가 되어줍니다. 또한, 이 API를 통해 요리는 물론 요리 재료의 특성을 배우고, 실생활에서 유용하게 활용할 수 있는 정보를 얻을 수 있습니다. 오퍼레이션 정보로는 요리 레시피의 조리 과정 정보 조회 API가 있으며, 이 API는 단계별 조리 방법, 조리 순서, 그리고 요리할 때 유의해야 할 팁 등을 상세히 제공하여 사용자가 요리를 보다 쉽게 따라 할 수 있도록 도와줍니다.
