summary_user: 경기도 내 유통전문판매업(식품을 직접 제조하지 않고 다른 판매업소에 유통하는 업체) 인허가 업소를 한 행이 한 사업장인 원장 형태로 담으며, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·좌표·종사자 수·건물소유구분·시설규모 등을 포함한다. 식품 유통업에 진입하려는 사업자나 분석가가 "우리 시군에 영업 중인 유통전문판매업체가 몇 곳이고 어디에 몰려 있나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 시군코드(SIGUN_CD)·사업장명·주소 매칭이나 정제 위경도 좌표로 이어 쓰고, 같은 기관의 다른 식품 인허가 업소 데이터와 함께 본다.
description_portal: 이 데이터는 경기도 내 유통전문판매업 인허가 현황을 수록한 자료로, 식가공류를 직접 제조하지 않고 다른 판매업소에 유통을 목적으로 하는 업체 정보를 제공합니다. 시군명, 사업장명, 인허가일자, 영업상태, 주소, 전화번호, 종사자 수, 위생업태명, 건물소유구분, 급수시설, 시설총규모 등 총 42개 항목으로 구성되어 있으며, 유통업체의 입지나 규모, 영업 형태 분석에 활용될 수 있습니다. 식품 유통산업 실태 조사, 유통 안전관리 정책 수립, 지역 유통구조 파악 등에 유용하며, Open API로 연계 가능합니다.
