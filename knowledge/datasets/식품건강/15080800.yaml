summary_user: 식중독 발생 정보를 발생연도·발생월·발생지역(시도 등 지역명) 단위로 묶어 발생건수와 환자수를 담은 집계 목록이며, 범위는 전국입니다. 분석가나 지자체 담당자가 "어느 지역에서 어느 달에 식중독 발생건수와 환자수가 많았는가"를 보고 계절별·지역별 추이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 데이터와는 발생지역 이름과 연·월을 맞춰 매핑해 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 식중독 발생지역별 정보 자료입니다.식중독 발생정보(발생년 , 발생월 , 발생지역 , 발생건수 , 환자수)를 목록으로 제공이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
