summary_user: 경기도 포천시 관내에서 음식점 위생등급제 등으로 지정된 식품안심업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 6KB)로, 업소명·영업장 소재지·지정일자·업종을 담는다. 포천에서 외식할 때 위생 지정을 받은 식당이 어디 있는지 찾는 주민·관광객이나, 시내 지정 업소의 업종·지역 분포를 보는 분석가가 쓴다. 전역 조인 키(인허가번호 등)가 없어 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·소재지 주소를 맞춰 이어 써야 한다.
description_portal: 경기도 포천시에서 제공하는 식품안심업소(음식점 위생등급제) 현황 데이터입니다. 본 데이터는 포천시 관내 식품안심업소의 지정 현황을 제공하는 자료로, 업소명(상호), 영업장 소재지, 지정일자, 업종 항목으로 구성되어 있습니다. 이를 통해 식품안심업소의 분포와 지정 현황을 확인할 수 있으며, 지역별 위생관리 수준 분석, 식품안전 정책 수립, 위생관리 및 지도·점검 계획 수립을 위한 기초자료로 활용할 수 있습니다. 또한 영업장 소재지를 기반으로 행정구역, 관광, 지역상권 등 다양한 공공데이터와 연계·분석이 가능하여 소비자의 안전한 업소 선택을 지원하고, 지역 식품위생 관리에 활용할 수 있는 공공데이터입니다.본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
