description_portal: 「식품위생법」에 따른 부산광역시 수영구 내 신고된 식품접객업소의 공공데이터 입니다. 이번 자료에서는 수영구 관내 일반 및 휴게음식점, 유흥 및 단란주점, 위탁급식업소, 제과점의 위치와 운영 현황을 체계적으로 파악할 수 있도록 도와주며, 업종명, 업소명, 소재지, 소재지 전화번호 등 항목을 해당 데이터 기준일자로 정보를 제공힙니다. 이 자료를 통해 수영구 관내에서 운영하고 있는 식품접객업소들의 업소명과 해당 업소의 소재지 도로명주소 및 지번주소, 소재지 전화번호를 확인할 수 있습니다. 해당 자료는 반기마다 갱신되어 최신 현황을 제공합니다.
