summary_user: 부산광역시 수영구에 신고된 식품접객업소(일반·휴게음식점, 유흥·단란주점, 위탁급식업소, 제과점)를 업소 한 곳당 한 행으로 담은 개별 업소 목록이며, 업종명·업소명·도로명/지번 주소·전화번호를 담는다. 수영구에서 창업하려는 사업자나 상권 분석가가 '광안리 일대에 휴게음식점이나 제과점이 몇 곳 있고 어디에 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에 인허가번호나 좌표 같은 전역 조인 키가 없어서, 다른 데이터와는 업소명·주소 문자열 매칭이나 주소 지오코딩으로만 이을 수 있다.
limits: 인허가번호·사업자번호·좌표가 없어 전국 식품 인허가 원장이나 행정처분 데이터와 정확히 연결하기 어렵고, 주소·업소명 매칭에 의존해야 한다. 범위가 수영구 한 곳이라 다른 구와 비교하려면 구별 파일을 따로 모아야 한다.
