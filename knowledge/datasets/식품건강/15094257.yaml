description_portal: '서울특별시 서초구의 빵, 베이커리와 같은 빵류, 제과류 등을 만들어 판매하는 업소 정보입니다. 데이터는 각 제과점영업 업소에 부여된 고유 식별 번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 제과점영업 창업을 희망하는 예비 사업자에게는 서초구 지역의 시장 분석 및 제조시설 베이커리 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 제빵 생산공정 및 시설기준 관리, 원재료의 안전성, 종사자 위생모 착용 등 위생 관리를 철저히 이행하는 신뢰할 수 있는 직접판매 제과점의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
