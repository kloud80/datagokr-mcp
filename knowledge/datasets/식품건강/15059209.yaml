summary_user: 경기도 시군에 있는 인도·태국 등 외국 음식 전문점의 인허가 현황을 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·위생업종과 업태·시설 규모·종업원 수·정제된 주소와 WGS84 위경도를 포함한다. 창업 준비자나 분석가가 '경기도 어느 시군에 외국 음식점이 몰려 있고, 최근 폐업이 많은 곳은 어디인가'처럼 외국 음식점 분포와 영업 지속 여부를 볼 때 쓴다. 전역 조인 키는 없으므로 시군명·시군코드(SIGUN_CD)로 다른 경기도 시군 데이터와 묶고, 주소나 좌표를 기준으로 식품 인허가 업소 데이터 등과 이름·위치 매칭을 해서 이어 쓴다.
description_portal: 이 데이터는 경기도 31개 시군에 위치한 인도, 태국 등 특정 국가의 전통 요리를 전문적으로 제공하는 외국 음식 전문점의 인허가 현황을 포함하고 있습니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 폐업일자, 위생업종 및 업태명, 소재지 주소(도로명 및 지번), 건물소유구분, 급수시설구분, 총시설규모, 종업원 수, WGS84 기반의 위도·경도 좌표 등이며, 외국 음식점 분포 분석 및 다문화 식문화 확산 연구에 활용될 수 있습니다. 데이터는 지방행정 데이터 개방시스템을 통해 행정안전부가 제공하며, 주간 단위로 갱신되어 신뢰할 수 있는 정보를 제공합니다.
