summary_user: 경기도 시군별로 식품안전보호구역 현황을 집계한 자료로, 집계연월마다 전체 학교 수, 보호구역 지정 학교 수, 보호구역 수, 전담관리원 지정 수, 우수판매업소 수를 담는다. 정책 담당자나 분석가가 '우리 시군은 학교 대비 보호구역 지정 비율과 우수판매업소 수가 다른 시군보다 낮은가'를 비교할 때 쓴다. 전역 조인 키는 없으며, 시군코드(SIGUN_CD)나 시군명으로 경기도의 다른 시군 단위 통계와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 식품안전 보호구역에 대한 집계 현황을 제공하는 자료로, 식품안전과 직결된 교육기관 주변의 안전 관리 체계를 파악할 수 있도록 구성되어 있습니다. 식품안전 보호구역으로 지정된 학교 수, 전체 학교 수, 보호구역 수, 전담관리원 지정 수, 우수판매업소 수 등 총 12개 항목이 포함되어 있으며, 시군 단위의 상세 구분도 제공합니다. 어린이 및 청소년 대상 식품안전 정책 수립, 지역 보건안전 실태 분석, 학교 주변 위생환경 개선 등의 목적으로 활용 가능하며, 연간 단위로 갱신되며 Open API를 통해 접근 가능합니다.
