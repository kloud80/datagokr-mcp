summary_user: 충청남도 당진시가 모범음식점으로 지정한 관내 업소를 한 행에 한 곳씩 담은 목록 파일로, 업소명·도로명 소재지·업태·주취급음식·관할부서·기준일자를 담는다(csv 약 4.6KB 규모). 시민이나 관광객이 '당진에서 위생 관리가 인정된 한식집은 어디인가'를 찾거나, 분석가가 지역별 모범음식점 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 원장 등 다른 데이터와는 업소명·도로명 주소를 맞춰 대조하는 방식으로만 이어 쓴다.
