summary_user: 식품·식품첨가물 제조업소가 보고한 생산실적을 업소·품목·보고년도 단위로 담는 전국 범위의 건별 자료이며, 업소명·주소·품목유형·품목명·연간생산능력(KG)·생산량(KG)을 포함한다. 분석가나 사업자가 특정 품목유형의 연도별 생산량과 생산능력 대비 실적이 업소별로 어떻게 다른지 확인하는 데 쓴다. 품목제조보고번호(PRDLST_REPORT_NO)로 같은 세부 부문의 제품·품목 DB와 제품 단위로, 인허가번호(LCNS_NO)로 식품 인허가 업소 자료와 이어 쓰는 것을 검토하지만, 실측 컬럼에서 전역 조인 키가 확인되지 않아 실제 연결은 이름·코드 매핑이나 같은 기관 코드에 기대야 한다.
description_portal: 식품과 식품첨가물의 생산실적 보고 현황 자료로, 인허가번호 , 업소명 , 주소 , 보고년도 , 품목제조보고번호 , 품목유형 , 품목명 , 연간생산능력(KG), 생산량(KG) 등의 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
