summary_user: 서울 구로구 관할 관광식당의 인허가 원장을 업소 1건 단위로 담으며, 인허가일자·취소일자·영업상태(TRDSTATENM)·폐업일자·사업장명·지번/도로명 주소와 좌표(X, Y), 시설 규모·좌석 수 등 속성을 포함한다. 구로구에서 현재 영업 중인 관광식당이 어디에 몇 곳 있는지, 언제 허가받았고 폐업했는지를 확인하려는 관광·외식 분야 분석가나 민원 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·사업장명·주소 매칭이나 좌표를 통한 공간 결합으로 이어 쓰며, 같은 형식의 다른 자치구 식품 인허가 데이터와 나란히 비교하는 방식이 현실적이다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 관광식당 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 관광식당의 업태구분, 시설 현황, 위생 관리 사항 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 관광 정책, 연구 분석, 민원 처리, 외식 산업 관리 등 여러 분야에서 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계할 수 있어 지역사회 정보 접근성을 높이고 행정 투명성을 강화하는 기반 자료로 기능한다. 데이터 항목이 표준화되어 비교와 통계 작성이 용이하며, 허가 변경 이력과 상태 값이 포함되어 지도와 점검에 활용될 수 있다.
