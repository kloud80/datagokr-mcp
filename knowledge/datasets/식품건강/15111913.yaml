summary_user: 식품 원재료 한 건마다 표준 원자재명(국문·영문), 표준 원부자재·원자재 번호, 품목보고대장번호, 규격·단위, GMO 여부, 수입 여부, 원산지 국가코드, 사용여부, 거래처 코드를 담은 전국 단위 원재료 표준 정보다. 식품 제조사나 분석가가 특정 원재료가 GMO인지, 수입산인지, 원산지가 어디인지 확인하거나 품목에 쓰인 원재료를 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 원재료명·코드 매핑으로 연결해야 하며, 품목보고대장번호(PRDLST_REPORT_LEDG_NO)가 같은 부문의 품목제조보고 데이터와 제품 단위로 맞춰 볼 후보다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 이어 붙일 수 있다. 공간 정보가 없는 전국 단위 데이터라 지역별 분석에는 맞지 않는다. 개발계정은 일 10,000회 호출로 제한된다.
