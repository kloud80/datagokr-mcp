description_portal: 식품의약품안전처 「식품 원재료 정보 조회」 OpenAPI는 식품 원재료의 표준화된 정보를 제공하는 공공데이터입니다. 주요 제공 항목에는 원자재명, 표준 원부자재번호, 표준 원자재번호, 품목보고대장번호, 규격 및 단위, GMO 여부, 수입 여부, 원산지 국가코드, 비고, 사용여부, 원자재명 영문, 거래처 ID, 표준 원부자재 코드 속성정보 등이 포함되어 있습니다. 이 데이터를 통해서 사용자는 원재료의 특성과 유통·관리 현황을 종합적으로 파악하여 원재료 관리와 보고 체계를 효율적으로 운영하기 위한 기초자료로 활용할 수 있습니다.
