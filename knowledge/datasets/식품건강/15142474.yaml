description_portal: 부천시의 안심식당은 위생과 안전 수칙을 철저히 준수하는 업소로 인증된 곳으로 해당 데이터는 부천시 관내 위치한 안심식당(업소명, 소재지도로명주소, 소재지지번주소, 전화번호, 데이터기준일자)에 대한 데이터를 제공하고 있습니다.안심식당이란 식사문화 3대 개선 과제 (덜어 먹는 도구 비치, 위생적 수저 관리, 종사자 마스크 착용)을 준수하는 음식점을 뜻하며, 시민과 방문객이 안심하고 외식할 수 있도록 돕고, 지역 외식 업계를 활성화하는데 목적이 있습니다.식사를 제공하는 일반,휴게 음식점을 지정대상으로 선정하였으며, 카페, 디저트 전문점, 제과점, 패스트푸드점 등 일반 식사를 제공하지 않는 영업장은 제외하였습니다.※해당 데이터는 각 구청 산업위생과에 문의 부탁드립니다.
