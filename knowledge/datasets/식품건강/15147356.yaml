summary_user: 서울 강북구에서 소고기·돼지고기 등 식육을 잘라 포장해 파는 식육포장처리업소의 인허가 정보를 업소 단위로 담은 건별 원장이며, 영업 중인 곳과 폐업한 곳을 모두 포함하고 인허가일·영업상태·주소·중부원점TM 좌표(X, Y)를 담는다. 상권 분석가나 창업 예정자가 "강북구에서 식육포장처리업소가 어디에 몇 곳 영업 중이고 최근 언제 폐업했나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 업소명·주소 매핑이나 같은 기관의 관리번호(MGTNO) 체계로만 연결한다.
