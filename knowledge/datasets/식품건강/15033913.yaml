summary_user: '충청북도 제천시의 음식점을 업소 한 곳당 한 행으로 담은 인허가 원장 파일로, 업종명·업태명·업소명·인허가일자·영업시작일·도로명/지번 주소·전화번호를 담는다. 제천시에서 특정 업태(예: 한식, 카페) 음식점이 어느 동네에 몰려 있는지, 최근 몇 년 새 새로 허가받은 업소가 얼마나 되는지를 보려는 창업 예정자나 상권 분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(제천시) 기준으로만 이어 쓴다.'
description_portal: 해당 데이터는 충청북도 제천시의 음식점 현황을 정리한 데이터입니다. 업종명, 인허가일자, 업소명, 도로명 주소, 지번주소, 전화번호, 영업시작일, 업태명, 데이터기준일자 등의 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 충청북도 제천시의 음식점 현황의 주소(도로명,지번), 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 12월 29일입니다. 담당부서는 제천시 보건소 보건위생과과이며 문의주시면 최신의 충청북도 제천시 음식점 현황을 열람하실 수 있게 도와드립니다.
