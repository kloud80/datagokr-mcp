summary_user: 경기도 내 목욕장업(공동탕업) 업소를 사업장 한 곳당 한 행으로 담은 인허가·영업 현황 원천 자료다. 사업장명, 인허가일자, 영업상태와 폐업일자, 면적, 욕실 수, 건물 층수, 주소와 좌표가 들어 있다. 분석가나 사업자가 '우리 시군에서 지금 영업 중인 공동탕은 어디이고 최근 몇 곳이 폐업했나' 같은 질문에 답할 때 쓰고, 다른 데이터와는 전역 조인 키 없이 시군 코드(SIGUN_CD)·주소·사업장명 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 전국의 목욕장업(공동탕업)에 대한 인허가 및 영업 현황을 정리한 자료로, 공중위생 관리 및 지역 상권 분석에 활용될 수 있습니다. 주요 항목에는 시군명, 사업장명, 인허가일자 및 취소일자, 영업상태(영업·폐업 구분), 폐업일자, 소재지 시설 전화번호, 소재지 면적, 도로명우편번호 등이 포함되어 있습니다. 이 데이터는 공중위생 관리 정책 수립, 지역 생활 편의시설 분포 분석, 목욕업 종사자 근로 환경 연구 등 다양한 분야에서 활용할 수 있으며, 영업 상태 변화를 통해 목욕업의 산업적 추세를 파악하는 데에도 도움이 됩니다.
