summary_user: 전국 지자체가 관리하는 식품운반업 인허가 업소를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, API 전체 7,303건이며 인허가일자 기준 2022-02-03부터 2026-10-01까지 들어 있다. 부패하기 쉬운 식품을 나르는 운반업체가 어디에 있고 영업 중인지(영업상태), 폐업했는지(폐업일자)를 확인하려는 분석가나 위생 담당자가 쓴다. 지번주소·도로명주소(address 키)와 관리번호(pnu 키)로 다른 주소·토지 데이터와 잇고, 같은 부문의 다른 식품 인허가 업소 데이터와 함께 상권·업소 현황 분석에 쓴다.
description_portal: '식품_식품운반업 데이터는 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 식품운반업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터의 법령 소관기관 및 문의처 : 식품의약품안전처 식품안전정책과 / 043-719-2032 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
