summary_user: 안동시 관내 식품 유통·판매 사업장을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·우편번호·전화번호가 들어 있습니다(CSV 약 1.9KB의 소규모 목록). 시민이나 상권 연구자가 '안동시에 어떤 식품판매 업소가 어디에 있는가'를 확인하거나 업종별 분포를 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 업소명·도로명 주소를 맞춰 붙이거나, 같은 기관(안동시)의 다른 식품 인허가 자료와 이름으로 대조해 이어 쓴다.
description_portal: 안동시 식품유통판매업체 현황 데이터는 안동시 관내에서 식품을 유통, 판매하는 사업장의 기본 정보를 제공하는 자료입니다. 업체명, 업종, 소재지, 영업신고 번호, 영업자 정보, 허가/신고 현황, 주요 취급 품목 등 주요 항목으로 구성되어 있으며, 식품 안전관리, 위생 점검, 소비자 보호 및 정책 수립을 지원하기 위해 공개됩니다. 본 데이터는 시민, 연구기관, 언론, 식품 관련 기관 및 기업 등이 식품 유통 현황 분석, 소비자 안전 모니터링, 지역 상권 연구 및 공공위생 정책 수립을 위한 기초 자료로 활용할 수 있으며, 식품 안전관리와 공공 행정의 투명성 제고에 기여합니다.
