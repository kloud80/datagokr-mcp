summary_user: 경기도 하남시 관내 일반음식점·휴게음식점·제과점 등 식품접객업소 가운데 옥외영업 허가를 받은 업소를 한 행씩 담은 건별 목록으로, 업종·업소명·도로명 소재지·영업 인허가일자·옥외영업장 허가일자를 포함합니다(약 9.6KB CSV, 포털 설명상 옥외영업 허가 연도는 2021~2025년). 하남시에서 테라스·야외 좌석 영업이 허가된 가게가 어느 동네에 몰려 있는지, 언제부터 늘었는지 알아보려는 시민·상권 분석가가 쓴다. 공통 조인 키(인허가번호·사업자번호 등)는 없어서, 다른 식품 인허가 업소 데이터와는 업소명과 도로명 주소를 맞춰 연결하고, 주소를 좌표로 바꿔 지도·상권 데이터에 붙여 쓴다.
description_portal: 경기도 하남시 관내 식품접객업소(일반음식점, 휴게음식점, 제과점영업 등)의 옥외영업 허가현황을 제공하는 데이터로, 업소명, 소재지, 업종, 옥외영업 허가일자, 데이터 기준일 등의 정보를 포함합니다. 이 데이터는 옥외영업 관리, 상권분석, 행정지원, 시민 편의 증진 등 다양한 분야에서 활용될 수 있으며, 지역 내 식품접객업소의 분포와 변화를 분석하여 정책 수립 및 지역 경제 활성화에 기여할 수 있습니다. 또한, 민원 대응 및 공공서비스 개선을 위한 기초 자료로 활용되어 행정의 효율성과 투명성을 높이는 데 기여합니다. (옥외영업허가년도는 2021년~2025년에 걸쳐 분포 )
