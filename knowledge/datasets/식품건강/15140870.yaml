summary_user: 서울 광진구에서 인허가를 받은 축산물운반업체를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·지번/도로명 주소·인허가일자·폐업일자·영업상태·업태와 중부원점TM 좌표(X, Y)를 담는다. 구청 위생 담당자나 유통 분석가가 "광진구 안에서 지금 영업 중인 냉장·냉동 축산물 운반업체는 몇 곳이고 어디에 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 자치단체 코드(OPNSFTEAMCODE)·관리번호(MGTNO)로만 이어 쓰며, 같은 형식의 다른 식품 인허가 업종 원장과 나란히 놓고 보는 용도에 맞다.
description_portal: 본 데이터는 서울특별시 광진구 관내에서 축산물을 전문적으로 운반하기 위해 인허가를 받은 축산물운반업체 현황을 제공합니다.축산물운반업은 「축산물 위생관리법」에 따라 허가된 업종으로, 식육, 원유, 식육가공품 등 축산물의 위생적 유통을 위해 냉장·냉동 설비를 갖춘 차량을 통해 운반하는 업소를 포함합니다.데이터에는 업소명, 소재지, 인허가일자, 영업상태, 업태 구분, 관할 행정기관 등이 포함되며, 이는 축산물 위생관리, 유통경로 추적, 식품안전 사고 예방, 냉장유통 인프라 파악 등에 활용됩니다.또한, 식품위생법에 따라 적절한 온도 유지, 교차오염 방지, 운송 중 위생관리 기준 준수 여부 등을 확인하는 행정자료로도 중요합니다.※ 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준의 좌표만 포함되며, 위도·경도는 제공되지 않습니다.※ 본 데이터는 3일 전 기준 최신 인허가 현황을 반영하고 있습니다.
