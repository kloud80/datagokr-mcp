summary_user: 부산광역시 사상구에 영업신고된 식품제조·가공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호로 구성되며 주류 제조업소는 빠져 있다. 사상구 안에서 식품 제조·가공 공장이 어디에 있는지 찾거나 납품·위탁생산할 업체 목록을 뽑으려는 사업자와 지역 식품산업 분포를 보려는 분석가가 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '해당 자료는 부산광역시 사상구에 영업신고된 식품제조가공 현황(2025.06.18. 기준)에 대한 정보를 제공합니다.업소에 대한 기본정보(업종명, 업소명, 소재지주소, 업소전화번호)로 구성된 데이터입니다.업소 전화번호에 개인정보가 포함되어 있거나 불명확한 경우 공란 처리 하였습니다.*식품제조·가공업: 식품(모든 음식물(의약으로 섭취하는 것은 제외))을 제조ㆍ가공하는 영업*식품제조ㆍ가공업 중 「주세법」 제2조제1호의 주류를 제조하는 경우에는 식품의약품안전처장에게 등록하여야하므로 현 자료에서는 제외되었음을 알려드립니다.'
