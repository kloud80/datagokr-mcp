summary_user: 식품안심업소(구 위생등급제)로 지정된 전국 식품접객업소를 업소별로 담은 원천 목록으로, 업소명·주소·업종·지정등급·지정일·지정기간·지정취소일·폐업 여부 등을 제공한다. 소비자가 '이 동네에서 위생 지정을 받은 음식점은 어디인가'를 확인하거나, 분석가가 지역·업종별 지정 현황과 취소·폐업 추이를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다만 업소 인허가번호(LCNS_NO)로 식품 인허가 업소 원장과 연결할 수 있고, 그 밖에는 업소명·주소 매칭으로 회수·행정처분 등 식품안전 정보와 이어 쓴다.
description_portal: 식품안심업소(구 위생등급제)는 위생상태 평가 기준을 충족한 식품접객업소등을 지정하는 제도입니다. 식품안심업소로 지정된 식품접객업소에 대한 속성정보를 제공합니다.※ ‘매우 우수’, ‘우수’, ‘좋음’ 3단계로 부여되던 위생등급 제도가 변경되어, 식품안심업소 '적합'으로 통일되었습니다.('26. 3. 16.) 이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 일자리 창출 효과를 가져올 수 있으며, 사회적으로는 국민의 알권리 보장, 공공 가치 창출을 실현하는 데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상시킬 수 있습니다.
