description_portal: 서울특별시 중랑구 공중위생업소 소재지별 운영 현황입니다. 자치구명, 법정동명, 업종명, 업소수 등의 정보를 제공하고 있습니다. 위생관리서비스를 제공하는 업소입니다. 소재지는 법정동(면목동, 상봉동, 중화동, 묵동, 망우동, 신내동)별 구분되어 있습니다. 업종 종류 예시로는 숙박업, 목욕장업, 일반미용업, 피부미용업, 네일미용업, 세탁업, 위생관리용역업, 공중이용시설 등이 있습니다. 자세한 사항은 서울 열린데이터 광장 사이트 링크로 이동하여 파일을 다운받아서 확인하여 주시기 바랍니다. 감사합니다.
