summary_user: 경기도 31개 시군에 등록된 식품소분업체(완제품 식품을 작은 단위로 나눠 다시 포장하는 업체)의 인허가 현황을 업소 한 곳당 한 행으로 담는다. 인허가·폐업일자, 영업상태, 도로명·지번 주소와 위경도, 면적, 종사자 수 등이 들어 있다. 사업자나 분석가가 '우리 시군에 영업 중인 식품소분업체는 어디에 몇 곳이고, 최근 새로 허가받거나 문을 닫은 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 주소·좌표, 사업장명으로 다른 식품 인허가 업소 데이터나 행정구역 자료와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 31개 시군에 등록된 식품소분업체의 인허가 현황으로, 완제품 식품을 소단위로 분할하여 별도로 포장하는 업체 정보를 포함합니다. 데이터는 사업장명, 업태명, 인허가일자, 취소일자, 폐업일자, 위생업태명, 소재지 주소(도로명 및 지번), 위도·경도, 면적, 종사자 수(남성·여성·총합), 등급구분, 급수시설 정보, 건물 소유형태, 보증금·월세 금액, 전통업소 여부 및 관련 음식명 등의 다양한 항목으로 구성되어 있습니다. 이 자료는 식품 유통 및 포장 산업 구조 파악, 유통경로 분석, 정책 수립, 지역 상권 특성 분석 등에 활용 가능하며, XML 또는 JSON 형식의 Open API를 통해 별도 호출 제한 없이 접근 가능합니다.
