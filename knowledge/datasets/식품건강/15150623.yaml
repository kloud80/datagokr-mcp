summary_user: 식품의약품안전처가 수입식품업 영업자에게 내린 행정처분을 업소별 건으로 담으며, 업소명·업종·인허가번호·대표자·주소와 처분 확정일·처분 기간·처분 유형·위반 내용·처분 기관이 들어 있고 범위는 전국이다. 수입식품을 거래하려는 사업자나 소비자가 "이 수입업체가 과거에 어떤 위반으로 영업정지 등 처분을 받았나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 식품 인허가 업소나 수입식품 데이터와는 업소명이나 인허가번호(LCPMT_NO)를 맞춰 보는 방식으로만 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 행정처분결과(수입식품업) 정보입니다."
