summary_user: 경기도 광명시 안의 공중위생업소(미용업·숙박업·세탁업·건물위생관리업·목욕장업)를 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·도로명 주소·우편번호·전화번호를 담는다. 광명시 주민이나 사업자가 '우리 동네에 어떤 미용실·세탁소·목욕탕이 있고 연락처는 무엇인가'를 확인하거나, 분석가가 시 안의 업종별 업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞추거나 같은 기관(광명시) 단위로만 이어 쓴다.
description_portal: 경기도 광명시 내 공중위생관리업소(미용업, 숙박업, 세탁업, 건물위생관리업, 목욕장업) 현황에 대한 정보 데이터로 업종, 업소명, 업소의 주소지, 업소 주소지 우편번호, 업소전화번호 등의 항목을 제공합니다. 이는 공중위생관리업소에 대한 정보를 제공하여 공중위생관리업의 공공데이터 활용을 제고하고자 합니다. 공중위생업이란 다수인을 대상으로 위생관리 서비스를 제공하는 영업을 의미하며 국민의 건강과 위생을 위해 법적으로 엄격히 관리되는 업종입니다. 공중위생관리법 소관으로 영업신고가 이루어지며 공중위생업소 영업자의 준수사항이 있습니다.
