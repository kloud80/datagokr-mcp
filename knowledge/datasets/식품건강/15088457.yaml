summary_user: 남양주시에 신고된 위탁급식영업 업소를 한 행에 한 곳씩 담은 목록으로, 업종명·업소명·도로명/지번 소재지·전화번호·데이터기준일자를 담는다(CSV 약 14.8KB, 시군구 범위의 개별 주소 단위). 남양주시에서 학교·병원·산업체 급식을 맡는 위탁급식 업체가 어디에 몇 곳 있는지 확인하거나, 위생 점검 대상 업소 명단을 뽑는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 남양주시의  위탁급식소 목록에 대한 데이터로 업태명(위탁급식영업), 업소명, 소재지주소, 전화번호 등의 항목을 제공합니다.식품위생법에 따라 집단급식소(학교, 병원, 산업체 등)와의 계약을 통해 해당 시설의 급식을 전담하는 업체에 대한 기록입니다. 위탁급식 영업을 하는 업체가 관할 지자체에 신고하고 관리되는 내용을 기반으로 합니다. 식품 안전 관리, 산업 분석, 공공 서비스 제공 등 여러 분야에서 중요한 목적으로 활용됩니다. 식중독 취약 시기나 집중 관리 필요 업소를 선별하여 효율적인 위생 점검 및 지도 단속 계획을 수립가능합니다.
