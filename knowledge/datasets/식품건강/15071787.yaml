description_portal: 울시 집단급식소식품판매업 인허가 정보는 서울 지역에서 집단급식소를 대상으로 식품을 판매하는 업소의 인허가 이력과 영업 현황을 체계적으로 확인할 수 있는 공공데이터입니다. 이 데이터는 인허가일자, 취소일자, 휴업·폐업 이력, 재개업 여부 등 영업상 행정 변동 정보를 포함하고 있어 업소의 운영 상태를 명확히 파악하는 데 도움이 됩니다. 또한 전화번호, 지번·도로명 주소, 우편번호, 면적, 좌표 등 사업장의 기본 정보와 위치 정보를 제공하여 실제 운영 환경을 이해하는 데 유용합니다. 위생업태명, 급수시설구분명, 영업장 주변 환경, 등급구분명 등 집단급식소 식품판매업의 특성을 보여주는 항목도 포함되어 위생 수준과 시설 특성을 세밀하게 확인할 수 있습니다. 남녀 종사자 수, 총 인원, 본사 및 공장 종업원 구성 등 인력 구조 정보가 포함되어 있어 업소 규모와 운영 형태를 파악하는 데 도움이 되며, 건물 소유 구분, 보증액, 월세액 등 재정 및 시설 관련 정보도 제공됩니다. 더불어 다중이용업소 여부, 시설 총규모, 전통업소 지정번호 및 주된 음식 정보, 홈페이지 주소 등 사업장의 부가적 특성과 공공성 관련 정보를 함께 제공하여 행정 관리, 위생·안전 점검, 산업 연구 등에 폭넓게 활용할 수 있는 중요한 자료입니다.
