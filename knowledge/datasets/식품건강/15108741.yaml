summary_user: 광주 광산구 관내 유흥주점을 업소 한 곳당 한 행으로 담은 현황 파일로, 사업장명·위생업태명(단란주점·일반유흥주점 등 유형)·주소·전화번호·다중이용업소 여부·인허가일자를 담는다. 구청 위생·안전 담당자나 상권 분석가가 '광산구 어느 동네에 유흥주점이 몰려 있고 그중 다중이용업소는 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어서 다른 식품 인허가 업소 자료와는 사업장명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '광주광역시 광산구에 위치한 유흥주점에 대한 현황 정보는 관내 위생 및 안전 관리를 위한 기초자료로 활용되며, 다양한 항목이 포함되어 있습니다. 이 데이터는 사업장명, 위생업태명, 주소, 전화번호, 다중이용업소여부, 허가일 등의 정보를 포함하고 있습니다.유흥주점이 단란주점, 일반유흥주점 등 어떤 유형으로 분류되는지를 확인할 수 있으며, 위생업태명 항목을 통해 업소가 속한 위생 관련 업종을 나타냅니다.이는 위생 점검이나 관련 법령 적용 기준을 구체화하는 데 활용됩니다. 또한 다중이용업소 여부는 해당 사업장이 많은 이용객을 수용하는 시설인지 여부를 나타내며, 안전 점검이나 긴급 상황 대응 계획 수립에 중요한 기준이 됩니다. 이와 같은 광산구 유흥주점 현황 정보는 보건·위생 행정, 공공안전 관리, 유흥업소 분포 분석 및 정책 수립 등 다양한 분야에서 기초 자료로 활용될 수 있는 중요한 행정 데이터입니다.※ 자료 제공 : 광주광역시 광산구 식품위생과'
