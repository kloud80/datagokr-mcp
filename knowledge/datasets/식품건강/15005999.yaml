summary_user: 서울 종로구 관내 공중위생업소(목욕·이미용·세탁·숙박 등)를 업소 한 곳당 한 행으로 담은 파일이며, 업종명·업소명·신고일자·영업소 주소·전화번호와 데이터기준일이 들어 있다. 주민이나 방문객이 종로구에서 영업 중인 세탁소나 미용실을 찾거나, 분석가가 종로구 업종별 공중위생업소 분포와 신고 시기를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(종로구) 자료끼리만 이어 쓴다.
