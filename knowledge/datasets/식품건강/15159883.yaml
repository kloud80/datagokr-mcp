description_portal: 본 데이터는 경상북도 성주군 관내 의료기관에서 운영하는 집단급식소의 운영 현황을 제공하는 공공데이터이다. 의료기관 내 급식시설의 기본 정보와 운영 특성을 체계적으로 확인할 수 있도록 구축하였으며, 지역 내 급식서비스 제공 실태와 식품위생 관리 현황을 파악하는 데 활용할 수 있다.데이터는 업종명, 업소명, 도로명주소, 영업시작일, 업태명, 운영형태, 병상수, 데이터기준일 등의 항목으로 구성되어 있다. 이를 통해 의료기관별 집단급식소의 소재지, 영업 현황, 운영 방식 및 수용 규모 등을 확인할 수 있으며, 병상수 정보와 연계하여 의료기관의 급식 운영 규모를 분석할 수 있다.또한 본 자료는 지역 내 의료기관 급식시설의 분포 현황 조사, 식품위생 관련 정책 수립, 공공보건 행정 지원, 급식서비스 연구 및 통계 분석 등의 기초자료로 활용 가능하다. 이용자는 의료기관 집단급식소의 운영 현황을 종합적으로 파악할 수 있으며, 공공서비스 제공 및 지역 보건행정의 효율성 제고를 위한 참고자료로 활용할 수 있다.데이터는 기준일 현재 성주군에서 관리하는 정보를 바탕으로 작성되며, 지속적인 현황 관리와 정보 제공을 목적으로 한다.
