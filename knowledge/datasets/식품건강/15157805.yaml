summary_user: 경상북도 영천시에서 임신부 할인 혜택을 주는 식당·카페를 업소 한 곳당 한 행으로 담은 목록으로, 순번·상호·주소·전화번호만 있다. 영천시 임신부나 가족이 할인받을 수 있는 업소가 어디에 있고 연락처가 무엇인지 찾을 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 식품 인허가 업소 원장 등 다른 데이터와는 상호명·주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 해당 데이터는 경상북도 영천시의 할인업소 현황을 상세하게 제공하는 자료입니다. 영천시 내 다양한 식당, 카페의 정보를 포함하고 있으며, 각 업소의 상호명, 주소, 전화번호 등의 기본 정보를 확인하실 수 있습니다. 본 데이터는 영천시 지역 내 소비자들이 임신부 할인 혜택을 제공하는 업소를 신속하게 찾을 수 있도록 구성되어 있으며, 지역 경제 활성화와 주민 편의 증진을 목적으로 제작되었습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 보건소 보건위생과로 연락주시기 바랍니다.
