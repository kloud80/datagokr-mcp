summary_user: 인천광역시 서구(서해구) 관내 식품접객업소의 신고 현황을 업소 한 곳당 한 행으로 담은 파일 데이터로, 업종명·인허가일자·업소명·소재지(주소)를 담는다. 동네에 어떤 업종의 음식점이 언제 신고했는지 확인하거나, 서구 안에서 업종별·지역별 밀집도를 살피려는 창업자·분석가가 상권 파악에 쓴다. 실측 컬럼에 인허가번호나 사업자번호 같은 공통 조인 키가 없어, 다른 식품 인허가·위생 데이터와는 업소명과 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 인허가번호·좌표 같은 식별 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 업소명·주소 매칭에 의존해야 한다. 범위는 인천 서구 한 시군구에 한정되며 원장 수준의 전국 비교에는 다른 지자체 데이터가 따로 필요하다.
