summary_user: 서울특별시 강서구에서 식용얼음을 판매하는 업소의 인허가 정보를 업소 단위로 담으며, 인허가일자, 영업상태·상세영업상태, 폐업일자, 사업장명, 지번·도로명 주소, 전화번호, 좌표(X·Y) 등을 포함한다. 강서구 안에서 현재 영업 중인 식용얼음 판매업소가 어디에 있는지 확인하거나, 위생 점검 대상 업소 목록을 만들려는 담당자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 관리번호(MGTNO)와 좌표는 다른 식품 인허가 업종 데이터와 대조하는 데 쓴다.
description_portal: 서울특별시 강서구 내에서 식용얼음을 전문적으로 제조하거나 판매하는 업소들의 인허가 정보를 제공하는 데이터입니다. 식용얼음은 음료나 음식에 직접 섭취 용도로 사용되므로 위생과 안전성이 매우 중요하며, 식품의약품안전처의 기준에 따라 관리됩니다. 본 데이터는 해당 업소의 인허가일자, 현재 영업상태, 사업장명, 주소, 전화번호 등의 항목으로 구성되어 있으며, 관내 식용얼음 유통 구조를 파악하거나 위생 점검 대상 선정을 위한 기초자료로 활용될 수 있습니다. 또한 소비자가 식품위생법에 따른 적법한 업소에서 구매할 수 있도록 하는 데에도 기여합니다. 관련 기관은 본 정보를 바탕으로 품질관리와 행정지도 업무를 수행할 수 있으며, 여름철 등 수요가 급증하는 시기에는 식중독 예방 차원에서 보다 강화된 위생 관리와 대응계획 수립에도 도움이 됩니다.
