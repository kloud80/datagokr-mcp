summary_user: 경기도 안양시에 등록된 목욕장업 업소(대중목욕탕·찜질방·사우나 등)를 업소 한 곳당 한 행으로 업종명, 업소명, 도로명 영업소 주소, 소재지 전화와 함께 담은 작은 파일(약 2.9KB CSV)이다. 안양시 주민이 집 근처에서 운영 중인 목욕탕이나 찜질방을 찾고 연락처를 확인하거나, 분석가가 만안구·동안구별 목욕장 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 공중위생업소·인허가 데이터와는 업소명이나 주소를 직접 맞춰서만 이을 수 있다.
