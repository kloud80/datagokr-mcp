description_portal: '안양시 목욕장업 (업종명, 업소명, 영업소 주소, 소재지 전화)현황입니다. 업종명- 목욕장업, 한증막업 등 업종 구분  업소명 - 등록된 목욕장 또는 찜질방의 상호명  영업소 주소 - 도로명주소 및 지번주소 (예: 안양시 만안구 덕천로152번길 등)  전화번호- 각 업소의 대표 연락처 안양시의 목욕장업 현황은 관내에 등록된 대중목욕탕, 찜질방, 사우나 등 위생 관련 업소들의 정보를 정리한 공공데이터입니다. 이 데이터는 시민의 위생 서비스 접근성과 행정 관리를 위해 제공되며, 공공데이터포털에서 누구나 열람하고 활용할 수 있어요.업데이트 주기는 연1회입니다'
