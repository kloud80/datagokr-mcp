summary_user: 서울 금천구의 식품소분업 업소를 한 곳씩 담은 인허가 원장으로, 인허가 일자·영업상태(영업/휴업/폐업)·폐업 일자·사업장명·지번/도로명 주소·좌표·업태·종사자 수·시설 규모·임대 여부·전통업소 지정 같은 항목이 업소별로 들어 있다. 금천구에서 지금 영업 중인 식품소분업체가 어디에 몇 곳 있는지, 최근 새로 허가받거나 문을 닫은 곳이 있는지를 확인하려는 창업 준비자나 상권·위생 관리 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 잇고, 좌표(X·Y)로 위치 기반 결합을 한다.
description_portal: 금천구 내 식품소분업체의 인허가 현황을 제공하는 데이터입니다. 인허가 일자, 영업상태, 취소 및 폐업·휴업 이력, 사업장명, 소재지, 전화번호, 업태 구분, 위생업태, 종사자 수, 사업장 규모, 임대 여부, 전통업소 지정, 홈페이지 등 다양한 항목을 포함하고 있습니다. 이를 통해 식품소분업체의 영업 현황과 업소 특성을 종합적으로 파악할 수 있으며, 식품위생 관리, 정책 수립, 창업 및 입지 분석, 업계 동향 파악 등에 활용할 수 있습니다. 또한 행정기관, 연구기관, 민간기업 등에서 위생 관리 체계 강화, 산업 지원 전략 마련, 시장 분석 등 다양한 목적의 기초 자료로 유용하게 쓰일 수 있습니다.
