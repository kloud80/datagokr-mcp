summary_user: 은평구에서 완제품 식품을 나눠 다시 포장하는 식품소분업 업소를 한 곳씩 담은 인허가 원장으로, 업소명·인허가일·영업상태·폐업일·주소·중부원점TM 좌표(X, Y)를 포함한다. 소분 식품을 취급하려는 사업자나 위생 담당자가 "은평구에서 지금 영업 중인 식품소분업체는 어디이고 언제 인허가를 받았나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 식품 인허가·위생 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호로만 이어 쓴다.
description_portal: '은평구의 완제품 형태의 식품을 별도로 소분하여 포장하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 은평구 내 식품소분업체의 인허가 정보를 담고 있으며,  업체명, 주소, 인허가일, 분류코드, 영업형태, 주 취급 식품 등의 정보를 제공합니다.  식품소분업은 대량 식품을 소량 단위로 나누어 재포장하는 과정에서  위생관리의 중요성이 특히 강조되는 업종입니다.  본 데이터는 위생기준 준수 여부 확인,  식중독 사고 대응 기반 마련, 유통 투명성 확보 등의 행정 목적으로 활용됩니다.  또한, 소비자 신뢰 확보와 공정거래 질서 유지를 위한  식품안전 관리체계 구축에도 중요한 역할을 합니다.'
