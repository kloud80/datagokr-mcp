summary_user: 경상남도 관내 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일로, 인허가관할기관·업소명·업종·영업상태가 들어 있다(포털 설명상 2024년 1월 31일 기준 운영 중 2,368개소). 지역 식품업 분석가나 사업자가 '경남 어느 시군에 식품제조가공업소가 몇 곳 영업 중인가'를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어, 다른 식품 인허가·행정처분 데이터와는 업소명이나 관할기관 이름을 맞춰서만 이어 쓴다.
