description_portal: 식품의약품안전처에서 관리하는 건강기능식품 업소에 대한 인허가번호, 업소명, 대표자명, 업종, 허가일자, 폐업일자, 페업상태, 주소, 기관명 정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화를 통한  일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 건강기능식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
