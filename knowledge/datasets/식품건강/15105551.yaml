summary_user: 전국 건강기능식품 업소 가운데 폐업한 업소를 건별로 담으며, 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업상태·주소·관할 기관명을 업소 단위 주소로 제공한다. 사업자나 분석가가 "우리 지역에서 최근 문을 닫은 건강기능식품 판매업소는 어디이고 언제 폐업했나" 같은 질문에 답하거나, 상권 내 건강기능식품 업소의 개폐업 흐름을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식품 인허가 업소 데이터와는 인허가번호·업소명·주소를 맞대는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터셋과 정확히 연결하려면 이름·주소 매칭이 필요하다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한된다.
