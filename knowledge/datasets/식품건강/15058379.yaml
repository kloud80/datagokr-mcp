summary_user: 경기도 내 도시락제조업체의 인허가 현황을 업소 한 곳당 한 행으로 담으며, 시군별로 사업장명·인허가일자·영업상태·폐업일자·소재지 주소와 좌표·시설규모·종사자 수 등을 포함한다. 급식서비스 기업이나 공공급식 정책 담당자가 '우리 시군에 영업 중인 도시락 제조시설은 어디에 몇 곳이고 규모는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명, 주소·좌표, 사업장명 매칭으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 도시락을 전문으로 제조하는 도시락제조업체의 인허가 정보를 포함한 현황 자료입니다. 해당 데이터는 시군별로 구분되며, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지, 위생업종 및 업태, 시설규모, 건물소유구분, 급수시설, 종사자 수 등 총 24개 항목으로 구성되어 있습니다. 도시락 제조시설의 위치 및 규모, 유통 특성 등을 분석할 수 있어 급식서비스 기업, 프랜차이즈 본사, 공공급식정책 수립기관 등에서 실무 자료로 활용될 수 있습니다. Open API를 통해 통합적으로 접근할 수 있습니다.
