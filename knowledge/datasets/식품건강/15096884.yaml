summary_user: 전국 집단급식소 가운데 폐업한 업소를 업소 한 곳당 한 건씩 담은 인허가 원장 성격의 데이터로, 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업상태·소재지 주소·관할 기관명을 담는다. 급식 위탁업체나 상권 분석가가 특정 지역에서 언제 어떤 집단급식소가 문을 닫았는지 확인하거나, 폐업 추이를 살펴보는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 식품 인허가·행정처분 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 매칭, 같은 기관 코드 체계로만 이어 쓴다.
description_portal: 집단급식소 폐업 정보에 대한 데이터로 인허가번호, 업소명, 대표자명, 업종, 허가일자, 폐업일자, 페업상태, 주소, 기관명등을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
