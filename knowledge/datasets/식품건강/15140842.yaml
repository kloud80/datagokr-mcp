summary_user: 서울 광진구 관내 목욕장업(대중목욕탕·찜질방·사우나 등) 영업소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 상호명·소재지(지번·도로명)·인허가일자·영업상태·폐업일자·욕실 수·발한실 여부·건물 층수 등을 포함한다. 주민이나 창업자가 '광진구에 지금 영업 중인 찜질방·목욕탕은 어디이고 언제 허가받았나'를 확인하거나, 분석가가 구내 목욕장 개폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 부문의 이미용·세탁업 등 다른 공중위생업소 인허가 데이터와 나란히 비교하는 데 쓴다.
description_portal: 서울특별시 광진구의 목욕장업 인허가 정보는 관내에서 대중목욕탕, 찜질방, 사우나 등 물 또는 열기(맥반석, 황토, 원적외선 등)를 이용해 목욕 또는 발한(땀 배출)을 목적으로 하는 시설의 영업 신고 및 허가 현황을 담은 데이터입니다. 해당 업소들은 일반 시민들이 위생적인 환경에서 휴식과 건강 관리를 할 수 있도록 다양한 설비를 갖추고 있으며, 각 업소에 대해 상호명, 소재지, 인허가 일자, 영업상태 등의 항목이 포함됩니다. 이는 공중위생관리법에 따라 등록된 공중위생영업소로 분류되며, 위생 점검이나 행정처분 대상에도 포함될 수 있는 관리 대상입니다.※ 위치정보는 중부원점TM(EPSG:2097) 좌표계로 제공되며, 위도/경도 정보는 포함되지 않습니다. 본 데이터는 기준일로부터 3일 전 시점의 자료입니다.
