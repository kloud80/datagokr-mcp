summary_user: 인천광역시 서구(서해구) 안의 숙박업·목욕장업 등 공중위생업소가 받은 행정처분을 업소 한 곳·처분 한 건 단위로 담은 파일로, 업종명·업소명·도로명 소재지·처분일자·처분구분·위반사항이 들어 있다. 주민이나 분석가가 "우리 동네 숙박업소·목욕탕 중 위생 위반으로 영업정지나 과태료를 받은 곳이 어디이고 무엇을 위반했나"를 확인하는 데 쓴다. 전역 조인 키가 없어 공중위생업 인허가 목록 등 다른 데이터와는 업소명·도로명주소를 맞춰 이어 써야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 숙박업소, 목욕장업소 등 공중위생업소에 대해 행정처분이 이루어진 내역을 담고 있습니다. 본 자료는 업소명, 업종명, 도로명주소, 행정처분일자, 처분구분, 위반사항 등이 포함되어 있습니다. 본 데이터를 통해 인천광역시 서구 내 공중위생업소의 위생관리 실태와 법령 준수 여부에 대한 실질적 자료로 활용이 되며, 위생 민원 대응, 업소 지도,점검, 정책 수립등에 기초자료로 제공될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
