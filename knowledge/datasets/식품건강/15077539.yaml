summary_user: 전국 식품소분업소(완제품 식품·식품첨가물을 나누어 재포장·판매하는 영업)의 폐업 정보를 업소 한 곳당 한 건으로 담으며, 인허가번호·업소명·대표자명·소재지 주소·허가일자·폐업일자·폐업구분·관할기관을 포함한다. 소분업 창업을 검토하는 사업자나 분석가가 "우리 지역에서 최근 문을 닫은 소분업소는 어디이고 영업 기간은 얼마였나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어, 같은 기관의 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 매핑으로 연결한다.
description_portal: 식품위생법에 따른 식품소분업소의 폐업 정보입니다.*총리령으로 정하는 식품 또는 식품첨가물의 완제품을 나누어 유통할 목적으로 재포장ㆍ판매하는 영업이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
