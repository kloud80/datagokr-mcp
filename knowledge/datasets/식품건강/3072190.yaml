summary_user: 부산광역시 기장군의 건강기능식품일반판매업소를 업소 한 곳당 한 행으로 담은 명단으로, 업소명과 도로명 소재지만 들어 있다(CSV 약 23KB, 2026년 3월 11일 기준 현행화). 주민이나 사업자가 기장군 안에서 건강기능식품을 파는 업소가 어디에 있는지, 특정 동네에 판매업소가 얼마나 몰려 있는지 확인할 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 기장군 건강기능식품판매업 중 건강기능식품일반판매업소 현황(업소명, 도로명 소재지)에 대한 파일입니다.건강기능식품에 관한 법률에 따른 건강기능식품일반판매업입니다.이 법은 건강기능식품의 안전성 확보 및 품질 향상과 건전한 유통ㆍ판매를 도모함으로써 국민의 건강 증진과 소비자 보호에 이바지함을 목적으로 한다.“건강기능식품”이란 인체에 유용한 기능성을 가진 원료나 성분을 사용하여 제조(가공을 포함한다. 이하 같다)한 식품을 말합니다.2026. 3. 11.자 기준으로 현행화하여 데이터를 공개합니다.
