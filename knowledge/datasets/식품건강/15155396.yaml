description_portal: 경기도 양평군 내 음식점 위생등급제 현황영업 중인 양평군 내 건강맛집 데이터를 제공합니다.(업종명, 업소명, 소재지, 전화번호 등)식품접객영업소의 위생 수준을 높이기 위하여 식품접객영업자의 신청을 받아 식품접객업소의 위생상태를 평가하여 위생등급을 지정한다.해당 평가는 기본분야, 일반분야, 공통분야로 나뉘며 기본분야인 필수사항에 대해 미총족시 평가불가하며 일반분야인 위생관련 분야의 평가항목의 점수와 공통분야인 가점항목의 점수를 더하여 최종 점수를 도출하여 점수에 따라 매우우수, 우수, 좋음으로 등급을 부여한다.위생등급 지정혜택으로 지정서 및 표지판을 제공하며 배달어플, 네이버플레이스에 정보제공되며 상시적 지도점검 면제 및 주방시설 청소비를 지원한다.업소 현황에 대해 자세한 사항은 식품안전나라 홈페이지에서 확인가능하며 타시군의 위생등급 지정업소 현황도 확인가능하다.https://www.foodsafetykorea.go.kr/
