summary_user: 서울특별시 종로구에 등록된 식육포장처리업 사업체의 인허가 정보를 업소 한 곳당 한 행으로 담은 원장으로, 인허가일자·취소일자, 영업상태와 폐업·휴업 일자, 소재지 주소, 사업장명, 좌표(X·Y)를 포함한다. 종로구에서 고기를 절단·포장해 유통하는 업체가 어디에 몇 곳 영업 중이고 언제 폐업했는지 확인하려는 위생감시 담당자나 상권·유통 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 지방자치단체코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 구·업종의 식품 인허가 데이터와 같은 형식으로 묶어 볼 때 쓴다.
description_portal: 본 데이터는 서울특별시 종로구에서 식육포장처리업을 운영하기 위해 등록된 사업체의 인허가 현황을 정리한 자료입니다. 수록 항목에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 「축산물 위생관리법」에 따라 식육을 위생적으로 절단·포장하여 유통하는 업체의 행정 처리 정보를 제공합니다. 해당 자료는 고기의 안전한 유통과 위생 기준 준수 여부를 파악하는 데 활용되며, 등록·폐업 현황, 영업상태의 변동 등을 체계적으로 관리하기 위한 기초정보로 제공됩니다. 또한 식육 유통질서 확립, 축산물 위생감시, 소비자 보호, 관련 정책 수립 등 행정 업무 전반에서 활용 가능하며, 지역 내 축산물 가공·유통 기반 현황 분석에도 참고자료로 쓰입니다.
