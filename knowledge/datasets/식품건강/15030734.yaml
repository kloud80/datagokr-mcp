summary_user: 경상북도 영주시 관내에서 영업 중인 식품 유통전문판매업·건강기능식품유통전문판매업 업소를 한 행에 한 곳씩 담은 건별 목록으로, 업종·업소명·도로명 주소·영업자·우편번호·전화번호를 담는다(포털 설명상 총 93개소). 사업자나 분석가가 '영주시에 자체 상표로 식품·건강기능식품을 유통하는 업체가 어디에 몇 곳 있는가'를 확인하거나 거래처를 찾을 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '경상북도 영주시 관내에서 현재 영업 중인 식품유통판매업체의 현황 자료입니다.업소명, 주소, 대표자명, 우편번호, 전화번호 등의 정보를 포함하며,공공데이터 및 관련 행정자료를 기반으로 수록하였습니다.식품 유통 및 판매 관련 업무, 통계 분석 등 다양한 행정목적으로 활용 가능합니다.1. 식품유통업체 정보○ 유통전문판매업 : 식품 또는 식품첨가물을 스스로 제조ㆍ가공하지 아니하고 제1호의 식품제조ㆍ가공업자 또는 제3호의 식품첨가물제조업자에게 의뢰하여 제조ㆍ가공한 식품 또는 식품첨가물을 자신의 상표로 유통ㆍ판매하는 영업○ 건강기능식품유통전문판매업 : 건강기능식품전문제조업자에게 의뢰하여 제조한 건강기능식품을 자신의 상표로 유통ㆍ판매하는 영업2. 업종별 현황: 유통전문판매업(77개), 건강기능식품유통전문판매업(13개)3. 총 개소수 : 93개소'
