summary_user: 마스크 제조·유통 업체의 회수 대상 제품을 제품 건별로 담은 전국 단위 비공간 데이터로, 필드 목록에는 제품명, 업체명, 위탁제조업체, 허가일자, 분류, 바코드, 효능·용법·주의사항, 저장방법, 유효기간, 포장단위 등이 들어 있습니다. 소비자나 약국·유통 사업자가 "지금 팔거나 쓰고 있는 이 마스크가 회수 대상인가"를 확인하는 데 쓰고, 분석가는 마스크 회수 현황과 품질 대응을 점검하는 데 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업체명·제품명 매핑으로 잇습니다. 연결 대상은 같은 식약처의 회수·판매중지·행정처분 데이터나 의약외품 허가 정보이며, 사업자등록번호로 보이는 필드(BIZRNO)가 있지만 조인 키로 검증되지는 않았습니다.
description_portal: 식품의약품안전처에서 제공하는 마스크 회수 제품 정보 데이터는 마스크 제조 및 유통 업체의 회수 대상 제품 현황을 조회할 수 있도록 구성된 공공데이터입니다. 주요 제공 항목으로는 제품명, 업체명, 회수사유, 제조번호(제조일자), 회수명령일자, 공개마감일자 등이 포함되어 있어, 어떤 제품이 왜 언제 회수되었는지를 명확히 확인할 수 있습니다. 이를 통해  마스크 회수 경위를 추적하고, 소비자에게 해당 정보를 알리거나 시장 감시, 품질 대응 현황 분석, 정책 평가 등을 위한 기초 자료로 활용할 수 있습니다.
