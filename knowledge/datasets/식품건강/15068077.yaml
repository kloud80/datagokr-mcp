summary_user: 인천광역시 서구(서해구)에서 나트륨줄이기 실천음식점으로 지정된 업소를 한 곳씩 업소명·지정연도·유형·소재지·전화번호로 담은 개별 업소 목록이며, 파일 크기가 864바이트로 소규모입니다. 주민이 우리 동네에서 저염 실천 음식점을 찾거나, 담당 부서·분석가가 지정 업소가 연도별·지역별로 어떻게 분포하는지 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어서, 식품 인허가 업소 원장 같은 다른 데이터와는 업소명과 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 나트륨 섭취 저감을 실천하는 음식점의 현황을 수록한 자료입니다. 본 자료는 인천광역시 서구 내 나트륨줄이기 실천음식점의 업소명, 지정연도, 유형, 소재지 등의 정보를 수록하고 있습니다. 본 데이터를 통해 건강식단 관련 정책 수립, 음식점 위생관리, 지역 건강지표 개선 등을 위한 기초자료도 활용할 수 있을것으로 판단이 됩니다. 또한 주민들에게는 건강한 식생활 선택을 위한 유용한 정보로 제공될 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
