summary_user: 전북특별자치도 정읍시에 있는 이용업소(이발소)를 업소 단위로 하나씩 담은 목록 파일로, 업소명·도로명주소·지번주소·전화번호와 데이터기준일자가 들어 있다. 시민이 "집 근처 이발소가 어디에 있고 전화번호가 무엇인가"를 찾거나, 창업자·분석가가 정읍시 안에서 이용업소가 어느 동네에 몰려 있는지 살필 때 쓴다. 전역 조인 키(인허가번호·행정코드 등)가 없어서 다른 데이터와는 주소나 업소명을 맞춰 붙여야 하고, 같은 정읍시가 낸 다른 공중위생업 현황과 나란히 놓고 쓰는 정도로 연결된다.
description_portal: 전북특별자치도 정읍시에서 제공하는 이용업 현황 중 업소명, 영업소도로명주소, 영업소지번주소, 전화번호의 정보를 제공합니다.정읍시 내 이용업 현황 데이터 개방하며 지역 내 상권 분석과 창업 지원 정책에 활용되어 경쟁 과밀을 방지하고, 시민들이 가까운 업소 정보를 쉽게 파악할 수 있게 합니다. 또한 정읍시 이용업 공공 위생 점검 체계 개선과 서비스 품질 향상 등 관련 정책 수행시에도 기여할 것으로 예상됩니다.기타 이용업 관련된 궁금한 사항은 담당부서인 정읍시 보건소로 문의하시기 바랍니다.
