summary_user: 서울 금천구 안의 유통전문판매업 업소를 인허가 건별로 담은 원장으로, 인허가일·폐업일, 영업상태, 사업장명, 지번·도로명 주소, 좌표, 위생업태, 종사자 수, 시설 규모, 보증금·월세 같은 항목을 포함한다. 금천구에서 현재 영업 중인 유통전문판매업체가 어디에 몇 곳 있고 언제 개업·폐업했는지 알아보려는 창업자나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)·관리번호로만 이어 쓰며, 좌표로 다른 시군구 식품 인허가 업소 데이터와 공간적으로 겹쳐 볼 수 있다.
description_portal: 금천구 내 유통전문판매업의 인허가 정보를 체계적으로 제공하는 데이터로, 인허가일자, 영업상태, 전화번호, 주소, 사업장명 등 기본 정보와 함께 위생업태, 종사자 수, 시설 규모, 임대 정보 등 다양한 세부 항목을 포함합니다. 이를 통해 유통전문판매업의 개업, 폐업, 휴업 등 행정 이력과 현재 업소 현황을 종합적으로 파악할 수 있습니다. 해당 자료는 유통업계 동향 분석, 관련 정책 수립, 연구, 창업 지원, 상권 분석 등 다양한 분야에서 활용 가능하며, 특히 시장 경쟁 구조 파악, 영업 환경 평가, 지역별 유통 인프라 현황 분석 등에 유용한 기초 자료로 기능합니다.
