summary_user: 학교 집단급식소 식중독 발생 시 식품의약품안전처가 보낸 식중독 조기경보(SMS) 전파 이력을 전파일자·대상구분·수신대상 수 단위로 담는 전국 범위 건별 기록이다. 급식 안전 분석가나 교육·보건 담당자가 언제 어떤 대상에게 몇 명 규모로 조기경보가 나갔는지, 경보 전파가 어느 시기에 몰렸는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 지역·업소 코드도 없어, 다른 식중독·행정처분 데이터와는 전파일자 같은 날짜나 대상구분 이름을 맞춰 느슨하게만 연결한다.
limits: 지역 정보가 없는 전국·비공간 데이터라 지역별 경보 현황이나 발생 학교·원인 식품은 알 수 없다. 경보가 나갈 때마다 생성되고 이후 바뀌지 않는 이벤트성 기록이라 정기 갱신 주기를 기대하면 안 된다. 조인 키가 없어 다른 데이터와는 이름·날짜 매핑으로만 이어 쓸 수 있다.
