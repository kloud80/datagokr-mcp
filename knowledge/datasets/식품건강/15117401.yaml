description_portal: 학교는 집단 급식 형태로 제한된 공간과 정해진 시간에 식품을 제공(섭취)함에 따라 식중독 발생 시 다수의 인원이 동시에 발생되어 대형 식중독으로 확대될 우려가 높고 납품받은 식재료에서 문제가 될 경우 다른 학교 또는 전국적으로 확산되어 발생될 수 있으므로 식중독과 관련된 철저한 관리와 주의 필요. 이에 학교 집단급식소 식중독 발생 시 신속 대응을 통한 확산방지와 식중독 예방 관리 강화를 위해 식품의약품안전처에서 보유한 식중독 조기경보(SMS) 전파 정보(전파일자, 대상구분, 수신대상 수)를 제공합니다.
