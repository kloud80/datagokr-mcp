summary_user: 전국 학교 위탁급식업체별로 계약 학교와 그 학교에 식재료를 납품하는 공급업체의 이름·업종·주소, 주요 식자재와 식품명을 건별로 담은 API 데이터다. 학교 급식에서 식중독이 났을 때 해당 식재료를 어느 공급업체가 납품했고 같은 업체가 다른 어느 학교에도 공급하는지 확인하는 데 쓴다. 전역 조인 키는 실측에서 찾지 못했으며, 학교코드·학교고유번호(SCOL_CD)나 학교명·주소, 공급업체명·사업자번호를 이름·코드 매핑해 학교 기본정보나 식품 인허가 업소 데이터와 잇는다.
description_portal: 학교는 집단 급식 형태로 제한된 공간과 정해진 시간에 식품을 제공(섭취)함에 따라 식중독 발생 시 다수의 인원이 동시에 발생되어 대형 식중독으로 확대될 우려가 높고 납품받은 식재료에서 문제가 될 경우 다른 학교 또는 전국적으로 확산되어 발생될 수 있으므로 식중독과 관련된 철저한 관리와 주의 필요. 이에 학교 집단급식소 식중독 발생 시 신속 대응을 통한 확산방지와 식중독 예방 관리 강화를 위해 식품의약품안전처에서 보유한 학교 위탁급식업체 식재료 공급업체 정보(위탁급식업체일련번호, 위탁급식업체직영여부, 위탁급식계약일련번호, 학교코드, 공급업체명, 공급업체업종, 공급업체주소, 주요식자재내용, 학교명, 학교주소, 학교고유번호, 식품명)를 제공합니다.
