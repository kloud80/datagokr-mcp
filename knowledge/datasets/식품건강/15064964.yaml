summary_user: 전국 식품모범음식점을 업소 단위로 담은 목록으로, 인허가번호·업소명·시군구·인허가연도·신청일자·주된 음식명·지정일자·작업일을 건별로 제공한다. 외식할 곳을 고르는 국민이나 분석가가 '우리 시군구에서 모범음식점으로 지정된 업소는 어디이고 주로 무슨 음식을 파는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았지만, 업소 인허가번호(LCNS_NO)로 같은 기관의 식품 인허가 업소 원장과 잇고, 시군구명·업소명은 이름 매핑으로 다른 위생 지정·행정처분 데이터와 맞춰 본다.
description_portal: 식품의약품안전처에서 제공하는 식품모범음식점 관련 정보 자료입니다. 식품모범음식점은 음식점 시설의 위생과 서비스 수준이 우수하고, 좋은 식단제 등으로 음식물쓰레기 줄이기에 앞장서는 업소를 말합니다. 인허가번호 , 업소명 , 시군구 , 인허가연도 , 신청일자 , 주된 음식명 , 지정일자 , 작업일에 대한 속성정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.
