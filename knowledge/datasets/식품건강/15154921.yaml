summary_user: 전국 지자체가 관리하는 휴게음식점 인허가 정보를 취합한 건별 원천 데이터로, 전체 648,609건에 인허가일자·영업상태·사업장명·주소·좌표 등을 담는다. 상권 분석가나 창업 준비자가 특정 지역에 휴게음식점이 얼마나 있고 영업 중인지 파악하는 질문에 쓴다. 지번주소·도로명주소(address)와 관리번호(MNG_NO, 키 pnu)로 다른 주소·필지 기반 데이터와 잇고, 같은 부문의 다른 식품 인허가 업소 데이터와 함께 본다.
description_portal: '식품_휴게음식점 데이터는 고속도로에 위치한 음식점 음주행위가 허용되지 아니하는 업소로 간단한 조리음식과 음료를 즐길 수 있는 업소 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 휴게음식점 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 식품안전정책과 / 043-719-2032 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
