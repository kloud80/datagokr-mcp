summary_user: 양산시 관내 식품제조·가공업소를 업소별로 한 행씩 담은 원천 목록 파일(CSV, 약 32KB)로, 업소명·전화번호·도로명 소재지와 제조하는 식품의 종류·유형을 담는다. 창업 예정자나 유통·납품 업체가 '양산시 어디에 어떤 식품을 만드는 제조업체가 있는가'를 확인하거나, 분석가가 지역 식품제조업 분포를 파악하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없어서, 다른 식품 인허가·위생 데이터와는 업소명이나 도로명 주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: '본 데이터는 양산시 위생과에서 관리하는 「식품제조가공업체 현황」 자료로, 양산시 관내 식품제조·가공 관련 업소의 기본 현황을 정리하여 제공합니다. 공공데이터 이용자는 본 자료를 통해 관내 해당 업소의 목록과 업체별 기본 정보(예: 업체명, 소재지 등)를 확인할 수 있습니다. 본 데이터는 행정기관이 보유·관리하는 자료를 기반으로 제공되며, 제공 항목 및 내용은 원자료의 관리 기준과 갱신 시점에 따라 달라질 수 있습니다. 데이터 출처는 양산시 위생과이며 데이터 기준일자는 2026년 1월 23일입니다.'
