summary_user: 인천광역시 서구 관내 기타식품판매업소(슈퍼마켓·로컬푸드 판매처·식자재 마트 등)를 업소 한 곳당 한 행으로 담은 목록 파일로, 업종명·업소명·도로명 주소·전화번호·데이터기준일자를 담는다. 서구에서 식료품 판매점이 어느 동네에 몰려 있는지 보려는 상권 분석가나 창업 예정자, 위생 점검 대상을 추리는 담당자가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명 주소를 맞춰 붙이거나, 주소를 지오코딩해 상권·인구 자료와 겹쳐 쓴다.
