summary_user: 인천광역시 서구 관내에서 위생 등 평가를 거쳐 모범음식점으로 지정된 일식 업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·유형·주메뉴·소재지·주차대수·전화번호가 들어 있으며 파일 크기가 291바이트에 불과해 업소 수는 몇 곳 수준이다. 시민이나 관광안내·맛집 앱 운영자가 '서구에서 위생 기준을 통과한 일식집은 어디이고 주차가 되는가'를 찾을 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·소재지 주소를 맞춰서만 이어 쓴다.
limits: 업소 인허가번호가 없어 인허가 원장·행정처분 데이터와 정확히 조인할 수 없고, 업소명·주소 문자열 매칭에 기대야 한다. 범위가 서구 한 시군구의 일식 분야로 한정되어 다른 업종이나 지역 모범음식점은 별도 파일을 찾아야 한다.
