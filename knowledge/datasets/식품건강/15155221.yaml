description_portal: '식품_건강기능식품일반판매업 데이터는 건강기능식품을 판매하는 업소정보(건강기능식품유통전문판매업에 해당되는 업소 제외) 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 건강기능식품일반판매업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 건강기능식품정책과 / 043-719-2452 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
