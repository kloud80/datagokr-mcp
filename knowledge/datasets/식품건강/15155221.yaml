summary_user: 전국 자치단체의 건강기능식품일반판매업 인허가 업소를 업소 한 곳씩 담은 건별 원천 데이터로, API 전체 443,474건에 사업장명·인허가일자·영업상태·주소·좌표가 들어 있다. 분석가나 사업자가 '이 지역에 건강기능식품 판매업소가 어디에 몇 곳 등록돼 있나'를 확인할 때 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)는 주소 키로, 관리번호(MNG_NO)는 pnu 키로 다른 인허가 업소 데이터나 지도·상권 데이터와 이어 쓴다.
limits: 필수 파라미터 cond[BASE_DATE::EQ]와 cond[OPN_ATMY_GRP_CD::EQ]는 다른 데이터의 코드를 먼저 받아 넘겨야 하고, /history 오퍼레이션은 최소 파라미터로 응답이 없었다. 검증에서는 443,474건 중 1,000행만 받았으므로 전량 수집에는 페이지를 444회 이상 반복해야 한다. 포털 설명상 영업장과 주거지 주소가 같은 경우 상세 주소(동·호수)는 비식별 처리되어 제공된다.
