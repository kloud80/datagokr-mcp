summary_user: 제주특별자치도가 시중에서 수거한 유통식품을 시료(시료번호)별로 한 행씩 담은 미생물 안전성 검사 결과 원천 파일로, 제품명·식품 중·소분류·제조원·수거장소와 황색포도상구균·장염비브리오 등 정량검사, 살모넬라·리스테리아 등 정성검사 결과, 적부 판정(판정)을 담는다. 소비자나 식품 분석가가 '제주에서 유통되는 특정 식품 유형이나 제조원의 제품에서 식중독균 부적합이 나온 적이 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 식품 인허가 업소·회수/판매중지 등 다른 식품안전 데이터와는 제품명·제조원 이름 매칭으로만 이어 쓴다.
description_portal: '제주특별자치도에서 관리하는 시중 유통식품 안정성 검사 결과 데이터를 제공합니다.항목: 제품명, 분류, 검사결과 (세균수 / 대장균 등)*검사방법가. 고위해성식중독균 :  정성검사만 실시나. 저위해성식중독균 : 정량검사만 실시 ※유의점 : ① 검체 수는 동일제품(유통기한등 동일로트) 1건당 5개씩 수거∙검사(검사건수=5)             ② 수거가 어려운 품목은 다른 중분류 품목으로 수거하여 검사             ③ "영아’를 섭취대상으로 하는 제품만 크로노박터 기준 적용하여 적부판정※ 섭취대상이 12개월미만이 포함된 경우 ‘영아용’ 제품에 해당하여 기준 적용자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1268'
