summary_user: 인천광역시 서구(서해구)에서 폐업한 식품접객업소를 업소 한 곳씩 담은 건별 목록으로, 업종명·업소명·소재지 주소·인허가일자·폐업일자를 담으며 주로 일반음식점이 대상이다. 상권 분석가나 창업 예정자가 '서구에서 최근 몇 년 사이 어떤 업종 음식점이 얼마나 문을 닫았고, 인허가부터 폐업까지 몇 년 버텼나'를 따질 때 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가 원장이나 영업 중 업소 목록과는 업소명·소재지 주소를 맞춰 이어야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 폐업한 식품접객업소의 현황을 담고 있습니다. 본 자료는 인천광역시 서구 내 폐업한 식품접객업소의 업종명, 업소명, 소재지, 인허가일자, 폐업일자 등 주요 정보를 포함하고 있습니다. 본 자료는 주로 일반음식점을 대상으로 하며, 폐업 시점까지의 행정정보가 정리되어 있어 상권 변화 등 다양한 분석에 활용됩니다. 해당 데이터는 인천광역시 서구 내 외식산업의 변동성을 파악하는데도 활용될 수 있습니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
