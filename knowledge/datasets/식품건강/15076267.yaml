summary_user: 성남시 안에서 인허가를 받은 위탁급식영업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 구·업종명·사업장명·인허가일자·영업상태·폐업일자·소재지 면적·지번/도로명 주소를 포함한다. 성남시 각 구에 현재 영업 중인 위탁급식업체가 몇 곳이고 언제 문을 열거나 닫았는지를 확인하려는 주민·급식 관련 사업자·위생행정 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어서, 다른 식품 인허가·위생 데이터와는 사업장명과 주소를 맞춰 보거나 같은 성남시 자료끼리 이어 쓴다.
description_portal: 성남시 위탁급식영업 현황 자료는 성남시 내에서 운영중인 위탁급식업체들의 정보를 정리한 자료입니다.이 자료는 구별, 업종명, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 면적, 주소 등의 항목을 포함하고 있습니다. 데이터는 연간주기로 업데이트되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당 자료는 지역별 급식업체 분포와 운영상태를 파악할 수 있으며 지역내 급식 서비스 개선과 위생관리 등의 기초 자료로 활용 할 수 있습니다.
