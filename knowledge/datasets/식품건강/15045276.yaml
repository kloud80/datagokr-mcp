summary_user: 경상남도 사천시 안의 공중위생업소(미용실·이발소·목욕장·숙박업 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호·데이터기준일자가 들어 있다. 시민이 "우리 동네 가까운 이발소나 목욕탕은 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 사천시 공중위생업 업종 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞추는 방식으로만 이어 쓰며, 같은 기관의 다른 인허가·위생 자료와 대조할 때도 이름·주소 매칭이 필요하다.
limits: 사천시 한 시군구만 다루므로 경남 전체나 다른 시군과 비교하려면 별도 자료가 필요하다. 업소를 식별하는 공통 코드(인허가번호 등)가 없어 다른 데이터와 정확히 연결하기 어렵고 이름·주소 매칭 오류에 주의해야 한다.
