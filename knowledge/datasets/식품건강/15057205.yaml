summary_user: 우리 농산물을 활용한 요리를 레시피 한 건 단위로 담으며, 요리명·간단 소개·국가(한식 등)·요리 유형·조리 시간·칼로리·인분 수·난이도·주재료 구분·가격대 등 기본정보를 제공한다. 오늘 저녁 30분 안에 만들 수 있는 쉬운 한식 반찬을 찾으려는 국민이나, 식단·요리 교육 콘텐츠를 만드는 사업자가 조리 시간과 난이도로 레시피를 고르는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 기관 데이터와는 요리명 매핑으로만 잇고, 같은 기관의 레시피 재료정보·과정정보와는 레시피 ID(RECIPE_ID)로 연결해 쓴다.
description_portal: 농림수산식품교육문화정보원에서 제공하는 본 API는 우리 농산물을 활용하여 만든 다양한 요리 정보를 제공합니다. 주된 구성 요소로는 요리 기본정보, 레시피 및 주요 재료 정보가 포함되어 있으며, 이를 통해 사용자들은 보다 체계적이고 상세한 요리레시피를 찾아볼 수 있습니다. 이 데이터는 요리 연구 및 교육, 식문화 확산, 그리고 건강한 먹거리 제공 등 다양한 분야에서 활용될 수 있습니다. 특히, 이 API의 주요 기능 중 하나인 '레시피 기본정보 조회'를 통해 사용자는 요리의 이름, 조리 시간, 난이도, 인분 수, 칼로리, 요리 분류 등의 기초 정보를 손쉽게 조회할 수 있습니다. 따라서, 요리 선택과 계획을 수립하는 데 큰 도움이 됩니다.
