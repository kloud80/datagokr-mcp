summary_user: 파주시 이용·미용업소를 업소 한 곳씩 담은 파일로, 업종(네일·피부·종합·일반미용업, 이용업 등), 업소명, 도로명·지번 주소, 위도·경도를 시군구 범위에서 개별 주소·좌표 단위로 제공한다. 파주시에서 특정 동네에 네일숍이나 미용실이 얼마나 몰려 있는지, 새로 가게를 낼 자리 주변 경쟁 업소가 어디 있는지를 확인하려는 사업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 위도·경도 기반 공간 결합으로만 이어 쓴다.
