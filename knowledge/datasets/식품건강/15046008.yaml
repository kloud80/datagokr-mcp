description_portal: 서울시 식품위생업소 현황 데이터는 서울시에 허가·신고된 각종 식품위생 관련 업소의 기본 정보, 영업 현황, 시설 규모, 위생관리 상태 등을 종합적으로 파악하기 위한 자료입니다. 시군구코드, 업종코드, 업종명, 업소일련번호, 업소명, 허가신고일, 영업자시작일, 법인명 및 법인번호, 행정동명, 폐업일자와 폐업구분·사유 등 행정 정보를 포함합니다. 또한 소재지 도로명·지번 주소, 영업장 전체 및 조리장·객실·무도장·기타 면적, 화장실·탈의실·객석·작업장·검사실·창고 면적 등 세부 시설 정보를 제공하며, 모범음식점 여부, 급수시설, 업소위치, 종업원 수, 급식소 종류와 급식 인원, 일인당 평균 급식비, 운영형태, 조건부허가 기간, 내외국인 구분 및 국적 등도 함께 수록되어 있습니다. 이를 통해 자치구·업종별 식품위생업소 분포와 영업 및 폐업 추세, 규모 및 설비 수준, 급식 및 위생관리 여건을 분석할 수 있어, 식품 안전 관리, 영업 환경 개선, 관련 정책 수립에 활용 가능한 핵심 기초자료입니다.
