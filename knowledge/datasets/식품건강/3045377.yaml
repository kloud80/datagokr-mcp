summary_user: 인천광역시 영종구(옛 중구 영종도 지역 담당)의 일반음식점·휴게음식점·제과점 등 식품위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호로 구성된다. 창업 예정자나 상권 분석가가 '영종도 안에 어떤 업종의 식당·식품업소가 어느 도로변에 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 업소명·주소 문자열을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: '식품위생업소 데이터는 일반음식점, 휴게음식점, 제과점 등 식품을 취급·판매하는 업소의 정보를 수록한 자료로, 업소명, 소재지  등 다양한 항목으로 구성되어 있습니다. 이 데이터는 식품위생관리 및 안전 감독, 지역 내 업소 분포 분석, 소비자 정보 제공, 식중독 예방 정책 수립 등 공공보건 및 식품 안전 관리에 활용됩니다. 또한 창업 수요 분석이나 상권 비교 등 민간에서도 유용하게 활용할 수 있는 기반 자료입니다.전화번호 항목은 개인정보 포함 및 미등록 정보로 일부 데이터값을 공란처리하였습니다.담당부서: 인천광역시 중구청 위생환경과(제1청사 원도심), 친환경위생과(제2청사 영종도)'
