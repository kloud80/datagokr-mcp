summary_user: 경기도 31개 시군에 있는 패스트푸드형 휴게음식점의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·폐업일자·영업상태·도로명/지번 주소·종사자 수·시설규모·위경도가 들어 있다. 예비 창업자나 상권 분석가가 '이 시군에서 영업 중인 패스트푸드점이 몇 곳이고 어디에 몰려 있나'를 따지거나, 폐업일자로 매장 개폐 흐름을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 다른 식품 인허가 업소 데이터나 지역 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군에 소재한 패스트푸드 형태의 휴게음식점에 대한 인허가 정보를 담고 있습니다. 주요 항목으로는 사업장명, 인허가일자, 폐업일자, 영업상태, 소재지 정보(도로명·지번·우편번호), 위생업종·업태명, 급수시설, 종사자 수(남녀 구분 포함), 총 시설규모, 위도·경도 등이 포함됩니다. 본 데이터는 롯데리아, 맥도날드, 버거킹, 맘스터치 등 주요 프랜차이즈 외에도 다양한 즉석조리 음식점이 포함되며, 음식 조리는 가능하나 음주는 제한됩니다. 해당 데이터는 매장 분포 파악, 상권 분석, 프랜차이즈 확장 전략, 공공위생 모니터링 등 다양한 목적으로 활용 가능합니다.
