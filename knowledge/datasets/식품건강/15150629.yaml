summary_user: 식품의약품안전처가 제공하는 식품판매업 행정처분 결과를 처분 건별로 담으며, 업소명·업종·인허가번호·주소·대표자, 위반일자와 위반내용, 처분유형·처분내용, 처분 확정·시작·종료일, 처분기관을 포함하고 범위는 전국이다. 소비자나 거래처를 고르는 사업자, 분석가가 '이 식품판매 업소가 언제 무슨 위반으로 영업정지나 과태료 등의 처분을 받았나' 같은 업소별 처분 이력을 확인하는 데 쓴다. 전역 조인 키는 없어서 같은 식품의약안전 부문의 식품 인허가 업소 데이터와는 인허가번호(LCPMT_NO)나 업소명·주소 매핑으로만 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 행정처분결과(식품판매업) 정보입니다.
