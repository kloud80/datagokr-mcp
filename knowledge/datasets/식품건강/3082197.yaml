summary_user: 부산광역시 연제구에 있는 건강기능식품 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지가 들어 있습니다(CSV 약 45KB). 연제구에서 건강기능식품을 파는 곳이 어디에 몇 곳 있는지 확인하려는 주민이나, 동네 상권에서 같은 업종 경쟁 점포를 살펴보려는 사업자가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '1. 건강기능식품제조업가. 건강기능식품전문제조업 : 건강기능식품을 전문적으로 제조하는 영업나. 건강기능식품벤처제조업 : 「벤처기업육성에 관한 특별법」 제2조에 따른 벤처기업이 건강기능식품을 가목의 건강기능식품전문제조업자에게 위탁하여 제조하는 영업2. 삭제 <2016. 1. 22.>3. 건강기능식품판매업가. 건강기능식품일반판매업: 건강기능식품을 판매하는 영업. 다만, 나목에 따른 건강기능식품유통전문판매업에 해당하는 것은 제외한다.나. 건강기능식품유통전문판매업 : 제1호가목의 건강기능식품전문제조업자에게 의뢰하여 제조한 건강기능식품을 자신의 상표로 유통ㆍ판매하는 영업4. 맞춤형건강기능식품판매업: 맞춤형건강기능식품(위탁하여 소분ㆍ조합한 건강기능식품을 포함한다)을 판매하는 영업'
