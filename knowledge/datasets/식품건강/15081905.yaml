summary_user: 세종특별자치시에 신고된 일반음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 소재지·전화번호가 들어 있습니다. 창업 예정자나 상권 분석가가 '조치원읍이나 금남면에 일반음식점이 얼마나 몰려 있는가'처럼 읍·면·동별 음식점 분포를 볼 때 쓴다. 인허가번호·사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 식품 인허가 데이터와는 업소명과 주소 문자열 매칭으로 이어 쓴다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못했다. 그래서 위생등급·행정처분 같은 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 세종시 한 곳의 개별 업소 주소 단위이며, 좌표가 없어 지도화하려면 주소를 따로 지오코딩해야 한다.
