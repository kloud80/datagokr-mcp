description_portal: 세종특별자치시 관내에 소재한 일반음식점 관련한 업소명, 소재지(도로명&지번), 전화번호에 대한 데이터로  관련 정보를 제공합니다.세종특별자치시에 신고된 일반음식점 전체수는 3,903개소이며, 조치원읍 소재의 세종식당, 더비, 맛샘식당, 조치원집, 한방족발 곰나루 등이 있으며금남면 소재의 고기먹자, 춘화식당 등이 있으며, 연동면에는 부민식당, 충남식당, 장수마을, 내판불짬뽕 등이 있습니다.이자료는 세종특별자치시 보건정책과에서 제공하는 자료이며, 1년 주기로 업데이트 될 예정입니다.
