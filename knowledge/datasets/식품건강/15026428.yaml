summary_user: '부산 수영구에 있는 식품판매 계열 영업소(즉석판매제조가공업, 식품소분업, 식용얼음판매업, 기타식품판매업, 유통전문판매업, 식품운반업, 집단급식소 식품판매업, 식품자동판매기영업)를 업소 한 곳당 한 줄로 담은 현황 파일이며, 업종·업소명·도로명/지번 주소·전화번호가 들어 있다. 수영구에서 특정 업종(예: 즉석판매제조가공업) 업소가 어느 동네에 몇 곳 있는지 확인하거나, 주민·사업자가 인근 식품판매업소의 연락처와 주소를 찾는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키는 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 대조하는 방식으로만 이어 쓴다.'
limits: 전역 조인 키가 없어 다른 데이터와 정확히 1:1로 연결되지 않고, 이름·주소 매칭에 기대야 한다. 범위는 수영구 한 곳에 한정되며, 좌표 필드가 없어 지도에 표시하려면 주소를 따로 좌표로 변환해야 한다.
