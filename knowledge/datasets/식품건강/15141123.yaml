summary_user: 서울 은평구에 사업장을 두고 자체 제조시설 없이 위탁생산 식품을 자기 상표로 유통하는 유통전문판매업소의 인허가를 업소 한 곳당 한 행으로 담는다(관리번호, 인허가일, 영업상태, 폐업일, 주소, 중부원점TM 좌표 등). 소비자가 "이 PB·온라인 브랜드 식품을 판매하는 업체가 은평구에 정식 신고돼 있고 지금도 영업 중인가"를 확인하거나, 분석가가 구내 유통전문판매업체의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가·위생 지정·행정처분 데이터와는 상호명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)·관리번호로만 이어 붙인다.
description_portal: '은평구의 직접 제조하지 않고 식가공류 제공을 위해 판매업소에 유통하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구에 사업장을 두고, 자체 제조시설 없이 위탁생산(OEM)을 통해 자신의 상표(브랜드)로 식품이나 건강기능식품을 유통·판매하는 업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같은 식품 안전 및 유통 관리의 핵심 정보가 포함되어 있습니다 .이 데이터는 대기업의 PB(Private Brand) 상품부터 온라인 쇼핑몰, 인플루언서 기반의 소규모 브랜드까지, 제조가 아닌 브랜딩과 마케팅에 집중하는 현대 유통 산업의 핵심적인 단면을 보여줍니다 . 소비자는 이 정보를 통해 제품을 판매하는 브랜드의 실체를 확인하고, 문제가 발생했을 때 책임을 물을 수 있는 주체를 명확히 알 수 있습니다. 지자체는 이를 기반으로 최종 판매 브랜드에 대한 관리·감독을 통해 식품의 안전성과 추적성을 확보하고, 건전한 유통 질서를 확립하는 데 필수적인 기초 자료로 활용합니다 .'
