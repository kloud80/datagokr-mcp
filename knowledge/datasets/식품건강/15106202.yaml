summary_user: 경기도 포천시 관내에서 군 장병에게 할인을 제공하는 업소를 업소 한 곳당 한 줄로 담은 목록으로, 상호명·업종·사업장 주소·전화번호·주메뉴·할인내용·할인범위와 데이터기준일이 들어 있으며 CSV 파일(약 20KB)로 활용신청 없이 받는다. 포천 인근 부대의 장병이나 면회 온 가족이 '외출·외박 때 할인받을 수 있는 식당은 어디이고 할인 폭은 얼마인가'를 찾을 때 쓰고, 지역 상권의 장병 대상 할인 참여 현황을 살필 때도 참고한다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 상호명과 사업장 주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 경기도 포천시에서 제공하는 군장병 할인업소 현황 데이터입니다. 본 데이터는 포천시 관내에서 군 장병을 대상으로 할인 혜택을 제공하는 업소들의 정보를 수록한 자료로, 상호명, 업종, 사업장 주소, 전화번호, 주메뉴, 할인내용 등의 항목으로 구성되어 있습니다.해당 데이터는 지역 내 군장병 할인 참여 업소의 위치와 혜택 내용을 확인하는 데 활용될 수 있습니다. 특히 장병과 가족들은 이 데이터를 통해 할인 가능한 업소를 미리 찾아볼 수 있고, 음식점이나 상점 선택 시 혜택 정보를 비교하여 합리적인 소비 활동을 할 수 있습니다. 아울러 지역 상권의 장병 대상 서비스 현황을 파악하는 데에도 참고자료로 활용될 수 있습니다.
