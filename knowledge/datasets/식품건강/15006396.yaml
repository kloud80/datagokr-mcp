summary_user: 대구광역시 북구에 영업신고된 집단급식소(학교·유치원·사회복지시설·병원·산업체 등)를 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·데이터기준일자만 들어 있다. 북구 주민이나 분석가가 '우리 동네에 신고된 학교·병원 급식소가 어디에 몇 곳 있나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 식품 인허가·위생 데이터와는 업소명이나 도로명주소를 맞춰 이어야 한다.
description_portal: 'ㅇ데이터기준일자까지 관할 기관인 대구광역시 북구에 영업신고가 되어 있으며  대구광역시 북구 내에 위치한 집단급식소의 현황을 파일로(업종명, 업소명, 소재지(도로명주소), 데이터 기준일자로 구분하여) 정보를 제공합니다.*집단급식소: 영리를 목적으로 하지 아니하면서 특정 다수인에게 계속하여 음식물을 공급하는 학교, 우치원, 어린이집, 병원 등의 시설을 말합니다.1. 업종명: 집단급식소, 업소명: 집단급식소 명칭, 소재지: 도로명주소입니다.2. 집단급식소: 학교, 유치원, 사회복지시설, 병원, 산업체 등이 있습니다.'
