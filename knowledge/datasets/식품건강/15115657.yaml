summary_user: 서울특별시 중랑구에 있는 소독업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표와 사무실 면적, 분무기·방독면·보호복 같은 소독 장비 보유 수량을 함께 담는다. 중랑구 주민이나 관리사무소가 "우리 동네에서 지금 영업 중인 소독업체가 어디인가"를 찾을 때, 또는 분석가가 자치구별 소독업 개·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 좌표는 EPSG:5174를 위경도로 변환해야 지도 데이터와 겹칠 수 있다.
description_portal: '서울특별시 중랑구의 전염병 및 각종 세균이나 유해 해충의 소독을 목적으로 만들어진 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
