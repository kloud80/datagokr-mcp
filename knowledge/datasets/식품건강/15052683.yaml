description_portal: '- 전라남도 내에 존재하는 일반음식점 현황 정보로 업소 명, 업종, 업소 주소지 정보(층 수도 포함) 등을 제공하고 있습니다.- 전라남도 시·군 전체에는 수천 곳의 일반음식점이 운영 중입니다. 대표 사례로 순천시의 일반음식점 데이터가 공공데이터포털에 등록되어 있으며, 영암군만 해도 업소 리스트가 여러 곳 확인됩니다.- 영암군 : 삼호읍 일대에는 한식당부터 분식, 치킨, 뷔페, 고깃집, 찜·탕 전문점 등 다양한 일반음식점이 운영 중임이 확인됩니다.- 장성군 : 호남고속도로 백양사휴게소 내 일반음식점 "삼채비빔밥" 등 모범업소 지정 사례도 존재합니다.'
