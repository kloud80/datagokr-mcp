summary_user: 서울 마포구 관내 단란주점(주류와 음식을 팔며 손님 노래가 허용되는 업소)의 인허가 원장으로, 업소 한 곳당 한 행에 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 담는다. 주민이나 상권 분석가가 '마포구에서 지금 영업 중인 단란주점은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관의 개방자치단체코드로만 연결한다.
description_portal: '서울특별시 마포구의 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 손님이 노래를 부르는 행위가 허용되는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민과 행정기관은 관내 단란주점의 위치, 영업 현황과 서비스 내용을 신속히 파악할 수 있으며, 업소 관리의 투명성 확보와 안전한 환경 조성에 기여할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
