summary_user: 강원특별자치도 정선군에 신고된 식품위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·업태, 인허가일자, 영업자시작일, 도로명·지번 소재지를 포함하며 포털 설명 기준 2025년 8월 25일 시점 1,738건이다. 정선군에서 특정 업종(일반음식점, 즉석판매제조가공업, 집단급식소 등)의 업소가 어디에 몇 곳 있는지 확인하려는 주민·창업자·상권 분석가가 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 업소명과 주소를 맞대어 잇거나 같은 정선군 자료끼리 연결한다.
description_portal: 강원특별자치도 정선군 식품위생업소 업소명, 소재지 등의 현황입니다.2025년 8월 25일 시점의 강원특별자치도 정선군 식품위생업소 현황을 제공하는 데이터입니다.강원특별자치도 정선군 행정시스템 내 식품위생업소조회에서 신고된 식품위생업소 전체를 제공하고 있으며데이터 내 기재 정보는 업종명, 인허가일자, 업소명, 소재지(도로명), 소재지(지번),영업자시작일, 업태명,데이터기준일자입니다.데이터 갱신은 매년 실시하며 현재 데이터 제공일 기준 일반음식점, 휴게음식점, 제조가공업소, 즉석판매제조가공업, 집단급식소, 기타식품판매업, 유통전문판매업 등 식품위생 관련 모든 업종을 포함하고 있으며 총 1738건의 신고 현황을 제공하고 있습니다.데이터 기준일 이후 신규업체의 발생으로 데이터와 추후 현황이 상이할 수 있음을 알려드립니다.강원특별자치도 정선군 일반음식점 현황을 포함하고 있으며, 일반음식점 현황만 필요시 강원특별자치도 정선군 일반음식점 현황 자료를 확인하시면 됩니다.
