summary_user: 부산광역시 사상구에 영업신고된 건강기능식품판매업소(일반판매업·유통전문판매업)를 업소 한 곳당 한 행으로 담은 원장 파일로, 업종명·업소명·도로명 소재지·전화번호로 구성되며 CSV 약 30KB 규모다. 사상구 주민이 동네 건강기능식품 판매점을 찾거나, 사업자·분석가가 사상구 안에서 건강기능식품 판매업소가 어느 동네에 몰려 있는지 파악하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 업소 데이터와는 업소명·도로명 주소를 맞춰 보거나 주소를 좌표로 변환해 이어 쓴다.
description_portal: '해당 자료는 부산광역시 사상구에 영업신고된 건강기능식품판매업(건강기능식품일반판매업, 건강기능식품유통전문판매업) 현황에 대한 정보를 제공합니다.업소에 대한 기본정보(업종명, 업소명, 소재지주소, 업소전화번호)로 구성된 데이터입니다.*건강기능식품일반판매업: 건강기능식품을 판매하는 영업. 다만, 건강기능식품유통전문판매업에 해당하는 것은 제외한다.*건강기능식품유통전문판매업: 건강기능식품전문제조업자에게 의뢰하여 제조한 건강기능식품을 자신의 상표로 유통ㆍ판매하는 영업'
