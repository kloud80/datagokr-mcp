summary_user: 서울특별시 광진구 관내 식육포장처리업 인허가 업소를 한 업소당 한 행으로 담은 건별 원장으로, 업소명·소재지 주소·인허가일자·영업상태·폐업일자·중부원점TM 좌표(X, Y)를 포함한다. 광진구에서 지금 영업 중인 식육포장처리업소가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지를 확인하려는 주민·축산물 유통 사업자·위생 점검 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 자치구나 다른 식품 업종 인허가 데이터와 합칠 때도 이 방식을 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 식육포장처리업 인허가를 받아 운영 중인 업소의 현황 정보를 제공합니다. 식육포장처리업은 소고기, 돼지고기, 양고기 등의 식육을 판매 목적으로 절단한 뒤 위생적으로 포장하여 공급하는 업종으로, 육류 가공 전 단계에서 이뤄지는 처리업에 해당합니다. 본 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등 관련 인허가 정보가 포함되어 있으며, 식육의 위생관리, 원산지 표시제도 운영, 식중독 예방, 축산물 유통안전관리 등의 공공행정 및 민간 유통 체계 분석에 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 제공되지 않으므로 지도 시스템 활용 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신되며, 광진구 내 축산물 가공 유통업소 관리 및 위생 지도 점검 기반 자료로 활용됩니다.
