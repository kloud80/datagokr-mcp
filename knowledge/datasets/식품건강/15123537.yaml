summary_user: 경산시 관내에 등록된 휴게음식점 가운데 카페 업종 업소를 한 곳당 한 행으로 담은 파일로, 업종명·업태명·업소명과 도로명·지번 소재지가 들어 있다(CSV 약 59KB). 창업 예정자나 상권 분석가가 '경산시 어느 동네에 카페가 몰려 있고 어디가 비어 있는가'를 주소 기준으로 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·코드)가 없어서, 다른 식품 인허가 데이터와는 업소명·주소 문자열을 맞춰 보거나 주소를 지오코딩해 행정동·좌표로 바꾼 뒤에 연결한다.
