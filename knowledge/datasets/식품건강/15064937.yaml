summary_user: 식품 업소별로 위생관리 평가유형, 평가등급, 평가일자를 업소명·인허가번호와 함께 담은 전국 단위의 건별 목록이다. 외식업체를 고르는 국민이나 분석가가 '이 업소는 어떤 위생 평가에서 몇 등급을 언제 받았나'를 확인하는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으나, 검토 결정에 따라 인허가번호(LCNS_NO)로 같은 식약처의 식품 인허가 업소 원장과 잇고, 그 밖의 데이터와는 업소명 매핑으로 연결한다.
description_portal: 위생관리등급별 업소 현황 관련 정보로 위생관리 등급별 업소에 대한 속성정보를 제공합니다. 속성정보로는 인허가번호 , 업소명 , 평가유형 , 평가등급 , 평가일자가 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
