description_portal: 경기도 수원시에서 제공하는 비건메뉴 취급업소 현황(업소명, 업종, 구, 동, 소재지주소, 위도, 경도, 전화번호, 식당구분 등) 데이터 입니다.○ 비건 메뉴란?동물성 식재료(육류, 어류, 유제품, 계란, 벌꿀 등)를 포함하지 않은 식단입니다.○ 기대효과1.  소비자 정보 제공 및 선택권 보장• 채식주의자, 비건, 알레르기 민감 소비자 등이 식당을 쉽게 찾도록 지원• 건강, 윤리, 종교적 이유로 비건식을 찾는 이들의 식문화 접근성 향상2. 친환경 식생활 확산• 식물성 식단 소비를 장려하여 온실가스 감축 및 지속가능한 식생활 촉진• 저탄소 식생활 캠페인과 연계 가능3. 외식산업의 다양성과 혁신 촉진• 다양한 식단 수요에 대응하는 외식업소 발굴 및 홍보• 비건 메뉴 개발 촉진 및 메뉴 표준화 기반 제공4. 관광 활성화 및 K-채식문화 확산• 외국인 관광객 대상 비건 관광 콘텐츠 제공 (특히 유럽·북미 대상)• 지역 비건 맛집, 축제, 푸드맵 등으로 연결 가능○ 더 많은 비건 업소 정보는 수원시 홈페이지에서 확인하실 수 있습니다.
