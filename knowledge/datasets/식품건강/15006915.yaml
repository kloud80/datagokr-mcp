summary_user: 충청북도 증평군 안의 공중위생업소(숙박·목욕장·세탁·이용·미용·건물위생관리 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·소재지 전화·데이터기준일이 들어 있다. 주민이나 분석가가 '증평군에 미용실이나 세탁소가 어디에 몇 곳 있고 연락처는 무엇인가'를 확인하거나, 업종별 분포를 보고 위생 점검 대상을 고르는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매칭이나 같은 기관 코드로만 잇는다.
