summary_user: 유전자변형생물체(LMO) 수입승인 건별로 승인번호·승인일자, 수입 업소명과 주소, 작물의 보통명·계통명·학명, 용도, 수입국을 담는 전국 단위 비공간 데이터다. 특정 GMO 작물 계통이 언제 어느 업체에 어떤 용도로 수입 승인됐는지, 어느 나라에서 들어오는지 확인하려는 소비자·수입업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 수입식품이나 식품 인허가 업소 데이터와는 업소명(BSSH_NM)·주소 같은 이름 매핑으로만 연결한다.
description_portal: 유전자변형생물체(LMO) 승인번호 , 승인일자 , 업소명 , 주소 , 보통명 , 계통명 , 학명 , 용도 , 수입국 등 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
