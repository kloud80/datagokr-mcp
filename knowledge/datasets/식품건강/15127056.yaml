summary_user: 강원특별자치도 내 집단급식소 위탁급식 영업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 45KB)로, 업소명·업종·업태·지번/도로명 주소·전화번호·신고(허가)일을 담는다. 위탁급식업체를 찾는 학교·병원·산업체 급식 담당자나 분석가가 "강원도 어느 시군에 위탁급식 업체가 있고 언제부터 영업했나"를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 강원특별자치도의 집단급식소 위탁급식에 대한 현황 데이터로 업소명, 업종, 업태, 지번주소, 도로명 주소, 전화번호, 신고 및 허기일을 제공합니다.집단급식소란 식품위생법 제2조제12호에 영리를 목적으로 하지 아니하면서 특정 다수인에게 계속하여 음식물을 공급하는 급식시설로서 기숙사, 학교, 유치원, 어린이집, 병원, 사회복지시설, 산업체, 공공기관, 그 밖의 후생기관을 말합니다. 집단급식소의 범위는 1회 50명 이상에게 식사를 제공하는 급식소를 말합니다. 위탁급식업이란 집단급식소를 설치 운영하는 자와의 계약에 의하여 집단급식소 내에서 음식류를 조리하여 제공하는 영업을 말합니다.
