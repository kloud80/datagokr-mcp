summary_user: 인천광역시 미추홀구에 있는 집단급식소 식품판매업 업소를 한 곳당 한 행으로 담은 목록으로, 업종명·업소명·도로명/지번 소재지·전화번호가 들어 있다(약 2KB 분량의 작은 CSV). 미추홀구에서 어린이집·학교·기업 급식소에 식재료를 납품하는 판매업체가 어디에 있고 연락처가 무엇인지 찾는 급식 운영자나 사업자, 또는 구 단위로 업소 분포를 보는 분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서 다른 인허가·행정처분 데이터와는 업소명과 주소를 맞추는 방식으로만 이어 쓸 수 있다.
