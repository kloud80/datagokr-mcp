summary_user: 인천광역시 미추홀구에 등록된 집단급식소(1회 50명 이상에게 식사를 제공하는 급식소)를 업소 한 곳당 한 행으로 담은 파일이며, 업종명·업소명·도로명 주소·지번 주소로 구성된다. 구청 위생 담당자나 분석가가 "미추홀구 안 어느 동네에 학교·산업체·보육시설 급식소가 몰려 있어 위생 점검 대상이 되는가"를 확인하는 데 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어서 다른 식품 인허가·행정처분 데이터와는 업소명과 주소 문자열을 맞춰 연결해야 한다.
description_portal: 본 데이터는 인천광역시 미추홀구에 위치한 집단급식소(「식품위생법 시행규칙」 제2조에 따른 1회 50명 이상에게 식사를 제공하는 급식소) 등록 업소 현황을 수록한 자료입니다. 해당 데이터는 급식 대상자 규모가 큰 보육원, 학교, 산업체, 공공기관 등 단체급식소의 위생 관리 및 운영 실태를 파악하는 데 활용되며, 업소명, 도로명 주소, 지번 주소 등으로 구성되어 있습니다. 각 업소는 ‘집단급식소’로 업종이 구분되어 있고, 도로명주소와 지번주소가 병기되어 있어 위치 기반 분석 및 행정 연계 자료로 유용합니다. 본 자료는 식중독 예방, 위생 점검 대상 파악, 단체급식소 운영 실태 조사 등 공공 보건 분야에서 다양하게 활용되며, 민간에서도 급식 서비스 제공 현황 파악 및 공급망 관리 기초자료로 활용됩니다. 데이터는 현행화 기준에 따라 주기적으로 갱신되며, 정확한 정보 제공을 통해 지역 내 위생 안전 확보에 기여합니다. 자세한 문의사항은 032-880-5740으로 주시기 바랍니다.
