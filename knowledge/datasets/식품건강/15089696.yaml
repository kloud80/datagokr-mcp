summary_user: 인천광역시 서해구(포털 설명상 서구) 관내 휴게음식점의 신고 현황을 업소 한 곳당 한 행으로 담은 CSV 파일로, 업소명·인허가일자·도로명/지번 주소·전화·세부업종·면적이 들어 있다. 동네 커피전문점·제과점 같은 휴게음식점이 어디에 얼마나 몰려 있는지, 언제 문을 열었는지를 보려는 창업 준비자·상권 분석가·위생 점검 담당자가 쓴다. 인허가번호나 좌표 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 이어 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 휴게음식점의 신고 현황을 정리한 자료입니다. 본 자료는 인천광역시 서구 내 휴게음식점의 업소명, 주소, 허가일자 등으로 구성이 되어 있습니다. 본 데이터를 통해 커피전문점, 제과점 등 다양한 음식점 분포를 파악할 수 있으며, 이를 통해 식품위생 지도,점검 또는 지역 상권 분석 등 다양한 행정 및 정책적 활용이 가능할것으로 판단이 됩니다. 또한 위생행정의 기초자료로도 활용가능할것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
