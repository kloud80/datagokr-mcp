summary_user: 대전광역시 동구에 있는 식육판매업소를 한 곳당 한 행으로 담은 업소 목록 파일(CSV, 약 17KB)로, 업종·업소명·지번/도로명 주소·전화번호·기준일을 담는다. 동구 주민이 집 근처 정육점 위치와 연락처를 찾거나, 분석가·행정 담당자가 동네별 식육판매업소 분포를 보고 상권 분석이나 위생 점검 대상을 정할 때 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키는 없어서, 다른 식품 인허가 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대전광역시 동구 내 식육판매업소의 기본 정보를 체계적으로 제공하기 위해 구축된 데이터로, 업종명, 업소명, 주소, 전화번호 등 상세 항목을 포함하고 있습니다. 이 데이터는 축산물 유통 경로를 파악하고 위생 관리 및 식품 안전 대책 수립에 중요한 기초 자료로 활용될 수 있습니다. 또한 소비자들은 생활권 내 식육판매업소 위치와 정보를 손쉽게 확인할 수 있어 안전하고 편리한 식품 구매에 도움을 받습니다. 더불어 상권 분석, 정책 수립, 행정 지도점검, 소비자 보호 등 다양한 분야에서 활용도가 높아 지역 식품 안전과 건강 증진에 기여하는 중요한 공공데이터입니다.
