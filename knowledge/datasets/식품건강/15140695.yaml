summary_user: 광진구 안에서 식육·계란·원유 등 축산물을 원료로 소시지·유제품 등을 만드는 축산가공업 업소의 인허가 현황을 업소 한 곳당 한 행으로 담는다. 인허가·취소·폐업·휴업 일자, 영업상태, 소재지(지번·도로명), 상호, 업태, 중부원점TM 좌표(X, Y)가 들어 있다. 구민이나 분석가가 광진구에서 지금 영업 중인 축산가공업소가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 식품 인허가·행정처분 데이터와는 관리번호(MGTNO)·상호·주소를 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 서울특별시 광진구_축산가공업 인허가 정보는 광진구 내에서 축산물을 원재료로 하여 다양한 가공식품을 제조·판매하는 업소에 대한 인허가 현황을 제공하는 데이터입니다. 여기서 말하는 축산물에는 식육(소고기, 돼지고기 등), 계란(알), 원유(생우유) 등이 포함되며, 가공품 예시는 소시지, 전란분(건조 계란가루), 우유, 유제품 등입니다. 본 데이터는 각 업소의 상호, 소재지, 업종구분, 인허가일자 등의 정보를 포함하고 있으며, 해당 업소가 법적으로 축산가공업 허가를 받은 경우에만 등록되어 있습니다. 이를 통해 축산물 가공 유통 경로의 위생과 품질을 관리하고 소비자 신뢰도를 높이는 데 활용됩니다. 본 데이터는 중부원점TM(EPSG:2097) 좌표계를 기준으로 위치정보를 제공하며, 위경도 좌표는 포함되어 있지 않습니다. 데이터는 3일 전 기준으로 최신 상태가 유지되며, 식품안전정책, 축산물 이력관리, 지도 기반 업소 탐색 서비스 등에 응용될 수 있습니다.
