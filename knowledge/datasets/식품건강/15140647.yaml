summary_user: 서울 은평구에서 일반음식점 허가를 받고 외국인 관광객용 시설을 갖춰 특정 국가 음식을 전문으로 내는 관광식당의 인허가 정보를 업소 건별로 담는다(사업장명, 인허가일자, 영업상태, 폐업일자, 지번·도로명 주소, 중부원점TM 좌표, 시설 규모 등). 관광객이나 여행 서비스 사업자가 '은평구에서 지금 영업 중인 외국 음식 전문 관광식당이 어디인가'를 찾을 때, 지자체 분석가가 관광식당 지정·폐업 현황을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식품 인허가 업소 데이터와는 관리번호(MGTNO)·개방자치단체코드 같은 같은 기관 코드나 상호·주소 매칭으로만 잇는다.
description_portal: '은평구의 일반음식점영업의 허가 받은 자가 관광객이 이용하기 적합한 음식제공시설을 갖추고 특정 국가의 음식을 전문적으로 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 외국인 관광객을 유치하고 편의를 제공하기 위해 「관광진흥법」에 따라 지정된 관광식당의 인허가 현황을 담고 있습니다 . 이 식당들은 일반음식점 허가를 기본으로, 관광객에게 적합한 시설과 전문적인 외국어 메뉴판, 해당 언어 응대 가능 인력 등 추가적인 요건을 갖춘 곳들입니다 . 데이터에는 각 식당의 상호명, 소재지 주소, 최초 지정일, 현재 영업 상태(영업중, 폐업 등)와 같은 관광 인프라 관리의 핵심 정보가 포함되어 있습니다.이 데이터를 통해 국내외 관광객들은 공식적으로 검증된, 외국인 친화적인 식당을 쉽게 찾아 방문할 수 있어 여행 만족도를 높일 수 있습니다. 또한, ‘미식 관광’이 중요한 여행 트렌드로 부상함에 따라 , 지자체는 이 데이터를 활용하여 지역의 관광 자원을 홍보하고 관리하며, 관광객 유치를 위한 특화된 음식 관광 정책을 수립하는 데 필수적인 기초 자료로 활용합니다.'
