summary_user: 경상남도 창녕군에 있는 미용업소(일반·피부·종합·네일·화장분장 미용업 등)를 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·업소명·영업소 주소·소재지 전화번호를 제공한다. 주민이나 사업자가 '창녕군 안에서 영업 중인 네일미용업소는 어디에 있나'처럼 지역 내 미용업소 위치와 연락처를 확인하거나, 분석가가 읍면별 미용업소 분포를 살피는 데 쓴다. 실측 컬럼에 업소 고유번호 같은 전역 조인 키가 없어서, 다른 공중위생업·인허가 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 경상남도 창녕군 공중위생업 미용업(미용업, 일반미용업, 피부미용업, 종합미용업, 네일미용업, 화장·분장미용업)에 대한 현황 데이터를 포함하고 있습니다.1. 미용 업종명, 업소의 명칭, 영업소 소재지 주소(도로명 주소, 없는 경우 일반주소), 소재지 전화번호(일반 전화번호)를 제공합니다.2. 데이터 기준일은 2026년 5월 13일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다3. 전화번호가 휴대전화번호인 경우 개인정보로 데이터가 없습니다.4. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 관광환경국 환경위생과 위생팀 055-530-1165으로 문의 주시기 바랍니다.
