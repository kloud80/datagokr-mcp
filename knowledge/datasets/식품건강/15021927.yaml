summary_user: '경상남도 창녕군에 등록된 식품제조가공업 업소를 업소 한 곳당 한 행으로 담은 현황 파일로, 업소명·전화번호·도로명 소재지·제조하는 식품의 종류(식품의종류)·데이터기준일이 들어 있다. 창녕군에서 특정 식품(예: 장류·떡류)을 만드는 제조업체가 어디에 있는지 찾으려는 주민·납품처 발굴 사업자, 지역 식품제조업 분포를 보려는 분석가가 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.'
description_portal: 경상남도 창녕군에 등록된 식품제조가공업 업소 현황입니다.1. 업소의 명칭, 업소의 전화번호(일반전화번호), 업소 소재지 주소(도로명주소), 제조하는 식품의 종류 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 13일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 전화번호가 없는 업소도 존재합니다.4. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 관광환경국 환경위생과 위생팀 055-530-1163으로 문의 주시기 바랍니다.
