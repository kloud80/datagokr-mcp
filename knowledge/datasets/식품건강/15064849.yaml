summary_user: 건강기능식품에 관한 법률에 따른 전국 건강기능식품 판매업소를 업소 단위로 담으며, 업소명·대표자명·인허가번호(LCNS_NO)·허가일자·관할기관명·전화번호·소재지 주소·업종명을 포함한다. 건강기능식품 판매 창업을 검토하는 사업자가 특정 지역에 판매업소가 얼마나 있는지 확인하거나, 분석가가 지역별 건강기능식품 판매업 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가 업소 데이터와는 인허가번호·업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 건강기능식품에 관한 법률에 따른 건강기능식품 판매업 관련 정보입니다.*“건강기능식품”이란 인체에 유용한 기능성을 가진 원료나 성분을 사용하여 제조(가공을 포함한다. 이하 같다)한 식품을 말한다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 건강기능식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
