summary_user: 전주시 관내 식품제조가공업 인허가 업소를 업소 한 곳당 한 행으로 담은 원장 파일로, 사업장명·인허가일자·영업상태·주소·위도경도·위생업태·급수시설 구분을 포함한다. 창업자나 분석가가 '전주 어느 동네에 영업 중인 식품제조공장이 몰려 있나'처럼 지역 식품제조업체 분포와 영업 현황을 파악하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 사업장명·주소 매칭이나 좌표 기반 공간 결합으로 이어 쓴다.
limits: 전주시 한 시군구 범위만 담아 다른 지역과 비교하려면 지자체별 파일을 따로 모아야 한다. 공통 식별 키가 없어 행정처분·회수 정보 등과 연결할 때 업소명·주소 매칭 오차가 생길 수 있다.
