description_portal: '전북특별자치도 전주시는 관내 식품제조가공업 인허가 정보 제공제공 되는 주요항목 : 사업장명, 인허가일자, 영업상태명, 소재지전화번호, 도로명주소, 지번주소, 위도, 경도, 위생업태명, 급수시설구분명, 데이터기준일자 등에 대한 데이터를 제공전주시가 보유한 위생 관련 인허가 데이터를 기반으로 정기적으로 갱신되며, 공공데이터 개방 표준에 따라 CSV 등의 형태로 제공됩니다.이를 통해 시민, 연구자, 기업 등이 식품제조가공업체의 현황 파악, 지역 산업 분석, 위치 기반 서비스 개발 등 다양한 용도로 활용가능합니다.데이터 제공부서 : 환경위생과'
