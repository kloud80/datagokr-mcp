summary_user: 서울특별시 광진구에서 식품운반업 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 인허가 원장이며, 업소명·소재지 주소·인허가일자·영업상태(영업/폐업)·폐업일자·중부원점TM 좌표(X, Y) 등을 포함한다. 식품 유통 안전을 맡은 행정 담당자나 물류 분석가가 '광진구에서 현재 영업 중인 냉장·신선식품 운반업체는 어디에 몇 곳 있는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식품 인허가·위생 데이터와는 업소명·주소 매칭이나 관리번호(MGTNO)·자치단체 코드(OPNSFTEAMCODE) 같은 같은 기관 체계의 코드로만 연결한다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 식품운반업 인허가를 받고 운영 중인 업소의 현황 정보를 제공합니다. 식품운반업은 유산균 음료, 어류, 조개류 등 부패 또는 변질되기 쉬운 식품을 안전하고 위생적으로 운반하기 위해 허가된 전문 업종으로, 식품의 신선도 유지와 소비자 안전 확보를 위한 핵심 유통 단계입니다. 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등 주요 인허가 정보가 포함되어 있으며, 식품위생법에 따라 운송 차량의 온도관리, 청결 유지, 식품 분리 규정 등을 준수해야 합니다. 본 정보는 식품 유통 안전관리, 물류 기반 정책 수립, 식중독 예방 행정 대응 등 다양한 분야에서 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않아 지도 시스템 활용 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준의 최신 자료로 주기적 갱신이 이루어지며, 광진구 내 식품물류업체의 등록 현황을 확인할 수 있는 기초 자료입니다.
