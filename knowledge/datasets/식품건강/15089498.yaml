summary_user: 인천광역시 서구(서해구) 관내에서 운영 중인 용기·포장지 제조업소를 업소별 한 행으로 정리한 파일로, 회사명·업종명·대표주소·전화번호·데이터기준일자를 담는다(csv 약 3KB의 소규모 목록). 관내 식품 포장재 제조업체가 어디에 몇 곳 있는지 확인하려는 위생 담당자나, 포장재 거래처를 찾는 식품 사업자가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가 데이터와는 회사명·주소를 맞춰 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 관내에 운영중인 용기,포장지 제조업소의 현황을 정리한 자료입니다. 본 공공데이터는 인천광역시 서구의 용기 포장지제조업소의 업소명, 소재지, 전화번호 등의 항목으로 구성이 되어 있습니다. 본 공공데이터를 통하여 식품 관리와 관련된 포장재산업 실태 파악에 활용될 수 있을 것이며, 관내 제조업체의 유통 경로 및 위생관리 체게 분석에도 활용될 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신의 정보를 반영을 하고 있습니다.
