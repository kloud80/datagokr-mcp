summary_user: 경상남도 함안군 관내에 등록·신고되어 운영 중인 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 4.9KB)로, 업종명·업소명·도로명 소재지·전화번호를 담는다. 식자재·원료 거래처를 찾는 사업자나 함안군 식품 제조업 분포를 보려는 분석가가 '함안군에 어떤 식품제조가공업체가 어디에 있나'를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명 주소를 맞춰 이어 쓴다.
description_portal: 본 데이터는 식품위생법 제37조 및 동법 시행령 제21조에 따라 적법하게 등록·신고되어 운영 중인 경상남도 함안군 관내 식품제조가공업체의 일반 현황입니다. 제공 데이터는 관내에서 다양한 식품 및 음료 등을 제조·가공하는 업체의 명칭(업소명) 등으로 상세히 구성되어 있습니다. 본 자료는 함안군 관내 제조 시설의 철저한 식품안전관리, 위생 점검 및 행정 지도를 위한 기초 자료로 활용될 뿐만 아니라, 민간 영역에서는 전국적인 식품 유통망 구축, B2B 식자재 및 원료 수급처 확보, 소상공인 및 기업의 상권·산업 분석, 로컬 푸드 연계 상품 개발 등 다방면의 비즈니스와 연구 목적으로 활용 가치가 높습니다. 본 데이터는 변동 사항을 반영하여 주기적으로 최신화됩니다.
