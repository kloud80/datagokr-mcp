summary_user: 인삼류(홍삼·태극삼·백삼·흑삼)를 시중에 유통·판매하기 위해 품질검사를 맡는 지정 검사업체를 업체 한 곳당 한 행으로 담은 전국 단위 명부로, 업체명·대표자·소재지·최초지정일과 삼종별 검사 지정 여부를 담는다. 인삼 제조·유통 사업자나 소비자가 "홍삼을 검사받을 수 있는 지정 업체가 우리 지역 어디에 있는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 식품 인허가 업소 등 다른 데이터와는 업체명·소재지 문자열 매칭으로만 이어 쓴다.
description_portal: 인삼류는 검사합격품만 판매해야 하며, 검사는 인삼검사소(농협중앙회)와 자체검사업체에서 담당하고 있습니다. 인삼검사소는 농림축산식품부장관이 지정, 자체검사업소는 국립농산물품질관리원장이 지정하고 있으며, 유통 중이거나 보관·진열 중인 인삼류 검사합격품을 수거하여 품질(연근, 등급 등) 확인검사를 실시하고 있으며  미검사품 판매나 원산지표시 위반 업체에 대한 상시 단속을 실시하고 있습니다. 본 정보는 인삼류(홍삼, 태극삼, 백삼, 흑삼)를 시중에 유통 및 판매하기 위해 품질검사를 실시하는 검사업체 정보로서, 업체명, 대표자, 소재지, 최초지정일자, 지정삼종별 검사여부 항목으로 구성된 데이터입니다.지정삼종은 세부적으로 홍삼, 태극삼, 백삼, 흑삼으로 구분됩니다.
