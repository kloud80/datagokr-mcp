summary_user: 경기도 성남시에서 건강기능식품 일반판매업으로 인허가를 받은 업소를 한 곳씩 담은 건별 현황으로, 구·업소명·인허가일자·영업상태·폐업일자·도로명/지번 소재지를 포함한다. 소비자나 분석가가 '우리 동네(구)에 영업 중인 건강기능식품 판매점은 어디이고 최근 몇 년 새 얼마나 늘었나'를 확인하거나, 창업 예정자가 상권별 판매점 분포를 살피는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 실측 컬럼에 없어서, 다른 식품 인허가 업소 데이터와는 업소명·주소를 맞춰 보거나 구 이름으로 묶어 연결해야 한다.
description_portal: 건강기능식품을 판매(일반판매업)하는 업소정보에 대한 현황자료입니다. 현황 자료는 구,  업종, 판매점 업소명, 판매점 인허가일자, 판매점 영업상태, 판매점 폐업상태,  판매점 도로명 소재지, 판매점 지번 소재지 항목으로 구성되어 있으며, 각 지역의 판매업소 명칭과 허가일자, 현재 영업여부, 폐업 여부, 위치 청보를 포함해 업소 운영 현황을 반기별로 현행화하여 제공합니다. 이를 통해 지역별 건강기능식품 판매업의 분포와 증가 추세를 분석하고, 불법 영업 방지 및 소비자 안전관리를 강화할 수 있습니다. 또한 행정업무에 활용되며, 공공데이터 포털이나 지자체 홈페이지를 통해 공개되어 국민의 알권리를 보장하고 정책 수립의 기초자료로 활용됩니다.
