summary_user: 서울특별시 중랑구에서 직접 제조하지 않고 식품을 판매업소에 유통하는 유통전문판매업소를 업소 단위로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표를 포함한다. 중랑구 안에서 영업 중인 유통전문판매업소가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하려는 사업자나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 식품 인허가 데이터와는 개방기관 코드(OGDP_INST_CD)·관리번호나 주소·사업장명 매칭으로 이어 쓴다.
description_portal: '서울특별시 중랑구의 직접 제조하지 않고 식가공류 제공을 위해 판매업소에 유통하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
