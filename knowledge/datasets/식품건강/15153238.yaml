summary_user: 식품의약품안전처의 어린이 기호식품 우수판매업소 지정 현황을 업소 한 곳당 한 건으로, 전국 범위에서 인허가번호·업소명·업종·주소·지정일자·관할기관과 함께 담으며, 재난안전데이터 공유플랫폼을 거쳐 제공된다. 학부모나 학교 주변 상권을 살피는 분석가가 '우리 동네에서 어린이 우수판매업소로 지정된 곳은 어디이고 언제 지정됐나'를 확인하는 데 쓴다. 인허가번호(LCPMT_NO)로 식품 인허가 업소 원장과 맞춰 보는 용도가 검토 결정에 있으나, 실측에서는 전역 조인 키가 확인되지 않아 업소명·주소 매칭이나 관할기관명으로 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 어린이우수판매업소지정현황 정보입니다.\""
