summary_user: 식품·식품첨가물 품목제조보고 정보를 원재료 단위로 담은 건별 원천 데이터로, 제품명·식품유형·제조업소명·보고 및 변경 일자와 함께 각 원재료명과 그 순번(RAWMTRL_ORDNO)을 전국 범위로 제공한다. 소비자나 알레르기 환자가 특정 제품에 어떤 원재료가 들어가는지 확인하거나, 분석가가 특정 원재료를 쓰는 제품과 제조업소를 찾는 데 쓴다. 전역 공통 조인 키는 없으며, 품목제조보고번호(PRDLST_REPORT_NO)로 같은 기관의 품목제조보고·바코드·영양성분 등 제품 DB와, 인허가번호(LCNS_NO)·업소명으로 식품 인허가 업소나 회수·행정처분 데이터와 이어 쓴다.
description_portal: 식품의약품안전처에서 제공하는 식품(첨가물)의 품목제조보고 정보(원재료 포함)데이터입니다.이 데이터를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공 등으로 국민의 편의성을 향상 시킬 수 있습니다.
