description_portal: 부산광역시 서구 내 수산물 가공업체에 대한 데이터로 업체명, 업체 주소(도로명주소), 관내 업체에 대한 현황자료이며, 업체별 주요 업종 등에 대한 정보를 제공합니다.부산광역시 서구 수산물 가공업 업종에는 냉동품(처리동결), 냉동품(원형동결), 연제품, 염신품, 염장품 등 여러 종류가 있으며, 특히 냉동품(처리동결) 및 냉동품(원형동결) 업종이 주를 이루고 있습니다.처리동결은 수산물 원물을 일부 처리하여 동결시키는 것을 뜻하며, 원형동결은 수산물의 원형을 그대로 동결시키는 것을 의미합니다.부산광역시 서구 관내에는 현재 101개의 수산물가공업 업체가 있습니다.
