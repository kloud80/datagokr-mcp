summary_user: 인천광역시 연수구 안의 유흥주점과 단란주점을 업소 한 곳당 한 행으로 담은 목록 파일로, 업종명·업소명·도로명/지번 주소·전화번호로 구성된다. 주민이나 분석가가 "연수구 어느 동네에 유흥·단란주점이 몰려 있나"를 확인하거나, 행정 담당자가 위생 점검·안전 관리 대상을 추리는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 직접 맞춰 이어야 한다.
limits: 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭으로만 연결되고, 그 매칭은 부정확할 수 있다. 범위는 연수구 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다. 좌표 필드가 없으므로 지도에 표시하려면 주소를 좌표로 바꾸는 작업이 따로 필요하다.
