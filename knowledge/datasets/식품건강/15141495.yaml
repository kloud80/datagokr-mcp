summary_user: 서울 종로구 관내 건강기능식품 일반판매업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(영업/폐업 등)·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y) 등을 포함한다. 소비자나 분석가가 '종로구에서 현재 영업 중인 건강기능식품 판매업소는 어디이고, 언제 등록·폐업했는가'를 확인하거나 판매업소 개폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 좌표를 이용해 다른 식품 인허가 업소 자료와 위치 기준으로 겹쳐 볼 수 있다.
description_portal: 본 데이터는 서울특별시 종로구 관내에서 건강기능식품을 일반 판매 형태로 유통하기 위해 등록된 업체의 인허가 현황을 정리한 자료입니다. 주요 항목에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 「건강기능식품에 관한 법률」에 따라 인허가를 받은 사업체의 행정 처리 이력을 확인할 수 있습니다. 해당 자료는 건강기능식품의 안전한 유통관리, 판매업소 등록현황 파악, 폐업 및 변경이력 분석 등을 위한 기초자료로 활용됩니다. 또한 시민 건강보호, 식품안전 행정 기반 조성, 관련 정책 수립 및 소비자 정보 제공 등 다방면의 공공서비스 운영에 참고자료로 제공됩니다. 지역 내 유통질서 확립과 법적 등록업체 관리에도 유의미한 역할을 합니다.
