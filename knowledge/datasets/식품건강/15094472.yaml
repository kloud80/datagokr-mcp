description_portal: '서울특별시 서초구의 병원,학교,어린이집 등 집단급식소를 운영하는 업소 및 기관 정보입니다. 데이터는 각 집단급식소에 부여된 관리번호, 현재의 운영관리 상태(신고, 폐쇄 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 집단급식소 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 대규모 급식시설 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 학부모 및 시민들에게는 법적 운영관리 기준을 충족하며 철저한 식재료 식중독예방 조치를 수행하는 신뢰할 수 있는 급식시설의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
