summary_user: 서울 구로구의 식용얼음판매업 인허가 업소를 업소 한 곳당 한 행으로 담은 건별 원장이며, 인허가일자·영업상태·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y)를 포함한다. 구로구에서 지금 영업 중인 식용얼음 판매업소가 어디에 몇 곳 있는지, 언제 허가받고 언제 폐업했는지를 확인하려는 위생 담당자나 상권 분석가가 쓴다. 전역 조인 키는 없으므로 다른 식품 인허가·위생 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 잇고, 좌표는 지도·공간 분석에 붙여 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 식용얼음판매업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 식용얼음판매업 시설의 위생 관리 사항, 업태구분 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 위생 관리, 정책 수립, 연구 분석, 민원 처리 등 여러 분야에서 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계하여 활용할 수 있어 지역사회 정보 접근성을 높이고 행정의 투명성을 강화하는 기반 자료로 기능한다. 또한 데이터 항목이 표준화되어 비교와 통계 작성이 용이하며, 허가 변경 이력과 상태 값이 포함되어 행정 점검 및 지도에 활용된다.
