summary_user: 서울특별시 서초구에 신고된 건강기능식품일반판매업소(유통전문판매업 제외)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일·영업상태(영업/폐업 등)·폐업일·소재지 지번·도로명 주소·업소명·중부원점TM 좌표(X, Y)를 포함한다. 건강기능식품 판매점 창업을 준비하는 사업자가 서초구 안에서 현재 영업 중인 판매업소가 어느 동네에 얼마나 몰려 있는지 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 서초구의 건강기능식품을 판매하는 업소 정보(건강기능식품유통전문판매업에 해당되는 업소 제외)입니다. 데이터는 각 신고업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 건강기능식품일반판매업 창업을 희망하는 예비 사업자에게는 서초구 지역의 시장 분석 및 소매업 신고업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 보건위생 기준을 충족하고 정확한 표시광고를 통해 소비자안전을 확보하며 건강증진에 기여하는 신뢰할 수 있는 판매시설의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
