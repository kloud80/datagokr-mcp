summary_user: 서울 광진구 관내 미용업(헤어·메이크업·네일·피부관리) 인허가 업소를 업소 한 곳당 한 행으로 담는 건별 원천 목록으로, 업소명·소재지 주소·인허가일자·영업상태·폐업일자·업태·중부원점TM 좌표 등을 포함한다. 창업 예정자나 상권 분석가가 '광진구에서 지금 영업 중인 네일·피부관리 업소가 어느 동에 몰려 있고 최근 폐업은 얼마나 되나'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소(지번·도로명)나 업소명 매칭, 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 미용업 인허가를 받아 운영 중인 업소 현황을 제공하는 공공데이터입니다. 포함된 업소는 헤어 커트 및 스타일링, 메이크업, 네일아트, 피부관리 등 얼굴과 머리, 손톱, 피부 등을 손질하여 외모를 아름답게 꾸미는 서비스를 제공하는 곳으로 구성되어 있습니다. 업소명, 소재지, 업종 유형, 인허가일자 등의 항목을 통해 미용업소의 분포와 행정 정보 현황을 확인할 수 있습니다. 본 데이터는 지역 생활서비스 업종 분석, 자격·영업기준 점검, 소상공인 지원 정책 수립 등에 유용하게 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않아 지도 연계 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준으로 정기 갱신되며, 시민과 행정기관 모두가 미용업 관련 정보를 효율적으로 활용할 수 있도록 구성되었습니다.
