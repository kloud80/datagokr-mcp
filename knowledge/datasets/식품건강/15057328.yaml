summary_user: 식품 검사에 적용하는 공통 기준·규격을 품목(품목코드·품목명)과 시험항목별로 한 행씩 담으며, 각 행에는 기준값·최소/최대값·단위, 미생물 기준(n·c·m·M), 유효기간 시작·종료일, 출처가 들어 있다. 식품 제조·수입 사업자나 검사기관이 "이 품목은 이 시험항목에서 허용 한도가 얼마인가"를 확인하거나, 부적합 판정 결과를 기준치와 대조하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 식품 데이터와 이으려면 품목코드(PRDLST_CD)·시험항목코드(TESTITM_CD) 같은 같은 기관 코드나 품목명·시험항목명 매핑을 써야 한다.
description_portal: 이 자료는 식품의약품안전처에서 관리하는 식품 검사에서 적용되는 식품 공통 기준 및 규격에 관한 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
