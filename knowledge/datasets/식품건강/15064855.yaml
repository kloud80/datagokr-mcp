summary_user: 식품위생법에 따라 영업을 등록한 전국 식품제조가공업소를 업소별로 담은 인허가 원장으로, 업소명·대표자·인허가번호(LCNS_NO)·허가일자·관할기관·소재지 주소·전화번호·업종을 제공한다. 사업자나 분석가가 "특정 지역에 식품 제조공장이 몇 곳이 있고 언제 허가받았는가"를 확인하거나 거래처·경쟁 업체를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 위생 지정·회수/행정처분 데이터와는 인허가번호나 업소명·주소를 매핑해 잇는다.
description_portal: '식품위생법에 따라 영업을 등록한 식품 제조 가공업 관련 정보입니다.*식품제조가공업: 식품을 제조ㆍ가공하는 영업이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.'
