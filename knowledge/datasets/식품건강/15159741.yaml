description_portal: 이 데이터는 경상북도 청도군 관내에서 집단급식소를 운영하는 병원 현황을 정리한 자료입니다. 각 기관의 병원명, 도로명 주소, 급식소 운영형태, 병상 정보가 제공합니다. 운영형태는 직영 여부를 기준으로 관리되며, 병상 정보는 일반입원실 상급병상과 일반병상, 성인·소아·신생아 중환자병상, 분만실, 수술실, 응급실, 물리치료실, 정신과 폐쇄·개방 병상, 격리병실, 무균치료실 등으로 구분되어 있다. 이를 통해 청도군 내 병원의 급식 운영 현황과 의료자원 규모를 파악할 수 있으며, 보건행정 기초자료, 공공급식 운영 점검, 지역 의료시설 비교, 정책 수립과 행정업무 참고자료로 활용할 수 있습니다.
