summary_user: 부산 엄궁·반여 농산물도매시장에서 경매 전에 채취한 과일·채소 등 농산물 검체별 잔류농약 검사 결과를 건별로 담는다(검체명, 품목·분류, 검출농약과 검출농도, 허용기준, 판정, 채취장소·채취일자 등). 소비자나 유통업자가 '부산 도매시장에 출하된 특정 품목에서 어떤 농약이 기준을 넘어 검출됐는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 잔류농약·부적합 식품 데이터와는 품목명·농약명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 날이 갈수록 음식의 안전성에 대해 관심이 높아지고 또 안전한 먹거리를 찾는 수요도 높아지고 있어서 소비자들이 안전한 농산물을 구매하여 소비할 수 있도록 엄궁, 반여 두 곳의 농산물도매시장에서 출하하여 시중에 유통시키는 농산물, 한약재 등의 중금속 등 농약에 대한 안정성 검사 결과 정보를 제공합니다. 감, 감귤, 딸기, 밀감, 복숭아, 사과, 산딸기, 자두, 키워, 포도 등 과일 12종과 가지, 갓, 고추, 깻잎, 대파, 무, 배추, 부추, 토마토, 시금치, 오이 등 채소 59종에 대한 잔류 농약검사 결과를 제공합니다. 소비자들은 잔류농약 검사결과를 통해서 구매해서 소비하는 농산물이  농약 등 중금속 오염으로부터 안전한지를 확인하고 구매하여 안전하고 건강한 식생활을 할 수 있습니다.-부산광역시_농산물 잔류농약검사 정보(검체명, 품목, 분류, 검출농약, 검출농도  판정 등)
