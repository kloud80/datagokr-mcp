summary_user: 김제시에 있는 식품제조가공업 업소를 한 행에 한 곳씩 담은 목록 파일로, 업종명·업소명·도로명 소재지·전화번호가 들어 있다(약 11KB CSV). 김제시에서 식품을 만드는 업체가 어디에 몇 곳 있는지, 특정 업체의 연락처와 주소가 무엇인지 알고 싶은 주민·사업자·지역 산업 분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
