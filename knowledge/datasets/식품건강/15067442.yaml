summary_user: 인천광역시 남동구가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·업종 유형·소재지 주소·전화번호와 대표메뉴 1개의 이름과 가격을 담는다. 남동구 주민이나 방문객이 동네에서 값싸게 먹을 수 있는 식당·업소와 대표메뉴 가격을 찾을 때 쓰고, 분석가는 구 단위 저가 업소 분포를 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 식품 인허가 업소 원장이나 위생 지정 데이터와는 업소명·주소를 맞춰 이어 써야 한다.
limits: 남동구 한 시군구 범위만 담고, 업소를 고유하게 식별하는 코드가 없어 다른 데이터와 붙일 때 업소명·주소 매칭 오류가 생길 수 있다. 메뉴 가격은 대표메뉴 1개만 있어 업소 전체 가격 수준을 대표하지 않는다.
