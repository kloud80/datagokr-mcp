summary_user: 경기도 31개 시군의 식품판매업(식용얼음판매업, 유통전문판매업, 기타식품판매업) 사업장을 업소 한 건씩 담은 인허가 현황 데이터로, 업종·인허가일자·영업상태·폐업일자·주소·위경도·종업원 수·시설규모 등을 포함한다. 식품 유통 관리 담당자나 상권 분석가가 '우리 시군에서 영업 중인 유통전문판매업체는 몇 곳이고 어디에 몰려 있는가' 같은 질문에 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 시군명으로 다른 경기도 데이터와 묶거나, 정제 주소·위경도 좌표로 공간 매칭한다.
description_portal: 이 데이터는 식품 위생법 시행령에 따라 경기도 내 식품판매업(식용얼음판매업, 유통전문판매업, 기타식품판매업)을 통합하여 제공하는 인허가 현황 데이터입니다. 경기도 31개 시군의 식품판매업체를 대상으로 하며, 주요 항목으로는 시군명, 사업장명, 업종명, 인허가일자, 영업상태, 폐업일자, 소재지 주소, 위도·경도 좌표, 종업원 수, 급수시설 구분, 건물 소유형태, 총시설규모, 연도 등이 포함됩니다. 식품유통 관련 업종별 분류에 따른 사업장 현황을 파악할 수 있으며, 관련 법령은 식품 위생법 시행령입니다. 본 데이터는 식품 유통 관리, 식품안전 정책 수립, 업종별 사업체 분포 분석 및 공간정보 기반 활용에 적합합니다.
