summary_user: 서울특별시 양천구의 식품자동판매기업 인허가 업소를 업소 한 곳당 한 행으로 담은 건별 원장이며, 업소명·인허가일자·영업상태·폐업일자·주소·전화번호·소재지면적·종사자수·좌표(X, Y)가 들어 있다. 양천구에서 지금 영업 중인 식품 자동판매기 업소가 어디에 몇 곳 있는지, 언제 인허가를 받았고 폐업했는지 알아보려는 시민·사업자·분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 업소명·주소를 맞춰 보거나 같은 기관 코드(OPNSFTEAMCODE)·관리번호(MGTNO)를 기준으로 연결한다.
description_portal: 본 데이터는 서울특별시 양천구에서 관리하는 식품자동판매기업의 인허가 현황을 체계적으로 제공하는 자료이다. 해당 업종은 자동판매기를 통해 식품을 판매하는 영업으로서 사업장의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등 포함한다. 이를 통해 지역 내 식품 안전 확보를 위한 기초 자료로 활용될 수 있다. 아울러 영업자와 시민이 자동판매기 식품 유통의 안전성을 확인할 수 있도록 정보 접근성을 높였으며, 행정기관의 민원 처리, 지도·감독 업무의 효율성 향상에도 기여한다. 본 데이터는 관련 법령 개정과 현장 관리 결과를 반영하여 주기적으로 갱신되며, 이용자는 이를 통해 지역 사회의 식품 판매 환경과 위생관리 수준을 명확하게 파악할 수 있다.* 식품자동판매기업-자동판매기를 이용하여 식품을 판매하는 업소
