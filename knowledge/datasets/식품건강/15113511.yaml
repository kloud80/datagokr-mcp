summary_user: 인천광역시 남동구에 있는 집단급식소 식품판매업 업소를 한 곳씩 담은 인허가 업소 목록으로, 업종명·업소명·도로명/지번 소재지·전화번호를 담는다(CSV 약 15KB). 집단급식소에 식재료를 납품할 업체를 찾는 급식 운영자나 남동구 식품 유통업소 분포를 보려는 분석가가 '남동구에 집단급식소 식품판매업체가 어디에 몇 곳 있나'를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 잇는다.
