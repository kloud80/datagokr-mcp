summary_user: 「수입식품안전관리 특별법 시행규칙」 개정('22. 11. 25. 시행) 이후 구조화된 수입식품의 한글표시사항을 텍스트로 변환해 제품명(한글·영문), 수입업체, 해외제조업소, 수출국·제조국, 원재료명, 유통기한 등과 함께 제품 단위로 담는 전국 범위 API이며, 검증 호출에서는 0행이 수신되어 실제 규모는 확인되지 않았다. 소비자가 "이 수입 과자의 원재료와 제조국, 수입업체가 어디인가"를 확인하거나, 분석가가 수입식품의 원산지·표시 정보를 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 수입식품·식품안전 데이터와는 수입업체명·제품명 같은 이름 매핑으로만 이어 쓴다.
description_portal: -「수입식품안전관리 특별법 시행규칙」개정('22. 11. 25. 시행) 이후 구조화된 한글표시사항 정보를 텍스트로 변환하여 제품 정보와 함께 소비자에게 제공합니다.-제품구분, 수입업체명, 제품명(한글 및 영문), 유통기한, 처리일자, 해외제조업소, 품목, 수출국, 제조국과 함께 소비자가 쉽게 이해할 수 있도록 변환된 한글표시사항, 원재료명, 유통기한 시작일자 및 종료일자 등이 항목으로 제공됩니다.-이 자료는 수입식품의 안전성 및 원산지 정보 투명성을 높이며, 소비자가 제품 정보를 명확히 확인할 수 있도록 지원하는 역할을 할 수 있습니다.
