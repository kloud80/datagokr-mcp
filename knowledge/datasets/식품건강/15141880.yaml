summary_user: 서울특별시 용산구의 위탁급식영업 인허가 업소를 업소 한 곳당 한 행으로 담은 원장으로, 업소명·인허가일·영업상태·폐업일·지번/도로명 주소·좌표(X, Y)·종사자 수·시설 면적 등을 포함한다. 용산구에서 학교·기업 급식을 위탁받아 운영 중인 업체가 어디에 몇 곳 있고 언제 인허가를 받았는지, 폐업한 곳은 어디인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 서울특별시 용산구_위탁급식 인허가 공공데이터는 위탁 형태로 운영되는 집단급식소에 대한 인허가 정보를 담고 있는 데이터로, 식품의약품안전처 및 각 지방자치단체가 수집·관리합니다. 해당 데이터는 공공데이터포털(data.go.kr)을 통해 제공되며, 급식소 명칭, 소재지, 운영 주체, 인허가일, 위탁 여부, 신고기관 등 다양한 정보를 포함합니다. 이 데이터는 위탁급식 운영 실태 파악, 위생 관리, 정책 수립, 산업 분석 등 다양한 목적으로 활용되며, 국민 누구나 접근 가능하도록 개방되어 있어 투명한 정보 제공과 급식 안전 강화에 기여하고 있습니다.
