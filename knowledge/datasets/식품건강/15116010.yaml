summary_user: 서울특별시 중구에 등록된 식육포장처리업소를 업소 한 곳씩 담은 인허가 원장으로, 관리번호·인허가일·폐업일·영업상태·지번/도로명 주소·소재지 면적·중부원점TM 좌표(X, Y) 등을 담는다. 예비 창업자가 중구 안에 영업 중인 식육포장처리 작업장이 어디에 몇 곳 있는지, 최근 폐업이 많은지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 업소명·주소 매핑이나 같은 기관의 개방자치단체코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 자치구나 다른 식품 업종 인허가 데이터와 합쳐 상권 분석에 쓴다.
description_portal: '서울특별시 중구의 소고기, 돼지고기 등 판매를 목적으로 식육을 절단하여 포장하는 업소 정보입니다. 데이터는 각 등록된 식육포장처리업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 식육포장처리업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록 작업장 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 위생관리 기준을 충족하고 정확한 유통기한 및 원산지 정보를 제공하는 신뢰할 수 있는 육류 포장 등록 업소의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
