summary_user: 충청북도가 우수모범업소로 지정한 음식점을 업소 단위로 담은 목록으로, 업소명·시군명·세부 주소·전화번호·대표 메뉴·지정년도·업태·대표자를 조회하는 API다. 여행객이나 주민이 '충북 ○○군에서 모범업소로 지정된 한식당은 어디인가'를 찾거나, 지자체·분석가가 시군별 모범업소 지정 현황을 파악하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·위생 데이터와는 업소명·주소나 시군명을 맞춰 연결해야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 식품 인허가 원장 등과의 연결은 이름·주소 매칭에 의존하므로 동명 업소나 주소 표기 차이로 오매칭될 수 있다. 범위는 충청북도 한 곳뿐이라 다른 시도와 비교하려면 별도 데이터가 필요하다.
