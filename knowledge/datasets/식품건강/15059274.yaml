summary_user: 경기도 내 일식(초밥·우동·돈까스 등) 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·폐업일자·영업상태·시설규모·종업원 수와 주소·위경도 좌표를 함께 담는다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 일식집이 몇 곳이고 어디에 몰려 있는가', '최근 몇 년 새 문을 연 곳과 닫은 곳은 얼마나 되는가'를 따지는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)로 다른 경기도 데이터와 묶거나, 주소·좌표로 상권·인구 데이터와 공간 결합해 쓴다.
description_portal: 이 데이터는 경기도 내에서 초밥, 우동, 사시미, 돈까스 등 일본 음식을 전문으로 제공하는 일반음식점의 인허가 및 영업현황을 포함합니다. 항목에는 사업장명, 인허가일자, 폐업일자, 영업상태, 위생업종명, 위생업태명, 급수시설구분, 총시설규모, 종업원 수, 다중이용업소 여부, 위치정보(WGS84 위도·경도, 도로명주소, 지번주소) 등이 포함됩니다. 이 데이터는 일식 외식산업 현황 분석, 소비 트렌드 파악, 지역 상권 개발, 식품위생 관리 정책 수립 등에 활용될 수 있으며, 경기도 31개 시군을 대상으로 수집되어 Open API를 통해 실시간으로 활용 가능합니다.
