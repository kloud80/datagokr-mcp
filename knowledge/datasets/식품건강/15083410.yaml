description_portal: 서울시 공공급식 품목 정보는 공공급식에서 사용하는 개별 식재료의 세부 특성을 관리하기 위한 데이터입니다. 대분류명, 중분류명, 소분류명을 통해 식재료를 단계적으로 분류하고, 식재료코드와 식재료명으로 각 품목을 고유하게 식별합니다. 또한 브랜드명, 생산연도, 규격 정보를 함께 제공하여 동일한 식재료라도 제조사, 생산 시기, 포장 단위나 중량 등의 차이를 구체적으로 구분할 수 있도록 구성되어 있습니다. 이 데이터는 어린이집, 학교, 복지시설 등 다양한 공공급식 기관에서 사용되는 식재료를 표준화하고, 입고·사용 이력 관리, 품질 및 안전 관리, 원산지·브랜드별 비교, 예산 및 물량 산정 등과 연계해 활용할 수 있는 기초 자료입니다.
