summary_user: 부산광역시 동구 관내 집단급식소를 업소 한 곳당 한 줄로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호 4개 항목으로 구성된다(csv 약 6.7KB). 주민이나 급식 관련 사업자가 동구에 어떤 집단급식소가 어디에 있고 연락처가 무엇인지 확인하는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명 주소를 맞춰 이어 써야 한다.
description_portal: 부산광역시 동구의 관내 집단급식소 영업 현황에 대한 자료입니다.파일 내의 항목 구성은 총 4가지로 이루어져있습니다.(업종명, 업소명, 소재지(도로명), 소재지전화 데이터입니다.)해당 데이터는 지역 주민들이 주변의 집단급식소 현황을 손쉽게 확인하고 필요한 서비스를 이용할 수 있도록 함으로써, 생활 편의성을 높이고 위생 환경 개선에 기여하는 중요한 기초 자료로 활용됩니다.그 이외의 업체 정보가 필요하신 경우 식품안전나라 사이트(https://www.foodsafetykorea.go.kr/portal/specialinfo/searchInfoCompany.do?menu_grp=MENU_NEW04&menu_no=2813)에서 검색하시기 바랍니다.
