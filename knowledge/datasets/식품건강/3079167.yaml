summary_user: 익산시에 있는 미용업소(일반·피부·종합·네일·화장분장 미용업 포함)를 업소 한 곳씩 담은 목록 파일로, 업종명·업소명·도로명주소·전화번호를 담는다. 익산시에서 네일숍이나 피부관리실이 어느 동네에 몇 곳 있는지 알아보려는 주민이나 창업 입지를 검토하는 사업자가 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 업소명·주소를 맞춰 이어 붙이거나 같은 기관(익산시) 단위로만 연결한다.
description_portal: 본 데이터는 전북특별자치도 익산시에 소재한 미용업소 현황 정보를 정리한 자료로 미용업 및 일반미용업 뿐만 아니라 피부미용업, 종합미용업, 네일미용업, 화장분장 미용업에 해당하는 사업장을 대상으로 하한다. 해당 데이터는 업종명, 업소명, 도로명주소, 지번주소, 전화번호 등의 항목을 포함하여, 익산시 내 미용업소에 대한 종합적인 이해를 위한 기초자료 제공을 목적으로 한다. 또한, 지역 내 자영업 및 생활서비스 업종에 대한 이해를 돕기 위한 자료로도 활용될 수 있다. 데이터는 주기적으로 갱신되며, 설명과 키워드를 통해 최신성 및 이해성을 높이고 있다.
