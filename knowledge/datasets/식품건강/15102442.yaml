summary_user: 인천광역시 부평구에 있는 건강기능식품 유통전문판매업소를 업소 한 곳당 한 행으로 담은 파일이며, 업소명·도로명/지번 주소·영업장 면적·전화번호가 들어 있다(csv 약 3.4KB의 소규모 목록). 구청 위생 담당자가 점검 대상 업소를 고르거나, 분석가·사업자가 '부평구 안에서 건강기능식품 유통전문판매업소가 어느 동네에 몰려 있나'를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '부평구 내 건강기능식품 유통전문판매업소의 상호명, 도로명 및 지번 주소, 영업장 면적, 전화번호 등의 정보를 포함한 자료건강기능식품의 안정적 유통 및 소비자 보호를 위한 기반 자료로 활용되며, 지역 내 식품위생관리, 점검 대상 선정, 건강식품 유통 밀집도 분석 등에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 건강기능식품 판매업소 위치 및 분포 현황 파악– 식품위생 관련 점검 대상업소 선별 및 관리계획 수립– 지역 내 유통전문판매시설 현황 기반 민간 소비정보 서비스 구축– 건강취약계층 대상 영양지원 사업 연계 가능성 검토주요 항목 설명● 업소명: 판매업소의 명칭● 도로명주소 / 지번주소: 영업장이 위치한 주소 정보● 영업장면적: 업소 내 건강기능식품 판매를 위한 공간 규모● 전화번호: 영업소의 대표 연락처'
