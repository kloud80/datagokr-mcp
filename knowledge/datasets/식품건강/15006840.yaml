summary_user: 구례군에서 영업 중인 공중위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호를 수록하며 범위는 구례군 한 곳이다. 구례에 사는 주민이나 방문객이 근처 목욕장·이미용실·세탁소가 어디 있고 연락처가 무엇인지 찾을 때 쓰고, 분석가가 업종별 업소 수를 셀 때도 쓴다. 전역 조인 키(인허가번호·행정코드 등)는 없으므로 다른 데이터와는 업소명·주소 문자열을 맞추거나 같은 기관의 데이터끼리만 이어 쓴다.
limits: 인허가번호 같은 공통 키가 없어 전국 인허가 데이터나 행정처분 정보와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위가 구례군 한 시군구에 한정된다. 포털 설명에 음식점·카페·숙박시설이 언급되어 있으나 실제 수록 업종은 업종명 필드로 확인해야 한다.
