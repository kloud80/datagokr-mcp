summary_user: 인천광역시 내 건강기능식품판매업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·업종·업소주소 세 항목만 들어 있다(CSV 약 485KB). 건강기능식품을 파는 가게가 인천 어느 구·동에 몰려 있는지 알고 싶은 창업 예정자나 상권 분석가가 쓴다. 공통 조인 키는 없어서, 다른 식품 인허가·위생·행정처분 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '인천광역시 건강기능식품판매업체 현황(업소명, 업종, 주소)에 대한 항목 정보를 제공하는 데이터로 구성되어있습니다.개인정보(업주이름, 사업자등록번호등)와 우편번호등은 공개되지 않습니다.해당 자료는 매년 업데이트 되는 자료입니다.업데이트 날짜를 기준으로 운영되고 있는 건강기능식품판매업체 현황을 공개합니다.파일내 항목별 내용은 붙임 파일을 참고해주시기 바랍니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.자료 출처 : 식품행정통합시스템'
