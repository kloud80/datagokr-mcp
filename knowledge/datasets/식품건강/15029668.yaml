summary_user: 부산광역시 영도구에 영업등록된 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일(약 3.5KB CSV)이며, 업소명·도로명 소재지·전화번호·취급 식품의 유형을 담는다. 영도구에서 과자류·음료류 같은 특정 유형의 식품을 만드는 제조업소가 어디에 있는지 찾으려는 주민·거래처 담당자나 지역 식품제조업 분포를 보는 분석가가 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '부산광역시 영도구 식품제조가공업 현황입니다.식품위생법 제37조(영업허가 등)에 의거 영업등록된 식품제조가공업 업소에 관한 데이터로서 업소명, 소재지주소, 소재지전화, 식품의 유형 항목을 제공합니다.- 업소명: 등록된 식품제조가공업소의 명칭- 소재지주소(도로명): 업소의 사업장 주소- 소재지전화번호: 업소와 연락 가능한 유선 전화번호- 식품의 유형: 업소에서 취급하는 식품 제조 및 가공의 유형 (예: 과자류, 음료류 등)본 현황은 특정 시점 기준으로 작성되었으며, 이후 업소 폐업, 변경 등의 사유로 변동이 있을 수 있습니다.기타 문의사항은 정보공개청구 또는 환경위생과 유선 문의 바랍니다.'
