summary_user: 대구광역시 구·군에 신고된 일반음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·업종·업태·업소주소를 개별 주소 단위로 담는다. 대구에서 특정 동네에 어떤 업태의 음식점이 몰려 있는지 보려는 창업자나 상권 분석가가 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 다른 데이터와는 업소명·주소를 맞춰 보거나 주소를 행정구역으로 바꿔 연결한다.
description_portal: 대구광역시에 신고된 일반음식점 현황 관련 데이터입니다. 일반음식점은 「식품위생법」 제37조 및 같은 법 시행령 제25조에 따라 영업신고를 하여야 하는 업종으로, 일반음식점 영업을 하려고 하는 자는 시행규칙 제36조 [별표14]에서 정하는 시설을 갖춘 후 [별지 제37호 서식]에 따른 식품 영업 신고서를 작성하여 영업을 하고자 하는 지역의 시·군·구청장에게 신고하여야 합니다. 또한 영업을 하려는 자는 같은 법 제44조에서 정한 영업자 준수사항을 지켜야 하며, 불이행 시  시행규칙 제89조 기준에 따른 행정처분 및  법 제101조에 따른 과태료 처분을 받게 됩니다.해당 데이터는 각 구·군별 업소명과 업태, 업소의 주소가 포함되어 있으나 소재지 이전 및 폐업 등 변경사항이 발생하였을 수도 있으니 이용 시 확인하시기를 권장드립니다.
