summary_user: 축산물위생검사기관으로 지정된 기관별로 기관명·대표자·주소·지정 시작일과 종료일·업무범위를 담은 전국 단위 목록이다. 축산물 검사를 맡길 사업자나 분석가가 '지금 지정 기간 안에 있는 검사기관은 어디이고 어떤 검사를 맡는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식품 인허가·위생 지정·행정처분 데이터와는 기관명(BSSH_NM)이나 주소를 이름 매칭해야 이어진다.
description_portal: 축산물위생검사기관으로 지정된 기관에 대한 속성정보를 제공합니다. 속성정보로는 검사기관명 , 대표자 , 주소 , 지정시작일자 , 지정종료일자 , 업무범위가 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
