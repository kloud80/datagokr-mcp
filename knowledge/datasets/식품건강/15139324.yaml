summary_user: 수입식품의 신고중량(kg)과 신고 건수를 기준년도·기준월별로 품목명과 제품명(한글명 포함) 단위로 집계한 전국 통계입니다. 수입업자나 시장 분석가가 '특정 품목이 최근 몇 달 사이 얼마나 수입됐는가'와 같은 월별 수입 추이를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 수입식품·식품안전 데이터와는 품목명·제품명 같은 이름 매칭이나 연월을 기준으로만 연결한다.
limits: 조인용 코드가 없어 품목명·제품명 문자열 매칭에 의존하므로 표기 차이로 연결이 누락될 수 있다. 전국 단위의 비공간 집계라서 지역별, 업체별, 해외제조업소별 수입 현황은 알 수 없다.
