summary_user: 인천 계양구 안에서 식품안전관리인증(HACCP)을 받은 업소를 업소 한 곳당 한 행으로 담은 목록 파일이다. 업소명·업종·적용품목·대표자·주소·인증번호·인증일이 들어 있다. 소비자가 동네 식품업체나 반찬가게가 HACCP 인증을 받았는지, 어떤 품목으로 언제 인증받았는지 확인할 때 쓴다. 위생 담당자가 관내 인증 현황을 점검할 때도 쓴다. 인허가번호 같은 전역 조인 키가 없어서, 식품 인허가 원장 등 다른 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 계양구 한 곳만 다루는 작은 파일(약 6.5KB)이어서 인천 전체나 전국 현황은 이 데이터로 알 수 없다. 업소 인허가번호가 없으므로 인허가 원장과 정확히 이어 붙이기 어렵고, 이름·주소로 맞출 때는 오매칭에 주의해야 한다.
