description_portal: '경기도 평택시 관내 한약방 현황으로 업종, 업체명,소재지도로명주소,소재지지번주소,전화번호,데이터기준일자 등을 제공합니다.한약방은 지역 주민들에게 한약 조제 및 판매 서비스를 제공하는 전통의약 업소로, 한약방의 분포를 파악하거나 보건 정책 수립, 지역 의료 접근성 분석 등에 유용하게 활용될 수 있습니다.데이터는 CSV 파일 형식으로 제공되며, 공공데이터포털에서 다운로드할 수 있습니다.1년마다 주기에 따라 최신 정보를 반영하여 업데이트되고 있으니 참고하시길 바랍니다.※ 문의 : 평택시청 평택보건소(031-8024-4342)'
