summary_user: 식품위생법에 따른 식품업소의 인허가 변경 이력을 업소 단위로 담는 API로, 업소명·업종·인허가번호·변경일자·변경전후 내용·변경사유를 제공한다. 상권·창업 분석가나 식품업소 현황을 추적하는 사람이 특정 업소의 인허가 사항이 언제 어떻게 바뀌었는지 확인하는 데 쓴다. 주소(BSN_LCTN_ADDR)를 조인 키로 다른 주소 기반 데이터와 이어 쓰고, 같은 세부 부문의 식품 인허가 업소 원장과 업소 정보를 맞춰 볼 수 있다.
limits: 검증 시점에 API 전체 건수가 3건, 수신 3행이어서 전국 범위라고 해도 실제로 확인된 규모는 매우 작다. 조인 키는 주소 하나만 확인됐고, 인허가번호 등 다른 키나 코드표는 근거가 없어 주소 표기 차이에 주의해야 한다.
