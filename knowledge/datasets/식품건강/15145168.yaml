description_portal: 식품위생법에 따른 식품업소의 인허가 변경 사항을 제공합니다. 이 자료의 속성정보는 업소명, 업종, 인허가번호, 전화번호, 주소, 변경일자, 변경전내용, 변경후내용, 변경사유가 있습니다.이 자료를 통하여 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
