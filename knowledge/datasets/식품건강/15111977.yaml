summary_user: 식품이력추적관리 대상 제품의 생산정보를 이력추적관리번호·LOT번호 단위로 담는 건별 원천 데이터로, 제조일자·유통기한·제조공장과 소재지·제조국·생산수량 단위·인증 여부·유전자재조합 여부·OEM 여부 등을 전국 범위로 제공한다. 소비자가 손에 든 제품의 이력추적번호로 언제 어느 공장에서 만들어졌는지 확인하거나, 분석가가 회수 대상 LOT의 제조공장·유통기한을 추적하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 업체코드(ENTP_CD)나 제품명·업체명 매칭으로 식품 인허가 업소·회수/부적합 정보·수입식품 데이터와 이어 쓴다.
description_portal: 식품의약품안전처에서는 안전한 식품선택을 위한 소비자의 알 권리를 보장하고, 식품의 안전성 확보를 위한 신속한 유통차단과 회수조치를 위해제조·가공단계부터 판매단계까지 각 단계별로 이력추적정보를 기록·관리하여 정보를 제공하고 있습니다.해당데이터는 식품제조 이력추적제품의 생산정보에 대한 제품에 대한 인증여부,유전자재조합여부,OEM여부,제조 수입 업체코드,식품이력추적관리번호,LOT번호,제조일자,유통기한,기타,제조공장,제조공장소재지,수입신고기관,유전자재조합표시,이미지 Seq,기능성내용,입고일,제품명,수입업체명 당시,비고,사용여부,이력추적관리번호 유형,생산수량_단위,제조국에 대한 속성정보 등 식품제조 이력추적 제품의 공개된 세부 정보를 확인할 수 있습니다.
