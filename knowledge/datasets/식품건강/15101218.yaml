summary_user: 대구광역시 군위군에 있는 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번주소·영업장면적·전화번호·급수시설을 제공한다(CSV 약 4KB 규모의 소규모 목록). 군위군 안의 식품 제조업체 위치와 규모를 확인하거나, 지하수를 쓰는 제조소를 골라 수질 점검 대상을 정하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키는 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 잇는다.
description_portal: 대구광역시 군위군에 위치한 식품제조가공업소에 대한 데이터로 업종명, 업소명, 도로명주소, 지번주소, 영업장면적, 전화번호, 급수시설의 항목을 제공합니다. 식품을 제조·가공하는 사업체의 위치, 규모, 위생 인프라 현황 등을 파악하기 위한 핵심적인 행정·위생 관리용 기초 데이터입니다. 이 데이터는 식품위생관리, 식중독 예방, 정책 수립, 지역산업 분석, 식품안전 인증 관리(HACCP) 등에 다양하게 활용됩니다. 업종명은 업종별 식품안전 점검 대상 구분, 제조업 허가통계 및 지역 식품산업 구조 분석, HACCP, 표시기준, 자가품질검사 등 적용기준 결정에, 업소명은 업체 검색 및 민원 대응, 식약처, 보건소, 지방자치단체 점검 명부 관리, 통계·시장조사 시 업소 단위 식별에, 도로명주소는 GIS 기반 분포도 시각화(지역 클러스터 분석), 식중독 발생시 주변 제조소 역학조사, 물류/유통 연계시설과의 거리 분석에, 영업장면적은 시설 규모별 안전관리 등급 설정, 대형 사업장에 대한 집중 위생점검 우선 대응 분류, 생산 가능 용량을 추정하여 유통시장 영향도 평가에, 급수시설은 수질 안전 점검 및 위생 우선 점검 지역 구분에 활용됩니다. 지하수 사용 사업장은 별도 수질검사 의무 대상이며, 식중독 사고 역학조사 시 원인 규명 항목으로 중요합니다.
