summary_user: 식중독 발생 현황을 발생년·발생월·원인물질(바이러스·세균 등)별로 묶어 발생건수와 환자수를 담은 전국 단위 집계 자료로, 개별 사고 건별 원천이 아니다. 식품안전 분석가나 언론·연구자가 "노로바이러스 식중독은 어느 달에 많이 발생하고 환자는 얼마나 되나" 같은 원인물질별·시기별 추세를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연·월이나 원인물질 이름을 맞춰 연결해야 하며, 같은 식약처의 회수·판매중지·부적합 등 식품안전 경보 자료와 시기를 기준으로 함께 본다.
description_portal: 식품의약품안전처에서 관리하는 식중독 원인물질별 정보 자료입니다.식중독 발생정보를 발생년 , 발생월 , 발생물질 , 발생건수 , 환자수 정보 목록으로 제공이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
