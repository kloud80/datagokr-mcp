summary_user: 서울 은평구 내 단란주점 영업장을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·인허가일자·영업상태·폐업일자·주소·시설면적과 중부원점TM(EPSG:2097) 좌표를 포함한다. 구민이나 분석가가 '은평구에 현재 영업 중인 단란주점은 몇 곳이고 어느 동네에 몰려 있는가'를 확인하거나, 행정기관이 유흥업소 분포와 단속 대상을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드로만 연결하며, 같은 형식의 다른 자치구 식품 인허가 데이터와 합쳐 쓰기 쉽다.
description_portal: '은평구의 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 손님이 노래를 부르는 행위가 허용되는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.단란주점영업 인허가 정보는 지역 내 단란주점의 위치, 운영형태, 인허가일자 등  기본적인 영업 정보가 포함된 데이터로서 유흥업소 관리와 관련된 정책자료로 활용됩니다.  공공치안 강화, 지역민의 생활환경 보호, 음주 관련 사고 예방 등의 목적에 따라  영업장 수와 분포 현황을 파악할 수 있으며, 공공질서 관리의 기반이 됩니다.  또한 행정기관의 유흥업소 단속, 사회안전망 기획, 민원 대응 등 행정 수요에도 기여하며,  청소년 보호 및 지역 사회 정서적 안정 유지를 위한 데이터로도 유의미합니다.'
