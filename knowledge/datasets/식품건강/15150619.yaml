summary_user: 식품의약품안전처의 식품 관련 행정처분 결과를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 제공하며, 업소 단위 처분 이력을 건별로 담는다(업소명, 업종, 처분 유형·내용, 위반 내용, 처분 기간, 처분기관 등). 소비자나 분석가가 '이 식당이나 식품업체가 과거에 영업정지 같은 처분을 받은 적이 있는지, 위반 내용은 무엇인지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 식품 인허가 업소·위생 지정 데이터와는 인허가번호로 보이는 필드(LCPMT_NO)나 업소명·주소를 매핑해 연결해야 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 행정처분결과 정보입니다.
