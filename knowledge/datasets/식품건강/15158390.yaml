description_portal: '본 데이터는 전북특별자치도_식품제조분야 스마트공장 구축 및 보급현황(2020~2025)을 상세히 제공합니다. 전주 시, 군산시, 익산시 등 도내 시군별 스마트공장 구축 사업 참여 기업명, 소재지 주소, 사업 완료 연도, 기술수준 정보를 포함합니다. 전북 지역 식품 산업의 디지털 전환 현황과 지역별 스마트화 분포를 파악하여 지역 밀착형 산업 정책 수립 및 스마트 제조 생태계 분석을 위한 기초 자료로 활용할 수 있습니다. 또한 시군별 스마트공장 보급률 산출 및 디지털 전환 속도 비교 분석이 가능합니다.  최신 구축 현황을 체계적으로 관리하고 있습니다. 구축연도와 최종구축완료연도가 모두 포함되어 있어, 이용자들이 구축 소요 기간까지 분석할 수 있다는 점이 이 데이터의 큰 장점이 될 것 같습니다. * 기술수준 정의기초: 생산 이력 관리 및 집계 자동화 단계 중간1: 실시간 공정 모니터링 및 생산 최적화 단계 중간2: 실시간 제어 및 데이터 기반 지능형 예측 단계'
