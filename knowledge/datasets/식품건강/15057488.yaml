summary_user: 식품위생법에 따라 기구 및 용기·포장에 대해 한시적 기준 및 규격을 인정받은 건을 인정번호(LIMIT_STDR_STND_RCOGN_NO)별로 담은 전국 단위 현황으로, 인정일자·업소명·대표자·제품명·재질명·제조국 등을 포함한다. 식품 용기·포장 제조·수입 사업자나 분석가가 "특정 재질의 용기가 한시적 기준·규격 인정을 받았는지, 어느 업소가 언제 인정받았는지"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식품 인허가·안전 데이터와는 업소명이나 제품명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 식품위생법에 따른 기구 및 용기.포장의 한시적 기준 및 규격 인정 현황 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
