summary_user: 기구 등에 쓰는 살균소독제 가운데 한시적 기준·규격을 인정받은 제품을 인정 건별로 담은 전국 단위 목록으로, 인정번호·인정일자·업소명·대표자명·전화번호·제조회사·제조국가·제품명을 담는다. 식품 조리·제조 업소나 소독제 수입·판매 사업자가 '이 살균소독제가 한시적 기준·규격 인정을 받았는지, 언제 누가 인정받았는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 업소명·제품명 같은 이름 매칭으로만 식품 인허가 업소나 회수·행정처분 자료와 이어 쓸 수 있다.
description_portal: 식품의약품안전처에서 관리하는 기구등의 살균소독제 한시적 기준 및 규격 인정 현황 자료입니다. 인정번호 , 인정일자 , 업소명 , 대표자명 , 전화번호 , 제조회사 , 제품명 , 제조회사 국가의 속성정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
