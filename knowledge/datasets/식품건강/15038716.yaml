summary_user: 인천광역시 중구 안의 일반음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·도로명 소재지·전화번호·데이터기준일자를 담는다(CSV 약 229KB). 주민이나 창업 준비자가 '중구 특정 도로·동네에 어떤 일반음식점이 몇 곳 있고 연락처는 무엇인가'를 확인하거나 상권 분포를 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표)가 없어 다른 데이터와는 업소명·도로명 주소 문자열 매칭이나 같은 기관 자료끼리만 이어 쓴다.
limits: 인허가번호·사업자번호·좌표 같은 공통 키가 없어 전국 식품 인허가 원장이나 행정처분 자료와 정확히 연결하기 어렵고, 주소 기반 매칭이 필요하다. 범위는 인천 중구 한 시군구로 한정되며 휴게음식점 등 다른 업종은 담지 않는다.
