summary_user: 식품이력추적관리에 등록된 제품을 건별로 담으며, 제품명·바코드·식품유형·제조구분·업체명과 주소·업종·품목보고번호·이력추적번호·제조일자 등을 포함하고 범위는 전국이다. 소비자나 유통업자가 손에 든 제품의 바코드로 이 제품이 이력추적관리 등록 제품인지, 어느 업체가 언제 만들었는지 확인하는 데 쓴다. 실측상 전역 조인 키는 없지만 품목제조보고번호(PRDLST_REPORT_NO)와 바코드(PDT_BARCD)로 품목제조보고·바코드·영양성분 등 같은 기관의 식품 제품 DB와 제품 단위로 잇고, 업체명으로 식품 인허가 업소·회수/행정처분 데이터와 이름 매핑해 연결한다.
description_portal: 식품이력 추적관리 등록 현황 관련 정보를 제공합니다. 속성정보로는 등록제품, 제품명, 바코드, 식품유형, 제조구분, 주소, 업체명, 업종, 식품구분, 품목보고번호, 제조일자 등이 있습니다.이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 창업과 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
