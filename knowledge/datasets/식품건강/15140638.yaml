summary_user: 서울 은평구에서 제과점·즉석판매제조가공업 등 특정 업종에 속하지 않고 마트·슈퍼처럼 일정 규모 이상 매장에서 식품을 파는 업소의 인허가 원장으로, 업소 한 곳당 한 행에 상호·지번/도로명 주소·인허가일·영업상태·폐업일·매장 면적·중부원점TM 좌표(X, Y) 등을 담는다. 주민이 우리 동네에서 영업 중인 마트·슈퍼가 어디인지 확인하거나, 분석가가 인허가·폐업 일자로 은평구 식료품 판매점의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 식품 인허가 데이터와는 관리번호(MGTNO)나 자치단체 코드(OPNSFTEAMCODE)처럼 같은 기관 체계의 코드, 또는 상호·주소 매칭으로 잇는다.
description_portal: '은평구의 제과점, 즉석판매제조가공업, 유통판매업 등에 속하지 않고 마트와 같은 일정 규모 이상의 영업장에서 식품을 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 제과점, 즉석판매제조가공업 등 특정 업종에 속하지 않으면서, 마트나 슈퍼마켓처럼 일정 규모 이상의 매장에서 다양한 종류의 식품을 종합적으로 판매하는 업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같은 지역의 필수 생활 기반 시설 운영에 대한 핵심 행정 정보가 포함되어 있습니다 .이 데이터를 통해 주민들은 거주지 주변의 마트, 슈퍼 등 필수 식료품 구매처의 위치와 운영 현황을 파악하여 생활 편의성을 높일 수 있습니다. 또한, 인허가 및 폐업 현황의 시계열 분석은 지역 상권의 변화, 골목상권의 부흥과 쇠퇴, 그리고 대형 유통업체와 중소형 마켓 간의 경쟁 구도를 파악하는 중요한 지표가 됩니다. 이는 지자체가 지역 주민의 안정적인 식품 공급망을 확보하고, 소상공인 지원 및 지역 경제 활성화 정책을 수립하는 데 필수적인 기초 자료로 높은 활용 가치를 지닙니다 .'
