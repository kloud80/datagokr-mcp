summary_user: 경기도 연천군 관내 식품판매 관련 영업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 8.8KB)로, 업종명·업소명·도로명/지번 소재지·전화번호를 담는다. 업종은 식품자동판매기영업, 유통전문판매업, 집단급식소 식품판매업, 기타식품판매업으로 나뉜다. 주민이나 사업자가 연천군에서 식자재 유통업체나 급식 납품 업체가 어디에 있는지, 다중이용시설 자동판매기 영업이 어느 정도인지 확인하는 데 쓰며, 공통 조인 키가 없어 다른 식품 인허가 데이터와는 업소명·주소 문자열 대조로만 이어 쓴다.
description_portal: 본 자료는 연천군 관내에서 영업 중인 식품 관련 업소 현황을 업종별로 정리한 것이다. 업종명, 업소명, 소재지(도로명), 소재지(지번), 소재지 전화번호 항목으로 구성되어 있으며, 식품 유통 및 판매와 관련된 기본 정보를 체계적으로 제공한다. 업종은 식품자동판매기영업, 유통전문판매업, 집단급식소 식품판매업, 기타식품판매업 등으로 구분되어 있으며, 각 업종별로 다양한 형태의 업소가 포함되어 있다. 식품자동판매기영업에는 편의점, 금융기관, 터미널, 의료기관, 문화시설 등 다중이용시설 내 자동판매기 운영 업소가 다수 포함되어 있어 일상생활과 밀접한 유통 환경을 확인할 수 있다. 유통전문판매업에는 농산물 가공·유통 법인, 농업회사법인, 지역 특산물 생산·판매 업체 등이 포함되어 있으며, 생산지와 연계된 식품 유통 구조를 파악하는 데 활용할 수 있다. 집단급식소 식품판매업은 농협, 영농조합법인, 급식 납품 업체 등 단체 급식과 관련된 영업소 정보로 구성되어 있다. 기타식품판매업에는 대형마트, 식자재 유통업체, 프랜차이즈 유통점 등이 포함되어 있다.
