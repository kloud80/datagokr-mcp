summary_user: 서울특별시 광진구 관내 단란주점 영업 인허가 업소를 업소 한 곳당 한 행으로 담은 원장으로, 관리번호·인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표·시설 규모 등을 포함한다. 광진구에서 현재 영업 중인 단란주점이 어디에 몰려 있는지, 언제 개업·폐업했는지를 확인하려는 주민·분석가·행정 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구나 다른 업종 인허가 데이터와는 같은 기관 코드(OPNSFTEAMCODE)와 주소·업소명 매칭으로만 잇는다.
description_portal: 이 데이터는 서울특별시 광진구 관내 단란주점 영업을 위해 인허가를 받은 업소에 대한 현황 정보를 제공합니다.단란주점은 「식품위생법」 및 「공중위생관리법」에 따라 분류되는 유흥접객영업의 한 형태로, 주로 주류와 간단한 음식류를 함께 제공하며, 손님이 노래를 부를 수 있는 시설(노래방기기 등)이 허용된 영업장입니다.제공 항목에는 업소명, 영업소재지, 인허가일자, 영업상태, 업종 구분, 관리기관 정보 등이 포함되어 있으며, 이는 주류 판매업소 관리, 유흥시설 밀집도 분석, 생활환경 영향 평가 등 다양한 행정 및 정책적 활용에 이용됩니다.또한 청소년 출입 제한 업소 관리, 공공질서 유지, 위생 점검 대상 선별 등에도 필요한 데이터입니다.※ 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준의 좌표만 포함되며, 위도·경도 좌표는 제공되지 않습니다.※ 본 데이터는 3일 전 기준 최신 인허가 현황을 반영하고 있습니다.
