description_portal: 본 데이터는 경상남도 사천시 관내에서 운영 중인 의료기관(병원 등) 부설 집단급식소의 현황 정보를 제공합니다. 관내 병원급 이상 의료기관에서 환자 및 종사자에게 음식을 제공하는 집단급식소의 전반적인 운영 형태와 규모를 파악할 수 있는 기초자료입니다. 주요 제공항목으로는 급식소가 위치한 병원의 명칭., 정확한 소재지 파악을 위한 주소, 급식시설이 병원에 의해 직접 운영되는지 또는 외부 전문 업체에 맡겨 운영되는지를 구분하는 내용이 포함되어있습니다. 또한 해당 의료기관의 규모와 급식 공급 잠재 능력을 가늠할 수 있는 지표인 허가 병상 수를 함께 수록하여 데이터의 활용 가치를 높였습니다. 마지막으로 데이터의 신뢰성과 최신성을 보장하기 위해 데이터기준일을 명시하고있습니다.
