summary_user: 부산광역시 부산진구에 신고된 목욕장업소를 업소 한 곳당 한 줄로 담은 파일로, 업종명·신고일자·업소명·도로명/지번 주소를 담는다(CSV 약 10KB). 부산진구 주민이 동네 목욕탕·사우나 위치를 찾거나, 분석가가 구 안 목욕장업소의 신고 시기와 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공중위생업소·인허가 데이터와는 업소명이나 주소 문자열 매칭으로만 이어 쓴다.
limits: 부산진구 한 개 시군구만 담아 부산 전체나 다른 구와 비교하려면 각 구 자료를 따로 모아야 한다. 업소 코드 같은 공통 키가 없어 다른 데이터와 연결할 때 이름·주소 매칭 오류에 주의해야 한다.
