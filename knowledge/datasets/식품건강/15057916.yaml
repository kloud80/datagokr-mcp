summary_user: 경기도 내 찜질시설서비스영업에 해당하는 목욕장업 업소를 업소별로 담는 자료로, 시군·업소명·인허가일·영업상태·폐업일·소재지 면적·다중이용업소 여부·주소와 위경도 좌표가 들어 있다. 지역 주민이나 상권 분석가가 '우리 시군에서 지금 영업 중인 찜질방은 어디이고, 그중 다중이용업소는 몇 곳인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)·시군명, 주소나 좌표를 기준으로 같은 기관의 다른 공중위생업소 현황이나 행정구역 자료와 맞춰 잇는다.
description_portal: 이 데이터는 경기도의 찜질시설 서비스 영업장을 포함한 목욕장업 현황을 기록한 자료로, 인허가 및 영업 상태 관리와 공중위생 정책 수립에 활용됩니다. 목욕장업(찜질시설 서비스 영업)은 목욕을 할 수 있는 시설 및 설비 등의 서비스 또는 맥반석·황토·옥 등에 직접, 간접적으로 가열하여 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스를 제공하는 업체(소) 중 찜질시설서비스 등에 해당되는 업체(소)입니다. 이를 이용하여 다중이용업소 여부와 영업상태 정보를 활용하여 안전관리, 위생 관리 및 지역 상권 분석에 적용할 수 있습니다.
