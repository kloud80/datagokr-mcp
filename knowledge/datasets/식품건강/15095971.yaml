summary_user: 대구광역시 북구가 안심식당으로 지정한 음식점을 업소 한 곳당 한 행으로 담으며, 업소명·업종·소재지·지정일을 제공한다. 북구 주민이나 방문객이 '이 동네에서 덜어 먹는 도구와 위생 관리 기준을 갖춘 안심식당이 어디인가'를 찾을 때 쓰고, 분석가는 업종별·지정 시기별 분포를 보는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 업소명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 코로나19 예방을 위해 정부는 일반음식점과 휴게음식점 가운데 위생 관리를 잘 지키는 식당을 ‘안심식당’으로 지정하고 있습니다. 안심식당이 되기 위해서는 손님이 함께 쓰는 음식을 나눠 먹을 수 있도록 집게나 국자 같은 덜어 먹는 도구를 준비하고, 수저는 개별 포장하거나 깨끗하게 관리해야 합니다. 또한 일하는 사람은 항상 마스크를 착용하고, 식당 안은 자주 환기하고 소독해야 합니다. 이 기준을 모두 지킨 업소는 안심식당으로 지정되며, 그 정보를 시민들이 쉽게 확인할 수 있도록 제공합니다. 정보 항목에는 지역(시도, 시군구), 식당 이름, 주소, 대표자 이름, 업종, 업종 상세, 전화번호, 지정된 날짜 등이 포함됩니다. 이 정보를 통해 시민들은 더 안전하고 믿을 수 있는 식당을 고를 수 있습니다.
