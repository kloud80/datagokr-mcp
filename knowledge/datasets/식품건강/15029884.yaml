summary_user: 대전광역시 중구에 있는 미용업소를 한 곳씩 담은 현황 파일로, 업종(일반미용·네일·피부미용·화장분장 등), 업소명, 도로명·지번 주소, 전화번호를 담는다. 주민이나 사업자가 중구 안에서 네일숍이나 피부미용실이 어디에 몇 곳 있는지 찾거나, 개업 전에 동네별 경쟁 업소 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 맞춰 붙여야 하며, 다른 공중위생업소 현황이나 인허가 데이터와 이을 때도 같은 방식으로 맞춘다.
description_portal: 본 공공데이터는 대전광역시 중구에 위치 미용업현황 (업종명(미용, 네일, 일반, 피부 등), 업소명, 영업소 주소, 소재지전화 등)데이터를 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.데이터 기준일과 데이터 활용일 간 격차로 인해 현황정보가 상이할 수 있으니 참고하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 업종명은 일반미용업, 네일업, 피부미용업, 화장분장 미용업 등으로 구분되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
