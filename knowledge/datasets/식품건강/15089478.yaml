summary_user: 인천광역시 서구(서해구) 안의 식품소분업 영업체를 업소 한 곳당 한 행으로 담은 파일이며, 업소명·업종명·도로명 소재지·전화번호·데이터기준일자가 들어 있다. 소비자나 유통 사업자가 '서구에서 대용량 식품을 나눠 담아 파는 업체가 어디에 있고 연락처가 무엇인가'를 확인하거나, 위생 지도 대상 업소 목록을 정리할 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 업소 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 지역 내 식품소분업 영업체 현황을 수록한 자료입니다. 본 자료는 인천광역시 서구 내 식품소분업체의 업소명, 소재지, 전화번호, 업종명 등의 정보가 포함되어 있습니다. 식품소분업은 대량으로 제조된 식품을 소분하여 판매하는 업체로, 각 식품소분업체의 위치와 연락처 등은 소비자에게 유용한 정보로 활용될 수 있을것으로 판단됩니다. 본 자료로 업소의 식품 유통관리 및 위생 지도 업무 등에 활용 될 수 있을것입니다. 본 데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
