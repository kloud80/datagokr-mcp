summary_user: 대구광역시 동구가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 업소명·주소·전화번호·주메뉴를 담는다. 동구 주민이나 방문객이 '동구에서 위생·서비스가 우수하다고 지정된 식당 중 원하는 메뉴를 파는 곳은 어디인가'를 찾을 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대구광역시 동구에서 보유중인 모범음식점 현황 공공데이터는  식품위생법(제47조)에 근거해, 위생 상태 및 서비스 수준이 우수한 일반음식점을 지자체에서 지정하는 제도입니다목적은 위생 수준 향상, 건강한 음식문화 조성, 소비자 선택권 보장에 있으며, 1994년부터 시행되었습니다모범음식점 제도는 업주의 자발적 위생·서비스 개선을 유도하고, 소비자에게는 신뢰할 수 있는 외식 선택지를 제공하며, 지역사회 음식문화의 전반적인 품질 향상에 기여하는 중요한 정책 수단입니다해당데이터는 업소명, 주소, 전화번호, 주메뉴 등의 데이터를 포함하고 있습니다.
