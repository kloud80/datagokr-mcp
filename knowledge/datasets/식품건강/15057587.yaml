summary_user: 경기도 시군별 라이브카페(유흥주점 중 생음악 공연 업태) 인허가 업소를 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·폐업일자·영업상태, 도로명·지번 주소와 위경도 좌표, 소재지면적·종업원수·다중이용업소 여부를 포함한다. 시군 공무원이나 상권 분석가가 '우리 시에서 영업 중인 라이브카페는 어디에 몰려 있고 다중이용업소로 관리되는 곳은 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 경기도 식품·위생 인허가 데이터, 행정구역 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 라이브카페의 운영 현황을 담고 있으며, 주류 제공과 함께 생음악 공연이 가능한 유흥업소의 인허가 정보를 제공합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태명, 소재지 도로명 및 지번주소, 우편번호, 위도·경도 좌표, 소재지면적, 총시설규모, 급수시설구분, 건물소유구분, 위생업종명, 위생업태명, 다중이용업소 여부, 총종업원수 등이 포함되어 있습니다. 해당 데이터는 유흥업소의 분포와 시설 규모, 안전관리 및 위생관리 평가, 지역별 유흥문화 실태 분석 등에 활용할 수 있으며, 행정안전부에서 제공하고 경기도 31개 시군의 인허가 데이터를 기반으로 구성됩니다.
