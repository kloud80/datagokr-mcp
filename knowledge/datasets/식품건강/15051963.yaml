summary_user: 부산광역시 서구가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종·업태·업소명·도로명/지번 주소·대표 메뉴·전화번호·지정일자·재지정일자와 위도·경도를 포함한다. 서구 주민이나 방문객이 '서구에서 위생 관리가 검증된 모범음식점은 어디이고 언제 지정·재지정됐나'를 확인하거나, 분석가가 지역 외식업소 위생 지정 현황을 지도로 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장이나 행정처분 데이터와는 업소명·주소 매칭으로만 연결하고, 위도·경도로 다른 위치 데이터와 공간 결합한다.
description_portal: 식품위생법에 따른 부산광역시 서구 모범음식점에 대한 데이터이다.식품의약품안전처 예규(모범업소 지정 및 운영관리 규정)에 따라 매년 10월에 정기적으로 모범업소 지정의 적합여부를 재심사 한 결과이다. 영업정지 이상의 행정처분 또는 폐업, 소재지 이전 등의 변경이 있을 경우 상시 지정 취소 될 수 있다현재 9개소의 모범업소가 지정되어 있으며,업종명 ,업태(분식,한식 등) 업소명, 소재지 주소, 전화번호, 지정일자, 재지정일자 에 대한 데이터를 공개한다모범업소에 대한 지원 및 세부 지정기준은 식품의약품안전처 예규에 따른다.
