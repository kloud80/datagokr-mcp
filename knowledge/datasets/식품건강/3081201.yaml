description_portal: '본 데이터는 부산광역시 동래구 관내에서 등록된 식품제조·가공업소의 현황을 수록한 자료로자료는 CSV 형식으로 제공되며, 다음과 같은 주요 항목으로 구성되어 있습니다:업소명: 제조·가공업소의 공식 등록 상호명업종: 일반식품제조업, 건강기능식품 제조업 등 업종의 세부 분류전화번호: 해당 업소의 대표 연락처도로명주소: 도로명 기반 주소로 위치 식별 가능지번주소: 토지대장 기준의 지번 주소 (참고용)우편번호: 행정용 우편번호본 데이터는 정기적으로 갱신되며, 제공된 정보 외에 보다 상세한 사항이 필요할 경우,부산광역시 동래구청 환경위생과를 통해 문의 및 확인하시기 바랍니다.'
