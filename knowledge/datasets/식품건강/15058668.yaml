summary_user: 경기도 31개 시군에서 식품위생법에 따라 인허가된 식품운반업체를 업소 한 곳당 한 행으로 담은 원장으로, 사업장명·인허가일자·영업상태·폐업일자·주소·위경도 좌표·종업원수·보증금과 월세 등이 들어 있다. 물류기업이나 분석가가 "경기도 어느 시군에 냉장 식품운반업체가 몰려 있고, 그중 영업 중인 곳은 몇 곳인가" 같은 질문에 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 주소·좌표, 사업장명으로 다른 식품 인허가 업소 데이터나 지역 통계와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군에서 식품위생법에 따라 인허가된 식품운반업체의 정보를 수록한 자료로, 부패나 변질이 쉬운 유산균 음료, 어류 및 가공품 등의 위생적 운반을 담당하는 업체를 포함합니다. 데이터 항목에는 사업장명, 업태명, 인허가일자, 소재지 주소 및 전화번호, 위도·경도 좌표, 시설면적, 총종업원수 및 성별 종사자수, 영업상태, 보증금 및 월세 금액, 건물 소유구분, 등급 구분, 전통업소 지정번호 및 음식명 등 다양한 경영 및 시설 정보를 포함하고 있습니다. 본 데이터는 공공기관, 연구기관, 물류기업 등이 식품유통 구조 분석, 운반 위생관리 실태 파악, 정책 수립 및 지역 맞춤형 지원 계획 수립에 활용될 수 있으며, Open API를 통해 인증키만으로 호출 제한 없이 XML 또는 JSON 형식으로 이용 가능합니다.
