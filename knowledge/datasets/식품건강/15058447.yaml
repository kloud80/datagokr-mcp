description_portal: 식품의약품안전처에서 제공하는 ‘생동성인정품목 조회’ 데이터는 의약품의 동등성을 입증하기 위해 수행된 생물학적 동등성 시험 결과를 근거로 인정된 품목 현황을 제공합니다.이 데이터에는 품목기준코드, 품목명, 성분명, 제형, 함량, 업체명, 생동성 인정 공고일자 등이 포함되어 있습니다.이를 통해 의료기관과 환자는 안전하고 신뢰할 수 있는 의약품 선택이 가능하며, 제약사는 의약품 개발 및 품질관리 전략 수립에 활용할 수 있습니다. 또한 보건당국은 의약품 허가·심사, 정책 수립, 연구·분석 등 다양한 분야에서 본 데이터를 활용하여 국민의 안전한 의약품 사용을 지원합니다.
