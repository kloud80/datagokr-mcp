summary_user: 생물학적 동등성 시험 결과로 인정받은 의약품을 품목 단위로 담으며, 품목기준코드·품목명·업체명·성분명·함량·제형·생동성 인정 공고일자가 들어 있고 범위는 전국입니다. 약사·환자가 특정 성분의 복제약 가운데 생동성을 인정받은 제품과 그 공고 시점을 확인하거나, 분석가가 업체별·성분별 인정 현황을 집계하는 데 씁니다. 전역 조인 키는 없으므로 같은 식약처 의약품 데이터와는 품목기준코드(ITEM_SEQ)로, 업체 정보와는 사업자등록번호나 업체명 매핑으로 연결합니다.
limits: 실측 컬럼에서 다른 기관 데이터와 바로 붙는 공통 키가 확인되지 않아 외부 연계는 이름·코드 매핑에 기대야 합니다. 포털 분류는 식품 제품 DB지만 내용은 의약품이라 식품의 품목제조보고번호·바코드로는 조인되지 않습니다. 개발계정은 하루 10,000회로 호출이 제한됩니다.
