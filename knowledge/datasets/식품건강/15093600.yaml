summary_user: 광산구 관내 일반음식점·휴게음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·인허가일자·업소명·도로명/지번 주소·전화번호·데이터 기준일자를 제공한다. 창업 예정자나 상권 분석가가 '광산구 특정 동네에 휴게음식점(카페·분식 등)이 얼마나 몰려 있고 언제 인허가가 났는가'를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관 자료끼리로만 잇는다.
description_portal: '광주광역시 광산구 음식점 현황입니다.일반음식점의  인허가일자, 업소명, 도로명주소, 지번주소, 전화번호 , 데이터 기준일자를 제공하며휴게음식점의  인허가일자, 업소명, 도로명주소, 지번주소, 전화번호, 데이터 기준일자전화번호는 휴대폰번호를 제외하고 제공업종 종류는 식품위생법  따라 분류하였습니다.* 일반음식점 : 음식물을 조리 판매하는 영업으로서 식사와 함께 부수적으로 음주행위가 허용되는 영업* 휴게음식점 : 다류, 아이스크림을 조리 판매하거나 폐스트푸드, 분식류 형태의 영업 음주행위를 허용되지 아니하는 영업'
