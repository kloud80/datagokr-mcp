description_portal: '입력 파라미터를 이용하여 대구광역시 서구_나트륨줄이기 실천업소 현황의 등록번호, 업소 명, 도로명주소, 연락처 항목을 제공하는 서비스[용어정의]나트륨줄이기 실천업소: 국민영양관리법에 따라 나트륨 저감화 기준을 충족하고, 고객에게 저염 메뉴 제공, 조리 시 염분 사용 최소화 등의 실천 기준을 따르는 업소입니다.[표지 및 혜택]1. "나트륨줄이기 실천업소" 현판 또는 스티커 부착2. 지자체나 보건소 홈페이지 및 홍보자료에 업소 정보 노출3. 일부 지자체는 위생점검 우대, 홍보 지원, 식자재 지원 등의 혜택 부여[신청방법]1. 관할 보건소 또는 지방자치단체에 신청2. 현장 점검 및 나트륨 기준 충족 여부 확인3. 기준 충족 시 지정 및 인증서 교부'
