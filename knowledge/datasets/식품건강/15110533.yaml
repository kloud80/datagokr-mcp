summary_user: 대구광역시 서구가 지정한 나트륨줄이기 실천업소를 업소 한 곳당 한 건으로 담으며, 등록번호·업소명·도로명주소·연락처를 제공한다. 서구 주민이나 방문객이 '근처에 저염 메뉴를 내는 식당이 어디 있나'를 찾거나, 보건 담당자·분석가가 지정 업소 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 업소명·도로명주소(RDNMADR) 매칭으로만 이어 쓴다.
limits: 인허가번호·사업자번호 같은 공통 키가 없어 다른 업소 데이터와 정확히 연결되지 않고, 이름·주소 매칭에 의존해야 한다. 범위는 대구 서구 한 곳뿐이다.
