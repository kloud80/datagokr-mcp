description_portal: 서울시 공공급식 상위(대표)식재료 정보는 공공급식에서 사용하는 식재료를 체계적으로 분류하고 표준화하기 위한 데이터입니다. 대분류명, 중분류명, 소분류명으로 식재료를 단계적으로 나누어 관리하며, 상위식재료명과 설명을 통해 각 식재료의 대표 개념과 사용 범위를 명확히 제시합니다. 이를 통해 어린이집, 학교, 복지시설 등 다양한 공공급식 기관에서 식재료 명칭과 분류 기준을 통일할 수 있어, 식재료 관리의 효율성을 높이고 통계 분석, 식단 관리, 원산지 및 안전 관리 등과의 연계 활용이 용이해지는 기반 자료입니다.
