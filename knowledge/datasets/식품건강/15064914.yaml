summary_user: 우수수입업소로 등록된 수입업체의 속성정보를 업체·등록 건별로 담으며, 업소명·주소·인허가번호, 우수수입업소 등록번호와 등록(허가)일자, 수출국과 해외제조업소명, 품목명·품목 수를 포함하고 범위는 전국 비공간 자료다. 수입식품 유통업자나 소비자가 특정 수입업체가 어느 나라 어떤 해외제조업소의 어떤 품목으로 우수수입업소에 등록돼 있는지 확인할 때 쓴다. 전역 조인 키는 없으므로 인허가번호(LCNS_NO)나 업소명으로 식약처의 다른 수입식품·식품 인허가 업소 자료와 이름·코드 매핑해 잇는다.
description_portal: 우수수입업소 등록제도는 수입식품 등 수입자가 해외제조업소의 위생관리 상태를 사전 점검하고 현지실사 등을 통해 기준 적합 여부를 확인 후 등록하는 제도입니다. 이에 대한 등록 업체의 속성정보를 제공합니다. 우수수입업소 등록 현황은 '식품안전나라>식품·안전>수입식품>우수수입업소'에서 매월 파일(pdf)로 현행화하고 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
