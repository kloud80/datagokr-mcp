description_portal: 해당 데이터는 수원시 모범음식점 지정 현황(4개구 154개소)입니다.(모범업소명, 소재지주소, 위도, 경도, 전화번호, 지정일자, 최신지정일자, 업태, 대표메뉴 정보로  구성된 데이터입니다)모범음식점은 식품접객업소의 위생적 개선과 서비스수준 향상을 도모하고 낭비적인 음식문화를 개선하는 등의 녹색 음식문화 조성에 기여하는 것을 목적으로 지정된 업소입니다.모범음식점의 지정기준은 1. 건물의 구조 및 환경 2. 주방시설 3. 원재료의 보관 및 운반시설 4. 종업원의 서비스 5. 제공반찬과 가격표시로,일반음식점 수의 5%이내의 업소만 모범음식점으로 지정될 수 있습니
