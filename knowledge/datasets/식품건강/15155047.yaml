summary_user: 외국에서 제조한 담배를 수입해 국내에 판매하는 업체의 인허가 정보를 업체 1곳당 1행으로 담는 건별 원천 데이터이며, 전국 750건을 1989-04-29부터 2026-10-01까지 수록한다. 분석가나 사업자가 특정 지역에 담배 수입판매업체가 어느 업체인지, 영업 중인지 휴업·폐업인지 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 주소 키로 다른 주소 기반 데이터와 이어 쓰며, 개방자치단체코드(OPN_ATMY_GRP_CD)와 기준일자는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: '기타_담배수입판매업체 데이터는 외국에서 제조한 담배를 수입하여 국내에 판매하는 업체 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 담배수입판매업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 재정경제부 출자관리과 / 044-215-5176 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
