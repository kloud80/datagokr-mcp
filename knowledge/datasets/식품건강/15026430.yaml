summary_user: 부산광역시 수영구에 설치·운영 신고된 집단급식소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 소재지·소재지 전화번호를 담는다(약 12KB CSV). 수영구 안에서 학교·기업·병원 등 단체급식을 하는 곳이 어디에 있고 연락처가 무엇인지 확인하거나, 관내 급식소 분포를 지도에 올려 보는 데 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 「식품위생법」에 따른 부산광역시 수영구 내 설치,운영 신고된 집단급식소의 공공데이터 입니다. 이번 자료에서는 수영구 관내 집단급식소의 위치와 운영 현황을 체계적으로 파악할 수 있도록 도와주며, 업종명, 업소명, 소재지, 운영구분, 소재지 전화번호 등 항목을 해당 데이터기준일자로 정보를 제공합니다. 이 자료를 통해 수영구에서 운영하고 있는 집단급식소 업소들의 이름과 해당 업소의 소재지 도로명주소 및 지번주소, 소재지 전화번호를 확인할 수 있습니다. 해당 자료는 분기마다 갱신되어 최신 현황을 제공합니다.
