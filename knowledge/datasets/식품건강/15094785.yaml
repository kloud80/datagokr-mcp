summary_user: 식품의약품안전처가 관리하는 진단시약의 품목별 포장단위 정보를 API로 제공하며, 품목일련번호·품목허가번호·품목명·허가일자·취소취하구분·제품명·포장단위명을 품목 단위로 담는다. 진단시약 사업자나 분석가가 특정 진단시약 품목이 어떤 포장단위로 허가·신고되었는지, 취소·취하되었는지 확인하는 질문에 쓴다. 전역 조인 키는 확인되지 않아 품목허가번호(MEDDEV_ITEM_NO)나 품목명 같은 이름·코드 매핑, 또는 같은 기관의 코드로만 다른 데이터와 잇는다.
description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 진단시약 품목별 포장단위정보입니다. 진단시약의 품목 허가 현황과 각 제품의 포장단위를 체계적으로 관리하고 그 정보를 제공합니다. 포장단위 말고도 진단시약 관련된 품목일련번호, 업종구분, 허가신고구분, 품목허가번호, 품목명, 품목허가일자, 취소취하구분, 취소취하일자, 제품명 등의 정보 또한 제공하여 사용자 편의성을 극대화합니다. 이 공공데이터를 통해 사용자는 진단시약 관련된 연관 정보를 한눈에 파악하는데 큰 도움을 받을 수 있습니다.공
