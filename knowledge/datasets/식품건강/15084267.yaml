summary_user: 잔류동물의약품별로 식품(한글·영문 식품명)과 대·중·소분류, 일일섭취량, 잠정기준 적용 여부를 묶은 잔류허용 기준 목록을 전국 단위 비공간 자료로 담는다. 축산물·수산물 생산자나 식품 제조업체, 분석가가 "이 동물의약품은 어떤 식품에 얼마까지 남아도 되며 잠정기준인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 품목·검사·부적합 데이터와는 식품명이나 분류명을 이름으로 맞춰 연결해야 한다.
description_portal: 해당 데이터는 잔류동물의약품별 식품(식품한글명, 식품영문명, 일일섭취량, 잠정기준적용여부, 대분류, 중분류, 소분류 정보 등)에 대한 잔류량 허용 기준 정보를 제공하고 있습니다.해당 데이터를 통해 소비자가 식품 구매 시 잔류동물의약품 정보를 확인하여 안전한 식품을 선택하는 데 활용하고, 식품 제조업체가 제품 생산 과정에서 잔류허용 기준을 준수하여 소비자에게 안전한 제품을 제공하는 데 활용하며, 연구 기관에서 잔류동물의약품의 위해성 평가 및 관리 방안 연구에 활용하는 등의 효과를 기대할 수 있습니다.이를 통해 국민의 먹거리 안전성을 확보하고, 관련 산업의 투명성을 높이며, 식품 안전 관리 체계를 강화하는 데에 기여할 수 있습니다.
