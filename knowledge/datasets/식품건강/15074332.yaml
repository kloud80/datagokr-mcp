summary_user: 수입쇠고기를 선하증권(B/L) 단위로 기록한 건별 유통이력 데이터로, 품목명·부위, 원산지 국가, 수출국 도축장·가공장과 각각의 시작·종료일자, 수출업체·수입업체, 수입일자를 담으며 범위는 전국이다. 소비자나 유통업자가 "내가 산 수입쇠고기가 어느 나라 어느 도축장에서 언제 도축·가공돼 어느 업체를 거쳐 들어왔나"를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 선하증권번호(BL_NO)나 수입업체명·수출업체명 같은 이름을 매칭해 같은 기관의 수입식품 관련 데이터와 잇는다.
description_portal: 선하증권번호 , 수입쇠고기품목명 , 원산지국가명 , 수출국도축장소명 , 수출국도축시작일자 , 수출국도축종료일자 , 수출국가공장소명 , 수출국가공시작일자 , 수출국가공종료일자 , 수출업체명 , 수입업체명 , 수입일자 , 부위명 등을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
