summary_user: 식품별로 어떤 농약이 얼마까지 잔류해도 되는지(잔류허용기준 MRL값)를 식품 한글·영문명, 농약명, 일일섭취허용량, 잠정기준 적용 여부, 식품 대·중·소분류, 시행시점·단계와 함께 기준 항목 단위로 담은 전국 단위 기준 정보다. 농산물 수입·유통 사업자나 검사기관이 "이 작물에 이 농약의 허용 잔류량이 몇 mg/kg인가"를 확인하거나, 분석가가 식품군별 농약 기준을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 부적합·회수 정보나 수입식품 데이터와는 식품명·농약명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 식품한글명, 식품영문명, 농약명, 일일섭취량, 잠정기준적용여부, 대분류, 중분류, 소분류, 시행시점, 단계, MRL값, 기타여부, 폐기여부 등의 항목을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
