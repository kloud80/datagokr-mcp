summary_user: 서울특별시 중구의 식용얼음판매업 인허가 업소를 업소별 한 건씩 담은 원장으로, 관리번호(MGTNO)·인허가일자·영업상태(영업/폐업 등)·폐업일자·지번·도로명 주소·업소명·중부원점TM 좌표 등을 포함한다. 식용얼음 판매업 창업을 준비하는 사업자가 중구 안에서 현재 영업 중인 판매업소가 어디에 몇 곳 있는지 확인하거나, 분석가가 업소 개폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 부문의 다른 식품 인허가 업종 데이터와 주소·좌표 기준으로 함께 본다.
description_portal: '서울특별시 중구의 식용얼음을 전문적으로 판매하는 업소 정보입니다. 데이터는 각 판매업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 식용얼음판매업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 제빙 판매업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민 및 관련 업계 종사자에게는 음용수 수질검사를 철저히 거치고 저장시설 보존 관리기준을 충족하며 안전한 식용얼음을 판매하는 신뢰할 수 있는 판매업소의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
