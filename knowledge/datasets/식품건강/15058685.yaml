summary_user: 축산물 위생관리법에 따라 보고된 축산물 품목제조 내역을 품목(제품) 한 건 단위로 담으며, 업소명·인허가번호·품목제조번호·보고일자·제품명·유형·소비기한·생산종료 여부·고열량저영양식품 여부·어린이기호식품 품질인증 여부를 전국 범위로 제공한다. 소비자나 유통 사업자가 특정 햄·소시지·우유 같은 축산물 제품이 어느 업소에서 언제 품목제조 보고됐고 지금도 생산 중인지 확인하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으나, 품목제조보고번호(PRDLST_REPORT_NO)로 같은 식품 제품 DB의 바코드·영양성분·원재료 자료와, 인허가번호(LCNS_NO)로 식품 인허가 업소·회수/행정처분 자료와 이어 쓰는 것을 기준으로 삼는다.
description_portal: 식품의약품안전처에서 관리하는 축산물 위생관리법에 따른 축산물 품목제조정보 자료입니다. 축산물 품목제조에 대한 속성정보 제공합니다. 속성정보로는 인허가번호 , 업소명 , 품목제조번호 , 보고일자 , 제품명 , 유형 , 생산종료여부 , 고열량저영양식품여부 , 어린이기호식품품질인증여부 , 소비기한 , 업종 , 최종수정일자가 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화, 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
