summary_user: 서울 마포구에서 인허가를 받은 식품운반업소(유산균 음료·어류·조개류처럼 상하기 쉬운 식품을 운반하는 업소)를 업소 한 곳당 한 행으로 담은 인허가 원장이며, 인허가일자·영업상태·폐업일자·주소·좌표·사업장명을 포함한다. 주민·사업자·분석가가 '마포구에서 지금 영업 중인 식품운반업체는 어디이고 언제 폐업한 곳이 있는가'를 확인하거나 위생 관리 대상을 파악하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 개방자치단체코드(OPNSFTEAMCODE)로만 이어 쓰며, 좌표(X·Y)로 다른 식품 인허가 업소 데이터와 위치 기반으로 겹쳐 볼 수 있다.
description_portal: 서울특별시 마포구의 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소 정보에 대한 설명입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민과 행정기관은 관내 식품운반업체의 위치, 서비스 제공 현황 및 운영 상태를 파악하고, 위생 및 안전 관리 정책을 효율적으로 수립할 수 있습니다.
