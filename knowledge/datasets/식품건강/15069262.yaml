description_portal: '경상남도 일반음식점 현황은 도내에서 영업 중인 다양한 일반음식점에 대한 통계 정보를 포함하고 있으며, 김밥(도시락), 복어취급, 뷔페식, 일식, 정종·대포집(선술집), 중국식, 출장조리, 탕류 등 업종별로 분류된 업소 수, 영업 유형, 지역별 분포, 업소 밀집도 등의 현황을 종합적으로 파악할 수 있는 자료입니다. 이를 통해 도내 일반음식점의 운영 실태를 진단하고, 식품위생관리, 창업 지원, 지역 맞춤형 정책 수립 등 행정적 활용은 물론, 외식산업 활성화를 위한 기초 자료로도 활용될 수 있습니다. 또한, 업종 간 분포 특성 분석을 통해 지역별 외식문화의 경향을 이해하고 향후 발전 방향을 모색하는 데 중요한 참고자료로 활용됩니다.식품위생법 시행령 제21조(영업의 종류)8. 식품접객업나. 일반음식점영업: 음식류를 조리ㆍ판매하는 영업으로서 식사와 함께 부수적으로 음주행위가 허용되는 영업'
