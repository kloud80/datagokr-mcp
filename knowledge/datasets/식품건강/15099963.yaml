description_portal: 데이터는 경기도 화성시 관내에서 옥외영업을 실시하고 있는 업소들의 현황을 수록한 자료이다. 수록 항목은 업종명, 업소명, 사업장 주소, 전체 영업장 면적, 건물 내부와 외부의 면적 구분 등으로 구성되어 있다. 본 자료는 도로, 광장, 공원 등 공공장소 또는 건물 외부 공간을 활용하여 이루어지는 야외영업 행위에 대한 실태를 파악하기 위한 목적으로 제공된다. 데이터는 옥외영업 관련 행정관리, 도로 점용허가 검토, 도시환경 정비, 민원 대응 및 정책 수립 등에 활용될 수 있다. 또한, 업종별 야외영업 특성 분석, 공공장소 이용현황 조사 등 다양한 통계적 분석 및 연구 기반자료로도 활용이 가능하다.
