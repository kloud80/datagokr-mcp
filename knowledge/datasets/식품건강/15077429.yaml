summary_user: 부산광역시 안의 음식점 식품안심업소(위생등급) 지정 현황을 업소 한 곳당 한 행으로 담은 파일로, 시군구·업소명·영업장 소재지·업종·지정일자가 들어 있다. 외식할 곳을 고르는 시민이 '우리 동네에서 위생등급을 받은 식당이 어디인가'를 찾거나, 분석가가 구·군별 지정 업소 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 식품 인허가 업소 원장 등과는 업소명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 인허가번호나 표준 코드가 없어 다른 데이터와 정확히 1:1로 연결하기 어렵고, 업소명·주소 매칭에 의존해야 한다. 범위는 부산광역시 한 곳뿐이라 다른 시도와 비교하려면 별도 데이터가 필요하다.
