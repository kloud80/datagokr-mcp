summary_user: 서울시 일반음식점의 인허가 원장을 업소 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·주소·업태·시설 규모·좌표(X, Y) 등이 들어 있다. 창업자나 상권 분석가가 '특정 동네에 영업 중인 한식·중식 음식점이 몇 곳이고 최근 몇 곳이 폐업했는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호·주소나 업소명 매핑으로만 이어 쓰며, 휴게음식점·제과점 등 다른 식품 인허가 업소 데이터와 함께 상권 분석의 기본 자료로 쓴다.
description_portal: '해당 데이터는 서울시 일반음식점 인허가 정보입니다. 데이터의 원본 시스템은 지방행정 인허가 데이터개방(https://www.localdata.go.kr)입니다.한식, 중식, 일식 등 음식류를 조리 및 판매하며, 식사와 함께 음주행위가 허용되는 업소정보입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다.* 본 데이터는 3일전 자료를 제공합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.'
