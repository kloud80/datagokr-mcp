summary_user: 부산광역시 사상구가 실시한 공중위생서비스 평가의 업소별 결과를 담은 파일로, 업소마다 업종명·업소명·도로명 소재지·평가등급(녹색 최우수, 황색 우수, 백색 일반관리대상)을 한 행씩 기록한다. 사상구 주민이나 이용자가 "우리 동네 숙박업소·목욕장·세탁소 중 위생등급이 최우수(녹색)인 곳은 어디인가"를 확인하거나, 분석가가 업종별 등급 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 공중위생업소 인허가 데이터와는 업소명·도로명 주소를 맞춰 이어 써야 한다.
limits: 표준 업소 식별번호 같은 공통 키가 없어 다른 데이터와 연결할 때 업소명·주소 문자열 매칭에 의존해야 하며, 불일치가 생길 수 있다. 범위는 사상구 한 곳뿐이라 부산 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다.
