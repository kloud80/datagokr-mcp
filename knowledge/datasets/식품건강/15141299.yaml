summary_user: 서울 금천구의 식용얼음판매업 업소를 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태(영업/휴업/폐업)·폐업일자·주소·사업장명·좌표·종사자 수·시설 규모 등을 담는다. 금천구에서 지금 영업 중인 식용얼음 판매업소가 어디 있고 언제 개업·폐업했는지 확인하려는 사업자나 위생 행정·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 쓰며, 좌표(X·Y)로 지도 위 다른 식품 인허가 업소와 겹쳐 볼 수 있다.
description_portal: 금천구 내 식용얼음판매업의 인허가 정보를 체계적으로 제공하는 데이터로, 인허가일자, 영업상태, 전화번호, 주소, 사업장명 등 기본 정보와 함께 위생업태, 종사자 수, 시설 규모, 임대 정보 등 다양한 세부 항목을 포함합니다. 이를 통해 식용얼음판매업의 개업, 폐업, 휴업 등 행정 이력과 현재 업소 현황을 종합적으로 파악할 수 있습니다. 해당 자료는 식품 안전 관리 강화, 업계 동향 분석, 관련 정책 수립, 연구 및 통계 작성 등 폭넓은 분야에서 활용 가능하며, 특히 위생 점검 체계 개선, 영업 환경 평가, 지역 내 식품 위생 수준 향상 등에도 중요한 기초 자료로 기능합니다.
