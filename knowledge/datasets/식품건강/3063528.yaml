summary_user: 경기도 용인시에 등록된 식품제조가공업체를 업소 한 곳당 한 행으로 담은 파일 데이터로, 업소명·등록일자·도로명 소재지·식품의 종류와 유형을 담는다. 시민이나 식품 관련 사업자가 "용인시에 어떤 식품을 만드는 제조가공업체가 어디에 얼마나 있는가"를 확인하거나, 분석가가 관내 식품 제조 업종 분포를 파악하는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 전국 식품 인허가 원장이나 행정처분 데이터와 정확히 연결하기 어렵고, 업소명·주소 매칭에 의존해야 한다. 범위는 용인시 한 곳이며 좌표가 없어 지도 분석에는 주소 지오코딩이 따로 필요하다.
