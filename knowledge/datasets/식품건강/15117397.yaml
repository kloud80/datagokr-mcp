summary_user: 학교 공동급식소의 등록 정보를 주관 학교 한 곳당 한 건으로 담으며, 주관 학교명·주소·지역(시군구)·급식을 받는 학교·시설 수가 들어 있고 범위는 전국이다. 학교 급식 식중독이 발생했을 때 같은 공동급식소에서 급식을 받는 학교가 몇 곳인지, 어느 지역 공동급식소가 몇 개 학교를 맡는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식품 인허가·집단급식소 데이터와는 학교명·주소·시군구명을 맞춰 연결해야 한다.
description_portal: 학교는 집단 급식 형태로 제한된 공간과 정해진 시간에 식품을 제공(섭취)함에 따라 식중독 발생 시 다수의 인원이 동시에 발생되어 대형 식중독으로 확대될 우려가 높고 납품받은 식재료에서 문제가 될 경우 다른 학교 또는 전국적으로 확산되어 발생될 수 있으므로 식중독과 관련된 철저한 관리와 주의 필요. 이에 학교 집단급식소 식중독 발생 시 신속 대응을 통한 확산방지와 식중독 예방 관리 강화를 위해 식품의약품안전처에서 보유한 공동급식소 등록 정보(주관 학교명, 주소, 지역, 급식제공학교 /시설수)를 제공
