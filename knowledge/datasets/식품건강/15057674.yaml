summary_user: 경기도에서 모범음식점으로 지정된 업소를 한 행씩 담으며, 업소명·업태·주메뉴·전화번호·시군·도로명/지번 주소·우편번호와 WGS84 위경도를 집계 연도·분기(SUM_YY, QU)와 함께 제공한다. 관광객이나 주민이 '이 시군에서 위생이 검증된 모범음식점은 어디이고 주메뉴는 무엇인가'를 찾거나, 분석가가 시군별 모범음식점 분포를 지도에 올려 볼 때 쓴다. 실측 컬럼에 업소 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장 등과는 업소명·주소 매칭으로 잇고, 시군 단위 집계는 시군코드(SIGUN_CD)·시군명으로, 공간 결합은 위경도로 한다.
description_portal: 이 데이터는 경기도 내 식품위생과 서비스 수준이 우수하다고 평가되어 모범음식점으로 지정된 업소의 정보를 포함하고 있습니다. 제공되는 항목은 업소명, 주메뉴, 전화번호, 업태명, 시군명, 소재지 주소(도로명 및 지번), 우편번호, WGS84 기준 위도·경도 좌표 등으로 구성되어 있으며, 연도 및 분기별로 집계된 현황을 확인할 수 있습니다. 본 데이터는 관광객 및 지역 주민들에게 신뢰할 수 있는 외식 정보를 제공하고자 구축되었으며, 위생과 맛을 기준으로 지정된 식당 정보를 활용하여 지역 식문화 조사, 관광지 연계 맛집 탐색, 정책 기반 위생관리 등에 활용될 수 있습니다. 데이터는 경기도 식품안전과에서 제공하며, 연간 단위로 갱신됩니다.
