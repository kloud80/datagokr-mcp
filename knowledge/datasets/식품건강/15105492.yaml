summary_user: 식품소분업 업종의 인허가 업소를 건별로 담은 원장으로, 허가일자·주소·업소명·대표자명·인허가번호 등을 제공하며 이 API의 전체 건수는 26건이다. 소분업 업소가 어디에 있는지, 언제 허가받았는지 확인하려는 사업자나 분석가가 상권·업소 현황을 볼 때 쓴다. 전역 조인 키가 확인되지 않아 다른 데이터와는 업소명·주소 매핑이나 같은 기관의 코드로 이어 쓰며, 같은 세부 부문의 다른 인허가 업종 데이터와 함께 본다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와 자동으로 결합할 수 없고, 이름·주소 매핑이 필요하다. 전체 26건으로 규모가 작아 전국 소분업 현황의 전수 파악에 쓸 수 있는지는 별도 확인이 필요하다.
