summary_user: 식품의약품안전처가 관리하는 냉동·냉장업 인허가 대장으로, 업소 단위로 인허가번호·업소명·대표자명·업종·허가일자·주소를 담는 원천 조회 API이다. 검증 시점에는 전국 범위에서 전체 건수 1건, 수신 1행이 확인되었다. 분석가나 창업 준비자가 특정 지역 냉동·냉장업소의 허가 현황을 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 같은 식품 인허가 업소 부문의 다른 인허가 데이터와는 이름·주소 매핑이나 같은 기관 코드로 이어 써야 한다.
description_portal: 식품의약품안전처에서 관리하는 인허가번호, 업소명, 대표자명, 업종, 허가일자, 주소, 기관 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
