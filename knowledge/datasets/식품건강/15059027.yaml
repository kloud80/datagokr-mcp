summary_user: 경기도 31개 시군에서 제과점·즉석판매제조가공업·유통판매업에 속하지 않는 기타 식품판매업체를 업소 한 곳당 한 행으로 담은 인허가 현황으로, 인허가일자·영업상태·폐업일자·주소·좌표·종업원 수·보증금과 월세 등을 포함한다. 상권 분석가가 '우리 시군에 영업 중인 대형마트·식자재마트·백화점 식품매장이 어디에 몇 곳 있고 언제 생기고 문을 닫았나'를 파악하거나, 행정·식품안전 담당자가 관리 대상 업소 목록을 만드는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군코드(SIGUN_CD)·사업장명·주소 같은 이름·코드 매핑이나 위경도 좌표로 다른 식품 인허가·위생 데이터와 이어 붙인다.
description_portal: 이 데이터는 경기도 31개 시군의 식품판매업 중 제과점, 즉석판매제조가공업, 유통판매업에 해당하지 않는 기타 식품판매업체의 인허가 현황을 포함합니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지 주소, 업태구분명, 종업원 수, 성별 인력 구성, 시설 정보, 건물소유 형태, 보증금 및 월세 금액, 다중이용업소 여부, 전통업소 지정 여부 및 전통음식 명칭, 위도·경도 좌표 등이 포함되어 있습니다. 본 데이터는 대형마트, 식자재마트, 백화점 내 식품판매업소 등 일정 규모 이상의 매장에서 식품을 판매하는 사업체의 현황을 파악할 수 있도록 구성되었으며, 행정 정책 수립, 식품안전 관리, 상권분석 등 다양한 분야에서 활용 가능합니다.
