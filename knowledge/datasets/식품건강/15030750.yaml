summary_user: 경상북도 경산시 관내 유통전문판매업소(식품제조가공업소에 OEM으로 위탁생산해 자사 제품으로 파는 업체)를 업소별로 담은 원천 목록으로, 업종명·업소명·도로명/지번 주소·우편번호·전화번호를 담는다. 경산시민이나 식품 사업자가 '경산에서 자체 브랜드로 식품을 유통하는 업체가 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 지역 식품유통 업체 분포를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소 매칭으로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와의 연결은 업소명·주소 문자열 매칭에 의존하므로 오매칭에 주의한다. 범위가 경산시 한 곳에 한정돼 타 시군구나 전국 비교에는 쓸 수 없고, 좌표 필드는 없다.
