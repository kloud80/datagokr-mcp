summary_user: 식품위생법상 식품접객업(휴게음식점·일반음식점·제과점·위탁급식 등) 영업소를 업소 한 곳당 한 행으로 담은 전국 단위 인허가 원장으로, 업소명·대표자·소재지 주소·좌표·인허가번호·허가일·폐업일·업종명·반려동물 출입 여부 등을 포함한다. 창업 준비자나 상권 분석가가 '이 동네에 영업 중인 일반음식점·카페가 몇 곳이고 최근 어디서 폐업했나'를 따지거나, 반려동물 동반 가능 식당을 찾는 서비스를 만들 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 데이터와는 인허가번호(LCNS_NO)·업소명·주소 같은 이름·코드 매핑이나 같은 기관(식약처)의 위생 지정·행정처분 데이터와의 번호 대조로 잇는다.
description_portal: '식품위생법에 따른 식품접객업 영업 관련 정보입니다.식품접객업에는: 휴게음식점,일반음식점, 제과점영업, 위탁급식영업 등이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.* 반려동물출입여부 추가'
