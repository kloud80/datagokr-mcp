description_portal: '안양시 유통전문판매업 데이터 현황입니다유통전문판매업 업종명-일반적으로 “유통전문판매업”으로 표기되며, 식품위생법상 정해진 업종 분류입니다.유통전문판매업 업소명-해당 영업을 수행하는 업체의 이름입니다. 예: ○○헬스푸드, △△식품유통유통전문판매업 소재지-업체의 사업장 주소로, 도로명주소 또는 지번주소 형식으로 제공됩니다.유통전문판매업 소재지전화-업체에 직접 연락할 수 있는 대표 전화번호입니다. 일부 업체는 공란일 수 있습니다.경기도 안양시의 유통전문판매업은 식품위생법에 따라 등록된 업종으로, 식품을 직접 제조하지 않고 도매 또는 소매업체에 유통을 목적으로 판매하는 영업 형태입니다. 주로 건강기능식품, 가공식품, 수입식품 등을 취급하며, 온라인 쇼핑몰 운영자들도 이 업종으로 등록하는 경우가 많습니다.'
