summary_user: 충청북도 옥천군에서 영업 중인 공중위생업소(목욕장·이미용·세탁 등)를 업소 한 곳당 한 행으로, 업종명·업소명·도로명 주소·데이터기준일을 담은 파일 데이터다. 주민이나 창업 준비자가 '옥천군 안에 미용실이나 세탁소가 어디에 몇 곳 있는가'를 업종별·지역별로 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 업소명·주소를 맞춰 연결하거나, 같은 기관이 낸 데이터와 함께 쓴다.
limits: 실측 컬럼에 사업자번호나 인허가 번호 같은 공통 식별 키가 없다. 그래서 다른 업소 데이터와 정확히 매칭되지 않고, 이름·주소 대조에 의존해야 한다. 범위는 옥천군 한 곳에 한정되며, 필드에 영업상태나 인허가일이 없어 신규·폐업 동향은 이 파일만으로 알기 어렵다.
