summary_user: 서울특별시 양천구 관내 건강기능식품 일반판매업소의 인허가 내역을 업소 단위로 담은 원장으로, 업소명·인허가일자·영업상태(영업/휴업/폐업)·폐업일자·주소·전화번호·소재지면적·종사자수·좌표 등을 담는다. 양천구에서 건강기능식품을 파는 업소가 어디에 몇 곳 영업 중인지, 최근 폐업한 곳은 어디인지 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구나 다른 식품 인허가 업종 데이터와는 관리번호(MGTNO)·개방자치단체코드 같은 같은 기관 코드나 업소명·주소 매칭으로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 양천구에서 관내 건강기능식품일반판매업의 인허가 현황을 체계적으로 관리하기 위하여 구축한 행정자료이다. 해당 업종은 건강기능식품을 소비자에게 직접 판매하는 영업 형태로서, 본 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등 주요 항목이 포함된다. 또한 신규 허가, 변경 신고, 행정처분, 휴·폐업과 같은 절차별 이력 정보를 제공하여 지역 내 건강기능식품 유통의 안정성과 적정성을 종합적으로 파악할 수 있도록 구성되어 있다. 본 데이터는 안전한 제품 유통 환경 조성과 소비자 보호를 위한 정책 수립에 필요한 근거자료로 활용되며, 투명한 영업정보 제공을 통해 행정업무의 효율성과 민원 대응의 신속성 향상에도 기여한다. 아울러 정기적인 정보 갱신을 통해 최신 인허가 내용을 지속적으로 반영하도록 관리한다. * 건강기능식품 일반판매업- 건강기능식품을 판매하는 업소정보(건강기능식품유통전문판매업에 해당되는 업소 제외)
