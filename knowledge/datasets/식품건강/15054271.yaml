summary_user: 전라남도 영암군 관내 제과점을 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·사업장명·지번주소·도로명주소·전화번호·데이터기준일자를 담는다(약 2KB 규모의 작은 CSV). 영암군에서 빵집을 열려는 사업자가 기존 제과점이 어디에 몇 곳 있는지 확인하거나, 주민이 가까운 제과점 연락처를 찾는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표)가 없어 다른 데이터와는 업소명이나 주소 문자열을 맞춰 연결해야 하며, 전국 식품 인허가 업소 원장이나 영암군의 다른 업종 현황과 주소 기준으로 대조해 쓴다.
