summary_user: 성남시에 신고된 축산물판매업소를 업소 한 곳당 한 행으로 담은 원장 파일로, 구·동, 업종명, 사업장명, 인허가일자, 도로명·지번 주소, 전화번호가 들어 있다. 성남시에서 정육점·식육판매업소를 열거나 상권을 분석하는 사람이 "어느 동에 축산물판매업소가 몰려 있고 언제 인허가를 받았나"를 확인하는 데 쓴다. 전국 공통 조인 키(인허가번호·사업자번호·좌표)는 실측 컬럼에서 확인되지 않아, 다른 식품 인허가·위생 데이터와는 사업장명과 주소를 맞춰서만 연결할 수 있다.
description_portal: 성남시는 도시 내 소비 중심 상권이 발달한 지역으로, 축산물판매업소도 전통시장, 주거지역 상권, 대형마트 주변 등을 중심으로 다양하게 분포하고 있습니다. 축산물판매업은 「축산물 위생관리법」에 따라 신고·등록된 업소로서, 주로 식육(쇠고기, 돼지고기, 닭고기 등)을 소비자에게 직접 판매하는 소매 형태의 영업입니다. 성남시 내에서는 식육판매업소, 식육포장처리업소, 식육즉석판매가공업소 등이 포함됩니다.주요 분포 지역은 모란시장, 단대시장, 상대원시장 등 전통시장 주변과 판교·정자 등 대형 유통시설 인근으로, 소형 정육점과 프랜차이즈 육류전문점이 혼재해 있는 특징을 보입니다. 위생점검과 원산지 표시 관리가 강화되는 추세입니다. 성남시는 관련 업소에 대해 정기적인 위생점검 및 교육을 시행하고 있으며, 축산물 위생안전 확보와 더불어 소상공인 지원 정책과도 연계하고 있습니다.
