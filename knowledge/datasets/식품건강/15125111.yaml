summary_user: 수입식품업(수입·판매업, 신고 대행업, 인터넷 구매 대행업, 보관업) 업소가 받은 행정처분을 처분 건별로 담으며, 업소명·인허가번호·주소와 처분유형·처분내용·위반법령·위반일자 및 내용, 영업정지 기간, 처분기관을 전국 범위로 제공한다. 소비자나 거래 업체가 특정 수입식품 업체가 어떤 위반으로 언제 처분을 받았는지 이력을 확인할 때 쓰고, 분석가가 위반 유형별 처분 경향을 볼 때도 쓴다. 실측상 전역 조인 키는 확인되지 않아, 같은 기관의 식품 인허가 업소·수입식품 데이터와는 인허가번호(LCNS_NO)나 업소명·주소를 매칭해 연결한다.
limits: 검증 호출에서는 0행이 수신되어 실제 건수와 최신 시점을 확인하지 못했으므로, 이를 근거로 데이터가 비어 있거나 오래됐다고 단정하지 않는다. 처분은 발생 시 생성되는 이벤트성 기록이며, 다른 데이터와 묶을 공통 코드가 없어 이름·번호 매칭에 의존한다. 개발계정은 하루 10,000회 호출로 제한된다.
