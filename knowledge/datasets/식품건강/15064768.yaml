summary_user: 식품 공통기준규격의 종류를 담은 코드표 성격의 데이터로, 공통기준규격코드·기준규격명·상위 코드·레벨·정의·사용여부·최종수정일시를 기준규격 항목 단위로 제공하며 범위는 전국·비공간이다. 식품 기준규격 정보를 다루는 분석가나 서비스 개발자가 '이 기준규격 코드가 어떤 규격을 뜻하고 어느 상위 분류에 속하는가'를 확인할 때 쓴다. 전역 조인 키는 없으며, 자기 안의 상위 코드(HRNK_CMMN_SPEC_CD)로 계층을 펼치고 같은 기관의 기준규격 관련 데이터와는 공통기준규격코드나 규격명 매핑으로만 잇는다.
description_portal: 공통기준종류 정보입니다. 공통기준규격코드 , 기준규격명 , 상위공통기준규격코드 , 레벨 , 정의 , 사용여부 , 최종수정일시의 속성정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
