summary_user: 서울특별시 성동구에서 식품을 직접 만들지 않고 판매업소에 유통하는 유통전문판매업 업소의 인허가 정보를 업소 한 곳당 한 행으로 담는다(인허가일자, 영업상태, 폐업일자, 소재지 주소, 좌표, 종업원 수 등). 성동구에 영업 중인 식품 유통전문판매업소가 어디에 얼마나 있고 언제 인허가·폐업했는지 확인하려는 정책 담당자나 업계 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 업소명·주소(지번·도로명) 매칭이나 같은 기관 코드(개방자치단체코드, OGDP_INST_CD)로만 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 식가공류를 직접 제조하지 않고, 주로 식가공품의 제공을 목적으로 판매업소에 유통하는 관련 업소의 정보를 수집하여 제공하기 위해 마련되었습니다. 데이터 구축의 목적은 식가공류 유통 구조의 투명성을 강화하고 관련 업종의 관리 및 감독 체계를 향상시키는 데 있습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 행정·관리적 측면에서 필수적인 항목이 포함되어 있어, 각 업소의 영업 인허가 현황과 이력, 영업상태의 변동 상황을 체계적으로 확인할 수 있습니다. 데이터 수집은 성동구 관할 행정기관을 통해 엄밀히 이루어지며, 정보의 신뢰성을 확보하였고 정기적으로 최신화됩니다. 이 정보를 활용하면 정책 담당자는 식가공류 유통 업소 규모와 분포, 인허가 현황 등의 분석 및 관리가 가능하며, 업계 종사자나 연구자, 소비자 입장에서도 신뢰성 있는 시장 정보와 유통현황 파악에 유용합니다. 식품 안전감시, 시장 동향 분석, 업계 현황 파악 등 다양한 분야에 활용될 수 있습니다.
