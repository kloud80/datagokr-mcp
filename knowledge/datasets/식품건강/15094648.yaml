summary_user: '부산광역시 서구에 있는 프랜차이즈 카페를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·데이터기준일을 담는다(약 5.6KB CSV). 서구 안에서 프랜차이즈 카페가 어느 동네에 몰려 있는지 보려는 창업 예정자나 상권 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 잇는다(예: 식품 인허가 업소 원장).'
description_portal: '이 데이터는 부산광역시 서구 내에 위치한 프랜차이즈 카페 현황을 제공하는 공공데이터로, 프랜차이즈 카페 정보 중심으로 구성되어 있습니다.각 사업장의 구체적인 주소를 포함하고 있으며, 업종명, 업소명, 소재지의 도로명 주소, 전화번호 등을 항목별로 제공합니다.이를 통해 서구 내 프랜차이즈 카페의 분포 현황을 파악 할 수 있습니다.주기적으로 등록사항을 현행화하여 데이터를 제공하고 있습니다.*항목별 설명업종명: 상위업종(예: 휴계음식점)업소명: 프랜차이즈 카페 업소명소재지(도로명): 업소 주소데이터기준일: 데이터 현행화 기준일'
