summary_user: 서울특별시 중구에서 신고된 식품운반업(유산균 음료·어류·조개류 등 부패·변질되기 쉬운 식품을 운반하는 업종) 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일·영업상태(영업/폐업)·폐업일·지번/도로명 주소·중부원점TM 좌표 등을 포함한다. 식품운반업 창업을 준비하는 사업자가 '중구에 현재 영업 중인 식품운반업체가 몇 곳이고 어디에 몰려 있는가'를 확인하거나, 분석가가 업체의 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓸 수 있다.
description_portal: '서울특별시 중구의 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소 정보입니다. 데이터는 각 식품운반업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 식품운반업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 물류 운송 신고업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민 및 관련 업계 종사자에게는 콜드체인 및 냉장냉동 설비를 갖춘 위생차량을 통해 안전한 식품 물류 서비스를 제공하는 신뢰할 수 있는 운송 신고업체의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
