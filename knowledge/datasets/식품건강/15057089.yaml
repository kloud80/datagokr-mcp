summary_user: 경기도 시군에 있는 축산물 보관업체(식육·원유·식용란·유가공품 등을 냉장·냉동 보관하는 업소)를 업소 한 곳당 한 행으로 담은 인허가 원장이다. 사업장명, 인허가일자·폐업일자, 영업상태, 도로명·지번 주소, 위경도 좌표가 들어 있다. 축산물 유통업자나 분석가가 '우리 시군에 영업 중인 냉장·냉동 축산물 보관업체가 어디에 몇 곳 있나'를 확인하거나 냉장 물류 거점을 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 시군코드(SIGUN_CD), 사업장명, 주소로 맞추거나 위경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 경기도 31개 시군 내에서 식육, 포장육, 원유, 식용란, 식육가공품, 유가공품, 알가공품 등 축산물을 냉동 또는 냉장 상태로 위생적으로 보관하는 전문업체에 대한 정보를 포함합니다. 주요 제공 항목은 사업장명, 인허가일자 및 폐업일자, 영업상태, 주소(도로명 및 지번), 소재지 면적, 전화번호, 종업원 수, 축산물가공업구분명, 축산업무구분명, 위경도 좌표(WGS84) 등이며, 축산물 위생관리와 유통 경로 분석, 냉장식품 유통 효율화, 물류 인프라 파악에 활용 가능합니다. 본 데이터는 주간 단위로 갱신되며 Open API를 통해 확인할 수 있습니다.
