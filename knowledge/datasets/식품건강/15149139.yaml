summary_user: 서울 동작구에서 제과점·즉석판매제조가공업·유통판매업에 속하지 않으면서 마트처럼 일정 규모 이상의 영업장에서 식품을 파는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장이다. 인허가일자, 영업·상세 상태, 폐업일자, 도로명·지번 주소, 사업장명, 면적, 중부원점TM 좌표가 들어 있다. 동작구 안에서 영업 중인 대형 식품판매 업소가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 알아보는 상권 분석가나 사업자가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호 체계(MGTNO)로만 이어 붙인다.
description_portal: '서울시 동작구 식품판매업(기타) 인허가 정보 (https://data.seoul.go.kr/dataList/OA-18321/S/1/datasetView.do) 입니다.동작구의 제과점, 즉석판매제조가공업, 유통판매업 등에 속하지 않고 마트와 같은 일정 규모 이상의 영업장에서 식품을 판매하는 업소정보를 제공합니다.인허가일자, 영업상태명, 도로명주소, 도로명우편번호, 사업장명 등의 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음'
