summary_user: 서울특별시 광진구에서 이용업(이발소) 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 건별 인허가 목록이며, 업소명·인허가일자·영업상태·폐업일자·지번/도로명 주소·면적·중부원점TM 좌표(X, Y) 등을 포함한다. 주민이나 소상공인 분석가가 '광진구에서 현재 영업 중인 이발소는 어디이고 최근 몇 곳이 폐업했는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관(개방자치단체) 코드로만 연결한다.
description_portal: 이 데이터는 서울특별시 광진구에서 이용업 인허가를 받은 업소에 대한 현황 정보를 제공하는 공공데이터입니다. 이용업은 일반적으로 이발소 등에서 머리카락을 자르거나 수염을 깎는 등의 방법으로 용모를 단정하게 하는 서비스를 제공하는 업종입니다. 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등의 항목이 포함되어 있으며, 지역 내 생활 밀착형 서비스업 분포 및 운영 실태를 파악하는 데 활용됩니다. 특히 고령층 남성 고객 중심의 이용업 특성을 반영하여, 지역 내 균형 있는 복지 및 편의시설 확보에 참고자료로 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위경도(WGS84)는 포함되어 있지 않기 때문에 지도 기반 시스템 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준으로 정기적으로 갱신되며, 공중위생 관리, 소상공인 정책, 지역 서비스 분석 등에 활용됩니다.
