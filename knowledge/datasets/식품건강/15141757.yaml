summary_user: 서울특별시 용산구 안의 유흥주점영업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·전화번호·주소·사업장명·좌표(X, Y)를 포함한다. 주민이나 분석가가 용산구에서 지금 영업 중인 유흥주점이 어디에 몇 곳 있고 언제 허가·폐업했는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 지역·업종의 식품 인허가 데이터와는 같은 기관 코드(OPNSFTEAMCODE)나 업소명·주소 매칭으로 잇는다.
description_portal: 서울특별시 용산구_용산구 유흥주점영업 인허가 공공데이터는 서울특별시 용산구 내 유흥주점의 영업허가 현황과 관련 정보를 포함하는 데이터입니다. 유흥주점영업 인허가 정보에 대해 인허가 일자, 영업상태, 폐업일자, 전화번호, 주소, 사업장명에 대한 정보를 제공합니다. 유흥업소의 위생 관리, 안전 점검, 지역사회 치안 유지, 청소년 보호 정책 수립 등에 활용됩니다. 또한, 투명한 행정 운영과 시민의 알 권리 보장을 위해 공개되며, 지역 내 유흥주점 산업 현황 파악과 관련 규제 정책 마련에 중요한 역할을 합니다. 이 데이터는 지역사회와 관련 업계 모두에게 신뢰성 있는 정보를 제공하여 안전한 환경 조성에 기여합니다.
