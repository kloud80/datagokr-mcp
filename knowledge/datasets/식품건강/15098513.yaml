summary_user: 대구광역시 달서구에서 식품안전관리인증기준(HACCP)을 받은 업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 17KB)로, 업소명·업종·적용품목·주소·위경도·인증번호·최초인증일·인증종료일을 담는다. 주민이나 유통·납품 담당자가 "달서구에서 이 품목으로 HACCP 인증을 받은 업소는 어디이고 인증이 언제까지 유효한가"를 확인하는 데 쓴다. 전역 조인 키가 없어 인허가 원장 등 다른 데이터와는 업소명·주소 매칭이나 같은 기관 자료로만 이어 붙이며, 위경도로 지도 위에 다른 위생 지정 업소와 겹쳐 보는 데 쓴다.
description_portal: 대구광역시 달서구에서 식품안전관리인증기준(HACCP)을 획득한 업소에 대해 정리한 자료를  파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 업소명, 업종, 적용품목, 대표자, 주소, 인증번호, 최초인증일, 인증종료일, 담당부서, 자료 기준일 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 지역 내 HACCP 인증업소를 파악하는데 유용하게 참고자료로 쓸 수 있으며,위생 수준 향상, 유통 안전성 확보, 정책 수립 등의 행정업무를 위한 기초자료로 활용됩니다.
