summary_user: 경기도 내 식품냉동냉장업 사업장을 업소 단위로 담은 인허가·영업 현황 데이터로, 사업장명·인허가일·영업상태·폐업일·위생업태·종업원 수·시설 규모·보증금·월세·주소·위경도 좌표를 포함한다. 냉동냉장 물류 입지를 찾는 사업자나 분석가가 "경기도 어느 시군에 영업 중인 냉동냉장업체가 몰려 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)나 사업장명·주소로 다른 식품 인허가 업소·행정처분 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 식품냉동냉장업체의 인허가 및 영업 현황을 담고 있으며, 각 사업장의 명칭, 위치, 인허가 일자, 영업상태, 위생업태, 종업원 수 등의 정보를 제공합니다. 또한 업소의 시설 규모, 보증금 및 월세, 위도·경도 좌표 등 다양한 관리 및 공간 정보가 포함되어 있습니다. 주요 항목으로는 '사업장명', '영업상태명', '소재지도로명주소', '총종업원수', '위생업태명', '시설총규모' 등이 있으며, 이를 통해 식품 냉동냉장 산업의 지역별 분포 및 현황을 파악할 수 있습니다. 이 데이터는 공공 및 민간 영역에서 물류, 식품 유통, 공공위생 정책 수립, 지역 경제 분석 등에 활용될 수 있습니다.
