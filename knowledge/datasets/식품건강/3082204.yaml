summary_user: 부산광역시 연제구에 있는 집단급식소(기숙사·학교·병원·사회복지시설·산업체 등 비영리 급식시설)를 한 행에 한 곳씩 담은 업소 목록이며, 업소명·도로명 소재지·전화번호를 담고 있고 파일 크기는 약 15KB입니다. 연제구 주민이나 급식 납품업체가 "우리 구에 어떤 집단급식소가 어디에 있고 연락처가 무엇인가"를 확인할 때 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가·위생 데이터와는 업소명이나 도로명 주소를 맞춰서만 이어 쓴다.
description_portal: 부산광역시 연제구 집단급식소 현황으로 "업소명, 소재지, 전화번호"을 제공합니다.※ 식품위생법 제2조12호 집단급식소란 영리를 목적으로 하지 아니하면서 특정 다수인에게 계속하여 음식물을 공급하는 다음 각 목의 어느 하나에 해당하는 곳의 급식시설로서 대통령령으로 정하는 시설을 말한다.가. 기숙사나. 학교, 유치원, 어린이집다. 병원라. 「사회복지사업법」 제2조제4호의 사회복지시설마. 산업체바. 국가, 지방자치단체 및 「공공기관의 운영에 관한 법률」 제4조제1항에 따른 공공기관사. 그 밖의 후생기관 등
