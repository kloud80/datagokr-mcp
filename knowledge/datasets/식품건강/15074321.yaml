summary_user: '건강기능식품 품목별로 시험항목(예: 기능성분·중금속·미생물 등)마다 기준규격값과 그 요약, 최대·최소값, 단위, 위해 여부, 유효 개시·종료일자, 출처를 행 단위로 담은 전국 단위 기준규격 데이터다. 건강기능식품 제조·수입 사업자나 품질관리 담당자가 "이 품목의 특정 시험항목 허용 범위와 단위는 무엇이고 지금 유효한 기준인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 품목코드(PRDLST_CD)·시험항목코드 같은 식약처 내부 코드나 품목명 매핑으로만 같은 기관의 건강기능식품 품목·원료, 부적합·회수 정보와 이어 쓴다.'
description_portal: 건강기능식품의 품목코드, 품목한글명, 시험항목코드, 시험항목 한글명, 세부항목명, 기준규격값, 기준규격값 요약, 유효개시일자, 유효종료일자, 출처, 최대값, 최소값, 위해여부, 단위명 등을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
