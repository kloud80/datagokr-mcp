summary_user: 서울특별시 강서구에서 건강기능식품일반판매업으로 인허가를 받은 업소를 한 업소당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태(영업/폐업 등)·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y)·소재지 면적이 들어 있다. 강서구 안에서 지금 영업 중인 건강기능식품 판매점이 어디에 얼마나 있는지, 최근 새로 생기거나 폐업한 곳이 어디인지를 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호(MGTNO)로 연결하며, 좌표를 쓰면 다른 식품 인허가 업소 데이터와 지도 위에서 겹쳐 볼 수 있다.
description_portal: 서울특별시 강서구에서 건강기능식품일반판매업으로 인허가를 받은 업소에 대한 정보를 제공합니다. 건강기능식품일반판매업은 소비자에게 직접 건강기능식품을 판매하는 업종으로, 건강기능식품유통전문판매업과는 달리 소규모 소매 형태의 판매를 주로 수행합니다. 이 업종은 식품의약품안전처의 기준에 따라 제품의 보관, 유통, 품질관리 등에 대한 규정을 준수해야 하며, 무허가 판매 및 허위 광고를 방지하기 위한 행정 감독의 대상이 됩니다. 본 데이터에는 인허가일자, 영업상태, 사업장명, 주소, 문화체육업종명 등의 정보가 포함되어 있어 관내 판매업소 현황 파악, 민원 대응, 정책 수립 및 건강기능식품 관리체계 정비 등에 활용될 수 있습니다. 특히 고령화 사회와 건강에 대한 관심 증가로 건강기능식품 시장이 확대되고 있어, 관련 데이터의 공공 공개는 소비자 안전과 시장 투명성 확보에 기여할 수 있습니다.
