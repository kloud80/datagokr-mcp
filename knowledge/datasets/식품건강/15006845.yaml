summary_user: 경상북도 경주시 안의 공중위생업소(숙박·목욕·이용·미용·세탁·피부미용 등)를 업소 한 곳씩 업종명·업소명·도로명주소·지번주소로 담은 파일 데이터이다. 시민이나 사업자가 '경주시 특정 동네에 어떤 미용실·목욕탕이 영업 중인가'를 확인하거나, 분석가가 업종별 업소 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 업소명을 맞추는 방식으로 이어 쓰며, 식품 인허가 업소·위생 지정 데이터와는 같은 기관 기준으로만 연결한다.
description_portal: 본 데이터는 경상북도 경주시 내 공중위생업소의 현황을 수록한 자료이다.업종명, 업소명 영업소주소(도로명주소)와 지번주소 등의 항목이 포함되어 있으며, 숙박업, 목욕업, 이용업, 미용업, 세탁업, 피부미용업 등 다양한 공중위생 관련 업종의 정보를 제공한다. 해당 자료는 위생관리 정책 수립, 행정업무 지원, 지역 위생수준 분석, 민원 응대, 업종별 분포 파악 등에 활용 가능하다. 데이터는 파일 형식으로 제공되며, 정기적으로 최신 내용으로 갱신된다. 시민 생활과 밀접한 공중위생 환경을 이해하고 개선하기 위한 기반 자료로서의 활용도가 높다.
