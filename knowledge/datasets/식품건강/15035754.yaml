summary_user: 서울특별시 동작구 관내 일반음식점·휴게음식점을 업소 한 곳씩 담은 인허가 현황 파일로, 업종명·업태명·업소명·도로명/지번 소재지·인허가일자·영업장면적·데이터기준일자를 포함한다. 동작구에서 창업을 검토하는 사업자가 특정 동네에 어떤 업태의 음식점이 얼마나 몰려 있는지, 최근 인허가가 늘었는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·소재지 주소를 맞춰 붙이거나, 같은 구의 위생 지정·행정처분 데이터와 이름·주소 매핑으로 연결한다.
