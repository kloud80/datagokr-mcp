summary_user: 울산광역시 동구 관내 숙박업·목욕장·이용업·미용업 등 공중위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·영업소주소·신고일자를 담는다. 주민이 동구에서 영업 신고된 목욕탕이나 미용실이 어디 있는지 확인하거나, 분석가가 동구의 업종별 위생업소 분포와 신고 시기를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소를 맞춰 붙이거나 같은 기관(동구) 기준으로만 연결하며, 식품 인허가 업소·위생 지정 데이터와 함께 볼 때도 이름·주소 매칭이 필요하다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 지역·전국 데이터와 키로 바로 결합하지 못하고 업소명·주소 매칭에 의존한다. 범위는 울산 동구 한 시군구에 한정되며, 포털 설명의 위생 점검 결과·영업자 정보·허가일자는 실측 필드 목록에 보이지 않으므로 있다고 가정하지 않는다.
