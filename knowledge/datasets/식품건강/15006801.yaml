summary_user: 충청북도 괴산군의 공중위생업소(미용업 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·영업자·도로명 소재지·영업장면적·전화·객실수를 담는다. 포털 설명상 2020년 5월 6일 기준 현황이다. 괴산군 주민이나 사업자가 '괴산군에 어떤 미용실·숙박·목욕장 같은 공중위생업소가 어디에 있는지'를 확인하거나, 분석가가 군 단위 업종별 업소 수와 영업장 규모를 집계하는 데 쓰며, 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞대거나 같은 기관(괴산군) 기준으로만 이어 쓴다.
description_portal: 2020년 5월 6일 기준 괴산군 공중위생업 현황(미용업소, 상호, 주소 등)입니다. 더 자세한 사항은 괴산군으로 문의주시기 바랍니다.
