summary_user: 서울 용산구의 식품소분업 업소를 한 건씩 담은 인허가 원장으로, 업소명·인허가일자·영업상태와 폐업일자·소재지 및 도로명 주소·좌표(X, Y) 등을 업소 단위로 담는다. 창업자나 상권 분석가가 '용산구에서 현재 영업 중인 식품소분업체는 어디에 몇 곳이고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관 코드(OPNSFTEAMCODE)를 공유하는 다른 용산구 식품 인허가 업종 데이터와 묶거나 업소명·주소 매칭으로 위생 지정·행정처분 같은 식품안전 데이터와 이어 쓴다.
description_portal: 서울특별시 용산구 식품소분업 인허가 정보는 식품을 일정 단위로 나누어 포장하는 ‘소분업’에 대한 정부의 허가 현황과 관련 정보를 의미합니다. 이는 식품 위생과 안전을 확보하기 위해 지방자치단체나 식품의약품안전처가 관리하는 데이터로, 업소명, 인허가 일자, 업종, 주소, 사업자 정보 등을 포함합니다. 공공데이터로 제공되어 누구나 확인할 수 있으며, 소비자는 신뢰할 수 있는 소분업체를 찾는 데 활용할 수 있고, 정부는 위생 관리와 정책 수립에 이용합니다. 창업자나 연구자는 시장 분석 자료로 활용하기도 합니다. 이 정보는 정기적으로 갱신되어 투명한 식품 유통 환경 조성에 기여하며, 다양한 데이터 분석과 인공지능 활용에도 활용됩니다.
