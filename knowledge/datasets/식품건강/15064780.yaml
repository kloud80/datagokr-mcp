summary_user: 행정표준코드 기준 식품원재료 코드별로 대분류·중분류, 원재료명과 이명, 영문명·학명, 부위·가공공정 구분, 유효기간과 사용 여부를 담은 전국 단위 코드표다. 식품 개발자나 분석가가 원재료 표시에 적힌 이름이 어느 표준 원재료 코드·분류에 해당하는지, 그 다른 이름이나 학명은 무엇인지 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 원재료·영양성분 데이터와는 원재료명이나 원재료코드(RAWMTRL_CD)를 이름·코드 매핑으로 맞추거나 같은 기관의 코드 체계로만 이어 쓴다.
description_portal: 행정표준코드에 의한 식품원재료 코드에 대한 속성정보를 제공합니다. 속성정보로는 원재료코드 , 대분류 , 중분류 , 원재료명 , 원재료이명 , 영문명 , 학명 , 부위코드 , 부위코드명 , 가공공정코드 , 가공공정코드명 , 원재료코드 , 원재료코드명 , 유효시작일자 , 유효종료일자 , 사용여부 , 최종수정일시가 있습니다이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 창업 지원과 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
