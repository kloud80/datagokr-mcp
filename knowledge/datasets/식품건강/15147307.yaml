summary_user: 서울 강북구 관내에서 직접 제조하지 않고 식품을 판매업소에 유통하는 유통전문판매업소를 업소 단위로 담은 인허가 원장으로, 영업 중인 곳과 폐업한 곳을 모두 포함하며 인허가일·영업상태·폐업일·주소·중부원점TM 좌표(XCRD·YCRD)를 담는다. 식품 유통업 창업을 검토하는 사업자나 상권 분석가가 '강북구에 영업 중인 유통전문판매업소는 어디에 몇 곳이고 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 같은 형식의 타 시군구·타 업종 식품 인허가 데이터와 이어 쓴다.
description_portal: '서울특별시 강북구 유통전문판매업 인허가 정보 데이터는 강북구 관내에 위치한 직접 제조하지 않고 식가공류 제공을 위해 판매업소에 유통하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
