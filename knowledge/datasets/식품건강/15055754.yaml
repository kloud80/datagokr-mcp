summary_user: 부산광역시 남구에 있는 위탁급식영업 업소를 한 행에 한 곳씩 업종명·업소명·도로명/지번 소재지·전화번호로 담은 업소 목록 파일(csv, 약 4KB)이다. 남구에서 학교·기업 등 집단급식소에 급식을 위탁할 업체를 찾거나, 지역 내 위탁급식업체가 어디에 몇 곳 있는지 확인하려는 기관 담당자·사업자가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '최근 들어 위탁급식영업 현황에 대한 문의가 늘고 있어 참고사항으로,부산광역시 남구에 위치한 위탁급식영업현황에 대한 데이터로 업종명, 업소명, 소재지, 소재지전화 등의 항목을 제공합니다.위탁급식영업이란 집단급식소에서 음식류를 조리하여 제공하는 영업입니다.남구청 환경위생과에서 추출한 자료로 제공합니다.업소명: 가게 이름, 상호명소재지(도로명): 가게에 대한 주소소재지전화: 가게 전화번호[식품위생법 시행령 제21조]위탁급식영업: 집단급식소를 설치ㆍ운영하는 자와의 계약에 따라 그 집단급식소에서 음식류를 조리하여 제공하는 영업'
