summary_user: 경기도 내 다방 형태 휴게음식점의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·위경도 좌표·종사자수·소재지면적 등을 포함한다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 다방이 어디에 몇 곳 있고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표, 사업장명으로 다른 경기도 식품 인허가 업소 데이터나 지도 데이터와 맞춰 이어 쓴다.
description_portal: 「휴게음식점(다방) 현황」 데이터는 경기도 내 다방 형태의 휴게음식점에 대한 인허가 정보를 제공하는 자료입니다. 휴게음식점(다방)은 인스턴트커피, 원두커피, 차류, 아이스크림류 등을 판매하거나 배달하는 업소를 의미합니다. 주요 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT), 위생업종명(SANITTN_INDUTYPE_NM), 위생업태명(SANITTN_BIZCOND_NM), 다중이용업소여부(MULTI_USE_BIZESTBL_YN), 종사자수(남성·여성·총합), 소재지면적(LOCPLC_AR), 총시설규모(TOT_FACLT_SCALE) 등입니다. 이 데이터는 경기도 31개 시군의 다방 분포 현황을 파악할 수 있어 지역 상권 분석, 위생·안전관리, 고용 현황 파악, 관광·문화산업 연구 등에 활용할 수 있습니다. 또한 주변환경 구분과 급수시설 구분까지 포함되어 있어 영업장의 시설 여건을 종합적으로 분석하는 데 유용합니다.
