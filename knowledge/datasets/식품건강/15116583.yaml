summary_user: 식품첨가물 품목별로 시험항목·세부항목에 대한 기준규격값과 최대·최소값, 단위, 유효기간, 위해여부, 수정사유를 담은 전국 단위 기준규격 데이터다. 식품 제조사나 품질관리 담당자가 특정 첨가물의 순도·중금속 등 시험항목 허용 기준이 얼마이고 언제부터 유효한지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 품목분류코드(PRDLST_CD)나 품목한글명으로 같은 기관의 첨가물·품목 데이터와 이름·코드 매핑으로만 연결한다.
description_portal: 식품의약품안전처에서 관리하는 식품첨가물의 기준규격에 대한 데이터로, 품목한글명, 품목분류코드, 시험항목 한글명, 세부항목명, 품목항목속성 한글명, 기준규격값, 기준규격값 요약, 유효개시일자, 유효종료일자, 출처, 최대값, 최소값, 위해여부, 단위명, 수정사유, 수정일자 정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
