summary_user: 전국 수산물 수입업체를 업체 한 곳당 한 건으로 담으며, 업종명·영업허가번호(BSN_PRMS_NO_1)·업체명·대표자명·주소·비고를 제공한다. 수입 수산물 거래처를 찾는 사업자나 특정 업체가 수산물 수입 영업허가를 받았는지 확인하려는 분석가·국민이 "이 업체가 등록된 수산물 수입업체인가, 어디에 있는가"를 묻는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 수입식품·인허가 데이터와는 영업허가번호나 업체명 같은 이름·코드 매핑, 또는 같은 기관 코드로만 이어 쓴다.
description_portal: 수산물 수입업체 현황 관련 정보입니다. 수산물 수입업체에 대한 업종코드명 , 영업허가번호 , 업체한글명 , 주소 , 비고 , 대표자명의 속성정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
