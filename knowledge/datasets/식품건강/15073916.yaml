summary_user: 위생용품 신고품목 구분별로 쓰이는 수입성분을 성분코드·성분명 단위로 담은 전국 범위의 코드성 목록이며, 성분마다 세척제 1·2·3종 대상 여부, 수입식품 성분 생성 여부, 설명, 사용여부를 함께 담는다. 위생용품 수입업자나 검사·인허가 담당자가 "이 성분을 2종 세척제에 써도 되는가"처럼 세척제 종류별 사용 가능 성분을 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 수입식품·위생용품 데이터와는 성분명·성분코드 또는 신고품목 구분코드(DCLR_PRDLST_DIVS_CD) 같은 식약처 내부 코드를 맞춰 이어 쓴다.
limits: 업소·제품·수입신고 건별 정보가 아니라 성분 기준 목록이라 특정 제품이나 업체의 성분 구성을 바로 알 수 없고, 공통 조인 키가 없어 다른 데이터와는 이름·코드 매핑으로만 연결된다. 지역 구분이 없는 전국·비공간 데이터이며, 개발계정은 일 10,000회 호출 제한이 있다.
