summary_user: 남원시에서 음식점 위생등급을 지정받은 업소를 한 행씩 담은 파일로, 업소명·도로명 소재지·지정등급·지정일자를 시군구 단위로 제공한다(csv 약 7KB). 남원 주민이나 관광객이 "남원에서 위생등급을 받은 식당은 어디이고 등급은 무엇인가"를 확인하거나, 분석가가 지역 위생등급 지정 현황을 살피는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 업소명·도로명 주소를 맞춰 이어 써야 한다.
description_portal: 1. 데이터 개요 및 활용 맥락본 데이터는 전북특별자치도 남원시의 위생등급제에 참여하는 음식점들의 위생 상태를 등급별로 분류한 공공정보입니다. 시민들이 안전하고 깨끗한 음식점을 선택하는 데 도움을 주며, 동시에 음식점 운영자들에게 위생관리 개선을 위한 동기를 부여하고자 합니다. 이를 통해 식중독 예방과 식재료 안전관리에 기여하고, 관광객과 지역주민 모두가 신뢰할 수 있는 건강한 음식문화 환경을 조성하고자 합니다.2. 데이터 항목- 업소명- 소재지 도로명- 지정 등급- 지정 일자3. 기대효과이 데이터는 시민들에게 안전한 외식 선택권을 제공하고, 음식점들의 자발적인 위생관리 개선을 유도함으로써 지역 전체의 식품안전 수준을 높이고 관광 신뢰도를 향상시킬 것으로 기대됩니다.
