summary_user: 대구광역시 서구 관내 식품위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 소재지·우편번호를 담는다(시군구 범위, 개별 주소 단위). 주민이나 상권 분석가가 '서구 안에 어떤 업종의 식품업소가 어느 주소에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없어서, 다른 데이터와는 업소명·주소 문자열을 맞추거나 주소를 좌표로 바꿔 이어 써야 한다.
