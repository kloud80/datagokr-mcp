summary_user: HACCP 인증을 받은 업체의 영문 업체명, 영문 인증유형(품목), 인증번호, 인증 유효기간, 인증서 발급일자를 업체·인증 건별로 담은 전국 단위 파일(CSV, 약 103KB)이다. 수입업체나 해외 바이어가 거래 상대 한국 식품업체의 HACCP 인증이 아직 유효한지 영문으로 확인하는 데 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서, 다른 위생 지정·인허가 데이터와는 인증번호나 업체명 매칭으로만 이어 쓴다.
description_portal: (HACCP 인증업체 영문정보 제공) HACCP 인증업체의 영문정보를 제공하고 있습니다. HACCP 인증업체 영문명, HACC P인증유형 영문명, HACCP 인증번호, 인증유효기간, 인증서 발급일자에 대한 정보를 제공합니다. HACCP은 식품의 원재료부터 제조, 가공, 보존, 유통, 조리단계를 거쳐 최종소비자가 섭취하기 전까지의 각 단계에서 발생할 우려가 있는 위해요소를 규명하고, 이를 중점적으로 관리하기 위한 중요관리점을 결정하여 자율적이며 체계적이고 효율적인 관리로 식품의 안전성을 확보하기 위한 과학적인 위생관리체계라고 할 수 있습니다. HACCP은 전 세계적으로 가장 효과적이고 효율적인 식품 안전 관리 체계로 인정받고 있으며, 미국, 일본, 유럽연합, 국제기구(Codex, WHO, FAO) 등에서도 모든 식품에 해썹를 적용할 것을 적극 권장하고 있습니다.
