summary_user: 경기도 31개 시군에서 아이스크림을 주로 파는 휴게음식점의 인허가 현황을 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·소재지 주소와 면적·종사자 수·WGS84 좌표를 포함한다. 창업자나 프랜차이즈 담당자가 '우리 동네에 영업 중인 아이스크림 매장이 몇 곳이고 최근 폐업은 얼마나 되나'를 확인하거나, 분석가가 디저트 매장 분포를 지도로 볼 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표 같은 이름·위치 매칭으로만 잇는다.
description_portal: 이 데이터는 경기도 내 아이스크림을 주로 판매하는 휴게음식점에 대한 인허가 현황 정보를 제공합니다. 데이터는 경기도 31개 시군의 인허가 기반으로 구성되어 있으며, 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 주소 및 면적, 급수시설 구분, 위생업종/업태, 총시설규모, 종사자 수(남녀), 다중이용업소 여부, 위치정보(WGS84 좌표계) 등입니다. 이 데이터는 여름철 식품안전 모니터링, 디저트 전문 매장 분포 분석, 프랜차이즈 입점전략 수립, 관광지 주변 휴게음식점 현황 파악 등에 활용될 수 있으며, Open API 형식으로 XML 또는 JSON으로 제공됩니다.
