summary_user: 경기도 시군에 인허가된 냉면 전문 일반음식점을 업소 한 곳당 한 행으로 담은 현황 데이터로, 사업장명·인허가일자·영업상태·폐업일자·소재지 주소·종업원 수·시설규모·WGS84 좌표가 들어 있다. 외식 창업을 준비하는 사업자가 '우리 시군에 영업 중인 냉면집이 몇 곳이고 어디에 몰려 있나'를 확인하거나, 분석가가 냉면집 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 지역 데이터와 맞춰 쓰며, 식품 인허가 업소 데이터와는 사업장명·주소 매칭으로 연결한다.
description_portal: 본 데이터는 경기도 31개 시군에 인허가된 냉면 전문 음식점의 현황을 제공하며, 냉면을 주식으로 판매하는 일반음식점 정보를 담고 있습니다. 주요 항목으로는 사업장명, 인허가일자, 영업상태, 폐업일자, 위생업종 및 업태명, 소재지 주소(도로명 및 지번), 우편번호, 건물소유구분, 급수시설구분, 종업원 수, 다중이용업소 여부, 총시설규모, 면적, WGS84 위도·경도 등 위치 기반 정보가 포함됩니다. 냉면은 계절성 외식 수요가 높은 음식으로, 본 데이터는 여름철 외식 트렌드 분석, 외식업 입지 전략 수립, 냉면 소비문화 연구 등 다양한 분야에 활용될 수 있습니다. 데이터는 지방행정 데이터 개방시스템을 통해 행정안전부가 주간 단위로 제공하며, 지도기반 분석과 통계자료 작성에도 유용하게 활용됩니다.
