summary_user: 건강기능식품 제조업에서 만든 건강기능식품의 품목분류 정보를 품목(PRDCT_NM)별로 담으며, 주된 기능성, 지표성분·원재료, 일일 섭취량 하한·상한과 단위, 섭취 시 주의사항, 생성·수정 일시 같은 항목이 있고 범위는 전국이다. 소비자나 제품 개발자가 특정 건강기능식품 품목의 기능성, 하루 권장 섭취 범위, 섭취 시 주의할 점을 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 품목명이나 원료명을 기준으로 이름을 맞춰 연결해야 하며, 같은 부문의 제품 단위 조인 키인 품목제조보고번호·바코드도 이 데이터의 필드에는 없다.
description_portal: 건강기능식품에 관한 법류에 따른 건강기능식품 제조업에서 만든 건강기능식품 품목분류 정보에 관한 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
