summary_user: 부산광역시 사하구 관내에 이미용업소로 등록해 현재 영업 중인 업소를 한 행에 한 곳씩 담은 파일로, 업종명(일반미용업·이용업·피부미용업 등), 업소명, 도로명 주소, 대표 전화번호, 데이터기준일자를 담는다. 주민이나 창업 예정자가 "사하구 어느 동네에 미용실·이발소가 몰려 있나"를 확인하거나 상권 분석가가 업종별 업소 분포를 파악하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 도로명 주소나 업소명을 맞춰 연결해야 한다.
