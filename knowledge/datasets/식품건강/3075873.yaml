description_portal: '본 데이터는 부산광역시 내에 위치한 집단급식소의 상세 현황 정보를 제공하는 공공데이터입니다.집단급식소란 영리를 목적으로 하지 않으면서 특정 다수(예: 기숙사, 학교, 병원, 회사 등)에게 계속적으로 식사를 제공하는 급식 시설을 의미하며, 「식품위생법」에 따라 위생 관리가 엄격하게 이루어집니다. 이 데이터는 급식소의 위치 및 기본적인 정보를 담고 있어, 위생 관리 및 감독, 공중 보건 정책 수립, 지리정보시스템(GIS) 기반의 급식소 분포 분석, 또는 특정 지역의 급식 수요 파악 등에 유용하게 활용될 수 있습니다.구군명, 업소명, 소재지 주소, 위도, 경도 항목에 대한 정보를 제공합니다.연 1회  정기적으로 업데이트 하고 있으며, 필요 시 수시 반영 될 수 있습니다.'
