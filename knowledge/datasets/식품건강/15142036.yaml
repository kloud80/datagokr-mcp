summary_user: 서울특별시 마포구 관내 미용업소(헤어·메이크업·네일 등)의 인허가 정보를 업소 한 곳당 한 행으로 담은 원천 목록으로, 인허가일자·영업상태·폐업일자·소재지 주소·좌표·업태·건물 층수·종사자 수 등을 포함한다. 주민이나 창업 준비자가 '마포구에서 현재 영업 중인 미용실은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인할 때 쓰고, 분석가는 개업·폐업 추이나 위치 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 이어 쓴다.
description_portal: 서울특별시 마포구의 헤어, 메이크업, 네일아트와 같이 얼굴, 머리, 피부 등을 손질하여 외모를 아름답게 꾸미는 업소 정보에 대한 설명입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민과 행정기관은 관내 미용업소의 위치와 서비스·운영 현황을 쉽게 파악하고, 위생·안전·소비자 보호 정책을 효율적으로 수립할 수 있습니다.
