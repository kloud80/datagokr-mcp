summary_user: 대전광역시 동구에 있는 건강기능식품 일반판매업소를 업소 한 곳당 한 행으로 담은 명단으로, 업종명·업소명·도로명/지번 주소·전화번호를 담는다(CSV 약 58KB). 동구 주민이 집 근처 건강기능식품 판매점을 찾거나, 사업자가 동구 안 판매업소 분포를 보고 출점·홍보 지역을 가늠하는 데 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어서 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 대조해야 한다.
description_portal: '이 데이터는 대전광역시 동구에 위치한 건강기능식품 일반판매업소 현황에 대하여 데이터를 제공하고 있습니다. 데이터의 세부 내용으로는 건강기능식품 일반판매업 업종의 업소명, 소재지 전화번호, 소재지 주소(도로명, 지번)을 제공하고 있습니다. 이 데이터는 소비자들이 건강기능식품 판매업소를 찾는 데 유용하며, 사업자들이 건강기능식품 판매시장의 시장 분석 및 홍보를 위한 참고자료로도 활용될 수 있습니다.대전광역시 동구는 이러한 정보 공개를 통해 안전한 식품 소비 환경 조성에 기여하며, 건전한 건강기능식품 시장의 투명한 정보공개를 위해 노력하고 있습니다. * 데이터 기준일: 2026. 7. 30.'
