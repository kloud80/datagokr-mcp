summary_user: 서울특별시 성동구에서 식육·원유·식육가공품 등 축산물을 운반하는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·취소일자, 영업상태와 폐업일자, 휴업 기간, 소재지 지번·도로명 주소와 좌표(X, Y)를 포함한다. 성동구 안에서 지금 영업 중인 축산물 운반업체가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지를 확인하려는 위생 감시 담당자나 축산물 유통 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드·관리번호(MGTNO) 같은 기관 내부 코드나 업소명·주소 매칭으로만 연결하며, 다른 지자체의 같은 업종 인허가 데이터와 같은 필드 구조로 이어 붙이는 방식이 현실적이다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 축산물(식육, 원유, 식육가공품 등)을 전문적으로 운반하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 축산물은 신선도 유지와 위생 관리가 매우 중요한 식품군으로, 유통 과정에서의 안전성 확보가 필수적입니다. 이에 본 데이터는 축산물 운반 업소의 인허가 이력과 행정적 관리 상태를 명확히 파악하고, 관련 정책 및 위생 관리 대책 수립에 활용할 수 있도록 설계되었습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 인허가 내역, 영업 개시 및 종료, 폐업 여부 등 행정 정보가 포함되어 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현장 점검과 자료 갱신을 실시하여 데이터의 신뢰성과 최신성을 보장합니다. 본 데이터는 축산물 유통 안전관리, 업계 동향 및 정책 분석, 위생 감시, 소비자 정보 제공 등 다양한 분야에서 활용될 수 있습니다. 누구나 실질적이고 객관적인 정보를 확인할 수 있도록 데이터는 정기적으로 최신화됩니다.
