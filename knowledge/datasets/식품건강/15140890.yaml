summary_user: 서울특별시 광진구 안에서 인허가를 받은 의원급 의료기관(의원·한의원·치과의원 등)을 업소 한 곳당 한 행으로 담은 원장으로, 의료기관명·소재지 주소·인허가일자·영업상태·폐업일자·병상 수·의료인 수·진료과목 등을 담는다. 구 보건 담당자나 분석가가 '광진구 어느 동에 치과의원이나 한의원이 몰려 있고, 최근 몇 년 사이 폐업한 곳은 어디인가' 같은 지역 의료 접근성 질문에 쓴다. 실측 컬럼에 전국 단위로 통하는 조인 키는 없어서, 다른 데이터와는 관리번호(MGTNO)나 개방자치단체 코드, 주소·업소명 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 내에서 의원급 의료기관이 인허가를 받아 운영 중인 현황 정보를 제공합니다. 의원은 「의료법」에 따라 의사, 치과의사 또는 한의사가 환자를 대상으로 외래 진료를 주로 수행하는 1차 의료기관이며, 해당 시설에는 의원, 한의원, 치과의원, 보건소 등이 포함됩니다. 본 데이터에는 의료기관명, 소재지, 업종 구분, 인허가일자 등의 항목이 수록되어 있으며, 지역 내 의료 접근성 파악, 보건의료 인프라 분석, 감염병 대응 기반 구축, 민간·공공 진료망 관리 등의 행정 및 정책 수립에 활용됩니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 좌표(WGS84)는 포함되어 있지 않으므로 지도 기반 시스템 연계 시 좌표 변환 작업이 필요합니다. 이 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신되며, 광진구 보건의료자원 현황 분석 및 의료기관 운영 관리에 필수적인 기초자료로 활용됩니다.
