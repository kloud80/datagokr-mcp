summary_user: 서울 종로구 관내 유통전문판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태와 상세영업상태·폐업일자·소재지 지번/도로명 주소·사업장명·좌표(XCRD, YCRD)·종업원 수 등이 들어 있다. 종로구에서 현재 영업 중인 유통전문판매업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 언제 폐업했는지를 확인하려는 시민·사업자·분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 식품 인허가 업종 데이터나 다른 자치구 데이터와는 기관 코드(OGDP_INST_CD)·주소·사업장명 매칭이나 좌표로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 유통전문판매업체의 인허가 현황을 정리한 자료입니다. 자료에는 지방자치단체 코드, 관리번호, 인허가일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등이 포함되어 있어 각 업체의 인허가 절차와 현재 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 행정기관은 유통전문판매업체 관리, 법규 준수 여부 점검, 안전 및 위생 기준 적용 확인 등 효율적인 행정 업무 수행에 활용할 수 있으며, 연구자와 정책 담당자는 지역 내 업체 분포와 운영 현황을 분석하여 정책 개선과 안전 관리 계획 수립에 참고할 수 있습니다. 또한 시민은 신뢰할 수 있는 업체 정보를 확인하여 안전하고 합법적인 거래 환경 선택에 기여할 수 있습니다. 본 자료는 유통전문판매업 관리와 관련 정책 수립 등 다양한 분야에서 중요한 기초 자료로 활용됩니다.
