summary_user: 서울 양천구에서 인허가한 기타 식품판매업소(마트처럼 일정 규모 이상 영업장에서 식품을 파는 업소)를 업소 한 곳당 한 행으로 담은 건별 인허가 원장으로, 업소명·인허가일·영업상태·폐업일·지번/도로명 주소·좌표·소재지면적·종사자수 등을 포함한다. 상권 분석가나 창업 준비자가 '양천구에서 현재 영업 중인 중대형 식품판매 매장은 어디에 몇 곳이고 언제 문을 열거나 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·개방자치단체코드·주소·업소명 매칭이나 좌표(X, Y)를 통한 위치 결합으로 이어 써야 한다.
description_portal: 본 데이터는 서울특별시 양천구에서 관리하는 기타 식품판매업의 인허가 현황을 체계적으로 제공하기 위해 구축된 자료이다. 해당 데이터에는 업소의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 급수시설구분、 종사자수 등이 포함되어 있어 지역 내 영업 실태를 종합적으로 파악할 수 있다. 또한 인허가 절차의 투명성을 강화하고 민원 처리의 효율성을 높이기 위한 행정 기반 자료로 활용될 수 있다. 이용자는 본 자료를 통해 업소 운영의 적정성, 영업 형태, 관리 이력 등을 확인할 수 있으며, 행정기관은 이를 바탕으로 안전한 식품 유통 환경 조성과 정책 수립 업무를 수행할 수 있다. 데이터는 표준화된 형식으로 정기 갱신되며, 공공데이터 활용도를 향상시키는 데 기여한다.＊식품판매업(기타) －제과점, 즉석판매제조가공업, 유통판매업 등에 속하지 않고 마트와 같은 일정 규모 이상의 영업장에서 식품을 판매하는 업소
