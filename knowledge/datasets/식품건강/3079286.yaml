summary_user: 부산 사하구 관내에 축산물판매업으로 등록해 영업 중인 업체를 한 행씩 담은 업소별 원천 목록으로, 판매업 구분(식육판매업·우유류판매업·식용란수집판매업·축산물보관업·축산물운반업 등), 업체명, 소재지 주소, 대표 전화를 담는다. 주민이나 사업자가 '사하구 안에 정육점·식용란 판매업소가 어디에 몇 곳 있나'를 확인하거나, 분석가가 구 단위 축산물 유통업소 분포를 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 업체명·주소를 맞춰 붙이거나 같은 기관의 다른 식품 인허가 업소 목록과 나란히 보는 방식으로 이어 쓴다.
limits: 사하구 한 구만 다루므로 부산 전체나 다른 시군구와 비교하려면 각 구 데이터를 따로 모아야 한다. 인허가번호·사업자번호 같은 공통 키가 없어 행정처분·위생 데이터와 정확히 매칭하기 어렵다. 휴대폰번호 등 개인정보와 미집계된 전화번호는 공백이라 연락처로 전수 활용할 수 없다.
