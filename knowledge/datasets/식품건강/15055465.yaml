summary_user: 경기도 부천시 관내 즉석판매제조가공업소를 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·업소명·도로명 소재지·우편번호·전화번호를 담는다(약 117KB CSV). 주민이나 사업자가 '우리 동네에 반찬·떡 등을 직접 만들어 파는 즉석판매제조가공업소가 어디 있나'를 찾거나, 분석가가 부천시 내 업소 분포를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서 다른 식품 인허가·행정처분 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
