summary_user: 인천광역시 서구 안에 있는 위생용품제조업체를 업소 한 곳당 한 행으로 정리한 목록으로, 업종명·업소명·도로명 및 지번 소재지·전화번호를 담는다(CSV 약 4KB 규모). 주민이나 사업자가 "서구에서 위생용품을 만드는 업체는 어디에 있고 연락처는 무엇인가"를 확인하거나, 분석가가 구 단위 위생용품 제조업 분포를 파악하는 데 쓴다. 전역 조인 키나 코드 컬럼이 없어 다른 데이터와는 업소명·주소 문자열로 맞추거나 같은 기관(서구) 자료끼리 이어 써야 한다.
