summary_user: 어린이 식생활안전관리 특별법에 따른 어린이 기호식품 품질 인증 제품을 인증번호 단위로 담은 전국 대장으로, 품목명·식품유형·업소명·내용량·인증 시작일과 종료일이 들어 있다. 학부모나 유통·급식 담당자가 특정 과자·음료가 품질 인증을 받았는지, 인증이 아직 유효한지 확인하는 데 쓴다. 실측상 전역 조인 키는 없지만, 품목제조보고번호(PRDLST_REPORT_NO)로 같은 식약처의 품목제조보고·바코드·영양성분 데이터와 제품 단위로 잇고, 인허가번호(LCNS_NO)로 식품 인허가 업소 데이터와 잇는다.
description_portal: 식품의약품안전처에서 관리하는 어린이 식생활안전관리 특별법에 따른 어린이 기호식품 품질 인증대장 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
