summary_user: 대전광역시 유성구 관내 이용업소(이발소 등)를 업소별로 한 행씩 담은 파일로, 사업장명·지번/도로명 주소·전화·면적·인허가일자와 업태 구분을 담는다(포털 설명 기준 68행). 주민이 집 근처 이용원을 찾거나, 분석가가 유성구 이용업소의 분포와 인허가 시기를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(소재지주소·도로명주소)나 사업장명으로 맞춰 이어야 하며, 같은 구의 다른 공중위생업 현황과는 업태구분명 기준으로 나란히 비교한다.
description_portal: 대전광역시 유성구 이용업 현황에 대한 데이터를 제공합니다.해당 데이터는 업태구분명, 위생업태명, 사업장명, 소재지주소, 도로명주소, 소재지전화, 소재지면적, 인허가일자 등의 데이터를 포함하여, 총 68개의 행으로 구성되어 있습니다.해당 데이터는 정기적으로 현행화하여 공개하고 있습니다.이 데이터는 유성구 관내 이용업 현황 등의 정보를 포함하고 있어 데이터 이용자의 정보 접근성과 행정자료 검색의 효율성 향상에 기여할 수 있습니다. 이를 통해 정책 수립 및 분석, 행정자료 활용, 공공행정 연구, 위치기반 서비스 개발 등 다양한 분야의 기초 자료로 활용이 가능합니다.
