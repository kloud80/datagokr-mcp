description_portal: 본 데이터는 서울특별시 양천구에서 관내 집단급식소식품판매업 시설의 인허가 현황을 체계적으로 관리하기 위해 구축한 행정자료이다. 해당 업종은 급식 제공 기관에 식재료나 반조리 식품을 공급하는 역할을 수행하는 만큼 위생관리와 안전성 확보가 중요한 분야로, 자료에는 사업장 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등 주요 항목이 포함된다. 또한 신규 허가, 변경 신고, 행정처분, 휴·폐업 등 절차별 이력 정보를 제공하여 공급 단계의 안전관리 실태를 종합적으로 파악할 수 있도록 구성되어 있다. 본 데이터는 지역 내 급식 관련 공급망의 운영 현황을 투명하게 공개함으로써 급식 안전성 강화, 지도점검 계획 수립, 정책 개발 등 행정업무 수행에 필요한 기반 정보를 제공한다. 아울러 정기적인 갱신을 통해 최신 인허가 정보를 유지하여 민원 대응과 서비스 품질 향상에도 기여한다.* 집단급식소식품판매업- 집단급식소를 대상으로 식품을 판매하는 업소
