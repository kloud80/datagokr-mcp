summary_user: 서울특별시 중랑구에서 제과점·즉석판매제조가공업·유통판매업에 속하지 않고 마트처럼 일정 규모 이상 영업장에서 식품을 파는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장이다. 인허가일자·영업상태·폐업일자·주소·사업장명·좌표·시설면적 등을 담고 있어, 창업 준비자나 상권 분석가가 '중랑구에서 지금 영업 중인 대형 식품판매 업소는 어디에 몇 곳이고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관(개방자치단체 코드) 기준으로만 이어 쓰며, 좌표(X, Y)는 중부원점TM(EPSG:5174)이라 위경도 데이터와 겹치려면 좌표 변환이 필요하다.
description_portal: '서울특별시 중랑구의 제과점, 즉석판매제조가공업, 유통판매업 등에 속하지 않고 마트와 같은 일정 규모 이상의 영업장에서 식품을 판매하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
