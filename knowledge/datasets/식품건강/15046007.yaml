description_portal: 서울시 식품위생업소 (층) 현황 데이터는 식품위생 관련 업소의 위치와 층별 분포, 건물 내 입지 특성을 파악하기 위해 구성된 자료입니다. 시군구코드, 업종명, 업태명을 통해 업소의 행정 구분과 업종 특성을 확인할 수 있으며, 허가신고일과 폐업일자를 통해 영업 기간과 추이를 분석할 수 있습니다. 업소명, 소재지 도로명과 지번 주소, 행정동명, 법정동명 정보는 업소의 정확한 공간적 위치를 제공하며, 영업장면적을 통해 규모를 파악할 수 있습니다. 특히 지상·지하의 시작층과 끝층, 총층수, 업소위치 정보는 업소가 건물의 어느 층에 분포하는지를 상세히 보여주어, 지하·지상 업소 비율, 특정 층 집중도, 건축 환경과의 관계 등 입지 특성 분석과 안전·위생 관리 정책 수립에 활용할 수 있는 기초 자료입니다.
