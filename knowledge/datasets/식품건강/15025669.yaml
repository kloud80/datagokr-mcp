summary_user: 부산광역시 사상구에 영업신고된 집단급식소(기숙사·학교·어린이집·병원·사회복지시설·산업체·공공기관 등의 비영리 급식시설)를 업소 단위로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호로 구성된다. 사상구 안에서 어떤 기관·사업장이 집단급식소로 신고되어 있는지, 특정 주소 주변의 급식시설 연락처를 확인하려는 주민·위생 담당자·분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표)가 없어 다른 식품 인허가·행정처분 데이터와는 업소명이나 도로명 주소를 맞춰 연결해야 한다.
description_portal: '해당 자료는 부산광역시 사상구에 영업신고된 집단급식소 현황(업소명, 소재지, 소재지전화번호)의 현황에 대한 정보를 제공합니다.업소에 대한 기본정보(업종명, 업소명, 소재지주소, 업소전화번호)로 구성된 데이터입니다.*집단급식소: 영리를 목적으로 하지 아니하면서 특정 다수인에게 계속하여 음식물을 공급하는 다음 각 목의 어느 하나에 해당하는 곳의 급식시설가. 기숙사나. 학교, 유치원, 어린이집다. 병원라. 「사회복지사업법」 제2조제4호의 사회복지시설마. 산업체바. 국가, 지방자치단체 및 「공공기관의 운영에 관한 법률」 제4조제1항에 따른 공공기관사. 그 밖의 후생기관 등'
