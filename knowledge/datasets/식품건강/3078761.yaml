summary_user: 부산광역시 사상구 관내에 소독업 신고가 수리된 업소를 한 곳씩 담은 목록으로, 업소명·사무실 소재지·전화번호를 개별 업소 단위로 제공하는 작은 CSV 파일(약 4KB)이다. 방역·소독을 맡길 업체를 찾는 주민이나 관리사무소, 또는 사상구 소독업소 분포를 보려는 분석가가 '우리 동네 근처에 신고된 소독업체는 어디인가'를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 업소명이나 소재지 주소를 매칭해 연결해야 한다.
description_portal: 감염병의 예방 및 관리에 관한 법률 제52조(소독업의 신고 등)에 따라 개설 신고가 수리된 부산광역시 사상구 관내 소독업에 대한 정보를 제공합니다.  (소독업소명, 소독업소 사무실소재지, 소독업소 전화번호 등)소독을 업으로 하려는 자는 보건복지부령으로 정하는 시설, 장비 및 인력을 갖추어 구청장에게 신고하여야합니다. 또한 소독업자는 신고사항(소재지, 명칭, 법인의 대표자, 그 밖의 사항)을 변경하려는 경우 소독업 신고사항 변경신고서, 소독업 신고증, 변경사항을 증명할 수 있는 서류를 첨부하여 구청장에게 신고하여야 합니다.
