summary_user: 광주 광산구 관내 단란주점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·인허가일자·업소명·도로명 소재지·전화번호·우편번호·데이터기준일자가 들어 있다. 구청 위생·안전 담당자나 상권 분석가가 '광산구 어느 동네에 단란주점이 몰려 있고 언제 인허가를 받았나'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표)는 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명 주소를 맞춰 연결하고, 지도에 올리려면 주소를 따로 좌표로 바꿔야 한다.
description_portal: '광주광역시 광산구에 위치한 단란주점에 대한 현황 정보는 관내 위생 및 안전 관리를 위한 기초자료로 활용되며, 다양한 항목이 포함되어 있습니다. 이 데이터는 업소명, 소재지, 전화번호, 우편번호 등의 정보를 포함하고 있습니다. 이는 위생 점검이나 관련 법령 적용 기준을 구체화하는 데 활용됩니다. 또한 다중이용업소 여부는 해당 사업장이 많은 이용객을 수용하는 시설인지 여부를 나타내며, 안전 점검이나 긴급 상황 대응 계획 수립에 중요한 기준이 됩니다. 나아가 유사업종에 대한 비교·분석이나 지역 내 업종별 분포 현황을 파악하는 데도 유용하게 활용됩니다.이와 같은 광산구 단란주점 현황 정보는 보건·위생 행정, 공공안전 관리, 단란업소 분포 분석 및 정책 수립 등 다양한 분야에서 기초 자료로 활용될 수 있는 중요한 행정 데이터입니다.※ 자료 제공 : 광주광역시 광산구 식품위생과'
