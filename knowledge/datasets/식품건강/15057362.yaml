summary_user: 경기도 31개 시군의 휴게음식점 가운데 키즈카페로 운영되는 업소를 한 곳씩 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·소재지 면적·종사자 수·다중이용업소 여부·주소와 좌표를 포함한다. 학부모나 창업 예정자, 지자체 분석가가 우리 시군에서 영업 중인 키즈카페가 몇 곳이고 어디에 몰려 있는지, 최근 개업·폐업 흐름이 어떤지 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소 문자열로 다른 경기도 데이터와 맞추고, 위경도 좌표로 상권·공간 분석에 연결한다.
description_portal: 이 데이터는 경기도 내 휴게음식점 중 키즈카페 형태로 운영되는 업소의 현황 정보를 담고 있습니다. 데이터에는 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 주소 및 면적, 위생업종명, 위생업태명, 총시설규모, 종사자 수(남녀별), 다중이용업소 여부 등의 항목이 포함되어 있으며, 총 31개 시군에 대한 인허가 정보를 기반으로 합니다. 데이터는 어린이 대상의 식품판매업소 운영 실태 분석, 위생관리 및 안전대책 수립, 키즈카페 이용자 보호 정책 등에 활용될 수 있습니다. API는 인증키를 통해 접근 가능하며 XML 또는 JSON 형태로 제공됩니다.
