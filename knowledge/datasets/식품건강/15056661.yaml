summary_user: 경기도에서 발생한 식중독 사례를 집계연도·발생년월별로 정리해 환자 수(STATS_PATNT_CNT), 역학조사로 밝힌 원인물질, 원인시설 구분을 담는 경기도 단위 비공간 자료다. 분석가나 식품안전 담당자가 '경기도에서 어떤 시설과 원인물질로 식중독 환자가 많이 생겼고, 어느 달에 몰리는가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 식품안전 데이터와는 연도·월이나 원인시설 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도에서 발생한 식중독 사례의 발생 현황을 제공하는 자료로, 통계환자 수, 발생년월, 원인물질 및 원인시설에 대한 역학조사 결과 등을 포함합니다. 총 9개 항목으로 구성되며, 식중독 발생의 원인을 파악하고 통계적으로 관리하기 위한 기초자료로 활용됩니다. 감염병 예방, 식중독 위험 예측 및 대응 체계 수립, 식품안전 관리 정책 개발 등에 유용하게 활용될 수 있습니다. 데이터는 수시로 갱신되며, 식품안전과에서 제공하고, Open API를 통해 시스템 연계도 가능합니다. 이전 데이터는 파일 탭을 통해 다운로드할 수 있습니다.
