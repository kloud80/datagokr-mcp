summary_user: 정읍시에 있는 제과점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명주소·지번주소·전화번호·데이터기준일자를 제공한다(CSV 약 4KB 규모). 시민이 '우리 동네 근처 제과점이 어디 있고 연락처가 무엇인가'를 찾거나, 분석가가 정읍시 안 제과점 분포를 주소 단위로 살펴보는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·위생·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 전북특별자치도 정읍시에 소재한 제과점 현황중 업소명, 소재지도로명주소, 소재지지번주소, 소재지연락처의 자료를 제공합니다.시민 및 소비자는 맞춤형 서비스를 추천받고 접근성이 향상될 것입니다. 민간 및 기업은 시장 동향 분석을 통해 제품 개발 및 재고 관리의 효율성을 높일 수 있고 또한, 데이터 기반의 새로운 비즈니스 모델 창출과 산업 경쟁력 강화에 기여하여 궁극적으로 소비자 후생 증진을 기대할 수 있습니다.기타 궁금하거나 문의하실 사항이 있을 시 담당부서인 정읍시 보건소로 문의하시기 바랍니다.
