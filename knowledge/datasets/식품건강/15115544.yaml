summary_user: 서울특별시 중랑구에서 부패·변질되기 쉬운 식품(유산균 음료, 어류, 조개류 등)을 운반하는 식품운반업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 포함한다. 사업자나 분석가가 '중랑구에서 현재 영업 중인 식품운반업체는 어디이고 언제 인허가를 받았는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 다른 업종의 식품 인허가 데이터와 같은 컬럼 구조로 나란히 비교하는 데 쓴다.
description_portal: '서울특별시 중랑구의 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
