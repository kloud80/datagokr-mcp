summary_user: 수입식품 해외수출업소대장은 수출업소 단위로 수출국가, 업소코드·업소명, 주소, 전자우편, 번호 변경이력을 담는 대장 데이터다. 무역·유통업체가 특정 수출국의 어떤 업소가 등록돼 있는지, 업소 번호가 바뀐 이력이 있는지 확인하는 질문에 쓴다. 실측으로 확인된 조인 키는 수출업소주소(EXPRT_ENTP_ADDR) 하나뿐이며, 같은 수입식품 부문의 다른 데이터와는 업소코드·주소로 대조해 이어 쓴다.
description_portal: 식품의약품안전처 「수입식품 해외수출업소대장 정보」 OpenAPI는 국내 수입식품업체 중 해외로 수출하는 업소의 정보를 제공합니다. 제공 항목에는 수입식품 수출국가정보, 지역명, 수출업소코드, 수출업소명, 주소, 수출업소번호변경이력, 수출업체번호(구) 등이 포함되어 있어 어떤 업소가 어떤 국가로 수출하고 있는지, 수출업소의 연락처 및 장소 정보, 변경된 업소 코드 히스토리 등을 확인할 수 있습니다. 또한 무역업체나 유통업체는 수출 파트너 확인에, 연구자 및 기관에서는 해외 수출업소 분포 및 등록 관리 현황 등에 활용할 수 있습니다.
