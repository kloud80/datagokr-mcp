summary_user: 서울특별시 동작구에서 인허가를 받은 유흥주점(스탠드바·룸살롱·노래클럽 등)을 업소 한 곳당 한 행으로 담은 인허가 원장 파일로, 인허가일자·영업상태·폐업일자·주소·면적·종사자 수·중부원점 TM 좌표를 포함한다(CSV 약 22KB). 동작구에서 현재 영업 중이거나 폐업한 유흥주점이 어디에 몇 곳 있는지, 특정 업소의 영업 상태가 어떤지 확인하려는 주민·사업자·상권 분석가가 쓴다. 전역 조인 키가 없으므로 다른 자치구의 같은 업종 인허가 파일과는 관리번호·주소·사업장명 같은 공통 컬럼으로 이어 붙이고, 행정처분·위생 정보와는 업소명·주소 매칭으로 연결한다.
description_portal: '이 데이터는 서울특별시 동작구의 스텐드바, 룸살롱, 노래클럽 등 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소정보를 포함하고 있습니다. 좌표안내 : 중부원점 TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 본 데이터는 3일전 자료를 제공합니다.'
