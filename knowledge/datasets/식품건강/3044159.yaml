summary_user: 인천광역시 보건환경연구원이 2025년에 수행한 유통식품 검사(정부수거검사, 자가품질검사, 식품 기준규격 재평가 사업 등)의 건수를 검사 구분별 행과 1~12월 열로 정리한 월별 집계표로, 파일 크기가 298바이트에 불과한 작은 표다. 시정 담당자나 분석가가 '인천시 유통식품 검사는 어느 달에 많이 이뤄졌고 검사 유형별 비중은 어떤가'를 보고 시기별 집중 관리 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도 보건환경연구원 검사실적이나 식품 부적합·회수 데이터와는 연도·월과 검사 구분 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
limits: 검사 건수 집계만 담고 있어 개별 제품·업소·부적합 판정 결과나 유해물질 검출 수치는 알 수 없다. 명세상 연 단위로 만들어진 뒤 바뀌지 않는 파일이라 다른 연도와 비교하려면 연도별 파일을 따로 모아야 하고, 표준 조인 키가 없어 다른 데이터와는 이름 매핑으로만 연결된다.
