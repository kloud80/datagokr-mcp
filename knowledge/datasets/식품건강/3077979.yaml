summary_user: 인천 영종구(포털 설명상 옛 중구) 관내 의료기기 판매·임대업소를 업소 한 곳당 한 행으로 담은 파일로, 영업소명·소재지·전화번호·데이터기준일자가 들어 있다(CSV 약 19KB). 주민이 집 근처 의료기기 판매업소의 위치와 연락처를 찾거나, 분석가가 구 안의 의료기기 유통 업소 분포를 살펴보는 데 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어서 다른 데이터와는 업소명이나 주소를 직접 맞춰 이어 쓴다.
description_portal: 인천광역시 중구 관내에 위치한 의료기기 판매업소 현황에 대한 데이터 입니다.의료기기 판매업소 공공데이터는 인천광역시 중구에서 운영 중인 의료기기 판매·임대업소의 기본 정보를 한눈에 확인할 수 있도록 제공되는 자료입니다.해당 데이터에는 업체명, 소재지, 연락처 등이 포함되어 있어 이용자가 신뢰할 수 있는 업소를 선택하는 데 도움을 주며또한 지자체의 관리·감독 및 관련 정책 수립에 활용되어 의료기기 유통의 안전성과 투명성을 높이는 데 기여합니다.파일명 인천광역시_중구_의료기기 판매업소 현황파일내용 영업소명, 소재지 주소 등
