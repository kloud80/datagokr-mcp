description_portal: '광주광역시 보건환경연구원 식품 중 방사능 검사 현황 데이터는 광주광역시 지역 내 유통 식품, 학교급식 식재료, 농수산물도매시장 내 유통 수산물에 대하여 방사능 2종(요오드, 세슘)예 대하여 정밀검사한 결과입니다. - 검사기간: 2024년 1월 1일~12월 31일- 검사항목: 요오드-131과 세슘-134, 세슘-137- 제품분류 구분: 농산물, 수산물, 가공식품 3종- 원산지 구분: 국내산, 수입제품의 경우 국가 표기- 검출단위: Bq/Kg- 적부판정 기준: 식품공전에 따라 일반 식품 100Bq/Kg 초과시 부적합 판정* 일부 유아용 식품의 경우 기준은 50Bq/Kg 초과시 부적합 판정'
