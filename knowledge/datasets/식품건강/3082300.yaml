summary_user: 광주 지역 유통 식품·학교급식 식재료·농수산물도매시장 수산물을 대상으로 2024년 한 해 동안 요오드-131과 세슘-134·137을 정밀검사한 결과를 제품 건별로 담은 파일이며, 제품명·분류(농산물·수산물·가공식품)·수거일·원산지·검출량(Bq/kg)·적부판정이 들어 있다. 소비자나 급식 담당자가 '우리 지역에서 유통된 수입 수산물에서 세슘이 검출된 적이 있는가, 기준(일반 100Bq/kg, 일부 유아용 50Bq/kg)을 넘은 사례가 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 회수·부적합·수입식품 데이터와는 제품명이나 원산지 국가명을 맞추는 방식으로만 이어 쓸 수 있다.
