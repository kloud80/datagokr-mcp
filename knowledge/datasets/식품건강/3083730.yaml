summary_user: 전남광주통합특별시 서구의 음식점 업소를 한 곳씩 담은 건별 목록으로, 업종명·업소명·도로명 및 지번 주소·면적을 싣고 검증 수신 기준 5,073행이다. 위생 점검 대상 선정이나 서구 지역 상권 분석처럼 "구 안에 어떤 업종의 음식점이 어디에 얼마나 있는가"를 묻는 분석가와 담당자가 쓴다. 소재지도로명주소·소재지지번주소를 주소 키로 삼아 다른 주소 기반 데이터와 이어 쓰며, 사업자번호나 좌표 필드는 이 파일에 없다.
description_portal: 이 데이터는 광주광역시 서구에 소재한 음식점에 대한 현황 정보를 포함하고 있습니다. 주요 항목은 업소의 영업명칭, 업소명, 소재지(도로명주소 및 지번주소), 면적 등으로 구성되어 있습니다.음식점의 분포 및 영업 특성을 파악할 수 있도록 설계된 본 자료는, 위생 관리 및 식품안전 정책 수립, 지역 상권 분석, 외식업체 분포 현황 파악, 위생 점검 대상 선정 등에 유용하게 활용될 수 있습니다. 특히 도로명주소 기반의 위치 정보와 면적 데이터가 포함되어 있어, 공간정보 기반 상권 분석과 위생 관리 사각지대 해소를 위한 자료로도 중요합니다.또한 업종명 구분을 통해 한식, 중식, 일식, 기타 음식점 등 업종별 현황 분석이 가능하며, 연도별 등록 정보 및 업소별 고유값(연번)도 제공되어 시계열 분석에도 활용도가 높습니다.
