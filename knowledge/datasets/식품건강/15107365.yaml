summary_user: 식품의약품안전처가 관리하는 식육즉석판매가공업 인허가 대장으로, 업소 단위로 인허가번호·업소명·대표자명·업종·허가일자·주소를 담으며 전국 범위에서 API 전체 건수는 16건이다. 창업 준비자나 상권 분석가가 전국에 등록된 식육즉석판매가공업 업소가 어디에 있는지 확인하는 질문에 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 업소명·주소 매핑이나 같은 기관의 코드로만 잇고, 같은 부문의 식품 인허가 업소 계열과 함께 본다.
limits: API 전체 건수가 16건이라 전국 식육즉석판매가공업 전체 현황으로 읽기에는 범위가 좁을 수 있으니 해석에 주의한다. 전역 조인 키가 없어 외부 데이터와의 결합은 이름·주소 매핑 오차를 감안해야 한다. 호출은 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
