summary_user: 부산광역시 북구 관내에서 안심식당으로 지정된 음식점을 업소 한 곳당 한 행으로 담은 목록 파일로, 사업장명·업종·업종상세·주소·전화번호·지정일이 들어 있다. 북구 주민이나 방문객이 '북구에서 안심식당으로 지정된 한식당이 어디인가'를 찾을 때, 분석가가 구 단위 위생 지정 업소 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 업소 원장 등과는 사업장명·주소를 맞춰 보는 방식으로만 연결된다.
description_portal: 부산광역시 북구 관내에 위치한 음식점 중 식사문화 개선 과제를 실천하고 생활방역 수칙을 준수하는 업소를 안심식당으로 지정하여 그 현황 데이터를 제공합니다. 이 데이터에는 안심식당명, 엄종명, 업종상세, 전화번호, 주소 등의 항목이 포함되어 있으며, 전화번호의 경우 개인정보 보호를 위해 일부 공란으로 처리되어 있습니다. 시민들이 보다 안전하고 위생적인 환경에서 식사할 수 있도록 지원하기 위한 목적이며, 안심식당 이용 활성화를 통해 지역 내 방역 수준 향상과 건강한 외식 문화 조성을 도모할 수 있습니다.
