summary_user: 식중독 발생 현황을 발생장소(원인시설)별로 묶어 연도·월 단위의 발생건수와 환자수를 담은 전국 단위 집계 목록이다. 학교·음식점처럼 어떤 시설에서 식중독이 자주 나고 환자가 많은지, 특정 월에 발생이 몰리는지를 보려는 정책 분석가나 급식·외식 사업자의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식중독·행정처분 데이터와는 연도·월과 시설 구분 이름을 맞춰서만 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 식중독 원인시설별 정보 자료입니다.발생장소에  따른 식중독 현황을 목록으로 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
