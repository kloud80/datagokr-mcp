description_portal: 소비자에게 안전한 먹거리를 제공하기 위한 부산광역시 위생등급지정업소현황 데이터를 개방합니다.위생등급은 식품의약품안전처에서 음식점이나 식품 취급 시설의 위생 상태를 평가하여 등급을 부여하는 제도입니다. 이는 소비자에게 안전한 먹거리를 제공하고, 업주의 위생 관리 수준을 향상시키기 위해 시행하고 있습니다. 음식점의 위생 수준을 평가하여 매우우수, 우수, 좋음 등급을 지정하고 이를 공개해 소비가자 안심하고 음식점을 선택할 수 있도록 돕습니다.개방되는 데이터는 상점명, 주소, 지정등급 등의 내용이 포함됩니다.
