summary_user: 부산광역시에서 위생등급(매우우수·우수·좋음)을 지정받은 음식점을 업소 한 곳씩 담으며, 업소명·주소·지역·전화번호·좌표를 제공한다. 외식할 때 "우리 동네에서 위생등급을 받은 식당이 어디인가"를 찾거나, 구·군별 위생등급 업소 분포를 지도로 보려는 시민과 분석가가 쓴다. 실측 컬럼에는 인허가번호 같은 공통 조인 키가 없어서, 식품 인허가 업소 원장이나 행정처분 데이터와는 업소명·주소를 맞춰 보거나 좌표로 연결해야 한다.
limits: 전국 단위 고유 키가 없어 다른 데이터와 정확히 1:1로 조인되지 않고, 업소명·주소 매칭에서 오차가 생길 수 있다. 범위는 부산광역시에 한정된다. 개발계정은 하루 10,000회까지 호출할 수 있다.
