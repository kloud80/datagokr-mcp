summary_user: 서울특별시 강서구에서 인허가를 받은 단란주점을 업소 한 곳당 한 행으로 담은 인허가 원장이다. 인허가일자, 사업장명, 지번·도로명 주소, 영업상태, 폐업일자, 좌표(X·Y), 시설 면적 등이 들어 있다. 강서구 상권을 분석하는 사람이나 자치구 담당자가 "강서구에 지금 영업 중인 단란주점은 어디에 몇 곳이고, 최근 신규·폐업 추세는 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결되고, 다른 자치구·업종의 같은 형식 인허가 데이터와 나란히 붙여 쓰는 방식이 현실적이다.
description_portal: 서울특별시 강서구에서 운영 중인 단란주점에 대한 인허가 정보를 제공하는 데이터입니다. 단란주점은 손님이 노래를 부를 수 있는 시설을 갖추고 주로 주류를 판매하는 유흥시설로, 유흥주점보다 상대적으로 소규모이며 가족, 지인 단위의 사적인 모임 장소로 활용되는 경우가 많습니다. 본 데이터에는 인허가일자, 사업장명, 주소, 전화번호, 영업상태 등의 정보가 포함되어 있어 해당 업종의 지역별 분포, 영업 실태, 신규·폐업 동향 등을 파악할 수 있습니다. 이 정보는 자치구의 유흥시설 관리, 지역 안전 관리 및 주민 민원 대응을 위한 기초자료로 활용되며, 산업동향 분석이나 상권 분석에도 유용합니다. 또한 사회적 거리두기, 방역 정책 시행 시 고위험 시설로 분류되는 업종인 만큼 위기 대응 및 규제 정책 수립에도 도움이 됩니다.
