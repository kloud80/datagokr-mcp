summary_user: 전북특별자치도 부안군 관내 공중위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·신고일자·업소명·도로명주소·위도·경도를 포함한다. 주민이나 서비스 개발자가 '부안군에서 영업 신고된 목욕탕·미용실·세탁소가 어디에 있나'를 찾거나, 담당자가 지도점검 대상 분포를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·도로명주소 같은 이름·주소 매칭이나 위도·경도 좌표로 잇는다.
limits: 업소 고유번호나 법정동 코드 같은 공통 키가 없으므로, 다른 인허가·점검 데이터와 정확히 일대일로 연결하기 어렵다. 범위는 부안군 한 곳뿐이어서 다른 시군과 비교하려면 해당 시군의 데이터를 따로 받아야 한다.
