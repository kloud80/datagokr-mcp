summary_user: '식품의약품안전처의 유전자재조합식품 안전성평가 심사 결과를 승인 건별로 담은 전국 단위 비공간 데이터로, 품목명·상품명·도입 유전자 내용·업체명·대표자·승인일자·부여 특성·고시번호·제품 종류 등을 담는다. 소비자나 수입·가공 사업자가 특정 GMO 작물이나 품목(예: 특정 옥수수·콩 계통)이 국내 안전성 심사를 통과했는지, 언제 어떤 특성으로 승인됐는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 수입식품·식품 안전 경보 등 다른 식품 데이터와는 업체명이나 품목명을 이름으로 맞춰 연결해야 한다.'
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 유전자재조합식품 안전성평가심사결과 현황 정보입니다.\""
