summary_user: 수입식품 해외제조업소별로 품목 수입 중단의 시작일시와 해제일시, 해제 사유를 건별로 담은 API 데이터이며, 전국 범위 34건(2020-05-18~2021-11-24)이다. 수입업체나 분석가가 특정 해외제조업소의 어떤 품목이 언제 중단되고 해제됐는지 확인하는 질문에 쓴다. 전역 조인 키는 없고, 해외제조업소코드(OCTR_MNFT_BSSH_CD)와 품목코드(PRDLST_CD)로 같은 기관의 수입식품 데이터와 이름·코드 매핑을 통해 잇는다.
description_portal: -본 자료는 수입식품 해외제조업소의 중단품목 정보를 상세하게 포함하고 있습니다. 주요 항목에는 해외제조업소명, 중단일련번호, 품목코드, 품목명, 품목중단시작일시, 품목중단해제일시, 중단해제코드, 중단해제코드명, 상위품목명, 해외제조업소코드 등이 포함됩니다.-이 자료를 통해 특정 해외제조업소에서 어떤 품목의 수입이 언제 중단되었고(시작일시), 중단이 해제되었는지(해제일시)를 확인할 수 있습니다. 이러한 정보는 수입식품의 안전관리, 이력 추적, 수입제도 투명성 확보에  활용될 수 있습니다.
