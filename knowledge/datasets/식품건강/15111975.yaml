summary_user: 식품이력추적 관리 대상으로 등록된 품목의 제품명·바코드·제조보고일·유통기한·제조업체·등록 취소 정보 등을 품목 단위로 담는 등록정보 API이다. 소비자나 분석가가 특정 식품이 이력추적 관리품목으로 등록돼 있는지, 제조업체와 소재지는 어디인지 확인하는 질문에 쓴다. 제조업체 주소(MADE_EXPCMP_ADDR)를 조인 키로 업소 단위 데이터와 잇고, 같은 세부 부문의 품목제조보고번호·바코드 기반 제품 데이터와 제품 단위로 잇는 방식이 부문 설명에 있다.
description_portal: 식품의약품안전처에서는 안전한 식품선택을 위한 소비자의 알 권리를 보장하고, 식품의 안전성 확보를 위한 신속한 유통차단과 회수조치를 위해제조·가공단계부터 판매단계까지 각 단계별로 이력추적정보를 기록·관리하여 정보를 제공하고 있습니다.해당데이터는 식품이력추적 관리품목에 대한 면적,취소대상여부,품목보고 대장번호,품목보고 번호4,판매타입 영유아  축산,업체를 관리하는 업체번호,등록증의 유효기간 만료일,제품이름,식품바코드,식품의 제조보고일자,식품유형코드,식품의 유통기한 등식품이력추적 관리품목의 등록정보에 대해 공개된 세부 정보를 확인할 수 있습니다.
