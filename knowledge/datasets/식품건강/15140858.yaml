description_portal: 본 데이터는 서울특별시 광진구 내 의료유사업소에 대한 인허가 현황 정보를 제공합니다. 의료유사업은 「의료법」 제82조 및 「의료유사업법」에 따라 등록 및 관리되며, 의료행위에는 해당하지 않으나 보건 위생을 목적으로 하는 업종으로서, 안마시술소, 안마원, 기타 유사업소 등을 포함합니다.데이터에는 업소명, 소재지, 업종유형, 인허가일자, 영업상태, 관할기관명 등이 포함되어 있으며, 지역 보건위생 관리, 비의료기관 지도점검, 불법의료 예방 및 소비자 피해 방지 등에 활용됩니다.또한 장애인 안마사 고용 시설 여부, 민원 대응, 유사 유흥업소와의 구분, 생활밀착형 서비스 제공 범위 분석 등 다양한 행정 수요에 부합하는 정보입니다.※ 본 데이터는 중부원점TM(EPSG:2097) 좌표계 기준 좌표 정보만 포함되며, 위도·경도 좌표는 제공되지 않습니다.※ 데이터는 3일 전 기준 최신 인허가 정보가 반영되어 있습니다.
