summary_user: 국내 건강기능식품을 제품 한 건씩 담은 원천 목록으로, 업체명·제품명·품목제조관리번호·성상·섭취량과 섭취방법·소비 및 유통기한을 전국 범위 46,336건 규모로 제공한다. 소비자는 복용 중인 건강기능식품의 섭취 방법과 유통기한을 확인하는 데 쓰고, 분석가는 어떤 업체가 어떤 제품군을 내놓고 있는지 시장 구성을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 품목제조관리번호나 업체명·제품명 매핑으로 같은 기관의 품목제조보고·바코드 DB와 식품 인허가 업소, 회수·행정처분 정보에 연결한다.
description_portal: 식품의약품안전처 「건강기능식품정보」 OpenAPI는 국내 건강기능식품의 제품별 정보를 조회할 수 있는 공공데이터입니다. 주요 제공 항목에는 업체명, 제품명, 품목제조관리번호, 성상, 용도·용법, 섭취량 및 섭취방법, 소비 및 유통기한 등이 포함되어 있어 제품의 기본 특성과 섭취 지침, 유통 기한 등의 안전 정보를 확인할 수 있습니다. 또한, 이 데이터를 통해서 연구기관 및 제약업체는 건강기능식품 시장의 제품군을 분석하고 다른 소비 조사 자료와 연계해 섭취 행태나 안전성 평가 연구의 기초자료로 참고할 수 있습니다.
