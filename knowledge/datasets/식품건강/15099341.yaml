description_portal: 본 데이터는 전라남도 목포시 내 음식점을 대상으로 품질 관련 지표를 종합적으로 수집하여 제공하는 자료입니다. 데이터에는 식당명과 함께, 어워드 수상 이력 또는 외부기관 평가와 관련된 어워드정보 설명, 관광객 선호도를 나타내는 RTI(관광지수), 그리고 온라인 서비스 제공 여부가 포함되어 있습니다. 수용태세 지수와 인기도 항목은 식당의 관광객 대응 역량과 이용자 선호도를 수치로 표현하며, 트립어드바이저, 씨트립, 네이버 등 국내외 주요 플랫폼에서의 평점을 통해 다각적인 평가 정보를 제공합니다. 또한, 식당의 영업 상태를 나타내는 식당상태 항목도 포함되어 있어 실시간 활용이 가능합니다. 본 자료는 외식업 품질 개선, 관광객 유치 전략 수립, 공공 외식 데이터 분석 등에 폭넓게 활용될 수 있습니다.
