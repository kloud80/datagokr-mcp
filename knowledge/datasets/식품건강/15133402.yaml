summary_user: 서울시농수산식품공사가 운영하는 도매시장에서 거래된 농수산물 가격을 거래일·품목·등급별로 담은 집계 시세 자료로, 평균가·최저가·최고가·전일평균과 전일·전 7일 대비 등락을 함께 담는다. 유통업자나 물가 분석가가 "오늘 배추 상품 등급 도매가가 지난주보다 얼마나 올랐나" 같은 단기 시세 변동을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 가격·유통 데이터와는 품목명(PUM_NM)·등급명·거래일 같은 이름과 날짜를 맞춰 이어 써야 한다.
limits: 표준 품목코드 등 공통 조인 키가 없어 다른 기관 데이터와 연결하려면 품목명 매핑이 필요하다. 호출은 포털 활용신청과 별개로 서울 열린데이터광장(data.seoul.go.kr) 인증키를 받아야 한다. 식품 제품 DB로 분류돼 있지만 품목제조보고번호·바코드 같은 제품 단위 키는 없다.
