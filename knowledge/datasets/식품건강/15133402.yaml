description_portal: 서울시 농수산식품공사 품목별등급별가격(도매시장) 데이터는 도매시장에서 거래되는 농수산물의 일자별·품목별·등급별 가격 정보를 제공하는 자료입니다. 거래일을 기준으로 품목 및 품명, 등급별 평균가, 전일평균, 최저가, 최고가를 포함해 해당 품목의 시세 수준을 파악할 수 있습니다. 또한 전일 대비 등락 및 변동률, 전 7일 평균과 전 7일 대비 변동률 정보를 통해 단기 가격 흐름과 변동성을 함께 분석할 수 있습니다. 거래단위와 시장구분 항목을 통해 가격 기준과 도매시장 종류를 구분할 수 있어, 농수산물 도매가격 모니터링, 물가 동향 파악, 유통 및 가격 정책 수립 등에 활용 가능한 기초 통계자료로 쓰입니다.
