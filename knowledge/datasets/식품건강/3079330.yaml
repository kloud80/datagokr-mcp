description_portal: '전라남도 여수시  관내 축산물 판매업소 중HACCP(위해요소중점관리기준) 인증을 받은 축산물 취급업체들의 정보를 담고 있습니다.(업체명, 업종, 품목, 주소, 시도, 시군구, HACCP 인증번호, HACCP 최초인증일, HACCP인증기간)데이터의 주요내용 업체명: HACCP인증을 받은 업체의 상호명  업종분류 체계 : 식육포장처리업, 식육판매업, 식육즉석판매가공업, 식용란수집판매업 , 우유류판매업, 식육부산물판매업 등 해당업체의 주요 영업분야 주소 : 업체의 위치정보 인증일자: HACCP을 인증을 받은 날짜 인증기관 : 인증을 담당한 기관명 인증 유효기간: 인증의 유효기간 및 갱신 여부* HACCP( 위해요소 분석)이란 축산물의 생산부터 소비에 이르는 전 과정에서 위해 요소를 분석하고 중점적으로 관리하여 안전성을 확보하는    시스템입니다. 우리나라에서는 도축업, 집유업, 축산물가공업, 식육포장처리업, 축산물 보관업, 축산물 운반업, 축산물 판매업 등 다양한 분야에    적용되고 있습니다.※ 참고사항 - HACCP인증은 소비자에게 안전한 축산물을 제공 및 소비자 신뢰 제고를 위한 공공정보를 제공하는것임.추가로 여수시 내 특정 지역이나 업종에 대한 HACCP 인증업소 정보를 원하신다면, 담당부서에 문의하여 상세한 정보를 얻으실 수 있으며,식약처 식품안전나라에서는 축산물 HACCP관련 전국 지정 인증 현황도 추가로 제공합니다.'
