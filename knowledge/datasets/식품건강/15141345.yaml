description_portal: '본 자료는 서울특별시 금천구에서 운영 중인 집단급식소의 인허가 현황을 체계적으로 정리한 것입니다. 각 급식소의 인허가일자, 현재 영업 상태, 폐업한 경우 폐업일자, 전화번호, 주소, 상호명 등의 정보를 포함하여 주민 여러분께 신뢰할 수 있는 정보를 제공하고자 마련하였습니다.집단급식소는 학교, 회사, 관공서, 복지시설 등 여러 사람이 함께 식사를 하는 장소로, 위생 관리와 안전한 급식 제공이 매우 중요한 시설입니다. 본 자료를 통해 관내 집단급식소의 위치와 운영 현황을 쉽게 확인할 수 있으며, 전화번호를 이용해 서비스 관련 문의나 상담을 사전에 진행하실 수 있습니다.폐업 여부 정보를 함께 제공함으로써 정확한 이용 정보 확인이 가능하며, 신규 급식소 개설이나 위생 점검 등 행정 업무에도 유용한 기초 자료로 활용됩니다. 또한, 집단급식소를 이용하는 기관이나 단체에서는 보다 안전하고 신뢰할 수 있는 급식 환경을 조성하는 데 도움을 받을 수 있습니다.우리 구는 앞으로도 주민 여러분의 건강과 안전한 식생활을 지원하기 위해 관련 정보를 투명하게 공개하고, 신속하고 정확한 정보 제공에 최선을 다하겠습니다.(담당부서 : 금천구 보건소 위생과)'
