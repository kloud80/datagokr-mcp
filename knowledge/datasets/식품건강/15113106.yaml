summary_user: 대전광역시 서구 관내에서 유통 중인 식품을 수거해 검사한 결과 부적합으로 판정된 제품을 수거 건별로 담은 파일(CSV 약 165KB)로, 제품명·업체명·수거장소와 주소·수거일자·검사기관·시험검사항목·판정결과 등을 포함한다. 소비자나 식품안전 담당자가 "서구에서 어떤 제품이 언제 어느 판매처에서 수거돼 어떤 항목으로 부적합 판정을 받았나"를 확인하거나 부적합 식품군·판매처 유형을 분석하는 데 쓴다. 전역 조인 키는 없어 업체명·제품명이나 수거장소 도로명·지번 주소를 기준으로 식품 인허가 업소, 회수·판매중지·행정처분 등 다른 식품안전 데이터와 이름·주소 매칭으로 이어 쓴다.
