summary_user: 수입식품안전관리 특별법에 따른 수입식품등 수입판매업 등 영업의 신고대장으로, 전국 범위의 영업신고 업소를 한 건씩 담으며 업소명·대표자명·업종명·소재지·전화번호·인허가번호·허가일자·관할기관명이 들어 있다. 사업자가 거래하려는 수입업체가 정식으로 영업신고를 했는지와 업종을 확인하거나, 분석가가 지역별·업종별 수입식품 영업 업소 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가·행정처분·회수 데이터와는 업소명·인허가번호(LCNS_NO) 같은 이름·번호 매핑이나 같은 기관(식품의약품안전처) 코드로만 이어 쓴다.
description_portal: 이 자료는 수입식품안전관리 특별법에 따른 수입식품등 수입판매업 등 영업에 대한 신고대장 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 수입식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
