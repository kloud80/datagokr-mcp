summary_user: 건강기능식품전문제조업·벤처제조업 업소의 인허가 변경 사항을 건별로 담으며, 업소명·업종·인허가번호·주소와 함께 변경일자, 변경 전후 내용, 변경사유를 전국 범위로 제공한다. 사업자나 분석가가 '특정 건강기능식품 제조업소가 언제 소재지·대표자 등 무엇을 왜 바꿨는가'를 확인하거나 제조업소 변동 이력을 추적하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관의 다른 식품 인허가 업소 자료와는 인허가번호(PRMT_NO)나 업소명·주소 매칭으로 연결한다.
description_portal: 건강기능식품에 관한 법률에 따라 식품의약품안전처가 관리하는 건강기능식품전문제조업, 벤처제조업의 인허가 변경 사항을 제공합니다. 이 자료의 속성정보는 업소명, 업종명, 인허가번호, 전화번호, 주소, 변경일자, 변경전내용, 변경후내용, 변경사유가 있습니다.이 자료를 통하여 신규 비즈니스 창출과 데이터 산업 활성화및 국민의 알 권리 보장, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 건강기능식품 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립 등으로 국민 편의성을 향상 시킬 수 있습니다.
