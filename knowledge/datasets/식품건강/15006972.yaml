summary_user: 부산광역시 금정구 관내 공중위생업소(미용업·이용업·세탁업·숙박업·목욕장업·건물위생관리업)를 업소 한 곳당 한 행으로 담은 건별 목록으로, 업종명·업소명·도로명/지번 주소·우편번호·전화번호가 들어 있다. 금정구 주민이나 사업자가 '우리 동네 근처에 영업 중인 목욕탕이나 세탁소가 어디 있고 연락처는 무엇인가'를 찾거나, 분석가가 금정구 업종별 업소 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(도로명·지번)나 업소명으로 맞추거나, 같은 금정구가 낸 다른 위생 업소 데이터와 이름 기준으로 이어 쓴다.
limits: 금정구 한 곳의 범위만 담으므로 부산 전체나 다른 구와 비교하려면 각 구 데이터를 따로 모아야 한다. 업소 고유번호 같은 공통 키가 없어 인허가·행정처분 등 다른 데이터와 붙일 때 주소·업소명 매칭에 의존해야 한다.
