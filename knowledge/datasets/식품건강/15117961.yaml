summary_user: 경상남도 거제시가 지정한 안심식당을 식당 한 곳당 한 행으로 담은 파일로, 안심식당명·도로명주소·데이터기준일자가 들어 있고 범위는 거제시 한 곳입니다. 거제 주민이나 방문객이 '거제에서 위생관리 기준을 충족해 지정된 식당이 어디에 있나'를 찾거나, 행정·분석가가 시내 안심식당 분포를 볼 때 씁니다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장이나 다른 위생 지정 자료와는 식당명·도로명주소를 맞춰 보는 방식으로만 이어 씁니다.
description_portal: 경상남도 거제시 내에 지정된 안심식당의 정보를 담고 있는 공공데이터입니다. 안심식당 제도는 감염병 확산 예방을 위해 위생관리 기준을 충족한 식당을 지자체가 지정하여, 시민이 보다 안심하고 외식을 즐길 수 있도록 지원하는 제도입니다. 본 자료에는 안심식당명, 도로명주소, 데이터 기준일자 등의 정보가 포함되어 있으며, 위생적인 외식 환경 조성과 시민 안내에 유용한 기초 자료로 활용됩니다. 시민들은 보다 안전한 식당 정보를 확인할 수 있고, 행정기관은 방역 친화적 외식문화 확산 정책 수립에 참고할 수 있습니다.
