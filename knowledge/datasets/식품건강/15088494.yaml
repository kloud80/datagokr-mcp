summary_user: 인천 미추홀구가 20년 이상 2대 이상 맛을 이어온 음식점으로 지정한 전통대물림음식점을 업소 한 곳당 한 행으로 담은 목록이며, 업체명·도로명주소·전화번호·위도·경도를 포함한다(약 1.3KB의 작은 CSV 파일). 주민이나 관광객이 '미추홀구에서 오래된 칼국수·냉면·추어탕 노포가 어디 있고 연락처는 무엇인가'를 찾거나, 분석가가 구 단위 우수 전통음식점 분포를 지도에 올릴 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 업체명·주소를 맞추거나 좌표로 공간 결합해 잇는다.
description_portal: 본 데이터는 인천광역시 미추홀구의 전통대물림음식점 현황 정보를 담고 있습니다. 연번, 업체명, 도로명주소, 전화번호, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 20년 이상 2대 이상에 걸쳐 전통(또는 퓨전)의 맛을 계승한 우수 음식점의 위치와 연락처를 파악할 수 있으며, 한식, 칼국수, 냉면, 선지국, 추어탕, 일식 등 다양한 업종의 전통음식점 정보를 확인할 수 있습니다. 미추홀구청 위생과에서 전통의 맛을 계승한 우수 음식점을 발굴하여 영업자에게 자긍심을 고취하고 100년 전통의 음식점 육성을 목표로 하는 사업입니다. 각 음식점의 위경도 좌표를 통해 정확한 위치를 파악할 수 있습니다. 이 데이터는 지역 내 전통음식 문화 보존 현황 파악, 우수음식점 육성 정책 분석, 외식산업 발전 연구 등에 활용될 수 있습니다.
