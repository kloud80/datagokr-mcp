summary_user: 세종특별자치시가 지정한 담배소매인 업소를 한 곳씩 담은 건별 목록으로, 민원구분·업소명·지번/도로명 주소·지정일자·관할 기관명과 연락처를 담는다(포털 설명 기준 843개소, CSV 파일 약 12만 바이트). 세종시에서 담배를 파는 소매점이 어느 동·읍·면에 있는지, 특정 편의점이 언제 소매인으로 지정됐는지 확인하려는 주민·창업 예정자·상권 분석가가 쓴다. 전역 조인 키나 인허가번호가 없어 다른 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 세종특별자치시 담배소매인 지정현황을 제공합니다.데이터는 민원구분, 업소명, 업소지번주소, 업소도로명주소, 지정일자, 기관명, 기관연락처로 구성되어 있습니다.데이터 등록기준일 기준 세종특별자치시 담배소미인 지정현황은 총 843개소로 세종서부농협 농축산물직판장, 지에스25(GS25) 한국영상대점, 조치원농업협동조합신흥지점, 지에스(GS)25 조치원죽림점, 조치원농업협동조합신흥지점, 세븐일레븐조치원홍대베스트점, 세븐일레븐 세종고대기숙사자유관점 등이 조치원읍, 부강면, 도담동, 금남면, 전동면 등에 소재하고 있습니다.
