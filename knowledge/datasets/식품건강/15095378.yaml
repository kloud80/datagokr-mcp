summary_user: 국내에 수입된 식품 중 회수·판매중지된 제품을 건별로 담은 원천 데이터로, 제품명·업체명·제조일자·유통기한·회수사유·회수방법·회수등급·식품분류를 싣고 전체 1,102건, 전국 범위다. 소비자나 유통업자가 '내가 가진 수입식품이 회수 대상인가, 왜 회수됐나'를 확인하거나, 분석가가 회수 사유와 식품분류별 추이를 볼 때 쓴다. 조인 키는 영업자 주소(PRCS_POTM_DTL_ADDR)와 바코드번호 필드(BRCD_NO, 실측 키는 corp_rgst_no로 분류)이며, 이를 같은 부문의 업소 인허가·행정처분 등 식품안전 데이터와 업소 단위로 이어 쓴다.
limits: 날짜 컬럼에 미래 값(9999-12-31)이 들어 있어 최신 날짜로 데이터의 신선도를 판단할 수 없으며, 최신성은 적재일 컬럼으로 봐야 한다. 검증 때 수신한 행은 1,000행이어서 전체 1,102건과 차이가 있고, 개별 주소·좌표 단위라 지역 집계는 직접 해야 한다.
