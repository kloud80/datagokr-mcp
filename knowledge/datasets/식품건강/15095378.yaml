description_portal: 식품의약품안전처 「수입식품 회수판매중지 제품 정보」 OpenAPI는 국내에 수입된 식품 중 회수 또는 판매 중지 조치된 제품의 상세 정보를 제공합니다. 제공 항목에는 제품명, 업체명, 제조일자, 유통기한, 회수사유, 회수방법, 영업등록번호, 영업자주소, 바코드번호, 포장단위, 등록일자, 회수등급, 식품분류 등이 포함되어 있습니다. 이를 통해 사용자는 특정 수입식품이 어느 업체에서 언제 제조되었는지와 유통기한 같은 기본 정보를 확인할 수 있으며, 아울러 회수 사유와 회수 방법, 해당 제품이 속한 식품 분류까지 함께 파악할 수 있습니다.
