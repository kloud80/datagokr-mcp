summary_user: 전국 집단급식소를 급식소 한 곳 단위로 담은 속성 목록으로, 급식소명·대표자·주소, 시군구, 업종분류, 직영·위탁 같은 급식방법, 위탁업체명·주소, 집중관리 여부를 담는다. 지자체 위생 담당자나 급식 위탁업체가 '우리 시군구에서 어떤 위탁업체가 어느 학교·기관 급식소를 맡고 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 급식소명·위탁업소명·주소나 시군구명으로 맞춰 이어야 한다.
description_portal: 집단급식소 설치 현황 관련 정보로 집단급식소에 대한 속성정보를 제공합니다. 속성정보로는 집중관리업소번호 , 시군구명 , 업종분류명 , 집중관리여부 , 급식방법명 , 급식소명 , 급식소대표자명 , 급식소주소 , 위탁업소명 , 단체급식여부 , 위탁대표자명 , 위탁업소주소가 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
