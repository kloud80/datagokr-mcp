summary_user: 서울특별시 마포구에서 건강기능식품 일반판매업으로 인허가를 받은 업소를 한 곳씩 담은 건별 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표(X, Y)가 들어 있으며 유통전문판매업 업소는 빠져 있다. 창업 예정자나 상권 분석가가 마포구 안 특정 동네에 건강기능식품 판매점이 몇 곳 영업 중이고 최근 몇 곳이 폐업했는지 알아볼 때 쓴다. 실측 컬럼에는 다른 데이터와 바로 이을 전역 조인 키가 없어서, 개방자치단체코드나 사업장명·주소를 맞춰 보는 방식으로만 다른 구의 같은 업종 데이터나 다른 식품 인허가 데이터와 연결한다.
description_portal: '서울특별시 마포구의 건강기능식품을 판매하는 업소정보(건강기능식품유통전문판매업에 해당되는 업소 제외)이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표 등의 정보가 포함되어 있습니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
