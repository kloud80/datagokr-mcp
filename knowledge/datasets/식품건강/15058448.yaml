summary_user: 경기도 31개 시군의 우유대리점·우유보급소 등 우유류 판매업소를 업소 1곳당 1행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업·휴업일자, 도로명·지번 주소와 WGS84 좌표, 종업원 수·면적을 포함한다. 유제품 유통업체나 분석가가 "우리 시군에 영업 중인 우유보급소는 어디에 몇 곳 있나" 같은 지역별 분포·영업현황 질문에 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 경기도 식품 인허가 업소 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 31개 시군 내에서 유가공품을 전문적으로 판매하는 우유대리점 및 우유보급소 등의 우유류 판매업소 현황을 제공하며, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 주소(도로명 및 지번), 우편번호, WGS84 기준의 위경도 좌표, 총 종업원 수, 소재지 면적, 축산물가공업 구분 및 축산업무 구분 등의 항목으로 구성되어 있습니다. 이 데이터는 유제품 유통망 분석, 지역별 판매업소 분포 파악, 식품 안전관리, 축산물 관련 산업 육성 및 영업현황 분석에 활용될 수 있으며, 주간 단위로 갱신되며 Open API 방식으로 제공되어 다양한 행정 및 연구 목적으로 활용 가능합니다.
