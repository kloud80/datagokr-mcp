summary_user: 경상북도 청송군이 지정해 관리하는 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·영업주 성명·도로명주소·전화번호·데이터기준일자를 담는다(포털 설명 기준 총 27개소). 청송을 찾는 관광객이나 주민이 '청송에서 군이 모범음식점으로 지정한 식당은 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 식품 인허가 원장 등 다른 데이터와는 업소명·도로명주소를 맞춰 보거나 같은 기관(청송군) 기준으로만 이어 쓴다.
limits: 인허가번호 같은 공통 키가 없어 인허가 원장이나 행정처분 이력과 정확히 매칭하기 어렵고, 업소명·주소 문자열 대조에 의존해야 한다. 범위는 청송군 한 곳뿐이라 다른 시군 모범음식점과 비교하려면 별도 파일을 모아야 한다.
