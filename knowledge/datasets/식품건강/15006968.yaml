summary_user: 충청북도 보은군의 목욕장·이용·미용·세탁 등 공중위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호를 2024년 4월 26일 기준으로 제공한다. 보은군 주민이나 사업자가 '군내에 영업 중인 미용실이나 세탁소가 어디에 있고 연락처는 무엇인가'를 찾거나, 분석가가 업종별 업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭으로만 잇고, 식품 인허가 업소나 위생 지정 데이터와 주소 기준으로 함께 볼 수 있다.
