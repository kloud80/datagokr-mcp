description_portal: 이 데이터는 서울특별시 광진구 관내에서 집단급식소를 대상으로 식품을 판매하는 업소에 대한 인허가 현황 정보를 제공합니다. 대상 업소는 주로 학교, 병원, 복지시설 등 대규모 급식소에 식재료나 조리식품을 공급하는 사업체이며, 관련 법령에 따라 인허가를 받은 업체들을 포함합니다. 업소별 명칭, 소재지, 업종유형, 인허가 상태 등의 주요 정보가 제공되며, 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공됩니다. 위도·경도(WGS84) 좌표는 포함되지 않으므로 지도 시스템 연계 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준 자료로 제공되어 주기적으로 갱신되며, 급식 위생 관리, 식품 공급체계 분석, 영업장 분포 파악 등 다양한 행정 및 민간 분야에서 활용 가능합니다. 광진구 지역 내 식품 유통 안전성 확보 및 급식 관련 정책 수립을 위한 기초 자료로 유용합니다.
