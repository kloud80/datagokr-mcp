summary_user: 충청북도가 1998~2016년에 맛·청결·친절 등을 기준으로 지정한 우수 모범업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·시군명·세부주소·대표 메뉴가 들어 있습니다(포털 설명 기준 82개소). 충북 여행객이나 지역 홍보 담당자가 "이 시군에 도가 인증한 음식점이 어디 있고 무엇을 파는가"를 찾을 때 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 식품 인허가 업소 원장이나 위생등급 자료와는 업소명·주소를 직접 맞춰 이어 붙여야 한다.
description_portal: '충청북도의 11개 시군에 도가 지정한 우수 모범업소의 업소명, 소재지, 주소, 전화번호, 취급음식 정보 제공합니다. (길성이백숙초정점, 명동보리밥, 부모산가든 등)- 우수모범업소 82개소 : 맛, 청결, 친절 등 서비스 실천업소 (’98~’16년)<참고>지정기준‣ 맛·청결·친절 서비스 개선 및 개인위생 적정 여부‣ 영업장 환경 및 화장실 청결상태‣ 좋은식단실천 및 음식가격 적정성‣ 음식물쓰레기 감량 시책 호응도 등※ 사업목적 : 도 인증음식점 발굴 및 홍보·지원을 통해 음식관광 활성화 및 위생수준 향상※ 도 우수모범업소, 밥맛 좋은 집 : 신규지정 없음 → 음식점 위생등급제 활성화 등으로 추진'
