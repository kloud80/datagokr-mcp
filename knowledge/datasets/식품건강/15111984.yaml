summary_user: 식품의약품안전처가 관리하는 축산물 도축업·보관업·운반업·집유업·식용란선별포장업 업소의 폐업 정보를 업소 한 곳당 한 건으로 담으며, 인허가번호·업소명·업종·허가일자·폐업일자·폐업상태·주소·관할 기관명을 전국 범위로 제공한다. 사업자나 분석가가 "우리 지역에서 최근 문을 닫은 도축장·식용란 선별포장업체는 어디이고 언제 폐업했나"처럼 축산물 업소의 폐업 현황과 시점을 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 다른 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 매칭으로만 연결한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 붙일 때는 이름·주소 매칭이나 같은 기관 코드에 의존해야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
