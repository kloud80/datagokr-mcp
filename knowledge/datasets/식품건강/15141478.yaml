summary_user: 서울특별시 종로구 관내 식품자동판매기업 업소를 한 곳씩 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·소재지 주소·좌표(X, Y)·업소명 등이 업소별로 들어 있다. 종로구에서 현재 영업 중인 자판기 운영업소가 어디에 몇 곳 있는지, 언제 허가받고 언제 폐업했는지 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 다른 식품 인허가 업종 데이터와 묶어 상권 분석의 기초로 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 식품자동판매기 운영업체의 인허가 현황을 제공하는 자료입니다. 식품자동판매업은 자판기 등 무인 판매 기기를 통해 식품을 공급하는 업종으로, 「식품위생법」 및 관련 규정에 따라 영업 허가를 받아야 합법적으로 운영할 수 있습니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등이 포함되어 있어 업체별 등록 절차와 현재 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 행정기관은 무인 판매기 운영 현황을 점검하고, 위생 및 안전 관리 기준 준수 여부를 감독할 수 있으며, 부적합 제품 유통을 예방할 수 있습니다. 또한 연구자와 정책 담당자는 지역별 무인식품 판매 분포와 운영 현황을 분석하여 외식 및 유통 정책 수립의 기초자료로 활용할 수 있으며, 주민과 소비자는 안전하고 신뢰할 수 있는 식품 자동판매기 정보를 확인하여 편리하고 안전한 식품 이용 환경을 조성할 수 있습니다.
