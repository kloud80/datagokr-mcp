description_portal: 추출일 기준 전달의 정보를 제공합니다.본 데이터는 재범 방지를 목적으로 운영되는 교육 프로그램의 대상자 현황을 센터별로 집계한 자료입니다.※ 각 센터 내 1인 미만인 경우 개인정보보호를 위해 데이터를 추출하지 않습니다.기관(센터명), 교육 이수 상태(접수, 교육중, 이수완료 등), 프로그램 구분(기소유예,  재범예방 등), 교육프로그램명, 교육 인원 수 등의 정보를 포함하고 있습니다.자료는 각 센터에서 보고·집계한 내용을 기반으로 하며, 교육 진행 상황 변화에 따라 주기적으로 갱신됩니다.이 데이터는 재범방지 교육의 운영 현황을 한눈에 파악할 수 있도록 구성되어, 정책 수립·성과평가, 교육 운영 개선, 재범 예방 연구, 기관 간 비교·분석 등 다양한 분야에서 활용이 가능합니다.[참고사항]시스템 입력 시기 및 데이터 정제 과정에 따라 발표하는 공식 통계 실적과 일부 차이가 발생할 수 있음을 알려드립니다. 정확한 공식 수치는 마약청정 대한민국 홈페이지의 "의료용 마약류 월간 동향" 자료를 참고하시기 바랍니다.
