summary_user: 인천광역시 보건환경연구원이 실시한 농산물 잔류농약 검사 현황을 검사 구분(분류)별로 1월부터 12월까지 월 단위로 집계한 표로, 건별 원천 기록이 아닌 소규모 집계 파일(458바이트 CSV)이다. 시민이나 분석가가 인천에서 경매 전 검사, 유통 중 검사, 의뢰 검사가 달마다 얼마나 이뤄졌는지 보거나 검사가 몰리는 시기를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 검사 분류 이름을 맞춰서만 이을 수 있고, 같은 부문의 부적합·회수 데이터와 나란히 참고하는 정도로 쓴다.
