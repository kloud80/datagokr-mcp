summary_user: 경기도 31개 시군의 휴게음식점(커피숍·찻집·패스트푸드점·분식점 등 음주가 금지된 음식점)을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 시군명, 영업상태, 업태, 소재지 주소, 위도·경도 좌표를 담는다. 상권 분석가나 창업 예정자가 "우리 시군 어느 동네에 영업 중인 카페·분식점이 몰려 있는가"를 보거나, 소상공인·위생 정책 담당자가 지역별 업소 분포를 파악하는 데 쓴다. 전역 조인 키는 실측에서 찾지 못했으므로, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명, 주소, 좌표를 기준으로 연결한다.
description_portal: 이 데이터는 경기도 내 휴게음식점의 인허가 및 운영 현황을 제공하는 자료로, 커피숍, 찻집, 패스트푸드점, 분식점 등 음주가 금지된 음식점의 정보를 포함합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 폐업일자, 휴업 및 재개업일자, 소재지 도로명 및 지번주소, 위도·경도 좌표, 영업상태, 업태구분명, 위생업태명, 총종업원수, 남녀 종사자 수, 업소 주변구분, 등급구분, 급수시설정보, 보증금 및 월세, 다중이용업소 여부, 주된 음식, 홈페이지 주소 등입니다. 이 데이터는 지역별 외식업 분포 분석, 소상공인 정책 수립, 상권 분석, 위생 및 안전관리 정책 수립에 활용 가능하며, 행정안전부에서 제공하고 경기도 31개 시군의 인허가 자료를 기반으로 구축되었습니다.
