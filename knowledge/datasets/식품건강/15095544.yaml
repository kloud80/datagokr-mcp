summary_user: 축산물 품목제조보고 제품별로 들어간 원재료를 원재료 순번 단위로 담은 전국 범위의 건별 원천 데이터로, 업소명·품목제조번호·허가일자·품목명·유형·원재료명·인허가번호·변경일자를 함께 준다. 소비자나 분석가가 특정 햄·소시지 같은 축산물 가공품에 어떤 원재료가 쓰였는지, 어느 업소가 언제 보고했는지 확인할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아 품목제조보고번호(PRDLST_REPORT_NO)나 인허가번호를 이름·코드 매핑하는 방식으로 같은 기관의 바코드·영양성분 등 제품 DB나 식품 인허가 업소 데이터와 잇는다.
description_portal: 식품안전나라에서 기개방중인 축산물품목제조보고(원재료) 정보로 업소명 , 품목제조번호 , 허가일자 , 품목명 , 유형 , 원재료 , 인허가번호  등의 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
