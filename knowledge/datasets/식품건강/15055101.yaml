summary_user: 경기도 시흥시 안 목욕장업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·소재지 전화번호와 데이터기준일자를 담는다(파일 크기 약 4KB의 소규모 목록). 시흥시 주민이 집 근처 목욕탕·사우나 위치와 연락처를 찾거나, 분석가가 시 안 목욕장 분포를 지도로 확인할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 주소 지오코딩으로만 잇는다.
limits: 업소별 인허가번호 같은 공통 키가 없어 다른 공중위생·인허가 데이터와 정확히 1:1로 연결하기 어렵고, 범위가 시흥시 한 곳으로 한정된다. 좌표 필드는 없어 위치 분석에는 주소 변환이 필요하다.
