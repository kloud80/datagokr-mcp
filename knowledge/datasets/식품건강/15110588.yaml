summary_user: 대구광역시 동구가 지정한 나트륨줄이기 실천음식점을 업소 한 곳당 한 행으로 담은 건별 목록으로, 등록번호·업소명·도로명주소·전화번호·영업시간·휴무일·좌석 수와 주차·예약·카드·장애인시설·아침식사·단체이용 여부 같은 이용 정보를 담는다. 동구 주민이나 방문객이 '근처에 싱겁게 먹을 수 있고 주차·단체 이용이 되는 식당이 어디인가'를 찾을 때 쓰고, 행정기관이 실천음식점 분포를 점검할 때도 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 식품 인허가 업소 원장 등 다른 데이터와는 업소명·도로명주소(RDNMADR)를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 나트륨줄이기실천음식점 현황 조회서비스 API는 건강한 식습관 확산과 국민 건강 증진을 위해 나트륨 섭취를 줄이는 실천 음식점의 정보를 제공하는 데이터 서비스입니다. 이 API는 등록번호를 기준으로 업소 명, 도로명 주소, 전화번호, 영업 시간, 휴무일, 좌석 수, 주차장, 예약 여부, 외국어 표기, 신용카드 사용, 놀이 시설, 장애인 시설, 식사 사이 음식 제공 여부, 아침 식사 가능 여부, 단체 이용 여부, 종일 영업 여부 등 세부 정보를 조회할 수 있습니다. 이를 통해 이용자는 나트륨 섭취를 줄이면서 편리하게 이용할 수 있는 음식점을 선택할 수 있고, 행정기관은 식품위생과 건강 정책 관리, 모니터링, 평가에 활용할 수 있습니다. 또한 연구자와 개발자는 해당 데이터를 활용해 건강 식단 지도, 음식점 추천 앱, 영양 관리 서비스 등 다양한 응용 프로그램을 개발할 수 있어 시민 건강 증진과 공공 건강 정책 지원에 기여합니다.
