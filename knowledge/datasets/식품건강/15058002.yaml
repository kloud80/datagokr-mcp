summary_user: 경기도 31개 시군의 유원지 안에 있는 휴게음식점을 업소 한 곳당 한 행으로 담은 인허가 원장이다. 사업장명, 인허가·폐업일자, 영업상태, 면적, 종사자 수, 다중이용업소 여부, 주소, 위경도가 들어 있다. 관광지 상권을 보는 분석가나 사업자가 "어느 유원지에 영업 중인 휴게음식점이 몇 곳이고 최근 몇 곳이 폐업했나"를 따질 때 쓴다. 실측에서 전역 조인 키는 찾지 못했으므로, 시군 코드(SIGUN_CD)나 시군명, 주소, 좌표를 기준으로 다른 식품 인허가·위생 데이터와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 유원지에 위치한 휴게음식점에 대한 인허가 현황을 수록하고 있으며, 도내 31개 시군의 인허가 데이터를 기반으로 구성되어 있습니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 정보(주소, 면적), 급수시설 구분, 업소 규모, 종사자 수(남녀), 위생업종 및 업태, 다중이용업소 여부, 위치정보(WGS84 위경도) 등을 포함합니다. 이 데이터는 관광지 내 식음료 서비스 제공 실태 분석, 위생관리 강화, 관광객 편의시설 확충, 지역경제 활성화 정책 수립 등에 활용될 수 있으며, XML 또는 JSON 형식의 Open API로 제공됩니다.
