summary_user: 서울특별시 광진구 관내에서 유흥주점영업 인허가를 받은 업소를 업소 단위로 담은 인허가 원장으로, 업소명·소재지 주소·인허가일자·영업상태·폐업일자·업태·중부원점TM 좌표(X, Y) 등을 수록한다. 구청 담당자나 분석가가 '광진구에서 현재 영업 중인 유흥주점은 어디에 몇 곳이 있고 언제 인허가됐는가'를 확인하거나 청소년 유해환경 점검 대상을 추릴 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 자치구·업종의 인허가 데이터와는 관리번호(MGTNO)·업소명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 유흥주점영업 인허가를 받은 업소 현황을 제공합니다. 유흥주점영업이란 「식품위생법」 및 관련 법령에 따라 주로 주류를 제공하며 음식 조리 및 판매를 병행하는 업소로, 유흥종사자를 두거나 노래·춤 등 유흥시설을 설치하여 운영하는 사업장을 의미합니다.대표적인 예로 룸살롱, 클럽, 스탠드바, 노래클럽 등이 포함되며, 본 데이터에는 업소명, 소재지, 인허가일자, 업종 유형, 영업상태, 관할 행정기관 정보 등이 수록되어 있습니다.해당 정보는 자치구 유흥업소 현황 관리, 청소년 유해환경 점검, 지역 내 유흥시설 분포 분석 및 인허가 관리 체계 수립 등에 활용될 수 있습니다.※ 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 정보는 포함되어 있지 않습니다.※ 본 데이터는 3일 전 기준 최신 인허가 현황을 반영하고 있습니다.
