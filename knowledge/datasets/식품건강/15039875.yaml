summary_user: 부산광역시 영도구 관내 우유류판매업체(우유대리점·우유보급소 등)를 업소 한 곳당 한 행으로 담은 파일로, 판매업 구분·상호·지번 및 도로명 소재지 주소를 담는다. 영도구에서 우유 배달·보급소를 찾는 주민이나 동네 유제품 유통 업소의 분포를 살피는 분석가가 '영도구에 우유대리점이 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)가 없어 다른 식품 인허가·행정처분 데이터와는 상호명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 영도구 관내에 위치한 우유류판매업체 구분, 상호,  소재지(지번주소, 도로명주소)를 설명하는 자료입니다.“유가공품”이란 판매를 목적으로 하는 우유류, 저지방우유류, 분유류, 조제유류(調製乳類), 발효유류, 버터류, 치즈류, 그 밖에 원유 등을 원료로 하여 가공한 것으로서 다음의 것들을 말합니다.  * 무지방우유류, 유당분해우유, 가공유류, 산양유, 버터유류, 농축유류, 유크림류, 유청류, 유당, 유단백 가수분해 식품 등“원유”란 판매 또는 판매를 위한 처리ㆍ가공을 목적으로 하는 착유(搾乳) 상태의 우유와 양유(羊乳)를 말한다."우유류판매업"이란 우유대리점ㆍ우유보급소 등의 형태로 직접 마실 수 있는 유가공품을 전문적으로 판매하는 영업을 말합니다.우유류판매업은 허가제가 아닌 신고제입니다.필수요건으로 영업장 시설 기준을 충족하고, 위생교육을 수료하여 관할 시군구에 신고합니다.필요한 서류는 영업 신고서, 축산물위생교육 이수증, 임대차계약서 등 입니다.
