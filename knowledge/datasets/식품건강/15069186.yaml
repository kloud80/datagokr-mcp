description_portal: '- 전라남도내 피부관리업소(업종,업태,  업소명, 지번주소, 도로명주소 등)에  관한 정보를 조회하실 수 있습니다.- "피부미용"은 피부의 건강과 외적인 아름다움을 유지하고 개선하기 위한 전문적인 관리와 시술을 포함하는 분야입니다. 피부미용은 청결, 보습, 각질 제거, 탄력 관리, 노화 예방 등을 목적으로 다양한 기술과 제품을 사용하는 활동입니다. - 전라남도에서는 다음과 같은 피부미용 관련 지원이 있을 수 있습니다 : 1. 창업지원 프로그램: 청년 창업자 대상 뷰티 분야 지원 2. 직업훈련 과정: 전남일자리통합정보망, 고용센터 등에서 운영 3. 소상공인 뷰티 업종 지원금: 창업초기 마케팅, 장비 지원 등'
