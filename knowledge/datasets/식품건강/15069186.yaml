summary_user: 전라남도 안 피부미용(피부관리) 업소를 업소 한 곳당 한 행으로 담은 건별 목록 파일로, 업소명·업종·업태와 지번·도로명 주소를 시도 범위에서 개별 주소 단위로 담는다. 피부관리실 창업을 검토하는 사업자가 특정 시군이나 동네에 이미 영업 중인 피부미용업소가 얼마나 몰려 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공중위생업소 현황이나 행정구역 자료와는 업소명·주소 문자열 매칭으로만 이어 쓴다.
