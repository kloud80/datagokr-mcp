summary_user: 서울특별시 광진구에서 위탁급식영업 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·소재지·인허가일자·영업상태·폐업일자·좌표(중부원점TM) 등을 포함한다. 광진구 내에서 학교·기업체·병원 급식을 맡는 위탁급식 업체가 어디에 몇 곳 영업 중인지, 언제 인허가·폐업했는지를 확인하는 행정·위생 관리 담당자나 급식업 시장 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 형식의 다른 자치구·업종 인허가 데이터와 이어 붙여 쓴다.
description_portal: 이 데이터는 서울특별시 광진구에서 위탁급식영업 인허가를 받은 업소의 현황 정보를 제공합니다. 위탁급식영업이란, 학교·기업체·병원·공공기관 등에서 운영 중인 집단급식소와 계약을 맺고, 해당 시설 내에서 음식류를 직접 조리하여 제공하는 급식 형태입니다. 본 데이터에는 업소명, 소재지, 인허가일자, 업종 분류 등 인허가 관련 주요 항목이 포함되어 있으며, 급식 위생 관리, 단체급식 운영 실태 파악, 식품 안전 정책 수립 등의 행정 업무에 유용하게 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않아 지도 시스템 사용 시 좌표 변환이 필요합니다. 이 데이터는 3일 전 기준의 최신 정보로 정기 갱신되며, 지역 내 위탁급식 서비스 현황을 파악하고, 급식 관련 영업 인허가 관리 및 모니터링에 활용됩니다.
