summary_user: 대구광역시 달서구 안의 제과점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·소재지(주소)·전화·담당부서·기준일자를 담는다(CSV 약 22KB). 주민이 동네 제과점 위치와 연락처를 찾거나, 분석가가 달서구 제과점 분포를 상권 분석의 기초로 살필 때 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·위생 데이터와는 업소명·주소를 맞춰 보는 방식으로만 잇는다.
description_portal: 대구광역시 달서구에서 운영하는 제과점에 대해 정리한 자료를 지역 주민이 편리하게 찾을 수 있도록 지원을 위해 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.업종명, 업소명, 소재지, 전화, 담당부서, 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 지역 내 제과점 운영을 파악하는데 유용하게 참고자료로 쓸수 있으며 식위생관리 점검, 위생교육 등 다양한 행정업무에 기초자료로 쓰는데 활용 가능합니다.
