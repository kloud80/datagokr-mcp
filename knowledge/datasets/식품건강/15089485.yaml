summary_user: 인천광역시 서구(서해구) 안에 등록된 식품자동판매기영업 업소를 한 곳씩 담은 등록현황 파일로, 업종명·업소명·소재지·전화번호·데이터기준일자를 제공한다. 주민이나 사업자가 '우리 동네에 합법적으로 등록된 식품자동판매기 운영업체가 어디 있나'를 확인하거나, 분석가가 지역 식품업소 현황을 파악할 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 실측 컬럼에서 찾지 못해, 다른 식품 인허가·행정처분 데이터와는 업소명·소재지 주소를 맞춰 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내에 위치한 식품자동판매기영업 등록현황을 제공하고 있습니다. 본 데이터는 인천광역시 서구 내 식품자동판매기영업의 업소명, 소재지, 전화번호 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 내 식품자동판매기영업을 손쉽게 파악할 수 있으며, 관련 자료를 통해 합법적으로 등록된 판매기 운영업체 정보를 확인하여, 위생적으로 관리된 자동판매기를 이용하는데 도움이 될것으로 판단됩니다. 본 데이터는 연마다 갱신을 통해 최신정보를 반영하고 있습니다.
