summary_user: 부산광역시 남구 관내 집단급식소(1회 50명 이상에게 식사를 제공하는 급식소)를 업소별로 한 행씩 담은 원천 목록으로, 업종명·업소명·도로명/지번 소재지·전화번호를 담는다. 구청 위생 담당자나 주민이 '우리 동네에 어떤 집단급식소가 어디에 있나'를 확인하거나 위생 점검 대상 목록을 만들 때 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키는 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이을 수 있다.
description_portal: 「부산광역시 남구_집단급식소현황」 데이터는 남구 관내에서 운영 중인 집단급식소의 설치·운영 현황을 체계적으로 파악하기 위해 구축된 식품위생 기반 자료입니다. 본 데이터에는 시설명, 소재지 정보 등이 포함되어 있습니다. 이를 통해 집단급식소의 위생 수준과 안전관리 적정성을 확인하고, 식중독 예방 정책, 위생 점검 계획 수립, 취약시설 관리, 급식 안전 강화 등 행정·정책적 활용이 가능합니다. 또한 지역 주민의 식품 안전 확보, 영양관리 강화, 감염병 예방 등 공중보건 향상에 기여하는 필수적 공공데이터입니다.[식품위생법 시행령] 제2조(집단급식소의범위) 「식품위생법」(이하 “법”이라 한다) 제2조제12호에 따른 집단급식소는 1회 50명 이상에게 식사를 제공하는 급식소를 말한다.
