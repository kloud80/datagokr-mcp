summary_user: 충청남도 예산군이 지정한 충남형 The 안심식당 업소를 한 행에 한 곳씩 담은 목록 파일(csv 약 14KB)로, 업소명·주소·업종 상세·비고를 담는다. 예산 주민이나 관광객이 "예산군에서 위생·방역 수칙을 지키는 안심식당은 어디인가"를 찾거나, 위생지도·맛집 앱에 지정 표시를 붙이는 데 쓴다. 인허가번호 같은 전역 조인 키가 없으므로 식품 인허가 업소 원장이나 다른 위생 지정 목록과는 업소명·주소를 맞춰서만 이어 쓴다.
description_portal: 농림안전축산식품부에서 주관하는 각 지역별 안심식당 지정제도에 대해 공고 및 현장 방문을 통해 지정된 충남형 The 안심식당에 대한 업소 목록입니다.이 데이터는 충청남도 예산군에서 지정한 안심식당의 정보를 제공하는 공공데이터입니다. 위생 수준이 우수하고 방역수칙을 성실히 이행하는 안심식당을 지정·관리한 정보로, 공중위생, 감염병 예방, 소비자 안전 정보 제공 등 다양한 행정 및 민간 활용이 가능한 공공데이터입니다.이 데이터는 시민과 관광객에게 위생적으로 안심하고 식사할 수 있는 식당 정보를 제공하고, 민간에서는 위생지도 제작, 맛집 추천 앱, 정책 홍보 등 다양한 활용이 가능합니다.데이터에는 업소명, 주소, 업종 상세 등이 포함됩니다
