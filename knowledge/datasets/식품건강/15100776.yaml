summary_user: 경기도 여주시에 설치·운영 신고된 집단급식소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명/지번 주소·전화번호·1일 급식인원·위탁급식업소명을 데이터기준일자 기준으로 싣는다. 여주시 안에서 어느 급식소가 어떤 위탁업체에 운영을 맡기고 있고 하루 몇 명에게 급식하는지 알고 싶은 주민·위탁급식 사업자·위생 담당 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)는 없어서, 다른 식품 인허가 업소 데이터와는 업소명·주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓸 수 있다.
limits: 인허가번호나 사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵고, 업소명·주소 문자열 매칭에 기대야 한다. 범위는 여주시 한 곳뿐이라 다른 시군이나 전국 현황은 이 파일로 볼 수 없다.
