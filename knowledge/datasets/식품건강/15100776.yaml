description_portal: 경기도 여주시의 집단급식소 위탁운영 현황 데이터입니다. 「식품위생법」에 따른 여주시 내 설치,운영 신고된 집단급식소의 공공데이터 입니다. 이번 자료에서는  관내 집단급식소의 위치와 운영 현황을 체계적으로 파악할 수 있도록 도와주며, 업종명, 업소명, 소재지, 소재지 전화번호 등 항목을 해당 데이터기준일자로 정보를 제공합니다. 이 자료를 통해 여주시에서 운영하고 있는 집단급식소 업소들의 이름과 해당 업소의 소재지 도로명주소 및 지번주소, 소재지 전화번호를 확인할 수 있습니다.  감사합니다.
