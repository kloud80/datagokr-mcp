description_portal: -식품의약품안전처에서 관리하는 수입식품의 허가 정보는 수입식품의 신고 현황을 연도별·국가별·품목별로 세분화하여 제공합니다. 주요 항목에는 신고년도, 국가코드, 국가명 등 기본 분류 정보와 함께 총 신고수량(건수), 적합·부적합 신고수량(건수), 신고중량(총계·적합·부적합 건수), 그리고 신고금액(총계·적합·부적합 건수)까지 포함됩니다.-이 자료를 통해 각 연도별로 국가·품목에 따라 수입식품의 신고내역, 적합률 및 부적합 현황, 그리고 수입량과 통관 금액의 경향을 분석할 수 있습니다. 이와 같은 통계 정보는 수입식품 안전관리 정책 수립, 식품의 안전성 모니터링 등 다양한 목적으로 공개·활용되고 있습니다.
