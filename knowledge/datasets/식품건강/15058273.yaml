summary_user: 수입식품 신고를 접수번호 단위의 건별 내역(제품명·수입업체·해외제조업체·제조국·수출국·처리기관·소비기한, 부적합 건은 부적합 상세 내역)과 연도별·국가별·품목별 집계(신고 건수·중량·금액의 총계·적합·부적합)로 함께 담는 전국 단위 API이며, 5개 오퍼레이션으로 나뉜다. 수입업체나 분석가가 '특정 국가산 특정 품목의 수입 신고 중 부적합이 몇 건이고 사유는 무엇인가', '연도별로 어느 나라 수입식품의 부적합 비율이 높아졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 국가명·국가코드, 품목명, 수입업체명·해외제조업체명 같은 이름·코드 매핑이나 같은 식약처 데이터의 코드로만 연결한다.
limits: 연도별 통계 오퍼레이션 하나(/getImrtsYearStatsList05)는 최소 파라미터로 호출했을 때 응답이 없어 추가 파라미터 확인이 필요하다. 행정구역 단위 구분이 없는 비공간 데이터라 지역별 분석에는 쓸 수 없다. 공통 키가 없어 업체·제품 단위 결합은 이름 매칭에 의존하며, 그만큼 매칭 오류 가능성이 있다.
