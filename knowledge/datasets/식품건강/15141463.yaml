summary_user: 서울 종로구 관내 식용얼음판매업 업소를 업소(관리번호)별 한 행으로 담은 인허가 원장으로, 인허가일자·폐업일자·영업상태, 소재지 지번·도로명 주소, 좌표(X·Y), 업소명, 종업원 수·시설 면적 등을 포함한다. 종로구에서 현재 영업 중인 식용얼음 판매업체가 어디에 몇 곳 있는지, 언제 인허가받고 폐업했는지를 확인하려는 시민·사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 식용얼음판매업 인허가 현황을 정리한 자료입니다. 식용얼음판매업은 식품위생법에 따라 안전하게 얼음을 생산·판매하는 업종으로, 사업자 등록과 인허가를 받아야 합법적으로 운영할 수 있습니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등이 포함되어 있어 업소별 인허가 절차와 현재 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 행정기관은 식용얼음 판매업체 관리, 법규 준수 여부 점검, 안전 기준 적용 여부 확인 등 효율적인 행정 업무 수행에 활용할 수 있으며, 연구자와 정책 담당자는 지역 내 업체 분포와 운영 현황을 분석하여 정책 수립과 안전 관리 개선에 참고할 수 있습니다. 또한 시민은 신뢰할 수 있는 업체 정보를 확인하여 안전한 식용얼음 이용과 공중보건 향상에 기여할 수 있습니다.
