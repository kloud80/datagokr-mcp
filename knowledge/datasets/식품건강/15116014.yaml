summary_user: 서울특별시 중구에서 자동판매기로 식품을 파는 업소를 업소별로 담은 인허가 원장으로, 관리번호(MGTNO)·인허가일자·영업상태(영업/폐업 등)·폐업일자·지번/도로명 주소·업소명·중부원점TM 좌표 등을 담는다. 자판기 창업을 준비하는 사업자가 '중구 어느 지역에 식품자동판매기 영업 신고가 몰려 있고, 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 식품 인허가 데이터나 다른 자치구 자료와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중구의 자동판매기를 이용하여 식품을 판매하는 업소 정보입니다. 데이터는 각 식품자동판매기업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐쇄 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 식품자동판매기업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 자판기 설치위치 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 공중이용시설에 설치된 자판기의 관리기준 준수 여부 및 취급식품 안전성을 투명하게 확인할 수 있도록 지원하여 소비자편의와 공공 보건 향상에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
accrual_periodicity: 수시
