summary_user: 대구광역시 달서구에 신고된 식품접객업소(일반음식점·휴게음식점·제과점)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화·행정동·위도·경도를 포함한다. 주민이나 창업자가 '달서구 어느 행정동에 음식점·카페·제과점이 몰려 있나'를 확인하거나 상권·위생관리 대상 분포를 살피는 데 쓴다. 전역 조인 키(인허가번호 등)가 없어 다른 데이터와는 업소명·주소 매칭이나 행정동명, 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 본 데이터는 대구광역시 달서구에서 식품 위생법에 따라 시설에 관한 기준을 정해야 하는 영업의 하나, 음식 또는 주류를 업소 안에서 판매하는 영업(일반음식점, 휴게음식점, 제과점) 신고된 식품접객업소 현황을 데이터로 제공합니다.아래 컬럼을  참고하시면 됩니다.위도, 경도, 번호, 업종명, 업소명, 소재지(도로명), 소재지(지번), 소재지전화,  행정동명, 관리부서, 기준일자 등으로 구성되어있으며 1년마다 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 현황을 통해 식중독 예방 및 위생관리, 식품접객업 서비스  개선하기 위해 참고자료로 활용 가능합니다.
