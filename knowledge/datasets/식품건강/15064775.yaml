summary_user: 식품 제품별로 바코드번호, 품목보고번호, 회사명, 제품명, 대·중·소 품목분류, 최종수정일시를 한 건씩 담은 건별 제품 목록이며, 범위는 전국이다. 소비자나 유통·앱 개발자가 "이 바코드가 찍힌 식품은 어느 회사의 무슨 제품이고 품목보고번호는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 품목보고번호(PRDLST_REPORT_NO)와 바코드로 영양성분·원재료·품목제조보고 같은 식품 제품 DB와 제품 단위로 맞춰 보거나, 회사명으로 인허가 업소·회수·행정처분 정보와 이름 매핑해 연결한다.
description_portal: 바코드번호 , 품목보고번호 , 회사명 , 제품명 , 최종수정일시 , 품목분류_소분류 , 품목분류_중분류 , 품목분류_대분류의 속성정보를 제공합니다. 유통바코드 정보는 대한상공회의소 유통물류진흥원에서 유료로 제공되는 정보로서 유통물류진흥원의 요청에 따라 2018년 이후로 최신화가 중단되었음을 안내해드리니 이용에 참고하시기 바랍니다.이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 창업, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
