description_portal: '서울특별시 중구의 식품을 제조 또는 가공할 때 기호가치를 향상시키거나 영양가치를 높일목적의 식품첨가물을 제조하는 업소 정보입니다. 데이터는 각 식품첨가물제조업체에 부여된 관리번호, 현재의 영업 상태(허가, 취소 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 식품첨가물제조업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 합성품 제조시설 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민 및 관련 식품 제조 업계 종사자에게는 법적 기준규격을 충족하며 철저한 품질검사와 안전성 관리를 통해 안전한 식품첨가물을 생산하는 신뢰할 수 있는 기술인력 보유 제조업체의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
