summary_user: 수입식품 해외제조업소별로 수입이 중단되거나 취소된 조치를 건별로 담으며, 업소코드·업소명과 함께 중단 구분, 중단 기준, 조치일시, 중단 시작·해제일시, 사유, 수입중단번호를 담는다. 수입업자나 소비자가 특정 해외 공장 제품이 언제부터 왜 수입 중단됐고 해제됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 수입식품 데이터와는 해외제조업소코드(OCTR_MNFT_BSSH_CD)나 업소명 같은 같은 기관 코드·이름 매핑으로만 연결한다.
description_portal: -제공 자료는 수입식품의 해외제조업소 중단과 관련된 상세 정보를 포함합니다. 주요 항목으로는 해외제조업소코드, 해외제조업소명, 취소중단코드, 취소중단명, 취소중단기준코드, 취소중단일시, 취소중단시작일시, 취소중단해제일시, 취소중단사유, 수입중단번호 등이 있습니다.-이 자료를 통해 특정 해외제조업소의 수입식품이 어떤 이유로 언제부터 언제까지 수입이 중단(또는 해제)되었는지, 중단 조치와 사유를 조회할 수 있습니다. 해당 정보는 수입식품의 안전성과 신뢰성 확보, 소비자 알권리 보장에 기여할 수 있습니다.
