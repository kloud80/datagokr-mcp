summary_user: 국내식품 검사에서 기준·규격 부적합 판정을 받은 제품을 건별로 담으며, 제품명·업소명·제조일자·유통/소비기한·부적합항목·기준규격·검사결과·검사기관 등을 전국 범위로 제공한다. 소비자는 내가 산 제품(바코드번호)이 부적합 판정을 받았는지 확인하는 데 쓰고, 분석가는 어떤 식품유형·항목에서 부적합이 잦은지 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 업체인허가번호(LCNS_NO)·품목제조보고번호·회수폐기일련번호 같은 같은 기관 코드나 업소명 매핑으로 식품 인허가 업소·회수/판매중지 데이터와 이어 쓴다.
description_portal: 국내식품의 검사결과, 기준·규격 부적합 판정을 받은 제품(제조원, 제조일자, 유통기한이 동일한 제품만 해당)에 대한 속성정보를 제공합니다. 제품명 , 업소명 , 제조일자 , 유통/소비기한 , 영업자주소 , 검사기관 , 전화번호 , 바코드번호 , 포장단위 , 부적합항목 , 기준규격 , 검사결과 , 등록일 , 회수폐기일련번호 , 품목제조보고번호 , 업체인허가번호 , 보고자전화번호 , 식품유형의 속성정보를 제공합니다.이 자료를 통하여 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
