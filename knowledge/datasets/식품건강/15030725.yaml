summary_user: 강원특별자치도에 등록·신고된 식품유통전문판매업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 시군명·업소명·업종·업소 주소를 담는다(CSV 약 119KB). 소비자나 사업자가 강원도 어느 시군에 어떤 유통전문판매업체가 있는지 확인하거나, 분석가가 시군별 업체 분포를 파악하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 시군명을 맞춰 연결해야 한다.
description_portal: '강원특별자치도 식품유통전문판매업 현황에 대한 자료를 아래와 같이 제공합니다. - 제공 데이터 : 시도 및 시군명, 업소명(사업장명), 업종명(업태구분명), 업소 주소(사업장 주소) - 데이터수집 : 도내에 등록/신고 되어있는 유통전문판매업의 기본적인 사업정보를 식품행정통합관리시스템에서 추출 - 기대효과 : 소비자와 기업이 공개된 정보를 바탕으로 의사결정 가능 *  1인 기업의 증가로 영업장 주소와 집주소가 동일하여 개인정보(집주소)가 노출되는 위험을 최소화하기 위해 소재지 주소를 비식별 조치함'
