summary_user: 전북특별자치도 정읍시에 있는 식품운반업소를 업소 한 곳당 한 행으로 담은 목록으로, 업소명·도로명주소·지번주소·연락처·데이터 기준일자가 들어 있다(파일 크기 911바이트의 작은 CSV). 정읍시에서 식품을 운반하는 업체가 어디에 있고 연락처가 무엇인지 찾으려는 사업자나, 지역 식품 유통·위생 관리 현황을 보려는 분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
limits: 전역 조인 키가 없어 다른 데이터와 붙일 때는 이름·주소 매칭에 기대야 하므로 오매칭이 생길 수 있다. 범위는 정읍시 한 곳이며, 좌표나 인허가번호가 없어 지도 위치 분석이나 인허가 이력 추적에는 따로 자료가 필요하다.
