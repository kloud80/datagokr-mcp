summary_user: 수입식품 수입신고 접수 건마다 신고 접수번호와 접수일자, 해외 제조업소의 코드·이름·주소, 수출업체의 코드·이름을 담는 건별 원천 데이터이며, 범위는 전국이고 업소는 개별 주소 단위로 나온다. 수입업자나 분석가가 특정 해외 제조업소나 수출업체를 거쳐 들어온 수입신고가 언제 얼마나 접수됐는지 확인할 때 쓴다. 전역 조인 키는 없어서 해외제조업소 코드(OCTR_MNFT_BSSH_CD)나 업체명을 기준으로 같은 기관의 수입식품·해외제조업소 데이터나 부적합·회수 정보와 이름·코드를 맞춰 잇는다.
limits: 다른 기관 데이터와 바로 연결할 공통 키가 없어 업체명이나 식약처 내부 코드 매칭에 기대야 한다. 포털 설명과 필드 명세에 뜻이 비어 있어 각 컬럼의 의미는 이름으로 추정해 읽어야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
