description_portal: 성남시 내 일반음식점 및 휴게음식점 운영현황에 대한 자료입니다. 구별(수정구, 중원구, 분당구), 업종명(일반음식점, 휴게음식점), 사업장명, 영업상태, 인허가일자, 폐업일자, 영업장면적, 도로명 소재지, 지번 소재지 등의 항목으로 구성되어 있습니다. 해당 데이터는 반기주기로 업데이트되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다. 경기도 성남시의 일반·휴게음식점 현황을 정리한 공공데이터로, 수정·중원·분당구 전역의 업소 정보를 한눈에 볼 수 있게 구성됩니다.
