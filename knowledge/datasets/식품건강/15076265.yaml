summary_user: 경기도 성남시 수정·중원·분당구의 일반음식점과 휴게음식점을 업소 한 곳당 한 줄로 담은 인허가 원장으로, 사업장명·영업상태·인허가일자·폐업일자·영업장면적·도로명/지번 주소를 담는다. 창업자나 상권 분석가가 '분당구에서 최근 몇 년 사이 새로 문을 연 휴게음식점은 몇 곳이고 그중 몇 곳이 폐업했나' 같은 질문에 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 주소(소재지)나 사업장명을 맞춰 붙이거나 구 이름으로 묶어 연결한다.
limits: 인허가번호·사업자번호 같은 공통 키가 없어 다른 식품 인허가·행정처분 데이터와 정확히 매칭하기 어렵고, 주소·상호 문자열 매칭에 의존해야 한다. 범위는 성남시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
