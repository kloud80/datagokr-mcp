description_portal: '부산광역시 해운대구 집단 급식소 현황에 대한 데이터로 업종명, 업소명, 소재지 주소(도로명주소), 연락처 정보를 제공합니다. 집단급식소는 다수의 인원이 모여 규칙적으로 식사를 하는 장소에 설치된 급식 시설을 말합니다. 「식품위생법」에서는 일정 인원(예: 1일 평균 50인 이상)에게 계속적으로 음식을 제공하는 경우 집단급식소로 분류합니다. 대표적으로 학교, 산업체, 병원, 군부대, 사회복지시설 등이 해당됩니다. 따라서 음식류를 공급함에 있어 "비영리", "특정다수인", "1회 급식인원 50인 이상", "계속하여 공급", 식품위생법 제2조에서 규정한 급식시설의 조건을 모두 만족하여야 집단급식소 신고 대상에 해당됩니다.'
