summary_user: 부산광역시 해운대구에 신고된 집단급식소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호를 제공한다. 해운대구 안의 학교·병원·산업체 급식시설이 어디에 몇 곳 있는지, 특정 시설의 연락처가 무엇인지 확인하려는 주민·급식 납품업자·위생 분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어, 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 보는 방식으로만 연결한다.
limits: 해운대구 한 시군구만 담고 있어 부산 전체나 전국 비교에는 다른 구·전국 인허가 데이터가 필요하다. 전역 조인 키가 없어 업소명·주소 매칭에 따른 오연결 가능성을 감안해야 하며, 좌표나 급식 인원 같은 정보는 들어 있지 않다.
