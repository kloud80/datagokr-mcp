summary_user: 서울특별시 강북구에서 식육·알·원유 등을 가공해 소시지·전난분·우유 등을 만드는 축산가공업소의 인허가 내역을 업소 한 곳당 한 행으로 담으며, 영업 중인 곳과 폐업한 곳을 모두 포함하고 인허가일·폐업일·영업상태·주소·중부원점TM 좌표를 갖는다. 축산물 가공 사업을 준비하는 사업자나 분석가가 '강북구에 현재 영업 중인 축산가공업소는 어디에 몇 곳이고 최근 폐업은 언제 있었나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관(자치단체) 코드(OPNSFTEAMCODE)로만 연결하며, 다른 구·업종의 식품 인허가 데이터와 이어 붙여 지역 비교에 쓴다.
description_portal: '서울특별시 강북구 축산가공업 인허가 정보 데이터는 강북구의 식육, 알, 원유 등을 가공하여 소시지, 전난분, 우유 등으로 판매하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
