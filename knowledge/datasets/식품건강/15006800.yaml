summary_user: 인천 영종구(포털 설명상 옛 인천 중구 관할) 미용업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호를 제공한다. 주민이나 미용 관련 사업자가 "우리 동네에 어떤 미용업소가 어디에 있고 연락처는 무엇인가"를 확인하거나, 분석가가 지역 내 미용업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 업소명을 맞춰 붙이거나 같은 기관의 다른 공중위생업소 목록과 이어 써야 한다.
description_portal: 인천광역시 중구에 소재하는 미용업소에 관한 정보입니다.파일명 인천광역시 중구 미용업소 현황내용 업소명, 주소, 전화번호 등공공데이터활용지원센터는 공공데이터포털에 개방되는 3단계 이상의 오픈 포맷 파일데이터를 오픈 API(RestAPI 기반의 JSON/XML)로 자동변환하여 제공합니다.오픈 API를 활용하기 위해서는 공공데이터포털 회원 가입 및 활용신청이 필요하며, 활용 관련 문의는 공공데이터활용지원센터로 연락주시기 바라며,데이터 자체에 대한 문의는 아래 제공기관의 관리부서 전화번호로 연락주시기 바랍니다.파일데이터는 로그인 없이 다운로드를 통해 이용하실 수 있습니다.
