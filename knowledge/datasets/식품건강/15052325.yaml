summary_user: 서울특별시 관악구에 있는 집단급식소를 업소 한 곳당 한 행으로 담은 건별 목록 파일(CSV, 약 19.6KB)로, 업종명·업소명·인허가일자·도로명 소재지·전화번호를 담는다. 구청 위생 담당자나 분석가가 '관악구에서 학교·병원·복지시설 등 급식을 운영하는 시설이 어디에 있고 언제 인허가를 받았나'를 확인하거나 현장 점검 대상 목록을 정리할 때 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·위생 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 관악구 집단급식소 현황 정보입니다. 데이터 항목은 업종명, 업소명, 인허가일자, 도로명 주소, 전화번호로 구성되어 있으며, 교육기관, 의료기관, 공공기관, 복지시설 등 다양한 유형의 집단급식소 운영 대상을 확인할 수 있습니다. 이를 통해 관악구 내 집단급식소의 설치 시기와 분포, 위치 기반 안내, 급식 제공 시설 파악 등에 활용할 수 있으며, 특히 학교 급식 대상 시설 확인, 병원 및 공공기관 내 급식 운영 시설 조회, 현장 점검 대상 목록 정리 등 실무에서 참고할 수 있는 정보로 활용될 수 있습니다.
