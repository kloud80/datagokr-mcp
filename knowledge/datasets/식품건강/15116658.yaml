summary_user: 구로구 안에서 가축을 사육하는 시설의 인허가 내역을 업소 단위로 담은 원장으로, 인허가일자·영업상태·폐업일자·소재지 및 도로명 주소·사업장명·중부원점TM 좌표(X, Y) 등을 담는다. 구청 담당자나 주민이 '우리 동네에 영업 중인 가축사육 시설이 어디에 있고 언제 허가·폐업됐는가'를 확인하거나 주거지와의 거리·밀집도를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하고, 좌표는 위경도로 변환한 뒤 다른 공간 데이터에 겹쳐 쓴다.
description_portal: 가축사육업 인허가 정보는 구로구에서 가축을 사육하는 시설의 운영 실태를 관리하기 위해, 인허가일자, 영업상태명, 소재지주소, 사육가능 종인구 등 시설의 기본 특성과 행정 정보로 구성된 자료이다. 가축사육업은 환경위생, 악취·소음 관리, 지역 안전과 밀접한 업종이므로, 인허가 정보는 주민 생활환경 보호와 법적 규제 이행 여부를 판단하는 데 중요한 근거가 된다. 또한 본 자료는 중부원점TM(EPSG:2097) 좌표계를 기반으로 위치정보를 제공하며 위경도는 포함되지 않기 때문에, 공간 분석 시 좌표 변환이 필요하다. 위치 기반 분석을 통해 사육시설 밀집도, 주거지역과의 거리, 환경 민원 발생 가능성 등을 파악할 수 있다. 더불어 자료는 3일 전 최신 인허가 현황으로 제공되어 개설·폐업 등 변동 사항을 신속하게 모니터링할 수 있다. 이 데이터는 환경정책, 동물방역, 지역계획, 주민 생활환경 관리 등 다양한 행정 분야에서 핵심 자료로 활용된다.
