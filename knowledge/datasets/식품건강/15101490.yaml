summary_user: 경상북도 울진군에서 현재 운영 중인 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일로, 포털 설명 기준 51개소의 업종명·업소명·도로명/지번 주소·영업장 면적·전화번호·급수시설을 포함한다. 지역 식품제조가공업 실태 파악, 납품·공급망 대응을 위한 관내 제조업체 연락처 확인, 위생교육 대상 선정에 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 잇거나 같은 기관(울진군) 자료끼리만 연결한다.
