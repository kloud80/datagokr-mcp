summary_user: 농축산물 유통 과정에서 허위표시로 적발돼 공표된 업체를 건별로 담으며, 업체명·소재지·업종·위반 내용과 공표 시작·종료일이 들어 있고 범위는 전국이다. 소비자가 사려는 농축산물 판매업체에 허위표시 공표 이력이 있는지 확인하거나, 분석가가 업종·지역별 허위표시 적발 사례를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키나 품목제조보고번호·바코드가 없어서, 식품 인허가 업소나 행정처분·부적합 정보 같은 다른 데이터와는 업체명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 농축산물 유통 과정에서 적발된 허위표시 사례에 대한 공표 정보를 제공합니다.해당 데이터를 통해 소비자가 구매하려는 농축산물의 허위표시 이력을 상세히 확인하거나, 유사한 피해 사례를 사전에 파악하여 현명한 구매 결정에 활용하는 등의 효과를 기대할 수 있습니다.이를 통해 소비자들이 농축산물 구매 시 발생할 수 있는 허위표시로 인한 피해를 더욱 효과적으로 예방하고, 안전하고 신뢰할 수 있는 먹거리 선택에 도움을 주며, 궁극적으로 소비자의 알 권리 충족 및 시장의 투명성과 신뢰도 향상에 크게 기여할 수 있습니다.
