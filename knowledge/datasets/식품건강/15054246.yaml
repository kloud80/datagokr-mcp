summary_user: 경기도 성남시에 있는 식품 소분판매업 업소(식품소분업·유통전문판매업·집단급식소식품판매업·기타식품판매업 등)를 업소 한 곳당 한 행으로 담은 현황 파일로, 업종·업소명·전화번호·도로명 소재지와 데이터 기준일자를 담는다. 성남시에서 건강식품·건어물·곡물 등을 나눠 파는 업소가 어디에 몇 곳 있는지 알고 싶은 주민·창업자나, 지역 식품 유통 구조를 보려는 분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·도로명 주소를 맞춰서만 이어 쓴다.
description_portal: 식품을 소분하여 판매하는 업체(식품소분업, 유동전문판매업, 집단급식소식품판매업,기타식품판매업) 등에 관한 현황에 대한 데이터로 업종명,업소명,소재지,전화번호 항목으로 구성되어 있습니다. 소규모 식품 유통 구조와 지역 내 식품안전관리 수준을 파악하는 데 중요한 기초자료입니다. 식품 소분판매업은 대형 제조·유통업체와 달리 가공된 식품을 일정 단위로 나누어 재포장하거나 소비자에게 소량으로 판매하는 영업 형태로, 주로 건강식품, 건어물, 곡물, 차류, 분말류 등에서 활발히 이루어지고 있습니다.
