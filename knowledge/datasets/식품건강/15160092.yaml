summary_user: 인천광역시 옹진군 관내 휴게음식점을 업소 한 곳당 한 행으로 담은 신고 현황 파일로, 업종명·사업장명·인허가일자·전화번호·면적·지번/도로명 주소를 담는다. 옹진군에서 커피전문점 같은 휴게음식점이 어느 섬·읍면에 몇 곳 있는지 알고 싶은 창업자나, 위생 점검 대상을 정리하려는 행정 담당자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(도로명·지번)나 사업장명으로 맞춰 이어 쓴다. 이렇게 하면 전국 식품 인허가 업소 원장이나 위생 지정·행정처분 데이터와 대조할 수 있다.
description_portal: 본 공공데이터는 인천광역시 옹진군 관내 휴게음식점의 신고 현황을 정리한 자료입니다. 본 자료는 인천광역시 옹진군 내 휴게음식점의 업소명, 주소, 허가일자 등으로 구성이 되어 있습니다. 본 데이터를 통해 커피전문점, 제과점 등 다양한 음식점 분포를 파악할 수 있으며, 이를 통해 식품위생 지도,점검 또는 지역 상권 분석 등 다양한 행정 및 정책적 활용이 가능할것으로 판단이 됩니다. 또한 위생행정의 기초자료로도 활용가능할것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
