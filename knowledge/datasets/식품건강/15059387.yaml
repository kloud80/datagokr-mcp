summary_user: 경기도 31개 시군의 축산물 운반업체를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·WGS84 위경도·축산고유번호 등을 포함한다. 냉동탑차 운송업체가 어느 시군에 몰려 있는지, 최근 폐업한 운반업체가 어디인지 확인하려는 위생관리 담당자나 유통경로 분석가가 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·주소·위경도로 다른 경기도 식품 인허가 업소 데이터나 지도와 맞추고, 축산고유번호(STOCKRS_IDNTFY_NO)는 같은 체계의 축산물 데이터와 대조하는 데 쓴다.
description_portal: 이 데이터는 경기도 31개 시군 내에서 축산물을 전문적으로 운반하는 축산물 운반업체에 대한 인허가 현황을 제공하며, 사업장명, 인허가일자 및 취소일자, 영업상태, 폐업일자, 소재지 주소(도로명 및 지번), 소재지 면적, 우편번호, 위경도 좌표(WGS84 기준), 전화번호, 총 종업원 수, 업태구분명, 축산업무구분명, 축산물가공업구분명, 축산고유번호, 권리주체고유번호 등 다양한 세부 항목으로 구성되어 있습니다. 해당 데이터는 냉동탑차 등 축산물 위생운송수단을 통해 신선도 유지와 안전한 축산물 유통망을 구축하기 위한 기반자료로 활용되며, 유통경로 분석, 위생관리 정책 수립, 유통업체 분포 분석 등의 목적으로 활용 가능합니다. 본 데이터는 주간 단위로 갱신되며 Open API 형식으로 제공됩니다.
