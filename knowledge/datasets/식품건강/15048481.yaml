description_portal: '인천광역시 식품유통전문판매업체 현황(업체명, 업종, 주소)에 대한 항목 정보를 제공하는 데이터로 구성되어있습니다.개인정보(업주이름, 사업자등록번호등)와 우편번호등은 공개되지 않습니다.해당 자료는 매월 업데이트 되는 자료입니다.업데이트 날짜를 기준으로 운영되고 있는 식품유통전문판매업체 현황을 공개합니다. 파일내 항목별 내용은 붙임 파일을 참고해주시기 바랍니다.데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.자료 출처 : 식품행정통합시스템'
