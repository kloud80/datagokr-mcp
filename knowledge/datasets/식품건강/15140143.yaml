summary_user: 통합위해성평가 결과 중 식품 분야의 품목별 오염도 평균값을 담은 집계 자료로, 농산물 21품목·수산물 9품목·축산물 4품목·가공식품 54품목의 시료 1,412건을 바탕으로 프탈레이트 7종, 비스페놀 3종, 알루미늄, 니켈, 대체가소제 5종의 평균값을 품목 단위로 제공한다. 연구자나 소비자가 '어떤 식품 품목에서 프탈레이트나 비스페놀 같은 유해물질이 평균적으로 얼마나 검출되었나'를 확인하거나 노출량을 추정할 때 쓴다. 전역 조인 키는 없으며, 품목코드(PRDLST_CD)와 식품공전 대분류·소분류 이름을 매개로 같은 기관의 다른 식품 자료와 이름·코드 매핑으로만 연결한다.
description_portal: "\"제1차 위해성평가 기본계획('23~'27)에 따라 '24년 공개한 프탈레이트 7종의 통합위해성평가 결과 중 식품 분야의 오염도 평균값 - 사람이 섭취·투여·접촉·흡입 등을 함으로써 인체에 직접영향을 줄 수 있는 인체적용제품(식품, 의약품, 의약외품, 화장품, 위생용품 등)에 대하여 유해물질이 어떤 제품을 통해 우리 몸에 얼마나 들어오는지를 조사하여 안전한 수준으로 관리하기 위해 5년마다 기본계획을 수립하여 평가하고 있습니다.- 개방 데이터는 위해성평가 결과보고서와 관련된 데이터로 농산물 21품목, 수산물 9품목, 축산물 4품목, 가공식품 54품목에 대한 시료 1,412건의 오염도 자료에 대한 자료입니다.\""
