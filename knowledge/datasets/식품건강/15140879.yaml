description_portal: 이 데이터는 서울특별시 광진구에서 실시한 식품 관련 수거검사 및 이에 따른 행정처분 현황 정보를 제공합니다.수거검사는 식품 제조·가공업소, 유통판매업소, 식품접객업소 등에서 판매·취급 중인 식품을 무작위 또는 특정 기준에 따라 수거하여, 유해 물질 검출, 보존료 기준 초과, 미생물 오염 여부 등 위해 요소를 검사하는 과정을 말합니다.본 데이터에는 수거일자, 업소명, 소재지, 검사 항목, 검사 결과, 행정처분 내역 등이 포함되며, 부적합 식품 유통 차단, 식품안전관리 강화, 소비자 보호, 위생 취약 업소 식별 등에 활용됩니다.또한 해당 자료는 식품위생법 위반에 따른 행정처분(과징금, 영업정지 등)의 기초자료로 활용되며, 식중독 예방 및 지역 위생 지도점검 활동의 기반이 됩니다.※ 데이터는 검사가 실시된 전체 업소를 대상으로 하며, 위치정보는 포함되지 않고 수거기록 기반의 행정 데이터입니다.※ 데이터는 정기적 또는 수시점검에 따라 지속적으로 갱신되며, 행정목적 외 연구·분석에도 유용하게 활용될 수 있습니다.
