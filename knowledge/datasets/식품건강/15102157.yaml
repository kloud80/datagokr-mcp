summary_user: 인천광역시 서구(제목상 서해구)에 있는 HACCP 인증 식품제조가공업체를 업소 한 곳당 한 행으로 담은 파일(csv, 약 82KB)이며, 업체명·업종·인증품목·인증번호·최초인증일·유효기간·주소가 들어 있다. 시민이나 유통·납품 담당자가 "우리 동네의 이 식품 업체가 HACCP 인증을 받았고 인증이 아직 유효한가"를 확인할 때 쓴다. 실측 컬럼에는 인허가번호 같은 전역 조인 키가 없어서, 식품 인허가 업소 원장이나 회수·행정처분 데이터와는 업체명·주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 본 공공데이터는 인천광역시 서구에 위치한 HACCP(식품안전관리인증기준) 인증 식품제조가공업체 현황을 수록한 자료입니다. 본 자료는 인천광역시 서구 내 HACCP 인증업소의 업체명 업종, 인증품목, 인증번호, 최초 인증일, 유효기간, 사업자 주소등이 포함되어 있습니다. 본 데이터를 통해 각 업체의 위생관리 및 식품안전 기준 충족 여부를 쉽게 확인할 수 있습니다. 해당 데이터를 통해 시민에게 안전한 식품정보 제공 등 다양한 자료에 활용될수 있으며 본 데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
