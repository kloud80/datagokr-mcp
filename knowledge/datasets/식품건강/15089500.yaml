summary_user: 인천광역시 서구(서해구)에 등록된 유통전문판매업 업소를 한 곳씩 담은 원천 목록으로, 업종·업소명·소재지 주소·전화번호·데이터기준일자를 담는다(CSV 약 56KB). 주민이나 식품 유통 사업자가 '우리 구에 정식 등록된 유통전문판매업체가 어디에 있고 연락처는 무엇인가'를 확인하거나 지역 내 분포를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·소재지 주소를 맞춰 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 유통전문판매업 등록현황을 제공하고 있습니다. 본 데이터는 인천광역시 서구 내의 유통전문판매업종의 업소명, 소재지, 전화번호 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 내 유통전문판매업의 현황 및 분포를 확인할 수 있습니다. 이로 인해, 주민들은 지역 내 합법적으로 등록된 유통전문판매업 정보를 확인할 수 있으며, 이로 인해 안전한 먹거리를 선택하는데 기여할 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
