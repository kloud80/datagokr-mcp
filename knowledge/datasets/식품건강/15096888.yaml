summary_user: 전국 어린이급식관리지원센터별로 연도·분기마다 지원한 유치원·어린이집·기타 시설의 수와 인원수를 담은 집계 데이터이며, 관할기관과 센터명이 함께 들어 있다. 지자체 담당자나 분석가가 '우리 지역 급식센터가 이번 분기에 어린이집 몇 곳, 아동 몇 명을 지원했는지'나 센터 간 지원 규모 차이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 관할기관명·센터명을 이름으로 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: 어린이 급식센터 지원현황에 대한 데이터로 관할기관 , 센터명 , 년도 , 분기 , 유치원 수 , 유치원 인원수 , 어린이집 수 , 어린이집 인원수 , 기타 수 , 기타 인원수 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
