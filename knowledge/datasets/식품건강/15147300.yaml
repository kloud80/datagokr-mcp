summary_user: 서울 강북구 관내 유흥주점영업(스탠드바·룸살롱·노래클럽 등) 업소를 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표(X, Y)·시설규모 등을 포함한다. 분석가나 사업자가 강북구에서 현재 영업 중인 유흥주점이 어디에 몇 곳 있고 언제 인허가·폐업했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구나 다른 식품업종 인허가 데이터와는 관리번호(MGTNO)·주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓴다.
description_portal: '서울특별시 강북구 유흥주점영업 인허가 정보 데이터는 강북구 관내에 위치한 스텐드바, 룸살롱, 노래클럽 등 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소정보입니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
