summary_user: 서울 마포구에서 직접 제조하지 않고 식품을 판매업소에 유통하는 유통전문판매업소의 인허가 정보를 업소 한 곳당 한 행으로 담은 원장이다. 인허가일자, 영업상태와 폐업일자, 사업장명, 지번·도로명 주소, 중부원점TM 좌표가 함께 들어 있다. 사업자나 분석가가 '마포구에서 현재 영업 중인 유통전문판매업소는 어디에 몇 곳 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 식품 인허가 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
description_portal: '서울특별시 마포구의 직접 제조하지 않고 식가공류 제공을 위해 판매업소에 유통하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 유통전문판매업체의 위치, 취급 품목과 운영 현황을 파악하고, 유통 구조의 투명성 확보와 소비자 권익 보호에 기여할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
