summary_user: 식품·의약품분야 시험·검사 등에 관한 법률에 따라 지정된 국외시험검사기관을 기관 한 곳씩 담은 목록으로, 인정번호·기관명·대표자·지정일자·검사항목·전화번호·주소를 제공하며 범위는 전국·비공간이다. 수입식품을 들여오는 사업자가 해외 현지에서 받은 시험성적을 쓰려 할 때 어느 해외 기관이 어떤 검사항목으로 지정돼 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 기관명·인정번호(PRSEC_INSTT_RCOGN_NO) 같은 이름·코드 매핑으로만 이어 쓰며, 수입식품 관련 데이터와 함께 참고한다.
description_portal: 식품ㆍ의약품분야 시험ㆍ검사 등에 관한 법률에 따른 국외시험검사기관 인정번호, 기관명, 대표자, 지정일자, 검사항목, 전화번호, 주소 등을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
