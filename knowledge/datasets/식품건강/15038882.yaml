summary_user: 인천광역시 서구(서해구) 내 착한가격업소를 업소 한 곳당 한 행으로 담은 목록으로, 최초 지정월·업종·업소명·소재지·연락처를 주소 단위로 제공한다(CSV 약 6.9KB). 주민이 '우리 동네에서 저렴한 가격으로 지정된 식당·생활 편의업소가 어디 있나'를 찾거나, 분석가가 구 내 착한가격업소의 업종 분포와 지정 시기를 살피는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표)가 없어 식품 인허가 업소 원장 등 다른 데이터와는 업소명·소재지 주소를 맞춰 대조해야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 착한가격업소의 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 착한가격업소의 최초 지정일, 업종, 업소명, 소재지, 연락처 등 항목을 제공 하고 있습니다. 본 공공데이터를 통하여 주민들은 지역 내 착한가격업소의 현황을 손쉽게 파악할 수 있습니다. 이를 통하여 주민들은 신뢰할 수 있는 저렴한 비용의 생활 편의업소 정보를 얻을 수 있어 소비생활에 도움을 줄 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
