summary_user: 대구광역시 서구 관내 위탁급식영업 업소를 업소 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 2KB)로, 업종명·업소명·도로명/지번 주소·우편번호가 들어 있다. 서구 안에서 기업 사내식당이나 공공기관 급식소를 위탁 운영하는 업체가 어디에 있는지 확인하려는 주민·급식업 사업자·위생점검 담당자가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어, 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대구광역시 서구 위탁급식업 현황에 대한 데이터로 위탁급식 업종명, 업소명, 소재지, 소재지 전화번호, 기타 유의사항에 대한 정보를 제공합니다.본 데이터는 대구광역시 서구 관내 위탁급식영업 업소의 현황을 수록한 자료로, 집단급식 형태로 음식을 제공하는 사업장의 기본 정보를 포함한다. 주요 항목으로는 업종명, 업소명, 도로명 및 지번 주소, 우편번호 등이 있으며, 기업체 사내식당, 대형마트 식당, 연구소 및 공공기관의 위탁 운영 급식소 등 다양한 업종이 포함되어 있다. 해당 데이터는 지역 내 위탁급식 운영 실태를 파악하고, 식품위생 관리, 급식 관련 민원 응대, 행정지도 등의 기반 자료로 활용 가능하다. 위치 기반 행정자료로서 유용하며, 식품안전정책 및 위생점검 계획 수립 시 기초자료로 제공할 수 있도록 구성하였다.
