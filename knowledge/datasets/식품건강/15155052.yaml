summary_user: 전국 자치단체가 관리하는 모범음식점을 업소 단위로 취합한 API로, 업소명·주소·전화번호·음식 유형과 지정·취소·폐업 정보를 담고 전체 65,428건이다. 외식하려는 국민이나 위생 분석가가 지역별 모범음식점이 어디에 있고 어떤 음식을 파는지 찾는 질문에 쓴다. 소재지주소·도로명주소(address) 키로 다른 주소 기반 데이터와 잇고, 인허가번호(LCPMT_NO)로 식품 인허가 업소 원장과 이어 쓰며, 관리번호(MNG_NO)는 pnu 키로 잡혀 있다.
description_portal: '모범음식점정보 데이터는 자치단체에서 관리하는 모범음식점 데이터로 업소명, 소재지 주소, 전화번호 등 기본 정보와 함께 음식의 유형 및 주된 음식 종류 등 업소 특성 정보 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 모범음식점 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 전국 모범음식점의 기본 현황과 지정·운영 정보를 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 식중독예방과 / 043-719-2115 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
