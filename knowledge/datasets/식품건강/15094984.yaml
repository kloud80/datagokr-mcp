summary_user: HACCP 교육훈련기관으로 지정된 기관을 기관 1곳당 1건으로 담은 전국 단위 목록이며, 지정번호·기관명·주소·대표자·허가일자를 제공한다. 식품업체 담당자가 HACCP 의무교육을 받을 수 있는 지정 교육기관이 어디에 있는지, 언제 지정됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 HACCP 적용업소 등 다른 위생 지정 데이터와는 기관명·주소 같은 이름 매핑으로만 이어 쓴다.
description_portal: HACCP 교육훈련기관 지정 현황  정보로 지정번호 , 교육훈련기관명 , 주소 , 대표자 , 허가일자  등 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
