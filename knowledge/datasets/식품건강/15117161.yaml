summary_user: 국가생약자원 관능검사에서 부적합으로 판정된 한약재 사례를 건별로 담으며, 생약명·라틴생약명·기원종(국명·학명)·부적합 사유와 사례 사진 URL을 제공하고 범위는 전국 단위의 비공간 자료다. 한약재 수입·제조업체나 시험·검사기관 담당자가 '이 생약은 관능검사에서 어떤 사유로 부적합 판정을 받는가'를 확인하고 품질관리 기준이나 판정 교육 자료를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품안전 데이터와는 생약명·학명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 이벤트성으로 생성된 뒤 바뀌지 않는 자료로 보고되어 수시 갱신을 기대하기 어렵다. 업소나 제품 단위 식별 키가 없어 특정 업체의 행정처분·회수 이력과 직접 연결할 수 없다. API는 serviceKey가 필요하며 개발계정은 하루 10,000회로 호출이 제한된다.
