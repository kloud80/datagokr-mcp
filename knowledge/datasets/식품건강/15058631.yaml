summary_user: 식품위생법에 따른 식품첨가물의 한시적 기준·규격 인정 건을 전국 단위로 담는다. 인정번호, 인정일자, 품목명, 신청 업소명·대표자명, 연락처가 들어 있다. 식품 제조·수입 사업자나 분석가가 특정 첨가물이 언제 어느 업체에 한시적 기준·규격으로 인정됐는지 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 다른 식품 데이터와는 업소명이나 품목명을 문자열로 맞춰 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는식품위생법에 따른 식품첨가물 관련 한시적 기준규격 인정 현황 정보 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
