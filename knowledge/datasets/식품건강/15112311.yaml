summary_user: 세종특별자치시에 있는 일반음식점·휴게음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·인허가일자·도로명/지번 주소·전화번호와 등록기준일을 포함한다. 창업 예정자나 상권 분석가가 '조치원읍이나 다정동에 일반음식점이 몇 곳 있고 언제 인허가를 받았나'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표)는 없어서, 다른 데이터와는 업소명이나 주소 문자열로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 세종특별자치시에 있는 일반음식점, 휴게음식점 현황(2023.1.31.)을 제공합니다데이터는 연번, 업종명(일반음식점, 휴게음식점), 업소명, 소재지(도로명), 소재지(지번), 소재지 전화, 등록기준로 구성되어 있습니다.등록기준일 기준 세종특별자치시 일반휴게음식점은 세종식당, 더비, 조치원집, 내집닭갈비, 그대랑달갈비, 윤가네들깨수제비보쌈, 유가네 한우곰탕 세종조치원점,, 본가 신촌 설렁탕(세종 전의점),월남쌈김상사조치원점 등 총 5077개의 음식점이 조치원읍, 다정동, 금남면, 고운동, 전의면 등에 소재하고 있습니다.
