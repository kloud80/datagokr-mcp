summary_user: 서울시 소재 대중목욕탕·찜질방·사우나 등 목욕장업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일자, 영업·휴폐업 상태, 소재지와 도로명주소, 전화번호, 건물 층수, 욕실 수, 발한실 여부, 좌표 등을 포함한다. 주민이나 분석가가 "우리 구에서 지금 영업 중인 찜질방·사우나는 어디이고 최근 폐업한 곳은 어디인가" 같은 질문을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 공중위생업 인허가 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호나 주소·업소명 매칭으로 잇고, 좌표는 중부원점 TM 체계라 지도와 겹치려면 변환이 필요하다.
description_portal: '서울시 목욕장업 인허가 정보는 서울시 소재의 대중목욕탕, 찜질방, 사우나 등 물로 목욕 할 수 있거나 맥반석ㆍ황토 등에게 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스를 제공하는 업소정보를 제공합니다.인허가정보, 영업상태, 휴업정보, 폐업정보, 소재지 정보, 전화번호, 업체구분명, 좌표 정보 등을 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
