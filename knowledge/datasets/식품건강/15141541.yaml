description_portal: 본 데이터는 서울특별시 종로구에서 기존에 모범음식점으로 지정되었던 일반음식점 가운데, 지정이 취소된 업소들의 기본 정보를 정리한 자료입니다. 수록 항목에는 시군구코드, 지정년도, 지정번호, 신청일자, 지정일자, 취소일자, 업소명, 소재지 도로명주소 등이 포함되어 있으며, 일정 기준 미충족, 자진취소 또는 업소 변경 사유 등으로 인해 지정이 해제된 사례를 확인할 수 있습니다. 해당 자료는 모범음식점 지정 유지 실태를 파악하고, 지정 이후 관리체계 및 사후평가 기준 정비 등에 활용됩니다. 또한 공공급식 및 외식문화 개선을 위한 위생·서비스 정책의 기초자료로 쓰이며, 지역 내 청결도 높은 음식업소 운영환경 조성을 위한 행정계획 수립에도 참고할 수 있습니다.
