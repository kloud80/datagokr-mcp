description_portal: '서울특별시 중구의 주로 다류, 아이스크림류 등을 조리하여 판매하거나 패스트푸드점 또는 공항 등에서 음식류를 조리하여 판매하며, 음주행위가 허용되지 않는 업소 정보입니다. 데이터는 각 신고업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 휴게음식점 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 카페 신고업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 비알코올 원칙을 준수하고 식품제조 및 영업자준수 관리가 철저히 이행되는 신뢰할 수 있는 간편식 제과 판매업소 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
