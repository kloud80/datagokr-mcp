summary_user: 충청북도 제천시에서 담배 소매인으로 지정된 업소를 한 곳씩 담은 건별 목록으로, 소매인 구분·업소명·지번/도로명 주소·전화번호·지정일자·영업 구분을 포함한다. 시청 담당자나 상권 분석가가 '우리 동네 어디에 담배 판매점이 있고, 언제 지정됐으며 지금도 영업 중인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소를 맞춰 보거나 같은 기관(제천시) 자료끼리 이어 써야 하며, 주소를 좌표로 바꾸면 학교·청소년 시설 위치와 공간 분석에 쓴다.
description_portal: 본 데이터는 충청북도 제천시 내 담배 소매인 지정 현황에 대한 정보를 제공합니다. 총 665건의 데이터로 구성되어 있으며, 각 항목에는 소매인구분, 업소명, 업소지번주소, 업소도로명주소, 업소전화번호, 지정일자, 영업구분, 데이터기준일자가 포함되어 있습니다. 이 데이터는 담배 판매업소의 지역별 분포와 지정 시점 등을 확인할 수 있는 기초 자료로 활용되며, 공공건강 정책 수립, 판매업소 관리, 청소년 보호구역 내 판매업소 점검 등의 행정업무에 유용합니다. 또한 상권 분석, 입지 조건 파악, 유통 경로 설계 등 민간영역에서도 다양한 활용이 가능합니다. 위치 정보가 포함되어 있어 지리정보시스템(GIS)과 연계한 공간 분석에도 활용할 수 있습니다. 지정일자를 통해 시기별 지정 추이도 파악할 수 있어 정책적 활용가치가 높습니다.
