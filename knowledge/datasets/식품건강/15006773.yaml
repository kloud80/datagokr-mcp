summary_user: 경상북도 예천군에서 영업 중인 이·미용업소를 업소 한 곳당 한 줄로 담은 파일로, 업종명·업소명·도로명 주소·전화번호·기준일자를 담는다. 주민이 동네 미용실·이용원 위치와 연락처를 찾거나, 창업 예정자·분석가가 예천군 내 이미용업소 분포를 읍면별로 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(예천군) 자료끼리만 연결한다.
