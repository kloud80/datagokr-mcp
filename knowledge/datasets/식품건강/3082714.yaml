description_portal: '공공데이터 목록에는 부산광역시 연제구 유흥주점 및 단란주점 현황이 있습니다. 유흥주점 및 단란주점 소재지 전화번호, 업종명, 업소명 등이 기록되어 있습니다.단란주점영업: 주로 주류를 조리ㆍ판매하는 영업으로서 손님이 노래를 부르는 행위가 허용되는 영업이며, 객실이 영업 면적의 2/1을 초과할 수 없으며, 객실이 객장에서 내부가 보여야 함.유흥주점영업: 주로 주류를 조리ㆍ판매하는 영업으로서 유흥종사자를 두거나 유흥시설을 설치할 수 있고 손님이 노래를 부르거나 춤을 추는 행위가 허용되는 영업이며, 객실 면적 제한은 없음.'
