summary_user: 부산광역시 연제구의 단란주점(포털 설명상 유흥주점 포함) 업소를 한 곳씩 업종명·업소명·도로명 소재지로 담은 업소별 목록 파일이다. 주민이나 상권 분석가가 '연제구 어느 거리에 단란주점이 몰려 있나'처럼 주점 업소의 위치 분포를 확인하는 데 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 업소 데이터와는 업소명이나 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와 정확히 연결되지 않고, 이름·주소 매칭에 기대야 한다. 범위는 연제구 한 곳이며, 받은 필드에는 업종명·업소명·도로명 소재지만 있어 좌표나 인허가 일자 같은 정보는 이 파일로 알 수 없다.
