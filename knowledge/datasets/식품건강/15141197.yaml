summary_user: 파주시가 지정한 음식점 위생등급 업소를 업소 한 곳당 한 행으로 담은 파일(CSV, 약 110KB)로, 업종·업소명·읍면동·도로명/지번 주소·위도·경도·위생등급·지정일자와 지정종료일자를 포함한다. 파주 시민이나 방문객이 '우리 동네에서 위생등급을 받은 식당이 어디이고 등급과 지정기간은 언제까지인가'를 확인하거나, 분석가가 읍면동별 위생등급 업소 분포를 지도로 비교하는 데 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없으므로, 식품 인허가 업소 원장 등 다른 데이터와는 업소명·주소 문자열 매칭이나 위도·경도 좌표로 이어 써야 한다.
description_portal: 경기도 파주시 음식점 위생등급 지정 현황에 대한 공공데이터로 을 포함하며, 업소명, 업종명, 읍면동명, 도로명주소 및 지번주소, 위도·경도 좌표, 위생등급명, 지정일자 및 종료일자, 연락처 정보 등으로 구성되어 있습니다. 이 데이터는 음식점 위생관리 현황을 시계열적으로 추적할 수 있도록 지정기간을 명확히 구분하며, 공간정보(위도·경도)를 포함해 위치 기반 분석 및 GIS 응용에 최적화되어 위생등급별 분포, 지역별 위생관리 현황 비교, 정책 효과 분석, 지도 시각화, 모바일 앱 등 다양한 서비스 개발, 공공위생 개선 및 소비자 보호를 위한 의사결정 지원 자료, 음식점 위생 상태와 위치 기반 서비스 개발, 위생 등급 정책 연구 등에 활용될 수 있습니다.
