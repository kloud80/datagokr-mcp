summary_user: 서울특별시 중구에서 신고된 건강기능식품일반판매업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호, 인허가일, 영업·상세 상태(영업·폐업 등), 폐업일, 지번·도로명 주소, 업소명, 중부원점TM 좌표(X·Y)가 들어 있다(유통전문판매업은 제외). 예비 창업자가 중구 안에서 영업 중인 건강기능식품 판매점이 어디에 몰려 있는지, 최근 개업·폐업 흐름이 어떤지 살펴보는 데 쓴다. 다른 데이터와 바로 맞물리는 전역 조인 키는 없어서, 주소·업소명을 맞추거나 같은 기관의 코드(개방자치단체코드 OPNSFTEAMCODE)를 기준으로 다른 식품 인허가 업종 자료와 이어 쓴다.
description_portal: '서울특별시 중구의 건강기능식품을 판매하는 업소 정보(건강기능식품유통전문판매업에 해당되는 업소 제외)입니다. 데이터는 각 신고업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 건강기능식품일반판매업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 소매업 신고업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 보건위생 기준을 충족하고 정확한 표시광고를 통해 소비자안전을 확보하며 건강증진에 기여하는 신뢰할 수 있는 판매시설의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
