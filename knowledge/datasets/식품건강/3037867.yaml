summary_user: 강원특별자치도가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 목록 파일이며, 업종·업소명·주소·연락처를 기록한다(포털 설명 기준 도내 693개소). 주민이나 여행객이 '강원도에서 가격이 저렴한 음식점·세탁소 등 착한가격업소가 우리 동네 어디에 있나'를 찾거나, 분석가가 시군·업종별 지정 업소 분포를 살피는 데 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어서, 식품 인허가 업소 원장 등 다른 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 파일에 좌표나 인허가번호가 없는 비공간 목록이어서 지도에 올리거나 다른 원장과 정확히 연결하려면 주소 지오코딩이나 이름 매칭을 따로 해야 하고, 이 과정에서 오매칭이 생길 수 있다. 가격·메뉴·지정 기준 같은 정보는 담지 않으며, 수록 업소는 강원도 지정 업소로 한정된다.
