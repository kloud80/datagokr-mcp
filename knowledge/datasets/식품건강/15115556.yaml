summary_user: 서울특별시 중랑구에서 식용얼음을 판매하는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표 등을 담는다. 중랑구에서 현재 영업 중인 식용얼음 판매업소가 어디에 있는지, 언제 인허가를 받고 언제 폐업했는지를 확인하려는 사업자나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결할 수 있다.
description_portal: '서울특별시 중랑구의 식용얼음을 전문적으로 판매하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
