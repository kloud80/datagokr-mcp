summary_user: 강릉시에서 커피 원료로 식품을 제조·가공하는 업소를 업소 한 곳당 한 행으로 담은 목록 파일(csv, 약 4KB)로, 업종·상호·도로명 주소와 제조하는 식품의 종류·세부 유형(가공커피, 액상커피 등)을 담는다. 창업 준비자나 지역 분석가가 '강릉에서 커피를 제조·가공하는 업체는 어디에 몇 곳이 있고 어떤 제품을 만드는가'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)가 없어, 다른 식품 인허가 데이터와는 업소명·도로명 주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: '커피 원료를 사용해 식품을 제조·가공하는 업체들의 기본 정보를 정리한 데이터로, 업소별 업종 분류, 상호, 도로명 주소, 제조·가공하는 식품의 종류와 세부 유형을 한 번에 확인할 수 있도록 구성된 자료입니다.업종: 커피 관련 식품제조·가공 사업의 업종 명칭으로, 영업 형태나 허가 유형에 따른 분류 정보를 나타냅니다.업소명: 커피 식품제조·가공업을 영위하는 사업장의 공식 상호(가게 이름)를 의미합니다.소재지(도로명): 제조·가공시설이 위치한 영업장의 도로명 주소로, 지도 검색·현장 방문·입지 분석 등에 활용됩니다.식품의종류: 해당 업체가 제조·가공하는 식품의 큰 분류를 나타내며, 커피, 커피음료, 디저트류, 제과·제빵류 등 제품군 수준의 정보를 제공합니다.식품의유형: 식품위생법 등 관련 기준에 따른 보다 세분화된 식품 유형으로, 가공커피, 액상커피, 커피농축액, 커피맛 음료 등 세부 품목 특성을 구체적으로 구분합니다.이 데이터는 커피 식품제조·가공업체의 분포와 제품 특성을 파악하고, 지역 커피 산업 현황 분석, 식품 안전·위생관리 대상 파악, 커피 관련 창업·입지 분석, 커피 축제·관광 콘텐츠 연계, 소상공인 지원 정책 설계 등에 활용할 수 있는 기초 자료입니다.'
