summary_user: 경기도 내 양식장·위판장 수산물을 대상으로 한 안전성 검사 결과를 검사 건별로 담으며, 집계년도·시군·수산물 구분·품명·검사 접수/완료일자·검사항목(방사능·중금속·항생제 등)·적합 여부를 포함한다. 소비자나 지자체 담당자가 "우리 시군에서 검사한 수산물 중 부적합 판정을 받은 품목이 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 품명을 이름·코드 매핑해 경기도의 다른 식품안전 데이터와 연결한다.
description_portal: 이 데이터는 「농수산물품질관리법」 제61조 및 「경기도 수산물의 안전성조사 등에 관한 조례」에 근거하여 경기도 내 수산물 안전성 검사를 실시한 결과를 제공하는 자료입니다. 주요 항목은 집계년도(SUM_YY), 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 수산물구분명(MARNPROD_DIV_NM), 품명(GOODS_NM), 검사접수일자(INSPECT_RECEPT_DE), 검사완료일자(INSPECT_COMPLT_DE), 검사항목내역(INSPECT_ITEM_DTLS), 검사결과적합여부(INSPECT_RESLT_SUITBLT_YN), 비고사항(RM_MATR)으로 구성됩니다.검사항목에는 방사능, 중금속, 항생제 등 인체 유해물질 여부가 포함되어 있으며, 해당 데이터는 수산물 안전성 확보와 소비자 신뢰 제고를 위한 중요한 기초자료로 활용됩니다. 특히 양식장 및 위판장을 대상으로 한 검사 결과를 제공하여 수산물 유통 전 단계에서의 안전성 관리 현황을 파악할 수 있습니다. 연구기관과 지자체는 본 데이터를 활용해 수산물 안전관리 정책을 개선하거나 위험요인을 조기에 차단하는 전략 수립에 활용할 수 있으며, 일반 소비자에게는 안전한 먹거리 선택을 위한 근거자료로 활용될 수 있습니다.
