summary_user: 서울 서초구 안 유흥주점영업 업소를 한 곳씩 담은 인허가 원장으로, 인허가일자·영업상태와 상세상태·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y)·종사자 수·시설 규모·임대 정보 등을 업소별로 담는다. 구청 담당자나 상권 분석가가 '서초구에서 영업 중인 유흥주점은 어디에 몰려 있고, 최근 몇 곳이 폐업·휴업했나'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·개방자치단체코드로 잇고, 좌표를 쓰면 공간 결합도 할 수 있다.
description_portal: 서울특별시 서초구  내 유흥주점영업의 인허가 정보를 체계적으로 제공하는 데이터로, 인허가일자, 영업상태, 전화번호, 주소, 사업장명 등 기본 정보와 함께 위생업태, 종사자 수, 시설 규모, 임대 정보 등 다양한 세부 항목을 포함합니다. 이를 통해 유흥주점의 개업, 폐업, 휴업 등 행정 이력과 현재 업소 현황을 종합적으로 파악할 수 있습니다. 해당 자료는 유흥업소 관리, 지역 치안 및 안전 대책 마련, 정책 수립, 연구 분석 등 폭넓은 분야에서 활용 가능하며, 특히 불법 영업 방지, 유흥업소 밀집 지역 모니터링, 상권 변화 분석 등에도 유용한 기초 자료로 가능합니다.
