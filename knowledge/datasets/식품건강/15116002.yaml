summary_user: 서울특별시 중구에 신고된 이용업(이발소) 업소를 업소 한 곳당 한 건으로 담으며, 관리번호(MGTNO), 인허가일자, 영업상태(영업·폐업 등)와 폐업일자, 지번·도로명 주소, 사업장명, 중부원점TM 좌표, 건물 층수, 종사자 수, 의자 수가 들어 있다. 이발소를 창업하려는 사람이 중구 안에서 현재 영업 중인 이발소가 어디에 얼마나 모여 있는지, 폐업이 어느 정도 이어지는지 알아볼 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아 다른 데이터와는 주소·업소명을 맞춰 보거나 같은 기관 코드(OPNSFTEAMCODE)로만 연결할 수 있다.
description_portal: '서울특별시 중구의 이발소와 같이 머리 또는 수염을 깎거나 다듬는 등의 방법으로 용모를 단정하게하는 업소 정보입니다. 데이터는 각 신고업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 이용업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 이발소 신고업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 법적 시설기준을 충족하며 위생관리 상태가 양호한 신뢰할 수 있는 공중위생 이발소의 위치 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
