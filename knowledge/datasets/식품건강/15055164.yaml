summary_user: 성남시 관내 공중위생업소(숙박업·목욕업·이용업·미용업·세탁업·위생관리용역 등)를 업소 한 곳당 한 행으로 담은 CSV 파일로, 구별·업종명·업소명·도로명/지번 주소·데이터기준일자를 제공한다. 주민이나 창업 예정자가 "분당구에 미용업소·세탁업소가 몇 곳이고 어디에 있나"를 확인하거나, 분석가가 구별·업종별 공중위생업소 분포를 파악하는 데 쓴다. 전역 조인 키나 코드값이 없으므로 다른 데이터와는 도로명·지번 주소나 업소명을 매칭해 잇거나, 구 이름 기준으로 집계해 붙여야 한다.
description_portal: 성남시 공중위생업 현황 자료는 성남시 관내에서 운영 중인 공중위생 관련 업소들의 정보를 제공하는 자료입니다. 숙박업, 목욕업, 이용업, 세탁업, 위생관리용역,공중이용시설, 미용업 등의 업종이 포함되어 있으며 각 업소들의 업종명, 업소명, 소재지 주소 등을 제공합니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다. 해당 자료는 위생관리 수준 파악과 정책 수립의 기초자료로 활용 할 수 있습니다.
