description_portal: "본 데이터는 경기도 안성시에서 지정한 환경 플러스 안심식당의 현황을 제공하는 공공데이터이다. 안심식당은 위생적인 수저관리, 종사자 마스크 착용, 덜어먹는 용기 제공 등 3대 이행과제 중 하나 이상을 준수하고, 매장 내 일회용기 사용을 지양하거나 다회용기를 활용하여 배달·포장 서비스를 제공하는 음식점을 말한다. 본 데이터에는 업소명, 소재지 주소, 전화번호, 업종, 지정일자, 관리부서 등 기본 정보가 포함되며, 시민과 방문객이 안심하고 이용할 수 있는 친환경·위생 우수 음식점을 손쉽게 찾을 수 있도록 구성되어 있다. 이용자는 해당 자료를 통해 거주지 주변 또는 방문 예정 지역의 안심식당 위치와 연락처를 확인할 수 있고, 외식 시 위생과 환경을 동시에 고려한 선택을 하는 데 참고자료로 활용할 수 있다. 또한 안성시와 관련 부서는 이 데이터를 기반으로 안심식당 지정 현황을 관리하고, 일회용기 사용 저감 및 친환경 소비 확산 정책의 효과를 점검하며, 필요 시 홍보 및 지도·점검 계획을 수립하는 데 활용한다. 아울러 연구자와 민간기관은 본 데이터를 활용하여 지역 내 친환경 외식문화 확산 수준과 시민 인식 변화를 분석하는 등 지속가능한 식생활 환경 조성에 관한 기초자료로 사용할 수 있는 유용한 행정 데이터이다.\uFEFF"
