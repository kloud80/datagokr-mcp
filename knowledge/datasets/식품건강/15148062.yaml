summary_user: 서울 구로구의 유흥주점영업 인허가 업소를 사업장 단위로 한 건씩 담은 원장으로, 인허가일자·영업상태·폐업일자·사업장명·지번/도로명 주소·좌표·시설면적 등을 기록한다. 구로구에서 영업 중이거나 폐업한 유흥주점이 어디에 몇 곳 있는지 확인하려는 주민, 상권 분석가, 위생·인허가 담당자가 쓴다. 전역 조인 키는 없어서 주소·좌표나 관리번호(MGTNO)·사업장명으로 다른 식품 인허가 업소 데이터나 지도와 맞춰 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 유흥주점영업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 유흥주점 시설의 업태구분, 면적, 위생 관리 사항 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 유흥업 관리, 정책 수립, 연구 분석, 민원 처리 등 다양한 분야에 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계하여 활용할 수 있어 행정 투명성과 지역사회 정보 접근성을 높이는 기반 자료로 기능한다. 데이터 항목이 표준화되어 비교와 통계 작성이 용이하며, 허가 변경 이력과 상태 값이 포함되어 지도와 점검에도 유용하다.
