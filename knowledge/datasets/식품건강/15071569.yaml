description_portal: 서울시 세탁업 인허가 정보는 서울시 내 세탁소·코인세탁방 등 세탁 관련 업소의 인허가 및 영업 현황을 보여주는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자, 영업상태·상세영업상태를 통해 각 세탁업소가 현재 영업 중인지, 휴업·폐업 상태인지 등 행정 이력을 파악할 수 있습니다. 사업장명, 전화번호, 지번·도로명주소, 우편번호, 좌표정보, 업태구분명, 위생업태명은 세탁업소의 위치, 업종 유형, 위생 관련 분류를 확인하는 핵심 항목입니다. 건물 지상·지하층수와 실제 사용 층(시작·끝 지상/지하층) 정보는 세탁업소가 건물 내 어느 범위 층을 사용하는지와 규모를 보여 주며, 세탁기수와 회수건조수는 세탁·건조 설비 규모를 나타내어 처리 능력과 업소 규모를 추정하는 데 유용합니다. 건물소유구분명은 자가·임대 등 운영 형태를 파악하는 데 쓰이고, 여성·남성 종사자수는 인력 규모와 성별 구성 분석에 활용됩니다. 조건부허가 사유 및 기간은 조건부로 허가된 업소를 식별하는 정보이며, 다중이용업소여부는 화재·안전 관련 규제 대상 여부를 판단하는 데 중요한 항목으로, 전반적으로 세탁업 분포·규모·설비·인력·안전관리 현황을 파악하고 관련 정책 및 점검계획을 수립하는 데 활용 가능한 데이터입니다.
