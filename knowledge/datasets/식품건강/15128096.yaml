summary_user: 식품의약품안전처가 관리하는 전국 도축업 인허가 업소를 업소 한 곳당 한 건으로 담은 원장으로, 인허가번호·업소명·업종·허가일자·주소·관할 기관명·최종수정일시를 담는다. 축산물 유통 분석가나 사업자가 특정 지역에 허가된 도축장이 어디에 있고 언제 허가받았는지 확인하는 데 쓴다. 전역 조인 키는 없어 인허가번호(LCNS_NO)나 업소명·주소 매칭, 같은 기관 코드로 다른 축산물 인허가·행정처분 데이터와 잇는다.
description_portal: 식품의약품안전처에서 관리하는 도축업 인허가 정보에 대한 인허가번호, 업소명, 대표자명, 업종, 허가일자, 주소, 기관명, 최종수정일시에 대한 속성정보를 제공합니다.이 자료를 통하여 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 축산물 안전 분야의 정보 투명성 제고, 산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
