description_portal: 식품의약품안전처 “수입식품 이상치 자료 현황” OpenAPI는 수입식품의 이상치 데이터를 제공하는 공공데이터입니다. 제공 항목에는 품목코드(명), 국가명, 제조소명, 수단위, 이상치점수 등의 항목이 포함됩니다. 이 데이터를 통해 수입식품의 생산 국가와 제조소별 특성을 체계적으로 파악할 수 있으며, 이상치점수는 특정 품목이나 국가에서 발생하는 비정상적 패턴을 탐지하는 기초 자료로 활용될 수 있습니다. 또한 산업계와 연구기관은 국제 유통 구조와 위험 요인 분석, 품질 관리 정책 연구 등 넓은 차원의 활용 방안을 검토할 수 있습니다.
