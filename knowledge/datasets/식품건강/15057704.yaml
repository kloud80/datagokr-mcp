summary_user: 경기도 안의 건강기능식품 수입업체를 사업장 하나당 한 행으로 담은 인허가 원천 목록으로, 시군·사업장명·인허가일자·폐업일자·영업상태·지번/도로명 주소·위경도·종업원 수·면적·시설 규모 등을 포함한다. 수입유통 분석가나 사업자가 "경기도 어느 시군에 영업 중인 건강기능식품 수입업체가 몰려 있고, 최근 몇 년 사이 신규 인허가와 폐업이 어떻게 변했나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군명·시군코드(SIGUN_CD)나 사업장명·주소를 맞춰 다른 식품 인허가·수입식품 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 건강기능식품 수입업체의 인허가 현황을 주간 단위로 제공하며, 총 24개 항목으로 구성되어 있습니다. 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태, 소재지 주소(WGS84 위도·경도 포함), 종업원 수, 면적, 시설 규모, 건물소유형태, 급수시설구분, 위생업종 및 위생업태 등 건강기능식품의 수입을 전담하는 업체에 대한 정보를 포함합니다. 이 데이터는 건강기능식품 수입 유통 구조 파악, 인허가 이력 관리, 산업 현황 분석, 관련 정책 수립 등에 활용될 수 있습니다. 데이터는 Open API로 제공되며, 지방행정데이터개방시스템과 연동되어 있으나, 시스템 개편으로 인해 2018년 9월 이후 데이터 갱신이 일시 중단된 이력이 있습니다.
