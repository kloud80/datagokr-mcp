summary_user: 전라남도 담양군에 있는 이용·미용업소를 한 곳씩 담은 업소별 목록으로, 업종명·업소명·도로명 소재지·전화번호·데이터기준일자를 담는다(csv 약 7KB 규모). 주민이나 창업자가 '담양군 어느 읍면에 미용실·이발소가 몇 곳 있고 연락처가 무엇인가'를 확인하거나, 분석가가 군 단위 생활서비스 업소 분포를 볼 때 쓴다. 공통 조인 키가 없어 다른 시군구 이미용업 현황이나 공중위생업소 인허가 자료와는 업소명·도로명 주소를 맞춰 이어 쓴다.
limits: 사업자번호나 인허가번호 같은 전역 조인 키가 없어 다른 데이터와 연결하려면 업소명·주소 매칭에 기대야 한다. 범위가 담양군 한 곳뿐이라 광역·전국 비교에는 다른 시군구 자료를 따로 모아야 한다.
