summary_user: 서울 종로구 관내 단란주점영업소를 업소 단위로 담은 인허가 원장으로, 관리번호·인허가일자·폐업일자·영업상태·사업장명·지번/도로명 주소·좌표·시설 면적 등을 건별로 수록한다. 상권 분석가나 주민이 '종로구에서 현재 영업 중인 단란주점은 어디이고 언제 인허가되거나 폐업했나'를 확인하고 야간 상권·업소 수 변화를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 지자체 코드(OPNSFTEAMCODE)로만 이어 쓰며, 좌표(X·Y)로 지도 위 중첩 분석을 할 때는 좌표계 확인이 필요하다.
description_portal: 본 데이터는 서울특별시 종로구 관내 단란주점영업소에 대한 인허가 현황을 수록한 공공데이터입니다. 주요 항목으로는 지방자치단체 코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 단란주점 형태의 유흥업소 운영 실태를 행정적으로 관리하기 위한 정보를 제공합니다. 해당 자료는 유흥업 인허가 처리 이력, 폐업·휴업 여부, 업소 수 변화 등을 확인할 수 있어 지역 내 영업환경 분석, 위생·소방 안전관리 강화, 민원 대응 체계 개선 등에 활용됩니다. 또한 유흥업종의 합법적 관리, 유사업종과의 경계 설정, 야간 상권 운영계획 수립 등 공공안전 및 도시환경 유지 목적의 기초자료로서 활용 가치가 높습니다.
