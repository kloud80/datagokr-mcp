description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시에서 담배 판매 허가를 받고 현재 영업 중인 소매업소들의 상세 현황을 담고 있습니다. 슈퍼마켓, 편의점, 마트 등 담배를 판매하는 기호식품 소매업소의 정확한 위치와 지정 날짜를 포함하여, 지역 내 담배 소매 유통망의 전반적인 모습을 한눈에 파악할 수 있습니다. 이 데이터는 담배 판매업 관리·감독, 지역 상권 분석, 청소년 보호구역 설정 등 다양한 행정업무와 정책 수립에 실질적으로 활용될 수 있으며, 시민들에게는 담배 구매가 가능한 장소에 대한 정확하고 신뢰할 수 있는 정보를 제공합니다.2. 데이터 항목명업소명, 업소도로명주소, 지정일자3. 기대효과담배 소매업소에 대한 체계적인 관리를 통해 청소년 보호 정책을 더욱 강화하고 불법 판매를 사전에 예방할 수 있으며, 지역 상권 분석과 소상공인 지원 정책 수립을 위한 중요한 기초자료로 활용될 것으로 기대됩니다.
