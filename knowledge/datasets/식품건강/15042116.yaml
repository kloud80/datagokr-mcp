summary_user: 전주시 안의 세탁업소를 업소별로 한 줄씩 담은 인허가·영업 현황 원천 목록으로, 사업장명·인허가일자·영업상태·전화번호·도로명/지번 주소를 담는다. 시민이 "우리 동네에서 지금 영업 중인 세탁소는 어디인가"를 찾거나, 분석가가 인허가일자와 영업상태로 지역 세탁업 개·폐업 흐름을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업소명을 맞춰 잇거나, 같은 전주시의 다른 공중위생업소(목욕장·이미용업 등) 목록과 나란히 놓고 쓴다.
description_portal: '전북특별자치도 전주시 내 세탁업을 제공하며 업소명, 인허가일자, 영업상태명, 소재지전화번호, 도로명전체주소, 지번주소  등을 제공합니다.제공부서 : 환경위생과세탁업 데이터는 의류, 침구류 및 기타 섬유제품의 세탁 서비스를 제공하는 세탁업소의 인허가 및 운영 현황을 제공하는 데이터입니다. 시민의 생활편의 증진과 위생서비스 정보 제공, 지역 생활서비스 현황 분석 및 관련 정책 수립을 위한 기초자료로 활용됩니다.시민에게 정확한 세탁업소 정보를 제공하여 생활 편의 증진 ,  세탁업 영업현황 분석을 통한 지역경제 및 상권 활성화 지원, 공중위생업소의 효율적인 관리와 정책 수립 지원, 민간 서비스 개발 및 데이터 기반 창업 활성화에 활용가능합니다.'
