summary_user: 식품의약품안전평가원 독성정보제공시스템에 구축된 잠재적 위해우려 원료물질별로 물질정보(분자식·분자량·끓는점·용해도·용도·GHS 픽토그램 등), 요약, 인체영향·동물독성시험·독성동태·독성수치·응급치료 등 항목별 독성정보를 물질 단위로 담는 전국·비공간 API입니다. 원료나 화학물질의 독성·중독·발암성 정보, 노출 시 응급조치를 확인하려는 국민이나 식품·화장품 원료를 검토하는 사업자·연구자가 '이 원료 물질은 인체에 어떤 독성이 있고 노출되면 어떻게 대처하나'를 찾는 데 쓴다. 오퍼레이션끼리는 독성정보코드(TOXIC_CODE)로 묶이고, 다른 화학물질 DB와는 CAS 번호나 국문·영문 물질명으로 매핑해 잇지만, 포털 전역에서 공통으로 쓰는 조인 키는 실측에서 확인되지 않았다.
description_portal: 식품의약품안전처 식품의약품안전평가원에서 관리하는 식의약 등의 원료물질의 독성정보에 대한 데이터입니다. 독성정보제공시스템에 구축되어있는 각 잠재적 위해우려 원료의 독성정보, 중독정보, 발암성정보와 함께 각 원료의 물질정보, 요약정보, 인체영향정보, 동물독성시험정보, 독성동태정보, 독성수치정보, 응급치료정보와 각 문헌에 해당하는 참고문헌을 제공함으로써, 일반 국민 및 전문가들이 관련 최신의 국제적 수준의 신뢰성있는 독성정보를 쉽고 빠르게 파악하여, 활용할 수 있도록 지원합니다.
