summary_user: 식품에 쓰이는 원재료를 한 건씩 담은 전국 단위 기준 목록으로, 대분류·중분류, 대표 원재료명, 이명(별칭), 영문명, 학명, 사용 부위, 원재료 사용 상태, 사용 조건을 담는다. 식품 제조사나 제품 개발자가 "이 재료를 식품 원료로 쓸 수 있는가, 쓸 수 있다면 어떤 조건이 붙는가"를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 제품 단위 DB(품목제조보고·바코드·원재료 표시 정보 등)와는 원재료명이나 학명을 맞춰 매핑하는 방식으로만 이어 쓴다.
description_portal: 식품의약품안전처 「식품 원재료 정보」 OpenAPI는 식품에 사용되는 원재료의 기본 정보를 제공합니다. 제공 항목에는 원재료명, 원재료 코드는 물론 원재료의 분류, 기능성 여부 및 해당 원재료의 사용 가능 여부 등의 속성이 포함됩니다. 이 데이터는 식품 제조사와 유통업체가 사용하는 원재료의 정체성과 분류 체계를 정확히 이해하는 데 도움을 줍니다. 또한 개발자, 연구자 등은 원재료를 기준으로 식품 조합이나 제품 개발 시 어떤 재료를 사용할 수 있는지, 기능성 여부나 안전성 기준에 맞는 재료를 선택하는 데 활용할 수 있습니다. 소비자도 원재료 명칭과 기능성 여부를 살펴 제품 선택 시 참고자료로 사용할 수 있습니다.
