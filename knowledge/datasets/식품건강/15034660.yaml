summary_user: 서울 송파구 안에 있는 집단급식소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호를 제공한다. 송파구 주민이나 급식 관련 사업자가 "우리 동네에 어떤 집단급식소가 어디에 있나"를 확인하거나, 분석가가 구 단위 급식시설 분포를 볼 때 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
