summary_user: 인천광역시 미추홀구가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 상호명·도로명/지번 주소·전화번호·위도·경도를 포함한다. 주민이나 방문객이 '미추홀구에서 위생·서비스 평가를 거쳐 모범음식점으로 지정된 식당이 어디 있나'를 찾거나, 분석가가 지정 업소 분포를 지도에 올릴 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장 등 다른 데이터와는 상호명·주소를 맞추거나 좌표로 공간 결합하는 방식으로만 이어 쓴다.
limits: 업소 인허가번호가 없어 인허가 원장이나 행정처분 데이터와 키로 바로 조인되지 않고, 상호명·주소 매칭이 필요하다. 범위는 미추홀구 한 곳에 한정되며, 포털 설명상 모범음식점 선정 사업이 종료돼 새 지정 업소가 추가되지 않는다.
