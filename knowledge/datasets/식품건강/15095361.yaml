summary_user: 국가별로 관리되는 수입식품 품목정보를 담은 API로, 수입품목관리번호와 국가명, 품목명, 국가별 수입품목 관리코드명을 품목 단위로 제공하며 범위는 전국·비공간입니다. 수입업자나 분석가가 "특정 국가에서 들여오는 이 식품은 어떤 품목·관리코드로 분류되는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 수입신고·해외제조업소 등 다른 수입식품 데이터와는 국가명·품목명 같은 이름 매핑이나 식약처 내부 코드로만 연결한다.
limits: 전역 조인 키가 없어 다른 데이터와 붙일 때는 국가명·품목명 문자열 매칭에 의존해야 한다. 지역 단위 구분이 없는 전국·비공간 데이터라 지역별 분석에는 쓰지 못한다. 호출에는 포털 활용신청(자동승인) 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
