summary_user: 경기도 하남시가 지정한 안심식당을 업소 한 곳당 한 행으로 담은 파일로, 업소명·지정일자·소재지주소·우편번호를 제공합니다. 하남시 주민이나 방문객이 '덕풍동·미사동 근처에서 덜어먹기와 위생적 수저 관리를 지키는 식당이 어디인가'를 찾을 때 쓰고, 분석가는 지정 시기와 동별 분포를 살필 때 씁니다. 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 업소 원장이나 다른 위생 지정 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 씁니다.
description_portal: '경기도 하남시 안심식당 지정 현황에 대한 데이터로 업소명, 안심식당 지정일, 소재지주소, 우편번호 등의 항목을 제공합니다.이 데이터는 지정일자와 소재지, 업소명 등의 정보를 통해 하남시 내 지정된 안심식당들의 현황을 파악할 수 있습니다.  2026년 5월 26일을 기준으로 정리되어 있으며, 각 업소는 다양한 지역(덕풍동, 미사동, 광암동 등)에 분포하고 있습니다. 이러한 정보는 하남시의 위생관리 및 음식문화 개선 정책 수립에 활용될 수 있으며, 시민들에게는 위생적으로 믿을 수 있는 식당을 선택하는 참고자료로 제공됩니다.※ 안심식당:  누구나 안심하고 먹을 수 있는 식당으로 음식 덜어먹기, 위생적 수저 관리에 철저한 식당'
