summary_user: 수입식품업을 하다 폐업한 업체를 업소 한 곳당 한 건으로 담으며, 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업상태·소재지 주소·관할 기관명을 전국 범위로 제공한다. 거래 상대 수입업체가 이미 폐업했는지 확인하려는 사업자나, 지역·업종별 폐업 추세로 수입식품 공급망 변화를 보려는 분석가가 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 다른 식품 인허가·수입식품 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 매칭으로 이어 쓴다.
description_portal: 식품의약품안전처 「수입식품업 폐업정보」 OpenAPI는 수입식품업을 운영하다 폐업한 업체의 관련 정보를 제공합니다. 제공항목에는 인허가번호, 업소명, 대표자명, 업종, 허가일자, 폐업일자, 폐업상태, 주소, 기관명 등이 포함되어 있습니다. 이 데이터를 통해 사용자는 어느 업체가 어느 시점에 폐업했는지, 그 업체의 인허가번호 및 업종 정보, 폐업 상태와 위치 등을 객관적으로 확인할 수 있습니다. 또한 사용자는 폐업업체의 분포 및 빈도를 분석해 공급망 변화, 수입식품 산업의 구조적 변동 또는 특정 지역의 폐업 추세 등을 파악하는 기초자료로 활용할 수 있습니다.수입식품업체들의 폐업정보로, 인허가번호 , 업소명 , 대표자명 , 업종 , 허가일자 , 폐업일자 , 페업상태 , 주소 , 기관명 등의 정보를 제공합니다.
