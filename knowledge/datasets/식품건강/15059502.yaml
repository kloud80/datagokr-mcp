summary_user: 경기도 31개 시군의 뷔페식 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태·종업원 수·시설규모와 정제된 지번·도로명 주소, WGS84 좌표가 들어 있다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 고기·한식·호텔 뷔페가 어디에 몇 곳 있고 최근 폐업은 얼마나 되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없으므로 시군명·시군코드(SIGUN_CD)나 주소·좌표 기준으로 다른 경기도 데이터나 인구·상권 데이터와 맞춰 붙인다.
description_portal: 이 데이터는 경기도 내 다양한 음식을 고정된 장소에 배열해 손님이 자유롭게 선택할 수 있도록 제공하는 뷔페식 일반음식점의 인허가 및 영업현황 정보를 담고 있습니다. 항목에는 사업장명, 인허가일자, 폐업일자, 영업상태, 위생업종명, 위생업태명, 급수시설구분, 종업원 수, 다중이용업소 여부, 소재지 주소정보(WGS84 위도·경도 포함), 총시설규모 등이 포함됩니다. 해당 데이터는 고기뷔페, 한식뷔페, 호텔뷔페 등 다양한 유형의 뷔페 운영 실태 분석, 지역 상권 활성화 계획 수립, 위생관리 강화 등의 목적에 활용될 수 있으며, 경기도 31개 시군 전체를 대상으로 수집되어 Open API를 통해 실시간 연계도 가능합니다.
