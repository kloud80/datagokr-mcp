summary_user: 남원시 안의 학교·병원·어린이집·복지시설 등이 운영하는 단체급식소를 한 곳씩 담은 목록으로, 시군구·구분·업소명·사업장 주소를 담은 작은 CSV 파일(약 12.7KB)이다. 남원시에서 어떤 유형의 기관이 단체급식소를 운영하는지, 식재료 납품이나 위생 점검 대상을 어디서 찾을지 파악하려는 급식 관련 사업자나 행정 담당자가 쓴다. 인허가번호 같은 전역 조인 키가 없어서 다른 식품 인허가·위생 데이터와는 업소명이나 사업장 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '1. 데이터 주요 내용 및 활용 맥락본 데이터는 전북특별자치도 남원시 내 단체급식소의 현황 정보를 체계적으로 정리한 자료입니다. 학교, 병원, 어린이집, 복지시설, 공공기관 등 다양한 유형의 기관에서 운영하는 단체급식소의 위치와 기본 정보를 포함하고 있어, 식품위생 관리, 급식 품질 향상, 지역 먹거리 안전망 구축을 위한 정책 수립과 행정업무에 중요한 자료로 활용될 수 있습니다. 또한 급식 관련 사업자, 연구기관, 시민들이 남원시 급식 현황을 쉽게 파악하고 관련 서비스를 기획하는 데 유용한 기초자료로 활용할 수 있습니다.2. 데이터 항목명: 시군구, 구분, 구분2, 업소명, 사업장 주소3. 기대 효과지역 내 단체급식소 현황을 투명하게 공개함으로써 식품안전 관리체계를 더욱 강화하고, 급식 품질 개선을 위한 정책 수립의 중요한 토대를 마련할 수 있습니다. 시민들의 알 권리를 충족시키는 동시에 급식 관련 산업 발전과 지역 먹거리 생태계 활성화에 실질적으로 기여할 것으로 기대됩니다.'
