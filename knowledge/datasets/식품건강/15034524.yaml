summary_user: 서울 성동구 안 집단급식소를 업소 한 곳당 한 행으로 담은 파일 목록으로, 업소명·도로명주소·지번주소·영업장 면적·운영형태가 들어 있다(약 23KB CSV). 구청 위생 담당자나 연구자가 '성동구 집단급식소는 어디에 몰려 있고 규모와 운영 방식은 어떤가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 식품 인허가·위생 데이터와는 업소명이나 주소를 맞춰서만 이을 수 있다.
description_portal: 서울특별시 성동구 집단급식소 현황 데이터는 구 내 집단급식소의 업소명, 도로명주소, 지번주소, 영업장 면적, 운영 형태 등의 정보를 포함한 공공데이터입니다. 본 자료는 학교, 회사, 관공서 등 다수 인원이 이용하는 급식시설의 위치와 규모를 쉽게 확인할 수 있도록 지원하며, 위생 관리와 안전한 급식 환경 조성에 기여합니다. 도로명주소와 지번주소 정보는 시설 접근성과 위치 확인에 편리하며, 영업장 면적과 운영 형태 정보는 시설 규모와 유형을 파악하고, 인원 수용능력, 관리 체계, 안전 점검 등 분석에 활용할 수 있습니다. 행정기관과 연구자는 이를 통해 집단급식소 분포, 위생 관리 현황, 정책 수립 등을 검토할 수 있으며, 민간에서는 위치 기반 서비스, 지도 앱, 식단 관리 플랫폼 등과 연계하여 편의성을 높일 수 있습니다. 성동구 내 집단급식소 현황 데이터는 주민 생활과 공공 위생 관리에 중요한 기초 자료입니다.
