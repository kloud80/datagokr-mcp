summary_user: 완제품 식품을 소분·포장하는 식품소분업 업소의 인허가 원장으로, 업소 한 곳을 한 행으로 담으며 전국 57,942건에 인허가일자·영업상태·사업장명·주소·좌표가 들어 있다. 상권 분석가나 식품 사업자가 특정 지역에 영업 중인 소분업 업소가 어디에 몇 곳 있는지 파악하는 데 쓴다. 지번주소·도로명주소(address)와 관리번호(pnu 키로 잡힌 MNG_NO)로 다른 인허가·위생 데이터와 이어 쓰고, 좌표(Bessel 중부원점TM)로 지도 데이터와 겹쳐 본다.
description_portal: '식품_식품소분업 데이터는 완제품 형태의 식품을 별도로 소분하여 포장하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 식품소분업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 식품안전정책과 / 043-719-2032 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
services:
  - op: /info
    name: 식품_식품소분업 데이터 조회
    endpoint: https://apis.data.go.kr/1741000/food_repackagers/info
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[LCPMT_YMD::GTE]
        required: false
        desc: 인허가일자 이상의 값(YYYYMMDD)
      - name: cond[LCPMT_YMD::LT]
        required: false
        desc: 인허가일자 미만의 값(YYYYMMDD)
      - name: cond[SALS_STTS_CD::EQ]
        required: false
        desc: 영업상태코드 와 일치하는 값
      - name: cond[BPLC_NM::LIKE]
        required: false
        desc: 사업장명 을(를) 포함하는 값
      - name: cond[ROAD_NM_ADDR::LIKE]
        required: false
        desc: 도로명주소 을(를) 포함하는 값
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
