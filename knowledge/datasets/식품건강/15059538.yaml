summary_user: 경기도 31개 시군의 패스트푸드형 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태·면적·종업원 수와 도로명·지번 주소, WGS84 좌표를 포함한다. 창업 예정자나 상권 분석가가 '특정 시군에서 영업 중인 패스트푸드점이 몇 곳이고 어디에 몰려 있는가'를 확인하거나, 최근 개업·폐업 흐름을 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD), 주소·우편번호, 좌표로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 패스트푸드 형태의 일반음식점에 대한 인허가 및 운영 현황을 담고 있습니다. 주요 항목은 사업장명, 인허가일자, 폐업일자, 영업상태, 소재지면적, 급수시설구분, 종업원 수, 총시설규모, 위생업종명, 위생업태명, 위치정보(WGS84 위도·경도, 도로명 주소, 지번 주소) 등으로 구성되어 있습니다. 다중이용업소 여부나 급수시설 등의 항목은 위생 및 안전관리 측면에서 활용이 가능하며, 전체 데이터는 경기도 31개 시군을 대상으로 수집됩니다. 외식산업 현황 분석, 브랜드 점포 분포 파악, 상권 분석, 정책 수립 등에 활용될 수 있습니다. 데이터는 Open API로도 제공되어 시스템 연계를 통한 실시간 데이터 접근이 가능합니다.
