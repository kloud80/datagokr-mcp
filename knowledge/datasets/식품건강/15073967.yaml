description_portal: '-해외제조업소의 식품 수출입 관리 및 안전성 확보를 위해 필요한 다양한 정보를 포함하고 있습니다.-제공 데이터는 각 해외제조업소의 고유 코드, 명칭, 주소, 영업 구분(예: 제조, 가공, 보관 등)과 같은 기본 정보는 물론, 업소가 속한 국가와 지역 정보도 기록됩니다. 식품 안전과 관련해서는 해당 업소의 식품안전관리시스템 인증 여부 및 인증명, 인증기관과 인증·만료일시 등 인증 관련 기록이 포함되어, 제조업소의 신뢰성과 안전성을 객관적으로 확인할 수 있도록 합니다. 추가로, 업소의 영업 취소나 취하 이력(취하여부, 취하일시, 취소중단 등)과 같은 변동 이력도 제공됩니다.'
