summary_user: 해외제조업소별로 고유 코드, 업소명, 주소, 영업 구분, 소속 국가·지역, 식품안전관리 인증 여부와 인증기관·인증·만료일, 영업 취소·취하 이력을 한 행씩 담는 건별 원천 데이터이며, 검증 호출 때 API가 알린 전체 건수와 실제 받은 행은 모두 2건이었습니다. 수입업자나 분석가가 "이 식품을 만든 해외 공장이 식품안전 인증을 받았는지, 인증이 아직 유효한지, 등록이 취하되지는 않았는지"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 수입신고·수입업체 등 다른 수입식품 데이터와는 업소명·업소 코드를 맞추거나 같은 기관(식약처) 코드 기준으로만 이어 쓴다.
limits: 검증 호출에서는 전체 건수가 2건으로만 나와, 전체 해외제조업소 규모를 이 결과로 판단하지 말고 실제 호출 조건과 함께 확인해야 합니다. 공통 조인 키가 없어 다른 데이터와 붙일 때는 업소명·코드 매칭 오류를 따로 점검해야 합니다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한됩니다.
