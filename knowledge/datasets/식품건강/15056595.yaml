summary_user: 부산시가 운영하는 엄궁·반여 농산물도매시장에서 출하·유통된 농산물을 대상으로 한 잔류농약 검사 결과를 검체 건별로 담으며, 검체명·품목·분류·검출농약(detn_pstc)·검출농도·판정 등이 들어 있다. 시민이나 분석가가 특정 채소·과일에서 어떤 농약이 얼마나 검출됐고 기준에 맞았는지(부적합 여부)를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품안전 데이터와는 품목명·농약명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 부산광역시_농산물 잔류농약검사 데이터를 개방합니다.부산시에서 운영하는 엄궁, 반여 농산물도매시장에서 출하하여 시중에 유통하는 농산물에 대해 잔류검사한 결과 데이터입니다. 농산물 잔류농약 이란 병충해로부터 농작물을 지키기 위하여 사용한 농약이 농작물 또는 이를 원료로 사용한 식품 중에 남아있는 것을 말한다. 잔류농약은 농약의 성분, 사용시기, 사용량 등에 따라 남아있는 정도가 다르고 대부분의 식품에선 조리와 가공과정을 거치면서 감소해 인체에 유해할 정도로 남아있는 경우가 드뭅니다. 개방되는 데이터에는 검체명, 품목, 분류, 검출농약, 검출농도, 판정 등의 데이터가 제공됩니다.
