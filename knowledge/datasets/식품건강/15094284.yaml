summary_user: 서울 서초구 안에서 자동판매기로 식품을 파는 영업소의 인허가 원장으로, 업소 한 곳당 한 행에 업체명·인허가일·영업상태·폐업일·주소·좌표·면적·종사자수를 담는다. 시민이나 상권 분석가가 '서초구 어디에 식품자판기 영업이 신고돼 있고 지금도 영업 중인가'를 확인하거나, 지도·감독 대상 업소 목록을 뽑는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 관리번호(MGTNO)·업체명·주소를 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로 이어야 하며, 좌표(X·Y)는 지도 위 중첩에 쓴다.
description_portal: 서울특별시 서초구에서 관리하는 식품자동판매기업의 인허가 현황을 체계적으로 제공하는 자료이다. 해당 업종은 자동판매기를 통해 식품을 판매하는 영업으로서 사업장의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등 포함한다. 이를 통해 지역 내 식품 안전 확보를 위한 기초 자료로 활용될 수 있다. 아울러 영업자와 시민이 자동판매기 식품 유통의 안전성을 확인할 수 있도록 정보 접근성을 높였으며, 행정기관의 민원 처리, 지도·감독 업무의 효율성 향상에도 기여한다. 본 데이터는 관련 법령 개정과 현장 관리 결과를 반영하여 주기적으로 갱신되며, 이용자는 이를 통해 지역 사회의 식품 판매 환경과 위생관리 수준을 명확하게 파악할 수 있다.
