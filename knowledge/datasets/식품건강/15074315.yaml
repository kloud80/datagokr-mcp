summary_user: '건강기능식품 생산실적보고 대상 품목별로 업소명, 품목명, 품목구분·유형, 인허가번호, 보고년도, 품목제조보고번호, 연간생산능력(KG)과 생산량(KG)을 담은 전국 단위 품목·연도별 보고 자료다. 사업자나 분석가가 특정 건강기능식품 유형(예: 홍삼, 프로바이오틱스)의 연도별 생산량과 주요 생산 업소를 파악하는 데 쓴다. 품목제조보고번호(PRDLST_REPORT_NO)로 다른 식품 품목 DB와 제품 단위로, 인허가번호(LCNS_NO)로 식품 인허가 업소·행정처분 자료와 연결하되, 실측상 전역 조인 키는 확인되지 않아 이름·코드 매핑이나 같은 기관 코드로 잇는다.'
description_portal: 건강기능식품 생산실적보고 대상 업소명, 품목명, 품목구분, 품목유형, 인허가번호, 보고년도, 품목제조보고번호, 연간생산능력(KG), 생산량(KG) 등 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
