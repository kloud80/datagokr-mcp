summary_user: 식품 품목(PRDLST_NM)별로 시험항목(유해물질)의 기준·규격값을 최소·최대값, 단위, 판정 구분, 유효 시작·종료일과 함께 담는 전국 단위의 비공간 기준 목록입니다. 식품 제조사나 연구자가 '이 품목에서 특정 중금속·잔류물질의 허용 최대치는 얼마이고 언제부터 적용되나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 품목명·시험항목명 같은 이름 매핑으로만 같은 기관의 품목제조보고·부적합·회수 정보 등과 이어 쓴다.
description_portal: 해당 데이터는 식품 내 유해물질에 대한 기준 및 규격 정보를 제공합니다. 해당 데이터를 통해 소비자가 구매하고자 하는 식품의 안전성 여부를 직접 확인하고, 특정 유해물질에 대한 노출 위험을 평가하거나, 식품 관련 연구기관에서 유해물질 분석 및 독성 평가를 위한 기초 자료로 활용하고, 식품 제조 기업이 제품 개발 단계에서부터 안전한 원료를 선정하고 품질 관리 계획을 수립하는 등의 효과를 기대할 수 있습니다.이를 통해 소비자는 식품 선택 시 안전성을 고려한 합리적인 결정을 내릴 수 있으며, 연구기관은 보다 정확하고 신뢰성 있는 연구를 수행할 수 있고, 기업은 안전한 식품 생산을 통해 소비자의 신뢰를 확보하고 경쟁력을 강화하는 데에 기여할 수 있습니다.
