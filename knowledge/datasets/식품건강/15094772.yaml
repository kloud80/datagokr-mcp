summary_user: 식품의약품안전처가 국내에서 허가한 코로나19 진단시약을 품목(허가번호) 단위로 한 건씩 담은 목록으로, 품목명·품목분류번호와 등급·허가일자·수출용 한정 여부·취소취하 구분과 일자·제품명과 모델명·업체명과 주소·사용목적을 포함하며 범위는 전국이다. 의료기관 구매 담당자나 수출업체가 '이 진단키트가 국내 허가를 받았고 지금도 유효한가, 수출용으로만 허가됐는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 품목허가번호(MEDDEV_ITEM_NO)·업체명·사업자등록번호 같은 값을 이름이나 코드로 직접 맞춰 이어야 한다.
limits: 다른 데이터셋과 공통으로 쓰는 조인 키가 없어 연계하려면 이름이나 코드를 직접 매핑해야 한다. 포털 활용신청은 자동승인되며 serviceKey가 필요하고, 개발계정은 하루 10,000회까지 호출된다.
