description_portal: 이 공공데이터는 식품의약품안전처에서 관리하는 코로나19 진단시약 국내 허가 제품현황 정보입니다.   이 공공데이터는 품목명과 품목허가번호를 통해 각 진단시약을 정확히 식별하며 품목분류번호와 등급으로 제품의 분류 체계를 제공합니다. 품목허가일자와 수출용에한함 여부는 제품의 허가 상태와 사용 범위를 명확히 보여주며 취소취하 구분과 일자로 현재 유효한 제품을 구분할 수 있습니다. 제품명, 모델명으로 구체적인 제품을 특정할 수 있습니다 업종구분 업체명 업허가번호 업허가일자 업체주소 사용목적 등의 상세 정보를 제공합니다.
