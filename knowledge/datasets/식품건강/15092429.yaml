summary_user: 경기도 의왕시에서 담배소매인으로 지정된 업소를 한 건씩 담은 파일로, 업소명·민원 구분·도로명 주소·지정일자를 업소 단위로 기록한다. 시민이 "우리 동네에서 담배를 파는 곳은 어디인가"를 확인하거나, 분석가가 관내 담배 소매점의 지역별 분포와 지정 시점 추이를 살피는 데 쓴다. 전역 조인 키나 인허가번호가 없어, 다른 데이터와는 업소명·도로명 주소를 맞춰 보거나 같은 기관(의왕시) 기준으로만 이을 수 있다.
description_portal: 이 데이터는 의왕시에서 담배를 판매할 수 있는 소매업소의 지정 현황을 정리한 자료입니다. 각 업소에 대한 연번, 민원 구분, 상호명, 도로명 주소, 그리고 지정일자가 포함되어 있어 업소의 담배소매업 영업 개시 시점과 행정 절차 이력을 확인할 수 있습니다. 이를 통해 관내 담배 소매업의 유통 구조나 지역별 분포 현황을 파악하는 데 유용하며, 신규 지정 여부나 민원 유형 등을 분석해 정책 수립 자료로 활용할 수 있습니다. 일반 시민은 지역 내 담배 판매처를 확인할 수 있고, 관련 기관은 소매점의 지정 변동 내역이나 운영 현황을 관리하는 데 활용할 수 있습니다. 유통 관리와 영업 허가의 투명성을 높이는 데 기여하는 공공데이터입니다.
