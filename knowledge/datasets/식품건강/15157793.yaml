summary_user: 경상북도 영천시에서 군장병에게 할인을 제공하는 업소를 업소 1곳당 1건으로 담은 목록으로, 상호·주소·전화번호만 들어 있고 범위는 영천시 한 곳입니다. 휴가·외출 나온 장병이나 가족이 '영천에서 군인 할인을 해 주는 식당·가게가 어디인가'를 찾을 때, 또는 지자체·분석가가 장병 할인업소의 지역 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 업소 데이터와는 상호·주소 문자열을 맞춰야만 이어 쓸 수 있다.
limits: 조인 키가 없어 다른 업소 원장과의 연결은 상호·주소 매칭에 의존하며, 영천시 밖의 업소는 담지 않는다. 할인율·할인 조건이나 업종 구분 필드는 없고, 개인 휴대전화를 쓰는 업소는 전화번호가 공란이다.
