summary_user: 경기도 31개 시군의 과자류 판매 휴게음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·폐업일·영업상태, 면적·종업원 수, 도로명·지번 주소와 WGS84 좌표가 들어 있다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 과자점이 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 식품 인허가 데이터, 상권·인구 데이터와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 과자류를 판매하는 휴게음식점 현황을 담고 있으며, 음주행위가 허용되지 않는 업소를 대상으로 한 인허가 기반 자료입니다. 데이터에는 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태명, 위생업종 및 위생업태명, 다중이용업소 여부, 등급구분명, 급수시설 구분, 소재지 면적, 총시설 규모, 남녀 종사자 수, 총종업원 수, 영업장 주변 환경, 도로명 및 지번 주소, 우편번호, WGS84 좌표(위도·경도) 등의 항목이 포함됩니다. 이 자료는 경기도 31개 시군 전체를 대상으로 하며, 과자류 중심의 휴게음식점 분포 파악, 지역별 영업 특성 분석, 관광 및 생활 편의 시설 연구, 안전·위생 관리 정책 수립에 활용할 수 있습니다. 단, 본 데이터는 인허가 현황 중심이므로 실제 영업 중인 업소와는 차이가 있을 수 있습니다.
