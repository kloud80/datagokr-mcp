summary_user: 식품이력추적관리 대상 제품의 생산 LOT별로 투입된 원부자재 정보를 원자재 한 건 단위로 담으며, 원부자재명(국문·영문), 표준 원부자재 코드, GMO 여부, 제조일자, 제품 LOT 번호, 식품이력추적관리번호 등을 포함하고 범위는 전국이다. 회수·유통차단 담당자나 분석가가 특정 제품 LOT에 어떤 원재료가 쓰였고 GMO 원료가 포함됐는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관 데이터와는 업체코드(ENTP_CD)나 식품이력추적관리번호 같은 기관 내부 코드 또는 원재료명 매핑으로만 연결한다.
description_portal: 식품의약품안전처에서는 안전한 식품선택을 위한 소비자의 알 권리를 보장하고, 식품의 안전성 확보를 위한 신속한 유통차단과 회수조치를 위해제조·가공단계부터 판매단계까지 각 단계별로 이력추적정보를 기록·관리하여 정보를 제공하고 있습니다.해당데이터는 제품LOT,원자재정보에 대한 표준 GMO 여부,표준 원부자재 번호,표준 원자재번호,업체코드,식품이력 추적 관리번호,제조일자,재품생상 LOT 번호  수입식품의 경우 제조일,제품제조 일련번호,표준 원부자제 코드,순번,원자재에 대한 일련번호,원부자재명,GMO 여부,비고,사용여부,원자재명 영문에 대한 속성정보 등식품 원자재에 대해 공개된 세부 정보를 확인할 수 있습니다.
