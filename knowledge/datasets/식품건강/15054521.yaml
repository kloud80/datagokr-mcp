description_portal: 식품접객업, 식품제조업 및 식품판매업소의 기본 현황 정보를 정리한 자료로, 업소 명칭, 위치, 업종 유형 등 식품위생 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 식품 관련 업소의 분포 현황과 관리 대상 업소의 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 식품접객·제조·판매업소 현황에 대한 체계적인 관리를 통해 식품 위생 관리 실태를 분석하고, 식품 안전 확보 및 위생 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 식품 관련 업소에 대한 행정 관리, 지도·점검 및 민원 대응 업무 수행과 함께 관련 통계 산출 및 위생 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 식품 안전사고 예방과 위생 수준 향상을 위한 관리 체계를 강화하고, 안전한 식품 유통 환경 조성과 국민 건강 보호를 위한 정책 추진의 기초자료로 활용되며, 지속적인 식품 위생 행정 업무 수행을 지원하는 행정자료로 활용된다.
