summary_user: 경기도에 등록된 용기·포장지 제조업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자·주소·좌표·종사자 수·시설 규모 등을 포함한다. 포장재 업계 분석가나 사업자가 '우리 시군에서 영업 중인 식품 용기 제조업체는 어디에 몇 곳 있는가'처럼 지역별 분포와 영업 여부를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·주소·사업장명 매칭이나 위경도 좌표로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 경기도에 등록된 용기 및 포장지 제조업체의 인허가 현황을 수록한 자료로, 음식물 포장용기를 포함한 다양한 제품 생산시설의 지역별 분포와 특성을 파악할 수 있도록 구성되어 있습니다. 시군명, 사업장명, 인허가일자, 영업상태, 주소, 위생업태, 종사자 수, 건물소유구분, 시설총규모, 설비정보 등 총 42개 항목을 포함하고 있으며, 업태구분이나 위생업태 등도 함께 제공됩니다. 식품 산업, 포장재 산업, 공정안전 분야의 현황 분석 및 제조업체의 위치 기반 데이터 수요에 활용될 수 있으며, Open API를 통해 접근 가능합니다.
