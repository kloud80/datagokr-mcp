summary_user: 경기도 31개 시군의 휴게음식점·일반음식점·제과점·위탁급식 등 식품접객업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·업종·인허가일자·영업상태·폐업일자·면적과 도로명/지번 주소·위경도 좌표를 포함한다. 상권 분석가나 창업 예정자가 '이 동네에 영업 중인 음식점이 몇 곳이고 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명, 주소·우편번호, 좌표를 기준으로 다른 지역 통계나 위생·행정처분 데이터와 이름·위치 매칭으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군에 소재한 식품접객업소의 현황을 나타내며, 행정안전부에서 수시로 제공하는 인허가 기반 공공데이터입니다. 데이터는 식품위생법 시행령에 따라 등록된 업종 중 휴게음식점, 일반음식점, 제과점, 위탁급식영업 등을 포함하며, 각 업소의 사업장명, 업종명, 소재지 주소(도로명 및 지번), 위도 및 경도 정보, 인허가일자, 영업상태, 폐업일자, 면적, 시설 규모 등의 세부 항목을 포함하고 있습니다. 본 데이터는 식품안전 정책 수립, 지역 경제 분석, 상권분석 등 다양한 행정 및 민간 분석 목적으로 활용 가능하며, Open API를 통해 인증키 사용 시 조건 없이 호출할 수 있도록 제공됩니다. 데이터는 XML 또는 JSON 형식으로 요청 가능하며, 활용 시 각 항목의 정의 및 구조에 대한 이해가 필요합니다.
