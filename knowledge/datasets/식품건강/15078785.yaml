summary_user: 충청북도 식의약안전과가 관리하는 식품 접객업소(제조업제)의 위생등급 평가결과를 업소 한 곳당 한 건으로 담으며, 업소명·시도·시군구·주소·주요 생산품목·평가 점수·평가 등급이 들어 있다. 소비자가 충북 시군의 어느 업소가 높은 위생등급을 받았는지 확인하거나, 행정·분석가가 시군별 위생 점수 분포를 비교해 점검 대상을 고를 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장이나 행정처분 데이터와는 업소명·주소 문자열 매칭으로만 이어 쓴다.
description_portal: 충청북도 식의약안전과에서 관리하는 식품 접객업소(제조업제)의 위생등급 평가결과를 업소 명, 시도·시군구, 주소, 주요 생산품목, 평가 점수, 평가 등급 기준으로 조회할 수 있는 Open API로, 각 업소의 위생 수준을 정량적으로 확인할 수 있습니다. 제공되는 데이터는 업소별 위생관리 상태를 직접적으로 보여주는 핵심 지표로서, 식품 안전 확보와 소비자 보호를 위한 현장 기반 의사결정에 중요한 근거자료로 활용됩니다. 행정기관은 이를 활용해 위생 취약 업소에 대한 점검 강화, 등급 기준 충족 여부 검토, 시설 개선 유도, 지역별 위생환경 관리 전략 수립 등을 수행할 수 있으며, 민간·연구 분야에서는 식품안전 수준 비교, 위생 등급 기반 지도 서비스 개발, 소비자 선택정보 제공 등 다양한 형태의 활용이 가능합니다.
