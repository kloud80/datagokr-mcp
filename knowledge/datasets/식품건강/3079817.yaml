summary_user: 익산시에 있는 유흥주점·단란주점을 업소 한 곳당 한 행으로 담은 인허가 현황 파일(csv)로, 업종명·인허가일자·업소명·도로명/지번 주소·영업장면적·전화번호를 담는다. 주민이나 상권 분석가가 '우리 동네 주변에 유흥·단란주점이 몇 곳 있고 언제 허가받았나'를 확인하거나, 행정 담당자가 위생·안전 점검 대상을 추릴 때 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표)가 없어서 다른 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 본 데이터는 익산시 내 유흥단란주점에 관한 현황을 체계적으로 정리한 자료이다. 유흥단란주점은 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로, 지역 내 상업 활동과 문화 환경에 영향을 미치는 시설이다. 해당 자료에는 익산시의 업종명, 인허가일자, 업소명, 도로명주소, 지번주소, 면적, 전화번호 등의 정보가 포함되어 있으며, 이를 통해 행정 관리와 위생, 안전 점검 등에 활용될 수 있다. 또한, 해당파일은 공공데이터포털에 csv파일로 업로드되어 활용하기 용이하며 주기적인 갱신을 통해 최신 정보를 반영하고 있다.
