summary_user: 전북특별자치도 정읍시의 한약 도매업소를 업소 한 곳당 한 행으로 담은 건별 목록이며, 업소명·도로명 소재지·전화번호·데이터기준일자를 담는다(파일 크기 406바이트의 소규모 CSV). 정읍시에서 한약재를 구입하거나 거래처를 찾는 한의원·약국·사업자가 "정읍에 등록된 한약 도매업소는 어디이고 연락처는 무엇인가"를 확인할 때 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어, 다른 데이터와는 업소명이나 주소 문자열을 맞춰 연결한다.
description_portal: 전북특별자치도 정읍시에서 제공하는  한약 도매업소 현황중 업소명, 소재지도로명주소, 소재지지번주소, 전화번호의 정보를 제공합니다.유통 단계의 투명성이 강화되어 위·변조나 불법 유통을 예방하고 품질 관리가 향상될 것으로 예상됩니다. 연구자와 산업계는 지역별 한약 유통 현황을 파악해 수급 예측, 품목 관리, 시장 분석 등에 활용할 수 있으며, 소비자와 의료계는 신뢰할 수 있는 공급망 정보를 확인해 안전한 한약 사용 환경을 조성하는데 도움이 될 것입니다.기타 궁금한 사항은 담당부서인 정읍시 보건소로 문의하시기 바랍니다.
