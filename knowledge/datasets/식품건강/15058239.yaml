summary_user: "경기도 내에서 위생기준을 충족하지 못해 회수 명령을 받은 부적합 식품을 건별로 담으며, 제품명·업체명·업종·식품유형·국내외 구분·회수사유·회수명령일자·회수종류·회수평가결과와 시군 정보를 포함한다. 소비자나 식품안전 분석가가 '우리 시군에서 어떤 업체의 어떤 제품이 무슨 사유(예: 세균수·보존료 초과)로 회수됐는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)나 업체명으로 식품 인허가 업소·위생 지정 등 같은 부문 데이터와 이름·코드 매칭으로 이어 쓴다."
description_portal: 이 데이터는 경기도 내에서 식품 위생기준을 충족하지 못한 부적합 식품에 대한 현황을 제공하며, 반기 단위로 갱신됩니다. 총 21개 항목으로 구성되어 있으며, 제품명, 제조업체명, 업종명, 제품유형, 회수사유, 회수명령일자, 회수종류, 회수평가결과 등의 정보와 함께 해당 업체의 주소(WGS84 위경도 포함)도 포함되어 있습니다. 벤조피렌, 소르빈산, 대장균, 세균수 등 식품 내 유해물질 초과 여부로 인한 행정처분 내용을 확인할 수 있어 식품안전관리, 위해식품 유통 모니터링, 소비자 경고 서비스 등에 유용하게 활용될 수 있습니다. Open API 형식으로도 제공됩니다.
