summary_user: 군산시에 있는 집단급식소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 37KB)로, 업소명·도로명/지번 소재지·업태·평균급식인원수·운영형태를 담는다. 위생 담당자나 분석가가 군산시 안에서 급식 인원이 많은 집단급식소가 어디에 몰려 있고 직영·위탁 등 어떤 형태로 운영되는지 확인할 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명이나 주소 문자열을 맞춰 연결해야 한다.
description_portal: 본 데이터는 전북특별자치도 군산시에 위치한 집단급식소의 현황을 업소명, 소재지(도로명 및 지번), 연락처 등 주요 정보를 포함하여 체계적으로 정리한 자료입니다. 이를 통해 군산시 내 집단급식소의 분포와 정확한 위치 정보를 파악할 수 있으며, 위생 관리, 급식 안전 점검, 식품 안전 규정 준수 여부 확인 등에 적극 활용됩니다. 최신 정보를 반영하여 신뢰성과 정확성을 갖춘 데이터로서, 지역 내 급식 서비스 품질 향상과 공공 보건 증진, 관련 행정 서비스 제공에 중요한 기초 자료로 기능합니다. 또한 급식 운영의 효율화 및 주민 건강 보호에 기여합니다.
