description_portal: -본 자료는 「수입식품안전관리 특별법」에 따라 수입신고된 식품의 정보 제공하고 있습니다. 수입신고 건에 대해 신고된 식품의 고유 품목코드와 해당 품목의 명칭을 포함하고 있습니다.-이를 통해 소비자, 수입업체, 관리기관 등은 수입식품의 개별 품목과 그 분류(코드)를 명확히 확인할 수 있으며, 수입식품 현황 파악, 품목 분류 및 통계 분석 등 다양한 분야에서의 정책 수립과 연구에 활용이 가능합니다. 해당 자료는 식품의약품안전처에서 관리하며, 품목별 품목코드와 명칭 정보를 지속적으로 공개·제공하고 있습니다.
