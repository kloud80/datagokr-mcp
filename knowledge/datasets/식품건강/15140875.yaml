description_portal: 이 데이터는 서울특별시 광진구 내 일반음식점 및 집단급식소 중, 위생관리와 서비스 수준이 우수하다고 판단되어 지정되었던 모범음식점의 지정이 취소된 현황을 제공합니다.모범음식점은 「식품위생법」에 따라 위생 상태, 고객 응대, 시설 청결도, 식재료 관리 등 다양한 항목에 대한 평가를 통과한 업소에 부여되는 명칭으로, 정기 평가 또는 민원·점검 결과에 따라 지정이 취소될 수 있습니다.본 데이터에는 업소명, 소재지, 지정일자, 취소일자, 취소사유, 관리기관 등이 포함되며, 이를 통해 지역 내 위생 수준 이탈 현황 파악, 행정 감시 대상 설정, 시민 식품안전 의식 제고 등에 활용될 수 있습니다.또한 업소가 지정 취소되는 사유는 시설 미개선, 반복적인 위생 위반, 평가 점수 미달 등으로, 정기적 검증과 평가 체계의 신뢰성을 높이는 데 기여합니다.※ 데이터는 최신 행정 조치 기준으로 반영되며, 연도별 취소율 분석이나 지역별 비교 등 위생정책 평가 자료로도 활용 가능합니다.
