summary_user: 울산광역시 중구 관할에서 「식품위생법」에 따라 등록된 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일(약 3KB CSV)로, 업소명·업종·전화번호·도로명 소재지·식품유형·데이터 기준일을 담는다. 지역 연구자나 주민이 "울산 중구에 어떤 식품을 만드는 제조업체가 어디에 있나"를 확인하거나, 구 단위 식품산업 구조를 볼 때 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·도로명 주소를 맞춰 이어 써야 한다.
description_portal: 울산광역시 중구 관할구역 내 소재한 식품가공제조업의 업소명, 업종, 소재지전화번호, 소재지(도로명), 식품유형, 데이터 기준일 등의 현황으로 「식품위생법」에 따라 등록된 식품제조가공업소의 현황을 확인할 수 있습니다.울산 중구 지역 내 식품산업 구조 분석과 위생·안전 관리 업무를 지원하는 기초 자료로 활용될 수 있습니다. 또한 연구기관 및 일반 국민이 지역 식품 제조업체 현황을 이해하는 데에도 참고 자료로 활용 가능합니다. 다만 업소의 휴·폐업 등 변동 사항은 기준일 이후 발생할 수 있으므로, 실제 이용 시에는 참고 자료로 활용하시기 바랍니다.
