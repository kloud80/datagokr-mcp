summary_user: 서울 은평구에서 부패·변질되기 쉬운 식품을 운반하는 식품운반업 업소의 인허가 정보를 업소 한 곳당 한 행으로 담은 시군구 단위 원장으로, 관리번호·인허가일·영업상태·폐업일·주소·업소명·좌표가 들어 있다. 은평구에서 지금 영업 중인 식품운반업체가 어디에 몇 곳 있고 언제 인허가를 받았거나 폐업했는지 확인하려는 사업자·분석가·위생 담당자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 같은 식품 인허가 업소 계열의 다른 업종 원장과 묶어 업소 현황을 보는 데 쓴다.
description_portal: '은평구의 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 식품운반업에 종사하는 사업체의 인허가 정보를 포함하며,  식품의 생산지에서 소비지까지의 안전한 유통을 위한 관리체계 파악에 유용합니다.  사업체명, 인허가일, 운반 차량 유형, 냉장·냉동 설비 여부, 운반 범위 등 상세한 항목을 포함하고 있으며,  식중독 방지와 유통 위생 확보를 위한 정책 수립에 필수적인 자료입니다.  특히 공급망 관리, 물류체계 개선, 재난 시 긴급 물자 수송 등 다목적으로 활용될 수 있으며,  식품안전정보망과의 연계도 가능해 소비자 보호와 식품위생 강화에 기여합니다.'
