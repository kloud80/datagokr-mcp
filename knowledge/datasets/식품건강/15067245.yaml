summary_user: 대전광역시 동구에 있는 식품소분업 업소를 한 곳씩 담은 목록으로, 업종명·업소명·도로명 및 지번 소재지·전화번호를 담는다(약 9KB 규모의 CSV 파일). 식품을 작게 나눠 포장하는 업체가 동구 어느 동네에 몰려 있는지 확인하려는 주민·사업자·상권 분석가가 관내 분포를 살피는 데 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어서 다른 데이터와는 업소명·주소를 맞춰 보는 방식으로만 잇고, 동구의 다른 식품 인허가 업종 목록과 함께 보면 관내 식품업소 현황을 넓게 볼 수 있다.
description_portal: '이 데이터는 대전광역시 동구에 위치한 식품소분업 현황 정보를 제공하고 있으며, 세부 내용으로는 업종명, 업소명, 소재지(도로명, 지번), 우편번호를 포함하고 있습니다.이 자료를 통해 식품을 소규모로 나누어 포장하는 가게의 위치를 통해 관내 업체 분포 현황을 알 수 있고, 연간 갱신 주기를 통해 신규 업소나 폐업 현황에 대한 변화 모니터링 정보로도 활용될 수 있습니다.해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2026. 8. 11.'
