description_portal: 이 데이터는 광주광역시 관내에서 유통·판매되는 축산물에 대해 실시한 미생물 오염 여부 검사 실적을 정리한 자료입니다.검사 대상은 도축장과 영업장으로 구분되며, 도축장에서는 ‘모니터링 검사’와 ‘HACCP 관련 살모넬라 검사’를 수행하였습니다.영업장에서는 ‘식육포장처리장’과 ‘식육판매장’을 대상으로 검사를 실시하였습니다.검사 항목은 축종별로 소고기, 돼지고기, 닭고기, 오리고기로 구분되어 있으며, 각 축종별로 검사 건수가 기록되어 있습니다.본 자료를 통해 축산물 유통 과정 전반에서의 위생관리 현황과 축종별·업종별 미생물 오염 검사 실적을 확인할 수 있습니다.
