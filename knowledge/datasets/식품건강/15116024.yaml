description_portal: '서울특별시 중구의 즉석으로 음식을 제조 및 가공하여 판매하는 업소 정보입니다. 데이터는 각 제조업소에 부여된 관리번호, 현재의 영업 상태(허가, 취소 등), 상세 소재지 등 위생관리 현황, 그리고 소비처 일치 여부 등의 주요 항목들로 구성되어 있습니다. 이 자료는 즉석판매제조가공업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 조리 제조업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 신선도 및 위생모 착용 등 조리 위생 관리 기준을 충족하며 자체생산한 제품을 판매하는 신뢰할 수 있는 제조업소의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
