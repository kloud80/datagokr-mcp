summary_user: 서울 은평구에서 자동판매기로 식품을 파는 업소의 인허가 정보를 업소 1곳당 1행으로 담은 건별 원장으로, 인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표(X, Y)를 포함한다. 은평구에서 지금 영업 중인 식품자동판매기 업소가 어디에 얼마나 있는지, 언제 인허가되고 폐업했는지 확인할 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 주소·업소명 매칭이나 같은 기관의 관리번호(MGTNO) 기준으로만 이어 쓴다.
description_portal: '은평구의 자동판매기를 이용하여 식품을 판매하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.식품자동판매기업 인허가 정보는 자동화 시스템을 통한 식품 판매와 관련된 기업의 등록·운영 현황을 보여주는 데이터입니다.  자동판매기 관리 주체, 사업장 주소, 인허가 일자, 취급 품목 등 세부 항목으로 구성되어 있으며,  무인판매 서비스의 안전성 확보와 공중위생 유지에 중요한 자료입니다.  특히 식중독 예방, 소비자보호, 식품위생법 규제 이행 점검 등에도 활용할 수 있으며,  지역 내 유통경로 분석, 스마트소매시장 확대 흐름 이해에도 유익합니다.  소규모 창업 동향이나 정책 보조금 배분 분석 등에도 참고 가능합니다.'
