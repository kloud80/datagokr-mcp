description_portal: 서울시 기타 위생용품 제조업 현황 데이터는 서울시 관내에서 기타 위생용품 제조업을 영위하는 업소의 기본 정보와 영업 현황을 파악하기 위한 자료입니다. 시군구코드, 업종코드, 업종명, 업소일련번호, 업소명, 신고일자, 영업자시작일, 법인명, 행정동명, 폐업일자, 업태명 등의 행정·업종 정보를 포함하고 있으며, 영업장면적, 객실수, 한실수, 양실수, 의자수, 욕실수, 발한실 여부, 세탁기수 등 시설 및 규모에 관한 항목도 함께 제공됩니다. 또한 소재지 도로명 주소와 지번 주소, 소재지 전화번호, 허가 또는 신고번호, 위생교육 수료일자, 내외국인 구분 및 국적 정보 등을 통해 업소별 특성과 위생관리 현황을 종합적으로 분석할 수 있는 구조입니다. 이 데이터는 자치구 및 행정동 단위의 위생용품 제조업 분포 파악, 영업 지속·폐업 추이 분석, 시설 규모 및 위생관리 수준 점검, 내외국인 운영 업소 비중 분석 등 공중위생 행정과 정책 수립에 활용 가능한 기초 자료입니다.
