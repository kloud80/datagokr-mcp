summary_user: 서울특별시 마포구에 등록된 축산가공업 업소를 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y)가 들어 있다. 마포구에서 지금 영업 중인 축산가공업체가 어디에 있는지, 언제 인허가를 받았는지, 폐업했는지를 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 식품 인허가·위생 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 잇는다.
description_portal: 서울특별시 마포구에 등록된 축산가공업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 축산가공업체의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 관련 업체 및 주민들은 합법적으로 운영 중인 축산가공업체 위치와 현황을 쉽게 확인할 수 있습니다.
