summary_user: 식용란선별포장업 업소의 인허가 대장을 업소 단위로 담은 API로, 인허가번호·업소명·대표자명·업종·허가일자·주소를 제공하며 전국 범위이나 확인된 전체 건수는 2건이다. 식용란 선별·포장업소 현황이나 인허가 여부를 확인하려는 분석가·사업자가 업소 정보를 조회하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·코드 매핑이나 같은 기관(식약처) 코드로만 이어 쓴다.
limits: API 전체 건수가 2건뿐이라 전국 식용란선별포장업소 전수 분석에는 쓰기 어렵다. 전역 조인 키가 없어 외부 데이터와 결합하려면 업소명·주소 매핑 작업이 필요하다. 활용신청은 자동승인이며 개발계정은 일 10,000회까지 호출할 수 있다.
