summary_user: 인천광역시 남동구에 있는 휴게음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 소재지·전화번호가 들어 있다. 남동구 주민이나 창업 예정자가 '우리 동네에 카페·분식점 같은 휴게음식점이 어디에 얼마나 있나'를 확인하거나, 분석가가 구 단위 상권 밀집도를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없으므로, 다른 식품 인허가·위생 데이터와는 업소명과 주소를 맞춰 보거나 주소를 지오코딩해 연결한다.
limits: 남동구 한 곳만 다루며, 전역 조인 키가 없어 다른 기관 데이터와 정확히 1:1로 묶기 어렵다. 실측 필드에 인허가일·영업상태·좌표가 없어 개·폐업 추이나 현재 영업 여부는 이 파일만으로 판단하지 않는다.
