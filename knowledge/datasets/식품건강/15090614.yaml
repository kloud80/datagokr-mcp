summary_user: 인천광역시 남동구 공중위생업소(목욕장·이미용·세탁 등)의 서비스평가 결과를 업소 한 곳당 한 행으로 담은 파일로, 평가구분·업소명·업종·도로명 소재지·전화번호·데이터기준일자를 포함한다. 남동구 주민이 동네 미용실이나 목욕탕이 어떤 평가를 받았는지 확인하거나, 분석가가 업종별 평가 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 공중위생업소 인허가 데이터와는 업소명·도로명 주소를 맞춰 붙여야 한다.
