summary_user: 서울특별시 중구에서 식육·알·원유 등을 가공해 소시지·전난분·우유 등을 만드는 축산가공업 업소를 한 곳씩 담은 인허가 원장으로, 관리번호(MGTNO), 인허가·폐업 일자, 영업 상태, 소재지 주소, 업소명, 중부원점TM 좌표 등을 포함한다. 축산가공업 창업을 준비하는 예비 사업자가 '중구에 현재 영업 중인 축산가공 업소가 몇 곳이고 어디에 몰려 있나'를 확인하거나, 시민이 특정 가공업소의 등록·폐업 여부를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관(개방자치단체) 코드로만 이어 쓰며, 같은 형식의 다른 식품 인허가 업소 데이터와 묶어 지역 식품업 현황을 보는 데 쓴다.
description_portal: '서울특별시 중구의 식육, 알, 원유 등을 가공하여 소시지, 전난분, 우유 등으로 판매하는 업소 정보입니다. 데이터는 각 등록업소에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 축산가공업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 축산물 품목제조 등록업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 법적 기준을 충족하며 철저한 위생처리와 HACCP 관리를 통해 소비자안전을 확보하는 신뢰할 수 있는 가공시설 등록업소의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
