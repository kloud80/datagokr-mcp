summary_user: 전국 푸드트럭 지정 업소를 한 건씩 담은 원천 목록으로, 인허가번호·인허가일자·인허가기관명·업종명·업소명·업소주소를 제공한다. 창업 준비자나 상권 분석가가 '우리 지역에 지정된 푸드트럭이 어디에 몇 곳 있고 언제 인허가를 받았는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)나 업소명·주소를 맞춰 보는 방식으로 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 푸드트럭 지정 현황에 대한 인허가번호,인허가일자,인허가기관명,업종명,업소명,업소주소,대표자명,전화번호에 대한 속성정보를 제공합니다.이 자료를 통하여 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 푸드트럭에 대한 정보 제공, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
