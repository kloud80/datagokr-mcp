summary_user: '여수시 관내 일반·휴게음식점, 유흥·단란주점, 집단급식소, 식품제조가공업, 즉석판매제조가공업 등 식품위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·인허가일자와 도로명·지번 소재지 주소가 들어 있다. 여수시에서 특정 업종(예: 휴게음식점)이 어느 동네에 몰려 있고 언제 인허가를 받았는지 확인하려는 창업 준비자나 상권 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 컬럼에 없어, 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관 데이터로만 연결한다.'
limits: 인허가번호·사업자번호 같은 고유 키가 실측 컬럼에 없어 행정처분·위생등급 등 다른 식품안전 데이터와 정확히 조인하기 어렵다. 범위는 여수시 한 시군구에 한정되며, 좌표 없이 주소만 있어 지도 분석에는 지오코딩이 필요하다.
