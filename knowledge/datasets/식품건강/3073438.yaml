description_portal: 식품위생업소는 음식이나 식품을 제조, 조리, 판매, 유통하는 업소로서 식품의 안전성과 위생을 확보하기 위해 관련 법령에 따라 관리·감독을 받는 곳입니다.여수시 관내 일반·휴게음식점, 유흥주점, 단란주점, 집단급식소, 식품제조가공업, 즉석판매제조가공업 등이 이에 해당하며, 식품의 오염 방지, 조리 도구의 청결 유지, 종사자 위생관리 등이 필수적으로 요구됩니다.식품위생업소는 철저한 위생관리로 식중독, 식품오염 등 사고를 예방하고 국민 건강을 보호·안전한 식품을 제공하는데 중요한 역할을 합니다.
