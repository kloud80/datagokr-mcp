summary_user: 서울 양천구 관내 축산물운반업 영업자의 인허가 정보를 업소 1곳당 1건으로 담은 데이터로, 인허가·취소 일자, 영업상태와 폐업·휴업 기간, 지번·도로명 주소, 소재지면적, 업태, 좌표(X·Y) 등을 포함한다. 양천구에서 지금 영업 중인 축산물 운반업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 폐업했는지 확인하려는 사업자나 위생 행정 담당자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 식품 인허가 업소 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호로만 이어 쓴다.
description_portal: 축산물운반업 인허가 정보는 서울특별시 양천구 관내에서 축산물을 운반·보관·배송하는 영업자가 법령 기준에 따라 영업 인허가를 신청하고 승인받은 사항을 체계적으로 정리한 데이터이다. 본 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등이 포함된다. 또한 정기적으로 실시하는 현장 점검 결과와 개선 권고 사항 등도 함께 제공하여 지역 내 축산물 유통의 안전성과 관리 체계를 객관적으로 파악할 수 있다. 이 데이터는 축산물 위생관리 정책 수립, 운반 과정의 안전성 확보, 영업자 행정 서비스 제공 등 공공 목적의 의사결정 지원을 위해 활용된다.* 축산물운반업 - 축산물(식육,원유,식육가공품 등)을 전문적으로 운반하는 업소
