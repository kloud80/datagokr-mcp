summary_user: '위생용품관리법에 따라 품목제조보고된 위생용품의 원재료 내역을 업소·품목 단위로 담은 전국 범위 원천 데이터로, 업소명·인허가번호·품목제조보고번호·보고일자·품목명·유형과 원재료명을 담는다. 소비자나 유통사업자가 특정 위생용품(예: 일회용 컵, 세척제)이 어떤 원재료로 제조보고됐는지, 어느 업소가 어떤 유형의 품목을 보고했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관의 위생용품 품목제조보고 기본정보 등과는 인허가번호(PRMT_NO)·품목제조보고번호·업소명 같은 기관 내부 번호나 이름 매핑으로만 연결한다.'
description_portal: 이 자료는 위생용품관리법에 따른 위생용품 품목제조보고된 원재료 내역 정보를 제공합니다. 이 자료의 속성정보는 인허가번호, 업소명, 품목제조번호, 보고일자, 품목명, 유형, 원재료가 있습니다.이 자료를 통하여 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
