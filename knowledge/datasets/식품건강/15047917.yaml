summary_user: 부산광역시 기장군 관내 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호를 담는다(포털 설명상 2024.9.5. 기준). 기장군에서 식품을 제조·가공하는 업체가 어디에 몇 곳 있는지 확인하거나, 거래처·납품처를 찾는 사업자가 연락처를 조회하는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서 다른 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
