summary_user: 부산광역시 서구에 있는 개인카페를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·데이터기준일을 담는다(약 9KB CSV). 서구에서 카페 창업을 검토하는 사업자나 상권 분석가가 '서구 어느 동네에 개인카페가 몰려 있나'를 주소로 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 업소 데이터와는 업소명과 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 공통 식별 키가 없으므로 다른 데이터와 붙일 때는 업소명·주소 매칭에 기대야 하고, 이때 매칭 오류가 생길 수 있다. 범위는 부산 서구 한 곳뿐이며 좌표는 없다. 포털 설명에서 업소명을 '프랜차이즈 카페 업소명'이라고 적어 두었으므로 개인카페만 담겼는지는 직접 확인해야 한다.
