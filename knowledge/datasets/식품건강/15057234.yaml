summary_user: 경기도가 '경기으뜸맛집'으로 선정했던 향토 음식점을 업소 한 곳당 한 행으로 담은 현황 자료로, 업소명·대표음식·전화번호·도로명/지번 주소·우편번호·WGS84 위경도와 시군명·시군코드를 포함한다. 지역 관광·외식문화 연구자나 콘텐츠 제작자가 '어느 시군에 어떤 향토 대표음식 맛집이 있었나'를 확인하고 지도에 표시하는 데 쓴다. 전역 조인 키는 없으므로 시군코드(SIGUN_CD)·시군명으로 경기도 다른 시군 자료와 묶거나, 업소명·주소를 대조해 식품 인허가 업소·위생 지정 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도에서 향토 음식과 지역 특산물을 활용하여 맛, 위생, 서비스 측면에서 우수하다고 인정받아 ‘경기으뜸맛집’으로 선정된 음식점의 정보를 제공합니다. 업소명, 대표음식명, 전화번호, 주소(도로명 및 지번), 우편번호, 위도·경도 좌표(WGS84 기준) 및 비고사항 등의 항목으로 구성되어 있으며, 각 시군별 분포 정보도 포함되어 있습니다. 경기으뜸맛집 사업은 2020년 이후 폐지되었으나, 본 데이터는 사업 운영 당시의 향토 음식점 현황을 기록한 자료로서 지역 관광자원과 외식문화 연구, 맛집 탐방 콘텐츠 제작, 지역 음식산업 분석 등 다양한 분야에 활용 가능합니다. 데이터는 경기도 식품안전과에서 제공하며, 향후 갱신은 이루어지지 않습니다.
