summary_user: 남양주시에서 식품위생법을 위반해 행정처분을 받은 업소를 건별로 담은 파일로, 처분일자·업종명·업소명·도로명 소재지·위반내용·처분내용을 시군구 범위에서 업소 단위로 기록한다. 시민이 "동네 이 음식점이 위생 위반으로 영업정지 등 처분을 받은 적이 있나"를 확인하거나, 분석가가 업종별 위반 유형과 처분 수준을 살피는 데 쓴다. 전역 조인 키가 없어 식품 인허가 업소 목록이나 위생 지정 데이터와는 업소명·도로명주소를 맞춰 이어 써야 한다.
description_portal: 남양주시는 식품의 안전성과 시민의 건강을 보호하기 위해 위생법을 위반한 업소에 대한 행정처분 정보를 공개하고 있습니다. 해당 데이터는 식품위생법을 위반하여 행정처분을 받은 업소들의 상세 정보를 포함하고 있으며, 주요 항목으로는 처분일자, 업종명, 업소명, 소재지, 도로명주소, 위반내용, 처분내용 등이 있습니다. 이 정보를 통해 시민들은 위생에 문제가 있었던 업소를 사전에 인지하고 안전한 소비 활동을 할 수 있으며, 업소들은 위생관리의 중요성을 인식하고 자율적으로 개선하도록 유도받게 됩니다. 이 데이터는 행정의 투명성을 높이고, 시민들의 알 권리를 보장하며, 공공의 식품안전을 증진하는 데 중요한 역할을 합니다.
