summary_user: 강원특별자치도 원주시 관내 유흥주점 영업시설을 업소 한 곳당 한 행으로 담은 목록으로, 업소명·도로명/지번 주소·전화번호·업태(룸살롱 등)·관리기관·기준일자를 담는다. 시청 담당자나 상권 분석가가 '원주시에서 유흥주점이 어느 동네에 몰려 있는가'를 주소 기준으로 확인할 때 쓴다. 전역 조인 키나 인허가번호 같은 공통 코드는 없어서, 다른 식품 인허가 업소 자료나 지도 데이터와는 업소명·주소 문자열을 맞추는 방식으로만 이어 쓴다.
limits: 원주시 한 개 시군구만 다루므로 다른 지역과 비교하려면 해당 지자체 자료를 따로 모아야 한다. 실측 컬럼에 인허가번호·사업자번호·좌표가 없어서, 다른 데이터와 연결하거나 지도에 표시하려면 주소를 정제하고 지오코딩해야 한다.
