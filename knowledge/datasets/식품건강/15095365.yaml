summary_user: 수입 위생용품에 적용되는 검사 종류를 코드·명칭·약어와 수수료 적용 대상 여부로 정리한 전국 단위 분류(코드표) 데이터로, 건별 검사 실적이 아닌 기준 정보를 담는다. 위생용품 수입업체나 유통사가 '이 검사는 어떤 코드로 분류되고 수수료가 붙는가'를 미리 확인하거나, 분석가가 검사 분류 체계를 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 수입·검사 데이터와는 검사종류코드(INSP_KIND_CD)나 검사종류명을 이름·코드로 맞춰 붙이는 방식으로만 연결한다.
limits: 검사 종류의 분류와 수수료 적용 여부만 담고 있어 실제 검사 건수, 수수료 금액, 제품별 적용 검사는 알 수 없다. 다른 데이터와 공통 키가 없어 연계 시 코드·명칭 매핑을 따로 해야 한다.
