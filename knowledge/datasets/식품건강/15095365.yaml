description_portal: 식품의약품안전처 「수입위생용품 검사종류 분류정보」 OpenAPI는 수입 위생용품에 적용되는 검사 종류들을 코드와 함께 분류하여 제공하는 공공데이터입니다. 제공 항목에는 검사종류코드, 검사종류명, 검사종류 약어명, 수수료 적용 대상 여부 등이 포함되어 있어, 사용자는 위생용품 수입 시 어떤 검사가 어떤 코드로 분류되는지와 수수료 부과 여부를 확인할 수 있습니다. 또한 업체와 유통사가 제품별 적용 검사를 사전에 파악해 절차를 준비하는 데 참고할 수 있고, 연구기관과 정책 담당자는 검사 분류 체계와 적용 대상을 분석해 검사 제도개선 기초 자료로 활용할 수 있습니다.
