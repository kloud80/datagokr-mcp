summary_user: 울산광역시 동구에 있는 식품제조업체를 업소 한 곳당 한 행으로 정리한 파일로, 업종명·인허가일자·업소명·도로명/지번 소재지·영업장면적을 담는다(CSV 약 1.2KB의 소규모 목록). 동구에서 식품제조·가공 업소가 어디에 몇 곳 있고 언제 인허가를 받았는지 확인하려는 주민·창업자·지역 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)가 없어서, 다른 식품 인허가·위생·행정처분 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 인허가번호·사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 일대일로 연결하기 어렵고, 업소명·주소 매칭에서 오차가 생길 수 있다. 범위는 울산 동구 한 곳의 개별 업소이므로 다른 시군구나 전국 비교에는 별도 자료가 필요하다.
