summary_user: 광주광역시가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 목록 파일이며, 업소명·도로명 소재지·전화번호·주된 음식 종류가 들어 있다. 시민이나 방문객이 광주에서 위생·서비스 기준을 통과한 식당을 음식 종류별로 골라 찾을 때 쓰고, 분석가는 지역별 모범음식점 분포를 살필 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서, 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
