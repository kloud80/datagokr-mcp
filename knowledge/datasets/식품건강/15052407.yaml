summary_user: 서울 광진구가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일(CSV 약 9.7KB)로, 업소명·도로명 소재지·음식유형·행정동·데이터 기준일을 담는다. 광진구 주민이나 방문객이 '우리 동네 행정동에 있는 모범음식점 한식집은 어디인가'를 찾을 때, 또는 분석가가 행정동별 모범음식점 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서, 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·도로명 주소 매칭이나 행정동 이름으로만 이어 쓴다.
limits: 업소 인허가번호가 없어 인허가 원장과 정확히 조인할 수 없다. 이름·주소 매칭은 오차가 생길 수 있다. 범위는 광진구 한 개 시군구에 한정된다.
