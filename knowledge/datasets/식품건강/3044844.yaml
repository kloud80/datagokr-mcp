description_portal: '1. 목록명: 인천광역시_삼산농산물 도매시장 부적합 농산물 현황2. 키워드:  식품안전, 농산물, 부적합3. 데이터 설명:삼산농산물도매시장에 반입되는 농산물 중 잔류 농약검사 결과 부적합 판정 받은 농산물 내역을 통보기관 수거일자, 수거번호, 수거장소, 품목, 잔류농약명, 결과(㎎/㎏), 기준(㎎/㎏), 출하제한 시작일, 출하제한 종료일, 출하자 주소 등으로 구분한 정보입니다. 이 정보를 통해 부적합 판정을 받은 농산물의 유통 경로를 추적하고, 출하 제한 조치를 신속하게 시행할 수 있도록 지원합니다.또한, 본 데이터는 식품안전에 대한 지역사회와 소비자의 신뢰를 확보하고, 농산물의 안전한 유통을 보장하는 데 중요한 역할을 합니다. 잔류 농약 부적합 농산물의 발생 현황과 특징을 분석함으로써 농산물의 품질 향상과 함께 유해물질 관리 강화 정책 수립에도 기여합니다. 더불어, 이 데이터는 농산물 도매시장 내 유통질서 유지 및 농업 생산자의 책임 있는 생산 활동을 독려하는 데에도 활용됩니다. 결과적으로, 인천광역시 삼산농산물도매시장의 안전한 농산물 유통 환경 조성과 식품 안전 관리 체계 강화에 필수적인 기반 자료로 활용됩니다.데이터는 분기별 업데이트 되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, CSV 형식으로 제공됩니다.'
