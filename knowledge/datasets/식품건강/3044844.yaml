limits: 삼산농산물도매시장 한 곳의 부적합 건만 담아 적합 판정 건이나 전체 검사 물량, 다른 시장의 현황은 알 수 없다. 명세상 분기 갱신이지만 이벤트성으로 생성된 뒤 바뀌지 않는 성격도 있어 최신성은 다운로드 시점에 확인해야 한다. 출하자는 주소로만 나와 업소·생산자 코드로 연결되지 않는다.
