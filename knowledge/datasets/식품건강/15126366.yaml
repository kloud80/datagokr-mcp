summary_user: 경기도 파주시에서 군장병에게 할인 혜택을 주는 업소를 한 곳씩 담은 목록으로, 업종·업소명·도로명/지번 주소·위도·경도·할인 내용·전화번호를 업소 단위로 담는다(CSV 약 44KB). 파주에서 복무하거나 면회 온 사람이 '부대 근처 어느 식당이 장병 할인을 얼마나 해 주나'를 찾거나, 지자체·분석가가 할인 업소의 지역·업종 분포를 지도로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓰며, 식품 인허가 업소 원장과 붙이려면 이름·주소 매핑이 필요하다.
description_portal: 경기도 파주시 군장병을 대상으로 한 복지 서비스 확대 및 지역 경제 활성화를 지원하기 위한 군장병에게 할인 혜택을 제공하는 업소에 대한 정보로 업소명, 상권 분석이나 서비스 기획 시 참고자료로 쓰일 수 있는 업소의 업종명, 행정구역명, 정밀한 위치 파악 및 경로 안내에 유용한 도로명주소 및 지번주소, 위도와 경도 좌표, 각 업소의 군장병 대상 혜택 내용을 포함하고 있는 할인정보, 업소 전화번호 등으로 구성되어 있습니다. 이 데이터는 위치 기반 서비스, 할인정보 제공 플랫폼, 군복무자 대상의 복지 시스템, 지도 기반 애플리케이션에서의 정밀한 위치 파악 및 경로 안내, 군장병의 소비 혜택 분석이나 정책 개선, 군복무자 전용 플랫폼 기획, 지역별 혜택 가시화, 공간정보 시스템(GIS), 복지정책 연구, 군장병 소비패턴 분석 등에 활용될 수 있습니다.
