summary_user: 전라남도 고흥군의 제과점영업 업소를 한 곳씩 담은 건별 목록으로, 사업장명·소재지 전체 주소·업태구분을 담는다(CSV 약 3KB 규모의 소규모 파일). 고흥군에서 영업 중인 제과점이 어디에 몇 곳 있는지 확인하려는 주민이나 창업 전 동네 상권을 살피는 사업자가 쓴다. 인허가번호·사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 식품 인허가 데이터와는 사업장명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 고흥군 한 개 시군구만 담으므로 다른 지역과 비교하려면 지역별 파일을 따로 모아야 한다. 인허가번호나 좌표가 없어 다른 데이터와 정확히 매칭하기 어렵고, 주소를 지오코딩하거나 이름을 대조해야 한다.
