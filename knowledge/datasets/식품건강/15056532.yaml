summary_user: 식약처가 관리하는 관련 법령을 법령코드 단위로 담은 코드 기준표로, 법령명·전체법령명, 상위법령코드와 레벨(계층), 업무분야, 사용 여부, 유효 시작·종료일을 담는다. 식품안전나라 등 식약처 데이터를 다루는 분석가나 개발자가 다른 데이터에 찍힌 법령코드가 어떤 법령·조문 계층을 가리키는지, 현재 유효한 코드인지 확인하는 데 쓴다. 전역 조인 키는 없으므로 같은 기관(식약처) 데이터의 법령코드(FOOD_LAWORD_CD)나 법령명으로 매핑해 이어 쓰고, 상위법령코드로 자기 참조해 법령 계층을 펼친다.
description_portal: 식품의약품안전처에서 관리하는 식약처 관련 법령코드 자료입니다. 법령코드 , 상위법령코드 , 업무분야 , 법령명 , 전체법령명 , 레벨 , 사용여부 , 유효시작일자 , 유효종료일자 , 최종수정일시의 속성정보를 제공합니다.이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
