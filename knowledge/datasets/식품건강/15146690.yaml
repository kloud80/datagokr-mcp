summary_user: HACCP 인증업체 가운데 사회적기업·예비사회적기업·여성기업·장애인기업·마을기업 같은 사회적약자기업을 업체 단위로 모은 전국 목록 파일로, 업체명·HACCP 인증번호·시도/시군구·업종·인증 품목·사회적가치 유형을 담는다. 공공기관 구매 담당자나 유통사가 "우리 지역에서 HACCP 인증을 받은 장애인기업이나 사회적기업 식품 제조업체는 어디인가"를 찾을 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 인증번호나 업체명·시군구 이름 매칭으로 HACCP 인증업체 목록이나 식품 인허가 업소 자료와 이어 붙여야 한다.
description_portal: (HACCP 인증업체 사회적약자기업 정보 제공 ) HACCP인증업체 중 사회적약자기업(사회적기업, 예비사회적기업, 여성기업, 장애인기업, 마을기업 등) 정보를 제공하고 있습니다. 인증업체명(영업허가기준), 인증번호(HACCP인증번호), 지역(시도/시군구), 영업형태(식품제조가공업, 식육포장처리업, 식육가공업 등), 인증유형(과자, 빵류, 커피, 양념육, 포장육 등), 사회적약자기업 유형에 대한 정보를 제공합니다. 사회적약자기업으로는 사회적기업, 예비사회적기업, 자활기업, 여성기업, 마을기업, 장애인기업, 장애인표준작업장 등이 속합니다.
