description_portal: 대전광역시 농산물 잔류농약검사 현황대전광역시 노은농수산물검사소 및 오정농수산물검사소에서 검사한 농산물 잔류농약 검사 건수 및 부적합 내역입니다.대전광역시에서 수행한 농산물  안전성검사, 부적합 현황 자료입니다.이 검사의 목적은 기준미달 농산물의 시중유통을 선제적으로 차단하기 위하여 도매시장 출하 농수산물의 안전성을 확보하고 대전광역시 유통 농산물의 안전성을 확보하기 위하여 실시합니다.이 자료의 내용은  대전광역시  농산물도매시장 출하 농산물의 안전성 검사, 대전광역시 유통 농산물 안전성 검사 현황에 대한 자료입니다. 주요 검사 항목은 농산물의 잔류농약 검사 등입니다.  이 자료는 대전광역시 유통 농산물의 안전성 자료로 활용할 수 있으며, 유통 식품의 안전한 공급 현황을 파악하는데 중요한 자료입니다
