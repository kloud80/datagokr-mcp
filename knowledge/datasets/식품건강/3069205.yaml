summary_user: 원주시 관내 제과점 영업 등록 업소를 한 행에 한 곳씩 담은 업소 단위 원장으로, 업소명·도로명/지번 주소·전화번호·업태명·관리기관·데이터기준일자를 포함한다. 창업 예정자나 상권 분석가가 '원주시 어느 동네에 빵집이 몰려 있고 경쟁 업소는 몇 곳인가'를 확인하거나, 소비자가 근처 제과점을 찾을 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·위생·행정처분 데이터와는 업소명과 주소를 맞춰 대조해야 한다.
limits: 인허가번호·좌표 같은 고유 식별자가 실측 컬럼에 없어 다른 데이터와 정확히 1:1로 연결하기 어렵고, 업소명·주소 문자열 매칭에 의존해야 한다. 범위는 원주시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터를 모아야 한다.
