description_portal: 식품의약품안전처에서 제공하는 마스크 관련 업체 행정처분 정보 데이터는 마스크를 제조하거나 유통하는 업체의 행정처분 현황을 조회할 수 있도록 구성된 공공데이터입니다. 이 데이터에는 업체명, 업종, 허가번호, 업체구분, 주소, 처분일자, 공개종료일자, 위반내용, 처분사항, 근거법령, 위반품목기준코드, 품목명 등이 포함됩니다. 이를 활용하면 마스크 관련 업체가 어떠한 법규 위반을 하였는지와 그에 따라 어떠한 처분을 받았는지를 확인할 수 있으며, 시장 감시, 위반 추적, 정책 평가, 소비자 안전 확보 등 다양한 분야에서 활용될 수 있습니다.
