summary_user: 마스크를 제조·유통하는 업체가 받은 행정처분을 처분 건별로 담으며, 업체명·업종·허가번호·주소와 처분일자·공개종료일자·위반내용·처분사항·근거법령·품목명을 함께 기록한다(범위 전국, 업체 주소 단위). 소비자나 구매 담당자가 '이 마스크 업체가 어떤 법규를 위반해 어떤 처분을 받았나'를 확인하거나, 분석가가 마스크 업계의 위반 유형과 처분 추이를 살피는 데 쓴다. 실측상 전역 조인 키는 없어서 허가번호(BSSH_PRMSN_NO)·사업자등록번호·업체명을 이름·번호 매핑으로 맞춰 식약처의 인허가 업소나 회수·판매중지 데이터와 이어 쓴다.
limits: 처분 이력을 건별로만 기록하고 다른 데이터와 바로 묶을 공통 키가 없어, 연계할 때는 허가번호나 업체명 매칭 오류에 주의해야 한다. 처분이 생길 때 만들어지고 그 뒤로는 바뀌지 않는 이벤트성 데이터이며, 공개종료일자가 지난 처분은 조회 범위에서 빠질 수 있다.
