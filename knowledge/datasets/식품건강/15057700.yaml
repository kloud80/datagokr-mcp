summary_user: 경기도 안의 정수기 제조업·수입판매업 사업장을 한 곳씩 담은 인허가 원천 목록으로, 시군·사업장명·인허가일자·영업상태·폐업일자·제품명·소재지면적과 지번·도로명 주소, WGS84 위도·경도가 들어 있다. 우리 동네 정수기 제조·수입업체가 어디에 있고 아직 영업 중인지 확인하려는 주민이나, 시군별 업체 분포를 보고 위생점검 대상을 고르려는 담당자가 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)나 시군명으로 경기도 다른 데이터와 묶거나, 주소·좌표로 지도·상권 데이터와 공간 결합해 쓴다.
description_portal: 이 데이터는 경기도 내 정수기 제조업 또는 수입판매업체에 대한 인허가 현황을 담고 있으며, 총 18개 항목으로 구성되어 있습니다. 시군명, 사업장명, 인허가일자, 폐업일자, 제품명, 소재지 주소(WGS84 위도·경도 포함), 소재지면적, 먹는물 민원구분 등의 정보를 제공합니다. 해당 데이터는 물리적·화학적·생물학적 방식으로 수질을 정화하는 정수기 제품을 제조하거나 수입하여 판매하는 사업체에 대한 현황을 파악하는 데 활용됩니다. 관련 정책 수립, 산업 현황 분석, 위생점검 계획 수립, 민원 대응 자료 등으로 활용 가능하며, Open API 방식으로 제공됩니다. 지방행정데이터개방시스템 개편에 따라 2018년 이후 데이터 갱신이 일시적으로 중단된 이력이 있습니다.
