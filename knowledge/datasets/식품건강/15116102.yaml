summary_user: 서울 강서구에서 축산물운반업 인허가를 받은 사업장을 한 곳씩 담은 건별 원장으로, 인허가일자·폐업일자, 영업상태, 사업장명, 지번·도로명 주소, 전화번호, 좌표(X·Y)를 담는다. 강서구 안에서 지금 영업 중인 축산물 운반업체가 어디에 몇 곳 있고 언제 문을 열거나 닫았는지 확인하려는 주민, 유통 사업자, 위생 행정 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 붙이며, 타 구의 같은 업종 인허가 데이터나 식품 행정처분·위생 데이터와 함께 볼 때도 이 방식으로 연결한다.
description_portal: 서울특별시 강서구 내에서 축산물 운반업을 영위하는 사업장의 인허가 정보를 제공하는 데이터입니다. 축산물 운반업은 식육, 원유, 식육가공품 등 신선식품에 해당하는 축산물을 위생적이고 안전하게 유통시키기 위해 필수적인 유통단계로, 식품안전과 직결되는 분야입니다. 본 데이터는 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등으로 구성되어 있으며, 관련 업종의 지역별 분포 및 운영 현황을 파악할 수 있는 자료입니다. 이를 통해 축산물 유통망의 흐름을 이해하고, 냉장·냉동시설을 갖춘 운반차량 보유 여부, 식품안전 관리체계 수립 등의 정책수립에 참고할 수 있습니다. 또한 식품위생법과 축산물 위생관리법 등의 법령에 따라 인허가된 업체의 정보를 확인할 수 있어 소비자와 행정기관 모두에게 유용한 정보를 제공합니다.
