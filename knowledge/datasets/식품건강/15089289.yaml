summary_user: 식품제조가공업 업소의 폐업 건을 업소별로 담은 전국 단위 데이터로, 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업상태·주소·관할기관명을 제공한다. 식품 제조업체와 거래하려는 사업자나 분석가가 특정 제조업소가 언제 폐업했는지, 지역별·업종별 폐업 흐름이 어떤지 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으며, 같은 기관의 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 매핑으로만 이어 쓴다.
description_portal: 식품제조가공업의 폐업정보로, 인허가번호, 업소명, 대표자명, 업종, 허가일자, 폐업일자, 페업상태, 주소, 관할기관명  등의 항목을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
