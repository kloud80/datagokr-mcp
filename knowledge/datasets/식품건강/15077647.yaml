summary_user: 식품판매업 업소의 폐업 내역을 업소 한 곳당 한 건으로 담은 전국 단위 원장이며, 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업 구분·소재지 주소·담당 기관명을 포함한다. 창업 예정자나 상권 분석가가 특정 지역·업종에서 식품판매업소가 언제 얼마나 문을 닫았는지 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 같은 기관의 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)·업소명·주소를 맞춰 보는 방식으로 연결한다.
description_portal: 식품판매업 폐업에 대한 속성정보를 제공합니다. 속성정보로는 인허가번호 , 업소명 , 대표자명 , 업종 , 허가일자 , 폐업일자 , 페업상태 , 주소 , 기관명이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
