summary_user: 서울특별시 서대문구에 신고된 건강기능식품 유통전문판매업소를 업소 한 곳씩 담은 인허가 원장으로, 업소명·인허가일자·영업상태·폐업일자·소재지 주소·좌표(X, Y) 등을 포함한다. 소비자가 서대문구에서 영업 중인 건강기능식품 유통판매업소가 어디인지 확인하거나, 분석가가 지역 내 업소의 개업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 식품 인허가·행정처분 데이터와는 관리번호(MGTNO)나 업소명·주소 매칭, 같은 기관 코드(OPNSFTEAMCODE)를 통해서만 이어 쓴다.
description_portal: 건강기능식품 유통전문 판매업소의 신고 등록 현황입니다.서울시 서대문구 건강기능식품유통전문판매업 현황 데이터는 건강기능식품을 제조하여 판매하거나 수입하여 판매하는 유통전문판매업소의 정보를 담고 있는 자료입니다. 이 데이터는 소비자가 안전하게 건강기능식품을 구매하도록 돕고, 유통업체 관리 및 정책 수립에 활용될 수 있습니다. 이 데이터는 식품 위생 점검 및 단속을 위한 기초 자료로 사용되며 등록된 업소의 영업 상태를 지속적으로 관리하여 불법 유통을 막고, 소비자 피해를 예방하는 데 활용됩니다.
