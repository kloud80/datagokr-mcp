summary_user: 부산광역시 동구 관내 건강기능식품판매업소를 업소별로 한 줄씩 담은 파일로, 업종명·업소명·도로명 소재지·전화번호 4개 항목만 있다. 동구 주민이 집 근처 건강기능식품 판매점을 찾거나, 분석가가 동구 안 판매업소 분포를 주소 기준으로 살펴보는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 동구의 관내 건강기능식품판매업 영업 현황에 대한 자료입니다.파일 내의 항목 구성은 총 4가지로 이루어져있습니다.(업종명, 업소명, 소재지(도로명), 소재지전화 데이터입니다.)해당 데이터는 지역 주민들이 주변의 건강기능식품판매업소를 손쉽게 확인하고 필요한 서비스를 이용할 수 있도록 함으로써, 생활 편의성을 높이고 위생 환경 개선에 기여하는 중요한 기초 자료로 활용됩니다.그 이외의 업체 정보가 필요하신 경우 식품안전나라 사이트(https://www.foodsafetykorea.go.kr/portal/specialinfo/searchInfoCompany.do?menu_grp=MENU_NEW04&menu_no=2813)에서 검색하시기 바랍니다.
