summary_user: 전북특별자치도 장수군 7개 읍면에서 운영 중인 건강기능식품 일반판매업소를 업소 한 곳당 한 행으로 담은 목록으로, 업종명·업소명·도로명주소·소재지전화·데이터기준일자로 구성된 작은 CSV 파일(1,514바이트)이다. 장수군에서 건강기능식품을 파는 곳이 어디에 몇 곳 있는지 찾는 주민이나, 군 단위 판매업소 분포를 보려는 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가 데이터와는 업소명·도로명주소를 맞춰 잇거나 같은 기관 자료끼리 묶어 쓴다.
