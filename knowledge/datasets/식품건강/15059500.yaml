summary_user: 식품위생법, 수입식품안전관리 특별법, 식품 등 표시·광고법 위반으로 행정처분을 받은 전국 식품 관련 업체의 처분을 건별로 담는다. 각 건에는 업소명, 업종, 처분 유형과 내용, 위반 내용, 영업정지 기간, 처분기관이 들어 있다. 소비자나 거래처를 고르는 사업자가 '이 업소가 최근 영업정지 등 행정처분을 받은 적이 있는가'를 확인하거나, 분석가가 업종·지역별 위반 이력을 살피는 데 쓴다. 전역 조인 키는 없으므로, 인허가번호(LCNS_NO)나 업소명으로 같은 기관의 식품 인허가 업소·위생 지정·회수/부적합 데이터와 맞춰 잇는다.
description_portal: 식품위생법, 수입식품안전관리 특별법, 식품 등 표시· 광고에 관한 법률 등 위반으로 행정처분을 받은 식품 관련 업체에 대한 속성정보를 제공합니다. 속성정보로는 업소명 , 업종 , 인허가번호 , 처분확정일자 , 처분시작일(영업정지의경우) , 처분종료일(영업정지의경우) , 처분유형 , 위반일자및위반내용 , 주소 , 전화번호 , 대표자명 , 처분내용 , 위반법령 , 공개기한 , 최종수정일 , 처분기관명 , 행정처분전산키가 있습니다.이 자료를 통하여 데이터 산업 활성화, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 정보 투명성 제고, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
