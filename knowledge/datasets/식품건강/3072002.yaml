summary_user: 경기도 동두천시가 착한가격업소로 지정한 관내 음식점을 업소 한 곳당 한 행으로 담은 파일로, 상호·도로명/지번 주소·위도·경도·전화번호·지정일자·영업시간·휴무일·배달/주차 여부·주요 품목 가격을 포함한다. 동두천에서 값싸게 식사할 곳을 찾는 주민이나, 지역 물가안정 업소의 분포와 가격 수준을 살피는 분석가가 "동두천 어디에 착한가격업소가 있고 대표 메뉴 가격은 얼마인가"를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 상호명·주소 문자열 매칭이나 위도·경도 좌표로만 이어 쓴다.
description_portal: 경기도 동두천시에 관내에 위치하고 있는 음식점 중 착한가격업소 현황 정보를 민원인에게 제공하고자 합니다.데이터는 상호명, 소재지 도로명주소, 소재지 지번주소, 위도, 경도, 전화번호, 지정일자, 영업시작시간, 영업종료시간, 휴무일, 배달여부, 주차여부, 주요품목 가격, 관리기관명, 관리기관 전화번호의 정보입니다.데이터의 기준일자는 2026년 3월 13일입니다. 데이터에 대하여 추가문의사항이 있으실 경우 동두천시청 일자리경제과 경제팀 031-860-2278으로 문의주시기 바랍니다.동두천시 대표홈페이지에서도 착한가격업소 정보를 확인하실 수 있습니다.(https://www.ddc.go.kr/ddc/selectBbsNttList.do?bbsNo=68&key=537&pageUnit=12)
