summary_user: 위생용품관리법에 따른 위생용품 영업 업소를 한 곳씩 담은 전국 단위 목록으로, 인허가번호·업소명·대표자명·업종·허가일자·전화번호·주소·관할 기관명을 제공한다. 사업자나 분석가가 "특정 지역에서 위생용품 제조·수입업으로 허가받은 업체가 어디이고 언제 허가받았나"를 확인하거나 거래처 신원을 점검할 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 식품 인허가 업소나 회수·행정처분 정보 같은 식약처 데이터와는 업소명·주소·인허가번호(LCNS_NO)를 이름 매칭하는 방식으로만 잇는다.
description_portal: 식품의약품안전처에서 관리하는 위생용품관리법에 따른 위생용품영업정보로 위생용품영업에 대한 속성정보를 제공합니다. 속성정보로는 인허가번호 , 업소명 , 대표자명 , 업종 , 허가일자 , 전화번호 , 주소 , 기관명이 있습니다. 이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
