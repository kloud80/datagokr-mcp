summary_user: 대구광역시 동구의 음식점 위생등급제 지정업소를 업소 한 곳당 한 건으로 담으며, 업소명·주소·지정 등급·지정일자를 제공한다. 동구 주민이나 외식 이용자가 '우리 동네에서 위생등급을 받은 식당은 어디이고 몇 등급인가'를 확인하거나, 분석가가 지정일자 기준으로 동구 내 지정 추이를 살피는 데 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 식품 인허가 업소 원장이나 다른 위생 지정 데이터와는 업소명·주소 매칭으로만 연결한다.
limits: 범위가 대구 동구 한 시군구에 한정되어 다른 지역이나 전국 비교에는 단독으로 쓸 수 없다. 공통 키가 없어 인허가 원장·행정처분 데이터와 이을 때 업소명·주소 문자열 매칭 오류에 주의해야 한다.
