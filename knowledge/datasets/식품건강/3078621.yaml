summary_user: 인천광역시 부평구에 등록된 제과점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지주소·전화번호가 들어 있다(CSV 약 12KB, 시군구 범위의 개별 주소 단위). 부평구에서 제과점을 열려는 사업자나 상권 분석가가 '구 안에서 제과·제빵 업소가 어느 동네에 몰려 있는가'를 확인하는 데 쓴다. 인허가번호·사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 식품 인허가 데이터나 상권 데이터와는 업소명·주소를 맞춰 보거나 주소를 지오코딩해서 이어 쓴다.
description_portal: '제과점의 업종명, 업소명, 소재지 주소, 전화번호 등을 수록한 데이터.지역 내 제과·제빵 업소의 분포 현황을 파악하고, 소상공인 지원, 외식 산업 분석, 식품 위생 관리, 주민 생활 편의 증진 및 상권 활성화 정책 등에 활용 가능하다.활용 목적 및 특징– 업종별 제과점 등록 현황 및 분포 분석– 업소명·주소 기반 입지 특성 및 상권 연계 분석– 제과·제빵 산업 현황과 위생 관리 정책 자료 활용– 소상공인 지원 및 생활 편의 서비스 강화 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 업종명: 제과점 업종 구분● 업소명: 등록된 제과점의 명칭● 소재지주소: 제과점이 위치한 도로명 주소● 소재지전화번호: 업소의 공식 연락처'
