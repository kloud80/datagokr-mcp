summary_user: 식품의약품안전처의 식품첨가물 생산실적 보고를 업소·품목·보고연도 단위로 담은 전국 데이터로, 업소명·주소, 품목명·유형, 연간 생산능력과 생산량 필드가 있습니다. 식품첨가물 시장을 보는 분석가나 사업자가 "어느 업체가 어떤 첨가물을 한 해에 얼마나 생산했나"를 확인하는 데 쓴다. 인허가번호(LCPMT_NO)와 품목제조보고번호(ITEM_MNFTR_RPT_NO)로 보이는 컬럼이 있어 식품 인허가 업소나 품목제조보고 데이터와 번호·이름을 맞춰 연결하지만, 실측상 전역 조인 키로는 확인되지 않았다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 식품첨가물생산실적보고현황 정보입니다.\""
