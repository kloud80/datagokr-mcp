summary_user: 식품의약품안전처가 관리하는 위생용품 업소의 폐업 정보를 업소별 건 단위로 담으며, 대표자명·업종·허가일자·폐업일자·폐업상태·주소·인허가번호·업소명이 들어 있고 범위는 전국이다. 위생용품 제조·처리 업체가 아직 영업 중인지 폐업했는지, 언제 문을 닫았는지 확인하려는 사업자·소비자나 업종별 폐업 추이를 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 인허가번호·업소명·주소 같은 이름·코드 매핑이나 같은 기관(식약처) 코드로만 연결하며, 식품 인허가 업소·위생 지정 정보와 나란히 놓고 본다.
description_portal: 식품의약품안전처에서 관리하는 대표자명, 업종, 허가일자, 폐업일자, 페업상태, 주소, 기관명, 인허가번호, 업소명 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 위생용품 분야의 정보 제공, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
