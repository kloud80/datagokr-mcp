description_portal: 경기도 양평군 내 모범음식점 현황영업 중인 양평군 내 모범음식점 데이터를 제공합니다.(업종명, 업소명, 소재지, 전화번호 등)모범음식점이란 위생등급 기준에 따라 위생관리 상태 등이 우수한 식품접객업소를 대상으로 지정업소를 말하며해당 모범음식점은 매년 재지정 평가절차를 걸쳐 위생평가를 진행하며 관리하고 있습니다.재지정 평가시 평가표에 따라 현장펴가를 실시하며 작년 적합을 받았다고 하더라도 올해 미흡하면 부적합으로 모범음식점 지정취소가 될 수 있습니다.향후 식품접객업소 등에 대한 위생수준 평가를 ‘음식점 위생등급제’로 일원화 하고, 모범업소 제도를 폐지하는 재용으로 관련 법령이 개정되었으며 2028. 7. 1. 시행으로 일원화될 예정입니다.업소 현황에 대해 자세한 사항은 양평군청 보건소 홈페이지에서 확인하시기 바랍니다.(대표메뉴, 휴무일, 영업시간, 좌석수, 주차대수, 유아의자 수)https://www.yp21.go.kr/health/index.do
