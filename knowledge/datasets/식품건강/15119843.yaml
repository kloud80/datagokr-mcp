summary_user: 경기도 음식점 위생등급 지정 현황을 업소 단위로 담으며, 시군명, 업소명, 도로명·지번 주소, 지정일자(apnt_ymd), WGS84 위경도가 들어 있다. 경기도에 사는 소비자가 '우리 동네에서 위생등급을 받은 음식점은 어디인가'를 찾거나, 분석가가 시군별 지정 업소 분포를 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없고 인허가번호도 보이지 않아, 식품 인허가 업소 원장 등과는 업소명·주소 매칭으로 잇고, 위경도로 지도나 다른 공간 데이터와 겹쳐 본다.
description_portal: 이 데이터는 음식점위생등급제에 따라 전국 음식점의 위생 수준을 평가하고 그 결과를 등급으로 지정한 현황을 수록한 자료입니다. 등급은 "매우우수", "우수", "좋음"으로 구분되며, 각 음식점의 이름과 주소, 등급, 지정일자, 지정기관 등의 정보가 포함되어 있습니다. 이 자료는 위생 관리 수준이 높은 음식점을 소비자가 쉽게 선택할 수 있도록 도와주고, 전반적인 음식점 위생수준 향상과 식중독 예방을 목적으로 활용됩니다. 또한 외식산업의 신뢰도를 높이고 공공 식품안전 정책의 기반 자료로 활용될 수 있습니다. 지역별 음식문화 수준 분석, 위생등급제 확산 효과 측정, 정책 수립을 위한 분석 자료로도 활용이 가능합니다.
