description_portal: 'ㅇ데이터기준일자까지 관할 기관에 영업신고가 되어 있으며 전북특별자치도 순창군 내에 위치한집단급식소의 현황을 파일로(업종명, 업소명, 소재지(도로명주소), 전화번호, 업태명 등으로 구분하여) 정보를 제공합니다.ㅇ업종명: 집단급식소, 업소명: 집단급식소 명칭, 소재지: 도로명주소, 전화번호: 소재지 전화번호입니다ㅇ집단급식소: 학교, 유치원, 사회복지시설, 병원, 산업체 등이 있음ㅇ소재지 전화번호가 핸드폰 번호로 신고된 경우 개인정보 보호로 인해 제공되지 않습니다.ㅇ전화번호는 현재 보유하고 있는 자료만 공개되어, 공란이 있을 수 있으니 유의해 주시기 바랍니다.'
