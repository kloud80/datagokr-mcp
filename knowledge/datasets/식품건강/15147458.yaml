summary_user: 서울 동작구 소독업 업소를 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소·폐업 일자와 영업상태, 사업장명·주소·전화, 중부원점TM(EPSG:5174) 좌표, 사무실·소독차량 차고 면적, 분무기·방독면·보호복 같은 소독 장비 보유 수를 담는다. 주민이나 관리사무소가 '동작구에서 지금 영업 중인 소독업체는 어디이고 어떤 장비를 갖췄나'를 확인하거나, 분석가가 지역 방역·위생 서비스 공급 현황을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·개방서비스 코드로만 이어 쓴다.
description_portal: '동작구의 전염병 및 각종 세균이나 유해 해충의 소독을 목적으로 만들어진 업소정보를 제공합니다.소독업 인허가 정보 데이터는 소독 및 위생 관리 서비스를 제공하는 업체 현황을 담고 있습니다.영업상태, 전화번호, 우편번호, 주소(도로명주소), 사업장명, 좌표정보, 사무실면적, 소독차량차고면적, 소독에 필요한 장비 물품 수 등의 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
