description_portal: 의약품 적정사용(Drug Utilization Review, 이하 DUR)은 병용 시 또는 어린이, 노인, 임부에게 투여 시 주의해야 하는 의약품 정보 등을 알리고, 정해진 기준에 따라 약물 사용이 적절하게 이뤄지는지 점검하고 평가하는 제도입니다.“특정연령대 금기 성분”이란 소아, 노인 등 특정한 연령대의 환자가 사용함에 있어 안전성이 확보되지 않았거나 심각한 부작용 발생 등의 우려가 있어 사용하지 않아야 하는 유효성분을 말합니다.다만, 의사의 판단 하에 치료적 유익성과 위험성을 고려하여 처방이 가능합니다.한국의약품안전관리원, 식품의약품안전처는 부작용 발생 빈도 증가 등의 누려가 있어 사용 시 주의가 필요한 유효성분에 대해 DUR정보(5개 주의성분 공고 기준)를 제공하고 있으며, 한국의약품안전관리원 대표 홈페이지에서 다운로드 받을 수 있는 DUR정보는 성분 기준의 정보이고, 본 자료는 해당 성분에 대한 정보가 적용되는 의약품 기준의 정보로 주기성으로 게시되지 않습니다. 또한, 본 자료의 상세내용에 기재된 내용은 필수 항목이 아니므로, 추가 사항이 기입되지 않은 건들이 포함되어 있는점 유의 부탁드립니다.* 최신의 정확한 DUR정보는 아래에서 확인하실 수 있습니다.(성분 정보) 한국의약품안전관리원 누리집 > DUR정보 > DUR정보검색 (또는 다운로드 받기) 활용 (고시·공고 변경 시 업데이트)※ 본 정보는 비상업적 연구 또는 교육에만 사용할 수 있으며, 상업적 목적으로 활용하는 경우 한국의약품안전관리원의 사전 승인을 받아야만 합니다.
