summary_user: 경상남도 양산시에 등록된 동물미용업소를 한 업소당 한 행으로 담은 파일 목록으로, 업소명·소재지(도로명주소)·전화번호·데이터기준일자를 담는다. 반려동물을 키우는 양산 시민이 "집 근처에 동물미용실이 어디 있고 연락처가 무엇인가"를 확인하거나, 분석가가 시 안 동물미용업소 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 문자열을 맞추거나 같은 양산시의 다른 업종 현황과 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 경상남도 양산시 관내에 있는 동물미용업 현황 데이터를 제공합니다. 이러한 정보는 반려동물을 키우는 시민들이 가까운 미용업소를 쉽게 찾을 수 있도록 도와줄 수 있습니다.* 주요 데이터 컬럼별 상세설명○ 업소명 →  경상남도 양산시 관내에서 동물미용업으로 등록하여 영업 중인 업체명○ 전화번호 → 경상남도 양산시 관내 동물미용업 업체의 대표 전화번호○ 소재지(도로명주소) → 경상남도 양산시 관내 동물미용업 업체 소재지 도로명주소관내에 있는 동물미용업 현황에 대한 데이터로 업소명, 소재지, 전화번호, 데이터기준일자 항목을 제공합니다.
