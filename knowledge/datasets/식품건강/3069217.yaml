summary_user: 원주시 관내 기타식품판매업 영업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·데이터기준일만 있습니다(6.5KB 규모의 CSV). 원주시에서 마트·협동조합·전문 판매소 같은 식품 소매업소가 어느 동네에 몰려 있는지 보려는 분석가나 창업 예정자가 입지·밀집도를 살필 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·도로명 주소를 맞춰 붙여야 한다.
description_portal: 이 데이터는 강원특별자치도 원주시 관내에서 운영 중인 기타식품판매업 영업소 현황을 수록한 자료로, 식품위생 관리, 유통판매업 모니터링, 지역경제 분석 등의 목적으로 수집되었습니다.수록 항목은 업종명, 업소명, 도로명 주소, 데이터 기준일자로 구성되어 있으며, 지역 내 유통·판매 기반 식품 관련 소매업소 정보를 파악하는 데 유용합니다.이 데이터는 마트, 협동조합, 전문 판매소 등의 입지 분석, 식품안전관리 대상 추출, 지역별 생활 인프라 밀집도 파악, 민원 대응 행정 기초자료로 활용될 수 있습니다.또한, 지역유통 생태계의 공공-민간 협력 기반 형성, 식품유통기업의 입지전략 수립, 소상공인 지원 정책 설계 등의 민간 활용 가능성도 높습니다.
