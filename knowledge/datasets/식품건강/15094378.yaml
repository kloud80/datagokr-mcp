summary_user: 부산 수영구 안에서 영업하는 개인 카페와 프랜차이즈 카페(커피숍·다방 등 휴게음식점)를 업소 한 곳씩 담은 목록 파일로, 업종명·업소명·도로명 주소·전화번호가 들어 있다. 창업 예정자나 상권 분석가가 수영구의 특정 동네에 카페가 얼마나 몰려 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 식품 인허가 데이터와는 업소명·도로명 주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 부산광역시 수영구_개인 카페 및 프랜차이즈 현황 데이터는 부산광역시 수영구 내의 개인이 운영하는 카페 및 프랜차이즈 카페 현황에 대한 데이터로서 업소명, 주소, 전화번호를 포함하고 있습니다.해당 데이터는 커피와 간단한 음식을 파는 업태가 커피숍, 다방 등인 업소가 해당됩니다.휴게음식점은 식품접객업이며주로 다류(茶類), 아이스크림류 등을 조리ㆍ판매하거나 패스트푸드점, 분식점 형태의 영업 등 음식류를 조리ㆍ판매하는 영업으로서 음주행위가 허용되지 아니하는 영업. 다만, 편의점, 슈퍼마켓, 휴게소, 그 밖에 음식류를 판매하는 장소(만화가게 및 「게임산업진흥에 관한 법률」 제2조제7호에 따른 인터넷컴퓨터게임시설제공업을 하는 영업소 등 음식류를 부수적으로 판매하는 장소를 포함한다)에서 컵라면, 일회용 다류 또는 그 밖의 음식류에 물을 부어 주는 경우는 제외합니다.
