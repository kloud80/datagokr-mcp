summary_user: 바코드와 연계된 식품 제품 정보를 제품 한 건 단위로 담으며, 품목보고번호·보고일·생산중단일·제품명·소비기한·식품유형·제조사명·업종·주소·폐업일자·유통바코드를 포함하고 범위는 전국이다. 소비자나 유통 사업자가 상품 바코드로 어느 제조사가 어떤 식품유형으로 품목보고한 제품인지, 생산이 중단됐는지 확인하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았지만, 품목제조보고번호(PRDLST_REPORT_NO)와 바코드(BAR_CD)로 같은 기관의 영양성분·원재료·회수/부적합 정보와 제품 단위로 잇는 것이 이 부문의 쓰임새다.
description_portal: 바코드 연계 제품 정보입니다. 품목보고(신고)번호 , 보고(신고일) , 생산중단일 , 제품명 , 소비기한 , 식품 유형 , 제조사명 , 업종 , 주소 , 폐업일자 , 유통바코드의 속성정보를 제공합니다. 바코드연계제품 정보는 대한상공회의소 유통물류진흥원에서 유료로 제공되는 정보로서 유통물류진흥원의 요청에 따라 2018년 이후로 최신화가 중단되었음을 안내해드리니 이용에 참고하시기 바랍니다. 이 자료를 통하여 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
