summary_user: 전국 주요 하천·호소의 조사지점(조사지역명)별 수질 측정 결과를 채수일자·검사일자 단위로 담으며, 수온·유량·pH·BOD·COD·SS·대장균군수·총질소(TN)·총인(TP)·DOC·EC·TOC 등 측정 항목이 들어 있다. 거주지 주변 하천의 BOD·총인 수치가 시기별로 어떻게 달라졌는지 확인하려는 시민이나 오염 추이를 분석하는 연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 조사지역명 같은 이름 매핑으로만 이어 쓰며, 같은 부문의 식품 제품 DB처럼 품목제조보고번호·바코드로 붙일 수는 없다.
description_portal: 해당 데이터는 전국 주요 하천 및 호소의 수질현황 및 물환경 데이터를 제공하고 있습니다. 이 정보는 조사지역명, 검사일자, 채수일자, 수온, 유량, PH, BOD, COD, SS, 대장균군수량, TN, TP, DOC, EC, TOC 등의 측정 항목을 포함하며, 이를 통해 물환경의 상태를 파악하고 변화를 모니터링할 수 있도록 합니다.해당 데이터를 통해 시민들이 거주 지역 주변의 하천 및 호소 수질 정보를 실시간으로 확인하여 생활 환경의 안전성을 판단하는 등, 환경 관련 연구 기관이 수질 변화 추이를 분석하여 오염 원인을 규명하고 해결 방안을 모색하는 등의 효과를 기대할 수 있습니다.이를 통해 지역 주민들이 물환경에 대한 이해를 높이고 환경 보전 활동에 참여를 유도하며, 더 나아가 국내 물환경 관리 및 보존 정책 수립에 필요한 과학적인 근거를 마련하는 데에 기여할 수 있습니다.
