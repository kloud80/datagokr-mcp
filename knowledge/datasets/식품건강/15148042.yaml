summary_user: 서울 구로구의 건강기능식품일반판매업 인허가 업소를 업소 한 곳당 한 행으로 담은 원장으로, 인허가일자·영업상태(영업/폐업)·폐업일자·사업장명·지번/도로명 주소·좌표·시설 면적 등이 들어 있다. 건강기능식품 판매 창업을 검토하는 사업자나 상권 분석가가 '구로구 안에서 현재 영업 중인 건강기능식품 판매점은 어디에 몇 곳 있는가'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드, 관리번호)로만 연결하고, 좌표로 지도·공간 분석에 얹어 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 건강기능식품일반판매업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 관련 시설의 면적, 건축물 연면적, 업태구분 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 정책 수립, 연구 분석, 민원 처리, 위생 관리 등 여러 분야에 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계할 수 있어 정보 접근성을 높이고 행정 투명성을 높이는 기반 자료로 기능한다. 데이터 구조가 표준화되어 비교와 통계 작성이 용이하다.
