summary_user: 서울특별시 동작구에서 유산균 음료·어류·조개류처럼 부패·변질되기 쉬운 식품을 운반하는 식품운반업 업소를 업소 1곳당 1행으로 담은 인허가 원장으로, 인허가일자·영업상태·지번/도로명 주소·사업장명·전화번호·중부원점TM 좌표(X, Y)를 담는다. 동작구에서 지금 영업 중인 냉장·냉동 식품운반업체가 어디에 몇 곳 있는지, 언제 인허가를 받았고 폐업했는지를 확인하려는 사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 식품 인허가·행정처분 데이터와는 사업장명·주소 매칭이나 같은 개방자치단체코드(OPNSFTEAMCODE)·관리번호(MGTNO) 기준으로만 이어 쓴다.
description_portal: '서울시 동작구 식품운반업 인허가 정보 (https://data.seoul.go.kr/dataList/OA-18221/S/1/datasetView.do) 입니다.동작구의 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소정보를 제공합니다.인허가일자, 영업상태명, 지번주소, 도로명주소, 도로명우편번호, 사업장명, 전화번호 등의 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음'
