summary_user: 서울 강서구 안에서 식육·알·원유 등을 가공해 햄·소시지·우유·치즈 같은 축산 가공품을 만드는 축산가공업 인허가 업소를 업소 한 곳당 한 행으로 담은 원장으로, 인허가일자·폐업일자·영업상태·사업장명·지번/도로명 주소·좌표(X, Y) 항목이 있다. 소비자나 사업자가 '강서구에서 지금 영업 중인 축산가공업체는 어디이고 언제 허가받았나'를 확인하거나, 관할 위생 점검 대상 목록을 만드는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 연결하며, 다른 시군구의 같은 형식 인허가 데이터와 합쳐 지역 비교에 쓴다.
description_portal: 서울특별시 강서구 내에서 축산물을 원료로 가공·처리하여 식용제품으로 제조하는 축산가공업 인허가 업체 정보를 제공합니다. 축산가공업은 식육, 알, 원유 등을 이용해 햄, 소시지, 전란분, 우유, 치즈 등의 다양한 축산 가공품을 생산하며, 국민 식생활과 밀접하게 연관된 산업입니다. 해당 업종은 식품위생법 및 축산물위생관리법 등에 따라 엄격한 시설기준과 품질관리를 요구받으며, 위생설비, 작업장 구조, 종사자 위생관리 등이 법적 기준을 충족해야 인허가가 부여됩니다. 본 데이터는 인허가일자, 사업장명, 영업상태, 주소, 문화체육업종명 등의 항목으로 구성되어 있어, 관할 행정기관의 관리감독, 위생 점검, 정책 수립, 식품안전 체계 구축에 활용될 수 있습니다. 또한 소비자 보호 및 안전한 축산물 유통 환경 조성을 위한 공공 데이터로서의 가치도 큽니다.
