summary_user: 제주특별자치도가 지정한 향토음식점을 업소 한 곳당 한 행으로 담은 파일로, 지정번호·관리기관(시)·업소명·소재지 주소·향토음식 주메뉴·연락처를 싣는다. 관광객이나 도민이 '제주 고유 음식을 내는 도 지정 식당이 어디에 있고 대표 메뉴가 무엇인가'를 찾을 때, 분석가가 향토음식점의 지역별 분포를 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장 등과는 업소명·소재지 주소를 맞춰 이어야 한다.
description_portal: '제주특별자치도 내에 소재하고 있는 향토음식점 지정과 관련한 데이터를 제공합니다.항목: 지정번호, 관리기관, 업소명, 소재지, 향토음식 주메뉴, 연락처*「제주특별자치도 향토음식 육성 및 지원 조례」- 조상들의 맛과 멋을 발굴·계승시켜 나감은 물론, 향토음식의 관광상품화를 통해 도민의 새로운 이익 창출에 이바지함- 향토음식: 지역의 특산물을 이용하거나 지역의 독특한 조리법으로 조리되어 지역고유의 맛을 내는 향토색 있는 음식과 이를 기본으로 개발된 새로운 음식 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=2274'
