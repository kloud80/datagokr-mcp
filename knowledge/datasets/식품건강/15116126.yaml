summary_user: 서울특별시 양천구 관내 유통전문판매업소(직접 제조하지 않고 식품을 판매업소에 유통하는 업소)의 등록·변경·휴폐업 인허가 내역을 업소 한 곳당 한 행으로 담은 원장으로, 인허가일자·영업상태·폐업일자·주소·좌표·소재지면적·종사자수 등을 포함한다. 식품 유통업 창업을 검토하는 사업자나 지역 분석가가 "양천구에서 영업 중인 유통전문판매업체가 어디에 몇 곳 있고 최근 얼마나 폐업했나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 관리번호(MNG_NO)·기관코드, 업소명·주소 매칭, 좌표로 이어 붙이며, 같은 체계의 다른 식품 인허가 업종 데이터와 함께 쓴다.
description_portal: 본 데이터는 서울특별시 양천구에서 유통 구조의 건전성과 소비자 안전을 확보하기 위하여 관내 유통전문판매업체의 등록, 변경, 휴폐업 등 인허가 처리 현황을 정리한 자료이다. 이 자료에는 사업장의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등의 주요 항목을 포함하여 업체의 운영 상태를 체계적으로 파악할 수 있도록 한다. 또한 지역 내 유통업 환경의 변동을 분석하고 관련 정책 수립, 행정 점검 계획 수립, 대국민 정보 제공 등에 활용할 수 있는 기초자료로 제공된다.＊유통전문판매업－직접 제조하지 않고 식가공류 제공을 위해 판매 업소에 유통하는 업소
