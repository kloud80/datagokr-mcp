summary_user: 부산광역시 사상구에 영업신고된 세탁업소를 업소별로 담은 파일로, 업종명·업소명·도로명 주소·전화번호를 담는다(2026.06.17. 기준, 의료기관세탁물 처리업은 빠짐). 주민이 "사상구 내 우리 동네 근처 세탁소는 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 구 단위 세탁업소 분포를 주소로 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 잇거나 같은 기관(사상구)의 다른 공중위생업소 현황과 나란히 놓고 쓴다.
description_portal: '해당 자료는 부산광역시 사상구에 영업신고된 세탁업 현황(2026.06.17. 기준)에 대한 정보를 제공합니다.업소에 대한 기본정보(업종명, 업소명, 소재지주소, 업소전화번호)로 구성된 데이터입니다.*세탁업: 의류 기타 섬유제품이나 피혁제품등을 세탁하는 영업세탁업 영업 관련 세부 사항에 대한 부분은 「공중위생관리법」, 세탁업 표준약관(공정거래위원회)을 참고바랍니다.의료기관세탁물 처리업(병상을 갖춘 의료기관에서 발생하는 세탁물의 처리)에 관한 데이터는 포함되어 있지 않음을 알려드립니다.'
