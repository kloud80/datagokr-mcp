summary_user: 대전광역시 동구에 있는 즉석판매제조가공업소(건강원·방앗간 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 소재지·전화번호를 담는다. 소비자가 동구에서 가까운 건강원·방앗간을 찾거나, 사업자가 동구 안 즉석판매제조가공업소의 분포를 보고 상권을 가늠할 때 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)가 없으므로, 다른 데이터와는 업소명이나 주소 문자열을 맞춰 붙여야 한다.
limits: 범위는 대전 동구 한 곳뿐이라 다른 자치구나 전국과 비교하려면 별도 데이터를 모아야 한다. 인허가번호·좌표 같은 고유 키가 없어 위생 지정이나 행정처분 정보와 정확히 잇기 어렵고, 업소명·주소 매칭에 의존해야 한다.
