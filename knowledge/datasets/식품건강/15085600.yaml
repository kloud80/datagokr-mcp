summary_user: 경기도 파주시에서 건강식품을 통신판매하는 업체를 한 곳씩 담은 업소 목록으로, 상호명·대표자명·통신판매번호·도로명/지번 주소·위도·경도·취급품목을 담는다. 소비자가 온라인으로 산 건강식품 판매처가 파주시에 통신판매업 신고된 업체인지 확인하거나, 분석가가 파주시 안에서 건강식품 통신판매업체가 어디에 몰려 있는지 지도로 볼 때 쓴다. 전역 조인 키는 없어 다른 식품 인허가·행정처분 데이터와는 상호명·주소 매칭이나 좌표로만 이어 쓰며, 통신판매번호(통신판매번호)는 같은 체계를 쓰는 통신판매업 신고 데이터와 대조하는 단서가 된다.
description_portal: 경기도 파주시 건강식품 통신판매업체에 대한 공공데이터로, 행정구역 정보인 시도명, 시군구명, 사업자 식별이 가능한 상호명, 대표자명, 위치를 파악할 수 있는 도로명주소 및 지번주소, 공간 기반 분석이 용이한 위도 및 경도 데이터, 통신판매번호, 각 업체의 주요 판매 품목을 이해하는 데 도움을 주는 취급품목 항목 등으로 구성되어 있습니다. 본 데이터셋은 지역별 건강식품 판매업 밀집도 분석, 특정 지역 건강식품 관련 산업 활성화 정도 파악, 건강식품 유통 실태 파악, 소비자 안전 보호 정책 수립, 건강식품 유통 경로 분석, 지역별 건강 소비 트렌드 연구, 중복 사업자·허위 등록 여부 탐지 알고리즘 적용 등에 활용될 수 있습니다.
