description_portal: 식품의약품안전처 「수입위생용품 일반 현황」 OpenAPI는 국내로 수입된 위생용품의 일반 현황 정보를 제공하는 공공데이터입니다. 주요 제공 항목으로는 수입위생용품 품목(유형)별 현황, 제품구분별 현황, 제조국별(원산지) 현황 정보가 포함되어 있습니다. 이를 통해 사용자는 특정 위생용품이 어느 업체에서 언제 수입되었는지 확인할 수 있으며, 제품의 분류와 허가·신고 상태도 함께 파악할 수 있습니다. 또한, 누적 데이터를 분석해 국가별·제품별 수입 현황을 살펴볼 수 있고, 허가·신고 정보를 참고해 제품의 수입 절차를 검토하는 데 활용할 수 있습니다.
