summary_user: 국내로 수입된 위생용품을 품목(유형)·제품구분·제조국별로 묶은 전국 단위 집계 현황입니다. 이름(KOR_NM) 기준으로 신고 건수·중량과 적합·부적합 건수·중량이 함께 실려 있으며, 이는 필드명으로 추정한 의미입니다. 수입업자나 분석가가 어느 나라에서 어떤 유형의 위생용품이 얼마나 들어오고 그중 부적합이 얼마나 되는지 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 수입식품 등 같은 기관의 다른 데이터와는 품목명·국가명을 맞춰서만 이을 수 있습니다.
limits: 집계 수치만 담겨 있어 개별 수입 건이나 업체를 추적하는 용도에는 맞지 않는 것으로 보이며, 필드 명세가 비어 있어 각 수치의 정확한 정의는 확인이 필요합니다. 지역별로 나누지 않은 전국·비공간 데이터이고 다른 데이터와 잇는 코드가 없습니다. 개발계정 호출 한도는 하루 10,000회입니다.
