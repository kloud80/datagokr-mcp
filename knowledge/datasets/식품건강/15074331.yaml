summary_user: 식품 품목유형 코드표로, 품목코드별 한글명·영문명·정의와 계층 수준, 상위·최상위 품목코드, 유효 시작·종료일, 사용 여부를 전국 단위 비공간 기준정보로 담는다. 분석가나 식품 사업자가 "이 제품의 품목유형 코드는 어느 상위 식품군에 속하고 지금도 유효한가"를 확인하거나, 품목제조보고·영양성분 같은 제품 DB의 품목유형 코드를 사람이 읽을 수 있는 이름과 분류 계층으로 풀 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 식품의약품안전처 데이터의 품목코드나 품목명을 매핑해서 잇는다.
description_portal: 레벨 , 품목코드 , 한글명 , 영문명 , 정의 , 유효개시일자 , 유효종료일자 , 상위품목코드 , 최상위품목코드 , 조합품목여부 , 속성일련번호 , 속성한글명 , 품목여부 , 수정사유 , 사용여부 , 비고 , 식품군여부 , 최종수정일 등의 항목을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
