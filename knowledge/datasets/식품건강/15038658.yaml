description_portal: '여주시 관내 공중위생업소에 대한 정보현재 영업 중인 관내 공중위생업소에 대한 데이터를 제공합니다.(업종명, 업소명, 도로명주소,  소재지전화)* 공중위생업소 종류: 이용업, 미용업, 목욕업, 세탁업, 숙박업, 건물위생관리업- 이용업: 손님의 머리카락 또는 수염을 깎거나 다듬는 등의 방법으로 손님의 용모를 단정하게 하는 영업- 미용업: 손님의 얼굴, 머리, 피부 및 손톱·발톱 등을 손질하여 손님의 외모를 아름답게 꾸미는 영업- 목욕업: 물로 목욕을 할 수 있는 시설 및 설비 등의 서비스를 제공하는 영업맥반석·황토·옥 등을 직접 또는 간접 가열하여 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스를 제공하는 영업- 세탁업: 의류 기타 섬유제품이나 피혁제품등을 세탁하는 영업- 숙박업: 손님이 잠을 자고 머물 수 있도록 시설 및 설비 등의 서비스를 제공하는 영업- 건물위생관리업: 공중이 이용하는 건축물·시설물등의 청결유지와 실내공기정화를 위한 청소등을 대행하는 영업'
