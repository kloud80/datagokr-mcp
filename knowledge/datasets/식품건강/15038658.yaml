summary_user: 여주시 관내에서 영업 중인 공중위생업소(이용·미용·목욕·세탁·숙박·건물위생관리업)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·신고일자·도로명/지번 주소·전화와 객실수·의자수·세탁기수 같은 시설 규모를 함께 싣는다. 주민이나 사업자가 '여주시 어느 동네에 미용실이나 목욕탕, 숙박업소가 몇 곳 있고 연락처는 무엇인가'를 확인하거나, 분석가가 업종별 업소 분포와 시설 규모를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 업소명·주소 문자열로 맞춰 이어야 하며, 같은 기관의 다른 위생·인허가 자료와도 같은 방식으로 연결한다.
limits: 여주시 한 시군구만 담으므로 다른 지역과 비교하려면 지역별 파일을 따로 모아야 한다. 업소 고유 식별 코드가 없어 다른 데이터와 붙일 때 이름·주소 매칭 오류가 생길 수 있다.
