summary_user: 경기도 내 생선회·활어회 등을 파는 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·종업원 수·시설규모와 주소·위경도 좌표를 포함한다. 횟집 창업을 검토하는 사업자나 상권 분석가가 '이 시군에 영업 중인 횟집이 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 음식점·상권 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 생선회, 활어회, 해산물 요리 등을 전문으로 제공하는 일반음식점의 인허가 및 영업현황 정보를 포함합니다. 주요 항목은 사업장명, 인허가일자, 폐업일자, 영업상태, 위생업종명, 위생업태명, 급수시설구분, 종업원 수, 다중이용업소 여부, 소재지 정보(도로명주소, 지번주소, 위도·경도), 총시설규모 등으로 구성됩니다. 해당 데이터는 지역 내 수산물 기반 외식업 동향 파악, 식품위생 관리 정책 수립, 해산물 전문 상권 개발, 안전 관리체계 구축 등에 활용될 수 있습니다. 데이터는 경기도 31개 시군 전체를 포괄하며 Open API를 통해 실시간 정보 연계가 가능합니다.
