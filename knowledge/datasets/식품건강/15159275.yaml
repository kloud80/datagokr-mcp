description_portal: 「식품위생법」에 따른 서울특별시 서초구 내 설치,운영 신고된 산업체 집단급식소의 공공데이터 입니다. 집단급식소의 정의는 영리를 목적으로 하지 아니하면서 특정 다수인에게 계속하여 음식물을 공급하는 다음 어느 하나에 해당하는 곳의 급식시설로서 1회 50명 이상에게 식사를 제공하는 급식소를 이야기 합니다. 그런데, 산업체 집단급식소는 영리를 목적으로 하는 업체에서 운영하는 집단급식소라고 정의하며, 예를들어 제조업체, 연구기관, 기업체 연수원등이 해당이 됩니다. 이번 자료에서는 서울특별시 서초구 관내 산업체 집단급식소의 위치와 운영 현황을 체계적으로 파악할 수 있도록 도와주며, 업종명, 업소명, 소재지, 소재지 전화번호 등 항목을 해당 데이터기준일자로 정보를 제공합니다. 이 자료를 통해 서울특별시 서초구에서 운영하고 있는 집단급식소 업소들의 이름과 법인명, 소재지명 도로주소, 소재지 전화번호, 영업장 시작일, 평균 급식인원수, 최대 급식인원수, 직영인지 위탁인지에 대한 운영형태를 알 수 있습니다.
