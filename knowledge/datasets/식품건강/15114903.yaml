description_portal: 본 데이터 파일은 대전광역시 서구 관내에서 어린이 기호식품을 조리하거나 판매하는 업소의 현황 정보를 수록한 자료입니다.○ 수록 업소는 ｢어린이 식생활안전관리 특별법｣에 따라 관리 대상에 해당하는 식품취급업소로 구성되어 있습니다.○ 업소 유형에는 일반음식점, 휴게음식점, 제과점, 기타식품판매업, 식품자동판매기업(자판기), 편의점, 학교매점, 문구점, 슈퍼마켓 등이 포함됩니다.○ 각 업소에 대해 업소명, 업종 구분, 소재지(도로명주소), 주요 취급 품목 등 관련 정보가 정형화된 항목으로 제공됩니다.○ 본 데이터는 어린이 식품안전관리를 위한 기초자료로 활용되며, 위생 점검 및 지도대상 업소 선정, 안전관리 사각지대 해소 등의 행정업무에 활용됩니다.○ 또한, 지역 내 어린이의 건강한 식생활 환경 조성, 식품 안전 교육자료 개발, 관련 정책 수립 등 실무적‧정책적 목적으로 제공됩니다.
