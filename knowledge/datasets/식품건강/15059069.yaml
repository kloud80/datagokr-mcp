summary_user: 식품위생법에 따른 식품첨가물공전, 곧 식품첨가물의 기준 및 규격을 품목·시험항목 단위로 담는 전국 범위의 기준 자료로, 품목명·시험항목명과 최소·최대 기준값, 단위, 적용 시작·종료일을 행마다 담는다. 식품 제조·수입 사업자나 분석가가 "이 첨가물의 시험항목별 허용 기준값은 얼마이고 언제부터 적용되나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 품목코드(PRDLST_CD)·시험항목코드나 품목명 매핑으로 같은 기관의 식품 기준규격·원재료·첨가물 자료와 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 식품위생법에 따른 식품첨가물공전(식품첨가물의 기준 및 규격) 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
