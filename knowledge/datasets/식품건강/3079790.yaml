description_portal: 전북특별자치도 전주시 모범음식점 현황 데이터는 「식품위생법」 제47조(위생등급) 및 같은 법 시행규칙 제61조(우수업소·모범업소 지정 등)에 따라 지정된 전주시 관내 모범음식점 정보를 시민에게 투명하게 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 업소명, 전화번호, 도로명주소, 지번주소, 위도, 경도 등의 정보를 포함하여 모범음식점의 위치 및 기본 현황을 체계적으로 확인할 수 있도록 구성되었습니다.특히 위치정보(위도·경도)와 연락처 정보를 함께 제공하여 시민과 관광객이 위생 수준이 우수한 음식점을 쉽게 검색하고 이용할 수 있도록 설계되었으며, 지역 관광 활성화, 위생관리 정책 홍보, 외식업 환경 개선 연구 등 다양한 분야에서 활용할 수 있습니다. 또한 지도 기반 서비스 개발 및 공공서비스 연계 자료로도 활용이 가능합니다.전주시는 본 데이터를 통해 식품위생 행정의 투명성을 제고하고 시민의 안전한 외식환경 조성을 지원하는 것을 목표로 하며, 신규 지정, 지정 취소 및 변경 사항 등을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 양구청 청소위생과에서 제공·관리합니다.
