summary_user: 인천광역시 계양구에 있는 제과점영업 인허가 업소를 업소 한 곳당 한 행으로 담은 CSV 파일(약 13KB)로, 업종·업태명, 업소명, 도로명·지번 소재지, 영업자 시작일, 인허가일자를 담는다. 계양구에서 제과점을 열려는 창업자나 상권 분석가가 '어느 동네에 제과점이 몰려 있고 최근 몇 년 새 얼마나 새로 생겼나'를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 소재지 주소나 업소명을 맞춰 연결해야 하고, 같은 부문의 다른 식품 인허가 업소 목록이나 위생·행정처분 자료와도 이 방식으로 이어 쓴다.
limits: 인허가번호·사업자번호·좌표 같은 전역 키가 실측 컬럼에 없어 다른 데이터와 정확히 조인하기 어렵고, 주소·업소명 매칭에 의존해야 한다. 범위는 계양구 한 곳에 한정되어 인천 전체나 전국 비교에는 다른 시군구 자료를 따로 모아야 한다.
