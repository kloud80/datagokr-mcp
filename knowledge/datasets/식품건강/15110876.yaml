summary_user: 영주시 관내 일반음식점 가운데 좌식테이블을 입식테이블로 바꾸는 설치 지원을 받은 업소를 업소 한 곳씩 담은 건별 목록으로, 지원연도(SPORT_YEAR)·업소명·대표자·주소·전화번호를 포함하며 범위는 영주시 한 곳이다. 무릎이 불편한 어르신이나 휠체어 이용자가 영주에서 입식 테이블이 있는 식당을 미리 찾거나, 담당자가 연도별 지원 실적과 동별 분포를 점검하는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 식품 인허가 업소 원장 등 다른 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 공통 조인 키가 없어 다른 식품업소 데이터와 연결할 때 업소명·주소 매칭에 의존해야 하고 오매칭에 주의해야 한다. 범위가 영주시 한 곳뿐이라 다른 시군과 비교하거나 전국 현황을 보는 데는 쓸 수 없다.
