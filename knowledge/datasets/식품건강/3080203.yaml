summary_user: 경기도 동두천시에 있는 공중위생업소(숙박·목욕장·이용·미용·세탁·위생관리용역 등)를 업소 한 곳당 한 행으로 담은 건별 목록 파일로, 업종명·신고일자·업소명·도로명/지번 주소·위도·경도·영업장면적·전화번호를 담는다. 주민이나 창업 준비자가 "동두천시 안에서 특정 동네에 미용실·세탁소가 몇 곳 있고 어디에 있나"를 확인하거나 업종별 분포를 지도에 그리는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 업소명 매칭으로만 잇고, 같은 부문의 식품 인허가 업소·위생 지정 데이터와는 주소 기준으로 맞춰 본다.
description_portal: 경기도 동두천시에 위치한 공중위생업소(숙박업, 목욕장업, 이용업, 미용업, 세탁업, 위생관리 용역업, 위생처리업 등) 정보를 민원인에게 제공하고자 합니다.데이터 항목은 업종명, 신고일자, 업소명, 영업소 주소(도로명), 영업소 주소(지번), 위도, 경도, 영업장면적, 소재지전화번호의 정보입니다.데이터의 기준일자는 2025년 12월 04일입니다. 데이터에 대하여 추가적인 문의사항이 있으실 경우 농업축산위생과 위생팀 031-860-2234으로 문의주시기 바랍니다. 대표홈페이지에서 공중위생영업서비스 평가에 대한 정보도 확인해보실 수 있습니다.(https://www.ddc.go.kr/ddc/selectBbsNttList.do?bbsNo=66&key=512)
