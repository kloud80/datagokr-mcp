summary_user: 광주광역시 보건환경연구원이 2025년 한 해 동안 실시한 식중독균 검사의 검사실적(건)과 분리균주수를 담은 연간 집계 파일로, 파일 크기가 247바이트에 불과한 소규모 요약표다. 지자체 식품위생 담당자나 분석가가 '이 지역에서 한 해 식중독균 검사가 몇 건 이뤄졌고 균이 얼마나 분리됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 기관명으로만 맞춰 붙일 수 있고, 다른 연도 파일이나 다른 시도 보건환경연구원의 같은 성격 통계와 나란히 비교하는 용도에 맞다.
limits: 검사 대상 식품별·균종별·업소별 건별 결과는 없고 연간 합계 수준이라 오염 경로나 특정 업소 추적에는 쓸 수 없다. 조인 키가 없어 식품 인허가 업소나 행정처분 데이터와 직접 연결되지 않는다. 명세상 연간 단위로 생성된 뒤 바뀌지 않는 파일이므로 다른 연도는 별도 파일로 찾아야 한다.
