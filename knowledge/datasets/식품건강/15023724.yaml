description_portal: '광주광역시 보건환경연구원에서 실시한 식중독균 검사 현황입니다. 2025-01-01~2025-12-31의 검사실적(건) 및 분리균주수 등의 내용을 제공합니다.  ❍ 목적: 주요 식중독 원인식품 및 환경에 대한 식중독균 오염여부를  모니터링하여 오염경로를 파악하고 식중독사고 예방에 기여   ❍ 검사대상식품     - 기준·규격검사: 즉석섭취·편의식품, 식품접객업소의 조리식품    - 자체 모니터링: 농수축산물 등 식품원재료    - 식중독 원인조사: 관련 보존식, 환경 등  ❍ 검사항목   - 살모넬라 등 18종   - 기준·규격검사: 기준규격 및 의뢰항목(식품공전)   - 자체 모니터링, 식중독 원인조사: 식중독균 모니터링(식품안전관리지침)  ❍ 검사방법     - 기준규격 검사: 식품공전 시험법에 따름   - 자체 모니터링, 식중독 원인조사: 식품안전관리지침의 RT-PCR 또는 PCR에 의한 유전자(20pathogen)검사법 사용 후 양성일 경우 분리배양 및 확인시험에 따른 식중독균 분리      ※ 정량기준 적합인 경우에도 식중독균 분리하여 확인시험    - 분리균주 송부 및 PFGE 대상 균주 분석 위탁: 식품의약품안전평가원 미생물과     ※PFGE 대상균주: 살모넬라, 병원성대장균(5종), 리스테리아, 황색포도상구균, 캠필로박터균(2종), 비브리오균(3종)'
