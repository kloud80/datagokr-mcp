summary_user: 서울 동작구에서 자동판매기로 식품을 파는 업소의 인허가 정보를 업소 1건씩 담은 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·위생업태와 중부원점TM 좌표(X, Y)를 포함한다. 동작구에서 영업 중인 식품자동판매기 업소가 어디에 몇 곳 있는지, 언제 인허가받고 폐업했는지를 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가 업소 데이터와는 관리번호(MGTNO)·사업장명·주소 같은 이름 매칭이나 같은 기관 코드로만 연결한다.
