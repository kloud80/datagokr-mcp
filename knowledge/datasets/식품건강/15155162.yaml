summary_user: 전국 지자체가 관리하는 식품첨가물제조업 인허가 업소를 업소 단위로 담은 API로, 전체 3,097건이며 인허가일자·영업상태·사업장명·주소·좌표·종사자 수 등을 제공한다. 식품첨가물을 만드는 업소가 어디에 있고 영업 중인지 확인하려는 사업자나 분석가가 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 주소 키로, 관리번호(MNG_NO)를 pnu 키로 삼아 다른 식품 인허가 업소 데이터와 이어 쓴다.
description_portal: '식품_식품첨가물제조업 데이터는 식품을 제조 또는 가공할 때 기호가치를 향상시키거나 영양가치를 높일목적의 식품첨가물을 제조하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 식품첨가물제조업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 식품안전정책과 / 043-719-2032 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
