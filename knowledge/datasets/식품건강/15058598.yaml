summary_user: 경기도 31개 시군의 일반음식점 중 카페 업종 사업장을 업소 한 곳당 한 행으로 담은 인허가 현황으로, 사업장명·인허가일자·영업상태·휴폐업일자·종사자 수·시설면적·도로명/지번 주소·위경도 좌표를 포함한다. 창업 예정자나 상권 분석가가 '우리 동네에 영업 중인 카페가 몇 곳이고 최근 폐업이 얼마나 늘었나'를 확인할 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 데이터나 상권·인구 자료와 맞춰 연결한다.
description_portal: 이 데이터는 경기도 31개 시군 내에서 운영 중이거나 인허가를 받은 일반음식점 중 카페 업종에 해당하는 사업장의 현황을 기록한 자료입니다. 각 카페의 시군명, 인허가일자, 영업상태, 폐업 및 휴업 관련 일자, 위생업종 및 위생업태, 남녀 종사자 수, 총 시설면적, 다중이용업소 여부, 급수시설 구분, 소재지 주소(도로명 및 지번), 위도와 경도 등 다양한 정보를 포함합니다. 커피 및 음료와 함께 간단한 음식을 제공하는 업소들이 대상이며, 식품안전 관리, 지역 상권 분석, 관광 기반 자료로 활용할 수 있습니다. 데이터는 주간 단위로 갱신되며 상업적 활용과 콘텐츠 변경이 허용됩니다.
