summary_user: 대구광역시 서구 관내 일반음식점을 업소 한 곳당 한 행으로 담은 원천 목록 파일(CSV)로, 업종명·업소명·도로명 및 지번 소재지·우편번호를 담는다. 상권 분석가나 창업 예정자가 '서구 어느 동네에 일반음식점이 몰려 있는가'처럼 지역 내 음식점 분포를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 주소(도로명·지번)나 업소명 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 식품 인허가 원장·행정처분 등 다른 데이터와 정확히 연결하려면 이름·주소 매칭이 필요하다. 범위는 대구 서구 한 시군구에 한정되며, 좌표 컬럼 없이 주소만 담고 있어 지도에 올리려면 별도 지오코딩이 필요하다.
