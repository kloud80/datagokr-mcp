summary_user: 인천광역시 남동구에 있는 위탁급식영업 업소를 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화번호가 들어 있다. 학교·기업 등에 급식을 위탁받아 운영하는 업체가 남동구 어디에 몇 곳 있는지 알고 싶은 사업자나 분석가가 지역 분포를 확인하고 거래처 후보를 찾는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어서 다른 데이터와는 업소명이나 주소를 맞춰 보거나, 같은 남동구의 다른 식품 인허가 업소 목록과 나란히 놓는 방식으로만 이어 쓴다.
limits: 인허가번호·좌표 같은 고유 키 컬럼이 확인되지 않아 다른 데이터와 정확히 연결하기 어렵고, 이름·주소로 매칭해야 한다. 범위는 남동구 한 곳뿐이어서 인천 전체나 전국 현황을 보려면 다른 기관 자료를 따로 모아야 한다.
