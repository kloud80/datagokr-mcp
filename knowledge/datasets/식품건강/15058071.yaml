summary_user: 경기도 31개 시군의 중국식 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태·종업원 수·시설규모와 도로명·지번 주소, 위경도 좌표를 포함한다. 창업자나 상권 분석가가 '우리 동네에 영업 중인 중식당이 몇 곳이고 어디에 몰려 있는가'를 확인하거나, 시군별 중식당 개업·폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 다른 경기도 업종별 인허가 데이터나 상권·인구 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 짜장면, 짬뽕, 탕수육 등 중국식 음식을 주로 취급하는 일반음식점에 대한 인허가 및 운영 현황 정보를 포함합니다. 주요 항목은 사업장명, 인허가일자, 폐업일자, 영업상태, 위생업종명, 위생업태명, 급수시설구분, 종업원 수, 소재지정보(도로명 주소, 지번 주소, 위도·경도) 등이 있으며, 총시설규모나 다중이용업소 여부와 같은 항목도 함께 제공됩니다. 해당 데이터는 중식 외식업 시장 분석, 중화요리 전문점 분포 파악, 상권 개발, 식품위생 정책 수립 등에 활용될 수 있습니다. 데이터는 경기도 내 31개 시군 전체를 포함하며, Open API를 통해 실시간 정보 활용도 가능합니다.
