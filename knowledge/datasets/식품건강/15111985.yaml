summary_user: 식품의약품안전처가 관리하는 전국 축산물 가공업 폐업 업소를 업소 단위로 담은 건별 원장으로, 인허가번호·업소명·업종·허가일자·폐업일자·폐업상태·주소·관할 기관명을 제공한다. 축산물 가공 거래처나 납품업체가 폐업했는지 확인하려는 사업자, 지역별 축산물 가공업 폐업 추이를 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)·업소명·주소 같은 이름·코드 매핑으로 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 축산물 가공업의 폐업정보에 대한 인허가번호, 업소명, 대표자명, 업종, 허가일자, 폐업일자, 페업상태, 주소, 기관명에 대한 속성정보를 제공합니다.이 자료를 통하여 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 축산물가공업 분야의 정보 제공, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
