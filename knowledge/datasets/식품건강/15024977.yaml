summary_user: 충청남도 계룡시 관내 숙박업·목욕장업·이용업·미용업·세탁업 등 공중위생영업소를 업소 한 곳당 한 행으로 담은 목록 파일로, 업종명·업소명·도로명주소·소재지 전화번호가 들어 있다. 계룡시 주민이나 이사 온 사람이 '집 근처에 등록된 미용실이나 세탁소가 어디 있고 연락처가 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명주소를 맞춰 붙이는 방식으로만 연결된다. 예를 들어 같은 지역의 식품 인허가 업소 목록과 대조할 수 있다.
limits: 업소를 식별하는 고유 코드가 없어 다른 공중위생·인허가 데이터와 정확히 조인하기 어렵다. 이름이나 주소를 직접 매칭해야 한다. 범위는 계룡시 한 곳뿐이므로 시도·전국 단위로 비교하려면 다른 시군구 자료를 따로 모아야 한다.
