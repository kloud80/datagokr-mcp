summary_user: 경기도 31개 시군의 철도역 구내 휴게음식점을 업소 1곳당 한 행으로 담은 인허가 현황으로, 사업장명·인허가일자·영업상태·폐업일자·소재지 면적·종사자 수·다중이용업소 여부·WGS84 좌표를 포함한다. 역사 안 카페·분식점 등을 열려는 사업자나 분석가가 "어느 역 구내에 영업 중인 휴게음식점이 몇 곳이고 언제 생기거나 문을 닫았나"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 사업장명·주소 매칭, 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 철도역 구내에서 운영되는 휴게음식점에 대한 현황 자료로, 31개 시군의 인허가 정보를 기반으로 수록되어 있습니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 주소 및 면적, 위생업종 및 업태, 총시설규모, 종사자 수(남녀별), 다중이용업소 여부, 위치정보(WGS84 좌표계) 등이 포함되어 있습니다. 본 데이터는 철도역 이용자의 편의성과 위생 안전을 고려한 식음료 서비스 관리, 유동인구 기반 입지 분석, 관광객 대상 서비스 평가, 공공편의시설 확충 등에 활용할 수 있으며, XML 또는 JSON 포맷의 Open API로 제공됩니다.
