summary_user: 식품의약품안전처 인허가업소 정보를 재난안전데이터 공유플랫폼을 거쳐 업소 한 곳당 한 건으로 담으며, 인허가번호·업종명·업소명·대표자명·전화번호·인허가일자·주소가 들어 있고 범위는 전국이다. 상권 분석가나 창업 예정자가 "이 동네에 일반음식점·제과점·즉석판매업소가 몇 곳 있고 언제 허가받았나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 위생 지정·회수/행정처분 같은 다른 식품안전 데이터와는 업소명·주소·인허가번호(SALS_UNQ_SE_NO_LCPMT_NO)를 이름·코드 매핑으로 맞춰 잇는다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 인허가업소에 대한 관련 정보입니다.\""
