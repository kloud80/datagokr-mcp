summary_user: 서울 금천구에 있는 축산가공업 사업장을 업소별로 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업·휴업 이력·주소·사업장명·면적·업태·좌표가 들어 있다. 축산물 가공업 창업을 준비하는 사업자가 금천구 안에 영업 중인 가공업소가 어디에 몇 곳 있는지, 최근 폐업이 많은지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 사업장명·주소를 맞추거나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 연결하고, 좌표(X·Y)로 지도에 겹쳐 본다.
description_portal: 금천구 내 축산가공업의 인허가 현황과 영업 상태, 사업장 정보를 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 폐업 및 휴업 이력, 사업장 주소, 전화번호, 사업장명, 소재지 면적, 업태 구분, 좌표 정보 등 다양한 항목을 포함하고 있습니다. 이를 통해 축산물 가공업 관련 창업 준비, 업계 동향 분석, 정책 수립, 지역 내 사업장 분포 파악 등에 활용할 수 있습니다. 또한 해당 데이터는 위생 관리 강화, 생산·유통 구조 분석, 창업 입지 선정, 산업 경쟁력 제고 등 다양한 행정·연구 목적의 기초 자료로 쓰이며, 축산물 가공 산업의 효율성과 안전성을 높이는 데에도 기여할 수 있습니다.
