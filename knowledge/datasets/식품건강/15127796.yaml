summary_user: 경상북도 구미시 관내에서 영업 중인 카페를 업소 한 곳당 한 행으로 담은 파일(CSV 약 82KB)로, 업종명·업소명·도로명주소·지번주소를 담는다. 창업 희망자나 상권 분석가가 '구미시 어느 동네에 카페가 몰려 있고, 새로 열 자리 주변에 경쟁 카페가 몇 곳인가'를 확인하는 데 쓴다. 인허가번호·사업자번호·좌표 같은 공통 조인 키가 없어서, 다른 식품 인허가 업소 자료와는 업소명·주소 문자열을 맞춰 붙이거나 주소를 지오코딩해 지도·상권 자료와 겹쳐 쓴다.
description_portal: 이 데이터는 경상북도 구미시 관내에서 영업 중인 카페의 현황과 상세 정보를 수록한 자료로, 다양한 영업 형태의 카페 분포와 운영 현황을 파악하는 데 활용할 수 있습니다. 각 항목에는 업종명, 업소명, 도로명주소, 지번주소 정보가 포함되어 있어 지역 내 카페의 위치와 분포를 확인할 수 있습니다. 또한 창업 희망자와 관련 업계 종사자의 상권 분석 및 입지 검토 자료로 활용할 수 있으며, 구미시에서는 지역경제 활성화, 관광자원 발굴, 생활편의 서비스 제공, 도시정책 및 상권 활성화 계획 수립을 위한 기초자료로 활용할 수 있습니다. 아울러 지역 내 카페 운영 현황과 공간적 분포를 분석하여 소비문화 변화와 생활권 특성을 파악하는 데에도 유용한 데이터입니다.
