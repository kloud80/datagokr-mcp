summary_user: 포천시 관내에서 수거·검사된 식품 가운데 위해 가능성이 있는 제품을 검사 건별로 담은 CSV 파일(약 6KB)로, 제품명·제조업소·수거 일시와 장소·시험항목·규격·결과·검사기관을 함께 싣는다. 포천시 주민이나 유통업자가 '관내에서 수거된 어떤 제품이 어떤 시험항목에서 기준을 벗어났는가'를 확인하거나, 위생 담당자가 관내 제조업소의 부적합 이력을 점검하는 데 쓴다. 전역 조인 키가 없어 식품 인허가 업소나 다른 시군의 위해식품·회수 정보와는 제조생산업소명·주소 같은 이름 매핑으로만 이어 쓴다.
limits: 범위가 포천시 한 곳의 개별 검사 건이라 전국·도 단위 현황은 알 수 없고, 업소 코드가 없어 다른 데이터와는 업소명·주소 문자열 매칭에 의존한다. 명세상 연간·이벤트성으로 만들어지는 파일이라 실시간 회수·판매중지 확인용으로 쓰기 어렵다.
