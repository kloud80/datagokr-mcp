summary_user: 서울 동작구 안의 위탁급식 업소를 한 곳당 한 행으로 담은 소규모 파일(csv 약 4.7KB)로, 업종명·업소명·도로명/지번 주소·전화번호·평균급식인원수·관리부서·기준일자가 들어 있다. 동작구에 어떤 위탁급식 업체가 어디에 있고 하루 평균 몇 명 규모로 급식하는지 확인하려는 급식 담당자, 주민, 지역 분석가가 쓴다. 전역 조인 키나 인허가번호가 없으므로 식품 인허가 업소 원장 등 다른 데이터와는 업소명·주소 문자열 매칭으로만 잇는다.
description_portal: 본 데이터는 서울특별시 동작구 내에서 운영 중인 무료급식소의 현황을 체계적으로 수록한 자료이며, 자료에는 급식소의 명칭, 위치, 운영 시간, 제공 서비스 내용 및 연락처 등 구체적인 정보가 포함되어 있습니다. 이 정보를 통해 주민과 관련 기관은 지역 내 무료급식소의 분포와 운영 현황을 정확히 파악할 수 있으며, 급식 지원의 효율적 활용과 정책 수립에 기초 자료로 활용 가능합니다.  본 데이터는 사회복지 증진과 지역 내 복지 자원 공유에 기여함으로써 주민 삶의 질 향상에 목적이 있습니다. 사회적 약자 지원 정책 발전에 이바지할 것으로 기대되며 무료급식 관련 행정 및 연구 활동에 필수적인 기초자료입니다.
