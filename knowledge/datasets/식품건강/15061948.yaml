summary_user: 코로나19 방역수칙(덜어먹기 도구 비치, 위생적 수저 관리, 종사자 마스크 착용)을 지켜 선정된 전국 안심식당을 업소 한 곳당 한 행으로 담으며, 식당명·대표자·지정일·주소·업종 구분·전화번호·사용 여부·지정 취소일이 들어 있다. 국민이 '우리 동네에서 위생 수칙을 지키는 식당은 어디인가'를 찾거나, 분석가가 시도·시군구별 안심식당 분포와 지정 취소 현황을 살피는 데 쓴다. 실측 컬럼에는 업소 인허가번호 같은 전역 조인 키가 없어서, 식품 인허가 업소 원장이나 다른 위생 지정 데이터와는 식당명·주소·우편번호를 맞춰 보는 방식으로만 잇는다.
description_portal: 본 정보는 코로나19 방역수칙을 준수하여 선정된 안심식당의 세부 정보를 제공합니다. 안심식당은 덜어먹기 가능한 도구를 비치·제공하며, 위생적인 수저 관리와 종사자의 마스크 착용 여부를 철저히 준수하고 있습니다. 이 데이터는 안전한 외식 환경 조성과 감염병 확산 방지를 목적으로 하며, 국민이 안심하고 식당을 이용할 수 있도록 돕습니다. 다만, 각 기관의 정보 수집 범위 및 주기에 따라 실제 현장 정보와 차이가 있을 수 있으니 데이터 활용 시 참고하시기 바랍니다. 농림축산식품부는 본 정보를 통해 국민 건강 보호와 위생 환경 개선에 기여하고자 합니다.
