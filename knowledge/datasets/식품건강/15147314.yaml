summary_user: 서울 강북구에서 자동판매기로 식품을 파는 업소의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 영업 중인 곳과 폐업한 곳이 함께 들어 있다. 사업자나 상권 분석가가 강북구 어느 동네에 식품 자판기 업소가 몰려 있고 언제 인허가·폐업했는지(인허가일자·폐업일자·영업상태)를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 식품 인허가·위생 데이터와는 관리번호(MGTNO)·업소명·주소를 이름으로 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로 연결한다.
description_portal: '서울특별시 강북구 식품자동판매기업 인허가 정보 데이터는 강북구의 자동판매기를 이용하여 식품을 판매하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
