summary_user: 인천광역시 미추홀구 관내 소독의무대상시설 가운데 연면적 300제곱미터 이상 식품접객업소(일반·휴게음식점, 제과점, 위탁급식업, 단란·유흥주점)를 업소 한 곳당 한 행으로 담은 파일로, 상호명·도로명주소·규모(제곱미터)·위도·경도를 포함한다. 구청 방역 담당자나 분석가가 '미추홀구에서 정기 소독 의무가 있는 대형 음식점·주점은 어디에 몰려 있나'를 지도에서 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식품 인허가 업소 데이터와는 상호명·도로명주소 매칭이나 좌표 근접으로만 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 관내의 소독의무대상시설 중 식품접객업소의 현황을 수록한 자료로, 소독을 해야 하는 시설 중 「식품위생법 시행령」 제21조제8호(마목은 제외)에 따른 식품접객업 업소(일반음식점, 휴게음식점, 제과점, 위탁급식업, 단란주점, 유흥주점) 중 연면적 300제곱미터 이상의 업소가 해당됩니다. 상호명, 도로명주소, 규모 및 위도·경도 등의 항목으로 구성되어 있어, 소독의무대상시설 중 식품접객업소의 현황을 파악하는데 유용합니다. 해당 데이터는 정기적인 정보 갱신이 이루어집니다.
