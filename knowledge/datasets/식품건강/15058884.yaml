summary_user: 경기도 31개 시군의 휴게음식점 중 푸드트럭 형태로 인허가받은 사업장을 한 곳씩 담은 건별 원장으로, 사업장명·인허가일자·영업상태·폐업일자·주소·위도경도·종사자 수·시설규모를 포함한다. 예비 창업자나 상권 분석가가 '우리 시군에 영업 중인 푸드트럭이 어디에 몇 곳 있고 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 식품 인허가 업소 자료나 상권 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 31개 시군에서 운영 중인 휴게음식점 중 푸드트럭 형태의 사업장 현황을 기록한 자료로, 인허가를 받은 이동식 음식 판매업체에 대한 정보를 포함합니다. 주요 항목으로는 사업장명, 시군명, 인허가일자, 영업상태, 폐업일자, 위생업종 및 위생업태, 소재지(도로명주소, 지번주소, 우편번호), 남녀 종사자 수, 총 시설규모, 급수시설 구분, 다중이용업소 여부, 영업장 주변 구분, 위도·경도 등의 정보가 포함됩니다. 본 데이터는 푸드트럭 운영 실태 파악, 식품 위생 관리, 창업 입지 분석, 지역 상권 지원 정책 수립 등에 활용될 수 있으며, 주간 단위로 갱신됩니다. 상업적 이용과 콘텐츠 변경이 허용됩니다.
