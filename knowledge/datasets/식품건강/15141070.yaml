summary_user: 서울 마포구에 등록된 축산물운반업체를 업체(관리번호) 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·전화번호·좌표를 포함한다. 주민이나 축산물 유통 사업자가 '마포구에서 지금 정상 영업 중인 축산물운반업체는 어디인가'를 확인하거나, 분석가가 업체의 개업·폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어 다른 구의 같은 형식 인허가 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호로, 다른 데이터와는 업체명·주소·좌표 매칭으로 이어 쓴다.
description_portal: 서울특별시 마포구에 등록된 축산물운반업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 축산물운반업체의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 관련 업체 및 주민들은 합법적으로 운영 중인 축산물운반업체 위치와 현황을 쉽게 확인할 수 있습니다.
