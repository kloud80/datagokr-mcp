summary_user: 식품의약품안전처가 관리하는 식육즉석판매가공업 업소 중 폐업한 업소를 한 곳씩 담은 건별 원천 데이터로, 업종·허가일자·폐업일자·폐업상태·업소명·대표자명·주소·관할 기관명·인허가번호를 전국 범위에서 개별 주소 단위로 제공한다. 정육점형 식육 즉석판매가공 업소가 언제 문을 닫았는지 확인하려는 사업자나, 지역별 폐업 추이로 축산물 소매 상권을 분석하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 영업 중인 식육즉석판매가공업 인허가 데이터 등 다른 식품 인허가 업소 데이터와는 인허가번호·업소명·주소를 맞춰 보는 방식으로 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 업종, 허가일자, 폐업일자, 페업상태, 업소명, 대표자명, 주소, 기관명, 인허가번호 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식육즉석판매가공업 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
