summary_user: "식품의약품안전처가 허가한 전국 인체조직은행을 은행 한 곳당 한 행으로 담은 목록이며, 허가번호·은행명·업소명·주소와 함께 조직은행 유형(의료기관·비영리법인·가공처리·수입), 업무범위, 취급 조직(뼈·연골·피부·인대·건·심장판막·혈관·신경 등)의 해당 여부를 항목별 표시로 담는다. 병원 구매 담당자나 연구자가 '특정 조직(예: 연골이나 양막)을 가공·수입하도록 허가받은 조직은행이 어디에 있나'를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 조직은행 허가번호(TISU_BANK_NO)나 업소명·주소를 이름으로 맞추는 방식으로만 의료기관·업체 정보와 연결할 수 있다."
description_portal: 식품의약품안전처에서 관리하는 인체조직은행 업소 및 품목정보를 목록으로 제공합니다.「인체조직안전 및 관리 등에 관한 법률」 에 따른 인체조직을 취급하려는 경우 같은법 제13조에 따른 조직은행허가를 받아야 합니다.  조직설립허가는 조직은행의 명칭과 소재지, 조직은행의 유형(의료기관조직은행, 비영리법인조직은행, 가공처리조직은행, 수입조직은행), 취급조직유형(뼈, 연골, 피부 등 11종), 조직은행 유형에 따른 업부범위 등이 정해집니다. 이 서비스는 조직은행별로 허가받은 정보를 확인할 수 있으며, 조직은행 실시간 허가현황을 확인할 수 있습니다.
