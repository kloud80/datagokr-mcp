summary_user: 식품 하나하나를 행으로 두고 식품명·식품코드, 대·중·소·세분류, 기준량(SERVING_SIZE)당 에너지·탄수화물·단백질·지방·당류·나트륨·비타민·콜레스테롤·포화/트랜스지방산 등 영양성분 함량을 담는 전국 단위 영양성분 DB입니다. 소비자나 영양 앱 개발자가 '이 식품 100g에 나트륨과 당류가 얼마나 들어 있나'를 확인하거나, 분석가가 분류별 영양 함량을 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 식품명·식품코드 매핑으로 연결하고, 포털 설명에 있는 품목제조보고번호가 제공되면 같은 부문의 품목제조보고·바코드·원재료 DB와 제품 단위로 이어 쓴다.
description_portal: 식품 영양성분 정보에 대한 데이터로 식품명, 식품분류, 식품코드, 영양성분 함량 기준량, 에너지, 탄수화물, 단백질, 지방 등 영양성분 정보, 출처, 1회섭취 참고량, 식품중량, 품목제조보고번호, 업체명, 수입여부, 원산지, 데이터생성방법, 데이터생성일자, 데이터기준일자 등의 정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
