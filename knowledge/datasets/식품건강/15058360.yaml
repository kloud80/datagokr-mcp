summary_user: "식품의약품안전처가 관리하는 건강기능식품 정보를 섭취 대상별로 나눠 담은 전국 단위·비공간 API 데이터이며, 공개된 필드 명세가 item 하나뿐이라 건별 원천인지 집계인지와 규모는 확인되지 않았다. 소비자나 분석가가 '특정 대상(예: 어린이·노인)에게 해당하는 건강기능식품 정보는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 품목 데이터와는 제품명 같은 이름 매핑이나 같은 기관 코드로만 연결하며, 품목제조보고번호·바코드로 제품 단위 조인이 되는지는 이 데이터에서 확인되지 않았다."
limits: 전역 조인 키가 없어 업소 인허가·회수·부적합 데이터와 바로 붙일 수 없고, 이름 매핑으로 연결할 때는 표기 차이를 직접 맞춰야 한다. 범위가 전국·비공간이라 지역별 분석에는 쓸 수 없다. 개발계정은 하루 10,000회까지 호출할 수 있다.
