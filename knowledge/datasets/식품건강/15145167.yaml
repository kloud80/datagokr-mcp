summary_user: 전국 음식점 업소의 인허가 변경 이력을 건별로 담으며, 변경일자·변경 전후 내용·변경사유를 업소명·업종·인허가번호·주소와 함께 기록한다. 검증 시 수신된 건수는 7행으로 2017-03-09~2024-08-21 범위이며, 분석가나 사업자가 특정 음식점의 업종·내용이 언제 어떻게 바뀌었는지 확인하는 데 쓴다. 주소(BSN_LCTN_ADDR)가 실측 조인 키라서 같은 식품 인허가 업소 부문의 업소 원장과 주소로 이어 쓰고, 인허가번호 필드는 업소 식별 참고용이다.
description_portal: 식품위생법에 따른 일반음식점 등 음식점업소의 인허가 변경 정보를 제공합니다. 이 자료의 속성정보는 업소명, 업종명, 인허가번호, 전화번호, 주소, 변경일자, 변경전내용, 변경후내용, 변경사유가 있습니다.이 자료를 통하여  신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립 등으로 국민 편의성을 향상 시킬 수 있습니다.
