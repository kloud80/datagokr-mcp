description_portal: '부천시 관내 위치한 위생등급 지정 업소명, 소재지 도로명주소, 소재지 지번주소, 전화번호, 지정일자, 지정등급, 데이터기준일자를 제공하고 있습니다.위생등급제란 음식점의 위생, 서비스를 평가하여 우수한 업소를 3개 등급(매우우수, 우수, 좋음)으로 지정하여 운영하는 제도로 식품의약품안전처가 지정하고 있습니다.일반음식점, 휴게음식점, 제과점을 대상으로 3개 분야 64개 항목을 평가하였습니다. (80~85점 미만: 좋음, 85~90점 미만: 우수, 90점 이상: 매우 좋음)데이터 미보유 및 미집계 값은 공란으로 작성하였으니 이 점 유의 부탁드립니다.※해당 데이터에 관한 사항은 각 구청 산업위생과에 문의 부탁드립니다.'
