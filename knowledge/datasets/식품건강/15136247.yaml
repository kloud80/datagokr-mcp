summary_user: 대구광역시 달서구에서 안전상비의약품을 파는 편의점 등 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 상호명·전화번호·주소만 들어 있고 포털 설명상 정상 운영 중인 업소는 381곳(2025-05-27 기준)이다. 주민이 밤이나 휴일에 가까운 곳에서 해열제·소화제 같은 상비약을 살 수 있는 가게를 찾거나, 분석가가 달서구 동네별 상비약 판매처 분포를 보는 데 쓴다. 전역 조인 키나 코드 필드가 없어 다른 데이터와는 주소를 지오코딩하거나 상호명을 맞춰 연결해야 하며, 허가일·영업상태 같은 상세 정보는 지방행정 인허가 데이터의 안전상비의약품 판매업소 자료에서 찾아야 한다.
description_portal: 대구광역시 달서구의 편의점 등 안전상비의약품으로 지정된 의약품을 판매하는 업소 정보 데이터입니다.해당 데이터의 컬럼은 연번, 상호명, 전화번호, 주소의 항목으로 구성되어 있으며,  정상 운영중인 판매업소는 총 381곳입니다.(데이터기준일:2025/05/27)허가일 및 영업상태 등 자세한 자료는 지방행정 인허가 데이터개방 사이트>데이터찾기>그룹별 업종조회/의료기관>안전상비의약품 판매업소(https://www.localdata.kr/data/dataView.do)에서 확인가능합니다.
