description_portal: 서울특별시 중랑구 모범음식점 지정 현황입니다. 지정년도, 업소명, 주소, 허가번호, 영업장면적 등의 정보를 포함합니다. 일반음식점 및 집단급식소 중 위생관리 및 고객 서비스 수준이 우수한 업소를 지정한 현황입니다. 제공하는 정보 중 주요 항목으로는 지정년도, 지정번호, 신청일자, 지정일자, 업소명, 소재지, 업태명, 주된음식 등이 있습니다. 업태명 카테고리는 한식, 일실, 중국식 등이 있습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.
