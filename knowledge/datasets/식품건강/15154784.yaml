summary_user: 전국 자치단체가 관리하는 집단급식소식품판매업 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터이며, API 전체 24,413건에 인허가일자·영업상태·사업장명·주소·좌표 등이 들어 있다. 사업자가 급식소에 식품을 납품하는 업소가 어디에 있고 영업 중인지 확인하거나, 분석가가 지역별 판매업소 분포를 볼 때 쓴다. 지번주소·도로명주소(address 키)와 관리번호(pnu 키로 잡힘)로 다른 주소 기반 데이터와 이어 쓰고, 같은 부문의 위생 지정·식품안전 알림 데이터와 함께 본다.
description_portal: '집단급식소를 대상으로 식품을 판매하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 집단급식소식품판매업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처(식품안전정책과) / 043-719-2032, 2016 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
