summary_user: 경기도 여주시 관내 식품위생업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·인허가일자·업소명·법인명·도로명/지번 주소·영업장면적·전화번호를 담는다. 여주시에서 창업이나 상권 분석을 준비하는 사업자·분석가가 '읍면동별로 일반음식점·휴게음식점·제과점이 몇 곳 있고 언제 인허가를 받았나'를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '경기도 여주시 관내에 소재한 식품위생업소의 현황 데이터입니다. 제공하는 항목으로는 업종명, 인허가일자, 업소명, 법인명, 소재지(도로명), 소재지(지번), 영업장면적, 건물내부면적, 건물외부면적, 소재지전화가 있습니다.일반음식점: 식사를 주로 제공하는 일반적인 음식점입니다.유흥주점영업: 유흥과 함께 술을 판매하는 주점입니다.단란주점: 노래 등 단란한 유흥과 술을 함께 제공하는 소규모 주점입니다.휴게음식점: 간단한 음식·음료를 제공하는 장소입니다.집단급식소: 단체 대상의 식사를 제공하는 급식 시설입니다.식품제조가공업: 식품을 제조·가공하여 판매하는 업종입니다.즉석판매제조가공업: 즉석에서 식품을 만들어 직접 판매하는 업종입니다.식품첨가물제조업: 식품에 사용하는 첨가물을 제조하는 업종입니다.식품소분업: 식품을 나누어 소포장하여 판매하는 업종입니다.식용얼음판매업: 사람이 먹는 얼음을 제조 또는 판매하는 업종입니다.식품자동판매기영업: 자동판매기를 통해 식품을 판매하는 업종입니다.유통전문판매업: 창고를 통한 유통 중심의 식품 판매 업종입니다.기타식품판매업: 일반 소매점 등 기타 형태로 식품을 판매하는 업종입니다.식품냉동·냉장업: 식품을 냉동·냉장 상태로 보관·운송하는 업종입니다.식품운반업: 식품을 차량 등으로 운송하는 업종입니다.용기·포장지제조업: 식품용 포장지나 용기를 제조하는 업종입니다.옹기류제조업: 식품에 사용하는 옹기를 제조하는 업종입니다.위탁급식영업: 외부 기업·기관에 급식을 위탁받아 제공하는 업종입니다.제과점영업: 빵·과자 등을 제조·판매하는 제과점입니다.집단급식소 식품판매업: 집단급식소에 식재료를 판매하는 업종입니다.건강기능식품일반판매업: 건강기능식품을 소매점 등에서 일반 판매하는 업종입니다.건강기능식품유통전문판매업: 건강기능식품을 창고 등으로 유통 전문 판매하는 업종입니다.'
