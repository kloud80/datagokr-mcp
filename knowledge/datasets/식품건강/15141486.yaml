summary_user: 서울 종로구 관내 식품소분업체를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·폐업일자·영업상태(영업/폐업)·소재지 주소·좌표·업소명 등을 포함한다. 식품 소분 창업을 검토하는 사업자나 위생 담당 분석가가 '종로구에서 현재 영업 중인 소분업체가 어디에 몇 곳 있고, 최근 개업·폐업 추세는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 식품 인허가·위생 데이터와는 업소명·주소 매칭이나 같은 지자체 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 이 데이터는 종로구 관내 식품소분업체의 인허가 현황을 담고 있습니다. 식품소분업은 대량 생산된 식품을 소비자 단위로 재포장하거나 분리하는 영업형태로, 위생 및 유통관리의 핵심 분야입니다. 데이터에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되며, 각 업체의 개업·폐업 이력과 운영 상태를 확인할 수 있습니다. 이 정보는 식품 안전관리, 유통망 분석, 지역 소상공인 지원 정책 등에 활용될 수 있습니다. 또한 식품 관련 창업 인허가 동향을 파악하는 데에도 유용한 행정자료입니다.
