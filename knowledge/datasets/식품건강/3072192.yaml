summary_user: 부산광역시 기장군이 2025년에 실시한 이용업·미용업 공중위생서비스평가 결과를 바탕으로, 업소별 업소명·도로명 소재지·위생등급을 한 줄씩 담은 기장군 범위의 건별 파일이다. 기장군 주민이 집 근처 이·미용실의 위생등급을 확인하거나, 분석가가 지역 내 등급 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 공중위생업소 인허가 데이터와는 업소명·도로명 주소를 맞춰 이어 써야 한다.
description_portal: 2025년도에 실시하였던 부산광역시 기장군 공중위생업소(이용업, 미용업) 대상 공중위생서비스평가 결과를 바탕으로 2026. 3. 11. 기준 업소별 공중위생서비스평가 등급현황(연번,업소명,소재지,위생등급)을 제공합니다.공중위생관리법 제13조(위생서비스수준의 평가) 및 같은법 시행규칙 제20조(위생서비스수준의 평가), 제21조(위생관리등급의 구분 등), 제22조(위생관리등급의 통보 및 공표절차 등)에 따라 공중위생서비스평가를 실시 및 공표합니다.공중위생영업소의 위생서비스수준 평가(이하 “위생서비스평가”라 한다. 이하 같다)는 2년마다 실시하되, 공중위생영업소의 보건ㆍ위생관리를 위하여 특히 필요한 경우에는 보건복지부장관이 정하여 고시하는 바에 따라 공중위생영업의 종류 또는 제21조에 따른 위생관리등급별로 평가주기를 달리할 수 있습니다.
