summary_user: 서울특별시 중랑구에서 건강기능식품 일반판매업으로 인허가를 받은 업소를 한 곳씩 담은 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업자명·중부원점TM(EPSG:5174) 좌표 등을 담는다(유통전문판매업 업소는 제외). 동네 약국 외에 건강기능식품을 파는 매장이 어디에 몇 곳 영업 중인지, 최근 폐업이 늘었는지를 보려는 창업자나 상권 분석가가 쓴다. 전역 조인 키는 없어 다른 식품 인허가 데이터와는 같은 기관의 개방서비스 코드(OPNSFTEAMCODE)·관리번호나 업소명·주소 매칭으로 잇고, 좌표는 위경도로 변환한 뒤 지도·상권 자료와 겹쳐 쓴다.
description_portal: '서울특별시 중랑구의 건강기능식품을 판매하는 업소정보(건강기능식품유통전문판매업에 해당되는 업소 제외)입니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 주소, 사업자명, 좌표정보 등이 있습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
