summary_user: 경기도 양주시가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.7KB)로, 업소명·업태·주음식·도로명 소재지·전화번호·행정동·관리기관명·데이터기준일자를 담는다. 양주시 주민이나 방문객이 '양주시 ○○동에서 위생 지정을 받은 한식당은 어디인가'를 찾을 때, 또는 분석가가 시 안의 모범음식점 분포를 업태·행정동별로 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장 등과는 업소명·도로명 주소 매칭이나 행정동 이름으로만 이어 쓴다.
limits: 양주시 한 시군구 범위만 담고, 업소 인허가번호 같은 공통 키가 없어 다른 위생·인허가 데이터와 연결할 때 이름·주소 매칭 오류를 감수해야 한다. 행정처분 이력이나 지정 기간 같은 정보는 이 데이터에 없다.
