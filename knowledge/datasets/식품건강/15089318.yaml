summary_user: 경상남도 식품접객업소 수를 관리기관(관리기관명)별로 일반음식점·휴게음식점·유흥주점·단란주점·제과점, 집단급식소(소계·위탁·직영)로 나눠 집계한 표로, 990바이트짜리 작은 CSV 파일입니다. 지역 분석가나 행정 담당자가 경남 안에서 어느 관리기관 관할에 일반음식점이나 유흥·단란주점이 많은지, 집단급식소의 위탁·직영 비중은 어떤지 비교하는 데 씁니다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 관리기관명을 이름으로 맞추는 방식으로만 연결합니다.
description_portal: '경상남도 식품접객업소 현황에 관한 데이터로, 일반음식점, 휴게음식점, 유흥주점, 단란주점, 제과점, 집단급식소(위탁, 직영) 현황에 대한 정보를 제공합니다.식품위생법 시행령 제21조(영업의 종류)8. 식품접객업가. 휴게음식점영업: 주로 다류(다류), 아이스크림류 등을 조리ㆍ판매하거나 패스트푸드점, 분식점 형태의 영업 등 음식류를 조리ㆍ판매하는 영업으로서 음주행위가 허용되지 아니하는 영업. 다만, 편의점, 슈퍼마켓, 휴게소, 그 밖에 음식류를 판매하는 장소(만화가게 및 「게임산업진흥에 관한 법률」 제2조제7호에 따른 인터넷컴퓨터게임시설제공업을 하는 영업소 등 음식류를 부수적으로 판매하는 장소를 포함한다)에서 컵라면, 일회용 다류 또는 그 밖의 음식류에 물을 부어 주는 경우는 제외한다.나. 일반음식점영업: 음식류를 조리ㆍ판매하는 영업으로서 식사와 함께 부수적으로 음주행위가 허용되는 영업다. 단란주점영업: 주로 주류를 조리ㆍ판매하는 영업으로서 손님이 노래를 부르는 행위가 허용되는 영업라. 유흥주점영업: 주로 주류를 조리ㆍ판매하는 영업으로서 유흥종사자를 두거나 유흥시설을 설치할 수 있고 손님이 노래를 부르거나 춤을 추는 행위가 허용되는 영업마. 위탁급식영업: 집단급식소를 설치ㆍ운영하는 자와의 계약에 따라 그 집단급식소에서 음식류를 조리하여 제공하는 영업바. 제과점영업: 주로 빵, 떡, 과자 등을 제조ㆍ판매하는 영업으로서 음주행위가 허용되지 아니하는 영업'
