description_portal: '이 데이터는 경상북도 김천시 내에 등록된 세탁업소의 위치 및 기본 정보를 제공하는 공공데이터로, 시민들의 생활편의 서비스 접근성 향상 및 공중위생업소에 대한 정책 수립, 창업 지원 등에 활용될 수 있습니다.김천시 관내 세탁업소의 위치(주소 및 좌표), 연락처 등 주요 정보를 제공하여 지도 기반 시각화 서비스, 지역 서비스 밀도 분석, 위생관리 및 점검대상 파악, 창업 입지 분석 등에 다양하게 활용 가능합니다.  데이터기준일은 2026-05-06입니다.- 업소명 : 등록된 세탁소의 공식 명칭으로 고유 식별 정보입니다.- 소재지 도로명 주소 : 세탁업소의 도로명 기준 주소이여, 회신 주소체계에 맞춘 위치 ㅣ식별이 가능- 소재지지번주소 : 지번 기반 주소로 기존 행정구역 기준의 위치 정보- 위도/경도 : 각 업소의 정확한 공간 위치를 나타내는 좌표로 GIS기반 분석 및 지도 시각화에 활용 가능'
