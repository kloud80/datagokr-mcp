summary_user: 서울 구로구의 식품운반업 인허가 업소를 업소 한 건씩 담은 원장으로, 인허가일자·영업상태(영업/폐업)·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y)·업태 등을 기록한다. 구로구에서 현재 영업 중인 식품운반업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 폐업했는지를 확인하려는 위생 담당자·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 사업장명 매칭, 같은 기관 코드(개방자치단체코드)로만 잇고, 다른 시군구·업종의 식품 인허가 데이터와 같은 컬럼 구조로 이어 붙여 비교한다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 식품운반업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 식품운반업 시설의 차량 보유현황, 업태구분, 위생 관리 사항 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 위생 관리, 정책 수립, 연구 분석, 민원 처리 등 여러 분야에 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계하여 활용할 수 있어 지역사회 정보 접근성을 높이고 행정의 투명성을 강화하는 기반 자료로 기능한다. 데이터 항목이 표준화되어 비교와 통계 작성이 용이하며, 허가 변경 이력과 상태 값이 포함되어 점검 및 행정 지도에 유용하다.
