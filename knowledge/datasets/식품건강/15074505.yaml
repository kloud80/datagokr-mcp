description_portal: '본 데이터는 부산광역시 중구 관내 식품위생업소 관리 현황에 대한 데이터입니다.부산광역시 중구 관내 식품위생업소의 업종명, 업소명, 소재지, 전화번호의 항목을 구분하여 제공합니다. 해당하는 업종별 상세 설명은 다음과 같습니다.-식품제조ㆍ가공업: 식품을 제조ㆍ가공하는 영업-즉석판매제조ㆍ가공업: 총리령으로 정하는 식품을 제조ㆍ가공업소에서 직접 최종소비자에게 판매하는 영업-식품첨가물제조업가. 감미료ㆍ착색료ㆍ표백제 등의 화학적 합성품을 제조ㆍ가공하는 영업나. 천연 물질로부터 유용한 성분을 추출하는 등의 방법으로 얻은 물질을 제조ㆍ가공하는 영업다. 식품첨가물의 혼합제재를 제조ㆍ가공하는 영업라. 기구 및 용기ㆍ포장을 살균ㆍ소독할 목적으로 사용되어 간접적으로 식품에 이행(移行)될 수 있는 물질을 제조ㆍ가공하는 영업-식품운반업: 직접 마실 수 있는 유산균음료(살균유산균음료를 포함한다)나 어류ㆍ조개류 및 그 가공품 등 부패ㆍ변질되기 쉬운 식품을 전문적으로 운반하는 영업. 다만, 해당 영업자의 영업소에서 판매할 목적으로 식품을 운반하는 경우와 해당 영업자가 제조ㆍ가공한 식품을 운반하는 경우는 제외한다.-식품소분ㆍ판매업가. 식품소분업: 총리령으로 정하는 식품 또는 식품첨가물의 완제품을 나누어 유통할 목적으로 재포장ㆍ판매하는 영업나. 식품판매업1) 식용얼음판매업: 식용얼음을 전문적으로 판매하는 영업2) 식품자동판매기영업: 식품을 자동판매기에 넣어 그대로 판매하거나 내부에서의 자동적인 혼합ㆍ처리과정을 거친 식품을 판매하는 영업. 다만, 소비기한이 1개월 이상인 완제품만을 자동판매기에 넣어 판매하는 경우는 제외한다.3) 유통전문판매업: 식품 또는 식품첨가물을 스스로 제조ㆍ가공하지 아니하고 제1호의 식품제조ㆍ가공업자 또는 제3호의 식품첨가물제조업자에게 의뢰하여 제조ㆍ가공한 식품 또는 식품첨가물을 자신의 상표로'
