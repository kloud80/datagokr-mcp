summary_user: 경기도 고양시에서 2021년 1월 1일 이후 옥외영업을 신고한 일반·휴게음식점과 제과점을 업소 한 곳당 한 행으로 담은 건별 목록으로, 업종·사업장명·도로명/지번 주소·인허가일자·옥외영업 신고일자를 포함한다. 시민이 '고양시에서 야외테이블을 둘 수 있게 신고된 음식점이 어디인가'를 찾거나, 위생·상권 담당자가 옥외영업 업소 분포를 파악하는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 사업장명과 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 경기도 고양시의 식품접객업소(일반·휴게음식점, 제과점) 옥외영업신고 현황으로 제공되는 항목은 업종, 인허가일, 사업장명, 소재지(도로명·지번), 데이터기준일자, 옥외영업 신고일자 등이 포함되어 있습니다.2021년 1월 1일 이후 옥외영업 신고된 현황이며, 2025년 12월  31일 기준으로 경기도 고양시 식품접객업 옥외영업 신고현황을 파악할 수 있습니다. 또한 해당 자료를 바탕으로 일반 시민들이 야외테이블이 있는 음식점을 쉽게 찾을 수 있으며, 식품위생 관련 내용의 기초 자료로 활용될 수 있습니다.
