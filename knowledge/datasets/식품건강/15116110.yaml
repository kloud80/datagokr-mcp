summary_user: 서울특별시 강서구에 신고된 전화권유판매업 사업장을 한 건씩 담은 인허가 원장으로, 사업장명·주소·인허가일·영업상태(영업/폐업 등)·폐업일·휴업기간·좌표·자본금 등이 들어 있다. 소비자가 전화로 권유받은 업체가 정식 신고된 곳인지, 지금도 영업 중인지 확인하거나, 분석가가 강서구 내 전화권유판매업체의 개업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에서 전국 공통 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드(OPNSFTEAMCODE)로 이어 쓴다.
description_portal: 전화권유판매업은 소비자에게 전화로 상품이나 서비스를 소개하고 계약을 유도하는 방식의 통신판매업입니다. 해당 인허가 정보에는 사업자명, 주소, 대표자, 허가일, 취급 품목, 영업상태영업상태(영업/정상, 폐업, 취소말소/만료/정지/중지), 인허가일자(폐업, 휴업), 등록일(휴업,폐업),  등이 포함됩니다. 이 업종은 불완전 판매나 사기성 판매 사례가 자주 발생할 수 있어 공정거래위원회 및 관할 지자체의 관리가 엄격히 이루어집니다. 본 데이터는 민원 대응, 피해 예방, 소비자 보호 정책 수립, 신뢰도 있는 업체 구분 등에 활용됩니다.
