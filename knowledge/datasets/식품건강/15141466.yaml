description_portal: 이 데이터는 종로구 내에서 식품위생법에 따라 즉석판매제조가공업 인허가를 받은 영업체의 행정 이력을 포함하고 있습니다. 주요 항목은 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등으로 구성되며, 신규 개업, 영업 중지, 폐업 등의 상태 확인이 가능합니다. 즉석판매제조가공업은 떡, 샌드위치, 김밥, 도시락, 주먹밥 등 간편식이나 조리식품을 현장에서 제조하고 판매하는 형태의 업종으로, 소규모 자영업과 밀접한 관련이 있습니다. 해당 데이터는 위생관리, 식품안전 정책 수립, 자영업 창업 동향 분석, 지역 상권 모니터링 등에 유용하게 활용될 수 있습니다.
