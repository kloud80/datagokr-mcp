summary_user: 경기도 안의 떡카페 형태 휴게음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 시군명·사업장명·인허가일자·영업상태·폐업일자·주소·종사자 수·위경도 좌표를 담는다. 떡카페 창업을 준비하는 사업자가 "우리 시군에 영업 중인 떡카페가 몇 곳이고 어디에 몰려 있나"를 확인하거나, 분석가가 연도별 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명, 주소, 좌표 같은 이름·코드 매핑으로만 이어 쓰고, 같은 부문의 다른 식품 인허가 업소 데이터와 함께 상권 분석에 쓴다.
description_portal: 이 데이터는 경기도 내에서 운영 중인 '떡카페' 형태의 휴게음식점에 대한 인허가 현황을 제공합니다. 떡카페는 주로 전통차와 떡, 떡케이크, 디저트류 등을 제공하는 소규모 음식업소로, 한국 전통식문화를 현대적으로 재해석한 형태의 외식 공간입니다. 주요 항목으로는 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 주소, 위생업종 및 업태명, 급수시설 구분, 종사자 수, 영업장 주변 환경, 위치 정보(WGS84 위도/경도 좌표계) 등이 포함되어 있으며, XML 또는 JSON 형식의 Open API를 통해 이용 가능합니다. 이 데이터는 지역별 떡카페 분포 분석, 전통 식문화 확산 연구, 창업 입지 전략, 위생관리 정책 수립 등의 목적에 활용될 수 있습니다.
