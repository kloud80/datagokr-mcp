summary_user: 경기도 시군의 패밀리레스토랑 인허가 업소를 사업장 한 곳당 한 행으로 담은 건별 원장이며, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·시설규모·종업원 수·WGS84 좌표를 포함한다. 외식업 창업자나 상권 분석가가 '우리 시군에 영업 중인 패밀리레스토랑이 어디에 몇 곳 있고, 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 경기도 식품 인허가 업소 데이터와 맞춰 이어 쓴다.
description_portal: '본 데이터는 경기도 31개 시군 내 가족 단위 외식이 가능한 패밀리레스토랑의 인허가 현황을 제공하며, 사업장명, 인허가일자, 폐업일자, 소재지 주소(도로명 및 지번), 위생업종 및 업태명, 건물소유구분, 급수시설구분, 총시설규모, 종업원 수, 위치정보(WGS84 좌표계) 등의 세부 항목으로 구성되어 있습니다. 패밀리레스토랑은 다양한 메뉴와 편의시설을 갖춘 전문 음식점으로 외식산업 및 소비자 이용행태 분석에 활용할 수 있으며, 주요 프랜차이즈(예: 아웃백, 애슐리, 서가앤쿡 등)의 지역 분포 파악도 가능합니다. 데이터는 지방행정 데이터 개방시스템을 기반으로 행정안전부에서 제공하며, 위치기반 분석 및 외식업 입지 전략 수립 등에 활용될 수 있습니다.'
