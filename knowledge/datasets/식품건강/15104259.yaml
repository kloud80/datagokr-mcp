summary_user: 인천광역시 보건환경연구원이 2025년 한 해 동안 농산물·축산물·수산물·가공식품에 대해 실시한 방사능 검사 실적을 식품 구분별로 검사 건수와 적합·부적합·미량검출 건수로 모아 둔 연간 집계 파일(csv, 약 210바이트)이다. 인천 시민이나 분석가가 "올해 인천에서 검사한 수산물 가운데 방사능이 미량이라도 검출된 건이 있었나"를 확인하거나, 식품군별 검사 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 식품 구분 이름을 맞추거나 같은 기관(인천광역시)의 다른 식품 안전 데이터와 나란히 놓고 보는 방식으로만 이어 쓴다.
