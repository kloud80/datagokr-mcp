summary_user: 국가별로 수입되는 식품의 수입신고 중량을 국가명(MNFT_NATN_CD_NM)과 수입중량 단위로 담은 집계 데이터이며, 범위는 전국이고 지역 구분은 없다. 식품업계나 정책 담당자가 "우리나라 수입식품은 어느 나라에서 가장 많은 중량이 들어오는가"처럼 원산지별 수입 규모를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 수입식품 데이터와는 국가명을 이름으로 맞추어 연결해야 한다.
description_portal: 식품의약품안전처 「수입식품 국가별 수입 현황」 OpenAPI는 특정 국가에서 수입되는 식품의 중량을 확인할 수 있는 공공데이터입니다. 제공 항목으로는 국가명, 수입중량 등이 있습니다. 이 데이터를 통해 사용자는 어느 국가에서 수입되는 식품이 많은지, 수입 중량 규모가 어떤지 등을 객관적으로 확인할 수 있습니다. 또한 유통업체나 식품업계는 수입 제품의 원산지 다변화 전략 수립에 참고할 수 있고, 연구자 및 정책 담당자는 국가별 식품 무역 패턴과 안전성 정책의 연관성을 분석하는 기초자료로 활용할 수 있습니다.
