summary_user: 식품 관련 법 위반 신고 때 쓰는 신고대상 분류 기준(부패·변질 식품, 유독·유해물질 함유, 미생물 오염, 기준·규격 미고시 화학적 합성품, 유해 기구·용기·포장 등)을 분류명 단위로 담은 전국 단위 코드성 참조 데이터다. 식품 신고 앱이나 민원 서비스를 만드는 개발자가 "이 위반 사례는 어떤 신고대상 분류에 해당하나"를 정하고 선택 목록을 구성할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품안전 데이터(회수·행정처분·부적합 정보 등)와는 분류명 이름 매핑으로만 연결한다.
description_portal: 식품 관련 법 위반에 대한 신고대상 분류에 대한 속성정보를 제공합니다. 부패·변질 식품, 유독·유해물질 함유, 미생물 오염식품, 기준·규격 고시되지 아니한 화학적 합성품, 유독·유해물질 함유등 기구 및 용기·포장 등이 해당됩니다.이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
