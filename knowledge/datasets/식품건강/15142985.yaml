description_portal: '- 전라남도에 소재하고 있는 집단급식소 현황에 관한 데이터를 제공합니다. - 집단급식 업소명은 공립, 사단법인, 주식회사 등으로 구분됩니다.- 집단급식업소 소재지(주소)는 전라남도 내에 위치하고 있는 22개 시군 주소에 대한 정보입니다.,- 집단급식업소 전화번호를 제공하고 있으며, 휴대폰 번호의 경우 개인정보로 분류되어 공란처리 되었습니다.- 집단급식업소 운영형태 구분은 직영, 위탁 등으로 구분됩니다. - 마지막으로 평균상시급식인원수에 대한 데이터를 제공합니다.- ＜식품위생법＞ 제2조에 의하면 단체급식소란 영리를 목적으로 하지 않고 계속적으로 특정 다수인에게 음식물을 공급하는 기숙사·학교·병원, 기타 후생기관의 급식시설을 가리키는 것으로 되어 있습니다.'
