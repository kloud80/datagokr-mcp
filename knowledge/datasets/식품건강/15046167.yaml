summary_user: 부산광역시 강서구 관내에서 작성일 기준 영업 중인 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호를 제공한다. 강서구에서 식품을 제조·가공하는 업체가 어디에 있는지, 거래처나 위탁생산처를 찾으려는 사업자나 지역 식품제조업 분포를 보려는 분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명 주소를 맞춰서만 이어 쓴다.
description_portal: '부산광역시 강서구 관내 식품제조가공업소에 대한 데이터로 업종명, 업소명, 영업소 주소(도로명), 소재지 전화 자료를 제공합니다.(작성일 기준으로 영업중인 식품제조가공업소를 기준으로 합니다.)1. 업종명 : 부산광역시 강서구 관내 식품제조가공업소의 업종명입니다.2. 업소명 : 부산광역시 강서구 관내 식품제조가공업소의 업소명입니다.3. 영업소 주소(도로명) : 부산광역시 강서구 관내 식품제조가공업소의 영업소 주소(도로명 주소)입니다.4. 소재지전화 : 부산광역시 강서구 관내 식품제조가공업소의 영업소의 전화번호입니다.'
