summary_user: 인천광역시 부평구에 있는 단란주점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·상호명·도로명 소재지·전화번호가 들어 있다. 구청 담당자나 상권 분석가가 '부평구 어느 동네에 단란주점이 몰려 있나'를 확인하거나 야간영업 민원·위생 점검 대상 업소를 추리는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키는 없어서, 다른 식품 인허가·행정처분 자료와는 상호명이나 도로명주소를 맞춰 붙여야 한다.
description_portal: '단란주점의 업종 구분, 상호명, 소재지, 전화번호 정보를 수록한 자료.유흥시설의 운영 현황을 파악하고, 지역 내 상권 구조 분석, 위생 점검, 치안 대응체계 수립 등 관련 행정업무의 기초자료로 활용됨.활용 목적 및 특징– 유흥업소 분포 현황 파악을 통한 지역 상권 밀집도 분석– 위생관리 및 주기적 지도·점검 대상 업소 관리 기반 마련– 야간영업 관련 민원 대응 및 생활안전 정책 수립에 활용– 공공데이터 기반 유흥업소 관리 체계화 및 행정 효율성 제고주요 항목 설명● 업종명: 업소의 업종 구분 (단란주점)● 업소명: 해당 단란주점의 상호명● 소재지(도로명주소): 업소가 위치한 도로명 주소● 전화번호: 업소의 대표 연락처'
