summary_user: 경기도 안양시 관내에서 모범음식점으로 지정된 업소를 한 행에 한 곳씩 담은 파일로, 업소명·도로명 소재지·전화번호·주된 음식·데이터기준일을 담는다(CSV 약 10KB 규모). 시민이나 방문객이 '안양에서 위생·서비스가 검증된 한식집이 어디 있나'를 찾거나, 분석가가 시 안의 지정 업소 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 식품 인허가 원장이나 다른 위생 지정 목록과는 업소명·도로명주소를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 안양시 관내 모범음식점(연번, 업소명, 소재지(도로명주소)전화번호, 주된음식)현황 정보입니다연번-데이터일련번호업소명-모범음식점으로 지정된 업소의 상호명소재지(도로명주소)-업소의 위치 정보전화번호-업소  대표 연락처주된음식-해당 업소의 대표 메뉴 또는 음식 종류본 데이터는 경기도 안양시 관내 모범음식점으로 지정된 업소의 현황 정보를 제공합니다.「식품위생법」 및 안양시 자체 기준에 따라 위생 상태, 서비스 품질, 음식의 맛 등을 종합적으로 평가해 지정된 음식점으로, 시민과 관광객에게 안심하고 이용할 수 있는 외식업소 정보를 제공하기 위해 개방됩니다.업소명, 소재지(도로명주소), 전화번호, 주된 음식 등 기본 정보를 포함하며, 지역 위생행정, 관광 콘텐츠 개발, 상권 분석, 창업 입지 분석 등에 활용될 수 있습니다.
