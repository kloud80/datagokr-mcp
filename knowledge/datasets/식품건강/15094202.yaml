summary_user: 수입식품 성분을 성분코드(CPNT_CD) 한 건씩 한글명·영문명·이명, 성분 분류, 사용 가능 여부와 함께 담은 전국 단위 비공간 코드 목록이다. 수입업체나 분석가가 수입신고서나 원재료 표기에 적힌 성분이 어떤 코드·분류로 관리되고 지금도 사용 가능한 성분인지 확인할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 수입식품 관련 데이터와는 성분코드나 성분명을 맞춰 매핑하는 방식으로 이어 쓴다.
description_portal: 식품의약품안전처 「수입식품 성분코드 정보」 OpenAPI는 수입식품의 성분 코드와 그 속성 정보를 목록 조회할 수 있는 공공데이터입니다. 제공 항목에는 성분코드, 한글명, 영문명, 이명, 성분구분, 사용구분 등이 포함되어 있어 특정 수입식품의 성분이 어떤 코드로 관리되는지, 한글 및 영문 이름, 또는 과거 사용되던 다른 이름(이명)을 확인할 수 있고, 성분이 어떤 분류에 속하며 실제로 사용 가능한지 여부도 알 수 있습니다. 또한 개발자와 업계 종사자는 코드 기반 검색 기능, 성분 데이터베이스 구축 등에 활용할 수 있습니다.
