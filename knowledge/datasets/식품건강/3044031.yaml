summary_user: 부산광역시 수영구에 영업 신고된 공중위생업소(미용업·이용업·숙박업·세탁업·목욕업·위생관리용역업)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화번호가 들어 있다. 구민이나 사업자가 '수영구에서 신고된 미용실·목욕탕·세탁소가 어디에 있고 연락처가 무엇인가'를 확인하거나, 분석가가 수영구 내 업종별 업소 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(수영구) 자료끼리만 이어 쓸 수 있고, 주소를 지오코딩해 지도나 행정동 단위 자료와 붙이는 방식이 필요하다.
limits: 수영구 한 개 구만 다루므로 부산 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다. 인허가번호 같은 고유 키가 없어 행정처분·인허가 등 다른 데이터와 정확히 연결하기 어렵고 이름·주소 매칭에 의존해야 한다.
