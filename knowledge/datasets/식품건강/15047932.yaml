summary_user: 전북특별자치도 정읍시에 있는 즉석판매제조가공업소를 한 업소당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화번호가 들어 있다(CSV 약 55KB). 정읍시에서 반찬·떡·즉석식품을 직접 만들어 파는 가게가 어디에 있고 연락처가 무엇인지 찾거나, 지역별 업소 분포를 살피는 상권 분석에 쓴다. 인허가번호나 표준 코드 같은 공통 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 정읍시에 소재한  즉석판매제고가공업소 현황중 업소명, 소재지도로명주소, 소재지지번주소, 소재지연락처의 자료를 제공합니다.지역별 영업 현황과 업소 정보의 투명성이 높아져 이용자의 선택권과 안전성이 향상됩니다. 또한 지자체는 상권 분포와 수요를 분석해 가공업소 관련 정책을 효율적으로 추진할 수 있고, 민간에서는 위치 기반 서비스, 상권 분석 등 다양한 비즈니스 개발이 가능할 것으로 예상됩니다.기타 궁금한 사항은 담당부서인 정읍시 보건소로 문의하시기 바랍니다.
