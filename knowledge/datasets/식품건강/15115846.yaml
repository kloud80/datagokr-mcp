summary_user: 서울특별시 양천구 관내 식육포장처리업소(판매용 식육을 절단·포장하는 업소)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·인허가일·영업상태·휴폐업일·주소·전화·소재지면적·좌표 등을 포함한다. 양천구에서 현재 영업 중인 식육포장처리업소가 어디에 몇 곳 있는지, 최근 폐업하거나 휴업한 곳은 어디인지 확인하려는 주민·사업자·위생 담당자의 질문에 쓴다. 전역 조인 키는 없으며, 같은 서울 열린데이터광장의 다른 자치구·업종 인허가 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호(MGTNO)로, 다른 데이터와는 업소명·주소 매칭이나 좌표(X, Y)로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 양천구에서 관내 식육포장처리업의 인허가 현황을 체계적으로 관리하기 위하여 구축한 행정자료이다. 해당 업종은 식육을 위생적으로 절단·가공·포장하여 유통하는 시설로서, 자료에는 사업장 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등 주요 항목이 포함된다. 또한 신규 허가, 변경 신고, 행정처분, 휴·폐업과 같은 절차 이력을 제공하여 지역 내 축산물 위생관리 실태를 파악할 수 있도록 구성되어 있다. 본 데이터는 안전한 축산물 공급망 조성과 유통 단계의 위생관리 강화를 위한 정책 수립의 근거자료로 활용되며, 투명한 정보 공개를 통해 행정업무의 효율성과 민원 대응의 신뢰성을 높이는 데 기여한다. 아울러 정기적인 갱신 절차를 통해 최신 인허가 정보를 지속적으로 반영하도록 관리한다.* 식육포장처리업 - 소고기, 돼지고기 등 판매를 목적으로 식육을 절단하여 포장하는 업소
