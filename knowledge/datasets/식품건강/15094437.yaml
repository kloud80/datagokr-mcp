summary_user: 서초구에 있는 위탁급식영업 업소를 한 건씩 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(영업/폐업)·폐업일자·소재지 주소·사업장명·업태·중부원점TM 좌표(X, Y) 등을 담는다. 학교·어린이집·직장 급식 담당자가 "계약하려는 위탁급식 업체가 서초구에 정상 영업 중으로 등록돼 있는가"를 확인하거나, 분석가가 구내 위탁급식 업소 분포와 폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 서초구 위탁급식영업 인허가 정보는 서초구 내 설치 및 운영하는 업체와, 계약에 따라 음식류를 조리·제공하는 업소의 위치와 영업 현황을 체계적으로 제공하는 공공데이터입니다. 데이터 항목에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 있어, 인허가 정보와 현재 영업 상태를 정확히 확인할 수 있습니다. 이를 통해 운영 현황과 안전성을 확인하고, 위탁급식 이용 계획에 활용할 수 있으며, 어린이집, 학교, 직장 등 단체 급식 환경에 대한 신뢰성을 높일 수 있습니다. 또한 행정기관은 위탁급식소 관리, 위생 점검, 인허가 현황 파악, 영업 상태 모니터링 등 행정 업무 수행에 활용할 수 있으며, 위생 및 안전 기준 준수 여부를 점검하고, 필요 시 인허가 갱신·취소 등의 조치를 체계적으로 관리할 수 있습니다. 연구기관이나 정책 담당자는 위탁급식소 분포, 운영 업체 현황, 안전 관리 실태 등을 분석하여 정책 개선, 급식 품질 관리, 지역 맞춤형 안전 대책 수립 등에 활용할 수 있습니다. 본 데이터는 서초구 내 위탁급식소 운영의 투명성 확보와 위생적·안전한 급식 환경 조성을 위한 핵심 자료로 활용될 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
