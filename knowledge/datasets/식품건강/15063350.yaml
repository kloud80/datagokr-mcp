summary_user: 대전광역시에서 나트륨 함량이 음식별 평균치보다 낮은 메뉴를 내는 일반음식점(건강음식점)을 업소별로 업소명과 소재지 주소로 담은 작은 파일(csv 약 2KB) 목록이다. 대전 시민이나 분석가가 '집 근처에 저나트륨 건강음식점이 어디 있나', '구별로 건강음식점이 얼마나 분포하나' 같은 질문에 쓴다. 인허가번호·사업자번호 같은 전역 조인 키는 없어서, 식품 인허가 업소 원장 등 다른 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
