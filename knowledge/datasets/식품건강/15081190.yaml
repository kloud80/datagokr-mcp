description_portal: 대전광역시 보건환경연구원 노은농수산물검사소에서 수행한 농산물 및 수산물  안전성검사, 부적합 현황 자료입니다.이 검사의 목적은 기준미달 농수산물의 시중유통을 선제적으로 차단하기 위하여 도매시장 출하 농수산물의 안전성을 확보 및 대전광역시 서구, 유성구의 시중 유통 농수산물 안전성을 확보하기 위하여 실시합니다.이 자료의 내용은  대전광역시 노은농수산물도매시장의 도매시장 출하 농수산물의 안전성 검사, 대전광역시 서구, 대전광역시 유성구의 유통 농수산물 안전성 검사 현황에 대한 자료입니다. 주요 검사 항목은 농산물의 잔류농약 검사, 수산물의 동물용의약품 , 중금속 검사, 식중독균 검사, 타르색소 검사 등이 있습니다.  이 자료는 대전광역시 유통 농수산물의 안전성 자료로 활용할 수 있으며, 유통 식품의 안전한 공급 현황을 파악하는데 중요한 자료입니다
