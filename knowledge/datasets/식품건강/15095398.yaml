summary_user: 수입식품 방사능 검사 결과를 국가·품목구분·검사완료일별로 담은 API로, 전체 217,402건에 2021-01-05~2023-02-24 기간의 전국 범위이며 검사건수·수입중량·세슘·요오드 검사결과·판정결과 필드를 제공한다. 소비자나 분석가가 특정 수입국의 식품이 방사능 검사를 얼마나 받았고 어떤 판정을 받았는지, 어떤 품목의 검사가 잦은지 확인하는 데 쓴다. 전역 조인 키가 없어 국가명(MNFT_NATN_CD_NM)·품목명 같은 이름 매핑이나 같은 기관(식약처)의 다른 식품안전 데이터와 코드로만 이어 쓴다.
limits: 검증 호출에서는 전체 217,402건 중 1,139행만 받았고 전량 수집에는 페이지 반복이 218회 이상 필요하다. 오퍼레이션 4개 중 /getYmdPrdlstDivsRadInspStusInq01, /getYrNatnRadInspStusInq01 2개는 최소 파라미터로 응답이 없었다. 최신 행 날짜 2023-02-24는 검증 호출 조건(PRCS_DT=20261002) 기준이라 데이터 자체의 최신성과 다를 수 있다.
