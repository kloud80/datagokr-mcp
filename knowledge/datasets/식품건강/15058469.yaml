summary_user: 식품위생법에 따른 식품원료의 한시적 기준 및 규격 인정 현황을 인정 건별로 담으며, 인정번호·인정일자, 신청 업소명·대표자·주소, 원료명과 제품명, 용도·사용량·사용단위를 포함한 전국 단위 비공간 목록이다. 새 식품원료를 쓰려는 사업자나 분석가가 '이 원료가 한시적 기준·규격 인정을 받았는지, 어느 업체가 언제 어떤 용도로 인정받았는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·원료명 같은 이름 매핑으로만 잇고, 같은 기관의 식품 인허가 업소나 품목 DB와는 이름을 기준으로 맞춰 본다.
description_portal: 식품의약품안전처에서 관리하는 식품위생법에 따른 식품원료의 한시적 기준 및 규격 인정 현황 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
