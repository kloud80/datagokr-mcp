summary_user: 경상남도가 실시한 식품 방사능 검사 현황을 식품 유형·품명별 검사 건수, 검사결과, 판정으로 담은 시도 단위 현황 데이터다. 소비자나 분석가가 "경남에서 유통되는 수산물·농산물 가운데 방사능 검사를 받은 품목은 무엇이고 부적합 판정이 있었나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 식품 안전 데이터(회수·판매중지, 부적합, 수입식품 등)와는 품명이나 식품 유형 이름을 맞춰서만 연결한다.
limits: 이벤트 단위로 생성된 뒤 바뀌지 않는 데이터로 보여, 상시 갱신되는 최신 검사 결과로 보면 안 된다. 업소·제품을 특정하는 코드가 없어 개별 업소 이력이나 다른 데이터와의 정확한 키 결합에는 쓰기 어렵다.
