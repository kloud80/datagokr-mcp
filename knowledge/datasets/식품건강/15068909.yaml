summary_user: 인천광역시 영종구 관내 식품접객업소(일반음식점·휴게음식점·제과점 등)를 업소 단위로 담은 파일 데이터로, 업종명·업소명·도로명 소재지·전화번호·데이터기준일자 항목이 있고 검증 시 2,770행이 수신됐다. 창업 예정자나 상권 분석가가 영종구 안에 어떤 업종의 음식점이 어디에 몰려 있는지 확인하는 질문에 쓴다. 도로명 소재지와 소재지 전화가 주소 계열 조인 키라서 주소 기준으로 다른 상권·위생 관련 데이터와 이어 쓰며, 인허가번호나 사업자번호 필드는 이 파일에 없다.
description_portal: 인천광역시 중구 관내 식품접객업소 현황을 수록한 자료입니다. 식품위생법에 따라 등록된 일반음식점, 휴게음식점, 제과점 등의 업소 정보를 포함하며, 각 업소의 업종명, 업소명, 소재지, 소재지전화번호 등의 항목으로 구성되어 있습니다. 본 데이터는 지역 내 식품접객업소의 분포 현황을 파악하고, 창업 및 상권 분석, 식품위생 관련 정책 수립등의 목적으로 활용할 수 있습니다. 제공되는 정보는 정기적으로 갱신되고 있으며, 공공데이터로서 누구나 자유롭게 열람 및 활용이 가능합니다. 인천 동구청은 시민의 알권리 보장과 행정의 투명성을 높이기 위해 본 데이터를 개방하고 있습니다.
