summary_user: 서울특별시 중랑구의 유흥주점(스탠드바·룸살롱·노래클럽 등) 영업 인허가를 업소 한 곳씩 담은 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표 등을 포함한다. 상권 분석가나 주민이 '중랑구에서 지금 영업 중인 유흥주점은 어디에 몇 곳 있고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 자치구·업종 인허가 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇는다.
description_portal: '서울특별시 중랑구의 스텐드바, 룸살롱, 노래클럽 등 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
