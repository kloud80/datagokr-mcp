summary_user: 경기도 용인시가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명/지번 주소·전화번호·주된 음식·면적·행정동·지정일자·최신 재지정일자를 담는다(용인시 시군구 범위, CSV 약 22KB). 시민이나 방문객이 '우리 동네(행정동)에서 위생이 검증된 한식 모범음식점은 어디인가'를 찾을 때, 또는 분석가가 행정동별 지정 분포와 재지정 현황을 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 업소 원장이나 행정처분 데이터와는 업소명·주소를 맞춰 붙여야 하고, 행정동 이름으로 지역 통계와 연결한다.
limits: 업소 인허가번호가 없으므로 인허가 원장·행정처분 이력과의 연결은 업소명·주소 매칭에 의존해 동명 업소나 주소 표기 차이로 오결합이 생길 수 있다. 용인시 지정분만 담으므로 다른 시군구와의 비교에는 해당 지자체 자료를 따로 모아야 한다.
