description_portal: 이 데이터는 서산시 관내 담배소매업소 정보를 수록한 공공자료이다. 항목은 업소명, 업소도로명주소, 소매인구분으로 구성되며, 담배 유통질서 관리 및 관련 행정업무에 활용된다. 업소명은 담배를 판매하는 사업장의 명칭이며, 업소도로명주소는 도로명 주소 체계를 기준으로 한 위치 정보이다. 소매인구분은 일반소매인, 특수소매인 등으로 판매 형태에 따라 분류된다. 본 자료는 소매업 인허가 심사, 상권 분석, 유통경로 관리, 정책 수립 등 다양한 분야에서 활용 가능하다. 또한 시민과 민간기관이 지역 내 담배소매업소 현황을 쉽게 확인할 수 있도록 정보 접근성을 높이고, 공정한 유통 관리 기반을 마련하는 데 기여한다.
