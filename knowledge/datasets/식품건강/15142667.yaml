summary_user: 서울 마포구에서 인허가를 받은 유흥주점(스탠드바·룸살롱·노래클럽 등) 업소를 한 건씩 담은 인허가 원장으로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 업소 단위로 제공한다. 주민이나 상권 분석가가 '마포구에 지금 영업 중인 유흥주점이 어디에 몇 곳 있고 언제 문을 열고 닫았나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·주소 매핑이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결한다.
description_portal: '서울특별시 마포구의 스텐드바, 룸살롱, 노래클럽 등 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 유흥주점의 위치, 영업 현황과 서비스 종류를 파악하고, 공공 안전 및 위생 관리에 효과적으로 활용할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
