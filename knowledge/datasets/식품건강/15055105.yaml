summary_user: 시흥시 관내 이용업소(이발소 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·소재지 전화·데이터기준일을 담는다. 시민이 집 근처 이용원을 찾거나 분석가가 시흥시 안에서 이용업소가 어느 동네에 몰려 있는지 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열을 맞추거나 같은 시흥시 자료끼리 이어 써야 한다.
