summary_user: 서울특별시 중구에서 허가받은 유흥주점(스탠드바·룸살롱·노래클럽 등) 영업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호(MGTNO)·허가일·영업상태(허가·취소 등)·폐업일·지번/도로명 주소·중부원점TM 좌표·시설면적 등을 담는다. 유흥주점 창업을 검토하는 예비 사업자나 상권 분석가가 '중구에서 현재 영업 중인 유흥주점이 어디에 얼마나 몰려 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관(개방자치단체) 코드로만 연결한다.
description_portal: '서울특별시 중구의 스텐드바, 룸살롱, 노래클럽 등 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소 정보입니다. 데이터는 각 유흥주점영업 허가업소에 부여된 관리번호, 현재의 영업 상태(허가, 취소 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 유흥주점영업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 허가업소 위치제한 구역 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. * 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
