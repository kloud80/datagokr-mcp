summary_user: 식품의약품안전처가 관리하는 식품보존업 업소의 폐업 정보를 업소 건별로 담으며, 포털 설명상 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업상태·주소·기관명을 제공하고 범위는 전국, 위치는 개별 주소 단위다. 사업자·분석가가 특정 지역의 식품보존업 업소가 언제 허가받고 언제 폐업했는지 확인하거나, 상권·업종 변동을 분석할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식품 인허가·행정처분 데이터와는 인허가번호·업소명·주소 같은 이름·코드 매칭이나 같은 기관 코드로만 이어 쓴다.
limits: 공통 조인 키가 없어 다른 데이터셋과 정확히 연결하려면 업소명·주소 매칭이 필요하고, 이 과정에서 오매칭이 생길 수 있다. 호출에는 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
