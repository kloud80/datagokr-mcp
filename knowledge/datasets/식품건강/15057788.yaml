summary_user: 경기도 31개 시군의 전통찻집 형태 휴게음식점 인허가 현황을 업소 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·주소·좌표·면적·종사자 수·다중이용업소 여부를 포함한다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 전통찻집이 몇 곳이고 어디에 몰려 있나'를 확인하거나, 관광·위생 담당자가 전통문화 체험 업소 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 정제 주소·위경도 좌표로 다른 경기도 인허가·상권 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 전통차를 중심으로 운영되는 전통찻집 형태의 휴게음식점에 대한 현황 자료로, 31개 시군의 인허가 데이터를 기반으로 구성되어 있습니다. 주요 항목에는 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 정보(주소, 면적, 위도/경도), 위생업종 및 업태, 종사자 수(남녀), 다중이용업소 여부, 시설규모 등이 포함됩니다. 본 데이터는 전통문화 기반 식음료 업소 현황 분석, 위생관리 및 정책 수립, 관광객을 위한 전통문화 체험시설 정보 제공 등에 활용될 수 있으며, XML 또는 JSON 형식의 Open API로 제공됩니다.
