summary_user: 경기도 31개 시군의 식품첨가물 제조업체를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·소재지 주소·위경도 좌표·종업원 수·보증금과 월세를 포함한다. 식품 가공산업 정책 담당자나 분석가가 '우리 시군에 지금 영업 중인 식품첨가물 제조업체는 몇 곳이고 어디에 모여 있는가'를 확인하거나 위생 점검 대상을 추릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·주소·사업장명 매칭이나 좌표 기반 지도 결합으로만 잇는다.
description_portal: 이 데이터는 경기도 31개 시군의 식품첨가물 제조업체에 대한 인허가 현황을 제공하며, 식품의 기호성 향상 또는 영양가치 증진을 위한 첨가물을 제조하는 사업체에 대한 정보를 담고 있습니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 위생업태명, 소재지 주소, 위도·경도 좌표, 업태구분명, 종업원 수, 건물 소유구분, 시설 규모, 보증금 및 월세금액 등이 포함됩니다. 본 데이터는 식품 가공산업의 기초자료로서 정책 수립, 위생관리, 산업현황 파악, 지도 기반 분석 등에 유용하게 활용될 수 있습니다.
