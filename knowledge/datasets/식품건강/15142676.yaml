summary_user: 서울특별시 마포구에서 제과점·즉석판매제조가공업·유통판매업에 속하지 않고 마트처럼 일정 규모 이상 영업장에서 식품을 파는 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·좌표 등이 들어 있다. 주민이나 상권 분석가가 '마포구에서 지금 영업 중인 대형 식품판매 업소는 어디이고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결하며, 다른 식품 인허가 업종 데이터와 같은 컬럼 구조로 나란히 놓고 쓴다.
description_portal: '서울특별시 마포구의 제과점, 즉석판매제조가공업, 유통판매업 등에 속하지 않고 마트와 같은 일정 규모 이상의 영업장에서 식품을 판매하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다.이 데이터를 통해 주민 및 행정기관은 관내 식품판매업체의 위치와 운영 현황을 파악하고, 식품 안전 및 소비자 보호 관리에 활용할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
