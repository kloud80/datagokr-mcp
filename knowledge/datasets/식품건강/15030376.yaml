summary_user: 경상북도 봉화군 관내에 등록된 식품유통판매업체를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명주소·대표자명·전화번호와 비공개 사유, 데이터 기준일을 담는다. 주민이나 사업자가 봉화군 안에서 식품을 유통·판매하는 업체가 어디에 있고 연락처가 무엇인지 찾거나, 담당 공무원이 지도점검 대상 업소 명단을 확인하는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '이 데이터는 식품위생법에 따라 등록된 식품유통판매업체에 대한 기본 현황을 정리한 자료입니다. 관내에서 식품을 제조, 가공 또는 유통·판매하는 사업체들의 상호, 주소, 대표자명, 연락처 등 주요 정보를 포함하고 있으며, 민원응대, 식품안전 관리, 지도점검 및 정책 수립 등 다양한 행정 및 민간 활용 목적에 부합하는 정보입니다. 개인정보 보호를 위해 일부 항목은 비공개 사유가 함께 표시되어 있으며, 이를 통해 공개 가능한 항목과 제한되는 항목을 구분하여 안전하게 사용할 수 있습니다. 본 데이터는 총 6개 항목으로 구성되어 있으며, 기준일은 2026년 6월 30일입니다.업소명: 등록된 식품유통판매업체의 상호명입니다.도로명주소: 사업장이 위치한 도로명 주소입니다.대표자명: 해당 업체의 대표자 이름(일부 비식별 처리 포함)입니다.전화번호: 업체의 대표 연락처입니다.비공개사유: 비공개 항목에 대한 사유를 표시한 항목입니다.데이터기준일자: 해당 데이터가 수집된 기준일입니다.'
