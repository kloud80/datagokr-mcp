summary_user: 서울특별시 중랑구에서 식육·알·원유 등을 가공해 소시지·전난분·우유 등을 만드는 축산물가공업 업소를 인허가 건별로 담으며, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표를 포함한다. 중랑구에서 현재 영업 중인 축산물가공업체가 어디에 몇 곳 있는지, 최근 폐업한 업소는 어디인지 확인하려는 사업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(개방자치단체코드)로만 이어 쓰며, 다른 자치구의 같은 업종 인허가 데이터와 합쳐 서울 단위로 넓히는 식으로 쓴다.
description_portal: '서울특별시 중랑구의 식육, 알, 원유 등을 가공하여 소시지, 전난분, 우유 등으로 판매하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
