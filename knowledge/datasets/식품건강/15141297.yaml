summary_user: 서울 금천구 안 유흥주점영업 업소를 한 건씩 담은 인허가 원장으로, 인허가일자·영업상태(영업/폐업/휴업)·폐업일자·사업장명·지번/도로명 주소·좌표·종사자 수·시설 규모·임대 정보 등을 담는다. 구청 담당자나 상권 분석가가 '금천구에서 최근 몇 년간 유흥주점이 어느 지역에서 개업·폐업했는가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가 데이터와는 관리번호(MGTNO)·지자체 코드(OPNSFTEAMCODE)·주소·업소명을 맞춰 연결하고, 좌표로 지도 데이터와 겹쳐 본다.
description_portal: 금천구 내 유흥주점영업의 인허가 정보를 체계적으로 제공하는 데이터로, 인허가일자, 영업상태, 전화번호, 주소, 사업장명 등 기본 정보와 함께 위생업태, 종사자 수, 시설 규모, 임대 정보 등 다양한 세부 항목을 포함합니다. 이를 통해 유흥주점의 개업, 폐업, 휴업 등 행정 이력과 현재 업소 현황을 종합적으로 파악할 수 있습니다. 해당 자료는 유흥업소 관리, 지역 치안 및 안전 대책 마련, 정책 수립, 연구 분석 등 폭넓은 분야에서 활용 가능하며, 특히 불법 영업 방지, 유흥업소 밀집 지역 모니터링, 상권 변화 분석 등에도 유용한 기초 자료로 기능합니다.
