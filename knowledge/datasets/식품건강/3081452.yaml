summary_user: 대구광역시 서구 관내 식품접객업소(일반·휴게음식점, 제과점, 단란·유흥주점, 위탁급식영업)를 업소 한 곳씩 담은 목록으로, 업종명·업소명·도로명/지번 소재지·우편번호를 시군구 범위의 개별 주소 단위로 제공한다. 서구에서 창업이나 상권 분석을 하는 사업자·분석가가 '특정 동네에 어떤 업종의 음식점이 몇 곳 몰려 있나'를 확인하거나, 행정 담당자가 위생 점검 대상 업소를 파악하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 우편번호 기준으로만 이어 쓴다.
limits: 인허가번호·좌표 같은 공통 키가 실측 컬럼에 없어 행정처분·위생등급 등 다른 식품 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 대구 서구 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
