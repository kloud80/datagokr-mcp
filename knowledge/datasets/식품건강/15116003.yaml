description_portal: '서울특별시 중구의 빨래방, 세탁소, 운동화빨래방 등 의류 기타섬유제품이나 피혁제품등을 세탁하는 업소 정보입니다. 데이터는 각 신고업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 세탁업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 신고업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 법적 시설기준을 충족하며 드라이클리닝 등 서비스를 제공하는 신뢰할 수 있는 공중위생 생활서비스 업소의 위치 및 위생관리 상태 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
