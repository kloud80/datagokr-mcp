summary_user: 전라남도 여수시 관내에서 영업 중인 공중위생업소(이용·미용·세탁·숙박·목욕장·건물위생관리업 등)를 업소 한 곳당 한 행으로 담은 건별 목록 파일로, 업종명·업소명·신고일자·도로명주소·우편번호를 담는다. 여수시에서 특정 동네에 미용실이나 숙박업소가 몇 곳 있는지, 업종별 분포가 어떤지를 확인하려는 주민·창업자·행정 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명주소 매칭으로 잇고, 식품 인허가 업소·위생 지정 등 같은 부문 데이터와도 이 방식으로 붙인다.
description_portal: 전라남도 여수시 관내 공중위생업소(2026. 6. 11. 기준)영업 중인 데이터(세탁업, 이용업, 미용업, 생활 숙박업, 일반숙박업, 건물위생관리업, 목용장업 등)를 개방하여 관련 현황 파악, 정책 수립 지원, 연구 및 개발 등에 활용할 수 있도록 제공합니다.* 데이터 주요 내용- 업종명, 업소명, 소재지 도로명주소, , 데이터 기준일* 활용 목적- 공중위생업소 현황관리- 위생점검 및 행정업무 지원 등- 공중위생업소 관리와 행정업무 수행, 지역별 업소 분포 분석 및 관련 정책 수립을 위한 기초자료로 활용* 공중위생업소란?- 공중위생관리법에 따라 신고 또는 등록하여 운영하는 업소를 말하며, 대표적으로 다음이 포함됩니다- 미용업, 이용업, 숙박업, 세탁업, 목용장업, 건물위생관리업
