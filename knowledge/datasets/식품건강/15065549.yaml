summary_user: 경기도 포천시 관내 목욕장업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·지번 주소·전화번호·데이터 기준일이 들어 있다(CSV 약 1.8KB의 소규모 목록). 시민이 '포천시에서 우리 동네 가까운 목욕탕이나 찜질 시설이 어디 있고 전화번호는 무엇인가'를 확인하거나, 분석가가 시 단위 목욕업소 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(포천시) 기준으로만 이어 쓰며, 공중위생업소 인허가(LOCALDATA) 계열 자료와 비교할 때도 이름·주소로 맞춘다.
description_portal: 경기도 포천시에서 제공하는 목욕업 현황 데이터입니다. 본 데이터는 포천시 관내에서 운영 중인 목욕업소의 기본 정보를 수록한 자료로, 업종명, 업소명, 영업소 주소(지번), 소재지 전화번호, 데이터 기준일 등의 항목으로 구성되어 있습니다.해당 데이터는 포천시 지역 내 목욕업소의 위치와 운영 현황을 파악하는 데 활용될 수 있습니다. 시민은 이 데이터를 통해 가까운 목욕시설을 찾거나, 자주 이용하는 업소의 운영 정보를 확인할 수 있으며, 고령자나 가족 단위 이용객이 위생시설을 사전에 비교·선택하는 데에도 참고자료로 활용할 수 있습니다.
