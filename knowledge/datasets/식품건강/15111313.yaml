summary_user: 부산광역시 기장군에서 휴게음식점으로 영업하는 카페를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화번호가 들어 있다. 기장군에서 카페 창업 입지를 살피는 예비 사업자나 상권 분석가가 '읍면별로 카페가 몇 곳이나 몰려 있나'를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·위생 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 공통 식별 키가 없어 다른 데이터와 붙일 때 업소명·주소 문자열 매칭에 기대야 하고, 이름이나 주소 표기가 다르면 연결이 빠질 수 있다. 범위는 기장군 한 곳이라 부산 전체나 다른 시군구와 비교하려면 별도 데이터가 필요하다.
