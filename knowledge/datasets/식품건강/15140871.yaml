description_portal: 이 데이터는 서울특별시 광진구 관내에서 즉석으로 음식을 제조·가공하여 소비자에게 직접 판매하는 즉석판매제조가공업소의 인허가 현황을 제공합니다.즉석판매제조가공업은 「식품위생법」에 따라 허가받은 업종으로, 현장에서 조리 또는 가공된 음식을 즉시 제공하거나 포장하여 판매하는 영업 형태입니다.주요 업소 유형은 김밥, 도시락, 튀김류, 간편조리식품 등을 포함하며, 위생적 조리 환경, 보관 기준, 재료 취급 등 식품안전 관리가 중요한 업종입니다.제공 항목에는 업소명, 소재지, 인허가일자, 영업상태, 업태 구분, 관할 행정기관 등의 정보가 포함되어 있어 지역 내 즉석식품 판매 실태 파악, 위생 점검 대상 분류, 식품안전 정책 수립에 활용됩니다.※ 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 좌표는 포함되어 있지 않습니다.※ 본 데이터는 3일 전 기준으로 최신 인허가 현황을 반영하고 있습니다.
