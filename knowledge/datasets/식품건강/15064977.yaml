summary_user: 전국 식품 관련 업소가 인허가를 받을 때 제출한 기본 속성(인허가번호, 업종, 업소명, 대표자명, 전화번호, 허가일자, 주소)을 업소 한 곳당 한 건으로 담은 원장이다. 창업 예정자나 상권 분석가가 특정 지역에 어떤 업종의 음식점·식품업소가 언제 허가를 받아 영업하는지 파악할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 인허가번호(LCNS_NO)나 업소명·주소 같은 이름 매핑으로만 같은 기관의 위생 지정·행정처분 등 다른 식품안전 데이터와 연결한다.
description_portal: 식품 관련 업체가 인허가를 받기 위해 제출한 기본 속성정보를 제공합니다. 속성정보로는 인허가번호, 업종, 업소명, 대표자명, 전화번호, 허가일자 등이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
