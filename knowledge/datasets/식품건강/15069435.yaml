summary_user: 의료기기 품목의 표준 명칭과 품목코드, 사용여부, 최종수정일을 품목 단위로 담은 코드 목록 파일이며, 전국 범위 738행(2012-12-21~2025-12-17)이다. 의료기기 품목코드의 정식 명칭을 확인하거나 폐기·통합된 품목인지 가려야 하는 분석가나 업무 담당자가 쓴다. 전역 조인 키는 없어 명칭 매핑이나 같은 기관의 품목코드로 다른 의료기기 자료와 이어 쓰며, 식품 제품 DB의 품목제조보고번호·바코드와는 직접 이어지지 않는다.
description_portal: 본 데이터는 의료기기 품목의 기본 식별 정보를 제공하기 위한 자료로, 일련번호, 명칭, 최종수정일, 품목코드, 사용여부의 항목으로 구성된다. 품목코드는 각 의료기기 품목을 구분하는 고유 식별값으로, 행정·통계·심사 시스템 간 정보의 일관성을 유지하는 데 활용된다. 명칭 항목은 품목의 정식 표준명을 나타내며, 동일 명칭 내 품목 코드 중복을 방지하기 위해 관리된다. 최종수정일은 데이터의 최신성을 판단할 수 있는 근거이며, 정기적 갱신을 통해 정확도를 유지한다. 사용여부 항목은 폐기되었거나 통합된 품목의 노출을 제한하여 오류 인용을 예방한다. 일련번호는 내부 관리와 변경 이력 추적에 사용되며, 품목 등록 절차의 식별 기준으로 기능한다. 데이터는 품목별 코드 정비와 시스템 간 매핑 검증을 위한 기초 자료로서 기관 내 행정 업무의 표준성을 높이는 데 기여한다.
