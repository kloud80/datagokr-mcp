summary_user: 경기도 31개 시군의 제과점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태와 도로명·지번 주소, 위경도 좌표, 소재지면적, 종업원 수, 보증금·월세를 담는다. 베이커리 창업을 준비하는 사업자가 "이 동네에 영업 중인 제과점이 몇 곳이고 최근 몇 곳이 폐업했나"를 확인하거나, 분석가가 시군별 제과점 밀도와 상권을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)·주소·좌표를 기준으로 맞추거나 같은 기관(경기도)의 다른 식품 인허가 업종 데이터와 이름 매핑으로 연결한다.
description_portal: 이 데이터는 경기도 내 제과점의 영업 및 인허가 현황을 담고 있으며, 빵류 및 제과류를 제조·판매하는 업소에 대한 정보를 포함합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태, 위생업종명, 위생업태명, 소재지 주소(도로명 및 지번), 우편번호, 위도·경도 좌표, 소재지면적, 총시설규모, 건물소유구분, 업태구분명, 남녀 종사자 수, 총종업원 수, 본사·사무·판매·생산직 종업원 수, 보증금 및 월세금액, 다중이용업소 여부 등으로 구성됩니다. 이 데이터는 베이커리 업계의 시장 현황 파악, 위생안전 관리, 창업 입지 분석, 지역 상권 연구 등 다양한 산업 및 정책 분석에 활용될 수 있으며, 행정안전부에서 제공하고 경기도 31개 시군의 인허가 자료를 기반으로 구축되었습니다.
