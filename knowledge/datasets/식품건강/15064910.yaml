summary_user: 식품제조가공업·첨가물제조업 등 식품 관련 영업자가 받은 식품위생교육 이수 내역을 이수 건별로 담으며, 업소명·인허가번호·업종, 교육 과정·대상·유형·방식·장소, 교육기관, 이수 인원과 이수 일시가 들어 있고 범위는 전국이다. 영업자나 분석가가 특정 업소가 식품위생교육을 언제 어떤 과정으로 이수했는지, 업종별로 교육이 어떤 방식으로 이뤄지는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 인허가번호(LCNS_NO)나 업소명으로 같은 기관의 식품 인허가 업소 데이터와 맞춰 보는 방식으로만 연결한다.
description_portal: 식품위생법에 따라 식품제조가공업, 첨가물제조업 등 관련 영업자에 대한 식품위생교육내역 관련 정보입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
