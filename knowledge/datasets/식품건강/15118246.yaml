summary_user: 경기도 안양시의 즉석판매제조가공업 업소를 한 건씩 담은 목록으로, 업종명(반찬가게·떡집·건강원 등)·업소명·소재지 주소·전화번호를 담는다. 시민이 동네 반찬가게나 떡집을 찾거나, 창업 준비자·분석가가 안양시 안에서 즉석판매제조가공업소가 어느 지역에 몰려 있는지 살펴보는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 실측 컬럼에 공통 조인 키가 없어 다른 데이터와 정확히 1:1로 연결하기 어렵고, 업소명·주소 매칭에 의존해야 한다. 범위는 안양시 한 곳이며 좌표 없이 주소만 있어 지도 분석에는 지오코딩이 필요하다.
