summary_user: 서울시가 시중 유통식품을 수거해 실시한 방사능검사 결과를 검사 건별로 담으며, 품목명·원산지·수거일자와 수거장소·검사일자·세슘과 요오드의 기준치 및 검출량·최종 적합 판정이 포함된다. 시민이나 분석가가 '특정 원산지의 수산물에서 세슘이 검출된 적이 있는가'처럼 품목·원산지별 방사능 검출 여부와 부적합 사례를 확인하는 데 쓴다. 전역 조인 키는 없어 품목명·원산지 이름을 매핑해 수입식품이나 회수·부적합 정보 같은 다른 식품안전 데이터와 맞대어 쓴다.
description_portal: 서울시 유통식품 방사능검사 정보 데이터는 시중에 유통되는 식품을 대상으로 방사능 안전성을 확인하기 위해 실시한 검사 결과를 정리한 자료입니다. 품목명, 원산지, 수거일자 및 수거장소, 검사일자, 세슘과 요오드의 기준치와 실제 검출량, 최종 판정(적합 여부) 등의 정보를 포함하고 있어, 유통식품의 방사능 오염 여부를 구체적으로 확인할 수 있습니다. 이를 통해 시민들은 보다 안심하고 식품을 선택할 수 있으며, 행정기관은 원산지·품목별 위험도를 점검하고 관리가 필요한 분야를 선제적으로 파악할 수 있습니다. 또한 특정 시기나 지역에서 방사능 관련 이상 징후가 있는지 모니터링하고, 검사 강화, 수입·유통 관리, 정보 공개 등 식품 안전 정책 수립의 근거 자료로 활용할 수 있는 중요한 공공데이터입니다.
