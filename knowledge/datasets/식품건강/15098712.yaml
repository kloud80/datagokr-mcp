summary_user: 전국 HACCP(식품안전관리인증기준) 적용업소의 지정 현황을 업소·품목 단위로 담은 데이터로, 인허가번호·업종·업소명·대표자·주소·지정일자·지정번호·품목명·영업상태와 폐업·지정취소·인증종료·인증반납 일자를 포함한다. 소비자가 어떤 식품을 사기 전에 그 제조업소가 HACCP 지정을 받았는지, 지정이 아직 유효한지 확인하는 데 쓰고, 분석가는 업종·지역별 지정 업소 분포를 살피는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았으나, 업소 인허가번호(LCNS_NO)로 같은 기관의 식품 인허가 원장과 연결하고, 회수·행정처분 같은 식품안전 정보와는 같은 기관 코드나 업소명 매핑으로 이어 쓴다.
description_portal: HACCP 적용업소 지정 현황에 관한 데이터로써, 인허가번호 , 업종 , 업소명 , 대표자명 , 주소 , HACCP 지정일자 , HACCP 지정번호 , 품목명 , 영업상태 , 폐업일자 , 지정취소일자 , 인증종료일자 , 인증반납일자 등 의 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
