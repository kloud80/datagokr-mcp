summary_user: 국내에서 보고·허가된 건강기능식품의 품목별 기본 현황을 담은 전국 단위 API로, 한 건마다 인허가 관할기관·인허가번호·업소명·업종, 품목보고번호·품목명·품목 대분류와 유형·보고일자가 들어 있다. 소비자나 업계 분석가가 특정 건강기능식품이 언제 어느 업체에서 보고되었고 어떤 유형으로 분류되는지 확인하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으므로, 같은 기관의 식품 인허가 업소·회수/행정처분 데이터와는 인허가번호(LCNS_NO)나 업소명으로, 다른 식품 품목 DB와는 품목보고번호로 맞춰 이어 쓴다.
description_portal: 식품의약품안전처 「건강기능식품 정보」 OpenAPI는 국내에서 보고·허가된 건강기능식품(먹는 콜라겐)의 기본 현황을 조회할 수 있는 공공데이터입니다. 제공 항목에는 인허가 관할기관, 인허가번호, 업소명, 업종명, 인허가일자, 품목보고번호, 품목명, 품목대분류, 품목유형명, 보고일자 등이 포함되어 있습니다. 이를 통해 사용자는 특정 건강기능식품이 언제 어떤 업체에서 허가 또는 보고되었는지, 제품의 분류와 유형은 무엇인지 객관적으로 확인할 수 있습니다. 또한 제약사와 식품업체는 업계 현황을 파악하고 제품 관리에 참고할 수 있으며, 연구기관과 소비자는 건강기능식품의 허가·보고 이력을 확인해 신뢰성 있는 정보를 얻는 데 활용할 수 있습니다.
