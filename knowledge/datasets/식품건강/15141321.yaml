summary_user: 서울 금천구 안 식품운반업체의 인허가 원장으로, 업소 한 곳당 한 행에 인허가일자·영업상태·폐업일자·사업장 주소와 좌표·업태·종사자 수·시설 규모·건물 소유 구분 등을 담는다. 구청 위생 담당자나 물류 사업자가 '금천구에서 지금 영업 중인 식품운반업체는 몇 곳이고 어디에 모여 있는가'를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 자치구·업종의 같은 형식 인허가 데이터와는 관리번호(MGTNO)·업소명·주소를 맞춰 잇거나 좌표(X, Y)로 공간 결합한다.
description_portal: 금천구 내 식품운반업체의 인허가 현황을 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 업태 구분, 위생업태, 종사자 수, 시설 규모, 임대 정보 등 기본 항목과 함께 사업장 주변 환경, 등급, 급수시설, 전통업소 지정 여부 등의 정보도 포함하고 있습니다. 이를 통해 식품운반업체의 운영 실태와 위생 관리 현황을 체계적으로 분석할 수 있으며, 식품 안전 관리, 업종별 통계 작성, 정책 수립, 시장 조사 등 다양한 분야에서 활용할 수 있습니다. 또한 해당 데이터는 지역 내 식품 운송 인프라 파악, 물류 효율성 개선, 위생 관리 강화, 식품 유통 구조 분석 등에 유용한 기초 자료로 쓰입니다.
