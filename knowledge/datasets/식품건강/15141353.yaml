summary_user: 서울 금천구 미용업소의 인허가 내역을 업소 한 곳당 한 건으로 담는 원천 목록으로, 인허가일자·영업상태·폐업일자·사업장명·지번/도로명 주소·좌표·위생업태·건물 층수·종사자 수(여성·남성) 등을 포함한다. 창업 준비자나 상권 분석가가 '금천구에서 지금 영업 중인 미용실은 어디에 몇 곳이고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 좌표(X·Y)는 지도 위 위치 표시에 쓴다.
description_portal: 미용업 인허가 현황을 체계적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등 기본 정보와 함께 종사자 수, 시설 규모, 위생업태, 좌석 수 등 다양한 세부 항목을 포함하고 있습니다. 이를 통해 각 미용업소의 영업 현황, 위치, 시설 규모, 위생 상태 등을 종합적으로 파악할 수 있어 창업 준비, 상권 분석, 정책 수립, 지역 내 미용업 분포 조사 등에 활용할 수 있습니다. 또한 해당 데이터는 미용산업 연구, 서비스 품질 개선, 위생 관리 강화, 고객 만족도 제고, 지역 미용 인프라 확충 등 다양한 분야에서 기초 자료로 유용하게 쓰입니다.
