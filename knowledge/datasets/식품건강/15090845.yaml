summary_user: 전라남도 고흥군의 제과점영업 인허가 업소를 한 업소당 한 행으로 담은 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·좌표·소재지면적·급수시설·시설총규모 등을 담는다. 고흥군에서 지금 영업 중인 제과점이 어디에 몇 곳 있는지, 최근 새로 생기거나 문을 닫은 곳은 어디인지 알아보려는 창업자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드·관리번호)로 잇고, 좌표로 다른 업종 인허가 목록과 지도 위에서 겹쳐 본다.
limits: 고흥군 한 곳만 담으므로 전국이나 다른 시군과 비교하려면 지역별 파일을 따로 모아야 한다. 사업자번호 같은 전역 공통 키가 실측 컬럼에서 확인되지 않아 다른 데이터와 정확히 일대일로 연결하기 어렵다.
