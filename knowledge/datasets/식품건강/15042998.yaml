summary_user: 대구광역시에 있는 축산물가공업(식육가공업·유가공업·알가공업) 업소를 한 행에 한 곳씩 담은 현황 파일로, 업소명·소재지 주소·전화번호·가공업 구분·영업상태를 담는다. 사업자나 분석가가 대구에서 영업 중인 식육·유·알 가공업체가 어디에 몇 곳 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키(인허가번호·사업자번호 등)가 없어서, 다른 데이터와는 업소명·주소 문자열 매칭으로만 연결한다.
description_portal: 대구광역시 소재 축산물가공업(식육가공업, 유가공업, 알가공업)에 대한 현황 파일입니다. 본 정보에는 업소명과 영업장소재지, 유선전화번호가 포함됩니다.(영업장 번호가 핸드폰번호로 등록 되어 있는 경우 개인정보보호법에 따라 공개가 제한되오니 많은 이해 부탁드립니다.) * 축산물가공업은 축산물에 양념 등의 가공과정을 거치거나 생유를 가공하여는 우유나 가공유 등을 만들거나 알을 가공하여 구운 계란 등을 만드는 업종입니다. 업소별 만드는 제품에 대한 자세한 현황은 식품안전나라를 활용하세요.
