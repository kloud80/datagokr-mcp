summary_user: 인천광역시 서구(서해구) 안에 등록된 식육포장처리업체를 업체 한 곳당 한 행으로 담은 파일로, 사업장명과 소재지 주소, 데이터기준일자만 들어 있다(CSV 약 12KB). 지역 주민이나 축산물 유통 사업자가 "서구에 등록된 식육포장처리업체는 어디에 몇 곳이나 있나"를 확인하는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 사업장명과 주소를 맞춰 보는 방식으로만 연결된다.
description_portal: 본 공공데이터는 인천광역시 서구 내 식육포장처리업 등록업체의 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 식육포장처리업체의 사업장명, 소재지 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 주민들은 지역 내 식육포장처리업체의 현황 및 분포를 손쉽게 파악할 수 있습니다. 이를 통하여 지역주민들은 합법적으로 등록된 업체 정보를 통하여 신뢰할 수 있는 제품을 선택하는데 도움을 줄수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
