summary_user: 경기도에서 도축된 소·돼지·닭·오리 등의 지육 잔류검사 결과를 연도·분기·축종별로 집계한 자료로, 간이정성검사와 정밀정량검사의 검사 수·검출 수·위반 수와 각 누계값을 담는다. 축산물 안전 분석가나 지자체 담당자가 "경기도에서 어느 축종의 항생제 등 잔류물질 검출·위반이 분기별로 늘고 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·분기와 축종명(LVSTCKIND_NM)을 이름 기준으로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내에서 도축된 소, 돼지, 닭, 오리 등의 축산물에 대해 실시한 도축 후 지육 잔류검사 집계 현황을 제공하는 자료입니다. 잔류검사는 도축된 가축의 간, 신장, 근육 등에서 시료를 채취하여 항생제나 유해 잔류물질의 존재 여부를 판별합니다. 주요 항목은 집계년도(SUM_YY), 집계분기(SUM_QU), 축종명(LVSTCKIND_NM), 간이정성검사수(SQINSP_CNT), 간이정성검사검출수(SQINSP_DETECT_CNT), 정밀정량검사수(PRECISE_FDQNT_INSPECT_CNT), 정밀정량검출수(PRECISE_FDQNT_DETECT_CNT), 정밀정량검사위반수(PQINSP_VIOLT_CNT) 및 각 항목의 누계값(ACMTOT_*)을 포함합니다.이 데이터는 축산물 유통 이전 단계에서 안전성을 확보하기 위한 과학적 근거로 활용되며, 항생제 남용 방지 및 축산물 위생 관리 정책 수립에 기여할 수 있습니다. 또한 도축장 위생 관리 실태 평가, 축종별 잔류물질 검출 패턴 분석, 식육 안전성 연구 자료로도 활용됩니다. 소비자는 이 데이터를 통해 안전한 축산물 공급 체계를 이해하고 신뢰할 수 있으며, 지자체와 연구기관은 축산물 안전 정책의 효과성을 검증하는 근거 자료로 활용할 수 있습니다.
