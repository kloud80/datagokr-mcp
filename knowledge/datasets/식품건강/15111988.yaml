summary_user: 전국의 어린이기호식품 우수판매업소로 지정된 업소를 한 곳씩 담은 건별 지정현황으로, 업소명·업종·소재지·업태·지정기간(시작·종료일)·지정번호·등급·관할기관을 담는다. 학부모나 학교 주변 먹거리 환경을 살피는 분석가가 "우리 동네 학교 근처에 지정된 우수판매업소가 어디이고 지정이 아직 유효한가"를 확인하는 데 쓴다. 전역 조인 키는 없지만 업소 인허가번호(LCNS_NO)로 식품 인허가 업소 원장과 이어 쓰고, 그 밖에는 업소명·소재지 주소로 매칭한다.
description_portal: 식품의약품안전처에서 관리하는 어린이기호식품우수판매업소지정현황에 대한 업체명,영업인허가종류,인허가번호,전화번호,소재지,업태,위생등급인증지정일자,위생등급지정번호,위생등급,관할기관에 대한 속성정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
