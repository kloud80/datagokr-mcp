summary_user: 서울특별시 마포구에 등록된 식용얼음판매업체의 인허가 원장을 업소 1곳당 1행으로 담는다. 관리번호, 인허가일자, 영업상태(영업·폐업 등)와 폐업일자, 사업장명, 지번·도로명 주소, 좌표(X·Y)가 들어 있으며 범위는 마포구 한 곳이다. 주민이나 사업자가 '마포구에서 지금 영업 중인 식용얼음 판매업소는 어디이고 언제 허가받았나'를 확인하거나, 분석가가 관내 식품업소 분포를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
description_portal: 서울특별시 마포구에 등록된 식용얼음판매업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 식용얼음판매업체의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민과 행정기관은 관내 식용얼음판매업체의 위치, 제품 구성 및 운영 현황을 파악하고, 위생 및 안전 관리 정책을 효율적으로 수립할 수 있습니다.
