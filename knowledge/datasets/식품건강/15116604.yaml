summary_user: 인천광역시 연수구 안에서 위생등급을 받은 음식점을 업소 한 곳당 한 행으로 담은 파일로, 지정일자·위생등급(매우우수·우수·좋음)·업소명·소재지 주소로 구성된다. 연수구 주민이나 방문객이 '이 근처 식당 중 위생등급이 매우우수인 곳은 어디인가'를 찾거나, 분석가가 구 안의 위생등급 지정 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 식품 인허가 업소 원장 등과는 업소명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 연수구 한 곳만 다루므로 인천시 전체나 다른 시군구와 비교하려면 각 기관 파일을 따로 모아야 한다. 업소 인허가번호가 없어 인허가 원장과 정확히 조인되지 않고, 업소명·주소 매칭은 표기 차이로 누락·오매칭이 생길 수 있다.
