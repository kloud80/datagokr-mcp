summary_user: 경기도 구리시 안에서 어린이 기호식품을 파는 음식점·제과점·편의점·문방구 등을 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·업소명·도로명/지번 주소·전화번호·관할기관·데이터 기준일자를 담는다. 학부모나 학교·지자체 담당자가 '우리 아이 학교 주변에 어린이 기호식품을 파는 가게가 어디 있나'를 확인하거나, 분석가가 구리시 내 판매업소 분포를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 이어 쓴다.
description_portal: 음식점, 제과점, 편의점, 문방구 등 경기도 구리시 지역 내에 위치하는 어린이용  기호식품 판매점에 대한 현황정보(업종명, 업소명, 소재지 도로명,지번 주소 등)를 데이터 기준일의 현황으로 제공합니다.데이터는 매년 1회 업데이트되며 , 전화번호 항목 중 개인 휴대폰 번호를 제외하여 공란이 다수 있으므로 참고하여 주시기 바랍니다.
