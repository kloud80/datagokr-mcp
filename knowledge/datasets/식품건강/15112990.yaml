summary_user: 부산광역시 기장군의 공중위생업소(숙박업·목욕장업·이용업·미용업·세탁업·건물위생관리업)를 업소 한 곳당 한 행으로 담고, 업종명·업소명·도로명/지번 주소·전화번호를 기록한다. 기장군 주민이나 사업자가 '우리 동네 어느 곳에 목욕탕이나 세탁소가 있고 연락처는 무엇인가'를 확인하거나, 분석가가 기장군 내 업종별 업소 분포를 파악하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업소명이나 주소를 맞춰 보거나, 같은 기관의 다른 데이터와 묶어서만 이어 쓸 수 있다.
description_portal: '이 데이터는 부산광역시 기장군 공중위생업소(숙박업, 목욕장업, 이용업, 세탁업, 건물위생관리업, 일반미용업 등) 에 관한 데이터로 업종명, 업소명, 소재지, 전화번호 등의 정보를 포함하고 있습니다.* 데이터의 항목별 설명1. 업종명: 공중위생업소 업종(숙박업, 목욕장업, 이용업, 세탁업, 건물위생관리업, 미용업)2. 업소명: 영업소 명칭3. 영업소 주소(도로명): 소재지(도로명) 4. 영업소 주소(지번):  소재지(지번)5.소재지 전화: 영업장 전화번호* 데이터 활용시 참고사항1. 이 데이터는 연간 현행화되고 있으며, 수시로 변경될 수 있습니다.2. 현재 데이터 기준일자는 2025년 8월입니다.'
