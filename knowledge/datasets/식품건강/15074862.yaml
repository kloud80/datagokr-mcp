summary_user: 인천광역시 영종구에서 나트륨 저감 업소로 지정된 음식점·급식소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·소재지주소·지정연도를 담는다(약 1.3KB 규모의 작은 CSV). 주민이나 분석가가 '영종구에서 나트륨 저감 지정을 받은 식당이 어디이고 언제 지정됐나'를 확인할 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 식품 인허가 업소 원장 등과는 업소명·주소를 맞춰 이어 써야 한다.
description_portal: 인천광역시 영종구 나트륨 줄이기 참여업소 현황입니다.나트륨 저감 메뉴에 대한 1인분 나트륨 함량 및 염도를 측정하여 기준 염도 이하일 경우(보육시설 및 유치원 등 0.6%이하, 일반음식점 및 기업체 집단급식소 0.7% 이하) 나트륨 저감화 업소로 선정됩니다.나트륨 저감화 업소에 선정되면 나트륨 저감업소 신규지정 및 나트륨 저감표지판을 수령할 수 있으며, 매년 기준염도 검사를 통해 지정유지 및 지정취소를 결정하게 됩니다.파일명 인천광역시 영종구 나트륨 줄이기 참여업소내용 업소명, 소재지주소, 지정연도 등.
