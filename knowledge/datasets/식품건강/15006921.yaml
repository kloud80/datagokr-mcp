summary_user: 경산시 관내 공중위생업소(미용업 등)를 업소 한 곳당 한 행으로 담은 건별 목록 파일로, 업종명·업태명·업소명과 도로명·지번 영업소 주소를 담는다. 경산시에서 미용실이나 네일숍을 열려는 사업자가 특정 동네에 같은 업종 업소가 얼마나 몰려 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 주소를 지오코딩하거나 업소명·업종명을 맞춰 붙이는 방식으로만 이어 쓴다.
