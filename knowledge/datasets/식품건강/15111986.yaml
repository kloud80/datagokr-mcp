summary_user: 식품운반업으로 인허가를 받은 업소를 건별로 담은 원천 대장으로, 인허가번호·업소명·업종·허가일자·주소·기관명을 전국 범위 2,780건(1985-04-29~2026-09-29)에 걸쳐 제공한다. 창업자나 분석가가 특정 지역에 식품운반업 업소가 어디에 몇 곳 있는지, 언제 허가를 받았는지 확인하는 질문에 쓴다. 주소(LOCP_ADDR)를 조인 키로 삼아 같은 식품 인허가 업소 부문의 다른 업소 데이터나 지역 데이터와 이어 쓴다.
limits: 검증 때는 전체 2,780건 중 1,000행만 수신했으므로 전수 집계는 페이지 호출을 모두 돌려 확인해야 한다. 조인 키는 주소 문자열 하나뿐이며 사업자번호·좌표는 이 API 필드 목록에 없다. 개발계정은 일 10,000회 호출 제한이 있다.
