summary_user: 서울특별시 성동구 안에서 유흥종사자를 두거나 유흥시설을 갖춘 유흥주점(스탠드바·룸살롱·노래클럽 등)의 인허가 정보를 업소 한 곳당 한 행으로 담는 원장이며, 인허가일자·폐업일자·영업상태, 지번·도로명 주소와 좌표(X, Y), 시설 면적·종사자 수 등을 포함한다. 성동구에서 현재 영업 중인 유흥주점이 어디에 몇 곳 있는지, 언제 인허가를 받고 언제 폐업했는지 확인하려는 주민·연구자·행정 담당자가 쓴다. 실측 컬럼에서는 다른 데이터와 공통으로 쓰는 전역 조인 키가 확인되지 않아, 다른 지자체 같은 업종 데이터나 다른 식품 인허가 데이터와는 개방자치단체코드·관리번호·업소명·주소를 맞춰 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 스텐드바, 룸살롱, 노래클럽 등 주로 주류와 다양한 음식류를 조리하여 판매하고, 유흥종사자를 두거나 유흥시설을 설치하여 운영하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 이러한 유흥업소는 특수한 영업환경으로 인해 위생·질서·풍속 등 사회적 관심이 높으며, 관련 정책 및 행정관리가 매우 중요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 각 업소의 인허가 이력과 영업 개시 및 종료, 행정상 변동 현황을 명확하게 파악할 수 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현장 점검 및 정보 갱신을 통해 데이터의 신뢰성과 최신성을 확보하고 있습니다. 본 데이터는 유흥업소의 행정·위생관리, 정책 수립, 업계 시장 동향 분석, 유흥업소 안전 규제, 사회 현상 연구, 소비자 정보 제공 등 다양한 분야에서 폭넓게 활용될 수 있습니다. 행정기관, 업계 관계자, 연구자, 시민 등 누구나 객관적이고 실질적인 정보를 확인할 수 있도록 데이터는 주기적으로 최신화됩니다.
