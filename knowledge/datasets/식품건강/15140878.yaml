description_portal: 이 데이터는 서울특별시 광진구에 소재한 공중위생업소 중 ‘기타 위생용품 제조업’으로 신고된 업소의 현황을 제공합니다. '기타 위생용품'은 「공중위생관리법」에 따라 공중위생시설에서 사용되는 물티슈, 일회용 위생시트, 위생커버 등 개인위생 관리에 사용되는 제품을 의미하며, 위생안전 확보를 위해 제조업소는 지자체에 신고해야 합니다.본 데이터에는 업소명, 소재지, 업종유형, 신고일자, 관리기관 등이 포함되며, 지역 내 위생용품 생산 기반 파악, 위생 제품 유통 추적, 공중위생환경 향상 정책 수립 등 다양한 목적에 활용됩니다.기타 위생용품은 다중이용시설, 숙박·목욕업소, 미용업소 등에서 사용되므로, 제조시설의 위생 수준 확보가 공중 보건과 직결됩니다.※ 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도는 포함되지 않음에 유의해야 합니다.※ 본 데이터는 3일 전 기준으로 최신화된 자료가 제공됩니다.
