summary_user: 경기도 내 인허가된 건강기능식품판매업 사업장을 한 곳씩 담은 원장으로, 사업장명·인허가일자·영업상태·폐업일자·소재지 주소·종업원 수·면적·보증금과 월세 등을 포함한다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 건강기능식품 판매점이 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD), 정제 주소와 우편번호, WGS84 좌표를 기준으로 다른 식품 인허가 업소 데이터나 행정구역 자료와 이름·위치로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 건강기능식품판매업의 현황을 수시로 갱신하여 제공하며, 인허가된 사업장의 상세 정보를 포함합니다. 총 40개의 항목으로 구성되어 있으며, 시군명, 사업장명, 업종명, 인허가일자, 영업상태, 소재지 주소, 종업원 수, 면적 정보, 보증금 및 월세금액, 위생업태명, 홈페이지 주소 등 건강기능식품 도매 및 소매 유통 사업체의 전반적인 영업정보를 담고 있습니다. 특히 다단계판매업, 복합 유통업체 등을 포함하고 있어 건강기능식품 유통 구조의 분석, 위생 관리, 정책 수립에 유용하게 활용될 수 있습니다. Open API도 제공되어 외부시스템과의 연동이 용이합니다.
