summary_user: 부산광역시가 수거한 유통 농산물·수산물·가공식품 등을 검사한 결과를 제품별 한 행으로 담은 건별 파일로, 제품명·품목·수거일·원산지·수입국과 세슘·요오드 검출량(Bq/kg), 적합 여부(적부판정)를 기록한다. 시민이나 분석가가 "부산에서 유통되는 일본산 또는 국내산 수산물에서 방사능이 검출된 적이 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 원산지·품목명 같은 이름 매핑으로만 이어 쓰며, 같은 부문의 수입식품·부적합·회수 데이터와 품목 기준으로 견주어 본다.
description_portal: 일본 후쿠시마 오염수 방류와 관련하여, 일본산 수산물 수거 검사 강화  등 수입산 및 국내산 유통 식품에  대한 부산광역시 식품 방사능 검사 결과에 대한 데이터로 유통중인 다소비 농산물(곡류, 서류, 두류, 견과종실류, 과일류 등), 다소비  수산물(어류, 패류, 두족류, 갑각류 등),  다소비 가공식품(기타가공품, 김치, 젓갈, 기타 식품류 등), 인터넷, 홈쇼핑 유통식품,  유통 다소비 수산물(단순처리 수산물 포함), 영유아 시설  및 학교급식 업체 납품 수산물 및 기타수산물 가공품 등 식품유형,  품목, 제품명, 원산지, 수거검사 결과 등의 항목에 관한 정보를 제공합니다.
