summary_user: 수입 축산물을 냉장에서 냉동으로 전환한 건마다 이력번호·수입신고확인증번호·원산지·수입업체명·품명과 전환수량(BOX)·전환중량(KG), 냉장 유통기한 시작·만료일, 냉동전환 실시·완료일, 전환 후 유통기한을 담은 전국 단위 건별 원천 데이터다. 소비자나 유통업체가 손에 든 수입 육류의 이력번호로 "이 고기가 냉장으로 들어왔다가 언제 냉동 전환됐고 유통기한이 어떻게 바뀌었나"를 확인하거나, 분석가가 원산지·수입업체별 냉동전환 물량을 살피는 데 쓴다. 실측상 전역 조인 키는 확인되지 않아, 축산물 이력번호나 수입신고확인증번호·필증번호, 수입업체명을 이름·번호 매핑으로 맞춰 같은 기관의 다른 수입식품 데이터와 연결해야 한다.
description_portal: 수입축산물 냉동전환에 대한 정보로, 이력번호, 수입신고확인증번호, 원산지, 수입업체명, 신고일, 품명(한글), 전환수량, 전환중량, 냉장유통/소비기한 시작일자·만료일자, 냉동전환 실시일·완료일, 냉동전환 후 유통/소비기한, 축산물수입신고필증번호 정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화, 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 축산물 안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립 제공으로 국민 편의성을 향상 시킬 수 있습니다.
