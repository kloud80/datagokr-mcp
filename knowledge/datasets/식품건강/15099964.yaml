summary_user: 인천광역시 미추홀구에 등록된 일반음식점·휴게음식점·제과점 등 식품접객업소를 업소 한 곳당 한 행으로 담은 목록으로, 업종명·업소명·도로명/지번 주소·전화번호를 담는다. 주민이나 창업 준비자가 '미추홀구 특정 동네에 어떤 업종의 음식점이 몇 곳 있는가'를 확인하거나, 분석가가 구 단위 음식점 분포를 지도로 그릴 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 업소명이나 주소를 맞춰 잇는 방식으로만 연결한다.
description_portal: 본 데이터는 인천광역시 미추홀구에 등록된 식품접객업소의 현황을 제공하는 자료로, 연번, 업종명, 업소명, 도로명주소, 지번주소, 소재지전화 등의 항목으로 구성되어 있습니다. 식품접객업은 식품위생법에 따라 식품을 손님에게 조리·판매하거나 제공하는 업종으로, 일반음식점, 휴게음식점, 제과점 등이 포함됩니다. 본 데이터는 각 업소의 기본적인 위치 정보와 업종 유형을 제공하여 위생 지도점검, 민원 대응, 식품안전 정책 수립 등의 행정업무에 활용될 수 있습니다. 또한 도로명주소와 지번주소가 함께 제공되어 공간분석 및 민간 위치기반 서비스에도 응용이 가능합니다. 데이터는 주기적으로 갱신되며, 지역 식품접객업 환경에 대한 이해를 돕기 위한 공공정보로 개방됩니다.
