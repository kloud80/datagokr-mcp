summary_user: 부산광역시 서구에 있는 이용·미용업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호가 들어 있다(CSV 약 30KB). 주민이 동네 이발소·미용실의 위치와 연락처를 찾거나, 구청 담당자와 분석가가 관내 이미용업소 분포를 보고 공중위생 점검 대상을 관리하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 붙이거나, 같은 서구의 다른 공중위생업 파일과 나란히 놓고 쓴다.
description_portal: '부산광역시 서구 내 이미묭업 현황에 대한 데이터입니다.수집 항목에는 업종명, 업소명, 영업소 주소(도로명), 소재지 전화번호 등이 포함되어 있으며, 이를 통해 지역 내 업소 분포·접근성 분석, 공중위생 점검 대상 관리, 주민 생활서비스 기반 파악 등 다양한 행정적 활용이 가능합니다.예시 데이터에는 ‘부곡이용원’, ‘덕원’, ‘황태자’, ‘신흥’, ‘옥광’ 등 관내에서 운영되는 남성 미용 중심의 이용업소의 도로명 주소 및 연락처 정보가 포함되어 있습니다.본 데이터는 공중위생업 관리, 지역 생활편의시설 운영 파악 등 다양한 분야에서 활용될 수 있습니다.** 항목별 설명업종명: 해당 업소가 등록된 업종 정보업소명: 등록된 이용업소의 공식 상호명영업소 주소(도로명): 도로명 기반 주소소재지전화: 이용업소의 대표 전화번호'
