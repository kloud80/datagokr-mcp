summary_user: 수산물 이력추적 대상의 출하 기록을 이력추적등록번호·출고 로트번호 단위로 담은 건별 데이터로, 품목, 생산일자·생산수량, 출고일자·출고수량·출고단위, 출고구분, 입고 로트번호를 함께 제공하며 범위는 전국이다. 수입·유통업체나 분석가가 특정 수산물 로트가 언제 얼마나 생산되어 어디로 출고됐는지 거슬러 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 이력추적등록번호(HIST_TRACE_REG_NO)와 입고·출고 로트번호를 매개로 같은 수산물이력정보 계열(등록·생산·입고 등)과 이어 쓰며, 식품 인허가·회수 데이터와는 이름 매핑으로만 연결된다.
description_portal: 수산물이력정보-출하정보에 대한 이력추적등록번호 , 로트번호출고 , 로트번호입고 , 품목 , 출고구분 , 생산일자 , 생산수량 , 출고일자 , 출고수량 , 출고단위의 속성정보를 제공합니다. 이 자료를 통하여 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
