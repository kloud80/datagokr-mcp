summary_user: 충청북도에서 수거한 농산물 한 건마다 수거기관·수거계획·수거일시, 국내·수입 구분과 식품 유형, 제품명·제조일자·유통기한, 제조·판매 업소와 소재지, 수거 장소, 검사기관, 잔류농약 적부 판정(PRPERT_JDGMNT)을 담는 건별 검사 결과입니다. 소비자나 유통업자가 '충북에서 잔류농약 부적합 판정을 받은 농산물은 무엇이고 어느 업소에서 팔렸나'를 확인하는 데 쓰고, 분석가는 수거 장소·유통경로별 부적합 경향을 보는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어서, 식품 인허가 업소나 회수·판매중지·행정처분 데이터와는 업소명·소재지·제품명을 이름 매칭해 이어 씁니다.
description_portal: 충청북도 농산물 잔류농약 검사결과는 시도, 수거기관, 수거계획명, 수거일시, 국내·수입 구분, 식품 구분, 식품 유형, 제품명, 제조일자, 유통기한, 제조국, 제조업종, 판매업종, 수거 장소 정보, 검사기관, 잔류농약 검사 결과에 대한 적부 판정(PRPERT_JDGMNT)을 조회할 수 있는 Open API입니다. 이 데이터는 농산물의 안전성 확보를 목적으로, 실제 검사 대상 제품의 유통 이력과 생산·판매 주체를 식별할 수 있어 현장 점검, 회수 조치, 위해 식품 관리 등의 행정적 대응에 직접 활용됩니다. 행정기관은 이를 기반으로 부적합 농산물 대응, 위해 식품 모니터링 체계 강화, 안전관리 사각지대 파악 등 근거 기반의 식품안전정책을 수립할 수 있으며, 연구자·민간에서는 식품 안전 트렌드 분석, 유통경로별 위해요인 평가, 농산물 관리 서비스 개발 등의 분야에서 활용 가능합니다.
