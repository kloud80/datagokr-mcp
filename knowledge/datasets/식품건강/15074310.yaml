summary_user: 축산물 작업장의 HACCP 지정 현황을 업소별로 담는다. 지정번호·지정일자·인증 종료일, 업소명·대표자·소재지, 업종, 폐업 여부·일자, 지정취소·반납 일자가 들어 있고 범위는 전국이다. 소비자나 유통업자가 거래하려는 도축·가공·판매 업소가 지금 HACCP 지정 상태인지, 인증이 언제 끝나는지, 취소·반납 이력이 있는지 확인할 때 쓴다. 전역 공통 조인 키는 없지만 인허가번호(LCNS_NO)로 식품 인허가 업소 원장과 잇고, 같은 기관의 회수·행정처분 데이터와는 인허가번호나 업소명 매핑으로 연결한다.
description_portal: '축산물 HACCP지정 정보를 제공합니다.- 인증번호 , 심사구분명 , 업태명 , 업종명 , 품목명 , 생산량 , 인허가번호 , 인허가일자 , 회사명 , 회사주소 , 작업장주소 , 위생검사일자 , 심사결과 , 브랜드명 , 친환경인증여부 , 인증시작일자 , 인증종료일자*HACCP: 해썹(HACCP) 제도는 식품을 만드는 과정에서 생물학적, 화학적, 물리적 위해요인들이 발생할 수 있는 상황을 과학적으로 분석하고 사전에 위해요인의 발생여건들을 차단하여 소비자에게 안전하고 깨끗한 제품을 공급하기 위한 시스템적인 규정이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.'
