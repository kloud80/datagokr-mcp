summary_user: 식품의약품안전처가 관리하는 나트륨 줄이기 실천음식점으로 지정된 업체를 업체별로 담은 대장으로, 업종·영업소재지·지정일자·관할기관·인허가번호·업체명을 전국 범위의 개별 주소 단위로 제공한다. 외식할 때 우리 동네에서 나트륨을 줄이는 음식점이 어디인지 찾으려는 국민이나, 지역별 지정 현황을 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, 위생 지정 업소는 인허가번호로 식품 인허가 원장과 잇는 것이 검토 방향이며 그 밖에는 업체명·주소 매핑이나 같은 기관 코드로 연결한다.
limits: 실측 컬럼에 다른 데이터와 바로 맞물리는 전역 조인 키가 없어, 인허가 원장 등과 이으려면 인허가번호나 업체명·주소 대조가 필요하다. 개발계정은 하루 10,000회 호출로 제한된다.
