summary_user: 경상남도 진주시에 등록된 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일(csv 약 30KB)로, 업소명·도로명/지번 소재지·인허가일자·영업장면적·업태(식품 유형) 등을 포함하며 포털 설명상 휴·폐업을 뺀 운영 중 업소만 2026.7.6. 기준으로 싣는다. 진주시에서 식품 제조공장을 세우려는 사업자나 지역 식품산업을 보는 분석가가 '진주에 어떤 유형의 식품제조업소가 어디에, 얼마 규모로 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전국 공통 조인 키(인허가번호·사업자번호·좌표 등)가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 소재지 주소를 맞춰 이어 써야 한다.
description_portal: '공공데이터의 제공 및 이용 활성화를 위해 정보공개청구 빅데이터 분석 결과에 따른 주요 관심 데이터를 개방하고자 합니다.-주요 데이터 내용: 경상남도 진주시 식품제조가공업 현황(2026.7.6.기준, 업종명, 인허가일자, 영업상태명, 업소명, 소재지, 영업장면적, 우편번호, 업태명, 업소일련번호)-데이터별 상세설명○ 업종명: 식품제조가공업(식품을 제조 · 가공하는 영업)○ 인허가일자: 식품제조가공업 영업 등록된 일자○ 영업상태명: 운영 중인 상태(휴업, 폐업 제외)○ 업소명: 식품제조가공업 등록된 업소명○ 소재지: 도로명, 지번 소재지 포함○ 영업장면적: 영업장 내부 면적, 외부 면적 포함○ 우편번호: 각 업소의 우편번호○ 업태명: 업종의 형태(식품의 유형별로 구분)○ 업소일련번호: 각 업소의 일련번호(※2026.7.6.기준)-식품제조가공업소의 기타 현황은 진주시청 홈페이지에서 확인하실 수 있습니다.https://www.jinju.go.kr/00135/01112/05121.web(진주시청- 진주소개- 실과안내- 문화관광국- 위생과- 식품제조업 안내- 식품관련업소 현황)'
