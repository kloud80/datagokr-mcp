summary_user: 창원시 관내에서 영업 중인 목욕장 업소(대중목욕탕·찜질방·사우나 등)를 업소 한 곳당 한 행으로 담은 건별 목록으로, 업종명·업소명·영업소 주소·전화번호를 제공한다. 시민이 "우리 동네 가까운 찜질방이나 목욕탕은 어디에 있고 연락처는 무엇인가"를 찾거나, 분석가가 창원시 내 목욕장 분포를 주소 기준으로 살펴보는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관(창원시) 자료끼리로만 이어 쓴다.
description_portal: 본 데이터는 창원시 관내에서 운영 중인 목욕장 업소에 대한 정보를 제공하는 자료로, 시민들이 위생관리나 휴식을 위해 이용할 수 있는 다양한 형태의 공공 목욕 시설 현황을 담고 있습니다. 대중목욕탕, 찜질방, 사우나 등 물을 이용한 전통적인 목욕 외에도 맥반석, 황토, 원적외선 등 열기 또는 온열 효과를 활용해 땀을 배출하고 건강을 증진시킬 수 있는 설비를 갖춘 업소들이 포함됩니다. 각 업소에 대한 기본 정보로는 상호명, 소재지, 전화번호가 제공되며, 일부 업소의 전화번호는 수집되지 않아 미기재될 수 있습니다.
