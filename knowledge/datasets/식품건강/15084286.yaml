summary_user: 경기도 고양시에 있는 학교·산업체 등 집단급식소 가운데 위탁운영하는 곳을 업소 한 곳당 한 행으로 담은 파일이며, 업소명·도로명주소·전화번호·1일 급식인원·맡은 위탁급식업소명을 담는다. 고양시 안에서 어느 급식시설이 어떤 위탁급식업체에 운영을 맡기고 하루 몇 명에게 급식하는지를 확인하려는 위탁급식 사업자나 위생 담당 분석가가 쓴다. 전역 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 업소명·위탁급식업소명이나 도로명주소를 맞춰 이어야 한다.
limits: 인허가번호·사업자번호 같은 공통 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭 오류가 생길 수 있다. 범위는 고양시 한 곳뿐이어서 다른 시군과의 비교나 전국 집계에는 쓸 수 없다.
