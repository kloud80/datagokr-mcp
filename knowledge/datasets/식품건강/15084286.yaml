description_portal: 안녕하세요. 경기도 고양시 집단급식소 위탁운영 현황 데이터는 경기도 고양시에 위치한 학교, 산업체 등의 급식시설 중 위탁운영을 하는 집단급식소에 대한 업소명, 주소, 전화번호, 1일급식인원, 위탁급식업소명 등의 항목을 제공합니다.* 집단급식소란, 영리를 목적으로 하지 아니하면서 1회 50명 이상의 특정 다수인에게 계속하여 음식물을 공급하는 학교, 산업체 등의 급식시설을 말함* 위탁급식영업이란, 집단급식소를 설치ㆍ운영하는 자와의 계약에 따라 그 집단급식소에서 음식류를 조리하여 제공하는 영업을 말함
