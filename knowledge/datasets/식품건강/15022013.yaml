summary_user: 부산광역시 수영구에 등록된 식품제조가공업소를 업소 한 곳당 한 행으로 담은 목록으로, 업종명·업소명·도로명/지번 소재지·업소 전화번호를 담는다(약 4KB 규모의 CSV 파일). 수영구에서 식품을 제조·가공하는 업체가 어디에 몇 곳 있는지 확인하려는 주민·사업자나, 지역 식품업 분포를 보려는 분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 실측 컬럼에 없어서, 다른 식품 인허가·위생 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 공통 식별 키가 없어 업소명·주소 문자열 매칭에 의존하므로, 다른 데이터와 연결할 때 표기 차이로 누락이나 오매칭이 생길 수 있다. 범위는 수영구 한 곳이고 좌표 컬럼이 없어, 지도에 표시하려면 주소를 따로 좌표로 변환해야 한다.
