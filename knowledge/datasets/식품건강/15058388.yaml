summary_user: 경기도 시군별 식용란(달걀) 수집판매업소의 인허가 현황을 업소 한 곳당 한 행으로 담은 원장으로, 사업장명·인허가일자·영업상태·폐업일자·종업원 수·면적과 도로명·지번 주소, WGS84 좌표가 들어 있다. 달걀 유통업체를 찾는 사업자나 식용란 위생관리·유통시설 분포를 보는 분석가가 '우리 시군에 영업 중인 달걀 수집판매업소는 어디에 몇 곳인가' 같은 질문에 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 식품 인허가 업소 데이터나 지도와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 31개 시군의 식용란(달걀) 수집 및 판매업소에 대한 인허가 현황을 제공하며, 사업장명, 인허가일자, 영업상태, 폐업일자, 총 종업원 수, 소재지 면적 및 주소(도로명, 지번), 우편번호, 위경도 좌표(WGS84 기준), 축산물가공업 구분명, 축산업무 구분명 등의 항목으로 구성되어 있습니다. 식용란수집판매업은 달걀을 농장 또는 중간 유통업체로부터 수집·처리하여 소매업소나 소비자에게 공급하는 업종으로, 식품 안전과 위생 관리에 중요한 역할을 합니다. 이 데이터는 달걀 유통경로 파악, 식용란 위생관리 정책 수립, 유통시설 분포 분석 등 다양한 식품 행정 및 연구 목적에 활용될 수 있습니다. 다만 해당 데이터는 2018년 이후 갱신이 중단된 상태입니다.
