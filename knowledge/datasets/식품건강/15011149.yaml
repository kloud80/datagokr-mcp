summary_user: 경기도 시군별로 학교급식 환경 보호를 위해 지정된 식품안전보호구역 현황을 집계년월(sum_ym) 단위로 모은 집계 자료로, 전체 학교 수·지정 학교 수·보호구역 수·전담관리원 지정 수·우수판매업소 수를 담는다. 정책 담당자나 분석가가 '우리 시군은 학교 대비 보호구역 지정과 전담관리원 배치가 얼마나 되어 있나'를 비교하는 데 쓴다. 전역 조인 키는 없어 시군명(sigun_nm)을 이름으로 매핑해 같은 시군 단위의 식품 인허가 업소·위생 지정 자료 등과 이어 쓴다.
description_portal: 이 데이터는 시군별로 학교급식 환경을 보호하고자 지정된 식품안전보호구역 관련 현황을 집계한 자료입니다. 주요 항목으로는 전체학교수, 지정학교수, 식품안전보호구역 수, 전담관리원 지정 수, 우수판매업소 수 등이 포함되며, 집계년월 단위로 관리됩니다. 이 정보는 학교 주변 식품위생 환경의 실태를 파악하고, 안전한 급식 환경 조성을 위한 정책 수립 및 이행을 지원하는 데 활용됩니다. 또한 우수판매업소 운영 실적과 관리원 지정 현황은 식품위생 수준 향상을 위한 기반 자료로 활용될 수 있습니다.
