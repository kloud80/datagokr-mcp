summary_user: 경기도 안양시에 등록된 식품운반업 업소를 업소별로 한 줄씩 담은 원천 목록으로, 업종명·업소명·소재지 주소·전화번호 네 항목으로 이루어진 작은 CSV 파일(약 6.6KB)이다. 안양시에서 냉장·냉동 식품 운송을 맡길 업체를 찾는 사업자나, 시 단위 식품 인허가 업소 분포를 살피는 분석가가 '안양시에 어떤 식품운반업체가 어디에 있나'를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어, 다른 식품 인허가 업소 데이터와는 업소명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 안양시 식품운반업(업종명,업소명,소재지,전화번호)설명입니다.업종명-일반적으로 “식품운반업”으로 표기되며, 식품위생법상 정해진 업종 분류입니다.업소명-해당 영업을 수행하는 업체의 이름입니다.소재지-업체의 사업장 주소로, 도로명주소 또는 지번주소 형식으로 제공됩니다.전화번호-업체에 직접 연락할 수 있는 대표 전화번호입니다. 일부 업체는 공란일 수 있습니다.안양시의 식품운반업은 식품위생법에 따라 등록된 업종으로, 주로 부패·변질되기 쉬운 식품을 위생적으로 운반하는 영업을 말합니다. 이 업종은 냉장·냉동 설비를 갖춘 차량을 이용해 식품을 안전하게 운송하는 것이 핵심입니다.
