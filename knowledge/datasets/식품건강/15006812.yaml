summary_user: 경상북도 영양군 안의 이·미용업, 숙박업, 목욕장업 등 공중위생 업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·우편번호·전화번호·데이터 기준일자를 담는다(csv 약 5.8KB 규모). 영양군에서 미용실이나 목욕탕이 어디에 몇 곳 있는지 알고 싶은 주민, 창업 전에 업종별 경쟁 업소 수를 확인하려는 자영업자, 위생 점검 대상을 추리는 담당자가 쓴다. 전역 조인 키나 코드 필드는 없어서, 다른 공중위생·식품 인허가 데이터와는 업소명과 도로명 주소를 맞춰 보는 방식으로만 연결한다.
