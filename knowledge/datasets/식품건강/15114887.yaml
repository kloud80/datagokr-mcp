description_portal: '일반음식점 현황은 전국 각 지방자치단체에 등록된 일반음식점 정보를 수록한 데이터로, 연번, 업종명, 업소명, 소재지(지번), 소재지전화, 업태명 항목으로 구성되어 있습니다. 업소별로 제공하는 음식의 종류(예: 한식, 중식 등)와 영업 형태를 나타내는 업태명이 포함되어 있어, 지역 내 먹거리 현황 분석에 유용합니다. 본 자료는 식품위생법에 따라 등록된 식당 중심으로 구성되며, 음식문화 개선, 위생 점검, 외식산업 정책 수립 등 다양한 행정 업무에 활용할 수 있습니다.  일반음식점의 위치 정보와 연락처가 포함되어 있어 민원 대응 및 지도 기반 서비스 개발에도 활용도가 높습니다.'
