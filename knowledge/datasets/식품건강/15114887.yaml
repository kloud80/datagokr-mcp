summary_user: 신안군에 등록된 일반음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·지번 주소·전화번호·업태명(한식·중식 등 음식 종류)과 데이터기준일자를 담는다. 신안군 안에서 어느 읍면에 어떤 종류의 식당이 몇 곳 있는지 알아보려는 주민·관광객·상권 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어서 다른 데이터와는 업소명이나 지번 주소를 맞춰서만 이을 수 있고, 같은 부문의 전국 식품 인허가 업소 원장과도 이 방식으로 대조한다.
limits: 인허가번호·사업자번호·좌표 같은 키 컬럼이 없어 다른 데이터와 정확히 조인하기 어렵다. 범위는 신안군 한 곳이라 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다.
