summary_user: 서울특별시 동작구의 위탁급식영업 인허가 업소를 사업장 한 곳당 한 행으로 담은 원장으로, 사업장명·인허가일자·영업상태(정상·휴업·폐업)와 상세상태, 폐업일자, 지번·도로명 주소, 좌표, 위생업태, 종업원 수, 시설 규모 등을 기록한다. 학교·병원·기업에 급식을 위탁하려는 기관이나 분석가가 '동작구에서 현재 영업 중인 위탁급식업체는 어디이고 몇 곳인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호를 통해서만 연결하며, 좌표(X, Y)로 공간 결합을 시도할 수 있다.
description_portal: 위탁급식영업 인허가 정보 데이터는 학교, 병원, 기업 등 단체 대상 급식 서비스의 영업 현황과 인허가 상태를 기록합니다.영업상태 항목은 사업장이 정상, 휴업, 폐업 중 어느 상태인지 확인할 수 있습니다.사업장명 항목은 각 위탁급식업체의 공식 명칭을 제공합니다.위생업태명은 해당 업체가 제공하는 급식 서비스 유형과 위생 관리 범위를 나타냅니다.데이터는 위탁급식업 운영 현황과 업종별 분포를 평가하는 기초 자료로 활용됩니다.영업상태를 분석하면 활성화된 사업장과 관리가 필요한 사업장을 구분할 수 있습니다.
