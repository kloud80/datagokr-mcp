summary_user: 경기도 내 용기·냉동기 등 특정설비를 제조하거나 수리하는 업체의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 시군, 사업장명, 인허가일자, 영업상태, 폐업일자, 지번·도로명 주소, WGS84 위경도 좌표 등을 포함한다. 냉동설비 수리 업체를 찾는 사업자나 시군별 특정설비 업체 분포와 영업·폐업 현황을 보려는 분석가가 '우리 시군에서 영업 중인 특정설비 제조·수리 업체는 어디인가' 같은 질문에 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 시군명, 사업장명·주소 매핑으로 같은 기관의 다른 인허가 데이터와 잇고, 위경도 좌표로 지도 위에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 용기·냉동기와 같은 특정설비를 제조하거나 수리하는 업체의 인허가 현황을 나타내며, 총 24개 항목으로 구성되어 있습니다. 시군명, 사업장명, 인허가일자, 영업상태, 주소정보(WGS84 위도·경도 포함), 면적, 설비규격, 업태구분, 전화번호 등의 정보를 포함합니다. 이 데이터는 기계공업 및 냉각설비 산업 분야의 현황을 분석하거나 설비 등록 현황을 파악하는 데 활용할 수 있으며, 지역별 엔지니어링 수요 분석, 산업 안전관리 계획 수립 등 다양한 분야에 기초자료로 제공됩니다. Open API 형태로 제공되며, 지방행정데이터개방시스템에서 관리됩니다.
