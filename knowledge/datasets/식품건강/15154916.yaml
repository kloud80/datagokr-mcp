summary_user: 전국 자치단체가 관리하는 일반음식점 인허가 정보를 업소 1건 단위로 모은 원천 데이터로, API 전체 건수는 2,300,238건이고 주소와 좌표를 개별로 담는다. 창업자나 상권 분석가가 '이 동네에 영업 중인 한식 음식점이 몇 곳이고 최근 폐업은 얼마나 되나'를 확인할 때 쓴다. 지번·도로명 주소, 개방자치단체코드(행정표준 기관코드), 관리번호를 키로 다른 식품 인허가·위생 데이터와 잇고, 좌표(EPSG:5174)로 지도·상권 데이터와 겹쳐 쓴다.
description_portal: '식품_일반음식점 데이터는 한식, 중식, 일식 등 음식류를 조리 및 판매하며, 식사와 함께 음주행위가 허용되는 업소정보 데이터로 인허가일자, 영업상태(영업/정상), 사업장명(업소명), 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 일반음식점 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 식품안전정책과 / 043-719-2032 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
