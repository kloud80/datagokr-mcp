summary_user: 서울 강서구에서 기존 분류에 들지 않는 형태로 식품을 파는 식품판매업(기타) 영업장의 인허가 현황을 업소 1곳당 1건으로 담는다(인허가일자, 영업상태, 폐업일자, 사업장명, 지번·도로명 주소, 전화번호, 면적, 좌표 등). 상권 분석가나 창업 예정자가 강서구 안에서 이런 틈새형 식품판매 업소가 어디에 얼마나 영업 중이고 언제 폐업했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 식품 인허가·위생 데이터와는 관리번호(MGTNO)나 개방자치단체코드 같은 같은 기관 코드, 사업장명·주소 매칭으로 이어 붙인다.
description_portal: 서울특별시 강서구 관내에서 유통전문판매업이나 식품소매업 등 기존 분류에 포함되지 않는 다양한 형태의 식품을 판매하는 영업장에 대한 인허가 현황을 담고 있는 데이터입니다. 이러한 영업장은 주로 특수 목적의 식품 판매소, 소규모 전문 식품 매장, 테이크아웃 중심의 점포 등이 포함될 수 있으며, 통상적인 분류체계에 포함되지 않아 '기타'로 분류됩니다. 본 데이터에는 업소의 인허가일자, 영업상태, 사업장명, 소재지 주소, 전화번호 등의 항목이 포함되어 있으며, 비표준적이거나 틈새시장 중심의 식품 유통 현황을 파악하는 데 유용합니다. 이 데이터는 식품위생 정책 수립, 맞춤형 영업지도 계획, 영세사업자 지원, 지역 유통환경 모니터링 등 다양한 행정·정책적 활용이 가능합니다. 특히 '기타' 분류된 업종은 표준화가 어려운 만큼 개별 모니터링과 규제 필요성이 더 큽니다.
