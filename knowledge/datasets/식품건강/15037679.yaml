summary_user: 경기도 김포시 안의 집단급식소를 업소 한 곳당 한 행으로 담고, 업소명·도로명/지번 주소·전화번호·1일 급식인원·위탁급식업소명·데이터기준일자를 제공한다. 지역 급식업체나 분석가가 '김포시에서 하루 급식인원이 많은 집단급식소는 어디이고, 어느 위탁업체가 운영하는가'를 확인하는 데 쓴다. 인허가번호 같은 전역 조인 키가 없으므로 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 이어 쓴다.
limits: 김포시 한 곳만 다루므로 다른 시군과 비교하려면 각 시군 파일을 따로 모아야 한다. 공통 식별 키가 없어 업소명·주소 매칭에 의존하므로 표기 차이로 연결이 누락될 수 있다.
