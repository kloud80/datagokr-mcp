summary_user: 식품제조가공업(주류 포함) 업소의 행정처분을 업소 건별로 담은 원천 데이터로, 전국 294건에 업소명·업종·처분유형·위반내용·처분기관 등이 들어 있다. 소비자나 분석가가 특정 식품제조업체가 어떤 위반으로 어떤 처분을 받았는지 확인하는 질문에 쓴다. 주소(ADDR)를 조인 키로 삼아 같은 부문의 인허가 업소나 회수·판매중지 데이터와 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 식품제조가공업(주류포함) 행정처분결과에 대한 업체정보, 처분내용, 위반일자 등에 대한 속성정보를 제공합니다.이 자료를 통하여 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품제조가공업 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
