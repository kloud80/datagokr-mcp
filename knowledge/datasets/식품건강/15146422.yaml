description_portal: '○ 통계개요* 통계명 : 최근 일주일간 혼밥 빈도* 통계종류 : 조사통계, 일반통계* 작성목적 : 서울시민의 먹거리에 대한 인식, 행태분석 등 기초자료를 수집하고 연도별 추이분석을 통해 서울시 먹거리정책 방향을 설정하고서울시민의 새로운 요구에 대응하는 서울시 먹거리정책 수립을 위한 기초자료로 활용* 조사체계 : 조사기관 → 서울시 식품정책과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별, 연령별, 학력별 등)의 주관적 비율○ 기타* 서울시 거주 가구 내 만 18세 이상 가구원 조사※ 문 : 최근 일주일 동안 혼자 식사를 하신 경험은 몇 번이나 되십니까? 댁에서 하신 경우와 바깥에서 하신 경우로 구분하여 말씀해 주십시오○ 출 처 : 식품정책과 「서울시 먹거리 통계」○ 담 당 : 시민건강국 식품정책과'
