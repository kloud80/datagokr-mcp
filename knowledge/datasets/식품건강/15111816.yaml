        - '연쇄구균증은 발병과정이 양식장마다 차이가 있지만 사육관리가 부적절한 양식장에서 잘 발생되고 치어부터 성어까지 발병하여 피해를 주고있으므로 이에 '
        - "본 질병이 발생하는 주요한 요인은 사육환경의 악화와 부적절한 사육관리라고 할 수 있다. 그러므로 무엇보다도 철저한 관리가 절실히 요구된다.\n① "
