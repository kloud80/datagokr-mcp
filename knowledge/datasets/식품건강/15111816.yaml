summary_user: 어류 질병별로 질병명, 질병 분류, 대상 어종, 발생 지역 구분, 증상·원인, 진단 방법, 치료·예방 대책을 설명문 형태로 담은 전국 단위의 비공간 질병 정보다. 양식 어가나 수산 방역 담당자가 '넙치에 생긴 이 증상이 어떤 질병이고 어떻게 진단·예방하나'를 찾아보거나, 연구자가 어종별 질병 목록을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 어종명이나 질병명 같은 이름으로만 맞춰 이어 쓴다.
description_portal: 해당 데이터는 어류 질병 관련 발생 건수, 발생 지역, 질병명, 어종, 증상원인, 예방대책, 진단방법 등의  내용을 제공합니다.해당 데이터를 통해 양식 어가의 질병 예방 및 방역 활동 강화, 수산물 안전성 확보를 위한 체계적인 모니터링 시스템 구축, 어류 질병 연구 및 효과적인 백신 개발 촉진 등의 다양한 긍정적인 효과를 기대할 수 있습니다.이를 통해 국내 수산물의 생산성과 안전성을 더욱 향상하고, 지속 가능한 어업 경제 발전에 크게 기여하며, 관련 산업의 전반적인 경쟁력을 강화하는 데에 중요한 역할을 할 수 있습니다.
