    - name: SYMPTMS_CAUS_CN
      type: code
      null_rate: 0.0
      sample_values:
        - "병어는 먹이 섭취가 불량하고 바닥에 흩어져 있으며 완만한 유영을 하거나 몸체를 반대로 뒤집고 머리를 올려 입을 열고 있기도 한다. \n체색 흑화,"
        - 이 질병에 감염된 방어의 증상은 일반형과 뇌염형의 2가지형으로 나눌 수가 있다. 일반형의 외관상 특징은 안구돌출과 백탁, 안구주변의 출혈, 아가
        - 감염어의 외관적 증상은 안구돌출, 복부팽만, 눈 가장자리의 출혈이 관찰되고, 아가미 뚜껑 내부에 출혈과 결절이 나타난다. 또한 안구가 백탁되고,
