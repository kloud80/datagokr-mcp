        - 활주세균증
      stats:
        unique: 2
    - name: DGNS_MTHD_CN
      type: code
      null_rate: 0.0
      sample_values:
        - "병원체는 그램 양성 단구균으로 연쇄상이며, Lactococcus garvieae 와 \nStreptococcus iniae 등이 있다. 배지상에서"
        - 그람염색을 하여 양성의 연쇄구균을 확인하고 혈액한천 배지에서 α-용혈성을 확인하며 생화학적 성상과 PCR 법에 의해 진단한다.
        - 그람양성의 긴 사슬모양의 구균이며 혈액배지에서 용혈성을 확인한다.
      stats:
        unique: 5
    - name: DISS_CL_DVS_NM
