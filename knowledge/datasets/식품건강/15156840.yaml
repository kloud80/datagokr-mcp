description_portal: 본 데이터는 원전 비상대응을 위해 비치하는 방호약품(KI, 요오드화칼륨)의 보유수량을 연월·본부별로 정리한 현황 자료입니다. 비상대책실, 운영지원실, 비상기술지원실, 호기별 주제어실, 환경실험실, 출입통제소, 보건물리실, 자체소방대, 비상의료지원센터 등 장소별 비치 수량과 종사자용, 유관기관용·예비용 합계, 총 보유량을 함께 제공하여 비상물자 재고를 체계적으로 관리할 수 있습니다. 이를 통해 지역 주민·협력사·유관기관 등  비상 대비 수준을 이해하고, 필요 시 배포 가능한 물량 규모와 배치 현황을 파악할 수 있으며, 부족분 산정, 추가 확보 계획, 배포 동선·우선순위 수립, 월별 변화 추이 분석에도 활용할 수 있습니다.
