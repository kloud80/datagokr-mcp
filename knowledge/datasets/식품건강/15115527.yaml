summary_user: 서울특별시 중랑구의 이용업(이발소 등) 업소를 인허가 건별로 담은 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·사업장명·지번/도로명주소·중부원점TM(EPSG:5174) 좌표 등을 시군구 범위로 제공한다. 주민이나 창업 예정자가 '중랑구에서 지금 영업 중인 이발소는 어디이고 최근 폐업한 곳은 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·사업장명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 구의 이용업·미용업 인허가 데이터와 같은 컬럼 구조로 이어 붙여 쓴다.
description_portal: '서울특별시 중랑구의 이발소와 같이 머리 또는 수염을 깎거나 다듬는 등의 방법으로 용모를 단정하게하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
