summary_user: 경상북도 내 시군이 지정한 으뜸음식점(우수 음식점)을 업소 한 곳당 한 행으로 담은 파일로, 지정번호·시군명·업소명·대표자·주소·주메뉴·지정년도·지정상세를 담는다. 도민이나 관광객이 '경북 ○○시에서 시군이 지정한 믿을 만한 음식점과 대표 메뉴는 무엇인가'를 찾거나, 분석가가 시군별 우수 음식점 지정 현황을 볼 때 쓴다. 전역 조인 키가 없어 식품 인허가 업소 원장 등과는 업소명·주소를 맞추는 방식으로만 이어 쓰고, 시군명으로 지역별 집계를 붙인다.
description_portal: 「으뜸음식점 현황」 데이터는 도내 각 시군에서 지정한 우수 음식점의 기본 정보를 제공합니다. 업소명, 대표자, 주소, 주메뉴, 지정년도, 지정번호, 지정상세 등의 항목으로 구성되어 있으며, 지역 내 음식문화 수준 향상과 위생·서비스 수준 제고를 위해 관리되고 있습니다. 본 데이터는 외식업소의 품질 인증 현황을 한눈에 파악할 수 있도록 하여, 도민과 관광객이 믿고 찾을 수 있는 음식점을 쉽게 확인할 수 있도록 지원합니다. 공공데이터 활용을 통해 지역경제 활성화 및 관광산업 발전에 기여합니다. 자료 관련 문의는 054-880-3845로 하시기 바랍니다.
