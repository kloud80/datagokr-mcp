summary_user: 서울 동작구의 대중목욕탕·찜질방·사우나 등 목욕장업 업소를 인허가 건별로 담으며, 인허가일자·영업상태·폐업일자·주소·전화번호·면적·욕실 수·좌표(중부원점TM) 등을 포함한다. 동작구 주민이나 사업자가 동네에서 현재 영업 중인 목욕탕·찜질방이 어디인지, 최근 폐업한 곳은 어디인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울시 동작구 목욕장업 인허가 정보(https://data.seoul.go.kr/dataList/OA-19971/S/1/datasetView.do) 입니다.동작구의 대중목욕탕, 찜질방, 사우나 등 물로 목욕 할 수 있거나 맥반석ㆍ황토 등에게 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스를 제공하는 업소정보를 제공합니다. 좌표안내는 중부원점TM(EPSG:5174) 좌표계에 따른 해당 위치의 좌표 정보이며 위경도 좌표는 제공하고 있지 않습니다.전화번호, 소재지우편번호, 지번주소, 도로명주소, 사업장명, 위생업태명 등의 정보를 제공합니다.
