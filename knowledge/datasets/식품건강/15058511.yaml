summary_user: 경기도 내 축산물가공업(식육가공·알가공·유가공 등) 인허가 사업장을 업소 한 곳당 한 행으로 담으며, 인허가·취소·휴업·폐업 일자, 영업상태, 도로명·지번 주소, 위도·경도를 포함한다. 소비자나 분석가가 '우리 시군에서 지금 영업 중인 식육가공업체는 어디이고 최근 폐업한 곳은 얼마나 되나'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 맞물리는 조인 키가 없어서, 시군 코드(SIGUN_CD)나 사업장명·주소를 맞춰 경기도의 다른 인허가 현황이나 식품 인허가 업소 데이터와 잇는다.
description_portal: '경기도 내의 축산물 가공업체에 대한 인허가 정보입니다. 식육, 알, 원유 등을 가공하여 소시지, 전란분, 우유 등으로 판매하는 업소정보를 제공합니다.이 데이터는 경기도 내 축산가공업 인허가 사업장의 현황을 보여주는 자료로, 시군명, 사업장명, 인허가일자 및 취소일자, 영업상태, 폐업일자, 소재지 주소(도로명 및 지번), 우편번호, 위도·경도, 축산업무구분명(예: 축산물가공업), 축산물가공업구분명(예: 식육가공업), 축산고유번호, 권리주체고유번호, 총종업원수 등으로 구성되어 있습니다. 주요 항목에는 ‘사업장명’, ‘영업상태명’, ‘축산물가공업구분명’, ‘소재지도로명주소’, ‘총종업원수’ 등이 있으며, 축산물 제조업체의 운영 현황 파악, 영업 중단 및 폐업 실태 분석, 지역 기반 식품산업 분포 조사 등에 활용할 수 있습니다. 특히 ‘위도’, ‘경도’ 정보는 공간기반 분석에 유리하며, ‘권리주체고유번호’는 식약처 등 외부 데이터와의 연계를 통해 사업장 식별이 가능합니다.'
