summary_user: 대전광역시 유성구에서 인허가된 미용업소를 업소 한 곳당 한 행으로 담은 파일로, 업태 구분·위생업태, 사업장명, 지번·도로명 주소, 전화번호, 면적, 인허가일자를 포함한다. 창업 예정자나 지역 분석가가 "유성구 어느 동에 네일·피부 등 어떤 유형의 미용업소가 몰려 있고 최근 신규 인허가가 늘었는가"를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소·지번주소를 지오코딩하거나 사업장명·업태명을 이름으로 맞춰 이어 써야 한다.
limits: 범위가 유성구 한 시군구로 한정돼 대전 전체나 다른 지역과 비교하려면 별도 데이터가 필요하다. 공통 코드 키가 없어 이름·주소 매칭 과정에서 누락이나 오매칭이 생길 수 있다.
