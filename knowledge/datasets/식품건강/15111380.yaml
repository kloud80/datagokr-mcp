summary_user: 부산광역시 사상구 관내에 등록된 카페·커피숍을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·소재지 주소·전화번호·업태명과 데이터기준일자를 담는다. 사상구에서 카페 창업을 검토하는 사업자가 "어느 동네에 카페가 몰려 있나"를 확인하거나, 주민이 근처 커피숍 연락처를 찾는 데 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 데이터와는 업소명·주소 문자열을 맞춰 보는 방식으로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 주소 문자열 매칭에 의존해야 한다. 범위가 사상구 한 곳뿐이어서 부산 전체나 다른 구와 비교하려면 별도 자료가 필요하다.
