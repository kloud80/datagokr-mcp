summary_user: 건강기능식품에 관한 법률에 따라 신고된 건강기능식품 품목제조신고를 제품 단위로 담은 전국 데이터로, 품목명·업소명·신고일자와 함께 원재료명, 주된 기능성, 섭취방법·섭취 시 주의사항, 유통기한, 보관방법, 기준규격을 포함한다(세부 하위 원재료와 배합비는 빠짐). 소비자나 판매업자가 '이 건강기능식품에 어떤 원재료가 들어가고 어떤 기능성을 표시하는지'를 확인하거나, 분석가가 특정 원재료·기능성을 쓰는 제품과 제조업체를 찾는 데 쓴다. 품목제조보고번호(PRDLST_REPORT_NO)로 같은 기관의 바코드·영양성분 등 제품 DB와 잇고, 인허가번호(LCNS_NO)로 식품 인허가 업소·회수/행정처분 정보와 맞춰 보지만, 실측상 전역 조인 키는 확인되지 않아 같은 기관 코드나 이름 매핑에 기대야 한다.
description_portal: 건강기능식품에 관한 법률에 따른 건강기능식품의 품목제조신고 정보 - 원재료 포함(세부 하위 원재료 및 배합비 제외)를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
