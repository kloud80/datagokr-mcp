summary_user: 서울 강남구가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 원천 목록으로, 지정년도·지정번호·지정일자, 업소명, 도로명·지번 주소, 행정동, 업태, 주된 음식, 영업장 면적, 급수시설 구분, 전화번호를 포함한다(CSV 약 90KB). 강남구 주민이나 방문객이 '이 동네에서 구청이 모범음식점으로 지정한 한식집이 어디인가'를 찾거나, 분석가가 행정동별 모범음식점 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없지만, 허가(신고)번호로 식품 인허가 업소 원장과 대조하고 시군구코드·행정동명·주소로 다른 위생 지정·행정처분 자료와 맞춰 본다.
description_portal: 강남구 소재 모범음식점으로 지정된  업소명, 지정년도, 지정번호, 소재지, 업태, 허가(신고)번호, 주된음식, 급수시설구분 등 데이터를 공개합니다. 강남구 소재 모범음식점으로 지정된 업소들의 상세 정보를 공개합니다. 이번에 공개되는 자료는 주민들의 건강과 위생적인 식문화 증진을 위해 강남구가 직접 관리하고 선정한 업소들의 정보를 담고 있습니다. 각 업소의 업소명, 지정년도, 지정번호는 물론, 소재지, 업태, 허가(신고)번호, 주된 음식, 급수시설 구분 등 세부적인 항목까지 모두 포함되어 있습니다. 이 정보는 강남구청 공식 홈페이지를 통해 언제든지 확인 가능하며, 누구나 손쉽게 접근할 수 있도록 투명하게 관리되고 있습니다.모범음식점 제도는 위생 상태가 우수하고, 친절한 서비스와 뛰어난 맛을 자랑하는 업소들을 발굴하여 시민들이 안심하고 식사할 수 있는 환경을 조성하는 데 그 목적이 있습니다. 강남구는 앞으로도 지속적인 점검과 평가를 통해 새로운 모범음식점을 발굴하고, 기존 업소들의 품질 유지를 위해 적극적으로 지원할 계획입니다. 이러한 노력은 지역 외식 산업의 질적 향상을 도모하고, 강남구 방문객들에게 신뢰할 수 있는 식사 경험을 제공하여 지역 경제 활성화에도 기여할 것입니다. 공개된 정보를 활용하여 강남구의 안전하고 맛있는 식당들을 찾아보시길 바랍니다.
