summary_user: 식품의약품안전처 자료를 재난안전데이터 공유플랫폼이 연계 제공하는 전국 어린이급식관리지원센터별 지원 현황으로, 필드명으로 보아 관할기관·센터명·연도·분기마다 유치원·어린이집·기타 시설의 지원 개소 수와 인원을 담은 분기 집계 자료다. 분석가나 지자체 담당자가 '우리 지역 급식센터가 분기별로 유치원과 어린이집을 몇 곳, 몇 명 지원했나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 관할기관명·센터명 같은 이름 매핑으로만 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 어린이급식센터지원현황 정보입니다.\""
