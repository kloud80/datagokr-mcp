summary_user: 식품 관련 행정처분의 기준이 되는 처분기준코드를 코드 하나 단위로 담은 코드표이며, 상위 코드와 레벨로 이루어진 계층 구조에 처분기준명·근거법령·위반유형·사용여부·유효기간이 함께 들어 있다. 행정처분 내역을 분석하는 분석가나 서비스 개발자가 '이 처분 코드가 어떤 위반유형과 근거법령에 해당하는가'를 풀이하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 같은 기관(식품안전나라)의 행정처분 데이터와는 처분기준코드(DSPS_STDR_CD)나 이름 매핑으로만 이어 쓴다.
description_portal: 처분기준 코드에 대한 속성정보를 제공합니다. 속성정보로는 처분기준코드 , 상위처분기준코드 , 레벨 , 처분기준코드명 , 근거법령 , 위반유형코드 , 위반유형명 , 사용여부 , 유효시작일자 , 유효종료일자 , 최종수정일시가 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
