summary_user: 서울 금천구 단란주점영업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·좌표·종사자 수·시설 규모·임대 정보 등을 포함한다. 금천구 안에서 현재 영업 중인 단란주점이 어디에 몰려 있는지, 언제 개업·폐업했는지를 확인하려는 주민·사업자·정책 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지역 같은 업종 인허가 데이터나 다른 식품 인허가 데이터와는 관리번호(MGTNO)·주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 금천구 단란주점영업의 인허가 현황을 상세히 제공하는 데이터로, 인허가일자, 영업상태, 전화번호, 주소, 사업장명 등 기본 정보와 함께 위생업태, 종사자 수, 시설 규모, 임대 정보 등 다양한 세부 항목을 포함합니다. 이를 통해 단란주점의 개업, 폐업, 휴업 등 행정 이력과 현재 업소 현황을 한눈에 파악할 수 있습니다. 해당 자료는 단란주점 업소 관리, 유흥 관련 정책 수립, 시장 동향 연구, 지역사회 안전 대책 마련 등 다양한 분야에서 활용 가능하며, 불법 영업 방지, 밀집 지역 모니터링, 상권 변화 분석 등 실무적·정책적 의사결정에도 기초 자료로 기여할 수 있습니다.
