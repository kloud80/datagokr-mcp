summary_user: 인천 부평구가 지정한 모범음식점을 업소 한 곳당 한 행으로, 업소명·도로명 소재지·전화번호·업태(한식·중식 등)를 담은 건별 목록 파일(csv, 약 3.9KB)이다. 부평구 주민이나 방문객이 '근처에 위생·서비스가 검증된 한식당이 있나'를 찾거나, 분석가가 모범음식점의 업태별 분포와 입지를 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장 등 다른 데이터와는 업소명·도로명주소를 맞춰 이어 써야 한다.
description_portal: '모범음식점의 업소명, 소재지, 전화번호, 업태 등을 수록한 데이터.위생 수준과 서비스 품질이 우수한 음식점 현황을 파악하고, 안전한 외식환경 조성, 지역 음식문화 개선, 관광자원 개발 및 상권 활성화 정책 등에 활용 가능하다.활용 목적 및 특징– 모범음식점 등록 현황 및 업태별 분포 분석– 도로명주소 기반 입지 특성 및 접근성 평가– 위생·서비스 품질 향상 정책 근거 제공– 지역 외식산업 경쟁력 강화 및 관광 활성화 자료 활용주요 항목 설명● 연번: 데이터의 고유 번호● 업소명: 등록된 모범음식점의 공식 명칭● 소재지(도로명): 업소가 위치한 도로명 주소● 전화번호: 음식점 문의 및 예약을 위한 연락처● 업태: 영업 형태(한식, 중식, 양식, 일식 등)'
