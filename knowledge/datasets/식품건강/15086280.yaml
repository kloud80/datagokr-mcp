summary_user: 부산광역시 서구 관내에서 영업 중인 유통전문판매업체(직접 제조하지 않고 위탁 제조한 식품을 자기 상표로 파는 업체)를 업소 한 곳당 한 줄로 담은 현황 파일로, 업종명·업소명·도로명 소재지·전화번호로 구성되며 포털 설명상 2025년 8월 4일 기준입니다. 식품 창업자나 거래처를 찾는 사업자가 서구에 어떤 자체 브랜드 식품 유통업체가 어디에 있는지 확인하는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 다른 식품 인허가·행정처분 데이터와는 업소명과 도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '부산광역시 서구에서 영업중인 유통전문판매업체의 업종에 대한 테이터로  업소명, 주소, 전화번호 정보등의 항목에 대한 정보를 제공합니다.- 유통전문판매업은 식품판매업 중 하나의 종류이다.- 유통전문판매업: 식품 또는 식품첨가물을 스스로 제조, 가공하지 아니하고 제1호의 식품제조, 가공업자 또는제3호의 식품첨가물제조업자에게 의뢰하여 제조, 가공한 식품 또는 식품첨가물을 자신의 상표로 유통, 판매하는 영업- 현재 데이터는 2025년 8월 4일 기준으로 부산광역시 서구 관내 유통전문판매업 현황입니다.'
