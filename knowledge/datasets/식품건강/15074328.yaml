summary_user: 식품별 동물용의약품 잔류허용기준 적용 대상 식품을 한 행씩 담은 기준 목록으로, 식품 한글·영문명, 일일섭취량, 잠정기준 적용 여부, 대·중·소분류가 들어 있으며 전국 단위의 비공간 데이터다. 축산물·수산물 수입·유통 사업자나 분석가가 "이 식품이 어느 분류에 속하고 잠정기준이 적용되는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 DB와는 식품명이나 분류명을 맞춰 붙이거나, 같은 기관(식품의약품안전처) 데이터와 이름으로 연결해야 한다.
description_portal: 식품의약품안전처에서 관리하는 식품별 동물용의약품 잔류허용기준 정보 자료입니다.식품한글명, 식품영문명, 일일섭취량, 잠정기준적용여부, 대분류, 중분류, 소분류 항목 제공이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
