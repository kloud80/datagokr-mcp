summary_user: 경기도 시군이 관리하는 목욕장업(한증막업) 인허가 업소를 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자, 면적·발한실 여부·욕실 수, 주소와 위경도 좌표를 포함한다. 주민이나 입지 분석가가 '우리 시군에 지금 영업 중인 한증막·사우나가 어디에 몇 곳 있고 규모는 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표 매핑으로 다른 공중위생업소·인구·상권 자료와 잇는다.
description_portal: 목욕장업(한증막업) 현황 데이터는 경기도 내 목욕탕·사우나·한증막 시설의 운영 현황을 제공하는 위생·산업 관련 자료입니다. 주요 항목에는 시군명, 시군코드, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지면적, 건물소유구분명, 다중이용업소여부, 발한실여부, 욕실수, 위생업종명, 위생업태명, 도로명주소·지번주소·우편번호·위경도 좌표 등이 포함됩니다. 이 데이터는 경기도 31개 시군에서 관리하는 인허가 기반 자료로, 목욕장업소의 분포 현황, 시설 특성, 영업 지속성, 위생 관리 등을 파악하는 데 유용합니다. 또한 지역 내 생활 편의시설 현황 조사, 위생안전 관리, 산업 정책 수립, 상권 및 입지 분석 등 다양한 활용 방안을 가집니다. 특히 발한실과 같은 한증 시설 유무 및 욕실수는 시설 규모와 서비스 수준을 평가하는 지표로, 보건·위생 관련 정책 연구나 생활SOC(사회간접자본) 분석에 중요한 기초자료로 쓰일 수 있습니다.
