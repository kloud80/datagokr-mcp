summary_user: 식품첨가물제조업소 가운데 폐업한 업소를 업소 한 곳 단위로 담는 원천 목록으로, 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업상태·주소·관할 기관명을 전국 범위로 제공한다. 식품첨가물 원료 거래처나 제조업체가 현재 영업 중인지, 언제 폐업했는지 확인하려는 사업자나 업계 변동을 보는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 식품 인허가·행정처분 데이터와는 인허가번호·업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 인허가번호, 업소명, 대표자명, 업종, 허가일자, 폐업일자, 페업상태, 주소, 기관명 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품첨가물 제조업 분야의 정보 제공, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
