description_portal: 이 데이터는 서울특별시 광진구에 위치한 공중위생업소 중 '세척제 제조업'으로 신고된 업소의 현황 정보를 제공합니다. 「공중위생관리법」에 따라 세척제 제조업은 미용업소, 숙박업소, 목욕탕 등 공중위생시설에서 사용하는 세척용 화학제품(샴푸, 비누, 세정제 등)을 직접 제조하거나 혼합하는 업종을 말하며, 위생안전 및 품질관리 차원에서 지자체에 신고해야 합니다.데이터에는 업소명, 소재지, 업종유형, 신고일자, 관리기관 등의 항목이 포함되어 있으며, 이를 통해 지역 내 공중위생시설 운영 실태 파악, 위생용품 제조·공급 체계 분석, 생활화학제품 관리, 업종별 신고 현황 확인 등 다양한 정책적·행정적 활용이 가능합니다.또한 세척제는 사용자의 건강과 직결되는 제품인 만큼, 제조 시설의 위생 수준과 관리 체계 확보가 필수적입니다.※ 본 데이터는 3일 전 기준의 최신 정보로 정기 갱신되며, 위치정보는 포함되지 않거나 중부원점TM(EPSG:2097) 좌표계 기준으로 제공될 수 있으므로 지도 연동 시 변환이 필요합니다.
