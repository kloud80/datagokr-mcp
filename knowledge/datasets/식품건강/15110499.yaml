description_portal: 대구광역시 서구 관내 카페 현황을 바탕으로 출입구 폭, 휠체어 출입가능 유무, 장애인 화장실 유무 등의  교통약자를 위한 상세데이터를 제공하는 서비스본 데이터는 대구광역시 서구청이 제공하는 교통약자를 위한 카페 시설의 접근성과 편의시설 현황을 수록한 자료이다. 해당 데이터는 카페별 주소, 문 유형, 자동문 설치 여부, 휠체어 출입 가능 여부, 출입구와 내부 공간의 치수, 경사로 및 손잡이 설치 여부, 미끄럼 방지판 유무, 테이블 배치 및 높이, 장애인 전용 주차장과 화장실의 설치 여부 등을 포함한다. 이를 통해 교통약자들이 시설의 접근 가능성을 사전에 파악하고, 이용 여부를 결정하는 데 활용할 수 있다. 또한 복지시설 개선 및 민간업소의 접근성 분석 자료로도 사용 가능하다.
