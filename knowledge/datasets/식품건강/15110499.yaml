status: active
summary_user: 대구광역시 서구 관내 카페를 한 곳씩 기록한 건별 자료로, 업소명·주소와 함께 출입문 유형, 휠체어 출입 가능 여부, 출입구 폭·문턱 높이, 경사로·손잡이·미끄럼 방지판, 테이블 높이·간격, 장애인 주차장과 장애인 화장실 설비를 담는다. 휠체어 이용자나 보호자가 '서구에서 문턱 없이 들어가고 장애인 화장실이 있는 카페가 어디인가'를 미리 확인하거나, 구청·분석가가 민간 업소의 접근성 수준을 점검하는 데 쓴다. 인허가번호·사업자번호 같은 공통 조인 키가 없어 식품 인허가 업소 원장 등 다른 데이터와는 업소명·주소를 맞춰 연결해야 한다.
limits: 서구 한 개 구의 카페만 다루므로 다른 시군구나 다른 업종의 접근성은 알 수 없다. 전역 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 이어 붙일 수 있고, 이 과정에서 매칭 오류가 생길 수 있다.
