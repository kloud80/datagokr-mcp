summary_user: 순천시 관내에서 영업 중인 단란주점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화번호를 담는다(csv 약 8KB). 시민이나 분석가가 '순천시 어느 동네에 단란주점이 몰려 있는가'를 확인하거나, 청소년 유해환경 점검 대상 업소 목록을 뽑는 데 쓴다. 인허가번호·사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞대어 이어야 한다.
description_portal: 전라남도 순천시_단란주점 현황 데이터는 순천시 관내에 영업 중인 단란주점에 대한 정보를 상세하게 담고 있습니다. 이 데이터는 각 업소의 업소명, 소재지 도로명 주소, 소재지 지번 주소, 그리고 전화번호 등의 핵심 정보를 포함하고 있습니다. 이를 통해 순천시 내 단란주점의 지리적 분포와 기본적인 정보를 파악할 수 있습니다.이 데이터는 순천시의 유흥업소 관리 및 풍속 영업 단속에 필요한 기초 자료로 활용될 수 있습니다. 특정 지역의 단란주점 밀집도를 파악하여 관련 정책을 수립하거나, 청소년 유해 환경 개선을 위한 정보로 사용될 수도 있습니다. 또한, 시민들이나 관련 업계 종사자들이 순천시 내 단란주점의 현황을 파명하는 데 도움을 주어, 투명하고 건전한 영업 환경 조성에 기여할 수 있습니다.
