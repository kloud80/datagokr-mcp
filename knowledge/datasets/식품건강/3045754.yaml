summary_user: 부산광역시 금정구 관내에 지정된 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 소재지·전화번호·주된 음식을 담는다(csv 약 1.8KB의 소규모 목록). 금정구 주민이나 방문객이 '금정구에서 모범음식점으로 지정된 한식집은 어디인가' 같은 외식 선택 질문에 쓴다. 인허가번호 같은 전역 조인 키가 없어, 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·도로명 주소를 맞춰 이어 쓴다.
description_portal: 이 자료는 부산광역시 금정구 관내에 지정된 모범음식점 정보가 있는 데이터로 음식점 업소명, 음식점 소재지(도로명), 음식점 전화번호, 음식점 주된 음식 정보가 있습니다.*전화번호에 휴대폰번호 등 개인정보가 있을 경우 비공개로 처리합니다. -> 비공개*주요 데이터 컬럼별 상세설명 입니다.○ 업소명 →  금정구 소재 모범음식점 업소명 입니다.○ 소재지(도로명) →  금정구 소재 모범음식점 가게주소 입니다.○ 소재지 전화번호 → 금정구 소재 모범음식점 가게 전화번호 입니다.○ 주된 음식 → 금정구 소재 모범음식점 주된 음식 입니다.
