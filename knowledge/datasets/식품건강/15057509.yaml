summary_user: 서울 서대문구에 신고된 건강기능식품 일반판매업소를 업소 단위로 담은 인허가 원장으로, 업소명·인허가일자·영업상태·폐업일자·지번/도로명 주소·좌표(X, Y)·소재지 면적 등을 담는다. 소비자가 동네 약국·매장이 정식 신고된 건강기능식품 판매업소인지, 영업 중인지 확인하거나 분석가가 구 안의 판매업소 분포와 개·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 좌표로 상권·지도 데이터와 겹쳐 본다.
description_portal: 건강기능식품 유통전문 판매업소의 신고 등록 현황입니다.서울특별시 서대문구_건강기능식품 일반판매업 현황 데이터는 서울시 서대문구에 등록된 건강기능식품 일반판매업소의 정보를 담고 있는 자료입니다. 이 데이터는 소비자들이 안전한 건강기능식품을 구매하도록 돕고, 관련 업체 관리 및 정책 수립에 활용될 수 있습니다. 이 데이터는 위생 점검 및 단속을 위한 기초 자료로 사용될 수 있으며 등록된 업소의 영업 상태를 지속적으로 관리하여 불법 판매를 막고, 소비자 피해를 예방하는 데 활용될 수 있습니다.
