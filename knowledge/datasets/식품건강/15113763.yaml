summary_user: 식품의약품안전처가 관리하는 공유주방운영업 인허가 대장으로, 업소별 인허가번호·업소명·업종·허가일자·주소·변경일시를 담는다. 현재 API 전체 건수는 1건이며 범위는 전국이다. 공유주방 창업자나 분석가가 특정 업소의 허가 여부와 소재지를 확인하는 데 쓰고, 주소(LOCP_ADDR)를 조인 키로 같은 부문의 다른 식품 인허가 업소 데이터와 이어 쓴다.
limits: API 전체 건수가 1건이고 검증 때 수신한 것도 1행이라, 공유주방 업소 전체 현황이나 상권 분석에는 이 데이터만으로 쓸 수 없다. 이어 붙일 수 있는 실측 키는 주소뿐이므로 주소 표기가 다르면 매칭이 어긋날 수 있다.
