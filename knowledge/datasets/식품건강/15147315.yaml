summary_user: 서울 강북구에서 부패·변질되기 쉬운 식품(유산균 음료, 어류, 조개류 등)을 운반하는 식품운반업소의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 영업 중인 곳과 폐업한 곳이 모두 들어 있다. 사업자나 분석가가 강북구에서 영업 중인 식품운반업체가 어디에 몇 곳 있는지, 언제 인허가를 받았고 폐업했는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 구나 다른 업종 인허가 데이터와는 관리번호(MGTNO)·업소명·주소 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
