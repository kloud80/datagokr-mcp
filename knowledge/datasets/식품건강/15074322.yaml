summary_user: 방사선조사가 인정된 식품 품목별로 기준규격명, 시험항목, 기준규격값과 최대·최소값·단위, 유효 개시·종료일자, 출처를 담은 기준규격 목록으로, 범위는 전국이며 지역 구분은 없다. 식품 제조·수입 사업자나 소비자가 "이 품목은 방사선조사가 허용되는지, 허용 선량 기준은 얼마인지"를 확인할 때 쓴다. 실측 컬럼에 품목제조보고번호·바코드 같은 전역 조인 키가 없어, 다른 식품 품목 DB와는 품목한글명(PC_KOR_NM) 같은 이름 매핑으로만 이어 쓴다.
description_portal: 기준규격명, 품목한글명, 시험항목 한글명, 품목항목속성 한글명, 기준규격값, 기준규격값 요약, 유효개시일자, 유효종료일자, 출처, 최대값, 최소값, 단위명 등을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
