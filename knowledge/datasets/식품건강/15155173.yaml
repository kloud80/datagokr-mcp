summary_user: 건강기능식품 유통전문판매업(제조를 위탁해 자기 상표로 판매하는 업소)의 인허가 정보를 업소 단위 건별로 담으며, 전국 15,419건에 사업장명·인허가일자·영업상태·주소·좌표 등이 들어 있다. 사업자는 물론 분석가나 국민이 특정 유통전문판매업소가 인허가를 받고 영업 중인지, 어느 지역에 있는지 확인하는 질문에 쓴다. 지번주소·도로명주소(address)와 관리번호(MNG_NO, pnu 키)로 다른 주소 기반 데이터와 이어 쓰고, 같은 식품 인허가 업소 부문의 다른 업종 데이터와 함께 상권을 볼 때도 쓴다.
description_portal: '식품_건강기능식품유통전문판매업 데이터는 건강기능식품전문제조업자에게 의뢰하여 제조한 건강기능식품을 자신의 상표로 유통 및 판매하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 건강기능식품유통전문판매업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처 건강기능식품정책과 / 043-719-2452* 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
