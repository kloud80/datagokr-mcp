description_portal: '식품소분업 등 식품위생업소 관리 현황(업종, 업소명, 소재지, 전화번호※ 식품소분ㆍ판매업가. 식품소분업: 총리령으로 정하는 식품 또는 식품첨가물의 완제품을 나누어 유통할 목적으로 재포장ㆍ판매하는 영업나. 식품판매업1) 식용얼음판매업: 식용얼음을 전문적으로 판매하는 영업2) 식품자동판매기영업: 식품을 자동판매기에 넣어 그대로 판매하거나 내부에서의 자동적인 혼합ㆍ처리과정을 거친 식품을 판매하는 영업. 다만, 소비기한이 1개월 이상인 완제품만을 자동판매기에 넣어 판매하는 경우는 제외한다.3) 유통전문판매업: 식품 또는 식품첨가물을 스스로 제조ㆍ가공하지 아니하고 제1호의 식품제조ㆍ가공업자 또는 제3호의 식품첨가물제조업자에게 의뢰하여 제조ㆍ가공한 식품 또는 식품첨가물을 자신의 상표로 유통ㆍ판매하는 영업4) 집단급식소 식품판매업: 집단급식소에 식품을 판매하는 영업5) 기타 식품판매업: 1)부터 4)까지를 제외한 영업으로서 총리령으로 정하는 일정 규모 이상의 백화점, 슈퍼마켓, 연쇄점 등에서 식품을 판매하는 영업※  용기ㆍ포장류제조업가. 용기ㆍ포장지제조업: 식품 또는 식품첨가물을 넣거나 싸는 물품으로서 식품 또는 식품첨가물에 직접 접촉되는 용기(옹기류는 제외한다)ㆍ포장지를 제조하는 영업나. 옹기류제조업: 식품을 제조ㆍ조리ㆍ저장할 목적으로 사용되는 독, 항아리, 뚝배기 등을 제조하는 영업'
