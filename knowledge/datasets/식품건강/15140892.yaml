summary_user: 서울 광진구 관내 식품자동판매기업 인허가 업소를 업소 한 곳당 한 행으로 담은 건별 원장으로, 업소명·인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표(X, Y) 등을 포함한다. 광진구에서 지금 영업 중인 자판기 업소가 어디에 몇 곳 있는지, 최근 폐업한 곳은 어디인지를 확인하려는 주민·사업자·위생 행정 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 광진구 관내에서 식품자동판매기업 인허가를 받고 운영 중인 업소의 현황 정보를 제공합니다. 식품자동판매기업은 무인 자판기(자동판매기)를 이용해 음료, 간편식, 유제품, 과자류 등 다양한 식품을 소비자에게 자동으로 판매하는 업소로, 「식품위생법」에 따라 위생관리 및 품질 기준을 충족해야 합니다. 이 데이터에는 업소명, 소재지, 인허가일자, 업종 유형 등의 항목이 포함되며, 학교, 병원, 공공시설 등 다중이용시설 내 자동판매기 위생관리, 식품 안전 모니터링, 간편소비 유통망 분석, 자판기 운영 분포 파악 등 다양한 행정 및 민간 목적에 활용됩니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않으므로 지도 기반 서비스 연계 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신되며, 광진구 지역 내 식품 유통 인프라와 자판기 기반 소비 환경 분석에 유용한 자료입니다.
