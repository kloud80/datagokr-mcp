summary_user: 인천광역시 서구(서해구) 관내 집단급식소의 등록 현황을 업소 한 곳당 한 행으로 담은 원장 파일로, 업소명·도로명/지번 소재지·전화번호·데이터기준일자로 구성된다. 산업체·공공기관·복지시설 급식소의 위생 점검 대상을 파악하려는 담당자나, 서구 안 어느 동네에 집단급식소가 몰려 있는지 보려는 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없어서 다른 식품 인허가·행정처분 데이터와는 업소명·주소 매칭으로만 잇는다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 집단급식소의 등록 현황을 담은 데이터입니다. 본 자료는 인천광역시 서구 내 집단급식소의 급식소 명칭, 주소, 전화번호, 기준일자 등으로 구성되어 있습니다. 집단급식소란 산업체, 공공기관, 복지시설 등에서 다수의 사람에게 식사를 제공하는 급식시설로, 위생관리와 식품안전 확보를 위한 주요 관리 대상입니다. 본 데이터는 식품위생 관리를 위한 기초자료로 활용될 수 있을것으로도 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
