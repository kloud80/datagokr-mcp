summary_user: 성남시 안에서 운영 중인 집단급식소를 한 곳씩 담은 목록으로, 구별·업소명·급식소 구분·도로명/지번 소재지·데이터기준일자를 담는다(CSV 약 147KB). 위생 담당자나 분석가가 '성남시 어느 구에 어떤 종류의 집단급식소가 몇 곳 있는가'처럼 급식 안전 점검 대상과 지역별 분포를 파악하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 보거나 구 이름으로만 연결한다.
limits: 인허가번호·사업자번호·좌표 같은 공통 키가 없어 다른 데이터와 정확히 1:1로 잇기 어렵고, 업소명·주소 매칭에 의존해야 한다. 범위는 성남시 한 곳에 한정되며, 미수집 항목은 공란으로 들어 있다.
