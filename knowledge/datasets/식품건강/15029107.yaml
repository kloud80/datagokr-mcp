description_portal: 경기도 성남시내 집단급식소 현황에 대한 데이터로 구별, 업소명, 구분,소재지 등에 대한 항목을 제공하고 있습니다. 성남시 집단급식소 현황자료는 성남시 내에서 운영 중인 집단급식소의 정보를 정리한 자료입니다.이 자료는 구별, 업소명, 급식소 구분, 소재지 주소 등의 항목이 포함되어 있습니다.데이터는 연간주기로 업데이트 되어 정보를 반영하며 CSV형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.해당자료는 식품위생 관리, 급식 안전 점검, 지역별 급식소 분포 파악과 등에 활용되며, 공공기관의 급식 품질 향상과 식중독 예방을 위한 기초자료로 활용 할 수 있습니다.
