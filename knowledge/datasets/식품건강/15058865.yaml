summary_user: "건강기능식품에 관한 법률에 따라 신고된 건강기능식품 품목제조 신고사항을 품목(품목제조보고번호) 단위로 담으며, 제품명·제조업소·주된 기능성·원재료·섭취 방법·섭취 시 주의사항·보관 방법·유통기한 일수·기준규격 등을 포함하고 범위는 전국입니다. 소비자나 분석가가 '특정 기능성(예: 면역, 혈행)을 표시한 건강기능식품은 어떤 업체가 어떤 원료로 만드는가'를 확인하거나, 사업자가 경쟁 제품의 원재료와 섭취량을 비교하는 데 쓴다. 실측상 데이터 전체에 걸쳐 쓰는 공통 조인 키는 없지만, 품목제조보고번호(PRDLST_REPORT_NO)와 인허가번호(LCNS_NO)·업소명으로 같은 기관의 바코드·영양성분·원재료 등 제품 DB, 식품 인허가 업소, 회수·행정처분 정보와 이름·코드 매핑으로 이어 쓴다."
description_portal: 식품의약품안전처에서 관리하는 건강기능식품에 관한 법률에 따른 건강기능식품 품목제조 신고사항 현황 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
