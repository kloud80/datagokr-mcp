summary_user: 충청남도 논산시에 있는 위탁급식영업소를 업소 한 곳당 한 행으로 담은 파일(csv 약 8KB)로, 사업소명·인허가일자·영업상태·행정동·도로명/지번 주소·대표전화를 담는다. 급식 위탁업체를 찾는 기업·병원 담당자나 지역 식품업 현황을 보는 분석가가 '논산시에서 현재 영업 중인 위탁급식업체는 어디인가' 같은 질문에 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·행정처분 데이터와는 사업소명·주소를 맞춰 붙이거나 행정동명으로 묶어 연결한다.
description_portal: '위탁급식이란 기업, 학교, 병원 등에서 단체 급식 운영을 전문 급식 업체에 맡기는 것을 의미합니다. 즉, 급식 운영에 필요한 시설, 인력, 식자재 등을 전문 업체가 담당하고, 고객은 위탁 계약을 통해 식사를 제공받는 시스템입니다. 산업체 위탁급식: 공장, 기업체 등에서 직원들의 식사를 위해 운영됩니다. 학교 위탁급식: 학생들의 급식을 전문 업체가 운영합니다. 병원 위탁급식: 환자 및 의료진의 식사를 전문 업체가 담당합니다. 기타: 관공서, 연수원, 복지시설 등 다양한 곳에서 위탁급식이 운영됩니다. 본 데이터는 충청남도 논산시의 위탁급식영업소 현황에 관련 상세 정보를 제공하고 있으며, 어린이집, 학교, 공공기관 등은 제외됨'
