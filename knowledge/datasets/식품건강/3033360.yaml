description_portal: 전라남도 나주시 관내 식품접객업소에 대한 정보입니다. 식품접객업소는 현재 일반음식점/휴게음식점/제과점/단란주점/유흥주점으로 분류가 되어 있으며, 업소명, 주소지, 업소 연락처가 있습니다. 연락처가 등록되어 있지 않은 업소는 인터넷으로 업소 검색하여 확인하시기 바랍니다. 자세한 사항은 파일을 확인하여 주시기 바랍니다. ※ 식품접객업 영업형태에 대한 차이는 주류 판매 및 접객행위 여부에 따라 분류가 됩니다. ※ 식품접객업 영업형태   [일반음식점] 음식류를 조리 판매하는 영업으로서, 식사와 함께 부수적으로 음주 행위 허용     [휴게음식점] 다류, 아이스크림류 등을 조리판매 하거나 패스트푸드, 분식점 형태 등  음식류 조리 판매(음주행위 금지)    [제과점]         빵, 떡, 과자 등을 제조, 판매하는 영업(음주행위 금지)     [단란주점]     주류를 조리, 판매하는 영업으로서 손님이 노래 부르는 행위 허용(유흥접객행위 금지)    [유흥주점]    주류를 조리, 판매하는 영업으로서 유흥종사자 및 유흥시설 설치 허용하고, 손님이 노래를 부르거나 춤을 추는 행위 가능
