summary_user: 부산광역시 동구 관내 이·미용업, 숙박업, 목욕장업, 세탁업 등 공중위생업소를 업소 한 곳당 한 행으로 담은 CSV 파일(약 51KB)로, 업종명·업소명·도로명 주소·전화번호를 담는다. 동구 주민이 집 근처 미용실이나 목욕탕의 주소와 연락처를 찾거나, 분석가가 동구 안 업종별 공중위생업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열을 맞추거나 주소를 지오코딩해 이어야 하며, 식품 인허가 업소나 위생 지정 데이터와도 같은 방식으로 대조한다.
description_portal: 부산광역시 동구 공중위생업소 현황 데이터는 관내 이·미용업, 숙박업, 목욕장업, 세탁업 등 「공중위생관리법」에 따라 등록된 공중위생 관련 업종의 운영 실태를 체계적으로 관리하고, 위생 수준 향상을 도모하기 위해 구축된 자료입니다. 해당 데이터는 업종명, 업소명, 영업소 주소, 전화번호로 구성되어 있으며, 각 업소의 기본적인 정보와 연락처를 포함하고 있어 주민들의 생활 정보 제공은 물론, 민원 응대, 현장 위생 점검, 자율 점검 대상 관리 등 다양한 행정 업무에 활용됩니다. 특히 지역 주민들이 주변의 공중위생업소를 손쉽게 확인하고 필요한 서비스를 이용할 수 있도록 함으로써, 생활 편의성을 높이고 위생 환경 개선에 기여하는 중요한 기초 자료로 활용됩니다.
