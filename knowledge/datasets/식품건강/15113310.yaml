description_portal: '해당 데이터는 면적 66제곱미터 이상 이미용업에 대한 자료입니다.등록 사업체들의 업종명, 업소명, 영업소 주소(도로명주소), 영업장면적(단위: 제곱미터), 소재지전화, 업태명을 포함하고 있습니다.업데이트 주기는 연간 입니다. 업종명에는 이용업, 미용업, 일반미용업, 네일미용업, 화장 분장미용업, 종합미용업, 피부미용업 등이 있습니다.영업소 주소는 도로명주소 기준으로 작성되었으며, 소재지전화는 NNN-NNNN-NNNN 형식으로 작성되었습니다.업태명에는 네일아트업, 일반미용업, 일반이용업, 피부미용업, 기타로 구분되어 있습니다.'
