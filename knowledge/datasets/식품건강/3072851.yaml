summary_user: 전남 순천시 내 유흥주점을 업소 한 곳당 한 행으로 담은 파일로, 실제 컬럼은 업종명·업소명·도로명 소재지·전화번호 네 개뿐이며 CSV 약 24KB 규모입니다. 순천 시민이나 상권·생활환경 분석가가 "순천시 어느 동네에 유흥주점이 몰려 있나"를 도로명 주소로 확인할 때 쓴다. 공통 조인 키(인허가번호·사업자번호·좌표)가 없어 다른 식품 인허가 업소 데이터와는 업소명·주소 문자열을 맞춰서만 이어 쓴다.
description_portal: 전라남도 순천시 유흥주점 현황 데이터는 지역 내 유흥업소의 분포와 운영 실태를 종합적으로 파악할 수 있도록 구성된 공공데이터입니다. 이 데이터는 업소명, 주소, 사업자 등록번호, 영업 형태, 인허가 일자, 영업 상태(정상, 폐업, 휴업), 대표자 성명, 연락처, 영업 면적, 좌석 수 등 다양한 항목을 포함하고 있어, 유흥업소의 규모와 특성, 운영 현황을 상세히 확인할 수 있습니다. 특히, 영업 허가 및 단속 이력 정보는 행정기관이 지역 내 유흥업소를 관리하고 안전 및 위생 점검을 효율적으로 수행하는 데 중요한 자료로 활용됩니다. 데이터는 CSV, JSON, XML 등 다양한 형식으로 제공되어 정책 연구자, 행정 담당자, 시민 단체 등 여러 주체가 손쉽게 접근하고 분석할 수 있도록 지원됩니다. 이러한 정보를 바탕으로 순천시는 유흥업소 밀집지역의 범죄 예방, 지역 경제 활성화, 주민 생활 환경 개선 등 다양한 사회적 과제를 해결하는 데 기초 자료로 활용하고 있습니다.
