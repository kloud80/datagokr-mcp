description_portal: 이 데이터는 서울특별시 광진구 관내에서 식품첨가물 제조업 인허가를 받아 운영 중인 업소 정보를 제공합니다. 식품첨가물은 「식품위생법」에 따라 식품의 풍미 향상, 보존성 유지, 외형 개선, 영양가치 보강 등의 목적으로 사용되며, 엄격한 기준에 따라 제조·관리되어야 합니다. 본 업종은 합성첨가물, 천연첨가물 등 다양한 형태의 식품첨가물을 생산하는 시설을 포함하며, 주요 데이터 항목에는 업소명, 소재지, 업종 구분, 인허가일자 등이 포함됩니다.해당 데이터는 식품의 안전성 확보, 유해 첨가물 관리, 생산이력 추적, 유통 경로 파악 등의 행정 및 식품안전정책 수립에 유용하게 활용됩니다. 또한 학교급식, 가공식품 제조, 외식 산업 등과 연계되어 공중보건과 밀접한 영향을 미치므로, 관련 업소의 인허가 관리가 중요합니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84) 좌표는 포함되어 있지 않기 때문에 지도 시스템 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신됩니다.
