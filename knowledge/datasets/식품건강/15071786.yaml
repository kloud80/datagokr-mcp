description_portal: 서울시 집단급식소 인허가 정보는 서울 지역에서 운영되는 집단급식소의 인허가 현황과 영업 상태를 확인할 수 있는 공공데이터입니다. 인허가일자, 취소일자, 휴업·폐업 이력 등 행정적 변동 사항을 포함해 급식소의 운영 상태를 명확하게 파악할 수 있습니다. 또한 전화번호, 주소, 면적, 우편번호, 좌표 등 사업장의 위치 및 기본 정보를 제공하여 실제 운영 환경을 이해하는 데 도움이 됩니다. 위생업태명, 등급구분명, 급수시설구분명, 주변환경 등 급식소 운영의 특성을 보여주는 정보도 포함되어 있어 위생 수준과 시설 특성을 세밀하게 확인할 수 있습니다. 남녀 종사자 수, 총 인원, 본사 및 공장 인력 구성 등 인력 구조 정보는 운영 규모를 파악하는 데 유용하며, 건물 소유 구분, 보증액, 월세액 등 재정 관련 정보도 함께 제공됩니다. 더불어 다중이용업소 여부, 시설총규모, 전통업소 지정정보, 주된 음식, 홈페이지 등 부가적 특성도 포함되어 있어 행정 관리, 위생·안전 점검, 급식 정책 분석에 폭넓게 활용할 수 있는 자료입니다.
