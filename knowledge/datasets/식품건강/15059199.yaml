summary_user: 식품위생법에 따른 식품용 기구 및 용기포장 공전의 기준규격을 담으며, 품목코드·시험항목별로 기준값·최소·최대값·단위·적용 유효기간이 한 행씩 들어 있는 전국 단위 비공간 규격 자료다. 용기·포장 제조사나 수입업자, 검사기관이 '이 재질의 용기에 적용되는 특정 시험항목의 허용 기준과 단위는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로, 다른 식품 데이터와는 품목코드(PRDLST_CD)·시험항목코드(TESTITM_CD) 같은 식약처 내부 코드나 품목·항목 이름을 맞춰 연결한다.
description_portal: '식품의약품안전처에서 관리하는 식품위생법에 따른 식품용 기구 및 용기포장 공전 자료입니다.* 기구: 식품 또는 식품첨가물에 직접 닿는 기계ㆍ기구나 그 밖의 물건(농업과 수산업에서 식품을 채취하는 데에 쓰는 기계ㆍ기구나 그 밖의 물건 * 용기,포장: 식품 또는 식품첨가물을 넣거나 싸는 것으로서 식품 또는 식품첨가물을 주고받을 때 함께 건네는 물품이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.'
