summary_user: 식품의약품안전처가 관리하는 식품접객업(음식점 등) 폐업 업소를 업소 건별로 담으며, 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업상태·주소·관할 기관을 제공하는 전국 범위 API입니다. 창업 예정자나 상권 분석가가 '이 지역에서 어떤 업종 음식점이 언제 얼마나 문을 닫았나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 식품 인허가 업소 데이터와는 인허가번호·업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 검증 호출에서 0행이 수신되어 실제 응답 컬럼과 규모는 확인되지 않았으므로, 호출 파라미터를 조정해 결과를 직접 확인해야 한다. 전역 조인 키가 없어 다른 데이터와의 연결은 이름·주소 매칭에 의존하며 오매칭에 주의한다. 개발계정은 하루 10,000회로 호출이 제한된다.
