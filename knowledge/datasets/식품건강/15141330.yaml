summary_user: 서울 금천구 식육포장처리업 업소를 한 곳씩 담은 인허가 원장으로, 인허가일·취소일, 영업상태와 폐업·휴업 기간, 지번·도로명 주소, 면적, 좌표(X, Y)를 담는다. 예비 창업자나 축산물 유통 분석가가 금천구 안에서 현재 영업 중인 식육포장처리업소가 어디에 몇 곳 있고 언제 문을 닫았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇고, 좌표로 상권·지도 데이터와 공간 결합한다.
description_portal: 금천구 내 식육포장처리업의 인허가 현황과 관련 정보를 체계적으로 정리한 데이터입니다. 인허가일자, 영업상태, 폐업 및 휴업 이력, 사업장 주소, 전화번호, 사업장명, 소재지 면적, 업태 구분, 좌표 정보 등 다양한 항목을 포함하고 있습니다. 이를 통해 축산물 가공 및 유통 관련 업계 종사자, 예비 창업자, 정책 담당자 등이 지역 내 식육포장처리업의 분포와 운영 현황을 한눈에 파악할 수 있습니다. 또한 해당 데이터는 축산물 유통 구조 분석, 위생 관리 강화, 창업 입지 선정, 정책 수립 및 산업 동향 연구 등 여러 분야에서 활용할 수 있는 중요한 기초 자료로 쓰입니다.
