summary_user: 서울특별시 동작구에서 완제품 식품을 나눠 다시 포장하는 식품소분업 업소를 업소별로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·업태·중부원점TM 좌표 등을 행 단위로 제공한다. 동작구에서 식품소분업을 하려는 사업자나 분석가가 "동작구에 현재 영업 중인 식품소분업소는 어디이고 언제 인허가를 받았나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 관리번호(MGTNO)·사업장명·주소를 이름 매칭하거나 같은 기관 코드(OPNSFTEAMCODE)로 이어야 하며, 다른 시군구의 같은 형식 인허가 데이터와 합치면 범위를 넓힐 수 있다.
