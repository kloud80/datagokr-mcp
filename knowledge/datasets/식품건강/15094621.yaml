summary_user: 서울특별시 동작구의 일반음식점(음식 조리·판매와 음주가 허용되는 업소) 인허가 정보를 업소 한 건씩 담으며, 인허가일자·영업상태·폐업일자·소재지 주소·업태·시설 면적·중부원점 TM 좌표(X, Y) 등을 포함한다. 동작구에서 영업 중이거나 폐업한 음식점의 분포와 개·폐업 추이를 보려는 창업자나 상권 분석가가 '이 동네에 한식 음식점이 몇 곳 영업 중인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '이 데이터는 서울특별시 동작구의 한식, 중식, 일식 등 음식류를 조리 및 판매하며, 식사와 함께 음주행위가 허용되는 업소정보를 포함하고 있습니다. 좌표안내 : 중부원점 TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 본 데이터는 3일전 자료를 제공합니다.'
