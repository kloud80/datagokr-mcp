summary_user: 부산진구 관내 어린이집·학교·복지시설·기업체 등에서 운영하는 집단급식소를 업소 한 곳씩 담은 개별 목록으로, 업종명·업소명·도로명/지번 주소·전화번호·운영방식(직영·위탁 등)을 담는다. 학부모나 급식업체가 '부산진구에 어떤 기관 급식소가 어디에 있고 직영인지 위탁인지'를 확인하거나, 분석가가 구 안의 집단급식소 분포를 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 업소명·주소를 맞춰 붙이거나 같은 기관의 다른 식품 인허가 자료와 나란히 보는 방식으로만 잇는다.
limits: 인허가번호나 사업자번호 같은 공통 키가 없어 전국 식품 인허가 원장이나 행정처분 자료와 정확히 연결하기 어렵고, 업소명·주소 문자열 매칭에 의존해야 한다. 범위는 부산진구 한 곳에 한정된다.
