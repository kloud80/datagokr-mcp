summary_user: 위해식품판매차단종합관제시스템에 등록된 회수·판매중지 건의 변경 이력을 회수판매중지 일련번호별로 담은 건별 파일로, 회수사유·바코드번호·제조일자·유통기한·변경일자·사용여부와 이전바코드번호를 기록한다. 소비자나 유통·판매 사업자가 "이 바코드 제품의 회수·판매중지 정보가 언제 어떻게 바뀌었고 지금도 차단 대상인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 바코드번호나 회수판매중지 일련번호, 업체·제품명을 매핑해 같은 기관의 회수·판매중지 목록과 식품 인허가 업소 데이터에 이어 쓴다.
description_portal: 식품안전정보원에서 운영 중인 위해식품판매차단종합관제시스템에서 확인 가능한 회수판매중지 변경 내역입니다.해당 정보에는 회수사유, 바코드번호, 제조일자, 유통기한, 내용 변경일자,제공종료일 등 변경 내역이 확인가능합니다.회수사유는 무등록 업체 제조, 금속성 이물 혼입, 니켈 기준 초과 등이 있고 사용여부비고에는 바코드정보 미제공, 정보 확인 불가 등, 표준화 반영에는 표준화 반영한 날짜를 확인하실 수 있습니다.자세한 내용은 첨부되어있는 회수판매중지 변경 내역 확인하시면 됩니다.
