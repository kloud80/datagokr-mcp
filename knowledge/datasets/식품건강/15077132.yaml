summary_user: 전국 즉석판매제조가공업체 중 폐업한 업소를 건별로 담은 데이터로, 업소마다 인허가번호·업소명·대표자명·업종·허가일자·폐업일자·폐업 상태·소재지 주소·관할 기관명이 들어 있다. 창업 예정자나 상권 분석가가 특정 지역에서 반찬가게·즉석 제조 판매점이 언제 얼마나 문을 닫았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 대조, 같은 기관 코드로만 이어 쓴다.
description_portal: 즉석판매제조가공업체의 폐업 정보로 즉석판매제조가공업 폐업에 대한 속성정보를 제공합니다. 속성정보로는 인허가번호 , 업소명 , 대표자명 , 업종 , 허가일자 , 폐업일자 , 페업상태 , 주소 , 기관명이 있습니다.이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
