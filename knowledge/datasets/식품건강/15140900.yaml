summary_user: 서울특별시 광진구에 있는 식품소분업 인허가 업소를 업소 한 곳당 한 행으로 담은 원장으로, 업소명·인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표(X, Y)·시설 규모 등을 포함한다. 광진구에서 지금 영업 중인 식품소분업체가 어디에 몇 곳 있고 언제 허가받았는지 확인하려는 주민·사업자, 위생 점검 대상을 추리는 담당자, 상권을 분석하는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호(MGTNO) 기준으로만 이어 쓴다. 같은 형식의 다른 식품 인허가 업종 데이터나 위생 지정·행정처분 데이터와도 이 방식으로 연결한다.
description_portal: 본 데이터는 서울특별시 광진구에 소재한 식품소분업 인허가 업소의 현황 정보를 제공합니다. 식품소분업은 제조가 완료된 완제품 형태의 식품을 별도의 소량 단위로 나누어 포장한 뒤 판매할 수 있도록 하는 영업 형태로, 소비자 단위 소매 유통을 목적으로 합니다. 해당 업소는 포장 위생 상태, 유통기한 표시, 알레르기 유발 성분 표기 등 다양한 식품 안전 요소를 충족해야 하며, 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등의 항목이 포함되어 있습니다. 본 데이터는 식품위생법에 따른 관리·감독, 유통 안전성 확보, 소비자 보호 정책 수립, 식품안전 모니터링 등의 목적으로 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되지 않아 GIS 연동 시 좌표 변환이 필요합니다. 이 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신되며, 광진구 관내 식품 유통업소에 대한 정책 수립 및 위생 점검에 활용됩니다.
