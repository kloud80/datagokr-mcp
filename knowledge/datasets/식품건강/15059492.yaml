summary_user: "식품의약품안전처가 허가한 인체조직은행을 은행 한 곳당 한 건으로 담으며, 허가번호, 은행 명칭, 소재지 주소, 최초 허가일자, 다음 허가갱신일자, 폐업일자, 취급 조직 유형(뼈·연골·피부 등)을 전국 범위로 제공한다. 병원·연구자·정책 담당자가 '특정 조직(예: 뼈, 피부)을 취급하도록 허가받은 조직은행이 어디에 있고 허가가 아직 유효한가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 은행 명칭·주소 매칭이나 같은 기관(식약처) 자료와의 코드 대응으로만 이을 수 있으며, 식품 품목 DB의 품목제조보고번호·바코드 같은 제품 단위 키는 이 데이터에 없다."
description_portal: 식품의약품안전처에서 관리하는 인체조직은행 관련 정보를 제공하고 있습니다.「인체조직안전 및 관리 등에 관한 법률」 에 따른 인체조직을 취급하려는 경우 같은 법 제13조에 따른 조직은행허가를 받아야 합니다. 동 서비스는 조직은행설립허가 시 조직은행이 받은 허가번호, 최초허가일자, 조직은행의 명칭 및 소재지, 폐업일자, 취급조직유형(뼈, 연골, 피부 등 11종), 다음 허가갱신일자 등 조직은행설립허가 정보를 제공하고 있습니다. 이 데이터를 통해 인체조직은행과 관련된 정책 수립에 활용할 수 있습니다.
