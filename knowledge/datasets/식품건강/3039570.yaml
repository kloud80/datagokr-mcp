summary_user: 부천시에 신고된 공중위생업소(이미용업·숙박업·목욕장업·세탁업 등)를 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업종명·업소명·도로명/지번 주소·우편번호·영업장면적·소재지전화·신고일자를 포함한다. 주민이나 사업자가 '우리 동네에 어떤 미용실·세탁소가 언제부터 영업 중인가'를 찾거나, 분석가가 부천시 업종별 업소 수와 개업 시기를 집계하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 주소(도로명·지번)나 업소명을 매칭해 이어 쓴다.
limits: 실측 컬럼에 업소 고유번호 같은 조인 키가 없어, 식품 인허가·행정처분 등 다른 데이터와 붙일 때는 이름·주소 매칭에 의존해야 한다. 범위는 부천시 한 곳뿐이므로 다른 시군구와 비교하려면 별도 자료가 필요하다.
