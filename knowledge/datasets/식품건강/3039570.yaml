description_portal: '(부천시 공중위생업소 인허가 현황)부천시 관내 공중위생업소 인허가 현황 자료는 부천시에 등록된 공중위생업소의 기본 현황을 제공하는 데이터입니다.제공항목: 업종명, 업소명, 영업소 주소(도로명), 우편번호(도로명), 영업소 주소(지번), 소재지전화, 영업시작일자료특징○ 업종명 → 이미용업, 숙박업, 목욕장업, 세탁업 등 「공중위생관리법」상 업종 분류에 따라 표기○ 영업소 주소(도로명) 및 우편번호 → 「도로명주소법」에 따른 공식 표기 사용○ 영업소 주소(지번) → 지번 체계 주소를 병기하여 도로명주소와 함께 제공○ 소재지전화 → 해당 영업소와 직접 연락 가능한 전화번호 기재○ 영업시작일 → 인허가 또는 신고일 기준 최초 영업 개시일 정보활용안내본 자료는 부천시 위생행정, 업소 지도 제작, 민원 응대, 업종별 통계 분석 등에 활용 가능합니다.'
