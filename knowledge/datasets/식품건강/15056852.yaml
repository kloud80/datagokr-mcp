summary_user: 경기도 31개 시군에서 김밥·도시락을 주로 파는 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·종사자 수·시설면적·도로명/지번 주소·위경도를 담는다. 김밥집 창업을 준비하는 사업자가 특정 시군에 영업 중인 김밥·도시락 업소가 몇 곳이고 최근 폐업이 얼마나 되는지 확인하거나, 분석가가 분식업 점포 분포를 지도로 그리는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명, 주소, 위경도 좌표를 기준으로 다른 경기도 식품 인허가 업소 데이터나 상권·인구 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 김밥 또는 도시락을 주식으로 취급하는 일반음식점에 대한 인허가 및 영업 현황을 기록한 자료입니다. 총 31개 시군의 정보를 포함하며, 사업장명, 인허가일자, 영업상태, 폐업일자, 위생업종 및 위생업태, 남녀 종사자 수, 총 시설면적, 다중이용업소 여부, 급수시설 구분, 소재지 주소(도로명 및 지번), 위도·경도 등 다양한 항목이 제공됩니다. 본 데이터는 분식류 관련 외식업 동향 파악, 창업 입지 분석, 식품위생 관리, 정책 수립 등 여러 분야에서 활용할 수 있습니다. 데이터는 지방행정 데이터 개방시스템을 통해 주간 단위로 갱신되며, 상업적 이용과 콘텐츠 변경이 가능합니다.
