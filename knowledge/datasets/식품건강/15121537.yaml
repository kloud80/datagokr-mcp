summary_user: 광주광역시가 공모와 구청·시청 2단계 평가로 선정한 뷰티우수업소를 업소 한 곳당 한 행으로 담은 소규모 CSV 파일(약 4KB)로, 자치구·업체명·주소와 함께 대한민국·광주시 미용명장 여부, 백년가게 여부를 담는다. 뷰티관광객이나 시민이 "우리 구에서 시가 인정한 우수 미용실, 명장이 있는 곳은 어디인가"를 찾거나, 분석가가 자치구별 우수업소 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 미용업 인허가 자료 등 다른 데이터와는 업체명·주소 매칭이나 자치구 이름으로만 이어 쓴다.
description_portal: '광주광역시 뷰티우수업소 현황 정보입니다. □ 목적 : 뷰티업소의 대표성 및 자긍심을 높이고 이를 지역 뷰티관광 콘텐츠와 연계함으로써 광주를 대표하는 뷰티문화 허브를 조성하고 지역 뷰티산업 경쟁력 강화□ 선정방법 : 공모를 통해 신청업소 접수를 받은 후 1차, 2차 평가를 거쳐 최종 선정 * 공고 ⇒ 업소 신청 ⇒ 1차 평가(구청주관) ⇒ 2차 평가(시청주관)□ 신청자격 : 광주광역시에 소재하며 미용서비스를 제공하는 뷰티업소로서 기본적인 영업 요건을 충족한 뷰티업소 □ 뷰티 우수업소 지원 : 지정서 교부 및 표지판 부착, 홍보 및 홍보물 등 제공 등'
