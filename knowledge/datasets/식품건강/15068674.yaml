summary_user: 인천광역시 서구(서해구)가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·유형·주메뉴(가격)·소재지·주차대수·전화번호를 수록하며 범위는 시군구 단위 개별 업소(주소)입니다. 주민이나 방문객이 '서구에서 주차가 되는 위생 믿을 만한 한식집은 어디인가'를 찾을 때, 또는 담당자가 모범음식점 현황 홍보·관리 자료를 만들 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 식품 인허가 업소 원장이나 다른 위생 지정 데이터와는 업소명·소재지 주소를 맞춰 이어 써야 한다.
description_portal: 본 공공데이터는 인천광역시 서구에서 지정한 모범음식점에 대한 정보를 수록하고 있습니다. 본 자료는 인천광역시 서구 내 모범음식점의 업소명, 유형, 주메뉴(가격), 소재지, 주차대수 등의 정보를 수록하고 있습니다. 본 데이터를 통해 소비자가 위생적이고 신뢰할 수 있는 음식점을 찾는데 유용할 것으로 판단이 됩니다. 또한 음식점 관리 및 정책 수립, 홍보자료 제작 등 다양한 행정목적에도 활용할 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
