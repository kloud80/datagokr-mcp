summary_user: 경기도 양평군 관내 일반음식점을 업소 한 곳당 한 행으로 담은 파일 데이터로, 업종명·업소명·도로명/지번 소재지·전화번호를 담는다(CSV 약 206KB). 양평에서 음식점 창업이나 상권 조사를 하는 사업자·분석가가 '특정 읍·면에 일반음식점이 얼마나 몰려 있는가'를 주소 기준으로 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키는 없어서, 다른 식품 인허가·위생 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 해당 데이터는 양평관내 일반음식점에 대한 데이터로 업소명, 소재지도로, 소재지지번, 연락청 등의 사항을 알 수 있는 데이터입니다.일반음식점은 식품접객업의 한 종류로 음식류를 조리판매하는 영업으로서 식사와 함께 부수적으로 음주행위가 허용되는 영업이다.누구든지 판매를 목적으로 식품 또는 식품첨가물을 채취·제조·가공·사용·조리·저장·소분·운반 또는 진열을 할때에는 깨끗하고 위생적으로 하여야한다.영업에 사용하는 기구 및 용기·포장은 깨끗하고 위생적으로 다루어야 한다.물수건, 숱가락, 젓가락, 식기, 찬기 도마, 칼, 행주 그밖의 주방용구는 기구등의 살균 소독제, 열탕,자외선살균 또는 전기살균의 방법으로 소독한 것을 사용하여야 한다.표시사항을 모두 표시하지 않은 축산물, 허가받지 않은 작업장에서 도축, 집유, 가공, 포장 또는 보관된 축산물 검사를 받지 않은 축산물 또는 실험 등의 용도로 사용한 동물은 음식물의 조리에 사용하여서는 아니 된다.
