summary_user: 춘천시 안의 일반음식점·휴게음식점·제과점 등 요식업소를 업소 한 곳당 한 줄로 담은 개별 업소 목록으로, 업종·업태·업소명·도로명/지번 주소·전화번호를 포함하며 CSV 파일(약 0.9MB)로 받는다. 시민이 "우리 동네에 어떤 업종의 음식점이 있고 연락처는 무엇인가"를 찾거나, 분석가가 춘천시 읍면동별 외식업 분포를 파악하는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열을 맞춰 붙여야 하며, 식품 인허가 업소 원장이나 위생 지정·행정처분 데이터와 연결할 때도 주소 매칭이 필요하다.
limits: 인허가번호·사업자번호·좌표 컬럼이 없어 다른 업소 데이터와 정확히 1:1로 잇기 어렵고, 이름·주소 매칭 때 오차가 생길 수 있다. 범위는 춘천시 한 곳뿐이라 다른 시군구와 비교하려면 별도 데이터가 필요하다.
