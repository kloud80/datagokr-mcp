summary_user: 전라남도 영암군 관내 휴게음식점(편의점·카페 등)을 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·업소명·도로명/지번 주소·전화번호·데이터기준일자를 제공한다. 영암군에서 카페나 편의점 같은 휴게음식점이 어디에 몇 곳 있는지 알고 싶은 주민·창업 예정자·상권 분석가가 쓴다. 인허가번호·사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 데이터와는 업소명이나 주소 문자열을 맞추거나 같은 기관의 다른 식품업소 파일과 나란히 놓아 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 전국 식품 인허가 원장이나 행정처분 데이터와 바로 연결되지 않고, 업소명·주소를 매칭해야 한다. 범위는 영암군 한 곳뿐이다. 좌표 필드가 없어 지도에 표시하려면 주소를 따로 지오코딩해야 한다.
