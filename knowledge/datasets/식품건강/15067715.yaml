summary_user: 경기도 부천시 관내 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·인허가일자·도로명 소재지·우편번호·전화와 생산하는 식품의 종류·유형이 들어 있다. 부천시에서 특정 식품 유형을 만드는 제조업체를 찾거나, 관내 식품제조업소가 어디에 얼마나 분포하는지 보려는 사업자·분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없으므로 다른 데이터와는 업소명·도로명 주소 매칭으로만 이어 쓰며, 다른 시군구의 같은 업종 파일과는 같은 컬럼 구성을 기준으로 합쳐 쓴다.
