summary_user: 인천광역시 미추홀구에 등록된 유통전문판매업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 9KB)로, 업종명·업소명·도로명/지번 주소·전화번호를 담는다. 구청 위생 담당자나 분석가가 '미추홀구에서 직접 제조하지 않고 완제품 식품을 유통·판매하는 업체가 어디에 몇 곳 있는가'를 확인하거나 위치 기반 분포를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없으므로 다른 식품 인허가·위생·행정처분 데이터와는 업소명과 주소를 맞춰서만 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 내 유통전문판매업체의 현황을 수록한 자료로, 연번, 업종명, 업소명, 도로명주소, 지번주소, 소재지전화 등의 항목으로 구성되어 있습니다. 유통전문판매업은 직접 제조나 조리를 하지 않고 완제품 형태의 식품 등을 취급하는 업종으로, 식품위생법상 등록·관리 대상에 포함됩니다. 본 데이터는 관내 관련 업소의 행정 관리 및 위생 점검, 정책 수립 등 공공 목적을 위해 활용될 수 있으며, 위치 기반 분석이나 상권 연구 등 민간 활용도 가능합니다. 정기적인 갱신을 통해 최신 정보를 제공합니다.
