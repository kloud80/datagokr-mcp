summary_user: 경기도 31개 시군의 출장조리 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태·시설규모·종업원 수와 지번·도로명 주소, WGS84 좌표를 포함한다. 출장요리 업체를 찾는 시민이나 창업을 검토하는 사업자, 상권 분석가가 '우리 시군에서 현재 영업 중인 출장조리 업소는 어디에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군 이름·코드(SIGUN_CD)나 주소·좌표로 다른 경기도 식품 인허가 데이터, 지도와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 출장 조리를 전문으로 하는 일반음식점에 대한 인허가 및 영업 현황 정보를 포함하고 있습니다. 출장조리란 고객이 요청한 장소로 음식을 운반하고 현장에서 조리하여 제공하는 형태의 영업을 의미하며, 해당 데이터에는 사업장명, 인허가일자, 폐업일자, 영업상태, 소재지주소, 총시설규모, 급수시설구분, 위생업종명, 위생업태명, 종업원 수, 위치좌표(WGS84 위도·경도) 등의 항목이 포함되어 있습니다. 해당 데이터는 외식업 시장 분석, 출장요리 수요 예측, 공공 위생 및 식품안전 정책 수립에 활용될 수 있습니다. 데이터는 경기도 31개 시군의 내용을 포함하며, Open API를 통해 실시간 정보 접근도 가능합니다.
