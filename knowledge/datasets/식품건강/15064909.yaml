summary_user: 식품(첨가물) 제조가공업소가 보고한 품목제조보고를 품목 한 건씩 담은 전국 단위 원천 데이터로, 품목명·업소명·인허가번호·보고일자·소비기한(품질유지기한) 일수·식품유형·성상·용도·포장재질·어린이 기호식품 인증 여부 같은 항목을 포함한다. 소비자나 유통·식품 사업자가 "이 제품은 어느 업소가 언제 품목보고했고 식품유형과 소비기한은 무엇인가"를 확인할 때 쓰고, 분석가는 업소별·유형별 신규 품목 출시 동향을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 품목제조보고번호(PRDLST_REPORT_NO)로 같은 식품 제품 DB(바코드·영양성분·원재료)와 제품 단위로 잇고, 인허가번호·업소명으로 식품 인허가 업소나 회수·행정처분 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 식품위생법에 따른 식품(첨가물) 제조가공업소에서 보고한 식품(첨가물) 품목 제조보고 관련 정보 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
