description_portal: 경상남도 내 단란주점 업소정보는 주로 주류를 조리ㆍ판매하며, 손님이 노래를 부를 수 있는 형태의 유흥영업장에 해당하는 단란주점에 대한 자료로, 도내 18개 시·군 전역에 걸쳐 운영 중인 업소에 관한 정보를 포함하고 있습니다. 해당 데이터에는 각 업소의 명칭, 업종 및 업태, 소재지 주소, 인허가 관할기관, 영업상태 등 기본적인 현황 정보가 수록되어 있으며, 지역별 단란주점 분포 및 운영 실태를 분석할 수 있는 기반 자료로 활용됩니다. 본 자료는 유흥업소 관리, 유관기관 협력, 지역사회 안전 및 건전한 유흥문화 조성을 위한 정책 수립, 행정 점검 등에 필요한 실무적 정보를 제공합니다.
