summary_user: '경기도 내 유통 식품을 검사한 방사능 결과를 검사 건별로 담으며, 검사기간·분류·품목명·수거지역과 요오드·세슘 검출 내역, 판정 결과가 들어 있다. 소비자나 식품 안전 분석가가 특정 품목(예: 수산물)에서 세슘이나 요오드가 검출된 적이 있는지, 판정이 적합이었는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 식품 안전 데이터(회수·부적합·잔류농약 검사 등)와는 품목명이나 지역명을 직접 맞춰 이어야 한다.'
description_portal: '이 데이터는 경기도 내 유통 중인 식품에 대한 방사능 검사 결과를 담고 있으며, 검사 대상은 주로 요오드-131, 세슘-134, 세슘-137로 대표되는 방사성 물질입니다. 식품 유통 단계에서의 방사능 검사는 소비자의 건강을 보호하고 식품의 안전성을 확보하기 위한 필수 조치입니다.최신 검사 결과는 경기도 보건환경연구원 홈페이지를 통해 주 1회 갱신되며, 식품안전 정책 및 소비자 정보 제공에 활용될 수 있습니다.URL: https://www.gg.go.kr/gg_health/bbs/board.do?bsIdx=731&menuId=3189'
