summary_user: 서울특별시 중구에서 집단급식소 운영자와 계약해 음식을 조리·제공하는 위탁급식영업 신고업소를 업소 한 곳당 한 행으로 담은 인허가 원장이며, 관리번호·인허가일·영업상태(영업/폐업)·폐업일·소재지·업소명·중부원점TM 좌표 등을 포함한다. 위탁급식 창업을 준비하는 예비 사업자가 '중구에 영업 중인 위탁급식업체가 몇 곳이고 어디에 몰려 있는가'를 파악하거나, 급식소 운영자가 계약 상대 업체의 신고 상태를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관(개방자치단체 코드) 기준으로만 연결한다.
description_portal: '서울특별시 중구의 집단급식소를 설치 및 운영하는 업체와 계약에 따라 해당 집단급식소에서 음식류를 조리하여 제공하는 업소 정보입니다. 데이터는 각 신고업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 위탁급식영업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 단체급식 신고업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 집단급식소 운영 관계자와 시민들에게는 법적 시설기준을 충족하며 철저한 식품위생 및 영양관리를 수행하는 신뢰할 수 있는 조리시설 신고업체의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
