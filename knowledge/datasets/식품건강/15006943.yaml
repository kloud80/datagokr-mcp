summary_user: "서울특별시 중랑구 관내에서 공중위생관리법에 따라 인허가된 미용업소를 업소 한 곳씩 담은 현황 파일로, 업종명·업태명(일반·종합·피부미용업 등 세부 분류)·업소명·도로명/지번 주소를 포함한다. 주민이나 창업 예정자가 '우리 동네(예: 면목본동)에 피부미용업소가 몇 곳 있고 어디에 있나'를 확인하거나, 분석가가 구 단위 미용업 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매칭이나 같은 기관(중랑구) 기준으로만 이어 쓴다."
description_portal: '서울특별시 중랑구 관내 공중위생관리법에 따라 인허가된 미용업소의 현황 정보를 제공합니다.데이터는 중랑구 보건소 위생과에서 관리하며, 각 업소의 행정동, 업종명, 업태명, 업소명, 영업소 주소(도로명/지번)를 포함하고 있습니다.📌 데이터 항목 설명항목명설명행정동명(지번)업소가 소재한 행정동 이름 (예: 면목본동)업종명공중위생 업종명 (미용업)업태명미용업 세부 분류 (일반미용업, 종합미용업, 피부미용업 등)업소명등록된 영업소 이름영업소주소(도로명)도로명 주소 (도로명주소법에 따른 주소체계)영업소주소(지번)지번 주소 (기존 토지대장 기준 주소)'
