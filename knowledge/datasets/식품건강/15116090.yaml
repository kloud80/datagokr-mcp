summary_user: 서울특별시 강서구 관내 식품소분업체를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·사업장명·주소·전화번호·좌표(X, Y) 등을 포함하며 범위는 강서구 한 시군구입니다. 강서구에서 지금 영업 중인 소분업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 언제 폐업했는지 확인하려는 위생 점검 담당자나 상권·유통 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)·관리번호로만 이어 쓰며, 좌표로 지도 위 다른 업소 데이터와 겹쳐 볼 수 있습니다.
description_portal: 서울특별시 강서구 관내에서 운영 중인 식품소분업체에 대한 인허가 정보를 제공합니다. 식품소분업은 대량으로 제조된 식품을 소량 단위로 나누어 별도 포장하여 소비자에게 제공하는 업종으로, 위생적인 환경에서의 작업이 필수적이며 식품안전관리기준을 철저히 준수해야 합니다. 이 데이터는 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등의 항목으로 구성되어 있으며, 소분된 제품은 일반 유통시장이나 온라인 쇼핑몰 등을 통해 유통될 수 있습니다.특히 최근 1인 가구 및 맞춤형 소비 트렌드 확산으로 인해 소분업의 수요가 증가하고 있으며, 다양한 식품군에 적용되고 있습니다. 본 정보는 식품 유통 구조 파악, 영업관리 및 정책 수립, 위생 점검 대상업체 관리 등에 유용하게 활용될 수 있습니다.
