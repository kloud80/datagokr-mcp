summary_user: 수입식품을 생산하는 해외작업장(해외제조업소)별로 품목과 수입 중단 정보를 담은 API로, 전국 범위의 개별 업소 단위 자료입니다. 수입업자나 소비자가 특정 해외작업장의 수입 품목과 수입 중단 여부를 확인하는 데 씁니다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 수입식품·회수/부적합 데이터와는 업소명·품목명 매핑이나 같은 기관 코드로만 연결합니다.
limits: 공통 조인 키가 없어 다른 데이터와 붙일 때 이름 매칭에 기대야 하므로 오매칭에 주의해야 합니다. 개발계정은 일 10,000회 호출 한도가 있습니다. 필드 명세가 거의 비어 있어 응답 항목의 의미는 실제 호출 결과로 확인해야 합니다.
