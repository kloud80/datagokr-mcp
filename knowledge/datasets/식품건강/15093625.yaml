summary_user: 식약처가 표준코드·바코드 제도 정착을 위해 조직은행에 대여한 입출고 전산화 장비의 현황을 담으며, 조직은행 허가번호와 장비 유형명이 행 단위로 들어 있는 전국 범위 목록입니다. 인체조직 추적관리 담당자나 분석가가 '어느 조직은행이 어떤 바코드 장비를 대여받았는가'를 확인할 때 씁니다. 전역 조인 키는 없으며, 조직은행 허가번호로 보이는 필드(TSBNK_PRMSN_NO)를 써서 같은 기관이 낸 조직은행 허가 정보와 이름·코드 매핑으로만 이어 붙일 수 있습니다.
limits: 식품 제품 바코드나 품목제조보고번호와는 관련이 없는 장비 대여 목록이라 제품 단위 조인에는 쓰지 않습니다. 위치 정보가 없어 지역별 분석은 할 수 없고, 다른 데이터와 붙이려면 허가번호나 이름을 따로 매핑해야 합니다. 개발계정은 하루 10,000회까지 호출할 수 있습니다.
