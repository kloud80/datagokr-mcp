description_portal: 「인체조직안전 및 관리 등에 관한 법률」 제19조제3항에 따라 인체조직은 각 조직마다 분배부터 이식까지 추적조사를 하도록 하고 있습니다. 이에 따라 조직은행은 입고 출고하는 조직에 대한 기록을 하여야 합니다. 또한 추적관리를 위해 모든 조직에 대해 「조직은행 허가 및 인체조직 안전관리 등에 관한 규정」제17조의2에 따른 표준코드 및 바코드를 표시하도록 하고 있습니다. 표준코드 및 바코드 정책 도입시 빠른 제도 정착을 위하여 조직의 입출고 정보를 전산화 할 수 있게 전산화 장비를 구입하여 조직은행에게 대여하고 있습니다. 동 서비스에는 해당장비 대여 현황에 대한 정보가 포함되어 있습니다.
