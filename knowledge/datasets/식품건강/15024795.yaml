summary_user: 경상남도 의령군에 인허가된 식품제조가공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·인허가일자·업소명·법인명·도로명/지번 주소·영업장면적·전화·우편번호·기준일자를 담는다(csv 약 9.5KB). 의령군 안에 어떤 식품제조가공업체가 어디에 언제 인허가를 받아 영업하는지 확인하려는 주민·사업자, 지역 식품제조업 분포를 지도로 보려는 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관 데이터로만 이어 쓴다.
description_portal: 본 데이터는 경상남도 의령군 식품제조가공업소 현황을 제공합니다. 데이터는 연번, 업종명, 인허가일자, 업소명, 법인명, 소재지(도로명), 소재지(지번), 영업장면적, 소재지전화, 우편번호(도로명), 기준일자로 구성됩니다. 이를 통해 이용자는 업소의 인허가 정보와 업종, 명칭, 법인, 주소, 면적, 연락처, 기준일을 한눈에 확인할 수 있습니다. 이 정보는 업소 유형 분석, 제조업 공간 분포 파악, 지도 기반 데이터 매핑 등에 활용될 수 있습니다. 행정기관은 이를 바탕으로 업소 관리, 위생 점검 계획, 산업지원 정책 수립 등에 참고할 수 있습니다. 본 데이터는 공공데이터포털에서 제공되며, 지역 제조업 기반 정보 제공과 관리 체계 향상에 기여합니다.※ 소재지전화의 경우 개인휴대폰번호는 공란처리하였습니다.
