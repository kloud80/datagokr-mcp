summary_user: 경기도 시군의 푸드트럭·이동식 포장마차 같은 이동조리형 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태·종업원 수·주소와 WGS84 좌표를 포함한다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 푸드트럭이 어디에 몇 곳 있는가'를 확인하거나 이동형 외식업의 개업·폐업 추이를 보는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 경기도 식품 인허가 데이터, 행정구역 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 차량이나 운송수단을 이용하여 음식을 조리하고 판매하는 이동조리형 일반음식점에 대한 인허가 및 영업현황 정보를 포함합니다. 대표적으로 푸드트럭, 이동식 포장마차 형태의 음식점이 해당되며, 식사와 함께 부수적인 음주행위가 가능한 업소도 포함됩니다. 주요 항목은 사업장명, 인허가일자, 폐업일자, 영업상태, 급수시설구분, 위생업종명, 위생업태명, 종업원 수, 소재지 주소정보(WGS84 위도·경도 포함), 다중이용업소 여부 등이 포함되어 있습니다. 이 데이터는 유동식 외식업 분석, 지역 이동형 상권 파악, 식품위생 및 영업환경 정책 수립 등에 활용될 수 있으며, 경기도 31개 시군의 데이터를 포함하고 Open API를 통해 실시간 연계 활용도 가능합니다.
