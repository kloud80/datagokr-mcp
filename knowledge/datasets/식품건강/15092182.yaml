description_portal: '본 데이터는 제주특별자치도 제주시 관내에서 등록된 반려동물에 대한 정보를 읍면동별로 집계한 현황 자료입니다. 동물보호법에 따라 반려견의 등록을 의무화하고, 유실·유기 방지 및 효율적인 동물 관리체계를 구축하기 위해 수집된 자료로, 등록 유형별 두수와 등록 방식 등 세부 항목을 포함하고 있습니다.주요 항목읍면동: 등록된 반려동물이 거주하고 있는 행정구역 단위동물구분: 등록 대상 동물의 종류(예: 개, 고양이 등)등록두수: 해당 읍면동에 등록된 전체 동물 수내장형: 체내 삽입형 무선식별장치(RFID)로 등록된 개체 수외장형: 목걸이형 외장 칩을 통해 등록된 개체 수데이터기준일자: 해당 데이터가 집계된 기준 날짜활용 목적이 데이터는 반려동물 유실 방지, 유기동물 발생 억제, 동물등록제도 운영 실태 분석, 관련 정책 수립 및 지역별 등록률 관리 등에 활용되며, 제주시 축산과에서 정기적으로 갱신·관리합니다.'
