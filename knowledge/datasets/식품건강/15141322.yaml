summary_user: 서울 금천구에 있는 식품자동판매기업의 인허가 원장으로, 업소 한 곳이 한 행이며 인허가일자·영업상태·폐업일자·소재지와 도로명 주소·좌표·업태·종사자 수·시설 규모·급수시설 등을 담는다. 구 위생 담당자나 상권 분석가가 '금천구에서 지금 영업 중인 자판기 업소는 몇 곳이고 어디에 몰려 있는가' 같은 질문에 쓴다. 실측 컬럼에는 전역 조인 키가 없다. 그래서 다른 데이터와는 관리번호(MGTNO)·개방자치단체코드 같은 같은 기관 체계의 코드, 업소명·주소 매핑, 또는 좌표로만 이어 쓴다.
description_portal: 금천구 내 식품자동판매기업의 인허가 현황을 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 업태 구분, 위생업태, 종사자 수, 시설 규모, 임대 정보 등 기본 항목과 함께 자판기 운영 업체의 위생 관리 현황, 사업장 주변 환경, 등급, 급수시설, 전통업소 지정 여부 등의 세부 정보도 포함하고 있습니다. 이를 통해 식품자동판매기업의 운영 실태와 안전 관리 수준을 종합적으로 파악할 수 있으며, 식품 안전 정책 수립, 자동판매기 시장 분석, 업종별 현황 조사, 위생 관리 강화 등 다양한 분야에서 활용할 수 있습니다. 또한 해당 데이터는 지역 내 자판기 운영 환경 개선과 소비자 신뢰도 향상에 기여하는 기초 자료로 유용합니다.
