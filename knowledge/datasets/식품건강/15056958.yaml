summary_user: 경기도 31개 시군의 기타 식품제조가공업(도시락·PB 제품 등 제조·가공) 업소를 한 행에 한 곳씩 담은 인허가 원장으로, 사업장명·인허가일자·폐업일자·영업상태·주소·위도경도·종업원 수·시설 규모·보증금과 월세 등을 포함한다. 식품가공 창업을 검토하는 사업자나 분석가가 "우리 시군에 영업 중인 도시락 제조업체가 몇 곳이고 어디에 몰려 있나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 다른 식품 인허가·위생 데이터와 이름·코드 매핑으로 연결한다.
description_portal: 이 데이터는 경기도 내 기타 식품제조가공업에 대한 인허가 현황을 담고 있으며, 도시락, PB(Private Brand) 제품 등을 제조 및 가공하는 사업체 정보를 포함합니다. 총 31개 시군을 대상으로 하며, 사업장명, 인허가일자, 폐업일자, 위생업태명, 업태구분명, 소재지 주소, 위도·경도, 종업원 수, 시설 규모, 건물 소유구분, 보증금 및 월세, 다중이용업소 여부, 전통업소 지정 정보 등의 항목이 포함되어 있습니다. 본 데이터는 식품가공 산업의 현황 분석, 위생관리, 식품 유통 경로 조사, 산업 지원정책 수립 등에 활용될 수 있으며, ‘기타 식품제조가공업’으로 업종 검색이 가능합니다.
