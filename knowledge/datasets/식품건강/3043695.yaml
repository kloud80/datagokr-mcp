summary_user: 경기도 파주시가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 파일로, 읍면동·업종 분류·지정연월과 대표 품목 세 가지의 이름·가격, 도로명·지번 주소, 위도·경도, 전화번호를 포함한다. 주민이나 분석가가 '우리 동네에서 값싸게 식사할 수 있는 지정 업소는 어디이고 대표 메뉴 가격은 얼마인가'를 확인하거나, 업종별 품목 가격을 비교하는 데 쓴다. 사업자등록번호(bizno)로 식품 인허가 업소 원장 등 다른 업소 데이터와 연결하고, 위도·경도와 주소로 지도·상권 분석에 겹쳐 쓴다.
description_portal: 경기도 파주시 지역소비자에게 합리적인 가격으로 서비스나 제품을 제공하는 업소에 대한 정보를 제공하는 착한가격업소에 대한 데이터로, 읍면동명, 구분명, 업종대분류명, 업종세분류명, 업소명, 지정연월, 사업자등록번호, 주요 세가지 품목명과 품목가격, 소재지도로명주소, 소재지지번주소, 위도, 경도, 전화번호 등으로 구성되어 있습니다. 이 데이터셋은 시계열 분석을 통한 물가 변동 모니터링, 지도 기반의 입지 및 상권 분석, 민간 플랫폼과의 API 연동 및 서비스 고도화, 업종별 경영 효율성 및 정책 효과 측정, 사용자 맞춤형 '우리 동네 가성비 지도' 서비스, 소상공인 상권 분석 및 경영 전략 도구, 민간 플랫폼 및 카드사 연동 혜택 서비스, 정책 의사결정 및 물가 안정 지표 등에 활용될 수 있습니다.
