summary_user: HACCP(식품안전관리인증기준) 지정을 받은 업체의 지정 현황을 업체 단위로 담는 API로, 업체명·업종·주소·지정일자·지정번호·품목명과 소규모 업체 여부를 싣고 범위는 전국이다. 소비자나 식품업계 담당자가 특정 업체나 품목이 HACCP 지정을 받았는지 확인하는 질문에 쓴다. 인허가번호(LCNS_NO)로 같은 기관의 식품 인허가 업소 데이터와 이어 쓰며, 전역 조인 키는 없어 그 밖의 데이터와는 업체명·주소 매핑으로 연결해야 한다.
description_portal: 식품의약품안전처 「HACCP 지정현황」 OpenAPI는 식품 안전관리인증기준(HACCP)을 받은 업체의 지정 현황 정보를 제공합니다. 제공 항목에는 업체명, 업종, 대표자명, 소규모 업소 여부, 주소, HACCP 지정일자, HACCP 지정번호, 품목명 등이 포함되어 있습니다. 이 데이터를 통해 식품업계는 H ACCP 인증 현황을 파악해 안전관리 체계를 점검할 수 있고, 연구기관과 정책 담당자는 지정 업체 분포와 추이를 분석해 식품 안전 정책과 제도 개선을 위한 참고자료로 활용할 수 있습니다.
