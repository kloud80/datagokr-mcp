description_portal: '부산광역시 남구에 있는 건강기능식품판매업소의 업소명, 도로명주소에 대한 상세한 정보를 제공합니다.건강기능식품은 인체에 유용한 기능성을 가진 원료나 성분을 사용하여 제조된 식품으로, 식약처에서 그 기능성과 안전성을 인정한 제품을 말합니다. 일반 식품과는 달리 특정 기능성을 표방할 수 있습니다.건강기능식품판매업은 건강기능식품을 소비자에게 판매하는 사업을 의미합니다. 단순히 건강식품을 판매하는 것을 넘어, **「건강기능식품에 관한 법률」**에 따라 엄격하게 관리되고 규제되는 업종입니다.건강기능식품판매업의 종류건강기능식품판매업은 크게 두 가지로 나눌 수 있습니다.건강기능식품 일반판매업: 영업장에서 건강기능식품을 판매하거나, 방문판매, 다단계판매, 전화권유판매, 전자상거래, 통신판매 등의 방법으로 판매하는 영업을 말합니다.건강기능식품 유통전문판매업: 건강기능식품전문제조업자에게 의뢰하여 제조한 건강기능식품을 자신의 상표로 유통·판매하는 영업입니다. 이 경우 위탁생산 계약을 체결해야 하며, 건강기능식품을 위생적으로 보관할 수 있는 충분한 보관시설을 갖춰야 합니다.맞춤형 건강기능식품판매업 (2025년 1월 3일 시행 예정): 제조 또는 수입된 여러 종류의 건강기능식품을 개인의 필요에 맞게 소분·조합하여 판매하는 새로운 형태의 판매업입니다. 이 경우 맞춤형 건강기능식품 관리사를 의무적으로 두어야 합니다.건강기능식품판매업 신고 및 운영 절차건강기능식품판매업을 시작하려면 다음과 같은 절차를 거쳐야 합니다.위생교육 이수: 영업 신고 전에 관련 교육기관에서 정해진 시간의 위생교육을 이수해야 합니다. (일반판매업 2시간, 유통전문판매업 4시간) 또한, 영업을 시작한 후에는 매년 보수교육을 이수해야 합'
