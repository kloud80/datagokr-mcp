summary_user: 정읍시에 있는 위탁급식영업소를 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·도로명주소·지번주소·소재지전화번호·데이터기준일자를 담는다. 급식 위탁업체를 찾는 학교·기관 담당자나 지역 식품업소 현황을 보는 분석가가 '정읍시에서 영업 중인 위탁급식업체는 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 데이터와는 업소명과 주소를 맞춰서만 이어 쓸 수 있다.
description_portal: '전북특별자치도 정읍시_위탁급식영업 현황2025. 8월 기준 정읍시 위탁급식영업에 대한 데이터로 업소명, 도로명주소, 지번주소, 소재지전화번호, 데이터기준일자에 대한 자료입니다.[데이터 안내]- 업소명 : 위탁급식영업소명- 도로명주소, 지번주소 : 해당 위탁급식영업소가 위치하고 있는 주소(도로명, 지번)- 소재지전화번호 : 해당 위탁급식영업소 연락처(개인정보, 휴대폰번호의 경우 비공개로 공란)- 데이터기준일자 : 현재 데이터의 기준일기타 궁금한 사항은 위탁급식영업 담당부서인 정읍시 보건소 보건위생과 식품안전팀(063-539-6095)로 문의하시기 바랍니다.'
