description_portal: 이 데이터는 서울특별시 광진구 관내에서 식품제조가공업 인허가를 받아 운영 중인 업소의 현황 정보를 제공합니다. 식품제조가공업은 「식품위생법」에 따라 원재료를 조리·가공하거나 새로운 형태로 제조해 도시락, 즉석식품, PB상품 등 다양한 완제품 식품을 생산·제공하는 업종입니다. 주요 항목에는 업소명, 소재지, 업종 유형, 인허가일자 등이 포함되어 있으며, 이를 통해 식품 생산 기반 파악, 지역 내 식품유통 연계 분석, 위생관리 행정, 식중독 예방 대응 체계 수립 등에 활용될 수 있습니다.특히 가공식품은 대량 소비와 밀접하여 급식업, 편의점, 배달업계 등과의 연계성이 크며, 제조시설의 위생 수준은 지역 보건 안전과 직결됩니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않으므로 지도 기반 활용 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신되며, 광진구 내 식품제조시설 분포 현황을 파악하는 데 유용한 자료입니다.
