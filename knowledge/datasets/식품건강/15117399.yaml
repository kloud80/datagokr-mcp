summary_user: '전국 급식 학교별로 위탁급식업체 계약 정보를 건별로 담는다: 학교명·학교코드·학교주소와 위탁업체명·업종·주소, 주요 식자재, 직영 여부, 사업자등록번호가 한 행에 들어간다. 식중독이 발생했을 때 어느 학교들이 같은 위탁업체나 식자재 공급처를 쓰는지 찾아 확산 범위를 가늠하려는 보건·교육 당국과 분석가가 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로, 사업자등록번호(BRNO)나 업체명·주소를 매핑해 같은 기관의 식품 인허가 업소 원장과 잇고, 학교코드는 이름·코드 대조로 학교 정보와 연결한다.'
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다. 범위는 전국이고 위치는 개별 주소 수준이며, 행정구역 코드는 따로 없다. 개발계정 호출은 하루 10,000회로 제한된다.
