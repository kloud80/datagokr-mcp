summary_user: 식품·의약품분야 시험·검사 등에 관한 법률에 따라 식품의약품안전처가 지정한 식품위생 검사기관의 지정 현황을 기관별로 담으며, 기관명·대표자명·인정번호·업무범위·지정 시작일과 종료일이 들어 있고 범위는 전국입니다. 식품 사업자가 자사 제품 검사를 맡길 수 있는 지정 검사기관과 그 업무범위, 지정 유효기간을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기관명이나 인정번호(PRSEC_INSTT_RCOGN_NO)를 이름·코드 매핑해 같은 식약처 계열 데이터와 연결해야 합니다.
description_portal: 식품의약품안전처에서 지정하는 식품ㆍ의약품분야 시험ㆍ검사 등에 관한 법률에 따른 식품위생 검사기관 지정 현황 관련 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
