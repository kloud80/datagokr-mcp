summary_user: 경기도 광명시가 모범음식점으로 지정한 업소를 한 행에 한 곳씩 담은 명단 파일(CSV, 약 5KB)로, 업소명·도로명 주소·행정동·층·업태 유형·주된 음식·예약문의 전화·장애인 편의시설 설치여부를 담는다. 광명시 시민이나 방문객이 '우리 동네에서 위생·서비스가 인정된 식당 중 휠체어로 들어갈 수 있는 한식집은 어디인가'를 찾을 때 쓰고, 분석가는 행정동별 모범음식점 분포를 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 원장이나 다른 위생 지정 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 업소 인허가번호가 없어 인허가 원장·행정처분 데이터와 정확히 1:1로 연결할 수 없고, 이름·주소 매칭에 따른 오차를 감안해야 한다. 범위는 광명시 한 곳뿐이라 다른 시군구와 비교하려면 각 지자체 파일을 따로 모아야 한다.
