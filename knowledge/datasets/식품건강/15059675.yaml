summary_user: '위생용품 제조업소가 보고한 품목을 한 건씩 담은 전국 단위 원천 목록으로, 업소명·인허가번호·품목제조번호·제품명·유형·허가일자·생산종료여부·유통/소비기한을 포함한다. 소비자나 유통업자가 특정 위생용품(예: 일회용 컵·물티슈)이 어느 업체에서 제조보고된 제품인지, 아직 생산 중인지 확인하는 데 쓴다. 전역 조인 키는 없어서 인허가번호(LCNS_NO)나 업소명으로 같은 기관의 식품·위생 인허가 업소 자료나 회수·행정처분 자료와 이름·코드를 맞춰 잇는다.'
description_portal: 위생용품 품목제조보고에 대한 속성정보를 제공합니다. 속성정보로는 인허가번호 , 업소명 , 품목제조번호 , 허가일자 , 제품명 , 유형 , 생산종료여부 , 유통/소비기한 , 업종 , 최종수정일자가 있습니다.이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
