summary_user: 농산물 검사에서 부적합 판정을 받은 제품을 건별로 담는다. 제품명·업소명·제조일자·유통/소비기한, 부적합항목과 기준규격·검사결과, 검사기관과 영업자주소가 들어 있고, 범위는 전국이다. 소비자나 유통업자가 "내가 산 농산물이 잔류농약 등으로 부적합 판정을 받았나"를 확인하거나, 분석가가 어떤 항목에서 부적합이 자주 나오는지 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 식품 인허가 업소·회수/행정처분 데이터와는 업체인허가번호(LCNS_NO)나 업소명·바코드번호를 맞춰 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 제품명, 업소명, 제조일자, 유통/소비기한, 전화번호, 바코드번호, 포장단위, 부적합항목, 기준규격, 검사결과, 등록일, 회수폐기일련번호, 업체인허가번호, 영업자주소, 검사기관, 보고자전화번호 정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
