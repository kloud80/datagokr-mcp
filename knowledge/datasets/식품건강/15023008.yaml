summary_user: 부산광역시 남구 관내 축산물 판매업소를 업소 한 곳당 한 행으로 담은 파일로, 판매업 구분·업소명·주소·전화번호가 들어 있다(약 19KB CSV). 주민이나 상권 분석가가 '남구 어느 동네에 정육점 같은 축산물 판매업소가 몰려 있나'를 확인하거나 위생 점검 대상 목록을 만들 때 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 이어 붙여야 한다.
description_portal: 「부산광역시 남구_축산물판매업현황」 데이터는 남구 관내에서 운영 중인 축산물 판매업소의 설치 및 영업 현황을 체계적으로 관리하기 위해 구축된 식품위생 기반 자료입니다. 이를 통해 지역 내 축산물 유통 구조 파악, 식품 안전관리, 위생 점검 계획 수립, 취약업소 관리, 소비자 안전 강화 등 다양한 행정·정책적 활용이 가능합니다. 또한 축산물 이력 추적, 신선·위생 기준 준수 여부 확인, 축산물 판매업의 분포 분석 등을 지원하여 남구의 건강하고 안전한 식품환경 조성에 기여하는 중요한 공공데이터입니다.
