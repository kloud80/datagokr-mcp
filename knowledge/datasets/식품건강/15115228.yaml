summary_user: 서울 강남구의 헤어·메이크업·네일 등 미용업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·도로명/지번주소·좌표·사업장명·업태 등을 포함한다. 창업 예정자나 상권 분석가가 '강남구에서 지금 영업 중인 미용실·네일숍은 어디에 몰려 있고 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 다른 구의 미용업 인허가나 다른 공중위생업소 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 잇는다.
