summary_user: 경상남도 하동군이 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일로, 업태명·업소명·대표자명·도로명 소재지·전화번호를 담는다(파일 크기 약 2KB의 소규모 목록). 하동을 찾는 관광객이나 주민이 '하동에서 믿고 갈 만한 모범음식점이 어디 있고 연락처는 무엇인가'를 확인하는 외식 선택 근거로 쓴다. 인허가번호 같은 전역 조인 키는 없으므로, 식품 인허가 업소 원장이나 다른 위생 지정 데이터와는 업소명·도로명 주소를 맞춰 붙여야 한다.
limits: 실측 컬럼에 인허가번호 등 공통 키가 없어 인허가 원장과 바로 조인하지 못하고 이름·주소 매칭에 의존해야 한다. 범위는 하동군 한 시군구에 그치므로 다른 지역과 비교하려면 각 시군 파일을 따로 모아야 한다.
