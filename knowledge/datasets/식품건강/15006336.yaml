description_portal: '대구광역시 북구 소재에 신고 또는 허가된 식품접객업에 대한 현황을 제공하고 있습니다.식품접객업에는 식품위생법 시행령 제21조(영업의 종류)에 의거 다음과 같은 업종이 포함되어 있습니다.○ 휴게음식점: 주로 다류(茶類), 아이스크림류 등을 조리ㆍ판매하거나 패스트푸드점, 분식점 형태의 영업 등 음식류를 조리ㆍ판매하는 영업으로서 음주행위가 허용되지 아니하는 영업○ 일반음식점: 음식류를 조리ㆍ판매하는 영업으로서 식사와 함께 부수적으로 음주행위가 허용되는 영업○ 단란주점영업: 주로 주류를 조리ㆍ판매하는 영업으로서 손님이 노래를 부르는 행위가 허용되는 영업○ 유흥주점영업:  주로 주류를 조리ㆍ판매하는 영업으로서 유흥종사자를 두거나 유흥시설을 설치할 수 있고 손님이 노래를 부르거나 춤을 추는 행위가 허용되는 영업○ 제과점: 주로 빵, 떡, 과자 등을 제조ㆍ판매하는 영업으로서 음주행위가 허용되지 아니하는 영업위 업종에 대하여 업종명, 업소명, 소재지(도로명 주소), 소재지(지번 주소)에 대한 정보를 제공하는 데이터입니다.'
