summary_user: 대구광역시 북구에 신고·허가된 식품접객업소(휴게음식점·일반음식점·단란주점·유흥주점·제과점)를 업소 한 곳당 한 행으로 담은 원장 파일로, 업종명·업소명·도로명 주소·지번 주소를 담는다. 북구에서 특정 동네에 일반음식점이나 제과점이 몇 곳 있는지 보려는 창업 예정자나 상권 분석가가 업종별 업소 분포를 파악하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열을 맞추거나 주소를 좌표로 바꿔 연결해야 한다.
