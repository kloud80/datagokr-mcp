summary_user: 인천광역시 미추홀구에 등록된 식품자동판매기영업소를 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업종명·업소명·도로명/지번 주소·소재지전화를 담는다. 구청 위생 담당자나 분석가가 '미추홀구에서 식품자동판매기가 어느 동네에 몰려 있나'를 확인하거나 지도점검 대상 목록을 만들 때 쓴다. 인허가번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 붙이거나 주소를 지오코딩해 공간 단위로 잇는다.
description_portal: 본 데이터는 인천광역시 미추홀구 내에서 운영 중인 식품자동판매기영업소의 현황을 수록한 자료입니다. 연번, 업종명, 업소명, 도로명주소, 지번주소, 소재지전화 항목으로 구성되어 있으며, 식품위생법에 따라 등록된 자동판매기를 통해 식품을 판매하는 영업소의 위치 및 기초정보를 제공합니다. 식품자동판매기영업은 무인으로 식품을 취급하는 특수한 형태의 영업으로, 위생관리 및 안전한 유통이 중요한 분야입니다. 해당 자료는 식품위생 행정, 민원 대응, 지도점검, 정책 수립 등 다양한 행정 및 민간 활용에 기초자료로 제공되며, 주소 정보는 도로명과 지번주소로 병기되어 있어 공간정보 기반 분석에도 활용이 가능합니다. 본 데이터는 정기적으로 갱신되어 공공성과 정보 접근성을 높이는 데 목적이 있습니다.
