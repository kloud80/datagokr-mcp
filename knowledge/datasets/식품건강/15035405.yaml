summary_user: 경상남도 남해군에서 담배소매인으로 지정된 소매점을 업소별 한 줄로 담은 파일로, 업소명·도로명주소·지정일자·법인구분(개인/법인)·영업구분(신규·이전 등)이 들어 있다. 주민이 집 근처 담배 판매점을 찾거나, 분석가가 남해군 안에서 담배소매점이 언제 어디에 새로 지정되고 이전했는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명주소를 맞춰 붙여야 하고, 같은 기관(남해군)의 다른 업소 데이터와 주소 기준으로 연결하는 정도가 현실적이다.
description_portal: '이 데이터는 경상남도 남해군 지역 내 담배를 판매할 수 있도록 지정된 소매점들의 정보를 제공합니다. 업소명, 도로명 주소, 지정일자, 법인구분(개인/법인), 영업구분(예: 신규, 이전 등)이 포함되어 있어, 담배소매점 지정 현황을 파악할 수 있습니다. 이를 통해 시민들은 가까운 담배 판매점을 쉽게 찾을 수 있고, 관련 업계 및 행정기관은 지역 내 담배 소매 유통 구조 분석, 변동 현황 모니터링, 정책 수립의 기초자료로 활용할 수 있습니다. 또한 개발자들은 지도 기반의 소매점 안내 서비스, 상권 분석 도구 등에 적용할 수 있습니다. 단, 지정일자 이후 업소의 이전, 폐업 등의 변동이 있을 수 있으니 실제 방문이나 업무에 활용 시에는 최신 상태를 별도로 확인해야 합니다. 또한, 영업구분 및 법인구분 등 일부 정보는 행정 절차의 변경에 따라 내용이 달라질 수 있습니다.'
