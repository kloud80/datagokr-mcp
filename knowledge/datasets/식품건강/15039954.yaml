summary_user: 인천광역시 서구(서해구) 안의 유흥주점과 단란주점을 업소 한 곳당 한 행으로 담은 목록으로, 업종명·업소명·지번 주소·전화번호가 들어 있고 활용신청 없이 받는 CSV 파일(약 17KB)입니다. 구청 위생 담당자나 분석가가 서구 안에서 유흥·단란주점이 어느 동네에 몰려 있는지 파악하거나, 위생 점검·민원 대응 때 업소 연락처를 확인하는 데 쓴다. 공통 조인 키(인허가번호·사업자번호·좌표)가 없어서 다른 식품 인허가·행정처분 데이터와는 업소명이나 지번 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 유흥주점 및 단란주점의 영업 현황을 정리한 데이터입니다. 본 자료는 인천광역시 서구 내 유흥주점과 단란주점의 업소명, 업종명, 주소, 전화번호 정보를 포함하고 있습니다. 본 데이터는 인천광역시 서구 내 유흥업소 분포 파악과 식품위생 관리, 접객업소의 정책 수립 등에 활용될 수 있을것으로 판단됩니다. 또한 위생 점검 및 관련 민원 처리의 참고자료로도 유용할것으로 판단합니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
