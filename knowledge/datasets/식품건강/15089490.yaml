summary_user: 인천광역시 서구(서해구)에 등록된 식품첨가물제조업체를 업소 한 곳당 한 행으로 담은 목록으로, 업소명·도로명 소재지·전화번호·데이터기준일자를 담는다. 주민이나 식품 제조·유통 사업자가 '우리 지역에 등록된 식품첨가물 제조업체가 어디 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 업소명이나 도로명 주소를 맞춰 이어 써야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 식품첨가물제조업체의 등록 현황을 제공하고 있습니다. 본 데이터는 인천광역시 서구 내 식품첨가물제조업체의 업소명, 소재지(도로명), 전화번호 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 내 식품첨가물제조업체의 분포 및 현황을 알 수 있습니다. 이를 통해 주민들은 합법적으로 등록된 식품첨가물제조업체를 알아 볼수 있어 신뢰할 수 있는 식품첨가물 사용을 촉진할 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
