summary_user: 서울 구로구의 식품자동판매기업 인허가 업소를 업소 한 곳당 한 행으로 담은 건별 원장으로, 인허가일자·영업상태(영업/폐업)·폐업일자·사업장명·지번/도로명 주소·좌표(X, Y)·업태 등이 들어 있다. 구로구에서 지금 영업 중인 식품자동판매기 업소가 어디에 몇 곳 있는지, 최근 새로 허가받거나 폐업한 곳은 어디인지 확인하려는 사업자·위생 담당자·상권 분석가가 쓴다. 전역 조인 키는 없으므로 같은 서울시 인허가 계열 데이터와는 관리번호(MGTNO)·자치단체 코드로, 다른 데이터와는 주소·좌표나 사업장명 매칭으로 잇는다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 식품자동판매기업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 소재지 주소와 좌표정보 등이 포함되며, 식품자동판매기업 시설의 설치현황, 업태구분 등 주요 속성이 기록된다. 데이터는 정기적으로 갱신되어 최신 인허가 상태를 반영하므로 정책 수립, 연구 분석, 위생 관리, 민원 처리 등 다양한 분야에서 활용된다. 특히 좌표정보는 지도 서비스, 공간 분석, 위치 기반 서비스와 연계하여 활용할 수 있어 지역사회 정보 접근성과 행정 투명성을 높이는 기반 자료로 기능한다. 또한 데이터 항목이 표준화되어 비교와 통계 작성이 가능하며, 허가 변경 이력과 상태 값이 포함되어 점검과 행정 지도에 유용하게 활용될 수 있다.
