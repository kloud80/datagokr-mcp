summary_user: 대구광역시 수성구에 등록된 식품접객업소(일반음식점·휴게음식점·제과점 등)를 업소 한 곳당 한 행으로 담은 원장형 파일로, 업종명·업소명·도로명/지번 소재지·우편번호·전화번호를 담는다. 상권 분석가나 창업 준비자가 '수성구 특정 동에 어떤 업종의 음식점이 얼마나 몰려 있나'를 주소 기준으로 따져 보거나, 주민이 근처 업소 연락처를 찾는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·위생 지정·행정처분 데이터와는 업소명과 주소(도로명·지번, 우편번호)를 맞춰 이어 써야 한다.
limits: 수성구 한 곳만 다루므로 다른 시군구와 비교하려면 별도 데이터를 모아야 한다. 고유 식별 키가 없어 업소명·주소 매칭으로만 다른 데이터와 연결되며, 같은 이름·주소 표기 차이로 오매칭이 생길 수 있다.
