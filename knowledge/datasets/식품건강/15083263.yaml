description_portal: 본 데이터는 구군별 모범음식점 지정 현황을 제공한다. 위생과 서비스가 우수한 음식점 인증 제도 운영 정보를 포함한다. 구군, 업소명, 도로명주소, 전화번호, 주메뉴 등을 수록한다. 구군은 북구, 남구, 중구 등 행정구역이며, 업소명은 지정된 식당 상호이다. 도로명주소는 업소 소재지이고, 전화번호는 업소 연락처이다. 주메뉴는 음식점의 대표 메뉴를 의미한다. 모범음식점은 식품위생법에 따른 위생관리 기준을 준수하고 친절한 서비스와 합리적 가격으로 양질의 식사를 제공하는 업소에 부여되는 인증이다. 본 데이터로 지역별 우수 음식점 분포를 파악할 수 있으며, 시민의 외식 선택과 음식문화 향상 정보로 활용된다. 외식문화 조성 및 위생 수준 제고에 기여한다.
