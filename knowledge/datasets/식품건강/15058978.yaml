summary_user: 경기도 31개 시군의 식용얼음판매업 업소를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·폐업일자·영업상태·도로명/지번 주소·WGS84 좌표·종업원 수·건물소유형태·보증금·월세 등을 포함한다. 시군 담당자나 사업자가 '우리 시군에 현재 영업 중인 식용얼음 판매업소는 몇 곳이고 어디에 몰려 있는가'를 확인하거나 상권·위치 분석을 할 때 쓴다. 전역 조인 키는 없어 다른 식품 인허가 업소 데이터와는 시군코드(SIGUN_CD)·사업장명·주소를 맞춰 잇고, 좌표(REFINE_WGS84_LAT/LOGT)로 지도 위에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 식용 얼음 판매업에 대한 인허가 현황을 포함한 자료로, 총 31개 시군의 사업장 단위 데이터를 제공합니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태, 소재지 주소, 위도·경도 좌표, 업태구분명, 종업원 수 및 성별 인력 구성, 건물소유형태, 보증금액, 월세금액, 시설규모 등이 포함되어 있습니다. 본 데이터는 경기도에서 먹는 얼음을 취급하는 업체의 현황을 파악하고, 관련 산업의 지역 분포 및 운영 상태를 분석하는 데 활용될 수 있습니다. 특히 영업상태 및 업종 특성 정보는 정책 수립과 행정 서비스 제공에 참고자료로 유용하며, 위치정보(WGS84 좌표)는 지도 시각화와 같은 공간정보 분석에도 활용 가능합니다.
