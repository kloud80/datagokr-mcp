summary_user: 경상남도 거창군 안의 영업장 면적 300제곱미터 이상 대형 음식점을 업소 한 곳당 한 행으로 담은 목록이며, 업종명·업소명·도로명 소재지·연락처·데이터기준일자로 구성된 작은 CSV 파일(약 1.7KB)이다. 단체 관광이나 경조사 모임 장소를 찾는 주민·여행객, 또는 거창군 대형 외식업소가 어디에 몰려 있는지 보려는 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가 원장이나 위생·행정처분 데이터와는 업소명·도로명 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '경상남도 거창군 내 300제곱미터(약 90평) 이상의 대형 음식점은 지역 외식 문화와 단체 관광의 핵심적인 역할을 담당하고 있습니다. 1. 주요 특징 및 시설공간 구성: 넓은 홀 외에도 프라이빗 룸과 대규모 단체석을 갖추고 있으며, 주방과 창고 등 기능적 구역이 철저히 분리되어 효율적인 운영이 가능합니다.편의 시설: 대형 주차장 확보가 필수적이며, 위생 및 소방 기준이 일반 음식점보다 엄격하게 적용되어 안전성이 높습니다.주요 업종: 거창의 특산물인 "애우(거창한우)"를 전문으로 하는 거창축협 한우팰리스, 외양간구시 등 대형 육류 구이점이 대표적이며, 대규모 한정식 전문점과 대형 횟집들이 주를 이룹니다.2. 지역 경제적 가치이러한 대형 식당들은 거창을 방문하는 단체 관광객과 지역 주민의 경조사 수요를 흡수하며 지역 경제 활성화에 기여합니다. 특히 거창읍과 가조면 등 주요 거점을 중심으로 분포하여 접근성이 뛰어나며, 고품질의 서비스와 쾌적한 환경을 제공하는 것이 특징입니다.'
