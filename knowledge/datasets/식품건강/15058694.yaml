summary_user: 경기도 31개 시군의 편의점 형태 휴게음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자, 도로명·지번 주소와 위경도, 종사자 수·시설규모 등을 포함한다. 예비 창업자나 상권 분석가가 '이 동네에 영업 중인 편의점이 몇 곳이고 최근 몇 곳이 문을 닫았나'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 시군 코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 다른 업종의 인허가 데이터, 행정구역 통계와 맞춰 이어 쓴다.
description_portal: 본 데이터는 경기도 내 31개 시군에서 24시간 운영 중인 편의점 형태의 휴게음식점에 대한 인허가 현황을 포함하고 있습니다. 주요 정보로는 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 정보(도로명·지번·우편번호), 위생업종·업태, 급수시설 구분, 남녀 종사자 수, 총 시설규모, 다중이용업소 여부, 영업장 주변 구분, 위도·경도 등이 포함됩니다. 소비자 편의를 중심으로 운영되는 잡화점 형태의 편의점으로, 다류, 아이스크림, 간편식, 담배 등 다양한 소비재를 취급하는 곳입니다. 데이터는 주간 단위로 갱신되며, 유통 산업 연구, 입지 분석, 창업 전략 수립 등에 활용할 수 있습니다. 상업적 이용과 콘텐츠 변경이 가능합니다.
