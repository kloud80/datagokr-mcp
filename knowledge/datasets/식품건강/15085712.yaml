summary_user: 건강기능식품에 쓰이는 원료를 원료(품목군)별로 담은 분류 DB로, 원료명과 함께 대분류·중분류·소분류의 코드와 이름을 행 단위로 제공하며 범위는 전국·비공간이다. 건강기능식품 제품을 기획하는 사업자나 분석가가 특정 원료가 어떤 분류 체계에 속하는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 원료명·분류코드(대·중·소분류 코드) 매핑이나 같은 기관의 코드로만 이어 쓴다.
description_portal: 건강기능식품에 쓰이는 원료에 대한 정보 DB로 각 원료의 원료명, 대분류명,  중분류명,  소분류 명 등의 정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
