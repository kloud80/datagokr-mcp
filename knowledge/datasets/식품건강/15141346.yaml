summary_user: 서울특별시 금천구의 위탁급식영업 업소를 인허가 건별로 담은 원장으로, 업소마다 인허가일자·영업상태(영업/폐업/휴업)·사업장명·소재지 주소·좌표·종사자 수·급수시설·건물 소유 구분·보증액·월세액·시설 규모 같은 항목이 들어 있다. 창업 준비자나 분석가가 금천구에서 지금 영업 중인 위탁급식업체가 몇 곳이고 어디에 있는지, 언제 개업·폐업했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구·다른 업종의 식품 인허가 데이터와는 같은 기관 코드(OPNSFTEAMCODE)나 주소·사업장명 매칭으로 잇고, 좌표(X, Y)로 지도 위에 겹쳐 쓴다.
description_portal: 위탁급식영업의 인허가 정보를 상세히 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 소재지, 전화번호, 업태 구분, 위생업태, 종사자 수, 급수시설, 건물 소유 구분 등 기본 정보와 함께 폐업·휴업·재개업 등 영업 변동 사항, 보증액, 월세액, 시설 규모 등 경영 관련 정보도 포함하고 있습니다. 이를 통해 위탁급식업체의 시장 동향 분석, 창업 계획, 정책 수립, 지역 내 급식업 현황 파악 등에 활용할 수 있습니다. 또한 해당 데이터는 급식 서비스 품질 향상, 위생 관리 강화, 영양 균형 개선, 공공·민간 급식 인프라 확충 등 다양한 행정·연구·산업 분야에서 기초 자료로 유용하게 쓰입니다.
