summary_user: 인천광역시 서구(서해구) 안에 등록된 집단급식소 식품판매업체를 업소 한 곳당 한 행으로 담은 원천 목록 파일(CSV, 약 21KB)로, 업종명·업소명·도로명 소재지·전화번호·데이터기준일자를 담는다. 학교·기업·공공기관 급식소 담당자나 식자재 유통 사업자가 "서구에서 단체급식 식자재를 납품하는 업체가 어디에 몇 곳 있는가"를 확인하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·위생 데이터와는 업소명이나 도로명 주소를 맞춰 잇는 방식으로만 연결한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 집단급식소 식품판매업 등록업체 현황을 제공하고 있습니다. 본 데이터는 인천광역시 서구 내 집단급식소 식품판매업체의 업소명, 소재지(도로명), 전화번호 등 항목을 제공을 하고 있습니다. 본 공공데이터를 통하여 학교,기업,공공기관 등 단체급식소에 식자재를 납품하는 업체의 분포와 현황을 파악할 수 있으며, 공중보건, 식품위생 관련 정책에 기초자료로 활용할 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적 갱신을 통해 최신정보를 반영하고 있습니다.
