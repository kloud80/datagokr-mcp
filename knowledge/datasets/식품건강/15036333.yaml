summary_user: 부산광역시 동구 관내 위탁급식영업 업소를 업소 한 곳당 한 행으로 담은 소규모 파일(csv 약 3KB)로, 업종명·업소명·도로명/지번 소재지·전화·우편번호 7개 항목으로 이루어진다. 동구에서 학교·기업 급식을 맡길 위탁급식 업체를 찾거나 지역 급식업체 분포를 확인하려는 사업자·분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가 데이터와는 업소명·주소 문자열 매칭으로만 이어 쓴다.
