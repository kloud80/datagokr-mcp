summary_user: 경상남도 도내 18개 시·군의 유흥주점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·업종·업태·업소주소·인허가 관할기관을 포함한다. 지자체 담당자나 분석가가 "우리 시·군에 유흥주점이 어디에 몇 곳 있는가" 같은 지역별 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식품 인허가 업소 자료와는 업소명·주소 문자열이나 인허가 관할기관 이름으로만 맞춰 이어 쓴다.
description_portal: 경상남도 유흥주점 업소정보는 주로 주류를 조리·판매하는 영업 형태로, 유흥종사자를 둘 수 있으며 유흥시설을 설치할 수 있고, 손님의 노래 및 춤 추는 행위가 허용되는 유흥주점에 대한 자료입니다. 본 데이터는 도내 18개 시·군에 걸쳐 운영 중인 유흥주점의 업소명, 업종 및 업태, 영업장 소재지, 인허가 관할기관, 영업상태 등의 항목을 포함하고 있으며, 지역별 유흥업소의 분포 현황 및 운영 실태를 체계적으로 파악할 수 있도록 구성되어 있습니다. 이 정보는 유흥업 관리, 안전 점검, 유관기관과의 협업, 건전한 유흥문화 정착, 지역 치안 정책 수립 등 실질적인 행정 및 정책적 활용을 위한 기반 자료로 활용됩니다.
