summary_user: 부천시 관내 식품용기포장지제조업소를 업소 한 곳당 한 행으로 담은 파일 데이터로, 업종명·업소명·인허가일자·도로명 소재지·우편번호·전화번호를 담는다. 식품 용기나 포장재를 납품받을 부천 지역 제조업체를 찾는 사업자, 관내 포장재 제조업소 분포를 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소 매칭으로만 잇고, 같은 부천시의 다른 식품 인허가 업소 현황과 나란히 쓰는 정도다.
description_portal: 경기도 부천시의 식품과 관련하여 부천시 관내 위치한 식품용기포장지제조업 현황 데이터를 등록하였습니다.해당 데이터에는 업종명, 업소명, 소재지(도로명), 소재지전화, 우편번호(도로명)등의 내용이 포함되어 있습니다. 이 데이터를 통하여 부천시 식품용기포장지제조업소에 대한 정보를 쉽게 찾아 이용할 수 있습니다.또한, 식품용기포장지제조업과 관련한 식품 분석이나 계획에도 참고자료로 활용할 수 있으며, 식품 서비스 품질 향상 및 규제 정책마련에도 활용될 수 있습니다.※ 제공되는 데이터는 등록 변경(신규, 폐업, 변경) 등 처리로 인하여, 별도로 제공되는 데이터와 차이가 있을 수 있습니다.
