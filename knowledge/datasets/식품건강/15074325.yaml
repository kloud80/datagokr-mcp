summary_user: 식품첨가물로 쓰이는 시약의 시약명·회사명·시도별 관할 지방청·상태·순도·유효기간을 품목 단위로 담은 전국 범위 목록입니다. 식품 제조사나 분석가가 특정 시약을 어느 회사가 취급하고 순도와 유효기간은 어떤지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 회사 번호(CMPNY_NO)나 회사명으로 같은 기관의 식품 인허가 업소 데이터 등과 이름·코드 매핑으로 연결한다.
description_portal: 식품의약품안전처에서 관리하는 시약(식품첨가물) 정보입니다. 시약 명, 회사 명, 시도별 지방청, 상태, 순도, 유효기간 자료를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
