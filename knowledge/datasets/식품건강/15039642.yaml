summary_user: 포천시 관내 집단급식소를 한 곳당 한 행으로 담은 파일로, 업소명·도로명/지번 주소·전화번호와 1일 급식인원, 아침·점심·저녁·야식·기타 시간대별 급식인원, 위탁급식업소명을 기록한다(CSV 약 6KB 규모의 소량 원장). 포천시에서 어떤 급식소가 어느 위탁급식업체에 운영을 맡기고 있고 하루 몇 명에게 급식하는지를 확인하려는 위생·급식 행정 담당자나 위탁급식 사업자가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 소재지 주소나 업소명·위탁급식업소명을 기준으로 식품 인허가 업소 목록, 학교·복지시설 등 주소 기반 데이터와 이름·주소 매칭으로 이어 쓴다.
description_portal: 경기도 포천시에서 제공하는 집단급식소 위탁현황 데이터입니다. 본 데이터는 포천시 관내 집단급식소의 운영 및 위탁급식 현황을 제공하는 자료로, 시군명, 업소명, 소재지도로명주소, 소재지지번주소, 업소전화번호, 1일 급식인원, 급식인원(아침·점심·저녁·야식·기타), 위탁급식업소명, 데이터기준일자 등의 항목으로 구성되어 있습니다.이를 통해 집단급식소의 위치, 운영 규모, 시간대별 급식 인원 및 위탁 운영 현황을 확인할 수 있으며, 급식시설 운영 현황 분석, 식품위생 및 급식관리 정책 수립, 공공급식 운영 지원, 복지·교육 관련 행정업무의 기초자료로 활용할 수 있습니다. 또한 소재지주소를 기반으로 행정구역, 교육시설, 복지시설 등 다양한 공공데이터와 연계·분석이 가능하여 지역 급식서비스 현황 분석에 활용할 수 있는 공공데이터입니다.본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
