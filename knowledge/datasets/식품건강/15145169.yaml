description_portal: '(HACCP 중요관리점 정보 제공 서비스) HACCP인증업체 중 중요관리점에 대한 정보를 제공하고 있습니다. 인증업체의 중요관리점으로 설정되어 있는 공정명과 중요관리점 번호로 구성된 데이터입니다. *(업종) 영업허가기준 업종명(식품제조가공업, 식육가공업, 식육포장처리업, 가축사육업 , 알가공업, 유가공업, 식육판매업, 식품첨가물제조업 등)*(공정) 중요관리점 공정이름(살균공정, 세척공정, 소독헹굼공정, 금속검출공정 등)*(중요관리점) CCP: Critical Control Point로서 해당 공정이 화학적인 위해요소에 대한 중요관리점인 경우 C,                            생물학적인 위해요소에 대한 중요관리점인 경우 B, 물리적 위해요소에 대한 중요관리점인 경우 P를 붙여서 표현*(위해요소) 중요관리점 공정의 생물학적 위해요소(장출혈성대장균, 살모넬라균 등), 화학적 위해요소(잔류농약, 중금속 등), 물리적 위해요소(금속 이물 등)'
