summary_user: 서울특별시 광진구 관내 식용얼음판매업소의 인허가 정보를 업소 한 곳당 한 행으로 담은 원장이며, 업소명·소재지 주소·인허가일자·영업상태·폐업일자·업태·중부원점TM 좌표(X, Y) 등을 포함한다. 위생 담당자나 분석가가 광진구에서 현재 영업 중인 식용얼음 판매업소가 어디에 몇 곳 있는지 확인하고 점검 대상을 추릴 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 관리번호(MGTNO)·자치단체 코드(OPNSFTEAMCODE)나 업소명·주소 매칭으로 같은 기관의 다른 식품 인허가 데이터와 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 식용으로 사용되는 얼음을 전문적으로 판매하는 업소의 인허가 현황 정보를 제공하는 자료입니다.식용얼음판매업은 「식품위생법」에 따라 허가를 받은 영업 유형으로, 빙과류, 음료첨가물, 조리용 식재 등으로 사용되는 얼음을 위생적으로 보관 및 판매하는 것이 특징입니다.데이터 항목에는 업소명, 소재지, 인허가일자, 영업상태, 업태구분, 관리기관 등이 포함되어 있으며, 이를 통해 식품위생 점검 대상 분류, 위생관리 실태 파악, 지역 내 얼음 유통업소 현황 분석 등에 활용할 수 있습니다.※ 본 데이터는 중부원점TM(EPSG:2097) 좌표계 기반의 위치 정보만 포함되어 있으며, 위도·경도는 제공되지 않습니다.※ 자료는 3일 전 기준으로 최신화된 인허가 정보를 반영하고 있으며, 식품안전과 관련된 정책 수립, 행정지도, 영업실태조사 등에서 참고 자료로 활용 가능합니다.
