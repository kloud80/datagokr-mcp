summary_user: 부산광역시 중구 관내 건강기능식품 일반판매업소와 유통전문판매업소를 업소 한 곳당 한 행으로 담은 신고 업소 목록으로, 업종명·업소명·도로명 및 지번 소재지를 제공한다. 주민이나 사업자가 중구에서 건강기능식품을 신고하고 파는 가게가 어디에 있는지, 업종별로 몇 곳인지 확인하는 데 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 다른 식품 인허가 데이터와는 업소명이나 주소 문자열을 맞춰 연결해야 한다.
limits: 인허가번호·사업자번호·좌표가 없어 다른 데이터와 정확히 일대일로 잇기 어렵고, 주소 매칭에 기대야 한다. 범위가 부산 중구 한 곳뿐이어서 시 단위나 전국 비교에는 다른 시군구 자료를 따로 모아야 한다.
