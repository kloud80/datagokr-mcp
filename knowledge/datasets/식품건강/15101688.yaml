summary_user: 경상북도 내 음식점 업소를 업소 단위로 담은 파일 데이터로, 업소명·인허가관할기관·업종·업태·주소를 수록하며 검증 시 41,936행 전체를 받았다. 도민이나 분석가가 시군 지역별로 어떤 업종·업태의 음식점이 얼마나 분포하는지 같은 상권·위생관리 현황 질문에 쓴다. 조인 키는 업소주소(address)뿐이라 주소 기준으로 다른 식품 인허가·위생 지정 등 같은 부문 데이터와 이어 쓴다.
description_portal: 본 공공데이터는 경상북도 내 일반음식점, 휴게음식점 등 다양한 유형의 음식점에 대한 기본 정보를 포함하고 있습니다. 수록된 정보는 각 음식점의 명칭, 관할 기관, 업종, 업태, 주소로 구성되어 있으며, 도내 식품위생관리 및 행정 업무에 활용되는 자료입니다. 업소별 업종 및 업태 구분을 통해 해당 음식점의 운영 성격을 파악할 수 있으며, 위치 정보를 기반으로 지역별 현황 분석에도 활용이 가능합니다. 데이터는 경상북도 관할 하에 운영되는 음식점을 기준으로 하며, 주기적인 업데이트를 통해 최신성을 유지하고 있습니다. 일반 사용자, 연구자, 정책 수립자 등이 음식점 분포 및 특성 파악을 목적으로 활용할 수 있도록 공개됩니다. 해당자료에 대한 문의는 054-880-3845로 하시면 됩니다.
