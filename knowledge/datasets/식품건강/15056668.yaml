summary_user: 경기도 시군에 있는 축산물 수입 판매업체를 업체(사업장)별로 한 건씩 담은 인허가 현황으로, 사업장명·인허가일자·영업상태와 폐업일자·소재지 주소·면적·종업원 수·위경도 좌표를 포함한다. 수입 소고기·돼지고기를 유통하는 업체가 내 시군에 몇 곳이 영업 중인지, 최근 폐업한 곳은 어디인지 확인하려는 사업자나 식품안전 담당자가 쓴다. 전역 조인 키는 없어 다른 식품 인허가·위생·행정처분 데이터와는 시군명·시군코드(SIGUN_CD)나 사업장명·주소 매칭으로 잇고, 위경도 좌표로 지도에 올려 쓴다.
description_portal: 이 데이터는 경기도 31개 시군에 소재한 축산물 수입 판매업체에 대한 인허가 현황을 제공하며, 주로 수입된 소고기, 돼지고기 등 축산물을 유통·판매하는 업체의 정보를 포함합니다. 데이터 항목은 사업장명, 인허가일자, 영업상태 및 폐업일자, 소재지 주소(도로명 및 지번), 소재지 면적, 우편번호, 종업원 수, 위경도 좌표(WGS84 기준), 축산물가공업구분명, 축산업무구분명 등으로 구성되어 있습니다. 본 자료는 수입 축산물 유통 현황 파악, 식품 안전 관리, 유통 경로 분석 및 정책 수립 등에 활용될 수 있으며, Open API를 통해 접근 가능하고 주간 단위로 갱신됩니다.
