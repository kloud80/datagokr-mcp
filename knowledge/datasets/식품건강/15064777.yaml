summary_user: 전국 식품 인허가 업소의 영업소재지를 업소 한 곳씩 담은 건별 데이터로, 업소명·인허가번호와 함께 지번·도로명 주소 요소와 지리정보용 코드를 제공한다. 상권 분석가나 창업 준비자가 '특정 동네에 음식점·식품업소가 어느 건물·필지에 몰려 있는가'를 지도 위에서 확인하는 데 쓴다. 실측상 전역 조인 키는 없으므로, 같은 기관의 다른 식품 인허가·위생·행정처분 데이터와는 인허가번호(LCNS_NO)로 잇고, 필지·도로명·건물 관련 코드는 이름·코드 매핑을 거쳐 주소 데이터와 맞춘다.
description_portal: 영업소재지 GIS 코드 정보입니다. 각종 지리 정보들을 데이터베이스(database)화하고 컴퓨터를 통해 분석·가공하여 실생활에 다양하게 활용할 수 있도록 만든 시스템인 GIS(Geographic Information System) 코드로 영업소재지에 대한 속성정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
