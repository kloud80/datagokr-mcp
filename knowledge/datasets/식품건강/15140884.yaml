summary_user: 서울특별시 광진구 관내에서 식품위생법에 따라 인허가된 기타 식품판매업소(대형마트·창고형 할인점·복합쇼핑몰 등 일정 규모 이상 매장)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·인허가일자·영업상태·폐업일자·소재지 주소·면적·중부원점TM 좌표 등을 포함한다. 광진구에서 지금 영업 중인 대형 식품판매 매장이 어디에 몇 곳 있는지, 언제 문을 열거나 닫았는지를 확인하려는 상권 분석가나 위생 행정 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드(OPNSFTEAMCODE)로만 연결하고, 같은 부문의 위생 지정·행정처분·회수 데이터와는 이 방식으로 이어 본다.
description_portal: 본 데이터는 서울특별시 광진구 관내에서 「식품위생법」에 따라 인허가된 기타 식품판매업소의 현황을 제공합니다.해당 업소는 일반적으로 제과점영업, 유통전문판매업, 즉석판매제조가공업 등에 포함되지 않으며, 대형마트, 창고형 할인점, 복합쇼핑몰 등 일정 규모 이상의 매장에서 식품을 판매하는 업소가 해당됩니다.데이터에는 업소명, 소재지, 업종유형, 인허가일자, 관리기관 등이 포함되며, 이를 통해 지역 내 대형 식품판매 시설 분포 파악, 유통 안전관리, 식품소비 환경 분석, 공공보건 정책 수립 등 다양한 행정 및 민간 활용이 가능합니다.이러한 업소는 다수의 소비자에게 식품을 제공하는 대규모 유통 접점이므로, 식품 보존상태, 유통기한 표시, 위생관리 수준 등이 중요하게 관리되어야 합니다.※ 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며 위도·경도 좌표는 포함되어 있지 않습니다.※ 본 데이터는 3일 전 기준으로 갱신된 최신 인허가 현황을 반영합니다.
