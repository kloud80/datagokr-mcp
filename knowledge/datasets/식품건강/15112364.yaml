description_portal: 가공식품영양성분DB를 구축하기 위하여 998개 품목의 1,735개 대표브랜드제품에 대한 영양성분 정보의 수집을 시도한 결과, 408개 품목의 686개 대표브랜드제품에 대하여 영양표시 대상 9개 영양성분 함량 정보를 수집하고, 추가적으로 15개 영양성분에 대한 정보를 보완하였음. 다음으로, 영양표시를 통해 영양성분 정보를 수집하지 못한 대표브랜드제품 중 식재료 함량 정보를 이용한 영양성분 함량의 계산이 가능한 8개 품목의 12개 대표브랜드제품의 영양성분 함량을 계산함. 이러한 두 가지 방법으로 영양성분 정보를 확보하지 못한 582개 품목에 대한 영양성분 정보를 「국가표준식품성분표 10.0」 등의 출처로부터의 수집을 시도한 결과, 총 306개 품목의 정보를 추가로 확보하였음. 최종적으로 998개 품목 중 720개 품목에 대하여 대표브랜드제품(들) 또는 품목의 영양성분 정보를 입력하여 품목 기반 급식식재료DB를 구축하였음.
