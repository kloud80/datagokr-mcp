summary_user: 기능성화장품 보고품목과 관련 업체 정보를 전국 단위로 업체·품목 건별로 담는 API로, 명세상 필드는 업체명, 업종, 업체허가번호, 허가/신고 구분, 관할 식약청, 공장주소, 업체허가일자, 사업자등록번호 등입니다. 소비자나 업계 분석가가 '이 기능성화장품을 만든 제조업자·책임판매업자는 어디이고, 언제 허가받았는가'를 확인하는 데 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않아, 다른 식약처 화장품·업체 데이터와는 업체명이나 업체허가번호, 같은 기관 코드(관할 식약청 코드 등)를 맞춰 연결한다.
description_portal: 식품의약품안전처에서는 다양한 공공데이터 사용자가 기능성화장품의 품목명, 제조업자 및 책임판매업자 현황, 책임판매업등록번호 등의 보고품목정보 및 보고일련번호, 보고일 등의 보고정보 등 기능성화장품 보고품목정보를 신속하게 확인하고 파악할 수 있도록 정보를 제공하고 있습니다. 기능성화장품 보고품목 정보는 소비자가 보다 안전하고 검증된 제품을 선택할 수 있도록 활용할 수 있으며, 소비자 보호 및 국민 보건 향상에 실직적으로 기여할 수 있습니다. 또한 보고된 품목 정보를 기반으로 화장품 시장에 유통되는 기능성화장품의 전반적인 현황을 파악하고 화장품 업계의 제품 정보 등을 확인하여 효율적인 시장 관리 및 건전성을 유지, 품질관리 등에 활용할 수 있습니다. 또한, 개방 데이터는 기능성화장품 산업의 투명성 확보, 제품 신뢰도 향상, 소비자 보호 등 다층적인 기대효과를 창출하는데 기여할 수 있습니다.
