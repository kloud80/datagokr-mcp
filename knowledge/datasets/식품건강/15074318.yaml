summary_user: 식품의 회수·판매중지 조치를 제품 건별로 담은 전국 단위 원천 데이터로, 제품명·회수사유·회수등급·제조업체·바코드·제조일자·유통기한·회수방법 등을 기록한다. 소비자가 "내가 산 이 제품(바코드)이 회수 대상인가"를 확인하거나, 분석가가 회수사유·업체별 회수 이력을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 인허가번호(LCNS_NO)·품목제조보고번호·바코드 같은 같은 기관 코드나 업체명 매핑으로 식품 인허가 업소·행정처분·부적합 데이터와 이어 쓴다.
description_portal: 제품명, 회수사유, 제조업체명, 업체주소, 전화번호, 바코드번호, 포장단위, 제조일자, 회수방법, 유통기한, 식품분류, 제품사진 URL, 품목코드, 등록일, 회수.판매중지 일련번호, 품목제조보고번호, 회수등급, 품목유형(품목코드명) 등의 항목을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
