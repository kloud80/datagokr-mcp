summary_user: 서울 강동구 관내 공중위생업소(미용·이용·숙박·목욕장·세탁업 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·위생업명·사업장명·인허가연도·소재지 면적·도로명/지번 주소를 포함한다. 주민이 '우리 동네 근처 세탁소나 미용실이 어디 있나'를 찾거나, 분석가가 강동구 안 업종별 위생업소 분포와 밀집도를 살펴 상권·점검 계획을 세우는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소를 맞춰 붙이거나 주소를 지오코딩해 연결해야 한다.
description_portal: '서울특별시 강동구 관내에 등록되어 영업 중인 공중위생업소의 전반적인 현황을 제공하는 공공데이터입니다. 본 데이터는 구민의 일상생활 및 보건 위생과 밀접한 관련이 있는 업소들의 업종명, 인허가연도, 사업장명, 영업장 면적, 소재지(주소) 등의 정보를 담고 있습니다.※ 주요 대상 업종: 미용업(헤어, 네일, 피부 등), 이용업, 숙박업, 목욕장업, 세탁업 등 다수인이 이용하는 위생 관리 대상 시설이 자료를 통해 지역 주민들은 거주지 인근의 미용실, 세탁소 등 생활 밀착형 공중위생업소의 위치를 쉽게 파악하여 생활 편의를 높일 수 있습니다.행정기관은 지역 내 공중위생업소의 분포 및 밀집도를 분석하여 효율적인 위생 점검 계획을 수립하고, 공중보건 향상을 위한 정책 자료로 활용할 수 있습니다.  또한, 민간에서는 상권 분석, 서비스 품질 개선, 위생 환경 연구 등 다양한 분야에서 참고할 수 있습니다.'
