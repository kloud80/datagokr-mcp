description_portal: '인천광역시 부평구_건강기능식품일반판매업소 현황부평구 내에서 신고되어 운영 중인 건강기능식품일반판매업소의 연번, 업소명, 소재지(도로명 및 지번), 전화번호 등을 수록한 데이터입니다. 건강기능식품 유통 생태계를 파악하고 유관 기관의 인허가 관리 및 시민들의 안전한 식품 구매 환경 조성을 위한 기초 자료로 활용됩니다.🎯 활용 목적 및 특징유통 안전망 관리 및 점검: 지역별 판매업소 현황을 기반으로 건강기능식품법 준수 여부 점검, 허위·과대광고 지도 단속 등 보건 행정의 효율적인 관리 체계 구축산업 생태계 및 상권 분석: 건강기능식품 판매업의 밀집도를 분석하여 지역별 소비 트렌드를 파악하고, 신규 창업자나 소상공인을 위한 업종 배치 및 입지 선정 데이터로 활용맞춤형 행정 지원 및 홍보: 등록된 업소의 연락처 및 소재지 정보를 바탕으로 법령 개정 사항 안내, 위생 교육 통지, 정부 지원 사업 등 맞춤형 행정 서비스 제공소비자 알권리 및 접근성 강화: 도로명·지번 주소를 포함한 정확한 위치 정보를 제공하여 소비자가 인근의 신뢰할 수 있는 판매업소를 쉽게 찾고 이용할 수 있도록 편의성 제고📊 데이터 항목연번: 데이터의 식별을 위한 일련번호업종명: 해당 업소의 세부 업종 구분 (건강기능식품일반판매업)업소명: 판매업소의 공식 명칭소재지(도로명): 도로명 주소 체계에 따른 업소 위치소재지(지번): 지번 주소 체계에 따른 업소 위치소재지전화: 업소와 연락 가능한 유선 또는 무선 전화번호'
