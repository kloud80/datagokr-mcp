summary_user: 경기도 부천시 관내 식품운반업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·인허가일자·도로명 소재지·우편번호를 포함한다(CSV 약 3.7KB 규모의 소량 목록). 부천시에서 식품을 운반하는 허가 업체가 어디에 몇 곳 있는지 찾거나, 운반업체 분포를 지역 식품 위생·물류 계획의 참고자료로 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 업소명·도로명 주소 문자열 매칭으로만 이어 쓰고, 주소를 지오코딩해 좌표화하거나 전국 식품 인허가 업소 원장과 대조하는 방식이 현실적이다.
description_portal: 경기도 부천시의 식품과 관련하여 부천시 관내 위치한 식품운반업체 현황 데이터를 등록하였습니다.해당 데이터에는 업종명, 업소명, 소재지(도로명), 소재지전화, 우편번호(도로명)등의 내용이 포함되어 있습니다. 이 데이터를 통하여 부천시 식품운반업소에 대한 정보를 쉽게 찾아 이용할 수 있습니다.또한, 식품운반업과 관련한 식품 분석이나 계획에도 참고자료로 활용할 수 있으며, 식품 서비스 품질 향상 및 규제 정책마련에도 활용될 수 있습니다.※ 제공되는 데이터는 등록 변경(신규, 폐업, 변경) 등 처리로 인하여, 별도로 제공되는 데이터와 차이가 있을 수 있습니다.
