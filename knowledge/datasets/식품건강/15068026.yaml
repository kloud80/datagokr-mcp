summary_user: 인천광역시 서구가 외국인 관광객·거주자가 이용하기 편하다고 지정한 음식점을 업소 한 곳당 한 행으로 담은 작은 파일(약 1.3KB)로, 업소명·유형·주메뉴(가격)·소재지·주차대수·전화번호를 담는다. 인천 서구를 찾는 외국인이나 관광 안내 담당자가 '서구에서 외국인이 편하게 갈 수 있는 식당은 어디이고 주메뉴와 가격은 얼마인가'를 확인하는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어서, 식품 인허가 업소 원장이나 위생 지정 데이터와는 업소명과 소재지(주소)를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 외국인 관광객 및 거주자가 편리하게 이용할 수 있도록 지정된 음식점의 정보를 담고 있습니다. 본 자료는 인천광역시 서구 내 외국인 이용이 편리한 음식점의 업소명, 유형, 주메뉴(가격), 소재지, 주차대수 등의 정보를 수록하고 있습니다. 본 데이터를 통해 인천 서구를 방문하는 외국인 관광객들에게 신뢰할 수 있는 식당 정보를 제공하는 동시에, 지역 내 글로벌 관광환경 조성 및 외식업의 경쟁력 제고에 활용될 수 있을것으로 기대가 됩니다. 본 데이터는 연마다 정기적 갱신을 통해 최신정보를 반영하고 있습니다.
