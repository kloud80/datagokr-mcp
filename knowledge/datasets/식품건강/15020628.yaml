summary_user: 화장품 관련 업체를 한 곳씩 담은 건별 데이터로, 업종(제조업·책임판매업 등), 업체명, 허가일자, 본사주소, 사업자등록번호를 전국 범위에서 제공한다. 소비자나 유통업자가 특정 화장품 업체가 언제 허가를 받았고 본사가 어디인지 확인하거나, 분석가가 지역별 화장품 제조·판매업체 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업체명이나 사업자등록번호(BIZRNO) 매핑, 같은 기관의 업체번호로 연결한다.
description_portal: 식품의약품안전처에서는 다양한 데이터 사용자가 화장품 안전성과 품질에 대한 신뢰성 있는 정보를 확인 및 확보하고 시장 동향 등을 파악하는데 활용할 수 있도록 화장품(심사품목,보고품목,제조업, 책임판매업등)의 관련 정보를 제공하고 있습니다. 기능성화장품 심사, 보고 품목과 화장품제조업, 화장품책임판매업 정보 등을 확인하여 화장품과 관련한 안전하고 합리적인 소비를 할 수 있도록 하는 등 소비자 안전성을 강화하고 다양한 분야에서 실질적인 활용과 사회적 가치 창출에 기여할 수 있습니다.
