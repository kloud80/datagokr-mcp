summary_user: 서울 은평구에서 축산물운반업 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일·영업상태·폐업일·도로명주소·중부원점TM 좌표를 포함하며 포털 설명상 2025년 1월 기준 3개소 규모다. 축산물 유통업체나 위생 담당자가 은평구에서 현재 영업 중인 냉장·냉동 축산물 운반업체가 어디인지, 언제 폐업했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 자치구·업종의 식품 인허가 데이터와 같은 컬럼 구조로 합쳐 쓰는 방식이 현실적이다.
description_portal: '은평구의 축산물(식육,원유,식육가공품 등)을 전문적으로 운반하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내 축산물운반업 인허가를 받은 3개소의 운영 현황을 담고 있습니다.축산물운반업이란 「축산물 위생관리법」에 따라 식육, 원유, 식육가공품, 우유, 유제품 등 축산물을 전문적으로 운반하는 업종입니다. 일반 운송업과 달리 냉장·냉동 운반차량과 위생적인 운반시설을 갖추어야 하며, 축산물의 신선도와 안전성을 유지하면서 운반하는 전문 업체들이 해당됩니다.2025년 1월 기준 3개소라는 규모는 상대적으로 적은 수치로, 은평구 내에서 축산물 전문 운반을 담당하는 업체가 제한적임을 보여줍니다. 각 업소의 사업장명, 정확한 도로명 주소, TM 좌표계 위치정보가 상세히 기록되어 있어 축산물 유통망 관리와 위생 감독에 활용됩니다.자동 갱신 시스템으로 운영되어 3일 전 자료를 실시간으로 제공합니다. 이를 통해 신규 업체 등록, 폐업, 주소 변경 등의 변동사항을 신속하게 반영하고 있으며, 축산물 유통 안전관리의 정확성을 높이고 있습니다.HACCP 관리체계와 연계되어 있어 매우 중요한 데이터입니다. 축산물운반업체는 위해요소중점관리기준(HACCP) 적용 의무 대상으로, 운반 과정에서의 온도 관리, 교차오염 방지, 위생적 취급 등 엄격한 기준을 준수해야 합니다.이 데이터는 축산물 유통망 안전관리, 식중독 발생 시 역학조사, 축산물 운반업체 관리감독, 신규 업체 허가 시 검토 자료 등에 활용되며, 축산업계와 유통업체들은 안전한 축산물 운반업체를 확인하는 데 활용할 수 있습니다.'
