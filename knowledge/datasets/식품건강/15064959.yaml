summary_user: 식품위생법 등 식품 관련 법령의 과징금 부과기준을 처분기준명·식품법령·근거법령·위반유형·레벨·유효시작/종료일자 단위로 담은 기준표이며, 전국 단위의 비공간 데이터다. 식품 영업자나 행정·법무 담당자가 특정 위반유형에 어떤 근거법령과 단계(레벨)의 과징금 기준이 적용되고 그 기준이 언제부터 언제까지 유효한지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 행정처분·인허가 업소 데이터와는 위반유형명이나 법령명을 이름으로 맞춰 연결해야 한다.
description_portal: 식품위생법 등 관련 법령의 .과징금 부과기준 관련 정보입니다. 처분기준명 , 식품법령 , 근거법령 , 위반유형 , 레벨 , 유효시작일자 , 유효종료일자의 속성정보를 제공합니다이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
