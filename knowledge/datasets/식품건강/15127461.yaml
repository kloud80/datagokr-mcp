summary_user: 대구광역시 달성군 관내에 지정된 담배소매인을 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업소명·도로명주소·지정일자·법인구분·민원구분·행정동명·위도·경도를 포함한다. 주민·사업자가 '우리 동네에서 합법적으로 담배를 파는 곳이 어디인가'를 확인하거나, 행정·분석가가 청소년 유해환경 관리나 상권 분석을 위해 행정동별 소매인 분포를 볼 때 쓴다. 전역 조인 키나 인허가번호는 없어서 다른 데이터와는 행정동명이나 주소·위경도 좌표로만 맞춰 이어 쓴다.
description_portal: 본 데이터는 대구광역시 달성군 관내에 지정된 담배소매인의 현황 정보를 제공하는 자료입니다. 업소명, 소재지 도로명주소, 지정일자, 법인구분, 민원구분, 행정동명, 위도, 경도, 데이터기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 주민과 사업자는 합법적으로 담배를 판매할 수 있는 지정 소매인의 위치와 분포를 손쉽게 확인할 수 있습니다. 또한 청소년 유해환경 관리, 담배 판매업 인허가 행정, 무허가 판매 단속, 상권 분석 등 다양한 행정 연구 목적으로 활용될 수 있습니다. 데이터는 데이터기준일자를 기준으로 작성되며 신규 지정 취소 등으로 실제 현황과 차이가 있을 수 있으므로 정확한 내용은 관리기관에 문의하시기 바랍니다.
