description_portal: 본 데이터는 인천광역시 미추홀구에 위치한 일반음식점 중에서 업태가 중국요리로 등록된 중식당에 대한 정보를 수록한 자료입니다. 업소명, 도로명 주소, 지번 주소, 업종명 및 업태명 등의 항목으로 구성되어 있으며, 각 업소의 소재지 정보가 도로명 주소와 지번 주소로 병기되어 있어 위치 확인이 용이합니다. 업종명은 ‘일반음식점’으로 통일되어 있고, 업태명은 ‘중국식’으로 구분되어 있어 중식당만을 선별하여 파악하는 데 유리합니다. 이 데이터는 지역 내 중국요리 전문 음식점의 분포 현황을 파악하거나 식문화 지도 제작, 음식업 정책 수립 등에 기초자료로 활용될 수 있으며, 음식점 현행화 기준에 따라 정기적으로 갱신됩니다. 특히 중식당 선호도 분석, 위생등급 연계 검토, 외국인 관광 안내 자료 등 다양한 공공 및 민간 수요에 적합한 형태로 제공됩니다. 자세한 문의사항은 인천 미추홀구청 위생과(032-880-5740)로 연락하시기 바랍니다.
