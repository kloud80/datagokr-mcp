summary_user: 서울특별시 중구의 단란주점영업 인허가 업소를 업소 한 곳당 한 행으로 담은 원장으로, 관리번호·인허가일·영업상태(영업·폐업 등)·폐업일·소재지 주소·중부원점TM 좌표(X, Y)·시설 규모 같은 항목을 포함한다. 단란주점 창업을 준비하는 예비 사업자가 '중구에 영업 중인 단란주점이 어디에 얼마나 몰려 있나'를 확인하거나, 분석가가 유흥 관련 업소의 개업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓰며, 같은 부문의 다른 식품 인허가 업소 데이터와 함께 상권 분석에 쓴다.
description_portal: '서울특별시 중구의 주로 주류와 함께 음식류를 조리 및 판매하는 곳으로 손님이 노래를 부르는 행위가 허용되는 업소 정보입니다. 데이터는 각 단란주점영업 업소에 부여된 관리번호, 현재의 영업 상태(허가, 취소 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 단란주점영업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 유흥 관련 업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 청소년보호 등 법적 준수사항을 이행하며 건전한 유흥 주류판매 환경 조성에 노력하는 업소의 행정처분 및 위반행위 이력을 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
