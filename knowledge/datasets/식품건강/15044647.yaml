description_portal: 해당 데이터는 경상북도 영천시 내 위치한 군장병 할인업소에 대한 정보를 제공하는 자료입니다. 영천시의 다양한 업소들이 군장병 고객에게 할인 혜택을 제공하는 내용을 포함하고 있으며, 업소명, 주소, 전화번호 등의 기본 정보를 상세히 수록하고 있습니다. 이를 통해 지역 경제 활성화와 군인 복지 향상에 기여할 것으로 기대됩니다. 전화번호의 경우 개인 휴대전화 사용한 업체는 공란처리 하였습니다.해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 보건위생과로 연락주시기 바랍니다.
