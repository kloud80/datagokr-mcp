summary_user: 경기도 31개 시군에서 인허가를 받은 키즈카페 형태 일반음식점을 업소 한 곳당 한 행으로 담은 인허가 원장이며, 사업장명·주소·인허가일자·영업상태·폐업일자·시설규모·종업원 수·위경도 좌표를 포함한다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 키즈카페가 어디에 몇 곳 있고, 최근 몇 년간 얼마나 문을 열고 닫았나'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서 경기도 데이터끼리는 시군코드(SIGUN_CD)로, 다른 식품 인허가·위생 데이터와는 사업장명·주소를 맞춰 연결하고, 좌표로 지도 위에 겹쳐 쓴다.
description_portal: 본 데이터는 경기도 내 31개 시군의 인허가를 받은 키즈카페 형태 일반음식점의 현황을 담고 있습니다. 키즈카페란 어린이와 보호자를 대상으로 음식을 제공하며 놀이시설을 갖춘 업소를 의미합니다. 해당 데이터는 시군명, 사업장명, 주소(도로명 및 지번), 인허가일자, 영업상태, 폐업일자, 건물소유구분, 급수시설구분, 위생업종 및 업태명, 총시설규모, 종업원 수, 위도·경도 등 다양한 세부 항목을 포함하고 있어 지역 내 키즈카페 분포 분석, 창업 입지 분석, 어린이시설 위생관리 등에 활용될 수 있습니다. 특히 위치정보(WGS84 좌표계)를 제공하므로 지도 기반의 시각화 및 공간 분석이 용이하며, 주간 단위로 갱신되어 최신 정보를 반영하고 있습니다. 데이터는 행정안전부가 제공하며 지방행정 데이터 개방시스템을 기반으로 구축되었습니다.
