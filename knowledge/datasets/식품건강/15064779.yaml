summary_user: 식품안전 시험항목을 행정표준코드 기준으로 한 건씩 정리한 코드 목록으로, 항목마다 시험항목코드·한글명·영문명·약어·이명, 대분류·중분류 코드와 이름, 잔류물질 정의, 사용여부, 최종수정일시를 담고 범위는 전국·비공간이다. 검사 성적서나 부적합 판정 자료에 나온 시험항목코드나 약어가 어떤 물질이고 어느 분류에 속하는지, 잔류물질이 어떻게 정의되는지 확인하려는 분석가·사업자가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 시험항목코드(TESTITM_CD)나 항목명을 같은 기관의 기준규격·부적합 자료에 이름·코드 매핑으로 이어 쓴다.
description_portal: 식품의약품안전처에서 관리하는 시험항목관련 코드 정보입니다. 행정표준코드에 의한 식품안전시험항목 코드에 대한 시험항목코드 , 한글명 , 영문명 , 약어 , 이명 , 시험항목명 , 시험항목대분류시퀀스 , 시험항목대분류코드 , 대분류한글명 , 시험항목중분류시퀀스 , 시험항목중분류코드 , 중분류한글명 , 잔류물질정의 , 사용여부 , 최종수정일시의 속성정보를 제공합니다. 이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
