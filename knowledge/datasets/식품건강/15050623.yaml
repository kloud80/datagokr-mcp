description_portal: '- 전라남도 내 음식 명가 지정 업소 정보입니다.(목포시, 여수시, 순천시, 나주시, 광양시, 담양군, 곡성군, 구례군, 고흥군, 보성군, 화순군, 장흥군, 강진군 등)- 남도 음식은 전라남도와 전라북도 일대를 중심으로 한 한국 남부지방의 전통 요리로, 풍부한 식재료, 다양한 양념, 정성이 담긴 반찬 수, 화려한 상차림으로 유명합니다.- 남도 음식의 특징- 풍성한 상차림:반찬이 10가지 이상 나오는 경우가 많음- 양념의 깊은 맛:젓갈, 된장, 고추장, 마늘, 들기름, 참기름 등 풍부하게 사용- 제철 식재료 사용: 계절마다 다른 재료로 구성 (봄나물, 여름 해산물 등)- 발효음식 발달: 김치, 장류, 젓갈 등 저장 음식 문화가 활발'
