summary_user: 서울 금천구의 식품판매업(기타) 업소를 업소 1곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·좌표(X, Y)와 종사자 수·시설 규모·임대차 정보 등을 담는다. 창업 예정자나 상권 분석가가 '금천구에서 현재 영업 중인 식품판매업소는 어디에 몇 곳이고 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 찾지 못했으므로, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 잇고, 좌표를 쓰면 지도 위에서 겹쳐 볼 수 있다.
description_portal: 금천구 내 식품판매업(기타) 업소의 인허가 정보를 상세히 제공하는 데이터로, 인허가일자, 영업상태, 폐업 및 휴업 정보, 전화번호, 주소, 사업장명 등 기본 현황과 함께 위생업태, 종사자 수, 시설 규모, 임대차 정보, 전통업소 지정 여부 등 다양한 행정 및 영업 관련 세부 항목을 포함합니다. 이를 통해 식품판매업의 지역별 분포와 운영 현황, 영업 형태 변화를 체계적으로 파악할 수 있습니다. 해당 자료는 업소 관리, 정책 수립, 상권 분석, 창업 지원, 영업 동향 연구, 위생 관리 강화 등 폭넓은 분야에서 활용 가능하며, 특히 지역 경제 활성화와 소비자 안전 확보를 위한 전략 마련에도 중요한 기초 자료로 기능합니다.
