summary_user: 식품 등을 수입·판매하려고 시설을 갖추고 허가를 받은 전국 수입판매업체를 업소 한 곳당 한 건으로 담고, 인허가번호·업소명·대표자·업종·허가일자·전화번호·소재지 주소·관할기관을 포함한다. 수입식품을 거래하려는 사업자나 소비자가 '이 수입업체가 실제로 허가받은 곳인지, 언제 허가받았고 어디에 있는지'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 수입신고·회수·행정처분 데이터와는 인허가번호(LCNS_NO)나 업소명·주소를 맞춰 보는 방식으로만 잇는다.
description_portal: 식품의약품안전처에서 제공하는 식품 등 수입판매업 관련 정보 자료입니다. 수입식품 등을 수입, 판매하려 할 때 필요한 시설을 갖추고 허가를 받은 수입판매업체에 대한 속성정보를 제공합니다. 인허가 번호 , 업소명 , 대표자명 , 업종 , 허가일자 , 전화번호 , 주소 , 기관명의 속성정보를 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.
