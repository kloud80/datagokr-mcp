summary_user: 서울특별시 마포구 관내 이용업소(이발소 등)의 인허가 정보를 업소별 건으로 담으며, 인허가일자·영업상태·폐업일자·주소·좌표·건물 층수·종사자 수·의자 수 등을 포함한다. 주민이나 분석가가 '마포구에서 지금 영업 중인 이발소는 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 개방자치단체코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울특별시 마포구의 이발소와 같이 머리 또는 수염을 깎거나 다듬는 등의 방법으로 용모를 단정하게 하는 업소 정보에 대한 설명입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민 및 행정기관은 관내 이용업소의 위치와 서비스·운영 현황을 쉽게 파악하고, 위생·안전·소비자 보호 정책 및 서비스 품질 향상에 활용할 수 있습니다.
