summary_user: 경기도 양주시 관내 식품접객업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명(일반음식점·휴게음식점·제과점·단란주점·유흥주점·위탁급식)과 업소명, 도로명·지번 소재지, 데이터기준일자를 담는다. 창업 예정자나 상권 분석가가 "양주시 어느 동네에 일반음식점·카페가 몰려 있고 경쟁 업소는 몇 곳인가" 같은 질문에 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없어서, 다른 데이터와는 업소명·주소 매칭이나 같은 기관(양주시) 기준으로만 이어 쓴다.
description_portal: 관내 식품위생업소 중 식품접객업소 현황에 대한 데이터로 업종명, 업소명, 주소, 전화번호, 등의 항목을 제공합니다.업종의 경우, 단란주점, 위탁급식영업, 유흥주점영업, 일반음식점, 제과점영업, 휴게음식점으로 구분됩니다.
