summary_user: 축산물 집유업으로 영업허가를 받은 전국 업체를 한 건씩 담은 허가대장으로, 인허가번호·업소명·대표자명·영업상태·허가일자·폐업일자·휴업기간·소재지 주소·관할 기관명을 담는다. 원유를 모아 공급하는 집유업체가 어느 지역에 몇 곳 영업 중인지, 특정 업체가 휴·폐업했는지를 확인하려는 사업자나 식품안전 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소 매칭이나 인허가번호(LCNS_NO)를 같은 기관 데이터 안에서 맞춰 보는 방식으로만 잇는다.
description_portal: 축산물 집유업 영업허가대장 관련 정보로 축산물 집유업으로 영업허가를 받은 업체에 대한 속성정보 제공합니다. 속성정보로는 인허가 번호 , 업소명 , 대표자명 , 업종 , 영업상태 , 허가일자 , 폐업 일자 , 휴업시작일자 , 휴업종료일자 , 주소 , 기관명이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
