summary_user: 대구광역시 서구 관할에 등록된 즉석판매제조가공업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 37KB)로, 업소명·도로명/지번 주소·전화번호·데이터 기준일자를 담는다. 주민이나 사업자가 "서구 안에서 반찬·떡 등을 직접 만들어 파는 즉석판매제조가공업소가 어디에 있나"를 확인하거나, 분석가가 동네별 업소 분포를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 연결해야 한다.
description_portal: 본 데이터는 대구광역시 서구 관할 구역 내 식품위생법 및 관련 시행령에 따라 정식 등록된 즉석판매제조가공업소 현황을 상세히 제공한다. 즉석판매제조가공업은 총리령으로 정한 식품을 직접 제조·가공하여 최종 소비자에게 판매하는 영업 형태로, 안전하고 위생적인 식품 유통 관리가 핵심이다. 데이터에는 업소명, 도로명 및 지번 주소, 연락처, 그리고 데이터 기준일자가 포함되어 있으며, 주소는 최신 행정구역 기준에 따라 이원화 표기함으로써 사용자의 정보 접근성과 활용도를 극대화하였다. 본 자료는 민원 상담, 정책 기획, 지역 식품위생 관리 강화, 그리고 관련 산업 연구 등의 다양한 행정 및 민간 목적에 활용 가능하다. 대구 서구 내 식품 제조·가공업소 위치 및 운영 실태를 한눈에 확인할 수 있도록 체계적으로 구성되었다.
