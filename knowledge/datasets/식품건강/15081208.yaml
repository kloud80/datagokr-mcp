summary_user: 인천광역시 서해구(포털 설명상 서구) 안의 음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·인허가일자·업소명·도로명/지번 주소를 수록하며 일반음식점부터 유흥주점까지 여러 업종을 포함한다. 창업 예정자나 상권 분석가가 '서구 특정 동네에 어떤 업종 음식점이 언제 인허가를 받아 얼마나 몰려 있는가'를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없으므로 다른 데이터와는 주소를 지오코딩하거나 업소명·주소 문자열로 맞춰 연결해야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 음식점의 정보를 담고 있습니다. 본 자료는 인천광역시 서구 내 음식점의 업종, 인허가일자, 업소명, 도로명주소, 지번주소 등의 정보를 수록하고 있습니다. 유흥주점과 일반음식점 등 다양한 형태의 음식점 현황이 정리되어 있습니다. 본 데이터는 식품위생 관리 및 민원 응대, 정책 수립 등을 위한 기초자료로도 활용될 수 있습니다. 또한 주소가 포함되어 있어 위치기반 정보 분석에도 유용할것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
