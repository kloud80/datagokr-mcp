summary_user: 서울특별시 중구에서 직접 제조하지 않고 위탁 생산한 식품을 판매업소에 유통하는 유통전문판매업소를 업소별로 담은 인허가 원장으로, 관리번호·인허가일·영업상태(영업·폐업 등)·폐업일·지번/도로명 주소·업소명·중부원점TM 좌표 등을 담는다. 유통전문판매업 창업을 검토하는 예비 사업자가 중구 안에 영업 중인 업체가 몇 곳이고 어디에 몰려 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OGDP_INST_CD)로만 연결하며, 다른 식품 인허가 업종 데이터와 같은 구조라 함께 묶어 상권 분석에 쓴다.
description_portal: '서울특별시 중구의 직접 제조하지 않고 식가공류 제공을 위해 판매업소에 유통하는 업소 정보입니다. 데이터는 각 유통전문판매업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 유통전문판매업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 OEM 위탁 판매업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 OEM 생산 제품에 대한 책임 소재와 상표 관리 실태를 투명하게 확인할 수 있도록 지원하여 식품안전 확보 및 소비자 신뢰 증진에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
