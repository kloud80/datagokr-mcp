summary_user: 인천광역시 영종구(포털 설명상 중구) 관내 식품소분업 업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호·데이터기준일자를 수록하며 포털 설명상 약 100개 업소 규모다. 영종 지역에서 식품을 소분해 판매하는 업소가 어디에 있는지 찾으려는 주민·사업자나, 지역 식품업소 분포를 보려는 분석가가 쓴다. 인허가번호나 행정코드 같은 전역 조인 키가 없어서, 다른 식품 인허가·위생 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와 붙이려면 업소명·주소 문자열을 매칭해야 하고, 좌표가 없으므로 지도에 올리려면 주소를 따로 지오코딩해야 한다. 전화번호는 개인정보·미등록 사유로 일부가 비어 있다.
