summary_user: 인천광역시 영종구(포털 설명상 중구)에 있는 식품제조가공업 업소를 한 곳씩 담은 건별 원장으로, 업종명·업소명·소재지·전화번호를 담는다(CSV 약 10KB). 지역 식품 제조·가공 업체가 어디에 몇 곳 있는지, 특정 업소의 소재지와 연락처가 무엇인지 확인하려는 주민·사업자·위생 담당자가 쓴다. 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 이어 쓴다.
description_portal: '인천광역시 중구 식품제조가공업에 대한 데이터입니다.식품제조가공업 데이터는 식품을 제조·가공하는 업체에 대한 정보를 담은 자료로, 업소명, 소재지, 업태 및 종목 등의 항목으로 구성되어 있습니다. 이 데이터는 식품산업의 현황을 파악하고, 식품안전 관리, 식품 위생 감독, 지역 산업분석 및 정책 수립 등에 활용됩니다. 또한 제조업체의 분포와 규모를 통해 지역경제와의 연관성을 분석하거나, 식품 관련 사고 예방 및 신속한 대응 체계를 마련하는 데에도 중요한 자료로 사용됩니다.담당부서: 인천광역시 중구청 위생환경과(1청사 원도심), 친환경위생과(2청사 영종)'
