summary_user: 서울 강서구에서 자동판매기로 식품을 파는 업소의 인허가 내역을 업소 한 건씩 담은 원장으로, 인허가일자·영업상태·폐업일자·사업장명·지번/도로명 주소·전화번호·좌표(X, Y) 등을 포함한다. 강서구 안에서 지금 영업 중인 식품자동판매기 업소가 어디에 몇 곳 있는지, 언제 인허가를 받거나 폐업했는지 확인하려는 주민·사업자·위생 담당자가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 관리번호(MGTNO)·사업장명·주소를 이름 매칭하거나 같은 기관 코드(OPNSFTEAMCODE)로 묶어 다른 식품 인허가·위생 데이터와 이어 쓴다.
description_portal: 서울특별시 강서구 관내에서 식품을 자동판매기를 통해 판매하는 업소의 인허가 현황을 정리한 데이터입니다. 해당 정보는 자동판매기 운영업체에 대한 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등을 포함하고 있으며, 무인식품판매 방식이 보편화됨에 따라 자동판매기 업소에 대한 수요와 관리 필요성이 증가하고 있습니다. 특히 편의성과 접근성이 강조되는 현대 소비 환경에서 자동판매기는 다양한 식품을 빠르게 제공하는 수단으로 활용되고 있으며, 안전하고 위생적인 운영을 위한 규제와 모니터링이 필수적입니다. 이 데이터는 지자체의 식품안전 관리뿐 아니라 유통경로 추적, 무인판매 인프라 분석, 식품위생 정책 수립 등에도 유용하게 활용될 수 있습니다.
