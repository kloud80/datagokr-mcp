summary_user: 학교와 학교 주변 200m 범위로 지정된 어린이 식품안전보호구역의 관리 현황을 전국 범위로 담으며, 필드 이름으로 보면 보호구역명·학교명·지정일자·관할기관과 구역 안 업소의 이름·업종·주소가 업소 단위로 들어 있는 것으로 보인다. 학부모나 지역 분석가가 특정 학교 주변 보호구역에 어떤 식품 업소가 있는지, 지역별로 보호구역 안 업종 구성이 어떤지 확인하는 데 쓴다. 전역 조인 키는 없어 학교명·주소 같은 이름 매핑이나 같은 기관의 업소 번호(BSSH_NO)로 식품 인허가 업소·행정처분 데이터와 맞춰 보는 방식으로만 연결한다.
description_portal: 어린이 식품안전보호구역 관리 현황 관련 정보입니다. 학부모의 보호가 미치기 어려운 학교주변 식품 판매 환경을 개선하여 어린이의 안전하고 균형 잡힌 식생활이 가능하도록 학교와학교주변 200m 범위를 '어린이 식품안전보호구역'으로 지정하여 관리하고 있습니다. 이 자료를 통하여 경제적으로는 데이터 산업 활성화를 통한 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
