summary_user: 경기도 내 도축장에서 생산된 축산물의 미생물 검사 결과를 집계년도·검사년월·축종·세균 구분(일반세균, 대장균, 살모넬라 등)·세균 분포 구간별 검사결과 수로 담은 집계 자료다. 지자체·연구자가 '경기도 도축장에서 소·돼지·닭 중 어느 축종에서 대장균이나 살모넬라 검출 분포가 높게 나타나는가'처럼 도축 단계 위생 수준을 연도·월별로 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 축종명·세균명 같은 이름 매핑이나 검사년월 기준으로만 붙여 쓴다.
description_portal: 이 데이터는 경기도 내 도축장에서 생산되는 축산물의 미생물 검사 결과 현황을 제공하는 자료로, 도축장 위생관리 수준과 환경개선을 통해 먹을거리 안전성을 확보하기 위해 구축되었습니다. 주요 항목으로는 집계년도(SUM_YY), 축종명(LVSTCKIND_NM), 세균구분명(BACIL_DIV_NM), 검사년월(INSPECT_YM), 검사세균분포구분명(INSPECT_BACIL_DISTRB_DIV_NM), 검사결과수(INSPECT_RESLT_CNT)가 포함됩니다.이 데이터는 일반세균, 대장균, 살모넬라 등 주요 병원성 세균의 분포 현황을 파악할 수 있으며, HACCP(위해요소중점관리기준) 기반 축산물 안전관리 체계 강화에 활용될 수 있습니다. 또한 지자체와 연구기관은 이를 토대로 축산물 생산단계의 위생 관리 수준을 평가하거나 미생물 오염 방지 정책 수립에 참고할 수 있습니다. 소비자 측면에서는 안전축산물 공급을 위한 과학적 근거자료로 활용될 수 있습니다.
