description_portal: '○ 통계개요* 통계명 : 식품위생업체 및 위반건수* 통계종류 : 서울시 식품위생업체 및 위반건수 현황을 제공하는 일반·보고통계* 작성목적 : 식품위생관련 업체수를 파악하여 식품안전관리 정책수립 등에 기초자료로 활용* 조사체계 : 시·군·구 → 시·도 → 식품의약품안전처* 보고방법 : 영업신고(허가)내역 조회* 공표주기 : 정기(매년 12월 31일 기준)* 공표범위 : 지역 - 서울시내용 - 식품위생관련업체수 및 위반건수 현황○ 용어설명* 식품제조·가공업체 : 식품을 제조, 가공하는 영업(식품위새업 시행령 제21조)* 즉석판매제조·가공업체 : 총리령으로 정하는 식품을 제조·가공업소 내에서 직접최종소비자에게 판매하는 영업* 식품판매업체 : 식품얼음판매업, 식품자동판매기영업, 유통전문판매업, 식품등수입판매업, 집단급식소식품판매업, 기타식품판매업* 기타 식품위생관련업체 : 집단급식소, 식품첨가물제조업체, 식품소분업체, 식품운반업체, 식품보존업체, 용기·포장류제조업체○ 기 타* 식품위생업체에 식품접객업체는 제외됨* 식품제조가공업체에 축산물가공업체 제외* 2016년부터 식품판매업의 식품등 수입판매업 영업신고 업무가 수입식품안전관리특별법에 따라 수입식품등 수입판매업으로 통합○ 출 처 : 식품의약품안전처 「식품의약품통계연보」'
