summary_user: 전라남도 강진군 안의 공중위생업소(숙박업·미용업·목욕장업 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호가 들어 있다. 주민이나 분석가가 "강진군에서 영업 중인 미용실이나 목욕탕은 어디이고 연락처는 무엇인가"를 확인하거나 군 단위 위생업소 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매칭이나 같은 기관 기준으로만 연결하고, 식품 인허가 업소 등 식품 관련 데이터와는 별개로 다룬다.
description_portal: 해당 데이터는 전라남도 강진군 내 공중위생업소의 현황을 나타낸 자료로, 업종명, 업소명, 영업소 주소(도로명), 소재지 전화번호 등의 항목으로 구성되어 있습니다. 업종명은 ‘숙박업(일반)’, ‘미용업’, ‘목욕장업’ 등 다양한 위생 관련 업종을 포함하며, 각 업소별로 사업장 명칭과 상세 주소, 전화번호가 함께 기재되어 있어 지역 내 위생업소의 위치 및 연락처 파악에 유용합니다.  해당 정보는 위생관리, 민원 대응, 정책 수립 등에 활용될 수 있습니다. 데이터는 정기적으로 갱신되며, 지역 공중위생 향상을 위한 기초 자료로서의 역할을 수행합니다.
