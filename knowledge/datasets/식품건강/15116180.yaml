summary_user: 서울특별시 중구의 대중목욕탕·찜질방·사우나 등 목욕장업 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호, 사업장명, 소재지·도로명 주소, 영업상태, 인허가·폐업일자, 시설면적, 건물 층수, 욕실 수, 발한실 여부 등을 포함한다. 주민이 중구에서 지금 영업 중인 찜질방이나 목욕탕의 위치와 규모를 찾거나, 분석가가 중구 목욕장의 개·폐업 추이와 영업상태 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 개방자치단체 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중구의 대중목욕탕, 찜질방, 사우나 등 물로 목욕 할 수 있거나 맥반석ㆍ황토 등에게 발생되는 열기 또는 원적외선 등을 이용하여 땀을 낼 수 있는 시설 및 설비 등의 서비스를 제공하는 업소 정보입니다. 해당 데이터에는 관리번호, 사업장명, 소재지 주소, 영업상태, 시설면적, 인허가일자, 건물층수 등의 항목이 포함되어 있습니다. 이를 통해 시민은 주변 시설의 위치와 운영 정보를 쉽게 확인할 수 있으며, 관계 기관은 위생 관리와 안전 점검, 정책 수립에 활용할 수 있습니다. 수질관리와 위생점검 정보는 이용자의 건강과 안전을 보장하는 데 중요한 자료입니다. 또한 시설면적과 영업형태 정보는 서비스 수준과 시설 특성을 이해하는 데 도움을 줍니다. 본 데이터는 정기적으로 갱신되어 최신 정보를 반영하며, 누구나 공공데이터포털을 통해 열람하고 활용할 수 있습니다. 이를 통해 지역사회 위생 수준 향상과 주민 편의 증진에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
