summary_user: 대구광역시에 신고된 유흥주점을 업소 단위로 담은 현황 파일로, 업소명·업종·업소주소를 싣고 1,169건 전체가 시도 범위로 들어 있다. 대구 지역 유흥주점이 어디에 얼마나 있는지 알고 싶은 시민이나 상권·입지 분석가가 구·군별 분포를 볼 때 쓴다. 업소주소(address)를 조인 키로 삼아 같은 키를 가진 다른 식품 인허가 업소 데이터나 주소 기반 지역 데이터와 이어 쓴다.
description_portal: 대구광역시에 신고된 유흥주점 현황 관련 데이터입니다. 유흥주점은 「식품위생법」 제37조 및 같은 법 시행령 제23조에 따라 영업허가를 하여야 하는 업종으로, 유흥주점 영업을 하려고 하는 자는 시행규칙 제36조 [별표14]에서 정하는 시설을 갖춘 후 [별지 제30호 서식]에 따른 식품 영업 허가서를 작성하여 영업을 하고자 하는 지역의 시·군·구청장에게 허가를 득하여야 합니다. 또한 영업을 하려는 자는 같은 법 제44조에서 정한 영업자 준수사항을 지켜야 하며, 불이행 시  시행규칙 제89조 기준에 따른 행정처분 및  법 제101조에 따른 과태료 처분을 받게 됩니다.해당 데이터는 각 구·군별 업소명 및  주소가 포함되어 있으나 소재지 이전 및 폐업 등 변경사항이 발생하였을 수도 있으니 이용 시 확인하시기를 권장드립니다.
