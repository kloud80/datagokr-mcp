summary_user: 식품관련 법령의 과태료 부과기준을 처분기준코드·처분기준명 단위로 담은 기준표로, 기준별 레벨, 근거법령, 위반유형, 유효시작·종료일자를 함께 담고 범위는 전국·비공간이다. 식품 영업자나 분석가가 '어떤 위반유형에 어떤 법령 근거로 과태료 기준이 정해져 있고, 그 기준이 언제부터 언제까지 유효한가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 행정처분·부적합 같은 식품안전 정보와는 처분기준명(DSPS_STDR_CD_NM)이나 위반유형 이름을 맞추거나 같은 기관(식품안전나라) 처분기준코드로만 이어 쓴다.
description_portal: 식품관련 법령의 과태료 부과기준 관련 정보입니다. 처분기준코드 , 처분기준명 , 레벨 , 근거법령 , 위반유형 , 유효시작일자 , 유효종료일자의 속성정보를 제공합니다.이 자료를 통하여 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
