summary_user: 건강기능식품 제품별로 표시된 영양성분과 식약처 식품영양성분 데이터베이스의 건강기능식품 영양성분을 담은 건별 표준데이터로, 식품코드·식품명·분류(대·중·소·세분류)와 에너지·단백질·당류·나트륨·비타민 등 영양성분 값, 1회 분량과 출처를 함께 담고 범위는 전국이다. 소비자나 영양 분석가가 '이 건강기능식품 1회 섭취 시 당류·나트륨·비타민 D는 얼마인가'를 확인하거나 제품군끼리 영양성분을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 식품명·제조사명이나 기관 자체 코드(식품코드·분류코드)로 맞춰 연결해야 하며, 품목제조신고번호가 채워져 있으면 식품 품목제조보고·인허가 업소·회수/행정처분 데이터와 제품 단위로 잇는 데 쓴다.
