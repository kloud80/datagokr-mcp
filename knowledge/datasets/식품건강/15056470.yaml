summary_user: 충청북도가 충북 쌀로 지은 밥맛 좋은 업소로 지정한 음식점을 업소 한 곳당 한 행으로 담은 명단으로, 업소명·시군명·세부주소·메뉴가 들어 있으며 포털 설명상 2013~2022년 지정분 144개소다. 충북을 찾는 여행자나 지역 관광 담당자가 '이 시군에서 도가 인정한 밥집은 어디이고 무엇을 파나'를 확인하는 데 쓴다. 전역 조인 키나 인허가번호가 없어 식품 인허가 업소 원장이나 위생등급 자료와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 실측 컬럼에 인허가번호·사업자번호 같은 공통 키가 없어 다른 업소 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 포털 설명에 따르면 밥맛 좋은 집은 더 이상 신규 지정이 없어 명단이 새로 늘지 않으며, 현재 영업 여부는 이 파일로 확인할 수 없다.
