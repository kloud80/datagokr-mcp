summary_user: 청주시 일반음식점을 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·업소명·도로명/지번 소재지·전화번호·업태명을 담으며 범위는 청주시 한 곳이다. 상권 분석가나 창업 예정자가 "청주시 어느 동네에 어떤 업태(한식·카페 등)의 일반음식점이 몰려 있는가"를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 주소 지오코딩으로만 잇는다.
limits: 실측 컬럼에 전역 조인 키가 없어 전국 식품 인허가 원장이나 행정처분 데이터와 바로 붙이지 못하고 이름·주소 매칭에 의존해야 한다. 좌표가 없고 인허가일·폐업 여부 필드도 없어 지도 표시에는 주소 변환이 필요하고, 개업·폐업 추이는 알 수 없다.
