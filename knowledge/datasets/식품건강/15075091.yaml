summary_user: 인천광역시 영종구(포털 설명상 옛 중구) 관할에서 음식점 위생등급을 지정받은 업소를 업소 한 곳당 한 행으로 담은 CSV 파일(약 63KB)로, 업소명·소재지 주소·업종명·지정시작일·지정종료일을 담는다. 주민이나 관광객이 '영종도·중구 일대에서 위생등급을 받은 식당이 어디이고 지정이 아직 유효한가'를 확인하거나, 분석가가 지역 내 위생등급 지정 현황을 살펴보는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장 등과는 업소명·주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
limits: 실측 컬럼에 인허가번호 등 공통 키가 없어 다른 데이터와의 연결은 업소명·주소 매칭에 의존하므로 오매칭에 주의해야 한다. 범위는 한 시군구에 한정되며, 위생등급 구분(매우우수·우수·좋음) 컬럼은 필드 목록에 보이지 않는다.
