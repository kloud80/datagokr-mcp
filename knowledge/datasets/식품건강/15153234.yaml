summary_user: 식품의약품안전처의 어린이식품안전보호구역 관리현황을 지정 구역마다 담은 전국 범위 데이터로, 관할기관명·학교명·보호구역 지정명·주소·지정일자를 포함하며 좌표는 없습니다. 학부모나 학교 관계자가 우리 아이 학교 주변이 식품안전보호구역으로 지정됐는지, 언제 지정됐고 관할기관이 어디인지 확인하는 데 쓴다. 전역 조인 키와 품목제조보고번호 같은 제품 단위 키가 없어, 다른 데이터와는 학교명·주소·관할기관명을 이름으로 맞춰 식품 인허가 업소나 위생 지정 데이터 등과 연결해야 한다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 어린이식품안전보호구역관리현황 정보입니다.\""
