summary_user: 서울특별시 강북구에서 집단급식소 운영 업체와 계약해 음식을 조리·제공하는 위탁급식영업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 영업 중인 곳과 폐업한 곳을 함께 담고 인허가일·영업상태·폐업일·주소·중부원점TM 좌표(X, Y)·종업원 수·시설 규모를 포함한다. 급식 위탁업체를 찾는 학교·기관 담당자나 분석가가 "강북구에서 현재 영업 중인 위탁급식업체는 어디이고 언제 인허가를 받았나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구의 같은 형식 인허가 데이터나 다른 식품 업종 데이터와는 관리번호(MGTNO)·자치단체코드(OPNSFTEAMCODE)·업소명·주소를 맞춰 연결한다.
description_portal: '서울특별시 강북구 위탁급식영업 인허가 정보 데이터는 강북구의 집단급식소를 설치 및 운영하는 업체와 계약에 따라 해당 집단급식소에서 음식류를 조리하여 제공하는 업소정보입니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
