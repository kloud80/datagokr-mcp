summary_user: 경기도 안의 식육포장처리업체(포장육 제조·유통 업소)를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·소재지 면적·도로명/지번 주소·위경도 좌표·축산고유번호를 포함한다. 축산물 위생 담당자나 분석가가 '우리 시군에서 지금 영업 중인 식육포장처리업체는 어디에 몇 곳이 있나'를 확인하거나, 축산물 유통업체 분포를 지도에 그리는 데 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)나 주소·좌표, 사업장명, 축산고유번호로 다른 식품 인허가·행정처분 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 식육포장 처리업체 현황을 제공하며, 포장육(식육을 절단하여 판매용으로 포장한 제품)을 제조·유통하는 업체에 대한 정보를 담고 있습니다. 항목에는 사업장명, 인허가일자 및 취소일자, 영업상태, 폐업일자, 총 종업원 수, 소재지 주소(도로명 및 지번), 우편번호, 위경도 좌표(WGS84 기준), 소재지 면적, 축산업무 및 축산물가공업 구분, 축산고유번호, 권리주체고유번호 등 다양한 세부사항이 포함됩니다. 해당 데이터는 축산물 유통망 분석, 식육가공품 안전관리, 유통업체 분포 파악 등 축산물 위생과 정책 수립에 활용될 수 있으며, 주간 단위로 갱신되며 Open API를 통해 접근 가능합니다.
