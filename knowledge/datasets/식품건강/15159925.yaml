description_portal: 본 데이터는 관내 아동과 부모 등 가족 구성원 모두가 안심하고 편안하게 외식을 즐길 수 있도록 지정·운영 중인 ‘아동친화 음식점’의 현황 정보입니다. 2024년부터 양육 친화적인 사회 분위기 조성을 목적으로 추진되었으며, 아이 전용 편의 시설과 안전한 이용 환경을 갖춘 업소들을 대상으로 선정하였습니다.본 자료는 영유아 동반 가족들이 방문 계획을 세우는 데 실질적인 도움이 되도록 지정연도, 업체명, 행정동, 상세 소재지 주소와 함께, 해당 업소에서 제공하는 어린이 메뉴 정보를 포함하고 있습니다. 영유아를 동반한 시민과 관광객에게 맞춤형 외식 정보를 제공하여 이용 편의를 높이는 데 기여할 뿐만 아니라, 지역 내 아동 복지 인프라 분석 및 가족 친화 정책 수립을 위한 기초 자료로 다양하게 활용될 수 있습니다.
legal_basis_portal: 2024년도 부터 지정된 아동친화 음식점을 관리하기 위해 매년 현황화하여 관리하고 있습니다.
