summary_user: 식품 이력추적관리 대상 수입식품의 수입이력을 이력추적관리번호 단위로 담은 API로, 업체코드·등록증번호·수입업체명·수입신고기관명·로트 마스터 여부 같은 속성을 제공하며 범위는 전국·비공간이다. 소비자나 유통·회수 담당자가 특정 이력추적관리번호의 수입식품을 어느 업체가 수입했고 어느 기관에 수입신고했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 데이터와는 식품이력추적관리번호(FOOD_HISTRACE_NUM)·업체코드·등록증번호를 같은 기관의 이력추적 계열 데이터와 맞추거나 업체명으로 매핑해 잇는다.
description_portal: 식품의약품안전처에서는 안전한 식품선택을 위한 소비자의 알 권리를 보장하고, 식품의 안전성 확보를 위한 신속한 유통차단과 회수조치를 위해제조·가공단계부터 판매단계까지 각 단계별로 이력추적정보를 기록·관리하여 정보를 제공하고 있습니다.해당데이터는 식품 이력추적제품 수입 이력에 대한 업체코드,등록증번호,식품이력추적관리번호,수입신고기관,수입신고기관명,PDTLOT 마스터 여부에 대한 속성정보 등수입식품의 수입이력에 대해 공개된 세부 정보를 확인할 수 있습니다.
