summary_user: 전북특별자치도 정읍시에 있는 식품소분업소를 업소별로 한 줄씩 담은 현황 파일로, 업소명·도로명주소·지번주소·연락처와 데이터기준일자를 담는다. 정읍시에서 식품을 소분해 판매하는 업소가 어디에 있고 연락처가 무엇인지 찾거나, 지역 식품 유통업소 분포를 보는 데 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)가 없어서 다른 식품 인허가·위생 데이터와는 업소명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전북특별자치도 정읍시에 소재한  소재 식품소분업소 현황 중 업소명, 도로명주소, 지번주소, 소재지연락처의 정보를 제공합니다.정읍시 식품소분업소 현황 데이터 개방은 위생·안전 관리 체계를 강화하고 식품 유통 경로의 투명성을 높여 신뢰도를 향상시킬 것입니다.또한 민간 및 기업과 지자체, 공공 기관이 식품소분업 관련 업무 효율화를 위한 정책과 서비스를 개발하도록 지원해 지역 식품 산업 경쟁력을 높일 것으로 기대됩니다.기타 궁금한 사항은 담당 부서인 정읍시 보건소로 문의하시기 바랍니다.
