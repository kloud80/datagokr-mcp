summary_user: 서울 성동구 안에서 감염병·세균·해충 소독을 하는 소독업(방역업) 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·취소일·영업상태·폐업일·주소·좌표와 함께 분무기·소독차량 차고 면적 같은 보유 장비 수량을 담는다. 시민이나 보건 담당자가 "성동구에서 지금 영업 중인 소독업체는 어디이고 어떤 장비를 갖췄나"를 확인하거나 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 자치구 소독업 데이터와는 같은 컬럼 구조와 자치단체코드(OPNSFTEAMCODE)로 이어 붙이고, 그 밖의 데이터와는 업소명·주소 매칭이나 좌표로 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 전염병과 각종 세균, 유해 해충의 소독을 주요 목적으로 설립·운영되는 방역업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 감염병 예방과 도시 위생 환경의 유지·개선을 위한 방역 서비스의 수요 증대에 따라, 관련 업소의 인허가 및 행정 이력 관리가 중요해지고 있습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 핵심적인 행정 정보가 포함되어 각 업소의 설립·변경·폐업 및 영업상태를 명확히 확인할 수 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현장점검 및 자료 갱신을 실시하여 데이터의 신뢰성과 최신성을 확보하고 있습니다. 이 데이터는 방역업소 모니터링, 감염병 대응 정책 수립, 도시 위생관리, 업계 동향 분석, 소비자 정보 제공 등 다양한 분야에서 활용될 수 있습니다. 방역업계, 보건당국, 연구자, 시민 모두가 객관적이고 신뢰할 수 있는 자료로 활용할 수 있으며, 데이터는 지속적으로 최신 정보를 반영해 갱신됩니다.
