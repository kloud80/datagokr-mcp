summary_user: HACCP 인증을 받은 젖소 사육 농가를 농가 한 곳당 한 행으로 담은 건별 목록으로, 관할지원·업체명·업종·축종·HACCP 인증번호를 담는다(전국 범위, csv 약 6.5KB). 낙농가나 유업체, 분석가가 '어느 지원 관할에 HACCP 인증 젖소농장이 몇 곳 있고 인증번호는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명 매칭이나 같은 기관의 인증번호 체계로만 이어 쓴다.
description_portal: "\uFEFF(HACCP인증 젖소농가  현황 정보 제공 서비스) 관할지원, 업종(가축사육업 등), 축종(젖소 등), HACCP인증번호 등에 대한 정보를 제공하고 있습니다. 관할지원(서울, 경인, 부산, 대구, 광주, 대전)별 HACCP인증 젖소농장에 대한 정보입니다. 인증업체별 HACCP인증번호 정보를 제공합니다.HACCP은 식품의 원재료부터 제조, 가공, 보존, 유통, 조리단계를 거쳐 최종소비자가 섭취하기 전까지의 각 단계에서 발생할 우려가 있는 위해요소를 규명하고, 이를 중점적으로 관리하기 위한 중요관리점을 결정하여 자율적이며 체계적이고 효율적인 관리로 식품의 안전성을 확보하기 위한 과학적인 위생관리체계라고 할 수 있습니다. HACCP은 전 세계적으로 가장 효과적이고 효율적인 식품 안전 관리 체계로 인정받고 있으며, 미국, 일본, 유럽연합, 국제기구(Codex, WHO, FAO) 등에서도 모든 식품에 해썹를 적용할 것을 적극 권장하고 있습니다."
