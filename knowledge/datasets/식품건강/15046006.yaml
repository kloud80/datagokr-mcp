description_portal: 서울시 위생처리업 현황 데이터는 서울시에 신고·허가된 위생처리업 업소의 기본 정보와 영업·시설 현황을 종합적으로 파악하기 위한 자료입니다. 시군구코드, 업종코드, 업종명, 업소일련번호, 업소명, 신고일자, 영업자시작일, 법인명, 행정동명, 폐업일자, 업태명 등 행정적·업종 관련 정보를 포함하고 있으며, 영업장면적, 객실수, 한실수, 양실수, 의자수, 욕실수, 발한실 여부, 세탁기 수 등 업소의 시설 규모와 구조를 보여주는 항목도 함께 제공합니다. 또한 소재지 도로명 주소와 지번 주소, 전화번호, 허가(신고)번호, 위생교육 수료일자, 내외국인 구분 및 국적 정보 등을 통해 업소별 특성과 운영 주체를 세부적으로 파악할 수 있습니다. 이 데이터는 자치구·행정동 단위 위생처리업 분포 현황 분석, 영업 지속 및 폐업 추이 파악, 시설 및 위생관리 여건 점검, 내외국인 운영 업소 비중 분석 등 공중위생 관리와 관련 정책 수립에 활용 가능한 중요한 기초자료입니다.
