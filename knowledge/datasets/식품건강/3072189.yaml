description_portal: '부산광역시 기장군 소재의 세탁업에 대한 데이터입니다.이 데이터는 부산광역시 기장군에 소재한  세탁업의 업소명,주소,전화번호 등의 항목을 제공합니다.* 데이터의 항목별 설명1. 업종명: 세탁업2. 업소명: 부산광역시 기장군 소재의 세탁업소3. 영업소 주소(도로명): 부산광역시 기장군 소재의 세탁업소의 위치정보(도로명 주소)4. 소재지전화: 업체 전화번호5. 영업자시작일: 각 세탁업소의 영업 시작일(년월일)* 데이터 활용시 참고사항1. 이 데이터는 연간 현행화되고 있으며, 수시로 변경될 수 있습니다.2. 현재 데이터 기준일자는 2026년 6월입니다.'
