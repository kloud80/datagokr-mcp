summary_user: 서울특별시 양천구 관내 식품운반업 업소의 인허가 현황을 업소 한 곳당 한 행으로 담은 원장으로, 업소명·인허가일자·영업상태(영업/폐업)·폐업일자·지번/도로명 주소·전화번호·소재지면적·종사자수·좌표(X, Y) 등을 포함한다. 양천구에서 유산균 음료나 수산물처럼 부패·변질되기 쉬운 식품을 운반하는 업체가 어디에 몇 곳 영업 중인지, 언제 인허가를 받고 언제 폐업했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 구·업종의 인허가 데이터와는 관리번호(MGTNO)·업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 양천구에서 관리하는 식품운반업 관련 인허가 현황을 체계적으로 수집하여 제공하는 자료이다. 관내에서 식품을 운반하는 사업체의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등의 행정 정보를 포함한다. 이를 통해 지역 내 식품 안전 관리의 신뢰성을 높이고 민원 처리의 투명성을 확보할 수 있다. 또한 신규 영업자에게 필요한 법적 요건을 안내하여 절차 이해를 돕고, 정책 수립과 현장 점검을 위한 기초 자료로 활용될 수 있다. 본 데이터는 인허가 변동 사항을 반영하여 정기적으로 갱신되며, 이용자는 이를 기반으로 운반 환경의 위생 관리 수준을 파악하고 관련 업무의 효율성을 제고할 수 있다. 아울러 행정기관 간 정보 공유를 촉진하여 위반 사항 예방, 지도 점검 강화 등 식품 안전 체계 전반의 향상에 기여한다.* 식품운반업 - 유산균 음료, 어류, 조개류와 같이 부패 또는 변질되기 쉬운 식품을 위생적으로 운반하는 업소
