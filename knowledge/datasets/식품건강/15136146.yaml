description_portal: '식품의약품안전처에서 제공하는 농산물, 축산물,  가공식품, 건강기능식품, 식품첨가물, 기구 용기포장 등의  현황을 연도별,지방청별,품목별로 2001-2023년도 데이터를 제공하는 서비스입니다.* 작성주기 및 조사기간: 매년 / 1월 1일 ~ 12월 31일(자료취합 기준일 익년 6월말)* 담당부서: 식품의약품안전처 수입식품안전정책국 수입검사관리과*비고 - 타 기관 자료와 비교했을 경우, 우리나라 전체 수입식품 현황과 다를 수 있음(사유 : 관세청의 경우 HSK코드 체계 사용 등) - 2008년부터 축산물 및 수산물 수입현황이 포함되어 있음 - 2019년 자료의 경우 수치가 변경될 수 있음(사유 : 수입자의 신고 오류 등)'
