summary_user: 부산광역시 사상구에 영업신고된 이용업과 미용업(일반·피부·네일·화장분장·종합미용업) 업소를 한 행에 한 곳씩 업종명·업소명·도로명 주소·전화번호로 담은 개별 업소 목록 파일(CSV)이다. 주민이나 사업자가 사상구 안에 어떤 업종의 이미용 업소가 어디에 있는지 찾거나, 분석가가 구 단위 미용업 분포와 업종 구성을 파악하는 데 쓴다. 실측 컬럼에 업소 고유번호 같은 전역 조인 키가 없어서 다른 데이터와는 업소명·도로명 주소를 맞춰 보거나 같은 기관(사상구) 자료끼리만 연결한다.
description_portal: '해당 자료는 부산광역시 사상구에 영업신고된 이용업 및 미용업(일반미용업, 피부미용업, 네일비용업, 화장분장미용업, 종합미용업)의 현황에 대한 정보를 제공합니다.업소에 대한 기본정보(업종명, 업소명, 소재지주소, 업소전화번호)로 구성된 데이터입니다.* 이용업: 손님의 머리카락 또는 수염을 깎거나 다듬는 등의 방법으로 손님의 용모를 단정하게 하는 영업* 일반미용업: 파마ㆍ머리카락자르기ㆍ머리카락모양내기ㆍ머리피부손질ㆍ머리카락염색ㆍ머리감기, 의료기기나 의약품을 사용하지 아니하는 눈썹손질을 하는 영업* 피부미용업: 의료기기나 의약품을 사용하지 아니하는 피부상태분석ㆍ피부관리ㆍ제모(除毛)ㆍ눈썹손질을 하는 영업* 네일미용업: 손톱과 발톱을 손질ㆍ화장(化粧)하는 영업* 화장분장미용업: 얼굴 등 신체의 화장, 분장 및 의료기기나 의약품을 사용하지 아니하는 눈썹손질을 하는 영업'
