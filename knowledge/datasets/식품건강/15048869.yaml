summary_user: 경상남도 진주시의 식품접객업소 가운데 영업장 면적이 300제곱미터 이상인 업소를 한 행씩 담은 목록으로, 업종명·업소명·도로명 소재지·영업장 면적(건물 내부와 외부)을 담는다. 진주시에서 대형 음식점·제과점·주점 등이 어디에 얼마나 있는지 알고 싶은 창업자나 상권 분석가가 '진주시에 면적 300㎡ 이상 일반음식점은 어디에 몰려 있나' 같은 질문에 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 업소명과 도로명 주소를 맞춰 보거나 주소를 좌표로 바꿔서만 이어 쓴다.
description_portal: '식품위생법 시행령에 따른 식품접객업 종류에는 일반음식점, 휴게음식점, 제과점, 위탁급식영업, 유흥주점, 단란주점이 있습니다.식품접객업 현황 중 면적이 300제곱미터 이상인 업소에 대한 설명입니다.업소명, 업종명, 영업장 소재지, 영업장 면적 설명이 포함된 자료입니다.* 파일내 업종의 정의는 식품위생법 시행령 제21조(영업의 종류)를 참고해 주시기 바랍니다.* 면적 300제곱미터이하의 식품접객업소의 현황은 진주시청 홈페이지에서 열람가능합니다. - 정보소재 : 진주시청 홈페이지 식품관련업소현황 검색 또는 진주시청홈페이지-진주소개-실과안내-문화관광체육국-위생과-식품제조업 안내에서 식품관련업소현황'
