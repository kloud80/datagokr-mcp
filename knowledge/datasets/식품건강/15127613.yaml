summary_user: 충청북도 진천군 관내 담배소매인을 업소 한 곳당 한 행으로 담은 지정현황 파일로, 민원구분·업소명·지번주소·도로명주소·지정일자를 담는다. 진천군에서 담배를 파는 가게가 어디에 있고 언제 지정됐는지 알고 싶은 주민이나, 동네별 담배소매점 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 충청북도 진천군에 소재하는 담배소매인 지정현황에 대한 내용으로, 민원구분, 업소명, 업소 지번주소, 도로명 주소, 담배소매인 지정일자 등을 제공합니다.진천군 관내에는 2026년 3월 26일 기준 1445개의 소매인이 있으며, 데이터 내용 외의 개인정보를 포함하는 내용(성명 등)은 제공하지 않습니다.진천군 담배소매인은 담배사업법 및 진천군 담배소매인 지정에 관한 규칙 등에 따라 지정되었으며, 담배소매인 지정절차는 담배사업법 시행규칙 제7조에 규정되어 있습니다.더 자세한 사항은 진천군청 경제과로 문의하실 수 있습니다.
