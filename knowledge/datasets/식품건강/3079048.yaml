summary_user: 목포시가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일 데이터로, 업소명·도로명 소재지·전화번호·주된음식·데이터기준일자를 담는다(약 10KB CSV). 주민이나 관광객이 목포에서 모범음식점으로 지정된 한식·횟집 같은 식당을 찾아 위치와 연락처를 확인하는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 식품 인허가 원장 등과는 업소명·도로명 주소를 맞춰 붙여야 한다.
limits: 업소 인허가번호가 없어 인허가 원장·행정처분 데이터와 바로 조인되지 않고, 이름·주소 매칭에 기대야 한다. 범위는 목포시 한 곳뿐이라 다른 시군과 비교하려면 각 시군 파일을 따로 모아야 한다.
