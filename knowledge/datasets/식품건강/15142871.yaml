summary_user: 서울특별시 마포구에서 집단급식소 운영 업체와 계약해 그 급식소에서 음식을 조리·제공하는 위탁급식영업 업소를 업소 단위로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 포함한다. 마포구 안에서 현재 영업 중인 위탁급식업체가 어디에 몇 곳 있고 언제 인허가·폐업했는지를 확인하려는 사업자나 상권·급식 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 개방자치단체코드·관리번호 같은 같은 기관 코드나 사업장명·주소 매칭으로만 연결한다.
description_portal: '서울특별시 마포구의 집단급식소를 설치 및 운영하는 업체와 계약에 따라 해당 집단급식소에서 음식류를 조리하여 제공하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리·감독하는 부서나 기관의 정보도 함께 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
