summary_user: 전라남도 고흥군의 미용업소를 업소 한 곳당 한 행으로 담은 인허가 원천 파일로, 인허가일자·영업상태·폐업일자, 소재지·도로명 주소와 좌표, 업태, 의자수·종사자수 같은 시설 정보를 담는다. 창업을 준비하는 사업자나 지역 분석가가 고흥군에서 지금 영업 중인 미용실이 어디에 몇 곳 있는지, 최근 개업·폐업 흐름이 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 관리번호·개방자치단체코드 같은 같은 기관 코드나 주소·좌표를 기준으로 이어 붙여야 한다.
