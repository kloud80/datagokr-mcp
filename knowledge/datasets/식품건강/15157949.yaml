description_portal: "광주광역시 남구 관내 음식점 위생등급제 지정 현황 및 정보(상호명, 업태, 업종 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 보건위생과(☎062-607-4433)에서 제공합니다. 아울러, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 해당 데이터는 관내 음식점 중 식품의약품안전처 기준에 따라 위생 상태가 우수한 업소의 등급 지정 현황을 관리하여 안전한 외식 환경을 조성하고 소비자 선택권을 보장하기 위한 목적으로 공표되었습니다. 구민들이 위생 수준이 객관적으로 검증된 업소를 신속하게 확인하고 이용할 수 있도록 돕는 행정 서비스의 일환으로 본 정보를 개방합니다. 또한 '식품안전나라'를 통해서도 해당 데이터를 조회가능하오니 이용에 참고하시기 바랍니다. 링크 : https://www.foodsafetykorea.go.kr/portal/fooddanger/foodSafetyInfo/hgledgList.do?menu_grp=MENU_NEW02&menu_no=4436"
