summary_user: 음성군 충북혁신도시 안의 일반음식점을 업소 한 곳씩 담은 건별 현황 파일로, 업태, 인허가일자, 영업·휴업·폐업 상태, 지번·도로명 주소, 전화번호, 사업장명을 담는다(CSV 약 62KB). 혁신도시에 어떤 업종의 음식점이 얼마나 영업 중인지, 언제 인허가가 났는지 보려는 창업자·상권 분석가·지역 행정 담당자가 쓴다. 전국 공통 조인 키(인허가번호·사업자번호 등)는 없어서, 주소·우편번호로 공간정보와 맞추거나 개방자치단체코드·사업장명으로 같은 기관의 다른 식품 인허가 데이터와 이어 쓴다.
description_portal: 음성군 충북혁신도시 일반음식점현황 데이터는 지역 내 음식점의 행정적 관리와 현황 파악을 위해 구축된 자료입니다. 업태구분명은 해당 사업장이 속한 업종을 구분하며, 지방자치단체명과 개방자치단체코드는 행정구역과 관리 단위를 명확히 식별할 수 있도록 합니다. 인허가일자는 영업 허가가 이루어진 시점을 기록해 법적·행정적 근거를 제공하며, 상세영업상태명은 현재 영업 중인지, 휴업 또는 폐업 상태인지를 나타냅니다. 전화번호는 고객과 행정기관의 연락을 위한 기본 정보로 활용되고, 소재지전체주소와 도로명전체주소, 도로명우편번호는 위치를 정확히 확인할 수 있게 하여 공간정보와 연계 활용을 가능하게 합니다. 사업장명은 음식점의 공식 명칭을 나타내며, 데이터기준일자는 정보의 최신성과 신뢰성을 보장하는 기준 시점을 제공하여 시점별 현황 분석을 지원합니다. 이 데이터는 지역 음식업 관리, 정책 수립, 생활 편의 서비스 제공에 중요한 기반 자료로 활용됩니다.
