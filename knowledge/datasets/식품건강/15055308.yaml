description_portal: '안양시 관내 한약방은 지역 주민들에게 한약 조제 및 판매 서비스를 제공하는 전통의약 업소입니다. 이들은 일반적으로 진료를 하지 않고, 한약재를 조제하거나 판매하는 데 중점을 둡니다. 주요 특징은 다음과 같아요:- 업소 정보: 업소명, 도로명 주소, 전화번호 등 기본 정보가 포함됩니다.- 위치 기반 활용: 도로명 주소 외에도 위도·경도 정보가 포함되어 있어 GIS 기반 분석도 가능합니다.- 업데이트 주기: 연 1회 정기적으로 갱신됩니다.이 데이터는 안양시 내 한약방의 분포를 파악하거나, 보건 정책 수립, 지역 의료 접근성 분석 등에 유용하게 활용될 수 있어요.'
