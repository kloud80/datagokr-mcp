summary_user: 다이어트·성기능개선·근육강화 등을 표방하는 해외직구 식품 가운데 부정물질이나 오·남용 우려 의약품 성분이 확인됐거나 국내외 위해정보로 안전성 우려가 있어 통관·판매 사이트 차단 대상이 된 제품을 제품 한 건씩 담으며, 제품명·검출 성분·제조국·제조사·바코드·이미지와 차단 기간 시작·종료일이 함께 들어 있고 범위는 전국이다. 해외직구로 사려는 소비자가 '이 제품이 위해식품으로 차단된 것인지, 어떤 성분이 문제인지'를 확인하거나, 구매대행 사업자·분석가가 차단 제품의 제조국·성분 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 회수·부적합·수입식품 데이터와는 제품명·제조사명 매핑이나 바코드(BARCD_CTN) 대조로만 이어 쓴다.
description_portal: 다이어트·성기능개선·근육강화를 표방하는 해외직구 식품 등에서 부정물질, 오·남용 우려 의약품 성분이 함유된 것으로 확인되었거나 국내외 위해정보에 따라 안전성 우려가 있는 제품에 대해서는 관세청에 통관 차단요청, 방송통신위원회에 판매 사이트 차단 요청, 식품안전나라에 해당 제품 등에 대한 속성정보를 제공합니다. '해외직구 위해식품 차단정보는 식품안전나라>위해·예방>해외직구 정보>해외직구 위해식품 차단 목록'에서 상시 현행화되고 있습니다.이 자료를 통하여 데이터 산업 활성화 및 일자리 창출 효과를 가져오며, 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.
