summary_user: '경상남도 남해군 관내 식품제조가공업체를 업소 한 곳당 한 행으로 담은 파일 데이터로, 업소명·전화번호·도로명 소재지·생산 식품군과 식품유형·행정읍면을 담는다(CSV 약 14KB). 남해군에서 특정 식품유형(예: 수산가공품, 장류)을 만드는 업체가 어느 읍면에 몇 곳 있는지, 지역 특산품 제조업체 연락처가 무엇인지 확인하려는 사업자·행정 담당자·분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 식품 인허가 데이터와는 업소명·도로명주소 매칭이나 행정읍면 이름으로만 이어 쓴다.'
description_portal: '경상남도 남해군 관내 식품제조가공업체 현황을 나타낸 공공데이터로, 업소명, 전화번호, 소재지(도로명주소), 생산 식품군 및 식품유형, 그리고 해당 행정읍면 정보를 제공합니다. ○ 업종 : 관내 업체명을 나타내고 있습니다.○ 전화번호 : 업체명에 대한 연락처로 연락처가 없는 곳은 공란으로 처리되었습니다.○ 식품군 : 해당 업체별 판매 식품군에 대한 정보는 나타내고 있습니다.○ 식품유형 : 해당 업체별 판매 식품유형에 대한 정보를 나타내고 있습니다.이 데이터는 식품안전관리, 지역 특산품 홍보, 기업 지원정책 수립 등 다양한 행정 및 산업 분야에서 활용될 수 있습니다.'
