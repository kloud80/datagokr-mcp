summary_user: 서울특별시 중구에 있는 소독업 업소를 업소별로 담은 인허가 원장으로, 관리번호(MGTNO)·인허가일·영업상태(신고·폐업 등)·소재지 주소·중부원점TM 좌표와 함께 분무기·방독면·보호복 같은 소독장비 보유 수량을 담는다. 소독업 창업을 준비하는 사업자가 '중구에 영업 중인 소독업체가 몇 곳이고 어디에 몰려 있는가'를 확인하거나, 분석가가 지역별 방역업체 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 개방서비스 코드(OPNSFTEAMCODE) 기준으로만 이어 쓴다.
description_portal: '서울특별시 중구의 전염병 및 각종 세균이나 유해 해충의 소독을 목적으로 만들어진 업소 정보입니다. 데이터는 각 소독업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 소독업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 소독장비 약품 기술 보유 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
