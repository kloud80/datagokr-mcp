summary_user: 서울 강북구의 소독업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가·취소 일자, 영업 상태, 소재지·도로명 주소, 중부원점TM 좌표(X, Y)와 사무실 면적, 분무기·방독면·보호복 같은 소독 장비 보유 수량을 포함하며 영업 중인 곳과 폐업한 곳이 함께 들어 있다. 주민이나 사업자가 '강북구에서 지금 영업 중인 소독업체는 어디이고 어떤 장비를 갖췄나'를 확인하거나, 분석가가 구 단위 소독업 개·폐업 추이를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 이어 쓰고, 좌표를 다른 공간 데이터와 겹치려면 EPSG:5174를 변환해야 한다.
description_portal: '서울특별시 강북구 소독업 인허가 정보 데이터는 강북구의 전염병 및 각종 세균이나 유해 해충의 소독을 목적으로 만들어진 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
