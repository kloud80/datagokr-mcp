summary_user: 서울 성동구의 단란주점영업 업소를 한 곳씩 담은 인허가 원장으로, 관리번호(MGTNO)별 인허가일자·폐업일자·영업상태, 소재지 주소, 좌표, 시설 규모 같은 정보를 담는다. 구청 담당자나 상권 분석가가 '성동구에서 지금 영업 중인 단란주점은 어디에 몇 곳이고 언제 문을 열거나 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 주로 주류와 함께 다양한 음식류를 조리·판매하며, 손님이 노래를 부를 수 있도록 허용된 영업장의 정보를 체계적으로 제공하기 위해 구축되었습니다. 이러한 업소는 주류 제공과 음식 조리, 노래방 설비 등 특수 영업 환경을 동시에 갖추고 있어, 사회적 관심 및 위생·질서 유지에 대한 관리가 필요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 각 업소의 영업 인허가 이력, 개시와 종료, 행정상 변동 상황을 명확하게 파악할 수 있습니다. 성동구청 등 관할 행정기관에서 정기적인 점검 및 정보 갱신을 통해 데이터의 신뢰성과 최신성을 지속적으로 확보하고 있습니다. 본 데이터는 유흥업소 및 노래주점 관리, 정책 수립, 시장 동향 분석, 위생·안전 모니터링, 소비자 안내자료, 기업 및 업계 연구 등 다양한 방면에서 실질적으로 활용될 수 있으며, 행정기관, 업계, 연구자, 시민 모두에게 객관적이고 유용한 정보를 제공합니다. 데이터는 정기적으로 최신화됩니다.
