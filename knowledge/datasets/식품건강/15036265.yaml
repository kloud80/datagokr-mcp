summary_user: 부산광역시 강서구 관내 위탁급식영업 업소를 한 행씩 담은 파일로, 업종명·업소명·도로명 소재지·전화번호·우편번호를 업소 단위로 제공한다. 강서구에서 단체급식을 맡길 위탁급식업체를 찾는 기관 담당자나, 구 안의 위탁급식업소 분포를 파악하려는 분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰서만 이어 쓴다.
limits: 강서구 한 시군구만 다루므로 부산 전체나 전국 비교에는 다른 구·전국 원장이 필요하다. 인허가번호·좌표 같은 공통 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭 오류에 주의한다.
