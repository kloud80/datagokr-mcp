summary_user: 인천 부평구가 지정한 착한가격업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 7.6KB)로, 업종·업소명·주소·연락처와 대표 품목 및 그 가격(원)을 담는다. 주민이 '우리 동네에서 싸게 먹거나 이용할 수 있는 한식·미용·세탁 업소가 어디이고 대표 메뉴가 얼마인가'를 찾거나, 분석가가 업종별 대표 품목 가격 수준을 살피는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어, 식품 인허가 업소 원장 등 다른 데이터와는 업소명·주소 문자열 매칭으로만 이어 쓴다.
limits: 인허가번호·사업자번호 같은 공통 식별키가 없어 다른 업소 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 따른 오연결을 감안해야 한다. 범위는 부평구 한 곳의 개별 업소이므로 다른 시군구와 비교하려면 각 지자체 데이터를 따로 모아야 한다.
