description_portal: '부평구 업종별 착한가격업소 현황 데이터 입니다.저렴한 가격으로 서비스를 제공하는 업소 정보를 제공함으로써 서민 경제 부담을 완화하고 지역 물가 안정화 및 소상공인 지원 정책 수립에 활용할 수 있습니다.활용 목적 및 특징합리적 소비 유도: 소비자가 주변의 저렴하고 우수한 업소를 쉽게 찾을 수 있도록 지원물가 모니터링: 지역별·업종별 주요 품목의 가격 동향 파악 및 물가 안정화 기초 자료지역 경제 활성화: 인증 업소 홍보 및 인센티브 지원을 통한 골목상권 경쟁력 강화맞춤형 행정 지원: 소상공인 대상 공공요금 감면, 물품 지원 등 정책 집행 기반주요 항목 설명○ 연번: 데이터의 고유 식별 번호○ 업종: 업소의 분류 (예: 한식, 중식, 세탁업, 미용업 등)○ 업소명: 착한가격업소로 지정된 매장의 공식 명칭○ 시군구: 업소가 소재한 기초자치단체 구분○ 주소: 업소의 상세 위치 ○ 연락처: 예약 및 문의를 위한 업소 전화번호○ 주요품목: 착한가격으로 제공되는 대표 메뉴 또는 서비스 항목○ 가격: 주요 품목의 판매 단가 (원 단위)'
