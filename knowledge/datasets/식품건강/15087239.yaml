summary_user: 전국 단위로 등록된 농약 품목별 정보를 담으며, 품목명·상표명·등록번호·제제형태·용도와 함께 작물·병해충(잡초)별 사용방법·사용적기·희석배수·사용횟수, 등록업체, 사람·가축 독성과 생태독성을 건별로 제공한다. 농업인이나 농자재 판매자가 "이 작물의 이 병해충에 등록된 농약은 무엇이고 희석배수와 사용횟수는 어떻게 되는가"를 확인하거나, 분석가가 특정 업체의 등록 농약과 등록 유효기간을 살피는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 다른 데이터와는 농약명·작물명·법인명 같은 이름 매핑이나 같은 기관(식품안전나라) 코드로만 이어 쓴다.
description_portal: 농약에 대한 정보로, 농약명 , 농약영문명 , 상표명 , 품목번호 , 등록번호 , 제제형태 , 농약구분 , 용도 , 병해충/잡초명 , 작물명 , 농약사용방법 , 사용적기 , 희석배수 , 사용수량 , 단위 , 사용횟수 , 업등록번호 , 업등록종목 , 법인명 , 대표자 , 주소 , 제조/수입구분 , 등록유효일자 , 등록일자 , 시험약제명 , 등록규격 , 등록여부 , 사람/가축독성 , 생태독성  등 항목을 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
