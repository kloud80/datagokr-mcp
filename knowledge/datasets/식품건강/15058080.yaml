summary_user: 경기도 내 관광호텔에 설치된 휴게음식점을 업소 한 곳당 한 행으로 담은 인허가 원장으로, 시군명, 사업장명, 인허가일자·폐업일자, 영업상태, 시설 규모, 남녀 종사자 수, 소재지 주소와 WGS84 위·경도를 포함한다. 관광·상권 분석가가 '경기도 어느 시군의 관광호텔에 휴게음식점이 몰려 있고 그중 지금 영업 중인 곳은 몇 곳인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 사업장명·주소 매칭, 또는 좌표 기반 공간 결합으로 잇는다.
description_portal: 이 데이터는 경기도 내 관광호텔에 설치된 휴게음식점 현황을 제공하는 인허가 기반 자료입니다. 음주가 허용되지 않는 업소를 포함하며, 시군명, 사업장명, 인허가일자, 폐업일자, 영업 상태, 위생업종 및 업태명, 다중이용업소 여부, 등급구분명, 시설 규모, 남녀 종사자 수, 총종업원 수, 소재지 주소, 우편번호, WGS84 위·경도 좌표 등 다양한 항목이 포함됩니다. 해당 데이터는 경기도 31개 시군 전체를 대상으로 하며, 관광호텔 내 부대시설의 분포 분석, 지역별 관광 편의시설 수요 파악, 정책 수립 및 위생·안전 관리 연구 등에 활용할 수 있습니다. 다만, 본 자료는 인허가 현황에 기반하므로 실제 운영 여부와는 차이가 발생할 수 있음을 고려해야 합니다.
