summary_user: 진단시약 사용 중 생긴 이상사례를 보고일련번호 한 건 단위로 담고, 대상업체, 인지일·발생일·종료일, 수입·판매 수량, 회수·수리·교환·점검·제품개선 같은 조치 내용을 함께 기록한 전국 범위의 원천 보고 데이터다. 의료기관 구매 담당자나 안전성 분석가가 '특정 업체 진단시약에서 어떤 이상사례가 보고됐고 어떤 조치가 이뤄졌는가'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서, 다른 데이터와는 업체명이나 사업자등록번호(BRNO) 같은 이름·코드 매핑으로만 잇는다.
description_portal: 해당 공공데이터는 식품의약품안전처에서 관리하는 진단시약 이상사례 제품 및 조치내역 정보를 제공하고 있습니다. 진단시약 사용 과정에서 발생한 이상사례를 체계적으로 수집하고 관리할 수 있도록 지원합니다. 이 공공데이터는 보고일련번호를 통해 각 사례를 고유하게 식별하며 대상업체명과 함께 이상사례의 인지일 발생일 종료일 등 시간적 경과를 상세히 기록합니다. 진단시약 이상사례 제품 및 조치내역 공공데이터를 통해 사용자는 이상사례 발생부터 조치까지 한눈에 확인할 수 있습니다.
