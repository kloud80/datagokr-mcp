summary_user: 경기도 포천시 관내 이·미용업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소와 데이터기준일을 담는다. 포천시에서 특정 동네에 미용실·이용원이 얼마나 몰려 있는지, 생활서비스 업소 분포가 어떤지 확인하려는 주민·창업자·지역 분석가가 쓴다. 전역 조인 키나 업소 코드가 없어 다른 데이터와는 주소를 정제해 행정구역·상권·인구 자료와 맞추는 방식으로만 잇는다.
description_portal: 경기도 포천시에서 제공하는 이미용업 현황 데이터입니다. 본 데이터는 포천시 관내에서 운영 중인 이·미용업소의 기본 정보를 담고 있으며, 업종명, 업소명, 사업장 지번주소, 사업장 도로명 주소, 데이터기준일자 항목으로 구성되어 있습니다.이를 통해 포천시 관내 이·미용업소의 분포와 업종별 현황을 확인할 수 있으며, 지역 생활서비스 현황 분석, 소상공인 및 지역경제 관련 정책 수립, 위생관리 및 영업 현황 파악을 위한 기초자료로 활용할 수 있습니다. 또한 사업장 주소를 기반으로 행정구역, 인구, 상권, 생활편의시설 등 다양한 공공데이터와 연계·분석이 가능하여 지역 상권 분석과 생활서비스 정책 수립에 활용할 수 있는 공공데이터입니다.본 공공데이터는 정기적인 갱신을 통해 최신 정보를 반영하고 있습니다.
