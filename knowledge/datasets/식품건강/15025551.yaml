summary_user: 부산광역시 부산진구에 신고된 이미용업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·신고일자·업소명·도로명/지번 주소를 담는다. 부산진구에서 언제 신고된 미용실·이용원이 어디에 있는지 확인하려는 주민이나, 동네별 이미용업소 분포를 살펴보려는 창업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 공중위생업소·인허가 데이터와는 업소명·주소 문자열 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 부산광역시 부산진구 내 등록된 이미용업소 현황정보를 제공합니다.업종명, 신고일자, 업소명, 주소 등의 정보를 제공하고 있습니다.또한 영업상태, 대표자명, 소재지 도로명주소, 영업장 면적, 지정일자, 지도점검 결과 등의 세부정보를 포함하고 있으며, 이를 통해 지역 내 미용업소의 운영 현황과 행정 관리 정보를 종합적으로 확인할 수 있습니다.이 자료는 시민들이 신뢰할 수 있는 미용 서비스를 선택하는 데 도움을 주며, 행정기관이 위생 관리와 업소 지원 정책을 수립하는 데에도 유용하게 활용될 수 있습니다.
