summary_user: 경기도 시흥시 안의 미용업소를 업소 한 곳당 한 행으로 담은 현황 파일로, 업종명·업소명·도로명 및 지번 주소·소재지 전화번호로 구성된다. 주민이 집 근처 미용실을 찾거나, 창업 예정자·분석가가 시흥시 동네별 미용업소 분포를 보고 상권을 가늠하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명·주소 문자열 매칭으로만 잇는다. 예를 들어 주소를 지오코딩해 좌표로 바꾼 뒤 상권·인구 자료와 겹쳐 본다.
limits: 업소 고유번호·인허가일·영업상태 같은 컬럼이 없어 개업·폐업 추이나 영업 여부는 이 파일로 알 수 없다. 다른 데이터와 연결하려면 업소명·주소를 직접 맞춰야 하고, 범위는 시흥시 한 곳에 한정된다.
