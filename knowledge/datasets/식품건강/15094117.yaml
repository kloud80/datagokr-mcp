summary_user: 부산진구 관내에 등록된 제과점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명/지번 주소·전화번호를 담는다(csv 약 18KB). 주민이나 창업 예정자가 '부산진구 어느 동네에 제과점이 몰려 있나', '내 주변 제과점 연락처는 무엇인가'를 확인하거나, 분석가가 구 단위 상권 현황을 파악하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어서, 다른 식품 인허가 자료나 위생·행정처분 자료와는 업소명·주소를 맞춰 붙여야 한다.
description_portal: 부산광역시 부산진구 관내에 정식으로 등록되어 운영 중인 제과점의 전반적인 현황 정보를 종합적으로 제공하는 자료로서, 각 업소의 명칭과 세부 주소(도로명 및 지번 포함) 등 기본적인 정보를 포함하고 있습니다. 이 자료는 부산진구 내에 분포하고 있는 다양한 제과점의 현황을 체계적으로 파악할 수 있도록 구성되어 있으며, 행정기관의 위생 관리, 영업 지도, 정책 수립 및 지역 상권 분석 등 공공 행정 업무에 유용하게 활용될 수 있습니다. 또한, 주민과 방문객이 지역 내 제과점을 손쉽게 확인할 수 있도록 함으로써, 건전하고 안전한 외식 문화 조성 및 식품 위생 수준 향상에도 기여하는 중요한 기초 자료로 기능합니다
