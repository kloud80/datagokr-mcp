summary_user: 성남시 내 제과점(베이커리카페 포함)을 업소 한 곳당 한 행으로 담은 파일로, 구·사업장명·영업상태·인허가일자·폐업일자·영업장 면적·도로명/지번 주소를 담는다. 창업 예정자나 상권 분석가가 '분당구에서 최근 몇 년간 새로 연 제과점과 폐업한 제과점은 몇 곳인가'처럼 지역별 개·폐업 추이와 경쟁 업소 분포를 확인하는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가 업소 데이터와는 사업장명·주소 문자열을 맞춰 연결하고 위치 분석은 주소를 지오코딩해 쓴다.
description_portal: 성남시 내 제과점(베이커리카페 포함) 현황자료 입니다. 각 구별(수정구, 중원구, 분당구), 업종명, 사업장명, 영업상태, 인허가일자, 폐업일자, 영업장 면적, 도로명 소재지, 지번 소재지 항목으로 구성되어 있으며, 현재 영업 운영여부, 폐업여부, 위치 정보를 포함해 업소현황을 반기별로 현행화하여 자료를 제공합니다.식품위생법 시행령 제21조에 따른 제과점영업은 주로 빵, 떡, 과자 등을 제조 판매하는 영업으로서 음주행위가 허용되지 아니하는 영업을 말하며, 제과점 영업을 시작하기 위해서는 영업신고를  해야 합니다
