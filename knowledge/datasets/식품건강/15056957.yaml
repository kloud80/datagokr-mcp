summary_user: 경기도 31개 시군의 건강기능식품 유통전문판매업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자·주소·좌표·종사자 수·보증금·월세 등을 담는다. 사업자나 분석가가 "우리 시군에 영업 중인 건강기능식품 유통전문판매업체가 어디에 몇 곳 있고, 최근 몇 곳이 폐업했나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군코드(SIGUN_CD)로 같은 기관의 다른 경기도 식품 인허가 데이터와 묶고, 정제 주소나 WGS84 좌표로 위생 지정·행정처분 데이터 및 지도와 맞대어 쓴다.
description_portal: 이 데이터는 건강기능식품에 관한 법률 시행령 제3항에 따른 건강기능식품 유통 전문판매업체의 인허가 현황을 담고 있으며, 경기도 31개 시군을 기준으로 주간 단위로 갱신됩니다. 총 41개 항목으로 구성되어 있으며, 사업장명, 인허가일자, 영업상태명, 소재지 주소, 좌표 정보, 위생업태명, 남녀 종사자 수, 건물소유구분, 보증금액, 시설 규모 등 유통업체의 운영 및 환경 정보를 상세히 제공합니다. 건강기능식품의 안전하고 체계적인 유통 현황을 파악하고, 유통업 허가 관리, 정책 분석, 산업 동향 예측 등에 활용될 수 있으며, Open API를 통해 연계 사용도 가능합니다.
