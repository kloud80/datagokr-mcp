summary_user: 경기도 동두천시의 일반음식점·휴게음식점·제과점·단란주점·유흥주점 등 식품접객업소를 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업종·인허가일자·업소명·도로명/지번 주소·위도·경도·영업장 면적·전화번호를 담는다. 동두천시에서 창업을 검토하는 사업자나 상권 분석가가 '특정 동네에 휴게음식점이 몇 곳이고 언제 문을 열었나'를 확인할 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없으므로 주소나 좌표로 다른 상권·인구 자료와 공간 결합하거나, 업소명·주소로 같은 기관의 위생·행정처분 자료와 맞춰 쓴다.
description_portal: 경기도 동두천시에 위치한 식품접객업소 현황을 민원인에게 제공하고자 합니다.식품접객업소란 ‘음식류를 조리·판매하며 고객에게 제공하는 업소’이며 일반음식점, 휴게음식점, 제과점, 단란주점, 유흥주점의 정보를 제공하고자 합니다.공공데이터 제공항목은  인허가일자, 업소명, 소재지주소, 위치, 면적, 연락처의 정보입니다.데이터의 기준일자는 2026년 6월 15일입니다. 데이터에 대하여 추가적인 문의사항이 있을 경우 동두천시청 농업축산위생과 위생팀 031-860-2233으로 문의주시기 바랍니다.
