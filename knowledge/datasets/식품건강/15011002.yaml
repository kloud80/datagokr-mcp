summary_user: 경기도 내에서 생산된 축산물의 미생물 검사 결과를 집계한 자료로, 집계연도·검사연월별로 축종(돼지·소·닭고기 등)과 세균 구분(일반세균수·대장균수), 세균 수치 범위마다 검사결과 건수를 담는다. 도축장·유통 단계의 위생관리 실태를 보는 분석가나 정책 담당자가 '경기도 닭고기의 대장균 수치 분포가 연도별로 나아지고 있는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 축종명·연월 같은 이름 매칭으로만 잇는다.
description_portal: 이 데이터는 경기도 내에서 생산되는 축산물에 대한 미생물 검사 결과를 집계한 자료로, 집계년도, 축종명(돼지, 소, 닭고기 등), 세균구분명(일반세균수, 대장균수), 검사년월, 세균 수치 범위(검사세균분포구분명), 검사결과수(건) 항목으로 구성되어 있습니다. 본 데이터는 도축장과 유통 과정에서의 위생관리 실태를 분석하고, 원료 축산물 단계에서의 미생물 오염 발생 위험요인을 중점적으로 관리하기 위한 근거자료로 활용됩니다. 또한 세균 분포를 수치화하여 연도별, 축종별 오염 추이를 파악함으로써, 축산물의 안전성 확보, 식중독 예방, 축산업의 품질관리 개선을 위한 정책 수립에 기여할 수 있습니다.
