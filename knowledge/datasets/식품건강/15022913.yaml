summary_user: 부산광역시 남구에 등록된 즉석판매제조가공업소(만든 식품을 업소에서 최종소비자에게 직접 파는 영업)를 업소 한 곳당 한 행으로 담은 등록 현황 파일로, 업종명·업소명·도로명/지번 주소·전화번호를 담는다. 남구에서 수제청·반찬·떡처럼 직접 만들어 파는 가게가 어디에 몰려 있는지 알아보려는 주민, 창업 예정자, 상권 분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가 데이터와는 업소명·주소를 맞춰 보거나 같은 기관(남구) 자료끼리만 이어 쓴다.
description_portal: '부산광역시 남구에 등록되어 있는 즉석판매제조가공업등록현황에 대한 데이터를 제공합니다.업종명, 업소명, 주소, 소재지 전화번호 등의 항목을 제공합니다.[식품위생법 시행령] 제21조(영업의 종류) 법 제36조제1항 각 호에 따른 영업의 세부 종류와 그 범위는 다음 각 호와 같다. <개정 2010. 3. 15., 2011. 3. 30., 2013. 3. 23., 2013. 12. 30., 2016. 1. 22., 2017. 12. 12., 2021. 12. 30., 2022. 6. 7., 2023. 7. 25., 2024. 5. 14.>1. 식품제조ㆍ가공업: 식품을 제조ㆍ가공하는 영업2. 즉석판매제조ㆍ가공업: 총리령으로 정하는 식품을 제조ㆍ가공업소에서 직접 최종소비자에게 판매하는 영업-> 최종소비자에게 바로 판매하는 영업. ex.) 수제청 판매'
