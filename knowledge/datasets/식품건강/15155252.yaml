summary_user: 전국 지자체가 관리하는 제과점영업 인허가 업소를 업소 한 곳당 한 건으로 담은 원장 API로, 전체 70,235건에 인허가일자·영업상태·사업장명·지번/도로명주소·좌표를 싣는다. 상권을 분석하는 사람이나 사업자가 '이 동네에 영업 중인 제과점이 어디에 몇 곳 있나'를 확인할 때 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)는 address 키, 관리번호(MNG_NO)는 pnu 키로 실측되어 주소 기반 데이터와 이어 쓰고, 같은 식품 인허가 업소 부문의 다른 업종 데이터와 함께 본다.
description_portal: '식품_제과점영업 데이터는 빵, 베이커리와 같은 빵류, 제과류 등을 만들어 판매하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 제과점영업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 식품의약품안전처(식품안전정책과) / 044-719-2032, 2016* 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
