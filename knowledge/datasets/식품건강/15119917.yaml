summary_user: 서울 성동구 안의 식용얼음판매업 업소를 업소별 한 건씩 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(영업/폐업)·폐업일자·소재지 주소·좌표·시설 규모 같은 항목을 담는다. 성동구에서 지금 영업 중인 식용얼음 판매업소가 어디에 있고 언제 허가받았는지를 확인하려는 시민·사업자나, 식품 인허가 업소 현황을 분석하는 사람이 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 식품 인허가·위생 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드나 업소명·주소 매핑으로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 식용얼음을 전문적으로 제조 및 판매하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 식용얼음은 음료, 식품 등 다양한 소비처에서 직접 섭취되는 특성상 위생관리 및 안전한 유통이 매우 중요하여, 관련 업소의 행정적 관리와 영업 현황에 대한 투명한 정보 제공이 핵심 목적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 각 업소의 인허가 이력, 영업 개시 및 종료, 폐업 여부, 관리 상태 등 필수적인 행정정보를 확인할 수 있습니다. 성동구청 등 관할 행정기관이 정기적으로 정보를 점검·갱신해 데이터의 신뢰성과 최신성을 확보하였습니다. 본 데이터는 식용얼음업소의 위생 및 안전관리, 정책 수립, 시장 현황 분석, 소비자 정보 제공, 업계 연구 등 다양한 목적으로 활용할 수 있습니다. 관계 기관, 업계 종사자, 연구자, 시민에게 실질적이고 객관적인 자료를 제공하며, 데이터는 항상 최신 내용으로 정기적으로 갱신됩니다.
