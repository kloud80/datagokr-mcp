summary_user: 강원특별자치도 정선군에 신고된 일반음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업태명·인허가일자·영업자시작일·도로명/지번 소재지를 포함한다. 정선군에서 창업 입지를 보는 사업자나 분석가가 특정 읍·면에 한식·중식 같은 업태별 음식점이 몇 곳 있고 언제부터 영업했는지 확인하는 데 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어 다른 데이터와는 주소(도로명·지번)나 업소명으로 맞춰 이어야 하며, 정선군의 다른 식품위생업소 현황이나 위생 지정·행정처분 데이터와 붙일 때도 같은 방식으로 연결한다.
description_portal: 강원특별자치도 정선군 일반음식점 업소명, 소재지 등의 현황2025년 8월 25일 시점의 강원특별자치도 정선군 일반음식점 현황을 제공하는 데이터입니다.강원특별자치도 정선군 행정시스템 내 식품위생업소조회에서 신고된 일반음식점 전체를 제공하고 있으며데이터 내 기재 정보는 업종명, 인허가일자, 업소명, 소재지(도로명), 소재지(지번),영업자시작일, 업태명,데이터기준일자입니다.데이터 갱신은 매년 실시하며 데이터 기준일 이후 신규업체의 발생으로 데이터와 추후 현황이 상이할 수 있음을 알려드립니다.식품위생업소 전체에 대한 현황은 강원특별자치도 정선군 식품위생업소 현황 자료를 참고하시면 됩니다.
