summary_user: 경상남도 거제시 일반 음식점의 위생등급 지정 현황을 업소 한 곳당 한 행으로 담은 파일 데이터로, 업소명·도로명주소·지정시작일·데이터기준일자를 싣고 196건이 2024-07-01~2026-07-16 범위에 있다. 거제시에서 위생등급을 받은 음식점이 어디인지 알아보려는 시민이나, 지역별 지정 현황을 살피는 행정·분석 담당자가 쓴다. 도로명주소(address)를 조인 키로 삼아 다른 주소 기반 업소 자료와 이어 쓰며, 업소 인허가번호 필드는 이 파일에 없어 인허가 원장과는 주소로만 맞춰 볼 수 있다.
description_portal: 경상남도 거제시 내 일반 음식점을 대상으로 시행 중인 음식점 위생등급제 지정 현황을 수록한 공공데이터입니다. 음식점의 위생 상태를 평가해 등급(좋음, 매우 우수 등)을 부여함으로써 음식점 위생 수준 향상과 소비자 선택권 보장을 목적으로 합니다.데이터에는 업소명, 도로명 주소, 등급 지정 시작일, 데이터 기준일자 등이 포함되어 있으며, 위생등급 지정 현황을 지역별로 파악하거나 정책 수립에 활용할 수 있습니다. 이를 통해 시민들은 위생이 인증된 음식점 정보를 확인할 수 있고, 행정기관은 위생 수준 관리 및 개선 방향 설정에 참고할 수 있습니다.
