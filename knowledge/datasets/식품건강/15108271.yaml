summary_user: 서귀포시에서 지자체가 지정한 안심식당을 업소 한 곳당 한 행으로 담은 파일이며, 상호·우편번호·주소·업태·대표 메뉴·전화번호·지정연도가 들어 있다(약 60KB CSV, 활용신청 없이 내려받음). 관광객이나 시민이 '서귀포에서 덜어먹기 도구와 위생 수칙을 갖춘 고기국수집이 어디 있나'를 찾거나, 행정 담당자가 지정연도·업태별 안심식당 분포를 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 원장이나 다른 위생 지정 데이터와는 상호·주소를 맞춰 붙여야 하고, 지도 서비스와 연결하려면 주소를 좌표로 바꿔야 한다.
limits: 업소 인허가번호가 없어 인허가 원장이나 행정처분 이력과 바로 조인되지 않고, 상호·주소 문자열 매칭에 의존해야 한다. 범위는 서귀포시 한 곳뿐이라 제주시나 다른 시군구와 비교하려면 별도 데이터를 구해야 한다.
