summary_user: 서울특별시 중랑구에서 집단급식소 운영 업체와 계약해 음식을 조리·제공하는 위탁급식영업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장이며, 인허가일자·영업상태·폐업일자·주소·중부원점TM(EPSG:5174) 좌표 등을 포함한다. 급식 위탁업체를 찾는 학교·기업 담당자나 분석가가 '중랑구에서 현재 영업 중인 위탁급식업체는 어디이고 언제 인허가를 받았나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있으며, 다른 자치구의 같은 식품 인허가 데이터와 합쳐 상권·업소 분포 분석의 기초 원장으로 쓴다.
description_portal: '서울특별시 중랑구의 집단급식소를 설치 및 운영하는 업체와 계약에 따라 해당 집단급식소에서 음식류를 조리하여 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
