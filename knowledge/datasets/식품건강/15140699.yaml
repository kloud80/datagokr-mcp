description_portal: 이 데이터는 서울특별시 광진구 관내에서 「식품위생법」에 따라 제과점영업 인허가를 받아 운영 중인 업소의 현황을 제공합니다. 제과점영업은 빵류, 케이크, 과자류 등 제과·제빵 제품을 직접 제조하여 소비자에게 판매하는 업종으로, 위생적 제조 환경과 안전한 식품 제공을 위한 인허가 절차를 거칩니다.데이터에는 업소명, 소재지, 업종 구분, 인허가일자, 관리기관 정보 등이 포함되며, 이를 통해 관내 제과업소 분포 현황 파악, 지역 상권 분석, 식품안전 관리, 행정처리 지원 등 다양한 목적으로 활용될 수 있습니다.특히 베이커리류는 일상적 소비 빈도가 높고 어린이, 노약자 등 민감 소비계층이 많아, 위생관리 및 품질 기준이 중요합니다.※ 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위경도(WGS84)는 포함되어 있지 않아 지도 기반 분석 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 인허가 정보를 반영합니다.
