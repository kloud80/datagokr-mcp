summary_user: 광진구 내 음식점 중 위생등급을 지정받은 업소를 업소 한 곳당 한 행으로 담은 파일로, 지정기관·지정일자·위생등급·업소명·영업장 주소·업종을 포함하며 범위는 광진구 한 개 시군구입니다. 외식할 곳을 고르는 주민이나 방문객이 '광진구에서 위생등급이 높은 식당은 어디인가'를 확인하거나, 분석가가 업종·지역별 위생등급 지정 분포를 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어 식품 인허가 업소 원장 등과는 업소명·소재지 주소를 맞춰 연결해야 한다.
limits: 업소를 고유하게 식별하는 코드가 없어 다른 데이터와는 이름·주소 매칭으로만 이을 수 있고, 동명 업소나 주소 표기 차이로 오매칭이 생길 수 있다. 광진구 한 곳만 다루므로 다른 구나 서울 전체 비교에는 다른 자치구 자료를 함께 모아야 한다.
