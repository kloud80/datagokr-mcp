summary_user: 제주특별자치도에 있는 전통주 제조업체를 업체 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 1.7KB)로, 업체명·소재지(주소)·대표제품과 데이터 기준일자를 담는다. 제주 지역특산주나 민속주를 만드는 양조장이 어디에 있고 무엇을 만드는지 찾는 관광객·유통사업자·지역 주류 산업을 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 식품 인허가 업소 데이터와는 업체명이나 소재지 주소를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: '"제주특별자치도 내 소재하는 전통주제조업체 현황 데이터를 제공합니다.항목: 종류, 업체명, 소재지, 주종 *민속주: 국가무형문화재와 시·도무형문화재 보유자, 혹은 식품명인이 국산 농산물로 만든 술*지역특산주: 농민이나 농업법인 등 농업경영체가 직접 재배하거나 양조장 소재지 혹은 인근 시·군에서 생산한 농산물로 만든 술자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1045"'
