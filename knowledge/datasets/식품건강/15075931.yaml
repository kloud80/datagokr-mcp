summary_user: 인천보건환경연구원이 수산물을 대상으로 한 방사능·중금속·잔류동물용의약품·식중독균 검사 결과를 검사 분류별로 1월부터 12월까지 월별 수치와 연간 합계로 정리한 집계표다(CSV 약 544바이트의 작은 파일). 인천 시민이나 분석가가 "올해 인천에서 수산물 유해물질 검사는 항목별로 몇 건씩, 어느 달에 많이 이뤄졌나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 검사 분류명(분류)을 이름으로 맞추거나 같은 기관의 다른 식품안전 자료와 연도 기준으로 나란히 놓고 보는 방식으로만 이어 쓴다.
limits: 월별·분류별 집계표라서 개별 검체, 품목, 유통업소, 부적합 판정 건별 이력은 확인할 수 없다. 명세상 연간 단위로 만들어지고 이후 바뀌지 않는 파일이라 실시간 회수·판매중지 정보로 쓰기 어렵다. 다른 데이터와 붙일 공통 코드가 없다.
