summary_user: 농산물 안전성조사와 시험분석을 맡도록 지정된 전국의 농산물 안전성검사기관을 기관 단위로 담은 목록으로, 지정번호·지정일자·기관명·소재지·검사업무범위·유해물질항목·전화번호를 담는다. 농산물 유통업체나 생산자가 '잔류농약이나 특정 유해물질 검사를 맡길 수 있는 지정기관이 어디 있고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 식품안전 데이터와는 기관명(APPN_INSTT_NM)이나 소재지 주소를 이름 매칭해서만 연결한다.
description_portal: 해당 데이터는 농산물 안전성조사의 일부와 시험분석 업무를 전문적·효율적으로 수행하기 위해 지정된 농산물 안전성검사기관의 지정번호, 지정일자, 지정기관, 검사기관소재지, 검사업무범위, 유해물질항목, 전화번호 등에 대한 속성 정보를 제공하고 있습니다.해당 데이터를 통해 소비자들은 관심 있는 농산물의 안전성 검사를 수행하는 기관의 위치나 검사 가능 항목 등을 손쉽게 파악하고, 농산물 유통업체는 특정 농산물의 검사를 의뢰할 수 있는 기관을 편리하게 검색하며, 연구기관은 농산물 안전성 검사 동향을 분석하는 등의 효과를 기대할 수 있습니다.이를 통해 농산물 안전성 정보를 투명하게 공개하여 소비자의 알 권리를 충족시키고, 농산물 안전성 확보를 위한 다양한 민간 서비스 개발에 기여할 수 있습니다.
