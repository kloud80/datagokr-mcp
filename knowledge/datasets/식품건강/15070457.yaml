summary_user: 한국의료기기안전정보원이 관리하는 의료기기 품목별 규격의 관리 속성을 규격 건별로 담은 전국 단위 CSV 파일(약 11KB)이다. 포털 설명상으로는 일련번호, 명칭, 코드, 등록일자를 담는다. 의료기기 제조·수입업체나 인허가 담당자가 '이 제품군에 적용되는 품목별 규격이 무엇이고 언제 개정됐는가'를 확인해 시험 항목 정의와 심사 자료 준비에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 공통·개별규격 등 다른 자료와는 규격 명칭이나 코드를 직접 맞춰 이어 써야 한다.
description_portal: 본 데이터는 품목별로 정의된 규격의 일련번호, 명칭, 코드, 등록일자 등 관리 속성을 포함한다. 품목별 규격은 특정 의료기기 범주에 요구되는 기준을 세분화하여 제공하므로, 제품 설계, 시험 항목 정의, 심사 자료 준비의 기초자료로 유용하다. 데이터는 품목별 규격과 공통·개별규격 간의 상호관계를 체계적으로 관리하여 품질 점검과 심사 대응의 효율성을 높인다. 등록일자는 개정 이력 관리에 활용되며, 코드 체계는 정보 검색과 전산 등록 자동화를 지원한다. 데이터는 연간 주기 점검을 권장한다. 품목별 규격은 제품군 특성을 반영하며, 공통·개별 규격과 연결되어 심사 대응에 유효하다.
