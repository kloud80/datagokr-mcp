summary_user: 식품위생법상 기구·용기·포장지 제조업 영업소를 업소 단위로 담은 전국 인허가 원장으로, 대표자명·허가일자·인허가번호(LCNS_NO)·관할기관·업소명·전화번호·소재지 주소·업종명이 들어 있다. 식품 포장재 납품처를 찾는 식품 제조업체나 지역별 포장재 제조업체 분포를 보려는 분석가가 '우리 지역에 등록된 식품용 용기·포장지 제조업소는 어디인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 인허가 업소·행정처분·회수 데이터와는 인허가번호, 업소명·주소 매칭 또는 같은 기관 코드로만 연결한다.
description_portal: '식품위생법에 따른 기구.용기 포장 제조업 관련 정보입니다.*용기ㆍ포장지제조업: 식품 또는 식품첨가물을 넣거나 싸는 물품으로서 식품 또는 식품첨가물에 직접 접촉되는 용기(옹기류는 제외한다)ㆍ포장지를 제조하는 영업이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.'
