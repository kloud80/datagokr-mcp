summary_user: 부산광역시 서구에 영업신고된 네일미용업소를 업소 한 곳당 한 행으로 담은 파일(csv 약 3KB)로, 업종명·상호·도로명 주소·전화번호를 담는다. 서구 주민이 가까운 네일숍을 찾거나, 구청·분석가가 동네별 네일미용업 분포와 지도·점검 대상을 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 공중위생업소·인허가 데이터와는 도로명 주소나 업소명으로 맞춰 이어 써야 한다.
description_portal: '부산광역시 서구 관내에 영업신고 된 공중위생업소 중 네일미용업 현황입니다. 수집 항목에는 업종명, 업소명, 영업소 주소(도로명), 소재지 전화번호 등이 포함되어 있으며, 이를 통해 지역 내 네일미용업 분포 파악, 생활서비스 기반시설 현황 분석, 민원 대응 및 지도·점검 대상 관리 등 다양한 행정적 활용이 가능합니다.예시 데이터에는 ‘세린네일’, ‘읜희네일’, ‘썸네일’ 등 서구 지역에서 운영 중인 네일미용업소의 상호명과 도로명 주소, 연락처 정보 등이 포함되어 있습니다.** 항목별 설명업종명: 해당 사업체가 등록된 업종 정보(네일미용업)업소명: 네일미용업의 공식 상호명 정보영업소 주소(도로명): 해당 네일미용업소가 위치한 도로명 기반 주소이며, 괄호 안에 법정동 위치 정보를 제공소재지전화: 업소의 대표 전화번호로, 이용 문의·서비스 안내 등 편의를 위해 제공됨'
