summary_user: 서울 강서구에서 영업 중이거나 폐업한 유흥주점의 인허가 내역을 업소 한 곳당 한 행으로 담은 원장 데이터로, 인허가일자·사업장명·지번/도로명 주소·전화번호·영업상태·폐업일자·좌표(X, Y) 등을 포함한다. 주민이나 분석가가 "우리 동네에 영업 중인 유흥주점이 어디에 몇 곳 있고 언제 폐업했나"를 확인하거나, 창업자가 강서구 내 유흥업소 밀집도를 살펴보는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 개방서비스 코드(OPNSFTEAMCODE)·관리번호를 통해서만 이어 쓴다.
description_portal: 서울특별시 강서구 내에서 운영 중이거나 폐업한 유흥주점의 인허가 정보를 포함하는 데이터입니다. 유흥주점은 유흥종사자를 두거나 유흥시설(노래방 기기, 무대 등)을 설치하여 주류와 오락 서비스를 함께 제공하는 형태의 업소로, 주로 밤 시간대에 영업하는 특성을 갖고 있습니다. 해당 데이터에는 인허가일자, 사업장명, 주소, 전화번호, 영업상태 등의 정보가 포함되어 있어 유흥업소의 위치, 밀집도, 영업현황 등을 파악하는 데 유용합니다. 지역 치안 관리, 사회적 거리두기 정책 대응, 유흥업소 관련 민원 처리, 업종 분포 통계 분석 등 행정기관의 정책 수립 및 관리에 활용할 수 있으며, 외식 및 서비스업 관련 창업자에게도 시장 분석 자료로서 활용 가능합니다. 더불어 주민들은 불법 영업 여부나 생활 주변 환경을 파악하는 데 본 데이터를 참고할 수 있습니다.
