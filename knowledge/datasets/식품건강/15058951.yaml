summary_user: 경기도 친환경 인증 농산물(유기·무농약·저농약)의 인증 농가 수, 인증 면적, 출하량을 집계년도와 시도 단위로 정리한 집계 자료로, 개별 농가나 제품 단위 원천 기록은 담지 않는다. 농업 정책 담당자나 연구자가 '연도별로 유기농산물 인증 면적과 출하량이 어떻게 바뀌었나', '저농약 인증 농가 수가 줄고 무농약·유기로 옮겨갔나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 집계년도(SUM_YY)·시도명 같은 이름 매핑으로만 맞춰 붙이고, 품목제조보고번호·바코드 같은 제품 단위 키로는 식품 제품 DB와 연결되지 않는다.
description_portal: 이 데이터는 경기도 내에서 생산되는 농산물 가운데 친환경 인증을 받은 유기농산물, 무농약농산물, 저농약농산물의 집계 현황을 제공하는 자료입니다. 주요 항목에는 집계년도(SUM_YY), 시도명(SIDO_NM), 유기농산물생산농가수(ORGNIC_FRMPRD_FRMHS_CNT), 무농약농산물생산인증농가수(FREPESTC_FRMPRD_FRMHS_CNT), 저농약농산물생산인증농가수(SMEPESTC_FRMPRD_FRMHS_CNT), 유기농산물생산인증면적(ORGNIC_FRMPRD_AR), 무농약농산물생산인증면적(FREPESTC_FRMPRD_AR), 저농약농산물생산인증면적(SMEPESTC_FRMPRD_AR), 각 유형별 출하량(ORGNIC_FRMPRD_SHIPMNT_QTY, FREPESTC_FRMPRD_SHIPMNT_QTY, SMEPESTC_FRMPRD_SHIPMNT_QTY)이 포함됩니다.이 데이터는 친환경 농산물의 보급 현황을 파악하거나 농업 정책 수립, 친환경 농업 지원 제도 검토, 유통·소비 확대 전략 마련 등 다양한 방면에서 활용될 수 있습니다. 특히 지속가능한 농업 활성화, 친환경 인증제도의 효과 분석, 농업환경 개선 정책의 기초자료로 중요한 의미를 가집니다. 데이터는 Open API를 통해 제공되어 연구기관, 지자체, 유통업체 등에서 손쉽게 연계 분석이 가능합니다.
