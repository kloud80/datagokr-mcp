summary_user: 서울시농수산식품공사가 운영하는 공영 도매시장의 주요 품목 가격을 거래일·시장·품목·등급별로 담으며, 평균가격과 함께 전일·전년 가격, 전일대비 등락률, 거래단위를 제공한다. 장보기나 납품 단가를 정하려는 국민·식자재 사업자가 "오늘 가락시장 배추 상품 평균 도매가가 전일·전년보다 얼마나 올랐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 품목명·품목코드(PUM_CD) 이름 매핑이나 같은 기관 코드로만 잇는다.
limits: 포털이 아니라 서울 열린데이터광장(data.seoul.go.kr) 인증키를 따로 받아 호출 경로에 넣어야 한다. 바코드·품목제조보고번호 같은 제품 단위 키가 없어 식품 제품 DB와 직접 조인하지 못하며, 성격상 농산물 도매시장 가격 데이터에 가깝다.
