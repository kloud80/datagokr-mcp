description_portal: '서울시농수산식품공사의 주요 품목 가격 정보를 보여드립니다.- 주요정보 : 거래일, 시장, 품목명, 품목코드, 등급, 거래수량, 거래단위수량, 평균가격, 전일평균가격,  전년가격, 전일대비등락율, 거래단위, 등급단위, 중량단위, 등 정보 제공※ 제공부서 : 서울특별시 농수산식품공사 전산정보팀(02-3435-0359)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.(서울시 농수산식품공사 안내)서울시가 관할하는 가락도매시장, 양곡도매시장, 강서도매시장 등의 공영 도매시장 운영을 총괄하며, 친환경유통센터를 통해 유치원생 및 초·중·고교 급식 식재료 공급을 담당'
