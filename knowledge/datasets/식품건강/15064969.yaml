summary_user: 식품위생등급 평가 한 건마다 평가일자·평가계획일자·평가유형·점수·등급·점검불능 여부와 대상 업소의 업체명·대표자·주소·인허가번호를 담은 전국 단위 건별 평가 내역이다. 외식하는 국민이 가려는 음식점의 위생등급과 평가 시점을 확인하거나, 분석가가 지역별·유형별 위생등급 분포를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으나, 인허가번호(LCNS_NO)를 매개로 식품 인허가 업소 원장과 잇고 같은 기관의 위생 지정·행정처분 데이터와는 업체명·주소 매핑으로 연결한다.
description_portal: 식품위생등급평가관리에 대한 속성정보를 제공합니다. 속성정보로는 평가일련번호 , 평가계획일자 , 평가유형구분 , 평가일자 , 평가점수 , 평가등급 , 업소위치 , 인허가번호 , 업체명 , 대표자 , 주소 , 점검불능여부가 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
