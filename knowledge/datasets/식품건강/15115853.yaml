summary_user: 서울특별시 양천구 관내 식품소분업(완제품 식품을 나눠 다시 포장하는 업소) 인허가를 업소 한 곳당 한 행으로 담은 건별 원장으로, 업소명·인허가일·영업상태·폐업일·주소·소재지면적·종사자수·좌표(X, Y) 등을 포함한다. 양천구에서 지금 영업 중인 식품소분업체가 어디에 몇 곳 있는지, 최근 새로 허가받거나 폐업한 곳이 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 업종 인허가나 위생·행정처분 데이터와는 관리번호(MGTNO)나 개방자치단체코드 같은 기관 코드, 또는 업소명·주소 매칭으로 이어 쓴다.
description_portal: 본 데이터는 서울특별시 양천구에서 관리하는 식품소분업 관련 인허가 현황을 체계적으로 정리하여 제공하는 자료이다. 관내에서 식품의 보관·분할·포장 등의 소분 활동을 수행하는 사업체의 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 종사자수 등의 행정 정보를 포함한다. 이를 통해 지역 내 식품 위생 관리 수준을 파악하고 민원 처리의 투명성과 효율성을 높이는 데 기여한다. 또한 신규 영업자에게 관련 절차를 이해시키고 정책 수립을 위한 기초 통계 자료로 활용될 수 있다. 데이터는 최신 인허가 변동 사항을 반영하여 정기적으로 갱신되며, 이용자는 해당 정보를 바탕으로 식품 안전 관리 및 지역 영업 환경 분석을 보다 정확하게 수행할 수 있다. 아울러 본 자료는 행정기관 간 정보 공유를 촉진하여 현장 점검, 위생 관리 지도 및 불법 영업 예방 업무에 활용될 수 있으며, 지역사회 식품 안전 수준 제고를 위한 근거 자료로 기능한다.* 식품소분업-완제품 형태의 식품을 별도로 소분하여 포장하는 업소
