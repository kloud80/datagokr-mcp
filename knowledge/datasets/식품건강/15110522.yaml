summary_user: 대구광역시 서구가 어린이 기호식품 우수판매업소로 지정한 업소를 한 곳씩 담은 목록으로, 등록번호·업소명·도로명주소·연락처를 제공한다. 학부모나 학교 관계자가 학교 주변 어린이 식품안전보호구역 안에서 위생 기준을 갖춘 지정 판매점이 어디인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식품 인허가·위생 지정 데이터와는 업소명이나 도로명주소를 맞춰 이어야 한다.
description_portal: '입력 파라미터를 이용하여 대구광역시 서구_어린이기호식품 우수판매업소 현황의 등록번호, 업소 명, 도로명주소, 연락처 항목을 제공하는 서비스[법령명] 어린이 식생활안전관리 특별법 시행규칙(약칭: 어린이식생활법 시행규칙)[용어설명]어린이 기호식품 우수판매업소란, 어린이 식품안전보호구역(학교 및 그 주변 200m 이내) 내에서 어린이들이 즐겨 찾는 식품을 안전하고 위생적으로 조리·판매하는 업소 중, 일정한 시설 기준과 영양 관리 요건을 충족하여 지방자치단체장(시장·군수·구청장)으로부터 지정받은 업소를 말한다.어린이 기호식품 우수판매업소의 주요 요건1. 시설 기준 충족: 「어린이 식생활안전관리 특별법 시행규칙」 별표 2에 명시된 시설 기준을 갖추어야 합니다.  가. 청결한 환경: 내구성이 있는 건물 구조와 청결 유지가 가능한 환경 나. 위생 설비: 마시기에 적합한 물 공급, 배수 시설, 방충·쥐막이·환기 시설 다. 조리장 요건: 공개된 조리장, 입식 조리대, 냉장·냉동 시설, 식기 소독 설비 등2. 판매 제한 식품의 미취급: 고열량·저영양 식품 및 고카페인 함유 식품 등을 판매하지 않아야 합니다.3. 지속적인 위생 관리: 지정된 우수판매업소는 정기적인 위생 점검과 영양성분 표시 등 관리 기준을 지속적으로 준수해야 합니다.'
