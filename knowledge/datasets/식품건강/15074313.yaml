summary_user: 유전자변형식품등의 안전성 평가 심사 결과를 품목 한 건씩 담은 전국 단위 목록이다. 품목명, 상품명, 삽입된 유전자 내용, 부여된 특성, 업소명·대표자명, 허가일자, 통보번호, 제품종류가 들어 있다. 소비자나 수입·가공 사업자가 특정 GMO 작물이나 이벤트가 국내 안전성 심사를 통과했는지, 어떤 형질이 부여됐는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 식품 DB와는 업소명이나 품목명 같은 이름 매칭으로만 잇는다.
description_portal: 유전자변형식품 품목명, 상품명, 삽입된 유전자 내용, 업소명, 대표자명, 허가일자, 부여된 특성 내용, 통보번호, 제품종류 정보를 목록으로 제공합니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
