summary_user: 충청북도 공중위생서비스평가 결과를 업종(INDUTY)·구분·평가 항목 단위로 담은 API이며, 범위는 시도 단위의 비공간 데이터입니다. 공중위생업소 지도·점검 담당자나 분석가가 "충북에서 위생서비스 평가가 낮게 나온 공중위생 업종은 어디인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종명 같은 이름 매핑이나 같은 기관 코드로만 연결하며, 공중위생업소 인허가(LOCALDATA) 자료와 업종 단위로 대조하는 정도로 쓴다.
description_portal: 충청북도 공중위생서비스평가의 업종, 구분, 평가 점수를 기반으로 평가결과를 조회할 수 있는 Open API로, 공중위생 관련 업종의 위생·서비스 수준을 정량화한 정보를 입력 파라미터를 통해 확인할 수 있습니다. 제공되는 데이터에는 조회 결과와 관련된 요소가 함께 포함되어 있어, 데이터 활용자가 원하는 방식으로 효율적으로 검색·활용할 수 있습니다. 이 데이터는 업종별 위생관리 수준을 객관적으로 파악할 수 있어 현장점검 우선순위 설정, 취약 업종 지원정책 마련, 평가결과 공개를 통한 위생환경 개선 등 행정적 활용도가 매우 높습니다. 또한 연구자·민간에서는 지역별 공중위생 수준 비교, 소비자 안전정보 제공 서비스 개발 등 다양한 분야에서 활용할 수 있습니다.
