summary_user: 서울특별시 마포구에서 완제품 식품을 나누어 다시 포장하는 식품소분업 업소를 업소 단위 인허가 원장으로 담으며, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 포함한다. 마포구에서 영업 중인 식품소분업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 폐업했는지 확인하려는 사업자나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소 매핑이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 이어 쓴다.
description_portal: '서울특별시 마포구의 완제품 형태의 식품을 별도로 소분하여 포장하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
