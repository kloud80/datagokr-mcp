summary_user: 서울 강서구 관내 가축사육업 업소의 인허가 내역을 업소 한 곳당 한 행으로 담은 건별 원장으로, 인허가일자·취소일자, 영업상태와 상세상태, 휴업·폐업·재개업 일자, 소재지·도로명 주소, 전화번호, 사업장명, 좌표(X·Y)를 포함한다. 구청 담당자나 주민이 강서구에 현재 영업 중인 가축사육 시설이 어디에 몇 곳 있는지, 언제 허가받고 언제 폐업했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 개방서비스 코드(OPNSFTEAMCODE)·관리번호(MGTNO)로만 이어 쓴다.
description_portal: 서울특별시 강서구 가축사육업 인허가 정보는 강서구 관내에서 가축을 사육하여 생산을 목적으로 하는 업소들의 인허가 현황을 수록한 자료입니다. 본 데이터에는 인허가일자, 영업상태, 전화번호, 주소, 사업장명 등 기본 행정정보가 포함되어 있으며, 지역 내 축산업 운영 실태와 위생관리 현황을 파악하는 데 활용됩니다. 가축사육업은 식품의 원재료 생산과 밀접한 관련이 있어 공중위생, 환경보건, 동물복지 측면에서도 중요한 관리 대상입니다. 특히 도시 지역 내에서의 가축 사육은 관련 규제 준수 여부와 악취, 소음 등 생활환경에 미치는 영향에 대한 행정적 모니터링이 필요하며, 본 데이터는 관련 정책 수립과 사육시설 실태조사, 축산업 허가 및 관리 체계 마련의 기초자료로 사용됩니다.
