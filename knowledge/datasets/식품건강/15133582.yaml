summary_user: 식약처가 고시하는 잔류농약의 국내 잔류허용기준(MRL)을 농약과 식품(농산물·축산물) 조합별로 담은 기준 데이터로, 농약 국문·영문명, 식품 국문·영문명, 허용기준값(mg/kg)을 제공한다. 농산물 수입·유통 사업자나 검사기관이 '이 농약이 이 작물에서 몇 mg/kg까지 허용되는가'를 확인하거나, 분석가가 실측 잔류량과 기준을 대조해 부적합 여부를 판단하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 농약명·식품명 같은 이름 매핑으로만 연결하며, 부적합·수입식품 검사 데이터와 이어 볼 때도 이름 대조가 필요하다.
description_portal: 식품의약품안전처 유해물질기준과에서 고시하는 잔류농약의 국내 잔류허용기준 정보 제공. 농약 국문명, 농약 영문명, 식품 국문명, 식품 영문명, MRL(Maximum Residue Limit, 잔류허용기준) 등의 항목을 제공합니다. 농약 검색창이 있어 접속자가 찾고자하는 농약을 클릭하면 새 창이 뜨면서 농산물, 축산물별 잔류허용기준(단위 mg/kg) 수치 정보를 쉽게 찾아서 보여줍니다. 해당 기능을 이용하면 식약처의 식품의 기준 및 규격 고시에서 하나하나 찾아야하는 잔류허용기준을 보다 쉽고 빠르게 찾을 수 있는 장점이 있습니다.
