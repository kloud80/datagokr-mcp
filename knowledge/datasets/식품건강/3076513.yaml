summary_user: 부산광역시가 시중 유통 식품을 수거해 세슘·요오드 방사능 검사를 한 결과를 제품 건별로 담는 API로, 검사 연월·제품명·분류(가공식품·수산물·농산물)·원산지·검출 결과·적합/부적합 판정이 들어 있습니다. 소비자나 판매업자가 '일본산 수산물에서 세슘이 검출된 적이 있는가'처럼 원산지·품목별 방사능 검출 여부와 부적합 사례를 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 식품안전 데이터(회수·부적합·수입식품 등)와는 제품명·원산지 국가명 같은 이름 매핑으로만 이어 씁니다.
description_portal: 생활수준이 높아지고 안전한 먹거리에 대한 관심이 많아지고 있고 또 방사능 오염에 대한 관심이 높아져 시중에 판매되는 400여개 이상의 식품에 대한 방사능 검사 결과 정보 데이터를 개방합니다.개방된 데이터에는 식품의 분류(가공식품, 수산물, 농산물), 생산국가명, 제품명, 품목, 수거일, 원산지명, 수입국, 세슘검출량, 요오드 검출량, 적부 판정의 자료를 포함하고 있습니다원산지는 국내 679건, 일본 108건, 러시아 49건, 중국 45건, 미국 42건 베트남 19건 등 27개국 이상의 국가이고 각 제품에 대한 방사능 검사 결과정보를 제공합니다.요오드, 세슘 검출여부를 확인하고 적합, 부적합 판정을 한 데이터를 개방하고 있습니다판매업자들은 이 자료를 바탕으로 안전한 식품을 판매하고 소비자는 안심하고 소비할 수 있습니다.*기준일 2025.5.19 현재
