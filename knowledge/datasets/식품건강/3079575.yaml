summary_user: 광양시 관내 공중위생업소(미용업·숙박업·목욕업 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호·데이터기준일자를 담는다. 주민이나 사업자가 '광양시 안에 어떤 목욕탕·미용실이 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 업종별 업소 분포를 셀 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞춰 붙이거나, 같은 기관의 다른 위생 데이터와 이름 기준으로 이어 쓴다.
description_portal: 이 데이터는 공중위생업 현황을 제공하는 자료로, 업종명, 업소명, 업소 소재지(도로명), 소재지 전화번호 등의 정보를 포함하고 있습니다. 이를 통해 국민은 지역 내 위생업소의 위치와 연락처를 손쉽게 확인할 수 있으며, 미용업, 숙박업, 목욕업 등 다양한 공중위생업종의 현황을 파악할 수 있습니다. 행정기관은 본 데이터를 활용하여 위생업 관리 및 지도 점검, 정책 수립에 필요한 기초 자료로 삼을 수 있습니다. 또한 데이터 기준일이 명시되어 있어 최신성과 신뢰성을 확보하고, 공공데이터 개방을 통해 위생 행정의 투명성과 국민 편의성을 높이는 데 기여합니다.
