summary_user: 인천 계양구 안 위탁급식소를 업소 한 곳당 한 행으로 담은 소규모 CSV 파일(약 4.6KB)로, 업소명·도로명 및 지번 주소·소재지 전화번호·기준일자를 담는다. 구청 위생 담당자나 지역 주민이 '계양구에서 위탁급식을 운영하는 업소가 어디에 있고 연락처가 무엇인가'를 확인하거나 위생 점검 대상 목록을 만들 때 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없으므로, 다른 식품 인허가·행정처분 데이터와는 업소명과 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 인천광역시 계양구 내 위탁급식소에 대한 상세 정보를 포함하고 있습니다. 주요 항목으로는 업소명, 도로명 주소, 지번 주소, 전화번호가 포함되어 있으며, 개인정보 보호법에 따라 휴대폰 번호는 공개하지 않습니다. 해당 데이터는 급식소 위치 파악과 연락처 확인에 용이하며, 급식 관리 및 위생 감독, 지역사회 식품 안전 정책 수립에 활용됩니다. CSV 형식으로 제공되어 다양한 분석과 행정 업무에 활용할 수 있습니다. 데이터는 주기적으로 갱신되며, 공공데이터포털을 통해 무료로 다운로드할 수 있습니다. 이를 통해 지역 내 위탁급식소 현황을 효율적으로 관리하고 관련 서비스 개선에 기여할 수 있습니다.
