summary_user: 부산광역시 사상구에서 영업 중인 일반음식점(주류 판매 가능)과 휴게음식점(카페·분식 등, 주류 판매 금지)을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 소재지·전화번호를 제공한다. 사상구에서 창업을 준비하는 사업자나 상권 분석가가 '특정 도로나 동네에 카페와 술집이 각각 몇 곳 있는가' 같은 업소 분포 질문에 쓴다. 실측 컬럼에 인허가번호·사업자번호 같은 전역 조인 키가 없어, 다른 데이터와는 도로명 소재지를 주소 매핑하거나 업소명으로 맞춰 이어 써야 한다.
description_portal: '본 데이터셋은 부산광역시 사상구 행정구역 내에서 영업 중인 식품위생업소들의 최신 동향을 파악할 수 있는 공공데이터입니다. 주류 판매가 가능한 일반음식점과 차·디저트·분식 등을 취급하는 휴게음식점을 구분하여 수집하였으며, 각 업소의 정확한 상호명(업소명), 구체적인 위치 정보(소재지), 그리고 연락 가능한 전화번호를 체계적으로 구성하여 제공합니다. 이를 통해 지역 상권 분석, 소상공인 창업 연구, 공공 목적의 실태 조사 등 다양한 분야에서 기초 자료로 유연하게 활용하실 수 있습니다.일반음식점: 식사와 함께 식당 내에서 주류 판매가 가능한 곳 (예: 삼겹살집, 횟집, 일반 한식당, 포차 등)휴게음식점: 주로 다류(茶類), 아이스크림류를 조리·판매하거나 패스트푸드, 분식 등을 판매하며 주류 판매는 금지된 곳 (예: 카페, 편의점 내 조리 코너, 떡볶이집, 제과점 등)'
