summary_user: 광주 북구 관내 집단급식소를 업소 한 곳당 한 행으로 담은 CSV 목록으로, 업종명·업소명(학교·병원 등 급식소가 설치된 건물 기준)·도로명 소재지 주소(괄호 안 법정동 병기)·데이터기준일자를 담는다. 북구에서 어느 학교·병원·기관에 집단급식소가 있는지, 동별로 몇 곳이 분포하는지 확인하려는 주민·위생 담당자·분석가가 쓴다. 전역 조인 키나 인허가번호가 없으므로 다른 식품 인허가·위생 데이터와는 업소명·도로명주소 문자열 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 광주광역시 북구 관내 집단급식소현황 데이터입니다.업종명(집단급식소), 업소명, 소재지(도로명)주소, 데이터기준일자 항목에 대한 정보를 공공데이터포털에 CSV 파일로 제공하고 있습니다.* 업소명은 집단급식소가 설치된 건물(학교, 병원 등)을 기준으로 기재하였습니다.** 소재지(도로명) 컬럼에 기재한 주소는 모두 급식소가 위치한 장소(건물)의 도로명주소 기준으로 작성되었습니다. 단, 소재지(도로명) 컬럼의 각 셀마다 주소 끝부분에 추가로 별도 기재한 괄호 안의 지역 동명은 모두 법정동 기준으로 작성되었습니다.
