summary_user: 부산광역시 영도구 관내 식육즉석판매가공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종 구분·상호·지번 및 도로명 주소·전화번호가 들어 있다(약 5.5KB CSV). 영도구에서 고기를 직접 썰어 팔거나 양념육·소시지 등을 만들어 파는 정육점이 어디에 있는지 찾는 주민이나, 동네별 정육 업소 분포를 보려는 창업자·분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 식품 인허가·행정처분 데이터와는 상호명·주소를 맞춰 이어 써야 한다.
description_portal: 부산광역시 영도구 관내에 위치한 식육즉석판매가공업체 상호,  소재지(지번주소, 도로명주소), 전화번호에 대한 설명 자료입니다."식육즉석판매가공업"이란 식육 또는 포장육을 전문적으로 판매(포장육을 다시 절단하거나 나누어 판매하는 것을 포함한다)하면서 식육가공품(통조림ㆍ병조림은 제외한다)을 만들거나 다시 나누어 직접 최종 소비자에게 판매하는 영업을 말합니다.“식육(食肉)”이란 식용을 목적으로 하는 가축의 지육(枝肉), 정육(精肉), 내장, 그 밖의 부분을 말합니다.“식육가공품”이란 판매를 목적으로 하는 햄류, 소시지류, 베이컨류, 건조저장육류, 양념육류, 그 밖에 식육을 원료로 하여 가공한 것으로서 대통령령으로 정하는 것을 말합니다.식육즉석판매가공업은 허가제가 아닌 신고제입니다.필수요건으로 영업장 시설 기준 충족하고, 위생교육을 수료하여 관할 시군구에 신고합니다.필요한 서류는 영업신고서, 축산물위생교육 이수증, 임대차계약서 등입니다.
