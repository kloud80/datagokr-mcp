summary_user: 수입식품을 보관하는 보세창고를 창고 단위로 담은 API로, 전국 3,542건 규모이며 주소·지역코드와 식품·축산물·수산물 보관 가능 여부, 담당 기관명, 사용 종료일시 등을 담는다. 수입업체나 유통업체가 보관하려는 식품 종류에 맞는 보세창고의 위치와 관리 기관을 확인하는 질문에 쓴다. 조인 키는 주소(BNDWAS_ADDR)뿐이므로 주소가 있는 다른 식품 업소 데이터와는 주소 문자열로 맞춰 이어 쓴다.
description_portal: 식품의약품안전처 「수입식품 보세창고 정보」 OpenAPI는 수입식품을 보관하는 보세창고의 위치 및 역할 정보를 제공하는 공공데이터입니다. 제공 항목에는 보세창고주소, 지역코드, 식품·축산물·수산물 보관 가능 여부, 각 담당 기관명, 보세창고 전체코드, 공중위생기관 코드, 사용 종료일시 등이 포함되어 있어 특정 보세창고의 위치, 관리 주체, 해당 창고가 어떤 종류의 수입식품을 보관할 수 있는지 여부를 확인할 수 있습니다. 또한, 유통업체나 수입업체는 창고 선택 시 적합한 보관 조건을 가진 창고를 파악할 수 있습니다.
