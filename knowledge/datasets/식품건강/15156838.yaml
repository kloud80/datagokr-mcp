description_portal: 본 데이터는 원전 비상대응을 위한 내부오염 치료제 비축·보유 현황을 본부별로 정리한 자료입니다. 구분(근무자수기준/비축목표/보유수량_BOX/보유수량_EA/유효기간_BOX)과 상세현황명에 따라 상시·비상 근무자수 및 적정보유대상수, 품목별(Prussian Blue, Ca-DTPA, Zn-DTPA) 1일 투여량·기준인원·치료기간을 반영한 목표수량, 본부별 보유량(BOX·EA)과 합계, 유효기간별 보유량을 제공합니다. 이를 통해 재고 적정성 점검, 부족분 산정 및 구매·배분 계획, 유효기간 임박 품목의 선제 교체로 폐기 최소화, 방사선비상 대비 물자 운영 표준화에 활용할 수 있습니다. 제공항목은 구분, 상세현황명, 본부, 품목, 단위, 유효기간, 값입니다.
