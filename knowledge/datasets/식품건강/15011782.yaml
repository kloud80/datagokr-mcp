summary_user: 광주 서구 관내 공중위생업소(숙박·미용·세탁 등)의 신고 현황을 업소 한 곳당 한 행으로 담은 파일로, 업종명·신고일자·업소명·도로명/지번주소와 위도·경도를 포함한다. 주민이나 분석가가 "우리 동네 미용실·세탁소는 어디에 몇 곳 있고 언제 신고됐나"를 확인하거나 업종별 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 업소명 매칭으로 잇고, 같은 부문의 식품 인허가 업소 데이터와는 지역 단위로 나란히 비교하는 정도로 쓴다.
description_portal: 이 데이터는 광주광역시 서구 관내의 공중위생업소에 대한 신고 현황 정보를 담고 있으며, 숙박업소, 미용실, 세탁소 등 다양한 생활밀착형 업소의 정보를 제공합니다. 주요 항목으로는 영업자의 업종명, 신고일자, 업소명, 도로명주소 및 지번주소 등이 포함되어 있으며, 총 2,065건의 상세 정보가 수록되어 있습니다.본 데이터는 위생관리 정책 수립, 공중위생업소 지도 작성, 위생업소 분포 현황 분석, 업종별 밀집도 확인 등에 활용될 수 있으며, 특히 도로명주소와 지번주소가 병기되어 있어 공간정보시스템(GIS)과 연계한 행정동 단위 분석 및 민원 대응 자료로도 활용 가치가 높습니다.정기적인 연간 업데이트를 통해 최신 정보가 반영되며, 민원 대응, 정책기획, 위생 점검 대상 선정 등 보건행정 및 도시서비스 개선의 기초자료로서 유용한 공공데이터입니다.
