summary_user: 「수입식품안전관리 특별법 시행규칙」 개정('22. 11. 25. 시행) 이전의 텍스트 형태 한글표시사항을 수입신고 건별로 담고, 수입업체명·제품명(한글/영문)·유통기한·처리일자·해외제조업소·원재료명·수출국·제조국을 함께 제공한다(범위 전국, 검증 호출에서는 0행 수신). 소비자나 분석가가 특정 수입식품의 원재료와 유통기한, 제조국을 한글표시사항으로 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 수입식품·회수/부적합 데이터와는 업체명·제품명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
limits: 검증 호출에서 수신된 행이 0건이라 실제 응답 구조와 규모는 확인되지 않았다. 공통 조인 키가 없어 다른 데이터와의 연결은 이름 매칭에 의존한다. 개발계정은 일 10,000회 호출 제한이 있다.
