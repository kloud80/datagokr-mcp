summary_user: 식품위생법상 식품첨가물제조업(감미료·착색료 등 합성품, 천연 추출물, 혼합제재, 기구·용기 살균소독제 제조·가공) 인허가 업소를 업소 한 곳당 한 행으로 담은 전국 원장으로, 업소명·대표자명·인허가번호·허가일자·소재지 주소·전화번호·업종명·담당 기관명을 포함한다. 식품 제조사나 분석가가 특정 지역에 어떤 식품첨가물 제조업체가 있고 언제 허가받았는지 찾아 거래처나 공급망을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 인허가번호(LCNS_NO)나 업소명·주소 매칭으로 같은 기관의 위생 지정·회수/행정처분 데이터와 이어 쓴다.
description_portal: '식품위생법에 따른 식품첨가물 제조업 관련 정보입니다.*식품첨가물제조업: 감미료ㆍ착색료ㆍ표백제 등의 화학적 합성품을 제조ㆍ가공하는 영업, 천연 물질로부터 유용한 성분을 추출하는 등의 방법으로 얻은 물질을 제조ㆍ가공하는 영업, 식품첨가물의 혼합제재를 제조ㆍ가공하는 영업, 기구 및 용기ㆍ포장을 살균ㆍ소독할 목적으로 사용되어 간접적으로 식품에 이행(移行)될 수 있는 물질을 제조ㆍ가공하는 영업이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.'
