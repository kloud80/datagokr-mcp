description_portal: 서울특별시 중랑구 위생처리업 공중위생업소 현황입니다. 이 데이터에서 제공하는 정보 중 주요 항목으로는 시군구코드, 업종코드, 년도, 업소일련번호, 업종명, 신고일자, 업소명, 영업장면적, 소재지 전화번호, 영업자시작일 등 정보가 있습니다. 위생처리업 공중위생업소 현황 데이터의 카테고리는 공중, 위생 분야에 속합니다. 업종명에는 위생처리업이 있습니다. 제공부서는 중랑구 보건소 위생과입니다. 서울시 열린데이터광장 링크를 클릭하시어 데이터를 확인하여 주시기 바랍니다. 감사합니다.
