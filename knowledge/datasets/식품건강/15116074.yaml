summary_user: 서울특별시 강서구에서 집단급식소를 위탁받아 운영하는 위탁급식영업소의 인허가 내역을 업소 한 곳당 한 행으로 담으며, 사업장명·주소·인허가일자·영업상태·폐업일자·중부원점TM 좌표 등을 포함한다. 강서구 안에서 현재 영업 중인 위탁급식업체가 어디에 몇 곳 있는지, 언제 등록되고 폐업했는지를 확인하려는 급식 발주처·사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드로만 연결하며, 좌표는 EPSG:5174 기준이라 지도에 올리려면 좌표 변환이 필요하다.
description_portal: '서울특별시 강서구의 집단급식소를 설치 및 운영하는 위탑급식영업점 정보에 대한 인허가 정보입니다.*업체와 계약에 따라 해당 집단급식소에서 음식류를 조리하여 제공하는 업소강서구 내 위탁급식업체의 현황을 파악하는 데 활용됩니다주요 항목은 다음과 같습니다.사업장명: 업체의 공식 명칭주소: 사업장의 위치인허가일자: 위탁급식영업으로 등록된 날짜영업상태: 현재 영업 중인지 여부 (예: 영업중, 폐업)업태구분명: 업종의 세부 분류좌표정보: 중부원점TM(EPSG:5174) 좌표계 기준의 위치 정보이며 위경도 좌표는 제공하고 있지 않음'
