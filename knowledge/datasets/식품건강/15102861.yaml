summary_user: 국내에서 수거·분리된 식중독균 균주를 건별로 담으며, 세균명·검체유형·분리일자·수거지역·검출 유전자·혈청형 결과를 전국 범위로 제공한다. 연구자나 보건 담당자가 특정 식중독균이 언제, 어느 지역, 어떤 검체에서 분리됐고 어떤 유전자·혈청형 특성을 보였는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 식품안전 데이터와는 지역명·세균명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 식품의약품안전처 「식중독균 균주정보」 OpenAPI는 국내에서 수거·분리된 식중독균의 기본 특성을 제공하는 공공데이터입니다. 주요 항목에는 세균명, 검체유형, 분리일자, 수거지역, 검출 유전자 결과, 혈청형 결과가 포함되어 있습니다. 이를 통해 사용자는 특정 균주가 언제, 어디서, 어떤 검체에서 분리되었는지를 확인할 수 있으며, 유전자 및 혈청형 결과를 통해 병원체의 특성과 분포 양상을 파악할 수 있습니다. 연구자와 보건 전문가에게는 균주의 특성 분석, 유행 경로 추적, 감염병 대응 연구에 기초 자료로 활용될 수 있으며, 정책 담당자는 지역별 발생 현황을 토대로 식중독 예방 정책을 마련하는 근거자료로 참고할 수 있습니다.
