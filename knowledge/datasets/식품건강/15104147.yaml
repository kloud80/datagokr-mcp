description_portal: '위생등급이 지정된 업소의 업종, 명칭, 소재지, 지정등급, 지정일자, 전화번호 등을 수록한 데이터.음식점 및 서비스 업소의 위생 수준을 객관적으로 평가하여 안전한 외식 환경 조성과 주민 건강 보호, 위생 관리 행정 및 음식문화 개선 정책 등에 활용 가능하다.활용 목적 및 특징– 업소별 위생등급 지정 현황 및 분포 분석– 업종·소재지 기반 업소 특성 및 접근성 파악– 지정등급·지정일자 기반 위생 관리 추세 확인– 안전한 외식환경 조성 및 위생 정책 수립 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 업종: 업소의 영업 업종 구분(음식점 등)● 업소명: 위생등급이 지정된 업소의 명칭● 소재지(도로명): 업소의 도로명 주소● 지정등급: 업소에 부여된 위생등급(예: 매우우수, 우수 등)● 지정일자: 위생등급이 지정된 날짜● 전화번호: 업소 문의·연락을 위한 전화번호'
