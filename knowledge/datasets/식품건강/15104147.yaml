summary_user: 인천 부평구에서 위생등급을 지정받은 음식점 등 업소를 한 행씩 담은 원천 목록 파일(CSV 약 44KB)로, 업종·업소명·도로명 소재지·지정등급(매우우수·우수 등)·지정일자·전화번호를 담는다. 주민이 부평구에서 위생등급이 매우우수인 식당을 찾거나, 분석가가 동네·업종별 위생등급 지정 분포와 지정 시기 추이를 볼 때 쓴다. 인허가번호 같은 전역 조인 키가 없어서 식품 인허가 업소 원장 등과는 업소명·도로명 주소를 맞춰 이어 써야 한다.
limits: 인허가번호나 표준 코드가 없어 다른 데이터와 정확히 1:1로 연결하기 어렵고, 업소명·주소 문자열 매칭에 의존해야 한다. 범위는 부평구 한 곳뿐이라 인천 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다.
