summary_user: 식품 품목(품목코드·품목명)별로 식품 검사에 적용되는 개별 기준·규격을 검사항목 단위로 담는 전국 범위의 기준 데이터로, 최소·최대값과 단위, 규격값, 미생물 기준(n·c·m·M), 유효기간 같은 항목이 들어 있다. 식품 제조·수입 사업자나 분석가가 '이 품목은 어떤 검사항목을 어떤 기준치로 통과해야 하는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 품목코드(PRDLST_CD)·검사항목코드 같은 식약처 내부 코드나 품목명 매핑으로 같은 기관의 품목제조보고·부적합 정보와 연결한다.
description_portal: 이 자료는 식품의약품안전처에서 관리하는 식품 검사에서 적용되는 식품 개별 기준 및 규격에 관한 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
