summary_user: 대구광역시 북구 관내 어린이기호식품 우수판매업소를 업소 한 곳당 한 행으로 담은 명단으로, 운영형태·업소명·도로명주소·위도·경도를 포함하며 포털 설명상 2025년 11월 12일 기준 11개소입니다. 학부모나 학교 주변 먹거리 환경을 살피는 분석가가 '우리 동네 학교 근처에 어린이 기호식품 우수판매업소로 지정된 가게가 어디 있나'를 확인하는 데 쓴다. 인허가번호 같은 전역 조인 키는 없어 다른 식품 인허가 업소 데이터와는 업소명·주소로 맞추거나 위도·경도로 지도 위에 겹쳐 쓴다.
limits: 공통 조인 키가 없어 다른 데이터와 연결하려면 업소명·주소 매칭에 의존해야 하며, 범위는 북구 한 시군구에 한정된다. 업소 수는 포털 설명상 향후 달라질 수 있으므로 기준일(데이터기준일)을 확인해 쓴다.
