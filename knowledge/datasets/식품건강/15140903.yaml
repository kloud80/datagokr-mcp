summary_user: 서울 광진구에서 건강기능식품일반판매업 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 업소명·소재지 주소·인허가일자·영업상태·폐업일자·중부원점TM 좌표(X, Y) 등이 들어 있다. 구민이나 창업 준비자가 '우리 동네에서 영업 중인 건강식품 판매점은 어디이고 최근 폐업한 곳은 얼마나 되나'를 확인하거나, 분석가가 상권·식품안전 점검 대상을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·주소·업소명 매칭이나 같은 기관 코드로만 연결하며, 같은 형식의 다른 식품 인허가 업종 데이터와 나란히 쓰기 좋다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 건강기능식품일반판매업 인허가를 받은 업소의 현황을 제공하는 공공데이터입니다. 건강기능식품일반판매업은 건강기능식품을 제조하지 않고, 일반 소비자에게 직접 판매하는 형태의 소매점으로, 헬스샵, 약국, 마트 내 건강식품 코너 등 다양한 업태를 포함합니다. 본 업종은 건강기능식품유통전문판매업(제조자 의뢰 유통)의 형태와는 달리 자체 유통망이 없는 일반 판매처를 대상으로 하며, 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등 인허가 관련 정보가 수록되어 있습니다. 영양보조식품 관리, 식품안전 점검, 소비자 건강 정보 제공 등 행정 관리에 유용하게 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되지 않으므로 지도 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준 최신 자료로 주기적으로 갱신되며, 광진구 내 건강기능식품 유통 환경 파악에 기초 자료로 활용됩니다.
