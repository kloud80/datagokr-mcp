summary_user: 서울특별시 중랑구 안의 미용업소(헤어·메이크업·네일 등)를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호, 인허가일자, 영업상태와 폐업일자, 사업장명, 지번·도로명 주소, 중부원점TM(EPSG:5174) 좌표가 들어 있습니다. 동네에서 영업 중인 미용실을 찾는 주민, 중랑구 안의 미용업 개·폐업 추이나 상권 밀집도를 보려는 창업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 자치구의 같은 미용업 인허가 데이터와는 같은 컬럼 구조로 이어 붙여 쓴다.
description_portal: '서울특별시 중랑구의 헤어, 메이크업, 네일아트와 같이 얼굴, 머리, 피부 등을 손질하여 외모를 아름답게 꾸미는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
