summary_user: 서울특별시 중구의 헤어·메이크업·네일 등 미용업소를 업소 한 곳당 한 행으로 담은 인허가 원천 자료로, 사업장명·도로명/지번 주소·인허가일자·영업상태·폐업일자·건물 층수·중부원점TM 좌표(X, Y) 등을 포함한다. 시민이 "우리 동네 이 미용실이 지금도 영업 중인가, 언제 문을 열었나"를 확인하거나, 분석가가 중구 내 미용업소의 개업·폐업 추이와 분포를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소를 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중구의 헤어, 메이크업, 네일아트와 같이 얼굴, 머리, 피부 등을 손질하여 외모를 아름답게 꾸미는 업소 정보입니다. 해당 데이터에는 사업장명, 주소(도로명·지번), 건물층수, 인허가일자, 영업상태 등의 항목이 포함됩니다. 미용업은 공중위생관리법에 따라 시설기준을 충족해야 하며, 시술 공간과 대기 공간을 구분하고 위생 설비를 갖추어야 합니다. 종사자는 정기적으로 건강진단을 받아야 하며, 위생 점검 결과에 따라 행정처분이 내려질 수 있습니다. 본 데이터는 시민이 주변 미용업소의 운영 여부와 위생 상태를 확인하는 데 도움을 주고, 행정기관이 위생 관리·안전 점검·정책 수립에 활용할 수 있습니다. 자료는 정기적으로 갱신되어 최신 정보를 반영하며, 공공데이터포털을 통해 누구나 열람·활용할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
