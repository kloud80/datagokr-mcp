description_portal: '- 전라남도의 깨끗하고 친절한 모범음식점 정보(주소명, 업소명, 전화번호) 등에 대해서 공공데이터 목록을 찾아볼 수 있게 했습니다.- 전라남도에는 지역 특성을 살린 다양한 모범음식점이 운영되고 있습니다. 이들 음식점은 전통 음식의 계승과 지역 특산물 활용을 통해 관광객과 지역 주민들에게 사랑받고 있습니다.- 각 음식점의 자세한 정보와 예약은 해당 음식점의 공식 웹사이트나 전화 문의를 통해 확인하실 수 있습니다. 또한, 전라남도청 공식 홈페이지나 전라남도 관광정보센터를 통해 모범음식점 목록과 추천 정보를 얻을 수 있습니다.- 전라남도의 모범음식점은 지역의 전통과 특산물을 살린 다양한 요리를 제공합니다. 여행 중 지역의 맛을 경험하고 싶으시다면, 위의 음식점을 방문해 보시기 바랍니다.'
