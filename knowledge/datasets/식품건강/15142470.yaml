description_portal: 부천시의 모범업소는 위생, 서비스, 시설 등 다양한 기준을 충족하여 시에서 인증한 우수 음식점입니다.이 업소들은 평가를 통하여 청결한 환경과 친절한 서비스를 유지하며, 지역 식문화의 질적 향상에 기여하고 있습니다.해당 데이터는 부천시 관내 위치하는 모범업소의 업소명, 소재지도로명주소, 소재지지번주소, 전화번호, 데이터기준일자 정보를 제공합니다.모범업소란 위생, 서비스가 우수한 업소를 뜻하며, 일반음식점, 집단 급식소를 지정 대상으로 선정하였습니다.지정대상의 22개 항목을 평가 후, 85점 이상 및 좋은식단 실천 적합 업소를 모범업소로 지정하였습니다.※해당 데이터는 각 구청 산업위생과에 문의 부탁드립니다.
