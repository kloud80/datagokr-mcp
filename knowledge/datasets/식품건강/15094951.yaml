summary_user: 경기도 가평군 관내 유흥주점·단란주점을 사업장 한 곳씩 담은 목록으로, 업종명·사업장명·도로명/지번 주소·위경도·전화번호·데이터기준일자를 담는다(CSV 파일 약 11KB). 주민이나 분석가가 '가평군 어느 읍·면에 유흥·단란주점이 몰려 있는가'를 지도에서 확인하거나, 지역 안전대책과 업소 관리 현황을 살피는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어서 다른 데이터와는 사업장명·주소로 맞추거나 위경도로 공간 결합해 이어 쓴다.
description_portal: '본 데이터는 경기도 가평군 관내 유흥·단란주점의 사업장 정보를 수록한 자료입니다. 항목에는 업종명, 사업장명, 소재지 도로명주소 및 지번주소, 위도, 경도, 소재지 전화번호, 데이터기준일자 등이 포함되어 있으며, 일부 사업장의 경우 전화번호 항목은 공란으로 제공될 수 있습니다. 본 자료는 관내 유흥주점 및 단란주점의 분포 현황을 파악하고, 행정관리, 지역 안전대책 수립, 생활인프라 분석 등에 활용될 수 있습니다. 또한 위경도 정보는 지도 기반의 위치 분석 및 민원 응대, 업종 관리 정책 수립 등에 유용하게 사용됩니다. 해당 정보는 가평군 대표홈페이지 사전정보공표를 통해 정기적으로 제공되며, 공공서비스의 투명성 제고에 기여합니다.(가평군 대표홈페이지 사전정보공표URL : https://www.gp.go.kr/portal/contents.do?key=641)'
