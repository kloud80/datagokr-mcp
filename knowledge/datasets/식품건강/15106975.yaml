summary_user: 식약처 품목허가(신고)를 받은 한약재·한약(생약)제제의 회수·판매중지 건을 전국 범위에서 한 건씩 담으며, 업체명·주소·품목명·회수사유·제조번호·제조일자·유효기간·회수명령일자·공개마감일자를 포함한다. 소비자나 한의원·약국이 '지금 가진 이 한약재 제품이 회수 대상인가'를 품목명과 제조번호로 확인하거나, 분석가가 업체별 회수 이력을 살피는 데 쓴다. 실측에서 전역 조인 키를 찾지 못해 업체명·주소 같은 이름 매칭이나 같은 기관(식약처)의 다른 회수·행정처분 데이터와 업체 기준으로 이어 쓰며, 명세상 사업자등록번호(BIZRNO) 필드가 있으나 실측으로 확인되지는 않았다.
description_portal: ○ 식품의약품안전처의 품목허가(신고)를 득한 한약재 및 한약(생약)제제에 대한 회수 및 판매중지 정보를 제공하고 있습니다.○ 개방 데이터는 업체명, 주소, 전화번호, 품목명, 회수사유, 제조일자, 유효기간, 포장단위, 승인일자, 비고, 회수명령일자, 공개마감일자 12종입니다.○ 한약재 및 한약(생약)제제의 회수 및 판매중지 정보 제공을 통해 국민보건상의 위해를 사전에 방지하고 그 피해를 최소화하는 등 한약재 및 한약(생약)제제의 안전 사용에 기여할 수 있습니다. 아울러, 업계의 자율적인 품질관리 강화 및 유사 사례 재발 방지 노력을 유도함으로써 향후 소비자 신뢰도 향상시키는 긍정적인 영향이 기대됩니다.
