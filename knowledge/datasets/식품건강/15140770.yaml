description_portal: '일반음식점 및 집단급식소 중 위생관리 및 고객 서비스 수준이 우수한 업소를 지정(시군구코드, 지정년도, 지정번호, 신청일자, 업소명, 소재지 등등)이 데이터는 서울특별시 은평구 내 일반음식점 및 집단급식소 중 위생관리, 고객 서비스, 식품안전 등에서 우수한 업소를 “모범음식점”으로 지정한 현황을 제공합니다.각 업소의 지정년도, 업소명, 소재지(지번/도로명), 업태(업종), 지정번호, 지정일자, 취소일자, 전화번호 등 상세 정보를 포함합니다.본 데이터는 은평구 지역 내 위생수준 향상, 음식문화 개선, 외식업 창업 입지 선정, 관광객 편의 증대 등 다양한 목적으로 활용 가능합니다.컬럼 예시자치구명(예: 은평구), 지정년도(예: 2025), 지정번호(예: EPG-2025-01), 업소명(예: 서울맛집), 소재지(지번/도로명), 업태(예: 한식, 중식 등), 전화번호, 주요메뉴, 지정일자(YYYY-MM-DD), 취소일자(해당시)활용 예시청결·서비스 우수 매장 안내 및 홍보자료 제작지역 위생관리 정책 수립 및 집중 점검 구역 선정창업 입지 및 상권 분석, 소비자 식당 선택 정보 제공네이버 지도/공공플랫폼/관광서비스와 연계 자료 활용데이터 수집 및 최신성은평구청에서 정기 현장점검·업소신청 등으로 수집, 지정갱신 등 사항 즉시 반영CSV 등 개방형 표준 포맷 제공, 컬럼명 한·영 병기/통일기타 유의사항업소 현황은 행정 등록 및 지정일 기준, 일부 업소 변경/취소는 DB 반영 지연 발생 가능위치정보는 지번 및 도로명 모두 병기'
