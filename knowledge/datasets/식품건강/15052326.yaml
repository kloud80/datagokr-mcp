summary_user: 서울 관악구가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 파일(csv, 약 18KB)로, 지정년도·신청·지정일자, 업소명, 도로명·지번 주소, 주된음식, 면적, 행정동을 기록한다. 주민이나 방문객이 '관악구 신림동 근처에 모범음식점으로 지정된 한식집이 어디 있나'를 찾을 때, 분석가가 행정동별 모범음식점 분포를 볼 때 쓴다. 전역 조인 키나 인허가번호가 실측 컬럼에 없어서, 식품 인허가 원장 같은 다른 데이터와는 업소명·주소를 맞추거나 시군구코드로 묶어서만 연결한다.
description_portal: 본 데이터는 서울특별시 관악구 내 모범음식점 지정 현황을 정리한 자료입니다. ▲시군구코드 ▲지정년도 ▲신청·지정일자 ▲업소명 ▲소재지(도로명·지번) ▲주된음식 ▲면적 ▲행정동 항목으로 구성되어 있으며, 각 업소가 어떤 연도에 모범음식점으로 지정되었는지와 위치, 주요 취급 음식, 영업 면적 등을 체계적으로 확인할 수 있습니다. 이를 통해 관악구 지역의 위생관리 우수 업소 분포를 파악하고, 행정동별 업소 현황 분석이나 관련 정책자료 마련 시 참고정보로 활용할 수 있는 기반 데이터를 제공한다는 점에서 의미가 있습니다.
