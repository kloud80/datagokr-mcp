summary_user: 식품위생법 등을 위반해 행정처분을 받은 전국 식품접객업소를 처분 건별로 담은 데이터로, 업소명·업종·인허가번호·처분유형·처분내용·위반내용·위반법령·처분기간(영업정지 시)·처분기관을 포함한다. 소비자가 가려는 음식점이 영업정지 같은 처분 이력이 있는지, 분석가가 지역·업종별로 위반 유형이 어떻게 분포하는지 확인하는 데 쓴다. 실측상 전역 조인 키는 없어서, 식품 인허가 업소 데이터와는 인허가번호(LCNS_NO)나 업소명·주소 매핑으로 연결하고 같은 기관의 위생 지정·회수 데이터와는 업소 단위로 맞춰 쓴다.
description_portal: 식품의약품안전처_행정처분결과(식품접객업) 자료입니다. 식품위생법 등 위반으로 행정처분을 받은 식품접객업에 대한 속성정보를 제공합니다. 속성정보로는 업소명 , 업종 , 인허가번호 , 처분확정일자 , 처분시작일(영업정지의경우) , 처분종료일(영업정지의경우) , 처분유형 , 위반일자및위반내용 , 주소 , 전화번호 , 대표자명 , 처분내용 , 위반법령 , 공개기한 , 최종수정일 , 처분기관명 , 행정처분전산키가 있습니다.이 자료를 통하여 데이터 산업 활성화를 통한 일자리 창출, 국민의 알 권리 보장 및 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
