summary_user: 축산물 운반업으로 영업신고한 전국 업체를 업소 한 곳당 한 행으로 담은 신고 원장으로, 인허가번호·업소명·대표자명·업종·허가일자·소재지 주소·관할 기관명을 담는다. 축산물 운반 업체를 찾는 사업자나 지역별 축산물 운반업 신고 현황과 신규 신고 추이를 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 인허가번호(LCNS_NO)·업소명·주소를 맞추거나 같은 식약처 인허가·행정처분 데이터와 기관 코드로 연결해 쓴다.
description_portal: 축산물 운반업 영업신고 대장 관련 정보로 축산물 운반업으로 영업신고한 업체에 대한 속성정보 제공합니다. 속성정보로는 인허가 번호 , 업소명 , 대표자명 , 업종 , 허가일자 , 주소 , 기관명이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
