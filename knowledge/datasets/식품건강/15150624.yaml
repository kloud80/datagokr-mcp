summary_user: 식품의약품안전처가 제공하는 식품접객업 행정처분 결과를 재난안전데이터 공유플랫폼을 거쳐 처분 건별로 담으며, 범위는 전국입니다. 각 건에는 업소명, 업종, 인허가번호, 처분 확정·시작·종료일, 처분 유형과 내용, 위반 내용, 주소, 대표자, 처분 기관이 들어 있습니다. 소비자나 분석가가 "이 음식점이 영업정지 같은 행정처분을 받은 이력이 있는가"를 확인하거나 지역·업종별 처분 현황을 살펴보는 데 씁니다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 식품 인허가 업소 데이터와는 인허가번호(LCPMT_NO)·업소명·주소를 맞춰 보는 방식으로만 이어 씁니다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 통합하여 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 식품의약품안전처에서 제공하는 행정처분결과(식품접객업) 정보입니다.
