summary_user: 식품 수거검사 건별로 업종, 업소명, 소재지, 제품명, 수거일자, 판정결과, 수행기관명, 검사계획명을 담은 전국 단위 원천 데이터다. 소비자나 유통업자가 특정 제품·업소가 수거검사에서 적합 또는 부적합 판정을 받았는지 확인하거나, 분석가가 업종·수행기관별 검사 실적을 살펴보는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않았고, 품목제조보고번호(PRDLST_REPORT_NO)나 업소명·제품명으로 품목제조보고·인허가 업소·부적합 알림 데이터와 이어 쓴다.
description_portal: 식품의약품안전처에서 제공하는 식품수거검사 계획 및 실적 정보 자료입니다.식품수거검사 계획 및 실적 관련 정보 업종, 업소명, 소재지, 제품명, 수거일자, 판정결과, 수행기관명 등이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
