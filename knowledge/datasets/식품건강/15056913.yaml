summary_user: 경기도에서 소·돼지·닭·오리 등 축산물을 도축장에 출하하기 전에 실시한 생체 잔류검사(혈액검사로 항생제 등 잔류물질 확인) 결과를 집계년월·분기와 축종별로 모은 집계 자료이며, 검사 횟수와 검출 수, 각각의 누계를 담는다. 지자체 담당자나 연구자가 '경기도에서 어느 축종의 항생제 잔류 검출이 많은가, 분기별로 늘고 있는가' 같은 질문에 답할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 축종명·집계년월 같은 이름·기간 기준으로만 맞춰 붙일 수 있다.
description_portal: 이 데이터는 「축산물위생관리법」에 근거하여 경기도 내에서 축산물이 도축장으로 출하되기 전에 실시되는 생체 잔류검사 현황을 집계한 자료입니다. 검사 대상은 소, 돼지, 닭, 오리 등 주요 축종이며, 혈액검사를 통해 항생제 및 잔류물질이 체내에 남아 있는지를 확인합니다. 주요 항목에는 집계년월(SUM_YM), 집계년분기(SUM_YY_QU), 축종명(LVSTCKIND_NM), FPT검사횟수(FPT_INSPECT_CNT), 검출수(DETECT_CNT), FPT검사누계횟수(FPT_INSPECT_ACMTOT_CNT), 검출누계수(DETECT_ACMTOT_CNT)가 포함됩니다.이 데이터는 안전한 축산물 유통을 보장하기 위한 기초 자료로 활용되며, 항생제 남용 방지, 축산물 안전관리 시스템 고도화, 축산물 소비자 신뢰 제고에 기여할 수 있습니다. 지자체 및 연구기관은 축산물 안전 정책 수립, 축종별 위험도 평가, 축산농가의 위생 관리 개선 방안 마련 등에 본 데이터를 활용할 수 있습니다.
