description_portal: 경기도 양평군 내 건강맛집 현황영업 중인 양평군 내 건강맛집 데이터를 제공합니다.(업종명, 업소명, 소재지, 전화번호 등)건강맛집이란 차림표에 있는 음식별 영양성분(열량, 지방, 나트륨을 말한다)이 조례에 정하는 건강기준과 음식의 맛에 부합하여 인증된 업소를 말한다.해당 건강맛집은 격년주기로 재인증 평가를 걸쳐 건강한 영양성분 수치와 맛을 유지·관리하고 있습니다.평가시 1차로 현장평가를 실시하며 2차로 주 메뉴를 1인분씩 포장하여 영양성분 분석기관에 의뢰하여 기준에 맞는지 평가 후 건강맛집심의위원회에 심의를 받아 가결되어야 인증 또는 재인증을 받을 수 있습니다.업소 현황에 대해 자세한 사항은 양평군청 보건소 홈페이지에서 확인하시 바랍니다.https://www.yp21.go.kr/health/index.do
