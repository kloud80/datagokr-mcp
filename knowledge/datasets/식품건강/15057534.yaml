summary_user: 위생용품관리법에 따른 수입위생용품 영업신고 업소를 업소 단위로 담은 전국 대장으로, 업소명·대표자명·인허가 일자·인허가 번호·관할 기관·소재지·전화번호·업종명을 담는다. 수입 위생용품을 다루는 거래처가 신고된 업소인지, 어느 기관 관할이며 언제 신고했는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 식품 인허가·행정처분 데이터와는 업소명·주소·인허가 번호(LCNS_NO) 같은 이름·코드 매핑으로만 연결한다.
description_portal: 이 자료는 식품의약품안전처에서 관리하는 위생용품관리법에 따른 수입위생용품영업신고대장 자료입니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 및 일자리 창출 효과를 가져오며, 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다.또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립, 맞춤형 서비스 개발 기반 제공으로 국민 편의성을 향상 시킬 수 있습니다.
