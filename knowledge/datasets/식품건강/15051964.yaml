summary_user: 부산광역시 서구 관내 제과점영업 업소를 한 곳씩 담은 파일로, 업종명·상호·도로명 주소·대표 전화번호 4개 항목만 있다(csv 약 2.8KB 규모). 서구 주민이나 창업 예정자가 "서구에 제과점이 어디에 몇 곳 있고 연락처는 무엇인가"를 확인하거나 동네 상권 분포를 볼 때 쓴다. 인허가번호·사업자번호·좌표 같은 전역 조인 키가 없어서, 다른 식품 인허가·위생 데이터와는 상호명이나 도로명 주소를 맞춰서만 이을 수 있다.
description_portal: '해당 데이터는 서구 관내 제과점영업 업소의 기본 정보를 체계적으로 관리·활용하기 위해 구축된 것입니다.수집 항목에는 업종명, 업소명, 소재지(도로명 주소), 전화번호 등이 포함되어 있으며, 이를 통해 제과점 분포 파악, 지역 상권 분석, 식품위생 지도·점검 대상 관리 등 다양한 행정적 활용이 가능합니다.본 데이터에는 서구 내 주요 제과점(파리바게뜨, 지역 개인 제과점 등)의 주소와 전화번호가 포함되어 있어 지역 주민의 이용 편의 증진, 업종별 현황 분석, 민원 대응 기반 확보 등에 활용될 수 있습니다.업종명: 해당 업소가 등록된 영업 업종 유형을 나타냅니다.(제과점영업)업소명: 제과점의 상호명을 의미하며, 개인 운영 제과점부터 프랜차이즈 매장까지 포함됩니다.소재지(도로명): 업소가 위치한 도로명 주소로, 이용자 접근성 분석 및 지도 기반 시각화에 활용할 수 있습니다.소재지전화: 해당 업소의 대표 전화번호로, 문의·예약 등 이용 편의를 위해 제공되는 정보입니다.'
