summary_user: 서울특별시 중구에서 마트처럼 일정 규모 이상의 영업장에서 식품을 파는 식품판매업(기타) 업소를 업소 한 곳씩 담은 인허가 원장으로, 관리번호(MGTNO), 인허가일, 영업·폐업 상태, 소재지 주소, 중부원점TM 좌표 등을 포함한다. 중구에서 식품판매업(기타) 창업을 준비하는 예비 영업자가 '중구에 현재 영업 중인 대형 식품판매 업소는 어디에 몇 곳이 있나'를 파악하거나, 상권 분석가가 업소 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 부문의 다른 식품 인허가 업종 데이터와 나란히 놓고 비교하는 방식이 현실적이다.
description_portal: '서울특별시 중구의 제과점, 즉석판매제조가공업, 유통판매업 등에 속하지 않고 마트와 같은 일정 규모 이상의 영업장에서 식품을 판매하는 업소 정보입니다. 데이터는 각 영업자에게 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 식품판매업(기타) 창업을 희망하는 예비 영업자에게는 중구 지역의 시장 분석 및 소규모 신고 업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 소비자들에게는 법적 준수사항을 이행하며 공중위생 관리에 노력하는 신뢰할 수 있는 다품종 잡화 판매업소의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
