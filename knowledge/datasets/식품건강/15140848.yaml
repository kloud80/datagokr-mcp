summary_user: 서울 광진구에서 안경업 인허가를 받은 업소를 건별로 담은 원장으로, 업소명·소재지(지번·도로명 주소)·인허가일자·취소일자·영업상태·폐업일자·중부원점TM 좌표(X, Y)와 시력검사기·렌즈절단기 등 장비 보유 수, 시설 면적을 포함한다. 광진구에서 지금 영업 중인 안경점이 어디에 몇 곳 있는지, 최근 개업·폐업 흐름이 어떤지를 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 좌표는 EPSG:2097 기준이라 위경도 기반 지도 데이터와 겹치려면 좌표 변환을 거친다.
description_portal: 본 데이터는 서울특별시 광진구 내 안경업 영위를 위한 인허가를 받은 업소 현황 정보를 제공합니다.안경업은 「공중위생관리법」 및 관련 법령에 따라 인허가가 필요한 업종으로, 시력 교정용 안경 또는 보호용 안경의 판매, 제작, 수리 등을 전문으로 하는 업소를 의미합니다.제공되는 정보에는 업소명, 영업소 소재지, 인허가일자, 영업상태, 업종구분, 관할 행정기관 등이 포함되며, 해당 데이터는 시력보조기기 유통 관리, 소비자 선택 편의 제공, 지역 의료서비스 인프라 파악 등에 활용됩니다.또한, 지역 내 보건복지 서비스 분포도 분석, 안경점 밀도 시각화, 영업허가 갱신 모니터링 등 행정적 판단 자료로도 사용될 수 있습니다.※ 좌표는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 좌표는 포함되지 않습니다.※ 본 데이터는 3일 전 기준의 최신 인허가 정보를 반영하고 있습니다.
