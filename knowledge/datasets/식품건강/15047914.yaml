summary_user: 부산광역시 연제구에 있는 즉석판매제조가공업소를 업소 한 곳당 한 행으로 담은 명단이며, 업종명·업소명·도로명/지번 주소·연락처가 들어 있다(포털 설명상 2024.10.14. 기준, CSV 약 42KB). 반찬가게나 떡집처럼 직접 만들어 소비자에게 파는 업소가 동네 어디에 있는지 찾는 주민이나, 연제구 식품 소매 업소 분포를 보려는 분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키는 없으므로, 다른 식품 인허가·행정처분 데이터와는 업소명·주소를 맞춰 보거나 같은 연제구 자료끼리만 이어 쓴다.
description_portal: '부산광역시 연제구  즉석판매제조가공업소 현황(업소명, 소재지(도로명), 소재지(지번), 소재지전화)을  제공합니다.(2024.10.14.기준)즉석판매제조가공업: 식품을 제조, 조리하여 직접 최종 소비자에게 판매하는 영업이며, 유통이나 납품은 불가 주로 반찬가게, 떡집 등이 대표적임HACCP 의무 적용 식품과자(크림을 가열 ,살균하지 않고 그대로 섭취)빵류(크림을 가열, 살균하지 않고 그대로 섭취)당류(설탕, 포도당, 과당, 올리고당)식육함유가공품어육가공품(연육, 어묵, 어묵소시지 및 기타 어육가공품)두부류 또는 묵류식용유지류특수용도식품소스음료류(커피, 과일, 채소음료류, 탄산음료류, 두유류, 발효음료류, 인삼홍삼음료, 기타음료)동물성가공식품 중 추출가공식품빙과류즉석섭취식품즉석조리식품 중 순대유가공품, 식육가공품, 알가공품'
