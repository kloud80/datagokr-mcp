summary_user: 경기도 안의 정종·대포집(선술집) 형태 일반음식점을 업소 한 곳당 한 행으로 담은 인허가·영업현황 원장으로, 사업장명·인허가일자·폐업일자·영업상태·종업원 수·시설규모와 주소·좌표(WGS84)를 포함한다. 창업 예정자나 상권 분석가가 "우리 시군에서 지금 영업 중인 선술집은 어디에 몇 곳이고, 최근 몇 년간 얼마나 문을 열고 닫았나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군명·시군코드(SIGUN_CD)나 주소·좌표, 사업장명으로 같은 경기도 식품 인허가 업소 데이터나 다른 공간 데이터와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내에서 정종, 대포 등 주류를 중심으로 음식을 제공하는 일반음식점(선술집 포함)에 대한 인허가 및 영업현황 정보를 담고 있습니다. 주요 항목으로는 사업장명, 인허가일자, 폐업일자, 영업상태, 급수시설구분, 위생업종명, 위생업태명, 종업원 수, 다중이용업소 여부, 총시설규모, 소재지 주소 정보(WGS84 위도·경도 포함) 등이 포함됩니다. 해당 데이터는 선술집 형태의 영업장 현황을 파악하고자 할 때 유용하며, 주류 중심 외식업 동향 분석, 도시별 상권 구성 분석, 식품위생 및 안전 정책 수립 등에 활용될 수 있습니다. 데이터는 경기도 31개 시군 전체를 포괄하며 Open API를 통해 실시간으로 활용 가능합니다.
