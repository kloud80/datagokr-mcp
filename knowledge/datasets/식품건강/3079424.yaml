summary_user: 경기도 안양시 관내에 미용업으로 등록된 업소를 한 곳씩 담은 건별 현황 파일로, 업종(일반미용·피부미용 등), 업소명, 도로명 주소, 전화번호, 데이터 기준일을 수록한다. 시민이 동네 미용실·네일숍 연락처를 찾거나, 창업 예정자·분석가가 안양시 안에서 미용업이 어느 지역에 얼마나 몰려 있는지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞춰 보거나 같은 기관(안양시)의 다른 공중위생업소 현황과 이름 기준으로 이어 써야 한다.
limits: 범위가 안양시 한 곳뿐이라 다른 시군구와 비교하려면 지역별 파일을 따로 모아야 한다. 인허가번호 같은 공통 키가 없어 행정처분·인허가 데이터와 정확히 연결되지 않으며 주소·상호 문자열 매칭에 의존해야 한다.
