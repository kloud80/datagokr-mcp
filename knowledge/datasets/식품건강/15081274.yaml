summary_user: 식품공전에 등재된 식물·동물·미생물·수산물 식품원재료를 원재료 한 건씩 담은 목록형 데이터로, 대분류·중분류, 대표 원재료명, 이명, 영문명, 학명, 사용 부위, 상태, 사용조건과 그 기준 내용을 함께 담는다. 식품 제조·수입 사업자나 분석가가 "이 원재료를 이 부위·상태로 식품에 써도 되는지, 쓴다면 어떤 조건이 붙는지"를 확인할 때 쓴다. 공통 조인 키가 없으므로 다른 식품 제품·원재료 데이터와는 원재료명(RPRSNT_RAWMTRL_NM)·이명·학명 같은 이름을 맞춰 연결해야 한다.
description_portal: 식품원재료(식물,동물,미생물,수산물) 정보입니다. 식품공전에 등재되어 있는 식물성, 동물성, 미생물, 수산물의 식품원재료에 대한 속성정보를 제공합니다. 속성정보로는 대분류 , 중분류 , 원재료명 , 이명 , 영문명 , 학명 , 부위명 , 상태명 , 사용조건 , 사용조건기준내용이 있습니다.이 자료를 통하여 경제적으로는 신규 비즈니스 창출과 데이터 산업 활성화를 통한 창업 지원과 사회적으로는 국민의 알 권리 보장과 사회문제 해결 기여, 공공 가치 창출을 실현하는데 기여할 수 있습니다. 또한 식품안전 분야의 정보 투명성 제고, 식품산업 발전 지원, 데이터에 기반한 식품안전정책 수립으로 국민 편의성을 향상 시킬 수 있습니다.
