summary_user: 국민연금 가입자를 법정동 단위 지역·연령대·성별·가입종별(사업장·지역·임의계속·임의가입)로 나눠 평균예상연금액·평균납부금액·평균가입기간·구간 인원수 같은 집계값과 최고값을 조회 조건별로 돌려주는 통계 API다. 분석가나 지자체 담당자가 '우리 동네 40대 지역가입자의 평균 예상연금액과 가입기간은 얼마인가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 지역명·코드 매핑이나 같은 기관의 수급현황 등 국민연금 통계와 지역 기준으로 맞춰 잇는다.
description_portal: '(국민연금 가입현황 정보) 법정동단위 지역별,  연령대별, 성별(M:남자, F:여자), 가입종별(0:사업장, 1:지역, 2:임의계속, 5:임의가입) 가입자 통계 정보를 조회할 수 있습니다.1) 가입현황 정보조회(출력값): 평균예상연금금액, 가입내역구간인원수, 평균납부금액, 평균가입금액2) 최고값 정보조회(출력값): 최고예상연금금액, 인정최고금액, 인정최고개월수3) 연령별 정보조회(출력값): 평균예상연금금액, 인정평균금액, 인정평균개월수* 데이터 기준일 : 매월 초일** 연령 : 0 이외의 값을 입력하세요.자세한 내용은 참고문서(국민연금공단_오픈API활용가이드_국민연금 가입현황_v2.0.docx)를 활용하시기 바랍니다.'
