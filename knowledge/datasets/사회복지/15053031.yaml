summary_user: '공무원연금 가입자 수를 재직년수 구간(행)과 직종(열: 일반직·경찰·소방·교육직·법관검사·군무원 등 15개 직종과 기타, 합계)으로 나눈 전국 단위 집계표입니다. 공무원 인력의 재직기간 분포를 직종별로 비교하거나 장기 재직자 비중이 큰 직종을 파악하려는 연금·인사 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 직역연금 통계와는 직종명·재직구간 이름을 맞춰 이어 써야 한다.'
limits: 전국 집계만 있고 지역·개인 단위 분석은 할 수 없으며, 공통 코드 키가 없어 다른 데이터와 자동 조인이 되지 않는다. 포털 설명상 재직년수 33년은 만33년 재직자, '33년 초과'는 33년1월~33년11월 재직자를 뜻하고 '기타'에는 청원경찰·공익법무관 등이 섞여 있어 구간·직종 해석에 주의한다.
