summary_user: 서울 종로구에 있는 지역아동센터를 센터 한 곳당 한 행으로 정리한 현황 파일로, 센터명·상세주소·전화번호·전용면적·자료기준일자를 담는다(파일 크기 약 1KB의 소규모 자료). 종로구 주민이나 복지 분석가가 "우리 동네 근처 지역아동센터는 어디이고 공간 규모는 어느 정도인가"를 확인하거나 센터별 수용 여건을 비교할 때 쓴다. 전역 조인 키가 없어 다른 자치구 지역아동센터 현황이나 사회복지시설 공통 마스터와는 센터명·주소를 맞춰 대조하거나 같은 기관 코드로만 연결한다.
description_portal: 본 데이터는 서울특별시 종로구에 설치된 지역아동센터의 운영 현황을 정리한 자료입니다. 주요 항목으로는 센터명, 소재지 주소, 시설 면적, 전화번호 등이 포함되어 있으며, 아동복지 서비스 제공기관의 공간적 분포와 기본 정보를 파악할 수 있도록 구성되어 있습니다. 지역아동센터는 「아동복지법」 제52조에 따라 보호가 필요한 아동에게 돌봄, 학습, 정서 지원 등을 제공하는 아동복지시설로, 지역사회 기반의 복지 실현을 목적으로 운영됩니다. 본 데이터는 취약계층 아동의 서비스 접근성 평가, 센터별 수용역량 파악, 복지 사각지대 해소를 위한 정책 기초자료로 활용될 수 있습니다. 또한 사회복지 자원 배분, 인프라 개선, 유관 기관의 협업체계 수립 등 다양한 행정 및 민간 활용 분야에서 활용이 가능합니다. 데이터는 정기적으로 갱신되며, 공공데이터의 제공 및 이용 활성화에 관한 법률에 따라 개방됩니다.
