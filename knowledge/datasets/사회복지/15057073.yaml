summary_user: 경기도 시군별로 운영 중인 청소년 공부방을 독서실형·프로그램형 같은 유형별로 나눠 개소 수와 지원금액(천원 단위)을 집계 연월(SUM_YM) 기준으로 담은 집계 자료이며, 포털 설명상 31개 시군을 다룬다. 지자체 청소년 정책 담당자나 분석가가 '우리 시군의 공부방 개소 수와 지원금이 다른 시군과 비교해 어느 수준인가'를 따질 때 쓴다. 실측상 전역 조인 키는 없어서, 시군명(SIGUN_NM)이나 시군 코드(SIGUN_CD)를 이름·코드로 맞춰 경기도의 다른 시군 단위 청소년 시설 자료나 지역 통계와 잇는다.
description_portal: 이 데이터는 경기도 31개 시군에서 운영 중인 청소년 공부방의 월별 집계 현황을 제공하는 자료입니다. 각 시군별로 운영 중인 공부방의 유형(독서실형, 프로그램형 등), 개소 수, 지원금액(천원 단위) 등을 포함하며, 청소년 복지 증진을 위한 지역 기반 학습 공간의 운영 현황을 파악할 수 있습니다. 청소년 공부방은 방과 후 학습 및 휴식 공간을 제공하는 복지시설로, 교육적 접근성과 사회적 안전망 확보를 목적으로 운영됩니다. 해당 데이터는 연간 단위로 갱신되며, 청소년 정책 수립, 예산 배분, 복지 수요 분석 등의 연구 및 행정 자료로 활용할 수 있습니다.
