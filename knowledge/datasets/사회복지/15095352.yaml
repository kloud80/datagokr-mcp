description_portal: 공무원연금 자금운용사업 중 단기금융 자산의 월별 신용위험지표 시계열(2017년~기준년도) 자료로, 매해 월별 최대손실, 최대손실액을 측정합니다.VaR 기법을 통해 측정한 단기자금의 신용위험 지표입니다. 최대예상손실금액은 거래 상대방의 부도, 채무불이행, 신용등급 하락 등 신용위험 요인에 의해 발생할 수 있는 최대손실 금액(Total Loss)을 특정 신뢰수준(99.5%) 하에 추정한 값이며, 최대예상손실(%)는 해당 손실금액을 손실 노출금(Exposure) 대비 비율로 환산한 값으로 상대적 위험수준을 판단하는데 사용합니다.
