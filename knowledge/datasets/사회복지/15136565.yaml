description_portal: 본 데이터는 대구광역시 수성구청 공식 홈페이지에 등록된 전동휠체어 충전기 설치 위치 및 운영 현황을 정리한 자료로, 설치장소명, 도로명 주소, 위치 세부(건물 내외·주차장 등), 충전기 수량, 충전 방식(AC/DC, 출력 전압), 이용 가능 시간대, 이용 대상 안내, 등록일자 및 데이터 기준일자 등의 항목을 포함한다. 전동휠체어 충전기는 장애인 이동 편의를 지원하고, 이동권 보장과 포용적 교통환경 구축을 위해 필수 인프라로 설치되며, 본 자료는 설치 위치 및 접근 가능 시간, 충전 환경 정보를 제공하여 장애인 접근성 분석, 공공시설 이용 안내 강화, 민원 대응, 사회복지 정책 수립 등에 활용할 수 있다. 또한 충전기 수량과 운영 시간 데이터를 통해 장애인 이동 서비스 부족 지역 파악, 이용 편의 분석, 운영주기 및 유지보수 계획, 지역 복지 인프라 균등 배분 평가 등에 유용하다. 수성구청은 신규 설치 및 운영 시간 변경 시 데이터를 정기적으로 갱신하며, 본 자료는 복지 부서, 장애인 단체, 이동 지원 서비스 기획자, 일반시민 등 다양한 주체가 장애인 이동권 증진과 생활SOC 연계 기반 정보로 활용할 수 있습니다.
