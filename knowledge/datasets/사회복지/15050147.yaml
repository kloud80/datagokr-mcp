summary_user: 한국노인인력개발원 홈페이지에 올라온 노인일자리 모집 공고를 사업 단위로 담은 건별 파일로, 사업유형·사업연도·사업명과 모집·공고 기간, 담당자, 모집 인원을 전국 범위로 담는다. 구직 중인 어르신이나 가족이 '올해 공익활동형 노인일자리 모집이 언제 열리고 몇 명을 뽑는지' 확인하거나, 분석가가 사업유형별 모집 인원과 모집 시기를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명 같은 이름 매핑이나 같은 기관 자료(사업번호)로만 연결된다.
description_portal: 홈페이지에 공고한 노인공익활동형, 공동체사업단의 노인일자리 홈페이지 모집 기간, 담당자, 인원 등의 정보를 제공하는 데이터입니다.중요 모집 정보인 기간, 사업명 등 필요한 정보를 빠르게 파악할 수 있습니다. 모집 인원, 자격 요건 등을 명확하게 제시하여 모집 공고를 확인하고 인재를 확보할 수 있습니다. 사업 유형, 모집 기간, 근무 조건 등을 고려하여 일자리를 확인 할 수 있습니다. 객관적인 데이터에 근거하여 노인 일자리 정책 방향을 설정하고, 의사 결정의 정확성을 높일 수 있습니다. 공공데이터 개방 및 활용을 장려하고, 데이터 경제 활성화에 기여할 수 있습니다.
