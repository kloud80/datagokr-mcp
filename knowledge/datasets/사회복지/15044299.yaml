description_portal: '보건복지부 영유아 보육료 수급 아동 수 통계 자료로 2018년~2024년까지 연령별(0세, 1세, 2세, 3세, 4세, 5세이상)/시도별 정보를 제공하고 있습니다.<통계데이터 이용 시 참고사항>1. 영유아보육료：소득계층에 구분 없이 어린이집 이용 아동에 대하여 국가와 지방자치단체에서 보육료를 지원하는 것을 의미합니다.2. 각 자격별 아동 수3. 데이터 출처 : 교육부(보육통합정보시스템 내에 등록되어 있는 연령임)4. 데이터조사 대상 : 조사시점(매년 12월 31일)에 보육료 및 양육수당을 지원받는 아동 수'
