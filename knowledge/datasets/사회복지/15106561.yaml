summary_user: 정신건강사례관리시스템(MHIS)을 쓰는 광역·기초정신건강복지센터, 중독관리통합지원센터, 자살예방센터의 명단을 기관 한 곳당 한 행으로 담는다. 기관명·주소·전화·팩스·홈페이지·시도·시군구·사업자등록번호가 들어 있으며, 범위는 전국이고 위치는 개별 주소 단위다. 분석가는 우리 시군구에 정신건강복지센터나 자살예방센터가 몇 곳 있고 어디에 있는지 확인하는 데 쓰고, 지역별 분포와 서비스 공백을 살피는 데에도 쓴다. 사업자등록번호(bizno)를 키로 다른 기관·사업자 데이터와 잇고, 시도·시군구 이름으로 인구나 유병률 같은 지역 통계와 맞춰 본다.
description_portal: '한국사회보장정보원에서 제공하는 정신건강사례관리시스템(MHIS)의 사용기관 중 광역정신건강복지센터, 기초정신건강복지센터, 중독관리통합지원센터, 자살예방센터의 정보입니다.데이터 구성은 분류, 기관명, 우편번호, 주소, 상세주소, 기관번호1~3, 팩스번호1~3, 홈페이지, 시도, 기관분류, 시도_1, 시군구, 사업자등록번호 항목으로 구성되어 있습니다. 이 데이터를 활용하여 정신건강사례관리 관련 기관의 지역별 분포 및 서비스 네트워크 구축 현황 측면의 분석이 가능합니다.이러한 공공데이터를 통해 다음과 같은 데이터분석, 연구 등의 활용이 가능합니다.*단순 예시 사례이니,  참고바랍니다.○ 심화 분석-사용률 추이 분석: 월별, 연도별 시스템 사용 기관 수의 변화를 분석하여 정신건강 서비스의 확대 추이를 확인할 수 있습니다. 예를 들어, 특정 정책 시행 전후의 사용 기관 수 변화를 비교해 정책의 효과를 평가할 수 있습니다.-지역별 격차 분석: 사용 기관 수와 인구수, 정신질환 유병률 등을 비교하여 정신건강 서비스 접근성에 지역적 격차가 존재하는지 분석할 수 있습니다. 시스템 사용 기관이 적은 지역은 정신건강 사각지대일 가능성이 높습니다.-서비스 이용 현황 연계 분석: 사용 기관 정보와 함께 해당 기관에서 관리하는 사례 수, 서비스 제공 횟수 등 다른 데이터와 결합하여 분석할 수 있습니다.  예를 들어, 사용 기관이 많지만 실제 서비스 이용 건수가 적은 지역을 찾아내 서비스 활성화 방안을 모색할 수 있습니다.'
