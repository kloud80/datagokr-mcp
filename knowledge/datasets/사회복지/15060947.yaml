description_portal: 본 데이터는 발달재활서비스 및 언어발달지원사업에 관한 정보를 담고 있습니다. 우선 발달재활서비스란,  성장기의 정신적 ㆍ 감각적 장애아동의 기능 향상과 행동 발달을 위한 적절한 재활치료 서비스 지원 및 정보 제공합니다. 또한 높은 재활치료 비용으로 인한 장애아동 양육가족의 경제적 부담을 경감하고자 하는 취지의 사업입니다. 언어발달지원사업은 감각적 장애를 가진 부모의 자녀에게 필요한 언어발달지원서비스를 제공하여 아동의 건강한 성장지원 및 장애가족의 자체 역량 강화를 위한 사업입니다.
