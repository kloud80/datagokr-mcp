description_portal: 본 자료는 2025년 6월 말 기준, 부산광역시 수영구에 거주하는 만 65세 이상 복지대상자 현황을 집계한 데이터입니다. 수영구 관내 각 행정동별로 구분하여, 연령대별 인원 분포를 세분화함으로써 노년 1인 가구의 구성 및 특성을 보다 명확하게 파악할 수 있도록 구성하였습니다.자료는 주민등록전산시스템과 사회보장정보시스템을 연계하여 추출하였으며, 이를 통해 최신 행정정보 기반의 정확하고 신뢰도 높은 통계자료를 제공하고자 하였습니다.복지대상자 분류에 있어, 국민기초생활수급자는 생계급여 및 의료급여 수급자를 대상으로 하였으며, 저소득층은 차상위계층 및 주거급여 수급자를 포함하여 경제적 취약계층의 현황을 보다 정밀하게 반영하였습니다.또한, 전체 노인 인구수를 함께 수록하여 1인 가구 비율과 비교함으로써 수영구 내 독거노인 비율을 분석하였습니다.
