description_portal: 부산광역시 남구에는 총 15개소의 장애인복지시설이 설치·운영 중에 있으며, 이들 시설은 지역 내 장애인의 복지 향상과 자립 지원을 위한 다양한 서비스를 제공하고 있습니다. 해당 시설은 기능과 유형에 따라 복지관, 장애인거주시설, 직업재활시설, 공동생활가정, 주간보호센터 등으로 구분됩니다.각 시설은 「장애인복지법」에 따라 관할 행정기관의 설치신고를 완료한 정식 복지시설이며, 법정기준에 맞추어 설치일로부터 지속적인 운영을 통해 장애인의 삶의 질을 높이고 지역사회의 통합을 실현하고자 노력하고 있습니다.해당자료에는 장애인복지시설의 소재지, 설치신고일, 이용인원에 대한 자료가 포함되어있습니다.
