description_portal: 본 데이터는 경기도 이천시의 행정동 단위로 분류된 기초생활수급자 인원 현황을 기록한 자료로, 연도, 행정동, 인원수, 데이터기준일 항목으로 구성되어 있습니다. 기초생활수급자는 「국민기초생활 보장법」에 따라 생계, 의료, 주거, 교육 등의 급여를 지원받는 사회취약계층으로, 해당 자료는 복지대상자의 공간적 분포와 수급 인원 변화 추이를 파악하는 데 활용됩니다. 본 데이터는 이천시 복지정책 수립, 지역별 취약계층 밀집도 분석, 예산 편성 및 맞춤형 복지서비스 제공 기반 자료로 활용될 수 있으며, 월 단위 기준일이 포함되어 있어 시계열 분석 및 변화 추적에도 적합합니다. 또한, 민간기관이나 연구기관에서도 복지 사각지대 해소 및 지역 불균형 문제 분석을 위한 기초자료로 활용 가능합니다.
