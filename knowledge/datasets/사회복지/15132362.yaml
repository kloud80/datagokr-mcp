summary_user: 국제청소년성취포상제 참가자의 입회 변경 건마다 변경일련번호, 변경 요청·처리 일시, 변경 상태, 등록·수정 일시를 담은 건별 이력 데이터로, 범위는 전국이며 지역 구분이 없다. 포상제 운영 담당자나 분석가가 입회 변경 요청이 접수된 뒤 처리되기까지 얼마나 걸리는지, 어떤 처리 상태에 머물러 있는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 참가자·기관 식별자도 필드에 없어서, 다른 데이터와는 같은 기관의 포상제 관련 서비스와 이름·코드 매핑으로만 이어 쓴다.
limits: 필드에 참가자나 시도·시군구 정보가 없어 지역별 분석이나 개인별 이력 추적에는 쓰지 못한다. 데이터는 이벤트 때 생성된 뒤 바뀌지 않는 성격이라 주기적 갱신을 기대하기 어렵고, 변경상태코드의 코드표가 제공되지 않아 상태값 해석에 주의해야 한다.
