description_portal: 이 데이터는 전국 공공형 어린이집의 유지 현황을 서울을 제외한 지역별로 정리한 자료입니다. 번호 항목에는 국공립 어린이집, 사회복지법인 어린이집, 법인단체 등 어린이집, 직장 어린이집, 그리고 공공형 어린이집 구분이 포함되어 있습니다. 각 지역별로 부산, 충북, 충남 등 시도 단위로 운영주체별 어린이집 수가 집계되어 있습니다. 이를 통해 특정 지역에서 어떤 유형의 어린이집이 유지되고 있는지 기본적인 규모를 확인할 수 있으며, 전국적으로 운영주체별 분포를 비교할 수 있습니다. 활용 방법으로는 지역별 운영주체별 시설 수를 비교하거나, 각 유형의 비중을 계산하는 수준에서 사용할 수 있습니다. 또한 특정 지역의 국공립, 사회복지법인, 법인단체, 직장 어린이집 수치를 확인하여 해당 지역의 보육 인프라가 어떤 운영주체 중심으로 구성되어 있는지 기초적으로 파악할 수 있습니다.
