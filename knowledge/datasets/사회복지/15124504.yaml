description_portal: '- 전라남도 내 푸드뱅크 운영 사업장 현황(사업장명, 운영주체, 주소, 연락처, 신고일) 등에 대한 정보를 조회하실 수 있습니다.- 전라남도 푸드뱅크는 지역 내 저소득층과 취약계층에게 식품을 지원하는 공공 복지 서비스입니다. 이 사업은 전라남도와 각 시군이 협력하여 운영하며, 기부받은 식품을 취약계층에 전달하여 식생활 향상과 복지 증진을 목표로 합니다.- 전라남도 푸드뱅크는 지역 사회의 나눔 문화 확산과 취약계층의 복지 향상을 위해 중요한 역할을 하고 있습니다. 기부자와 수혜자가 함께하는 따뜻한 사회를 만들어 가는 데 많은 관심과 참여를 부탁드립니다.- 운영 주체 : 전라남도청 및 각 시군청- 지원 대상 : 기초생활수급자, 차상위계층, 독거노인 등 취약계층'
