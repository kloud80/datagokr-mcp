summary_user: 전국과 경기도의 장애인연금 대상자 수, 수급자 수, 대상자 대비 수급률(%)을 기준연도(STD_YY)별로 나란히 담은 시도 단위 집계 자료이며, 건별 수급자 정보는 없다. 경기도 복지 담당자나 정책 분석가가 "경기도의 장애인연금 수급률이 전국 평균보다 낮은가, 그 격차가 해마다 어떻게 바뀌는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 시도 이름으로만 맞춰 이어 붙여야 한다.
description_portal: 이 데이터는 전국 및 경기도 장애인연금 대상자와 수급자 현황을 비교·분석할 수 있는 집계 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 장애인연금 대상자 수, 수급자 수, 그리고 대상자 대비 수급률(%)을 제공합니다.장애인연금은 국민연금 가입 여부와 무관하게 만 18세 이상의 등록 중증 장애인에게 지급되는 연금으로, 기초생활 보장과 장애인의 경제적 자립을 지원하는 목적을 가집니다. 이 데이터는 전국 전체 대비 경기도의 비율을 확인할 수 있어, 지역별 복지 수급 격차와 장애인 복지 정책 집행 수준을 평가하는 데 유용합니다.예를 들어, 경기도의 수급률이 전국 평균보다 낮다면 신청 절차, 수급 요건, 정책 홍보 부족 등의 원인이 있을 수 있으며, 반대로 높다면 경기도의 복지 행정 접근성이 우수함을 의미할 수 있습니다. 따라서 이 자료는 장애인연금 제도 개선, 복지 수요 예측, 지역 간 형평성 분석 등 다양한 정책적 활용이 가능합니다.
