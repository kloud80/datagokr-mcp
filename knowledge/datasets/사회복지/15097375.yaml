summary_user: 용인시에 등록된 장애인을 지역(area)·구분별로 묶어 전체·남성·여성 인원과 경증·중증별 남녀 인원을 기준연월(crtr_ym)과 함께 담은 집계 현황 API다. 복지 담당자나 연구자가 '용인시 어느 지역에 중증 장애인이 많고 성별 구성은 어떤가'를 파악해 지원 대상 선정이나 시설 배치를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
limits: 개인별 원천 자료가 아닌 지역·구분 단위 집계이며, 공통 행정코드가 없어 다른 통계와 붙이려면 지역명을 직접 맞춰야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
