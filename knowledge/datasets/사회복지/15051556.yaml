summary_user: 경기도 수원시 관내 아동복지시설(아동양육시설·아동공동생활가정)을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 2.5KB)로, 시설명·시설종류·도로명/지번 주소·위경도·전화번호·정원·관리기관·기준일을 담는다. 수원시 담당자나 분석가가 "어느 동네에 아동양육시설이 몰려 있고 정원은 얼마인가"를 확인하거나, 후원·봉사단체가 연락할 관내 시설을 찾는 데 쓴다. 전역 조인 키는 없어 시설명·주소 문자열이나 위경도 좌표로 다른 사회복지시설 목록·지도 데이터와 맞춰 붙인다.
description_portal: 경기도 수원시 아동복지시설(아동양육시설,아동공동생활가정) 시설명칭, 시설종류, 소재지(도로명주소, 지번주소, 위경도), 전화번호, 정원, 관리기관 정보를 포함합니다. 아동복지시설 분포를 파악해 시설 수요, 공급 불균형을 개선하고, 지원 정책을 세밀하게 설계할 수 있습니다. 또한 시민들이 관내 아동복지 인프라 현황을 파악하고, 공동체 차원의 관심과 참여를 높일 수 있습니다. 민간단체, 봉사단체가 시설 현황을 확인해 후원이나 자원봉사 활동을 체계적으로 연결하면 좋은 효과를 볼 수 있습니다. 또한 아동의 안전, 사생활 보호 문제가 있기 때문에 공개범위와 방식은 매우 신중해야 합니다.
