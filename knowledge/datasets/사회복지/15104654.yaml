summary_user: 서울특별시 종로구에 있는 노인복지관·노인요양시설·노인요양공동생활가정을 시설 한 곳당 한 행으로 담은 파일(csv, 약 7KB)로, 시설유형·시설명·도로명주소·전화번호·홈페이지를 포함한다. 종로구 주민이나 가족이 '집 근처에 어떤 노인요양시설이나 복지관이 있고 연락처는 무엇인가'를 찾을 때, 또는 분석가가 구 안의 노인복지시설 분포와 접근성을 살필 때 쓴다. 실측 컬럼에 전역 조인 키나 시설코드가 없어 다른 데이터와는 시설명·도로명주소 매칭으로만 이어야 하며, 건강보험 장기요양기관 목록이나 시군구 단위 지역 통계와 맞대어 쓰는 것이 자연스럽다.
description_portal: 본 데이터는 서울특별시 종로구에 소재한 노인복지관, 노인요양시설, 노인요양공동생활가정의 현황을 제공하는 자료입니다. 각 시설의 도로명 주소, 홈페이지 주소, 전화번호, 주요 이용시설 정보, 주차장 면수 등의 세부 항목을 포함하고 있습니다. 자료는 고령 인구의 복지 향상과 편의 증진을 위해 수집되었으며, 시설 위치 파악, 접근성 분석, 서비스 제공 범위 검토 등 행정 계획과 정책 수립에 활용됩니다. 또한, 대상 시설의 분포 현황을 기반으로 신규 시설 설치, 기존 시설 확충 및 환경 개선 등 다양한 복지 행정 업무에 참고할 수 있습니다. 본 데이터는 종로구청이 현장 조사와 기관 제출 자료를 바탕으로 작성하며, 「노인복지법」 및 관련 지침에 따라 관리됩니다.
