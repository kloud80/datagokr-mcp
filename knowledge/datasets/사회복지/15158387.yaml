description_portal: '본 데이터는 2025년 기준 고창군 읍·면별 공동급식 시행 마을 현황을 집계한 자료로, 각 행정구역별 공동급식 운영 규모를 파악할 수 있도록 제공됩니다. 데이터는 읍·면 단위로 공동급식을 시행하고 있는 마을 수를 기준으로 구성되어 있으며, 지역별 복지 수요 분석 및 노인복지 정책 수립을 위한 기초자료로 활용할 수 있습니다.데이터 구성은 번호, 시도명,  시군구명, 행정동명, 공동급식 시행 마을수 항목으로 이루어져 있으며, 행정구역별 공동급식 운영 현황을 확인할 수 있습니다. 해당 자료는 복지사업 수행 과정에서 집계된 행정자료를 기반으로 작성되었습니다.본 데이터는 지역별 공동급식 운영 분포를 공시적으로 분석하거나, 특정 지역의 복지 수요 및 서비스 제공 현황을 파악하는 데 활용할 수 있습니다. 또한 공공데이터를 활용하여 다음과 같은 분석 및 연구에 활용이 가능합니다.(단순 예시 사례이므로 참고 바랍니다.)○ 지역별 분포 분석: 읍·면별 공동급식 시행 마을 수를 통해 지역 간 복지서비스 제공 격차를 파악하고 정책 수립에 활용할 수 있습니다.○ 공동급식 운영 규모 파악: 마을 단위 공동급식 운영 현황을 분석하여 향후 사업 확대 및 개선 방향 설정에 활용할 수 있습니다.○ 노인복지 지원 분석: 공동급식 운영 현황을 기반으로 노인복지 서비스 제공 수준 및 사각지대 해소를 위한 기초자료로 활용할 수 있습니다.'
