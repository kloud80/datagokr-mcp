description_portal: '전북 특별자치도 진안군의 출산장려금 지원에 대한 공공데이터 자료입니다. 이번 자료에서는 해당 시군구명, 지원 명, 지원 대상, 지원 금액(신청 첫 달, 12개월째, 24개월째, 36개월째, 단위 : 만원), 신청 절차, 구비서류 정보를 제공합니다. 이 자료를 통해 임신부가 출산할 시 지원받을 수 있는 지원금을 확인할 수 있습니다. 지원 대상 정보를 통해 당사자가 지원받을 수 있는지 알아볼 수 있으며, 기준 개월을 통해 각각 얼마씩 받는지도 확인할 수 있습니다. 또한 구비서류를 통해 필요한 서류가 무엇인지 알 수 있으며, 신청 절차를 통해 서류가 접수되면 어떤 식으로 진행되는지도 확인할 수 있습니다. 이 자료는 7월 말에 현행화하여 제공합니다.'
