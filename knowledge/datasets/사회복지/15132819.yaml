summary_user: 청소년 자기도전포상제의 심사 회차별 일정 정보를 회차 단위로 담으며, 심사차수명·심사명, 접수 시작·종료일시, 심사 시작·종료일시, 심사장소, 진행상태를 전국 범위로 제공한다. 포상제 참여 청소년이나 지도자가 '다음 심사 접수는 언제 시작하고 어디서 심사하나'를 확인하거나, 운영 담당자가 회차별 접수·심사 기간 분포를 살펴 운영 주기를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 심사명·장소명 같은 이름 매칭이나 같은 기관(성평등가족부) 청소년 활동 데이터와의 수동 연결로만 이어 쓴다.
description_portal: 청소년 자기도전포상제 심사 회자 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 수정일시, 심사차수명, 심사명, 접수시작일시, 접수종료일시, 심사 시작 및 종료 일시, 심사장소명, 진행상태코드, 등록일시의 정보를 확인할 수 있습니다.접수 기간과 심사 일정의 시기별 분포를 분석해 적절한 운영 주기를 설정하거나, 특정 회차의 운영 방식을 개선하는 데 도움을 줍니다. 진행 상태에 따른 분류를 통해 일정 조율, 심사자 배치 등의 실무적 판단이 가능하며, 심사 운영의 정교화 및 회차별 효율성 분석을 위한 데이터로 유용하게 활용될 수 있습니다.
