summary_user: 경기도 시군의 등록장애인 수를 읍면동·장애유형별로 묶어 합계·남녀, 심한 장애·심하지 않은 장애 인원으로 나눠 담은 집계 자료다. 지자체 복지 담당자나 분석가가 '우리 동네에 심한 시각장애인이 몇 명이고 남녀 구성은 어떤가'를 확인해 복지시설·이동지원 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 시군·구·읍면동 이름을 맞추거나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 경기도 내 시군에서 등록된 장애인의 수를 읍면동별, 장애유형별, 장애정도별, 성별로 구체적으로 집계한 현황 자료입니다. 주요 항목으로는 시군명, 구명, 읍면동명, 장애유형(지체, 시각, 청각 등), 등록장애인수(합계, 남성, 여성), 심한장애인수, 심하지 않은 장애인수 등이 포함되어 있으며, 각 항목은 모두 성별로 세분화되어 있어 정밀한 인구 통계 분석이 가능합니다. 이 데이터는 지역사회 내 장애인의 분포와 특성을 파악할 수 있게 해주며, 지역 맞춤형 장애인 복지정책 수립, 이동권 및 접근성 개선 계획, 의료 및 복지 인프라 조정 등 다양한 정책적 활용이 가능합니다.
