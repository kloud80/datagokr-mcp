summary_user: 도로교통공단이 집계한 65세 이상 보행노인 교통사고 다발지역을 지역 한 곳당 한 행으로 담으며, 사고건수·사상자수·사망자수·중상자수·경상자수·부상신고자수와 위치 정보가 함께 들어 있고 범위는 전국이다. 지자체 교통안전 담당자나 분석가가 '우리 시군구에서 노인 보행사고가 몰리는 지점은 어디이고 사망·중상 피해가 얼마나 큰가'를 확인해 보호구역 지정이나 시설 개선 우선순위를 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시도·시군구명(CTPV_SGG_NM)이나 지역 코드로 보이는 필드를 이름·코드 매핑으로 맞추거나 같은 기관의 다른 교통약자 사고다발지 데이터와 함께 연결해야 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 도로교통공단에서 제공하는 65세이상 보행노인 사고 관련 정보입니다.
