summary_user: 공무원 임용 전 경력(공무원·군·사립학교교직원 경력)을 퇴직급여 수령유형(연금 해당·일시금 수령·미수령)별로 나눠 현재 재직기간에 합산승인받은 공무원 수를 1980년부터 기준년도까지 연도별로 집계한 전국 단위 파일입니다. 연금 제도 분석가나 연구자가 '군 경력이나 사학연금 가입기간을 공무원 재직기간으로 합산하는 사례가 해마다 어떻게 변해 왔는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 직역연금 통계와는 연도(구분) 값을 맞춰 나란히 놓는 방식으로만 이어 쓴다.
description_portal: '공무원연금공단에서 관리하는 경력별 재직기간 합산승인 추이 데이터로, 1980년부터 기준년도까지 제공하고 있습니다.공무원으로 임용되기 전의 경력(군경력, 공무원경력, 사립학교교직원경력)을 퇴직급여 수령유형(일시금, 연금)에 따라 현재의 근무기간에 합산한 공무원 수 데이터입니다.1. 재직기간 합산승인 : 과거 특수직역연금(공무원·군인·사학연금) 퇴직당시 수령했던 급여액에 일정 이자를 가산하여 반납토록 하고 그 가입기간을 공무원재직년수로 합산받는 제도2. 2000년 이전 사립학교 경력자 중 퇴직일시금 해당자는 퇴직연금, 퇴직일시금 해당자를 포함한 수치임'
