summary_user: 청소년활동시설(수련시설·문화의집·유스호스텔 등)의 시설명, 분류·종류, 시도·시군구, 상세주소, 위경도, 대표전화, 시설설명을 시설 한 곳당 한 건으로 담은 전국 단위 위치(POI) API이다. 청소년 정책 담당자나 분석가가 "우리 지역에 어떤 유형의 청소년 시설이 어디에 있나"를 파악하는 질문에 쓴다. 상세주소(daddr, 키 address)와 위도(lat, 키 coord)로 다른 주소·좌표 기반 데이터와 이어 쓰고, 시도·시군구명을 통해 지역 통계와 연계할 수 있다.
description_portal: 청소년활동시설의 관심 지점 정보 서비스를 제공하는 오픈 API형 데이터입니다. 해당 개방데이터는 청소년활동시설의 POI정보(도로명주소, 지번주소, 위도, 경도), 전화번호, 시설명, 시설 유형, 시설 설명 등을 확인할 수 있습니다. 청소년활동시설의 위치 및 유형 정보를 기반으로 지역별 시설 분포를 파악할 수 있어, 청소년 대상 정책 수립과 서비스 연계에 활용됩니다. 또한 시설 접근성 향상, 복지 자원 효율적 배치, 이용자 중심의 지원 체계 마련 등 다양한 행정 및 연구 분야에 기초 자료로 제공될 수 있습니다.
