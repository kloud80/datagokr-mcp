summary_user: 경기도 시군별 학생(어린이)승마교실 운영 승마장의 명칭, 대표자명, 전화번호, 홈페이지, 지번·도로명 주소, 우편번호, 위경도 좌표를 승마장 한 곳당 한 행으로 담은 현황 목록이다. 학부모나 교육기관이 우리 시군에서 아이가 승마 체험을 할 수 있는 승마장이 어디이고 연락처가 무엇인지 확인하거나, 분석가가 시군별 승마교실 분포를 지도에 올려 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군명·시군코드(SIGUN_CD)를 이름·코드로 맞추거나 위경도 좌표로 공간 매칭해 잇는다.
description_portal: 경기도 내의 시군별 학생승마교실(학생들의 체력증진 및 심신수양으로 건전한 학생 여가문화를 조성하고 승마산업 활성화와 레저수요 충족 및 농촌의 활력증진)의 승마장명, 대표자명, 전화번호, 소재지주소 등에 대한 현황입니다.이 데이터는 대한민국 내 어린이 승마 체험이 가능한 승마장에 대한 정보를 제공하며, 각 시설의 명칭, 위치, 전화번호, 도로명주소, 위경도 좌표 등의 정보를 포함하고 있습니다. 데이터 항목에는 시군명, 승마장명, 전화번호, 홈페이지주소, 소재지지번주소, 소재지도로명주소, 우편번호, WGS84위도, WGS84경도 등이 포함되어 있으며, 이를 통해 지역별 어린이 승마 체험 시설 분포와 접근성을 파악할 수 있습니다. 해당 정보는 지방자치단체나 교육기관이 어린이 체험학습 프로그램을 기획하거나, 지역 내 여가 및 체육 인프라 분석, 승마 관련 산업 지원 정책 마련 등에 활용될 수 있습니다. 특히 위도와 경도 정보는 지도 기반 위치 서비스 및 승마장 간 거리 분석, 내비게이션 연계 등 다양한 공간 분석 응용이 가능합니다.
