summary_user: 부산광역시 16개 구군에 있는 재가노인지원서비스센터를 시설 한 곳당 한 행으로 담은 목록으로, 시설명·주소·전화번호·경도·위도를 제공한다. 장기요양 등급외 노인이나 그 가족이 '우리 구에서 일상생활 지원·사례관리를 받을 수 있는 센터가 어디이고 연락처는 무엇인가'를 찾을 때, 또는 분석가가 구군별 센터 분포를 지도에 올릴 때 쓴다. 전역 조인 키나 시설코드가 없어서 구군 이름으로 지역 통계와 맞추거나, 좌표·주소로 다른 노인복지시설·장기요양기관 위치 데이터와 겹쳐 보는 방식으로만 이어 쓴다.
