summary_user: 서울시설공단 장애인콜택시 차량이 대기·주차하는 차고지를 한 행씩 담은 파일(csv 약 3KB)로, 관리 시설명, 운영 권역(동부·서부), 차고지명, 주차대수, 도로명 상세주소를 담는다. 교통약자 이동지원 정책 분석가나 시민이 '서울 장애인콜택시 차고지가 어디에 있고 권역별로 몇 대를 수용하는가'를 확인하거나 위치 지도로 시각화하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상세주소를 지오코딩하거나 차고지명·시설명을 이름으로 맞춰야만 이어 쓸 수 있다.
description_portal: 본 데이터는 서울시 교통약자의 이동을 지원하는 서울시설공단 장애인콜택시의 차고지 운영 정보입니다. 장애인콜택시 차량이 대기 및 주차하는 차고지의 관리 시설명, 운영 권역 구분(동부, 서부), 세부 차고지 명칭, 현재 해당 차고지를 사용하는 주차대수 및 도로명 상세주소 정보를 제공합니다. 본 데이터를 통해 서울시 내 장애인콜택시 거점 인프라의 위치와 수용 규모 현황을 확인할 수 있으며, 해당 데이터를 활용해서 관련 위치 시각화나 교통 인프라 분석 등 다양한 목적으로 재구성해 보실 수 있습니다.[데이터 항목 정보]시설명, 구분(동부, 서부), 차고지명, 주차대수, 상세주소
