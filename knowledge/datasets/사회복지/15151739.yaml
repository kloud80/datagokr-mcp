description_portal: 국민연금공단 노후준비 민간 전문강사는 공단과의 강의 용역계약에 따라 노후준비 강의를 제공하는 프리랜서형 강사입니다.공단은 노후준비 교육 서비스의 일환으로 노후준비 민간 전문강사를 활용하여 전국민 대상 노후준비 강의를 무료로 제공하고 있습니다.공단과 용역계약이 체결된 민간 전문강사는 노후준비 지원법에 따라 공단에서 제공하는 서비스 제공자 보수교육을 수료해야 하며, 강사는 국민연금 제도 이해 및 노후준비 4대 영역(재무, 건강, 여가, 대인관계)에 대한 강의를 제공하고 있습니다.
