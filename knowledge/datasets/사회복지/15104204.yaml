summary_user: 경상남도 사천시 관내 요양병원을 한 곳당 한 행으로 담은 목록으로, 업체명·도로명 주소·전화번호·위도·경도·데이터기준일을 제공하며 파일 크기는 847바이트로 소량입니다. 사천시에 사는 가족이 집 근처 요양병원을 찾아 위치와 연락처를 확인하거나, 분석가가 시내 요양병원 분포를 지도에 표시하는 데 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록이나 다른 노인복지시설 데이터와는 업체명·주소 매칭 또는 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: '경상남도 사천시 관내에 위치한 요양병원에 대한 상세 현황 정보를 공공데이터로 제공합니다. 이 정보는 고령화 사회에서 중요한 지역 의료 인프라 접근성을 높이고, 시민들이 필요한 의료기관 정보를 신속하게 찾는 데 도움을 줍니다.제공되는 주요 데이터 항목은 다음과 같습니다업체명: 각 요양병원의 공식 명칭도로명 주소: 병원의 정확한 위치를 알 수 있는 주소전화번호: 예약 및 문의를 위한 연락처위도 및 경도: 모바일 지도 서비스 및 지리 정보 시스템(GIS) 연계를 위한 정확한 좌표 정보데이터 기준일: 정보의 최신성을 확인할 수 있는 기준 일자이 데이터는 사천시의 보건 의료 정책 수립 및 응급 상황 대비를 위한 기초 자료로 활용되며, 시민들의 건강 관리 편의성을 증진시키는 데 기여합니다.'
