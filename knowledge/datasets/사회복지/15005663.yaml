summary_user: 국민연금기금이 거래하는 증권사를 자산 구분(국내외 주식·채권·단기자금 등)별로 증권사 이름 단위로 나열한 전국 단위 목록 파일(csv, 약 6.8KB)입니다. 투자자나 금융업계 분석가가 '어느 증권사가 국민연금기금의 주식·채권 거래 중개사로 선정돼 있는가'를 확인할 때 씁니다. 실측 컬럼에 전역 조인 키가 없으므로, 거래증권사명을 금융회사 이름으로 맞춰 재정금융 분야의 금융회사·주식 데이터나 같은 기관의 위탁운용사 데이터와 이어 씁니다.
description_portal: 분기마다 업데이트되는 국민연금기금의 거래증권사에 대한 정보로 자산별(국내외 주식, 채권, 단기자금) 거래증권사 현황을 제공합니다.거래증권사는 국민연금기금운용규정에 따른 거래금융기관을 의미하며, 거래금융기관이란 기금운용에 있어 유기증권 등의 거래를 중개하거나 판매하는 기관 또는 장외파생상품 및 예금 등의 거래를 하는 기관을 말합니다. 또한 국민연금기금 운용규정 시행규칙 제63조에 따라 리스크관리부문장은 거래가능 금융기관의 선정 기준을 수립하여 반기별로 선정함을 원칙으로 합니다.
