summary_user: 부산광역시 연제구에 있는 아동복지시설(지역아동센터·공동생활가정 등)을 시설 한 곳당 한 행으로 담은 파일(csv, 약 2KB)로, 구분·시설명·도로명주소·위도·경도·평일·방학 운영시간·토요일 운영 여부·휴관일·정원·현원을 포함한다. 연제구 보호자가 집 근처에서 토요일이나 방학 중에도 운영하고 정원에 여유가 있는 지역아동센터를 찾을 때 쓴다. 전역 조인 키는 없으므로 다른 사회복지시설 목록과는 시설명·도로명주소 매칭으로 잇고, 위도·경도로 지도나 생활권 분석에 겹쳐 쓴다.
description_portal: 부산광역시 연제구 소재 아동복시지설 현황은 「아동복지법 」제52조(아동복지시설의 종류)에 따라 설치되고 있는 시설로서  시설명, 주소, 운영시간, 토요일운영여부, 정원, 현원 등의  정보를 포함하고 있습니다.  지역아동센터는 지역사회 아동의 보호 및 교육, 건절한 놀이와 오락의 제공, 보호자와 지역사회의 연계 등 아동의 건전육성을 위하여 종합적인 아동복지서비스를 제공하는 시설입니다. 또한 공동생활가정은 보호대상아동에게 가정과 같은 주거여건과 보호, 양육, 자립지원 서비스를 제공하는 것을 목적으로 하는 시설입니다.
