summary_user: 산재보험 재활 사업을 위탁 수행하는 전국 기관(직업훈련기관, 재활스포츠·심리재활프로그램 위탁기관)을 기관 한 곳당 한 행으로 담은 목록 파일이며, 연도·구분·기관명·우편번호·주소·연락처·관할지사로 구성된다. 산재 근로자나 가족이 "우리 집 근처에서 산재 직업훈련이나 심리재활을 받을 수 있는 위탁기관은 어디인가"를 찾거나, 분석가가 지역별 재활 위탁기관 분포와 공백 지역을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(시군구 추출·좌표 변환)나 관할지사명, 기관명 매칭으로만 잇는다.
description_portal: 이 데이터는 2019년 8월 기준으로 근로복지공단 산재보험 재활 사업을 위탁 수행하는 전국 기관의 목록 및 상세 정보를 담고 있습니다. 통계 항목은 연도, 기관 구분(직업훈련기관, 재활스포츠 위탁기관, 심리재활프로그램 위탁기관), 기관명, 주소, 연락처, 그리고 해당 기관을 관할하는 지사 정보로 구성되어 있습니다. 이 자료는 산재 근로자에게 직업 훈련, 신체 재활, 심리 재활 등 종합적인 재활 서비스를 제공하는 공공 및 민간 협력 네트워크의 규모와 지역별 분포를 명확하게 보여줍니다. 특히, 직업 훈련 기관과 스포츠/심리 재활 기관의 소재지를 파악하여 지역별 재활 인프라의 접근성을 진단하는 데 필수적인 기초 정보라고 판단됩니다.본 데이터는 산재 재활 서비스의 지역별 접근성 개선 및 서비스 품질 향상 정책 수립에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 각 재활 위탁 기관의 지역별 분포를 분석함으로써, 재활 서비스의 지역별 격차를 해소하고 위탁 기관이 부족한 지역에 대한 지원 및 확충 방안을 모색할 수 있습니다. 또한, 민간 개발자는 이 정보를 활용하여 산재 근로자의 거주지나 필요한 재활 유형에 따라 가장 가까운 위탁 기관을 쉽게 검색하고 연결할 수 있는 정보 제공 서비스를 개발하는 데 기여할 수 있습니다. 이 통계는 산재 근로자의 성공적인 사회 복귀를 지원하는 재활 네트워크의 투명성을 높이는 데 중요한 역할을 한다고 판단됩니다.
