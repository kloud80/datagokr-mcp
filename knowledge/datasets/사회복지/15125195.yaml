summary_user: 청소년 상담에서 집계된 대인관계 문제 현황을 청소년 상태별로 나눈 전국 단위 통계표로, 제목·구분·X축·Y축 항목과 값(chtVl)을 차트 형태로 담는 집계 데이터입니다. 청소년 기관 담당자나 정책 분석가가 "학교 밖·재학 등 청소년 상태에 따라 또래 갈등 같은 대인관계 문제 비중이 어떻게 다른가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 지역 구분도 없는 전국·비공간 자료라서, 다른 데이터와는 같은 기관의 청소년 상담 통계와 항목 이름으로 맞춰 나란히 보는 정도로만 잇는다.
description_portal: 청소년 상담 청소년 상태별 대인 관계 문제 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.청소년의 상태에 따른 대인관계 문제의 분포를 분석함으로써 또래 간 갈등이나 소통 부족 등의 사회적 문제를 파악할 수 있습니다. 이를 통해 학교나 청소년 기관에서는 상담 개입의 시기와 방식에 대해 보다 구체적인 전략 수립이 가능합니다. 나아가 정책 입안자들이 대인관계 관련 문제 증가 추세를 감지해 조기 예방 정책 수립에 반영할 수 있으며, 청소년 간의 건강한 사회적 관계 형성을 유도하는 정책 자료로 활용될 수 있습니다.
