summary_user: 공무원연금공단이 관리하는 공무원 퇴직자 수를 연도별·퇴직사유별(명예·정년·일반·당연퇴직, 직권면직, 사망, 기타 등)로 집계한 전국 단위 통계 파일로, 1982년부터 기준시점까지 담는다. 연금 정책 분석가나 연구자가 '명예퇴직과 정년퇴직 인원이 해마다 어떻게 바뀌었나' 같은 공무원 퇴직 구조의 장기 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도(구분) 기준 이름 매핑이나 같은 기관의 다른 직역연금 통계와 나란히 놓는 방식으로만 이어 쓴다.
limits: 전국 집계만 있어 지역·기관별 퇴직자는 알 수 없고 공통 조인 키가 없다. 퇴직사유 분류가 시기별로 달라(1995년까지 기타에 명예퇴직 포함, 2013년 의원면직·조기퇴직 등 7개 항목이 일반퇴직으로 통합) 사유별 장기 비교 때 단절에 주의해야 한다.
