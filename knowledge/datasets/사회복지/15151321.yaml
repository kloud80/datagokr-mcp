summary_user: 전국 치매안심센터가 운영하는 치매예방교실을 교실 한 건씩 담은 CSV 파일로, 센터명·교실명·운영기간·반편성(오전/오후/종일)·요일·시간·회기수·장소·외부강사 여부·우선/일반 이용정원을 포함한다(포털 설명상 2025년 11월 5일 기준). 우리 동네 치매안심센터에서 평일 오전에 들을 수 있는 치매예방 교육이나 인지훈련 교실이 있는지, 정원은 몇 명인지 알아보려는 주민이나 지역별 예방 프로그램 공급을 비교하려는 분석가가 쓴다. 공통 조인 키는 없어서 치매안심센터명을 기준으로 치매안심센터 위치·현황 데이터와 이름 매칭해 지역(시군구) 정보를 붙여 쓴다.
limits: 센터 코드나 행정구역 코드 같은 전역 조인 키가 없어 다른 데이터와는 센터 이름 매칭으로만 연결되고, 파일 자체에는 좌표 등 공간 정보가 없다. 운영 현황만 담고 있어 실제 참여 인원이나 교육 효과는 알 수 없다.
