description_portal: '공무원연금공단에서 제공하는 공무원재해보상연금위원회 심의(재해보상급여, 부조급여 등)종류별 심의결과(인용, 기각) 추이 데이터로 1983년부터 2018년까지의 정보를 제공하고 있습니다.재해보상심의 과정에서 재심 요청의 유형과 건수 변화 양상을 분석하고, 제도 및 심의절차 개선에 활용할 수 있습니다.재해보상급여 : 장해급여, 공무상요양, 순직유족보상부조급여 : 재난부조금, 사망조위금1. 재해보상심의회 공단처분에 관한 이의 신청에 대한 재심에대한 내용입니다.2. 재직기간, 퇴직급여 관련 재심건 제외2019년부터 재해보상심의 업무가 인사혁신처로 이관되어, 데이터 현행화를 하지 않습니다.'
