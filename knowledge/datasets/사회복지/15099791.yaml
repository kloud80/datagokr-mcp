summary_user: 전남 해남군 경로당을 한 곳씩 담은 시설 목록으로, 읍면명·경로당명·도로명주소·건축연도·부지면적·대표자·데이터기준일자를 개소별로 기록한다. 주민이나 복지 담당자가 우리 읍면에 경로당이 몇 곳이고 어디에 있는지, 오래된 건물이 어디인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설·지역 통계와는 읍면명이나 주소를 이름으로 맞춰 이어 써야 한다.
limits: 표준 시설코드나 행정코드 같은 공통 키가 없어 다른 데이터와의 연결은 이름·주소 매칭에 의존한다. 범위는 해남군 한 곳뿐이라 다른 시군과 비교하려면 별도 데이터가 필요하다.
