summary_user: 서울 양천구에 있는 지역아동센터를 시설 한 곳당 한 행으로 정리한 파일로, 시설명·소재지·면적·운영시간·전화번호·데이터기준일을 담는다(1.8KB 규모의 소량 CSV). 보호자가 "우리 동네에서 저녁까지 아이를 맡길 수 있는 지역아동센터가 어디이고 몇 시까지 운영하나"를 찾거나, 분석가가 양천구의 돌봄 시설 분포와 면적을 살펴보는 데 쓴다. 전역 조인 키가 없어서 다른 구의 지역아동센터 현황이나 사회복지시설 공통 마스터와는 시설명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 양천구 한 곳의 시군구 범위만 담고 있어 서울 전체나 전국 비교에는 다른 지자체 자료를 따로 모아야 한다. 시설 코드가 없으므로 다른 데이터와 연결할 때는 시설명·소재지 문자열을 직접 맞춰야 한다.
