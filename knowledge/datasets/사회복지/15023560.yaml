description_portal: ' 근거법률  - 장애인활동지원에 관한 법률    사회서비스 이용 및 이용권 관리에 관한 법률신청자격: 만 6세 이상 ~ 만 65세 미만의 「장애인복지법」 상 등록장애인서비스내용 : 활동보조(신변처리 지원, 가사지원, 사회활동 지원), 방문목욕, 방문간호지원(인정시간) 활동지원급여 : 인정시간은 15구간으로 구분, 등급별 60~480시간 제공특별지원급여 : 출산, 자립준비, 보호자 일시부재 등 한시적 추가 지원※ 지원(인정) 시간은 평일 낮에 활동보조만을 이용하는 경우(시간당 단가 :  17270원) 산정 시간이며,심야 및 휴일(토요일 제외)의 활동보조나 방문목욕, 방문간호를 이용하는 경우 활동보조 이용가능 시간은 줄어듦중증장애인의 일상생활을 위한 바우처 서비스 제공기관 알림주로 활동보조기관이 다수나, 부산시 동구는 방문간호기관도 있음활동지원은 장애인의 자립생활 원활화 뿐 아니라, 가족을 돌봄의 노동에서 해소시켜 주는 역할을 함.본인부담: 생계, 의료수급자 : 면제차상위계층 : 정액(20,000원) 차상위 초과 : 소득수준에 따라 차등'
