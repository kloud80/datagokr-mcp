summary_user: 경기도 시군별로 장애인 관련 복지시설에 일하는 종사자 수를 복지시설 유형별로 집계한 통계로, 매년 12월 말 기준 시점(통계년월)마다 시군명·시설유형코드·종사자수를 담는다. 도 복지 담당자나 분석가가 '어느 시군의 어떤 유형 장애인복지시설에 인력이 부족한가'를 비교해 인력 배분이나 확충 필요성을 판단할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명(signgu_nm)을 이름으로 매핑해 시군별 장애인 등록 인구나 시설 수 통계와 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 시군구별로 장애인복지 관련 시설에 종사하는 인력 수를 복지시설 유형별로 기록한 자료로  매년 12월 말 기준의 시군명, 장애인 관련 복지시설 유형별 종사자수를 제공합니다. 주요 항목으로는 ‘통계년월’을 통해 자료 수집 시점을 확인할 수 있으며, ‘시군구명’은 지역별 분류, ‘복지시설유형코드’는 각 시설의 종류를 나타냅니다. 이 데이터는 장애인 복지 정책 수립, 지역별 복지 인력 배분, 사회서비스 수요 예측, 특정 유형 복지시설의 인력 확충 필요성 판단 등에 활용될 수 있으며, 복지 자원의 효율적 배치 및 인력운영 전략 수립에 있어 핵심적인 기초자료로 쓰입니다.
