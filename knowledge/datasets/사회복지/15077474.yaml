summary_user: 광산구에 등록된 장애인 수를 장애유형별로 집계해, 성별과 장애 정도(심한 장애·심하지 않은 장애)로 나눠 담은 1KB 남짓의 작은 CSV 파일이다. 광산구 복지 담당자나 분석가가 "광산구에서 어떤 장애유형이 가장 많고, 심한 장애 비율은 남녀별로 어떤가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로, 다른 시군구의 같은 형식 통계나 장애 관련 자료와는 시도명·시군구명과 장애유형 이름을 맞춰 연결한다.
description_portal: 광주광역시 광산구에서는 장애인 등록현황에 관한 상세한 데이터를 관리하고 있습니다. 이 데이터는 장애 구분별로 체계적으로 분류되어 있으며, 지체장애, 시각장애, 청각장애, 언어장애, 뇌병변장애, 신장장애 등 다양한 유형에 대한 정보를 포함하고 있습니다. 또한, 휠체어 사용이 필요한 대상자에 대한 현황도 별도로 파악하여, 이들의 복지 및 지원에 필요한 기초 자료로 활용하고 있습니다. 이러한 장애인 등록 현황 자료는 광산구 내 장애인 복지 정책 수립과 관련 서비스 제공에 중요한 역할을 하며, 각 장애 유형별로 맞춤형 지원 방안을 마련하는 데 자료가 될 수 있습니다.
