description_portal: ㅇ 「아동복지법」에 따라 국가 또는 지방자치단체가 설치하거나, 국가 또는 지방자치단체 외의 자가 관할 시장·군수·구청장에게 신고하고 설치한 시설 정보임ㅇ 지역아동센터는 방과 후 돌봄이 필요한 아동에게 보호, 학습지도, 급식, 정서지원 등을 제공하는 아동복지시설이며,  주로 저소득층, 맞벌이 가정 등의 아동을 대상으로 함.  안전한 돌봄 환경과 다양한 프로그램을 운영하고 있습니다. 공공데이터에는 구·군별 지역아동센터의 명칭, 주소, 정원, 전화번호 등의 정보가 포함되어 있어 시민들의 이용 편의를 높이고, 행정기관의 정책 수립과 복지 자원 배분에 활용되고 있습니다
