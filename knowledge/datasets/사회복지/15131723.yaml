description_portal: 사립학교교직원연금공단 지역별 연금수급자 인원현황(주소지) 데이터는 연금을 수령중인 수급자의 거주지 기준 주소지를 기반으로, 시도 및 시군구 단위로 구분한 연금수급자 수를 제공하는 통계자료입니다. 이 데이터는 특정 시점 기준으로 수급자의 주소지에 따라 분포를 파악할 수 있도록 구성되어있으며, 기준년도, 지역, 퇴직연금, 조기퇴직연금, 분할연금, 유족연금, 직무상유족연금, 장해연금, 장해유족연금, 비직무상장해연금, 연계연금, 연계유족연금 항목을 제공합니다.해당 데이터는 19~24년말 6개년 자료로 지역별 수급자 현황 분포을 파악하고 연구하는데 활용 될 수 있는 자료 입니다.
