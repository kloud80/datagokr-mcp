status: active
summary_user: 아이돌봄 서비스 제공기관별·기준연월별로 다자녀·맞벌이·일반·장애부모·조손·한부모·기타 가정 유형마다 소득기준 가형~라형 누적 이용가정 수를 담은 집계 데이터이며, 범위는 전국이고 위치 정보가 없는 비공간 데이터다. 정책 분석가나 지자체 담당자가 '맞벌이·한부모·조손 가정 중 어느 소득구간 가정이 아이돌봄을 많이 이용하는가', '전염성 질병 아동 돌봄 여부(ilnsSrvcYn)나 돌봄구분에 따라 이용 가정 구성이 어떻게 다른가'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 아이돌봄 실적 데이터와는 아이돌봄기관 번호·이름(상위기관 번호·이름 포함)과 기준연월을 맞춰 연결해야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 사회복지시설 마스터 등 외부 데이터와는 기관명 매핑이나 같은 기관 코드로만 이어 붙일 수 있다. 행정구역 코드나 좌표가 없는 전국·비공간 데이터라 지역별 분석은 기관명으로 지역을 별도로 확인해야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고, 개발계정은 하루 3,000회로 제한된다.
