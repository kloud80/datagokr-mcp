summary_user: 부산광역시 영도구에 소재한 장기요양기관을 기관 1곳당 한 행으로 담은 현황 파일로, 기관명·급여종류·대표자명·주소·전화·팩스를 담는다(2025년 9월 4일 기준, 약 6KB 규모의 CSV). 영도구에서 부모님을 모실 요양시설이나 방문요양·주야간보호 기관을 찾는 가족이 "집 근처에 어떤 급여종류의 기관이 있고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 장기요양기관·사회복지시설 자료와는 기관명이나 주소를 맞춰 이어야 하고, 지역 단위 통계와는 시군구(영도구) 수준에서만 연결한다.
description_portal: '2025년 9월 4일 기준하여 부산광역시 영도구에 소재한 장기요양기관 현황 자료로 기관명, 대표자, 주소, 전화번호 등의 데이터를 제공합니다.*장기요양기관의 종류로는 시설급여제공기관(노인요양시설, 노인요양공동생활가정), 재가급여제공기관(방문요양, 주야간보호, 단기보호, 방문목욕, 방문간호, 복지용구지원서비스 등)이 있습니다.*장기요양기관 입소, 이용을 위한 사전 절차 : 장기요양인정신청(국민건강보험공단 지사) → 방문조사 → 등급판정위원회 → 장기요양인정서 수령 → 입소, 이용 절차에 따라 이용'
