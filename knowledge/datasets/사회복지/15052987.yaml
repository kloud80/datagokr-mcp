description_portal: '공무원연금공단에서 관리하는 연금수급기간별, 사유별(사망,청산,유족승계, 재임용후 합산,퇴직처분취소 등) 연금수급 종결자 현황 데이터로 1년 미만부터 40년이상까지 연 단위로 구분되어 있습니다.1. 청산 : 이민 또는 국적상실시 본인의 원에 의한 청산(4년분 연금액의 상당금액을 일시 지급) 및 유족이 아닌 직계비속 또는 기관장에게 지급되는 특례급여2. 퇴직처분취소 : 파면, 해임, 직권면직, 의원면직 등 퇴직처분 취소3. 기타 - 퇴직연금수급자 : 퇴직연금→일시금 전환, 퇴직자 행방불명 등 - 유족연금수급자 : 친족관계 종료, 직계비속 폐질상태 해소, 행불자 생존확인 등 - 장해연금수급자 : 장해연금→장해보상금 전환, 퇴직처분 취소 등'
