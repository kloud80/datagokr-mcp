summary_user: 공무원연금 수급이 끝난 사람 수를 연금수급기간(1년 미만~40년 이상, 연 단위) 구간별로 나누고, 퇴직·유족·장해연금 종류마다 사망·청산·유족승계·재혼·직계비속 19세 도달 등 종결 사유별로 집계한 전국 단위 통계 파일(csv, 약 2.4KB)이다. 연금 정책 분석가나 연구자가 '공무원 퇴직연금을 받기 시작한 뒤 몇 년 만에 사망이나 유족승계로 수급이 끝나는가'와 같은 수급 지속기간 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수급기간 구간 이름을 맞추거나, 같은 공단의 다른 직역연금 통계 파일과 나란히 놓아 비교하는 방식으로만 이어 쓴다.
limits: 전국 합계만 있고 지역 구분이 없어 지역별 분석에는 쓰지 못한다. 공통 코드나 키가 없어 다른 데이터와 기계적으로 결합할 수 없고, 이름 매핑으로만 연결한다.
