summary_user: 서울특별시 용산구 관내 청소년수련시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·소재지 주소·전화번호·홈페이지를 담는다(파일 크기 501바이트의 소규모 CSV). 용산구에 사는 학부모나 청소년이 근처 청소년문화의집 같은 수련시설의 위치와 연락처를 찾을 때, 또는 지역 청소년 프로그램 기획자가 관내 시설 현황을 파악할 때 쓴다. 전역 조인 키나 코드 컬럼이 없어 다른 데이터와는 시설명이나 소재지 주소를 맞춰 잇거나 같은 시군구 기준으로 지역 통계와 나란히 보는 방식으로만 연결한다.
limits: 용산구 한 곳의 시설만 담아 다른 자치구나 전국 비교에는 쓸 수 없고, 운영 프로그램·이용 실적 같은 활동 정보는 없다. 명세상 연간·이벤트성 갱신이라 시설 신설·폐지가 바로 반영되지 않을 수 있다. 조인 키가 없어 다른 데이터와 연결할 때 이름·주소 매칭 오류에 주의해야 한다.
