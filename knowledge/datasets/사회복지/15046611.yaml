description_portal: '○ 통계개요* 통계명 : 국민연금 지급현황* 통계종류 : 국민연금의 수급자 및 지급액 현황을 제공하는 일반·보고통계* 근거법령 :「국민연금법」「공무원연금법」「사립학교교직원연금법」규정에 따른국민연금 가입자의 연금지급 현황* 작성목적 : 국민연금제도의 업무추진 실적 및 가입자,징수,급여,기금현황 등을 파악하여연금정책 수립 및 관련 연구를 위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 지사 및 기금운용본부 → 국민연금공단* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 국민연금(노령, 장애, 유족) 및 일시금(장애, 반환, 사망)의 수급자수 및지급액 등'
