summary_user: 전국 치매안심센터가 운영하는 치매환자 가족·보호자 대상 가족교실을 교실(프로그램) 한 건 단위로 담은 CSV 파일로, 센터명·교실 종류·운영 기간과 시간·정원·강사 구분·운영회기·수료기준·보호서비스 제공 여부·만족도조사 여부를 기록한다. 치매 가족을 돌보는 보호자가 가까운 치매안심센터에서 언제, 몇 회기짜리 가족교실이 열리고 교육 중 환자 보호서비스를 받을 수 있는지 확인하거나, 분석가가 센터별 가족교육 운영 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 치매안심센터·노인복지시설 데이터와는 치매안심센터명(이름) 매칭으로만 이어 쓴다.
limits: 센터 코드나 행정구역 코드가 없어 다른 데이터와 정확히 결합하기 어렵고, 센터명 문자열 매칭에 의존해야 한다. 범위는 전국이며 좌표 등 공간 정보는 없다.
