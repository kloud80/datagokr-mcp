summary_user: 경기도 파주시에 있는 장애인직업재활시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설유형·도로명/지번 주소·위도·경도·지정일자·시설면적·직원수·근로장애인수·주요생산품·연락처가 들어 있다. 장애인 가족이나 복지 담당자가 파주시 안에서 일할 수 있는 직업재활시설이 어디에 있는지, 몇 명의 장애인이 근로하며 무엇을 생산하는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시설명·주소로 맞추거나 위도·경도 좌표로 지도·공간 데이터에 겹쳐 쓴다.
description_portal: 경기도 파주시 장애인의 경제적 자립과 사회 참여를 지원하는 재활시설에 대한 운영 현황을 파악할 수 있는 공공데이터로, 시설명, 시설유형, 대표자명, 주소(도로명 및 지번),  GIS기반의 시각화 및 공간분석에 활용될 수 있는 위도·경도 좌표, 지정일자, 시설면적, 직원수, 근로장애인수, 주요생산품, 연락처 등의 항목으로 구성되어 있어 시설의 기본 정보뿐 아니라 지리적 위치, 인력 구성, 생산 활동 등 전반적인 운영 실태를 확인할 수 있습니다. 이를 통해 장애인 고용 및 복지정책 수립, 지역별 시설 분포 분석, 연구 목적의 통계 자료 활용 등에 유용하게 사용될 수 있으며, 개발자는 이를 기반으로 복지시설 안내 애플리케이션, 지도 기반 서비스나 사회적 기업 관련 플랫폼 개발 등을 구축할 수 있으며, 학계에서는 장애인 고용, 복지정책, 지역 격차 분석 등 다양한 연구 주제에 실증자료로 활용할 수 있습니다.
