summary_user: 청소년 자원봉사 활동이 1365 자원봉사포털과 연계되어 수신된 기록을 건별로 담으며, 활동명·수요기관·봉사일자·시작/종료 시각·봉사시간·실적인정 시간·실적승인일시·봉사자 성별·생년월일·소속지역 등이 포함되고 범위는 전국이다. 청소년 자원봉사 담당자나 분석가가 "어느 지역 수요기관에서 청소년 봉사활동이 많이 이뤄지고 실적은 얼마나 인정됐나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 소속지역명·수요기관지역명(dmdInstRgnNm) 같은 지역 이름을 매핑해 지역 통계와 잇거나 같은 기관 데이터와만 연결한다.
description_portal: 청소년활동 자원봉사 1365연계 수신 정보 서비스 조회를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 실적인정분내용, 자원봉사활동명, 수요기관명, 자원봉사일자, 자원봉사시간, 활동내용, 소속지역명, 출력여부, 수요기관지역명, 설별, 생년월일 등의 정보를 확인할 수 있습니다.청소년 자원봉사 1365 연계 수신 정보는 실적인정 여부, 활동내용, 활동시간 등 구체적인 기록을 포함하여 자원봉사 활동의 관리와 확인을 체계화하는 데 기여합니다. 지역별 수요기관 분포나 자원봉사 실적의 통계적 분석이 가능해 정책 수립의 기초 자료로 활용될 수 있습니다.
