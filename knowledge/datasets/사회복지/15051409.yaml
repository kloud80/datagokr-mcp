summary_user: 부산광역시 연제구 관내에 등록된 장기요양기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 업체명·지정일자·주소·연락처가 들어 있다(CSV 약 8KB). 연제구에 사는 가족이 방문요양이나 주간보호를 맡길 장기요양기관을 찾고 연락처를 확인하는 데 쓰거나, 분석가가 구 안의 기관 분포를 주소로 살펴보는 데 쓴다. 전역 조인 키는 없어 건강보험 장기요양기관 목록이나 다른 노인복지시설 데이터와는 업체명·주소를 맞춰 대조해 이어 쓴다.
description_portal: '부산광역시 연제구 관내 등록된 장기요양기관 현황에 대한 데이터입니다.각 업체명, 관내 주소, 대표 연락처 등을 제공하고 있습니다.장기요양기관은 노인복지법 및 노인장기요양보험법에 따라 운영되고 있습니다.  고령이나 노인성 질병 등의 사유로 일상생활을 혼자서 수행하기 어려운 노인등에게 제공하는 신체활동 또는 가사활동 지원을 통해 노후의 건강증진 및 생활안정을 도모하고 그 가족의 부담을 덜어줌으로써 국민의 삶의 질을 향상시킴을 목적으로 합니다.장기요양기관이 제공하는 서비스의 종류: 방문요양, 방문목욕, 주간보호, 치매전담실, 복지용구 등'
