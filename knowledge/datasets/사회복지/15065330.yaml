summary_user: 한국동서발전이 연도별로 지원한 사회적기업의 이름과 지원 내용(지원 물품), 물품 유형을 지원 건별로 담은 파일 데이터이며, 활용신청 없이 CSV(약 79KB)로 받는다. 연구자나 사회적경제 담당자가 '공기업이 어떤 사회적기업에 어떤 물품을 해마다 지원했고, 지원 항목이 어떻게 바뀌었는가'를 확인하는 데 쓴다. 전역 조인 키(인증번호·사업자번호 등)가 없어 다른 사회적기업 인증 현황 데이터와는 사회적기업명을 이름으로 맞춰 이어 써야 한다.
description_portal: 한국동서발전의 연도별 사회적기업 지원 현황 정보는 해당 기관이 연도별로 지원한 사회적기업 목록과 구체적인 지원 내역을 정리한 데이터입니다.이 데이터는 연도, 사회적기업명, 지원내용(지원한 물품), 구분(지원한 물품의 유형) 등의 항목으로 구성되어 있으며, 공공기관의 사회적 가치 실현 활동 및 사회적경제 활성화 기여 내용을 확인할 수 있는 자료입니다.학계 및 연구기관에서는 본 데이터를 활용하여 공기업의 사회적기업 지원 경향을 분석하거나, 연도별 지원 규모 및 항목의 변화를 통해 공공부문이 사회적경제 생태계에 어떤 방식으로 기여하고 있는지를 정량적으로 분석할 수 있습니다.또한 지역별 지원 분포, 물품 유형별 지원 전략, 사회적기업의 성장성과의 상관관계 분석, ESG(환경·사회·지배구조) 경영 실천 사례 연구 등 다양한 사회적 가치 기반의 정책 및 학문 연구에 유용하게 활용될 수 있습니다.
