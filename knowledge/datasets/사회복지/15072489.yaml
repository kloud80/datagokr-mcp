description_portal: 발달장애인 지원 기관에서 제공하는 서비스에 대한 데이터로 주간활동서비스, 청소년방과후활동, 개인별지원계획, 부모교육지원사업, 가족휴식지원사업, 부모상담지원사업, 권리구제, 공공후견, 장애아가족양육지원, 긴급돌봄 서비스, 최중증 통합돌봄서비스 제공 여부의 정보를 제공합니다.주간활동서비스는 성인 발달장애인이 다양한 활동을 하며 낮 시간을 보낼 수 있도록 지원하는 사업으로 사는 지역에서 원하는 활동을 선택해, 정해진 이용시간만큼 참여할 수 있습니다. 방과후활동서비스는 발달장애 학생이 수업을 마친 후에 정해진 기관에서 다양한 활동을 이용할 수 있도록 지원하는 사업입니다. 원하는 활동을 선택해, 정해진 이용시간만큼 참여할 수 있습니다. 개인별지원계획은 발달장애인이 필요한 서비스를 이용할 수 있도록 발달장애인의 특성, 원하는 것에 맞는 서비스 계획을 지원하는 사업입니다. 부모교육지원사업은 발달장애가 있는 자녀를 키우는 부모나 발달장애인의 가족에게 필요한 정보와 교육을 제공하는 사업입니다. 가족휴식지원사업은 발달장애인의 가족이 마음 편하게 쉴 수 있도록 여행, 상담, 돌봄 서비스를 지원하는 사업입니다. 부모상담지원사업은 부모상담지원사업은 발달장애인의 부모가 필요한 상담을 받을 수 있도록 나라에서 상담비용을 지원하는 사업입니다. 권리구제는 발달장애인이 다른 사람에게 피해를 당했을 때 안전하게 지낼 수 있도록 지원하는 사업입니다. 공공후견은 혼자 결정하는 게 어려운 성인 발달장애인이 후견인의 도움을 받을 수 있도록 지원하는 사업입니다. 장애아가족 양육지원사업은 장애아동의 가족이 마음 편하게 쉬고, 사회활동을 할 수 있도록 도와주는 사업입니다. 긴급돌봄서비스는 보호자의 긴급한 상황(입원, 경조사, 소진 등)으로 돌봄이 필요한 발달장애인에게 일시적(7일 이내)으로 돌봄을 지원하는 서비스입니다. 최중증 통합돌봄서비스는 최중증 발달장애인이 낮에 재미있는 활동을 할 수 있도록 도와주고, 밤에는 안전하고 편안하게 잘 수 있도록 돌봐줍니다
