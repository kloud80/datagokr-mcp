summary_user: 제주특별자치도에 있는 노인재가복지시설을 기관 한 곳당 한 행으로 담은 목록으로, 읍면동·기관명·소재지·전화번호와 주야간보호 정원, 단기보호·방문간호·방문요양·방문목욕·복지용구 서비스 제공 여부를 함께 담는다. 거동이 불편한 부모를 모시는 가족이 우리 동네에서 방문요양이나 주야간보호를 받을 수 있는 기관을 찾을 때, 또는 분석가가 제주 읍면동별 재가서비스 공급 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어서 건강보험 장기요양기관 목록이나 사회복지시설 자료와는 기관명·주소를 맞춰 잇고, 지역 통계와는 읍면동·주소 기준으로 묶어 잇는다.
limits: 표준 기관코드가 없어 다른 데이터와 붙일 때 기관명·주소 매칭에 기대야 하고, 표기가 다르면 누락이나 오매칭이 생길 수 있다. 범위는 제주특별자치도 한 곳뿐이라 다른 시도와 비교하려면 별도 자료가 필요하다.
