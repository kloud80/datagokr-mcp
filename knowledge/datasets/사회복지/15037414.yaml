summary_user: 전국 인증 사회적기업과 예비사회적기업(지역형·부처형)을 기업 1곳당 1행으로 담은 건별 원천 파일로, 전체 4,798건이다. 사업분야, 주된 목적, 인증(지정) 여부와 일자, 인증번호, 소재지 주소를 담으므로 국민이나 분석가가 우리 지역에 어떤 분야의 사회적기업이 인증·지정돼 있는지 찾는 질문에 쓴다. 이어 쓸 수 있는 조인 키는 소재지 주소(address)이며, 인증번호로 기업 축의 다른 자료와 연결하는 용도로 본다(사업자번호 필드는 이 파일에 없다).
description_portal: 한국사회적기업진흥원에서는 인증 사회적기업 / 예비사회적기업(지역형, 부처형) 지정 정보제공를 통합하여 제공합니다.기업명 / 사업분야(교육, 보건, 사회복지, 환경, 문화예술, 관광운동 등) / 주된목적 / 사업내용 / 인증(지정)여부 / 예비형태 / 인증(지정)일자 / 인증(지정) 번호 / 소재지 등 사회적기업의 다양한 정보를 제공합니다.데이터상 공란은 관련 지자체 또는 부처에서 입력하지 않은부분이 존재하여 사용에 유의하여 주시기 바랍니다.데이터 문의사항이 있으시다면 한국사회적기업진흥원 정보화기획팀으로 문의 부탁드리겠습니다. 감사합니다.
