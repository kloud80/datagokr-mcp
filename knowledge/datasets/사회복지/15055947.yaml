summary_user: 광주 광산구 관내 어린이집별로 CCTV 총설치대수와 보육실·공동놀이실·놀이터·식당 등 공간별 설치 대수, 영상 보존기간·화질·설치일·운영방식, 주소와 위도·경도를 한 행씩 담은 시설 단위 원천 파일(CSV)입니다. 보호자가 우리 동네 어린이집의 보육실·놀이터에 CCTV가 몇 대 있고 영상을 얼마나 보관하는지 확인하거나, 분석가가 시설 유형별 CCTV 설치 수준을 비교하는 데 씁니다. 전역 조인 키(어린이집코드 등)는 없어서, 어린이집 기본정보·평가 데이터와는 어린이집명·주소로 맞추거나 위도·경도로 위치를 겹쳐 이어 씁니다.
description_portal: 광주광역시 광산구 관내 어린이집의 CCTV 설치 현황에 관한 상세 데이터를 제공합니다. 이 데이터는 각 어린이집의 시설명, 도로명 기준의 주소, 설치된 CCTV 대수, 어린이집의 현재 상태, 그리고 CCTV 설치 구분 등의 항목이 포함되어 있습니다. 광산구 내 어린이집에서의 안전 관리 실태를 체계적으로 파악할 수 있으며, 보호자와 지역사회가 어린이 보호 환경에 대해 신뢰를 가질 수 있도록 지원합니다. 또한, CCTV 설치 대수 및 구분 정보를 통해 각 시설의 보안 수준을 비교하고, 부족한 부분을 개선하는 데 필요한 기초 자료로 활용할 수 있습니다.
