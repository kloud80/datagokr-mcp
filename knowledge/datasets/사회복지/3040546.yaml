summary_user: 대구 달서구 관내 노인대학(노인복지대학·노인문화대학)을 시설 한 곳씩 담은 목록으로, 시설명·도로명주소·위도·경도·운영기관·전화번호·프로그램명·강의시간·이용정원 등을 담은 886바이트 규모의 작은 CSV 파일이다. 달서구에 사는 어르신이나 가족이 집 가까운 노인대학이 어디 있고 어떤 강좌를 언제 몇 명 정원으로 운영하는지 확인하는 데 쓴다. 전역 조인 키나 시설코드가 없어 다른 노인복지시설 데이터와는 시설명·주소로 맞추거나 좌표로 위치를 겹쳐 쓰고, 지역 단위 비교는 달서구라는 시군구 기준으로 지역 통계와 잇는다.
description_portal: 본 데이터는 대구광역시 달서구 관내 어르신들의 활기차고 당당한 노후를 위해 전공 및 교양강좌와 현장학습, 지역문화탐방 등을 지원하거나 새로운 여가문화를 창출하고 자아 성장과 신체적, 정신적 건강을 회복하여 노인의 사회 활동 참여 욕구 충족 및 새로운 제2의 삶을 찾는데 기여하기 위해 제공합니다.항목은 위도, 경도, 시설명, 소재지 도로명주소, 운영기관명,  전화번호, 프로그램명, 강의시간, 이용정원 명, 홈페이지, 주관부서,  기준일자로 구성되어있습니다.1년마다 주기에 따라 업데이트되고 있으니 참고하시길 바랍니다.해당 자료는 달서구청 홈페이지(www.dalseo.daegu.kr) 분야별정보> 복지> 노인> 노인복지대학, 노인문화대학을 통해 확인하실 수 있습니다.
