description_portal: 이 데이터는 근로복지공단에 고용보험과 산재보험이 가입된 사업장의 상세 현황을 담고 있는 자료입니다. 사업장명, 주소, 상시근로자 수, 고용 및 산재보험 성립일자, 고용보험 사업종류명, 사업자등록번호, 사업장관리번호 등 사업장 식별 및 보험 가입 정보 전반을 제공합니다. 상시근로자 수의 산정 기준은 "고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률 시행령" 제2조제1항제3호에 따라 상세하게 정의됩니다. 이 자료는 국내 기업들의 사회보험 가입 실태와 노동 시장 규모를 파악하는 데 필수적인 기초 정보이며, 기업 활동과 고용 구조를 분석하는 데 중요한 가치를 지닌다고 판단됩니다.본 데이터는 노동 시장 및 사회보험 정책 수립에 핵심적인 자료입니다. 정책 입안자는 이 자료를 활용하여 지역별, 업종별 사업장 수와 상시근로자 수의 분포를 분석함으로써 보험 가입의 사각지대를 해소하고 보험 적용 확대를 위한 정책 목표를 설정할 수 있습니다. 또한, 성립일자와 근로자 수 정보를 결합하여 신규 기업의 성장 추이나 특정 업종의 영세 기업 비율을 파악하고, 이에 따른 맞춤형 사회보험 지원 및 관리 방안을 수립하는 데 기여할 수 있습니다. 이 통계는 공공기관의 사회보험 관리 행정의 투명성을 높이고, 노동 시장의 안정성을 확보하는 데 중요한 역할을 한다고 판단됩니다.○ 상시근로자수 정의 - 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률 시행령」 제2조제1항제3호 - 당해 보험연도 전에 사업이 개시된 경우 상시근로자수 = (전년도 매월 말일 현재 사용하는 근로자 수의 합계/전년도 조업 개월수)  - 건설업에 있어서 근로자 수 확인이 곤란한 경우 상시근로자수 =(전년도 공사실적액 X 전년도 노무비율 )/ (전년도 건설업 월평균 보수 x 조업 개월수)  - 당해 보험연도 중에 사업이 개시된 경우 상시근로자수 = 보험관계 성립일 현재 사용하는 근로자의 수
