description_portal: 대한적십자사 RCY단 활동내역 데이터는 청소년적십자(RCY) 조직의 활동 정보를 제공하는 공공데이터입니다. RCY단 활동내역 데이터는 연도별 지역(지사)의 RCY 활동건수와 봉사활동 대상 현황(봉사활동 구분, 수혜대상자 구분)과 같은 항목을 포함하고 있습니다. 본 데이터가 제공하는 지역별 RCY 활동 통계, 봉사활동 대상에 대한 현황 등을 통해 지역별 청소년 인재 육성, 청소년 및 공동체 관련 프로그램 기획·활성화, 청소년 사회공헌 정책 수립, 학교 교육과 연계된 청소년 활동 정책 수립 및 통계 분석 등의 목적으로 활용하실 수 있습니다.
