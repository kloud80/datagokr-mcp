summary_user: 경기도 시군별로 기준년도·기준월 시점의 산후조리비 지원 건수(sport_noc)와 같은 기간 출생아 수를 함께 담은 집계 자료다. 출산 가정 지원 정책을 검토하는 분석가가 '어느 시군이 출생아 수 대비 산후조리비 지원 비율이 높고 낮은가'를 비교하는 데 쓴다. 전역 조인 키나 시군 코드가 없어 다른 데이터와는 시군명(sigun_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 산후조리비 지원 현황을 다루고 있으며, 경기도 각 시군별로 출산 가정을 대상으로 한 산후조리비 지원 실적을 체계적으로 기록하고 있습니다. 데이터에는 기준년도와 기준월을 통해 시점별 지원 상황을 확인할 수 있으며, 각 시군명별로 실제 출산 가정에 제공된 지원 건수와 해당 기간 동안의 출생 수가 함께 수록되어 있어 출생아 수 대비 지원 비율을 비교할 수 있는 구조로 되어 있습니다. 이러한 자료는 출산 장려 및 가정 복지 정책의 실효성을 검토하는 데 중요한 기초자료가 되며, 특히 지역별로 산후조리비 지원 규모의 차이를 분석하여 지원 정책의 형평성을 확보하거나 맞춤형 출산 지원 대책을 마련하는 데 활용될 수 있습니다.
