summary_user: 경기지역 장애인구강진료센터의 연도·기관·치료유형별 진료 환자 수를 분기별(1~4분기)과 연간 합계로 담은 집계 자료이며, 치료유형에는 이동진료차량 진료도 들어 있다. 장애인 구강보건 정책 담당자나 분석가가 '이동진료차량 진료 환자가 해마다 늘고 있는가, 기관별로 어떤 치료유형 이용이 많은가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명(INST_NM)이나 기준년도를 이름 매핑해서만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기지역 장애인구강진료센터의 연도별·기관별 치료유형 운영 현황을 기록한 자료입니다. 주요 항목에는 기준년도, 기관명, 치료유형분류명, 합계(명), 분기별 환자수(1분기~4분기)가 포함되어 있으며, 특정 치료유형별 진료 환자 수를 분기 단위로 확인할 수 있습니다. 치료유형에는 일반 진료 외에도 이동진료차량을 통한 환자 진료가 포함되어 있어, 거동이 불편한 장애인의 의료 접근성을 높이는 데 기여합니다. 이를 통해 연도별 환자 수 변화, 치료유형별 이용 현황, 기관별 운영 차이를 분석할 수 있으며, 향후 장애인 구강보건 정책 및 의료 지원 서비스 개선을 위한 기초자료로 활용할 수 있습니다.
