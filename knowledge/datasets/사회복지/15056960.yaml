summary_user: 경기도 내 노인일자리 창출을 위해 운영되는 시니어매장을 매장 한 곳당 한 행으로 담으며, 시군·매장명·유형·사업수행기관·도로명/지번 주소·우편번호·전화번호·위경도 좌표로 구성된다. 정책 담당자나 분석가가 '우리 시군에 시니어매장이 몇 곳이고 어느 기관이 운영하며 주민 접근성은 어떤가'를 파악하거나, 시민이 가까운 매장을 찾는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시군코드(SIGUN_CD)·시군명이나 주소·좌표, 사업수행기관명 같은 이름 매핑으로만 다른 데이터와 잇는다.
description_portal: 경기도 시니어매장 현황 데이터는 경기도 내 노인일자리 창출을 목적으로 운영되는 시니어매장에 대한 정보를 제공하며, 시군명, 매장명, 유형, 사업수행기관, 도로명 및 지번 주소, 우편번호, 전화번호, 위도·경도 좌표 등으로 구성되어 있습니다. 이 데이터는 지역별 고령자 일자리 분포와 운영 기관의 특성을 파악하는 데 유용하며, 사회적경제 활성화와 노인복지 증진을 위한 정책 수립에 활용될 수 있습니다. 특히 위치정보(WGS84 좌표)는 지도 기반 분석 및 접근성 평가에 적합하며, 사업수행기관 정보는 각 매장의 운영 주체 및 관리 책임을 명확히 하는 데 도움이 됩니다.
