description_portal: 강릉관광개발공사의 연간 사회공헌활동 현황 데이터를 연번, 사업연도, 활동명, 주요내용, 전화번호, 기준일자 등의 항목으로 제공합니다.공사의 사회공헌활동은 임직원들의 자발적 참여를 기반으로 하며, 단독 활동뿐만 아니라 지역사회 유관기관과의 협력을 통해 지속적·체계적으로 수행되고 있습니다.활동 내용으로는 산불·가뭄 등 재난 대응 기부, 어린이 생존수영 교육, 장애인 나눔여행, 환경정비의 날 운영, 플로깅 캠페인, 헌혈 릴레이, 추석·연말 기부나눔 행사, 지역축제 연계 경제 활성화 활동 등 다양한 분야의 참여 및 기부 활동이 포함되어 있습니다.본 데이터는 사회공헌 활동 및 봉사 관련 실적 분석, 정책 수립, 지역사회 연계 프로그램 평가 등에 활용할 수 있습니다.
