summary_user: 아이돌봄서비스에 참여하는 아이돌보미 교육기관을 기관 1곳당 1행으로 담은 전국 목록 파일로, 시도·교육기관명·대표전화번호·데이터 기준일을 담는다(csv 약 3KB 규모의 소량 목록). 예비 아이돌보미가 우리 시도에서 교육받을 수 있는 기관과 연락처를 찾거나, 분석가가 시도별 교육기관 분포와 미설치 지역을 파악하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 시도명이나 기관명 문자열을 맞춰 이어 써야 하며, 사회복지시설 공통 마스터를 참조하는 보조 자료로 쓴다.
description_portal: 성평등가족부 아이돌봄서비스에 참여하는 아이돌보미 교육기관 목록에 대한 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 교육기관이 위치한 시도, 교육기관명, 해당 기관 대표전화번호에 대한 내용을 확인할 수 있습니다.지역별 교육 수요 및 인프라 분석에 기초 자료로 활용될 수 있습니다. 제공된 교육기관의 정보를 통해 예비 아이돌보미들이 접근 가능한 기관을 쉽게 찾을 수 있습니다. 또한 지역별 기관 분포를 바탕으로 미설치 지역을 파악하고, 향후 신규 기관 설립이나 배치 조정에 참고자료로 활용될 수 있습니다. 교육 접근성 향상을 위한 지역 맞춤형 지원 정책 수립에 활용될 수 있습니다.
