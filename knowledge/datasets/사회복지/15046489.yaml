description_portal: '○ 통계개요* 통계명 : 노인여가 복지시설 (구별)* 통계종류 : 서울시 노인여가 복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「노인복지법」제36조에 의한 노인여가 복지시설* 작성목적 : 노인복지시설 설치신고를 마친 노인복지시설의 수, 입소정원을 집계하여노인 인구수 대비 적정수의 시설 수요와 충족율을 분석하고 분석결과에따른 정책 수립 및 평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 →서울특별시 어르신복지과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구, 내용 - 서울시 자치구별 노인여가 복지시설(노인복지관, 경로당, 노인교실)의 시설수 및 종사자수 현황○ 용어설명* 노인여가복지시설 : 노인들이 친목도모 및 취미활동 등 여가활동을 할 수 있는 시설로노인복지관·경로당·노인교실이 있음(노인복지법 제36조)* 노인복지관 : 노인의 교양ㆍ취미생활 및 사회참여활동 등에 대한 각종 정보와 서비스를제공하고, 건강증진 및 질병예방과 소득보장ㆍ재가복지, 그 밖에 노인의 복지증진에필요한 서비스를 제공하는 시설* 경로당 : 지역노인들이 자율적으로 친목도모ㆍ취미활동ㆍ공동작업장 운영 및 각종 정보교환과 기타 여가활동을 할 수 있도록 장소를 제공하는 시설* 노인교실 : 노인들에 대하여 사회활동 참여욕구를 충족시키기 위하여 건전한 취미생활ㆍ노인 건강유지ㆍ기타 일상생활과 관련한 학습프로그램을 제공하는 시설○ 기 타* 노인복지법 개정("08. 4)으로 명칭 변경(노인복지회관 → 노인복지관)* 노인복지법 시행규칙 개정("11.12)으로 노인여가복지시설의 노인휴양소는 삭제됨'
