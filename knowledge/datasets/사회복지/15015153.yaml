summary_user: 노인일자리여기(前 100세누리) 시스템에 기업이 등록한 노인 구인공고를 공고 한 건씩 담는 건별 원천 데이터로, 범위는 전국이며 근무지는 개별 주소 단위로 나온다. 노인 구직자나 일자리 지원 담당자가 '우리 지역에서 지금 접수 중인 시간제·일당직 노인 일자리가 무엇인가'를 찾을 때 쓰고, 공고ID(jobId)로 상세 조회를 이어 모집인원·사업장·담당자 연락처를 확인한다. 다른 데이터와 묶는 전역 조인 키는 없으므로, 근무지 주소에서 시군구를 뽑아 이름으로 맞춰 시군구 노인인구·독거노인·기초연금 수급 같은 지역 통계와 잇는다.
description_portal: 한국노인인력개발원에서 운영하는 노인일자리여기 시스템(前 100세누리시니어활동 포털)에 기업이 등록한 노인일자리 구인정보를 조회하는 OpenAPI이며, 100세누리 구인정보 목록 조회 서비스와 구인정보 상세정보 조회 서비스로 구성되어 있습니다. 100세누리 구인정보 목록 조회 서비스는 채용공고ID(jobId), 채용공고명, 접수방법, 접수상태, 고용형태(정규직, 계약직, 시간제, 일당직, 기타), 접수일정(시작일, 종료일), 직종, 접수기관, 근무지 등 전반적인 구인정보 현황에 대한 정보를 제공하며, 100세누리 구인정보 상세정보 조회 서비스는 채용공고ID(jobId)를 필수 요청변수로 하여 채용공고ID, 채용공고명, 구인 연령대, 모집인원, 접수일정(시작일, 종료일), 공고상세내용, 기타사항, 사업장명, 사업장 주소, 채용담당자, 담당자연락처, 홈페이지주소 등 세부 구인정보를 제공합니다.
