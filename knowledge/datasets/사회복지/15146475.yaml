summary_user: 서울시 거점형 야간보육 어린이집을 한 곳씩 담은 시설 목록으로, 지역명·읍면동, 어린이집 코드·이름, 유형(국공립·가정 등), 특성(시간연장형·장애아통합 등), 주소·연락처, 인가일자, 정원과 보육서비스 정원을 포함한다. 야간근무자나 맞벌이 부모가 '우리 동네에서 밤늦게까지 아이를 맡길 수 있는 어린이집은 어디인가'를 찾을 때, 또는 분석가가 자치구별 야간보육 정원 분포를 볼 때 쓴다. 실측상 전역 조인 키는 확인되지 않았으며, 다른 어린이집 데이터와는 어린이집 코드(STCODE)나 이름·주소로 매핑해 연결한다.
description_portal: 이 데이터는 서울시 거점형 야간보육 어린이집 현황을 담고 있으며, 야간에도 아동 보육 서비스를 제공하는 어린이집 정보를 정리한 자료입니다. 주요 항목에는 지역코드, 지역명, 읍면동명, 어린이집 코드와 명칭, 유형(국공립, 가정 등), 특성(시간연장형, 장애아통합 등), 주소, 전화번호, 팩스번호, 홈페이지 주소, 인가일자, 정원, 보육서비스 정원 등이 포함됩니다. 예를 들어 송파구 오금동의 오금 어린이집은 국공립으로 장애아통합과 시간연장형 서비스를 제공하며, 은평구 진관동의 구립 은마루어린이집 역시 국공립 형태로 시간연장형 보육을 운영하고 있습니다. 이 데이터는 맞벌이 가정, 야간근무자 등 다양한 상황에서 보육 서비스를 필요로 하는 학부모들이 적합한 어린이집을 찾는 데 도움을 주며, 서울시 보육 정책 수립 및 야간 보육 인프라 확충에도 활용될 수 있습니다.
