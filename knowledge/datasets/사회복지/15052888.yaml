description_portal: 군인연금 수급 인원 현황에 대한 데이터입니다. 2005년부터 연도별로 퇴직연금수급자(20년 이상 복무한 군인에게 퇴역한 후부터 죽을 때까지 지급하는 연금), 유족연금수급자(전쟁 동안 죽은 군인과 경찰 유족에게 지급하는 연금), 상이연금수급자(군사 원호 보상 급여금법에 따라 상이군경에게 지급하던 연금을 받는 사람), 분할연금수급자와 이를 통틀어서 나타내는 연금수급자 계로 세부 항목을 나누어 상세하게 설명하고 있습니다. 해당 데이터 분석을 통해 군인연금 수급 인원수를 파악하여 연금 지출 규모를 측정할 수 있으며, 앞으로의 지속 가능성을 파악하는 것이 가능합니다.
