summary_user: 경기도 내 통합형 직업교육 거점학교(특성화고)를 학교 한 곳당 한 행으로 담으며, 시군, 학교명, 관할지역, 지번·도로명 주소, 우편번호, 위도·경도, 전화번호, 홈페이지를 포함한다. 학부모·학생이나 교육 정책 분석가가 '우리 시군의 직업교육 거점학교는 어디이고 어느 지역을 관할하나'를 확인하거나 직업교육 접근성을 지도로 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드·시군명(SIGUN_CD)이나 학교명 매칭, 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 통합형 직업교육 거점학교의 운영 현황을 시군별로 정리한 자료입니다. 각 학교별로 기관명, 관할지역, 소재지 주소(지번·도로명), 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL 정보가 포함되어 있습니다. 거점학교는 인근 지역의 직업교육 수요를 지원하기 위해 설치된 특성화 고등학교로, 해당 자료는 지역별 직업교육 인프라 분포와 네트워크를 파악하는 데 유용합니다. 이를 통해 특정 지역의 직업교육 접근성, 교육 자원 배분, 학교 간 연계 체계 분석 등에 활용할 수 있으며, 교육 정책 수립 및 직업교육 활성화를 위한 기초자료로 사용될 수 있습니다.
