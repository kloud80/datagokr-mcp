description_portal: 성남시는 여성의 권익 신장과 복지 증진을 위한 여성복지시설을 운영하고 있습니다. 이들 시설은 크게 여성 보호 및 자립 지원시설, 여성폭력 피해자 보호시설, 미혼모 및 한부모가정 지원시설로 분류됩니다.2020년대 기준으로 성남시에는 성폭력 및 가정폭력 피해 여성을 위한 쉼터와 상담소, 한부모가정과 미혼모를 위한 공동생활시설이 운영되고 있습니다.이들 시설은 여성의 주거·심리·법률·의료·직업지원 등 다면적 복지 서비스를 제공하며, 특히 위기 상황의 여성들이 일시적으로 안전하게 머물 수 있도록 긴급 보호체계도 함께 갖추고 있습니다. 일부 시설은 지역 내 NGO 또는 사회복지법인이 운영 주체로 참여하고 있으며, 경기도 및 성남시 보조금으로 운영비를 지원받습니다.
