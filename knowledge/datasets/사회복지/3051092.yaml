summary_user: 전국 중증장애인직업재활지원사업 수행기관 159곳을 기관별 한 행으로 담은 건별 목록 파일이다. 기관유형·연락처·주소와 직업상담, 직업평가, 직업적응훈련, 지원고용, 취업알선 등 제공 서비스 여부가 들어 있어, 장애인이나 가족이 우리 지역에서 직업평가나 훈련을 받을 수 있는 기관이 어디인지 찾는 데 쓴다. 상세주소(address)를 조인 키로 다른 장애인 시설·서비스 데이터와 주소 기준으로 이어 볼 수 있고, 시도·시군구 열로 지역별 분포를 집계할 수도 있다.
description_portal: 중증장애인직업재활지원사업은 중증장애인의 직업재활을 통해 자립기반 마련 및 사회참여를 증진하고 사각지대 없는 촘촘한 직업재활서비스를 제공하기 위하여, 지역사회 내 직업재활사업수행기관을 지정하고 장애인의 생애주기에 따른 전문적이고 체계적인 직업재활서비스를 지원하는 사업입니다.중증장애인직업재활지원사업은 진단·평가, 교육·훈련 및 자립지원정책 등의 차원에서 접근하는 명실상부한 종합적인 직업재활서비스를 제공함으로써 중증장애인의 보호고용 또는 일반노동시장으로 취업을 지원하고 이를 통하여 사회적·경제적 활동에 동등한 사회구성원으로 자리매김하는데 목적이 있습니다.중증장애인직업재활지원사업을 수행하는 기관의 기관유형, 기관명, 연락처, 주소, 제공서비스 현황을 제공하는 데이터파일입니다.
