summary_user: 경로당·양로원 등 노인·장애인 보호시설 주변에 지정된 보호구역을 구역 한 건씩 담은 표준데이터로, 대상시설명·주소·위경도·제한속도·CCTV 설치 대수·도로폭·관할경찰서를 포함하며 검증 시 4,162행을 받았다(데이터 기준일 2023-01-18~2026-08-28). 운전자나 교통안전 분석가가 우리 동네 어느 도로가 노인·장애인 보호구역이고 제한속도와 CCTV 설치 현황은 어떤지 확인하는 데 쓴다. 시군구코드(sgg_cd)로 시군구 단위 통계와, 도로명·지번 주소와 위경도로 사고 지점·시설 위치 데이터와, 제공기관코드(행정표준 기관코드)로 기관 정보와 이어 쓴다.
limits: 수집 범위가 전국 전체인지는 확인되지 않아, 누락 지역이 없다고 가정하고 쓰면 안 된다. 행마다 데이터기준일자가 달라서(최신 2026-08-28) 구역마다 정보 시점이 다를 수 있다.
