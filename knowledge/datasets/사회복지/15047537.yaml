summary_user: 제주특별자치도 안에 있는 청소년 방과후아카데미의 시설명·소재지·연락처를 시설 단위로 담은 소규모 목록 파일(CSV 약 1KB)이다. 방과후 돌봄이 필요한 초4~중3 자녀를 둔 보호자나 지원 기관이 '우리 동네 가까운 방과후아카데미가 어디이고 어떻게 연락하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 청소년시설 목록이나 지역 통계와는 소재지 주소를 행정구역으로 매핑하거나 시설명을 맞춰 붙여야 한다.
