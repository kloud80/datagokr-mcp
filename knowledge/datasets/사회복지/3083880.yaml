description_portal: '본 데이터는 제주특별자치도 제주시에서 가족기능강화와 건전한 결혼문화 조성을 위해 관리하고 있는 결혼중개업체의 현황 정보를 수록한 자료입니다. 결혼중개업 등록 및 운영 현황을 체계적으로 파악하고, 이용자의 알권리 보장 및 불법·부당 영업 예방을 위한 목적으로 수집·제공됩니다.주요 항목구분: 내국인 대상, 국제결혼중개업 등 중개업의 유형 분류상호명: 제주시 관내에 등록된 결혼중개업체의 공식 명칭신고등록일: 중개업체가 「결혼중개업 관리에 관한 법률」에 따라 제주시청에 신고 또는 등록을 완료한 날짜상태: 영업 중, 폐업, 등록 취소 등 현재 영업 상태를 표시최근 3년 이내 행정처분 현황: 허위·과장 광고, 계약서 미작성 등 위반사항 발생 시 행정처분 내역을 수록활용 목적본 데이터는 시민이 합법적이고 신뢰할 수 있는 결혼중개업체를 선택할 수 있도록 정보를 제공하고, 관계기관의 지도점검, 불법업소 단속, 제도 개선 및 정책 수립을 위한 기초자료로 활용됩니다. 데이터는 제주시청에서 수시로 갱신·관리하며, 최신 등록 및 변경 사항을 반영합니다.'
