summary_user: 경기도 내 일반 협동조합을 사업장 단위로 담은 건별 목록으로, 시군명·사업장명·업종·조합 유형·생산/제공 품목·신청일·수리일·대표자 성명을 포함한다. 창업 준비자나 정책 분석가가 "우리 시군에 어떤 업종의 협동조합이 언제 설립 수리됐나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드(SIGUN_CD)·시군명이나 사업장명 매핑으로만 다른 사회적경제 데이터(사회적기업·마을기업 등)와 잇는다.
description_portal: 이 데이터는 경기도 내 일반 협동조합의 등록 및 운영 현황을 보여주는 자료입니다. 각 협동조합의 시군명, 사업장명, 업종명, 조합 유형명, 생산 또는 제공하는 품목 내역, 신청일, 수리일(허가일), 대표자 성명 등의 항목이 포함되어 있습니다. 해당 데이터는 문화, 건축, 기술, 교육, 운수, 장애인 지원 등 다양한 분야에서 설립된 협동조합에 대한 정보를 제공하며, 경기도 사회적경제육성과에서 관리하고 월 단위로 갱신됩니다. 지역 기반의 사회적 경제 활성화, 지역 일자리 창출, 생활밀착형 서비스 확산 등의 정책 수립과 분석에 활용될 수 있으며, 상업적 사용과 데이터 수정이 가능합니다.
