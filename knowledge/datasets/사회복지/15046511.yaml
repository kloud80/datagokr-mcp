description_portal: 서울시 통계정보시스템에서 제공하는 노숙인 생활시설 및 생활인원(2015년 이후)에 대한 통계정보 입니다. 서울특별시 자치구별 시설수, 입소자(행정기관 의뢰, 전입, 기타), 퇴소자(연고자 인도, 직업자활, 전원, 무단퇴소, 사망, 기타), 연말현재 입소자 수 등을 제공합니다. 이 데이터는 서울시 전체와 자치구별 현황을 동시에 제공하므로, 지역별 시설 수급 현황을 비교하거나 노숙인 복지정책의 효과를 분석하는 데 중요한 기초자료로 활용될 수 있습니다. 특히 입·퇴소 사유와 연말 기준 입소자의 특성을 종합적으로 살펴봄으로써, 향후 노숙인 지원 정책의 방향을 설정하고 맞춤형 복지 서비스를 설계하는 데 유용한 자료입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
