description_portal: 해당 데이터는 서울시 보육통계 어린이집 유형별 영유아 현황정보입니다. 데이터는 통계연도, 만나이, 만나이명칭, 전체_아동수, 전체_국공립아동수, 전체_민간아동수, 전체_가정아동수, 전체_기타아동수로 구성됩니다. 각 연령대별로 국공립, 민간, 가정, 기타 유형의 아동 수를 나누어 제공하며 이를 통해 아동의 유형별 분포를 파악하고, 지역별 보육 및 교육 정책에 필요한 기초 자료를 제공합니다. 또한, 아동 수의 변화 추이를 통해 교육 및 보육 시설의 수요 예측에 도움이 됩니다.※ 바로가기 클릭 시 열린데이터광장에서 개방된 데이터를 확인할 수 있습니다.
