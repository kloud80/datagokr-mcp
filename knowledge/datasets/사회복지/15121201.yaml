summary_user: 한국청소년활동진흥원이 청소년 핵심역량·진로개발 설문을 위해 만든 평가 문항을 총괄역량(구분)과 하위요소별로 정리하고 5점 척도 응답 선택지를 함께 담은 문항 목록이며, 건별 응답자료가 아닌 약 8KB 규모의 전국 단위 단일 CSV 파일이다. 연구자나 청소년 프로그램 담당자가 '공감·소통 같은 역량을 어떤 문항으로 재야 하나'를 확인하거나 사전·사후 효과 비교용 진단도구를 설계할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 데이터와는 역량명·문항 텍스트를 이름으로 맞춰 잇거나 같은 기관의 설문 응답 자료와 대조하는 방식으로만 연결한다.
limits: 문항과 척도 정의만 있어 실제 응답 분포나 점수, 지역별 결과는 알 수 없고, 지역(시군구·시도) 단위 통계와 이을 수 없는 전국·비공간 자료다. 명세상 수시 생성 후 바뀌지 않는 이벤트성 자료라 정기 갱신을 기대하기 어렵다.
