description_portal: "본 데이터는 한국청소년활동진흥원이 청소년의 핵심역량 및 진로개발과 관련한 설문조사를 구성하기 위하여 설계한 평가 문항 정보를 수록한 자료이다. 해당 데이터는 역량 기반 교육·정책 연구를 위한 기초 도구로 활용되며, 청소년의 자기인식 및 성장 발달 과정을 정량적으로 파악하고자 하는 목적에서 수집되었다.데이터는 총괄역량(예: 비판적 사고, 공감, 소통 등)을 '구분' 항목으로, 각 역량을 세분화한 '하위요소' 항목으로 분류하여 체계적으로 구성되어 있다. 각 문항은 청소년의 행동 특성이나 인지적·정서적 반응을 묻는 진술문 형식으로 제시되며, 응답 선택지는 ‘전혀 그렇지 않다’부터 ‘매우 그렇다’까지 5점 척도로 설계되어 있다. 문항 항목은 실제 설문 응답자료와 연계되어 있어 설문 응답 해석의 기준점 역할을 하며, 영역별 문항의 수, 표현 방식, 난이도 등을 일목요연하게 확인할 수 있다.이 데이터는 청소년 역량 진단도구의 개발·검증, 문항 신뢰도 및 타당도 분석, 프로그램 사전·사후 효과 비교 분석 등에 활용될 수 있으며, 교육기관, 연구자, 정책담당자 등이 청소년 대상 프로그램을 설계하거나 연구기반 자료로 인용하기에 적합하다. 또한 다양한 응답자 집단 간 문항 이해도 차이 분석 및 역량 모형 재구성 등 후속 연구의 기초자료로도 기능한다."
