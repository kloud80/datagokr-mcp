summary_user: 경기도 내 장애인 보호작업장을 기관 단위로 한 행씩 담은 현황 자료로, 시군명·기관명·주소·좌표·연락처와 근로장애인 정원·현원, 설치신고일자, 운영 법인명을 담는다. 장애인과 가족이 사는 시군의 보호작업장 위치와 정원 대비 현원을 확인하거나, 분석가가 시군별 보호작업장 분포와 수용 규모를 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시군명(sigun_nm)·법인명 같은 이름 매칭이나 위경도 좌표로 잇는다.
description_portal: 「경기도 장애인 보호작업장 현황」 데이터는 경기도 내 장애인 보호작업장의 기관별 운영 현황을 정리한 자료입니다. 이 데이터는 보건복지부의 「장애인 복지시설 일람표」를 기반으로 하며, 경기도장애인복지종합지원센터(누림센터)에서 제공합니다.직업능력이 낮은 장애인에게 직업적응능력 및 직무기능 향상훈련 등 직업재활훈련 프로그램을 제공하고, 보호가 가능한 조건에서 근로의 기회를 제공하며, 이에 상응하는 노동의 대가로 임금을 지급하며, 장애인 근로사업장이나 그 밖의 경쟁적인 고용시장으로 옮겨갈 수 있도록 돕는 역할을 하는 시설에 대한 정보입니다.
