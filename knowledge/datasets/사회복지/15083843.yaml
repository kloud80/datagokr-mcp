description_portal: 공무원연금공단에서 운영하는 연금 관련 교육의 회차별 참가비용을 집계한 통계자료입니다. 2001년부터 기준년도까지 연도, 교육회차, 교육참여금액(식대·숙박비 등), 교육과정명 정보가 포함되어 있으며, 퇴직예정자 대상 연금제도 이해 교육, 연금관리자 과정, 업무담당자 실무교육 등 다양한 교육과정의 비용 현황을 제공합니다. 해당 데이터는 각 회차별 교육 참가비용 변동을 확인할 수 있어, 연금 교육의 운영비용 추이 분석 및 교육 정책 개선에 활용됩니다. 2019년부터 온라인 교육으로 전면전환되어 참가비용이 없으며, 연도별 교육유형 및 교육횟수를 참고하여 교육 참여 계획을 수립할 수 있습니다.
