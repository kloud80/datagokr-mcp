summary_user: 경기도 안에서 운영하는 0세 영아 전용 어린이집을 시설 한 곳당 한 행으로 담은 현황 목록으로, 시군명·어린이집 유형·행정동·어린이집명·도로명/지번 주소·위도·경도·전화번호가 들어 있다. 부모가 '우리 동네에서 가까운 0세 전용 어린이집은 어디인가'를 찾거나, 분석가가 시군·행정동별 0세 전용 보육시설 분포와 부족 지역을 살필 때 쓴다. 전역 조인 키는 없어서 시군명·행정동명 같은 이름이나 주소·좌표로 다른 보육시설·인구 자료와 맞춰 이어 붙인다.
description_portal: 이 데이터는 경기도 내 0세 영아 전용 어린이집의 현황을 수록한 자료로, 시군명, 어린이집유형, 행정동명, 어린이집명, 소재지 도로명 및 지번주소, 위도/경도 좌표, 어린이집 전화번호 등의 정보를 포함합니다. 0세 전용 어린이집은 영아의 안전한 보육과 발달을 지원하기 위한 특화시설로, 본 데이터는 보육정책 수립, 지역별 보육서비스 수요 분석, 보육환경 개선 등에 활용될 수 있습니다. * 0세아 전용 어린이집이란?- 경기도에서는 교사대 아동 비율을 1:2로 하는 0세아전용어린이집을 운영하여 0세아 보육에 요구되는 특수성 및 부모의 다양한 보육 요구에 부응하고자 합니다.- 기타 자세한 설명은 경기도육아종합지원센터 홈페이지(https://gyeonggi.childcare.go.kr/) > 어린이집지원 > 0세전용어린이집 을 참고하시기 바랍니다.
