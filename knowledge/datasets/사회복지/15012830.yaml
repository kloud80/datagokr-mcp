description_portal: 성평등가족부가 발간한 청소년 인터넷·스마트폰 중독 예방 및 해소 관련 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 학년구분, 인터넷 과의존 현황의 조사인원, 위험 사용자군, 주의 사용자군, 성별에 따른 인터넷 과의존 위험군 등의 내용을 확인할 수 있습니다.특정 연령대의 디지털 과의존 문제를 체계적으로 대응하는 데 기반이 됩니다. 데이터의 세부 정보는 예방 교육과 상담 프로그램을 세분화하는 데 활용될 수 있으며, 학교 현장에서 맞춤형 교육 콘텐츠를 구성하거나, 지역 사회 내 전문가와의 협업을 도모할 수 있는 실질적 자료입니다. 청소년의 건강한 미디어 이용 환경 조성을 위한 정책 개발에 폭넓게 활용될 수 있습니다.
