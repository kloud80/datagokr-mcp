summary_user: 청소년 인터넷·스마트폰 과의존 진단 결과를 학년 구분(구분)별로 묶은 전국 단위 집계표로, 조사인원과 위험·주의 사용자군 수, 성별 위험군, 인터넷·스마트폰 중복(공존)위험군을 담으며 파일 크기는 744바이트 수준의 소규모 표다. 학년별로 과의존 위험군이 얼마나 되고 남녀 중 어느 쪽에 더 많은지를 확인해 예방교육이나 상담 프로그램 대상을 정하려는 정책 담당자·교육 현장·연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없고 지역 구분도 없는 전국·비공간 자료라서, 다른 데이터와는 학년 구분 이름을 맞추거나 같은 기관 자료끼리만 나란히 놓고 비교한다.
limits: 전국 합계만 있어 시도·시군구별 과의존 현황은 알 수 없고 지역 통계와 연계할 수 없다. 명세상 연간·이벤트성으로 생성 후 바뀌지 않는 파일이라 조사 시점이 다른 연도와 비교하려면 별도 파일이 필요하다.
