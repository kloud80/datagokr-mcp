summary_user: 제주특별자치도 안 청소년쉼터를 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·규모(제곱미터)·소재지·운영법인·개원일·종사자 수·입소정원을 담는다(파일 크기 829바이트 수준의 소규모 목록). 가정 밖 청소년을 돕는 상담·복지 실무자나 보호자가 '제주에서 지금 입소를 문의할 수 있는 쉼터가 어디이고 정원은 몇 명인가'를 확인하는 데 쓴다. 전역 조인 키나 시설코드가 없어 다른 청소년 시설 데이터와는 시설명·소재지 주소를 맞춰 잇고, 지역 통계와는 시도 단위로만 연결한다.
description_portal: '제주특별자치도 내 청소년 쉼터 운영 현황에 대한 데이터를 제공합니다.항목: 시설명, 규모, 소재지, 운영법인, 개원일, 종사자, 입소정원*「청소년복지 지원법」에 의거하여 관리됨- 청소년쉼터: 가정 밖 청소년에 대하여 가정ㆍ학교ㆍ사회로 복귀하여 생활할 수 있도록 일정 기간 보호하면서 상담ㆍ주거ㆍ학업ㆍ자립 등을 지원하는 시설- 청소년: 9세 이상 24세 이하인 사람자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1482'
