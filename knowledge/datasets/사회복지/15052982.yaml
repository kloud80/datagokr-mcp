summary_user: 공무원연금공단의 장해연금 수급자 수를 연령구간(구분)과 성별로 나누고, 장해등급 1등급부터 11등급 이하까지 열로 펼쳐 집계한 전국 단위 통계 파일(csv, 약 1KB)입니다. 공무원 재해보상 정책을 보는 분석가가 고령층이나 특정 성별에서 중증 장해등급 수급자가 얼마나 몰려 있는지 확인할 때 씁니다. 전역 조인 키가 없어서 다른 연금·재해보상 통계와는 연령구간·성별·장해등급 이름을 직접 맞춰 이어 붙여야 합니다.
description_portal: 공무원연금공단에서 관리하는 장해등급별 연령별 성별 장해연금수급자 현황을 기준년도 기준으로 집계한 통계입니다.장해등급(1등급~11등급 이하)별 연령구간(30대미만~80세이상, 5세단위)별 성별로 구분된 장해연금 수급자현황을 포함하고 있습니다.장해등급별 세분화된 장해연금수급자 분포의 변화 추이를 통해 공무원들의 직무 관련 부상이나 질병의 심각도 변화 등을 확인하고, 관련 정책 개선에 활용할 수 있습니다.장해등급 판정은 공무원 재해보상법 시행령의 장해등급표를 기준으로 하여, 시행규칙의 판정기준에 따릅니다.
