summary_user: 경상남도 남해군에 있는 재가장기요양기관을 기관 한 곳당 한 행으로 담은 목록 파일(csv, 약 2KB)로, 기관명·급여종류(방문요양·방문간호 등)·설립구분(공공/민간)·주소·전화번호를 담는다. 남해군에 사는 어르신이나 가족이 "집 근처에서 방문요양을 해 주는 기관이 어디이고 연락처는 무엇인가"를 찾을 때 쓰고, 복지 담당자가 군내 재가요양기관 분포를 파악할 때도 쓴다. 전역 조인 키나 기관 코드가 없어 건강보험 장기요양기관 정보나 다른 노인복지시설 목록과는 기관명·주소를 맞춰 보는 방식으로만 이어 쓴다.
