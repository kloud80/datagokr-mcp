description_portal: 대표적인 여성복지 지원기관으로는 여성긴급전화 1366 가 있다. 여성긴급전화 1366은 가정 내 폭력, 성폭력, 성매매, 스토킹, 교제폭력, 디지털 성범죄 등으로 피해를 입은 여성과 가족을 대상으로 365일 24시간 긴급상담 서비스를 제공한다. 또한 피해자 보호를 위한 긴급구조, 임시보호시설 연계, 의료·법률기관 연계 등 통합적인 지원 서비스를 운영하고 있다.또한 해바라기센터는 성폭력, 가정폭력, 성매매 피해자를 대상으로 상담, 의료지원, 수사지원, 법률지원 등을 원스톱으로 제공하는 여성폭력 피해자 지원기관이다. 피해자의 심리적 안정과 신속한 회복을 돕고 2차 피해를 예방하기 위해 전문 상담과 보호서비스를 제공하고 있다.
