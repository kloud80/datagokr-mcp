description_portal: 서울글로벌센터 월별 상담실적 데이터는 서울글로벌센터에서 월 단위로 집계한 상담 실적을 제공하는 통계자료입니다. 년월별로 기관·유형에 따른 상담 현황을 구분하여 전화, 방문, 이메일, 게시판, SNS, 이동상담, 문자 등 상담 채널별 건수를 제공합니다. 합계 항목을 통해 채널별 상담 건수를 합산한 총 상담 건수를 확인할 수 있어, 시기별 상담 수요 변동 분석, 상담 방식별 이용 패턴 파악, 외국인 상담 서비스의 효율적 운영 및 정책 수립에 활용할 수 있는 데이터입니다. 나아가 장기적인 상담 추세 분석과 특정 정책 시행 전후 효과 비교에도 활용 가능하여, 외국인 지원 행정의 근거 자료로 중요한 역할을 하는 데이터입니다.
