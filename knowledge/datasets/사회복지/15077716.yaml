description_portal: 경상남도 통영시_지능형홈기반독거노인상담내역 공공데이터는 통영시 지능형 홈(IoT) 장비가 설치된 독거노인을 대상으로, 월별 상담·점검·이상징후 대응 현황을 정리한 통계자료입니다. 2020년 1월부터 2024년 12월까지 약 5년 동안의 데이터를 포함하며, 상담연월을 기준으로 장비 이상 여부 점검(장비점검), 감지·미감지 및 미수신에 따른 후속 점검(미감지, 미감지점검, 미수신, 미수신점검), 119 긴급출동(119호출), 민원 접수 및 처리(민원, 민원상담, 민원점검), 신규 설치·장비 교체·장기부재 관리(신규설치, 장비교체, 장기부재), 전원차단, 전화·현장 상담(전화상담, 현장상담) 건수를 담고 있습니다. 이를 통해 독거노인 대상 안전관리·복지상담 서비스의 활동량과 위험 대응 패턴을 파악하고, 향후 취약계층 돌봄 정책 및 지능형 홈 서비스 개선에 활용할 수 있습니다. 마지막 열인 데이터 기준일은 자료가 집계·검증된 날짜를 나타내어 데이터의 최신성 및 신뢰성을 확인하는 데 도움을 줍니다.
