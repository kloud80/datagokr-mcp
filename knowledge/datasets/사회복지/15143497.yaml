summary_user: 전국 봉안시설을 시설 한 곳당 한 행으로 담은 파일로, 시도·시군구·시설명·주소·연락처와 공설·사설 구분, 주차대수, 최초 안치기간과 연장 가능 연수·횟수, 식당·매점·주차장·유족대기실·장애인편의시설 여부를 담는다. 유족이나 장례 준비자가 우리 지역 공설 봉안당의 안치기간과 연장 조건, 장애인 편의시설 유무를 비교할 때 쓴다. 전역 조인 키나 코드는 없어 다른 데이터와는 시도·시군구 이름이나 시설명·주소를 맞춰 이어 써야 한다.
description_portal: '보건복지부에서 2026년 5월 31일 기준 전국 봉안시설 현황(시도, 시군구, 시설명, 주소 ,전화번호 ,팩스번호, 홈페이지 주소, 주차대수, 공/사설 구분, 허가면적, 묘역면적, 총매장능력, 식당, 매점, 주차장, 유족대기실, 장애인편의시설)에 대한 데이터를 제공 합니다.<통계 데이터 이용 시 유의사항>* 봉안 : 화장한 유골을 유골함에 담아 봉안시설에 안치하는 것* 봉안시설 : 봉안묘·봉안당·봉안탑·봉안담 등 유골을 안치(매장은 제외)하는 시설* 봉안묘 : 분묘의 형태로 된 봉안시설* 봉안당 : 『건축법』 제2조제1항 제2호에 따른 건축물인 봉안시설* 봉안탑 : 탑의 형태로 된 봉안시설* 봉안담 : 담 또는 벽의 형태로 된 봉안시설<봉안시설의 종류>* 공설봉안시설 : 지방자치단체에서 설치하고 운영하는 시설(직영 또는 위탁운영)* 사설봉안시설 : 개인(가족) 또는 종중(문중)이 설치하고 그 구성원이 사용하는 시설, 종교단체, 재단법인 (또는 공공법인)이 설치하고 사용료를 받아 운영하는 시설'
