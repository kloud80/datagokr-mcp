summary_user: 전국 시도별 등록장애인 수를 기준연도(STD_YY)마다 1~6급 장애등급별, 그리고 '심한 장애'·'심하지 않은 장애' 구분별로 집계한 시도 단위 통계를 담는다. 복지 분석가나 지자체 담당자가 "우리 시도의 중증 장애인 비중이 다른 시도보다 높은가"처럼 지역별 장애인 분포와 복지 수요를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 시도 단위 통계와는 시도명(SIDO_NM)을 이름 매핑해 연결한다.
description_portal: 이 데이터는 전국 시도별 등록장애인의 장애등급별 현황을 제공하며, 장애인 인구 분포와 복지 수요 파악에 활용됩니다. 보건복지부와 경기도청 장애인복지과가 공동 제공하며, 매년 12월 말 기준의 자료로 시도별 장애인 수를 등급별로 집계합니다. 장애등급은 1급에서 6급까지로, 숫자가 작을수록 장애 정도가 심함을 의미합니다. 최근에는 등급제에서 ‘심한 장애’와 ‘심하지 않은 장애’로 단순화된 분류도 함께 제공합니다. 데이터는 정책 수립, 예산 배분, 지역별 복지 서비스 설계 등에 근거 자료로 활용되며, 특히 장애인복지법 개정 전·후 변화 분석에 중요합니다.
