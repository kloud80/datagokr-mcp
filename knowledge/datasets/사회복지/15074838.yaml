summary_user: 인천시 공동육아시설인 아이사랑꿈터(인천형 공동육아나눔터)를 시설 한 곳당 한 행으로 담은 원천 목록으로, 군구·시설명·소재지·연락처·전용면적·휴무일·개소일·진행사항을 담는다(포털 설명 기준 2025년 8월 10개 군구 60개소). 인천에 사는 7세 이하 자녀의 부모가 "우리 군구에서 가까운 공동육아 돌봄공간은 어디이고, 언제 쉬는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 어린이집·육아종합지원센터 데이터와는 군구명이나 소재지 주소를 맞춰 이어 쓴다.
description_portal: '인천시 공동육아, 공동돌봄 체계 구축을 위한 생활밀착형 공동육아시설(인천형 공동육아나눔터로, 7세 이하 미취학 전용 전문육아시설) 데이터입니다.2025. 8.  현재 10개 군구에 60개소가 설치 운영 중이며,돌봄공간 이용, 부모교육, 부모-자녀 체험프로그램, 자조모임 지원 등을 제공하고 있습니다.데이터를 통해 관내 10개 군구에서 운영하고 있는 아이사랑꿈터의 현황을 확인할 수 있으며, 데이터는 연간 업데이트되어 최신 정보를 반영합니다.해당 데이터는 공공데이터 포털에서 무료로 다운로드할 수 있으며, CSV 형식으로 제공횝니다. -항목명 : 연번군구시설명소재지연락처전용면적(제곱미터)휴무일개소일진행사항'
