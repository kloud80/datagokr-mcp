summary_user: 경기도 특수학급 학생 수를 기준년도와 장애영역별로 집계해 유치원(연령별)·초·중·고(학년별)·전공과(연차별) 학생 수로 나눠 담은 시도 단위 집계 자료다. 교육청이나 정책 분석가가 '경기도에서 어떤 장애영역의 특수학급 학생이 어느 학교급에서 늘고 있는가'를 따져 특수교사·시설 수급을 계획할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도(STD_YY)와 장애영역명을 이름으로 맞춰 이어야 한다.
description_portal: 이 데이터는 교육부(특수교육통계)에서 제공하는 경기도 내 특수학급 학생 수 집계 현황으로, 매년 6월 말 기준으로 장애영역별·학교과정별 학생 수를 정리한 자료입니다. 주요 항목에는 기준년도, 장애영역명, 총학생수, 유치원 전체 및 3세~5세 이상 학생 수, 초등학교(1학년~6학년), 중학교(1학년~3학년), 고등학교(1학년~3학년), 전공과(1년차~3년차) 학생 수가 포함되어 있습니다. 이를 통해 발달지체, 청각장애, 시각장애, 학습장애, 지체장애 등 장애유형별 학생 규모를 파악할 수 있으며, 학교급별 특수교육 대상자의 분포와 연령별 추이를 분석할 수 있습니다. 해당 데이터는 특수교육 대상 학생의 증가 추세 분석, 교육 지원 정책 평가, 장애영역별 맞춤형 교육 인력 및 시설 수급 계획 수립에 중요한 기초자료로 활용될 수 있습니다.
