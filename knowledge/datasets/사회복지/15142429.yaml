description_portal: 한국사회보장정보원에서 제공하는 사회서비스전자바우처포탈(www.socialservice.or.kr)의 서비스제공기관 정보에서 추출된 산모신생아건강관리 제공기관 정보입니다.데이터 구성은 시도, 시군구, 제공기관명, 제공기관주소, 제공기관상세주소, 제공인력수, 대상자수 항목으로 구성되어 있습니다. 이 데이터를 활용하여 산모신생아 건강관리 서비스의 지역별 제공역량 및 접근성 측면의 분석이 가능합니다.또한 산모·신생아 건강관리 제공기관 정보를 활용하면 보건복지, 서비스 접근성, 정책 효율성 등의 측면에서 다양한 데이터 분석이 가능합니다.예를들면 제공기관 규모별 만족도 차이, 민간 vs 공공의 품질 차이 분석도 가능하고, 전문인력 유무에 따른 서비스 효과성 비교를 해볼수 있습니다.
