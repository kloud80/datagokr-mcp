summary_user: 공공기관별로 우선구매 총 구매액, 인증사회적기업 제품 구매액, 총 구매액 대비 인증사회적기업 제품 구매 비율을 기관구분·기관명 단위로 담은 전국 단위 집계 파일(CSV, 약 49KB)이다. 정책 분석가나 사회적기업 사업자가 "어느 공공기관이 사회적기업 제품을 얼마나, 어떤 비율로 사고 있는가"를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 공공기관 데이터와는 기관명을 이름으로 맞춰야 이어 쓸 수 있고, 개별 사회적기업(인증번호·사업자번호) 축과는 직접 연결되지 않는다.
description_portal: 우선구매제도는 정부재정을 활용하여 국가적인 차원에서 정책적 지원이 필요한 중소기업, 기술개발, 친환경/저탄소 녹색성장, 사회경제적 배려대상 기업 및 단체 등이 생산 또는 공급하는 물품, 용역, 시설공사 등을 공공조달 과정에서 우선적으로 구매할 수 있도록 지원하는 제도입니다. 이에 대한 각 기관구분, 기관명, 기관의 우선구매 총 구매액, 인증사회적기업 제품 구매액, 총 구매액 대비 인증사회적기업 제품 구매 비율 데이터를 제공합니다.데이터에 관하여 문의가 있으시다면 한국사회적기업진흥원 정보화기획팀으로 문의 부탁드리겠습니다. 감사합니다.
