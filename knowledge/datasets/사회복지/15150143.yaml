summary_user: 청소년 활동 단체·기관이 정부에 신고한 청소년활동 프로그램별로 실제 활동이 진행되는 기간(시작일자·종료일자)을 신고번호와 활동기간 순번 단위로 담은 전국 범위의 건별 신고 데이터다. 학부모나 청소년 활동 담당자가 특정 신고 활동이 언제부터 언제까지 운영되는지, 일정이 겹치는지를 확인하는 데 쓴다. 전역 조인 키는 없으며, 같은 기관의 청소년활동 신고 관련 데이터와 신고관리번호(dclrMngNo)·신고번호로 맞춰 이어 쓰는 방식만 가능하다.
limits: 필드가 신고번호와 기간 정보뿐이라 활동명·장소·운영기관 등은 이 데이터만으로 알 수 없고, 다른 데이터와의 연결도 같은 기관의 신고번호나 이름 매핑에 의존한다. 지역 구분 없는 전국·비공간 데이터라 시군구·시도별 분석에 바로 쓰기 어렵다.
