description_portal: 용인도시공사 교통약자이동지원센터는 교통약자의 이동 편의를 증진하기 위해 다양한 이동지원 서비스를 운영하고 있으며, 해당 서비스의 연간 운영현황을 체계적으로 관리·공개하고 있습니다. 본 자료는 연 1회 정기적으로 갱신되며, 특별교통수단 및 개인콜택시의 이용 실적, 운영 규모, 서비스 제공 현황 등을 종합적으로 담고 있습니다. 이를 통해 서비스 이용 추이와 운영 효율성을 객관적으로 확인할 수 있으며, 향후 정책 개선과 서비스 품질 향상을 위한 기초 자료로 활용됩니다. 보다 상세한 내용이나 추가 문의사항은 용인도시공사 교통약자이동지원센터(031-339-6599)로 연락주시면 안내받으실 수 있습니다.
