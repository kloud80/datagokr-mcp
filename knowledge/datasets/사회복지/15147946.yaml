summary_user: 부산광역시 영도구 어린이집을 한 곳씩 담은 건별 현황 데이터로, 이름·유형·운영(폐지) 여부, 주소·연락처, 보육실 수·면적, 놀이터·CCTV 수, 보육교직원 수, 정원·현원, 위도·경도, 통학차량 운영 여부, 인가일자를 담는다. 학부모가 "영도구에서 통학차량을 운영하고 현원이 정원보다 적은 어린이집이 어디인가"를 찾거나, 분석가가 구 단위 보육 수급(정원 대비 현원)을 살피는 데 쓴다. 전역 조인 키(어린이집코드 등)는 응답에 없어, 다른 보육 데이터와는 어린이집명·주소로 맞추거나 시설 좌표(fcltLat·fcltLot)로 지도·공간 데이터에 겹쳐 쓴다.
limits: 응답 컬럼에 공통 기관 코드가 없어 평가·보육료 공시·입소 대기 등 다른 어린이집 데이터와는 이름·주소 매칭으로만 연결되며, 동명 시설은 오매칭에 주의해야 한다. 원시시스템 한계로 구·군별로만 조회되므로, 부산시 전체를 보려면 구·군별 API를 각각 호출해 합쳐야 한다.
