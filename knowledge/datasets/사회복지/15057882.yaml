summary_user: 경기도 내 아이돌봄서비스 제공기관(가족센터·건강가정지원센터 중심)을 기관 한 곳당 한 행으로 담은 목록으로, 기준연도·시군명·기관명·전화·팩스·도로명/지번주소·우편번호·위도·경도를 포함한다. 맞벌이 부모가 우리 시군에서 아이돌보미를 연계해 주는 기관이 어디이고 연락처가 무엇인지 찾거나, 분석가가 시군별 돌봄 제공기관 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)로 시군 단위 통계와 맞추거나 좌표로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 경기도 내 아이돌봄 서비스 제공 기관 현황입니다. 만 12세 이하 아동을 둔 맞벌이 가정 등을 위해 아이돌보미가 아동을 안전하게 돌봐주는 우리 가족 행복돌보미, 아이돌봄서비스가 있습니다.이 데이터는 경기도 내 아이돌봄서비스를 제공하는 공식 기관의 현황을 정리한 자료로, 가족센터 및 건강가정지원센터를 중심으로 한 돌봄서비스 제공기관의 정보를 담고 있습니다. 주요 항목에는 시군명, 기관명, 기관 전화번호, 도로명 및 지번주소, 우편번호, 위도·경도 좌표(WGS84) 등이 포함되어 있으며, 각 기관은 양육자의 일시적인 양육공백 해소, 맞벌이 가정 자녀 돌봄, 긴급 돌봄 지원 등을 위한 전문 인력을 연계합니다. 이 데이터는 지역별 돌봄 인프라 현황 파악, 아이돌봄 정책 설계, 서비스 접근성 분석, 가족친화정책 수립 등에 활용될 수 있으며, 주소와 좌표 정보는 공간정보 기반의 시각화 및 취약지역 식별에 유용합니다. 본 자료는 여성가족부 및 지자체 가족정책 부서가 수집한 공공 데이터입니다.
