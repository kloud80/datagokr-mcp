summary_user: 안산시 노인복지관을 시설 한 곳당 한 행으로 담은 파일로, 시설구분·시설명·도로명주소·소재지면적·전화번호·데이터기준일자를 제공하며 파일 크기가 384바이트에 불과해 수록 시설은 소수입니다. 안산시 주민이나 보호자가 가까운 노인복지관의 위치와 연락처를 찾거나, 분석가가 시 안의 노인복지 자원 분포를 살필 때 쓴다. 전역 조인 키가 없어 시설명·도로명주소로 건강보험 장기요양기관 목록이나 다른 노인복지시설 데이터와 맞춰 잇고, 지역 단위로는 시군구 통계와 연계한다.
limits: 사회복지시설 시설코드 같은 공통 식별자가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위가 안산시 한 곳의 노인복지관에 한정되어 경로당·재가·주간보호 등 다른 노인시설이나 타 시군구 비교에는 쓸 수 없다.
