description_portal: 이 데이터는 대구도시개발공사가 보유하고 있는 매입임대주택에 대해 수행된 수선 이력을 기록한 공공데이터로서, 주택의 유지관리 현황을 체계적으로 관리하고 수선 비용의 적정성과 행정 투명성을 확보하기 위한 목적으로 마련되었습니다. 수선구분, 일련번호, 주택, 동, 호, 계약자번호, 수선일자, 공사종류, 시공업체 등이 포함됩니다. 이를 통해 주택의 유지관리 현황을 체계적으로 관리하고, 시설물 노후화 대응 및 적정 예산 편성을 위한 기초자료로 활용됩니다. 임차인의 주거 안전성 확보 및 주택 자산의 가치 유지에도 기여하는 중요한 관리 지표입니다.
