summary_user: 전라남도 무안군 내 경로당을 한 곳씩 담은 시설 목록으로, 경로당 명칭·관리기관·소재지·무더위쉼터 지정 여부·관리기관 전화번호를 개별 주소 단위로 담는다. 주민이나 복지 담당자가 '우리 동네 가까운 경로당 중 폭염 때 무더위쉼터로 쓸 수 있는 곳과 연락처는 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 장기요양기관·다른 노인복지시설 목록과는 경로당 명칭이나 소재지 주소를 맞춰 이어야 하고, 시군구 단위 지역 통계와는 무안군 단위로 연계한다.
limits: 표준 시설코드 같은 공통 식별자가 없어 다른 데이터와 붙이려면 이름·주소 매칭이 필요하다. 범위가 무안군 한 곳이라 다른 시군과 비교하려면 각 지자체 자료를 따로 모아야 한다.
