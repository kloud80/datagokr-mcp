summary_user: 전국 한부모가족을 대상으로 한 실태조사 응답을 응답 가구 한 건씩 담은 원자료와 코드북으로, 지역·혼인상태·가구 구성과 가구원별 관계·연령·성별·장애·취업·학력 문항을 포함하며 zip 파일(약 490KB)로 활용신청 없이 받는다. 정책 분석가나 연구자가 '장애가 있거나 미취업인 저학력 한부모 가구는 어떤 가구 구성에 많이 분포하는가'처럼 복합 취약 집단을 가려내고 가족 유형을 세분화하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명 같은 이름이나 코드표 매핑으로만 느슨하게 이어 쓴다.
limits: 조사 범위는 전국이지만 공간 좌표가 없는 비공간 자료여서 시설 위치나 지도 분석에는 쓰지 못한다. 공통 조인 키가 없어 한부모가족 복지시설 목록 등과 행 단위로 직접 결합할 수 없으며, 문항 값은 함께 제공되는 코드북으로 해석해야 한다.
