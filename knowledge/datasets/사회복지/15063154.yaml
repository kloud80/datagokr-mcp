summary_user: 아이돌봄 서비스 정부지원 판정에 쓰는 기준표로, 기준년도별 소득액 구간(초과~이하)마다 대응하는 건강보험료 본인부담금을 직장·지역·혼합 가입 유형별로 담은 전국 단위 집계 표(약 7KB CSV)입니다. 아이돌봄 서비스를 신청하려는 가구가 "우리 집 건강보험료 본인부담금이 얼마면 어느 소득 구간에 해당하는가"를 확인하거나, 분석가가 가입 유형별 부담 수준을 비교할 때 쓴다. 다른 데이터와 공통 조인 키가 없어, 가구의 건강보험료 금액과 가입 유형을 이 표의 구간에 대조하는 방식이나 같은 기관의 아이돌봄 소득기준·지원 자료와 기준년도로 맞춰 이어 쓴다.
description_portal: '"아이돌봄 서비스 건강보험료 산정 기준에 대한 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 기준년도, 소득액(원)(초과-이하)의 내용과 건강보험료 본인부담금을 직장별, 지역별로 확인할 수 있습니다.소득기준과 연계하여 정부지원 자격 여부 판단 및 실질적 혜택 수준을 분석하는 데 도움이 됩니다. 해당 데이터를 통해 다양한 가구 유형의 부담 수준을 비교할 수 있으며, 소득 기준과의 연계 분석으로 보다 공정한 지원 구조 마련이 가능합니다. 실수요자 중심의 보건복지 지원 체계 수립에 필요한 기초 자료로도 유용합니다. 지원 대상 정교화와 예산 집행의 효율화에 활용될 수 있습니다."'
