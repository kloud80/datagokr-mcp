description_portal: '인천광역시 부평구 장애 유형별 등록현황 데이터입니다.해당 데이터는 행정 구역별, 장애 유형별로 등록된 인원 통계를 수록한 자료입니다. 맞춤형 복지 서비스 설계, 장애인 편의시설 확충, 복지 예산 배분 및 장애인 인권 증진을 위한 정책 수립의 핵심 기초 자료로 활용됩니다.활용 목적 및 특징  - 맞춤형 복지 행정: 동별/유형별 인원 파악을 통한 지역 맞춤형 복지 프로그램 개발  - 인프라 구축 근거: 특정 장애 유형(예: 시각, 뇌병변 등) 밀집 지역에 적합한 편의시설 확충  - 보건 의료 서비스 연계: 신장, 심장 등 내부 기관 장애 특성에 맞는 의료 지원 체계 구축  - 예산 및 자원 배분: 지역별 등록 인원에 비례한 복지 예산의 합리적 집행'
