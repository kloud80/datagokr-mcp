description_portal: 한국장애인개발원의  사외보 <디딤돌>는  1989년 12월 월간 ‘곰두리’로 창간된 이래 36년째 발행하고 있습니다.그동안 3,000부 이상을 월간 발행하였고, 2023년부터는 전면 웹진(모바일/오디오형태 포함)으로 전환하여 연 4회 발행되고 있습니다.디딤돌은 장애정책연구 전문기관으로서 한국장애인개발원의 주요 사업을 안내하고, 장애 관련 정책과 동향뿐만 아니라 우리 사회 다양한 장애인의 삶을 조명하며 인식개선에도 힘쓰고 있습니다.디딜돌 웹진은 오디오 버전 제공(디딤돌 웹진 상단 메뉴)하고 있으며 밀리의 서재에서도 검색해서 들을 수 있습니다
