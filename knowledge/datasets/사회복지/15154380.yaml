description_portal: 이 데이터는 한국보육진흥원이 제공하는 공공형 어린이집의 정원구간별 집계현황입니다. 시도 단위로 구분되어 있으며, 서울, 부산, 대구, 인천 등 각 지역별로 어린이집 정원이 20인 이하, 21인에서 49인, 50인에서 99인, 그리고 100인 이상으로 나뉘어 집계되어 있습니다. 각 구간별 수치와 함께 합계가 제공되어 있어 특정 지역의 전체 시설 규모와 정원 분포를 확인할 수 있습니다. 활용 방법으로는 특정 시도의 어린이집 정원 규모별 현황을 비교하거나, 전국적으로 소규모와 대규모 시설의 상대적 분포를 파악하는 데 사용할 수 있습니다. 또한 합계와 구간별 수치를 통해 각 지역의 보육 인프라가 어떤 정원 규모 중심으로 형성되어 있는지 기본적인 수준에서 확인할 수 있습니다.
