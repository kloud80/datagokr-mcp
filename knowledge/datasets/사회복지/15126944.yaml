description_portal: "본 데이터는 화성도시공사가 교통약자의 이동권 보장 및 사회 참여 확대를 위해 운영하는 교통약자 이동지원센터 '화성나래'의 일별 이용 및 운행 현황 통계 데이터입니다.화성시 내 장애인, 임산부, 고령자 등 대중교통 이용이 어려운 교통약자들을 위한 전용 차량의 실질적인 운영 지표를 담고 있으며, 데이터의 세부 구성과 활용 가치는 다음과 같습니다.1. 주요 제공 데이터 항목 (CSV 데이터 기준)연월일: 서비스가 제공된 구체적인 날짜를 제공하여 일별, 요일별, 시즌별 이용 추이 분석이 가능합니다.차량운행: 해당 일자에 실제 투입되어 운행된 화성나래 차량의 총 대수를 제공합니다.접수건: 당일 서비스를 이용하기 위해 접수된 총 콜(Call) 수를 의미하며, 잠재적 이동 수요를 파악할 수 있습니다.탑승건: 접수된 건 중 실제 매칭되어 탑승이 완료된 건수로, 이동지원 서비스의 실질적인 공급량을 나타냅니다.2. 데이터의 전략적 가치 및 활용 분야이동권 정책 수립: 접수 건수 대비 탑승 건수(배차 성공률)를 분석하여 특정 시간대나 요일의 차량 증차 필요성을 판단하는 정책 기초 자료로 활용됩니다.운영 효율성 분석: 차량 운행 대수 대비 탑승 실적을 통해 배차 시스템의 효율성을 진단하고, 대기 시간 단축을 위한 최적화 연구에 기여합니다.교통복지 지표 산출: 화성시의 교통약자 지원 서비스 수준을 정량화하여 공공기관 경영실적 및 지역 교통복지 지수 산출의 근거로 사용됩니다."
