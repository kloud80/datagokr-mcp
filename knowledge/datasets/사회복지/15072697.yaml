description_portal: 본 데이터는 국민건강보험공단이 실시하는 건강검진 중 일반건강검진 대상자 수 및 수검인원 현황을 시도 및 성별 기준으로 제공하는 통계자료입니다.건강검진은 매년 실시기준이 변경되며, 본 자료는 해당 연도 건강보험 적용인구 중 의료급여 수급권자를 제외한 검진 대상자와 실제 수검인원에 대한 정보를 포함합니다.통계는 검진 종료 후 이듬해 3월까지 정산된 자료를 기준으로 하며, 국가승인통계인 건강검진통계연보에 수록되어 있습니다.본 자료는 보건의료정책 수립, 지역별 건강지표 분석, 국민 건강 수준 평가 등에 활용되며, 건강검진 제도의 효과적 운영을 위한 기초자료로 제공됩니다.
