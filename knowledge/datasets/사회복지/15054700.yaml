description_portal: 본 데이터는 장애인 활동지원사 교육기관 및 활동지원기관의 현황 정보이다. 기관별 명칭, 소재지, 연락처, 교육 과정, 제공 서비스 등의 세부 내용을 포함한다. 활동지원사 교육기관은 장애인의 일상생활 및 사회 활동을 지원하는 활동지원사를 양성하는 기관이며, 활동지원기관은 장애인에게 활동지원 서비스를 제공하는 기관이다. 해당 자료는 장애인 복지 정책 수립, 활동지원 서비스 확대 계획, 활동지원사 양성 사업 개발에 활용된다. 활동지원사 교육을 통해 전문 인력을 양성하고 서비스 품질을 향상시킨다. 또한 장애인이 필요한 활동 지원을 받아 자립 생활 및 사회 참여를 촉진한다. 시민들이 교육 과정 및 서비스 기관 정보를 확인하여 활동지원사로 활동하거나 서비스를 신청하는 데 유용하다.
