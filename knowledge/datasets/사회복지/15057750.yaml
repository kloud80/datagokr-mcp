summary_user: 경기도 시군별로 장애인복지신문을 보급한 가구 수를 연도 단위로 집계한 자료로, 전체 보급 가구 수와 장애 등급별(1~2급, 3급, 4~6급)·장애 정도별(심한 장애, 심하지 않은 장애)·시설과 기타 보급 대상 수를 담는다. 장애인 복지 정책 담당자나 분석가가 "어느 시군의 장애인 가구가 복지 정보지를 덜 받고 있는가" 같은 지역 간 정보 접근 격차를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 시군 이름이나 시군 코드(SIGUN_CD)와 연도로 다른 경기도 시군별 장애인 통계와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군별로 장애인복지신문 보급 현황을 집계한 자료로, 연도별 기준으로 수집됩니다. 데이터에는 전체 보급 가구 수를 비롯하여 장애 등급별 수혜 가구 수(1~2급, 3급, 4~6급), 장애의 정도에 따른 구분(심한 장애, 심하지 않은 장애), 그리고 시설이나 기타 유형에 포함된 보급 대상이 포함되어 있습니다. 본 자료는 장애인 가구에 대한 복지 정보 전달 현황을 파악하고, 지역 간 정보 접근 격차나 장애 유형별 복지 정보 수요 분석에 활용될 수 있으며, 정책 수립, 매체 배포 전략 수립, 정보격차 해소 등을 위한 기초 자료로 활용됩니다.
