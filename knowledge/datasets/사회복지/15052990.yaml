summary_user: 공무원연금공단이 건립·분양한 공무원 아파트를 분양 건별로 정리한 소규모 파일(csv 약 2KB)로, 분양일·지역·총 세대수, 전용면적 구간(50㎡ 이하~125㎡ 초과)별 세대수, 건립비, 사업기간을 담는다. 주거복지 정책 분석가가 '공단이 어느 지역에 어떤 면적 위주로 공무원 주택을 얼마의 비용으로 공급했나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름을 직접 맞추거나 같은 기관의 공무원임대주택·연금 통계와 나란히 놓고 본다.
description_portal: 공무원연금공단이 추진한 공무원 아파트 건립 및 분양 현황을 지역 단위로 정리한 통계로, 주거복지 제공을 위한 공공주택 건립사업의 실행 내역을 파악할 수 있도록 구성되어 있습니다. 데이터는 지역별로 총 분양 세대수, 세대면적(전용면적)별 세대수, 건립비용, 사업기간 등의 항목을 포함하며, 세대수는 분양공고일 기준으로 집계된 수치를 기준으로 합니다. 지역별 분양규모와 단위면적별 주택 공급 구조, 사업비용 수준 등을 비교할 수 있으며, 공무원 주거 안정정책의 이행 현황을 확인할 수 있습니다.현재 공단은 2015년 이후 신규 건립분양을 추진한 내용이 없습니다.
