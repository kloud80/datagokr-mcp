description_portal: '사립학교교직원연금공단의 회관별 수입 현황과 관련된 데이터로 부산·대전회관의 수입(단위 : 백만원) 등의 항목을 제공합니다. 수입에는 임대료, 관리비, 임대보증금 등 운용수익, 사업 외 수입, 기타 등이 있으며 최근 5개년(직전년도 기준) 회관별 수입에 대한 데이터를 제공하고 있습니다. 이 데이터를 통해 공단의 재정 운용 투명성을 제고하고 각 센터의 재정적 기여도를 명확하게 보여주고자 합니다. 또한 센터별 운영 효율성 분석 및 향후 예산 편성과 사업계획 수립을 위한 기초자료로 활용될 수 있습니다.본 데이터는 공공기관의 책임 있는 재정 관리를 입증하고 이해관계자들이 공단의 재무 구조를 명확히 파악할 수 있도록 지원합니다.'
