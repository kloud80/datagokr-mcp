summary_user: 충청남도 당진시 어린이집을 한 곳당 한 행으로 담은 현황 파일로, 유형·운영 상태, 도로명·지번 주소와 위도·경도, 보육실 수와 면적, 놀이터·CCTV 수, 보육교직원 수, 정원과 현원, 통학차량 운영 여부, 인가일자를 담는다. 당진에 사는 부모가 집 근처에서 통학차량을 운영하고 정원 대비 현원에 여유가 있는 어린이집을 찾거나, 분석가가 읍·면·동별 보육시설 공급을 살피는 데 쓴다. 전국 공통 어린이집코드 같은 조인 키가 실측 컬럼에 없어서, 다른 데이터와는 어린이집명·주소를 맞추거나 좌표로 공간 결합해 이어 쓴다.
limits: 범위가 당진시 한 곳뿐이라 다른 시군과 비교하려면 각 시군 파일을 따로 모아야 한다. 전역 조인 키가 없어 평가·보육료 공시·입소 대기 같은 다른 어린이집 데이터와는 이름·주소 매칭으로만 연결되므로 매칭 오류에 주의한다.
