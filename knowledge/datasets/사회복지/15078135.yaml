summary_user: 아이돌봄 서비스 제공기관을 지정할 때 적용하는 기준과 자격요건을 기준연도별로 담은 전국 단위 기준 정보이며, 기준 구분·상세 구분·기준 내용(dsgnCrtrCn)과 데이터 기준일자가 한 행을 이룬다. 정책 분석가나 제공기관 지정을 준비하는 기관 담당자가 '올해 아이돌봄 제공기관으로 지정받으려면 어떤 요건을 갖춰야 하고, 작년과 무엇이 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 기준 구분명을 이름으로 맞추거나 같은 기관 데이터와 엮어 쓰는 방식으로만 연결한다.
limits: 개별 제공기관 목록이나 위치를 담지 않는 비공간 기준 정보이므로 기관 단위 분석에는 별도 데이터가 필요하다. 공통 코드나 조인 키가 없어 다른 데이터셋과 자동으로 결합되지 않는다. 개발계정은 하루 3,000회로 호출이 제한된다.
