summary_user: 대구광역시에 등록된 법인·비법인 청소년단체를 단체 한 곳당 한 행으로 담은 현황 파일로, 구분·법인명·설립년월일·주소·전화번호·설립목적을 담는다(약 5KB 규모의 CSV). 청소년이나 학부모, 청소년 업무 종사자가 "대구에서 활동하는 청소년단체는 어디이고 연락처와 설립목적은 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 단체명 매칭이나 주소를 시군구 단위로 바꾼 값으로 지역 통계와 잇는다.
