description_portal: 대구광역시에 등록되어 있는 법인·비법인 청소년단체의 현황 정보에 관한 데이터입니다. 청소년 단체의 성격에 따른 구분, 법인명, 대표자, 설립년월, 주소, 전화번호 등을 제공합니다. 대구광역시의  청소년단체에 대한 정보가 필요한 분들, 학술 연구를 하시는 분들, 청소년단체의 도움이 필요하거나 관심이 있으신 분들, 그 외에 청소년 관련 업무에 종사하시는 분들께서 필요에 따라 활용이 가능한 자료입니다. 본 데이터는 1년을 주기로 검토하여 단체별로 변경내역이 있을 시에 업데이트하여 반영하고 있습니다.
