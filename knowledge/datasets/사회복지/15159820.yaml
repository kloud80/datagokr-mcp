summary_user: 경상북도 영천시의 보육·교육·의료 인프라를 연도별로 집계한 소규모 파일(csv, 165바이트)로, 2023~2025년 어린이집 수·유치원 수·국공립보육시설 비율(시설 수 병기)·산부인과 수를 담는다. 영천시 이주나 출산을 고민하는 시민이나 지역 정책 분석가가 "영천시의 어린이집·유치원·산부인과는 최근 몇 년 사이 늘었나 줄었나, 국공립 비율은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 개별 어린이집 기본정보 등과 시설 단위로 연결할 수 없고, 연도 기준으로 영천시의 다른 연도별 통계와 나란히 놓고 비교하는 정도로 이어 쓴다.
limits: 시설별 이름·주소·정원 같은 건별 정보가 없는 시 단위 연도 집계라 개별 어린이집 조회나 다른 시설 데이터와의 키 결합에는 쓸 수 없다. 국공립보육시설비율 칸에는 비율(%)과 시설 수가 함께 적혀 있어 숫자로 쓰려면 분리해 읽어야 한다.
