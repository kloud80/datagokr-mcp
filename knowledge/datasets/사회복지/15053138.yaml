summary_user: 경기도 안의 중증장애인 자립생활센터를 한 곳당 한 행으로 담은 기관 목록이며, 시군명·기관명·지번·도로명 주소·우편번호·WGS84 위도·경도·전화번호·홈페이지 주소를 포함한다. 장애인 당사자나 가족이 사는 시군에서 가장 가까운 자립생활센터와 연락처를 찾을 때, 또는 분석가가 시군별 센터 분포가 고른지 점검할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 시군명(sigun_nm) 같은 이름을 맞추거나 위도·경도로 공간 결합해 잇는다.
description_portal: 이 데이터는 경기도 내 중증장애인을 위한 자립생활지원센터의 분포 현황을 나타내는 자료입니다. 주요 항목에는 시군명, 기관명, 소재지지번주소, 소재지도로명주소, 우편번호, WGS84 위도·경도, 전화번호, 홈페이지 URL이 포함되어 있으며, 각 센터의 지리적 위치와 연락처, 온라인 정보 접근성을 확인할 수 있습니다. 이 자료는 지역별 장애인 복지 서비스 접근성 분석, 센터 분포의 균형성 평가, 생활권 기반 복지정책 수립 등에 활용될 수 있습니다. 또한 지도 기반 정보(GIS) 구축이나 상담 접근성 평가 자료로도 사용 가능합니다. 주소 정보는 지번주소와 도로명주소로 이중 제공되어 행정적 및 실무적 활용 편의성을 높였습니다.
