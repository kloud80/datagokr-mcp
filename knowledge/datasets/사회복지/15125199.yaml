summary_user: 청소년 상담 사례에서 청소년 상태별로 컴퓨터·인터넷 사용 문제(과의존, 게임 문제 등)가 어떻게 나타나는지를 차트 형태의 집계값(제목·구분·X축·Y축·값)으로 담은 전국 단위 통계다. 청소년 상담·정책 담당자나 연구자가 '재학·학교 밖 등 청소년 상태에 따라 인터넷 사용 문제 상담이 어떻게 다른가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 항목 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 청소년 상담 청소년 상태별 컴퓨터 및 인터넷 사용 문제 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.과의존, 사이버 중독, 게임 문제 등 디지털 관련 이슈를 구체적으로 제시합니다. ICT 환경에서의 정신건강 문제나 생활 리듬 장애 등을 분석해 문제 대응방향 설정에 도움이 되면, 인터넷 중독 예방 교육자료 개발이나 스마트폰 사용 실태 비교 연구에도 적합합니다. 디지털 환경에 적응하는 청소년을 위한 맞춤형 정책 수립에 활용될 수 있습니다.
