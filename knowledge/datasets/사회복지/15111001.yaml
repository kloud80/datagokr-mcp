description_portal: 대전광역시 척수장애인 재활지원사업 현황은 2018년부터 2021년까지 매년 운영된 척수 장애인 대상 재활 지원 활동에 대한 연간 단위의 행정 데이터를 포함합니다. 이 자료는 사업 별 추진 내역, 대상자 수, 재활 프로그램 운영 현황, 지역사회 복귀를 위한 맞춤형 서비스 활동 내용 등을 다루며, 척수장애인의 기능 회복과 자립 지원을 위한 공공 복지 지원 체계 전반을 보여줍니다. 특히 연도 별 운영 성과 비교를 통해 사업의 지속성과 효과성을 평가하고, 개선이 필요한 프로그램이나 지원 사각지대 발굴에 필요한 기초 자료로 활용됩니다. 더불어 이 데이터는 장애인 복지 정책 수립, 민간단체 협력 계획 수립, 재활 서비스 확대 및 예산 편성의 근거 자료로서 활용될 수 있습니다. 본 자료는 2022년 공공데이터 기업매칭지원사업으로 수행되었습니다
