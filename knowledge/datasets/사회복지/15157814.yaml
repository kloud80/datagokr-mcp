summary_user: 경상북도 영천시에 있는 지역아동센터 7곳을 센터 한 곳당 한 행으로 담은 목록으로, 시설명·소재지·정원과 현원·전화·팩스·운영시간·운영형태·급식 방식을 포함한다. 영천시에 사는 보호자가 집 근처 지역아동센터의 운영시간과 남은 자리(정원 대비 현원)를 확인하거나, 분석가가 시 안의 지역아동센터 이용률을 살펴보는 데 쓴다. 전역 조인 키는 없으므로 다른 사회복지시설 목록과는 시설명이나 소재지 주소를 맞춰 연결해야 하고, 주소를 좌표로 바꾸면 지도에 표시할 수 있다.
description_portal: 본 데이터는 경상북도 영천시에 소재한 지역아동센터의 현황 정보를 포함하고 있습니다. 영천시 내 각 아동센터의 위치, 정원 및 현원, 연락처, 운영시간, 운영형태, 급식 방식 등에 관한 상세한 내용을 제공하며, 지역아동센터의 운영 현황 파악과 정책 수립에 활용될 수 있는 중요한 자료입니다. 데이터는 총 7개 센터의 정보를 포함하고 있으며, 각 센터별로 소재지, 정원과 현원, 전화번호, 운영시간, 운영형태, 급식 방식이 구체적으로 기재되어 있습니다. 이를 통해 영천시 내 아동복지 서비스의 현황을 한눈에 파악할 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 가족행복과로 연락주시기 바랍니다.
