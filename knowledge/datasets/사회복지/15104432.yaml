summary_user: 사립학교교직원연금공단이 제공하는 무료법률자문서비스의 지역별 제휴 업체 목록으로, 업체마다 지역·업체명·전화번호·주소와 공통 안내사항을 담은 소규모 CSV 파일(986 bytes)이며 범위는 전국입니다. 사학연금 가입 교직원이 "우리 지역에서 채권·임대차·상속 같은 생활법률 상담을 무료로 받을 수 있는 곳이 어디인가"를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명이나 주소를 기준으로 맞춰 이어 쓴다.
description_portal: 사립학교교직원연금공단_무료법률자문서비스 이용안내와 관련된 데이터로 지역, 업체명, 전화번호, 주소, 공통안내사항 등의 항목을 제공합니다.상담범위는 일상생활법률이며 상담분야로는 채권, 채무, 부동산, 주택임대차, 가사, 상속, 교통사고, 근로, 행정, 조세, 형사, 연금 등이 있습니다.이 데이터를 통해 사립학교 교직원 및 이해관계자들은 복잡한 법률 문제에 대한 도움을 쉽게 받을 수 있으며, 공단의 사회 공헌 활동을 인지할 수 있습니다.또한, 서비스 이용 활성화를 위한 홍보 자료로 활용될 수 있으며, 국민들의 법률 지식 접근성 향상에 기여합니다. 본 데이터는 공공기관의 정보 공개 의무를 이행하고, 대국민 서비스의 투명성을 제고하는 데 중요한 역할을 합니다.
