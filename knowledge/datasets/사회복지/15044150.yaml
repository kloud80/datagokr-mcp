description_portal: 본 데이터는 영유아의 건강한 성장 발달을 지원하고 가정 내 양육 비용 부담을 완화하기 위해 성북구도시관리공단 SB장난감도서관에서 운영하는 장난감 대여 서비스의 통합 정보를 제공합니다.데이터의 주요 구성 항목으로는 관리기관명과 연락처, 상세 소재지를 포함하여 이용 접근성을 높였으며, 각 장난감별 발달 영역(신체, 인지, 언어 등)과 권장 사용 연령, 제조사 및 연간 대여료 정보를 상세히 수록하여 보호자가 자녀의 성장 단계에 적합한 놀잇감을 사전에 파악할 수 있도록 구성하였습니다.본 데이터는 지역별 육아 지원 인프라 분석, 연령별 선호 놀잇감 통계 추출, 스마트 양육 가이드 앱 개발을 위한 기초 자료로 광범위하게 활용될 수 있습니다.장난감별 실시간 대여 가능 여부 및 신규 입고 소식 등 상세한 이용 안내는 성북구도시관리공단 공식 홈페이지(https://www.gongdan.go.kr/childCare/toy/selectPageListToy.do?up_id=01)를 통해 상시 확인이 가능합니다.
