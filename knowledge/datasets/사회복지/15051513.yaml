description_portal: 이 데이터는 근로복지공단의 퇴직연금 기록 관리 시스템이 보유한 온라인 교육 과정에 대한 핵심 정보를 담고 있으며, 기준 시점은 2019년 8월 31일입니다.주요 필드는 해당 교육 과정을 등록하고 관리하는 기관인 등록 지사 번호('본부'로 표기됨), 교육의 주제를 나타내는 온라인 교육 과정 기본_교육 과정명, 그리고 해당 교육이 어떤 내용을 담고 있는지 상세히 기술한 온라인 교육 과정 기본_교육 과정 내용으로 구성되어 있습니다.제공되는 교육 과정명으로는 '은퇴 설계', '재무 설계'와 같은 실생활에 유용한 주제는 물론, '확정 기여형 퇴직연금 가입자 교육', '기업형 IRP 가입자 교육' 등 퇴직연금 제도의 법적 의무 교육 및 형태별 맞춤형 교육 콘텐츠가 포함되어 있습니다. 이는 근로복지공단이 퇴직연금 가입자들에게 제도 이해도와 자산 운용 역량을 강화하기 위해 제공하는 교육 서비스의 포트폴리오를 보여줍니다.
