description_portal: 공적연금 연계신청자 현황과 관련된 데이터로 연계 신청 연도, 연계 신청 인원 등의 항목을 제공합니다. 연계신청자 현황 데이터를 통해 공적연금 연계 관련 법령 개정 시 사용될 수 있습니다. ※ 공적연금 연계신청이란 「국민연금과 직역연금의 연계에 관한 법률」이 2009.8.7. 부터 시행됨에 따라 국민연금 가입기간과 직역연금 재직기간을 합하여 20년 이상이면 연금으로 받을 수 있도록 하여 국민의 노후생활을 보장하고자 도입한 제도입니다.이 데이터를 통해 공적연금 연계 제도의 활용 현황을 투명하게 공개하고, 제도 개선 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다. 또한, 연금 가입자들이 연계 제도를 이해하고 활용하는 데 도움을 줄 수 있습니다. 본 데이터는 공공기관의 연금 제도 운영 투명성을 높이고, 국민의 노후 소득 보장 강화에 기여하는 데 목적이 있습니다.
