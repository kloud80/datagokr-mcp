summary_user: 공무원연금 퇴직연금 수급자 수를 퇴직 당시 연령대(구분)별 행과 정무직·일반직·경찰·소방·교육직·군무원 등 직종별 열로 교차 집계한 전국 단위 표로, 약 2.4KB 크기의 CSV 파일 한 건이다. 연금 정책 분석가나 연구자가 '경찰·소방 같은 특정 직군에서 이른 나이에 퇴직해 연금을 받는 사람의 비중이 다른 직종보다 큰가'와 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연령대·직종 이름을 맞춰 붙이거나 같은 공무원연금공단의 다른 수급자 통계와 나란히 비교하는 식으로만 이어 쓴다.
description_portal: 공무원연금공단에서 제공하는 직종별·연령별 퇴직연금수급자 현황(퇴직 당시 연령 기준) 데이터입니다. 본 자료는 퇴직연금 수급자의 퇴직 당시 연령을 기준으로 38세 미만부터 고령층까지 구분하고, 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관·검사, 기능직, 고용직, 공안직, 군무원, 연구직, 지도직, 계약직, 기타(우정직, 외무직, 청원경찰, 전문경력관 등) 등 주요 직종별 퇴직연금 수급자 규모를 제공합니다. 해당 데이터는 직종별 퇴직 연령 분포와 퇴직 시점의 특성을 파악하는 데 유용하며, 특정 직군에서의 조기 퇴직 또는 고령 퇴직 비중 등을 종합적으로 분석할 수 있습니다.
