summary_user: 아이돌봄 지원사업 모니터링 응답 결과를 대상ID(trgtId)와 모니터링 구분별로 묶어, 건의사항 최대 5개와 개선필요 사항 최대 9개의 내용과 각 응답 건수를 담은 전국 단위 집계 데이터다. 정책 담당자나 연구자가 '아이돌봄 서비스 이용자·돌보미가 가장 많이 건의하거나 개선이 필요하다고 꼽은 항목은 무엇인가'를 파악해 서비스 개선 과제를 정하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 전역 조인 키가 없어, 같은 기관(한국건강가정진흥원)의 다른 아이돌봄 데이터와는 대상ID나 모니터링 구분명 같은 이름·코드를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 아이돌봄 모니터링 응답자 내용 정보 데이터는 공공데이터법 제24조에 따라 추진되는 제4차 국가중점데이터 개방계획에 포함된 아이돌봄 지원사업 관련 데이터입니다.이 데이터는 국가적 파급효과와 활용가치가 높은 고수요 데이터를 국가중점데이터로 개방한다는 취지에 따라 선정되었으며, 표준화 절차와 품질 점검을 거쳐 신뢰성을 확보한 후 오픈API 방식으로 제공됩니다.이를 통해 이용자는 아이돌봄 서비스 현황 분석, 민간 서비스 연계 검토 등 다양한 정책·연구·서비스 기획 목적에 활용할 수 있으며, 다른 공공데이터와 결합하여 공공 및 민간 분야 전반에서 활용 범위를 넓힐 수 있습니다.
