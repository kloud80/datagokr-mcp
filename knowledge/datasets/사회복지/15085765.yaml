description_portal: 서울글로벌센터 언어별(월) 상담실적 데이터는 월별로 기관/유형에 따라 어떤 언어로 상담이 이루어졌는지를 집계한 통계자료입니다. 년월(YYYYMM) 단위로 한국어, 영어, 일본어, 중국어, 베트남어, 타갈로그어, 몽골어, 프랑스어, 러시아어, 우즈벡어, 태국어, 네팔어, 인도네시아어, 파키스탄어(우르두어), 아랍어, 스페인어 및 기타언어별 상담 건수를 제공하고, 합계 항목을 통해 전체 상담 건수를 한눈에 파악할 수 있습니다. 이를 통해 시기별·언어별 상담 수요 분포를 분석하고, 특정 언어권 이용자의 증가 추세나 지원이 필요한 언어권을 파악하여 통역 인력 배치, 다국어 안내자료 제작 등 외국인 대상 맞춤형 서비스 계획 수립에 활용할 수 있는 데이터입니다.
