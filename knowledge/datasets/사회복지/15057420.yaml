summary_user: 경기도 일부 시군(가평·부천·성남·수원 등 21곳) 장애인복지관이 운영하는 프로그램을 프로그램 한 건씩 담고, 이용대상(장애유형·연령 조건), 이용금액과 산정기준, 부가비용, 이용시간, 복지관 주소·좌표·연락처를 함께 싣는다. 장애인 당사자나 가족이 "우리 시군 복지관에서 성인 발달장애인이 들을 수 있는 프로그램과 비용은?"을 찾을 때, 또는 분석가가 시군별 프로그램 구성을 비교할 때 쓴다. 전역 조인 키는 없어 시군코드·시군명(SIGUN_CD)이나 복지관명으로 맞춰 다른 경기도 데이터와 잇고, 위경도와 도로명주소로 위치 기반 결합을 한다.
description_portal: 경기도 내 장애인복지관에서 운영하는 프로그램 정보입니다.가평, 과천, 구리, 군포, 김포, 동두천, 부천, 성남, 수원, 시흥, 안성, 양주, 양평, 오산, 용인, 의왕, 의정부, 이천, 파주, 평택, 하남 장애인복지관 운영 프로그램의 프로그램별 이용대상, 이용금액, 부가비용 등의 정보를 제공합니다.※ 장애인복지관은 시군과 복지관이 위수탁 협약을 체결하여 운영하거나, 민간에서 운영하는 경우가 대부분입니다만, 도-시군-장애인복지관 간의 협력을 통해 일부 장애인복지관의 운영 프로그램을 데이터화하여 제공합니다.※ 프로그램별로 장애유형, 거주지 등에 대한 제한이 있으니 유의하시기 바랍니다.※ 이용자의 조건(소득수준, 장애등급 등) 등에 따라 이용금액이 상이한 경우가 있으니, 반드시 유의사항을 확인하시기 바랍니다.
