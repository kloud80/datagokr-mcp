description_portal: '공무원연금공단에서 관리하는 재해보상급여 종류별(공무상요양비,공무상요양일시금,유족보상금,유족연금,장해연금,장해유족연금 등) 정부부담급여 지급액 데이터로 1983년부터 기준년도까지 제공하고 있습니다.1. "96년 이후 부조급여 건수 및 금액에는 지방자치단체에서 지급한 건수 및 금액을 제외함2. "83년∼"00년 장해연금·장해유족연금 지급건수는 연금수급자 수임3. 위험직무순직유족연금 및 위험직무순직유족보상금은 "06년 3월 신설4. 순직유족연금은 "11. 11. 5. 시행5. 법령개정("16. 7. 28.)에 따라 급여 용어변경 : 유족보상금 → 순직유족보상금, 순직유족보상금 → 위험직무순직유족보상금6. 공무원 재해보상법 제정("18. 9.21.)에 따라 급여 용어변경 : 공무상요양비 → 요양급여, 장해보상금 → 장해일시금, 재해부조금 → 재난부조금'
