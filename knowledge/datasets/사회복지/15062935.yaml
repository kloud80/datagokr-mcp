summary_user: 경상남도 내 협동조합을 한 곳씩 담은 건별 목록으로, 조합명·종류·유형·업종·대표자·전화번호·도로명주소·위도경도·등록일을 담는다. 지역 주민이나 창업 준비자가 '우리 동네에 어떤 업종의 협동조합이 있고 언제 설립됐는가'를 찾거나, 분석가가 경남 협동조합의 업종·지역 분포를 지도로 그릴 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 사회적경제·기업 데이터와는 조합명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
