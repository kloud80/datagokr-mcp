summary_user: 충청남도 서산시 안의 재가장기요양기관을 기관 한 곳당 한 행으로 담은 목록으로, 기관명·급여종류(주야간보호·방문요양·방문목욕 등)·주소·전화번호를 담는다(CSV 약 5.7KB). 장기요양 대상자와 가족이 '서산시에서 방문요양이나 주야간보호를 하는 기관이 어디이고 연락처는 무엇인가'를 찾을 때, 또는 지자체 담당자가 지역별 재가 서비스 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 노인복지시설·건강보험 장기요양기관 자료와는 기관명이나 주소를 맞춰 이어야 한다.
