summary_user: 국민연금 수급자를 법정동 단위 지역·연령대·성별·연금 종류(노령·장애·유족)별로 묶어 총인원수, 월 평균 연금수급액, 평균 수급기간, 평균 누적수급액, 납부액 대비 수급액 비율과 그 최고값을 담은 집계 통계이며, 수급현황·최고값·연령별 세 가지 조회를 제공한다. 분석가나 지자체 담당자가 '우리 동네 노령연금 수급자는 몇 명이고 월 평균 얼마를 받는가'처럼 지역별 연금 수급 규모와 수준을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 지역 이름이나 같은 기관(국민연금공단) 코드 매핑으로만 연결한다.
limits: 검증 호출에서 수신된 행이 0건이어서 실제 반환 범위와 값의 형태를 이 검증만으로는 확인하지 못했다. 표준 행정코드 같은 공통 조인 키가 없어 다른 지역 통계와 붙일 때는 이름 매핑이 필요하며, 개인별 수급 내역이 아닌 집계값만 담는다.
