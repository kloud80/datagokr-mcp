summary_user: 아이돌봄 서비스의 누적 가정 실적을 기준연월·아이돌봄기관별로 담은 집계 데이터로, 전염성질병 아동 여부와 돌봄구분별 신청가정수·이용가정수, 가~라형 유형별 가정 수를 전국 범위로 제공한다. 지자체·정책 분석가가 "어느 기관에서 돌봄 신청 대비 실제 이용이 얼마나 되고, 가~라형 중 어떤 유형 수요가 몰리는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 기관번호(childCareInstNo)·상위기관번호 또는 기관명을 기준으로 같은 기관의 다른 아이돌봄 데이터나 사회복지시설 마스터와 이름·코드 매핑으로 연결한다.
description_portal: 아이돌봄 누적가정실적 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연월, 아이돌봄기관명, 전염성질병아동여부, 돌봄구분명, 신청가정수, 이용가정수, 가~라형 가정 수 등 관련 정보를 확인할 수 있습니다.지역별 수요의 집중도를 분석할 수 있습니다. 전염성 질병 아동 포함 여부나 돌봄유형에 따른 서비스 신청 및 이용 간의 차이를 비교 분석하여 정책의 효과성 평가에 기여할 수 있습니다. 가형부터 라형까지 유형별 수요량을 파악해 유형별 자원 배분의 균형성을 제고하는 데 도움이 됩니다. 이러한 데이터는 장기적인 추세 분석을 통한 아이돌봄 서비스의 전략 수립에도 활용될 수 있습니다.
