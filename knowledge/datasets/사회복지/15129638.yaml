summary_user: 경기도 시군별로 제공되는 복지서비스를 서비스 한 건 단위로 정리한 목록으로, 시군명·서비스명·지원대상·지원주기·담당부서·신청방법·상세 링크를 담는다. 시민은 '우리 시군에서 받을 수 있는 출산·노인·청년·장애인 지원이 무엇이고 어디서 신청하나'를 찾는 데, 연구자는 시군별 복지서비스 분포와 유형을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm) 같은 이름 매핑으로만 이어 쓰며, 세부 부문 분류상 기대되는 인증번호·사업자번호 같은 기업 축 키도 이 데이터에는 없다.
description_portal: 이 데이터는 경기도 전역에서 제공되는 다양한 복지서비스 현황을 집계한 자료로, 시군별·사업별 복지지원 정책을 한눈에 확인할 수 있습니다. 주요 항목은 시군명, 서비스명, 지원대상, 지원주기, 담당부서명, 신청방법, 서비스링크주소로 구성되어 있으며, 임신·출산 지원, 노인 장려금, 청년 지원사업, 장애인 복지, 보훈대상자 예우, 저소득층 생활 안정 등 폭넓은 영역을 포괄합니다. 연구기관은 복지정책의 지역별 분포와 서비스 유형을 분석하여 정책 사각지대 발굴이나 복지 수요 예측 연구에 활용할 수 있고, 시민은 데이터 내 링크를 통해 직접 서비스 상세 내용을 확인하고 신청할 수 있습니다.
