description_portal: 과학기술정보통신부가 디지털 격차가 심화되는 것을 방지하기 위해 국민 모두에게 디지털 역량 교육을 제공하는 사업인 디지털 배움터에 관련된 20년~24년간의  운영 현황입니다.과학기술정보통신부가 디지털 격차 해소와 전 국민의 디지털 역량 강화를 위해 추진하는 디지털배움터 사업의 운영 현황을 제공하는 데이터셋입니다. 디지털 소외계층을 포함한 모든 국민이 디지털 기기와 서비스를 활용할 수 있도록 교육을 제공하는 국가 차원의 디지털 포용 정책 사업입니다. 데이터는 연도별 디지털배움터 개소수와 교육인원으로 구성되어 있으며, 전국 각 지역에 설치된 디지털배움터의 운영 규모와 교육 실적을 파악할 수 있습니다. 디지털배움터에서는 스마트폰, 컴퓨터, 태블릿 등 디지털 기기 활용법부터 온라인 쇼핑, 금융서비스, 공공서비스 이용 방법까지 실생활에 필요한 다양한 디지털 교육이 제공됩니다. 이 데이터는 디지털 격차 해소 정책의 성과를 평가하고, 지역별 디지털 교육 수요를 파악하는 데 활용될 수 있습니다. 또한 디지털 포용 정책 연구자, 지방자치단체, 교육기관 등이 디지털 역량 교육 프로그램을 기획하고 평가하는 데 중요한 기초자료가 됩니다.
