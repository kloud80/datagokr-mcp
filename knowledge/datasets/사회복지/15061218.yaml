description_portal: 서울시 보육통계 연도별 영유아 인구수 및 보육현황 데이터는 서울시 내 영유아(0~5세)의 인구 변화와 보육시설 현황을 연도별로 제공합니다. 이 데이터는 영유아 인구 수(영아와 유아로 구분)와 어린이집 및 유치원의 수와 비율, 시설 미이용 아동 수 등을 포함합니다. 또한, 출산율, 어린이집과 유치원의 보육 비율, 시설 이용 현황 등 다양한 지표를 통해 서울시의 보육 정책 및 인프라 변화 양상을 알 수 있습니다. 이 데이터를 통해 영유아 인구의 감소와 보육시설의 변화, 미이용 아동 비율 등의 주요 추세를 확인할 수 있습니다.
