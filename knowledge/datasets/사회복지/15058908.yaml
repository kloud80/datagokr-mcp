summary_user: 경기도 장애아동수당 수급자 수를 연도(STD_YY)·시군별로 집계하고, 시군 합계와 함께 지체·뇌병변·시각·청각·지적·자폐성 등 15개 장애유형별 수급자 수를 담은 집계 자료이며, 포털 설명상 매년 12월 말 기준입니다. 복지정책 분석가나 지자체 담당자가 '자폐성 또는 뇌병변 장애아동 수급자가 많은 시군은 어디인가'처럼 시군 간 수급 격차와 장애유형별 지원 수요를 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 시군 코드(SIGUN_CD)나 시군명으로 다른 경기도 시군 통계와 이름·코드를 맞춰 연결한다.
description_portal: '이 데이터는 경기도 장애아동수당 수급자 현황을 시·군별, 장애유형별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애아동수당은 만 18세 미만 장애아동에게 지급되는 복지 수당으로, 중증·경증 장애 모두를 포함합니다. 데이터에는 각 시군별 수급자 총합과 함께 장애유형별 세부 현황이 포함되며, 예를 들어 지체장애, 뇌병변, 시각, 청각, 언어, 안면, 신장, 심장, 간, 호흡기, 장루·요루, 뇌전증, 지적, 정신, 자폐성 장애아동 수급자 수가 별도로 제공됩니다.이 자료는 시군 간 수급 격차 분석, 장애유형별 지원 필요도 파악, 아동 복지정책의 기초 통계로 활용될 수 있습니다. 특히 특정 장애유형(예: 뇌병변, 자폐성) 아동의 수급률이 높은 지역을 식별해 지역 맞춤형 복지정책을 수립하는 데 도움을 줍니다.'
