summary_user: 경기도 워라밸링크 플랫폼에 올라온 시군 공공기관·지역단체의 워라밸 관련 사업·콘텐츠를 건별로 담은 자료로, 고유번호·콘텐츠 기관명·사업방식·제목·작성일(wrt_ymd)을 포함한다. 지역복지 담당자나 분석가가 '경기도 안에서 어떤 기관이 어떤 방식의 워라밸 프로그램을 운영하는지'를 파악하고 사업 유형 분포를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 데이터와는 기관명(conts_inst_nm) 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼에서 각 시군별 공공기관 및 지역단체가 운영하는 워라밸 관련 사업과 콘텐츠를 수록한 자료입니다. 항목은 고유번호, 콘텐츠 기관, 콘텐츠 사업방식, 제목, 콘텐츠 고유번호, 작성일 등으로 구성되며, 다양한 기관이 참여하고 있습니다. 각 지역 특성과 주민 수요를 반영한 프로그램 중심으로 운영됩니다. 이 데이터는 지역별 워라밸 관련 사업 유형의 분포를 분석하고, 정책 연계성 강화, 수요 기반 맞춤형 서비스 기획, 지역복지 통합지원체계 수립 등에 활용할 수 있습니다.
