summary_user: 서울특별시 강서구에 설치된 폐형광등·폐건전지 분리수거함의 위치(행정동, 주소, 관리부서)를 수거함 단위로 담은 점자파일(blb·brf·brl)이며, zip 7,834바이트 규모의 시군구 범위 자료입니다. 시각장애인 주민이 점자 디스플레이나 점자 프린터로 '우리 동네 가까운 폐건전지 수거함이 어디 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름이나 주소 문자열을 맞춰 연결해야 하며, 같은 내용의 일반(비점자) 강서구 수거함 위치 데이터와 짝지어 쓴다.
description_portal: '서울특별시 강서구 내 설치된 폐형광등 및 폐건전지 분리수거함의 위치 정보입니다.생활폐기물 중 유해성 물질이 포함된 전구류 및 건전지류의 안전한 수거와 재활용을 유도하기 위한 목적에서 구축된 자료입니다.주요 항목으로는 설치된 행정동, 정확한 주소지, 관리부서 정보 등이 포함되며, 지역 주민들이 가까운 수거함 위치를 쉽게 확인할 수 있도록 제공됩니다.디지털 약자 공공데이터 접근성 제고를 위하여 점자파일을 개방합니다. * 점자데이터 파일 형식- blb: 편집용 점자 문서- brf: 출력용 점자 문서 (점자 프린터 전용)- brl: 출력용 점자 문서 (점자 디스플레이 장치용)해당 점자데이터 파일 형식의 문서는 점자데이터 시스템 설치 후 확인 가능합니다.ex) 점사랑 (국립국어원 홈페이지에서 다운로드 가능:  https://korean.go.kr/braille/common/greeting.do)'
