summary_user: 부산광역시 남구에 있는 노인복지시설(요양시설·재가시설 등)을 시설 한 곳당 한 행으로 담은 파일로, 시설유형·시설명·전화번호·소재지 주소·시설장명·설치일자를 담는다. 남구 주민이나 가족이 '집 근처에 어떤 노인요양시설이나 주야간보호 기관이 있고 연락처가 무엇인가'를 찾을 때, 분석가가 남구 안 노인복지시설의 유형별 분포를 볼 때 쓴다. 전역 조인 키는 없어서 시설명·주소를 맞춰 건강보험 장기요양기관 목록이나 사회복지시설 목록과 잇고, 시군구 단위 지역 통계에는 남구로 묶어 연결한다.
description_portal: '○ 노인의료복지시설  (1) 노인의료복지시설의 종류    - 노인요양시설 : 입소정원 10명 이상    - 노인요양공동생활가정 : 입소정원 5명이상 9명이하  (2) 입소대상    ① 노인장기요양보험법 제15조에 따른 수급자중 시설 급여 대상자      - 장기요양 1~2등급      - 장기요양 3~5등급자 중 불가피한 사유, 치매 등으로 등급판정위원회에서 시설급여 대상자로 판정 받은 사람    ② 위에 해당하지 않는 사람 중 아래와 같은 사유로 반드시 시설 입소가 필요한 노인은 먼저 양로시설로 보호 조치하고, 만약 양로시설의 입소가 불가능할 경우에는 관할 시·군·구청장이 판단하여 노인요양시설로 입소 보호      - 노인보호전문기관에서 학대피해노인으로서 입소를 의뢰한 노인      - 기초수급자(생계급여 또는 의료급여)나 긴급조치 대상자로서 거주지가 없어져서 가정에서 생활이 불가능하거나 부양의무자가 부양을 거부하거나 실종되는 등의 사유로 수발을 들 사람이 없는 경우○ 재가노인복지시설  (1) 재가노인복지시설의 종류    - 방문요양서비스    - 주야간보호서비스    - 단기보호서비스    - 방문목욕서비스    - 재가노인지원서비스    - 방문간호서비스    - 복지용구지원서비스  (2) 이용대상     ① 장기요양급여수급자     ② 장기요양급여수급자 이외의 자중 기초수급권자 및 부양의무자로부터 적절한 부양을 받지 못하는 자로서 혼자서 일상생활을 수행하기 어려워 재가서비스의 제공이 필요한 자     ③ ‘08.7.1.일 이전에 국가 및 지방자치단체로부터 운영비를 지원받는 시설을 이용하고 있는 장기요양급여수급자 이외의 자 중 “기초수급권자” 및 실비이용자“'
