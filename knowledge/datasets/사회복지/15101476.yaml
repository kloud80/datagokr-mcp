description_portal: 한국사회보장정보원에서 제공하는 연도별 정부가 보유하고 있는 어린이집 연령별 보육아동 현황입니다.데이터 구성은 연령 구분 및 연도 항목으로 구성되어 있습니다. 이 데이터를 활용하여 연령대별 어린이집 보육아동 수의 연도별 변화 및 타 데이터와의 결합을 통한 연령별 보육 수요 특성 측면의 분석이 가능합니다.또한 어린이집의 전반적인 현황 분석과 특성별 맞춤형 관리 및 정책 수립, 보육교직원 구성 현황과 아동현황 연계, 취약 및 특수보육 아동 미율과 관련 서비스 제공 현황 점검 측면의 분석이 가능합니다.추가적인 내용이 궁금하시면 아래 경로를 참고하시길 바랍니다. ※ 경로 "어린이집정보공개포털-보육정보공개API-OPEN API-검색(해당 API명)"
