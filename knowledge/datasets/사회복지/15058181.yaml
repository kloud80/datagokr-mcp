summary_user: 경기도 내 건강가정지원센터(가족센터)를 시설 1곳당 1행으로 담은 목록으로, 시군명·시설명·전화번호·도로명/지번 주소·우편번호·WGS84 위도·경도와 기준연도(SUM_YY)를 포함한다. 가족상담·교육·돌봄 프로그램을 찾는 주민이 '우리 시군의 가족센터는 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 시군별 가족복지 인프라 분포와 접근성을 비교하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 시설명·주소 매칭으로 같은 경기도 사회복지시설 데이터와 잇고, 좌표로 다른 공간 데이터와 겹쳐 본다.
description_portal: 건강가정지원센터 현황 데이터는 경기도 내 가족복지 서비스 제공을 목적으로 운영되는 건강가정지원센터(가족센터)의 정보를 담고 있으며, 시군명, 시설명, 소재지 주소(도로명·지번), 우편번호, WGS84 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 본 데이터는 각 시군별 가족센터의 위치와 분포를 확인할 수 있으며, 센터가 제공하는 가족상담, 교육, 돌봄, 문화 프로그램 등의 서비스 접근성을 평가하는 기초 자료로 활용됩니다. 특히 위치좌표 정보는 GIS 기반 공간 분석을 가능하게 하여, 지역별 가족복지 인프라의 균형성 평가와 정책 수립에 유용합니다. 또한 이 데이터는 가족의 다양화와 복합적 문제 해결을 지원하기 위한 행정적·정책적 의사결정 근거 자료로 활용될 수 있습니다.
