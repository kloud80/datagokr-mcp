summary_user: 공무원연금기금 전체회계의 손익계산서를 계정 항목(구분)별 행, 연도별 열로 담은 집계표로, 실측 파일에는 2017~2025년 열이 있고 사업수익·사업비용·관리운영비·연금전출금·법인세 등 항목을 전국 단일 수준으로 정리한다. 분석가나 연금 재정에 관심 있는 국민이 '공무원연금기금의 연금수입과 연금급여사업비, 순이익이 해마다 어떻게 변했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 직역연금 통계와는 연도 열과 계정 항목 이름을 맞춰 붙여 쓴다.
description_portal: 공무원연금기금(전체회계) 사업수익(연금수입, 금융자산 운용수익, 대부수익, 복지 및 부동산 사업수익), 사업외수익, 특별수익, 사업비용(금융부문 비용, 복지 및 부동산 사업비, 연금급여사업비, 전산업무비, 업무위탁비), 관리운영비(인건비, 일반경비), 사업외비용, 연금전출금, 법인세 등 손익계산서에 대한 1983년부터 작성된 데이터입니다.이를 통해 전체회계의 연도별 재정 상태와 운영 성과를 파악할 수 있습니다.1. 순이익은 연금수지적자에 따른 연금회계지원금을 차감하기전 순이익임2. 충당부채(연금 및 퇴직수당) 제외3. 2015년부터 기금운용수익금의 일부를 정부보전금(기금보전금)으로 충당
