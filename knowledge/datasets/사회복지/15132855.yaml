summary_user: 전국 청소년활동 프로그램을 프로그램 한 건 단위로 담은 검색용 API로, 운영 시설·단체명, 활동명, 모집·프로그램·인증 기간, 모집인원, 대상 학령(초·중·고·대학·미재학), 개별·단체·가족 모집 여부, 당일·숙박 유형, 활동장소, 마감 여부를 담는다. 청소년이나 보호자가 '이번 방학에 중학생이 가족과 함께 참여할 수 있는, 아직 마감되지 않은 숙박형 인증 프로그램이 있는가'를 찾거나, 분석가가 대상 계층·운영형태별 프로그램 분포를 볼 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 기관명(instNm)·시설단체명이나 활동장소명을 이름으로 맞추거나 같은 기관의 시설·인증 일련번호로만 청소년수련시설 등 다른 데이터와 잇는다.
limits: 전역 조인 키가 없어 다른 데이터와 이으려면 이름 매칭에 기대야 한다. 생성 후 바뀌지 않는 이벤트형 갱신으로 분류돼 있어, 모집 마감 여부 같은 현재 상태가 실시간이라고 보지 말고 호출 시점의 값으로 확인한다. 개발계정은 하루 10,000회로 호출이 제한된다.
