description_portal: 전북특별자치 도내  "한부모가족 가족유형별 가구수, 수급자수" 데이터는 한부모가족지원(청소년한부모가족지원 포함) 관련 법에 따라 급여나 서비스를 받는 가구와 수급자를 집계한 통계입니다. 데이터 항목은 가족유형(모자가족, 부자가족, 조손가족, 청소년모자가족, 청소년부자가족 등), 중위소득비율구분(중위소득 30% 이하, 30~40% 이하 등)., 가구수, 수급자수(한부모가족의  구성원의 총 수)를로 구성되었습니다. 이 통계는 한부모가족 지원 정책 수립 및 평가에 중요한 기초 자료로 활용됩니다.자세한 사항는 복지통계 사이트(https://www.bokjiro.go.kr)를 활용해 주시기 바랍니다.
