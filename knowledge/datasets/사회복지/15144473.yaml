summary_user: 전북특별자치도 내 한부모가족 지원 법에 따라 급여·서비스를 받는 가구수와 수급자수를 통계연월·시군구·가족유형(모자·부자·조손·청소년한부모 등)·중위소득비율 구간별로 집계한 통계 파일입니다(CSV 약 13KB). 복지 분석가나 지자체 담당자가 '전북 시군구별로 부자가족·조손가족 수급 가구가 얼마나 되고 중위소득 30% 이하 구간에 얼마나 몰려 있는가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·시군구명 같은 이름 매칭으로만 이어 쓰며, 같은 세부 부문의 한부모·가족센터 등 시설 데이터와 시군구 단위로 나란히 놓고 본다.
