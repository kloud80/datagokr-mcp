description_portal: 강남구 내 운영 중인 지역아동센터 현황 자료로 시설명, 주소, 면적, 정원, 전화번호를 제공하고 있습니다. 면적은 센터가 운영되고 있는 공간의 총 면적을 의미하며  ‘제곱미터’(㎡) 단위로 표시되며, 센터의 크기나 규모를 가늠할 수 있는 지표로 활용됩니다.정원은 해당 센터에서 한 번에 수용할 수 있는 최대 아동 수를 뜻합니다. 예를 들어, ‘정원 29명’과 같이 표기되어, 동시에 관리 가능한 아동의 수를 확인할 수 있습니다.센터 이용을 희망하는 아동과 학부모, 그리고 관련 기관에서 센터를 쉽게 찾고, 연락하거나 시설 규모를 비교할 때 참고 자료로 활용할 수 있습니다.
