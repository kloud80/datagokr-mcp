summary_user: 서울 강남구 안에서 운영 중인 지역아동센터를 센터 한 곳당 한 행으로 정리한 현황 파일입니다. 센터명·주소·면적(㎡)·이용시간·정원·전화번호·데이터기준일을 담으며, 파일 크기는 438바이트 수준의 작은 CSV입니다. 강남구에 사는 학부모가 집 근처 지역아동센터 가운데 정원이 넉넉하고 공간이 넓은 곳을 골라 연락처를 확인할 때 쓰고, 분석가가 센터별 면적 대비 정원을 비교할 때도 씁니다. 전역 조인 키가 없어서 다른 데이터와는 센터명·주소를 맞춰 보거나 같은 강남구 자료끼리 이어 쓰며, 사회복지시설 공통 마스터를 참조할 때 보조 자료로 쓴다.
limits: 코드형 조인 키가 없어 다른 시설 데이터와는 이름·주소 매칭으로만 연결되고, 범위가 강남구 한 곳이라 다른 자치구나 전국 비교에는 쓰지 못한다. 포털 파일 다운로드로 받는 정적 자료이므로 현재 운영 여부는 데이터기준일을 함께 확인해야 한다.
