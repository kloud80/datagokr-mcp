description_portal: 한국청소년상담복지개발원에서 운영하는 청소년상담사 자격 취득과 관련된 연수 기본 정보를 제공하는 데이터입니다. 본 데이터는 2016년~2018년까지 연수년도, 자격취득일, 연수비로 구성되어 있으며, 상담사 자격을 취득한 연도의 기준 정보와 연수에 소요된 비용 현황 등을 확인할 수 있습니다. 자격취득일은 공식적으로 인정된 상담사 자격증 발급일을 의미하며, 연수비는 해당 연도에 부과된 자격 연수 비용으로서 자격 준비를 위한 예산 산정 및 행정적 참고자료로 활용 가능합니다. 본 데이터는 청소년상담사 양성과정의 제도적 흐름과 비용 변동 추이를 파악하는 데 유용하며, 관련 정책 수립과 예산 편성에도 기초자료로 제공될 수 있습니다.
