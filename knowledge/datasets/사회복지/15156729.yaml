description_portal: 본 데이터는 경기도 남양주시에 관리하는 등록 장애인 집계 현황입니다. 장애인복지법에 따라 지자체에 등록된 장애인의 수와 특성을 체계적으로 정리한 통계자료입니다. 데이터 항목으로는 읍면동명, 장애유형, 성별에 따른  등록 장애인 수, 심한 장애인 수, 심하지 않은 장애인 수와 각 읍면동별 소계 및 전체 합계 정보를 포함하고 있습니다. 이 데이터는 복지 정책뿐만 아니라 도시 설계, 산업, 안전 분야까지 폭넓게 쓰일 수 있습니다. 지자체의 핵심업무인 유형별 특화서비스 제공 등 맞춤형 복지 정책에 대한 참고자료로 활용될 수 있습니다.
