summary_user: 부산광역시 남구에 있는 장기요양기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 기관명·기관종류·급여종류(시설급여·재가급여 등)·우편번호·주소·전화·팩스를 담는다. 남구에서 부모님이 이용할 방문요양이나 주간보호, 요양시설을 찾는 가족이 주소와 연락처를 확인하는 데 쓰고, 분석가는 남구 안 장기요양기관의 급여 종류별 분포를 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건강보험 장기요양기관 자료나 사회복지시설 자료와는 기관명·주소로 맞춰 이어야 하며, 지역 통계와는 시군구(남구) 단위로 연결한다.
description_portal: '○ 장기요양보험제도란?고령이나 노인성 질병 등으로 목욕이나 집안일 등 일상생활을 혼자서 수행하기 어려운 이들에게 신체활동·가사지원 등의 서비스를 제공하여 노후생활의 안정과 그 가족의 부담을 덜어주기 위한 사회보험제도○ 신청대상소득수준과 상관없이 노인장기요양보험 가입자와 그 피부양자, 의료급여수급권자로서 65세 이상 노인과 64세 이하 노인성 질병이 있는자○ 급여대상65세 이상 노인 또는 치매, 중풍, 파킨슨병 등 노인성 질병으로 6개월 이상의 기간 동안 혼자서 일상 생활을 수행하기 어렵다고 인정되는 자○ 장기요양인정 및 서비스 이용절차(공단 각 지사별 장기요양센터)신청 →(공단직원) 방문조사→ (등급 판정위원회) 장기요양 인정 및 등급판정→(장기요양센터)장기요양인정서 및 개인별요양이용계획서 통보→(장기요양기관)장기요양급여 계약체결 후 서비스 이용○ 급여내용 - 시설급여: 장기요양기관에 장기간 입소하여 신체활동 지원 등 제공 - 재가급여: 가정을 방문하여 신체활동, 가사활동, 목욕, 간호 등 제공, 주간보호센터 이용, 단기보호이용, 복지용구 구입 또는 대여☞부산광역시 남구 장기요양보호시설현황으로 시설명, 위치, 연락처 등이 있습니다.'
