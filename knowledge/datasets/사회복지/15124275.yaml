description_portal: '공공데이터포털을 통해 2023년 1월에 접수된 공무원연금공단 대차대조표 관련 제공 신청에 따라 개방된 과거년도 재무정보로, 1994년 및 1995년의 기금회계 기준 대차대조표 일부 항목을 샘플 형태로 정리한 데이터입니다.공적연금 재정구조 분석을 위한 학술 연구(예: 공적연금 관련 논문 등)의 참고자료로 요청된 것으로, 신청인은 1995년부터 1999년 사이의 연속 데이터를 요청하였으며, 1994년 및 1995년 2개 연도 데이터를 샘플로 제공하고 있습니다.데이터는 당좌자산 항목 중 현금,당좌예금, 보통예금, 지불준비금, 단기예치금, 외상매출금, 미수금, 미수수익, 미수임대료 등 세부 계정 정보를 포함합니다.'
