summary_user: 경기도 전역의 고용센터와 여성·중장년·노인·대학생·제대군인 등 계층별 일자리지원 기관을 기관 한 곳당 한 행으로 담은 목록으로, 대상 계층 구분(div)·지역·기관명·연락처·홈페이지·도로명/지번 주소·우편번호·위경도를 포함한다. 구직자가 "우리 동네에서 중장년이 갈 수 있는 취업지원기관은 어디인가"를 찾거나, 분석가가 계층별 고용거점기관의 분포와 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명·주소 매칭이나 위경도 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 전역의 취업 관련 지역 거점기관 현황을 정리한 자료로, 고용센터를 비롯하여 여성, 중장년, 노인, 대학생, 제대군인 등 다양한 계층별 일자리지원 기관 정보를 포함하고 있습니다. 각 기관의 위치 정보를 제공하여 공간기반 분석 및 네비게이션 시스템 연동이 가능합니다. ‘구분’ 항목을 통해 대상 계층을 명확히 구분할 수 있어, 수요자 맞춤형 일자리 서비스를 제공하는 데 활용됩니다. 이 데이터는 경기도 고용정책 수립, 계층별 일자리 서비스 제공 현황 분석, 기관 간 네트워크 분석, 지역 고용거점기관의 접근성 분석 등 정책 및 연구 분야에서 폭넓게 활용될 수 있습니다.
