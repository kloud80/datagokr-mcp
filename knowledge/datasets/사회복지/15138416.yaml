summary_user: 치매안심센터와 협약을 맺어 치매 진단·감별검사를 맡는 협약병원의 지정 현황을 병원 단위로 담은 전국 범위 파일로, 병원명·연락처·주소, 협약 지정 시작·종료일, 소속 안심코드, 삭제 여부가 들어 있다(포털 기준일 2024년 9월 27일). 치매 진단검사를 받을 수 있는 협약병원이 우리 지역 어디에 있는지, 협약이 아직 유효한지를 확인하려는 주민·보호자나 지역별 협약병원 분포를 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 병원명·주소 매칭이나 같은 기관의 안심코드(치매안심센터 코드)로만 이을 수 있고, 주소를 시군구로 바꾸면 지역 통계와 연계할 수 있다.
description_portal: '국립중앙의료원 중앙치매센터에서 운영·관리 중인 치매안심통합관리시스템(ANSYS)내에 등록되어 있는 협약병원 및 협약부서 데이터를 제공합니다.* 협약병원: 치매안심센터와 협약을 맺어 치매 진단검사 또는 감별검사를 수행할 수 있는 병원■ 데이터 출처  - 치매안심통합관리시스템■ 데이터 문의  - 중앙치매센터 치매정보시스템운영팀■ 데이터 기준  - 2024년 9월 27일■ 제공 항목- 치매안심센터 협약병원 지정 현황- 협약부서(진료과) 정보* CSV 파일을 엑셀로 실행할 경우 0으로 시작하는 값이 다르게 표시될 수 있습니다.'
