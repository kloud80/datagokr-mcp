description_portal: 인천광역시 빅데이터통합플랫폼의 노인복지시설 읍면동 집계에 대한 정보입니다.인천광역시는 고령화 사회에 대비하여 노인복지시설 관련 정보를 공공데이터로 제공하고 있습니다. 이 데이터는 읍면동별로 집계된 노인복지시설 집계 데이터로 구성항목으로는기준년도, 군구, 읍면동, 노인여가복지시설수, 재가노인복지시설수, 노인일자리지원기관수, 시설대비인구수, 권역외인구수, 권역외인구비율 등으로 구성되어 있습니다.이러한 데이터를 활용하면 다음과 같은 서비스들을 만들 수 있습니다.1. 노인복지시설 검색 및 비교 2. 노인복지 정책 수립 3. 복지사객지대 해소인천빅데이터통합플랫폼의 노인복지시설 데이터는 2022년도 기준으로 2023년 1월 27일에 집계된 데이터를 보여주고 있습니다.더 자세한 노인복지시설 정보는 인천광역시 정보공개포털에서 확인할 수 있습니다.
