summary_user: 대전광역시 내 가정폭력·성폭력·성매매 피해자 상담소를 한 곳당 한 행으로 담은 목록으로, 상담소 명칭·소재지·평일 운영시간·전화번호를 기관 단위로 제공한다(CSV 약 1.2KB 규모). 피해자나 지원 실무자가 '대전에서 가까운 폭력 피해 상담소가 어디이고 평일 몇 시에 연락할 수 있는가'를 확인하거나, 분석가가 시내 상담 인프라 분포를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 사회복지시설 목록과는 상담소 명칭이나 주소 문자열을 맞춰 연결해야 한다.
description_portal: 대전광역시 가정 폭력, 성폭력, 성매매 피해자 상담소 현황은 각 상담소의 공식 명칭, 소재지, 종사자 현황 등 주요 구성 정보를 제공합니다. 이 자료는 행정 구역 별 상담소 분포와 실질적 접근성을 파악할 수 있게 하며, 각 상담소가 운영하는 상담 지원과 통합 서비스, 전문 인력 배치 현황 등도 구체적으로 확인할 수 있습니다. 피해자가 신속하게 상담 및 지원에 접근할 수 있도록 위치 정보, 연락처 등 항목이 세밀하게 체계화 되어 있어 실무적 활용도가 높습니다. 해당 자료는 상담 인프라의 현황 점검, 상담 서비스 자원 배분, 지역 내 피해자 보호 네트워크 강화를 위한 정책 수립, 기관 간 연계 방안 마련 등 다양한 분야에서 활용될 수 있습니다.
