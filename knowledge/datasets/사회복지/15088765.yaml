description_portal: 대구광역시 서구의 동별 기초수급자 현황을 나타낸 데이터 입니다. 동별 수급권자수와 가구수 등의 자료를 포함하고 있습니다.본 데이터는 대구광역시 서구 관내 법정동 및 행정동 단위로 분류된 기초생활보장 수급 가구 및 수급권자 수를 수록한 현황 자료이다. 가구 수 대비 수급 인원을 구체적으로 확인할 수 있어 지역별 복지 수요 파악에 활용 가능하다. 법정동과 행정동 정보를 함께 제공하여 행정구역별 정확한 비교 및 분석이 가능하며, 수급자 수에 따른 복지정책 수립, 복지 사각지대 해소, 연구자료 등으로 활용될 수 있다. 통계 기준은 정량적 수치로 구성되어 있으며, 지역 복지 서비스 계획 수립에 필요한 기초자료로 기능한다.
