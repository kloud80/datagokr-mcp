description_portal: '○ 통계개요* 통계명 : 장애인 편의시설* 통계종류 : 서울시 장애인 편의시설 현황을 자치구별로 제공하는 일반ㆍ조사통계* 근거법령 :「장애인ㆍ노인ㆍ임산부 등의 편의증진보장에 관한 법률(편의증진법)」제11조* 작성목적 : 장애인 편의시설 실태에 대한 전반적인 현황을 파악하여 장애인 관련 정책수립을 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 장애인자립지원과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 장애인 편의시설(매개시설, 내부시설 등) 설치대상 및 설치 현황○ 용어설명* 장애인 편의시설- 매개시설 : 주출입구 등 장애인등의 통행이 가능한 접근로, 장애인전용 주차구역,주출입구 높이차이 제거- 내부시설 : 출입구(문), 복도, 계단 또는 승강기- 위생시설 : 화장실, 욕실, 샤워실, 탈의실- 안내시설 : 점자블록, 유도및 안내설비, 경보 및 피난설비- 기타시설 : 객실ㆍ침실, 관람석ㆍ열람석, 매표소ㆍ판매기ㆍ음료* 대상 : 법적으로 해당 편의시설을 설치해야 하는 시설 수'
