summary_user: 경기도 등록장애인을 연도(STD_YY)·시군 단위로 집계한 데이터로, 시군별 전체 인원과 1급~6급 장애등급별 인원, 중증·경증 합계를 각각 남녀로 나눠 담는다. 복지 담당자나 분석가가 '우리 시군의 중증장애인 비율과 성별 분포가 다른 시군보다 높은가'를 비교해 활동보조 인력이나 재활시설 배분 근거를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 시군구 단위 데이터와는 시군코드(SIGUN_CD)나 시군명을 이름·코드 매핑해 잇는다.
description_portal: 이 데이터는 경기도 등록장애인을 시군별·성별·장애등급별로 구분해 집계한 현황입니다. 보건복지부와 경기도청 장애인복지과에서 제공하며, 매년 12월 말 기준으로 산출됩니다.제공되는 데이터는 시군명, 성별 합계, 1급~6급 장애인 인원(남성·여성 구분)이며, 추가로 중증·경증 장애인 구분 합계도 포함됩니다. 예를 들어, 수원시에서 1급 장애인이 총 2,000명일 때, 남성 1,200명·여성 800명으로 세부 집계가 가능합니다.장애등급은 1급~6급으로 구분되며, 숫자가 낮을수록 중증 장애를 의미합니다. 따라서 이 데이터는 지역별 중증·경증 장애인 분포, 성별 차이를 동시에 확인할 수 있습니다.이 정보는 정책적으로 시군별 복지 자원 배분이나 중증장애인 집중 지원 지역 설정에 활용될 수 있습니다. 예를 들어, 중증장애인 비율이 높은 지역은 활동보조 인력, 의료·재활시설 확충이 필요하다는 정책적 시사점을 제공합니다. 또한 성별 분석을 통해 여성장애인 돌봄, 남성장애인 직업재활 같은 맞춤형 복지정책 수립에도 기여할 수 있습니다.
