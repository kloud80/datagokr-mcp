summary_user: 경상남도 도내 성폭력피해상담소 현황을 상담소 1곳당 1행으로 담은 파일로, 명칭·도로명/지번 주소·우편번호·대표자·설립연월·종사자 수·면적(제곱미터)·연락처가 들어 있으며 포털 설명상 2026년 1월 31일 기준입니다. 성폭력 피해자나 지원기관이 경남의 시군에서 가까운 상담소와 연락처를 찾을 때, 분석가가 시군별 상담소 배치와 종사자 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소(시군 단위로 잘라 행정구역과 맞춤)나 상담소 명칭으로 연결하고, 사회복지시설 공통 목록과 명칭·주소로 대조해 쓴다.
description_portal: 성폭력방지 및 피해자보호 등에 관한 법률 제10조(상담소의 설치.운영)에 따라 설치된 경남 도내 성폭력피해상담소 현황(2026년)을 상담소 명칭, 소재지, 우편번호, 대표자, 설립연월, 종사자 수, 규모, 연락처 등의 항목으로 정보를 제공합니다.<관련 법령>성폭력방지 및 피해자보호 등에 관한 법률 제10조(상담소의 설치.운영) ① 국가 또는 지방자치단체는 성폭력피해상담소(이하 “상담소”라 한다)를 설치ㆍ운영할 수 있다.② 국가 또는 지방자치단체 외의 자가 상담소를 설치ㆍ운영하려면 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)에게 신고하여야 한다. 신고한 사항 중 성평등가족부령으로 정하는 중요 사항을 변경하려는 경우에도 또한 같다.* 해당 데이터는 2026년 1월 31일 기준으로 작성되었습니다.
