summary_user: 아이돌봄 서비스 신청 건수를 기준연월·아이돌봄기관별로 집계해 총 신청건수와 0시부터 24시까지 2시간 단위 시간대별 신청건수를 담으며, 전염성 질병 아동 여부와 돌봄 구분도 함께 담는다(범위 전국). 돌봄기관 운영자나 정책 분석가가 "우리 지역 기관에는 어느 시간대에 돌봄 신청이 몰리는가, 인력 배치나 운영 시간을 어떻게 조정할까"를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 기관명이나 같은 기관(한국건강가정진흥원)의 기관번호·상위기관번호(upChildCareInstNo)로만 이어 쓴다.
description_portal: 아이돌봄 시간대별 월별신청현황 정보 서비스를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 기준연월, 아이돌봄기관명, 전염성 질병 아동여부, 돌봄 구분명, 총 신청건수, 0시부터 24시까지를 두시간단위로 나눈 시간대별 신청건수 등의 정보를 확인할 수 있습니다.  시간대별 신청현황 정보는 서비스가 가장 많이 이용되는 시간대를 도출하는 데 유리한 자료입니다. 2시간 단위로 세분화된 신청 건수를 통해 돌봄 수요의 시간적 집중도와 분산 패턴을 분석할 수 있습니다. 이 데이터를 통해 시간대별 인력 재배치나 운영 시간 조정 등에 있어 효율적인 방안 수립이 가능하며, 운영 시간 최적화와 인력 배분 전략 마련에 활용될 수 있습니다.
