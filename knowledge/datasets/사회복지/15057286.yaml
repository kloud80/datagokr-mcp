summary_user: 경기도 내에 설치된 여성안심 무인택배함을 택배함 한 곳당 한 행으로 담은 현황 데이터로, 시군명·명칭·설치일자·관리부서 전화번호·도로명/지번 주소·위경도(WGS84)·월별 이용건수·입지선정 내용을 포함한다. 혼자 사는 주민이 우리 동네 가까운 안심택배함 위치를 찾거나, 분석가가 시군별 설치 분포와 이용건수를 1인가구 밀집지역과 비교해 추가 설치 후보지를 검토하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 시군명·시군코드(SIGUN_CD)로 경기도 내 다른 시군 단위 데이터와 맞추거나 위경도로 공간 결합해 쓴다.
description_portal: 경기도 내에 설치된 여성 안심 무인택배함 현황입니다. 택배함의 명칭, 소재지위치(도로명 주소, 지번 주소), 입지선정 기준 등의 정보를 제공합니다.이 데이터는 경기도 내 여성안심 무인택배함 설치 현황을 정리한 자료로, 여성 및 1인가구의 안전한 택배 수령 환경 조성을 목적으로 하는 공공 보관함의 정보를 포함합니다. 주요 항목에는 시군명, 택배함 명칭, 설치일자, 관리부서 전화번호, 도로명 및 지번주소, 위도·경도 좌표(WGS84), 월별 이용건수, 입지선정 평가항목 등이 포함되어 있으며, ‘1인 가구 수’, ‘밀집도’, ‘범죄율’ 등을 기준으로 설치 위치가 선정된 경우도 있습니다. 본 데이터는 범죄 예방 정책 수립, 여성 안전 인프라 구축, 택배 인프라 분석, 도시 취약지역 보완 전략 등에 활용될 수 있으며, 특히 1인가구가 밀집한 주거지역의 안전 강화를 위한 자료로 유용합니다. 데이터는 여성가족부 및 지자체 안전정책 부서에서 수집한 공공 데이터입니다.
