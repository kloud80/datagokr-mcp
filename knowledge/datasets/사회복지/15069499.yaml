summary_user: 대구광역시에 있는 노인요양원·노인공동생활가정을 시설 한 곳당 한 행으로 담은 파일로, 구군명·시설명·입소 정원·소재지 주소·전화번호(팩스)를 담는다. 가족의 요양시설 입소를 알아보는 시민이 우리 구군에 어떤 요양시설이 있고 정원이 몇 명인지 확인하거나, 분석가가 구군별 요양시설 수와 정원 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 정보나 사회복지시설 자료와는 시설명·주소를 맞춰 잇고, 구군 통계와는 구군명으로 연결한다.
description_portal: 노인복지법 제34조(노인의료복지시설)호에 의거 설치된 대구시 소재 노인요양시설의 정보를 제공하는 데이터입니다.노인요양원, 노인공동생활가정의 시설명, 입소 가능한 정원수, 소재지, 연락처, 소관부서 구군등의 내용으로 구분되어 있습니다.제공되는 데이터는 시설의 지도 감독의 권한이 있는 소재지 구군청과 건강보험관리공단의 자료를 기반으로 구성됩니다. 시설에 대한 평가등급 및 현원등 의 정보는 건강보험관리공단의 노인장기요양에서 짧은 주기로 좀 더 상세히 제공하고 있습니다.
