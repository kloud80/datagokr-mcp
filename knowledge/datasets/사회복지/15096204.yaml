summary_user: 경기도가 추진하는 지역사회서비스 투자 사업을 사업·서비스 단위로 정리한 목록으로, 사업명, 이용인원, 이용대상, 서비스명, 서비스내용을 담는다. 복지 담당자나 분석가가 심리·정서 지원, 신체활동, 장애인 보조기기 렌탈 같은 바우처 서비스별로 이용 규모와 대상 연령·소득기준을 비교해 수요가 많은 사업을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·서비스명 같은 이름 매핑으로만 이어 쓸 수 있고, 사회적경제 부문에서 쓰이는 인증번호·사업자번호 같은 기업 축 키도 이 필드에는 없다.
description_portal: 지역 및 가구별로 다양한 특성과 수요에 부합하는 차별적인 서비스를 지자체가 주도적으로 발굴, 집행 함으로써 지역주민이 체감하고 만족하는 사회서비스 제공하기 위한 사업 목록입니다. 사회서비스 주요자에 대해 바우처를 지원, 원하는 서비스 제공 기관을 선택함으로써 공급자 주도 방식에서 탈피하여 새로운 접근으로 사회서비스 시장 창출하고 있습니다.이 자료를 통해 서비스의 이용 규모와 지원 대상, 제공 내용 등을 확인할 수 있습니다. 주요 항목은 사업명, 이용인원, 이용대상, 서비스가격, 서비스내용으로 구성되어 있으며, 심리·정서 지원, 신체활동, 예술 멘토링, 정신건강 관리, 장애인 보조기기 렌탈 등 다양한 맞춤형 복지서비스가 포함되어 있습니다. 서비스는 연령별, 소득기준별로 이용 자격이 달라지며, 각 항목별 이용 규모를 통해 정책 우선순위 및 수요 구조 분석이 가능합니다. 이 자료는 복지 수요 예측, 예산 분배, 정책 성과평가, 사회서비스 공급계획 수립 등에 유용하게 활용됩니다.
