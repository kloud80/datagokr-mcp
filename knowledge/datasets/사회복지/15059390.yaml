summary_user: 경기도 내 노인복지주택을 시설 한 곳당 한 행으로 담으며, 시군·시설명·주소와 좌표, 입소정원과 현원(성별·기초수급자), 전용면적 구간별 세대수, 분양·임대·혼합 형태별 세대수와 입주 세대수, 정규직·비정규직 종사자 수, 설치·운영 주체와 영리 구분이 들어 있다. 노인복지 담당자나 분석가가 '우리 시군의 노인복지주택은 몇 곳이고 정원 대비 입소율과 임대형 세대 비중은 어떤가'를 비교할 때 쓴다. 전역 조인 키는 없어서 시군코드·시군명(SIGUN_CD)이나 주소·좌표, 시설명·법인명 매칭으로 다른 시군 통계나 시설 데이터와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 노인을 위한 주거복지시설(복지주택)의 상세 현황을 다룹니다. 복지주택은 고령층의 편안한 노후를 위한 전용 주거공간으로, 이 데이터는 각 시설의 주소, 전화번호, FAX, 입소정원 및 현원, 분양/임대 형태, 세대별 면적 정보, 종사자 인원, 설치 및 운영 주체 등 매우 구체적인 내용을 포함합니다. 특히 ‘60㎡ 이하~148㎡ 초과’까지의 전용면적, 분양형태별 입주현황, 정규직·비정규직 등 종사자 구성 등도 명시되어 있어, 시설 유형별 수용 능력이나 운영 여건 비교·분석에 적합합니다. 또한 영리/비영리 운영 구분, 법인명 정보도 포함되어 복지정책 수립이나 민간 협력 방안 마련 시 유용합니다. 데이터는 연 1회 갱신되며, 경기도 노인복지과에서 관리합니다.
