summary_user: 공무원연금 수급이 끝난 사람 수를 연령대(38세 미만~85세 이상)별로 나눠, 퇴직·유족·장해연금 종류마다 사망·청산·유족승계·재임용 후 합산신청·배우자 재혼·직계비속 19세 도달 등 종결 사유별로 집계한 전국 단위 표다(CSV 약 2.7KB). 연금 분석가나 정책 담당자가 '퇴직연금 수급이 주로 몇 세에 어떤 사유로 끝나는가', '유족연금이 재혼이나 자녀 성년 도달로 끝나는 비중은 얼마인가' 같은 질문에 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어서, 공무원연금공단의 다른 수급자 통계와는 연령 구간(구분)이나 연금 종류 이름을 맞춰 나란히 놓고 비교하는 식으로만 이어 쓴다.
description_portal: '공무원연금공단에서 관리하는 연금수급종결 사유별(사망,청산,유족승계,합산신청,퇴직처분취소 등) 연령별(38세미만~85세이상) 연금수급종결자 현황 데이터입니다.1. 청산 : 이민 또는 국적상실시 본인의 원에 의한 청산(4년분 연금액의 상당금액을 일시 지급) 및 유족이 아닌 직계비속 또는 기관장에게 지급되는 특례급여2. 퇴직처분취소 : 파면, 해임, 직권면직, 의원면직 등 퇴직처분 취소3. 기타 - 퇴직연금수급자 : 퇴직연금→일시금 전환, 퇴직자 행방불명 등 - 유족연금수급자 : 친족관계 종료, 직계비속 폐질상태 해소, 행불자 생존확인 등 - 장해연금수급자 : 장해연금→장해보상금 전환, 퇴직처분 취소 등'
