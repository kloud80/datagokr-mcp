description_portal: '○ 통계개요* 통계명 : 노인학대 신고접수율* 통계종류 : 일반통계* 통계목적 : 노인보호전문기관에 신고 접수된 노인학대현황을 파악하여 각종정책수립을 위한 기초자료 제공* 조사체계 : 전국 지방노인보호전문기관→중앙노인보호전문기관→보건복지부* 작성주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 노인학대 신고접수건수 등○ 용어설명* 노인학대 : 노인에 대하여 신체적, 정신적, 정서적, 성적폭력 및 경제적 착취 또는가혹 행위를 하거나 유기 또는 방임을 하는 것을 말함(노인복지법 제1조의2제4호)* 신고접수 : 노인보호전문기관으로 신고 접수된 모든 사례를 말함* 학대사례 : 신고접수 시 노인학대가 의심되어 현장조사를 실시한 후 사례판정 결과학대사례(응급, 비응급, 잠재적 사례)로 판정된 사례를 의미함** 응급사례 : 노인학대가 현재 발생하고 있거나, 학대로 인해 즉각적인 의료조치가필요한 경우에 해당됨. 또한 학대행위자로부터 즉시 격리가 요구되며, 노인의생명 혹은 안전이 매우 위험하다고 판단되는 경우 등을 말함** 비응급사례 : 노인학대가 발생하였으나, 학대피해노인의 안전이 확보되어 응급이아닌 경우, 노인의 신체적, 정신적, 경제적, 피해가 경미한 경우에 해당됨** 잠재적 사례 : 학대가 발생하고 있지 않으나 노인부양, 노인과 가족 간의 의사소통 기술부족이나 갈등 등 학대위험요인이 있다고 판단되는 경우에 해당됨* 일반사례 : 신고접수 된 사례 중 단순 정보제공이나 기관 안내 등의 문의로 학대의심사례로보기 어려운 사례와 신고접수 시 노인학대가 의심되었으나, 사실관계 확인 및현장조사 등을 통하여 노인학대 및 학대위험요인이 드러나지 않는 경우에 해당됨'
