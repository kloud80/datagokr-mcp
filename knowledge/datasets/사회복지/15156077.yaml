summary_user: 아이돌봄 현장 안전점검에 쓰는 점검영역·점검사항·점검내용과 항목별 우수·미흡 평가기준(점수와 기준 내용), 평가 제외 조건을 기준연도별 레코드로 담은 전국 단위 비공간 데이터다. 아이돌봄 기관 담당자나 정책 분석가가 '아이돌봄 현장 안전은 어떤 영역과 기준으로 점검·평가되는가'를 확인하거나 자체 점검표를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 점검영역명 같은 이름 매핑이나 같은 기관(한국건강가정진흥원)의 다른 아이돌봄 데이터와 연도(crtrYr) 기준으로만 느슨하게 이어 쓴다.
description_portal: 아이돌봄 현장 안전사례 관리 정보 데이터는 공공데이터법 제24조에 따라 추진되는 제4차 국가중점데이터 개방계획에 포함된 아이돌봄 지원사업 관련 데이터입니다. 이 데이터는 국가적 파급효과와 활용가치가 높은 고수요 데이터를 국가중점데이터로 개방한다는 취지에 따라 선정되었으며, 표준화 절차와 품질 점검을 거쳐 신뢰성을 확보한 후 오픈API 방식으로 제공됩니다. 이를 통해 이용자는 아이돌봄 서비스 현황 분석, 민간 서비스 연계 검토 등 다양한 정책·연구·서비스 기획 목적에 활용할 수 있으며, 다른 공공데이터와 결합하여 공공 및 민간 분야 전반에서 활용 범위를 넓힐 수 있습니다.
