description_portal: '○ 통계개요* 통계명 : 여성가구주 현황(구별)* 통계종류 : 서울시 가구 중 여성가구주 현황을 구별로 제공하는 지정ㆍ조사통계* 근거법령 :「인구주택총조사 규칙」(기획재정부령 제173호)* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책 입안의기초자료 제공하고, 각종 가구관련 경상조사 표본틀 (Sampling Frame)의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 전수: 공공기관 및 사법기관 → 통계청표본: 조사원 → 구·시·군 → 시·도 → 통계청* 공표주기 : 정기* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 일반가구수, 여성가구수 가구, 여성가구주 가구 비율 등○ 용어설명* 일반가구 : 가족으로 이루어진 가구, 가족과 5인 이하의 남남이 함께 사는 가구, 1인가구,가족이 아닌 남남끼리 사는 5인 이하의 가구** 가구: 1인 또는 2인 이상이 모여서 취사, 취침 등 생계를 같이하는 생활단위* 여성가구주 : 일반가구 중 가구주가 여성인 가구여성가구주 가구 비율 = (여성가구주 가구/일반가구수)*100○ 기 타* 일반가구를 대상으로 집계. 단, 집단가구(6인이상 비혈연가구, 기숙사, 사회시설 등) 및 외국인 가구 제외* 2015년 이후부터는 행정자료를 이용한 전수조사 (2010년 이전은 전통적 현장조사방식의 집계결과)'
