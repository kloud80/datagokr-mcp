summary_user: 대전광역시 중구에 있는 경로당을 한 곳당 한 행으로 담은 파일로, 행정동·경로당명·소재지 주소·전화번호와 전체·남·여 회원수를 담는다. 중구 주민이나 가족이 가까운 경로당과 연락처를 찾을 때, 또는 분석가가 "중구 어느 행정동에 경로당이 몰려 있고 회원 성비는 어떤가"를 따질 때 쓴다. 전역 조인 키는 없어 다른 노인복지시설·장기요양기관 데이터나 지역 통계와는 행정동 이름이나 소재지 주소를 맞춰 잇는다.
limits: 사회복지시설 시설코드 같은 공통 코드가 실측 컬럼에 없어 다른 데이터와 자동으로 정확히 결합하기 어렵다. 범위가 대전 중구 한 곳이라 다른 구나 대전 전체 현황은 이 파일만으로 볼 수 없다.
