summary_user: 전국 17개 시도별로 육아종합지원센터가 중앙센터·시도센터·시군구센터 유형별로 몇 곳 설치돼 있는지를 센터 수로 정리한 집계 표로, 개별 센터 주소나 연락처가 아닌 시도 단위 설치 규모만 담은 작은 파일(약 333바이트)이다. 보육 정책 담당자나 분석가가 "우리 시도에는 시군구 육아종합지원센터가 몇 곳 있고 다른 시도와 비교하면 어느 정도인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어, 다른 보육 통계와는 시도명(구분)을 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 교육부와 지방자치단체가 설치·운영하는 전국 육아종합지원센터의 설치 현황을 정리한 통계 자료입니다. 부산, 대구, 인천, 광주, 대전, 울산, 세종, 경기도 등 전국 17개 시도를 대상으로 중앙센터, 시도센터, 시군구센터의 설치 수가 INT 형식으로 제공됩니다. 각 항목은 지역 단위로 구성되어 있으며, 센터 유형별로 구분된 열 구조를 통해 행정구역별 설치 규모를 직관적으로 확인할 수 있는 형태로 되어 있습니다. 데이터는 정량적 비교와 분포 파악이 용이한 집계형 표 형식으로 제공되며, 육아종합지원센터의 행정적 운영 구조를 단순화하여 전달하는 데 초점을 맞추고 있습니다. 주요 컬럼은 시도명, 중앙센터 수, 시도센터 수, 시군구센터 수로 구성됩니다.
