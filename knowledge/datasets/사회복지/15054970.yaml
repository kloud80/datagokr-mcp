description_portal: '이 데이터는 산업재해보상보험의 주요 보험급여 지급 현황을 사업장 규모별(상시근로자수 기준)로 상세하게 집계한 통계 자료입니다. 요양급여, 휴업급여, 상병보상연금, 장해급여, 유족급여, 장의비, 간병급여, 재활급여 등 산재보험의 거의 모든 급여 항목에 대해 수급자 수(명), 지급 건수(건), 지급 총액(원)을 제공합니다. 이 자료는 기업 규모에 따라 재해 발생 시 근로자에게 지급되는 보상의 규모와 패턴이 어떻게 달라지는지를 명확하게 보여주며, 특히 영세 사업장 근로자의 재해 보상 실태를 심층적으로 분석하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 산재보험 제도의 형평성과 효율성을 평가하고 개선하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 영세 사업장(예: 5인 미만)과 대규모 사업장(예: 1000인 이상) 간의 급여 항목별 지급액 차이를 비교 분석할 수 있습니다. 이를 통해 영세 사업장의 산재 근로자들이 법적으로 보장된 적정 수준의 급여를 받고 있는지 진단하고, 재해 보상 사각지대를 해소하기 위한 제도적 개선 방안을 모색할 수 있습니다. 또한, 사업 규모별로 재활급여 수급 현황 등을 분석하여 중소기업 근로자에 대한 직업 재활 지원을 강화하는 정책을 수립하는 데 기여할 수 있다고 판단됩니다.'
