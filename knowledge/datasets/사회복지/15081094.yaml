description_portal: 『젠더브리프(Gender Brief)』는 광주여성가족재단이 「양성평등기본법」과 「광주광역시 성평등 기본조례」 등 법·제도적 근거에 기반하여 정기적으로 발간하는 정책 자료입니다. 이 브리프는 지역 내 성평등 실현을 위한 기초자료를 제공하고, 다양한 젠더 이슈에 대한 정책적 대응을 뒷받침하는 역할을 수행하고 있습니다.특히 『젠더브리프』는 성별 격차, 돌봄 공백, 청년 여성의 고용 불균형, 스토킹 및 젠더 기반 폭력 등 최근 사회적으로 주목받는 현안들을 중심으로 구성되며, 각 주제에 대해 실태 조사, 통계 분석, 전문가 인터뷰 등을 통해 데이터 기반의 분석과 정책 제안을 담고 있는 것이 특징입니다. 이를 통해 시민의 삶과 밀접하게 연결된 성평등 현안을 공공의 영역에서 체계적으로 다루고자 합니다.최근에는 1인 가구의 증가와 고립사회, 비혼 출산과 같은 가족구조의 변화, 무급 가사노동의 가시화, 젠더갈등 심화 등 **‘신사회위험(new social risks)’**으로 분류되는 이슈들이 부각되고 있습니다. 『젠더브리프』는 이러한 사회적 변화에 **젠더 관점(gender perspective)**을 접목하여, 제도 밖에 놓인 사각지대를 드러내고, 정책적 대응 방향을 구체화하는 데 기여하고 있습니다.다시 말해, 『젠더브리프』는 단순한 연구보고서를 넘어, 현장의 목소리와 데이터를 연결하고, 지역사회 내 성평등 담론을 확산시키는 실천적 자료로서 기능하며, 지방정부와 시민사회, 전문가 집단이 활용할 수 있는 중요한 정책자료로 자리매김하고 있습니다.
