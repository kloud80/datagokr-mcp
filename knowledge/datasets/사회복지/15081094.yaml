legal_basis_portal: 광주여성가족재단의 『젠더브리프(Gender Brief)』는 주요 성평등 이슈에 대한 조사와 분석을 바탕으로 지역 정책 개선 방향을 제시하는 목적을 가지고 있으며, 그 주제 선정과 자료 보유는 다음과 같은 제도적·정책적 근거에 기반합니다.『젠더브리프』 발간 주제 및 자료 보유의 근거- 양성평등기본법제18조(성별영향평가 등)중앙행정기관과 지방자치단체는 정책 수립 시 성별에 따른 영향 분석을 실시하고, 그 결과를 정책에 반영해야 함.👉 젠더브리프는 광주지역 정책 및 현안에 대한 성별영향분석평가 기반의 통계 및 분석자료 축적에 해당됨.
