description_portal: '한국사회보장정보원에서 1년 주기로 제공하는 통계자료로, 특성(성별, 연령대)별, 시도별, 월별로 차상위 및 한부모가족 수급자 수를 중복 허용을 포함하여 유형별로 제시하고 있습니다.   데이터 구성은 성별별, 연령대별, 시도별, 월별로 수급자 자격마다(차상위 본인부담경감대상자, 차상위 자활, 차상위 장애아동수당, 차상위 장애수당, 차상위 장애인 연금, 차상위 계층확인, 한부모가족) 중복을 허용한 경우와 허용하지 않은 경우의 차상위 및 한부모가족 수급자 수 항목으로 구성되어 있습니다.  o 사회보장정보시스템(행복e음)에 등록된 복지대상자 중 차상위 및 한부모가족 수급자를 연말 기준으로 보유한 수급자를 중복제거*  또는 중복허용**해 자격별로 집계, * 중복허용 기준 : 기준년월별로 다수에 자격을 보유한 수급자의 경우 각 자격별로 집계, ** 중복제거 기준 : 기준년월별로 다수에 자격을 보유한 수급자의 경우 우선순위가 가장 높은 자격에 한명으로 집계, ※ 우선순위 기준 : 좌측에 차상위본인부담경감대상자 자격이 우선순위가 가장 높고 우측에 한부모가족 자격이 우선순위가 가장 낮음   차상위 및 한부모가족 수급자 유형별 성별 및 연령대 분포를 확인하거나 차상위 및 한부모가족 수급자 유형별 수급자수를 공시적으로 비교분석할 때 활용하실 수 있습니다. 또한 중복자수가 얼마나 되는지 확인하고자 할 때 활용하실 수 있습니다.'
