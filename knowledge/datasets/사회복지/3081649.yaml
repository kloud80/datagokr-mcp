description_portal: 한국건강가정진흥원이 제공하는 가족친화경영 컨설팅을 받은 기업들의 연도별 현황을 제공하며, 직장교육.자체점검 제공 항목은 번호, 컨설팅유형, 기업명, 기업분류, 인증년도 등이며, 총 610개의 기업 정보를 포함합니다. 컨설팅의 주요 유형은 인증준비컨설팅, 인증 취즉후 문화 정책이 필요한 기업에 대한 문화컨설팅, ESG 경영을 추진하는 기업의 가족친화형 ESG 컨설팅, 임직원 및 HR 담당자 대상 가족친화 제도 이해교육 및 온라인 자체 점검 시스템에 대한 내용을 컨설팅을 제공합니다.  이 데이터는 가족친화경영 컨설팅의 확산 현황을 파악하고, 관련 정책 수립 및 연구에 활용될 수 있습니다.
