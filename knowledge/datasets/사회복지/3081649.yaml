summary_user: 한국건강가정진흥원의 가족친화경영 컨설팅을 받은 기업·기관을 한 행에 한 건씩, 컨설팅 구분·기업(관)명·기업형태·연도로 담은 전국 단위 파일이다(포털 설명상 610개 기업). 가족친화인증을 준비하는 기업 담당자나 정책 분석가가 "어떤 유형의 컨설팅을 어떤 형태의 기업이 연도별로 얼마나 받았나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기업명 문자열 매칭이나 같은 기관의 가족친화인증 관련 자료와 이름 기준으로만 이어 쓴다.
