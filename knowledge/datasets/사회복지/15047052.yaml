description_portal: '○ 통계개요* 통계명 : 장애인 현황(장애유형별/동별)* 통계종류 : 서울시 장애인 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「장애인복지법」및 동법 시행규칙에 의거 자치구에 등록된 장애인 현황* 작성목적 : 장애인의 전반적인 현황을 파악하여 장애인 관련 정책 수립을 위한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 장애인자립지원과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구, 행정동내용 - 서울시 등록장애인의 장애유형별(지체, 뇌병변, 시각, 청각 등),구ㆍ동별 현황○ 용어설명* 장애유형의 분류- 뇌병변 : 뇌성마비, 외상성 뇌손상, 뇌졸중 등 뇌의 기질적 병변에 기인한신체적 장애로 보행 또는 일상생활의 동작 등에 상당한 제한을 받는 사람- 안면 : 안면부위의 변형 또는 기형으로 인하여 사회생활을 하는 데 상당한제한을 받는 사람- 장루ㆍ요루 : 배변기능 또는 배뇨기능의 장애로 인하여 장루(腸瘻) 또는요루(尿瘻)를 시술하여 일상생활을 하는데 있어 상당한 제한을 받는 사람○ 기 타○ 출 처 : 서울특별시 장애인자립지원과'
