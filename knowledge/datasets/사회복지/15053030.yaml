summary_user: 공무원연금 가입자 수를 17개 광역자치단체별·남녀별로 나누고, 정무직·일반직·경찰·소방·교육직·군무원 등 15개 직종별 인원과 합계를 담은 집계 통계 파일(CSV)입니다. 지역 인사·복지 분석가가 "우리 시도에는 어떤 직종 공무원이 많고, 직종별 성비는 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 시도명(구분)을 이름으로 매핑해 같은 공단의 지역별 수급자 통계나 다른 시도 단위 통계와 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 연금가입자의 현황을 지역별 및 직종별로 세분화하여 제공하는 통계로, 전국 17개 광역자치단체 기준으로 각 지역에 소속된 공무원 수를 직종별로 분류한 정보를 담고 있습니다.지역별 가입자 수는 남성과 여성으로 구분되어 있으며, 직종 구분에는 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(청원경찰, 전문경력관 등 특수직 포함) 등이 포함되어 있습니다.각 직종별 가입자 수는 지역별로 제공되며, 총 가입자 수(계), 직종별 인원, 성별 분포 등을 바탕으로 특정 지역 내 직종 편중 현황이나 직군별 성비 등을 파악할 수 있습니다.
