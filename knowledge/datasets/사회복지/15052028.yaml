summary_user: 경상북도 내 노인주거복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시군·시설종류·시설명·소재지·연락처와 정원·현원을 포함한다. 보호자나 어르신이 거주 시군의 양로시설 등 노인주거시설을 찾고 정원 대비 현원으로 입소 여유를 가늠할 때, 분석가가 시군별 노인주거시설 공급 현황을 비교할 때 쓴다. 전역 조인 키가 없어 시군 이름이나 시설명·주소 매칭으로만 다른 데이터와 잇고, 시군 단위로 지역 통계와 연계해 쓴다.
limits: 표준 코드(행정구역 코드·시설 코드)가 없어 다른 데이터와 붙이려면 시군명·주소 문자열을 직접 맞춰야 한다. 범위는 경상북도에 한정되며 파일이 작은 CSV(약 2KB)라 시설 수가 많지 않다.
