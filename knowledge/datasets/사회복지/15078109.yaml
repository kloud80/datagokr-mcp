status: active
summary_user: 아이돌봄 서비스의 월별 신청 건수를 기준연월·아이돌봄기관별로 묶어 0세부터 12세까지 나이별로 담은 집계 데이터이며, 범위는 전국이고 지도 좌표는 없다. 지자체·정책 분석가가 "우리 지역 기관에서 어느 나이대 아동의 돌봄 신청이 몰리거나 비어 있는가" 같은 연령별 수요 편차를 살피는 데 쓴다. 기관 번호(childCareInstNo)와 상위 기관 번호·명칭이 있으나 다른 데이터와 공통으로 쓰는 전역 조인 키는 확인되지 않아, 같은 기관의 다른 아이돌봄 현황 데이터와 기관 번호·기관명으로 맞춰 잇는다.
limits: 전역 조인 키가 없어 외부 시설·행정 데이터와는 기관명 등 이름 매핑으로만 연결되므로 매칭 오류에 주의한다. 집계된 신청 건수라 개별 아동·가구 단위 분석이나 위치 기반 분석은 할 수 없다. 개발계정은 하루 5,000회 호출로 제한된다.
