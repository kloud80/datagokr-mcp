summary_user: 아이돌봄서비스 신청자의 대기 순번을 정할 때 적용하는 가점 기준을 기준연도별로 기준 구분명, 기준 내용, 가점 점수 단위로 담은 전국 범위의 기준표 API이다. 아이돌봄서비스를 신청하려는 부모가 '우리 가구는 어떤 항목에서 몇 점의 가점을 받아 대기 순위가 앞당겨지나'를 확인하거나, 분석가가 연도별 가점 배분 변화를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도(crtrYr)나 기준 구분명을 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 아이돌봄 대기가점기준 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연도, 대기가점기준구분명, 대기가점기준내용, 가점점수 등의 내용을 확인할 수 있습니다.대기가점기준 정보는 서비스 신청자 간 우선순위를 결정하는 요소들을 명확히 이해하는 데 도움을 줍니다. 기준연도별로 점수 배분과 기준 내용을 확인함으로써, 가점 제도의 구조적 정당성과 실효성을 분석할 수 있습니다. 이 데이터를 활용하면, 신청자 유형별 불이익 여부를 사전에 진단하고 제도 개선에 필요한 근거를 마련할 수 있습니다.  정책 평가 및 서비스 접근성 향상을 위한 기준 체계 분석 자료로 활용될 수 있습니다.
