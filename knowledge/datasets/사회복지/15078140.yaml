      null_rate: 0.0
      sample_values:
        - 대기 1개월마다 가점 1점, 5개월 이상 대기 시 추가 5점의 대기가점(최대 10점) 부여, 대기 1개월의 기준은 대기 서비스 신청서 기준이며,
        - 기초생활보장법상 수급자 및 차상위계층 자녀
        - 국가유공자 등 예우 및 지원에 관한 법률 시행령상 상이등급 1급~ 3급 해당 가정의 자녀
