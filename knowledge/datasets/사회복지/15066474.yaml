summary_user: 수원시 독거노인 수를 읍면동(행정동) 단위로 집계해 총인원과 남·여 인원을 담은 통계 파일이며, 포털 설명상 주민등록상 1인 가구 기준으로 4개 구·44개 동을 다룬다. 복지 담당자나 분석가가 "수원시에서 홀로 사는 노인이 많은 동은 어디이고 성비는 어떤가"를 확인하는 데 쓴다. 전역 조인 키(행정코드)는 없어 시도명·시군구명·읍면동명 같은 이름을 매핑해 시군구·동 단위 노인인구·노인복지시설 데이터와 잇는다.
description_portal: 수원시에 거주하는 독거노인에 대한 분기별 현황 자료는 경기도 단위에서 제공되며, 시도명과 시군구명(수원시 4개 구), 그리고 세부적으로는 읍면동명(총 44개 동)을 기준으로 구성되어 있습니다. 해당 데이터에는 총 독거노인 인원수뿐만 아니라 성별로 구분된 남성과 여성의 수치도 포함되어 있어, 지역별 분포와 성별 특성을 동시에 파악할 수 있습니다. 본 자료는 주민등록상 1인 가구 기준으로 작성된 것이며, 복지 대상자인 저소득 독거노인에 대한 통계와는 별개의 정보이므로 활용 시 이 점을 고려하시기 바랍니다.
