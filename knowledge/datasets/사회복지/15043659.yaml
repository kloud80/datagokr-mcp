summary_user: 성남시 안에 있는 지역아동센터를 시설 한 곳당 한 행으로 정리한 현황 파일로, 시설명·정원·소재지 주소·연락처·데이터기준일자를 담는다(csv 약 5.9KB). 보호자가 집 근처 방과후 돌봄 센터와 연락처를 찾거나, 분석가가 성남시 안에서 지역아동센터 정원이 어떻게 분포하는지 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 맞춰 붙여야 하며, 사회복지시설 공통 마스터를 참조하는 보조 자료로 쓴다.
description_portal: 성남시 지역아동센터는 지역 내 아동들의 안전한 보호와 정서적·교육적 성장을 지원하는 복지시설로, 아동을 대상으로 방과 후 돌봄과 다양한 프로그램을 제공합니다. 이 센터들은 학습 지도, 급식, 정서지원, 문화체험 등 종합적인 서비스를 제공하며, 아동의 건강한 성장과 사회적 통합을 도모합니다. 성남시는 공공성과 전문성을 강화하기 위해 센터 운영을 행정과 민간이 협력하는 구조로 관리하고 있습니다. 데이터에는 시설명, 정원, 소재지, 연락처 등이 있습니다. 관련 법령은 아동복지법, 지역아동센터 운영지침 등이 있습니다.
