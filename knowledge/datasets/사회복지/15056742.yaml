summary_user: 경기도 시군별 보조기기 수리 서비스센터를 기관 한 곳당 한 행으로 담으며, 시군명·기관명·지번/도로명 주소·우편번호·전화번호·홈페이지·위경도 좌표를 포함하고 범위는 경기도, 행정단위는 시군구다. 장애인·고령자나 가족이 '우리 시군에서 휠체어·보청기를 고칠 수 있는 센터가 어디이고 연락처가 무엇인가'를 찾거나, 분석가가 시군별 센터 분포와 접근성 격차를 볼 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 시군명으로 다른 경기도 시군 단위 통계와 이름·코드 매핑해 붙이고, 위경도로 장애인 인구·교통 데이터와 공간 결합한다.
description_portal: 이 데이터는 경기도 내 시군별 보조기기 수리 서비스센터의 위치 및 현황을 제공합니다. 보조기기 수리 서비스센터는 휠체어, 보행기, 보청기 등 장애인·고령자 등의 일상생활을 지원하는 보조기기의 수리 및 유지관리를 전담하는 기관입니다. 데이터에는 시군명, 기관명, 지번 및 도로명 주소, 우편번호, 전화번호, 홈페이지 URL, 위도/경도 좌표 등의 항목이 포함되어 있어, 지역별 접근성, 서비스 분포, 행정적 지원 체계를 분석하는 데 활용할 수 있습니다. 본 데이터는 경기도장애인복지종합지원센터(누림센터)에서 제공하며, 장애인 이동권 보장, 지역 복지인프라 격차 해소, 복지 정책 수립에 실질적인 기초자료로 활용됩니다.
