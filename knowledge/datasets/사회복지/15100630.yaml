summary_user: 인천광역시 계양구 안의 장애인직업재활시설을 한 행에 한 곳씩 담은 목록으로, 시설 이름·도로명주소·전화번호·데이터기준일자를 담는다(CSV 415바이트의 작은 파일). 장애인이나 보호자가 '계양구에서 직업재활을 받을 수 있는 시설이 어디이고 연락처는 무엇인가'를 확인할 때, 복지 담당자가 관내 시설 현황을 정리할 때 쓴다. 다른 데이터와 잇는 공통 코드 키는 없어서, 시설 이름이나 도로명주소를 맞춰 보는 방식으로만 다른 장애인복지시설 목록이나 주소·좌표 데이터와 연결한다.
limits: 범위가 계양구 한 곳의 시설 목록이라 다른 시군구와의 비교나 시설별 이용 인원·정원·서비스 실적 분석에는 쓸 수 없다. 전역 조인 키가 없어 다른 데이터와 붙일 때 이름·주소 표기 차이를 직접 맞춰야 한다.
