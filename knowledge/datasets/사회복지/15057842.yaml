summary_user: 경기도 장애인 산모 출산비용 지원 인원을 기준연도·시군별로 집계한 자료로, 총계와 장애등급(1~6급)별 산모 수를 담는다. 복지정책 담당자나 연구자가 "어느 시군에서 중증 장애인 산모 출산비용 지원이 많았고 해마다 어떻게 달라졌나" 같은 질문에 쓴다. 전역 조인 키는 실측 컬럼에서 찾지 못했으므로, 다른 데이터와는 시군 코드(SIGUN_CD)나 시군명을 이름·코드 매핑해 경기도 내 시군 단위로 잇는다.
description_portal: '이 데이터는 경기도 내 장애인 산모를 대상으로 한 출산비용 지원 현황을 연도별·시군별로 집계한 자료입니다. 주요 항목에는 기준년도, 시군명, 총계(명), 전체 지원 인원수, 1급~6급 장애인 산모 수, 중증장애인(장애의 정도가 심한 장애인) 및 경증장애인(장애의 정도가 심하지 않은 장애인) 지원 인원수가 포함되어 있으며, 기타 구분도 함께 제시됩니다. 이를 통해 장애 정도에 따른 출산비용 지원 규모와 지역별 지원 차이를 확인할 수 있습니다. 특히 중증장애인 산모 지원 현황은 정책적 우선순위를 설정하는 데 중요한 지표가 되며, 연도별 변화 분석을 통해 복지 정책의 효과성과 지원 범위 확대 필요성을 검토할 수 있습니다. 해당 데이터는 장애인 가족 지원 정책, 출산 장려 정책, 보건복지 연구 등 다양한 분야에서 활용될 수 있습니다.* 장애등급 :  산모 기준'
