description_portal: 아이돌봄 가구원수별 소득 기준 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연도, 판정등급명, 중위소득기준금액, 가구원수, 월평균소득기준금액, 데이터기준일자의 정보를 확인할 수 있습니다. 돌봄 서비스 수급자의 자격 판단에 필요한 기준선을 명확히 할 수 있습니다. 이를 통해 신청자의 소득 수준을 정확히 비교하고 지원 대상의 적절성을 검토할 수 있습니다. 또한 연도별 기준 변화를 분석하면 정책 변동성이 가계에 미치는 영향을 파악하는 데도 도움이 됩니다. 다양한 사회보장제도와의 연계 판단 기준 마련에도 활용될 수 있습니다.
