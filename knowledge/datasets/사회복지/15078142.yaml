summary_user: 아이돌봄 서비스의 판정등급별·가구원수별 소득 기준을 담은 기준표 데이터로, 기준연도, 판정등급명, 중위소득 기준금액, 가구원수, 월평균소득 기준금액, 데이터기준일자를 전국 단위로 제공한다. 아이돌봄 서비스를 신청하려는 가구가 '우리 집 가구원수와 월소득이면 어느 판정등급에 해당하나'를 확인하거나, 분석가가 연도별 소득 기준 변화를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도·가구원수·판정등급명 같은 값을 맞춰 연결해야 하고, 같은 기관(한국건강가정진흥원)의 아이돌봄 관련 데이터와 함께 보는 방식이 현실적이다.
limits: 지역 구분이 없는 전국 단일 기준(비공간)이라 시군구별 차이나 실제 신청·수급 가구 수는 알 수 없다. 공통 조인 키가 없어 다른 데이터와 붙일 때는 이름·값 매핑에 의존해야 한다. 개발계정 호출은 하루 3,000회로 제한된다.
