summary_user: 경기도 워라밸링크 플랫폼에 게시된 공공정책 콘텐츠를 콘텐츠 한 건당 한 행으로 담으며, 유형·제목·제공 기관·기간 여부·작성일과 연결된 콘텐츠 고유번호를 포함한다. 개인회생·개인파산·디딤돌대출·보금자리론처럼 신용회복·금융지원·주거복지 정책 안내가 어느 기관에서 어떤 유형으로 제공되는지 파악하려는 정책 담당자나 분석가가 기관별 콘텐츠 현황을 집계할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 제공 기관명(conts_inst_nm)이나 정책명을 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼 내에 게시된 다양한 공공정책 콘텐츠의 정보를 담고 있으며, 고유번호, 유형, 제목, 콘텐츠 제공 기관, 기간여부, 콘텐츠 고유번호, 작성일 등의 항목으로 구성되어 있습니다. 개인워크아웃, 개인파산, 개인회생, 디딤돌대출, 미소금융, 바꿔드림론, 보금자리론 등 신용회복, 금융지원, 주거복지 등 생활 밀착형 공공정책 내용을 포함하고 있습니다. 각 콘텐츠는 관련 부처 및 기관에서 제공하며, 정책 정보 접근성과 정보 제공의 체계화를 지원합니다. 이 데이터는 공공정책 콘텐츠의 유형별 분류 및 서비스 연계, 정책 홍보 콘텐츠 기획, 기관별 제공 콘텐츠 통계 분석 등에 활용될 수 있습니다.
