summary_user: 경상남도 양산시에 있는 노인요양기관을 한 줄에 한 곳씩 시설명·구분·주소·전화번호로 담은 시설 목록 파일이다(csv 약 2KB, 시군구 범위, 개별 주소 단위). 양산시 주민이나 가족이 집 근처 요양기관을 찾고 연락처를 확인하거나, 분석가가 양산시 안의 요양기관 분포를 지역별로 살필 때 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록이나 사회복지시설 정보와는 시설명·주소를 맞춰 이어야 하며, 지역 통계와는 주소에서 뽑은 시군구 단위로 연결한다.
limits: 시설코드 같은 공통 식별자가 없어 다른 데이터와 붙일 때 시설명·주소 문자열 매칭에 의존해야 하고, 좌표가 없어 지도에 올리려면 주소를 따로 변환해야 한다. 양산시 한 곳만 다루므로 다른 시군구와의 비교에는 별도 자료가 필요하다.
