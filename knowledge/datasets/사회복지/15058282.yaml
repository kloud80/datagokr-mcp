summary_user: 경기도 시군별·연도별로 주민등록인구수, 등록장애인수, 인구 대비 등록장애인비율(%)을 담은 시군구 단위 집계 통계다. 복지 분석가나 지자체 담당자가 '우리 시군의 장애인 비율이 도내 다른 시군보다 높은지, 해마다 어떻게 변했는지'를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군코드(SIGUN_CD)나 시군명을 매핑해 같은 기관의 다른 시군별 통계나 시군구 단위 인구·복지 자료와 잇는다.
description_portal: 본 데이터는 각 시군의 연도별 주민등록 인구수 대비 등록된 장애인 수 및 장애인 비율을 제시하는 통계자료입니다. 주요 항목으로는 ‘기준년도’, ‘시군명’, ‘주민등록인구수(명)’, ‘등록장애인수(명)’, ‘등록장애인비율(%)’이 포함되어 있으며, 이를 통해 특정 지역의 장애인 분포 및 인구 대비 비율을 시계열적으로 비교할 수 있습니다. 해당 데이터는 지역별 사회복지 정책 수립, 장애인 지원 예산 배분, 지역 간 장애인 인구 비교 등 다양한 정책적·연구적 목적에 활용될 수 있습니다. 특히, 등록장애인비율(%) 항목은 장애인에 대한 지역별 수요 예측 및 행정적 대응을 위한 기초자료로 사용될 수 있으며, 인구 고령화나 장애 유형별 정책 대응 등을 위한 참고 지표로도 유용합니다. 또한 시군별 세부 통계를 통해 도시 규모와 장애인 비율 간의 상관관계 분석 등 다각적인 분석이 가능합니다.
