summary_user: 경기도 김포시 안 경로당을 한 곳씩 담은 시설 목록으로, 경로당명·면적(제곱미터)·도로명/지번 주소·데이터기준일자를 개별 시설 단위로 제공한다. 주민이나 노인복지 담당자·분석가가 '우리 동네(읍면동) 근처에 경로당이 어디에 몇 곳 있고 규모는 어느 정도인가'를 확인하거나 권역별 경로당 분포를 볼 때 쓴다. 전역 조인 키나 시설코드가 없으므로 다른 노인복지시설·장기요양기관 데이터나 지역 통계와는 주소(도로명·지번)나 경로당명으로 맞춰 이어야 한다.
description_portal: 경기도 김포시의 경로당현황에 대한 정보를 제공합니다. 제공 항목으로는 경로당명, 면적(제곱미터), 소재지 주소, 데이터기준일자로 구성되어있으며 주소는 도로명과 지번의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 데이터를 통해 권역별 경로당 위치 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 노인장애인과로 연락주시기 바랍니다.
