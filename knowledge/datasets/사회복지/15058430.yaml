summary_user: 경기도 내 중증장애인 거주시설을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군명·기관명·주소·좌표와 입소자 정원·현원, 종사자 정원·현원, 설치신고일, 운영 법인명을 포함한다. 복지 분석가나 지자체 담당자가 "우리 시군의 중증장애인 거주시설은 정원 대비 얼마나 차 있고 종사자는 충분한가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 기관명·주소 매칭으로 다른 경기도 시군 단위 복지 데이터와 잇고, 위경도 좌표로 지도 위에 겹쳐 본다.
description_portal: 이 데이터는 중증장애인의 생활 지원을 위해 운영되는 거주시설 현황을 정리한 자료로, 시설별 운영 규모와 인력 현황을 포함하고 있습니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소·도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL, 입소정원수 및 현원수, 종사자 정원수 및 현원수, 설치신고일, 법인명정보가 포함되어 있습니다. 이를 통해 각 시설의 위치와 규모, 입소자 및 종사자 현황을 파악할 수 있으며, 시설별 운영 주체(사회복지법인 등)와 설립 연혁도 확인할 수 있습니다. 이 데이터는 장애인 거주시설의 지역별 분포를 분석하고, 복지 서비스 인력 배치 현황을 검토하여 시설 운영의 적정성을 평가하는 데 활용될 수 있습니다. 또한 입소정원 대비 현원 현황을 통해 시설 포화 여부 및 정책적 지원 필요성을 진단하는 기초자료로도 유용합니다.
