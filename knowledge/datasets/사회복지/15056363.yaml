summary_user: 제주시 관내 장애인복지시설·정신건강시설·노숙인재활시설을 시설 한 곳당 한 행으로 담은 파일로, 상위·세부 시설구분, 시설명, 소재지, 정원·현원, 전화번호를 포함한다. 보호자나 복지 담당자가 '제주시에서 장애인 주간이용시설이나 단기거주시설은 어디에 있고, 정원 대비 현원 여유가 있는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 맞춰서 연결해야 한다.
description_portal: 이 데이터는 제주특별자치도 제주시 관내 장애인복지시설 관련 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 장애인복지과이며, 지역 내 복지시설의 유형별 분포와 운영 현황을 체계적으로 파악할 수 있도록 구성되어 있습니다.데이터에는 제주시 내 장애인복지 관련 시설의 기본 정보가 수록되어 있으며, 주요 항목은 시설구분1, 시설구분2, 시설명, 소재지, 정원, 현원, 전화번호로 이루어져 있습니다. 시설구분1 항목은 노숙인재활시설, 장애인복지시설, 정신건강시설로 구성되어 있어 시설의 상위 기능별 분류를 확인할 수 있으며, 시설구분2 항목은 거주시설, 공동생활가정, 노숙인재활시설, 노숙인종합지원센터, 단기거주시설, 의료재활시설, 정신요양시설, 정신재활시설, 주간이용시설, 직업재활시설 등으로 세분화되어 있어 보다 구체적인 서비스 유형을 파악할 수 있습니다.시설명 항목을 통해 각 시설의 명칭을 확인할 수 있고, 소재지 항목에서는 시설의 위치와 지역별 분포를 파악할 수 있습니다. 또한 정원 항목은 각 시설이 수용하거나 지원할 수 있는 기준 인원을 나타내며, 현원 항목은 실제 이용 또는 입소 인원을 보여주어 시설별 운영 규모와 이용 현황을 비교하는 데 활용할 수 있습니다. 전화번호 항목은 이용자, 보호자, 관계기관 등이 시설과 직접 연락할 수 있는 정보를 제공합니다.
