summary_user: 경기도 광주시가 운영하는 무한돌봄센터의 센터명, 도로명주소·우편번호, 전화번호, 담당부서, 사례관리 팀을 센터 한 곳당 한 행으로 담은 소규모 현황 파일(CSV 371바이트)이다. 경제적 어려움이나 질병, 가족 해체 같은 위기에 처한 광주시 주민이 가까운 센터와 연락처, 담당 사례팀을 찾을 때 쓴다. 전역 조인 키는 없어서 다른 사회복지시설 목록과는 센터명이나 도로명주소(소재지도로명주소)를 맞춰 연결해야 한다.
description_portal: 본 데이터는 경기도 광주시에서 운영하는 무한돌봄센터의 운영 현황 정보를 제공합니다. 무한돌봄센터는 경제적 어려움, 질병, 가족 해체 등 복합적인 위기 상황에 처한 가정을 발굴하고 맞춤형 지원을 제공하는 복지 전달 체계입니다. 센터명과 소재지 정보를 통해 센터의 위치를 확인할 수 있으며, 우편번호와 도로명주소는 방문 상담 시 접근성을 높입니다. 전화번호는 위기 상황 발생 시 신속한 상담 및 지원 요청을 위한 연락 창구이며, 담당부서명은 센터를 관할하는 행정 조직을 나타냅니다. 사례팀명은 위기 가정의 사례 관리를 담당하는 전문 팀 정보를 제공합니다.
