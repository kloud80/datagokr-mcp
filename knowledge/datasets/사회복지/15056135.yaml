summary_user: 경상남도 안 사회적협동조합을 조합 1곳당 1행으로 담은 건별 명단으로, 조합명·인가(수리)일·업종·조합유형·대표연락처·주소를 담는다(CSV 약 46KB). 사회적경제 담당자나 연구자가 '경남에서 어떤 업종의 사회적협동조합이 언제, 어느 시군에 설립됐나'를 파악할 때 쓴다. 전역 조인 키나 인증번호·사업자번호가 없어 다른 사회적기업·협동조합 데이터와는 조합명 대조나 주소에서 뽑은 시군 이름으로만 이어 쓴다.
description_portal: 이 데이터셋은 경상남도 내 사회적협동조합의 설립현황을 제공하며, 협동조합명, 수리일자(인가일), 대표연락처, 업종, 조합유형, 주요사업내용, 소재지(주소) 정보로 구성되어 있습니다. 대표연락처는 보유한 정보에 한해서만 수록되어 있음을 유의해야 하며, 본 자료는 경남지역 사회적협동조합의 설립 경향과 업종별 분포, 공익적 활동 영역, 지역사회 기여도, 서비스 범위 확대 가능성 등을 분석하는 데 활용될 수 있는 기초자료입니다. 행정, 연구, 정책 수립, 통계 기반 의사결정 등 다양한 목적에 유용하게 참고될 수 있습니다.
