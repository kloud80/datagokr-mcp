description_portal: '공무원연금공단에서 제공하는 연령별 유족연금지급액 현황 데이터입니다.본 자료는 유족연금 수급자의 연령을 기준으로 38세 미만부터 고령층까지 세분화하여, 총 지급액 및 수급자의 가족관계(배우자, 부모, 자녀, 손자녀 등)별 연금 지급 현황을 집계한 자료입니다. 각 항목은 전체 지급액과 함께 남성·여성별 지급액이 구분 제공됩니다. 1.(21.6.22. 이전 연금수급자 사망) 19세 이상 자녀 중 공무원 재해보상법에 다른 장해등급 1~7급에 해당2.(21.6.23. 이후 연금수급자 사망) 19세 이상 자녀 중 장애인복지법 제2조에 따른 장애의 정도가 심한 장애인에 해당하고 연금수급자 사망 당시 부양사실이 인정된 경우단위: 백만원 (성별 합계 등 소계는 백만원 단위표기에 따라 단수차이가 발생할 수 있음)'
