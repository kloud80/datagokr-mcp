description_portal: 제주시에서 아동복지 지원을 위해 운영하는 드림스타트사업 관련 정보를 제공하는 데이터입니다. 담당 부서는 주민복지과이며, 취약계층 아동과 가족을 대상으로 추진되는 다양한 지원 프로그램의 운영 현황을 확인할 수 있습니다. 데이터에는 구분(분야), 서비스분류, 프로그램명, 시기, 대상, 인원, 내용, 데이터기준일자가 포함되어 있으며, 프로그램별 지원 내용과 운영 시기, 참여 대상 등을 살펴볼 수 있도록 구성되어 있습니다. 예를 들어 건강검진(성장발달 스크리닝 포함), 건강한 마음 만들기 종합검사, 부모와 함께하는 영유아 인지발달, 산모 신생아 건강관리, 산전 및 산후 검진, 생애 첫 통합발달 프로그램, 영양교육, 예방접종 서비스 이용 관리, 예비부모 교육, 예비초 기초학습지도, 유아체육 등과 같은 프로그램 정보를 포함할 수 있어, 아동의 건강·정서·발달·양육 지원과 관련된 드림스타트사업 내용을 보다 구체적으로 확인하는 데 도움이 됩니다.
