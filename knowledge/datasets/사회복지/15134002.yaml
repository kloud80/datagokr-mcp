description_portal: 본 데이터는 한국청소년상담복지개발원이 운영하는 솔리언 또래상담자 프로그램의 인증 현황을 제공합니다. 해당 프로그램은 청소년들이 또래의 고민을 경청하고 지지할 수 있도록 훈련받은 또래상담자를 양성하고 있으며, 본 데이터는 2015년부터 2023년까지 연도별, 지역별로 인증받은 인원 수를 포함합니다. 이를 통해 청소년 주도 상담 활동의 확산 정도를 파악하고, 지역 간 운영 현황과 청소년 참여도를 비교할 수 있습니다. 데이터는 정책 수립, 상담활동 지원, 청소년 참여 기반 확대 등 다양한 목적으로 활용됩니다. 인증 인원 추이는 학교 기반 예방교육과 또래상담 프로그램의 효과성을 평가하는 기초자료로 제공됩니다. 본 자료는 청소년 역량 강화와 상담문화 정착을 위한 기반 정보입니다.
