summary_user: 경기도 내 상조업체를 업체 한 곳당 한 행으로 담으며, 인허가일·영업상태·폐업일, 주소와 좌표, 자본금 규모, 예치기관·공제계약·보험 같은 금융보증 정보를 포함한다. 소비자가 계약하려는 상조업체가 현재 영업 중인지, 선수금 보전을 위한 공제계약이나 예치기관이 있는지 확인할 때 쓰고, 분석가는 시군별 상조업체 분포와 폐업 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 업체명·주소 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 상조업체의 인허가, 영업상태 등에 대한 정보를 수록한 자료로, 장례 등 의례서비스 제공을 위한 민간업체의 운영 현황을 파악할 수 있습니다. 사업체의 설립 및 폐업 현황, 행정정보와 금융보증 상태 등을 바탕으로 소비자 보호와 제도적 관리에 활용될 수 있으며, 지역 내 서비스 기반 시설의 분포와 운영 실태 분석에 유용한 자료입니다. 다양한 항목을 통해 상조업계의 행정적 관리 실태와 서비스 지속 가능성을 가늠할 수 있으며, 상조 관련 정책 수립이나 민원 대응 시스템 마련에도 기초 자료로 사용될 수 있습니다.
