summary_user: 아이돌보미 한 명(돌보미관리번호)별로 교육연도, 교육수료일자, 이수 교육시간, 수료 여부를 담은 전국 단위 원천 기록이다. 돌봄 서비스 담당자나 정책 분석가가 "올해 보수교육을 수료하지 않은 돌보미가 얼마나 되나" 같은 재교육 대상 점검 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 다른 아이돌봄 데이터와는 돌보미관리번호(sttrMngNo) 같은 기관 내부 코드로만 이어 붙인다.
limits: 지역·기관 정보가 없는 전국·비공간 데이터라서 이 데이터만으로는 지역별 인력 수준을 비교하지 못한다. 다른 기관 데이터와 공통으로 쓰는 키가 없어 외부 데이터와 직접 결합하기 어렵다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
