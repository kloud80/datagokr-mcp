summary_user: 경기도 장애아동수당 수급자 수를 연도(STD_YY)·시군별로 집계한 자료로, 시군별 합계와 장애 정도별(심한 장애 중증·심한 장애 경증·심하지 않은 장애 경증·해당 없음) 수급자 수를 담는다. 복지 정책 담당자나 분석가가 '우리 시군의 중증 장애아동 수급자 비율이 다른 시군보다 높은가'처럼 시군 간 수급 분포와 지원 대상 규모를 비교하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)나 시군명으로 다른 경기도 시군 단위 통계와 이름·코드 매핑으로 연결한다.
description_portal: 이 데이터는 경기도 장애아동수당 수급자 현황을 시‧군별, 장애등급별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애아동수당은 만 18세 미만 장애아동에게 지급되는 복지 수당으로, 중증과 경증 장애아동 모두를 대상으로 합니다. 데이터에는 각 시군별 수급자 총합과 함께 장애 정도에 따른 세부 현황이 포함되며, ‘심한 장애(중증)’, ‘심한 장애(경증)’, ‘심하지 않은 장애(경증)’, ‘해당 없음’으로 구분된 수급자 수가 제공됩니다.이를 통해 장애 정도별 수급 분포 분석, 시군 간 복지 격차 파악, 정책 지원 대상자 규모 산정 등이 가능합니다. 예를 들어, 특정 시군에서 중증 아동 수급자의 비율이 높다면 해당 지역에 추가적인 복지 인프라나 돌봄 지원이 필요하다는 정책적 근거로 활용할 수 있습니다.
