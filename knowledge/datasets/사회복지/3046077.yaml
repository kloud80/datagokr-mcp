summary_user: 국민연금 지역가입자의 평균소득월액(원)을 시군구별·기준년월별로 담은 집계 파일로, 전국 시군구를 범위로 하는 가입 원장 기반 통계다. 지역 정책 분석가나 연구자가 "우리 시군구 지역가입자의 신고소득 수준이 다른 지역보다 높은가 낮은가"를 비교하는 데 쓴다. 전역 조인 키(행정구역 코드)가 없어 시군구 이름을 행정구역 코드에 매핑하거나 같은 기관의 시군구별 가입·수급 통계와 이름·기준년월로 맞춰 잇는다.
description_portal: '국민연금공단 자격 시군구별 평균소득월액(시군구별 지역가입자  평균소득월액 / 단위: 원) 을 제공합니다.   - 작성시점 : 2025.01.31 - 지역가입자 : 국내에 거주하는 18세이상 60세미만의 국민으로서 사업장 가입자가 아닌자- 기준소득월액 : 연금보험료 및 급여의 산정을 위하여 가입자의 소득월액을 기준으로 하여 대통령령으로 정하는 금액* 국민연금 통계연보(연 1회) : 국민연금공단 홈페이지 - 연금정보 - 자료실 - 통계자료 - 통계연보 국민연금 가입자, 수급자, 기금 현황 관련 통계 등 확인가능합니다.'
