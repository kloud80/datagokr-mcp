summary_user: 경상북도 내 장애인복지관을 시설 한 곳당 한 행으로 담아 시군, 관장, 소재지, 연락처, 부지 면적(제곱미터), 운영주체, 종사자 수, 이용자 연인원을 기록한 소규모 파일(csv 약 2KB)이다. 장애인과 가족이 사는 시군의 복지관 위치와 연락처를 찾거나, 분석가가 시군별 복지관 공급 규모와 종사자 대비 이용 실적을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명이나 소재지 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 장애인복지관의 현황에 대한 정보를 제공합니다. 이는 경상북도 내에 설립되어 운영되고 있는 장애인 복지관의 기본적인 운영 정보와 규모를 파악하여, 장애인 복지 서비스의 지역적 접근성과 공급 실태를 분석하는 데 목적이 있습니다.주요 내용으로는 복지관이 위치한 시군별 행정구역 정보와 시설 운영의 책임자인 관장의 정보를 포함하고 있습니다. 이용자의 접근성을 위한 소재지와 연락처 정보가 상세히 기록되어 있습니다. 또한, 시설의 규모를 나타내는 부지(제곱미터) 정보와 시설 운영의 주체를 명확히 하는 운영주체 정보가 포함됩니다.시설의 서비스 제공 역량을 가늠할 수 있도록 실제 이용자 수와 복지 서비스를 직접 수행하는 종사자 수에 대한 통계 정보도 제공됩니다. 이 자료는 장애인 복지 인프라 확충 계획 수립, 서비스 질 향상 방안 마련, 그리고 관련 연구 활동에 귀중한 기초 자료로 활용됩니다.
