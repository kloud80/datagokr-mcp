summary_user: 양주시 시내버스 노선별로 운수업체, 기점·종점 정류장, 총 인가대수와 그중 저상버스 대수를 담은 노선 단위 현황 파일이다(CSV 약 2.7KB의 소규모 자료). 휠체어 이용자나 노약자가 '우리 동네를 지나는 노선에 저상버스가 몇 대나 다니는가'를 확인하거나, 행정·연구자가 노선별 저상버스 보급률을 계산하는 데 쓴다. 전역 조인 키가 없어 다른 시군 저상버스 현황이나 버스 노선 정보와는 노선번호·정류장 이름을 맞춰 연결해야 한다.
limits: 표준 노선 ID나 정류장 ID 같은 조인 키가 없어 버스정보시스템 등과 자동 연결되지 않고, 이름 매칭에 의존한다. 노선 단위 집계라 실제 운행 시각이나 차량별 배차 정보는 알 수 없다.
