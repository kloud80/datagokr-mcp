summary_user: 사립학교 교직원 퇴직자 수를 재직기간 구간(1년 미만~35년 미만)별 행과 학교급(유치원·초·중·고·전문대·대학교·특수학교·법인)별 교원·직원 열로 나눈 전국 단위 집계표이며, 약 1.9KB 크기의 CSV 파일 하나다. 연금 제도나 교육 인력 수급을 분석하는 연구자가 '대학교 직원은 초등학교 교원보다 짧은 재직기간에 퇴직하는가'처럼 학교급·직종별 퇴직 시점 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 재직기간 구간이나 학교급 이름을 맞추거나 같은 기관(사학연금)의 다른 통계표와 나란히 놓고 쓴다.
limits: 전국 합계만 담아 지역별·학교별 분석은 할 수 없고, 개인 단위 원천 기록이 아닌 집계표다. 표준 코드나 조인 키가 없어 공무원·군인연금 등 다른 직역연금 통계와 비교하려면 구간과 분류명을 직접 맞춰야 한다.
