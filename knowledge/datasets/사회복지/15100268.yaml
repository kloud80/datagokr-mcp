summary_user: 국립 청소년 디딤센터(용인 중앙센터·대구센터 등 총 2개소)의 시설명·시설종류·주소·대표전화·대상 이용자·입소자 현황·주요 프로그램을 시설 한 곳당 한 행으로 담은 소규모 현황 파일(약 1.6KB)이다. 정서·행동 문제(우울·불안·ADHD, 대구는 미디어 과의존 포함)를 겪는 만 9~18세 자녀를 둔 보호자나 상담 실무자가 거주형 치료·재활 시설이 어디에 있고 어떤 프로그램을 운영하는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 시도·시군구 이름이나 주소를 매핑해 지역 단위 청소년 통계나 다른 청소년 시설 목록과 이어 쓴다.
description_portal: 우울, 불안,  주의력결핍과다행동장애(ADHD) 등 정서· 행동 측면(대구센터는 미디어 과의존을 겪는 청소년에게도 치유 서비스를 제공하는 복합시설로 운영 중)에서 어려움을 겪는 만 9~18세 청소년을 대상으로 “상담· 치료· 보호· 자립· 교육” 등의 전문적이고 종합적인 서비스를 제공하기 위해 성평등가족부가 설립한 거주형 치료· 재활 청소년 복지시설로 현재 총 2개소(국립중앙청소년디딤센터(용인)과 국립대구청소년디딤센터(대구))를 운영하며 청소년에게 치유 서비스 제공을 통해 건강한 성장과 일상생활 영위를 지원하는 시설을 설명하는 데이터
