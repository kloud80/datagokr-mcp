description_portal: 본 데이터는 한국토지주택공사의 지역본부, 사업본부와 같이 소재지 및 그 인근 지역의 사업을 담당하거나 또는 연구원과 같이 특별한 목적을 위하여 설립된 본사를 제외한 기관에 관한 데이터를 제공합니다. 제공하는 데이터는 본부명, 우편번호, 주소, 관할구역이며 앞에서 말한 특수한 목적을 위해 설립된 기관의 경우에는 별도의 관할구역이 없을 수 있습니다. 또한 사업본부의 경우에는 개발 중인 지역에 건물이 위치해 있는 경우가 있어 주소가 없거나 부정확할 수 있으니 이용에 참고하시기 바랍니다. 관할구역은 해당 기관의 주요 업무 수행 구역을 뜻하며 모든 업무 영역을 뜻하지는 않습니다. 아울러 공사 내부적인 조직 개편, 사업 준공 또는 중단 등으로 실제와는 다소 차이가 있을 수 있으니 유의하시기 바랍니다.
