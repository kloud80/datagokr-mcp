summary_user: 용인시 관내 어린이집을 한 곳당 한 행으로 담은 건별 목록으로, 행정동·어린이집 유형·기관명·원장/대표자, 정원과 현원, 보육 교직원 수, 평가인증·공공형·장애아 전문·야간연장·휴일보육·0세아 전용 여부, 전화·팩스·주소를 제공한다. 용인시에 사는 부모가 '우리 동네에서 야간연장이나 휴일보육을 하고 정원에 여유가 있는 어린이집은 어디인가'를 찾거나, 분석가가 행정동별 어린이집 공급과 정원 충족률을 비교하는 데 쓴다. 어린이집코드 같은 공통 조인 키가 없어 다른 어린이집·유치원 데이터와는 기관명·주소·행정동명을 맞춰 연결해야 한다.
description_portal: 본 데이터는 용인시 어린이집 현황 조회 API를 통해 제공되는 관내 어린이집 정보를 체계적으로 관리하기 위한 자료이다. 결과코드, 결과메시지, 한 페이지 결과 수, 페이지 번호, 데이터 총 개수는 서비스 호출의 처리 상태와 응답 구조를 확인하는 항목이다. 번호별로 행정동명, 어린이집 유형, 기관명, 원장 및 대표자명, 정원과 현원, 보육 교직원 수를 제공하여 기관 규모와 운영 현황을 파악할 수 있도록 구성하였다. 또한 평가인증 여부, 공공유형 지정여부, 장애인 전문 여부, 야간 연장 여부, 휴일 보육 여부, 0세아 전용 여부는 보육 서비스 특성과 돌봄 범위를 제시한다. 전화번호, 팩스번호, 주소 정보는 이용자 문의와 위치 확인을 지원하여 보육 서비스 접근성을 높인다.
