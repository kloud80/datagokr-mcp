summary_user: 자활기업 한 곳당 한 행으로 사업자등록번호·소재 시도·시군구 코드, 사회적기업·예비사회적기업·마을기업 지정일, 폐업·탈퇴 여부와 일자, 설립 당시 수급자·차상위·성별 인원 구성, 업태를 담은 전국 단위 원천 목록 파일이다. 사회복지 분석가나 지자체 담당자가 '우리 지역 자활기업 중 사회적기업으로 전환한 곳은 몇 곳이고 폐업한 곳은 얼마나 되는가'처럼 자활기업의 지역 분포와 전환·존속 현황을 따질 때 쓴다. 실측상 전역 조인 키가 없어 다른 데이터와는 첨부 코드북으로 시설번호·시도·시군구 코드를 이름으로 바꾼 뒤 지역명이나 사업자등록번호로 맞춰 이어 써야 한다.
