description_portal: 이 데이터파일은 인천광역시 계양구의 행정동별 장애인 등록현황을 나타낸 자료입니다. 계양구 내 각 동(행정동)별로 등록된 장애인의 수를 확인할 수 있도록 구성되어 있으며, 주요 항목으로는 연번, 행정동명, 해당 동에 등록된 장애인 수, 그리고 데이터의 기준이 되는 기준일자가 포함되어 있습니다. 본 자료는 지역 내 장애인 분포 현황을 파악하고, 향후 복지정책 수립이나 지역별 복지자원 배분 시 기초자료로 활용될 수 있도록 제공된 것입니다. 이를 통해 행정기관은 보다 효과적인 복지서비스 계획을 수립할 수 있으며, 공공기관 및 연구기관에서도 통계 분석 자료로 유용하게 사용할 수 있습니다. 기타 자세한 사항은 인천광역시 계양구 노인장애인복지과(032-450-5385)로 문의하시기 바랍니다.
