description_portal: 이 데이터는 광주광역시 서구에 거주하는 장애인 중 전동보장구(전동휠체어, 전동스쿠터 등)의 신청 현황을 연도별 및 행정동별로 집계한 통계자료입니다. 신청자의 장애 유형, 신청 연도, 신청 지역 등의 항목으로 구성되어 있으며, 보조기기 신청·지원 이력의 시계열적 흐름을 파악할 수 있도록 되어 있습니다.이 자료는 지역 내 장애인의 이동권 보장 실태를 진단하고, 이동 취약계층에 대한 정책 수요를 분석하는 데 활용할 수 있습니다. 특히 전동보장구 신청 건수를 통해 복지수요 증가 추이, 지역 간 수요 편차, 특정 장애 유형별 장비 선호도를 도출할 수 있어 장애인 이동지원 정책, 보장구 지원 예산 수립, 접근성 기반 생활SOC 설계 등에 활용 가치가 높습니다.또한 이 데이터는 행정동 단위로 세분화되어 있어 지역 기반 복지정책 설계 및 보조기기 공급계획 수립 시 실질적 참고자료로 쓰일 수 있으며, 연도별 현황을 통해 정책 도입 전·후의 변화 분석, 중장기 수요예측, 맞춤형 지원 대상자 선별 등에 핵심적인 기반 자료로 기능합니다.
