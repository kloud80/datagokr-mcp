summary_user: 부산 금정구 관내 노인일자리사업을 수행기관·사업별로 한 줄씩 담은 파일로, 사업 구분, 사업명과 활동내용, 대상 인원, 기관 주소·전화번호, 당해년도 사업 시작·종료일을 담는다. 금정구에 사는 어르신이나 가족이 "집 근처 어느 기관에서 어떤 노인일자리를 몇 명 규모로 하는가"를 찾거나, 분석가가 기관별 사업 유형과 인원 배분을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설 데이터나 지역 통계와는 수행기관 이름이나 주소를 맞춰 잇는다.
description_portal: 부산광역시 금정구 관내의 노인일자리 사업 현황을 등록하여 관련 데이터를 제공합니다.*전화번호에 휴대폰번호 등 개인정보가 있을 경우 공백으로 처리합니다. -> 비공개*전화번호가 명확하지 않은 경우 공백으로 처리합니다.*주요 데이터 컬럼별 상세설명○ 구군명 →  노인일자리사업 수행기관이 위치하는 행정단위인 "구"의 이름○ 수행기관 →  부산광역시 금정구에 위치한 노인일자리사업을 수행하는 기관 이름○ 사업 구분 → 부산광역시 금정구에서 수행하는 노인일자리사업의 유형을 몇 개로 갈라나눈 것○ 사업명 및 활동내용  → 사업명 및 활동내용○ 인원(명) → 부산광역시 금정구에서 수행하는 노인일자리사업 대상 인원 수○ 주소 → 부산광역시 금정구에 위치한 노인일자리사업 수행기관의 주소○ 전화번호 → 부산광역시 금정구에 위치한 노인일자리사업 수행기관의 전화번호○ 사업 시작일 → 당해년도 노인일자리 사업을 시작한 날짜○ 사업 종료일 → 당해년도 노인일자리 사업을 수행하다가 종료하는 날짜○ 데이터 기준일자 → 데이터의 기본이 되는 표준날짜를 연월일로 표현한 것
