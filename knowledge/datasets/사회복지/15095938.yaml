summary_user: 대구광역시 북구청이 지급하는 장애수당(기초·차상위 등)과 장애아동수당(기초·차상위 등)을 구분별로 묶어 수당 금액과 비고를 담은 집계형 지급현황 데이터입니다. 북구의 장애수당·장애아동수당이 수급 구분별로 얼마나 지급되는지 확인하려는 복지 분석가나 주민이 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분 명칭을 맞추거나 같은 기관 데이터끼리만 이어 쓴다.
limits: 조인 키가 없어 다른 시군구나 장애인 등록 통계와 자동으로 연결되지 않고, 수급자 개인 단위 정보는 없다. 호출에는 포털 활용신청 후 발급받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
