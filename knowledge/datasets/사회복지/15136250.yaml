summary_user: 경상남도 행정동(읍면동)별 기초생활수급자 수를 2024년 9월 기준으로 집계한 1회성 파일로, 포털 설명상 총 17건이며 행정동코드·수급자수·기준일 세 항목으로 구성된다. 경남 지역의 복지 담당자나 분석가가 "어느 읍면동에 기초생활수급자가 많이 몰려 있는가"를 보고 지역 복지정책이나 시설 배치를 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 행정동코드를 행정구역 코드표와 이름·코드로 매핑해 인구·시설 등 다른 읍면동 단위 데이터와 연결해야 한다.
description_portal: (데이터 수집목적 및 과정) 경남빅데이터허브플랫폼 기초생활수급자수 데이터는 경남빅데이터허브플랫폼에서 관리하고 있는 행정동별 기초생활수급자수 입니다. 데이터는 2024년 9월을 기준으로 산출되었습니다.(데이터 구성 및 세부항목) 기초생활수급자수 데이터는 행정동 코드별 기초생활수급자수로 구성되었습니다. 2024년 9월 기준 총 17건입니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다. 자세한 내용은 경남빅데이터허브플랫폼을 참고하여 주시기 바랍니다.
