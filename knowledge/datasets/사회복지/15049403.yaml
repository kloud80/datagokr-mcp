description_portal: '근거 법령: 「장애인복지법」 제32조(장애인 등록)1. 데이터 개요본 데이터는 「장애인복지법」 제32조에 따라 등록된 경상남도 장애인 현황을① 장애유형별(15개),② 장애정도별(2개)로 구분하여 집계한 정형 데이터입니다.데이터는 행정정보시스템에 의해 주기적으로 관리되므로 정확성·신뢰성·표준화가 용이하며, 개인정보를 포함하지 않는 완전 집계형 비식별 통계 데이터로 제공이 가능합니다.(1) 장애유형별 구분(총 15개 유형) : 지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐성, 정신, 신장, 심장, 호흡기, 간, 안면, 장루·요루, 뇌전증➡ 법정 장애유형 분류 기준과 완전히 동일하여 타 시·도 및 중앙부처와의 표준화·연계가 용이함.(2) 장애정도별 구분(2개) : 심한 장애, 심하지 않은 장애 (※ 2019년 장애등급제 폐지 이후의 공식 분류 기준 반영)➡ 범정부 공통 기준이므로 체계적 분류·비교·연계·통계 분석 가능.'
