summary_user: 아이돌봄 기관별·기준연월별로 누적 돌봄 이용 건수를 0시부터 24시까지 두 시간 단위 시작 시간대로 나눠 담은 집계 데이터이며, 범위는 전국이다. 돌봄 정책 담당자나 분석가가 '야간·이른 아침 등 어느 시간대에 아이돌봄 이용이 몰리는가'를 보고 인력 배치나 야간 돌봄 확대를 검토하는 데 쓴다. 전역 조인 키는 없어 기관번호(childCareInstNo)·상위기관번호와 기관명으로 같은 기관의 다른 아이돌봄 실적 데이터나 사회복지시설 목록과 이름·코드 매핑으로만 연결한다.
description_portal: 아이돌봄 누정아동실적현황을 서비스시간대별로 조회하여 서비스를 제공하는 오픈 API형 데이터입니다. -해당 개방 데이터는 기준연월, 아이돌봄기관명, 기관번호, 전염성 질병 아동여부, 총건수, 0시부터 24시까지를 두시간단위로 나눈 시간대별 시작 건수 등의 정보를 확인할 수 있습니다.아동 돌봄 수요의 시간적 분포를 시각적으로 분석하는 데 유용합니다. 심야 시간이나 특정 시간대에 돌봄 이용이 집중된다면, 그에 맞는 인력 배치 및 근무 체계 조정이 가능하며, 서비스 운영의 유연성과 효율성을 높이는 데 기여할 수 있습니다. 이 정보는 향후 야간 돌봄 확대나 시간제 인력 운용 개선에 활용될 수 있습니다."
