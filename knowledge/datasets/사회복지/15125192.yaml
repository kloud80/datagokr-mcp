summary_user: 청소년 상담 사례 중 학업·진로 문제를 청소년 상태별로 나눈 전국 단위 집계표를 제목·구분·X축·Y축·값 형태의 차트용 행으로 담는다. 상담기관 실무자나 정책 분석가가 '학교 밖 청소년과 재학생 사이에 진로 혼란·학업 스트레스 상담 비중이 어떻게 다른가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·구분명 같은 이름 매핑이나 같은 기관(성평등가족부) 청소년 상담 통계끼리만 맞대어 볼 수 있다.
limits: 전국·비공간 집계라 시도·시군구별 비교나 센터 단위 분석에는 쓸 수 없다. 표가 축 내용과 값(chtVl)으로 풀어진 형태여서 X·Y축 순번으로 다시 짜 맞춰야 원래 표가 된다.
