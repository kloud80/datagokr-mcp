description_portal: 연령별 노후긴급자금 대부금 원금수취내역  데이터입니다. 데이터는 신청연령, 상환일자, 상환원금,  대부용도, 대부금액으로 구성되어 있습니다. 노후긴급자금대부는 만60세 이상 국민연금수급자 대상으로 하고 있으며, 대부용도는 주택 전월세 보증금, 의료비, 배우자 장제비, 재해 복구비 총 4가지 용도로 신청가능합니다. 대부금액은 연간 연금수령액의 2배(최고 1,000만원) 이내에서 실제 사용한 비용에 대해 신청이 가능하며, 대부금상환은 매월 연금지급일에 자동이체나 연금급여 원천공제로 상환하고, 가상계좌를 통해 수시 상환도 가능합니다.
