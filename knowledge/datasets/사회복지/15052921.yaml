description_portal: '공무원연금공단에서 운영하는 융자사업의 대부종류별 대출 추이를 제공하는 데이터입니다. 학자금대부, 일반대부, 금융기관 알선대출을 각 세부적인 대부유형으로 구분하여 제공합니다.학자금대부(대여학자금, 연금대부학자금), 일반대부(연금대부, 생활안정자금, 의료비, 경조비, 재해복구비, 차량구입비, 자립자원자금, 전세자금,주택조합대부, 주택매입신축), 은행자금(봉급자신용대출, 공무원생활지원급부해외주재공무원대출, 연금수급자융자알선, 주택자금융자알선)으로 구분합니다.1. "90년부터 생활안정자금대부 폐지 2. "99년부터 연금대부학자금, 의료비, 경조비, 재해복구비, 자립지원자금대부, 전세자금 폐지 3. 공무원연금대부 : "01년 5월부터 공무원 생활안정에 필요한 자금을 지원하기 위해 공무원연금기금을 재원으로 대부 실시 4. "99년 이후의 "봉급자신용대출"란의 실적은 "공무원가계자금, 생활안정자금,단기재직자 융자알선" 실적임("09년부터는 연금수급자 융자알선실적 포함) 5. 주택자금융자알선 : "98년까지는 해당금융기관에 대출조건부 정기예금을 예치하여 운영한 것이고, "9년 이후에는 기금을 예치하지 않은 공무원주택담보융자알선임("04.11월 폐지)'
