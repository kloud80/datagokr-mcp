summary_user: 경기도 이천시에 있는 장애인 거주시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 1.6KB)로, 시설유형·시설명·도로명주소·전화번호·설치신고일과 입소자·종사자의 정원 및 현원을 담는다. 이천시 장애인 가족이 입소 가능한 시설과 연락처를 찾거나, 분석가가 시설별 정원 대비 현원으로 과밀 여부와 인력 충원 수준을 따져볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 도로명주소(소재지도로명주소)를 맞춰 잇거나, 같은 이천시가 낸 다른 복지시설 목록과 나란히 비교한다.
description_portal: 경기도 이천시 내 장애인 거주시설의 운영 현황과 기본 정보를 제공하는 데이터입니다. 주요 항목은 시설유형, 시설명, 도로명주소, 전화번호, 설치신고일, 입소자 정원 및 현원, 종사자 정원 및 현원, 기준일자 등으로 구성되어 있습니다. 본 데이터는 지역 내 복지시설의 분포와 수용 능력, 인력 운영 실태를 파악하는 데 활용되며, 시설 과밀 여부 판단, 인력 적정성 검토, 신규 설치 수요 예측 등 복지정책 수립의 기초자료로 사용됩니다. 또한 정원·현원 정보는 운영 안정성 평가와 서비스 질 개선에 도움이 되며, 설치일자와 인력 현황은 행정 점검 및 재정 지원 기준으로도 활용됩니다.
