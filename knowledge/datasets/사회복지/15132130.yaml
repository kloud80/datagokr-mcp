summary_user: 아이돌봄 통합지원 설문조사의 응답을 문항번호·설문연월·답변자관리번호 단위로 담은 건별 응답 데이터로, 선택한 보기와 기타 기재 내용, 서술형 답변, 등록·수정일자를 포함한다(전국 범위·비공간). 아이돌봄 서비스 운영자나 정책 분석가가 "이용자는 서비스에 얼마나 만족하고, 어떤 불편을 적어 냈는가"를 문항별로 살펴보는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없으며, 같은 데이터 안에서 답변자관리번호(answrMngNo)로 한 응답자의 문항별 답변을 묶고 설문연월로 회차를 구분하는 정도로만 연결한다.
limits: 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키가 확인되지 않아 지역·기관·이용자 속성과 바로 결합할 수 없고, 연결하려면 이름·코드 매핑이나 같은 기관 코드를 따로 써야 한다. 범위는 전국·비공간이라 지역별 만족도 비교에는 쓸 수 없다. 개발계정 호출은 일 10,000회로 제한된다.
