description_portal: 제주특별자치도 제주시에서 지원하는 지역 공동체 일자리 사업 현황 데이터는, 제주시가 특정 시기별로 추진하는 지역 공동체 기반 일자리 사업을 사업 단위로 정리해 제공하는 자료입니다.이 데이터는 시기, 사업유형, 사업명, 세부사업명, 부서, 사업장, 배치인원, 근무기간, 데이터기준일자로 구분됩니다.사업이 진행되는 시기와 사업을 성격에 따라 분류한 사업유형, 주민들이 실제로 접하게 되는 사업명 및 보다 구체적인 실행 단위인 세부사업명이 함께 포함되어 있어, 언제 어떤 형태의 일자리 사업이 어떤 내용으로 운영되는지를 구조적으로 파악할 수 있습니다. 또한 사업을 담당하는 부서 정보와 실제 근무·배치가 이루어지는 사업장이 제공되므로, 사업별 담당 주체와 수행 장소를 확인하거나 문의·연계에 활용할 수 있습니다.
