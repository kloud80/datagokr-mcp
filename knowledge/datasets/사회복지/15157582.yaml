summary_user: 1365자원봉사포털에 등록된 자원봉사 프로그램을 건별로 담으며, 검색어·기간·지역·분야별 목록과 프로그램별 상세(봉사기간·시간, 모집기간·상태, 성인·청소년 가능 여부, 등록기관, 봉사장소)를 전국 범위로 조회한다. 봉사 희망자나 청소년·노인 지원 기관이 '우리 시군구에서 지금 모집 중이고 청소년이 참여할 수 있는 봉사활동은 무엇인가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 시도·시군구 코드(sidoCd, gugunCd)를 이름·코드 매핑해 시군구 단위 인구·시설 통계와 잇고, 상세 조회는 목록에서 받은 프로그램등록번호를 넘겨 연결한다.
description_portal: '- 행정안전부에서 운영 및 관리하고 한국중앙자원봉사센터, 지방자치단체 자원봉사센터에서 자원봉사 일감 등록, 봉사 실적 등록 등을 수행하는 1365자원봉사시스템에서 관리하는 데이터로 1365자원봉사포털에서 추출하여 데이터를 제공합니다.- 해당 데이터는 자원봉사를 참여정보를 조회하기 위한 서비스로서, 검색어를 이용한 통합, 기간별, 지역별, 분야별 참여정보를 조회할 수 있으며, 프로그램별 자원봉사 참여 상세정보를 포함하고 있습니다.- 해당 데이터는 1365자원봉사포털에 등록된 봉사활동을 기준으로 하며, 자원봉사참여에 관한 상세정보를 검색하기 위한 조회조건프로그램등록번호을 입력받아 요청에 해당하는 자원봉사참여상세정보프로그램등록번호, 봉사제목, 모집상태, 봉사시작일자, 봉사종료일자, 봉사시작시간, 봉사종료시간, 모집시작일, 모집종료일, 모집인원, 활동요일, 신청인원수, 봉사분야, 성인가능여부, 청소년가능여부, 단체가능여부, 모집기관, 등록기관, 봉사장소, 담당자명, 전화번호, FAX번호, 담당자 주소, 이메일, 내용를 조회하는 기능을 포함합니다.'
