description_portal: 전국 시도별 및 업종별 누적 자활근로 참여자 수 데이터를 제공합니다. 이 자료는 공산품 생산, 농산물 생산·가공, 배송, 사회서비스, 세탁, 유통·판매, 음식점, 청소, 환경정비 등 20여 개 업종의 시도별 자활근로 참여 현황을 상세히 담고 있습니다.본 통계는 지역별 자활사업의 산업적 특성과 참여자 분포를 명확히 보여주며, 각 지역 및 업종의 특성을 고려한 맞춤형 자활정책 수립 및 효율적인 자원 배분을 위한 귀중한 기초 자료가 될 것입니다. 이를 통해 지역사회 자활사업의 효과성을 높이고, 참여자들의 자립을 더욱 효과적으로 지원할 수 있을 것으로 기대됩니다.
