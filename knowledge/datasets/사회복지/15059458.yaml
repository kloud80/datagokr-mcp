summary_user: 경기도 권역 장애인 구강진료센터에서 진료받은 환자 수를 기준년도·기관·연령대별로 집계해 연간 합계와 1~4분기 환자 수로 담은 통계다. 장애인 치과 정책 담당자나 연구자가 "어느 연령층 장애인 환자가 어느 분기에 많이 몰리는가"를 보고 진료 인력·예산 배분을 판단하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(INST_NM)·기준년도 같은 이름 매칭으로만 연결한다.
description_portal: 경기장애인구강진료센터 연령별 운영현황 데이터는 경기도 권역 내 장애인 구강진료센터에서 진료받은 환자를 연령대별·분기별로 집계한 보건·복지 통계자료입니다. 주요 항목에는 기준년도, 기관명, 연령구분명, 연간 환자 합계, 분기별 환자수가 포함됩니다. 데이터는 매년 12월 말 기준으로 작성되며, 연령대별 치과 진료 수요 변화를 파악할 수 있습니다. 이를 통해 아동·청소년·성인·노년층 등 생애주기별 구강건강 관리 실태를 비교할 수 있으며, 장애인 맞춤형 치과 진료 정책 수립 및 지역 보건의료 서비스 개선에 중요한 기초자료로 활용됩니다. 또한 분기별 추이를 제공하므로 계절별 환자 이용 패턴, 특정 연령층의 집중 진료 시기 등을 분석할 수 있습니다. 해당 자료는 경기도장애인복지종합지원센터(누림센터)와 공공의료과가 공동으로 제공하며, 공공치의료 연구, 예산 배분, 복지정책 수립 등 다양한 활용 방안을 가집니다.
