description_portal: 자동차사고피해가족지원사업은 자동차사고로 인해 뜻밖에 일어난 불행한 일로 인해 생명이나 신체, 재산, 명예 따위에 손해를 입은 피해가족을 지지하고 도와주는 사업을 말합니다.등록 정보는 자동차사고 피해가족 지원사업 대상자 장학금 지급 관련 학교 정보를 포함하고 있으며,세부 데이터로는 학교명, 시도 및 시군구명, 우편번호, 주소 등을 제공하고 있습니다.다만,  자동차사고 피해가족 지원사업은 2025년 1월 1일부터 자동차손해배상보장법에 따라 자동차손해배상진흥원으로 이관되었음을 활용 및 문의에 참고하여 주시기 바랍니다.
