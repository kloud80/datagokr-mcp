description_portal: 인천광역시_정보통신보조기기 보급현황 데이터는 과학기술정보통신부가 주관하는 정보격차 해소사업의 일환으로,  인천광역시  내 장애인을 대상으로 보급된 정보통신 보조기기 현황을 제공합니다 . 주요 포함 내용으로 정보통신보조기기의 연도별 보조기기 목표수량, 보급실적, 목표 달성률 정보가 있습니다.  지원 대상자는 시각, 청각, 지체, 언어 등 다양한 장애를 가지고 있는 장애인으로 정보통신 접근에 어려움을 겪는 이들에게 제품 가격의 80%까지 지원하고 있으며, 기초생활수급자 및 차상위계층 장애인은 추가 지원을 받을 수 있습니다.
