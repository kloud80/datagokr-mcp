summary_user: 전국 국제결혼중개업체를 업체 한 곳당 한 건으로 담으며, 업체명·대표자·회사형태, 도로명·지번 주소와 위도·경도, 연락처, 결혼중개업 등록일자·사업종료일자, 처분내용·처분일자, 통번역 제공 여부, 운영 여부를 포함한다. 국제결혼을 준비하는 사람이 상담하려는 중개업체가 정식 등록돼 지금 운영 중인지, 행정처분을 받은 적이 있는지 확인하는 데 쓰고, 분석가는 시도·시군구별 업체 분포와 운영 현황을 볼 때 쓴다. 사업자등록번호(brno)를 키로 다른 사업자 데이터와 잇고, 시도·시군구명과 좌표로 지역 통계나 다른 시설 위치 데이터와 겹쳐 본다.
limits: API는 포털에서 활용신청한 뒤 serviceKey로 호출하며, 개발계정은 하루 10,000회로 제한된다. 주소·좌표는 업체 개별 단위로 제공되고 지역 집계값은 따로 없어, 지역별 현황은 직접 집계해야 한다.
