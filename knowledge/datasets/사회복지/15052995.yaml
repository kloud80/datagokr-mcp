description_portal: 공무원연금공단에서 관리하는 비용징수 추이 데이터로, 1983년부터 기준년도까지 제공하고 있습니다.일반기여금, 소급기여금, 합산반납금, 연계반납금, 연금부담금, 정부보전금, 재해보상부담금, 퇴직연금이체금, 기금보전금, 환수금, 잡수익 등 으로 구분되어 있습니다.1. 2002년도부터 재해보상특별회계의 신설로 인해 재해보상부담금 징수사항은 연금회계에서 분리됨2. 2012년도부터 퇴직수당특별회계의 신설로 인해 퇴직수당부담금 징수사항은 연금회계에서 분리됨3. 잡수익 등에는 환수금을 제외한 사업외수익이 포함되어 있음4. 2015년도부터 신설된 기금보전금은 공무원연금법 제21조 제2항 및 제71조 제8항에 따라 공무원연금기금으로부터의 전입금을 보전금에 충당한 금액임
