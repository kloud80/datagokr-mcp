summary_user: 제주특별자치도에 소재한 소비자생활협동조합을 조합 한 곳당 한 행으로 담은 목록 파일로, 인가일·인가번호·법인등록번호·업종·조합명·생협종류·전화번호·주소를 담는다(CSV 약 1.7KB 규모의 소규모 명단). 제주 지역 주민이나 사회적경제 분석가가 '우리 지역에 어떤 생협이 어디에 있고 어떤 업종인가'를 확인하는 데 쓴다. 법인등록번호(corp_rgst_no)를 키로 법인·기업 정보나 다른 사회적경제 기업 목록(사회적기업·협동조합 설립 현황 등)과 이어 쓰고, 주소로 행정구역 단위 집계에 붙인다.
description_portal: '제주특별자치도 내에 소재하고 있는 소비자협동조합에 대한 데이터를 제공합니다.항목: 업종, 조합명, 생협종류, 전화번호, 주소 등*소비자협동조합: 소비자들이 주체가 되어, 스스로 소비생활을 개선하기 위해 만든 협동조합*「소비자생활협동조합법」: 상부상조의 정신을 바탕으로 한 소비자들의 상호 간 협동에 기반하여 물품ㆍ용역ㆍ시설 등의 공동구매와 이용, 판매를 자주ㆍ자립ㆍ자치적으로 수행하는 생활협동조합활동을 촉진함으로써 조합원의 소비생활 향상과 국민의 복지 및 생활문화 향상에 이바지함을 목적으로 함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1144'
