description_portal: 협동조합 설립 절차는 5인 이상의 조합원 자격을 가진 자가 발기인이 되어 정관을 작성하고 창립총회의 의결을 거친 후 주 사무소의 소재지에서 협동조합을 담당하는 기관에 신고하여야 합니다. 한편 사회적협동조합은 5인 이상의 발기인(조합원)이 모여 중앙부처의 장에게 인가 및 설립등기를 거쳐 설립할 수 있습니다. 협동조합은 기업의 일종이지만, 일반 기업보다는 자본이나 기반이 취약한 경제적 약자가 결성한다는 점이 다르다. 사기업과 달리 제1의 목적이 이윤추구가 아닌 조합원 상호협동을 통한 편의증대에 있다. 따라서 사기업과는 다른 몇 가지 원칙이 있다. 먼저 협동조합에 가입하기 위해서는 출자금을 내야 한다. 출자금은 일종의 자본금처럼 쓰이는데, 주식과 달리 출자금은 천 원을 내나 백만 원을 내나 의결권은 동일하다. 다만 대부분의 경우 최소 출자금이 정관에 기재되어 있다. 최소출자금은 조합의 성격과 규모에 따라 천차만별이고 최소출자금 이상 출자하면 조합원간 출자금 액수와 상관없이 동일한 의결권을 갖는다. 경우에 따라서는 1인당 출자가능한 액수의 상한선이 있는 경우도 많다. 여수시 (사회적)협동조합 (협동조합명, 주요 생산품 및 서비스 현황  등)자료를 제공합니다.
