description_portal: 교육부 산하 준정부기관인 한국장학재단에서 실시된 직원 육아휴직 제도와 관련된 정보를 종합하여 시기별로 누적된 육아휴직 현황 자료를 데이터 형태로 제공합니다.육아휴직 제도는 8세 이하 또는 초등학교 2학년 이하의 자녀(입양한 자녀를 포함한다)가 있는 남녀 근로자가 양육을 하기 위한 경우이거나 여성 직원이 임식 또는 출산하게 된 경우 사용하는 휴직제도입니다.재단은 직전년도 1일 이상 육아휴직을 사용한 직원 현황을 데이터로 제공하고 있으며, 주요 항목으로는 휴직 사용자의 직급 및 직위, 휴직사유, 평균 휴직기간(일) 등의  내용이 포함되어 있습니다.이를 통해 재단 직원 육아휴직 사용 현황을 한눈에 파악할 수 있으며, 재단의 육아휴직 제도에 대해 이해도를 높이는 데 유용한 자료로 활용될 수 있습니다.
