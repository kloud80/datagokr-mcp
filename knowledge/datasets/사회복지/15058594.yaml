summary_user: 경기도교육청과 교육지원청 소속 특수교육 담당 전문직 인원을 연도(STD_YY)와 기관 구분별로 집계한 시도 단위 통계로, 장학관·장학사의 전체 인원, 전담·겸임 인원, 특수교육 자격 소지·미소지 인원과 인턴 파견교사의 전담·겸임 현황을 담는다. 교육정책 분석가나 특수교육 관계자가 '경기도 교육행정기관에서 특수교육 자격을 갖춘 전담 장학사 비율이 해마다 어떻게 변했는가'처럼 인력 규모와 전문성을 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 기관 구분명을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시도교육청 및 교육지원청 소속 특수교육 담당 전문직 인력 현황을 연도별로 집계한 자료입니다. 항목에는 장학관 및 장학사의 전체 인원, 특수교육 전담 여부, 겸임 여부, 특수교육 자격 소지 및 미소지 인원 수 등이 포함되며, 인턴 파견교사 현황(전담 및 겸임 포함)도 함께 제공됩니다. 본 자료는 특수교육 관련 전문직 인력의 규모와 자격 분포를 파악하고, 교육행정기관의 특수교육 지원 역량을 분석하는 데 활용될 수 있습니다. 또한 자격 소지 여부에 따른 인력 배치 특성, 전담 및 겸임 인력의 비율, 기관별 전문성 확보 현황 등을 평가하여 특수교육 전문 인력 양성 및 배치 정책 수립의 기초자료로 활용됩니다.
