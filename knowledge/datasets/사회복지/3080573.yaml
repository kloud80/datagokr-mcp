summary_user: 경상남도 내 아이돌봄서비스 제공기관을 기관 1곳당 1행으로 담은 목록으로, 시군명·기관명·전화번호·도로명/지번 주소·위도·경도·행정동·법정동 정보를 포함하며 포털 설명상 2023년 12월 기준 총 20건이다. 아이돌봄서비스를 신청하려는 보호자가 우리 시군의 제공기관 연락처와 위치를 찾거나, 분석가가 시군별 제공기관 분포를 지도에 표시하는 데 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 인구·보육 통계나 다른 사회복지시설 목록과 이어 쓰고, 위도·경도로 공간 결합도 한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 아이돌봄서비스 제공기관 현황 데이터는 2023년 12월 기준 경상남도 내 아이돌봄서비스를 제공하고 있는 기관에 대한 정보입니다. 아동복지, 아이돌봄 등의 정보를 분석할 때 위치 및 현황을 확인할 수 있습니다. (데이터 구성 및 세부항목) 경상남도 아이돌봄서비스 제공기관 현황데이터는 시군명, 기관명, 전화번호, 위도, 경도, 도로명 주소, 지번주소, 우편번호, 행정동 정보, 법정동 정보로 구성됩니다. 총 20건입니다. 미집계 데이터는 공란 처리하였습니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다.
