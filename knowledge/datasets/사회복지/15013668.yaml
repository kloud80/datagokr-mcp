summary_user: 김해시 안의 노인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설유형·시설명·도로명주소·위도·경도·정원·전화번호·대표자를 담는다. 김해시 주민이나 보호자가 '우리 동네 가까운 경로당이나 주간보호 시설은 어디이고 정원은 몇 명인가'를 찾거나, 분석가가 시내 노인시설의 위치 분포를 지도로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 잇고, 건강보험 장기요양기관 목록이나 사회복지시설 시설코드와는 이름 대조로 연결해야 한다.
description_portal: '경상남도 김해시 노인복지시설 현황에 대한 데이터로 시설유형, 시설명, 도로명주소, 정원, 전화번호, 팩스(fax), 대표자의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 8월 20일로, 연간 주기로 관리하고 있습니다.* 데이터 미집계 및 개인정보 보호 등의 사유로 다수의 공란이 있습니다.데이터 담당부서 : 노인여가복지시설 소관 부서(김해시 노인복지과(055-330-0953), 노인의료복지시설, 재가노인복지시설 소관 부서(김해시 노인복지과 055-330-8764)[데이터 변동 안내]1. 신규 데이터 추가2. 기존 데이터 수정3. 데이터 설명 수정4. 데이터 키워드 추가5. 데이터 기준일 변경'
