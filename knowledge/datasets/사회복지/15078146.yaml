summary_user: 아이돌보미 교육기관을 지정할 때 적용하는 기준을 기준연도별로 구분(시설기준 등)·상세구분(기본시설 등)·기준 내용 단위로 담은 전국 범위의 기준 정보 API다. 아이돌보미 교육기관을 운영하거나 지정 신청을 준비하는 기관이 '우리 기관의 시설이 지정 기준을 충족하는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 같은 기관(한국건강가정진흥원)의 다른 아이돌봄 데이터와는 기준연도나 구분명으로만 맞춰 이어 쓴다.
description_portal: 아이돌보미 교육기관 지정 기준 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연도, 지정기준구분명(시설기준), 지정기준상세구분명(기본시설), 지정기준 내용, 데이터기준 일자의 정보를 확인할 수 있습니다.각 기관이 일정 기준을 충족하는지를 판단하는 데 필수적인 자료로 쓰일 수 있습니다. 시설 기준 등 세부 항목이 명시되어 있어 객관적인 지정 평가가 가능해집니다. 이를 기반으로 교육의 질을 보장하고 교육기관의 운영 수준을 표준화하는 데 기여할 수 있습니다. 교육환경 개선과 행정 신뢰도 확보에 활용될 수 있습니다.
