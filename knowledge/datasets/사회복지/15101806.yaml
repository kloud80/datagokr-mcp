description_portal: 해당 데이터는 전라남도 강진군 내 공공기관의 장애인 접근성·편의시설 실태를 종합적으로 나타낸 자료입니다. 기관별로 장애인이동콜택시 이용 가능 여부, 전용주차장 보유 여부, 주출입구 접근 경로(경사로)의 존재 여부, 엘리베이터 설치 유무, 장애인화장실 제공 여부 등 이동 약자를 위한 핵심 시설 정보를 포함하고 있습니다. 또한 유도블록·점자블록 설치 현황, 관리기관명, 도로명 주소, 연락처, 데이터 기준일자까지 제공하여 각 기관의 편의시설 수준을 비교·분석할 수 있습니다. 이 데이터는 장애인의 시설 접근성 향상 정책 수립, 지역 편의시설 모니터링, 이용자 안내 자료 제작 등 다양한 활용이 가능한 기초 정보로서 의미를 가집니다.
