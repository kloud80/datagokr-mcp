summary_user: 전라남도 강진군 내 공공기관별로 장애인이동콜택시 이용 가능 여부, 전용주차장·주출입구 접근로·경사구간·엘리베이터·장애인화장실·유도 및 점자블록 설치 여부를 한 행씩 담은 기관 단위 현황 파일(csv, 약 2KB)이다. 휠체어 이용자나 보호자가 강진군의 어느 공공기관에 장애인 화장실과 엘리베이터가 있는지 미리 확인하거나, 분석가가 군내 공공기관의 편의시설 수준을 비교하는 데 쓴다. 건물관리번호·PNU 같은 전역 조인 키가 없어 다른 데이터와는 기관명이나 관리기관 도로명주소(관리기관도로명주소)를 맞춰 연결해야 한다.
limits: 대상이 강진군 한 곳의 공공기관으로 한정되어 다른 시군구나 민간시설의 편의시설은 알 수 없다. 공통 조인 키가 없으므로 건물 원장 등과 결합하려면 이름·주소 매칭이 필요하다.
