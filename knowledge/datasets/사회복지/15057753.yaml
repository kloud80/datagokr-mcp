summary_user: 경기도 내 특수교육지원센터에 배치된 장애영아 수를 기준연도(STD_YY)와 장애영역(건강장애·발달지체·의사소통장애 등)별로 집계한 통계로, 전체·남·여 인원과 1세 미만·1세·2세 연령별 인원을 담는다. 교육·복지 담당자나 분석가가 '경기도에서 발달지체로 조기 특수교육 지원을 받는 2세 미만 영아가 해마다 어떻게 변하는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도와 장애영역 이름을 맞춰 연결해야 하며, 시군 등 행정구역 코드도 없다.
description_portal: 특수교육지원센터 배치 장애영아 집계현황 데이터는 경기도 내 특수교육지원센터에 배치된 장애영아 수를 장애영역별(건강장애, 발달지체, 의사소통장애, 정서행동장애, 학습장애 등)과 나이별로 집계한 교육·복지 통계자료입니다. 매년 6월 말 기준으로 제공되며, 전체 영아 수, 성별 구분, 1세 미만, 1세, 2세 영아 수 등을 포함합니다.이 자료는 조기 장애 발견 및 개입을 위한 중요한 기초자료로 활용될 수 있으며, 영아기 발달 지원 정책, 특수교육 자원 배치, 조기 재활 서비스 제공 계획에 도움을 줍니다. 특히 장애유형별 분류를 통해 특정 장애군의 발생 경향을 분석할 수 있고, 나이별·성별 분포 파악을 통해 맞춤형 특수교육 및 복지정책 수립 근거를 마련할 수 있습니다. 교육부 특수교육통계와 누림센터에서 관리하는 데이터로, 지역별 조기특수교육 서비스의 형평성과 접근성을 평가하는 데 활용 가치가 높습니다.
