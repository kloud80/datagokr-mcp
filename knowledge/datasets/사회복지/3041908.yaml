summary_user: 광주광역시에 설치된 노인복지관을 시설 한 곳당 한 행으로 담은 현황 파일로, 구분(시립·구립)·시설명·관장·위탁법인명·설치일자·도로명/지번 주소·전화번호·1일 평균이용인원·운영시간을 담는다. 어르신이나 가족이 집 근처 노인복지관의 위치·연락처·운영시간을 찾거나, 분석가가 복지관별 1일 평균이용인원을 비교해 지역별 이용 수요를 살피는 데 쓴다. 전역 조인 키는 없어 다른 노인복지시설·장기요양기관 자료와는 시설명이나 주소를 맞춰 이어야 하며, 주소를 시군구로 묶으면 지역 통계와 함께 볼 수 있다.
description_portal: 광주광역시 노인복지관 현황노인의 교양ㆍ취미생활 및 사회참여활동 등에 대한 각종 정보와 서비스를 제공하고, 건강증진 및 질병예방과 소득보장ㆍ재가복지, 그 밖에 노인의 복지증진에 필요한 서비스를 제공함을 목적으로 하는 시설광주광역시 에 설치된 노인복지관 현황 정보로, 시설명, 관장, 위탁법인명 ,  설치일자, 주소, 전화번호, 1일 평균이용인원 등 노인복지관 운영 현황 등의 항목을 제공함광주광역시에는 3개소의 시립 노인복지관(광주공원노인복지관, 빛고을노인건강타운, 효령노인복지타운), 7개소의 구립 노인복지관(동구 1, 서구 2, 남구 1, 북구 1, 광산구2)이 설치되어 있음
