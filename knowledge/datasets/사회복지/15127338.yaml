description_portal: '서울특별시 동대문구 노인복지시설(요양원,데이케어센터,방문재가,방문요양,복지용구) 현황 자료입니다. 시설명, 급여 종류 명, 주소, 위도, 경도, 전화번호 등을 포함하고 있습니다.1. 요양원 (노인요양시설)어르신이 시설에 입소하여 생활하면서 돌봄을 받는 서비스식사, 목욕, 간호, 재활, 일상생활 지원 등을 24시간 제공가족이 직접 돌보기 어려운 중증 어르신이 주로 이용2. 데이케어센터 (주야간보호센터)낮 동안 시설에 와서 돌봄을 받고 저녁에 집으로 돌아가는 서비스식사 제공, 건강관리, 인지활동, 여가 프로그램 등 제공보호자가 낮에 일을 하는 경우 많이 이용3. 방문재가어르신이 집에 거주하면서 필요한 돌봄 서비스를 받는 재가서비스의 큰 개념방문요양, 방문목욕, 방문간호 등이 포함됨시설 입소 없이 집에서 생활하면서 돌봄을 받는 형태4. 방문요양요양보호사가 어르신 집에 방문하여 돌봄을 제공하는 서비스신체활동 도움 (세면, 식사, 이동 등)가사 지원 (청소, 세탁, 식사 준비)정서 지원 및 말벗5. 복지용구어르신의 생활을 돕는 보조용품을 대여 또는 판매하는 사업예: 전동침대, 휠체어, 보행기, 욕창방지매트 등장기요양보험에서 일정 금액 지원'
