description_portal: 이 자료는 전북특별자치도 내 어린이 대상 안전체험교육기관의 설치 및 운영 현황을 종합한 데이터로, 체험관명, 설립 및 운영 주체, 운영방식, 실제 운영기관, 위치, 개장일, 면적, 운영인력, 휴관일, 입장료, 홈페이지 및 문의 연락처 정보를 포함합니다. 총 6개 기관이 수록되어 있으며, 대부분 공공기관이 설립·운영하고 있으며, 일부는 민간 위탁 방식으로 운영됩니다. 예를 들어 ‘전주 어린이교통공원’은 전주시에서 설립하고 (재)한국어린이안전재단이 위탁 운영하였습니다. 이 데이터는 기관별 규모(부지면적), 운영인력 수, 정기 휴관일 등 실무적 운영 정보뿐만 아니라, 입장료 유무나 홈페이지 등 민원 편의 정보도 함께 제공하여, 지역 내 어린이 안전 교육 인프라 현황을 종합적으로 파악할 수 있게 합니다. 이는 어린이 안전교육 활성화, 체험형 교육 정책 수립, 인프라 확충의 기초자료로 활용될 수 있습니다.
