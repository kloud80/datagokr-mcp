summary_user: 관악구에 등록된 장애인 수를 장애유형별로 집계해 성별(남성·여성)과 심한 장애·심하지 않은 장애 구분별 인원을 담은 743바이트 분량의 소규모 CSV 집계표이다. 구청·복지 담당자나 분석가가 '관악구에서 어떤 장애유형의 심한 장애 등록자가 가장 많고 성비는 어떤가'처럼 지역 복지 대상자 규모와 중증도 분포를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형 이름을 맞추거나 같은 관악구 자료끼리 이어 써야 한다.
description_portal: 본 데이터는 관악구 장애인 등록 현황을 나타낸 자료입니다.본 데이터는 장애유형, 성별 구분(남성·여성), 심한 장애 여부, 심하지 않은 장애 여부, 그리고 데이터 기준일자 등의 항목을 포함합니다. 각 장애유형별 인원 수를 세부적으로 파악할 수 있어 행정기관이 장애인 복지정책을 수립하거나, 서비스 대상자 규모를 산정하고 예산을 배분하는 데 활용됩니다. 또한 장애유형별 성비·중증도 분포를 비교하여 지역 맞춤형 지원 정책 개발, 복지시설 수요예측, 돌봄 인력 배치 등 실무적 의사결정에 참고자료로 사용될 수 있습니다.
