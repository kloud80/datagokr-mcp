description_portal: 이 데이터는 고령자친화기업으로 지정된 기업 현황 정보를 담고 있습니다. 한국노인인력개발원에서 지정·관리하는 기업의 지정번호, 기업명, 대표자명, 업종, 사업내용, 소재지 등의 정보를 제공합니다. 고령자친화기업은 고령 근로자의 고용 촉진과 안정적 일자리를 창출하기 위해 일정 요건을 충족한 기업에 부여되는 제도입니다. 본 데이터는 지정기업별 기본 현황과 함께, 제조업·서비스업 등 다양한 업종의 참여 현황을 확인할 수 있어 고령자 고용정책 연구, 일자리 창출 성과 분석, 기업별 사회적 책임 이행 평가 등에 활용될 수 있습니다. 또한 정책적 차원에서 고령자 친화형 산업 생태계 조성과 민간부문 고용 확대를 위한 기초자료로도 가치가 있습니다.
