summary_user: 한국노인인력개발원이 지정한 고령자친화기업을 기업 한 곳당 한 행으로 담은 파일로, 지정번호·기업명·대표자명·업종·사업내용·소재지·전화번호를 전국 513곳에 대해 제공한다. 구직 중인 고령자나 지원기관 담당자가 '우리 지역에 고령자친화기업으로 지정된 곳은 어디이고 어떤 업종인가'를 찾을 때 쓰고, 분석가는 업종별 참여 분포를 볼 때 쓴다. 소재지(주소)가 유일한 조인 키로, 주소를 시군구·시도 단위로 정리해 지역 통계나 다른 노인복지·고령친화 시설 데이터와 지역 기준으로 이어 쓴다.
