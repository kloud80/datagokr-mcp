description_portal: 서울특별시 서초구 보건소 유축기 보유현황으로 대여기관, 제조사, 품목명, 품목상태 항목에 대한 데이터를 제공합니다.서초구 내 보건소, 보건지소, 모자건강센터에 몇 대가 있고 지금 빌릴 수 있는지를 알면, 헛걸음을 줄이고 필요한 시기에 바로 이용할 수 있습니다.개인이 유축기를 구매·임대하는 비용을 줄여 저소득·취약가정의 모유수유 지속을 도움으로써, 비용 부담 완화를 돕고 있습니다.조산·입원, 유두통, 젖몸살, 직장 복귀 등으로 직접수유가 어려운 경우 유축·보관이 가능해져 수유를 이어갈 수 있습니다.지역·소득에 따른 정보/자원 격차를 줄여 “필요한 사람에게 필요한 지원”이 가도록 돕고 있습니다.대여 실적과 모유수유 교육·상담, 산후관리 서비스와 연계해 모유수유 지원사업의 효과(이용률, 재대여율, 민원 감소 등)를 지속해 나갈수 있을것으로 보고 있습니다.기기별 사용 이력, 소모품 교체, 소독·점검 주기 등을 체계화해 감염관리및 품질관리를 지속해 나갈수 있도록 하겠습니다.
