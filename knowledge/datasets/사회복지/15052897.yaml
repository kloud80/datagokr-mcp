summary_user: 공무원연금기금의 연도별 기금 증가 내역을 연도(구분) 단위 집계로 담으며, 공공금융·투자유가증권·지불준비금 등 운용수익 항목, 기금보전금, 순이익, 연금회계 결산상잉여금·적립금, 기금총액을 포함하는 작은 CSV 파일(3,795바이트)이다. 연구자나 분석가가 "공무원연금기금 총액이 해마다 얼마나 늘었고, 그 증가분이 운용수익·결산잉여금·적립금 중 어디서 왔는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 데이터와는 연도를 기준으로 맞춰 쓰며, 사학·군인·국민연금 기금 운용 현황과 연도별로 나란히 비교하는 정도로 이어 쓴다.
limits: 전국 단위 비공간 집계라 지역·종목·위탁운용사별 내역은 없고, 다른 데이터와 직접 결합할 공통 키도 없다. 포털 설명에 따르면 전기손익수정이익·기타포괄손익누계액 등은 2011년 이후에만 별도 분리돼 있어, 그 이전 연도와 수익계·비용계를 비교할 때 기준 차이에 주의해야 한다.
