description_portal: '공무원연금기금 연도별 연금기금 증가 데이터(공공금융,투자유가증권,연금수입,지불준비금,기금보전금,순이익,결산상잉여금,적립금 등)입니다.기금총액 : 전년도 기금총액 + 기금회계순이익 + 결산잉여금 + 적립금공공금융 : 재정자금, 공공자금, 국민투자기금, 주택도시기금 등 공공목적에의 예탁금투자유가증권 : 공사채, 주식관련상품으로 기금증식을 목적으로 한 투자수익지불준비금 등 : 1년미만 단기금융상품 운용수익과 사업외수익 등을 포함적립금 : 당해년도 연금회계 결산잉여금 예상액 중 당해년도 예산에 반영하여 기금에 적립한 금액기금회계 수익계(비용계)는 전기손익수정이익(손실), 기타포괄손익누계액 등이 포함됨 (2011년 이후부터 별도 분리)'
