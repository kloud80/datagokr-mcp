summary_user: 고양시에서 추진하는 노인일자리사업을 사업 단위로 정리한 파일로, 수행기관명·사업 분야·소분류·사업명·사업량(명)·사업기간·활동시간·월급여(천원)·사업내용을 담는다. 고양시에 사는 어르신이나 보호자가 '우리 동네 어느 기관에서 어떤 일자리를 몇 명 뽑고 월급여는 얼마인가'를 확인하거나, 분석가가 사업 분야별 참여 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 수행기관명을 이름으로 맞춰 노인복지관 등 노인복지시설 목록이나 시군구 단위 지역 통계와 이어 쓴다.
limits: 표준 기관 코드나 시설코드가 없어 다른 데이터와는 기관명 문자열 매칭으로만 연결되며, 표기 차이에 따른 불일치에 주의해야 한다. 범위는 고양시 한 곳이고 좌표가 없는 비공간 데이터라 위치 기반 분석에는 바로 쓰지 못한다.
