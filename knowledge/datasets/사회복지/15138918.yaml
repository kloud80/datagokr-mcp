description_portal: 본 데이터는 한국청소년활동진흥원이 전국 청소년수련시설을 대상으로 실시한 종합 안전·위생 점검 결과를 수록한 자료이다. 해당 점검은 청소년의 안전한 활동 환경을 조성하고자 정기적으로 시행되며, 각 시설의 건축, 토목, 기계, 소방, 전기, 가스, 위생 등 7개 분야에 대한 전문점검 결과와 종합평가를 포함하고 있다. 점검 대상은 시도 및 시군구별로 분류된 청소년수련관, 유스호스텔, 청소년야영장 등이며, 공공 및 민간 설치주체를 모두 포함한다.데이터는 점검연도별로 정리되어 있으며, 각 시설에 대한 지역 정보, 평가 결과, 분야별 점검 항목별 점수 및 종합등급 등이 포함된다. 이를 통해 정책 수립자와 지방자치단체는 시설 안전 수준을 비교·분석하고, 개선이 필요한 시설을 선제적으로 파악할 수 있다. 또한 청소년활동 종사자 및 학부모 등 일반 국민이 신뢰할 수 있는 시설을 선택하는 데 참고자료로 활용 가능하다.
