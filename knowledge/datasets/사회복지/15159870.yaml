description_portal: 보건복지부에서 저소득층의 자립을 지원하기 위해 운영하는 전국 자활기업들의 정기 사업보고서 제출 및 승인 현황 정보를 제공합니다. 데이터는 다산클린 등 다양한 자활기업들이 법정 의무에 따라 제출한 이력을 바탕으로 구성되어 있으며, 2023년부터 2026년 상반기까지 승인 완료된 총 5,628건의 사업보고서 관리 정보를 담고 있습니다.제공되는 주요 항목으로는 행정안전부 및 보건복지부 지침에 따라 관리되는 "자활기업명", 고유 식별 및 비식별 조치(마스킹) 처리가 반영된 "사업자등록번호", 보고서가 귀속되는 기준 연도를 뜻하는 "사업년도", 그리고 보고서 제출 주기를 식별하는 "반기구분"(상반기/하반기)까지 총 4개의 핵심 행정 컬럼으로 구성되어 있습니다.
