summary_user: 공무원연금을 취급하는 기관을 기관 1곳당 1행으로 담은 기관 명부로, 연금기관번호·상위연금기관번호·소속부처·도로명주소·전화·팩스·적용시작일자를 제공한다. 검증 호출에서 전국 범위 13건이 수신됐고 적용시작일은 2001-09-01부터 2026-02-26까지다. 공무원이나 담당자가 '우리 부처·지역의 공무원연금 업무는 어느 기관이 맡고 연락처는 무엇인가'를 확인하거나, 분석가가 연금기관 계층(상위기관 번호)을 파악하는 데 쓴다. 전역 조인 키는 확인되지 않아 다른 데이터와는 기관명·소속부처명 매핑이나 같은 기관 코드(연금기관번호·지역코드)로만 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 공무원연금을 취급하는 기관정보를 조회할 수 있는 서비스로 지역, 소속부처, 연금기관명 등을 기준으로 조회요청하여 상위연금기관번호, 연금기관적용시작일자, 연금기관건물관리번호, 연금기관구분코드, 연금기관세부새주소, 연금기관팩스번호, 연금기관번호, 연금기관 우편번호, 연금기관 수신처명, 연금기관지역번호, 연금취급기관구분코드, 연금단위기관코드, 지역코드 등을 응답정보로 제공합니다.코드 등 자세한 API 명세 내용은 첨부된 문서를 확인해주시기 바랍니다.
