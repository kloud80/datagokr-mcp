summary_user: 경상남도 내 일반협동조합을 조합 한 곳당 한 행으로 담은 건별 현황 파일로, 협동조합명·수리(인가)일·업종·조합유형·주요사업·소재지 주소를 담는다. 경남에서 어떤 업종의 협동조합이 언제 어느 지역에 설립됐는지 확인하려는 사회적경제 담당자·창업 준비자·분석가가 업종별 분포나 시군별 설립 추이를 볼 때 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 협동조합명이나 주소를 맞춰 붙여야 하며, 사회적기업·마을기업 등 같은 부문 데이터와 이을 때도 이름 매칭에 기대야 한다.
description_portal: 이 데이터셋은 경상남도 내 일반협동조합의 설립현황에 관한 정보를 포함하고 있으며, 협동조합명, 수리일(인가일), 대표연락처, 업종, 조합유형, 주요사업 내용, 소재지 주소 등의 항목으로 구성되어 있습니다. 대표연락처는 수집 가능한 경우에 한하여만 제공됩니다. 본 자료는 경남 지역에서 활동 중인 일반협동조합들의 설립 현황과 업종별 분포, 운영 유형, 지역사회 내 역할 등을 분석하는 데 활용할 수 있으며, 관련 정책 수립이나 행정 실무, 통계 분석 등 다양한 분야에서 기초자료 및 지표로 활용될 수 있습니다.
