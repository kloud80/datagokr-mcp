summary_user: 전국과 경기도의 장애수당 수급자 수, 그리고 전국 대비 경기도 수급자 비율을 기준년도별로 묶은 연 단위 집계표이며, 건별 원천이 아니라 시도 수준의 비공간 통계다. 경기도 복지 담당자나 분석가가 "전국 장애수당 수급자 가운데 경기도 비중이 해마다 어떻게 변했나"를 볼 때나 지역 간 복지 형평성을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도(STD_YY)나 시도 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 보건복지부 사회보장정보시스템을 통해 제공되는 통계로, 매년 기준으로 전국과 경기도의 장애수당 수급자 수 및 경기도의 비율을 집계한 자료입니다. 항목으로는 ‘기준년도’, ‘전국장애수당수급자수(명)’, ‘경기도장애수당수급자수(명)’, ‘전국대비경기도장애수당수급자비율(%)’이 포함되어 있으며, 경기도가 전체 수급자 중 어느 정도의 비중을 차지하는지를 수치로 파악할 수 있습니다. 이 데이터는 장애수당 수급자 수의 증가 추이, 경기도 내 수급자 비율의 변화 등을 분석하는 데 활용 가능하며, 지방정부의 복지예산 계획 수립, 중앙정부와의 정책 협력 지표 마련, 지역 간 복지 형평성 평가 등에 유용한 기초 자료로 기능합니다. 또한 전국적 장애인 복지 흐름 속에서 경기도의 상대적 수급 현황을 파악할 수 있어 장애수당 제도의 운영 현황을 종합적으로 이해하는 데 도움을 줍니다.
