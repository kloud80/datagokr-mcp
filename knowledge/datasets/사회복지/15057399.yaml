summary_user: 경기도가 정리한 중앙부처의 아동·청소년 대상 복지서비스 목록으로, 서비스 한 건마다 제목, 주목적, 관련 정보 링크, 안내, 운영주체·운영조직명, 운영 시작일을 담는 건별 안내 자료다. 아동을 키우는 가정이나 복지 담당자가 "한부모 자립이나 청소년 상담처럼 우리 아이가 받을 수 있는 중앙부처 서비스가 무엇이고 어느 부처가 운영하나"를 찾아볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 운영주체명(OPERT_MAINBD_NM) 같은 이름 매핑으로만 연결한다.
description_portal: 경기도 내의 아동 관련 중앙부처 복지서비스 현황입니다. 중앙부처에서 마련한 아동 관련 복지혜택 서비스입니다. 주목적, 관련정보, 안내 등의 정보를 제공합니다.이 데이터는 중앙부처가 제공하는 아동 및 청소년 대상 복지서비스 현황을 정리한 자료로, 각 서비스의 제목, 주목적, 관련 웹사이트 링크, 안내 정보, 운영주체명, 운영조직명, 기준년도 등의 항목으로 구성되어 있습니다. 주요 서비스에는 청소년상담, 치료재활, 한부모 자립지원, 교육정보화 지원 등 다양한 영역의 프로그램이 포함되어 있으며, 이를 통해 아동 및 청소년의 보호와 자립, 교육격차 해소를 목표로 합니다. 데이터는 각 부처의 서비스 운영현황을 비교·분석하거나 복지정책 수립, 홍보자료 제작, 정책 평가 등의 목적으로 활용할 수 있으며, 관련 웹사이트 링크를 통해 서비스 세부 내용을 직접 확인할 수 있다는 점에서 실용성이 높습니다.
