summary_user: 도로교통공단 특별교통안전교육(음주운전 등 법규위반으로 면허 정지·취소 처분을 받은 운전자 대상)의 교육 예약 정보를 교육일자·지부·교육반·강의실·강의 시간대별로 담은 전국 단위 CSV 파일(약 209KB)이다. 처분 대상 운전자가 어느 지부에서 언제 교육을 받을 수 있는지와 강의실정원·예약정원을 확인하는 데 쓰고, 기관·분석가는 지부별 교육 수요를 살피는 데 쓴다. 전역 조인 키는 없고, 지부코드나 지부명을 이름·코드로 매핑하거나 같은 기관의 다른 자료와 맞춰야 이어 쓸 수 있다.
description_portal: 본 데이터는 한국도로교통공단이 제공하는 특별교통안전교육 예약정보를 정리한 자료이다. 특별교통안전교육은 음주운전 등 법규위반으로 면허 정지·취소 처분 대상 운전자를 위한 교육이다. 데이터에는 교육과정명, 교육일시, 교육장소, 접수상태, 신청정원, 잔여좌석, 대상구분, 예약URL이 포함된다. 과정ID, 지부명, 교육구분, 문의전화 등 메타정보로 지역·과정별 조회가 가능하다. 필드와 코드값을 표준화하여 검색·연계 활용이 쉽고, CSV 등 기계판독 형식으로 제공된다. 이용자는 일정 확인과 예약에 활용하며, 기관·민간은 수요 분석과 안내 채널 운영 등 기획 근거로 쓴다.
