description_portal: 본 데이터는 부산교통공사 도시철도 역사 내 교통약자를 위한 유니버설디자인 시설 정보를 포함하고 있습니다.데이터는 역사별로 설치된 점자블록, 유도 안내선, 휠체어 리프트, 촉지도 등 교통약자 편의시설의 설치 위치 및 유형, 수량 등을 포함하며, 역사명과 호선 정보도 함께 제공됩니다. 해당 데이터는 교통약자 중심의 이동권 보장을 위한 정보제공 및 시설 개선 정책 수립에 기초자료로 활용될 수 있습니다. 또한, 민간 분야에서는 교통약자 맞춤형 길안내 앱, 공간정보 분석 및 유니버설디자인 관련 서비스 개발에 기여할 수 있는 기반 데이터입니다. 부산교통공사는 교통약자 접근성 향상을 위한 공공데이터 개방을 통해 포용적 교통환경 조성에 이바지하고자 합니다.
