summary_user: 춘천시 노인복지관을 시설 한 곳당 한 행으로 담고, 설립주체·운영방법·수탁법인·설치일·종사자수·주소·위도·경도·연락처·운영여부를 영어·중국어·일본어로 번역해 언어별로 제공하는 4KB 남짓의 소규모 CSV 파일이다. 외국인 고령자나 다문화 가족이 "춘천에서 가까운 노인복지관은 어디이고 연락처는 무엇인가"를 모국어로 확인하거나, 다국어 복지 안내 서비스를 만드는 사업자가 시설 목록을 가져올 때 쓴다. 전역 조인 키는 없어서 다른 노인복지시설 자료와는 복지관명·주소로 맞춰 잇고, 위도·경도로 지도나 주변 시설 자료에 겹쳐 쓴다.
