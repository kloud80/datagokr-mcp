summary_user: 인천광역시 계양구 안의 사회적경제기업을 기업 한 곳당 한 행으로 정리한 파일로, 기관명·유형·사업내용·인증일자·전화번호와 도로명·지번주소, 위도·경도를 담는다(csv 약 3KB의 소규모 목록). 주민이나 구직자가 '우리 동네에 어떤 사회적기업·협동조합·마을기업이 있고 무슨 일을 하나'를 확인하거나, 분석가가 계양구 사회적경제기업의 유형별 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소·좌표를 맞춰 이어야 하며, 인증번호·사업자번호가 없으므로 기업 단위 데이터와 연결하려면 이름 매칭에 기대야 한다.
description_portal: 이 데이터파일은 인천광역시 계양구 내 사회적경제기업 현황을 상세히 정리한 자료입니다. 주요 항목으로는 각 기업의 명칭을 나타내는 기관명, 기업의 유형을 나타내는 유형, 수행하는 주요 사업 내용을 담은 사업내용, 기업 인증 일자인 인증일자, 연락 가능한 전화번호, 위치 정보를 나타내는 위도와 경도, 그리고 자세한 위치 파악을 위한 도로명주소와 지번주소가 포함되어 있습니다. 이 데이터는 사회적경제기업의 분포 및 특성을 파악하고, 관련 정책 수립 및 지원 방안을 마련하는 데 중요한 기초 자료로 활용됩니다. 또한 지역 경제 활성화 및 일자리 창출에 기여할 수 있는 정보를 제공하여 주민과 행정 간 소통에도 도움을 줍니다.추가 문의사항은 **인천광역시 계양구 일자리정책과(032-450-5764)**로 연락해 주시기 바랍니다.
