summary_user: 대구광역시 달서구의 행정동별 전체 노인 수, 독거노인 수와 비율, 65세 이상 1인가구 중 국민기초생활보장 수급자 수와 저소득자 수를 집계한 파일(csv, 약 1.4KB)이다. 구청 복지 담당자나 분석가가 '달서구에서 독거노인 비율이 높고 기초수급 독거노인이 많은 동은 어디인가'를 확인해 돌봄 서비스 우선 지역을 정하는 데 쓴다. 전역 조인 키(행정동 코드 등)가 없어 행정동 이름을 행정구역 코드에 매핑하거나 같은 달서구의 인구·노인복지시설 데이터와 동 이름으로 맞춰 잇는다.
description_portal: 대구광역시 달서구 내 파악하여 집계한 자료로 독거노인을 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.행정동, 전체노인수, 독거노인총계, 비율, 국민기초생활보장 수급자 수(65세이상 1인가구), 저소득자 수(65세이상 1인가구), 관리부서, 기준일자 등으로 구성되어있으며 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료를 통해 지역 내 독거노인 자료를 분석하여 다양한 인구통계, 복지 서비스, 지원정책 등의 행정업무에 쓰는데 활용 가능합니다.
