summary_user: 수원시 복지관·새마을문고에 마련됐던 청소년 공부방을 한 곳당 한 행으로 담은 작은 현황 파일(csv 약 1.4KB)로, 공부방명·도로명/지번 주소·위도경도·면적·열람석 수·운영단체와 연락처·설립일을 담는다. 수원시 방과후 학습·독서 공간이 어디에 얼마 규모로 있었는지를 되짚어 보려는 연구자나 지역 청소년 시설 이력을 정리하는 분석가가 쓴다. 전역 조인 키는 없어 주소·위도경도로 다른 청소년 시설·도서관 위치 데이터와 공간적으로 겹쳐 보거나 시군구(수원시) 단위로 지역 통계에 붙여 쓴다.
description_portal: 경기도 수원시 청소년 공부방에 대한 현황 자료로 명칭, 위치, 담당 연락처, 시설에 관한 간단한 설명 등의 내용을 제공하고 있음. 2023년 사업 중단으로 현재는 운영을 하고 있지 않습니다. 데이터 활용시 참고하여 주시기를 바랍니다.  공부방명과 도로명주소, 위도 경도 정보가 포함되어 있습니다. 복지관과 새마을문고에서 공부방의 장소를 마련하여 방과후에 학생들의 학업과 독서 분위기를 조성하고자 하였으나, 현재는 운영을 하고 있지 않습니다. 자세한 내용은 운영 단체 연락처를 참고하시어 전화 문의 바랍니다.
