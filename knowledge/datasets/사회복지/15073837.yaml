description_portal: 공무원연금공단이 운영하는 연금교육 플랫폼의 운영 실적을 정리한 통계자료입니다. 디지털 기반의 연금교육 제공 현황을 체계적으로 파악할 수 있도록 구성되어 있으며, 카테고리, 세부항목, 게시물 수, 교육대상 등의 정보가 포함되어 있습니다. 교육대상은 연금담당자, 재직 중인 공무원, 연금수급자로 구분되며, 맞춤형 연금교육, 복지교육을 비롯해 공무원연금공단의 주요 사업 관련 교육을 제공합니다. 이 외에도 자격증, 취미, 법률, 디지털 리터러시, 일상생활, 재무·세무, 금융, 인문 등 다양한 분야의 교육 콘텐츠를 함께 제공하여 수요자 중심의 학습 환경을 지원합니다.
