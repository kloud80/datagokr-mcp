summary_user: 전북특별자치도 남원시 안의 청소년수련시설·문화의집·청소년쉼터 등 청소년이 이용하는 시설을 시설 한 곳당 한 행으로 시설명, 연락처, 소재지 주소, 운영내용과 함께 담은 파일이다(CSV 607바이트의 소규모 목록). 남원시 청소년이나 학부모가 근처에 어떤 청소년 시설이 있고 어디로 연락하면 되는지 찾을 때 쓰고, 지자체 담당자가 시설 분포를 파악할 때도 쓴다. 전역 조인 키나 기관 코드가 없어 다른 데이터와는 시설명이나 소재지 주소를 맞춰 잇거나, 시군명으로 시군구 단위 지역 통계에 붙여 써야 한다.
limits: 명세상 연간·이벤트 주기로 만들어진 뒤 바뀌지 않는 파일이어서 시설 개폐나 연락처 변경이 바로 반영된다고 보기 어렵다. 범위가 남원시 한 곳뿐이어서 다른 시군과 비교하거나 전국 현황을 보려면 다른 기관 데이터를 함께 모아야 한다.
