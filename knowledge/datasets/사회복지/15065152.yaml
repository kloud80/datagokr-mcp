summary_user: 인천광역시 군·구별(구분)로 한부모가족지원법·국민기초생활보장법·국가보훈법 수급자의 가구수와 가구원수를 집계한 통계 파일로, 건별 원천이 아닌 집계표이며 파일 크기는 512바이트로 작다. 복지 담당자나 분석가가 '인천 어느 군·구에 한부모·기초생활 수급 가구가 많은가'를 비교해 복지 서비스 배치나 예산 편성의 기초 자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 군·구 이름을 매핑해 이어 쓰며, 같은 세부 부문의 한부모·가족센터 등 복지시설 현황과 지역별로 견주는 데 쓴다.
description_portal: 인천광역시가 제공하는 저소득 및 한부모 가족 현황 공공데이터는 시 내 군/구별로 국민 기초 생활 보장 수급자 및 한부모 가족 지원 대상자의 규모를 집계한 통계 자료입니다. 이 데이터는 지역 사회의 취약 계층 규모, 복지 서비스의 지역별 분포, 공공 부조 정책의 이행 현황 등을 파악하고, 맞춤형 복지 서비스 제공, 예산 편성, 사회 안전망 강화 등의 기초 자료로 활용됩니다.*한부모가족지원법 수급자_가구수_가구원수, 국민기초생활수급자한부모가족_가구수_가구원수해당 데이터는 공공데이터포털에서 확인할 수 있습니다.
