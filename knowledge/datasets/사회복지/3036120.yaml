description_portal: '- 전남지역 시군의 지역자활센터 (자활센터명, 지정연월일, 운영주체, 주요사업 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도 지역자활센터는 저소득층 주민들에게 자활을 위한 다양한 프로그램과 서비스를 제공하는 기관으로, 지역별로 운영되고 있습니다. 이들 센터는 자활근로사업, 직업훈련, 상담 지원 등을 통해 경제적 자립을 돕고 있습니다.- 자세한 정보나 참여를 원하신다면 해당 지역자활센터로 직접 문의하시기 바랍니다.- 한국지역자활센터협회 전라남도지부: https://jnjahwal.or.kr- 전라남도청 자활지원센터: https://www.jnpsc.or.kr- 위의 링크를 통해 전라남도 지역자활센터에 대한 더 자세한 정보를 확인하실 수 있습니다.'
