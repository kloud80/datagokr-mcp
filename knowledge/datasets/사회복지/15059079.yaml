summary_user: 경기도 시군별 장애인활동지원기관을 기관 한 곳당 한 행으로 담은 목록으로, 기관명·시군·지번/도로명 주소·우편번호·전화번호·홈페이지와 위도·경도, 활동보조·방문목욕·방문간호 급여 구분을 포함하며 범위는 경기도, 행정단위는 시군구다. 장애인 가족이 "우리 시에서 방문목욕까지 제공하는 활동지원기관은 어디인가"를 찾거나, 분석가가 시군별 기관 분포와 서비스 접근성을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 주소·좌표 매핑으로 다른 시군 단위 통계나 공간 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 시군별 장애인활동지원기관의 현황을 담고 있습니다. 장애인활동지원기관은 신체적·정신적 제약으로 일상생활과 사회참여에 어려움이 있는 장애인을 대상으로 활동보조, 방문목욕, 방문간호 등의 서비스를 제공합니다. 데이터는 기관명, 시군명, 주소(지번/도로명), 전화번호, 홈페이지 URL, 위도·경도 좌표 등의 정보를 포함하고 있어, 지역별 서비스 접근성, 공급 기관의 분포 현황 분석, 행정적 자원 배분에 활용됩니다. 본 데이터는 국민연금공단과 경기도장애인복지종합지원센터(누림센터)가 공동 제공하며, 장애인 자립생활 지원 및 사회통합 정책 수립에 중요한 기반 자료로 활용됩니다.
