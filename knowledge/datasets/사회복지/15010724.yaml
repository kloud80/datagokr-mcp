description_portal: '충청남도 당진시 사회적기업 현황(데이터 기준일자: 2026년 7월 1일)충청남도 당진시는 사회적경제 활성화와 지역 내 지속가능한 일자리 창출을 위해 관내 사회적기업 및 예비사회적기업 현황을 관리하고 있습니다.본 데이터는 당진시에 소재한 사회적기업의 기본 정보를 정리한 자료로, 기업명, 사회서비스 분야, 주된 목적, 사업내용, 인증 여부, 인·지정일자, 인증번호, 대표자명, 연락처, 소재지 주소, 홈페이지 주소 등의 정보를 제공합니다.자료에 포함된 항목은 다음과 같습니다.기관명사회서비스분야주된목적사업내용인증여부인·지정일자인증번호대표자명전화번호소재지도로명주소소재지지번주소홈페이지주소데이터기준일자본 자료는 당진시 사회적기업의 업종별·목적별 분포를 파악하고, 사회적경제 지원정책 수립, 취약계층 일자리 창출 지원, 공공구매 연계, 지역사회 공헌사업 발굴, 사회서비스 공급 기반 분석, 대시민 정보 제공 등에 활용될 수 있습니다.데이터 기준일 현재 등록된 정보를 바탕으로 작성되었으며, 기업의 운영 현황, 연락처, 주소, 홈페이지 등 세부 정보는 변경될 수 있습니다.'
