summary_user: 경상북도 칠곡군 관내 어린이집을 한 곳당 한 행으로 담은 파일로, 어린이집명·유형·정원·보육교직원 수·보육실과 놀이터 수·통학차량 운영 여부·도로명주소·전화번호를 담는다. 칠곡군에 사는 부모가 집 근처에서 통학차량을 운영하고 정원이 넉넉한 어린이집을 찾거나, 분석가가 유형별 정원과 교직원 규모를 비교하는 데 쓴다. 전역 조인 키(어린이집코드 등)가 없어 다른 보육 데이터와는 어린이집명이나 도로명주소로 맞춰 이어야 한다.
limits: 어린이집코드 같은 공통 키가 없어 평가·보육료 공시·입소 대기 등 다른 데이터와 붙일 때 이름·주소 매칭에 의존해야 한다. 범위가 칠곡군 한 곳뿐이라 다른 시군과 비교하려면 별도 데이터가 필요하다.
