description_portal: 서울특별시 은평구 자활기업 현황 자료로 자활기업명, 자활기업 업종, 서비스내용, 인정연도, 참여인원, 전화번호 등의 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내 자활기업 6개소의 운영 현황을 담고 있습니다.자활기업이란 국민기초생활보장법에 따른 2인 이상의 수급자 또는 차상위자가 상호협력하여 조합이나 사업자 형태로 운영하는 기업입니다. 지역자활센터의 자활근로사업을 거친 취약계층이 공동창업을 통해 탈빈곤을 도모하는 사회적 기업 모델입니다.서울은평지역자활센터가 이들 자활기업의 창업과 운영을 지원하고 있으며, 자활근로사업, 교육훈련, 상담과 정보제공, 창업지원 등의 서비스를 제공합니다. 자활기업은 창업자금, 사업자금융자, 한시적 인건비 지원 등 다양한 정부 지원을 받을 수 있습니다.지원요건으로는 기초생활보장수급자 및 차상위자가 1/3 이상이어야 하며, 수급자는 반드시 1/5 이상 참여해야 합니다. 이를 통해 취약계층의 실질적인 경제활동 참여와 소득 창출을 보장하고 있습니다.이 데이터는 지역 내 사회적경제 생태계 현황 파악, 취약계층 일자리 창출 정책 평가, 추가 자활기업 육성 방향 설정에 기초 자료로 활용됩니다.
