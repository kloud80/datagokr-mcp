description_portal: '한국사회보장정보원이 제공하는 사회보장정보시스템(행복e음)에 등록된 차상위 및 한부모가족 수급자를 각 월말 기준으로 중복제거 후 집계한 통계데이터입니다.강원도 기준의 데이터입니다.데이터 구성은 성별, 연령대별, 시군구별, 월별 수급자수 항목으로 구성되어 있습니다.이 데이터를 활용하여 복합 취약계층의 주요 집중 연령대 및 성별 특성을 파악하여 복지 정책을 설계할 수 있습니다.인구통계학적 특성 분석: 성별, 연령, 거주 지역, 가구 구성원 수 등 기본적인 인구통계학적 특성을 분석하여 이들의 분포를 파악할 수 있습니다. 예를 들어, 특정 지역에 한부모 가족이 집중되어 있는지, 혹은 청소년 한부모 가구의 비율이 높은지 등을 확인할 수 있습니다.경제적 특성 분석: 소득, 자산, 부채, 소비 지출 패턴 등을 분석하여 경제적 어려움의 정도와 원인을 심층적으로 파악할 수 있습니다. 특히, 가구 소득 대비 주거비나 교육비 지출 비중이 얼마나 높은지 등을 분석해볼 수 있습니다.고용 및 노동 시장 특성 분석: 취업 여부, 종사하는 산업군, 고용 형태(정규직/비정규직), 근무 시간 등을 분석하여 이들이 겪는 고용 불안정성을 진단할 수 있습니다. 예를 들어, 여성 한부모의 경우 육아와 일을 병행하는 데 어려움을 겪어 비정규직이나 단시간 근로에 종사하는 경우가 많은지 등을 분석할 수 있습니다.'
