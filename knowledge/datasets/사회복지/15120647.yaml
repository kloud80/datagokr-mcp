description_portal: 자동차사고피해지원사업은 자동차사고로 인해 뜻밖에 일어난 불행한 일로 인해 생명이나 신체, 재산, 명예 따위에 손해를 입은 피해가족을 지지하고 도와주는 사업을 말한다.등록 정보는 자동차사고 피해지원 대상자 선정 자격 요건 중 재산허용 기준에 대한 연도별 기준을 대상자 선정 업무에 맞게 정리한 데이터입니다.세부 데이터로는 수도권 및 지방 각각의 재산금액기준, 적용기준 시작 및 종료일 등에 대한 정보를 제공하고 있습니다.다만, 자동차사고피해가족지원사업이 2025년 1월 1일부로 자동차손해배상보장법에 따라 자동차손해배상진흥원으로 이관되었음을 활용 및 문의에 참고하시기 바랍니다.
