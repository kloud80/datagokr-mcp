description_portal: '경상남도 창원시 국민기초생활보장수급자(맞춤형급여: 생계급여, 의료급여, 주거급여, 교육급여) 현황 자료 입니다.맞춤형 기초생활보장수급자는 급여별 중복값을 제외하고  2024년 12월 31일 기준으로 국민기초생활보장수급자 현황입니다.창원시는 성산구청, 의창구청, 마산합포구청, 마산회원구청, 진해구청 5개구청으로 이루어져 있습니다.기초생활보장수급자는  기준중위소득 기준안에 적합해야하며  급여별 선정기준은 생계급여 32%, 의료급여 40%, 주거급여 48%, 교육급여 50% 입니다데이터 구분은 가구수 합계, 수급권자수 합계, 데이터 기준일로 구성되어 있습니다.'
