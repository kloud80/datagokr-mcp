description_portal: '○ 통계개요* 통계명 : 참전유공자 연령별 현황* 통계종류 : 국가보훈대상자 중 참전용사 등록현황에 대한 일반통계* 작성목적 : 국가를 위하여 희생하거나 공헌한 6.25 및 월남전에 참전한 유공자들의 현황을 파악하여참전유공자에 대한 복지 정책수립의 기초자료로 활용하기 위함* 조사체계 : 지방보훈청 및 보훈지청 -> 국가보훈처* 공표주기 : 매년(정기)* 공표범위 : 지역 - 서울시내용 - 서울시의 6·25참전, 월남전 , 6·25 및 월남전 등 참전유공자의 연령별 등록현황○ 용어설명* 참전유공자 : 6·25전쟁에 참전하고 전역(퇴직)된 군인및 경찰공무원, 병역법 또는 군인사법에 의한현역복무 중 1964년 7월 18일부터 1973년 3월 23일까지 사이에 월남전에 참전하고 전역된 군인,6·25전쟁 또는 월남전쟁에 참전한 사실이 있다고 국방부장관 또는 경찰청장이 인정한 자○ 기타○ 출 처 : 국가보훈처'
