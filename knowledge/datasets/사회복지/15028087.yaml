description_portal: 장애인 의무고용현황은 국가 및 지방자치단체(공무원·비공무원 포함), 그리고 상시 50인 이상의 근로자를 고용하는 공공기관 및 민간기업의 고용 실태를 정밀하게 조사한 결과물입니다.이 데이터는 실효성 있는 장애인 고용 정책 수립을 위한 핵심 기초 자료로 활용되며, 각 주체의 법적 의무 이행 여부를 체계적으로 관리하고 지도하는 중요한 근거가 됩니다. 궁극적으로 장애인에게 평등한 일자리 기회를 제공하고 고용 안정성을 강화함으로써, 장애인의 사회 참여 확대와 포용적인 노동 환경 조성을 목적으로 합니다.
