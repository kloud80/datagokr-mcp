summary_user: 고양시 안에 있는 여성복지시설(가족센터, 성폭력상담소, 가족사랑상담소, 여성인력개발센터 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·운영기관·소재지·대표자·개소일·주요사업을 적었으며 파일은 963바이트 CSV로 작은 규모입니다. 고양시민이 "우리 동네에서 취업 지원이나 가족 상담을 받을 수 있는 여성 기관은 어디인가"를 찾거나, 분석가가 시군구 단위 여성복지 인프라를 정리할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소로 맞추거나, 사회복지시설 공통 마스터를 참조해 이어 써야 한다.
description_portal: 'ㅇ 데이터 개요 및 목적여성복지시설은 단순한 공간적 의미를 넘어, 여성의 인권을 보호하고 사회적 참여를 지원하며 상담·보호·자립 등의 전문적인 복지 서비스를 전달하는 핵심 체계입니다. 본 데이터는 시민 여러분의 정보 접근성을 높이고, 필요시 적절한 복지 서비스를 적기에 이용할 수 있도록 돕는 데 목적이 있습니다.ㅇ시설의 분류 및 관련 법령고양시의 여성복지시설은 서비스의 성격에 따라 다음과 같은 법령에 근거하여 운영되고 있습니다.관련 법령: 「양성평등기본법」, 「성폭력방지 및 피해자보호 등에 관한 법률」, 「가정폭력방지 및 피해자보호 등에 관한 법률」 등주요 시설 유형: 가족센터(건강가정·다문화가족지원), 성폭력상담소, 가족사랑상담소, 여성인력개발센터, 여성노동자복지센터 등ㅇ 데이터 구성 항목 (제공 파일 내용)제공되는 파일에는 시민들의 시설 이용에 꼭 필요한 다음 항목들이 상세히 기록되어 있습니다.- 시설명: 기관의 공식 명칭- 소재지: 시설의 정확한 위치(주소)- 대표자: 해당 시설의 운영 책임자- 개소일: 시설의 설립 및 운영 시작일- 주요사업: 해당 시설에서 제공하는 전문 서비스(상담, 교육, 취업 지원 등) 정보ㅇ데이터 활용 방법시민 여러분께서는 본 데이터를 다음과 같이 활용하실 수 있습니다.맞춤형 서비스 찾기: 본인의 상황(취업준비, 심리상담, 가족 갈등 등)에 맞는 전문 기관을 검색할 수 있습니다.가까운 시설 확인: 거주지 인근의 복지시설 위치를 확인하여 방문 상담 및 프로그램 참여에 활용할 수 있습니다.기관 정보 확인: 시설별 주요 사업 내용을 미리 파악하여 본인에게 필요한 구체적인 복지 혜택을 확인할 수 있습니다.'
