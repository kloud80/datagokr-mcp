summary_user: 경기도 동두천시에 소재한 예비사회적기업을 업체 한 곳당 한 행으로 담은 목록으로, 업체명·도로명/지번 주소·위도·경도·지정일자·해제일자·업종·업태·주요 생산품 및 서비스·연락처를 담는다(CSV 파일 약 799바이트의 소규모 파일). 동두천시 주민이나 사회적경제 지원기관이 '우리 지역에 어떤 예비사회적기업이 있고 무엇을 생산·제공하는가'를 확인하거나, 지정·해제 시점을 보고 지원 대상 기업을 찾는 데 쓴다. 전역 조인 키(사업자번호·인증번호 등)는 없어 다른 데이터와는 업체명·주소 매칭이나 위도·경도 좌표로만 이어 쓰며, 사회적기업·마을기업 등 다른 사회적경제 기업 목록과 업체명으로 대조하는 방식이 현실적이다.
description_portal: 경기도 동두천시의예비사회적기업 현황 정보를 민원인에게 제공하고자 합니다.데이터는 업체명, 소재지도로주소, 소재지지번주소, 지정일자, 해제일자, 위도, 경도, 연락처, 업종, 업태, 주요생산품및서비스, 데이터기준일자 정보입니다.데이터의 기준일자는 2025년 11월 26일이며, 기준일자에 예비사회적기업의 현황을 제공하고있습니다.데이터에 대하여 추가적인  문의사항이 있으실 경우 경기도 동두천시청 일자리경제과 일자리정책팀(031-860-2368)으로 문의주시기 바랍니다.
