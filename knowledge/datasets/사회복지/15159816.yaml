summary_user: 국민연금 지역가입자 가운데 납부예외자 수를 기준년월·전국 시군구별로 집계한 명 단위 통계 파일로, 포털 설명상 2021년~2025년을 담는다. 분석가나 지자체 담당자가 "어느 시군구에 소득 중단 등으로 연금 보험료를 내지 못하는 지역가입자가 많은가"를 보거나 연도별 변화를 비교할 때 쓴다. 표준 행정구역 코드 같은 조인 키는 없고 시군구 이름(시군구)과 기준년월로만 다른 지역 통계와 맞춰 붙인다.
description_portal: '국민연금공단의 가입된 국민연금 지역가입자 데이터를 기반으로 만들어진 지역 시군구별 지역납부예외자 수입니다.해당 연도의 국민연금에 가입된 지역납부예외자의 지역 시군구별에 따른 현황을 나타내며 분류기준은 아래와 같습니다.- 분류 기준: 연도별, 지역별(전국 시군구별)- 해당 연도: 2021년~2025년 - 분류 단위: 명해당 연도에 따라 분류되어있는 데이터를 통해 국민연금에 가입된 지역납부예외자의 지역 시군구별 분포 현황을 확인하실 수 있습니다.(데이터 건수가 많은 경우 모든 데이터가 표출되지 않을 수 있음을 안내드립니다.)(시군구 명칭은 해당 연도의 현황에 따르며 현재 시군구 명칭과 상이할 수 있습니다.)'
