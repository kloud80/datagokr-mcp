description_portal: '○ 통계개요* 통계명 : 다문화 인구동태* 작성목적 : 다문화 사회의 통합 및 다문화 가족 지원 정책수립과 평가의 기초자료로 활용* 작성근거 : 통계법 제18조 제1항 규정에 의한 지정통계(승인번호 10103호)* 조사체계 : 「통계법」과「가족관계의 등록 등에 관한 법률」에 따라 신고한 출생, 사망, 혼인, 이혼 자료와대법원가족관계등록자료를 활용하여 작성한 결과임* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 다문화가족의 혼인, 이혼건수 및 출생아수○ 용어설명* 다문화인구 :「다문화가족지원법」의 정의를 준용하여 한국인과 결혼이민자 및 귀화·인지에 의한한국 국적 취득자로 이루어진 가족의 구성원을 의미○ 기타* 출생은 발생연도 기준으로 출생자의 주소지 기준 집계혼인·이혼은 신고연도 기준으로 부부 중 국내 주소지 기준(단, 부부가 모두 국내 주소인 경우 남편의 주소지 기준)* 작성대상 : 귀화/인지에 의한 국적취득자와 외국국적자가 "다문화가족"의 "인구(개인)"별 출생, 혼인, 이혼사건* 주소기준 : 부부 중 국내 주소지 기준 집계(부부가 모두 국내 주소인 경우 남편의 주소지 기준)'
