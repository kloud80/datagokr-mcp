summary_user: 경기도 내 장애인 체육 종목별 협회를 한 행씩 담은 목록으로, 종목명·전화번호·도로명/지번 주소·우편번호·WGS84 위도·경도로 구성된다. 장애인 체육 활동을 하려는 사람이나 지도 인력이 '내가 하려는 종목의 경기도 협회 연락처와 위치는 어디인가'를 찾을 때 쓰고, 분석가는 종목별 협회 위치를 지도에 올려 접근성을 살피는 데 쓴다. 전역 조인 키는 없어서 종목명이나 주소 문자열로 맞추거나 좌표(REFINE_WGS84_LAT·LOGT)를 다른 공간 데이터와 겹쳐 쓰는 방식으로만 연결된다.
description_portal: 체육종목별 장애인체육회 현황 데이터는 경기도 내 각 장애인 체육 종목별 협회에 대한 정보를 담고 있으며, 종목명, 전화번호, 도로명 주소, 지번 주소, 우편번호, WGS84 위도 및 경도 정보로 구성되어 있습니다. 해당 데이터는 장애인 체육활동의 종목별 분포를 파악하고, 체육회 위치 기반의 접근성 분석, 지역사회 체육 인프라 현황 파악 등에 활용될 수 있습니다. 또한 위치 좌표 정보가 포함되어 있어 지도 시각화 및 내비게이션 연계 시스템 개발에도 유용합니다. 각 체육회의 연락처 정보는 관련 종목 활동 참여자나 체육 지도 인력, 정책 담당자에게 실무적인 안내자료로도 제공될 수 있습니다.
