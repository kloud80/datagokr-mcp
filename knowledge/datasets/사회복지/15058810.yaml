summary_user: 경기도 내 장애인근로사업장(보호작업장 등)을 사업장 한 곳당 한 행으로 담은 현황 자료로, 시군명, 사업장명, 인허가일·폐업일, 영업상태, 입소정원·자격소지 인원·총인원, 주소와 위경도를 포함한다. 장애인 당사자나 가족이 집 근처에서 운영 중인 근로사업장을 찾을 때, 또는 정책 분석가가 시군별 직업재활 일자리 분포가 고르지 않은지 확인할 때 쓴다. 전역 조인 키는 없으므로 시군 코드·시군명(SIGUN_CD)으로 같은 기관의 다른 시군 단위 자료와 맞추거나, 사업장명·주소 이름 매칭과 좌표로 다른 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 장애인근로사업장(보호작업장 등)의 운영 현황을 수록한 자료로, 장애인의 경제적 자립과 사회참여를 지원하기 위한 직업재활 시설의 운영 상태, 인허가 일자, 위치 정보 등을 포함하고 있습니다. 장애인근로사업장은 근로 능력이 있는 장애인에게 직업 훈련 및 일자리를 제공하여 소득 활동을 가능하게 하는 복지형 일자리 지원기관입니다. 본 자료는 시군 단위별 사업장 분포, 설립 시기, 인력 보유 현황 등을 파악할 수 있습니다. 이 데이터는 직업복지 정책 수립, 장애인 자립 지원 계획 수립, 지역 간 일자리 자원 불균형 해소 전략 등 다양한 사회복지 및 고용 정책의 기초 자료로 활용될 수 있습니다.
