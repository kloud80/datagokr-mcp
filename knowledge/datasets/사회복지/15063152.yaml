summary_user: 전국 아이돌보미 모집 공고를 공고 한 건씩 담은 파일 데이터로, 지역(시도)·공고명·모집 시작일과 종료일·모집정원·모집상태(모집중 등)·모집구분(수시모집 등)이 들어 있다. 아이돌보미로 일하려는 사람이 우리 시도에서 지금 모집 중인 공고와 마감일을 확인하거나, 분석가가 시도별 모집 시기와 정원 흐름을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 돌봄·가족 데이터와는 시도명 같은 이름 매핑으로만 이어 쓴다.
limits: 실측 컬럼에 표준 행정코드 같은 조인 키가 없어 다른 데이터와 연결하려면 지역명을 직접 맞춰야 한다. 범위는 전국이지만 좌표나 주소가 없는 비공간 데이터라 지도 위 위치 분석에는 쓸 수 없다.
