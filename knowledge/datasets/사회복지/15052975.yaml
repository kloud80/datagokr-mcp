summary_user: 공무원연금 퇴직연금 수급자 수를 38세 미만부터 85세 이상까지의 연령구간(구분)별로 행을 나누고, 전국 17개 광역자치단체별 열과 합계(계)로 집계한 작은 CSV 표(3,868바이트)다. 퇴직 공무원 연금수급자가 어느 연령대에 많고 고령 수급자가 어느 시도에 몰려 있는지 알고 싶은 분석가나 지역 정책 담당자가 쓴다. 표준 행정구역 코드 같은 공통 조인 키가 없어서, 다른 시도별 통계와는 서울·부산 같은 시도 이름을 맞춰 붙여야 한다.
description_portal: 공무원연금공단에서 제공하는 연령별·지역별 퇴직연금수급자 현황 데이터입니다. 본 자료는 38세 미만부터 85세 이상까지의 연령구간을 기준으로 퇴직연금 수급자의 분포를 집계하며, 거주지 또는 주소지를 기준으로 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주 등 전국 17개 광역자치단체별로 구분해 제공합니다. 해당 데이터는 연령대별 수급자 분포 및 지역별 편중 현황을 종합적으로 파악할 수 있어, 특정 연령층의 지역 집중도, 고령층 퇴직자의 거주지 특성 등을 분석하는 데 활용될 수 있습니다.
