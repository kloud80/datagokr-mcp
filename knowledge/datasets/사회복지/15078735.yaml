summary_user: 사회적경제 지역생태계 구축을 위한 지역자원조사의 설문 응답을 응답자 1명당 1행(DATAID)으로 담은 원자료이며, 공무원·사회적경제기업·지역주민 세 집단의 설문결과와 코드북·설문지가 zip 파일 하나로 제공된다. 지역별로 사회적경제 자원과 인식이 어떻게 다른지, 예컨대 시도·시군구(AREA1·AREA2)마다 주민과 기업이 느끼는 지원 수요가 어떻게 갈리는지를 보려는 정책 담당자·연구자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지역명을 맞추는 방식으로만 이어 쓰며, 사회적기업 인증번호·사업자번호 같은 기업 식별자가 없어 기업 축 데이터와 직접 연결되지 않는다.
description_portal: 「사회적경제 지역생태계 구축을 위한 지역자원조사」본 조사는 지역에 산재해 있는 사회적경제 관련 자원을 조사하여 사회적경제 생태계 기반에 대한 이해도를 높이고,지역 특성을 고려한 사회적경제 정책의 수립을 지원하기 위해 진행되었습니다.zip파일로 제공되며 사회적경제 지역자원조사 코드북, 사회적경제 지역자원조사 설문지, 사회적경제 지역자원조사(공무원), 사회적경제지역자원조사(사회적경제기업), 사회적경제 지역자원조사(지역주민) 설문결과를 제공합니다.데이터 관련 문의는 한국사회적기업진흥원으로 부탁드리겠습니다. 감사합니다.
