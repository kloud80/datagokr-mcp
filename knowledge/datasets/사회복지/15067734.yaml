summary_user: 인천광역시 남동구에서 운영하는 노인일자리사업을 사업 한 건당 한 행으로 담은 파일로, 수행기관·사업구분·사업명·사업량(참여 규모)·전화번호·데이터기준일자를 포함한다(CSV 약 6.8KB 규모). 남동구에 사는 어르신이나 가족이 '우리 구에서 어떤 노인일자리 사업을 어느 기관이 몇 명 규모로 하고, 어디로 문의하면 되나'를 확인하거나, 분석가가 수행기관별 사업 배분을 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설 데이터와는 수행기관 이름을 맞추거나 같은 기관(남동구) 기준으로만 연결한다.
limits: 수행기관 코드나 사회복지시설 시설코드 같은 공통 키가 없어 장기요양기관·시설 목록과 자동으로 정확히 결합하기 어렵고, 이름 매칭이 필요하다. 남동구 한 시군구 범위만 담고 있어 다른 지역과 비교하려면 별도 자료가 필요하며, 위치 좌표가 없는 비공간 자료다.
