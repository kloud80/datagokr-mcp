summary_user: 경기도 31개 시군의 부랑인·노숙인 복지시설을 시설 1곳당 1행으로 담으며, 사업장명, 인허가일자, 영업상태·폐업일자, 입소정원, 자격 보유 인원과 총 인원, 도로명·지번 주소, WGS84 위도·경도를 포함한다. 복지 담당자나 분석가가 '우리 시군에 운영 중인 부랑인 시설이 몇 곳이고 입소정원과 자격 인력은 얼마나 되는가'를 따져 볼 때 쓴다. 전역 조인 키는 확인되지 않아, 시군 코드·이름(SIGUN_CD, SIGUN_NM)으로 다른 시군 단위 통계와 맞추거나 좌표·주소로 지도 데이터에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 31개 시군 내 부랑인의 복지를 위한 복지시설에 대한 정보를 포함하며, 각 시설의 사업장명, 도로명주소 및 지번주소, 우편번호, 인허가일자, 영업상태, 폐업일자, 입소정원, 자격 소유 인원 수, 총 인원 수 등의 항목으로 구성되어 있습니다. WGS84 좌표계 기준의 위도 및 경도를 제공하여 공간정보 분석에도 활용이 가능하며, 시설별 위치를 지도 기반으로 시각화할 수 있습니다. 데이터는 지방행정데이터개방시스템을 통해 수집된 인허가 기반 정보로, 노숙인 및 부랑인 대상 복지정책 수립, 지역별 복지 수요 평가, 시설 기능 분석 등에 유용하게 사용될 수 있습니다. 특히 복지사나 간호사 등 자격 보유 인력의 수를 함께 제공함으로써 시설의 운영 역량을 분석하는 데 도움이 됩니다.
