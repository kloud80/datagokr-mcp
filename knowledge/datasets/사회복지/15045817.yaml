description_portal: 사립학교교직원연금공단 사학연금수급자 현황(학교급별, 직종별) 데이터는 재직기간에 따른 직종별 연금수급자 수를 제공합니다. 학교급별(유치원, 초등학교, 중학교, 고등학교, 전문대학, 대학, 특수학교, 학교경영기관), 교직원별(교원, 사무직원)로 나누어 집계되었으며, 재직기간이 10년 이상부터 34년 이상까지의 수급자를 집계하여 연 단위로 분류하여 제공합니다. 이 데이터는 연금 수급자 추이 파악 및 제도 개선을 위한 기초 자료로 활용될 수 있습니다.또한, 공공기관의 연금 정보 공개를 확대하여 대국민 신뢰도를 제고하는 데 기여합니다.
