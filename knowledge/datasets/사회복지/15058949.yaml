summary_user: 주거 취약계층의 주거 안정과 복지 지원을 맡는 주거복지기관의 기관명·시군명·지번/도로명 주소·우편번호·위경도 좌표·전화번호·홈페이지를 기관 한 곳당 한 행으로 담은 현황 목록입니다. 주거 지원이 필요한 주민이나 복지 담당자가 "우리 시군에서 가까운 주거복지기관은 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 기관 위치 좌표로 주거복지 서비스 접근성을 지도에서 따져보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 기관명 매칭, 또는 좌표 기반 공간 결합으로 이어 써야 한다.
description_portal: 이 데이터는 전국의 주거복지 관련 기관 현황을 정리한 자료로, 취약계층을 대상으로 주거 안정과 복지 지원을 수행하는 다양한 기관의 정보를 제공합니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소 및 도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL이 포함되어 있습니다. 기관별 세부 주소와 위치 좌표를 통해 GIS 기반 공간 분석이 가능하며, 복지 정책 수립, 주거 지원 서비스 접근성 평가, 취약계층 지원 네트워크 강화에 활용될 수 있습니다. 또한 자활센터, 사회적 협동조합, 복지재단 등 기관 유형별로 주거복지 서비스의 특성과 운영 형태를 파악할 수 있어 공공기관 및 연구기관에서 실질적인 정책 자료로 활용하기 적합합니다.
