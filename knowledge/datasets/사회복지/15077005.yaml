summary_user: 인천광역시 장애인복지 통합 플랫폼에서 추출한 장애인복지시설별 운영 프로그램 목록으로, 시설명·시설 분류와 유형·프로그램명과 설명·신청자격·운영 시간·이용료를 행 단위로 담는다. 장애인과 보호자가 인천에서 어떤 시설이 어떤 자격 조건과 이용료로 프로그램을 운영하는지 찾거나, 분석가가 시설 유형별 프로그램 구성을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 시설 목록과는 시설명 같은 이름 매핑으로만 연결한다.
description_portal: '인천광역시 장애인복지통합플랫폼 DB의 장애인복지시설 현황, 운영 프로그램 정보, 운영주체, 종사자 정보, 시설정보, 면적정보 등 장애인 시설 관련 DB 데이터를 제공합니다.인천광역시 장애인복지 통합 플랫폼 DB 공공데이터는 인천시의 장애인 복지 관련 정보를 통합 관리하는 데이터베이스에서 추출된 자료입니다. 이 데이터는 장애인 복지 서비스의 효율성을 높이고, 수요자 중심의 맞춤형 복지를 실현하기 위한 핵심적인 정보를 담고 있습니다.*주의사항: 인천장애인복지통합플랫시스템은 인천시 통합웹사이트에 통합되므로 더이상 DB자료가 나오지 않습니다. 이후 업데이트는 진행되지 않습니다. 감사합니다.'
