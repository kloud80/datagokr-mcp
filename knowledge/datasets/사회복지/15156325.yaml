summary_user: 전국 청소년 자원봉사 프로그램 운영 현황을 담는 API로, 봉사활동 종료연월·활동 시군구별 초·중·고·대학생 참가 인원 통계와 봉사 터전(인증 등급·인증 상태·운영법인·주소·동아리 정보) 목록을 기관 단위로 제공한다. 지자체·청소년활동 담당자나 연구자가 우리 시군구에서 월별로 몇 명의 청소년이 봉사에 참여했는지, 인근에 인증받은 봉사 터전이 어디에 있는지 확인하는 데 쓴다. 터전의 사업자등록번호(brno)로 사업자·기관 정보와 잇고, 활동 시군구명·주소로 지역 통계와 연계한다.
description_portal: 청소년 자원봉사활동 프로그램 운영 현황 정보 서비스는 전국의 청소년 자원봉사 프로그램 운영 실태를 종합적으로 제공하는 Open API로, 프로그램 정보, 활동 참여 통계, 봉사 터전 정보 등 세부 오퍼레이션으로 구성되어 있습니다. 활동 일정·내용·운영기관 등 프로그램 기반 정보부터 월별·지역별 참여 인원 통계, 봉사활동이 이루어지는 터전의 인증 및 운영 현황까지 폭넓은 데이터를 수집·제공하여 지역별 청소년 봉사활동 구조와 운영 수준을 다각도로 분석할 수 있도록 지원합니다. 이를 통해 청소년 자원봉사 프로그램의 품질 관리, 참여자 특성 분석, 터전 운영 역량 평가 등 다양한 정책·연구 목적의 정량 분석이 가능하며, 봉사활동의 활성화 및 품질 제고를 위한 실질적 근거를 마련할 수 있습니다. 행정기관은 이를 기반으로 봉사활동 활성화 정책 수립, 인증제 운영 개선, 프로그램 수요 대응, 지역 간 역량 격차 분석 등 공공정책을 체계적으로 추진할 수 있으며, 민간·연구기관은 봉사활동 플랫폼 개발, 참여행태 분석, 터전 운영모델 연구, 지역사회 기반 청소년활동 콘텐츠 개발 등 다양한 분야에서 활용할 수 있습니다.터전이란? 해당 지역 시·도 청소년활동진흥센터의 검토 및 심사를 거쳐 두볼을 통해 청소년자원봉사활동 프로그램 운영·관리, 확인서 발급 등을 진행할 수 있는 권한을 부여받은 기관을 말합니다.
