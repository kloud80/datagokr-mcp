summary_user: 공무원연금공단이 집계한 공무원 1인당 평균 기준소득월액과 퇴직 수급자의 1인당 평균 연금수령액을 2015년부터 연도별로 담은 전국 단위 집계 파일(만원 단위)입니다. 공무원 소득 수준과 퇴직 후 연금 수준이 해마다 어떻게 변했는지, 재직 소득 대비 연금이 어느 정도인지 보려는 연구자·기자·정책 분석가가 쓴다. 전역 조인 키가 없어 연도를 기준으로 사학·군인연금 등 다른 직역연금 통계나 물가·임금 지표와 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 연도별 공무원 1인당 평균 기준소득월액과 평균 연금수령액을 정리한 데이터로, 공무원의 소득수준과 퇴직 후 연금수령 수준의 변화 추이를 파악할 수 있도록 구성되어 있습니다.2015년부터 기준년도까지 연도별로 제공되며, 각 연도별로 두 항목의 수치가 만원 단위로 제공됩니다.‘기준소득월액’은 공무원이 매달 내는 기여금과 퇴직연금, 퇴직일시금 등 공무원연금법에 따른 각종 급여를 산정할때 기준이 되는 금액이며, ‘평균연금수령액’은 퇴직 후 수급자가 수령하는 평균 연금액을 의미합니다.
