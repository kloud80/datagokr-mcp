description_portal: '○ 통계개요* 통계명 : 소년·소녀 가장 기초수급 현황* 통계종류 : 서울시 기초생활보장수급자 중 소년·소녀가정 가구를 제공하는 일반ㆍ보고통계* 작성목적 : 생활유지 능력이 없거나 생활이 어려운 가구의 소재ㆍ재산, 급여집행실적등을 파악하여 차년도 국민기초생활수급자의 책정을 위한 기초자료를 제공하는것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 기초생활보장대상 중 소년·소녀가장 가구의 가구수 및 가구비율○ 용어설명* 기초생활보장급여 수급권자 : 부양의무자가 없거나, 부양의무자가 있어도 부양능력이없거나 부양을 받을 수 없는 자로서 소득 인정액이 최저생계비 이하인 자(국민기초생활보장법 제5조제1항)* 소년·소녀가정 : 국민기초생활보장법에 의한 기초생활수급자 중 18세 미만의아동으로만 구성된 세대 또는 18세 미만의 아동이 부양능력이 없는 부모와 동거하는세대로서 아동이 실질적으로 가정을 이끌어가고있는 세대○ 기 타* 소년·소녀가장가구 비율=(소년소녀 가장 가구수÷국민기초생활보장 수급 가구수)×100○ 출 처 : 서울특별시 스마트도시담당관'
