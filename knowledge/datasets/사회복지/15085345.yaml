description_portal: 본 자료는 「국민기초생활 보장법」에 근거하여 대전광역시 서구 관내 기초생활수급자의 현황을 수록한 공공데이터입니다.해당 자료는 서구 24개 행정동을 기준으로, 기초생활수급자를 일반수급자, 조건부수급자, 특례수급자, 시설수급자로 구분하여, 각 수급자 유형별 가구 수 및 수급권자 수를 제공하고 있습니다.본 자료는 동별 수급자 분포와 유형별 지원 대상 현황을 파악할 수 있도록 구성되어 있으며, 복지 정책 수립, 수급 대상자 맞춤형 지원 방안 마련, 취약계층 지원 인프라 분석 등에 활용될 수 있습니다.또한, 생활보장 제도의 효과성 평가, 지역 간 복지 불균형 해소, 예산 수립 및 집행의 근거자료로도 참고할 수 있는 기초 행정 자료입니다.
