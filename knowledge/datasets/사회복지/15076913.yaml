summary_user: 서울특별시 내 노인여가복지시설(경로당·노인복지관 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·시설종류와 세부종류·관할 자치구·주소·전화번호·우편번호를 포함한다. 시민이나 복지 분석가가 '우리 구에 경로당이나 노인복지관이 어디에 몇 곳 있는가'를 확인하거나 자치구별 노인여가시설 분포를 비교할 때 쓴다. 전역 조인 키는 확인되지 않았으므로 관할 자치구 코드(JRSD_SGG_CD)나 자치구명으로 시군구 단위 지역 통계에 잇고, 시설코드·시설명·주소를 맞춰 같은 기관의 다른 사회복지시설 목록이나 장기요양기관 자료와 대조하는 방식으로 이어 쓴다.
description_portal: '서울특별시 노인여가복지시설의 정보- 주요내용 : 시설명, 시설유형, 시설종류, 시설주소 등 정보 제공*용어설명- 노인여가복지시설은 「노인복지법」에 따라 설치되는 노인복지시설의 한 유형- 노인에게 여가활동, 취미, 문화, 평생교육, 건강증진 프로그램 등을 제공하여 활기차고 건강한 노후생활을 지원하는 시설(운영 주체)- 지자체: 구청·시청이 설치 및 운영 (예: 경로당 지원, 복지관 운영)- 사회복지법인·민간단체: 지자체 보조금 및 자체 재원으로 운영- 노인회: 대한노인회 등 단체가 경로당 운영에 관여※ 제공부서 : 서울특별시 복지실 복지기획관 복지정책과(02-2133-7352)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
