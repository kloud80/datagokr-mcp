summary_user: 경기도 청소년 교통비 지원 사업의 지급현황을 기준년도·기간(반기 또는 분기)·시군별로 집계해 지급자 수, 1인 평균 지급금액, 신청자 수를 담는다. 분석가나 담당 공무원이 "어느 시군에서 신청 대비 실제 지급 비율이 낮고 1인당 지원액은 얼마인가"처럼 지역 간 수혜 규모와 신청 수요를 비교하는 데 쓴다. 전역 조인 키가 없어 시군명(sigun_nm)을 행정구역 코드나 다른 시군 단위 통계에 이름으로 매핑해야 지역 통계와 이어 쓸 수 있다.
description_portal: '경기도 청소년 교통비 지원 사업에 따라 경기도에 거주중인 청소년들의 통학 등에 필요한 교통비를 지원하였으며, 산하 시군별(지역별) 교통비 지원금 지급현황을 나타냅니다. 주요 항목으로는 기준년도, 기간구분(예: 상반기), 시군명, 지급자 수, 1인 평균지급금액, 신청자 수가 포함되어 있으며, 각 지역별 교통비 지원의 수혜 규모 및 신청 수요를 비교할 수 있습니다. 해당 데이터는 교통복지 정책의 효과성을 분석하거나 지역 간 형평성을 평가하는 데 유용하며, 청소년 교통이용 패턴 분석, 예산 계획 수립, 교통비 지원 확대 여부 결정 등 실무적 활용도가 높습니다. 지급 기간 변경으로 기간구분 컬럼의 데이터 값에 반기와 분기가 혼용되어 제공되며, 연도별 및 지역별 변화 추세 분석에도 적합합니다.'
