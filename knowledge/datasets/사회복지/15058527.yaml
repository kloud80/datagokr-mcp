summary_user: 경기도 각 시군이 시행하는 출산장려금·양육비 지원사업을 시군·사업 단위로 정리한 현황 데이터로, 출생 순위(첫째아부터 다섯째아 이상)별 지원금 내역, 지원기간, 지급기준, 근거 조례를 담는다. 예비 부모나 정책 분석가가 "우리 시군에서 셋째를 낳으면 출산축하금을 얼마, 어떤 조건으로 받나", "시군마다 지원액이 얼마나 다른가"를 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으며, 시군명(SIGUN_NM)과 시군 코드(SIGUN_CD)로 이름·코드 매핑을 해 경기도 시군 단위 출생·인구 통계와 연결한다.
description_portal: 경기도 시군별 출산장려 및 양육비 지원 현황 데이터는 경기도 각 시군에서 시행 중인 출산 및 양육 지원 정책을 정리한 자료로, 시군명, 사업명, 첫째아·둘째아·셋째아 이상 자녀별 지원금 내역, 지원기간, 지급기준, 근거 조례 등의 항목으로 구성되어 있습니다. 해당 데이터는 지자체별로 상이한 출산 축하금, 양육비 지원금 제도를 비교·분석할 수 있으며, 분할 또는 일시 지급 여부, 지원대상 조건(거주기간, 출생신고 기준 등)까지 상세히 확인할 수 있습니다. 또한 각 시군의 조례 근거가 포함되어 있어 정책적 합법성과 제도적 기반을 검토하는 데 활용할 수 있습니다. 이 데이터는 저출산 대응 정책 연구, 지자체별 인구 정책 효과 분석, 가정경제 지원정책 개선 등 다양한 분야에서 유용하게 사용될 수 있습니다.
