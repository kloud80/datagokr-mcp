summary_user: 부천시 원미구·소사구·오정구에 있는 스마트경로당(비대면 여가·건강프로그램을 운영하는 경로당)을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명과 도로명주소를 담는다. 부천시 어르신이나 가족이 집 근처 스마트경로당이 어디 있는지 찾을 때, 분석가가 구별 스마트경로당 분포를 볼 때 쓴다. 전역 조인 키가 없어 시설명·도로명주소로 부천시 경로당·노인복지시설 목록이나 사회복지시설 정보와 맞춰 이어 쓴다.
description_portal: 해당 데이터는 경기도 부천시 3개구(원미구, 소사구, 오정구)에 소재한 비대면  여가 및 건강프로그램을 운영하는 스마트경로당에 대한 다양한 정보를 포함하고 있습니다.스마트경로당의 시설명으로 해당 여가복지시설의 이름을 알 수 있고, 스마트경로당이 위치한 여기복지시설의 정확한 주소 등의 위치 정보를 제공합니다.부천시내 어르신들이 여가 및 건강프로그램을 체험할 수 있는 노인여가복지시설 중 스마트경로당 관련 정보가 존재하여 어르신들의 여가복지 향상을  위해  환경을 분석하고 개선하는데 중요한 역할을 합니다.
