description_portal: 한국건강가정진흥원 온라인교육플랫폼의 강의계획서 데이터는 온라인교육플랫폼에서 제공하는 교육과정의 강의계획서 정보로, 오늘의 이야기, 놀이의 개념과 특성, 놀이의 요인과 아동 발달 등 실제 강의계획명이 포함되어 차시별 교육주제와 학습 흐름을 파악할 수 있으며 각 데이터는 강의계획서아이디, 강의계획서번호, 강의계획서명, 사용유무, 차시아이디, 작성일자를 포함합니다. 이 데이터는 강의 주제 구성과 차시 간 연계성, 교육목표와 난이도 배치, 사용 여부와 작성 시점 변화를 분석하여 과정 설계의 적정성과 개선 방향을 도출하고 온라인 교육과정 품질관리와 신규 콘텐츠 기획의 근거자료로 활용될 수 있습니다. 또한 차시아이디를 활용해 학습 진행 순서를 검토함으로써 교육과정 구조의 적정성과 학습자 경험 향상 가능성을 분석할 수 있습니다.
