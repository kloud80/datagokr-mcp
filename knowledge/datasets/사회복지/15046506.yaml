description_portal: '○ 통계개요* 통계명 : 국민기초 생활보장 수급자(동별)* 통계종류 : 서울시 국민기초 생활보장 수급자 현황을 각 자치구 동별로 제공하는 일반 통계* 근거법령 :「국민기초생활보장법」에 의해 시ㆍ자치구로부터 급여를 받는 자* 작성목적 : 생활유지 능력이 없거나 생활이 어려운 자의 인원현황 및 소재 등의 현황을파악하여 차년도 국민기초생활 수급자의 책정을 위한 기초자료를제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 및 사업소 → 시도 → 보건복지부* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구ㆍ행정동내용 - 서울시 각 자치구 동별 국민기초생활보장 수급자 (일반수급자,조건부수급자, 특례수급자, 시설수급자) 현황○ 용어설명* 수급자 : 기초생활보장을 위한 급여를 받는 자를 말함(「국민기초생활 보장법」제2조제2호)* 조건부수급자 :근로능력이 있는 수급자 중 자활사업 참여를 조건으로 급여를 지급받는자를 말함(국민기초생활보장법 시행령 제8조)* 특례수급자 : 일반적인 수급대상 이외 특례에 의해 급여를 받는 자를 말함* 시설수급자 : 보장시설(보장기관으로 부터 급여지급을 위탁 받은 사회 복지시설)로지정된 시설 및 시설 수급자를 말함○ 기 타* 본청은 서울시 사업소인 여성보호센터와 아동복지센터에서 관할하는 수급자를 나타냄* 수급권자 : 기초생활보장을 위한 급여를 받을 수 있는 자격을 가진 사람을 말함(「국민기초생활 보장법」 제2조제1호)* 수급권자(기초생활보장 대상자)의 선정기준 : 부양의무자가 없거나, 부양의무자가 있어도부양능력이 없거나, 부양을 받을 수 없는 사람으로서 소득인정액이 최저생계비 이하인사람을 대상으로 함(「국민기초생활 보장법」 제5조제1항)○ 출 처 : 서울특별시 희망복지지원과'
