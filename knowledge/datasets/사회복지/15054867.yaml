description_portal: '- 부산광역시 다문화지원센터는 ｢ 다문화가족지원법｣  제12조, ｢부산광역시 다문화가족 지원 조례｣  제7조에 의해 부산광역시 다문화가족의 안정적인 정착과 건강한 가족 생활을 지원하기 위하여 설치된 기관입니다.- 현재 다문화가족지원센터 4개소, 가족센터 10개소가 있으며, 개방 데이터는 14개 센터의 센터명, 도로명주소, 연락처, 운영형태(위탁 여부), 운영기관 , 관할지역, 개소일 7종 98건입니다.- 다문화가족은 데이터를 활용하여 센터에서 제공하는 방문교육, 자녀언어발달, 통·번역, 이중언어 학습지원,  결혼이민자 한국어교육 등의 서비스를 제공받을 수 있습니다.'
