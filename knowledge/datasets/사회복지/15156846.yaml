description_portal: 본 데이터는 고리본부 임직원의 사회공헌 활동 실적을 연도별로 집계한 자료입니다. 집계 시점은 2017년부터 대상으로 하며, 활동 유형을 지역지원사업, 자원봉사, 자매마을로 구분해 각 연도별 실적 값을 제공합니다. 이를 통해 임직원 참여 기반의 지역 상생 활동 규모와 변화 추이를 비교할 수 있고, 연도별 사회공헌 프로그램 운영 흐름을 파악하여 지역사회 협력 과제 발굴, 봉사 프로그램 기획, 홍보 콘텐츠 제작, 성과 공유 자료 작성 등에 활용할 수 있습니다. 제공항목은 연도와 유형별 실적으로 구성됩니다.
