summary_user: 전국 시도별 등록장애인 수를 기준연도(STD_YY)·시도명마다 한 행씩 장애유형별(지체·뇌병변·시각·청각·언어·안면·신장·심장·간·호흡기·장루요루·뇌전증·지적·정신·자폐성)로 나눠 담은 집계 통계이며, 건별 원천 자료가 아니다. 장애인 정책 담당자나 복지 분석가가 "우리 시도에 어떤 유형의 등록장애인이 많아 어떤 지원 서비스 수요가 큰가"를 다른 시도와 비교할 때 쓴다. 실측 컬럼에 전역 조인 키나 행정코드가 없어, 다른 시도 단위 통계와는 시도명 문자열을 맞춰 연결해야 한다.
description_portal: 이 데이터는 전국 시도별 등록장애인을 장애유형별로 분류한 통계자료입니다. 매년 12월 말 기준으로 장애유형(지체, 뇌병변, 시각, 청각, 언어, 자폐성 등 총 15개 이상)에 따라 각 시도별 등록된 장애인 수를 제공합니다.장애유형 분류는 장애인복지법에 따라 정의되며, 지체장애(사지의 변형·기능장애), 뇌병변장애(뇌손상에 따른 마비), 청각·언어·시각장애, 자폐성장애, 정신장애, 신장·심장·간장애 등 내부 장기 기능 장애도 포함됩니다.본 데이터는 장애인 정책 수립, 의료·복지 자원 분배, 장애유형별 지원 수요 분석 등에 활용됩니다. 특히 복합장애 대응, 지역별 특화 서비스 개발에 유용합니다.
