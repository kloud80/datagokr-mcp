description_portal: 2025년 3분기 누적 기준, 연령별 및 사업단유형별 자활근로 참여자 수 현황에 대한 상세 데이터를 제공합니다. 본 자료는 20세 이하부터 61세 이상까지의 각 연령대별 참여 인원과 함께, 시장진입형, 사회서비스형, 근로유지형, 인턴형 자활근로사업단, 복지시설도우미, 게이트웨이, 청년자립도전 등 다양한 사업단유형별 참여 현황을 포괄적으로 담고 있습니다.이 통계는 자활사업 참여 양상을 다각도로 심층 분석하고, 각 연령대 및 사업단 유형의 특성을 고려한 맞춤형 자활 정책을 수립하는 데 활용될 기초 자료입니다.
