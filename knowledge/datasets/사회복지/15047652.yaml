description_portal: '본 데이터는 전북특별자치도 전주시 내 사회복지관 현황 데이터로 전주시 지역사회 내에서 운영되고 있는 사회복지관의 주요 정보를 정리하여 제공하는 자료입니다. 사회복지관은 다양한 복지 서비스와 지역사회 프로그램을 통해 아동·청소년·장애인·노인·저소득층 등 주민들의 복지 증진과 삶의 질 향상을 지원하는 핵심 지역 복지기관입니다.이용대상, 이용요금, 운영법인 등 서비스 이용에 직접적으로 필요한 실질적 정보도 포함되어 있어 주민들의 복지관 접근성과 서비스 이해도를 높이는 데 도움이 됩니다.항목 : 복지관명칭, 소재지도로명주소, 지번주소, 위도, 경도, 소재지전화번호, 이용대상, 이용요금, 운영법인제공부서 : 생활복지과'
