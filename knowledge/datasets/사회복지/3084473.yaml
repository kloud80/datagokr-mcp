summary_user: 중증장애인 생산품 우선구매 특별법에 따라 지정된 생산시설과 품목을 시설별로 한 행씩 담은 전국 파일로, 지정번호·시설명·유형·광역·주소·생산품목·지정 유효기간을 포함하며 포털 설명상 2024년 10월 31일 기준이다. 공공기관 구매 담당자가 '우리 지역에서 이 품목을 납품할 수 있는 지정 중증장애인 생산시설이 어디인가'를 찾을 때, 분석가가 시도별 지정시설 분포를 볼 때 쓴다. 사업자번호(bizno)로 사업자 등록·상태 데이터와 잇고, 광역 구분과 주소로 시도·시군구 단위 장애인 통계와 맞대어 쓴다.
description_portal: '중증장애인 생산품 우선구매 특별법에 따라 2024년 10월 31일 기준으로 중증장애인 생산품으로 지정된 시설 및 품목에 관한 데이터를 제공하고 있습니다.(연번, 지정번호, 생산시설의 명칭, 생산시설의 유형, 생산시설장, 사업자번호, 광역, 생산시설의 주소, 전화번호, 생산품목, 유효시작일, 유효종료일)<데이터 이용 시 참고사항>1. 중증장애인생산품 우선구매제도 : 일반노동시장에서 참여하기 어려운 중증장애인들을 고용하는 생산시설에서 만드는 생산품 또는 동 시설에서 제공하는 용역·서비스에 대한 공공기관의 우선구매를 의무화함으로써 중증장애인의 고용을 확대하고, 근로장애인의 안정적 소득을 보장하기 위한 제도를 말함2. 연락처가 휴대폰 번호로 개인정보가 포함되어 있어 공란이 있음'
