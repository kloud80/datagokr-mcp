summary_user: 인천 제물포구(포털 설명상 옛 동구) 행정동별로 전체 인구수, 노인 인구수, 독거노인 수, 고령비율을 한 줄씩 담은 읍면동 단위 집계 파일(csv, 465바이트)이다. 구청·복지 담당자나 분석가가 '구 안에서 독거노인이 가장 많거나 고령비율이 높은 동은 어디인가'를 확인해 돌봄 서비스 배치나 지원 우선순위를 정할 때 쓴다. 전역 조인 키나 행정동 코드가 없어 행정동명(행정동명)을 이름으로 매칭해 같은 구의 노인복지시설·인구 데이터나 시군구 단위 지역 통계에 잇는다.
limits: 행정동 코드 같은 표준 조인 키가 없어 다른 데이터와는 동 이름 매핑으로만 연결되며, 동 명칭이 바뀌면 매칭이 어긋날 수 있다. 범위가 한 구의 행정동으로 한정돼 다른 시군구와 직접 비교하거나 개인 단위 정보를 볼 수 없다.
