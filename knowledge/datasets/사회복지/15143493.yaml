summary_user: 전국 화장시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시도·시군구, 시설명, 주소, 전화번호, 주차대수, 공설·사설 구분, 화장로 수와 식당·매점·유족대기실·장애인편의시설 같은 편의시설 정보를 담는다. 유족이나 장례 준비자가 "우리 지역 근처 공설 화장시설은 어디이고 화장로가 몇 개, 주차는 얼마나 되나"를 확인하거나, 분석가가 시도별 화장 수용 능력을 비교하는 데 쓴다. 전역 조인 키는 없어 시도·시군구 이름이나 주소를 기준으로 다른 지역 통계나 장사시설 데이터와 맞춰 이어 쓴다.
description_portal: '보건복지부에서 2026년 5월 31일 기준 보건복지현황 중 전국 화장시설 현황(시도, 시설명, 주소, 전화번호, 주차대수, 공/사설, 화장로수)에 대한 정보를 제공 합니다.<데이터 이용 시 유의사항>1. 화장 : 시체나 개장한 유골을 불에 태워 장사하는 것을 말하며, 사찰경내의 다비의식 등 법에 정한 특별한 경우를 제외하고는 반드시 화장시설에서만 화장이 허용된다.2. 화장시설 부설로 설치되어 있는 합동 안치시설(유택동산)에 산골하거나 해양장 등이 시행되고 있으나, 산골 또는 해양장 등에 대하여 『장사(葬事 등에 관한 법령』에는 규정하고 있지 않다.'
