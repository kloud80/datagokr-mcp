description_portal: '1. 목록명: 인천광역시_다문화 가족 통계2. 키워드: 다문화, 가구원수, 통계, 결혼이민자, 귀화자, 한국인배우자, 국내출생, 기타동거인3. 데이터설명: 인천광역시의 다문화가족 현황에 대한 데이터를 제공하고 있습니다. 다문화가족 통계는 행정안전부에서 작성한 자료를 수집 제공하는 공공데이터로 한국인배우자, 결혼이민자, 귀화자, 귀화 및 외국국적(자녀), 국내출생(자녀), 내국인(기타동거인), 외국인(기타동거인) 등으로 구성된 다문화 인구 현황을 상세히 담고 있습니다. 이를 통해 인천광역시 다문화가구원 수를 확인할 수 있습니다. 2023년 기준으로 다문화가구원 수는 약 85,029명으로 인천광역시 총인구의 약 2.8%를 차지하며, 매년 증가 추세를 보이고 있습니다. 데이터는 연간 업데이트 되어 최신 정보를 반영합니다.'
