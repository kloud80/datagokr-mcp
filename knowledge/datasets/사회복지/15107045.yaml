description_portal: '전라남도 나주시의 장애인전용주차구역 위반 단속에 대한 자료입니다. 해당 자료는 시도, 시군구,  단속연도, 위반장소(단속장소)에 대한 정보를 제공합니다.해당 자료는 현장 단속, 국민권익위원회의 국민신문고(인터넷, 모바일 어플) 및 행정안전부의 안전신문고 앱을 통하여 신고 및 접수되었던 장애인전용주차구역 위반 신고와 관련된 데이터입니다. 해당 자료의 위반 차량의 단속(부과)기간은 2021년 7월 ~ 2025년 12월입니다.(데이터 기준일자: 2025. 12. 24.)단속대상은 보행상 장애가 있는 자에게 발급되는 장애인 자동차 표지를 부착하지 않은 자동차(구형 주차가능표지 부착 차량 포함) 및  동 표지를 부착하였더라도 보행상 장애가 있는 자가 탑승하지 않은 자동차를 장애인전용주차구역에 주차한 차, 장애인전용주차구역에 물건을 쌓거나 그 통행로를 가로막는 등 주차를 방해한 자, 장애인 자동차 표지를 대여, 양도 등 부당하게 사용하거나 이와 유사한 표지, 명칭 등을 사용한 자입니다.장애인전용주차구역 과태료 부과는 장애인ㆍ노인ㆍ임산부 등의 편의증진 보장에 관한 법률 (약칭: 장애인등편의법 ) 제17조(장애인전용주차구역 등) 및 제27조(과태료), 장애인복지법 제39조(장애인이 사용하는 자동차 등에 대한 지원 등) 및 제90조(과태료)와 관련하여 보행장애인이 자동차를 편리하게 주차할 수 있는 전용주차구역을 확보하고, 사용토록 함으로써 보행장애인의 주차편의 및 이동편의 증진을 목적으로 합니다.'
