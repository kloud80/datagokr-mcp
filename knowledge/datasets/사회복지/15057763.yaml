summary_user: 경기도 내 장애인체육시설을 시설 한 곳당 한 행으로 담으며, 시군명·기관명·지번/도로명 주소·우편번호·WGS84 위경도·전화번호·홈페이지·설치신고일을 포함한다. 장애인 당사자나 가족이 사는 시군에서 가까운 재활·생활체육 시설을 찾거나, 분석가가 시군별 장애인 체육 인프라 분포와 접근성을 비교하는 데 쓴다. 전역 조인 키는 없어 시군 코드·시군명이나 주소·좌표를 기준으로 인구·장애인 등록 통계나 다른 시설 데이터와 매칭해 이어 쓴다.
description_portal: 이 데이터는 장애인을 대상으로 한 체육시설의 현황을 정리한 자료로, 시군별 설치 위치와 운영 정보를 포함하고 있습니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소와 도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL, 설치신고일이 포함되어 있습니다. 해당 시설들은 장애인의 재활 운동, 생활 체육, 여가 활동을 지원하기 위해 운영되며, 종합복지관 내 체육관, 전용 체육센터, 전문 재활스포츠센터 등 다양한 유형이 있습니다. 이 데이터는 지역별 장애인 체육 인프라 분포를 파악하고, 체육복지 정책 수립 및 시설 접근성 평가에 활용될 수 있으며, 나아가 생활체육 활성화 및 장애인 건강 증진을 위한 연구와 행정 자료로도 중요합니다.
