summary_user: 전국 해바라기센터(성폭력 피해자 통합 지원 기관)의 시설 정보를 센터 한 곳씩 담은 건별 원천 데이터로, 센터명·유형·주소·좌표·연락처·위탁병원·운영 여부와 시간·휴일·지원 내용을 제공한다. 성폭력 피해를 입은 사람이나 상담 연계 담당자가 가까운 해바라기센터의 위치, 운영 시간, 연계 병원을 확인하는 질문에 쓴다. 도로명주소·지번주소와 위도(lat) 좌표를 키로 지도나 다른 사회복지시설 주소 자료와 이어 쓰며, 시도명·시군구명으로 지역별 분류도 할 수 있다.
description_portal: 성폭력 피해자 지원을 전담하는 해바라기센터의 시설 정보를 제공하는 오픈 API형 데이터입니다.  해당 개방데이터는 해바라기센터의 POI정보(도로명주소, 지번주소, 위도, 경도), 시설명, 시설 유형, 전화번호, 이메일주소, 지원 내용, 지원 내용, 운영 여부, 운영 시간, 위탁 병원명, 휴일, 인근 교통시설명 등을 확인할 수 있습니다.  해바라기센터의 위치와 운영 정보를 통해 성폭력 등 피해자에 대한 통합 지원 체계를 효과적으로 파악할 수 있습니다. 또한 위기 대응 서비스 접근성 강화, 피해자 보호 정책 수립, 지역 기반 의료·상담 연계망 구축 등 다양한 공공 정책 및 연구 분야에 활용될 수 있습니다.
