description_portal: '○ 통계개요* 통계명 : 한부모가족 복지시설* 통계종류 : 서울시 한부모가족 복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「모부자복지법」등에 의거 설치운영되는 여성복지시설* 작성목적 : 여성복지시설 설치신고를 마친 여성복지시설의 수, 생활인원을 집계하여적정수의 시설수요와 충족율을 분석하고, 분석결과에 따른 정책 수립및 평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 가족담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 한부모가족 복지시설의 시설수 및 생활인원수 현황○ 용어설명* 모자보호시설 : 생활이 어려운 모자가족을 일시적으로 또는 일정 기간 보호하여 생계를지원하고 퇴소 후 자립 기반을 조성하도록 지원하는 것을 목적으로 하는 시설* 모자일시보호시설 : 배우자(사실혼 관계에 있는 자를 포함한다)가 있으나 배우자의물리적·정신적 학대로 아동의 건전한 양육이나 모의 건강에 지장을 초래할 우려가 있을경우 일시적으로 또는 일정기간 그 모와 아동 또는 아동을 보호함을 목적으로 하는 시설* 미혼모자공동생활가정 : 출산 후의 미혼모와 해당 아동으로 구성된 미혼모자가족이 일정기간공동으로 가정을 이루어 아동을 양육 및 보호할 수 있도록 지원함을 목적으로 하는 시설* 미혼모자시설 : 미혼 여성의 임신·출산 시 안전 분만 및 심신의 건강 회복과 출산 후 아동의양육 지원을 위하여 일정 기간 보호하는 것을 목적으로 하는 시설* 부자공동생활가정 : 독립적인 가정생활이 어려운 부자가족이 일정 기간 공동으로 가정을이루어 생활하면서 자립을 준비할 수 있도록 지원하는 것을 목적으로 하는 시설'
