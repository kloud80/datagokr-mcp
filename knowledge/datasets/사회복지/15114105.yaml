description_portal: '창녕군공설장례식장 빈소 수는 4개, 안치 능력은 6구입니다. 빈소 요금은 일반 기준으로 1일(24시간) 기준 100,000원이며, 국가유공자에 대해서는 무료로 제공됩니다. 지역 주민들에게 합리적인 비용으로 장례 서비스를 제공하고 있습니다.창녕추모공원은 창녕군시설관리공단이 위탁 운영하며, 창녕군민을 위한 추모와 봉안 서비스를 제공합니다시설 개요1. 시설 규모: 2개 동의 봉안당에 개인단과 부부단으로 구성되어 있으며, 총 2만 346기의 안치가 가능합니다. 현재 8,561기(25.6.13.기준)가 안치되어 있습니다.2. 편의 시설: 주차 가능 대수 약 90대, 유족 대기실, 식당 등이 마련되어 있습니다.창녕군시설관리공단 장사시설인 공설장례식장, 창녕추모공원 이용현황에 데이터로 장례식장, 추모공원 이용현황 항목을 제공합니다.'
