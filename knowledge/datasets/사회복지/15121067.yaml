summary_user: 인천광역시 내 여성새로일하기센터(새일센터)를 센터별로 한 행씩 담은 현황 파일로, 기관명·소재지·종사자 수·지정일을 담는다(2025년 8월 기준, csv 812바이트 규모의 소량 목록). 경력이 끊긴 여성이 우리 동네에서 가까운 새일센터가 어디인지 찾거나, 분석가가 인천 군·구별 센터 분포와 인력 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 소재지 주소를 맞춰 잇고, 사회복지시설 공통 마스터를 참조하는 보조 자료로 쓴다.
limits: 조인용 코드가 없어 다른 시설·고용 데이터와 연결하려면 기관명·주소 매칭에 의존해야 한다. 범위가 인천광역시 한 곳뿐이라 전국 새일센터 비교에는 다른 시도 자료가 따로 필요하다.
