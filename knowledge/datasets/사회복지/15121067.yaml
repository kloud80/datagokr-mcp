description_portal: '- 2025년도 8월 현재 인천광역시 여성새로일하기센터 현황 입니다. - 여성새로일하기센터는 경력단절여성 등 구직 여성에게 ▲취업상담 및 직업능력개발 교육 ▲인턴십 및 취업 연계 ▲집단상담 프로그램(경력설계) ▲취업 후 사후관리(고용유지 지원) ▲기업체 연계 등을    종합적으로 제공하여 여성의 지속적인 고용을 지원합니다.   또한 기업에는 맞춤형 인재 발굴 및 채용 지원 서비스를 제공함으로써 여성 인력 활용을 촉진하고, 지역 내 고용 활성화에 기여하고 있습니다.- 새일센터는 여성가족부와 고용노동부에서 지정하고 있으며, 전국에 159개소가 지정되어 있음'
