summary_user: 경기도 시군별로 운영 중인 노인일자리사업을 수행기관·사업 단위로 담은 자료로, 사업개시년도, 시군명, 기관명, 사업유형(공익활동형·사회서비스형·시장형 등), 사업내용, 사업량(참여 인원 수), 사업 시작·종료일자를 담는다. 노인 구직자나 가족이 우리 시군에서 어떤 기관이 어떤 유형의 노인일자리를 몇 명 규모로 운영하는지 확인하거나, 분석가가 시군별·유형별 일자리 공급 규모를 비교하는 데 쓴다. 전역 조인 키는 없어 시군명이나 기관명을 이름으로 매핑해야 하며, 이 방식으로 지역(시군) 단위 고령 인구 통계나 노인복지시설·장기요양기관 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 시군별로 운영 중인 노인일자리사업의 전반적인 현황을 보여주는 자료로, 고령자의 활기차고 안정된 노후생활을 도모하기 위해 다양한 일자리 유형을 제공하는 내용을 담고 있습니다. 주요 항목은 사업개시년도, 시군명, 기관명, 사업유형명, 사업내용, 사업량(참여 인원 수), 사업 시작일자 및 종료일자 등으로 구성되어 있으며, 공익활동형, 사회서비스형, 시장형 등 다양한 일자리 유형별로 세분화되어 있습니다. 이를 통해 각 시군의 노인 일자리 지원 현황을 비교하거나, 특정 유형의 일자리 수요 분석, 정책 수립 시 참고자료로 활용할 수 있습니다.
