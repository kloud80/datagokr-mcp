summary_user: 인천광역시 안의 여성폭력 상담소를 한 곳씩 담은 시설 목록으로, 시설명·주소·연락처·지원내용(상담, 법률 지원, 의료 연계, 보호시설 안내 등)을 담은 작은 CSV 파일(약 3.7KB)이다. 피해자나 주변 사람이 '우리 동네에서 가장 가까운 여성폭력 상담소는 어디이고 어떤 지원을 받을 수 있나'를 찾을 때 쓰고, 지자체 담당자는 지역 상담 인프라 분포를 점검할 때 쓴다. 공통 조인 키가 없어 다른 사회복지시설 목록과는 시설명이나 주소를 맞춰 이어 붙여야 하며, 주소를 좌표로 바꾸면 지도 기반 접근성 분석에 쓴다.
limits: 여성폭력 피해자 보호시설은 법적으로 위치가 비공개라서, 이 목록으로 보호시설의 소재지는 알 수 없다. 시설 코드 같은 전역 키가 없어 다른 데이터와 연결할 때는 이름·주소 매칭에 의존해야 한다.
