summary_user: 경기도 거주 장애인의 만성질환 진료실인원을 국민건강보험공단 청구자료로 집계한 통계로, 기준연도(STD_YY)·만성질환(상병명·상병코드)별로 지체·뇌병변·시각·청각·언어·정신·자폐·신장·심장 등 장애유형별 인원과 총 환자 수를 담는다. 보건정책 담당자나 연구자가 '경기도에서 특정 장애유형 장애인에게 많은 만성질환은 무엇인가'를 파악해 장애인 특화 만성질환 관리사업을 기획할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상병명·상병코드 매핑이나 기준연도로만 맞춰 이어 써야 한다.
description_portal: 이 데이터는 국민건강보험공단 청구자료를 기반으로 경기도에 거주하는 장애인의 만성질환 진료실인원을 장애유형별, 만성질환별로 집계한 자료입니다. 각 항목에는 상병명(질환명), 장애유형별 진료 인원 수, 상병코드 정보, 총 환자 수 등 건강보험 진료 실적 기반의 정보가 포함됩니다. 장애유형은 뇌병변, 뇌전증, 장루·요루, 지체, 시각, 청각, 언어, 정신, 자폐 등으로 분류되어 있으며, 환자의 진료 시점에서의 주진단명을 중심으로 집계되었습니다. 본 데이터는 장애인 건강권 보장을 위한 보건정책 수립, 장애인 특화 만성질환 관리사업 기획, 공공의료서비스 개선 등의 활용도가 높습니다. 진료 인원은 약국 진료를 제외한 의료기관 기반 수치이며, 최종 진단과 다를 수 있는 진료 현황 기준 데이터입니다.
