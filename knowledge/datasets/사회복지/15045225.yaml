summary_user: 전북특별자치도 정읍시에 있는 노인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 기관명·운영주체(개인·재단·민간법인 등)·도로명/지번 주소·전화번호를 2024-12-31 기준으로 싣는다(포털 설명상 총 30개). 정읍시에 사는 어르신이나 가족이 "집 근처에 어떤 노인복지시설이 있고 어디로 연락하면 되나"를 찾을 때나, 분석가가 시군구 단위 노인시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·주소로 맞추어 잇는다. 장기요양기관 목록이나 지역 통계에 붙일 때도 같은 방식으로 연결한다.
description_portal: '전북특별자치도 정읍시_노인복지시설 현황2024.12월 기준 정읍시에 있는 노인복지시설에 대한 데이터로 시설 기관명, 운영주체, 소재지주소, 전화번호 등에 대한 자료입니다.[데이터 안내]- 2024.12월 기준 정읍시에 있는 노인복지시설은 총 30개- 운영주체 : 개인, 재단, 민간법인 등으로 구분- 시설명 : 해당 노인복지시설 명칭- 소재지도로명(지번)주소 : 해당 노인복지시설이 위치한 주소- 전화번호 : 시설 전화번호- 데이터기준일자 : 2024-12-31기타 궁금한 사항이 있으면 정읍시 노인장애인과 노인시설팀(063-539-5511~5515)로 문의하시기 바랍니다.'
