summary_user: 경기도 워라밸링크 플랫폼의 생활밀착형 지원 서비스(살림돌보미·산모돌보미·아이돌보미 등) 구성 항목을 서비스 고유번호·유형·제목·상태 단위로 담은 목록이며, 주거 평수와 이용 시간(반나절 4시간, 종일 등)에 따라 유형이 나뉜다. 도민이 경기도에서 어떤 가사·돌봄 지원 서비스를 어떤 시간·평수 조건으로 받을 수 있는지 확인하거나, 분석가가 생활복지서비스 구성 현황을 파악하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했다. 다른 데이터와는 서비스 이름을 맞추거나 같은 기관 코드로만 연결한다.
description_portal: 이 데이터는 경기도의 워라밸링크 플랫폼에서 제공되는 생활밀착형 지원 서비스 프로그램(살림돌보미, 산모돌보미, 아이돌보미 등) 의 세부 구성 정보를 담고 있습니다. 서비스별로 주거공간 평수와 이용 시간(반나절 4시간, 종일 등)에 따라 다양한 유형으로 제공되며, 서비스별 고유번호, 타입, 제목, 상태 등의 항목으로 구성되어 있습니다.  이 데이터는 가사노동 분담 정책, 생활복지서비스 운영 현황 분석, 이용 수요 예측 등에 활용 가능하며, 경기도민의 일과 삶의 균형을 위한 정책 수립에 중요한 기초자료로 활용될 수 있습니다.
