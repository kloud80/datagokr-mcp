summary_user: 공무원연금공단이 관리하는 퇴직자 수를 퇴직사유(명예·정년·일반·당연퇴직, 직권면직, 해임, 파면, 사망 등)와 성별로 나누어 직종별(일반직·경찰·소방·교육직 등) 열로 집계한 전국 단위 통계 파일이다. 인사·연금 분석가가 경찰이나 소방 같은 특정 직종에서 정년퇴직과 명예퇴직 중 어느 쪽이 더 많은지처럼 직종 간 퇴직 양상을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 직역연금 통계와는 직종·퇴직사유 이름을 맞추는 방식으로만 이어 쓴다.
limits: 전국 합계만 담고 지역별 분석은 하지 못하며, 개인 단위가 아니라 집계표다. 포털 설명에 따르면 2013년에 의원면직·조기퇴직 등 7개 항목이 '일반퇴직'으로 통합됐고, 2011년 이후 별정직·일반직의 지방직이 국가직으로 통합됐다. 그래서 이 시점을 걸쳐 시계열을 비교할 때는 주의해야 한다.
