description_portal: '공무원연금공단에서 관리하는 퇴직자수를 직종별 퇴직사유별로 제공하는 데이터로, 각 직종의 퇴직사유를 비교하여 분석할 수 있습니다. 직종 : 일반직, 정무직, 별정직, 경찰, 소방, 교육직, 법관검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(우정직, 고위직, 외무직, 청원경찰, 전문경력관 등)퇴직사유 : 명예퇴직, 정년퇴직, 일반퇴직, 당연퇴직, 직권면직, 해임, 금품수수, 파면, 사망, 기타1. 퇴직사유중 기타는 기간만료 및 철도공사특례가입 종료 등임 2. 명예퇴직에는 조기퇴직인원 포함 3. 직종구분 "기타"에는 청원경찰, 공익법무관, 기타직 공무원 등이 포함되어 있음 4. 2013년도 인사관련 신분변동 항목 조정에 따라 의원면직, 조기퇴직 등 7개 항목이 "일반퇴직"으로 통합 5. 별정직, 일반직의 경우 2011년 이후 재직공무원의 직종관리체계를 변경함에 따라 지방직을 국가직으로 통합'
