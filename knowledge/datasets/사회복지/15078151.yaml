summary_user: 아이돌봄 통합업무관리시스템에서 쓰는 사회보험 공제 기준을 적용일자별로 담은 전국 단위·비공간 기준표로, 적용 최소소득금액과 국민연금·고용보험·건강보험·장기요양보험·산재보험의 근로자부담·사용자부담 공제율이 들어 있다. 아이돌보미 급여를 계산하거나 분석하는 사람이 특정 시점에 어떤 공제율과 최소소득 기준이 적용됐는지, 근로자와 사용자 부담이 어떻게 나뉘는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 적용일자(aplcnYmd)를 기준으로 시점을 맞추거나 같은 기관 자료와 이름으로 대응시켜 이어 쓴다.
description_portal: 아이돌봄 통합업무관리시스템 정보 서비스를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 적용일자, 적용최소소득금액, 근로자부담/사용자부담 별 국민연금공제율, 고용보험공제율, 건강보험공제율, 장기요양보험공제율, 산재보험공제율의 정보를 확인할 수 있습니다. 사회보험 공제 항목별 수치를 기반으로 돌봄 관련 근로자의 급여 실태를 분석할 수 있습니다. 근로자 및 사용자 부담률 구조를 비교함으로써 정책지원의 사각지대 여부나 조정 필요성을 검토할 수 있으며, 소득 기준 연계 항목은 근로자 처우 개선과 정책 설계 시 중요한 기준점이 됩니다. 아이돌보미의 고용 안정성과 제도 보완 방향 도출에 활용될 수 있습니다.
