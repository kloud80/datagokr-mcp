description_portal: 서울특별시 기본통계의 참전유공자 등록현황을 자치구별로 제공하는 자료로, 국가를 위해 헌신한 참전유공자의 등록 인원 현황을 파악할 수 있다. 연도별 기준으로 자치구별 총 등록인원과 6·25 참전유공자, 월남전 참전유공자, 6·25 및 월남전 참전자 현황을 포함하고 있으며, 지역별 참전유공자 분포와 고령 보훈대상자 규모를 분석하는 데 활용할 수 있다. 또한 보훈정책 수립, 복지서비스 제공, 예산 편성, 지역별 보훈 수요 분석, 참전유공자 지원사업 운영 및 성과 평가를 위한 기초자료로 활용 가능하다.
