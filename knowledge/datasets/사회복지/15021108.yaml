summary_user: 지방자치단체장이 설치한 재활용센터를 센터 한 곳당 한 행으로 담은 표준데이터로, 검증 시 185행을 받았고 센터명·운영구분·주소·좌표·면적·설립연월·차량 보유 대수·취급품목·운영시간·휴무일 등을 포함한다. 주변에서 중고 물품을 맡기거나 살 수 있는 재활용센터가 어디에 있고 어떤 품목을 취급하며 몇 시에 여는지 찾는 국민이나 지역 분석가가 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)로 지도나 다른 주소 기반 시설 데이터와 이어 쓰고, 세부 부문 설명상 인증번호·사업자번호로 기업 축과 연결한다는 안내가 있으나 이 파일의 실측 조인 키에는 사업자번호가 없다.
limits: 이 데이터는 센터별 개별 주소·좌표 기준이며 전체 범위는 확인되지 않았다. 실측 최신 행 날짜가 2026-08-06(관측일 기준 57일 전)이고 기간은 2018-05-15~2026-08-06이므로 현재 운영 여부는 별도로 확인해야 한다. 홈페이지주소가 주소 키로 잡혀 있어 도로명주소와 같은 방식으로 조인하면 안 된다.
