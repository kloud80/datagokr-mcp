description_portal: 사립학교교직원연금공단 사학연금수급자 현황(유족연금수급자) 데이터는 연금수급자 중 유족연금을 받는 수급자들의 수를 재직기간별(21년미만 ~ 33년 이상) 연령(37세 미만~95세 이상) 항목으로 구분하여 집계하여 제공합니다. 재직기간은 수급자가 재직당시 근무한 기간을 의미하며, 연령은 37세 미만부터 95세 이상으로 1세씩 증가하는 추이로 나누어 집계되었습니다. 이 데이터는 연금 수급자 추이 파악 및 제도 개선을 위한 기초 자료로 활용될 수 있습니다.이 데이터를 통해 사학연금 제도의 안정적인 운영 현황을 투명하게 공개하고, 유족들에 대한 복지 지원 실태를 명확하게 파악할 수 있도록 합니다.
