summary_user: 경기도 내 장애인생활이동지원센터(장애인심부름센터)를 센터 한 곳당 한 행으로 담은 현황 자료로, 시군·사업장명·인허가일자·운영 상태·폐업일자·종사자 수·자격 보유 인원·도로명/지번 주소·위경도를 포함한다. 이동약자 정책 담당자나 분석가가 "우리 시군에 운영 중인 장애인 이동지원 센터가 몇 곳이고 인력은 충분한가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드·시군명(SIGUN_CD)이나 주소·좌표를 기준으로 다른 경기도 복지시설·인구 자료와 이름 매핑이나 공간 결합으로 잇는다.
description_portal: 이 데이터는 경기도 내 장애인생활이동지원센터(일명 장애인심부름센터)의 운영 현황을 수록한 자료로, 센터별 인허가일자, 운영 상태, 종사자 수, 위치 정보 등을 포함하고 있습니다. 해당 시설은 이동에 제약이 있는 장애인의 외출과 생활 편의를 돕기 위한 이동지원 서비스를 제공하는 복지 거점으로, 본 자료는 경기도 내 각 센터의 지리적 분포 및 인력 구성 현황을 파악하는 데 활용됩니다. 주소 등 위치정보는 서비스 접근성 분석과 지역 간 불균형 해소를 위한 기반 자료로 활용될 수 있습니다. 이동약자 지원 정책, 복지교통서비스 설계, 복지 인프라 확충 전략 수립 등에 기초 자료로 유용합니다.
