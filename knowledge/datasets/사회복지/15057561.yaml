summary_user: 경기도 국민기초생활보장 장애인 수급자 수를 기준연도(STD_YY)·시군별로 집계해 총수와 10세 미만부터 80세 이상까지 10세 단위 연령대별 인원으로 담은 집계 데이터이며, 포털 설명상 매년 12월 말 기준입니다. 도·시군 복지 담당자나 분석가가 "우리 시군의 장애인 수급자는 고령층과 청년·중장년층 중 어디에 몰려 있는가"를 보고 돌봄·요양 또는 자립·고용 지원의 우선순위를 정하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 시군코드(SIGUN_CD)나 시군명으로 맞춰 경기도의 다른 시군 단위 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 국민기초생활보장 장애인 수급자의 연령별 분포 현황을 보여줍니다. 보건복지부와 사회보장정보시스템에서 제공하며, 매년 12월 말 기준으로 집계됩니다.데이터에는시군별 총 수급자 수연령대별 수급자 수 (10세 미만, 10대, 20대 … 80세 이상)등이 포함됩니다.이를 통해 특정 연령대에서 장애인 수급자가 집중되는 양상을 확인할 수 있습니다. 예를 들어, 고령층(60세 이상)의 수급자 수가 높다면 의료·돌봄·요양 중심의 복지 정책이 필요함을 의미합니다. 반대로 청년·중장년층(20~50대)의 수급자가 많다면 자립·고용·교육·주거 지원 정책이 더욱 효과적일 수 있습니다.또한, 이 데이터는 시군별 비교를 가능하게 합니다. 일부 시군에서 고령 장애인 수급자의 비중이 높을 경우, 해당 지역에는 노인복지시설, 방문간호, 주거환경 개선 사업 등이 필요할 수 있습니다. 반대로 청년층 수급자가 두드러지는 시군은 취업 연계 프로그램, 활동지원 서비스 강화가 요구될 수 있습니다.이 자료는 경기도 내 연령대별 장애인 복지정책 수립, 기초생활보장제도 운영평가, 시군별 맞춤형 예산 배분 등에 중요한 참고자료가 됩니다.
