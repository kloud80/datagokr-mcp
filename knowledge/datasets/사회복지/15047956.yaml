summary_user: 대구광역시 안의 청소년보호기관을 기관별로 한 행씩 담은 목록 파일로, 기관명·주소·전화번호·주요 상담 내용이 들어 있고 집계 통계가 아닌 시설 명단입니다(CSV 840바이트). 가출·학대·방임 같은 위기를 겪는 청소년이나 보호자, 상담 실무자가 '대구에서 이런 상담을 받을 수 있는 기관이 어디이고 연락처가 무엇인가'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 청소년 시설 데이터나 지역 통계와는 기관명·주소를 맞춰 대조해야 이어 쓸 수 있다.
description_portal: 청소년복지시설은 가출이나 학대, 방임 등 위기 상황에 처한 청소년을 조기에 발견하여 범죄 및 비행을 사전에 예방하고, 안전한 환경에서 의식주를 포함한 기본적인 생활을 보호합니다. 더불어 정서적 안정을 위한 상담 및 심리치료, 필요한 의료지원을 제공하며, 청소년의 상황과 욕구에 맞춘 맞춤형 자립지원서비스를 통해 학업 복귀나 진로 탐색, 취업 연계 등 실질적인 자립 기반을 마련할 수 있도록 돕습니다. 이를 통해 청소년이 빠르게 가정으로 복귀하거나 사회로 안정적으로 진출할 수 있도록 종합적이고 지속적인 지원을 제공합니다.
