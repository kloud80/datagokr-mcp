limits: 구 단위 월별 집계라 개인·가구별 지급 내역이나 2020년 외 연도 추이는 알 수 없다. 표준 행정코드가 없어 다른 지자체·통계와 결합하려면 구 이름을 시군구코드로 직접 맞춰야 한다.
