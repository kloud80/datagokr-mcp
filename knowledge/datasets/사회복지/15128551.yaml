description_portal: 전라남도 함평군은 자원 재활용 촉진과 마을단위 환경 정비를 위해 관내 헌옷수거함 설치 및 운영 현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 헌옷수거함의 설치 기관명, 관리주체, 설치장소 등의 항목으로 구성되어 있으며, 함평군 각 마을에 설치된 수거함은 해당 마을 이장님들께서 직접 관리주체가 되어 운영하고 있는 것이 특징입니다. 해당 데이터는 생활폐기물 분리배출 정책 수립, 마을환경 개선 사업 추진, 재활용 자원 회수 체계 강화 등의 행정적 활용뿐만 아니라, 민간 재활용 기업 및 환경단체의 협업 모델 구축, 지역 주민의 자발적 환경 참여 유도 등에도 실질적으로 활용될 수 있는 공공자원입니다.
