summary_user: 경기도 장애인 자립자금 대여의 신청·추천·금융기관 대출·미대출(진행·불가) 인원과 금액을 집계년도·시군·성별 단위로 모은 집계 자료이며, 대출 불가 주요 사유도 함께 담는다. 복지 분석가나 지자체 담당자가 '어느 시군에서 신청 대비 실제 대출로 이어진 비율이 낮고, 불가 사유는 무엇인가'처럼 금융 접근성과 지원 사각지대를 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군명이나 시군코드(SIGUN_CD)를 이름·코드로 맞춰 경기도 내 다른 시군 단위 통계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장애인의 자립을 돕기 위한 자립 자금 대여 현황을 집계한 자료입니다. 주요 항목은 집계년도, 시군명, 성별구분명, 대여신청 인원수 및 신청금액, 대여추천 인원수 및 금액, 금융기관 대출 인원수 및 금액, 금융기관 미대출 진행 인원수 및 금액, 금융기관 미대출 불가 인원수 및 금액, 대출 불가 주요 사유 등으로 구성되어 있습니다. 이를 통해 지역별·성별로 장애인 자립자금 지원 신청 및 실제 대출 진행 현황을 파악할 수 있으며, 정책 효과 분석, 복지 지원 사각지대 점검, 금융 접근성 연구, 자립 지원 정책 보완 등에 활용될 수 있습니다. 단, 금액 단위는 천원 기준으로 제공되며, 일부 항목은 금융기관 심사에 따른 미대출 사유가 포함되어 있어 해석 시 주의가 필요합니다.
