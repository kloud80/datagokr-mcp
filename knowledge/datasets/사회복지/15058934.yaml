summary_user: 경기도 장애수당 수급자를 기준연도(STD_YY)와 시·군별로 집계한 자료로, 시군 전체 수급자 수와 장애등급(1~6급)·장애정도(중증·경증)별 수급자 수, '해당 없음' 집계치를 담는다. 복지 담당자나 분석가가 '어느 시군에서 경증 장애 수급자 비중이 높은가'처럼 지역별 수급자 분포를 비교하는 데 쓴다. 전역 조인 키는 없으며, 시군코드(SIGUN_CD)나 시군명을 이름·코드로 매핑해 같은 경기도의 다른 시군 단위 통계와 연결한다.
description_portal: 이 데이터는 경기도 장애수당 수급자 현황을 시‧군별, 장애등급별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애수당은 만 18세 이상 3~6급 경증 장애인을 대상으로 지급됩니다. 데이터에는 각 시군별 전체 수급자 수와 함께 등급별·정도별 수급자 현황이 포함됩니다. 예를 들어, 1급·2급·3급 중증 장애 수급자와 3~6급 경증 장애 수급자가 구분되어 제공되며, ‘해당 없음’으로 분류된 집계치도 포함됩니다.이를 통해 장애등급별 수급자 분포 파악, 지역별 수급자 수 비교, 중증·경증 장애인 지원 정책 수립에 활용할 수 있습니다. 예를 들어 특정 시군에서 경증 장애인 수급자가 전체의 절반 이상을 차지한다면, 해당 지역의 재활·자립 지원 프로그램 확대 근거로 사용할 수 있습니다.
