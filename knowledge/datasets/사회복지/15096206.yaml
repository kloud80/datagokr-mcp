summary_user: 경기도 내 5개 노인보호전문기관이 접수한 노인학대 사례를 시군별로 집계한 통계로, 시군명(sigun_nm)마다 총사례수와 유형별 사례 수(일반·재가·시설로 보이는 구분)를 담는다. 도·시군 정책 담당자나 분석가가 '경기도에서 노인학대 사례가 많은 시군은 어디이고, 시설 학대 비중이 높은 곳은 어디인가'를 확인하고 예방 교육과 보호기관 자원 배분의 근거로 쓴다. 전역 조인 키는 없으므로 다른 시군 단위 통계(노인 인구, 노인복지시설 수 등)와는 시군명을 이름으로 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내 5개 노인보호전문기관에서 수집한 시군별 노인학대 사례 현황을 종합한 자료로, 경기도민(노인)의 인권보호 및 학대 예방 정책 수립에 필요한 통계를 제공합니다. 주요 항목에는 ‘시군명’을 통해 사례 발생 지역을 확인할 수 있으며, ‘총사례수’는 해당 지역에서 접수된 전체 노인학대 사례의 수를 나타냅니다. 이 데이터는 지역별 노인학대 양상 파악, 고위험 지역 선별, 예방 교육 및 홍보 전략 수립, 보호전문기관 자원 배분 등의 근거 자료로 활용될 수 있으며, 노인 인권 증진과 안전한 노후 환경 조성을 위한 기초통계로 활용할 수 있습니다.
