summary_user: 전라남도 해남군에서 전남다자녀행복카드로 할인·적립을 받을 수 있는 가맹점을 업체 한 곳당 한 행으로 담은 파일로, 업종·업체명·도로명/지번 주소·우대율·우대품목·연락처가 들어 있다. 다자녀 가정이 해남에서 카드 혜택을 받을 수 있는 업체와 할인 품목을 찾거나, 분석가가 군내 가맹점의 업종 분포를 살피는 데 쓴다. 전역 조인 키나 시군구 코드는 없으므로, 다른 시군의 같은 가맹점 현황이나 다자녀 지원 데이터와는 시군 이름이나 주소 문자열로 맞춰 이어 쓴다.
description_portal: 전라남도 해남군 다자녀행복카드 가맹점 현황에 대한 데이터입니다.이 데이터는 업종별, 업체명, 주소, 우대(퍼센트), 우대품목, 연락처 등의 항목을 제공하며 25년 11월 기준 총 88군데의 가맹점이 있습니다.전남다자녀행복카드는 전남에 주소를 두고 막내가 만 18세 이하인 다자녀(2자녀이상, 태아포함) 가정에서 발급할수 있습니다.카드 사용시 교육, 주유, 쇼핑, 영화, 놀이공원, 서적, 도내가맹점에서 각종 할인 및 적립이 가능합니다.해남군 다자녀카드 가맹점을 확인하시고 다양한 혜택 누려보기시 바랍니다.
