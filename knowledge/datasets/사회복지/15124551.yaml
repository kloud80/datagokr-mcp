description_portal: 이 데이터는 2012년 노인일자리 통계와 2023년 한국노인인력개발원 내부자료를 토대로, 지난 10년간 노인일자리 및 사회활동 지원사업 참여자의 전후 변화를 분석한 자료입니다. 특히 2012년과 2022년을 비교하여 성별, 연령별, 참여유형별로 분류된 참여자 현황과 특성을 담고 있으며, 노인일자리 사업이 어떤 방식으로 변화·확대되었는지를 종합적으로 보여줍니다. 이를 통해 노인들의 사회참여 양상과 경제활동 지속 의지가 어떻게 달라졌는지 확인할 수 있으며, 고령화 사회에서 정책적 대응 방향을 설정하는 데 기초 자료로 활용할 수 있습니다.
