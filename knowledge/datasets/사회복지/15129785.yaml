description_portal: 본 데이터는 한국가스공사 임직원들의 자발적 참여로 모금되는 사내 기부금 '온누리펀드'의 모금실적 정보를 제공합니다. 공공기관의 사회공헌활동 현황 공개와 나눔문화 확산을 목적으로 수집되었습니다. 데이터의 세부 항목으로는 연도별 참여인원(매년 1월 기준), 연간 모금액, 누적 모금액, 기부 용처, 지원 대상, 지원사업 등이 포함되어 있습니다. 본 데이터는 사회공헌 연구기관, CSR 담당자, 기부문화 연구자, 공공기관 사회공헌 담당자, 비영리단체, 사회복지공동모금회가 공공기관의 사회공헌 사례 분석에 활용할 수 있습니다. 공공기관의 사회적 책임 이행 현황 공유와 기부문화 활성화에 기여할 것으로 기대됩니다.
