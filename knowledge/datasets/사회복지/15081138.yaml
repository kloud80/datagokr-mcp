summary_user: 전주시 안의 노인복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·도로명/지번주소·위도·경도·전화·팩스·시설종류(경로당·복지관 등)를 기록한다. 전주시민이나 보호자가 '우리 동네 가까운 경로당이나 노인복지관이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시설종류별 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키가 없어 장기요양기관 등 다른 노인시설 데이터와는 시설명·주소로 맞추거나 위도·경도로 공간 결합해야 한다.
description_portal: '전주시에 존재하는 노인복지시설에 대한 현황입니다. 항목은 시설명, 도로명주소, 지번주소, 위도, 경도, 전화번호, 팩스번호, 시설종류로 이루어져 있습니다.자료: 노인복지과'
