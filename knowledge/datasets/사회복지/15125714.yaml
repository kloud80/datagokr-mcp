description_portal: 이 자료는 한국여성인권진흥원 성희롱·성폭력근절종합지원센터가 운영하는 직장 내 성희롱·성폭력 전화상담 및 피해자 지원기관 연계 현황을 연도별로 정리한 데이터입니다. 각 연도별 전화상담 건수와 더불어 상담지원, 법률지원, 의료지원 기관으로의 연계 건수를 포함하고 있어, 직장 내 성폭력 피해자에 대한 지원 체계의 규모와 변화 추이를 확인할 수 있습니다. 특히 전화상담을 시작으로 전문 기관과의 연계를 통해 심층적인 피해자 지원이 이루어지고 있음을 보여주며, 기관의 정책 대응 및 예방 교육 수립에 필요한 기초자료로 활용될 수 있습니다. 직장 내 젠더폭력 대응 현황을 통계적으로 파악하고 지원체계의 효과성을 검토하는 데에도 유용한 데이터입니다
