summary_user: 사립학교교직원연금법을 적용받는 학교·법인 기관을 한 기관당 한 행으로 담은 전국 목록 파일로, 기관명·학교급(유치원~대학교, 법인, 특수학교)·소재 지역·기관 상태·주소를 담는다(CSV 약 13.5KB). 연구자나 정책 담당자가 "어느 지역에 사학연금 적용 대학·고등학교가 몇 곳 있는가"처럼 학교급·지역별 적용기관 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 학교·기관 데이터와는 기관명이나 주소를 맞춰 연결하고, 지역별 사학연금 수급자 통계와는 시도 이름으로 묶어 쓴다.
description_portal: 사립학교교직원의 연금법 적용기관 현황과 관련된 데이터로 학교명, 기관명, 학교급(유치원, 초등학교, 중학교, 고등학교, 전문대학, 대학교, 법인, 특수학교), 소재지역(강원, 경기, 경남, 경북, 광주, 대구, 대전, 부산, 서울, 세종, 울산, 인천, 전남, 전북, 제주, 충남, 충북), 학교기관 주소 등의 항목으로 세분화하여 제공합니다. 해당자료는 기관들의 관할 범위와 연금법 적용 대상 기관을 명확하게 파악할 수 있도록 돕습니다.또한 연금법을 적용받는 학교기관 급별 관리에 사용될 수 있으며, 학교기관을 각 지역 소재지에 따라 효율적으로 관리할 수 있으며 관련 연구 및 정책 수립을 위한 기초 자료로로 활용 될 수 있습니다.
