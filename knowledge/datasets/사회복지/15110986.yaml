description_portal: '공무원연금공단에서 관리하는 지급대상별 사망조위금 지급 추이를 연도별로 집계한 데이터로, 1985년부터 기준년도까지의 자료를 제공하고 있습니다.지급대상은 공무원 및 배우자, 직계존비속, 배우자의 직계존비속이 해당되며, 연도별 지급 건수와 지급액을 통해 조위금 제도의 운영 규모와 변화 양상을 종합적으로 파악할 수 있도록 구성되어 있습니다.사망조위금이란 공무원이 사망하거나 공무원의 배우자나 부모(배우자의 부모 포함) 또는 자녀가 사망한 경우 국가나 지방자치단체가 부조적 차원에서 지급하는 급여입니다.* 법령개정("10.1.1)에 따라 지급대상 변경 : 본인, 배우자, 직계존속(배우자의 직계존속 부양시) → 본인, 배우자, 부모(배우자의 부모), 자녀'
