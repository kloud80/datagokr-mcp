summary_user: 사립학교교직원연금공단이 소유한 회관별로 회관명, 주소, 대표 연락처와 지하철·버스·기차·공항 이용 시 오시는 길을 한 행씩 담은 소규모 파일(csv 약 1.5KB)이며, 범위는 전국이고 위치는 개별 주소 단위입니다. 사학연금 가입자나 일반 이용자가 '가까운 사학연금 회관이 어디이고 대중교통으로 어떻게 가나'를 확인하거나, 분석가가 공단 보유 회관의 지역 분포를 파악하는 데 씁니다. 공통 조인 키나 코드는 없어서 다른 데이터와는 주소를 지오코딩하거나 행정구역명을 맞춰 지역 단위로 연결해야 합니다.
description_portal: 사립학교교직원연금공단이 소유한 보유회관의 상세 위치와 관련된 데이터로 회관명, 주소, 연락처와 대중교통 이용 시 오시는 길을 지하철, 버스, 기차, 공항으로 개별적인 데이터를 포함하고 있습니다. 각 회관 임대 시 위치, 상권, 대중교통 접근성 등 데이터를 기반으로 이용자들은 공단의 회관 위치를 쉽게 파악하고 방문 계획수립에 활용할 수 있습니다. 또한 공단은 보유자산의 투명성을 제고하고 효율적인 시설 관리에 기여할 수 있습니다.연락처는 각 회관별 대표 번호이며, 대중교통 이용 시 대략적인 시간 소요 데이터도 포함되어 있습니다.(특이 사항이 있을 때만 비정기적으로 바뀌는 정보로 수시 1회성 데이터로 전환)
