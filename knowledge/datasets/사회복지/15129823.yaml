description_portal: 본 데이터는 강원특별자치도 속초시의 65세 이상 단독세대 인구현황 정보를 제공하는 자료이다. 시민과 관계기관이 지역 내 고령 1인 가구의 인구 분포와 세대 현황을 쉽고 편리하게 확인할 수 있도록 연령별 인구수, 세대수, 지역별 현황 등 관련 정보를 정리하여 개방한다. 고령화 사회 대응과 복지정책 수립 지원을 목적으로 구축된 자료이며, 노인복지 정책 개발과 지역사회 돌봄 서비스 현황 분석 시 참고자료로 활용할 수 있다. 또한 지역 내 고령 단독세대 현황을 파악하여 복지 사각지대 예방과 행정서비스 개선에 기여하고자 한다. 데이터는 속초시 주민등록 인구통계를 기준으로 관리하며 관련 변동 사항을 반영하여 현행화한다. 이용자는 해당 정보를 통해 지역별 고령 단독세대 인구 현황과 분포 정보를 확인할 수 있다.
