description_portal: 임대주택 주거복지 커뮤니티 현황 데이터는 주택관리공단에서 관리하는 전국 임대주택 단지에서 운영되는 커뮤니티 프로그램의 실태를 파악하기 위해 구축된 자료로, 단지명·공급유형·세대수 등 기본정보와 분야·커뮤니티유형을 포함해 프로그램의 성격을 확인할 수 있습니다. 또한 문화예술공연여부, 외부공모사업여부, 업무협약여부 등을 통해 외부 협력 기반 여부를 파악하도록 구성되어 있습니다.운영 정보로는 커뮤니티명, 시작·종료일자, 장소명, 활동횟수, 활동내용, 소요비용분류, 예산주체 등이 제공되며, 이를 통해 활동 규모와 예산 구조를 분석할 수 있습니다. 국가·지자체·LH·민간 등 기관유형별 세부 참여자 정보를 포함해 다양한 기관·개인의 참여 현황을 파악할 수 있으며, 참여기관수도 함께 제공합니다.단지별 주거복지 커뮤니티 사업의 운영현황을 정량적·정성적으로 모두 분석할 수 있는 구조로 설계되어 있어 향후 주거복지서비스 확대, 사회적 고립 대응, 지역사회 통합돌봄 연계 등 다양한 정책 영역에서 활용할 수 있습니다.
