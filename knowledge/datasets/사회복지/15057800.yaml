summary_user: 경기도 국민기초생활보장 장애인 수급자를 시군별·기준연도별로 집계해 전체 수급자 합계, 장애등급(1~6급)별 수급자 수, 심한 장애인(중증)과 심하지 않은 장애인(경증) 수급자 수를 담는다. 복지 분석가나 지자체 담당자가 '경기도 어느 시군에 중증장애인 수급자가 몰려 있고 경증 비율은 얼마인가'를 비교해 돌봄·자립 지원 정책과 예산 배분을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)·시군명과 기준연도로 같은 기관의 다른 경기도 시군 통계와 이름·코드 매핑해 연결한다.
description_portal: 이 데이터는 경기도 내 국민기초생활보장 장애인 수급자의 현황을 보여줍니다. 보건복지부와 사회보장정보시스템에서 제공하며, 매년 12월 말 기준으로 집계됩니다.데이터에는시군별 전체 수급자 합계장애등급별 수급자 수(1급~6급)심한 장애인 수급자 수(중증)심하지 않은 장애인 수급자 수(경증)등이 포함됩니다.장애등급은 의학적 진단과 판정 기준에 따라 1급~6급으로 구분되며, 단계가 낮을수록 장애 정도가 심합니다. 따라서 이 데이터를 통해 경기도 내 어느 시군에 중증장애인 수급자가 집중되어 있는지, 경증장애인 수급자의 비율은 어느 정도인지 파악할 수 있습니다.또한, 장애등급별 현황은 단순한 수급자 수 이상의 의미를 갖습니다. 예를 들어 중증장애인 수급자 비율이 높을수록 추가적인 돌봄·의료·주거 지원 정책이 필요함을 시사합니다. 반대로 경증장애인 수급자가 많다면 자립생활 지원, 취업 연계, 활동지원 서비스 확대가 더 효과적일 수 있습니다.이 데이터는 지역별 맞춤형 복지정책 설계, 장애인 복지 예산 배분, 기초생활보장제도 운영 평가에 유용하게 활용될 수 있습니다. 특히, 경기도 내 시군별 차이를 비교함으로써 지역 간 복지 불균형 해소에도 중요한 자료가 됩니다.
