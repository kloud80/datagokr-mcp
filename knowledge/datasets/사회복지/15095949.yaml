summary_user: 대구광역시 북구에서 노인맞춤돌봄서비스(안전지원·사회참여·생활교육·일상생활지원)를 수행하는 기관의 목록을 기관 한 곳당 한 행으로 담으며, 기관명·상세 주소·행정동명·전화번호가 들어 있다. 북구에 사는 기초수급·차상위·기초연금 수급 어르신이나 가족, 사회복지 담당자가 '우리 동네 노인맞춤돌봄은 어느 기관에 문의하나'를 확인하는 데 쓴다. 전역 조인 키는 없어 행정동명(ADSTRD_NM)이나 주소·기관명으로 다른 노인복지시설·장기요양기관 목록이나 시군구 단위 지역 통계와 맞춰 이어 쓴다.
description_portal: 대구광역시 북구의 65세이상 국민기초생활수급자, 차상위계층 또는 기초연금 수급자로서 유사중복사업(노인장기요양보험 등급자, 가사간병 방문지원사업 이용자, 국가보훈부 보훈재가복지서비스 이용자, 장애인활동지원사업 이용자, 기타 국가 및 지방자치단체에서 시행하는 서비스 중 노인맞춤돌봄서비스와 유사한 재가서비스) 자격에 해당되지 않는 자를 대상으로  안전지원, 사회참여, 생활교육, 일상생활지원 서비스 등을 지원하는 노인맞춤돌봄수행기관의 데이터(권역구분, 기관 명, 상세 주소, 행정동 명, 전화번호)에 대한 정보를 제공합니다.
