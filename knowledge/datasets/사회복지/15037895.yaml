description_portal: 서울특별시 서초구 결식우려아동 급식지원제도 이용현황을 17개동 지원인원현황을 표시한 자료입니다. 지원 대상 연령은 18세 미만 취학 및 미취학 아동 (고교 재학 시 18세 이상도 가능)이고,소득/가구은기초생활수급자, 차상위계층, 한부모가족, 긴급복지지원 대상 아동이어야 하고, 가정환경은 보호자 부재(사망, 가출, 행방불명, 구금 등) 또는 보호자의 양육 능력 미약/방임 등으로 식사 제공이 어려운 경우에 지원대상이 됩니다. 지원 내용및 방식은 급식카드 (지드림/꿈나무카드)로 가맹점(일반음식점, 편의점, 제과점 등)에서 식사 후 카드 결제가 가능하고, 지원 단가는 서울시 기준 1식 9,500원 (2025년 기준)입니다. 식품권/도시락은 식사대용품 푸드팩 지원, 지역아동센터 운영 등을 통한 식사 제공을 하고 있습니다. 신청방법은 거주지 읍·면·동 행정복지센터(주민센터)에 방문신청을 해야하고, 온라인 신청은 복지로 홈페이지에서 가능합니다. 필요 서류는 아동급식 신청서, 식사 지원 필요 증빙자료(가족관계증명서, 소득증빙 등)가 필요합니다.  사업목적은 결식이 우려되는 아동에게 급식을 지원하여 결식문제를 완화하고 건강한 성장에 기여하기 위함입니다.
