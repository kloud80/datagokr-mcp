summary_user: 광주 지역 노인의료복지 생활시설(노인요양시설·노인요양공동생활가정)을 시설 한 곳당 한 행으로 담은 건별 목록으로, 시군구·시설종류·장기요양 지정 여부·입소정원과 남녀 입소인원·종사자수·도로명주소·설치일자·운영주체·휴업 여부를 담는다. 가족이 우리 구에 장기요양 지정을 받은 요양시설이 어디 있고 정원이 얼마인지 찾거나, 분석가가 자치구별 요양시설 정원 대비 공급 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록 등과는 시설명·주소로 맞춰 이어야 하고, 시군구 이름을 기준으로 지역 통계와 연결한다.
