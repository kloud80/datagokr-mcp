summary_user: 부산광역시 청소년 수련관·문화의집·상담복지센터 등 청소년시설이 운영하는 프로그램을 사업 단위로 담아 시설명, 사업명·사업내용, 교육대상, 모집인원, 운영시간, 교육장소, 수강금액을 제공한다. 부산의 청소년이나 학부모가 '우리 아이가 참여할 수 있는 무료 진로·여가 프로그램이 어느 시설에서 언제 열리는가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 청소년시설 목록이나 지역 통계와는 시설명 같은 이름 매핑으로만 이어 쓸 수 있다.
limits: 시설 코드나 주소·좌표 같은 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵고, 이름 매칭에 기대야 한다. 갱신 주기는 이벤트성(생성 후 불변)으로 분류되어 있어 현재 모집 중인 프로그램인지는 별도로 확인해야 한다.
