summary_user: 서울 서초구에 있는 경로당을 한 곳씩 담은 건별 목록으로, 동명·경로당명·도로명주소와 지번주소·면적·운영 여부·관리부서 연락처를 담는다(CSV 파일 약 24KB). 주민이나 복지 담당자가 '우리 동에 운영 중인 경로당은 어디이고 규모는 어느 정도인가'를 확인하거나 동별 어르신 생활권 시설 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 동명이나 주소 문자열을 맞추는 방식으로 이어 쓰고, 지역 단위 통계와는 시군구(서초구) 수준에서 연계한다.
description_portal: 서울특별시 서초구에 소재한 경로당 현황 시군구명, 동명, 경로당명, 도로명주소, 면적, 운영여부, 관리기관명, 관리부서명, 관리부서 전화번호, 데이터기준일자 정보를 제공하고 있습니다각 경로당은 행정구역 기준의 동명으로 구분되어 지역별 분포를 확인할 수 있습니다. 위치를 도로명주소와 지번주소로 표현하고 있습니다. 운영여부는 ‘Y’ 또는 ‘N’이라는 약어로 구분되어 경로당이 현재 운영 중인지, 아니면 운영이 중단되어 있는지를 명확히 알 수 있도록 되어 있습니다. 어르신 생활권 복지 인프라를 나타내는 데이터로서, 복지정책·공간계획·안전/재난·민간 서비스 연계까지 폭넓게 활용될 수 있을것 입니다.
