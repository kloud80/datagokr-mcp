summary_user: 국민연금기금이 연도 말 기준으로 보유한 해외채권을 종목별로 나열하고, 종목마다 투자금액(억 원)과 전체 해외채권 투자액에서 차지하는 비중(%)을 담은 파일 데이터입니다. 기금 운용을 분석하는 연구자나 국민이 '국민연금이 어느 나라 국채나 회사채에 얼마를 넣고 있는가'를 확인할 때 쓴다. 공통 종목코드 같은 전역 조인 키가 없어서, 다른 연금 투자·금융 데이터와는 종목명(종목명)을 이름으로 맞춰서만 연결한다.
description_portal: '국민연금기금의 해외채권 투자는 2001년 외화표시 한국채권에 대한 투자를 통해 개시된 이래 2002년 해외채권 직접운용을 통해 본격적으로 시작되었습니다. 제공하는 본 데이터는 국민연금의 해외채권 종목별 투자현황으로, 연도 말 기준 국민연금공단의 "해외채권 투자종목별 투자금액,국민연금의 전체 해외채권 투자금액에서 해당 종목에 대한 보유 금액이 차지하는 비중" 현황에 대한 정보입니다. (단위: 억 원, %)국민연금공단의 해외채권 투자정보는 국민연금공단 기금운용본부 홈페이지에서도 연간공시자료로 확인하실 수 있습니다. (알림-기금공시-기금공시 게시판-연간공시 섹터, 기금운용 성과평가 의결일로부터 40일 이내에 게시함).'
