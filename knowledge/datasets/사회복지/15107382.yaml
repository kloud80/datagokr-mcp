description_portal: 부산광역시 연제구 소재 종합사회복지관에 대한 데이터로 기관명, 주소, 연락처, 위탁법인 및 홈페이지 주소 등의 항목을 제공합니다.종합사회복지관은 지역사회를 기반으로 일정한 시설과 전문 인력을 갖추고 지역주민의 참여와 협력을 통하여 지역사회 복지문제를 예방하고 해결하기 위하여 종합적인 복지서비스를 제공하는 사회복지사업법에 의거한 사회복지시설로, 연제구에는 2개소(거제종합사회복지관, 연산종합사회복지관)의 종합사회복지관이 있습니다.또한, 종합사회복지관은 사회복지사업법 제34조의 5 및 같은법 시행규칙 별표3에서 정하고 있는 3대 기능(서비스제공기능, 사례관리기능, 지역조직화기능)을 균형있게 수행해야 합니다.
