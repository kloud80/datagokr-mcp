summary_user: 대전광역시 서구에서 0세아 전용으로 지정된 어린이집을 시설 한 곳당 한 행으로 담은 건별 현황 파일로, 유형(국공립·민간·가정 등), 지정연도, 0세 전용 지정 반 수, 주소, 전화번호, 원장명을 담는다. 서구에 사는 영아 부모가 "우리 동네에 0세 전용 반을 운영하는 어린이집이 어디에 있고 몇 반인가"를 찾거나, 분석가가 서구의 영아 보육 공급을 동별로 살피는 데 쓴다. 법정동코드(bjd_cd)를 키로 다른 법정동 단위 인구·시설 데이터와 이어 쓰고, 행정동코드도 함께 있어 행정동 단위 통계와 맞출 수 있다.
