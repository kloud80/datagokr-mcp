description_portal: 국민연금공단 징수 건보일일 수납현황에 대한 자료입니다.고지서 및 자동이체 납부 금액에 대해 상반기와 하반기로 구분한 자료이며, 입금액(D=A-B+-C),수납금액(A),수수료(B),오류정정(C)으로 구분하여 제공하고 있습니다.(데이터 건수가 많은 경우 모든 데이터가 표출 되지 않을 수 있습니다.) 매년 상반기 연간으로 업데이트 하고 있으며, 전년도 12월 31일 기준 자료를 제공하고 있습니다.※ (참고사항) 국민연금법 제88조에 의거하여 국민연금공단의 징수업무는 건강보험공단에 위탁하고 있습니다.
