summary_user: 국민연금공단이 징수를 위탁한 건강보험공단의 일일 수납 실적을 기준연도·상·하반기(구분)·수납방법(고지서·자동이체)별로 수납금액, 수수료, 오류정정, 이를 반영한 입금액으로 집계한 전국 단위 파일(CSV 약 7.7KB)이다. 연금 보험료가 고지서와 자동이체 중 어느 경로로 얼마나 걷히고 수수료로 얼마가 빠지는지 연도별로 비교하려는 분석가가 쓴다. 전역 조인 키가 없어 기준연도를 맞춰 같은 기관의 다른 통계와 나란히 놓는 식으로만 이어 쓴다.
