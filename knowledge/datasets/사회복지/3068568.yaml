summary_user: 전라남도 함평군 9개 읍·면(함평읍·손불면·신광면 등)에 있는 경로당을 한 곳씩 적은 목록으로, 경로당명·도로명주소·연락처와 구분 항목을 담은 개별 시설 단위 파일(CSV, 약 24KB)이다. 함평군 주민이나 가족이 집 근처 경로당의 위치와 연락처를 찾을 때, 분석가가 읍·면별 노인 여가시설 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 자료와는 도로명주소나 경로당명으로 맞춰 이어야 하고, 지역 통계와는 시군구(함평군) 단위로만 연결된다.
