summary_user: 부산광역시 서구의 어린이집을 한 곳씩 담은 건별 현황으로, 유형·운영 여부, 주소·연락처, 보육실 수와 면적·놀이터·CCTV 수, 보육교직원 수, 정원과 현원, 통학차량 운영 여부, 인가일자, 위도·경도를 포함한다. 서구에 사는 부모가 집 근처에서 현원이 정원보다 적고 통학차량을 운영하는 어린이집을 찾을 때, 또는 분석가가 서구의 보육 정원 대비 현원을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 어린이집명·주소 매칭이나 좌표(fcltLat, fcltLot)를 통한 위치 결합으로 이어 쓴다.
limits: 원시시스템 한계로 구군별로만 조회되어 부산시 전체를 한 번에 받을 수 없고, 이 데이터셋은 서구 범위다. 어린이집코드 같은 공통 식별 키가 실측 컬럼에 없어 평가·보육료 공시 등 다른 어린이집 데이터와 정확히 조인하려면 이름·주소 매핑이 필요하다.
