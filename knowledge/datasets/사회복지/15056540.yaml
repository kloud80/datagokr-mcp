summary_user: 경기도 내 발달재활 서비스 중심 사회서비스제공기관을 기관 1곳당 1행으로 담으며, 시군명, 기관명, 지번·도로명 주소, 우편번호, WGS84 위도·경도, 전화번호, 홈페이지 주소가 들어 있다. 발달지원이 필요한 아동의 보호자가 '우리 시군에 언어치료·행동발달 서비스를 하는 기관이 어디 있나'를 찾거나, 분석가가 시군별 기관 분포와 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)·시군명이나 주소·좌표 같은 이름·위치 기준으로만 다른 데이터와 맞춰 쓰고, 사업자번호·인증번호가 없어 기업 데이터와 직접 잇기는 어렵다.
description_portal: 이 데이터는 발달재활 서비스를 중심으로 사회서비스를 제공하는 기관의 현황을 정리한 자료입니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소 및 도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL이 포함되어 있습니다. 해당 기관들은 언어치료, 심리상담, 행동발달 훈련, 사회성 향상 프로그램 등 발달지원을 필요로 하는 아동·청소년 및 가족을 대상으로 다양한 서비스를 제공합니다. 이 데이터는 지역별 발달재활기관의 분포를 파악하고, 사회서비스 인프라의 접근성과 공급 현황을 평가하는 데 활용될 수 있으며, 복지정책 수립, 서비스 수요 예측, 아동·청소년 발달 지원 정책의 기초자료로도 중요한 역할을 합니다.
