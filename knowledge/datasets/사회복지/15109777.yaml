summary_user: 전국 청소년수련시설의 현황을 시설 단위로 담는 API로, 시설명·시설유형·운영주체·설립주체·정원(숙박·비숙박·야영)·주소·좌표·연락처·운영시간을 제공한다. 청소년 수련 인프라가 부족한 지역을 찾거나 우리 동네 수련시설의 정원과 운영시간을 확인하려는 정책 담당자·분석가·보호자가 쓴다. 도로명주소·지번주소(address)와 위도(lat, coord)를 키로 지도·지역 데이터와 잇고, 시도명·시군구명을 지역 단위 통계와 연결하는 데 쓴다.
limits: 검증 호출에서 전체 건수와 수신 행이 각각 1건뿐이라 실제 전체 규모는 이 근거로 확인되지 않는다. 갱신 주기는 선거 등 이벤트 때 생성되고 이후 변하지 않는 이벤트 주기로 기록돼 있어 최신 반영 여부는 따로 확인해야 한다. 이용률이나 프로그램 참여 같은 실적 정보는 필드에 없다.
