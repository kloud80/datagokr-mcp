description_portal: '○ 통계개요* 통계명 : 노인주거 복지시설* 통계종류 : 서울시 노인주거복지 생활시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「노인복지법」34조에 규정된 생활시설로 서울시에서 관리하는 시설* 작성목적 : 노인복지시설 설치신고를 마친 노인복지시설의 수, 입소정원을 집계하여적정수의 시설수요와 충족율을 분석하고 분석결과에 따른 정책 수립 및평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 어르신복지과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 노인주거복지 생활시설(양로시설, 노인공동생활가정,노인복지주택)의 시설수, 입소인원, 종사자수 등○ 용어설명* 노인주거복지시설 : 일상생활에 지장이 없는 노인이 입소하여 일상생활에 필요한 편의를제공받는 시설로 양로시설·노인공동생활가정·노인복지주택을 말함(노인복지법 제32조)* 양로시설 : 노인을 입소시켜 급식과 그 밖에 일상생활에 필요한 편의를 제공* 노인공동 생활가정 : 노인들에게 가정과 같은 주거여건과 급식, 그 밖에 일상생활에필요한 편의를 제공* 노인복지주택 : 노인에게 주거시설을 분양 또는 임대하여 주거의 편의?생활지도?상담 및안전관리등 일상생활에 필요한 편의를 제공○ 기 타* 유료 노인복지주택은 1세대에 한명 또는 여러명이 거주 가능함으로 입소정원이 없음* 노인복지주택 입소정원은 세대수임'
