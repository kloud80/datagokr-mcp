description_portal: 기부식품등 제공사업은 식품 및 생활용품의 기부를 활성화하고 기부된 식품 등을 생활이 어려운 자에게 지원함으로써 사회복지 증진 및 사회공동체문화 확산에 이바지 하는 사업으로 부산광역시 남구는 남구동행푸드마켓 및 남구기초푸드뱅크에 대한 명칭, 소재지, 전화번호, 운영인력, 기부물품 접수 건수 및 이용자 등에 대한 항목을 제공합니다. 기초푸드뱅크는 식품 및 생활용품을 기업 및 개인으로부터 기부받아 결식 위기에 놓인 저소득 취약계층 등에게 전달하는 사업장이며, 기초푸드마켓은  취약계층 등이 방문을 통해 필요한 식품 등을 선택하도록 기부식품등을 진열,배치 하는 사업장입니다.
