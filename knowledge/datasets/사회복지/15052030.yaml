summary_user: 경상북도 시·군에서 운영하는 경로식당 무료급식소를 시설 한 곳당 한 행으로 담은 파일로, 시·군, 급식소명, 소재지 주소, 1인당 주간 급식 횟수와 제공 요일을 포함한다. 어르신이나 보호자가 '우리 시·군에서 무료 점심을 주는 곳이 어디이고 일주일에 며칠 여는가'를 찾거나, 분석가가 시·군별 급식소 수와 제공 빈도를 비교하는 데 쓴다. 전역 조인 키는 없어 시·군 이름이나 주소 문자열로 지역 통계·노인복지시설 목록과 맞춰 이어 써야 한다.
