summary_user: 버스·도시철도차량·철도차량·항공기·여객선 같은 교통수단과 여객자동차터미널·버스정류장·도시철도역·철도역사 같은 여객시설별로, 교통약자 이동편의시설 종류마다 기준적합률·기준미적합률·미설치율을 정리한 전국 단위 집계표(xlsx 파일)다. 정책 분석가나 장애인 이동권 단체가 "어떤 교통수단이나 시설에서 어떤 편의시설의 미설치·기준 미달 비율이 높은가"를 비교해 개선 우선순위를 정하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 교통수단·시설 구분명과 편의시설 이름을 맞춰서만 이을 수 있다.
limits: 전국 단위 비율 집계라 개별 역·정류장·차량이나 지역별 현황은 알 수 없고, 건물관리번호·PNU 같은 건물 단위 키도 없다. 파일에 이름 없는 빈 열(Unnamed)이 섞여 있어 파싱할 때 정리가 필요하다.
