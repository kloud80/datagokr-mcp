summary_user: 결식우려아동이 아동급식카드를 쓸 수 있는 편의점·음식점 등 가맹점을 한 곳씩 담은 건별 표준데이터로, 가맹점명·유형, 도로명·지번 주소, 위도·경도, 평일·토요일·공휴일 운영시각, 배달시각, 관리기관 연락처를 담으며 검증 때 50,000행(데이터 기준 2026-05-12~2026-09-03)을 받았다. 급식카드를 쓰는 보호자나 아동이 '우리 동네에서 지금 문을 열었거나 배달되는 가맹점이 어디인가'를 찾을 때, 분석가가 시군구별 가맹점 분포와 취약 지역을 볼 때 쓴다. 시군구코드(sgg_cd)로 행정구역 통계와, 주소·좌표로 지도나 다른 시설 데이터와, 제공기관코드(행정표준 기관코드)로 관리 지자체 정보와 잇는다.
limits: 검증 수신 건수와 API 전체 건수가 모두 50,000건이고 수록 범위가 확인되지 않아, 전국 가맹점을 빠짐없이 담았다고 단정하기 어렵다. 실측 최신 행 날짜는 2026-09-03으로, 운영시각·폐업 여부는 이용 전에 가맹점이나 관리기관에 확인하는 것이 좋다.
