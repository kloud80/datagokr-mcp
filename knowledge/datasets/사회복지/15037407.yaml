summary_user: 서울 중랑구에 있는 노인의료복지시설(노인요양시설·노인요양공동생활가정)을 시설 한 곳당 한 행으로 담은 목록이며, 운영상태·장기요양기관기호·기관명·기관종류·급여종류·지정일자·주소·연락처가 들어 있습니다. 중랑구 주민이나 보호자가 가까운 요양시설과 공동생활가정을 찾을 때, 분석가가 구 안의 장기요양 시설 분포를 볼 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 장기요양기관기호나 기관명·주소를 맞춰 건강보험 장기요양기관 자료 등과 이어 쓴다.
description_portal: 서울특별시 중랑구노인의료복지시설(노인요양시설 및 노인공동생활가정) 현황입니다. 노인요양시설 11개소,(10인 이하 규모),노인요양공동생활가정 37개소(10인 이상 규모)연번,  운영상태, 장기요양기관번호, 기관명, 기관종류, 급여종류, 지정일자, 주소, 전화번호,  팩스번호를 제공합니다. (2025년 8월 22일)
