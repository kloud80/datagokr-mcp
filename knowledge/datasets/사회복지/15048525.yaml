summary_user: 광주 광산구 어등지역자활센터 이용자를 한 줄씩 담은 건별 명단형 파일로, 성별·출생연도·거주 행정동·이용일자를 읍면동 단위까지 담는다. 복지 담당자나 분석가가 "어느 행정동의 어떤 연령대·성별 주민이 자활센터를 많이 이용하는가"를 파악해 프로그램 기획이나 자원 배분 우선순위를 정하는 데 쓴다. 전역 조인 키가 없어 행정동 이름을 행정구역 코드에 이름으로 매핑하거나, 같은 광산구의 다른 지역자활센터·사회복지시설 현황과 기관 단위로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
