summary_user: 경기도 시·군별 장애수당 수급자 수를 매년 12월 말 기준으로 집계한 자료로, 기준년도·시군별로 전체 수급자와 기초생활수급자·시설수급자·차상위계층 수급자를 18세 미만, 18~64세, 65세 이상 연령대로 나눠 담는다. 복지 담당자나 분석가가 '우리 시·군의 65세 이상 장애수당 수급자는 몇 명이고 수급 유형별로 어떻게 나뉘는가'를 확인해 고령 장애인 지원이나 지역별 복지자원 배분을 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명(SIGUN_NM)이나 시군 코드(SIGUN_CD)를 이름·코드 매핑하거나 같은 경기도 데이터와만 연결한다.
description_portal: 보건복지부(사회보장정보시스템)에서 제공하는 경기도 장애수당 수급자 집계 현황(시‧군별, 수급자구분별, 연령구분별)입니다. 매년 12월 말 기준의 시군명, 수급자구분별 연령구분별 수급자 수를 제공합니다.이 데이터는 경기도 내 연령대별 장애수당 수급자 현황을 정리한 자료로, 주요 항목은 기준년도, 시군명, 연령대별 총 수급자 수(전체, 18세 미만, 18세 이상 64세 이하, 65세 이상), 기초생활수급자 수, 시설수급자 수, 차상위계층 수급자 수 등으로 구성되어 있습니다. 연령 구분과 수급 유형별 항목이 세분화되어 있어, 장애인 복지급여 수급 현황을 세밀하게 분석할 수 있습니다. 특히 18세 미만은 수급자가 거의 없고, 65세 이상이 높은 비중을 차지하고 있어 고령장애인의 경제적 지원 필요성을 강조할 수 있습니다. 본 데이터는 복지 정책 수립, 수급자 대상 서비스 설계, 고령·중증 장애인 지원 전략 마련, 지역별 복지자원 배분 계획 등에 활용되며, 자료는 보건복지부 및 지자체의 복지행정 시스템을 기반으로 수집된 공공통계입니다
