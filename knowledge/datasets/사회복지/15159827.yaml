description_portal: '서울시는 양육친화적 환경 조성을 위하여 서울시에 거주하는 양육공백(맞벌이, 한부모, 다자녀 등) 가정에 4촌 이내 친인척 돌봄 또는 민간 아이돌봄 서비스 비용을 지원 하는 서울형 손주돌봄수당 지원 사업을 운영하고 있습니다. 친인척형의 경우 조력자 월 40시간 이상의 돌봄 수행 시, 민간형의 경우 월 20시간 이상 돌봄 업체 서비스 이용 시 돌봄수당을 지급합니다. 서울형 손주돌봄수당 이용자의 이용 현황을 파악할 수 있는 서울형 손주돌봄수당 지원 사업 월별 신청 건수, 선정 건수, 유형별(친인척형, 민간형) 분류를 반영한 이용 건수 통계 자료입니다.※ 데이터 추출일에 따라 데이터 변동 있을 수 있습니다.※ 이용건수는 돌봄수당 지급건수로 산출하였으며 돌봄 활동월의 전월에 사업 신청, 돌봄 활동월의 익월에 돌봄수당을 지급합니다.(예시: 2023.9월, 2023년10월에 신청 시 각 활동월은 2023.10월, 2023.11월, 지급월 2023.11월, 2023.12월)'
