summary_user: 서울시 휴일보육 어린이집을 시설 한 곳당 한 행으로 담은 목록으로, 지역(자치구)명·읍면동, 어린이집 코드와 이름, 유형(국공립·민간·가정 등), 특성, 주소·전화·홈페이지, 인가일자, 정원과 보육서비스 정원을 포함한다. 주말·공휴일에 일하는 맞벌이·교대근무 부모가 '우리 동네에서 휴일에도 아이를 맡길 수 있는 어린이집이 어디고 정원은 얼마인가'를 찾는 데 쓰고, 분석가는 자치구별 휴일보육 공급 분포를 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 확인되지 않아 다른 어린이집 데이터와는 어린이집 코드(STCODE)나 시설명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 서울시 휴일보육 어린이집 현황을 정리한 자료로, 휴일에도 아동을 돌볼 수 있는 어린이집 정보를 제공합니다. 주요 항목에는 지역코드, 지역명, 읍면동명, 어린이집 코드와 명칭, 유형(국공립·민간·가정 등), 특성(휴일보육, 시간연장형, 장애아통합 등), 주소, 전화번호, 팩스번호, 홈페이지 주소, 인가일자, 정원, 보육서비스 정원 등이 포함되어 있습니다. 이 데이터는 맞벌이 가정이나 특수 근무 형태로 인해 휴일에도 보육이 필요한 가정에 중요한 참고 자료가 되며, 서울시의 보육 서비스 정책과 지원 체계 마련에 활용될 수 있습니다.
