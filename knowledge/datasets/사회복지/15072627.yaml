summary_user: 경기도 청년기본소득의 정책 대상자 수와 실제 신청자 수를 기준연도·분기·시군별로 집계한 통계로, 개인별 원천 기록은 담지 않는다. 분석가나 정책 담당자가 '어느 시군에서 대상 청년 대비 신청 비율이 낮은가'처럼 지역별 참여도와 정책 도달 수준을 비교하는 데 쓴다. 전역 조인 키는 없어서 시군명(sigun_nm)과 연도·분기를 이름 매핑해 시군별 청년 인구나 다른 경기도 시군 통계와 붙여 쓴다.
description_portal: 이 데이터는 특정 지역에서 시행되는 청년기본소득 정책의 수혜 현황을 시군 단위 및 분기별로 정리한 통계자료입니다. 각 연도와 분기에 따라 해당 지역의 청년 중 정책 대상자 수와 실제 신청자 수를 비교할 수 있는 구조로 되어 있으며, 이를 통해 정책에 대한 지역별 수요와 참여도, 실질적인 정책 도달 수준을 가늠할 수 있습니다. 데이터는 청년층의 경제적 자립 지원을 목표로 시행되는 정책의 효과를 모니터링하고, 향후 정책 개선 및 지역 맞춤형 청년 지원정책 수립을 위한 기초자료로 활용될 수 있습니다.※ 경기도 청년기본소득은 경기도 일자리플랫폼 잡아바(apply.jobaba.net)회원가입 후 신청이 가능하오니 참고해주시기 바랍니다.
