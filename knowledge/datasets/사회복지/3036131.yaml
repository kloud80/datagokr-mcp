summary_user: 전라남도 시군에 있는 소비자생활협동조합을 조합 한 곳당 한 행으로 담은 명부 파일로, 조합명·생협 종류·전화번호·주소를 담으며 파일 크기는 364바이트로 작다. 지역 주민이 가까운 생협을 찾아 연락하거나, 분석가가 전남 지역 생협의 종류별·시군별 분포를 확인하는 데 쓴다. 공통 조인 키(사업자번호·인증번호 등)가 없어 다른 사회적경제 데이터와는 조합명이나 주소 문자열을 맞춰서만 이어 쓴다.
description_portal: '- 전라남도 시군에 위치한 소비자 생활 협동 조합 (조합명, 종류, 전화번호, 주소 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도에는 소비자들의 권익을 보호하고, 지역 경제를 활성화하며, 지속 가능한 소비 문화를 확산하기 위해 다양한 소비자 생활협동조합이 운영되고 있습니다. 이들 조합은 소비자들이 직접 참여하여 생산과 유통에 관여함으로써 지역 특산물의 소비 촉진과 함께 소비자 중심의 경제 활동을 지원합니다.- 소비자 중심의 경제 활동 : 소비자들이 직접 참여하여 생산과 유통에 관여함으로써, 소비자 중심의 경제 활동을 지원합니다.- 지역 경제 활성화 : 지역 특산물의 소비 촉진과 지역 생산자의 지원을 통해 지역 경제를 활성화합니다.'
