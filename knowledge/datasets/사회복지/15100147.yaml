description_portal: 대전광역시 아동급식카드 가맹점 자료는 결식우려아동, 저소득층 아동 등에게 급식카드를 지원하는 사업의 일환으로, 대전광역시 내에서 아동급식카드를 사용할 수 있는 가맹점 리스트를 제공합니다. 이 자료에는 각 가맹점의 상호, 주소, 연락처 등 기본 정보가 포함되어 있어, 아동과 보호자가 가까운 위치의 음식점이나 편의점 등 다양한 업종에서 급식 카드를 편리하게 사용할 수 있도록 지원합니다. 최근에는 가맹점 수가 대폭 확대되어, 기존 일부 음식점 중심에서 BC카드 가맹점 연계로 2만 7천여 곳까지 늘어났으며, 카드 이용 단가도 8천 원(초중학생), 9천 원(고등학생)으로 인상되어 아동의 급식 선택권과 영양 균형 개선에 기여하고 있습니다.
