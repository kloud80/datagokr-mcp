summary_user: 사학연금공단이 인프라·부동산·사모투자 등 국내 대체투자 자산군별로 선정한 위탁운용사 이름을 기준일과 함께 나열한 목록으로, 2KB 남짓의 작은 CSV 파일(전국 단위, 비공간)이다. 금융업계 종사자나 분석가가 '사학연금 국내 부동산·인프라 자금을 어느 운용사가 맡고 있나'를 확인하거나 연기금 위탁운용사 선정 동향을 볼 때 쓴다. 전역 조인 키가 없어 운용사 이름(위탁운용사 필드)을 금융회사명으로 맞춰 금융·재정 데이터나 국민연금·군인연금의 위탁운용사 목록과 이어 보는 방식으로만 연결한다.
description_portal: 공단은 채권, 주식 등의 전통자산 외에도 기금의 수익률 제고, 포트폴리오 다각화, 분산투자를 통한 리스크 저감 등을 위해 부동산, 인프라, 사모주식 등의 대체투자 자산에 일정 비율로 투자하고 있습니다.선정결과에 따른 인프라, 부동산, 사모투자 등 국내 대체투자 자산군별 위탁운용사 정보를 전년도도말 기준으로 제공하고 있습니다.이 데이터를 통해 공단의 투자 포트폴리오 다변화 노력과 위탁 운용의 투명성을 제고하고, 기금 운용의 전문성과 건전성을 공개적으로 보여주고자 합니다. 또한, 국내 대체 투자 시장 분석 및 잠재 투자자들의 의사결정에 필요한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 자산 운용을 입증하고, 이해관계자들이 공단의 재무 건전성을 명확히 파악할 수 있도록 지원합니다.
