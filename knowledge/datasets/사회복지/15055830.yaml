summary_user: 전국 공동육아나눔터 430곳을 시설 한 곳당 한 행으로 담은 기관 현황 파일이며, 시도·시군구·도로명주소·운영기관·연락처를 싣는다. 내 지역에 가까운 공동육아나눔터가 어디에 있고 어느 기관이 운영하는지 찾는 부모나, 시도·시군구별 육아 지원 시설 분포를 보는 분석가가 쓴다. 도로명주소(address)를 키로 다른 시설 목록이나 지도·주소 데이터와 맞춰 보며, 시도·시군구는 지역 단위 집계에 쓴다.
description_portal: 전국 공동육아나눔터 현황 정보입니다. 해당 내용은 가족센터 홈페이지(familynet.or.kr)에서도 확인할 수 있습니다. 제공항목은 시도, 시군구, 주소(도로명), 운영기관, 연락처입니다. 자녀 돌봄을 위한 안전한 공간 제공과 부모 등 보호자와 자녀가 함께하는 프로그램 운영, 지역사회 주민이 함께하는 품앗이 돌봄 공동체를 구성･운영하며 이를 촉진하기 위해 다양한 활동을 수행하고 있습니다. 또한 아이들의 성장과 발달 단계에 맞는 다양한 놀이 프로그램을 개발하고 놀이 활동을 촉진할 수 있는 교구 등을 지원합니다. 이 데이터는 지역별 육아 지원 시설의 분포를 파악하고, 보육 정책 수립 및 관련 연구에 활용될 수 있습니다.
