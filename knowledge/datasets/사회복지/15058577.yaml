summary_user: 경기도 특수학급 교원 수를 기준년도와 학교유형(국립·공립·사립)별로 묶은 시도 단위 집계 자료로, 유치원·초·중·고·전공과 과정별로 특수교사(1정·2정), 일반교사, 재활·치료 관련 교사 등 자격별 인원을 담는다. 교육청 담당자나 분석가가 "경기도 공립 초등 특수학급에서 정교사 자격 특수교사 비율은 해마다 어떻게 바뀌었나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도(STD_YY)와 학교유형명을 이름으로 맞춰 붙이는 방식으로만 연결한다.
description_portal: 이 데이터는 교육부(특수교육통계)에서 제공하는 경기도 내 특수학급 교원 집계 현황을 정리한 자료로, 매년 6월 말 기준으로 학교유형별(국립·공립·사립) 교사 자격 및 학교과정별 교원 수를 제공합니다. 주요 항목에는 기준년도, 학교유형명, 전체인원수, 유치원·초등학교·중학교·고등학교·전공과 과정별 교원 인원수가 있으며, 교사 자격별로 특수교사(1정, 2정), 일반교사, 재활복지교사, 치료교육교사 등 세분화된 집계가 포함되어 있습니다. 이 데이터는 특수교육 대상 학생을 위한 교원 배치 현황을 분석할 수 있도록 지원하며, 학교유형별 교원 분포, 자격별 교사 비율, 과정별 교사 수요 분석 등에 활용될 수 있습니다.
team:
  dept: AI미래행정과
