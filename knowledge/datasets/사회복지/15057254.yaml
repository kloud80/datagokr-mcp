summary_user: 경기도 장애수당 수급자 수를 기준연도(STD_YY)와 시·군별로 집계하고, 전체 합계와 지체·뇌병변·시각·청각·언어·신장·심장·정신·자폐성 등 장애유형별 인원을 함께 담은 집계 자료다. 경기도 안에서 어느 시·군에 특정 장애유형 수급자가 많은지, 경증 장애인 지원 수요가 지역마다 어떻게 다른지를 살펴보는 복지 담당자와 분석가가 쓴다. 전역 조인 키는 확인되지 않아, 다른 시·군 단위 통계와는 시군 코드(SIGUN_CD)나 시군명을 이름·코드 매핑으로 맞춰 이어야 한다.
description_portal: 이 데이터는 경기도 장애수당 수급자 현황을 시‧군별, 장애유형별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 갱신됩니다.장애수당은 만 18세 이상 3~6급 경증 장애인에게 지급되는 수당으로, 지체·뇌병변·시각·청각·언어·정신·자폐성 등 다양한 장애유형별 수급자 수가 포함되어 있습니다. 각 시군별 전체 수급자 합계와 세부 유형별 인원이 제공되므로, 특정 장애유형의 수급 비중이 높은 지역을 파악할 수 있습니다.이를 통해 경증 장애인 복지 지원 현황 분석, 지역별 장애유형별 수급 격차 확인, 복지정책 우선순위 결정에 활용할 수 있습니다. 예를 들어, 특정 시군에서 청각장애 수급자가 상대적으로 많다면 청각 관련 복지서비스 강화에 정책적 근거로 사용할 수 있습니다.
