summary_user: 공무원연금공단이 관리하는 퇴직연금 수급자 수를 1982년부터 기준년도까지 연도별·직종별(정무직, 별정직, 일반직, 경찰소방, 교육직, 법관검사 등)로 집계한 전국 단위 파일이다. 연금 정책 분석가나 연구자가 '교육직·경찰소방 등 직종별 퇴직연금 수급자가 해마다 얼마나 늘었는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도(구분)나 직종 이름을 맞춰 연결하거나 같은 기관의 공무원연금 통계와 나란히 놓고 쓴다.
description_portal: 공무원연금공단에서 관리하는 공무원 직종별 퇴직연금 수급자 추이 데이터로 1982년부터 기준년도까지 연도별로 구분하여 제공하고 있습니다.1. 2000년까지의 기타에는 정무직, 공안직, 연구직, 지도직, 계약직 인원이 포함되어 있음2. 2000년까지의 별정직(국가)에는 국가별정직, 지방별정직, 군무원 인원이 포함되어 있음3. 2001년 이후 기타에는 위원회 등 상임위원과 전임직원, 기타직 공무원 등이 포함되어 있음4. 청원경찰은 2002년까지는 경찰·소방으로 2003년부터는 "기타"로 분류되어 있음5. 공중보건의는 해당자가 없으므로 제외함6. "별정직, 일반직"의 경우 2011년 이후 재직공무원의 직종관리체계를 변경함에 따라 지방직을 국가직으로 통합
