description_portal: 국민연금공단은 노후준비지원법에 따라 국민이 스스로 노후를 준비할 수 있도록 상담 및 교육서비스 등을 제공하여 안정된 노후생활을 지원하고 있습니다. 국민연금공단 중앙노후준비지원센터는 서비스 제공자 인력 양성 등 노후준비 지원사업을 기획·운영하고, 권역별 노후준비서비스팀의 전담인력(전문상담사·전문강사)은 진단·상담 및 교육 등 서비스를 제공합니다. 본 공공데이터는 국민연금공단 노후준비 상담의 비대면 접수 현황을 전국 7개 권역(서울북부, 서울남부, 경인, 대전세종, 광주, 대구, 부산) 내 40개 노후준비서비스팀별로 구분하여 제공합니다.
