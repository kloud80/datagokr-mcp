summary_user: 전주시 다함께돌봄센터를 센터 한 곳당 한 행으로 센터명·도로명주소·전화번호·데이터기준일자를 담은 시설 목록 파일(csv, 약 2KB)이다. 초등학생 자녀를 둔 부모가 우리 동네에서 방과 후 돌봄을 신청할 수 있는 다함께돌봄센터가 어디에 있고 어디로 전화하면 되는지 찾는 데 쓴다. 전역 조인 키가 없어 다른 돌봄·아동복지시설 데이터와는 센터명이나 도로명주소를 맞춰 이어 쓰고, 사회복지시설 공통 마스터를 참조해 함께 본다.
description_portal: '본데이터는 전주시 다함께돌봄센터 현황에 관한 자료입니다.  ∙ 지원대상 : 돌봄이 필요한 6세~12세 아동 혹은 초등학생    - 돌봄센터 이용 아동의 형제·자매로 그 형제·자매가 미취학 아동인 경우를 포함   ∙ 지원조건 : 소득수준과 무관    - 월 10만원 이내 이용료     - 급·간식 제공시 별도 수익자 부담 추가   ∙ 지원내용    - 돌봄기관이 충분하지 않은 지역의 아파트 커뮤니티센터와 공공시설의 유휴공간을 활용   - 돌봄교사 등 2~3명이 근무하면서 방과 후 학생들에게 독서지도와 놀이·체험 등 다양한 돌봄 프로그램 진행 ∙ 신청방법 : 다함께돌봄센터 유선 또는 방문신청'
