description_portal: 서울시 관악구 육아종합지원센터 교육 및 행사 정보는 영유아 부모, 어린이집, 보육교직원을 대상으로 하는 교육·프로그램·행사 안내 데이터입니다. 게시물번호는 각 글을 구분하는 고유 번호로 조회와 관리에 사용됩니다. 제목은 부모교육, 놀이·체험, 발달검사, 상담, 교직원 연수 등 핵심 내용을 요약한 항목입니다. 내용에는 대상, 일정, 장소, 인원, 신청 방법, 비용, 유의사항 등 실제 참여에 필요한 정보를 담습니다. 등록일시는 안내가 게시된 일시로, 모집 기간과 최신 여부를 판단하는 기준입니다. 작성부서는 담당 팀 또는 부서를 나타내며 문의 창구 역할을 합니다. 첨부파일갯수는 안내문, 일정표, 신청서, 포스터 등의 파일 개수를 뜻합니다. 첨부파일이름은 필요한 자료를 구분해 내려받도록 돕는 제목입니다. 첨부파일주소는 관련 파일을 직접 내려받는 링크입니다. 상세 내용 보기 주소는 목록보다 더 자세한 설명과 이미지를 볼 수 있는 개별 페이지 링크입니다.
