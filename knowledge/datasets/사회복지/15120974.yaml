description_portal: 한국청소년상담복지개발원에서 운영하는 청소년상담사 대상 연수의 장소 및 운영 방식 정보를 제공하는 데이터입니다. 본 데이터는 연수년도, 연수급수, 연수 차수, 연수방법, 연수기간, 연수장소 대분류, 연수장소 등으로 구성되어 있으며, 상담사 자격취득 또는 보수교육 등의 연수 계획을 체계적으로 확인할 수 있습니다. 제공되는 정보는 각 연수의 연도별 시행 내역과 대상 급수, 차수별 운영 일정, 집합 또는 비대면 등 연수방법 구분, 연수장소의 지역적 분포를 포함합니다. 이를 통해 연수 참여 대상자 및 교육기관, 관련 행정 담당자가 연수 준비 및 계획 수립에 참고할 수 있는 기반 자료로 활용될 수 있습니다. 본 데이터는 연수 운영의 투명성과 효율성을 높이기 위한 참고 정보로 공공데이터포털 및 청소년상담사 홈페이지에서 확인할 수 있습니다.
