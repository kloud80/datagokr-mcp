description_portal: 경기도 성남시 교통약자 보호구역 공공데이터 포털 > 데이터요청 > 공공데이터 제공신청으로 별도 제공요청시 담당자가 확인 후 메일 서비스로 제공하는 데이터 파일(CSV,SHP,Image)입니다.교통약자 보호구역 데이터는 어린이, 노인, 장애인 등 교통약자의 안전한 이동을 보장하기 위해 지정된 보호구역에 대한 위치 및 특성 정보를 담고 있는 자료입니다. 해당 데이터는 주로 어린이 보호구역(스쿨존) 등의 항목을 포함하고 있습니다. 교통사고 예방정책 수립, 보행환경 개선사업, 교통약자 이동권 보장 계획 등의 근거 자료로 활용됩니다. 특히 성남시와 같은 도시에서는 교통사고 다발지역과 보호구역 데이터를 연계해 교통안전 사각지대를 분석하고, 우선 정비 대상지를 선정하는 데에도 유용하게 사용되고 있습니다.
