summary_user: 성남시 안의 어린이·노인·장애인 보호구역을 한 구역씩 담은 건별 원천 파일로, 대상시설명·시설종류·도로명/지번 주소·위도·경도·관할경찰서·CCTV 설치 여부와 대수를 함께 담는다. 학부모나 보행환경 개선 담당자가 '우리 동네 학교·복지시설 앞 보호구역은 어디이고 CCTV는 몇 대 설치돼 있나'를 확인하거나, 교통사고 다발지역과 겹쳐 우선 정비 대상지를 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시군구코드나 주소·좌표 기반 공간 매칭으로 잇는다.
limits: 범위가 성남시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다. 건물관리번호·PNU 같은 공통 키가 없어 건물 단위 원장과 정확히 연결되지 않고, 주소 문자열이나 좌표로 매칭해야 한다.
