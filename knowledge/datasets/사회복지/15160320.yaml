description_portal: 부산광역시 부산진구에서 관리하는 마을기업의 현황 정보를 제공하는 공공데이터입니다. 본 데이터에는 마을기업명, 기업구분, 법인명, 법인형태, 소재지, 위치정보(위도·경도), 설립연월, 인증연월, 대표자명, 대표전화번호, 회원수, 목적사업, 주요상품 등의 항목이 포함되어 있습니다. 본 데이터는 지역주민의 정보 이용 편의를 높이고, 사회적경제 활성화와 지역경제 발전을 지원하기 위한 기초자료로 활용할 수 있습니다. 또한 예비창업자, 연구기관, 공공기관 및 민간기업에서 마을기업 현황 분석, 정책 수립, 서비스 개발 및 지역공동체 활성화 관련 업무에 활용할 수 있습니다.
