summary_user: 광주광역시에 설립 신고된 일반협동조합을 조합 한 곳당 한 행으로 담은 파일로, 조합명·상태·지역구분·소재지·조합유형·업종·품목정보·주요사업을 기록하며 범위는 시도 단위, 위치는 개별 주소 수준이다. 사회적경제 정책 담당자나 창업 준비자가 "광주 어느 구에 어떤 업종의 협동조합이 운영 중인가"를 확인하거나, 업종·지역별 협동조합 분포를 집계하는 데 쓴다. 실측 컬럼에 사업자번호·인증번호 같은 전역 조인 키가 없어, 다른 사회적경제·기업 데이터와는 조합명이나 소재지 주소를 맞춰 보는 방식으로만 연결한다.
limits: 사업자번호나 법인 코드가 없어 기업 정보·사회적기업 인증 데이터와 정확히 1:1로 연결되지 않으며, 이름·주소 매칭에서 오차가 생길 수 있다. 수록 범위는 광주광역시에 한정된다.
