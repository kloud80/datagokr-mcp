summary_user: 서울 양천구가 장애인 전용 주차구역 불법 주차 단속을 위해 설치한 센서의 위치를 설치 장소별로 담은 파일로, 설치일·위도·경도·권역·장소·주소·설치수량·운영여부를 개별 주소·좌표 단위로 담는다(약 4KB CSV). 주민이나 장애인 운전자가 '우리 동네 어느 장애인 주차구역에 단속 센서가 설치돼 운영 중인가'를 확인하거나, 분석가가 권역별 센서 배치 현황을 지도로 볼 때 쓴다. 공통 조인 키는 없어서 다른 데이터와는 주소나 위도·경도 좌표를 기준으로 장애인 편의시설·주차장 데이터와 공간 매칭해 이어 쓴다.
description_portal: 서울특별시 양천구는 장애인 주차구역의 불법 주차 단속을 위해 설치된 센서 위치 정보를 체계적으로 관리하고 시민에게 공개하기 위하여 본 데이터를 개방한다. 본 데이터는 장애인주차단속센서의 설치일, 위도값, 경도값, 권역, 장소, 주소, 설치수량, 구분, 운영여부, 데이터기준일 등 상세 정보를 포함한다. 이를 통해 장애인 전용 주차구역의 효율적 관리와 불법 주차 예방에 기여하며, 시민과 행정기관 모두가 관련 정보를 신속히 확인할 수 있다. 데이터는 정기적으로 갱신되어 최신성을 유지하며, 장애인 주차 편의 증진과 지역사회의 질서 유지를 도모한다.
