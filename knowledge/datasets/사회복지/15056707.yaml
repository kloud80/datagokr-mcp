summary_user: 경기도 전일제 통합학급(일반학급)에 배치된 특수교육대상 학생 수를 기준연도와 학교유형(국립·공립·사립)별로 나누고, 유치원 3~5세와 초·중·고 학년별로 집계한 시도 단위 통계입니다. 교육 행정가나 분석가가 "경기도에서 통합학급 특수교육대상 학생이 어느 학년에 몰려 있고, 초→중·중→고 이행기에 얼마나 줄어드는가"를 확인할 때 씁니다. 실측 컬럼에는 전역 조인 키가 없어서, 기준연도(STD_YY)와 학교유형명을 맞춰 같은 기관의 다른 특수교육 통계와 이름 기준으로만 연결합니다.
description_portal: '본 데이터는 교육부 특수교육통계에 기반하여, 경기도 내 전일제 통합학급에 배치된 특수교육대상 학생 수를 학교유형(국립, 공립, 사립) 및 학년별(유치원 3세~5세, 초등학교 1~6학년, 중학교 1~3학년, 고등학교 1~3학년)로 구분하여 매년 6월 말 기준으로 집계한 자료입니다. 주요 항목은 ‘기준년도’, ‘학교유형명’, ‘총학생수(명)’, ‘유치원전체학생수(명)’, ‘초등학교1학년학생수(명)’, ‘중학교3학년학생수(명)’, ‘고등학교3학년학생수(명)’ 등으로 구성되어 있으며, 학제별로 세분화된 통계를 통해 통합교육의 연령별 분포와 학년별 집중도를 분석할 수 있습니다. 본 자료는 학교급별 특수교육 수요 분석, 학년별 교육 지원 전략 수립, 전환기 교육 설계(예: 초중고 이행기), 교육예산 분배 및 인력 배치 기획 등에 활용할 수 있으며, 특수교육 대상자의 교육 이수 흐름 파악에도 유용합니다.'
