summary_user: 경기도 내 중증장애인자립생활지원센터를 한 행에 한 곳씩 담은 시설 목록으로, 기관명·전화번호·홈페이지와 지번·도로명 주소, 우편번호, WGS84 위경도 좌표를 포함한다. 장애인 당사자나 가족이 우리 시군에서 가까운 자립생활지원센터와 연락처를 찾거나, 분석가가 시군별 센터 분포와 복지 인프라 격차를 지도로 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 시군 코드·시군명(SIGUN_CD) 같은 이름·코드 매핑이나 주소·좌표 기반 공간 결합으로 다른 시군 단위 통계와 잇는다.
description_portal: 이 데이터는 경기도 내 중증장애인의 자립생활을 지원하기 위해 설치된 자립생활지원센터(Center for Independent Living, CIL)의 현황을 나타낸 것입니다. 각 센터의 기관명, 주소(지번 및 도로명), 우편번호, 전화번호, 홈페이지 URL 등 기본 정보와 함께 위도 및 경도 좌표(WGS84)를 포함하여 공간 분석 및 네비게이션 등에 활용이 가능합니다. 자립생활지원센터는 중증장애인의 일상생활 자립, 권익 옹호, 지역사회 통합을 위한 서비스를 제공하는 시설로, 경기도장애인복지종합지원센터(누림센터)에서 데이터를 관리합니다. 특히 본 데이터는 복지정책 수립, 복지 서비스 접근성 분석, 지역 간 복지 인프라 격차 분석 등에 유용하며, GIS 기반 분석을 통해 시군별 자립생활지원센터 분포도 시각화도 가능합니다.
