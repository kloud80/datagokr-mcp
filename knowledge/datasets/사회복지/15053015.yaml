summary_user: 공무원연금공단이 관리하는 공무원 퇴직자 수를 17개 광역자치단체와 성별로 나누고, 정무직·일반직·경찰·소방·교육직·군무원·공중보건의 등 직종별 열로 집계한 표로, 1980바이트 규모의 작은 CSV 파일 하나다. 연금·인사 분석가가 '어느 시도에서 경찰·소방·교육직 같은 특정 직종 퇴직자가 많이 나오는가'를 비교하거나 지역별 퇴직 인력 규모를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 시도명(지역)을 이름으로 맞춰 다른 지역 통계나 같은 기관의 지역별 연금 수급자 표와 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 퇴직자 현황을 직종별 및 지역별로 구분하여 집계한 데이터로, 지역별로 공무원이 어떤 직종에서 주로 퇴직하고 있는지를 파악할 수 있도록 구성되어 있습니다.데이터는 전국 17개 광역자치단체(서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주)를 기준으로, 성별 정보와 함께 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의,기타 등  직종별 퇴직자 수가 포함되어 있습니다.특정 직종의 퇴직 집중 지역 파악, 지역별 퇴직 인력의 재배치 수요 예측 분석 등에 활용될 수 있습니다.
