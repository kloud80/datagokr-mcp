summary_user: 도로교통공단 자료를 바탕으로 12세 이하 보행 어린이 교통사고가 자주 난 지점(다발지역)별로 사고 건수, 사상자·사망자·중상자·경상자·부상신고자 수와 위치(경도·위도, 다발지역 폴리곤)를 담은 전국 범위의 집계 데이터다. 지자체 교통안전 담당자나 학부모·분석가가 '우리 동네 어린이 보행사고가 몰리는 곳은 어디이고 피해가 얼마나 큰가'를 확인하고 스쿨존·보행환경 개선 우선순위를 정할 때 쓴다. 실측상 전역 조인 키는 확인되지 않아 법정동코드(STDG_CD)·시도시군구명 같은 이름·코드 매핑이나 좌표 기반 공간 결합으로 다른 사고·시설 데이터와 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 도로교통공단에서 제공하는 12세이하 보행어린이 사고 관련 정보입니다.
