summary_user: 전북특별자치도 진안군 안에서 운영하는 어린이집을 한 곳당 한 행으로 담은 개별 시설 목록으로, 이름·유형·정원·보육교직원 수·도로명주소·전화·보육실·놀이터·CCTV 수·통학차량 운영 여부를 담는다(파일 약 1KB 규모). 진안군에 사는 부모가 입소 전에 "우리 동네 어린이집 중 통학차량을 운영하고 CCTV와 놀이터를 갖춘 곳은 어디인가"를 비교할 때 쓴다. 어린이집코드 같은 전역 조인 키가 없어 다른 보육 데이터(평가·보육료 공시 등)와는 어린이집명이나 도로명주소를 맞춰 이어 써야 한다.
description_portal: 전북 특별자치도 진안군의 어린이집에 대한 공공데이터 자료입니다. 이번 자료에서는 진안군 안에서 운영하는 어린이집 이름, 어린이집 유형 구분, 정원 수, 보육 교직원 수, 어린이집이 있는 장소의 주소, 어린이집의 전화번호와 팩스 번호, 보육실 수, 놀이터 수, CCTV 설치 대수, 통학 차량 운영 여부 등의 정보를 제공합니다. 이 자료를 통해 아이를 어린이집에 입학하기 전 어린이집에서 보유하고 있는 보육실 수나 놀이터 수나 CCTV 보유 현황을 파악할 수 있습니다. 그리고 유형 구분을 통해 어린이집이 어떤 유형으로 운영하는지 확인할 수 있습니다.
