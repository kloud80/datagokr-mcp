summary_user: 제주특별자치도 내 마을기업의 지정 연도, 기업명, 사업장 주소, 사업 내용을 기업 한 곳당 한 행으로 담은 현황 목록이며, 포털 설명상 2021년 기준 자료다. 주민 단체나 정책 담당자가 '제주에서 관광·농어촌 분야 마을기업은 어디에 몇 곳 있고 무슨 사업을 하나'를 확인할 때 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어서, 다른 사회적경제 기업 데이터와는 기업명이나 주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 이 데이터셋은 2021년을 기준으로 제주특별자치도에서 공개한 ‘마을기업’ 현황 정보로, 제주 도내에서 운영 중인 마을기업의 기업명, 사업장 주소, 그리고 주요 사업 내용이 체계적으로 정리된 공공데이터이다. 제공 형식은 CSV이며, 데이터는 지역 주민 중심의 경제활동, 농어촌·관광·문화·유통 등 다양한 분야에서 활동하는 공동체 기반 기업들의 분포와 사업 내용을 한눈에 파악할 수 있도록 구성되어 있다. 이 자료는 지역 공동체 활성화, 사회적경제 정책 수립, 지역 일자리 창출, 마을 단위 경제 발전, 관광 및 농어촌 개발, 지역 브랜드화 전략, 주민참여형 사업 기획 등에 활용될 수 있는 기초 통계로 기능한다. 또한 해당 정보를 바탕으로 마을기업 유형별 분포, 지역별 활성화 수준, 산업 분야별 사업 현황 등의 분석을 통해 정책 입안자, 지자체, 연구자, 주민 단체 등이 제주 지역의 사회적경제 현주소를 객관적으로 이해하고 향후 개발 방향을 설계하는 데 유용하다.
