summary_user: 기장군이 추진하는 장애인 일자리사업을 일자리 유형(전일제·시간제·복지일자리·시각장애인안마사파견)별로 임금, 근로시간, 배치기관, 추진내용, 사업기간과 함께 정리한 소규모 현황 파일(CSV 575바이트)이다. 기장군에서 장애인 일자리를 찾는 주민이나 정책 담당자가 "어떤 유형의 일자리가 어디에 배치되고 임금·근로시간은 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 배치기관명 같은 이름 매핑이나 같은 기관(기장군) 기준으로만 이어 쓴다.
description_portal: '기장군에서 추진하는 장애인 일자리 사업 현황에 관한 기본정보를 제공하는 데이터입니다.본 데이터는 일자리 유형, 임금, 근로시간, 배치기관, 사업 추진내용, 사업기간 등을 포함하며, 장애인 근로자의 안정적인 고용기회 확대와 사회참여 증진을 목적으로 합니다.- 사업유형 : 전일제, 시간제, 복지일자리, 시각장애인안마사파견- 배치기관 : 행정복지센터, 우체국, 비영리사회복지시설 등- 사업진내용 : 행정도우미, 환경정비, 장애인주차구역 단속 등이를 통해 장애인에게 적합한 일자리 발굴과 맞춤형 배치를 지원하고, 유관기관 및 정책 담당자가 현황을 파악하여 제도 개선 및 신규 사업 발굴에 활용할 수 있습니다.'
