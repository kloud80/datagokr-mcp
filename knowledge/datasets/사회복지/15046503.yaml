description_portal: '○ 통계개요* 통계명 : 적십자회비 모금 및 구호실적* 통계종류 : 서울시 적십자회비 모금 및 구호실적을 자치구 별로 제공하는 일반ㆍ보고통계* 작성목적 : 자치구별로 적십자회비모금을 통한 재해 이재민과 저소득층 주민구호,지역 보건사업 등 어려운 이웃들에 대한 인도주의 구호활동을 전개하고정책을 시행하기 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 대한적십자사 서울지사* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 자치구별 회비모금액과 재해구호와 일반구호, 특수구호의 세대와금액의 현황'
