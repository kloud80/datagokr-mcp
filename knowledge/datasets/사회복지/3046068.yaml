summary_user: 국민연금 보험료 징수 수납을 수납기관별·수납 방식(자동이체·카드·가상계좌 등)별로 나눠 입금액, 수납액, 정정·추가·삭제분, 수수료, 차감금액을 담은 전국 단위 집계 파일입니다. 연금 재정 분석가나 연구자가 "어느 수납기관·방식으로 보험료가 얼마나 들어오고 수수료는 얼마나 나가는가"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수납기관 이름 매핑으로만 연결한다.
description_portal: 국민연금 징수 수납 기관별 입금전문 현황통계에 대한 자료입니다.자동이체, 카드 수납, 가상계좌 수납 등의 정보를 제공하고 있습니다. 입금액(A=B+C+D-E-F+G),수납액(B),정정분(C),추가분(D),삭제분(E) ,수수료(F),차감수수료(G),차감금액(H=C+D-E)으로 구분하여 자료를 제공하며(데이터 건수가 많은 경우 모든 데이터가 표출 되지 않을 수 있습니다.) 매년 상반기 연간으로 업데이트 하고 있으며, 전년도 12월 31일 기준 자료를 제공하고 있습니다.※ (참고사항) 국민연금법 제88조에 의거하여 국민연금공단의 징수업무는 건강보험공단에 위탁하고 있습니다.
