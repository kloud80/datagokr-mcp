description_portal: 이 데이터는 장기간에 걸쳐 산재보험 직업재활급여와 관련된 직업훈련 및 각종 지원사업의 실적을 연도별로 집계한 통계 자료입니다. 직장 복귀 지원금, 직장 적응 훈련비, 재활 운동 지원금 등 재활 관련 급여 지급 현황은 물론, 직업 훈련 지원, 합병증 진료 카드 발급, 직장 복귀 지원 현황 등 다양한 항목별 통계를 포함합니다. 특히, 2023년에는 "내일찾기 서비스 승인 후 최초 상담" 항목이 "내일찾기 서비스 사회 복귀 지원 상담"으로 통합 및 개편되었습니다. 이 자료의 빈칸은 해당 연도에 해당 사업이 없었거나 통계가 집계되지 않았음을 의미합니다. 이 통계는 산재 근로자의 사회 복귀를 위한 공단의 재활 지원 규모와 그 효과의 추이를 심층적으로 파악하는 데 필수적인 근거 자료입니다.본 데이터는 산재 근로자의 복지 및 재활 정책 연구에 가장 핵심적인 자료입니다. 정책 입안자는 이 자료를 활용하여 직업 훈련의 수료율 및 취업자 수 변화를 분석하여 재활 프로그램의 성과를 객관적으로 평가할 수 있으며, 장해 등급별 지원 현황을 검토하여 중증 재해 근로자에 대한 지원이 적절한지 판단하고 개선 방안을 모색할 수 있습니다. 또한, 합병증 예방 관리 제도의 지급액 변화를 분석하여 만성기 재해 근로자에 대한 공공 의료 지원의 효율성을 검증하는 데에도 기여할 수 있다고 판단됩니다.
