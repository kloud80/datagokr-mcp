description_portal: 부산광역시 동구  관내  노인복지시설 현황 자료입니다.  시설은 노인여가복지시설(노인종합복지관), 재가노인복지시설(방문요양, 방문목욕, 복지욕구), 노인의료복지시설(요양원 등)으로 분류하였습니다. 해당 시설에 대한 시설명, 시설의 운영주체(개인 또는 법인_법인 해당 명칭), 주소지 및 설립일자 등의 정보를 제공하고 있습니다.  이를 통해 시설의 분포, 운영주체, 이용밀집도를 유추할 수 있습니다. 또한  재가노인복지설은 국민건강보험공단과 연계하여 정보를 제공하고 있습니다. 해당 기관 및 이용대상자의 자격 정보 등은 국민건강보험공단 장기요양보험(https://www.longtermcare.or.kr/npbs/indexr.jsp)사이트에서 보다 많은 정보를 제공하고 있습니다.
