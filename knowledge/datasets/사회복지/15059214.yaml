summary_user: 전국 장애아동수당 수급자 수와 경기도 수급자 수, 그리고 전국 대비 경기도 비율(%)을 연도별(기준연도 STD_YY)로 담은 시도 단위 집계 자료다. 경기도 장애아동 복지 담당자나 분석가가 "전국 수급자 가운데 경기도 비중이 해마다 늘고 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 시도명으로만 맞춰 붙일 수 있고, 같은 기관의 장애수당·장애연금 등 다른 수당 집계와 연도 기준으로 나란히 비교하는 정도로 이어 쓴다.
description_portal: 이 데이터는 전국 장애아동수당 수급자 수 대비 경기도 수급자 수 현황을 제공하는 집계 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 전국 장애아동수당 수급자 수, 경기도 수급자 수, 그리고 **전국 대비 경기도 수급 비율(%)**을 산출합니다.장애아동수당은 만 18세 미만의 아동 중 중증 및 경증 장애인을 대상으로 지급되는 복지 수당으로, 이 데이터는 경기도가 전국에서 차지하는 비중을 파악할 수 있도록 구성되어 있습니다. 예를 들어, 특정 연도에 전국 수급자 수가 증가하더라도 경기도 비율이 감소할 수 있는데, 이는 타 시·도의 수급자 증가율이 더 높음을 의미합니다.이 자료는 지역 간 장애아동 복지 지원 수준 비교 및 경기도의 복지 수요 추세 분석에 활용될 수 있습니다. 또한 장애아동수당 외 다른 복지 수당(장애수당, 장애연금 등) 데이터와 연계하면 아동·청소년 장애 복지 정책 평가 및 예산 편성 근거로 활용이 가능합니다.
