summary_user: 국민연금기금이 연도 말 기준으로 보유한 국내채권을 발행기관별로 묶어 평가액(억 원)과 국내채권 자산군 내 비중(%)을 담은 집계 파일이다. 연금 가입자나 분석가가 "국민연금이 어느 기관이 발행한 채권을 얼마나 들고 있는가"를 확인하거나 특정 공사·은행·기업 채권에 대한 기금 노출도를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 발행기관명을 이름으로 맞춰 기업·금융기관 데이터나 국민연금 국내주식 투자정보와 연결해야 한다.
description_portal: '국민연금기금의 국내채권 투자는 기금이 설치된 1988년부터 시작되었습니다. 제공하는 본 데이터는 국민연금의 국내채권 발행기관별 투자 현황으로, 연도 말 기준 국민연금공단의 "국내채권 투자 발행기관별 평가액, 자산군 내 비중" 투자 현황에 대한 정보입니다. (단위: 억 원, %)국민연금공단의 국내채권 발행기관별 투자정보는 국민연금공단 기금운용본부 홈페이지에서도 연간공시자료로 확인하실 수 있습니다. (알림-기금공시-기금공시 게시판-연간공시 섹터, 기금운용 성과평가 의결일로부터 40일 이내에 게시함).'
