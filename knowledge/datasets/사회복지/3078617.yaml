description_portal: '지역아동센터의 명칭, 주소, 정원, 아동복지교사 배치 현황 등을 정리한 자료.취약계층 아동의 보호, 교육, 상담 등 복지 서비스를 제공하는 돌봄시설 정보로, 아동복지 정책 수립 및 운영실태 파악의 기초자료로 활용됨.활용 목적 및 특징– 지역별 아동센터 분포 및 정원 규모 분석을 통한 돌봄 인프라 진단– 아동복지교사 배치 인원 및 파견일수 현황 파악 가능– 돌봄 공백 해소 및 복지 대상 아동 지원정책 수립 기반 마련– 관할 행정동 단위의 운영실태 분석 및 시설 지원 우선순위 설정주요 항목 설명● 시설명: 지역아동센터의 명칭● 관할동: 해당 시설이 속한 행정동● 도로명주소: 센터의 도로명주소● 연락처: 센터 대표 전화번호● 정원: 해당 아동센터에 수용 가능한 정원 수● 아동복지교사 배치인원(파견일수): 복지교사 수 및 해당 인원의 파견 기간 정보'
