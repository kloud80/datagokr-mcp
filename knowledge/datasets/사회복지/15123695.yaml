description_portal: 중증장애인직업재활지원사업은 중증장애인의 직업재활을 통해 자립기반 마련 및 사회참여를 증진하고 사각지대 없는 촘촘한 직업재활서비스를 제공하기 위하여, 지역사회 내 직업재활사업수행기관을 지정하고 장애인의 생애주기에 따른 전문적이고 체계적인 직업재활서비스를 지원하는 사업입니다.중증장애인직업재활지원사업은 진단·평가, 교육·훈련 및 자립지원정책 등의 차원에서 접근하는 명실상부한 종합적인 직업재활서비스를 제공함으로써 중증장애인의 보호고용 또는 일반노동시장으로 취업을 지원하고 이를 통하여 사회적·경제적 활동에 동등한 사회구성원으로 자리매김하는데 목적이 있습니다.중증장애인직업재활지원사업 수행기관 대상으로 실시하는 교육정보로 교육유형, 교육시작일, 교육종료일, 교육명, 교육대상 등의 정보를 제공합니다.
