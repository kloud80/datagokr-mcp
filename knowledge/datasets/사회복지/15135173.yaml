summary_user: 경기도 워라밸링크 플랫폼 이용자가 남긴 서비스 이용 후기를 건별로 담은 자료로, 고유번호(idntfy_no)·제목·후기 유형으로 구성된다. 경기도 워라밸 정책 담당자나 분석가가 "이용자들이 워라밸 서비스와 이벤트를 어떻게 체감했는가"를 후기 유형별로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관 기준이나 이름 매핑으로만 느슨하게 이어 쓴다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼 사용자들이 남긴 서비스 이용 후기를 수집한 자료로, 고유번호, 제목, 후기 유형 등의 항목으로 구성되어 있습니다. 후기 내용은 일반적인 워라밸 서비스 이용 소감, 사용자 의견, 이벤트 참여 사례, 코로나19 극복 경험 등으로 다양하게 분포되어 있습니다. 해당 데이터는 사용자 관점에서 서비스 효과성을 진단하거나, 워라밸 정책에 대한 체감도를 파악하는 데 활용 가능하며, 만족도 기반 피드백 수집, 홍보 콘텐츠 구성, 서비스 개선의 참고자료로도 활용할 수 있습니다.
