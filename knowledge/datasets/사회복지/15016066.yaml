summary_user: 부산광역시 사하구에 등록된 장애인 수를 지체·시각·청각·지적·정신 등 15개 장애유형별로 집계한 파일로, 유형별 인원수와 데이터기준일자를 담는다(파일 크기 401바이트의 소규모 집계표). 사하구 복지 담당자나 분석가가 '사하구에서 어떤 장애유형의 등록장애인이 가장 많은가'처럼 관내 장애유형 구성을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 지역·기관 자료와는 장애유형 이름을 맞추거나 같은 기관(사하구) 자료끼리만 이어 쓴다.
limits: 사하구 한 시군구만 다루는 유형별 합계라서 성별·연령·장애정도·동별 분포나 다른 지역과의 직접 비교는 이 파일만으로 할 수 없다. 표준 코드 컬럼이 없어 다른 통계와 결합하려면 장애유형 명칭을 수작업으로 맞춰야 한다.
