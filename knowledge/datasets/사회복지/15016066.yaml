description_portal: 부산광역시 사하구 관내 장애인 등록인수 현황입니다. * 장애유형, 인원수 등을 제공하며 지체, 시각, 청각 , 언어, 지적, 뇌병변, 자폐성, 정신, 신장, 심장, 호흡기, 간, 안면, 장루 및 요루, 뇌전증 총15개의 유형으로 구분되어 있습니다.* 각 장애유형에 따른 장애인의 인원수를 파악하는데 도움이 되도록 하였습니다. * 현재 사하구 관내 총 장애인 등록인수는 18011명 입니다* 주요 데이터 컬럼별 상세설명○ 장애유형 → 장애정도와 특성에 따른 장애의 분류  *보건복지부의 장애 분류 유형을 따름○ 인원수 → 장애유형에 따라 부산광역시 사하구에 등록된 장애인 인원수○ 데이터기준일자 → 데이터기준일자사하구의 장애인으로 등록된 각 유형별 등록장애인의 수를 한눈에 쉽게 파악할 수 있습니다. 매년 각 장애인의 수를 확인합니다.  이를 통해 취약계층 장애인의 복지향상에 기여하고자 합니다.
