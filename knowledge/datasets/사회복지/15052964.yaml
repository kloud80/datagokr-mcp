summary_user: 공무원연금공단이 관리하는 공무원임대아파트 단지별·전용면적별 임대보증금 금액을 담은 집계 파일로, 포털 설명상 17개 시도의 55개 단지를 다룬다. 무주택 공무원이나 주택 분석가가 "우리 지역 공무원임대아파트의 전용면적별 보증금은 얼마이고 주변 전세금과 비교하면 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명(시도)이나 단지명을 이름으로 맞춰 연결해야 한다.
