summary_user: 대구광역시 북구가 운영하는 청소년 시설 4곳의 명칭, 도로명 소재지, 대표 전화번호, 홈페이지, 시설별 이용 가능한 세부 시설 목록, 주차장 면 수를 시설 한 곳당 한 행으로 담는다. 북구 주민이나 학부모가 근처 청소년 시설의 위치·연락처·이용 가능한 공간과 주차 여건을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명(FCLTY_NM)이나 도로명 주소를 이름·주소 매칭으로 잇거나, 같은 기관(대구 북구) 단위로만 연결한다.
description_portal: 입력 파라미터를 이용하여 대구광역시_북구청_청소년 시설 현황 데이터(가. 현재 운영 중인 청소년 시설의 각 명칭(총 4개 청소년 시설) 나. 청소년 시설이 현재 위치한 소재지(도로명 주소) 다. 청소년 시설의 대표 전화번호(프로그램 이용 등 유선 상담 및 시설 대관 등 각종 문의처) 라. 청소년 시설을 소개하는 온라인 대표 홈페이지 주소 마. 각 청소년 시설 별로 현재 이용이 가능한 세부 청소년 시설의 현황(시설 목록) 바. 청소년 시설 소재지의 보유 주차장 면 수(장애인 주차장 보유 면 수))를 조회하실 수 있는 서비스입니다.
