summary_user: 경기도노인종합상담센터와 시군별 노인상담센터를 기관 한 곳당 한 행으로 정리한 현황 목록으로, 시군명·센터명·전화번호·제공 서비스 내용과 정제된 도로명·지번주소, 우편번호, WGS84 위경도를 담는다. 노인 본인이나 가족이 "우리 시군에서 심리·정서 상담을 받으려면 어느 센터에 전화하면 되나"를 찾거나, 분석가가 시군별 노인상담 기관의 위치와 접근성을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시군명(sigun_nm) 같은 이름 매핑이나 위경도 좌표로만 이어 쓴다.
description_portal: 이 데이터는 경기도노인종합상담센터 및 각 시군별 노인상담센터 설치 현황과 제공 서비스 내용을 정리한 자료로, 경기도민(노인 및 노인가족)의 심리·사회적 어려움을 완화하고 정서적 안정을 지원하기 위한 전문 공공상담기관 정보를 포함합니다. ‘시군명’과 ‘센터명’을 통해 지역별 상담기관을 식별할 수 있으며, ‘센터전화번호’를 통해 상담 신청 및 문의가 가능합니다. 또한 ‘정제도로명주소’, ‘정제지번주소’, ‘정제WGS84위도’, ‘정제WGS84경도’ 등의 항목을 통해 각 상담센터의 위치 정보도 포함되어 있어, 행정구역 기반 접근성 평가 및 위치 기반 서비스에 유용하게 활용될 수 있습니다.
