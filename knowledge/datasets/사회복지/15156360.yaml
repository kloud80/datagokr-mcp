summary_user: 아이돌봄 서비스 건별로 돌보미 출발지와 돌봄장소 도착지의 주소·좌표, 실제 이동거리·교통비·교통수단, 좌표 기준 직선·경로거리와 정책상 최대 교통비를 담은 전국 단위 원천 기록입니다. 정책 담당자나 연구자가 '돌보미가 실제로 쓴 교통비가 정책 상한과 비교해 적정한가, 이동거리에 따라 어떻게 달라지나'를 분석하거나 돌보미 배정·이동경로 모델을 학습하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표를 기준으로 행정구역이나 시설 위치 데이터에 공간 매핑해 이어 쓴다.
description_portal: 아이돌보미 이동경로 학습 데이터는 공공데이터법 제24조에 따라 추진되는 제4차 국가중점데이터 개방계획에 포함된 아이돌봄 지원사업 관련 데이터입니다.이 데이터는 국가적 파급효과와 활용가치가 높은 고수요 데이터를 국가중점데이터로 개방한다는 취지에 따라 선정되었으며, 표준화 절차와 품질 점검을 거쳐 신뢰성을 확보한 후 오픈API 방식으로 제공됩니다.이를 통해 이용자는 아이돌봄 서비스 현황 분석, 민간 서비스 연계 검토 등 다양한 정책·연구·서비스 기획 목적에 활용할 수 있으며, 다른 공공데이터와 결합하여 공공 및 민간 분야 전반에서 활용 범위를 넓힐 수 있습니다.
