description_portal: 본 자료는 "국민기초생활보장제도"에 따라 부산광역시 동구 관내 각 동별 수급권자 현황을 정리한 통계자료입니다.해당 통계는 행정동별로 기초생활보장 급여를 지원받고 있는 가구 및 인원 규모를 파악하기 위해 작성된 것으로, 동별 복지수요 분석 및 향후 맞춤형 복지정책 수립에 활용될 수 있는 기초 자료입니다.일반수급자의 세대수와 인원수, 시설에 입소한 시설수급자 수를 구분하여 제공하며,기초생활보장 급여에는 생계급여, 의료급여, 주거급여, 교육급여가 포함되며, 본 자료는 이러한 각 급여 유형별로 지원을 받고 있는 전체 수급 가구 수와 인원수를 중복없이 산정한 결과입니다.즉, 여러 급여를 동시에 받는 경우라도 중복 계산되지 않도록 처리하여 실제 지원대상 규모를 보다 정확하게 파악할 수 있도록 구성되었습니다.
