summary_user: 농업협동조합(농협중앙회·단위 농협)의 일반현황, 재무상태, 주요경영지표를 기준년월(basYm)과 조합(금융회사 코드·명)별로 담는 집계형 금융통계로, 범위는 전국이며 공간 정보는 없다. 분석가나 금융·지역경제 연구자가 특정 단위 농협의 자산·부채 구조나 ROA·ROE 같은 경영성과가 시기별로 어떻게 변했는지 확인하는 데 쓴다. 법인등록번호(crno)가 실측 조인 키여서 법인등록번호를 가진 기업·법인 정보나 다른 금융위원회 금융통계 데이터와 이어 쓴다.
description_portal: '금융통계농업협동조합정보는 기준년월 및 조합명을 기준으로 농업협동조합의 일반현황, 재무상태, 경영성과 등을 제공하는 데이터입니다. 농협중앙회 및 단위 농협의 경영지표를 시계열로 분석할 수 있도록 제공합니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 농업협동조합 일반현황 조회 : 설립일자, 지역분포, 본점소재지 등 일반정보를 제공합니다.② 농업협동조합 재무현황 조회 : 자산, 부채, 자본 등 농협의 재무구조를 조회할 수 있습니다.③ 농업협동조합 주요경영지표 조회 : 순이익률, ROA, ROE 등 주요 경영성과 지표를 제공합니다.'
