description_portal: 서울시 사회적기업 지원 기관 목록 정보 데이터는 서울시가 사회적기업을 지원하기 위해 운영하는 온라인 게시판의 글 정보를 구조화한 자료입니다. 각 게시물의 고유번호, 제목, 등록일시, 조회수, 작성자, 내용 등이 포함되어 있으며 공지사항, 공고, 안내, Q&A, 자료실 등 게시물 구분과 공시 유형을 함께 제공합니다. 특히 Q&A 답글 등록 여부와 공개 여부를 통해 상담 처리 현황을 관리할 수 있고, 사이트 유형 정보로 어떤 사이트에서 게시되었는지도 확인할 수 있습니다. 이를 활용하면 사회적기업 지원 관련 공지와 공고를 체계적으로 수집·분석하고, 상담 수요 및 정보 제공 현황을 파악하는 데 유용한 기반 자료로 활용할 수 있습니다.
