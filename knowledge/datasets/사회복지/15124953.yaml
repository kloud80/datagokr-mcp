summary_user: 교통약자(고령자·어린이·보행자·자전거) 사고다발지점의 지점정보와 지점별 사고 상세(사고 일시, 유형, 사상자 수, 가해운전자·차량 정보)를 담은 API이며, 검증 시 전국 범위에서 6행이 수신됐다. 지자체 교통안전 담당자나 분석가가 우리 지역에서 어린이·고령자 사고가 잦은 지점이 어디이고 어떤 사고가 났는지 파악하는 데 쓴다. 전역 조인 키는 없고, 시도명(mtrpl_lcgv_nm)·시군구명(basic_lcgv_nm)과 지점구분(brnch_se_nm) 값을 다른 데이터의 이름·코드와 매핑하거나 같은 기관 코드로만 연결한다.
description_portal: 교통약자 사고다발지점 지점정보 및 사고정보를 기준년도, 광역지자체명, 기초지자체명, 지점구분(교통약자유형_ 고령자, 자전거, 보행자, 어린이) 으로 조회하여 교통약자 사고다발지점 정보 및 지점별 교통사고 상세 현황 정보 제공합니다.  유형별 교통사고를 분류함으로써 지역별 교통안전대책 수립 및 유형별 교통안전계획 시행 ,개선방안 등을 수립하는데 유용하게 사용될 수 있습니다.사고 다발 지점 선정 기준 은 과거 3년간(기준년도 포함) 반경 50m 이내, 5건 이상 발생한 상위 30개 지점입니다.
team:
