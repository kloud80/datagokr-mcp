description_portal: '○ 통계개요* 통계명 : 이혼사유별 이혼* 통계종류 : 서울시 이혼사유별로 이혼건수를 제공하는 지정ㆍ전수통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 출생,사망,혼인,이혼에 대한 현황을 파악하여, 국가의 인구·주택·보건·사회복지·교육·교통 등에 관한 정책수립 및 민간기업의 경영계획 수립에 필요한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 배우자부정, 성격차이, 경제문제 등 이혼사유○ 용어설명* 이혼 : 법률혼주의 원칙에서 이혼신고 수리에 의한 신고와 재판이혼(조정, 심판혹은 판결)의 경우는 직권에 의하여 가족관계등록부기재에 의한 신고로 이루어짐○ 기 타* 혼인ㆍ이혼은 남편의 주소지 기준으로 집계한 것임'
