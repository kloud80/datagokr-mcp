summary_user: 전국 시군구 단위 아이돌봄기관이 개설한 아이돌보미 교육과정을 과정·모집차수별로 담은 API로, 사업연도·기관명·교육구분·모집인원·신청기간·교육기간·총교육시간·교통정보 등을 담는다. 아이돌보미가 되려는 사람이 '우리 시군구에서 다음 교육 모집은 언제이고 몇 명을 뽑는가'를 확인하거나, 분석가가 지역별 교육 개설 현황과 교육시간을 비교하는 데 쓴다. 전역 조인 키는 없어 시도명·시군구명이나 아이돌봄기관 번호·이름(childCareInstNo)으로 같은 기관의 다른 아이돌봄 데이터와 매핑해 잇는다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 기관 데이터와는 지역명·기관명 문자열 매칭으로만 연결된다. 포털 활용신청 후 serviceKey가 필요하고 개발계정은 하루 3,000회로 호출이 제한된다.
