description_portal: '경기도 광명시 기초생활수급자에 대한 현황으로 시군구명, 읍면동명, 가구수(일반수급자, 조건부수급자, 특례수급자, 기타, 시설수급자),수급권자수(일반수급자, 조건부수급자, 특례수급자, 기타, 시설수급자)로 구성된 데이터입니다.수급자 유형은 일반수급자, 특례수급자, 조건부수급자 등으로 구분되며, 각 대상자의 급여 자격 및 관리 상태를 파악하기 위해 활용됩니다.○ 일반수급자: 기준 중위소득 이하로 생계의료주거 교육급여 수급이 가능한 기본대상자○ 특례수급자: 소득재산기준을 일부 초과하더라도 예외적으로 보호가 필요한 대상자○ 조건부수급자: 근로능력이 있는 수급자로, 자활사업 참여 등 조건이행을 전제로 급여를 지원받는 대상자○ 시설수급자: 가정이 아닌 사회복지시설(노인요양시설, 장애인생활시설 등)에 입소하여 보호를 받는 국민기초생활보장 수급자'
