description_portal: 본 데이터는 부모의 일·가정 양립을 지원하고 촘촘한 긴급 돌봄 체계를 구축하여 양육 친화적인 지역 사회 환경을 조성하기 위해 성북구도시관리공단 성북구육아종합지원센터에서 운영하는 시간제 보육 서비스의 통합 정보를 제공합니다.데이터의 세부 구성 항목으로는 가정 양육 가구의 일시적 보육 수요를 충족시키기 위한 시간제 보육 제공 지점명과 상세 소재지를 포함하고 있으며, 이용자의 행정 편의를 위해 보육 서비스 정보 구분, 요일별 운영 시간, 이용 대상 및 정원 정보를 수록하고 있습니다. 또한, 이용료 및 정부 지원금 적용을 위한 결제 방법 정보를 명확히 제시하여 이용자가 본인의 스케줄과 예산에 맞춰 유연하게 보육 서비스를 이용할 수 있도록 안내합니다.본 데이터는 지역별 긴급 돌봄 수요 분석 및 서비스 사각지대 해소 정책 수립, 맞춤형 영유아 복지 플랫폼 및 육아 지원 애플리케이션 개발을 위한 핵심 기초 데이터로서 그 공익적·경제적 활용 가치가 매우 높습니다.상세 이용 절차 및 지점 안내는 성북구도시관리공단 공식 홈페이지(https://www.gongdan.go.kr/childCare/cnts/selectContents.do?cntnts_id=I200000027&up_id=01) 를 통해 상시 확인이 가능합니다.
