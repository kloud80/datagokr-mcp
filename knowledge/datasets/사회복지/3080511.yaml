description_portal: '서울특별시 마포구에 있는 위탁급식소 현황에 대한 정보입니다. 이 데이터에는 위탁급식소의 사업장명과 도로명 주소, 위탁급식소명, 개방서비스명(예: 위탁급식영업 등), 인허가일자, 소재지 면적과 전화번호 등의 정보가 포함되어 있습니다. 이 데이터를 통해 행정기관은 위탁급식소의 위생 관리 현황을 체계적으로 파악하고, 시민은 안전하게 급식이 제공되는 기관을 확인할 수 있습니다. 이를 바탕으로 위생 점검, 식중독 예방, 식자재 안전성 검토 등 공공 급식의 질적 향상을 위한 정책 수립에 활용할 수 있으며, 급식 운영의 효율성과 공공성과 관련된 행정 대응도 가능해집니다.'
