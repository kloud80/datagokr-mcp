description_portal: 서울특별시 은평구 여성폭력상담소 현황 데이터는 가정폭력, 성폭력, 데이트폭력, 스토킹 등 여성폭력 피해자에게 상담과 지원 서비스를 제공하는 기관 정보를 담고 있는 공공데이터입니다.2026년 1월 기준 은평구에는 총 2개소의 여성폭력 전문 상담기관이 운영되고 있으며, 피해자 보호와 권익 증진을 위한 상담 서비스를 제공하고 있습니다.데이터에는 상담소명, 소재지 도로명주소, 지번주소, 전화번호, 위도·경도 등 이용자가 실제로 기관을 찾고 연락하는 데 필요한 정보가 포함되어 있습니다.등록된 기관은 은평가정폭력상담소와 (사)한국여성의전화 부설 여성인권상담소로, 각각 가정폭력 피해 지원과 여성인권 보호를 위한 전문 상담을 수행하고 있습니다.여성폭력은 개인의 문제가 아닌 사회적 문제로 인식되고 있으며, 피해자의 신속한 보호와 회복을 위한 상담서비스의 중요성이 지속적으로 높아지고 있습니다.은평구는 여성폭력 피해자 보호와 안전한 지역사회 조성을 위해 관련 정보를 지속적으로 관리·공개하고 있으며, 주민 누구나 필요한 지원기관에 쉽게 접근할 수 있도록 공공데이터를 제공하고 있습니다.
