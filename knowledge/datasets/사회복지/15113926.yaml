description_portal: '"아이돌봄서비스는 소득기준에 따른 가구 유형별로 차등하여 정부지원시간을 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 적용일자, 시간제 연간 지원시간, 종일제 월간 지원시간에 대한 내용을 확인할 수 있습니다.시간제 및 종일제 지원의 기준을 명확히 제시하여, 서비스 이용자의 자격 판정 및 신청 전략 수립에 실질적인 도움을  줍니다. 적용일자별로 정리된 지원시간을 제도 변동 추이를 분석하고, 소득 수준에 따른 혜택의 형평성을 진단하는 데도 유용합니다. 이로 인해 공정한 서비스 제공 기준 마련과 정책의 효과 분석이 가능해집니다. 정부 지원 효율화와 수요자 중심 정책 설계에 활용될 수 있습니다."'
