description_portal: '[양평어린이건강놀이터 이용현황 데이터 상세 설명]1. 시설 개요- 설명: 양평어린이건강놀이터- 위치: 경기도 양평군- 성격: 공공형 어린이놀이시설 (지자체에서 운영하는 공공 놀이시설)2. 데이터 기본 정보- 조사 기간: 2023년 1월 ~ 2025년 3월 (총 27개월간)- 데이터 범위: 전체 이용객 현황 및 세부 분류별 통계3.수집 데이터 항목 3-1. 지역별 이용객 구분- 관내 이용객: 양평군에 거주하는 주민들의 자녀 이용 현황- 관외 이용객: 타 지역(다른 시/군)에서 방문한 이용객 현황 3-2. 요금 구분- 일반 이용객: 정상 요금을 지불하는 이용객- 감면 대상자: 다자녀 가정, 저소득층, 장애인 가정 등 요금 할인 혜택을 받는 이용객4. 데이터 활용 가능 방법- 육아 정책 연구: 공공 놀이시설 이용 패턴 및 지역간 격차 분석- 지역 개발 연구: 공공시설이 지역 방문객 유치에 미치는 영향 연구- 복지 정책 연구: 감면 제도 효과성 및 취약계층 접근성 분석- 유사 시설 도입 시 수요 예측 및 운영 계획 수립 참고자료'
