description_portal: 공동육아나눔터는 만 18세 미만 자녀와 보호자를 대상으로 운영되며, 아이들이 안전하게 생활할 수 있는 돌봄 공간을 제공하고 부모 간 돌봄 나눔을 실천할 수 있는 기반을 마련한 시설입니다. 주요 지원 내용은 자녀들이 여가시간을 안전하게 보낼 수 있도록 다양한 돌봄활동 공간을 제공하고, 부모들이 협력하여 돌봄을 분담할 수 있는 가족품앗이를 지원하는 데 중점을 두고 있습니다. 특히 공동체적 돌봄을 실현할 수 있도록 주민 복지시설, 교회, 행정복지센터 등 지역 내 유휴 공간을 활용하여 운영되고 있어 접근성과 편의성이 보장됩니다. 신청은 유선 접수 또는 가족센터 누리집을 통해 가능하며, 보호자의 참여와 협력을 기반으로 지역사회 중심의 자녀 돌봄 체계를 강화하고 있습니다. 이 제도는 「아이돌봄지원법」 제19조에 근거하여 운영되며, 미추홀구 관내 아동 양육 가정의 돌봄 부담을 완화하고 가족 간 상호교류를 촉진하는 역할을 하고 있습니다. 공동육아나눔터는 단순한 돌봄 공간을 넘어, 지역사회가 함께 아이를 키우는 환경을 조성하고 주민 간 신뢰와 유대감을 강화하는 중요한 기반 시설로 자리 잡고 있습니다.
