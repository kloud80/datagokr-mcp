summary_user: 서울 관악구 소재 사회적경제기업을 기업 한 곳당 한 행으로 담은 목록 파일(약 4KB CSV)로, 기관명·사회서비스분야·주된 목적·사업내용·인증 여부와 인증일자·인증번호·대표자·연락처·도로명/지번 주소를 담는다. 관악구 주민이나 구매·협력처를 찾는 사업자가 '관악구에 어떤 분야의 인증 사회적기업이 어디에 있는가'를 확인하거나, 분석가가 지역 사회서비스 분야 분포를 보는 데 쓴다. 전역 조인 키는 없어 기관명이나 인증번호(인증번호)를 매개로 사회적기업 인증 목록 등 기업 축 데이터와 맞추고, 소재지 주소로 지도·행정구역 자료와 잇는다.
description_portal: 본 데이터는 서울특별시 관악구에서 운영 중인 사회적경제기업의 현황을 정리한 자료입니다. 기관명, 사회서비스 주된 목적, 사업내용, 인증 여부, 인증일자, 대표자명, 전화번호, 소재지 등 다양한 정보를 포함하고 있으며, 관악구 내 사회적경제기업의 특성과 활동 범위를 한눈에 파악할 수 있습니다. 본 데이터는 지역사회의 사회서비스 제공 현황을 분석하거나 사회적가치 실현의 기반을 이해하는 데 활용될 수 있으며, 사회적경제 관련 정책 수립과 연구 자료로도 의미 있게 사용할 수 있습니다. 또한 관악구의 사회적경제 생태계를 살펴보고 지역사회 발전 방향을 모색하는 기초 자료로서 활용될 수 있습니다.
