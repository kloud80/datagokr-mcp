summary_user: 대전광역시 서구 관내에서 운영 중인 다함께돌봄센터를 시설 한 곳당 한 행으로 담은 목록 파일로, 주소·연면적·운영방법·수탁기관·운영인력·정원·이용대상·운영시간 등 시설별 운영 정보를 포함한다. 맞벌이 부모가 우리 동네에서 초등학생을 맡길 수 있는 돌봄센터가 어디이고 정원과 운영시간이 어떤지 확인하거나, 분석가가 서구 안에서 돌봄시설이 어느 동에 몰리고 어느 동에 비어 있는지 살펴보는 데 쓴다. 법정동코드(bjd_cd)를 키로 다른 법정동 단위 통계나 사회복지시설 공통 목록과 이어 쓰며, 행정동코드도 함께 있어 행정동 단위 자료와도 맞출 수 있다.
limits: 대전 서구 한 개 시군구만 다루므로 다른 구나 대전시 전체의 돌봄센터 현황은 이 파일로 알 수 없다. 시설별 현황 목록이라 실제 이용 아동 수나 대기 인원 같은 이용 실적은 담겨 있지 않다.
