description_portal: 본 자료는 「다함께돌봄사업 운영지침」 등에 근거하여 대전광역시 서구 관내에서 운영 중인 다함께돌봄센터의 운영현황을 수록한 공공데이터입니다.해당 자료는 지역 아동 돌봄 공백 해소와 맞벌이 가정 지원 등을 목적으로 설치·운영 중인 다함께돌봄센터의 시설 및 운영 정보를 포함하고 있으며, 순번, 시설명, 행정동 및 법정동(코드 포함), 지번주소 및 도로명주소, 연면적, 대표자, 전화번호, 설치신고일, 운영방법, 수탁기관, 운영인력, 개소일, 정원, 이용대상, 운영시간, 운영내용 등의 항목으로 구성되어 있습니다.본 자료는 관내 돌봄시설의 분포 현황 및 운영 형태, 이용 가능 자원, 운영주체별 특성 등을 파악할 수 있도록 정리되어 있으며, 돌봄 인프라 개선, 지역 맞춤형 정책 수립, 아동 복지 서비스 향상을 위한 기초자료로 활용될 수 있습니다.또한, 공공과 민간의 협력체계 분석, 돌봄 사각지대 해소 정책 수립, 지역사회 기반 돌봄 생태계 조성을 위한 참고자료로도 유용하게 사용될 수 있습니다.
