summary_user: 경기도 내 지역자활센터를 센터 한 곳당 한 행으로 담은 현황 자료로, 시군명·센터명·인허가일자·영업상태·폐업일자·주소와 위경도, 정원과 자격증 소지 인원·총인원을 포함한다. 복지 담당자나 분석가가 "우리 시군에는 자활센터가 몇 곳이고, 정원 대비 인력은 어느 정도인가"처럼 지역별 자활 인프라 분포와 운영 규모를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표로 맞춰 잇는다. 같은 세부 부문의 사회복지시설 마스터와 같은 다른 복지시설 데이터와는 이름 매핑으로 연결해야 한다.
description_portal: 이 데이터는 경기도 내 저소득층 및 취약계층의 자립과 자활을 지원하기 위해 운영 중인 지역자활센터에 대한 현황 자료입니다. 각 자활센터의 명칭, 위치 정보, 인허가일자, 인원 구성, 정원 등의 정보가 포함되어 있으며, 센터는 근로 능력이 있는 저소득층에게 일자리 제공과 사회적 자립 기반 마련을 지원하는 공공복지 인프라로 기능합니다. 이 자료는 지역별 자활 인프라 분포 현황 파악, 복지 수요 분석, 자활사업 운영 실태 점검, 정책 대상자 연계 등을 위한 기초자료로 활용될 수 있습니다. 특히, 자활 프로그램 확대나 사회서비스 연계 정책 수립 시 근거자료로 사용될 수 있습니다.
