summary_user: 도로교통공단 자료를 바탕으로 교통약자의 자전거 교통사고가 자주 난 지점(다발지)마다 사고건수, 사상자·사망자·중상자·경상자·부상신고자 수와 위치(경도·위도, 다발지역 폴리곤)를 담은 집계 데이터이며, 범위는 전국이다. 지자체 교통안전 담당자나 분석가가 '우리 시군구에서 자전거 사고가 몰리는 지점이 어디이고 피해 규모는 어느 정도인가'를 확인해 안전시설 개선 우선순위를 정하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 법정동코드(STDG_CD)나 시도·시군구명, 좌표를 기준으로 행정구역·도로 공간 데이터와 이름·코드 매핑 또는 공간 결합으로 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 도로교통공단에서 제공하는 교통약자 자전거 교통사고 관련 정보입니다.
