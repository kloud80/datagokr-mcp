summary_user: 경기도 내 지적장애인 복지시설을 시설 한 곳당 한 행으로 담은 인허가 현황 자료로, 시군명·시설명·인허가일자·영업상태·폐업일자·입소정원·자격소유 인원·총인원·도로명/지번 주소·WGS84 좌표를 포함한다. 복지 행정 담당자나 분석가가 "우리 시군에 운영 중인 지적장애인 시설은 몇 곳이고, 입소정원과 자격 인력은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표 매핑으로 다른 지역 통계나 시설 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 지적장애인을 위한 복지시설의 인허가 현황을 제공하는 자료입니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지 면적, 입소정원, 자격소유 인원수, 총인원수, 소재지 주소(도로명·지번), 우편번호, WGS84 좌표(위도·경도) 등으로 구성됩니다. 이를 통해 지역별 지적장애인 시설의 분포와 운영 현황, 수용 인원 및 전문 인력 보유 현황을 파악할 수 있습니다. 활용 방안으로는 복지 인프라 현황 분석, 시설 수급 불균형 진단, 정책 수립 및 복지 서비스 개선 등이 있으며, 시설 입소 가능 규모와 인력 배치를 함께 확인할 수 있어 복지 행정 계획 수립에도 유용합니다. 다만, 본 데이터는 인허가 중심 자료로 제공되므로 실제 운영 현황이나 서비스 질적 수준과는 차이가 있을 수 있습니다.
