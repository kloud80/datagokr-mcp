summary_user: 전국 아이돌봄 제공기관이 낸 아이돌보미 모집 공고를 공고 건별로 담으며, 기준연도·시도·시군구·기관명과 모집차수, 모집 기간, 모집인원·정원, 모집상태(모집중 등)·모집구분(수시모집 등), 결과발표 예정일·방법, 제출서류를 포함한다. 아이돌보미로 일하려는 사람이 '우리 시군구에서 지금 모집 중인 공고와 마감일, 제출서류는 무엇인가'를 확인하거나, 분석가가 지역별 모집 시기와 규모 흐름을 파악하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어 시도·시군구 이름이나 아이돌봄기관명·기관번호(childCareInstNo)를 같은 기관의 다른 아이돌봄 데이터와 맞춰 이어 쓴다.
limits: 전역 조인 키가 없어 다른 기관 데이터와는 이름 매핑으로만 연결되므로 기관명·지역명 표기 차이에 주의한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고 개발계정은 일 10,000회로 제한된다.
