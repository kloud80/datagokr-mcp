description_portal: '아동복지시설의 보호아동 및 종사자 현황을 파악하여 각종 정책수립을 위한 기초 자료를 제공하는 것을 목적으로 작성한 통계자료입니다.서울특별시 자치구별 아동 이용복지시설(지역아동센터, 아동상담소)의 시설 수 및 이용자 수 현황을 제공합니다.- 지역아동센터 : 지역사회 아동의 보호ㆍ교육, 건전한 놀이와 오락의 제공, 보호자와 지역사회의 연계 등 아동의 건전육성을 위하여 종합적인 아동복지서비스를 제공하는 시설 - 아동상담소 : 아동과 그 가족의 문제에 관한 상담, 치료, 예방 및 연구 등을 목적으로 하는 시설'
