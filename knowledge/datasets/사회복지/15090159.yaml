summary_user: 경기도 여주시 관내 경로당을 한 곳씩 담은 시설 목록으로, 경로당명·읍면동·행정리통·도로명주소·관리기관·전화번호·기준일자를 담는다(시군구 범위, CSV 약 34KB). 주민이나 가족이 "우리 마을(행정리) 가까운 경로당은 어디이고 어디로 문의하나"를 찾거나, 분석가가 읍면동별 경로당 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동명·주소 같은 이름 매칭으로만 잇고, 지역 단위로 묶으면 시군구 지역통계나 장기요양기관 등 다른 노인복지시설 데이터와 함께 본다.
limits: 표준 시설코드나 행정구역 코드 같은 전역 조인 키가 없어 다른 데이터와 연결할 때 이름·주소 매칭이 필요하다. 좌표 필드가 없어 지도에 올리려면 도로명주소를 지오코딩해야 하며, 여주시만 다루므로 다른 시군과의 비교에는 별도 데이터가 필요하다.
