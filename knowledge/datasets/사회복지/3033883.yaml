summary_user: 대전광역시 중구에 있는 아동복지시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설종류(다함께돌봄센터·아동양육시설·공동생활가정·학대피해아동쉼터·지역아동센터 등), 시설명, 도로명주소, 우편번호, 입소정원, 전화·팩스번호를 담는다. 중구에 사는 보호자나 복지 담당자가 집 근처 지역아동센터나 다함께돌봄센터가 어디 있고 정원이 몇 명인지 찾을 때 쓴다. 전역 조인 키나 기관 코드는 없어서 다른 데이터와는 시설명이나 도로명주소를 맞춰 붙여야 하고, 사회복지시설 공통 마스터를 참조하는 보조 자료로 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 소재로 운영중인 아동복지시설 (연번, 시설종류, 시설명, 소재지 도로명주소, 우편번호, 입소정원, 전화번호, 팩스번호) 현황정보를 제공합니다.해당 공공데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 시설종류는 다함께돌봄센터, 아동양육시설, 공동생활가정, 학대피해아동쉼터, 지역아동센터 등을 포함하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
