summary_user: 공무원연금기금 기금회계의 재무상태표를 1983년부터 연 단위로 담은 집계 파일로, 유동·비유동자산, 타회계자금수수(연금조정·특별회계·재해보상·퇴직수당 계정), 유동·비유동부채, 자본(자본금·잉여금·퇴직급여지급준비금 등)을 항목별 금액으로 제공한다. 연금 재정 분석가나 연구자가 공무원연금기금의 자산·부채 규모와 자본 구성이 해마다 어떻게 변했는지 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도(구분)나 같은 기관의 다른 공무원연금통계와 이름으로 맞춰 이어 써야 한다.
description_portal: 공무원연금공단에서 관리하는 공무원연금기금 기금회계 재무상태(자산, 부채, 자본 등) 현황 데이터입니다. 1983년부터 기준년도까지 연 단위로 구분됩니다.자산항목은 유동자산(당좌자산, 재고자산, 기타유동자산) 및 비유동자산(투자자산, 대부자산, 유형자산, 무형자산, 기타비유동자산), 타회계자금수수(연금조정계정, 특별회계자금, 재해보상계정, 퇴직수당계정)로 구분하고, 부채는 유동부채 및 타회계자금수, 비유동부채로 구분하여 제공합니다.1. 2005년부터 퇴직금전환금(종전 기타유동자산)을 퇴직급여충당금(비유동부채)에서 차감하는 방법으로 표기. 2. 2013년부터 국가회계법에 따라 국가회계기준(실물자산 시가평가 등 반영) 적용
