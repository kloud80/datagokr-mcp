summary_user: 경상북도 울진군에 등록된 경로당을 시설 한 곳당 한 행으로 담은 파일로, 읍면·시설명·소재지 주소·전화번호·설치일자·승인일자·운영상태·관리기관과 부서를 기록한다. 주민이나 노인복지 담당자가 우리 읍면에 어떤 경로당이 있고 지금 운영 중인지, 언제 설치됐는지 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 노인복지시설 데이터와는 시설명·주소를 맞춰 보거나 같은 군 단위로 묶어 이어 쓴다.
limits: 표준 시설코드 같은 공통 키가 없어 장기요양기관 등 다른 데이터와 자동으로 조인되지 않고, 이름·주소 매핑에 의존해야 한다. 범위는 울진군 한 곳에 한정된다.
