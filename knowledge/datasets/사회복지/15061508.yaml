summary_user: 대전광역시 내 협동조합연합회를 한 행에 한 곳씩 담은 목록 파일로, 구분(일반·사회적 협동조합 등)·협동조합명·업종·주소를 담으며 파일 크기는 약 1KB(1,110바이트)로 소규모다. 대전에 어떤 협동조합연합회가 어느 업종으로 어디에 있는지 확인하려는 주민·조합 관계자나, 지역 사회적경제 지원 정책을 검토하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·인증번호 등)가 없어 다른 사회적경제·기업 데이터와는 조합명이나 주소를 매칭해 이어 써야 한다.
description_portal: 대전광역시 협동 조합 연합회 현황 자료는 지역 내 일반 협동 조합과 사회적 협동 조합 등 다양한 형태의 협동 조합 연합회에 대한 종합 정보를 제공하며, 협동 조합명, 업종, 주소 등 주요 항목을 포함하고 있습니다. 이 자료는 조합의 업종별·종류별 분포와 특성을 체계적으로 파악하여, 지역 경제 활성화 및 공동체 기반 강화, 맞춤형 협동 조합 지원 정책 수립, 조합 간 협력 체계 구축, 운영 현황 진단 등 정책 수립의 근거 자료로 활용됩니다. 또한 변화하는 협동 조합 현황을 정기적으로 반영해 지역 내 사회 경제 생태계의 현주소와 발전 방향을 모색하는 데 중요한 역할을 합니다.
