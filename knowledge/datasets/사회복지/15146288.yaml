summary_user: 인천광역시 안에 설치된 전동휠체어 급속충전기를 설치 장소 한 곳당 한 행으로 담은 CSV 파일(약 46KB)이다. 담는 항목은 시설명, 도로명·지번 주소, 위도·경도, 요일별 운영시간, 동시사용가능대수, 공기주입·휴대전화 충전 가능 여부, 관리기관이다. 전동휠체어 이용자나 보호자가 '지금 근처에서 열려 있는 충전기가 어디인가'를 찾는 데 쓰고, 복지·도시 분석가가 구별 충전 인프라 분포를 살피는 데도 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시군구코드·시군구명으로 행정구역 단위 매핑을 하거나, 주소·좌표로 장애인 편의시설·건물 데이터와 공간 결합해 이어 쓴다.
description_portal: 인천 시민을 위한 전동휠체어 급속충전기 공공데이터는 사용자들이 편리하게 배터리를 충전할 수 있도록 돕는 유용한 정보입니다.해당 데이터는 시설명, 시도명, 시군구명, 시군구코드, 주소, 경도, 위도, 설치장소명, 운영시간 등 다양한 정보를 제공하고 있습니다.이 공공데이터를 활용하면 가까운 충전소를 찾아볼 수 있고, 배터리가 긴급한 상황에 아주 유용한 정보입니다.이 데이터는 시민들의 편익을 증진하고, 사회적 약자를 배려하는 스마트 도시를 만드는 중요한 자산이 됩니다. 공공데이터포털에서 CSV파일로 제공이되며 무료로 다운로드 받을 수 있습니다.
