description_portal: 은평구민 모두가 장벽없이 이용할 수 있는 장벽없는 마을 상점 및 지원 현황입니다. 상점명, 종류, 우편번호, 소재지도로명주소, 소재지지번주소 등으로 구성되어있습니다.해당 데이터는 서울특별시 은평구 내 장벽없는 마을상점 및 지원 현황을 담고 있습니다.장벽없는 마을상점이란 휠체어 이용자, 거동 불편한 고령자, 유모차를 끄는 부모 등 모든 주민이 턱이나 계단 없이 편리하게 이용할 수 있도록 개선된 상점을 의미합니다. 2015년 은평로 주변 18개 상점을 시작으로 경사로 설치, 출입구 확장, 문턱 제거 등의 편의시설을 갖춘 업소들이 지속적으로 확대되고 있습니다.사업의 핵심은 은평구 편의시설 촉진 기금을 통해 매년 원하는 상점에 예산 범위 내에서 경사로를 설치하고, 장벽없는 마을상점 마크 인증을 통해 접근 가능한 업소임을 표시하는 것입니다. 2017년 말까지 설치된 마을상점들을 대상으로 인증식을 개최하는 등 체계적으로 관리되고 있습니다.2018년 은평구 유니버셜 디자인 조례 제정과 함께 주민참여예산 사업으로 확장되면서, 장애인 당사자를 포함한 주민촉진단 18명이 직접 지역을 조사하고 개선이 필요한 곳을 발굴하는 주민 주도형 사업으로 발전했습니다.각 상점의 명칭, 업종, 정확한 위치 정보가 포함되어 있어 접근성이 확보된 업소를 사전에 확인하고 방문할 수 있으며, 지역 내 무장벽 환경 조성 정책의 구체적인 성과를 보여주는 자료입니다.
