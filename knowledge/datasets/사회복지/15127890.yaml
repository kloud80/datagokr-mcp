summary_user: 2015~2024년 국민연금 급여실적을 연도·시도별로 집계해 노령·장애(연금·일시보상금)·유족연금과 반환일시금·사망일시금의 수급자수와 지급금액(단위 1,000원)을 담은 전국 단위 통계 파일이다. 지역 분석가나 연구자가 '우리 시도의 노령연금 수급자와 지급액이 10년간 얼마나 늘었나'처럼 시도 간 급여 규모와 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 시도별 통계와는 시도 이름을 맞추거나 연도로 묶어 이어 쓴다.
description_portal: '보건복지부에서 2015년~2024년까지 국민연금 급여실적을 급여 종류별(노령연금_수급자수, 노령연금_금액, 장애연금(연금_수급자수), 장애연금(연금_금액), 장애연금(일시보상금_수급자수), 장애연금(일시보상금_금액), 유족연금_수급자수, 유족연금_금액, 반환일시금_수급자수, 반환일시금_금액, 사망일시금_수급자수, 사망일시금_금액)/시도별로 분류하여 제공하고 있습니다.* 단위: 1,000원<통계 이용 시 주의사항>1. 수급자수는 동순위 수급자를 포함한 수임.2. 해당연도 1회 이상 실제 지급된 연금 건수와 금액의 합계※ 2019년 노령연금 수급연령은 62세이고, 2013년부터 매 5년마다 1세씩 상향 조정되어 2033년 이후에는 65세임'
