summary_user: 성남시 저소득 한부모가족 수를 구·동(읍면동) 단위로 집계해 한부모·모자·부자가족별 세대수와 가구원수를 담은 CSV 파일이다. 성남시 어느 동에 저소득 한부모가족이 많이 사는지 확인해 양육·돌봄 지원 수요나 상담·지원 시설 배치를 검토하는 분석가와 행정 담당자가 쓴다. 전역 조인 키는 없어 구·동 이름으로 성남시의 다른 동별 통계나 복지시설 현황과 맞춰 연결해야 한다.
