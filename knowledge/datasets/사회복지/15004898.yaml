description_portal: 성남시 내 저소득 한부모 가족현황에 대한 데이터로 한부모 세대수, 한부모 가구원수,모자가족 세대수, 모자가족 가구원수, 부자가족 세대수, 부자가족 가구원수 등의 항목으로 제공되고 있습니다. CSV파일 형태로 1년 주기로 현행화 하여 제공하고 있습니다. 성남시에서는 한부모 가족의 안정적인 생활과 자립을 지원하기 위해 다양한 복지 정책을 시행하고 있는데, 주요 지원 내용은 아동 양육비 지원(기준 중위소득 63% 이하인 한부모 및 조손가족), 학용품비 지원(중·고등학생 자녀를 둔 한부모 가족), 생활보조금 지원(한부모가족복지시설 입소 가구)제도 등이 있습니다. 주거 및 매입임대주택 부분에서는 저소득 한부모 가족 대상으로 공공주택 우선 공급 및 매입임대주택 지원을 하고 있으며, 경기도 거주 생후 24~48개월 미만 아동을 돌보는 가정을 대상으로 돌봄수당 금액(아동1명 월30만원, 아동2명 월45만원, 아동3명 월60만원)을 지원하고 있습니다.
