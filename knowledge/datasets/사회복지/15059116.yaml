summary_user: 경기도 안에서 산모·신생아 대상 사회서비스를 제공하는 기관을 기관 한 곳당 한 건으로 담으며, 사업구분·서비스 내용·주소·전화번호·대표자·위경도를 포함한다. 임산부나 상담 공무원이 '우리 시군에서 산후조리나 방문 건강관리를 받을 수 있는 기관은 어디인가'를 확인하거나, 분석가가 시군별 산모 복지기관 분포를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군명이나 시군코드(SIGUN_CD)를 이름·코드로 맞추는 방식으로 다른 지자체 출산지원 데이터와 연결하고, 위경도는 지도 결합에 쓴다.
description_portal: '이 데이터는 임신·출산기를 겪는 산모 및 신생아를 위한 복지서비스를 제공하는 경기도 내 기관의 현황을 담고 있습니다. 기관명, 사업구분명, 서비스 내용, 소재지 주소(도로명 및 지번), 우편번호, 전화번호, 대표자명, 위치좌표(WGS84 위도·경도) 등으로 구성되어 있으며, 시군구 단위로 조회가 가능합니다. 본 API는 XML 또는 JSON 형식으로 제공되며, 공공복지서비스 분석, 임산부 대상 행정지원 시스템 구축, 지역 복지자원 연결 플랫폼 등에 활용될 수 있습니다. 이 데이터는 22개 중앙부처에서 제공하는 복지서비스 중 산모 및 신생아에게 해당하는 서비스를 중심으로 구성되어 있어 출산복지정책 수립 및 민원응대 서비스 개선에 유용합니다.- 산모 사회서비스: 임신·출산기의 여성 및 신생아에게 제공되는 공공복지서비스로, 산후조리 지원, 방문 건강관리, 출산용품 지원 등 다양한 형태로 운영됩니다.- 사회보장정보원: 전국의 복지서비스와 관련된 행정정보를 수집·통합·관리하는 기관으로, 맞춤형복지서비스 전달체계의 중추적 역할을 수행합니다.'
