description_portal: 한국청소년상담복지개발원에서 운영하는 집단상담 프로그램의 일정과 신청 현황을 공개하는 데이터입니다. 본 데이터는 상담 프로그램의 명칭, 신청 시작일 및 종료일, 프로그램의 실제 운영 시작일과 종료일, 대상자, 신청 가능 인원, 실제 신청 인원 등의 항목으로 구성되어 있습니다. 이를 통해 청소년 대상 프로그램의 운영 계획, 기간별 추진 일정, 참여 대상 및 인원 정보 등을 체계적으로 확인할 수 있습니다. 본 데이터는 청소년의 심리·정서 지원을 위한 집단상담 활동의 수요 및 운영 현황을 반영하며, 프로그램별로 운영 시기와 참여 규모 등의 추세 분석이 가능합니다. 상담 행정의 투명성과 정보 접근성을 높이는 데 기여하며, 기관의 집단상담 사업 전개 현황을 한눈에 파악하는 데 유용합니다. 데이터는 공공데이터포털 및 개발원 홈페이지를 통해 열람할 수 있습니다.
