summary_user: 중증장애인직업재활지원사업 수행기관이 낸 구인정보를 공고 건별로 담은 전국 범위 파일(csv)로, 기관명·기관유형·사업체명·구인인원·구인직무·구인 시작일과 종료일을 담는다. 중증장애인 구직자나 직업재활 담당자가 "어느 기관을 통해 어떤 사업체가 어떤 직무로 몇 명을 뽑는가"를 확인하거나, 분석가가 기관유형·직무별 구인 규모를 집계하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·사업체명 같은 이름 매칭으로만 연결한다.
description_portal: 중증장애인직업재활지원사업은 중증장애인의 직업재활을 통해 자립기반 마련 및 사회참여를 증진하고 사각지대 없는 촘촘한 직업재활서비스를 제공하기 위하여, 지역사회 내 직업재활사업수행기관을 지정하고 장애인의 생애주기에 따른 전문적이고 체계적인 직업재활서비스를 지원하는 사업입니다.중증장애인직업재활지원사업은 진단·평가, 교육·훈련 및 자립지원정책 등의 차원에서 접근하는 명실상부한 종합적인 직업재활서비스를 제공함으로써 중증장애인의 보호고용 또는 일반노동시장으로 취업을 지원하고 이를 통하여 사회적·경제적 활동에 동등한 사회구성원으로 자리매김하는데 목적이 있습니다.중증장애인직업재활지원사업 관련 기관의  구인정보 데이터로 기관명, 기관유형, 사업체명, 구인인원, 구인직무, 구인시작일, 구인종료일 정보를 제공합니다.
