summary_user: 경기도 워라밸링크 플랫폼에 올라온 공지사항을 건별로 담으며, 고유번호·유형·제목으로 구성되고 서비스 오픈·시범 운영, 회원가입·이벤트, 서포터즈 모집, 상담 일정 안내 같은 내용을 포함한다. 분석가가 '워라밸링크가 언제 어떤 이벤트와 모집을 공지해 왔는가'처럼 플랫폼 운영 이력과 이용자 소통 흐름을 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·유형 같은 이름 매핑이나 같은 기관(경기도) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 워라밸링크의 각종 공지사항을 수록한 자료로, 고유번호, 유형, 제목 등의 항목으로 구성되어 있습니다. 주된 내용은 워라밸 서비스 오픈 및 시범 운영 알림, 회원가입 및 이벤트 공지, 서포터즈 모집 안내, 상담 서비스 일정 공지 등으로 구성되어 있습니다. 또한, 이벤트성 공지와 운영 정보가 혼합되어 있어 정책홍보와 사용자 안내를 동시에 목적으로 활용됩니다. 이 데이터는 워라밸 서비스 운영 기록, 사용자 커뮤니케이션 이력, 플랫폼 신뢰도 분석 등에 활용될 수 있으며, 이벤트 참여도 및 커뮤니티 활성화 효과 측정에도 유용합니다.
