summary_user: 서울특별시 재가노인복지시설을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·시설코드(FCLT_CD)·시설종류와 세부종류·관할 자치구·주소·전화번호·우편번호를 담는다. 어르신 가족이나 돌봄 실무자가 '우리 구에서 집에 머물며 돌봄·주간보호를 받을 수 있는 시설이 어디 있나'를 찾을 때, 분석가가 자치구별 재가시설 분포를 볼 때 쓴다. 전역 조인 키는 확인되지 않아 관할 자치구 코드·이름(JRSD_SGG_CD)으로 시군구 단위 지역 통계에 붙이고, 건강보험 장기요양기관 목록과는 시설명·주소를 맞춰 연결한다.
description_portal: '서울특별시 재가노인복지시설 정보입니다.- 주요내용 : 시설명, 시설유형, 시설종류, 시설주소 등 정보제공*용어설명- 「노인복지법」 제38조에 근거하여, 노인이 가정에서 생활하면서 필요한 돌봄·보호·재활·의료 지원 서비스를 받을 수 있도록 설치된 복지시설, 시설에 입소하지 않고 집에 거주하면서 필요한 서비스를 제공받는 기관(운영주체)- 지자체 직영 (구립, 시립)- 사회복지법인, 비영리단체, 민간 개인·법인이 운영 (개가 시설)※ 제공부서 : 서울특별시 복지실 복지기획관 복지정책과(02-2133-7352)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
