summary_user: 경기도 내 중증장애인 요양시설과 자립생활지원센터를 인허가 기준으로 시설 한 곳당 한 행씩 담으며, 영업상태·폐업일자, 입소정원, 자격소유 인원수, 총인원수, 소재지 주소와 위경도 좌표가 들어 있다(포털 설명상 2018년 9월 이후 갱신 중단). 장애인 복지 분석가나 가족이 '우리 시군에 운영 중인 중증장애인 요양시설은 몇 곳이고 입소정원은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 경기도의 다른 시군 단위 복지·인구 자료와 맞대어 쓴다.
description_portal: 이 데이터는 경기도 내 중증장애인을 위한 요양시설 및 자립생활지원센터 현황을 인허가 기준으로 제공하는 자료입니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지 면적, 입소정원, 자격소유 인원수, 총인원수, 소재지 주소(도로명·지번), 우편번호, WGS84 좌표(위도·경도) 등으로 구성되어 있습니다. 해당 시설은 중증장애인에게 쉼터 제공, 재활 및 심신 기능 회복 프로그램 지원을 목적으로 운영됩니다. 데이터는 시설 분포 파악, 수용 인원 현황 분석, 지역별 복지 인프라 격차 진단, 장애인 복지정책 수립 및 개선 등에 활용될 수 있습니다. 단, 이 자료는 2018년 9월 이후 갱신이 중단되었으므로 최신 운영 현황을 반영하지 않을 수 있습니다.
