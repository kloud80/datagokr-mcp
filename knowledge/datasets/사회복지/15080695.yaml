summary_user: 대전광역시에서 거동이 불편한 저소득 재가노인에게 도시락을 배달하는 수행기관을 기관 한 곳당 한 행으로 담은 작은 목록(csv 약 2KB)으로, 시설명·도로명/지번 주소·전화번호·급식대상·급식요일을 담는다. 보호자나 사회복지 담당자가 '우리 동네에서 식사배달을 해 주는 기관은 어디이고 무슨 요일에 배달하나'를 확인하거나, 분석가가 자치구별 수행기관 분포를 볼 때 쓴다. 전역 조인 키는 없어 주소를 지오코딩하거나 시설명으로 사회복지시설·장기요양기관 목록과 맞춰 이어야 하며, 자치구 단위로 묶으면 지역 노인 통계와 함께 볼 수 있다.
