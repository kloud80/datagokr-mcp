summary_user: 2020년 1월부터 5월까지 국민연금공단이 사업장가입자와 지역가입자에게 보낸 자격변동확인통지서 수를 월별로 담은 전국 단위 집계 파일(약 223바이트)이다. 분석가가 "자격 취득·상실·내용변경 통지가 사업장가입자와 지역가입자 중 어느 쪽에서 매달 얼마나 나갔나"를 확인하는 데 쓴다. 전역 조인 키가 없고 지역 구분도 없어서, 같은 기관의 다른 국민연금 가입 통계와는 해당년월을 기준으로 맞춰 비교하는 정도로만 이어 쓴다.
limits: 전국 합계만 있어 시군구 등 지역별로 나눠 볼 수 없고, 기간도 2020년 1~5월로 짧다. 통지는 자격변동 처리일을 기준으로 집계되므로 과거 가입이력의 변동이 해당 월 건수에 섞여 있을 수 있으며, 실제 그 달에 일어난 자격변동 건수로 읽으면 안 된다.
