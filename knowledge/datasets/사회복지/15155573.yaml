description_portal: '부산광역시 북구 관내 등록된 장기요양기관 현황에 대한 데이터입니다.각 업체명, 관내 주소, 시설 연락처 등을 제공하고 있습니다.장기요양기관은 노인복지법 및 노인장기요양보험법에 따라 운영되고 있습니다.고령이나 노인성 질병 등의 사유로 일상생활을 혼자서 수행하기 어려운 노인등에게 제공하는 신체활동 또는 가사활동 지원을 통해 노후의 건강증진 및 생활안정을 도모하고 그 가족의 부담을 덜어줌으로써 국민의 삶의 질을 향상시킴을 목적으로 합니다.장기요양기관이 제공하는 서비스의 종류:  재가급여(방문요양, 방문목욕, 주간보호, 치매전담실, 복지용구), 시설급여(요양원) 등 이 있습니다.'
