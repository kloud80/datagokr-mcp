description_portal: 업종, 구/동 등을 기준으로 경기도 수원시 관내의 효도업소의 업소명, 소재지 주소, 업소 전화번호, 할인대상, 할인율, 할인금액, 할인품목 등의 현황을 제공합니다. 효도업소 인증을 받은 업소를 확인하시어 다양한 곳에서 어르신 혜택을 받는 데에 이용하시기를 바랍니다. 네이버 카카오 지도, 구글맵 등과 연계해 어르신들이 근처에 있는 효도업소(음식점, 미용실, 약국 등)을 쉽게 찾는 데에 활용하시기를 바랍니다. 또한 경로당, 노인복지관 등에서 어르신들에게 안내 자료로 드리면 보다 많은 분들이 다양한 혜택을 받으실 수 있습니다.
