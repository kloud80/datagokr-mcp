summary_user: 광주광역시 지역 여성 상담기관(여성긴급전화1366, 성폭력상담소 등)을 기관 한 곳당 한 행으로 정리한 현황 파일로, 구분·기관명·시설장·설치일·소재지·종사자수·전화번호·데이터기준일자를 담는다. 도움이 필요한 시민이 가까운 여성 상담기관과 대표 전화번호를 찾거나, 분석가가 상담기관의 지역 분포와 인력 규모를 살펴보는 데 쓴다. 전역 조인 키나 코드 필드는 없어 다른 사회복지시설 데이터와는 기관명이나 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 본 데이터는 광주광역시 여성 관련 상담기관의 현황을 정리한 자료로, 구분, 기관명, 시설장, 설치일, 소재지, 종사자수, 전화번호, 데이터기준일자로 구성되어 있습니다. 여성긴급전화1366을 비롯하여 광주성폭력상담소, 광주여성장애인, 광주여성민우회, 지구촌가족 등 다양한 상담기관 정보가 포함되어 있으며, 각 기관의 설치일과 주소, 종사자 수, 대표 전화번호를 확인하실 수 있습니다. 여성긴급전화1366은 2000년 10월 설치되어 14명이 근무하고 있으며, 성폭력상담소 관련 기관들은 남구와 북구 등 여러 지역에 분포하여 3~5명의 종사자가 근무하는 것으로 제시되어 있습니다
