summary_user: 전라남도 내 가족센터를 시설 한 곳당 한 행으로 담은 파일로, 시설명·소재지·면적(제곱미터)·개소일·연락처·우편번호와 위도·경도를 포함한다. 주민이 가까운 가족센터의 위치와 연락처를 찾거나, 분석가가 시군별 가족센터 분포와 시설 규모를 비교할 때 쓴다. 전역 조인 키는 없으므로 다른 사회복지시설 목록과는 시설명·주소로 맞추거나 위도·경도를 기준으로 공간 결합해 쓴다.
description_portal: '- 전라남도내 가족센터 현황(시설명, 소재지, 규모, 개소일, 전화번호, 우편번호 등)에 관한 데이터를 제공, 조회하실 수 있습니다.- 전라남도에는 가족의 복지와 지원을 위한 다양한 가족센터가 운영되고 있습니다.- 사전 예약 : 특정 프로그램이나 상담 서비스는 사전 예약이 필요할 수 있으므로, 방문 전에 해당 센터에 문의하시기 바랍니다.- 운영 시간 : 각 가족센터의 운영 시간이 다를 수 있으므로, 방문 전에 확인하시기 바랍니다.- 이용 요금 : 대부분의 서비스는 무료로 제공되지만, 일부 프로그램은 유료일 수 있으므로 사전에 확인하시기 바랍니다.- 프로그램 일정 : 특정 프로그램이나 행사는 일정이 정해져 있으므로, 해당 센터의 공지사항을 참고하시기 바랍니다.'
