description_portal: 한국청소년상담복지개발원에서 시행하는 청소년상담사 연수과정의 과목별 정보를 제공하는 데이터입니다. 본 데이터는 2018년~2020년까지의 연수년도, 과목명, 수업명, 취득시수로 구성되어 있으며, 상담사 자격 취득 및 직무 능력 향상을 위한 연수 교과 구성 현황을 확인할 수 있습니다. 각 연도별 연수과정에서 개설된 과목과 해당 과목 내 수업의 명칭, 수강을 통해 인정되는 시수 정보가 포함되어 있어, 연수 대상자 및 교육 운영자가 이수 요건과 교과내용을 명확히 이해하는 데에 기여합니다.데이터는 청소년상담사의 전문성 강화를 위한 교육 과정의 체계성을 반영하며, 연도별 변화 추이를 분석하거나, 과목별 교육 목표 설정 등에도 활용 가능합니다. 본 데이터는 공공데이터포털 및 청소년상담사 홈페이지를 통해 열람할 수 있습니다.
