description_portal: '서울특별시 아동 생활복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계로 2004년 이후 자료입니다.서울시 자치구별 아동 생활복지시설(양육시설, 자립지원시설 등)의  시설수 및 생활인원 현황을 제공합니다. * 양육시설 : 보호를 필요로 하는 아동을 입소시켜 보호, 양육하는 것을 목적으로 하는 시설 * 자립지원시설 : 아동복지시설에서 퇴소한 자에게 취업준비기간 또는 취업후 일정기간 보호함으로써 자립을 지원하는 시설 * 보호치료시설 : 불량행위를 하거나 불량행위를 할 우려가 있는 아동으로서 보호자가 없거나 친권자나 후견인이 입소를 신청한 아동 또는 가정법원, 지방법원소년부지원에서 보호위탁된 아동을 입소시켜 선도하고 건전한 사회인으로 육성하는 시설 * 기타(항목)는 공동생활가정, 일시보호시설, 종합시설, 직업훈련시설 등/기타(분류)는 지방 이전 시설임'
