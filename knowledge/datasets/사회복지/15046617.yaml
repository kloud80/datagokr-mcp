description_portal: '○ 통계개요* 통계명 : 국민연금 지역가입자 성별, 연령별 현황* 통계종류 : 일반통계* 근거법령 : 통계법 제18조(승인번호 : 제32202호)* 작성목적 : 국민연금의 가입자, 징수, 급여, 기금현황 등을 파악하여 경제,사회정책 수립 및 관련 연구, 분석 등을 위한 기초 자료로 활용* 조사체계 : 지사(제 신고서 접수 및 입력) → 국민연금공단* 공표주기 : 매년* 공표범위 : 지역- 서울시내용 - 성별, 연령별 국민연금 지역가입자 수○ 용어설명* 지역가입자 : 국내에 거주하는 18세이상 60세미만의 국민으로서 사업장 가입자가 아닌 자○ 기타* 지역가입자 중에서 납부예외자는 제외하였음* 단위미만 수는 반올림을 원칙으로 한 것으로 내용과 총수가 일치하지 않는 경우가 있음* 지역가입자납부예외 사유 :① 실직 ② 병역의무수행 ③ 재학 ④ 교도소 수감 ⑤ 보호(치료)감호시설 수용⑥ 행방불명, ⑦ 3월 이상 입원 ⑧ 자연재해 등으로 보호(지원) 대상⑨ 사업중단 ⑩ 휴직 ⑪ 기초생활곤란 ⑫ 기타'
