summary_user: 설날·추석 등 특별교통소통대책기간의 전국 고속도로 교통량을 연도와 명절별 한 행으로 묶어, 연휴일수와 명절 당일 기준 5일 전부터 5일 후까지 11일간의 일별 교통량을 담은 집계 파일(CSV, 792바이트)이다. 교통 분석가나 귀성 계획을 세우는 이용자가 명절 전후 며칠째에 고속도로 통행량이 가장 많은지, 연도별로 그 양상이 어떻게 바뀌었는지 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·명절명(구분)을 기준으로 같은 기관의 명절 교통 통계와 이름으로 맞춰 이어 써야 한다.
limits: 전국 단위의 비공간 집계라서 노선·구간·영업소별 교통량이나 시간대별 정체는 알 수 없다. 공통 코드 키가 없어 다른 데이터와 붙일 때는 연도·명절명을 직접 맞춰야 한다.
