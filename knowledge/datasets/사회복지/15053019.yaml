description_portal: '공무원연금공단에서 관리하는 퇴직자수를 직종별로 구분하여 1982년부터 현재까지 추이를 제공하는 데이터입니다. 직종 : 일반직, 정무직, 별정직, 경찰, 소방, 교육직, 법관검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(우정직, 고위직, 외무직, 청원경찰, 전문경력관 등)1. 2000년까지의 기타에는 정무직, 공안직, 연구직, 지도직, 계약직, 공중보건의 인원이 포함되어 있음 2. 2000년까지의 별정직(국가)에는 국가별정직, 지방별정직, 군무원이 포함되어 있음 3. 2001년 이후 기타에는 공익법무관, 기타직 공무원 등이 포함되어 있음 4. 청원경찰은 2002년까지는 경찰·소방으로 2003년부터는 기타로 분류되어 있음 5. 별정직, 일반직의 경우 2011년 이후 재직공무원의 직종관리체계를 변경함에 따라 지방직을 국가직으로 통합'
