summary_user: 경기도 저소득 장애인에게 지원한 의료비·보장구·보조기기 지원 건수와 금액을 시군별·연도별로 묶은 집계 자료로, 전체 지원 규모와 항목별 건수·금액을 함께 담는다. 복지 분석가나 지자체 담당자가 '어느 시군이 저소득 장애인 의료비 지원을 인구 대비 더 많이 하고 있나, 항목별로 어디에 예산이 몰리나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 경기도 시군 통계와는 시군 코드(SIGUN_CD)나 시군명·기준연도를 이름 또는 코드로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 저소득 장애인을 대상으로 한 의료비 및 보조기기 지원 현황을 시군별·연도별로 정리한 자료입니다. 항목에는 전체 지원 건수와 금액을 비롯하여 의료비 지원(건수·금액), 보장구 지원(건수·금액), 보조기기 지원(건수·금액) 등이 포함되어 있습니다. 본 데이터는 저소득층 장애인의 의료 접근성 향상 및 생활 편의 개선을 위한 공적 지원 규모를 파악하는 데 활용될 수 있으며, 시군 간 지원 차이, 지원 항목별 수혜 현황 분석, 복지 예산 편성 및 정책 효과성 평가 등에 기초 자료로 사용될 수 있습니다.
