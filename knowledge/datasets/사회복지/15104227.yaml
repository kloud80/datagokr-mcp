summary_user: 인천광역시 안의 지역자활센터를 한 행에 한 곳씩 담은 시설 목록 파일로, 시설명·주소·연락처·개관일·주요사업내용·위탁주체를 담는다(파일 크기 약 2KB의 소규모 CSV). 사회복지사나 공무원이 자활 지원 대상자에게 "이 동네에서 가장 가까운 자활센터는 어디이고 어떤 사업을 하나"를 안내할 때 쓴다. 전역 조인 키가 없어 다른 사회복지시설 데이터와는 시설명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 인천광역시 지역자활센터 현황 공공데이터는 인천시 내에서  자립·자활을 지원하기 위해 운영되는 지역자활센터들의 기본 정보를 담고 있습니다. 이 데이터에는 시설명, 주소, 연락처, 개관일, 주요사업내용, 위탁 주체에 대한 필수 정보가 포함되어 있어요. <활용 방안>-복지 연계 및 자원 안내사회복지사, 공무원 또는 관련 기관은 이 데이터를 활용하여 특정 지역에 거주하는 자활 지원 대상자에게 가장 가까운 센터를 안내하고, 효율적으로 자활 서비스를 연계하는 데 사용합니다.자활 사업에 참여를 희망하는 시민들이 정보를 쉽게 찾아볼 수 있도록 복지 지도 서비스나 정보 플랫폼 개발에 활용될 수 있습니다.해당 데이터는 인천시 정보공개포털 또는 공공데이터포털에서 확인할 수 있습니다.
