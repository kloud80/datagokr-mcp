summary_user: 경기도 시군이 여름철 폭염 대비로 설치한 그늘막을 설치장소 한 곳당 한 행으로 담은 원천 목록으로, 시군명·설치장소·도로명/지번 주소·위경도 좌표·높이와 지름·관리기관과 연락처·데이터 기준일자를 포함한다. 주민이 집 근처 횡단보도나 버스정류장에 그늘막이 있는지 확인하거나, 분석가가 시군별 설치 편차를 비교하고 신규 설치 후보지를 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명 같은 이름 매핑이나 위경도 좌표를 이용한 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 각 시군에서 여름철 폭염을 대비하여 설치한 그늘막의 위치와 설치 정보를 기록한 자료입니다. 주요 항목으로는 기준년도, 시군명, 읍면동명, 설치장소명, 도로명 주소, 지번 주소, 설치일자, 위도 및 경도 좌표, 운영 시작일자 및 종료일자, 관리기관명 및 연락처 등이 포함되어 있습니다. 해당 그늘막은 여름철에만 운영되며, 보행자의 열사병 및 일사병 예방을 위한 도시환경 개선 시설로, 교차로, 횡단보도, 버스정류장 등 햇빛 노출이 잦은 장소에 집중 설치됩니다. 이 자료는 그늘막의 분포 현황을 통해 시군별 설치 편차를 분석하거나, 신규 설치 후보지를 선정하는 데 활용될 수 있으며, 여름철 도시 열섬현상 대응, 건강안전 확보, 생활 인프라 개선 정책 수립의 기초자료로 유용합니다.
