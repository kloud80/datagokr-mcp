summary_user: 청소년 자기도전포상제에 참여 신청한 운영기관을 신청 건별로 담으며, 상위기관명·기관명·신청 상태와 대표전화·팩스·누리집·우편번호·주소를 전국 범위에서 개별 주소 단위로 제공한다. 청소년이나 학부모가 '우리 동네에서 자기도전포상제에 참여하는 기관은 어디이고 연락처는 무엇인가'를 찾을 때, 또는 분석가가 신청 상태별·지역별 참여기관 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 청소년 시설 데이터와는 기관명이나 주소(우편번호·주소 문자열)를 맞춰서만 이어 쓴다.
limits: 다른 데이터와 직접 연결할 공통 코드가 없어 기관명·주소 매칭에 의존해야 한다. 이벤트성으로 생성된 뒤 바뀌지 않는 성격의 데이터로 분류되어 있어 신청 상태 변화를 시계열로 추적하는 용도에는 맞지 않을 수 있다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
