description_portal: '공무원연금공단에서 관리하는 퇴직자 수를 연령별 및 급여종류별로 세분화하여 집계한 데이터로,연령은 18세부터 65세 이상까지 1세 단위로 구분되어 있으며, 각 연령대별로 총 퇴직자 수(합계)와 퇴직급여 및 유족급여 항목이 유형별로 구분되어 제공됩니다.퇴직급여 항목에는 퇴직일시금, 퇴직연금일시금, 퇴직연금, 조기연금, 수급대기자, 퇴직연금공제일시금이 포함되며, 유족급여 항목은 유족일시금, 유족연금일시금, 유족연금으로 구성되어 있습니다.1. 퇴직연금공제일시금 인원은 중복계상되지 않도록 "합계"와 "계"에서 제외함2. 급여종류별 지급인원이 퇴직자 수보다 적은 것은 퇴직수당만 지급된 자가 제외되었기 때문임. (사유 : 연계승인, 미수령합산, 퇴직급여 별도청구 등)3. 조기연금 : 연금지급개시연령 도달전 연금 신청자4. 수급대기자 : 연금지급개시연령 미도래자'
