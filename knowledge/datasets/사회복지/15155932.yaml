summary_user: 아이돌봄 지원사업의 현장 모니터링 결과를 기준연월·센터(상위센터 포함)·서비스종류·유형별로 집계해 담으며, 월간 목표가구수, 돌보미 점검 등급(가~라형)별 인원수, 전체 및 6개 영역별 1~3점 응답가구 수가 들어 있고 별도 오퍼레이션으로 응답일자·항목명 단위 응답 정보도 제공한다. 정책 담당자나 연구자가 '어느 지역 센터에서 돌보미 점검 하위 등급 비율이나 이용가구의 낮은 점수 응답이 많은가'처럼 센터별 돌봄 서비스 품질을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 센터명·상위센터명 같은 이름 매핑이나 같은 기관(한국건강가정진흥원)의 다른 아이돌봄 데이터와 기준연월·센터명으로 맞춰 이어 쓴다.
description_portal: 아이돌봄 현장 모니터링 통합 정보 데이터는 공공데이터법 제24조에 따라 추진되는 제4차 국가중점데이터 개방계획에 포함된 아이돌봄 지원사업 관련 데이터입니다.이 데이터는 국가적 파급효과와 활용가치가 높은 고수요 데이터를 국가중점데이터로 개방한다는 취지에 따라 선정되었으며, 표준화 절차와 품질 점검을 거쳐 신뢰성을 확보한 후 오픈API 방식으로 제공됩니다.이를 통해 이용자는 아이돌봄 서비스 현황 분석, 민간 서비스 연계 검토 등 다양한 정책·연구·서비스 기획 목적에 활용할 수 있으며, 다른 공공데이터와 결합하여 공공 및 민간 분야 전반에서 활용 범위를 넓힐 수 있습니다.
