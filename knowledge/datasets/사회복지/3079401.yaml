summary_user: 부산광역시 동래구 관내 독거노인 수를 동(해당동)별로 집계해 연령대(65~79세, 80세 이상), 성별, 국민기초생활수급자·일반독거노인 구분으로 나눠 담은 575바이트 크기의 작은 CSV 파일이다. 동래구 어느 동에 혼자 사는 고령·저소득 노인이 많은지 파악해 돌봄 인력이나 방문 서비스를 배치하려는 복지 담당자나 지역 분석가가 쓴다. 전역 조인 키가 없어 행정동 이름을 다른 데이터의 동 이름과 맞추거나 같은 기관(동래구) 자료로만 이어 쓰며, 시군구 단위로 묶으면 노인인구·노인복지시설 등 지역 통계와 연결한다.
