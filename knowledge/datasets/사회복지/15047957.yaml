description_portal: 대구광역시 관내 청소년수련시설 22개소의 현황에 대한 자료입니다.청소년활동을 적극적으로 진흥하기 위해 설치된 청소년수련시설에는 수련관, 수련원, 문화의집, 유스호스텔, 야영장, 특화시설 등이 포함되고 대구지역에는 시 및 구군에서 설치한 청소년수련원 3개소, 수련관 5개소, 문화의집 10개소, 특화시설 2개소, 유스호스텔 2개소가 현재 운영중입니다.시설명, 운영자, 소재지, 부지면적, 건물면적, 수용인원 등을 확인할 수 있으며, 자세한 사항은 붙임 목록의 연락처를 확인하시어 전화 문의 하시면 됩니다.
