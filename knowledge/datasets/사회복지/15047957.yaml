summary_user: 대구광역시 관내 청소년수련시설(수련원·수련관·문화의집·특화시설·유스호스텔) 22개소를 시설 한 곳당 한 행으로 담은 목록으로, 시설종류·운영자·소재지·부지면적·건물연면적·수용정원·연락처를 담는다. 대구의 청소년이나 학부모·단체 담당자가 "우리 동네 가까운 청소년 문화의집이나 단체 수련이 가능한 수용정원의 수련원은 어디인가"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 매핑해 잇고, 지역 단위 통계와는 주소의 구·군을 기준으로 연결한다.
