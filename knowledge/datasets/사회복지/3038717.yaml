description_portal: 본 데이터는 관내 노인 복지 증진을 목적으로 운영되고 있는 주요 시설들의 체계적인 관리와 행정 업무의 효율성을 높이기 위해 작성되었습니다. 조사 대상에는 노인일자리 지원기관, 전문 상담 서비스, 노인대학을 비롯하여 대한노인회 지회 사무국, 독거노인 대상 여가활동 및 소일거리 제공 시설, 그리고 노인 의료 및 재가 노인복지시설이 모두 포함되어 있습니다. 각 기관의 명칭, 소재지 주소, 대표 연락처 등 기초 정보를 전수 점검하여 최신 정보로 현행화한 기초 자료입니다.
