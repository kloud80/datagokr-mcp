description_portal: 한국청소년상담복지개발원에서 2022년 코로나19 상황에 대응하여 한시적으로 운영한 청소년상담사 대상 이러닝 연수과목 정보를 제공하는 데이터입니다. 본 데이터는 연수년도와 과목명으로 구성되어 있으며, 감염병 확산으로 대면 연수가 어려웠던 시기에 운영된 온라인 기반의 직무연수 과목 현황을 확인할 수 있습니다. 해당 과목들은 자격 유지 및 전문성 향상을 위한 목적으로 개설되었으며, 기존 집합연수의 대체 수단으로 한시 운영되었다는 특성을 가집니다. 데이터는 연도별로 실제 개설된 과목명을 기준으로 정리되어 있어, 비대면 연수 운영의 흐름과 연수 정책의 유연성을 파악하는 데 활용 가능합니다. 본 자료는 향후 유사한 상황에서의 온라인 교육 체계 수립에도 참고될 수 있습니다.
