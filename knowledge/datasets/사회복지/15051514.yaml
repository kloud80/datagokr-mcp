summary_user: 근로복지공단 퇴직연금기록관리시스템의 사업장 운용 현황 일부를 뽑은 전국 단위 파일로, 공시수익률 기준일자와 그날의 공시수익률(%), 장기수수료할인 기본 적용 시작일자만 담은 1KB 남짓의 작은 CSV다. 퇴직연금 가입자나 분석가가 근로복지공단 퇴직연금 상품의 공시수익률 수준과 장기 수수료 할인이 언제부터 적용됐는지 확인하고, IRP·DC 사업자를 고를 때 비교 근거로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 퇴직연금 수익률·수수료 데이터와는 기준일자나 기관명을 맞춰 수동으로 이어 붙여야 한다.
description_portal: 이 데이터는 근로복지공단에서 운영하는 퇴직연금기록관리시스템의 핵심 정보 중 하나인 퇴직연금 사업장 운용 현황(2019년 8월 31일 기준)을 담고 있습니다.주요 필드는 특정 시점의 공시 수익률 기준 일자, 해당 일자의 공시 수익률(%) 값, 그리고 장기 수수료 할인 기본 적용 시작 일자 등으로 구성되어 있습니다. 이 정보는 사업장 단위로 가입된 퇴직연금 상품의 성과 지표와 수수료 관련 정책 변동 시점을 파악하는 데 필수적입니다. 원본 DB는 통화 코드, 국가 코드, 은행 코드 등 금융 관련 메타데이터를 포함하는 구조로, 퇴직연금 상품의 국제적 및 금융기관별 특성을 분석하는 기초 자료로 활용될 수 있습니다. 본 파일은 해당 DB의 일부 추출본이며, 퇴직연금의 수익률 및 수수료 할인 기준에 대한 심층 분석이 가능합니다.
