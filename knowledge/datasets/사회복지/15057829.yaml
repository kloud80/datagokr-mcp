summary_user: 경기도 내 장애인 주간보호시설을 사업장 한 곳당 한 행으로 담으며, 시설명·인허가일자·영업상태·폐업일자·입소정원·자격소유인원·총인원·소재지 면적·주소·WGS84 좌표가 들어 있다. 복지 분석가나 시군 담당자가 우리 시군에 영업 중인 주간보호시설이 몇 곳이고 정원 대비 자격 종사자가 충분한지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 장애인 복지시설 현황과는 시군명·시군코드(SIGUN_CD)나 주소·좌표를 매핑해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장애인 주간보호시설 현황을 제공합니다. 장애인 주간보호시설은 낮 동안 장애인을 일시적으로 보호하고, 재활서비스·사회적응 훈련·일상생활 지원 등을 제공하는 기관입니다. 해당 데이터는 사업장명, 인허가일자, 영업상태, 입소정원, 자격소유인원수, 총인원수, 소재지 주소, 시설 면적, 좌표 정보 등을 포함합니다. 이를 통해 시군별 시설 분포, 보호 인원 수용 능력, 종사자 자격 현황 등을 파악할 수 있으며, 복지 인프라의 지역 간 불균형 여부를 확인하거나 장애인 복지 수요에 따른 시설 확충 계획을 세우는 데 활용할 수 있습니다. 또한 교통약자 이동지원센터, 장애인 근로사업장, 거주시설 현황 데이터와 연계 분석하면 장애인 통합 복지 서비스망을 설계하는 근거자료로 활용 가능합니다. 다만, 지방행정데이터개방시스템 개편으로 2018년 이후 데이터 갱신이 중단되었으므로, 최신성을 확보하기 위해 추가적인 보완 자료가 필요할 수 있습니다.
