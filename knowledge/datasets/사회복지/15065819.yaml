summary_user: 부산광역시 노인맞춤돌봄서비스 수행기관을 기관 한 곳당 한 행으로 담은 목록으로, 시도·시군구·수행기관명·시설유형·소재지 주소·대표전화를 담는다(포털 설명 기준 16개 구군 45개 수행기관과 광역기관 1개소). 홀로 사는 어르신이나 가족이 "우리 구에서 노인맞춤돌봄서비스를 맡은 기관은 어디이고 연락처는 무엇인가"를 찾을 때, 분석가가 구군별 수행기관 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 기관 코드가 없어 다른 데이터와는 시군구 이름이나 기관명·주소를 맞춰서만 이을 수 있고, 장기요양기관·사회복지시설 목록이나 시군구 단위 지역 통계와 함께 볼 때도 이름 매칭이 필요하다.
limits: 기관 기본정보만 있어 이용자 수나 서비스 실적은 이 파일로 알 수 없다(포털 설명의 32,893명은 설명문 수치다). 조인 키가 없어 다른 데이터와 연결할 때 기관명·주소 표기 차이로 매칭 오류가 생길 수 있다.
