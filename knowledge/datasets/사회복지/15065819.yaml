description_portal: 부산광역시 노인맞춤돌봄서비스 수행기관 현황 정보는 홀로 사는 노인에 대한 지원을 위한 수행기관의 기본정보로 구성된 데이터입니다.노인복지법 제27조의2(홀로 사는 노인에 대한 지원)에 따라 그 대상은 65세 이상의 수급자, 차상위 또는 기초연금 수급자 중  돌봄이 필요한 자로 하며,안정적 노후생활 보장, 노인의 기능 및 건강유지, 악화 예방을 위한 서비스를 제공합니다.부산시 16개 구군의 45개 수행기관을 두고 있으며, 광역기관 1개소(독거노인종합지원센터)가 있으며, 2025년 5월 기준 총 32,893명에게 노인맞춤돌봄서비스를 제공하였음.
