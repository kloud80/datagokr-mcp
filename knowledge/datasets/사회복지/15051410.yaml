summary_user: 부산광역시 연제구에 설치신고된 노인교실을 시설 한 곳당 한 행으로 담은 파일로, 시설명·시설장·소재지 주소·회원수·설치신고일자를 포함한다(파일 크기 926바이트 규모의 소량 목록). 연제구에 사는 60세 이상 어르신이나 가족이 집 근처에 라인댄스·노래교실 같은 프로그램을 하는 노인교실이 어디 있는지, 회원이 얼마나 되는지 찾을 때 쓴다. 전역 조인 키나 시설코드가 없어서 다른 노인복지시설 데이터와는 시설명이나 소재지 주소를 맞춰 보며 이어야 하고, 지역 단위 통계와는 연제구라는 시군구 단위로만 연결된다.
limits: 연제구 한 곳만 다루므로 다른 구나 부산시 전체와 비교하려면 별도 데이터가 필요하다. 표준 시설코드나 조인 키가 없어 다른 데이터와 맞출 때 이름·주소를 직접 대조해야 한다.
