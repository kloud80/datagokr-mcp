description_portal: '본 데이터는 제주특별자치도 제주시 관내 기초연금 수급자의 연도별 분포 현황을 읍면동 단위로 구분하여 제공하는 자료입니다. 수급 현황을 바탕으로 고령 인구의 생활 안정과 복지 정책 수립을 위한 기초 통계로 활용됩니다. 성별 및 가구 형태별 수급자 수를 함께 제공함으로써 지역별·사회적 특성에 따른 분석과 복지 예산 수립, 정책 대상자 발굴 등에 활용될 수 있습니다.주요 항목읍면동: 수급자 거주지의 행정구역 단위기준연도: 통계가 집계된 기준 연도(2014년~2026년)총수급자수: 해당 읍면동에서 기초연금을 수급 중인 전체 인원 수남성 / 여성: 수급자의 성별 인원 수노인단독: 혼자 거주하며 연금을 수급하는 노인가구 수노인부부(1인): 부부 중 한 명만 연금을 수급하는 가구 수노인부부(2인): 부부 모두 연금을 수급하는 가구 수이 데이터는 지역별 고령자 복지 수요 분석, 성별 및 가구유형별 빈곤 실태 파악, 복지정책 효과성 평가 및 노인 맞춤형 서비스 개발 등에 활용됩니다. 제주시청에서 정기적으로 집계·관리하며, 공공 복지 서비스의 객관적 지표로 제공됩니다.'
