description_portal: 관내 종합사회복지관(강서구종합사회복지관, 낙동종합사회복지관)에서 실시하는 주민 교육문화 프로그램 현황에 대한 정보로, 복지관명, 사업명(프로그램명), 프로그램 운영 일자, 수강대상, 프로그램 내용 등 관련 데이터를 제공합니다. 관내 아동청소년  및 성인, 노인 등 다양한 연령층의 지역주민을 위한 교육문화 프로그램을 지원함으로써 평생교육의 기반을 확충하고 문화결핍을 예방하여 지역주민의 삶의 질을 향상시키는 데 목적이 있습니다. 매월 홈페이지 접수 또는 현장, 전화접수로 진행하며, 선착순 마감에 따라 조기종료될 수 있습니다.
