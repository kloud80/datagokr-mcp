summary_user: 청소년 상담 사례를 청소년 상태별로 나눠 생활습관·외모 문제 유형 현황을 담은 전국 단위 집계 통계로, 표 제목·구분·X축·Y축 항목과 그 값(chtVl)이 한 칸씩 행으로 들어 있다. 상담기관 실무자나 정책 분석가가 "어떤 상태의 청소년에게 생활습관·외모 문제 상담이 많은가"를 확인해 상담·심리교육 프로그램을 기획할 때 쓴다. 실측 컬럼에 전역 조인 키나 지역 코드가 없어 다른 데이터와는 문제 유형·청소년 상태 이름을 맞추거나 같은 기관의 다른 청소년 상담 통계와 나란히 보는 방식으로만 잇는다.
description_portal: 청소년 상담 청소녀상태별 생활습관 및 외모 문제 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.청소년이 상태별로 겪는 생활습관과 외모에 대한 문제 현황은 개인의 자기관리 및 자존감 이슈를 파악하는 데 기여합니다. 또한 외형적 스트레스 요인과 건강 습관의 결함을 구분해 분석할 수 있어, 상담 및 심리교육 프로그램 개발에 유익합니다. 청소년의 건강한 라이프스타일 형성 지원 정책의 기초자료로 활용될 수 있습니다.
