summary_user: 대전광역시 행정기관의 여성폭력피해 상담전화를 기관별로 한 줄씩 담은 작은 파일(csv, 446 bytes)로, 명칭·소재지·평일 운영시간·전화번호를 담는다. 가정폭력·성폭력·스토킹 등 피해자나 지원 실무자가 '대전에서 지금 연락할 수 있는 행정기관 상담전화는 어디이고 몇 시까지 받는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 사회복지시설 마스터 등 다른 데이터와는 기관 명칭이나 소재지 주소를 맞춰서만 이어 쓴다.
description_portal: 대전광역시 행정기관의 여성 폭력 피해 상담 전화 자료는 여성 폭력 피해자의 긴급 구조와 일상 회복을 위한 다양한 전화 상담 지원 서비스를 집약하고 있습니다. 상담 전화의 명칭, 소재지, 운영 시간, 전화번호 등 핵심 항목을 통해 해당 기관 별 위치와 접근성을 명확히 확인할 수 있으며, 행정기관을 포함하여 다양한 전문 상담소, 보호 시설, 의료 기관 등과 연결되는 실질적인 접근 경로를 제공합니다. 1366 여성긴급전화센터와 해바라기 센터 등은 365일 24시간 운영되며, 가정 폭력, 성폭력, 성매매, 디지털 폭력, 스토킹 등 다양한 폭력 피해에 대해 신속 상담과 심리 치료, 치유 프로그램, 증거 채취, 법률·의료 연계 및 현장 조사까지 폭넓게 지원하고 있습니다.
