description_portal: 본 데이터는 한국청소년활동진흥원이 청소년의 핵심역량 및 진로인식 관련 항목을 중심으로 실시한 설문조사를 기반으로 구성된 응답결과 자료이다. 설문은 비판적 사고, 공감 능력, 소통 역량, 창의적 사고력, 공동체 의식, 협동성, 진로인식, 진로탐색 및 진로설계 역량 등 총 8개 핵심역량 영역에 대한 자기평가 항목으로 구성되어 있으며, 응답자의 성별 및 연령 정보도 함께 포함된다.데이터는 문항별 응답 값이 개별 컬럼으로 정리되어 있으며, 각 항목은 리커트 5점 척도 방식으로 측정된다. 예를 들어, '비판적 사고 1문항'부터 '진로설계 4문항'까지 총 44개 문항이 포함되어 있으며, 이는 응답자의 역량 수준을 다면적으로 분석할 수 있도록 설계되었다. 수집은 온라인 기반 설문 시스템을 활용하여 자발적 참여를 통해 진행되었으며, 조사 시점별로 응답 시간도 함께 기록되어 있다.해당 데이터는 청소년 역량 교육 효과성 분석, 프로그램 개발을 위한 기초자료, 정책 방향 수립을 위한 근거 자료 등 다양한 용도로 활용 가능하다. 특히, 문항별 통계 분석, 상관분석, 요인분석 등을 통해 청소년 특성에 맞춘 맞춤형 교육 콘텐츠 설계 및 지역별·성별 특성 차이를 반영한 정책 수립에 기여할 수 있다.
