summary_user: 경기도 시·군별 교통약자 이동지원센터의 기관명, 지번·도로명 주소, 우편번호, 전화번호, 홈페이지, WGS84 위경도를 센터 한 곳당 한 행으로 담은 목록이다. 장애인·고령자 가족이 우리 시·군 이동지원센터 연락처와 예약 홈페이지를 찾거나, 분석가가 시·군별 센터 위치와 접근성 격차를 지도에서 비교할 때 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명·시군코드(SIGUN_CD) 이름 매핑이나 위경도 좌표 기반 공간 결합으로 잇는다.
description_portal: 경기도 각 시‧군별 교통약자이동지원센터 홈페이지에서 제공하는 정보입니다. 기관명, 소재지지번주소, 연락처 등의 정보를 제공합니다.이 데이터는 경기도 내 교통약자를 위한 이동지원센터의 운영 현황을 담은 자료로, 고령자, 장애인, 임산부 등 교통약자의 이동권 보장을 위한 공공교통지원기관 정보를 제공합니다. 주요 항목은 시군명, 센터명, 지번주소 및 도로명주소, 우편번호, 전화번호, WGS84 좌표(위도·경도), 홈페이지 URL 등으로 구성되어 있으며, 각 센터는 휠체어 탑승 가능 차량, 저상버스, 특별교통수단(콜택시) 등을 통해 대상자에게 이동 서비스를 제공합니다. 본 자료는 지역 간 이동서비스 격차 분석, 교통약자 수요 대응 전략 수립, 복지교통 인프라 구축, 서비스 웹사이트 기반 예약 시스템 연계 등에 활용될 수 있으며, 지리정보(GIS) 기반의 분석을 통해 교통약자 서비스 접근성 평가에도 유용합니다. 데이터는 경기도 및 각 시군 교통복지 부서 또는 교통약자이동지원센터 운영기관에서 수집한 공공데이터입니다.
