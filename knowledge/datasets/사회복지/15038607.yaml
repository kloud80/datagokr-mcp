summary_user: 사회적기업 판로지원 통합플랫폼(e-store 36.5)에 입점한 사회적경제기업 상품 판매사를 판매사 한 곳당 한 행으로 담은 전국 범위 목록 파일(CSV, 약 840KB)로, 판매자명·기업유형(인증사회적기업, 예비사회적기업 등)·업태·종목·대표자·연락처·주소를 담는다. 공공기관 구매 담당자나 소비자가 '화장품이나 음료를 만드는 인증사회적기업 판매사 중 우리 지역에 있는 곳은 어디인가'를 찾을 때 쓴다. 인증번호·사업자번호 같은 전역 조인 키가 없어 다른 사회적기업·협동조합 목록과는 판매자명(기업명)이나 주소를 맞춰 이어야 한다.
description_portal: 사회적기업 판로지원 통합플랫폼(e-store 36.5, sepp.or.kr) 에 입점하여 사회적경제기업 상품을 판매하는 사회적경제기업 상품 판매사 정보입니다. 판매자명 / 기업유형(인증사회적기업, 부처형 예비사회적기업, 지역형 예비사회적기업 등) / 업태(제조업, 도소매, 서비스업 등) / 종목(화장품, 음료류 등) / 대표자명 / 연락처 / 우편번호 / 주소 의 정보를 제공합니다.사회적기업의 기업유형, 업태, 종목등을 통해 원하는 상품을 판매하는 판매사를 찾아보거나 구매 등에 사용하시기 유용한 자료입니다.데이터 관련 문의가 있으시다면 한국사회적기업진흥원 정보화기획팀으로 문의 부탁드리겠습니다. 감사합니다.
