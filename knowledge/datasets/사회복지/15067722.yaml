description_portal: 한국서부발전 시행년월별 사회공헌활동 내역 정보입니다. 사회공헌활동 내역 데이터는 공기업으로서 지역사회와 함께 성장하기 위해 추진한 다양한 활동을 기록한 자료입니다. 이 데이터에는 연도별로 시행된 사회공헌활동 내용이 기재되어 있습니다. 주요 활동으로는 떡국나눔 봉사활동, 배식 봉사활동, 사회공헌 아이디어 공모 시상식 개최, 태안지역 수산종자 매입방류사업, 태안여고 진로탐색 멘토링 행사, 태안군 시니어 동고동락 일자리 창출사업 발대, 실속형 공기청정기 나눔, 청소년 인성교육 뮤지컬 개최 등이 있습니다.
