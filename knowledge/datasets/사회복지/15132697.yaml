summary_user: 청소년 자기도전포상제 입회 결제 건마다 결제일련번호(stlmSn)와 등록일시를 담는 건별 이력 데이터로, 범위는 전국이며 공간 단위는 없습니다. 포상제를 운영하는 쪽이나 분석가가 "입회 결제가 어느 시기·시간대에 몰리는가"처럼 결제 빈도와 시점 분포를 확인할 때 쓴다. 실측 컬럼에는 다른 데이터와 잇는 공통 키가 없어, 같은 기관이 제공하는 포상제 관련 데이터와 이름·코드 매핑으로만 연결한다.
limits: 전역 조인 키가 없어 지역 통계나 시설 데이터와 바로 결합하기 어렵다. 공개 필드가 결제일련번호와 등록일시뿐이어서 금액·회원·기관 정보는 이 데이터만으로 알 수 없다. 이벤트 때 생성된 뒤 바뀌지 않는 이력으로 분류되어 있으며, 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회까지 쓸 수 있다.
