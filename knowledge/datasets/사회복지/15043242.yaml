summary_user: 경기도 시군·읍면동별로 겨울철 한파에 대비해 한시 설치되는 천막형 온기나눔쉼터를 설치 장소 단위로 담으며, 도로명·지번 주소와 위경도 좌표, 운영 시작·종료일, 관리기관과 연락처, 기준연도가 들어 있다. 주민이 우리 동네 가까운 한파 쉼터가 어디이고 언제까지 운영하는지 찾거나, 분석가가 노인 인구 대비 쉼터 접근성이 부족한 지역을 가려내는 데 쓴다. 전역 조인 키는 없어서 시군·읍면동 이름이나 주소·좌표로 인구·취약계층 통계나 다른 한파쉼터 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내에 겨울철 한파에 대비해 한시적으로 설치되는 야외 임시대피 공간의 운영 현황을 정리한 자료입니다. 쉼터가 설치된 위치, 지리적 좌표, 운영 시작 및 종료 시기, 관리기관 정보 등이 포함되어 있으며, 시설 위치 분석, 접근성 평가, 복지 정책 수립 등의 자료로 활용될 수 있습니다. 특히 기후 취약계층이나 노약자에게 실질적인 도움이 되는 생활 밀착형 공공서비스로서, 지역사회 내 한파 대응 체계의 일환으로 중요한 역할을 합니다.※ 온기나눔쉼터는 겨울 기간 동안에만 설치됩니다.※ 천막형태의 설치물들에 대한 정보입니다.
