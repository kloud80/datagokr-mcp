summary_user: e새일의 경력단절여성 대상 직업교육훈련과정을 과정 단위로 담으며, 과정명·교육연도·교육목표·교육의 장점·교육 유형·직업교육 시간·교육 종료일자와 데이터 기준일자를 제공하는 전국 범위 API다. 재취업을 준비하는 여성이나 새일센터·정책 담당자가 어떤 유형의 직업교육이 몇 시간 과정으로 운영되는지 확인하거나 교육 프로그램을 설계할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 과정명 등 이름 매핑이나 같은 기관(성평등가족부) 자료끼리로만 이어 쓴다.
description_portal: 경력단절여성등의 경제활동 촉진법 제13조 제1항과 관련하여 e새일의 직업교육 및 직업훈련과정 내용을 제공하는 오픈 API형 데이터입니다.   해당 개방데이터는 e새일의 교육과정 명칭, 교육연도, 교육목표, 교육의 장점, 교육 유형, 직업 교육 시간, 교육 종료일자를 조회할 수 있습니다.  경력단절여성 대상 직업 교육 현황을 체계적으로 파악할 수 있어, 재취업을 위한 교육 설계 및 맞춤형 프로그램 개발에 활용될 수 있습니다. 또한 교육 수요 예측, 정책 개선, 홍보 자료 제작 등 다양한 행정 및 민간 분야에서 유용한 기반 자료로 활용될 수 있습니다.
