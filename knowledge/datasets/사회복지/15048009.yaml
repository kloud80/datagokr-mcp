summary_user: 충청남도 아산시에 있는 장애인복지시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설 구분·시설명·시설장·소재지·전화번호·설치신고일자를 담는다. 아산시 주민이나 보호자가 거주·재활·직업재활 등 어떤 종류의 장애인시설이 시내 어디에 있고 어디로 연락하면 되는지 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 주소(소재지)를 맞춰 붙이는 방식으로만 연결된다.
description_portal: '장애인복지법 제58조(장애인복지시설) 제58조(장애인복지시설) ①장애인복지시설의 종류는 다음 각 호와 같다. <개정 2011. 3. 30., 2020. 12. 29.>1. 장애인 거주시설: 거주공간을 활용하여 일반가정에서 생활하기 어려운 장애인에게 일정 기간 동안 거주ㆍ요양ㆍ지원 등의 서비스를 제공하는 동시에 지역사회생활을 지원하는 시설2. 장애인 지역사회재활시설 : 장애인을 전문적으로 상담ㆍ치료ㆍ훈련하거나 장애인의 일상생활, 여가활동 및 사회참여활동 등을 지원하는 시설3. 장애인 직업재활시설 : 일반 작업환경에서는 일하기 어려운 장애인이 특별히 준비된 작업환경에서 직업훈련을 받거나 직업 생활을 할 수 있도록 하는 시설(직업훈련 및 직업 생활을 위하여 필요한 제조ㆍ가공 시설, 공장 및 영업장 등 부속용도의 시설로서 보건복지부령으로 정하는 시설을 포함한다)4. 장애인 의료재활시설: 장애인을 입원 또는 통원하게 하여 상담, 진단ㆍ판정, 치료 등 의료재활서비스를 제공하는 시설5. 그 밖에 대통령령으로 정하는 시설②제1항 각 호에 따른 장애인복지시설의 구체적인 종류와 사업 등에 관한 사항은 보건복지부령으로 정한다. <개정 2008. 2. 29., 2010. 1. 18.>본 데이터는 충청남도 아산시 장애인복지시설 현황으로서 구성컬럼으로는 시설명, 대표자, 주소, 연락처 등의 정보를 포함합니다.'
