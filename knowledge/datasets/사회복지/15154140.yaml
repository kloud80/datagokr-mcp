summary_user: 전국 청소년상담복지센터·학교밖청소년지원센터·청소년쉼터 602곳을 기관 단위로 담은 CSV 파일로, 주소·좌표와 근무시간, 상담공간, 상담 자격 보유 인원을 싣는다. 위기 청소년이나 보호자가 내 지역에서 가까운 상담·보호 기관이 어디인지, 야간·주말에도 여는지 찾는 질문과, 지자체·분석가가 지역별 기관 분포와 인력 현황을 보는 질문에 쓴다. 기관 코드 키는 없고 주소(주소·자세한주소)와 좌표(기관위도·기관경도)로 지도나 시군구 단위 지역 통계에 이어 쓴다.
description_portal: 본 데이터는 위기청소년통합지원정보시스템을 사용하는 청소년상담복지센터, 학교밖청소년지원센터, 청소년쉼터 관련 정보로 구성되어 있습니다. 주요 항목은 기관분류, 기관명, 기관유형, 홈페이지 주소, 우편번호, 주소, 전화번호, 팩스번호, 개소일 등 기본 정보와 위도·경도 좌표, 시설현황, 근무시간, 전화상담 운영 여부, 상담공간의 개수 및 면적, 학교 밖 청소년 전용공간 보유 여부, 상담 자격증 보유 인원 등입니다. 기관분류에 따라 해당하지 않는 항목은 '비어있음'으로, 미작성된 항목은 '미확인'으로 표기되어 있습니다.이를 통해 청소년상담 및 복지기관의 운영정보와 공간 구성, 인력 자격 현황을 파악할 수 있으며, 지역사회 청소년 지원체계 강화 및 정책 수립에 활용 가능합니다. 본 데이터는 청소년 관련 시설의 실태를 이해하고 상담환경 개선을 위한 기초자료로서 가치가 있습니다.
