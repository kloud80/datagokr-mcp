description_portal: '○ 통계개요* 통계명 : 1인 가구* 통계종류 : 지정, 조사통계* 근거법령 : 인구주택총조사 규칙* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책 입안의기초자료 제공하고, 각종 가구관련 경상조사 표본틀(Sampling Frame)의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 조사원→동.읍.면→구.시.군→시.도→통계청** 2015년 : 전수조사 : 공공기관 및 사법기관 → 통계청표본조사 : 조사원→동.읍.면→구.시.군→시.도→통계청* 공표주기 : 정기(5년, 11월1일 0시 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 1인가구의 사유별(유배우, 사별 등) 가구수○ 용어설명* 1인가구 : 혼자서 살림하는 가구, 즉 1인이 독립적으로 취사ㆍ취침 등 생계를 유지하고있는 가구를 말함* 가구 : 1인 또는 2인 이상이 모여서 취사, 취침 등 생계를 같이하는 생활단위** 일반가구 : 가족으로 이루어진 가구, 가족과 5인 이하의 남남이 함께 사는 가구,1인가구, 가족이 아닌 남남끼리 사는 5인 이하의 가구** 집단가구 : 가족이 아닌 남남끼리 함께 사는 6인 이상의 가구,기숙사나 노인요양시설?보육원 등 사회시설에 집단으로 살고 있는 가구** 외국인가구 : 외국인만으로만 구성된 가구** 한국인과 외국인이 함께 사는 가구는 "일반가구"로 분류* 혼인상태 : 호적이나 주민등록상의 신고와는 관계없이 15세 이상자에 대한 사실상의혼인상태를 말함○ 기타* 2015년 인구주택총조사의 전수부문은 행정자료를 활용한 등록센서스 방식이 적용되었고표본부문은 현장조사(방문면접조사) 방식으로 실시되었음* 표본자료에 대한 모수추정으로 전수조사결과와 표본조사결과의 차이가 발생할 수 있음** 모수추정 : 전수결과(등록센서스 결과)를 모수로 인구, 가구 및 거처를 구분하여 모수추정○ 출 처 : 통계청 인구주택총조사'
