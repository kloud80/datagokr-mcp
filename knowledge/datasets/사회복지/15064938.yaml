summary_user: 사립학교교직원연금공단이 체결한 계약을 건별로 담은 파일로, 계약명·업체명·금액(천원 단위)·계약시작일자·계약방법·담당부서를 전국 범위로 제공한다. 조달 분석가나 납품을 준비하는 사업자가 '이 공단은 어떤 계약을 어떤 방식으로 어느 업체와 얼마에 맺었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 기관의 계약 현황과는 업체명·계약방법 같은 이름 매칭으로만 이어 볼 수 있다.
