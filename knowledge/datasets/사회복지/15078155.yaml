summary_user: 아이돌봄 제공기관별로 기준연월(crtrYm) 시점의 아이돌보미 수를 누적·시간제·영아종일제·종합형·질병아동·기관연계 서비스 유형별로 나눠 담은 전국 단위 집계 데이터이며, 기관명과 상위기관명이 함께 들어 있다. 지자체 담당자나 분석가가 "우리 지역 아이돌봄기관에는 영아종일제나 질병아동 돌보미가 시간제에 비해 얼마나 부족한가"를 확인하거나 서비스 유형별 인력 배치를 검토하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명이나 같은 기관(한국건강가정진흥원)의 아이돌봄기관 번호로만 이어 붙일 수 있다.
limits: 실측 컬럼에 전역 조인 키가 없어 사회복지시설 마스터 등 다른 기관 데이터와는 이름 매칭으로만 연결된다. 범위는 전국이지만 좌표 등 공간 정보가 없어 지도 분석에는 바로 쓰기 어렵다. 개발계정 호출 한도는 하루 10,000회다.
