summary_user: 국민연금공단이 만 65세 이상에게 보낸 기초연금 신청 안내문 대상자 수를 기준년월(안내문 발송 시점)·시도·시군구·안내문 구분별로 집계한 파일로, 전국을 시군구 단위로 담는다. 지자체 복지 담당자나 분석가가 "우리 시군구에서 올해 기초연금 신청 안내를 받은 65세 도래자와 수급희망 이력 대상자는 몇 명인가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름을 행정구역 코드에 매핑해 연결해야 한다.
description_portal: 2023년~2024년의 만 65세 이상의 기초연금 안내 대상자 현황에 대한 데이터로 기준년월(안내문 발송 시점), 시도, 시군구, 안내대상, 65세도래년월(수급희망이력 안내년월) 안내문구분을 제공합니다. 기초연금은 사회보장급여 중 하나이며 만65세 이상 노인이 신청 가능합니다. 이에 따라 국민연금공단은 대상자에 대해 신청 안내문을 보내고  대상자 현황을 행정구역별로 관리하고 있습니다. 또한 이미 신청한 사람 중 수급희망 이력관리도 신청한 대상자는 기초연금 선정 탈락 시 매년 소득과 재산을 조사하여 수급가능성이 높은 대상자에 대해 신청 안내문을 발송하고 현황을 관리하고 있습니다.
