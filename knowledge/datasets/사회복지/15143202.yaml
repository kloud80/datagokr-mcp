description_portal: 서울특별시 강남구 내 여러 구역에 설치된 그늘막마다 위치를 안내하는 자료로, 사용자가 장소를 쉽게 찾을 수 있도록 세부 항목 별로 체계적으로 정리되어 있습니다. 이 자료에는 다섯 가지 정보가 포함되어 있는데, 각각 관리번호, 도로명 주소, 지번 주소, 위도, 그리고 경도입니다. 우관리번호는 그늘막이 속해 있는 행정동명을 먼저 표기하고, 그 뒤에 일련번호를 붙이는 “행정동별-숫자” 형식으로 이루어져 있어, 각 행정동 내에서 그늘막을 순서대로 식별할 수 있게 도와줍니다. 도로명 주소 항목에는 주소 끝부분에 해당 그늘막이 설치된 동 이름이 함께 표기되어 있습니다. 도로명 기반으로 장소를 찾을 때 가까운 동까지 바로 확인할 수 있습니다. 또한, 도로명 주소 옆에 지번 주소도 함께 적어놓았으며,  도로명 주소만으로는 위치 확인이 다소 어려운 경우 유용하게 활용될 수 있습니다. 뿐만 아니라, 각 그늘막 마다 위도와 경도값도 제공되어 있는데, 이렇게 좌표 데이터를 포함하면 GPS 기반 길찾기 기기나 스마트폰 내비게이션, 또는 인터넷 지도 서비스 등을 통해 아주 손쉽고 정확하게 실물 위치를 찾아갈 수 있습니다.
