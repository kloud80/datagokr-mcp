description_portal: 광주광역시 동구의 장애인시설 현황 데이터는 지역 내 장애인 복지 향상과 관련 시설 운영의 체계적인 관리를 위해 구축된 중요한 복지행정 자료입니다. 이 데이터는 장애인의 생활 지원, 재활, 교육, 직업훈련 등 다양한 복지 서비스를 제공하는 시설의 운영 실태를 파악하기 위해 활용되며, 시설명, 시설종류, 소재지, 정원/현원, 종사자, 전화번호 등의 항목으로 구성되어 있습니다.각 항목의 의미는 다음과 같습니다.시설명은 장애인시설의 공식 명칭을 나타내며, 행정기관의 관리 대상 식별과 주민 안내에 사용됩니다.시설종류는 생활시설, 이용시설, 재활시설, 직업재활시설 등 시설의 운영 유형을 구분하는 정보로, 제공 서비스의 성격을 파악하는 데 필수적입니다.소재지는 시설의 도로명주소 또는 지번 주소로, 접근성 분석, 지도 기반 안내, 시설 점검 계획 등에 활용됩니다.정원/현원은 시설이 수용할 수 있는 최대 인원(정원)과 실제 입소자 또는 이용자 수(현원)를 나타내며, 시설 운영 효율성·수요 파악·추가 지원 필요성 판단에 중요한 지표입니다.종사자 정보는 시설에서 근무하는 직원 수 또는 담당자의 역할을 제공해 서비스 품질 평가 및 인력지원 정책 수립에 사용됩니다.전화번호는 시설과의 소통을 위한 필수 연락처로, 민원 상담, 서비스 문의, 행정 협조 요청 등에 활용됩니다.이 데이터는 동구의 장애인 복지정책 수립, 시설 운영 현황 분석, 서비스 질 향상, 수요 기반 예산 편성 등 다양한 행정 업무에 활용되는 중요한 기반 자료입니다. 또한 주민에게 장애인시설 정보 제공을 통해 접근성과 이용 편의를 높이는 데에도 큰 역할을 합니다.
