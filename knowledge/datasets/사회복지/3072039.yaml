description_portal: 부산광역시 기장군 소재 어린이집에 대한 현황자료입니다. 내용은 2026년 어린이집명, 유형, 정원수, 소재지, 전화번호, 팩스번호, 총 보육실수, 놀이터 수 단, 가정, 국공립 어린이집 중 관리동 및 아파트 내 놀이터 공동으로 사용 되며 어린이집당 1개의 놀이터를 보유하고 있지는 않습니다.  차량운영 유무 또한 현원을 기준으로 등록된 차에 한하여 제공된 자료입니다. 해당 내역은 교육부에서 주관하는 보육통합시스템을 사용하여 변동되는 아동의 정원 및 어린이집 폐원 관련하여 확인 할 수 있는 시스템으로 실시간으로 운영 되고 있고 연간 보육아동의 현원을 통계치로 확인 할 수 있습니다.
