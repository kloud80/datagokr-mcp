summary_user: 서울 성북구 안에서 산모·신생아 건강관리 바우처 서비스를 제공하는 기관을 기관 한 곳당 한 행으로 담은 목록이다. 기관명·주소·전화번호·행정동이 들어 있고, 파일 크기가 약 1KB인 작은 CSV다. 성북구에 사는 산모나 가족이 "우리 동네 근처에서 산후도우미 바우처를 쓸 수 있는 업체가 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 공통 조인 키가 없어서, 다른 데이터와 이으려면 주소를 지오코딩하거나 행정동 이름을 맞춰야 하며, 그렇게 하면 동별 출생아 수 같은 통계와 견줘 볼 수 있다.
description_portal: 이 데이터는 서울특별시 성북구 내 산모 및 신생아를 위한 건강관리 바우처 제공기관의 현황 정보를 담고 있습니다.각 기관의 명칭, 주소, 전화번호, 행정동, 기준일자(2021년 1월 1일) 등의 세부 항목이 포함되어 있으며,성북구 관내 산모·신생아를 대상으로 한 건강관리 서비스 접근성 및 지역별 분포 현황을 분석하는 데 활용할 수 있습니다. 또한 지역별 복지 인프라 구축, 모성·영유아 건강정책 평가, 서비스 수요 예측, 민간·공공 협력체계 구축 연구 등에 유용하게 활용될 수 있습니다.데이터는 기관명·주소·전화번호 등 표준화된 속성 구조로 구성되어 있어 검색 및 지도 시각화, 결합 분석이 용이합니다.
