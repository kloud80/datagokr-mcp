summary_user: 경기도 장애인구강진료센터의 진료비 감면 실적을 기준년도·기관명·감면기준(50%·30%·10%, 병원 자체 기준 등)별로 묶어 전체 환자 수와 분기별 환자 수·지원금액을 담은 집계 자료다. 복지·보건 정책 담당자나 연구자가 '감면 기준별로 분기마다 몇 명이 얼마를 지원받았나'를 확인하고 기관별 지원 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(INST_NM)·기준년도 같은 이름 매칭으로만 연결한다.
description_portal: '경기장애인구강진료센터 진료비감면 현황 데이터는 경기도 권역 내 장애인 구강진료센터에서 제공하는 진료비 감면 실적을 집계한 보건·복지 통계자료입니다. 주요 항목에는 기준년도, 기관명, 감면기준구분명(예: 50%, 30%, 10% 감면 및 병원 자체 기준), 전체환자수, 분기별 환자수 및 지원금액이 포함됩니다. 데이터는 매년 12월 말 기준으로 작성되며, 장애인 환자의 진료비 부담 완화를 위한 공공 지원 현황을 확인할 수 있습니다. 이를 통해 지역별·기관별 지원 차이를 비교하고, 장애인 구강건강 증진 정책의 효과를 분석할 수 있습니다. 또한 복지정책 기획, 공공보건의료 연구, 예산 배분 근거 자료로 활용될 수 있으며, 진료비 감면제도의 실효성과 환자 접근성을 평가하는 데 중요한 자료가 됩니다.'
