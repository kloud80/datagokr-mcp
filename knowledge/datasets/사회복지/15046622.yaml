description_portal: '○ 통계개요* 통계명 : 장애연금 등급별 급여지급 현황* 통계종류 : 일반통계* 근거법령 : 통계법 제18조(승인번호 : 제32202호)* 작성목적 : 국민연금의 가입자, 징수, 급여, 기금현황 등을 파악하여 경제, 사회정책수립 및 관련 연구, 분석 등을 위한 기초 자료로 활용* 조사체계 : 지사(제 신고서 접수 및 입력) → 국민연금공단* 공표주기 : 매년* 공표범위 : 지역- 서울시내용 - 장애연금 등급별 수급자수 및 금액 등○ 용어설명* 장애연금 : 가입중에 발생한 질병 (당해 질병의 초진일이 가입중에 있는 경우로서가입자가 입당시 발병 사실을 알지 못한 경우 포함) 또는 부상으로 인하여완치후에도 장애가 남았을 때 장애정도 (1~3급)에 따라 연금으로 지급되는급여* 장애일시금 : 가입중에 발생한 질병 또는 부상으로 인하여 완치후에도 장애가(4급)남았을 때 일시금으로 지급되는 급여○ 기타* 계수 중 단위미만 수는 반올림을 원칙으로 한 것으로 내용과 총수가 일치하지 않는 경우가 있을 수 있음'
