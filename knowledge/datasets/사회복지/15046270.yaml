description_portal: '○ 통계개요* 통계명 : 가구형태별 가구 및 가구원(동별)* 통계종류 : 서울시 가구 및 가구원수를 가구형태별로 제공하는 지정ㆍ조사통계* 근거법령 :「인구주택총조사 규칙」(기획재정부령 제173호)* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책입안의기초자료 제공하고, 각종 가구관련 경상조사 표본틀(Sampling Frame)의기초자료로 활용하는 것을 목적으로 함* 조사체계 : 통계청(주관기관), 지방자치단체 및 6개 중앙행정기관(실시기관)- 일반조사구 : 시도 ⇔ 시군구 ⇔ 읍면동(총관리자) ⇔ 조사관리자 ⇔ 조사원* 공표주기 : 정기(5년, 11월1일 0시 기준)* 공표범위 : 지역 - 서울시 및 자치구, 행정동내용 - 가구형태별(일반가구, 집단가구, 외국인가구) 가구수 및 가구원수○ 용어설명○ 기 타* 일반가구, 집단가구(6인 이상 비혈연 가구, 기숙사, 사회시설 등) 및 외국인가구를 대상으로 집계* 내국인(한국인)과 함께 살고 있는 외국인은 일반가구의 가구원으로 집계* 개인정보 보호와 자료 노출 위험성을 최소하기 위하여 5미만 자료는 x로 표기함* 2015년 인구주택총조사의 전수부문은 행정자료를 활용한 등록센서스 방식이 적용되었고표본부문은 현장조사(방문면접조사) 방식으로 실시되었음○ 출 처 : 통계청「인구주택총조사」'
