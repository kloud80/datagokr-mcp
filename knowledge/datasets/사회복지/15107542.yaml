summary_user: 행정안전 통계연보의 '지방행정/지역발전' 편에 실린 지역별 마을기업 육성사업 통계로, 지역마다 마을기업 수와 사업비(합계·국비·지방비)를 집계해 담는다. 정책 분석가나 지자체 담당자가 시도별로 마을기업이 몇 곳이고 육성 사업비 가운데 국비와 지방비가 각각 얼마인지 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로 다른 지역 통계와는 지역명 매핑으로만 이어 쓴다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '마을기업 육성사업', '지역별 마을기업 육성사업'에 관한 통계입니다. 지역, 마을기업, 사업비 계, 사업비 국비, 사업비 지방비 등을 기준으로 하는 지역별 마을기업 육성사업 정보를 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
