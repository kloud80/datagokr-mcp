summary_user: 경기도 의정부시 안의 노인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·지번주소·전화번호·인허가일자·운영상태·입소정원·데이터기준일자를 담는다. 주민이나 돌봄 사업자가 의정부시에서 지금 운영 중인 경로당·노인시설이 어디에 있고 정원이 얼마인지 확인하거나, 분석가가 동네별 시설 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 매칭으로 잇고, 시군구 단위로 지역 노인 인구 통계와 나란히 놓고 보는 방식으로 쓴다.
