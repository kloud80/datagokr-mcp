description_portal: 이 데이터는 한국보육진흥원이 운영하는 ‘부모모니터링단’의 시도별 어린이집 모니터링 실적 현황을 정리한 통계 자료로, 2023년 7월 기준 전국 17개 시도에서 실시된 모니터링 건수를 수록하고 있습니다. 부모모니터링은 부모와 보육·보건 전문가가 어린이집의 급식, 위생, 건강, 안전관리 등을 점검하는 활동으로 운영되며, 본 데이터는 시도별 모니터링 건수를 INT 형식으로 제공합니다. 데이터는 지역명을 기준으로 행이 구성되며, 해당 지역의 모니터링 실적이 열에 배치된 구조로 되어 있습니다. 단일 시점을 기준으로 지역 간 실행 규모를 수치적으로 비교할 수 있도록 구성된 정량적 집계 데이터입니다.
