description_portal: 1.개요 ㅇ 연도별 예금보험공사 생활금융교육 실시 현황2. 단위 ㅇ (회) 실시횟수 ㅇ (명) 참여자3. 참고 ㅇ 공사는 금융소비자의 금융역량을 강화하여 금융정보 부족으로 발생하는 피해를 사전에 예방하고자 2010년부터 초등학생 및 노년층을 시작으로 시장상인, 다문화가족, 중학생, 고등학생, 북이탈주민, 장애인, 군인, 청년층 등 미래금융소비자와 금융취약계층을 중심으로 교육 대상 및 인원을 지속적으로 확대하고 있으며, 교육대상별 특성에 맞는 맞춤형 콘텐츠를 통해 생활금융교육을 실시하고 있습니다.
