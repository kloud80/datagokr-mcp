summary_user: 전북특별자치도 무주군 관내 경로당(일반경로당·할머니경로당, 마을회관 겸용 포함)을 한 곳씩 담은 건별 목록으로, 경로당명과 도로명·지번 주소, 위도·경도를 시군구 범위에서 제공한다. 주민이나 복지 담당자가 '우리 마을에서 가장 가까운 경로당은 어디인가', '읍면별로 경로당이 고르게 분포하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 주소·좌표를 기준으로 다른 노인복지시설 목록이나 지역 통계와 위치 기반으로 맞춰 쓰고, 기관 단위 연결은 시설명 매칭에 의존한다.
limits: 표준 시설코드 같은 전역 조인 키가 없어 장기요양기관 등 다른 데이터와는 이름·주소 매칭으로만 연결된다. 무주군 한 곳만 담으므로 다른 시군과 비교하려면 각 시군의 파일을 따로 모아야 하고, 운영 시간·이용자 수 같은 운영 정보는 들어 있지 않다.
