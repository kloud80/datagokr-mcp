summary_user: 사학연금 수급자 수를 급여 종류(급여명)별로 나누고, 연금을 받아온 기간을 3년 미만부터 20년 이상까지 6개 구간으로 집계한 전국 단위 표다(CSV 402바이트의 작은 파일). 연구자나 정책 분석가가 "사학연금 퇴직연금 수급자 가운데 20년 이상 받아온 사람은 얼마나 되나" 같은 질문으로 급여 종류별 수령 기간 분포를 확인하는 데 쓴다. 전역 조인 키가 없으므로 공무원·군인연금 등 다른 직역연금 통계와는 급여명을 이름으로 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 사립학교교직원연금공단 연금수급자 연금수령기간 현황 데이터는 연금 수급자의 급여 종류별 연금 수령 기간을 구간별로 분류하여 제공합니다. 수령 기간은 ‘3년 미만’, ‘5년 미만’, ‘10년 미만’, ‘15년 미만’, ‘20년 미만’, ‘20년 이상’의 6개 구간으로 나뉘며 각 구간별 연금수급자 수가 포함되어 있습니다. 이를 통해 연금 급여 종류별 수급자의 수령 기간 분포를 확인할 수 있습니다.이 데이터를 통해 공단의 연금 지급 현황을 투명하게 공개하고, 연금 제도의 안정성 및 효율성을 이해하는 데 기여합니다. 또한, 연금 제도의 장기적인 운용 계획 수립 및 관련 정책 연구를 위한 기초 자료로 활용될 수 있습니다.
