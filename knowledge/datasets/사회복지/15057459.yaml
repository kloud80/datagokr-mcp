summary_user: "경기도 31개 시군별 장애인연금 수급자 수를 연도(STD_YY)마다 전체와 지체·뇌병변·시각·청각·지적·정신·자폐성 등 16개 장애유형별로 나눠 담은 집계 자료이며, 건별 수급자 정보는 없다. 복지 담당자나 분석가가 '우리 시의 뇌병변장애 연금 수급자가 다른 시군보다 많은가'처럼 시군별 장애유형 분포를 비교하고 복지예산 배분 근거를 찾는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 시군명으로 같은 기관의 다른 경기도 시군 통계(예: 인구·등록장애인 현황)와 이름·코드를 맞춰 이어 쓴다."
description_portal: 이 데이터는 경기도 장애인연금 수급자 현황을 시군별·장애유형별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공합니다.장애인연금은 만 18세 이상 중증장애인을 대상으로 국민연금 가입 여부와 무관하게 지급됩니다. 데이터에서는 경기도 내 31개 시군별 수급자 수를 구분하여 제공하며, 각 시군별로 장애유형별 세부 현황을 확인할 수 있습니다.장애유형에는 지체, 뇌병변, 시각, 청각, 언어, 안면, 신장, 심장, 간, 호흡기, 장루·요루, 뇌전증, 지적, 정신, 자폐성, 기타 등 총 16개 유형이 포함되어 있습니다. 예를 들어, 수원시의 뇌병변장애 연금 수급자 수와 고양시의 청각장애 연금 수급자 수를 비교할 수 있습니다.이 자료는 지역별로 장애인연금 수급 현황을 분석하여, 어떤 장애유형이 특정 시군에서 상대적으로 많거나 적은지 파악하는 데 유용합니다. 이를 통해 경기도 내 지역 특성에 맞는 맞춤형 복지정책을 수립할 수 있으며, 시군별 복지예산 배분 근거 자료로도 활용될 수 있습니다.
