summary_user: 청소년 종합 실태조사 결과를 조사년도·통계항목·대중소 분류·문항별 데이터값으로 담은 전국 단위 집계 통계로, 건별 응답 원자료가 아니다. 연구자나 청소년 기관 기획자가 '특정 조사년도에 청소년의 생활환경·인식 관련 문항 응답 비율이 어떻게 나왔나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 조사명·통계항목명(statsNm) 같은 이름 매핑으로만 잇는다.
