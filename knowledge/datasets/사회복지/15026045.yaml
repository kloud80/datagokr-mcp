summary_user: 부산광역시 북구 관내 지역자활센터를 시설 한 곳당 한 행으로 담은 소규모 목록(csv 약 3.8KB)으로, 시설명·운영주체·대표자·지번/도로명 주소·참여대상·참여방법·전화번호·웹페이지를 담는다. 근로능력이 있는 저소득층이나 상담 실무자가 '북구에서 자활사업에 참여하려면 어느 센터에 어떻게 신청하나'를 확인할 때 쓴다. 전역 조인 키나 시설 코드가 없어 다른 사회복지시설 데이터와는 시설명이나 주소를 맞춰 이어 써야 한다.
description_portal: 이 데이터는 부산광역시 북구 관내에서 자활사업을 운영하는 기관들의 현황 정보를 담고 있습니다. 자활사업은 근로능력이 있는 저소득층이 스스로 경제적 자립을 이룰 수 있도록 돕는 프로그램으로, 이 기관들은 체계적인 자활지원 서비스를 제공합니다. 데이터에는 각 기관의 명칭, 위치, 연락처 등 기본 정보가 포함되어 있어 대상자들이 필요한 도움을 쉽게 받을 수 있도록 지원합니다. 또한, 자활사업 기관들은 맞춤형 상담과 직업훈련, 취업 알선 등 다양한 서비스를 통해 참여자의 자립 역량을 강화하고, 사회 복귀를 촉진하는 데 중요한 역할을 합니다. 이 정보는 저소득층의 경제적 자립과 지역사회 복지 증진에 기여하는 중요한 자원입니다.
