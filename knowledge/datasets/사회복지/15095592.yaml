description_portal: '인천광역시 장애인 직업재활시설 현황 공공데이터는 인천 지역 내 장애인들의 직업 훈련과 일자리 제공을 목적으로 하는 시설들의 정보를 담고 있습니다.  데이터에는 시설명, 소재지(주소), 시설 유형(보호작업장, 근로사업장 등) 그리고 주요 생산품목 등의 핵심 정보가 포함됩니다. 이 자료는 장애인들이 안정적으로 경제 활동을 할 수 있도록 지원하는 직업재활 인프라의 규모와 분포를 보여주는 기초 자료입니다.<활용>정책 수립 및 지원: 지자체는 시설의 지역별 분포 불균형을 분석하여 직업재활 서비스가 부족한 지역에 신규 시설 설립이나 재정 지원을 확대하는 정책을 수립하는 근거로 사용합니다해당 데이터는 인천시 정보공개포털 또는 공공데이터포털에서 확인할 수 있습니다.'
