summary_user: 인천광역시 안의 장애인 직업재활시설을 시설 한 곳당 한 행으로 담은 파일로, 시설 유형(시설별), 시설명, 시설장, 소재지 주소, 주생산품이 들어 있으며 내려받은 CSV는 약 3.4KB 규모입니다. 장애인 당사자나 가족이 '우리 동네 가까운 보호작업장은 어디이고 무엇을 만드는가'를 찾거나, 공공기관 구매 담당자가 장애인 생산품을 납품할 시설을 고를 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 기준으로 맞춰 연결해야 하며, 주소를 지오코딩하면 지역별 분포 분석에 쓸 수 있다.
