summary_user: 부산광역시 아동보호전문기관 6개소(거점기관인 아동보호종합센터 포함)를 기관 한 곳당 한 행으로 담은 소규모 현황 파일로, 시설명·대표자·소재지·위도·경도·전화번호·개소일·관할 구군·홈페이지를 담는다. 아동학대가 의심될 때 시민이나 교사·상담기관이 "우리 구를 맡은 아동보호전문기관은 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 관할지역(구군 이름)으로 행정구역 자료와, 시설명·주소나 좌표로 사회복지시설 목록·지도 자료와 맞춰 잇는다.
