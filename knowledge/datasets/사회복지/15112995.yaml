summary_user: 사립학교교직원연금법을 임의로 적용받는 기관과 연금법이 적용되는 사이버대학의 현황을 기관별로 한 행씩 담은 전국 단위 파일로, 학교급·기관명·적용 근거 조항(상세구분)·법적용일과 법적용 직원수·교원수·합계를 담는다. 연구자나 정책 담당자가 "사립학교가 아닌데 사학연금 특례적용을 받는 기관은 어디이고, 각 기관에서 몇 명의 교직원이 적용받는가"를 확인하는 데 쓴다. 기관번호(tp_inst_no)가 조인 키이므로 같은 기관번호를 쓰는 사학연금 가입·재직 통계 파일과 이어 쓴다.
description_portal: 사립학교교직원 연금법 임의적용 기관 및 연금법 적용 사이버대학 현황과 관련된 자료로 학교급(유치원, 초등학교, 중학교, 고등학교, 전문대학, 대학교, 법인, 특수학교), 기관번호, 학교 기관명, 상세구분(사립학교교직원연금법 제3조3호, 제60조의4제1항, 제60조의4제2항, 제60조의4제3항, 제60조의4제5항, 제60조의4제6항, 제60조의4제7항), 사립학교교직원연금법 적용일, 법적용 직원수, 법적용 교원수 등의 항목으로 세분화하여 제공합니다.사립학교교직원연금법 제60조의4는 사립학교 외에 법률에 의해 지정된 특례적용 기관에 대해 규정하고 있습니다.이 데이터를 통해 공단의 연금 적용 범위와 대상 기관에 대한 이해를 높이고자 합니다. 또한, 연금 제도 관련 연구, 정책 수립 및 잠재적 가입 대상자 정보 제공을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 정보 개방을 확대하고, 연금 제도의 투명성을 제고하는 데 기여합니다.
