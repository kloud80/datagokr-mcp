summary_user: 서귀포시 관내 장애인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명·지번 주소와 위도·경도, 설립개원일, 부지·건물 면적, 이용 정원과 현원, 종사자 정원과 현원, 사무실 연락처, 데이터 기준일을 포함한다. 서귀포시 주민이나 보호자가 집 근처에 어떤 장애인복지시설이 있고 정원 대비 이용 여유가 있는지 확인하거나, 분석가가 읍·면·동별 시설 분포와 수용 능력을 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소를 맞추거나 위도·경도로 공간 결합해서 이어 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘장애인복지시설현황’ 데이터는 장애인 대상 사회복지 시설의 현황을 종합적으로 정리한 공공자료입니다.시설명, 소재지(도로명·지번), 시설 규모, 정원 및 이용인원, 연락처, 데이터 기준일 등으로 구성되어 있어 장애인 서비스 제공망의 지리적 분포와 수용 능력, 복지 인프라 현황 파악에 적합합니다.이 자료는 복지 정책 수립, 시설 배치 및 접근성 평가, 서비스 이용률 분석, 민관 협력 네트워크 구축, 장애인 지원 예산 계획 및 행정 모니터링 등에 활용될 수 있으며, GIS 시스템 연동, 지역사회 복지 사업 설계, 장애인권 향상과 관련된 연구 기반으로서도 유용합니다.
