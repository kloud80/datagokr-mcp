description_portal: '○ 통계개요* 통계명 : 장애인 취업* 통계종류 : 서울시 장애인의 취업현황을 제공하는 일반ㆍ보고통계* 근거법령 :「장애인고용촉진 및 직업재활법」에 의한 장애인 취업현황* 작성목적 : 장애인 노동시장의 수급상황과 장애인 구인ㆍ구직 및 위업의 특성, 동향을파악하여 정책자료 및 기초통계로 활용하는데 기초자료를 제공하는 것을목적으로 함* 조사체계 : 공단지사 및 연계기관→장애인고용업무시스템→한국장애인고용공단본부* 공표주기 : 정기(매분기)* 공표범위 : 지역 - 서울시내용 - 서울시 장애인의 구인, 구직 및 취업자수, 취업률○ 용어설명* 장애인 : 신체 또는 정신상의 장애로 인하여 장기간에 걸쳐 직업 생활에 상당한 제약을받는 자로써「장애인복지법」및「국가유공자 등 예우 및 지원에 관한 법률」에따른 장애인에 해당하는 자* 구직자수 : 해당 분기 내 장애인고용업무시스템에 등록된 구직인원수* 구인수 : 해당 분기 내 장애인고용업무시스템에 등록된 구인인원수* 취업자수 : 해당 분기 내 장애인고용업무시스템에 등록된 취업인원수* 취업률 : 취업자수/구직자수×100'
