description_portal: 자동차사고피해지원사업은 자동차사고로 인해 뜻밖에 일어난 불행한 일로 인해 생명이나 신체, 재산, 명예 따위에 손해를 입은 피해가족을 지지하고 도와주는 사업 을 말한다.등록 정보는 자동차사고 지원가정에 대한 사업 현황을 제공하고 있으며, 세부 데이터로는 재활보조금(인원), 피부양보조금(인원), 생활자금대출(인원), 장학금(인원), 자립지원금(인원), 재활보조금(금액), 피부양보조금(금액), 생활자금대출(금액), 장학금(금액), 자립지원금(금액) 등에 대한 정보가 있습니다.다만, 자동차사고피해가족지원사업은 2025년 1월 1일부터 자동차손해배상보장법에 따라 자동차손해배상진흥원으로 이관되었음을 활용 및 문의에 참고하여 주시기 바랍니다.
