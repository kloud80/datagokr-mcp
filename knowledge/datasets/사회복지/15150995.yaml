summary_user: 사회서비스 전자바우처 교육기관별로 교육년도·차수·교육과정, 지정 기간과 지정취소 여부, 접수·교육 기간, 과정 교육시간과 이수자 수를 담은 기관·과정 단위 현황 파일이며, 범위는 전국이고 소재지는 시군구까지 나온다. 사회서비스 제공인력 교육을 받으려는 사람이나 분석가가 '우리 시군구에서 지정이 유지되는 교육기관은 어디이고, 다음 과정 접수 기간과 이수 인원은 어떤가'를 확인하는 데 쓴다. 사업자등록번호(bizno)로 사회적기업·협동조합·자활기업 등 기업 정보 데이터와 이어 쓰고, 시도·시군구명으로 지역별 통계와 묶는다.
description_portal: '보건복지부에서 2025년 9월 24일 기준 사회서비스 전자바우처 교육기관별 정보현황 데이터를 제공하고 있습니다.데이터 항목은 시도명, 시군구명, 교육기관명, 교육년도, 차수, 교육과정명, 교육과정구분명, 지정년도, 지정취소여부명, 지정시작일자, 지정종료일자, 접수기간시작일자, 접수기간종료일자, 교육기간시작일자, 교육기간종료일자, 과정교육시간, 교육이수수료수로 구성되어 있습니다.<데이터 이용 시 참고사항> - 전자바우처 : 바우처는 이용 가능한 서비스의 금액이나 수량이 기재된 증표(이용권)로 전자바우처는 서비스 신청, 이용, 비용 지불/정산 등의 전 과정을 전산시스템으로 처리하는 전달수단을 말합니다.'
