summary_user: 경기도 시군별로 장애인연금 대상자 수와 수급자 수를 연령대(18~64세, 65세 이상, 기타)로 나눠 연도(STD_YY) 단위로 집계한 자료다. 사회복지 담당자나 분석가가 '우리 시의 65세 이상 중증장애인 중 실제로 연금을 받는 비율은 얼마인가'처럼 시군·연령대별 수급률과 사각지대를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)나 시군명으로 다른 경기도 시군 단위 통계와 이름·코드를 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 장애인연금 대상자 및 수급자 현황을 시군별·연령별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애인연금은 18세 이상 중증장애인에게 지급되며, 국민연금 가입 여부와 관계없이 지원됩니다. 데이터에는 시군별로 전체 대상자 수, 연령별 대상자 수(18~64세, 65세 이상, 기타)와 전체 수급자 수 및 연령별 수급자 수(18~64세, 65세 이상, 기타)가 포함됩니다. 예를 들어, 성남시에서 65세 이상 대상자 수 대비 실제 수급자 수를 확인할 수 있고, 고양시의 18세 이상 64세 이하 중증장애인의 수급률도 파악할 수 있습니다.이 자료는 장애인연금의 연령별 접근성과 지급 실태를 파악하는 데 활용할 수 있습니다. 특히, 65세 이상 고령 장애인의 수급률과 청년·중장년층 수급률 차이를 비교하여, 정책적 사각지대 해소와 맞춤형 복지정책 수립에 기초 자료로 쓰일 수 있습니다.
