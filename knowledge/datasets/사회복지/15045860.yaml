description_portal: 사립학교교직원연금기금의 해외 대체투자 현황(투자분야, 투자자산, 평가액, 투자처)에 관한 정보로 평가액 기준 상위 5개의 해외 대체투자 현황에 관한 자료입니다.공단은 채권, 주식 등의 전통자산 외에도 기금의 수익률 제고, 포트폴리오 다각화, 분산투자를 통한 리스크 저감 등을 위해 부동산, 인프라, 사모주식 등의 대체투자 자산에 일정 비율로 투자하고 있습니다.대체투자의 대분류 중 해외대체 자산군의 연도말 평가액을 기준으로 상위 5개의 국내 대체투자 현황에 관한 정보를 제공하고 있습니다.제공하는 데이터는 국내대체 내에서의 투자분야, 투자자산, 평가액, 투자처 등의 정보를 공개하여 기금 운용의 투명성을 제고하고자 합니다.
