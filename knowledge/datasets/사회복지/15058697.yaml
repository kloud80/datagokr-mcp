summary_user: 경기도 내 장애인에게 교부된 보조기기 인원을 기준년도·시군별로 집계한 자료로, 총계와 지체·뇌병변·시각·청각부터 지적·정신·자폐성·중복장애까지 장애유형별 교부 인원을 담는다. 복지정책 분석가나 시군 담당자가 "우리 시군은 어떤 장애유형의 보조기기 교부가 다른 시군보다 적은가, 연도별로 어떻게 변했나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 시군명, 기준년도를 이름·코드 매핑해 시군별 등록장애인 수 같은 다른 경기도 통계와 붙여 쓴다.
description_portal: 이 데이터는 경기도 내 장애인에게 교부된 보조기기의 현황을 연도별·시군별로 집계한 자료입니다. 주요 항목에는 기준년도, 시군명, 총계(명), 지체·뇌병변·시각·청각장애 등 장애유형별 교부 인원수가 포함되어 있으며, 언어·안면·신장·심장·간·호흡기·장루요루·뇌전증·지적·정신·자폐성·중복장애인에 대한 세부 집계도 제공됩니다. 이를 통해 장애 유형별 보조기기 수혜 규모를 확인할 수 있으며, 지역 간 차이를 비교하여 보조공학 기기의 보급 현황을 파악할 수 있습니다. 해당 데이터는 장애인 생활 편의 증진, 재활 지원 정책 평가, 보조기기 예산 배분 및 수급 계획 수립의 기초 자료로 활용됩니다. 특히 연도별 추이 분석을 통해 특정 장애유형의 보조기기 수요 변화와 지원 사각지대 여부를 확인할 수 있습니다.
