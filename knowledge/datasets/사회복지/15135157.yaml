summary_user: 경기도 워라밸링크 플랫폼의 정책·서비스를 이용자 생애주기별로 나누는 분류 목록으로, 항목마다 고유번호(idntfy_no)와 이름(nm)만 담은 코드표 성격의 데이터이며 공간 정보는 없다. 워라밸링크 정책 정보를 다루는 개발자나 분석가가 연령이나 자녀 성장단계 기준으로 정책을 묶을 때 "이 생애단계에 해당하는 분류 번호와 명칭은 무엇인가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관이 제공하는 워라밸링크 정책 데이터와 고유번호나 이름을 맞춰 연결하는 방식으로만 쓴다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼에서 제공하는 정책 및 서비스를 이용자 생애주기별로 분류한 정보를 담고 있으며, 고유번호와 이름 항목으로 구성되어 있습니다. 이 데이터는 정책 수요자 중심의 콘텐츠 기획, 생애주기별 복지서비스 개발, 워라밸 정책 분류체계 구성 등에 활용할 수 있으며, 대상자의 생애단계에 따라 필요한 지원내용을 체계적으로 안내하는 데 유용한 기초자료입니다. 정책 대상자 그룹을 연령 또는 자녀 성장단계 중심으로 구분함으로써 사용자 맞춤형 콘텐츠 제공 및 행정 효율성 향상에도 기여할 수 있습니다.
