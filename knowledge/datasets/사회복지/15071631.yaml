description_portal: 노후긴급자금대부 신청연령에 따른 분할상환 스케줄 데이터입니다.  데이터는 신청연령, 대부일, 대부용도, 분할회차, 상환시작일자, 상환종료일자로 구성되어 있습니다. 노후긴급자금대부는 만 60세 이상 국민연금수급자로서 노령연금, 분할연금, 유족연금 및 장애연금(1~3급) 수급자 대상으로 하는 대부사업이며,  대부용도는 주택 전월세 보증금, 의료비, 배우자 장제비, 재해 복구비 총 4가지 용도로 신청가능합니다. 대부금 상환기간은 최대 5년 이내, 원금균등분할 방식으로 상환하며, 거치기간(1년 또는 2년)을 선택시 최장 7년까지 상환기간을 정할 수 있습니다.
