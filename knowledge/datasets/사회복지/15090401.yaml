summary_user: 충청북도 내 아동복지시설(아동보호전문기관·아동그룹홈·아동양육시설·지역아동센터 등)을 시설 한 곳당 한 행으로 담은 명단 파일로, 시군·시설 종류(구분)·시설명·대표자명·주소·연락처·담당부서를 담는다. 보호자나 복지 분석가가 '우리 시군에 어떤 아동복지시설이 있고 어디로 연락하나'를 확인하거나, 시군별 시설 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 사회복지시설 데이터와는 시설명·주소·시군명을 맞춰 연결해야 한다.
description_portal: 충청북도 아동복지시설의 시군, 시설명, 시설대표자명, 주소, 연락처, 담당부서의 정보를 제공합니다.(시설장 성명 등은 개인정보 보호를 위해 가운데 글자를 별표처리 하여 제공함)(아동보호전문기관 4개소, 가정위탁지원센터 1개소, 자립지원전담기관 1개소, 아동그룹홈 23개소, 자립지원시설 1개소,  아동전용시설 2개소, 아동양육시설 11개소, 아동보호치료시설 1개소, 지역아동센터 등) * 충주 "라파의집"은 "28. 10월까지 휴지 중 / 충주 "여름"은 "27.6월까지 휴지 중(이외 시설 운영여부 및 아동 입소 가능여부 등은 각 시설별 확인 필요)
