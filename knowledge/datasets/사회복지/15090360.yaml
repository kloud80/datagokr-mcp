description_portal: 이 데이터는 한파 시기 시민의 생명과 건강을 보호하기 위해 주요 교통거점 및 야외 이동 경로에 설치된 ‘온기나눔쉼터’의 위치와 관리 정보를 정리한 자료입니다. 기준연도, 읍면동명, 설치장소명, 도로명 주소, 지번 주소, 위도·경도, 관리기관 등의 항목으로 구성되어 있으며, 단원구와 상록구의 전철역 인근, 정류장 주변, 상업지역을 중심으로 조성된 쉼터들이 포함되어 있습니다. 쉼터는 주로 버스 정류소 주변에 온열기와 바람막이 시설을 갖추어 설치되며, 일부 장소는 명칭에 쉼터 번호 또는 지역 랜드마크와 연계된 식별 정보도 포함되어 있습니다. 본 자료는 동절기 재난안전 대책 수립, 한파 대비 사회적 약자 보호정책 기획 등 다양한 정책 수립에 활용하실 수 있습니다.
