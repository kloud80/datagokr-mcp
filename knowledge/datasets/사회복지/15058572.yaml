summary_user: 경기도 내 장애인 단기거주시설을 시설 한 곳당 한 행으로 담으며, 시군명·기관명·주소·위경도 좌표·전화번호와 입소 정원·현원, 종사자 정원·현원, 설치신고일, 운영 법인명을 포함한다. 보호자나 복지 담당자가 '우리 시군에 단기간 맡길 수 있는 장애인 거주시설이 어디에 있고 빈자리가 얼마나 되나'를 확인하거나, 분석가가 시군별 시설 분포와 정원 대비 현원 비율을 비교하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아 시군 코드(SIGUN_CD)·시군명이나 법인명·주소 같은 이름 매칭으로 다른 시설·인구 자료와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 장애인 단기거주시설 현황을 정리한 자료로, 단기간 생활 지원이 필요한 장애인을 대상으로 하는 복지시설 정보를 포함합니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소·도로명주소, 소재지 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL, 입소정원수 및 입소현원수, 종사자 정원수 및 현원수, 설치신고일, 법인명이 포함되어 있습니다. 이를 통해 각 시설의 위치와 운영 현황, 수용 규모, 종사자 배치 현황을 확인할 수 있습니다. 해당 데이터는 단기보호시설의 지역별 분포와 운영 특성을 분석하는 데 활용되며, 정원 대비 현원 분석을 통해 시설의 수용률 및 인력 배치의 적정성을 평가할 수 있습니다. 또한 복지재단·법인 등의 운영 주체 정보를 통해 각 시설의 법적·행정적 기반을 파악할 수 있어 복지정책 수립 및 행정 관리에 중요한 기초자료로 활용됩니다.
