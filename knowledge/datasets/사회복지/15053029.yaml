description_portal: 공무원연금공단에서 관리하는 연금가입자 현황을 연령별 및 직종별로 구분하여 제공하는 통계로, 공무원 조직의 연령 구조와 직종 간 분포 특성을 파악할 수 있도록 구성되어 있습니다.연령은 ‘18세 이상’부터 시작하여 65세 이상까지 1세 단위로 세분화되어 있으며, 각 연령대별로 전체 가입자 수(계)와 함께 16개 직종에 대한 가입자 수가 병기되어 있습니다.직종 구분에는 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(우정직, 외무직, 전문경력관, 청원경찰 등)가 포함됩니다.본 데이터는 각 연령대별로 특정 직종에 공무원 분포를 파악 할 수 있습니다.
