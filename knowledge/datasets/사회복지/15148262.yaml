summary_user: 부산광역시 강서구 어린이집을 시설 한 곳씩 담은 건별 데이터로, 유형·운영 여부·주소·연락처·위경도와 보육실 수·면적, 놀이터·CCTV 수, 보육교직원 수, 정원·현원, 통학차량 운영 여부, 인가일자를 담는다. 학부모가 집 근처에서 통학차량을 운영하고 정원 대비 현원에 여유가 있는 어린이집을 고르거나, 분석가가 강서구 안의 보육 수급을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 어린이집명·주소 매핑이나 위경도(fcltLat·fcltLot) 기반 지도 결합으로 이어 쓴다.
limits: 실측 컬럼에 어린이집코드 같은 전역 조인 키가 없어 평가·보육료 공시·유치원 데이터와 바로 붙일 수 없고, 이름·주소로 매핑해야 한다. 포털 설명상 구군별로만 조회되므로 부산시 전체를 보려면 구군별 데이터를 따로 모아야 한다.
