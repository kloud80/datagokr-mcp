summary_user: 국민연금에 가입한 사업장 수를 기준년월별로 사업장 규모(5인 미만, 5-9인, 10-49인, 50-99인, 100-999인, 1000인 이상) 구간에 나눠 담은 전국 단위 집계 파일로, 크기는 814바이트 정도로 작다. 분석가가 "국민연금 가입 사업장 가운데 5인 미만 영세 사업장 비중이 연도별로 어떻게 변했나" 같은 기업 규모 분포 추이를 볼 때 쓴다. 전역 조인 키가 없고 지역 구분도 없는 전국 집계라서 다른 데이터와는 기준년월을 맞춰 나란히 비교하는 식으로만 이어 쓴다.
description_portal: 해당 데이터는 국민연금공단에 가입된 사업장 데이터를 기반으로 만들어졌습니다. 연도별 국민연금에 가입된 사업장의 데이터를 나타냅니다.해당 데이터는 사업장의 규모에 따라 분류되어있고 분류기준은 아래와 같습니다.-5인미만, 10인 미만, 50인 미만, 100인 미만, 1,000인 미만, 1,000인 이상으로 세분화되어있습니다. 사업장규모별 사업장 수 데이터를 통해 분류된 규모에 따라 가입된 국민연금 사업장 수를 확인할 수 있습니다.(데이터 건수가 많은 경우 모든 데이터가 표출되지 않을 수 있습니다.)
