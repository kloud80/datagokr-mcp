summary_user: 성남시에 지정된 어린이·노인·장애인 보호구역을 한 곳씩 담은 위치 자료로, 시설명·도로명/지번 주소·위경도·관할 경찰서·CCTV 설치 여부와 대수·이미지명 등을 구역 단위로 제공한다. 보호자나 교통안전 담당자가 '우리 동네 노인시설이나 학교 앞 보호구역이 어디이고 CCTV가 설치돼 있는가'를 확인하거나, 분석가가 보호구역 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군구 코드(signgucd)·시설명·주소 문자열 매칭이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 경기도 성남시 교통약자 어린이/장애인/노인 보호구역 위치데이터를 제공합니다.본 데이터는 횡단보도 관리번호, 도로명, 세부위치,위경도, 이미지명 등으로 구성되어있습니다. ‘경기도 성남시_교통약자 보호구역’ 데이터는 어린이, 노인, 장애인 등 교통약자의 안전한 보행 환경을 조성하기 위해 지정된 보호구역의 현황을 정리한 자료입니다. 이를 통해 교통약자의 이동권 보장과 교통사고 예방을 위한 시설 설치 및 관리 현황을 파악하실 수 있습니다. 또한 이 자료는 교통사고 다발지역 개선, 생활도로 안전정비, 스쿨존 및 노인시설 주변의 교통안전 대책 수립에 중요한 근거 자료로 활용됩니다. 성남시는 본 데이터를 기반으로 교통약자가 안심하고 이동할 수 있는 보행자 중심의 안전도시를 구현하기 위해 지속적으로 정책을 추진하고 있습니다.
