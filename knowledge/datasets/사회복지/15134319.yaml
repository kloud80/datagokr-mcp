description_portal: '(기초연금 수급 확인조사 유형 및 처리실적 현황) 지역별 기초연금 수급자 확인조사 현황○ 데이터 기준 일자 : 2024.1.1.~2024.12.31.○ 조사 유형(8종) 및 형태 : 사실혼, 사실이혼, 타인계좌입금수급자, 외국국적배우자, 거주불명등록자, 부재배우자, 기타지자체요청, 고령수급자  * 사실혼 : 법률혼 관계는 아니나 사실상 혼인 상태로 부부가구 적용  * 사실이혼 : 법률혼 관계이나 사실상 이혼 상태로 단독가구 적용  * 타인계좌입금수급자 : 타인명의계좌로 급여 수급  * 외국국적배우자 : 외국 국적 수급자로 대한민국 국민과 혼인신고 후 국내체류기간 2년 경과  * 부재배우자 : 가출·실종·행방불명의 사유로 배우자의 금융재산을  조사 대상에서 제외함  * 거주불명등록자 : 거주불명등록상태이나 실제 거주지 확인됨  * 고령수급자 : 만85세 이상  * 기타지자체요청 : 그 밖에 지자체 판단으로 조사 의뢰'
