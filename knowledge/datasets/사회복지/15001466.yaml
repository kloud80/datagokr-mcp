summary_user: 설립유형(국공립·사회복지법인·법인단체·민간·가정·협동·직장 등)별로 전체 어린이집 수와 평가인증을 완료해 유지 중인 어린이집 수를 담은 전국 단위 집계표로, 175바이트 분량의 작은 CSV 파일이다. 보육 정책 분석가나 부모가 '국공립과 민간·가정 어린이집 가운데 평가인증을 유지하는 비율은 각각 얼마인가'처럼 유형별 인증 유지율을 비교할 때 쓴다. 어린이집코드 같은 전역 조인 키가 없어 개별 어린이집 기본정보·평가 데이터와는 직접 연결되지 않고, 설립유형 이름을 기준으로 다른 유형별 집계와 맞대어 쓴다.
description_portal: 해당 데이터는 한국영유아보육·교육진흥원이 제공하는 어린이집 평가인증 유지 현황입니다. 설립유형별 평가인증 유지 여부를 수치로 확인할 수 있는 공공데이터입니다. 어린이집은 국공립, 사회복지법인, 법인·단체 등, 민간, 가정, 협동, 직장 등으로 분류되며, 각 유형별 전체 어린이집 수와 평가인증을 완료하고 유지 중인 어린이집 수가 함께 제공됩니다. 데이터는 유형별 어린이집의 구성과 인증 여부를 비교할 수 있는 구조로 구성되어 있으며, 표 형식의 집계형 데이터로 되어 있어 정량적인 비교 및 분포 분석이 가능합니다. 주요 컬럼은 설립유형, 전체 어린이집 수, 평가완료 어린이집 수로 구성되어 있습니다.
