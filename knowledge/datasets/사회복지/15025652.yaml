description_portal: 부산광역시 사상구 관내 의료급여 대상자 관련 2025년 11월 기준 현황 데이터입니다.의료급여 대상자 현황 공공데이터는 지역 내 저소득층 주민들의 건강권 보장을 위한 핵심 자료로, 사상구 동별 의료급여 수급자의 급여 유형별 세대 수 및 인원 수 등을 포함하고 있습니다.급여 유형은 국민기초(1, 2종), 군입대자(1, 2종), 차상위 의료급여특례(18세 미만), 국내입양 아동, 국가 유공자, 광주 민주화운동 관련자, 중요 무형문화재 보유자, 북한이탈주민, 이재민, 의상자 및 의사자의 유족, 행려 환자, 보장시설 수급자로 분류되어 있습니다.이 데이터는 정책 수립, 복지 예산 배분, 의료 서비스 개선 등 다양한 행정 목적에 활용될 수 있습니다.
