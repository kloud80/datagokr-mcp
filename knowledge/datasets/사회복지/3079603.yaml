summary_user: 광양시 경로당을 한 곳당 한 행으로 담은 건별 원천 파일로, 시도·시군구·행정동과 경로당명, 주소, 데이터기준일을 담는다. 광양시 주민이나 복지 담당자가 '우리 동네(행정동)에 경로당이 어디에 몇 곳 있는가'를 확인하거나 동별 분포 편차를 볼 때 쓴다. 전역 조인 키나 시설코드가 없어 다른 데이터와는 시군구명·행정동 이름 매칭이나 주소 기반 위치 매칭으로만 잇고, 이 방식으로 지역 고령인구 통계나 다른 노인복지시설 목록과 함께 본다.
