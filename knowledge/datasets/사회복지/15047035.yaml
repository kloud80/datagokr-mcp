description_portal: '○ 통계개요* 통계명 : 청소년 수련시설* 통계종류 : 서울시 청소년 수련시설을 시설목적별로 제공하는 일반ㆍ보고통계* 근거법령 :「청소년기본법」「청소년활동진흥법」에 의거 관리하는 청소년 수련시설* 작성목적 : 서울시 문화시설현황 파악을 통해 국민의 문화향유 확대 정책 수립을위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 자치구 및 해당시설 → 서울특별시 아동청소년담당관* 공표주기 : 정기(매년)* 공표범위 : 지역 - 자치구 및 해당시설내용 - 서울시 청소년 수련시설의 시설목적별(수련관, 수련원,문화의집 등) 개소 및 면적, 이용인원 현황○ 용어설명* 청소년수련관 : 다양한 수련거리를 실시할 수 있는 각종 시설 및 설비를 갖춘종합수련시설* 청소년수련원 : 숙박기능을 갖춘 생활관과 다양한 수련거리를 실시할 수 있는각종 시설과 설비를 갖춘 종합수련시설* 청소년문화의집 : 간단한 수련활동을 실시할 수 있는 시설 및 설비를 갖춘 정보ㆍ문화ㆍ예술중심의 수련시설* 청소년특화시설 : 청소년의 직업체험ㆍ문화예술ㆍ과학정보ㆍ환경 등 특정 목적의청소년활동을 전문적으로 실시할 수 있는 시설과 설비를 갖춘 수련시설* 유스호스텔 : 청소년의 숙박 및 체재에 적합한 시설ㆍ설비와 부대ㆍ편익시설을갖추고 숙식편의제공, 여행청소년의 활동지원 등을 주된 기능으로 하는 시설○ 기 타* 면적은 건물연면적 기준○ 출 처 : 서울특별시 청소년담당관'
