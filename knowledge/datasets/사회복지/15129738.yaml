description_portal: 전라남도 해남군 마을기업에 대한 데이터입니다.이 데이터에는  마을기업명, 소재지, 마을기업 설립연월, 마을기업 인정연월, 마을기업대표, 마을기업주요상품 등의 항목을 제공합니다.마을기업은 지역 주민이 주도적으로 설립하고 운영하는 기업으로 지역의 다양한 자원을 활용해 수익을 투자하고 그 수익을 지역 사회에 재투자하여 주민의 삶의 질을 높이는 것을 목표로 합니다. 사업의 내용에 따라 지역농산물을 활용한 가공, 체험, 판매 사업, 지역의 문화유산이나 자연경관을 활용한 관광 체험 사업, 지역의 환경 문제를 해결하고자원을 재활용하는 사업, 지역주민들에게 돌봄, 교육, 보건 등 사회서비스를 제공하는 사업 등으로 다양한 형태로 나타납니다.
