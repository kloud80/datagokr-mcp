description_portal: 한국노인인력개발원에서 운영하는 노인일자리 인력파견형 사업의 실적현황을 제공하며 주로 월마감 일자 정보를 제공하는 데이터입니다. 마감일을 기준으로 월별 노인일자리정보시스템 내 사업 현황이 마감됩니다. 노인공익활동사업은 노인이 자기만족과 성취감 향상, 지역사회 공익증진을 위해 참여하는 봉사활동입니다. 노인역량활용사업은 노인의 경력과 활동역량을 활용하여 사회적 도움이 필요한 영역(지역사회 돌봄, 안전 관련 등)에 서비스를 제공하는 일자리입니다. 전체 사업의 월별 마감 정보를 제공하고 이를 참고하여 데이터 활용을 해주시기 바랍니다.
