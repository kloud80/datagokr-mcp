summary_user: 인천광역시에서 시간제보육 제공기관으로 지정된 어린이집을 기관 한 곳당 한 행으로 담은 현황 파일로, 시군구·기관명·기관유형·소재지·시간제보육유형·반수·대상 연령·관리기관을 담는다(CSV 약 11KB). 어린이집을 다니지 않는 6~36개월 영아를 둔 인천 부모가 '우리 구에서 시간 단위로 아이를 맡길 수 있는 어린이집이 어디인가'를 찾을 때 쓴다. 어린이집코드 같은 전역 조인 키가 없어서 어린이집 기본정보 등 다른 데이터와는 기관명·소재지(주소)를 맞춰 이어 쓴다.
description_portal: '1. 목록명 : 인천광역시 시간제 보육 지정 어린이집2. 키워드 : 시간제보육, 어린이집, 보육, 시간보육, 시간단위보육, 긴급돌봄, 6개월부터 36개월3. 데이터 설명 : 교육부 시간제보육 사업 운영에 따른, 인천광역시 시간제 어린이집 지정 현황에 대한 데이터를 제공하고있습니다.    시간제보육 사업은 6개월에서 36개월 영아를 대상으로 하여 어린이집을 이용하지 않는 아동에게 시간단위 보육 서비스를 제공합니다.    이 데이터에서는 시간제보육 사업의 정보를 제공하고 있으며, 시군구, 제공기관명, 기관유형, 소재지, 시간제보육유형, 반수, 연령, 관리기관 등을 확인할 수 있습니다.   해당 데이터는 공공데이터포털에서 무료료 다운로드할 수 있으며, CSV 형식으로 제공됩니다.'
