summary_user: 전국 청소년지원시설의 시설명·시설 분류와 종류·시도와 시군구·상세주소·우편번호·위도와 경도·대표전화·시설설명을 시설 한 곳당 한 건씩 담는 위치(POI) 데이터이며, 검증 호출에서는 0행이 수신되어 규모는 확인되지 않았다. 청소년이나 보호자, 상담·복지 담당자가 '우리 시군구에 어떤 청소년 지원시설이 있고 어디에 있나'를 찾거나, 분석가가 지역별 시설 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 시도명·시군구명(ctpvNm, sggNm)을 이름으로 맞춰 지역 통계와 잇거나, 좌표로 다른 시설·인구 데이터와 공간 결합해 쓴다.
limits: 검증 호출에서 0행이 수신되어 실제 제공 건수와 내용이 확인되지 않았으며, 행정구역 코드 같은 공통 키가 없어 다른 데이터와는 이름 매칭으로만 연결된다. 데이터는 이벤트 주기로 생성된 뒤 바뀌지 않는 것으로 분류되어 있어 시설 신설·폐쇄 반영 여부를 따로 확인해야 한다.
