description_portal: 1. 성별영향평가는 법령이나 주요 정책 등을 수립·시행할 때 성별 특성에 따른 수요, 성별 균형 참여, 성별 고정관념 해소 등 성별에 미치는 영향을 점검하여 해당 정책이 성평등의 실현에 기여할 수 있도록 개선하는 제도입니다.  * 2023년 총 27,843건의 성별영향평가 추진2. 해당 개방 데이터는 2023년도 기관별 성별영향평가 추진결과 정보 데이터를 제공하는 파일형 개방 데이터 입니다. 2023년 기관별 성별영향평가 추진 결과로 기관별 추진과제수, 개선계획과제수 개선과제수가 각각 법령, 계획, 사업으로 분류된 데이터입니다. - 51개의 중앙행정기관, 260개의 지방자치단체(교육청 포함)의 성별영향평가 추진 결과3. 각 기관이 수행한 성별영향평가의 추진 현황과 구체적인 과제 개선 실적을 확인할 수 있어 성인지 관점의 정책 개선 현황을 진단하는 데 유용합니다. 법령, 계획, 사업별 추진 수준과 개선 계획 수립 여부 등 세부 항목별 공공데이터는 기관 간 성별평가 추진 격차를 확인하거나, 향후 정책 개선 방향 수립의 참고 자료로 다양하게 활용될 수 있습니다.
