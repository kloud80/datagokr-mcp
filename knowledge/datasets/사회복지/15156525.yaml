description_portal: 한국노인인력개발원 인천지역본부에서는 지역사회 다양한 주체(노인, 수행기관, 시민)의 참여를 통해 현장 중심의 창의적 신규 노인일자리 아이템을 발굴하고자 하였습니다. 노인일자리 참여자, 수행기관 관계자, 시민을 대상으로 2026년 신규 노인일자리 개발을 위한 아이디어를 발굴하고 28개의 아이템을 선정하였습니다. 해당 데이터를 통해 노인일자리(노인역량활용) 신규 직무 또는 노인사회활동(노인공익활동) 신규 활동 아이템 발굴 결과를 공개합니다. 차별성, 실현 가능성, 직무활동 적합성, 지속 가능성을 고려하여 노인 일자리 사업에 적용가능한 일자리 내용을 공개합니다. 아이디어 발굴 결과를 공개하고 이를 참고하여 신규 아이디어 발굴에 활용하실 수 있습니다.
