summary_user: 시도별·연도별 등록장애인 수를 15개 장애유형(지체·시각·청각·지적·뇌병변·자폐성·정신·신장 등)마다 남·여·계로 나눠 담은 집계 통계이며, 포털 설명상 2015~2024년 매년 말 기준이고 검증 호출에서는 전국 범위 시도 단위로 1건이 확인됐다. 복지 분석가나 지자체 담당자가 '우리 시도의 발달장애(지적·자폐성) 등록인구가 남녀별로 얼마나 되는가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 시도 단위 통계와는 시도 이름(시도구분, dvsd)과 연도(year)를 맞춰 붙여 쓴다.
limits: API 전체 건수가 1건, 검증 수신도 1행으로 확인돼 여러 연도·시도 자료가 모두 내려오는지 직접 호출해 확인해야 한다. 표준 행정코드 같은 조인 키가 없어 다른 데이터와 연결할 때는 시도명 문자열을 맞춰야 한다. 시군구 단위나 장애정도 구분은 이 필드 목록에 없다.
