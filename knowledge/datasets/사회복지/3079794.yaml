summary_user: 여수시 안의 청소년수련관·문화의집·상담복지센터·쉼터·유스호스텔 등 13개 청소년 시설과 YMCA·YWCA·걸스카우트 등 6개 단체를 한 행씩 담은 목록 파일로, 시설명·주소·종사자 수·연락처를 적는다. 여수에 사는 청소년이나 보호자가 가까운 청소년 상담·쉼터·방과후 시설을 찾아 연락처를 확인하거나, 분석가가 시 단위 청소년 시설 인력 규모를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 주소를 기준으로 맞춰 붙여야 하며, 지역 통계와는 시군구(여수시) 단위로만 잇는다.
