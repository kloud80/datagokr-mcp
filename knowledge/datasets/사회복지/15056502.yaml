summary_user: 경기도 기초생활수급자 중 장애아동수당을 받는 사람 수를 기준년도(매년 12월 말)와 장애정도별로 나누고, 지체·뇌병변·시각·청각·언어·신장·지적·자폐성 등 장애유형별 수급자 수와 합계를 담은 시도 단위 집계 자료다. 복지 분석가나 담당 공무원이 '경기도에서 중증 장애아동수당 수급자가 가장 많은 장애유형은 무엇이고 해마다 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준년도(STD_YY)와 장애정도 명칭을 맞춰 연결해야 하며, 다른 시도나 전국의 장애수당 통계와 연도별로 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 본 데이터는 보건복지부 사회보장정보시스템을 통해 제공되는 경기도 내 장애아동수당 수급자 현황으로, 기초생활수급자 중 장애등급 및 장애유형에 따라 집계된 정보를 포함합니다. 기준년도는 매년 12월 말이며, 항목에는 ‘장애정도’, ‘합계(명)’, ‘지체수급자수(명)’, ‘뇌병변수급자수(명)’, ‘시각수급자수(명)’, ‘청각수급자수(명)’ 외에도 ‘언어수급자수(명)’, ‘신장수급자수(명)’, ‘지적수급자수(명)’, ‘자폐성수급자수(명)’ 등 다양한 장애유형별 수급자 수가 포함됩니다. 이 데이터를 통해 특정 장애유형의 수급 분포 및 중증도에 따른 수급 현황을 파악할 수 있어, 장애아동을 위한 복지 정책 수립, 지원금 배정, 맞춤형 복지서비스 설계에 활용될 수 있습니다. 또한 복지 사각지대 해소 및 지역별 복지 수준 분석에도 중요한 기초자료로 쓰일 수 있습니다.
