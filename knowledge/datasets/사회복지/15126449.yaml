summary_user: 대구 달서구에서 운영하는 노인일자리 사업을 사업 단위로 정리한 파일로, 수행기관·사업명·사업유형·참여 인원·주요 활동 내용·사업 기간·연락처를 담는다. 달서구에 사는 어르신이나 가족이 어느 기관에서 어떤 일자리 사업을 언제까지 모집·운영하는지 찾거나, 분석가가 수행기관별 참여 인원 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설 목록이나 지역 통계와는 수행기관 이름이나 구군명(시군구)을 맞춰 이어 써야 한다.
description_portal: 대구광역시 달서구 내 노인 일자리 사업에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.수행기관, 사업명, 사업유형, 전화번호, 인원(명), 사업주요활동 내용, 사업시작일, 사업종료일, 구군명, 데이터기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.자세한 사항은 달서구청 홈페이지(www.dalseo.daegu.kr)를 통해  분야별정보> 일자리/경제/신기술지향도시> 공공일자리> 노인일자리 및 사회활동 지원으로 이용하시길 바랍니다.
