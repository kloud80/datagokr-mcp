summary_user: 한국노인인력개발원 노인일자리 취업연계 시스템에서 쓰는 행정구역 코드표로, 행정구역코드와 시도·시군구·읍면동 이름, 시도관리여부·사용여부, 등록·수정일을 행 단위로 담는 전국 범위 CSV 파일(약 53만 바이트)이다. 노인일자리 취업연계 자료를 지역별로 정리하는 분석가가 '이 기관 데이터의 행정구역코드는 어느 시군구·읍면동을 가리키는가'를 확인할 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아 같은 기관의 다른 공공데이터와는 기관 내부 행정구역코드로, 다른 지역 통계와는 시도·시군구명 매핑으로 잇는다.
description_portal: 한국노인인력개발원에서 운영하는 노인일자리 취업연계에서 제공하는 시스템 관리 정보로 행정구역명, 시도명, 시군구명, 읍면동명 등의 항목을 제공합니다.한국노인인력개발원은 노인 일자리 취업 연계 사업을 운영하고 있으며, 관련 정보를 확인할 수 있습니다. 취업 지원(취업알선형) 사업이란, 일정 교육을 수료하거나 관련된 업무능력이 있는 60세 이상 고령자를 민간기업 등의 수요처로 취업을 알선해주는 사업입니다. 해당 파일 내에는 행정구역 코드 및 행정구역이 함께 제공되며 한국노인인력개발원의 다른 공공데이터와 함께 사용하실 수 있습니다. 파일데이터는 로그인 없이 다운로드를 통해 이용하실 수 있습니다
