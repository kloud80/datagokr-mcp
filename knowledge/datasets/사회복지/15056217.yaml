summary_user: 제주특별자치도 안에 있는 여성폭력피해자 이용시설(상담소)을 시설 한 곳당 한 행으로 담은 작은 목록 파일(약 1.3KB CSV)로, 시설유형·시설명·소재지·연락처·데이터기준일자를 담는다. 제주에서 가정폭력·성폭력·성매매 피해 상담을 받을 수 있는 곳과 연락처를 찾는 도민이나, 도내 상담시설 분포를 파악하려는 복지 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지 주소 문자열을 맞추거나 사회복지시설 공통 목록과 이름으로 대조해 이어 쓴다.
