summary_user: 부산광역시 수어통역센터의 센터명·시설장·소재지·전화번호·설치일자·운영주체와 위경도를 센터 단위로 담은 소규모 현황 파일(약 1.2KB CSV)이다. 청각·언어장애인이나 가족, 복지 담당자가 '우리 동네 가까운 수어통역센터는 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 센터명·주소로 다른 장애인 시설 목록과 맞추거나, 위도·경도로 지도·행정구역 자료와 공간 결합해 쓴다.
description_portal: 부산시수어통역센터는 청각장애인 및 언어장애인의 원활한 소통과 사회 참여를 지원하기 위하여 다양한 수어통역 서비스를 제공하고 있습니다. 센터에서는 일상생활, 병원, 공공기관, 법원, 학교 등 다양한 분야에서 수어통역을 지원하며, 개인상담과 사회적응 교육, 권익옹호 활동도 함께 진행하고 있습니다. 또한 청각장애인의 복지 향상을 위해 지역사회와 연계하여 수어교육 및 소통지원 프로그램을 운영하고 있습니다. 통역요청 업무는 연중무휴로 이루어지며, 부산시 전역을 대상으로 효율적인 지원 시스템을 구축하고 있습니다. 센터 현황 파일에는 기관 주소, 연락처, 통역 인력 구성, 서비스 신청 방법, 연간 통역 건수, 협력 기관, 운영 프로그램 정보 등이 포함됩니다. 앞으로도 이용자 중심 서비스를 강화하여 장애인의 사회적 참여와 권익 증진을 위한 센터입니다.
