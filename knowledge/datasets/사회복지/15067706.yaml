description_portal: '부산광역시 동래구에 소재한 「결혼중개업의 관리에 관한 법률」에 따라 등록, 신고된 결혼중개업체의 현황 자료입니다.업체명, 소재지, 대표자명, 등록일 등 기본 정보를 포함하고 있으며 정기적으로 변경사항을 반영하여 최신 정보를 제공합니다.정보제공의 목적1. 건전한 결혼중개업 이용환경 조성을 위한 정보 제공2. 결혼중개업체의 투명한 운영과 시민 편의를 위한 정보제공3. 관내 등록, 신고된 결혼중개업체 현황을 공개하여 이용자 선택권 강화3. 안전하고 신뢰할 수 있는 결혼중개업체를 이용할 수 있도록 정보 제공업데이트 주기: 연 1회(또는 관내 업체 변동 있을 시 수시 갱신)'
