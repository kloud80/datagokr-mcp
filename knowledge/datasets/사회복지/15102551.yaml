description_portal: 사립학교교직원연금공단의 가입자 및 연금수급자 수 예측치와 관련된 데이터로 연도별 가입자수, 퇴직연금 수급자, 유족연금 수급자, 연계연금 수급자 등의 항목을 제공합니다. 사립학교교직원연금공단의 가입자는 교원과 사무직원 그리고 병원직원 가입자 수의 합으로 산출됩니다. 해당 데이터는 2020년에 시행된 제5차 재정재계산 결과로, 2025년부터 2095년까지의 예측치를 제공합니다.이 자료는 미래 가입자 규모에 대한 핵심 정보를 포함하고 있습니다. 이 데이터를 통해 공단의 장기적인 재정 안정성 및 기금 운용 계획 수립에 대한 투명성을 제고하고, 연금 제도 운영의 건전성을 공개적으로 보여주고자 합니다. 또한, 인구 구조 변화 및 사회 정책 연구를 위한 기초 자료로 활용될 수 있습니다. 제6차 재정재계산 결과가 나오면 데이터를 업데이트 할 예정입니다.
