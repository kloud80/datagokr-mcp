description_portal: 공무원연금공단에서 활용하는 2017년부터 기준년도까지 월별로 채권, 국내채권, 해외채권, 대체투자, 단기자금에 대한 신용위험지표입니다.VaR 기법을 통해 측정한 총 신용위험 지표로, 측정 대상은 국내외채권, 대체투자, 단기자금 입니다. 최대예상손실금액은 거래 상대방의 부도, 채무불이행, 신용등급 하락 등 신용위험 요인에 의해 발생할 수 있는 최대손실 금액(Total Loss)을 특정 신뢰수준(99.5%) 하에 추정한 값이며, 최대예상손실(%)는 해당 손실금액을 총 손실 노출금(Exposure) 대비 비율로 환산한 값으로 상대적 위험수준을 판단하는데 사용합니다.
