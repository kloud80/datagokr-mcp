summary_user: 아이돌보미 채용 면접에서 쓰는 표준 평가 항목을 기준연도별로 담은 전국 단위 비공간 데이터로, 평가요소와 배점, 평가내용, 평가등급, 평가점수, 데이터 기준일자를 항목 단위로 제공한다. 아이돌봄 서비스 운영기관이나 정책 분석가가 "면접에서 어떤 요소를 어떤 등급·점수로 평가하며, 연도별로 기준이 어떻게 바뀌었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도(crtrYr)나 평가요소 이름 매핑, 같은 기관(한국건강가정진흥원) 데이터 단위로만 이어 쓴다.
limits: 지역·기관·개인 식별 컬럼이 없어 시설이나 지역별 면접 결과는 비교할 수 없고, 다른 사회복지시설 데이터와 코드로 직접 결합되지 않는다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하며, 개발계정은 하루 3,000회로 제한된다.
