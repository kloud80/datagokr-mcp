description_portal: 대전광역시 여성단체 법인 현황 자료는 대전광역시 내에서 활동 중인 여성단체 비영리법인 3곳의 주요 정보를 체계적으로 정리한 자료입니다. 해당 자료에는 사단법인 여성인권티움(성매매 피해여성 인권보호 및 인권향상), 사단법인 대전여민회(여성 권익신장, 양성평등, 사회민주화, 평화통일 실현), 사단법인 대전YWCA(정의와 평화, 창조적 질서 보전을 통한 사회 건설) 등 각 단체의 명칭, 대표자, 주소 등 주요 항목이 포함되어 있습니다. 이 자료는 여성 인권과 권익 향상, 양성평등 실현, 시민사회 참여 확대 등 다양한 목적을 가진 단체들의 현황을 한눈에 파악할 수 있도록 구성되어 있습니다.
