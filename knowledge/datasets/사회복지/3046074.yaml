summary_user: 국민연금에 가입한 외국인 가입자 수를 체류자격별로 나누고, 가입 종별(사업장·지역)로 구분해 명 단위로 집계한 전국 단위 통계 파일로, 포털 설명상 2020년 5월 한 달분을 담는다. 외국인 고용·체류 정책을 보는 분석가나 연구자가 "어떤 체류자격의 외국인이 국민연금에 사업장가입자 또는 지역가입자로 얼마나 가입해 있나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 체류자격 이름을 맞춰 연결하거나 같은 공단의 가입현황 통계와 나란히 놓고 비교하는 방식으로 이어 쓴다.
limits: 전국 단위 비공간 집계라 시군구 등 지역별 분포는 볼 수 없고, 파일 크기가 335바이트로 작아 체류자격별 소수 행만 담긴다. 조인 키가 없어 다른 데이터와 자동으로 결합되지 않으며, 체류자격 이름을 직접 맞춰야 한다.
