description_portal: 공무원연금 퇴직연금공제일시금 현황을 재직년수별 성별 공제일시금년수별로 구분하여 제공하는 데이터입니다. 공무원 재직기간에 따라 퇴직시 지급되는 공제일시금의 현황을 나타냅니다.이 데이터를 활용해 개인의 경우 퇴직시 수령하게 되는 퇴직연금공제일시금 규모를 미리 예상해볼 수 있으며 노후 설계를 준비하는데 참고자료로 활용할 수 있습니다.또한 공무원연금제도에 대해 관련 정책 수립 및 연구 분석 등에 활용할 수 있습니다.첫 행이 공제일시금년수, 구분이 재직년수 입니다.* 2016년 공무원연금법 개정시행에 따라 퇴직연금공제일시금 선택요건이 재직기간 10년 이상자로 조정됨
