summary_user: 공무원연금 퇴직연금공제일시금 수급 현황을 재직년수(행)와 공제일시금년수(열, 1년미만~23년)로 교차 집계한 전국 단위 표로, 건별 원천이 아닌 집계 파일(csv 약 2.7KB)이다. 공무원이나 연구자가 '재직기간별로 퇴직연금공제일시금을 택한 사람이 얼마나 되나', '일시금 대상 기간은 보통 몇 년인가'를 확인하거나 연금제도 정책 분석의 참고자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 직역연금 통계와는 재직년수 구간 같은 항목 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 합계만 담아 지역·기관별 분석은 할 수 없고, 공통 조인 키가 없어 다른 데이터와 자동 결합이 어렵다. 2016년 법 개정으로 공제일시금 선택요건이 재직 10년 이상으로 바뀌었으므로 시점 간 비교 시 해석에 주의한다.
