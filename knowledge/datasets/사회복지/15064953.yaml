summary_user: 사립학교교직원연금공단이 사업실명제 대상으로 선정한 사업을 사업 한 건당 한 행으로 담은 파일로, 사업제목·담당부서·사업내용·연결주소·등록일시·기준연도를 제공한다. 공단 사업의 책임 부서와 추진 내용을 확인하려는 국민·감시단체·분석가가 "이 사업은 어느 부서가 맡아 어떤 내용으로 추진했나"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업제목·담당부서 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 사립학교교직원연금공단의 사업실명제 선정대상과 관련된 주요 정보를 한눈에 파악할 수 있도록 정리한 데이터로 순번, 사업제목, 담당부서, 사업내용, 연결주소, 등록일시, 기준연도 등의 항목을 제공합니다. 공단에서 추진하는 각 사업의 추진현황을 체계적으로 관리하고 있으며, 사업내용 및 담당부서 등을 명확히 하여 업무의 투명성과 효율성을 제고하고 책임 있는 사업 추진을 대내외에 공개하기 위해 노력하고 있습니다.본데이터는 공공기관의 효율적이고 투명한 사업관리를 입증하고 대국민 신뢰를 구축하는 데 기여합니다.
