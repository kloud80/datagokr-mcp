summary_user: 서귀포시가 시행하는 저소득 한부모가족 지원사업을 사업 단위로 정리한 소규모 목록 파일(csv, 895바이트)로, 사업명·지원대상·지원기준·지급시기·담당부서·연락처를 담는다. 서귀포시에 사는 한부모가 "내가 받을 수 있는 양육비·자립정착금·학용품비 같은 지원이 무엇이고, 언제 지급되며, 어디에 문의하나"를 확인할 때나, 민원 안내·복지정책 검토에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명·담당부서 같은 이름 매칭이나 같은 기관 기준으로만 이어 붙이며, 사회복지시설 공통 마스터를 참조할 때도 이름 기준으로 맞춰야 한다.
