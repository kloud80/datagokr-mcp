description_portal: 이 데이터는 서귀포시에서 시행 중인 저소득 한부모가족 대상 지원사업들을 포괄적으로 정리한 자료입니다. 주요 사업에는 세대 당 단발성 자립정착금, 월 21만 원 이내의 아동 양육비 지원, 학용품비, 생활보조금 등이 포함되며, 대상 기준은 기준중위소득 63% 이하 및 자녀 연령 조건 등에 따라 세분화됩니다. 청년 한부모·조손가정·영아 대상은 추가 금액 지원 대상에 포함되어, 맞춤형 복지 서비스가 가능하도록 설계되어 있습니다. 이 정보는 복지정책 기획, 예산 배분, 민원안내, 사회복지 현장 대응 등에 활용될 수 있으며, 한부모 가정의 안정적인 성장과 지역사회 통합에도 기여합니다.
