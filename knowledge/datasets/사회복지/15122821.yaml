summary_user: 두루누리 사업으로 국민연금 보험료를 지원받은 소규모 사업장 저소득 근로자 현황을 법정 시도별·결정년월별로 집계해, 지원 사업장 수, 지원 가입자 수, 지원 금액을 담은 통계 파일(csv, 약 8.6KB)이다. 분석가나 정책 담당자가 '어느 시도에서 어느 달에 보험료 지원을 받은 사업장과 근로자가 몇 명이고 지원액이 얼마인가'를 확인하거나 지역별 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 시도명(법정동시도)이나 결정년월을 기준으로 다른 국민연금 가입·수급 통계나 지역 통계와 이름을 맞춰 연결해야 한다.
description_portal: '해당 자료는 소규모 사업장의 저소득 근로자를 대상으로 하는 두루누리 국민연금 보험료지원 현황(법정도시도별, 월별)입니다.해당 데이터는 아래와 같은 분류기준으로 분류되어 있습니다.-법정도시도 : 서울특별시, 부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시, 세종특별자치도, 경기도, 강원도, 충청북도, 충청남도, 전라북도, 전라남도, 경상북도, 경상남도, 제주특별자치도-결정년월 , 연금보험료지원 지원사업장수, 지원가입자수, 지원금액 등데이터 건수가 많은 경우에는 모든 데이터가 표출되지 않을 수 있습니다.'
