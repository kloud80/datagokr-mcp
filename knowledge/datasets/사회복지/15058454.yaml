summary_user: 경기도 특수학급의 순회교육 학생 수를 기준연도(STD_YY)와 학교과정(유치원·초·중·고)별로 집계한 통계로, 전체·순회학급 순회·파견·겸임순회 학생 수를 가정·시설·병원·일반학교 유형별로 나눠 담는다. 교육 행정가나 분석가가 "경기도에서 병원·가정으로 찾아가는 순회교육을 받는 장애학생이 학교과정별로 몇 명이고 해마다 어떻게 변하는가"를 보고 특수교육 인력·자원 배분을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 학교과정 이름을 맞춰 이어 쓰며, 같은 경기도 특수교육 통계와 나란히 비교하는 정도로 연결한다.
description_portal: 이 데이터는 교육부 특수교육통계 기준으로 경기도 내 특수학급에서 이루어진 순회교육 학생 수를 학교과정별 및 순회학급유형별로 집계한 자료입니다. 기준 시점은 매년 6월 말이며, 유치원, 초등학교, 중학교, 고등학교 등 학교과정별로 전체 학생 수 및 세부 유형(가정, 시설, 병원, 일반학교)별 학생 수가 제공됩니다. 주요 항목은 전체학생수, 순회학급 순회학생 수, 순회학급 파견학생 수, 겸임순회교육 학생 수 등을 포함하며, 각 항목은 순회학급유형에 따라 세분화되어 있습니다. 이 데이터는 특수교육 자원의 배분, 순회학급 운영 현황 분석, 장애학생 맞춤형 교육정책 수립 및 평가 등에 활용될 수 있습니다.
