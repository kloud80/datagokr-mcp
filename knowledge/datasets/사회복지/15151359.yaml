description_portal: 국민연금공단은 노후준비지원법에 따라 국민이 스스로 노후를 준비할 수 있도록 상담 및 교육서비스 등을 제공하여 안정된 노후생활을 지원하고 있습니다. 국민연금공단 중앙노후준비지원센터는 서비스 제공자 인력 양성 등 노후준비 지원사업을 기획·운영하고, 권역별 노후준비서비스팀의 전담인력(전문상담사·전문강사)은 진단·상담 및 교육 등 서비스를 제공합니다. 본 공공데이터는 노후준비 교육서비스 과정명, 교육형태, 신청형태, 교육 시작일자, 교육 종료일자, 기준일자  등의 정보를 제공합니다.
