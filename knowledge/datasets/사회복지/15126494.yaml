description_portal: '평택복지재단에서 수행한 평택시민 행복실태조사 연구의 코드북과 원시데이터를 제공합니다.평택시민 행복실태조사는 국내총생산(GDP) 중심의 성장사회에서 총행복(GNH·Gross National Happiness)의 사회를 만들기 위한 평택시의 첫 연구입니다.이를 위해 평택시민을 대상으로 한 행복설문조사와 심층면접 결과를 반영하였습니다.평택시민 행복실태 연구를 통해 평택시민 행복지표를 구축하고 데이터베이스 관리방안과 실제적 적용을 위한 생애주기별 행복정책 방향 수립에 활용될 수 있습니다*본 데이터는 1회성 데이터입니다.※ 문의 : 평택복지재단 정책연구실(031-650-2660)'
