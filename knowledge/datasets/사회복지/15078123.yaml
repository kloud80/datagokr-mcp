summary_user: 아이돌봄 서비스의 누적 이용 아동 수를 기준연월·아이돌봄기관별로 0세부터 12세까지 연령별로 나눠 담은 집계 데이터이며, 전염성질병 아동 여부와 돌봄 구분, 상위 기관 정보도 함께 담는다(전국 범위, 비공간). 정책 담당자나 분석가가 '우리 지역 아이돌봄기관 이용 아동이 영아(0~2세)와 초등 고학년(10세 이상) 중 어느 쪽에 몰려 있나'를 보고 시간제·종일제 서비스나 돌보미 배치를 조정하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 아이돌봄기관 번호·이름(childCareInstNo)이나 상위기관 번호로 같은 기관이 낸 아이돌봄 데이터끼리 이어 쓴다.
description_portal: 아이돌봄 연령대별 누적아동실적 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연월, 아이돌봄기관명, 전염성질병 아동여부, 돌봄구분명, 연령 0~12세까지의 아동 수 등의 정보를 확인할 수 있습니다.특정 연령층에 맞는 맞춤형 돌봄 정책 개발에 기초 자료로 활용할 수 있습니다. 특히 0~2세 유아와 10세 이상 아동의 이용 패턴 차이를 통해 시간제·종일제 서비스 배분 조정에도 도움을 줍니다. 연령별 누적 데이터는 장기적인 아동 성장 추적 및 복지 서비스 연계 방안 수립에 기여할 수 있습니다. 이와 같은 세분화된 정보는 돌봄 인력 배치의 효율성 향상에도 활용될 수 있습니다.
