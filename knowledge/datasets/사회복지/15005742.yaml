summary_user: 경상북도 울진군 안의 사회적기업을 한 곳당 한 행으로 담은 파일로, 기관명·사회서비스 분야·주된 목적·사업 내용·인증(지정) 여부와 일자·번호·대표자·연락처·도로명/지번 주소를 담는다(파일 약 2.9KB 규모의 소량 목록). 울진군에서 돌봄·일자리 등 특정 사회서비스를 제공하는 인증 사회적기업이나 예비사회적기업이 어디에 있는지 찾는 주민·구직자, 지역 사회적경제 현황을 보는 분석가가 쓴다. 전역 조인 키는 없어 기관명이나 주소로 맞춰야 하고, 인증(지정)번호(인증(지정)번호)가 있으면 사회적기업 인증 목록 등 기업 축 데이터와 대조하는 데 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 이름·주소 매칭에 의존해야 한다. 범위는 울진군 한 곳이며, 매출·고용 같은 경영 지표는 담지 않는다.
