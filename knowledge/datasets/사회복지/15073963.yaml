summary_user: 방학 기간에 운영되는 청소년 활동 프로그램을 프로그램 한 건 단위로 담으며, 시도·시군구, 프로그램명, 운영기관명, 활동 시작·종료일, 인증 여부, 참가비, 참가대상을 전국 범위로 제공한다. 학부모나 청소년이 "이번 방학에 우리 시군구에서 참가비가 저렴한 인증 프로그램은 무엇인가"를 찾거나, 분석가가 지역별 방학 프로그램 수와 비용을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 기관명 매핑으로만 잇고, 이 방식으로 청소년 수련시설 목록이나 지역 통계와 맞춰 볼 수 있다.
limits: 공통 코드 없이 이름 기반으로 연결해야 하므로 기관명·지역명 표기 차이로 매칭이 어긋날 수 있다. 데이터는 이벤트 주기로 생성된 뒤 바뀌지 않는 것으로 분류돼 있어 상시 갱신을 전제로 쓰면 안 되며, 개발계정은 하루 10,000회 호출 제한이 있다.
