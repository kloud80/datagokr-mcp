summary_user: 공무원연금 수급자 수를 1982년부터 기준년도까지 연 단위로 집계한 전국 통계로, 퇴직연금·유족연금(퇴직·장해)·장해연금 유형별 인원과 합계를 담고 기준년도는 성별로도 나눈 작은 파일(csv 약 1.8KB)이다. 연금 재정·제도 분석가가 '공무원연금 수급자는 해마다 얼마나 늘었고 퇴직연금과 유족연금 비중은 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 연금·인구 통계와는 연도(구분)를 기준으로 맞춰 붙여 쓴다.
description_portal: 공무원연금공단에서 제공하는 공무원연금 수급자 추이 데이터로 1982년부터 기준년도까지 연 단위로 구분되며, 기준년도 데이터는 성별로도 구분되어 있습니다.연금유형은 퇴직연금과 유족연금(퇴직, 장해), 장해연금으로 구분하여 제공하고 있습니다.본 데이터는 공무원연금 수급자의 규모 변동과 유형별 분포를 파악하는 데 활용되며, 연금 재정 운영, 제도 개선, 정책 수립에 필요한 기초 통계로 제공됩니다.1. 퇴직연금수급자는 연금지급 미도래자(23,945명)가 포함되어 있음2. 2024년 기준 분할연금(1,888명), 연계퇴직연금(1,347명), 연계퇴직유족연금(30명), 비공상장해연금(12명)은 제외
