summary_user: 충청남도 보령시 안에 있는 노인복지시설을 시설 한 곳당 한 건씩 담는다. 각 건에는 시설 구분, 시설명, 주소, 전화번호, 정원으로 보이는 인원, 비고가 들어 있다. 보령시 주민이나 보호자가 집 근처 경로당·노인복지관·주간보호시설의 위치와 연락처를 찾을 때 쓰고, 분석가가 읍·면·동별 노인시설 분포를 볼 때도 쓴다. 전역 조인 키가 없어서 건강보험 장기요양기관 목록이나 사회복지시설 코드와는 시설명·주소를 맞춰 보는 방식으로만 연결하고, 지역 통계와는 주소에서 뽑은 행정구역 단위로 잇는다.
description_portal: 보령시의 노인복지시설 현황(시설명, 소재지, 전화번호 등)에 대한 정보
