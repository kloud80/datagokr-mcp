description_portal: '○ 통계개요* 통계명 : 여성가구주 현황(혼인상태별)* 통계종류 : 서울시 가구 중 여성가구주 현황을 제공하는 지정ㆍ조사통계* 근거법령 :「인구주택총조사 규칙」(기획재정부령 제173호)* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책입안의 기초자료 제공하고, 각종 가구관련 경상조사 표본틀(Sampling Frame)의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 통계청(주관기관), 지방자치단체 및 6개 중앙행정기관(실시기관)- 일반조사구 : 시도 ⇔ 시군구 ⇔ 읍면동(총관리자) ⇔ 조사관리자 ⇔ 조사원* 공표주기 : 정기(5년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 여성가구주 가구수 및 혼인상태별(유배우, 사별 등) 현황 등○ 용어설명* 여성가구주 : 불안정가구의 한 유형으로 일반가구 중 가구주가 여성인 가구○ 기 타* 혼인상태 계에 미상(가구)포함* 2015년 인구주택총조사의 전수부문은 행정자료를 활용한 등록센서스 방식이 적용되었고표본부문은 현장조사(방문면접조사) 방식으로 실시되었음* 표본자료에 대한 모수추정으로 전수조사결과와 표본조사결과의 차이가 발생할 수 있음** 모수추정 : 전수결과(등록센서스 결과)를 모수로 인구, 가구 및 거처를 구분하여 모수추정○ 출 처 : 통계청 조사관리국 인구총조사과'
