summary_user: 용인시에 등록된 장애인 수를 행정지역과 장애유형별로 나누고, 장애 정도(심한·심하지 않은)와 성별로 교차해 인원수로 담은 집계 파일이며, 기준일자는 2025-12-31이다. 용인시 복지 담당자나 지역 연구자가 '관내 어느 지역에 어떤 유형의 중증 장애인이 남녀 각각 몇 명 있는지'를 확인해 복지 수요와 예산을 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정지역 이름이나 장애유형 이름을 맞춰서만 이을 수 있다.
description_portal: '본 데이터 셋은 경기도 용인시에 등록된 장애인을 장애유형 16개(지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐성, 정신, 신장, 심장, 호흡기, 간, 안면, 장루‧요루, 뇌전증), 장애 정도(심한·심하지 않은), 성별(남·여)로 교차 분류해 인원수를 제공합니다. 장애 정도는 「장애인복지법 시행규칙」 중증(13급)·경증(46급) 기준을 따릅니다. 이를 통해 복지 예산 산정, 장애인 복지 수요 파악, 맞춤형 정책 수립, 지역 연구·서비스 설계뿐만 아니라 시각화 도구를 활용한 추세 분석 및 학술 연구용 기초 통계 자료로도 활용하실 수 있습니다.※ 데이터 기준일자 : 2025-12-31'
