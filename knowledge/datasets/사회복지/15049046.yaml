summary_user: 대구광역시 중구 관내 행정동별로 생계·의료·주거급여의 수급 가구 수와 인원, 교육급여 인원을 집계한 표입니다. 구청 복지 담당자나 지역 분석가가 '중구에서 생계급여 수급 가구가 가장 많은 동은 어디인가'를 확인해 동별 복지 자원·시설 배치를 검토할 때 씁니다. 실측 컬럼에 전역 조인 키나 행정동 코드가 없어, 다른 데이터와는 읍면동 이름을 맞춰 연결해야 합니다.
