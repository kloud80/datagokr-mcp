description_portal: 자활기업은 2인 이상의 수급자 또는 저소득층이 상호 협력하여 조합이나 공동사업자의 형태로 빈곤 탈출을 목표로 자활사업을 운영하는 업체를 의미합니다. 이는 국민기초생활보장법 개정에 따라 2012년 8월 2일부터 기존 "자활공동체"에서 "자활기업"으로 명칭이 변경된 것입니다.현재 전국 자활기업의 현황을 파악할 수 있도록 시도, 시군구, 자활기업명, 기업유형, 주소, 대표자, 업종, 사업자구분 등 상세 정보를 제공하고 있습니다. 이 정보는 자활기업의 분포와 특성을 이해하고, 지역별·유형별 자활사업 현황을 기반으로 효과적인 탈빈곤 정책을 수립하는 데 중요한 기초 자료로 활용될 것입니다.
