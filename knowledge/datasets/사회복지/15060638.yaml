description_portal: '한국남동발전의 기금지원사업 사업선정 결과 자료입니다.발전소명, 사업명, 사업내용, 사업대상(선정기관), 지원금액, 선정기준 등을 확인할 수 있습니다.상생협력부에서 매년 최신 정보를 공표하여 기금지원사업 선정 과정의 투명성을 높이고자 하며, 2014년부터 2025년 3-11까지 사업선정 결과 데이터를 누구나 확인 및 활용할 수 있는 xlsx 형식으로 다운로드할 수 있습니다.공표 내용: 사업명, 사업내용, 선정기관, 지원금액, 선정기준담당 부서: 상생협력부공표 주기: 매년* 한국남동발전 사이트 → 정보공개 → 사전정보공표 → 동반성장 분야에서도 확인할 수 있습니다.'
