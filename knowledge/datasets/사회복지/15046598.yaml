description_portal: '○ 통계개요* 통계명 : 건강보험 적용인구 현황* 통계종류 : 서울시 건강보험 가입인구 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「국민건강보험법」규정에 따른 건강보험 가입자 및 피부양자 수* 작성목적 : 사회보장의 근간인 의료보장에 관한 주요 사항을 통계자료로 생산함으로써우리나라 건강보험정책 및 보건의료정책의 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 국민건강보험공단 시ㆍ도지부 → 국민건강보험공단* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 가입유형별(근로자, 공무원, 지역) 건강보험 가입자 및 피부양자 현황○ 기 타* 주민등록 주소지 기준이며, 지역 가입자는 적용대상자를 말함* 2001년도 까지는 직장은 사업장 소재지 기준이고, 2002년도 이후는 서울시 거주자(주민등록소재지)기준임* 합계의 피부양자는 지역세대원 포함'
