description_portal: 서울시 청소년방과후아카데미 시설현황정보는 청소년을 대상으로 한 방과후 돌봄과 학습·문화·진로지원 프로그램을 제공하는 시설의 분포와 운영 현황을 파악하기 위한 데이터입니다. 시설명, 자치구명, 주소, 좌표값을 통해 각 아카데미의 위치를 정확히 확인할 수 있으며, 시설형태와 서비스분류를 통해 학교 연계형, 생활기반형 등 운영 특성과 프로그램 성격을 파악할 수 있습니다. 사용료무료여부와 사용료 항목은 가구의 비용 부담 정도를 분석하는 데 활용되며, 학기와 방학 기간별 운영시간, 토요일 운영여부 및 운영시간 정보는 실제 돌봄과 활동 제공 가능 시간대를 세부적으로 보여줍니다. 사이트URL은 프로그램 내용과 모집 안내 등 추가 정보를 확인할 수 있게 해주며, 등록일시와 수정일시는 데이터의 최신성과 변동 이력을 나타내어 청소년 돌봄·지원 정책 수립과 지역 간 서비스 격차 분석을 위한 기초 자료로 활용될 수 있는 데이터입니다.
