description_portal: '○ 통계개요* 통계명 : 가사분담 실태(남편)* 통계종류 : 통계청 사회조사의 서울시민 가사분담 실태를 제공하는 지정ㆍ조사통계* 작성목적 : 사회적 관심사항, 삶의 질에 관한 사항 등 사회구성원의 주관적 관심사를파악하여 사회개발정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사대상 → 지방통계청 → 통계청* 공표주기 : 정기(2년)* 공표범위 : 지역 - 서울시내용 - 서울시민의 "가사분담 실태"에 대한 맞벌이/비맞벌이 가정 남편의응답을 백분율로 제공○ 용어설명○ 기 타* 조사대상 19세 이상 인구* 부부가 함께 살고 있는 가구(2018년부터 주말부부 포함)에서 "남편"이 응답* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 부부가 함께 살고 있는 가구의 남편만 응답하여 주십시오.(2018년부터 주말부부 포함)귀댁에서는 평소 가사분담을 어떻게 하고 계십니까?'
