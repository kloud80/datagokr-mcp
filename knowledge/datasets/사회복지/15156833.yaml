description_portal: 본 데이터는 한국수력원자력 지원사업의 연도별 선정결과를 정리한 자료로, 2021~2025년 기간 동안 추진된 지원사업에 대해 사업종류(교육장학, 문화진흥, 지역복지, 지역경제, 주변환경 등), 단위사업명, 단위사업 지원금액을 제공합니다. 지역인재 육성, 학교·장학 지원, 문화·체육 행사, 취약계층 복지, 주거환경 개선 등 세부사업의 규모와 변화를 연도별로 비교할 수 있습니다. 이를 통해 사업유형별 지원 추이 분석, 예산 집행의 투명성 제고, 중복·편중 지원 점검, 성과관리 및 차년도 지원계획 수립에 활용 가능하며, 지자체·주민·협력기관의 사업 이해 및 협력 과제 발굴을 위한 기초자료로 활용할 수 있습니다.※ 단위사업 지원금액의 단위는 "원"입니다.
