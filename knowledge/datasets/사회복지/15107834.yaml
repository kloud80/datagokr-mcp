description_portal: 사회적경제기업 BSI 조사결과 데이터를 제공합니다. 설문조사에 의한 경기분석 방법의 일환으로, 기업가를 대상으로 한 설문조사를 통해 경기동향을 파악합니다. 기업의 경영인을 대상으로 한 설문조사를 통해 조사하며, 각 시점에서의 경기 수준뿐만 아니라 전월(분기) 또는 전년동원(분기)에 대히한 경기의 변화방향을 조사하기도 합니다.산출된 지수의 값은 0에서 200 사이의 값을 지니며, 이 때 0은 완전한 불황국면을, 200은 완전한 활황국면을, 100은 보합 수준임을 의미합니다.일반적으로 BSI가 100 이상이면 경기가 상승국면에 있다고 해석하며, 100 이하인 경우 경기가 하향국면에 있다고 해석합니다.데이터관련문의가 있으시다면 한국사회적기업진흥원 정보화기획팀으로 문의 부탁드리겠습니다. 감사합니다.
