description_portal: 2019년부터 2025년까지, 국방부 군인 연금 급여별 지급 현황에 대한 데이터입니다. 연도와 급여 구분(연금, 재해보상급여 등), 급여 종류(퇴역연금, 기여금반환, 이민일시금, 사망조위금, 잔여퇴직급여 등),지급액(백만 원 기준), 비중(백분율)에 따라 구성하여 설명하고 있으며, 전체 지급 금액의 비중에는 각 지급 금액과 급여 종류가 포함되어 있습니다. 해당 데이터 분석을 통해 군인 연금 내역별 변동 추이 확인이 가능하고, 추후 군인 연금 재정 규모와 흐름을 파악하여 연금 정책 및 제도를 개선하는 데에 도움을 줍니다.
