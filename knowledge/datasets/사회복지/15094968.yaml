description_portal: 본 데이터는 대구광역시 수성구 관내 읍면동별로 등록된 정신장애인의 현황을 정리한 자료이다. 장애인복지법에 따라 등록된 장애인을 기준으로 하며, 특히 정신적 장애를 가진 등록 인원을 읍면동 단위로 구분하여 제공한다. 데이터는 각 행정구역별 전체 등록 장애인 수와 이 중 정신장애인 수로 구성되어 있으며, 지역별 정신장애인 분포 특성을 파악할 수 있다. 해당 정보는 정신건강복지센터 및 유관기관의 복지서비스 계획 수립, 인력 및 예산 배분, 지역 중심 돌봄 정책 설계 등에 활용될 수 있다. 또한 정신장애인의 사회적 통합을 지원하기 위한 기반자료로 사용되며, 공공기관의 정책 수립과 자료 분석에 기여한다. 본 데이터는 주기적으로 갱신되어 자료의 정확성과 시의성을 유지하고 있다.
