description_portal: 공무원연금공단에서 관리하는 공무원 연금취급기관(소속기관)의 현황을 지역별로 분류하여 제공하는 데이터로, 전국 광역자치단체 단위로 기관 수, 소속 인원 수, 기관당 평균 인원 등을 포함하고 있습니다.지역 구분은 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주 등 총 17개 광역자치단체를 기준으로 하며, 각 지역에 소속된 연금취급기관 수와 해당 기관의 인원수를 함께 제공함으로써 지역별 행정조직의 규모와 구성 특성을 파악할 수 있도록 구성되어 있습니다.1. 연금취급기관 통폐합("21년)이 반영되지 않은 소속기관의 지역 기준2. 기관당 평균인원 = 인원 / 기관수
