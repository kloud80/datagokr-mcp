summary_user: 사립학교교직원연금공단이 관리하는 국공립 학교기관(대학병원·치과대학병원·부설 초중고 등)의 학교명·주소·대표전화번호를 기관 한 곳당 한 행으로 담은 전국 단위 목록 파일이다(약 3.5KB CSV). 사학연금 적용 대상인 국공립 부속기관이 어디에 있고 연락처가 무엇인지 확인하려는 연구자나 교육·연금 분야 분석가가 쓴다. 공통 기관코드 같은 전역 조인 키가 없어, 다른 학교·기관 데이터와는 학교명이나 주소를 문자열로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 사립학교교직원연금공단에 관리되고 있는 국공립 학교기관 현황 자료( 대학병원, 치과대학병원, 부설 초중고 학교 등)입니다. 해당 데이터는 학교기관, 주소, 대표전화번호가 포함되어 있습니다. 이를 통해 학교 상세 정보를 파악하는데 도움이 되며 교육 관련 정책 수립 및 연구, 교육 시장 동향 분석에 활용될 수 있습니다.  이 데이터는 교육기관에 대한 객관적인 통계를 제공하고 다양한 연구의 기초 자료로 활용될 수 있습니다.* 대표 전화번호가 0 으로 되어 있는 데이터는 데이터가 등록되지 않아 0으로 표기 되어 있습니다.
