description_portal: '○ 통계개요* 통계명 : 시민행복지수* 통계종류 : 서울 거주 만15세 이상 가구 구성원을 대상으로 실시하는 조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료 구축 및 분석을 실시함으로써 서울의현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전수준을 모니터링하는한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의 실효성을객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데 목적이 있음* 조사체계 : 조사기관 → 서울특별시 디지털도시국 데이터전략과* 공표주기 : 정기(매년, 4월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민의 성별ㆍ연령별ㆍ지역별 등의 항목별 행복지수○ 용어설명* 시민행복지수 : 서울시민의 주관적인 행복정도로, 건강상태ㆍ재정상태ㆍ주위 친지친구와의 관계ㆍ가정생활ㆍ사회생활의 만족지수를 산출함○ 기 타* 문항 : 귀하는 요즘 스스로 행복하다고 생각하십니까? 가장 행복한 상태를 10점으로가장 불행한 상태를 0점으로 하여 각 영역별 자신의 행복점수를 표시해 주십시오* 해당 연도가 없는 것은 그해 조사 항목에서 제외된 것임'
