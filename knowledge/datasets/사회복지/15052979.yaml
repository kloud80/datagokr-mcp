summary_user: 공무원연금 퇴직연금 수급자 수를 퇴직사유(정년·명예·일반·당연퇴직, 직권면직, 기타)와 성별로 나누고, 17개 광역시도를 열로 펼친 집계표다(CSV 1개, 약 1KB). 분석가가 '시도별로 명예퇴직 출신 퇴직연금 수급자 비중이 어떻게 다른가', '퇴직사유별 남녀 수급자 차이는 어느 지역에서 큰가' 같은 질문에 쓴다. 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 시도 이름(열 이름)을 맞춰 붙여야 한다.
description_portal: 공무원연금공단에서 관리하는 퇴직연금 수급자의 지역별 퇴직사유별 통계 데이터입니다. 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주 등 전국 광역자치단체를 기준으로 퇴직연금 수급자의 분포를 제공하며, 퇴직사유는 정년퇴직, 명예퇴직, 일반퇴직, 당연퇴직, 직권면직, 기타(파면, 해임, 실종 등)로 구분됩니다. 남성과 여성 수급자를 별도로 집계하여 성별·지역별·퇴직사유별 수급 현황을 동시에 파악할 수 있어, 지역별 퇴직 구조의 특성 분석, 성별 차이, 퇴직 유형별 정책 수립에 활용이 가능합니다.
