summary_user: 성남시 안 재가장기요양기관을 기관 한 곳당 한 행으로 담고, 기관명·소재지 주소·연락처와 함께 방문요양·방문목욕·방문간호·복지용구·주야간보호·단기보호 중 어떤 급여를 제공하는지, 주야간보호·단기보호 정원을 싣는다. 성남에서 부모님 방문요양이나 주야간보호를 맡길 곳을 찾는 가족, 동네별 재가돌봄 공급을 살피는 분석가가 '우리 동네에서 방문간호까지 하는 기관이 어디인가' 같은 질문에 쓴다. 전역 조인 키는 없어 국민건강보험공단 장기요양기관 정보나 다른 노인복지시설 목록과는 기관명·주소를 맞춰 이어야 하고, 지역 통계와는 소재지에서 뽑은 시군구 단위로 잇는다.
description_portal: 성남시 내 재가장기요양기관에 대한 데이터로, 기관명, 소재지, 급여종류에 따른 정보(방문요양, 방문목욕, 방문간호, 복지용구, 주야간보호), 보호 정원, 연락처 등의 항목으로 구성되어 있습니다. 성남시는 고령 인구의 증가에 대응하여 어르신들이 가정 내에서 필요한 돌봄서비스를 받을 수 있도록 다양한 재가장기요양기관을 운영하고 있다. 이들 기관은 국민건강보험공단에 등록된 장기요양기관 중 재가급여 제공기관으로, 방문요양, 방문목욕, 방문간호, 주야간보호, 단기보호 서비스 등을 통해 신체·정신 기능이 저하된 어르신의 일상생활을 지원한다. 2025년 기준 성남시에는 약 300개 이상의 재가장기요양기관이 운영 중이며, 이 중 방문요양기관과 주야간보호센터의 비중이 가장 높다.
