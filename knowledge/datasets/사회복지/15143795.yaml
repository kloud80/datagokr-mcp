summary_user: 경상북도 도내 노인복지시설을 시설 한 곳당 한 행으로 담은 건별 목록으로, 시설명·주소·우편번호·지역명과 시설유형·분류·이용 형태·이용 대상, 지도 X·Y 좌표를 포함한다. 지자체 담당자나 분석가가 '우리 시군에 어떤 유형의 노인복지시설이 어디에 몰려 있고 어느 지역이 비어 있는가'를 확인하고 시설 배치의 형평성을 검토하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소 매칭이나 지역명(localTyp)·좌표 기반의 공간 결합으로 잇는다. 이렇게 잇는 대상은 건강보험 장기요양기관 목록이나 시군구 단위 고령 인구 통계 같은 지역 연계 자료다.
limits: 시설 고유 ID(fcltId)는 이 데이터 안에서만 쓰는 값이라 장기요양기관·사회복지시설 코드와 바로 맞물리지 않고, 결합하려면 이름·주소 매칭이 필요하다. 범위는 경상북도 한 곳이라 전국 비교에는 다른 시도 자료가 따로 있어야 한다. 호출은 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
