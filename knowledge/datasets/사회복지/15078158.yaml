summary_user: 아이돌봄기관별·기준연월(crtrYm)별로 아이돌보미 수를 40세 미만부터 65세 이상까지 5세 단위 연령대로 나눠 당월 인원과 누적 인원으로 담은 전국 단위 집계 데이터다. 정책 분석가나 지자체 담당자가 '우리 지역 돌봄기관의 돌보미가 고령층에 얼마나 몰려 있고 청년층 유입은 늘고 있는가' 같은 세대별 인력 구성 질문에 쓴다. 전역 조인 키는 없으며, 같은 기관이 내는 다른 아이돌보미 현황 데이터와 아이돌봄기관번호(childCareInstNo)·상위기관번호 또는 기관명을 맞춰 연결한다.
description_portal: 아이돌보미 연령대별 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 아이돌봄기관명, 상위아이돌봄기관명, 당월 연령 0~100세까지의 돌보미 수, 누적 돌보미 수 누적연령 돌보미 수의 정보를 확인할 수 있습니다.고령자 또는 청년층 돌보미의 비율을 파악할 수 있어 세대 간 일자리 분포를 분석하는 데 유용합니다. 연령대별 인력 유지율과 신규 유입 추이를 모니터링하면 맞춤형 지원 정책 수립이 가능합니다. 예를 들어 청년층 유입을 촉진하거나 고령 돌보미의 역량 강화를 위한 교육이 필요한지를 판단하는 근거가 됩니다. 세대별 근로 특성과 선호 서비스 유형을 비교 분석하는 데에도 활용될 수 있습니다.
