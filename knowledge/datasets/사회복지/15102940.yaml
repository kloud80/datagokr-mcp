summary_user: 전남 지역 마을기업을 한 곳씩 담은 건별 현황 파일로, 시군·마을기업명·유형·업종·주생산품·사업내용과 예비·1~3차년 지정연도, 우수·모두애 마을기업 여부, 소재지·연락처를 담는다(CSV 약 47KB). 주민이나 판로 담당자가 "우리 시군에서 농산물 가공·체험 분야로 지정된 마을기업은 어디이고 몇 차년까지 지원받았나"를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 시군명·마을기업명 같은 이름 매칭이나 소재지 주소 기준으로만 이을 수 있다.
description_portal: '- 지역주민이 각종 지역자원을 활용한 수익사업을 통해 공동의 지역문제를 해결하고 소득 및 일자리를 창출하는 마을단위의 기업인 마을기업 현황에 대한 정보를 조회하실 수 있습니다.- 전라남도는 지역 경제 활성화와 주민 삶의 질 향상을 위해 다양한 마을기업을 운영하고 있습니다. 마을기업은 지역 자원을 활용하여 지속 가능한 경제 활동을 촉진하며, 지역 주민들의 일자리 창출과 사회적 연대감을 증진하는 데 중요한 역할을 합니다.- 전라남도 내에는 농산물 가공, 관광, 체험, 전통 공예 등 다양한 분야에서 활동하는 마을기업들이 있습니다. 이들은 지역 특산물을 활용하거나 전통 기술을 계승하여 부가가치를 창출하고 있습니다.- 전라남도 사회적경제지원센터 : 마을기업 관련 교육, 컨설팅, 판로 개척 등 다양한 지원 프로그램을 제공합니다.'
