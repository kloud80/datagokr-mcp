summary_user: 대전해바라기센터의 운영 실적을 연도별·지원 유형별 인원(명) 단위로 담은 집계 파일로, 건별 피해자 기록이 아니며 파일 크기는 707바이트 정도로 작습니다. 대전 지역 성폭력·가정폭력 등 피해자 지원 정책을 살피는 분석가나 담당자가 '해바라기센터가 해마다 어떤 지원을 몇 명에게 했는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(추진년도)나 지원 유형 이름을 맞춰 붙이거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 대전광역시 대전해바라기센터 운영 현황 자료는 성폭력, 가정폭력, 성매매 등 다양한 폭력 피해자와 가족을 대상으로 365일 24시간 상담, 의료, 법률, 수사 지원 등 종합적인 서비스를 제공하는 내용을 담고 있습니다. 피해자는 위기 상황 발생 시 언제든지 센터를 통해 전문 상담과 심리 치료, 응급 의료 지원, 법률 자문, 경찰 조사 연계 등 다양한 지원을 받을 수 있으며, 증거 채취, 병원 진료, 보호 시설 연계 등 실질적인 보호와 치유를 위한 다각적 지원이 이루어집니다. 센터에는 경찰관이 상주 하여 신속한 수사 연계가 가능하고, 각종 상담 및 치료 프로그램을 통해 2차 피해 예방과 피해자의 일상 회복을 돕고 있습니다.
