description_portal: '○ 통계개요* 통계명 : 노후생활 희망정도* 통계종류 : 서울서베이의 서울시민 노후생활 희망정도를 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별ㆍ연령별ㆍ지역별 등)의 노후생활 희망정도○ 기 타* 문항 : 다음의 각 항목별로 귀하께서 노후에 활동하기를 희망하는 정도를 표시해주시기 바랍니다.* 해당연도가 없는 것은 그해 조사항목에서 제외된 것임'
