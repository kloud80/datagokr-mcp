summary_user: 경기도 워라밸링크 플랫폼에 올라온 전문가 칼럼을 글 한 건당 한 행으로 담으며, 고유번호·제목·조회수만 있고 본문은 없습니다. 육아·부모 리더십·가족 소통·감정관리 같은 주제 가운데 어떤 칼럼이 많이 읽히는지 보려는 콘텐츠 기획자나 가족친화 교육자료 제작자가 조회수(inq_cnt)와 제목 키워드를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목 키워드나 같은 기관 코드로만 느슨하게 연결한다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼에서 제공하는 전문가들의 칼럼 정보를 담고 있습니다. 각 항목은 고유번호, 제목, 조회수로 구성되어 있습니다. 주요 주제로는 육아, 부모 리더십, 가족 내 소통, 개인의 재충전과 감정관리, 일과 삶의 균형 등이 있습니다. 전문가 컬럼에서는 다양한 콘텐츠를 통해 일상에서 겪는 심리적 어려움이나 육아 고민에 대한 전문가의 조언을 제공하고 있습니다. 본 데이터는 콘텐츠 추천 시스템 개발, 키워드 기반 관심사 분석, 가족친화적 교육자료 제작 등에 활용하실 수 있습니다.
