description_portal: 경기도 수원시 지역아동센터시설 명칭, 소재지도로명주소, 소재지지번주소, 위도, 경도, 시설전화번호, 정원, 관리기관명, 관리기관 연락처 정보를 포함합니다. 집이나 직장 근처에 어떤 아동센터가 있는지 확인이 가능하고 정원 수 정보를 보고 센터의 규모를 파악하는데에 도움이 됩니다. 특정센터만 알고 이용하는게 아니라 여러 센터를 비교해 접근성, 정원 상황에 맞춰 선택이 가능합니다. 시민들이 아동 돌봄 인프라의 분포를 알게 되어, 부족한 지역에 대해 보충을 할 수 있는 근거로 활용할 수 있습니다. 자원봉사, 후원 활동 참여시 활용 할 수 있습니다.
