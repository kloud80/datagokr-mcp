summary_user: 수원시 안의 지역아동센터를 한 곳당 한 행으로 담은 시설 목록 파일로, 시설명·도로명/지번 주소·위도경도·전화번호·정원·관리기관을 담는다. 보호자가 집이나 직장 근처에 어떤 지역아동센터가 있고 정원이 어느 정도인지 비교할 때 쓰고, 분석가는 동네별 아동 돌봄 시설 분포와 공백 지역을 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 시설명을 맞춰 붙이고, 사회복지시설 공통 마스터를 참조해 연결한다.
limits: 시설 코드 같은 공통 키가 없어 다른 시설·통계 데이터와 이으려면 이름이나 주소를 직접 매칭해야 한다. 범위는 수원시 한 곳뿐이어서 다른 시군구와 비교하려면 지자체별 파일을 따로 모아야 한다.
