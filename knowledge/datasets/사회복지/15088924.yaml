summary_user: 서울시 관내 어린이집을 한 곳씩 담은 시설 단위 현황 데이터로, 시군구, 어린이집코드(STCODE), 유형, 운영상태, 주소·연락처, 위도·경도와 정원·현원, 연령별 반수·아동수, 보육실·놀이터·CCTV 수, 통학차량 운영 여부, 인가·휴지·폐지 일자를 담는다. 부모는 '우리 동네에서 만 1세 반이 있고 현원이 정원보다 적은 어린이집이 어디인가'를 찾는 데 쓰고, 분석가는 구별 정원 대비 현원으로 보육 인프라 격차를 보는 데 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙는 전역 조인 키가 없어서, 어린이집코드나 이름·주소 매핑, 좌표 기반 공간 결합으로 평가·보육료 공시·입소 대기 정보나 유치원 데이터와 이어 쓴다.
description_portal: 서울시 어린이집 정보(표준 데이터)는 서울시 관내 어린이집의 기본 현황, 보육 환경, 인력 구성, 이용 아동 현황 등을 종합적으로 제공하는 데이터입니다. 시군구명, 어린이집코드, 어린이집명, 어린이집유형, 운영현황, 주소, 연락처, 홈페이지주소를 통해 어린이집의 기본 정보를 확인할 수 있습니다. 보육실수, 보육실 면적, 놀이터수, CCTV총설치수, 통학차량운영여부, 인가일자 등은 안전과 시설 환경, 운영 기반을 평가하는 데 활용됩니다. 정원, 현원과 연령별 반수 및 아동수 정보는 수용 규모와 실제 이용 현황, 연령대별 보육 수요를 파악하는 데 유용합니다. 보육교직원수와 교직원현황, 근속년수 정보는 인력 안정성과 보육의 질을 가늠하는 데 중요한 지표로 쓰입니다. 위도와 경도 좌표는 위치 기반 서비스나 지도 시각화에 활용할 수 있으며, 제공서비스, 데이터기준일자, 데이터수집일은 서비스 특성과 데이터 최신성을 확인할 수 있는 항목입니다. 이 데이터는 학부모의 어린이집 선택, 지자체의 보육 정책 수립, 지역별 보육 인프라 격차 분석 등 다양한 행정 및 연구에 활용 가능한 핵심 기초 자료입니다.
