description_portal: '관내 한부모가족복지시설 현황(유형, 소재지, 정원, 전화번호 등)입니다.1. 생활시설은 총 9개소이며, 한부모가족이 일정 기간 입소하여 보호와 지원을 받을 수 있는 공간입니다. 다음과 같은 유형이 있습니다.가. 생활지원시설: 5개소- 대상: 무주택 저소득 모자가정(18세 미만 자녀를 양육하는 경우)나. 일시지원시설: 1개소- 대상: 배우자의 학대로 인해 모와 아동의 건강 및 양육에 위협을 받는 경우다. 출산지원시설: 1개소- 대상: 이혼, 사별, 미혼 등으로 임신 중이거나 출산 후 1년 이내의 여성 및 만 3세 미만 자녀를 둔 여성라. 양육지원시설: 2개소- 대상: 6세 미만 자녀를 양육 중인 미혼모2. 이용시설은 한부모가족복지상담소 1개소가 있습니다.- 역할: 위기에 처한 한부모가족에 대한 상담, 자립 지원 및 문제 해결을 위한 서비스 제공'
