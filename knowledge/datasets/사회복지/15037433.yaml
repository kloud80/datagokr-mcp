summary_user: 서울 동작구 관내 장애인직업재활시설을 시설 한 곳당 한 행으로 담은 목록 파일(약 1KB 규모의 CSV)로, 시설유형·종류, 시설명, 도로명·지번 주소, 전화번호, 주요사업, 생산품을 담는다. 장애인 당사자나 가족이 "동작구에서 직업훈련이나 직무적응을 지원하는 재활시설은 어디이고 무엇을 생산하나"를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 시설명·주소 문자열을 맞춰 붙이거나 같은 동작구 자료끼리 이어 쓴다.
description_portal: 이 데이터는 서울특별시 동작구 관내에 있는 장애인직업재활시설에 관한 것입니다.  재활시설의 주소, 전화번호, 주요사업, 소재시, 생산품 등이 포함되어 있습니다.이 데이터를 통해 장애인 당사자나 가족이 시설별 직업훈련 프로그램이나 주요사업등을 파악할 수 있습니다.지역별 재활시설 위치와 제공 서비스 비교를 통한 맞춤형 재활기관을 선택할 수 있으며, 직무적응 지원을 제공하는 기관을 파악할 수 있습니다.생활권 내에서 접근 가능한 직업 재활시설 정보를 통해 재활지원 정책 수립을 위한 기초 데이터로도 활용될 수 있습니다.
