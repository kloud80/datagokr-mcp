description_portal: 무연고 사망자는 가족, 친척 등 연고자가 없거나 있어도 시신 인수 및 장례를 거부한 사람을 말하며, 사망 후 장례 절차나 유골 처리 등이 국가나 지방자치단체에 의해 이뤄집니다. 고령화, 1인 가구 증가, 가족 해체, 사회적 고립 등 복합적인 사회문제로 인해 무연고 사망자 수는 해마다 증가하고 있으며, 이는 단순한 개인 문제가 아닌 사회적 책임의 영역으로 인식되고 있습니다. 특히, 이들의 사망은 고독사와도 밀접하게 연결되어 있어, 생애 마지막 순간까지 돌봄을 받지 못한 채 홀로 생을 마감하는 경우가 많습니다. 무연고 사망자 현황은 사회 안전망의 실태를 보여주는 지표이자, 복지 정책 수립과 고독사 예방, 지역사회 돌봄체계 강화 등 향후 정책 방향을 설정하는 데 중요한 자료로 활용됩니다.
