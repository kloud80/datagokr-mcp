summary_user: 국민연금공단 관할지사별로 국민연금에 가입된 사업장 수(개소)와 사업장가입자 수(명)를 집계한 표로, 포털 설명상 2020년 5월 한 시점의 전국 데이터를 담은 작은 CSV 파일(2,285바이트)입니다. 분석가가 '2020년 5월 기준으로 어느 지사 관할에 국민연금 가입 사업장과 가입자가 많이 몰려 있는가'를 비교하는 데 씁니다. 전역 조인 키가 없어 관할지사 이름을 기준으로 같은 기관의 다른 지사별 통계와 맞춰 붙이는 방식으로만 연결합니다.
limits: 지사 단위 집계라 개별 사업장의 가입자 수·납부액이나 사업자번호가 없어 기업 단위 분석이나 국세청·공정위 등 기업 데이터와의 연결에는 쓸 수 없습니다. 행정구역 코드나 좌표가 없는 비공간 데이터이며, 지사명은 시군구와 일치하지 않으므로 지역 통계와 맞출 때 별도 매핑이 필요합니다.
