description_portal: '○ 통계개요* 통계명 : 재가노인복지시설* 통계종류 : 광주광역시 노인복지시설을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「노인복지법」38조에 규정된 이용시설로 광주광역시에서 관리하는 시설* 작성목적 : 노인복지시설 설치신고를 마친 노인복지시설의 수, 적정수의 시설수요와 충족율을 분석하고 분석결과에 따른 정책 수립 및평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 →광주광역시 고령사회정책과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 광주광역시 및 자치구내용 - 광주광역시 자치구별 재가노인복지시설 이용 (재가복지시설 중 주야간보호센터, 방문간호, 방문목욕 등 서비스 종류별 작성)○ 용어설명* 주야간보호센터 : 수급자를 하루 중 일정한 시간동안 장기요양기관에 보호하여 신체 활동 지원* 방문요양 : 장기요양요원이 수급자의 가정 등을 방문하여 신체활동 및 가사활동 등을 지원* 방문목욕 : 장기요양요원이 목욕설비를 갖춘 장비를 이용하여 수급자의 가정 등을 방문하여 목욕을 제공* 방문간호 : 장기요양요원이 ㄴ간호사 등이 의사, 한의사 또는 치과의사의 지시서에 따라 수급자의 가정 등을 방문하여 간호, 진료의 보조, 구강위생 등을 제공* 복지용구 : 수급자 일상생활, 신체활동 지원에 필요한 용구를 제공하거나, 가정을 방문하여 재활에 관한 지원 등을 제공'
