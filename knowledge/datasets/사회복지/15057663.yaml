summary_user: 경기도 장애인 무료법률구조 지원 실적을 기준년도와 관할 지부·지소·출장소별로 집계한 자료로, 지원인원수·지원건수·구조금액(천원)을 담는다. 정책 담당자나 연구자가 "어느 관할 지부에서 장애인 법률구조 지원 인원과 구조금액이 해마다 어떻게 달라졌나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 시군 코드(SIGUN_CD)나 지부·지소 이름을 직접 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 장애인을 대상으로 한 무료 법률구조 지원 현황을 연도별·관할 지부 및 지소별로 집계한 자료입니다. 주요 항목에는 기준년도, 관할지부지소출장소명, 지원인원수(명), 지원건수(건), 구조금액(천원)이 포함되어 있습니다. 이를 통해 각 지역별 법률구조 수요와 지원 규모를 파악할 수 있으며, 연도별 지원 인원 및 구조금액의 변화를 분석하여 장애인 법률 접근성 향상 정책의 효과성을 평가할 수 있습니다. 특히 구조금액은 소송비용, 변호사 비용 등 실제 법률 지원에 소요된 비용을 의미하며, 지역 간 차이를 통해 법률 서비스 접근성 격차를 확인할 수 있습니다. 이 데이터는 장애인의 권리 보호와 법률적 지원 강화를 위한 정책 수립 및 연구 자료로 활용될 수 있습니다.
