summary_user: 국민연금에 가입된 외국인 가입자 수를 국적별로 나눠 사업장가입자와 지역가입자 인원(명)으로 담은 전국 단위 집계 파일로, 포털 설명상 2020년 5월 한 달 기준이다. 분석가나 외국인 고용 관련 담당자가 '어느 국적 외국인이 국민연금에 얼마나 가입했고, 직장 가입과 지역 가입 비중은 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 국적 이름(구분)을 국가명·국가코드에 매핑해야만 이어 쓸 수 있다.
limits: 전국·비공간 집계라 시군구 등 지역별 분석에는 쓸 수 없다. 공통 조인 키가 없어 다른 국적별 통계와 결합하려면 국적 이름을 직접 맞춰야 한다. 파일이 235바이트로 매우 작아 일부 국적만 담겼을 수 있으니 전체 국적 현황으로 단정하지 않는다.
