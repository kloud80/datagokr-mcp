summary_user: 인천광역시 영종구(포털 설명상 옛 중구) 관내 재가노인복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·소재지 주소·연락처·데이터기준일이 들어 있다(약 2.5KB 규모의 CSV). 보호자나 어르신이 영종·중구 지역에서 방문요양·주간보호 같은 재가 서비스를 받을 시설을 찾고 연락처를 확인할 때, 또는 지역 노인복지 인프라를 분석할 때 쓴다. 전역 조인 키가 없어 장기요양기관·사회복지시설 목록과는 시설명이나 주소를 맞춰 잇고, 지역 통계와는 시군구 단위로 연결한다.
limits: 시설코드 같은 공통 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되며 불일치가 생길 수 있다. 범위가 한 자치구에 한정되어 다른 지역과 비교하려면 별도 데이터가 필요하고, 좌표 없이 주소만 담겨 있다.
