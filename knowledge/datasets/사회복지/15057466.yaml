summary_user: 경기도 등록장애인을 기준연도(STD_YY)와 연령대별로 집계해 합계, 심한 장애인 수, 심하지 않은 장애인 수를 담은 시도 단위 집계 데이터다. 복지 분석가나 지자체 담당자가 '고령층에서 심한 장애 비율이 얼마나 높아 돌봄·장기요양 수요가 늘어나는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·연령대 이름을 맞추거나 같은 기관 자료끼리 연결하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 등록장애인을 연령과 장애 정도(등급)별로 집계한 현황입니다. 보건복지부와 경기도청 장애인복지과가 제공하며, 매년 12월 말 기준으로 산출됩니다.데이터에는 연령별 등록장애인 합계, 그리고 심한 장애인 수(중증), 심하지 않은 장애인 수(경증)가 포함됩니다. 예를 들어, 50대 연령대에서 총 15,000명의 등록장애인이 있을 경우, 이 중 9,000명은 심한 장애, 6,000명은 심하지 않은 장애로 구분됩니다.이 데이터는 연령대별 장애 발생 특성과 장애 정도 분포를 파악하는 데 활용됩니다. 고령층에서 중증 장애인의 비율이 높아진다면, 이는 재활·돌봄 서비스, 장기요양 정책 수요를 예측하는 근거가 됩니다. 반면 청소년이나 청년층에서 경증 장애 비율이 높게 나타난다면, 교육 지원, 취업 연계 정책으로 연결될 수 있습니다.또한, 연령대별 비교를 통해 장애 발생 시점과 추세를 분석할 수 있어, 예방 중심의 보건정책이나 연령 맞춤형 복지 대책 수립에도 중요한 역할을 합니다.
