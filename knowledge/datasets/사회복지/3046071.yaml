summary_user: 국민연금에 가입한 사업장을 한 건씩 담은 원천 목록으로, 사업장명·법인/개인 구분·가입/탈퇴 상태·법정동 주소코드·도로명주소·자료생성년월을 담으며, 검증 시 API가 밝힌 전체 건수는 1,909건이고 범위는 전국입니다(포털 설명상 가입자 3인 이상 법인, 10인 이상 개인사업장). 분석가나 사업자가 '우리 동네 읍면동에 국민연금 가입 사업장이 어디 있고 탈퇴한 곳은 어디인가'처럼 사업장 규모·현황을 따져 볼 때 쓰며, 사업장 단위로 가입자 수·납부액을 보는 드문 공개 원장입니다. 시도·시군구·읍면동 법정동 코드와 도로명주소로 다른 지역·주소 데이터와 잇고, 사업자등록번호(bzowrRgstNo)는 앞 6자리만 있어 국세청·공정위·조달 등 기업 데이터와는 부분적으로만 맞춰 볼 수 있습니다.
limits: 상세·기간별 조회 오퍼레이션은 필수 파라미터 식별번호(seq)를 먼저 이 목록에서 받아 넘겨야 하며, 최소 파라미터로 호출했을 때 상세정보(getDetailInfoSearchV2)와 기간별 현황(getPdAcctoSttusInfoSearchV2)은 응답이 없어 세 오퍼레이션 중 하나만 실호출에 성공했습니다. 개발계정은 하루 10,000회로 제한됩니다.
