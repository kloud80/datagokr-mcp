description_portal: '(국민연금가입사업장정보) 법정동단위 지역별, 국민연금 가입 사업장 정보* 제공 범위: 가입자 수 3인 이상 법인사업장, 가입자 수 10인 이상 개인사업장(2025.7.이후)* 사업장 컬럼별 상세설명○ 자료생성년월 → 자격마감일(사유발생일이 속하는 달의 다음달 15일)까지 신고분 반영○ 가입자 수 → 가입자 수(고지인원 수 포함)○ 당월고지금액 → 국민연금법 시행령 제5조에 의거 기준소득월액 상한액 적용으로 실제소득과 고지금액은 상이할 수 있음■상한액 2021.7. ~ 2022.6. 5,240,000원■상한액 2022.7. ~ 2023.6. 5,530,000원■상한액 2023.7. ~ 2024.6. 5,900,000원■상한액 2024.7. ~ 2025.6. 6,170,000원■상한액 2025.7. ~ 2026.6. 6,370,000원○ 신규취득자수 → 납부재개 포함 ※전달 고지대상자와 비교하므로 실제 취득자수와 상이할 수 있음(초일 취득이 아닌 경우  당월 미고지되면 다음 달 취득자 수에 반영)○ 상실가입자수 → 납부예외 포함. ※해당 자료추출월과 익월을 비교하여 자료추출월에는 고지가 있으나 익월에는 고지가  없는 대상자에 대한 건수를 제공하므로 실제 상실자 수와 상이할 수 있음'
