summary_user: 광주광역시 정보통신보조기기 보급 사업의 보급 대상 제품 목록으로, 제품 한 건마다 유형·품목·제품명과 제품가격, 일반·기초수급자별 개인부담금, 내구연한, 심층상담 여부를 담은 CSV 파일(약 13KB)이다. 보조기기를 신청하려는 장애인이나 복지 담당자가 '이 품목을 받으면 내가 내야 할 개인부담금이 얼마이고 몇 년마다 다시 받을 수 있나'를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 품목명·제품명을 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 광주광역시에서 신체적·경제적 제약으로 정보 접근 및 활용이 어려운 장애인을 대상으로 지원하는 정보통신보조기기 보급 사업의 제품 목록입니다. 해당 목록에는 보급 대상 제품의 명칭, 제조·공급 업체명, 제품 가격, 개인부담금, 내구연한 등의 세부 정보가 포함되어 있습니다. 이 자료는 장애인의 정보 접근성과 디지털 활용 능력을 높이기 위한 정책적 기반 자료로 활용되며, 보조기기 신청자 및 복지 관계자가 제품을 비교·선택할 수 있도록 실질적인 참고 정보를 제공합니다. 또한, 행정기관의 수요예측 및 지원 예산 책정, 제품별 보급 현황 분석, 장애유형별 맞춤형 보조기기 확대 등 효율적인 보조기기 보급 정책 수립을 위한 기초자료로도 활용됩니다.
