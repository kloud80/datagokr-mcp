summary_user: 경기도 내 여성인력개발센터를 센터 한 곳당 한 행으로 담은 시설 목록으로, 시군명·사업주체기관명·개관일자·전화번호·도로명/지번 주소·위도·경도를 담는다. 경력단절 여성이나 구직 여성이 우리 시군에서 가장 가까운 직업훈련·취업상담 센터가 어디인지 찾거나, 분석가가 시군별 센터 분포와 접근성을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 사회복지시설 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표를 맞춰 이어 쓴다.
description_portal: 경기도의 여성 인력 개발센터 현황입니다. 사업주체기관명, 소재지주소(도로명, 지번), 센터전화번호, 개관일자 등의 정보를 제공합니다.이 데이터는 경기도 내 여성인력개발센터의 운영 현황을 담고 있으며, 여성의 직업능력 향상과 취업지원을 위한 지역별 센터 정보를 제공합니다. 주요 항목으로는 시군명, 사업주체기관명, 센터전화번호, 개관일자, 도로명 및 지번주소, 우편번호, 위도·경도 좌표(WGS84) 등이 있으며, 각 센터는 여성 구직자 대상의 직업훈련, 취업상담, 창업교육, 역량강화 프로그램 등을 운영합니다. 개관연도 정보를 통해 센터의 설립 시기 및 지속 운영 여부를 확인할 수 있고, 위치 정보는 센터 접근성 분석, 지역별 취업지원망 구성, 여성고용정책 기획 등에 활용될 수 있습니다. 데이터는 여성가족부 및 지자체 고용복지 부서에서 수집한 공식 공공정보이며, 지역 여성 인력의 경제활동 참여 확대 및 자립기반 마련에 기여할 수 있는 기초 자료입니다.
