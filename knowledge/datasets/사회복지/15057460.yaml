summary_user: 경기도 내 노인요양 공동생활가정을 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 시군·사업장명·인허가일자·영업상태·폐업일자·면적·복지시설 종류·주소·좌표가 들어 있다. 지자체 담당자나 가족이 '우리 시군에 지금 영업 중인 소규모 노인요양 공동생활가정이 어디에 몇 곳 있는가'를 확인하거나, 고령 인구 대비 시설 분포와 입지를 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·위경도로 이름·위치 기준 매칭해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 노인요양 공동생활가정의 인허가 현황을 제공하는 자료로, 치매·중풍 등 노인성 질환으로 일상생활이 어려운 어르신들에게 주거와 급식, 요양, 생활 편의를 제공하는 소규모 복지시설 정보를 담고 있습니다. 주요 항목은 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지면적(LOCPLC_AR), 복지시설종류(WELFARE_FACLT_KIND, WELFARE_FACLT_KIND_NM), 도로명주소(REFINE_ROADNM_ADDR), 지번주소(REFINE_LOTNO_ADDR), 우편번호(REFINE_ZIP_CD), 위도(REFINE_WGS84_LAT), 경도(REFINE_WGS84_LOGT) 등으로 구성됩니다.이 데이터는 노인요양 공동생활가정의 분포와 운영 현황을 분석하는 기초자료로 활용될 수 있으며, 지역별 복지 서비스 수요 파악, 고령화 대응 정책 수립, 시설 입지 분석 및 운영 평가에 유용합니다. 또한 사회복지 행정기관, 연구기관, 지자체 정책 담당자뿐만 아니라 요양 서비스 제공자 및 이용자에게도 실질적인 정보 제공 자료로 활용될 수 있습니다.
