summary_user: 충청북도 내 여성가족복지시설(가정폭력상담소·성폭력상담소·성매매피해 지원기관·청소년쉼터·통합상담소 등)을 시설 한 곳당 한 행으로 담은 목록으로, 구분·시군·시설명·대표자·도로명주소·전화번호를 담는다. 충북 주민이 위기 상황에서 우리 시군의 상담소나 쉼터 연락처를 찾거나, 행정 담당자가 시군별 시설 분포 불균형을 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어 시군 이름이나 시설명·주소 문자열을 맞춰 사회복지시설 공통 마스터나 다른 시설 목록과 연결해야 한다.
description_portal: 이 데이터는 충청북도 내에서 운영 중인 여성가족복지시설의 기본 정보를 정리한 자료로, 상담·보호·지원이 필요한 주민들이 기관을 쉽게 찾을 수 있도록 구성되어 있습니다. 구분별로 가정폭력상담소, 성폭력상담소, 성매매피해 지원기관, 청소년쉼터, 통합상담소 등으로 구체적으로 분류되어 있으며, 각 시설의 소재지, 대표자, 전화번호가 함께 제공됩니다. 이를 통해 폭력 피해자 보호, 청소년 긴급 보호, 여성 긴급전화 지원 등 지역별 필수 복지서비스 접근성을 확인할 수 있습니다. 행정기관은 이 자료를 기반으로 지역 간 서비스 불균형을 파악하여 시설 확대나 상담 인력 배치 계획에 활용할 수 있고, 주민에게는 위기 상황 발생 시 신속하게 도움을 받을 수 있는 기관 안내 기능을 제공합니다.
