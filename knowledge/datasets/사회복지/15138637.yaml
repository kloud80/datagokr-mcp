summary_user: 광주 남구 안에 있는 다함께돌봄센터를 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·소재지·정원·전화번호·데이터기준일자가 들어 있고 파일 크기는 986바이트 남짓이다. 남구에 사는 초등학생 학부모가 집 근처에서 방과후 돌봄을 받을 수 있는 센터와 그 정원·연락처를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 시군구 다함께돌봄센터 현황이나 사회복지시설 공통 마스터와는 시설명·주소를 맞춰 연결해야 한다.
description_portal: 광주광역시 남구 내에 위치한 다함께돌봄센터 현황 및 정보(시설명, 소재지, 정원, 연락처 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 아동청소년과(☎062-607-3545)에서 제공합니다. ※ 다함께돌봄센터란 초등학령기 아동의 공적 돌봄을 확대하기 위해 초등학교 정규 교육 이외의 시간 동안 돌봄서비스를 제공하는 시설로, 만 6세 ~ 만 12세(초등학생) 아동이라면 소득 수준과 관계없이 누구나 이용 가능하며, 다음과 같은 서비스를 제공합니다. - 아동의 안전 보호 및 급식 · 간식 제공- 숙제 지도 · 학습 보충 및 적성 프로그램(음악 , 미술 등) 지원- 체험활동, 문화·예술·체육 활동 지원- 긴급 상황 시 돌봄 지원
