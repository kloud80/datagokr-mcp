summary_user: 공무원 퇴직연금수급자 수를 기준연월별로 연령대·재직년수·거주지역·직장지역(광역·시군구)으로 나눠 집계한 파일로, 전국을 시군구 단위까지 담는다. 연구기관이나 고용정보 기업이 '어느 지역에 사는 퇴직공무원이 어느 지역에서 다시 일하고 있는가'처럼 퇴직 후 재취업 동향과 근로정책 수립에 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역 이름(시군구명) 매핑으로만 이어 붙일 수 있다.
description_portal: 공무원 퇴직연금수급자에 대한 기준연월 및 연령대, 재직년수, 거주지역, 직장지역, 인원수로 발췌한 데이터입니다.국민건강보험공단 보수월액 데이터를 활용하여 직장지역를 추가하였으며,  해당 데이터로 지역별  퇴직 후 근로여부를 판단할 수 있습니다.퇴직공무원의 재취업 동향 파악 및 공공정책 연구기관, 고용정보 관련 민간기업  등이 퇴직공무원을 활용한 근로정책 수립, 재퇴직 공무원의 향후 사회활동 계획에  활용할 수 있습니다.국세청 자료를 함께 활용하여 판단하는 연급지급정지 대상과는 차이가 있을 수 있습니다.
