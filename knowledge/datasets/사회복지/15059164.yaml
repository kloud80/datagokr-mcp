summary_user: 경기도 장애인연금 수급자 수를 기준연도·시군 단위로 집계해 기초생활보장 수급자·차상위계층·차상위초과·시설수급자 같은 소득계층과 심한 장애·심하지 않은 장애·기타 구분별로 나눠 담은 집계 자료입니다. 복지 분석가나 지자체 담당자가 '우리 시군의 장애인연금 수급자 중 기초생활보장 수급자와 차상위계층의 비중은 어떻게 다른가'를 확인하는 데 쓴다. 전역 조인 키가 없어 시군 코드(SIGUN_CD)나 시군명으로 같은 기관의 다른 시군별 통계와 이름·코드를 맞춰 잇는다.
description_portal: '이 데이터는 경기도 장애인연금 수급자 현황을 장애등급별·소득계층별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애인연금은 국민연금 가입 여부와 관계없이 만 18세 이상 중증장애인에게 지급되는 제도적 지원입니다. 데이터에서는 1급·2급·3급(중복 포함) 등 장애등급별 구분과 함께, 소득계층별 현황(예: 기초생활보장 수급자, 차상위계층, 차상위초과, 시설수급자)을 제공합니다.또한 각 계층 내에서 심한 장애(중증), 심하지 않은 장애, 기타 구분으로 수급자 수를 세분화해 제공합니다. 예를 들어, 기초생활보장 수급자 중 중증장애인 연금 수급 현황과 차상위계층 중 경증장애인 수급 현황을 비교할 수 있습니다.이 자료는 경기도 내 소득수준과 장애등급에 따른 연금 수급 불균형을 분석하거나, 복지정책 대상별 지원 강화 방안을 마련하는 데 활용할 수 있습니다. 특히 기초생활보장과 차상위계층 지원의 차이, 시설수급자의 특성 등을 파악할 수 있어 맞춤형 복지 정책 설계에 중요한 근거 자료가 됩니다.'
