summary_user: 전라남도 화순군 안에서 운영 중인 영유아복지시설을 시설 한 곳당 한 행으로 담은 소규모 목록(CSV 약 3.7KB)으로, 시설 구분·시설명·도로명/지번 주소·위도·경도·전화·대표자·종사자 수·정원·현원을 담는다. 화순군 주민이나 보육 정책 담당자가 '우리 동네 가까운 영유아복지시설은 어디이고 정원 대비 현원이 얼마나 찼는가'를 확인하거나 시설 접근성을 지도로 분석하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 좌표로 공간 결합해 쓰며, 사회복지시설 공통 마스터를 참조해 대조한다.
limits: 표준 시설코드 같은 전역 조인 키가 없어 다른 시설 데이터와 정확히 연결하려면 이름·주소 매칭이 필요하다. 범위는 화순군 한 곳뿐이라 다른 시군과 비교하려면 별도 파일을 모아야 하며, 같은 부문의 여성 폭력 피해 보호시설처럼 법적으로 위치가 비공개인 시설은 주소·좌표가 빠질 수 있다.
