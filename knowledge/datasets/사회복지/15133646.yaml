description_portal: 2017년부터 2023년까지 관내에서 발생한 연고 없는 사망자들의 통계적 수치를 체계적으로 집계한 중요 복지 자료입니다. 본 데이터는 시계열 분석이 가능하도록 연도별 발생 건수를 기본으로 하며, 사망자의 연령대와 성별 정보를 세분화하여 포함함으로써 우리 사회의 고립 문제가 어느 계층에서 심화되고 있는지 정밀하게 보여줍니다. 주요 항목인 연령별 정보는 청년 고독사부터 노인 무연고 사망까지의 추이를 나타내며, 남녀별 성별 통계는 성별에 따른 고립 위험도 차이를 분석하는 핵심 지표가 됩니다. 이러한 정보는 동대문구의 1인 가구 지원 정책이나 고독사 예방을 위한 스마트 안부 확인 서비스 등 맞춤형 복지 사업을 설계하는 데 있어 필수적인 정책적 근거로 활용됩니다.
