summary_user: 경상남도 내 가정폭력상담소를 기관 한 곳당 한 행으로 담은 현황 파일로, 기관명·설립연월·직원수·건물면적·전화번호·도로명/지번 주소·위경도·행정동/법정동 코드를 포함한다. 가정폭력 피해자나 지원기관 담당자가 '우리 시군 가까이에 있는 가정폭력상담소는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시군별 상담소 분포와 인력 규모를 비교하는 데 쓴다. 법정동코드(bjd_cd)를 키로 법정동 단위 인구·행정구역 자료나 다른 사회복지시설 목록과 이어 쓰고, 위경도로 지도 위에 다른 시설과 겹쳐 본다.
description_portal: 경상남도 가정폭력상담소 현황을 기관명,  설립연월, 직원수, 건물면적, 전화번호, 주소, 위경도, 우편번호, 행정동 및 법정동 명과 코드 등의 항목으로 제공합니다.
