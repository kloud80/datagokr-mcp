summary_user: 국민연금기금이 연도말 기준으로 보유한 국내주식을 종목별로 정리한 파일로, 종목명과 평가액(억 원), 국내주식 자산군 안에서의 비중(%), 해당 기업 지분율(%)을 평가액이 큰 순서대로 담는다. 분석가나 투자자가 "국민연금이 어느 종목을 얼마나 들고 있고, 어떤 기업의 지분을 몇 % 보유하는가"를 확인하는 데 쓴다. 종목코드 같은 공통 조인 키가 없어서 다른 주식·금융 데이터와는 종목명을 매핑해야 이어 쓸 수 있다.
limits: 실측 컬럼에서 종목코드 등 전역 조인 키가 확인되지 않아, 시세·공시 데이터와 붙이려면 종목명을 직접 매칭해야 하며 동명이나 사명 변경에 주의한다. 연도말 시점의 스냅숏이라 연중 매매나 보유 변동은 알 수 없다.
