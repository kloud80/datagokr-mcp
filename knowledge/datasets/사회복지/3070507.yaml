description_portal: '국민연금기금의 국내주식 투자는 국민연금 설치 2년 후인 1990년에 시작되었습니다.제공하는 데이터는 국민연금의 국내주식 종목별 투자 현황 입니다.연도말 기준 국내주식 투자 종목별 평가액, 자산군 내 비중, 지분율 등 투자 현황에 대한 정보 (단위: 억 원, %)를 제공합니다. 종목별 평가액 기준 내림차순으로 데이터가 정렬되어있습니다.국민연금의 국내주식 투자정보는 국민연금 기금운용본부 홈페이지에서도 연간공시자료로 확인하실 수 있습니다. (알림-기금공시-기금공시 게시판-연간공시)'
