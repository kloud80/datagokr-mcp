summary_user: 경기도 시군별로 장애인이 포함된 기초생활보장 수급가구 수를 기준년도마다 집계해, 총계와 10세 미만부터 80세 이상까지 연령대별 가구 수로 나눠 담는다. 복지 분석가나 시군 담당자가 '우리 시군에서 장애인 포함 수급가구가 어느 연령대에 몰려 있고, 다른 시군과 비교해 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 다른 시군 통계와는 시군명(SIGUN_NM)이나 시군코드 같은 이름·코드 매핑으로만 잇는다.
description_portal: 기초생활보장 장애인 포함 수급가구(시군·연령) 데이터는 경기도 내 각 시군별로 연령대에 따라 분류된 기초생활보장 수급가구 현황을 제공하며, 기준년도, 시군명, 총계(가구수), 연령대별 수급가구수 항목으로 구성되어 있습니다. 본 데이터는 장애인이 포함된 저소득 가구의 연령별 분포를 분석할 수 있어, 복지 사각지대 해소 및 맞춤형 복지정책 수립에 기초자료로 활용됩니다. 특히 세대별로 취약계층이 집중되는 연령 구간을 확인할 수 있어 아동·청소년 지원정책, 중장년층 일자리 및 복지 서비스, 노인 돌봄정책 등 다양한 영역의 정책 설계에 참고가 됩니다. 또한 시군별 비교 분석을 통해 지역 간 복지격차를 파악하고, 균형 있는 사회보장 서비스 제공 전략 마련에 기여할 수 있습니다.
