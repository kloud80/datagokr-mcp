summary_user: 아이돌보미 채용 면접에서 쓰는 표준 평가 항목을 기준연도별로 평가요소와 배점, 평가내용, 평가등급, 등급별 점수 단위로 정리한 전국 단위 파일 데이터(CSV 약 8.8KB)이다. 아이돌봄 서비스 기관 담당자나 분석가가 "아이돌보미 면접에서 어떤 요소를 몇 점 배점으로, 어떤 등급 기준으로 평가하는가"를 확인하거나 연도별 평가 기준 변화를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 평가요소 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 아이돌보미 면접 평가 표준 항목 실적 정보를 제공하는 파일 데이터입니다. 해당 개방 데이터는 기준연도, 평가요소 및 배점내용, 평가내용, 평가등급, 평가점수, 데이터 기준일자의 내용을 확인할 수 있습니다. 특정 항목에서 과도하게 점수 편차가 발생하거나 평가가 편중되는 경향이 있는지를 파악할 수 있어, 평가 체계의 개선에 실질적인 기초가 됩니다. 평가 결과의 연도별 추이를 통해 면접 방식의 변화 양상도 분석할 수 있으며, 이를 바탕으로 평가 기준의 적정성 여부를 재검토할 수 있습니다. 결과적으로 공정하고 효과적인 인재 선발 시스템 구축에 활용될 수 있습니다.
