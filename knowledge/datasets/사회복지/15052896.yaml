summary_user: 공무원연금기금의 자산·부채·자본(기금총액)을 2000년부터 기준년도까지 연 단위로 집계한 표로, 자산은 공공기금예탁·투자유가증권(채권예금·주식·신탁상품·사회간접자본투자)·대출과 주택·시설 사업·지불준비금으로, 부채는 주택임대보증금·차입금·대여학자금수탁금·부담금선수금 등으로 나눠 담는다. 연금 정책 분석가나 연구자가 "공무원연금기금의 규모와 주식·채권 비중이 해마다 어떻게 바뀌었나"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 연도(구분)를 기준으로 같은 기관의 기금 운용 성과 자료나 다른 공적연금 기금 현황과 나란히 놓고 비교하는 방식으로 이어 쓴다.
description_portal: 공무원연금기금 자본 및 자산, 부채 데이터로, 2000년부터 기준년도까지 연 단위로 구분되고 있습니다.자산(계) = 공공기금예탁 + 투자유가증권(채권·예금, 주식, 신탁상품 등, SOC투자) + 사업(연금대출, 학자금대출, 목적대출, 주택사업, 시설운영사업) + 지불준비금 등부채(계) = 주택사업(주택임대보증금, 주택도시기금차입금 등) + 시설운영사업(임대보증금 등) + 기타(재정자금차입금, 대여학자금수탁금, 부담금 선수금 등)1. 기금총액은 자산계에서 부채계를 차감. 2. 기금운용수익에는 전기손익수정이익(손실), 기타포괄손익누계액 등이 포함됨. 3. 목적대부는 생활안정자금 등 사용목적별로 대부한 사업임.
