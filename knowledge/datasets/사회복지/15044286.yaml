summary_user: 2018~2024년 장애인연금 수급자 수를 연도·시도별로 집계한 통계 파일로, 전국을 시도 단위로 담고 수급자를 생계·의료급여 수급자(일반·시설), 차상위 및 교육·주거급여 수급자, 차상위 초과로 나눈다. 분석가나 지자체 담당자가 '우리 시도의 장애인연금 수급자 중 기초생활보장 수급자 비중은 몇 년 사이 어떻게 변했나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 시도별 장애인 등록·급여 통계와는 시도 이름과 연도를 맞춰 붙여 쓴다.
limits: 시도 단위 집계라 시군구별 분포나 개인 단위 수급 정보는 알 수 없다. 표준 행정코드 같은 조인 키가 없어 다른 데이터와 붙일 때는 시도명 표기를 직접 맞춰야 한다. 장애인연금은 중증장애인만 받으므로 경증장애인(장애수당) 현황은 이 데이터에 없다.
