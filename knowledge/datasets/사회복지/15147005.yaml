summary_user: 인증 사회적기업이 둔 지점을 지점 한 건씩 담은 파일로, 기업명·지점명·소재지 주소·설치일·폐지일을 전국 범위로 제공한다. 연구자나 지역 정책 담당자가 '우리 지역에 어떤 사회적기업 지점이 언제 설치됐고 아직 운영 중인가'를 확인하거나 지역별 지점 분포를 분석하는 데 쓴다. 실측 컬럼에 인증번호·사업자번호 같은 공통 조인 키가 없어, 다른 사회적기업 데이터와는 기업명을 맞추는 방식으로만 이어 쓰고 지역 연계는 소재지 주소를 행정구역으로 변환해 붙인다.
description_portal: 위 데이터는 인증 사회적기업의 지점 정보를 제공합니다.사회적기업 기업명, 지점명, 소재지, 설치일, 폐지일 정보를 제공합니다.사회적기업 지점정보를 통해 인증 사회적기업들의 지역별 설치된 지점 정보를 확인할 수 있습니다.관련 정보 및 공개된 사회적기업의 정보들을 통해 사회적기업의 지점에 따른 연구분석 등이 가능합니다.관련 데이터에 문의가 있으시거나 자세한 정보가 필요하시다면 한국사회적기업진흥원 정보화기획팀(031-697-7871)로 연락부탁드리겠습니다. 감사합니다.
