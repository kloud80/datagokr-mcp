summary_user: 광산구 안의 주민편의시설을 시설(기관) 한 곳당 한 행으로 담은 파일로, 기관명·서비스명·주소·전화번호·X/Y 좌표를 포함한다(약 9KB CSV). 주민이나 분석가가 "우리 동네 근처에 어떤 편의시설이 있고 연락처와 위치는 어디인가"를 확인하거나 시설 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어 주소나 좌표로 건물·행정동 데이터에 공간 매칭하거나, 기관명으로 다른 광산구 시설 목록과 이름을 맞춰 잇는다.
description_portal: 주민 생활에 필요한 다양한 시설 및 관련 정보를 테마별로 세분화하여 광산구 각 행정동별로 제공하고 있습니다. 이 데이터는 주민들이 자신의 지역 내에서 필요한 시설을 쉽게 확인하고 접근할 수 있도록 구성되어 있어 생활 편의 향상에 큰 도움이 됩니다. 다만, 2017년 말 기준 이후로는 관련 데이터를 통합하여 수집하는 방식에서 벗어나 각 분야별로 분류하여 공공데이터 포털에 개별적으로 등록하는 형태로 전환되었습니다. 따라서 통합된 형태의 최신 데이터는 2017년 12월 31일을 기준으로 제공되고 있으며, 이후의 자료는 분야별로 나누어 별도로 관리되고 있습니다.
