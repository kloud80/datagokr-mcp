summary_user: 경기도 김포시의 여성복지시설(성폭력·가정폭력 상담시설 등)을 시설 단위로 한 줄씩 담은 목록으로, 시설명·운영기관·도로명/지번 주소·주요사업·비고·데이터기준일을 담는다(csv 507바이트의 소규모 파일). 김포시 주민이나 지원기관 실무자가 '김포에서 가정폭력·성폭력 상담을 받을 수 있는 곳과 운영기관은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소를 기준으로 다른 사회복지시설 목록과 맞추거나 시설명으로 이어 쓴다.
description_portal: 경기도 김포시의 여성복지시설에 대한 정보를 제공합니다. 제공 항목으로는 시설명, 운영기관,소재지주소,주요사업,비고, 데이터기준일자로 구성되어있으며 주소는 지번과 도로명의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 데이터를 통해 성폭력, 가정폭력 등 상담 시설에 대한 정보를 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 가족문화과로 연락주시기 바랍니다.
