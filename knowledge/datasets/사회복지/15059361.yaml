summary_user: 경기도 시군별로 열리는 여성 대상 교육 강좌를 강좌 한 건씩 담으며, 강좌제목·강사·교육기간과 시간·교육장소·운영기관·정원·수강료·접수기간과 방법을 포함한다. 경기도에 사는 여성이 '우리 시군에서 지금 접수 중인 무료 자격증 강좌가 있는지'를 찾거나, 분석가가 시군별 강좌 수와 수강료 수준을 비교하는 데 쓴다. 전역 조인 키는 없으며, 시군명·시군코드(SIGUN_CD)를 이름 또는 같은 기관 코드로 맞춰 경기도의 다른 시군별 데이터나 사회복지시설 공통 마스터와 연결한다.
description_portal: 경기도 내의 시군별 여성교육강좌 및 강의 현황입니다. 강좌제목, 강사명, 교육기간, 연락처, 교육장소 등에 대한 정보를 제공합니다.이 데이터는 경기도 지역에서 여성 대상 교육 강좌 및 강의 현황을 정리한 자료로강좌의 명칭, 교육장소, 운영기관, 강사명, 교육 기간, 교육 시간, 교육 내용, 수강료, 강좌 정원, 접수 일정 및 방법 등을 포함하고 있습니다. 주요 항목으로는 강좌제목, 교육장소, 교육시작일자, 교육종료일자, 강좌내용, 수강료(원), 접수방법구분명 등이 있으며, 이를 통해 여성들의 직업 역량 강화, 자격증 취득, 사회참여 확대를 위한 교육 기회 현황을 파악할 수 있습니다. 데이터는 여성 취업 지원 정책, 지역 평생교육 프로그램 설계, 수요기반 강좌 개설 등에 활용 가능하며, 수강료와 정원 정보는 예산 편성 및 정책 효과 분석에도 기초자료로 사용될 수 있습니다.
