description_portal: '○ 통계개요* 통계명 : 부(父)의 연령별 출생* 통계종류 : 서울시 출생 인구현황을 제공하는 지정ㆍ전수통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 출생,사망,혼인,이혼에 대한 현황을 파악하여, 국가의 인구ㆍ주택ㆍ보건ㆍ사회복지ㆍ교육ㆍ교통 등에 관한 정책수립 및 민간기업의 경영계획 수립에 필요한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도→ 통계청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 부의 연령별 출생아 수○ 용어설명* 출생 : 임신주수와 관계없이 태아가 모체로부터 완전히 배출/만출한 것으로,탯줄의 절단, 태반의 분리와 관계없이 모체로부터 분리후 생명의 증거(호흡, 심장/제대의 박동, 수의근의 명백한 움직임 등)가 있는 경우○ 기타* 출생·사망은 출생자·사망자의 주소지 기준으로 집계한 것임○ 출 처 : 통계청 사회통계국 인구동향과'
