summary_user: 경기도 내 치매·중풍 등 노인성질환 노인을 위한 입소형 노인 요양시설을 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자, 입소정원, 자격 보유 인원과 총 인원, 주소와 좌표가 들어 있다. 정책 분석가가 "어느 시군에 요양시설 입소정원이 부족하고, 정원 대비 자격 보유 인력은 어떤가"를 따질 때 쓴다. 전역 조인 키는 없으므로, 같은 기관 데이터와는 시군코드(SIGUN_CD)로, 다른 데이터와는 사업장명·주소 매칭으로 잇는다.
description_portal: 이 데이터는 경기도 내 노인 요양시설의 인허가 및 운영 현황을 포함하며, 치매나 중풍과 같은 노인성질환으로 일상생활에 도움이 필요한 노인을 위한 입소형 요양시설 정보를 제공합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지면적, 입소정원, 자격소유 인원수, 총 인원수, 도로명 및 지번 주소, 우편번호, 위도 및 경도 좌표 등입니다. 이 데이터는 노인복지정책 수립, 시설 배치의 지역 간 불균형 해소, 장기요양보험제도 운영 등에 활용될 수 있습니다. 특히 입소정원과 자격보유 인원 등의 항목은 시설 운영의 질적 수준을 파악하는 데 유용합니다. 현재 데이터는 2018년 9월 이후 갱신이 중단되었으나, 당시 기준의 지역별 요양시설 현황 파악에는 유의미한 자료입니다. Open API로도 제공되어 관련 시스템 연계가 가능합니다.
