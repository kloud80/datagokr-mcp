summary_user: 전국 국비 지원 청소년 쉼터를 시설 한 곳당 한 행으로 담은 파일 데이터로, 시도·시군구·시설유형·시설명·시설주소·대표전화를 포함하며 검증 시 139행이 수신됐다. 가정 밖 위기 청소년을 돕는 상담자나 지자체 담당자가 우리 지역에 어떤 쉼터가 있고 어디로 연락하면 되는지 찾는 데 쓴다. 시설주소(address)를 조인 키로 삼아 다른 청소년 시설 목록이나 시군구·시도 단위 지역 통계와 이어 쓴다.
