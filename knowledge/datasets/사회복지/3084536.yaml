description_portal: 전국의 청소년 쉼터 현황 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 시설명, 시도, 시군구, 대표전화, 데이터 기준 일자의 정보를 확인할 수 있습니다.가정 밖 청소년 지원을 위해 전국에 설치된 국비 지원 청소년 쉼터 현황 정보(2025.3월 기준)를 제공합니다. 위기청소년 체계 강화에 필수적인 정보로써, 시설명, 시도, 시군구, 주소(소재지), 전화번호 등의 정보를 제공합니다.지역별 쉼터 현황 등을 파악하여 사회복지기관이나 지자체가 연계망을 형성하거나 쉼터 운영 계획을 세우는 데도 근거 자료가 됩니다.
