summary_user: 울산광역시 관내 지역자활센터를 센터 한 곳당 한 행으로 담은 소규모 목록 파일(CSV 882바이트)로, 시설명·소재지·연락처·대표자·이용자 및 직원 현황·지정일자·소관부서를 담는다. 울산에서 자활근로나 취업·창업 지원을 받으려는 저소득층이나 담당 공무원이 '우리 동네 지역자활센터가 어디이고 연락처와 규모는 어떤가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 사회복지시설 데이터와는 시설명이나 소재지 주소를 맞춰 연결해야 한다.
description_portal: 본 데이터는 관내 지역자활센터의 운영 정보이다. 센터별 명칭, 소재지, 연락처, 운영 프로그램, 지원 대상 등의 세부 내용을 포함한다. 지역자활센터는 저소득층의 자활 및 자립을 지원하기 위해 직업 훈련, 창업 지원, 일자리 제공 등의 서비스를 제공하는 복지 기관이다. 해당 자료는 자활 정책 수립, 빈곤 탈출 지원 사업 개발, 복지 서비스 확대 계획에 활용된다. 자활 근로 사업 및 자활 기업 운영을 통해 저소득층에게 일자리를 제공하고 근로 능력을 향상시킨다. 또한 직업 교육 및 기술 훈련을 통해 안정적인 취업을 지원하며, 창업 컨설팅 및 자금 지원을 통해 경제적 자립 기반을 마련한다. 기초생활보장 수급자 및 차상위 계층의 자활 의지를 고취하고 사회 통합을 촉진한다. 본 정보는 정기적으로 업데이트된다.
