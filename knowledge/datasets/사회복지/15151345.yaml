summary_user: 전국 치매안심마을을 마을 단위로 한 줄씩 담은 원천 목록으로, 915행에 설치일·지정일, 우수 지정 여부와 기간, 조사 인원, 운영 항목별 수행 여부가 들어 있다. 치매 환자 가족이나 분석가가 우리 지역에 치매안심마을이 어디에 있고 우수 지정을 받았는지 확인하는 데 쓴다. 상세주소(address)를 키로 다른 시설 데이터와 맞춰 볼 수 있고, 시도·시군구 값으로 지역 통계와 이어 쓰며, 장기요양기관 같은 노인복지시설 자료와 함께 본다.
description_portal: '데이터 기준일 현재 운영 중인 치매안심마을 현황 및 우수 지정 정보를 제공합니다.* 치매안심마을: 치매환자와 가족들의 삶의 질을 높이고 돌봄 부담을 경감하기 위해 치매 친화적 환경을 조성한 지역사회* 우수 치매안심마을: 우수 기준을 충족한 치매안심마을의 경우 심사를 거처 지정, 우수 기간 1년■ 데이터 출처  - 치매안심통합관리시스템■ 데이터 문의  - 중앙치매센터 치매정보시스템운영팀■ 데이터 기준  - 2025년 11월 5일■ 제공 항목  - 치매안심마을명  - 시도  - 시군구  - 상세주소  - 설치일  - 지정일  - 지정번호  - 우수여부  - 우수지정일(우수여부가 Y인 경우)  - 우수종료일(우수여부가 Y인 경우)  - 우수번호(우수여부가 Y인 경우)  - 조사시작일  - 조사종료일  - 조사인원수  - 운영위원회회의여부  - 교육운영여부  - 홍보운영여부  - 프로그램운영여부  - 치매안전망여부  - 환경조성여부* CSV 파일을 엑셀로 실행할 경우 0으로 시작하는 값이 다르게 표시될 수 있습니다.'
