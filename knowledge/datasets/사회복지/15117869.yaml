summary_user: 충남 금산군의 청소년수련시설과 학교 밖 청소년 등 위기청소년 지원기관을 시설 한 곳당 한 행으로 담은 목록으로, 시설구분·이용대상·운영주체·시설규모와 지번·도로명 주소, 위도·경도를 포함한다. 금산군 주민이나 청소년 지원 담당자가 "금산군에 어떤 청소년 시설이 어디에 있고 누가 운영하나"를 확인하는 데 쓴다. 전역 조인 키는 없어 시설명·주소로 매핑하거나 좌표로 지도·다른 시설 데이터와 겹쳐 보며, 지역 단위 청소년 통계와는 금산군이라는 시군구 단위로만 잇는다.
