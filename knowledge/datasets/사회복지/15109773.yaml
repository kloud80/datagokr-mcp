summary_user: 전국 다문화가족지원센터를 센터 단위로 담은 시설 정보 API로, 센터명·설립주체·운영형태·주소·좌표·연락처·운영시간·직원수·제공언어를 필드로 둔다. 다문화가족이나 지원 기관 담당자가 우리 지역에 어떤 센터가 있고 어느 언어로 상담받을 수 있는지 찾는 질문에 쓴다. 도로명주소·지번주소와 위도(lat)로 다른 사회복지시설 마스터나 지도 데이터와 이어 쓰며, 시도명·시군구명은 지역 구분용 필드로 쓴다.
limits: 검증 시점에 API 전체 건수와 수신 행이 각각 1건이어서 전국 센터 목록 전체를 확인하지 못했으므로, 전국 현황 집계에는 쓰기 전에 건수를 따로 확인해야 한다. 조인 키는 주소·좌표 기반이라 코드로 정확히 맞물리지 않고 주소 표기 차이를 보정해야 한다. 호출에는 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
