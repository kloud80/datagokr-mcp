summary_user: 경기도 양주시 관내 노인복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설유형·종류·이름·연락처·소재지 주소·설치일자·관리기관·입소정원을 담는다. 양주시 주민이나 가족이 "우리 동네 근처에 입소 가능한 노인요양·주간보호 시설이 어디 있고 정원이 얼마인가"를 찾거나, 분석가가 시 안의 노인 돌봄 시설 분포를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명이나 소재지 주소를 맞춰 잇는다. 건강보험 장기요양기관 목록이나 사회복지시설 시설코드 자료와 연결하려면 이 방식의 매칭이 필요하다.
limits: 범위는 양주시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다. 공통 시설코드가 없어 장기요양기관 등과 연결할 때는 이름·주소를 매칭해야 하고, 이때 어긋남이 생길 수 있다.
