summary_user: 한국사회보장정보원이 모은 민간 복지서비스를 사업 한 건당 한 행으로 담은 전국 단위 파일(csv, 약 188KB)이다. 기관명·사업명·사업 기간·지원대상·지원내용·신청방법·제출서류와 생애주기·가구상황·관심주제 분류가 들어 있어, 국민이나 상담 실무자가 '우리 가구 상황과 생애주기에 맞는 민간 지원사업은 무엇이고 어떻게 신청하나'를 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명·사업명 같은 이름이나 생애주기·관심주제 분류값을 맞춰서만 이어 쓴다.
description_portal: 한국사회보장정보원에서 제공하는 민간 복지서비스에 대한 정보입니다. 전국민이 받을 수 있는 다양한 복지 서비스를 한눈에 확인하고, 나에게 해당되는 복지 서비스를 한 번에 조회할 수 있습니다.데이터 구성은 기관명, 사업명, 사업시작일, 사업종료일, 사업목적, 지원대상, 지원내용, 신청방법, 제출서류, 기타, 생애주기, 가구상황, 관심주제 항목으로 구성되어 있습니다. 이 데이터를 활용하여 민간 복지서비스의 서비스 유형별 특성, 지원대상별 분포, 그리고 생애주기별 복지 수요 측면의 분석이 가능합니다.
