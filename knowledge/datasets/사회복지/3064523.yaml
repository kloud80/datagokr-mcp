summary_user: 공무원연금공단 지부가 관리·운영하는 봉사단체 현황을 광역자치단체(지부) 단위로 집계한 파일로, 지역별 관할 기초지자체 수, 등록 봉사단 수, 회원 수를 담는다(전국 범위, 약 521바이트의 소형 CSV). 퇴직 공무원·연금수급자 중심 봉사단체가 어느 지역에 얼마나 있고 참여 인원이 얼마인지 알고 싶은 공공기관 사회공헌 담당자나 분석가가 지역 간 규모를 비교하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없으므로 광역지자체 이름을 매핑해 지역별 연금수급자 통계 등 다른 직역연금 통계와 이어 쓴다.
description_portal: '공무원연금공단 각 지부에서 괸리·운영중인 봉사단체 현황을 나타낸 데이터입니다. 지역별로 관할 기초지자체수, 등록된 봉사단체 수, 활동인원을 포함하며, 지역별 사회공헌활동의 규모와 분포를 파악할 수 있습니다.지역별 봉사활동 운영 및 참여수준을 확인하거나 연금수급자 중심의 단체 운영 동향을 모니터링하는데 활용할 수 있으며, 퇴직 공무원의 사회적 역할 확대, 공공기관의 사회공헌 정책 수립 등에 활용될 수 있습니다.지역 : 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주(광역자치단체 기준)'
