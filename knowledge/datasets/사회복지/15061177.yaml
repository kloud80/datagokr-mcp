summary_user: 대전광역시 내 아동복지시설·기관을 시설 한 곳당 한 행으로 담은 파일로, 사업종류·시설명·설립년월일·소재지·정원·전화번호와 행정구역 코드·명칭, X·Y 좌표를 포함한다(약 5KB CSV). 보호자나 복지 담당자가 '우리 동네(구·행정동)에 어떤 아동복지시설이 있고 정원과 연락처는 어떤가'를 확인하거나, 분석가가 시설 분포와 설립 시기를 파악하는 데 쓴다. 전역 조인 키는 확인되지 않았으며, 시군구코드·행정동코드나 좌표를 이용해 행정구역 단위 통계나 지도 자료와 맞추거나 시설명으로 다른 사회복지시설 목록과 대조해 이어 쓴다.
