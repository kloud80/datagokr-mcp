description_portal: 본 데이터는 대구광역시 수성구 관내에서 운영되는 장애인 근로사업장 및 사업 프로그램의 현황을 정리한 자료로,  해당 자료는 장애인의 경제적 자립 지원 및 사회참여 기회를 제공하는 사업장의 분포와 규모, 프로그램 특징을 한눈에 확인할 수 있게 설계되었다. 이를 통해 장애인 고용 정책 평가, 민원 및 복지 상담 서비스 개선 등에 활용 가능하다. 사회서비스 연계 정책 수립, 공공·민간 협력 모델 모니터링의 기초자료로 활용할 수 있다. 수성구청은 정기적으로 자료를 갱신하며, 본 데이터는 복지부서, 장애인단체, 연구기관, 지역 주민 등이 장애인 고용 및 복지정책 개발에 기여할 수 있는 기초 정보로 제공된다.
