summary_user: 인천광역시 군·구별 다문화가족지원센터(가족센터)의 센터명, 운영기관, 센터유형, 주소, 센터장, 전화번호를 센터 한 곳당 한 행으로 담은 소규모 CSV 현황 목록(약 1.7KB)이다. 인천에 사는 다문화가족이나 지원 실무자가 '우리 군·구 가족센터는 어디이고 어느 기관이 운영하며 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 사회복지시설 데이터와는 센터명·주소 문자열을 맞춰서만 연결한다.
description_portal: '1. 목록명: 인천광역시_다문화 가족지원센터 현황(가족센터 현황)2. 키워드: 다문화, 다문화가족지원센터, 가족센터, 주소, 센터장, 전화번호, 센터명, 운영기관3. 데이터설명: 인천광역시 다문화가족지원센터(가족센터) 현황에 대한 데이터를 제공하고 있습니다. 10개 군구 다문화가족지원센터(가족센터)의 센터명, 운영기관, 센터유형, 주소, 센터장, 전화번호 등의 항목이 포함되어 있습니다. 이를 통해 인천광역시의 다문화가족지원센터(가족센터) 현황 정보를 확인할 수 있습니다. 다문화가족지원센터(가족센터)에서는 다문화가족의 안정적인 정착과 사회통합을 지원하기 위해 한국어교육, 상담, 통역, 문화이해증진 등 다양한 프로그램을 진행하고 있습니다. 다문화가족지원센터(가족센터) 현황 데이터는 연간 업데이트 되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, CSV 형식으로 제공됩니다.-가족센터(다문화가족지원센터) 현황 인천시 홈페이지( https://www.incheon.go.kr/welfare/WE020509)'
