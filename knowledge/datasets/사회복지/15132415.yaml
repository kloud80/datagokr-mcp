summary_user: 청소년국제교류네트워크의 국제교류 지원 사업을 공고(사업) 한 건 단위로 담는 전국 범위 원천 데이터로, 사업명·모집 및 신청 기간·사업 기간·파견기간·주요활동·국내 여부·서류 및 최종 합격일·사전·사후 설문 일정이 들어 있다. 청소년이나 학부모가 지금 신청할 수 있는 해외 파견 교류 프로그램과 그 모집 마감·합격 발표 일정을 확인하거나, 기관이 프로그램별 일정과 활동 내용을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명 같은 이름 매핑이나 같은 기관(성평등가족부) 청소년 활동 데이터와 나란히 보는 방식으로만 잇는다.
description_portal: 청소년 국제 교류 네트워크 국제 지원 정보에 관련된 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 모집시작일자, 사업시작일자, 사업마감일자, 파견기간내용, 주요활동내용, 국내여부, 사전설문 시작 및 종료 일자, 사업명, 서류 합격 일자, 최종합격일자 등의 내용을 확인할 수 있습니다.국제 교류 활동의 전반적인 운영 정보를 파악하여 해외 프로그램에 대한 관심을 높이고 접근성을 개선하는 데 활용할 수 있습니다. 사전·사후 설문 일정까지 포함되어 있어 참가자의 만족도 분석과 프로그램 효과 측정에도 적합합니다. 청소년 국제 교류 프로그램 비교 및 참가자 대상 안내자료 제작에 활용되며, 외국어 교육기관이나 국제화 교육 콘텐츠 기획 시에도 참고할 수 있습니다.
