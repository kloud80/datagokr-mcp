summary_user: 공무원연금공단이 관리하는 신규 연금수급자를 퇴직연금(정상·조기), 유족연금(퇴직승계·유족승계·재직중사망), 장해연금으로 나눠 기준년도의 월별 또는 성별 인원으로 담은 전국 단위 집계 파일(csv, 639바이트)이다. 연금 정책 분석가나 연구자가 '한 해 동안 새로 공무원연금을 받기 시작한 사람 중 조기연금 비중은 얼마이고 월별로 어떻게 달라지는가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 구분(월·성별) 이름을 맞추거나 같은 공단의 다른 연금 통계와 나란히 놓는 방식으로만 잇는다.
description_portal: '공무원연금공단에서 관리하는 신규연금 수급자(퇴직연금, 유족연금, 장해연금) 현황 데이터로, 기준년도 현황을 월별 또는 성별로 구분하여 제공하고 있습니다.퇴직연금은 정상연금 및 조기연금으로, 유족연금은 퇴직승계, 유족승계, 재직중사망으로 구분되어 있습니다.1. 조기연금 : 연금지급개시연령 도달전 감액 연금수급자2. 유족연금 신규자 중 퇴직연금수급자가 사망하여 유족이 승계한 인원은 퇴직승계에 포함3. 유족연금 신규자 중 재직중사망에는 동순위유족(위임자포함) 포함4. 수급대기자 : 연금지급개시연령 미도래자'
