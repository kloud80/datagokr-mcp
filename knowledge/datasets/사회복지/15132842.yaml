summary_user: 청소년 자기도전포상제 포상담당관을 건별로 담으며, 담당관이 속한 시설 일련번호(fcltySn), 책임포상담당자 여부, 등록일시를 전국 범위로 제공한다. 포상제 운영기관이나 분석가가 특정 시설에 책임 포상담당자가 지정돼 있는지, 언제 등록됐는지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 기관의 포상제 시설 정보와 시설물일련번호 같은 기관 내부 코드로만 연결된다.
limits: 담당자 이름·연락처·시설명·주소는 없어 이 데이터만으로는 시설이나 지역을 특정할 수 없고 공간 분석도 되지 않는다. 다른 기관 데이터와 잇는 공통 키가 없으며, 이벤트성으로 생성된 뒤 바뀌지 않는 성격이라 교체 이력이 계속 갱신된다고 보기 어렵다.
