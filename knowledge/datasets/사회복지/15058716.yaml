summary_user: 근로복지공단이 선정·관리하는 전국 산재재활 위탁기관(직업훈련기관, 재활스포츠 위탁기관, 심리재활프로그램 위탁기관)을 기관 한 곳당 한 건으로 담은 목록이며, 기관명·기관구분·소재지 주소·전화·팩스·홈페이지 주소와 관할 지사를 함께 제공한다. 산재 근로자나 가족이 "우리 집 근처에서 재활스포츠나 심리재활 프로그램을 받을 수 있는 위탁기관은 어디이고, 담당 지사는 어디인가"를 찾을 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 기관명이나 주소를 맞춰 붙여야 하고, 같은 공단 데이터와는 관할 지사코드(gwanriJisaCd)·지사명으로 묶는다.
limits: 사업자번호 같은 전역 식별자가 없어 기업·기관 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
