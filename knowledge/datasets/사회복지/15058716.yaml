description_portal: 본 API는 산업재해보상보험법에 따라 산재 근로자의 원활한 사회복귀를 지원하기 위해 근로복지공단에서 선정하여 관리하는 전국 산재재활 위탁기관의 통합 정보를 제공합니다. 제공되는 데이터는 산재 근로자가 자신의 상황에 맞는 재활 서비스를 적기에 이용할 수 있도록 돕는 직업훈련기관, 재활스포츠 위탁기관, 심리재활프로그램 위탁기관의 현황 정보로 구성되어 있으며, 각 기관의  명칭과 기관 구분을 비롯하여 도로명 주소를 포함한 상세 소재지 정보와 대표 전화번호, 팩스 번호 등을 망라하여 실질적인 이용 편의성과 접근성을 높였습니다. 특히 개별 기관의 기본 정보뿐만 아니라 해당 기관을 관할하는 근로복지공단의 지역본부 및 지사 정보와 관리 코드를 함께 수록함으로써 이용자가 행정적인 문의나 관련 절차를 병행하여 확인하는 데 불편함이 없도록 설계되었으며, 일부 기관의 경우 공식 홈페이지 주소 정보가 포함되어 있어 기관별 상세 프로그램에 대한 깊이 있는 정보를 탐색할 수 있는 경로를 제공합니다. 민간 영역에서는 내 주변 재활기관 찾기 지도 서비스나 산재 보험 혜택 안내와 연계된 맞춤형 큐레이션 서비스 등 창의적인 애플리케이션 및 플랫폼을 개발할 수 있는 기초 자료로 폭넓게 활용될 수 있습니다.
