summary_user: 공무원연금공단이 종합재해보상 업무에 쓰는 표준요양기관 목록으로, 기관별 한 행에 요양기관명·주소·표준요양기관 구분 코드·요양종별(종합병원, 상급종합병원 등) 코드를 담으며 범위는 전국이고 위치는 개별 주소 단위다(CSV 약 8.6MB). 공무원 재해보상 분석가가 "우리 지역에서 공무원 재해 요양을 받을 수 있는 종합병원급 기관이 몇 곳이고 어디에 있는가"처럼 병원군 분류나 지역별 의료 접근성을 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 요양기관 데이터와는 기관명·주소 매칭이나 같은 공단의 코드로만 잇고, 지역별 집계는 주소를 행정구역으로 바꿔 지역 단위 수급자 통계에 붙여 쓴다.
description_portal: 공무원연금공단에서 종합재해보상 관련 업무를 수행함에 있어 표준요양기관 코드체계 및 관련 정보를 체계적으로 관리하기 위해 구축된 표준요양기관 목록 자료입니다.해당 자료는 요양기관명, 요양기관 주소, 표준요양기관 구분 코드, 요양종별 코드 등의 기본 정보를 포함하고 있으며, 요양기관 분류와 재해보상 업무 연계를 위한 기초자료로 활용됩니다.요양기관은 종합병원, 상급종합병원 등으로 구분되며, 실제 요양 승인 및 통계 제공 시 기관의 규모 등의 특성을 기준으로 병원군 분류, 지역별 의료 접근성 분석 등에 활용할 수 있습니다.※ 기준일자에 미폐업 상태이며 유효한 데이터만 발췌되었으며, 관리 시점의 테이블 데이터로 실제 정보와 상이할 수 있습니다.
