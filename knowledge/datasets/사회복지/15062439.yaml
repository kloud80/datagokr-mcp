summary_user: 통영시 관내 노인복지시설(경로당 등 여가시설, 양로원 등 주거시설, 요양원 등 의료시설, 주야간보호·재가장기요양기관, 노인일자리전담기관 등)을 시설 한 곳당 한 행으로 담은 파일로, 시설 종류·시설명·전화번호·종사자수·운영주체·관리기관·도로명주소를 싣는다. 통영에 사는 보호자가 집 근처 주야간보호시설이나 요양원이 어디 있는지, 법인 운영인지 개인 운영인지, 종사자는 몇 명인지 찾을 때 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록이나 다른 시군구 노인복지시설 자료와는 시설명·주소로 맞춰 이어야 한다.
limits: 시설코드 같은 공통 식별자가 없어 다른 데이터와 붙일 때 시설명·주소 문자열 매칭에 의존해야 한다. 범위는 통영시 한 곳뿐이므로 경남이나 전국 비교에는 다른 시군구 파일을 따로 모아야 한다.
