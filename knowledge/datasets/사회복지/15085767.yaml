description_portal: 서울글로벌센터 접수유형별 언어별 상담실적 데이터는 월별(년월 기준)로 기관/유형별 상담을 언어별로 세분화하여 집계한 통계자료입니다. 한국어, 영어, 일본어, 중국어, 베트남어, 타갈로그어, 몽골어, 프랑스어, 러시아어, 우즈벡어, 태국어, 네팔어, 인도네시아어, 파키스탄어(우르두어), 아랍어, 스페인어 및 기타언어별 상담 건수를 제공하고, 합계 항목을 통해 전체 상담 건수를 파악할 수 있습니다. 이를 통해 각 접수유형별로 어떤 언어권 이용자의 상담 수요가 높은지 분석할 수 있어, 채널별·언어별 상담 전략 수립과 다국어 상담 인력·자원 배분의 근거 자료로 활용될 수 있는 데이터입니다.
