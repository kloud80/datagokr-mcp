summary_user: 부산광역시 사상구 어린이집을 한 곳씩 담은 건별 현황으로, 어린이집명·유형·운영/폐지 여부, 주소·연락처, 보육실 수·면적, 놀이터·CCTV 수, 보육교직원 수, 정원과 현원, 통학차량 운영 여부, 인가일자, 위도·경도를 담는다. 사상구에 사는 부모가 집 근처에서 정원 대비 현원이 여유 있고 통학차량을 운영하는 어린이집을 찾거나, 분석가가 동네별 보육 수급을 따질 때 쓴다. 실측 컬럼에 어린이집코드 같은 전역 조인 키가 없어 다른 보육 데이터와는 어린이집명·주소 이름 매칭이나 좌표(위도·경도) 기반 공간 결합으로만 이어 쓴다.
limits: 원시시스템 한계로 구·군별로만 조회되어 부산시 전체를 한 번에 받을 수 없고, 다른 구는 각 구의 별도 데이터를 모아야 한다. 공통 코드가 없어 평가·보육료 공시 등 다른 어린이집 데이터와 연결할 때 이름·주소 매칭 오류에 주의해야 한다.
