description_portal: '한국사회보장정보원에서 1년 주기로 제공하는 통계자료로, 차상위 및 한부모가족 수급자 수와 사업별 바우처 이용자 수, 이용금액에 대한 정보를 담고 있습니다.   데이터 구성은 각 시도마다 특성별(성별, 연령)로 다시 구분하여 차상위 및 한부모가족 수급자수, 바우처 이용자수, 산모신생아건강관리지원 사업에 대한 이용자수와 이용금액, 지역사회 서비스 투자 사업에 대한 이용자수와 이용금액, 가사간병 방문지원 사업에 대한 이용자수와 이용금액, 장애아동가족지원 사업 중 발달재활서비스에 대한 이용자수와 이용금액, 장애아동가족지원 사업 중 언어발달지원에 대한 이용자수와 이용금액, 발달장애인지원 부모심리상담 사업에 대한 이용자수와 이용금액, 장애인 활동지원 서비스 사업에 대한 이용자수와 이용금액 항목으로 구성되어 있습니다.   -수급자 수: 사회보장정보시스템(행복e음)에 등록된 차상위 및 한부모가족 수급자를 연도말 기준으로 집계 *중복제거 기준 : 기준년월별로 다수에 자격을 보유한 수급자의 경우 한명으로 집계-바우처 이용자수: 수급자가 기준년도 1월에서 12월에 바우처 서비스를 이용한 수급자를 중복제거 후 집계  *중복제거 기준: 연간 다수에 서비스를 이용한 수급자의 경우 한명으로 집계(※ 개별 바우처 이용자수의 합계와 다름을 유의) -개별 바우처 이용금액: 기준년도 1월에서 12월까지 기간 중 각 바우처 서비스를 이용한 금액으로 본인부담금과 정부지원금을 합산해 집계   지역별, 성별별, 연령대별 차상위 및 한부모가족 수급자수의 분포를 확인하거나 사업별 이용자수와 이용금액 및 지역 및 특성별 분포를 확인하고자 할 때 활용하실 수 있습니다.'
