summary_user: 인천 중구(영종구) 관내 농업협동조합 지점의 이름, 지번·도로명 주소, 전화번호를 지점 1곳당 1행으로 담은 작은 목록 파일(csv, 530바이트)이다. 주민이나 방문객이 '집 근처, 영종도나 중구 도심에 있는 농협은 어디이고 연락처가 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 기관 코드는 없어서, 다른 데이터와는 협동조합명이나 주소 문자열을 맞춰 연결해야 한다.
description_portal: 중구 농업협동조합에 관련한 자료입니다. 중구에 위치하고 있는 11개의 농협의 자료를 위치, 전화번호, 중구농협 이름 등의 정보를 확인할 수 있습니다.중구 시내에 도심에는 6개의 중구농협이 위치하고 있으며 5개는 영종도에 위치하고 있습니다.옹진농협은 중구 시내에 위치하고 있습니다, 옹진 구청이 중구 시내에 위치하고 있기 때문입니다.중구 농협 본점은 운남동에 위치하고 있습니다.  중구 용유에는 중구 농협이 하나 위치하고 있습니다. 중구 농업협동조합 관련한 간단한 기본적 내용을 포함하고 있으니 궁금한 사항에 대해 확인하실 수 있습니다
