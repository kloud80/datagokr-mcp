summary_user: 경기도 내 수련원에서 단체급식을 제공하는 집단급식소를 사업장 한 곳씩 담은 건별 목록으로, 인허가일자·영업상태·폐업일자, 소재지 면적과 시설 규모, 도로명·지번 주소와 WGS84 위경도를 포함한다. 수련원 급식 위생을 점검하는 담당자나 분석가가 "우리 시군에 영업 중인 수련원 급식소는 몇 곳이고 어디에 있나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 사업장명·주소를 맞춰 연결하고, 좌표로 지도 데이터와 겹쳐 본다.
description_portal: 이 데이터는 경기도에서 수련원 내의 단체급식을 제공하는 경기도 내 집단급식소(수련원) 현황을 정리한 자료로, 사업장별 인허가 정보와 위치, 시설 규모 및 위생 관련 사항을 포함하고 있습니다. 주요 항목에는 사업장명, 인허가일자, 영업상태, 도로명주소 및 지번 주소, 우편번호, WGS84 위도, 경도 좌표 등이 기록되어 있습니다. 이 자료는 시설 목록정보를 제공하여 수련원 급식시설의 분포 파악, 지역별 집단급식 인프라 분석, 시설 규모 비교, 행정적 인허가 관리 등 다양한 연구와 정책 수립에 기초자료로 활용할 수 있습니다.
