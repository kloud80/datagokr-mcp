summary_user: 전국 시도별로 전체 어린이집 수와 그중 평가를 마치고 인증을 유지하는 어린이집 수를 함께 담은 시도 단위 집계표이며, 392바이트 크기의 CSV 파일 하나로 활용신청 없이 받는다. 보육 정책 담당자나 분석가가 '우리 시도 어린이집 가운데 평가인증을 유지하는 비율이 다른 시도보다 높은가'를 비교할 때 쓴다. 전역 조인 키는 없고 시도명(구분)만 있어서, 다른 시도별 보육·인구 통계와는 시도 이름을 맞춰 붙여 써야 한다.
description_portal: 해당 데이터는 한국영유아보육·교육진흥원에서 관리하는 시도별 어린이집 평가인증 유지 현황을 제공하는 통계 자료입니다. 전국 각 시도를 기준으로 전체 어린이집 수와 그중 평가를 완료하고 인증을 유지하고 있는 어린이집 수가 함께 제시되며, 어린이집의 평가인증 진행 현황을 수치로 확인할 수 있습니다. 데이터는 지역 단위로 보육기관의 평가 상태를 비교하거나 분포를 분석하는 데 사용될 수 있으며, 정량적인 구조로 구성되어 있어 연도별 또는 지역별 변화 추이 분석에도 활용이 가능합니다. 컬럼은 시도명, 전체 어린이집 수, 평가완료 어린이집 수로 구성되어 있으며, 표 형식의 단순한 집계 자료입니다.
