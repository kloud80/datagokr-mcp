summary_user: 공무원연금공단이 기금으로 보유한 국내 주식 중 평가액 기준 상위 종목(2025년부터 10개)을 종목별로 담은 특정 시점 파일로, 종목명·평가액(억원)·자산군 내 비중·시장비중을 제공하며 ETF는 제외된다. 연금 기금 운용을 살피는 국민이나 분석가가 '공무원연금이 국내 주식에서 어떤 종목에 얼마나 집중 투자하고 있나'를 확인하는 데 쓴다. 전역 조인 키나 종목코드가 없어 다른 주식·금융 데이터와는 종목명을 이름 매핑해 이어 쓰고, 국민연금·사학·군인연금의 국내 주식 보유 현황과 종목 단위로 비교하는 데 쓴다.
limits: 상위 종목만 담겨 전체 국내 주식 포트폴리오나 하위 종목 보유 내역은 알 수 없고, 특정 시점 기준이라 평가액·비중은 이후 달라질 수 있다. 종목코드가 없어 다른 데이터와 연결하려면 종목명 매핑이 필요하다.
