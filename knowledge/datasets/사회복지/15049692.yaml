description_portal: 공무원연금공단이 자금운용사업으로 진행하고 있는 국내 주식 투자 현황 중 평가액 기준 상위 종목(2025년부터 10개 제공)에 대한 정보를 제공하는 데이터입니다.해당 데이터는 종목명, 평가액, 자산군 내 비중  등의 항목으로 구성되어 있으며, 공단이 보유한 국내 개별 종목 투자 내역 중 상위 종목만을 포함합니다.이 자료는 특정 시점을 기준으로 한 데이터로, 종목별 평가액이나 비중은 달라질 수 있으며, 해당 정보는 기금운용 현황, 투자위험 분산 검토 등에 활용될 수 있습니다.* 국내 주식 ETF(상장지수펀드)는 본 데이터에서 제외되었습니다.
