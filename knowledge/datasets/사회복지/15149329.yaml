summary_user: 아이돌봄 통합지원 서비스의 현장모니터링 결과를 기준연월·센터(상위센터 포함)·서비스별로 집계해, 기준월 목표 가구 수와 양육지원인력(돌보미) 점검등급 1~4등급별 인원 수를 담은 전국 단위 집계 자료다. 아이돌봄 제공기관 관리자나 정책 분석가가 "우리 지역 센터의 돌보미 중 상위·하위 등급 비중은 얼마이며 월별로 어떻게 변하는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 센터명·상위센터명 같은 이름 매핑이나 기준연월로만 연결한다.
limits: 돌보미 개인별 평가 결과나 평가 항목별 점수는 없고 센터 단위 등급별 인원 수만 담으며, 공간 좌표가 없는 비공간 자료다. 표준 기관 코드가 없어 시설 마스터 등과 이어 쓸 때는 센터명 표기 차이를 직접 맞춰야 한다.
