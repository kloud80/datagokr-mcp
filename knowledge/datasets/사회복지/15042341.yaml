summary_user: 전국 가족센터 가운데 가족상담 우수기관으로 인증된 센터를 기관 한 곳당 한 행으로 담은 목록으로, 지역·센터명·인증년도·인증기간·주소·전화번호가 들어 있으며 포털 설명상 104개 기관이 수록돼 있다. 가족 고충·부부·부모자녀 상담을 받을 만한 우리 지역의 인증 우수 가족센터가 어디인지, 인증이 언제까지 유효한지를 찾는 국민이나 지역별 우수기관 분포를 보는 정책 분석가가 쓴다. 전역 조인 키가 없어 다른 가족센터·사회복지시설 목록과는 센터명이나 주소를 맞춰 이어야 한다.
description_portal: 전국 가족센터(구 건강가정다문화가족지원센터) 중 가족상담 우수기관으로 인증된 센터에 대한 정보를 제공하고 하며, 주요역할은 가족특성에 따른 고충상담, 개인 및 가족상담, 집단상담, 다문화 가족 통합상담, 생애주기별 부부상담, 청소년기 부모자녀상담, 직장맘/대디 상담, 임신출산양육 상담, 양육비 상담 등을 수행합니다. 데이터  제공 항목은 순번, 지역, 센터명, 인증년도, 인증기간, 주소, 전화번호 등이며, 총 104개의 기관 정보가 수록되어 있습니다. 이 데이터를 활용하여 가족상담 서비스의 질적 향상과 우수기관의 사례 공유를 위한 연구 및 정책 수립에 활용될 수 있습니다.
