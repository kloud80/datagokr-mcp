description_portal: '광역시에서 운영하는 봉안시설은 주로 고인의 유골을 보관하는 공간으로, 지역 주민들이 이용할 수 있도록 공공시설로 운영됩니다. 이러한 시설은 시민들의 장례문화를 지원하고, 편리한 유골 보관 및 관리 서비스를 제공하는 역할을 합니다. 시설에는 봉안당, 추모공원 등이 포함됩니다.대구광역시 동구의 봉안시설에 대한 데이터는 봉안시설의 관리추제, 봉안시설의 전화번호, 부지, 연면, 총 봉안능력, 기 봉안구수의 현황을 제공하고 있습니다.이용 절차 및 비용공설 시설: 사용자는 지자체에 사전 신고 후 이용, 사용료와 관리비는 주민·비주민에 따라 다르게 책정됨사설 시설: 별도 신고 의무는 없으나 투명한 요금 게시·운영이 법적으로 요구됨'
