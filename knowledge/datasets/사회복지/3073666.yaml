summary_user: 노인일자리사업 참여노인 실태조사의 응답자별 원시 설문 자료로, 응답자 식별번호(id)·가중치(wt)와 함께 응답자 특성(S 계열)·일자리 참여 관련(A 계열) 문항이 코드화된 변수로 담긴 전국 단위 비공간 자료다. 연구자나 정책 담당자가 '노인일자리 참여자의 생활 실태와 복지 수요는 어떠한가'를 가중치를 적용해 분석할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 직접 결합할 수 없고, 변수명·코드 매핑을 통해 과거 회차 실태조사와 문항 단위로 맞춰 쓰는 정도로만 연결된다.
limits: 전국 단위 비공간 조사여서 시도·시군구 같은 지역 통계나 시설 데이터와 연계할 수 없다. 변수명이 문항 코드(S0, A1A1 등)로만 되어 있어 해석하려면 코드북이 필요하다.
