description_portal: '보건복지부에서 2018년~2024년까지 시도별, 취학 전 개월수별에 따라 가정양육수당을 지급 받은 아동 수 정보를 제공하고 있습니다. * 보육통합정보시스템 및 행복e음 등록 자료 활용 : 본 통계는 보건복지부가 관리하는 보육통합정보시스템과 *행복e음(사회보장정보시스템)*에 등록된 행정자료를 기반으로 작성 * 가정양육수당：가정양육수당은 만 0세부터 취학 전 아동 중 어린이집이나 유치원 등 공식 보육기관을 이용하지 않고, 보호자에 의해 가정에서 양육되는 아동에게 지급되는 현금성 복지급여. 소득계층 구분 없이 어린이집 또는 유치원 미이용 아동에 대하여 국가와 지방자치단체에서 연령별 차등 가정양육수당 지원'
