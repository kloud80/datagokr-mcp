summary_user: 전주시 안의 장애인복지시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설 구분(대·소), 도로명·지번 주소, 위도·경도, 법인명, 입소자·종사자 정원과 현원을 함께 싣는다. 전주시에서 집 근처 장애인 거주·이용시설이 어디 있는지, 시설별 정원 대비 현원이 얼마나 찼는지 확인하려는 장애인 가족이나 복지 분석가가 쓴다. 전역 조인 키는 없어 시설명·주소로 다른 시설 목록과 맞추거나 위도·경도로 지도·생활권 데이터에 겹쳐 쓴다.
description_portal: '전북특별자치도 전주시 내 장애인복지시설 현황을 제공하며 시군구, 시설명, 시설구분, 주소, 전화번호 등을 제공합니다.항목 : 시군구, 시설명, 시설대구분, 시설소구분, 도로명주소, 지번주소, 위도, 경도 등제공부서 : 장애인복지과'
