description_portal: 1. 개요 연도별 예금보험공사 사회공헌활동 실시 내역입니다.기업의 사회적책임 이행이 중요시됨에 따라, 06년에 예보사랑 나눔운동을 도입하고, 행복예감기금을 조성하여 사회공헌활동을 지속 실시하였습니다. 11년에는 사회공헌 기본계획을 수립하여 추진사업을 늘리는 등 사회공헌활동을 확대 시행하였습니다. 14년 사회공헌 관련 임직원 공감대 형성을 위해 사내 공모전을 개최하여 행복예감이라는 사회공헌브랜드를 런칭, 지속 운영하고 있습니다.2. 내용 사회공헌활동에 관한 내용으로 연도별 실시내역의 데이터 입니다.3. 단위 (회) 실시횟수 (명) 참여자
