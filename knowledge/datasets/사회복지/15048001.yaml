summary_user: 부산 동구의 장애인일자리 사업 현황을 연도·기관별로 정리한 집계 파일로, 기관유형·기관명별 배정인원과 1~12월 월별 수치를 담는다(약 2.4KB의 작은 CSV). 지역 복지 담당자나 분석가가 '동구에서 어느 기관에 장애인 일자리가 몇 명 배정됐고 월별로 어떻게 운영됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 기관명으로 맞춰 이어 써야 한다.
description_portal: '만18세 이상 등록장애인 중 보조인 없이 담당업무 수행가능한 자 일반형 전일제(47명/일8시간) : 행정도우미/복지서비스 지원요원  일반형 시간제(42명/일4시간) : 행정도우미/복지서비스 지원요원  복지형일자리(32명/주14시간) : 사서보조/우편분류/환경정리/복지서비스 보조  발달장애인 요양보호사 보조-지적·자폐성 등 발달장애인 참여자들을 요양보호사의 업무보조로 배치하여 특화된 직무능력 습득을 돕고 일자리 경험 제공문화예술활동 일자리-문화예술 교육, 훈련, 공연 및 전시작품 활동 등을 근무로 인정복지형 일자리-장애인 활동지원사업  부정수급 모니터링 등, 환경정리, 장애인전용주차 계도 및 홍보, 정리 및 수납 , 사회서비스 모니터링 등발달장애인 휠마스터 사업- 척수장애인의 보조기구(휠체어 등) 세척 · 수리 서비스 실시장애인 일자리사후관리 모니터링-장애인 취업연계 후 직장 환경·직무적응 애로사항 파악 및 사후이력 관리 여성장애인 네일서비스단 -여성장애인 네일리스트 양성, 행정기관・공공시설 등 서비스 제공정신장애인회복파트너- 시설이용 동료장애인에 상담·약물관리 등 재활지원서비스 제공'
