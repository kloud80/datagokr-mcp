description_portal: 부산광역시 해운대구 관내에 있는 어진샘 노인종합복지관과 장산 노인복지관, 노인복지관 반여분관에서 운영하고 있는 프로그램 강좌 현황입니다.(강좌명, 교육시작시간 및 교육종료시간, 강좌내용, 강좌운영요일, 강좌정원 수, 교육장소, 연락처 등)노인복지관의 연락처는 고객과의 원활한 소통을 위해 중요한 역할을 하며, 고객에게 편리함을 제공함과 동시에 신속한 응대가 가능하도록 도와주는 핵심적인 연락 수단입니다. 전화번호를 통해 고객은 궁금한 점을 바로 문의하거나  상담 등을 신속히 진행할 수 있습니다. 다만, 일부 사업장의 경우 운영 상황에 따라 전화번호 정보가 공란으로 남아 있을 수 있음을 양해해 주시기 바랍니다. 노인복지관 프로그램 현황은  이용인원 수, 기관 상황 등 다양한 사유로 인해 지속적으로 변동 될 수 있음을 알려드립니다.
