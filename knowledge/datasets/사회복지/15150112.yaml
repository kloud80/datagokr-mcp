summary_user: 청소년 봉사활동 신청 건별로 완료·취소 등 진행 이력을 담은 원천 기록으로, 이력일련번호·신청번호·프로그램번호와 활동상태, 진행일자, 활동 시작·종료 일시, 참여여부, 교육이수시간, 성별, 담당자 의견을 전국 범위로 제공한다. 청소년활동 담당자나 분석가가 "봉사활동 프로그램별로 신청 후 취소되는 비율과 실제 참여·이수 시간은 어떤가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 기관의 프로그램번호(prgrmNo)나 신청번호로 동일 기관의 봉사활동 프로그램·신청 정보와만 맞춰 이어 쓴다.
description_portal: 성평등가족부 청소년활동 봉사활동 신청 완료취소 이력 정보는 청소년이 봉사활동 신청 후 완료 또는 취소한 내역을 체계적으로 기록하고 관리하기 위해 제공되는 자료입니다. 참여자 정보, 신청 활동명, 신청 일자, 완료·취소 상태, 관련 승인 내역 등 다양한 데이터를 포함하며, 기관에서는 이를 활용하여 신청 및 취소 현황 모니터링, 참여자 안내, 정책 분석, 프로그램 운영 관리, 기록 관리, 교육 지도, 프로그램 개선 등 다양한 목적으로 활용할 수 있습니다. 또한 이력 정보는 봉사활동 참여 현황 분석과 프로그램 신뢰성 확보에도 중요한 자료입니다.
