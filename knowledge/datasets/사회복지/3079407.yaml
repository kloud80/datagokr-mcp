summary_user: 부산광역시 동구 지역자활센터가 운영하는 자활사업단(사업장)을 한 곳씩 나열한 목록으로, 구분·사업명·사업장 주소·주사업내용·연락처를 담은 작은 CSV 파일(약 1.5KB)이다. 동구 주민이나 복지 담당자가 '동구에서 자활근로에 참여할 수 있는 사업장은 어디이고 무슨 일을 하는가'를 확인할 때 쓴다. 전역 조인 키나 시설코드가 없어서, 다른 사회복지시설 자료와는 사업장 주소나 사업명을 맞춰 보거나 같은 기관(부산 동구) 자료끼리만 이어 쓴다.
description_portal: 부산광역시 동구 지역자활센터 사업단 현황 내용에 대한 구분, 사업명, 사업장 주소, 주사업내용, 사업장연락처등을 데이터로 제공합니다.부산 동구 자활사업장은 지역 주민의 자립과 안정적인 경제 활동을 지원하기 위해 다양한 근로 기회를 제공하는 지역 기반의 사회적 일자리 공간입니다. Participants가 스스로 능력을 키우고 지속 가능한 소득 활동을 이어갈 수 있도록 직업훈련, 상담, 맞춤형 지원을 함께 운영하고 있습니다. 또한 지역사회와 연계한 사업을 통해 공공의 가치를 높이고, 취약계층의 생활 안정을 돕는 데 중요한 역할을 수행하고 있습니다.
