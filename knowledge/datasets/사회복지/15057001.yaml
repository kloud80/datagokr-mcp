summary_user: 국민연금공단 국민연금통계연보를 바탕으로 경기도 시군별 장애연금 지급 현황을 연도별로 집계한 데이터로, 시군마다 전체 수급자 수·지급액과 이를 나눈 장애연금(연금형)·일시금 각각의 수급자 수와 지급액을 담는다. 복지·재정 분석가가 '경기도 안에서 어느 시군의 장애연금 수급자와 지급액이 많고, 일시금 비중은 어떻게 다른가'를 비교하는 데 쓴다. 기준연도(STD_YY)와 시군 코드·이름(SIGUN_CD)이 있지만 실측상 전역 조인 키는 없어, 다른 시군 단위 통계와는 시군명·코드 매핑으로 이어 쓴다.
description_portal: 이 데이터는 국민연금공단의 국민연금통계연보를 기반으로 경기도 내 시군별 장애연금 지급 현황을 연도별로 정리한 자료입니다. 각 시군별로 전체 수급자 수, 전체 지급액, 장애연금 수급자 수 및 지급액, 일시금 수급자 수 및 지급액을 포함하고 있어, 장애연금의 수급 현황과 재정 지출 규모를 종합적으로 파악할 수 있습니다. 본 데이터는 장애유형별 또는 급여종류별로 연금 수급의 차이를 분석하거나, 지역 간 장애연금 수급 수준을 비교 분석하는 데 유용하며, 복지 정책 수립, 재정 운용 계획, 지역 맞춤형 장애인 지원 서비스 개발 등의 목적으로 활용될 수 있습니다.
