summary_user: 국민연금기금의 자산을 맡아 운용하는 위탁운용사 명단을 자산별(국내외 주식, 채권, 대체투자) 구분과 운용사명으로 담은 전국 단위 파일(csv)이다. 연금 기금 분석가나 금융업계 관계자가 "국민연금 국내주식을 위탁받은 운용사는 어디인가" 같은 질문에 쓴다. 전역 조인 키는 없어서, 운용사명을 금융회사 이름으로 맞춰 재정금융 분야의 금융회사·주식 데이터나 같은 기관의 거래증권사·국내 주식 보유 데이터와 이어 쓴다.
description_portal: 국민연금은 전문성을 활용하여 기금 수익률을 제고하고, 투자의사결정 주체 다변화를 통해 위험분산을 도모하고 있습니다.위탁운용의 기본 방향은 운용의 전문성(외부 전문성 활용으로 수익률 제고), 운용의 효율성(직접운용 보완, 비용 대비 초과성과 향상 추구, 투자결정 분권화(투자의사결정 분산으로 기금의 금융시장에 대한 영향력 완화 및 위험분산 추구)입니다.본 데이터는 분기마다 업데이트되는 국민연금기금의 위탁운용사에 대한 정보로 자산별(국내외 주식, 채권, 대체투자) 위탁운용사 현황을 제공합니다.
