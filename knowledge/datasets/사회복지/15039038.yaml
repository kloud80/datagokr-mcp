summary_user: 아이돌봄 통합업무관리시스템에서 쓰는 4대보험 공제율 기준표로, 기준일별로 적용 최소 소득금액과 국민연금·고용보험(기업 규모별 사용자부담 포함)·건강보험·장기요양보험·산재보험의 근로자부담·사용자부담 공제율을 담는 전국 단위의 작은 CSV 파일(1,521바이트)이다. 아이돌보미 급여에서 공제액과 기관 부담분을 계산하거나, 특정 기준일에 적용된 보험료율로 인건비 예산을 짜려는 제공기관·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준일(날짜)을 맞추는 방식으로만 이어 쓴다.
description_portal: 아이돌봄 통합 업무 관리 시스템에 대한 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 기준일, 적용 최소 소득금액, 근로자부담/사용자부담의 국민연금공제율, 고용보험 공제율, 건강보험공제율, 장기요양보험공제율, 산재보험공제율의 내용을 확인할 수 있습니다.사용자 및 제공 기관의 정확한 급여 계산과 예산 편성에 도움을 줄 수 있습니다. 이 데이터를 바탕으로 서비스 제공자와 수요자의 부담 수준을 분석할 수 있으며 서비스 수가 조정이나 예산 배정의 근거자료로도 유용하게 활용될 수 있고 아이돌봄 관련 급여 체계 분석 및 정책 수립에 기초 자료로 활용될 수 있습니다.
