description_portal: 자활기업은 2인 이상의 수급자 또는 저소득층이 협력하여 조합이나 공동사업자 형태로 운영하는, 탈빈곤을 위한 중요한 사회적 경제 주체입니다. 2012년 8월 2일 국민기초생활보장법 개정에 따라 기존의 자활공동체가 자활기업으로 명칭을 바꾸어 오늘에 이르고 있습니다.이번에 시도별 및 기업구분별(광역자활기업, 전국자활기업, 지역자활기업) 자활기업 수 현황에 대한 상세 데이터를 공개합니다. 본 데이터는 각 시도에 분포된 자활기업의 수를 포함하며, 자활기업의 현황을 다각도로 분석하고 지역별 특성을 반영한 맞춤형 자활 정책 수립에 중요한 자료가 될 것입니다. 이를 통해 자활기업의 지속 가능한 성장을 지원하고, 지역사회 활성화에 기여할 것으로 기대됩니다.
