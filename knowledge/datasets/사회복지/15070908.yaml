summary_user: 경상북도에서 인증받은 사회적기업을 기업 한 곳당 한 행으로 담은 파일 데이터로, 인증번호·기관명·유형(일자리제공형, 기타(창의·혁신)형 등)·사회서비스 분야·시군 단위 소재지를 포함한다. 지역 사회적경제 정책 담당자나 분석가가 '경북 어느 시군에 어떤 유형의 사회적기업이 몰려 있고, 장애인 직업재활 같은 분야는 어디에 부족한가'를 살피거나 지원 대상을 고르는 데 쓴다. 전역 조인 키는 없어서 인증번호나 기관명으로 다른 사회적기업·기업 데이터와 맞춰 붙이고, 소재지 주소로 시군 단위 통계와 이어 쓴다.
description_portal: 경상북도_사회적기업현황은 경상북도 내에서 인증을 받은 사회적기업의 기본 정보를 체계적으로 정리한 데이터입니다. 이 자료는 각 기업의 인증번호, 기관명, 운영 유형, 사회서비스 분야, 소재지 정보를 포함하여 지역 내 사회적경제 활동 현황을 파악할 수 있도록 구성되었습니다. 특히 일자리제공형, 기타(창의·혁신)형 등 유형별 분류가 명확히 제시되어 있어 사회적 가치 실현 방식과 기업 운영 목적을 쉽게 이해할 수 있습니다. 또한 소재지 정보가 시군 단위까지 상세하게 제공되어 지역 기반 서비스 제공 현황을 분석하는 데 활용될 수 있으며, 사회서비스 분야에는 취약계층 일자리 창출, 장애인 직업재활, 지역사회 복지 증진 등 기업의 주요 활동 목적이 서술되어 있습니다. 본 자료는 경상북도 내 사회적기업의 운영 실태를 확인하고 향후 사회적경제 정책 수립, 기업 지원 대상을 선정하는 데 중요한 기반 정보를 제공합니다. 자료 관련 문의는 054-880-2618로 하시기 바랍니다.
