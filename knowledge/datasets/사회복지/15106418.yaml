summary_user: 서울 영등포구 안에 있는 노인복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설유형(노인교실·노인요양시설·노인복지관·재가노인·공동생활가정·노인일자리지원기관), 시설명, 도로명주소, 전화번호, 홈페이지, 이용시설, 주차장 면수를 싣는다. 영등포구 주민이나 보호자가 '집 근처에 주차 가능한 노인복지관이나 요양시설이 어디 있고 연락처는 무엇인가'를 찾을 때, 또는 분석가가 구 안의 시설 유형별 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·도로명주소로 맞추거나 같은 영등포구 자료끼리 이어야 하며, 지역 단위 고령 통계와는 시군구(영등포구) 수준에서 연결한다.
description_portal: '서울특별시 영등포구 노인복지시설현황 데이터는 영등포구 내 위치한 노인복지지설현황에 대한 자료를 제공하고 있습니다.데이터에 포함된 항목은 다음과 같습니다.시설유형: 노인교실, 노인요양시설, 노인복지관, 재가노인, 노인요양 공동생활가정, 노인일자리지원기관시설명: 영등포구 내 위치한 노인복지시설명도로명주소: 해당 시설이 위치한 곳의 도로명주소전화번호: 해당 시설의 연락처시설홈페이지: 해당 시설의 홈페이지에 접근할 수 있는 URL주소이용시설: 시설 내 이용가능한 공간주차장면수 : 주차장면수데이터기준일자: 데이터기준일자담당부서: 어르신장애인과'
