summary_user: 경기도 아동급식전자카드(지드림카드)를 쓸 수 있는 가맹점을 가맹점 한 곳당 한 행으로 담으며, 시군명·업종 구분·지번·도로명 주소·우편번호·위경도 좌표를 포함한다. 보호자나 복지기관이 우리 동네에서 급식카드로 끼니를 해결할 수 있는 식당을 찾거나, 분석가가 시군별 가맹점 분포와 사각지대를 지도로 살펴보는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않아, 시군명(SIGUN_NM)·시군 코드나 주소·좌표를 기준으로 다른 시군 단위 아동·취약계층 통계와 이름 매핑이나 공간 결합으로 잇는다.
description_portal: 경기도 아동급식카드 가맹점 현황 데이터는 저소득가정 아동의 건강한 성장을 지원하기 위해 도입된 아동급식 전자카드(G Dream Card, 지드림카드) 가맹점 정보를 담고 있다. 이 카드는 급식비 지원을 전자카드 형태로 제공함으로써 아동들이 편리하고 안전하게 끼니를 해결할 수 있도록 설계되었으며, 데이터에는 가맹점명, 업종 구분, 소재지 주소(도로명·지번), 우편번호, 위도·경도 좌표 등의 정보가 포함되어 있다. 이를 통해 경기도 내 아동급식 지원 네트워크의 공간적 분포와 접근성을 확인할 수 있으며, 지역별 복지 인프라 분석에 활용 가능하다.특히 아동급식카드는 단순한 식사 제공을 넘어 아동 복지 향상, 빈곤 아동의 건강권 보장, 사회적 낙인 방지라는 복지적 가치를 가진다. 데이터는 가맹점 위치를 기반으로 GIS 분석이 가능하여, 급식카드 이용 가능 지역의 공간적 불균형을 파악하거나 사각지대를 찾아내는 데 유용하다. 또한 아동 보호 및 복지 정책 수립 시 지역별 가맹점 수와 밀집도를 참고하여 추가 가맹점 확보나 지원 정책을 수립할 수 있다.이 자료는 지방정부, 복지기관, 연구자뿐만 아니라 민간 영역에서도 다양하게 활용될 수 있다. 예컨대 사회복지 기관은 아동 지원 프로그램을 설계할 때 해당 데이터를 참조하여 이용자 접근성을 강화할 수 있고, 정책 연구자는 지역별 복지 인프라 현황을 분석해 맞춤형 정책 제언을 도출할 수 있다. 또한 학계에서는 아동복지 정책의 효과성 평가나 지역 간 격차 분석 연구에도 적극적으로 활용할 수 있다.나아가 본 데이터는 아동복지 정책의 투명성과 신뢰성을 높이는 역할을 한다. 급식 지원이 실제로 아동들에게 적절하게 전달되고 있는지를 확인할 수 있으며, 정책 집행 과정에서의 문제점을 개선하는 근거 자료로 기능한다. 따라서 아동의 기본적인 삶의 질 보장과 사회적 안전망 강화를 위한 중요한 데이터라 할 수 있다.
