description_portal: '부산광역시 노인무료급식기관 현황에 관한 데이터로 노인무료급식기관 구군명, 노인무료급식기관 기관명, 노인무료급식기관 위탁사무명 등의 정보를 제공합니다 .기본정보(소재 구군, 시설명, 위탁사무명)를 토대로 부산시 전체 노인무료급식기관 현황으로 구성된 데이터입니다.○ 노인무료급식기관 구군명: 부산시 16개 구군 중 해당 노인무료급식 기관이이 소재하고 있는 구군○ 노인무료급식기관 기관명: 부산시 16개 구군 중 해당 노인무료급식 중 해당 노인무료급식 기관명○ 노인무료급식기관 위탁사무명: 경로식당, 식사배달, 밑반찬 배달 등 해당 노인무료급식 기관이 담당하고 있는 위탁사무명노인무료급식기관 현황은 구군에서 지정 및 운영하고 있음. 노인무료급식기관 현황은 실시간 변동 가능함.노인무료급식 기관은 부산시 내 노인급식 기관 중 무료급식을 제공하고 있는 시설을 말하며, 경로식당 기준 76개소가 운영되고 있음.노인무료급식 기관 현황은 매년 2번(상하반기)의 정기점검 및 실적 확인을 통하여 파악하고 있음.해당 노인무료급식기관 현황은 조사기준일인 2025.4.30.을 기준으로 작성됨.'
