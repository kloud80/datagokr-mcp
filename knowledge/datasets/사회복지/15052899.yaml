description_portal: '연금회계 수입(기여금,연금부담금,정보보전금,퇴직수당부담금,재해보상부담금,퇴직연금이체금)과 지출(연금급여,퇴직수당,정부부담급여,관리운영비) 데이터입니다.1. 잡수익 등은 급여환수금, 예입금이자 등 포함, 연금이체급여는 연금급여에 포함2. 결산잉여금 : 82∼92년 기업회계기준에 따라 금년도에 발생한 잉여금은 익년도에 가서 적립되었음3. 2013년부터 국가회계법에 따라 국가회계기준(실물자산 시가평가 반영) 적용4. 2015년부터 기금운용수익금의 일부를 정부보전금(기금보전금)으로 충당5. 연금사업운영비는 관리운영비에 포함'
