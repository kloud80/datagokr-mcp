description_portal: 본 데이터는 요양보호사 자격증 취득을 위한 교육기관 정보를 제공한다. 고령화 사회 대응 및 노인장기요양보험 제도 운영에 필요한 전문 인력 양성기관 현황을 포함한다. 교육기관명, 소재지 주소, 전화번호, 지정일자 등의 항목이 수록되어 있으며, 총 22개 기관 정보를 제공한다. 시민들은 거주지와 접근성을 고려하여 적합한 교육기관을 선택할 수 있다. 각 기관은 법령에 따라 지정된 곳으로 표준 교육과정을 운영한다. 요양보호사는 노인 및 장애인 등 돌봄 대상자에게 신체활동 지원과 일상생활 지원 서비스를 제공하는 전문직이다. 자격증 취득을 위해서는 지정 교육기관에서 교육과정을 이수해야 하며, 본 데이터는 기관 선택 및 문의를 위한 정보로 활용 가능하다.
