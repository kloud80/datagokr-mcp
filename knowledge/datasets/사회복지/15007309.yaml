summary_user: 부산광역시 사상구 관내 장애인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설 구분·시설명·소재지·연락처를 담는다. 장애인 가족이나 복지 담당자가 사상구에 있는 공동생활가정·단기보호시설·직업재활시설 등이 어디에 있고 연락처가 무엇인지 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 주소를 맞춰 잇는 방식으로만 연결한다.
description_portal: 돌봄, 교육, 보호가 필요한 장애인들을 위한 사상구 관내 장애인 공동생활가정  7개소,  장애인 단기보호시설  1개소,  장애인 거주시설 1개소,  지역사회재활시설 7개소, 장애인 직업재활시설 3개소에 대한  현황 (시설명, 시설소재지, 연락처 등)라온누리, 밀랑의집공동생활가정, 꾸미내집, 체리동산, 진주홈, 뜰꽃, 사상구장애인복지관, 점자도서관, 사상구장애인복지관부설주간보호센터, 체리동산, 들곷, 반딧불이, 에원, 한마음, 근로작업장, 지원 호정직업재활원 등 사상구 관내 장애인복지시설 현황입니다.
