summary_user: 공식 인증을 받은 청소년 활동 프로그램을 프로그램 단위로 담은 API로, 프로그램명·운영기관명·활동 기간·참가 대상·참가비 등을 전국 범위에서 시군구 단위로 제공한다. 학부모나 학교 비교과 담당자가 '우리 지역에서 중학생이 참가할 수 있는 인증 프로그램 중 참가비가 낮은 것은 무엇인가'를 찾거나, 분석가가 지역별 프로그램 분포와 대상·비용 다양성을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(organNm)이나 지역명 같은 이름 매칭으로만 잇고, 지역 단위 청소년 통계와는 시군구 이름을 맞춰 연결한다.
limits: 표준 기관코드나 행정구역코드 같은 공통 키가 없어 청소년 시설 목록 등과 정확히 결합하기 어렵고 이름 매칭 오류에 주의해야 한다. 갱신은 이벤트 주기로 분류되어 정기 갱신을 전제하기 어렵다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
