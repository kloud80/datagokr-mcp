summary_user: 청소년활동 인증프로그램을 활동 실시 차수별로 담는 건별 API로, 인증번호·프로그램명·활동 시작·종료 일시, 1인당 참여금액, 인증 교육목표·내용 설명, 숙박·개별/단체 모집·대규모·고위험 여부를 전국 범위(비공간)로 제공한다. 학부모나 청소년지도자가 "숙박형이 아니고 개별 모집이 되는 인증 프로그램 중 참가비가 얼마인가"를 찾거나, 분석가가 모집형태·위험도별 운영 방식을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 인증번호(certNo)나 프로그램명 같은 이름 매핑, 또는 같은 기관 데이터와의 대조로만 연결한다.
description_portal: 성평등가족부의 청소년활동 인증프로그램 정보를 제공하는 오픈API입니다. 해당 개방 데이터는 활동실시차수, 활동 시작 및 종료 일자, 인증번호, 프로그램명, 인당참여금액, 인증교육목표, 프로그램내용설명, 활동시간, 숙박여부, 개별모집여부, 단체모집여부, 대규모여부, 고위험여부 등의 정보를 확인할 수 있습니다. 프로그램별 운영 특성과 참여 조건을 파악하여 예산 편성, 프로그램 비교 분석, 정책 기반 청소년 맞춤서비스 개발 등에 활용할 수 있습니다. 특히 인당참여금액과 모집형태(개별·단체·대규모) 정보는 예산 편성 기준 설정이나 타겟 마케팅에도 활용할 수 있으며, 프로그램별 운영방식 비교 분석도 가능합니다. 다양한 활동 유형을 분류하고 청소년에게 적합한 프로그램을 매칭하는 서비스에 활용될 수 있습니다.
