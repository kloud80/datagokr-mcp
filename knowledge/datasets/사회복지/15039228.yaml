description_portal: '공무원연금공단에서 제공하는 연도별 공무원 평균 근속년수 현황으로, 2016년부터 전년도까지의 연도별 통계를 수록하고 있습니다.각 연도별로 전체 공무원의 평균 근속기간이 포함되어 있어서 공무원의 근속 경향과 변화 추이를 파악할 수 있습니다.해당 데이터는 인사정책 수립, 조직 운영전략, 퇴직자 예측 등 다양한 행정 및 정책적 목적으로 활용될 수 있으며, 근속년수의 증감에 따른 원인분석(예: 신규채용 규모, 조기퇴직 증가 등)이나 세대별 인력구성 변화의 흐름을 파악하는데 유용한 기초자료입니다.공무원연금공단 홈페이지의 사전정보공개 메뉴를 통해 제공되며, 매년 5월말 이후 전년도 데이터를 반영하여 현행화하고 있습니다.'
