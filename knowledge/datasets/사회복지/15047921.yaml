summary_user: 대구광역시 내 장애인 주간보호시설을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·시설장·소재지·정원·전화번호·설치일자·운영자를 포함한다(CSV 약 6KB). 장애인 가족이나 복지 담당자가 '우리 구 근처에 낮 시간 돌봄을 받을 수 있는 주간보호시설이 어디이고 정원은 몇 명인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 장애인복지시설 데이터와는 시설명이나 소재지 주소를 맞춰 연결해야 한다.
limits: 시설 코드 같은 공통 식별자가 없어 다른 데이터와 붙이려면 이름·주소를 직접 매칭해야 한다. 범위는 대구광역시 한 곳뿐이므로 다른 시도와 비교하려면 별도 자료가 필요하다.
