description_portal: 대한적십자사 RCY단 결성현황 데이터는 전국 유치원, 학교 단위로 운영되는 RCY(Redcross Youth) 조직의 결성정보를 제공하는 공공데이터입니다. 대한적십자사 RCY단 결성현황 데이터는 지역(지사)에서 신규로 결성한 연도별 RCY단 조직의 결성 현황(건수)와 RCY단이 수행하는 창의적 체험활동 현황(봉사활동구분 및 수혜대상자구분) 데이터 등으로 구성되어 있습니다. 본 데이터가 제공하는 연도별 지역의 신규 RCY 조직 결성현황 통계, 창의적 체험활동 정보 등을 통해 지역별 청소년 인재 육성, 청소년 및 공동체 관련 프로그램 기획·활성화, 청소년 사회공헌 정책 수립, 학교 교육과 연계된 청소년 활동 정책 수립 및 통계 분석 등에 활용이 가능합니다.
