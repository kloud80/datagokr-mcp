summary_user: 경기도여성가족재단이 발간하는 온라인 간행물 '주간WiFi'의 호수별 제목·요약내용·발간일·본문 링크를 호 단위 목록으로 담는다. 연구자나 정책 담당자가 경기도에서 젠더·가족 구성 변화·사회적 약자 관련 정책 의제가 언제 어떤 주제로 다뤄졌는지 추적할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 발간일이나 제목 키워드 매칭, 같은 기관 기준으로만 이어 쓴다.
description_portal: '이 데이터는 경기도여성가족재단에서 발간하는 온라인간행물 "주간WiFi"의 호수별 제목, 요약내용, 발간일, 본문URL 등의 정보를 담고 있습니다. 간행물은 젠더 이슈, 가족 구성 변화, 정책 제도, 사회적 약자에 대한 논의 등 여성과 가족 관련 주요 사회 의제를 다루고 있으며, 정책 동향 파악과 여론 분석에 활용될 수 있습니다. ※ WiFi : Woman Issue & Family Issue의 약자로 여성가족·아동 및 청소년·청년 관련 이슈, 정책 동향, 경기도가족여성연구원의 정책연구 및 현장소식을 전하는 발간물입니다.※ 유의사항 : 이용 허락 조건은 간행물 목록에 대한 것으로, 간행물 각각에 대한 이용 허락 조건은 "출처표시+상업적 이용금지+변경금지"입니다.'
