description_portal: '○ 통계개요* 통계명 : 기초연금 수급자 현황* 통계종류 : 서울시 기초연금 수급자 현황을 자치구별로 제공하는 일반 ·보고통계* 작성목적 : 공적 노후소득 보장의 사각지대를 완화하고, 노인의 생활안정을 지원하기위해 ‘08년 1월부터 시행(’07년 4월 기초노령연금법 제정)하여 기초연금수급자 현황을 파악하여 복지 정책의 기초자료로 제공하는 목적으로 함* 조사체계 : 면/동 및 국민연금공단(지사) → 시군구 → 시도 → 보건복지부(행복e음)* 공표주기 : 정기(매년, 12월 말 기준)* 공표범위 : 지역 - 서울시, 자치구내용 - 노인인구수, 기초연금수급자수, 수급률 등○ 용어설명* 노인인구수 : 주민등록 인구통계의 65세 이상 거주자 및 거주불명자(재외국민 제외)* 수급자수 : 기초연금 수급자수 (각 연도 12월말 기준)* 수급률 : (수급자수/노인인구수) * 100'
