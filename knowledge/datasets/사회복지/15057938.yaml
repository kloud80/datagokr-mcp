summary_user: 경기도 일반학교 통합학급(특수교육대상자와 일반학생이 함께 수업하는 학급)의 학생 수를 기준연도(STD_YY)와 학교유형(국·공·사립)별로 집계한 통계로, 유치원·초등학교·중학교·고등학교·전공과 과정별 전체·남·여 학생 수를 담는다. 교육정책 분석가나 장애인 단체가 "경기도에서 통합학급에 다니는 학생은 학교급별·성별로 어떻게 분포하고 해마다 어떻게 바뀌는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 특수교육 통계와는 기준연도와 학교유형 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 통합학급 학생수 집계현황 데이터는 경기도 내 일반학교에서 특수교육대상자와 일반학생이 함께 수업을 받는 통합학급 학생 수를 학교유형별(국·공·사립) 및 학교과정별(유치원, 초등학교, 중학교, 고등학교, 전공과)로 집계한 교육·복지 통계자료입니다. 매년 6월 말 기준으로 제공되며, 전체 학생 수, 성별 학생 수(남·여 구분), 학급별 학생 수 등이 포함됩니다.이 데이터는 통합교육 현황을 파악하는 데 중요한 지표로 활용되며, 장애학생의 교육적 통합 실태와 일반학생과의 상호작용 현황을 분석할 수 있습니다. 이를 통해 학교급별·성별 분포 차이를 확인할 수 있으며, 교육부 특수교육통계 및 누림센터 자료와 연계하여 통합교육 정책 수립과 자원 배분 근거로 사용할 수 있습니다. 또한, 특수교육 대상자의 학습권 보장과 더불어 교육 형평성을 확보하기 위한 정책적 시사점을 제공합니다.
