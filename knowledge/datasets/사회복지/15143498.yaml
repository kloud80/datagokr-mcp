summary_user: 전국 장례지도사 교육기관을 기관 한 곳당 한 행으로 담은 파일로, 신고번호·시설명·주소·연락처·홈페이지와 표준교육 비용, 전공자 교육 비용을 담는다. 장례지도사 자격을 준비하는 사람이 "우리 지역 교육기관은 어디이고 표준교육비는 얼마인가"를 비교하거나, 분석가가 교육기관 분포를 지도로 볼 때 쓴다. 교육기관 신고번호(funeral_edu_report_no)가 조인 키이며, 주소를 행정구역 코드로 바꾸면 지역별 장사시설·사망자 통계와 이어 쓴다.
description_portal: 보건복지부에서 관리하는 보건복지현황 중 2026년 5월 31일 기준 전국 장례지도사 교육기관 현황(신고번호, 시설명, 주소, 상세주소, 전화번호, 팩스번호, 홈페이지 주소, 표준교육 비용, 전공자 교육비용)에 대한 데이터를 제공 합니다.<공설,법인 장사시설 종사인력교육 교육의 필요성 및 의의>1. 사회, 인구구조 변화로 인한 장사수요, 장사문화, 장사시설에 대한 국민적, 사회적 욕구 변화 발생2. 연 평균 27만명에 달하는 사망자의 화장, 매장, 유골안치 등이 이루어지는 장사시설에 대한 위생기준 정착 및 종사인력에 대한 감염대비 교육3. 최신의 장사정책 및 친자연 장례문화에 대한 종사자의 올바른 이해를 통해 시설의 합법, 선진, 합리적 운영 역량을 배양4. 유가족과 조문객이 최대한의 이용자 편의를 보장받고, 기피시설이 아닌 지역사회 복지시설, 찾고 싶은 장사문화시설로 인식될 수 있도록 종사자의 인식 전환에 기여5. 자질교육과 실무교육의 조화를 통한 장사시설 직무 상향 표준화 및 장사서비스 국민만족도 제고
