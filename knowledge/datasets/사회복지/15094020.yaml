summary_user: 국민연금 납부예외자 수를 기준년월별로 실직·사업중단·휴직·병역·재학·교도소·감호시설·3개월 이상 입원·행방불명·재해 및 생활곤란 등 사유별로 나눠 담은 전국 단위 집계 파일(CSV, 약 1KB)이다. 연금 정책 분석가나 연구자가 '실직이나 사업중단 때문에 보험료를 내지 못하는 가입자가 시기별로 얼마나 늘거나 줄었나'를 살펴보는 데 쓴다. 전역 조인 키가 없어 기준년월을 기준으로 같은 기관의 가입자·수급자 통계와 시점을 맞춰 이어 보는 방식으로만 연결한다.
description_portal: '해당 데이터는 국민연금공단 가입자의 데이터를 기반으로 만들어졌습니다.해당 데이터는 월별, 연도별 국민연금 가입자 수의 데이터를 나타냅니다.해당 데이터는 가입자의 납부예외 사 에 따라 분류되어 있고 분류기준은 아래와 같습니다.-납부예외 사유: 실직,사업중단,휴직,병역,재학,교도소,감호시설,3월입원,행불,재해 및 생활곤란 등국민연금 가입자의 납부예외 사유와 그 사유에 따른  국민연금 가입자 수를 확인하실 수 있습니다.(데이터 건수가 많은 경우 모든 데이터가 표출되지 않을 수 있습니다.)'
