summary_user: 경상북도 내 노인요양시설 등 노인의료복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시군·시설종류·시설명·소재지·연락처와 정원·현원을 기록한다. 보호자나 정책 분석가가 "우리 시군에 어떤 요양시설이 있고 정원 대비 현원이 얼마나 차 있는가"를 확인하거나 시군별 장기요양 인프라 수급을 비교하는 데 쓴다. 전역 조인 키가 없어 시설명·주소 문자열 매칭이나 시군 이름으로 건강보험 장기요양기관 정보, 시군 단위 지역 통계와 이어 쓴다.
description_portal: 본 데이터는 노인 의료 복지 시설의 현황에 대한 상세 정보를 제공하고 있습니다. 이는 경상북도 내에서 운영되고 있는 노인요양시설 등 노인들의 건강과 생활 지원을 목적으로 하는 의료 복지 시설의 운영 실태 및 규모를 파악하는 데 목적이 있습니다.주요 내용으로는 각 시설의 고유 식별을 위한 연번과 시설이 위치한 행정 구역을 나타내는 시군 정보가 포함됩니다. 해당 시설이 구체적으로 어떤 유형의 시설인지 알려주는 시설종류와 공식 명칭인 시설명이 기록되어 있습니다. 시설의 위치를 파악할 수 있는 소재지와 연락을 위한 연락처 정보도 제공됩니다.시설의 규모와 운영 상태를 정량적으로 파악할 수 있도록 수용 가능한 최대 인원인 정원과 현재 실제 이용 중인 인원인 현원 정보가 포함됩니다. 이 자료는 지역별 노인 의료 복지 인프라 구축 현황을 분석하고, 장기 요양 서비스의 수급 불균형 해소 방안 및 정책 수립에 귀중한 기초 자료로 활용됩니다.자료 관련 문의는  어르신복지과 054-880-3757로 하시기 바랍니다.
