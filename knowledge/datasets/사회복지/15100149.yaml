summary_user: 국민연금공단이 연말 기준으로 집계한 장애인 활동지원(활동보조) 제공기관 수를 시도별·기관유형별(장애인단체, 장애인복지관, 자립생활센터, 지역자활센터, 장기요양기관, 사회복지관, 기타사회복지시설, 기타)로 담은 전국 단위 집계 파일(csv, 580 bytes)이다. 장애인 복지 분석가나 정책 담당자가 '우리 시도에는 어떤 유형의 활동지원 제공기관이 얼마나 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 시도 이름과 기준연도를 매핑해 시도별 장애인 인구나 다른 지역 통계와 이어 쓴다.
description_portal: 국민연금공단의 연말기준 활동지원기관 중 활동보조 제공기관의 유형별(장애인단체, 장애인복지관, IL센터, 지역자활센터, 장기요양기관, 사회복지관, 기타사회복지시설, 기타) 현황을 제공합니다. IL센터는 자립생활지원센터로 장애인의 탈시설화의 요구와 정상화의 이념에 기초하여 장애인 스스로 자신들의 생활을 관리하고 자립적으로 생활해 나갈 수 있도록 지원하는 센터를 의미합니다. 따라서 본 데이터는 국민연금공단 연말기준 IL센터 및 장애인단체, 복지관, 지역자활센터, 장기요양기관, 사회복지관, 기타사회복지시설 등을 시도별로 구분하여 제공합니다.
