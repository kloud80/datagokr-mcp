summary_user: 공무원연금 연금회계의 손익계산서를 계정 항목(구분)별 행, 1983년부터 2025년까지의 연도별 열로 담은 전국 단위 집계표이다. 연금재정을 분석하는 연구자나 기자가 연금급여사업비·관리운영비 같은 비용과 연금수입이 연도별로 어떻게 바뀌었고, 연금회계지원금을 빼기 전 순이익이 어떤 추세인지 확인하는 데 쓴다. 전역 조인 키가 없어서, 다른 직역연금 통계와는 연도와 항목 이름을 맞춰 연결한다.
description_portal: 공무원연금공단에서 관리하는 연금기금(연금회계) 손익계산서 데이터로, 사업수익(연금수입), 사업외수익, 특별이익, 사업비용(금융부문 비용, 복지 및 부동산 사업비, 연금급여사업비, 전산업무비, 업무위탁비, 적립금), 관리운영비(인건비, 일반경비), 사업외비용, 특별손실 등에 대해 1983년부터 작성된 데이터입니다.이를 통해 연금회계의 연도별 재정 상태와 운영 성과를 파악할 수 있습니다.* 순이익은 연금수지적자에 따른 연금회계지원금을 차감하기전 순이익임** 재해보상특별회계의 신설로 인해 재해보상관련 부담금징수와 급여지급사항은 2002년부터 연금회계에서 분리됨
