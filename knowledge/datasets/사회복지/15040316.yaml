description_portal: '이 데이터는 서울특별시 성북구 내 방과후교실(아동돌봄교실)의 운영 현황을 제공하는 자료입니다.각 방과후교실의 명칭, 주소, 전화번호, 기준일자(2021년 1월 1일) 등의 정보를 포함하고 있으며,성북구 지역 내 아동 돌봄 및 방과후 교육 서비스 인프라 현황을 파악하는 데 활용할 수 있습니다.본 자료는 초등학교·지역사회 돌봄기관·협동조합 등에서 운영되는 방과후 돌봄교실 현황을 포함하고 있어,아동복지 정책 수립, 방과후 돌봄서비스 접근성 평가, 교육복지 인프라 분석, 사회서비스 균형지표 작성 등에 활용이 가능합니다.또한, 표준화된 구조로 구성되어 있어 **다른 복지·교육 관련 데이터(예: 지역아동센터, 보육시설 등)**와의 결합 분석에도 유용합니다.'
