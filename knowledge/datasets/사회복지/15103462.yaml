description_portal: 2019년부터 2025년까지의 광주광역시 남구 취약 계층에게 보급된 동별 전동보장구 신청 현황에 대한 데이터입니다. 해당 데이터는 광주광역시 남구청 통합돌봄과(☎062-607-4063)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 전동보장구는 보행이 어려운 장애인이나 거동이 불편한 노약자의 이동을 돕기 위해 제공되는 전동 휠체어나 전동 스쿠터를 말합니다. 해당 데이터는 행정동별·연도별 신청 건수를 집계하여 지역별 수요와 변화 추이를 파악할 수 있도록 하며, 복지 예산 배분, 보급 계획 수립, 노후 기기 교체 주기 결정, 이동 약자 편의 증진 정책 수립 등 행정·복지 분야에서 활용됩니다.
