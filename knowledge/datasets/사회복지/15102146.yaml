summary_user: 대구광역시 동구에서 운영하는 노인일자리·사회활동지원사업을 사업 한 건당 한 행으로 담은 파일로, 사업수행기관·사업명·사업구분(공익형·사회서비스형·시장형)·연락처·인원·주요 활동 내용·사업 시작일과 종료일을 싣는다. 동구에 사는 어르신이나 가족이 "동구에서 지금 참여할 수 있는 노인일자리는 어느 기관이 어떤 활동으로 몇 명을 뽑는가"를 확인하거나, 분석가가 사업 유형별 정원 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수행기관 이름 매칭으로만 잇는다. 이렇게 이름으로 노인복지시설 목록이나 시군구 단위 지역 통계와 맞춰 본다.
description_portal: 대구시 동구에서는 어르신들의 활기찬  노후와 소득 보전을 위해 다양한 노인일자리 및 사회활동지원사업을 운영하고 있습니다. 주요사업 유형에는 공익형, 사회서비스형, 시장형이 있으며, 동구 노인 일자리 현황 데이터에는 사업수행기관, 사업명, 전화번호, 정원, 사업 활동 내용, 사업시작일, 종료일의 내용을 제공합니다. 이 데이터는 동구 내 어르신의 활기찬 노후와 소득 지원을 위해 시행되는 프로젝트 전반의 현황을 파악할 수 있도록 구성되어 있어, 정책 수립, 분석, 실무 운영에 매우 유용할 수 있습니다.
