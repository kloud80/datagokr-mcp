description_portal: 보건복지부에서 2015년~2024년까지 장애인 지역사회 재활시설 및 의료재활시설 운영 현황을 시도별로 분류하여 정보를 제공하고 있습니다.<통계 이용 시 주의사항>1) 항목명 중 "기타"는 점자도서관(22개소), 점자도서 및 녹음서출판시설(2개소), 수련시설(1개소), 재활치료시설(73개소)이 해당2) 지역사회 재활시설은 규모, 종류 및 형태가 다양하고 프로그램도 다양함으로 시설 수만 가지고 복지수준을 판단할 수 없음3) 2011년 장애인복지법 개정으로 단기 보호센터와 공동생활가정이 장애인 거주시설로 통합되고 의료재활시설은 별도로 분류되어 장애인 지역사회 재활시설에서 제외됨
