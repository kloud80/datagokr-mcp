summary_user: 공무원연금공단이 국내 주식 투자에서 거래한 증권사와 위탁운용사를 투자분야별로 1~4분기 거래증권사 이름으로 정리한 목록이며, 874바이트 zip 파일 하나에 2개 파일이 압축돼 있다. 공단이 어느 증권사·운용사와 거래했는지, 분기마다 거래 상대가 어떻게 바뀌었는지 확인하려는 연기금 투자 분석가나 금융업계 관계자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 증권사·운용사 이름을 맞춰 금융회사 데이터나 다른 연기금의 거래증권사·위탁운용사 데이터와 이어 쓴다.
description_portal: '공무원연금공단에서 금융자산운용으로 진행하고 있는 국내 주식 거래증권사 및 위탁운용사에 관한 데이터로 2개의 파일을 압축하여 제공합니다.거래금융기관 선정은 각 자산유형에 따라 지표를 통해 주기적으로 선정하고 있으며, 공무원연금공단 홈페이지 - 경영공시 - 금융자산운용 - 금융자산운용현황 - 거래금융기관 선정 메뉴에서 기준을 확인할 수 있습니다.* 주식투자- 직접운용 : KOSPI200 대형주 및 ETF 위주 투자, 장기 안정적 수익 창출- 위탁운용 : 순수주식형, 사회책임투자형, 중소형, 배당성장형 등에 대한 분산투자, 시장초과수익 추구'
