summary_user: 경기도 시·군별로 특수학교 학생 수를 기준년도마다 집계한 자료로, 총학생수와 장애영아·유치원·초등학교·중학교·고등학교·전공과 과정별, 연령·학년·연차별 학생 수를 담는다. 교육청이나 지자체 분석가가 '어느 시·군에서 특수학교 고등학교·전공과 과정 학생이 많아 진로·직업교육 시설이 더 필요한가' 같은 지역별 특수교육 수요를 따질 때 쓴다. 전역 조인 키는 없고, 시군 코드(SIGUN_CD)·시군명과 기준년도로 경기도의 다른 시군 단위 통계와 이름·코드 매핑을 거쳐 잇는다.
description_portal: 교육부(특수교육통계)에서 제공하는 경기도 내 특수학교 학생 수 - 시‧군별, 학교 과정별 집계 현황입니다. 매년 6월 말 기준의 시군명, 학교과정별 장애학생수(장애영아전체학생수, 장애영아1세미만학생수 등)를 제공합니다.이 데이터는 경기도 내 각 시군의 특수학교에서 운영 중인 교과과정별 학생 수를 집계한 자료입니다. 기준년도, 시군명, 총학생수를 비롯해 장애영아(1세 미만2세), 유치원(3세5세), 초등학교(16학년), 중학교(13학년), 고등학교(13학년), 전공과(13년차)에 이르기까지 다양한 연령 및 학년 구간의 학생 수를 항목별로 제공합니다. 본 데이터는 지역별 특수교육 수요 분석, 맞춤형 교육 인프라 구축, 예산 및 인력 배치 등의 정책적 활용에 적합하며, 특수학교 교육 체계의 연속성 및 통합적 교육 지원 체계를 모색하는 데 기초자료로 사용될 수 있습니다.
