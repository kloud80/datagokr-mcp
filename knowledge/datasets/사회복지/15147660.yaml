description_portal: 서울시가 운영하는 시립장사시설 가운데 2019년부터 2025년까지의 봉안시설, 산골시설, 자연장시설 이용 안치 현황을 정리한 자료입니다. 최근 장례 문화는 단순한 매장이나 봉안 중심에서 벗어나 환경 친화적이고 지속 가능한 방향으로 변화하고 있으며, 특히 화장률이 꾸준히 증가하면서 이에 따른 장사시설 수요의 양상도 크게 달라지고 있습니다. 서울시 제3차 장사시설 수급 중장기계획(2023~2027년)은 이러한 변화에 대응하여 늘어나는 화장 수요를 안정적으로 감당하면서도, 장기적으로 친환경적인 장사문화를 정착시키기 위해 자연장과 산골에 정책적 초점을 두고 있습니다. 이는 단순히 시설 확충에 그치지 않고, 시민의 다양한 장례 수요를 반영하고 사회적 인식 변화를 고려한 방향성이라고 할 수 있습니다.또한 최근 개정된 「장사 등에 관한 법률」과 관련 하위 법령의 시행은 장사시설 운영과 관리 전반에 새로운 기준을 제시하고 있으며, 서울시는 보건복지부의 정책 기조와 함께 이러한 법령 변화에 발맞추어 대응할 필요성이 커지고 있습니다. 이에 따라 서울시는 선제적으로 시립 화장시설 내부의 화장자료를 체계적으로 분석하여 봉안, 산골, 자연장 등 각 장법별 이용 현황을 종합적으로 파악하고, 이를 토대로 중장기적 수급계획에 반영하고 있습니다. 특히 자연장과 산골은 화장 이후 친환경적 안치를 선호하는 사회적 요구가 높아지고 있다는 점에서 앞으로 더욱 중요한 장사 방식으로 자리매김할 것으로 예상됩니다.따라서 이번 현황 자료는 단순한 통계 집계가 아니라, 서울시의 장사정책 방향과 국가 차원의 장례문화 전환 정책에 부응하기 위한 기초자료라는 점에서 의미가 큽니다. 향후에도 화장 수요와 장사시설 이용 추이를 면밀히 관찰하고, 지속 가능한 친환경 장례문화 정착을 위한 정책적 기반을 마련하는 데 적극 활용될 예정입니다.
