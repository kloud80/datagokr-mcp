summary_user: 청소년 상담지원을 받은 수혜자 수를 학교중단·가정밖·대인관계·학업진로·과의존 중독·정신건강·폭력피해·성·결핍빈곤·이주배경 등 상담 유형별로 나눈 전국 단위 집계 파일(약 353바이트의 소규모 CSV)이다. 청소년 상담기관이나 정책 분석가가 '어떤 문제 영역에 상담 수요가 몰리는가'를 보고 예방 프로그램이나 대응 우선순위를 정할 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 상담 유형 이름을 기준으로 다른 청소년 통계와 수작업으로 맞춰 보는 방식으로만 연계한다.
description_portal: 청소년 상담지원을 받은 수혜자의 수를 상담 유형으로 구분하여 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 청소년 상담유형에 포함되는학교중단, 가정밖, 대인관계, 학업 진로, 과의존 중독, 정신건강, 폭력피해, 폭력가해 비행, 성, 노동 근로, 결핍 빈곤, 신체건강 인식, 이주배경 등("24년 기준)으로 구분한 수혜자의 수를 확인할 수 있습니다.특정 문제 영역에서 청소년의 상담 수요가 집중되는 분야를 식별할 수 있어 정책 우선순위 결정에 중요한 근거가 됩니다. 상담기관이나 관련 연구기관이 청소년의 문제유형별 대응전략을 마련하는 데 효과적으로 활용 가능하며, 청소년 대상 예방 프로그램 기획의 핵심 기반 자료로 활용될 수 있습니다.
