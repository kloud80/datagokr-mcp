summary_user: 대구광역시에 있는 여성폭력 피해자 지원·상담기관 목록으로, 기관별로 구분·기관명·소재지·연락처·이용시간·서비스 대상과 내용을 한 행씩 담은 작은 CSV 파일이다(약 1.4KB). 가정폭력·성폭력·성매매 피해자나 주변 사람이 "지금 대구에서 밤이나 휴일에도 연락할 수 있는 상담·지원기관은 어디인가"를 찾을 때 쓰고, 복지 분석가가 지역 지원기관 분포를 정리할 때 쓴다. 실측 컬럼에 전역 조인 키나 기관 코드가 없어, 다른 사회복지시설 목록과는 기관명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 대구광역시에 위치한 여성폭력 피해자 지원 및 상담기관들의 핵심 정보를 포괄적으로 집약한 필수 데이터베이스입니다. 이는 가정폭력, 성폭력, 성매매 등 복합적이고 다양한 유형의 폭력으로 고통받는 피해자들이 위기 상황에서 자신에게 가장 필요하고 적합한 도움을 신속하고 정확하게 찾을 수 있도록 설계된 실질적인 안내서 역할을 합니다.데이터에는 각 기관의 공식 명칭, 정확한 소재지, 그리고 상담 예약 및 긴급 지원 요청을 위한 필수 연락처가 명시되어 있습니다. 평일 주간(09:00~18:00)에 심층적인 심리 상담과 회복 프로그램을 제공하는 전문 상담기관부터, 심야 시간이나 휴일 등 취약 시간대에 발생할 수 있는 긴급 위기 상황에 즉각적으로 대응하는 여성긴급전화, 해바라기센터와 같은 365일 24시간 운영되는 통합지원센터까지, 이용자의 상황과 필요에 따라 선택할 수 있도록 정보를 체계화했습니다.
