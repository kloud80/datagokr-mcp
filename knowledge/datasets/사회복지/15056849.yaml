summary_user: 경기도 내 장애인단기보호시설을 시설 1곳당 한 행으로 담은 목록으로, 시군명·시설명·인허가일자·영업상태·폐업일자·입소정원·자격소유 인원·총인원·소재지 주소와 위경도를 포함한다. 장애인 가족이 "우리 시군에서 일시 돌봄을 맡길 수 있는 단기보호시설이 어디에 몇 곳 있고 정원은 얼마인가"를 찾거나, 분석가가 시군별 정원·인력 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·위경도를 기준으로 다른 경기도 시군 단위 복지·인구 자료와 이름·코드 매핑으로 연결한다.
description_portal: 이 데이터는 경기도 내 장애인단기보호시설의 운영 현황을 정리한 자료입니다. 단기보호시설은 장애인 가족의 일시적인 돌봄 공백을 해소하고, 장애인에게 안정적인 보호 공간을 제공하는 복지시설로, 본 자료는 경기도 지역사회 내 해당 복지시설의 분포와 운영 실태를 파악하는 데 유용합니다. 시설 접근성 분석 및 지역별 복지 자원 배분 현황을 시각화할 수 있습니다. 입소정원과 자격소유 인원 등의 항목은 시설의 수용 및 인력 운영 역량을 보여주며, 이는 경기도의 복지 정책 수립, 지역 간 인프라 불균형 분석, 수요 예측 기반의 시설 확충 전략 수립 등에 활용될 수 있습니다.
