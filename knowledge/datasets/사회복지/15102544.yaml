description_portal: 신규 사학연금 가입자 현황(연도별 성별 나이별)을 나타내고 있는 데이터로 연도별, 성별(남,여), 나이별(10대~80대)로 세분화해서 신규 사학연금 가입자 현황을 제공하고 있습니다. 신규 사학연금 가입자 현황은 연도별로 데이터를 누적해서 제공하고 있기 때문에 매년 변화하는 가입자 증감률을 확인할 수 있으며, 이를 통해 가입자를 효율적으로 관리할 수 있습니다.또한 신규 가입자의 주요 특성을 파악하고, 미래 연금 재정 설계 및 연금 제도 개선을 위한 기초 자료로 활용될 수 있습니다. 본 데이터를 통해 공공기관의 정보 공개를 확대하고, 연금 제도의 투명성을 제고합니다. 학령인구 변화 및 교직원 연령 구성 변화 등 사회경제적 흐름을 반영한 정책 수립에도 기여할 것입니다.
