description_portal: '한국사회보장정보원에서 제공하는 기초생활보장 관련법에 의한 급여 또는 서비스를 받는 수급가구를 월별, 지역별, 수급자구분별, 주거유형별로 집계한 통계데이터입니다.데이터 구성은 통계연월, 통계시도명, 통계시군구명, 주거유형, 수급가구수, 수급자구분으로 구성되어 있습니다.이 데이터를 활용하여 기초생활보장 수급가구에 관해 수급자구분, 주거유형을 기준으로 지역별 현황 파악 및 추이 확인 측면의 분석이 가능합니다.기초생활보장 공공데이터는 저소득층의 생계, 의료, 주거, 교육 등 다양한 지원 현황을 담고 있어,복지 정책 효과 분석, 수급자 특성 분석, 지역 간 격차 파악 등 다양한 분석에 활용할 수 있습니다.1. 지역별 수급자 비율 분석2. 수급 유형별 분포 분석3. 연도별 수급자 추이 분석4. 가구 특성별 분석5. 기초생활보장 수급자와 자활사업 참여 연계 분석6. 수급자 비율과 지역 경제지표 비교 분석7. 복지 사각지대 분석 (예: 기준 미달자)'
