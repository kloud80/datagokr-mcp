summary_user: 청소년 자기도전 포상제 참여 청소년이 낸 활동개요서를 활동번호·활동순서별로 담은 건별 원천 데이터로, 활동 영역·구분·활동명, 시작·종료일자, 장소, 횟수, 승인·반려 상태와 일자, 박/일·숙박·식사·이동방법을 전국 범위로 제공한다. 포상제 운영기관이나 지도자가 '어떤 영역 활동이 많이 승인되고 반려되는지, 탐험·합숙 활동은 보통 몇 박으로 어떤 이동방법을 쓰는지'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 활동명·영역명 같은 이름 매핑이나 같은 기관 데이터로만 잇는다.
limits: 장소는 자유서술(plcCn)이고 행정구역 코드가 없는 비공간 데이터라 지역별 통계와 바로 붙이기 어렵다. 데이터는 이벤트 때 생성된 뒤 바뀌지 않는 성격이므로 수시 갱신을 기대하지 않는다. 개발계정 호출은 일 10,000회로 제한된다.
