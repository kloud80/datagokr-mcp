description_portal: 서울시설공단의 서울시립승화원에서 운영중인 서울시립화장시설의 2025년 전국 지역별 화장 통계자료입니다. 서울시립화장시설을 이용한 고인의 주민등록상 주소지를 기준으로 전국 18개 시·도별로 구분된 화장 건수를 포함하고 있으며, 이를 통해 서울시립시설의 광역적 이용 현황과 수도권 외 지역에서 유입되는 화장 수요의 규모를 파악할 수 있습니다. 이 통계는 지역 간 장사 인프라 격차 문제, 장례 서비스의 수도권 집중 현상 등 사회적 이슈를 반영하며, 장사 정책 수립, 공공시설 운영 계획, 장례 수급 조정, 고령화 대응 전략 등 다양한 행정 및 연구 분야에서 기초자료로 활용할 수 있는 공공데이터입니다.
