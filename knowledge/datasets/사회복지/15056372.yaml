summary_user: 제주특별자치도 제주시·서귀포시의 읍면동별 등록장애인 수를 남성·여성, 심한 장애·심하지 않은 장애로 나눠 담은 집계 파일입니다(약 1.9KB CSV). 제주 지역 복지 담당자나 분석가가 "어느 읍면동에 중증 장애인이 많이 사는가"를 확인해 복지시설·서비스 배치를 검토할 때 쓴다. 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 행정시·읍면동 이름을 맞춰 붙여야 하며, 같은 읍면동 단위의 주민등록 인구 통계와 이름 매핑으로 이어 쓴다.
