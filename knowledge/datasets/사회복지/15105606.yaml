summary_user: 인천광역시 서구 안에 있는 다함께돌봄센터를 센터 한 곳당 한 행으로 정리한 목록 파일로, 센터명·위치·전화번호·유형과 데이터 기준일자를 담는다(CSV 약 1.8KB 규모). 초등학생 자녀를 둔 서구 주민이 집 근처 방과후 돌봄센터와 연락처를 찾거나, 분석가가 구 안의 돌봄 인프라 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시설·인구 데이터와는 센터명이나 위치(주소) 문자열을 맞춰 연결해야 하며, 사회복지시설 공통 마스터를 참조해 묶어 쓴다.
description_portal: 본 데이터는 인천광역시 서구 내 다함께돌봄센터의 운영 현황을 정리한 공공복지 자료로, 센터명, 위치, 전화번호, 유형 등의 정보를 포함하고 있습니다.다함께돌봄센터는 주로 초등학생을 대상으로 방과후 돌봄서비스를 제공하고 있습니다. 돌봄 사각지대 해소를 위한 목적으로 제공하고 있는 이 공공데이터는 방과후 돌봄 인프라의 공간적 분포를 파악하고, 아동복지 정책 수립 및 양육지원 체계 강화, 지역 중심의 공공서비스 제공 계획 수립 등에 활용될 수 있다고 판단됩니다. 본 데이터는 연마다 정기적 갱신을 통해 최신정보를 반영하고 있습니다.
