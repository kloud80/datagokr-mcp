summary_user: 전남광주통합특별시 광양시에 있는 아동복지시설을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 1,746바이트)로, 시설명·시설장·주소·정원·연락처가 들어 있다. 광양시에서 아동을 맡길 수 있는 시설이 어디에 있고 정원이 몇 명인지 알아보려는 보호자나, 지역 아동 돌봄 시설의 공급 규모를 파악하려는 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 시설명·주소를 맞춰 보거나 같은 기관 자료끼리만 연결하며, 사회복지시설 공통 마스터를 참조할 때 보조 자료로 쓴다.
description_portal: 아동복지시설 현황 데이터는 아동의 보호, 교육, 복지 증진을 목적으로 운영되는 시설에 대한 기본 정보를 담고 있습니다. 각 시설의 명칭, 시설장 이름, 소재지 주소, 정원(수용 가능 인원), 연락처 등이 포함되어 있어 시설별 운영 규모와 현황을 쉽게 파악할 수 있습니다. 이 자료는 아동복지 서비스 접근성 개선, 시설별 수요와 공급 분석, 복지정책 수립, 지역 아동 보호체계 강화 등에 활용될 수 있습니다. 또한 부모와 보호자가 아동복지시설을 찾을 때 참고할 수 있는 중요한 정보원이 되며, 지자체의 아동 보호 및 돌봄 서비스 확대 계획에도 기초 자료로 쓰입니다.
