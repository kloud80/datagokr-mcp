summary_user: 국제청소년성취포상제를 운영하는 기관별로 시설명·상위시설명, 참여희망수, 모집 시작·종료일, 단계·상태, 허가 여부를 담은 전국 범위의 오픈 API 데이터다. 청소년과 보호자가 지금 모집 중인 성취포상제 운영기관이 어디인지, 어느 단계로 참여할 수 있는지를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 청소년 시설 데이터와는 시설명(fcltNm)·상위시설명을 이름으로 맞춰 이어야 한다.
description_portal: 국제 청소년 성취포상제 운영기관 정보 조회 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 시설명, 상위시설명, 첨여희망수, 모집시작일자, 모집종료일자, 단계명, 상태명, 허가여부의 내용을 확인할 수 있습니다.성취포상제를 실제로 운영하고 있는 기관의 정보를 종합적으로 조회할 수 있는 데이터로, 이를 통해서 청소년 및 보호자는 지역 내 운영기관의 모집 여부를 사전에 확인하고, 참여 가능한 기관을 쉽게 탐색할 수 있습니다. 운영기관 정보는 수요자와 공급자 모두에게 유용한 기준을 제공하며, 효율적인 참여 연계와 정책 조정에 전략적으로 활용될 수 있습니다.
