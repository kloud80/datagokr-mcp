summary_user: 경기도 내 여성 상담기관(성폭력·가정폭력·통합상담소 등)을 기관 한 곳당 한 행으로 담은 시설 목록으로, 시군명, 상담 유형, 시설명, 전화번호, 도로명·지번 주소, 우편번호, 위도·경도 좌표가 들어 있다. 폭력 피해 여성이나 지원 실무자가 '우리 시군에서 가까운 성폭력·가정폭력 상담소가 어디이고 연락처가 무엇인가'를 찾을 때 쓰고, 분석가는 시군별 상담기관 분포와 접근성을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 이름·코드(SIGUN_CD)나 주소·좌표로 맞춰 이어 쓰며, 사회복지시설 공통 마스터와 함께 참조한다.
description_portal: 경기도의 여성 상담기관 현황입니다. 여성상담기관의 시설명, 상담소 유형, 소재지주소(도로명, 지번), 기관전화번호 등의 정보를 제공합니다.이 데이터는 경기도 내 여성상담기관의 운영 현황을 정리한 자료로, 여성폭력 피해자 지원을 위한 전문 상담소의 정보를 포함하고 있습니다. 주요 항목은 시군명, 여성상담기관시설명, 기관 전화번호, 상담유형(가정폭력, 성폭력, 통합상담 등), 도로명 및 지번 주소, 우편번호, 위도·경도 좌표(WGS84) 등으로 구성되어 있으며, 각 기관은 폭력 피해 여성을 대상으로 심리 상담, 법률 지원, 보호 연계 서비스 등을 제공합니다. 데이터는 여성 안전망 구축, 상담기관 분포 현황 분석, 정책 대상 서비스망 개선, 피해자 접근성 향상 등에 활용될 수 있으며, ‘성폭력상담소’, ‘가정폭력상담소’, ‘통합상담소’ 등 다양한 상담 유형을 통해 복합적 피해에 대응하는 지원 체계를 확인할 수 있습니다. 본 자료는 여성가족부 또는 지방자치단체 여성복지 부서가 수집한 공공데이터입니다.
