summary_user: 경기도 내 특수교육지원센터를 기관 한 곳당 한 행으로 담은 현황 목록으로, 시군명, 기관명, 설치장소, 전화번호, 홈페이지, 지번·도로명 주소, 우편번호, WGS84 위도·경도를 포함한다. 특수교육 대상 자녀를 둔 학부모가 "우리 시군의 특수교육지원센터는 어디에 있고 연락처는 무엇인가"를 찾거나, 분석가가 시군별 센터 분포와 설치가 더 필요한 지역을 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 특수교육지원센터의 현황을 정리한 자료로, 특수교육 대상 학생을 위한 지역 단위 교육 행정 지원 기관의 정보를 제공합니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소와 도로명주소, 우편번호, WGS84 좌표(위도·경도), 설치장소, 전화번호, 홈페이지 URL이 포함되어 있습니다. 각 특수교육지원센터는 교육지원청 산하에 설치되어 있으며, 특수교육 대상 아동·청소년을 위한 진단·평가, 특수교육 관련 서비스 지원, 학부모 상담 및 교사 연수 등의 기능을 수행합니다. 이를 통해 경기도 내 특수교육지원센터의 지역 분포를 확인할 수 있으며, 학교와 가정, 지역사회 간 연계를 강화하여 특수교육의 질적 향상에 기여합니다. 해당 데이터는 교육 행정 연구, 센터 설치 필요 지역 검토, 특수교육 자원 분포 분석 등에 활용될 수 있습니다.
