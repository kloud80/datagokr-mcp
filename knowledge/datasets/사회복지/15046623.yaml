description_portal: '○ 통계개요* 통계명 : 외국인 및 재외국민 건강보험 적용인구 현황* 통계종류 : 외국인, 재외국민 건강보험 가입자현황을 제공하는 일반, 보고통계* 근거법령 : 국민건강보험법* 작성목적 : 건강보험제도와 사회보장분야의 정책자료 및 보건의료정책의 기초자료로활용* 조사체계 : 국민건강보험공단 시군구 지사→국민건강보험공단* 공표주기 : 매년* 공표범위 : 지역- 서울시내용 - 외국인, 재외국민의 건강보험 가입자현황 등○ 용어설명* 직장 : 근로자 및 사용자, 공무원?군인?사립학교 교직원, 피부양자* 지역 : 가입자중 직장가입자와 그 피부양자를 제외한 자* 피부양자 : 직장가입자에 의하여 주로 생계를 유지하는 보수 또는 소득이 없는 자로보험료를 부담하지 않는 자* 세대주(지역) : 세대별 주민등록표에 나타나는 구성원을 대표하는 자* 외국인 : 출입국관리법에 의하여 외국인등록을 한 자 또는 재외동포의 출입국과 법적지위에 관한 법률에 의하여 국내거소신고를 한 외국국적동포* 재외국민 : 재외동포의출입국과법적지위에 관한 법률에 따른 자 중 국내에 거주하는자로서 국내거소신고를 한 자○ 기타* 연도말 자격유지 외국인을 대상으로 함* 통계표 중 전년도와 일치하지 않는 것은 금년호에서 정정된 것임○ 출 처 : 국민건강보험공단 「건강보험통계」'
