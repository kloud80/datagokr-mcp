description_portal: 과처도시공사에서 운영하는 생활공구 무료대여 서비스의 기본 현황 정보를 체계적으로 제공하는 데이터셋입니다. 각 공구대여소에 대한 공구대여소 명칭, 도로명주소, 보유 공구 종류, 대여 가능 기간, 운영시간, 대표 연락처, 관련 홈페이지 등 이용에 필요한 핵심 정보를 포함하고 있습니다.해당 데이터는시민의 생활 편의 증진 및 자원 공유 활성화공구대여소 위치 및 운영 정보의 사전 확인 지원공구 종류 및 대여 조건에 대한 정보 접근성 향상외부 서비스(지자체 포털, 공공지도, 민간 지도·길찾기 플랫폼 등)와의 연계 활용을 목적으로 공개하며, 보유 공구 변동, 운영시간 조정, 대여기간 변경, 연락처 변경 등 서비스 내용이 변경될 경우 신속히 최신화할 수 있도록 표준화된 구조로 구성되어 있습니다.
