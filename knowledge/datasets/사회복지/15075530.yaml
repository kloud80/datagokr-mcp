summary_user: 전국 장애인 주간이용시설 849곳을 시설 한 곳당 한 행으로 담은 건별 목록으로, 법인명·시설명·주소·연락처와 이용자 정원·현원, 종사자 정원을 싣는다. 장애인 가족이나 복지 담당자가 우리 지역에 낮 시간 활동·교육을 지원하는 시설이 어디에 있고 정원이 얼마인지 찾을 때 쓴다. 시설 주소(address)를 조인 키로 삼아 다른 시설·서비스 데이터와 주소 기준으로 이어 쓰며, 별도의 시설 코드나 코드표는 없다.
description_portal: 보건복지부에서 2024년 4월 기준, 장애인주간이용시설(전국)의 법인명, 시설명, 시설주소, 전화번호, 팩스번호, 이용자 정원, 이용자 현원, 종사자 정원에 관한 정보를 제공하고 있습니다. 장애인 주간 이용시설은 일상생활 및 사회생활을 영위하는 데 지원이 필요한 장애인에게 주간(낮) 시간동안 활동위주의 프로그램이나 교육지원 등의 기회를 제공하고 또한, 장애인 가족구성원이 안심하고 사회활동 및 경제활동을 영위할 수 있도록 장애인 주간이용시설의 운영에 필요한 사항에 대해 정하고 있습니다.
