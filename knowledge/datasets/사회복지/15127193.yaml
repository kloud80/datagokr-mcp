summary_user: 김천시 관내 아동양육시설을 시설 한 곳당 한 행으로 정리한 목록으로, 명칭·지번/도로명 주소·전화·팩스·위도·경도·데이터기준일을 담으며 파일 크기는 537바이트에 불과한 소규모 자료다. 김천시에서 보호가 필요한 아동을 맡는 양육시설이 어디에 있고 연락처가 무엇인지 확인하거나, 복지시설 위치 지도를 만들 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설 명칭·주소 문자열이나 시도·시군구 이름으로 맞추거나 좌표로 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 아동복지법 제52조에 따라 보호가 필요한 아동·청소년을 위한 복지서비스를 제공하는 김천시 관내 아동양육시설의 현황을 정리한 자료입니다.아동양육시설은 보호자가 없거나 적절한 보호를 받지 못하는 아동을 대상으로 주거, 교육, 상담, 정서 지원, 생활지도를 포함한 전인적 복지 서비스를 제공하는 기관으로, 공공복지 및 사회적 돌봄 체계의 핵심 인프라로 기능합니다.제공 항목에는 각 시설의 소재지 주소(도로명 또는 지번), 대표 전화번호, 위도·경도 좌표, 자료 기준일자 등이 포함되어 있으며,복지시설 위치기반 지도 구축, 응급 지원 연계 체계 설계, 민간 복지 자원과의 연결 등 다양한 행정 및 민간 활용에 적합합니다.
