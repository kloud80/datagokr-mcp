description_portal: 해당 데이터는 사회적 취약계층의 분포와 지원 현황을 파악하기 위한 기초자료로 활용됩니다. 본 데이터는 행정동 단위로 한부모가족지원, 차상위본인부담경감, 차상위자활, 차상위계층확인서 발급, 차상위장애인 등 주요 차상위 유형별 가구 수 및 인구 수를 제공합니다. 이를 통해 지역별 복지 수요의 집중도, 정책 대상의 분포, 복지 예산의 우선순위 설정 등에 유용하게 활용할 수 있으며, 복지 사각지대 해소와 맞춤형 정책 수립에 필수적인 자료입니다. 지자체 및 복지기관은 본 데이터를 기반으로 한 동별 실태분석과 복지자원 배분의 근거자료로 삼을 수 있습니다. 데이터는 정기적으로 갱신되어 최신 정책과 연계 가능합니다.
