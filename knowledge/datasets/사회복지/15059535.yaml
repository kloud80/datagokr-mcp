summary_user: 경기도 내 장애인 거주시설을 시설 한 곳당 한 행으로 담고, 장애유형·시설명·지번/도로명 주소·좌표·입소 정원과 현원·종사자 정원과 현원·설치신고일·운영 법인명을 포함한다. 복지 담당자나 보호자가 '우리 시군의 지적장애인 거주시설 중 정원 대비 입소 현원이 덜 찬 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 시군 코드(SIGUN_CD)·시군명으로 다른 경기도 시군 통계와 맞추거나 좌표·주소로 지도 데이터에 겹쳐 쓰고, 법인명은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 장애유형별 거주시설 현황을 정리한 자료로, 지적장애인시설, 시각장애인시설, 지체장애인시설 등 다양한 장애유형을 지원하는 거주시설 정보를 제공합니다. 주요 항목에는 시군명, 기관구분명, 기관명, 소재지 지번주소와 도로명주소, 소재지 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL, 입소정원수 및 입소현원수, 종사자 정원수 및 현원수, 설치신고일, 법인명정보가 포함되어 있습니다. 이를 통해 장애유형별 시설 운영 현황과 지역 분포를 파악할 수 있으며, 정원 대비 현원 분석을 통해 시설 포화 정도와 추가 지원 필요성을 확인할 수 있습니다. 또한 법인명 및 설치일자 정보를 통해 각 시설의 설립 배경과 운영 주체를 알 수 있어 행정 관리 및 복지정책 수립에 활용할 수 있습니다.
