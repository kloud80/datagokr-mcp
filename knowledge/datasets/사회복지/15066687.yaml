summary_user: 부산광역시가 지원하는 노숙인 시설을 시설 한 곳당 한 행으로 담은 작은 CSV 파일(1,593바이트)로, 시설 종류·시설명·도로명주소·정원·전화번호·위도·경도·이용/생활시설 구분이 들어 있다. 노숙인 지원 단체나 복지 담당자가 "부산에서 가까운 노숙인 이용시설은 어디이고 연락처는 무엇인가"를 확인하거나 시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없으므로 다른 사회복지시설 현황과는 시설명·주소로 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 부산광역시에서 지원하는 12개 노숙인 시설 현황을 안내하는 자료입니다. (전국 지자체 현황 등 타 지역의 노숙인 시설은 해당 지자체에 문의가 필요합니다)노숙인 시설의 구분(노숙인 시설 종류), 시설명(노숙인시설명칭), 도로명 주소, 정원(이용시설의 경우 평균 이용 인원을 의미하며 생활시설은 정원임), 전화번호, 위도, 경도(위치 정보), 비고(사회복지시설의 종류인 이용시설, 생활시설), 그리고 데이터 기준일자까지 정보를 제공합니다. 노숙인 시설별 현황 파악 및 지역별 위치 확인, 또한 해당 시설의 전화번호를 제공하고 있어 시설과 유기적인 연락을 할 수 있고 정책 수립에 기초 자료로 활용 할 수 있습니다.
