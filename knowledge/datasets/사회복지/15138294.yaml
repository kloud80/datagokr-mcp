summary_user: 자활근로사업에 참여하는 기관을 기관 한 곳당 한 행으로 담은 기관 목록 파일로, 시설번호·시설명·시설유형·사업자등록번호·시도와 시군구 코드·주소·전화번호·센터장명·폐지와 재개 일자를 포함하며 범위는 전국이다. 자활사업 분석가나 지자체 담당자가 "우리 시군구에 운영 중인 자활 기관은 어디이고 어떤 유형인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 압축 파일 안 코드북으로 시설유형·시도·시군구 코드를 풀어 쓰고 다른 데이터와는 시설명·주소·사업자등록번호 같은 이름·코드 매핑으로만 잇는다.
description_portal: 보건복지부에서 자활근로사업에 참여하는 기관과 2019부터 2024년까지 입사한 종사자 정보를 제공합니다.<데이터 이용 시 참고사항>1. 해당 압축 파일 내 코드북이 함께 첨부되어 있으므로 "자활시설번호", "시설유형코드", "시도코드", "시군구코드"는 코드북을 참고 바랍니다.2. 데이터 값이 공란인 부분은 미집계 데이터(해당없음)로 공란 처리하였습니다.3. 해당 파일 내에 인터넷 상으로 기 공개된 시설, 사업자등록번호, 전화번호, 우편번호, 센터장명, 주소 등 공개 대상인 정보가 포함되어 있습니다.
