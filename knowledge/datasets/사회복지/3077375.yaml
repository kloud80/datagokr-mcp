summary_user: 대구광역시 달서구가 운영하는 청소년 이용시설을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 2KB)로, 시설명·소재지·위도·경도·개관일자·시설규모·주요시설·위탁운영단체·연락처·운영상담시간을 포함한다. 달서구 주민이나 보호자가 '우리 동네 청소년쉼터·청소년 시설이 어디에 있고 언제 상담받을 수 있나'를 확인하거나, 분석가가 구 단위 청소년 시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 매칭이나 좌표 기반 공간 결합으로 잇고, 지역 단위 청소년 통계와는 달서구라는 시군구 단위로 연결한다.
description_portal: 대구광역시 달서구에서 운영하는 청소년 이용시설에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 시설명, 소재지, 개관일자, 시설규모, 주요시설,  위탁운영단체, 연락처, 운영상담시간, 홈페이지, 주관부서, 기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료는 달서구청 홈페이지(www.dalseo.daegu.kr)를 통해 분야별정보> 복지> 청소년 > 이용시설> 달서구청소년쉼터에서 확인할 수 있습니다.
