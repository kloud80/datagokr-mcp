summary_user: 전국 청소년 기관이 운영하는 자유학기제 활동 프로그램을 프로그램 한 건 단위로 담으며, 운영연도·프로그램명·영역·운영방법·주요내용·운영기간·차수 정원·장소·참여비용·담당자 연락처가 들어 있다. 학교나 지자체 담당자가 "우리 지역에서 참여비용이 낮고 정원이 넉넉한 진로체험 프로그램은 무엇이고 누구에게 문의하나"를 찾을 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 같은 기관의 기관일련번호(instSn)나 장소명·기관명 같은 이름 매칭으로만 잇는다.
description_portal: 청소년활동 자유학기제 활동 정보 서비스 조회를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 운영연도, 프로그램명, 운영방법명, 주요내용, 운영기간, 차수정원 수, 장소명, 참여비용, 담당자명, 전화번호 등의 내용을 확인할 수 있습니다.자유학기제 활동 정보 서비스는 세부 정보를 포함하고 있어 체험 중심 교육 운영에 실질적인 참고 자료가 됩니다. 교육기관이나 지자체는 이를 바탕으로 맞춤형 진로체험 프로그램을 구성할 수 있으며, 참여비용과 장소정보는 예산 편성과 접근성 검토에도 큰 도움이 됩니다. 청소년 맞춤형 활동 모델을 설계하는 데 있어 현장 기반 정보를 제공한다는 점에서 폭넓게 활용될 수 있습니다.
