summary_user: 부산광역시 해운대구에 설치신고하고 운영 중인 노인교실을 시설 한 곳당 한 행으로 담은 목록 파일로, 기관명·주소·연락처·홈페이지가 들어 있다(csv 약 1KB 규모의 소량 데이터). 해운대구에 사는 어르신이나 가족이 "집 근처에서 취미·건강 학습 프로그램을 듣는 노인교실이 어디 있고 연락처가 무엇인가"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 기관명이나 주소(주소를 좌표로 바꾸는 지오코딩 포함)로 맞춰 이어야 하며, 시군구 단위 지역 통계와 함께 보는 데 쓴다.
limits: 시설 코드 같은 공통 식별자가 없어 다른 데이터와 정확히 연결하려면 이름·주소 매칭에 의존해야 한다. 범위가 해운대구 한 곳뿐이어서 부산 전체나 다른 구와 비교하려면 각 구의 자료를 따로 모아야 한다.
