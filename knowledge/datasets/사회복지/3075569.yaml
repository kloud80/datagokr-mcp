description_portal: 노인복지법 제36조에 의한 노인여가복지시설 중 노인교실은 노인들의 사회활동 참여욕구를 충족시키기 위하여 건전한 취미생활ㆍ노인건강유지ㆍ소득보장 기타 일상생활과 관련한 학습프로그램을 제공함을 목적으로 하며, 노인의 건강한 신체와 건전한 취미생활에 관한 문화여가프로그램을 제공하는 것으로 부산광역시 해운대구에 설치신고하여 운영중인 노인교실에 대한 데이터를 제공하고 있습니다. 해당 데이터는 노인교실 수 시설명, 위치(주소), 전화번호(연락처) 등에 대한 정보를 제공하고 있습니다.
