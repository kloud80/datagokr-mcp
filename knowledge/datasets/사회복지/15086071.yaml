description_portal: 본 데이터는 대구광역시 수성구의 각 동(행정동)을 기준으로 집계된 장애인 등록 현황 통계를 정리한 자료로, 동명, 장애유형(지체·시각·청각·지적·자폐성 등), 장애 정도(심한·중등도·경증), 등록자 수, 남·녀 성별 수, 연령대별 인원 분포(청년·중장년·노년 등), 등록 기준일자, 데이터 기준일자 등의 항목으로 구성된다. 이 자료는 각 동의 장애인 분포를 유형과 정도, 성·연령별로 상세히 분석할 수 있도록 설계되어 있으며, 이를 통해 동별 복지 수요 파악, 장애인 맞춤형 정책 수립, 생활SOC 시설 배치, 지원 대상 선별 기준 마련, 복지 예산 배정 등에 활용 가능하다. 또한 성별 및 연령대별 통계를 기반으로 장애 정도별 서비스 요구 분석, 연도별 등록 추이 모니터링, 동 간 비교 연구, 민원·복지 상담 자료로도 활용할 수 있다. 수성구청은 정기적으로 등록 현황을 갱신하며, 본 데이터는 복지부서, 장애인 단체, 정책 연구자, 지역 주민 등 다양한 주체에게 근거 기반 복지 행정을 위한 기초자료로 제공됩니다.
