description_portal: '- 공공데이터  요청에 따라 직무상 보관 확인 가능한 "2006년도 전라남도 유형별 어린이집(보육시설) 개소수"를 공개 결정합니다.- 모든 어린이집 정보 확인 방법: 보육정보공개포털(아이사랑), 유치원알리미 등 공공 포털에서 검색할 수 있습니다.- 공공형 어린이집: 공공형으로 지정된 어린이집은 운영비 및 인건비 보조, 교육 및 환경 강화 지원 등을 받으며 전라남도 공공데이터포털에서 목록 확인 가능합니다.- 선택 시 참고 요소- 설립 형태(국공립·공공형·민간 등)- 통학 차량 운영 여부 및 초기/연장 보육 옵션- 교직원 구성, 평가 등급, 놀이시설, 특수교사 유무 등- 전라남도청비둘기어린이집: 직장어린이집,  전라남도청 직원 자녀 대상- LH빛가람어린이집: 국공립 공공형,  나주 지역 공공 보육 강화'
