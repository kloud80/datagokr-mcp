summary_user: 서울장애인콜택시의 탑승건수를 일자별·1시간 단위 시간대별(하루 24개 구간)로 합산한 집계 데이터로, 시설명·일자·시간대·탑승건수 4개 항목을 CSV 파일(약 37만 바이트)로 담는다. 교통복지 담당자나 분석가가 '평일 출퇴근 시간대와 주말에 장애인콜택시 수요가 어떻게 다르고, 차량·인력을 어느 시간대에 더 배치해야 하나'를 판단하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 일자·시간대를 기준으로 맞추거나 시설명을 이름으로 매핑해 이어 쓴다.
description_portal: 서울시설공단_장애인콜택시 시간대별 탑승건수 데이터는 서울장애인콜택시 일별 시간대별 탑승건수로 구성된 데이터입니다.이 데이터는 시설명, 일자, 시간대(1시간 단위 구간), 탑승건수 4개 항목으로 구성되며, 하루 24개 시간대별로 발생한 탑승 건수를 합산한 값을 제공합니다.이를 통해 시간대별 이용 패턴, 출퇴근 집중 시간대 수요, 주말·평일 이용 특성 등을 파악할 수 있으며, 교통복지 서비스 수요 예측, 배차 효율성 제고, 운영 인력 및 차량 배치 정책 수립, AI 기반 수요관리 모델 개발 등에 활용 가능합니다.
