summary_user: 자유학기제와 연계해 청소년활동을 운영하는 기관을 기관 단위로 담은 건별 목록으로, 기관명·전화번호·운영연도·시군구코드·등록일시를 전국 시군구 범위로 제공한다. 학교 교사나 청소년 정책 담당자가 '우리 시군구에서 올해 자유학기제 활동을 운영하는 기관은 어디이고 연락처는 무엇인가'를 확인하거나 지역별 운영기관 분포를 비교하는 데 쓴다. 시군구코드(sggCd)를 조인 키로 지역 통계나 다른 청소년 시설·활동 데이터와 시군구 단위로 이어 쓴다.
limits: 기관 주소·좌표나 프로그램 내용은 없어 시군구보다 세밀한 위치 분석이나 프로그램별 수요 분석은 이 데이터만으로는 어렵다. 이벤트 단위로 생성된 뒤 바뀌지 않는 데이터로 분류되어 있어, 운영연도(operYr)를 확인해 해당 연도 기준으로 해석해야 한다. 호출은 포털 활용신청 후 serviceKey로 하며 개발계정은 하루 10,000회로 제한된다.
