description_portal: '○ 통계개요* 통계명 : 혼인종류 및 외국인 국적별 혼인* 통계종류 : 서울시 외국인과의 혼인종류별ㆍ국적별로 제공하는 지정ㆍ조사통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 출생, 사망,혼인, 이혼에 대한 현황을 파악하여, 국가의 인구ㆍ주택ㆍ보건ㆍ사회복지ㆍ교육ㆍ교통 등에 관한 정책수립 및 민간기업의 경영계획 수립에 필요한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울시 혼인종류별ㆍ국적별 외국인과의 혼인 현황 등○ 용어설명○ 기 타* 통계표상 "*"표시는 5건 이하, "**"은 6건 이상인 자료 중, 해당자료에 의해 "*"의계산이 가능한 경우 "**"로 처리함. 단, "*"이 미상인 경우와 0견인 경우에는적용하지 않음* 위 혼인 건수는 통계의 일관성을 확보하고 국제비교가 가능하도록 자료원 및집계방식을 단일화하는 등 시계열을 보정한 결과로 기존의 자료와 차이가 있음'
