summary_user: 경기도 등록장애인 수를 기준연도(STD_YY)와 연령대별로 묶어 전체·남성·여성 인원으로 나눈 집계 자료이며, 포털 설명상 매년 12월 말 기준으로 산출한다. 복지 정책 담당자나 분석가가 '경기도에서 60대 이상 등록장애인이 얼마나 되고 남녀 차이는 어떤가'처럼 고령 장애인 돌봄 수요나 성별 맞춤 재활 정책의 근거를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 기준연도·연령대 같은 이름 매핑으로만 맞춰 쓴다.
description_portal: 이 데이터는 경기도 등록장애인을 연령과 성별별로 집계한 현황 자료입니다. 보건복지부와 경기도청 장애인복지과가 제공하며, 매년 12월 말 기준으로 산출됩니다.세부 항목에는 연령, 전체 등록장애인 수, 남성 장애인 수, 여성 장애인 수가 포함됩니다. 예를 들어, 40대 연령대의 등록장애인이 총 2만 명일 경우, 남성 1만2천 명, 여성 8천 명으로 구분되어 기록됩니다.이 데이터는 연령·성별에 따른 장애 발생 특성을 파악하는 데 활용할 수 있습니다. 예를 들어, 60대 이상 연령층에서 등록장애인 비율이 급격히 증가한다면, 이는 고령 장애인 복지·돌봄 정책을 강화할 근거가 됩니다. 또한, 성별 간 차이가 뚜렷하게 나타날 경우, 남성·여성별 맞춤형 건강관리 및 재활 정책을 수립하는 데 참고할 수 있습니다.특히, 청소년(10대 이하)에서 특정 성별의 비율이 높게 나타나면 특수교육 및 초기 치료 지원 정책으로 연결될 수 있으며, 고령층에서는 노인장애인 복지 서비스 수요를 예측할 수 있습니다.
