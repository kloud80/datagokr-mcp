summary_user: 전국 어린이집별·회계연도별 세입·세출 예산과 결산(예산액·전년도 대비 증감·수납·미수납·지출·잔액)을 담고, 보육료·기본보육료·인건비·급간식비 등 수입·지출 항목별 금액과 비율도 함께 담은 2021년 2월 기준 파일입니다. 보육 정책 분석가나 학부모가 특정 어린이집의 수입이 보육료에 얼마나 몰려 있는지, 지출 중 급간식비와 인건비 비중이 어느 정도인지 비교할 때 쓴다. 실측 컬럼에 어린이집코드 같은 공통 조인 키가 없어서 다른 어린이집 기본정보·평가 데이터와는 시도와 기관명(기관명)을 이름으로 맞춰 이어 써야 한다.
