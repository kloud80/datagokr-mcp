summary_user: 대구광역시 서구 관내 다함께돌봄센터를 시설 한 곳당 한 행으로 담은 현황 파일로, 주소(지번·도로명), 연면적, 전화번호, 설치신고일·개소일, 운영방법과 수탁기관, 운영인력, 정원, 장애아동 인원, 이용대상, 운영시간·운영내용을 포함한다. 서구에 사는 초등학생 학부모가 집 근처 방과후 돌봄센터의 위치·운영시간·정원을 확인하거나, 지자체·분석가가 행정동별 돌봄시설 분포를 보고 돌봄서비스 확충을 기획하는 데 쓴다. 전역 조인 키나 기관 코드는 없어서 다른 데이터와는 시설명이나 행정동·법정동·주소를 기준으로 맞춰 이어야 하며, 사회복지시설 공통 마스터나 지역아동센터 등 다른 아동복지시설 현황과 함께 보는 방식이 적합하다.
description_portal: 다함께돌봄센터는 소득과 관계없이 돌봄이 필요한 초등학생을 대상으로 방과후 돌봄서비스를 제공하는 지역사회 중심의 돌봄시설입니다.개방 데이터는 관내 다함께돌봄센터 현황(시설 주소, 면적, 전화번호, 설치신고일, 운영방법, 수탁기관, 운영인력, 개소일, 정원, 장애아동인원, 이용대상, 운영시간, 운영내용) 을 포함하고 있습니다.개방데이터를 공유함으로써 돌봄기관 현황을 파악하여 지역 특성에 맞는 맞춤형 돌봄서비스를 기획하는데에 활용될 수 있습니다.자세한 사항은 대구광역시 서구청 홈페이지 https://www.dgs.go.kr/portal/contents.do?mid=0303080000 에서 확인할 수 있다.
