summary_user: 전국 e새일 새일센터 187곳을 센터별 한 건씩 담은 시설 원천 데이터로, 센터 이름·주소·센터유형·센터장명·연락처·시군구 코드를 제공한다. 경력단절여성이 사는 지역에서 가까운 취업 지원 거점이 어디인지 찾거나, 분석가가 지역별 새일센터 분포를 살필 때 쓴다. 도로명주소(addr)·지번주소(lotnoAddr)·상세주소(daddr)가 주소 조인 키라서 다른 사회복지시설 주소 자료와 주소로 이어 쓰고, 시군구 코드(cntrSggCd)로 지역 단위 집계에 붙인다.
description_portal: 경력단절여성등의 경제활동 촉진법 제13조 제1항과 관련하여 e새일센터 시설 정보를 제공하는 오픈 API형 데이터입니다.   해당 개방데이터는 e새일 새일센터의 이름, 주소, 센터유형, 센터장명, 센터 연락처, 시군구 코드를 조회할 수 있습니다.  경력단절여성을 위한 취업 지원 거점 정보를 한눈에 파악할 수 있어, 이용자 접근성 향상과 지역 기반 맞춤형 서비스 연계에 기여합니다. 또한 고용 정책 수립, 관련 기관 간 협력 체계 강화, 복지 자원 분포 분석 등 다양한 행정 및 연구 목적으로 활용될 수 있습니다.
