summary_user: 청소년 상담 사례를 청소년 상태별로 나눠 성격 문제 현황을 집계한 차트형 통계로, 제목·구분·X축·Y축 항목과 그 값(chtVl)을 축 순번과 함께 담는 전국 단위의 비공간 데이터다. 상담기관 실무자나 정책 분석가가 '학교 밖·위기 등 상태에 따라 청소년의 성격 문제가 어떻게 다르게 나타나는가'를 확인해 상담 접근법이나 집단상담 대상 선정 기준을 세울 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 같은 기관의 다른 청소년 상담 현황 통계와 항목 이름을 맞춰 비교하는 방식으로만 이어 쓴다.
description_portal: 청소년 상담 청소년 상태별 성격 문제 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.청소년의 상태별 성격 문제 현황은 성격 유형별 갈등 양상 및 심리적 불안정 요소를 분석하는 데 핵심적인 자료로 기능합니다. 개별 성향에 따른 상담 접근법을 마련하거나, 집단 상담 구성 시 대상자 선정 기준을 설정하는 데 도움이 되며, 정서조절 훈련 프로그램 개발이나 학교폭력 예방 전략 수립에도 참고할 수 있습니다. 심리적 자아 확립을 위한 체계적인 지원 방안 마련에 활용될 수 있습니다.
