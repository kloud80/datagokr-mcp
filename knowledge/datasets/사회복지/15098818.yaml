description_portal: 보건복지부에서 관리하는 보건복지현황 중 2015년~2024년까지 시도별 보호대상아동 발생 및 보호조치 현황(시도구분, 년도, 보호내용_시설보호_장애아동시설, 보호내용_시설보호_양육시설 등, 등)에 대한 정보를 제공 합니다.<통계 이용 시 주의사항>○보호대상아동 통계：보호조치 아동의 발생원인 = 보호조치 현황(시설입소 + 가정보호)○아동：아동복지법 제3조에 의거하여 “아동”은 18세 미만의 사람○보호대상아동：보호자가 없거나 보호자로부터 이탈된 아동 또는 보호자가 아동을 학대하는 경우 등 그 보호자가 아동을 양육하기에 적당하지 아니하거나 양육할 능력이 없는 경우의 아동○비행･가출･부랑아：비행청소년으로 법원에서 의뢰하였거나 비행을 할 우려가 있어 보호자가 시설에 입소 의뢰한 아동 및 가정의 결손･결함 등으로 인한 가출 또는 부랑아동○학대, 부모빈곤, 실직 등：보호자의 학대 및 친권 박탈로 보호된 아동 또는 저소득층, 빈곤가정의 아동으로 시설에 입소한 아동
