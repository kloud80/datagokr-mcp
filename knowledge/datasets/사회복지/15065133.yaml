summary_user: 인천광역시 군·구별로 양로시설, 노인공동생활가정, 노인복지주택의 시설 수, 입소 정원·현원, 종사자 수와 노인복지주택의 분양·입주 세대 수를 집계한 통계 파일입니다(CSV 약 707바이트의 작은 표). 지역 복지 담당자나 분석가가 "인천 어느 군·구에 노인 주거시설 정원 대비 입소율이 높고 시설이 부족한가"를 파악하는 데 쓴다. 전역 조인 키나 행정구역 코드가 없어 군·구 이름(군구별)을 매핑해 다른 지역 통계와 이어 붙여야 한다.
description_portal: '인천광역시가 제공하는 노인주거복지시설 현황 공공데이터는 관내 군/구별로 설치·운영 중인 노인복지주택, 양로시설, 노인공동생활가정 등 노인 주거 및 의료복지 시설의 시설 수, 입소 정원 및 현원, 종사자 수 등을 상세히 집계한 통계 자료입니다. 이 데이터는 지역 노인 복지 서비스 인프라의 현황과 시설별 수용 능력 및 이용률을 파악하고, 지역별 노인 복지 수요에 맞는 정책 수립에 필수적인 기초 자료로 활용되는 것을 목적으로 합니다.<주요구성항목>-시설별 구분: 시설 종류가 양로시설, 노인공동생활가정, 노인복지주택 등으로 구분됩니다.-행정구역: 데이터가 강화군, 옹진군, 중구, 연수구, 남동구, 부평구, 계양구, 서구 등 인천광역시 내 군/구별로 분류됩니다'
