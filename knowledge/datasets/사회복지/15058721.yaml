summary_user: 경기도 특수학급 학생 수를 기준년도와 학교유형(국립·공립·사립)별로 묶어, 유치원 연령별·초중고 학년별·전공과 연차별 인원과 총학생수로 담은 시도 단위 집계 자료다. 특수교육 정책 담당자나 분석가가 '최근 몇 년 사이 경기도 공립 초등 특수학급의 저학년 학생이 늘었는지'처럼 학년별 수요 변화와 국공사립 간 차이를 보고 학급 설치·교원 배치를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 자료와는 기준년도(STD_YY)와 학교유형명 같은 이름 매핑으로만 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 학년별 특수학급 학생 수를 연도별·학교유형별(국립·공립·사립)로 집계한 자료입니다. 주요 항목에는 기준년도, 학교유형명, 총학생수, 유치원(3세·4세·5세 이상) 학생 수, 초등학교(1학년~6학년), 중학교(1학년~3학년), 고등학교(1학년~3학년), 전공과(1년차~3년차) 학생 수가 포함되어 있습니다. 이를 통해 연도별·학교유형별 특수학급 학생 분포와 학년별 변화를 파악할 수 있으며, 유아기부터 고등학교 및 전공과까지의 특수교육 수요를 종합적으로 분석할 수 있습니다. 해당 데이터는 특수교육 학생의 학년별 학습 참여 현황을 기반으로 교육 지원 정책의 효과를 검토하고, 향후 학급 설치 및 교원 배치 계획 수립에 활용될 수 있습니다. 또한 국공사립 간 학생 수 차이를 비교함으로써 교육격차 해소 정책에도 기초 자료로 활용됩니다.
