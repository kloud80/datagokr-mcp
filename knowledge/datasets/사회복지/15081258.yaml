description_portal: 직역연금(사학, 군인, 공무원) 재직기간 합산 시 활용되는 합산 이자율과 관련된 데이터입니다. 합산 신청 및 승인 해당 연도, 연도별 합산 이자율, 보수인상률, 연금 월액, 소비자물가 상승률 등의 항목을 제공하고 있습니다. 이 데이터를 통해 연금 가입자 및 이해관계자들은 복잡한 연금 제도에 대한 이해도를 높이고, 자신의 연금 수령액 산정에 필요한 기초 정보를 파악할 수 있습니다. 또한, 연금 제도 연구 및 정책 수립을 위한 중요한 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 연금 제도 운영 투명성을 제고하고, 가입자의 합리적인 연금 계획 수립을 지원하는 데 기여합니다.2002년부터 연도별로 산정된 합산 이자율, 보수인상률, 연금 월액의 변동성 파악을 통해 합산 관련 법령 개정 등에 사용될 수 있습니다.
