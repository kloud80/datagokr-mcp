summary_user: 서울특별시 안의 노인의료복지시설(요양원·노인요양공동생활가정 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·시설코드·시설종류와 세부종류·관할 자치구·주소·전화번호·우편번호를 담는다. 가족이 거주 자치구 안의 요양시설을 찾거나, 분석가가 자치구별 노인의료복지시설 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 시설명·주소 매칭이나 관할 시군구 코드(JRSD_SGG_CD)로 자치구 단위 지역 통계와 잇고, 건강보험 장기요양기관 목록과는 이름·주소로 대조한다.
description_portal: '서울특별시 노인의료복지시설의 정보입니다.- 주요내용 : 시설명, 시설유형, 시설종류, 시설주소 등 정보제공*용어설명- 「노인복지법」 제34조에 근거하여, 심신이 허약하거나 치매·중풍·만성질환 등으로 일상생활이 어려운 노인에게 의료·간호·요양 서비스를 제공하는 시설, 의료적 관리 + 일상 돌봄이 함께 제공(운영 주체)- 공립(시립·구립) : 지자체가 운영 (예: 시립요양원)- 민간(개가) : 사회복지법인, 의료법인, 개인 등이 운영 (민간요양원, 공동생활가정 등)※ 제공부서 : 서울특별시 복지실 복지기획관 복지정책과(02-2133-7352)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
