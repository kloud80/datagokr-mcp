summary_user: 서울 동작구 관내 경로당을 한 곳씩 담은 시설 목록 파일(csv, 약 13KB)로, 경로당명·행정동·운영 주체(구립/사립)·시설면적·주소·전화번호와 데이터기준일자를 담는다. 주민이나 보호자가 '우리 동네 가까운 경로당은 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 행정동별 경로당 분포와 면적 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행정동 이름(동명)이나 주소를 매핑해 지역 통계·다른 노인복지시설 목록과 잇는다.
description_portal: 이 데이터는 서울특별시 동작구 관내에 있는 경로당에 관한 것입니다. 이 데이터에는 경로당명, 주체, 행정동, 시설면적, 주소, 전화번호 등이 포함되어 있습니다.각 경로당은 행정구역 기준의 동명으로 구분되어 지역별 분포를 확인할 수 있습니다.주체 항목을 통해 해당 경로당이 구립인지 사립인지 운영 형태를 파악할 수 있습니다.시설면적은 경로당 건물의 사용 면적을 나타내며 공간 규모를 비교하는 데 활용됩니다.주소 정보는 경로당의 정확한 위치를 제공하여 방문 및 현장 관리에 활용됩니다.전화번호는 경로당과의 연락을 위한 대표 연락처 정보입니다.
