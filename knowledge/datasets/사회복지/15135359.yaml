description_portal: '- 한국전력기술(주)의 기부 실적을 연도별로 집계한 데이터입니다.- 해당 데이터는 기부가 이루어진 날짜, 기부 대상 수령인, 기부금액(원), 그리고 기부 사유 항목으로 구성되어 있습니다.- 해당 데이터는 공공기관 및 지자체의 사회공헌 정책 연구, 복지 수요 예측, 기업의 ESG(환경·사회·지배구조) 평가 자료, 사회복지 분야의 민관 협력 전략 수립 등에 유용하게 활용될 수 있습니다. 또한 비영리단체, 지역사회단체 등이 기업 기부의 흐름을 분석하여 후원유형별, 수혜기관별 기부 분포나 지역별 기부 트렌드를 파악하고, 향후 협력 기반 조성 및 기부 유치 전략 개발에 활용할 수 있습니다.- 개방 데이터는 기부 실적 현황 135건입니다.'
