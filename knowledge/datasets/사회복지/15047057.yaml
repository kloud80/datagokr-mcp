description_portal: '○ 통계개요* 통계명 : 장애등급 심사현황* 통계종류 : 연금 지급대상자의 장애등급 심사현황을 제공하는 일반ㆍ보고통계* 작성목적 : 국민연금제도의 업무추진 실적 및 가입자ㆍ징수ㆍ급여ㆍ기금현황 등을파악하여 연금정책 수립 및 관련 연구를 위한 기초자료로 활용하는 것을목적으로 함* 조사체계 : 지사 및 기금운용본부 → 국민연금공단* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 장애등급(1~4급)해당 및 미해당 심사현황 등○ 용어설명* 장애등급 : 장애연금을 지급하기 위하여 장애정도에 따라 구분되는 등급.장애등급은 1~4등급으로 구분되는데, 장애1급은 기본연금액 100%, 장애2급은기본연금액의 80%, 장애3급은 기본연금액의 60%를 지급하며, 장애4급은기본연금액의 225%에 해당하는 금액을 일시금으로 지급함○ 기 타* 인과관계는 자살(자해) 시도에 따른 장애발생시 정신질환과의 인과관계 판단을위한 의학적 심사건으로 장애등급 해당 및 미해당건이 아님'
