description_portal: 아이돌봄 월별 신청현황 정보를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 기준연월, 아이돌봄기관명, 전염성 질병 아동여부, 돌봄구분명, 상위아이돌봄 기관명, 전체 신청건수, 연계/신청별 가형부터 라형까지의 신청건수 등의 정보를 확인할 수 있습니다. 신청현황 정보는 수요 추세를 정기적으로 모니터링할 수 있는 기초 통계로 활용됩니다. 가형부터 라형까지 유형별 신청 건수 비교를 통해 취약계층의 접근 실태와 신청 집중 구간을 파악할 수 있으며, 이를 통해 계층 간 서비스 신청률의 격차를 줄이기 위한 지원 정책 수립이 가능해집니다. 또한, 돌봄 수요 예측과 대상자 맞춤 전략 수립에 활용될 수 있습니다.
