summary_user: 아이돌봄 서비스 신청 건수를 기준연월(crtrYm)·아이돌봄기관별로 집계한 전국 단위 통계로, 돌봄구분·서비스구분, 전염성 질병 아동 여부, 상위 기관, 전체 신청건수와 연계/신청별 가형~라형 소득유형 건수를 담는다. 정책 분석가나 지자체 담당자가 "어느 기관에서 어떤 소득유형 가정의 신청이 몰리고 월별로 어떻게 변하는가"를 보며 돌봄 수요를 모니터링하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명이나 같은 기관(한국건강가정진흥원)이 쓰는 아이돌봄기관 번호(childCareInstNo)로만 맞춰 이어 쓴다.
limits: 전역 조인 키가 없어 사회복지시설 마스터 등 타 기관 데이터와 바로 결합하기 어렵고, 기관명·코드 매핑이 필요하다. 전국 범위의 비공간 데이터라 좌표나 행정구역 코드로 지도화·지역 집계를 바로 할 수 없다.
