description_portal: 사회공헌센터(CSR Center)는 사회공헌 분야 및 활동현황 정보를 제공함과 동시에 제안 및 나눔의 장을 열어줌으로써 사회공헌의 올바른 분위기를 조성하고 나눔의 문화를 형성 하고자 하는 한국사회복지협의회 소속 기관입니다. 사회공헌의 자발적 참여 여건을 조성하고 대국민 홍보활동을 통해 올바른 사회공헌 문화를 만들어갑니다.사회공헌활동 관계자 교육을 통해 전문인력을 양성하고 사회공헌 활동을 촉진시킵니다.기업을 포함한 기관 및 단체의 욕구와 의지를 최적의 수준으로 반영하여 사회공헌활동이 전략적이고 체계적으로 추진될 수 있는 방안을 제시합니다.사회공헌 관련 인적, 물적자원의 유기적인 네트워킹을 통해 정보교류 및 협력을 강화하고 사업 효과를 극대화 합니다.
