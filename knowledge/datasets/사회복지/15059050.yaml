summary_user: 경기도 시군의 노인 휴양·복합복지시설을 시설 한 곳당 한 행으로 담은 인허가 기반 원천 목록으로, 시설구분·인허가일자·영업상태·폐업일자·입소정원·자격소유인원·총인원과 주소·위경도 좌표를 포함한다. 분석가나 지자체 담당자가 "우리 시군에 영업 중인 노인복지시설은 몇 곳이고 입소정원은 얼마인가" 같은 질문에 답하거나 시설 분포를 지도에 그릴 때 쓴다. 실측상 전역 조인 키가 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 다른 경기도 시군 단위 데이터와 이름·코드 매핑으로 이어 쓴다.
description_portal: 이 데이터는 경기도 31개 시군 내 노인 휴양 및 복합복지시설에 대한 현황을 제공하며, 각 시설의 사업장명, 소재지 도로명주소 및 지번주소, 우편번호, 시설구분명, 인허가일자, 영업상태명, 폐업일자 등의 항목으로 구성되어 있습니다. 또한, 입소정원, 자격소유인원수, 총 인원수 등 인적자원 관련 정보도 함께 제공되어 지역별 복지 수요와 공급을 분석하는 데 활용될 수 있습니다. 각 시설의 위도 및 경도 좌표(WGS84 기준)를 포함하고 있어 공간정보 기반 분석도 가능하며, 지방행정데이터개방시스템을 통해 수집된 인허가 데이터를 기반으로 합니다. 현재 데이터 갱신은 중단된 상태로 최신 정보를 필요로 할 경우 데이터의 기준일자(2017년 10월 31일)와 갱신 중지일(2018년 9월 6일)을 반드시 확인해야 합니다. 공공 및 민간 영역에서 노인복지정책 수립, 시설 분포도 시각화, 노인복지서비스 접근성 평가 등의 다양한 분야에서 활용될 수 있는 데이터입니다.
