description_portal: 서천군 관내 (예비)사회적기업 현황 데이터를 제공합니다(기관명, 사회서비스 분야, 주된 목적, 사업 내용, 소재지, 인증 여부, 예비형태, 부처형태, 인증 일자,  인증번호, 대표자, 연락처, 주소, 홈페이지주소 등)사회적기업- 영리기업과 비영리기업의 중간 형태로, 사회적 목적을 우선적으로 추구하면서 재화·서비스의 생산·판매 등 영업활동을 수행하는 기업(조직)을 말함- 「사회적기업 육성법」 에서는 사회적기업을 취약계층에게 사회서비스 또는 일자리를 제공하여 지역주민의 삶의 질을 높이는 등의 사회적 목적을 추구하면서 재화 및 서비스의 생산·판매 등 영업활동을 하는 기업으로서 고용노동부 장관의 인증을 받은 기관으로 정의하고 있음- 영리기업이 주주나 소유자를 위해 이윤을 추구하는 것과는 달리, 사회적기업은 사회서비스를 제공하고 취약계층에게 일자리를 창출하는 등 사회적 목적을 조직의 주된 목적으로 추구한다는 점에서 차이가 있음자세한 기업현황은 사회적기업 포털에서 확인하시기 바랍니다.https://www.seis.or.kr/mainPage.do
