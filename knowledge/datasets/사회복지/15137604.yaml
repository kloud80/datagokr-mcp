description_portal: 본 데이터는 한국청소년상담복지개발원이 운영하는 청소년 상담 전화인 1388을 통해 수집된 청소년의 문제상태를 유형별로 구분한 정보입니다. 상담 내용을 기반으로 위기 상황, 가족 문제, 학업 스트레스, 심리적 불안, 폭력 피해 등 다양한 문제 상태가 체계적으로 분류되어 있습니다. 본 데이터는 상담 및 복지 기관에서 청소년 문제 유형을 분석하고, 적절한 개입과 지원 방안을 마련하는 데 활용될 수 있습니다. 데이터에는 청소년 문제상태 대분류, 중분류, 소분류 구분별 1388전화상담 건수가 포함되며, 청소년 복지정책 수립 및 실태 분석에 기초 자료로 제공됩니다. 정기적으로 갱신되는 이 정보는 위기 청소년 발굴과 조기 개입, 맞춤형 서비스 제공을 위한 기반이 됩니다. 공공의 복지 증진을 목적으로 개방된 자료입니다.
