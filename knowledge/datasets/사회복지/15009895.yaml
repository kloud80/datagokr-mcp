summary_user: 구례군 안에서 운영 중인 어린이집을 한 곳당 한 행으로 담은 파일로, 이름·유형·정원·보육교직원 수·보육실·놀이터·CCTV 설치 수·통학차량 운영 여부·도로명주소·연락처를 담는다(csv 약 1KB의 작은 파일). 구례에 사는 부모가 '집 근처에 정원 여유가 있고 통학차량을 운영하는 어린이집이 어디인가'를 확인하거나, 지역 보육 담당자가 시설 현황을 점검하는 데 쓴다. 전국 공통 어린이집코드 같은 전역 조인 키는 없어서, 다른 보육 데이터(평가·보육료 공시 등)와는 어린이집명·주소를 맞춰 이어 써야 한다.
description_portal: '"어린이집" 공공데이터는 구례 지역 내에 운영되고 있는 어린이집에 관한 정보를 제공합니다.  이를 통해 지역의 부모님들은 어린이를 맡길 수 있는 안전하고 품질 좋은 어린이집을 선택할 때 도움을 받을 수 있습니다. 또한, 관련 기관은 어린이집의 운영 상태를 모니터링하고 어린이 안전과 복지를 증진하기 위한 정책 수립에 활용할 수 있습니다.'
