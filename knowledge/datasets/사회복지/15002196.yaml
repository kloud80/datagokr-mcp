description_portal: 이 자료는 광주광역시에서 활동하는 대표적인 여성단체 연대기구인 ‘광주시여성단체협의회’와 ‘광주전남여성단체연합’에 소속된 개별 단체들의 기본 현황을 정리한 것입니다. 각 단체별로 명칭, 단체장 성명, 회원 수, 소재지(주소), 연락처 등의 항목이 포함되어 있으며, 단체가 어떤 지역을 기반으로 활동하고 있는지, 회원 규모는 어느 정도인지, 대표자가 누구인지 등을 한눈에 파악할 수 있도록 구성되어 있습니다. 해당 자료는 단체별 조직력이나 활동역량의 비교 분석은 물론, 여성단체와의 실질적인 협력사업 기획 시 대상 단체를 선별하거나 접근 채널을 확보하는 데 활용도가 높습니다. 또한, 재단 차원에서 여성단체 네트워크 확대나 지역사회 기반 여성운동 지원정책을 수립할 때 근거자료로 사용할 수 있으며, 향후 단체별 특성에 맞춘 맞춤형 협력 전략 수립에도 기초자료로 유의미합니다. 특히 광주지역 여성운동의 연대 구조 및 조직 현황을 정량적으로 파악할 수 있다는 점에서 정책적 가치가 큽니다.
