summary_user: 경기도 내 특수학급이 설치된 학교 수를 기준년도와 학교 유형(국립·공립·사립)별로 집계한 시도 단위 통계로, 전체 학교 수와 유치원·초등·중·고등학교·전공과 설치 학교 수를 담는다. 교육 분석가나 학부모가 경기도에서 국공사립별, 학교급별로 특수학급 설치 학교가 해마다 얼마나 늘었는지를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 특수교육 통계와는 기준년도(STD_YY)와 학교유형명을 이름으로 맞춰 연결해야 한다.
description_portal: '이 데이터는 경기도 내 특수학급이 설치된 학교 수를 학교 유형별(국립·공립·사립)로 집계한 자료입니다. 주요 항목에는 기준년도, 학교유형명, 전체학교수, 유치원수, 초등학교수, 중학교수, 고등학교수, 전공과학교수가 포함되어 있습니다. 이를 통해 각 연도별 국립·공립·사립 학교 내 특수학급 설치 현황을 확인할 수 있으며, 학교급별 특수학급 설치 규모와 추이를 비교할 수 있습니다. 해당 데이터는 특수교육 대상 학생의 교육 접근성을 분석하는 기초 자료로 활용되며, 국공사립 학교 간의 특수학급 분포 차이, 특정 학급 유형(예: 전공과)의 설치 여부와 같은 세부적인 분석도 가능합니다. 또한 연도별 변화를 통해 특수교육 정책의 효과를 평가하고 향후 특수학급 증설 필요성을 검토할 수 있습니다.'
