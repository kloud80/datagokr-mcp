description_portal: 해당 데이터는 서울특별시 보육포털서비스에서 제공하는 어린이집 보육교직원 현황(자치구,직종별,유형별) 정보입니다. 자치구 코드와 명칭을 포함하며, 전체 종사자 수를 성별(여성·남성)로 구분한 뒤 직종별로 세분화하여 제공합니다. 직종에는 원장, 보육교사, 간호사, 영양사, 조리원, 치료사, 특수교사 등이 포함되며, 그 외 기타 인력도 별도 집계됩니다. 이를 통해 지역별·성별·직종별 인력 분포를 파악할 수 있어 보육 정책 수립 및 인력 배치 계획에 활용할 수 있습니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
