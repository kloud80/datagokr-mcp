description_portal: 성남시 기초생활수급자 현황 자료입니다. 이 자료는 성남시를 수정구, 중원구, 분당구 등 지역별로 나누고, 각 행정동별 수급자 수를 보여줍니다. 또한 성별(남성, 여성), 세대 수, 수급 유형별(일반수급자, 조건부수급자, 특례수급자)로 구성되어 있어 지역 복지 실태를 파악하기에 유용합니다.데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다.이 정보는 복지정책 수립과 복지사각지대 발굴, 예산 배분 등의 참고 자료로도 활용됩니다.
