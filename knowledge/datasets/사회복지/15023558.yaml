description_portal: 부산광역시 동구 등록 장애인 인구 수 파악 알림에 대한 데이터로 장애 유형별, 장애 정도별, 성별 등록장애인 수 등의 데이터를 제공합니다.장애 유형은 총 15 유형으로 지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐성, 정신, 신장, 호홉기, 간, 안면, 장루 및 요루, 뇌전증으로 나누어집니다.장애 유형은 장애인복지법에 따라 분류됩니다.해당 장애 유형에 장애 정도는 심한장애, 심하지 않은 장애로 구분됩니다. 이는 장애인연금법상 증중 및 경증 기준과 차이가 있습니다.장애인연금법 상 중증인 경우 등급제 폐지 전 1급, 2급, 중복 3급이며  경증인 경우 등급제 폐지 전 3급, 4급, 5급, 6급입니다부산광역시 동구 해당 장애 유형별로 성별 구분 현황의 자료를 제공합니다.부산광역시 동구 장애인의 인구학적 특성은 아래와 같습니다.2026년 2월 기준  동구의 총인구는 83,553명이며 남자는 40,552명, 여자는 43,001명이며 남여 비율은 0.94%입니다.동구의 장애인은 5,741명으로 동구 내 차지하는 비중은 6.87%이며, 남녀 장애인 비중은  각각 8.06%(3,271명), 5.74%(2,470명)입니다.이중 심한 장애인 1,979명, 심하지 않은 장애인 3,762명으로 등록장애인에서  각각 34.47%. 65.53%입니다.등록 장애 유형 중 가장 큰 비중을 차지하는 장애는 지체장애로 2,381명으로 장애인 중 41.47%를 차지합니다.
