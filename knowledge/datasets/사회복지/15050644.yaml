description_portal: '- 전라남도내  13개의 광역 장애인단체의 기본 현황에 관한 데이터로 기관명, 소재지, 전화번호 등을 제공하고 있습니다.- 전라남도에는 장애인의 권익 보호와 생활 지원, 체육, 재활, 자립을 목적으로 활동하는 장애인단체가 다수 운영 중입니다.- 장애인단체는 장애인의 권익 보호, 복지 향상, 사회참여 확대, 자립 지원 등을 목적으로 설립된 비영리 조직입니다. 전국 및 지방 단위로 구성되며, 장애유형별 또는 목적별로 특화된 활동을 합니다.- 권익옹호 : 장애인의 권리 증진, 차별 해소 운동, 정책 제안- 복지지원 : 생활·재활·교육·자립 등을 위한 프로그램 운영- 자립생활 지원 :자립생활센터 운영, 개인별 자립계획 수립·실행 지원- 문화·체육활동 : 장애인 체육회, 예술·여가 활동 등- 고용 및 교육 : 직업훈련, 일자리 연계, 특수교육 지원 등'
