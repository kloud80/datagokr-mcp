summary_user: 경기도 김포시 관내 노인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 공공·개인 구분, 시설 구분(이용·주거·요양·재가 등), 시설명, 소재지 주소, 정원인원(입소인원), 연락처를 담는다. 김포시 주민이나 보호자가 '우리 동네에 입소 여유가 있는 요양시설이 어디 있는가'를 찾을 때, 분석가가 읍·면·동별 노인복지시설 분포와 정원 대비 입소 현황을 비교할 때 쓴다. 전역 조인 키나 시설코드가 없어서 건강보험 장기요양기관 목록 같은 다른 데이터와는 시설명·주소를 맞춰 보거나 김포시 행정구역 기준으로만 잇는다.
description_portal: 경기도 김포시 노인복지시설 현황에 대한 데이터로 연 1회 업데이트됩니다. 해당 데이터는 공공/개인 구분, 시설 구분, 시설명, 소재지 주소, 정원인원, 연락처로 이루어져있습니다. 시설 구분은 이용, 주고, 요양, 재가 등으로 나뉩니다. 정원인원 항목에서는 입소인원도 함께 제공하고 있어 개별 노인복지시설의 실제 운영 현황을 파악하는데에도 도움을 줄 수 있습니다. 해당 자료로 김포시 관내 지역별 노인복지시설 분포, 실제 이용 현황에 대한 정보도 알 수 있고 어떤 시설이 많은 수요가 있는지도 알 수 있습니다.
