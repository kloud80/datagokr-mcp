summary_user: 공무원연금 지급정지 해당자 수를 연도별·정지 사유별(국회의원 등, 공무원 재임용, 정지대상기관 전액·반액, 고의·중과실 파면 등, 기타, 일부정지)로 묶은 전국 단위 집계 파일로, 포털 설명상 1983년부터 기준년도까지 연 단위이며 값은 그해 새로 정지된 인원입니다. 분석가나 연금 정책 담당자가 '재취업·선출직 취임으로 연금이 멈춘 공무원 퇴직자가 해마다 몇 명 새로 생기는가'를 사유별로 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 직역연금 통계와는 연도와 기관명을 맞춰 나란히 놓고 비교하는 방식으로만 이어 쓴다.
limits: 전국 합계만 있어 지역별·기관별 분석은 할 수 없고, 다른 데이터와 붙일 공통 코드가 없다. 값은 누적 정지자가 아니라 해당 연도 신규 정지 인원이므로 정지 중인 전체 인원으로 읽으면 안 된다.
