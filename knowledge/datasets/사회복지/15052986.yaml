description_portal: '공무원연금공단에서 관리하는 공무원연금 지급정지 해당자(국회의원, 공무원, 정지대상기관, 파면 등) 수 추이 데이터로, 1983년부터 기준년도까지 연 단위로 제공하고 있습니다.1. 정지대상기관 : 정부투자기관 및 정부재투자기관, 출연·보조 등 정부재정지원기관2. 기타 : "88년 이전은 지급중지자, "89년 이후는 사립학교교직원 임용으로 인한 지급정지자3. 공무원연금법 제50조 제2호·제5호(퇴직연금 또는 조기퇴직연금의 지급정지대상기관)의 규정이 헌법에 위배된다는 헌법재판소의 결정("03. 9. 25.)에 따라 선거직공무원(국회의원 등)을 제외한 반액정지 대상은 반액정지 대상기관에서 제외됨4. 공무원연금법 제50조 개정("05. 5. 31.)에 따라 "05. 7. 1.부터 연금일부지급정지제도를 실시함5. 연계연금이 "09. 8. 7. 시행에 따라 "09년 이후인 "12년부터 연계연금 수급자 중 정지자가 발생하였음6. 2016년 연금법 개정시행에 따라 선출직 공무원이 연금지급정지 대상에 포함7. 정지자 수는 당해년도별 신규 정지 발생 인원임'
