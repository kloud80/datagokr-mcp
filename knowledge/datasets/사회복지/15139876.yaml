description_portal: '- 전라남도 내 아이돌봄 서비스를 제공하는 기관의 현황(시군, 운영주체, 서비스 제공기관, 위탁기간, 연락처 등)에 대해 조회하실 수 있습니다.- 전라남도에서 아이돌봄서비스를 제공하는 기관은 주로 보건복지부와 지방자치단체의 지원을 받아 운영됩니다. 이 서비스는 만 3세 이상 12세 이하의 아동을 대상으로 하며, 부모의 맞벌이 등으로 인해 돌봄이 필요한 가정에 시간제 또는 영아종일제 형태로 제공됩니다.- 아이돌봄서비스는 맞벌이 가정이나 한부모 가정 등에서 자녀의 안전하고 건강한 성장을 지원하는 중요한 제도입니다. 자세한 사항은 거주하시는 지역의 시군청 아동복지 담당 부서나 보건복지부의 공식 홈페이지를 통해 확인하시기 바랍니다.'
