summary_user: 경기도 소재 시설 중 장애인 편의시설을 보유·제공하는 시설을 건별로 담으며, 시설명·기본주소·위경도·시설유형·영업상태·설립일자·편의시설 기구 목록(일반사항은 화장실을 뜻함)이 들어 있다. 장애인 당사자나 보호자가 '우리 동네에서 장애인 화장실이나 편의시설을 갖춘 곳이 어디인가'를 찾거나, 분석가가 시군별 편의시설 분포를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시설명·주소 매핑이나 위경도 기반 공간 결합으로 이어야 하며, 전국 단위는 전국장애인편의시설표준데이터와 함께 본다.
description_portal: '한국사회보장정보원에서 제공하는 경기도 소재의 장애인 편의시설 보유/제공 시설명, 주소, 편의시설 종류 등의 정보입니다.전국데이터는 공공데이터포털의 "전국장애인편의시설표준데이터(제공표준)"를 참고하여 주시기 바랍니다.전국장애인편의시설표준데이터 : https://www.data.go.kr/data/15100058/standard.do기구표 목록 중 일반사항은 화장실을 의미합니다.시설유형코드는 파일 탭의 장애인편의시설용도구분코드표를 참조하여 주시기 바랍니다.복지관리시설구분코드는 017(장애인편의시설)로 고정 값입니다.'
