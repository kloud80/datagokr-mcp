description_portal: 해당 데이터는 인천광역시 남동구에 등록된 협동조합들의 운영 현황을 담고 있는 자료로, 지역 사회의 공동 이익을 목적으로 활동하는 협동조합에 대한 정보를 제공합니다. 데이터에는 각 협동조합을 구분하기 위한 연번을 비롯해 협동조합의 분류(일반 협동조합, 사회적 협동조합 등), 활동 분야, 기업명, 대표자명, 소재지(주소), 전화번호, 주요 사업내용, 데이터 기준일자 등의 항목이 포함되어 있습니다. 이 데이터를 통해 주민, 행정기관, 연구자 등은 지역 내 협동조합의 분포와 특성을 파악할 수 있으며, 사회적 경제 활성화 및 정책 수립 자료로도 활용될 수 있습니다. 데이터는 주기적으로 갱신됩니다.
