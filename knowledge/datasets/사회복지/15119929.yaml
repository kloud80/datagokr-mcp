description_portal: 이 데이터는 2018년부터 2025년까지 8개년 동안 산재보험 가입 사업장 중 석면피해구제분담금률이 적용된 사업장의 현황을 연도별로 집계한 통계 자료입니다. 이 분담금은 석면 피해 구제 기금의 재원을 확보하기 위해 징수되는 것으로, 통계는 각 연도별로 분담금률 적용 사업장 수, 미적용 사업장 수, 그리고 사업장 총계를 제공합니다. 이 자료는 석면 피해 구제 기금의 재정적 기반이 되는 사업장의 규모와 그 추이를 투명하게 보여주며, 석면피해구제제도의 운영 실태와 재원 확보의 안정성을 파악하는 데 필수적인 기초 정보라고 판단됩니다.본 데이터는 환경 보건 정책 및 사회적 책임 관련 연구에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 분담금률 적용 사업장 수의 연도별 변화 추이를 분석함으로써, 환경 유해 물질 관리에 대한 사회적 책임을 분담하는 기업의 규모 변화를 진단할 수 있습니다. 이를 통해 분담금 징수 대상 사업장의 변화에 맞춰 석면피해구제 기금의 안정적인 재원 확보 방안을 모색하고, 분담금 제도의 형평성과 효율성을 검토하는 데 활용할 수 있습니다. 또한, 이 통계는 석면 관련 질병 예방 및 피해자 구제 활동의 지속 가능한 재정 지원 체계를 구축하는 데 기여할 수 있다고 판단됩니다.
