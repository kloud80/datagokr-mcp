summary_user: 제주특별자치도 내 노인교실을 시설 한 곳당 한 행으로 담은 소규모 파일(약 2.6KB CSV)이며, 행정시·명칭·소재지·회원수·설치년월일·운영방법·연락처를 포함한다. 제주에 사는 어르신이나 가족이 집 근처 노인교실의 위치와 연락처, 운영 방식을 찾을 때 쓰고, 분석가가 행정시별 노인교실 분포와 회원 규모를 비교할 때도 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 시설 명칭·소재지 주소를 맞춰 잇고, 지역 통계와는 행정시 단위로만 연결한다.
description_portal: '제주특별자치도에서 관리하고 있는 노인교실현황과 관련한 데이터를 제공합니다.항목: 명칭, 소재지, 운영방법, 연락처 등*노인여가복지시설의 종류 (노인복지법 제31조, 제36조)- 노인교실: 노인들에 대하여 사회활동 참여욕구를 총족시키기 위하여 건전한 취미생활‧노인건강유지‧소득보장 기타 일상생활과 관련한 학습프로그램을 제공함으로 목적으로 하는 시설자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1607'
