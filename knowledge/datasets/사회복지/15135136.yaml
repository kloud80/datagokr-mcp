summary_user: 경기도 온라인 소식지 '워라밸링크' 웹진에 실린 정책 정보 콘텐츠 목록을 담으며, 한 행이 콘텐츠 한 건으로 고유번호·썸네일·제목을 갖는다. 경기도민이나 정책 홍보 담당자가 '산후조리비나 학자금 대출이자 지원 같은 경기도 생활 지원 정책을 소개한 글이 있는가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: 이 데이터는 경기도에서 운영하는 온라인 소식지인 '워라밸링크' 웹진에 수록된 다양한 정책 정보 콘텐츠 목록을 제공합니다. 각 콘텐츠는 고유번호, 썸네일 이미지, 제목 등의 항목으로 구성되어 있으며, 경기도민의 삶의 질 향상 및 일과 삶의 균형 실현을 목적으로 한 가족, 청년, 아동, 노년층 대상의 복지 및 지원정책 내용을 포함하고 있습니다. 예를 들어, 산후조리비 지원, 학자금 대출이자 지원, 어린이 과일간식 제공, 노인 장기요양보험 안내, 초등학생 대상 치과 주치의 프로그램 등 실생활에 도움이 되는 정보를 담고 있어 정책 홍보 및 주민 활용도 제고에 활용될 수 있습니다.
