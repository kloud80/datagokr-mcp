summary_user: 경기도 내 특수학교 수를 기준년도와 시군별로 국립·공립·사립으로 나누어 집계한 통계로, 건별 학교 목록이 아닌 학교 수 집계를 담는다. 교육·복지 분석가가 "우리 시군에 공립 특수학교가 몇 곳이고 사립 비중은 어느 정도인가" 같은 지역별 특수교육 인프라 분포를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 시군코드(SIGUN_CD)나 시군명을 이름·코드 매핑해 경기도의 다른 시군 단위 통계와 잇는다.
description_portal: 특수학교 학교유형별 집계현황 데이터는 경기도 내 특수학교를 국립·공립·사립으로 구분하여 학교 수를 집계한 교육·복지 통계자료입니다. 주요 항목에는 기준년도, 시군코드, 시군명, 총학교수, 국립학교수, 공립학교수, 사립학교수가 포함됩니다. 본 자료는 매년 6월 말 기준으로 작성되며, 경기도 내 특수학교 운영 현황과 유형별 분포를 체계적으로 파악할 수 있습니다. 이를 통해 국공사립 간 운영 규모 차이, 지역별 특수학교 분포 분석, 특수교육 인프라 확충 필요성 등을 평가할 수 있습니다. 교육부 특수교육통계와 연계되어 정책적 활용도가 높으며, 특수학교 설립 계획, 교육자원 배분, 특수교육 대상 학생 지원정책 수립에 기초자료로 활용될 수 있습니다. 또한 누림센터가 관리·제공하여 지역 맞춤형 특수교육 정책 및 복지서비스 연계에도 중요한 참고자료로 쓰입니다.
