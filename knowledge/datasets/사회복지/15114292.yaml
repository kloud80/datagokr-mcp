summary_user: 경기도 시군구·읍면동 단위로 국민기초생활수급자 인원수를 연도별, 수급 자격유형(생계·의료·주거급여 등)별, 연령구간(18세미만·18~64세·65세 이상)별로 집계한 데이터다. 지자체 복지 담당자나 분석가가 '우리 읍면동의 65세 이상 의료급여 수급자는 몇 명이고 다른 지역과 비교해 어떤가' 같은 질문에 답할 때 쓴다. 전역 조인 키(행정동 코드 등)가 없어 다른 데이터와는 시군구명·읍면동명 같은 이름을 매핑해 연결해야 한다.
description_portal: 이 데이터는 경기도 사회복지분야 자료로, 경기도 내 시군구 및 읍면동 단위의 국민기초생활수급자 현황을 연도별로 정리한 것입니다.다양한 복지급여 자격유형(기초생계급여, 기초의료급여, 기초주거급여 등) 및 연령구간별(18세미만, 18~64세, 65세 이상) 인원 수를 제공하고 있습니다. 이 데이터는 지역 간 복지수요 분석, 연령별 수급자 분포 파악, 자치단체 복지정책 수립, 지역 맞춤형 복지자원 배분 등에 활용될 수 있으며, 지역 간 격차 해소 및 취약계층 지원 강화를 위한 기초자료로 유용합니다. 데이터 컬럼은 연도, 시군구명, 읍면동명, 자격, 연령구간, 인원수로 구성되어 있습니다.
