summary_user: 사학연금 유족연금 수급자의 수와 1인당 평균연금월액을 연령대별·성별로 집계한 전국 단위 통계 파일(csv, 645 bytes)이다. 연금 분석가나 유족연금 수급 예정자가 "연령대별로 유족연금을 받는 사람은 몇 명이고 평균 얼마를 받는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 사학연금 통계표나 다른 직역연금 통계와는 연령 구간 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 사립학교교직원연금공단 사학연금수급자 평균연금월액(유족연금) 데이터는 연금수급자 중에서 유족연금을 수급받는 사람들의 연령별 수와 평균연금월액을 교직원(교원, 사무직원) 항목으로 구분하여 집계한 데이터입니다. 19세 미만부터 89세 이상의 연령 범위에서 5세씩 증가하는 추이로 수급자의 정보를 제공하고 있습니다.이 데이터를 통해 사학연금 제도의 투명성을 제고하고, 유족연금 수급자들이 평균적인 연금 수령액을 명확히 파악할 수 있도록 돕습니다. 또한 연금 수급자 추이 파악 및 연금재정 전망, 그리고 제도 개선을 위한 기초 자료로 활용될 수 있습니다.본 데이터는 공공기관의 정보 공개 의무를 이행하고, 연금 제도의 안정적인 운영을 대외적으로 보여주는 중요한 자료입니다.
