summary_user: 경기도 내 통합학급 교원 수와 그중 특수교사 자격 보유 교원 수를 기준연도(STD_YY)·학교유형(공립·사립·국립)별로 집계한 자료로, 유치원·초등학교·중학교·고등학교 학교급별 수치와 전체 합계를 함께 담는다. 교육 정책 담당자나 분석가가 '경기도 통합학급 교원 중 특수교사 자격자 비율이 학교급·설립유형별로 어떻게 다르고 해마다 어떻게 변하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·학교유형 이름을 맞춰 붙이거나 같은 기관의 특수교육 관련 통계와 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 이 데이터는 교육부(특수교육통계)에서 제공하는 경기도 내 통합학급에서 근무하는 교원의 자격 보유 현황을 학교유형별(공립, 사립, 국립)로 연도별 정리한 자료입니다. 매년 6월 말 기준으로 수집되며, 유치원부터 고등학교까지 각 학교급별 전체 교원 수와 그 중 특수교사 자격을 소지한 교원 수를 함께 제공합니다. 본 데이터는 통합학급 내 특수교육 대응 역량을 분석하고, 일반 교원 대비 특수교사 자격자의 비율, 학교급별·유형별 특수교육 인력의 분포 등을 파악하는 데 유용합니다. 이를 통해 교원 연수 및 자격 확대 정책 수립, 통합교육 질 향상 방안 마련 등에 활용될 수 있습니다.
