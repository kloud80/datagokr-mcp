summary_user: 경기도 내 아동공동생활가정(그룹홈)을 시설 한 곳당 한 행으로 담은 시설 목록으로, 기준연도(sum_yr)·시군명·시설명·전화번호·설치일자·종사자 수·아동 정원과 현재원·지번 및 도로명 주소·우편번호·위경도 좌표를 포함한다. 아동복지 담당자나 분석가가 "우리 시군의 그룹홈은 몇 곳이고 정원 대비 현재원이 얼마나 찼는가"처럼 시설 배치와 수용 여유를 확인하는 데 쓴다. 실측 컬럼에 행정구역 코드 같은 전역 조인 키가 없어 다른 데이터와는 시군명 이름 매칭이나 위경도 좌표로만 이어 붙인다.
description_portal: 이 데이터는 경기도 내 아동공동생활가정(그룹홈)의 운영 현황을 수록한 자료로, 시설명, 시군명, 복지시설 전화번호, 설치일자, 종사자 수, 수용 정원 및 현재원, 주소(지번 및 도로명), 위경도 좌표 등의 정보를 포함합니다. 아동공동생활가정은 보호가 필요한 아동들이 일반 가정과 유사한 환경에서 생활할 수 있도록 설립된 소규모 복지시설로, 본 데이터는 각 시설의 입지 현황과 수용 상황, 인력 구성 등을 확인할 수 있어 복지자원 배분, 아동복지 정책 수립, 지역 기반의 복지서비스 제공 전략 수립에 활용될 수 있습니다. *시설 전화번호가 개인 연락처(010) 인 경우 공란으로 제공됩니다.
