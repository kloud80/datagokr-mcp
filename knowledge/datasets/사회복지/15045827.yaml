summary_user: 사립학교교직원연금공단이 국내주식 운용 자금을 맡긴 위탁운용사를 운용사 한 곳당 한 행으로 담은 현황 파일로, 위탁업체명·기준일자·위탁내용·위탁시작일자를 제공하며 파일 크기는 약 1KB(1095 bytes)의 소규모 목록이다. 사학연금 기금의 국내주식을 어느 운용사가 언제부터 어떤 유형으로 맡고 있는지 확인하려는 가입자·분석가, 또는 공단의 운용사 선정 현황을 살피려는 자산운용사가 쓴다. 전역 조인 키가 없어 다른 데이터와는 위탁업체명(금융회사 이름) 매칭으로만 잇고, 금융회사 단위의 재정·금융 데이터나 다른 연금 기금의 위탁운용사 현황과 이름 기준으로 비교한다.
