description_portal: '대전광역시 서구 결식우려 아동급식 지원대상자 수에 관한 데이터로, 지원방법(아동급식카드, 단체급식소)과 법정동별 급식 지원 대상자 현황을 제공합니다.- 아동급식카드: 각 동 행정복지센터에서 대상자를 관리하며, 대상자는 아동급식카드(아이누리카드) 발급 후 연계된 가맹점을 방문하여 직접 식사를 이용합니다.  * 대전시의 경우 농협은행과 협약하여 아동급식카드를 발급 지원하고 있으며, 대전시 내 7,000여 개의 BC카드 가맹점을 이용할 수 있음.- 단체급식소: 지역아동센터 30개소, 사회복지관 1개소 / 해당 시설의 아동복지 프로그램을 이용하는 아동에게 시설에서 직접 조리하여 식사를 제공합니다.'
