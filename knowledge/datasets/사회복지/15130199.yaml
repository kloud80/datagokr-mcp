summary_user: 강원특별자치도 시군별 65세 이상 1인가구(독거노인) 수를 연도별 열(2020년~2024년)로 담은 시군구 단위 집계 파일(csv, 696 bytes)이다. 지자체 복지 담당자나 분석가가 "강원도 어느 시군에서 독거노인이 가장 빠르게 늘었나"를 비교해 돌봄·방문 서비스 배분을 검토하는 데 쓴다. 표준 행정코드 같은 전역 조인 키는 없어서 시군 이름을 매핑해 같은 시군구 단위의 노인인구·기초연금 수급·노인복지시설 데이터와 이어 쓴다.
