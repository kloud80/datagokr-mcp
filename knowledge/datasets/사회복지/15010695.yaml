summary_user: 한국노인인력개발원이 노인일자리 사업단에서 생산한 상품을 1·2차 카테고리별로 상품명·옵션·상품코드·판매가격·이벤트가격·판매업체·사업단명·원산지 단위로 담은 전국 단위 상품 목록 파일(CSV 약 58KB)이다. 소비자나 공공기관 구매 담당자가 '어떤 노인일자리 사업단이 어떤 생활용품을 얼마에 파는가'를 찾거나, 분석가가 카테고리별 가격대와 판로 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업단명·판매업체 이름 매칭이나 같은 기관의 상품코드로만 이어 쓴다.
description_portal: 이 데이터는 한국노인인력개발원의 노인생산품에 대한 상세 정보를 담고 있습니다. 상품은 1차·2차 카테고리별로 분류되며, 상품명, 상품설명, 상품코드, 판매가격 등이 제공됩니다. 주요 항목으로는 패션잡화, 주방·생활용품, 건강·위생제품, 취미·문화용품 등이 있으며, 노인일자리 창출을 통해 생산된 제품의 시장 유통 및 소비 촉진을 목적으로 구축되었습니다. 이 데이터는 온라인 쇼핑몰 및 유통 플랫폼과 연계해 활용할 수 있으며, 소비자에게는 고령 친화적이고 합리적인 제품 선택의 정보를, 기업과 기관에는 노인 참여 생산품의 판로 확대 및 정책적 지원 근거가 될 수 있습니다. 또한, 판매 추이와 상품 코드 기반의 관리가 가능해 정책 보고서, 유통 분석, 시장 활성화 전략 수립에 유용합니다.
