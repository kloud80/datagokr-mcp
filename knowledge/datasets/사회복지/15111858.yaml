description_portal: '연제구 내 좁고 어두운 골목길에 범죄 예방을 예방하고자 설치한 안심등 설치 위치 현황 정보로 구성된 데이터입니다. 2019년부터 설치된 안심등 중 노후 교체, 신규대상지 조사 후 설치하고 있습니다.❍ 목적 : 주택가 내 안전한 귀갓길을 조성하여 여성·아동 등 범죄 취약계층 대상 범죄발생을 예방하여 구민이 안전한 행복도시 연제 조성에 기여❍ 근거: 「부산광역시 연제구 아동친화도시 조성 조례 」 제10조❍ 효과 : 보행자가 어두운 골목을 지나갈 때 안심반딧불(센서등)이 어두운 길을 밝혀주어 범죄를 예방하고 범죄취약 대상자의 야간보행에 대한 두려움을 해소'
