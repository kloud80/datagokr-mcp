description_portal: '한국사회보장정보원에서 1년 주기로 제공하는 통계자료로, 시도별로 매월 차상위계층확인 수급 가구수와 수급자수가 얼마나 되는지에 대한 정보를 담고 있습니다.   데이터 구성은 각 시도별로 매월 수급 가구수 및 수급자수 항목으로 구성되어 있습니다.   사회보장정보시스템(행복e음)에 등록된 복지대상자 중 차상위계층확인 자격을 보유한 수급자를 각 월말 기준으로 집계. 수록된 통계 자료에 대한 문의는 한국사회보장정보원 사회보장정보연구소 데이터개방부로 문의 하시기 바랍니다.   지역별 차상위계층확인 수급 가구수 및 수급자수를 공시적으로 분석하거나 한 지역의 차상위계층확인 수급 가구수 및 수급자수의 변화를 통시적으로 분석할 때 활용하실 수 있습니다.아울러 이러한 공공데이터를 통해 다음과 같은 데이터분석, 연구 등의 활용이 가능합니다.*단순 예시 사례이니,  참고바랍니다.○가구 특성 파악: 가구의 성별, 연령대, 가구원 수 등 상세 정보를 분석하여 어떤 가구가 차상위계층으로 분류되는지 파악할 수 있습니다.○지역별 분포: 시·도별, 시·군·구별 수급자 현황을 분석하여 지역별 복지 수요의 차이를 확인하고, 복지 자원 배분 계획을 세울 수 있습니다.○소득 및 재산 현황: 가구의 소득과 재산 수준을 분석하여 차상위계층의 경제적 특성을 이해하고, 소득 증대를 위한 정책 방안을 모색할 수 있습니다.'
