summary_user: 정읍시 경로당을 한 곳당 한 행으로 담은 목록 파일로, 읍면동·경로당명·도로명주소·전화번호·운영시작일을 2024년 12월 31일 기준으로 담는다. 정읍시 주민이나 노인복지 담당자가 우리 동네 경로당이 어디 있고 언제부터 운영했는지, 읍면동별로 경로당이 몇 곳인지 확인하는 데 쓴다. 공통 조인 키가 없어 다른 노인복지시설·지역 통계 데이터와는 읍면동 이름이나 도로명주소를 맞춰 잇는다.
limits: 실측 컬럼에 시설코드·행정코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 경로당에 유선전화가 없으면 전화번호가 비어 있고, 범위는 정읍시 한 곳뿐이다.
