description_portal: 공무원연금공단에서 관리하는 공무원연금기금 전체회계 재무상태(자산, 부채, 자본) 데이터로, 2014년부터 기준년도까지 연 단위로 구분되어 있습니다.자산항목은 유동자산(당좌자산, 재고자산, 기타유동자산, 대부자산) 및 비유동자산(투자자산, 대부자산, 유형자산, 무형자산, 기타비유동자산)으로 구분됩니다.부채항목은 유동부채 및 비유동부채, 대여학자금수탁금으로, 자본항목은 공무원연금기금(자본금, 기타포괄손익누계액, 이익잉여금) 구분됩니다.1.  2013년부터 국가회계법에 따라 국가회계기준(실물자산 시가평가 등 반영) 적용2. 충당부채(연금 및 퇴직수당) 제외
