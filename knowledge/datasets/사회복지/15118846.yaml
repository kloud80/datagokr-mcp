description_portal: 이 자료는 충청남도개발공사의 장애인 생산품, 친환경 녹색제품 및 중소기업 제품 구매 현황을 담고 있으며, 연도별 구매액과 전체 대비 구매율을 제공한다. 단, 개별 업체의 세부 구매 내역이나 품목 단위 상세 정보는 미제공된다.컬럼별 상세설명○ 연도 → 해당 구매 실적이 발생한 기준 연도를 의미하며, 연도별 제품군별 구매 현황을 비교할 수 있도록 제공됨○ 구분 → 구매 대상 제품군을 구분하는 항목으로 장애인 생산품, 친환경 녹색제품, 중소기업 제품 등으로 구분되어 기록됨○ 구매액(백만원) → 각 구분별로 실제 집행된 구매 금액을 백만원 단위로 표시하며, 회계 기준에 따라 산출됨. 일부 항목은 정산 과정에서 변동될 수 있음○ 구매율(퍼센트) → 전체 구매액 대비 해당 구분 제품 구매액이 차지하는 비율을 백분율(%)로 산출한 값으로, 공공구매 의무 이행 및 정책적 목표 달성 정도를 확인할 수 있는 지표임
