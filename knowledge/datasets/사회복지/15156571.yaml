description_portal: '부산광역시 서구 관내에서 운영 중인 사회적기업 및 예비 사회적기업의 현황 데이터입니다.본 데이터에는 기관명, 시설유형, 주소, 연락처 등의 항목이 포함되어 있으며, 이를 통해 지역 내 사회적기업 분포 현황 등을 파악할 수 있습니다.예시 데이터에는 ㈜함께하는, ㈜온더무브 등 사회적기업과 예비 사회적기업의 명칭, ‘사회적기업·예비 사회적기업’으로 구분된 시설유형, 부산광역시 서구 관내 상세 주소, 기관별 대표 연락처 정보가 포함되어 있습니다.본 데이터는 사회적기업 육성 및 지원 정책 수립, 사회적경제 활성화 사업 기획, 유관기관 협력 대상 발굴, 주민 대상 사회적기업 정보 제공 등 다양한 행정 및 정책 분야에서 활용될 수 있습니다.* 항목별 설명기관명: 기업의 공식 명칭시설유형: 기업 유형 구분 정보주소: 해당 기관의 소재지 주소연락처: 기관별 대표 연락처'
