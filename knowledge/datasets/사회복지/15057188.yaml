summary_user: 경기도의 연령구분별 주민등록인구 수, 등록장애인 수, 인구 대비 등록장애인 비율(%)과 장애인 중 해당 연령 비율(%)을 기준연도(STD_YY)별로 담은 시도 단위 집계 자료다. 복지 담당자나 분석가가 '경기도에서 어느 연령대의 장애인 비율이 높아 고령장애인 돌봄 수요가 큰가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 연령구분명을 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 연령별 주민등록인구 대비 등록장애인 비율 현황을 집계한 자료입니다. 경기도청 장애인복지과가 제공하며, 매년 12월 말 기준으로 산출됩니다.항목에는 연령구분명, 주민등록인구 수, 등록장애인 수, 등록장애인 비율(%), 등록장애인 연령 비율(%) 등이 포함됩니다. 예를 들어, 특정 연령대 인구 10만 명 중 5천 명이 장애인으로 등록되어 있다면, 등록장애인 비율은 5%로 표시됩니다.이 데이터는 연령대별 장애인 분포 현황을 파악할 수 있어, 청년·노인 맞춤형 복지 정책 설계, 보건의료 서비스 수요 예측, 지역별 장애인 인구구조 비교 등에 활용될 수 있습니다. 특히 노인 연령층에서 등록장애인 비율이 높게 나타날 경우, 고령장애인 돌봄 서비스 확대 정책의 근거로 사용할 수 있습니다.
