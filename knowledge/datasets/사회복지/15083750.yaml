summary_user: 대전광역시 안의 고용노동부 인증 사회적기업과 예비 사회적기업을 기업별 한 행으로 정리한 현황 파일로, 소재 구·기업명·업종·사회적기업 구분(인증/예비)을 담는다(csv 약 12.8KB, 활용신청 없이 받음). 대전 사회적경제 담당자나 분석가가 '대전 어느 구에 어떤 업종의 사회적기업·예비 사회적기업이 몇 곳 있나'를 파악하거나 지원사업 대상 기업을 추릴 때 쓴다. 인증번호·사업자번호 같은 전역 조인 키가 없어 다른 사회적기업·사업자 데이터와는 기업명과 구 이름을 맞춰 연결해야 한다.
description_portal: 대전광역시 사회적 기업 지정 현황 자료는 고용노동부가 인증하는 사회적 기업과 중앙 부처 또는 대전광역시에서 지정하는 예비 사회적 기업의 현황을 종합적으로 제공합니다. 이 자료에는 각 기업의 명칭, 업종 등 다양한 정보가 포함되어 있습니다. 사회적 기업과 예비 사회적 기업은 취약 계층 일자리 창출, 지역사회 공헌, 사회 서비스 제공 등 사회적 가치를 실현하는 다양한 사업 유형을 보유하고 있으며, 일자리 창출 사업, 사업 개발비 지원 등 각종 재정 지원 사업 신청 자격이 부여됩니다. 자료는 기업 별 사회적 기업 인증 및 지정 현황 등 세부적인 내용을 체계적으로 파악할 수 있도록 구성되어 있어, 사회적 경제 정책 수립, 지원 사업 대상 선정, 지역사회 네트워크 구축, 사회적 기업의 성장 및 성과 분석 등 여러 분야에서 활용될 수 있습니다.
