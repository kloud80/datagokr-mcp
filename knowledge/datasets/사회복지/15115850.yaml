summary_user: 경기도 양주시에서 다둥e카드를 가진 다자녀가정에 할인을 해주는 민간 제휴업소를 업소 한 곳당 한 행으로 담은 목록으로, 업종·업체명·소재지·연락처·할인내용·관리부서가 들어 있다. 양주시 다자녀가정이 "집 근처에서 다둥e카드로 할인받을 수 있는 식당이나 학원이 어디인가"를 찾을 때 쓰고, 분석가는 지자체별 다자녀 혜택을 비교하는 자료로 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 맞춰 보거나 양주시라는 기관 단위로만 이어 쓴다.
description_portal: 양주시는 저출산 문제, 지방소멸 위기, 다자녀가정 경제 부담을 완화하기 위해 민간과 협력하여 다자녀가정을 위한 할인제도를 운영하고 있습니다.다둥e카드를 가진 가정은 제휴된 민간 업소에서 다양한 할인 혜택을 받을 수 있어요.주요 활용 정보 목록으로는 업종, 분류, 업체명, 소재지, 연락처, 할인내용, 관리부서 등이 있습니다.출산장려 및 다자녀가정을 위한 경제적 지원 확대와 지역사회 할인 인프라 구축을 위해 제공되는 데이터 입니다.
