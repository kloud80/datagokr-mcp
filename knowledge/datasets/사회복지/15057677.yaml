summary_user: 경기도 노인복지관(노인여가복지시설)을 시설 한 곳당 한 행으로 담으며, 시군·시설명·주소와 좌표, 전화·팩스, 이용 회원 수, 종사자 정원·현원(성별, 정규직·비정규직), 운영주체와 설치일자를 포함한다. 정책 담당자나 연구자가 '경기도 어느 시군에 노인복지관이 적고, 회원 수에 비해 종사자 현원이 부족한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군 코드·시군명(SIGUN_CD)이나 시설명·주소를 매핑해 시군별 고령인구 통계나 다른 노인복지시설 목록과 이어 쓴다.
description_portal: 이 데이터는 경기도 내 노인여가복지시설, 즉 노인복지관의 운영 현황을 담고 있습니다. 노인복지관은 고령층의 건강한 여가활동, 사회참여, 복지서비스 제공을 위한 핵심 거점 시설입니다. 해당 데이터는 복지관별 시설명, 주소, 전화/팩스 번호, 이용 회원 수, 종사자 정·현원(성별, 정규직/비정규직 포함), 운영주체(지자체/민간/법인명) 및 설치일자 등을 포함하고 있어, 지역별 복지관 분포와 인력 배치 상태를 파악할 수 있습니다. 이는 노인 여가정책, 인프라 개선, 복지관 신설/보완 등 정책 기획과 연구에 매우 유용한 자료입니다. 데이터는 연 1회 갱신되며, 경기도 노인복지과에서 관리합니다.
