summary_user: 장애인·산모·아동 등에게 사회서비스를 제공하는 기관을 한 건씩 담은 API로, 전국 범위에서 기관명·대표자·제공 서비스와 유형·시도와 시군구·지번과 도로명 주소·연락처를 기관 단위로 돌려준다. 이용자나 가족이 "우리 시군구에서 산모·신생아 돌봄이나 장애인 활동지원 같은 서비스를 제공하는 기관이 어디이고 연락처가 무엇인가"를 찾을 때 쓰고, 분석가는 지역별 제공기관 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 주소, 기관명 매칭으로 잇고, 기관 고유 식별자(providerId)는 같은 기관(한국사회보장정보원) 데이터 안에서만 연결 키로 쓴다.
description_portal: 장애인, 산모, 아동 등 사회서비스를 필요로 하는 수요자에게 서비스를 제공하는 기관의 정보를 제공
