summary_user: 2020년 5월 기준 국민연금 지역가입자 수를 시도(법정동시도)별로 집계해, 소득신고자·납부예외자·임의가입자·임의계속가입자 등 가입종별 인원(명)으로 담은 전국 단위 소용량 CSV 파일이다. 지역별로 납부예외자 비중이 얼마나 되는지, 임의가입자가 어느 시도에 많은지 같은 질문에 분석가나 연금 정책 담당자가 쓴다. 전역 조인 키가 없어 다른 시도별 통계와는 시도 이름을 맞춰 연결해야 한다.
limits: 2020년 5월 한 시점만 담고 있어 추이 분석에는 쓰지 못한다. 단위가 시도라서 시군구나 개인 단위 분석은 할 수 없고, 다른 데이터와 붙일 코드가 없어 시도명 매핑이 필요하다.
