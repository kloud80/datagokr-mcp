summary_user: 경기도 내 일반학교 가운데 특수교육대상자가 포함된 통합학급을 설치한 학교 수를 기준연도(STD_YY)와 학교유형(국·공·사립)별로 집계한 통계로, 전체 학교 수와 유치원·초등학교·중학교·고등학교·전공과별 수치를 담는다. 교육 분석가나 정책 담당자가 '경기도에서 통합학급을 운영하는 중학교가 연도별로 얼마나 늘었는가' 같은 통합교육 인프라 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 교육부 특수교육통계 등 다른 자료와는 연도·학교유형 이름을 맞춰 연결해야 한다.
description_portal: 통합학급 설치 학교수 집계현황 데이터는 경기도 내 일반학교에서 특수교육대상자가 포함된 통합학급을 설치한 학교 수를 학교유형별(국·공·사립)과 학교과정별(유치원, 초등학교, 중학교, 고등학교, 전공과)로 집계한 통계자료입니다. 매년 6월 말 기준으로 제공되며, 전체 설치 학교 수와 함께 학교급별 세부 수치가 포함됩니다.이 데이터는 통합교육의 기반 인프라를 분석하는 데 중요한 자료로, 실제로 얼마나 많은 학교에서 통합학급을 운영하고 있는지를 파악할 수 있습니다. 이를 통해 학교급별 설치 비율, 교육 기회 확대 현황, 특수교육 수용 여건 등을 평가할 수 있습니다. 또한 교육부 특수교육통계와 누림센터 자료와 연계하여 특수교육 정책 수립, 지역별 균형 발전 계획, 교육 자원 배분 의사결정에 활용될 수 있습니다.
