summary_user: 2018년 기준 전북특별자치도에서 활동하는 청소년 단체를 단체 한 곳당 한 행으로 담은 목록으로, 단체명·도로명 소재지·대표자·전화·일부 홈페이지를 포함하며 파일 크기는 약 1.2KB인 소규모 csv다. 청소년 활동 담당자나 지역 단체가 '전북에서 청소년 상담·체험 활동을 연계할 단체가 어디 있고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 단체명 매칭이나 도로명주소를 지오코딩해 시군구 단위로 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 2018년 기준 전북특별자치도 내에 활동 중인 청소년 단체들의 현황을 정리한 자료입니다. 각 단체의 명칭, 소재지(도로명 주소), 대표자 이름, 연락 전화번호, 그리고 일부 단체의 홈페이지 정보가 포함되어 있습니다. 전북 지역 청소년들의 다양한 활동과 권익 증진을 지원하기 위한 단체들로서, 문화·교육·복지·체험 활동 등을 담당하는 비영리단체 및 청소년 연맹, 교육 연구기관, 상담복지센터 등이 포함되어 있습니다. 본 데이터는 청소년 관련 행정기관, 교육 기관, 지역사회 단체, 그리고 청소년 활동 지원 담당자들이 단체별 연락처와 위치를 신속하게 파악할 수 있도록 체계적으로 구성되어 있어, 청소년 정책 수립 및 연계 활동에 유용하게 활용할 수 있습니다.
