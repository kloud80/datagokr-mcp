description_portal: 본 데이터는 전북특별자치도의 새마을 지도자 자녀들을 대상으로 지급된 장학금의 연도별 현황을 보여주는 자료입니다. 전북도청과 14개 시군 각각에서 매년 얼마의 장학금이 지급되었는지를 상세히 기록하고 있습니다. 이 자료를 통해 지역 사회 발전에 기여해 온 새마을 지도자들을 위해 각 지방자치단체가 시행하는 지원 사업의 규모와 시계열적 변화를 파악할 수 있습니다. 이는 특정 사회 단체에 대한 지원 정책을 분석하고, 장학 사업의 운영 현황을 이해하는 데 중요한 기초 데이터로 활용될 수 있습니다.
