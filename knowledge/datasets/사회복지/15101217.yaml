summary_user: 부산 해운대구에 있는 아동양육시설(보호대상아동을 입소시켜 보호·양육·자립지원을 하는 생활시설)의 현황을 시설별로 담은 시군구 범위의 작은 CSV 파일(301바이트)입니다. 해운대구에 어떤 아동양육시설이 있고 정원과 현재 인원, 연락처, 위치가 어떤지 확인하려는 주민·복지 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 사회복지시설 데이터와는 시설명이나 주소를 직접 맞춰야 한다.
description_portal: 본 자료는 아동복지법 제50조 등에 의해 설치된 아동복지시설 현황입니다. 해운대구에  위치하는 아동복지시설(아동양육시설) 현황으로 아동양육시설은 아동의 건전한 육성을 지원하기 위해 보호대상아동을 입소시켜 보호와 양육, 취업을 위한 훈련, 자립지원 서비스를 제공하고 연계하는 생활시설의 현황입니다. 보호가 필요한 아동에게 최적의 서비스를 제공하여 안정적으로 자립할 수 있도록 돕고 있습니다.본 데이터는 각 시설별 명칭, 시설의 소재지, 연락처 및 설립일자, 정원, 현재인원, 위도, 경도 등 관련 상세자료를 포함하고 있습니다.
