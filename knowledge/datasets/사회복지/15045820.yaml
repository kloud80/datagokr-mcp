description_portal: 사립학교교직원연금공단 사학연금수급자 현황(연도별 연금수급자 및 연금액) 데이터는 연금수급자의 현황을 나타내는 데이터로 연금 종류별(퇴직연금, 유족연금, 장해연금, 장해유족연금, 연게퇴직연금) 수급자 수와 평균 연금액을 연도별로 집계하여 제공합니다.1997년부터의 자료를 제공하고 있으며, 해당 자료는 매년 현행화하고 있습니다.해당 데이터는 연금 수급자 추이 파악 및 연금재정 전망, 그리고 제도 개선을 위한 기초 자료로 활용될 수 있습니다.    이 데이터를 통해 사학연금의 재정 건전성과 운영 투명성을 대외에 공개하고, 잠재적 수급자와 이해관계자들이 연금 제도를 명확히 이해할 수 있도록 돕습니다.
