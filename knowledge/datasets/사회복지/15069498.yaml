summary_user: 대구광역시 경로당을 한 곳씩 담은 등록현황 목록으로, 소속지회·경로당명·주소가 들어 있으며 포털 설명상 2024년 12월 31일 기준 구·군별 현황이다. 대구에 사는 노인이나 가족이 집 근처 경로당을 찾거나, 분석가가 구·군별 경로당 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 노인복지시설 목록이나 지역 통계와는 주소·시설명 매칭 또는 같은 기관 자료끼리만 이어 쓴다.
description_portal: '- 노인복지법 제37조(노인여가복지시설의 설치)에 근거한 경로당 등록현황- 구. 군 별 경로당 등록 현황(2024. 12. 31. 기준)- 근거법령o 노인복지법 제36조(노인여가복지시설) ①노인여가복지시설은 다음 각 호의 시설로 한다.2. 경로당 : 지역노인들이 자율적으로 친목도모ㆍ취미활동ㆍ공동작업장 운영 및 각종 정보교환과 기타 여가활동을 할 수 있도록 하는 장소를 제공함을 목적으로 하는 시설②노인여가복지시설의 이용대상 및 이용절차 등에 관하여 필요한 사항은 보건복지부령으로 정한다.o 노인복지법 시행규칙 제24조(노인여가복지시설의 이용대상자 및 이용절차) ①법 제36조의 규정에 의한 노인여가복지시설의 이용대상자는 다음 각호와 같다.2. 경로당 : 65세이상의 자o 대구광역시 경로당 활성화사업 지원에 관한 조례제1조(목적) 이 조례는 「노인복지법」 제23조의 규정에 따라 노인의 사회참여를 확대하기 위하여 경로당 노인의 건전한 여가활동의 촉진과 지역봉사 활동기회를 보장하고 노인에게 적합한 직종의 개발과 그 보급을 위한 시책을 강구하여 경로당 이용 노인의 수익활동을 지원함으로써 노인의 복지증진에 기여함을 목적으로 한다.제2조(정의) 이 조례에서 사용하는 용어의 정의는 다음과 같다.1. “경로당”이란 「노인복지법」 제36조에 따른 노인여가복지시설을 말한다.2. “노인복지 관련기관 및 단체”란 노인의 권익신장을 위하여 필요한 각종 지원서비스 제공 및 권익옹호활동을 하는 비영리 민간기관 및 단체를 말한다.제3조(적용범위) 이 조례는 「노인복지법 시행규칙」 제25조의 규정에 의하여 신고필증이 교부된 경로당에 한하여 적용한다.제4조(시의 책무) 대구광역시(이하 “시”라 한다)는 노인의 복지 개선과 사회참여 확대를 위하여 교육, 여가활동, 봉사활동, 수익활동 등의 다양한 프로그램을 개발 보급함으로써 경로당 이용노인을 건전하게 보호·육성할 수 있는 적절한 시책을 강구하여야 한다.'
