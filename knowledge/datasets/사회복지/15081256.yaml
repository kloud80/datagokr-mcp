summary_user: 사립학교교직원연금공단 이사회 회의록의 목록을 건별로 담은 파일로, 회의마다 번호·제목·등록일·사유발생일이 한 행씩 들어 있다. 공단의 최고 의사결정기구가 언제 어떤 안건으로 열렸는지 확인하려는 국민이나 공공기관 지배구조(ESG)를 점검하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·날짜를 손으로 대조하거나 같은 기관(사학연금공단) 단위로만 이어 쓴다.
description_portal: '사립학교교직원연금법 제14조(이사회)에 의해 설립되고 사립학교교직원연금공단 정관 제23조(의결사항)에 따라 사립학교교직원연금공단의 중요사항을 심의 및 의결하는 최고 의사결정기구인 이사회 운영과 관련된 항목입니다.회의일시와 회의장소, 출석임원과 불참임원, 상정안건으로 구성된 회의개요와, 안건별 주요내용, 참석자 발언요지, 논의결론 등으로 구성된 논의결과(요지)를 기록하여 국민에게 공개하는 이사회 회의록에 관한 데이터입니다. 연번, 제목, 등록일, 사유발생일 등의 항목을 제공합니다.해당 데이터는 공단 대표홈페이지 경영공기 메뉴 > 기획재정부 통합공시 > ESG운영 항목 중 이사회 회의록에서 더 자세한 자료를 다운로드 받을 수 있습니다.URL : https://www.tp.or.kr/tp-kr/cntnts/i-805/web.do'
