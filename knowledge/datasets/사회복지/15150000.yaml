summary_user: 청소년 자원봉사 터전에서 운영된 봉사활동을 운영번호 단위의 건별 기록으로 담으며, 단체번호·활동인원수·장소·프로그램 내용·활동 내용·자원봉사시스템 활용 여부가 들어 있고 범위는 전국이다. 청소년 활동 담당자나 분석가가 "자원봉사 터전들은 어떤 프로그램을 몇 명 규모로 운영하는가"를 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 단체번호(grpNo)를 같은 기관의 터전·단체 정보와 맞추거나 이름으로 매핑하는 방식으로만 연결된다.
description_portal: 성평등가족부 청소년활동 자원봉사 터전 봉사활동 운영 정보는 청소년 자원봉사 터전에서 진행되는 봉사활동의 구체적 운영 내역을 체계적으로 기록하고 관리하기 위해 제공되는 자료입니다. 활동명, 운영 일자, 참여자 명단, 지도자 정보, 활동 장소, 진행 상태 등 다양한 데이터를 포함하며, 기관에서는 이를 활용하여 봉사활동 계획 관리, 참여자 안내, 안전 점검, 활동 기록 관리, 프로그램 평가, 정책 분석, 교육 지도, 프로그램 개선 등 다양한 목적으로 활용할 수 있습니다. 또한 봉사활동 운영 정보는 터전 활동 기록 관리와 프로그램 신뢰성 확보에도 중요한 기초 자료입니다.
