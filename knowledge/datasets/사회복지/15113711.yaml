description_portal: 기초생활수급자 현황 정보는 부산광역시 남구에서 국민기초생활보장사업의 혜택을 받고있는생계, 의료, 주거, 교육 급여 대상자의 숫자로 구성된 데이터 입니다.* 시설에서 생활하는 시설수급자와 북한이탈주민등 국민기초생활보장 적용을 받지 않는  별도 지원대상자는 통계에서 제외됩니다. * 국민기초생활보장법은 2000년 10월부터 시행되었으며, 이후 복지수요와 욕구가 다양해지면서  2015년 7월 1일자로 맞춤형 복지급여가 시행되면서 가구별로 필요한 급여를 맞춤형으로 지원하는  기반을 마련하였습니다. 현재는 현금지원을 하는 생계급여, 병원비 지원을하는 의료급여,   임대료 지원 주거급여, 교육활동 지원하는 교육급여로 각 가구별 특성에 다른 급여가 지급되고 있습니다
