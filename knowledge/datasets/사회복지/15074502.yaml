description_portal: 청소년 활동정보 신고프로그램 정보를 제공하는 오픈 API입니다. 해당 개방 데이터를 통해 시도구분, 시군구구분, 프로그램명, 기관명, 활동시작 및 종료일, 인증여부, 인증번호, 신고번호, 참가비, 참가대상, 등록일 등의 정보를 확인할 수 있습니다. 인증번호 및 신고번호를 포함하고 있어 정식으로 등록된 활동 여부를 쉽게 확인할 수 있습니다. 참가비, 대상, 등록일 등 세부 항목은 프로그램의 합법성과 운영 신뢰도를 판단하는 데 중요한 기준이 됩니다. 특히 공공기관이나 학부모 대상 플랫폼에서 안심 프로그램으로 구분하고 추천하는 데 활용될 수 있습니다.
