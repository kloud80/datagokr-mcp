summary_user: 청소년 활동정보 신고제에 따라 신고된 활동 프로그램을 프로그램 단위로 담은 건별 데이터로, 프로그램명·운영 기관명·활동 시작일·인증 여부·참가비·참가 대상 등을 전국 범위로 제공한다. 학부모나 청소년 대상 플랫폼 운영자가 "우리 지역에서 정식 신고된 청소년 프로그램은 무엇이고 참가비와 대상은 어떤가"를 확인하거나 인증 프로그램을 골라 안내하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명·프로그램명 같은 이름 매칭이나 같은 기관의 코드로만 연결하며, 청소년 수련시설 등 시설 데이터와는 기관명으로 잇는 방식이 현실적이다.
limits: 공통 코드 형태의 조인 키가 없어 시설·지역 통계와의 결합은 이름 매핑에 의존하므로 표기 차이로 누락·오매칭이 생길 수 있다. 개발계정 호출은 일 10,000회로 제한되고, 데이터는 신고 시점에 생성된 뒤 바뀌지 않는 이벤트성 기록이라 이후 운영 변경은 반영되지 않는다.
