summary_user: 도로교통공단 자료를 바탕으로 스쿨존 안에서 12세 이하 어린이 교통사고가 자주 난 지점(다발지)을 전국 범위로 담으며, 다발지마다 사고 건수와 사상자·사망·중상·경상·부상신고 인원, 위치 좌표와 영역 정보를 함께 제공한다. 학부모나 지자체 교통안전 담당자가 우리 동네 스쿨존 중 어린이 사고가 몰린 곳과 그 피해 규모를 확인하고 안전시설 보강 우선순위를 정하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 시도·시군구명, 법정동 코드(STDG_CD), 경찰서 코드·이름 같은 값으로 이름·코드를 매핑해 행정구역 통계나 같은 기관의 다른 교통약자 사고다발지 데이터와 이어 쓴다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 도로교통공단에서 제공하는 스쿨존 내 12세이하 어린이 교통사고 관련 정보입니다.
