summary_user: 2009~2022년 국내·국외 입양아동 수와 입양기관 현황을 「보건복지통계연보」에서 추출한 전국 단위 집계 통계로, 구분별 합계(계)·국내·국외 인원을 담는다. 연도별로 국내 입양과 국외 입양이 어떻게 달라졌는지 보려는 분석가·정책 담당자가 입양 추이와 기관 규모를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·구분 이름을 맞춰 연결하며, 2023년 이후 수치는 후속 데이터인 '보건복지부_입양 아동 현황' 파일과 이어 본다.
description_portal: 2009년부터 2022년까지의 국내, 국외 입양아동 수 및 입양기관 현황을 제공합니다. 시도별 입양아동 수는 입양절차를 진행한 입양기관 주소지 기준입니다. 입양기관 현황은 본부 기준입니다.<통계 데이터 이용 시 참고사항> * 해당 데이터는「보건복지통계연보」 추출 데이터로 2023년도부터는 지표명 및 항목이 변경되어, 2022년까지의 데이터로 종결처리함과 동시에 바뀐항목을 반영한 '보건복지부_입양 아동 현황' 파일데이터를 신규 개방하였으니 데이터 활용에 참고를 부탁드립니다.
