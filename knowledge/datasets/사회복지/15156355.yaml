summary_user: 아이돌봄서비스 요금체계를 바탕으로 만든 AI 학습용 질의응답 데이터로, 한 건마다 질문 의도·참고 지문·조건·자연어 답변·추론 과정과 출처 원시파일·페이지를 담으며 범위는 전국·비공간이다. 아이돌봄 요금이나 정부지원 비율을 묻는 질문에 답하는 상담 챗봇이나 언어모델을 학습·평가하려는 개발자와 분석가가 "우리 집 조건에서 시간당 본인부담금이 얼마인가" 같은 질문의 답변 예시로 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키는 찾지 못했고, 요금체계ID(feeId)나 원시파일명으로 같은 기관 데이터와 이름 매핑하는 정도로만 연결한다.
limits: 요금표 자체나 이용 실적 같은 통계가 아니라 학습용 문답 데이터이므로 현황 집계·지역 비교에는 쓰지 못한다. 공통 조인 키가 없어 다른 공공데이터와의 결합은 이름·코드 수동 매핑에 의존한다.
