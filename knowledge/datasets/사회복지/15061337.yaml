description_portal: '금융통계신용협동조합정보는 기준년월과 조합명을 기준으로 신용협동조합의 일반현황, 재무상태, 경영성과 정보를 제공하는 데이터입니다.이 데이터는 3개 오퍼레이션으로 구성되어 있습니다.각 오퍼레이션은 다음과 같습니다.① 신용협동조합 일반현황 조회 : 설립일, 본점 소재지, 조합원 수, 지점 현황 등 기본 정보를 제공합니다.② 신용협동조합 재무현황 조회 : 자산, 부채, 자본 등 재무구조 관련 정보를 조회할 수 있습니다.③ 신용협동조합 주요경영지표 조회 : ROA, ROE, 순이익률 등 경영성과 관련 주요 지표를 제공합니다.'
