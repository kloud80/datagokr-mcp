summary_user: 2025년 1월부터 12월까지 월별로 육아휴직급여를 처음 받은 사람 수를 성별·지역별로 집계한 통계 파일로, 행(구분)마다 월이 열로 펼쳐진 형태다. 정책 분석가나 지자체 담당자가 '2025년 우리 지역에서 남성 육아휴직 첫 수급자가 월별로 어떻게 늘었는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 지역 통계와는 지역명을 직접 맞춰 붙여야 한다.
limits: 표준 지역코드 같은 조인 키가 없어 지역명 매핑으로만 다른 데이터와 연결된다. 실측상 행정단위가 전국·비공간으로 분류되어 있어 시군구 수준 지도화나 공간 분석에 바로 쓰기는 어렵다. 초회 수급자 수만 담으므로 누적 수급자나 지급액은 알 수 없다.
