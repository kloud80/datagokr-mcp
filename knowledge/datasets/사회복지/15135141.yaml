summary_user: 경기도 워라밸링크 플랫폼이 서비스 대상으로 삼는 지역 목록을 지역 한 곳당 한 행으로 담은 코드표이며, '전체'와 고양시·과천시·광명시 등 경기도 시군의 이름(region_nm)과 지역 번호를 담는다. 워라밸링크의 정책·프로그램 자료를 다루는 분석가가 해당 프로그램이 어느 시군에 적용되는지 구분하고 지역별로 묶어 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 같은 기관(경기도)의 워라밸링크 데이터와는 지역 번호로, 다른 데이터와는 시군 이름을 맞춰 연결한다.
description_portal: 이 데이터는 경기도에서 운영하는 워라밸링크 플랫폼의 서비스 대상 지역 정보를 담고 있으며, 각 지역의 고유번호, 이름, 지역 고유번호 등의 항목으로 구성되어 있습니다. '전체'를 포함해 고양시, 과천시, 광명시, 구리시, 남양주시 등 경기도 내 주요 시군이 포함되며, 워라밸링크와 관련된 정책이나 프로그램이 어떤 지역에 적용되는지를 구분하는 데 활용됩니다. 해당 데이터는 지역별 워라밸 관련 정책의 수요 분석, 서비스 제공 범위 설정, 지역 맞춤형 정책 기획 등에 유용하며, 행정구역 코드 체계를 기반으로 경기도 지역 단위의 데이터 분류 및 연계를 위한 기초 자료로 활용할 수 있습니다.
