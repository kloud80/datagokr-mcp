summary_user: 경기도 연천군의 장애인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·시설유형·시설종류·도로명/지번 주소·위경도·전화번호·기준일자를 담는다 (csv 약 1.1KB의 소규모 목록). 연천군 주민이나 보호자가 집 근처의 장애인 거주시설, 이동지원센터, 수어통역센터, 보호작업장 같은 직업재활시설을 찾고 연락처를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없고, 시설명·주소로 맞추거나 위경도로 지도·인근 시설 데이터와 공간적으로 겹쳐 쓴다.
description_portal: '경기도 연천군에서 제공하는 장애인복지시설현황에 대한 파일데이터로 장애인 복지시설의 시설명, 시설유형, 시설종류, 주소, 위경도,  전화번호 정보를 제공합니다.시설 분류별 요약1. 장애인생활시설: 중증장애인 거주시설2. 장애인지역사회재활시설: 생활이동지원- 특징 ㄱ. 이동이 불편한 장애인의 통학, 통원, 외출 등의 교통지원ㄴ. 지역 내 장애인의 자립생활을 위한 이동권 확보 지원ㄷ. 공공·복지시설 접근성을 높여주는 핵심 인프라수어통역센터- 특징ㄱ. 청각·언어 장애인을 위한 수어(수화) 통역 서비스 제공ㄴ. 지역사회와 청각장애인 간 소통 다리 역할3. 장애인직업재활시설: 직업적응훈련시설, 보호작업장'
