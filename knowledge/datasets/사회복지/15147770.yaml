description_portal: 본 데이터는 결식 우려 아동이 안정적으로 식사를 제공받을 수 있도록 지원하는 아동급식카드(꿈나무카드) 가맹 음식점 현황을 정리한 자료입니다. 아동급식카드(꿈나무카드)는 결식 위기에 놓인 아동들이 지역 내 가맹 음식점에서 식사를 할 수 있도록 지원하는 제도입니다. 이 데이터에는 꿈나무카드 이용자가 사용이 가능한 음식점, 편의점 등의 가맹점 명과 가맹점 주소를 포함하고 있습니다. 이 데이터를 활용하여 꿈나무카드 이용 아동 및 보호자가 가까운 가맹점을 손쉽게 찾을 수 있도록 하는데 그 목적이 있습니다.
