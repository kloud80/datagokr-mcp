summary_user: 아이돌봄 서비스 정부지원 자격을 판단할 때 필요한 입증서류와 그 확인·발급 방법을 기준년도·구분·대상별로 정리한 전국 단위 안내표로, 건별 원천이 아닌 기준 정보이며 약 5.8KB 크기의 CSV 파일 하나다. 아이돌봄 서비스를 신청하려는 부모가 '우리 가구가 정부지원을 받으려면 어떤 서류를 어디서 발급받아야 하나'를 확인하거나, 담당자가 심사 기준을 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대상·구분 같은 이름을 맞추거나 같은 기관(한국건강가정진흥원) 자료끼리 묶어 참고하는 방식으로만 연결한다.
