summary_user: 신안군의 다자녀행복카드 가맹점을 매장 한 곳당 한 행으로 담은 파일(csv, 약 4.6KB)로, 가맹점명·업종·브랜드·주소·전화번호·제공 혜택·제휴 시작일과 종료일을 수록한다. 신안군에 사는 다자녀가구가 "근처에서 카드 혜택을 받는 가게가 어디이고 할인 내용은 무엇인가"를 확인하거나, 담당 공무원이 업종별 제휴 현황과 제휴 만료 예정 매장을 점검하는 데 쓴다. 전역 조인 키나 시군구코드가 없어 다른 데이터와는 시도·시군구 이름이나 가맹점 주소를 기준으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 다자녀가구의 복지 증진과 지역경제 활성화를 목적으로 운영되는 ‘다자녀행복카드’의 가맹점 현황을 수록한 자료로, 전국 시도 및 시군구별 제휴 매장 정보를 제공합니다. 데이터에는 가맹점명, 업종명, 브랜드, 가맹점 주소, 전화번호, 제공 혜택, 제휴 시작일 및 종료일 등의 항목이 포함되어 있으며, 이를 통해 다자녀가구가 이용 가능한 가맹점의 위치와 혜택을 한눈에 파악할 수 있습니다. 본 자료는 복지정책 수립, 제휴 관리, 신규 가맹점 발굴, 민원 대응, 지역별 이용 현황 분석 등 다양한 행정·연구 분야에서 기초자료로 활용될 수 있으며, 지속적인 업데이트를 통해 효율적인 복지서비스 제공과 정책 의사결정에 기여합니다.
