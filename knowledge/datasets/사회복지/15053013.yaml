summary_user: 공무원연금공단이 관리하는 퇴직자 수를 급여종류(퇴직일시금·정상연금·조기연금·퇴직연금공제일시금·유족급여 등)별, 성별, 직종(일반직·경찰·소방·교육직 등)별로 집계한 전국 단위 통계 파일(csv 약 1.5KB)이다. 연금 정책 분석가나 연구자가 '경찰·소방 같은 특정 직종 퇴직자는 일시금보다 연금을 얼마나 더 많이 택하는가'처럼 직종별 급여수급 형태를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 직종명·급여종류명을 맞춰 연결하거나, 같은 기관의 다른 공무원연금 통계와 나란히 놓고 쓴다.
limits: 지역 구분이 없는 전국 단위 집계라 지역별 분석에는 쓸 수 없고, 개인 단위 원천 자료도 아니다. 포털 설명에 따르면 퇴직연금공제일시금 인원은 중복을 막으려고 합계와 계에서 빠져 있고, 퇴직수당만 받은 미수령합산자와 특례가입자가 제외돼 급여종류별 건수가 퇴직자 수보다 적다.
