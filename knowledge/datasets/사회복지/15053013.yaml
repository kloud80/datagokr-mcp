description_portal: '공무원연금공단에서 관리하는 퇴직자수를 급여종류별 성별 직종별로 제공하는 데이터로, 직종에 따라 급여수급 형태를 파악할 수 있습니다.직종 : 일반직, 정무직, 별정직, 경찰, 소방, 교육직, 법관검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(우정직, 고위직, 외무직, 청원경찰, 전문경력관 등)급여종류 : 퇴직급여(퇴직일시금,정상연금,조기연금), 퇴직연금공제일시금, 유족급여(유족일시금, 유족연금일시금, 유족연금)1. 퇴직연금공제일시금 인원은 중복계상되지 않도록 "합계"와 "계"에서 제외함 2. 급여종류별 건수가 퇴직자 수보다 적은 것은 퇴직수당만 지급된 미수령합산자와 한국철도공사법 부칙 제8조에 의한 특례가입자가 제외되었기 때문임3. 조기연금 : 연금지급개시연령 도달전 연금신청자 4. 수급대기자 : 연금지급개시연령 미도래자'
