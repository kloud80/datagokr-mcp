summary_user: 경상남도 내 인증·예비 사회적기업을 기업 한 곳당 한 행으로 담은 파일로, 기업명·대표자·주소·지정(인증)번호와 사회서비스 분야, 사회적 목적 유형, 조직형태, 업종·업태, 사업내용 요약을 포함한다(CSV 약 60KB). 지자체·중간지원조직·연구자가 '경남 시군별로 어떤 사회서비스 분야의 사회적기업이 얼마나 있고, 일자리 제공형과 사회서비스 제공형 중 어느 유형이 많은가'를 따지거나 협력·구매 대상 기업을 찾는 데 쓴다. 전역 조인 키는 없어 지정(인증)번호나 기업명으로 사회적기업 인증 목록 등 다른 기업 데이터와 맞추고, 주소·지역 필드로 시군 단위 통계와 이어 쓴다.
description_portal: 이 데이터셋은 경상남도 내 인증 사회적기업의 현황을 종합적으로 제공하며, 각 기업의 인증번호, 기관명, 주요 사업내용, 사회적 목적 실현 유형, 사회서비스 분야, 소재지 주소 등의 정보를 포함합니다. 이를 통해 사회적기업이 지역사회에서 수행하는 다양한 공익적 역할과 사회서비스 제공 방식, 업종 분포, 설립 연도별 동향 등을 파악할 수 있으며, 해당 자료는 지역 기반의 사회적경제 분석, 사회적기업 정책 수립, 공공기관 협력모델 개발, 민간 협력사업 기획, 통계 분석 등 다방면에서 활용 가능한 기초자료입니다. 연구기관, 지자체, 관련 중간지원조직 등에도 유익하게 쓰일 수 있습니다.
