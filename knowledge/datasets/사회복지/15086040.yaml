description_portal: 대구광역시 서구 장애인등록현황입니다.(동별, 장애유형별(지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐, 정신, 신장, 심장, 호흡기, 간, 안면, 장루요루, 뇌전증)) 자료를 포함합니다.본 자료는 대구광역시 서구 관내 각 동별로 등록된 장애인의 현황을 유형별·성별로 구분하여 체계적으로 정리한 데이터이다. 지체장애, 시각장애, 청각장애 등 16개 장애 유형에 대해 남성과 여성 인원 수를 각각 수록하였으며, 동별로 세분화된 통계 정보를 제공한다. 이를 통해 지역별 장애인 분포 현황을 파악하고, 맞춤형 복지 서비스와 정책 마련에 필요한 기초 정보를 지원한다. 해당 데이터는 장애인 복지 업무 및 행정 계획 수립에 활용되는 핵심 자료이다.
