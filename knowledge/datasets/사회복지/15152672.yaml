description_portal: 본 데이터는 한국청소년상담복지개발원이 운영하는 위기청소년통합지원정보시스템을 기반으로 수집된 전국 청소년상담복지센터의 사례관리 통계자료입니다.2023년 3분기부터 2025년 2분기까지의 분기별 청소년 문제상태 분류 현황을 포함하며, 주요 항목은 사례건수, 평균문제상태건수, 문제상태 유형별 건수로 구성되어 있습니다.본 자료는 청소년의 심리·사회적 문제를 유형별로 분류하고 분석하여 상담 및 복지서비스 제공의 기초자료로 활용할 수 있습니다.문제상태는 상담 현장에서 식별된 다양한 청소년의 어려움을 반영하며, 사례관리 과정에서의 문제유형 분류 기준을 바탕으로 정리되었습니다.본 자료는 상담사례의 특성과 문제상태의 분포를 파악하는 데 유용하며, 청소년 대상 맞춤형 지원체계 수립을 위한 참고자료로 제공됩니다.
