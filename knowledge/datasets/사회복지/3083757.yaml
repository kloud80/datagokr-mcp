description_portal: 본 데이터는 지역 내 장사시설 현황을 제공한다. 장사 등에 관한 법률에 따라 설치된 화장시설, 봉안시설, 묘지 등의 운영 정보를 포함한다. 시설명, 수용능력, 운영주체, 면적, 설립연도, 소재지, 연락처, 봉안능력, 화장로 등의 항목을 수록한다. 시설명은 각 시설의 명칭이며, 수용능력은 안장 가능한 분묘 수를 나타낸다. 운영주체는 시설을 관리하는 기관이나 법인이고, 면적은 부지 크기이다. 설립연도는 시설 조성 연도이며, 소재지는 위치 주소를 나타낸다. 연락처는 관리 담당 전화번호이고, 봉안능력은 유골함 안치 가능 칸 수이다. 화장로는 화장 설비 수를 의미한다. 본 데이터로 장례 인프라를 파악할 수 있으며, 장례 복지 정책 및 시설 이용 안내 자료로 활용된다.
