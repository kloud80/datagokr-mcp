description_portal: 이 데이터는 2021년 7월 31일 기준으로 서울특별시의 차상위계층 인구 현황을 자치구별·행정동별·연령대별로 집계한 공공데이터입니다.각 행은 특정 자치구의 행정동 단위별 인구 구성을 나타내며, 주요 항목에는 자치구명, 동명, 연령구간(0세~100세 이상), 성별, 차상위계층 인원 수, 전체 인구 대비 비율 등이 포함됩니다.이 자료는 지역별 복지수요 분석, 취약계층 분포 파악, 사회안전망 강화 정책 수립, 맞춤형 복지자원 배분 등 다양한 사회·행정 정책 연구에 활용될 수 있습니다. 특히 연령대별 인구 분포를 통해 고령층·청년층의 상대적 취약 정도를 시각화하거나, 시군구 간 불균형 현황을 파악하는 데 유용합니다. 데이터에 대한 문의는 복지정책과(02-2133-7348)로 연락주시기 바랍니다.
