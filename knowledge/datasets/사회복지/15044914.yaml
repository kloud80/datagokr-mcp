description_portal: '경상남도 거창군 내 장애인시설명현황에 대한 데이터로   거창군 내 장애인시설 시설구분,  거창군 내 장애인시설 시설명,  거창군 내 장애인시설 도로명주소,  거창군 내 장애인시설 지번주소,  거창군 내 장애인시설 운영주체,  거창군 내 장애인시설 종사자수,  거창군 내 장애인시설 위도,  거창군 내 장애인시설 경도 항목을 제공합니다.○ 데이터 기준일 : 2025. 08. 01.○ 장애인 시설은 장애인이 생활에 필요한 편의를 누릴 수 있도록 돕는 시설로, 크게 거주시설, 지역사회재활시설, 직업재활시설 등으로 구분됩니다. 거주시설은 장애인에게 주거, 일상생활, 지역사회생활 등의 서비스를 제공하며, 지역사회재활시설은 장애인복지관, 주간이용시설 등 사회 참여를 위한 시설을 말합니다. 직업재활시설은 장애인의 직업 훈련 및 생산품 판매 등을 지원합니다.'
