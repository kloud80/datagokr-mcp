summary_user: 경상남도 거창군 안의 장애인시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설구분·시설명·도로명/지번주소·운영주체·종사자수·위도·경도를 담는다. 거창군 주민이나 보호자가 집 근처의 장애인 거주시설·복지관·직업재활시설이 어디에 있고 누가 운영하는지 찾을 때, 또는 분석가가 군 내 시설 분포와 종사자 규모를 볼 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소·좌표(위도·경도)로 지도 위에 겹치거나 시설명을 맞춰 이어 쓴다.
limits: 거창군 한 곳의 시군구 범위만 담으므로 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다. 공통 시설 코드가 없어 다른 장애인시설 데이터와 합칠 때는 시설명·주소를 직접 맞춰야 한다.
