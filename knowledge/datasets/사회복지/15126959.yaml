description_portal: '부산광역시_광역푸드뱅크, 기초푸드뱅크 및 기초푸드마켓 현황으로 자치구군별 소재지, 사업장명, 신고기준, 사업장 소재지, 연락처, 운영주체 등의 정보를 포함합니다.기부식품등 제공사업은 각 사업장에서 기부 등을 통해 확보한 식품 뿐만 아니라, 생활용품 등을 우리 지역 내 취약계층에게 지원합니다.광역푸드뱅크 운영과 관련한 사항에 대해서는 부산광역시로 문의해 주시기 바라며, 기부식품등 제공사업 기초사업장 운영과 관련한 사항에 대해서는 자치구군별 소관 복지부서로 문의하여 주시기 바랍니다.※ 푸드뱅크 : 기부받은 식품을 사회복지관 등 시설에서 신청자에게 직접 전달하거나, 신청자가 확인증을 가지고 시설을 방문하여 수령합니다.※ 푸드마켓 : 실제 슈퍼마켓처럼 매장을 운영하며, 이용자가 회원카드를 가지고 매장을 방문하여 원하는 물품을 직접 선택합니다.'
