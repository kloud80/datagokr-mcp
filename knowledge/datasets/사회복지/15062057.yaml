summary_user: 광주광역시 관내 가족센터(옛 건강가정·다문화가족지원센터) 5곳의 기관명·소재지·홈페이지 주소·전화번호를 센터 1곳당 1행으로 담은 소규모 목록 파일이다. 주민이나 다문화가정이 '우리 구의 가족센터는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 지역 가족지원 시설 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 사회복지시설 목록과는 기관명이나 소재지 주소를 매칭해 이어 쓴다.
