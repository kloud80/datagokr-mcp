description_portal: '평택시 자원봉사 단체 현황 데이터는 평택시 대표 홈페이지 DB 데이터로서 지역사회에서 활동하는 다양한 자원봉사 단체의 조직 규모, 활동 분야 등을 체계적으로 파악하여 시민 참여 활성화와 공공·민간 협력 강화를 지원하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 자신의 관심 분야에 맞는 봉사단체를 쉽게 찾고 참여할 수 있으며, 기관·민간단체·연구기관은 지역사회 문제 해결을 위한 협력 모델 구축, 사회공헌 프로그램 개발, 자원봉사 수요·공급 분석 등에 활용할 수 있습니다. 본 데이터에는 단체명, 활동 분야(환경·복지·교육 등), 구성원 수 등의 정보가 포함되어 있어 지역 내 자원봉사 단체 정보를 파악할 수 있습니다. 이러한 자료는 시민참여 기반 강화, 지역사회 문제 해결 역량 제고, 공공정책 연계, 민간 자원 활용 확대 등 공공·민간 영역에서  활용할 수 있는 데이터입니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 정보통신과(031-8024-2413)※ 홈페이지 URL : https://www.pyeongtaek.go.kr/depart/info/apartment/list.do?mId=0516010000'
