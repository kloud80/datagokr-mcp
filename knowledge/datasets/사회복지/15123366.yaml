description_portal: 본 데이터는 대전교통약자이동지원센터에서 운영 중인 차량별 월간 운행 실적을 기록한 자료로, 차량 관리 및 서비스 운영 효율화를 위한 기초 자료로 활용됩니다. 데이터는 차량번호를 기준으로 특장차, 임차택시, 바우처택시 등 차종별 운행 건수등을 포함하며, 센터의 배차시스템과 차량 GPS 데이터를 연동하여 수집됩니다. 주요 활용 목적은 차량별 활용도 분석을 통한 적정 보유 대수 산정, 고장 빈도가 높은 차량의 조기 정비 계획 수립, 시간대별 수요 분석에 따른 차량 배치 최적화 등이며, 데이터 정확성을 위해 매월 말 차량 운행일지와 실제 GPS 로그를 대조하여 검증하는 절차를 거칩니다.
