summary_user: 대구 달서구 안에서 운영하는 노인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설유형·종류·이름·주소·행정동·위경도·전화번호·담당부서·기준일자를 포함한다. 주민이나 보호자가 '우리 동네(행정동) 가까이에 있는 재가·주간보호 같은 노인복지시설이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 달서구 행정동별 시설 분포를 볼 때 쓴다. 전역 조인 키나 사회복지시설 시설코드가 없으므로, 장기요양기관 목록이나 지역 통계와는 시설명·주소 매칭이나 행정동 이름, 좌표로만 이어 쓴다.
description_portal: 본 데이터는 정신적, 신체적인 이유로 독립적인 일상생활을 수행하기 곤란한 노인과 노인부양가정에 필요한 각종 서비스를 제공하기 위해 대구광역시 달서구 내 운영하는 노인복지시설 현황입니다.항목은 위도, 경도, 번호, 시설유형, 시설명, 시설종류, 주소, 행정동, 전화번호, 담당부서, 기준일자 등으로 구성되어있으며, 1년마다 주기에 따라 현행화합니다.해당 자료는 달서구청 홈페이지(www.dalseo.daegu.kr)를 통해 분야별정보> 복지> 노인> 복지시설> 재가노인복지시설, 노인생활시설에서 확인 가능합니다.
