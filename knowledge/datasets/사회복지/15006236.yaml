summary_user: 대구광역시 북구 관내 아동복지시설(아동양육시설·아동일시보호시설·공동생활가정)을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명주소·전화번호·정원·설치일자·위경도를 포함하며 파일 크기는 614바이트로 작다. 보호가 필요한 아동을 맡길 시설이 북구 어디에 있고 정원이 몇 명인지 확인하려는 주민·사회복지 담당자·분석가가 쓴다. 전역 조인 키는 없어 시설명·주소 매칭이나 위경도 기반 공간 결합으로 다른 사회복지시설 목록과 이어 쓴다.
description_portal: '아동복지시설의 의미  : 아동복지시설은 아동의 복지를 위하여 「아동복지법」 에 따라 국가 또는 지방자치단체가 설치하거나, 국가 또는 지방자치단체 외의 자가 관할 시장·군수·구청장에게 신고하고 설치한 시설입니다.아동복지시설(아동양육시설 및 공동생활가정)의 목적:보호가 필요한 아동에게 안정적인 양육 환경 및 자립 환경을 지원하며 아동의 권리 증진과 복지 증진에 기여하여 요보호아동이 건강하게 자라 사회에 자립 정착할 수 있도록 지원합니다.대구광역시 북구 관내에 설치된 아동복지시설(아동양육시설, 아동일시보호시설 및 공동생활가정) 현황(시설 명칭, 소재지 도로명 주소, 전화번호, 정원, 설치일자 등) 정보를 제공합니다.'
