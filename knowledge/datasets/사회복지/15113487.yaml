summary_user: 광양시에서 노인일자리 사업을 운영하는 수행기관별로 사업유형, 사업 수, 참여자 수, 소재지, 전화번호를 담은 기관 단위 현황 파일이다(csv 812바이트 규모의 소량 목록). 광양시 주민이나 복지 분석가가 우리 동네에서 어느 기관이 어떤 유형의 노인일자리를 몇 명 규모로 운영하는지, 신청하려면 어디로 연락하는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 수행기관 이름이나 소재지 주소를 맞춰 잇고, 지역 통계와는 시군구(광양시) 단위로만 연결한다.
description_portal: 본 데이터는 전라남도 광양시에서 운영 중인 고령자 일자리 및 사회활동 지원 사업에 대한 현황을 체계적으로 관리하고, 지역 맞춤형 복지정책 수립 및 공공일자리 확대 기반 마련에 활용하기 위해 구축된 자료입니다. 각 수행기관별로 운영 중인 사업유형, 사업 수량, 참여자 수, 기관 소재지, 연락처 등의 정보가 포함되어 있으며, 고령화 시대에 발맞춘 안정적인 사회참여 기회를 제공하고자 하는 목적 하에 정기적으로 점검 및 갱신됩니다. 해당 자료는 지자체의 노인복지 행정 기초자료로서, 공공활동 중심의 노인 사회참여 활성화 정책 수립, 참여 인원 분포 분석, 사업 유형별 성과 평가 및 예산 배분 기준 마련 등에 활용될 수 있으며, 민간에서는 복지서비스 연계 모델 개발, 고령친화도시 연구, 지역사회 기여 활동 설계 등의 목적에도 활용이 가능합니다. 또한, 수행기관별 세부 정보가 포함되어 있어 복지기관 간 협업체계 구축 및 유관기관 네트워크 분석에도 유용하며, 데이터는 공공데이터포털을 통해 국민 누구나 자유롭게 열람 및 활용할 수 있도록 개방되어 있습니다.
