description_portal: 한국남동발전의 상생협력 언론보도 내용 현황입니다.주로 삼천포발전본부에서 2019년 1월 ~ 2019년 12월 기간 동안 지역언론 유형으로 보도한 기사명, 등록일에 대한 정보를 포함하고 있습니다.지역사회와 더불어 발전할 수 있는 다양한 사회공헌활동을 발굴, 시행하여 나눔경영을 실천하는 상생협력을 목적으로 한 언론보도 내용 현황 데이터를 제공하고 있습니다. 이 데이터는 한국남동발전이 지역사회 소외계층의 니즈를 반영한 다양한 사회공헌활동을 지속적으로 전개하여 따뜻한 사회 구현을 위해 노력하고 있는지 확인하는 자료로 활용할 수 있습니다.
