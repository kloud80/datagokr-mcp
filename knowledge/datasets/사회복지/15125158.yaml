summary_user: 청소년 자기도전 포상제 참가자가 제출한 활동개요서의 이력을 활동번호·활동순서·이력순서 단위의 건별 기록으로 담으며, 영역·구분·활동명, 시작·종료일자, 장소, 승인·반려일자와 숙박·식사·이동방법 구분을 포함한 전국 범위 자료다. 포상제 운영기관이나 분석가가 '어떤 영역의 활동이 반려되거나 중도에 끝나는 경우가 많은가'처럼 활동 승인 흐름과 이탈 패턴을 살피는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않았고, 같은 기관의 포상제 관련 데이터와 활동번호(actvNo)나 영역·활동 이름을 맞춰 이어 쓰는 방식만 가능하다.
description_portal: 청소년 자기도전 포상제 활동 개요서(이력) 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 활동순서, 활동이력순서, 영역명, 구분명, 활동명, 시작일자, 장소내용, 상태명, 종료일자, 승인일자, 반려일자, 식사구분명, 이동방법구분명 등의 내용을 확인할 수 있습니다.동일 활동의 반복 여부나 중도 이탈 등의 패턴을 확인하는 데 유용한 자료이며, 프로그램 운영의 개선 방향을 도출하거나, 참여자 맞춤형 피드백을 제공할 수 있습니다. 장기적인 포상제 발전 전략 수립 및 체계적인 평가 기준 마련에 유용하게 활용될 수 있습니다.
