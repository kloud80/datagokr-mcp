summary_user: 한국수력원자력(주)이 사회적경제조직을 지원한 실적을 연도별로 집계한 파일로, 연도마다 지원 단체 수와 지원 금액(원)을 담는다(포털 설명상 2019~2024년, 파일 크기 170바이트의 소규모 표). 연구자나 정책 담당자가 '한수원의 사회적경제조직 지원 규모가 해마다 어떻게 변했나'를 확인하거나 공공기관 사회적가치 실적을 비교할 때 쓴다. 전역 조인 키가 없어 연도 기준으로 다른 기관의 사회적경제 지원 실적과 나란히 놓는 방식으로만 이어 쓰며, 개별 기업의 인증번호·사업자번호가 없어 사회적기업 등 기업 단위 데이터와는 직접 연결되지 않는다.
