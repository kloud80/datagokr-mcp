summary_user: 경기도 내 통합학급 수를 연도(STD_YY)와 학교유형(공립·사립·국립)별로 집계한 자료로, 전체와 유치원·초등학교·중학교·고등학교·전공과 학교급별 학급 수를 담는다. 특수교육 정책 담당자나 분석가가 '경기도 공립학교의 초등 통합학급이 해마다 얼마나 늘었나'처럼 통합교육 확산 정도와 학교급별 배치 규모를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·학교유형 이름을 맞춰 붙여야 하며, 사회적경제 부문의 인증번호·사업자번호 같은 기업 축과는 직접 이어지지 않는다.
description_portal: 이 데이터는 교육부 특수교육통계를 바탕으로 경기도 내 통합학급 수를 학교유형별(공립, 사립, 국립) 및 연도별로 정리한 자료입니다. 매년 6월 말 기준으로 수집되며, 유치원, 초등학교, 중학교, 고등학교, 전공과 등 각 학교급별 통합학급 수가 포함되어 있습니다. 해당 데이터는 장애학생과 비장애학생이 함께 학습하는 통합교육 환경의 확산 정도를 파악하는 데 활용되며, 학교유형별 통합교육 실태, 학급 배치 규모, 지역별 학급 수요 분석 등에 중요한 기초 자료로 사용됩니다. 또한, 특수교육 정책 수립, 교원 및 시설 자원 배분 계획 등에 기여할 수 있습니다.
