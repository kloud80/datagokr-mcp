summary_user: 국민연금에서 탈퇴한 사업장을 한 곳씩 담은 건별 원천 데이터로, 전국을 법정동 단위로 조회하며 사업장명·도로명주소·업종·등록일·탈퇴일·법인/개인 구분을 담는다. 분석가나 사업자가 '특정 읍면동에서 최근 국민연금을 탈퇴한 법인 사업장은 어디이고 어떤 업종인가'처럼 지역별 폐업·이탈 동향을 볼 때 쓴다. 전역 조인 키는 없고, 시도·시군구·읍면동 법정동 코드로 지역 통계와, 국세청 업종코드(wkplIntpCd)로 업종 분류와, 같은 기관의 가입 사업장 데이터와는 사업장명·주소 매핑으로 이어 쓴다.
description_portal: '국민연금공단의 법정동단위 지역별, 국민연금 탈퇴 사업장 정보를 제공합니다.(사업장 주소, 사업장명, 주소, 업종, 등록일, 탈퇴일 등)* 단, 개인사업장 정보 미제공1) 기본정보조회(출력값): 사업자등록번호, 자료생성년월, 법정동주소광역시도코드,  법정동주소시군구코드, 법정동주소읍면동코드, 식별번호, 사업장명, 사업자도로명상세주소2) 상세정보조회(출력값): 사업장등록일, 사업자등록번호, 자료생성년월, 주소코드, 사업장탈퇴일, 식별번호, 사업업종코드명, 사업업종코드, 사업장명, 사업장도로명상세주소, 사업장형태구분코드자세한 내용은 참고문서(국민연금공단_오픈API활용가이드_탈퇴사업장 정보_v2.0.hwp)를 활용하시기 바랍니다.'
