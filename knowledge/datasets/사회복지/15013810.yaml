summary_user: 증평군 관내 노인복지시설의 시설명, 도로명·지번 주소, 위도·경도 좌표, 전화번호를 시설 한 곳당 한 행으로 담은 시군구 단위 목록 파일(CSV)이다. 군민이나 가족이 가까운 노인복지시설의 위치와 연락처를 찾거나, 분석가가 증평군 안에서 노인복지시설이 어느 지역에 몰려 있고 어디가 비어 있는지 접근성을 따질 때 쓴다. 전역 조인 키나 시설코드가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 좌표 기반 공간 결합으로 잇고, 건강보험 장기요양기관 목록이나 지역 통계(regional-statistics)와 이렇게 연계한다.
limits: 증평군 한 곳만 다루므로 다른 시군과 비교하려면 별도 파일이 필요하다. 시설 유형·정원·운영 현황 필드가 없고 공통 식별 코드도 없어, 다른 데이터와 붙일 때는 이름·주소 매핑 오류를 직접 점검해야 한다.
