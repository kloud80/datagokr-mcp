summary_user: 세계청소년자원봉사의 날 행사의 참가신청·봉사자 명단(상세 포함)·활동계획·활동내용·활동 증빙자료를 접수번호 단위의 건별 기록으로 담으며, 범위는 전국입니다. 청소년 봉사 정책 담당자나 분석가가 '어느 지역에서 어떤 주제로 몇 명이 봉사를 신청했고 실제 활동이 어떻게 진행됐나'를 확인하는 데 쓴다. 오퍼레이션끼리는 접수번호(rcptNo)로 신청·명단·활동 기록을 잇지만, 다른 데이터셋과 맞출 전역 조인 키는 없어 참여지역명·소속명 같은 이름 매핑으로만 지역 통계 등에 연결한다.
limits: 행사 때 생성된 뒤 바뀌지 않는 이벤트성 데이터라 상시 최신 현황 파악에는 맞지 않다. 행정코드 같은 공통 키가 없어 외부 데이터와는 지역명·기관명 문자열 매칭으로만 연결해야 한다.
