summary_user: 인천시 관내 (예비)사회적기업을 한 행에 한 기업씩 담은 목록으로, 구분(인증·예비), 기업명, 업종, 서비스 내용(취급품목), 군구, 도로명 주소를 담은 46KB 남짓의 CSV 파일이다. 시민이 "우리 동네에서 사회적기업 제품이나 서비스를 어디서 살 수 있나"를 찾거나, 예비 창업자·분석가가 인천 군구별·업종별 사회적기업 분포를 볼 때 쓴다. 인증번호나 사업자번호 같은 전역 조인 키가 없어 다른 사회적기업·사업자 데이터와는 기업명이나 군구·주소를 맞춰 이어 써야 한다.
description_portal: 인천광역시_사회적기업 현황 공공데이터는 인천시 관내 (예비)사회적기업에 대한 정보를 담고 있습니다. 이 데이터는 다음과 같은 항목으로 구성되어 있습니다.1. 구분2. 기업명3. 업종4. 서비스내용(취급품목)5. 군구6. 주소이 데이터는 사회적 가치를 창출하는 기업들을 한눈에 파악할 수 있게 해줍니다. 일반 시민들은 사회적기업 제품 구매를 통해 윤리적 소비를 실천할 수 있고, 예비 창업자들은 관련 정보를 얻는 데 도움이 됩니다.데이터는 CSV 파일로 제공되며, 누구나 공공데이터포털을 통해 다운받을 수 있습니다.
