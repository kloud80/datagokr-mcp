description_portal: '충청북도 증평군_사회복지시설현황은증평군 관내에서 운영 중인 다양한 사회복지 관련 시설에 대한 정보를 종합한 자료입니다.이 데이터는 2025년 9월 12일 기준으로 구성되어 있으며,고령자, 장애인, 아동, 지역주민을 위한 다양한 복지서비스 제공 기관의 정보를 제공합니다.데이터는 크게 생활시설과 이용시설로 구분됩니다.생활시설(총 14개소):노인요양시설(증평노인전문요양원, 들꽃마을 등), 장애인거주시설(머릿돌은혜원), 정신재활시설 등입소 또는 장기 생활 기반의 복지 서비스를 제공이용시설(총 27개소):노인복지관, 주야간보호센터, 장애인복지관 및 주간보호센터, 지역아동센터, 가족센터, 다함께돌봄센터, 사회복지관, 자활센터 등주간 또는 방문 이용을 기반으로 한 비입소형 서비스 제공각 시설에는 시설명, 소재지, 전화번호, 시설유형, 시설장명 등의 항목이 포함되어 있으며,복지정책 수립, 시설 현황 분석, 서비스 접근성 개선, 주민 편의성 향상을 위한 기초자료로 활용됩니다.증평군에 위치한 사회복지시설 정보 원문링크주소: https://www.jp.go.kr/kor/sub05_01_07_01.do'
