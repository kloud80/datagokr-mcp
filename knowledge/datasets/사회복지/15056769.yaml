summary_user: 경기도 내 특수교육대상자가 일반학생과 함께 수업받는 일반학급(전일제 통합학급) 수를 기준연도별·학교유형별(국·공·사립)로 집계해 전체와 유치원·초·중·고 학급 수로 나눠 담는다. 교육정책 분석가가 '경기도에서 통합학급이 어느 학교급에 몰려 있고 국·공·사립 간 차이는 얼마인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 특수학급 현황 등 다른 집계와는 기준연도(STD_YY)와 학교유형명을 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 일반학급 배치(전일제 통합학급) 학급 수를 학교유형별(국·공·사립)과 학교과정별(유치원, 초등학교, 중학교, 고등학교)로 집계한 현황입니다. 매년 6월 말 기준으로 산출되며, 전체 학급 수와 함께 유치원·초등학교·중학교·고등학교 학급 수가 별도로 제공됩니다.‘통합학급’은 일반학생과 특수교육대상자가 함께 수업을 받는 학급을 의미합니다. 이 데이터는 특수교육대상자가 어느 정도 일반학급에서 교육받고 있는지, 그리고 학교급별로 통합학급 운영 현황이 어떻게 다른지를 보여줍니다.예를 들어 초등학교 단계에서 통합학급 운영이 상대적으로 활발할 수 있으며, 유치원이나 고등학교에서는 상대적으로 적을 수 있습니다. 이를 통해 특수교육 정책 수립, 학급 배치 기준 검토, 지역별·학교급별 통합교육 지원 전략 마련에 활용할 수 있습니다. 또한 특수학급 운영 현황과 비교 분석할 경우, 일반학급 배치 확대 정도 및 통합교육 인프라의 지역적 균형을 확인할 수 있습니다.
