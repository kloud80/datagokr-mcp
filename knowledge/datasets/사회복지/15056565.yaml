summary_user: 경기도 내 청소년수련관·수련원·유스호스텔·문화의집·야영장 등 청소년 수련시설을 시설 한 곳당 한 행으로 담은 목록으로, 시군명·시설유형·공공/민간 구분·운영단체·수용정원·연면적·건물 규모·연락처와 주소·좌표를 시설별로 제공한다. 학부모나 청소년 지도자가 우리 시군에 단체 수련활동을 받을 수 있는 정원 규모의 공공 수련시설이 어디 있는지 찾거나, 분석가가 시군별 청소년 활동시설 분포와 격차를 보는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 시설명 매칭, 위도·경도 좌표로 지역 통계나 다른 시설 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 청소년의 체험·학습·자기계발 활동을 지원하기 위한 청소년 수련시설에 대한 현황 정보를 담고 있습니다. 청소년수련관, 수련원, 유스호스텔, 문화의집, 야영장 등 다양한 형태의 수련시설이 포함되며, 각 시설의 명칭, 소재지(도로명·지번주소 및 우편번호), 연락처, 시설유형, 운영단체, 공공·민간 여부, 수용정원, 연면적, 건물 규모, 위도·경도 등의 항목을 제공합니다. 본 데이터는 청소년 활동 기반시설의 공간적 분포 및 물리적 특성을 파악하는 데 활용되며, 교육정책 수립, 복지시설 배치, 공간정보 연계 등 다양한 분야에서 응용 가능합니다. 연 1회 갱신되며, 상업적 활용과 콘텐츠 수정이 가능합니다.
