summary_user: 원주시에 있는 다함께돌봄센터와 지역아동센터를 시설 한 곳당 한 행으로 담은 파일로, 구분·시설명·소재지·아동정원·직원수·인가일·전화번호를 기록한다(약 4KB 규모의 CSV). 원주에 사는 학부모가 집 근처 방과 후 돌봄시설의 위치와 정원, 연락처를 확인하거나, 분석가가 시 안에서 돌봄 공급이 어떻게 분포하는지 살펴볼 때 쓴다. 다른 데이터와 맞춰 볼 공통 조인 키는 없으므로, 사회복지시설 공통 마스터 같은 다른 자료와는 시설명이나 소재지 주소로 맞춰 연결해야 한다.
description_portal: 이 데이터는 강원도 원주시 내에 등록된 다함께돌봄센터 및 지역아동센터의 현황 정보를 투명하게 공개하여, 아동 복지 및 방과 후 돌봄 서비스 이용 편의를 증진시키기 위해 구축되었습니다. 해당 기관에서 각 시설의 시설명, 소재지, 정원, 운영 주체 등의 등록 정보를 공적 자료를 통해 수집하고 정제했습니다. 이 정보는 돌봄 서비스의 지역별 분포 및 공급 능력을 파악하는 데 필수적이며, 아동과 학부모가 필요한 돌봄 시설을 쉽게 찾도록 돕습니다. 모든 정보는 정기적인 현행화 작업을 통해 최신 상태를 유지하고 있으며, 지역 사회의 아동 복지 증진에 기여합니다.
