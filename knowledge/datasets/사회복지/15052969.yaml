summary_user: 공무원연금 수급자 수를 연령(38세 미만부터 1세 단위) × 급여종류(퇴직연금·퇴직유족연금·장해연금) × 성별로 집계한 전국 단위 통계 파일(약 3KB CSV)이다. 분석가나 연금 정책 담당자가 '퇴직연금 수급자가 어느 연령대에 몰려 있고 남녀 구성은 어떤가', '유족연금 수급자의 연령 분포는 어떤가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 연령 구간(구분)을 기준으로 다른 연령별 인구·연금 통계와 이름을 맞춰 붙여 쓴다.
description_portal: '공무원 연령별, 급여종류별(퇴직연금, 퇴직유족연금, 장해연금) 연금수급자 현황 데이터(성별 구분)로 38세 미만부터 1세 단위로 구분됩니다.퇴직연금 : 공무원이 10년이상 재직하고 퇴직시 퇴직한 때부터 사망할 때까지 지급하는 연금퇴직유족연금 : 10년이상 재직한 공무원이 재직 중 사망한 경우 또는 퇴직연금수급권자가 퇴직연금을 수급하던 중에 사망한 경우 그 유족에게 지급하는 연금급여장해연금 : 공무상 부상 또는 질병으로 인하여 장해 상태로 퇴직하거나 퇴직 후에 퇴직전의 공무상 부상 또는 질병으로 인하여 장해상태로 된 공무원에게 지급하는 연금형태의 급여'
