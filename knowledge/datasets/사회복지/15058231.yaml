summary_user: 경기도 내 장애인 생활이동지원센터를 센터 한 곳당 한 행으로 담은 현황 목록으로, 시군명·설치기관명·법인명·전화번호·홈페이지·설치신고일과 지번·도로명 주소, 우편번호, WGS84 위경도를 포함한다. 장애인 가족이나 복지 담당자가 "우리 시군에서 가장 가까운 이동지원센터는 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 시군별 센터 분포와 공백 지역을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 법인명 같은 이름 매핑으로만 다른 데이터와 잇고, 위경도로 지도·공간 데이터에 겹쳐 쓴다.
description_portal: 이 데이터는 보건복지부에서 제공한 경기도 내 장애인 생활이동지원센터의 시군별 현황을 정리한 자료입니다. 각 센터의 위치정보(소재지 지번 및 도로명 주소, 우편번호), 지리좌표(WGS84 위도 및 경도), 설치기관명, 법인명, 전화번호, 설치신고일, 홈페이지 URL 등이 포함되어 있으며, 센터별 운영 실태와 지역별 서비스 분포를 파악하는 데 유용합니다. 본 데이터는 장애인의 이동권 보장, 접근성 개선, 복지서비스 수요 분석 등에 활용될 수 있으며, 관련 정책 수립, 공간정보 기반 서비스 개선, 복지 자원 배치 계획 수립 등에 기여할 수 있습니다.
