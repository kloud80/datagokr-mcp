summary_user: 대구광역시 북구에 있는 공동육아나눔터를 시설 한 곳당 한 행으로 담은 작은 목록 파일(csv, 약 1.4KB)로, 주소·누리집·연락처·수용 인원·이용 대상 연령·자격 요건·운영 시간·이용 요금·신청 절차·지원 내용을 담는다. 북구에 사는 부모가 아이와 함께 갈 수 있는 돌봄 품앗이 공간이 어디에 있고, 몇 살까지 이용할 수 있으며, 언제 열고 요금이 얼마인지 확인하는 데 쓴다. 전역 조인 키가 없어 어린이집·육아종합지원센터 등 다른 영유아 시설 데이터와는 주소나 시설명으로만 맞춰 이어 쓴다.
description_portal: '대구광역시 북구에 소재한 공동육아나눔터의 주소, 누리집, 대표연락처, 수용인원, 이용대상, 자격요건, 운영시간, 이용요금 등의 정보를 제공합니다.공동육아나눔터란?(목적) 육아 공간 및 돌봄 프로그램 제공, 이웃 간 자녀 돌봄 품앗이 활동 지원을 통해 양육 부담 경감 및 지역사회 중심의 돌봄친화적 분위기 조성(사업내용)1. 이용대상 : 부모 등 보호자 및 자녀2. 공간제공 : 이웃과 함께 자녀를 돌보는 공간 제공3. 지원내용 : 돌봄 품앗이를 구성하여 이웃 간 양육정보 교류, 나눔기회 제공, 참여자 재능기부를 활용하여 자녀 성장발달 활동을 돕는 놀이, 문화-체험 활동 등 그룹 돌봄 활동 지원, 공간나눔, 자녀돌봄 나눔, 정보.자원 나눔 등'
