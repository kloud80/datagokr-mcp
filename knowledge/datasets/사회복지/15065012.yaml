description_portal: 사립학교교직원연금공단 연금부담률과 관련된 데이터로 연도, 개인 연금부담금(%), 법인 연금부담금(%), 국가 연금부담금(%) 등의 항목을 제공합니다. 2020. 01. 01. 이후부터 개인 연금부담률은 9%, 법인 연금부담률 5.294%, 국가 연금부담률 3.706%으로 적용되어 부담주체별 연금 부담액이 책정됩니다.이 데이터를 통해 사립학교교직원 연금 제도의 재정 구조를 투명하게 공개하고 연금 기금의 건전성을 공개적으로 보여주고자 합니다.또한 연금 제도 분석 및 향후 정책 수립을 위한 기초 자료로 활용될 수 있습니다.
