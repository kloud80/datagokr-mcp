summary_user: 사학연금의 연도별 연금부담률을 개인·법인·국가 부담주체별 비율(%)로 담은 전국 단위 집계 파일로, 361바이트짜리 작은 csv다. 사학연금 재정 구조를 분석하는 연구자나 교직원이 '연도별로 개인과 학교법인, 국가가 보수의 몇 %씩 부담해 왔는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나, 공무원·군인연금 부담률 같은 직역연금 통계와 나란히 놓고 비교하는 방식으로 이어 쓴다.
