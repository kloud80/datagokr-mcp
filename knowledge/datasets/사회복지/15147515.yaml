description_portal: 부산 교통약자 이동지원 차량 운영현황은 교통약자의 이동 편의를 위해 운영되는 특별교통수단의 운행 데이터를 기록한 자료입니다. 데이터는 접수시간, 예약시간, 배차시간, 승차시간, 하차시간,  취소시간, 목적지주소, 목적지행정동, 목적지X좌표, 목적지Y좌표, 휠체어여부으로 구성되어 있습니다. 이를 통해 교통약자의 실제 이동 패턴을 분석할 수 있으며, 배차 효율성 검토, 대기시간 단축, 수요 집중 지역 파악, 요금 정책 검토 등 행정적 활용이 가능합니다. 또한 좌표 정보를 기반으로 한 GIS(지리정보시스템) 분석을 통해 교통약자 이동 경로 시각화, 취약 지역 발굴, 최적 이동 경로 설계 등에 활용할 수 있습니다. 본 데이터는 교통약자의 이동권 보장과 교통복지 향상, 대중교통 형평성 강화를 위한 정책 수립에 중요한 근거자료가 됩니다.
