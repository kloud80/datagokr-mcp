summary_user: 여수시에 소재한 재가장기요양기관(재가노인복지시설 포함)을 기관 한 곳당 한 행으로 담은 건별 목록으로, 방문요양·방문목욕·주야간보호·복지용구 같은 급여종류와 기관명·소재지·전화번호를 담는다. 여수에 사는 가족이 부모님 집 근처에서 방문요양이나 주야간보호를 하는 기관을 찾고 연락처를 확인하거나, 분석가가 지역별 재가요양 서비스 공급 분포를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건강보험 장기요양기관 목록 등 다른 데이터와는 기관명이나 주소(소재지)를 맞춰 이어야 한다.
description_portal: 전남광주통합특별시 여수시에 소재하고 있는 노인재가장기요양기관(재가노인복지시설 포함)에 대한 기본 데이터를 제공합니다.재가장기요양이란 노인 등이 집에서 생활하면서 신체활동 또는 가사활동 지원 등의 장기요양급여를  받는 서비스를 말합니다. 노인의 건강증진 및 생활안정을 도모하고 가족의 부담을 덜어주어 삶의 질을 향상시키는 것을 목적으로 합니다.재가장기요양기관(재가노인복지시설)은 방문요양, 방문목욕, 주야간보호, 복지용구 등의 급여종류에 해당하는 서비스를 제공합니다.급여종류, 기관명, 소재지, 전화번호가 포함되어 있으며, 데이터 기준일은 2026년 7월 31일 입니다.일부 재가장기요양기관(재가노인복지시설 포함)의 기본 데이터(소재지, 전화번호, 기관명, 급여종류 등)가 폐기되거나 변경될 수도 있습니다.
