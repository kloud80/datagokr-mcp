description_portal: '중소벤처기업진흥공단이 중소벤처기업부 정책자금 운용계획 공고 기준에 따라 지원한 자활기업 현황으로 지역, 업력, 대출금액 정보 등을 포함합니다. 자활기업은 저소득층 등이 상호 협력하여, 빈곤 극복을 위한 자활사업(예 : 빈곤층 취업알선 등)을 운영하는 업체를 나타냅니다. 사회적경제기업 중 자활기업 유형의 증빙자료는 국민기초생활보장법에 근거하여 (소관부처 : 보건복지부) 자활기업 인정서입니다.* 컬럼별 상세설명○ 지역 → 경북, 제주, 경기, 광주, 세종, 서울, 전남 등○ 업력 → 3년미만, 7년미만, 15년미만, 20년미만, 20년이상 등○ 대출년도 → 2023, 2024○ 대출월 → 01, 02, 03, 05, 06, 10 등 ○ 업종 → 유통, 기타 등'
