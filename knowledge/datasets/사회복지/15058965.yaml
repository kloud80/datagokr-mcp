summary_user: 전국과 경기도의 등록장애인 수, 그리고 전국 대비 경기도 비율(%)을 기준년도별로 한 행씩 담은 시도 단위 집계 통계다. 경기도 복지 담당자나 분석가가 '경기도 등록장애인이 전국에서 차지하는 비중이 해마다 어떻게 변했나'를 확인해 서비스 수요 예측이나 예산 편성 근거로 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도(STD_YY)를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 매년 기준으로 전국과 경기도의 등록장애인 수를 비교한 통계로, 장애인 복지정책 및 지역 간 수요 분석에 활용할 수 있는 기초자료입니다. 항목은 ‘기준년도’, ‘전국등록장애인수(명)’, ‘경기도등록장애인수(명)’, ‘전국대비경기도장애인비율(%)’로 구성되어 있으며, 이를 통해 특정 연도의 경기도 등록장애인 수가 전국에서 차지하는 비율을 확인할 수 있습니다. 이 데이터는 경기도의 장애인 관련 서비스 수요 예측, 지역복지 예산 편성, 복지자원 배분 전략 수립 등에 활용될 수 있으며, 연도별 추이 분석을 통해 등록장애인 수 증가율이나 비율 변화에 따른 정책 개선 방향을 도출하는 데 기여할 수 있습니다. 또한 타 시도와의 상대적 비교나 중앙정부와 지방정부 간 협력 지표로도 사용될 수 있습니다.
