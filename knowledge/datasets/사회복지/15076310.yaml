summary_user: 경기도 사회복지기관의 한부모가정(특히 미혼모) 대상 상담을 건별로 기록한 이력 데이터로, 상담기관·상담유형·상담주제(의료·생계·주거 등)·상담일자를 담는다. 복지 분석가나 정책 담당자가 미혼모 상담 수요가 어떤 생활문제에 몰리는지, 연도별로 어떻게 달라졌는지 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 상담기관명(dscsn_inst_nm)을 사회복지시설 목록과 이름으로 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 한부모가정, 특히 미혼모 지원을 위한 상담서비스 이력을 기록한 상담이력 데이터로, 사회복지기관의 상담기록을 바탕으로 구성되어 있습니다. 주요 항목으로는 상담기관, 상담유형, 상담주제, 상담일자가 포함되며, 상담주제는 의료, 생계, 주거 등 다양한 생활 전반의 문제를 다루고 있습니다. 특히 상담유형은 일부 항목에서 누락되어 있으나, 미혼모를 대상으로 한 상담이라는 특성이 강조됩니다. 이 데이터는 한부모가정의 생활문제 유형 및 상담 수요 분석, 복지정책 수립, 맞춤형 지원 프로그램 기획 등에 활용할 수 있습니다. 상담일자는 연도별 추이를 분석하거나 특정 시점의 복지수요 증가 현상을 파악하는 데 유용합니다.※ 기업매칭 지원 사업으로 발굴된 공익데이터입니다.※ 데이터 제공 기관에서 해당 자료 작성프로그램 문제로 22년부터 업데이트가 중단된 데이터입니다.
