summary_user: 청소년 종합 실태조사의 조사 분류명·조사명·조사연도와 그에 포함된 통계항목 ID·항목명을 담은 메타데이터 목록으로, 실제 응답값이나 집계 수치가 아니라 항목 구조를 전국 단위로 담는다. 연구자나 정책 분석가가 "어느 연도 실태조사에 어떤 문항(통계항목)이 들어 있었나"를 확인해 조사표 설계나 연도 간 항목 비교에 쓴다. 전역 조인 키가 없어 다른 데이터와는 통계항목ID(statsId)나 항목명·조사명 매핑, 같은 기관 코드로만 이어 쓴다.
limits: 지역(시도·시군구) 구분이 없는 전국·비공간 데이터라 지역 통계와 연계할 수 없고, 조사 시점에 생성된 뒤 바뀌지 않는 이벤트성 데이터다. 항목 정보만 담으므로 실제 조사 결과 수치는 이 데이터로 얻을 수 없다.
