description_portal: 기준소득월액상한액과 관련된 데이터입니다. 소득월액이란 일정기간 재직하고 얻은 소득에서 비과세소득을 제외한 금액의 연지급합계액을 12개월로 평균한 금액이며, 시작년월, 종료년월과 교직원의 연금및부담금기준소득월액, 교원상한가, 직원상한가 등의 항목을 제공합니다.이 데이터를 통해 연금 제도 운영의 투명성을 제고하고 가입자들이 자신의 부담금 및 급여 산정 방식을 이해할 수 있도록 돕고 연금 제도 연구 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다. 해당 데이터는 공공기관의 책임있는 연금 제도 운영을 입증하고 이해관계자들이 공단의 재정 건정성을 명확히 파악할 수 있도록 지원합니다.
