summary_user: 사학연금의 기준소득월액 상한액을 적용 기간(시작년월·종료년월)별로 정리한 전국 단위 파일로, 기간마다 연금 및 부담금 산정 기준소득월액과 교원·직원 상한금액을 담는다(csv 609바이트의 작은 표). 사립학교 교직원이나 연구자가 "특정 시기에 내 부담금과 연금 산정에 적용된 소득 상한은 얼마였나"를 확인하거나 상한액의 변화 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연월 기간을 기준으로 맞추거나, 같은 공단의 다른 직역연금 통계와 이름을 대조해서만 이어 쓴다.
limits: 개인별 소득이나 부담금 내역은 없고 기간별 상한 기준값만 담으므로 개별 연금액은 이 표만으로 계산할 수 없다. 지역 구분이 없는 전국·비공간 자료라 지역별 분석에는 쓸 수 없다.
