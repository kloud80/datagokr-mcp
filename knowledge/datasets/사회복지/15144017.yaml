description_portal: 전라남도 나주시 장례식장에 대한 데이터입니다. 장례식장은 장례식을 치르는 장소이다. 보통 대학병원이나 종합병원 같은 대형 병원 내에 있는 경우가 많다. 나주시 내 장례식장은 11곳이 있습니다. 나주시에는 전문 장례식장 5곳과 병원내 장례식장 6곳이 있다.. 데이터에는 나주시 내에 위치해 있는 전문장례식장과 병원 내 장례식장의 목록이 있습니다. 데이터에는 공사설구분 정보, 장례식장 명칭, 장례식장 주소정보, 전화번호, 영업개시년월일, 연면적(제곱미터), 빈소수 데이터를 포함하고 있습니다.
