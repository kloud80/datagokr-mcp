summary_user: 경기도 내 모자가족복지시설과 일시보호시설을 시설 한 곳당 한 행으로 담고, 시군명·시설구분·사업장명·인허가일자·영업상태·폐업일자·입소정원·종사자 수·도로명/지번 주소와 위경도(WGS84)를 포함한다. 한부모·위기 가정 지원기관이나 복지 분석가가 '우리 시군에 운영 중인 모자가족 보호시설은 어디이고 정원은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 시설명·주소 매칭으로 다른 사회복지시설 목록이나 경기도 같은 기관 데이터와 잇는다.
description_portal: 이 데이터는 모자가족을 위한 복지시설 및 일시보호시설의 현황을 정리한 자료로, 각 시설의 명칭, 위치, 시설구분, 인허가일자, 운영상태 등을 포함하고 있습니다. 주요 항목에는 시군명, 시설구분명, 사업장명, 소재지 도로명주소 및 지번주소, 우편번호, 위도(WGS84), 경도(WGS84), 인허가일자, 영업상태명이 있으며, 이를 통해 해당 시설이 어디에 위치해 있는지, 어떤 유형의 보호시설인지, 현재 운영 중인지 등을 확인할 수 있습니다. 이 데이터는 지역사회 복지자원 파악, 복지정책 수립, 모자가족 대상 서비스 제공, 위기 가정 지원체계 마련 등의 목적으로 활용될 수 있스빈다.
