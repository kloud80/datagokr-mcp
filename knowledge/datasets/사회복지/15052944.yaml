summary_user: 공무원연금 신규가입자 수를 연도별 한 행, 17개 시·도별 열로 정리한 집계표로, 포털 설명상 2001년부터 2023년까지를 담은 작은 CSV 파일(약 2KB)이다. 연금·인사 분석가가 '세종시 출범 이후 지역별 공무원 신규 유입 규모가 어떻게 달라졌나' 같은 질문에 지역별 추이 비교로 쓴다. 전역 조인 키나 행정구역 코드가 없어 시·도 이름을 열 이름으로 매핑해 다른 지역 통계나 같은 공단의 지역별 수급자 표와 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 공무원의 신규가입자수를 지역별 연도별로 제공하는 데이터입니다. 2001년부터 2023년까지 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주 등 전국 17개 시·도별 신규가입자 수가 포함되어 있으며, 지역별 공무원 신규 채용 및 연금제도 유입 규모의 변화를 확인할 수 있습니다.신규가입자의 지역 분포는 향후 연금 수급자 분포 변화와도 직결되며, 연금재정 안정성 분석, 지역별 수급 예측, 공공서비스 인력 배치 정책 수립 등에 기초자료로 활용될 수 있습니다.
