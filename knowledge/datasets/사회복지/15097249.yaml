summary_user: 구미시 관내 경로당을 한 곳씩 담은 개별 시설 목록으로, 읍면동(emd)·경로당명·지번주소·도로명주소를 제공한다. 구미시 주민이 우리 동네에서 가장 가까운 경로당이 어디인지 찾거나, 분석가가 읍면동별 경로당 분포를 보고 노인복지 인프라가 부족한 지역을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 노인복지시설·장기요양기관 자료나 지역 통계와는 주소 또는 읍면동 이름을 매칭해 잇는다.
limits: 범위가 구미시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다. 시설코드 같은 공통 키가 없어서 다른 데이터와 붙일 때는 주소나 명칭을 정제해 매칭해야 한다.
