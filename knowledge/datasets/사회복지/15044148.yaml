summary_user: 성북구도시관리공단 육아종합지원센터가 운영하는 영유아 놀이 프로그램(유아 발레·놀이 체육·유아 영어 등)을 강좌 한 줄씩 담은 작은 목록 파일(csv 약 1.9KB)로, 요일·시간·대상 연령·정원·수강료·재료비·강의실이 들어 있다. 성북구 학부모가 "우리 아이 연령에 맞는 강좌가 무슨 요일 몇 시에 열리고 수강료는 얼마인가"를 확인하거나, 분석가가 지역 영유아 프로그램 공급 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 어린이집·육아지원 데이터와는 관리기관명이나 소재지 주소로만 맞춰 이어 쓴다.
description_portal: 본 데이터는 영유아의 건강한 신체 발달과 정서적 성장을 지원하고, 지역 사회 내 보편적 육아 복지 서비스를 실현하기 위해 성북구도시관리공단 육아종합지원센터에서 운영하는 전문 영유아 놀이 프로그램의 통합 정보를 제공합니다.데이터의 세부 구성 항목으로는 영유아의 예술적 감수성을 키우는 유아 발레, 기초 체력 및 사회성을 기르는 놀이 체육, 글로벌 역량 강화를 위한 유아 영어 등 생애주기별 맞춤형 강좌의 상세 현황을 수록하고 있습니다. 각 프로그램별로는 강좌 명칭과 운영 요일 및 시간대, 권장 수강 대상(연령), 정원 정보 및 합리적인 수강료 체계를 명시하여 학부모들이 자녀의 발달 단계에 적합한 교육 프로그램을 체계적으로 선택할 수 있도록 구성하였습니다.본 데이터는 지역 내 영유아 교육 인프라 수요 분석, 연령별 선호 강좌 통계 도출, 맞춤형 육아 지원 플랫폼 개발 및 저출생 대응 보육 정책 수립을 위한 핵심 기초 데이터로서 그 활용 가치가 매우 높습니다.프로그램별 학기 모집 안내 등 최신 정보는 성북구도시관리공단 공식 홈페이지(https://www.gongdan.go.kr/childCare/cnts/selectContents.do?cntnts_id=I200000044) 메뉴를 통해 상시 확인이 가능합니다.
