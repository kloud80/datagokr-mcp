summary_user: 경기도 김포시 안의 아동복지시설을 시설 한 곳당 한 행으로 담은 CSV 파일로, 시설구분·시설명·도로명/지번 주소·입소정원·운영주체·국고보조여부·전화번호를 담는다(파일 크기 약 3KB의 소규모 목록). 김포시 주민이나 복지 분석가가 '김포시 어느 권역에 아동양육시설 같은 입소형 시설이 있고 정원은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 시군의 아동복지시설 파일이나 사회복지시설 목록과는 시설명·주소를 맞춰 잇거나 주소를 좌표로 바꿔 지도에 겹쳐 쓴다.
description_portal: 경기도 김포시의 아동복지시설에 대한 정보를 제공합니다. 제공 항목으로는 시설구분, 시설명, 소재지주소, 입소정원, 운영주체, 국고보조여부, 전화번호, 데이터기준일자로 구성되어있으며 주소는 지번과 도로명의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 데이터를 통해 권역별 아동복지시설 분포 등을 확인할 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 아동보육과로 연락주시기 바랍니다.
