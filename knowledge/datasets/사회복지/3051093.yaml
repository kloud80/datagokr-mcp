summary_user: 장애물 없는 생활환경(BF) 인증을 받은 시설·지역을 건별로 담은 파일 데이터로, 전국 시군구 단위 19,395건(교부일 2008-10-30~2025-07-31)이 들어 있다. 휠체어 이용자나 노인 가족이 우리 동네 어떤 시설이 인증을 받았는지, 분석가가 지역별 인증 현황과 인증기관별 분포를 볼 때 쓴다. 전역 조인 키는 없고 지역코드·시군구·시설명으로 다른 편의시설 데이터와 이름·코드 매핑해 잇거나, 같은 기관 코드로만 연결한다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 건물관리번호 같은 키로 다른 건물 원장과 바로 결합할 수 없다. 명세상 갱신은 연간이고 실측 최신 교부일은 2025-07-31(관측일 기준 428일 전)이므로 최근 인증 여부는 확인이 필요하다.
