description_portal: 성남시 내의 노인주거복지시설에 대한 데이터로, 시설유형(주거복지주택/양로시설/노인공동생활가정), 시설명, 설치일, 소재지, 이용인원, 규모, 전화번호 등의 항목으로 구성되어 있습니다. 성남시는 고령화 사회에 대응하여 다양한 유형의 노인 주거복지시설을 운영하고 있으며, 이는 어르신들의 안정된 주거생활과 복지 향유를 동시에 지원하기 위한 복합적 기반시설로 기능한다. 현재 성남시에는 노인요양시설(요양원), 양로시설, 공동생활가정, 노인복지주택, 고령자복지주택(실버주택) 등 여러 유형의 주거복지시설이 분포되어 있다. 이들 시설은 분당구, 수정구, 중원구 전역에 걸쳐 고루 위치하고 있으며, 입소 대상자 요건, 제공 서비스 수준, 입주비용에 따라 공공 및 민간이 병행 운영하는 체계를 갖추고 있다.
