summary_user: 경기도사회적경제센터가 취합한 공공구매 영업지원을 희망하는 사회적경제기업 목록으로, 기업 한 곳당 한 행에 기업유형·사업분야·기업명·대표자·연락처·주소·주요품목·인허가 및 특허·직접생산 여부 등을 담는다. 도내 공공기관이나 시군 구매 담당자가 '특정 품목을 납품할 수 있는 도내 사회적경제기업이 어디인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 사회적기업 인증·사업자 데이터와는 기업명 매칭으로만 잇고, 정제 주소와 위경도 필드는 지도 표시나 행정구역 매칭에 쓴다.
description_portal: 이 데이터는 경기도 사회적경제센터가 취합한 공공구매 영업지원 희망 사회적경제기업의 목록으로, 도내 공공기관 및 시군에서 공공구매 정책을 실현하기 위한 기초자료로 활용됩니다.본 데이터는 일자리재단 경기도사회적경제센터에서 취합한 목록으로 기업유형, 사업분야, 주요품목 등이 포함되어 있습니다. 도내 공공기관 및 시군의 사회적경제 공공구매를 지원하기 위한 기업의 기초정보 제공을 주목적으로 하는 데이터입니다.이 데이터는 사회적경제기업에 대한 구매 확대 정책 수립, 도내 취약계층 일자리 창출 촉진, 사회적 가치 기반 기업 발굴 및 육성 전략 수립에 효과적으로 활용될 수 있습니다.
