description_portal: 한국건강가정진흥원에서 발송하는 웹진의 수신그룹 등록 인원수를 월별로 집계한 자료입니다. 2025년 까지의 데이터를 포함하고 있으며, 각 항목은 연번, 사업명, 발송수단, 발송월, 그룹명, 등록인원수로 구성되어 있습니다. 이 데이터를 통해 웹진의 발송 현황과 수신그룹의 등록 추이를 파악할 수 있으며, 다문화가족지원센터 등의 가족서비스 홍보 및 커뮤니케이션 전략 수립에 활용될 수 있습니다. 데이터는 연간 단위로 업데이트되며, 최신 정보는 2025년 7월 31일 기준이며 총 24개의 행으로 구성되어 있습니다. 이 자료는 기관 웹진의 효과적인 운영과 수신그룹 관리에 도움이 될 수 있습니다.
