description_portal: 2025년 자활사업 참여자들을 대상으로 진행된 실태조사 데이터와 상세 코드북을 제공합니다. 본 데이터는 정책 입안자, 연구자 및 관련 기관들이 보다 정교하고 실질적인 자활지원 방안을 수립하는데 기여할 것입니다. 조사표와 세부 조사내용에 대한 연구 결과는 한국자활복지개발원 대표 홈페이지 내 '기관자료' > '정책자료' > '연구보고서' 섹션에서 확인하실 수 있습니다. 관련 연구보고서를 참고하시어 이번 실태조사의 배경, 방법론, 그리고 주요 발견점들을 충분히 숙지하시고 데이터를 올바르고 효과적으로 활용하시길 바랍니다.
