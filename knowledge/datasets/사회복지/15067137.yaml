description_portal: '이 데이터는 한국노인인력개발원이 운영하는 노인일자리 취업연계 시스템에서 제공하는 연계데이터 관리 현황을 담고 있습니다. 주요 항목은 대분류, 중분류, 소분류별 자료 제공처, 연계방식, 연계주기, 현재 연계 건수 등으로 구성됩니다. 예를 들어 사용자 정보, 수행기관 자료, 교육기관 안내, 건강정보, 법적 제도 안내 등 다양한 범주의 데이터가 포함되며, 각 항목은 연계되는 시스템(예: 오라클JOB, 워크넷, 법제처 등)을 통해 관리됩니다. 이를 통해 기관 간 데이터 연계 구조와 활용 현황을 파악할 수 있으며, 노인일자리 관련 서비스의 통합성과 연계성을 분석하는 기초자료로 활용될 수 있습니다.'
