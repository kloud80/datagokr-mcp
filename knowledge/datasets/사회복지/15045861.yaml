summary_user: 사학연금공단이 해외 인프라·부동산·사모투자 등 대체투자 자산군별로 선정한 위탁운용사 목록을 전년도말 기준일 단위로 담은 작은 파일(csv 약 1.3KB)이며, 기준일·자산군 구분·거래기관 세 항목으로 이뤄진다. 연기금 투자 동향을 보는 분석가나 운용업계 종사자가 '사학연금은 해외 부동산·인프라를 어느 운용사에 맡기고 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 운용사 이름을 기준으로 다른 연기금의 위탁운용사 내역이나 금융회사 데이터와 맞춰 이어 쓴다.
description_portal: 공단은 채권, 주식 등의 전통자산 외에도 기금의 수익률 제고, 포트폴리오 다각화, 분산투자를 통한 리스크 저감 등을 위해 부동산, 인프라, 사모주식 등의 대체투자 자산에 일정 비율로 투자하고 있습니다.선정결과에 따른 인프라, 부동산, 사모투자 등 해외 대체투자 자산군별 위탁운용사 정보를 전년도말 기준으로 제공하고 있습니다.이 데이터를 통해 공단의 투자 활동 투명성을 제고하고, 기금 운용의 건전성을 대외적으로 공개하고자 합니다. 또한, 해외 대체 투자 시장 분석 및 잠재적 위탁운용사 선정을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 자산 관리와 효율적인 기금 운용을 입증하며, 관련 이해관계자들이 공단의 재무 건전성을 명확히 파악할 수 있도록 지원합니다.
