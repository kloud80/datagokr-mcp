summary_user: 전라남도 내 노숙인 생활시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 운영 주체 구분(법인·개인), 시설명, 시설장, 소재지, 생활인 수, 전화번호, 데이터기준일자를 담는다. 노숙인 지원 담당자나 복지 분석가가 "전남 어느 지역에 노숙인 생활시설이 있고 각 시설에 몇 명이 생활하는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 사회복지시설 데이터와는 시설명이나 소재지 주소를 맞춰 연결해야 한다.
description_portal: '- 전라남도 내 7개 노숙인 생활시설 현황에 대한 데이터를 제공합니다.- 사회복지법인 및 개인 여부, 시설장, 소재지, 생활인 수, 전화번호 등의 항목을 제공합니다.- 전라남도에는 노숙인 및 취약계층을 위한 다양한 생활시설과 지원 기관들이 운영되고 있습니다. 이러한 시설들은 주거, 식사, 의료, 상담 등 종합적인 서비스를 제공하여 자립을 돕고 있습니다.- 전라남도의 노숙인 생활시설은 지역 사회와 협력하여 지속 가능한 자립을 돕는 다양한 프로그램을 운영하고 있습니다. 필요하신 경우, 해당 시설이나 지원 기관에 문의하여 자세한 정보를 얻으시기 바랍니다.- 이용 방법 : 이용을 원하는 경우, 해당 시설에 직접 문의하거나 지역 사회복지협의회 및 전라남도청 복지정책과를 통해 안내를 받으실 수 있습니다.'
