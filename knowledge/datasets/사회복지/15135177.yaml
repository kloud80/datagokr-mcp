summary_user: 경기도 워라밸링크 플랫폼의 자가진단 문항을 한 건씩 담은 항목 목록으로, 문항마다 식별번호·작성일·수정일·분류 코드(qstn_type)·배점이 붙어 있다. 워라밸 자가진단 도구를 만들거나 분류별 배점 구조를 살피려는 개발자·분석가가 '어떤 분류의 문항에 몇 점 가중치가 매겨지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 분류 코드나 이름 매핑, 같은 기관 코드로만 연결된다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼에서 제공하는 자가진단 항목 정보를 포함하고 있습니다. 각 항목은 작성일, 수정일, 분류, 배점 등의 항목으로 구성되어 있으며, 분류는 2, 4, 5, 6, 7, 8 등 숫자 코드로 구분됩니다. 배점은 대부분 0점으로 되어 있으나, 일부 항목에는 0.61, 0.66, 0.69 등 소수점 단위의 점수가 부여되어 있습니다. 이 배점은 진단 결과 산정에 활용되는 점수 또는 가중치로 사용됩니다. 본 데이터는 워라밸 관련 자가진단 시스템 개발, 사용자 평가 분석, 분류별 워라밸 상태 파악 등 다양한 분야에 활용될 수 있습니다.
