description_portal: '한국사회보장정보원에서 제공하는 한부모가족지원(청소년한부모가족지원 포함) 관련법에 의한 급여 또는 서비스를 받는 수급가구와 수급자를 월별, 지역별, 재가시설별, 지원법률구분별로 집계한 통계데이터입니다.데이터 구성은 통계연월, 통계시도명, 통계시군구명, 재가시설구분, 지원법률구분, 수급자수, 수급가구스로 구성되어 있습니다.이 데이터를 활용하여 한부모가족 수급가구수 및 수급자수에 대해 재가시설구분과 지원법률구분을 기준으로 지역별 현황 파악 및 비교 측면의 분석이 가능합니다.아울러 이러한 공공데이터를 통해 다음과 같은 데이터분석, 연구 등의 활용이 가능합니다.*단순 예시 사례이니,  참고바랍니다.○인구통계학적 특성 분석: 성별, 연령, 거주 지역, 가구 구성원 수 등 기본적인 인구통계학적 특성을 분석하여 이들의 분포를 파악할 수 있습니다. 예를 들어, 특정 지역에 한부모 가족이 집중되어 있는지, 혹은 청소년 한부모 가구의 비율이 높은지 등을 확인할 수 있습니다.○경제적 특성 분석: 소득, 자산, 부채, 소비 지출 패턴 등을 분석하여 경제적 어려움의 정도와 원인을 심층적으로 파악할 수 있습니다. 특히, 가구 소득 대비 주거비나 교육비 지출 비중이 얼마나 높은지 등을 분석해볼 수 있습니다.○고용 및 노동 시장 특성 분석: 취업 여부, 종사하는 산업군, 고용 형태(정규직/비정규직), 근무 시간 등을 분석하여 이들이 겪는 고용 불안정성을 진단할 수 있습니다. 예를 들어, 여성 한부모의 경우 육아와 일을 병행하는 데 어려움을 겪어 비정규직이나 단시간 근로에 종사하는 경우가 많은지 등을 분석할 수 있습니다.'
