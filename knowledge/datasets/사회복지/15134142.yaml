description_portal: '이 데이터는 대구광역시 동구를 대상으로 행정동별 노인인구 현황과 무연고 사망자수를 집계한 공공데이터입니다. 노인인구는 65세 이상 인구를 기준으로 하며, 행정동 단위로 분류되어 각 지역의 고령화 정도를 비교·분석할 수 있습니다. 또한 무연고 사망자수는 법적·사회적 보호자가 없어 장례 절차를 위탁해야 하는 사망자의 수를 집계한 자료로, 지역 사회복지 및 복지정책 수립에 중요한 기초 지표로 활용됩니다. 본 데이터는 특정 연도(예: 2022년, 2023, 2024년, 2025년)를 기준으로 제공되며, 행정동별 노인인구 규모와 무연고 사망자수 간의 상관성을 파악하거나 취약 지역을 식별하는 데 활용될 수 있습니다. 이를 통해 지자체는 고령자 복지 서비스 수요 예측, 돌봄 정책 강화, 무연고 사망 예방을 위한 사회적 안전망 구축에 참고자료로 활용할 수 있습니다.'
