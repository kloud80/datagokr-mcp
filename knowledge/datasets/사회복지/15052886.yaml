description_portal: '군인연금 기금운용 현황에 대한 데이터입니다. 세부 사항은 연도별로 수입(기여금, 국가부담금, 국가보전금, 기타경상이전수입)과 지출(연금, 퇴직일시금, 재해보상급여, 퇴직수당, 기타지출, 기금관리비) 금액(단위: 억 원)으로 상세하게 나타내고 있어, 목적에 따라 필요한 정보를 쉽게 얻을 수 있습니다. 해당 데이터 분석을 통해 군인연금의 기금 운용 및 관리 사업이 목적에 따라 합리적이고 효과적으로 수행되고 있는지 확인할 수 있으며, 기금을 성실하게 관리, 운용할 수 있도록 정책 및 제도 마련, 개선하는 데에 기초 자료로써 활용 가능합니다.'
