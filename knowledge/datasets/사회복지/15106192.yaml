summary_user: 서울 관악구 안에서 운영 중인 노인복지시설(노인교실, 무료급식소, 시니어클럽, 노인종합복지관, 요양공동생활가정 등)을 시설 한 곳당 한 행으로 담은 목록 파일이다. 시설유형·시설명·도로명주소·전화번호·홈페이지를 담는다. 관악구 주민이나 가족이 집 근처에서 이용할 노인복지관이나 무료급식소가 어디 있고 연락처가 무엇인지 찾을 때 쓴다. 분석가가 동네별 노인시설 분포와 접근성을 살필 때도 쓴다. 전역 조인 키나 시설코드가 없어 다른 데이터와는 시설명이나 도로명주소를 맞춰 잇는다. 장기요양기관 목록이나 관악구 지역통계(regional-statistics)와 이렇게 연결한다.
description_portal: 본 데이터는 서울특별시 관악구 내에서 운영 중인 다양한 노인복지시설의 기본 현황을 정리한 자료입니다. 본 데이터는 ▲시설유형 ▲시설명 ▲도로명주소 ▲전화번호 ▲홈페이지 항목으로 구성되어 있으며, 관내 노인교실, 무료급식소, 시니어클럽, 노인종합복지관, 요양공동생활가정 등 여러 종류의 시설이 어디에 위치해 있는지와 연락 가능한 기본 정보를 확인할 수 있습니다. 이를 통해 지역별 복지시설 분포를 파악하고, 시설 접근성이나 행정적 관리 현황을 살펴보는 데 참고자료로 활용할 수 있는 기초 데이터입니다.
