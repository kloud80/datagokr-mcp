summary_user: 사립학교교직원연금공단이 소유한 회관·사옥을 건물 한 곳당 한 행으로 담은 현황 파일로, 소재지·대지면적·연면적·규모·사용승인일·건폐율·용적률·문의전화를 전국 범위에서 개별 주소 단위로 담는다(파일 크기 623바이트의 소규모 목록). 공단의 부동산 자산 규모를 확인하려는 분석가나, 가까운 사학연금 회관의 위치·연락처와 대관 가능 여부를 찾는 교직원이 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 건물 이름으로 맞춰 이어야 하며, 건축물대장 등과 연결할 때도 주소 매칭에 의존한다.
description_portal: 사립학교교직원연금공단이 소유한 보유회관의 현황과 관련된 데이터로 구분, 소재지, 대지면적(㎡), 연면적(㎡), 규모, 사용승인일, 건폐율(%), 용적률(%), 대표번호, 대관시설 정보의 항목을 제공합니다. 이 데이터를 통해 공단의 부동산 자산 형황을 투명하게 공개하고 기관의 자산 관리 실태를 명확하게 파악할 수 있도록 돕습니다.또한 유휴 공간 활용 방안 모색 및 시설 개선 계획 수립을 위한 기초 자료로 활용될 수 있습니다.사용승인일은 건축물대장 상 사용승인일 기준으로 데이터가 포함되어 있으며, 나주사옥 부속건물(보육시설)은 사용승인 필증 발급날 기준으로 데이터가 작성됨.
