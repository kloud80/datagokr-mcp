description_portal: '인천광역시가 제공하는 노인의료복지시설 현황 공공데이터는 관내 군/구별로 설치·운영 중인 **노인 의료복지 시설(주로 요양시설)**의 시설 수, 정원, 현원(입소자 수) 등을 상세히 집계한 통계 자료입니다. 이 데이터는 지역 노인 장기요양 서비스 인프라의 현황을 파악하고, 지역별 노인 복지 수요에 맞는 시설 확충 계획 및 복지 정책 수립에 필수적인 기초 자료로 활용되는 것을 목적으로 합니다.-행정구역: 데이터가 집계된 인천광역시 내 군/구별로 분류됩니다.-시설 종류: 노인요양시설, 노인요양공동생활가정 등 시설 유형별로 구분됩니다.-시설 수 (개소): 각 군/구별, 시설 종류별로 운영 중인 시설의 총 개수를 나타냅니다'
