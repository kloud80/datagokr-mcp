description_portal: 이 데이터는 경상남도 거제시 각 지역별 노인여가복지시설 현황을 보여줍니다. 노인들이 이용하는 주요 시설은 경로당으로, 대부분 지역에서 경로당이 다수 운영되고 있음을 확인할 수 있습니다. 경로당 수는 지역별로 2개에서 30개까지 다양하게 분포되어 있어 어르신들의 여가 활동과 교류 공간으로 활발히 활용되고 있습니다. 또한, 일부 지역에서는 노인교실도 운영되어 노인 대상 교육과 프로그램 제공이 이루어지고 있으나, 전체적으로는 소수에 불과한 실정입니다. 이러한 통계는 거제시가 노인 복지 서비스의 다양화 및 시설 확충을 위한 기초자료로 활용될 수 있습니다.
