description_portal: 자활기업은 2인 이상의 수급자 또는 저소득층이 상호 협력하여 조합 또는 공동사업자의 형태로 탈빈곤을 위한 자활사업을 운영하는 중요한 사회적 경제 주체입니다. 2012년 8월 2일 국민기초생활보장법 개정에 따라 "자활공동체"에서 "자활기업"으로 명칭이 변경되어 현재에 이르고 있습니다.이번에 업종별 자활기업 현황에 대한 상세 데이터를 제공합니다. 이 자료는 청소(세차 포함), 집수리, 돌봄(간병), 음식/도시락, 폐자원 재활용 등 주요 서비스 업종을 비롯하여 공산품 생산, 농산물 생산·가공, 유통·판매, 음식점, 환경정비 등 다양한 산업 분야에 걸친 자활기업의 분포를 포괄적으로 보여줍니다.
