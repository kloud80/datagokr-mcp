summary_user: 기초연금 산정의 기준이 되는 기준연금액과 그 50%인 부가연금액을 연도별로 담은 전국 단위 집계표이며, 파일은 176바이트 분량의 작은 csv입니다. 노인·가족이나 복지 분석가가 '올해(또는 특정 연도) 기초연금으로 받을 수 있는 최대 금액이 얼마인가'를 확인하거나, 연도별 기초연금액 변화를 추적하는 데 씁니다. 전역 조인 키는 없고 연도 컬럼(년도)만 있으므로, 다른 국민연금·기초연금 통계와는 연도를 맞춰 붙여 쓰는 정도로만 연결합니다.
description_portal: '- (기준연금액) 기준연금액은 보건복지부장관이 그 전년도의 기준연금액에 통계청의 전국소비자물가변동률을 반영하여 매년 고시- (기준연금액을 기초연금액으로 지급하는 대상) 공적연금 수급권이 없는 사람, 국민연금법에 따른 장애연금, 유족연금 수급권자, 국민연금과 직역연금의 연계에 관한 법률에 따른 연계노령유족(퇴직유족)연금 수급권자, 장애인연금법 제4조에 따른 수급권자, 국민기초생활보장법 제2조제2호에 따른 수급권자, 국민연금 급여액등이 기준연금액의 150% 이하인 자- (부가연금액) 기준연금액의 50%'
