summary_user: 대구광역시 서구 관내 노인복지시설(주거복지·노인의료복지·재가노인복지시설)을 시설 한 곳당 한 행으로 담은 파일로, 시설명·구분·도로명주소·전화번호·운영주체·개소일자·기준일자를 포함한다. 서구 주민이나 보호자가 '우리 동네 가까운 요양시설이나 재가복지시설은 어디이고 누가 운영하는가'를 찾거나, 분석가가 서구 내 노인복지 자원 분포를 파악하는 데 쓴다. 전역 조인 키나 시설코드가 없어 다른 데이터와는 시설명·도로명주소를 맞춰 잇는다. 이렇게 해서 건강보험 장기요양기관 목록이나 서구 단위 지역 통계와 함께 본다.
limits: 표준 시설코드 같은 공통 키가 없어 장기요양기관 등 다른 목록과 연결하려면 시설명·주소를 직접 대조해야 한다. 범위가 대구 서구 한 곳뿐이라 다른 시군구와 비교하려면 각 지자체 자료를 따로 모아야 한다.
