summary_user: 공무원연금 가입자 수를 연도별로 전국 합계(계)와 17개 시도 열로 나눠 담은 집계표이며, 포털 설명상 1982년부터 기준년도까지의 시계열을 담는다. 분석가나 지역 정책 담당자가 "우리 시도의 공무원연금 가입자(공무원 규모)는 수십 년간 어떻게 늘거나 줄었나" 같은 질문에 쓴다. 공통 조인 키나 행정코드는 없어서, 시도 이름을 행정구역 코드에 직접 맞춰 붙이거나 같은 기관의 지역별 수급자 통계와 시도명으로 맞대어 쓴다.
description_portal: 공무원연금공단에서 관리하는 공무원연금 가입자 수의 연도별 변화를 지역별로 구분하여 집계한 데이터로, 전국 17개 광역자치단체를 기준으로 가입자 수의 장기적 추이를 제공합니다.제공 지역에는 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주가 포함되며, 각 연도별 총 가입자 수와 지역별 세부 가입자 수가 포함되어 있습니다.이 데이터는 1982년부터 기준년도까지 시계열로 구성되어 있어, 특정 지역에서의 공무원 규모 변화, 인사 정책의 효과, 지역별 인력 밀집도 변화 등을 파악하는데 활용될 수 있습니다.
