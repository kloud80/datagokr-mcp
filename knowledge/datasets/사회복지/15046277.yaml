description_portal: '○ 통계개요* 통계명 : 결혼생활에 대한 태도-결혼하지 않고도 자녀를 가질 수 있다* 통계종류 : 통계청 사회조사의 서울시민 결혼생활에 대한 태도를 제공하는지정ㆍ조사통계* 작성목적 : 사회적 관심사항, 삶의 질에 관한 사항 등 사회구성원의 주관적 관심사를파악하여 사회개발정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사대상 → 지방통계청 → 통계청* 공표주기 : 정기(2년)* 공표범위 : 지역 - 서울시내용 - 서울시민의 결혼생활에 대한 태도의 견해를 백분율로 제공○ 용어설명○ 기 타* 조사대상 : 13세이상 인구(2010년이전 15세 이상 인구)* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 결혼문화에 대한 태도 항목 중 "결혼하지 않고도 자녀를 가질 수 있다"라는 생각에 대해어느 정도 동의하십니까?○ 출 처 : 통계청 「사회조사」'
