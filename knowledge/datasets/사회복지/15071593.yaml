summary_user: 2012~2024년 말 기준 국민연금기금의 전체 자산과 부문별(공공·복지·금융·기타) 운용 규모, 금융부문 내 국내주식·해외주식·국내채권·해외채권·대체투자·단기자금 규모를 시가 기준 십억 원 단위로 담은 연도별 집계표이며, 행은 자산 구분(구분)이고 열은 연도인 작은 CSV 파일이다. 연구자나 기자가 '국민연금기금에서 해외주식 비중이 최근 10여 년간 얼마나 늘었나'처럼 자산배분 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 자산 구분 이름을 맞춰 연결하며, 종목·금융회사 단위의 주식·금융 데이터와 잇는 것은 이 표가 아니라 같은 부문의 국내주식 보유·위탁운용사·거래증권사 데이터의 몫이다.
description_portal: '2012~2024년 말 기준에 해당하는 국민연금기금의 전체 자산 및 부문별(공공/복지/금융/기타) 운용 현황과 금융부문 내 국내주식/해외주식/국내채권/해외채권/대체투자/단기자금으로 분류한 시장가 기준의 운용현황을 제공합니다.각 수치는 반올림으로 세부내역 및 합계의 단수차이가 발생할 수 있습니다.금융부문 금액은 전술적 외환 익스포저 등을 포함한 수치입니다. (시가기준, 단위: 십억 원)국민연금기금의 운용현황은 국민연금공단 기금운용본부 홈페이지를 통해서도 확인하실 수 있습니다.'
