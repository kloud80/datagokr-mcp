description_portal: 정부경영평가 "사회적책임" 지표 중 공공기관 우선구매 실적 관련, 연간 중증장애인 생산시설 구매실적(최근 3개년)으로 전체 구매액 대비 중증장애인 생산품 구매액 비율 정보를 제공 합니다.데이터 구성 항목으로는 연도, 총구매액, 중증장애인 생산품 구매액, 전체 구매액 대비 중증장애인 생산품 구매액 비율 등 최근 3개년 구매 실적 관련 핵심 지표가 포함됩니다. 본 데이터를 활용하면 한국가스공사의 중증장애인 생산품 우선구매 동향과 목표 달성 현황을 종합적으로 파악할 수 있습니다. 이를 통해 중증장애인 생산시설의 공공조달 시장 진출 기회 분석, 제품 개발 방향 설정, 사회적 가치 실현 정책 효과 분석에 참고자료로 활용할 수 있으며, 공공기관의 사회적 책임 이행 연구, ESG 경영 분석, 장애인 고용 및 복지 정책 수립, 사회적 경제 활성화 연구에도 기초자료가 됩니다.
