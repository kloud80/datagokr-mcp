description_portal: 본 데이터는 에너지 취약계층의 난방, 냉방 등 기본적인 에너지 사용을 지원하기 위한 에너지바우처 제도의 연도별 발급 가구수를 통계적으로 제공합니다. 에너지바우처는 경제적 어려움으로 에너지 비용 부담을 느끼는 저소득층 가구에 일정 금액의 바우처를 지급하여 에너지 복지를 증진하는 정책입니다. 본 통계 데이터는 제도 시행 이후 각 연도별로 실제 바우처를 지원받은 가구수를 상세히 나타내며, 이를 통해 정부 및 지방자치단체는 에너지복지정책의 효과성 평가 및 향후 정책 개선 방안 수립을 위한 근거자료로 활용 가능합니다. 또한 연구기관에서는 저소득층의 에너지 소비 현황 및 에너지 복지 실태 분석을 위한 중요한 기초자료로 활용할 수 있습니다.
