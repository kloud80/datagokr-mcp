summary_user: 부산 해운대구에서 운영하는 노인일자리 사업단별 현황을 수행기관, 사업명, 사업구분(공익활동형·역량활용형·공동체사업), 참여 인원, 주요 활동내용, 사업 기간 단위로 담은 시군구 범위 파일입니다(포털 설명상 수행기관 11개소·105개 사업단). 해운대구에 사는 어르신이나 가족이 "집 근처 어느 기관에서 어떤 노인일자리에 몇 명을 뽑아 운영하나"를 확인하거나, 분석가가 사업 유형별 참여 규모를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수행기관 이름이나 구군명으로 맞춰 노인복지시설·사회복지시설 목록 또는 지역 통계와 잇는다.
description_portal: '부산광역시 해운대구 노인일자리 사업 현황자료 입니다.해운대구 노인일자리사업은 수행기관 11개소에서 105개 사업단을 구성하여 운영하고 있습니다.수행기관별 노인일자리사업 주요 활동내역을 확인할 수 있습니다.인원(명)은 사업별 노인일자리사업 참여 인원수를 확인할 수 있습니다.사업구분은 공익활동형, 역량활용형, 공동체사업으로 구성되어 있으며유형별특징은 다음과 같습니다.- 공익활동형 : 노인일자리 취약계층 지원 및 지역사회 공익증진 활동을 하면서 소득보전할 수 있는 사업(월 30시간 근무, 활동비 최대 29만원)- 역량활용형 : 노인의 숙련된 기술, 전문성 및 경험 등을 활용하여 지역사회에 기여할 수 있는 사업(월 60시간 근무, 활동비 최대 76만원)- 공동체사업 : 노인에 의한 상품의 생산·판매, 서비스의 제공 등을 목적으로 하며 참여하는 노인이 둘 이상인 사업단(수익에 따라 급여 상이함)'
