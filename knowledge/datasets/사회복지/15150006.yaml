summary_user: 청소년활동 자원봉사 터전인증과 관련된 봉사활동의 운영 내역을 운영 건별로 담으며, 신청번호·봉사활동운영번호와 함께 활동 인원수, 장소, 프로그램 내용, 활동 내용, 자원봉사시스템 활용 여부를 기록한다. 터전인증 운영기관이나 정책 분석가가 인증 터전에서 어떤 봉사 프로그램이 몇 명 규모로 어디서 운영됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 신청번호(aplyNo) 같은 같은 기관 내부 코드나 장소·프로그램 이름 매핑으로만 이어 쓴다.
description_portal: 성평등가족부 청소년활동 자원봉사 터전인증 봉사활동 운영 정보는 터전 인증과 관련된 봉사활동의 실제 운영 내역을 체계적으로 기록하고 관리하기 위해 제공되는 자료입니다. 활동명, 운영 일자, 참여자, 활동 장소, 지도자, 진행 상태 등 다양한 데이터를 포함하며, 기관에서는 이를 활용하여 프로그램 운영 현황 확인, 참여자 관리, 안전 점검, 정책 분석, 프로그램 개선, 기록 관리, 교육 지도 등 다양한 목적으로 활용할 수 있습니다. 또한 봉사활동 운영 정보는 청소년 활동 기록 관리와 프로그램 신뢰성 확보에도 중요한 자료입니다.
