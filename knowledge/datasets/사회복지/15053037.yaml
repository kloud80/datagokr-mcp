description_portal: 공무원연금공단에서 관리하는 연금 신규가입자에 대한 현황을 직종 및 연령별로 구분하여 집계한 데이터로, 공무원 조직의 신규 진입 인력의 구조와 특징을 분석하는 데 활용할 수 있습니다.연령은 ‘18세 이상’부터 ‘65세 이상’까지 약 48개 구간으로 세분화되어 있으며, 각 연령대별로 신규 가입자 총계(계)와 함께 15개 직종별 가입자 수가 포함되어 있습니다.직종 구분에는 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관검사, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(우정직, 외무직, 청원경찰, 전문경력관 등)가 포함됩니다.본 데이터는 특정 연령대에서 주로 진입하는 직종의 분포를 분석하거나, 직종별 채용 시 평균 연령, 고령 신규 진입자 여부 등을 진단할 수 있는 기반자료입니다.
