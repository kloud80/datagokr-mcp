summary_user: 서울시 공동육아방을 시설 한 곳당 한 행으로 담으며, 시설명·자치구·주소·좌표, 대상 연령과 서비스 분류, 이용료 무료 여부, 평일·회차별·토요일 운영시간을 함께 싣는다. 보호자가 '우리 구에서 토요일에도 여는 무료 공동육아방이 어디인가'를 찾거나, 분석가가 자치구별 공동육아 시설 분포와 돌봄 공백 지역을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 자치구명·주소 같은 이름 매칭이나 좌표(X_CRDNT_VALUE·Y_CRDNT_VALUE)를 이용한 공간 결합으로 이어 쓴다.
limits: 서울 열린데이터광장(data.seoul.go.kr)의 별도 인증키가 필요하며, 공공데이터포털 활용신청과는 별개다. 어린이집코드 같은 공통 코드가 없어 어린이집·유치원 데이터와 바로 조인할 수 없고 이름·주소 매핑이 필요하다.
