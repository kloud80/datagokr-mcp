description_portal: 인천광역시 영종구 공동육아나눔터의 기관명, 소재지(주소), 운영 시간등에 대한 정보입니다.파일명 인천광역시 영종구_공동육아나눔터내용 기관명, 시설 소재지, 시설소개, 누리집(홈페이지), 대표연락처, 수용 인원, 이용대상, 자격요건, 운영시간, 이용방법, 이용요금, 지원내용, 전화번호  등주민들이 공동육아를 할 수 있도록 장소에 대한 정보를 제공하고있습니다. 자세한 현황 및 안내 사항은 누리집(홈페이지)  https://www.yeongjong.go.kr/main/main.do 또는 대표 전화번호 032-760-7915를 통해 확인하실 수 있습니다.
