legal_basis_portal: 아이돌봄 지원법 제19조(공동육아나눔터) ① 국가 및 지방자치단체는 아이양육 관련 정보교류, 부모교육 등을 위하여 「주택법」 제2조제3호에 따른 공동주택 등에 공동육아나눔터를 설치ㆍ운영할 수 있다. <개정 2020. 10. 20.>② 국가 및 지방자치단체는 제1항에 따라 설치한 공동육아나눔터를 법인이나 단체 등 전문기관에 위탁하여 운영할 수 있다.③ 공동육아나눔터 시설 기준, 위탁 등에 필요한 사항은 성평등가족부령으로 정한다. <개정 2020. 5. 19., 2025. 10. 1.>
