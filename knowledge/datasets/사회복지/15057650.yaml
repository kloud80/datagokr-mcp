summary_user: 경기도 내 장애인 전문·통합 어린이집을 시설 한 곳당 한 행으로 담으며, 시군, 국공립·사립 같은 시설 분류, 주소와 위경도, 연락처, 총정원·현원, 장애아 현원, 교직원 수, CCTV 설치 대수를 포함한다. 장애아를 둔 보호자가 우리 시군에서 장애아를 받는 어린이집이 어디이고 정원 대비 얼마나 차 있는지 확인하거나, 분석가가 시군별 장애아 보육 자원 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군 코드·시군명으로 다른 시군 단위 통계와 맞추거나, 좌표·주소로 지도나 다른 시설 데이터와 겹쳐 보는 식으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장애인 어린이집 현황을 정리한 자료로, 전문 어린이집과 통합 어린이집의 운영 현황을 포함합니다. 주요 항목에는 시군명, 어린이집분류명(전문·통합), 기관명, 시설분류명(국공립·사립 등), 소재지 지번주소와 도로명주소, 우편번호, WGS84 좌표(위도·경도), 연락처, 홈페이지 URL, 총정원수 및 현원수, 장애아 정원수와 현원수, 총 교직원수, CCTV 설치 대수가 포함되어 있습니다. 이를 통해 지역별 어린이집의 규모와 운영 현황을 파악할 수 있으며, 특히 장애아동 수용 규모와 실제 이용 현황을 비교하여 보육 자원의 적정성을 평가할 수 있습니다. 또한 CCTV 설치 현황과 교직원 배치 정보를 통해 아동 안전 관리와 보육 품질을 확인할 수 있으며, 보육복지 정책 수립 및 시설 평가 자료로 활용될 수 있습니다.
