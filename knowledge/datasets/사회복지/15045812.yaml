description_portal: 사립학교교직원연금공단 사학연금수급자 평균연금월액(퇴직연금) 데이터는 연금수급자 중에서 퇴직연금을 수급받는 사람들의 연령별 수와 평균연금월액을 교직원(교원, 사무직원) 항목으로 구분하여 집계한 데이터입니다. 50세 미만부터 90세 이상의 연령 범위에서 1세씩 증가하는 추이로 수급자의 정보를 제공하고 있으며,  이 데이터를 통해 공단의 연금 지급 현황을 투명하게 공개하고, 사학연금 제도의 건전성 및 재정 안정성을 대외적으로 보여주고자 합니다.해당 데이터는 연금 수급자 추이 파악 및 연금재정 전망, 그리고 제도 개선을 위한 기초 자료로 활용될 수 있습니다.본 데이터는 공공기관의 책임 있는 연금 운용을 입증하고, 연금 수급자와 이해관계자들이 공단의 재무 건전성을 명확히 파악할 수 있도록 지원합니다
