summary_user: 공무원연금기금 연금회계의 수익(연금기여금·부담금·보전금 등)과 비용(퇴직급여·퇴직수당 등 연금급여사업비, 관리운영비, 적립금 등), 순이익을 연도 한 행씩 담은 전국 단위 집계 파일로, 포털 설명상 1983년부터 작성됐다. 분석가가 '공무원연금 연금회계의 기여금·부담금 수입 대비 급여 지출이 연도별로 어떻게 변했고 정부 보전금이 언제부터 늘었나' 같은 재정 추세 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나 같은 기관(공무원연금공단)의 다른 기금 데이터와 이름으로 대조해 이어 쓴다.
limits: 연도별 회계 집계만 담아 기관·개인·지역별 세부 분석은 못 한다. 순이익은 연금수지 적자에 따른 연금회계지원금을 차감하기 전 금액이고, 재해보상 관련 부담금·급여는 2002년부터 연금회계에서 분리되어 그 전후를 그대로 비교하면 안 된다.
