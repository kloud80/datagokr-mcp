summary_user: 전국 장애인 거주시설의 시설 수와 입소·퇴소 인원, 연말 현재 이용인원(성별·연령별·장애유형별)을 연도·시도 단위로 집계한 파일(csv)로, 포털 설명상 2015~2024년을 담는다. 정책 분석가나 연구자가 '시도별 장애인 거주시설 이용자 중 지적·자폐성 장애인 비중은 어떻게 변해 왔나', '퇴소 사유 중 취업이나 연고자 인도는 얼마나 되나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 시도 이름을 맞춰 시도별 장애인 등록 현황 등과 이어 쓴다.
description_portal: 보건복지부에서 2015년부터 2024년까지 장애인 거주시설 수 및 입소 현황에 대한 정보를 제공하고 있습니다.<통계 이용 시 주의사항>1) 2011년 장애인복지법 개정으로 기존 장애인 생활시설에 단기 거주시설과 공동생활가정을 포함하여 장애인 거주시설로 통합･재편됨2) 장애인 거주시설은 사회복귀를 위한 재활 및 주거시설임 따라서 수용시설이 아님- 지방자치단체 입소 의뢰에 따라 입소 가능하고 사회복귀(퇴소)는 자유임3) 2014년부터 장애종류 분류 개편(지체 → 지체 및 뇌병변, 정신지체 → 지적 및 자폐성)
