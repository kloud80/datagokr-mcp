description_portal: 해당 데이터는 서울특별시 보육포털서비스에서 제공하는 어린이집 현원 현황(자치구,유형별)정보 입니다. 자치구, 유형별(국공립, 사회복지법인, 법인단체등, 민간, 가정, 부모협동, 직장) 어린이집 현황정보를 제공합니다. 해당 데이터는 통계연도, 자치구코드, 자치구명, 현원합계, 현원_국공립, 현원_사회복지법인, 현원_법인단체등, 현원_민간, 현원_가정, 현원_부모협동, 현원_직장으로 구성되어 있습니다. 해당 데이터의 원본 시스템은 서울특별시 보육포털(https://iseoul.seoul.go.kr)입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
