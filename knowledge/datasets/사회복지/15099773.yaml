description_portal: 대전광역시 장애인 정보통신보조기기 보급 현황 자료는 지능 정보화 기본법 제49조에 따라 장애인과 상이 등급 판정을 받은 국가유공자를 대상으로 정보통신보조기기를 지원한 내역을 포함합니다. 이 자료에는 연도 별 보급 현황, 연도 별 목표 및 실적 및 달성의 보급 현황에 대한 구체적인 내용이 수록되어 있습니다. 지원 대상자는 시각, 청각, 지체, 언어 등 다양한 장애유형별 정보통신 접근에 어려움을 겪는 이들로, 제품 가격의 80%까지 지원 받을 수 있으며, 기초생활수급자 및 차상위계층 장애인은 추가 지원을 받을 수 있습니다. 신청자는 온라인 또는 행정복지센터 방문·우편을 통해 접수하며, 서류심사와 전문가 평가를 거쳐 선정됩니다. 보급 이후에는 제품 설치, 이용 확인, 사후관리 등 실질적 활용을 위한 지원이 이뤄집니다.
