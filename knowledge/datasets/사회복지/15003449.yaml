summary_user: 전국 시도별 공공형 어린이집 수를 2011년부터 2026년 8월 말까지 연도별 열로 담은 집계 통계로, 한 행이 한 시도이며 파일 크기는 약 1.3KB입니다. 보육 정책 분석가나 지자체 담당자가 '우리 시도의 공공형 어린이집이 해마다 얼마나 늘거나 줄었는가'를 확인하고 지역 간 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 시도명을 기준으로 시도 단위 영유아 인구·어린이집 현황 통계와 이름 매핑으로만 이어 쓴다.
description_portal: 해당 데이터는 전국 시도별 공공형 어린이집의 연도별 설치 현황을 정리한 통계 자료로, 2011년부터 2026년 7월 말까지의 누적 데이터를 포함하고 있습니다. 공공형 어린이집은 일정 기준을 충족하는 우수 어린이집을 선정해 정부가 운영비를 지원하는 제도로, 안정적인 보육 환경 조성을 목적으로 운영됩니다. 데이터는 부산, 대구, 인천, 대전, 울산, 세종, 경기도 등 각 시도의 연도별 공공형 어린이집 수를 INT 형식으로 제공하며, 시계열 분석이 가능하도록 구성되어 있습니다. 연도와 지역을 기준으로 정렬되어 있어, 지역 간 공공형 어린이집 분포 및 연도별 증감 현황을 파악할 수 있는 구조입니다. 주요 컬럼은 시도명과 각 연도별 어린이집 수로 구성됩니다.
