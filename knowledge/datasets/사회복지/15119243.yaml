summary_user: 사립학교교직원연금공단 행복나눔대여의 대여 건별 상세 현황을 담은 전국 단위 파일로, 교직원상태·직구분·대여종류·대여일과 함께 대여금액·대여잔액·보증설정금액을 기록한다. 공단·연구자가 "행복나눔대여는 어떤 종류에 얼마나 집행되고, 교원과 직원 중 누가 주로 쓰는가" 같은 집행 비중과 수요를 분석하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대여종류·직구분 같은 이름 매핑이나 같은 기관(사학연금) 통계끼리만 이어 쓴다.
description_portal: 사립학교교직원연금공단의 행복나눔대여 상세현황과 관련 된 데이터로 교직원상태, 직구분, 대여금액, 대여잔액, 보증설정금액, 대여종류, 대여일의 데이터를 제공합니다. 본 데이터는 복지 사각지대에 놓인 교직원들에게 경제적 도움을 주기 위한 행복나눔대여 운영의 집행 현황을 투명하게 공개하고 이용자 및 잠재적 이용자들이 서비스의 접근성과 유용성을 명확히 이해할 수 있도록 돕습니다. 행복나눔대여 종류별 집행비중을 분석하고 규모가 적은 수혜 대상을 확대·재정비하여 행복나눔대여 제도개선에 활용하고 있습니다.또한 대여 품목 수요분석 및 서비스 개선 방안 모색을 위한 기초 자료롤 활용될 수 있습니다.
