summary_user: 경기도 워라밸링크 플랫폼에서 서비스와 정보 콘텐츠를 나누는 카테고리 체계를 카테고리별 한 행(고유번호·이름·아이콘·상위 카테고리 고유번호)으로 담은 분류 기준표이며, 가족·건강·여가·관계·직업·재무 같은 생활 영역과 가사·돌봄, 보육돌봄, 자녀교육 같은 세부 영역을 포함한다. 플랫폼 운영기관이나 분석가가 "워라밸링크 콘텐츠·서비스가 어떤 생활 영역별로 나뉘어 있고, 영역별 이용률은 어떤가"를 살필 때 분류 기준표로 쓴다. 전역 조인 키는 없어서, 같은 워라밸링크 계열 데이터의 카테고리 고유번호(category_idntfy_no)를 맞추거나 이름을 매핑해 연결한다.
description_portal: 경기도워라밸링크_카테고리관련 데이터는 경기도에서 제공하는 ‘워라밸링크’ 플랫폼 내 서비스와 정보 콘텐츠를 구분하는 카테고리 체계를 정리한 자료입니다. 주요 항목으로는 번호, 고유번호, 이름, 아이콘, 카테고리 고유번호가 있으며, 가족·건강·여가·관계·직업·재무 등 주요 생활 영역과 더불어 가사·돌봄, 보육돌봄, 자녀교육 등 세부 영역으로 구분됩니다. 이 데이터는 플랫폼 이용자가 원하는 주제 영역을 쉽게 탐색할 수 있도록 돕는 동시에, 서비스 운영기관이 카테고리별 이용률을 분석하거나 새로운 서비스 분류 체계를 설계하는 근거로 활용할 수 있습니다.
