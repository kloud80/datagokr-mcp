summary_user: 「2024 청소년백서」를 담은 파일 데이터로, 청소년 인구·생활환경, 권리·참여, 활동, 복지, 안전·보호, 교육, 노동, 정책 인프라 등 분야별 정책 현황과 통계를 전국 단위 보고서 형태로 정리한다. 정책 연구자나 청소년 기관 실무자가 '청소년 정책이 연도별로 어떻게 바뀌었고 수련시설·활동 지원 현황은 어떤가'를 확인하는 참고 자료로 쓴다. 실측 컬럼에서 전역 조인 키가 없어 다른 데이터와는 기관명·지표 이름으로만 맞춰 이어야 하며, 전국·비공간 자료라 시군구·시도 지역 통계와 직접 연결하기 어렵다.
