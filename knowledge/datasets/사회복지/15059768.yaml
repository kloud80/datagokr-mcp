description_portal: 청소년관련 정책추진 현황 및 관련 통계 등이 수록된  「2024 청소년백서」 자료입니다.청소년백서는 1965년 최초 발간 이래 1979년부터  매년 청소년정책 연혁 및 정책 내용에 대한 체계적 정리를 통해 정책 추진성과를 시계열적으로 점검.공표하고, 관계기관, 청소년단체, 유관기관, 청소년지도자 및 전문가 등 대국민에게 청소년 정책 현황에 대한 정보를 제공합니다.1. 청소년정책 관련 분야별 정책 통계를 시각화 및 성별 영향 분석 강화에 따른 성별 통계 자료 등을 제시하며, 국내외 청소년정책 자료 및 발표 통계 등을 활용하여 제시- 국내외 청소년정책자료 및 주요 지표, 청소년인구 및 생활환경, 청소년 권리.참여, 청소년 활동, 청소년 복지, 청소년 안전과 보호, 청소년 교육, 청소년 노동 , 정책 추진 인프라 등 분야별 현황과 전망 및 각종 통계 수록2. 우리나라 청소년정책의 연혁 및 기본방향, 세계 청소년정책의 현황- 「청소년 기본법」, 「청소년활동 진흥법」, 「청소년복지 지원법」, 「청소년 보호법」, 「아동청소년의 성보호에 관한 법률」 등에 근거하여 추진하는 청소년 정책의 변천 과정- 청소년 인구규모 감소와 함께 변화하는 특성을 정책 환경에 대응하고자 수립한 "제7차 청소년정책 기본계획" 특징3. 우리나라 청소년 인구의 현황과 동태, 청소년 인구 규모의 전망에 대해 살펴보고, 청소년을 둘러싼 다양한 생활환경의 현황과 이에 대한 청소년들의 인식 변화에 대한 내용4. ‘청소년 권리·참여’를 주제로, 우리나라 청소년들의 권리 및 참여를 증진하기 위한 청소년 권리 증진 정책에 대한 내용5. 성평등가족부가 추진하고 있는 다양한 청소년활동 지원 정책과 프로그램6. 정부에서 추진하고 있는 청소년 대상의 다양한 상담·복지 서비스7. 청소년의 안전한 수련활동 여건을 확보하기 위하여 청소년 수련시설 종합 안전, 위생점검(건축, 토목, 기계, 소방, 전기, 가스, 위생 분야)8. 우리나라 ‘청소년의 교육’에 대한 내용으로 학교 교육의 전반적인
