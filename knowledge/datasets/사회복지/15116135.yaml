summary_user: 서울 강남구 어린이집을 한 곳당 한 행으로 담은 현황 데이터로, 어린이집명·유형(국공립·직장·가정 등)·운영상태·주소·전화·정원과 현원·연령별 반 수와 아동 수·보육실 규모·CCTV 수·위도경도·인가일과 휴지·폐지일을 포함한다. 강남구에 사는 부모가 집 근처에 정원 여유가 있는 국공립 어린이집이나 야간연장 같은 제공서비스를 운영하는 곳이 어디인지 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 어린이집 평가·보육료 공시·입소 대기 데이터와는 어린이집명·주소 매칭이나 같은 기관 코드로만 잇고, 좌표(위도·경도)로 지도 위에 겹쳐 쓴다.
description_portal: 서울시 강남구 어린이집 정보(https://data.seoul.go.kr/dataList/OA-20323/S/1/datasetView.do)입니다.본 데이터는 어린이집 명, 유형(국공립, 직장, 가정 등), 운영형황 제공서비스(일반, 야간연장형 등)등을 제공하고 있습니다.어린이집정보공개포털에서 제공하는 어린이집 현황 정보입니다.※ 본 데이터의 저작권은 어린이집정보공개포털(http://info.childcare.go.kr/)에 있음을 알려드립니다.데이터 활용시 참고하시기 바랍니다.
