description_portal: 어린이집은 직장, 학업 등등 기타사유로 영유아를 직접 보육할 수 없는 부모들을 대신하여 영유아를 보육해주는 아이를 낳고 키우기 좋은 사회환경을 조성하기 위해 꼭 필요한 시설입니다경상남도 도내 어린이집의 전반적인 현황을 파악할 수 있도록  상세 정보를 제공합니다. 제공 항목에는  어린이집 시군구명, 어린이집명, 어린이집 상세주소, 우편번호, 전화번호 등 시설의 기본 위치 정보와 함께 국공립·민간·가정 등 어린이집 유형과, 어린이집 특성을 포함한 시설 정보가 담겨 있습니다. 또한 보육서비스 제공 규모를 파악할 수 있도록 아동정원수, 아동현원수, 보육교직원현원, 보육실수, 보육실면적, 놀이터 수 등 인력 및 이용 현황 정보도 함께 제공합니다. 어린이집 운영 현황은 4월 23일 기준 1,525개소로 구성되어있으며, 국공립, 사회복지법인, 법인·단체, 민간, 가정, 협동, 직장 등 다양한 유형의 시설이 아동과 가정의 보육 수요를 균형 있게 충족하고 있으며, 이러한 자료는 지역별 보육 인프라 확충 및 정책 수립의 기초자료로 활용될 수 있으며, 경상남도 내 보육서비스의 현황을 종합적으로 이해하는 데 중요한 참고 자료가 됩니다. 이를 통해 지역 내 어린이집의 접근성을 높이고, 부모와 보호자의 보육 시설 선택에 도움을 주며, 지역 사회의 아동복지 향상을 기여할 수 있습니다.
