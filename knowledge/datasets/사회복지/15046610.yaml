description_portal: '○ 통계개요* 통계명 : 국민연금 가입자* 통계종류 : 국민연금의 가입종별 가입자 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「국민연금법」「공무원연금법」「사립학교교직원연금법」규정에 따른국민연금 가입자 현황* 작성목적 : 국민연금제도의 업무추진 실적 및 가입자ㆍ징수ㆍ급여ㆍ기금현황 등을파악 하여 연금정책 수립 및 관련 연구를 위한 기초자료로활용하는 것을 목적으로 함* 조사체계 : 지사 및 기금운용본부 → 국민연금공단* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구, 해당기관내용 - 국민연금의 가입종별(사업장, 지역, 임의, 임의계속)ㆍ성별가입자 현황○ 용어설명* 사업장가입장 : 국민연금 적용 사업장에 종사하는 18세이상 60세미만의 근로자와 사용자* 지역가입자 : 국내에 거주하는 18세이상 60세미만의 국민으로서 사업장 가입자가 아닌 자* 임의가입자 : 국민연금법 제6조의 가입대상 중 사업장가입자 및 지역가입자 외의 자로서공단에 가입신청을 하여 가입된 자* 임의계속가입자 : 국민연금 가입기간이 20년미만인 가입자로서 60세에 달한 자가 65세에달할 때까지 공단에 가입신청을 하여 가입된 자○ 기 타* 국민연금 지역 가입자에 납부예외자 포함○ 출 처 : 국민연금공단'
