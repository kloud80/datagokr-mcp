summary_user: 경기도 차상위계층 장애수당 수급자를 기준년도와 장애정도(중증·경증 등)별로 집계한 통계로, 전체 수급자 수와 지체·뇌병변·시각·청각·지적·자폐성·정신 등 장애유형별 수급자 수를 담고 있으며 개인별 원천 기록은 아니다. 복지 담당자나 분석가가 '경기도 차상위 장애수당 수급자 가운데 어떤 장애유형이 해마다 늘고 있는가'처럼 유형별 수급 추이를 보고 예산 배분 근거를 찾을 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 장애인·복지 통계와는 기준년도와 장애정도 명칭을 맞추는 방식으로만 이어 쓸 수 있다.
description_portal: 본 데이터는 보건복지부 사회보장정보시스템을 기반으로 경기도 내 차상위계층을 대상으로 한 장애수당 수급자 현황을 연도별로 집계한 자료입니다. 항목은 ‘기준년도’, ‘장애정도’, ‘전체수급자수(명)’, ‘지체수급자수(명)’, ‘청각수급자수(명)’, ‘지적수급자수(명)’, ‘자폐성수급자수(명)’ 등 다양한 장애유형별 수급자 수로 구성되어 있으며, 장애의 중증도와 유형에 따라 차상위계층의 장애수당 수급 실태를 파악할 수 있습니다. 이 데이터는 복지사각지대 해소를 위한 정책 수립, 차상위계층 대상 맞춤형 서비스 설계, 장애 유형별 예산 배분 근거 마련, 복지자원 배치 전략 수립 등에 유용하게 활용될 수 있습니다. 연도별 수급자 수 변화 추이를 통해 정책 효과를 평가하거나 향후 복지 서비스의 방향성을 설정하는 데 기초자료로 활용됩니다.
