description_portal: 광주환경공단이 한 해 동안 수행한 지역사회 공헌 활동에 대한 전반적인 실적을 체계적으로 정리한 자료입니다. 해당 데이터는 공단이 지역사회와의 상생과 사회적 책임 실현을 목적으로 추진한 다양한 봉사, 기부, 교육, 환경개선 등의 활동 내용을 포함하고 있습니다. 데이터에는 각 공헌 활동이 실제로 이루어진 ‘활동일자’를 비롯하여, 활동의 주제를 나타내는 ‘활동명’, 보다 구체적인 내용을 설명하는 ‘세부내용’, 활동의 수혜 대상이나 참여 대상을 구분한 ‘대상’, 해당 활동에 참여한 전체 인원 수를 집계한 ‘총 참여인원’, 그리고 외부 협력 단체나 기관이 있었는지를 나타내는 ‘협업기관’에 대한 정보가 포함되어 있습니다. 이러한 정보를 통해 지역사회와의 연계성과 공단의 사회적 기여 정도를 객관적으로 파악할 수 있으며, 공공기관으로서의 사회적 책임 이행 수준, 민·관 협업 현황, 지속가능한 지역사회 발전에의 참여 정도 등을 종합적으로 살펴볼 수 있습니다. 아울러 이 데이터는 향후 사회공헌 계획 수립 시 참고자료로 활용되거나, 유사기관 간의 벤치마킹, 대국민 정보 공개의 수단으로도 가치가 매우 높습니다.
