summary_user: 2007~2025년 사회적기업 인증이 취소되거나 반납된 기업을 한 건씩 담은 전국 목록으로, 기업명·사업자등록번호·분야·인증날짜·취소날짜·취소사유가 들어 있다. 거래처나 지원 대상 기업이 과거 사회적기업 인증을 잃은 적이 있는지, 부정 인증·요건 미충족·반납 중 어떤 사유였는지 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 현재 인증 사회적기업 목록이나 다른 기업 데이터와 연결한다.
