description_portal: '한국사회보장정보원에서 제공하는 기초생활보장 관련법에 의한 소년소녀가장 지원금 서비스를 받는 수급자를 기준으로 월별, 시군구별, 성별, 연령구간별로 집계한 통계 데이터입니다.데이터 구성은 통계년월, 시도명, 시군구명, 연령구간, 성별, 수급자수 항목으로 구성되어 있습니다.이 데이터를 활용하여 특정 연령대와 성별에 따른 복지 수요, 지역별 소년소녀가정의 복지 수요 등을 분석할 수 있습니다. 아울러 이러한 공공데이터를 통해 다음과 같은 데이터분석, 연구 등의 활용이 가능합니다.*단순 예시 사례이니,  참고바랍니다.○세대 구분별 현황 파악: 소년소녀가정 중 조부모-손자녀 가구, 부모 부재 가구 등 각 세대 구분별로 수급자 수를 파악하여 어떤 유형의 가구가 더 많은 지원을 필요로 하는지 알 수 있습니다.○월별 추이 분석: 월별 수급자 수의 변화를 분석하여 계절적 요인, 정책 변화 등이 수급자 수에 미치는 영향을 파악할 수 있습니다.○지역별 분포 분석: 전국 시·도별, 시·군·구별로 수급자 분포를 분석해 복지 사각지대나 특정 지역에 수급자가 집중되는 현상을 발견할 수 있습니다.'
