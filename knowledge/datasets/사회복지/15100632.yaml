summary_user: 인천광역시 계양구 안의 재가노인복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·도로명주소·전화번호·행정동이 들어 있다(CSV 약 9KB). 계양구에 사는 어르신이나 보호자가 '우리 동네(행정동)에 있는 재가노인복지시설은 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 행정동별 시설 분포를 보는 데 쓴다. 전역 조인 키나 시설코드가 없으므로 다른 데이터와는 도로명주소·행정동 이름이나 시설명 매칭으로 이어야 하며, 건강보험 장기요양기관 목록과는 시설명·주소로 대조해 쓴다.
limits: 계양구 한 곳만 다루므로 인천 전체나 다른 시군구와 비교하려면 별도 데이터가 필요하다. 시설코드 같은 공통 키가 없어 다른 데이터와 연결할 때 이름·주소 매칭에 의존해야 하고, 좌표 필드가 없어 지도에 올리려면 주소를 좌표로 변환해야 한다.
