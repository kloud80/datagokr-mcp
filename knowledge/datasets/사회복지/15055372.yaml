description_portal: 본 데이터는 여수시 관내 읍·면·동별 기초생활수급자 현황을 체계적으로 정리한 자료로, 지역별 수급자 분포와 수급 유형별 규모를 파악할 수 있도록 작성되었습니다.담당부서는 사회복지과이며, 여수시 내 각 행정구역 단위에서 운영·관리되는 기초생활보장 수급 현황을 기반으로 작성된 행정자료입니다.이 데이터는 국민기초생활보장제도의 지원 대상 현황을 지역 단위로 확인할 수 있도록 구성되어 있으며, 읍면동별 수급 가구 수와 수급권자 수를 여러 유형으로 구분하여 제공합니다. 이를 통해 특정 지역의 복지 수요 규모를 파악하고, 지역 간 수급자 분포를 비교하거나 복지정책 수립 및 행정서비스 운영의 기초자료로 활용할 수 있습니다.이 자료는 여수시 각 행정구역의 기초생활보장 수급 현황을 지역별로 파악할 수 있도록 일반수급자 현황을 가구수와 수급권자수 기준으로 구분하여 제공합니다.
