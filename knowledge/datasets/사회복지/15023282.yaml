summary_user: 부산광역시 강서구 관내 아동복지시설을 시설 한 곳당 한 행으로 담은 소규모 파일로, 시설명·시설종류·소재지와 위도·경도, 설치일자, 정원·현원, 종사자 수, 시설장, 전화번호를 담는다. 강서구에서 아동생활시설이나 아동이용시설이 어디에 있고 정원 대비 현원이 얼마나 차 있는지 확인하려는 보호자나 복지 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 매칭이나 위도·경도 기반 공간 결합으로 잇고, 사회복지시설 공통 마스터를 참조해 대조한다.
