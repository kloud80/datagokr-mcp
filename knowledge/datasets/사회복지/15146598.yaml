description_portal: 이 데이터는 충청남도 금산군의 장애인 연금 수급자 현황 데이터입니다. 장애인 연금 수급자 현황은 만 18세 이상 중증장애인 중 소득과 재산이 일정 기준 이하인 대상자에게 지급되는 장애인연금의 수급 현황을 담고 있으며 본 데이터는 읍면별, 월별 장애인연금 수급권자수와 수급자수를 주요 항목으로 제공합니다.  장애인 소득보장 정책의 효과성을 분석하고, 지역별 복지 수요를 파악하여 맞춤형 복지정책을 수립할 수 있고 국민에게는 장애인 복지 실태를 객관적으로 이해할 수 있는 기초자료로 제공됩니다.
