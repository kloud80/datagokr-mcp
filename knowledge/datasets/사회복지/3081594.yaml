summary_user: 전국 다문화가족지원센터 가운데 시·도 권역을 맡는 거점센터의 목록으로, 센터별 한 행에 관리지역·센터명·주소·연락처를 담은 작은 파일이다. 결혼이민자 가족이나 지원 실무자가 '우리 시·도를 담당하는 다문화가족 거점센터는 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 공통 조인 키가 없어 다른 가족센터·사회복지시설 데이터와는 관리지역 이름이나 주소 문자열을 맞춰서만 이을 수 있다.
description_portal: 한국건강가정진흥원이 제공하는 전국 다문화가족지원센터 거점현황을 담고 있습니다. 제공 항목은 연번, 관리지역, 거점센터, 센터주소, 연락처 등이며, 총 17개의 센터 정보가 수록되어 있으며, 전국 다문화가족지원센터는 결혼이민자와 그 가족의 안정적인 한국 사회 정착과 삶의 질 향상을 지원하기 위해 다양한 서비스를 제공합니다. 다문화가족지원센터의 주요 업무는 한국어 교육 및 통합교육, 가족 상담 및 사례관리, 통번역 서비스, 자녁 교육지원 및 결혼이민자의 경제적 자립을 돕기위해 취업지원을 위한 교육을 지원합니다. 이 데이터는 다문화가족지원센터 거점센터의 현황으로, 거점센터는 시･도별 특성에 맞는 다문화가족지원 프로그램 개발･보급, 권역 내 다문화가족지원센터 사업지원 및 관리, 권역 내 센터/관련기관 간 네트워크 구축 및 운영 업무를 수행합니다. 이 데이터는 다문화가족 지원 정책 수립, 지역별 서비스 제공 계획, 연구 및 분석 등에 활용될 수 있습니다.
