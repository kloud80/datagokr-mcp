description_portal: 공무원연금공단 신규 가입자의 평균 연령 변화를 연도별로 제공하는 데이터입니다.2007년부터 기준년도까지의 신규가입자 평균연령(세), 전년 대비 증감 수치(세), 증감률(%)로 구성되어 있으며, 신규로 공무원연금제도에 편입된 가입자의 연령 특성을 파악할 수 있습니다.이 데이터는 신규 공무원의 진입 시점 연령 변동을 보여주며, 청년층의 공직 진출 경향, 채용제도 변화, 경력직 채용 확대 등의 영향을 분석하는 데 유용합니다. 인사행정 및 조직설계 관점에서도 신규 인력의 연령구성을 파악하여 교육훈련, 경력관리, 퇴직예측 등의 기초자료로 사용할 수 있으며, 연금재정 수지의 중장기 전망에도 참고지표로 활용될 수 있습니다.관리부서 데이터 미관리로 2024년까지 데이터 제공하며 1회성 데이터로 전환되었습니다.
