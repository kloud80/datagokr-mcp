summary_user: 청소년 복지·보호시설을 한 곳씩 담은 건별 시설 목록으로, 시설분류·종류·시설명·시도·시군구·상세주소·위경도·우편번호·대표전화·시설설명을 담으며 검증 때 API 전체 건수는 2건(전국 범위)이었다. 위기 청소년이나 보호자가 '우리 동네 가까운 청소년 쉼터·보호시설이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 지역별 시설 분포와 접근성을 볼 때 쓴다. 상세주소(daddr)와 위도·경도(lat·lot)를 키로 다른 시설·지도 데이터와 공간 결합하고, 시도·시군구명으로 지역 통계와 이어 쓴다.
limits: 검증 호출에서 전체 건수가 2건뿐이어서 전국 시설 현황을 온전히 담았다고 보기 어렵고, 분포 분석 전에 실제 수록 규모를 확인해야 한다. 생성 후 바뀌지 않는 이벤트성 데이터로 분류되어 있어 시설 신설·폐쇄가 반영된다고 가정하지 않는다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
