summary_user: 공무원연금 유족연금 수급자 수를 연령 구간(구분, 18세 미만부터) 행마다 배우자·부모·자녀·손자녀·조부모 유족유형별로 나누고 남녀로 다시 나눠 담은 전국 단위 집계표이며, 파일은 2KB 남짓의 작은 CSV다. 공무원 유족연금을 받는 사람이 어느 연령대와 유족유형에 몰려 있는지, 배우자 유족 가운데 여성 비중은 얼마인지를 보려는 연금 정책 분석가나 연구자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 연령 구간·유족유형 이름을 맞춰 붙여야 하며, 공무원연금공단의 다른 수급자 통계와 나란히 비교하는 정도로 이어 쓴다.
description_portal: 공무원연금공단에서 제공하는 유족유형별·연령별 유족연금수급자 현황 데이터입니다. 해당 자료는 유족연금 수급자를 연령대별로 구분하고, 유족유형을 기준으로 배우자, 부모, 자녀, 손자녀, 조부모 등 세부 유형으로 나누어 성별(남성·여성) 현황을 함께 제공합니다. 연령 구간은 18세 미만부터 시작해 세부적으로 구분되어 있으며, 각 유형별 수급자 수 및 성별 분포를 확인할 수 있습니다. 1. 2024년 장해유족연금수급자(3,872명) 제외2. (21.6.22.이전 연금수급자 사망)19세 이상 자녀 중 공무원 재해보상법에 따른 장해등급 1~7급에 해당3. (21.6.23.이후 연금수급자 사망)19세 이상 자녀 중 장애인복지법 제2조에 따른 장애의 정도가 심한 장애인에 해당하고 연금수급자 사망당시 부양사실이 인정된 경우
