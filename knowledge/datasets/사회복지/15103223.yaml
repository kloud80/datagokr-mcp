summary_user: 한국소비자원이 2018년 전국 소비자 2,000명에게 실시한 사회적경제 관련 소비자 경험·인식 설문의 응답자별 원자료(문항 코드별 응답값)를 zip 파일로 담는다. 정책 연구자나 사회적경제 지원 기관이 '소비자는 사회적기업·협동조합 상품을 얼마나 써 봤고, 앞으로 살 의향이 있는가'를 응답자 특성별로 집계하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했고 인증번호·사업자번호 같은 기업 식별자도 없어, 사회적기업 인증 목록 등 기업 데이터와는 직접 이어 붙이지 못하고 주제 수준의 참고 자료로 함께 본다.
description_portal: 한국소비자원이 2018년 전국 소비자 2,000명을 대상으로 실시한 사회적경제 관련 소비자 경험 및 인식 조사를 기반으로 한 데이터입니다. 설문 문항과 응답 결과를 포함하고 있어 소비자의 사회적경제 관련 상품·서비스 이용 경험, 전반적 인식, 향후 소비 의사 등을 다각도로 분석할 수 있습니다. 또한 한국소비자원은 이를 통해 사회적경제가 소비자의 적극적인 참여를 기반으로 성장하기 위한 정책적 시사점을 제시하고 있으며, 관련 정책 연구, 제도 개선, 소비자 교육 및 홍보 자료 개발에도 활용될 수 있습니다.
