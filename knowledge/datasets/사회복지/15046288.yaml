description_portal: '○ 통계개요* 통계명 : 혼인종류별 혼인* 통계종류 : 조사통계, 지정통계* 근거법령 : 통계법 제17조 및 제18조에 의한 지정통계(제10103호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 혼인?이혼에대한 현황을 파악하여, 국가의 인구?주택?보건?사회복지?교육?교통 등에 관한정책수립 및 민간기업의 경영계획 수립에 필요한 기초 자료 제공* 조사체계 : 읍·면·동→시·군·구→시도→통계청* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 남편, 아내 혼인종류별 혼인건수 등○ 용어설명* 혼인 : 남편(부)과 아내(처)로 구성된 법적관계임. 법률혼주의 원칙에서 혼인신고수리의경우와 직권에 의해 가족관계등록부기재에 의한 신고로 이뤄짐(단, 신고에 의한것이므로 혼전 동거,별거 등 사실혼과는 차이가 있을 수 있음)○ 기 타* 남편의 주소지 기준'
