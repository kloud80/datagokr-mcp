description_portal: 본 데이터는 광주광역시에 등록된 국제결혼중개업체 현황을 정리한 자료입니다. 시군구명 기준으로 동구, 서구, 남구, 북구, 광산구에 소재한 국제결혼중개업체 정보를 수록하고 있으며, 각 업체별로 업체명과 대표자 성명, 동 단위 이상 소재지 정보를 제공합니다. 동일 시군구 내 복수 업체가 포함되어 있으며, 공동 대표자는 병기하여 표기되어 있습니다. 국제결혼중개업체의 지역별 분포와 기본 등록 정보를 확인할 수 있도록 구성된 자료로, 국제결혼중개업 관리 및 현황 파악을 위한 기초 자료로 활용할 수 있습니다.
