summary_user: 대구광역시 동구에 소재한 사회적기업을 기업 한 곳당 한 행으로 정리한 목록 파일로, 구분·기업명·대표자·소재지·사업내용을 담는다(csv 약 2.8KB 규모). 주민이나 구직자, 사회적경제 지원 담당자가 '동구에는 어떤 사회적기업이 어디에서 무슨 사업을 하는가'를 확인하는 데 쓴다. 인증번호·사업자번호 같은 전역 조인 키가 없어 다른 사회적기업·사업자 데이터와는 기업명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 사회적기업은 사회적 목적을 우선으로 추구하면서도 영리활동을 수행하는 기업을 말합니다. 이들은 취약계층에게 일자리나 사회서비스를 제공하거나, 지역사회 문제 해결, 환경보호, 공익적 가치 실현 등을 목적으로 설립되고 운영됩니다.대한민국에서는 『사회적기업 육성법』에 따라 고용노동부 장관의 인증을 받아야 사회적기업으로 인정되며, 인증을 받은 기업은 정부로부터 세제 혜택, 재정 지원, 컨설팅 등을 받을 수 있습니다. 일반적인 영리기업과 달리 수익의 상당 부분을 사회적 목적 실현에 재투자하고, 공정하고 투명한 경영을 중요하게 여깁니다.사회적기업은 일자리 제공형, 사회서비스 제공형, 혼합형, 지역사회 공헌형, 기타형 등으로 구분되며, 이윤 추구보다는 사회적 가치 창출에 무게를 둔 기업 모델로 주목받고 있습니다.
