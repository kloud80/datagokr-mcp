summary_user: 공무원연금공단이 지급한 장해연금액을 기준년도 기준으로 연령(38세~84세 이상, 1세 단위)별 행과 장해등급(1등급~11등급 이하)별 열로 나눠 전국 단위로 집계한 표로, 건별 원천이 아닌 집계 파일입니다. 연금·재해보상 분석가가 "공무원 장해연금 지급액이 어느 장해등급과 연령대에 몰려 있는가" 같은 질문에 답하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 공단의 다른 직역연금 통계 표와는 연령·장해등급 이름을 맞춰 붙여 쓴다.
description_portal: 공무원연금공단에서 관리하는 장해등급별 연령별 장해연금지급액 현황을 기준년도 기준으로 집계한 데이터입니다.장해등급(1등급~11등급 이하)별 연령대(38세~84세이상, 1세단위)별로 구분된 장해연금지급액 현황을 포함하고 있습니다.장해등급별 세분화된 지급액 분포의 변화 추이를 통해 공무원들의 직무 관련 부상이나 질병의 심각도 변화 등을 확인하고, 관련 정책 개선에 활용할 수 있습니다.장해등급 판정은 공무원 재해보상법 시행령의 장해등급표를 기준으로 하여, 시행규칙의 판정기준에 따릅니다.
