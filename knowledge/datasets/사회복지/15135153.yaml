summary_user: 경기도 워라밸링크 플랫폼에 노출되는 배너 콘텐츠를 배너 한 건 단위로 담은 자료로, 고유번호·제목·배경 색상·링크버튼 문구와 글씨색 같은 화면 표시 속성으로 구성된다. 플랫폼 기획자나 분석가가 "워라밸링크는 어떤 정책 콘텐츠를 어떤 문구와 버튼으로 안내하고 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 배너 제목 같은 이름 매핑이나 같은 기관(경기도) 기준으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼 내에서 사용되는 배너 콘텐츠 정보를 수록한 자료로, 고유번호, 제목, 배경 색상, 링크버튼 텍스트, 링크버튼 글씨색상, 필드명 등의 항목으로 구성되어 있습니다. 배너는 워라밸링크의 주요 콘텐츠나 서비스를 안내하는 시각적 요소이며, 각 배너는 버튼 색상과 텍스트 등의 스타일 속성으로 시각적 차별화를 제공합니다. 이 데이터는 워라밸 정책 콘텐츠의 시각적 안내 및 사용자 접근 유도에 관한 기획자료로 활용될 수 있으며, 플랫폼 내 서비스 연결 구조 및 사용자 UI 흐름을 분석하는 데 유용합니다.
