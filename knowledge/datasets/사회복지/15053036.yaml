description_portal: 공무원연금공단에서 관리하는 가입자 추이를 재직년수(1년미만~40년이상 등)별로 구분하여 제공하는 데이터입니다. 특정 재직기간 구간에서의 인원 변화 추이를 통해 공직사회 내 인력 구조 변화, 중·장기 재직자 수 증가 추세, 신규 진입자 비율 변화 등을 분석하는데 활용될 수 있습니다.1. 2000년까지의 재직년수 통계는 5년미만, 5년∼10년미만, 10년∼15년미만, 15년∼20년미만, 20년∼25년미만, 25년∼30년미만, 30년∼33년미만, 33년이상의 재직년수 구분에 의한 통계임. 2. 2001년도 이후 재직년수 33년은 만33년(396개월) 재직자이며, 33년 초과는 33년1월(397개월)∼33년11월(407개월)까지의 재직자임
