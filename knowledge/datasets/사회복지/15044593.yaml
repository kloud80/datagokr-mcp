summary_user: 경상북도 영주시 관내 공공·민간 노인복지시설을 시설 한 곳당 한 행으로 담은 파일(약 3.8KB 규모의 CSV)로, 시설 구분(양로·요양 등), 시설명, 도로명주소, 연락처, 운영주체를 담는다. 영주시에 사는 어르신이나 가족이 집 근처 요양·양로 시설과 운영주체를 찾거나, 분석가가 영주시 노인복지시설의 유형별·운영주체별 분포를 파악하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·도로명주소를 매칭하거나 같은 영주시 기관 데이터끼리만 이어 쓰며, 건강보험 장기요양기관 목록이나 사회복지시설 시설코드와 연결하려면 이름·주소 매핑이 필요하다.
limits: 시설코드 같은 공통 식별자가 없어 장기요양기관 등 다른 목록과 정확히 조인되지 않고 이름·주소 매칭에 의존해야 한다. 범위는 영주시 한 곳뿐이므로 다른 시군구나 전국 비교에는 다른 지자체 데이터를 따로 모아야 한다.
