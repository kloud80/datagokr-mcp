summary_user: 아이돌봄 행복이음 시스템에서 쓰는 시군구 코드와 센터번호, 시군구명, 자료기준일자를 시군구 단위로 담은 전국 범위의 코드 참조 데이터이다. 아이돌봄 데이터를 다루는 분석가나 개발자가 '이 센터번호·시군구코드가 어느 시군구를 가리키는가'를 확인해 지역별 돌봄 서비스 자료를 정제·분류하는 데 쓴다. 실측 컬럼에 행정표준코드 같은 전역 조인 키는 없어, 같은 기관의 아이돌봄 데이터와는 센터번호(cnterNo)·시군구코드로, 다른 기관 데이터와는 시군구명 매핑으로 잇는다.
limits: 전역 조인 키가 확인되지 않아 법정동·행정동 코드와 바로 맞물린다고 볼 수 없고, 다른 기관 데이터와는 시군구명 매핑을 따로 해야 한다. 개발계정은 일 3,000회 호출 제한이 있다.
