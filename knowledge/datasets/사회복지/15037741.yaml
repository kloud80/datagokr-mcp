summary_user: 경기도 이천시 장애인복지관이 운영하는 복지 프로그램을 프로그램 한 건씩 담은 파일 데이터로, 프로그램명·내용, 이용대상과 장애유형·연령 조건, 이용시간, 이용금액과 산정기준, 부가비용, 주소·위도·경도를 포함한다(CSV 약 46KB). 이천시에 사는 장애인이나 가족이 '우리 아이 장애유형과 나이에 맞는 프로그램이 있고 비용은 얼마인가'를 확인하거나, 분석가가 프로그램 구성과 이용료 수준을 살피는 데 쓴다. 사업자등록번호(bizno)를 키로 다른 시군 장애인복지관 프로그램 데이터나 사업자 정보와 잇고, 주소·좌표로 지도나 접근성 분석에 붙여 쓴다.
limits: 범위는 이천시 한 곳의 복지관 프로그램뿐이라 경기도 전체나 다른 시군과 비교하려면 별도 데이터가 필요하다. 이용 인원이나 실적 같은 운영 결과는 없고 프로그램 안내 정보만 담는다.
