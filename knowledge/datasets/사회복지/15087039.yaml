description_portal: 본 데이터는 인천광역시 미추홀구 내 재난·재해 상황 발생 시 이재민을 임시 보호하기 위해 지정된 ‘이재민 수용 기관 현황’ 정보입니다. 총 50여 개 기관이 포함되어 있으며, 시설 유형은 학교, 교회, 경로당, 연수·숙박 시설 등으로 구성됩니다. 특히 학교 시설이 가장 높은 비중을 차지하고 있으며, 일부 시설은 최대 2,000명 이상 수용 가능한 대형 수용처로 지정되어 있습니다. 각 기관은 주소, 전화번호, 위치좌표(위도·경도)가 기재되어 있어 GIS 기반 재난 대응 지도 구축·위치 탐색에 활용할 수 있습니다. 이 데이터는 재난 발생 시 ▲대피 인원 분산 배치, ▲긴급 생필품 지원 거점 운영, ▲고위험군·노약자 우선 수용 체계 마련 등에 활용됩니다. 다양한 유형별 시설 확보를 통해 미추홀구는 지역 기반의 지속가능한 재난 대응 체계와 커뮤니티 보호 기반 강화를 목표로 하고 있습니다.
