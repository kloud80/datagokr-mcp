description_portal: (데이터 수집목적 및 과정) 경상남도 노인의료복지시설 현황 데이터는 2025년 12월 기준 경상남도 내 위치히는 노인의료복지시설에 대한 정보입니다. 노인복지시설의 위치와 인원 등의 현황을 파악하실 때 활용하실 수 있습니다.(데이터 구성 및 세부항목) 노인의료복지시설 데이터는 시설명, 주소, 연락처, 시설인원으로 구성됩니다. 2025년 12월 말 기준 도내 노인의료복지시설 개소수는 총 280건 입니다.(데이터 현행화 시기) 해당 데이터는 연간 현행화 됩니다. 2025년 12월 기준 데이터로, 2026년 12월 기준 데이터는 2027년 상반기 중으로 업로드 예정입니다.
