summary_user: 경상남도 안에 있는 노인의료복지시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·주소·연락처·시설인원이 들어 있다. 보호자나 지역 돌봄 분석가가 '우리 시군에 노인요양시설이 어디에 몇 곳 있고 정원이 얼마인가'를 확인하거나 시군별 시설 분포를 비교하는 데 쓴다. 전역 조인 키나 시설코드 컬럼은 없어서, 건강보험 장기요양기관 목록이나 지역 통계와는 시설명·주소를 맞추거나 주소에서 시군을 뽑아 연결해야 한다.
limits: 표준 시설코드나 행정코드가 없어 다른 데이터와 붙일 때는 이름·주소 매칭에 의존해야 하고, 그만큼 불일치가 생길 수 있다. 범위는 경상남도 한 곳뿐이며, 시설 단위 현황만 담고 이용자 특성이나 서비스 품질 정보는 없다.
