description_portal: '○ 통계개요* 통계명 : 요보호아동 발생 및 조치현황* 통계종류 : 서울시 요보호아동 발생 및 조치현황을 제공하는 일반ㆍ보고통계* 작성목적 : 요보호아동의 발생유현 및 조치현황을 파악하여 관련정책의 예산 및 각종정책수립을 위한 기초자료 제공하는 것을 목적으로 함* 조사체계 : 시·군·구 → 시도 → 보건복지부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 요보호아동수 및 학대, 부모사망 등의 발생원인과 건강상태, 보호조치(시설보호, 가정보호) 현황 등○ 용어설명* 아동 : 아동복지법 제2조에 의거하여 "아동"은 18세미만의 자를 말함* 요보호아동(보호대상아동) : 보호자가 없거나 보호자로부터 이탈된 아동, 또는보호자가 아동을 학대하는 경우 등 그 보호자가 아동을 양육하기에 적당하지아니하거나 양육 할 능력이 없는 경우의 아동을 말함* 비행·가출·부랑 : 비행청소년으로 법원에서 의뢰하였거나 비행을 할 우려가 있어보호자가 시설에 입소 의뢰한 아동 및 가정의 결손ㆍ결함 등으로 인한 가출또는 부랑 아동 수* 빈곤, 실직 가정 : 저소득층, 빈곤가정의 아동으로 시설에 입소한 아동 수 또는 보호자의학대 및 친권박탈로 보호된 아동* 미혼부(모)의 아동 : 미혼부모, 혼외자 등의 사생아 수* 가정위탁 : 국가의 보호가 필요한 아동발생시 아동을 보호, 양육하기를 희망하는 가정에위탁하여 양육하는 제도'
