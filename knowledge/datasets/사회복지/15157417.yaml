description_portal: 경기도 안성시 관내에 거주하는 저소득층의 인구 현황을 파악하기 위해 작성된 기초 자료이다. 안성시의 사회복지 정책 수립 및 예산 배분의 효율성을 제고하고, 지역 내 복지 사각지대를 해소하기 위한 목적으로 생성되었다. 데이터의 주요 구성 항목으로는 국민기초생활보장법에 따른 기초생활수급자 수, 잠재적 빈곤층인 차상위계층 현황, 그리고 보호가 필요한 한부모가족에 대한 인원 통계가 포함되어 있다. 이를 통해 이용자는 안성시 읍면동 단위의 저소득층 분포 밀도를 분석할 수 있다. 본 통계 자료는 공공기관의 정책 기초 자료로 활용된다.
