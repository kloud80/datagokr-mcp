summary_user: 전라남도(현 전남광주통합특별시) 내 가정폭력·성폭력·성매매 피해자 지원시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설 구분·시설명·주소·연락처를 담는다(약 3KB 규모의 소형 CSV). 피해자나 주변인, 상담·복지 실무자가 '우리 지역에서 연락할 수 있는 성폭력·가정폭력 상담소는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 사회복지시설 목록과는 시설명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '- 전라남도 내 가정폭력, 성폭력, 성매매 피해자 지원시설에 대한 데이터를 제공합니다.- 시설명, 주소, 시설 연락처에 대한 데이터를 제공합니다.- 전라남도에는 성폭력 피해자를 지원하기 위한 다양한 시설들이 운영되고 있습니다. 이들 시설은 피해자의 심리적 회복과 자립을 돕기 위해 상담, 보호, 의료지원 등 다양한 서비스를 제공합니다.- 주요 지원 서비스 : 1. 보호시설(피해자 숙식 제공, 심리 상담 및 치료, 자립 교육 및 취업 정보 제공, 수사 및 재판 과정 지원, 의료기관 연계 및 건강 관리) 2. 상담소(성폭력 피해 신고 접수 및 상담, 보호시설 연계 및 긴급 보호 지원, 의료 지원 및 예방 교육, 수사기관 동행 지원)'
