summary_user: 경기도 시군이 설치한 제설함을 한 건씩 담은 원천 목록으로, 관리번호, 도로명·지번 주소, 위도·경도, 설치장소, 함 규격, 염화칼슘·모래 주머니 수와 양, 관리기관, 데이터 기준일자를 포함한다. 주민이나 도로 안전 담당자가 '우리 동네 빙판길 근처 어디에 제설함이 있고 염화칼슘이 얼마나 비치돼 있나'를 확인하거나, 분석가가 시군 간 제설자재 배치 균형을 비교하는 데 쓴다. 전역 조인 키는 없어서 시군명(sigun_nm)이나 관리기관명으로 이름을 맞추거나 좌표·주소로 다른 공간 데이터와 겹쳐 연결한다.
description_portal: 이 데이터는 경기도 내 각 지자체에서 설치한 제설함의 위치와 관련 자재 배치 현황을 정리한 자료입니다. 제설함의 관리번호, 소재지 주소, 좌표 정보, 제설함 규격, 염화칼슘 및 모래 주머니 수와 배치량, 관리기관, 데이터 기준일자 등의 정보가 포함되어 있습니다. 제설함은 겨울철 눈이나 빙판길 발생 시 도로 안전 확보를 위해 설치되며, 염화칼슘과 모래 등 제설자재를 비치해 시민과 행정기관이 긴급 대응에 활용할 수 있도록 합니다. 이 자료는 도로 위 안전 인프라의 공간적 분포를 파악하고, 지역 간 자재 배치의 균형성 여부를 진단하는 데 유용합니다.
