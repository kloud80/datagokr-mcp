summary_user: 세종특별자치시에 있는 사회적협동조합·일반협동조합·마을기업·사회적기업·예비사회적기업을 기업 한 곳당 한 행으로 담은 현황 목록(CSV, 약 50KB)으로, 유형·소재 읍면동·기업명·전화번호·주소·인증(설립)일자·주요 사업을 담는다. 세종시에서 활동하는 사회적경제 기업을 동네나 업종(교육서비스, 돌봄·상담, 식품제조·유통 등)별로 찾거나, 연락처를 확인하거나, 유형별 분포를 보려는 주민·지원기관·분석가가 쓴다. 인증번호나 사업자등록번호 같은 공통 조인 키가 없어 다른 데이터와 이으려면 기업명이나 주소를 맞춰 보거나 소재지(읍면동) 이름으로 묶어야 한다.
