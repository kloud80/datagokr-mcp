summary_user: 성남시 청소년수련시설·문화의집 등 청소년시설을 시설 1곳당 한 행으로 정리한 목록으로, 명칭·운영단체·위치·부지면적·건물연면적·주요시설을 담는 3KB 남짓의 작은 CSV 파일이다. 성남시 청소년이나 학부모가 집 근처 청소년시설이 어디에 있고 누가 운영하며 어떤 시설을 갖췄는지 확인할 때 쓰고, 분석가는 시설 규모(부지·연면적)를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설 명칭이나 위치(주소)로 맞춰 이어야 하며, 시군구 단위 지역 통계와 연계할 때는 성남시 단위로 붙인다.
limits: 시설 코드 같은 공통 키가 없어 다른 청소년시설 데이터와의 연결은 명칭·주소 매칭에 의존한다. 범위는 성남시 한 곳뿐이고 좌표가 없는 비공간 목록이라, 다른 시군구와 비교하거나 지도에 바로 올리려면 별도 자료와 주소 변환이 필요하다.
