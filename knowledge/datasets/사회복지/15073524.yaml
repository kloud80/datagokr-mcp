summary_user: 경기도 시군별 행복마을관리소가 기준 연·월마다 수행한 활동 건수를 관리소 단위로 집계한 자료로, 여성 안심귀가·아동 등하교·지역순찰·쓰레기 투기 계도·불법광고물 제거·취약계층 집수리·홀몸노인 돌봄·생활공구 대여 등 항목별 건수와 주소·위경도 좌표를 담는다. 지자체 담당자나 분석가가 "우리 시군 관리소는 어떤 생활서비스를 얼마나 제공하고 있고, 순찰·돌봄 활동이 많은 곳은 어디인가"를 비교·모니터링하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 시군명(sigun_nm)·관리소명 같은 이름 매핑이나 주소·좌표로만 다른 지역 통계와 이어 쓰며, 사회적경제 기업 데이터와 연결할 인증번호·사업자번호는 없다.
description_portal: 이 데이터는 경기도 내 각 시군의 "행복마을관리소"에서 수행한 활동 내역을 집계한 자료로, 다양한 생활밀착형 공공서비스 제공 현황을 담고 있습니다. 주요 항목은 "여성귀가서비스", "아동등하교", "지역순찰활동", "쓰레기투기계도", "불법광고물제거", "생활공구대여", "취약계층 간단집수리", "홀몸노인돌봄" 등으로 구성되어 있으며, 관리소별 활동 건수와 주소, 위치 좌표도 포함되어 있습니다. 해당 데이터는 지역사회의 안전과 복지를 위한 서비스 활용도 분석, 공공정책 수립 및 모니터링, 그리고 시민참여 기반 행정 서비스 개선 자료로 유용하게 활용될 수 있습니다. 특히 다양한 지역 특색사업 항목과 활동의 세분화는 정책적 맞춤형 대응에 중요한 참고 자료가 됩니다.
