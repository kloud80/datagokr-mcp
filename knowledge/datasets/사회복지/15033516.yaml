summary_user: 광주 서구 관내 경로당을 한 곳당 한 행으로 담은 파일로, 행정동·경로당명·주소·면적·회원수·주택유형·소유구분·설치일자를 담는다(시군구 범위, 개별 주소 단위). 노인복지 담당자나 주민이 '우리 동에 경로당이 몇 곳이고 어디에 있는지, 오래된 시설은 어디인지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설 자료와는 경로당명·주소나 행정동 이름을 맞춰 잇고, 지역 통계와는 행정동·시군구 단위로 연계한다.
limits: 전역 조인 키가 없어 다른 데이터와 연결하려면 이름·주소 매핑이 필요하다. 범위가 서구 한 곳이라 다른 자치구나 시 전체 비교에는 따로 자료를 모아야 한다. 좌표 필드가 없어 지도에 올리려면 주소 지오코딩이 필요하다.
