summary_user: 경상북도 영주시 안에서 운영 중인 노인교실과 노인대학을 시설 한 곳당 한 건으로 담는다. 등록번호, 시설명, 대표자, 도로명주소, 전화번호가 들어 있다. 주민이나 가족은 "우리 동네 가까운 노인대학이 어디이고 연락처는 무엇인가"를 찾는 데 쓰고, 분석가는 읍·면·동별 노인 교육시설 분포를 비교하는 데 쓴다. 전역 조인 키가 없어서 다른 노인복지시설·장기요양기관 데이터와 잇거나 지역 통계(regional-statistics)와 맞추려면 도로명주소나 시설명을 대조해야 한다.
limits: 영주시 한 곳의 시설 목록이라 다른 시군과 바로 비교할 수 없다. 공통 시설코드가 없어 다른 데이터와 붙일 때는 주소·이름을 맞춰 보는 수작업이 필요하다. 호출에는 포털에서 발급받은 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
