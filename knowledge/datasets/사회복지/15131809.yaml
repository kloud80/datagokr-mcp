summary_user: 국가화재정보시스템에서 뽑은 화재 인명피해 중 시각·청각·지체장애인 사상자를 사상자 한 명 단위로 담은 전국 범위 파일로, 화재발생일·관할 소방서·시군구·읍면동, 나이·성별, 사상 원인·위치·행동, 부상 부위·화상 정도, 발화 장소·요인, 이동성·독거노인 여부를 담는다. 소방·복지 분석가가 장애인 화재 사상자가 어떤 장소와 원인에서 많이 발생하는지, 대피 중이었는지 같은 질문을 따져 장애인 화재안전 대책을 세우는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구·읍면동 이름이나 소방서 이름을 맞춰 연결해야 한다.
