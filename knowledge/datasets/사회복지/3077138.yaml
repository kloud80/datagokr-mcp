summary_user: 공무원 맞춤형복지 제휴신용카드(삼성카드)의 업종별(교육·가족식사·의료·유통 등) 이용 비율을 연도말 기준으로 전체·성별·연령대별로 나눈 집계 통계 파일로, 1,778바이트 규모의 작은 전국 단위 표다. 공무원 복지 정책 담당자나 분석가가 '20대 이하 공무원과 50대 공무원은 복지카드를 어떤 업종에 더 많이 쓰는가' 같은 연령·성별 소비 경향 비교에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업종명(구분)이나 같은 기관의 다른 직역연금 통계와 이름으로 맞춰 이어 써야 한다.
description_portal: '공무원연금공단에서 관리하는 공무원 맞춤형복지 제휴신용카드(삼성카드) 이용정보 통계 파일입니다. 각 연도말 기준으로 공무원들의 맞춤형복지카드 사용 현황을 성별(남성, 여성) 및 연령별(20대 이하, 30대, 40대, 50대, 60대 이상)로 세분화하여 보여줍니다.주요 소비 업종(예: 교육, 가족식사, 의료, 유통)별로 전체 이용 비율을 포함한 상세한 사용 비율 데이터를 제공하며, 공무원 복지 정책 수립 및 연령대별 소비경향 분석, 성별 소비 패턴 비교 등 공공데이터 활용에 기여할 수 있도록 구성되었습니다.'
