summary_user: 완료된 회계연도 기준으로 전국 협동조합의 경영공시 내용을 조합 한 곳당 한 행씩 담은 파일로, 조합명·공시년도·공시상태·주소·조합원 수·비조합원 직원 수·자산·조합원 출자금·지역·소관부처를 담는다. 정책 분석가나 연구자가 "지역별·소관부처별로 협동조합의 조합원 규모와 출자금·자산이 어떻게 분포하는가"를 살피거나, 특정 협동조합의 공시 이행 여부를 확인하는 데 쓴다. 공통 조인 키(사업자번호·인가번호 등)가 없어 다른 사회적경제 기업 데이터와는 협동조합명이나 주소 문자열로 맞춰 이어야 한다.
description_portal: 협동조합 경영공시 관련 정보를 제공합니다. 연도별 자료 제공, 현재 제출중인 협동조합 경영공시를 확인하기 위해서는 협동조합 홍보포탈 경영공시 자료를 이용 부탁드리겠습니다. 이 데이터 목록의 자료는 완료된 회계연도 경영공시 관련 정보를 제공합니다.협동조합명, 공시상태, 기본주소, 상세주소, 연락처(사무실), 조합원 수 직원, 자산, 조합원 출자금, 지역, 소관부처 데이터를 제공합니다.데이터에 관련하여 문의사항이 있으시거나 칼럼추가등 요청은 한국사회적기업진흥원 정보화기획팀으로 연락 부탁드리겠습니다. 감사합니다.
