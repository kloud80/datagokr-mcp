description_portal: 아이돌봄 정기서비스를 이용을 희망하는 가정에서, 당장 정기서비스 배정이 가능한 아이돌보미가 없는 경우, 대기신청을 해야함. 이와 관련하여 아이돌봄서비스 대기가점 자격요건(기초생활보장법상 수급자 및 차상위계층자녀, 한부모가족지원법상 대상자의 자녀, 장애부모 가정, 장애의 정도가 심한 형제 자매가 있는 아동, 맞벌이 가정, 다문화가족의 자녀, 다자녀 가정의 자녀, 국가유공자 등 예우 및 지원에 관한 법률 시행령상 상이등급 1~3급 해당 가정의 자녀, 청소년복지 지원법상 청소년 부모의 자녀, 일정기간 이상 아이돌봄서비스 대기신청한 가정 등) 및 각 자격요건 별 부여되는 가점 안내
