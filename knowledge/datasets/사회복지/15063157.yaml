summary_user: 아이돌봄 정기서비스 대기신청 때 적용하는 가점 자격요건(수급자·차상위, 한부모, 장애부모, 맞벌이, 다문화, 다자녀, 청소년 부모, 장기 대기 등)과 요건별 가점을 기준년도·기준구분별로 정리한 전국 단위 기준표로, 1.5KB 남짓의 작은 CSV 파일이다. 아이돌봄 정기서비스를 기다리는 부모가 '우리 집은 맞벌이·다자녀라 대기 순위에서 몇 점을 더 받는가'를 확인하거나, 분석가가 돌봄 우선순위 정책을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준구분·기준내용 같은 이름 매칭이나 같은 기관(한국건강가정진흥원) 자료끼리만 이어 쓴다.
