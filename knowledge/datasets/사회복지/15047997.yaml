summary_user: 부산 기장군 관내 장애인 복지시설을 시설 1곳당 한 행으로 담은 소규모 원천 목록(CSV 약 2KB)으로, 시설유형·시설명·도로명/지번 주소·위도·경도·전화번호·정원·데이터기준일자를 포함한다. 기장군 주민이나 보호자가 집 근처의 장애인 거주시설·주간보호센터·직업재활시설이 어디 있고 정원이 몇 명인지 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 매칭이나 위도·경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: '기장군 관내 장애인 복지시설 현황 데이터입니다.  이 데이터는 장애인을 위한 복지시설의 종류와 수 지역분포 등 을 포함한  자료로 복지서비스 기초 정보로 활용 가능합니다.1. 시설현황  : 10개소(중증거주시설 4개소,장애인공동생활가정 1개소, 지역사회재활시설 3개소, 직업재활시설2개소)2. 시  설  명  - 중증거주시설(성우해피홈(장안읍/정원 30명), 대성한울타리(일광면/정원30명), 반석송하원(장안읍/정원30명), 해피스쿨(정관읍/정원38명))  - 장애인공동생활가정(), 늘채움공동생활가정(기장읍)), ※ 천사들의 집 (철마면)폐쇄(24.10월), 기장홈(기장읍) 폐쇄(2026.2월)  -직업재활시설(동행과나눔(장안읍), 공존직업재활센터(정관읍))  - 지역사회재활시설(기장장애인복지관(정관읍), 기장장애인부설주간보호센터(정관읍), 교리장애인주간보호센터(기장읍))3. 기타사항 : 장애인복지시설 25년도 기준 11개소였으나, 1개소(공동생활가정 기장홈 )26.2월 폐쇄로 총 10개소4. 자세한 사항을 군 청홈페이지(https://www.gijang.go.kr)  및 해당 시설 홈페이지 참조'
