summary_user: 경기도 내 특수학교·특수학급의 보조인력 운영 현황을 연도(STD_YY)와 학교 유형별로 집계한 자료로, 총 보조인력 수와 유급(국고·지방비, 자치단체, 기타), 무급(자원봉사자, 기타), 공공근로, 사회복무요원 인원을 구분해 담는다. 교육 행정 담당자나 분석가가 '경기도 특수교육 보조인력 중 유급과 무급, 사회복무요원 비중이 해마다 어떻게 바뀌었나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·학교 유형 이름을 맞춰 연결해야 하며, 사회적경제 부문의 인증번호·사업자번호 같은 기업 축과 직접 이어지는 키도 없다.
description_portal: 이 데이터는 교육부 특수교육통계를 바탕으로 경기도 내 특수학교 및 특수학급의 보조인력 운영 현황을 연도별로 집계한 자료입니다. 매년 6월 말 기준으로 수집되며, 학교 유형별로 총 보조인력 수를 포함해 유급 인력(국고 및 지방비 지원 인력, 자치단체 인력, 기타 유급 인력), 무급 인력(자원봉사자, 기타 무급 인력), 공공근로 인력, 사회복무요원 등의 구분된 항목으로 제공됩니다. 해당 데이터는 특수교육 현장에서 필요한 인력 자원의 구성과 운영방식, 재원에 따른 인력 분포를 분석하는 데 활용될 수 있으며, 교육 행정, 인력 배치 정책 수립, 예산 집행의 근거자료로도 사용될 수 있습니다.
