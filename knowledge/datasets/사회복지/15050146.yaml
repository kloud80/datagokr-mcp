summary_user: 노인일자리사업 계획서별로 편성된 재정(예산) 정보를 사업 단위로 담은 전국 시군구 범위의 CSV 파일로, 사업유형(공익활동형·사회서비스형·시장형 등), 사업번호, 사업명, 예산구분, 관할 시군구, 수행기관 ID, 사업기간, 추경 여부 등을 담는다. 지자체 담당자나 정책 연구자가 '우리 시군구에는 어떤 유형의 노인일자리 사업이 몇 건 편성됐고 추경으로 바뀐 사업은 무엇인가'를 확인하고 지역별·유형별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관할 시군구 이름이나 같은 기관의 기관 ID로만 이어 쓰며, 시군구 단위 지역 통계와 붙여 보는 정도가 현실적이다.
limits: 표준 행정코드나 사회복지시설 시설코드 같은 전역 조인 키가 없어 다른 기관 데이터와 결합하려면 시군구 이름 매핑이 필요하다. 계획서 단위의 편성 정보이므로 사업계획변경순번·추경여부·삭제여부를 함께 보고 최종 계획만 골라야 중복 집계를 피한다.
