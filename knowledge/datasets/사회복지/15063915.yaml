summary_user: 서울특별시 동작구 관내 어린이집을 한 곳당 한 행으로 담은 현황 파일(csv, 약 29KB)로, 행정동·주소·전화번호·어린이집 유형·정부지원 여부와 일반·영아전담·장애아·방과후·휴일·24시간·시간제 등 제공 보육 서비스 구분, 기준일자를 담는다. 동작구에 사는 부모가 우리 동네에서 영아전담이나 시간제·휴일 보육을 하는 어린이집이 어디 있는지 찾거나, 분석가가 행정동별 어린이집 유형 분포를 볼 때 쓴다. 어린이집코드 같은 전역 조인 키가 없어 다른 어린이집 데이터(평가·보육료 공시·입소 대기 등)와는 어린이집명·주소 매칭이나 시군구·행정동 이름으로만 이어 쓴다.
