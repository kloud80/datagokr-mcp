summary_user: 경상북도 관내 여성새로일하기센터(새일센터)를 센터 한 곳당 한 행으로 정리한 시설 현황 파일로, 지정기관·운영 주체·지정시기·센터장·인력·시설 규모·주요시설·2021년도 예산(백만원)·주소·연락처를 담으며 파일 크기는 약 1.4KB로 작다. 경력단절 여성이 우리 시군에서 가까운 새일센터와 연락처를 찾거나, 분석가가 센터별 인력·예산 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 센터명·주소 같은 이름 매칭이나 같은 기관 자료끼리만 연결하며, 사회복지시설 공통 마스터를 참조할 때 보조 자료로 쓴다.
description_portal: 경상북도 관내에서 경력단절 여성 등의 경제활동 촉진을 위해 지정된 여성새로일하기센터의 종합적인 운영 현황을 제공하는 데이터입니다. 본 자료는 각 센터의 접근성을 높이기 위해 정확한 주소와 연락처, 지정 기관 및 센터장 정보를 핵심적으로 포함하고 있습니다. 또한, 센터의 운영 규모와 지원 역량을 파악할 수 있도록 조직 내 인력 현황과 시설 규모(면적), 주요 보유 시설 및 연간 예산 집행 규모(백만원) 통계를 상세히 수록하고 있습니다. 해당 데이터는 여성 고용 활성화 정책 수립 및 맞춤형 취업 지원 서비스 제공을 위한 행정 기초 자료로 활용됩니다.
