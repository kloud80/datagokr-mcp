summary_user: 아이돌보미 보수교육의 과정 정보를 기준연도별로 교육구분, 교육과정명, 교육내용 단위로 담은 전국 범위의 목록형 API 데이터입니다. 정책 담당자나 연구자가 "올해 아이돌보미 보수교육은 어떤 구분과 과정으로 구성되고 각 과정에서 무엇을 가르치는가"를 확인하거나 연도별 커리큘럼 변화를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 교육과정명 같은 이름 매칭, 또는 같은 기관(한국건강가정진흥원)의 다른 아이돌봄 데이터와 연도 기준으로만 이어 쓴다.
limits: 지역·기관 단위 구분이 없는 전국·비공간 데이터라 교육이 어디서 몇 명에게 운영됐는지는 알 수 없다. 공통 코드나 키가 없어 다른 데이터와 정확히 조인하기 어렵다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
