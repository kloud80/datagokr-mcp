summary_user: 경기도 내 통합학급(일반학급 배치)을 운영하는 학교 수를 기준연도(STD_YY)와 국·공·사립 학교유형별로 묶어, 전체 학교 수와 유치원·초등학교·중학교·고등학교별 학교 수로 담은 시도 단위 집계 자료입니다. 교육정책 분석가나 특수교육 관계자가 '경기도에서 통합학급을 운영하는 학교가 학교급별·설립유형별로 얼마나 되는가'를 연도별로 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 특수학급·학생 수 통계와는 기준연도와 학교유형 이름을 맞춰 연결해야 합니다.
description_portal: 이 데이터는 경기도 내 일반학급 배치(전일제 통합학급) 학교 수를 학교유형별(국·공·사립)과 학교과정별(유치원, 초등학교, 중학교, 고등학교)로 구분하여 집계한 현황입니다. 매년 6월 말 기준으로 작성되며, 전체 학교 수와 함께 유치원, 초등학교, 중학교, 고등학교에 통합학급을 운영하는 학교 수가 제공됩니다.‘통합학급’은 일반학생과 특수교육대상자가 함께 수업을 받는 학급으로, 해당 데이터를 통해 통합학급이 설치된 학교의 분포를 확인할 수 있습니다. 예를 들어, 초등학교에서 통합학급을 운영하는 비율이 상대적으로 높을 수 있으며, 고등학교에서는 제한적일 수 있습니다.이 자료는 통합교육의 보급 정도와 학교급별 차이를 파악하는 데 활용되며, 향후 통합학급 확대 정책, 교원 배치 계획, 특수교육 지원 자원 분배 등의 정책적 근거자료로 쓰일 수 있습니다. 또한 특수학급 운영 현황, 학생 수 데이터와 연계하여 학교 단위의 통합교육 인프라 현황을 종합적으로 분석할 수 있습니다.
