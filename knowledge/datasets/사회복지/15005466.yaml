description_portal: 부산 광역시 동래구 사회복지법인 현황에 관한 데이터로 연번, 법인명, 대표자, 소재지, 전화번호 등의 정보를 제공합니다. 사회복지법인이랑 사회복지사업법 제2조의 사회복지사업을 행할 목적으로 설립된 법인을 의미합니다. 사회복지법인이 수행할 수 있는 목적사업은 사회복지사업에 한정되므로 사회복지사업 이외의 사업을 목적사업으로 수행할 수 없습니다. 또한 법인은 법률의 규정에 의해서만 성립되므로(민법 제31조), 사회복지법인도 사회복지사업법에 따라서만 성립됩니다. 사회복지사업은 보호, 선도 또는 복지에 관한 사업과 사회복지상담, 직업지원, 무료숙박, 지역사회복지, 의료복지, 재가복지, 사회복지관 운영, 정신질환자 및 한센병력자 사회복지에 관한 사업 등 각종 복지사업과 이에 관련된 자원봉사활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업을 말합니다.
