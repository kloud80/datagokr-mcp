summary_user: 사학연금공단 재해보상기금의 조성 규모(백만원)와 전년 대비 증가율(%)을 연도별로 담은 소규모 집계 파일로, 전국 단위·비공간 자료입니다. 연금 수급자·재직 교직원이나 분석가가 "재해보상기금이 해마다 얼마나 늘었고 증가세가 둔화되고 있는가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 사학연금 기금 운용 자료와는 연도(구분)를 기준으로 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '사립학교교직원연금공단 재해보상기금 조성 현황과 관련된 데이터로 연도, 재해보상기금, 증가율 등의 항목을 연도별로 제공합니다. (단위 : 백만원, %)이 데이터를 통해 공단의 재정 운용 투명성을 제고하고 기금의 건전성을 공개적으로 보여주고자 합니다.또한 재해보상기금의 안정적인 관리를 위한 분석 및 정책 수립의 기초자료로 활용될 수 있습니다. 본데이터는 공공기관의 책임 있는 기금운용을 입증하고 연금 수급자 및 재직자 등 이해관계자들이 기금 재무 건전성을 명확히 파악할 수 있도록 지원합니다.'
