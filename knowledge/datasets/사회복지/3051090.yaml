summary_user: 장애인일자리사업을 수행하는 기관을 한 행에 한 건씩 담은 파일로, 지역·기관유형·기관명·일자리유형(일반형·복지·특화형 등)을 전국 범위로 제공한다(CSV 약 86KB). 장애인 구직자나 가족이 "우리 지역에서 복지일자리나 시각장애인안마사파견 같은 사업을 하는 기관이 어디인가"를 찾을 때, 또는 분석가가 지역별 수행기관 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 기관 데이터와는 기관명·지역명을 맞춰서만 이을 수 있다.
description_portal: 장애인일자리사업은 장애인복지법 제21조(직업), 장애인복지법시행령 제13조의2(장애인일자리사업 실시)에 근거하여, 취업취약계층인 장애인에게 사회참여 확대 및 소득보장 지원을 위해 일자리를 제공하는 사업으로 보건복지부에서 실시하는 재정지원 일자리사업입니다.장애인일자리사업 유형은 일반형일자리(전일제/시간제), 복지일자리(참여형/특수교육-복지연계형), 특화형 일자리(시각장애인안마사파견사업/발달장애인 요양보호사 보조일자리)로 구분하고 있으며사업수행은 시․도 또는 시․군․구청이 직접 수행 또는 민간위탁사업 수행기관에서 수행이 가능합니다.장애인일자리 사업을 수행하는 기관 정보에 대한  데이터파일로 지역명, 기관유형, 기관명칭, 사업유형을 제공합니다.
