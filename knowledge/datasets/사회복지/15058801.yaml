summary_user: 경기도 내 청소년상담복지센터를 센터 한 곳당 한 행으로 담은 목록으로, 시군명, 운영단체명, 전화·팩스, 홈페이지, 도로명·지번 주소, 우편번호, 위도·경도를 포함한다. 보호자나 청소년이 우리 시군의 상담복지센터 연락처와 위치를 찾을 때, 분석가가 시군별 센터 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 실측되지 않아 시군명·시군코드(SIGUN_CD)를 기준으로 경기도 다른 시군 단위 자료나 지역 통계와 이름·코드 매핑으로 잇고, 좌표로는 다른 시설 위치와 공간 결합한다.
description_portal: 이 데이터는 경기도 내 청소년의 정서적 안정과 복지 지원을 위해 설치된 청소년상담복지센터의 운영 현황을 수록한 자료입니다. 각 센터의 시군명, 운영단체명, 전화번호, 팩스번호, 홈페이지 주소, 소재지 주소(도로명 및 지번), 우편번호, 위도·경도 정보가 포함됩니다. 청소년상담복지센터는 심리상담, 위기개입, 정서지원, 복지연계 등 다양한 기능을 수행하는 기관으로, 위기 청소년의 사회 복귀와 정서적 회복을 돕습니다. 본 데이터는 정책 수립, 센터 접근성 분석, 청소년 복지 자원 분포 파악 등에 활용될 수 있으며, 연 1회 갱신되며 상업적 활용과 콘텐츠 변경이 가능합니다.
