summary_user: 경기도 내 장애인공동생활가정을 시설 한 곳당 한 행으로 담은 원천 목록으로, 시군명·시설명·인허가일자·영업상태·폐업일자·정원·자격보유 인원·총 인원·지번/도로명 주소·위경도 좌표를 포함한다. 분석가나 지자체 담당자가 '우리 시군에 운영 중인 장애인공동생활가정이 몇 곳이고 정원과 종사자 수는 어느 정도인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소·좌표를 매핑해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장애인공동생활가정의 운영 현황을 정리한 자료로, 각 시설의 인허가일자, 운영 여부, 정원, 인력 보유 현황, 소재지 주소 및 좌표 정보를 포함하고 있습니다. 장애인공동생활가정은 중증장애인을 위한 소규모 주거복지시설로, 가족과 같은 환경에서 일상생활을 지원하며 지역사회 내 자립을 도모하는 목적을 가지고 운영됩니다. 본 자료는 각 시군별로 운영 중인 시설들의 분포와 정원 규모, 종사자 수 등을 파악할 수 있습니다. 이 데이터는 장애인 주거복지 정책 수립, 지역별 소규모 시설 공급 적정성 평가, 사회통합형 복지시설 확산 전략 마련 등에 활용될 수 있습니다.
