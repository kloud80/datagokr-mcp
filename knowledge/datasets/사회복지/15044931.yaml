summary_user: 서귀포시 관내 청소년문화의집을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·위치·전화번호·세부시설(부대시설)과 위도·경도를 포함하며 파일 크기는 약 4.5KB로 작다. 서귀포시 주민이나 학부모가 '우리 동네 가까운 청소년문화의집은 어디이고 연습실·북카페 같은 시설이 있는가'를 찾을 때, 분석가가 시 안의 청소년 문화시설 분포와 접근성을 지도로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명 매칭이나 위도·경도 기반 공간 결합으로 잇고, 시군구 단위 지역 통계와는 서귀포시라는 행정구역 기준으로만 연결한다.
limits: 행정코드나 시설 고유번호 같은 공통 키가 없어 다른 청소년시설 목록과 정확히 맞추려면 이름·주소를 직접 대조해야 한다. 서귀포시 한 곳의 시설만 담고 있어 제주시나 다른 지역과는 비교할 수 없다. 이용 인원·프로그램 실적은 없고 시설 현황만 담는다.
