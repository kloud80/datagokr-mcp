summary_user: 경기도 내 다문화가족지원센터를 센터 1곳당 1행으로 담은 현황 목록으로, 시군명·시군코드, 기관 형태, 대표자·센터장, 연락처, 개소연도, 지번·도로명 주소와 위경도 좌표가 들어 있다. 결혼이민자 가족이나 지원 실무자가 '우리 시군에서 가장 가까운 다문화가족지원센터는 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 시군별 센터 분포와 접근성을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 주소·좌표로 맞춰 이어 쓰며, 사회복지시설 공통 마스터를 참조해 함께 본다.
description_portal: 이 데이터는 경기도 내 다문화가족을 위한 가족지원센터 운영 현황을 정리한 자료로, 센터의 명칭, 개소연도, 연락처, 위치 정보, 기관 형태 등이 포함되어 있습니다. 다문화가족지원센터는 결혼이민자, 중도입국자녀, 다문화배경 가족 등을 대상으로 한국어 교육, 통번역 지원, 자녀교육, 가족상담 등 다양한 통합지원 서비스를 제공하는 기관입니다. 이 자료는 지역별 다문화가족 분포 분석, 서비스 접근성 개선, 사회통합 프로그램 운영 실태 파악 등에 활용될 수 있습니다. 특히 다문화 정책 수립, 외국인 주민 정착 지원, 지역 간 서비스 격차 해소를 위한 기반 자료로 유용하게 사용됩니다.
