description_portal: 본 자료는 대한민국 경기도 부천시의 옛 행정구역인 원미구·소사구·오정구 내 공공기관을 대상으로 한 장애인 전용 주차면 현황 데이터셋입니다. 각 행에는 기관명, 기관 소재지의 도로명주소와 지번주소, 장애인전용 주차면수(확보·운영 기준에 따른 수량), 기관 전화번호, 비고(출입 동선, 경사로 유무, 공사 예정, 임시폐쇄 등 특이사항)가 포함됩니다. 행정 점검, 접근성 개선 계획 수립, 민원 대응, 정보공개, 지자체 보고서 작성 및 지도 시각화에 활용할 수 있으며, 정기점검 결과·증빙사진 링크·최종 갱신일 컬럼을 추가하면 유지·관리 효율이 높아집니다. 데이터 형식은 엑셀/CSV를 권장하고, 주소 표준화와 기관 분류(청사, 주민센터, 복지관 등) 코드화를 통해 검색성과 비교 가능성이 향상됩니다.
