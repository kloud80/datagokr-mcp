summary_user: 경기도 워라밸링크 플랫폼에 등록된 가사·돌봄 등 생활지원 서비스 제공 센터를 한 행에 한 곳씩 담으며, 고유번호·서비스 유형·센터명·시군을 수록한 기관 목록이다. 경기도 주민이 자기 시군에서 이용할 수 있는 생활지원 서비스센터가 어디인지 찾거나, 지자체 분석가가 시군별 센터 분포와 공백 지역을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(si_nm)이나 센터명 매핑으로만 이어 쓰고, 사회적경제 기업 데이터와 맞추려면 인증번호·사업자번호 같은 기업 축 키를 따로 확보해야 한다.
description_portal: 경기도워라밸링크_서비스센터 데이터는 경기도에서 운영하는 ‘워라밸링크’ 플랫폼 내 생활지원 서비스 제공 기관 정보를 수록한 자료입니다. 주요 항목으로는 번호, 고유번호, 서비스 유형, 센터명, 시/군이 있으며, 가사·돌봄 등 생활지원 분야별 서비스센터의 명칭과 위치한 지역 정보를 제공합니다. 이를 통해 주민은 거주지 인근의 생활지원 서비스를 쉽게 확인하고, 필요 시 해당 기관을 선택하여 이용할 수 있습니다. 지자체는 데이터 활용을 통해 서비스 제공 기관의 분포 현황을 파악하고, 생활지원 수요가 높은 지역을 분석하여 정책 개선이나 신규 센터 설립 근거 자료로 활용할 수 있습니다.
