summary_user: 공무원연금 수급자 인원수를 전국 시군구 단위로 성별(남·여)로 나눠 집계한 파일로, 지역명·우편번호 앞 3자리·성별·인원수를 담는다. 지자체 복지·노인정책 담당자나 분석가가 '우리 시군구에 공무원연금 수급자가 얼마나 몰려 있고 남녀 비율은 어떤가'를 보고, 지역 간 격차를 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 시군구 통계와 붙이려면 지역명이나 우편번호 3자리를 행정구역 코드에 직접 매핑해야 한다.
limits: 표준 행정구역 코드 같은 공통 키가 없어 다른 데이터와는 이름·우편번호 매핑으로만 연결된다. 개인별 원천 자료가 아닌 시군구·성별 인원 집계라서 연령·연금 종류·지급액은 알 수 없다.
