description_portal: 공무원연금공단에서 제공하는 지역별·시군구별·성별 연금수급자 인원수에 대한 기준년도의 데이터입니다. 해당 자료는 광역자치단체(시·도) 및 시군구 단위로 연금 수급자의 분포를 구체적으로 파악할 수 있도록 구성되어 있으며, 지역명, 우편번호 3자리, 성별(남·여), 연금수급자 인원수가 포함되어 있습니다. 본 데이터는 세부 행정구역 단위로 연금 수급자의 규모를 분석할 수 있어, 특정 지역 내 연금 수급자의 집중도, 성별 분포 특성, 지역 간 격차 등을 종합적으로 진단하는 데 유용합니다.우편번호를 통해 시군구 단위를 확인할 수 있습니다.
