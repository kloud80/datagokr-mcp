summary_user: 한국청소년상담복지개발원의 청소년 상담 문제 유형 분류 체계를 코드 단위로 담은 전국·비공간 코드표로, 분류코드·분류명·분류레벨·상위분류코드로 계층 구조를 표현한다. 상담 사례를 유형별로 분류하거나 '가출·학업·대인관계 같은 상담 유형이 어떤 상위 범주에 속하는가'를 확인해 통계 비교를 하려는 상담기관·분석가가 쓴다. 다른 데이터셋과 이을 전역 조인 키는 없고, 상담 실적 등 같은 기관 데이터에 분류코드(clsfCd)나 분류명을 매핑해 쓰며, 상위분류코드(upClsfCd)로 자기 참조해 계층을 펼친다.
limits: 분류 체계 코드표일 뿐 상담 건수나 지역별 실적은 담지 않으며, 행정구역 단위가 없어 지역 통계와 직접 연결되지 않는다. 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
