summary_user: 경상남도 남해군 안의 장애인복지시설을 시설 한 곳당 한 행으로 담은 작은 목록 파일(csv, 약 1.5KB)로, 시설명·소재지 주소·위탁 운영단체·연락처·시설 종류·주관부서를 담는다. 남해군에 사는 장애인 당사자나 가족이 "집 근처에 어떤 장애인복지시설이 있고 어디에 연락하면 되나"를 확인하거나, 복지 담당자가 군내 시설 분포와 위탁 운영 현황을 정리할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시설명이나 소재지 주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 경상남도 남해군 내 장애인복지시설의 현황을 체계적으로 제공합니다. 시설명, 소재지, 운영을 위탁받은 업체, 연락처, 제공 서비스(시설), 주관 부서 등 주요 정보를 항목별로 확인할 수 있어, 장애인 당사자와 가족, 복지 담당자, 사회복지 관련 종사자 모두가 쉽고 편리하게 활용할 수 있습니다. 시민들은 필요한 복지시설을 빠르게 찾을 수 있고, 공공기관에서는 정책 수립과 맞춤형 복지 서비스 지원에 근거 자료로 삼을 수 있습니다. 또한 개발자와 연구자는 위치기반 서비스, 복지 정보 지도, 시설 이용률 분석 등 다양한 공공서비스 자료로 연계해 활용할 수 있습니다. 단, 시설 운영 현황이나 서비스 내용, 위탁업체의 변동 가능성이 있으므로 실시간 현장 정보와는 차이가 있을 수 있습니다.
