summary_user: 부산진구 관내 동별로 독거노인 수를 연령대(65~79세, 80세 이상), 성별, 국민기초생활수급자·일반 독거노인·저소득 노인 구분으로 나눠 담은 집계 파일입니다(CSV 약 1KB). 구청 복지 담당자나 지역 복지기관이 '부산진구에서 80세 이상·저소득 독거노인이 많은 동은 어디인가'를 보고 돌봄·방문 서비스 대상 지역을 고를 때 쓴다. 전역 조인 키나 행정동 코드가 없어 동 이름(해당동)으로 다른 동별 인구·노인복지시설 자료와 맞춰 잇거나, 시군구 단위로 묶어 부산진구 인구·시설 통계와 연결한다.
limits: 실측 컬럼에 행정동 코드 같은 표준 조인 키가 없어 동 이름 매핑으로만 연결되며, 동 명칭이 바뀌거나 표기가 다르면 맞춰지지 않는다. 범위는 부산진구 한 곳이고 좌표가 없는 비공간 집계라 개인별 정보나 지도 위 위치 분석에는 쓰지 못한다.
