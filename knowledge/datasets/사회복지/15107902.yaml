summary_user: 경기도 내 결식아동 등에게 무료 또는 할인 혜택을 주는 '선한영향력가게'를 가게 한 곳당 한 행으로 담은 목록으로, 상호·업종·시군·영업시간·제공품목·제공대상·주소·위경도를 포함한다. 급식카드를 가진 아동이나 보호자가 "우리 동네에서 혜택을 주는 가게가 어디인지"를 찾을 때 쓰고, 행정 담당자가 시군별 분포와 수혜자 접근성을 볼 때에도 쓴다. 실측 결과 전역 조인 키가 없어 다른 데이터와는 시군명·주소 같은 이름 매핑으로 잇는다. 사업자등록번호(BIZREGNO)가 들어 있으면 이를 기준으로 기업 축 데이터와도 맞춰 볼 수 있다.
description_portal: 선한 영향력 가게에서 제공하는 경기도 내 선한 영향력 가게 목록입니다. 선한 영향력 가게는 자발적으로 결식아동을 지원하는 가게 목록으로 음식점 외에도 아이들에게 도움이 될 수 있는 다양한 분야에서 선한 영향력 가게에 참여하고 있습니다.*선한영향력가게.com/store에서 전국 선한 영향력 가게 목록을 확인할 수 있습니다.이 데이터는 경기도 내 아동 및 청소년 등 사회적 배려 계층에게 무료 혹은 일정 혜택을 제공하는 '선한영향력 가게'의 현황을 담고 있습니다. 각 가게의 상호명, 업종, 소재지, 상세주소, 제공품목, 제공대상, 영업시간, 위도 및 경도 좌표 등의 정보를 포함하고 있으며, 급식카드 소지자를 주요 지원 대상으로 하고 있습니다. 주요 항목에는 정제도로명주소, 정제지번주소, 제공품목, 정제WGS84위도, 정제WGS84경도 등이 포함되어 있으며, 이를 통해 지역별 착한가게의 분포 현황을 확인하고 공간 분석을 통한 정책 수립 및 수혜자 접근성 개선 등의 행정적 활용이 가능합니다. 또한 상세 제공품목과 서비스 내용은 복지 사각지대 해소 및 청소년 안전망 강화에 중요한 기초자료로 쓰일 수 있습니다.
