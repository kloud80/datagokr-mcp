summary_user: 성평등가족부 예방교육통합관리 시스템의 전문강사 관련 정보를 교육일련번호 단위로 담으며, 성희롱·성매매·성폭력·가정폭력·폭력예방통합·성별차이수용 교육명, 시행연도, 소속기관명, 징계 시작·종료일자를 포함한다. 공공기관이나 교육 담당자가 예방교육 강사를 섭외할 때 해당 강사의 소속기관과 담당 교육 분야, 징계 기간 해당 여부를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 소속기관명(ogdpInstNm) 같은 이름 매칭으로만 연결할 수 있다.
description_portal: 전문강사 정보는 예방교육을 직접 담당하는 강사들의 이력, 자격, 전문 분야, 교육 경험 등을 체계적으로 관리하는 자료입니다. 이 데이터를 통해 정부와 교육기관은 강사풀을 효율적으로 운용할 수 있습니다. 강사 역량을 객관적으로 분석해 적절한 배치가 가능합니다. 또한 전문강사 관리 정보는 강사의 교육 효과성과 운영 성과를 평가하는 지표로도 활용되며, 교육의 질적 향상을 위한 기초 데이터를 제공합니다. 나아가 교육 정책 수립 과정에서 강사 역량 강화를 위한 지원 방안을 마련하는 데 활용됩니다.
