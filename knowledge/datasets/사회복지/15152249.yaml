description_portal: 공무원연금공단이 공무원연금 제도와 복지 소식 등을 제공하기 위해 정기적으로 발행하는 연금지(웹진)의 구독 고객 현황을 집계한 통계 데이터입니다.이 데이터는 기준연월에 따른 고객 구분별 전체 구독자 추출 건수 현황을 기본적으로 포함하고 있습니다. 소재지(지역)별 분포 및 세부 직종(일반직, 교육직, 경찰, 소방 등)으로 상세하게 분류한 인구통계학적 현황을 함께 제공하고 있습니다.본 자료를 통해 공단의 주요 소식지 구독자 특성을 심층적으로 파악할 수 있으며, 구독자의 지역적 분포나 직종별 특성을 분석하여 향후 지역별/직종별 맞춤형 홍보 캠페인이나 콘텐츠 기획 전략을 수립하는 데 매우 유용한 기초 자료로 활용할 수 있습니다.
