description_portal: '광주광역시 남구 관내에 위치한 지역아동센터 현황 및 정보(시설명, 소재지, 정원, 연락처 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 아동청소년과(☎062-607-3541)에서 제공하며, 소재지도로명주소가 공란인 경우 소재지지번주소를 참고하여주시기 바랍니다.(소재지번주소가 공란인 경우에는 소재지도로명주소 참고) 현재 해당 데이터는 전국지역아동센터표준데이터(https://www.data.go.kr/data/15129438/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다. ※ 지역아동센터는 방과 후 돌봄이 필요한 지역사회 아동의 건전육성을 위하여 보호 교육, 건전한 놀이와 오락의 제공, 보호자와 지역사회의 연계 등 종합적인 복지 서비스 제공하는 시설로, 다음과 같은 서비스를 제공합니다. - 안전 보호: 일상생활 관리 및 귀가 지도- 급·간식 제공: 식사와 예절 교육- 학습 지원: 숙제 지도, 교과 학습 보충- 특기·적성 개발: 미술·음악·체육 등- 문화 체험: 견학·캠프·동아리 활동- 위생·건강 관리: 위생 지도, 건강 상담'
