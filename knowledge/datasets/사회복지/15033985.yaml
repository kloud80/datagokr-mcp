summary_user: 공무원연금공단이 운영하는 상록자원봉사단을 봉사단 1개당 1행으로 정리한 전국 단위 파일(csv, 약 32KB)로, 지역·활동구분(교육·생활·문화·복합나눔 등)·봉사단명·단원수·활동내용·참여자격·담당 지부 연락처를 담는다. 퇴직(예정) 공무원이 '내가 사는 지역에서 어떤 봉사단에 어떤 자격으로 참여할 수 있고 어느 지부에 신청하나'를 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명이나 지부명을 이름으로 맞춰 이어 써야 하며, 직역연금 통계 묶음 안에서는 같은 기관의 지역별 퇴직·수급자 통계와 지역 기준으로 나란히 볼 때 쓴다.
description_portal: 공무원연금공단이 운영하는 상록자원봉사단 활동현황 데이터로, 퇴직공무원 중 자원봉사 등 활동을 희망하는 잠재적인 고객들에게 봉사단 현황 및 활동내역 제공을 통해 재능기부와 나눔을 실천하는 사회적 가치 창출 목적의 데이터입니다.은퇴 후 삶의 질 향상과 지역사회 기여 확대라는 정책적 목적 아래, 공무원 경력의 사회적 환원을 실현하는 프로그램 운영 기반 자료로 기능하며, 지역과 활동내용을 참고하여 각 지부를 통해 은퇴 후 활동을 신청하여 활동할 수 있습니다.주요 항목으로 각 지역별 활동구분(교육나눔, 생활나눔, 문화나눔, 복합나눔 등), 봉사단명, 봉사단원수, 활동내용, 참여자격, 지부명 및 지부 연락처 등의 데이터가 있습니다.
