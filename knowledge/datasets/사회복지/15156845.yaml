description_portal: 본 데이터는 한국수력원자력 발전소 주변지역 전기요금 보조사업의 지원 실적을 연도별·발전본부별·지역(위치)별로 정리한 자료입니다. 제공항목은 연도, 발전본부, 위치, 주택용 지원금, 산업용 지원금, 소계로 구성되며, 주택용과 산업용 전기요금 보조 규모 및 합계를 금액 기준으로 확인할 수 있습니다. 이를 통해 발전소 주변지역에 대한 지원 수준을 이해하고, 지역·본부별 지원 추이 비교, 주택용/산업용 지원 비중 분석, 연도별 예산 변화 파악, 지역 상생 정책 및 지원사업 효과 검토, 대국민 안내·홍보 자료 작성 등에 활용할 수 있습니다.※ 제공항목중 금액의 단위는 "원"입니다.
