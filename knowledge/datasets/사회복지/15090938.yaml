summary_user: 인천광역시 서구(서해구)가 지급한 출산장려금(출산육아지원금) 수혜인원을 연도·월별로 집계한 작은 CSV 파일(약 1.4KB)이다. 구청 담당자나 인구정책 분석가가 '이 구에서 매달 출산장려금을 받은 사람이 몇 명이고 연도별로 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키나 시군구코드 컬럼은 없어서, 다른 지자체 지원실적이나 출생 통계와는 군구 이름과 연·월을 맞춰 붙여야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 출산장려금 지원 실적을 정리한 자료입니다. 본 자료는 연도별 및 월별로 지원된 출산육지원금 수혜인원을 포함하고 있습니다. 본 데이터를 통해 출생률 제고를 위한 지방자치단체의 재정적 지원 현황을 파악해 볼 수 있으며, 인구정책 수립 및 보육,복지 관련 연구와 행정업무에 활용될 수 있을것으로 판단됩니다. 또한 주민의 출산 장려 실태와 지역별 수요파악해도 도움이 될 수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
