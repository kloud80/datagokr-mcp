summary_user: 경기도 동두천시에 있는 일반협동조합을 조합 한 곳당 한 행으로 담은 건별 현황 파일로, 조합명·도로명/지번 주소·위도·경도·사업내용·관리기관 연락처를 담는다. 동두천시 안에서 어떤 협동조합이 어디서 무슨 사업을 하는지 찾으려는 주민이나, 지역 사회적경제 조직의 분포를 지도로 보려는 분석가가 쓴다. 전역 조인 키나 코드표가 없어서 다른 데이터와는 조합명·주소 문자열 매칭이나 위도·경도 좌표로만 이어 쓰고, 사업자번호나 인증번호 같은 기업 식별자로 연결하는 것은 어렵다.
limits: 사업자번호·법인번호 같은 공통 식별자가 없어 다른 기업·협동조합 데이터와 정확히 조인하기 어렵고, 이름이나 주소로 매칭하면 오차가 생길 수 있다. 범위는 동두천시 한 곳뿐이므로 다른 시군과 비교하려면 지자체별 파일을 따로 모아야 한다.
