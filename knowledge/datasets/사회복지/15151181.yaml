description_portal: 본 데이터는 사립학교 교직원을 대상으로 공단이 운영하는 연금제도의 기준소득월액 증감 정보를 담고 있습니다. 기준소득월액은 매년 6월 말 교직원의 급여소득을 기준으로 사학연금 부담금 납부 금액을  결정 합니다. 연금 부담금 및 급여 산정의 기초가 되는 중요한 요소로 이 데이터는 개인별 소득에 따른 증감 평균 보여 값 현황을주고 있습니다. 이를 통해 교직원의 소득변동 추이와 연금액에 미치는 영향을 파악할 수 있습니다. 이 데이터는 공단의 연금 재정관리 현황을 분석하고 연금 제도의 지속 가능성을 연구하는 데 귀중한 자료로 활용될 수 있습니다.
