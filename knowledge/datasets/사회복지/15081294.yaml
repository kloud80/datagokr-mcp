description_portal: 고객만족도 조사는 연금관연 서비스를 이용하는 사립학교 교직원 고객을 대상으로 서비스 전반에 대한 만족도를 조사하는 공공데이터 입니다. 이 데이터를 통해 공단의 서비스 품질 수준을 투명하게 공개하고, 고객 중심 경영의 노력을 대내외에 알리고자 합니다. 또한, 고객의 소리를 반영한 서비스 개선 방안을 모색하고, 향후 정책 수립을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 서비스 제공과 지속적인 품질 향상 노력을 입증하며, 이해관계자들이 공단의 고객 만족도 수준을 명확히 파악할 수 있도록 지원합니다.*사립학교교직원연금공단인 2023년 부터 기타공공기관으로 분류되었습니다. 이점 참고하여 고객만족도조사 결과를 활용하시기 바랍니다.
