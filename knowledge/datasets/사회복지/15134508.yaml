description_portal: 경상북도 청도군에서는 출산가정의 초기 육아 부담을 덜고, 아이 키우기 좋은 지역 환경을 조성하기 위해 출산 및 육아에 필요한 용품을 무상 또는 저렴한 비용으로 대여해주는 공공 서비스를 운영하고 있습니다.이 자료는 해당 서비스를 보다 효율적으로 안내하고, 주민들의 접근성과 활용도를 높이기 위해 대여 가능한 육아용품의 종류, 보유 수량, 대여 장소, 신청 및 반납 방법, 대여 가능 기간, 비용(무료 또는 일부 실비 부과 여부) 등의 항목을 포함하고 있습니다. 청도군이 제공하는 육아용품 대여 품목에는 유모차, 젖병소독기, 유축기, 보행기, 장난감 등 실제 양육 가정의 수요가 높은 생필품이 다수 포함되어 있으며, 위생관리 및 정기점검을 통해 안전성과 청결성이 보장된 물품만 제공됩니다
