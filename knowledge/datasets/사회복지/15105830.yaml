description_portal: 한국산업은행 퇴직연금상품 중 원리금보장 상품의 만기 및 퇴직연금 형태별(DB, DC, 기업형IRP, 개인형IRP) 금리정보를 월별로 제공합니다. 2021년도 이후 데이터부터 제공하며, 매월말 익월에 해당하는 데이터를 업데이트 합니다. 한국산업은행은 퇴직연금상품을 취급하고 있으며 퇴직연금상품에는 원리금보장상품과 실적배당형 상품이 이씁니다. 원리금보장상품은 예금자보호법에 따라 예금보호 대상 금융상품으로 운용되는 적립금에 대하여 다른 보호상품과는 별도로 1인당 "5천만원까지"(운용되는 금융상품 판매회사별 보호상품 합산) 보호됩니다. 각 상품에 대한 자세한 내용은 약관 및 상품설명서를 참고할 수 있으며 DB/DC/기업형 IRP/개인형 IRP 여부에 따라 같은 상품 내에서는 적용 금리가 다를 수 있으나 참고해주시기 바랍니다.
