summary_user: 한국산업은행이 취급하는 퇴직연금 원리금보장 상품의 금리를 만기와 퇴직연금 형태(DB, DC, 기업형IRP, 개인형IRP)별로 월 단위로 담은 API이며, 범위는 전국·비공간입니다. 퇴직연금 가입자나 담당자가 "이번 달 산업은행 DC 계좌에서 고를 수 있는 원리금보장 상품의 만기별 금리는 얼마인가"를 확인하거나 다른 사업자와 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 금융기관 퇴직연금 금리·수익률 데이터와는 상품명·기관명 매핑으로만 이어 쓴다.
limits: 공통 조인 키가 없어 다른 사업자 데이터와 자동 결합되지 않고 이름 매핑이 필요하다. 산업은행 한 곳의 원리금보장 상품만 다루므로 실적배당형 상품이나 실제 수익률·수수료 비교는 다른 데이터가 필요하다.
