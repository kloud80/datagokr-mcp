summary_user: 전라남도 안 청소년수련시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설종류·소유형태·시설명·설치자·운영자·소재지·직영/위탁 여부를 시도 범위에서 개별 주소 단위로 담는다. 학부모나 청소년 지도자가 "우리 시군 근처에 있는 공공 청소년수련시설은 어디이고 직영인가 위탁인가"를 확인하거나, 분석가가 지역별 수련시설 분포와 운영 형태를 살피는 데 쓴다. 전역 조인 키는 없어 소재지 주소나 시설명을 매핑해 시군구 단위 지역 통계와 잇는 방식으로만 연결한다.
limits: 표준 시설 코드나 행정구역 코드가 없어 다른 데이터와는 시설명·주소 문자열 매핑으로만 연결된다. 명세상 연간 또는 이벤트 주기로 만들어지는 파일이라 시설 신설·폐지가 바로 반영된다고 보기 어렵고, 프로그램·예약·숙박 정보는 담지 않는다.
