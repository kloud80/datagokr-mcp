summary_user: 공무원연금공단이 공무원 대여학자금 융자 대상으로 인정해 관리하는 국내 대학(원)·전문대학·학점은행제 기관 등의 목록을 학교 한 곳당 한 행으로 담은 전국 단위 파일로, 학교명·학교 구분 코드·시스템 등록일자와 변경일자로 구성된다. 공무원 본인이나 자녀가 다니려는 학교가 공단 학자금 대여 대상인지 확인하거나, 공무원 교육 복지 지원 범위를 연구하는 데 쓴다. 전역 조인 키가 없어 다른 학교 정보 데이터와는 학교명을 맞추거나 공단 자체 코드를 매핑해야 연결되며, 공무원연금공단의 다른 직역연금 통계 파일과 묶어 본다.
description_portal: 공무원연금공단이 공무원 대여학자금 융자 서비스를 제공하기 위해 관리하는 국내 고등교육기관(대학)의 목록입니다.본 데이터는 공단이 학자금 융자 대상 학교로 인정하는 대학(원), 전문대학, 학점은행제 기관 등의 학교명, 학교 구분 코드,  시스템 등록일자 등의 항목으로 구성되어 있습니다.이 데이터를 통해 공무원연금공단의 대여학자금 제도 관련하여 관리되고 있는 국내 교육기관 현황을 파악할 수 있으며, 공무원 복지제도 및 본인과 자녀의 교육 관련 금융 지원 정책을 연구하는 데 활용할 수 있습니다.
