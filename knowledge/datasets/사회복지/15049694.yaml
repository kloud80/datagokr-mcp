description_portal: '공무원연금공단에서 금융자산운용으로 진행하고 있는 국내 채권 거래의 거래증권사 및 위탁운용사에 관한 데이터입니다.거래금융기관 선정은 각 자산유형에 따라 지표를 통해 주기적으로 선정하고 있으며, 공무원연금공단 홈페이지 - 경영공시 - 금융자산운용 - 금융자산운용현황 - 거래금융기관 선정 메뉴에서 기준을 확인할 수 있습니다.* 채권투자- 직접운용 : 안전성을 고려하여 국공채 10%이상 투자 및 BBB+이상 회사채투자, 수익 제고를 위해 ABS 등 고금리 채권 발굴·투자- 위탁운용 : 일반 채권형편드에 투자, 채권금리보다 높은 수익 추구* 2023년 기준 채권 위탁운용 종료로 위탁운용사 현황은 없음'
