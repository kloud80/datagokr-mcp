summary_user: 전라남도 내 공공형 어린이집을 시설 한 곳당 한 행으로 담은 목록 파일로, 시군·어린이집명·원장 이름·전화·주소를 담는다(CSV 약 8KB). 부모가 "우리 시군에 운영비 지원을 받는 공공형 어린이집이 어디 있고 연락처는 무엇인가"를 찾을 때 쓴다. 어린이집코드 같은 전역 조인 키가 없어 다른 어린이집 데이터(기본정보·평가·보육료 공시 등)와는 시군명·어린이집명·주소를 맞춰 이어 써야 한다.
description_portal: '- 전라남도 내 주요 공공형 어린이집에 대한 현황 자료입니다. - 시군, 어린이집명, 전화번호, 주소 등을 조회하실 수 있습니다.- 공공형 어린이집은 민간·가정·법인 어린이집 중 우수한 시설을 선정하여 운영비와 인건비를 지원하고, 강화된 운영 기준을 적용하여 양질의 보육 서비스를 제공하는 제도입니다.1. 대상 : 영유아보육법 제10조에 따른 어린이집 중 국공립, 사회복지법인, 법인·단체 등이 운영하는 어린이집을 제외한 시설2. 지원 내용 : 교사 인건비, 유아반 운영비, 교육 및 환경 개선비 등 운영비 지원. 지자체 특수 시책 예산을 통한 추가 지원 가능'
