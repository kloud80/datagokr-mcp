summary_user: 제주특별자치도의 차상위 계층·한부모 가족 복지 수급자 수를 기준 연월과 성별(남·여)로 나눠 집계한 시도 단위 통계이며, 포털 설명상 2019~2020년 자료입니다. 제주의 저소득·한부모 수급자 가운데 여성과 남성이 각각 몇 명이고 월별로 어떻게 변했는지 보려는 복지 정책 담당자나 연구자가 씁니다. 전역 조인 키는 없으므로 다른 통계와는 기준 연월·성별 값을 맞춰 붙이거나 같은 기관 자료끼리만 연결합니다.
description_portal: 해당 데이터셋은 2019년부터 2020년 사이 제주특별자치도 내에서 ‘차상위 계층’ 및 ‘한부모 가족’으로 복지 수급자에 등록된 이들의 성별 구분별 수급자 수를 월별 또는 연도별로 집계한 통계자료이다. 남성 및 여성 각각의 수급자 규모를 동시에 제공하므로, 성별에 따른 복지 필요집단의 분포와 양상을 분석할 수 있다. 이 자료는 저소득층·한부모 가구 지원 정책 설계, 성별 복지격차 진단, 공공복지 인프라 배치, 대상자 맞춤 복지 서비스 계획 수립 등에 기초 자료로 활용 가능하다. 또한 연구자나 민간단체는 성별 구조 변화, 복지 수급 추이, 한부모가족 특성 분석, 지역 복지 사각지대 파악 등 다양한 사회복지 분석에 활용할 수 있는 공신력 있는 통계 기반 정보로 활용될 수 있다. 제공기관은 제주특별자치도이며, 데이터는 CSV 형식으로 공개되어 있어 누구나 다운로드 및 분석이 가능하다.
