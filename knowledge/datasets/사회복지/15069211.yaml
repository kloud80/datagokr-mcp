description_portal: 경상남도 내에 위치하고 있는 시군 여성회관 현황에 대한 자료이며, 본 자료는 도내 여성회관의 기관명, 주소, 전화번호 등의 정보를 제공합니다.여성회관은 지역사회에서 여성의 역량을 키우고 사회참여를 확대하는 핵심 기관으로, 직업교육과 평생학습 프로그램을 통해 여성의 경제활동을 돕고 사회참여 및 자기계발 기회를 제공합니다. 또한 가족·양성평등 교육과 상담 서비스를 제공하여 건강한 가정문화 조성과 지역 복지 증진에 기여하며, 여성단체 활동 지원을 통해 지역사회에 활력을 불어넣는 역할을 합니다.
