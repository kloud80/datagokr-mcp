summary_user: 경기도 내 장례식장을 시설 한 곳당 한 행으로 담으며, 집계연도와 시군, 시설명, 운영 형태, 시설 유형, 영업 개시일, 빈소 수, 안치 능력, 냉장 안치료와 빈소 임대료, 주소, 위경도 좌표가 들어 있다. 유족이나 주민이 우리 시군에서 빈소가 몇 개이고 빈소 임대료가 얼마인 장례식장이 어디에 있는지 비교할 때, 또는 분석가가 시군별 장례시설 공급 편차를 볼 때 쓴다. 전역 조인 키는 없어서 시군 이름·코드(SIGUN_CD)나 주소·좌표를 기준으로 다른 시군 단위 통계와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장례식장의 운영 현황을 수록한 자료로, 장례시설의 명칭, 유형, 운영 형태, 개시일, 빈소 수, 안치 능력, 주소 및 위치 정보 등을 포함하고 있습니다. 병원 부속 시설부터 전문 장례식장까지 다양한 유형의 시설이 포함되어 있으며, 지역 내 장례 인프라의 현황을 파악하고 서비스 접근성이나 시설 규모를 비교·분석하는 데 활용됩니다. 또한 위경도 좌표와 상세 주소 정보가 포함되어 공간 기반 장례 인프라 배치 현황 분석이 가능하며, 장례 관련 민원 대응, 공공장례 정책 수립, 유사 시설 관리 기준 마련 등에 기초자료로 사용될 수 있습니다. 장례서비스의 공급 여건과 지역 간 편차를 파악하는 데 유용한 공공 생활 서비스 데이터입니다.
