description_portal: '본 데이터는 2026년 3월 기준으로 전라남도 여수시 시설 유형별 장애인복지시설 및 한센요양시설 현황 총 28개소를 정리한 행정자료임.시설 유형은 장애인거주시설 6개소(동백원, 가나헌, 에덴동산, 동행빌리지, 여수농아원, 더불어사는마을), 한센요양시설 1개소(애양평안요양소), 장애인공동생활가정 6개소(믿음의 집, 사랑의집, 언젠가는 1호, 언젠가는 2호, 이루리 1호, 이루리 2호), 장애인단기거주시설 1개소(여수시장애인단기거주시설 아룸), 장애인지역사회재활시설 1개소(여수시장애인종합복지관), 장애인직업재활시설 4개소(송정인더스트리, 여수시장애인보호작업장, 송광행복타운, 여수장애인재활자립장), 장애인주간이용시설 5개소(사랑이가득한집, 다솜누리장애인주간보호센터, 작은나루, 꿈이룸터, 동행주간이용센터), 체험홈 2개소(꿈꾸는집, 라르쉬네), 생활지원센터 1개소(여수시시각장애인플러스지원센터), 수어통역센터 1개소(여수시수어통역센터)로 구분됨.제공 항목은 시설명, 소재지 주소, 수용정원(시설의 최대 수용 가능 인원, 단위: 명), 전화번호, 운영주체(개인, 법인 등)로 구성되어 있음.수용정원은 해당 시설의 최대 수용 가능 인원을 의미함.이를 통해 복지 서비스 접근성을 높이고, 시설 이용 안내와 정책 수립, 지역 복지 자원 관리에 활용할 수 있으며 또한 행정기관, 복지 단체, 연구기관 등에서 장애인 지원 정책 마련, 시설 운영 현황 분석, 복지 인프라 확충 계획 수립 등에 중요한 기초 자료로 활용될 수 있는 유용한 데이터임.'
