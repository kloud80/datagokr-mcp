description_portal: '공공데이터포털에서 제공하는 "대전광역시 서구_사회적기업" 관련 데이터는 대전광역시 서구에 소재한 인증 사회적기업 및 지정 예비사회적기업의 현황 정보를 담고 있습니다. 이 데이터는 사회적경제 활성화 및 정책 수립 지원을 목적으로 제공됩니다. 제공 정보의 주요 내용이 공공데이터는 주로 다음과 같은 항목들을 포함하고 있습니다: 기업명칭: 사회적기업의 기관명, 사업장 주소: 기업이 위치한 상세 주소. 주요 사업 내용: 기업이 영위하는 주된 사업의 종류나 내용. 연락처: 기업의 전화번호 등 연락 가능한 정보.구분: 해당 기업이 고용노동부 인증 사회적기업인지, 중앙 부처 또는 대전시 지정 예비 사회적기업인지를 구분하는 정보. 데이터의 활용사회적기업 현황 파악: 서구 내 사회적기업의 분포와 규모를 파악할 수 있습니다.정책 자료 활용: 대전광역시 서구청이나 관련 기관에서 사회적경제 지원 정책을 수립하거나 평가할 때 기초 자료로 활용될 수 있습니다.'
