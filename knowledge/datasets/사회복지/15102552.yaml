description_portal: '사립학교교직원연금공단 재정재계산 결과와 관련된 데이터로 연도별 총수입, 부담금, 운용수입, 총지출, 급여, 재정수지, 기금액 등의 항목을 제공합니다. 사학연금 재정재계산은 「사립학교교직원 연금법」 제43조에 근거하여 매 5년마다 실시하고 있으며 사학연금 재정진단을 통해 사회보험 재정건전화에 기여하고 있습니다. (단위 : 억 원)이 데이터를 통해 공단의 연금 재정 운영 투명성을 확보하고, 연금 제도의 지속 가능성을 대국민에게 명확히 전달하고자 합니다. 또한, 연금 제도 개선 방안 모색 및 관련 정책 수립을 위한 중요한 기초 자료로 활용될 수 있습니다.본 데이터는 공공기관의 책임 있는 연금 재정 관리를 입증하고, 이해관계자들이 공단의 재정 상태를 명확히 파악할 수 있도록 지원합니다.해당데이터는 6차 재정재계산 결과가 나오면 업데이트 할 예정입니다.'
