summary_user: 전국 가족센터·다문화가족지원센터별로 배치된 방문교육지도사 인원을 센터 단위로 담은 집계 파일(포털 설명상 218개 센터, 지역·센터명·배정인원)이다. 다문화가족 지원 정책 담당자나 연구자가 '우리 지역 센터에 한국어교육·부모교육·자녀생활서비스를 맡을 방문지도사가 몇 명 배정돼 있나'를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 가족센터·사회복지시설 목록과는 센터명·지역 이름을 맞춰 연결해야 한다.
description_portal: 전국 가족센터 및 다문화가족지원센터에 배치된 방문지도사의 현황정보를 제공합니다. 항목은 순번, 지역, 센터명, 방문지도사수 등이며, 총 218개의 센터 정보를 포함하고 있습니다. 방문교육지도사는 방문교육사업(한국어교육, 부모교육, 자녀생활서비스)를 실시합니다. 생활언어를 익히고 문화를 이해할 수 있도록 체계적/단계적인 한국어교육서비스를 제공합니다. 또한 언어와 문화차이 등으로 자녀양육에 어려움을 겪지 않도록 결혼이민지에게 부모교육서비스와 자아/정서/사회성 발달에서 어려움을 겪지 않도록 다문화가족 자녀에게 자녀생활서비스를 제공합니다. 이 데이터는 다문화가족에 대한 맞춤형 지원과 사례관리 서비스 제공을 위한 인력 배치 현황을 파악하는 데 활용될 수 있습니다.
