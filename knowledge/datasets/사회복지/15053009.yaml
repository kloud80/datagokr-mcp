summary_user: 공무원연금 가입 공무원의 연간 퇴직자 수를 재직년수 구간(구분)별로 나누고, 명예·정년·일반·당연퇴직, 직권면직, 사망, 기타 등 퇴직사유별 인원과 합계를 담은 전국 단위 집계표입니다. 인사·조직 분석가가 '재직 몇 년차에 명예퇴직이나 일반퇴직이 많이 몰리는가' 같은 질문에 답할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 재직년수 구간 이름이나 연도를 직접 맞추거나, 같은 공무원연금공단의 다른 퇴직·재직 통계와 나란히 놓고 비교하는 방식으로 이어 씁니다.
limits: 전국 합계만 있고 지역·기관별 구분이 없으며, 개인 단위 원천 기록이 아닌 집계표입니다. 포털 설명상 2013년 신분변동 항목 조정으로 의원면직·조기퇴직 등 7개 항목이 일반퇴직으로 통합되어, 그 이전과 사유별로 바로 비교하기 어렵습니다. 명예퇴직에는 조기퇴직 인원이 포함되고 기타에는 기간만료·철도공사특례가입 종료 등이 들어갑니다.
