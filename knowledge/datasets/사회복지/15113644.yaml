description_portal: 사립학교교직원연금공단 생활자금대여 수익률과 관련된 데이터로 연도별 연간대여수익, 당연도 잔액, 현재잔액, 평균잔액, 수익률의 데이터를 제공합니다. 해당 데이터는 공단의 재정 운용 투명성을 제고하고 대여 사업의 건전성을 공개적으로 보여주고자 합니다. 1년간 대여수익 기반의 생활자금대여 효율성을 평가하고, 연간 수익률 추이를 비교하여 향후 생활자금대여 운영 개선에 필요한 근거 자료를 제공합니다. 또한 기금 운용 효율성 분석 및 향후 대여 정책 수립을 위한 기초자료로 활용될 수 있으며 생활자금대여의 운영 상태를 파악하고, 개선점을 도출하는 데 활용될 수 있습니다.
