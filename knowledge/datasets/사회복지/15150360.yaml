description_portal: '" 국민연금공단_관할지사별 일시금 지급 현황"은 1년간 (2024년 1월~2024년 12월) 관할지사별  일시금 지급금액 에 대한 데이터입니다. ○ 이체년월 : 국민연금(반환일시금, 사망일시금) 지급액을 지급한 기준년월○ 관할지사 : 2024년에 일시금(반환일시금, 사망일시금)을 지급한 지사명○ 합산금액 :  2024년 관할지사별, 월별  일시금(반환일시금, 사망일시금) 합산금액 -반환일시금: 반환일시금은 60세 도달, 사망, 국적상실, 국외이주 사유로 더 이상 국민연금 가입자 자격을 유지할 수 없고 연금수급요건을 채우지 못한 경우 그동안 납부한 보험료에 이자를 더해 일시금으로 지급하는 급여입니다.-사망일시금: 사망일시금은 가입자(였던 자) 또는 연금 수급권자(노령연금 또는 장애등급 3급 이상 장애연금)*가 사망하였으나 국민연금법 제73조에 의한 유족이 없어 유족연금 또는 반환일시금을 지급받을 수 없는 경우 더 넓은 범위의 유족에게 지급하는 장제부조적ㆍ보상적 성격의 급여입니다.* 연금 수급권자의 사망 시 2021.6.30. 이후 사망하고, 지급받은 연금 총액이 사망일시금액보다 적은 경우에 한하여 지급'
