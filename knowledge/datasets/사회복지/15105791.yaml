description_portal: '- 전라남도에 거주하는 장애인의 유형(지체장애, 시각장애, 언어장애, 청각장애, 지적장애, 뇌병변, 자폐성 등)과 인원수,  정도에 관한 데이터를 조회하실 수 있습니다.- 지체장애란, 팔, 다리, 몸통 등의 지체(사지)에 장애가 발생하여 일상생활이나 사회생활에 지장이 있는 상태를 말합니다. 이는 주로 뼈, 근육, 신경계의 손상으로 인해 발생합니다.- 뇌병변장애란, 중추신경계(뇌 또는 뇌신경)에 손상이 발생하여 운동 기능에 장애를 일으키는 상태를 말합니다.- 뇌전증이란, 뇌신경 세포의 이상한 전기 신호로 인해 반복적으로 경련이나 의식 소실, 감각 이상 등이 발생하는 만성 신경계 질환입니다.- 자폐성 장애는 사회적 상호작용과 의사소통의 어려움, 제한적이고 반복적인 행동을 특징으로 하는 신경발달장애입니다.'
