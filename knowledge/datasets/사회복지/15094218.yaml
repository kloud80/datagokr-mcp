description_portal: '서울특별시 서초구 사회복지시설 목록에 대한 데이터로 시설명, 시설유형, 시설종류, 시설장명 등에 대한 정보 확인이 가능합니다.이 정보는 지역 주민들이 필요한 복지 서비스를 제공하는 시설을 쉽게 찾고 이용할 수 있도록 돕고, 지자체가 지역 복지 자원을 파악하고 연계하는 기초 자료로 활용됩니다.칼럼명에는 각 복지 시설의 공식 시설명과 해당 시설이 제공하는 서비스의 성격을 나타내는 시설종류(예: 노인복지관, 장애인복지관, 아동센터 등) 정보가 포함되어 있어, 사용 목적에 따른 시설 검색이 용이합니다. 또한, 시설의 정확한 위치를 파악할 수 있는 시설주소 정보가 상세하게 기록되어 있어, 시설 방문이나 경로 확인에 도움을 줍니다. 이 목록은 서울특별시 서초구의 사회 복지 인프라 현황을 한눈에 보여주며, 사회복지시설의 안전관리 및 지원 정책 수립 등에 활용할 수 있습니다. 이 데이터는 CSV 형태로 제공되며 다운로드 가능합니다. 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보'
