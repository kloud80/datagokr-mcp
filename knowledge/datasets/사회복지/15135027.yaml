description_portal: '- (근로소득) 공적자료로 조회되는 "연간소득액을 기준으로 평균하는 소득"을 반영. 소득세법 규정에 의한 비과세 근로소득은 제외하며 비과세 근로소득 중 연장시간근로, 야간근로 또는 휴일근로로 인해 받는 급여, 국외에서 근로를 제공하고 받는 급여는 포함. 3개월 이상 계속적으로 고용되어 월정액 급여를 지급받는 자의 근로소득은 포함- (이자소득) 기초연금법 시행령 제14조제1항제1호 가목부터 마목까지의 규정에 해당하는 금융재산에서 발생하는 예금, 적금, 주식, 채권의 이자와 배당 또는 할인에 의해 발생하는 소득.- (자연적소비금액) 기타증여(처분)재산 조사를 위해 확인하는 금액으로 타 재산 증가분, 본인소비분 항목 이외의 곳에 사용한 경우, 일정금액을 기본적 생활유지에 사용한 것으로 간주하여 재산을 처분한 날이 속하는 달부터 보장기관이 확인한 날이 속하는 달까지를 반영한 금액 차감'
