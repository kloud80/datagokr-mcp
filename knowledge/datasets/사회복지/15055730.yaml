description_portal: 전북특별자치도 내 청소년수련관 및 청소년문화의집에서 운영하는 '청소년 방과후 아카데미'의 현황 데이터입니다. 이 자료는 방과 후에 돌봄이 필요한 청소년들에게 학습 지원, 전문 체험 활동, 급식 및 상담 등 종합적인 서비스를 제공하는 공공 돌봄 시설의 목록입니다. 각 운영 시설의 명칭과 주소, 연락처, 그리고 수용 가능 인원 정보를 포함하고 있어, 학부모나 청소년들이 참여 가능한 프로그램을 찾고 문의하는 데 유용한 정보를 제공합니다. 이는 지역사회의 청소년 안전망을 강화하고 건강한 성장을 지원하는 중요한 인프라 현황을 보여줍니다.
