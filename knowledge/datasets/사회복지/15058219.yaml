summary_user: 경기도 특수학급 학생 수를 기준년도와 학교유형(국립·공립·사립)별로 묶어, 유치원·초등학교·중학교·고등학교·전공과 과정마다 전체·남학생·여학생 수를 담은 시도 단위 집계 자료다. 교육·복지 분석가가 '경기도 특수학급에서 학교급이 올라갈수록 남녀 비율이 어떻게 달라지는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 특수교육 통계와는 기준년도(STD_YY)와 학교유형명을 이름으로 맞춰 이어 쓴다.
description_portal: 성별 특수학급 학생수 집계현황 데이터는 경기도 내 특수학급 학생 현황을 학교유형별(국립, 공립, 사립)과 학교과정별(유치원, 초등학교, 중학교, 고등학교, 전공과)로 구분하여 성별 기준으로 집계한 교육·복지 통계자료입니다. 주요 항목에는 기준년도, 학교유형명, 전체학생수, 성별 전체학생수, 각 과정별 남학생·여학생 수가 포함됩니다. 예를 들어 유치원 전체학생수, 유치원남자학생수, 유치원여자학생수 등이 있으며 초·중·고 및 전공과 과정도 같은 방식으로 제공됩니다. 본 자료는 매년 6월 말 기준으로 작성되며, 특수교육 대상 학생의 성별 분포를 체계적으로 파악할 수 있습니다. 이를 통해 성별 특수교육 수요 차이 분석, 학교급별 성별 학생 비율 비교, 특수학급 운영 정책 수립 등에 활용할 수 있으며, 교육부 특수교육통계와 연계해 정책적 의사결정과 연구자료로 활용도가 높습니다. 또한 누림센터가 제공하여 지역 맞춤형 교육복지 지원에 중요한 기초자료가 됩니다.
