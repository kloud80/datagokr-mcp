description_portal: 한국사회보장정보원에서 1년 주기로 제공하는 통계자료로, 특성별(성별, 연령대) 시도, 월별 장애유형별 차상위장애수당 수급자 수에 대한 정보를 답고 있습니다.   데이터 구성은 성별별, 연령대별, 시도별, 월별로 지체 장애, 시각 장애, 청각 장애, 언어 장애, 지적 장애, 뇌병변 장애, 자폐성 장애, 정신 장애, 신장 장애, 심장 장애, 호흡기 장애, 간 장애, 안면장애, 장루·요루 장애, 뇌전증, 기타 질환을 앓고 있는 차상위장애수당 수급자 수 항목으로 구성되어 있습니다.   본 공공데이터는 사회보장정보시스템과 사회서비스전자바우처시스템 자료를 기반으로 작성하였습니다. 이러한 공공데이터를 활용하여 특성별, 시도별 차상위장애수당 수급자의 분포를 확인하고자 할 때, 또는 월별 차상위장애수당 수급자의 변화 추이를 확인하고자 할 때 활용하실 수 있습니다.
