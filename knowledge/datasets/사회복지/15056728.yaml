summary_user: 경기도 시군별·연도별(SUM_YY)로 장애인 자동차 주차 표지 발급 건수를 집계한 데이터로, 신규·재발급 건수와 본인용·보호자용 보행장애 유무별, 재외동포·외국인용, 대여·리스 차량용, 장애인복지시설용 발급 건수를 담는다. 복지 행정 담당자나 분석가가 '우리 시군의 보행장애 본인용 표지 발급이 다른 시군보다 많은가, 해마다 어떻게 변했나' 같은 지역별·유형별 비교에 쓴다. 전역 조인 키는 없어 시군명(SIGUN_NM)이나 시군 코드(SIGUN_CD)로 같은 경기도 시군 단위 통계와 이름·코드 매핑해 잇는다.
description_portal: 이 데이터는 경기도 내 장애인 자동차 주차 표지 발급 현황을 집계한 자료입니다. 주요 항목은 집계년도, 시군명, 신규 발급 건수, 재발급 건수, 기본 본인용 보행장애 유·무 건수, 기본 보호자용 보행장애 유·무 건수, 재외동포·외국인 본인 및 보호자용 보행장애 발급 건수, 대여·리스 차량용 발급 건수, 장애인복지시설 관리기관 발급 건수 등으로 구성됩니다. 이를 통해 장애인 교통 편의 지원 실적, 발급 유형별 특성, 지역별 차이를 파악할 수 있습니다. 데이터는 교통 약자 이동권 보장, 주차 편의 정책 개선, 복지 행정 성과 측정, 외국인·재외동포 대상 발급 현황 분석 등에 활용될 수 있습니다. 다만, 자료는 발급 건수 집계 중심으로 실제 이용 현황이나 주차 위반 사례 등은 포함되지 않음을 유의해야 합니다.
