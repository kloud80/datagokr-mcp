summary_user: 대구광역시 북구 관내에서 운영 중인 노인요양시설·노인요양공동생활가정을 시설 한 곳당 한 행으로 담은 파일로, 시설유형·도로명주소·위도·경도·연락처·설치일자·설치주체를 담는다. 장기요양등급을 받은 부모를 모실 가족이나 지역 돌봄 인프라를 보는 분석가가 '북구 안에서 집 가까운 입소형 요양시설이 어디이고 누가 운영하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 잇고, 건강보험 장기요양기관 정보나 지역 통계와 연계할 때도 이 방식을 쓴다.
description_portal: 노인의료복지시설은 장기요양등급 시설급여 1~5등급인 대상자가 시설에 입소하여 24시간 장기요양 서비스를 제공받을 수 있도록 지원하는 생활시설이며, 입소 정원에 따라서 노인요양시설(정원 10명 이상)과 노인요양공동생활가정(정원 5~9명)로 구분됩니다. 대구 북구 관내에서 사회복지법인이 운영하는 노인의료복지시설은 총 3개소(복음실버타운, 효성실버타운, 새볕실버빌)이며, 그 외 시설은 개인 또는 사단법인이 운영하고 있습니다. 현재 운영 중인 노인의료복지시설의 정보(시설유형, 도로명 주소, 위치, 연락처, 설치일자, 설치주체 등)를 제공합니다.
