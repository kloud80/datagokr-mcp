description_portal: 푸드뱅크사업은 기업 및 개인으로부터 기부받은 식품 및 생활용품을 저소득층에게 제공하는 사회복지 프로그램입니다. 이 사업은 1998년 IMF 경기 위기 이후 급격히 증가한 노숙인 및 결식아동의 급식 문제를 해결하기 위해 시작되었습니다. 전국적으로 17개 광역푸드뱅크와 450여 개의 기초푸드뱅크 및 마켓으로 구성되어 있으며, 보건복지부 산하 한국사회복지협의회에서 운영됩니다. 푸드뱅크는 기부받은 식품을 중앙물류센터에서 지역별로 배분하여 저소득층에게 전달하며, 지역별 편차를 해소하기 위해 균형 있게 물품을 배분합니다. 이 사업은 저소득층의 삶을 개선하고 사회복지 증진에 기여하는 데 중요한 역할을 합니다푸드뱅크 사업 관련 기부물품 접수 통계(기부자구분별, 물품별), 기부물품제공통계(개인이용자, 시설단체), 센터정보, 기부자통계(기부자명건수) 등 정보 제공
