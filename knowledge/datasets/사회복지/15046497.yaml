description_portal: '○ 통계개요* 통계명 : 국가보훈대상자* 통계종류 : 서울시 국가보훈대상자 현황을 제공하는 일반ㆍ보고 통계* 근거법령 :「국가보훈기본법」규정에 따라 희생하거나 공헌한 사람 및 그 유족(가족)* 작성목적 : 국가를 위하여 희생하거나 공헌한 국가유공자와 그 유족의 현황을파악하여 보훈대상자 지원 정책수립의 기초 자료로 활용하고 홍보자료로활용하는 것을 목적으로 함* 조사체계 : 보훈지청 → 서울지방보훈청* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구 보훈청 및 보훈지청별 보훈대상자(국가유공자,유족, 기타대상자) 현황○ 용어설명* 독립유공자 : 일제의 국권침탈 전후로부터 1945년 8월 14일까지 국내외에서 일제의국권침탈을 반대하거나 독립운동을 하기 위하여 항거한 사실이 있는 자 및 그 항거로인하여 순국한 자로서 그 공로로 건국훈장, 건국포장, 대통령표창을 받은 자* 5.18 민주유공자 : 5.18민주화운동과 관련하여 광주민주화운동 관련보상 등에 관한법률에 의하여 보상을 받은 5.18민주화운동 사망자 행방불명자, 부상자, 기타 희생자* 고엽제 후유의증 환자 : 월남전에 참전하고 전역된 자등 또는 남방한계선 인접지역에서복무하고 전역된 자 등으로서 일광성과민성피부염 등 21개 질병중 하나에 해당하는질병을 얻은 자'
