summary_user: 경기도 시군별로 장애인 복지시설 수를 시설유형(의료재활·직업재활·지역사회재활 등)별로 집계한 통계로, 매년 12월 말 기준 통계년월·시군명·시설유형코드·시설수를 담는다. 복지 분석가나 지자체 담당자가 '우리 시군에는 장애인 직업재활시설이 몇 곳이고 다른 시군과 비교해 부족한가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(signgu_nm) 이름 매칭이나 같은 기관 코드로만 이어 쓰며, 시군별 장애인 등록 인구 통계와 붙여 인구 대비 시설 밀도를 볼 때 이 방식을 쓴다.
description_portal: 이 데이터는 장애인 복지서비스 제공을 위한 시군구별 복지시설의 수량을 시설유형별로 집계한 통계 자료로 매년 12월 말 기준 시군명, 장애인 관련 복지시설 유형별 시설수를 제공합니다. ‘통계년월’은 자료가 수집된 시점을 나타내며, ‘시군구명’은 각 행정구역 단위의 지역명, ‘복지시설유형코드’는 시설의 성격과 목적에 따른 분류 항목입니다. 예를 들어 ‘장애인의료재활시설’, ‘장애인직업재활시설’, ‘장애인지역사회재활시설’ 등 다양한 복지시설 유형이 포함되며, ‘복지시설수’는 각 유형별로 해당 지역에 존재하는 시설의 개수를 의미합니다.
