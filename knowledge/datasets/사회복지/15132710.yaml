description_portal: 서울특별시 용산구에서는 2018년부터 2024년까지의 기간 동안 공영장례를 치른 무연고 사망자에 대한 현황을 연령별 및 성별로 구분하여 제공합니다. 이 데이터는 10대부터 90대까지의 각 연령대에 해당하는 무연고 사망자의 수를 남성과 여성으로 나누어 분석한 것으로, 지역 내 사회적 고립과 인구 고령화, 가족 구조의 변화 등 다양한 사회적 요인이 반영된 결과입니다. 특히 고령층에서 무연고 사망자가 증가하는 추세를 보이고 있으며, 젊은 층에서도 일정 수의 무연고 사망자가 발생하고 있어 사회적 관심이 필요한 상황입니다. 이러한 통계는 향후 복지 정책 수립과 지역사회 돌봄 체계 강화에 중요한 기초 자료로 활용될 수 있으며, 용산구는 이를 바탕으로 보다 촘촘한 사회 안전망을 구축하고자 노력하고 있습니다.
