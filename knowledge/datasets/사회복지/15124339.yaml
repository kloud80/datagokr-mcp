description_portal: 부산광역시 사하구에서 코로나19로 인한 주민 생활 안정과 지역경제 회복을 위해 지급한 재난지원금 지급 현황 데이터를 제공합니다. 이 데이터는 2020년과 2021년 두 차례에 걸쳐 실시된 지원금 지급 내용을 포함하고 있습니다.각 연도별로 사하구에 주민등록이 되어 있고, 신청일 기준 사하구에 거주한 주민을 대상으로 동일한 금액이 지급된 이력을 확인할 수 있습니다.주요 데이터 컬럼별 상세설명○ 구분 → 재난지원금 지급 차수(1차, 2차 등)○ 지급명칭 → 각 차수별 재난지원금의 공식 명칭○ 지급연도 → 재난지원금이 지급된 연도○ 지급대상 → 지급 기준일 기준으로 지원 대상이 되는 사하구민의 조건○ 1인당 지급액 → 대상자 1인에게 지급된 금액
