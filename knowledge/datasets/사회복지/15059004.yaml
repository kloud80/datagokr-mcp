summary_user: 경기도 시·군별 특수학교 학급 수를 연도(STD_YY) 단위로 집계한 자료로, 총학급수와 영아·유치원·초등·중학교·고등학교·전공과 등 학교과정별 학급 수, 장애 영아 포함 유치원 학급과 순회파견 병원 학급 수를 담는다. 교육 행정 담당자나 연구자가 '우리 시·군의 특수학교 고등학교·전공과 학급이 몇 년 사이 어떻게 늘거나 줄었나'처럼 지역별 특수교육 학급 규모와 격차를 볼 때 쓴다. 전역 조인 키는 없어서, 다른 시·군 단위 통계(학생 수, 장애인 인구 등)와는 시군 코드(SIGUN_CD)나 시군명을 직접 맞춰 이어 쓴다.
description_portal: 이 데이터는 특수교육통계를 바탕으로 경기도 내 각 시‧군별 특수학교의 학급 수를 연도별로 정리한 자료입니다. 매년 6월 말 기준으로 수집되며, 총학급수를 포함하여 영아, 유치원, 초등학교, 중학교, 고등학교, 전공과 등 학교과정별 학급 수와 함께, 장애 영아 포함 유치원 학급 수, 순회파견 병원 학급 수 등의 기타 항목도 제공합니다. 데이터를 통해 지역별 특수교육 환경의 변화와 특성, 학교과정별 학급 규모를 파악할 수 있으며, 교육정책 수립, 지역 간 교육 격차 분석, 특수학교 배치 계획 등 다양한 교육 행정 및 연구 목적으로 활용될 수 있습니다.
