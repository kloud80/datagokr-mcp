description_portal: 대전광역시 공동생활가정형 주거 지원 현황 자료는 저소득 무주택 한부모가족을 대상으로 한 공동생활가정형(매입임대주택) 주거 지원 현황을 제공합니다. 주요 항목에는 사업 기관, 사업대상, 사업 내용 등 포함되어 있으며, 한부모가족의 주거 안정과 자립을 돕기 위한 정책 집행 현황을 한눈에 파악할 수 있습니다.지원 대상은 한부모가족지원법상 저소득 무주택 한부모가족으로, 임대 보증금 전액 지원(임대료 및 공과금은 본인 부담) 등 실질적인 주거비 부담 완화가 이루어집니다. 이 자료는 주거 복지 정책 수립, 예산 편성, 지원 실적 관리, 한부모가족 자립 지원 프로그램 평가 등에 활용될 수 있습니다.
