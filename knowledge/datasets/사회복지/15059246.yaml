summary_user: 경기도 특수학교에서 이루어지는 순회교육 학생 수를 기준년도와 순회학급 유형(가정·시설·병원)별로 묶은 시도 단위 집계 자료로, 장애영아·유치원·초·중·고 과정별 전체 및 남녀 학생 수를 담는다. 교육정책 분석가나 특수교육 담당자가 '병원·가정 순회교육을 받는 학생이 어느 학교과정에서 늘고 있는가'처럼 유형별 순회교육 수요 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도(STD_YY)와 순회학급 유형명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 교육부 특수교육통계를 기반으로 경기도 내 특수학교에서 이루어지는 순회교육의 학생 수를 연도별로 집계한 자료로, 매년 6월 말 기준의 현황을 제공합니다. 순회학급유형은 ‘가정’, ‘시설’, ‘병원’으로 구분되며, 학교과정별(장애영아, 유치원, 초등학교, 중학교, 고등학교)로 전체 학생 수와 성별 학생 수가 함께 제공됩니다. 주요 항목에는 기준년도, 순회학급유형명, 전체학생수, 성별 세부 정보(남자/여자), 과정별 학생 수 및 성별 세부 정보 등이 포함됩니다. 이 데이터는 특수교육 대상자의 교육 접근성 분석, 유형별 교육 수요 예측, 특수교육 서비스 제공 개선, 지역 간 특수교육 인프라 형평성 검토 등의 정책 수립에 활용될 수 있습니다.
