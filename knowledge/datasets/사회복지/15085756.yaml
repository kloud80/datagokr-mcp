description_portal: 서울외국인포털 갤러리 데이터는 서울외국인포털에 게시된 갤러리 형식의 콘텐츠 정보를 제공하는 자료입니다. 각 게시물의 제목명, 컨텐츠내용, 작성자명, 언어 구분, 등록일, 수정일자를 포함하여 관리 및 활용이 용이하도록 구성되어 있습니다. 제목명은 게시물의 주제를 한눈에 파악할 수 있게 하고, 컨텐츠내용은 이미지나 갤러리와 관련된 설명·소개 텍스트를 제공합니다. 작성자명은 게시물을 등록한 개인 또는 기관을 식별하는 정보이며, 언어 항목은 해당 갤러리가 어떤 언어로 제공되는지 구분하여 다국어 서비스 운영에 활용됩니다. 등록일과 수정일자는 콘텐츠의 게시 시점과 이후 변경 이력을 나타내어, 최신 정보 관리와 이력 추적에 유용한 데이터입니다.
