summary_user: 여성사전시관에 등록된 여성독립운동가를 인물 한 명 단위로 담으며, 이름(womanIdatvNm), 인물 이미지 URL, 등록일자, 데이터 기준일자로 구성된다. 역사 교육 담당자나 전시·웹 콘텐츠 제작자가 '여성독립운동가 인물 목록과 사진을 디지털 전시나 교육 자료에 바로 넣으려면 어떤 자료가 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 인물·독립유공자 데이터와는 이름을 맞춰 대조하는 방식으로만 이어 쓴다.
limits: 필드가 이름·이미지 주소·날짜뿐이라 활동 지역, 생몰년, 공적 내용 같은 인물 상세 정보는 이 데이터만으로 알 수 없다. 공통 식별 코드가 없어 동명이인이 있으면 이름 매칭 결과를 따로 검증해야 한다. 개발계정 호출 한도는 하루 10,000회이다.
