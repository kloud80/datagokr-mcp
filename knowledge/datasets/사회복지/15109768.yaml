summary_user: 전국 한부모가족복지시설을 시설 한 곳당 한 건으로 담는 API로, 시설명·유형·주소·좌표·정원·운영 여부·입소 대상과 절차·구비 서류 등을 제공한다. 한부모가족이 사는 지역에서 입소 가능한 시설과 입소 절차, 필요한 서류를 찾을 때, 또 분석가가 지역별 시설 분포와 정원을 비교할 때 쓴다. 도로명주소·지번주소와 위도(lat)로 다른 사회복지시설 데이터와 위치 기준으로 잇고, 사업자등록번호(brno)로 사업자 단위 자료와 맞춰 볼 수 있다.
description_portal: 도움이 필요한 한부모가족의 복지시설 정보를 제공하는 오픈 API형 데이터입니다.  해당 개방데이터는 한부모가족복지시설의 POI정보(도로명주소, 지번주소, 위도, 경도), 시설명, 시설 유형, 전화번호, 이메일주소, 운영 형태, 시설 평가 등급값, 정원 기준, 전체 정원 수, 지원 내용, 운영 여부, 입소 대상, 입소 기간, 입소 절차, 구비 서류, 인근 교통시설명 등을 확인할 수 있습니다.  한부모가족복지시설의 위치 및 운영 정보를 종합적으로 제공함으로써, 한부모가족 대상 복지 서비스 접근성 향상과 맞춤형 정책 수립에 기여합니다. 또한 시설 평가, 정원 기준, 지원 내용 등을 바탕으로 복지 자원의 질적 관리와 지역 간 지원 격차 해소, 실효성 있는 복지 전달 체계 마련에 활용될 수 있습니다.
