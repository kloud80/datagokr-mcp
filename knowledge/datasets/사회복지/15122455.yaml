summary_user: 광주 남구(현 전남광주통합특별시 남구) 관내 경로당을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명주소·위도·경도·건립일자·데이터기준일자를 개별 시설 단위로 제공한다. 남구 주민이나 복지 담당자가 '우리 동네 가까운 경로당이 어디 있고 언제 지어졌는가'를 찾거나, 분석가가 경로당 분포를 지도에 올려 고령 인구 대비 접근성을 살피는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 시설명·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 잇고, 지역 통계와는 시군구 단위로 붙인다.
description_portal: 「노인복지법」 제36조 노인여가복지시설 중 지역 노인들이 자율적으로 친목도모, 취미활동, 공동작업장 운영 및 각종 정보 교환과 기타 여가활동을 할 수 있도록 하는 장소를 제공함을 목적으로 하는 시설인경로당 현황 및 정보(경로당명, 소재지 및 행정동, 전화번호 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 으뜸효정책과(☎062-607-3462)에서 제공하며, 대표 전화번호가 없거나 개인정보가 포함된 경우 미기재하였으니 데이터 이용 시 참고하시기 바랍니다. 아울러, 현재 해당 데이터는 전국마을회관및경로당표준데이터(https://www.data.go.kr/data/15114136/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다.
