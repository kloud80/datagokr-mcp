description_portal: 본 데이터는 전북특별자치도 내 여성폭력 피해자들을 위한 상담 서비스의 운영 현황을 보여주는 연도별 통계 자료입니다. 도내에 운영 중인 상담소의 수와 전체 상담 건수를 제공하며, 이를 가정폭력, 성폭력, 성매매 피해 등 폭력 유형별로 상세히 구분하여 보여줍니다. 이 자료를 통해 시간의 흐름에 따른 폭력 유형별 상담 수요의 변화를 추적하고, 관련 지원 인프라의 규모를 파악할 수 있습니다. 여성 인권 보호, 피해자 지원 시스템 평가, 그리고 사회 안전망 강화를 위한 정책 수립 및 연구에 있어 매우 중요한 기초 데이터로 활용됩니다.
