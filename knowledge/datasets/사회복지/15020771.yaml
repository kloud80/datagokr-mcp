summary_user: 중소기업은행이 판매한 개인연금신탁·연금저축신탁·퇴직신탁 등 신탁 상품별로 기준년월의 신탁금액(월말, 백만원)·기준가격, 대출·국공채·회사채·주식·기업어음 등 자산 운용 구성, 2014~2023년 연도별 평균배당률과 최근 1·3·6·9개월 및 설정일 이후 평균배당률을 상품 1행 단위로 담은 소규모 CSV 파일(약 1.6KB)이다. 연금저축신탁 가입자나 분석가가 'IBK 연금저축신탁 채권형과 안정형 중 어느 쪽이 연도별·최근 기간 배당률이 높았고 자산을 어디에 운용하는가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 금융기관의 연금·퇴직연금 수익률 자료와는 상품명이나 기관명을 직접 맞춰 이어 써야 한다.
limits: 표준 상품코드 같은 공통 키가 없어 금융위·근로복지공단 등 다른 퇴직연금 데이터와 자동 결합이 되지 않고 이름 매핑이 필요하다. 전국 단위의 비공간 데이터라 지역별 분석에는 쓸 수 없다.
