summary_user: 광주광역시 북구에 있는 노인 주야간보호센터와 노인요양시설을 시설 한 곳당 한 행으로 담은 목록이며, 구분·기관명·도로명주소·전화·팩스·정원(명)을 시군구 범위의 개별 주소 단위로 제공한다. 북구에 사는 보호자가 부모님을 맡길 주간보호센터나 요양원의 위치와 정원, 연락처를 확인하거나, 분석가가 북구의 장기요양 시설 공급 규모를 가늠하는 데 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록이나 사회복지시설 자료와는 기관명·주소를 맞춰 붙여야 하고, 지역 통계와는 시군구 단위로 잇는다.
limits: 시설코드 같은 공통 식별자가 없어 다른 데이터와는 기관명·주소 매칭으로만 연결되므로 표기 차이에 주의해야 한다. 범위가 북구 한 곳이라 다른 구나 광주 전체 현황은 담지 않는다.
