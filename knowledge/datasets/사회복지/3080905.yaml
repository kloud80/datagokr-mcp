summary_user: 고양시 안의 노인주거·노인의료·재가 노인복지시설을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·기관종류·입소정원수·주소·전화번호를 담는다. 고양시에서 부모님을 모실 요양원이나 재가서비스 기관을 찾는 가족이 "우리 동네에 입소 정원이 있는 시설은 어디인가"를 확인하거나, 분석가가 구별 노인시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 국민건강보험공단 장기요양기관 정보나 사회복지시설 목록과는 시설명·주소를 맞춰서만 이을 수 있다.
description_portal: 경기도_고양시_노인복지시설 (주거,의료,재가)현황에 대한 데이터로 시설명, 입소정원수, 주소 등의 항목을 제공합니다. 노인장기요양보험제도는 ’65세 이상의 노인‘ 또는 ’치매·뇌혈관성질환 등‘ 노인성 질병이 있는 65세 미만의 자 중 6개월 이상 동안 혼자서 일상생활을 수행하기 어려워 장기요양등급을 받은 자에게 신체활동 또는 가사활동 지원 등의 장기요양급여를 받을 수 있는 제도입니다.장기요양기관을 알아보고 계신다면 국민건강보험공단 장기요양보험 홈페이지-장기요양기관찾기를 이용하시면 됩니다.
