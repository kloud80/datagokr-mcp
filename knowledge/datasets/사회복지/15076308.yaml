summary_user: 경기도 한부모가정 구성원을 암호화된 개인 식별키 단위로 한 행씩 담은 건별 인적사항 자료로, 생년·주소·혼인관계·자녀 수, 본인과 배우자의 직업, 근로소득, 각종 지원·저축·연금, 부채와 신용불량 여부, 자격증·취업교육 이력, 주거형태를 담는다. 복지정책 분석가나 지원사업 담당자가 '한부모가정 중 부채나 신용불량이 있으면서 취업교육 이력이 없는 가구는 어느 지역에 많은가' 같은 질문을 따질 때 쓴다. 전역 조인 키는 없고, 암호화 식별키(encpt_key)로 같은 기관의 상담기록 데이터와 잇거나 주소를 지역명으로 매핑해 사회복지시설 공통 마스터 등과 연결한다.
description_portal: 이 데이터는 한부모가정의 기초적인 인적 정보를 포함한 자료로, 암호화된 개인 식별키를 기반으로 생년, 주소, 혼인관계 여부, 자녀 수, 본인 및 배우자의 직업 선택 및 직업명, 근로소득 여부, 자산 정보(부채, 신용불량), 자격증 및 취업교육 이력, 주거형태, 등록일자 등 항목으로 구성되어 있습니다. 해당 데이터는 사회적 취약계층인 한부모가정의 생계여건, 경제활동, 자립역량 등의 특성을 파악하고, 이들을 대상으로 한 복지정책 설계, 맞춤형 지원 사업, 취업 및 자활 프로그램 개발에 활용될 수 있습니다. 주소 정보는 지역별 분석, 주거 안정성 평가 등에도 기초자료로 쓰일 수 있으며, 암호화된 키를 통해 다른 상담기록 데이터와 연계도 가능합니다.※ 기업매칭 지원 사업으로 발굴된 공익데이터입니다.※ 데이터 제공 기관에서 해당 자료 작성프로그램 문제로 22년부터 업데이트가 중단된 데이터입니다.
