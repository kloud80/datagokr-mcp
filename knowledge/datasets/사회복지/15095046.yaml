summary_user: 충청남도 도내 가정폭력상담소를 시설 한 곳당 한 행으로 담은 목록 파일로, 시군·명칭·운영내용·재원·주소·연락처·종사자 수·시설규모·운영주체 법인명을 담는다(파일 크기 298바이트로 행 수가 매우 적다). 가정폭력 피해 상담이 필요한 도민이나 지원기관 실무자가 '우리 시군에서 연락할 수 있는 가정폭력상담소가 어디이고 누가 운영하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 사회복지시설 목록과는 시군 이름이나 시설 명칭·주소를 맞춰 이어 쓴다.
limits: 공통 시설 코드가 없어 다른 데이터와 붙이려면 이름·주소 매칭에 의존해야 한다. 여성 폭력 피해 보호시설은 법적으로 위치를 공개하지 않으므로, 이 목록은 상담소만 다루며 보호시설 위치 정보로 쓸 수 없다.
