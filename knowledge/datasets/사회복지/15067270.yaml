description_portal: (광주광역시 공동주택 경비현황)「공동주택관리법」 및 「공동주택관리법 시행령」 제23조에 따라 의무관리대상 등 관리주체는 공동주택의 관리비 정보를 공동주택관리정보시스템에 등록하여야 합니다. 또한 「공동주택관리정보시스템 운영 관리규정」에 따라 이용자 편의성 제고 및 운영의 효율성을 위하여 필요한 경우 새로운 정보를 제공하거나 제공 형식을 변경하여 시스템을 운영할 수 있습니다.  이와 관련하여 해당 자료는 공동주택 경비현황과 관련된 자료이므로 공동주택관리정보시스템(k-apt)에  국민적 이해도 향상을 위해 '추가자료'로서 관리주체에서 입력한 공동주택 기본 정보(기본정보 및 관리시설 정보 등) 중 일부로서 ,  '20년 3월 기준 광주광역시 공동주택 경비(고용)현황 ' 과 관련된 자료이므로 현재 현황과는 상이할 수 있으므로 이용에 참고하여 주시기 바랍니다.
