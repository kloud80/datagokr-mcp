description_portal: 경상남도 창원특례시 행정동별 등록장애인 현황에 대한 데이터입니다.현재 경상남도 창원특례시는 55개의 행정동(읍면동), 5개 구(의창구, 성산구, 마산합포구, 마산회원구, 진해구)가 있으며, 행정동별로 남자, 여자 장애인 등록수가 구분되어 표기되어 있습니다. 그리고 장애심한정도(심한장애, 심하지않은장애)에 따라 장애인 등록수를 포함하고 있으며, 장애심한정도에 따라 남자, 여자를 구분한 장애인등록수도 포함한 자료입니다.  데이터의 기준일자는 2025년 4월 30일 기준으로 추출된 자료임을 참고하시기 바랍니다.
