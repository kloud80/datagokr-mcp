summary_user: 산재보험 최초요양 신청 중 승인된 산재 한 건을 한 행으로 담는 건별 자료로, 사업장 소재지·업종명·재해발생형태(사고/질병)·상병코드와 세부상병명·재해일자·직종·성별·재해 당시 연령대를 포함하며 범위는 전국이다. 정책 담당자나 분석가가 '어느 지역·업종·직종·연령대에서 어떤 상병의 산재가 많이 승인되는가'를 따져 예방 대책 대상을 고르는 데 쓴다. 상병코드(drug_cd)로 질병·상병 분류 자료와, 직종코드(job_code)로 직종 분류·직종별 통계와 이어 쓴다.
description_portal: '이 데이터는 산업재해보상보험 최초 요양 신청 건 중 승인된 사례에 대한 상세한 정보를 담고 있는 핵심 통계 자료입니다. 각 레코드는 하나의 승인된 산재 건을 나타내며, 사업장 소재지(시군구)부터 업종명, 재해발생형태(사고/질병), 상병코드와 세부 상병명, 재해일자, 직종명, 성별, 연령대 등 다각적인 정보를 포함합니다. 특히, 연령대는 재해 발생 당시를 기준으로 10단위로 구분되어 있어(예: 데이터값 "2"는 20대를 의미), 연령별 취약도를 분석하는 데 유용합니다. 이 자료는 국내 산업재해의 발생 양상을 심층적으로 파악하고, 재해 근로자의 특성과 부상/질병 유형 간의 상관관계를 규명하는 데 필수적인 근거 자료입니다.본 데이터는 산재 예방 정책 및 의료 서비스 개선에 실질적으로 기여할 수 있습니다. 정책 입안자는 특정 직종이나 연령대, 또는 특정 지역 및 사업장 규모에서 빈번하게 발생하는 재해 유형과 세부 상병명을 분석하여, 가장 취약한 그룹에 대한 맞춤형 예방 대책과 집중 관리 방안을 수립할 수 있습니다. 또한, 보건 및 재활 전문가는 이 자료를 활용하여 지역별/업종별 상병 발생 패턴에 맞는 전문 재활 프로그램이나 의료 서비스 제공 체계를 구축하는 데 기여할 수 있습니다.'
