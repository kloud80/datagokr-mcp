summary_user: 과천도시공사가 운영하는 과천시민회관 안의 카페·체육용품점 같은 입점 편의시설을 업장 한 곳당 한 행으로 담은 작은 CSV 파일(1,564바이트)로, 업장명·취급품목(이용대상)·운영시간·휴무일·연락처·건물 내 위치를 담는다. 시민회관을 찾는 시민이 방문 전에 '회관 안 카페가 오늘 문을 여는지, 몇 시까지 하는지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업장명이나 같은 기관(과천도시공사) 단위로만 이어 쓴다.
description_portal: 과천시민에서 관리·운영 중인 입점 편의시설(카페,체육용품점 등)의 기본 혀놩 정보를 제공하는 데이터입니다.과천시민회관 내에 위치한 카페, 체육용품점 등 편의시설의 업장명, 취급품목(이용대상), 운영시간, 휴무일, 연락처, 위치 정보를 제공합니다.해당 데이터는 아래의 목적으로 공개하며, 입점 업장 변경, 운영시간 조정, 휴무일 등 변동사항 발생 시 신속히 반영할 수 있도록 표준화된 구조로 구성되어 있습니다.- 시민 시설 이용 편의 증진- 시설 방문 전 편의시설 정보 사전 확인 지원- 외부 서비스와의 연계 활용
