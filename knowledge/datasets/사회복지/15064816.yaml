summary_user: 인천광역시 연수구의 노인복지시설을 시설 한 곳당 한 행으로 담은 파일(CSV 약 13KB)로, 시설 유형(구분)·설치(운영) 주체·시설장·전화·팩스·정원·설치일·면적을 담는다. 연수구 주민이나 복지 담당자가 '우리 동네 경로당·노인복지관은 어디이고 정원과 규모는 얼마인가'를 확인하거나, 설치일로 오래된 시설을 가려 시설 관리·자원 배분을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키나 기관 코드가 없어 다른 데이터와는 시설명 이름 매칭으로만 잇고, 시군구 단위 지역 통계와 함께 볼 때도 연수구라는 지역 기준으로만 맞춰 붙인다.
