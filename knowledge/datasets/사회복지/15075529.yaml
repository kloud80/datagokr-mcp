summary_user: 전국 장애인복지관 266곳을 시설 한 곳당 한 행으로 담은 파일 데이터로, 시도·시군구, 시설유형, 법인현황, 시설명, 주소, 연락처, 종사자 정원·현원, 좌표를 싣는다. 장애인이나 가족이 내 지역의 복지관이 어디에 있는지, 분석가가 지역별 복지관 인력 규모가 어떤지 확인하는 데 쓴다. 시설 주소(address)와 엑스·와이 좌표(coord)가 조인 키라서 주소 기반 지오코딩 자료나 좌표 기반 지도·인구·교통 데이터와 이어 쓴다.
description_portal: 보건복지부에서 전국에 있는 장애인복지관 현황 정보(시설유형, 법인현황, 시설명, 시설주소, 전화번호, 팩스번호,  종사자 정원, 종사자 현원, X좌표, Y좌표)를 제공하고 있습니다. 장애인 복지관(이하 "복지관"이라 함)의 운영에 필요한 사항을 정하여 장애인 권리에 기반한 서비스 제공과 지역의 통합환경 조성을 통해 장애당사자의 지역사회 참여와 자립을 촉진한다. 복지관은 개인별 지원, 사회환경 중심, 지역사회 관계망 기반 실천을 지향하며, 사회통합 환경 조성을 위하여 지역주민의 참여를 촉진하는 역할을 수행한다.
