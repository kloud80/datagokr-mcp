description_portal: 2026년 진주시 노인일자리 및 사회활동지원사업 현황입니다. 진주시 노인일자리 및 사회활동지원사업 수행기관으로는 진주시청(시직영), (사)대한노인회진주시지회, 진주서부시니어클럽, 진주시니어클럽, 진주장애인복지센터가 있습니다. 노인일자리 및 사회활동지원사업은 4가지 유형으로 나누어 운영됩니다. 먼저 노인공익활동사업은 저소득 어르신의 지속적인 사회활동을 지원하는 봉사활동으로 만65세 이상 기초연금수급자가 참여자격이 있으며 월평균 11개월활동합니다. 공동체사업단은 근로능력 있는 노인에게 적합한 일자리 활동을 지원함으로써 소득보충, 개선 및 사회적 관계 증진 등 안정된 노후생활을 보장하는 일자리유형으로 대표적으로 실버카페가 있습니다.노인역량활용사업은 노인의 경력과 활동역량을 활용하여 사회적 도움이 필요한 영역에 서비스를 제공하는 일자리로 공공기관 행정업무 지원 등이 있습니다취업지원형은 구직을 희망하는 60세 이상 노인에게 일자리를 연계하는 사업입니다.
