description_portal: '대구광역시 동구에서 보유중인 안심택배함 공공데이터는  택배 도난 및 범죄 예방과 비대면 수령의 편의성을 높이기 위해 전국 지자체와 기업들이 설치·운영하는 무인 택배 보관함 시스템으로  관내 안심택배함의 소재지주소, 운영시간, 연체료, 사용방법설명, 칸 개수, 칸 크기, 설치일자, 고객센터 전화번호, 관리기관전화번호 등의 정보가 포함되어 있습니다.안심택배함은 24시간 무인 택배 보관 서비스로, 택배 도난·범죄를 줄이고 시간적 제약 없이 물건을 수령할 수 있는 안전하고 편리한 장비입니다. 장점 & 효과편의성: 직장이나 외출로 택배 수령이 어려운 맞벌이·1인 가구에 큰 도움이 됩니다.안전 강화: CCTV, 비상벨, 치안센터 연계 등 보안장치가 설치되어 안전성이 높습니다 .'
