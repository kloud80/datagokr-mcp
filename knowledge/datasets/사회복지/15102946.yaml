description_portal: 장애인생활시설은 일상생활을 혼자서 수행하기 어려운 장애인에게 거주 공간과 보호, 재활, 교육, 돌봄 서비스를 제공하는 사회복지시설입니다. 「장애인복지법」에 따라 설치되며, 중증장애인이나 가족의 보호를 받기 어려운 장애인을 대상으로 하여 24시간 상시 보호 체계를 운영합니다.  시설 종류는 이용 대상과 기능에 따라 장애인거주시설, 장애인공동생활가정, 단기거주시설, 직업재활시설 등으로 구분되며, 입소자는 개인의 장애 정도와 생활 능력, 가족 상황 등을 고려해 선정됩니다. 주요 서비스로는 일상생활 지원(식사, 위생, 건강관리), 사회적응 교육, 치료 및 재활, 여가활동 등이 있으며, 전문 인력(사회복지사, 간호사, 생활지도원 등)이 상주해 서비스를 제공합니다.해당 데이터는  유형, 시설명, 소재지, 전화번호, 운영주체, 개원일자 등의 정보를 포함하고 있습니다.
