description_portal: 부산광역시 노인복지법에 의한 노인의료복지시설(노인요양시설, 노인요양공동생활가정) 현황입니다. 노인의료복지시설이란 노인성질환으로 인해 도움이 필요한 노인에게 급식과 요양, 그 밖에 일상생활에 필요한 편의를 제공하는 시설로시설 입소대상과 절차는 국민보험공단 등급판정위원회를 통해 1~2 등급을 받은자 또는 3~5등급자 중 불가피한 사유, 치대 등으로 시설급여 대상자로 판정을 받은 자가 장기요양 인정신청 후 시설과 계약을 통해 입소할 수 있습니다. 노인요양시설은 10명 이상의 시설로 침실, 사무실 등 대부분 시설을 개별적으로 갖추어야하는 비교적 큰 시설이며노인요양공동생활 가정은 5명 이상 9명 이하의 노인요양시설에 비하여 공동으로 사용할 수 있는 시설이 많은(사무실, 요양보호사실, 자원봉사자실, 간호사실 공동 활용) 비교적 소규모 시설입니다.부산시 노인의료복지시설은 총121개(노인요양시설 101개, 노인요양공동생활가정 20개)이며  본 자료에는 요양시설명, 주소, 정원, 현원, 전화번호 등을 수록하였습니다.부산시 16개 구군별 관리 현황을 조사하여 수록하였으며, 요양시설 설립은 관할 구청으로, 요양시설 입소는 해당 시설로 문의하시기 바랍니다. 2025년 7월말 기준 현황입니다.
