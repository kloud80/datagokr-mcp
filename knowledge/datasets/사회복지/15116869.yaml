description_portal: '국가보훈부에서 매월 발간하는 나라사랑신문의 2020년 1월호부터 2023년 7월호까지 나라사랑신문 주요기사 제목을 제공합니다.ㅇ 제공 항목: 제공자료 : 발행년도, 발행월호, 신문면, 주요기사명(관련문의) 국가보훈부 홍보담당관실(044-202-5013)※ 나라사랑신문은 국가보훈부에서 매월 발간하는 신문으로 국가유공자분들에게 ​정확한 보훈정책 제공과 보훈가족 및 단체의 소식을 빠르게 전달함으로써 보훈문화 창달을 지원하고 있습니다.(창간일: 1963년 9월 19일 , ​누리집 주소: www.narasarang.kr)ㅇ 개방 신청에 따라 1회성으로 제공한 정보이며, 원문 기사는 매월 링크 데이터 행태로 제공하고 있는 점 참고하시기 바랍니다.    (추가자료는 국가보훈부 홈페이지>알림소식>보훈홍보관>나라사랑신문(PDF) https://www.mpva.go.kr/mpva/selectNwsprPdfWebList.do?key=94 에서 월별 확인 가능)'
