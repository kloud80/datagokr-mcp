summary_user: 아이돌봄 지원사업 관련 문서 이미지에서 OCR로 뽑아낸 샘플 데이터로, 이미지 한 장(항목)마다 출처 파일·이미지 이름과 유형, 제목·설명·단위·그래프 유형·주석, 원천데이터를 담는다. 아이돌봄 서비스 현황 자료를 기계가 읽는 형태로 다루려는 분석가나 개발자가 '이 통계 이미지나 표에는 어떤 제목·단위·수치가 들어 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 제목·출처파일명 같은 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 아이돌봄서비스 OCR 샘플 데이터는 공공데이터법 제24조에 따라 추진되는 제4차 국가중점데이터 개방계획에 포함된 아이돌봄 지원사업 관련 데이터입니다.이 데이터는 국가적 파급효과와 활용가치가 높은 고수요 데이터를 국가중점데이터로 개방한다는 취지에 따라 선정되었으며, 표준화 절차와 품질 점검을 거쳐 신뢰성을 확보한 후 오픈API 방식으로 제공됩니다.이를 통해 이용자는 아이돌봄 서비스 현황 분석, 민간 서비스 연계 검토 등 다양한 정책·연구·서비스 기획 목적에 활용할 수 있으며, 다른 공공데이터와 결합하여 공공 및 민간 분야 전반에서 활용 범위를 넓힐 수 있습니다.
