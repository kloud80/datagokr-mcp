summary_user: 청소년 활동 프로그램 참여 후기를 게시물 한 건 단위로 담으며, 제목·본문·활동프로그램명·기관명·참석 연령대(초등~대학·일반)·숙박 구분·작성일시·조회수가 포함되고 범위는 전국입니다. 학부모나 청소년 지도자가 '어떤 기관의 어떤 활동 프로그램이 후기와 조회수가 많고, 숙박형인지와 어느 연령대가 참여했는지'를 확인하는 데 쓴다. 전역 조인 키는 없어서 기관명·활동프로그램명 같은 이름이나 같은 기관의 시설물일련번호(fcltySn)로 청소년 수련시설·인증 프로그램 데이터와 맞춰 이어 쓴다.
description_portal: 청소년 활동 프로그램 후기 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 조회수, 게시물내용, 프로그램구분, 시설물, 제목, 활동구분, 활동프로그램명, 기관명, 숙박구분 등의 내용을 확인할 수 있습니다. 청소년 활동 프로그램 후기 정보는 프로그램의 질적 개선과 만족도 제고에 중요한 인사이트를 제공합니다. 조회수, 제목, 활동구분 등의 정보는 인기 활동 유형이나 주제를 파악하는 데 유리하며, 참여 경험에 기반한 데이터가 누적됨으로써 현장 중심의 실효성 있는 프로그램 설계에 적극 활용될 수 있습니다.
