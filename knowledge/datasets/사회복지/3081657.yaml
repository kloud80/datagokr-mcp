summary_user: 전국의 아이돌봄사 양성교육 기관을 한 기관당 한 행으로 담은 목록 파일로, 시도명·교육기관명·주소·운영시간·전화번호가 들어 있고 위치는 개별 주소 단위다. 아이돌보미가 되려는 사람이 '우리 시도에서 양성교육을 받을 수 있는 기관은 어디이고 언제 운영하는가'를 확인하거나, 분석가가 지역별 양성교육 기관 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키나 기관 코드가 없어 다른 데이터와는 시도명이나 기관명·주소 문자열 매칭으로만 이어 쓴다.
