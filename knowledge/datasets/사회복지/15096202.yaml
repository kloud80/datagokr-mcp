summary_user: 경기도사회서비스원이 정리한 도내 노인일자리 수행기관 현황으로, 기관 한 곳당 한 행에 시군명·기관구분·수행기관명·전화·팩스·도로명/지번 주소·우편번호·위경도를 담는다. 노인일자리를 찾는 어르신이나 가족이 "우리 시군에서 노인일자리 사업을 하는 기관은 어디고 연락처는 무엇인가"를 확인하거나, 분석가가 시군별 수행기관 분포를 볼 때 쓴다. 전역 조인 키는 없어 시군명이나 기관명 매핑으로 다른 자료와 잇고, 위경도(refine_wgs84_lat·logt)가 있어 지도 위에서 다른 복지시설 위치 자료와 겹쳐 보는 방식으로 연결한다.
description_portal: 이 데이터는 경기도사회서비스원이 제공하는 노인일자리 관련 수행기관의 현황을 정리한 자료로, 경기도 내 노인을 대상으로 일자리를 발굴하고 제공하는 기관 정보를 포함합니다. 주요 항목으로는 ‘시군명’을 통해 기관의 소재 지역을 확인할 수 있습니다. ‘수행기관명’은 실제로 노인일자리 사업을 운영하는 기관의 명칭을 의미하고, ‘전화번호’와 ‘팩스번호’는 기관과의 연락 수단을 제공합니다. 이 데이터는 노인일자리 수요자 대상 안내 자료로 활용될 수 있으며, 지역별 일자리 지원 인프라 파악, 복지서비스 접근성 분석, 고령층 맞춤형 정책 수립 등에 활용될 수 있습니다.
