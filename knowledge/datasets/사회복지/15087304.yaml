summary_user: 미추홀구 출산장려금 지급 건수를 행정동별로 집계한 파일로, 2024년 7월부터 2025년 6월까지 월별 지급 건수가 가로 열로 펼쳐져 있다. 구 정책 담당자나 지역 분석가가 "미추홀구 어느 동에서 출산장려금 지급이 많고 월별로 어떻게 달라졌나"를 볼 때 쓴다. 전역 조인 키(행정동코드 등)가 없어 다른 데이터와는 행정동 이름을 매핑해 출생 통계나 타 지자체 출산지원 실적과 이어 쓴다.
limits: 행정동 이름만 있고 코드가 없어 다른 데이터와 붙이려면 이름 매핑이 필요하다. 미추홀구 한 곳의 읍면동 단위 집계라 개인별 지급 내역이나 지급 금액은 없고, 월이 열로 나뉜 형태라 시계열 분석 전에 행으로 바꿔야 한다.
