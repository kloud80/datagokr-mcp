summary_user: 서울특별시 중랑구에 있는 아동복지시설(지역아동센터)을 시설 한 곳당 한 행으로 담은 파일로, 기관명·정원·주소·전화번호가 들어 있다. 중랑구 보호자가 집 근처 지역아동센터의 위치와 정원을 확인하고 상담 전화를 걸 곳을 찾는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 주소를 맞춰 잇고, 사회복지시설 공통 목록과 대조하는 참조용으로 쓴다.
description_portal: 서울특별시 중랑구에 위치한 아동복지센터(지역아동센터) 정보를 제공합니다. 데이터는 기관명, 정원, 전화번호, 주소 입니다. 참고해주시기 바랍니다. 감사합니다. 2026년 상반기 중랑구 지역아동센터 최신 자료입니다. 지역아동센터는 1980년대 공부방으로 시작되어 2024년 아동복지시설 법제화 20주년을 맞이하였습니다. 지역아동센터는 정원제로 정원이 초과되어 입소는 어려워 상담 시 해당 센터에 꼭 확인하시기 바랍니다. 아동돌봄이 이슈가 되는 현 시점 지역아동센터는 무료로 이용 가능한 지역내 믿을 수 있는 아동복지시설입니다. 돌봄, 급식, 다양한 프로그램 및 캠프 등으로 이루어진 아동프로그램은 부모님과 아이들 모두 만족할 수 있습니다.
