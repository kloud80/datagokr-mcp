description_portal: '공무원아파트 유형별(임대주택,주택건립분양,특별분양,주택융자알선) 투자액조성 등에 대한 데이터로, 1982년부터 2024년까지 연 단위로 구분됩니다.해당년도에 표기된 세대수와 금액은 당해년도 증감을 표기한 것으로 누계 세대수 및 금액은 합계에 표기, 세대수가 음수인 경우 매각세대 및 재건축으로 인한 멸실세대입니다.1. 세대수 : 임대주택-입주일 기준, 주택건립분양-분양계약완료 기준2. 특별분양(국민주택 특별분양 알선) : 지방자체단체 및 주택공사 등이 건립·분양하는 주택을 배정받아 무주택 공무원에게 분양 알선(주택도시기금예탁금은 연도말 잔액기준)3. 주택자금융자알선 : "98년까지는 해당금융기관에 대출조건부 정기예금을 예치하여 운영한 것이고, "99년 이후에는 기금을 예치하지 않은 공무원주택담보융자알선임("04.11.폐지)'
