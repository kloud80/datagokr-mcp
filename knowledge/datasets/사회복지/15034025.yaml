summary_user: 부산광역시 16개 구군의 노인일자리 사업을 사업 건별로 담으며, 수행기관·사업명·사업 유형·주요 활동·참여 인원·사업 기간·연락처·구군을 포함한다(포털 설명 기준 2023~2025년 702건, 수행기관 107곳). 부산에 사는 어르신이나 가족이 '우리 구에서 지금 참여할 수 있는 노인일자리 사업은 무엇이고 어디에 연락하나'를 찾을 때 쓰고, 분석가는 구군별 사업 수와 참여 인원 추이를 비교하는 데 쓴다. 전역 조인 키는 없어 구군 이름(gugun)을 시군구 코드에 매핑해 지역 통계와 잇거나, 수행기관 이름으로 노인복지관 등 시설 목록과 대조해 연결한다.
description_portal: 부산광역시_구군 노인일자리 사업 현황(수행기관, 사업명, 사업내용, 인원, 연락번호 등) 데이터 입니다. 고령화 사회에서 초고령화 사회로 진입하여 노인 인구수가 증가하고 있는 상황에서 경제활동이 가능한 노인들의 일자리가 부족해 각 구군에서 노인 일자리를 제공하여 노인들의 경제활동 참여를 지원하고 있습니다.  2023년부터 2025년까지 총 702개의 일자리 정보가 있습니다.  노인복지관, 시니어센터, 사회복지관 등 총107개의 수행기관에서 노인일자리 사업을 수행하고 있습니다. 기장군 3곳, 중구 3곳, 수영구 4곳, 동래구 5곳, 사하구 8곳, 영도구 10곳,  연제구 42곳, 남구 55곳, 부산진구 58곳, 서구 60곳, 강서구 65곳, 금정구 65곳, 사상구 67곳, 북구 79곳, 동구 83곳, 해운대 95곳 입니다.참여인원은 2023년 4,371명, 2024년 21,792명, 2025년 34,975명으로 매년 일자리 수가 늘고 있습니다. 구군의 노인 일자리 정보를 통해 노인들이 원하는 일자리를 찾아 경제활동을 할 수 있을 것입니다.*기준일 2025.5.19 현재
