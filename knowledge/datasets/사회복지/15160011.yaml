summary_user: 부산광역시 구군·행정동(읍면동) 단위로 독거노인 수와 65~79세·80세 이상 남녀별 독거노인 수를 담은 집계 통계로, 데이터기준일자(referenceDate)가 함께 붙는다. 구청·복지 담당자나 분석가가 '우리 구에서 80세 이상 여성 독거노인이 가장 많은 동은 어디인가'처럼 돌봄 서비스 우선 지역을 고르는 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 구군명·행정동명 이름 매핑이나 같은 기관코드(insttCode)로만 시군구 노인인구·노인복지시설 데이터와 잇는다.
description_portal: 부산광역시 구군별 독거노인 현황을 제공하는 데이터로, 지역별 독거노인 수와 성별·연령대 등 관련 통계 정보를 포함하고 있습니다. 이 데이터는 부산광역시 구군명, 행정동명, 독거노인수, 65세-79세 남성, 65세-79세 여성, 80세 이상 남성, 80세 이상 여성의 독거노인 수를 제공하고 있습니다. 이를 통해 고령화 추세 및 지역별 독거노인 분포 등을 파악할 수 있으며, 노인복지 정책 수립, 돌봄 서비스 지원, 복지 사각지대 발굴 및 지역 맞춤형 복지서비스 제공을 위한 기초자료로 활용할 수 있습니다.
