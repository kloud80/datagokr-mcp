description_portal: '공무원연금공단 종합재해보상시스템에서 사용되는 표준기안문서의 화면 구성 정보를 정의한 기본 테이블 데이터입니다.데이터는 다음과 같은 항목으로 구성됩니다.- 기안문문서그룹번호: 기안문서의 분류를 나타내는 고유 코드- 기안문문서화면번호: 해당 기안문서와 연결된 프로그램 또는 화면의 고유 식별번호- 기안문화면구분코드: 해당 화면의 역할 또는 성격 (기본화면, 상세화면 등)재해보상 업무(의뢰, 안건등록, 승인요청, 보완, 부결통보, 정정통보, 반려 등) 관련하여 내부직원이 표준기안문 양식을 작성할 때 사용되는 화면을 구분하는 코드성 데이터입니다.표준기안문화면항목상세 등 관련 테이블과 결합하여 확인할 수 있으며, 기준시점 유효한 데이터만 발췌되었습니다.'
