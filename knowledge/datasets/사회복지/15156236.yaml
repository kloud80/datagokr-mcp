description_portal: 재가노인복지시설 현황에 대한 데이터로 시설명, 제공급여(서비스) 유형, 시설주소, 전화번호 등을 제공합니다. 해당 데이터는 광주광역시 남구청 으뜸효정책과(☎062-607-3473)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 재가노인복지시설은 고령자가 시설에 입소하지 않고 자택에서 돌봄 서비스를 제공받을 수 있도록 지원하는 장기요양 인프라로, 방문요양·방문목욕·방문간호·주야간보호 등 다양한 재가급여를 수행합니다. 신체 기능 저하 또는 치매 등으로 일상생활 수행이 어려운 노인을 대상으로 생활 지원, 건강 관리, 정서 지원, 사회적 고립 완화 등 지역 기반 돌봄의 핵심 역할을 수행합니다. 해당 데이터는 장기요양서비스 수급 구조 분석, 돌봄 공백 지역 탐색, 치매안심 서비스 연계, 안전·위생 관리 대상 파악 등 다양한 정책적 활용이 가능하며, 민간에서는 지도 기반 돌봄기관 검색, 가족 돌봄 의사결정 지원, 재가서비스 품질 비교 플랫폼, 고령친화 돌봄산업 분석 등 광범위한 분야에서 기반 데이터로 활용될 수 있습니다.
