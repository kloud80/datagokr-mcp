description_portal: '○ 통계개요* 통계명 : 국민기초생활보장 연령별 일반수급자(구별)* 통계종류 : 일반, 보고통계(승인번호 11714)* 근거법령 :「국민기초생활 보장법」 제25조* 작성목적 : 생활유지의 능력이 없거나 생활이 어려운 가구의 소재·재산 등을 파악하여차년도 국민기초생활수급자의 책정을 위한 기초자료 제공하는 것을목적으로 함* 조사체계 : 시·군·구(사회복지통합관리망)→시·도→보건복지부* 공표주기 : 매년* 공표범위 : 지역 - 서울시 및 자치구내용 - 국민기초생활보장 연령별, 구별 일반수급자 현황○ 용어설명* 기초생활보장수급자 : 국민기초생활보장법에 따라 급여를 받는 자(「국민기초생활 보장법」제2조제2호)* 일반수급자 : 시설 수급자외의 수급자* 시설수급자 : 보장시설(보장기관으로 부터 급여지급을 위탁 받은 사회 복지시설)로지정된 시설 및 시설 수급자를 말함○ 기타○ 출 처 : 보건복지부「국민기초생활보장수급자 현황」'
