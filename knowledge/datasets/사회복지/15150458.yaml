summary_user: 2024년 기준 노인 실태조사의 응답자별 원자료로, 삶의 질·건강·경제상황·사회활동·가족관계 등 995개 문항의 응답값을 코드화해 담는다. 고령정책 담당자나 연구자가 노인의 건강상태와 경제상황, 사회활동이 서로 어떻게 연결되는지 개인 단위로 분석할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 이름·코드 매핑이나 같은 기관 코드로만 잇고, 시군구·시도 단위로 연결할 수 있으면 노인 인구·시설 데이터와 함께 본다.
description_portal: 이 데이터는 2024년 기준 우리나라 노인층을 대상으로 실시한 실태조사 응답결과로, 각 개인의 삶의 질, 건강, 경제상황, 사회활동, 가족관계 등 다양한 영역을 포괄하는 설문 문항에 대한 응답자료입니다. 문항1부터 문항995까지 총 995개 항목으로 구성되어 있으며, 문항 값은 코드화되어 있어 파일탭에 제공된 문항 정보(코드북)를 통해 해석해야 합니다. 이 자료는 고령사회에 대한 정책 수립, 복지 서비스 기획, 학술 연구 등에 폭넓게 활용될 수 있으며, 특히 노인 삶의 전반을 정량적으로 분석할 수 있는 기반자료로서 가치가 큽니다.
