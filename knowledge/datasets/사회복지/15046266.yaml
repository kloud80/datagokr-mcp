description_portal: '○ 통계개요* 통계명 : 주택점유형태별 가구(일반가구)* 통계종류 : 서울시 주택현황을 점유형태별로 제공하는 지정ㆍ조사통계* 근거법령 :「인구주택총조사 규칙」(기획재정부령 제173호)* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악, 각종 정책입안의 기초자료 제공하고, 각종 가구관련 경상조사 표본틀(SamplingFrame)의 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 통계청(주관기관), 지방자치단체 및 6개 중앙행정기관(실시기관)- 일반조사구 : 시도 ⇔ 시군구 ⇔ 읍면동(총관리자) ⇔ 조사관리자 ⇔ 조사원* 공표주기 : 정기(5년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 점유형태별(자가, 전세, 월세 등)주택현황 등○ 용어설명* 자가 : 법률상 소유여하를 불문하고 실제 가구원소유로 되어있는 집을 말하며, 집을구입한 후 대금이 완불되지 않는 경우도 포함* 전세 : 일정액의 현금 또는 기타 방법으로 전세금을 내고 계약기간동안 사용하는 경우로월세를 내지않는 경우* 보증부월세 : 일정액의 보증금을 내고 매월 집세를 내는 경우를 말함* 무보증월세 : 무보증금없이 매월 일정한 액수의 집세를 내는 경우를 말함* 사글세 : 미리 몇 개월치의 집세(방세)를 한꺼번에 내고 그 금액에서 매월 1개월 분의집세(방세)를 공세하는 경우를 말함* 무상 : 관사, 사택 또는 친척집 등에서 세없이 무상으로 살고 있는 경우를 말함○ 기 타* 1990년 이전 무보증월세에 사글세 포함* 1985년 이전 보증부월세에 무보증월세, 사글세 포함* 2015년 인구주택총조사의 전수부문은 행정자료를 활용한 등록센서스 방식이 적용되었고표본부문은 현장조사(방문면접조사) 방식으로 실시되었음* 표본자료에 대한 모수추정으로 전수조사결과와 표본조사결과의 차이가 발생할 수 있음** 모수추정 : 전수결과(등록센서스 결과)를 모수로 인구, 가구 및 거처를 구분하여 모수추정'
