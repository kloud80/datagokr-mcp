summary_user: 공무원연금공단 상록골프앤리조트가 운영하는 수안보상록호텔의 객실유형(한실·양실·가족실·한실특실·로얄스위트 등)별 평수와 이용요금을 공무원 주중·주말, 일반인으로 나눠 담은 작은 요금표 파일(CSV 185바이트)이다. 재직공무원이나 연금수급자가 일반 요금 대비 얼마나 할인받는지 확인하거나, 수안보 일대 유사 숙소와 가격을 비교해 숙박계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 객실유형 이름을 손으로 맞추거나 같은 기관(공무원연금공단)의 다른 파일과 묶어 보는 방식으로만 이어 쓴다.
description_portal: 공무원연금공단 상록골프앤리조트에서 운영하는 수안보상록호텔의 객실별 이용요금 정보를 정리한 데이터로, 공무원과 일반인을 구분하여 주중·주말 기준의 요금 체계를 확인할 수 있도록 구성되어 있습니다.객실유형은 한실, 양실, 가족실, 한실특실, 로얄스위트 등으로 구분되며, 각 유형별로 평형과 이용요금이 제공됩니다.공무원 대상 요금은 일반 요금 대비 할인 적용되어 있으며, 공무원 범주는 재직공무원, 연금수급자, 퇴직연금일시금 수령자 및 배우자(부부 동반 시)로 정의됩니다. 숙박계획 수립, 유사 숙소와의 가격 비교, 공공 복지시설 이용혜택 분석 등에 활용할 수 있습니다.체크인 시간은 15시, 체크아웃은 11시이며, 보다 상세한 이용안내는 상록앤리조트 홈페이지에서 확인 가능하다.
