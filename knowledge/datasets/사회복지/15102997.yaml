description_portal: 광주광역시 광산구에서는 의료급여 수급자 중 장애 등록이 되어 있는 주민을 대상으로, 필요 시 신청을 통해 전동보조기기를 지급받은 내역을 동(行政洞) 단위로 정리한 현황 자료를 제공합니다. 이 자료는 각 동별로 전동보조기기를 지급받은 대상자의 수와 지급 일자, 기기 종류 등의 정보를 포함하고 있어, 지역사회 내 장애인 복지 서비스의 제공 현황을 상세히 파악할 수 있도록 합니다. 특히 의료급여 혜택과 장애 등록을 동시에 충족하는 주민들이 실제로 어떤 유형의 보조기기를, 어느 동에서 얼마나 지원받았는지를 통계적으로 분석할 수 있어, 광산구의 복지 정책 수립 및 지역별 서비스 격차 해소를 위한 자료로 활용할 수 있습니다.
