description_portal: 사립학교 재직 중인 교직원의 연도별 직역연금 재직기간 합산 승인 내역(사학연금, 공무원연금, 군인연금)과 관련된 데이터로 학교급별(유치원, 초등학교, 중학교, 고등학교, 전문대, 대학교, 특수학교, 법인), 직구분(교원, 사무직원), 성별(남, 여), 평균 합산기간 및 평균 반납금액 등을 제공하고 있습니다. 이 데이터를 통해 공단의 연금 관련 제도 운영 투명성을 제고하고, 재직기간 합산 제도의 이용 현황을 공개적으로 보여주고자 합니다. 또한, 연도별 직역연금 합산 승인 건수 파악을 통해 합산 관련 법령 개정 시 사용될 수 있으며 연금 제도 개선 및 관련 정책 수립을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 연금 운용을 입증하고, 이해관계자들이 공단의 제도 운영을 명확히 파악할 수 있도록 지원합니다.
