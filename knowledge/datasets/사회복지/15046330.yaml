description_portal: '○ 통계개요* 통계명 : 1인가구(연령별)* 통계종류 : 조사, 지정통계* 근거법령 : 인구주택총조사 규칙* 작성목적 : 인구규모, 분포 및 구조와 주택에 관한 제 특성을 파악하여 각종정책입안의 기초자료로 활용, 각종 가구관련 경상조사 표본틀로 활용* 조사체계 : 2010년이전 : 조사원 →동.읍.면→구.시.군→시.도→통계청2015년이후 : 행정자료를 활용한 등록센서스방식* 공표주기 : 5년(2015년이전), 1년(2016년이후)* 공표범위 : 지역 - 서울시 및 자치구내용 - 연령별 1인가구용어설명* 가구 : 1인 또는 2인 이상이 모여서 취사, 취침 등 생계를 같이하는 생활단위일반가구를 대상으로 집계단, 집단가구(6인 이상 비혈연 가구, 기숙사, 사회시설 등) 및 외국인가구 제외내국인(한국인)과 함께 살고 있는 외국인은 일반가구의 가구원으로 집계○ 기 타* 2015년까지는 5년주기, 2016년부터 1년주기로 공표* 2015년과 2016년 자료는 행정자료를 활용한 등록센서스 방식의 집계결과임* 조사기준 및 자료시점은 매년 11.1. 0시 기준* 개인정보 보호와 자료 노출 위험성을 최소하기 위하여 5미만 자료는 x로 표기함○ 출 처 : 통계청, 인구주택총조사'
