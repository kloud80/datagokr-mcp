summary_user: 부산 영도구 노인일자리 및 사회활동 지원사업을 수행기관·사업유형(공익형·사회서비스형·시장형)·사업명별로 나눠 일자리 수(명)를 담은 집계 파일로, 범위는 영도구 한 시군구입니다. 영도구에 사는 어르신이나 가족이 "어느 기관에서 어떤 노인일자리 사업을 몇 명 규모로 모집하나"를 확인하거나, 분석가가 구 단위 노인일자리 유형별 공급량을 볼 때 쓴다. 전역 조인 키가 없어 수행기관 이름으로 노인복지시설·사회복지시설 목록과 맞춰 잇거나, 같은 시군구 단위로 지역 통계와 나란히 놓고 쓴다.
