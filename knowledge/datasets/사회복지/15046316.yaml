description_portal: '○ 통계개요* 통계명 : 이혼율(연령별)* 통계종류 : 처ㆍ남편의 이혼율을 연령별로 제공하는 지정ㆍ보고통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 출생,사망,혼인,이혼에 대한 현황을 파악하여, 국가의 인구ㆍ주택ㆍ보건ㆍ사회복지ㆍ교육ㆍ교통등에 관한 정책수립 및 민간기업의 경영계획 수립에 필요한 기초자료를 제공하는것을 목적으로 함* 조사체계 : 동 → 자치구 → 서울시 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 연령별(15~75세, 5세단위) 해당연령 천명당 이혼건수를 이혼율로 제공○ 용어설명* 연령별 이혼율 : 어떤 특정 연령층에서 신고된 남녀별 이혼건수를 그 해당 연령층의 남자또는 여자인구로 나눈 수치를 1,000분비로 나타낸 것* 연령별 이혼율(‰)=(연령별 발생한 이혼수/해당연령층의 남자 또는 여자 인구)×1,000○ 기 타* 이혼연령은 남자와 여자가 서로 상이할 수 있으므로 연령별이혼율을 작성하기 위해서는남자인구 또는 여자인구 기준으로 계산됨'
