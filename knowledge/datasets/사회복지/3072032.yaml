summary_user: 대구광역시 서구 관내에서 운영 중인 지역아동센터를 센터 한 곳당 한 행으로 담은 파일로, 운영주체 유형(개인·법인·사회적협동조합), 센터명, 도로명 소재지, 법정동, 정원, 전화번호를 포함한다. 서구에 사는 보호자가 집 근처 법정동에 방과후 돌봄을 받을 수 있는 지역아동센터가 있는지, 정원은 몇 명인지 확인하는 데 쓰고, 분석가는 동별 돌봄시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 법정동 이름이나 센터명·주소를 매칭해 이어 쓰며, 사회복지시설 공통 마스터를 참조해 다른 아동·가족 복지시설 목록과 함께 본다.
description_portal: 방과후 돌봄이 필요한 지역사회 아동의 건전육성을 위하여 보호,교육, 건전한 놀이와 오락의 제공, 보호자와 지역사회 연계 등 종합적인 복지서비스 제공기관으로 지역아동센터명, 소재지, 정원(명), 전화번호를 포함하고 있습니다.본 데이터는 대구광역시 서구 관내에서 운영 중인 지역아동센터의 세부 현황을 제공한다. 항목은 운영주체 유형(개인, 법인, 사회적협동조합), 센터명, 소재지, 법정동, 정원, 전화번호로 구성되어 있다. 지역아동센터는 지역사회 내 취약계층 아동을 대상으로 방과 후 돌봄, 학습 지원, 정서적 안정 등을 제공하는 복지시설이다. 각 센터별 정원은 19명에서 39명까지 다양하며, 법정동 기준으로 분류되어 행정구역별 분포 현황을 확인할 수 있다. 소재지에는 도로명 주소와 층수 등 상세 정보가 포함되어 이용자의 접근성과 편의성을 높인다. 본 데이터는 돌봄 서비스 정책 수립, 복지자원 분포 분석, 지역별 아동시설 접근성 평가 등의 행정적‧연구적 목적에 활용될 수 있다.
