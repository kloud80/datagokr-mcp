summary_user: 경기도 내 의료법인이 의료업무 외에 부대사업으로 운영하는 장례식장·음식점·편의점 등 편의시설의 인허가 정보를 사업장 한 곳씩 담으며, 시군명, 인허가·폐업일자, 영업상태, 면적, 도로명·지번 주소, WGS84 좌표가 들어 있다. 병원 이용자나 지역 분석가가 "우리 시군 의료법인 안에서 영업 중인 장례식장·편의시설은 어디에 있고, 언제 인허가·폐업했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드·시군명이나 주소·좌표로 이어 붙이고, 같은 경기도 데이터와는 시군 코드로 묶는다.
description_portal: 이 데이터는 경기도 내 의료법인에서 의료업무 외 부대적으로 운영 중인 편의시설에 대한 인허가 정보를 제공합니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지면적, 도로명 및 지번 주소, 우편번호, 위치정보(WGS84 위도 및 경도) 등으로 구성되어 있습니다. 해당 시설 유형에는 장례식장, 휴게음식점, 일반음식점, 편의점 등 의료기관 부지 내에서 설치 및 운영이 가능한 사업장이 포함됩니다. 이 데이터는 의료시설 이용자에게 제공되는 편의서비스 현황을 파악하거나, 보건복지 인프라의 지역별 분포 분석, 의료복합시설 계획 수립 등에서 활용될 수 있습니다. 데이터는 주간 단위로 갱신되며, Open API 형태로 제공되어 공공기관 및 민간 플랫폼에서 시스템 연동을 통한 활용이 가능합니다.
