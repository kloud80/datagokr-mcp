description_portal: 광주광역시 광산구의 무연고 사망자 현황에 관한 데이터를 제공합니다. 이 자료는 2017년부터 2023년까지 연도별로 집계된 무연고 사망자 수를 포함하고 있으며, 성별로는 남성과 여성 구분이 명확하게 이루어져 있습니다. 또한, 사망자의 연령대별 분포도 10대부터 90대까지 다양한 연령층을 세분화하여 제공함으로써, 무연고 사망자의 특성을 보다 구체적으로 파악할 수 있도록 돕습니다. 이러한 정보는 지역사회 복지 정책 수립과 지원 방안 마련, 사회 안전망 강화에 중요한 기초 자료로 활용되며, 무연고 사망자 문제에 대한 체계적인 분석과 대응을 가능하게 합니다.
