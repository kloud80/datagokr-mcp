summary_user: 국민연금 사업장가입자 수를 기준년월별로 납부기간 구간(1~11개월, 12~35개월, 36~59개월, 60~119개월, 120개월 이상)과 합계로 나눈 전국 단위 집계표이며, 파일 크기가 740바이트에 불과한 작은 CSV다. 분석가가 "사업장가입자 가운데 장기 납부자(10년 이상) 비중이 해마다 어떻게 달라지는가"처럼 납부기간 분포의 변화를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 사업자번호 등으로 사업장 원장과 직접 잇지는 못하고, 같은 공단의 다른 가입자 통계와 기준년월을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 합계만 담은 비공간 집계라서 지역별·사업장별·업종별 분석에는 쓰지 못한다. 사업장 단위 원장과 달리 사업자번호가 없어 국세청·공정위 등 기업 데이터와 연결되지 않는다.
