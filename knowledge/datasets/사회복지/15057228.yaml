summary_user: 경기도 새일센터가 경력단절 여성을 대상으로 운영한 직업훈련 과정을 과정 한 건씩 담으며, 교육년도·시군·새일센터명·위탁기관·과정유형·직종 분류·교육기간·교육인원을 포함한다. 구직 중인 경력단절 여성이 우리 시군 새일센터에서 어떤 분야 훈련이 열리는지 찾거나, 분석가가 시군별 훈련 직종 구성과 교육인원을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)나 새일센터명 같은 이름 매핑으로만 다른 데이터와 잇고, 시설 정보는 사회복지시설 공통 마스터를 참조한다.
description_portal: 경기도 내 경력단절 된 여성의 취업지원을 위한 교육훈련프로그램 현황입니다. 새일센터명, 과정유형명, 훈련과정선정내역 등의 정보를 제공합니다. 경력단절여성이란 임신ㆍ출산ㆍ육아와 가족의 돌봄 등을 이유로 경제활동을 중단하였거나 경제활동을 한 적이 없는 여성 중에서 취업을 희망하는 여성을 말합니다.이 데이터는 경기도 내 경력단절여성을 대상으로 한 새일센터의 직업훈련 프로그램 운영 현황을 수록한 자료입니다. 주요 항목은 교육년도, 시군명, 새일센터명, 과정유형 및 세부유형, 훈련과정 제목, 직종 대분류 및 중분류, 교육시간, 교육 시작 및 종료일, 교육인원수 등으로 구성되어 있습니다. 각 훈련과정은 고부가가치 전문기술, 일반 사무, 창업 실무 등 다양한 분야로 나뉘며, 교육 과정의 구성과 수요 기반 맞춤형 프로그램 운영 실태를 분석할 수 있습니다. 본 데이터는 여성 일자리 창출 정책 평가, 직업 재교육 수요 분석, 지역별 고용서비스 개선 자료로 활용될 수 있습니다.
