description_portal: '- 전라남도 내 화장시설 현황(시설명, 운영주체, 위치, 전화번호, 운영화로, 이용요금, 관리인원 등)에 대해 조회하실 수 있습니다.- 전라남도에는 공공 화장시설이 운영되고 있으며, 이는 지역 주민들에게 장례 서비스를 제공하는 중요한 시설입니다. 이러한 시설들은 환경 친화적인 장사 방법으로, 고인의 마지막 길을 존중하는 의미를 담고 있습니다.- 이용 대상 : 각 시설은 해당 시·군의 주민등록상 주소지를 기준으로 이용 자격이 부여됩니다.- 신청 방법 : 각 시·군청의 장사시설 담당 부서나 해당 시설의 사무실을 통해 신청할 수 있으며, 일부 시설은 온라인 예약 시스템을 운영하기도 합니다.- 자세한 사항은 각 시·군청의 공식 웹사이트나 장사시설 담당 부서에 문의하시기 바랍니다.'
