summary_user: 세종특별자치시에 설치된 전동휠체어 급속충전기를 설치 시설 한 곳당 한 건으로 담으며, 시설명·도로명/지번 주소·위경도, 설치 장소 설명, 평일·토요일·공휴일 운영시간, 동시 사용 가능 대수, 공기주입기·휴대전화 충전 가능 여부, 관리기관과 전화번호를 포함한다. 전동휠체어 이용자나 보호자가 '지금 근처에서 운영 중인 충전기가 어디 있고 몇 대를 동시에 쓸 수 있나'를 확인하거나, 복지·교통 담당자가 충전 인프라의 지역 분포를 점검하는 데 쓴다. 공통 조인 키(건물관리번호·PNU 등)는 없으므로 다른 편의시설·장애인 화장실 데이터와는 주소나 위경도 좌표를 기준으로 매칭해 이어 쓴다.
description_portal: 세종특별자치시 세종특별자치시 전동휠체어급속충전기 소재 시설 명칭, 주소, 설치 장소, 운영시간, 동시 사용 가능 대수, 공기주입기 비치 여부, 관리기관 정보를 제공합니다.
