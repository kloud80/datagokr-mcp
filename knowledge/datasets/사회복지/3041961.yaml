summary_user: 광주광역시 등록 장애인 수를 장애유형 15종별로 나누어 장애정도(심한·심하지 않은)와 성별(남·여·합계)로 집계한 시도 단위 통계 파일(csv, 약 1.2KB)이다. 복지 담당자나 분석가가 '광주에서 심한 장애로 등록된 지적·자폐성 장애인은 남녀 각각 몇 명인가' 같은 질문에 답할 때 쓴다. 전역 조인 키가 없어 다른 시도의 등록현황이나 장애인 복지 통계와는 시도명·장애유형명을 이름으로 맞춰 이어 붙여야 한다.
description_portal: '광주광역시 장애인 등록현황에 대한 데이터로, 2025년 4월말 기준  장애유형별, 장애정도별 및 성별 기준에 따른 광주광역시 장애인 등록현황을 제공합니다.○ 광주광역시 장애인 등록현황 데이터1. 장애유형 : 지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐성, 정신, 신장, 심장, 호흡기, 간, 안면, 장루·요루, 뇌전증 (15종)2. 장애정도별 : 심한장애, 심하지 않은 장애3. 성별 : 남, 여4. 지역 : 광주광역시5. 데이터기준일 : 2025. 4. 30.6. 자료출처 : 행복이음 사회보장통계정보시스템○ 자료설명1. 장애정도별    1) 심한장애 : 종전1급, 종전2급, 종전3급    2) 심하지않은장애 : 종전4급, 종전5급, 종전6급2. 장애유형    1) 지체장애 : 절단장애, 관절장애, 지체기능장애, 척추장애, 변형 등의 장애    2) 뇌병변장애 : 뇌의 손상으로 인한 복합적인 장애    3) 시각장애 : 시력장애, 시야결손장애, 겹보임(복시)    4) 청각장애 : 청력장애, 평형기능장애    5) 언어장애 : 언어장애, 음성장애, 구어장애    6) 안면장애 : 안면부의 추상, 함몰, 비후 등 변형으로 인한 장애    7) 신장장애 : 투석치료중이거나 신장을 이식 받은 경우    8) 심장장애 : 일상생활이 현저히 제한되는 심장기능 이상    9) 간장애 : 일상생활이 현저히 제한되는 만성·중증의 간기능 이상    10) 호흡기장애 : 일상생활이 현저히 제한되는 만성·중증의 호흡기기능 이상    11) 장루·요루장애 : 일상생활이 현저히 제한되는 장루·요루    12) 뇌전증장애 : 일상생활히 현저히 제한되는 만성·중증의 뇌전증    13) 지적장애 : 지능지수가 70이하인 경우    14) 자폐성장애 : 소아청소년 자폐 등 자폐성 장애    15) 정신장애 : 조현병, 조현정동장애, 양극성정동장애, 재발성우울장애, 강박장애, 투렛장애, 기면증, 뇌의 신경학적 손상으로 인한 기질성 정신장애'
