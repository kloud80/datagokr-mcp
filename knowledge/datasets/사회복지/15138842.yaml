summary_user: 울산광역시 북구 안에 있는 경로당을 한 곳당 한 행으로 담은 파일 데이터로, 경로당 이름과 도로명주소, 행정동이 들어 있습니다. 북구 주민이 우리 동네 가까운 경로당을 찾거나, 분석가·담당 부서가 행정동별 노인 인구와 견주어 경로당이 부족한 동을 찾고 신규 설치 후보지를 정할 때 씁니다. 전역 조인 키는 없으므로 행정동 이름을 맞춰 행정동별 인구·고령인구 같은 지역 통계와 잇고, 도로명주소를 좌표로 바꿔 장기요양기관 등 다른 노인복지시설과 위치를 겹쳐 봅니다.
description_portal: 울산광역시 북구 내의 경로당 현황에 대한 정보로 연번, 경로당명, 경로당의 도로명주소, 행정동에 대한 정보를 포함하고 있습니다.이 데이터는 행정동별 인구밀집도,  인구수와 결합하여 경로당 개수로 경로당 신규 설치 시 적정 장소를 산정하는 데에 활용가능합니다. 또한, 경로당의 존재여부 혹은 밀집도로 노령인구수와 함께 노인복지관련 정책을 수립함에 있어서도 참고자료로 활용가치가 있습니다.추가적인 문의사항은 노인장애인과(경로당 담당), 미디어정보과(공공데이터 담당)에 연락하기시 바랍니다.
