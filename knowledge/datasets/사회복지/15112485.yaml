description_portal: 본 데이터는 관악구의 연령·행정동별 장애인 등록 현황을 다룬 자료입니다. 본 데이터는 시도·시군구, 연령(1세~33세 이상), 각 행정동별 등록 장애인 수, 데이터기준일자 항목을 포함합니다. 세부 항목에는 보라매동부터 대학동·난향동까지 총 21개 행정동이 모두 포함되며, 연령별 장애인 분포를 정량적으로 파악할 수 있도록 구성되어 있습니다.이 자료는 연령대별 장애인 집중 비율 분석, 행정동별 복지 수요 예측, 장애인지원 서비스의 공간적 배분 검토, 향후 정책 기초자료 구축 등에 활용할 수 있습니다. 특히 특정 연령대에서 장애인 비율이 높은 지역을 식별하여, 이동지원·학령기 지원·청년 장애인지원 등 맞춤형 정책 설계가 가능하다는 점에서 행정 실무와 복지 기획에 유용한 기반 정보를 제공합니다.
