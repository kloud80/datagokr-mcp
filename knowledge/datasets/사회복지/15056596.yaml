summary_user: 경기도 등록장애인 수를 기준연도(STD_YY)와 장애유형별로 집계해 총계, 1~6급 등급별 인원, 심한 장애인·심하지 않은 장애인 수를 담은 집계 자료로, 개인별 원천 기록이 아니다. 복지 분석가나 정책 담당자가 '경기도 뇌병변 장애인 중 중증 비율이 얼마이고 해마다 어떻게 바뀌나'처럼 유형별 등급 분포와 복지 수요를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도와 장애유형명을 이름으로 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 등록장애인을 장애유형과 등급(1~6급)별로 집계한 현황 자료입니다. 보건복지부와 경기도청 장애인복지과가 제공하며, 매년 12월 말 기준으로 작성됩니다.세부 항목에는 장애유형명, 총계, 등급별 장애인 수(1~6급), 심한 장애인 수, 심하지 않은 장애인 수가 포함됩니다. 예를 들어, 청각장애 유형의 경우 2급 장애인이 5천 명, 심하지 않은 장애인이 3만 명이면, 해당 값이 각각 기록됩니다.이 데이터는 장애등급제 기반의 복지 수요 분석에 활용할 수 있습니다. 예를 들어, 뇌병변 장애인의 경우 중증(1~2급) 비율이 높다면 재활·돌봄 지원 정책 강화가 필요하다는 근거가 됩니다. 반면, 청각·언어장애 유형에서 경증(4~6급) 비율이 많다면 교육·취업 지원 정책을 강화하는 방향으로 정책을 설계할 수 있습니다.또한, 유형별 등급 분포를 분석하면 특정 장애유형에서 고령화 및 중증화 경향을 조기에 파악할 수 있어, 장애인 건강관리 및 사회서비스 자원 배분에 중요한 참고자료가 됩니다.
