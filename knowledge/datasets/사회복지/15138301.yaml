summary_user: 전국민마음투자 바우처로 심리상담을 제공하는 기관을 한 건씩 담은 목록으로, 기관마다 시도명·시군구명·제공기관명·주소를 전국 범위로 담는다. 우울·불안 등으로 상담을 받으려는 국민이 내가 사는 시군구에서 바우처를 쓸 수 있는 상담기관이 어디인지 찾거나, 분석가가 지역별 제공기관 분포를 볼 때 쓴다. 공통 조인 키나 행정코드가 없어 다른 지역 통계와는 시도명·시군구명 같은 이름을 매핑해 잇거나 주소를 지오코딩해 연결해야 한다.
description_portal: '보건복지부에서 2024년 9월 13일 기준으로 전국민마음투자 바우처를 제공하는 기관목록에 대한 정보(시도명, 시군구명, 제공기관명, 주소)를 제공하고 있습니다.<데이터 이용 시 참고사항>1. 전국민마음투자지원사업 : 우울/불안 등 정서적 어려움이 있는 국민에게 대화 기반의 전문 심리상담 서비스를 제공하여, 국민의 마음건강 돌봄, 자살 예방 및 정신질환 조기 발견을 목적으로 하고 있습니다.2. 등록 관할기관 : 전국민 마음투자 지원사업 제공기관은 사업장 주 소재지 관할 시･군･구청장(보건소) 등록을 진행하고 있습니다.'
