description_portal: '해운대구에서 추진하는 장애인 일자리 사업 현황에 관한 기본정보를 제공하는 데이터입니다.본 데이터는 일자리 유형, 임금, 근로시간, 배치기관, 사업 추진내용, 사업기간 등을 포함하며, 장애인 근로자의 안정적인 고용기회 확대와 사회참여 증진을 목적으로 합니다.- 일자리유형 : 전일제, 시간제, 복지일자리, 시각장애인안마사파견- 배치기관 : 주민센터, 우체국, 비영리사회복지시설 등- 사업 추진내용 : 행정도우미, 환경정비, 장애인주차구역 단속 등이를 통해 장애인에게 적합한 일자리 발굴과 맞춤형 배치를 지원하고, 유관기관 및 정책 담당자가 현황을 파악하여 제도 개선 및 신규 사업 발굴에 활용할 수 있습니다.'
