description_portal: 성남시는 고령사회에 대응하고 어르신들의 복지·여가·자립생활을 지원하기 위해 노인 종합복지관을 주요 거점형 기반시설로 운영하고 있다. 현재 성남시에는 수정노인종합복지관, 중원노인종합복지관, 분당노인종합복지관 등 3개의 권역별 노인복지관이 설치되어 있으며, 각 복지관은 지역 특성에 맞춘 여가활동, 건강증진, 평생교육, 사회참여, 일자리 연계 프로그램을 운영하고 있다. 복지관은 대부분 사회복지법인이나 재단이 수탁 운영하며, 성남시가 예산을 지원하고 성과관리를 병행한다.이들 복지관은 평균 1만 명 이상의 어르신 회원이 등록되어 있으며, 주간 이용자 수는 수백 명에 달할 정도로 이용률이 높다. 주요 프로그램으로는 스마트폰 교육, 건강체조, 노인대학, 미술·음악 활동, 자조모임, 무료급식(경로식당) 등이 있으며, 일부 복지관은 치매예방 교실이나 ICT 체험존, 고립노인 지원사업도 함께 운영한다. 또한 노인일자리사업, 공공일자리 연계 등 경제적 자립 지원 기능도 함께 수행하고 있다.
