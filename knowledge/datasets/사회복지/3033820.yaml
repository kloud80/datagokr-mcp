summary_user: 대전광역시 중구에 있는 노인복지시설을 시설 한 곳당 한 행으로 담은 파일이며, 시설종류(노인의료·노인주거·재가노인복지시설), 종류 안의 세부 시설, 시설명, 도로명주소, 우편번호, 전화번호, 정원수, 법인명을 포함한다. 주민이나 보호자가 '중구에서 정원 몇 명 규모의 요양·양로시설이 어디에 있고 어느 법인이 운영하는가'를 찾을 때 쓰고, 분석가는 구 단위 노인 돌봄 시설 공급을 파악하는 데 쓴다. 전역 조인 키가 없어 장기요양기관 목록이나 다른 시설 데이터와는 시설명·주소를 맞춰 대조해야 하며, 시군구 단위 지역 통계와는 대전 중구라는 지역으로 잇는다.
limits: 대전 중구 한 곳만 다루므로 다른 구나 시도와 비교하려면 별도 데이터를 모아야 한다. 시설코드 같은 공통 식별자가 없어 다른 데이터와 연결할 때 시설명·주소 매칭 오류에 주의해야 한다.
