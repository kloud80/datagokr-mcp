description_portal: 자활기업은 2인 이상의 수급자 또는 저소득층이 상호 협력하여 조합이나 공동사업자의 형태로 탈빈곤을 위한 자활사업을 운영하는 업체를 의미합니다. 2012년 8월 2일 국민기초생활보장법 개정에 따라 기존 "자활공동체"에서 "자활기업"으로 명칭이 변경되었습니다.현재 자활기업의 현황을 파악할 수 있도록 자활기업 직원 규모별 개소 및 비중에 대한 상세 정보를 제공합니다. 이 데이터는 자활기업의 규모별 분포를 보여주며, 소규모부터 대규모까지 각 기업이 고용하는 인원 현황을 분석할 수 있도록 돕습니다.
