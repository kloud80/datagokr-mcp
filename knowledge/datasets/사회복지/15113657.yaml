description_portal: 경기도 하남시 행정동별 기초생활수급자에 대한 데이터로 일반수급자 가구수, 수급권자수, 시설수급자 가구수, 수급권자수 등의 항목을 제공하고 있습니다.하남시의 기초생활보장 대상자를 읍면동 단위로 체계적으로 집계한 기초생활수급자 행정통계로, 기초생활보장제도 운영의 핵심 관리지표를 제공한다. 가구수 합계와 수급권자수 합계는 해당 지역의 취약계층 규모를 정량적으로 보여주며, 일반수급자와 시설수급자를 분리하여 기록함으로써 일반·시설 수급자 분리집계가 가능합니다. 특히 일반수급자 내에서도 기본 가구와 기타 유형을 구분해 관리하고 있어, 수급 형태별 지원 정책 검토에 활용도가 높습니다. 읍면동 정보는 지역별 취약계층 분포와 인구·복지시설 수요를 파악하는 핵심 기준이 되며, 이는 복지 예산 배분, 사례관리 인력 배치, 위기가구 발굴 등 사회보장 정책기준 데이터로 직접 연결됩니다.
