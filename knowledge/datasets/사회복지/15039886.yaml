description_portal: 시민 참여 문화 확산과 자원봉사 활동에 대한 관심 증대로 공공기관의 자원봉사 프로그램 참여 수요가 지속적으로 증가하고 있으며, 도서관의 공공서비스 향상과 지역 사회 기여를 위한 시민 참여형 운영 모델의 중요성이 커지고 있습니다. 평생학습 사회 구현과 지식 나눔 문화 확산을 위한 도서관 자원봉사자들의 역할이 확대되면서, 체계적인 자원봉사 관리와 효율적인 인력 운영이 필요하게 되었습니다. 자원봉사자들의 다양한 전문성과 경험을 활용한 도서관 서비스 다양화와 품질 향상 요구가 증가하고 있으며, 지역 주민들의 도서관에 대한 애착과 소속감 증진을 통한 공동체 의식 강화가 중요해지고 있습니다. 또한 자원봉사 프로그램 운영의 투명성 확보와 참여자들의 활동 현황 파악을 통한 효과적인 자원봉사 관리 체계 구축이 필요하며, 자원봉사 문화 확산과 참여 활성화를 위한 데이터 기반 정책 수립의 중요성이 증대되고 있어, 충청남도 보령시는 관내 도서관별 자원봉사 신청 현황, 신청 시기, 참여 시간 등 도서관 자원봉사 프로그램 운영과 시민 참여 활성화에 필요한 종합적인 자원봉사 신청 정보를 제공하고 있습니다.
