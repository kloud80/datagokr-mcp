summary_user: 한국영유아보육교육진흥원이 2005년부터 교부한 보육교사 자격증 건수를 연도별로 1급·2급·3급으로 나눠 담은 전국 단위 집계표이다(csv 565바이트). 보육 인력 정책 분석가나 연구자가 "연도별로 보육교사 자격 취득자가 늘었는지, 급수 구성이 어떻게 바뀌었는지"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도(구분) 기준으로 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 한국영유아보육·교육진흥원이 2005년부터 2026년 6월말까지 보육교사 및 어린이집 원장 자격증을 교부한 연도별 현황을 정리한 자료입니다. 보육교사 자격증은 1급과 2급, 3급으로 구분되며, 각 연도별 교부 건수가 INT 형식으로 제공됩니다. 데이터는 연도별로 자격증 교부 실적을 확인할 수 있도록 구성되어 있으며, 보육 인력 자격 취득 현황을 수치적으로 파악할 수 있는 구조를 가지고 있습니다. 컬럼은 연도, 1급 자격증 수, 2급 자격증 수, 3급 자격증 수로 구성되어 있으며, 표 형식의 정량 데이터로 되어 있어 시계열 기반의 변화 추이 분석이 가능합니다. 자격제도 운영 상황을 간단명료하게 파악할 수 있도록 설계된 기본 통계자료입니다.
