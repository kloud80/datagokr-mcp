summary_user: 인천광역시 군·구별로 임산부 등록·관리 실적을 집계한 통계 파일로, 군구명과 임산부 등록관리 건수 두 항목만 담은 146바이트 규모의 CSV입니다. 보건 담당자나 분석가가 인천 어느 군·구에서 임산부 등록 관리 실적이 많고 적은지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 군구 이름을 행정구역 코드로 매핑해 이어 써야 한다.
description_portal: 인천광역시가 제공하는 모자 보건 사업 실적 현황 공공데이터는 시 내 군/구별로 임산부 등록 및 관리 실적을 집계한 통계 자료입니다. 이 데이터는 지역 사회의 임산부 및 영유아 건강 증진 사업 이행 현황, 모자 보건 서비스의 지역별 분포, 출산 및 양육 지원 정책의 효과 등을 파악하는 데 활용됩니다. 이 자료는 지역 출산 가정을 위한 보건 서비스 지원 실태를 파악하고 모자 보건 정책을 효율적으로 수립하는 데 필수적인 정보입니다. 해당 데이터는 공공데이터포털에서 제공하고 있으며, CSV파일로 다운로드 할 수 있습니다.
