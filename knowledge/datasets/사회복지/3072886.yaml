description_portal: 대전광역시시설관리공단에서 관리 운영 중인 기성종합복지관에서 보유하고 있는 도서 현황 정보를 제공하고 있습니다. 기성종합복지관의 주소는 대전광역시 서구 서구 장안로 54 이며 체육, 환경, 복지, 기반 중 복지시설에 해당됩니다. 도서 현황은 신규 도서 구입 및 폐기 등의 사유로 변경될 수 있음을 알려드립니다. 해당 파일에서 제공하는 정보는 등록번호, 서명, 저자, 출판사, 출판년도, 청구기호, 도서상태입니다. 기성종합복지관 도서목록 데이터 기준일은 2025년 7월 1일 입니다. 추가로 필요하신 사항이 있다면 공공데이터 담당자(042-610-2746)에게 문의하여 주시기 바랍니다.
