summary_user: 공무원연금공단이 관리하는 공무원 퇴직자를 연령대(구분)별로 나누고 명예·정년·일반·당연퇴직, 직권면직, 사망, 기타 등 퇴직사유별 인원을 센 전국 단위 집계표로, 1.5KB 남짓의 작은 CSV 파일입니다. 인사·조직 분석가가 '어느 연령대에서 명예퇴직이나 정년 전 일반퇴직이 몰리는가'처럼 연령대별 퇴직사유 구성을 볼 때 쓴다. 전역 조인 키가 없어 다른 직역연금(사학·군인연금) 퇴직 통계나 같은 공단의 다른 표와는 연령대·퇴직사유 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '공무원연금공단에서 관리하는 퇴직자 현황을 연령별 및 퇴직사유별로 구분하여 집계한 자료로, 특정 시점 기준으로 퇴직자를 퇴직사유별로 제공하고 있습니다.각 연령대별 퇴직사유 특징을 분석하여 조직 관리에 활용할 수 있습니다.퇴직사유 : 명예퇴직, 정년퇴직, 일반퇴직, 당연퇴직, 직권면직, 해임, 금품수수, 파면, 사망, 기타1. 기타는 파면, 해임, 실종 등임2. 명예퇴직에는 조기퇴직인원 포함3. 2013년도 인사관련 신분변동 항목 조정에 따라 의원면직, 조기퇴직 등 7개 항목이 "일반퇴직"으로 통합'
