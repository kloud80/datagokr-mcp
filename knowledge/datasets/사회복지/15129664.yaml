summary_user: 한국수력원자력이 건설 중인 원전의 보조기기(발전설비용 기기) 공급업체와 연 간담회를 건별로 기록한 원천 목록으로, 주관부서·공급사·품목번호·품목명·일자·내용을 담은 1,184바이트 규모의 소형 CSV 파일이다. 원전 협력업체나 산업 연구자가 '한수원이 어느 공급사와 어떤 품목을 두고 언제 간담회를 열었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 공급사명이나 품목번호를 이름 기준으로 맞추거나 같은 기관(한국수력원자력)의 다른 공개데이터와 기관 단위로만 이어 쓴다.
