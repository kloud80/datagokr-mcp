description_portal: 사립학교교직원연금공단이 소유한 보유회관(나주회관)의 에너지원별(전기, 열(스팀), 수도, 태양광발전) 사용 현황과 보유회관의 연도별 연료구분(전기, 열, 수도, 태양광)을 단위별로 제공합니다. 에너지원별 단위는 전기(MWh), 열(스팀)(Gcal), 수도(Ton), 태양광발전량(소비량)(KWh)이며 최근 5개년(직전년도 기준) 회관별 수입에 대한 데이터를 제공하고 있습니다.해당 데이터는 기관의 에너지 관리 효율성을 제고하고 에너지 절감 방안을 모색하는데 활용될 수 있습니다. 또한 공공기관의 에너지 사용 투명성을 확보하고 관련 연구 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다.
