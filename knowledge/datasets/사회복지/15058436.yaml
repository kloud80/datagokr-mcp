summary_user: 경기도 내 여성복지시설을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군, 사업장명, 인허가일자, 영업상태(운영중·폐업), 시설 종류(성폭력·가정폭력 상담소 등), 도로명·지번주소, 좌표를 포함한다. 여성정책 담당자나 분석가가 '우리 시군에서 운영 중인 성폭력상담소는 어디에 몇 곳인가'처럼 지역별 시설 분포와 접근성을 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)이나 시설명으로 맞추거나, 좌표로 다른 공간 자료와 겹쳐 쓴다.
description_portal: 경기도 내 여성 복지시설 현황입니다. 남녀평등의 촉진, 여성의 사회참여 확대 및 복지 증진을 위한 시설에 대한 정보입니다. 사업장명, 소재지주소(도로명, 지번) 등의 정보를 제공합니다.이 데이터는 경기도 내 여성복지시설의 설치 및 운영 현황을 담은 자료로, 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태(운영중·폐업 등), 여성복지시설 종류명, 도로명 및 지번주소, 우편번호, 위도·경도 좌표(WGS84) 등이 포함되어 있습니다. 여성복지시설에는 성폭력상담소, 가정폭력상담소, 육아종합지원센터, 청소년 성폭력상담소 등 다양한 유형이 포함되며, 각 시설은 폭력피해자 지원, 여성 권익 보호, 육아지원 서비스 제공 등의 역할을 수행합니다. 이 데이터는 여성 안전 정책 수립, 지역사회 보호 인프라 분석, 상담서비스 접근성 향상, 여성 권익 강화 사업 기획 등에 활용될 수 있습니다. 특히 주소 및 좌표 정보를 활용하면 지역별 시설 분포 분석, 복지 사각지대 파악에도 유용합니다. 본 자료는 지자체 여성가족과 또는 보건복지부 산하 여성복지 관련 기관이 수집한 공식 공공데이터입니다.
