description_portal: "본 데이터는 경기도 안성시\uFEFF 관할 구역 내 기초생활보장\uFEFF 수급권자의 행정동별\uFEFF 현황을 정리한 통계자료이다. 각 행정동별로 일반수급자, 조건부수급자, 특례수급자 등 수급자 유형을 구분하여 수급권자 수와 가구수를 제공한다. 이를 통해 지역별 저소득층 분포와 복지 대상자의 규모를 한눈에 파악할 수 있으며, 복지 예산 배분과 사업 대상 선정에 활용이 가능하다. 행정동 단위의 상세한 구분정보를 제공하므로, 동별 복지 수요를 비교·분석하고 취약지역을 식별하는 데 유용하다. 본 데이터는 안성시 복지 담당 부서에서 관리하는 행정자료를 기반으로 구성되며, 복지정책 수립, 맞춤형 복지서비스 제공, 관련 통계 작성 등 다양한 행정업무에 참고자료로 활용된다. 연구기관, 공공기관 및 일반 시민은 본 자료를 통해 안성시 기초생활보장\uFEFF 수급 구조와 지역 간 격차를 이해할 수 있다."
