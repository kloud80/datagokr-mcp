description_portal: 이 데이터는 대구광역시 서구 관내 무연고 사망자에 대한 성별 및 연령대별 통계를 연도별로 수록한 자료이다. 고독사 및 사회적 고립의 실태를 파악하고 관련 정책 수립에 활용하기 위하여 제공된다. 구분 항목은 남녀로 나누어 40세 미만부터 70세 이상까지의 연령대로 구성되어 있으며, "미상 및 기타" 항목을 포함한다. 2017년부터 2025년까지 9개년간의 데이터를 포함하고 있으며, 연도별 변화 추이 및 성별·연령별 사망자 수의 비교가 가능하다. 해당 정보는 복지사각지대 발굴, 지역 복지 정책 수립, 사회 안전망 강화를 위한 기초자료로 활용될 수 있다.
