description_portal: '해당 데이터는 서울시 장애인 현황(등급별/연령별) 통계입니다.○ 통계개요* 통계명 : 장애인 현황(등급별/연령별)* 통계종류 : 서울시 장애인 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「장애인복지법」및 동법 시행규칙에 의거 자치구에 등록된 장애인 현황* 작성목적 : 장애인의 전반적인 현황을 파악하여 장애인 관련 정책 수립을 위한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 장애인자립지원과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 등록장애인의 장애등급별ㆍ연령별 현황'
