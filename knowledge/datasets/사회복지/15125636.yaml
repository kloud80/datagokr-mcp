summary_user: 청소년 상담 사례 중 성 문제를 학교급·학년별로 나눈 전국 단위 집계표로, 차트 제목·구분·X축·Y축 항목과 그 값(chtVl)을 행으로 담는다. 성교육 담당자나 청소년 정책 분석가가 '어느 학교급·학년에서 어떤 성 문제 상담이 많은가'를 비교해 예방교육 시기와 상담 개입 대상을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학년·학교급 같은 이름 매핑이나 같은 기관의 다른 청소년 상담 현황 표로만 이어 쓴다.
description_portal: 청소년 상담 학교, 학년별 성 문제  현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.이 데이터는 교육 단계별로 나타나는 성 관련 이슈를 구체적으로 파악할 수 있게 해줍니다. 학교급별 및 학년에 따른 성 인식 차이와 문제 발생 양상을 비교 분석함으로써, 시기별 성교육 강화 방안을 마련하는 데 유용하며, 성 문제의 유형별 분포를 통해 학교 현장의 예방교육 및 맞춤형 상담 개입 전략 수립이 가능합니다. 학생들의 발달 특성에 맞춘 체계적인 성 인식 개선 정책 수립에 활용될 수 있습니다.
