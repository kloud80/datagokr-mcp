summary_user: 경기도 청각장애인의 인공달팽이관 수술 후 재활치료비 지원을 기준년도·시군별로 묶은 집계 자료로, 지원 인원(명)과 지원 금액(원)을 담는다. 복지 분석가나 지자체 담당자가 '어느 시군에서 재활 지원 인원과 금액이 해마다 어떻게 바뀌었나'처럼 지역별 지원 규모와 사각지대를 살피는 질문에 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 자료와는 시군 코드(SIGUN_CD)나 시군명을 이름·코드 매핑하거나 같은 기관(경기도) 자료끼리만 연결한다.
description_portal: 이 데이터는 청각장애인을 대상으로 한 인공달팽이관 수술 이후 재활 치료 지원 현황을 연도별·지역별로 집계한 자료입니다. 주요 항목에는 기준년도, 시군명, 지원인원수(명), 지원금액(원)이 포함되어 있으며, 이를 통해 지역별 재활 지원 규모와 수혜 인원을 파악할 수 있습니다. 해당 데이터는 지방자치단체별로 인공달팽이관 재활치료비 지원이 어떻게 이루어지고 있는지 확인할 수 있으며, 의료 서비스 접근성 평가와 복지정책 수립에 기초자료로 활용됩니다. 특히 연도별 변화를 통해 재활치료 지원 정책의 효과성을 검토하고, 지원 사각지대 여부를 확인할 수 있습니다.
