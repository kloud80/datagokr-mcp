summary_user: 대전광역시 중구 관내 어린이집을 한 곳당 한 행으로 담은 시설 목록으로, 유형(민간·가정·국공립 등), 인가일, 주소, 특성(일반·야간연장형·시간제 등), 평가 참여 여부, 정원, 보육교직원 현원, 전화번호가 들어 있다(CSV 약 13KB). 중구에 사는 부모가 집 근처 국공립·야간연장 어린이집의 정원과 연락처를 찾거나, 분석가가 중구 내 유형별 보육 정원 분포를 볼 때 쓴다. 공통 어린이집코드나 좌표 같은 전역 조인 키가 없어서 다른 보육 데이터와는 어린이집명·주소 매칭으로만 잇는다.
description_portal: 본 공공데이터는 대전광역시 중구 관내 어린이집 현황(어린이집명, 주소, 연락처, 정원, 보육교사 수, 평가인증여부, 유형,시간연장 등)을 표기하고 있습니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 어린이집유형은 민간, 가정, 국공립, 협동, 사회복지법인, 법인단체등 으로 구성되어 있습니다.데이터 컬럼 중 어린이집특성은 일반,야간연장형, 시간제 보육등의 정보를 기재하고 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
