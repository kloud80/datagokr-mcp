summary_user: 경기장애인구강진료센터의 진료 환자 수를 기준년도·장애유형별로 집계한 자료로, 연간 합계와 1~4분기 환자 수를 담는다. 장애인 구강건강 정책 담당자나 분석가가 '자폐성장애·뇌병변장애 등 어떤 장애유형의 구강진료 수요가 크고 분기별로 어떻게 달라지는가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장애유형명(OBSTCL_TYPE_NM)·기관명·기준년도 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터는 경기장애인구강진료센터에서 연도별·장애유형별로 운영된 진료 현황을 정리한 자료입니다. 주요 항목에는 기준년도, 기관명, 장애유형명, 합계(명), 1분기~4분기 환자수가 포함되어 있으며, 자폐성장애, 뇌병변장애, 뇌전증 등 다양한 장애유형별로 진료받은 환자 수가 집계됩니다. 이를 통해 연도별 및 장애유형별 진료 환자 규모와 분기별 변화 추이를 분석할 수 있으며, 중증·경증 구분에 따른 의료 서비스 제공 현황도 확인할 수 있습니다. 해당 데이터는 장애인의 구강건강 지원 정책 수립, 장애유형별 특화 진료 수요 파악, 의료 자원 배치의 효율성 평가 등에 활용될 수 있습니다.
