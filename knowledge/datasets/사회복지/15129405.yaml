description_portal: 광주광역시도시공사의 연도별 사회공헌활동 현황을 정리한 데이터입니다. 본 데이터는 활동이 이루어진 연도, 세부 내용, 지원금액(천 원 단위), 지원유형, 조달유형, 협력기관 항목으로 구성되어 있습니다. 사회적 책임 실현을 위한 공사의 다양한 지원사업과 그 추진 내역을 한눈에 확인할 수 있으며, 대외 협력과 지역사회 기여 현황을 분석하는 데 활용할 수 있습니다. 데이터는 각 항목이 명확하게 정리되어 있어, 공공데이터 이용자가 공사의 사회공헌 활동을 쉽게 이해하고 활용할 수 있도록 하였습니다. 정량적 정보와 정성적 정보가 함께 제공됨으로써 활동의 목적, 규모, 유형을 종합적으로 파악할 수 있습니다. 정책 기획, 평가 및 외부기관의 연구나 시민의 정보 접근에 활용될 수 있도록 상세한 설명과 검색 편의성을 고려한 구성을 적용하였습니다.
