description_portal: '○ 통계개요* 통계명 : 국민연금 징수현황* 통계종류 : 국민연금 자치구별 고지 대비 징수현황을 제공하는 일반?보고 통계* 근거법령 :「국민연금법」「공무원연금법」「사립학교교직원연금법」 규정에 따른 국민연금 징수현황* 작성목적 : 국민연금제도의 업무추진 실적 및 가입자?징수?급여?기금현황 등을 파악하여연금정책 수립 및 관련 연구를 위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 지사 및 기금운용본부 → 국민연금공단* 공표주기 : 정기* 공표범위 : 지역 - 서울시 및 자치구내용 - 국민연금의 자치구별 고지, 납부, 미납 현황○ 용어설명* 고지Projected (월수, 금액) : 해당년도 및 월에 부과한 월수, 금액* 징수Collected (월수, 금액) : 고지월 기준 고지대비 징수현황○ 기 타* 당해년도 정기고지월 기준 고지 대비 징수의 형황임* 천원미만 절사에 따라 합계금액에 차이가 있을 수 있음* 20~21년도 징수현황통계는 국민연금 통계연보에서 삭제되어** 자료가 존재하지 않으나, 지속적인 복원 수요 충족 및이용자들의 편의 증대를 위해 22년도 통계연보부터 부록에 수록** 삭제 사유: 연금보험료 징수 업무가 건강보험공단에 이관된 이후, 징수관련 통계와 데이터는 건강보험공단에서 생산및 관리하고 있고 건강보험공단 홈페이지에 공시하고 있으므로, 중복 및 유사 통계의 공표로 이용자들의혼란을 방지하고자 삭제'
