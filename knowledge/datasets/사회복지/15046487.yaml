description_portal: '○ 통계개요* 통계명 : 재가노인 복지시설(가정봉사원)(2004년-2007년)* 통계종류 : 서울시 재가노인 복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「노인복지법」에 의한 재가노인 복지시설* 작성목적 : 노인복지시설 설치신고를 마친 노인복지시설의 수, 입소정원을 집계하여노인인구 수 대비 적정수의 시설 수요와 충족율을 분석하고 분석결과에 따른 정책 수립 및 평가를 위한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 어르신복지과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 재가노인 복지시설 중 유ㆍ무급 가정봉사원 수'
