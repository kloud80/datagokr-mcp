summary_user: 전라남도(현 전남광주통합특별시) 지역에 설립된 사회복지관을 한 곳씩 시군, 명칭, 설립일, 종사자 수, 주소로 담은 건별 현황 파일이며, 파일 크기가 833바이트로 소규모 목록이다. 주민이나 복지 분야 분석가가 '우리 시군에는 어떤 사회복지관이 있고 언제 세워졌으며 종사자는 몇 명인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 사회복지시설 데이터와는 시군명·복지관 명칭을 맞추거나 주소를 기준으로 이어 써야 한다.
description_portal: '- 전라남도에 설립된 지역별  사회복지관 현황 및 설립일, 주소, 종사자  정보 등  지역별 사회복지관 운영 현황 등의 정보를 포함하고 있습니다.- 전라남도는 다양한 사회복지관을 운영하여 지역 주민들에게 복지 서비스를 제공하고 있습니다. 각 복지관은 노인, 장애인, 아동, 청소년 등 다양한 계층을 대상으로 맞춤형 프로그램과 서비스를 운영하며, 지역 사회의 복지 향상에 기여하고 있습니다.- 방문 : 각 복지관의 주소를 확인하고 직접 방문하여 프로그램 및 서비스에 대해 문의할 수 있습니다.- 전화 : 각 복지관의 대표 전화번호를 통해 프로그램 안내 및 상담을 받을 수 있습니다.- 온라인 : 일부 복지관은 공식 웹사이트나 SNS를 통해 프로그램 안내 및 신청을 받고 있으므로, 해당 복지관의 온라인 채널을 확인해 보세요.'
