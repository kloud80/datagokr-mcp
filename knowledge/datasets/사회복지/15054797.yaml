summary_user: 울산광역시 관내 청소년 쉼터를 시설 한 곳당 한 행으로 담은 목록 파일(csv, 약 1.4KB)로, 쉼터명·위치·위도·경도·전화번호·입소정원·수용대상·운영내용·설립일 등을 포함한다. 가출 등으로 긴급 보호가 필요한 청소년이나 보호자·상담자가 '울산에서 가까운 청소년 쉼터는 어디이고, 몇 명까지 받으며 누구를 수용하나'를 확인하는 데 쓴다. 전역 조인 키는 없어 쉼터명 등 이름 매칭이나 위도·경도 좌표로 다른 청소년 시설(상담복지센터·꿈드림·자립지원관) 또는 시군구 단위 지역 통계와 붙여 쓴다.
description_portal: 본 데이터는 관내에 운영 중인 청소년 쉼터의 현황 정보이다. 쉼터별 명칭, 소재지, 연락처, 수용 인원, 제공 서비스, 입소 절차 등의 세부 내용을 포함한다. 청소년 쉼터는 가정 문제로 거리를 배회하는 가출 청소년에게 일시적인 주거 공간과 상담, 의료, 교육 등의 서비스를 제공하는 보호 시설이다. 해당 자료는 위기 청소년 지원 정책 수립, 청소년 복지 인프라 확충 계획, 청소년 보호 체계 강화에 활용된다. 긴급 구조가 필요한 청소년이 신속하게 쉼터를 찾고 도움을 받을 수 있도록 지원한다. 또한 청소년의 건강한 사회 복귀와 자립을 지원하며, 가족 관계 회복 프로그램 운영을 통해 근본적인 문제 해결을 도모한다. 본 정보는 정기적으로 갱신된다.
