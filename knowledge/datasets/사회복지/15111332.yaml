description_portal: 의정부도시공사 이동지원센터에서 운영하는 행복콜 서비스에 대한 정보입니다.장애유형별 행복콜 운행건수를 세부 정보로 제공하고 있습니다. 참고로 장애유형 중 기타장애는 장루, 요루, 간질, 안명, 발달장애, 척수, 희귀질환, 일시적장애 등입니다.해당정보는 행복콜택시 이용희망자, 이용자, 이동수단 관련 연구 용역 등 정보수요자를 위하여 정확하고 신속하게 제공되고 있습니다.그외 이동지원서비스 접수 및 이용방법에 대한 안내정보가 필요할 경우 의정부도시공사 대표 홈페이지에 접속하시면 사업소개>교통사업>이동지원센터에서 해당 정보를 확인할 수 있습니다.https://www.uiuc.or.kr/businessInfo/trafficPage/taxi/list.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.
