summary_user: 대구광역시 달서구에 있는 어린이집을 한 곳당 한 행으로 담은 파일 데이터로, 소재지·시설명·시설구분(국공립·법인·민간·가정·직장 등)·신고일·정원·전화번호를 담는다. 달서구에 사는 보호자가 집 근처에 어떤 유형의 어린이집이 있고 정원이 몇 명인지 확인하거나, 분석가가 동네별 보육 시설 분포를 살피는 데 쓴다. 전역 조인 키(어린이집코드 등)가 없어서 다른 어린이집·유치원 데이터와는 시설명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '만 0~5세의 영유아를 보호자의 위탁을 받아 보육하는 기관인 대구광역시 달서구의 어린이집 현황 데이터(국공립, 법인, 민간, 가정, 직장 등 )로, 컬럼은 소재지, 시설명, 시설구분, 신고일, 정원, 전화번호의 항목으로 구성되어 있습니다.해당자료는 달서구청홈페이지>분야별정보>복지>보육>어린이집 현황(https://dalseo.daegu.kr/index.do?menu_id=20000507)에서 확인 가능하며, 장애아보육지원, 영아전담, 24시간보육지원 어린이집 등도 확인 가능합니다.문의: 아동가족과(053-667-3527)'
