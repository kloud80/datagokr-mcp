summary_user: 서울특별시 금천구에 있는 협동조합을 조합 한 곳당 한 행으로 담은 목록 파일(csv)로, 조합명·유형(구분)·주요 사업내용·소재지 주소·연락처·데이터기준일자를 담는다. 협동조합 설립을 준비하는 예비 창업자나 구청·연구자가 '금천구에는 어떤 업종의 협동조합이 어디에 얼마나 있는가'를 확인하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 조합명·주소를 매칭하는 방식으로만 이어 쓰며, 사회적기업·마을기업 목록이나 다른 자치구의 협동조합 현황과 이름 기준으로 대조하는 데 쓴다.
description_portal: 사람 중심의 가치를 실현하며 지역 공동체에 기여하는 서울특별시 금천구 내 협동조합의 현황을 종합적으로 제공하는 데이터입니다. 본 데이터는 사회적 경제 주체인 협동조합의 활동을 지원하고, 지속가능한 지역 경제 생태계를 조성하는 데 기여하고자 구축되었습니다.데이터는 각 협동조합의 조합명, 유형, 주요 사업 내용, 소재지 주소, 대표 연락처 등 핵심 정보를 상세히 포함하고 있습니다. 이를 통해 사용자는 금천구 내 협동조합의 산업별 분포와 운영 특성을 한눈에 파악할 수 있습니다.협동조합 설립을 준비하는 예비 창업자들에게는 사업 모델 구상과 시장 분석을 위한 귀중한 참고 자료가 되며, 관련 지원 정책을 수립하는 행정기관 및 연구자에게는 지역 내 사회적 경제의 규모와 현황을 분석하는 실질적인 데이터로 활용될 수 있습니다. 정기적인 갱신을 통해 항상 최신의 정보를 제공하여 데이터의 신뢰성을 확보하고 있습니다.
