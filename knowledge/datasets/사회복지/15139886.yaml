description_portal: 한국여성인권진흥원에서 추진하는 주요 사업 중 실명제로 관리되는 대상 사업들의 목록을 정리한 데이터입니다. 해당 자료는 각 사업에 부여된 고유 일련번호, 사업명 등으로 구성되어 있으며, 피해자 지원시설 간 협력체계 구축, 통계 및 실적 관리, 정책연구, 교육·컨설팅 등 여성폭력 피해자 보호와 관련한 핵심 사업들을 포괄하고 있습니다. 본 데이터는 사업 추진의 투명성을 높이고, 국민의 이해와 참여를 도모하기 위한 목적으로 제공되며, 정책 이행 현황을 분석하거나 관련 예산·성과 관리를 위한 참고 자료로도 활용될 수 있습니다. 특히, 각 사업의 연도별 식별이 가능한 구조로 되어 있어 연속성과 추진 방향을 파악하는 데에도 유용합니다.
