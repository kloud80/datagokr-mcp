summary_user: 충청남도 금산군에 등록된 장애인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설형태·시설명·주소와 위도·경도, 운영법인, 설립 연월일, 이용(입소)인원, 종사자 수, 전화번호, 시설장을 수록한다(포털 설명 기준 2025년 7월 말 7개 시설). 금산군 주민이나 보호자가 가까운 장애인 시설과 연락처를 찾거나, 분석가가 군 안의 장애인 서비스 자원이 어디에 얼마나 있는지 지도로 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 같은 이름 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 본 데이터는 금산군 장애인복지시설 등록현황에 대한 정보를 제공합니다. 2025년 7월 말 기준으로 총 7개 시설의 시설형태, 시설명, 주소(위도 및 경도), 운영법인, 설립 연월일, 이용(입소)인원, 종사자, 전화번호, 시설장 정보가 수록되어 있습니다. 해당 자료는 금산군 내 장애인 대상 사회서비스 자원의 분포와 규모를 파악하는 데 유용하며, 복지정책 수립이나 시설 수요 예측에도 활용될 수 있습니다. 위도 및 경도 정보가 포함되어 있어 공간 분석 및 GIS 기반의 시각화 작업에도 활용 가능합니다. 이 데이터는 연간 업데이트되어 공공데이터포털을 통해 제공됩니다.
