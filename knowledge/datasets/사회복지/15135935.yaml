description_portal: 한국건강가정진흥원이 현재까지 발송한 웹진의 이메일 도메인별 발송 건수를 집계한 자료입니다. 각 항목은 연번, 캠페인제목, 발송수단, 메일주소(이메일 도메인), 발송건수로 구성되어 있습니다. 이를 통해 기관이 어떤 이메일 도메인을 통해 웹진을 발송했는지, 각 도메인별로 얼마나 많은 발송이 이루어졌는지를 분석할 수 있습니다. 이러한 정보는 웹진의 수신율 향상, 타겟 마케팅 전략 수립, 이메일 발송 효율성 분석 등에 활용될 수 있습니다. 데이터는 연간 단위로 업데이트되며, 최신 정보는 2025년 7월 31일 기준입니다. CSV 형식으로 제공되며, 이 자료는 가족서비스 홍보 및 커뮤니케이션 전략 수립에 유용한 정보를 제공합니다.
