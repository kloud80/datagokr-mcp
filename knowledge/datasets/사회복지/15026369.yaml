summary_user: 부산광역시 중구의 노인일자리 및 사회활동지원 사업을 사업단 단위로 정리한 파일로, 사업수행기관·사업유형(공익활동형·역량활용형·공동체형)·사업명·사업량(참여 인원)·사업 시작·종료 시기를 담는다. 중구에 사는 어르신이나 가족이 "우리 동네에서 어느 기관이 어떤 노인일자리 사업단을 몇 명 규모로 운영하나"를 확인하거나, 분석가가 수행기관별·유형별 사업량을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 노인복지시설·지역 통계 데이터와는 수행기관 이름 매칭이나 같은 기관(중구) 단위로만 이어 쓴다.
description_portal: 활기차고 건강한 노후생활을 영위하고 노인복지를 위한 노인일자리 및 사회활동지원 사업에 대한  부산광역시 중구의 노인일자리 및 사회활동지원 현황에 대한 데이터로 노인일자리 사업을 수행하는 수행기관, 노인일자리 사업유형 및 사업명, 각 사업단별  사업량 등의 정보를 제공합니다.부산광역시 중구 2026년 노인일자리 및 사회활동지원사업 - 3개 수행기관, 65개 사업단 2,295명노인일자리 참여 대상자 사업유형(공익활동형, 역량활용형, 공동체형)  65세 이상 기초연금 수급자(원칙) 역량활용 및 공동체형은 사업단에 따라 60세~64세 참여 가능
