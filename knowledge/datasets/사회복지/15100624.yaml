summary_user: 인천광역시 계양구 관내 여성복지시설을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·도로명주소·전화번호·행정동이 들어 있으며 파일 크기가 395바이트에 불과한 소규모 자료다. 계양구 주민이나 상담 기관이 '우리 동네 가까운 여성복지시설이 어디이고 연락처는 무엇인가'를 확인하거나, 행정 담당자가 행정동별 여성복지 시설 분포를 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·도로명주소·행정동 이름을 맞춰 연결하며, 사회복지시설 공통 마스터나 계양구의 다른 복지시설 목록과 대조해 쓴다.
limits: 여성 폭력 피해 보호시설은 법적으로 위치가 비공개라서 이 목록에 모든 여성시설이 담겼다고 볼 수 없다. 공통 코드 키가 없어 이름·주소 문자열 매칭으로만 다른 자료와 이을 수 있고, 범위는 계양구 한 곳에 한정된다.
