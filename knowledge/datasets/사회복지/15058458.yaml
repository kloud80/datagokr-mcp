summary_user: 경기도 장애인연금 대상자 수와 수급자 수를 기준연도(STD_YY)·시군별로 묶은 집계 자료로, 대상자는 전체·중증·기타, 수급자는 전체·심한 장애·심하지 않은 장애·기타로 나뉜다. 복지 분석가나 시군 담당자가 '우리 시군은 대상자 대비 실제 수급자 비율이 다른 시군보다 낮은가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드(SIGUN_CD)나 시군명으로 경기도 다른 시군별 통계와 이름·코드 매핑으로만 잇는다.
description_portal: 이 데이터는 경기도 장애인연금 대상자 및 수급자 현황을 시군별·장애등급별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애인연금은 18세 이상 중증장애인에게 지급되며, 국민연금 가입 여부와 관계없이 지원됩니다. 데이터에는 각 시군별로 대상자 수(전체, 중증, 기타)와 수급자 수(전체, 심한 장애, 심하지 않은 장애, 기타)가 구분되어 포함됩니다. 예를 들어, 수원시의 전체 대상자 수와 실제 연금을 수급하는 인원 수를 비교할 수 있으며, 성남시의 중증장애인 수급자 현황도 파악할 수 있습니다.이 자료는 장애등급별 차이와 실제 연금 수급률을 분석할 수 있어, 경기도 내 시군별 복지 사각지대 파악 및 정책 개선 근거로 활용됩니다. 특히, 대상자 대비 수급자 비율을 통해 제도적 지원이 필요한 지역을 식별할 수 있습니다.
