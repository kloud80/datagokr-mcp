description_portal: '영도구 관내 장애인재활시설 9개소의 현황에 대한 데이터로 시설구분, 시설명, 소재지, 입소정원, 운영주체, 전화번호, 팩스번호 등의 항목을 제공합니다.1. 장애인직업재활시설: 장애인들이 직업을 가지고 일을 할 수 있는 기회를 제공해 주는 장애인 보호 작업장으로 주요 생산품은 면장갑과 반코팅장갑이며 국내산 원자재로 생산하고, 근로장애인들이 꼼꼼하게 검수 하여 제작함으로 우수한 품질을 자랑합니다. 생산품 판매를 통해 나오는 수익금은 근로장애인들의  자립에 도움이 됩니다.2. 장애인의료재활시설: 일반과진료, 장애인 재활치료, 물리치료, 언어치료 등 제공합니다.3. 장애인주간보호시설: 일상생활 및 사회생활을 영위하는데 지원이 필요한 장애인에게 낮 시간동안 재활 프로그램 및 교육 등의 기회를 제공하여 장애인 가족구성원이 안심하고 사회, 경제적활동을 영위할 수 있습니다.4. 장애인재활치료시설: 아동의 발달 지연이나 장애를 조기에 발견하고 치료 및 재활을 돕는 시설으로 언어치료, 심리치료 등 서비스를 제공합니다.'
