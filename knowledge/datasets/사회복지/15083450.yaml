summary_user: 서울시 지역아동센터를 시설 한 곳당 한 행으로 담은 시설 목록으로, 시설명·자치구·주소·좌표와 주 대상 연령대, 이용료 무료 여부, 학기·방학·토요일 운영시간을 함께 싣는다. 학부모가 우리 자치구에서 방학 중 늦게까지 운영하거나 토요일에도 여는 무료 센터를 찾을 때, 분석가가 자치구별 돌봄 인프라와 사각지대를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구명·자치구코드나 주소·좌표 매칭으로 잇고, 사회복지시설 공통 마스터를 참조해 함께 본다.
description_portal: 서울시 지역아동센터 시설현황정보는 취약계층을 포함한 아동을 대상으로 한 돌봄과 교육·복지 서비스를 제공하는 지역아동센터의 분포와 운영 현황을 파악하기 위한 데이터입니다. 시설명, 자치구명, 주소, 좌표값을 통해 센터의 정확한 위치를 확인할 수 있으며, 연령구분 정보를 통해 어떤 연령대 아동을 주 대상으로 하는지 알 수 있습니다. 사용료무료여부와 사용료 항목은 이용 비용 부담 수준을 파악하는 데 활용되며, 학기·방학 기간별 시작·종료시간과 토요일 운영여부 및 운영시간 정보는 돌봄 서비스의 시간적 제공 범위를 분석하는 데 유용합니다. 등록일시와 수정일시는 데이터 최신성과 변동 이력을 보여주어, 지역별 돌봄 인프라 분석, 돌봄 사각지대 발굴, 아동복지 정책 수립을 위한 기초 자료로 활용될 수 있는 데이터입니다.
