description_portal: '장애인활동지원서비스 ▶장애인활동지원서비스란?-사업근거 : 장애인복지법 제55조, 장애인활동 지원에 관한 법률 제3조-사업목적 : 장애인의 자립생활과 사회 참여 증진-사업대상:  6세 이상 65세 미만의 자로 혼자 일상생활과 사회생활을 하기 어려운 「장애인복지법」상 모든 등록 장애인                      활동지원 급여를 받는 도중 65세 도래에 따라 노인장기요양인정 신청을 하여 등급 판정을 받은 사람-선정절차:  장애인 본인 등이 주민등록상 주소지 읍․면․동(행정복지센터)에 신청(연중),- 국민연금공단 가정방문 조사 :‘서비스종합조사표’에 따라 조사, 서비스 인정구간 및 제공시간 결정 -본인부담금 : 있음   생계급여 수급자 또는 의료급여 수급자 : 본인부담금 면제   차상위계층 : 2만원 정액 부과  기본급여에 대한 본인부담금은 소득수준에 따라 월 한도액의 4~10% 부과-지원(인정)시간 기본급여 : 활동지원급여 구간은 종합점수 기준 15구간으로 구분, 구간별 60~480시간 제공 특별지원급여 : 출산 80시간, 자립 준비 20시간, 보호자 일시부재 20시간-서비스 내용:   활동보조(신체활동지원, 가사활동지원, 사회활동지원), 방문목욕, 방문간호-서비스 단가 : 2026년 기준 시간당 17,270원으로 하고, 제공 시간에 따라 단가 계(야간, 공휴일 25,900원)-제공기관: 부산 강서구 2개소                     가람장애인자립생활센터(주소: 부산광역시 강서구 대저로255번길 29, 전화번호: 051-971-5933)                     명지주는사랑장애인활동지원센터( 주소: 부산광역시 강서구 명지국제8로 290, 3층 302호, 전화번호: 051-204-7003)                     *참고 : https://www.ableservice.or.kr/main.do'
