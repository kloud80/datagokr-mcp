summary_user: 전국 시도별로 기준연도(STD_YY)마다 주민등록인구와 등록장애인 수를 전체·남성·여성으로 나누어 담고, 인구 대비 등록장애인 비율(%)을 함께 담은 시도 단위 집계 자료다. 복지 정책 담당자나 분석가가 '어느 시도의 등록장애인 비율이 높고, 남녀별로는 어떻게 다른가'를 비교해 지역별 장애인 복지 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어, 다른 시도 단위 통계와는 시도명(SIDO_NM)을 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 전국 시‧도 주민등록인구 대비 등록장애인 비율 현황을 집계한 자료입니다. 보건복지부와 경기도청 장애인복지과가 제공하며, 매년 12월 말 기준으로 산출됩니다.항목에는 시도명, 주민등록인구수(전체·남성·여성), 등록장애인수(전체·남성·여성), 등록장애인 비율(%) 등이 포함됩니다. 예를 들어, 특정 시도의 전체 주민등록인구가 200만 명이고 등록장애인이 10만 명이면 등록장애인 비율은 5%로 기록됩니다.이 데이터는 시도 간 장애인 인구 분포 비교, 남녀별 등록장애인 현황 분석, 지역 맞춤형 복지 정책 수립 등에 활용될 수 있습니다. 예를 들어, 특정 시도의 여성 등록장애인 비율이 상대적으로 높게 나타난다면, 여성 장애인 대상 돌봄 서비스 강화 정책의 근거로 활용할 수 있습니다.
