description_portal: '충청남도 어린이집의 시군별 국공립, 사회복지법인, 법인단체 등, 민간, 가정, 협동, 직장 어린이집 현황에 대한 데이터이다.충청남도 내 어린이집 운영 현황을 보육통합정보시스템 자료를 바탕으로 조사한 결과, 도내 전체 어린이집 수는 1,222개소로 확인되었다. 이번 집계에는 천안시, 공주시, 보령시, 아산시, 서산시, 논산시, 계룡시, 당진시, 금산군, 부여군, 서천군, 청양군, 홍성군, 예산군, 태안군 등 충청남도 전역에 위치한 어린이집이 모두 포함되었다.세부 유형별로 살펴보면, 먼저 국공립 어린이집은 총 255개소가 운영 중인 걸로 집계되었으며, 사회복지법인이 운영하는 어린이집은 98개소이다.이어 법인·단체 등에서 운영하는 어린이집은 31개소이며, 민간 어린이집은 356개소이다.또한 가장 많은 비중을 차지하는 가정 어린이집은 427개소로 지역 내 영유아 보육의 핵심 역할을 수행하고 있다.  상대적으로 운영 수가 적은 협동 어린이집은 1개소이다. 마지막으로 직장 어린이집은 54개소가 운영 중이다.종합하면, 충청남도의 어린이집 운영 현황은 총 1,222개소로 구성되어 있으며, 국공립, 사회복지법인, 법인·단체, 민간, 가정, 협동, 직장 등 다양한 유형의 시설이 아동과 가정의 보육 수요를 균형 있게 충족하고 있다. 이러한 자료는 지역별 보육 인프라 확충 및 정책 수립의 기초자료로 활용될 수 있으며, 충청남도 내 보육서비스의 현황을 종합적으로 이해하는 데 중요한 참고 자료가 된다.[소계]계: 1,222국공립: 255사회복지법인: 98법인, 단체 등: 31민간: 356가정: 427협동: 1직장: 54'
