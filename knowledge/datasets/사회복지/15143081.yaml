summary_user: 대구광역시 북구에 있는 다함께돌봄센터를 시설 한 곳당 한 행으로 담은 소규모 목록 파일(csv, 849 bytes)로, 시설명·도로명주소·운영요일과 운영시간·개관일자·면적·정원과 현원·직원수·장애아동 돌봄 여부를 포함한다. 북구에 사는 초등학생 학부모가 집 근처 센터가 어디인지, 언제 운영하는지, 정원 대비 빈자리가 있는지, 장애아동 돌봄이 되는지 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명이나 도로명주소를 맞추거나 같은 기관(북구) 단위로만 이어 쓰며, 사회복지시설 공통 마스터와 대조하는 용도가 있다.
description_portal: 대구광역시 북구에 위치한 다함께돌봄센터에 대한 시설명, 도로명주소, 운영요일, 운영시간, 개관일자, 면적, 정원, 현원, 직원수, 장애아동 돌봄여부, 장애아동 유무, 데이터기준일자를 제공합니다. 다함께돌봄센터란 초등학교의 정규교육 이외의 시간 동안 돌봄서비스를 제공하는 공공돌봄시설로 돌봄이 필요한 6~12세 아동 혹은 초등학생이 이용대상입니다. 서비스는 정기돌봄과 일시돌봄으로 운영되며, 이용료는 센터별 자율적으로 10만원이내에서 책정되며, 급식비는 별도로 발생할 수 있습니다. 센터별 운영시간 및 정원, 이용료, 돌봄내용 등은 상이할 수 있으며 정확한 이용방법, 운영시간, 프로그램 및 이용료 등은 해당 지자체 또는 다함께돌봄센터에 문의하시기 바랍니다.
