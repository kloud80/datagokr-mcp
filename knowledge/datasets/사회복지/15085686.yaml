description_portal: 본 데이터는 미추홀구 관내 결식 우려 아동에게 제공되는 급식지원 현황을 수록한 자료입니다. 지원 대상은 국민기초생활보장법상 수급자 및 차상위 계층 아동, 한부모가족지원법 대상 아동, 긴급복지지원법 지원 가구 아동, 보호 공백이 발생한 아동, 보호자의 질환·사고 등으로 양육능력이 부족한 가정의 아동, 기준 중위소득 52% 이하 가구 아동, 교사·사회복지사 등의 추천으로 급식위원회 심의가 필요한 아동 등으로 구성됩니다. 지원 방식은 급식카드를 활용한 가맹점 식사 제공, 도시락 개별 배달, 지역아동센터 내 급식 제공으로 이루어지며 학기 중과 방학 중 지원 형태가 달라집니다. 신청은 아동 주소지 행정복지센터를 통해 가능하며, 관련 법령은 「아동복지법」 제35조에 근거합니다. 본 데이터는 아동의 영양권 보장과 건강한 성장 지원을 목적으로 급식 지원의 체계적 운영 및 관리에 활용됩니다.
