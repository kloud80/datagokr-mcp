description_portal: '○ 통계개요* 통계명 : 재가노인 복지시설* 통계종류 : 서울시 재가노인 복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「노인복지법」제38조에 의한 재가노인 복지시설* 작성목적 : 노인복지시설 설치신고를 마친 노인복지시설의 수, 입소정원을 집계하여노인인구 수 대비 적정수의 시설 수요와 충족율을 분석하고 분석결과에따른 정책 수립 및 평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 어르신복지과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 재가노인 복지시설(방문요양 서비스, 주ㆍ야간보호 서비스, 단기보호 서비스, 방문목욕 서비스)의 시설수,이용인원, 종사자수 등○ 용어설명* 재가노인복지시설 : 신체·정신적 장애로 일상생활을 영위하는데 다른 사람의 도움이필요한 노인에게 각종 편의를 제공하는 시설로 방문요양·주야간보호·단기보호·방문목욕서비스가 있음(노인복지법 제38조)* 방문요양서비스 : 가정에서 일상생활을 영위하고 있는 노인으로서 신체적ㆍ정신적장애로 어려움을 겪고 있는 노인에게 필요한 각종 편의를 제공하는 서비스* 주ㆍ야간보호서비스: 부득이한 사유로 가족의 보호를 받을 수 없는 심신이 허약한노인과 장애노인을 주간 또는 야간 동안 보호시설에 입소시켜 필요한 각종편의를제공하는 서비스* 단기보호서비스 : 부득이한 사유로 가족의 보호를 받을 수 없어 일시적으로 보호가필요한 심신이 허약한 노인과 장애노인을 보호시설에 단기간 입소시켜 보호하는 서비스* 방문 목욕서비스 : 목욕장비를 갖추고 재가노인을 방문하여 목욕을 제공하는 서비스○ 기 타* 노인복지법 개정("08. 4)으로 명칭 및 분류 변경* 방문요양, 방문목욕서비스는 정원이 없음* 2013년 재가노인지원서비스 항목 추가○ 출 처 : 서울특별시 어르신복지과'
