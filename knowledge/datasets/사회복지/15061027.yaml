summary_user: 성희롱·성폭력 근절 종합지원센터가 실시한 조직문화개선 컨설팅 건수를 연도별로 집계한 전국 단위 파일로, 중앙행정기관·지방자치단체·공직유관단체·각급학교·민간 5개 분야별 건수와 합계를 담는다(248바이트 규모의 소형 CSV). 정책 담당자나 분석가가 "성희롱·성폭력 발생기관 대상 컨설팅이 해마다 어느 분야에서 늘거나 줄었는가"를 볼 때 쓴다. 전역 조인 키가 없어 연도 기준으로 같은 기관의 다른 성희롱·성폭력 관련 통계와 나란히 놓는 방식으로만 연결한다.
description_portal: 성희롱 성폭력근절 종합지원지원센터를 통해 성희롱성폭력 근절을 위한 조직문화개선 컨설팅 실시에 대한 연간 현황이며, 컨설팅 대상을 5개의 분야(중앙행정기관, 지방자치단체, 공직유관단체, 각급학교, 민간)로 나누어 실시 건수를 나타낸 데이터입니다. 성희롱 성폭력근절 종합지원센터에서는 피해자 지원 / 사건 대응 지원 / 업무 담당자 및 종사자 역량 강화 업무를 수행하고 있습니다. 성희롱성폭력 발생기관 등을 대상으로 조직문화개선 컨설팅을 실시하고 그 사례를 모은 사례집은 한국여성인권진흥원 홈페이지 > 정책홍보 > 간행물 에서 확인하실 수 있습니다.
