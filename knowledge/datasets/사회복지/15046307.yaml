description_portal: '○ 통계개요* 통계명 : 혼인헝태별 혼인* 통계종류 : 서울시 혼인이혼 인구현황을 자치구별로 제공하는 지정ㆍ전수통계* 근거법령 :「인구동태조사규칙」(재정경제부령 591호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 출생,사망,혼인,이혼에 대한 현황을 파악하여, 국가의 인구ㆍ주택ㆍ보건ㆍ사회복지ㆍ교육ㆍ교통 등에 관한 정책수립 및 민간기업의 경영계획 수립에 필요한기초자료를 제공하는 것을 목적으로 함* 조사체계 : 동 → 자치구 → 시도 → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 혼인형태 등○ 용어설명* 혼인 : 남편(부)과 아내(처)로 구성된 법적관계임. 법률혼주의 원칙에서 혼인신고 수리의경우와 직권에 의해 가족관계등록부기재에 의한 신고로 이뤄짐(단, 신고에 의한것이므로 혼전 동거, 별거 등 사실혼과는 차이가 있을 수 있음)* 혼인종류 : 혼인당시 혼인상태(초혼, 사별후 재혼, 이혼후 재혼)가 어떤 종류인지를 구분'
