summary_user: 전라남도 장성군 관내 공영·민영 주차장별로 장애인전용주차구역 면수(장애인주차대수)와 운영요일·운영시각·요금·관리기관·지번주소·위도/경도를 담은 주차장 단위 원천 목록이며, CSV 파일 용량은 약 4KB로 규모가 작다. 휠체어 이용 운전자나 보호자가 장성군 관공서·관광지를 방문하기 전에 "목적지 근처 주차장에 장애인 전용 구역이 몇 면 있고 언제 운영하나"를 확인하는 데 쓰고, 교통약자 경로 안내나 단속 동선 분석에도 쓴다. 전역 조인 키가 없어 다른 데이터와는 주차장명·지번주소 같은 이름 매칭이나 위도·경도 좌표 근접 매칭으로 연결해야 하며, 주차장관리번호는 이 파일 안의 식별용이다.
description_portal: 본 데이터는 전라남도 장성군 관내에 조성된 주요 공영·민영 주차장 내  "장애인전용주차구역 확보 면수"와 해당 주차장의 전반적인 이용 및 운영 정보를 종합적으로 제공하는 데이터입니다.장애인전용주차구역은 교통약자인 장애인의 이동권 보장과 시설 접근성 향상을 위해 법적으로 의무 설치되는 필수 편의 시설입니다. 본 데이터는 휠체어 이용자 등 보행상 장애가 있는 운전자 및 보호자가 장성군 내 관공서, 관광지, 상업시설 등을 방문하기 전, 목적지 인근의 주차 가능 여부와 휠체어 승하차가 가능한 여유 공간이 확보되어 있는지를 사전에 파악하는 데 매우 유용하게 활용될 수 있습니다.또한, 장애인 주차구역 불법주정차 단속 동선 최적화 연구는 물론, 민간 기업의 스마트 주차 내비게이션 앱 서비스, 교통약자 맞춤형 경로 안내 시스템 개발을 위한 핵심 공공데이터로 가치가 높습니다.[이용 시 유의사항]각 주차장의 운영시간, 요금 체계 및 무료 개방 여부 등은 장성군 조례 변경이나 민간 위탁 운영사의 사정에 따라 예고 없이 변동될 수 있으므로, 정확한 요금 정산 시 현장 안내문을 확인하시기 바랍니다.
