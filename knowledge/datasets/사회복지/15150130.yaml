summary_user: 청소년이 참여한 나눔연계 프로그램의 연계 실적을 건별로 담으며, 연계일련번호·프로그램번호·실적번호와 활동명·활동장소·활동 시작/종료 일시, 처리구분과 연계상태를 기록한다. 청소년 활동 기관 담당자나 분석가가 '어떤 나눔 프로그램이 언제 어디서 진행됐고 연계가 처리됐는가'를 확인하거나 참여 현황을 집계하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 프로그램관리번호·프로그램번호 같은 같은 기관 내부 코드나 활동명·장소 이름 매핑으로만 잇는다.
description_portal: 성평등가족부 청소년활동 나눔연계 정보는 청소년이 참여한 나눔연계 프로그램과 관련된 기본 정보 및 활동 내역을 체계적으로 기록하고 관리하기 위해 제공되는 자료입니다. 프로그램명, 참여자 정보, 활동 일자, 참여 내역, 담당자 정보 등 다양한 데이터를 포함하며, 기관에서는 이를 활용하여 프로그램 운영 관리, 참여 현황 분석, 참여자 안내, 정책 평가, 기록 관리, 교육 지도, 프로그램 개선 등 다양한 목적으로 활용할 수 있습니다. 또한 나눔연계 정보는 프로그램 참여 기록과 운영 신뢰성을 확보하는 중요한 자료입니다.
