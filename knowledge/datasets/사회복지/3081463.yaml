description_portal: '대구광역시 서구 관내에 존재하는  협동조합 명단으로 조합명, 주요사업, 주소를 포함하고 있습니다.협동조합 종류 : 사회적협동조합, 일반협동조합, 일반협동조합연합회(협동조합 설립, 변경에 관한 사항은 대구광역시 소관)본 데이터는 대구광역시 서구청에서 제공하는 ‘협동조합 현황’으로서, 서구 지역 내 등록된 다양한 협동조합의 명칭, 주요사업 내용 및 소재지 주소를 체계적으로 수록하였다. 협동조합은 사회적 경제 활성화와 지역사회 발전을 목적으로 설립되었으며, 아동센터 운영, 의료복지, 택시운수, 문화예술, 농업, 교육, 환경, 공동구매 등 다양한 분야에서 활동하고 있음을 확인할 수 있다. 각 조합별 구체적 사업 내용과 위치 정보가 포함되어 있어, 이용자는 협동조합별 특성을 이해하고 관련 서비스를 편리하게 검색할 수 있다. 본 데이터는 지역사회 협동조합 현황 파악 및 정책 수립, 연구 자료로 활용 가능하다.'
