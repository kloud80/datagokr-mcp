description_portal: 광주광역시 북구 관내 장애인 지역사회재활시설, 직업재활시설, 거주시설의 현황 데이터입니다.광주광역시 북구 소재 장애인시설의 시설명, 시설구분(장애인지역사회재활시설, 장애인직업재활시설, 장애인거주시설), 소재지주소, 운영주체, 정원, 전화번호 항목에 대한 정보를 공공데이터포털에 CSV 파일로 제공합니다.* 소재지주소 컬럼에 기재한 주소는 장애인시설이 위치한 장소(건물)의 도로명주소를 기준으로 작성되었습니다. 단, 소재지주소 컬럼의 각 셀마다 주소 끝부분에 추가로 별도 기재한 괄호 안의 지역 동명은 모두 법정동 기준으로 작성되었습니다.
