summary_user: 사회적기업 1,010곳의 경영공시 내용을 기업별 한 행씩 담은 전국 단위 파일이다. 인증번호·인증유형·업종·설립연도와 이사회 개최 횟수, 취약계층·비취약계층 근로자 수·평균임금·평균근로시간이 들어 있어, 분석가가 사회적기업의 취약계층 고용과 임금 수준이 어떤지 살피는 데 쓴다. 소재지(address)를 키로 지역 데이터와 잇고, 인증번호로 기업 단위 자료와 연결하는 용도가 있다.
description_portal: 사회적기업의 주요 경영공시 현황 자료를 제공합니다.사회적기업 경영공시는 사회적기업이 추구하는 사회적 목적 실현과 경영상태 등에 대한 정보를 미래의 투자자를 포함한 다양한 이해관계자에게 자율적으로 공개하는 제도입니다.인증번호 / 기업명 / 대표자명 / 소재지 / 주업종 / 부업종 / 주업태 / 부업태 / 주종목 / 부종목 / 인증유형 / 설립연도 / 이사회_연간개최회수 / 기타_연간개최회수 / 취약계층근로자총인원 / 비취약계층근로자총인원 / 유급근로자총인원 / 취약계층평균임금 / 비취약계층평균임금 / 유급근로자평균임금 / 취약계층평균근로시간 /비취약계층평균근로시간 /유급근로자평균근로시간 데이터를 제공합니다.데이터관련 문의가 있으시다면 한국사회적기업진흥원 정보화기획팀으로 문의 부탁드리겠습니다. 감사합니다.
