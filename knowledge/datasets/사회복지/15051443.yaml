summary_user: 광주광역시의 청소년단체·기관(청소년상담복지센터, 학교밖청소년지원센터, 회복지원시설 등) 현황을 기관 한 곳당 한 행으로 담은 파일로, 위탁사업명·운영단체·시설장·도로명주소·전화번호를 담는다. 청소년이나 보호자, 상담·복지 실무자가 "광주에서 학교 밖 청소년 지원이나 위기 청소년 상담을 받으려면 어느 기관에 연락해야 하나"를 찾는 데 쓴다. 전역 조인 키는 없어서, 다른 청소년시설 목록이나 지역 통계와는 주소(소재지도로명주소)를 지오코딩하거나 기관명을 맞춰 붙여야 한다.
limits: 2,094바이트짜리 작은 CSV로, 광주광역시 한 시도 범위만 담아 전국이나 전남 지역 비교에는 쓰기 어렵다. 명세상 연간·이벤트성으로 작성된 뒤 바뀌지 않는 스냅숏이므로 시설장·전화번호는 현행 정보와 다를 수 있다. 공통 기관 코드가 없어 다른 데이터와는 이름이나 주소를 맞춰야만 연결된다.
