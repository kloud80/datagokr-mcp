summary_user: 경상남도 내 아동복지시설을 시설 한 곳당 한 건으로 담으며, 시설명·시군·대표자·전화·팩스·도로명주소·홈페이지를 제공한다. 보호자나 복지 담당자가 '우리 시군에 있는 아동복지시설은 어디이고 연락처는 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 사회복지시설 데이터와는 시설명·주소 매칭이나 시군 이름으로만 이어 쓴다.
limits: 표준 시설 코드 같은 공통 키가 없어 다른 시설 목록과 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 여성 폭력 피해 보호시설처럼 법적으로 위치를 공개하지 않는 시설은 위치 정보가 빠질 수 있다. 개발계정 호출은 하루 10,000회로 제한된다.
