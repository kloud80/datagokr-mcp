summary_user: 부산광역시 남구 안의 아동생활시설(아동양육시설·공동생활가정)을 시설 한 곳당 한 행으로 담은 목록으로, 시설구분·시설명·주소·전화번호·아동입소정원·행정동을 담는다(파일 크기 815바이트의 소규모 CSV). 남구에 사는 주민이나 복지 담당자가 '우리 동네 어느 행정동에 아동양육시설이나 그룹홈이 있고 정원은 몇 명인가'를 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 사회복지시설 목록과는 시설명·주소나 행정동 이름을 맞춰서 이어 쓴다.
limits: 시군구(부산 남구) 범위만 담아 다른 구·시와 비교하려면 각 기관 자료를 따로 모아야 하고, 표준 시설코드가 없어 이름·주소 매칭에 의존한다. 아동·가족·여성 시설 가운데 여성 폭력 피해 보호시설은 법적으로 위치가 비공개이므로, 같은 부문 자료를 합칠 때 위치 정보가 빠질 수 있다.
