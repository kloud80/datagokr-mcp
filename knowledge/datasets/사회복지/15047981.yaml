description_portal: 최근 아동학대 및 아동방임이 큰 이슈로 떠오르고 있습니다. 가정 내 스트레스와 갈등, 양육 방법에 대한 무지, 사회적 고립과 지원부족, 사회적 인식 부족등으로 인한 학대 및 방임 아동이 발생하고 있습니다부산광역시 남구 내 저소득 및 학대 그리고 방임 된  아동을 보호하는 아동생활시설 7개소가 있습니다.아동생활시설은 크게 중규모이상의 아동양육시설과 소규모 그룹홈인 공동생활가정으로 나눠집니다.다음과 같이 아동복지시설현황(아동양육시설,공동생활가정)(시설구분, 시설명 아동입소정원,주소, 전화번호, 남녀아동, 행정동 등) 자료를 제공합니다.
