summary_user: 예비사회적기업이 지정 취소·반납·만료된 내역을 기업 한 곳당 한 행으로 담은 건별 파일로, 지역형·부처형 구분, 사업지역, 관할 자치단체, 소관 부처, 기업명, 상세 상태, 취소·반납·만료 일자를 전국 범위로 담는다. 연구자나 정책 담당자가 '어느 지역에서 예비사회적기업 지정이 반납·취소로 끝나는 비율이 높은가'처럼 지정 종료 사유와 지역별 존속 현황을 살피는 데 쓴다. 공통 조인 키(인증번호·사업자번호 등)가 없어서 예비사회적기업 지정 정보와는 기업명과 관할 자치단체 이름을 맞춰 이어 써야 한다.
description_portal: 위 데이터는 예비사회적기업의 지정 취소 내역을 제공합니다.구분(지역형/부처형)/사업지역/관할자치단체/부처(부처형)/기업명/지정만료(지정반납/지정취소 등)일 데이터를 제공합니다.예비사회적기업 지정 정보와 같이 사용하시면 예비사회적기업의 지정 만료사유 연구, 또는 지역별 예비사회적기업의 생존률 등 도움이 될 수 있는 자료입니다.관련데이터에 대해 문의가 있으신 분들은 한국사회적기업진흥원 정보화기획팀 한태휘 대리(031-697-7871)로 연락 부탁드리겠습니다.감사합니다.
