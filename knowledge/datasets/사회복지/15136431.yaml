summary_user: 노인일자리 취업연계 사업을 사업번호별로 정리한 집계 파일로, 마감연월·사업연도·사업기간·목표취업수와 국비·시도·시군구 매칭 및 자체 예산 금액을 담으며 범위는 전국, 행정단위는 시군구다. 지자체 담당자나 정책 분석가가 "우리 지역 취업연계 사업은 목표 취업 인원 대비 국비·지방비를 얼마나 쓰고 있나"를 비교하는 데 쓴다. 사업번호(senior_job_proj_no)가 실측 조인 키여서 같은 키를 쓰는 다른 노인일자리 사업 데이터와 잇고, 시군구 단위 지역 통계와 연계해 지역별로 비교한다.
description_portal: 이 데이터는 노인일자리 사업의 취업연계 집계 현황을 제공하는 자료입니다. 항목에는 마감연월, 사업번호, 사업명, 사업내용, 사업연도, 사업기간, 사업인원, 목표인원 등이 포함되어 있으며, 각 사업별 운영 현황과 성과를 체계적으로 기록하고 있습니다. 예를 들어 단순업무형, 일자리 제공형, 근로조건 개선형 등 다양한 사업 유형이 구체적으로 명시되어 있어 참여 인원 및 목표 달성률을 비교·분석할 수 있습니다. 또한 사업별로 목표치와 실제 운영 결과를 연계하여 관리할 수 있어 정책 효과성과 현장 성과를 동시에 평가하는 데 유용합니다. CSV 형식으로 제공되어 데이터 가공 및 분석이 용이하며, 주기적 갱신을 통해 최신 사업 집계 정보를 반영합니다.
