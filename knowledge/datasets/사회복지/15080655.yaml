summary_user: 경상남도 남해군에서 어르신에게 재가복지 서비스를 제공하는 기관을 기관 한 곳당 한 줄로 담은 목록 파일로, 기관명·제공하는 급여종류·설립구분·주소·전화번호가 들어 있다. 남해군에 사는 어르신이나 보호자가 방문요양·주간보호처럼 필요한 급여를 제공하는 가까운 기관을 찾아 연락처를 확인하는 데 쓰고, 행정 담당자는 군내 재가시설 분포를 파악하는 데 쓴다. 공통 기관 코드 같은 전역 조인 키는 없어서, 건강보험 장기요양기관 목록이나 다른 노인복지시설 자료와는 기관명·주소를 맞춰 대조해야 한다.
