description_portal: '지역사회보장협의체 _현황 정보양평군 지역사회보장협의체 현황을 제공합니다.(협의체명, 종류, 기능, 민간위원수, 공공위원수, 기수, 데이터양평군지역사회보장협의체는 사회보장급여법 제41조에 따라 양평군 지역사회보장협의체를 두며, 양평군협의체 기구에는 대표협의체, 전문위원회, 실무협의체, 실무분과, 사무국을 둔다.읍면 지역사회보장협의체 업무: 관할 지역의 사회보장사업에 의한 도움을 필요로 하는 사람 발굴, 사회보장 자원 발굴 및 연계, 지역사회보호체계 구축 및 운영, 그 밖에 관할 지역 주민의 사회보장 증진을 위하여 필요하 사항'
