summary_user: 한국노인인력개발원이 취업연계 서비스에서 쓰는 공통분류코드 체계를 코드 한 건마다 대분류·중분류·코드명·코드설명·사용여부·등록일·수정일로 담은 전국 단위 코드표 파일(CSV, 약 176KB)이다. 노인 취업연계 원천 기록이나 관련 분석 자료를 다루는 분석가·정책 담당자가 '신청유형·학력·자녀 같은 항목의 코드값이 무슨 뜻인가'를 풀어 읽을 때 쓴다. 전역 조인 키는 없어서, 같은 기관 취업연계 데이터의 코드값을 코드ID·분류코드로 맞춰 이름을 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 취업연계 서비스 제공 시 활용되는 종목분류코드 체계를 담은 자료입니다. 각 코드에는 대분류, 중분류, 코드명, 코드설명 등이 포함되어 있으며, 참여자의 신청·등록 기록을 관리하고 직종 및 활동 유형을 세분화할 수 있도록 구성되어 있습니다. 예를 들어 ‘신청유형의 관계’, ‘학력’, ‘자녀’, ‘서포트’ 등 다양한 항목을 코드화하여 표준화된 관리가 가능하도록 지원합니다. 이를 통해 구직자의 세부 특성과 취업 연계 과정을 정량적으로 기록하고, 기관 간 데이터 공유와 정책 평가 과정에서 일관된 기준을 제공합니다. CSV 형식으로 제공되어 데이터 가공 및 분석이 용이하며, 주기적 갱신을 통해 최신 코드 체계를 유지하고 있어 실무적 활용도가 높습니다. 이 자료는 취업지원기관, 연구기관, 정책 담당자가 직종 및 지원 서비스를 체계적으로 관리하는 데 필수적인 기반 자료입니다.
