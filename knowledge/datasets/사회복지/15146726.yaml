description_portal: 해당 데이터는 지역 내 다양한 복지 수급자와 지원 대상자의 분포 및 규모를 체계적으로 파악할 수 있도록 구성된 자료이다. 주요 항목에는 국민기초생활보장 수급자(중복 포함·제외), 기초생계급여, 기초의료급여, 기초주거급여, 기초교육급여 등 기초생활보장 관련 지원 현황이 포함되어 있으며, 이를 통해 생활안정 지원의 실태를 확인할 수 있다. 또한 타법의료급여, 초·중·고 학생 교육비, 임대주택 지원 등 세부 복지 항목을 통해 가구별 맞춤형 복지 제공의 현황을 파악할 수 있다. 차상위계층과 관련해서는 차상위 본인부담 경감, 자활, 확인서 발급, 장애인 지원 등 다양한 세부 지원 유형이 기록되어 있어 소득 취약계층에 대한 복합적 지원 실태를 보여준다. 더불어 한부모가족지원, 장애인 복지(수급자), 장애인연금, 기초연금 등 특정 계층별 맞춤형 제도 운영 현황도 포함되어 있어, 고령층·장애인·한부모 가구 등 사회적 취약계층 전반의 복지 수요와 정책 지원의 균형을 점검하는 데 활용된다. 이 데이터는 남구 내 복지정책 수립과 대상자 맞춤형 지원을 위한 중요한 기초자료로서, 공공행정의 복지서비스 제공 현황을 한눈에 파악할 수 있게 한다.
