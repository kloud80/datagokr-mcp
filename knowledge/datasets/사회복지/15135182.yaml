summary_user: 경기도 워라밸링크 플랫폼에서 쓰는 사업 유형 분류표로, 고유번호(idntfy_no)와 유형 이름(nm) 두 칸으로 된 코드표이며 포털 설명상 직접서비스·상담·교육·캠페인·문화행사·컨설팅·기타의 7개 유형을 담는다. 워라밸 지원 프로그램을 운영하거나 분석하는 담당자가 '이 프로그램은 상담인가 교육인가'처럼 사업 성격을 분류하거나 유형별 프로그램 현황을 묶어 볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없어, 같은 기관(경기도 워라밸링크)의 사업 목록 데이터와 유형 번호·이름을 맞춰 붙이는 방식으로만 연결한다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼에서 제공하는 사업의 유형을 분류한 정보입니다. 각 사업 유형은 고유번호와 이름으로 구성되어 있으며, 총 7가지로 나뉘어 있습니다. ‘직접서비스’, ‘상담’, ‘교육’, ‘캠페인’, ‘문화행사’, ‘컨설팅’, ‘기타’가 포함됩니다. 이러한 분류는 워라밸 관련 프로그램이나 지원 서비스의 성격을 파악하고, 사용자 요구에 맞춘 콘텐츠를 설계하는 데 유용하게 활용하실 수 있습니다. 예를 들어, 사용자의 관심 유형에 따라 추천 콘텐츠를 자동 분류하거나, 유형별 효과 분석 자료로도 활용이 가능합니다.
