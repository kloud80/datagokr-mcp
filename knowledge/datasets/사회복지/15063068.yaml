description_portal: 경상북도 정신재활시설현황 데이터는 도내 각 시·군의 정신재활시설 운영 현황을 종합적으로 제공하는 자료입니다. 시설별 현원, 남녀 인원, 주요 정신질환별 분포(조현병, 양극성장애, 알코올 사용장애, 우울증 등), 입소 및 이용 인원, 정원 현황, 정신건강전문요원 및 재활활동인력 등의 항목으로 구성되어 있습니다. 본 데이터는 정신질환자의 사회복귀와 재활 지원을 위한 기초자료로 활용되며, 지역사회 정신건강 서비스 강화 및 복지정책 수립에 기여합니다. 또한 시설 인력 배치 현황을 통해 정신보건 인프라의 균형적 운영을 도모합니다.자료관련 문의는 054-880-3799로 하시기 바랍니다.
