summary_user: 경기도 내 노인교실의 인허가 현황을 시설(사업장) 한 건씩 담으며, 인허가일자·영업상태·폐업일자, 입소정원·자격소유인원·총인원, 소재지면적, 도로명·지번주소와 위경도를 포함한다. 복지 담당자나 분석가가 "우리 시군에 지금 영업 중인 노인교실이 몇 곳이고 정원은 얼마인가"처럼 지역별 분포와 운영 현황을 확인하는 데 쓴다. 실측상 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·위경도로 다른 경기도 시군 단위 자료와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 노인교실의 인허가 현황을 제공하는 자료로, 65세 이상 노인을 대상으로 사회활동 참여와 건전한 여가생활, 건강 유지, 소득 보장 및 일상생활 지원을 목적으로 운영되는 시설 정보를 담고 있습니다. 주요 항목에는 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지면적(LOCPLC_AR), 입소정원(ENTRNC_PSN_CAPA), 자격소유인원수(QUALFCTN_POSESN_PSN_CNT), 총인원수(TOT_PSN_CNT), 도로명주소(REFINE_ROADNM_ADDR), 지번주소(REFINE_LOTNO_ADDR), 우편번호(REFINE_ZIP_CD), 위도(REFINE_WGS84_LAT), 경도(REFINE_WGS84_LOGT) 등이 포함됩니다.이 데이터는 노인교실의 지역별 분포와 운영 현황을 분석하는 데 활용될 수 있으며, 고령 인구의 사회적 고립 방지, 여가 및 학습 기회 제공, 노인 복지 정책의 수립 근거 자료로 유용합니다. 또한 지자체, 연구기관, 복지단체는 본 데이터를 활용해 노인 맞춤형 프로그램 개발, 지역별 복지 격차 해소, 노인 돌봄 서비스의 효율적 제공을 위한 기초 자료로 활용할 수 있습니다.
