description_portal: '○ 통계개요* 통계명 : 가족관계 만족도-자녀와의 관계* 통계종류 : 통계청 사회조사의 서울시민 가족관계 만족도를 제공하는 지정ㆍ조사통계* 작성목적 : 사회적 관심사항, 삶의 질에 관한 사항 등 사회구성원의 주관적 관심사를파악하여 사회개발정책의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 조사대상 → 지방통계청 → 통계청* 공표주기 : 정기(2년)* 공표범위 : 지역 - 서울시내용 - 서울시민의 가족관계 만족도에 대한 응답을 백분율로 제공○ 기 타* 조사대상 : 13세이상 인구(2010년이전 15세 이상 인구)* 통계표에 수록된 숫자는 반올림되었으므로 총계가 일치하지 않는 경우가 있음* 문 : 귀하는 가족 관계에서 다음 각 항목에 대하여 어느 정도 만족하고 계십니까?"자녀와의 관계" 분야에 해당되는 곳에 표시해 주십시오.○ 출 처 : 통계청 「사회조사」'
