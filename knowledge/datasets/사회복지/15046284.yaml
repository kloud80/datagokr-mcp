description_portal: '○ 통계개요* 통계명 : 다문화가정 학생 현황* 통계종류 : 일반·보고통계* 작성목적 : 초등학교, 중학교, 고등학교의 다문화가정의 학생수를 파악하여 학교교육정책의 기초자료로 활용하기 위함* 조사체계 : 서울특별시교육청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 각 자치구의 초·중·고등학교의 다문화가정 학생수 등○ 용어설명* 다문화가정 : 학생의 국적과는 상관없이 부모의 국적에 따라 국제결혼가정과 외국인가정으로 구분* 국제결혼가정 : 부모중 한 명만 외국국적을 가지고 있을 경우, 외국인가정 : 부모 두 명 모두 외국 국적인 경우* 국제결혼가정에 국내출생 및 중도입국 포함* 국내출생자녀 : 한국인과 결혼한 외국인 배우자 사이에서 태어난 자녀 중 국내에서 출생한 자녀* 중도입국자녀 : 국제결혼가정자녀 중 외국인 부모의 본국에서 성장하다가 중도에 국내로 입국한 자녀* 조선족은 중국(한국계)에 포함됨'
