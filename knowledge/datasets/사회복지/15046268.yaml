description_portal: '○ 통계개요* 통계명 : 가구추계(가구원수별)* 통계종류 : 서울시 장래가구추계를 제공하는 일반, 가공통계* 작성목적 : 가구의 양적, 구성적 변화를 추정하여, 미래의 가족형성과 해체 양상에대비하고 노인, 여성, 아동 등 정부의 가족복지정책수립을 위한 기초자료로 활용* 추계방법 : 대상인구 중 가구주가 되는 비율의 미래변동수준을 예측한 후 장래추계인구에적용하여 장래가구를 산출* 공표주기 : 부정기(5년마다 실시하는 인구주택총조사 공표 후 작성)* 공표범위 : 지역 - 서울시내용 - 가구주의 연령 및 가구원수별 추계가구○ 용어설명* 가구 : 1인 또는 2인 이상이 모여서 취사, 취침 등 생계를 같이 하는 생활단위* 가구주 : 호주 또는 세대주와는 관계없이 가구를 실질적으로 대표하는 사람.혈연관계가 없는 사람끼리 모여 사는 경우에는 그중 한 사람(대표자)'
