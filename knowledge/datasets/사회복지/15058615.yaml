summary_user: 경기도 차상위계층 장애아동수당 수급자 수를 기준연도(STD_YY)와 장애정도(심한/심하지 않은)별로 나누고, 지체·뇌병변·시각·청각·자폐성 등 장애유형별 인원과 합계를 담은 시도 단위 집계 자료다. 복지정책 담당자나 분석가가 차상위계층 장애아동 가운데 어떤 장애유형·장애정도의 수급자가 많은지 확인해 맞춤형 지원과 예산 편성 근거를 잡는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 장애유형 이름을 맞춰 비교하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 차상위계층 장애아동수당 수급자 현황을 장애등급별‧장애유형별로 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애아동수당은 만 18세 미만 장애아동에게 지급되는 복지 수당으로, 중증 및 경증 장애아동이 모두 대상에 포함됩니다. 데이터에는 장애정도(심한/심하지 않은)와 함께 장애유형별 수급자 수(지체, 뇌병변, 시각, 청각, 언어, 안면, 신장, 심장, 간, 호흡기, 장루·요루, 뇌전증, 지적, 정신, 자폐성, 기타)가 포함됩니다.예를 들어, 차상위계층 내 뇌병변 아동 수급자 수와 자폐성 아동 수급자 수를 비교할 수 있으며, 장애 정도에 따른 수당 수급 분포를 파악할 수 있습니다. 이를 통해 취약계층 아동의 복지 지원 실태를 분석하고, 장애유형별 맞춤형 복지 정책 마련 및 예산 편성의 기초 자료로 활용할 수 있습니다.
