summary_user: 사립학교교직원연금공단의 나주 본사와 서울·대전·부산 지부(상담센터)를 한 행씩 담은 소규모 목록 파일(csv 약 515바이트)로, 지부명·우편번호·주소·전화·팩스·민원 관할구역을 담는다. 사학연금 가입자·수급자나 민원인이 '내 지역은 어느 지부 관할이고 어디로 연락·방문하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 데이터와는 주소나 관할구역(지역명)을 이름으로 맞추거나 같은 기관의 지역별 수급자 통계에 지역명으로 연결해 쓴다.
description_portal: 사립학교교직원연금공단 지부 및 상담센터 운영 현황 데이터는 공단에서 운영중인 지부 및 상담센터에 대한 정보를 제공합니다.나주본사와 세 개의 지부(서울, 대전, 부산)로 운영되고 있으며, 각 지부(센터)별, 우편번호, 주소, 전화번호, 팩스번호,, 민원 처리 관할구역 등의 항목을 포함하고 있습니다.이 데이터를 통해 연금 수급자와 일반 민원인들이 공단의 오프라인 서비스 접점을 쉽고 빠르게 파악할 수 있도록 돕습니다. 또한, 지역별 서비스 이용 편의성을 높이고, 효율적인 민원 응대 체계 구축을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 대국민 서비스 접근성을 강화하고, 투명한 정보 공개를 통해 신뢰도를 제고하는 데 기여합니다.
