summary_user: 생명보험협회·손해보험협회가 제공하는 퇴직연금 펀드별 정보를 기준일자별 시계열로 담은 건별 데이터로, 펀드명·회사명·기준가격·순자산금액 등을 전국 단위로 제공하며 API 전체 건수는 626,138건이다. 퇴직연금 가입자나 분석가가 "내 DC·IRP 계좌에 담을 보험사 퇴직연금 펀드 중 순자산이 크고 기준가격 흐름이 안정적인 것은 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 퇴직연금 수익률·수수료 데이터와는 회사명·펀드명 매핑이나 같은 기관의 회사코드(cmpyCd)·펀드코드(fndCd) 코드표로만 연결한다.
description_portal: '퇴직연금기본정보는 생명보험협회 및 손해보험협회에서 제공하는 퇴직연금 펀드별 정보를 시계열 형태로 제공하는 데이터입니다. 퇴직연금 상품에 대한 펀드명, 회사명, 기준일자, 순자산금액 등의 항목을 통해 퇴직연금 운용 현황을 확인할 수 있습니다.이 데이터는 1개 오퍼레이션으로 구성되어 있습니다.오퍼레이션은 다음과 같습니다.① 퇴직연금펀드별정보 : 생명보험협회 및 손해보험협회에서 제공하는 퇴직연금 펀드별 정보 퇴직연금의 펀드명, 순자산금액 등 펀드별 정보를 오퍼레이션으로 제공합니다.'
