summary_user: 서울 용산구의 출산장려금 지급 실적을 연도·출산순위(첫째·둘째 등)별로 묶어 1~12월 월별 지급 건수와 금액으로 담은 집계 파일(CSV 약 1.3KB)이다. 용산구 출산 가정이나 정책 분석가가 '용산구에서 해마다 몇째 아이에게 출산장려금이 몇 건, 얼마나 지급됐나'를 확인하는 데 쓴다. 전역 조인 키나 코드 컬럼이 없으므로 다른 자치구 출산장려금 자료와 비교할 때는 연도·출산순위 이름을 맞추고 기관(시군구) 기준으로 직접 연결해야 한다.
description_portal: 서울특별시 용산구 출산장려금지급현황(연도 출산순위 1월(수) 1월(금액) 2월(수) 2월(금액) 3월(수) 3월(금액) 4월(수) 4월(금액) 5월(수) 5월(금액) 6월(수) 6월(금액) 7월(수) 7월(금액) 8월(수) 8월(금액) 9월(수) 9월(금액) 10월(수) 10월(금액) 11월(수) 11월(금액) 12월(수) 12월(금액))에 대한 데이터를 제공합니다.용산구의 출산장려금은 출산율 향상과 가정의 경제적 부담 완화를 위해 제공되는 지원금입니다.  신청 자격은 용산구에 주민등록이 되어 있는 가구로 제한되며, 출산일 기준으로 일정 기간 내에 신청해야 합니다.지원금은 출산 후 일정 기간 내에 신청해야 하며, 신청 시에는 출생증명서, 가족관계증명서, 주민등록등본 등 필요한 서류를 구비하여 용산구청 또는 해당 동 주민센터에 제출해야 합니다. 지급 방식은 일시금으로 이루어질 수 있으며, 지급 금액은 용산구의 예산과 정책에 따라 변동될 수 있습니다.출산장려금은 출산 가정의 경제적 부담을 덜어주고, 지역사회의 출산율 향상에 기여하는 중요한 정책으로, 용산구는 이를 통해 지속 가능한 인구 구조를 유지하고자 노력하고 있습니다.
