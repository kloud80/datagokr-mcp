summary_user: 경기도 소방서 등 관서가 민간 보육기관과 맺은 맞춤형 보육 서비스 협약을 협약 1건 단위로 담으며, 협약 관서·협약 구분·협약 기관명·주소·연락처·협약기간을 포함한다. 교대 근무하는 소방공무원이나 정책 분석가가 '우리 지역 소방서와 협약된 어린이집이 어디이고 협약이 언제까지인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 협약 기관명·주소를 이름으로 맞추거나 사회복지시설 공통 마스터와 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 각 지역 소방서를 중심으로 체결된 민간위탁 맞춤형 보육 서비스 협약의 현황을 정리한 자료로, 협약 관서, 협약 구분, 협약 기관명, 주소, 연락처, 협약기간 정보를 포함하고 있습니다. 이는 소방공무원 등 교대 근무자나 긴급 대응 직군의 육아 부담을 줄이기 위해 맞춤형 보육서비스를 제공하고자 하는 정책적 노력의 일환으로 구성된 협력 체계의 실태를 보여주는 데이터입니다. 특히, 지역 기반 보육 인프라와의 협약 현황을 통해 공공-민간 연계 보육 정책의 운영 실태를 파악하고, 향후 보육 사각지대 해소와 근로자 친화적 복지 정책 수립에 기초자료로 활용할 수 있습니다.
