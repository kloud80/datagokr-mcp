description_portal: ‘서민금융진흥원 연도별 민간사업수행기관 사회적기업 대출기관 현황’ 공공데이터는 「사회적기업 육성법」에 따라 사회적경제기업((예비)사회적기업, 사회적협동조합 등)을 대상으로 신용대출 사업을 수행하는 민간사업수행기관의 연도별 운영 현황을 제공하는 자료입니다. 해당 데이터는 사회적경제 분야의 금융 지원 기반을 구축하고, 자립과 성장을 도모하기 위한 서민금융진흥원의 정책 추진 실적을 보여줍니다. 연도별로 민간사업수행기관의 수, 활동 지역, 기관별 분포 등을 확인할 수 있어, 사회적경제기업에 대한 금융 접근성의 변화 추이와 정책 확산 정도를 분석할 수 있습니다. 이 데이터는 사회적기업을 위한 맞춤형 금융정책 수립 및 민간 협력 기반 마련에 기초자료로 활용됩니다.
