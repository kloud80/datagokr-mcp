summary_user: 자활근로 사업 참여자 정보(2021년~2024년 9월 11일, 근로능력 점수·급여 수급 여부·자격 취득일 등)와 2024년 1~6월 참여자별 월 급여·근태 정보(근무시간·근무금액·초과·야간근무 등)를 참여자 등록번호 단위 건별로 담은 전국 범위 파일(zip)이다. 자활사업을 분석하는 연구자나 정책 담당자가 근로능력 점수나 수급 이력에 따라 자활근로 참여자의 근무시간과 급여 수준이 어떻게 다른지 살피는 데 쓴다. 두 파일은 파일 안의 자활참여자 등록번호로 서로 잇고 자활시설번호는 함께 첨부된 시설 코드북으로 풀지만, 다른 데이터셋과 잇는 전역 조인 키는 실측 컬럼에서 확인되지 않았다.
description_portal: 보건복지부에서 2021년~2024년 9월 11일까지 자활근로 사업에 참여하는 참여자 정보(자활참여자등록번호, 자활시설번호, 사례관리등록일자, 수급경험여부, 수급기간년도, 수급기간월, 상담일자, 연령근로능력점수, 건강상태근로능력점수, 함수기술근로능력점수, 재량근로능력점수, 구직욕구근로능력점수, 가족근로근로능력점수, 생계급여여부, 의료급여여부, 주거급여여부, 교육급여여부, 자격신청일자, 자격취득일자)와 2024년 1~6월까지의 자활근로 참여자의 급여정보(근태기준일자, 자활참여자등록번호, 급여년월, 근무시간, 근무금액, 실비금액, 초과근무시간, 초과근무금액, 기술자격실비금액, 관리자금액, 조퇴시간, 지각시간, 주차금액, 기본근무시간, 야간근무시간, 야간근무금액, 출근시간, 퇴근시간)를 제공하고 있습니다.<데이터 이용 시 참고사항>* 해당 파일 내 자활 시설 코드북이 함께 첨부되어 있으므로 "자활시설번호"는 코드북을 참고
