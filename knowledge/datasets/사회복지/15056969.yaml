summary_user: 경기도 내 장애인 의료재활시설을 시설 한 곳당 한 행으로 담은 현황 데이터로, 시군, 시설명, 인허가일, 영업 상태와 폐업일, 면적, 입소 정원, 자격 보유 인원과 총인원, 지번·도로명 주소, 우편번호, WGS84 위경도를 포함한다. 장애인 가족이나 복지 분석가가 우리 시군에 운영 중인 의료재활시설이 어디에 있고 정원과 인력이 얼마인지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군 코드·이름(SIGUN_CD)이나 시설명·주소 매칭으로 잇고, 좌표를 쓰면 다른 시설·인구 데이터와 위치 기반으로 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 장애인을 위한 의료재활시설 현황을 수록한 자료로, 재활치료와 교육을 동시에 제공하는 시설의 인허가 정보, 운영 상태, 인원수, 위치 정보 등을 포함하고 있습니다. 의료재활시설은 장애인의 일상 복귀와 자립을 지원하기 위한 기능적 회복과 치료적 서비스를 제공하는 전문 복지시설로, 본 자료는 해당 시설의 행정구역별 위치와 운영 상태, 인력 현황 등을 파악할 수 있게 구성되어 있습니다. 도로명주소 및 지번주소와 함께 WGS84 기준의 위도·경도 좌표가 제공되어 위치 기반 분석이 가능하며, 이는 시설 접근성 평가 및 지역사회 내 재활서비스 인프라 분포 분석에 활용될 수 있습니다.
