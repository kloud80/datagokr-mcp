summary_user: 대전광역시 안의 0세 전용 어린이집을 한 곳당 한 행으로 담은 목록 파일로, 어린이집 명칭·소재지 주소·유형·전화번호를 제공한다(약 3KB 크기의 CSV). 갓난아이를 맡길 곳을 찾는 부모가 '우리 동네 근처에 0세반만 운영하는 어린이집이 어디 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 어린이집코드 같은 전역 조인 키가 없어서, 다른 어린이집 기본정보·평가 데이터와는 어린이집 명칭과 주소를 맞춰 보는 방식으로만 연결한다.
limits: 고유 식별 코드가 없어 다른 데이터와 붙이려면 명칭·주소 매칭에 의존해야 하며, 동명 시설이나 표기 차이로 오매칭될 수 있다. 정원·현원·평가 결과 같은 운영 정보는 담고 있지 않다.
