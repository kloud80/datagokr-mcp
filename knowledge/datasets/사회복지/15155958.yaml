status: active
summary_user: 아이돌봄 지원사업에서 아이돌보미 활동내역을 통계ID·통계명·구분·분류별 통계값과 값 단위로 담은 전국 단위 집계 통계이며, 건별 활동 원천 기록이나 지역별 공간 정보는 아니다. 정책 담당자나 연구자가 '전국 아이돌보미 활동이 어떤 구분·분류로 얼마나 이뤄지고 있나'처럼 아이돌봄 서비스 현황을 파악하거나 민간 서비스 연계를 검토할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 통계명·구분명 같은 이름 매핑이나 같은 기관(한국건강가정진흥원)의 다른 아이돌봄 데이터 기준으로만 이어 쓴다.
limits: 전국·비공간 집계라 시군구 등 지역별 비교나 개별 돌보미·가정 단위 분석에는 쓰지 못한다. 공통 조인 키가 없어 결합 시 이름·코드를 직접 맞춰야 한다. 활용신청은 자동승인되며 개발계정은 하루 10,000회로 제한된다.
