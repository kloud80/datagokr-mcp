summary_user: 광주 광산구 관내 기초생활보장수급자를 행정동(읍면동) 단위로 집계한 통계로, 일반·시설 수급자와 생계·의료·주거·교육 급여별 가구 수와 수급권자 수를 담는다(작은 CSV 파일 1개). 구청 복지 담당자나 지역 분석가가 '광산구 어느 동에 생계급여 가구가 몰려 있는가'처럼 동별 복지 수요를 비교하고 시설·서비스 배치를 검토하는 데 쓴다. 전역 조인 키나 행정동 코드가 없어 다른 동별 통계(인구·가구 등)와는 행정동 이름을 맞춰 연결해야 한다.
description_portal: 광주광역시 광산구 관내 기초생활보장수급자에 대한 통계데이터로 일반수급자_가구수, 일반수급자_수급권자수, 시설수급자_수급권자수, 생계급여_가구수, 생계급여_수급권자수 등의 정보를 제공합니다.광주광역시 광산구의 기초생활보장수급자 통계는 수급자의 생활 안정과 복지 정책 수립에 중요한 기초 자료로 활용됩니다. 이 통계에는 일반수급자와 시설수급자의 가구 수 및 수급권자 수, 생계급여 수급자 수와 가구 수 등 다양한 항목이 포함되어 있습니다. 생계급여 수급자 수와 가구 수는 생계급여를 통해 생활을 지원받는 가구와 개인의 수를 나타냅니다. 이러한 통계는 광산구청 복지정책과를 통해 확인할 수 있으며, 지역 주민들에게 필요한 복지 서비스를 제공하기 위한 정책 수립에 중요한 역할을 합니다.
