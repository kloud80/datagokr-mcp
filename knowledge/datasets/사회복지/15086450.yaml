description_portal: 본 데이터는 인천광역시 미추홀구 관내 지역사회서비스투자사업 제공기관 현황을 수록한 자료입니다. 사회서비스 이용 및 이용권 관리에 관한 법률(제4조, 제5조)에 근거하여 운영되는 본 사업은 기준중위소득 150% 이하 가구를 주요 지원 대상으로 하며, 일부 서비스의 경우 소득기준을 적용하지 않고 제공합니다. 서비스 선정은 개별사업별 기준에 따라 달라지며, 정부 지원금은 소득 수준에 따라 차등 지급되고 본인부담금은 10~80% 수준에서 결정됩니다. 지원 방식은 매월 말일 바우처가 생성되어 익월부터 사용 가능하며, 생성된 바우처는 해당 월의 익월까지 이월되어 결제할 수 있습니다. 제공되는 서비스는 아동정서발달, 아동청소년 심리지원, 시각장애인 안마, 정신건강 토탈케어, 장애인 보조기기 렌탈, 장애인 재활승마, 학습지원, 성인심리상담 등 총 13개 사업으로 구성되어 있으며, 일부 사업은 폐지 예정입니다. 신청은 관할 동 행정복지센터를 통해 접수 가능하며, 본 데이터는 서비스 제공기관의 명칭과 위치 등 현황을 담고 있어 지역사회 맞춤형 복지정책 수립과 이용자 편의 증진에 기여합니다.
