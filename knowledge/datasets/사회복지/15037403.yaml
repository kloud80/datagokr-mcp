description_portal: 성남시는 지역 내 장애인의 자립과 사회통합을 위해 다양한 장애인복지관 운영 프로그램을 제공하고 있으며, 각 복지관은 대상자의 연령, 장애유형, 욕구에 따라 특화된 서비스를 운영 중입니다. 대표적으로 성남시 장애인종합복지관, 한마음복지관, 밀알복지관 등이 있으며, 이들 기관은 재활치료, 직업훈련, 평생교육, 문화여가, 권익옹호, 가족지원 등의 영역에서 다양한 프로그램을 실시하고 있습니다.예를 들어, 재활치료 분야에서는 물리·작업치료, 언어치료 등의 전문 서비스를 제공하고 있으며, 직업재활 영역에서는 발달장애인을 위한 직업훈련, 취업 연계 프로그램이 운영됩니다. 또한, 성인 장애인을 위한 컴퓨터 교실, 미술·음악 프로그램, 장애청소년 방과 후 활동 등도 활발히 진행 중입니다.
