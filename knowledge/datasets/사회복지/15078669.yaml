description_portal: ○ 데이터 개요경기도 고양시 등록장애인현황 데이터는 고양시 관내 등록장애인의 현황을 동별, 장애유형별, 장애정도별로 구분하여 제공하는 공공데이터입니다. 고양시 지역 내 등록장애인의 분포와 특성을 파악할 수 있도록 구성된 행정통계 자료입니다.○ 주요 제공 항목등록장애인 수, 심한장애인 수, 심하지 않은 장애인 수를 포함하며, 각 항목별 합계와 성별(남성, 여성) 현황을 함께 제공합니다. 이를 통해 장애유형별 및 장애정도별 인구 분포를 확인할 수 있습니다.○ 활용 목적해당 데이터는 지역별 장애인 분포 분석, 복지 수요 파악, 장애인복지 정책 수립 및 행정업무 수행을 위한 기초자료로 활용될 수 있으며, 공공데이터 분석 및 연구자료 등 다양한 분야에서 참고자료로 활용할 수 있습니다.
