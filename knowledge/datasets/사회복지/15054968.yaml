description_portal: '이 데이터는 2012년 12월 연도말 기준으로 산재보험의 주요 보험급여 지급 현황을 사업 종류별(업종)로 상세하게 집계한 통계 자료입니다. 통계 항목은 요양급여, 휴업급여, 상병보상연금, 장해급여, 유족급여, 장의비, 간병급여, 재활급여 등 산재보험의 거의 모든 급여 항목별로 지급 총액(원)을 제공합니다. 이 자료는 각 산업 분야별로 발생하는 산업재해에 대해 공단이 지급한 보상의 규모와 그 재정 지출의 구조를 명확하게 보여줍니다. 특정 업종에서 어떤 종류의 급여(예: 장해급여, 유족급여) 지급 비중이 높은지를 파악하여 해당 업종의 재해 특성과 위험도를 심층적으로 분석하는 데 필수적인 근거 정보라고 판단됩니다.본 데이터는 산업별 위험도 평가 및 산재보험 재정 운영 정책 수립에 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 각 사업 종류별로 지급된 급여 항목별 금액을 비교 분석함으로써, 산업별로 재해 발생의 결과(사망, 장해, 단순 요양 등)가 어떻게 나타나는지 진단할 수 있습니다. 이를 통해 고위험 업종에 대한 산재 예방 활동을 강화하고, 급여별 재정 지출의 적정성을 검토하여 산재보험 기금의 안정적인 운용 계획을 수립하는 데 활용할 수 있습니다. 또한, 이 통계는 산업 구조와 재해 보상 시스템의 관계를 이해하고, 재해 근로자의 실질적인 복지 향상에 기여할 수 있는 정책을 모색하는 데 중요한 역할을 한다고 판단됩니다.'
