summary_user: 전북특별자치도 진안군의 경로당을 한 곳당 한 행으로 담은 시설 목록 파일로, 읍면·시설명·도로명주소·회원 수·설치신고일과 비식별 처리된 대표자 정보를 담는다. 군내 어느 읍면에 경로당이 몇 곳 있고 회원 규모가 어떤지, 오래된 경로당이 어디에 있는지 확인하려는 주민·복지 담당자·분석가가 쓴다. 전역 조인 키나 시설코드는 없으므로 다른 노인복지시설·장기요양기관 자료나 지역 통계와는 도로명주소 또는 읍면 이름으로 맞춰 잇는다.
