description_portal: 전북 특별자치도 진안군에 있는 경로당 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 연번, 읍면 명, 경로당 시설명, 대표자, 소재지 도로명주소, 회원 수, 설치신고일, 데이터기준일자 정보를 제공합니다. 이 자료 중에서 읍면 정보는 진안읍부터 시작하여 용담, 안천, 동향, 상전, 백운, 성수, 마령, 부귀, 정천, 주천면 순으로 제공하며, 대표자명 정보는 개인정보에 해당하여 비식별화 처리를 하였습니다. 또한 설치신고일 정보를 통해 해당 경로당이 언제 지어졌는지도 확인할 수 있습니다. 그리고 이 정보는 매년 12월 초에 현행화하여 제공합니다.
