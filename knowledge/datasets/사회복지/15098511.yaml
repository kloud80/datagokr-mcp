summary_user: 세종특별자치시 치매안심센터를 시설 한 곳당 한 행으로 담으며, 센터명·유형·도로명/지번 주소·좌표·설립년월·면적·부대시설을 포함한다. 의사·간호사·사회복지사 등 직종별 근무 인원, 운영기관과 위탁일자, 치매관리 프로그램, 기준일자도 함께 제공한다. 세종시 주민이나 가족이 가까운 치매안심센터의 위치와 연락처, 운영 프로그램을 찾을 때 쓰고, 분석가가 지역 치매관리 인프라와 인력 규모를 확인할 때도 쓴다. 전역 조인 키가 없어 장기요양기관·사회복지시설 목록 등 다른 데이터와는 센터명·주소 매칭이나 좌표(la, lo) 기반 공간 결합으로만 이어 쓴다.
description_portal: 세종특별자치시 치매센터명, 유형, 주소, 설립년월, 면적, 부대시설, 근무 직원수, 치매센터 운영기관명·대표자명·전화번호, 치매센터 치매관리프로그램  정보를 제공합니다.searchCondition 설명란에 검색 항목 입력 시 출력변수가 대문자인 경우, 출력변수의 대문자 앞에는 언더바(_)를 반드시 입력해주세요.예시)항목명 mrktNm 일 경우 mrkt_Nm 으로 입력 (mrktNm>>mrkt_Nm)
