summary_user: 경상남도 내 가족센터를 시설 1곳당 1행으로 담은 파일로, 시군명·기관명·연락처·홈페이지·도로명/지번 주소·위도·경도·행정동/법정동 코드를 포함한다. 도민이나 정책 분석가가 '우리 시군에 가족센터가 어디 있고 연락처는 무엇인가', '가족센터가 경남 시군별로 고르게 분포하는가'를 확인하는 데 쓴다. 법정동코드(bjd_cd)로 행정구역별 인구·가구 통계나 다른 사회복지시설 목록과 잇고, 위도·경도로 지도 위 접근성 분석에 붙인다.
description_portal: (데이터 수집목적 및 과정) 경상남도 가족센터 데이터는 2024년 6월 기준 경상남도 내 위치한 가족센터에 대한 정보입니다. 경남도 가족센터 위치 및 현황을 분석할 때 활용할 수 있습니다. (데이터 구성 및 세부항목) 경상남도 가족센터 데이터는 시군명, 기관명, 연락처, 홈페이지 주소, 도로명 주소, 지번주소, 위도, 경도, 우편번호, 행정동 코드, 행정동명, 법정동코드, 법정동 명으로 구성됩니다. 총 20건입니다. 미집계 데이터는 공란 처리하였습니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터로 현행화되지 않습니다.
