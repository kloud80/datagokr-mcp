description_portal: 청소년 상담사는 "청소년기본법 제 21조제1항"에 의거하여 실시되는 청소년상담과 관련된 국내 유일의 국가 자격증이며, 성평등가족부는 증가하는 청소년 상담 및 복지지원 수요에 대응하기 위해 청소년 상담, 복지 분야의 전문상담 인력 선발 및 양성 제도인 청소년상담사 자격제도 운영하고 있습니다. 이 자료는 2003년~2025년도 연도별로  청소년상담사 양성 현황 정보를 등급별(1급, 2급, 3급), 성별(남, 여)로 제공하는 정보입니다.2003년부터 2025년까지 총 46,641명의 청소년 상담사가 양성되었으며, 다양한 분야에서 청소년복지 증진을 위해 중추적 역할을 수행중입니다.
