summary_user: 청소년상담사 자격 취득자 수를 연도별로 집계한 전국 단위 통계로, 해마다 총계를 등급별(1급·2급·3급)과 성별(남·여)로 나눠 담는다. 정책 담당자나 연구자가 "청소년상담사 전문인력이 연도별로 얼마나, 어느 등급 중심으로 늘었는가"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물릴 조인 키가 없으므로, 연도를 기준으로 청소년 상담·복지 관련 다른 전국 통계와 나란히 놓고 비교하는 정도로만 이어 쓴다.
limits: 전국 합계만 있고 시도·시군구 구분이 없어 지역별 인력 분포나 지역 통계와의 연계에는 쓰지 못한다. 연도별 집계 수치이므로 개인별 자격 정보나 실제 상담복지센터 배치 현황은 알 수 없다.
