summary_user: 사학연금 기금의 해외주식 위탁운용을 맡은 국내외 운용사를 연도별 선정 결과로 담은 파일(csv, 약 2KB)로, 행마다 년도·소재지·업종·기관명이 들어 있는 건별 목록이다. 사학연금 가입자나 기금 운용 분석가가 "사학연금은 어느 해에 어떤 해외주식 운용사에 자금을 맡겼나"를 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 연기금의 위탁운용사 현황이나 금융회사 데이터와는 기관명(운용사 이름)을 맞춰 이어 써야 한다.
description_portal: 사학연금 가입자 및 기타 이해관계자를 대상으로 사립학교교직원연금기금의 운용 현황에 관한 정보를 투명하게 공개하고자 사립학교교직원연금공단의 연도별 해외주식 위탁운용사 선정과 관련된 현황 데이터를 제공하고 있습니다.개방된 데이터는 각 연도별 사학연금의 해외주식 위탁운용을 담당하는 국내 및 해외의 위탁운용사 선정 결과를 포함하고 있으며, 연 1회 제공되고 있습니다.이 데이터를 통해 공단의 해외 자산 운용 투명성을 제고하고, 기금 운용의 건전성을 공개적으로 보여주고자 합니다. 또한, 글로벌 투자 시장 분석 및 효율적인 위탁운용사 선정 전략 수립을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 자산 관리를 입증하고, 이해관계자들이 공단의 재무 건전성을 명확히 파악할 수 있도록 지원합니다.
