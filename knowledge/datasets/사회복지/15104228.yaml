description_portal: 이 데이터는 "(주)한국가스기술공사"의 협력 중소기업들을 대상으로 진행된 근로자 휴가지원사업의 연도별 실적을 기록한 자료입니다. 해당 사업은 중소기업 근로자의 휴가 활성화를 지원하기 위해 포인트를 배정하고 사용 금액에 따라 정부지원금을 지급하는 복지 제도입니다. 자료는 총 18개의 행으로 구성되어 있으며, 각 행은 연도별 및 기업별 사업 참여 현황을 나타냅니다. 주요 항목으로는 연도, 중소기업 명, 접수인원, 실제 사용인원, 배정 포인트, 사용 금액, 지원금액, 소진율이 포함되어 있습니다.이 데이터는 중소기업 근로자의 복지 향상 및 제도 활성화 효과 분석, 향후 예산 계획 수립과 참여 유도 전략 마련 등 다양한 행정 및 정책적 판단에 유용하게 활용될 수 있습니다.
