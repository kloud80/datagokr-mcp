description_portal: 안성시육아종합지원센터는 전문적인 보육인프라 구축으로 출산에서 양육(만0세~5세)까지 포괄적인 서비스를 지원함으로써 영유아의 건강한 성장을 지원하고자 합니다. 2025년 5월 현기준 안성시 실내놀이터 현황(주소, 연락처 등)을 기재 하였습니다.  안성시는 실내놀이터가 4곳이 있으며 맘대로A+놀이터(본센터), 자유놀이실(죽산), 상상누리뜰(공도), 아이사랑놀이터(아양)가 존재합니다.이용시간 및 이용방법은 시설별 상이하며 자세한 사항은 "안성시육아종합지원센터 홈페이지"(https://www.ans.or.kr)를 참고해 주시기 바랍니다.* 아이사랑놀이터(아양)는 2025년 7월 개원 예정
