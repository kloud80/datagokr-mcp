summary_user: 창원시 관내 장애인거주시설·직업재활시설·지역사회재활시설 등 장애인복지시설을 시설 한 곳당 한 줄로 담은 파일로, 시설 구분·소속 행정구·시설명·소재지 주소·시설장·연락처를 기록한다. 창원시민이나 보호자가 '우리 구에 있는 장애인 주간보호·직업재활 시설은 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 행정구별 장애인 복지시설 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정구 이름이나 시설명·주소 문자열 매칭으로만 잇고, 주소를 좌표로 변환하면 공간정보와 겹쳐 볼 수 있다.
description_portal: 창원시 관내 장애인 복지시설현황에 대한 데이터로 장애인거주시설, 직업재활시설, 지역사회재활시설 등의 항목을 제공합니다.장애인복지시설 현황 데이터는 시설구분, 소속구, 시설명, 소새지, 시설장, 연락처의 다양한 정보를 종합적으로 정리한 자료입니다. 이 데이터는 지역별 복지 인프라 분포, 장애인 돌봄 및 자립 지원 서비스 접근성, 정책 대상자 수요 분석, 민원 대응 및 시설 점검 계획, 복지 행정의 전략 수립과 예산 배분 근거 마련 등에 활용됩니다. 특히 공간정보와 결합하면 서비스 사각지대 파악 및 지역 균형 복지정책 수립에 매우 유용한 기반 자료로 기능할 수 있습니다.
