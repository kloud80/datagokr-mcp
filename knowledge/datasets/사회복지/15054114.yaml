description_portal: 공무원연금공단이 운영하는 화성상록골프장의 이용요금 정보를 정리한 데이터로, 공무원 및 일반인 이용자의 요금을 구분하여 주중·주말 기준으로 제공합니다. 요금은 1인 또는 1팀 기준으로 산정되며, 항목은 그린피, 카트료, 캐디피로 구성되어 있습니다.공무원 이용자에는 재직공무원, 연금수급자, 퇴직연금일시금 수령자 및 배우자(단, 부부 동반 라운딩 시)가 포함되며, 일반 이용자와는 차등 요금이 적용된다. 민간 골프장 및 공단이 운영하는 다른 골프장(천안, 남원, 김해)의 요금체계와 및 주중·주말 간 요금 격차, 이용자별 요금 구간 등을 비교할 수 있습니다.
