description_portal: 본 데이터는 광주광역시 관내에 등록된 국내 결혼중개업 현황을 정리한 자료입니다. 시군구명별로 업체명을 구분하여 수록하고 있으며, 각 업체의 대표자 성명과 소재지 정보를 동 단위 이상 주소 기준으로 제공합니다. 동구, 서구, 남구, 북구, 광산구에 위치한 결혼중개업체가 포함되어 있으며, 동일 업체의 분사무소는 별도 행으로 구분되어 있습니다. 업체명, 대표자 성명, 소재지 항목을 통해 지역별 국내 결혼중개업 운영 현황을 확인할 수 있으며, 결혼중개업 관리 업무와 현황 파악을 위한 기초 자료로 활용 가능합니다.
