summary_user: 경상남도 하동군 안의 장기요양기관을 기관 한 곳당 한 줄로 담은 목록으로, 기관 종류·시설명·급여 종류·읍면·소재지·연락처를 담는다. 하동군에 사는 가족이 부모님 집 근처 읍면에서 방문요양이나 주간보호 같은 급여를 주는 기관을 찾고 연락처를 확인할 때 쓴다. 전역 조인 키가 없어서 건강보험 장기요양기관 목록이나 사회복지시설 자료와는 기관명·주소를 맞춰서 이어야 한다.
