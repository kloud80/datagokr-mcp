summary_user: 아이돌봄 서비스의 요금표를 기준일자별로 담은 전국 단위 비공간 데이터로, 종일제·시간제 구분, 판정등급, 아동 수, 전염성 질병 아동 여부, 추가요금 여부에 따라 30분당 이용금액과 그중 본인부담금·정부지원금이 얼마인지를 행 단위로 보여준다. 아이돌봄 서비스를 신청하려는 부모가 '우리 집 판정등급에서 아이 둘을 시간제로 맡기면 30분에 본인이 얼마를 내고 정부가 얼마를 지원하나'를 확인하거나, 분석가가 등급별 본인부담 구조를 비교하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 실측에서 확인되지 않아, 판정등급명·돌봄구분명 같은 이름을 맞추거나 같은 기관(한국건강가정진흥원) 데이터와 이어 쓴다.
limits: 요금 기준표이므로 실제 이용 건수나 지역별 이용 현황은 담지 않으며, 전국 단일 기준이라 지역 단위 분석에는 쓸 수 없다. 전역 조인 키가 없어 다른 데이터와 연결할 때는 이름 매핑에 의존해야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고, 개발계정은 하루 3,000회로 제한된다.
