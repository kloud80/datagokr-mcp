description_portal: 아이돌봄 서비스이용 요금표 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준일자, 전염성질병아동여부, 아이돌봄구분명(종일제,시간제), 판정등급명, 추가요금여부, 아동수, 본인부담금액, 정부지원금액, 30분당 이용금액 등의 정보를 확인할 수 있습니다.실제 이용자가 부담해야 하는 금액과 정부지원 규모 간의 구조를 파악하는 데 유용합니다. 30분당 단가 기준으로 아동수, 판정등급, 전염성 질병 여부 등 다양한 변수를 고려해 현실적인 비용 분석이 가능하며, 이를 바탕으로 가구별 소득 대비 부담 수준을 측정하거나 요금 체계의 공정성 여부를 진단할 수 있습니다. 정책 수혜 대상의 형평성과 서비스 접근성 확대에 있어 핵심 자료로 활용될 수 있습니다.
