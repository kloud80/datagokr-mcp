status: active
summary_user: 아이돌봄 서비스 회원 수를 기준연월·아이돌봄기관(상위기관 포함)별로 시간제·종일제로 나누고, 소득기준 유형(가형~라형)별 아동 수와 가정 수로 집계해 담는 전국 범위 API입니다. 정책 분석가나 지자체 담당자가 "우리 지역 기관의 종일제 이용 가정 중 소득 하위 유형(가형) 비중이 얼마인가" 같은 계층별 이용 분포와 형평성 질문에 씁니다. 전역 조인 키는 없어 기관번호·기관명(childCareInstNo, childCareInstNm)과 상위기관 정보로 같은 기관의 다른 아이돌봄 현황 데이터와 이름·코드 매핑으로 연결합니다.
limits: 표준 행정코드 같은 전역 조인 키가 없어 다른 기관·지역 데이터와는 기관명이나 같은 기관 코드 매핑으로만 붙일 수 있습니다. 행정단위 공간 정보가 없는 비공간 집계라 좌표 기반 분석에는 쓸 수 없습니다. 호출에는 serviceKey가 필요하고 개발계정은 일 10,000회로 제한됩니다.
