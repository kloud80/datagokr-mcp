description_portal: 아이돌봄 서비스 소득 기준별 회원현황 조회 서비스를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 기준연월, 아이돌봄기관명, 상위아이돌봄기관명, 시간제 및 종일제 서비스유형별로 가형부터 라형까지의 아동수와 가정수의 정보를 확인할 수 있습니다. 소득 기준별 아동 및 가정 수를 세분화하여 확인할 수 있어, 계층별 서비스 이용현황을 파악하는 데 유용합니다. 특히 서비스유형(시간제, 종일제)에 따라 유형별(가형~라형) 분포를 비교함으로써 서비스 접근성 및 형평성 평가가 가능해집니다. 이는 복지 예산의 효율적인 분배와 지원대상 확대 여부 판단에도 기여할 수 있으며, 다양한 정책 수립 시 실효성 있는 자료로 활용될 수 있습니다.
