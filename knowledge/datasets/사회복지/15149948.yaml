summary_user: 경기도 다자녀카드 등 수혜대상자별 카드 혜택을 사용처(공영주차장·공공기관·민간시설 등) 단위로 한 건씩 담고, 혜택명·기간·주소·위경도·시군명·할인율·필요서류·세부 조건(시간제한·조건부 무료 등)을 함께 제공한다. 다자녀 가정이 "우리 시군에서 다자녀카드로 할인받는 주차장이나 시설은 어디이고 무슨 서류가 필요한가"를 확인하거나, 분석가가 혜택 제공 장소의 지역 분포를 볼 때 쓴다. 전역 조인 키는 없어 시군명이나 주소·좌표를 기준으로 다른 시군 단위 통계나 시설 데이터와 이름 매핑으로 잇는다.
description_portal: 이 데이터는 다자녀 가정을 포함한 다양한 수혜대상자에게 제공되는 카드 혜택 정보를 담고 있으며, 공영주차장과 공공기관 및 민간시설 등 사용처별 혜택을 포함하고 있습니다. 주요 항목은 사용처구분, 혜택명, 혜택기간, 혜택참고, 혜택주소, 위경도좌표, 시군명, 등록일, 대상자명, 할인율, 필요서류, 혜택기타사항으로 구성되어 있습니다. 혜택 제공 장소의 공간정보(위경도)를 제공하여 위치 분석에 활용될 수 있습니다. '혜택기타사항'을 통해 시간제한이나 조건부 무료 이용 등 세부 조건을 안내하고 있어, 실질적인 혜택 적용 조건을 이해하는 데 도움이 됩니다. 이 데이터는 지역사회 복지정책 수립, 공간기반 수요 분석, 행정서비스 개선 등의 목적으로 활용될 수 있습니다.
