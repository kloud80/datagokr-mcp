description_portal: 서울특별시 서초구 사회적 경제기업(인증 사회적기업, 예비 부처형 사회적기업, 예비 서울시 사회적기업)에 대한 데이터로 인증여부, 기업명, 인증일, 전화번호, 홈페이지 등에 대한 항목을 제공합니다. 사회적기업은 사회적 가치를 실현하는 동시에 수익을 창출할 수 있는 비즈니스 모델을 수립하고 운영하는 기업. 일반적인 영리 기업은 말 그대로 이윤 극대화를 추구하는 것에 비해 사회적 기업은 일반 기업과 달리 이윤의 극대화가 아니라 사회적 목적 달성을 우선시하는 기업을 의미합니다. 대한민국의 「사회적기업육성법」에 따르면, 사회적기업은 취약계층에게 일자리나 사회서비스를 제공하거나, 지역사회에 공헌함으로써 지역주민의 삶의 질을 높이는 등 사회적 목적을 추구하면서 재화 및 서비스의 생산‧판매 등 영업활동을 하는 기업으로서 정부의 인증을 받은 조직입니다. 쉽게 설명을 드리자면, 사회적기업은 사회적 가치 실현을 최우선 목표로 하면서도, 시장에서의 영업활동을 통해 자립적으로 운영되는 새로운 형태의 기업입니다.
