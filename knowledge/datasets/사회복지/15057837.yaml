summary_user: 경기도 내 경로당을 한 곳씩 담은 시설 목록으로, 시군별 시설명·주소·전화번호·이용회원수와 관할기관·담당부서·담당 연락처, 좌표를 함께 제공한다. 복지 담당자나 분석가가 '우리 시군에는 경로당이 몇 곳이고, 이용회원 규모와 위치 분포는 어떤가'를 확인하거나 노인 여가시설 사각지대를 찾는 데 쓴다. 전역 조인 키는 없으므로 시군 코드·시군명(SIGUN_NM)이나 주소·좌표를 기준으로 다른 시군 통계나 시설 데이터와 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 노인여가복지시설 중 ‘경로당’의 분포와 운영 현황을 담고 있습니다. 경로당은 지역 내 노인들의 여가, 휴식, 상호교류를 위한 기본 복지 공간으로, 특히 고령자 사회에서 매우 중요한 역할을 합니다. 데이터는 경로당 명칭, 주소, 전화번호, 이용회원수는 물론, 관할기관 및 부서명, 담당 연락처까지 상세히 제공합니다. 이를 통해 각 시군별 복지 인프라 분포, 이용자 규모, 행정 관리체계 등을 파악할 수 있으며, 복지정책 설계나 실태 분석 자료로 활용도가 높습니다. 경로당은 규모가 소규모이며 지역 밀착도가 높은 시설이기에, 해당 데이터는 지역균형 발전이나 노인 복지 사각지대 해소에도 기여할 수 있는 기반 자료입니다. 본 자료는 연 1회 갱신되며, 경기도 노인복지과에서 관리합니다.
