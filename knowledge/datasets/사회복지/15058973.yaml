summary_user: 경기도 내 어린이집·학교·기업체 등 집단급식소를 한 곳씩 담은 건별 목록으로, 시군·업소명·도로명/지번 주소·전화번호, 1일 및 아침·점심·저녁·야간·기타 시간대별 급식인원, 위탁급식업체명, 데이터기준일자를 담는다. 위생·급식 정책 담당자나 분석가가 '우리 시군에서 하루 급식인원이 많은 위탁 급식소는 어디이고 어떤 업체가 운영하나'를 확인하거나, 업체별 위탁 계약 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서, 경기도 다른 데이터와는 시군코드(SIGUN_CD)나 시군명으로 묶고 위탁급식업체명·주소는 이름 매칭이나 주소 지오코딩으로 다른 데이터와 잇는다.
description_portal: 경기도 집단급식소 위탁운영 현황 데이터는 도내 어린이집, 학교, 기업체 등에서 운영되는 집단급식소의 위탁운영 실태를 담고 있으며, 시군명, 업소명, 도로명주소 및 지번주소, 전화번호, 1일 급식인원, 급식인원, 위탁급식업소명, 데이터기준일자 등의 항목으로 구성되어 있습니다. 본 데이터는 기관별 위탁급식 운영 여부와 급식 규모를 파악하는 데 유용하며, 특히 아동, 학생, 근로자 등 다양한 계층을 대상으로 한 급식 제공 현황을 비교·분석할 수 있습니다. 또한 위탁업체 명칭이 포함되어 있어 급식업체별 계약 현황 및 운영 특성을 확인할 수 있으며, 위생관리 및 영양 관리 체계 평가에 기초 자료로 활용 가능합니다. 위치정보와 결합하면 GIS 기반의 집단급식소 분포 분석 및 식품 안전관리 정책 수립에도 활용될 수 있습니다.
