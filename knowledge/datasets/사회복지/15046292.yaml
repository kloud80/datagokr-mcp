description_portal: '○ 통계개요* 통계명 : 이혼종류별 이혼건수* 통계종류 : 조사통계, 지정통계* 근거법령 : 통계법 제17조 및 제18조에 의한 지정통계(제10103호)* 작성목적 : 대한민국의 인구규모 및 인구구조를 변동시키는 기본적 요인인 혼인·이혼에대한 현황을 파악하여, 국가의 인구·주택·보건·사회복지·교육·교통 등에 관한정책수립 및 민간기업의 경영계획 수립에 필요한 기초 자료 제공* 조사체계 : 읍·면·동→시·군·구→시도→통계청* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 합의이혼, 재판이혼 등 종류별 이혼건수○ 용어설명* 이혼 : 법률혼주의 원칙에서 이혼신고 수리에 의한 신고와 재판이혼(조정,심판 혹은판결)의 경우는 직권에 의해서 가족관계등록부기재에 의한 신고로 이루어짐* 합의이혼 : 이혼당사자가 법원에서 발급한 협의이혼의사확인서 등본을 이혼신고서에첨부하여 신고(이혼당사자가 서로 원만히 이혼조건을 합의)* 재판이혼 : 이혼당사자 일방 또는 쌍방이 이혼청구소송을 제기하고 가정법원에 의해이혼조건 및 미성년자녀의 친권자 등이 정해진 경우○ 기타* 이혼 : 남편의 주소지 기준'
