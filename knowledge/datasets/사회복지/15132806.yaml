summary_user: 청소년 자기도전포상제 활동 한 건마다 바뀐 이력을 건별로 담고, 운영기관명, 활동상태, 심사비용 결제 여부·일시, 포상심사 신청·결과 일시, 포상감독자 확인 일시, 담당관리자 댓글을 포함하며 범위는 전국이다. 청소년 활동 담당자나 분석가가 포상 심사 신청부터 결과까지 단계별로 얼마나 걸리는지, 운영기관별로 활동이 어느 단계에 머물러 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 운영기관명이나 광역시도 중앙시설 기관명 같은 이름 매핑으로만 연결하고, 활동일련번호(actvSn)는 같은 서비스 안에서 이력을 묶는 용도로 쓴다.
description_portal: 청소년 자기도전 포상제 활동 이력 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 담당관리자댓글, 활동건수, 활동일련번호, 이력일련번호, 운영기관명, 활동상태코드, 심사비용결제여부, 심사비용결제일시, 심사일시, 포상심사신청일시,포상감독자확인일시 등의 내용을 확인할 수 있습니다.심사 신청부터 승인까지 전 과정을 데이터로 축적하여 행정 투명성을 높일 수 있으며, 활동 건수와 담당자 댓글 등은 정성적 평가와 정량적 기록을 동시에 다루는 분석에 유용합니다. 심사비용결제 이력은 재정 흐름 관리 및 활동 단가 산정 근거로 사용될 수 있습니다. 다양한 일시 기록을 활용하여 활동 진행 속도와 성과 분석에도 활용될 수 있습니다.
