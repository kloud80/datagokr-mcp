summary_user: 지방자치단체가 관리하는 마을회관과 경로당을 시설 한 곳당 한 행으로 담은 건별 표준데이터로, 시설명·유형·주소·좌표·영업상태·건립일자·건물면적·관리기관을 포함하며 검증 시 50,000행을 받았다. 주민이나 분석가가 우리 동네 가까운 경로당이 어디에 있고 운영 중인지 확인하거나 지역별 경로당 분포를 파악하는 데 쓴다. 도로명주소·지번주소(address)나 위도·경도(coord)를 키로 다른 노인복지시설 데이터나 시군구 단위 지역 통계와 이어 쓴다.
