summary_user: 광주광역시에서 중소기업협동조합법에 따라 설립인가를 받은 중소기업협동조합을 조합 한 곳당 한 행으로 담은 목록 파일로, 조합명·이사장·설립인가일·주무관청·조합원수·직원수·주소·연락처·휴면 여부가 들어 있으며 포털 설명 기준 2025년 2월 27개 조합입니다. 사업자나 분석가가 '광주에서 활동 중인 업종별 중소기업협동조합은 어디이고 규모(조합원·직원 수)는 얼마나 되나'를 확인할 때 쓴다. 사업자번호 같은 전역 조인 키가 없어 다른 기업·사회적경제 데이터와는 조합명이나 주소를 맞춰 연결해야 한다.
limits: 사업자등록번호나 인증번호 같은 공통 키가 없어 기업 데이터와 정확히 매칭하기 어렵고, 이름·주소 기반 매칭에 의존한다. 범위가 광주광역시 한 곳에 한정된 목록이라 다른 시도와 비교하려면 별도 자료가 필요하다.
