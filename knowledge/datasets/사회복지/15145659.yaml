description_portal: '- 행정안전부에서 운영 및 관리하고 한국중앙자원봉사센터, 지방자치단체 자원봉사센터에서 자원봉사 일감 등록, 봉사 실적 등록 등을 수행하는 1365자원봉사시스템에서 관리하는 데이터로 1365자원봉사포털에서 추출하여 데이터를 제공합니다.- 해당 데이터는 코로나19 자원봉사통계에 대한 내용으로 지역, 연도, 방역소독, 홍보 캠페인, 공공장소 검역 지원, 상담, 격리자 지원, 현장 관계자 지원, 취약계층 지원, 마스크 제작 배부, 농촌 일손 돕기, 착한 소비, 기후위기 대응 활동, 기타 등의 항목을 제공합니다.- 해당 데이터는 1365자원봉사포털에 등록된 봉사활동을 기준으로 하며, 코로나19 대응 자원봉사통계 등록 정보를 제공합니다.'
