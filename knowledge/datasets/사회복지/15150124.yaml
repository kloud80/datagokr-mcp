summary_user: 청소년 봉사활동 프로그램을 건별로 담은 원천 데이터로, 프로그램번호·차수, 활동 영역과 유형, 모집 인원, 신청·활동 기간, 참가비, 진행 상태, 활동 시도·시군구와 장소를 전국 범위로 제공한다. 청소년이나 학부모가 우리 지역에서 지금 신청할 수 있는 무료 봉사활동이 무엇인지 찾거나, 분석가가 지역·활동영역별 봉사 프로그램 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 활동 시도·시군구명(actvSggNm) 같은 이름 매핑으로 지역 통계에 잇거나 같은 기관의 프로그램·단체번호로만 연결한다.
limits: 전역 조인 키가 없어 행정구역 코드로 바로 결합할 수 없고 시도·시군구 이름을 코드로 매핑해야 한다. 이벤트 주기 데이터로 분류되어 있어 정기 갱신을 전제로 해석하지 않는다. 포털 설명에 있는 참여자 명단·지도자 정보는 필드 목록에 없으므로 개인별 참여 기록 분석에는 쓰지 않는다.
