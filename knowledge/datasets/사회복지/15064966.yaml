description_portal: '사립학교교직원 연금수급자들의 수급 현황을 나타내고 있는 데이터로 연금종류별(퇴직연금, 유족연금, 장해연금, 연계연금) 수급자 수 및 연금선택비율을 제공합니다. 위 데이터는1. 연금 구조 개편의 기초 데이터로 활용할 수 있습니다. ex : 특정 시점 연금 선택비율이 급격히 낮아진 데이터 등을 바탕으로 경제적 여건 악화 등의 요인 분석하여 대응책 마련2. 재정추계 및 제도 지속 가능성 평가에 활용할 수 있습니다.  ex : 연금수령 선택 비율이 증가하면 장기 지급 부담이 증가함, 이를 기금 운용 전략 및 적립금 규모 조정 등 재정운용 계획 수립에 활용 3. 연금 유형별 정책 개선 및 서비스 차별화에 활용할 수 있습니다. ex : 장해연금, 유족연금 등 타연금 대비 소수의 연금수급자들을 위한 복지 연계 정책이나 맞춤형 안내 서비스 기획 가능. 4. 연금 제도에 대한 국민인식 제고 자료로 활용할 수 있습니다.  ex : 수급자의 실제 연금 선택 경향 및 증감추세 등을 공개하여 제도의 안정성과 필요성 등 강조'
