summary_user: 대전광역시 전역의 장애인복지관·장애유형별 거주시설 등 장애인복지시설을 시설 한 곳당 한 행으로 담으며, 시설명·유형·종류·소재지·연락처·운영주체·대표자·부지·건물 면적·이용자 정원과 현원·종사자 정원과 현원·주요 사업 내용·입소 대상·개시일을 포함한다. 장애인 가족이나 상담 실무자가 '우리 동네 가까운 곳에 입소 가능한 장애유형별 거주시설이 어디이고 정원 대비 현원은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소(소재지) 문자열 매칭으로만 잇고, 주소를 지오코딩해 행정동별 장애인 인구 통계 등과 겹쳐 본다.
limits: 범위는 대전광역시 한 곳뿐이라 다른 시도와 비교하려면 별도 데이터가 필요하다. 시설 코드 같은 공통 키가 없어 전국 장애인복지시설 목록 등과 연결할 때 이름·주소 매칭 오류에 주의해야 한다.
