description_portal: 대전광역시 장애인복지시설 자료는 대전 전역에 걸쳐 운영 중인 다양한 유형의 장애인복지시설에 대한 최신 현황 정보를 제공합니다. 해당 데이터는 장애인복지관, 장애유형별 거주시설 등 각 시설의 명칭, 위치, 연락처, 입소 대상, 운영 현황 등 구체적인 항목을 포함하고 있습니다. 이용자는 이러한 정보를 활용해 필요에 맞는 복지시설을 신속하게 찾아볼 수 있으며, 각 시설에서 제공하는 복지 서비스 내용, 상담 지원 체계, 지역 내 유관 기관과의 연계 실태 등도 파악이 가능합니다. 2022년 대전광역시 공공데이터 기업매칭지원사업으로 개발한 데이터입니다.
