description_portal: '공무원연금공단에서 제공하는 소급통산 공무원 수 현황 데이터입니다. 본 데이터는 공무원연금법 시행 이전의 공무원, 군인, 잡급직원, 전문직원 등으로 재직한 경력을 현재 공무원 근무기간에 합산(소급통산)받은 공무원 수를 연도별로 집계한 자료입니다. 소급통산 대상 경력은 아래 기간과 같습니다.△ 공무원 경력: 1948년 8월 15일 ~ 1959년 12월 31일△ 군인 경력(장기하사 이하) 1948년 8월 15일 ~ 1959년 12월 31일 △ 잡급직원 경력: 1975년 1월 1일 ~ 1980년 6월 30일 △ 전문직원 경력: 1973년 11월 29일 ~ 1980년 6월 30일소급통산: 공무원연금법 시행전의 공무원 및 군인 경력과 연금제도 시행이후 이 제도의 적용을 받지 못하고 있다가 새로이 적용을 받게 된 경우 법 적용 이전 경력을 현재의 재직기간에 소급하여 가산토록 하는 제도'
