description_portal: 대전광역시 서구 공공기관 장애인 전용주차 면수 현황입니다.(순번, 시설, 주소, 지번주소, 도로명주소, 행정동명, 행정동코드, 법정동명, 법정동코드, 장애인주차구역수, 전체주차장대수)대전광역시 서구_공공기관 장애인 전용주차 면수 현황 (공공데이터 요약)제공 형태 및 접근 방법CSV 파일 형태로 제공되며, 공공데이터포털에서 로그인 없이 자유롭게 다운로드할 수 있습니다. 이 데이터는 2024년 8월 19일 등록 및 수정되었습니다.자동 변환된 오픈API(JSON/XML) 형식도 제공되며, 제공기관은 대전광역시 서구, 관리부서는 홍보담당관입니다. API 활용은 공공데이터포털 회원 가입 및 활용 신청 절차를 통해 가능합니다.구성 항목 및 내용데이터에는 순번, 공공기관명, 주소(지번/도로명), 행정동명 및 법정동명, 장애인주차구역 수, 전체 주차장 대수 등을 포함하고 있어, 각 기관별 주차장 구성 상황을 파악할 수 있습니다.총 데이터 행 수는 32건으로 집계되며, 구청, 도서관, 주민센터 등 공공기관의 주차 현황 정보를 담고 있습니다.갱신 주기 및 다음 업데이트 일정연간 갱신 방식으로 운영됩니다.이용 조건 및 라이선스무료 제공되며, 라이선스는 이용허락 제한 없음으로, 공공·민간 모두 자유롭게 활용 가능합니다.활용 가능 분야교통 복지 정책 수립, 공공기관 접근성 평가, 주차 인프라 분석, 장애인 편의성 개선 방안 마련 등 다양한 목적에 활용할 수 있습니다.예를 들어, 행정동별 장애인전용주차 비율 분석, 기관 유형별 비교, 지도 시각화 등을 통해 장애인 이용 편의성을 진단할 수 있습니다.
