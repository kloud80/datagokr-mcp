description_portal: '공무원연금공단에서 제공하는 심의종류(유족보상, 공무상요양, 장해급여, 국가유공자 사실 확인 등)별 가결, 부결에 대한 데이터 입니다. 1983년부터 2020년까지 연 단위로 구분하여 제공됩니다.1. 국가유공자 사실확인 업무는 행정자치부 유공자 확인업무지침에 의거 "97년 이후 급여심의 대상에서 제외2. 법령개정("16.7.28.)에 따라 급여 용어변경 : 유족보상금 → 순직유족보상금3.  "18. 9. 21. 「공무원 재해보상법」 시행에 따라 명칭변경 : 공무원연금급여심의회 → 공무원재해보상심의회4. 심의회,직권재심의,소송건 포함2019년부터 재해보상심의 업무가 인사혁신처로 이관되어, 데이터 현행화를 하지 않습니다.'
