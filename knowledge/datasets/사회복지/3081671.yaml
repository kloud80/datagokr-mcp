summary_user: 온가족보듬사업(2024년 가족역량강화지원사업에서 명칭 변경)을 운영하는 전국 각 지역 기관을 한 행씩 담은 목록으로, 지역·센터명·전화번호·사업대상년도를 담는다. 가족 지원이 필요한 국민이 우리 지역에서 온가족보듬사업을 하는 센터와 연락처를 찾거나, 분석가가 지역별 운영기관 분포를 살피는 데 쓴다. 실측 컬럼에 기관 코드 같은 공통 조인 키가 없어, 가족센터 등 다른 사회복지시설 목록과는 지역명·센터명을 맞춰 이어 쓴다.
description_portal: 한국건강가정진흥원이 제공하는 가족서비스지원사업인 온가족보듬사업을 운영하는 각 지역의 운영기관 정보 현황정보 입니다. 기존 가족역량강화지원사업에서 2024년부터 온가족보듬사업으로 명칭이 변경되어, 기존에 개별적으로 운영되던 8개의 가족서비스를 하나로 통합하여 다양한 가족 형태와 상황에 맞는 맞춤형 지원을 제공합니다. 개방데이터의 데이터 제공 항목은 연번, 지역, 시설명, 전화번호, 사업대상년도 등이며, 총 220개의 기관 정보가 포함하고 있습니다. 이 데이터를 이용하여 가족지원 정책 수립, 지역별 서비스 제공 계획, 연구 및 분석 등에 활용될 수 있습니다.
