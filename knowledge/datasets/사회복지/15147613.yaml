summary_user: 서울장애인콜택시의 대기시간을 일자·시간대별로 나눠 요청 접수부터 차량 배정·승차까지 걸린 평균값으로 담은 집계 파일입니다(시설명·일자·시간대·평균대기시간, csv 약 375KB). 교통약자 이동권 정책 담당자나 분석가가 "출퇴근 시간대나 주말에 장애인콜택시 대기가 얼마나 길어지는가"를 확인하고 배차·증차 시간대를 정하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 일자·시간대 값을 맞춰 이어 써야 합니다.
description_portal: 서울시설공단_장애인콜택시 시간대별 대기시간 데이터는 서울장애인콜택시 일별 시간대별 대기시간으로 구성된 데이터입니다.이 데이터는 시설명, 일자, 시간대, 평균대기시간로 이루어져 있으며 요청 접수부터 차량 배정 및 승차까지 소요된 평균 대기시간을 시간대별로 구분한 값이 포함되어 있습니다.이를 통해 특정 시간대의 수요·공급 불균형, 출퇴근 시간 집중 현상, 주말·평일 간 대기시간 차이 등을 분석할 수 있으며, 배차 정책 개선, 운영 효율화 전략 수립, 교통약자 이동권 보장 정책 마련, AI 기반 대기시간 예측 모델 개발 등에 활용 가능합니다.
