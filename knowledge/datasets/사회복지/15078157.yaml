description_portal: 아이돌보미 성별 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연월, 아이돌봄기관명, 상위아이돌봄기관명, 당월남성/여성 돌보미수, 누적남성/여성 돌보미 수 등의 내용을 확인할 수 있습니다.성별 균형 실태를 정밀히 분석할 수 있으며, 이를 바탕으로 성인지적 관점의 인력 양성 정책을 수립할 수 있습니다. 특히 남성 돌보미의 비율이 낮은 경우, 이를 개선하기 위한 홍보나 지원 대책을 수립하는 데 활용될 수 있습니다. 돌봄 서비스 다양성과 포용성을 확보하는 데 기초자료로 활용되며, 기관별 성비 비교 분석도 가능합니다. 궁극적으로 성평등한 돌봄 환경 조성을 위한 기초자료로 활용될 수 있습니다.
