summary_user: 아이돌봄기관별로 기준연월(crtrYm) 단위의 당월 돌보미 수와 남성·여성 돌보미 수, 누적 남성·여성 돌보미 수를 담은 전국 범위의 기관별 월간 집계 데이터이다. 정책 담당자나 분석가가 '지역 아이돌봄기관마다 남성 돌보미 비율이 얼마나 낮고 어떻게 변해 왔는가'를 기관별·월별로 비교하는 데 쓴다. 전역 조인 키는 확인되지 않았으며, 아이돌봄기관번호·상위기관번호와 기관명을 이용해 같은 기관(한국건강가정진흥원)이 제공하는 다른 아이돌보미 현황 데이터와 이어 쓴다.
limits: 다른 기관 데이터와 바로 연결할 공통 키가 없어 외부 시설 마스터 등과는 기관명 매핑으로만 붙일 수 있다. 전국 단위의 비공간 데이터라서 좌표나 행정구역 코드 기반의 지도 분석에는 바로 쓰기 어렵다. 호출에는 serviceKey가 필요하며 개발계정은 하루 3,000회로 제한된다.
