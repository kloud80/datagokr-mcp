summary_user: 경기도 내 사회복지법인에 내려진 행정처분을 처분 건별로 담으며, 법인명·시군·소재지 주소·위반내용·처분결과·기준일자를 포함하고 포털 설명상 최근 5년 이력을 다룬다. 시군 담당자나 기부·후원을 고민하는 시민이 '우리 시군의 이 복지법인이 최근 어떤 위반으로 어떤 처분을 받았나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 시군코드(SIGUN_CD)나 법인명·주소 매칭으로 같은 기관의 다른 경기도 데이터와 잇는 정도로만 연결한다.
description_portal: 이 데이터는 경기도 내 사회복지법인에 대한 행정처분 결과 현황을 제공하며, 최근 5년간의 처분이력을 포함합니다. 데이터 항목에는 법인명, 소재지 주소(도로명/지번/우편번호), 시군명 및 코드, 위반내용, 처분결과, 데이터 기준일자 등이 포함되어 있습니다. 이를 통해 각 법인의 위반 유형과 행정적 조치 사항을 확인할 수 있으며, 비영리 법인의 법적 준수 여부 모니터링, 사회복지 정책 수립, 법인 운영 신뢰성 확보 등에 활용될 수 있습니다. API는 XML 및 JSON 포맷으로 제공되며 인증키를 활용하여 시군별 검색이 가능합니다. 데이터는 사회복지사업법 제51조 및 시행령 제24조의2를 기반으로 수집됩니다.
