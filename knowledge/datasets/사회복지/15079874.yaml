summary_user: 경기도 안성시 관내 장애인복지시설을 시설 한 곳당 한 행으로 담은 소규모 파일(약 4KB CSV)로, 시설명·시설구분·입소자격기준·소재지 주소·전화번호·관리기관 정보를 포함한다. 보호자나 복지 담당자가 "안성시 우리 동네 근처에 입소 가능한 장애인 생활시설이 어디 있고 어디로 문의하나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 소재지 주소를 지오코딩하거나 시설명·관리기관명으로 다른 장애인시설 목록과 대조해 이어 쓴다.
limits: 표준 코드나 공통 식별자가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위는 안성시 한 곳의 시설 단위 목록이며, 좌표가 아니라 주소로 위치를 담는다.
