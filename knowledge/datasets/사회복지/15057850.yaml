summary_user: 경기도 내 청소년수련관·수련원·문화의집·청소년카페·체험마을 등 청소년활동 운영기관을 기관 한 곳당 한 행으로, 기관명·시군·전화번호·도로명/지번주소·우편번호·WGS84 위경도와 함께 담은 시설 목록이다. 학부모나 청소년이 우리 시군에 가까운 청소년수련관이 어디이고 연락처가 무엇인지 찾을 때 쓴다. 분석가가 시군별 청소년시설 분포를 볼 때도 쓴다. 전역 조인 키는 없어서, 시군명·시군코드(SIGUN_CD)로 시군 단위 지역 통계와 맞추거나 좌표·주소로 다른 시설 데이터와 공간 결합해 잇는다.
description_portal: 이 데이터는 여성가족부 산하 청소년활동진흥원에서 수집한 경기도 내 청소년 활동 운영 기관의 위치 및 연락처 정보를 제공하는 자료입니다. 청소년수련관, 청소년수련원, 청소년문화의집, 청소년카페, 체험마을 등 다양한 활동 공간이 포함되며, 각 기관의 명칭, 시군명, 전화번호, 도로명주소 및 지번주소, 우편번호, WGS84 좌표계 기반 위도·경도 등의 정보를 포함합니다. 해당 데이터는 청소년의 자기계발, 봉사활동, 문화체험 기회를 제공하는 공공 기반시설에 대한 접근성과 분포를 파악하는 데 활용할 수 있으며, 정책 설계, 공간 분석, 청소년 프로그램 기획 등에 유용합니다. 수시로 갱신되며, 공공 및 상업적 활용이 허용됩니다.
