description_portal: '공무원연금공단에서 제공하는 연령별·재직년수별 퇴직자 현황 데이터로, 재직년수를 구간별로 구분하여 제공합니다.각 연령별로 재직기간 구간에 따라 퇴직자 수가 분류되어 있어, 특정 시기나 경력 구간에서의 조기 퇴직 또는 정년퇴직 집중 현황을 파악할 수 있습니다.본 데이터는 공무원 조직 내 세대별 인력 유출 경향을 분석하고, 조기퇴직 유인 요인 또는 장기근속자 특성 등을 분석하는 데 활용할 수 있습니다.재직기간 : 5년 미만부터 30년 미만까지 5년 단위 및 30~33년 미만, 33년~40년미만, 40년 이상으로 구분연령 : 18세미만부터 65세이상까지 1세단위로 구분'
