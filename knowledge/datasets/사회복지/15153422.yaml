description_portal: '보건복지부에서 사회보장 신설/변경제도 협의완료 사업현황에 대한 정보를 제공하고 있습니다.사회보장협의완료 사업현황 데이터는 협의요청일자, 요청기관명, 사업형태, 사업명 항목으로 구성되어 있습니다.<데이터 이용 시 참고사항>1. 사회보장기본법 제26조에 따라 중앙행정기관의 장과 지방자치단체의 장이 사회보장제도를 신설하거나 변경하는 경우 신설 또는 변경의 타당성, 기존 제도와의 관계, 사회보장 전달체계에 미치는 영향 및 운영방안 등에 대하여 보건복지부 장관과 협의하는 것을 의미2. 협의완료 : 보건복지부장관의 협의검토 결과에서 수정권고 내용이 없거나, 협의요청서를 제출한 중앙행정기관의 장 또는 지방자치단체의 장이 수정 권고 내용을 동의하는 경우에 협의가 성립되어 협의완료 - 조건부 협의완료 : 일정기간 사업 시행 및 성과평가 실시 이후 사업 추진의 지속여부 결정을 조건부로 한시적 사업 추진에 대한 협의완료'
