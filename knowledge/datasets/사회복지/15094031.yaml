summary_user: 국민연금에 가입된 사업장을 법인·개인 형태(구분)로 나누어 기준년월별 사업장 수와 사업장가입자 수를 가입자 규모 구간(5인 미만부터 1000명 이상까지)별로 담은 전국 단위 집계 파일로, 360바이트 크기의 작은 CSV입니다. 분석가가 "법인과 개인 사업장 가운데 소규모(5인 미만·10인 미만) 사업장 비중은 어느 정도인가" 같은 사업장 규모 분포 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년월·형태 구분 이름을 맞춰 붙여야 하며, 사업자번호로 기업 정보와 잇는 사업장 단위 원장(가입 사업장 내역)과 달리 이 파일은 집계라 기업별 연결은 하지 않는다.
description_portal: '해당 데이터는 국민연금공단에 가입된 사업장 데이터를 기반으로 만들어졌습니다.연도별 국민연금에 가입된 사업장의 데이터를 나타냅니다.해당 데이터는 사업장의 형태에 따라 분류되어있고 분류기준은 아래와 같습니다.-사업장 형태: 법인, 개인 사업장의 형태에 따라 분류된 데이터를 통해 국민연금에 가입된 사업장의 수와 사업장가입자의 수를 확인하실 수 있습니다. (데이터 건수가 많은 경우 모든 데이터가 표출되지 않을 수 있습니다.)국민연금공단의 가입된 국민연금 사업장의 데이터를 기반으로 만들어진국민연금 사업장 형태별 사업장 수 및 사업장가입자 수 입니다.'
