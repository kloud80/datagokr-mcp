summary_user: 아이돌봄 인력을 교육하는 아이돌봄교육기관을 기관 한 곳당 한 행으로 담은 시설 목록으로, 전국 범위에서 기관명·도로명/지번 주소·위경도·연락처·운영 여부와 운영 기간·운영 시간·휴일·인근 지하철역과 버스정류장을 제공한다. 아이돌보미 교육을 받으려는 사람이 '우리 지역에서 지금 운영 중인 교육기관은 어디이고 대중교통으로 어떻게 가나'를 확인하거나, 분석가가 시군구별 교육기관 분포를 살피는 데 쓴다. 사업자등록번호(brno)로 사업자 정보와 이어 쓰고, 시도·시군구명과 위경도로 다른 아동·가족 복지시설 데이터와 지역 단위로 맞춰 본다.
description_portal: 아이들을 안전하게 돌보는 아이돌봄교육기관의 시설 정보를 제공하는 오픈 API형 데이터입니다.해당 개방데이터는 아이돌봄교육기관의 POI정보(도로명주소, 지번주소, 위도, 경도), 전화번호, 교육기관명, 설립주체내용, 운영 여부, 운영 시작일자, 운영 종료일자, 인근 버스정류장, 인근 지하철명, 홈페이지 주소, 운영 시간, 휴일 등을 확인할 수 있습니다.또한, 아이돌봄교육기관의 접근성과 운영 현황을 종합적으로 파악할 수 있기 때문에 맞춤형 돌봄 서비스 제공과 지역별 인프라 분석에 활용하면  유용합니다.
