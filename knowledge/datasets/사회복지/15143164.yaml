summary_user: 대구광역시 남구에 설치·운영 중인 다함께돌봄센터를 시설 한 곳당 한 행으로 담은 파일(csv, 389 bytes)로, 시설명·도로명주소·운영요일과 운영시간·개관일자·면적·정원과 현원·직원 수·장애아동 돌봄 여부와 연령대를 담는다. 남구 학부모가 집 근처 초등 돌봄센터의 운영시간과 빈자리(정원 대비 현원), 장애아동 돌봄 가능 여부를 확인하거나, 분석가가 구 단위 돌봄 인프라 수요를 점검하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·도로명주소를 매칭하거나 같은 기관(남구) 자료끼리 연결하며, 사회복지시설 공통 마스터를 참조해 묶는다.
description_portal: 본 데이터는 대구광역시 남구 내 설치 및 운영 중인 다함께돌봄센터의 현황을 파악하고, 아동 돌봄 서비스의 질적 향상 및 지역 내 돌봄 수요에 효과적으로 대응하기 위하여 수집된 자료입니다.수록 항목에는 시설명, 도로명주소, 운영요일 및 운영시간, 개관일자, 시설 면적, 정원 및 현원, 직원 수, 장애아동 돌봄 여부, 장애아동의 유무 및 연령대 등이 포함되어 있으며, 이는 각 센터의 운영실태를 바탕으로 수집된 자료입니다.해당 데이터는 지역 아동 돌봄 정책 수립, 돌봄 인프라 확충 계획, 장애아동 맞춤형 서비스 제공 등에 활용 가능하며, 돌봄 사각지대를 해소할 수 있고 부모의 양육 부담 경감에 기여할 수 있습니다.또한 이 자료는 시민의 돌봄시설에 대한 접근성을 향상시킬 수 있으며, 민간의 복지 서비스 연계에도 활용될 수 있는 기초자료로서의 기능을 수행합니다.
