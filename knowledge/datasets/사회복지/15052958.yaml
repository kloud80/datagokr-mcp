summary_user: 공무원연금 가입자의 연도별 평균 보수(기준소득월액)를 전체와 정무직·일반직·경찰·소방·교육·법관검사·공안직·군무원·연구직·지도직·계약직·공중보건의 등 직종별로 담은 전국 단위 연도 집계 파일이며, 포털 설명상 2001년부터 수록하고 전년 대비 증감액과 증감률도 함께 준다. 연금 분석가나 정책 연구자가 '경찰·소방 공무원의 월평균 기준소득은 일반직과 비교해 어떻게 변해 왔나' 같은 직종 간 보수 격차와 추이를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 이름을 맞춰 붙이는 방식으로만 연결하며, 같은 공단의 생애주기별 가입자 연구정보나 다른 직역연금 통계와 나란히 놓고 본다.
limits: 전국 단위 연도 집계라 지역별·기관별·개인별 보수는 알 수 없다. 표준 조인 키가 없어 다른 표와 이을 때는 연도와 직종 이름을 직접 맞춰야 한다.
