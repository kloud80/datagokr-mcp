summary_user: 서귀포시 안의 경로당을 한 곳씩 담은 목록으로, 읍면동·경로당명·소재지 주소·전화번호·위도·경도·데이터기준일자를 개별 시설 단위로 정리한 파일(약 16KB CSV)이다. 주민이나 복지 담당자가 '우리 동네 가까운 경로당이 어디고 연락처는 무엇인가', 분석가가 '읍면동별 경로당 분포와 접근성이 어떤가'를 따질 때 쓴다. 전역 조인 키는 없어서 읍면동 이름이나 주소·좌표를 기준으로 다른 노인복지시설·지역 통계 자료와 맞춰 이어 써야 한다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘경로당현황’ 데이터는 서귀포시 내 사회복지 휴식공간으로 운영 중인 경로당들의 분포와 기본 현황을 포괄적으로 정리한 공공데이터입니다.주요 필드로는 읍·면·동 행정구획, 경로당 이름, 소재지 주소, 전화번호, 위도·경도 좌표, 회원 수, 데이터 기준일자 등이 포함되어 있으며 이 정보를 기반으로 노인복지 인프라 현황 파악, 복지시설 접근성 평가, 치매·건강 프로그램 도입 분석, 커뮤니티 기반 복지 서비스 설계 등이 가능합니다.또한 GIS 기반 복지 맵 제작, 휴게공간 밀집도 분석, 민원 대응 및 안전관리 전략 수립, 사회복지 정책 수립 및 평가 도구로도 활용할 수 있는 핵심 자료입니다.
