summary_user: 용인시 관내 등록장애인 수를 행정지역·나이별로 나누고, 지체·시각·청각·지적·정신 등 15개 장애유형마다 남녀로 구분해 담은 집계 파일(CSV)이다. 용인시 복지 담당자나 연구자가 '우리 구·동에서 고령 뇌병변 장애인이 얼마나 되나'처럼 지역·연령별 장애인 복지 수요를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정지역 이름을 맞춰 매핑하거나 같은 기관 자료끼리만 연결한다.
limits: 표준 행정구역 코드 같은 공통 키가 없어 다른 지역·전국 통계와 붙이려면 행정지역 이름을 직접 매핑해야 한다. 개인 단위가 아닌 집계 수치라 장애 정도나 연금·수당 수급 여부는 알 수 없다.
