description_portal: 경기도 용인시_연령 및 유형별 등록장애인 현황은 용인시 관내 등록장애인의 현황을 행정구역별·연령별·성별·장애유형별로 세분화하여 제공하는 데이터다.장애유형은 지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐, 정신, 신장, 심장, 호흡기, 간, 안면, 장루요루, 뇌전증 등 15개 유형으로 분류되며, 각 유형별로 남성과 여성의 등록 현황을 구분해 확인할 수 있다.이 데이터는 ① 행정기관 및 정책 담당자에게는 장애인 복지 정책 수립 및 지원 서비스 계획 수립, ② 연구자에게는 장애인 인구 구조 및 분포 특성 분석, ③ 시민에게는 지역 맞춤형 복지 수요 이해에 활용할 수 있다.정기적으로 갱신되어 최신 등록장애인 현황을 반영하며, 지역사회 복지 인프라 개선, 장애인 맞춤형 지원정책 수립, 장기적인 복지계획 연구에 유용한 기초 자료로 쓰인다.
