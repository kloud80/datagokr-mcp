description_portal: 최근 7개년도 사회적기업 물품 및 용역 구매실적 데이터는 공공기관이 사회적가치 실현을 위해 사회적기업 제품과 서비스를 얼마나 적극적으로 구매했는지를 보여주는 중요한 지표입니다. 연도별 구매 금액과 비율을 통해 사회적기업과의 협력 정도, 조달 다변화 노력, 그리고 정부의 사회적경제 활성화 정책 이행 수준을 객관적으로 파악할 수 있습니다. 이 데이터는 공공조달을 통한 사회문제 해결 및 일자리 창출에 기여한 정도를 분석하는 데 활용되며, 향후 사회적기업 대상 우선구매 확대나 지원 정책 수립의 기초자료가 됩니다. 또한 기관의 지속가능경영과 ESG 실천 수준을 평가하는 데도 의미가 큽니다.
