summary_user: 경기도 워라밸링크 플랫폼 메인 화면에 돌아가며 노출되는 캐러셀 콘텐츠를 한 건씩 담는다. 항목은 고유번호, 라벨 문구와 색상, 제목이다. 정책·이벤트·교육·공모전 같은 홍보 콘텐츠가 어떤 주제와 색상 구성으로 노출되는지 살펴보려는 분석가나 콘텐츠 기획자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·라벨 이름을 맞추거나 같은 기관 데이터로만 연결한다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼의 메인 화면에서 회전형으로 노출되는 캐러셀 콘텐츠 정보를 담고 있으며, 고유번호, 라벨 텍스트, 라벨 색상, 라벨 텍스트 색상, 제목 등의 항목으로 구성되어 있습니다. 캐러셀 콘텐츠는 워라밸 관련 정책, 서비스 안내, 이벤트, 교육, 공모전 등 다양한 주제를 포함하고 각 콘텐츠는 색상값을 통해 시각적으로 구분되며, 시의성 있는 정보를 메인에 노출시켜 사용자 접근성과 정책 홍보 효과를 높입니다. 이 데이터는 정책 메시지의 시각적 구성 분석, 홍보 콘텐츠 유형별 분포 분석, 사용자 클릭 유도 전략 설계, 콘텐츠 기획 방향 도출 등에 활용될 수 있습니다.
