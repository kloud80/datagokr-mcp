summary_user: 경상북도 영천시 관내 노인복지시설(포털 설명상 노인요양원 중심)을 시설 한 곳당 한 건으로 담으며, 법인·개인 구분, 상호명, 도로명주소, 전화번호, 위도·경도, 데이터 기준일자를 제공한다. 영천시에 사는 보호자가 집 근처에 어떤 요양시설이 있고 연락처가 무엇인지 찾거나, 분석가가 시 안에서 시설이 어디에 몰려 있는지 지도로 보는 데 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록 등 다른 데이터와는 시설명·주소 매칭이나 좌표로 이어 붙이고, 시군구 단위 지역 통계와는 영천시라는 행정구역으로만 연결한다.
limits: 영천시 한 개 시군구만 다루며 정원·입소 현황 같은 운영 수치는 없다. 다른 데이터와 맞출 공통 코드가 없어 연계하려면 이름·주소 매칭이 필요하다.
