description_portal: 해당 데이터는 경상북도 영천시 내 노인복지시설 현황 데이터입니다. 본 데이터는 영천시 관내에 위치한 노인요양원의 상세 정보를 포함하고 있으며, 시설명, 소재지, 전화번호, 위도, 경도, 데이터 기준일자 등의 정보를 제공하고 있습니다. 이를 통해 영천시 내 노인복지시설의 위치와 운영 현황을 파악할 수 있으며, 또한 시설 유형별로 법인 또는 개인 명의의 시설 구분이 명확히 표기되어 있어, 복지시설의 운영 주체를 파악하는 데도 유용하며 지역 내 복지 서비스의 현황 분석과 정책 수립에 활용될 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 사회복지과로 연락주시기 바랍니다.
