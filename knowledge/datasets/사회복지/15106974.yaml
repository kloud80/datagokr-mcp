summary_user: 광주 동구 관내 경로당을 한 곳당 한 행으로 담은 시설 목록 파일로, 소속 동, 경로당 이름, 운영 형태, 경로당장, 도로명주소를 담는다(csv 약 9KB). 주민이나 복지 담당자가 '우리 동네 가까운 경로당은 어디이며 단독 시설인지 복합시설 안에 있는지'를 확인하거나, 동별 경로당 분포를 살필 때 쓴다. 전역 조인 키는 없어서 동명이나 도로명주소를 매개로 행정동 단위 노인 인구 통계나 다른 노인복지시설 목록과 이름·주소 매칭으로 이어 쓴다.
