description_portal: '사학연금 퇴직 교직원 중 급여 미청구자 관리 현황과 관련된 데이터로, 공단은 퇴직한 이후에 급여를 청구하지 않은 교직원에 대하여 소멸시효가 지나는 것을 방지하기 위해 주기적으로 급여 청구 안내를 하며 관리하고 있습니다. 상담일자,LMS,메일(개인),우편(개인),전화,우편((현)기관),우편((전)기관),메일(기관),방문,기타,계 등의 항목을 제공합니다.(단위 : 건 수)이 데이터를 통해 공단의 투명한 급여 관리 노력을 공개하고, 잠재적 미청구자들이 본인의 급여를 찾아갈 수 있도록 지원하고자 합니다. 또한, 미청구 급여 발생 최소화를 위한 정책 수립 및 제도 개선의 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 연금 운용을 입증하고, 연금 수급권자의 권익 보호에 기여하는 중요한 자료입니다.'
