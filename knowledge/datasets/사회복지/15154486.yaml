description_portal: 이 데이터는 어린이집 설립유형별로 평가가 완료되지 않은 기관의 수를 집계하여 시도별로 정리한 현황 자료입니다. 구분 항목에는 서울, 부산, 대구 등 지역명이 포함되며, 각 지역별로 국공립, 사회복지법인, 법인단체, 민간, 가정, 협동, 직장 어린이집의 미평가 기관 수가 집계되어 있습니다. 이를 통해, 해당 지역 전체 미평가 기관 수를 비율로 환산 및 확인할 수 있습니다. 이 데이터는 특정 지역에서 어떤 설립유형의 어린이집이 평가를 받지 않았는지 기본적인 규모를 보여주며, 각 유형의 상대적 비중을 계산할 수 있습니다. 활용 방법으로는 시도별 전체 미평가 기관 수 대비 운영주체별 비율을 산출하거나, 지역 간 미평가 기관 수를 단순 비교하는 데 사용할 수 있습니다.
