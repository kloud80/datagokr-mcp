summary_user: 인천광역시 내 아동복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 군구·기관명·개설일·시설구분·주소를 담는다(CSV 약 4KB). 보호자나 복지 분석가가 '우리 군구에 어떤 종류의 아동복지시설이 언제부터 운영되고 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 사회복지시설 목록과는 기관명·주소 문자열 매칭이나 군구 이름 매핑으로만 이어 쓴다.
