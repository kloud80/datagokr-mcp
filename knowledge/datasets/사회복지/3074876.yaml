summary_user: 대구광역시 달서구의 노인인구를 행정동(읍면동)별로 전체·남·여 인원수로 집계한 파일로, 담당부서와 기준일자가 함께 붙어 있습니다. 달서구 안에서 어느 동에 노인이 많이 사는지 알고 싶은 분석가나 돌봄·노인일자리 사업을 기획하는 담당자가 동별 대상 규모를 가늠하는 데 쓴다. 전역 조인 키가 없어 동명(동명) 이름 매칭으로 동별 인구·시설 데이터에 이어 쓰고, 시군구 단위로는 달서구 전체 합계로 묶어 다른 구의 노인 통계와 비교한다.
limits: 표준 행정동 코드 같은 전역 조인 키가 없어 다른 데이터와는 동 이름 매칭으로만 연결되므로 동 명칭 변경·분동에 주의해야 한다. 범위가 달서구 한 곳의 읍면동 단위라 다른 시군구나 전국 비교에는 별도 자료가 필요하다.
