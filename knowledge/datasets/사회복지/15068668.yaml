summary_user: 경상남도 내 아동공동생활가정(그룹홈)을 시설 한 곳당 한 행으로 담은 파일로, 시군구·시설명·수용정원과 현원·종사자 수·설치일자·도로명/지번 주소·연락처를 포함한다. 보호아동 가정형 시설을 찾는 보호자나 실무자, 또는 시군별로 정원 대비 현원이 얼마나 차 있는지 비교하려는 복지 분석가가 쓴다. 전역 조인 키는 없어 다른 사회복지시설 목록과는 시설명·주소나 시군구 이름을 맞춰 연결해야 한다.
description_portal: '경상남도 내 아동공동생활가정 현황에 대한 데이터로 순번, 시군구, 시설명, 시설명(영문), 수용정원, 수용인원, 종사자수, 설치일자, 도로명 주소, 지번 주소, 기관연락처 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2026년 4월 27일로, 연간 주기적으로 관리하고 있습니다.아동공동생활가정은 보호가 필요한 아동에게 가정과 같은 주거환경을 제공하는 아동복지시설이며, 아동들이 심리적 안정과 개별적인 돌봄을 받을 수 있도록 돕고 아동의 건강한 성장과 자립을 지원합니다.  현재 도내 26개소에서 아동 139명의 건강하게 성장하고 있으며,  102명의 종사자가 이들을 지원하고 있습니다.   데이터 담당부서 : 경상남도 보육정책과(055-211-4785)'
