summary_user: 부산광역시 내 건강가정지원센터(가족센터)를 센터 한 곳당 한 행으로 담은 시설 현황 파일로, 센터명·소재지·위도·경도·연락처·운영형태·운영기관·관할지역·개소일을 담는다(파일 크기 약 2KB의 소규모 목록). 부산 시민이 사는 구·군을 맡은 가족센터의 위치와 연락처를 찾거나, 분석가가 센터별 관할지역과 위탁 운영기관 분포를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 사회복지시설 데이터와는 센터명·주소 문자열이나 위도·경도 좌표로 맞춰 이어 쓴다.
description_portal: 건강가정지원사업을 통한 가족 안정성 강화 및 가족관계 증진 도모부산광역시 건강가정지원센터 현황에 대한 데이터로 연번, 센터명, 소재지, 위도, 경도, 연락처, 운영형태, 운영기관, 관할지역, 개소일 항목정보를 제공합니다.사례관리 상담사례관리 대상으로 선정된 취약·긴급위기가족 · 심리·경제적 자립, 역량강화 상담 · 정보제공 및 지역사회 자원 활용·연계 · 가정방문, 전화상담, 지역방문을 통한사례관리학습정서지원취학전 아동, 초·중학교 재학(손)자녀, 10세-25세 이하 청소년(한)부모 · 배움지도사(청소년(한)부모 멘토) 파견을 통한 학습지도 및 정서지원 · 중위소득 100% 이하 가구, 1년 이내 지원 · 기초학습지도, 정서적지원 제공 · 배움지도사 5명 활동생활도움지원사례관리대상 중 19세 미만 (손)자녀 생계 주거를 함께하는 가족 · 키움보듬이 파견을 통한 생활도움서비스 지원 · 연 90시간 이내(가정당) 지원 · (손)자녀의 긴급 일시돌봄, 가사활동 지원 등  · 키움보듬이 3명 활동청소년부모10세-25세 이하 청소년(한)부모 · 생활도움·심리정서지원 및 법률상담 지원 등 대상별 맞춤형 서비스 제공 · 지역자원 연계 · 부모가 모두 청소년인 가족, 중위소득 100% 이하 가구 · 학습정서지원, 생활도움지원, 심리상담지원, 법률지원 등 · 청소년(한)부모멘토 1명 활동긴급위기지원가정폭력, 이혼, 자살, 사망, 사고, 경제·사회적 위기사건을 직면한 위기가족 · 지지리더 파견을 통한 심리정서지원 · 키움보듬이 파견을 통한 긴급일시돌봄지원 · 전문상담사 및 심리치료 전문기관 연계 · 가구당 100만원 이내 지원 · 상담서비스 제공 및 사건 해결 과정 동행 등 · 지지리더 3명 활동, 전문상담사 4명 위촉프로그램사례관리 진행중인 대상가정 · 교육·문화프로그램 · 부모교육, 부모-
