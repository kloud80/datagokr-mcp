summary_user: 경기도 내 사회복지법인을 법인 한 곳당 한 행으로 담으며, 법인명·대표자명·설립목적·집계년월·시군코드를 제공한다. 복지 분석가나 지자체 담당자가 "우리 시군에는 노인·아동·장애인 대상 사회복지법인이 몇 곳이고 어떤 목적으로 설립됐나"를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시군코드(SIGUN_CD)나 법인명 매핑으로만 이어 쓴다.
description_portal: '이 데이터는 경기도 내 사회복지법인들의 현황을 담고 있으며, 법인명, 대표자명, 설립목적, 집계년월, 시군코드 등의 정보를 제공합니다. 사회복지법인은 노인, 아동, 장애인 등 취약계층을 대상으로 복지서비스를 제공하기 위해 설립된 비영리 법인입니다. 본 데이터는 사회복지 인프라 파악, 지역 간 복지 자원 비교, 복지 수요 분석, 정책 수립 등에 활용될 수 있습니다. 법인의 설립 목적을 통해 운영의 방향성과 서비스 대상자를 유추할 수 있어, 다양한 사회복지 정책 연구에 기반 자료로 활용 가능합니다.- 사회복지법인 : 「사회복지사업법」에 따라 설립된 법인으로, 아동·노인·장애인 등 사회적 약자를 위한 복지 서비스를 제공하는 비영리 조직입니다.- FOUND_PURPS(설립목적) : 해당 법인이 설립된 주된 이유와 활동 범위를 서술한 항목으로, 법인의 복지 방향성과 사업 내용을 이해하는 데 중요한 정보입니다.'
