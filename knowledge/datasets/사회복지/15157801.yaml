summary_user: 경상북도 영천시가 운영하는 노인교실을 시설 한 곳씩 담은 목록으로, 시설종류·시설명·운영주체·인원수·연락처·도로명 소재지·운영상태·데이터 기준일자를 포함한다. 영천시 주민이나 복지 담당자가 '우리 동네에서 지금 운영 중인 노인교실은 어디이고 정원이 몇 명인가'를 확인하거나, 읍면동별 노인 여가·교육 시설 공급을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열을 맞추거나 같은 기관(영천시) 기준으로만 이어 쓰며, 경로당·노인복지관 등 다른 노인복지시설 목록이나 시군구 단위 지역 통계와 함께 본다.
limits: 표준 시설코드나 행정구역코드 같은 공통 키가 없어 장기요양기관·사회복지시설 목록과 자동으로 결합되지 않고, 이름·주소 매칭에 의존해야 한다. 범위는 영천시 한 곳뿐이어서 시도·전국 비교에는 다른 시군 자료가 필요하다.
