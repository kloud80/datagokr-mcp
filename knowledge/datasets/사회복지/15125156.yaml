summary_user: 국제 청소년 성취포상제 참가자의 활동기록을 입회번호와 활동기록순서 단위로 담은 건별 원천 데이터로, 영역·활동명·활동일자·장소·시간과 계획·완료·변경의 요청·확인 일자, 탐험 활동의 날씨·팀 인원·이동거리·식단 등을 전국 범위로 제공한다. 포상제 운영 담당자나 청소년활동 분석가가 "영역별로 참가자들이 활동을 완료 확인받기까지 얼마나 걸리고 활동시간은 얼마나 되는가" 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 같은 기관의 포상제 관련 데이터와 입회번호·활동프로그램번호로 맞추거나 이름 매핑으로만 이어 쓴다.
limits: 행정구역 코드나 좌표가 없는 전국·비공간 데이터라 지역별 분석이나 시설 데이터와의 직접 결합이 어렵다. 이벤트성으로 생성된 뒤 바뀌지 않는 성격의 데이터이며, 개발계정은 하루 10,000회 호출로 제한된다.
