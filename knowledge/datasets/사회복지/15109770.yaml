summary_user: 건강가정지원센터의 시설 정보를 센터 한 곳당 한 건으로 담은 API 데이터로, 센터명·센터장명·설립주체·운영 여부·주소·좌표·전화·홈페이지·이메일을 제공하며 검증 시 전체 건수는 2건(전국 범위)이었다. 가족 문제 상담이나 가족지원서비스를 찾는 국민이나 지역 가족지원 접근성을 살피는 분석가가 우리 지역의 센터 위치와 연락처를 확인하는 데 쓴다. 도로명주소·지번주소와 위도(lat) 좌표를 키로 다른 사회복지시설 목록이나 지도 데이터와 이어 쓰며, 사회복지시설 공통 마스터를 참조하는 용도로도 쓴다.
description_portal: 가족구성원의 가족 문제 및 여러 사회 문제를 해결하거나 지원할 수 있는 건강가정지원센터의 시설 정보를 조회할 수 있도록 관련 서비스를 제공하는 오픈 API형 데이터입니다. 해당 개방데이터는 건강가정지원센터의 명칭, 센터장명, 설립주체내용, 운영 여부, POI정보(도로명주소, 지번주소, 위도, 경도), 대표전화번호, 홈페이지 주소, 상담 전화번호, 이메일 주소 등을 확인할 수 있습니다. 지역 내 가족지원서비스의 접근성을 높이고, 이용자 맞춤형 서비스 제공을 위한 기반 자료로 활용할 수 있습니다.
