description_portal: '○ 통계개요* 통계명 : 여성긴급전화(1366) 운영실적* 통계종류 : 서울시 여성긴급전화(1366) 운영실적을 제공하는 일반ㆍ보고통계* 작성목적 : 여성폭력 관련 상담현황 및 피해자 지원내역 파악을 통하여 여성의 권익증진을 위한여성정책 마련의 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당기관 및 자치구 → 시도 → 여성가족부* 공표주기 : 정기(매월)* 공표범위 : 지역 - 서울시내용 - 여성긴급전화1366 서울센터의 상담유형별 실적 현황○ 용어설명* 1366 : 위기에 처한 여성에게 1년 365일에 하루를 더하여 충분하고 즉각적인 서비스를 제공한다는 의미로여성인권 향상을 위해 연중 24시간 운영되는 여성긴급전화임* 가정폭력: 남편과 아내, 부모와 자녀, 형제자매 및 기타 동거가족을 포함한 가족구성원 중의 한사람이 다른구성원에게 의도적으로 물리적인 힘을 사용하거나, 정신적인 학대를 통하여 고통을 주는 행위* 성폭력: 강간, 윤간, 강도·강간 뿐만 아니라 성추행, 언어적 희롱, 음란전화, 성기노출, 아내 강간 및 위해를가하는 성적 행위로 모든 신체적, 언어적, 정신적 폭력을 포괄하는 광범위한 개념이며,피해자의 의사에 반하여 피해자가 거부감이나 고통을 느끼게 하는 위법한 행위임* 성매매: 불특정인을 상대로 금품 그 밖의 재산상의 이익을 수수하거나 이를 약속하고 성교행위 등을 하거나그 상대방이 되는 것* 데이트폭력: 데이트 과정에서 일어나는 육체적·언어적·정신적인 폭력을 말함* 디지털성범죄 : 촬영물유포, 불법촬영, 유포불안, 사이버 괴롭힘 및 성희롱, 몸캠 및 해킹, 기타 등* 스토킹 : 온라인, 오프라인 모두 포함'
