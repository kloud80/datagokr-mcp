summary_user: 전국 자연장지 시설을 한 건씩 담은 목록으로, 시도·시군구, 시설명, 주소, 연락처, 공설·사설 구분, 안치능력, 주차대수와 식당·매점·유족대기실·장애인편의시설 같은 편의시설 정보를 시설 단위로 담는다. 유족이나 장례를 준비하는 사람이 '우리 지역에 공설 자연장지가 있고 규모와 편의시설은 어떤가'를 확인하거나, 분석가가 시군구별 자연장지 공급 현황을 비교하는 데 쓴다. 전역 조인 키는 없어서 시도·시군구 이름이나 주소를 매핑해 시군구 노인인구 등 지역 인구·시설 통계와 이어 쓴다.
description_portal: '보건복지부에서 관리하는 보건복지현황 중 2026년 5월 31일 기준 전국 자연장지시설 현황(시도, 시설명, 주소, 전화번호, 주차대수, 공/사설, 안치능력)에 대한 정보를 제공 합니다.<데이터 이용 시 유의사항>* 자연장지 : 자연장으로 장사할 수 있는 구역* 자연장의 장소 : 공설자연장지(산림청장, 다른 중앙행정기관의 장 또는 지방자치단체의 장이 조성한 수목림장이나 그 밖의 자연장지), 사설자연장지(개인 · 가족자연장지, 중종 · 문중자연장지, 종교단체 · 법인자연장지)* 안치 : 시신의 부패와 세균번식 등을 막기 위하여 냉장 시설에 시신을 모시는 것* 공설 시설 : 특별시장ㆍ광역시장, 도지사, 시장ㆍ군수ㆍ구청장이 설치ㆍ운영하는 시설* 사설 시설 : 특별시장ㆍ광역시장, 도지사, 시장ㆍ군수ㆍ구청장이 아닌 자가 설치ㆍ운영하는 시설'
