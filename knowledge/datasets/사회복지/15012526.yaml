summary_user: 제주특별자치도 안의 한부모가족복지시설(양육지원시설·일시지원시설·한부모가족복지상담소 등)을 시설 한 곳당 한 행으로 담은 799바이트 규모의 소형 CSV 파일로, 시설유형·시설명·소재지·연락처·데이터기준일자를 담는다. 제주에 사는 한부모가 "6세 미만 자녀와 함께 주거 지원을 받을 수 있는 시설이 어디 있고 연락처는 무엇인가"를 찾거나, 분석가가 제주 지역 한부모 지원시설의 유형별 분포를 볼 때 쓴다. 전역 조인 키가 없어 시설명이나 소재지 주소를 기준으로 사회복지시설 공통 마스터 등 다른 시설 목록과 맞춰 이어 쓴다.
description_portal: '제주특별자치도 내에 소재하고 있는 한부모 가족 복지시설과 관련한 데이터를 제공합니다.항목: 시설유형, 시설명, 소재지 등*「한부모가족지원법」- 양육지원시설: 6세 미만 자녀를 동반한 한부모가족에게 자녀를 양육할 수 있도록 주거 등을 지원하는 시설- 일시지원시설: 배우자가 있으나 배우자의 물리적ㆍ정신적 학대로 아동의 건전한 양육이나 모 또는 부의 건강에 지장을 초래할 우려가 있을 경우 일시적 또는 일정 기간 동안 모와 아동, 부와 아동, 모 또는 부에게 주거 등을 지원하는 시설- 한부모가족복지상담소: 한부모가족에 대한 위기ㆍ자립 상담 또는 문제해결 지원 등을 목적으로 하는 시설자세한 사항은 제주도청 분야별 복지/여성 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/wel/welNotice/welFacInfo/welFac.htm'
