summary_user: 경기도 안양시 관내 경로당을 한 곳씩 행정동, 경로당명, 주소, 전화번호와 함께 담은 시설 단위 목록 파일(CSV, 약 25KB)이다. 어르신이나 가족이 동네의 가까운 경로당과 연락처를 찾거나, 분석가가 안양시 행정동별 경로당 분포와 접근성을 살피는 데 쓴다. 전역 조인 키가 없어 행정동 이름이나 주소를 기준으로 다른 노인복지시설·장기요양기관 자료나 지역 통계와 맞춰 잇는다.
