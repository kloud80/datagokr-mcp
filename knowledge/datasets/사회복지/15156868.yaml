description_portal: '지역사회보장협의체 _현황 정보양평군 지역사회보장협의체 현황을 제공합니다.(협의체명, 종류, 기능, 민간위원수, 공공위원수, 기수, 데이터양평군지역사회보장협의체는 사회보장급여법 제41조에 따라 양평군 지역사회보장협의체를 두며, 양평군협의체  기구에는 대표협의체, 전문위원회, 실무협의체, 실무분과, 사무국을 둔다.1. 대표협의체: 양평군 소속의 심의 자문기구2. 전문위원회: 대표협의체의 심의 기능의 효율적인 수행을 지원하고 전문성을 보완하기 위한 조직3. 실무협의체: 대표협의체 업무를 효율적을 수행하기 위한 조직4. 실무분과: 실무협의체의 업무를 효율적으로 수행하기 위한 조직'
