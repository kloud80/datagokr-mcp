summary_user: 인천 서구(서해구) 안 노인대학을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설종류·시설명·도로명 소재지·전화번호·운영기관·등록인원·설치일자를 담는다. 파일 크기가 341바이트라 시설 수는 몇 곳에 그친다. 어르신이나 가족이 동네 노인대학이 어디 있고 누가 운영하는지 찾을 때, 분석가가 구 안 고령자 평생교육 시설의 분포와 등록 규모를 볼 때 쓴다. 전역 조인 키가 없어 다른 노인복지시설 목록이나 지역 통계와는 시설명·주소를 맞추거나 같은 기관 기준으로만 잇는다.
description_portal: 본 공공데이터는 인천광역시 서구에 위치한 노인대학들의 운영 현황을 수록한 자료입니다. 본 자료는 인천광역시 서구 노인대학의 시설종류, 시설명, 소재지, 전화번호, 운영기관 등의 정보를 수록하고 있습니다. 노인대학은 지역 내 고령층 주민들에게 평생교육 기회를 제공하는 교육기관입니다. 본 데이터를 통해 노인복지정책 수립, 교육 수요 분석, 지역 내 고령자 친화 인프라 확충 등 다양한 연구 분야에 쓰일수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
