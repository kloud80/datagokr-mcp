description_portal: 본 데이터는 사설 묘지의 현황에 대한 상세 정보를 제공합니다. 이는 경상북도 내에서 개인이나 종중, 문중 등 사인이 설치 및 관리하는 사설 묘지의 운영 실태 및 규모를 파악하고, 장사 시설의 수급 및 관리에 관한 행정 기초 자료로 활용하기 위함입니다.주요 내용으로는 각 묘지 정보를 식별하는 연번과 묘지가 위치한 행정 구역인 시도, 시군구 정보가 포함됩니다. 시설의 공식 명칭인 묘지명과 상세 위치가 기록되어 있으며, 시설 운영의 책임 주체인 관리주체 및 연락을 위한 전화번호 정보가 제공됩니다. 시설의 설립 역사를 알 수 있는 설치년월일 정보도 포함됩니다.묘지의 규모와 이용 현황을 정량적으로 파악할 수 있도록 허가면적과 실제 사용 중인 묘역면적 정보가 제공됩니다. 또한, 총 매장 가능 구수, 기 매장 구수(당해연도 포함 누계), 그리고 향후 매장 가능 수 등 매장 현황 정보가 상세히 기록되어 있으며, 매장 및 개장 건수에 대한 정보도 포함되어 있습니다. 이 자료는 장사 시설 수급 계획 수립 및 국토 이용 효율화 정책 연구 등에 귀중한 기초 자료로 활용됩니다.자료 관련 문의는 054-880-3747로 하시기 바랍니다.
