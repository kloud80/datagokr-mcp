summary_user: 공무원연금공단의 공무원 재해보상 접수·처리 관리 데이터로, 월별 요양급여 우편물 접수·반송·이관 건수, 심사 단계별 보완 처리 건수, 재해보상 취급기관 분류 목록, 접수 유형·직종별 담당자 배정 현황 등 4개 파일을 zip 하나로 묶은 전국 단위 비공간 자료다. 재해보상 행정을 분석하는 연구자나 기관 담당자가 '공무상요양 청구가 심사 중 얼마나 보완·반려되는가'나 '교육청·지자체 같은 취급기관이 어떻게 분류되는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 기관 중분류·소분류 코드나 연금취급기관명을 이름 기준으로 매핑해야만 이어 붙일 수 있다.
description_portal: 공무원연금공단의 공무원 재해보상 접수 및 처리에 관한 관리 데이터입니다. 본 데이터는 4개 파일로 구성되어 있습니다.[요양급여 우편물수신내역]은 월별 우편물(등기, 포털, 현장)의 접수, 반송, 이관 건수를 제공합니다. [재해보상 급여심사 보완현황]은 접수보완, 유선보완, 문서보완, 청구반려 등 심사 단계별 보완 처리 건수를 보여줍니다.또한 [재해보상 기관분류현황]은 재해보상 업무를 취급하는 교육청, 지방자치단체 등 기관의 분류 목록을 , [재해보상 접수담당관리]는 추가상병, 공무상요양, 장해급여 등 접수 유형과 직종(경찰, 교육, 소방 등)별 담당자 배정 현황을 제공합니다.
