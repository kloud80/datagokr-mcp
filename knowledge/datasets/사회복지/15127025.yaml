description_portal: 본 데이터는 **함백산추모공원 봉안당 이용과 관련된 월별 감면 적용 현황(감면자수)**을 제공하는 자료입니다. **연월(월 단위)**을 기준으로 감면 대상 유형별 인원을 집계하여 제공하며, 감면 대상은 국가유공자, 국민기초생활보장수급자, 무연고로 구분되어 있습니다. 각 항목은 해당 월에 봉안당 이용 과정에서 **감면이 적용된 대상자의 수(명)**를 의미하며, 월별·유형별 변동 추이를 통해 감면 운영 규모와 이용 흐름을 확인할 수 있습니다.또한 본 데이터는 데이터기준일자를 함께 제공하여 자료의 산정 및 제공 기준 시점을 명확히 하였습니다. 이를 통해 공공 추모시설의 감면 운영 현황을 객관적으로 파악하고, 사회적 배려 대상자 지원 현황 분석, 운영계획 수립, 관련 행정업무 및 연구·통계 자료 등으로 활용할 수 있습니다. 본 데이터에는 개인을 식별할 수 있는 정보가 포함되어 있지 않습니다.
