description_portal: '청소년유해업소에는 ① 청소년의 출입과 고용이 청소년에게 유해한 청소년출입·고용금지업소와 ② 청소년의 출입은 가능하지만 고용은 유해한 청소년고용금지업소가 있습니다.(규제「청소년 보호법」 제2조제5호 전단).업소의 구분은 그 업소가 영업을 할 때 다른 법령에 따라 요구되는 허가·인가·등록·신고 등의 여부에 불구하고 실제로 이루어지고 있는 영업행위를 기준으로 합니다(규제「청소년 보호법」 제2조제5호 후단).청소년의 출입이 금지되고, 청소년의 고용도 금지되는 청소년출입·고용금지업소는 다음과 같습니다(규제「청소년 보호법」 제2조제5호 가목 및 규제「청소년 보호법 시행령」 제5조).1. 일반게임제공업 및 복합유통게임제공업. 다만, 둘 이상의 업종(1개의 기기에서 게임, 노래연습, 영화감상 등 다양한 콘텐츠를 제공하는 경우는 제외함)을 같은 장소에서 영업하는 경우로서 일반게임제공업 및 아래의 2.부터 9.까지의 청소년 출입·고용금지업소가 포함되지 않은 업소는 청소년의 출입을 허용함2. 사행행위영업(복권발행업, 현상업, 회전판돌리기업, 추첨업, 경품업을 말함)3. 단란주점영업 및 유흥주점영업4. 비디오물감상실업 및 제한관람가비디오물소극장업 및 복합영상물제공업5. 노래연습장업. 다만, 청소년실을 갖춘 노래연습장업의 경우에는 청소년실에 한정하여 청소년의 출입이 허용됨.6. 무도학원업 및 무도장업7. 전기통신설비를 갖추고 불특정한 사람들 사이의 음성대화 또는 화상대화를 매개하는 것을 주된 목적으로 하는 영업.  동대문구에 등록된 청소년유해업소현황 정보로 처리일자, 청소년유해업소업종코드, 청소년유해업소업종명, 건수 등의 정보를 제공합니다.제공 항목 : 처리일자, 업종 코드, 업종 명칭, 해당 건수제공 주기 : 비정기(수시,자료변경시) Sheet 제공※ Sheet 서비스의 경우 최근 1달 데이터만 제공합니다.'
