description_portal: 인구 고령화 진전과 장례 문화 개선에 대한 사회적 관심 증가로 투명하고 합리적인 장례서비스 이용 환경 조성의 필요성이 증대되고 있으며, 각 분야에서 장례식장 운영 현황 및 시설 정보에 대한 활용 요청이 증가함에 따라 보령시는 관할 지역 내 장례식장의 상세 현황 정보를 제공하고 있습니다.개방 데이터는 상호(장례식장명), 소재지(도로명주소), 연락처, 영업 개시 일자, 안치실 보유 현황, 빈소 수, 총 면적(㎡) 등의 항목으로 구성되어 있습니다.지자체·보건복지기관은 장례시설 분포 현황 분석, 지역별 장례서비스 수요 대비 공급 파악, 장례 문화 개선 정책 수립 및 공영장례시설 확충 계획에 활용하고, 연구기관·학계는 장례 산업 현황 분석, 인구 고령화에 따른 장례서비스 수요 예측, 장례 문화 변화 연구 및 지역별 장례비용 비교 연구에 활용하며, 시민·유족은 장례식장 위치 및 규모 비교, 시설 선택 시 참고자료, 장례 준비 및 비용 계획 수립에 활용할 수 있습니다. 또한 복지기관·상조업체는 지역 내 장례서비스 네트워크 구축, 제휴 시설 발굴 및 서비스 품질 비교 분석에 참고할 수 있습니다.
