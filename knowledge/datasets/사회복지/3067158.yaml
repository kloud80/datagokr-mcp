summary_user: 경기도 내 사회복지법인 가운데 노인복지를 주된 목적으로 설립된 법인을 한 행에 한 곳씩 담은 목록이며, 소재 시군명, 법인명, 설립목적(재가노인복지·노인의료복지·주야간보호·노인 일자리 등 수행 사업 내용)으로 구성되고 좌표는 없다. 복지 행정 담당자나 분석가가 '우리 시군에는 재가노인복지나 주야간보호를 목적으로 하는 법인이 몇 곳이나 있나' 같은 지역별 노인복지 자원 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키나 사업자번호·인증번호가 없어서, 다른 데이터와는 시군명이나 법인명을 이름으로 맞춰 이어야 한다.
description_portal: 이 데이터는 대한민국 내 사회복지법인 중 노인복지를 주요 목적으로 설립된 법인의 현황을 담고 있으며, 각 법인의 소재지(시군명), 법인명, 설립목적 등의 항목으로 구성되어 있습니다. 설립목적 항목은 법인별로 수행 중인 재가노인복지, 노인의료복지, 주야간보호시설 운영, 노인 일자리 제공 등 다양한 노인 대상 복지사업의 세부 내용을 포함합니다. 이 데이터는 노인복지 관련 정책 수립, 지역별 복지 자원 분포 분석, 사회복지법인의 운영 목적 비교 등의 연구 및 행정 자료로 활용될 수 있으며, 비영리 단체의 복지활동 현황을 종합적으로 파악하는 데 유용합니다.
