description_portal: 대전광역시 장애인 생산품 우선 구매 현황 자료는 「중증장애인생산품 우선 구매 특별법」 제 6조 제 2항, 제 7조에 근거하여 모든 공공 기관이 연간 총 구매액(제품 및 용역 서비스 총액, 공사 제외)의 일정 비율 이상을 중증장애인생산품으로 의무적으로 구매한 내역을 안내합니다. 2024년 기준, 전국적으로 의무 구매 비율은 1% 이상에서 1.1%로 상향되었으며, 대전 소재 공공 기관과 지방자치단체, 교육청 등이 환산 구매액 기준해 연간 실적을 집계하고 있습니다. 중증장애인 고용 확대와 인식 개선, 생산 시설 판로 지원, 조달 업무 간소화 등 다양한 복지 정책 이슈와 연계해, 구매 담당자 교육, 생산품 전시·홍보, 판로 확대 사업 등 실무 활용이 가능합니다. .
