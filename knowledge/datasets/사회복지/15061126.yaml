summary_user: 성남시 안에 있는 일반·사회적·소비자생활 협동조합을 조합 1곳당 한 행으로 담은 현황 파일로, 구분·조합명·전화번호·설립일자·지번/도로명 주소·이사장·사업내용(업종)을 싣는다. 성남시에서 돌봄·교육 같은 특정 업종을 하는 협동조합이 어디에 있고 언제 설립됐는지 찾으려는 주민·창업 준비자나, 지역 사회적경제 조직 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 조합명이나 주소로 매칭해 잇는다. 사회적경제 부문의 인증번호·사업자번호가 들어 있는 데이터와 맞추려면 이름 매칭을 거쳐야 한다.
description_portal: 성남시 내 협동조합(사회적,소비자생활,일반) 현황 데이터로, 구분, 조합명, 전화번호, 설립일자, 소재지지번주소, 소재지도로명주소, 이사장,  사업내용(업종) 등의 항목으로 구성되어 있습니다. ※ 사회적협동조합은 성남시가 아닌 해당 중앙부처에서 인가가 이루어지며, 데이터 내 사회적협동조합 현황은 협동조합 홈페이지(www.coop.go.kr)의 현황에서 추출하였습니다. ※ 조합이 설립신고(인가) 한 것만으로 법인이 성립되지 않으며, 주사무소 소재지 등기소에 설립등기를 완료해야만 법인이 성립함협동조합 및 소비자생활협동조합은 지역사회 내 자주적 경제활동과 공동체 기반 소비·생산을 실현하는 조직 형태로, 성남시에서도 다양한 분야에서 활발히 운영되고 있습니다. 협동조합은 「협동조합 기본법」에 따라 설립된 일반협동조합과 사회적협동조합으로 구분되며, 주요 분야는 돌봄, 교육, 문화, 농식품, 유통, 청소, 주택관리 등 다양합니다. 일반협동조합은 영리 목적이 가능하며 조합원 중심의 사업을 수행하는 반면, 사회적협동조합은 비영리 목적의 공익서비스 제공을 목적으로 하며 보건·복지·환경 등 사회적 가치를 지향합니다.
