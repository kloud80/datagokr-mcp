description_portal: "이 공공데이터는 경상남도 사천시의 출산 장려 및 다자녀 가정의 경제적 부담 완화 정책 일환으로 시행되는 셋째아 이상 복지보험료 지원 사업의 운영 현황을 집계한 자료입니다.자료에는 지원이 이루어진 시점을 파악할 수 있는 '연도별' 및 '월별' 데이터가 포함되어 있습니다. 특히, 보험 상품을 제공하는 '보험사별' 구분을 통해 각 보험사와의 계약 및 지원 실적을 명확히 확인할 수 있습니다. 핵심 통계는 다음과 같습니다.지원인원: 해당 기간 동안 사천시에서 보험료 지원 혜택을 받은 셋째아 이상 자녀의 수를 나타냅니다.지원금액: 지원 대상자 1인당 실제로 지원된 보험료의 건별 금액을 의미합니다.금액합계: 특정 기간(연도별/월별) 동안 지원된 총 누적 보험료 금액을 나타냅니다.이 데이터는 사천시가 하는 사업의 투명성을 높이고, 저출산 극복 정책의 효과를 분석하는 중요한 기초 자료로 활용됩니다."
