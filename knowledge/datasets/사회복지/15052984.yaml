summary_user: 공무원연금 수급자 중 연금 지급이 정지된 인원을 38세 미만부터 85세 이상까지 연령대별(구분)로 나누고, 국회의원 등 직위 취임·공무원 또는 사립학교 교직원 재직에 따른 전액정지·고의·중과실·파면 등·기타 제한사유·일부정지 같은 정지 사유별 인원을 함께 담은 전국 단위 집계표(약 1.4KB CSV 파일)입니다. 연금 정책 분석가나 연구자가 '재취업에 따른 전액정지가 어느 연령대에 몰려 있고, 나이가 들수록 정지 사유가 어떻게 바뀌는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령대 구분 이름을 맞추거나 같은 공무원연금공단의 다른 수급자 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 연령별 연금정지자수 현황 데이터입니다. 본 자료는 공무원연금 수급자 중 연금지급이 정지된 인원을 38세 미만부터 85세 이상까지 연령대별로 구분하여 제공하며, 정지 사유별로 세부 현황을 함께 제공합니다. 정지 사유는 △ 국회의원 등 특정 직위 취임 △ 공무원 또는 사립학교 교직원 재직으로 인한 전액 정지 △ 고의·중과실·파면 등으로 인한 정지 △ 기타 제한 사유(재판 중, 수사 중 등) △ 일부정지로 구분됩니다. 해당 데이터는 연령층별 주요 연금정지 사유의 분포를 파악할 수 있어, 특정 연령대에서의 비율을 분석하고, 연령 증가에 따른 정지 사유 변화도 확인할 수 있습니다.
