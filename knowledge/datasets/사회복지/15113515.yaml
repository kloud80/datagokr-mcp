description_portal: 경기도 포천시에서 제공하는 연도별 기초생활수급자 현황 데이터입니다. 본 데이터는 연도별 읍·면·동명, 기초생활수급자 총인원수, 남성 인원수, 여성 인원수 등의 항목으로 구성되어 있으며, 포천시 관내 행정구역별 기초생활수급자의 인구 현황을 제공합니다. 이를 통해 지역별 기초생활수급자 규모와 성별 분포, 연도별 변화 추이를 분석할 수 있으며, 복지 수요 예측, 취약계층 지원정책 수립, 사회복지 서비스 제공 및 지역 복지자원 배분을 위한 기초자료로 활용할 수 있습니다. 또한 행정구역, 인구, 복지, 재정 등 다양한 공공데이터와 연계하여 지역별 복지 현황 분석과 정책 연구에 활용할 수 있는 자료입니다. 본 공공데이터는 매년 정기적으로 갱신하여 최신 정보를 제공합니다.
