summary_user: 아이돌봄통합지원 모니터링 점검자 한 명마다 기준연월별로 그 달의 목표 가정 수(crtrMmGoalHshldCnt)와 실제 답변 수를 담는 인력별 성과 데이터이며, 범위는 전국입니다. 점검자별로 월 목표 대비 답변 확보율이 얼마인지, 어느 센터의 모니터링 인력이 목표에 못 미치는지를 보려는 운영·평가 담당자나 분석가가 쓴다. 전역 조인 키는 없고, 센터코드·상위센터코드·점검자관리번호를 같은 기관(한국건강가정진흥원)의 아이돌봄 관련 데이터와 코드로 맞춰 이어 쓴다.
