summary_user: 경기도 안에서 전공과를 설치한 특수학교를 학교 한 곳당 한 행으로 담은 현황 자료로, 공립·사립 구분, 장애영역, 도로명·지번 주소와 좌표, 인가일, 총학급·학년별 학급 수, 운영 중인 직업교육 과정(바리스타·제과제빵 등)을 포함한다. 특수학교 고등과정을 마친 자녀의 진로를 찾는 보호자나 진로교육 담당자가 '우리 시군 근처에서 특정 장애영역 학생을 받고 제과·제빵 과정을 운영하는 전공과가 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 시군 코드·이름(SIGUN_CD)이나 학교명, 주소·좌표를 맞춰 다른 경기도 시군 통계나 지도 자료와 연결한다.
description_portal: 이 데이터는 경기도 내 전공과를 설치한 특수학교의 운영 현황을 정리한 자료로, 학교명, 학교유형(공립/사립), 장애영역, 소재지 정보(도로명 및 지번주소), 전화번호, 인가년월일, 학급 수(총학급, 학년별 학급 수), 설치된 직업교육 과정 등의 항목으로 구성되어 있습니다. 전공과는 특수학교 고등과정을 마친 후 직업생활 적응을 위해 운영되는 과정으로, 각 학교에서 운영하는 과정에는 바리스타, 제과·제빵, 봉제, 생활원예, 서비스실무 등 실생활 및 직업 적응 중심의 교육 내용이 포함되어 있습니다. 본 데이터는 전공과 교육 프로그램 운영 실태, 장애유형별 특성에 맞춘 진로교육 지원 현황, 지역별 교육 인프라 분포 분석 등에 활용될 수 있습니다.
