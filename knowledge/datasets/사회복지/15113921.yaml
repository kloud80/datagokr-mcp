description_portal: 아이돌봄서비스 현장모니터링결과는 서비스 품질과 만족도 향상을 위해 아이돌봄 광역지원센터에서 이용자 가정에 돌봄 내용을 현장에 방문하여 통해 조사한 결과입니다. 이 결과를 토대로 아이돌봄서비스제공기관은 더 나은 서비스를 제공하기 위해 서비스를 관리, 개선하여 이용자의 만족도를 향상시키고 있습니다. 2025년에 실시한 아이돌봄서비스 현장모니터링 결과(3점 척도)는 모니터링을 실시한 센터명, 이용자가 받은 서비스 정보(서비스 종류, 유형), 점수에 따른 가구수로 구성되며 아이돌봄서비스를 분석하기 위해 매년 업데이트하여 csv파일로 제공합니다. 데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.
