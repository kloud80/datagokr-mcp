summary_user: 근로복지공단이 운영하는 퇴직연금의 가입 사업장 수(개소), 가입 근로자 수(명), 적립금(억 원)을 연도별로 집계한 전국 단위 통계로, 372바이트짜리 작은 CSV 파일이다. 정책 연구자나 분석가가 '공단 퇴직연금과 중소기업퇴직연금기금의 가입 사업장·근로자가 해마다 얼마나 늘었나' 같은 제도 확산 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나, 같은 기관(근로복지공단)·고용부의 퇴직연금 파일, 금융위·산업은행의 퇴직연금 API와 나란히 놓고 비교한다.
