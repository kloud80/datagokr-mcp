description_portal: 이 데이터는 근로복지공단이 운영하는 퇴직연금 제도에 대한 가입 사업장 수(개소), 가입 근로자 수(명), 그리고 적립금(억 원) 규모를 연도별로 집계한 통계 자료입니다. 특히, 이 통계는 2022년에 시행된 중소기업퇴직연금기금제도의 가입 현황을 반영한 수치(유지 실적 기준)를 포함하고 있어, 소규모 사업장 근로자의 노후 소득 보장 강화에 대한 정책적 노력을 종합적으로 보여줍니다. 이 자료는 공공 퇴직연금 제도의 성장세와 그 재정 규모를 파악하는 데 필수적인 기초 정보이며, 국내 퇴직연금 시장에서 공공 기관의 역할과 기여도를 분석하는 데 중요한 근거 자료라고 판단됩니다.본 데이터는 노후 소득 보장 정책 및 중소기업 복지 지원 정책 연구에 핵심적인 자료입니다. 정책 입안자는 이 자료를 활용하여 가입 사업장 수와 가입 근로자 수의 연도별 증가 추이를 분석함으로써, 중소기업퇴직연금기금제도 도입 이후의 제도 확산 성과를 객관적으로 평가할 수 있습니다. 이를 통해 미가입 사업장에 대한 가입 유인책을 강화하고, 영세 사업장 근로자들의 노후 소득을 안정화하기 위한 정책 방향을 모색하는 데 활용할 수 있습니다. 또한, 이 통계는 퇴직연금 적립금의 규모 변화를 분석하여 공적 퇴직연금 기금 운용의 효율성과 장기적인 재정 안정성 예측 모델을 구축하는 데 기여할 수 있다고 판단됩니다.
