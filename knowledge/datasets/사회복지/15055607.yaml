summary_user: 전북특별자치도 시군별로 신고 경로당 수를 회원 규모(30인 미만·50인 미만·100인 미만·100인 이상)별로 나누고 미등록 경로당 수와 총 회원수를 함께 담은 시군구 단위 집계표로, 파일 크기가 531바이트인 작은 CSV이다. 노인복지 담당자나 분석가가 "우리 시군에는 경로당이 몇 곳이고 소규모 경로당 비중이 얼마나 되는가"를 다른 시군과 비교할 때 쓴다. 전역 조인 키가 없어 시군명(시군명)을 행정구역 이름·코드로 매핑해 시군구 단위 노인 인구 등 지역 통계와 이어 써야 한다.
description_portal: 전북특별자치도 내 각 시군에 설치된 등록 및 미등록 경로당의 현황과 총 회원 수를 집계한 통계 데이터입니다. 이 자료는 신고된 경로당을 회원 수 규모(30인 미만, 50인 미만 등)에 따라 상세히 분류하고, 전체 회원 수를 제공하여 지역별 어르신들의 여가 시설 이용 현황을 가늠해 볼 수 있게 합니다. 노인 복지 정책 담당자나 지방자치단체는 이 데이터를 통해 지역별 노인 인구 대비 경로당 시설의 공급 수준을 파악할 수 있습니다. 이를 바탕으로 시설 확충이 필요한 지역을 식별하고, 운영 지원 예산을 배분하는 등 어르신들의 편안한 노후 생활을 위한 정책 수립의 기초 자료로 활용할 수 있습니다.
