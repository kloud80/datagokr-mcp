summary_user: 경기도 시군(sigun_nm)과 운영기관(mnginst_nm)별로 위촉된 다문화가족 서포터즈 인원을 합계와 중국·베트남·필리핀·일본·몽골·태국·우즈베키스탄·인도네시아·캄보디아·러시아·라오스·기타 등 출신 국가별로 나눠 담은 집계 자료다. 지자체 담당자나 연구자가 '어느 시군에 어떤 출신국 서포터즈가 얼마나 위촉돼 있나'를 확인하고, 지역별 지원 인력 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 이름을 매핑해 시군별 인구나 다문화가족 수 통계와 이어 쓰고, 운영기관은 사회복지시설(가족센터) 공통 마스터와 이름으로 맞춰 보는 방식으로 연결한다.
description_portal: 이 데이터는 다문화가족 지원을 위한 서포터즈의 위촉 현황을 정리한 자료입니다. 지역별로 얼마나 많은 인원이 참여하고 있는지를 확인할 수 있으며, 이를 통해 다문화가족 지원 인력의 규모와 분포, 지역별 참여도 차이를 파악할 수 있습니다. 이 자료는 지방자치단체나 관련 기관에서 다문화정책 추진, 지원 인프라 확충, 사회통합 프로그램 기획의 기초 자료로 활용될 수 있습니다. 또한 연구기관에서는 다문화가족 지원 정책 효과 분석, 지역별 활동 수준 비교, 사회적 네트워크 형성 현황을 파악하는 데 도움이 됩니다. 활용 시에는 지역별 인구 규모나 다문화가족 수와 함께 교차 분석하면 정책 수요와 공급의 균형 여부를 더 정확히 확인할 수 있습니다.
