description_portal: 공무원연금공단에서 제공하는 사유별 유족보상금 승인건수에 대한 데이터로 1983년부터 2018년까지 정보를 제공하고 있습니다.각 연도별 유족보상금 승인건수를 내과질환, 일반 교통사고, 오토바이 교통사고, 안전사고, 화재진화, 철도사고, 기타로 구분하고 있으며, 공무상 사망의 주요 원인을 파악할 수 있습니다.특정 사유로 인한 유족보상금 승인건수 증가는 해당 분야 안전관리 강화, 재해예방 대책 수립의 기초자료로 활용될 수 있습니다.2019년 이후 재해보상심의 업무가 인사혁신처로 이관되어 통계자료를 현행화하지 않습니다.
