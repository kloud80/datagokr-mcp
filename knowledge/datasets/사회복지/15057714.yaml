summary_user: 경기도 내 어르신 대상 무료급식소를 시설 한 곳당 한 행으로 담은 현황 자료로, 시설명·운영기관과 연락처·급식장소·급식대상·급식시간·휴무일·운영 시작·종료일자·지번·도로명 주소와 위경도 좌표를 포함한다. 어르신이나 가족이 "우리 동네에서 평일 점심을 무료로 주는 급식소가 어디고 몇 시에 여나"를 찾거나, 분석가가 시군별 급식소 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 실측에서 확인되지 않아, 시군 코드(SIGUN_CD)·시군명, 주소, 위경도 좌표를 기준으로 다른 경기도 시군 단위 자료나 지도 자료와 맞춰 이어 쓴다.
description_portal: 경기도 내의 어르신을 대상으로 하는 무료급식소에 대한 현황입니다. 시설명, 소재지주소, 급식시간, 휴무일, 운영정보 등의 정보를 제공합니다.이 데이터는 경기도 내 어르신을 대상으로 운영되는 무료급식소의 현황을 담은 자료로, 각 시설의 명칭, 운영기관명, 급식장소, 급식대상, 급식시간 및 요일, 운영시작일자, 위치정보(주소, 위경도 좌표) 등을 포함합니다. 급식 대상은 주로 60세 이상 노인, 저소득층 또는 수급자이며, 대부분의 시설이 **중식(12:0013:00)**을 제공하며, 운영일은 평일(월금)에 집중되어 있습니다. 주요 운영기관으로는 노인복지관, 종합사회복지관 등이 있으며, 주소와 함께 WGS84 위도·경도 좌표가 포함되어 있어 지역별 급식소 분포, 접근성 분석, 복지공간 최적화 전략 수립 등에 유용하게 활용됩니다. 본 데이터는 노인복지정책 수립, 저소득 노인 지원 프로그램 기획, 공공급식체계 점검 등의 용도로 활용 가능하며, 각 지자체 및 복지 관련 공공기관에서 수집한 공공데이터입니다.
