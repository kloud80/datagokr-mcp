summary_user: 아이돌봄 지원사업의 모니터링 성과를 기준연월·센터(상위센터 포함)·모니터링 구분·서비스 종류와 유형별로 집계해, 거점 모니터링 인원, 목표 가정 수, 실습 가정 수, 응답 가정 수를 담는 전국 범위 오픈API 데이터다. 정책 담당자나 연구자가 "어느 센터가 기준월 목표 대비 실제로 몇 가정을 모니터링하고 응답을 받았는가"처럼 센터별 모니터링 실적과 달성률을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 센터명 같은 이름 매칭이나 같은 기관의 아이돌봄 관련 데이터로만 이어 쓰며, 사회복지시설 공통 마스터와 대조할 때도 이름 매핑이 필요하다.
description_portal: 아이돌봄 모니터링 성과 정보 데이터는 공공데이터법 제24조에 따라 추진되는 제4차 국가중점데이터 개방계획에 포함된 아이돌봄 지원사업 관련 데이터입니다.이 데이터는 국가적 파급효과와 활용가치가 높은 고수요 데이터를 국가중점데이터로 개방한다는 취지에 따라 선정되었으며, 표준화 절차와 품질 점검을 거쳐 신뢰성을 확보한 후 오픈API 방식으로 제공됩니다.이를 통해 이용자는 아이돌봄 서비스 현황 분석, 민간 서비스 연계 검토 등 다양한 정책·연구·서비스 기획 목적에 활용할 수 있으며, 다른 공공데이터와 결합하여 공공 및 민간 분야 전반에서 활용 범위를 넓힐 수 있습니다.
