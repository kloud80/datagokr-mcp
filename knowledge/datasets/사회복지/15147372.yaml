description_portal: 이 자료는 「2020 희망온돌 취약계층 위기가구 지원사업」 거점기관 현황을 정리한 내용입니다. 서울시 각 자치구별로 참여하는 거점기관 목록이 포함되어 있으며, 기관명, 주소, 대표 전화번호 등의 정보가 제공됩니다. 예를 들어 강남구에는 강남종합사회복지관, 능인종합사회복지관, 대청종합사회복지관, 수서명화종합사회복지관 등이 포함되어 있고, 이와 같은 방식으로 서울 전역의 사회복지관 및 관련 기관들이 나열되어 있습니다. 이 자료를 통해 취약계층 위기가구를 지원하는 네트워크 거점 현황을 확인할 수 있으며, 각 기관의 위치와 연락처를 기반으로 복지 정책 추진, 위기가구 발굴, 지역별 연계 서비스 제공 등에 활용할 수 있습니다.
