summary_user: 청소년 매체이용 및 유해환경 실태조사 결과를 조사연도·통계항목·대·중·소분류·문항별 데이터값으로 담은 전국 단위 집계 통계입니다. 정책 담당자나 연구자가 '청소년의 유해매체 이용 실태가 조사연도별로 어떻게 달라졌나' 같은 질문에 답하고 청소년 보호 정책의 근거를 수치로 제시하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 통계항목명·문항내용 같은 이름 매칭이나 같은 기관 자료로만 이을 수 있으며, 시군구·시도 코드가 없어 지역 통계와도 바로 연결되지 않는다.
description_portal: 청소년 매체이용 및 유해환경 실태조사 통계데이터 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 실태조사분류명, 실태조사명, 실태조사년도, 통계항목명, 대분류명, 중분류명, 문항내용의 정보를 확인할 수 있습니다.청소년 보호 정책의 타당성과 필요성을 수치적으로 제시하는 데 유용합니다. 세부 문항별 데이터를 통해 특정 시기나 지역별 문제 양상을 세분화하여 분석할 수 있으며, 청소년 대상 교육 콘텐츠의 기획 및 효과성 평가 자료로도 활용 가능합니다. 전문가뿐 아니라 행정 실무자들도 정기적 실태 점검과 정책 보완 근거로 적극 활용할 수 있으며, 청소년 보호 환경 개선을 위한 기초 자료로 폭넓게 활용될 수 있습니다.
