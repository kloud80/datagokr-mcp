summary_user: 성매매피해상담소, 여성긴급전화 1366, 해바라기센터 등 전국의 여성폭력 방지·피해자 지원 기관을 기관 한 곳당 한 행으로 담은 주소록 파일로, 센터명·위탁기관·전화번호·팩스·주소·기능을 포함한다. 피해자나 주변인, 상담 연계 실무자가 "우리 지역에서 연락할 수 있는 해바라기센터나 1366 센터는 어디이며 전화번호는 무엇인가"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 사회복지시설 데이터와는 기관명이나 주소를 맞춰 대조해야 연결된다.
limits: 기관 코드 같은 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵다. 여성폭력 피해자 보호시설은 법적으로 위치가 비공개이므로, 이 데이터로 보호시설의 소재지를 알 수 없고 상담·연계 기관 위주로만 확인된다.
