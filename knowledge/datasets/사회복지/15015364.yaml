description_portal: 성매매, 성폭력, 가정폭력 등 여성폭력 방지 활동 및 피해자 등에 대한 지원활동을 추진 중인 기관 정보로 구성된 데이터입니다.성매매피해상담소, 여성긴급전화 1366, 해바라기센터 주소록의 정보를 제공하고 있습니다.여성긴급전화1366 주소록에는  기본정보(시설유형, 기관명, 대표번호, 주소)의 데이터가 포함되어 있습니다.성매매피해상담소 주소록에는 기본정보(기관명, 전화번호, 주소), 상담번호의 데이터가 포함되어 있습니다.해바라기센터 주소록에는 기본저보(센터명, 전화번호, 주소), 위탁기관, 팩스번호 데이터가 포함되어 있습니다.
