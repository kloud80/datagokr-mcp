summary_user: 청소년 상담에서 집계된 가족 문제 현황을 학교급·학년별로 나눈 전국 단위 통계로, 건별 상담 기록이 아니라 표 제목·구분·X축·Y축 항목과 그 값(chtVl)으로 이루어진 차트형 집계 데이터를 담는다. 청소년 상담·복지 담당자나 분석가가 "어느 학년에서 어떤 유형의 가족 문제 상담이 많은가"를 확인해 학교 상담 운영이나 가정 연계 프로그램 설계에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 항목 이름 매핑으로만 이어 쓸 수 있고, 지역 단위 코드가 없어 시군구·시도 통계와 직접 연결되지 않는다.
limits: 전국·비공간 집계라 지역별 비교나 개별 상담기관(센터) 단위 분석에는 쓸 수 없다. 조인 키가 없어 다른 통계와 결합하려면 학년·문제유형 등 항목명을 직접 맞춰야 한다.
