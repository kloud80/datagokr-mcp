description_portal: 청소년 상담 중 학교, 학년별 가족 문제 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.교육기관 내 청소년의 가정 문제 실태를 파악하는 데 유용한 통계를 제공합니다. 학년별로 나타나는 가족 문제 유형 차이를 분석해 발달단계에 따른 개입 전략 설계가 가능합니다. 학교 상담실 운영 방침 설정이나 교사 대상 가정 이해 교육자료 개발에 응용될 수 있으며, 청소년 복지와 학교 기반의 가정 연계 프로그램 수립에 활용될 수 있습니다.
