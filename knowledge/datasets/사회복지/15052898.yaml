summary_user: 공무원연금기금을 1982년부터 2024년까지 연도별로 집계해 기금총액과 공공금융·투자유가증권(채권예금·주식·신탁상품·사회간접자본투자)·융자사업(연금대출·목적대출)·학자금대출·주택사업·시설운영사업·지불준비금으로 나눈 운용 금액을 담은 전국 단위 파일(csv)이다. 연구자나 연금 정책 분석가가 공무원연금기금의 자산 배분이 공공금융 예탁 중심에서 유가증권 투자 중심으로 언제 어떻게 바뀌었는지 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(구분)를 기준으로 국민연금·사학연금·군인연금 기금 운용 현황 등과 나란히 비교하는 방식으로 이어 쓴다.
description_portal: 공무원연금기금 연도별 연금기금 운용 데이터(공공금융, 투자유가증권, 융자사업, 주택사업, 시설운영사업 등)로 1982년부터 2024년까지 연도별로 구분되어 있습니다.공공금융(계) = 공공자금기금 + 주택도시기금 + 국민투자기금투자유가증권(계) = 채권·예금 + 주식 + 신탁상품 등 + SOC투자융자사업(계) = 연금대출 + 목적대출1. 목적대출은 생활안정자금 등 사용목적별로 대출한 사업임2. 주택사업은 임대주택보증금을 차감한 금액임3. 학자금대출사업은 2013년도부터 융자보조원가 충당금 최초 계상
