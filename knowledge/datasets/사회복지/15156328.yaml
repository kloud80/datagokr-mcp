summary_user: 인증받은 청소년 수련활동 프로그램별로 인증번호·인증기간·활동유형·교육목표·운영방식·숙박 여부·고위험 여부와 함께, 회차별 실제 활동 일정과 학교급별(초·중·고·대학·기타) 참가 인원을 건별로 담으며 범위는 전국, 지역은 시도 단위다. 연구자나 행정기관이 '어느 시도에서 숙박형·고위험 인증프로그램이 얼마나 운영되고 중학생 참가는 몇 명인가' 같은 질문에 쓴다. 전역 조인 키는 없어 시설명(fcltyNm)·시도명 같은 이름 매칭이나 같은 기관의 인증번호로만 다른 청소년시설·지역 통계 데이터와 잇는다.
description_portal: 청소년 수련활동 인증프로그램 등록 및 실시 정보 서비스는 시설명과 프로그램명을 기준으로 인증된 청소년 수련활동 프로그램의 등록 및 실제 운영 정보를 제공하는 Open API입니다. 활동유형, 교육목표, 운영방식, 활동 일정, 숙박 여부, 이동 방식, 참가학령별 인원, 대규모 여부 등 세부 운영 데이터를 포함하며, 인증기간과 활동 실시 기록까지 조회할 수 있어 프로그램의 실제 운영 특성과 참여 규모를 정량적으로 분석할 수 있습니다. 이를 통해 활동 유형별·연령별 참여 특성 파악, 숙박·비숙박 프로그램 운영 경향 분석, 고위험 활동 여부 모니터링, 인증제 운영 효과 평가 등 다양한 정책·연구 목적의 활용이 가능합니다. 행정기관은 이를 기반으로 인증프로그램 품질관리 강화, 안전요소 점검, 프로그램 운영 기준 정비, 지역별 수련활동 활성도 분석 등 근거 기반 정책을 추진할 수 있으며, 민간·연구기관은 청소년 활동 콘텐츠 개발, 활동 설계 모델 연구, 프로그램 안전성 및 효과성 분석, 참가자 특성 기반 프로그램 개선 등 다양한 분야에서 활용할 수 있습니다.응답 데이터 형식은 XML, JSON형식으로 응답받을 수 있습니다.
