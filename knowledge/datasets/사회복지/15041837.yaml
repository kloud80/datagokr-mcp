summary_user: 서울 강남구에 있는 경로당을 한 곳당 한 행으로 담은 파일로, 소재 동, 경로당명, 도로명·지번 주소, 면적, 운영 여부(Y/N), 관리 부서와 전화번호를 담는다. 주민이나 복지 분석가가 '우리 동네 어느 동에 운영 중인 경로당이 있고 규모는 어느 정도인가'를 확인할 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 동명이나 주소를 문자열로 맞춰 행정동별 고령 인구 같은 지역 통계, 또는 노인복지관·장기요양기관 목록과 이어 쓴다.
description_portal: 서울특별시 강남구에 소재한 경로당 현황 시군구명, 동명, 경로당명, 도로명주소, 면적, 운영여부, 관리기관명, 관리부서명, 관리부서 전화번호, 데이터기준일자 정보를 제공하고 있습니다해당 경로당이 속해이는 동을 정리해 놨으며, 위치를 도로명주소와 지번주소로 표현하고 있습니다. 운영여부는 ‘Y’ 또는 ‘N’이라는 약어로 구분되어 경로당이 현재 운영 중인지, 아니면 운영이 중단되어 있는지를 명확히 알 수 있도록 되어 있습니다.. 관리기관 및 관리부서는 강남구 어르신복지과 입니다. 이용시 참고하시기 바랍니다.
