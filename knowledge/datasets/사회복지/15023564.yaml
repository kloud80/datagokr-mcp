description_portal: 부산광역시 동구 소재 발달재활서비스 제공기관 알림발달재활서비스는 18세 미만 성장기 장애아동의 인지, 의사소통, 적응행동, 감각운동 등의 정신적 감각적 기능 향상과 행동발달을 위한 적절한 발달재활서비스 지원 및 정보 제공하며 부산광역시 동구에는 5개의 제공기관이 있음.기타 장애아동가족지원 사업은 언어발달지원사업 및 장애아가족 양육지원시비스가 있음.언어발달지원 사업은 감각적 장애 부모의 자녀에게 필요한 언어발달지원서비스를 제공하여 아동의 건강한 성장지원 및 장애가족의 자체 역령 강화, 부산광역시 동구에는 제공기관이 없음.장애아동 가족의 일상적인 양육부담을 경감하고 보호자의 사회활동을 돕기 위하여 돌봄 및 일시지적 휴식지원 서비스 제공, 부산광역시에서는 부산종합장애인복지관에서 수행 중임.
