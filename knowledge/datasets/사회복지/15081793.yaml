description_portal: 대전광역시 중증 장애 소아 낮 병동 운영 현황 자료는 지역 내 중증 장애 아동의 재활 치료와 교육을 위해 운영되는 소아 낮 병동의 병원 명칭, 위치, 확보 병상, 시작 연도 등 구체적인 정보를 제공합니다. 대전은 2014년 전국 최초로 소아 낮 병동 의료 서비스를 도입하였으며, 충남대병원, 건양대병원, 보람병원, 웰니스병원 등에서 낮 병동을 운영하고 있습니다. 각 병원은 중증 장애 아동이 입원하지 않고도 학교 대신 병원에 등교하여 하루 6시간 재활 치료와 교육을 받을 수 있도록 지원합니다. 확보 병상 수, 운영 시작 연도, 병원 별 위치 등은 중증 장애 아동과 가족이 실질적으로 이용 가능한 의료 인프라를 파악하는 데 도움이 되며, 재활 치료 수요와 지역 내 서비스 제공 현황을 객관적으로 확인할 수 있습니다.
