description_portal: '이 데이터는 한국여성인권진흥원이 주관한 콘텐츠 공모전의 연도별 수상작 목록을 수록한 자료입니다. 2017년부터 2021년까지의 수상 정보가 포함되어 있으며, 수상연도, 수상분류(예: 만화, 영상 등), 수상등급(대상, 금상, 은상 등), 작품명 등의 항목으로 구성되어 있습니다. 특히, 공모전 명칭은 2020년을 기점으로 기존 ‘성매매 방지 콘텐츠 공모전’에서 ‘여성폭력방지 콘텐츠 공모전’으로 변경되었으며, 2019년도에는 공모전이 진행되지 않았습니다. 본 데이터는 사회적 인식 개선과 여성폭력 예방을 위한 문화 콘텐츠 창작의 흐름과 경향을 파악하는 데 활용할 수 있으며, 공모전 운영 및 정책 기획에 참고 자료로 적합합니다.'
