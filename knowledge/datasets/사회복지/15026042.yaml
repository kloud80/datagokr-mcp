summary_user: 부산광역시 북구 관내 장애인 일자리 배치기관별로 기관명, 기관유형, 주소, 연락처, 배치인원(명)을 한 행씩 담은 소규모 CSV 파일(약 3.7KB)이다. 장애인 당사자나 가족, 복지 담당자가 '북구에서 장애인 일자리가 어느 기관에 몇 명씩 배치돼 있고 어디로 문의하면 되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 기관명이나 주소를 문자열로 맞추는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 부산광역시 북구 관내에 있는 장애인 일자리 현황을 상세히 제공하는 공공데이터입니다. 각 일자리 배치기관의 명칭, 기관유형, 주소, 연락처, 배치 인원 등의 항목이 포함되어 있으며, 이를 통해 지역 내 장애인 고용 현황과 일자리 분포를 체계적으로 파악할 수 있습니다. 이 자료는 장애인 고용 지원 정책 수립과 지역사회 내 장애인 취업 활성화에 중요한 기초 자료로 활용됩니다. 또한 시민들과 관련 기관들이 장애인 일자리 정보를 쉽게 확인하고 활용할 수 있도록 정기적으로 갱신되어 최신성과 정확성을 유지하고 있습니다.
