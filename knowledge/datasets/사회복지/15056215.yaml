summary_user: 제주특별자치도에 있는 여성 대상 복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설 구분·시설명·소재지·운영주체·연락처와 데이터기준일자를 담는다(파일 크기 약 1.6KB의 소규모 CSV). 제주에 사는 여성이나 상담·지원기관 실무자가 "제주에서 이용할 수 있는 여성복지시설은 어디이고 어디로 연락하나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지 주소를 기준으로 맞춰 이어 써야 하며, 사회복지시설 공통 마스터를 참조하는 보조 자료로 쓴다.
limits: 여성 폭력 피해자 보호시설은 법적으로 위치가 공개되지 않으므로, 이 목록에 모든 여성복지시설의 소재지가 담겨 있다고 보면 안 된다. 코드형 조인 키가 없어 다른 시설 데이터와 연결할 때는 이름·주소 매칭에 의존해야 한다.
