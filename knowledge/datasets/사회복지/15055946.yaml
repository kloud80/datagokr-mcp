summary_user: 광주 광산구 안의 아동복지시설(지역아동센터 제외)을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·구분·도로명주소·위경도·설치일자·전화번호·종사자 수·아동 정원과 현원·예산지원액을 포함한다. 주민이 광산구에 있는 아동복지시설의 위치와 연락처를 찾거나, 분석가가 시설별 정원 대비 현원과 종사자 규모를 비교하는 데 쓴다. 전역 조인 키는 없어 시설명·주소 매칭으로 사회복지시설 공통 마스터나 다른 지역 시설 목록과 잇고, 위도·경도로 지도나 행정구역 경계와 겹쳐 쓴다.
limits: 광산구 한 시군구 범위만 담고, 표준 시설코드 같은 공통 키가 없어 다른 데이터와는 이름·주소로만 맞춰야 한다. 같은 부문의 여성 폭력 피해 보호시설은 법적으로 위치를 공개하지 않으므로, 부문 전체 현황을 볼 때 위치 정보가 빠진 시설이 있을 수 있다.
