status: active
summary_user: 청소년 상담에서 집계된 학교급·학년별 정신건강 문제(우울감·불안감·충동성 등) 현황을 차트 형태(제목·구분·X축·Y축 항목과 값)로 담은 전국 단위 집계 통계이며, 건별 상담 원천 자료가 아니다. 상담기관 실무자나 정책 분석가가 '어느 학년에서 어떤 정신건강 문제가 많이 나타나는가'를 확인해 학년별 상담 방향이나 교육 콘텐츠를 기획하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 지역 구분도 없는 비공간 데이터라서, 다른 데이터와는 문제 유형·학년 이름을 맞추거나 같은 기관의 청소년 상담 통계와 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 단위 비공간 집계라서 시도·시군구별 비교나 상담복지센터 같은 개별 기관과의 연결에는 쓰지 못한다. 값(chtVl)은 차트의 X축·Y축 항목 조합으로 해석해야 하며, 공통 코드가 없어 다른 데이터와 결합할 때는 이름 매핑이 필요하다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
