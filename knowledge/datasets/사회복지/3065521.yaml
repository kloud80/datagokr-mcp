summary_user: 경상남도 내 어린이집을 한 곳당 한 행으로 담은 현황 파일로, 시군명·행정동·어린이집 유형·어린이집명·주소를 포함한다(포털 설명상 2023년 12월 31일 기준, CSV 약 190KB). 부모나 분석가가 "우리 동네(시군·행정동)에 어떤 유형의 어린이집이 몇 곳 있나"를 확인하거나 지역별 보육시설 분포를 비교하는 데 쓴다. 전역 조인 키(어린이집코드 등)가 없어서, 다른 보육 데이터와는 시군명·행정동 이름이나 어린이집명·주소를 맞춰 이어 쓴다.
limits: 어린이집 고유코드나 좌표 컬럼이 없어 평가·보육료 공시 등 다른 어린이집 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 포털 설명상 특정 기준일 시점의 현황이므로 이후 개원·폐원은 반영되지 않았을 수 있다.
