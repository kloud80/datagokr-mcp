summary_user: 서울 강서구의 반려동물 등록 현황을 법정동 단위로 집계해 개와 고양이 각각의 등록자 수와 등록 수, 기준일자를 담은 점자파일(blb·brf·brl, zip 약 23KB)이다. 시각장애인 등 디지털 약자가 점사랑 같은 점자 프로그램이나 점자 디스플레이로 "우리 동네에 등록된 개·고양이가 몇 마리인가"를 확인하거나, 분석가가 동별 동물등록 실태를 비교하는 데 쓴다. 전역 조인 키는 없고, 법정동 이름으로 매핑하거나 같은 강서구가 낸 원본(비점자) 반려동물 등록 현황 데이터와 대조해 이어 쓴다.
description_portal: '서울특별시 강서구의 법정동 단위로 구분된 반려동물 등록 현황 정보를 제공합니다.본 데이터는 개와 고양이 등 주요 반려동물을 대상으로 하며, 등록자 수와 등록 수를 각각 항목으로 구분하여 제공하고 있습니다.이를 통해 특정 지역 내 반려동물 보유 및 등록 현황을 파악할 수 있으며, 반려동물 보호 및 복지 정책 수립, 동물 등록제 운영 실태 점검, 지역 맞춤형 동물복지 인프라 확충 등에 유용하게 활용될 수 있습니다. 디지털 약자 공공데이터 접근성 제고를 위하여 점자파일을 개방합니다. * 점자데이터 파일 형식- blb: 편집용 점자 문서- brf: 출력용 점자 문서 (점자 프린터 전용)- brl: 출력용 점자 문서 (점자 디스플레이 장치용)해당 점자데이터 파일 형식의 문서는 점자데이터 시스템 설치 후 확인 가능합니다.ex) 점사랑 (국립국어원 홈페이지에서 다운로드 가능:  https://korean.go.kr/braille/common/greeting.do)'
