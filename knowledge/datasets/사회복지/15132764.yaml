summary_user: 청소년 자기도전포상제 입회 건별 정보를 담으며, 포상단계·입회상태·입회구분·입회신청상태 코드와 입회등록일자, 온·오프라인 구분, 운영기관과 광역시도 중앙시설명을 함께 제공한다. 청소년 정책 담당자나 분석가가 어느 운영기관·시도 중앙시설에서 어떤 포상단계로 몇 명이 입회했는지, 온라인과 오프라인 참여 비중이 어떻게 다른지 살피는 데 쓴다. 전역 조인 키는 없어서 운영기관명·광역시도중앙시설기관명 같은 이름이나 같은 기관의 일련번호(운영기관일련번호 등)로만 청소년 시설·활동 데이터와 맞춰 이어 쓴다.
description_portal: 청소년 자기도전 포상제 입회 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 온/오프라인 구분명, 포상단계코드, 광역시도중앙시설 기관명, 운영기관명, 입회구분코드 등의 내용을 확인할 수 있습니다.다양한 기준으로 참여자 분류가 가능하여 정책 수립 시 정밀한 타깃 설정이 가능하고 온·오프라인 구분에 따라 프로그램 운영 방식의 개선점을 모색할 수 있습니다. 기관별 입회자 추이를 통해 수요 예측이나 기관 간 균형 발전을 위한 참고자료가 될 수 있습니다. 지역 기반 통계 분석을 통해 자기도전포상제의 확산 전략 수립에도 활용될 수 있습니다.
