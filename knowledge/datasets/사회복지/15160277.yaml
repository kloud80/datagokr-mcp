description_portal: 수원시에서는 노인 건강검진 및 아동, 청소년 청년, 장애인과  관련된 지원사업을 운영하고 있습니다. "새빛 생활패키지"라는 이름의 사업을 통해 만 65세 이상 어르신들을 대상으로 기본건강검진, 안질환 검진 및 환급 지원 등을 제공합니다. 또한, 노인들의 인지 기능 저하를 방지하기 위해 인지검사를 실시하고, 관련 병원과 협력하여 필요한 치료와 지원을 제공합니다. 이 외에도 노인들의 삶의 질 향상을 위한 다양한 프로그램과 서비스도 운영하고 있습니다. 자세한 사항은 수원시청의 공식 웹사이트나 관련 부서에 문의하시면 더 많은 정보를 얻을 수 있을 것입니다.
