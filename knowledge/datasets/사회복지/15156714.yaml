summary_user: 전국 지역자활센터 250개소와 광역자활센터 16개소, 총 266행을 센터 한 곳당 한 행으로 담은 현황 파일이다. 근처에서 상담받을 수 있는 자활센터가 어디인지, 시도·시군구별 센터가 몇 곳인지 찾는 국민이나 분석가가 쓴다. 조인 키는 주소(address)뿐이라 주소 기준으로 다른 사회복지시설 데이터나 위치 데이터와 이어 쓰며, 사회복지시설코드 같은 별도 코드 키는 이 파일 필드에 없다.
description_portal: 본 데이터셋은 대한민국 전역의 지역자활센터 및 광역자활센터의 일반 현황에 대해 한국자활복지개발원 대표홈페이지(www.kdissw.or.kr) 게시 기준으로 담고 있습니다. 자활센터는 근로능력이 있는 저소득층에게 집중적·체계적인 자활 지원 서비스를 제공하여 자립을 돕는 핵심적인 사회복지 기관입니다. 지역자활센터 250개소, 광역자활센터 16개소에 대한 상세 정보이며, 전국의 자활 지원 인프라를 한눈에 파악할 수 있는 기초 자료로 지리적 정보(주소)와 연락처가 포함되어 있어 위치 기반 서비스 및 상담 연결 등에 활용 가능합니다.
