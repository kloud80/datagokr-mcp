summary_user: 서울 송파구 관내 지역아동센터를 시설 한 곳당 한 행으로 담은 파일로, 시설명·행정동·주소·설치일·설치자 유형·아동정원·전용면적을 수록한다(CSV 약 1.9KB 규모의 소량 목록). 송파구에 사는 보호자가 집 근처 행정동에 어떤 지역아동센터가 있고 정원이 몇 명인지 확인하거나, 분석가가 동별 돌봄시설 정원 분포를 살펴볼 때 쓴다. 전역 조인 키는 없으므로 행정동 이름이나 주소를 매개로 다른 자치구 지역아동센터 현황, 다함께돌봄 등 사회복지시설 목록, 동별 아동 인구 통계와 이름 매핑으로 이어 쓴다.
