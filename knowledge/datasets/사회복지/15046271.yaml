description_portal: '○ 통계개요* 통계명 : 가구추계(가구주성별)* 통계종류 : 서울시 장래가구추계를 제공하는 일반, 가공통계* 작성목적 : 가구의 양적, 구성적 변화를 추정하여, 미래의 가족형성과 해체 양상에대비하고 노인, 여성, 아동 등 정부의 가족복지정책수립을 위한 기초자료로 활용* 추계방법 : 대상인구 중 가구주가 되는 비율의 미래변동수준을 예측한 후 장래추계인구에적용하여 장래가구를 산출* 공표주기 : 부정기(5년마다 실시하는 인구주택총조사 공표 후 작성)* 공표범위 : 지역 - 서울시내용 - 가구주의 성별, 연령별 추계가구○ 용어설명* 가구 : 1인 또는 2인 이상이 모여서 취사, 취침 등 생계를 같이 하는 생활단위* 가구주 : 호주 또는 세대주와는 관계없이 가구를 실질적으로 대표하는 사람.혈연관계가 없는 사람끼리 모여 사는 경우에는 그중 한 사람(대표자)○ 기 타* 가구추계는 최근의 가구변동 추이가 미래에도 지속된다는 가정이 실현되었을 때예상되는 가구에 대한 전망치임- 향후 사회?경제?정책적인 환경변화 및 사회적 행동 양식 변화에 따라 전망치와 실적치간에 차이가 발생할 수 있음- 또한, 시간이 경과할수록 추계결과의 불확실성이 증가함* 장래가구추계의 가구수와 인구주택총조사의 가구수와 기준시점이 달라 차이가 있음** 기준시점이 가구추계는 7.1일이며 인구주택총조사는 11.1일임* 장래가구추계는 5년 주기로 작성되어 2022년 공표 예정이었으나, 장래가구추계의 기초자료로활용되는 장래인구추계 개편에 따라 최근의 인구 및 가구 추이 변동을 반영한 가구특별추계를 실시함* 2017년 기준 가구수임'
