summary_user: 청소년 또래상담 참여 현황을 통계연월·통계내용·교급·학년·성별별로 나눈 분류 내용과 비율로 담은 전국 단위 집계 통계다. 정책 담당자나 연구자가 "중학생과 고등학생, 남녀 사이에 또래상담 주제 비율이 어떻게 다른가" 같은 질문을 보고 예방교육 방향을 정하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교급·학년·성별 이름을 맞추거나 같은 기관 자료와만 이어 쓴다.
limits: 전국 단위 비공간 집계라 시군구·시도별 비교나 개별 상담 건 분석에는 쓰지 못한다. 이벤트 주기로 생성된 뒤 바뀌지 않는 자료로 분류되어 정기 갱신을 전제로 쓰면 안 된다.
