description_portal: 청소년 또래 상담의 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 통계연월, 통계내용, 학년명, 성별, 분류내용, 분류비율의 정보를 확인할 수 있습니다.청소년 또래 상담 통계 데이터는 연도·학년·성별 등 다양한 기준으로 상담 참여 현황을 분석할 수 있는 기초 정보를 제공하며, 상담 비율과 분류 내용을 통해 학교 내 정신건강 증진 정책이나 예방교육의 방향을 설정하는 데 활용할 수 있습니다. 지역별 또는 시기별 참여율 변화를 비교함으로써 정책 성과에 대한 정량적 평가도 가능합니다. 이처럼 청소년 정신건강 지원 체계 개선 및 예방 상담 정책 수립에 활용될 수 있습니다.
