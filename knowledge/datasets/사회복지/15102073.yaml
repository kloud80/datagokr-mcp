summary_user: 군산시 안에 있는 장애인복지시설(거주시설·복지관·주간보호시설·직업재활시설·수화통역센터 등)을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설구분·시설명·주소·전화번호·운영 법인명을 담는다. 군산에 사는 장애인이나 가족이 "집 근처에 이용할 수 있는 주간보호시설이나 직업재활시설이 어디 있고 연락처는 무엇인가"를 찾을 때 쓴다. 공통 조인 키는 없어서, 다른 장애인 시설 자료나 지도와는 시설명·주소를 맞춰 보거나 주소를 좌표로 바꿔서 연결한다.
description_portal: 군산시 장애인복지시설은 장애인의 삶의 질 향상과 사회통합을 목적으로 다양한 형태의 지원을 제공하는 기관들로 구성되어 있습니다. 여기에는 거주시설, 복지관, 주간보호시설뿐만 아니라, 생활이동지원센터, 수화통역센터, 직업재활시설 등이 포함되며, 장애인의 자립생활 지원과 사회참여 확대를 위한 다양한 서비스를 운영하고 있습니다. 또한 활동지원수행기관, 편의시설지원센터, 인권센터, 평생교육센터 등도 포함되어 있어, 돌봄과 권익 보호, 교육과 직업훈련에 이르기까지 장애인 개개인의 전 생애를 포괄하는 맞춤형 복지 인프라를 제공하고 있습니다. 이들 시설의 정보는 복지정책 수립과 평가, 이용자 접근성 제고를 위한 기반자료로 활용됩니다.
