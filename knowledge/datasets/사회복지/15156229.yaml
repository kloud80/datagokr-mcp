description_portal: 여성 복지시설 현황에 대한 데이터로 시설유형, 시설명, 시설주소, 전화번호 등을 제공합니다. 해당 데이터는 광주광역시 남구청 인구가족담당관(☎062-607-3532)에서 제공합니다. 입소자 보호를 위해 일부 시설의 경우, 주소지를 공란 처리하였음을 알려드리며,공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 여성복지시설은 가정폭력·성폭력·한부모 가족 등 다양한 취약 상황에 놓인 여성과 아동을 보호하고 상담, 주거 지원, 자립 지원 등 사회적 회복을 돕기 위해 설치된 공공·민간 복지기관입니다. 해당 데이터를 통해 가정폭력·성폭력 피해자 지원 정책 수립, 위기대응기관 연계 체계 구축, 취약지 분석, 자원 배분 효율화 등에 활용할 수 있을 것으로 보이며, 민간에서는 지도 서비스, 상담 연계 플랫폼, 긴급 안전 서비스, 연구·통계 분석 등에서 기초 데이터로 활용될 수 있어 여성 안전 정책 및 지역복지 서비스 품질 향상에 기여할 것으로 보입니다.
