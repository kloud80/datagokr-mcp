description_portal: 서울특별시 서초구 관내 주민센터 수동 휠체어 대여 현황 정보를 제공합니다. 본 데이터는 일시적으로 보조기기를 필요로 하는 서초구민을 대상으로 합니다. 대여품목은 수동휠체어 입니다.대여조건은 기본 2개월(갱신기간 포함 총4개월)대여가 가능합니다.대여방법은 서초구청 홈페이지 보조기기 대여메뉴에서 대여현황을 확인하시거나 동 주민센터 전화 연락후 방문하셔서 신청하시면 됩니다.대여비용은 무료이며, 분실 또는 파손시에 비용이 청구될 수 있습니다.우리구 수동 휠체어 대여가 힘들경우에는 기타 보조기기 대여기관을 이용하셔야 될것 같습니다.서울시 보조기기센터(http://www.seoulats.or.kr/)이나 서초구립 한우리보호작업장(http://www.theneulbom.or.kr/)을 이용 부탁드립니다.편리한 이동권 보장, 공공시설 이용의 형평성 강화, 현장 혼잡도 완화 및 대기시간 최소화를 목표로 하고 있습니다.서초구는 앞으로도 이동 약자를 포함한 모든 구민이 동등한 편의를 누릴 수 있는 환경을 만들기 위해 지속적으로 노력하겠습니다.
