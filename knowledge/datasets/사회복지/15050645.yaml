description_portal: '- 전라남도 정보취약계층 정보화교육기관 정보(구분, 기관명, 주소, 유형, 대표자명, 전화 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도는 정보취약계층의 디지털 역량 강화를 위해 다양한 교육 프로그램과 기관을 운영하고 있습니다. 이러한 교육은 디지털 소외계층이 정보화 사회에 적극적으로 참여할 수 있도록 지원하고 있습니다.- 각 기관의 공식 웹사이트나 SNS를 통해 교육 일정 및 신청 방법을 확인하실 수 있습니다.- “정보취약계층”은 디지털 정보화 사회에서 정보 접근과 활용에 어려움을 겪는 사회적 약자를 의미합니다. 정보취약계층은 사회 서비스, 교육, 건강, 금융 등 다양한 분야에서 정보 접근성이 떨어져 사회적 불이익을 경험할 수 있습니다. 디지털 격차 해소는 사회통합과 평등한 기회 제공을 위해 매우 중요합니다.'
