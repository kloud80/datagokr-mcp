summary_user: 제주시 관내 장애인 활동지원기관을 기관 한 곳당 한 행으로 담은 목록 파일로, 기관 유형(구분)·기관명·소재지·전화·팩스번호·지정일을 담는다. 제주시에서 장애인 활동지원 서비스를 받으려는 주민이나 가족이 "집 근처에 지정된 활동지원기관이 어디이고 연락처는 무엇인가"를 찾을 때, 또는 분석가가 지역 내 제공기관 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 소재지 주소를 맞춰서만 이어 쓸 수 있다.
description_portal: 이 데이터는 제주특별자치도 제주시 장애인 활동지원기관 현황을 정리한 공공데이터입니다. 담당 부서는 제주시 장애인복지과이며, 관내 활동지원기관의 지정 및 운영 현황을 파악할 수 있도록 구성되어 있습니다.주요 항목은 구분, 기관명, 소재지, 사무실전화번호, 팩스번호, 지정일로 이루어져 있습니다. 이를 통해 기관의 유형과 명칭, 위치, 연락처, 지정 시점 등을 확인할 수 있으며, 지역 내 장애인 활동지원 제공기관의 분포와 운영 현황을 파악하는 데 활용할 수 있습니다.이 데이터는 장애인 복지서비스 연계, 기관 안내, 지역 복지자원 관리, 활동지원 서비스 제공체계 검토 등 관련 행정업무와 정책 수립의 기초자료로 활용할 수 있습니다.
