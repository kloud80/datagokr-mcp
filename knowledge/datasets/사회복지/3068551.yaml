description_portal: 근로복지공단이 보유하고 있는 산업재해 보상보험 관련으로 각종 주제에 따른 행정 심판 등의 재결 정보를 제공하는 링크 데이터입니다.사전정보공표 건으로, 사전정보공표는 국민생활에 매우 큰 영향을 미치는 정책에 관한 정보, 대규모의 예산이 투입되는 사업에 관한 정보, 예산집행의 내용과 사업평가 결과 등 행정감시를 위하여 필요한 정보 등에 국민의 정보공개 청구가 없더라도 미리 공개의 구체적인 범위, 주기 및 방법 등을 정하여 정보를 공개하는 서비스입니다.공표시기는 3월, 공표주기는 매년입니다.2024년 기준 공개자료(단위 건, %)는 행정심판 소속기관별 접수 및 재결 현황이며, 구체적으로는 각 지사별 접수건수와 확정사건결과(기각, 취소, 일부취소, 각하등, 취소율)로 구성되어있습니다.
