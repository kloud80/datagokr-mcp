summary_user: 서울시 주말어린이집을 어린이집 한 곳당 한 행으로 담으며, 자치구·동 행정명, 어린이집명, 유형(국공립·민간·가정·법인 등), 제공 서비스(시간연장형·시간제·휴일보육 등), 주소·연락처, 개원일, 정원과 이용 가능 인원을 포함한다. 맞벌이 부모가 '우리 동네에서 주말에 아이를 맡길 수 있는 어린이집이 어디이고 자리가 남았는가'를 찾거나, 분석가가 자치구별 주말 돌봄 공급을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 어린이집 데이터(기본정보·평가·보육료 공시 등)와는 어린이집명·주소 매칭이나 서울시 내부 코드(ARCODE, STCODE)로 연결해야 한다.
description_portal: 서울시 주말어린이집 정보는 맞벌이 가정과 돌봄 공백이 발생하는 가정을 위해 제공되는 돌봄 서비스 관련 데이터입니다. 이 자료는 각 어린이집의 행정구역 코드, 자치구명, 동 단위 행정명, 어린이집명, 유형(국공립, 민간, 가정, 법인 등), 제공 서비스(시간연장형, 시간제 보육, 휴일보육 등), 주소, 연락처, 개원일, 정원 및 현재 이용 가능 인원을 포함합니다. 이를 통해 시민들은 거주지 인근 주말 돌봄 가능 어린이집을 쉽게 확인할 수 있으며, 서울시는 이를 기반으로 돌봄 수요를 파악하고 정책적으로 보육 인프라를 확충할 수 있습니다. 해당 데이터는 부모의 양육 부담을 줄이고, 아동의 안전한 보육 환경을 조성하는 데 중요한 기초 자료로 활용됩니다.
