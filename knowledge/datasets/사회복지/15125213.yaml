description_portal: 전국 시도별 및 유형별 자활사업단 수에 대한 데이터를 제공합니다. 본 자료는 시장진입형, 사회서비스형, 근로유지형, 인턴형 등 핵심 사업단 유형뿐만 아니라, 자활사업도우미, 복지도우미, 게이트웨이, 청년자립도전사업단, 파일럿사업단, 인큐베이팅 등 세분화된 모든 자활사업단의 분포를 포괄적으로 제공합니다.이 통계는 각 지역에서 운영되는 자활사업단의 규모와 특성을 명확히 보여주며, 정책 입안자, 연구자 및 현장 실무자들에게 지역별 특성을 고려한 맞춤형 자활 정책 수립과 효율적인 자원 배분을 위한 기초 자료가 될 것입니다.
