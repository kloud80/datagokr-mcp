summary_user: 인천 중구(원도심·영종) 관내 노인일자리사업을 사업 하나당 한 행으로 담은 파일로, 사업명·활동내용·유형(공익형·역량활용·시장형)·참여 총인원·수행기관(중구노인복지관, 중구노인인력개발센터)을 기록한다. 지역 노인복지 담당자나 분석가가 "우리 구에서 어떤 유형의 노인일자리 사업에 몇 명이 참여하는가, 수행기관별로 어떻게 나뉘는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 수행기관 이름을 맞추는 방식으로만 이어 쓰고, 시군구 단위 지역 통계와는 지역명으로 연결한다.
limits: 사업별 집계 현황이어서 참여자 개인 정보나 월별 추이는 담지 않으며, 시설코드 같은 공통 키가 없어 다른 데이터와 붙이려면 기관명을 직접 맞춰야 한다. 범위가 인천 중구 한 개 시군구에 그친다.
