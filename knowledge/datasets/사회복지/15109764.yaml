summary_user: 전국 국내 결혼중개업체를 업체 한 곳당 한 건으로 담으며, 업체명·대표자·회사형태, 시도·시군구와 도로명·지번 주소, 위도·경도, 등록일자·사업종료일자, 운영 여부, 행정처분 내용과 일자를 포함한다. 결혼중개업체를 고르려는 국민이 "우리 동네 업체가 정식 등록돼 지금 영업 중이고 처분 이력은 없는가"를 확인하거나, 분석가가 시군구별 업체 분포를 볼 때 쓴다. 사업자등록번호(brno)로 사업자 정보 데이터와 잇고, 시도명·시군구명이나 좌표로 시군구 단위 인구·시설 통계와 붙여 지역별 현황을 비교한다.
limits: 개별 업체 목록이라 지역별 집계값은 시도·시군구명으로 직접 묶어 계산해야 하며, 행정구역 코드 필드가 없어 다른 통계와는 이름 기준으로 맞춰야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
