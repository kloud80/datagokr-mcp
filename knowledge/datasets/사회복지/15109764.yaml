description_portal: 국내 결혼중개업의 시설 정보를 제공하는 오픈 API형 데이터입니다. 해당 개방데이터는 국내 결혼중개업체의 POI정보(도로명주소, 지번주소, 위도, 경도), 전화번호, 운영 여부, 결혼중개업 등록일자, 사업 종료일자, 대표자명, 업체명, 처분 내용, 회사 형태, 홈페이지 주소, 이메일 주소, 결혼중개업 등록 내용 등을 확인할 수 있습니다.  국내 결혼중개업체의 분포 및 운영 현황을 한눈에 파악할 수 있어, 이용자 보호를 위한 제도적 기반 마련과 건전한 결혼중개문화 조성에 기여합니다. 또한 정책 수립, 지역별 현황 분석 등 다양한 행정 및 연구 목적으로 활용될 수 있습니다.
