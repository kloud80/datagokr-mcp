summary_user: 공무원이 화재·풍수해(호우·지진 등 기타 재난 포함)로 재산 피해를 입어 받은 재난부조금 지급 실적을 재난종류와 파손정도(완전·2분의1·3분의1 파손)별로 나눠 연도(구분)마다 담은 전국 단위 집계 파일로, 970바이트 분량의 작은 CSV입니다. 공적연금 분석가나 정책 담당자가 '어느 해에 화재와 풍수해 중 어떤 재난으로, 어느 정도 파손된 공무원 재난부조금 지급이 많았나'를 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 연도 기준으로 다른 공무원연금공단 통계나 재난 통계와 맞춰 보는 식으로만 이어 쓴다.
limits: 전국 단위 비공간 집계라 지역별·개인별 지급 내역은 볼 수 없고, 다른 데이터와 붙일 공통 코드가 없어 연도나 이름을 직접 맞춰야 한다. 풍수해 항목에는 화재를 뺀 호우·지진 등 기타 재난이 함께 묶여 있어 재난 유형을 더 세분해 볼 수 없다.
