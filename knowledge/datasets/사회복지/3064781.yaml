summary_user: 경상남도 함양군 관내 장기요양기관을 기관 한 곳당 한 행으로 담은 파일(약 5KB CSV)로, 시설급여 기관과 재가 기관 구분, 시설명, 제공 서비스(노인요양시설·주야간보호·방문요양·방문목욕 등), 법인·개인 설립구분, 주소, 연락처를 담는다. 함양군에 사는 어르신 가족이 집 근처에서 방문요양이나 주야간보호를 받을 수 있는 기관과 연락처를 찾는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설 목록이나 건강보험 장기요양기관 자료와는 시설명·주소를 맞춰 이어야 한다.
description_portal: 경상남도 함양군 관내 장기요양기관 현황 자료입니다. 시설구분을 시설급여제공 장기요양기관 및 재가장기요양기관으로 구분되며, 시설의 명칭, 제공되는 서비스현황(노인요양시설(개정법), 주야간보호, 재가노인지원서비스, 방문요양, 방문목욕정보) , 설립구분(법인, 개인 구분), 기관 소재지 주소, 기관 연락처, 데이터 기준일자로 구성되어 있습니다. 제공된 기관은 국민건강보험공단에 등록된 장기요양기관 중 시설급여제공 장기요양기관과 재가장기요양기관으로 구분되며, 노인요양시설, 주야간보호, 재가노인지원서비스, 방문목욕, 방문요양등 서비스를 통해 신체·정신 기능이 저하된 어르신의 일상생활을 지원합니다.
