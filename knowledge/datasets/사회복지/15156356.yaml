summary_user: 아이돌봄 지원사업의 돌보미 매칭을 주제로 한 질문·조건·답변·추론내용을 한 건씩 묶은 학습용 데이터로, 매칭ID와 질의 유형, 원시데이터 파일명이 함께 담기며 범위는 전국·비공간이다. 아이돌보미 매칭을 돕는 챗봇이나 추천 모델을 만드는 개발자·연구자가 '이용 가정의 조건(지역·시간·연령 등)에 맞는 돌보미를 어떤 근거로 고르는가'를 학습시키거나 평가할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공공데이터와는 직접 이어지지 않고, 같은 기관 데이터와 이름·코드 매핑으로만 연결된다.
limits: 실제 매칭 실적이나 돌봄 현황 통계가 아니라 질문·답변 형태의 학습 데이터이므로 이것만으로 서비스 현황을 집계하기 어렵다. 행정구역 코드나 시설 코드 같은 공통 조인 키가 없어 지역·시설 데이터와 결합하려면 별도 매핑이 필요하다. 개발계정은 하루 10,000회로 호출이 제한된다.
