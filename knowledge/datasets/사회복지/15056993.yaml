summary_user: 경기도 내 장애인 관련 단체·협회를 한 기관당 한 건으로 담은 목록으로, 시군명, 기관명, 전화번호, 홈페이지, 비고(법인 구분 등), 지번·도로명 주소, 우편번호, 위·경도 좌표를 담는다. 복지 담당자나 분석가가 "우리 시군에 협력할 수 있는 장애인 단체는 어디에 있고 연락처는 무엇인가"를 확인하거나 단체 분포를 지도로 그릴 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 시군 코드·시군명(SIGUN_CD)으로 다른 경기도 시군별 데이터와 묶거나, 좌표·주소로 공간 결합하거나, 기관명을 매칭해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장애인 관련 단체 및 협회들의 현황을 수록한 자료로, 각 단체의 기관명, 위치정보(지번주소 및 도로명주소), 우편번호, 전화번호, 홈페이지 URL, 비고(법인 구분 등)의 항목으로 구성되어 있습니다. 시군별로 분포된 다양한 장애인 복지단체의 지역적 배치와 운영 주체를 파악할 수 있으며, 주소 정보와 위·경도 좌표를 활용해 지도 기반 분석도 가능합니다. 본 자료는 지역사회 장애인 복지 네트워크 구성, 민간 복지단체 현황 분석, 행정지원 대상 식별, 협력 가능 기관 파악 등에 활용될 수 있는 공공복지기관 현황 데이터입니다.
