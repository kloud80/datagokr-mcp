summary_user: 국민연금기금의 전체·부문별·자산별 운용 성과를 금액가중수익률 기준으로 집계한 소형 표(CSV 675바이트)로, 2024년 단년, 2022~2024년 3개년, 1988~2024년 설정 후 누적의 수익률(%)과 수익금(십억 원)을 구분별로 담는다. 연금 가입자나 분석가가 '작년 국민연금기금이 자산군별로 얼마나 벌었고 장기 누적 수익률은 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 자산 구분 이름을 맞추거나 같은 국민연금공단의 기금 운용 현황·투자 데이터와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 금액가중수익률 기준으로 작성된 국민연금기금의 전체, 부문별, 자산별 운용 수익률 및 수익금 데이터입니다.전년도, 최근 3개년, 기금설립 후 전년도까지의 수익률 및 수익금을 제공합니다.수익금은 반올림으로 세부내역 및 합계의 단수차이가 발생할 수 있습니다.기금운용본부는 글로벌 금융시장의 불확실성이 높아지는 상황에서도 국민연금기금 재정의 장기적인 안정을 유지하기 위해 운용성과를 높일 수 있도록 노력하고 있습니다.국민연금기금의 운용성과 현황은 국민연금공단 기금운용본부 홈페이지를 통해서도 확인하실 수 있습니다.
