description_portal: '- 전라남도 내 공공 자연장지 현황(명칭, 유형, 조성주체, 전화번호, 사용료 및 관리비, 감면혜택, 이용조건 등)에 대해 조회하실 수 있습니다.- 전라남도에는 공공 자연장지(자연친화적인 장사시설)가 운영되고 있으며, 이는 환경 보호와 경제적 부담 완화를 위해 설계된 시설입니다.- 공공 자연장지는 환경 친화적인 장사 방법으로, 많은 유족들이 선택하고 있는 추세입니다. 자연 속에서 고인을 모시는 이 방법은 유지 관리가 용이하고, 장기적인 비용 부담을 줄이는 데 도움이 됩니다.- 이용 대상 : 각 시설은 해당 시·군의 주민등록상 주소지를 기준으로 이용 자격이 부여됩니다.- 신청 방법: 각 시·군청의 장사시설 담당 부서나 해당 시설의 사무실을 통해 신청할 수 있으며, 일부 시설은 온라인 예약 시스템을 운영하기도 합니다.'
