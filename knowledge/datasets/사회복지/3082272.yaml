summary_user: 광주 광산구에 있는 청소년 수련·이용시설을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 1.3KB)로, 시설 구분·시설명·주소·운영주체·설치일자·수용인원·위도·경도를 포함한다. 광산구 주민이나 청소년 정책 담당자가 '우리 동네 가까운 청소년 시설은 어디이고 몇 명까지 수용하나'를 확인하거나 시설 배치 계획을 세울 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시설명·주소로 맞추거나 위도·경도로 지도에 겹쳐 쓰고, 지역 통계는 시군구 단위(광산구)로 이어 본다.
limits: 광산구 한 시군구 범위만 담아 다른 구·시도 시설과의 비교는 별도 데이터가 필요하다. 명세상 연간 주기이지만 생성 후 바뀌지 않는 이벤트성 파일로 표시돼 있어, 현재 운영 여부는 데이터기준일자를 보고 판단해야 한다. 시설 코드 같은 공통 키가 없어 이름·주소 매칭 시 표기 차이에 주의한다.
