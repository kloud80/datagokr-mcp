summary_user: 경기도 내 양로시설을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군명, 사업장명, 인허가일자, 영업상태와 폐업일자, 입소정원, 자격소유 인원수, 총인원수, 도로명·지번 주소, 위경도 좌표가 들어 있다. 노인복지 담당자나 연구자가 "우리 시군에 지금 운영 중인 양로시설은 몇 곳이고 입소정원과 자격 인력은 얼마나 되나"를 확인하거나 시설 분포 지도를 그리는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명, 시설명, 주소, 좌표를 맞춰 잇는다.
description_portal: 노쇠로 인하여 독립해서 일상생활을 영위할 수 없는 노인을 수용하여 생활할 수 있도록 지원하는 경기도 내 양로시설 현황입니다. 사업장명, 자격소유인원수, 총인원수 등의 정보를 제공합니다.이 데이터는 경기도 내 양로시설의 운영 현황을 정리한 자료로, 각 시설의 명칭, 위치, 인허가일자, 자격소유 인원 수, 총 수용 인원, 운영상태, 도로명주소 및 지번주소, 우편번호, 위경도 좌표(WGS84) 등이 포함되어 있습니다. 양로시설은 주로 노인의 보호와 복지를 위해 제공되는 생활시설로, 운영 중인 시설의 입소정원과 자격 인력 수를 통해 시설 규모 및 서비스 제공 역량을 파악할 수 있습니다. ‘운영중’ 여부를 통해 현재 실제 운영되고 있는 시설을 구분할 수 있으며, 각 시설의 위치 정보는 GIS 기반의 공간 분석, 접근성 평가, 복지 인프라 분포 지도 작성 등에 활용됩니다. 본 자료는 노인복지 정책 수립, 지역별 복지 수요 분석, 고령자 보호체계 연구 등에 기초 자료로 사용될 수 있으며, 보건복지부 및 지방자치단체의 노인복지 관련 행정 시스템을 통해 수집된 공공데이터입니다.
