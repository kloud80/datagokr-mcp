description_portal: '○ 통계개요* 통계명 : 사회적 약자에 대한 시민의식* 통계종류 : 서울거주 만15세이상 가구 구성원을 대상으로 실시하는 조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민의 성별·연령별·지역별 등의 사회적 약자에 대한 시민의주관적 태도○ 용어설명○ 기 타* 문항 : 아래 각 항목은 우리 사회의 사회적 약자에 대한 태도를 나타낸 것입니다.귀하는 각 문항에 어느 정도 동의하십니까?1) 내아이(있거나있다면)가 장애아와 함께 어울리는 것은 상관없다2) 가난은 개인이 게으르고 노력하지않기 때문이라기보다는 사회제도에 더 큰책임이 있다3) 어르신(65세이상)들에 대한 사회복지 확대를 위해 세금을 더 부담할 의향이 있다4) 여성들의 사회참여를 활성화하기 위해 더 많은 제도적 개선이 필요하다'
