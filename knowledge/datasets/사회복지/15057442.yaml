summary_user: 경기도 내 공동생활가정(기타 복지) 시설을 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 시군명, 인허가·폐업일자, 영업상태, 도로명·지번 주소, 위도·경도를 포함한다. 경기도 어느 시군에 보호 아동청소년용 공동생활가정이 운영 중인지, 복지시설 배치나 접근성을 따지는 분석가·담당자가 시설 분포를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명이나 시군코드(SIGUN_CD)를 이름·코드 매핑해 다른 시군 단위 통계와 잇고, 좌표로 공간 결합한다.
description_portal: 경기도 내 공동생활가정(기타 복지) 인허가 현황입니다. 공동생활가정(기타 복지)은 보호가 필요한 아동청소년에게 가정과 같은 주거여건을 제공하는 시설입니다.이 데이터는 경기도 내 기타복지 영역에 해당하는 공동생활가정의 현황을 나타내며, 해당 시설의 사업장명, 시군명, 인허가일자, 운영 상태, 소재지 도로명 및 지번 주소, 우편번호, 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 공동생활가정은 보호가 필요한 사람들에게 소규모 생활 공간을 제공하는 복지시설로, 본 자료는 관련 복지 인프라의 지역별 분포 및 운영 실태를 파악하는 데 유용합니다. 사회복지기관, 종교재단 등 다양한 운영 주체가 포함되어 있으며, 위치정보는 복지서비스 접근성 분석이나 복지시설 배치계획 수립 등에 활용될 수 있습니다.
