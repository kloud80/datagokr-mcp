summary_user: 경기도일자리재단의 일생활균형 플랫폼 '워라밸링크'에 등록된 문화예술행사·교육·시민참여·재직자 지원 프로그램을 프로그램 한 건씩 담으며, 제목·접수기간·등록일·주관기관·상세 URL·태그·지역·카테고리 항목으로 구성된다. 경기도민이나 재직자가 "지금 접수 중인 우리 지역 교육·여가 프로그램이 무엇인가"를 찾거나, 분석가가 지역·카테고리별 프로그램 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명(region_div)이나 주관기관명(inst_nm) 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도일자리재단에서 운영하는 일생활균형 플랫폼 "워라밸링크"에 등록된 각종 활동 및 지원 프로그램 정보를 수록한 자료입니다. 주요 항목은 제목, 접수기간, 등록일, 컨텐츠주체기관, 상세URL, 태그, 지역, 카테고리, 이미지URL로 구성되며, 경기도민을 위한 문화예술행사, 교육 프로그램, 시민참여 행사, 재직자 지원 프로그램 등 다양한 콘텐츠를 포함하고 있습니다. 이 데이터는 지역 주민들의 여가활동 활성화, 일과 생활의 균형 촉진, 지방자치단체의 시민참여 기반 마련, 사회서비스 확대 등 다목적 활용이 가능합니다.
