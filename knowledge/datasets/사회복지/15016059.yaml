summary_user: 부산광역시 사하구 관내 장애인복지시설(공동생활가정, 복지관, 직업재활시설, 주간보호시설, 수어통역센터)을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설유형·시설명·도로명주소·전화·팩스·운영주체를 담는다. 사하구에 사는 장애인과 가족이 "집 근처 주간보호시설이나 직업재활시설은 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 구 단위 장애인 시설 분포를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 도로명주소를 지오코딩하거나 시설명으로 대조해 잇는다.
limits: 표준 시설코드 같은 공통 조인 키가 없어 다른 기관의 장애인시설 데이터와 자동으로 연결되지 않으며, 범위는 사하구 한 곳으로 한정된다. 포털 설명에 따르면 팩스번호 일부와 개인 이름인 운영주체는 비워 두었다.
