summary_user: 대구광역시의 기초생활보장 수급자를 구분별로 총·일반·특수 수급가구와 수급인원, 시설수급자 수로 집계한 작은 파일(csv 464바이트)입니다. 지역 복지 담당자나 분석가가 '대구에서 수급 가구·인원이 어느 구·군에 얼마나 몰려 있는가'를 보고 지원 정책이나 시설 배치를 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구분(지역명) 이름을 맞추거나 같은 기관 코드로만 이어 쓴다.
description_portal: 기초생활보장 수급자는 국민기초생활보장법에 따라 정부가 지원하는 복지 서비스의 수혜자입니다. 이들은 가구 소득과 재산이 일정 기준 이하이고, 부양의무자가 없거나 있어도 부양 능력이 없거나 또는 부양을 받을 수 없는 경우에 수급자로 선정됩니다. 기초생활보장 급여는 생계급여, 의료급여, 주거급여, 교육급여 등 다양한 종류가 있으며, 각 급여별로 선정 기준과 지원 내용이 다릅니다. 기초생활보장 수급자 현황은 소득인정액이 이 급여종류별 선정기준선 이하인 자에 대한 기초자치단체별 현황입니다.
