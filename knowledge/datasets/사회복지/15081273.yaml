summary_user: 사학연금법상 퇴직급여 산정의 기초가 되는 법률 조문(퇴직급여 계산식, 퇴직연금 수급개시연령 관련 조항 등)을 조항 번호·조항명·설명·적용 시작일 단위로 정리한 전국 단위 비공간 파일(csv, 약 79KB)이다. 사학연금 가입자나 연구자가 특정 시점에 퇴직한 교직원에게 어떤 퇴직급여 계산식·수급개시연령 조항이 적용되는지, 해당 조항이 개정연도별로 어떻게 바뀌어 왔는지 확인할 때 쓴다. 다른 데이터와 직접 이어 붙일 전역 조인 키는 없으며, 법령적용 시작일이나 조항명을 기준으로 사학연금·공무원연금 수급 통계 등과 사람이 맞춰 보는 방식으로만 연결한다.
description_portal: 사립학교교직원 연금법(이하 "사학연금법")상 퇴직급여 산정의 기초가 되는 조문 정보를 제공하고 있습니다. 개방데이터는 퇴직급여 계산식, 퇴직연금 수급개시연령 관련 법률 조문으로 구성되어 있습니다. 구체적으로 사학연금법 제42조에 따라 준용되는 공무원연금법 제43조(구 공무원연금법 제46조) 등 퇴직급여 조항들이 개정연도별로 정리되어 있습니다.  이 데이터를 통해 공단의 업무 근거가 되는 법적 기준을 투명하게 공개하고, 관련 이해관계자들이 법령을 명확하게 이해할 수 있도록 지원합니다.사학연금 가입자 및 학술기관 등 관련 단체는 본 칼럼을 기반으로 퇴직급여 근거 조항 개정 추이를 이해할 수 있습니다.(수시변경 데이터 입니다.)
