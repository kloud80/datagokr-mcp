description_portal: 본 데이터는 서울특별시 종로구에 소재한 사회적기업 현황을 제공하는 자료입니다. 사회적기업은 취약계층에게 일자리 또는 사회서비스를 제공하여 지역사회에 기여하는 기업으로, 고용노동부 인증을 받은 기관을 대상으로 합니다. 자료에는 각 기업의 기관명, 사회서비스 분야, 전화번호, 소재지 등 주요 항목이 포함되어 있습니다. 해당 정보는 사회적경제 활성화, 일자리 창출, 서비스 제공 현황 분석 등에 활용됩니다. 또한 기업 분포와 분야별 특성을 파악하여 맞춤형 지원사업 기획, 협력 네트워크 구축, 사회적 가치 실현을 위한 정책 수립에 참고할 수 있습니다. 자료는 종로구청이 관련 기관 보고와 행정자료를 토대로 작성하며, 「사회적기업 육성법」 관련 지침에 따라 관리됩니다.
