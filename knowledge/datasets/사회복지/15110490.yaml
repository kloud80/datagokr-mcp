summary_user: 대구광역시 서구 관내 경로당별로 출입문 유형, 휠체어 출입 가능 여부, 출입구 폭·턱 높이, 경사로, 테이블 간격·높이, 장애인 주차장·화장실과 화장실 내 편의시설 유무를 담은 시설 단위 건별 조사 자료이며, 범위는 서구 한 개 시군구이고 위치는 개별 주소로 나온다. 휠체어 이용 어르신이나 보호자가 '서구에서 턱 없이 휠체어로 들어갈 수 있고 장애인 화장실이 있는 경로당은 어디인가'를 확인하거나, 구청·분석가가 경로당 편의시설 개선 대상을 고르는 데 쓴다. 전역 조인 키나 시설코드가 없어 다른 노인복지시설 목록 등과는 경로당 이름(b_store_name)·주소(b_store_address)를 맞춰 잇거나 같은 기관(서구) 자료끼리 묶어 쓴다.
limits: 표준 시설코드 같은 공통 키가 없어 다른 데이터와 연결할 때 이름·주소 매칭에 의존해야 한다. 대구 서구 한 곳만 다루므로 다른 구나 시 단위 비교에는 쓸 수 없다.
