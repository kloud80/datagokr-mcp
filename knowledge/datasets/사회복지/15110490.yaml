description_portal: 대구광역시 서구 관내 경로당 현황을 바탕으로 출입구 폭, 휠체어 출입가능 유무, 장애인 화장실 유무 등의  교통약자를 위한 상세데이터를 제공하는 서비스본 데이터는 대구광역시 서구청이 관내에 위치한 경로의 교통약자 접근성 및 편의시설 현황을 조사하여 제공한 상세자료이다. 항목은 업체명, 주소 외에도 미닫이문·여닫이문·버튼식 자동문 등 출입문 유형과 회전문 유무, 휠체어 출입 가능 여부, 활동 공간 확보 여부, 출입구 폭 및 턱 높이, 입구 경사와 손잡이 유무 등 물리적 접근성과 관련된 정보를 포함한다. 또한, 미끄럼 방지판 설치 여부, 테이블 배치 간격과 높이, 장애인 주차장 및 장애인 화장실 유무, 화장실 내 편의시설 현황(세면대, 변기 손잡이, 등받이 등)까지 상세히 수록되어 있다. 해당 자료는 교통약자 및 장애인의 목욕장 이용 편의성을 향상시키고, 관련 정책 수립 및 민간 활용을 위한 기초 자료로 활용될 수 있다.
