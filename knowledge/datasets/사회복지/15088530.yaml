summary_user: 경상남도가 위탁한 보육교직원 보수교육(일반직무교육·원장 사전직무교육·장기미종사자 교육 등) 기관 6개소의 기관명·소재지·전화번호·우편번호를 기관 1곳당 1행으로 담은 소규모 파일(csv, 512바이트)입니다. 경남에서 일하거나 복직하려는 보육교사·원장이 '내 지역에서 보수교육을 어디서 받고 일정은 어디에 문의하나'를 확인하는 데 쓴다. 전역 조인 키나 기관 코드가 없어 어린이집 기본정보 등 다른 데이터와는 소재지 주소나 기관명 매칭으로만 이어 쓴다.
description_portal: 경상남도내 보육교직원 보수교육(양성교육, 장기미종사자 교육, 승급교육, 일반직무교육)을 진행하는 위탁 교육기관 현황(기관명, 소재지, 연락처)입니다. 보육교사 보수교육기관은 경상남도가 위탁한 어린이집 보육교사 및 원장 직무교육, 장기미종사자 교육, 원장사전직무교육 등을 수행합니다. 보수교육의 종류는 원장 및 보육교사의 일반 직무 교육과 원장 사전직무교육, 장기미종사자를 대상으로 하는 교육이 있습니다. 지역별 지정된 교육기관은 6개소이며 연락처를 통해 교육 일정을 확인하실수 있습니다.
