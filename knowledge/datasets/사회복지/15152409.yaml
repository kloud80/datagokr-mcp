summary_user: 도로교통공단이 집계한 보행자 사망·중상 교통사고 다발지역 정보를 전국 범위에서 다발지역 한 곳당 한 행으로 담으며, 사고건수·사상자수·사망자수·중상자수·경상자수·부상신고자수 같은 집계값과 시도·시군구명, 관할 경찰서 이름이 함께 들어 있습니다. 지자체 교통안전 담당자나 분석가가 '우리 시군구에서 보행자 사망·중상 사고가 몰리는 지점은 어디이고 몇 건인가'를 확인해 보행환경 개선 우선지를 고르는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 다른 데이터와는 시도·시군구명이나 법정동 코드로 보이는 필드(STDG_CD) 같은 이름·코드 매핑으로만 맞춰 붙인다. 필드명상 경도·위도와 다발지역 영역 필드가 있어 지도 위 위치 대조에도 쓸 수 있으나, 이는 필드 이름을 근거로 한 추정입니다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계 제공하고 있습니다.- 해당 데이터는 도로교통공단에서 제공하는 보행자 사망 또는 중상자가 발생한 교통사고 관련 정보입니다.
