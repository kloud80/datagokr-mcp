description_portal: 인천시설공단  가족공원사업단에서 운영하는 장사관련 데이터 DB 입니다. 인천가족공원은 인천광역시 부평구 평온로 61에 위치하고 있습니다. 본 데이터는 인천가족공원에서 운영하는 장사시설의 현황과 이용정보를 제공하는 자료로, 화장장·봉안당·봉안담·자연장지·묘역 등 주요 장사시설의 규모, 연면적, 층수, 안치능력, 시설별 조성현황 및 운영특성을 포함하고 있습니다. 또한 화장시설 및 봉안시설 사용료, 관리료, 자연장지 이용기준 등 관련 요금체계와 시설별 안치현황 변동 데이터도 함께 제공하여 장사시설 운영정책 수립, 수급계획 산정, 장사문화 서비스 개선, 시민 안내자료 제작, 장사시설 유지관리 계획 수립 등에 활용할 수 있습니다. 시설별 안치가능 규모 비교, 연도별 변화추이 분석, 장사수요 예측, 장사서비스 접근성 검토 등 공공행정, 연구기관, 장사관련 종사기관에서 참고자료로 활용이 가능합니다.
