description_portal: '○ 통계개요* 통계명 : 장애연금 지급현황(연령별)* 통계종류 : 장애연금의 수급자 및 지급액 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 국민연금제도의 업무추진 실적 및 가입자ㆍ징수ㆍ급여ㆍ기금현황 등을파악하여 연금정책 수립 및 관련 연구를 위한 기초자료로 활용하는 것을목적으로 함* 조사체계 : 지사 및 기금운용본부 → 국민연금공단* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 장애연금의 연령별ㆍ성별 수급자수 및 지급액 등○ 용어설명* 장애연금 : 가입중에 발생한 질병(당해 질병의 초진일이 가입중에 있는 경우로서가입자가 가입당시 발병 사실을 알지 못한 경우 포함)또는 부상으로 인하여완치후에도 장애가 남았을 때 장애정도(1~3급)에 따라 연금으로 지급되는 급여* 장애일시금 : 가입중에 발생한 질병 또는 부상으로 인하여 완치후에도 장애(4급)가남았을 때 일시금으로 지급되는 급여○ 기 타* 장애일시보상금 수급자수, 급여액 포함* 숫자의 단위미만은 반올림하였으므로 내용의 합계와 일치하지 않을 수도 있음'
