description_portal: 본 데이터는 노인맞춤돌봄서비스 수행기관 현황을 수록한 자료입니다. 노인맞춤돌봄서비스는 65세 이상 기초생활수급자, 차상위 계층, 기초연금 수급자를 대상으로 하며, 장기요양보험 등 유사 서비스를 이용 중인 자는 제외됩니다. 서비스 내용은 안부 확인 등 안전지원, 사회참여 프로그램 운영, 신체·정신 건강 생활교육, 일상생활 지원, 지역 자원 연계 서비스로 구성되어 있습니다. 신청은 주소지 읍·면·동 행정복지센터 방문을 통해 가능하며, 신분증 지참 후 등록 절차를 거쳐 이용할 수 있습니다. 관련 법령은 「2024 노인맞춤돌봄서비스 사업안내」에 근거하여 운영됩니다. 해당 데이터는 수행기관의 명칭, 소재지, 연락처 등 기본 정보를 포함하고 있으며, 노인들의 삶의 질 향상과 지역사회 돌봄 체계 강화를 위한 기초자료로 활용됩니다.
