description_portal: 광주광역시 여성가족재단은 2025년 기준 총 12개의 정책연구과제를 추진하고 있으며, 지역의 성평등 실현과 가족정책 강화를 위한 다양한 주제를 다루고 있습니다. 연구과제에는 ▲공연예술계 성평등 창작환경 조성방안, ▲양성평등기금 운용 방안, ▲1인 가구 기본계획 수립(2026~2030), ▲청년여성의 지역 정주 방안, ▲가족센터 기능 강화 방안 등이 포함됩니다.또한 ▲아동청소년 친화도시 조성 3차 기본계획, ▲아동학대 예방 및 대응체계 실효성 강화, ▲이주여성의 취업 실태와 지원방안, ▲남성 폭력피해 실태 및 지원 방안 등 사회적 약자에 대한 실질적 보호와 지원을 위한 연구도 포함되어 있습니다. 이 외에도 ▲여성가족재단의 중장기 발전계획, ▲광주광역시 지속가능발전 기본계획(공동과제), ▲광주 성인지 통계사업과 같이 정책 기반 강화를 위한 연구도 진행 중입니다.이러한 연구는 광주 지역의 사회 변화와 정책 수요에 대응하기 위한 실천적 기반으로 활용되며, 시민 삶의 질 향상과 성평등 정책의 내실화를 도모하는 데 중요한 역할을 하고 있습니다
