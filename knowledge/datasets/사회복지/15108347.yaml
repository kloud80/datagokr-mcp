        required: false
        desc: 출력건수
      - name: lifeArray
        required: false
        desc: 생애주기
      - name: trgterIndvdlArray
        required: false
        desc: 가구상황
      - name: intrsThemaArray
        required: false
        desc: 관심주제
      - name: age
        required: false
        desc: 나이
      - name: ctpvNm
        required: false
        desc: 시도명
      - name: sggNm
        required: false
        desc: 시군구명
      - name: srchKeyCode
        required: false
        desc: 검색분류
      - name: searchWrd
        required: false
        desc: 검색어
      - name: arrgOrd
        required: false
        desc: 정렬순서
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /LcgvWelfaredetailed
    name: 지자체복지서비스 상세조회
    endpoint: https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations/LcgvWelfaredetailed
