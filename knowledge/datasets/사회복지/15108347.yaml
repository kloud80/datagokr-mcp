summary_user: 전국 지자체(시군구 단위)가 제공하는 복지서비스를 서비스별로 담은 API로, 목록조회와 상세조회 두 오퍼레이션으로 지원대상·선정기준·신청방법 등의 안내 내용을 제공한다. 국민이나 상담·분석 담당자가 '우리 시군구에서 내가 받을 수 있는 복지서비스는 무엇이고 어떻게 신청하나'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 잇는 전역 조인 키가 없어, 복지정보상세코드(wlfareInfoDtlCd)와 첨부 코드표, 서비스명·지자체명 같은 이름 매핑으로만 연결한다.
description_portal: 안내되는 복지서비스 API는 대국민 복지포털 복지로에서 제공합니다. 지자체에서 제공하는 복지서비스 정보를 대상으로 하며 지자체 복지서비스는 2가지 오퍼레이션 형태로 이용하실 수 있습니다. 지자체복지서비스 목록조회는 다양한 복지서비스 목록을 한눈에 볼 수 있습니다. 지자체복지서비스 상세조회에서는 지원대상, 선정기준, 신청방법 등을 안내하고 있으므로 내가 받을 수 있는 복지서비스인지 서비스 별 자세한 내용을 확인할 수 있습니다. 사회복지 다양한 분야에서 활용하실 수 있으므로, 첨부된 '지자체복지서비스_코드표'와 공공데이터포털에서 제공하고 있는 SWAGGER 문서를 참고하여 주시기 바랍니다.
