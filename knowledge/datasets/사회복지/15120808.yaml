description_portal: 서울특별시 마포구에 신고된 협동조합 설립현황에 대한 정보입니다. 협동조합은 신고제로 운영되기 때문에 운영여부는 부정확할 수 있습니다. 이 데이터에는 각 협동조합이 실제 위치한 사업장의 도로명주소 및 행정동이 포함되어 있습니다. 또한, 협동조합의 명칭, 설립일자(yy-mm-dd), 이사장의 성명에 관한 세부 정보도 함께 제공됩니다.이 데이터를 통해 지자체와 관련 기관은 협동조합의 분포와 현황을 정확히 파악하여 효과적인 지원 정책을 마련할 수 있습니다.또한, 조합원 및 일반 시민은 협동조합에 대한 신뢰를 높이고, 참여와 협력을 촉진하는 기반이 됩니다.
