summary_user: 경기도 양주시의 등록장애인 수를 읍면동·장애유형별로 집계해 남녀별 등록장애인수와 심한·심하지 않은 장애인수를 담은 집계 파일이다. 양주시 복지 담당자나 분석가가 어느 읍면동에 어떤 유형의 심한 장애인이 많은지 보고 맞춤형 복지 서비스 배치를 정하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동명·장애유형 같은 이름을 맞춰 붙이거나 같은 기관 자료끼리만 연결한다.
