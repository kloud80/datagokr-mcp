description_portal: 대전광역시 한 부모 가족 지원 현황 자료는 기준 중위 소득 60% 이하의 한 부모 가구를 대상으로 한 다양한 지원 내역을 종합적으로 제공합니다. 가족문화체험활동비, 초중고 입학생 교구교재비, 월동비, 고등학생 자녀 교육비 등 실질적인 경제적 부담을 경감할 수 있는 항목이 포함되어 있으며, 아동 양육비, 학습비, 생활 보조금, 의료비, 주거 및 임대 지원, 심리 상담, 자립 지원, 문화여가 활동 등 한부모가족의 생활 안정과 자녀의 교육 기회 확대를 위한 다양한 복지 정책이 연계되어 있습니다. 각 지원 항목은 소득 기준, 자녀 연령, 가구 특성에 따라 차등 적용되고, 신청 절차와 심사를 통해 지원이 이루어집니다.
