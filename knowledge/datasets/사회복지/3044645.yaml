summary_user: 화성시에 주민등록을 둔 등록장애인 수를 장애유형별로 나누고, 장애 정도(심한 장애·심하지 않은 장애)와 성별에 따라 인원을 집계한 표다(CSV 약 390바이트의 소규모 파일). 복지 담당자나 분석가가 '화성시에서 심한 장애로 등록된 지적·자폐성 장애인은 남녀 각각 몇 명인가' 같은 질문에 답하거나 유형별 지원 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 시군구 장애인 등록 현황이나 경기도·전국 통계와는 장애유형 이름을 맞춰 비교하는 방식으로 이어 쓴다.
description_portal: 데이터는 경기도 화성시에 주민등록을 두고 있는 등록장애인의 현황을 장애유형 및 성별, 장애 정도(심한 장애·심하지 않은 장애) 기준으로 구분하여 제공한 것이다. 장애유형은 시각, 청각, 지적, 자폐성, 정신, 신장, 심장, 간 등 다양한 유형으로 구성되어 있으며, 각 유형별로 남성과 여성 인원을 구분하여 수록하였다. 또한 동일한 유형 내에서 장애 정도에 따라 심한 장애와 심하지 않은 장애로 분류하여 통계를 제공한다. 이 자료는 장애인 복지 정책 수립 및 행정업무 참고자료로 활용될 수 있다. 항목별로 정렬되어 있어 사용자 분석에 용이하도록 구성되어 있다.
