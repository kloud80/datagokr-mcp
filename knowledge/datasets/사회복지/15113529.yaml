summary_user: 파주시 읍면동별 기초생활수급자 현황을 일반·조건부·특례·시설수급 유형별 가구수, 수급자수, 남녀 수급자수로 집계한 파일(csv, 약 3KB)입니다. 파주시 안에서 어느 읍면동에 수급 가구가 많은지, 조건부·시설수급 비중이 동네마다 어떻게 다른지 비교해 복지 인력·자원 배분을 검토하는 분석가와 담당 공무원이 씁니다. 전역 조인 키가 없어 읍면동명(읍면동명)을 이름으로 맞춰 인구·가구 통계 같은 다른 읍면동 단위 자료와 연결해야 합니다.
description_portal: 경기도 파주시 행정동별 기초생활수급자 현황에 대한 공공데이터로 일반·조건부·특례·시설수급으로 구분된 수급 유형별 가구수, 수급자 수, 성별 인원 정보 등으로 구성되어 있습니다. 본 데이터셋은 지역사회 내 복지 수요 파악, 복지 정책의 효과 분석, 지역별 복지 격차 시각화, 예측 모델 개발, 수급자 특성별 인구 변화 추이를 분석하여 복지 정책 개선 및 맞춤형 지원 방안 수립, 행정동 단위의 복지 현황 파악과 지역별 비교 연구, 사회복지정책 수립 및 연구, 행정업무 분석, 지역 간 복지수준 비교, 복지자원배분, 저소득층 지원체계, 통계기반 정책평가, 복지 정책 개발 및 사각지대 발굴 등에 활용될 수 있습니다.
