summary_user: 완도군 12개 읍·면(완도읍·금일읍·노화읍 등)의 경로당을 한 건씩 담은 파일로, 경로당 이름·주소·전화번호를 담는다(포털 설명 기준 2021년 현황, csv 약 18KB). 주민이나 복지 담당자가 '우리 면에 있는 경로당은 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 실측 컬럼에 시설코드 같은 전역 조인 키가 없어서, 다른 노인복지시설·장기요양기관 자료와는 주소나 경로당 이름을 맞춰 보는 방식으로만 잇는다.
limits: 전역 조인 키가 없으므로 다른 데이터와 붙일 때는 이름·주소 매칭에 기대야 하고, 표기 차이로 잘못 맞춰질 수 있다. 수록 범위는 완도군 한 개 시군구이며, 좌표가 없어 지도 위 위치 분석에는 바로 쓰지 못한다.
