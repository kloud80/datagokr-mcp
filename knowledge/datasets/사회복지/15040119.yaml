summary_user: 솔리언또래상담 프로그램을 운영하는 전국 초·중·고등학교와 특수학교를 학교 한 곳당 한 행으로 담은 명단 파일(csv, 약 26만 바이트)이며, 시도·학교급·학교명이 들어 있다. 교육청이나 청소년 상담 관계자가 '우리 시도에서 또래상담을 운영하는 학교는 어디이고 학교급별로 몇 곳인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도 이름이나 학교명을 문자로 맞춰 이어야 하며, 시도 단위 청소년 상담복지센터 현황이나 지역 통계와 시도 기준으로 묶어 보는 정도가 가능하다.
description_portal: 본 데이터는 솔리언또래상담 프로그램을 운영하고 있는 전국 초·중·고등학교 및 특수학교 현황을 제공한 것입니다. 솔리언또래상담은 청소년들이 또래 간의 지지적 관계 형성을 통해 심리·정서적 어려움을 예방하고 건강한 또래문화를 조성하도록 지원하는 상담 활동입니다. 본 데이터에는 운영학교의 지역, 학교급, 학교명 등의 정보가 포함되어 있으며, 해당 프로그램 운영현황을 분석하거나 정책 수립 및 연구 자료로 활용될 수 있습니다. 또한, 각 교육청 및 학교의 또래상담 활성화 현황을 파악하는 데 유용합니다. 해당 정보는 연 1회 정기적으로 조사되어 공개되며, 청소년 관련 기관이나 교육 관계자 등이 활용할 수 있습니다.
