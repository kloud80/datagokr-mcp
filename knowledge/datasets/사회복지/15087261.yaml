summary_user: 경기도 내 장애인 공동생활가정을 시설 한 곳당 한 행으로 담고, 시군명·시설명·운영법인·소재지 주소·전화번호·설치신고일과 입소 정원·현원(입소자, 종사자로 보이는 구분 포함), 위경도 좌표를 함께 제공한다. 장애인 가족이나 복지 담당자가 '우리 시군에 공동생활가정이 몇 곳이고 정원 대비 현원이 얼마나 차 있는가'를 확인하거나, 분석가가 시군별 시설 분포 격차를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm) 이름 매핑이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장애인 공동생활가정의 현황을 정리한 자료입니다. 장애인이 지역사회에서 함께 생활할 수 있도록 지원하는 소규모 생활시설의 분포와 운영 상황을 확인할 수 있으며, 이를 통해 지역별 시설 수, 거주 지원 현황, 서비스 제공 규모 등을 파악할 수 있습니다. 이 자료는 지자체의 장애인 주거복지 정책 수립, 시설 배치 및 운영 계획, 돌봄 인프라 확충을 위한 기초 자료로 활용될 수 있으며, 연구기관에서는 장애인 생활자립 지원 효과 분석, 지역 간 시설 격차 연구, 복지 서비스 수요 예측에 참고할 수 있습니다. 또한 현장에서는 시설 운영의 효율성 점검, 맞춤형 서비스 개발, 사회통합 프로그램 기획 등에 활용할 수 있습니다.
