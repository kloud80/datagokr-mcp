summary_user: 청소년 국제교류 활동프로그램을 건별로 담으며, 프로그램 이름·시작일자·종료일자·연도·운영 상태·활동 내용을 전국 범위의 비공간 정보로 제공한다. 청소년이나 학부모가 지금 참여할 수 있는 해외 교류 프로그램과 그 일정을 찾거나, 국제활동 기획자가 연도별 프로그램 운영 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 프로그램 이름 매핑이나 같은 기관 데이터를 통해서만 이을 수 있다.
limits: 지역 코드나 시설 코드가 없어 시군구·시도별로 나누거나 청소년 시설 데이터와 직접 결합할 수 없다. 갱신은 행사 단위로 생성된 뒤 바뀌지 않는 이벤트 주기로 분류되어 있다. 호출에는 포털 활용신청 후 받은 서비스키가 필요하며 개발계정은 하루 10,000회로 제한된다.
