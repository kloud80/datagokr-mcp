description_portal: 본 데이터는 부산광역시 해운대구 노인복지시설(노인의료복지시설, 재가노인복지시설, 노인일자리전담기관, 노인여가복지시설) 현황입니다. 노인의료복지시설(노인요양시설, 노인요양공동생활가정), 재가노인복지시설(방문요양서비스, 주야간보호서비스, 방문목욕서비스 등), 노인일자리전담기관, 노인여가복지시설(노인복지관, 경로당, 노인교실)의 소재지, 전화번호가 포함된 데이터입니다. 현재 부산광역시 해운대구 노인복지시설은 신규 신고, 폐업, 휴업, 소재지 변경 등 다양한 사유로 인해 지속적으로 변동될 수 있음을 알려드립니다. 일부 사업장의 경우 운영 상황 및 데이터 미집계로 전화번호, 팩스번호 정보가 공란으로 남아 있을 수 있음을 양해해 주시기 바랍니다.
