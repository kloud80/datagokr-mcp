summary_user: 부산광역시 북구 관내 청소년시설(상담센터·문화의집·수련시설 등)을 시설 1곳당 1행으로 담은 목록 파일로, 시설명·소재지·운영주체·시설규모(제곱미터)·전화번호를 담으며 파일 크기는 554바이트의 소규모입니다. 북구 주민이나 청소년이 '우리 동네에 어떤 청소년 시설이 있고 어디로 연락하나'를 확인하거나, 분석가가 구 단위 청소년 시설 분포를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 시설명·소재지 주소를 매칭하거나 같은 시군구(부산 북구) 단위 지역 통계와 나란히 놓는 방식으로만 이어 쓴다.
limits: 부산 북구 한 개 시군구만 담으므로 다른 구·전국 비교에는 다른 기관 자료를 모아야 하며, 시설 고유코드가 없어 주소·이름 매칭 오류에 주의해야 한다. 명세상 연간·이벤트성 갱신 자료라 최신 시설 개폐 여부는 별도 확인이 필요하다.
