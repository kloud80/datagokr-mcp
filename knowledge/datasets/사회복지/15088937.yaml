summary_user: 대구광역시 서구 안의 청소년 수련관·상담복지센터·학교밖청소년지원센터 같은 청소년 이용시설을 시설 한 곳당 한 행으로 담은 작은 현황 파일(csv 약 1KB)이며, 시설명·도로명주소·행정동·주요시설·시설규모·개관일자·위탁운영 단체·운영 및 상담 시간·연락처를 수록한다. 서구에 사는 청소년이나 보호자가 "가까운 곳에서 상담이나 수영장·체력단련실을 이용할 수 있는 청소년 시설은 어디이고 몇 시까지 여는가"를 확인하거나, 구 단위 청소년 시설 배치를 살피는 데 쓴다. 전역 조인 키는 없어서 도로명주소나 행정동 이름으로 다른 시설·지역통계 자료와 맞춰 이어야 하며, 지역 단위 청소년 통계와는 시군구 수준에서만 연계한다.
limits: 명세상 갱신은 연간 또는 이벤트성으로 되어 있어 운영 시간·연락처가 현재와 다를 수 있다. 시설 코드 같은 공통 키가 없어 다른 데이터와 붙일 때는 이름·주소 매칭에 의존해야 한다.
