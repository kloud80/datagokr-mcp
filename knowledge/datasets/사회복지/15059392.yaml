summary_user: 경기도의료원이 제공한 중증장애인 치과치료 실적을 연도별로 요약한 경기도 단위 집계 통계로, 전체 환자 수와 저소득장애인·1~4급 장애인·기타 장애인 수를 담습니다. 장애인 복지 분석가나 정책 담당자가 '해마다 치과치료를 받은 중증장애인은 몇 명이고, 소득 수준과 장애 등급별로 어떻게 나뉘는가'를 확인하는 데 씁니다. 전역 조인 키는 없고, 기준연도(STD_YY)를 맞춰 '경기도_공공의료사업(중증장애인치과운영)실적 현황' 같은 연도별 통계와 나란히 비교하는 방식으로만 이어 씁니다.
description_portal: 경기복지재단(경기도장애인복지종합지원센터)에서 경기도의료원으로부터 제공받아 개방한 자료로, 연도별 중증장애인 대상 치과치료 실적을 요약한 통계입니다.저소득장애인, 1~4급 장애인수 등의 정보를 제공합니다. 치과치료를 받은 장애인 규모와 소득 수준, 장애 등급에 따른 분포를 파악할 수 있습니다.※ 경기도의료원에서 해당 양식으로 데이터를 관리하지 않아 2023년부터 갱신이 중단된 데이터입니다.중증장애인치과 운영실적은 '경기도_공공의료사업(중증장애인치과운영)실적 현황' 데이터를 확인해주시기 바랍니다.
