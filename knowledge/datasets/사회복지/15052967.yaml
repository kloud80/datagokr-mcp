summary_user: 공무원연금 퇴직연금 수급자 수를 17개 광역시도별·성별로 나누고 일반직·경찰·소방·교육직 등 직종별 열로 집계한 표로, 건별 원천이 아닌 집계 데이터이며 2.4KB 크기의 CSV 파일 하나로 제공된다. 연금 정책 분석가나 지자체 담당자가 '우리 시도에 사는 퇴직 공무원 연금수급자는 어떤 직종이 많고 남녀 비율은 어떤가'를 살필 때 쓴다. 전역 조인 키가 없어 다른 지역 통계와는 시도 이름(지역)을 맞춰 붙여야 하고, 같은 기관의 다른 연금 통계와는 직종·지역 이름으로 연결한다.
description_portal: 공무원연금공단에서 제공하는 직종별·지역별·성별 퇴직연금수급자 현황 데이터입니다.본 데이터는 공무원연금 수급자 중 퇴직연금 수령자를 직종, 지역, 성별로 세분화하여 분포와 규모를 파악할 수 있도록 구성되어 있습니다. 직종은 일반직, 정무직, 별정직, 경찰, 소방, 교육직, 법관·검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(우정직, 고위직, 외무직, 청원경찰, 전문경력관 등)로 구분되며, 지역은 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주 등 전국 17개 광역자치단체 기준으로 제공됩니다.
