description_portal: 서울특별시 중랑구의 결식우려 아동 급식지원제도 이용현황입니다.결식우려아동 급식지원제도는 아동복지법 제4조 및 제35조, 아동복지법 시행령 제35조 및 제36조, 보건복지부 지침을 근거로 지원되는 사업입니다.해당 자료는 2025년 12월 말일 기준으로 작성되었으며,연도별(2019년 ~ 2025년도)지원방법별(꿈나무카드. 단체급식소(지역아동센터), 도시락배달) 교과과정별(미취학, 초등학교, 중학교, 고등학교)로 구분하여 이용현황을 나타낸 통계자료입니다.참고해주시기 바랍니다. 감사합니다.
