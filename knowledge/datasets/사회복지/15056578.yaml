summary_user: 경기도 등록장애인 수를 기준연도(STD_YY)와 장애유형별로 묶어 10세 미만부터 90세 이상까지 10세 단위 연령대별 인원과 총계로 담은 집계 자료로, 건별 원천이 아니라 연말 기준 시도 단위 합계다. 복지 정책 분석가가 "경기도 뇌병변 장애인 중 60대 이상이 얼마나 되고 해마다 늘고 있나"처럼 장애유형별 고령화나 아동·청소년 장애인 규모를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도와 장애유형 이름을 맞춰 연결해야 하며, 사회적경제 부문의 인증번호·사업자번호 같은 기업 축과는 직접 이어지지 않는다.
description_portal: 이 데이터는 경기도 등록장애인 현황을 장애유형별·연령별로 집계한 자료입니다. 보건복지부와 경기도청 장애인복지과가 제공하며, 매년 12월 말 기준으로 산출됩니다.세부 항목에는 장애유형, 연령대(0~9세, 10대, 20대, … 90세 이상), 각 연령별 등록장애인 수, 총계가 포함됩니다. 예를 들어, “청각장애” 유형에서 50대 등록장애인이 3천 명이면 해당 연령대 수치로 기록됩니다.이 데이터는 연령별 장애 발생 패턴 분석, 특정 장애유형의 고령화 추세 파악, 아동·청소년 장애인 지원 정책 수립 등에 유용합니다. 예를 들어, 뇌병변 장애인의 60대 이상 비율이 높게 나타난다면, 고령 장애인의 의료·돌봄 정책 강화의 근거가 될 수 있습니다. 반면 청소년 연령대에서 특정 장애 유형 비율이 높으면, 특수교육 지원 확대 정책에 활용될 수 있습니다.
