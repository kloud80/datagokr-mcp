description_portal: 대전광역시 연간 지적장애인 및 자폐성장애인 자립지원센터 운영 정보는 지적 장애인과 자폐성 장애인의 지역사회 자립을 지원하기 위해 설립·운영되는 자립지원센터에서의 연간 운영 내역을 정리한 자료입니다. 본 자료는 센터 별 프로그램, 예산 액, 사업 실적 등 주요 운영 항목을 포함하고 있습니다. 이를 기반으로 센터의 행정 운영 실태와 자립 지원 효과성을 종합적으로 파악할 수 있으며, 장애 유형 별 맞춤형 서비스 설계 및 지역 기반 복지 자원 확대 방향 수립에도 실질적인 도움을 제공합니다. 본 자료는 지적장애인 및 자폐성장애인의 자립역량 제고, 권익 강화를 뒷받침하고자 하는 정책 수립과 서비스 품질 분석의 자료로 쓰일 수 있습니다.  본 자료는 2022년 공공 데이터 기업매칭지원사업으로 수행되었습니다.
