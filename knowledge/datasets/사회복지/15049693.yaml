summary_user: 공무원연금공단이 금융자산운용으로 진행하는 해외 주식·채권 거래의 거래증권사와 위탁운용사를 투자분야별로 정리한 소규모 목록 파일(zip 753바이트)로, 번호·투자분야·거래증권사명만 담는다. 공무원연금 기금이 해외 주식·채권 투자에서 어떤 증권사·운용사와 거래하는지 확인하려는 연금 가입자나 기금 운용을 비교하는 분析가가 쓴다. 전역 조인 키가 없어 다른 연기금의 위탁운용사·거래증권사 목록이나 금융 데이터와는 금융회사 이름을 맞춰 연결해야 한다.
description_portal: '공무원연금공단에서 금융자산운용으로 진행하고 있는 해외 주식 및 채권 거래의 거래증권사 및 위탁운용사를 정리한 데이터입니다.거래금융기관 선정은 각 자산유형에 따라 지표를 통해 주기적으로 선정하고 있으며, 공무원연금공단 홈페이지(www.geps.or.kr) - 경영공시 - 금융자산운용 - 금융자산운용현황 - 거래금융기관 선정 메뉴에서 기준을 확인할 수 있습니다.해외투자(주식, 채권) : 해외주식ETF, 해외채권ETF, 해외 공모펀드 등 위탁운용을 통하여 포트폴리오 위험분산 및 초과수익 추구'
