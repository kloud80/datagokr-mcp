description_portal: 2020년 1월 1일부터 현행화 기준일자까지 체결된 공무원연금공단의 업무협약(MOU) 현황에 관한 데이터입니다. 이 데이터는 협약 체결 일자, 협약 기관, 협약의 주요 내용 등을 포함하고 있으며, 공무원연금공단의 주요 사업과 지역사회 발전을 위한 협력 활동을 파악할 수 있습니다.특히, 데이터에 포함된 협약들은 현행화 기준일자까지 종료되지 않은 협약들로, 최근 1년간(1월 1일부터 12월 31일까지) 활동이 없었던 협약은 제외되었습니다. 또한, 협약 체결 당시에는 공무원연금공단의 주요 사업과 관련된 협약이거나 지역사회 발전에 기여하는 내용을 포함한 협약들이 포함되어 있습니다.
