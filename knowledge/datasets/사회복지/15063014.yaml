description_portal: 본 데이터는 장애인 등록 현황에 대한 상세 정보를 제공합니다. 이는 경상북도 내에서 공식적으로 등록된 장애인의 지역별, 장애 정도별, 성별 인구 통계를 파악함으로써, 지역의 장애인 복지 수요를 분석하고 맞춤형 정책을 수립하는 데 목적이 있습니다.주요 내용으로는 장애인이 거주하는 행정 구역인 시군구 정보와, 장애의 세부 구분을 나타내는 유형 정보가 포함됩니다. 장애의 정도에 따른 구분인 심한장애 남성, 심한장애 여성에 대한 등록 인원수 정보가 제공됩니다. 또한, 기존의 경증 장애에 해당하는 심하지 않은 장애 남성, 심하지 않은 장애 여성에 대한 등록 인원수 정보도 기록되어 있습니다.이 자료는 장애인 인구 통계 분석, 장애 유형별·정도별 복지 서비스 공급 계획 수립, 그리고 지역별 장애인 복지 인프라 확충 방안 마련 등에 귀중한 기초 자료로 활용됩니다.자료 관련 문의는 054-880-3764로 하시기 바랍니다.
