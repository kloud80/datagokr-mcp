description_portal: '○ 통계개요* 통계명 : 노인의료 복지시설* 통계종류 : 서울시 노인의료복지 생활시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「노인복지법」34조에 규정된 생활시설로 서울시에서 관리하는 시설* 작성목적 : 노인복지시설 설치신고를 마친 노인복지시설의 수, 입소정원을 집계하여적정수의 시설수요와 충족율을 분석하고 분석결과에 따른 정책 수립 및평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 어르신복지과* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 노인의료복지 생활시설(노인요양시설, 노인요양공동생활가정)의 시설수, 입소인원, 종사자수 등○ 용어설명* 노인의료복지시설 : 노인성 질환 등으로 요양을 필요로하는 노인이 입소하여 급식·요양 등일상생활에 필요한 편의를 제공받는 시설로 노인요양시설·노인요양공동생활가정을 말함(노인복지법 제34조)* 노인요양시설 : 치매 중풍 등 노인성 질환 등으로 심신에 상당한 장애가 발생 하여도움을 필요로 하는 노인을 입소시켜 급식?요양과 그 밖에 일상생활에 필요한편의를 제공* 노인요양공동생활가정 : 치매 중풍 등 노인성 질환 등으로 심신에 상당한 장애가발생하여 도움을 필요로 하는 노인에게 가정과 같은 주거여건과 급식요양, 그 밖에일상생활에 필요한 편의를 제공○ 기 타* 노인복지법 개정("08.7)으로 명칭 및 분류 변경* 노인복지법 시행규칙 개정("11.12)으로 노인의료복지시설의 노인전문병원은 삭제됨'
