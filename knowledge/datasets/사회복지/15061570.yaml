summary_user: 청소년 자원봉사활동 프로그램을 건별로 담은 API로, 프로그램명·운영기관명·활동 기간·참가비·참가대상 등을 전국 범위로 제공한다. 청소년이나 학부모가 우리 지역에서 참가비 없이 중학생이 참여할 수 있는 봉사 프로그램이 언제 열리는지 찾거나, 분석가가 지역별 봉사 프로그램 공급 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명·지역명 같은 이름 매핑으로만 이어 쓰며, 청소년 수련시설 등 같은 기관의 데이터와 기관명으로 연결하는 정도가 현실적이다.
limits: 공통 코드나 ID가 없어 시설·통계 데이터와 정확히 조인하기 어렵고 이름 매칭에 기대야 한다. 갱신은 이벤트성으로 분류돼 정기적으로 최신화된다고 보기 어려우므로, 호출 시 활동 일자를 확인해 지난 프로그램을 걸러야 한다.
