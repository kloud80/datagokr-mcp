summary_user: 전국 등록장애인을 기준연도(STD_YY)·장애유형별로 집계한 자료로, 총인원과 남녀 인원, 1~6급 등급별 인원, 심한 장애인과 심하지 않은 장애인 수를 담으며 건별 원천이 아닌 전국 단위 집계다. 장애인 복지 담당자나 분석가가 "뇌병변·뇌전증 등 유형별로 중증 장애인 비율과 성별 차이가 어떤가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도와 장애유형 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 전국 등록장애인의 유형별·등급별 현황을 집계한 자료입니다. 보건복지부 자료를 바탕으로 매년 12월 말 기준으로 제공되며, 장애유형별 총인원, 성별 구분, 장애등급별(1급~6급) 인원, 그리고 심한 장애인과 심하지 않은 장애인 구분까지 포함하고 있습니다.주요 장애유형으로는 뇌병변(뇌성마비, 외상성 뇌손상, 뇌졸중 등으로 발생하는 신체장애), 뇌전증(간질성 발작으로 인한 장애), 장루·요루(배변 및 배뇨 기능 장애로 인한 장루/요루 수술자) 등이 있습니다.이 데이터는 등록장애인의 유형별 분포와 성별 차이, 등급별 중증도 현황을 파악할 수 있어, 장애인 복지 정책 수립, 맞춤형 서비스 설계, 의료·재활 지원 수요 예측 등에 중요한 기초 자료로 활용됩니다. 특히 장애등급제 개편 전후의 변화 추적이나 중증·경증 장애인 비율 분석에도 유용합니다.
