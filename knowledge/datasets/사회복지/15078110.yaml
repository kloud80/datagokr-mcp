summary_user: 아이돌봄기관별·기준연월별로 누적 이용 아동 수를 0~12세 연령과 소득기준 유형(가형~라형)으로 나눠 담은 전국 단위 집계 데이터이며, 전염성 질병 아동 여부와 상위 기관 정보도 함께 들어 있다. 정책 분석가나 지자체 담당자가 "어느 소득구간에서 몇 살 아동의 돌봄 이용이 많은가"처럼 소득 계층별 연령 분포를 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 아이돌봄기관명이나 같은 기관의 기관번호(childCareInstNo)로만 맞춰 이어 쓴다.
description_portal: 아이돌봄 연령과 소득기준별로 누적아동 실적 조회 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연월, 아이돌봄기관명, 전염성 질병 아동여부,  0세부터 12세까지 각 연령별로 가형부터 라형까지의 아동 수 등의 정보를 확인할 수 있습니다.가형부터 라형까지 유형별로 아동 연령 분포를 분석함으로써, 경제적 여건에 따른 돌봄 수요의 차이를 구체적으로 파악할 수 있습니다. 특정 소득구간의 아동 연령대별 수요 집중도는 계층 맞춤형 복지 설계의 기초 자료가 될 수 있으며,  정책 수립 시 정밀 타겟팅 전략 수립에 활용될 수 있습니다.
team:
  dept: 경영관리부 지능정보화팀
