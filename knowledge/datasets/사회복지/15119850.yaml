summary_user: 경기도 내 재가노인복지시설(주야간보호·방문요양·방문목욕·복지용구 등)을 시설 한 곳당 한 행으로 담은 시설 목록으로, 시군구·시설종류·장기요양지정 여부·주소·연락처와 함께 정원·입소현원(성별·등급별)·종사자 수·설치일자·설치주체·좌표를 담는다. 고령 가족을 둔 도민이나 복지정책 분석가가 '우리 시군에 장기요양지정을 받은 주야간보호시설이 어디에 몇 곳 있고 정원 대비 현원이 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군구명(signgu_nm)이나 시설명·주소로 건강보험 장기요양기관 목록이나 시군구 단위 지역통계와 이름 매칭해 잇고, 위경도 좌표로 지도 위에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 노인복지를 위한 재가복지시설의 현황을 정리한 자료로, 시설의 종류, 위치, 장기요양지정 여부, 설치일자 및 운영 주체 등의 정보를 포함하고 있습니다. 주요 항목은 시군구명, 시설종류(주야간보호, 방문요양, 방문목욕, 복지용구 등), 시설명, 장기요양지정기관 여부, 도로명주소 및 지번주소, 전화번호, 팩스번호 등으로 구성되어 있습니다. 데이터는 지역 내 노인 돌봄 서비스 제공 인프라 현황을 파악할 수 있도록 하며, 주야간보호시설 및 방문요양기관 등의 분포는 고령사회 대응 복지정책 수립, 요양서비스 접근성 분석, 지역복지자원 분포지도 제작 등에 활용됩니다.* 등록된 자료는 조사당시의 자료로 현재 시점과 다를 수 있습니다.* 입소현원-계 = 남자+여자 = 등급내(1~5급)+등급외
accrual_periodicity: 수시
team:
  dept: AI데이터행정과
