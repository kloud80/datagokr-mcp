summary_user: 부산광역시 기장군의 지역아동센터를 시설 한 곳당 한 행으로 담은 파일로, 시설명·소재지·위경도·정원과 현원·종사자 수·신고일·면적·전화번호를 담는다(1.5KB 규모의 소규모 목록). 기장군에서 아이를 맡길 지역아동센터를 찾는 보호자나, 센터별 정원 대비 현원과 위치 분포를 보려는 분석가가 '우리 동네 가까운 센터에 자리가 있는가' 같은 질문에 쓴다. 전역 조인 키는 없어 시설명이나 주소·좌표로 다른 사회복지시설 목록이나 지도 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 부산광역시 기장군 가족복지과에서 운영 관리되고 있는 데이터로, 기장군 지역아동센터의 시설명、 도로명주소、 설치일자、 정현원、 시설종류、 전화번호、 위도、 경도 등 관련 정보를 포함하고 있습니다.* 데이터의 항목별 설명지역아동복지 시설명、 위치정보（도로명주소、 위경도）、 설치일자、 정현원、 종사자수、 시설종류、 전화번호、 포함됨。* 데이터 활용시 참고사항1. 이 데이터는 부산광역시 기장군 가족복지과에서 연간 현행화하고 있으며, 수시로 변경될 수 있습니다.2. 현재 데이터 기준일자는 2025년 9월입니다.데이터값이 공란인 일부분은 미집계 데이터가 포함되어 공란 처리하였습니다.
