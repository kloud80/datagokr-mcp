summary_user: 대구광역시 구·군별 가족센터의 소재지와 운영법인, 위탁기간을 시설 단위로 담은 소규모 목록 파일(CSV 715바이트)이다. 대구에 사는 가족이 우리 구·군 가족센터가 어디 있는지 찾거나, 분석가가 센터별 민간 위탁 운영법인과 위탁기간을 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 구·군 이름이나 주소 문자열로 맞춰 사회복지시설 공통 목록 등과 이어 쓴다.
description_portal: 가족센터는 모든 가족이 겪을 수 있는 다양한 문제나 필요를 지원하기 위해 만들어진 공공 또는 민간 위탁 기관입니다. 모든 형태의 가족(한부모, 다문화, 조손, 맞벌이 등)을 대상으로 서비스합니다.주요 기능 및 프로그램으로는 (가족 상담) 부부 갈등, 부모-자녀 관계, 가족 갈등 등 심리·정서적 상담 지원(가족 교육) 부모 교육, 부부 교육, 가족 소통 프로그램 등, 자녀 양육, 의사소통, 역할 분담 등 주제 다양(가족 돌봄) 아이돌봄 서비스 연계, 긴급 돌봄 지원, 특히 맞벌이, 한부모 가정을 위한 지원(다문화 가족 지원) 한국어 교육, 통·번역 지원, 문화 이해 교육
