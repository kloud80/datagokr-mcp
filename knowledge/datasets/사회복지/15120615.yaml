description_portal: 이 데이터는 대구도시개발공사가 운영하는 영구임대주택의 계약이 해지된 사례에 대한 이력을 기록한 공공데이터로, 임대계약의 해지 사유 및 해지일자 등 관련 정보를 체계적으로 제공함으로써 주거복지사업의 투명성과 책임성을 높이기 위한 목적으로 마련되었습니다. 계약자번호, 접수일자, 해지일자, 해약사유, 등록자번호, 등록일시, 수정자번호, 수정일시 등이 포함됩니다. 이를 통해 계약 종료의 원인과 시점을 명확히 파악할 수 있으며, 퇴거자에 대한 사후 조치, 재공급 계획 수립, 공가 관리 등에 효과적으로 활용할 수 있습니다. 영구임대사업의 운영 안정성과 투명성을 확보하기 위한 행정자료로서의 가치가 높습니다.
