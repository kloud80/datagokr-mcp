status: active
summary_user: 청소년 자기도전포상제를 운영하는 광역시도·중앙 기관을 기관 한 곳당 한 건으로 담은 목록으로, 기관명·주소·우편번호·전화·팩스·대표자·홈페이지 주소와 사용 여부를 전국 범위로 제공한다. 청소년이나 학부모가 '우리 지역에서 포상제를 문의하거나 신청하려면 어느 기관에 연락해야 하나'를 확인하는 데 쓰고, 담당자는 관할 기관 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 청소년 시설·활동 데이터와는 기관명이나 주소(시도) 매칭으로만 잇는다.
limits: 공통 기관코드 같은 조인 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 기관명·주소 문자열 매칭에 의존해야 한다. 이벤트성 주기로 생성 후 바뀌지 않는 데이터로 분류되어 있으므로, 현재 운영 여부는 사용 여부 값과 수정일시를 함께 확인한다.
