description_portal: '서울특별시의 외국인 아내, 외국인 남편과의 성격차이 등 이혼사유별 이혼건수 등을 제공합니다.* 배우자부정 : 배우자의 부정이 원인이 되어 이혼한 경우 * 정신적,육체적 학대 : 정신적 또는 육체적 학대로 인하여 이혼한 경우 * 가족간 불화 : 이혼당사자와 가족 간에 성격 부조화(고부갈등 등) 또는 상호불신으로 인한 경우 * 경제문제 : 이혼당사자 일방이 가정의 경제적인 파탄 또는 금전적인 문제 등으로 향후 결혼생활을 청산하기로 결정한 경우 * 성격차이 : 이혼당사자간의 성격이 서로 맞지 않아 이혼한 경우 * 건강문제 : 이혼당사자 일방 또는 쌍방의 건강상 문제로 인해 정상적인 결혼생활 유지가 어려워 이혼한 경우 * 기타: 배우자가 사망했거나 실종되어 생사여부를 알 수 없을 때 다른 사람과 재혼하기 위해 이혼신고를 할 경우 또는 위에 해당하지 않는 경우'
