description_portal: 보건복지부  사회보장위원회에서 관리하는 국내 사회보장 관련 핵심 지표 및 세부 통계 시각화 자료의 관리 현황 정보를 제공합니다. 데이터는 노인돌봄종합서비스 제공기관 및 인력 현황, 노인가구 및 1인가구 추이 등 보건·복지 서비스 전반을 아우르는 총 1,037건의 풍부한 사회보장 통계 메타데이터를 포함하고 있습니다.제공되는 주요 항목으로는 사회보장 거버넌스 상의 정책 분류 기준이 되는 "지표번호"와 "지표명", 세부 통계 정보를 구별하는 "통계번호"와 "통계명", 그리고 통계 데이터 산출의 기준이 되는 "단위"를 명시하고 있습니다. 또한 공공 웹사이트에서 데이터를 효과적으로 시각화하기 위해 설정된 "차트종류"(multi, single, pie 등) 및 "차트크기", 해당 지표의 대국민 서비스 "사용여부", 통계의 한계나 출처를 명시한 "비고", 그리고 개별 통계의 연도별·항목별 실제 통계 수치들이 가변형 JSON 구조로 저장된 "차트데이터"까지 총 10개의 컬럼으로 구성되어 있습니다.
