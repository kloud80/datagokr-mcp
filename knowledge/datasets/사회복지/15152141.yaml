description_portal: 본 데이터는 한국청소년상담복지개발원이 운영하는 위기청소년통합지원정보시스템을 기반으로 수집된 사례관리 통계자료입니다.2023년 3분기부터 2025년 2분기까지의 분기별 데이터를 포함하며, 주요 항목으로는 사례관리 발굴건수, 청소년안전망 효과성 평가건수 및 평가점수, 심리정서환경척도검사 건수 및 점수, 사례관리자 중 취업자 수, 아웃리치 활동에 따른 상담자 수, 지원서비스 제공별 건수, 면담 후 조치별 건수 등이 있습니다.해당 통계는 위기청소년의 발굴 및 개입 과정의 성과를 분석하고, 청소년안전망의 운영 실태를 진단하는 데 활용될 수 있습니다.또한 지역사회 청소년복지 정책 수립 및 실무자 업무 지원을 위한 기초자료로서의 활용가치를 지닙니다.
