summary_user: 인천광역시 관내 새마을금고와 신용협동조합의 금고 수·자산액·예금액 등을 연도별(2015~2017년)로 정리한 시도 단위 기본통계 집계표로, 534바이트 크기의 CSV 한 개 파일입니다. 지역 상호금융 규모가 몇 년 사이 어떻게 변했는지 살피려는 분석가나 사회적경제 담당자가 인천의 신협·새마을금고 자산과 예금 추이를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 시도의 같은 통계나 상호금융 통계와는 기관명과 항목명을 맞추는 방식으로만 이어 쓴다.
description_portal: 인천광역시가 제공하는 새마을금고 및 신용협동조합 현황 공공데이터는 관내에 소재한 지역 기반의 상호금융기관인 **새마을금고(MG)**와 **신용협동조합(신협)**의 데이터로 (금고수, 자산액, 예금액 등)등에 대한 정보를 제공합니다. 해당 데이터는 기본통계데이터로 2017년 데이터가 가장 최신데이터 입니다. 참고바랍니다.해당 데이터는 공공데이터포털에서 무료료 확인할 수 있으며, CSV파일로 제공하고 있습니다.*최신 업데이트가 되면 공공데이터포털도 현행화 할 예정입니다. 감사합니다.
