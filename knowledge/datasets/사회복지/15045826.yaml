summary_user: 사립학교교직원연금공단이 국내주식을 직접운용하며 보유한 상위 5개 종목을 종목별로 담은 파일로, 종목명·평가기준일자·평가금액(억 원)·투자비율(%)이 들어 있으며 파일 크기는 223바이트 정도로 작습니다. 사학연금 기금이 국내 주식 중 어느 종목에 얼마를 넣고 있는지 확인하려는 가입자나 분석가가 대형주 쏠림 정도와 패시브 전략과의 관계를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 종목명(유가증권명)을 종목코드로 바꿔 증권·금융 시세 데이터와 붙여 쓰고, 국민연금·군인연금 기금의 국내주식 보유 현황과도 종목명 기준으로 비교한다.
