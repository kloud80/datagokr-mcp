summary_user: 경기도 내 다함께돌봄센터를 시설 한 곳당 한 행으로 정리한 목록형 자료로, 집계일자·시군명·시설명·전화번호·정원(명)·지번/도로명 주소·우편번호·위경도를 담는다. 학부모가 우리 동네 가까운 돌봄센터와 연락처를 찾거나, 정책 담당자가 시군별 센터 수와 정원 규모를 비교해 돌봄 인프라가 어디에 몰려 있는지 살피는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군명이나 주소로 맞추거나 위경도 좌표로 공간 결합해서 이어 쓴다.
description_portal: 이 데이터는 경기도의 다함께돌봄센터의 설치·운영 현황을 한눈에 파악할 수 있도록 정리한 시설 목록형 자료입니다. 주요 항목은 집계일자, 시군명, 시설명, 복지시설전화번호, 시설정원(명), 소재지도로명주소로 구성되어 있으며, 각 센터가 어느 지역에 위치해 있는지와 연락처, 수용 가능 규모를 함께 확인할 수 있습니다. 따라서 지역별 돌봄시설 분포, 생활권 내 아동 돌봄 접근성, 시설 정원 규모 비교, 신규 돌봄 수요가 예상되는 지역의 기초 현황 파악 등에 활용할 수 있습니다. 또한 행정기관이나 정책 검토자는 센터의 공간적 분포와 정원 정보를 바탕으로 돌봄 인프라의 편중 여부를 살피는 데 참고할 수 있습니다. 다만 이 자료는 시설별 운영 현황을 보여주는 데이터이므로 실제 이용 가능 여부, 서비스 세부 내용, 모집 상황 등은 별도 확인이 필요합니다
