description_portal: '사립학교교직원연금공단 신용위험지표(VaR금액)과 관련된 데이터로 년도, 월별,  국내채권직접, 해외채권직접, 대체투자, 국내대체투자, 해외대체투자, 신용위험 통합 전체 등 자산군별 신용위험 관리 현황을 제공합니다. (단위 : 억원, 기간 : 2015년 1월부터 2025년 4월까지의 월별 데이터(월 마지막 영업일 기준))- 사학연금의 중장기자산에 대한 신용위험관련 위험노출액(Exposure) 중 리스크 하의 손실가능액(VaR) 데이터해당 데이터는 내재된 신용 위험을 정량적으로 파악할 수 있으며 위험 관리 노력과 재무 건정성을 투명하게 공개하고자 합니다. 또한 연금 자산 운용의 안정성 및 효율성을 평가하고 위험 관리 정책 수립을 위한 기초 자료로 활용될 수 있습니다.(특이 사항이 있을 때만 비정기적으로 바뀌는 정보로 수시 1회성 데이터로 전환)'
