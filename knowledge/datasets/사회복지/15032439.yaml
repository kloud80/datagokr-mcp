summary_user: 서울 중랑구의 청소년시설 14개소(시립 청소년수련관 2곳·단기쉼터 1곳, 구립 독서실·커뮤니티공간·상담복지센터·학교밖청소년지원센터·문화예술창작센터 등 11곳)를 시설 한 곳당 한 행으로, 시설명·도로명 소재지·전화번호·시설정보를 담은 작은 CSV 파일이다. 중랑구 주민이나 청소년·학부모가 '집 근처에 청소년 독서실이나 상담센터가 어디 있고 연락처는 무엇인가'를 확인하거나, 분석가가 구 단위 청소년 인프라 분포를 볼 때 쓴다. 전역 조인 키나 시설 코드가 없어 다른 데이터와는 시설명이나 소재지주소를 매핑해 잇고, 지역 통계와는 중랑구라는 시군구 단위로만 연결한다.
limits: 중랑구 한 곳만 다루므로 다른 자치구나 서울 전체 비교에는 다른 구의 데이터를 따로 모아야 한다. 명세상 연 1회 갱신이며 포털 설명 기준 자료 시점은 2025년 8월 11일이고, 그 사이 생기거나 바뀐 시설은 반영되지 않을 수 있다. 시설코드·좌표 등 공통 키가 없어 연계 시 이름·주소 문자열 매칭에 의존한다.
