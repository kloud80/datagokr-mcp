description_portal: '서울특별시 중랑구 청소년시설(수련관,독서실,상담센터, 청소년커뮤니티공간, 문화예술창작센터 등 14개소)현황입니다.중랑구청 아동청소년과에서 청소년시설명, 위치(소재지-도로명주소), 전화번호, 시설정보를 *2025년 8월 11일 기준으로 제공합니다.* 기존데이터의 현행화된 사항은 중랑구 청소년문화예술창작센터 청소년 시설로 2024년 9월에 개소되어 추가되었습니다.차기 시설 데이터는 2026년 8월에 현행화 처리될 예정으로 참고하시기 바랍니다.청소년시설은 총 14개소이며, 세부내용은 아래와 같습니다.- 시립 3개소(청소년수련관 2개소, 청소년단기쉼터 1개소) : 중랑청소년센터, 망우청소년센터로 청소년수련관 2개소, 망우청소년단기쉼터 1개소- 구립 11개소 : 망우,용마, 면목 청소년독서실 3개소, 청소년커뮤니공간 1~5번지 딩가동 5개소, 중랑청소년상담복지센터 1개소, 학교밖청소년지원센터1개소, 중랑청소년문화예술창작센터 1개소서울시 중랑구 청소년 시설 이용에 참고하시기 바랍니다.감사합니다.'
