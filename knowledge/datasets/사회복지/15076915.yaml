description_portal: '서울특별시 보육시설의 정보입니다.- 주요내용 : 시설명, 시설유형, 시설종류, 시설주소 등 제공*용어설명- 보육시설은 「영유아보육법」에 따라 설치·운영되는 기관- 영유아(만 0세~만 5세, 미취학 아동)를 보호하고 교육하며, 건강한 발달을 지원하는 시설   일반적으로 어린이집이 대표적인 보육시설<설치 기준>- 면적: 영유아 1인당 일정 면적 이상 확보- 안전: 소방·위생·급식·교재교구 시설 구비- 인력: 원장, 보육교사, 조리원, 간호사(또는 보건교사) 배치 기준 있음※ 제공부서 : 서울특별시 복지실 복지기획관 복지정책과(02-2133-7352)입니다.※ 바로가기 클릭 시 서울특별시 열린데이터광장 개방 데이터로 이동합니다.'
