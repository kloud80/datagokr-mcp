summary_user: 서울특별시 보육시설(어린이집 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·시설코드(FCLT_CD)·시설종류와 세부종류·관할 자치구·주소·전화번호·우편번호를 담는다. 부모나 분석가가 "우리 자치구에 어떤 종류의 어린이집이 몇 곳 있고 연락처는 무엇인가"를 확인하거나 자치구별 보육시설 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 어린이집 데이터와는 시설명·주소 매칭이나 자치구 코드(JRSD_SGG_CD)·자치구명 기준으로 이어 쓴다.
limits: 서울시 열린데이터광장(data.seoul.go.kr)에서 별도 인증키를 받아 호출해야 하며, 공공데이터포털 활용신청과는 별개다. 좌표나 전국 공통 어린이집코드가 확인되지 않아 평가·보육료 공시·입소 대기 등 다른 데이터와 바로 키로 결합할 수 없다.
