summary_user: 공무원연금공단이 관리하는 퇴직 공무원 수를 18세부터 65세 이상까지 1세 단위 연령(구분)별로 집계하고, 연령마다 총계와 정무직·일반직·경찰·소방·교육직·군무원·공중보건의 등 15개 직종별 퇴직자 수를 담은 전국 단위 집계표다. 분석가나 인사·연금 정책 담당자가 '어느 직종에서 몇 세 전후에 퇴직이 몰리는가', '경찰·소방의 퇴직 연령 분포는 일반직과 어떻게 다른가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령·직종 이름을 맞추는 방식으로만 연결하며, 같은 공단의 재직자·수급자 통계와 나란히 비교하는 용도가 현실적이다.
description_portal: 공무원연금공단에서 관리하는 퇴직자 현황을 연령별 및 직종별로 구분하여 집계한 데이터로, 공무원 조직의 연령대별 퇴직 분포와 직종별 퇴직 양상을 종합적으로 파악할 수 있도록 구성되어 있습니다.연령은 18세부터 65세 이상까지 1세 단위로 구성되어 있으며, 각 연령별 퇴직자 총계와 함께 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타의 직종별 퇴직자 수가 포함되어 있습니다.1. 기타에는 청원경찰, 공익법무관, 기타직 공무원 등이 포함되어 있음2. 60세 이상 기능직(특례가입자)은 서울대학교와 인천대학교임(철도공사 제외)
