summary_user: 중소기업은행이 판매하는 퇴직연금 상품 정보를 상품 단위로 담은 파일로, 수익증권 상품은 운용사·펀드명·펀드유형·주식편입비율·투자한도를, 원리금보장상품은 만기와 DB·DC·IRP별 예정적용금리를 담는다. 퇴직연금 가입자가 DC나 IRP에서 어떤 펀드를 어느 비중까지 담을 수 있는지, 원리금보장상품 금리가 유형별로 얼마인지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 금융기관 퇴직연금 데이터와는 운용사명·펀드명 같은 이름을 맞춰서만 이어 쓴다.
limits: 조인 키가 없어 금융위·근로복지공단 등 다른 퇴직연금 데이터와 자동으로 연결되지 않고 이름 매핑이 필요하다. 전국 단위의 비공간 데이터라 지역별 분석에는 쓰지 못한다.
