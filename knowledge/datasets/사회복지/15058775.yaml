summary_user: 경기도에서 장애인맞춤형지원사 사업을 제공하는 기관을 기관 한 곳당 한 행으로 담은 현황 목록으로, 시군, 기관명, 전화번호, 홈페이지, 지번·도로명 주소, 우편번호, 위경도를 포함한다. 장애인 가족이나 복지 담당자가 '우리 시군에서 맞춤형지원사 서비스를 제공하는 기관은 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 경기도 데이터와는 시군 코드·시군명(SIGUN_CD)이나 기관명·주소 매칭으로만 잇는다.
description_portal: 경기도내 장애인 복지관, 의료재활시설, 보호시설 및 요양시설등의 현황 정보를 제공합니다.이 데이터는 한탄강 수계에 속한 포천시 지역 하천의 수질 상태를 조사한 결과를 담고 있으며, 환경 모니터링 및 수계 오염 관리를 목적으로 활용됩니다. 주요 항목은 기준년도, 기준월, 시료번호, 조사지점명, 전유기탄소(TOC), 생물학적산소요구량(BOD), 부유물질(SS), 총질소(T-N), 총인(T-P), 색도 등이며, 각 항목은 하천의 수질을 평가하는 데 필수적인 수치로 구성되어 있습니다. 측정 지점은 포천천, 금현천, 송우천, 고모천 등 포천시 내 주요 지류와 본류를 포함하며, 각각의 위치는 상세한 주소나 지리적 설명을 통해 명시되어 있습니다. 데이터는 수질 개선 정책 수립, 환경영향 평가, 생태계 보전 등 다양한 환경정책 수립과 평가를 위한 기초자료로 활용될 수 있습니다. 특히 TOC와 BOD는 하천 내 유기물 오염 수준을 평가하는 데 중점적으로 사용되며, T-N과 T-P는 부영양화 가능성을 진단하는 데 중요한 요소입니다.
