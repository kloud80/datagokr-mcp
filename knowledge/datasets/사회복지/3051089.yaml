description_portal: 한국장애인개발원 수행중인 장애인정책 연구는 급변하는 장애인복지 환경과 관련하여 장애인복지 수준을 향상시키기 위한 전략 및 정책개발을 위한 것으로 장애 유형별 연구 및 전달체계, 고용, 재난안전 등의 다양한 분야에서 시의성 있는 연구를 수행함으로써 현안 정책수요에 부합하는 연구를 진행하고 있습니다.또한 장애인정책 연구 대상 발굴 및 확대를 통한 수요자 중심의 연구를 수행하고 있으며, 다양한 장애인 정책분야의 연구 조사를 구축함으로써 현황 파악을 통한 변화의 경향을 도출하여 정책 방향의 적절성과 효과성에 대한 기초 정보를 제공하고 있습니다. 한국장애인개발원 연구보고서 데이터는  연구보고서명, 연구보고서 발행일, 연구보고서 책임자, ISBN, 연구 목적 등으로 구성된 데이터입니다.* 제공중인 데이터 컬럼 중 데이터가 없을 경우 데이터 미집계로 표기하였고 부가기호가 있을 경우 ISBN 컬럼에 표기하였습니다.
