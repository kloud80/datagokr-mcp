summary_user: 경기도 일반학급(전일제 통합학급)에 배치된 특수교육대상 학생 수를 기준연도·장애영역별로 집계한 데이터로, 유치원은 연령별(3세·4세·5세 이상), 초·중·고는 학년별 학생 수를 시도 단위 집계값으로 담는다. 교육 정책 분석가나 학부모가 '경기도에서 학습장애나 정서행동장애 학생이 일반학급에 몇 명이나 통합 배치되어 있고, 학년이 올라갈수록 어떻게 변하는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도(STD_YY)와 장애영역명을 이름으로 맞춰 교육부 특수교육통계나 경기도의 다른 특수교육 집계와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 일반학급 배치(전일제 통합학급)에 속한 특수교육대상 학생 수를 장애영역별, 학교과정별로 집계한 현황입니다. 매년 6월 말 기준으로 유치원, 초등학교, 중학교, 고등학교 단계별 학생 수가 기록되며, 유치원은 연령대(3세, 4세, 5세 이상)별로, 초중고는 학년별로 구분됩니다.장애영역은 건강장애, 발달지체, 의사소통장애, 정서행동장애, 학습장애 등 5개 주요 유형으로 분류됩니다. 예를 들어 건강장애는 만성 질환이나 급성 건강 문제로 인한 학습 제한을 포함하며, 정서행동장애는 또래 규범에서 심각하게 일탈한 정서 및 행동적 특성을 가진 경우를 의미합니다.이 데이터는 특수교육대상자의 일반학교 참여 정도, 학년별·연령별 배치 현황, 장애유형별 교육 접근성을 확인하는 데 중요한 자료입니다. 교육부 특수교육통계 기반으로 수집되며, 특수교육 지원 정책 수립, 학급 배치 기준 검토, 지역별 지원 자원 배분 계획 수립 등에 활용할 수 있습니다.
