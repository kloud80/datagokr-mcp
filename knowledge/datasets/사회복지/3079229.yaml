summary_user: 고양시 소재 공공청소년 시설(청소년수련관·청소년문화의집·청소년복지센터·학교밖청소년지원센터 등, 민간시설 제외)을 시설 한 곳당 한 행으로 담은 목록으로, 구분·시설명·소재지·운영기관·수용정원·연락처를 포함하는 작은 파일(csv 약 1.3KB)이다. 고양시 주민이나 청소년 정책 분석가가 "우리 동네 가까운 공공 청소년시설은 어디이고 정원은 몇 명인가", "덕양구 신규택지 지역에 청소년시설이 부족한가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지 주소를 이름 매칭하거나 같은 기관(고양시) 기준으로 시군구 단위 지역 통계와 이어 쓴다.
