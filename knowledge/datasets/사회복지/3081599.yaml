summary_user: 전국 다문화가족지원센터별로 배치된 언어발달지도사 배정인원을 2020년부터 2025년까지 연도별로 담은 센터 단위 집계 파일로, 시도명·지역명·센터명이 함께 들어 있다. 다문화가족 지원 정책 담당자나 연구자가 어느 지역 센터에 언어발달지도사가 몇 명 배정됐고 해마다 어떻게 늘거나 줄었는지 확인하는 데 쓴다. 전역 조인 키나 센터 코드가 없어 다른 가족센터·사회복지시설 자료와는 시도명·센터명 같은 이름 매칭으로만 이어 쓸 수 있다.
