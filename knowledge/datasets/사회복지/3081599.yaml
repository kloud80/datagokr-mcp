description_portal: 전국 다문화가족지원센터에 배치된 언어발달지도사의 현황을 연도별로 제공하는 자료이여, 각 센터의 시도명, 지역명, 센터명, 그리고 2020년부터 2025년까지의 배정인원 수를 포함하고 있어, 다문화가족의 언어발달 지원 현황을 파악하는 데 유용합니다. 언어발달지도사의 주요업무로는 만 12세 이하의 다문화가족 자녀를 대상으로 연령에 맞는 평가 도구를 활용하여 언어발달 상태를 진단하고, 평가 결과에 따라 어휘, 구문, 사회적 의사소통 능력 향상 등을 목표로 맞춤형 언어교육을 제공합니다. 이 데이터는 연간 업데이트되며, 최신 정보는 2025년 9월 24일 기준입니다. 총 216개의 행으로 구성되어 있습니다. 이 자료는 다문화가족의 언어발달 지원 정책 수립 및 연구에 활용될 수 있습니다.
