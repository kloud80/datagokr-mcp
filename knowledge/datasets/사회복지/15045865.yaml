description_portal: '사학연금 가입 국립대학법인 퇴직수당기금 조성 현황과 관련된 데이터로 국립대학볍인의 퇴직수당기금과 관련하여 연도별로 수입과 지출이 얼마정도이며, 당해년도 기금이 얼마나 조성되었는지 등에 대한 정보를 한 눈에 볼 수 있도록 제공하는 데이터입니다. 연도, 수입, 지출, 포괄손익누계액, 당해년도 조성액, 연말 보유 기금액, 비고 등의 항목을 제공합니다. (단위 : 백만원)이 데이터를 통해 국립대학법인 교직원 퇴직수당기금의 투명한 관리와 건전성을 공개적으로 보여주고자 합니다. 또한, 기금의 장기적인 재정 안정성 분석 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 기금 운용을 입증하고, 관련 이해관계자들이 기금의 현황을 명확히 파악할 수 있도록 지원합니다.'
