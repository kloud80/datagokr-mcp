summary_user: '경기도 양주시 관내에서 장애인 일자리 참여자가 배치된 근무처를 기관 단위로 정리한 현황 파일로, 근무처명·소재지 주소·배치 장애인 수(명)·관리부서·데이터기준일을 담는다. 양주시 주민이나 복지 분석가가 "양주시 장애인 일자리 참여자는 어느 기관에 몇 명씩 배치돼 있나"를 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 근무처 이름이나 소재지 주소를 맞춰 붙여야 한다(예: 양주시 장애인복지시설 현황, 주소 기반 지도 데이터).'
limits: 양주시 한 개 시군구 범위의 현황이라 다른 지역과 비교하려면 지역별 파일을 따로 모아야 한다. 참여자 개인 정보나 직무 내용은 없고 근무처별 인원만 있다. 공통 코드가 없어 이름·주소 매칭으로 연결해야 하므로 표기 차이에 주의한다.
