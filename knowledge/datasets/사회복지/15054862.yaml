summary_user: 울산광역시 울주군 안의 재가노인지원서비스센터를 시설 한 곳당 한 행으로 정리한 목록으로, 시설유형·시설명·시설장·소재지·연락처·종사자수를 담으며 파일 크기는 586바이트 정도의 소규모 CSV다. 울주군에 사는 어르신이나 가족이 집 가까운 재가 지원 센터와 연락처를 찾거나, 담당 공무원이 센터별 인력 규모와 분포를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 시설명을 맞춰 붙여야 하며, 노인복지시설·장기요양기관 목록이나 시군구 단위 지역 통계와 이어 볼 수 있다.
