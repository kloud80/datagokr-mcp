summary_user: 경기도 내 성폭력피해상담소를 상담소 한 곳당 한 행으로 담은 현황 자료로, 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 여성복지시설 종류, 지번·도로명 주소, 위경도 좌표를 포함한다. 정책 담당자나 분석가가 "우리 시군에 운영 중인 성폭력 피해 상담소가 어디에 몇 곳 있는가"를 확인하고 피해자 접근성과 기관 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명으로 같은 기관의 다른 경기도 자료와 묶거나, 주소·좌표로 사회복지시설 공통 마스터 등과 이름·위치를 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 성폭력 피해자 지원을 목적으로 운영되는 상담소의 현황을 담고 있으며, 각 상담소의 명칭, 위치, 인허가일자, 영업 상태 등의 정보를 포함합니다. 성폭력 피해자에 대한 심리적 안정 지원, 법률 및 의료 연계, 상담 활동 등을 수행하는 기관으로서, 피해자 보호와 회복을 위한 지역 내 주요 인프라로 기능합니다. 이 자료는 위기 대응 체계 분석, 성폭력 예방 정책 수립, 피해자 접근성 향상 방안 마련, 공공 지원 기관 분포 파악 등에 활용될 수 있습니다. 특히 상담소의 운영 여부 및 위치 기반 정보는 피해자의 실질적 접근성 평가 기준이 됩니다.
