description_portal: '사립학교교직원연금공단 연도별 부담금 수입과 관련된 데이터로 부담금유형별, 부담주체별, 연도, 수입 금액 등의 항목을 제공합니다. 부담금은 부담주체별로 개인부담금, 법인부담금, 국가부담금으로 구분되며, 부담금유형별로 연금부담금, 재해보상부담금, 퇴직수당부담금으로 구분됩니다. (단위 : 천 원)이 데이터를 통해 공단의 재정 운용 투명성을 제고하고 기금의 건전성을 공개적으로 보여주고자 합니다.또한 연금 재정 분석 및 향후 재정 계획 수립을 위한 자료로 활용될 수 있습니다.본 데이터는 공공기관의 책임 있는 재정 관리를 입증하고 이해관계자들이 공단의 재무 건전성을 명확히 파악할 수 있도록 지원합니다.'
