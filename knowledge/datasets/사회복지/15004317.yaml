summary_user: 전국 노인돌봄기본서비스·독거노인서비스 수행기관을 기관 한 곳당 한 행으로 담은 파일(약 129KB CSV)이며, 시도·시군구·기관명·주소·대표전화·위수탁기간·시설유형과 특화·응급안전안심·방문요양·재가노인복지 서비스 수행 여부를 함께 싣는다. 혼자 사는 부모를 둔 가족이 우리 시군구에서 돌봄서비스를 맡은 기관과 연락처를 찾거나, 분석가가 시군구별 수행기관 수를 독거노인 인구와 견줘 돌봄 공백 지역을 가리는 데 쓴다. 전역 조인 키나 기관 코드는 없으므로 시도·시군구 이름으로 노인인구·독거노인·기초연금 수급 같은 지역 통계에 붙이고, 주소를 좌표로 바꿔 다른 시설 데이터와 겹쳐 본다.
description_portal: '보건복지부에서 전국에 있는 노인돌봄기본서비스 수행기관 현황과 독거노인서비스 수행기관 정보(연번, 시도, 시군구, 기관명, 주소, 기관대표전화, 위수탁기간, 시설유형구분, 특화서비스, 응급안전안심서비스, 방문요양서비스, 재가노인복지서비스, 사회서비스원소속, 사회서비스형 노인일자리 파견이용)를 제공합니다. * 노인돌봄서비스 : 혼자 힘으로 일상생활을 영위하기 어려운 노인과 독거노인에게 욕구에 따라 안전확인, 생활교육, 서비스 연계, 가사･활동지원, 주간보호서비스 등 맞춤형 복지서비스 제공'
