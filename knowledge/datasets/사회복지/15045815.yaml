description_portal: 사립학교교직원연금공단 사학연금수급자 현황(연령별, 학교급별 퇴직연금수급자) 데이터는 학교급별(유치원, 초등학교, 중학교, 고등학교, 전문대학교, 대학교, 특수학교, 법인), 교직원별(교원, 사무직원)로 수급자를 구분하고 연령별로 수급자 수를 집계하여 제공합니다. 연령은 50세 미만부터 90세 이상으로 1세씩 증가하는 추이로 나누어 집계되었으며, 교직원별 평균과 전체 평균값을 제공합니다. 이 데이터는 연금 수급자 추이 파악 및 제도 개선을 위한 기초 자료로 활용될 수 있습니다. 이 데이터를 통해 사학연금 수급 구조를 투명하게 공개하고, 연금 제도 운영의 건전성을 대외적으로 보여주고자 합니다.
