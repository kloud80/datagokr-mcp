summary_user: 임신 사전건강관리 지원사업의 청구 건수를 시군구별·월별(2024년 4월~12월)·성별로 집계한 파일로, 전국 시군구 단위를 담는다. 지자체 담당자나 분석가가 "우리 시군구에서 남녀별로 임신 사전건강관리 검사 지원 신청이 월별로 얼마나 들어왔나"를 비교하는 데 쓴다. 표준 시군구코드 같은 전역 조인 키가 없어 시도·시군구 이름을 매핑해야 인구·출생 통계나 다른 출산·임신 지원 데이터와 이어 쓸 수 있다.
limits: 건수는 청구일이 아니라 신청일 기준으로 집계되고, 신청이 없는 칸은 빈 값으로 남는다. 서울시는 2025년부터 사업에 참여해 값이 있는 건은 2025년 사업 사전 신청분이므로 2024년 실적으로 해석하면 안 된다. 기준 시점은 2024년 4월 1일~12월 24일 오전 10시이다.
