description_portal: 한국건강가정진흥원 공식 홈페이지(kihf.or.kr)에 2020년부터 2025년까지 게시된 공지사항의 목록을 수록한 자료입니다. 총 639건의 공지사항이 포함되어 있으며, 각 항목은 일련번호, 메뉴명, 제목, 조회수, 공개여부, 공지여부, 작성일자 등으로 구성되어 있습니다. 이를 통해 기관의 주요 정책 발표, 가족서비스, 사업 공고, 교육 안내, 채용 정보 등 다양한 공지사항의 내용을 확인할 수 있습니다. 데이터는 연간 단위로 업데이트되며, 최신 정보는 2025년 7월 31일 기준입니다. 이 자료는 기관의 정보 공개 현황 분석, 공지사항의 주제별 분류, 게시 빈도 분석 등 다양한 목적으로 활용될 수 있습니다.
