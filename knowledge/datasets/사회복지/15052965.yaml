summary_user: 공무원연금 퇴직연금 수급자 수를 퇴직사유(명예·정년·일반·당연퇴직, 직권면직, 기타)와 성별로 나누고, 직종(일반직·경찰·소방·교육직·법관검사·군무원 등)을 열로 펼친 전국 단위 집계표이며, 파일은 961바이트 크기의 소형 CSV입니다. 연금·인사 분석가가 '명예퇴직으로 연금을 받는 사람이 어느 직종에 많은지, 남녀 차이는 어떤지' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 직종명·퇴직사유명을 맞춰 붙이거나 같은 공무원연금공단의 다른 수급자 통계와 나란히 보는 방식으로만 이어 쓴다.
description_portal: 공무원연금공단에서 제공하는 직종별·퇴직사유별·성별 퇴직연금수급자 현황 데이터입니다. 본 데이터는 공무원연금 수급자 중 퇴직연금 수령자의 직종, 퇴직사유, 성별을 기준으로 세분화하여 수급자 분포와 규모를 파악할 수 있도록 구성되어 있습니다. 직종은 일반직, 정무직, 별정직, 경찰, 소방, 교육직, 법관·검사, 기능직, 공안직, 군무원, 연구직, 지도직, 계약직, 공중보건의, 기타(우정직, 고위직, 외무직, 청원경찰, 전문경력관 등)로 구분되며, 퇴직사유는 명예퇴직, 정년퇴직, 일반퇴직, 당연퇴직, 직권면직, 기타(파면, 해임, 실종 등)로 분류됩니다.
