summary_user: 경기도 시군별 특수학교 재직 교직원 수를 연도(STD_YY)·시군 단위로 집계한 자료로, 교직원·교원·교사 전체 인원, 교사 성별, 유치원·초등·중고등 학교급별 특수 1·2급 정교사 수, 보건·영양·사서·상담교사, 행정직 인원 등을 담는다. 교육행정 담당자나 분석가가 "경기도 어느 시군의 특수학교가 정교사 대비 일반교사나 상담교사가 부족한가" 같은 지역 간 특수교육 인력 격차를 따질 때 쓴다. 실측 컬럼에서 전국 공통 조인 키는 확인되지 않아, 다른 데이터와는 시군 코드(SIGUN_CD)·시군명과 연도를 이름·코드 매핑으로 맞춰 경기도 내 시군 단위로만 연결한다.
description_portal: 본 데이터는 교육부 특수교육통계를 기반으로 경기도 내 시군별 특수학교에 재직 중인 교직원 현황을 집계한 자료로, 매년 6월 말 기준의 인원 수를 제공합니다. 주요 항목으로는 ‘교직원전체인원수(명)’, ‘교원전체인원수(명)’, ‘교사전체인원수(명)’, ‘교사남자인원수(명)’, ‘교사여자인원수(명)’ 외에도 ‘유치원특수1정인원수(명)’, ‘초등학교특수2정인원수(명)’, ‘중학교특수1정인원수(명)’ 등 자격 및 학교급별 교원 수와 ‘보건교사인원수(명)’, ‘상담교사인원수(명)’, ‘일반직행정직인원수(명)’ 등 직종별 교직원 수가 포함됩니다. 이를 통해 특수교육 교직원의 자격 분포, 학교급별 교사 배치 현황, 성별 구성, 지역 간 인력 격차 등을 종합적으로 파악할 수 있으며, 교육인력 수급 계획, 지역 간 교원 배치 균형화, 특수교육 정책 수립 등 다양한 행정 및 정책적 활용이 가능합니다.
