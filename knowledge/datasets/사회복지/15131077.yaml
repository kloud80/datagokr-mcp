description_portal: 세종특별자치시 청소년 누리터 정보를 제공합니다.데이터는 연번, 누리터명, 시설 구분(수련관, 문화의 집, 자유공간, 활동센터, 상담센터), 주소, 전화번호, 주요 활동으로 구성되어 있으며,현재 세종특별자치시에는 총 11개의 누리터가 조치원읍, 반곡동, 고운동, 보람동, 새롬동 등에 소재하고 있고,주요 활동은 청소년활동 및 교육문화프로그램, 다목적 공간 활동, 청소년활동 지원+활동 네트워크, 청소년상담+심리검사, 학교 밖 지원센터 청소년 상담 및 지원 등이 있습니다.본 데이터는 세종특별자치시 보건복지국 아동청소년과(044-300-4943)에서 관리하는 데이터입니다.
