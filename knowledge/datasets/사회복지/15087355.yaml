description_portal: 광주광역시 남구 관내 사회적기업 현황 및 정보(기업명, 유형, 분야, 소재지도로명주소, 인증년도 등)을 제공합니다. 해당 데이터는 광주광역시 남구청 일자리정책과(☎062-607-2666)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 사회적기업은 취약계층에게 일자리와 사회서비스를 제공하고, 지역사회 문제 해결과 공익 증진을 목적으로 운영되는 기업입니다. 수익 창출과 동시에 사회적 가치를 실현하는 것을 목표로 하며, 고용 창출, 지역 발전, 환경 보호 등 다양한 분야에서 활동합니다. 사회적기업으로 인증받기 위해서는 법률에서 정한 요건을 충족해야 하고, 경영 투명성 및 공익성을 유지해야 하며, 경제 활동과 사회적 책임을 결합해 지속가능한 발전에 기여합니다.
