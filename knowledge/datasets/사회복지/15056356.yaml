summary_user: 제주시 관내 경로당을 한 곳씩 읍면동, 경로당명, 소재지 주소, 데이터기준일자로 담은 건별 시설 목록 파일(CSV)이다. 제주시 어느 동네에 경로당이 몇 곳 있고 어디에 있는지 알고 싶은 주민이나, 읍면동별 고령층 여가시설 분포를 비교하려는 복지 분석가가 쓴다. 전역 조인 키가 없어 읍면동 이름이나 소재지 주소를 매핑해 지역 통계, 장기요양기관 등 다른 노인복지시설 자료와 잇는다.
limits: 표준 시설코드나 행정구역 코드가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되므로 표기 차이에 따른 누락에 주의한다. 범위가 제주시 한 곳이라 서귀포시 등 다른 시군구 경로당은 담지 않는다.
