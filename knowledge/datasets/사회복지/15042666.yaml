summary_user: 부산광역시 16개 구군의 노인복지관을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·시설장·주소·전화번호·운영단체와 그 구분·홈페이지·위도·경도를 담는다. 부산 시민이나 보호자가 "우리 구에서 가까운 노인복지관은 어디이고 어느 단체가 운영하나"를 찾거나, 분석가가 구군별 노인복지관 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키는 없으므로 주소의 구군명이나 위도·경도를 기준으로 경로당·장기요양기관 같은 다른 노인복지시설 목록이나 시군구 단위 고령 인구 통계와 맞춰 이어 쓴다.
