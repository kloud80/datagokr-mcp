summary_user: 청소년 상담에서 나타난 학업·진로 문제(진로 혼란, 시험 스트레스 등)를 학교급·학년별로 집계한 전국 단위 통계를, 차트 형태(제목·구분·X축·Y축·값)로 담는다. 진로교육 담당자나 정책 분석가가 '어느 학년에서 진로·학업 고민 상담이 많아지는가'를 확인해 상담 개입 시기와 진로지도 계획을 정하는 데 쓴다. 실측 컬럼에 기관·지역 코드 같은 공통 조인 키가 없어서, 다른 데이터와는 학년·문제 유형 이름을 직접 맞춰 이어 써야 한다.
limits: 전국·비공간 집계라 시도·시군구별 비교나 상담센터 단위 분석에는 쓸 수 없다. 공통 조인 키가 없어서 다른 데이터와 연결하려면 학년·문제 유형 이름을 직접 매핑해야 한다. 포털 활용신청은 자동승인되고, serviceKey를 query로 넘기며, 개발계정 호출 한도는 하루 10,000회다.
