summary_user: 경기도 장애인연금 수급자 수를 기준연도(STD_YY)와 장애등급 구분별로 한 행씩 두고, 전체 수급자 수와 지체·뇌병변·시각·청각·언어·안면·신장·심장·간·호흡기·장루요루·뇌전증·지적·정신·자폐성·기타 등 장애유형별 수급자 수를 열로 담은 시도 단위 집계 자료다. 복지 정책 담당자나 분석가가 '경기도에서 장애인연금 수급자가 어떤 장애유형·등급에 몰려 있고 해마다 어떻게 변하는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 장애유형 이름을 맞춰 붙이는 방식으로만 연결한다.
description_portal: '이 데이터는 경기도 장애인연금 수급자 현황을 장애등급별·장애유형별로 구분해 집계한 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 제공됩니다.장애인연금은 국민연금 가입 여부와 관계없이 만 18세 이상의 등록 중증장애인에게 지급되는 제도적 급여입니다. 데이터에서는 1급, 2급, 3급(중복 포함) 등 장애등급별 수급자 수와, 장애유형별(예: 지체, 뇌병변, 시각, 청각, 언어, 안면, 신장, 심장, 간, 호흡기, 장루·요루, 뇌전증, 지적, 정신, 자폐성, 기타) 수급자 현황을 확인할 수 있습니다.이 자료는 어떤 장애유형과 등급에서 연금 수급자가 집중되는지를 파악할 수 있어, 경기도 내 장애인 복지정책 기획 및 예산 배분, 의료·재활 지원 수요 분석, 취약계층별 지원 체계 개선에 유용합니다. 특히 중증도별 차이를 반영해 장애유형별 복지 사각지대를 점검하거나, 특정 유형의 연금 수급률 변화를 모니터링하는 데 활용 가능합니다.'
