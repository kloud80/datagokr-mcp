description_portal: 본 자료는 2025년 6월 말 기준으로 부산광역시 수영구에 주민등록되어 있는 만 65세 이상 1인 가구 현황을 종합적으로 분석한 결과입니다. 수영구 내 각 행정동별로 구분하였으며, 연령대별 인원 분포를 세분화하여 노년 1인 가구의 특성을 명확히 파악할 수 있도록 구성하였습니다. 자료의 정확성을 높이기 위해 주민등록전산시스템과 사회보장정보시스템을 연계하여 데이터를 추출하였으며, 최신 행정정보를 바탕으로 작성되었습니다.특히, 국민기초생활수급자는 생계급여 및 의료급여 수급자를 대상으로 분류하였으며, 저소득층은 차상위계층 및 주거급여 수급자를 포함하여 경제적 취약계층의 현황을 세밀하게 반영하였습니다. 기타(시설입소자 현황)은 1인 가구 중 장기부재자(요양시설 입소 등) 파악을 위함입니다. 마지막으로, 전체 노인 인구수 또한 함께 수록하여 1인 가구 비율과 비교함으로써, 수영구의 독거노인 비율 및 노인 고독사 예방을 위한 정책 수립의 기초 자료로 활용할 수 있도록 하였습니다.
