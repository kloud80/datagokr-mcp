summary_user: 청소년 자기도전포상제 참가자의 입회 이력을 건별(이력일련번호 단위)로 담으며, 입회 상태·입회 구분·포상 단계·온라인/오프라인 구분과 광역중앙시설·운영기관명, 등록·수정 일시를 포함하고 범위는 전국이다. 청소년 활동 정책 담당자나 분석가가 "어느 운영기관에서 입회가 많고, 온라인과 오프라인 참여 비중이나 입회 상태 분포는 어떤가"를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 운영기관명·광역중앙시설기관명 같은 이름 매핑이나 같은 기관의 일련번호(operInstSn, mctpvCntrlFcltSn)로만 이어 쓴다.
limits: 표준 행정코드나 공간 정보가 없는 비공간 전국 데이터라서 시군구·시도 통계와 바로 붙이기 어렵고, 기관명을 매칭해야 한다. 입회 상태·구분·포상 단계는 코드값으로만 제공되는데 입력에 코드표가 없으므로, 해석하려면 별도의 코드 정의를 확인해야 한다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회까지 쓸 수 있다.
