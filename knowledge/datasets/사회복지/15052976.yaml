summary_user: 공무원연금 퇴직연금 수급자 수를 연령대(구분)별 행에 재직년수 구간(20년 미만부터 40년 이상까지 6구간)과 성별(계·남·여)로 나눠 담은 전국 단위 집계표로, 건별 원천이 아닌 약 4.6KB 크기의 CSV 파일이다. 연금 정책 분석가나 연구자가 '고령 수급자일수록 장기 재직자 비중이 높은가, 여성 수급자는 어느 재직기간 구간에 몰려 있는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령대·재직년수 구간 이름을 맞추거나 같은 공단의 다른 연금 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 연령별·재직년수별·성별 퇴직연금수급자 현황 데이터입니다.해당 자료는 38세 미만부터 85세 이상까지의 연령대를 기준으로 퇴직연금 수급자의 분포를 집계하며, 재직년수는 20년 미만, 25년 미만, 30년 미만, 33년 미만, 40년 미만, 40년 이상으로 구분하고, 성별(남성·여성)로도 세분화하여 제공합니다.본 데이터는 퇴직연금 수급자의 연령대별·재직기간별 구조를 종합적으로 파악할 수 있어, 특정 연령층의 평균 재직기간 특성, 장기·단기 재직 후 수급자의 비율, 성별 차이 등을 분석하는 데 유용합니다.
