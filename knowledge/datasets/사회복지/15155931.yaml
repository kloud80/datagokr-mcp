description_portal: '이 데이터는 전북특별자치도 전주시 내 한파쉼터의 시설명, 쉼터유형, 주소, 운영시간(평일, 주말) 등 현황을 제공하는 데이터입니다.한파쉼터는 겨울철 기온 급강하 및 혹한기에 시민들이 체온을 유지하고 휴식할 수 있도록 마련된 공공및 민간 개방형 실내 대피공간으로, 주요쉼터는 주민자치센터, 경로당, 복지관, 도서관 등 유형의 시설로 구성되어 있습니다. 한파 시 주민들이 가까운 실내 대피 공간을 확인할 수 있으며, 한파에 취약한 계층(노약자, 어린이 등)을 보호하고, 지역사회 재난 대응 및 안전 관리 체계 강화와 난방장비 유지보수, 시설 점검, 서비스 연계 등에 활용할 수 있습니다.데이터 제공부서 : 재난안전과(063-281-5134)'
