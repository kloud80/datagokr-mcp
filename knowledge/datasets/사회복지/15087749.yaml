summary_user: 전국 가족센터별 온가족보듬사업 종사자 수(최소 배정 기준)를 센터 단위로 담은 파일로, 지역·센터명·대표전화와 함께 제공되며 2024년부터 다문화가족 사례관리·가족역량강화지원·가족상담 사업이 통합된 온가족보듬사업의 인력 배치를 보여준다. 가족정책 담당자나 연구자가 '우리 지역 가족센터에 사례관리 인력이 몇 명 배정돼 있는가', '지역별 가족지원 인력이 고르게 배치됐는가'를 확인하는 데 쓴다. 전역 조인 키(시설코드·행정코드)가 없어 다른 가족센터·사회복지시설 데이터와는 센터명이나 지역명을 맞춰 연결해야 한다.
description_portal: 전국 가족센터 내 온가족보듬사업 종사자 수에 대한 정보를 제공합니다. 2024년부터 기존의 다문화가족 사례관리사업, 가족역량강화지원사업, 가족상담 등이 온가족보듬사업으로 통합되어 운영되고 있으며, 이에 따라 각 지역의 지원센터별 사례관리 담당자 수를 포함한 정보 제공합니다. 데이터 항목에는 연번, 지역, 센터명, 대표전화번호, 온가족보듬 종사자 수(최소 배정) 등이 포함하고 있습니다. 온가족보듬사업의 종사자는 가족 및 개인의 위기/욕구 파악을 위한 초기 상담 및 종합평가, 맞춤형 서비스 계획수립과 통합 사례관리, 부부/부모/자녀 갈등 중재, 정신.정서 안정지원, 의료/법률/돌봄 등의 지역자원연계, 긴급위기 현장 대응 및 1인 가구동행, 프로그램 운영, 교육, 자조모임 지원, 성과 모니터링, 기록 등을 이행합니다. 이 데이터는 가족지원 정책 수립, 지역별 서비스 제공 계획, 연구 및 분석 등에 활용될 수 있습니다.
