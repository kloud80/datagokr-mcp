description_portal: 본 데이터는 보건복지부에서 운영하는 장애인식개선 교육정보사이트의 공지사항 운영 현황 정보를 제공합니다. 교육정보사이트를 이용하는 사용자와 교육 참여자들에게 중요한 안내 사항을 전달하기 위해 작성된 공지사항 데이터를 포함하고 있으며, 각 공지사항을 고유하게 식별할 수 있는 공지사항 번호와 공지글의 핵심 주제를 나타내는 제목 정보를 제공합니다. 아울러 전문강사 양성과정 등 세부 교육과정의 모집 단계별 상세 안내 및 정보가 포함된 교육과정 모집 단계 설명 필드를 함께 제공하여 공지 내용의 구체성을 높였습니다. 또한, 사용자들이 해당 공지사항을 얼마나 조회했는지 파악할 수 있는 조회수 통계와 중요한 안내 사항을 사이트 상단에 고정하여 노출하는 상단 표시 여부, 별도의 팝업창을 통해 집중도 있게 안내하는 팝업창 표시 여부 등의 게시물 제어 상태 정보를 포함합니다. 마지막으로 공지사항이 최초로 등록된 등록 일시와 최신 정보로 변경된 수정 일시 데이터를 제공하여 게시물의 최신성과 관리 이력을 모니터링할 수 있도록 돕습니다.<데이터 이용시 참고사항>- 해당 데이터에서 교육과정모집단계설명, 수정일자 항목 중 해당 값이 없을 경우 공란처리하였습니다.
