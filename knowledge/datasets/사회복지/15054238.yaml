description_portal: 기부식품 제공자 및 사업자는 이용자에게 기부식품등을 무상으로 제공하여야 함.푸드마켓 푸드뱅크 사업자는 매주 3회 이상,매주 60인 이상에게 제공해야 함.기부식품 제공 시 물품의 특성, 식품의 보관 및 취식 방법 안내해야 함. 제공시 이용자 가구원수, 시설.단체 현원등을 고려하여 차등지원함.기부물품관리시스템은 기부자 및 이용자 관리, 기부식품 등 모집 및 제공내역 관리 등 효율적이고 체계적인 운영시스템을 제공하고, 각종 정보를 실시간으로 확보관리할 수 있도록 하는 전산시스템임푸드뱅크 푸드마켓은 저소득층의 안정적인 생활을 위한 푸드제공 사업임
