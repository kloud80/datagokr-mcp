summary_user: 부산광역시 동래구 관내 아동복지시설(생활시설·이용시설)을 시설 한 곳당 한 행으로 담은 파일(csv, 약 3KB)로, 시설명·유형·종류, 입소 정원과 현원, 종사자 수, 영업상태, 도로명 주소, 전화번호를 담는다. 동래구에서 보호대상아동을 받는 양육시설이나 지역아동센터가 어디에 있고 정원 대비 몇 명이 입소해 있는지 확인하려는 주민·복지 담당자·분석가가 쓴다. 전역 조인 키나 시설 코드는 없어서, 다른 사회복지시설 목록과는 시설명이나 도로명 주소(시설주소)를 맞춰 이어 쓴다.
description_portal: '부산광역시 동래구 아동청소년과에서 작성한 자료로 부산광역시 동래구  관내의 아동복지시설 중 생활시설과 이용시설의 현황에 대한 자료입니다. 내용으로 각 기관의 시설명, 시설유형, 시설종류, 입소 정원수, 입소 인원수, 입소 아동수, 종사자수, 영업상태, 시설주소, 전화번호 등의 항목을 제공합니다.아동복지법 제52조(아동복지시설의 종류)는 다음과 같습니다.1. 아동양육시설: 보호대상아동을 입소시켜 보호, 양육 및 취업훈련, 자립지원 서비스 등을 제공하는 것을 목적으로 하는 시설2. 아동일시보호시설: 보호대상아동을 일시보호하고 아동에 대한 향후의 양육대책수립 및 보호조치를 행하는 것을 목적으로 하는 시설3. 아동보호치료시설: 아동에게 보호 및 치료 서비스를 제공하는 다음 각 목의 시설가. 불량행위를 하거나 불량행위를 할 우려가 있는 아동으로서 보호자가 없거나 친권자나 후견인이 입소를 신청한 아동 또는 가정법원, 지방법원소년부지원에서 보호위탁된 19세 미만인 사람을 입소시켜 치료와 선도를 통하여 건전한 사회인으로 육성하는 것을 목적으로 하는 시설나. 정서적ㆍ행동적 장애로 인하여 어려움을 겪고 있는 아동 또는 학대로 인하여 부모로부터 일시 격리되어 치료받을 필요가 있는 아동을 보호ㆍ치료하는 시설4. 공동생활가정: 보호대상아동에게 가정과 같은 주거여건과 보호, 양육, 자립지원 서비스를 제공하는 것을 목적으로 하는 시설5. 자립지원시설: 아동복지시설에서 퇴소한 사람에게 취업준비기간 또는 취업 후 일정 기간 동안 보호함으로써 자립을 지원하는 것을 목적으로 하는 시설6. 아동상담소: 아동과 그 가족의 문제에 관한 상담, 치료, 예방 및 연구 등을 목적으로 하는 시설7. 아동전용시설8. 지역아동센터: 지역사회 아동의 보호ㆍ교육, 건전한 놀이와 오락의 제공, 보호자와 지역사회의 연계 등 아동의 건전육성을 위하여 종합적인 아동복지서비스를 제공하는 시설'
