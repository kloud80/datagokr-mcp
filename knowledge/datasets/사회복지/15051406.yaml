summary_user: 부산광역시 연제구 관내 노인의료복지시설(요양시설·공동생활가정), 재가노인복지시설(방문요양·주야간보호·방문목욕 등), 노인일자리전담기관을 시설 한 곳당 한 행으로 담은 목록으로, 시설유형·시설명·소재지·관리법인·전화번호가 들어 있는 약 10KB 크기의 CSV 파일이다. 연제구에 사는 가족이나 보호자가 '우리 동네에 주간보호나 방문요양을 하는 기관이 어디 있고 연락처는 무엇인가'를 찾을 때, 또는 분석가가 구 단위 노인복지시설 분포를 볼 때 쓴다. 공통 시설코드 같은 전역 조인 키가 없어서, 건강보험 장기요양기관 목록이나 다른 지역 노인복지시설 데이터와는 시설명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 연제구 관내에 위치한 노인복지시설(노인의료복지시설, 재가노인복지시설, 노인일자리전담기관) 현황입니다.노인의료복지시설(노인요양시설, 노인요양공동생활가정)재가노인복지시설(방문요양서비스, 주야간보호서비스, 방문목욕서비스, 그 밖의 서비스)노인일자리전담기관기본정보(기관명, 시설유형, 법인(재단)명)와 해당시설의 주소, 전화번호가 포함된 데이터 입니다.이 데이터는 활용의 편의성을 제공하기 위해 공공데이터 제공 표준에 맞게 CSV(Comma Separated Values)구분기호를 이용하여 데이터간 구분하였습니다.본 데이터와 관련하여 더 자세한 내용은 담당 부서에 문의해주시기 바랍니다.
