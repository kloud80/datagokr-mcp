summary_user: 전국 가족센터·다문화가족지원센터별로 배치된 통번역지원사 인원과 베트남어·중국어·캄보디아어 등 언어별 인원을 센터 단위로 담은 파일이며, 시도 단위로 구분된 전국 범위입니다. 다문화가족 지원 담당자나 분석가가 "우리 시도의 어느 센터에 몽골어 통번역지원사가 있는가", "언어별 통번역 인력이 지역마다 어떻게 분포하는가"를 확인하는 데 쓴다. 전역 조인 키가 없어 시도명·센터명 같은 이름 매칭으로 다른 사회복지시설·가족센터 목록과 연결해야 한다.
description_portal: 전국 가족센터 및 다문화가족지원센터에 배치된 통번역지원사의 언어별 현황을 포함하고 있습니다. 이 사업은 입국초기 결혼이민자의 초기 정착 단계에서 경험하는 의사소통 문제해결을 위해 서비스를 제공해서 한국사회에 조기 적응할 수 있도록 하는데에 목적이 있습니다. 다문화가족, 외국인‧난민가족 또는 다문화가족, 외국인‧난민가족을 직･간접적으로 지원하는 개인 또는 기관을 대상으로 수행합니다. 가족생활 및 국가 간 문화차이 등 입국 초기 상담 통번역, 결혼이민자 정착 지원, 국적･체류 관련 정보 제공 및 사업 안내 통번역, 임신･출산･양육 등 생활 정보 안내 및 상담내용 통번역, 교육과정 통번역 지원, 가족 간 의사소통 통역, 행정･사법 기관 이용 시 통역(공증 제외), 병원, 보건소, 경찰서, 학교 등 공공기관 이용 시 통역(공증제외), 위기 상황 시 긴급지원 통번역, 기타 다문화가족을 직･간접적으로 지원하는 개인 또는 기관에서 의뢰하는 통번역 업무 등을 제공합니다. 데이터 제공 항목은 연번, 시도명, 센터명, 통번역지원사 배치인원, 베트남어, 중국어, 캄보디아어, 몽골어, 일본어, 필리핀어, 러시아어, 네팔어 등이며, 총 232개의 센터 정보가 수록되어 있습니다. 이 데이터는 활용하여 다문화가족 지원 정책 수립, 언어별 서비스 수요 분석, 지역별 통번역 인력 배치 계획 등에 활용될 수 있습니다.
