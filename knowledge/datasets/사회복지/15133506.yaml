summary_user: 강릉시 비휠체어 교통약자 이동 지원 서비스인 설렘콜의 운행을 건별로 담은 파일로, 승하차 일자·시각, 승하차 읍면동, 배차 대기시간, 승차인원, 주행시간·거리, 요금 등 11개 항목으로 구성된다(약 79KB CSV). 교통약자 이동 정책 담당자나 분석가가 '어느 읍면동·시간대에 수요가 몰리고 대기시간이 얼마나 긴가'를 살펴 차량 배치와 증차 여부를 판단하는 데 쓴다. 전역 조인 키는 없으며, 승하차지 읍면동 이름을 행정구역 코드와 이름으로 매핑해 강릉시의 다른 읍면동 단위 통계와 연결한다.
description_portal: "공공데이터 제공신청 접수 건으로, 강원특별자치도 강릉시의 비휠체어 교통약자 이동 지원 서비스인 설렘콜의 이용 현황 데이터입니다.※ 데이터의 공식 명칭은 '설렘콜'이나, 내부 항목(컬럼)명은 '솔향콜'로 표기되어 있습니다.본 데이터는 11개 항목(컬럼)으로 구성되며, 각 항목의 설명은 다음과 같습니다.솔향콜 승차일시: 서비스 이용을 시작한 연월일솔향콜 하차일시: 서비스 이용을 종료한 연월일승차시간: 탑승한 시각 (시:분)하차시간: 하차한 시각 (시:분)솔향콜 승차지: 탑승한 읍면동솔향콜 하차지: 하차한 읍면동솔향콜 대기시간(분): 배차 대기 시간 (분)솔향콜 승차인원: 탑승한 승객 수솔향콜 주행시간(분): 목적지까지 이동한 시간 (분)솔향콜 주행거리(km): 목적지까지 이동한 거리 (km)솔향콜 요금 (원): 발생한 이용 요금 (원)이 11개 항목의 조합을 통해, '설렘콜' 이용자의 일자/시간대별 승하차 위치, 이동 거리, 소요 시간, 요금 등 상세한 이용 패턴을 분석할 수 있습니다."
