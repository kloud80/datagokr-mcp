summary_user: 경기도 장애인 가구의 겨울철 월동난방비 지원 현황을 기준년도·시군별로 집계한 자료로, 전체 지원 가구 수와 장애등급(1·2·3급, 3급은 중복 포함)별 가구 수를 담는다. 복지 담당자나 분석가가 '우리 시군에서 중증 장애인 가구가 난방비 지원에서 차지하는 비중은 해마다 어떻게 달라졌나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)나 시군명으로 다른 경기도 시군 단위 통계와 이름·코드 매핑해 잇는다.
description_portal: 이 데이터는 장애인 가구의 겨울철 난방비 지원 현황을 연도별·지역별로 집계한 자료입니다. 주요 항목에는 기준년도, 시군명, 전체 지원 가구 수, 1급 가구 수, 2급 가구 수, 3급 가구 수(중복)가 포함되어 있으며, 중증도에 따라 세분화된 가구 지원 현황을 제공합니다. 이를 통해 지역별 장애인 가구의 난방비 지원 규모를 파악할 수 있고, 중증 장애인 가구의 지원 비중을 분석할 수 있습니다. 또한 연도별 변화를 분석함으로써 에너지 복지 정책의 효과성과 지원 사각지대 여부를 평가할 수 있습니다. 해당 데이터는 지자체의 사회복지 행정과 에너지 복지 정책 수립에 중요한 기초 자료로 활용됩니다.
