summary_user: 국제청소년성취포상제에 참여한 청소년이 영역별로 수행한 활동 이력을 입회일련번호·변경순번 단위의 건별 기록으로 담으며, 활동명·성공목표·활동 시작/종료일·활동계획 요청/확인일시·완료 요청/확인일시·제출확인 여부를 포함한다. 청소년 활동 운영자나 분석가가 "어느 활동영역에서 계획 확인부터 완료 확인까지 오래 걸리거나 완료되지 않는 활동이 많은가"를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 입회일련번호(admSn)와 활동영역코드로 같은 기관의 포상제 관련 다른 데이터와만 이어 쓸 수 있고, 행정구역 정보가 없는 전국·비공간 자료라 지역 통계와는 직접 연결되지 않는다.
description_portal: 국제 청소년 성취포상제 활동영역이력 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 정보 서비스의 활동명, 성공목표내용, 활동 시작/종료 일자, 활동완료 확인/요청 일시, 활동계획 요청/확인일시, 제출확인 여부 등의 내용을 확일할 수 있습니다.청소년이 수행한 활동의 영역별 이력을 기록한 데이터로 각 활동의 성공목표, 일정, 계획 수립 및 실행여부 등 전반적인 운영 과정을 확인할 수 있습니다. 이러한 정보는 특정 활동영역에서 나타나는 반복적인 문제점이나 성취 경향을 분석하는 데 효과적이며, 활동에 대한 평가 기준 마련과 성취도 향상 전략 수립에도 활용될 수 있습니다.
