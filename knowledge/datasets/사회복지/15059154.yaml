summary_user: 국민기초생활보장 수급가구 가운데 장애인이 포함된 가구 수와 그 비율을 전국과 경기도 두 단위로 나눠 연도별(STD_YY)로 담은 집계 자료다. 경기도 장애인 포함 수급가구 비율이 전국 평균보다 높은지 낮은지 해마다 비교해, 장애인가구 대상 복지 지원 확충이 필요한지 따져 보려는 정책 분석가나 지자체 담당자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도를 맞춰 붙이거나 시도 이름으로만 연결한다.
description_portal: 이 데이터는 국민기초생활보장제도 수급가구 중 장애인이 포함된 가구의 현황을 보여줍니다. 보건복지부와 사회보장정보시스템에서 제공하며, 전국 및 경기도 단위로 매년 12월 말 기준 집계됩니다.데이터에는전국 기초생활보장 수급가구 수전국 기초생활보장 장애인 포함 수급가구 수전국 대비 장애인 포함 수급가구 비율(%)경기도 기초생활보장 수급가구 수경기도 기초생활보장 장애인 포함 수급가구 수경기도 대비 장애인 포함 수급가구 비율(%)등이 포함됩니다.국민기초생활보장제도는 생활이 어려운 저소득층에게 생계·주거·의료 등의 급여를 제공하여 최저 생활을 보장하고 자활을 지원하는 제도입니다. 그중 장애인이 포함된 가구는 경제적 어려움뿐만 아니라 돌봄 부담, 의료비 지출 증가 등 복합적 문제가 동반되므로 중요한 정책 분석 대상입니다.이 데이터는 장애인가구의 빈곤 실태를 파악하고, 전국 대비 경기도의 상대적 수준을 비교하는 데 활용됩니다. 예를 들어, 경기도 내 장애인 포함 수급가구 비율이 전국 평균보다 높다면, 이는 경기도에서 장애인 중심의 추가 복지 지원 필요성을 시사합니다. 또한 장애인가구 대상의 맞춤형 주거·돌봄 서비스 확충, 소득보장 강화 정책을 설계하는 근거 자료로도 활용됩니다.
