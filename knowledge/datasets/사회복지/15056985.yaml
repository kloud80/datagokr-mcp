summary_user: 경기도가 제공하는 중앙부처 어르신 대상 복지서비스 목록으로, 서비스 한 건마다 제목·주목적·관련정보·안내·운영주체와 운영조직을 담은 서비스 단위 원천 목록이다(범위는 전국·비공간). 고령 부모를 둔 국민이나 복지 상담자가 "보훈·장애·주거 등 분야에서 어르신이 받을 수 있는 중앙부처 지원에는 무엇이 있고 어느 부처가 운영하나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 서비스명이나 운영주체(부처)명을 이름으로 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: 경기도 내의 어르신 관련 중앙부처 복지서비스 현황입니다. 중앙부처에서 마련한 어르신 관련 복지혜택 서비스입니다. 주목적, 관련정보, 안내 등의 정보를 제공합니다.이 데이터는 대한민국 중앙부처에서 제공하는 어르신 대상 복지서비스의 현황을 정리한 자료로, 각 서비스의 제목, 주목적, 운영주체 및 조직, 안내정보, 기준년도, 관련 웹페이지 링크 등을 포함합니다. 주요 항목에는 ‘보훈대상자 생계지원금 지급’, ‘발달장애인 주간활동서비스’, ‘보훈요양원 이용지원’ 등 다양한 복지서비스가 포함되어 있으며, 각 서비스는 보건복지부, 국가보훈부, 국토교통부 등 주요 정부 부처에서 운영합니다. 데이터는 고령층의 주거, 의료, 생계, 돌봄 등 다양한 삶의 영역에 대한 국가 지원현황을 파악하는 데 유용하며, 중앙정부의 복지정책 방향성 분석, 서비스 수혜자 정보 제공, 복지사각지대 해소 전략 수립 등에도 활용될 수 있습니다. 서비스 관련 링크는 '복지로' 사이트 등 공식 웹페이지로 연결되며, 자세한 안내와 신청절차, 상담 연락처 등이 제공됩니다. 본 자료는 최신년도 기준(2023년)으로 정리되어 있으며, 중앙부처 복지 포털 및 행정 시스템에서 제공하는 공공 데이터입니다.
