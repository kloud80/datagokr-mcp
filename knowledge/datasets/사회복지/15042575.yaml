description_portal: 우리 부에서 지원하는 국민취업지원제도(구 취업성공패키지)에 참여한 결혼이민자 인원수를 2010년부터 연도별로 제공(기준은 매년 12월 31일)하고 있습니다.2021년 1월1일부터는 취업성공패키지의 신규 참여가 중단되고 국민취업지원제도로 참여 가능하며, 국민취업지원제도는 근로능력과 구직의사가 있음에도 취업하지 못한 사람을 대상으로 맞춤형 취업지원서비스와 생활안정지원을 함께 제공하는 제도입니다.- (국민취업지원제도 1유형) 중위소득 60% 이하+재산 4억원 이하+2년간 100일 이상 취업경험이 있는 사람 / 구직촉진수당(월50~90만원, 6개월), 취업 시 취업성공수당(최대 150만원) 지원- (국민취업지원제도 2유형) 결혼이민자는 소득무관 / 취업활동계획 수립 시 참여수당(15~25만원), 직업훈련참여 시 훈련참여지원수당(월 최대 28.4만원, 최대 6개월), 취업 시 취업성공수당(최대 150만원)을 지원
