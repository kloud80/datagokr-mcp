description_portal: 장애인복지시설은 장애인을 위한 보호 및 지원서비스를 제공하는 기관으로, 다양한 종류의 시설과 프로그램을 포함하고 있습니다. 이들 시설은 주거, 거주, 직업훈련, 재활 서비스 등을 제공하며, 각 개인의 필요에 맞춘 지원을 제공하는 것을 목표로 합니다. 장애인복지시설은 크게 장애인거주시설, 장애인지역사회재활시설, 장애인직업재활시설 등으로 나눌수 있으며 이러한 시설들은 장애인의 사회 참여와 자립 생활을 지원하기 위해 다양한 복지 서비스를 제공합니다.이에따라 김천시 장애인복지시설 현황을 거주시설, 지역사회재활시설, 직업재활시설로 구분하여 시설명, 주소, 운영주체에 대한 정보를 제공합니다.
