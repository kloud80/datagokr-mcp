description_portal: '○ 통계개요* 통계명 : 직장보험 적용인구* 통계종류 : 서울시 직장보험 적용인구 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 사회보장의 근간인 의료보장에 관한 주요 사항을 통계자료로 생산함으로써우리나라 건강보험정책 및 보건의료정책의 기초 자료를 제공하는 것을목적으로 함* 조사체계 : 국민건강보험공단 시ㆍ도지부 → 국민건강보험공단* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 직장보험 적용인구(0~85세이상, 5세단위)현황○ 용어설명* 적용인구 : 국내에 거주하는 국민으로 의료보호대상자를 제외한 가입자와 피부양자를 말함.피부양자는 직장가입자에 의하여 주로 생계를 유지하는 자로서 보수 또는 소득이 없는 자로직장가입자의 배우자, 직계존속(배우자의 직계 존속 포함), 직계비속(배우자의 직계비속포함) 및 그 배우자, 형제·자매를 인정함'
