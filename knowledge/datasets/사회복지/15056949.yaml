summary_user: 경기도 내 장애인활동지원사 양성 교육을 맡은 복지관·협회·대학 부설 기관 등을 기관 한 곳당 한 행으로 담은 현황 목록이며, 시군명, 기관명, 지번·도로명 주소, 우편번호, 위도·경도, 전화번호, 홈페이지 주소를 포함한다. 활동지원사 자격 교육을 받으려는 사람이 '우리 시군에서 가까운 교육기관이 어디이고 연락처는 무엇인가'를 찾을 때나, 분석가가 시군별 교육기관 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 기관명 매칭, 위경도 좌표를 통한 공간 결합으로 잇는다.
description_portal: 이 데이터는 장애인활동지원사 양성을 위한 교육기관 현황을 정리한 자료로, 활동지원사 교육을 담당하는 복지관, 협회, 대학 부설 기관 등의 정보를 포함하고 있습니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소와 도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL이 있으며, 이를 통해 각 기관의 위치와 연락처를 확인할 수 있습니다. 해당 데이터는 장애인 돌봄 서비스 인력 양성, 지역별 활동지원사 교육 기회 분석, 복지 서비스 접근성 평가 등에 활용될 수 있으며, 특히 사회적협동조합, 종합복지관, 평생교육센터 등 다양한 기관 유형별 운영 특성을 비교할 수 있습니다.
