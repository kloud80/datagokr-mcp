summary_user: 부산광역시 서구의 장애인일자리사업 배정인원을 기관별·일자리 유형별(전일제·시간제·복지형)로 집계하고 1월~7월 월별 인원을 함께 담은 소규모 파일 데이터(CSV 351바이트)다. 서구 장애인이나 보호자, 복지 담당자가 '서구에서 장애인일자리가 어떤 유형으로 몇 명 배정돼 운영되는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 기관명을 맞춰 연결해야 한다.
description_portal: 부산광역시 서구 장애인일자리현황(배정인원)에 대한 일자리 유형별(전일제, 시간제, 복지형) 데이터를 제공합니다현재 전일제 36명, 시간제 27명, 복지형 20명 근무중입니다. 관련근거는 「장애인복지법」제21조(직업) 및 같은 법 시행령 제13조의2 , (장애인일자리사업 실시)  장애인일자리 사업안내 지침(보건복지부) 등참여자는 우선선발대상 및 사회활동능력, 참여욕구 등 선발기준표에 의한 선발을 하고, 면접 시 신청자의 사업참여 가능여부 파악하여 선발 ,선발제외 대상, 반복참여 제한기준 등을 고려하여 선발합니다
