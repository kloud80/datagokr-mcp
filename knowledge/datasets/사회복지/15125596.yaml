summary_user: 국제 청소년 성취포상제 운영기관이 소속 상위시설을 옮긴 이력을 변경 건별로 담으며, 시설명·변경순서와 함께 전출요청일자, 전출·전입 상위시설명, 전출·전입 처리시설명, 전입일자, 처리 상태를 전국 범위로 제공한다. 포상제 담당자나 참여자가 '이 운영기관이 언제 어느 상위시설에서 어디로 옮겨졌고 이관이 완료됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 청소년 시설 데이터와는 시설명 매칭으로만 이어 쓸 수 있다.
description_portal: 국제 청소년 성취포상제 운영기관의 정보를 제공하는 오픈 API형 데이터입니다.해당 개방데이터는 운영기관의 시설명, 변경순서, 전출요청일자, 전출상위시설명, 전입상위시설명, 전출처리자시설명, 전입처리자시설명, 전입일자 상태명 등의 내용을 확인할 수 있습니다. 국제 청소년 성취포상제 운영기관 간의 변경사항을 보다 쉽게 확인할 수 있으므로 각 운영기관을 관리하는 데 효율성과 투명성을 높일 수 있습니다. 또한 참여자나 담당관리자가 운영기관의 변경 정보들을 신속히 파악하고 대응할 수 있도록 돕는 기초자료가 될 수 있습니다.
