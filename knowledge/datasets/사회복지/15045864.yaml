description_portal: '국립대학법인의 회계기간별 수입, 지출 및 퇴직수당기금 조성액과 증감율에 관한 데이터로 연도, 기금액(단위 : 백만원), 증감율(해당연도 기금액-전년도 기금액)/전년도 기금액), 비고 등의 항목을 제공합니다.국립대학법인 퇴직수당기금 조성액 증가율을 통해 국립대법인 가입자 대상의 퇴직수당 지급여력, 퇴직자수 증가 추이 등을 확인할 수 있으며, 통계자료 작성, 연금 관련 제도 및 정책 결정에 활용할 수 있습니다.이 데이터를 통해 공단의 책임 있는 기금 관리 역량을 투명하게 공개하고, 퇴직수당기금의 안정적 운용 현황을 이해관계자들에게 명확하게 보여주고자 합니다. 본 데이터는 공공기관의 재무 건전성을 입증하고, 퇴직 급여 수급권자들의 신뢰를 확보하는 데 기여합니다.'
