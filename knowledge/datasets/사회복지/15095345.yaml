description_portal: '공무원연금 자금운용사업 중 해외 주식 자산의 월별 시장위험지표 시계열(2017년~기준년도) 자료로, 최대예상손실을 비율과 금액으로 측정합니다.VaR 기법을 통해 측정한 해외주식의 시장위험 지표입니다. 최대예상손실금액은 금리, 주가, 환율 등 시장변동으로 발생할 수 있는 최대손실 금액을 지수가중평균이동법(최근 변동성에 더 많은 가중치를 부여하는 방식)을 활용하여 특정 신뢰수준(95%) 하에 추정한 값이며, 최대예상손실(%)는 해당 손실금액을 평가금액 대비 비율로 환산한 값으로 상대적 위험수준을 판단하는데 사용합니다.시장위험: 주가, 금리, 환율 같은 시장 가격이 변동하면서 투자자산의 가치가 변할 수 있는 위험'
