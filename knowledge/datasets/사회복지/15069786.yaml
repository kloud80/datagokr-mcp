summary_user: 성남시 독거노인 수를 구·동별, 65세 이상 5세 단위 연령대별, 남녀별로 나눈 집계 파일(csv)입니다. 복지 담당자나 분석가가 "성남시에서 독거노인이 어느 동, 어느 연령대에 많은가"를 확인해 돌봄·방문 사업 대상 지역을 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 시군구 단위 노인인구·복지시설 통계와는 구·동 이름을 맞춰 연결해야 한다.
description_portal: 성남시 내 독거노인에 대한  현황 데이터로, 65세이상 노인의 5세단위 구별 동별 성별로 독거노인 자료를 제공하고 있습니다. 성남시는 급속한 고령화와 함께 독거노인 인구가 꾸준히 증가하고 있으며, 이에 따라 사회적 고립과 복지 사각지대 문제에 대응하기 위한 정책이 강화되고 있다. 현재 성남시에는 약 65세 이상 노인 인구 중 1인 가구 형태로 거주하는 독거노인이 전체 노인가구의 25% 이상을 차지하는 것으로 추정된다. 특히 수정구와 중원구는 상대적으로 고령화율이 높고 주거환경이 취약한 지역이 많아 독거노인 밀집도가 높은 편이다.
