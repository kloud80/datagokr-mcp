summary_user: 경기도 양평군 관내 청소년문화의집(동부·서부·중부 3개소)의 시설명·구분·주소·연락처·수용정원을 시설 한 곳당 한 행으로 담은 소규모 현황 파일(csv, 418 bytes)이다. 양평군 주민이나 청소년 활동 담당자가 '집 근처 청소년문화의집이 어디이고 몇 명까지 수용하며 어디로 연락하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 청소년 수련시설 현황이나 지역 통계와는 시설명·주소 문자열 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 양평군 내 청소년문화의집 기본 현황 정보를 제공합니다. 제공되는 정보에는 시설명, 시설유형, 주소, 연락처, 수용정원 등 시설 이용에 필요한 주요 정보가 포함됩니다.데이터는 정기적으로 갱신하며, 시설 운영 정보나 연락처 등이 변경될 경우 관련 내용을 반영합니다.청소년문화의집은 청소년 수련시설로서 청소년활동과 복지를 위해 운영되는 시설입니다.청소년을 위한 다양한 프로그램을 운영하고 있으며, 관내 3개소의 문화의집이 운영되고 있습니다.동부, 서부, 중부에 위치하고 있으며, 월요일은 정기휴일입니다
