summary_user: 서울 동작구 안 청소년 복지시설을 시설 한 곳당 한 행으로 담은 작은 파일(약 1.3KB)이며, 시설명·소재지 주소·건물 면적(제곱미터)·규모·정원·관리부서를 싣는다. 동작구 주민이나 청소년 지원 기관이 '우리 동네 청소년 복지시설은 어디에 있고 몇 명까지 받는가'를 확인하거나, 분석가가 구 단위 청소년 시설의 수용 규모를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 맞춰 잇거나, 시군구 단위 지역 통계와 동작구라는 지역 기준으로 연결한다.
description_portal: 이 데이터는 동작구 청소년 대상 복지시설의 운영 및 시설 현황 정보를 포함하고 있습니다.이 데이터에는 각 시설의 청소년시설명칭 정보가 포함되어 있습니다.주소 항목을 통해 시설 위치 및 운영 지역을 확인할 수 있습니다.시설의 건물규모(제곱미터) 정보가 포함되어 공간 규모를 파악할 수 있습니다.규모 항목을 통해 시설 운영 형태 및 규모 현황을 확인할 수 있습니다.정원 정보는 시설 이용 가능 인원 및 수용 규모를 나타냅니다.청소년 복지서비스 제공 현황 및 시설 운영 관리의 기초자료로 활용 가능합니다.
