summary_user: 경기도 내 여성새로일하기센터(새일센터) 등 여성 일자리 지원기관을 센터 한 곳당 한 행으로 담은 목록으로, 시군명, 센터명, 운영 법인·단체명, 전화·팩스번호, 도로명·지번 주소, 우편번호, 위도·경도 좌표가 들어 있다. 경력단절 여성이나 구직자가 '우리 시군에서 가장 가까운 새일센터는 어디이고 연락처는 무엇인가'를 찾을 때, 분석가가 시군별 센터 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 사회복지시설 데이터와는 시군명·시군코드(SIGUN_CD)나 센터명·주소 매칭으로 이어 쓰고 위경도 좌표로 공간 결합한다.
description_portal: 경기도의 여성새로일하기센터 현황입니다. 센터명, 법인단체명, 소재지주소(도로명, 지번), 기관전화번호 등의 정보를 제공합니다.이 데이터는 경기도 내 여성 일자리 지원기관의 운영 현황을 정리한 자료로, 여성의 경제활동 참여 확대를 위한 취업연계 중심 기관(새일센터 등) 정보를 포함하고 있습니다. 주요 항목은 시군명, 센터명, 기관전화번호, 운영 법인 또는 단체명, 도로명 및 지번주소, 우편번호, 위도·경도 좌표(WGS84) 등으로 구성되어 있으며, 각 센터는 여성 구직자 대상 직업상담, 직업훈련, 인턴십 연계, 취업 후 사후관리 등의 고용서비스를 제공합니다. 특히 ‘MICE새일센터’, ‘고양여성새일센터’와 같이 특화 분야에 따라 맞춤형 프로그램 운영이 가능하며, 센터별 위치 정보는 고용 서비스 접근성 분석, 지역별 고용 격차 해소 전략 수립, 일자리 정책 최적화 등에 활용됩니다. 데이터는 여성가족부 및 지자체 고용복지 부서에서 수집한 공공정보이며, 여성의 지속가능한 경제활동 기반 마련에 필요한 정책 자료로 쓰입니다.
