summary_user: 경기도 내 산후조리업체를 사업장 한 곳당 한 행으로 담은 건별 현황으로, 인허가일자·폐업일자·영업상태, 도로명·지번 주소와 위경도, 간호사·간호조무사·영양사 등 직종별 인원, 임산부실·영유아실 면적과 수용 인원, 건물 층수를 포함한다. 우리 시군에 지금 영업 중인 산후조리원이 어디 있고 임산부 정원과 간호 인력이 얼마나 되는지 확인하거나, 조리원이 부족한 지역을 찾는 분석에 쓴다. 실측상 전국 단위 조인 키는 없어 시군 코드(SIGUN_CD)·시군명이나 주소로 매핑하거나 위경도 좌표로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 산후조리업체의 운영 현황과 관련된 정보를 수록하고 있으며, 보건위생 및 산모·신생아 건강관리 정책 수립에 활용될 수 있습니다. 각 사업장의 인허가일자, 폐업일자, 영업상태 등을 통해 해당 업체의 운영 여부를 확인할 수 있고, 도로명 주소 및 우편번호 등의 위치정보가 포함되어 지역별 분포 분석에도 적합합니다. 조리원의 다양한 직종의 인원 수가 항목별로 기록되어 있으며, 각 사업장의 면적, 건물층수 등의 물리적 시설 정보도 함께 제공됩니다. 이 데이터는 산후조리원 서비스 수준 평가, 지역 내 조리원 선택 정보 제공, 정책적 지원 필요지역 도출 등에 유용하게 활용될 수 있습니다.
team:
  dept: AI미래행정과
