summary_user: 사립학교 교직원의 기준소득월액 관련 통계를 재직기간 구간(1~33년)별 행과 학교급(유치원~대학교·특수학교, 법인)·교원/사무직원·성별 열로 나눈 전국 단위 집계표이며, 9,282바이트 크기의 CSV 파일 하나로 제공된다. 연금 정책 연구자나 분석가가 "사학연금 가입자의 재직기간별·학교급별 소득 기준은 어떻게 분포하는가"를 살필 때 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키가 없어, 같은 공단의 다른 직역연금 통계와는 재직기간 구간이나 학교급 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 집계만 담고 있어 지역별·학교별·개인별 소득은 알 수 없다. 필드 이름이 모두 '근무인원수'로 되어 있으므로, 각 값이 금액인지 인원인지 내려받은 파일에서 먼저 확인해야 한다. 공통 조인 키가 없어 다른 데이터와 자동으로 연결되지 않는다.
