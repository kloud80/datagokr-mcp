summary_user: 서귀포시에 있는 노인교실을 한 곳당 한 행으로 담은 시설 목록 파일로, 명칭·운영기관·소재지·설치일자·정원·운영일·프로그램과 위도·경도를 포함한다(CSV 905바이트 규모의 소량 데이터). 주민이나 복지 담당자가 '우리 동네 가까운 노인교실은 어디이고 언제 어떤 프로그램을 운영하나'를 확인하거나, 지역별 노인교실 분포를 지도로 살피는 데 쓴다. 전역 조인 키나 시설코드가 없어 다른 노인복지시설·장기요양기관 데이터와는 시설 이름이나 주소·좌표를 맞춰 붙여야 하고, 시군구 단위 지역 통계와는 서귀포시 기준으로 잇는다.
limits: 사회복지시설 시설코드 같은 공통 식별자가 없어 다른 데이터와 정확히 매칭하려면 이름·주소를 직접 대조해야 한다. 범위가 서귀포시 한 곳뿐이라 제주시나 다른 시군구와 비교하려면 별도 데이터가 필요하다.
