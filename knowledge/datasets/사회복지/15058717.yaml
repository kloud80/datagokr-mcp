summary_user: 경기도 내 아동 공동생활가정을 시설 한 곳당 한 행으로 담으며, 집계년도·시군명·시설명·설치연월일·종사자수·수용아동 정원과 현재원·소재지 주소·위경도를 포함한다. 지자체 담당자나 연구자가 '우리 시군에 공동생활가정이 몇 곳 있고 정원 대비 현재원이 얼마나 찼는가'를 확인하거나 시설 분포와 접근성을 분석하는 데 쓴다. 전역 조인 키는 없어서 시군명이나 시군코드(SIGUN_CD)를 이름·코드로 맞춰 다른 시군 단위 통계와 잇고, 위경도로 지도나 다른 공간 데이터와 겹쳐 본다.
description_portal: 경기도의 아동 공동생활 가정 현황입니다. 시설명, 종사자수, 수용아동정원, 현재원, 소재지주소 등의 정보를 제공합니다.※ 학대피해쉼터는 주소 및 시설전화번호가 비공개처리 됩니다.이 데이터는 경기도 내 아동 공동생활가정의 운영 현황을 담고 있으며, 각 시설의 기본 정보와 수용능력에 대한 자료를 제공합니다. 포함된 항목은 집계년도, 시군명, 시설명, 복지시설전화번호, 설치연월일, 종사자수, 수용아동 정원 및 현재원, 소재지 주소(지번 및 도로명), 우편번호, WGS84 기준 위도·경도 정보입니다. 공동생활가정은 보호가 필요한 아동들이 가정과 유사한 환경에서 생활할 수 있도록 지원하는 소규모 복지시설로, 본 데이터를 통해 지역별 시설 분포, 수용현황, 설치 시점 등을 파악할 수 있습니다. 복지정책 수립, 서비스 접근성 분석, 아동보호체계 강화 등 다양한 행정 및 연구 목적으로 활용될 수 있습니다.
