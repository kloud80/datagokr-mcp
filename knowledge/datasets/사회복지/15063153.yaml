summary_user: 아이돌봄 지원 대상 판정을 위해 기준년도별로 판정등급, 중위소득 대비 소득기준, 가구원수에 따른 월평균 소득기준금액(천원)을 담은 전국 단위 기준표로, 541바이트 크기의 작은 CSV 파일이다. 아이돌봄 서비스를 신청하려는 가구가 '우리 가구원 수와 월소득이면 어느 판정등급에 해당하나'를 확인하거나, 분석가가 등급별 지원 대상 소득 구간을 정리할 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 가구원수·기준년도 값을 맞춰 다른 소득·가구 통계와 대조하는 방식으로만 연결한다.
description_portal: '"여성 가족부 아이돌봄 지원을 위한 가구별 소득 기준 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 기준연도, 판정등급, 소득기준(중위소득), 가구원수, 소득기준금액(월평군 소득 천원)의 내용을 확인할 수 있습니다.아이돌봄 지원 대상자의 자격 심사 및 정책 수혜 대상을 명확히 설정하는데 필수적이 데이터이며, 가구원 수에 따른 소득 구간이 구체적으로 제시되어 있어, 서비스 신청자의 적격 여부를 신속히 판단할 수 있습니다. 정책 수립 시 지원의 형평성을 확보하고, 소득 분포에 따른 서비스 수요 에측에도 활용 가능합니다. 정부지원 기준의 명확성 확보와 대상자 맞춤 지원 정책 마련에 활용될 수 있습니다."'
