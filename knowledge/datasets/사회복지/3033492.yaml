summary_user: 보성군 관내 등록 장애인 수를 장애유형별로 합계와 장애 정도(심한 장애·심하지 않은 장애)로 나눠 담은 집계표로, 파일 크기가 282바이트인 작은 CSV입니다. 보성군 복지 담당자나 분석가가 '군내 등록 장애인 중 어떤 장애유형이 많고, 그중 심한 장애 비율은 얼마인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 시군구 장애인 등록현황이나 급여 통계와는 장애유형 이름을 맞추는 방식으로만 연결한다.
description_portal: 본 데이터는 전라남도 보성군 관내 장애인 등록 현황을 정리한 자료이다. 주요 항목으로 장애 유형별 등록 인원, 성별 및 연령대별 분포 등이 포함되며, 지역 내 장애인 복지 정책 수립 및 사회보장 서비스 제공을 위한 기초자료로 활용된다. 해당 자료는 장애인 지원 정책의 실효성을 평가하고, 복지 서비스의 접근성을 개선하는 데 기여한다. 또한, 장애인 등록 현황을 분석하여 지역 내 장애인 인구의 특성을 파악하고, 맞춤형 복지 정책 수립을 지원한다. 본 데이터는 장애인 복지 행정의 투명성을 높이고, 장애인 지원 사업의 효율성을 증대하는 데 도움을 준다. 정기적으로 갱신되어 최신 정보를 제공하며, 장애인 복지 관련 기관 및 연구자들이 필요한 정보를 쉽게 확인할 수 있도록 제공된다.
