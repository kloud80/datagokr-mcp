summary_user: 국민연금 사업장가입자 수를 기준소득월액 구간별로 집계한 전국 단위 통계로, 포털 설명상 2020년 8월 한 달치 분포를 명 단위로 담은 작은 파일(약 236바이트 CSV)이다. 분석가가 '직장 가입자의 신고 소득은 어느 구간에 몰려 있나'처럼 사업장가입자의 소득 분포를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없고 기준년월만 있으므로, 같은 기관의 다른 국민연금 통계와 연월·소득구간 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
limits: 전국 집계라 지역·업종·사업장별로 나눠 볼 수 없고, 사업자번호가 없어 개별 사업장 원장이나 기업 데이터와 직접 연결되지 않는다. 포털 설명상 2020년 8월 한 시점만 담고 있어 시계열 추이 분석에는 맞지 않는다.
