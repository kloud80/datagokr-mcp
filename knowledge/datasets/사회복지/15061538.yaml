summary_user: 경기도여성가족재단이 관리하는 성인지통계 지표의 목록으로, 지표 하나당 분야·영역·통계파일명·지표명·통계유형·갱신시기(updt_lperd)를 한 행으로 담은 메타데이터이며 통계값 자체는 들어 있지 않습니다. 분석가나 정책 담당자가 '경기도 양육수당 지원이나 해바라기센터 운영실적 통계가 있는지, 마지막 갱신은 언제인지'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지표명·통계파일명 같은 이름으로 맞추거나 같은 기관 자료끼리만 연결하고, 실제 수치는 재단 홈페이지의 해당 통계파일에서 찾는다.
description_portal: '이 데이터는 경기도여성가족재단에서 관리하는 통계지표 목록으로, 각 지표는 분야명, 영역명, 통계파일명, 통계지표명, 통계유형, 갱신시기 등의 항목으로 구성되어 있습니다. 주요 통계 분야는 인구, 건강, 아동돌봄, 안전 및 환경 등으로 나뉘며, 예를 들어 다문화 인구, 의료 서비스 이용, 양육수당 지원, 해바라기센터 운영실적 등의 다양한 사회지표를 포함합니다. 이 데이터는 성평등 관점에서의 정책 평가와 사회변화 분석을 위한 기초자료로 활용될 수 있으며, 각 통계의 최신 갱신시기를 확인할 수 있어 통계자료의 시의성도 확보되어 있습니다. 다양한 사회문제를 체계적으로 분석하고 통계 기반 정책 수립의 토대를 마련하는 데 유용한 자료입니다.경기도여성가족재단 홈페이지에서 각 목록에 해당하는 통계지표 자료를 확인할 수 있습니다.※ 경기도여성가족재단 성인지통계 : https://www.gwff.kr/base/contents/view?contentsNo=74&menuLevel=3&menuNo=70'
