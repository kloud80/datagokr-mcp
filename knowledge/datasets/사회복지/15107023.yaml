description_portal: 경기도 수원시 국민기초생활보장수급자현황 자료로써 읍면동별, 수급자격별, 연령구간별로 수급자수 데이터를 제공합니다. 데이터를 활용하여 특정 동에 수급자 비율이 높은 곳에 시설이나 지원이 부족한 현상을 인지할 수 있고, 지역별 복지 인프라 확충의 근거로 활용할 수 있습니다. 해마다 변화하는 인원 수와 비교해 복지정책 효과로 평가할 근거로 활용할 수 있고, 경기불황, 물가상승, 고용상황 등 사회경제 변화가 지역별로 어떤 영향을 미치고 있는지 연구하는데에 활용할 수 있습니다. 시민들이 지역의 복지 현황을 객관적으로 이해하면서 사회적 연대감을 강화할 수 있습니다.
