description_portal: 전라남도 함평군은 각종 재난 및 긴급 상황 발생 시 주민의 신속한 대피와 안전한 임시 거주를 지원하기 위해 이재민수용시설 지정현황 정보를 공공데이터로 제공하고 있습니다. 본 자료는 재해 시 대피소로 활용 가능한 시설에 대한 정보를 포함하고 있으며, 시설명, 상세시설명, 상세주소, 위도, 경도 등 위치정보를 비롯해, 수용가능 면적(㎡), 수용가능 인원(명), 대표전화, 내진설계 여부 등의 항목으로 구성되어 있습니다. 해당 데이터는 재난대응 계획 수립, 대피소 분포 및 수용 능력 분석, 신속한 재해대응 체계 구축 등에 활용될 수 있으며, 주민 안내 지도, 긴급 상황 시 행정기관·구호기관의 대응 효율성 향상, 민간 재난안전플랫폼 구축 등 다양한 분야에서 실질적인 활용이 가능한 공공자원입니다.
