summary_user: 한국건강가정진흥원 온라인교육플랫폼에서 제공하는 교육과정을 과정 1건당 1행으로 담은 목록으로, 과정아이디·과정명·작성일자·과정키워드가 들어 있으며 전국 단위의 비공간 데이터입니다(CSV 약 85KB). 가족 관련 교육 기획자나 분석가가 "양성교육·보수교육·통번역인력 과정이 연도별로 얼마나 개설됐고 주제 키워드는 어떻게 바뀌었나" 같은 질문에 쓴다. 과정아이디(hfi_lms_course_id)를 키로 같은 플랫폼의 수강·이수 등 다른 교육 데이터와 잇고, 별도 코드표는 없다.
description_portal: 한국건강가정진흥원 온라인교육플랫폼 교육과정정보 데이터는 온라인교육플랫폼에서 제공하는 교육과정에 대한 정보로, 과정아이디, 과정명, 작성일자, 과정키워드를 포함합니다. 이 데이터는 과정별 개설 목적과 교육유형을 파악하고 분야별 수요와 운영 흐름을 분석하여 향후 과정 기획과 교육서비스 개선에 활용될 수 있습니다. 또한 키워드 기반으로 교육 주제의 변화 양상을 파악하고 연도별 개설 경향을 비교함으로써 기관의 핵심사업과 연계된 온라인교육 운영전략 수립에도 활용될 수 있습니다. 더불어 과정명에 드러나는 양성교육, 보수교육, 통번역인력 등 주요 교육영역의 비중을 분석하여 정책수립의 근거자료로 활용할 수 있으며, 교육 운영성과 평가와 향후 우선순위 도출에도 참고자료로 사용할 수 있습니다.
