description_portal: '해당 데이터는 재난 발생 시 주민 보호를 위한 지역 수용 능력을 평가하는 기초 자료입니다. 제공 항목은 시설명, 시설 유형 구분(예: 체육관, 경로당 등), 소재지(도로명 주소), 수용 가능 인원(명), 내진 설계 여부 등으로 구성되어 있으며, 각 시설의 위치와 수용 규모, 안전 설계 정보를 명확히 알 수 있습니다. 지자체는 이 데이터를 통해 재난 대응 계획 수립, 대피소 지정, 비상 시 수용 능력 분석에 활용할 수 있습니다. 또한 시민과 지역 단체는 해당 정보를 통해 가까운 대피소 위치와 수용 상태를 사전 확인하고, 재난 대비 의식을 강화할 수 있습니다. 정기적으로 갱신되는 최신 데이터는 재난관리 시스템의 신뢰성과 실효성을 높이고, 지역 주민의 안전을 보장하는 중요한 공공 관리 자원입니다.'
