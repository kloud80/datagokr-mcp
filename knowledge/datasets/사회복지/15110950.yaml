summary_user: 인천 부평구가 지급하는 출산장려금을 연도별로 첫째아부터 다섯째 이상까지 출생 순위별 금액으로 정리한 집계표로, 포털 설명상 2009~2025년을 담은 1,315바이트 규모의 CSV 파일입니다. 부평구에서 아이를 낳으려는 가구가 몇째 아이에 얼마를 받는지, 그리고 분석가가 해마다 지원금이 어떻게 바뀌었는지를 확인하는 데 씁니다. 전역 조인 키가 없어서 다른 지자체 출산지원금 데이터와 비교하려면 연도와 출생 순위를 기준으로 사람이 직접 맞춰야 하며, 광역·기초 중복 가능 여부(중복가능(광역기초))를 함께 보고 인천시 지원과 겹쳐 받는지 판단합니다.
limits: 시군구코드 같은 전역 조인 키가 없어 다른 지역 데이터와 자동으로 연결되지 않고, 기관명이나 이름 매핑으로만 이을 수 있습니다. 부평구 한 곳의 지원 기준 금액표일 뿐 실제 지급 건수나 수혜자 수는 담지 않습니다.
