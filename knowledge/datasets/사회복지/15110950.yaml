description_portal: '이 데이터는 2009년부터 2025년까지의 기간 동안 각 연도별로 첫째아, 둘째아, 셋째아, 넷째아, 다섯째 이상 자녀를 기준으로 지급되는 출산장려금액을 기록한 데이터입니다. 각 자녀에 대한 출산장려금이 다르게 설정되어 있으며, 중복 가능 여부와 시/군 지원 비율이 포함되어 있어, 정책별 지원 혜택을 비교하고 분석하는 데 유용합니다.주요 항목 설명연도 (Year): 2009년부터 2025년까지의 연도별로 제공됩니다. 각 연도별로 출산장려금이 어떻게 변화했는지에 대한 정보를 제공합니다.첫째아 (First child): 첫 번째 자녀에게 지급되는 출산장려금액을 나타냅니다. 둘째아 (Second child): 둘째 자녀에 대한 출산장려금액을 나타냅니다. 셋째아 (Third child): 셋째 자녀에 대해 지급되는 출산장려금액을 나타냅니다. 넷째아 (Fourth child): 넷째 자녀에게 지급되는 출산장려금액을 나타냅니다. 다섯째 이상 (Fifth child and beyond): 다섯 번째 자녀 이상에 대해 지급되는 출산장려금액을 나타냅니다. 출산장려금액 (Amount of Childbirth Incentive): 각 자녀별로 지급되는 실제 출산장려금액을 금액으로 표시한 항목입니다.중복 가능 여부 (Possibility of Duplication): 동일 가구에서 여러 자녀가 출산장려금을 동시에 받을 수 있는지 여부를 나타냅니다. 시/군 지원 비율 (Regional Support Rate): 각 시 또는 군에서 출산장려금의 지원 비율을 나타냅니다.'
