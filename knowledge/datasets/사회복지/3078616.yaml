summary_user: 인천 부평구 안의 아동복지시설을 한 곳씩 담은 시설별 원천 목록으로, 시설 유형(지역아동센터·그룹홈 등), 시설명, 관할 행정동, 주소, 연락처, 정원을 담는다. 구민이나 복지 담당자가 '우리 동에 어떤 아동복지시설이 있고 수용 가능한 정원은 얼마인가'를 확인하거나, 동별 시설 분포와 수용능력을 비교하는 데 쓴다. 전역 조인 키는 없어서, 다른 사회복지시설 목록과는 시설명·주소로 맞추거나 관할동 이름을 기준으로 동별 아동 인구 등 행정동 단위 자료와 이어 쓴다.
description_portal: '아동복지시설의 구분, 명칭, 관할 행정동, 주소, 정원 및 연락처를 포함한 현황 자료.지역 아동을 위한 보호·교육·상담 등의 서비스를 제공하는 시설 분포 및 수용능력을 파악할 수 있으며, 복지정책 수립, 시설 확충 및 관리계획 수립 등에 활용됨.활용 목적 및 특징– 시설 유형 및 관할동 기반 아동복지시설의 공간 분포 진단– 시설별 정원 정보로 수용가능 아동 규모 및 서비스 적정성 분석 가능– 아동복지 사각지대 해소를 위한 시설 배치 전략 수립– 운영 실태 점검 및 돌봄 수요 예측을 위한 기초자료 제공주요 항목 설명● 연번: 각 시설 항목에 부여된 고유번호● 구분: 시설 유형(지역아동센터, 그룹홈 등)● 시설명: 해당 아동복지시설의 명칭● 관할동: 시설이 속한 행정동● 주소: 시설의 소재지(도로명 또는 지번 주소)● 연락처: 시설 대표 전화번호● 정원: 해당 시설에서 수용 가능한 아동의 최대 인원 수'
