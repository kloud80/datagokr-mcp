description_portal: 한국사회보장정보원에서 제공하는 사회보장정보시스템(행복e음)에 등록된 등록장애인의 장애인 자녀교육비 급여 또는 서비스의 지급 건수를 월별, 지역별, 지원구분별로 집계한 통계데이터입니다.데이터 구성은 통계연월, 통계시도명, 통계시군구명, 지원구분, 지급건수로 구성되어 있습니다.이 데이터를 활용하여 장애인자녀교육비 지급이 활발한 지역 및 지급분야에 대한 통계적 측면의 분석이 가능합니다.장애인 관련 공공데이터는 장애인의 삶의 질, 복지 서비스 접근성, 정책 수혜 실태, 지역 격차 등을 분석하는 데 매우 유용합니다.1. 장애인 인구 현황 분석- 지역별 장애인 등록 인구 분포- 성별, 연령별, 장애 유형별 분포- 전체 인구 대비 장애인 비율2. 지역별 서비스 접근성 분석- 지역별 장애인 복지시설 수 (주간보호센터, 재활시설 등)- 장애인 편의시설(엘리베이터, 경사로 등) 분포- 장애인 콜택시·교통수단 지원 현황3. 장애인 복지 수급 현황 분석- 장애인 연금, 수당, 활동지원급여 등 수급자 수 및 금액- 중복 수급자 현황- 생계급여·기초생활보장과의 연계4. 장애인 고용 및 경제활동 분석- 장애인 고용률, 취업자 수, 고용 형태- 장애인 의무고용 미이행 기관 수- 자활센터, 보호작업장 등 연계 실태
