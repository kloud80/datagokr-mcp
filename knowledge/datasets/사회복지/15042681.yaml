summary_user: 부산광역시에 설치·운영 중인 여성폭력 피해자 상담소를 시설 한 곳당 한 행으로 담은 목록 파일(csv, 약 1.3KB)로, 구분·시설명·소재지·위도·경도·전화번호를 제공한다. 피해자나 주변인이 '부산에서 가정폭력·스토킹·교제폭력 상담을 받을 수 있는 곳과 연락처는 어디인가'를 찾거나, 분석가가 상담소의 지역 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 다른 사회복지시설 목록과는 시설명·주소를 맞추거나 위도·경도로 공간 결합해서 이어 쓴다.
description_portal: 본 데이터는 부산광역시에 설치·운영 중인 여성폭력 피해자 상담소 현황으로, 시설명, 소재지, 전화번호 등 기본 정보를 제공합니다. 상담소는 「가정폭력방지 및 피해자보호 등에 관한 법률」 제5조 및 제14조에 근거하여 운영되며, 가정폭력·스토킹·교제폭력 피해에 대한 신고 접수와 상담을 수행합니다. 또한 피해자와 동반가족의 임시 보호, 의료기관·보호시설 연계, 행위자 고발 등 법률 자문 지원을 담당하고, 폭력 예방을 위한 교육·홍보 활동도 병행하고 있습니다. 이 데이터는 피해자 지원 접근성 제고와 정책·연구 활용을 위해 공공데이터로 제공됩니다.
