summary_user: 부산광역시 안의 육아종합지원센터를 센터 한 곳당 한 행으로 담은 현황 파일로, 센터명·도로명주소·연락처·홈페이지·데이터기준일자를 담는다(csv 약 1.8KB의 작은 목록). 영유아를 키우는 부산 시민이 '우리 동네 가까운 육아종합지원센터는 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시내 육아지원 거점의 분포를 볼 때 쓴다. 전역 조인 키가 없어 어린이집 기본정보 등 다른 보육 데이터와는 센터명이나 주소 문자열을 맞춰서만 이어 쓴다.
limits: 어린이집코드 같은 공통 식별자나 좌표 컬럼이 없어 다른 데이터와 자동 결합이 어렵고, 지도에 올리려면 주소를 따로 좌표로 바꿔야 한다. 부산광역시 범위만 담으며, 센터별 프로그램·이용 조건은 없어 각 센터 홈페이지를 확인해야 한다.
