summary_user: 한국노인인력개발원이 운영하는 노인일자리 사업 담당 직원 교육과정의 기본 정보를 과정 단위로 담은 전국 범위 파일(csv 약 9.9MB)로, 교육과정명·과정번호·대면 여부·과정 구분·사업유형·사용 여부·등록·수정일시를 포함한다. 노인일자리 수행기관 담당자나 교육 기획자가 "사업유형별로 어떤 직원 교육과정이 대면·비대면으로 운영되고 현재 쓰이는 과정은 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교육과정번호·과정명 같은 이름·코드 매핑이나 같은 기관 데이터끼리만 연결한다.
