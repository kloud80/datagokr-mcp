description_portal: 통영시 관내 지역아동센터 12개소에 대하여 구분(공공, 민간), 시설명, 전화번호, 정원, 소재지도로명주소 대한 정보를 제공합니다지역아동센터는 다자녀, 다문화, 한부모, 기초생활수급자, 장애인, 맞벌이 가족 등 돌봄 취약계층의 아동 방과후 돌봄 중심시설로,이용 연령은 초등학생~중학생 입소가능하며, 이용금액은 무료입니다.입소문의는 붙임파일의 시설 연락처 참고하시기 바랍니다.현재 통영시 지역아동센터 12개소 중 아동 19인 미만 시설 9개소, 29인 미만 시설 3개소이며,통영시 광도면 4개소(죽림 2, 안정2), 용남면 1개소, 무전동 1개소, 정량동 2개소, 봉평동 2개소, 미수동 2개소 시설 위치하고 있습니다.
