description_portal: '보건복지부에서 전국에 있는 아동 복지 시설 현황(시설명, 주소) 정보를 제공하고 있습니다.<통계데이터 이용 시 참고사항>1. 아동복지시설 목적 : 보호대상아동을 건전한 사회인으로 자랄 수 있도록 보호조치하기 전 일시보호하거나 가정복귀, 입양, 가정위탁이 어려운 아동을 보호 및 양육2. 아동복지 시설종류 = 생활시설(아동양육시설, 아동일시보호시설, 아동보호치료시설, 자립지원시설, 공동생활가정-아동그룹홈, 학대피해아동쉼터), 이용시설(아동상담소, 아동전용시설, 지역아동센터), 기타(아동보호전문기관, 가정위탁지원센터, 아동권리보장원, 자립지원전담기관)'
