description_portal: '공무원연금공단에서 관리하는 지역별 재난종류(화재, 풍수해)별로 집계한 재난부조금 지급 데이터 현황으로, 1983년부터 기준년도까지의 정보를 제공하고 있습니다.재난부조금이란 공무원이 수재나 화재, 그 밖의 재난으로 재산에 손해를 입었을 때 재난 정도에 따라 국가나 지방자치단체가 부조적 차원에서 지급하는 급여이며,특정 지역에서 발생하는 재난 발생 유형 및 특성을 분석하여 재난예방대책, 부조급여 개선 등 정책 수립에 활용할 수 있습니다.지역 : 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주(광역자치단체 기준)* 풍수해에는 화재를 제외한 호우, 지진 등 기타 재난 포함'
