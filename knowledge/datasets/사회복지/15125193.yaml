summary_user: 청소년 상담에서 집계된 성 문제 현황을 청소년 상태별로 나눈 전국 단위 통계표로, 제목·구분·X축·Y축 항목과 그 교차값(chtVl)을 행으로 담는 집계 데이터다. 상담 정책 담당자나 성교육 기획자가 '학생·학교밖 청소년 등 상태에 따라 상담에서 드러나는 성 관련 고민 유형이 어떻게 다른가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 항목 이름을 맞추거나 같은 기관의 다른 상담 통계와 나란히 놓는 방식으로만 잇는다.
description_portal: 청소년 상담 청소년 상태별 성 문제 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.청소년 상태별 성 문제 현황을 제공하는 이 데이터는 성 관련 고민이나 부적절한 행동에 대한 통계를 제시하여 실태를 가늠하게 합니다. 성에 대한 인식 부족, 성적 피해, 성적 충동 등 다양한 원인을 세분화해 대응방안을 설계하는 데 기여합니다. 학교 성교육 콘텐츠 보완이나 전문 상담 인력 배치 기준 마련에도 참고할 수 있으며, 건전한 성 가치관 형성을 위한 교육 정책 수립에 활용될 수 있습니다.
