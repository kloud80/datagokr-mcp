summary_user: 경기도 시군별 드림스타트 사업 현황을 집계 연도(sum_yr) 단위로 담은 집계 자료로, 시군명·사업지역 정보·지정 연도·센터 개소일·사업비 항목을 포함한다. 복지 담당자나 분석가가 경기도 시군마다 드림스타트 센터가 언제 지정·개소됐고 사업비가 얼마나 차이 나는지 비교하는 데 쓴다. 전역 조인 키가 없어 다른 취약계층·아동 통계와는 시군명(sigun_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 취약계층 아동을 대상으로 하는 드림스타트 사업 현황을 정리한 자료입니다. 이를 통해 아동의 발달 지원, 복지 서비스 제공 현황, 지역별 차이 등을 파악할 수 있습니다. 지역별 수혜 규모나 지원 방식의 차이를 비교·분석할 수 있는 근거 자료로 활용됩니다.※드림스타드란 취약계층 아동에게 맞춤형 통합서비스를 제공하여 아동의 건강한 성장과 발달을 도모하고, 공평한 출발기회를 보장함으로써 건강하고 행복한 사회구성원으로 성장할 수 있도록 보건복지부 및 시도, 시군에서 추진하는 사업입니다.
