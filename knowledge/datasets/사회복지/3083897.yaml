summary_user: 경상북도 내 지역아동센터를 시설 한 곳당 한 행으로 담은 파일로, 시군명·시설유형·시설명·운영주체·소재지·연락처와 종사자수, 일일평균 이용자 수를 포함한다. 학부모가 우리 시군의 가까운 지역아동센터와 연락처를 찾거나, 분석가가 시군별 센터 수와 이용자 규모를 비교해 돌봄 인프라 격차를 살피는 데 쓴다. 전역 조인 키는 없어 시군명이나 시설명·주소로 다른 사회복지시설 목록, 시군 단위 아동 인구 통계와 이름 매칭으로 잇는다.
