summary_user: 울산광역시 관내 여성폭력 피해자 보호시설을 시설 한 곳당 한 행으로 정리한 목록으로, 분류·구분·시설명·시설장·소재지·설립일시·규모·정원을 담으며 파일 크기가 469바이트에 불과한 소규모 현황표다. 정책 담당자나 분석가가 울산에 가정폭력·성폭력 피해자 보호시설이 어떤 유형으로 몇 곳 있고 정원이 얼마인지 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명이나 같은 기관 기준으로만 맞춰 붙일 수 있으며, 사회복지시설 공통 마스터를 참조하는 보조 자료로 다룬다.
description_portal: 본 데이터는 관내 여성 폭력 피해자 보호시설의 현황 정보이다. 시설별 명칭, 소재지, 연락처, 수용 인원, 제공 서비스 등의 세부 내용을 포함한다. 여성 폭력 피해자 보호시설은 가정폭력, 성폭력 등의 피해를 입은 여성에게 안전한 주거 공간과 심리 치료, 법률 지원 등을 제공하는 복지 시설이다. 해당 자료는 여성 폭력 예방 정책 수립, 피해자 보호 체계 강화, 보호시설 확충 계획에 활용된다. 피해 여성에게 안전한 임시 거주지를 제공하고 심리 상담을 통해 정신적 외상을 치유한다. 또한 법률 상담 및 소송 지원을 통해 피해자의 권리를 보호하고 자립 기반 마련을 돕는다. 긴급 상황 발생 시 신속한 보호 조치를 취할 수 있도록 24시간 운영 체계를 유지하며, 폭력 없는 안전한 사회 조성에 기여한다.
