summary_user: 공무원연금 퇴직연금 수급자 수를 재직기간 구간(20년 미만~33년 이상)과 성별로 나누고, 17개 시도를 열로 펼쳐 담은 집계표다(전국 범위, 약 2.6KB CSV 한 개). 재직기간이 긴 퇴직 공무원이 어느 시도에 많이 사는지, 단기재직 후 연금을 받는 비중이 두드러진 지역이 있는지를 보려는 연금·인력 분석가가 쓴다. 전역 조인 키는 없어서 시도 이름을 행정구역 코드에 직접 매핑해야 지역별 인구·고령자 통계 같은 다른 시도 단위 자료와 이어 쓸 수 있다.
description_portal: 공무원연금공단에서 관리하는 지역별·재직년수별·성별 퇴직연금수급자 현황 데이터입니다. 본 자료는 수급자의 재직기간(20년 미만부터 33년 이상까지)과 지역(서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주)을 기준으로 남성과 여성 퇴직연금 수급자 수를 구분하여 제공합니다. 해당 데이터는 지역별 퇴직연금 수급자의 분포, 장기재직자 및 단기재직자의 집중 현황을 파악할 수 있어, 지역별 인력구조 특성 진단 등에 활용됩니다. 특히 특정 지역에 장기재직 후 퇴직한 수급자 비중이 높은지, 단기재직 후 퇴직연금 수급 비율이 두드러지는 지역 특성이 있는지 등을 분석할 수 있습니다
