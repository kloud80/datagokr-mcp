summary_user: 경상북도 청도군 관내에 설치·운영 중인 경로당을 한 곳당 한 행으로 담은 시설 목록으로, 소재 읍·면, 시설명, 소재지 주소, 전화번호를 담는다. 청도군 주민이나 복지 담당자가 '우리 읍·면에 어떤 경로당이 있고 연락처는 무엇인가'를 확인하거나 읍·면별 경로당 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 노인복지시설·지역 통계 데이터와는 읍면 이름이나 주소 문자열을 매핑해 이어야 한다.
description_portal: 2022년 7월 말 기준으로 경상북도 청도군 관내에 설치·운영 중인 경로당에 대한 현황 정보를 제공합니다.이 자료는 청도군에 거주하는 어르신들의 여가, 휴식, 소통, 복지활동 공간으로 활용되는 경로당의 분포 및 기본 현황을 파악하기 위한 기초 자료로, 연번, 소재 읍·면, 경로당 명칭(시설명), 정확한 소재지 주소, 전화번호 등의 항목으로 구성되어 있습니다. 경로당은 고령 인구가 많은 농촌 지역의 사회적 연결망으로서 매우 중요한 역할을 하고 있으며, 노인복지 증진, 건강증진 프로그램 운영, 긴급 재난 시 대피 및 보호 공간 등 다양한 행정 목적에 따라 관리되고 있습니다.
