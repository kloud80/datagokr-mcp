summary_user: 인천광역시 서구(서해구)에 있는 여성복지시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·구분(시설 유형)·주소·면적·종사자수·설립일자·전화번호를 담는다(파일 크기 616바이트의 소규모 목록). 주민이나 상담 실무자가 '서구 안에서 성폭력·가정폭력 상담소나 여성인력개발기관이 어디에 있고 연락처가 무엇인가'를 확인하거나, 분석가가 시설 규모·인력 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 사회복지시설 목록과는 시설명·주소 매칭으로만 이어 쓴다.
