description_portal: 2021년 공공데이터 제공요청에 따라 공무원연금공단에서 1회성으로 제공한 데이터로, 2015년부터 2019년까지 최근 5년간 직종별 공무상요양 신청 및 불승인 건수를 집계한 현황입니다.해당 데이터는 일반직, 교육직, 경찰직, 소방직, 비공무원을 대상으로 각 연도별 공무상요양 신청 건수와 이 중 불승인 처리된 건수를 포함하고 있습니다.공무상요양 신청의 연도별 추이와 처리결과를 직종별로 파악할 수 있으며, 특정 직종의 승인율의 변화를 분석하여 재해 발생 원인 분석 자료 등으로 활용할 수 있습니다.
