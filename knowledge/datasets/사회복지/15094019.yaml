summary_user: 국민연금 사업장가입자 수를 기준년월별로 사업장 규모 구간(5인 미만부터 1000인 이상까지 7개 구간)과 합계로 나눠 담은 전국 단위 집계표이며, 파일 크기가 1천여 바이트로 매우 작다. 분석가나 정책 담당자가 "소규모 사업장과 대기업 사업장에 국민연금 가입자가 각각 얼마나 몰려 있고 연도별로 어떻게 바뀌었나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기준년월과 규모 구간 이름을 맞춰 연결해야 하며, 사업자번호로 기업 데이터와 잇는 사업장 단위 원장(가입 사업장 내역)과 달리 이 표는 그런 연결이 되지 않는다.
description_portal: 해당 데이터는 국민연금공단에 가입된 사업장  가입자수 데이터를 기반으로 만들어졌습니다.연도별 국민연금에 가입된 사업장가입자의 데이터를 나타냅니다.해당 데이터는 사업장의 규모에 따라 분류되어있고 분류기준은 아래와 같습니다.-5인미만, 10인 미만, 50인 미만, 100인 미만, 1,000인 미만, 1,000인 이상으로 세분화되어있습니다.사업장규모별 사업장가입자 수 데이터를 통해 분류된 규모에 따라 가입된 국민연금 사업장가입자 수를 확인할 수 있습니다.(데이터 건수가 많은 경우 모든 데이터가 표출되지 않을 수 있습니다.)+
