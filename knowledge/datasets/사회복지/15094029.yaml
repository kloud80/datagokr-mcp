summary_user: 국민연금 가입자의 평균소득월액을 기준년도별로 연령대(27세 미만부터 60세 이상까지 6구간)와 가입종별(사업장·지역·임의(계속)가입자)로 나눠 담은 전국 단위 집계표로, 파일 크기가 318바이트인 소규모 CSV입니다. 연금 정책 분석가나 연구자가 '20대와 50대 지역가입자의 평균 신고소득은 사업장가입자와 얼마나 차이 나는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 국민연금 가입·급여 통계와는 기준년도와 연령 구간 이름을 맞춰 나란히 놓는 방식으로만 이어 쓴다.
description_portal: '해당 데이터는 국민연금공단 가입자의 데이터를 기반으로 만들어졌습니다.연도별 국민연금 가입자의 평균소득월액 데이터를 나타냅니다.해당 데이터는 가입자의 연령과 가입종별에 따라 분류되어 있고 분류기준은 아래와 같습니다.-연령: 27세 미만,~29세 이하, ~ 39세 이하, ~49세 이하, ~59세 이하, 60세 이상-가입종별: 사업장가입자, 지역가입자, 임의가입자, 임의계속가입자국민연금 가입자의 연령과 가입종별에 따른 국민연금 가입자의 평균소득월액을 확인하실 수 있습니다.(데이터 건수가 많은 경우 모든 데이터가 표출되지 않을 수 있습니다.)국민연금공단의 가입된 국민연금 가입자의 데이터를 기반으로 만들어진국민연금 가입자의 연령별, 가입종별 평균소득월액 입니다.'
