description_portal: 경상북도 관내에서 가정폭력의 예방과 방지, 그리고 피해자에 대한 보호 및 지원 업무를 수행하는 가정폭력상담소의 운영 현황을 제공하는 데이터입니다. 본 자료는 피해자가 신속하게 도움을 요청할 수 있도록 각 상담소의 명칭, 상세 소재지 및 연락처 정보를 핵심적으로 포함하고 있습니다. 또한, 상담 서비스의 전문성과 시설의 쾌적함을 가늠할 수 있는 종사자 수(명)와 시설 규모($m^2$) 통계를 제공하며, 기관의 운영 이력을 확인할 수 있는 설립 연월 정보를 상세히 수록하고 있습니다. 해당 데이터는 지역 사회 안전망 구축과 가정폭력 피해자의 권익 증진 및 회복 지원을 위한 복지 정책 수립의 기초 자료로 활용됩니다.
