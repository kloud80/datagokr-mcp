summary_user: 군산시에 있는 여성폭력(가정폭력·성폭력·스토킹 등) 피해자 상담소를 기관 한 곳당 한 행으로 담은 소규모 목록 파일(438바이트 CSV)로, 구분·기관명·소재지·전화번호·데이터기준일을 담는다. 피해자나 주변인, 지원 실무자가 "군산에서 가정폭력이나 성폭력 상담을 받을 수 있는 곳과 연락처는 어디인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 사회복지시설 목록과는 기관명이나 주소를 맞춰 연결해야 한다.
description_portal: 가정폭력, 성폭력, 데이트폭력, 스토킹 등 다양한 폭력으로 고통받는 피해자분들을 위한 전문 상담소 정보를 안내합니다. 피해 사실에 대한 신속하고 안전한 신고 접수를 돕는 것은 물론, 상처받은 마음을 치유하고 온전한 일상을 되찾을 수 있도록 전문상담을 진행합니다. 모든 상담 내용은 철저하게 비밀이 보장되며, 심리적, 정서적 지지와 함께 피해자의 회복과 자립을 적극적으로 돕습니다. 상처를 치유하고, 존엄성을 회복하며, 건강한 사회 구성원으로 다시 설 수 있도록 실질적이고 다각적인 도움을 드립니다.
