summary_user: 경기도 시군별로 기준년도마다 아이돌보미 활동인원을 시간제·종일제 실활동 인원, 소속 인원, 자격증 소지 인원으로 나눠 담은 집계 자료다. 보육 정책 담당자나 분석가가 '어느 시군에 활동 돌보미가 적어 돌봄 공급이 부족한가'를 연도별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)과 기준년도를 이름으로 맞춰 연결해야 한다.
description_portal: 경기도 내의 아이돌보미 서비스 제공을 위한 활동인원 현황을 시군별로 정리한 자료입니다.  아이돌보미 서비스는 만 12세 이하 아동을 둔 맞벌이 가정 등에 아이돌보미가 직접 방문하여 아동을 안전하게 돌봐주는 아이돌봄 서비스입니다. 주요 항목으로는 기준년도, 시군명, 시간제활동돌보미수, 종일제활동돌보미수, 실활동돌보미수, 소속돌보미수, 자격증소지돌보미수 등이 포함되어 있으며, 각 항목은 아이돌보미의 활동 유형, 소속 여부, 자격증 보유 여부에 따라 세분화되어 있습니다. 이 데이터는 지역별 돌봄 인력 분포를 파악하거나 보육 서비스 수급 현황을 분석하는 데 활용될 수 있습니다. 또한, 돌봄 서비스의 지역별 수요와 공급의 불균형 해소, 돌보미 인력 정책 수립 등의 기초자료로도 유용합니다. 데이터는 연도별로 갱신되며, 특정 시군의 일시적인 변화보다 전반적인 지역 추세 분석에 적합합니다.
