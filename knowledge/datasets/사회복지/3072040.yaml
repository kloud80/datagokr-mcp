summary_user: 대구광역시 서구 관내 여성복지 관련 시설을 시설 한 곳당 한 행으로 담은 소규모 목록 파일(csv 573바이트)로, 시설 구분·시설명·주소·전화번호·비고(지원 내용)를 담는다. 서구 주민이나 상담 실무자가 '서구에서 성폭력 상담이나 한부모·다양한 가족 지원을 받으려면 어느 시설에 연락해야 하나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 시설명·주소 문자열 매칭으로만 이어 쓰며, 사회복지시설 공통 마스터를 참조할 때 보조 자료로 쓴다.
description_portal: 본 데이터는 대구광역시 서구 관내 여성복지 관련 주요 시설의 현황을 수록한 자료이다. 수록 항목은 시설의 구분, 시설명, 주소, 전화번호, 비고 항목으로 구성되어 있으며, 성폭력 피해자를 위한 전문 상담소, 저소득 모자가정을 위한 보호시설, 다양한 가족을 대상으로 하는 복지시설 등으로 분류되어 있다. 각 시설별 주요 지원내용과 상담 가능한 서비스 범위가 포함되어 있어 정책 수립, 복지 자원 연계, 현장 상담 안내 등에 활용이 가능하다. 특히 성폭력상담, 의료비 지원, 피해자 보호, 다양한 가족 대상 통합서비스 등 실질적 서비스 내용을 포함하여 사용자 이해도를 높이고자 하였다. 본 데이터는 복지 수요자 및 관련 기관의 실무 활용에 적합하도록 구성되어 있다.
