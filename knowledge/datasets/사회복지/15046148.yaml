summary_user: 전국 가족센터(다문화가족지원센터)별로 배치된 이중언어코치 인원 수와 코치의 출신국을 센터 단위로 정리한 현황 파일로, 포털 설명상 231개 센터를 담는다. 결혼이민자 가족이나 지원기관이 우리 지역 가족센터에 베트남어·중국어 등 특정 모국어 코치가 있는지 확인하거나, 분석가가 시도별 이중언어 지원 인력 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 시설 데이터와는 지역명·가족센터명을 이름 매핑해 사회복지시설 공통 마스터나 가족센터 목록과 이어 쓴다.
description_portal: 한국건강가정진흥원의 다문화가족 이중언어코치의 지역별 현황 정보를 제공합니다.  데이터의 구성은 번호, 지역, 가족센터명, 이중언어코치 인원 수, 이중언어코치 출신국가 등의 항목으로 총 231개의 센터 정보를 포함합니다. 이중언어코치는 다문화 가족지원센터(가족센터)에 상근하며, 영.유아들이 자연스럽게 한국어+모국어로 소통하도록 이중언어 가족환경 조성을 위한 결혼이민자 전문 인력으로 가정 내 이중언어 사용정악, 부모역량 강화, 자녀 정체성 확립 및 학습 기반 마련을 목적으로 하고 있습니다. 이 데이터는 다문화가족의 언어 지원 정책 수립, 지역별 서비스 제공 계획, 연구 및 분석 등에 활용될 수 있습니다.
