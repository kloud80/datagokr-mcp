summary_user: 경기공유 서비스에 등록된 시설별로 BF(장애물 없는 생활환경) 인증 여부와 출입구 경사로·접근로, 장애인 화장실·승강기·객실·전용주차구역, 시각장애인 안내설비 등 장애인 편의시설 설치 개수를 담은 시설 단위 데이터다. 장애인·교통약자나 보호자가 방문하려는 공유시설에 휠체어 경사로나 장애인 화장실이 있는지 확인하거나, 분석가가 경기도 공유시설의 접근성 수준을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 다른 데이터와는 기관 코드·명칭(up_inst_cd, low_inst_cd), 시설명, 지역코드(region_cd)를 매핑해 연결해야 한다.
description_portal: 경기도에서 제공하는 경기공유장애인시설 데이터는 장애인과 교통약자의 시설 접근성을 확인할 수 있는 정보를 포함하고 있습니다. 데이터는 시설번호, 지역코드, 시설아이디, 사용여부, BF인증여부, 출입구 경사로, 출입구 접근로, 장애인 화장실, 장애인 승강기, 장애인 객실, 장애인 전용주차구역, 장애인 이용가능 출입문, 시각장애인 안내설비 등으로 구성되어 있습니다. 이를 통해 장애인 편의시설이 설치된 정도와 접근성 수준을 객관적으로 파악할 수 있습니다.*BF인증(Barrier Free 인증)은 장애인, 노약자 등 누구나 안전하고 편리하게 이용할 수 있도록 보장하는 인증제도
