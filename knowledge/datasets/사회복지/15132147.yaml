summary_user: 아이돌봄통합지원 설문에 응답한 대상자를 답변자 단위로 담은 건별 데이터로, 조사연도·소속센터·성별·연령·돌봄구분·소득유형·자녀수·취학자녀수·최소자녀연령·평생돌봄시간 등을 전국 범위로 담는다. 정책 분석가가 "소득유형이나 자녀 연령에 따라 아이돌봄 서비스 이용자의 돌봄 시간과 특성이 어떻게 다른가"처럼 대상 집단별 수요 특성을 살피는 데 쓴다. 전역 조인 키는 없고, 소속센터코드(ogdpCntrCd)나 답변자관리번호로 같은 기관의 다른 아이돌봄 데이터와만 이어 쓸 수 있다.
description_portal: 아이돌봄통합지원 설문대상의 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 최소자년연령, 조사연도, 소속센터코드, 답변자관리번호, 설문완료일자, 성별명, 연령, 돌봄구분코드, 소득유형코드, 평생돌봄시간, 등록일자, 자녀수, 취학자녀수 등의 내용을 확인할 수 있습니다.다양한 계층의 서비스 수요 특성을 파악할 수 있습니다. 이러한 정보는 아이돌봄 정책 수립 시 타깃 집단별 맞춤형 서비스를 기획하는 데 기여할 수 있습니다. 또한 취약 계층 선별에 효과적으로 활용될 수 있으며, 수요자 맞춤형 서비스 기획과 정책 타당성 분석에 활용될 수 있습니다.
