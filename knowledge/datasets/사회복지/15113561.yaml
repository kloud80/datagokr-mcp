description_portal: 경기도 남양주시 2025년 7월말 기준  행정동별 기초생활수급자 인구수를 데이터로 제공합니다.(보장별 중복제외)기초생활수급자란 저소득층으로 생계·의료·주거·교육급여를 통해 최저생활을 보장받는 사람을 의미합니다.선정기준은 소득인정액에 따라 생계급여는 기준중위소득의  32%, 의료급여는 기준중위소득의 40%, 주거급여는 기준중위소득의 48%, 교육급여는 기준중위소득의 50% 이하입니다.거주지 읍·면·동 행정복지센터에 연중 신청 가능하며, 통합급여(4종 급여) 또는 개별 신청이 가능합니다.
