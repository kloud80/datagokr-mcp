summary_user: 남양주시의 읍·면·동별 기초생활수급자 수를 담은 집계 파일로, 포털 설명상 2025년 7월말 기준이며 급여 종류 간 중복을 뺀 인원을 읍면동이 열로 나열된 형태(연도 행 × 와부읍~별내동 열)로 담는다. 남양주시 안에서 어느 읍면동에 수급자가 많은지 비교해 복지 인력·시설 배치나 지역 복지정책 대상을 정하려는 분석가·공무원이 쓴다. 전역 조인 키(행정동 코드)가 없어 다른 데이터와는 읍면동 이름을 맞춰 붙이거나 같은 남양주시 데이터와 나란히 놓고 써야 한다.
limits: 행정동 코드가 없어 다른 데이터와 붙일 때 읍면동 이름 매핑이 필요하다. 수급자 인원 집계뿐이라 급여 종류별·가구별 구분은 이 파일로 볼 수 없다.
