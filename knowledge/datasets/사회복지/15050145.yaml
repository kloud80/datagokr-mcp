summary_user: 노인일자리 사업별 심사 현황을 사업번호·사업계획변경순번 단위의 건별 기록으로 담으며, 사업유형(공익활동형·사회서비스형·시장형·인력파견형 등), 사업년도, 사업명, 심사 상태와 단계, 최초 심의일·심의 요청일·심의 종료일을 포함한 전국 범위의 CSV 파일(약 1.2MB)이다. 정책 담당자나 분석가가 '사업유형별로 심의 요청부터 종료까지 얼마나 걸리고 승인까지 몇 단계를 거치는가'처럼 노인일자리 사업의 행정 심사 절차와 처리 기간을 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명 같은 이름 매칭이나 같은 기관(한국노인인력개발원) 내부 코드로만 이어 쓸 수 있다.
