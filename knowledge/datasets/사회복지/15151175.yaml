description_portal: 본 데이터는 사립학교교직원연금법령에 의거 교직원의 기준소득월액을 소득신고 자료 없이 공단에서 직원으로 결정하여 적용하는 현황을 제공하고 있습니다. 이는 정해진 기한 내에 소득 관련 자료를 제출하지 않은 교직원 또는 학교에 대해 연금 급여 산정의 기초가 되는 기준소득월액을 공단이 자체적으로 정한 기준에 따라 결정함으로써 연금제도 운영의 안정성과 형평성을 확보하기 위한 것입니다. 데이터는 기준연월별 학교급, 건수 등 관련 정보를 포함하고 있습니다. 이를 통해 공단은 연금보험료 부과 및 연금 급여 산정의 정확성을 기하고 있으며 관련 통계 및 정책 수립에 필요한 기초 자료로 활용할 수 있습니다.
