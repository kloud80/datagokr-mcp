description_portal: 이 데이터는 근로복지공단이 30인 이하 사업장에 최적화하여 제공하는 확정기여형(DC) 및 개인형퇴직연금(IRP) 제도의 적립금 규모와 운용 수익률을 집계한 통계 자료입니다. 확정급여형(DB)을 제외한 상품 유형별(원리금보장/비보장)로 구분하여 당해 연도 및 장기적(3년, 5년, 7년, 10년) 수익률 정보를 제공합니다. 이 자료는 소규모 사업장 근로자들의 노후 자산 형성 규모와 공공 부문 퇴직연금 제도의 운용 성과를 투명하게 보여주는 핵심 지표입니다.본 데이터는 공공 퇴직연금 시스템의 효율성과 재정 안정성을 평가하는 데 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 원리금보장 상품과 비보장 상품 간의 운용 성과 차이를 분석하고, 소규모 사업장 근로자들의 노후 소득 보장을 강화하기 위한 투자 옵션 및 교육 방안을 개선할 수 있습니다. 또한, 장기 수익률 추이를 분석하여 금융 시장 변동성이 공공 퇴직연금 재정에 미치는 영향을 예측하고, 제도의 지속 가능성을 높이는 전략을 수립하는 데 기여할 수 있다고 판단됩니다.
