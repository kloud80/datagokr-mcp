summary_user: 공무원연금공단 연금콜센터(현 공무원연금고객센터)에 접수된 상담을 2017~2022년 연도별로 상담유형(연금수급자·재직관리·퇴직급여·재해보상 등)·상담분류·상담세분류에 따라 건수로 집계한 전국 단위 통계 파일이다. 공단 민원 담당자나 분석가가 '퇴직급여나 재해보상 관련 상담이 해마다 얼마나 늘거나 줄었는가'를 확인해 상담 시스템 개선이나 수요 파악에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 상담유형 이름을 맞추는 방식으로만 연결하며, 2023년 이후 분은 같은 기관의 '고객센터 월별 상담내역' 데이터와 이어 본다.
limits: 연도별 전국 집계라 개별 상담 건이나 지역별 분포는 알 수 없고, 조인 키가 없어 다른 연금 통계와 직접 결합할 수 없다. 2017~2022년까지만 담고 이후는 별도 데이터로 개편되어 분류 체계가 다를 수 있다.
