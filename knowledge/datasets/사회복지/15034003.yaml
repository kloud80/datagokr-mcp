description_portal: 공무원연금공단에서 운영하는 연금콜센터(現 공무원연금고객센터)를 통해 접수된 상담내용을 연도별로 2017년부터 2022년까지 집계한 통계자료입니다.연도별 상담유형(연금수급자, 재직관리, 퇴직급여, 재해보상 등), 상담분류, 상담세분류, 상담건수 등의 데이터를 제공하고 있습니다.공단에서 운영하는 사업분야에 따라 세분화되어 상담건수를 제공하고 있으며, 민원상담 시스템 개선에 활용할 수 있습니다.2023년부터 "고객센터 월별 상담내역" 데이터로 개방형태를 개편하여 제공하고 있습니다.
