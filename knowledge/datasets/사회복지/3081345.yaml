description_portal: '부산광역시 서구의 사회적 약자를 위한 사회복지시설(사회복지사업법 제2조에 따른 *사회복지사업을 할 목적으로 설치된 시설)에 대한 데이터를 제공합니다.* 사회복지사업이란 다음 각 목의 법률에 따른 보호, 선도 또는 복지에 관한 사업과 사회복지상담, 직업지원, 무료숙박, 지역사회복지, 의료복지, 재가복지, 사회복지관 운영, 정신질환자 및 한센병력자의 사회복귀에 관한 사업 등 각종 복지사업과 관련된 자원봉사자활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업을 말합니다.데이터항목(컬럼) 정보: 시도(시도명), 시군구(시군구명), 시설명(시설의 명칭), 시설종류(시설의 종류), 운영주체구분(법인/개인 구분), 종사자 수(시설 종사자 수), 입소정원수(생활시설의 입소정원 수), 입소인원수(생활시설의 입소인원 수), 입소아동수(생활시설의 입소아동 수), 주소(시설의 주소), 전화번호(시설의 연락처) 등으로 구성된 데이터입니다.'
