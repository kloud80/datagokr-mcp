summary_user: 부산광역시 연제구 관내 어린이집 안팎에 설치된 어린이 놀이시설을 시설 한 곳당 한 행으로 담은 현황표입니다. 시설번호, 놀이시설명, 주소, 설치일자, 안전검사 종류, 운영·실내외 구분, 물놀이형 여부가 들어 있습니다. 연제구에서 어린이집을 고르는 부모가 "이 어린이집 놀이시설은 언제 설치됐고 실내인지 실외인지"를 확인하거나, 분석가가 설치 연도별 노후 놀이시설 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 어린이집 기본정보 등 다른 데이터와는 놀이시설명(어린이집명)이나 주소를 맞춰 이어 써야 한다.
description_portal: 부산광역시 연제구 관내 등록된 어린이 놀이시설 중 어린이집 내외부에 설치되어 있는 놀이시설 현황임. 현황표 내에 시설번호, 어린이집(놀이시설)명, 주소, 설치일자, 안전검사 종류, 운영 구분, 실내외 구분, 물놀이형 놀이시설 포함 여부에 관한 데이터가 등록되어 있음. 매년 상하반기에 관리 주체가 자체 전수점검을 실시하도록 하고 있으며 안전한 어린이 놀이시설 환경 조성과 사고 예방을 위해 합동점검반이 관리주체의 시설을 방문하여 안전관리 실태 및 안전관리 의무 이행 여부 등을 점검,관리하고 있음.
