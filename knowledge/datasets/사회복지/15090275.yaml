description_portal: 이 데이터는 광주광역시 서구 지역에 거주하는 65세 이상 독거노인의 현황을 행정동 단위로 제공하는 통계 자료입니다. 행정동별로 독거노인의 총인원, 연령대, 성별(남성/여성) 분포가 포함되어 있으며, 특정 연도 기준으로 노인 인구의 고립 정도 및 복지 수요 파악에 활용될 수 있습니다. 특히, 인구 고령화 및 1인 가구 증가에 따라 복지정책 수립, 노인 돌봄 서비스 설계, 커뮤니티 케어 자원배분 등 다양한 행정적 활용이 가능하며, 노인 복지정책의 지역 맞춤형 추진을 위한 기초자료로서의 가치가 큽니다. 데이터는 CSV 형식으로 제공되며, 통계 작성일 기준 최신 상태로 관리됩니다.
