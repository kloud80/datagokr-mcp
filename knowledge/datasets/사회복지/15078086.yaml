summary_user: 아이돌봄 서비스 제공기관별·월별로 연계·신청·신규연계 가정 수를 가형부터 라형까지 소득유형별로 나눈 집계 데이터로, 기준연월(crtrYm)·돌봄구분·질병감염아동 서비스 여부와 상위기관 정보를 함께 담으며 범위는 전국이다. 정책 분석가나 지자체 담당자가 "우리 지역 아이돌봄기관에 이번 달 신청 가정 대비 실제 연계된 가정이 유형별로 얼마나 되나" 같은 수요·공급 격차를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 아이돌봄기관 번호·이름이나 상위기관명 같은 같은 기관 코드 또는 이름 매핑으로만 잇는다.
limits: 표준 행정구역 코드나 좌표가 없는 비공간 데이터라 기관명·상위기관명 외에는 지역 단위로 바로 묶기 어렵다. 개발계정은 하루 3,000회 호출로 제한된다.
