description_portal: 아이돌봄 월별신청 현황 연령소득기준별 정보를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 기준연월, 아이돌봄기관명, 돌봄구분명, 상위아이돌봄기관명, 0세부터 12세까지 각 연령별로 가형부터 라형까지의 신청건수 등의 정보를 확인할 수 있습니다. 사회경제적 요인에 따른 돌봄 수요의 차이를 비교 분석할 수 있게 하며, 가형부터 라형까지 구분된 자료는 정책대상별 형평성과 지원 적절성을 검토하는 데 중요한 기초 자료가 됩니다. 특히 다자녀 가구나 저소득층 집중도를 확인할 수 있어 맞춤형 지원 전략 수립에 도움을 줍니다. 돌봄 격차 해소 및 소득계층 맞춤 정책 설계에 활용될 수 있습니다.
