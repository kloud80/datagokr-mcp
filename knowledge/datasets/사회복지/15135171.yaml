summary_user: 경기도 워라밸링크 플랫폼에 사용자가 올린 워라밸 정보 공유·프로그램 참여 소식 게시물을 한 건씩 담으며, 항목은 고유번호, 제목, 유형, 반려사유(rjct_resn)로 구성된다. 정책 홍보 담당자나 분석가가 '워라밸링크에 어떤 유형의 정보가 주로 올라오고, 어떤 게시물이 어떤 이유로 반려되는가'를 파악하는 데 쓴다. 실측 컬럼에서 다른 데이터와 잇는 전역 조인 키를 찾지 못해, 제목·유형 같은 이름 매핑이나 같은 기관(경기도) 자료끼리만 연결할 수 있다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼에서 사용자들이 워라밸 관련 정보를 공유하거나 각종 프로그램 참여 소식을 알리기 위해 등록한 정보성 콘텐츠 목록을 수록한 자료로, 고유번호, 제목, 유형, 반려사유 등의 항목으로 구성되어 있습니다. 다양한 참여형 활동과 정책 사업 안내로 구성되어 있으며, 등록된 정보는 워라밸 실천을 위한 커뮤니티형 콘텐츠로 활용됩니다. 데이터는 공공정보 유통 현황 분석, 정책 홍보 효과 측정, 사용자 주도 콘텐츠 흐름 파악, 워라밸 커뮤니티 활성화 전략 수립 등에 활용될 수 있습니다.
