summary_user: 경기도 시군별 장애인체육회를 기관 한 곳당 한 행으로 담은 현황 목록으로, 시군 이름·기관명·전화번호·홈페이지 주소·지번/도로명 주소·우편번호·위경도 좌표를 포함한다. 장애인 당사자나 가족이 우리 시군 장애인체육회의 연락처와 홈페이지를 찾을 때, 정책 담당자가 도내 장애인체육회의 분포를 지도로 확인할 때 쓴다. 실측 컬럼에는 전국 공통 조인 키가 없어서 다른 데이터와는 시군 코드(SIGUN_CD)·시군 이름 매핑이나 주소·좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 시군별 장애인체육회의 현황을 정리한 자료입니다. 장애인체육회는 지역 내 장애인의 생활체육과 전문체육을 지원하고 체육활동 참여를 촉진하기 위해 설립된 조직으로, 본 자료는 경기도 전역의 체육회 분포와 접근성을 파악하는 데 활용됩니다. 또한 홈페이지와 연락처 정보가 포함되어 있어 이용자에게 직접적인 접근 경로를 제공하며, 정책 수립자에게는 장애인 체육 인프라의 균형적 배치와 운영 현황 분석을 위한 기초자료가 됩니다. 나아가 지역사회 통합과 건강권 보장을 위한 체육정책 수립에도 중요한 참고 자료로 활용될 수 있습니다.
