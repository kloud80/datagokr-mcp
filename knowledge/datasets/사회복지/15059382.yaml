summary_user: 경기도 특수교육지원센터의 순회교육 학생 수를 연도(STD_YY)와 순회학급 유형(가정·시설·병원)별로 집계한 데이터로, 장애영아·유치원·초등·중학교·고등학교 과정별 전체·남·여 학생 수를 담으며 범위는 시도 단위의 비공간 집계다. 특수교육 정책 담당자나 연구자가 '경기도에서 병원·가정 순회교육을 받는 초등 과정 학생이 해마다 얼마나 되는가' 같은 수요 파악과 인력·예산 배치 검토에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 순회학급 유형명 같은 이름 매핑으로만 맞춰 쓰며, 같은 기관의 특수교육 통계와 연도 기준으로 나란히 비교하는 정도가 현실적이다.
description_portal: 교육부(특수교육통계)에서 제공하는 경기도 내 특수교육지원센터 순회교육 학생 수 - 학교과정별, 순회학급유형별(가정‧시설‧병원) 집계 현황입니다. 매년 6월 말 기준의 순회학급유형명, 학교과정별 학생 수(장애영아전체수, 유치원전체학생수, 초등학교전체학생수 등)를 제공합니다. 특수교육이 필요한 아동 및 청소년의 교육 접근성과 교육 수요를 파악하는 데 유용합니다. 본 데이터는 지역별 특수교육 수요 분석, 관련 예산 및 인력 배치, 특수교육 서비스 제공 형식 개선 등의 정책 자료로 활용될 수 있습니다.
