summary_user: 강릉시 관내에서 산모신생아 건강관리 서비스를 제공하는 기관을 기관별 한 행으로 담은 현황 파일로, 기관명·영리 여부 등 유형·면적·도로명주소·대표자·전화번호·홈페이지 7개 항목이 있다(파일 크기 414바이트의 소규모 목록). 강릉에서 출산을 앞둔 산모나 가족이 "집 근처에서 산모신생아 건강관리 서비스를 받을 수 있는 제공기관은 어디이고 연락처는 무엇인가"를 찾는 데 쓴다. 전역 조인 키나 시군구코드가 없어서 다른 데이터와는 기관명이나 도로명주소를 매핑해 붙여야 하며, 다른 시군구의 같은 사업 데이터와 비교할 때도 이 방식으로 맞춘다.
description_portal: "강원특별자치도 강릉시 산모신생아 건강관리지원사업 제공기관 현황 데이터입니다.본 데이터는  7개 항목(컬럼)으로 구성되며, 각 항목의 설명은 다음과 같습니다.기관명: '도담도담', '엄마랑아기랑' 등 서비스를 제공하는 기관의 이름유형: '영리' 등 기관의 유형기관면적(제곱미터): 기관의 면적 (m²)도로명주소: 기관의 상세 도로명 주소대표자명: 기관 대표자의 이름전화번호: 기관의 연락처홈페이지: 기관의 웹사이트 주소강릉시 관내 산모신생아 건강관리 서비스를 제공하는 기관명별 도로명주소, 전화번호, 홈페이지 등을 파악할 수 있습니다."
