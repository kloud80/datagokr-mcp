description_portal: 아이돌봄 건강보험료 산정기준표 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연도, 소득금액, 직장/지역별 건강보험료 본인부담금액, 혼합건강보험료액 등의 정보를 확인할 수 있습니다.아이돌봄 지원대상 선별 과정에서 소득 검증의 객관성을 확보하는 데 기여합니다. 직장 및 지역가입자 간 보험료 부담의 차이를 파악함으로써 형평성 있는 정책 수립이 가능해집니다. 또한 기준 연도별 보험료 변화 추이를 통해 가계 부담 경향 분석이 가능하며, 복지 제도와의 연계 효율성 평가에도 유용합니다. 돌봄서비스 대상자의 건강보험료 기준 확인용으로 활용될 수 있습니다.
