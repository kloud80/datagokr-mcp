summary_user: 아이돌봄 지원대상 소득 판정에 쓰는 건강보험료 산정기준표로, 기준연도(crtrYr)와 소득금액 구간별로 직장가입자·지역가입자 건강보험료 본인부담금과 혼합 건강보험료액을 담은 전국 단위 비공간 기준표입니다. 아이돌봄서비스를 신청하려는 가구나 담당자가 '우리 집 건강보험료 본인부담금이 어느 소득금액 구간에 해당하는가'를 확인하는 데 쓰고, 분석가는 연도별 직장·지역 보험료 차이를 비교하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키가 없어, 기준연도나 소득금액 값을 기준으로 다른 아이돌봄 자료와 직접 맞춰 써야 한다.
limits: 개별 가구나 개인의 실제 보험료가 아니라 기준표만 담고, 지역별로 나뉘지 않은 전국 단일 기준이다. 표준 조인 키가 없어 다른 데이터와 자동으로 연결되지 않는다. 호출에는 포털 활용신청으로 받는 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
