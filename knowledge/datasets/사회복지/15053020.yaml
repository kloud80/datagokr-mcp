summary_user: 공무원연금공단이 관리하는 퇴직자를 재직기간 구간(구분)별 행으로 나누고, 정무직·일반직·경찰·소방·교육직 등 15개 직종과 합계(계)를 열로 놓아 인원을 집계한 전국 단위 통계 파일(csv, 약 2KB)이다. 인사·연금 정책 분석가가 "어느 직종에서 단기 재직 후 퇴직이 많고, 어느 직종에 장기 근속 퇴직자가 몰리는가"를 따져 인력 유지율이나 퇴직 시점을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 직역연금 통계(재직자·수급자 현황 등)와는 직종명·재직기간 구간 이름을 맞춰서만 이어 쓴다.
limits: 퇴직자 개인 단위 자료가 아니라 직종×재직기간 구간 집계표여서 기관·지역·성별 분석은 하지 못한다. 전국 단위의 비공간 자료이고 공통 코드 키가 없어, 다른 데이터와 붙이려면 직종·구간 이름을 직접 매핑해야 한다.
