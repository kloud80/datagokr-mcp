summary_user: 국제청소년성취포상제에 참여한 청소년이 쓴 활동보고서를 보고서 한 건 단위로 담은 건별 원천 데이터로, 작성·제출·담당자 확인 일시와 제출확인 여부, 활동 시작·종료일자를 기록한다. 포상제 운영기관이나 분석가가 "보고서가 활동 종료 후 얼마 만에 제출되고 담당자 확인까지 얼마나 걸리는가"처럼 제출·확인 절차의 지연과 누락을 점검하는 데 쓴다. 활동프로그램 일련번호(actvPrgrmSn)와 시설물 일련번호(fcltySn)가 있어 같은 기관의 포상제 프로그램·시설 데이터와 이어 볼 여지는 있지만, 실측에서 전역 조인 키는 확인되지 않아 같은 기관 코드나 이름 매핑으로만 연결된다.
limits: 보고서 본문이나 참여 청소년·지역 정보가 없어 활동 내용 평가나 시군구별 집계에는 쓰기 어렵고, 범위는 전국·비공간이다. 다른 데이터와는 전역 조인 키가 없어 같은 기관의 일련번호 체계로만 연결해야 한다. 서비스키가 필요하며 개발계정은 하루 10,000회로 제한된다.
