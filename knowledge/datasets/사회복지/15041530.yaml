summary_user: 서울 광진구 내 경로당을 한 곳당 한 행으로 담은 파일 데이터로, 행정동·운영 형태·경로당명·전화번호·주소·남녀별 및 총 회원 수·설립일을 포함한다. 구민이나 복지 담당자가 "우리 동네 행정동에 경로당이 어디 있고 회원은 몇 명인가"를 확인하거나, 분석가가 행정동별 경로당 분포와 이용 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 행정동 이름이나 주소 문자열로 매칭해 다른 노인복지시설 목록이나 시군구 단위 지역 통계와 이어 쓴다.
limits: 표준 시설코드 같은 공통 식별자가 없으므로 다른 데이터와 연결하려면 경로당명·주소·행정동 이름을 직접 맞춰야 한다. 범위가 광진구 한 곳에 한정되어 다른 자치구나 서울 전체와 비교하려면 별도 데이터가 필요하다.
