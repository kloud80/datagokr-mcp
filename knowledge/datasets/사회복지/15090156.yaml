description_portal: 이 데이터는 전남개발공사의 사회적기업 및 여성기업제품 구매 실적에 대한 정보를 담고 있습니다.이는 사회적 가치 창출과 상생 협력을 위한 공공기관의 노력을 투명하게 공개하고, 관련 기업들의 안정적인 경제 활동을 지원하는 것을 주된 목적으로 합니다.데이터는 연도별로 구매 합계금액(원)과 전체 구매총액 대비 구매비율(%) 등의 상세 항목으로 구성되어 있습니다.본 데이터는 내부 구매 기록을 집계하여 작성되며, 공공 부문의 사회적 책임 이행 상황을 보여주는 중요한 지표 역할을 합니다.이러한 정보는 사회적기업이나 여성기업들이 공공조달 시장의 동향을 파악하고 사업 기회를 모색하는 데 유용한 자료가 됩니다.궁극적으로는 공공기관의 구매 활동을 통한 지역 경제 활성화와 사회 통합에 기여하고, 기관의 사회적 책임 경영을 명확히 보여주는 기반이 될 것으로 기대됩니다.
