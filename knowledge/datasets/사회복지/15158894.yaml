description_portal: '본 데이터는 2025년 기준 고창군 읍·면별 기초생활보장 수급자 현황을 집계한 자료로, 각 행정구역별 수급자 규모를 파악할 수 있도록 제공됩니다. 데이터는 읍·면 단위로 기초생활보장 수급자 수를 기준으로 구성되어 있으며, 지역별 복지 수요 분석 및 저소득층 지원 정책 수립을 위한 기초자료로 활용할 수 있습니다.데이터 구성은 번호, 행정구역(시도명·시군구명·행정동명), 수급자 현황(총수급자·일반수급자·시설수급자별 가구 수 및 인원), 데이터기준일자로 이루어져 있고, 행정구역별 기초생활보장 수급 현황을 확인할 수 있습니다. 해당 자료는 복지사업 수행 과정에서 집계된 행정자료를 기반으로 작성되었습니다.본 데이터는 지역별 기초생활보장 수급자 분포를 공간적으로 분석하거나, 특정 지역의 복지 수요 및 서비스 제공 현황을 파악하는 데 활용할 수 있습니다. 또한 공공데이터를 활용하여 다음과 같은 분석 및 연구에 활용이 가능합니다. (단순 예시 사례이므로 참고 바랍니다.)○ 지역별 분포 분석: 읍·면별 기초생활보장 수급자 수를 통해 지역 간 복지서비스 제공 격차를 파악하고 정책 수립에 활용할 수 있습니다.○ 수급자 규모 파악: 마을 단위 수급자 현황을 분석하여 향후 복지사업 확대 및 예산 배분 방향 설정에 활용할 수 있습니다.○ 저소득층 지원 분석: 기초생활보장 수급 현황을 기반으로 저소득층 복지서비스 제공 수준 및 복지 사각지대 해소를 위한 기초자료로 활용할 수 있습니다.'
