summary_user: 한국피해자지원협회가 제공한 범죄 피해자 상담·지원 요청 내역을 건별로 담은 연구자용 샘플 데이터로, 피해자 연령·성별·주소, 피해유형(강간·협박·가정폭력·특수상해 등), 요청 지원 내용, 요청 경로를 담는다. 연구자나 정책 담당자가 '지역·성별·연령별로 어떤 범죄 피해 유형의 상담 요청이 많고, 주로 어떤 경로(경찰 연계 등)로 들어오는가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 주소의 지역명이나 피해유형 이름을 매핑해 붙이는 방식으로만 이어 쓴다.
description_portal: 사단법인 한국피해자지원협회 제공, 범죄 피해자를 대상으로 한 상담 및 지원 요청 내역을 포함하는 연구용 데이터로, 피해자의 연령, 성별, 주소, 피해유형, 요청유형, 요청경로 등의 정보를 포함하고 있습니다. 주요 항목은 ID, VICTIM_ID, AGE, GENDER, ADDRESS, HARM_TYPE, REQUEST, REQUEST_PATH이며, 피해유형은 강간, 협박, 가정폭력, 특수상해 등 다양한 범죄 유형을 포함하고 있습니다. 본 데이터는 피해자 맞춤형 서비스 제공, 범죄 피해 실태 조사, 경찰 연계 상담 서비스 평가 및 개선, 심리적·사회적 지원체계 연구 등에 활용될 수 있습니다. 또한, 지역별·성별·연령별 피해 유형 분석을 통해 정책 수립의 기초자료로 제공됩니다.※ 업로드된 데이터셋은 샘플 데이터로 원본데이터가 필요한 경우 한국피해자지원협회(https://www.trykova.org/)를 통해 신청해주시기 바랍니다.
