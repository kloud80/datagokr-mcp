summary_user: 전국 광역 교통약자 이동지원센터의 기본 정보(주소·전화·운영시간·요금·이용대상)와 센터별 택시 차량 현황, 운행이력, 현재 이용가능 차량 수·예약·대기 건수를 담은 API이다. 전체 10,932건이 개별 주소·좌표 단위로 있고 기간은 2024-12-09~2026-10-02이다. 휠체어 이용자나 보호자가 내 지역 센터의 예약 방법과 지금 이용 가능한 차량이 있는지 확인하는 데 쓴다. 지자체 코드(stdgCd, bjd_cd)로 다른 지역 행정 데이터와, 센터 도로명·지번주소(address)와 위도(coord)로 주소·지도 기반 데이터와 이어 쓴다.
description_portal: 전국 광역자치단체에서 운영중인 교통약자 이동지원 센터의 기본 정보 및 센터에서 운영되는 교통약자 이동수단에 대한 실시간 정보를 제공 합니다. 제공되는 정보는 교통약자 이동지원 센터의 기본 정보인 "교통약자이동지원센터 현황정보", 운영중인 차량에 대한 현황 정보를 담은 "교통약자 택시 차량 현황정보", 운영중인 차량에 대한 운행이력 정보를 담은 "교통약자 택시 차량 운행이력 현황정보", 현재 이용가능한 교통약자 이동수단의 실시간 현황 정보로 구성된 "교통약자 택시 차량 이용가능 정보"를 제공합니다.
