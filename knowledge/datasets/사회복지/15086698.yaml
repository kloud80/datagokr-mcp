summary_user: 대전광역시 동구 관내 여성복지시설(상담소·가정폭력피해자보호시설·통합가족센터 등)을 시설 한 곳당 한 행으로 시설유형·시설명·도로명주소·전화번호·설립일자와 함께 담은 시군구 단위 목록이며, 파일 크기는 약 522바이트로 소규모다. 동구 주민이나 상담이 필요한 사람이 '우리 구에 어떤 여성 상담·지원 시설이 있고 연락처는 무엇인가'를 확인하거나, 분석가가 보호시설 분포를 보고 설치계획을 검토하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 사회복지시설 목록과는 시설명·주소 문자열을 맞추거나 같은 기관 자료끼리 묶어 쓴다.
description_portal: '이 데이터는 대전광역시 동구에 위치한 여성복지시설정보 현황 정보를 제공하고 있으며, 세부 내용으로는 여성복지시설에 해당하는 시설명, 시설유형, 소재지 도로명주소, 전화번호, 설립일자를 포함하고 있습니다. 이 자료를 통해 동구 관내에 있는 상담소 및  가정폭력피해자보호시설, 통합가족센터 시설에 대한 정보를 파악할 수 있으며, 여성복지시설의 분포와 현황을 통해 추후 보호시설 설치계획수립에도 이용될 수 있습니다. 해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2026. 7. 20.'
