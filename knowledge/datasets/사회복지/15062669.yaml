summary_user: 설 연휴 특별교통소통대책 기간의 일자·요일별 고속도로 본선 통과 차량 대수를 1종(일반·경차)부터 5종까지 차종별로 나누고 합계와 함께 담은 전국 단위 집계 파일(CSV, 426바이트)이다. 도로 운영 담당자나 교통 분석가가 '설 연휴 중 어느 날 고속도로 교통량이 가장 많았고, 화물차 같은 대형 차종 비중은 어땠나'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어서, 다른 연휴 교통량 자료나 같은 기관 자료와는 일자를 기준으로 맞춰 비교하는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 설 연휴 기간 시행된 특별교통소통대책의 운영 결과를 제공하는 공공자료이다. 한국도로공사에서 관리하며, 설 연휴 일자, 요일별, 1종~5종 차량별 본선차량 통과대수 및 합계 항목으로 구성되어 있다. 해당 데이터는 명절 기간 고속도로 구간별 교통량을 정량적으로 파악할 수 있도록 하며, 차량 종류별 통행 특성과 연휴 교통 흐름 분석에 활용된다. 이를 통해 혼잡 시간대 예측, 교통 분산 전략 마련, 향후 연휴 대책 개선 등에 기초자료로 제공된다. 또한 도로 운영의 효율성 제고와 대국민 서비스 품질 향상을 위한 정책 평가 지표로 활용 가능하다. 본 자료는 설 연휴 고속도로 관리 성과 분석 및 명절 교통운영 체계 고도화를 지원하는 공공데이터이다.
