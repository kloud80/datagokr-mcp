summary_user: 전국 아이돌봄 광역거점기관을 기관 한 곳당 한 건으로 담으며, 시도명·기관번호·기관명·대표/직통 전화·팩스·우편번호·주소·경도·위도·데이터 기준일자를 제공한다. 아이돌봄 서비스를 이용하려는 부모나 지자체 담당자가 '우리 시도의 아이돌봄 광역거점기관은 어디이고 연락처는 무엇인가'를 확인하거나, 좌표로 지도 안내를 만드는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 돌봄·복지시설 데이터와는 시도명이나 기관명·주소 매칭, 또는 좌표 기반 거리 계산으로 연결한다.
description_portal: 아이돌봄 광역거점 기관 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 아이돌봄 기관명, 대표전화번호, 직통전화번호, 팩스번호, 우편번호, 주소, 좌표 경도값, 좌표위치값, 데이터기준 일자의 내용을 확인할 수 있습니다.이용자와의 접근성과 소통 편의를 높일 수 있습니다. 좌표 정보를 활용하면 지도 기반의 위치 안내 서비스 구축이 가능해지고, 기관 간 거리 분석을 통해 지역 간 인프라 격차를 파악할 수 있습니다. 돌봄 수요자의 기관 선택을 지원하는 실시간 위치 기반 안내 시스템 개발에도 유리합니다. 이용자 중심의 서비스 체계 구축에 활용될 수 있습니다.
