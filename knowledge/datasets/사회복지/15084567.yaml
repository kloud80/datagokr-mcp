description_portal: 공공기관으로서 사회적 책임을 수행하기 위한 사회공헌의 일환으로 한국장학재단에서 타기관 및 지역사회에 기부한 내역으로 기부처별 기부금액 및 기부사유 등을 보여줌이 데이터는 기부처, 기부금액(원), 기부사유 등의 항목으로 구성되며, 기부대상 특성 및 목적 등 다양한 정보를 통해 공공기관의 사회공헌 활동을 체계적으로 확인할 수 있음해당 데이터는 한국장학재단의 연간 기부실적을 정리한 것으로, 각각의 기부사유에 따른 기부금액을 명시하고 있음. 각 기부내역은 기부처와 기부사유를 포함하고 있어 재단의 기부활동 목적과 수령기관을 확인할 수 있고 실적을 파악하는 데 유용함또한, 공공기관의 ESG 경영 중 S(사회) 관련 정책연구나 사례분석에 활용도가 높음
