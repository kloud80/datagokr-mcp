summary_user: 충주시 관내 노인장기요양기관과 노인복지생활시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설유형·종류(요양원·주야간보호센터·양로시설 등)·시설명·전화번호·소재지 주소·서비스내용을 담는다. 보호자나 어르신이 '충주에서 집 가까운 주야간보호센터나 요양원은 어디이고 어떤 서비스를 하나'를 찾거나, 분석가가 지역 내 장기요양시설 분포와 접근성을 살피는 데 쓴다. 공통 조인 키(시설코드 등)가 없어 건강보험 장기요양기관 목록이나 사회복지시설 정보와는 시설명·주소를 맞춰 이어야 하고, 지역 통계와는 시군구(충주시) 단위로만 연결된다.
limits: 전역 조인 키가 없어 다른 기관 데이터와 붙일 때 시설명·주소 매칭에 의존해야 하며 명칭 변경 시 어긋날 수 있다. 범위가 충주시 한 곳이라 다른 시군과의 비교에는 별도 데이터가 필요하고, 정원·현원·등급 같은 운영 수치는 담지 않는다.
