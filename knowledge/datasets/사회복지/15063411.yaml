description_portal: 본 데이터는 충청북도 충주시에서 운영 중인 교통약자 이동지원 수단(행복콜 및 임차콜 택시)의 예약 및 운행 현황을 월 단위로 제공하는 자료입니다.총 3종의 세부 데이터로 구성되어 있으며, ▲행복콜센터 운행건수(관내·관외 구분), ▲임차콜택시 운행건수, ▲고객 이용목적별 건수(병원, 귀가 등)를 포함합니다.예약일 기준 월별 통계이며, 관리센터 전화번호가 함께 제공되어 실시간 문의도 가능합니다."관내/관외" 항목은 이동 범위 기준, "이용목적별 건수"는 주된 이동 사유(진료, 귀가 등) 기준으로 분류됩니다.임차콜택시는 운영 민간업체와 연계된 차량으로, 행복콜과는 별도로 집계됩니다.데이터는 충주시 교통약자 지원정책 수립, 이동권 분석, 수요 예측, 운영효율 개선 등 행정 목적뿐 아니라 민간 연구·복지 분야에서도 다양하게 활용될 수 있습니다.※ 서비스 운영정보는 시점에 따라 변경될 수 있으며, 세부사항은 충주시 교통행정과 또는 행복콜센터(043-857-6161)로 문의 바랍니다.
