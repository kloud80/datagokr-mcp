summary_user: 충주시 교통약자 이동지원 수단(행복콜·임차콜택시)의 예약·운행 현황을 예약일 기준 월별로 집계한 파일로, 행복콜 관내·관외 운행건수, 임차콜택시 운행건수, 병원·귀가 등 이용목적별 건수를 담는다. 충주시 교통약자 지원 담당자나 복지 연구자가 '특별교통수단 이용이 어느 달에 몰리고, 병원 이동 비중은 얼마인가'처럼 수요와 이동 목적을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 월·시군구 이름을 맞추거나 같은 기관(충주시) 자료끼리만 이어 쓸 수 있다.
limits: 건별 운행 기록이 아니라 월별 집계라서 개별 이용자·출발지·도착지 단위의 분석은 할 수 없다. 공통 코드나 키가 없어 타 지자체 특별교통수단 통계와 비교하려면 이름·기간 기준으로 직접 맞춰야 한다.
