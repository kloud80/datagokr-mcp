summary_user: 경기도 워라밸링크 플랫폼에서 고를 수 있는 상담 주제(커리어, 마음심리, 자녀양육, 직장 고민, 가정 문제, 세무회계 등)를 유형별로 정리한 코드표로, 유형마다 고유번호·한글 이름·영어 이름·삭제 여부를 담는다. 상담 서비스 분석가나 정책 담당자가 "워라밸링크 상담 기록에 찍힌 유형 번호가 어떤 주제인가"를 풀거나 상담 콘텐츠 범주를 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 같은 기관의 워라밸링크 상담 데이터와는 유형 고유번호(idntfy_no)나 이름 매핑으로만 잇는다.
description_portal: 이 데이터는 경기도에서 운영하는 워라밸링크 플랫폼 내에서 제공되는 다양한 상담 주제를 유형별로 분류한 정보입니다. 상담 항목은 고유번호, 한글 이름, 영어 이름, 삭제 여부 등의 항목으로 구성되어 있으며, 사용자는 자신에게 필요한 분야의 상담 유형을 선택해 맞춤형 상담을 받을 수 있습니다. 주요 상담 유형은 커리어, 마음심리, 자녀양육, 직장 관련 고민, 가정 문제, 세무회계 등 실생활과 밀접한 주제로 구성되어 있으며, 이 데이터는 상담 콘텐츠 유형의 범주화, 상담 수요 분석, 관련 정책 연계 콘텐츠 개발에 유용하게 활용될 수 있습니다.
