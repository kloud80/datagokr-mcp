summary_user: 사학연금 기금이 국내에서 투자한 대체투자(부동산·인프라·사모주식 등) 가운데 연도말 평가액 기준 상위 5건을 기준일·투자분야·투자자산·평가액(억 원)·투자처 단위로 담은 작은 집계 파일이다(csv 291바이트). 기금 운용의 투명성을 따지는 국민이나 연금 분석가가 '사학연금이 국내 대체투자로 어떤 자산에 얼마를 넣었나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 투자처 이름을 직접 맞추거나, 같은 기관의 해외 대체투자·국내 주식 보유 현황 등과 기관 단위로 나란히 놓고 본다.
description_portal: 국내 대체투자 현황은 대체투자의 대분류 중 국내대체 자산군의 연도말 평가액을 기준으로 상위 5개의 국내 대체투자 현황에 관한 정보를 제공하고 있습니다.공단은 채권, 주식 등의 전통자산 외에도 기금의 수익률 제고, 포트폴리오 다각화, 분산투자를 통한 리스크 저감 등을 위해 부동산, 인프라, 사모주식 등의 대체투자 자산에 일정 비율로 투자하고 있습니다.제공하는 데이터는 국내대체 투자 내에서의 투자분야, 투자자산, 평가액, 투자처 등의 정보를 공개하여 기금 운용의 투명성을 제고하고자 합니다.
