summary_user: 제주특별자치도가 관리하는 저소득층 지원 법인의 법인명·설립일·소재지·운영시설을 법인 한 곳당 한 행으로 담은 목록이며, 주소 단위의 개별 위치 정보를 포함한다. 복지 분석가나 지자체 담당자가 '제주 어느 지역에 저소득층 지원 법인과 운영시설이 몰려 있고 어디가 비어 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 법인명이나 소재지 주소를 맞춰 붙여야 하며, 사회적경제 데이터의 인증번호·사업자번호 같은 기업 축과는 이름 매칭을 거쳐 이어 쓴다.
description_portal: 이 데이터셋은 2021년 기준으로 제주특별자치도에서 관리하는 ‘저소득층 지원 법인’의 명칭, 소재지, 운영 시설 등의 정보를 체계적으로 정리한 공공데이터이다. 제공기관은 제주도청이며, 데이터 형식은 CSV로 공개되어 있어 누구나 다운로드 및 활용이 가능하다. 이 자료는 제주 지역에서 저소득층 지원을 담당하는 민간 또는 공익 법인의 분포 현황을 객관적으로 보여주며, 복지정책 수립, 사회서비스 전달 체계 설계, 민관 협력체계 구축, 지역 복지 인프라 분석 등에 있어 기초 통계로 기능한다. 또한 지원법인의 소재지 및 운영시설 정보를 통해 지원 공백 지역을 찾아내거나, 서비스 접근성 분석, 자원 배분의 효율성 검토, 복지 사각지대 해소 계획 수립 등에 활용될 수 있다.
