description_portal: 대전광역시 경력단절 여성 경제활동촉진사업 현황 자료는 경력단절여성의 경제활동 참여 확대를 위해 추진되는 다양한 사업의 운영 현황을 종합적으로 정리한 자료입니다. 이 자료에는 대전여성인력개발센터 운영 현황, 여성 취업창업 박람회 개최 내역, 여성새로일하기센터 운영 현황 등 경력단절여성의 일자리 지원을 위한 주요 사업 별 정보가 포함되어 있습니다. 각 센터와 사업 별 제공되는 직업교육훈련, 취업상담, 취업연계, 창업지원 등 세부 프로그램 현황과 참여자 수, 성과지표 등도 함께 제공되어 경력단절여성의 경제활동 촉진을 위한 정책 집행 현황과 성과를 체계적으로 파악할 수 있습니다.
