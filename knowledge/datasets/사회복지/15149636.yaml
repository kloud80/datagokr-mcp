summary_user: 청소년활동 국제교류 프로그램을 운영·주관하는 단체를 단체 한 곳당 한 건으로 담은 목록으로, 기관명·영문명·부서명·우편번호·소재지 주소·대표전화를 전국 범위로 제공한다. 국제교류 프로그램에 참여하려는 청소년·학부모나 협력 단체를 찾는 기관이 '우리 지역에서 국제교류를 주관하는 단체는 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명 매칭이나 소재지 주소·우편번호 기반 지역 매핑으로만 잇는다. 기관일련번호(instSn)는 이 데이터 안에서만 쓰는 식별자다.
limits: 사업자등록번호나 인증번호 같은 공통 식별자가 없어 사회적경제 기업 데이터 등과 정확히 결합할 수 없고, 이름 매칭에 의존해야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한된다.
