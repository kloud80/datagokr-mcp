summary_user: 경기도 31개 시군의 아동복지시설(보호치료, 복지관, 상담소, 일시보호, 전용 시설) 인·허가 정보를 시설 한 곳당 한 행으로 담으며, 시설구분·사업장명·인허가일·영업상태·폐업일·입소정원·종사자 수·주소·좌표가 포함된다. 보호자나 지역 복지 담당자가 '우리 시군에 운영 중인 아동상담소나 일시보호시설은 어디이고 입소정원은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군 코드(SIGUN_CD)·시군명이나 주소로 다른 시군 단위 통계와 이름·코드 매핑으로 연결하고, 위경도 좌표로 지도에 올려 쓴다.
description_portal: '경기도 내 아동복지시설(보호치료, 복지관, 상담소, 일시보호, 전용) 현황입니다. 사업장명, 소재지지번주소, 소재지도로명주소, 입소정원 등의 정보를 제공합니다.- 아동상담소 : 아동복지시설 중 아동과 그 가족의 문제에 관한 상담, 치료, 예방 및 연구 등을 목적으로 하는 시설에 대한 정보입니다.- 아동일시보호시설 : 아동복지시설 중 보호 대상 아동을 일시보호하고 아동에 대한 향후의 양육 대책 수립 및 보호조치를 행하는 것을 목적으로 하는 시설에 대한 정보입니다.- 아동전용시설 : 아동복지시설 중 어린이공원, 어린이 놀이터, 아동 회관, 체육·연극·영화·과학실험 전시 시설, 아동 휴게 숙박시설, 야영장 등 아동에게 건전한 놀이·오락, 그 밖의 각종 편의를 제공하여 심신의 건강 유지와 복지증진에 필요한 서비스를 제공하는 것을 목적으로 하는 시설에 대한 정보입니다.※ 경기도 31개 시군의 인ㆍ허가 데이터입니다.'
