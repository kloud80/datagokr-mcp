description_portal: 서울특별시 서초구에서 운영 중인 안심택배함 현황 데이터입니다. 서초구에는 12군데의 안심택배함을 운영중에 있습니다.안심택배함이란 택배를 안전하게 수령할 수 있도록 설치된 무인 보관함입니다. 수취인이 부재 중일 때도 택배기사가 물품을 보관함에 넣고, 수령인은 인증번호나 앱을 통해 편리하게 찾아갈 수 있어 분실이나 도난 걱정 없이 비대면으로 안심하고 이용할 수 있다. 특히, 택배 수령이 어려운 싱글여성이나 맞벌이 부부 등 택배를 직접적으로 수령하기 어려운 사람들에게는 유용합니다. 유의사항으로는 택배 도착 후 48시간 이내 찾아 주세요. 택배도착 문자 수신 후 48시간 초과 시 택배함 부족 해결 및 원활한 이용을 위해 1천원/일 요금이 발생합니다.택배함에 현금·귀금속 등 고가 귀중픔을 절대 보관하시면 안 됩니다. 현금 보관 요청은 보이스피싱이니, 절대 넣지마시고 즉시 112에 신고하시기 바랍니다.보다 자세한 위치는 '안심이'앱 (삼성 플레이스토어, 구글 플레이스토어, 애플 앱스토어에서 다운로드 가능)이나 스마트서울맵(도시생활지도-안심택배) 에서도 확인할 수 있습니다.
