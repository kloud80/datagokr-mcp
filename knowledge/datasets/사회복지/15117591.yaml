summary_user: 충청남도 금산군의 아동생활시설(아동양육시설 향림원, 자립지원시설 충남향림자립생활관 2개소)을 시설 한 곳당 한 행으로 담고, 시설구분·시설명·지번/도로명 주소·위도·경도·정원을 함께 싣는 시설 단위 목록이다. 금산군에서 보호대상아동이나 시설 퇴소 청소년을 받는 시설이 어디에 있고 정원이 몇 명인지 확인하려는 주민·복지 담당자·분석가가 쓴다. 전역 조인 키는 없어 다른 사회복지시설 목록과는 시설명·주소로 맞추거나 위도·경도로 지도에 겹쳐 쓴다.
description_portal: 충청남도 금산군 아동생활시설은 총 2개소로 아동양육시설인 향림원과 자립지원시설인 충남향림자립생활관이 운영되고 있습니다. 향림원은 정원 65명의 아동양육시설로, 보호가 필요한 아동(보호대상아동)을 가정과 유사한 환경에서 보호·양육하며, 안정적인 생활과 자립 기반 마련을 지원하는 기능을 수행합니다. 충남향림자립생활관은 정원 30명의 자립지원시설로, 아동양육시설에서 퇴소하거나 연장 보호가 종료된 청소년들이 사회에 안정적으로 정착할 수 있도록 주거, 취업, 진로, 상담 등 다양한 자립 지원을 제공하는 역할을 하고 있습니다
