summary_user: 부산진구 관내 종합사회복지관이 운영하는 프로그램을 건별로 담은 파일로, 프로그램명·운영요일·교육장소·정원수·수강료(원)·기준일자를 행마다 기록한다. 구민이 동네 복지관에서 어떤 요일에 어떤 강좌를 얼마에 들을 수 있는지 찾거나, 분석가가 복지관별 프로그램 구성과 수강료 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 사회복지시설 현황 자료와는 복지관 이름이나 교육장소를 수작업으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 부산광역시 부산진구 관내 사회복지관 관련 기관 및 시설의 기본 정보와 제공프로그램을 한눈에 파악할수 있도록 구성된 자료입니다. 이 데이터에는 부산진구 소재 5개 종합사회복지관이 포함되어 있으며 각 기관이 수행하는 주요사업, 서비스대상자, 프로그램 종류, 운영 시간, 기관별 특화사업과 같은 세부적인 내용이 상세히 기재되어 있습니다. 또한 시설별 방문 이용자들이 참고할 만한 프로그램명이 수록되어 있어 지역 주민들이 복지서비스를 쉽게 이해하고 접근할 수 있도록 돕습니다. 이 자료는 부산진구 내 복지 수요를 파악하거나 기관 간 연계를 위한 기초자료로 활용할 수 있으며, 복지정책 기획 및 프로그램 개발에도 유용하게 사용될 수 있습니다.
