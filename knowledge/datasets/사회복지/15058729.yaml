summary_user: 경기도 내 영유아 생활·작업활동·체육·청각언어·시각 장애인복지시설을 시설 한 곳당 한 행으로 담으며, 시설구분, 사업장명, 인허가·폐업일자, 영업상태, 입소정원, 자격소유 인원과 총 인원, 주소와 위경도가 들어 있다. 장애인 가족이 우리 시군에서 운영 중인 시각·청각 장애인 시설이 어디이고 정원과 전문인력이 얼마나 되는지 확인하거나, 분석가가 시군별 장애인 복지 인프라 분포와 접근성을 비교하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소로 다른 경기도 시군 단위 통계와 맞춰 잇고, 위경도로 공간 분석에 쓴다.
description_portal: 이 데이터는 경기도 내 장애인복지시설의 설치 및 운영 현황을 제공하며, 특히 영유아 생활, 작업 활동, 체육, 청각언어, 시각 관련 시설을 포함합니다. 각 시설의 사업장명, 도로명주소 및 지번주소, 우편번호, 인허가일자, 영업상태명, 폐업일자, 입소정원, 자격 소유 인원 수, 총 인원 수 등의 항목으로 구성되어 있으며, 시군명과 시군코드를 통해 지역별 분석도 가능합니다. 또한 WGS84 좌표계 기반의 위도 및 경도 정보가 포함되어 있어 공간정보 분석 및 위치기반 활용이 가능합니다. 이 데이터는 장애 유형별 시설 분포를 파악하거나, 지역 내 장애인 복지 인프라의 접근성과 서비스 수요를 평가하는 데 활용될 수 있습니다. 특히 자격소유 인원은 사회복지사, 치료사 등의 전문 인력이 확보되어 있는지를 판단하는 지표로 사용됩니다.
