summary_user: 국제청소년성취포상제 참가 과정에서 생긴 환불 요청을 건별로 담으며, 입회 일련번호·환불요청 일련번호와 요청일시, 진행상태코드, 완료일시, 등록·수정 일시를 전국 범위로 제공한다. 운영기관이나 분석가가 '환불 요청이 접수된 뒤 완료되기까지 얼마나 걸리고, 지금 어떤 상태에 머물러 있는가'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없으며, 같은 포상제의 다른 데이터와는 입회일련번호(admSn)처럼 같은 기관 내부 번호로만 맞춰 볼 수 있다.
limits: 지역 정보가 없는 전국·비공간 데이터라서 시군구·시도별 집계나 다른 기관 데이터와의 직접 연결은 어렵다. 환불진행상태코드의 코드표는 입력에 없으므로 상태 값의 뜻은 별도로 확인해야 한다. 이벤트 주기 데이터로 분류되어 있어 갱신 시점을 일정한 주기로 가정하면 안 된다.
