summary_user: 전라남도 시군에 있는 청소년단체를 단체별 한 행으로 담은 소규모 파일(csv 약 3KB)로, 단체 명칭·주소·설립일·전화번호를 담는다. 청소년이나 학부모, 청소년 활동 담당자가 "우리 시군에 어떤 청소년단체가 있고 연락처는 무엇인가"를 확인하거나, 지역별 단체 분포를 파악하는 데 쓴다. 전역 조인 키나 기관 코드는 없어서 다른 데이터와는 주소를 시군 단위로 맞추거나 단체 명칭을 대조해 잇고, 지역 통계와는 시군 단위로 묶어 연계한다.
description_portal: '- 전라남도 시군에 위치한 청소년단체 현황 (단체명, 주소,설립일,전화번호 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도에는 다양한 청소년 단체들이 지역 사회에서 활발하게 활동하고 있습니다. 이들 단체는 청소년들의 권익을 증진하고, 다양한 프로그램과 활동을 통해 청소년들의 건전한 성장과 발달을 지원합니다.- 청소년 리더십 개발 : 리더십 프로그램과 활동을 통해 청소년들의 리더십 역량을 강화합니다.- 진로 탐색 및 직업 체험 : 진로 탐색 프로그램과 직업 체험을 통해 청소년들이 자신의 진로를 찾을 수 있도록 지원합니다.- 문화 및 체험 활동 : 문화 체험, 캠프, 워크숍 등을 통해 청소년들의 다양한 경험을 제공합니다.- 상담 및 위기 지원 : 심리 상담, 위기 청소년 지원 등을 통해 청소년들의 정서적 안정을 돕습니다.'
