summary_user: 경기도 기초생활수급자 중 장애수당을 받는 장애인 수를 기준년도와 장애정도(경증·중증)별로 집계하고, 지체·뇌병변·시각·청각·언어·지적·자폐성·정신·신장·심장 등 장애유형별 수급자 수를 열로 나눠 담은 집계 자료다. 복지 담당자나 분석가가 "경기도에서 장애수당을 받는 기초생활수급 장애인은 어떤 장애유형이 많고, 해마다 어떻게 늘거나 줄었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년도·장애정도 이름을 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 보건복지부 사회보장정보시스템을 통해 제공되는 통계로, 기초생활수급자 중 장애수당을 수급하는 장애인을 장애정도 및 장애유형별로 집계한 경기도 내 현황 자료입니다. 주요 항목은 ‘기준년도’, ‘장애정도’, ‘전체수급자수(명)’, ‘지체수급자수(명)’, ‘청각수급자수(명)’, ‘시각수급자수(명)’, ‘지적수급자수(명)’, ‘자폐성수급자수(명)’ 등이며, 여러 장애유형별 수급자 수를 포함합니다. 이 데이터는 경증/중증, 다양한 장애유형별로 기초생활수급자 대상 장애수당 지급 현황을 파악할 수 있어, 취약계층 장애인에 대한 복지서비스 수요 분석, 예산 책정, 장애유형별 맞춤형 복지정책 수립 등에 활용될 수 있습니다. 또한, 연도별 수급자 수 증감 및 유형별 변화 분석을 통해 정책의 성과를 평가하거나 향후 개선 방향을 모색할 수 있는 기초자료로도 유용합니다.
