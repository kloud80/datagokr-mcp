description_portal: 부산광역시 북구_사랑의 그린PC 보급 현황 데이터는 개인/단체별 PC 보급대수를 연도별로 공개하는 데이터로 2020년부터 2024년까지 총 5년간의 지급내역을 포함하고 있습니다.사랑의 그린PC 보급사업은 지능정보화 기본법 시행령 제45조(지능정보제품 보급지원)에 의거,16개 구군의 업무용 중고PC를 수집 및 정비하여 각 지역의 기초생활수급자와 복지시설의 신청서를 접수 후 무작위 추첨을 통해 보급하여 원활한 PC 사용을 지원하고 자원을 효율적으로 활용하기 위하여 부산광역시가 주관하여 추진하는 사업으로 추진시기는 매년 상이하여 자세한 내용은 매년 부산시 홈페이지 및 북구청 대표 홈페이지의 공지사항을 통해 확인하여 주시기 바랍니다.※ 2025년 접수 종료
