summary_user: 대전광역시에서 시간제 보육 서비스를 제공하도록 지정된 어린이집을 기관 한 곳당 한 행으로 정리한 목록으로, 명칭·소재지·유형·전화번호를 담는다(CSV 약 6.9KB). 대전에 사는 보호자가 집 근처에서 시간 단위로 아이를 맡길 수 있는 어린이집을 찾아 연락하거나, 분석가가 시간제 보육 기관의 지역·유형별 분포를 보는 데 쓴다. 전역 조인 키(어린이집코드 등)가 없으므로 다른 어린이집 데이터와는 기관 명칭이나 소재지 주소를 맞춰 연결해야 한다.
description_portal: 대전광역시 시간제 지정 어린이집 현황 자료는 대전광역시 내에서 시간제 보육 서비스를 제공하는 어린이집의 명칭, 소재지, 유형, 전화번호 등 주요 정보를 체계적으로 정리한 자료입니다. 이 자료는 시간제 보육이 가능한 기관의 지정 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 각 어린이집의 위치와 유형별 분포, 연락처 등의 세부 항목이 포함되어 있습니다. 시간제 지정 어린이집의 현황을 통해 지역 내 맞벌이 가정, 긴급 돌봄 수요 등 다양한 보육 수요에 대응하는 서비스 제공 현황을 분석할 수 있습니다. 또한, 시간제 보육 서비스의 접근성, 시설 분포, 이용자 편의성 등 다양한 측면에서 행정적·정책적 의사 결정 및 보육 정책 수립, 지역사회 복지 증진에 기초 자료로 활용됩니다.
