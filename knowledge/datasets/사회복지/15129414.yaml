description_portal: 이 데이터는 대구광역시 수성구의 무연고 사망자 통계를 연도별로 정리한 자료로, 성별과 연령대별 사망자 수를 포함한다. 연령 구간은 40세 미만부터 90세 이상, 미상까지이며 남녀로 구분된다. 무연고 사망자는 가족이나 지인 등 연고가 없어 행정기관이 장례를 처리한 사례를 의미하며, 사회적 고립과 복지 사각지대 실태를 파악하는 데 활용된다. 본 자료는 고령화, 1인 가구 증가 등 인구 구조 변화에 따른 영향을 분석하고, 취약계층 보호와 지역 복지정책 수립에 기초자료로 사용 가능하다. 연도별 변화 추이를 통해 행정 대응 방향을 설정할 수 있으며, 데이터는 정기적으로 갱신되어 공공기관, 복지 부서, 연구기관 등에서 다양하게 활용된다.
