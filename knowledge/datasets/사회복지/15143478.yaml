description_portal: 유치원 교직원의 신규가입자현황을 나타내고 있는 데이터로 연도별, 지역별(서울, 경기, 인천, 강원, 충남, 충북, 대전,세종,광주,대구, 경북,부산, 울산, 경남, 전남, 전북, 제주), 교직원(교원, 사무직원), 신규가입자수(신규임용자, 재임용자) 등의 항목을 제공합니다. 신규가입자수는 당해년도 신규임용과 재임용된 교원과 직원 수를 구분하여 제공합니다. 유치원 교원, 직원 신규가입자 현황을 통해 유보통합 및 영유아교육 지원과 관련된 정책 반영에 사용될 수 있습니다.신규가입자수는 통계 데이터에 신규임용 -> 퇴직 -> 재임용 대상자는 마지막 임용 기준으로 관리되고 있어서  중복제거(당해년도 신규임용, 재임용 2건 존재하는 교직원)된 신규가입자수로 제공하였습니다.
