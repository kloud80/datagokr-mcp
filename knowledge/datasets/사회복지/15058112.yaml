summary_user: 경기도 내 노인돌봄서비스 수행기관을 기관 한 곳당 한 행으로 담은 목록으로, 시군명, 서비스 구분(기본·종합 등), 기관명, 전화·팩스, 도로명·지번 주소, 우편번호, 위경도 좌표를 포함한다. 돌봄이 필요한 노인 가족이 '우리 동네에서 노인돌봄서비스를 맡는 기관은 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시군별 수행기관 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 기관명 매칭, 또는 주소·좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 노인돌봄서비스를 수행하는 기관에 대한 현황을 담고 있습니다. 노인돌봄서비스는 크게 기본서비스(안부 확인, 생활지원 등)와 종합서비스(신체·정신적 건강 지원, 사회활동 연계 등)로 나뉘며, 해당 서비스를 제공하는 수행기관의 기관명, 주소(도로명/지번), 전화번호, 위도/경도 좌표 등이 포함되어 있습니다. 이 정보는 독거노인이나 거동이 불편한 고령자 등의 돌봄 필요 인구에 대해 접근성 높은 복지 서비스를 기획·운영하는 데 유용합니다. 또한 서비스 수혜자의 거주지 인근 수행기관 분포나, 시군별 수행기관의 커버리지 분석, 정책 수립 시 기초자료로 활용될 수 있습니다. 수시로 수행기관 등록이 변경되므로, 항상 최신 데이터를 확인할 필요가 있습니다. 데이터는 경기도 노인복지과에서 연 1회 갱신하며, 노인복지법에 따라 관리되고 있습니다.
