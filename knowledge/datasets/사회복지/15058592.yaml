summary_user: 경기도 내 재가노인복지시설을 시설 한 곳당 한 행으로 담은 건별 현황으로, 시군명·시설종류·장기요양지정기관 여부·설치일자·설치주체·정원·현원(입소/이용자 성별·등급별)·종사자 수(정규/비정규)·주소와 WGS84 좌표를 포함한다. 분석가나 지자체 담당자가 '우리 시군의 재가노인복지시설 정원 대비 이용자와 종사자 수가 어느 수준이며 장기요양지정기관은 몇 곳인가' 같은 돌봄 인프라 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명(SIGUNGU_NM)·시설명 같은 이름 매칭이나 주소·좌표 기반 공간 결합으로만 다른 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 재가노인복지시설의 운영 현황을 시설별로 정리한 자료로, 시설명, 시설종류, 장기요양지정기관 여부, 설치일자, 설치주체, 주소, 정원, 종사자 수, 전화번호 등 세부 항목으로 구성되어 있습니다. 각 시설의 설치 주소는 도로명주소와 지번주소로 구분되며, 위도 및 경도 좌표(WGS84)가 포함되어 있어 공간 기반 분석이 가능합니다. 이 데이터는 노인복지 정책 수립, 장기요양서비스 인프라 분석, 고령자 돌봄 서비스 제공 현황 파악에 활용되며, 운영주체 및 법적 설립 형태에 따른 비교 분석도 가능합니다. 복지 수요자 접근성 분석, 민간 중심의 노인복지 운영 구조 진단 등에 기초자료로 사용될 수 있는 중요 사회복지 데이터입니다.
