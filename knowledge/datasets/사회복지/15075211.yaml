summary_user: 대전광역시 서구 관내 아동복지시설의 시설 수, 입소자·퇴소자 수, 연말 현재 생활 인원을 연도별로 집계한 1.3KB 규모의 소형 CSV 통계로, 합계는 남·여로 나뉘고 양육시설·자립지원시설·보호치료시설·기타 유형별 수치가 따로 담긴다. 지역 복지 담당자나 분석가가 '서구에서 시설 보호를 받는 아동이 해마다 늘고 있는가, 양육시설과 자립지원시설의 입퇴소 흐름은 어떻게 다른가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 자료와는 연도(연별)를 기준으로 맞추거나, 같은 기관의 다른 통계 또는 사회복지시설 공통 마스터와 시설 유형 이름으로 대응시켜 이어 쓴다.
description_portal: 이 데이터는 대전광역시 서구 관내 아동복지시설의 입·퇴소자 현황과 연말 기준 생활 인원 규모를 연도별로 정리한 자료입니다. 시설 수, 입소자 및 퇴소자 현황, 연말 현재 생활 인원 등의 정보를 통해 아동복지시설 이용 현황과 인원 변동 추이를 파악할 수 있도록 구성되어 있습니다.데이터에는 전체 아동복지시설을 기준으로 한 시설 수, 입소자 수와 퇴소자 수, 연말 현재 시설에서 생활 중인 인원이 포함되어 있으며, 입소자·퇴소자·연말 생활 인원은 각각 남·여 성별로 구분된 수치가 함께 제공됩니다. 이를 통해 연도별 아동 보호 규모의 변화와 성별 분포 현황을 함께 확인할 수 있습니다.또한 전체 합계와 별도로 양육시설에 대한 시설 수, 입소자 수, 퇴소자 수, 연말 현재 생활 인원 항목이 구분되어 제공되어, 아동복지시설 중 양육시설의 운영 현황을 보다 명확하게 파악할 수 있도록 구성되어 있습니다.이 자료는 아동복지시설의 운영 현황과 이용 규모를 종합적으로 파악하기 위한 기초 통계 자료로 활용될 수 있습니다.
