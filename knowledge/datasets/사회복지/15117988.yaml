summary_user: 1365자원봉사포털에 등록된 전국 자원봉사 프로그램과 캠페인을 활동 한 건씩 담은 파일로, 봉사활동명·봉사기간과 시간·모집기간·모집인원과 신청인원·봉사분야·봉사자 유형·모집기관·봉사장소와 위도·경도를 포함한다. 자원봉사자가 우리 동네 근처에서 모집 중인 봉사활동을 찾거나, 분석가가 지역·분야별로 모집인원 대비 신청인원이 얼마나 되는지 따져보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 모집·등록기관 이름이나 봉사장소 좌표·주소를 기준으로 맞춰 이어 써야 한다.
description_portal: '- 행정안전부에서 운영 및 관리하고 한국중앙자원봉사센터, 지방자치단체 자원봉사센터에서 자원봉사 일감 등록, 봉사 실적 등록 등을 수행하는 1365자원봉사시스템에서 관리하는 데이터로 1365자원봉사포털에서 추출하여 데이터를 제공합니다.- 해당 데이터는 자원봉사 프로그램 및 캠페인에 대한 내용으로 봉사활동명, 봉사기간, 모집기간, 모집인원, 신청인원, 봉사분야, 봉사자 유형. 모집기관, 등록기관, 봉사장소, 활동구분, 위도 및 경도 등의 항목을 제공합니다.- 해당 데이터는 1365자원봉사포털에 등록된 봉사활동을 기준으로 하며, 자원봉사 프로그램과 캠페인의 세부정보를 제공합니다.'
