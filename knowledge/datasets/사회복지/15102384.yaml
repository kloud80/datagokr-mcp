summary_user: 경상남도 내 장애인복지관과, 복지관이 없는 군 지역의 장애인복지센터를 시설 한 곳당 한 행으로 담은 목록 파일로, 관할기관·시설명·전화번호·개설일자·도로명/지번 주소·위경도를 포함한다. 장애인 당사자나 가족이 '우리 시군에서 가장 가까운 장애인복지관이나 복지센터는 어디인가'를 찾을 때, 분석가가 시군별 장애인 복지시설 배치를 지도에 표시할 때 쓴다. 법정동코드(bjd_cd)와 행정동코드를 담고 있어 법정동 단위 인구·장애인 등록 통계나 다른 복지시설 목록과 지역 기준으로 이어 쓰고, 위경도로 공간 분석에도 붙인다.
limits: 경상남도 한 시도만 다루는 작은 파일(약 4KB)이라 다른 시도와 비교하려면 별도 데이터가 필요하다. 포털 설명상 집계되지 않은 항목은 공란으로 되어 있어 빈 값이 곧 '해당 없음'을 뜻하지는 않는다.
