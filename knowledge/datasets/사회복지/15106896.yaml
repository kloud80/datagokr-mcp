summary_user: 국민연금기금의 운용 자산군(구분)별 수익률과 수익금을 금액가중수익률 기준으로 정리한 집계표로, 당해년도 기간 잠정 수익률과 전년도·최근 3개년·5개년·1988년 설정 이후 수익률(퍼센트)과 수익금(십억 원)을 담는다. 연금 가입자나 분석가가 "국민연금기금은 주식·채권·대체투자 등 자산별로 최근 몇 년간 얼마를 벌었나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자산군 이름을 맞추거나 같은 기관(국민연금공단)의 기금 운용 데이터와 나란히 놓고 비교하는 방식으로 이어 쓴다.
description_portal: 금액가중수익률 기준으로 작성된 월말 기준 국민연금기금의 운용 자산별 수익률 및 수익금 데이터입니다.당해년도, 전년도 말, 최근 3개년·5개년, 기금설립 후 전년도까지의 설정후 수익률 및 수익금을 제공합니다.수익금은 반올림으로 세부내역 및 합계의 단수차이가 발생할 수 있습니다.대체투자 연중 수익률은 공정가치 평가 반영 전 수익률이며, 연말 수익률은 반영후 수익률 입니다.기금운용본부는 글로벌 금융시장의 불확실성이 높아지는 상황에서도 국민연금기금 재정의 장기적인 안정을 유지하기 위해 운용성과를 높일 수 있도록 노력하고 있습니다.
