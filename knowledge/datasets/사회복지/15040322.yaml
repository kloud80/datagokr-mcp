summary_user: 서울특별시 성북구 관내 노인복지시설을 시설 한 곳당 한 행으로 담은 파일 데이터로, 구분·시설명·주소·전화번호·운영주체·기준일자·위도·경도·행정동을 담는다(포털 설명상 2021년 1월 1일 기준, CSV 약 9KB). 성북구 주민이나 가족이 "우리 동네(행정동)에 경로당이나 노인복지관이 어디 있고 누가 운영하나"를 찾거나, 분석가가 행정동별 노인복지시설 분포와 접근성을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소·행정동 이름을 맞추거나 위도·경도로 공간 결합해 잇고, 장기요양기관이나 사회복지시설 목록과는 이름 매핑으로 연결한다.
description_portal: 이 데이터는 2021년 1월 1일 기준으로 서울특별시 성북구에 위치한 노인복지시설의 현황을 정리한 자료입니다. 시설의 구분, 시설명, 주소, 전화번호, 운영주체, 기준일자, 위도·경도 좌표, 행정동 등 기본 정보로 구성되어 있어 성북구 관내 노인여가복지시설의 위치와 운영 주체를 명확하게 파악할 수 있습니다. 도로명주소와 함께 제공되는 위도·경도 정보는 시설 위치를 지도 기반으로 확인하거나 공간 분석에 활용하기 적합하며, 전화번호는 시설 이용 문의 및 안내에 활용될 수 있습니다. 행정동 정보는 지역별 복지시설 분포를 비교하는 데 유용하며, 시설별 운영주체 정보는 복지서비스 제공 방식과 기관 특성을 이해하는 데 도움을 줍니다. 이 자료는 성북구 노인복지 인프라 현황을 종합적으로 이해하고 지역별 서비스 접근성을 분석하는 데 활용할 수 있는 기초 데이터입니다.
