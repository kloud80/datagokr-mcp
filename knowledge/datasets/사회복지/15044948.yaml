summary_user: 대구광역시 달성군 관내 경로당을 한 곳씩 담은 파일로, 경로당 명칭·소재지주소·전화번호와 위도·경도 좌표, 데이터기준일자를 제공한다. 달성군 주민이나 복지 담당자가 '우리 동네에서 가까운 경로당은 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 읍·면별 경로당 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 시설 명칭을 맞춰 잇고, 같은 지역의 노인복지시설·장기요양기관 자료와 시군구 단위 지역 통계에 붙여 쓴다.
