description_portal: '○ 통계개요* 통계명 : 맞벌이 가구 현황* 통계종류 : 서울시 맞벌이가구 현황을 제공하는 지정ㆍ조사통계* 작성목적 : 지역 고용정책 수립에 필요한 고용현황을 파악할 수 있는 기본 통계를 생산·제공* 조사체계 : 조사대상(가구) → 지방통계청(사무소) → 통계청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 유배우가구, 맞벌이가구 및 맞벌이가구 비율 등○ 용어설명* 가구 : 1인 또는 2인 이상이 모여서 취사, 취침 등 생계를 같이 하는 생활단위* 가구주 : 주민등록상의 세대주와는 관계없이 실질적으로 가구를 대표하고 가계를 책임지고 있는 생계책임자* 유배우가구 : 가구주의 혼인상태가 [배우자 있음]인 가구* 맞벌이 가구 : 유배우 가구 중 가구주와 배우자가 모두 취업자인 가구○ 기 타* 맞벌이가구는 동거여부와 상관없이 부부(가구주와 배우자)가 모두 취업자 개념에 해당하는 가구이며,가구주와 배우자 모두 외국인인 가구는 제외하였음* 통계표 수록된 자료는 반올림되어 총계와 일치하지 않을 수 있음* 통계청에서 매년 하반기에 실시하는 지역별고용조사의 부가 항목(맞벌이 가구) 자료를 이용하여 집계한 결과임.* 비율 = (맞벌이가구 / 유배우 가구) * 100* 2011년, 2012년은 2분기(6월), 2013년 이후는 하반기(10월) 조사○ 출 처 : 통계청 사회통계국 고용통계과'
