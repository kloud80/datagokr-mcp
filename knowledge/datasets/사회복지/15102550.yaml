description_portal: 사립학교교직원연금공단 장해연금수급자 평균연금수령액 데이터는 직무상장해연금과 비직무상장해연금으로 구성된 장해연금을 수급중인 수급자의 평균 연금 수령액을 정리한 통계자료 입니다. 이 데이터는 장해연금 수급자의 평균 월 수령액을 연도별 장해연금(비직무상장해연금·직무상장해연금)으로 구분하여 제공하고 있기 때문에 수급자의 연금 종류에 따른 연금 수령 수준을 비교할 수 있는 데이터입니다.이 정보는 장해연금 제도의 운영 현황을 파악하고 정책 수립 및 개선에 활용될 수 있습니다.또한 연금 수급자 연금수령액을 분석하여 향후 장해연금 재정 추계 및 제도 개선 방안 마련에 기여할 수 있습니다.
