summary_user: 대구광역시 수성구 안의 장기요양기관(주야간보호·방문요양·재가복지센터 등)을 기관 한 곳당 한 행으로 정리한 목록 파일로, 기관명·주소·전화번호·데이터 기준일을 담는다(CSV 약 22KB, 범위는 수성구 한 개 시군구). 수성구에 사는 가족이 집 근처에서 부모님을 맡길 주간보호센터나 방문요양 기관을 찾아 연락처를 확인하거나, 구청·분석가가 동네별 요양 인프라 분포를 살피는 데 쓴다. 기관 코드 같은 공통 조인 키가 없어 건강보험 장기요양기관 정보나 다른 노인복지시설 목록과는 기관명·주소를 맞춰 이어 붙여야 하고, 주소를 좌표로 바꾸면 지역 통계와 함께 볼 수 있다.
limits: 전역 조인 키가 없어 다른 기관 데이터와는 이름·주소 매칭으로만 연결되므로 표기 차이로 인한 누락·오매칭에 주의한다. 수성구 한 곳만 담고 있어 대구시 전체나 다른 구와의 비교에는 별도 자료가 필요하다.
