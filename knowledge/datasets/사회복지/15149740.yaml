summary_user: 청소년 자원봉사 터전동아리가 신규 회원을 모집하는 공고를 모집 건별로 담으며, 모집 인원·모집 시작일과 종료일·모집 대상·동아리 설명·활동 내용·안내사항·안내 사이트 주소를 포함한다. 청소년이나 학부모가 지금 회원을 모집 중인 자원봉사 동아리가 어디인지, 누구를 몇 명 뽑는지 확인할 때 쓰고, 기관 담당자는 모집 현황을 점검하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 동아리 정보와는 단체동호회번호(grpClubNo)로 맞춰 보거나 동아리 이름으로 연결해야 한다.
limits: 다른 데이터셋과 공통으로 쓰는 조인 키가 없어 지역 통계 등과 바로 잇기 어렵고, 이름이나 같은 기관 코드로만 연결된다. 모집 공고 단위로 생성된 뒤 바뀌지 않는 이벤트성 자료로 분류되어 있어, 모집 마감 이후의 실제 가입 결과나 상태 변화는 확인할 수 없다.
