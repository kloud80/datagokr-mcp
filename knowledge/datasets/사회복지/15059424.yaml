summary_user: 경기도 시군별 장애인 출산비용 지원 현황을 연도(STD_YY)와 시군 단위로 집계한 자료로, 배정 인원, 실제 지원 인원, 단태아·다태아·유산·사산별 지원 인원, 전년도·당해년도 출산 인원, 배정 대비 지원 비율을 담는다. 복지 담당자나 분석가가 '어느 시군에서 배정 인원 대비 장애인 출산비용 지원 실적이 낮은가'를 확인하고 예산 집행과 지원 정책을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드·시군명(SIGUN_NM)을 이름이나 코드로 매핑해 연도별로 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 시군별 장애인 출산비용 지원 현황을 태아 기준으로 집계한 자료입니다. 각 연도 기준으로 배정된 인원 수와 실제 지원 인원 수, 단태아 및 다태아, 유산·사산 등 출산 유형별 지원 인원 수, 이전년도 및 당해년도 출산 인원 수, 배정 인원 대비 지원 인원 비율(%)을 포함합니다. 이 데이터는 장애인가정의 출산 관련 복지지원 실태를 지역 단위로 파악하는 데 유용하며, 예산 집행 효율성 분석, 지원 정책 수립, 보건복지서비스 개선 등을 위한 기초 자료로 활용될 수 있습니다.* 지원인원의 경우 태아 기준 현황임
