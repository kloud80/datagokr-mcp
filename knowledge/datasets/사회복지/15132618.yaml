description_portal: 대구광역시 및 구군에서 운영하고 있는 공공형 실내놀이터(실내놀이시설) 현황 자료입니다. 우리 지역에서 어린이와 안전하게 놀이를 할수 있는 공공형 실내놀이시설을 확인할 수 있는 자료입니다. 이 실내놀이시설은 대구광역시 또는 각 구(군)에서 직영 또는 위탁하여 운영하고 있습니다. 이 실내놀이시설 데이터에 포함된 자료는 시설명, 시설 주소, 시설 연면적, 운영일, 전화번호 를 포함하고 있습니다. 이 데이터에 포함된 자료 중 시설 연면적은 실내놀이터(실내놀이시설)의 면적을 포함한 면적으로 전체 면적이 실내놀이터(실내놀이시설) 면적이 아닙니다. 우리 어린이들과 안전하게 놀이할 수 있는 공공 실내놀이시설을 찾으실수 있습니다. 이 데이터에는 대구광역시 내의 실내놀이터(실내놀이시설) 중 공공형 실내 놀이시설이 아닌 민간놀이시설 현황은 포함하고 있지 않습니다. 각 놀이시설에 대한 보다 상세한 시설현황과 이용방법은 각 시설의 홈페이지를 참고해 주시기 바랍니다.
