summary_user: 충청남도 금산군 관내 장기요양기관을 기관 한 곳당 한 행으로 담은 목록으로, 기관명·급여종류(방문요양·방문목욕·주야간보호·노인요양시설 등)·전화번호·도로명주소·데이터기준일을 수록한다. 금산군 주민이나 보호자가 '우리 동네에서 방문요양이나 주야간보호를 하는 기관이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 군 단위 돌봄 서비스 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키나 기관 코드가 없어 건강보험 장기요양기관 정보나 다른 노인복지시설 목록과는 기관명·주소 매칭으로만 이어 쓸 수 있다.
description_portal: 본 데이터는 충청남도 금산군 관내 장기요양기관에 대한 정보를 제공합니다. 2025년 7월 30일 기준 총 76개 기관의 장기요양기관, 급여종류, 전화번호, 방문목욕차량 유무, 지번 주소, 도로명 주소 데이터가 수록되어 있습니다. 급여종류에는 방문요양, 방문목욕, 주야간보호, 노인요양시설 등이 있으며, 주요 기관으로는 새금산데이케어, 기쁨요양복지센터, 어울림노인재가센터 등이 있습니다. 해당 데이터는 금산군 지역 내 노인 장기요양 서비스 현황 파악, 복지 정책 수립, 고령자 돌봄 체계 강화 등에 활용될 수 있으며, 매년 업데이트 됩니다. 일부 전화번호는 개인정보 보호 등의 이유로 제공되지 않습니다.
