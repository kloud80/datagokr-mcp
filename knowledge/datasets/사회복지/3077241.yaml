summary_user: 산재보험 업종코드별로 사업종류(대분류)와 세목, 적용 보험요율(퍼센트), 해당 업종에 속하는 사업 내용 예시를 담은 전국 단위 기준표 파일이다(CSV 약 146KB). 사업주나 노무 담당자가 "우리 사업장은 어느 산재보험 업종에 해당하고 요율이 몇 퍼센트인가"를 확인할 때 쓰고, 분석가는 업종별 위험도와 요율 수준을 비교하는 데 쓴다. 업종코드(comwel_iaci_biz_type_cd)를 키로 근로복지공단의 다른 산재보험 업종별 자료와 이어 쓰며, 사업자번호나 사회적기업 인증번호 같은 기업 단위 키는 이 표에 없다.
description_portal: 이 데이터는 산업재해보상보험에 적용되는 사업 종류별 보험요율과 해당 사업 종류를 구분하는 내용 예시 정보를 상세하게 담고 있습니다. 통계 항목은 업종코드, 사업종류(대분류), 사업종류(세목), 그리고 해당 사업에 적용되는 보험요율(퍼센트) 및 내용 예시로 구성되어 있습니다. 이 자료는 산재보험료 산정의 기본이 되는 기준 정보를 투명하게 공개하며, 각 산업의 위험률에 따라 보험요율이 어떻게 책정되는지를 명확하게 보여줍니다. 특히, 상세한 내용 예시를 통해 사업주 및 이해관계자들이 자신의 사업 종류를 정확하게 분류하고 보험료를 산정하는 데 필수적인 참고 자료라고 판단됩니다.본 데이터는 산재보험료율 책정의 공정성 및 산업 안전 정책 연구에 매우 중요한 자료입니다. 정책 입안자는 이 자료를 활용하여 산업별 보험요율의 변동 추이를 분석함으로써, 특정 산업 분야의 재해 위험도가 사회 전반적으로 어떻게 변화하고 있는지 진단할 수 있습니다. 이를 통해 고위험 산업군에 대한 재해 예방 지원을 강화하거나, 저위험 산업에 대한 보험료 부담을 경감하는 등 합리적인 요율 정책을 수립하는 데 활용할 수 있습니다. 또한, 연구자는 이 사업 종류별 분류 기준을 활용하여 업종별 위험도에 따른 보험료의 적정성을 검토하고, 제도의 효율적 운영 방안을 모색하는 데 기여할 수 있다고 판단됩니다.
