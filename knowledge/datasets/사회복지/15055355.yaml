summary_user: 서울 서대문구 관내 여성 관련 복지시설을 시설 한 곳당 한 행으로 시설명·소재지·전화번호를 담은 소규모 목록 파일(CSV, 413바이트)이다. 서대문구 주민이나 상담·지원 실무자가 '우리 구에 한부모·여성 지원 시설이 어디 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 시설명·주소를 맞춰 보는 방식으로만 이어 쓰며, 사회복지시설 공통 마스터를 참조하는 보조 자료로 다룬다.
