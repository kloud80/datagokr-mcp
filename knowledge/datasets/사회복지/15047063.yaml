description_portal: '○ 통계개요* 통계명 : 여성복지시설* 통계종류 : 서울시 여성복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「모부자복지법」「성매매방지및피해자보호등에 관한 법률」등에 의거설치ㆍ운영되는 여성복지시설* 작성목적 : 여성복지시설 설치신고를 마친 여성복지시설의 수, 생활인원을 집계하여적정수의 시설수요와 충족율을 분석하고, 분석결과에 따른 정책 수립 및평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 여성가족정책담당관* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 여성복지시설(한부모가족 복지시설, 소외여성복지시설)의 시설수 및 생활인원수 현황○ 용어설명* 한부모가족 복지시설 : 모자보호시설, 모자일시보호시설, 미혼모자 공동생활가정,미혼모자시설, 부자공동생활 가정 등* 소외여성 복지시설 : 성매매피해자보호시설, 가정폭력피해자보호시설, 성폭력피해자보호시설, 여성부랑인시설○ 기 타* 미혼모자 공동생활가정에 미혼모 공동생활가정 포함* 소외여성 복지시설 생활인원은 정원기준임* 기타에 해당하는 부랑인시설은 "용인시"에 위치함○ 출 처 : 서울특별시 여성정책담당관'
