description_portal: '부산광역시 동구 무료급식소  및 경로식당 현황부산 동구에서는 노인 무료급식을 제공하기 위하여 4개의 기관에서 경로식당을 운영하고 있습니다급식시설은 다음과 같습니다1. 동구노인복지관 : 동구 홍곡중로5번길 24(051-440-7887)2. 동구노인복지관 분관 어르신 행복식당 : 동구 초량남로11-1(051-714-6092)3. 자성대노인복지관 : 동구 자성로140번길 32(051-632-7597)4. 동구무료급식소 : 동구 증산로51(051-465-5151)경로식당은 주5회 운영되며 중식을 제공합니다. 기초생활수급자, 차상위계층 등 저소득 어르신은 무료로 이용가능하며, 일정 수준 능력을 갖춘 어르신들은 3,500원의 실비 납부 후 이용이 가능하십니다일반적인 식사제공 이외에도 복지관 후원에 따른 각종 특식도 제공되고 있습니다(명절특식, 복날 특식 등)노인 무료급식 신청은 해당 급식시설에 문의하시면 자세한 설명을 들을 수 있습니다. 감사합니다.'
