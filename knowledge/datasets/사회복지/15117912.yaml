summary_user: 경기도 이동노동자 쉼터를 한 곳당 한 행으로 담은 목록으로, 쉼터 명칭(restarer_nm)·운영시간·소재지 주소·연락처를 담는다. 택배기사나 대리운전기사가 "지금 근처에서 이용할 수 있는 쉼터가 어디이고 몇 시까지 여는가"를 확인하거나, 분석가가 쉼터 배치 현황을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 쉼터 이름을 맞춰서만 이을 수 있다.
description_portal: '대기시간 중 휴게공간이 없는 이동노동자의 휴게권 보장 및 노동환경 개선을 위한 이동노동자 쉼터 현황입니다.쉼터의 명칭, 운영시간, 소재지 주소, 연락처 등의 정보를 포함하고 있습니다. 해당 데이터는 택배기사, 대리운전기사 등 이동노동자들이 휴식과 복지서비스를 제공받을 수 있는 거점시설의 위치와 이용 가능 시간대를 파악하는 데 유용합니다. 쉼터의 운영시간은 일부가 24시간으로 제공됩니다.각 쉼터에 대한 상세 시설 정보는 경기도 노동권익센터를 참고해주시기 바랍니다.노동권익센터 쉼터 상세 정보 : https://labor.gg.go.kr/move-worker01/move-worker-sub01-01/'
