summary_user: 경기도 안에서 운영 중인 어르신 무료급식소를 시설 한 곳당 한 행으로 담는 현황 자료로, 시군명·시설명·관리기관과 전화번호·급식 장소·대상·시간·휴무일·운영 시작일, 지번·도로명 주소와 WGS84 위경도를 포함한다. 60세 이상 노인이나 저소득층 가족이 집 근처 무료급식소가 어디에 있고 언제 밥을 주는지 찾을 때 쓰고, 분석가는 시군별 급식소 분포와 접근성을 볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 데이터와는 시군명(sigun_nm)·주소 같은 이름 매핑이나 위경도 좌표로만 이어 쓴다.
description_portal: 본 데이터는 경기도 내 운영 중인 어르신 무료급식소의 현황을 수록한 자료입니다.주요 항목으로 시설명, 관리기관명, 관리기관전화번호, 급식대상, 급식시간, 급식일, 운영시작일자, 소재지지번주소, 소재지도로명주소 및 WGS84위도, WGS84경도 등의 위치정보가 포함되어 있습니다. 급식대상은 60세 이상 노인과 저소득층을 중심으로 하고 있으며, 급식시간 및 요일 정보가 함께 제공되어 복지 서비스 운영 실태를 파악할 수 있습니다. 본 데이터는 노인 복지정책 수립, 복지시설 접근성 분석, 공공서비스 제공 효율성 연구, 지역사회 돌봄체계 구축 등에 활용될 수 있으며, 활용 시 최신 운영현황 및 기관정보 변동 여부를 확인하는 것이 필요합니다.
