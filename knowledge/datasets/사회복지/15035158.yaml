description_portal: 부산광역시 동구_지역아동센터 현황 정보입니다.2025년 11월 12일 현재 기준으로 관리되고 있는 자료입니다.부산광역시 동구 내 운영중인 지역아동센터 18개소에 대한 자료데이터를 제공합니다.자료데이터는 동구 내 지역아동센터의 센터명, 주소, 정원, 현원으로 구성되어 있습니다.지역아동센터는 지역사회 아동의 보호·교육, 안전한 놀이와 오락의 제공, 보호자와 지역사회의 연계 등 아동의 건전육성을 위하여 종합적인 아동복지서비스를 제공하는 사회복지시설입니다.현원의 경우 센터 상황에 따라 수시로 변동 될 가능성이 높으며 센터별 등록 대기 아동이 있을 수 있어이용등록 희망 시에는 개별 지역아동센터 문의 및 상담 해주시기 바랍니다.
