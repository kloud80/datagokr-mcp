summary_user: 경기도 특수학급 수를 기준년도와 학교유형(국립·공립·사립)별로 묶어 전체 학급과 유치원·초등·중·고등·전공과 과정별 학급 수로 담은 시도 단위 집계표다. 특수교육 연구자나 정책 담당자가 '경기도에서 국공사립별로 어느 학교급에 특수학급이 얼마나 설치돼 있고 해마다 어떻게 바뀌나'를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 특수교육 통계와는 기준년도(STD_YY)와 학교유형명을 맞춰 이어 붙여야 한다.
description_portal: 특수학급수 집계현황 데이터는 경기도 내 특수학급 설치 현황을 학교유형별(국립, 공립, 사립)과 학교 과정별로 분류한 교육·복지 통계자료입니다. 주요 항목에는 기준년도, 학교유형명, 전체 학급수, 유치원 학급수, 초등학교 학급수, 중학교 학급수, 고등학교 학급수, 전공과 학급수 등이 포함됩니다. 본 자료는 매년 6월 말 기준으로 작성되며, 특수교육 대상 학생을 위한 학급 인프라 현황을 지역별·학교유형별로 파악할 수 있습니다. 이를 통해 국공사립 간 학급 운영 규모 비교, 학교급별 특수학급 분포 분석, 특수교육 수요 예측 등 다양한 활용이 가능합니다. 특히 교육부 특수교육통계와 연계되어 정책적 활용도가 높으며, 특수학급 확충 계획, 예산 배분, 교육 복지정책 개선의 기초자료로 제공됩니다. 또한 누림센터가 관리하여 지역 맞춤형 특수교육 지원 체계 구축에도 중요한 역할을 합니다.
