summary_user: 서울 중랑구에 있는 사회적기업을 기업 한 곳당 한 행으로 담은 파일(약 3.5KB CSV)로, 기관명·사회서비스분야·주된목적(일자리제공형·창의혁신형)·사업내용·인증(지정) 여부와 일자·번호·대표자·연락처·주소를 담는다. 중랑구 주민이나 구매 담당자가 '우리 구에서 청소·환경 분야 사회적기업은 어디이고 언제 인증을 받았나'를 찾는 데 쓴다. 전역 조인 키는 없으므로 다른 사회적기업 목록과는 인증(지정)번호나 기관명으로, 지도·행정구역 데이터와는 도로명·지번 주소로 맞춰 이어 쓴다.
description_portal: '중랑구 사회적기업에관한 정보입니다. 이 데이터는 기관명, 사회서비스분야, 주된목적, 사업내용, 인증정보, 대표자명, 전화번호 ,주소, 홈페이지 주소 등을 제공합니다. 사회서비스 분야에는 예술관광, 사업시설관리, 환경, 사회복지, 청소 등이 있습니다. 주된 목적에는 일자리제공형과 창의혁신형이 있습니다. 인증정보는 인증(지정)여부: Y, N, 인증(지정)일자: YYYY-MM-DD, 인증(지정)번호: 예시) 제YYYY-123호 가 있습니다. 자세한 사항은 하단의 파일을 다운받아 내용을 확인하여 주시기 바랍니다. 감사합니다.'
