description_portal: 서울시설공단이 운영하는 서울시립승화원의 용미리제1묘지 내 시립 자연장시설에서의 최근 5개년 연도별 자연장 안장 통계자료입니다. 본 자료는 자연장지에 안장된 유골의 현황을 종합적으로 분석한 것으로, 일반(대인, 소인 포함) 안장은 물론, 개장유골과 시립 봉안시설에서 반환된 유골까지 포함하여 제공되며, 별도 항목으로 구분하지 않고 모두 일반 항목에 통합하여 수록하였습니다. 해당 통계는 매년 자연장 시설을 이용한 안장 건수를 기반으로 연도별 변화를 보여주며, 이를 통해 장사문화의 변화 추이를 확인하고, 자연장에 대한 수요를 분석하는 데 활용될 수 있습니다. 특히 자연장 이용자 수의 누적안장건수와 당해안장건수, 그리고 일반 항목 중 대인과 소인 구분 정보를 함께 제공하여 보다 세분화된 분석이 가능하도록 구성하였습니다. 공공기관이나 연구기관, 지자체, 학계, 언론, 일반 국민 등 다양한 수요자가 자연장 이용 실태를 파악하고, 이를 기반으로 관련 정책을 수립하거나 연구를 수행하는 데 기초자료로 활용할 수 있습니다. 또한 자연장 문화의 확산 및 친환경 장례 방식에 대한 사회적 인식 확대를 도모하고자 공개하는 데이터로서, 장사시설 운영의 효율성 제고와 더불어 미래 장사정책 수립에 있어서도 유의미한 자료가 될 수 있습니다. 본 데이터는 표 형식으로 구성되어 있으며, 각 연도별로 누적안장건수, 당해안장건수, 일반_대인, 일반_소인 항목을 중심으로 정리되어 있어 시계열 분석 및 통계처리에 용이한 구조로 제공됩니다.
