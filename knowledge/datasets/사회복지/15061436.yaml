description_portal: 한국사회보장정보원에서 1년 주기로 제공하는 통계자료로, 성별별, 시도별로 매월 차상위본인부담경감대상 수급자수가 얼마나 되는지에 대한 정보를 담고 있습니다.   데이터 구성은 성별별, 각 시도별로 매월 차상위본인부담경감대상 수급자수 항목으로 구성되어 있습니다.   본 통계는 사회보장정보시스템과 사회서비스전자바우처시스템 자료를 기반으로 작성하였습니다. 수록된 통계 자료에 대한 문의는 한국사회보장정보원 사회보장정보연구소 데이터개방부로 문의 하시기 바랍니다.   성별별, 지역별 차상위본인부담경감대상 수급자수를 공시적으로 분석하거나 한 지역의 차상위본인부담경감대상 수급자수의 변화를 통시적으로 분석할 때 활용하실 수 있습니다.
