summary_user: 중소벤처기업진흥공단이 사회적기업·예비사회적기업·협동조합·마을기업·자활기업·소셜벤처기업 등 사회적경제기업에 내준 정책자금 대출을 건별(일련번호)로 지역·업력·업종·대출년월·대출금액(백만원)과 함께 담은 전국 범위의 파일 데이터다. 사회적경제 정책 분석가가 "어느 지역·업종의, 업력이 몇 년인 사회적경제기업에 정책자금이 얼마나 갔는가"를 따질 때 쓴다. 기업 인증번호나 사업자번호 같은 전역 조인 키가 없어 개별 기업 데이터와는 바로 붙지 않고, 지역명·업종명을 이름으로 맞춰 지역별·업종별 집계 수준에서만 다른 통계와 잇는다.
limits: 기업 식별자(인증번호·사업자번호)가 없어 어느 기업이 받았는지 알 수 없고 사회적기업 인증 현황 같은 기업 축 데이터와 건별로 연결하지 못한다. 공간 좌표가 없어 지역은 시도 이름 수준으로만 다룬다.
