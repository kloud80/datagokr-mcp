summary_user: 경기도 내 청소년 쉼터를 시설 한 곳당 한 행으로 담은 건별 현황으로, 쉼터명·시군·주소·좌표·연락처·개소일·운영기관과 운영형태(일시·단기·중장기)·대상 성별·설치주체를 포함한다. 가출·위기 청소년이나 보호자·상담기관이 '우리 시군에서 가까운 여자 청소년 단기 쉼터는 어디인가'를 찾거나, 분석가가 시군별 쉼터 분포와 유형 공백을 살피는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 주소·위경도로 시군구 단위 지역 통계나 다른 청소년 시설 데이터와 이름·좌표 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내에서 운영 중인 청소년 쉼터의 세부 현황을 수록한 자료로, 가출·위기 청소년을 보호하고 자립을 지원하는 복지시설의 정보를 포함합니다. 각 쉼터의 명칭, 위치(도로명·지번 주소, 우편번호, 위도·경도), 연락처, 개소일, 운영기관 및 대표자명, 운영형태(일시·단기·중장기), 대상 성별(남자·여자·공용), 설치주체(지자체, 민간 등)에 대한 정보가 제공됩니다. 해당 데이터는 청소년 쉼터의 공간 분포 및 유형별 운영 실태를 파악하고, 정책 수립, 예산 배분, 복지 수요 예측 등에 활용될 수 있으며, 연 1회 갱신됩니다. 경기도 청소년과가 관리하며, 상업적 활용 및 콘텐츠 변경이 가능합니다.
