summary_user: 경기도 내 설립목적이 아동복지인 사회복지법인을 법인 한 건씩 담은 현황으로, 집계년월(SUM_YM), 시군명·시군코드, 법인명, 대표자명, 설립목적으로 구성되며 위치 좌표 같은 공간 정보는 없다. 아동복지 분야 법인과 협력하거나 지원 대상을 찾는 지자체 담당자·연구자가 '우리 시군에는 어떤 아동복지 법인이 있고 대표자는 누구인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 시군명·시군코드나 법인명을 맞추는 방식으로만 이어 쓴다.
description_portal: 경기도 내의 아동복지 관련 사회복지법인에 대한 법인명, 설립목적 등의 현황입니다.※ 설립목적이 "아동복지"인 사회복지법인 현황입니다.이 데이터는 경기도 내 아이돌봄서비스를 제공하는 공식 기관들의 현황을 정리한 자료입니다. 주요 항목은 시군명, 기관명, 기관전화번호, 소재지 지번주소 및 도로명주소, 우편번호, WGS84 좌표(위도·경도) 등으로 구성되어 있으며, ‘가족센터’ 또는 ‘건강가정지원센터’를 중심으로 아이돌봄 서비스를 제공하고 있습니다. 해당 서비스는 맞벌이 가정, 한부모 가정, 긴급돌봄이 필요한 가정을 위한 아이돌보미 연계 지원을 목적으로 하며, 각 기관은 돌봄 인력의 관리 및 배치, 상담, 서비스 운영을 담당합니다. 이 데이터는 지역별 돌봄 인프라 현황 파악, 아동복지 정책 수립, 돌봄 서비스 접근성 분석, 가족친화 정책 설계 등에 활용될 수 있으며, 위경도 좌표를 통해 GIS 기반 분석도 가능합니다. 본 자료는 여성가족부 및 각 지자체 가족정책 부서가 수집한 공공데이터입니다.
