summary_user: 전북특별자치도 안의 요양보호사 교육기관을 기관 한 곳당 한 행으로 정리한 목록으로, 교육원 명칭·소재지·전화번호·우편번호를 담는다(CSV 약 3KB 규모의 작은 파일). 요양보호사 자격을 준비하는 예비 교육생이 "우리 동네 가까운 교육원은 어디이고 어디로 문의하나"를 찾을 때, 또는 지역 돌봄 인력 양성 기관의 분포를 볼 때 쓴다. 기관코드 같은 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 기관명이나 주소(소재지·우편번호)를 맞춰서만 이어 쓴다.
