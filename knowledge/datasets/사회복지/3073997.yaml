summary_user: 부산광역시 중구의 의료급여 대상자를 행정동(읍면동)별로 집계해 국민기초 1종·2종, 차상위 특례, 국가유공자, 북한이탈주민, 이재민, 행려환자 등 대상 유형마다 세대 수와 인원을 담은 작은 CSV 파일(1,233바이트)이다. 지역 복지 담당자나 분석가가 중구의 어느 동에 의료급여 1종 수급자가 많은지, 어떤 대상 유형이 몰려 있는지를 보고 복지 자원·시설 배치를 검토하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 행정동 이름을 맞추거나 같은 기관의 자료끼리만 이어 쓴다.
description_portal: 행정동별 의료급여 대상자 인원 및 세대 현황에 대한 데이터로 대상 유형은 국민기초(1종, 2종), 군입대자(1종, 2종), 차상위의료급여특례(2종, 18세미만), 국내입양아동, 국가유공자, 광주민주화운동관련자, 중요무형문화재보유자, 북한이탈주민, 이재민, 의상자및의사자의유족, 행려환자, 보장시설수급자, 기타 입니다.
