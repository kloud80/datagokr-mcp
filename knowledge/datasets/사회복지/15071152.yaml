summary_user: 부산광역시 노인요양시설(장기요양기관)을 시설 한 곳당 한 행으로 담은 파일로, 구군·급여종류·설립연도·연면적·전화번호·주소와 위도·경도를 포함한다(csv 약 17KB). 보호자나 복지 분석가가 "우리 구에 어떤 급여종류의 요양시설이 어디에 있고 규모는 얼마나 되나"를 확인하거나 시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 장기요양기관명·주소로 건강보험 장기요양기관 정보와 맞추거나, 구군 이름이나 좌표로 지역 통계·다른 시설 데이터와 잇는다.
