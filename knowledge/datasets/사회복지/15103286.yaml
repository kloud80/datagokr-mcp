summary_user: 인천광역시 내 장애인 주간보호시설·직업재활시설 등 낮 시간 이용시설을 시설 한 곳당 한 행으로 담은 목록으로, 군구명·기관명·시설장·소재지 주소와 종사자 수·정원·현원을 포함하며 파일 크기는 약 2.6KB의 소규모 CSV다. 장애인 가족이 거주 군구에 이용 가능한 주간시설이 어디 있는지 찾거나, 분석가가 군구별 정원 대비 현원을 비교해 시설 확충이 필요한 지역을 가늠할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 군구명이나 기관명·주소 문자열을 맞춰 이어 써야 하며, 군구별 등록장애인 수 통계와 군구명으로 붙여 인구 대비 정원을 보는 식으로 활용한다.
description_portal: '인천광역시_장애인주간 이용시설 현황 데이터는 인천시 내 등록된 장애인 주간보호시설 및 직업재활시설 등 일상생활 지원을 위한 시설들의 운영 정보와 위치 정보를 제공하는 공공데이터입니다.이 데이터는 장애인이 낮 시간 동안 이용할 수 있는 복지 서비스 인프라의 공간적 분포를 파악하고, 지역별 서비스 격차를 분석하는 데 핵심적인 기초 자료입니다.<활용성>정책 분석: 시설의 유형과 정원을 학습하여 지역별 복지 자원의 배분 적정성을 진단하고, 신규 시설의 최적 입지 및 우선 확충 지역을 추천하는 데 기여합니다.해당 데이터는 인천시 사전정보공개 또는 공공데이터포털에서 무료로 확인할 수 있습니다.'
