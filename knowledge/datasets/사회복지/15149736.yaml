summary_user: 청소년활동 신고 건별로 신고번호·활동명·프로그램 내용·참가비·인증 여부·요주의활동 여부·위탁 여부·주관기관·참여자 규모와 대상 학교급·진행 상태를 담는 전국 단위 원천 자료다. 학부모나 청소년 지도자가 특정 기관이 신고한 활동이 인증을 받았는지, 요주의 활동인지, 어느 학교급을 대상으로 하는지 확인할 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 주관기관명이나 활동 시설 번호(trngFcltNo)를 이름·코드로 맞춰 이어 써야 한다.
description_portal: 성평등가족부 청소년활동 신고 정보는 청소년 활동과 관련하여 신고된 내용을 체계적으로 기록하고 관리하기 위해 제공되는 자료입니다. 각 신고 항목, 신고 일자, 신고자 정보, 진행 상태 코드, 처리 결과 등 다양한 데이터를 포함하며, 기관에서는 이를 활용하여 신고 처리 현황 관리, 진행 상태 모니터링, 정책 분석, 행정 효율화, 참여자 안내, 프로그램 개선 등 다양한 목적으로 활용할 수 있습니다. 또한 이 자료는 청소년 활동의 적법성 확인과 참여 안전 확보, 신고 처리 과정 투명성 확보에도 중요한 근거 자료가 됩니다.
