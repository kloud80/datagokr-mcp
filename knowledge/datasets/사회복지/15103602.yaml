description_portal: 대전도시공사는 저소득층의 주거 안정을 지원하기 위해 공공임대아파트를 공급하고 있으며, 해당 임대아파트의 입주민들의 편의를 위해 아파트 단지내 상가를 임대하고 있습니다.공공임대아파트는 경제적 여건으로 인해 주거 확보가 어려운 시민들이 도심 지역에서 안정적으로 거주할 수 있도록 지원하는 사업입니다.입주대상은 소득과 주거 여건에 따라 사회적 배려계층을 중심으로 선정되며, 세대별 소득수준과 자산요건을 기준으로 세부 자격이 구분됩니다. 장애인, 고령자, 한부모가정 등은 별도 기준을 적용받아 지원받을 수 있습니다.이를 통해 주거 취약계층의 장기적이고 안정적인 생활 기반을 마련하고자 합니다.※ 자세한 사항은 홈페이지(https://www.dcco.kr/web/contents/view.do?mId=211)를 참고하시기 바랍니다.
