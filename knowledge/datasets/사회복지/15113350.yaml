description_portal: 경기도 하남시 관내에서 운영 중인 청소년 시설 현황을 수록한 자료로 지역 내 청소년을 대상으로 문화, 상담, 자립 지원 등  복지 및 활동 서비스를 제공하고 있는 청소년시설 목록입니다. 수련시설은 청소년 활동 역량 기반의 프로그램을 개발 및 운영하고 있으며 복지시설은 가정 밖 청소년의 안전한 환경과 자립 준비를 위한 프로그램을 운영하고 있습니다. 지역과 연계된 프로그램에 청소년이 주도적으로 직접 참여하고  지역사회 시민으로 역할을 실천하며 성장할 수 있도록 하는 것을 핵심 가치로 보고 있습니다. 총 6개의 시설로 수련시설, 복지시설, 복지지원시설로 분류되며 현황에는 각 시설의 소재지, 운영단체, 주요시설, 대표전화 등을 포함하고 있습니다.
