summary_user: 청소년 상담 사례 가운데 생활습관·외모 문제를 학교급·학년별로 나눈 전국 단위 집계 현황을 차트 형태(제목, 구분, X축·Y축 항목과 값)로 담는다. 청소년 정책 담당자나 상담·보건교육 분석가가 "외모·생활습관 고민 상담이 어느 학년에서 많이 나타나는가"를 확인하는 데 쓴다. 전역 조인 키가 없고 지역 구분이 없는 전국 집계여서 다른 데이터와는 학년·문제 유형 이름을 맞추는 방식으로만 나란히 비교한다.
description_portal: 청소년 상담 학교, 학년별 생활습관 및 외모 문제 현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 제목명, 구분명, Y축내용, X축내용 등의 내용을 확인할 수 있으며, 문제 유형에 대한 제목 x축, y축 내용 및 값에 대한 정보를 조회하여 확인할 수 있습니다.청소년 시기의 신체 이미지에 대한 민감성과 생활리듬 불균형 문제를 분석하는 데 유용하며, 성장 단계에 따른 스트레스 요인 및 자기 관리 능력 부족을 객관적으로 진단할 수 있습니다. 교내 보건교육 개선이나 또래 간 비교 문화 해소를 위한 자료로도 적합합니다. 청소년의 자기존중감 향상을 위한 교육 지원 정책에 활용될 수 있습니다.
