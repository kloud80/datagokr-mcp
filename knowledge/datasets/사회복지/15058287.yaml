summary_user: 경기도 내 특수교육지원센터에 배치된 인력을 연도(STD_YY)와 고용형태별로 집계한 시도 단위 자료이며, 교육부 특수교육통계를 바탕으로 매년 6월 말 기준 총배치 인원, 학교과정(유치원·초등·중학교 등)별 교사 자격 인원, 치료사·일반직·행정직·사회복무요원 인원을 담는다. 교육행정 담당자나 연구자가 '경기도 특수교육지원센터의 정규직과 파견 인력 비중이 해마다 어떻게 달라졌나', '치료 인력이 교사 대비 충분한가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 특수교육 통계와는 기준연도와 고용형태 이름을 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 교육부 특수교육통계를 바탕으로 경기도 내 특수교육지원센터에 배치된 인력의 현황을 연도별로 정리한 자료입니다. 매년 6월 말 기준으로 수집되며, 고용형태별(정규, 파견 등)로 총배치 인력 수를 포함해 교사 자격별 인원, 학교과정별 인원 수, 일반직·행정직 인원, 치료사 및 사회복무요원 등 다양한 직군의 배치 현황이 포함됩니다. 이 데이터는 특수교육지원 인력의 고용구조, 교사 자격 분포, 교육과정별 인력 수요 등을 파악하는 데 유용하며, 인력 배치 정책 수립, 예산 계획, 특수교육 서비스 품질 개선 등의 행정 및 연구 목적으로 활용될 수 있습니다.
