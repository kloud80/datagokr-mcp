summary_user: 아이돌봄 서비스 실적을 기준연월·아이돌봄기관별로 집계해 돌봄구분·서비스구분·전염성 질병 아동 여부에 따라 가형~라형 유형별 신청건수와 연계건수를 담은 전국 단위 API 데이터다. 정책 분석가나 지자체 담당자가 '어느 아이돌봄기관에서 월별 신청 대비 연계가 얼마나 이뤄졌고, 전염성 질병 아동 돌봄은 어느 유형으로 연계됐는가'를 파악하는 데 쓴다. 전역 조인 키는 없어서 기관번호(childCareInstNo)와 상위기관번호(upChildCareInstNo)로 기관 계층을 묶고, 다른 데이터와는 기관명 매칭이나 같은 기관의 다른 아이돌봄 데이터의 기관 코드로만 잇는다.
description_portal: 아이돌봄 월별 아동실적현황 정보를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 기준연월, 아이돌봄기관명, 전염성 질병 아동여부, 돌봄구분명, 상위아이돌봄기관명, 가형부터 라형까지 연계건수, 신청건수 등의 정보를 확인할 수 있습니다. 실제 아동 기준으로 이뤄진 서비스 이용 현황을 분석할 수 있게 합니다. 전염성 질병 여부와 연계 건수를 함께 제공하여 위기 상황에서의 아동 돌봄 대응력을 파악할 수 있으며, 유형별 데이터를 통해 서비스 빈도와 정책의 실제 반영 효과를 비교하는 데 적절한 자료가 됩니다. 아동 중심의 실적 평가 및 돌봄 정책 방향 설정에 활용될 수 있습니다.
