summary_user: 대구 북구 관내 장애인복지시설을 시설 한 곳당 한 행으로 담으며, 구분·시설 종류·시설명·소재지·설립일자·전화번호·이용자 정원과 이용자 수·주요 장애인 유형이 들어 있다. 장애인 가족이나 복지 담당자가 북구에서 특정 장애 유형을 받는 주간이용센터나 보호작업장이 어디 있고 정원 대비 이용 인원이 얼마인지 확인할 때 쓴다. 전역 조인 키가 없어 다른 지역 시설 현황이나 전국 장애인복지시설 목록과는 시설명·소재지 주소를 맞춰서 연결해야 한다.
limits: 범위가 대구 북구 한 곳이라 다른 시군구와 비교하려면 별도 데이터를 모아야 한다. 공통 코드 키가 없어 시설명·주소 매칭으로만 연결할 수 있다. 호출에는 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
