summary_user: 사회적경제 판로지원 통합플랫폼(e-store 36.5+ 등, sepp.or.kr)에 입점한 사회적경제기업의 판매 상품을 상품 한 건 단위로 담은 전국 단위 파일로, 판매자명·상품 분류(그룹·1차·2차)·상품명·판매단위·판매가·기준일을 제공한다. 공공기관 구매 담당자나 소비자가 "필요한 물품을 사회적경제기업이 팔고 있는지, 어느 기업이 얼마에 파는지"를 찾는 데 쓴다. 전역 조인 키(인증번호·사업자번호 등)는 없어 같은 기관의 상품 판매사 정보와 판매자명을 이름으로 맞춰 이어 써야 한다.
description_portal: 한국사회적기업진흥원에서 운영하는 사회적경제 판로지원 통합플랫폼(e-store 63.5, sepp.or.kr)에 입점해 있는 사회적경제 기업들의 판매 상품 정보를 제공합니다.판매자명 / 상품유형 / 상품 카테고리그룹 / 상품 1차 카테고리 / 상품 2차 카테고리 / 쇼핑몰상품번호 / 상품아이디 / 상품명 / 판매단위 / 판매가 / 기준일을 제공합니다.필요하신 물품 중 사회적경제기업이 판매하고 있는 상품을 탐색하실 때 유용한 자료입니다. 한국사회적기업진흥원에서 제공중인 상품 판매사 정보와 연계하여 활용하시면 활용도가 더욱 높습니다.데이터에 관한 문의나 칼럼 추가요청 등은 한국사회적기업진흥원 정보화기획팀으로 문의부탁드리겠습니다. 감사합니다.
