summary_user: 공무원연금공단이 관리하는 공무원 퇴직자 수를 연령대별 행(구분)과 1982년부터 기준년도까지의 연도별 열로 집계한 전국 단위 통계 파일이다. 연금 정책 분석가나 연구자가 '공무원의 퇴직 연령이 수십 년간 어떻게 바뀌었고 정년퇴직 비중은 늘었는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 직역연금 통계(재직자·수급자 추이 등)와는 연도와 연령 구간을 이름으로 맞춰 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 퇴직자 추이 데이터로,  퇴직자 추이를 연령(18세미만~65세이상)별로 구분하여 1982년부터 기준년도까지 집계하여 제공하고 있습니다.세대별 퇴직자 분포 및 퇴직연령 변화 추이를 파악할 수 있으며, 공무원 퇴직시점 변화, 정년퇴직 영향 등을 분석하는데 활용할 수 있습니다.기준년도 데이터는 성별로도 구분하여 제공합니다.2000년까지의 연령별 통계는 21세 미만, 21세∼30세 이하, 31세∼40세 이하, 41세∼50세 이하, 51세∼60세 이하, 61세 이상으로 연령대 구간으로 구분되어있습니다.
