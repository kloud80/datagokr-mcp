summary_user: 울산광역시 북구에 있는 노인복지시설을 시설 한 곳당 한 행으로 담은 파일로, 센터명·시설종류(급여서비스)·주소·전화번호·대표자와 시설장·개설일·입소정원·데이터기준일자를 담는다. 북구 주민이나 보호자가 '우리 동네에서 주간보호나 재가 서비스를 하는 시설이 어디고 정원은 몇 명인가'를 찾을 때나, 분석가가 지역 내 시설 공급 현황을 파악할 때 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록 등 다른 데이터와는 센터명·주소를 맞춰 잇고, 지역 통계와는 시군구(북구) 단위로만 연결한다.
limits: 실측 컬럼에 기관코드 같은 공통 식별자가 없어 다른 시설 데이터와 정확히 매칭하려면 시설명·주소 대조가 필요하다. 범위는 울산 북구 한 개 시군구에 한정되어 다른 지역과 비교하려면 별도 데이터를 모아야 한다.
