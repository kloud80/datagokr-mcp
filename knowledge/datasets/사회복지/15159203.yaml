description_portal: 서울특별시 서초구 안전귀가 반딧불이 귀가동행 실적 데이터입니다. 이 데이터는 2025년 실적입니다. 사업목적은 심야시간 여성과 청소년의 귀가 지원 및 안전 취약지역 순찰하는데 있습니다.41명이 17개조로 구성되어 있습니다. 운영지역은 일반주택, 유흥업소 밀집지역, 역세권등 25개소 주요 거점지역을 4개권역으로 나누어서 운영하고 있습니다.서초역, 강남역, 양재역, 교대역, 남부터미널역, 서초3동 사거리등으로 이루어진 서초권역,논현역, 고속터미널역, 서래마을, 잠원역, 신반포역, 신사역~잠원역(1인가구일대)로 이루어진 잠원반포권역,방배역, 내방역, 사당역, 이수역, 카페골목, 방배복개도로로 이루어진 방배권역,매헌역, 청계산입구역, 우면주공아파트, 양재천 상권, 송동·성촌마을, 안골마을, 양재시민의 숲등으로 이루어진 양재내곡권역등 총 4개권역으로 운영하고 있습니다.운영시간은 주14시간 (월 22:00~24:00, 화~금 22:00~01:00)입니다.※ 동·하절기(1~2/7~8월) 주 8시간(화~금 22:00~24:00, 월요일 휴무)등으로 운영하고 있습니다.
