summary_user: 대전광역시 유성구 관내 성폭력·가정폭력 상담소를 시설 한 곳당 한 행으로 담은 목록으로, 시설명·지번/도로명 주소·위도·경도·전화번호·신고 수리일을 포함하며 파일 크기는 451바이트에 불과한 소규모 파일입니다. 유성구 주민이나 지원기관 담당자가 '우리 동네에서 연락할 수 있는 성폭력·가정폭력 상담소는 어디이고 전화번호는 무엇인가'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소 문자열 매칭이나 좌표로 연결하며, 사회복지시설 공통 마스터를 참조하는 보조 자료로 쓴다.
description_portal: 대전광역시 유성구 성폭력가정폭력상담소 현황에 대한 데이터를 제공합니다.해당 데이터는 시설명, 소재지지번주소, 소재지도로명주소, 위도, 경도, 전화번호, 신고수리일자 데이터를 포함하여, 총 2의 행으로 구성되어 있습니다.해당 데이터는 정기적으로 현행화하여 공개하고 있습니다.이 데이터는 유성구 관내 상담소 현황 등의 정보를 포함하고 있어 데이터 이용자의 정보 접근성과 행정자료 검색의 효율성 향상에 기여할 수 있습니다. 이를 통해 정책 분석, 행정자료 활용, 공공행정 연구, 위치기반 서비스 개발 등 다양한 분야의 기초 자료로 활용이 가능합니다.
