description_portal: 경상북도 결혼 이민자,귀화자 관련 정보( 결혼이민자, 귀화자의 시군별, 결혼이민자.귀화자 수, 비율) 현황입니다. 경상북도에서는 결혼이민자 및 귀화자를 위한 다양한 지원 정책을 통해 이들의 안정적인 정착과 지역사회 통합을 돕고 있습니다.경상북도 결혼이민자 및 귀화자의 주요 지원 정책으로는 1. 다문화가족 지원센터 운영(한국어교육,통번역서비스,상담프로그램,문화이해교육), 2. 자녀교육지원(언어발달지원,학습지원, 문화체험 등) 3. 취업 및 직업 훈련 지원(직업상담 및 알선, 직업훈련 프로그램, 장업지원)4. 사회통합프로그램 (사회통합교육, 지역사회참여활동, 자원봉사활동)운영 등이 있습니다. 자료 관련 문의는 054-880-4655로 하시기 바랍니다.
