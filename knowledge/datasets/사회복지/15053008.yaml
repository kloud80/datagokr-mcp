description_portal: '공무원연금공단에서 관리하는 퇴직자 현황을 급여 종류별로 세분화하여 연도별로 집계한 통계로, 퇴직급여 및 유족급여 유형에 따른 수급자 수의 변화 추이를 확인할 수 있도록 구성되어 있습니다.데이터는 1982년부터 기준년도까지 연도별로 정리되어 있으며, 총 수급자 수(합계)와 함께 퇴직급여와 유족급여 항목이 각각 세부 유형별로 구분되어 제공됩니다.퇴직급여 항목에는 퇴직일시금, 퇴직연금일시금, 퇴직연금(정상연금), 퇴직연금(조기연금), 퇴직연금(수급대기자), 퇴직연금공제일시금이 포함되어 있으며, 유족급여는 유족일시금, 유족연금일시금, 유족연금으로 나뉩니다.1. 퇴직연금공제일시금 인원은 중복계상되지 않도록 "합계"와 "계"에서 제외함2. 급여종류별 지급인원이 퇴직자 수보다 적은 것은 퇴직수당만 지급된 자가 제외되었기 때문임. (사유 : 연계승인, 미수령합산, 퇴직급여 별도청구 등)3. 조기연금 : 연금지급개시연령 도달전 연금 신청자4. 수급대기자 : 연금지급개시연령 미도래자'
