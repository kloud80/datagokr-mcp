summary_user: 아이돌봄통합지원 시스템에서 진행한 설문조사의 응답자 정보를 응답자 한 명씩 담는 전국 범위의 원천 데이터로, 조사연월·센터코드·성별·센터등급·센터직책과 등록·수정일자가 들어 있다. 아이돌봄 사업을 분석하는 담당자나 연구자가 "특정 조사연월에 어떤 직책·등급의 센터 인력이 설문에 응답했는가"처럼 응답자 구성을 파악할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 다른 데이터와는 센터코드(cntrCd)처럼 같은 기관 내부 코드나 이름 매핑으로만 이어 쓴다.
description_portal: 아이돌봄통합지원 시스템의 설문조사 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 수정일자, 조사연월, 답변자관리번호, 전화번호, 성별구분코드, 센터등급코드, 센터직책코드, 등록일자 등의 내용을 확인할 수 있습니다.해당 데이터는 조사 행정의 효율성을 높일 수 있으며 센터별 인적 구성 파악과 함께 조사 진행 과정의 추적이 가능하며, 조사 조직 체계의 정비에도 도움을 줍니다. 또한 설문 응답자와의 인터뷰나 피드백 수집 시 유용하게 활용될 수 있습니다. 설문조사 대상자와 조사 관리 체계를 정비하는 데 활용 될 수 있습니다.
