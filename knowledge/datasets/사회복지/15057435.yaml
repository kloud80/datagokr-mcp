summary_user: 경기도 노인요양시설·노인요양공동생활가정 등 노인의료복지시설을 시설 한 곳당 한 행으로 담은 명부로, 장기요양 지정 여부, 입소 정원과 현원(성별·등급·기초수급자 구분), 종사자 정원과 현원(정규·비정규), 설치 주체·영리 구분, 지번·도로명 주소와 좌표를 포함한다. 보호자가 우리 시군에 장기요양기관으로 지정된 요양시설이 어디 있고 정원 대비 입소 여유가 있는지 알아볼 때, 분석가가 시군별 요양 병상과 인력 공급을 비교할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 시군구명(SIGUNGU_NM)이나 주소·시설명을 맞춰 다른 데이터와 연결하고, 위경도 필드는 지도 위 결합에 쓴다.
description_portal: 경기도 노인의료복지시설 현황 데이터는 노인요양시설, 노인요양공동생활가정 등 노인 장기요양 관련 복지시설 정보를 제공하며, 시군구명, 시설명, 시설종류, 장기요양지정 여부, 주소(지번·도로명), 전화번호, 팩스번호, 우편번호, 입소정원, 종사자 수  등의 항목으로 구성되어 있습니다. 본 데이터는 시설별 입소 정원과 인력 현황을 기반으로 노인 복지 수요 및 공급 상황을 분석할 수 있으며, 장기요양 지정기관 여부를 통해 제도적 지원 현황도 확인할 수 있습니다. 또한 위치정보가 포함되어 있어 시설 분포를 지도 기반으로 시각화할 수 있으며, 지역별 고령자 복지서비스 접근성 연구, 공공·민간 운영 특성 비교, 복지정책 평가에 유용하게 활용됩니다.
