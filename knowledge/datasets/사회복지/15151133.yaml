description_portal: 한국청소년활동진흥원이 수집·정리한 청소년특별회의의 정책 관련 과제 목록을 제공하는 데이터이다. 파일은 CSV 형식으로 구성되며, 각 행은 1개의 과제를 나타낸다. 주요 열은 연도, 분야, 정책영역, 회차, 정책과제세부로, 연도는 과제의 기준 연도를, 분야와 정책영역은 분류 체계를, 회차는 해당 연도의 회의 차수를, 정책과제세부는 과제의 구체적 서술을 기록한다총 179건이 수록되어 있고 연도 범위는 2005~2024년이다. 분야의 예시는 사회기반·지원·인권·진로 등이 있으며, 정책영역의 예시는 청소년 문화 활동 참여 기회 확대·청소년 민주시민 인권교육 강화·청소년 진로 교육·직업체험 기회 확대·교육 현장에 청소년 참여 등이 나타난다데이터는 의제 발굴–숙의–부처 협의–이행점검의 절차에서 생성된 공식 기록을 근거로 작성GKAU, 결측값 또는 공백은 해당 정보의 부재를 의미한다.
