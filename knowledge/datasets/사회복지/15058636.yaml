summary_user: 경기도 내 실버인력뱅크 기관을 한 행에 하나씩 담은 기관 목록으로, 시군명·기관명·전화번호·도로명/지번 주소·우편번호·위경도 좌표를 담는다. 고령자나 가족이 '우리 시군에서 노인 일자리 상담을 받을 수 있는 실버인력뱅크는 어디이고 연락처는 무엇인가'를 찾을 때, 분석가가 시군별 노인 취업지원 기관 분포와 접근성을 볼 때 쓴다. 실측상 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 기관명으로 다른 시군 단위 자료와 맞추고, 위경도 좌표로 지도·거리 분석에 이어 쓴다.
description_portal: '경기도 내 실버인력뱅크 현황입니다. 시군별 기관명, 연락처, 주소(도로명, 지번) 등의 정보를 제공합니다.※ 실버인력뱅크 : 자원봉사, 소득창출 활동 등을 통한 노인들의 사회참여를 지원하기 위한 사업이 데이터는 경기도 내 ‘실버인력뱅크’ 기관의 운영 현황을 정리한 자료로, 노년층의 취업지원 및 사회참여 확대를 위한 지역별 인력은행 운영 실태를 보여줍니다. 주요 항목에는 **시군명, 기관명, 도로명주소 및 지번주소, 우편번호, 전화번호, WGS84 좌표(위도·경도)**가 포함되며, 각 기관은 고령자의 능력에 맞는 일자리를 연계하고, 직업 상담 및 교육을 제공합니다. 실버인력뱅크는 지역 내 고령자의 지속적인 사회활동을 지원하는 핵심 기관으로서, 고령친화 일자리 매칭, 재취업 기회 제공, 생애 후반기 경제활동 지원 등의 기능을 수행합니다. 본 데이터는 노인 고용정책 수립, 지역별 취업 인프라 분석, 고령자 대상 복지 서비스 접근성 평가, 일자리 수요 대응 전략 마련 등에 활용 가능하며, 여성가족부 또는 지자체의 노인복지 부서에서 관리하는 공공데이터입니다.'
