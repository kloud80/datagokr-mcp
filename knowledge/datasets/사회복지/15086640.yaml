description_portal: '서울특별시 마포구의 전동보장구 급속충전기 설치현황에 관한 정보입니다. 이 데이터에는 각 충전기가 설치된 행정 구역 정보(시도명, 시군구명, 행정동명)와 실제 도로명 주소와 지번주소와 위경도, 설치장소설명(예: 정문 앞, 화장실 옆, 대합실 앞, 편의점 옆, 좌측 벽면 등)가 포함되어 있으며 도 함께 제공됩니다. 또한, 시설명, 평일, 토요일, 공휴일의 운영시작시각 및 운영종료시각, 동시사용대수, 공기주입가능여부, 휴대전화충전가능여부 등의 세부 정보도 포함되어 있습니다.이 외에도 관리기관명 및 전화번호 등의 정보가 함께 제공되어 철저한 운영 관리를 지원합니다.'
