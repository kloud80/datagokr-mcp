summary_user: 경기도 청년정책 거버넌스(위원회·회의·협의체 등)의 운영 현황을 기준연도와 담당부서별로 정리한 집계 표로, 목표치와 운영 횟수를 담는다. 청년정책 연구자나 도의원이 해마다 어느 부서가 청년 참여 협치기구를 몇 차례 운영했고 목표 대비 실적이 어떤지 확인할 때 쓴다. 전역 조인 키가 없어 기준연도(crtr_yr)와 부서명 같은 이름 매칭으로만 경기도의 다른 청년정책·예산 자료와 이어 쓸 수 있으며, 사회적경제 부문에서 쓰는 인증번호·사업자번호 같은 기업 식별자는 없다.
description_portal: 이 데이터는 경기도 내 청년정책 추진을 위한 거버넌스 운영 현황을 다루고 있습니다. 청년정책 거버넌스는 청년 당사자와 전문가, 관련 행정 주체가 함께 참여하여 청년 문제를 논의하고 해결방안을 모색하는 협치 체계를 의미합니다. 본 데이터는 다양한 청년정책 추진 과정에서 형성된 위원회, 회의, 협의체 등의 구성과 운영 방식, 참여 인원, 회의 개최 현황 등을 포함하고 있어, 경기도 청년정책의 실행 기반과 참여 구조를 파악하는 데 유용한 자료입니다. 이를 통해 정책 수립의 투명성, 현장성과 지속 가능성 확보에 기여할 수 있으며, 향후 유사 거버넌스 모델 개발이나 정책 평가 시 참고 자료로 활용될 수 있습니다.
