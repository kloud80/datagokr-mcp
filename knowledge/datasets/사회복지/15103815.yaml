summary_user: 인천 부평구에 있는 사회적협동조합을 조합별로 한 줄씩 담은 소규모 파일(csv 약 3KB)로, 연번·조합명·사업장 주소만 들어 있다. 부평구 안에 어떤 사회적협동조합이 어디에 있는지 확인하려는 주민, 협업 상대를 찾는 복지·돌봄 기관, 생활권별 사회서비스 주체 분포를 보려는 분석가가 쓴다. 사업자번호나 인증번호 같은 공통 조인 키가 없어서, 다른 사회적기업·협동조합 목록과는 조합명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '사회적협동조합의 기업명(조합명)과 주소를 정리한 자료.지역 내 공익적 목적의 사회서비스를 수행하는 조직의 현황을 파악하고, 사회적경제 활성화, 복지·의료·교육 등 공공서비스 분야 협업체계 구축을 위한 기초자료로 활용됨.활용 목적 및 특징– 사회적협동조합 분포 현황을 기반으로 지역 공익서비스 제공 주체 분석– 주소 기반으로 생활권 단위 복지 네트워크 또는 사회서비스 전달체계 설계 가능– 법인등록 실태 파악 및 사회적기업 지원정책 수립 자료로 활용– 지역 커뮤니티 기반의 자활·돌봄·교육 등 분야별 협동모델 지원에 기여주요 항목 설명● 연번: 각 조합 항목에 부여된 고유 식별번호● 기업명: 사회적협동조합의 공식 명칭● 주 소: 조합이 등록된 사업장 주소'
