description_portal: '1. 설립과 구성 ; 1982년 7월23일 / 동구 국채보상로 809/회원 : 37개 단체로 11만여명의 회원으로 구성2. 주요 목적 및 활동 :   - 목적 : 여성복지 증진, 단체 간 협력.정보교류, 친목도모, 영성 권익 및 지위 향상, 양성평등 실현  - 활동 : 여성 권익 옹호와 복지 증진, 양성평등 문화 확산, 일. 가정 양립 지원과 지역사회 봉사, 신년교례회, 이취임식, 다양한 캠페인과 교육사업3. 주요행사  - 신년교례회 : 여성계 비전 결집과 연대 강화의 자리로 2024년, 2025년 개최  - 회장 이취임식 : 최근 3월14일 개최, 제21대 한명아 회장 이임과 제22대 이종선 회장 취임  - 170여명이 참석, 쌀 화환 기부를 통한 문화 실천4. 회장단 및 리더십  - 이종선 회장 : (주)젠텍스 대표이자 "신나는 봉사대"회장으로 사회복지 할동 주도  - 취임사에서 "회원 소통.여성지도자 전문성, 지역발전에 기여"할 것을 다짐5. 지역사회 기여 및 영향력  - 정책.공익 참여 : 여성계 연대와 정책제안, 지역사회 캠페인 협업  - 봉사 및 나눔 : 쌀 기부 등 사회공헌 활동  - 교육.교류 : 어울림의 장 형성, 역량 강화 워크숍 진행'
