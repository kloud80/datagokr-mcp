description_portal: 서울글로벌센터 접수유형 및 상담유형별(월) 상담실적 데이터는 서울글로벌센터에서 월 단위로 집계한 상담 실적을 접수유형과 상담유형에 따라 세분화하여 제공하는 통계자료입니다. 년월별로 대분류와 중분류 항목을 통해 상담 주제·유형을 체계적으로 구분하고, 전화, 방문, 이메일, 게시판, SNS, 이동상담, 문자 등 다양한 상담 방식별 건수를 함께 제공합니다. 합계 항목을 통해 각 유형별 전체 상담 규모를 한눈에 파악할 수 있어, 상담 분야별 수요 분석, 채널별 이용 패턴 파악, 특정 상담유형에 대한 집중 지원 필요성 진단 등에 활용할 수 있는 데이터입니다. 이를 통해 외국인 대상 상담 서비스의 세부 운영 전략 수립과 자원 배분의 효율성을 높이는 데 기초 자료로 활용될 수 있습니다.
