summary_user: 2006년부터 2024년까지 전국 지역아동센터의 시설수, 연령·학교급별 일일이용아동 수(미취학~고등학생, 학교밖, 기타), 시설장·생활복지사 종사자 수를 연도별 전국 합계로 담은 집계 파일입니다. 정책 분석가나 연구자가 '지역아동센터 이용 아동이 연령대별로 어떻게 바뀌었고 종사자 1인당 아동 수는 어떤가' 같은 장기 추세 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도 컬럼을 기준으로 아동 인구·돌봄 통계 등 다른 연도별 전국 집계와 나란히 놓고 비교하는 방식으로 이어 쓴다.
limits: 전국 단위 비공간 집계라 시도·시군구별 분포나 개별 센터 위치·정보는 알 수 없습니다. 휴폐지 시설 등의 이용아동·종사자 수는 제외된 수치이며, 연령 구분은 미취학 6세 이하, 초등 저학년 7~9세, 고학년 10~12세, 중학생 13~15세, 고등학생 등 16세 이상 기준입니다.
