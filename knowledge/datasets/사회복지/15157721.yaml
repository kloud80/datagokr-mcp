description_portal: 재해 발생 시 이재민 지원 및 취약계층 보호를 위해 활용 가능한 사회복지시설의 상세 정보를 조회할 수 있도록 제공하는 공공데이터 서비스입니다.                                                                                                                                                                        사회복지시설은 노인·장애인·아동 등 재난 상황에서 스스로 대피하거나 생활을 유지하기 어려운 취약계층을 위한 지원 시설로, 재난 발생 시 보조 구호시설 또는 특수 돌봄 공간으로 활용될 수 있습니다. 해당 서비스를 통해 시설의 명칭, 시군 소재지, 시설 유형, 주소, 연락처, 담당자명, 수용 가능 인원, 정확한      위치(위도·경도) 등의 정보를 조회할 수 있습니다.이 서비스는 재난 대응 기관 및 관련 시스템에서 다음과 같은 목적으로 활용될 수 있습니다. 첫째, 재난 발생 전 단계에서 지역별·유형별 사회복지시설 분포 현황과 수용 가능 인원을 사전에 파악하여, 일반 구호소만으로는 수용이 어려운 취약계층을 위한 특수 대피 계획을 수립하는 데 활용할 수 있습니다. 둘째, 재난 발생 시 일반 구호소와 병행하여 노인·장애인·아동 등 취약계층을 시설 유형에 맞는 사회복지시설로 연계함으로써, 일반 이재민과 분리된 맞춤형 보호 및 돌봄 서비스를 제공하는 데 활용합니다. 셋째, 담당자명과 연락처 정보를 통해 재난 상황에서 해당 시설의 담당자와 즉시 연락하여 시설 개방 여부 확인 및 수용 조율을 신속하게 진행할 수 있습니다. 넷째, GIS 기반 재난 관제 시스템과 연계하여 사회복지시설의 위치를 지도 위에 시각화하고, 구호소·집결지·소개로 등 다른 재난 인프라 정보와 함께 표시하여 취약계층 대피 동선을 종합적으로 계획하는 데 활용할 수 있습니다.
