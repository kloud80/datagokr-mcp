summary_user: 경기도 김포시 안의 노인요양기관을 시설 한 곳당 한 행으로 담아 구분, 시설명, 도로명·지번 주소, 전화번호, 입소정원, 데이터기준일자를 제공하는 시설 목록이다. 김포시에 사는 가족이 집 근처 요양시설과 입소정원을 찾거나, 분석가가 김포시 권역별 노인요양기관 분포와 정원 규모를 살피는 데 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 정보나 사회복지시설 자료와는 시설명·주소 매칭으로만 잇고, 지역 통계와는 시군구 단위로 연계한다.
description_portal: 경기도 김포시의 노인요양기관에 대한 정보를 제공합니다. 제공 항목으로는 구분, 시설명, 소재지주소, 전화번호, 입소정원, 데이터기준일자로 구성되어있으며 주소는 지번과 도로명의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 데이터를 통해 김포시 권역별 노인요양기관 분포 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 노인장애인과로 연락주시기 바랍니다.
