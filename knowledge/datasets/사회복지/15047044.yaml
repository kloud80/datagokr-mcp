description_portal: '○ 통계개요* 통계명 : 청소년 식생활* 통계종류 : 조사통계, 일반통계* 근거법령 : 국민건강증진법 제19조* 작성목적 : 청소년(중·고등학생)의 건강행태에 대한 현황파악을 통해 청소년건강증진사업 계획 및 평가를 위한 기초자료 제공* 조사체계 : 표본학교→보건복지부(질병관리본부) - 학교컴퓨터실에서 일괄조사* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 청소년 식생활에 대한 응답률○ 용어설명* 주 5일이상 아침식사 결식률 : 최근 7일 동안 아침식사를 5일 이상 먹지 않은 사람의 분율* 주3회 이상 패스트푸드 섭취율 : 최근 7일 동안 3회 이상 피자, 햄버거, 치킨 같은 패스트푸드를먹은 사람의 분율* 주3회 이상 탄산음료섭취율 : 최근 7일 동안 3회 이상 탄산음료를 마신 사람의 분율* 주3일 이상 단맛음료 섭취율 : 최근 7일 동안 3회 이상 단맛이 나는 음료를 마신 사람의 분율○ 기타* 중1~고3 학생을 대상으로 실시○ 출처 : 질병관리청「청소년건강행태조사」'
