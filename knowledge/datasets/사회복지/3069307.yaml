description_portal: 여수시 사회적 경제기업(예비 사회적기업, 인증 사회적기업)에 대한 데이터로 인증여부, 기업명, 인증일 등에 대한 항목을 제공합니다. 사회적기업은 사회적 가치를 실현하는 동시에 수익을 창출할 수 있는 비즈니스 모델을 수립하고 운영하는 기업. 일반적인 영리 기업은 말 그대로 이윤 극대화를 추구하는 것에 비해 사회적 기업은 반쯤은 영리를 추구하고 반쯤은 사회 문제를 해결을 위한 노력과 공동체적 가치 실현을 추구하는 기업입니다. 사회적 목적과 비영리적 성격을 일부 포함하고 있으나 엄연히 돈을 버는 기업이므로 일반적인 공익단체와는 분명히 구분됩니다. 온전히 사회적 목적만을 추구한다면 사회적 기업보다는 비영리단체에 가깝습니다.
