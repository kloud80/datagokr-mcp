description_portal: '"제주특별자치도 내 요양기관 현황 데이터를 제공합니다.항목: 연도, 분기, 시도, 요양기관 구분, 기관 수 등* 제주특별자치도 내 요양기관의 수를 연도 및 분기별로 요양기관 유형에 따라 정리한 통계자료예요. 요양기관 유형에는 종합요양시설, 공동생활가정, 재가요양기관 등이 포함되며, 제주의 고령화 및 복지 수요 증가와 직접 관련된 기관의 양적 변화를 보여줘요. 이를 통해 어느 유형의 요양기관이 더 빠르게 늘었는지, 어느 시기에 기관 수 변동이 있었는지 알 수 있고, 복지정책이나 노인복지 서비스 제공 계획을 수립하는 데 기초 자료로 아주 유용합니다.* 활용 분야 : 요양기관 수요 대비 공급 격차 분석, 복지 인프라 및 서비스 계획 수립 등"'
