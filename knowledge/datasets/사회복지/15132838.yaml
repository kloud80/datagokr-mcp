summary_user: 청소년 자기도전포상제를 운영하는 기관을 한 곳씩 담은 전국 단위 목록으로, 기관명·유형·주소·연락처·설립일자·등록연도·운영 상태와 청소년 모집 여부를 기관별로 제공한다. 청소년이나 학부모가 우리 지역에서 지금 참가자를 모집하는 포상제 운영기관이 어디인지 찾거나, 분석가가 시도별 운영기관 분포와 상태를 비교하는 데 쓴다. 전역 조인 키는 없으므로 다른 청소년 시설 데이터와는 기관명이나 주소로 맞춰 잇고, 지역 통계와는 주소나 운영기관지역코드(operInstRgnCd)를 시군구·시도로 바꿔 연결한다.
description_portal: 청소년 자기도전 포상제 운영기관 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 사업자URL주소, 운영기관명, 운영기관의 우편번호,주소, 전화번호, 팩스번호, 설립일자, 사용여부, URL주소와 청소년모집여부, 운영기관등록연도, 운영기관상태명 등의 내용을 확인할 수 있습니다.지역별 운영 현황을 비교하거나 신규 기관 유치를 위한 기반 자료로 활용할 수 있으며, 기관별 청소년 참여율 향상 방안을 도출하거나 유사 기관과의 비교 연구에도 유용한 기반 자료로 활용될 수 있습니다. 운영기관 상태를 정기적으로 분석함으로써 제도 개선 및 안정적인 기관 운영 전략 수립에도 활용될 수 있습니다.
