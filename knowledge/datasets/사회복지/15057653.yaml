summary_user: 경기도 청각장애인의 인공달팽이관 수술비·재활치료비 지원을 기준년도와 시군별로 집계한 자료로, 지원 인원, 합계 지원금액, 수술비와 재활치료비 지원금액을 담는다. 복지정책 분석가나 도·시군 담당자가 "어느 시군에 지원 인원과 금액이 몰리고, 수술비와 재활치료비 비중은 어떻게 다른가"를 살필 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 시군 단위 통계와는 시군 코드(SIGUN_CD)나 시군명으로 직접 맞춰 붙인다.
description_portal: 이 데이터는 청각장애인을 대상으로 한 인공달팽이관 수술 및 재활치료비 지원 현황을 연도별·지역별로 집계한 자료입니다. 주요 항목에는 기준년도, 시군명, 지원인원수, 합계지원금액, 수술비지원금액, 재활치료비지원금액이 포함되어 있습니다. 이를 통해 각 지방자치단체별 지원 규모와 지원 인원 현황을 파악할 수 있으며, 지원금 배분의 지역적 불균형 여부를 분석할 수 있습니다. 또한 재활치료비와 수술비의 비율을 비교하여 의료 지원 정책의 효과성을 평가하고 향후 복지정책 개선 방향을 도출하는 데 활용될 수 있습니다.
