summary_user: 미추홀구 관내 장애인 직업재활시설을 시설 한 곳당 한 행으로 담은 파일로, 종류·시설명·정원수·근로자수·도로명주소·연락처·등록일자·위도·경도를 포함하며 파일 크기는 약 1.3KB로 소규모다. 장애인 당사자나 가족이 집 근처에서 보호고용·직업훈련을 받을 수 있는 시설이 어디이고 정원과 현재 근로자 수가 얼마인지 확인하거나, 구 단위 직업재활 인프라를 파악하는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로 이어 쓴다.
description_portal: 본 데이터는 미추홀구 관내 장애인 직업재활시설의 현황을 수록한 자료입니다. 장애인 직업재활시설은 「장애인복지법」 제58조 및 같은 법 시행규칙 제41조에 근거하여 설치·운영되며, 등록장애인을 주요 지원 대상으로 합니다. 데이터에는 시설명, 정원수, 근로자 현황, 도로명 주소, 연락처, 등록일자, 위도·경도 등 기본 항목이 포함되어 있으며, 이를 통해 지역 내 장애인 직업재활 인프라를 확인할 수 있습니다. 해당 시설은 장애인이 자신의 능력과 적성에 맞는 직업생활을 할 수 있도록 보호고용, 직업상담, 직업능력평가, 직업적응훈련, 직업훈련, 작업활동, 취업알선, 취업 후 지도 등 다양한 서비스를 제공합니다. 또한 장애인 생산품 판매와 판로 확대를 지원하여 경제적 자립과 사회 참여 기회를 확대합니다. 본 자료는 행정기관이 지역 내 직업재활시설 운영 현황을 체계적으로 관리하고, 장애인 고용정책 및 복지서비스의 효과성을 높이는 데 중요한 근거자료로 활용됩니다.
