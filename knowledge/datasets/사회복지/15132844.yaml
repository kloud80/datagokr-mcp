summary_user: 청소년활동 정보 서비스에서 사용자가 찜(북마크)한 청소년활동 프로그램·시설을 북마크 한 건 단위로 담으며, 북마크명·프로그램 구분·북마크 구분·등록/수정일시를 제공하는 전국 범위의 비공간 데이터다. 청소년 정책·콘텐츠 기획 담당자나 분석가가 '청소년들이 어떤 유형의 활동을 많이 찜하는가'처럼 관심 활동 유형과 선호 경향을 파악하는 데 쓴다. 전역 조인 키는 확인되지 않아, 시설물일련번호(fcltySn)나 프로그램 구분 코드, 북마크명을 같은 기관의 청소년 시설·활동 프로그램 데이터와 이름·코드 매핑으로만 이어 쓸 수 있다.
description_portal: 청소년 활동 찜한 청소년활동 정보 서비스 조회를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 북마크일련번호, 북마크명, 프로그램구분, 북마크 구분 등의 내용을 확인할 수 있습니다.북마크된 프로그램의 명칭과 구분 정보를 제공함으로써 청소년의 관심 활동 유형을 파악할 수 있는 자료로 활용됩니다. 특정 활동에 대한 선호도나 참여 의향을 통계적으로 분석함으로써 수요 맞춤형 콘텐츠 기획이 가능해지고, 청소년의 자율적인 활동 선택 경향과 트렌드를 정밀하게 분석할 수 있다는 점에서 실질적인 정책 수립 자료로 활용될 수 있습니다.
