summary_user: 공무원연금 연금급여를 퇴직급여(퇴직연금·퇴직일시금·공제일시금·기타급여)와 유족급여(유족연금·유족일시금·부가금·가산금)로 나눠, 1982년부터 기준년도까지 연도별 전국 지급액을 담은 집계 파일입니다. 연금 재정 분석가나 연구자가 '공무원 퇴직연금 지급액이 해마다 얼마나 늘었고, 일시금 대비 연금 비중은 어떻게 바뀌었나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 연도(연도)를 기준으로 사학·군인연금 등 다른 직역연금 통계나 같은 기관의 수급자 통계와 나란히 비교하는 방식으로 이어 쓴다.
description_portal: '공무원연금공단에서 관리하는 급여종류별(퇴직급여, 유족급여) 급여지급액 추이 데이터로, 1982년부터 기준년도까지 자료를 포함하고 있습니다.퇴직급여 : 퇴직(연금)일시금, 퇴직연금공제일시금, 퇴직연금, 기타급여유족급여 : 유족(연금)일시금, 유족연금, 유족연금부가금, 유족연금특별부가금, 유족급여가산금1. 퇴직연금에는 연금이체급여액 포함(2023년 퇴직연금에는 연금이체급여 17,510백만원 및 분할연금 23,843백만원 포함)2. 기타급여 : "85년∼"91년 9월은 퇴직급여가산금, "91년 10월이후는 통신공사·담배인삼공사 연계자 실적임3. "83년∼"00년 퇴직연금·유족연금지급건수는 연금수급자 수임4. 임용결격자에 대한 기여금반환 등은 제외함'
