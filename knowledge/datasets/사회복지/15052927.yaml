description_portal: "공무원연금공단에서 제공하는 회계별 재해보상심의회 심의 가결 추이 데이터이며, 1983년부터 2020년까지 제공하고 있습니다.회계종류 : 일반회계, 통신사업특별회계, 철도사업특별회계. 전매사업특별회계, 지방자치단체회계, 교육행정자치회계1. '88년 이후 공단의 결정으로 지방자치단체가 지급한 지방자치단체 소속공무원(교육공무원 포함)의 심의건수는 일반회계에 포함   ('87년 이전은 전액 국가부담으로 공단에서 지급)2. 2002년부터 공단에서 일괄 지급하므로 기존 일반회계에 통합되어 표기하였던 지방자치단체 및 지방교육행정자치 소속공무원의 심의건을 구분·계리하였음3. 심의회,직권재심의,소송건 포함4. '83년부터 '97년까지 국가유공자 사실확인 업무 관련 가결건 제외2019년부터 재해보상심의 업무가 인사혁신처로 이관되어, 데이터 현행화를 하지 않습니다."
