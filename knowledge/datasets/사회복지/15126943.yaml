description_portal: '본 데이터는 화성도시공사가 운영하는 교통약자 이동지원 서비스 "화성나래"의 월별 장애유형 및 이용대상별 이용 현황 통계 데이터입니다.단순한 전체 이용자 수 집계를 넘어, 서비스 이용 고객의 세부 장애 유형(지체, 뇌병변, 시각 등)과 교통약자 분류(노약자, 임산부 등)를 구분하여 제공함으로써, 실제적인 교통복지 수요를 심층적으로 파악할 수 있는 고가치 자료입니다.1. 주요 제공 데이터 항목시계열 정보: "연월" 단위로 데이터를 제공하여 월별 이용 추이 및 계절적 변동 사항을 분석할 수 있습니다.세부 장애 유형별 이용건수: 지체, 뇌병변, 시각, 신장, 지적, 청각, 자폐, 정신, 척추, 호흡기 장애 등 총 10종의 장애 유형별 이용 실적을 제공합니다.교통약자 분류별 이용건수: 장애인뿐만 아니라 노약자, 요양(대상), 임산부 등 「교통약자의 이동편의 증진법」에 따른 다양한 대상자별 이용 현황을 포함합니다.데이터 기준일자: 해당 통계의 정확성을 담보하는 최종 집계 기준일(2025-12-31)을 제공합니다.2. 데이터의 전략적 가치 및 활용 분야맞춤형 차량 배차 및 서비스 개선: 장애 유형별로 필요한 보조 장비(휠체어 리프트 등)나 서비스 특성이 다르므로, 유형별 이용 비중을 분석하여 특장차 도입 및 운전원 교육의 기초 자료로 활용합니다.복지 사각지대 발굴: 상대적으로 이용률이 낮은 장애 유형을 파악하여 해당 계층을 위한 홍보 강화나 제도 개선 등 맞춤형 복지 정책을 수립하는 데 기여합니다.학술 및 공공 연구: 지역별 장애인 인구 분포와 실제 이동 데이터의 상관관계를 분석하여 교통복지 인프라 확충의 정당성을 확보하는 연구 자료로 활용 가능합니다.'
