description_portal: 대전광역시시설관리공단에서 관리 운영 중인 대전추모공원의 월별 봉안 현황 정보를 제공하고 있습니다. 대전추모공원의 주소는 대전광역시 서구 상보안윗길 160 체육, 환경, 복지, 기반 중 복지시설에 해당됩니다. 월별 봉안 현황은 신규 봉안 등록 추가로 변경될 수 있음을 알려드립니다. 해당 파일에서 제공하는 정보는 연도, 월, 총계, 유연소계, 유연 관내, 유연 관외, 무연 소계, 무연 관내, 무연 관외입니다. 대전추모공원 봉안월별현황 데이터 기준일은 2025년 7월 1일 입니다. 추가로 필요하신 사항이 있다면 공공데이터 담당자(042-610-2746)에게 문의하여 주시기 바랍니다.
