description_portal: '○ 통계개요* 통계명 : 국민기초생활보장 일반수급자 가구구성별 현황* 통계종류 : 일반, 보고통계* 근거법령 : ?국민기초생활 보장법? 제25조* 작성목적 : 생활유지의 능력이 없거나 생활이 어려운 가구의 소재·재산 등을 파악하여차년도 국민기초생활수급자의 책정을 위한 기초자료 제공* 조사체계 : 시군구(행복e음/사회보장장보시스템) → 시도 → 보건복지부* 공표주기 : 매년* 공표범위 : 지역 - 서울시내용 - 국민기초생활보장 일반수급자의 가구구성별 가구수○ 용어설명* 국민기초생활보장 수급자 : 국민기초생활보장법에 따라 급여를 받는 자로서소득인정액이 최저생계비 이하이고 부양능력있는 부양의무자가 없거나 있어도부양능력이 없는 자를 말하며, 이들은 자신의 소득, 재산, 근로능력만으로는최저생활을 유지할 수 없는 계층임* 가구수 : 사회복지사업 관련법에 의한 보장별 가구구성 단위별 가구수* 단독가구 : 1인으로 구성된 가구* 부부가구 : 부부만으로 구성된 가구* 자녀동거가구 : 자녀가 동거하는 가구* 그외가족동거 : 자녀 이외 가족과 동거하는 가구* 비혈연가구 : 혈연관계가 없는 사람과 동거하는 가○ 기타○ 출 처 : 보건복지부「국민기초생활보장수급자 현황」, 희망복지지원과'
