summary_user: 경기도 내 노숙인 쉼터를 시설 한 곳당 한 행으로 담은 현황 자료로, 시군, 시설명, 인허가일자, 영업 상태와 폐업일자, 입소 정원, 자격 보유 인력과 총인원, 지번·도로명 주소와 좌표를 담는다. 복지 행정 담당자나 분석가가 '우리 시군에 운영 중인 노숙인 쉼터는 몇 곳이고 입소 정원은 얼마인가'처럼 지역별 쉼터 분포와 수용 규모를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 시군 코드·시군명(SIGUN_CD)이나 시설명·주소를 기준으로 맞춰야 하며, 사회복지시설 공통 마스터와 연결할 때도 이름 매핑이 필요하다.
description_portal: 이 데이터는 경기도 내 노숙인을 위한 쉼터 운영 현황을 정리한 자료로, 각 쉼터의 위치, 인허가일자, 입소 정원, 운영 상태, 인력 구성 등의 정보를 포함합니다. 노숙인쉼터는 거리 노숙인 및 주거불안 계층에게 안정적인 생활공간을 제공하며, 식사, 숙박, 위생관리, 심리 상담 등 다양한 복지서비스를 지원하는 공공시설입니다. 이 자료는 복지 사각지대 해소, 위기 가구 보호 정책 수립, 자활 연계 프로그램 마련, 쉼터 수요 예측 등 공공복지 행정의 기초자료로 활용될 수 있습니다. 특히 계절별 긴급보호 대책이나 지역별 인프라 분포 평가에  쓰일 수 있습니다.
