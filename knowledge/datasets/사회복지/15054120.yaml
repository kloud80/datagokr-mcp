description_portal: '공무원연금공단에서 활용하는 2017년부터 기준년도까지 시장위험지표 현황으로 월별 및 채권, 국내채권, 해외채권, 국내주식, 해외주식, 중장기자산 유형으로 구분하여 제공합니다.VaR 기법을 통해 측정한 총 시장위험 지표로, 측정 대상은 주식, 채권, 대체자산 일부(파생결합증권) 입니다. 최대예상손실금액은 금리, 주가, 환율 등 시장변동으로 발생할 수 있는 최대손실 금액을 지수가중평균이동법(최근 변동성에 더 많은 가중치를 부여하는 방식)을 활용하여 특정 신뢰수준(95%) 하에 추정한 값이며, 최대예상손실(%)는 해당 손실금액을 평가금액 대비 비율로 환산한 값으로 상대적 위험수준을 판단하는데 사용합니다.VaR(Value at Risk): 특정기간 내에 금융자산의 시장가격 변동으로 발생할 수 있는 잠재적인 손실액을 추정하는 기법'
