description_portal: 안내되는 복지서비스 API는 대국민 복지포털 복지로에서 제공합니다. 전국민을 대상으로 하는 중앙부처의 사회보장 급여 및 복지서비스 중 보건복지부 사회보장조정과에서 대상으로 선정된 사업을 대상으로 합니다. 중앙부처 복지서비스는 2가지 오퍼레이션 형태로 이용하실 수 있습니다. 복지서비스 목록조회는 다양한 복지서비스 목록을 한눈에 볼 수 있습니다. 복지서비스 상세조회에서는 지원대상, 선정기준, 신청방법 등을 안내하고 있으므로 내가 받을 수 있는 복지서비스인지 서비스 별 자세한 내용을 확인할 수 있습니다. 사회복지 다양한 분야에서 활용하실 수 있으므로, 자세한 사항은 '활용가이드_중앙부처복지서비스'와 공공데이터포털에서 제공하고 있는 SWAGGER 문서를 참고하여 주시기 바랍니다.
