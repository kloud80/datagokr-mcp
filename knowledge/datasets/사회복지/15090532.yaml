summary_user: 복지로에서 안내하는 중앙부처 사회보장 급여·복지서비스를 서비스 단위로 담은 전국 범위 API로, 목록조회와 지원대상·선정기준·신청방법을 보여주는 상세조회 두 오퍼레이션으로 나뉜다. 국민이나 복지 상담 앱 개발자가 '내가 받을 수 있는 중앙부처 복지서비스는 무엇이고 어디서 어떻게 신청하나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 서비스명 매핑이나 같은 기관 코드로만 연결하며, 서비스 구분코드(servSeCode)는 이 데이터 안에서 서비스 유형을 나누는 용도다.
limits: 필수 파라미터 callTp와 srchKeyCode는 다른 데이터의 코드값이라 먼저 받아서 넘겨야 한다. 목록조회(/NationalWelfarelistV001)는 최소 파라미터로 호출했을 때 응답이 없었고, 개발계정은 하루 100회로 제한된다.
