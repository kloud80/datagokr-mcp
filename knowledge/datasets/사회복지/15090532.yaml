services:
  - op: /NationalWelfarelistV001
    name: 복지서비스 목록조회
    endpoint: https://apis.data.go.kr/B554287/NationalWelfareInformationsV001/NationalWelfarelistV001
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: callTp
        required: true
        desc: '호출할 페이지 타입을 반드시 설정합니다.(L: 목록, D:상세)'
      - name: pageNo
        required: true
        desc: 기본값 1, 최대 1000 검색 시작위치를 지정할 수 있습니다
      - name: numOfRows
        required: true
        desc: 출력건수, 기본값 10, 최대 500 까지 가능합니다.
      - name: srchKeyCode
        required: true
        desc: 001 제목 002 내용 003 제목+내용
      - name: searchWrd
        required: false
        desc: 검색어
      - name: lifeArray
        required: false
        desc: 생애주기(코드표참조)
      - name: trgterIndvdlArray
        required: false
        desc: 가구유형(코드표참조)
      - name: intrsThemaArray
        required: false
        desc: 관심주제(코드표참조)
      - name: age
        required: false
        desc: 나이
      - name: onapPsbltYn
        required: false
        desc: '온라인신청 가능여부(Y: 가능 N: 불가능)'
      - name: orderBy
        required: false
        desc: '정렬순서(date: 조회순, popular: 인기순)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 100
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
  - op: /NationalWelfaredetailedV001
    name: 복지서비스 상세조회
    endpoint: https://apis.data.go.kr/B554287/NationalWelfareInformationsV001/NationalWelfaredetailedV001
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
