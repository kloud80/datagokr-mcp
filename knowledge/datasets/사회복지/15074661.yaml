description_portal: 이 데이터는 한국남부발전이 추진한 기부금 집행 현황을 정리한 자료입니다. 연도별·월별로 기부 날짜와 수령 기관, 기부금액, 기부 사유가 기록되어 있으며, 사회복지법인, 종합사회복지관, 어린이재단 등 다양한 단체에 전달된 후원 내역을 확인할 수 있습니다. 기부 사유에는 취약계층 난방 연료 지원, 명절 맞이 소외계층 후원, 아동복지 성금, 지역 저소득 가정 정기 결연 등 구체적인 지원 목적이 포함되어 있습니다. 이를 통해 공기업이 지역사회와 상생하며 사회적 가치를 실현하는 과정을 확인할 수 있으며, 사회공헌 활동의 투명성과 기부금 사용 현황을 파악하는 데 도움이 됩니다. 본 자료는 공공기관의 사회공헌 성과를 평가하고 향후 복지정책 및 지역 지원 사업 기획에 기초 자료로 활용될 수 있습니다.
