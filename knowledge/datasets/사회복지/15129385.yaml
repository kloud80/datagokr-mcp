description_portal: 광주광역시도시공사에서 공급 및 관리하는 임대아파트의 기본 현황을 제공하는 데이터입니다. 본 데이터는 임대대상명, 임대유형, 사용승인일, 공급유형, 총세대수, 스프링클러 설치 세대 수(호) 항목으로 구성되어 있습니다. 공급된 아파트의 유형별 현황과 안전시설 설치 여부를 함께 제공함으로써 주거 안정성과 생활 안전에 대한 정보를 종합적으로 파악할 수 있습니다. 임대방식에 따른 구분과 공급특성, 세대 규모를 명확히 확인할 수 있어 정책 수립, 주거복지 연구, 시민 정보 접근에 활용할 수 있습니다. 각 항목은 구조화되어 있어 이용자가 필요한 정보를 쉽게 검색하고 이해할 수 있도록 구성하였습니다. 공공임대주택의 공급 실태 및 시설 기준을 객관적으로 이해하는 데 기초자료로 활용될 수 있습니다.
