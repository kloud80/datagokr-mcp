summary_user: 국제청소년성취포상제 활동의 세부계획이 바뀐 이력을 변경 건별로 담은 전국 단위 원천 데이터로, 활동프로그램·세부계획·변경 일련번호와 탐험활동 종류, 계획일자, 변경 구분, 등록·수정 일시를 기록한다. 청소년활동 기관이나 정책 분석가가 "포상제 참가 청소년의 탐험활동 세부계획이 언제, 어떤 구분으로 변경됐는가"를 확인할 때 쓴다. 전역 조인 키는 없으며, 같은 기관의 포상제 활동프로그램 데이터와 활동프로그램일련번호(actvPrgrmSn) 같은 기관 내부 일련번호나 코드 매핑으로만 이어 쓴다.
limits: 실측 컬럼에 다른 기관 데이터와 잇는 전역 조인 키가 없어 지역 통계와 바로 결합할 수 없고, 범위가 전국·비공간이라 지역별 분석에는 맞지 않는다. 이벤트 발생 때 생성된 뒤 바뀌지 않는 기록이라 주기적으로 갱신되는 현황 자료로 보면 안 된다.
