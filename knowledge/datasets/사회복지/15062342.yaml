summary_user: 2020년부터 2024년까지 보행상 장애 판정을 받은 사람을 연도·시도·시군구별로 집계해, 정도가 심한 장애인 수와 심하지 않은 장애인 수를 담은 전국 단위 파일(CSV)이다. 지자체 복지 담당자나 분석가가 '우리 시군구에 보행상 장애가 심한 사람이 몇 명이고 최근 몇 년간 어떻게 바뀌었나'를 확인해 이동지원·편의시설 수요를 가늠하는 데 쓴다. 실측 컬럼에 행정구역 코드 같은 공통 조인 키가 없어, 다른 데이터와는 시도·시군구 이름을 맞춰 연결해야 한다.
limits: 개인별 원천이 아닌 시군구 단위 집계라 장애 유형별 구분이나 개인 특성 분석에는 쓸 수 없다. 행정구역 코드가 없어 다른 통계와 연결할 때 시도·시군구 명칭 매핑이 필요하다.
