summary_user: 청소년국제교류네트워크 활동증명서를 수기로 발급한 건에 대해 사업명, 주요내용, 주관기관명을 담은 전국 단위 비공간 목록이다. 청소년 국제교류 활동 이력을 검증하거나 증명서를 관리하는 담당자가 '이 사업은 어느 기관이 주관했고 어떤 내용이었나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주관기관명(sprvsnInstNm)이나 사업명 같은 이름 매칭으로만 잇는다.
description_portal: 청소년 국제 교류 네트워크 활동 증명서 수기발급 정보 서비스 조회를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 주관기관명, 사업명, 주요내용의 내용을 확인할 수 있습니다.청소년이 참여한 국제 교류 활동의 인증을 위한 증명서 수기발급 데이터를 기반으로, 이력 검증 시스템이나 증명서 관리 솔루션에 접목하여 행정의 효율성을 높일 수 있습니다. 사업명과 주요 내용, 주관기관 정보를 확인할 수 있어 외부 인증기관이나 해외연계기관에도 활용 가능성이 있습니다. 활동 증빙 자료로서 구직 시 이력 활용, 대외활동 목록 관리 등의 다양한 영역에서 활용될 수 있습니다. 경력 포트폴리오 관리에도 활용될 수 있습니다.
