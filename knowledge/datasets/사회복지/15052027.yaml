summary_user: 경상북도 안의 재가노인 복지시설을 시설 한 곳당 한 행으로 담은 목록으로, 연번·시군·시설명·소재지 주소를 담는다(csv 약 7.6KB). 경북 주민이나 보호자가 '우리 시군에 집에서 이용할 수 있는 재가 복지시설이 어디에 있나'를 찾거나, 분석가가 시군별 재가시설 분포와 접근성을 비교하는 데 쓴다. 전역 조인 키가 없어 시군 이름이나 시설명·주소를 맞춰 다른 노인복지시설 목록·장기요양기관 자료·시군 단위 지역통계와 이어 쓴다.
