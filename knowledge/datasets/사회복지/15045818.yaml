summary_user: 사학연금 퇴직연금수급자의 평균연금월액을 연령구분(50세 미만~90세 이상)별 행으로 두고, 학교급(유치원·초·중·고·전문대·대학교·특수학교·학교경영기관)×교원/직원×성별 열로 나눈 전국 단위 집계표(csv 약 11KB)다. 사학연금 정책 분석가나 연금 연구자가 '같은 연령대에서 대학교 남성 교원과 유치원 여성 직원의 평균 퇴직연금월액 차이는 얼마인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령구분·학교급 같은 이름을 맞추거나 같은 공단의 다른 사학연금 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 사립학교교직원연금공단 사학연금수급자 현황(퇴직연금수급자 평균연금월액) 데이터는 학교급별(유치원, 초등학교, 중학교, 고등학교, 전문대학교, 대학교, 특수학교, 법인), 교직원별(교원, 사무직원), 그리고 성별(남·여)로 수급자를 구분하고 연령별로 수급자 수를 집계하여 제공합니다. 연령은 50세 미만부터 90세 이상으로 1세씩 증가하는 추이로 나누어 집계되었으며, 교직원별 평균과 전체 평균값을 제공합니다. 이 데이터는 연금 수급자 추이 파악 및 제도 개선을 위한 기초 자료로 활용될 수 있습니다.
