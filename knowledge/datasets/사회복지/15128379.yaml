description_portal: 전라남도 해남군 장애인 장애인전용주차구역위반과태료부과건수 및 금액현황자료 데이터 입니다.이 데이터는 26년 3월 기준으로 2023년 ~2025년의 부과건수 및 부과금액을 확인할 수 있습니다.장애인전용주차구역은  「장애인·노인·임산부 등의 편의증진 보장에 관한 법률」에 따라 설치 되며 주차대수가 일정 규모 이상인 시설은 총 주차대수의 2~4% 범위에서조례가 정하는 비율 이상을 장애인전용주차구역으로 확보해야하며 불법주차 시, 주차 방해 행위 시, 장애인 주차 표지 위반 시 등으로 과태료가 부과될 수 있습니다.
