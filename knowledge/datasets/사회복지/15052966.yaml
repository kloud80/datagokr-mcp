summary_user: 공무원연금 퇴직연금 수급자 수를 재직기간 구간(20년 미만~33년 이상)과 성별로 나누고, 정무직·일반직·경찰·소방·교육직 등 직종별 열로 집계한 전국 단위 통계표다(CSV 약 2KB). 연금 분석가나 정책 담당자가 '소방·경찰 같은 직군은 다른 직종보다 장기 재직 후 퇴직연금을 받는 비중이 높은가, 성별 차이는 어떤가'를 따질 때 쓴다. 지역·기관 코드 같은 전역 조인 키가 없어서 다른 데이터와는 직종명·재직기간 구간 이름을 맞춰 붙이거나, 같은 공단의 다른 수급자 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 공무원연금공단에서 제공하는 직종별·재직년수별 퇴직연금수급자 현황 데이터입니다. 해당 자료는 퇴직연금 수급자를 재직기간(20년 미만부터 시작해 33년 이상까지)과 직종 기준으로 세분화하여 성별(남·여)로 구분하여 제공합니다. 직종은 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관·검사, 기능직, 고용직, 공안직, 군무원, 연구직, 지도직, 계약직, 기타(우정직, 전문경력관 등)로 구성되어 있습니다. 본 데이터는 직종별 재직기간 분포와 퇴직연금 수급구조를 종합적으로 파악할 수 있어, 특정 직군에서의 장기·단기 재직 경향, 퇴직연금 수급 비중, 성별 차이 등을 분석하는 데 활용됩니다. * 직종구분 "기타"에는 위원회 등 상임위원과 전임위원, 기타직 공무원 등이 포함되어 있음
