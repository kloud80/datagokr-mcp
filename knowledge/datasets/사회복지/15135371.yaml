description_portal: '이 데이터는 재난·재해로 인해 주거지를 상실한 이재민을 일시적으로 수용할 수 있는 임시주거시설의 현황을 정리한 자료입니다. 읍·면 단위 행정구역을 기준으로 지정된 경로당, 마을회관, 공공시설, 복지시설 등 다양한 유형의 건물을 포함하며, 각 시설의 명칭, 주소, 수용 가능 인원, 면적, 위도·경도 정보 등을 담고 있어 위기상황 시 신속한 대응체계 수립 및 수용계획 마련에 유용하게 활용될 수 있습니다. 데이터는 총 12개 컬럼으로 구성되어 있으며, 기준일은 2025년 9월 2일입니다.연번: 데이터에 기록된 임시주거시설의 일련번호입니다.읍면구분: 해당 시설이 위치한 읍·면 행정구역입니다.시설구분: 경로당, 마을회관, 공공시설 등 시설의 유형을 나타냅니다.시설명: 이재민 임시주거시설로 지정된 장소의 명칭입니다.상세시설명: 동일 건물 내 구분된 세부 공간명을 나타냅니다(예: 본관, 체육관).지정일자: 해당 시설이 임시주거시설로 지정된 날짜입니다.상세주소: 도로명 주소 기준의 상세 위치 정보입니다.위도: 시설이 위치한 위도 좌표입니다.경도: 시설이 위치한 경도 좌표입니다.수용가능면적(제곱미터): 이재민 수용이 가능한 실내 면적입니다.수용가능인원(명): 해당 시설이 수용 가능한 최대 인원 수입니다.데이터기준일: 본 데이터가 집계된 기준일'
