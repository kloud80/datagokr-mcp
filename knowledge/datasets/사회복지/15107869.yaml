description_portal: 이 데이터는 대구광역시 수성구 내 동(읍면동)별 무연고 사망자 현황을 정리한 자료로, 동명, 연도별 사망자 수 항목을 포함하고 있다. 무연고 사망자는 가족이나 지인 등 연고자가 없어 행정기관이 장례를 진행한 사례를 의미하며, 본 자료는 각 동별로 사망자 분포를 파악하여 사회적 고립 및 복지 사각지대 현황을 진단할 수 있도록 구성되었다. 또한 연도 및 성별, 연령대 기준의 통계를 통해 고령화 및 1인 가구 증가 등의 인구 변화와 연관된 사회문제를 분석할 수 있다. 본 데이터는 복지 서비스 기획, 취약 주민 발굴, 공공 돌봄 시스템 강화, 민원 대응 및 정책 모니터링 등에 유용하며, 수성구가 사회적 안전망 구축과 복지 정책 효과성 제고를 위한 기초자료로 정기적으로 갱신하여 제공된다.
