summary_user: 경기도에서 한부모가정에 제공된 지원 이력을 건별로 담은 파일로, 생년·혼인관계·자녀 수·지원형태·공적부조와 민간지원 구분·세부 지원 항목·등록일자를 기록한다. 복지 분석가나 지자체 담당자가 '한부모가정에 어떤 민간·공공 지원이 얼마나 자주 갔고 어디에 빈틈이 있었나'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지원 항목명이나 같은 기관 코드 매핑으로만 이어 쓰고, 세부 부문상 사회복지시설 공통 마스터를 참조한다.
description_portal: 이 데이터는 한부모가정에게 제공된 다양한 형태의 지원 이력을 기록한 자료로, 생년, 혼인관계 여부, 자녀 수, 지원형태, 공적부조구분, 민간지원구분, 공공지원 및 기타지원 항목과 등록일자로 구성되어 있습니다. 특히 민간지원구분과 민간지원 항목에는 예를 들어 '기타지원/물품지원', '러브더월드/명절 낮잠이불'과 같은 세부 내용이 포함되어 있어, 실질적인 물품 또는 서비스 제공 내역을 파악할 수 있습니다. 이 데이터는 한부모가정에 대한 민간 및 공공 부문 지원 유형 및 빈도 분석, 지원의 사각지대 파악, 정책 대상자 수요 기반 지원체계 설계 등에 활용될 수 있습니다. 등록일자 정보는 시계열 분석에도 유용하며, 다른 인적사항 또는 상담이력 데이터와 연계하여 종합적인 복지 서비스 효과를 분석할 수 있습니다.※ 기업매칭 지원 사업으로 발굴된 공익데이터입니다.※ 데이터 제공 기관에서 해당 자료 작성프로그램 문제로 22년부터 업데이트가 중단된 데이터입니다.
