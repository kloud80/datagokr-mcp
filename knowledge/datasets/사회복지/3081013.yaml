summary_user: 대전광역시 동구에 있는 노인복지시설(여가·의료·재가)을 시설 한 곳당 한 행으로 담은 목록 파일(csv 약 14KB)로, 시설종류·시설명·영업상태·주소·전화번호를 담는다. 동구 주민이나 가족이 가까운 경로당이나 재가·요양 시설 가운데 지금 운영 중인 곳과 연락처를 찾을 때, 또는 구 단위 노인복지 인프라 분포를 살필 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시설명·주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓰며, 건강보험 장기요양기관 목록이나 사회복지시설 시설코드와는 이름·주소 매칭으로 연결해야 한다.
description_portal: '이 데이터는 대전광역시 동구에 위치한 노인복지시설(노인여가복지시설, 노인의료복지시설, 재가노인복지시설) 현황정보 현황 정보를 제공하고 있으며, 세부 내용으로는 시설종류에 따른 시설명, 영업상태, 주소, 전화번호를 포함하고 있습니다.이 데이터는 어르신들의 복지 향상과 맞춤형 서비스 제공을 위한 기초자료로 활용되며, 지자체의 정책 수립과 민간의 복지서비스 연계에도 중요한 자료로 사용됩니다.해당 데이터는 연간 주기로 등록되고 있으며, 기준일자를 통해 데이터의 최신성을 확인할 수 있습니다. * 데이터 기준일: 2026. 7. 20.'
