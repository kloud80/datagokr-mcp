summary_user: 경기도여성가족재단 여성가족도서관이 보유한 도서와 자료를 한 건씩 도서명·저자명·출판사·발행년도로 담은 소장 목록입니다. 연구자나 정책 담당자가 특정 주제의 여성·가족 정책보고서나 실태조사를 재단 도서관에서 열람할 수 있는지 확인하거나, 발행년도별 자료 현황을 볼 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 도서명·저자명 같은 이름 매칭으로만 이어 씁니다.
description_portal: '이 데이터는 경기도여성가족재단에서 보유하고 있는 도서 및 자료의 목록을 나타낸 것으로, 도서명정보, 저자명정보, 출판사명, 발행년도 항목으로 구성되어 있습니다. 수록된 자료는 여성 및 가족 관련 정책보고서, 통계자료, 실태조사, 전문서적 등으로 구성되며, 국내외 학술 연구와 정책 수립을 위한 주요 참고문헌으로 활용됩니다. 해당 자료들은 경기도여성가족재단 여성가족도서관에서 열람 가능하며, 연도별 발행현황을 통해 시기별 정책 동향 분석에도 유용합니다.※ 경기도여성가족재단 여성가족도서관 "여울" : https://www.gwff.kr/base/contents/view?contentsNo=72&menuLevel=2&menuNo=20'
