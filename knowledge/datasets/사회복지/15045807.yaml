summary_user: 사립학교 교원 퇴직자 수를 연도와 재직기간 구간별로, 유치원·초등학교, 중학교, 고등학교, 전문대학, 대학(교), 특수학교 등 학교급을 열로 나눠 담은 전국 단위 집계표(CSV 약 6.5KB)다. 분석가나 교육·연금 정책 담당자가 '재직 몇 년 차 교원이 어느 학교급에서 많이 퇴직하는가'처럼 사학 교원의 퇴직 양상과 인력 수급, 연금 재정 흐름을 살피는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 연도·재직기간·학교급 이름을 맞추거나 같은 공단의 다른 직역연금 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 사립학교교직원연금공단에서 제공하는 재직기간별 연령별 교직원 퇴직 수와 관련된 데이터로, 연령별(25세미만~66세이상), 재직기간별(1년미만~33년이상) 학교급별(유치원,중학교,고등학교,전문대학,대학교,특수학교) 교원 퇴직 현황 데이터를 제공합니다.퇴직 교원의 재직 기간, 소속 학교 유형(유치원, 초등, 중등, 고등 등)별 퇴직자 수 등 교육 인력의 퇴직 양상을 파악하는 데 필요한 핵심 정보를 포함하고 있습니다. 이 데이터를 통해 사립학교 교원 인력의 변화 추이를 분석하고, 교육 정책 및 연금 제도 개선을 위한 기초 자료로 활용될 수 있습니다. 또한, 미래 교육 인력 수급 예측 및 교직원 연금 제도의 안정성 분석에도 기여할 수 있습니다. 본 데이터는 공공기관의 정보 공개를 확대하고, 교육 분야의 투명한 정보 제공을 위한 중요한 자료입니다.
