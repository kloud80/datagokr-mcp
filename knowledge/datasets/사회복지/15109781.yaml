summary_user: 전국 청소년상담복지센터의 시설 정보를 센터 단위로 담는 API이며, 센터명·설치유형·운영시간·상담인력수·심리검사 가능 여부와 주소·좌표를 포함한다. 위기 청소년이나 보호자가 가까운 상담센터의 위치, 운영시간, 방문상담 가능 여부를 찾는 질문과 지역별 상담 서비스 분포를 보는 분석에 쓴다. 도로명주소·지번주소(address)와 위도(coord)를 키로 지도·주소 데이터와 잇고, 시도명·시군구명을 통해 지역 통계(regional-statistics)와 연계할 수 있다.
description_portal: 전국의 도움이 필요한 청소년들에게 상담 및 교육 등을 지원하는 청소년상담복지센터의 시설 정보를 제공하는 오픈 API형 데이터입니다.  해당 개방데이터는 청소년상담복지센터의 POI정보(도로명주소, 지번주소, 위도, 경도), 시설명, 시설 유형, 전화번호, 이메일주소, 운영 시간, 휴일, 이용 방법, 인근 교통시설, 기관 방문 가능 여부, 심리검사 가능 여부, 상담 인력 수, 센터명, 홈페이지 주소 등을 확인할 수 있습니다.  청소년상담복지센터의 위치 및 유형 정보를 기반으로 접근성과 운영 현황, 상담 서비스 제공 여부를 파악할 수 있어 청소년 맞춤형 지원 정책 수립과 이용자 편의 증진, 지역 간 상담 서비스 격차 해소, 관련 기관 간 협력 체계 구축 등 다양한 행정 및 연구 목적으로 활용될 수 있습니다.
