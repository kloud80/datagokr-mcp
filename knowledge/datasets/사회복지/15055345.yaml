summary_user: 부천시 관내 여성·가족 복지시설을 시설 한 곳당 한 행으로 정리한 소규모 목록 파일(CSV 약 1.3KB)로, 시설명·도로명 주소·전화번호·운영주체(위탁법인)를 담는다. 부천 시민이나 상담 실무자가 "우리 동네 가까운 여성·가족 복지시설은 어디이고 어느 법인이 운영하는가"를 확인할 때 쓴다. 전역 조인 키는 없어서, 다른 사회복지시설 목록과는 시설명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부천시 관내에 있는 여성·가족 복지시설 현황 데이터로 복지시설명, 소재지 주소(도로명), 운영주체(위탁법인), 대표자, 전화번호 등 정보를 제공합니다. 이를 통해 시민들은 부천시 내 여성·가족 복지시설의 위치와 운영 정보를 쉽게 확인할 수 있습니다. 젠더폭력 예방, 돌봄 공백 해소 등 사회적 문제 대응과 성평등 정책 수립에 있어 기초 자료로 활용될 수 있으며, 사회적 약자의 안전망 구축과 복지 사각지대 해소에 중요한 기반 자료로 활용되며 여성·가족 복지 정책 수립, 시설 이용 안내, 연구 및 분석 등 다양한 분야에서 활용될 수 있습니다.
