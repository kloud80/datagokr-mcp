summary_user: 경기도 특수학교 학생 수를 기준연도(STD_YY)와 장애영역별로 집계한 자료로, 영역별 총학생 수와 장애영아·유치원·초·중·고·전공과의 연령·학년별 학생 수를 담으며 원천 건별 자료가 아닌 시도 단위 집계다. 교육행정 담당자나 분석가가 '경기도 특수학교에서 발달지체·지체장애 학생이 어느 과정에 몰려 있고 해마다 어떻게 변하나' 같은 질문에 답하고 학급 편성·교원 배치 수요를 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 특수교육 통계와는 기준연도와 장애영역 이름을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 교육부 특수교육통계를 바탕으로 경기도 내 특수학교 학생 수를 장애영역별 및 학교과정별로 집계한 자료입니다. 매년 6월 말 기준으로 수집되며, 지체장애, 시각장애, 청각장애, 발달지체, 학습장애 등 다양한 장애영역별 총학생 수와 함께 학교과정별 세부 학생 수를 제공합니다. 항목에는 장애영아(1세 미만, 1세, 2세 등), 유치원(3세~5세), 초등학교(1~6학년), 중학교(1~3학년), 고등학교(1~3학년), 전공과(1~3년차) 과정별 학생 수가 포함됩니다. 본 자료는 장애영역별 특수교육 수요, 연령·학년별 교육 인프라 현황을 파악하는 데 활용되며, 특수학교 학급 편성, 교원 배치, 지역별 교육격차 해소 정책 수립 등 특수교육 행정의 기초자료로 활용될 수 있습니다.
