summary_user: 한국피해자지원협회의 범죄 피해자 상담 이력을 바탕으로 피해자 1명(상담 건)마다 나이·성별·소재지 주소·피해유형(상해·강도·강간·강제추행·특수폭행 등)을 담은 건별 데이터이며, 범위는 시도 단위이고 지도 좌표는 없다. 정책 분석가나 피해자 지원기관이 '어느 지역에서 어떤 성별·연령대의 피해자가 성범죄·폭력범죄 상담을 많이 받는가'를 파악해 맞춤형 지원 서비스를 기획할 때 쓴다. 실측 컬럼에 공통 조인 키가 없어, 소재지 주소(locplc_addr)를 시군구 이름으로 정리해 지역별 통계나 사회복지시설 공통 마스터와 이름으로 맞춰 붙여 쓴다.
description_portal: 이 데이터는 사단법인 한국피해자지원협회에서 범죄 피해자에 대한 상담 이력을 기반으로 수집된 피해자 지원 상담 데이터입니다. 주요 항목은 아이디, 피해자나이, 성별, 소재지주소, 피해유형으로 구성되어 있으며, 피해유형에는 상해, 강도, 강간, 강제추행, 특수폭행 등의 범죄가 포함됩니다. 해당 데이터는 피해자의 성별 및 연령, 지역별 분포와 범죄유형을 분석하여 성범죄 및 폭력범죄의 발생 양상과 경향을 파악하는 데 활용될 수 있습니다. 또한, 사회적 약자 보호, 범죄 예방 대책 수립, 피해자 맞춤형 지원 서비스 기획 등에 기초자료로 사용될 수 있습니다
