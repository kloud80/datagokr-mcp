description_portal: '"사립학교교직원연금공단 VOC 상위 5개 민원별 발생건수 데이터는 고객의 주요 요구사항을 파악하여 서비스 개선에 활용하기 위하여 고객의소리(VOC) 시스템을 통하여 수집하고 있습니다.이 데이터의 상위 5개 민원은 가입자관리, 급여, 대여, 재해보상, 연금연계, 기타이며, 월별 발생 건수를 기준으로 상위 민원 유형을 분류합니다.해당 데이터는 자주 발생하는 민원 종류의 월별 민원 발생 추이를 분석하여 내부 업무 효율성을 높이는 근거자료로 활용될 수 있으며 대국민 서비스 개선 및 정책 수립을 위한 기초 자료로 활용될 수 있습니다.'
