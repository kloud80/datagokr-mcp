summary_user: 아이돌봄 지원사업 관련 설문 실태조사 결과를 통계ID·통계명·구분·분류별 통계값과 값 단위로 담은 집계 데이터로, 범위는 전국 단위이며 지역 구분이 없는 비공간 자료입니다. 정책 연구자나 돌봄 서비스 기획자가 '아이돌봄 서비스 이용 가정과 돌보미는 서비스를 어떻게 평가하고 무엇이 필요하다고 답했나'를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 통계명·분류명 같은 이름으로 맞추거나 같은 기관(한국건강가정진흥원)의 아이돌봄 데이터와 나란히 놓고 쓴다.
limits: 전국 단위 집계라 시도·시군구별 비교는 할 수 없고, 응답자 개별 원자료도 담지 않는다. 공통 조인 키가 없어 다른 데이터와 자동 결합이 어렵고, 개발계정은 하루 10,000회로 호출이 제한된다.
