summary_user: 국민연금에 가입된 사업장 수(개소)를 기준년월별로 전국 단위 한 숫자씩 담은 집계 파일이며, 포털 설명상 2016년부터 2020년 8월까지를 다루고 파일 크기는 139바이트로 작다. 분석가나 연구자가 '2016~2020년 사이 국민연금 가입 사업장이 매달 얼마나 늘거나 줄었나' 같은 전국 추세를 볼 때 쓴다. 전역 조인 키는 없고 기준년월로만 다른 월별 통계와 나란히 놓을 수 있으며, 사업자번호가 없어 사업장 단위 원장이나 기업 데이터와는 연결되지 않는다.
limits: 전국 합계만 있어 지역·업종·규모별 분해나 개별 사업장 조회는 하지 못하며, 사업장별 가입자 수·납부액 같은 원장 정보는 이 파일에 없다. 포털 설명 기준 수록 기간이 2020년 8월에서 끝나므로 최근 시점 분석에는 맞지 않는다.
