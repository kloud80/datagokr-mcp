summary_user: 김해시 관내 시니어클럽(노인일자리 수행기관)을 기관 한 곳당 한 행으로 담은 목록으로, 단체명·운영 법인명·전화·팩스·주소·지정일자를 제공하며 원본 파일은 348바이트 크기의 소규모 CSV다. 김해시에서 노인일자리 참여를 알아보는 어르신이나 가족이 가까운 시니어클럽의 연락처와 위치를 찾을 때, 또는 분석가가 시군구 단위 노인일자리 수행기관 분포를 정리할 때 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 주소나 법인명·단체명을 직접 맞춰서 이어 써야 한다.
description_portal: '경상남도 김해시 시니어클럽 운영 현황에 대한 데이터로 연번, 단체, 법인명, 전화번호, 팩스, 주소, 지정일자, 데이터기준일의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 11월 11일로, 연간 주기로 관리하고 있습니다.* 해당 데이터를 분석·활용함으로써 지역 사회의 고령화 대응 및 노인 일자리 창출 등 다양한 사회 문제 해결에 기여할 수 있습니다.데이터 담당부서 : 김해시 노인복지과(055-330-3298)[데이터 변동 안내]1. 데이터 설명 수정2. 데이터 키워드 추가3. 데이터 기준일 변경'
