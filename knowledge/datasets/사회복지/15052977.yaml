summary_user: 공무원연금 퇴직연금 수급자 수를 38세 미만부터 85세 이상까지 연령 구간(구분)별로 나누고, 명예퇴직·정년퇴직·일반퇴직·당연퇴직·직권면직·기타(파면·해임·실종 등) 퇴직사유별로 집계한 전국 단위 표입니다. 연금·인사 분석가가 어느 연령대에서 정년퇴직이 몰리는지, 명예퇴직 같은 조기 퇴직이 어느 연령대에 많은지를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령 구간이나 퇴직사유 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: 공무원연금공단에서 관리하는 연령별 퇴직사유별 퇴직연금수급자 현황 데이터입니다.해당 자료는 38세 미만부터 85세 이상까지 연령 구간을 기준으로 퇴직연금 수급자의 규모를 집계하며, 퇴직사유를 명예퇴직, 정년퇴직, 일반퇴직, 당연퇴직, 직권면직, 기타(파면, 해임, 실종 등)로 세분화하여 제공합니다. 본 데이터는 특정 연령대별 퇴직 유형의 분포와 규모를 파악할 수 있어, 정년퇴직자의 집중 시점, 조기 퇴직 증가 추이, 비정형적 퇴직사유의 발생 현황 등을 분석하는 데 활용됩니다.이를 통해 공무원 조직 내 퇴직 구조의 세대별 차이를 진단하고, 인력운영 계획 등의 기초자료로 활용할 수 있습니다.
