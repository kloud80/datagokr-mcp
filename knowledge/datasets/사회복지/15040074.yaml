summary_user: 인천 서구(제목상 서해구) 안 공동육아나눔터를 시설 한 곳당 한 행으로 담은 파일로, 기관명·소재지·정원·이용대상 연령·운영시간·이용요금·이용방법·주요프로그램을 싣고 있으며 파일 크기는 977바이트로 몇 곳 안 되는 소규모 목록이다. 서구에 사는 부모가 "우리 동네 공동육아나눔터는 어디에 있고 몇 시까지 열며 몇 살 아이가 이용할 수 있나"를 확인할 때 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 소재지 주소나 기관명으로 맞춰 붙여야 하며, 같은 지역의 어린이집·육아종합지원센터 목록과 주소 기준으로 함께 보는 정도로 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 공동육아나눔터의 운영 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 공동육아나눔터의 기관명, 소재지, 시설소개, 누리집(홈페이지), 전화번호, 수용인원, 이용대상, 운영시작시간, 운영종료시간, 이용요금, 이용방법, 주요프로그램 등 다양한 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 주민들은 공동육아나눔터의 위치를 쉽게 파악할 수 있습니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영 하고 있습니다.
