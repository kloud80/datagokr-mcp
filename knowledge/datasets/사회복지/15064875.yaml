summary_user: 인천광역시 안의 노인여가복지시설(노인복지관·노인대학·경로당 등)을 시설 한 곳당 한 행으로 담은 파일이며, 군구명·시설명·개소일·주소·연락처를 포함합니다. 시민이 "우리 구에서 가까운 경로당이나 노인복지관이 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 군구별 노인여가시설 분포를 비교하는 데 씁니다. 전역 조인 키는 없어서 군구명을 이름으로 매핑해 지역(시군구) 통계와 잇거나, 시설명·주소를 맞춰 다른 노인복지시설·장기요양기관 목록과 대조하는 방식으로만 연결합니다.
