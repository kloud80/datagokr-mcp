summary_user: 경상북도 관내에서 신고 수리·인가되어 설립된 협동조합을 조합 한 곳당 한 행으로 담은 파일(CSV 약 577KB)로, 조합명·운영상태·수리(인가)일·업종·유형·주요사업·시군구·주소·소관부처를 수록한다. 지자체 사회적경제 담당자나 분석가가 "경북 어느 시군에 어떤 업종의 협동조합이 언제 많이 설립됐고 지금도 운영 중인가"를 파악하는 데 쓴다. 전역 조인 키나 사업자번호가 없어 다른 데이터와는 시군구명·주소 같은 지역 정보나 조합명 매칭으로만 연결하며, 사회적기업·마을기업 현황과도 이름·지역 기준으로 대조해야 한다.
description_portal: 경상북도 관내에서 관련 법령에 따라 신고 수리 및 인가되어 설립된 협동조합의 상세 운영 현황을 제공하는 데이터입니다. 주요 제공 항목으로는 각 조합의 명칭과 소재지(주소)가 포함되어 있어 지역별 분포를 확인할 수 있습니다. 또한, 조합의 성격을 파악할 수 있는 조직 구분 및 업종 정보와 함께, 실제 영위하고 있는 주요 사업 내용을 상세히 수록하여 협동조합의 활동 분야를 분석하는 데 도움을 줍니다. 아울러 행정 절차가 완료된 수리(인가)일자 정보를 통해 시기별 설립 추이를 파악할 수 있습니다. 본 자료는 지역 내 사회적 경제 생태계 분석 및 활성화 정책 수립을 위한 기초 자료로 활용됩니다. 자료 관련 문의는 054-880-2623으로 하시기 바랍니다.
