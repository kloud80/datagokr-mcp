summary_user: 경기도 워라밸링크 플랫폼 콘텐츠에 붙는 주제별 태그를 태그 한 건씩 담은 원천 기록으로, 고유번호(idntfy_no)·태그 이름(nm)·작성일시(wrt_ymd)로 구성된다. 플랫폼 운영자나 분석가가 '여성' 같은 특정 주제 태그가 언제 얼마나 자주 만들어졌는지, 같은 태그가 중복 저장됐는지를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 태그 이름을 매핑하거나 같은 기관(경기도) 자료끼리 묶는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도의 워라밸링크 플랫폼에서 사용되는 태그 정보를 기록한 자료로, 각 콘텐츠에 부착된 주제별 태그의 생성 이력 및 속성을 나타냅니다. 항목은 고유번호, 태그 이름, 작성일시로 구성되어 있으며, 예시로 '여성' 태그가 여러 시점에 반복 기록되어 있는 점에서 다중 태그 입력 이력 및 시스템 중복 저장 여부 확인 등에 유용합니다. 이 데이터는 콘텐츠 분류 및 검색 최적화, 주제별 정책 콘텐츠 분포 분석, 사용자 관심 분야 추이 분석 등에 활용될 수 있으며, 작성일시를 통해 태그 생성 시점 및 활용 빈도를 확인에도 참고할 수 있습니다.
