summary_user: 국제청소년성취포상제 참가자의 입회 건별로 입회번호·입회상태, 신청·승인일자, 소속 시설명, 포상명과 포상단계, 활동 승인 상태, 다음 단계 도전 여부, 온·오프라인 구분을 담은 전국 범위의 원천 데이터입니다. 청소년 활동 분석가나 시설 운영자가 "어느 시설에서 어떤 포상 단계까지 진행한 청소년이 얼마나 되고, 다음 단계에 도전하는 비율은 어떤가"를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 청소년 시설·활동 데이터와는 시설명(fcltNm) 같은 이름 매칭으로만 잇는다.
description_portal: 성평등가족부의 국제청소년성취포상제 입회 정보를 제공하는 오픈 API형 데이터입니다. 해당 개방데이터는 입회번호, 입회상태명, 신청일자, 승인일자, 시설명, 포상명, 활동 승인 상태명, 포상단계명, 활동신청여부, 포상승인일자, 다음단계 도전여부, 온오프라인 구분명의 내용을 확인할 수 있습니다. 국제청소년 성취포상제 입회 현황과 관련된 정보를 체계적으로 제공하여, 참여 단계별로 진행상황을 관리하고, 성취목표설정 및 과정의 객관적 검토를 가능하게 하며, 프로그램 운영의 일관성 유지에도 기여합니다.
