description_portal: 가족친화제도를 모범적으로 운영하는 기업 및 공공기관의 시설 정보를 제공하는 오픈 API형 데이터입니다.  해당 개방데이터는 가족친화인증기관의 주소, 위도, 경도 등의 POI 정보와 대표 전화번호, 홈페이지 주소, 대표 연락처, 신규 인증연도, 인증 기준 일자, 시설명, 대표자명을 확인할 수 있습니다.  가족친화적 문화를 조성하고 있는 기관의 분포를 시각화하거나 분석하는 데 활용할 수 있으며, 정책 홍보, 기업 컨설팅, 가족친화 인증제도 활성화 등 다양한 행정 및 민간 활용 방안에 기여할 수 있습니다.
