summary_user: 가족친화인증을 받은 전국 기업·공공기관을 기관 한 곳당 한 건으로 담는 API 데이터로, 시설명·대표자·도로명/지번 주소·위도·경도·연락처와 신규 인증연도, 인증 유효기간(시작·종료일자)이 들어 있다. 구직자가 우리 지역의 가족친화인증 기업을 찾거나, 분석가가 시도·시군구별 인증기관 분포와 인증 유지 현황을 지도로 보려 할 때 쓴다. 전역 조인 키는 없어서 시도명·시군구명이나 주소·좌표, 기관명 매칭으로 다른 행정·기업 데이터와 이어야 한다.
limits: 공통 기관 코드가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되므로 동명 기관이나 표기 차이에 주의해야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
