summary_user: 청소년 수련시설별 시설 정보와 안전점검 종합평가 결과를 시도명·시설명·평가연도 기준으로 담는 시설 단위 API다. 지역 분석가나 시설 안전 담당자가 특정 시설·지역의 건축·전기·소방 등 분야별 안전등급이 연도별로 어떻게 달라졌는지 살필 때 쓴다. 사업자등록번호(bizno), 주소(address), 위경도(coord) 키로 다른 시설·지도 데이터와 잇고, 시도·시군구 단위로는 지역 통계와 연계한다.
description_portal: 한국청소년활동진흥원에서 제공하는 수련시설 정보 및 안전점검 종합평가 결과 Open API로, 시도명·시설물명·평가연도 기준으로 과거 평가 자료를 조회할 수 있으며 특정 기간 동안의 시설 안전 수준 변화를 정량적으로 파악할 수 있습니다. 이 데이터는 시설 운영의 안전도 변동을 분석할 수 있어 장기적인 시설 안전관리 체계의 개선 추세 평가, 점검 항목별 위험 요인 분석, 지역별 시설 특성 파악 등 다양한 안전·행정 연구에 활용 가능합니다. 행정기관은 이를 기반으로 점검 효율화, 시설 안전관리 정책 수립, 사업 성과 분석 등 근거 기반의 안전정책을 추진할 수 있으며, 민간·연구기관은 시설 안전 수준 관련 서비스 개발, 위험요인 연구, 지역 간 안전도 비교 분석 등에 활용할 수 있습니다.제공되는 항목에는 시도명, 시설명, 평가연도, 시설종류명, 종합평가등급, 건축평가등급, 전기평가등급, 토목평가등급, 소방평가등급, 가스평가등급, 위생평가등급, 기계평가등급, 특이사항, 수용인원수, 숙박정원수, 사업자등록번호, 전화번호, 팩스번호, 홈페이지주소, 우편번호, 주소1, 주소2, 경도, 위도, 소개내용, 운영기관명이 있습니다.제공형식은 JSON, XML 형식으로 제공됩니다.
