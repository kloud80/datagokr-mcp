summary_user: 경기도 내 장애인 권익옹호기관·가족지원센터·발달장애인지원센터·인권센터 같은 장애인 관련 복지시설을 기관 한 곳당 한 행으로 담고, 시군명·기관명·지번/도로명 주소·우편번호·위경도 좌표·전화번호·홈페이지를 제공한다. 장애인 당사자나 가족이 '우리 시군에서 가까운 발달장애인지원센터나 권익옹호기관은 어디이고 연락처는 무엇인가'를 찾을 때, 분석가가 시군별 장애인 지원기관 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)으로 다른 시군 단위 통계와 맞추거나 위경도 좌표로 공간 결합하는 식으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 장애인 관련 주요 복지시설 현황을 정리한 자료로, 권익옹호기관, 가족지원센터, 발달장애인지원센터, 인권센터 등 다양한 기관의 정보를 포함합니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소·도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL, 비고 항목이 있으며, 이를 통해 기관 유형별 특성과 운영 목적을 확인할 수 있습니다. 해당 데이터는 장애인 권리 증진, 가족 지원, 발달장애인 서비스 제공 등 다양한 영역의 복지 인프라 분포를 분석할 수 있으며, 지역별 복지 자원 접근성 평가, 기관별 특화 서비스 분석, 복지정책 수립의 기초자료로 활용될 수 있습니다. 또한 기관별 홈페이지를 통해 구체적인 프로그램과 서비스 내용을 확인할 수 있어 현장 연구 및 정책 활용에 적합합니다.
