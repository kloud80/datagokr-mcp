description_portal: 이 데이터는 제주특별자치도 제주시 소재 의료급여대상자 현황을 정리한 공공데이터입니다. 해당 데이터의 담당 부서는 제주시 기초생활보장과이며, 제주시 지역 내 의료급여대상자의 현황을 급여 구분별·읍면동별로 파악할 수 있도록 구성되어 있습니다.데이터 항목은 읍면동, 국민기초1종, 국민기초2종, 군입대자1종, 군입대자2종, 차상위의료급여특례2종, 차상위의료급여특례18세미만, 국내입양아동, 국가유공자, 광주민주화운동관련자, 중요무형문화재보유자, 북한이탈주민, 이재민, 의상자및의사자의유족, 행려환자, 보장시설수급자, 기타, 데이터기준일자로 이루어져 있습니다. 읍면동 항목을 통해 지역별 현황을 확인할 수 있으며, 각 급여 구분 항목에는 해당 자격 유형에 따른 의료급여대상자 인원 정보가 수록되어 있습니다.이를 통해 제주시 내 의료급여대상자의 분포를 지역 단위로 살펴볼 수 있으며, 국민기초생활보장 수급자, 차상위 계층, 국가유공자, 북한이탈주민 등 다양한 대상 유형별 규모를 함께 확인할 수 있습니다. 또한 데이터기준일자를 통해 해당 현황이 어느 시점을 기준으로 작성되었는지 확인할 수 있어 시점별 자료 관리와 활용에도 도움이 됩니다.
