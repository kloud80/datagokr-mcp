description_portal: 전라남도 여수시 노인 입소시설에 대한 데이터 (시설유형, 시설종류, 시설명, 시설소재지 주소, 연락처 등)의 정보 제공으로여수시 어르신복지 증진 목적의 노인요양 입소시설 현황으로 39개소  사회복지시설의 명칭, 소재지, 연락처를 담고 있습니다.노인요양시설은 장기요양기관 입소어르신들의 안정된 노후생활 및 시설 종사자의 처우개선을 도모하여 어르신 복지 증진에 기여하고자 하는 목적이 있습니다.노인공동생활가정 3개소, 노인요양시설 26개소, 노인요양공동생활가정 10개소가 운영중입니다.노인공동생활가정은  노인을 입소시켜 급식  그 밖에 일상생활에 필요한 편의를 제공함을 목적으로 하는 시설입니다. 장기요양시설은 아닙니다.노인요양시설은  치매 중풍 등 노인성 질환 등으로 심신에 상당한 장애가 발생하여 도움을 필요로 하는 노인을 입소시켜 급식 요양 그밖에 일상생활에 필요한 편의를 제공함을 목적으로 하는 시설입니다.노인요양시설은 10명이상, 노인요양공동생활가정은 5~9명을 정원으로 하고 있습니다.담당부서는 노인장애인과 노인요양팀(061-659-3719)이며 궁금한 사항은 문의바랍니다
