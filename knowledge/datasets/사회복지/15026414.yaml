summary_user: 부산광역시 중구 관내 청소년 지원시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·설치주체·시설종류·공공/민간 구분·운영방법·주소·연락처·위도와 경도·대지면적과 건물 연면적을 담는다(파일 크기 289바이트로 소수 시설만 수록). 중구 주민이나 청소년 지원 사업 담당자가 "중구에 어떤 청소년 시설이 어디에 있고 누가 운영하나"를 확인하는 데 쓴다. 다른 데이터와 공통 코드로 이을 전역 조인 키는 없어서 주소·좌표나 시설명을 매칭해 지도나 다른 시군구 청소년시설 목록과 맞추고, 지역 통계는 시군구 단위로만 연계한다.
