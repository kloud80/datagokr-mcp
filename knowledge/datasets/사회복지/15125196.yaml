summary_user: 청소년 상담에서 집계한 청소년 상태별 정신건강 문제 현황을 차트 형태(제목·구분·X축·Y축 항목과 순번, 값)로 담은 전국 단위 집계 데이터로, 지역 구분이 없는 비공간 자료다. 청소년 정책 담당자나 연구자가 '위기·학교밖 등 청소년 상태에 따라 우울·불안 같은 정신건강 문제 유형이 어떻게 다르게 나타나는가'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 문제 유형명·상태 구분명 같은 이름 매핑으로만 이어 쓸 수 있고, 시군구·시도 코드가 없어 지역 통계와도 직접 연결되지 않는다.
description_portal: 청소년 상담 및 청소년상태별 정신건강 문제 현황 정보를 제공하며, 문제 유형의 제목, x축,y축 내용 및 값에 대한 정보를 조회할 수 있는 오픈 API형 데이터입니다.해당 개방데이터는 제목명, 구분명, x축, y축의 내용과 순번의 정보를 유형별로 조회할 수 있습니다.청소년의 상태별 정신건강 문제를 유형별로 정리하고 , x,y축 값에 따라 비교 분석이 가능해집니다. 이를 통해 정신건강 문제의 발생 경향이나 특성을 쉽게 파악할 수 있으며 청소년 지원 방안 등의 정책 마련에 효과적으로 활용될 수 있습니다.
