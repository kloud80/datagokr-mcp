description_portal: 해당 데이터는 경상북도 영천시 소재의 읍면동에서 기초생활 수급자의 수와 관련된 데이터입니다. 연번, 읍면동, 기초생활급여, 기초의료급여, 기초주거급여, 기초교육급여, 총인원, 데이터기준일자로 데이터가 구성되어 있습니다. 각 기초급여마다 중복 수급하는 경우가 있으므로 총 인원과 4개의 분야별 기초급여 합산은 차이가 있을 수 있으며 총 인원은 중복 수급이 제외된 합산 인원입니다. 이를 통해 영천시 내 각 지역별 복지수급자 현황을 파악할 수 있으며, 정책 수립이나 복지사업 추진 시 중요한 참고자료로 활용될 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 가족행복과로 연락주시기 바랍니다.
