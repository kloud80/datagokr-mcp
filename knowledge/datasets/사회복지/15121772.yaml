summary_user: 여수시 다함께돌봄 아이나래 행복센터를 센터 한 곳당 한 행으로 정리한 현황 파일로, 센터명·개소일·운영방식·소재지 주소·종사자 수·운영시간·사업내용을 담는다(포털 설명상 2026년 1월 31일 기준, 시군구 범위의 개별 주소 단위). 여수시에 사는 보호자가 집 근처 초등 방과후 돌봄센터의 위치와 운영시간, 주말 운영 여부를 확인하거나, 분석가가 시내 돌봄센터 분포와 인력 규모를 살펴볼 때 쓴다. 전역 조인 키는 없으므로 다른 사회복지시설 목록과는 센터명이나 소재지 주소를 맞춰 잇거나 같은 기관 자료끼리 연결해야 한다.
limits: 공통 시설 코드 같은 조인 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭에 의존해야 한다. 범위가 여수시 한 곳이라 다른 시군구의 다함께돌봄센터와 비교하려면 별도 자료가 필요하다.
