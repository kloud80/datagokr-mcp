summary_user: 경기도 내 장애인보호작업장을 기관 한 곳당 한 행으로 담은 현황 목록으로, 시군명·기관명·주소·연락처와 근로장애인 정원·현원, 종사자 정원·현원, 설치신고일, 운영 법인명, 위경도 좌표를 포함한다. 장애인 가족이나 복지 담당자가 '우리 시군에 근로 자리가 남은 보호작업장이 어디 있고 어떤 법인이 운영하는가'를 확인하거나, 분석가가 시군별 장애인 근로 기회 분포를 지도로 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군코드(SIGUN_CD)·시군명, 기관명·법인명 이름 매칭, 위경도 좌표로 연결한다.
description_portal: 장애인 보호작업장 현황 데이터는 경기도 내 장애인의 직업 훈련 및 고용을 지원하는 보호작업장 정보를 제공하며, 시군명, 기관명, 주소(지번·도로명), 우편번호, 전화번호, 홈페이지, 근로장애인 및 훈련장애인 현원 수, 종사자 정원 및 현원, 설치신고일, 법인명 등의 항목으로 구성되어 있습니다. 본 데이터는 지역별 장애인 근로 기회 분포와 기관 운영 현황을 파악하는 데 활용되며, 특히 사회적협동조합, 사회복지법인 등 다양한 운영주체별 특성을 비교할 수 있습니다. 또한 위도·경도 좌표가 제공되어 지도 기반 분석과 서비스 접근성 평가가 가능하며, 장애인 고용정책 수립, 직업재활 프로그램 운영, 지역사회 복지자원 연계 등에 중요한 기초자료로 활용됩니다.
