summary_user: 대구광역시 북구의 노인일자리 및 사회활동지원사업 수행기관을 기관별 한 건씩 담은 목록으로, 기관명·도로명주소·전화번호를 제공한다. 북구에 사는 어르신이나 가족이 노인일자리 참여를 문의하려 할 때 근처 시니어클럽이나 노인복지관의 연락처와 위치를 찾는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설 데이터나 장기요양기관 데이터와는 기관명이나 도로명주소(RDNMADR)를 맞춰 보는 방식으로만 이어 쓴다.
