description_portal: 2023년 자활사업에 참여했던 분들을 대상으로 한 실태조사 데이터와 코드북을 제공해 드립니다. 이 귀중한 자료는 자활사업 참여자들의 당시 현황과 특성을 깊이 있게 이해하고, 정책 개선 방향을 모색하는 데 중요한 기반이 될 것입니다. 특히, 본 데이터는 자활사업의 효과성을 분석하고 미래 정책을 수립하는 데 필수적인 정보를 담고 있습니다.조사표와 세부 조사 내용에 대한 연구 결과는 한국자활복지개발원 대표 홈페이지 내 '기관자료' > '정책자료' > '연구보고서' 경로를 통해 해당 보고서를 반드시 참고해 주시기 바랍니다. 이 보고서에는 실태조사의 배경과 목적, 방법, 그리고 주요 결과가 상세히 설명되어 있습니다.
