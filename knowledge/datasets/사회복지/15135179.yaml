summary_user: 경기도 워라밸링크 플랫폼에 올라온 테마 콘텐츠 목록으로, 한 행이 콘텐츠 한 건이며 고유번호·썸네일 제목·본문 제목만 담는다. 워라밸 정책 홍보물을 기획하는 담당자나 분석가가 '그동안 어떤 워라밸 주제(가족친화기업 소개, 진단 서비스, 근무 환경 변화 등)를 다뤘나'를 훑어볼 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키가 없어, 제목 텍스트를 기준으로 같은 기관(경기도)의 다른 워라밸 데이터와 수작업으로 대조하는 정도로만 연결한다.
description_portal: 이 데이터는 경기도 워라밸링크 플랫폼의 테마 콘텐츠 정보를 담고 있습니다. 각 항목은 고유번호, 썸네일 제목, 본문 제목으로 구성되어 있으며, 주로 워라밸과 관련된 정책, 진단 서비스, 가족친화기업 소개, 직장인 근무 환경 변화 등의 내용을 다루고 있습니다. 직장인의 삶의 질 향상을 위한 콘텐츠가 포함되어 있으며, ‘신조어로 알아보는 워라밸!’과 같이 쉽고 흥미로운 주제로 접근하는 콘텐츠도 함께 제공됩니다. 본 데이터는 정책 홍보 콘텐츠 제작, 사용자 관심사 분석, 워라밸 콘텐츠 기획 등에 활용하실 수 있습니다.
