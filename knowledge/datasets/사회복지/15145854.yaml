description_portal: '○ 통계개요* 통계명 : 자원봉사활동 경험여부 및 참여 횟수* 통계종류 : 서울서베이의 서울시민 자원봉사 참여현황을 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축및분석을 실시함으로써 서울의 현재상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을 모니터링하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을 제시하는데목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별ㆍ연령별ㆍ지역별ㆍ학력별 등)의 자원봉사 참여율및 분야별 참여현황 등○ 용어설명* 자원봉사 : 자원봉사활동이란 개인 또는 단체가 타인및지역사회 등을 위하여자발적으로 영리적 반대급부 없이 시간과 노력을 제공하는 행위를 말함○ 기 타* 문항 : 귀하는 지난 1년간 자원봉사활동에 참여하신 적이 있으십니까?있으시다면, 1년간 각 분야별 참여횟수는 어떻게 되십니까?* 해당연도가 없는 것은 그해 조사항목에서 제외된 것임○ 출 처 : 서울특별시 스마트도시담당관「서울서베이(도시정책지표조사)」'
