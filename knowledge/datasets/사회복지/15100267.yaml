summary_user: 전국 청소년자립지원관의 시설명·시설유형·시도·시군구·주소·대표전화를 시설 한 곳당 한 행으로 담은 목록형 파일이며, 파일 크기는 약 1.5KB로 작은 규모다. 쉼터나 회복시설 퇴소를 앞둔 청소년이나 보호자, 상담 실무자가 "우리 지역에서 가장 가까운 자립지원관은 어디이고 연락처는 무엇인가"를 찾는 데 쓴다. 공통 시설코드 같은 전역 조인 키는 없어서, 다른 청소년 쉼터·상담복지센터 목록이나 지역 통계와는 시도·시군구 이름이나 주소를 맞춰 잇는다.
description_portal: 전국의 청소년자립지원관 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 시설명, 시도, 시군구, 대표전화, 데이터 기준 일자의 정보를 확인할 수 있습니다.청소년자립지원관은 위기 청소년 지원 체계 강화에 필수적인 정보로서, 청소년 쉼터 및 청소년회복시설 퇴소(예정) 청소년 중 자립이 필요한 청소년 복지시설 현황이 기재된 데이터입니다.일정기간 시설의 지원을 받았음에도 가정, 학교, 사회로 복귀하여 생활할 수 없는 청소년이 자립하여 생활할 수 있는 능력과 여건을 갖추도록 지원하는 청소년복지시설입니다.
