description_portal: '○ 통계개요* 통계명 : 아동복지시설(생활)(2003년 이전)* 통계종류 : 서울시 아동 생활복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「아동복지법」제16조에 의거 만 18세 미만까지 아동의 복지를 제공하는 시설* 작성목적 : 아동복지시설의 보호아동 및 종사자 현황을 파악하여 각종 정책수립을 위한기초자료를 제공하는 것을 목적으로 함* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 아동 생활복지시설(영아시설, 육아시설, 직업보도시설,기타)의 시설수 및 입ㆍ퇴소자, 생활인원 현황○ 기 타* 통계양식 변경으로 2004년부터 자료 생산중단("아동복지시설(생활)2004년 이후)"참고)'
