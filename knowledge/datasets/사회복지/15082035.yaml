summary_user: 전국 사회적기업을 기업 한 곳당 한 건으로 담으며, 기업명·대표자·주소·연락처·홈페이지와 인증번호·인증일·사업분야·사업내용을 포함한다. 사업자나 분석가가 '우리 지역에 어떤 분야의 인증 사회적기업이 있고 언제 인증받았나'를 확인하거나 거래·협력 대상을 찾을 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 기업명·주소 매핑으로 다른 데이터와 잇고, 인증번호(certiNumV)는 같은 기관의 사회적기업 자료와 맞출 때 쓰며, 사회적기업 표준데이터(15012895)와 함께 본다.
