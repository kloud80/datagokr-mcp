description_portal: 노령연금은 가입기간 10년 이상인 가입자(였던 자)가 일정한 급여지급연령에 도달하는 경우 노후 소득보장을 위해 지급하는 급여입니다.분할연금은 노령연금 수급권자의 가입기간 중 혼인기간 동안 이혼한 배우자가 정신적/물질적으로 기여한 부분을 고려하여 노령연금액의 일부를 분할하여 이혼한 배우자에게 지급하는 급여입니다.장애연금은 질병이나 부상의 초진일 당시 일정한 가입기간이 있고 완치 후에도 신체 또는 정신상 장애가 남은 자에게 장애정도에 따른 연금액을 지급하여 장애로 인한 생계곤란의 위험에 대비하는 급여입니다.유족연금은 일정한 연금보험료 납부요건을 충족한 자, 노령연금 또는 장애등급 2급 이상인 장애연금 수급권자가 사망하는 경우 그가 부양하던 유족의 생계곤란을 방지하기 위하여 가입자의 기여를 근거로 그 유족을 보호하여 사회보장의 목적을 달성하고자 하는 급여입니다.반환일시금은 가입자(였던 자)에게 자격상실 사유가 발생하고 그 사유로 인하여 향후 재가입의 가능성이 희박한 경우 가입자(였던 자) 또는 그 유족에게 납부한 보험료를 반환하여 줌으로써 공단과 가입자 간의 법률관계를 종결하기 위한 급여입니다.사망일시금은 가입자(였던 자) 또는 지급받은 연금액이 사망일시금액보다 적은 연금 수급권자(노령연금, 장애등급 3급 이상 장애연금)가 사망하였으나 유족연금 또는 반환일시금을 지급받을 수 없는 유족에게 장제부조적 성격의 일시금을 지급하여 가입자 간 형평성 문제를 보완하고 국민연금 수혜범위를 확대하는 보완적 급여입니다.해당 공공데이터는 2023년 6월 ~ 2024년 5월 국민연금 노령연금 금융기관별 내역에 대한 데이터로써 금융기관코드, 군복무크레딧인정기간개월수, 소득업무종사여부, 연기연금신청개월수, 최초수급연령, 출산크레딧인정기간개월수, 특수직종여부 항목을 제공합니다.
