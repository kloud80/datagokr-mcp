summary_user: 인천광역시 부평구 안의 노인복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설종류·시설명·도로명주소·전화번호·정원·운영주체가 들어 있다. 구민이나 보호자가 집 근처 경로당·주간보호센터 같은 시설을 찾을 때, 분석가가 시설 유형별 정원으로 부평구의 노인 돌봄 수용능력과 분포를 살필 때 쓴다. 전역 조인 키는 없어서, 건강보험 장기요양기관 목록 같은 다른 데이터와는 시설명·도로명주소를 맞춰 보는 방식으로만 잇는다.
description_portal: '부평구 내 노인을 대상으로 서비스를 제공하는 복지시설의 종류, 명칭, 소재지, 정원, 운영주체 등을 포함한 현황 자료.고령 인구 증가에 대응하여 지역 내 노인복지 인프라의 분포 및 수용능력을 파악하고, 돌봄정책, 시설지원계획, 고령자 안전관리 정책 수립을 위한 기초자료로 활용됨.활용 목적 및 특징– 시설종류(요양원, 경로당, 주간보호센터 등) 기반 서비스 유형 파악– 정원 기준 수용 가능 인원 분석을 통한 시설 적정성 검토 가능– 운영주체 정보(공공/민간)로 행정지원 및 관리 책임 구분– 고령자 복지 사각지대 해소를 위한 인프라 분포 진단 가능주요 항목 설명● 연번: 각 시설에 부여된 고유 식별번호● 시설종류: 해당 복지시설의 유형● 시설명: 노인복지시설의 공식 명칭● 도로명주소: 시설의 위치 정보● 전화번호: 시설의 대표 연락처● 정원: 해당 시설이 수용 가능한 인원 수● 운영주체: 해당 시설의 운영기관 또는 법인(개인/법인/지방자치단체 등)'
