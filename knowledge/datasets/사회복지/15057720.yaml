summary_user: 경기도 장애인복지관을 시설별 한 행으로 담으며, 인허가일·영업상태·폐업일, 면적, 입소정원, 총인력과 자격 소지 인력 수, 지번·도로명 주소와 위경도 좌표를 포함한다. 주민이나 복지 분석가가 '우리 시군에 운영 중인 장애인복지관은 어디이고 자격 인력은 몇 명인가', '시군별 복지관 배치가 고른가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시군 코드·시군명(SIGUN_CD)으로 같은 기관의 시군 단위 자료와 맞추거나, 좌표·주소로 지도 위에서 다른 시설 자료와 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 장애인복지관의 운영 현황을 정리한 자료로, 각 복지관의 인허가일자, 운영 상태, 인력 보유 상황, 입소정원, 소재지 주소 등을 포함하고 있습니다. 장애인복지관은 장애인의 사회참여 증진과 삶의 질 향상을 위한 종합적 복지서비스를 제공하는 핵심 기반시설로, 상담, 교육, 재활, 문화 프로그램 등을 지역 중심으로 제공하고 있습니다. 본 자료는 시군 단위로 분포된 복지관의 현황을 반영하며 시설 간 균형 분석, 복지 자원 배치 계획, 복지 수요 예측 등에 기초 자료로 활용될 수 있습니다. 또한 자격 소지 인력 수는 서비스 전문성과 품질을 가늠할 수 있는 지표로 기능합니다.
