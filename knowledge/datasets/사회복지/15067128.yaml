summary_user: 한국노인인력개발원 취업연계 시스템에서 쓰는 공통상세코드를 코드 한 건씩 담은 코드표로, 대분류·중분류 아래 코드명·코드설명·사용여부·등록일·수정일을 담는다(csv 약 176KB, 전국·비공간). 노인 취업연계 데이터를 다루는 분석가나 실무자가 '이 보수유형·유휴 사유 코드값이 무슨 뜻이고 지금도 쓰이는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 취업연계 데이터에 나오는 코드값을 코드명으로 풀어 주는 매핑 용도로만 이어 쓴다.
description_portal: 이 데이터는 취업연계 시스템에서 사용되는 공통상세코드 정보를 제공하는 자료입니다. 각 코드에는 대분류, 중분류, 코드명, 코드설명, 사용여부 등의 항목이 포함되어 있으며, 취업지원 행정업무에서 표준화된 기준으로 관리될 수 있도록 구성되어 있습니다. 예를 들어 부적정유휴코드, 보수유형, 메뉴코드, 고인등록유휴코드 등 다양한 항목이 코드화되어 있으며, 각 코드별 의미와 사용 여부가 함께 제공되어 실무자가 쉽게 활용할 수 있습니다. 이 데이터는 구직자 지원과 행정처리 과정에서 일관된 기준을 제공하고 기관 간 데이터 연계 시 호환성을 확보하는 데 중요한 역할을 합니다. CSV 형식으로 제공되어 가공과 분석이 용이하고, 정기적으로 갱신되어 최신 코드를 반영하므로 현장에서 안정적으로 활용할 수 있습니다.
