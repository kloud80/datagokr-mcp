summary_user: 전국과 경기도의 국민기초생활보장 전체 수급자 수, 장애인 수급자 수, 수급자 중 장애인 비율을 기준연도(STD_YY)별로 나란히 담은 집계 자료로, 건별 원천이 아니라 연도 단위 합계입니다. 복지 정책 분석가가 경기도 수급자 중 장애인 비율이 전국 평균보다 높은지, 연도별로 어떻게 변하는지 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 장애인연금·장애수당 같은 다른 연도별 집계와는 기준연도를 맞춰 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 전국 및 경기도 국민기초생활보장 장애인 수 현황을 비교·분석하는 집계 자료입니다. 보건복지부 사회보장정보시스템을 기반으로 하며, 매년 12월 말 기준으로 전국 국민기초생활보장 전체 수급자 수, 전국 장애인 수급자 수, 그리고 이들의 비율(%), 또한 경기도 전체 수급자 수, 경기도 장애인 수급자 수, 경기도 내 비율(%)을 제공합니다.국민기초생활보장제도는 생활이 어려운 국민에게 생계비, 의료비 등을 지원하여 최저 생활을 보장하고 자활을 돕는 제도로, 장애인은 일반 수급자와 함께 중요한 지원 대상 집단입니다.이 데이터는 전국 대비 경기도의 장애인 수급자 비율을 통해 경기도가 차지하는 복지 수요 규모를 보여주며, 장애인 빈곤율 추이 분석, 복지 사각지대 파악, 지역 간 지원 형평성 검토에 활용될 수 있습니다. 또한 장애인연금, 장애수당 데이터와 연계하면 장애인 복지 지원 체계 전반의 현황 분석이 가능합니다.
