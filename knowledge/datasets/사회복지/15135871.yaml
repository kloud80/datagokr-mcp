description_portal: 본 데이터는 인천광역시 동구에서 운영 중인 사회적경제 기업의 현황 정보를 수록한 자료이다. 연도, 구분, 업체명, 전화번호, 업종, 사업내용, 소재지 도로명 주소, 데이터 기준일자 등의 항목으로 구성되어 있으며, 지역 내 사회적기업, 협동조합, 마을기업, 자활기업 등 다양한 사회적경제 조직의 정보를 포함한다. 해당 정보는 민간의 사회적가치 실현을 지원하고 지역경제 활성화를 위한 정책 수립의 기초자료로 활용된다. 특히 기업의 업종과 사업내용 항목은 지역사회 내 필요 서비스 제공 현황을 파악할 수 있게 하며, 도로명 주소 정보는 공간기반 분석 및 서비스 연계 활용에 유리하다. 본 데이터는 주민·연구자·행정기관이 활용할 수 있는 공공자원으로서, 사회적경제 영역의 현황을 체계적으로 파악하고 지원 정책의 근거로 활용될 수 있도록 정기적으로 갱신된다.
