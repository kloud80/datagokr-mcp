description_portal: 부산광역시 사하구에서는 여성과 아등 등 사회적 약자가 안심하고 다닐 수 있는 여성안심귀갓길을 조성하였습니다.사하구 관내에 있는 여성안심귀갓길 조성 현황에 대한 데이터를 제공합니다.* 거울시트, 반사경, 보안등, 신고간판 등 야간보행환경 개선을 위한 안심시설물 설치* 특정한 위치가 아닌 범위로 위치 정보 제공(예. 하단 젊음의 거리 ~ 에덴공원)* 주요 데이터 컬럼별 상세설명○ 행정동 → 사하구 관내의 여성안심귀갓길이 조성된 행정동(괴정2동, 괴정3동, 신평1동 등)○ 조성연도 → 사하구 관내의 여성안심귀갓길이 조성된 연도○ 위치 → 사하구 관내의 여성안심귀갓길 시작지점부터 종료지점까지 표시(예. 하단 젊음의 거리 ~ 에덴공원)○ 주요 내용 → 사하구 관내의 여성안심귀갓길에 설치된 야간보행환경 개선을 위한 시설물 설치내역(거울시트, 반사경, 벽화, 태양광도로명주소판, 신고간판 등)
