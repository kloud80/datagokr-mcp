summary_user: 경기도 시군별 무한돌봄네트워크팀의 운영 현황을 팀 한 곳당 한 행으로 담은 목록이다. 각 행에는 시군명·시군코드, 구분, 네트워크팀명, 시설명, 협력 법인·단체명이 들어 있으며, 범위는 시도(경기도) 단위의 비공간 자료다. 복지 담당자나 연구자가 '우리 시군에는 어떤 무한돌봄 네트워크팀과 운영기관이 있는가'를 확인하거나 위기가정 지원 체계를 지역별로 비교할 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군명이나 시군코드(SIGUN_CD)를 이름·코드로 매핑해 시군 단위로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 무한돌봄네트워크팀의 운영 현황을 정리한 자료로, 복지사각지대에 있는 위기가정을 대상으로 한 맞춤형 복지서비스 지원 정보를 제공합니다. 무한돌봄사업은 기존 복지제도로 보호받지 못하거나 지원이 미흡한 가정에 의료비 등 추가 지원을 통해 극빈층 전락을 방지하는 복지제도입니다. 본 데이터는 시군명, 시군코드, 구분명, 시설명, 네트워크팀명, 법인단체명 등의 항목으로 구성되어 있으며, 각 지역 내 돌봄 네트워크팀 및 운영기관의 명칭과 구조를 파악할 수 있습니다. 사회복지정책 수립, 위기대상자 발굴 및 맞춤형 서비스 제공, 복지시설 네트워크 관리 등 다양한 행정 및 정책 목적에 활용될 수 있습니다.
