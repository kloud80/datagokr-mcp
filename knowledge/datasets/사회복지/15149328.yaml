status: active
summary_user: 아이돌봄 통합지원 서비스의 영상모니터링 결과를 기준연월·센터·서비스별로 집계해, 전체 및 6개 지표영역마다 응답 가구 수와 3점·2점·1점 가구 수를 담은 전국 단위 집계 자료다. 아이돌봄 서비스 운영기관이나 정책 분석가가 '어느 센터에서 돌보미 서비스 평가 중 낮은 점수(1점) 비율이 높은 영역은 무엇인가'처럼 센터별·영역별 돌봄 품질을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 센터명·상위센터명(upCntrNm) 같은 이름 매핑이나 같은 기관의 아이돌봄 관련 데이터와 기준연월로만 이어 쓴다.
limits: 지표영역은 영역1~6 번호로만 나오고 각 영역이 무엇을 평가하는지는 필드에 없으며, 돌보미 개인 단위가 아닌 센터별 가구 수 집계라 개별 평가는 볼 수 없다. 공통 코드 키가 없어 다른 시설·지역 데이터와 붙이려면 센터명 문자열 매핑이 필요하다. 개발계정은 일 10,000회 호출 제한이 있다.
