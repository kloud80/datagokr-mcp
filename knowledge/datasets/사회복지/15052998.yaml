description_portal: '"공무원연금공단이 관리하는 연도별 퇴직 공무원 현황을 정리한 자료로서, 연도별 가입자수, 퇴직자수, 일시금 수령 대상자수, 연금선택 가능인원, 퇴직률에 대한 데이터입니다.1960년부터 기준년도까지의 자료를 제공하고 있습니다.장기적인 추이를 통해 공무원 퇴직 인원의 변화 양상과 연금 제도에 따른 수급 형태를 파악 할 수 있습니다. 이를 바탕으로 공적연금 제도의 수급 구조 분석, 퇴직 인력 규모 변화 예측, 정책 수립 시 기초자료로 활용 될 수 있습니다.관리부서 데이터 미관리로 2024년까지 데이터 제공하며 1회성 데이터로 전환되었습니다."'
