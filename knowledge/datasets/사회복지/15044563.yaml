summary_user: 전국 사회복지관을 기관 한 곳당 한 행으로 담은 파일이며, 2023년 말 기준 시도·기관명·주소·전화번호·운영주체·법인유형을 시도별로 정리한다. 주민이나 복지 담당자가 우리 시도에 어떤 사회복지관이 있고 누가(지자체 직영인지 법인 위탁인지) 운영하는지 찾을 때, 분석가가 시도별 사회복지관 분포와 운영 법인 유형을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시도명·기관명·주소 문자열을 맞추거나 주소를 지오코딩해 연결해야 하고, 사업자번호 같은 기업 식별자는 담겨 있지 않다.
description_portal: '보건복지부에서 2023년 말 기준 전국 사회 복지관 현황(연번, 시도, 기관명, 주소, 전화번호, 운영주체, 법인유형)을 시도별로 분류하여 정보를 제공하고 있습니다.<데이터 이용 시 참고사항> - 사회복지관 : 지역사회를 기반으로 일정한 시설과 전문 인력을 갖추고 지역주민의 참여와 협력을 통하여 지역사회복지*문제를 예방하고 해결하기 위하여 종합적인 복지 서비스를 제공하는 시설을 말합니다.* 지역사회복지 : 주민의 복지증진과 삶의 질 향상을 위하여 지역사회차원에서 전개하는 사회복지를 말합니다.'
