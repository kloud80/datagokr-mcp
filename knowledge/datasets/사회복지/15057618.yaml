summary_user: 경기도 시군별 장애아동수당 수급자 수를 기준년도 단위로 집계한 통계로, 18세 미만·18~20세·20세 초과의 연령 구간과 기초생활수급자·시설수급자·차상위계층의 수급유형별 인원을 담는다. 복지 분석가나 지자체 담당자가 '우리 시군의 장애아동수당 수급자 중 차상위계층과 시설수급자 비중이 다른 시군과 비교해 어떤가'처럼 지역 간 수급 분포와 형평성을 따지는 데 쓴다. 전역 조인 키는 없으며, 시군코드(SIGUN_CD)나 시군명을 기준으로 경기도의 다른 시군별 통계와 이름·코드를 맞춰 연결한다.
description_portal: 이 데이터는 연령대별로 장애아동수당을 수급하는 아동의 현황을 정리한 자료로, 시군별로 전체 수급자 수, 연령 구간별 수급자 수, 기초생활수급자, 차상위계층, 시설수급자 여부 등에 따라 세부적으로 나뉜 통계를 제공합니다. 주요 항목은 기준년도, 시군명, 연령구간별 총계(18세 미만, 18세 이상 20세 이하, 20세 초과), 수급유형별 세부 항목(기초생활수급자, 시설수급자, 차상위계층)으로 구성되어 있으며, 각 항목은 연령 구간별로 세분화되어 있습니다. 이 데이터는 지자체별 장애 아동 복지 수급 현황을 분석하고, 복지 서비스의 지역 간 형평성 평가, 향후 예산 배분 및 정책 수립 등에 활용될 수 있습니다. 특히, 연령대별 수급 분포와 수급 유형별 차이를 통해 사회적 취약계층의 특성을 파악할 수 있습니다.
