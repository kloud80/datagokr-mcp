summary_user: 직장어린이집 수를 지역 구분(구분)별 행에 2009년부터 2025년까지 연도별 열로 펼쳐 놓은 집계표로, 1KB 남짓한 CSV 한 개다. 정책 분석가나 연구자가 '지역별 직장어린이집 설치가 연도별로 어떻게 늘었고 지역 간 격차는 어떤가'를 볼 때 쓴다. 전역 조인 키가 없어 다른 지역 통계(영유아 인구, 전체 어린이집 수 등)와는 지역 이름을 맞춰 붙여 써야 한다.
limits: 개별 어린이집 단위가 아닌 지역·연도 집계라서 시설별 위치·정원·어린이집코드는 담지 않는다. 범위는 전국이지만 공간 좌표나 행정코드가 없어 지도 결합이나 시군구 코드 조인은 이름 매핑으로만 가능하다.
