description_portal: '한국사회보장정보원에서 제공하는 연도별 정부가 보유하고 있는 직장어린이집 현황입니다.데이터 구성은 지역 구분 및 연도 항목으로 구성되어 있습니다.이 데이터를 활용하여 직장어린이집의 연도별 설치 현황 및 지역별 분포 변화, 지역별 불균형 문제 진단 및 접근성 향상 방안 모색 측면의 분석이 가능합니다.추가적인 내용이 궁금하시면 아래 경로를 참고하시길 바랍니다. ※ 경로 "어린이집정보공개포털-보육정보공개API-OPEN API-검색(해당 API명)"이러한 공공데이터를 통해 다음과 같은 데이터분석, 연구 등의 활용이 가능합니다.<데이터분석 사례 예시> 단순 참고해 주세요.- 어린이집 운영 유형 분류: 국공립 / 민간 / 가정 / 직장 / 부모협동 등- 유형별 아동 수, 정원 대비 이용률- 유형별 만족도나 폐원률- 시·군·구 또는 읍·면·동 단위 어린이집 수- 아동 수 대비 어린이집 수 (보육 시설 밀도)- 대도시 vs 농어촌 격차'
