summary_user: 공무원연금기금(기금회계)의 손익계산서를 계정 항목(구분)별 행과 1983년부터 2025년까지의 연도별 열로 담은 전국 단위 연간 집계표이며, 사업수익·사업비용·관리운영비·연금전출금·법인세·순이익 등을 포함한다. 분석가나 연금재정 연구자가 '공무원연금기금의 금융자산 운용수익과 관리운영비가 수십 년간 어떻게 변했고 순이익은 어느 해에 줄었나' 같은 장기 재정 추이 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도와 계정 항목 이름을 맞추거나 같은 공무원연금공단의 다른 통계표와 나란히 놓고 비교하는 방식으로 이어 쓴다.
limits: 표에 실린 순이익은 연금수지 적자에 따른 연금회계지원금을 빼기 전 금액이므로 실제 최종 손익으로 읽으면 안 된다. 연도가 열로 펼쳐진 넓은 형태의 CSV 파일(약 7KB)이라 분석 전에 행·열을 바꾸는 정리가 필요하다. 종목·운용사 수준의 세부 내역은 없다.
