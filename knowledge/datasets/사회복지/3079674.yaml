summary_user: 부천시 관내 소사·오정·원미 3개 노인교실의 시설명, 소재지, 운영주체, 연락처, 이용인원, 운영 프로그램 수와 내용, 운영기간을 시설 한 곳당 한 행으로 담은 소규모 파일(643바이트)이다. 부천시 어르신이나 가족이 "우리 동네 노인교실은 어디에 있고 어떤 프로그램을 운영하나"를 확인하거나, 담당자가 프로그램 확대·예산 편성 때 시설별 이용인원을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설 목록이나 지역 통계와는 소재지 주소나 시설명을 맞춰 연결해야 한다.
description_portal: 부천시 관내 노인교실현황에 대한 데이터로 3개구(소사, 오정, 원미) 지역에 위치한 노인교실 시설명, 해당 소재지, 운영 주체, 교실 연락처, 이용 인원, 운영하고 있는 프로그램 개수,  운영프로그램 현황, 운영기간, 프로그램 운영시간 등의 정보를 제공합니다. 노인교실 데이터는 각 경로당별 월별 운영현황(프로그램명, 참여자 수, 강사 여부 등)을 바탕으로 수합한 자료로, 어르신 복지 향상 및 프로그램 질 제고를 위한 기초자료입니다.향후 프로그램 확대 및 예산편성 시 참고자료로 활용될 수 있습니다.O소사노인교실O오정노인교실O원미노인교실
