description_portal: 대구광역시 서구 경로무료급식소 현황 데이터입니다. 경로무료급식소 시설명, 운영단체, 급식장소, 운영주기, 1회 평균 급식인원, 급식개시일, 연락처 등 데이터를 포함하고 있습니다.본 데이터는 대구광역시 서구 관내에서 운영 중인 경로무료급식소의 현황을 수록한 자료이다. 해당 자료는 지역 어르신을 대상으로 무료 급식서비스를 제공하는 기관들의 운영정보를 포함하며, 급식소 명칭, 운영단체, 급식장소, 운영주기, 시작시간, 1회 평균 급식인원, 급식개시일, 연락처, 비고 등으로 구성되어 있다. 본 자료는 복지 사각지대 해소를 위한 정책 수립 및 현장 지원 계획 수립에 활용될 수 있으며, 지역사회 내 어르신 대상 급식 지원 실태를 파악하는 데 필요한 기초정보를 제공한다. 사회복지 관련 기관, 정책담당자, 일반 시민이 급식소 정보를 효율적으로 검색하고 활용할 수 있도록 구성하였다.
