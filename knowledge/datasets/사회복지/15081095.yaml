summary_user: 광주광역시 공동육아나눔터의 자치구·명칭·주소·전화번호를 시설 한 곳당 한 행으로 담은 소규모 목록 파일입니다(포털 설명상 5개 자치구 총 9개소). 아이를 둔 부모가 우리 동네 가까운 공동육아나눔터가 어디인지, 연락처가 무엇인지 찾는 데 쓴다. 전역 조인 키가 없어 다른 어린이집·육아지원 데이터와는 자치구 이름이나 주소를 매핑해 이어 쓴다.
description_portal: 아이돌봄지원법 제19조 및 건강가정기본법 제22조의 의거하여 광주광역시 공동육아나눔터는 총 9개소(동구2, 서구1, 남구2, 북구2, 광산구2) 등 5개 자치구에 고르게 분포되어 있습니다. 최근 맞벌이 가정 증가와 저출산 심화로 지역사회 중심의 돌봄 지원체계 구축 필요성이 지속적으로 확대되고 있다. 공동육아나눔터는 부모의 양육 부담을 완화하고 돌봄 공백을 해소하는 생활밀착형 가족지원 서비스로 중요한 역할을 수행하고 있다. 또한 부모 간 돌봄 품앗이와 가족 참여 프로그램을 통해 이웃 간 돌봄 공동체를 활성화하고 사회적 관계망 형성에 기여하고 있다. 안전한 놀이공간과 다양한 부모·자녀 프로그램 제공으로 아동의 건강한 성장과 가족 기능 강화에도 긍정적인 효과를 거두고 있다. 이에 공동육아나눔터 운영은 저출산 대응과 돌봄친화적 지역사회 조성을 위한 핵심 가족정책으로 그 중요성이 더욱 커지고 있다.
