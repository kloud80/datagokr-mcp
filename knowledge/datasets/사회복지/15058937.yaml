summary_user: 경기도에서 시행 중인 청소년 대상 중앙부처 복지서비스를 서비스 한 건당 한 행으로 담은 목록으로, 서비스명·주목적·관련 정보·안내 문구·홈페이지 주소·운영주체와 조직명이 들어 있다. 청소년이나 보호자, 상담·복지 실무자가 장학금·쉼터·급식비·고교학비 지원 가운데 어떤 중앙정부 제도가 있고 어느 부처가 운영하는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 서비스명이나 운영주체 이름을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 시행 중인 청소년 대상 중앙부처 복지서비스의 현황을 제공하는 자료로, 청소년의 복지 증진을 위한 각종 지원 제도에 대한 정보를 포함합니다. 각 서비스 항목은 등록번호, 서비스명, 주목적, 관련 정보, 안내 문구, 홈페이지 주소, 운영주체 및 조직명, 기준년도 등의 세부 항목으로 구성되어 있습니다. 제공되는 서비스는 인문100년장학금, 청소년쉼터, 방과후학교 자유수강권, WEE클래스, 급식비지원, 고교학비지원, 청소년치료재활센터, 청소년유해환경개선사업 등 다양한 중앙정부 복지 프로그램이 포함되어 있으며, 사회보장정보원에서 수집한 데이터를 기반으로 연 1회 갱신됩니다. 이 데이터는 청소년 정책 연구, 복지 수요 파악, 맞춤형 지원 방안 수립 등에 활용할 수 있습니다.
