description_portal: 본 데이터는 한국여성인권진흥원 디지털성범죄피해자지원센터가 수집한 연령대별 디지털성범죄 피해 유형 현황을 정리한 자료입니다. 10대부터 50대 이상까지 연령 구간별로 총 피해 건수를 비롯해 불법촬영, 합성·편집, 유포, 유포협박, 유포불안, 사이버 괴롭힘, 기타 등 다양한 피해 유형별 발생 건수를 세분화하여 제공합니다. 특히 청소년 및 청년층에서의 피해 비중이 높으며, 복합적 피해 형태도 빈번하게 나타나고 있음을 확인할 수 있습니다. 본 데이터는 피해 유형별 경향성과 연령별 특징을 파악하여 정책 수립, 예방 교육, 맞춤형 지원 체계 설계에 활용될 수 있는 기초 자료로서의 가치를 지니며, 디지털 성범죄 대응 체계 강화에 실질적 근거를 제공합니다.
