summary_user: 제주특별자치도에 있는 노인의료복지시설(요양시설)을 시설 한 곳당 한 행으로 담은 파일로, 읍면동·시설명·소재지·전화번호와 함께 정원·현원·종사자 수, 설치일을 시설별 개별 단위로 제공한다. 제주에서 부모를 모실 요양원을 찾는 가족이나 지역별 요양시설 정원 대비 입소 현황을 보려는 분석가가 '어느 읍면동에 빈자리가 있는 요양시설이 있는가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키나 시설코드가 없어 건강보험 장기요양기관 목록 등과는 시설명·소재지 주소 매칭으로만 이어 쓰고, 읍면동 이름으로 지역 통계와 연결한다.
description_portal: '제주특별자치도 내 소재하는 노인의료복지시설 현황 데이터를 제공합니다.항목: 시설명, 소재지, 전화번호 등*치매ㆍ중풍등 노인성 질환등으로 심신에 상당한 장애가 발생하여 도움을 필요로 하는 노인을 입소시켜 급식ㆍ요양과 그 밖에 일상생활에 필요한 편의를 제공함*대상 : 장기요양 1~2등급자, 기초생활수급자, 부양의무자로부터 적절한 부양을 받지 못하는 65세 이상 노인 등 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1623'
