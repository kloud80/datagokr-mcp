summary_user: 전국 아이돌보미 교육기관을 기관 한 곳당 한 건으로 담으며, 교육기관명·소속센터명·우편번호·주소·대표전화·팩스·홈페이지 주소를 제공한다. 아이돌보미가 되려는 사람이 '우리 지역에서 양성교육을 받을 수 있는 기관이 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 지역별 교육기관 분포와 접근성을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 소속센터 번호·이름(ogdpCntrNm)이나 주소를 매칭해 가족센터 등 사회복지시설 목록과 잇는다.
description_portal: 아이돌보미 교육기관 정보 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 교육기관ID, 교육기관명, 소속센터명, 우편번호, 주소, 대표전화번호, 팩스번호, 홈페이지 주소 등의 내용을 확인할 수 있습니다.교육 진행 기관의 위치와 연락처, 소속센터 등의 세부 사항을 신속히 확인할 수 있습니다. 해당 데이터를 통해 지원자들이 원하는 기관을 쉽게 찾아보고, 교육기관별 접근성이나 인프라 조건을 비교할 수 있는 기반 자료로 활용할 수 있습니다. 또한 교육기관 운영 실태 파악 및 정책 개선에도 유용한 자료로 활용될 수 있습니다.
