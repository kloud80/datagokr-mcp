summary_user: 경기도 각 시군에 설치된 무한돌봄센터를 센터 한 곳당 한 행으로 담고, 센터명·담당부서·사례관리팀·자원연계팀·연락처·도로명/지번 주소·위경도 좌표를 시군구 단위로 제공한다. 복지 담당자나 분석가가 "우리 시군의 위기 가정은 어느 무한돌봄센터에 연결되고, 센터까지 접근성은 어떤가"를 확인할 때 쓴다. 전역 조인 키는 없어서 시군명(SIGUN_NM)·시군 코드로 경기도 시군 단위 통계와 맞추거나 주소·좌표로 다른 시설 위치와 공간 결합해 이어 쓴다.
description_portal: 무한돌봄센터 현황은 경기도 내 각 시군에 설치된 무한돌봄센터의 위치와 운영 정보를 제공하는 데이터로, 복지 사각지대 해소를 위한 실질적 대응체계 현황을 보여줍니다. 무한돌봄사업은 기준 미달로 복지제도에서 배제된 위기 가정을 발굴하고 추가 지원을 통해 극빈층 전락을 예방하는 제도로, 센터명(CENTER_NM), 담당부서명(CHARGE_DEPT_NM), 사례관리팀명(TEAM_CASE_CHARGE_DEPT), 자원연계팀명(TEAM_RESRCE_CHARGE_DEPT), 연락처(TELNO), 소재지 주소(REFINE_ROADNM_ADDR, REFINE_LOTNO_ADDR, REFINE_ZIP_CD), 위치좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT) 등의 정보를 포함합니다. 본 데이터는 복지 정책 수립, 위기 가정 접근성 분석, 지역별 돌봄 서비스 현황 파악 등에 활용 가능하며, 공공복지 연계시스템 구축 및 비영리 민간기관의 자원 연계 활동에도 유용하게 쓰일 수 있습니다.
