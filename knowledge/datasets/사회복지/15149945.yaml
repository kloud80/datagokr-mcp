summary_user: 경기도 도민카드 수혜자가 공영주차장 등 사용처에서 받는 할인 혜택을 혜택 한 건 단위로 담고, 사용처 구분·혜택명·혜택기간·주소·위경도·시군명·대상자·할인율·필요서류가 들어 있다. 도민카드를 가진 도민이 '우리 시군 공영주차장에서 얼마 할인받고 무슨 서류가 필요한가'를 확인하거나, 행정기관이 시군별 할인 혜택 차이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm) 같은 이름 매핑이나 주소·좌표로만 연결한다.
description_portal: 이 데이터는 도민카드 수혜자에게 제공되는 다양한 혜택 정보를 통합 관리하는 자료로, 경기도 내 공영주차장 등의 사용처에서 제공하는 할인 혜택에 대한 상세 정보를 포함합니다. 주요 항목으로는 사용처구분, 혜택명, 혜택기간, 혜택참고, 혜택주소, 위경도좌표, 시군명, 등록일, 대상자명, 할인율, 필요서류, 혜택기타사항 등이 포함되어 있습니다. 이 데이터는 각 지역별로 차등 적용되는 할인혜택을 유형별로 분류하여 제공함으로써, 해당 서비스를 이용하고자 하는 도민이나 행정기관에서 활용할 수 있습니다. 지역별 맞춤형 복지정책 수립, 대민 서비스 개선, 공간 기반 정책분석 등에 유용하게 활용될 수 있습니다.
