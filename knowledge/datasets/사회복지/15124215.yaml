description_portal: 해당 데이터는 서울시에 거주하는 국민기초생활보장 수급자의 현황을 자치구 단위로 세분화하여 제공하는 자료입니다. 기초생활보장 수급자구분을 중심으로 연령대와 성별에 따라 수급 인원이 어떻게 분포되어 있는지를 상세하게 파악할 수 있도록 구성되어 있습니다. 각 자치구별로 동일한 기준으로 집계되어 있어 지역 간 비교가 용이하며, 연령 구분은 영유아부터 고령층까지 폭넓게 포함됩니다. 성별 항목과 결합된 구조이기 때문에 특정 연령층 또는 성별에서 수급 비율이 높게 나타나는 지역적 특징을 확인할 수 있습니다. 이 데이터는 복지정책 수립, 지역별 취약계층 분석, 지원 대상자 파악 등 행정적 활용에 유용하게 사용될 수 있으며, 서울시 내 복지 수요의 분포를 이해하는 데 중요한 기초 자료로 활용됩니다.
