description_portal: 사립학교교직원연금공단이 소유하고 있는 부속시설 운영 현황과 관련된 데이터로 구분, 분류, 시설명, 시설물 위치, 면적(㎡), 최대 수용 인원, 비고 등의 항목을 제공합니다. 나주회관은 2022년 부속건물(보육시설) 준공에 따라 체육시설 테니스장이 철거가 되었으며, 주차장 면수는 지하주차장 30면이 증가하여 총 주차장 173면으로 변경된 데이터가 포함되어 있습니다.이 데이터를 통해 공단의 시설 운영 투명성을 제고하고 이용자 및 잠재적 이용자들이 서비스의 접근성과 유용성을 명확히 이해할 수 있도록 돕습니다.또한 시설 현황 관련 분석 기초 자료로 활용 될 수 있습니다.
