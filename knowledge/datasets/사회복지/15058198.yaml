summary_user: 경기도 안의 청소년수련관·청소년문화의집·청소년센터 같은 청소년 시설을 기관 한 곳당 한 행으로 담고, 시설 구분·전화번호·홈페이지·도로명/지번 주소·우편번호·위경도를 함께 제공한다. 학부모나 청소년이 '우리 시군에서 가까운 청소년문화의집은 어디인가'를 찾거나, 분석가가 시군별 청소년 활동 시설 분포를 지도에 그릴 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)·시군명으로 지역 통계와 붙이거나, 좌표·주소로 공간 결합하는 방식으로 이어 쓴다.
description_portal: 이 데이터는 여성가족부 산하 청소년활동진흥원에서 제공하는 경기도 내 청소년 관련 시설 기관의 현황을 담고 있으며, 청소년들이 봉사활동, 자기계발, 문화체험 등을 할 수 있는 기반시설에 대한 정보를 제공합니다. 청소년수련관, 청소년문화의집, 청소년센터, 인재개발원 등 다양한 유형의 기관이 포함되어 있으며, 기관명, 시군명, 시도명, 전화번호, 홈페이지 주소, 도로명 및 지번 주소, 우편번호, 위도·경도 등의 항목이 제공됩니다. 시설의 구체적 구분과 기관 정보도 함께 제공되어, 지역별 청소년 활동 기반 분석, 정책 수립, 공간적 분포 조사 등에 활용할 수 있는 데이터입니다. 이 데이터는 수시로 갱신되며, 상업적 이용과 콘텐츠 변경이 가능합니다.
