summary_user: 울산광역시 남구 관내 노인주간보호센터를 시설 한 곳당 한 행으로 담은 건별 목록 파일(csv, 약 4KB)로, 센터명·도로명주소·전화·팩스·대표자·개설일·입소정원을 담는다. 남구에 사는 가족이 집 가까운 주간보호센터와 정원 규모, 연락처를 찾거나, 분석가가 남구 내 주간보호 시설 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 센터명이나 도로명주소를 맞춰 잇는다. 건강보험 장기요양기관 목록이나 시군구 단위 지역 통계와 붙일 때도 같은 방식으로 연결한다.
