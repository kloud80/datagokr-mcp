summary_user: 행정안전 통계연보 '지방행정/지역발전' 편에 실린 마을기업 육성사업 통계를 연도별로 담은 전국 단위 집계 데이터로, 마을기업 수·마을기업당 평균 매출액·국비 사업비 같은 항목이 들어 있다. 사회적경제 분야 분석가나 정책 담당자가 '해마다 마을기업 수와 국비 지원 규모가 어떻게 바뀌었고 기업당 평균 매출은 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 공통 조인 키를 찾지 못해, 사회적기업·협동조합 등 다른 사회적경제 통계와는 연도와 항목 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: "- 행정안전부에서는, 「행정안전부 통계관리규정」에 따라, 행정안전부 본부와 소속기관의 통계자료를 취합하여 매년 '행정안전 통계연보'를 발간하고 있습니다.- '행정안전 통계연보'에 수록된 분야별 통계정보를 공공·민간의 다양한 분야에서 이용할 수 있도록 오픈API로 제공하고 있습니다.- 해당 오픈API는 '행정안전 통계연보'에 수록된 '지방행정/지역발전' 중 '마을기업 육성사업', '연도별 마을기업 육성사업'에 관한 통계입니다. 마을기업, 마을기업 당 평균 매출액, 사업비(국비) 등을 기준으로 하는 연도별 마을기업 육성사업 내용을 포함하는 통계 정보를 제공합니다.- 아울러, '행정안전 통계연보'는 행정안전부 누리집의 정책자료 > 통계 > 통계연보·주제별 통계에서 PDF 형태로 다운로드가 가능합니다."
