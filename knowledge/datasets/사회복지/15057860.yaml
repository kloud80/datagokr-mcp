summary_user: 경기도 내 아동양육시설을 시설 한 곳당 한 행으로 담는 시설별 현황 자료로, 집계년도·시군명·시설명·시설장·종사자 수·아동 정원과 현재원·주소·위도경도를 포함한다. 분석가나 지자체 담당자가 '우리 시군의 아동양육시설 정원 대비 현재 수용 아동은 얼마이고, 종사자 한 명이 몇 명을 맡는가'를 확인하거나 시설 분포를 지도에 올릴 때 쓴다. 실측상 전역 조인 키는 없어 시군명이나 시군코드(SIGUN_CD), 주소·좌표를 기준으로 다른 경기도 시군 통계나 복지시설 데이터와 이름 매핑으로 잇는다.
description_portal: 이 데이터는 경기도 내 ‘아동양육시설’의 운영 현황을 정리한 자료로, 보호가 필요한 아동들에게 생활공간과 보호서비스를 제공하는 공공·민간 복지시설에 대한 세부정보를 포함합니다. 주요 항목에는 집계년도, 시군명, 시설종별명, 시설명칭, 전화번호, 시설장명, 종사자 수(명), 수용아동 정원 및 현재원, 설치 주소(도로명 및 지번), 소재지 우편번호, WGS84 위도·경도 좌표 등이 있으며, 일부 항목은 설치년월일 등 누락된 정보도 포함하고 있습니다.아동양육시설은 가정으로부터 보호를 받기 어려운 아동을 대상으로 의식주, 교육, 정서 지원 등 전반적인 보호활동을 제공하는 장기거주시설로서, 사회복지법인이나 지자체에서 설치 및 운영하고 있습니다. 해당 데이터는 시설별 아동 수용 능력, 종사 인력 규모, 지역별 복지 자원 분포, 위기아동 보호 체계 점검, 복지 사각지대 해소 전략 수립 등에 활용됩니다. 특히 위도·경도 정보는 GIS 기반 분석을 통해 시설 접근성과 인근 사회서비스와의 연계성을 평가하는 데 유용합니다.본 자료는 경기도 및 각 시군의 아동복지 관련 부서에서 수집한 공공데이터로, 공공복지 인프라 정책 수립, 아동보호계획 수립, 사회복지서비스 자원 배분 분석 등에 사용될 수 있습니다.
