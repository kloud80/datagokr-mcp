summary_user: 장애인일자리사업 참여자에게 제공되는 교육과정을 과정 단위로 담은 목록 파일로, 교육연도·교육구분(필수·보수·역량·자격증 교육 등)·교육과정명을 전국 단위로 제공한다. 장애인일자리사업 운영기관 담당자나 분석가가 연도별로 참여자에게 어떤 필수·보수·역량 교육과정이 운영됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교육연도나 교육과정명 같은 이름 매칭, 또는 같은 기관(한국장애인개발원)의 다른 일자리사업 데이터와 수작업으로만 이어 쓴다.
description_portal: 장애인일자리사업은 장애인복지법 제21조(직업), 장애인복지법시행령 제13조의2(장애인일자리사업 실시)에 근거하여, 취업취약계층인 장애인에게 사회참여 확대 및 소득보장 지원을 위해 일자리를 제공하는 사업으로 보건복지부에서 실시하는 재정지원 일자리사업입니다. 장애인일자리사업의 원활한 사업운영 및 효과적인 관리를 위해 전문관리체계사업 운영하고 있으며 주요 추진 사업 중 일자리교육 지원 사업에서는 참여자 이러닝교육지원, 발달장애인 요양보호사 전문교육, 참여자 장애인일자리사업 지침 안내 및 교재 및 영상 제작, 맞춤형 취업지원 온라인 교육 영상 제작, 담당자, 정기교육 및 산업재해 예방교육 등을 수행하고 있습니다.장애인일자리사업 참여자를 대상으로 실시하는 교육정보 데이터로 필수교육, 보수교육, 역량교육, 자격증 교육정보 등의  교육과정명을 제공합니다.
