summary_user: 인천광역시 연수구 안에서 산모·신생아 건강관리 서비스를 제공하는 기관을 한 행에 하나씩 담은 기관 목록으로, 기관명·도로명 주소·전화번호를 담는다(CSV 약 1.8KB의 소규모 파일). 연수구에 사는 산모나 가족이 출산 후 산후도우미를 보내 주는 제공기관을 찾아 직접 연락하려 할 때 쓴다. 전역 조인 키나 시군구코드 필드가 없어 다른 데이터와는 기관명이나 주소 문자열로 맞춰 이어야 하며, 다른 지자체 제공기관 목록과 합쳐 비교할 때도 같은 방식으로 붙인다.
description_portal: 이 데이터는 인천광역시 연수구 내 산모신생아 건강관리 제공기관에 관한 정보를 담고 있습니다. 제공되는 항목은 기관명, 기관 도로명 주소, 그리고 전화번호로, 수요자는 해당 데이터를 통해 원하는 기관을 쉽게 찾고 연락할 수 있습니다. 산모와 신생아의 건강관리에 도움을 주는 다양한 기관들의 위치와 연락처 정보가 포함되어 있어, 필요한 서비스 이용 시 유용하게 활용될 수 있습니다. 이 자료는 특히 산모 및 신생아 건강관리에 관심 있는 개인이나 관련 기관들이 빠르고 효율적으로 정보를 접근할 수 있도록 돕습니다.
