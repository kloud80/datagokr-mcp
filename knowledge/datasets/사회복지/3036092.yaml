description_portal: '- 전라남도 시군에 위치한 요양보호사 교육기관 현황 (교육기관명, 주소, 연락처 등)에 관한 데이터를 조회하실 수 있습니다.- 전라남도에서 요양보호사로 일하고자 하신다면, 다양한 교육기관과 취업 기회가 마련되어 있습니다.- 전라남도에서 요양보호사 자격증을 취득하려면 국비 지원이 가능한 교육기관을 통해 학습하는 것이 경제적입니다.- 교육과정 및 일정은 각 교육기관에 문의하여 확인하시기 바랍니다.- 취업 연계 서비스는 교육기관별로 상이하므로, 취업 지원 여부를 사전에 확인하시기 바랍니다.- 요양보호사로서의 경력을 쌓고자 하신다면, 위의 교육기관에서 자격증을 취득하신 후, 채용 정보를 통해 취업 기회를 찾으실 수 있습니다.'
