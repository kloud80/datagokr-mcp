description_portal: 대전광역시 요보호아동자립지원 자료는 보호가 필요한 아동의 안정적인 사회 정착을 위한 다양한 지원 내용을 포함하고 있습니다. 경계선지능아동에 대해서는 양육 시설 내 보호 중인 아동을 대상으로 개인 별 특성과 상황을 고려한 맞춤형 사례 관리 서비스를 제공하고 있으며, 이를 통해 아동의 사회 적응력과 자립 역량을 향상 시키고자 합니다. 자립 수당은 보호 종료 이후 초기 자립 생활을 지원하기 위한 제도로, 만 18세 이후 보호가 종료된 아동에게 3년간 매월 30만원의 현금을 지원하여 경제적 부담을 완화하고 안정적인 생활 기반을 마련할 수 있도록 돕습니다.  이 자료는 요보호아동의 자립 과정 전반을 파악하고, 정책 수립 및 예산 계획, 복지 서비스 연계, 자립 지원 프로그램 개선 등에 활용될 수 있는 중요한 자료입니다.
