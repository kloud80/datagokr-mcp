summary_user: 전국 장례식장을 시설 한 곳당 한 행으로 담은 현황 파일로, 시도·시군구·주소·연락처와 공설/사설 구분, 빈소 수, 안치 가능 구수, 주차 가능 대수, 식당·매점·유족대기실·장애인편의시설 유무, 운영 종류를 담는다. 유족이 우리 지역에서 빈소가 여럿이고 장애인편의시설이 있는 공설 장례식장을 찾거나, 분석가가 시군구별 안치 용량과 공설 시설 분포를 비교하는 데 쓴다. 전역 조인 키나 코드 필드는 없어서, 다른 데이터와는 시도·시군구 이름이나 주소·시설명을 맞춰 연결한다.
description_portal: '보건복지부에서 관리하는 보건복지현황 중 장례식장 현황(시도, 시군구, 시설명, 주소, 전화번호, 팩스번호, 홈페이지, 주차가능대수, 공/사설 구분, 빈소수, 안치가능구수, 식당, 매점, 주차장, 유족대기실, 장애인편의시설, 운영종류)에 대한 정보를 제공 합니다.<데이터 이용 시 유의사항> * 안치 : 시신의 부패와 세균번식 등을 막기 위하여 냉장 시설에 시신을 모시는 것 * 공설 시설 : 특별시장ㆍ광역시장, 도지사, 시장ㆍ군수ㆍ구청장이 설치ㆍ운영하는 시설 * 사설 시설 : 특별시장ㆍ광역시장, 도지사, 시장ㆍ군수ㆍ구청장이 아닌 자가 설치ㆍ운영하는 시설 * 빈소 : 문상객의 문상을 받기 위하여 고인의 영정이나 혼백을 모셔 놓은 장소(죽은 사람을 매장할 때까지 유체를 안치시켜 놓는 장소를 말한다. 옛날에는 별채의 작은 집을 설치하여 안치하였으나, 후대에는 주로 관에 유체를 넣어서 골방 등에 안치하였다. 이 기간은 가족들이 죽은 사람이 소생할 것을 기대하여 생전과 똑같이 음식을 차려 올렸다. 요즘은 문상객의 문상을 받기 위하여 고인의 영정을 모셔 놓은 장소라는 의미로 쓰인다.)'
