summary_user: 경기도 내 기타 유형 집단급식소를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 시군·사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·시설면적·종업원 수 등을 포함한다. 위생 행정 담당자나 분석가가 '우리 시군에서 현재 영업 중인 집단급식소는 어디이고 언제 인허가됐는가'처럼 위생점검 대상 선정이나 식중독 예방 정책을 위해 급식소 분포와 운영 상태를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)나 정제 주소·우편번호로 같은 경기도 인허가 데이터나 행정구역 자료와 이름·주소 매칭으로 잇는다.
description_portal: 이 데이터는 경기도 내 다양한 유형의 집단급식소에 대한 행정 정보 및 운영 현황을 집계한 자료로, 인허가일자, 폐업일자, 영업상태, 소재지, 시설면적 등 다양한 정보를 포함하고 있습니다. 주요 항목으로는 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지도로명주소 및 지번주소, 시설전화번호 등이 있으며, 이를 통해 각 급식소의 설립·운영 상태 및 위생관리 대상을 파악할 수 있습니다. 해당 데이터는 어린이집, 학교, 사회복지시설, 기업체 등에서 운영 중인 집단급식소를 포함하며, 식품위생 행정관리, 식중독 예방 정책 수립, 식생활 안전 확보, 식품위생 점검 대상 선정 등에 활용됩니다.
