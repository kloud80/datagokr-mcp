summary_user: 제주특별자치도 안의 청소년복지(지원)시설을 시설 한 곳당 한 행으로 담은 목록으로, 유형(상담복지센터·학교밖청소년지원센터·쉼터·자립지원관·회복지원시설·성문화센터), 시설명, 시설규모, 소재지 주소, 운영법인, 개원일을 담는다. 보호자나 청소년 지원 실무자가 '제주에서 가출·위기 청소년이 머물 수 있는 쉼터는 어디에 있고 어느 법인이 운영하나'를 찾거나, 분석가가 지역별 청소년 지원시설 분포를 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 시설명·주소 문자열 매칭으로만 잇고, 주소를 시군구로 묶으면 지역 통계(regional-statistics)와 나란히 볼 수 있다.
limits: 표준 시설코드 같은 공통 키가 없어 다른 시설 목록과 자동 결합이 어렵고 이름·주소 매칭이 필요하다. 범위는 제주특별자치도 한 곳뿐이라 다른 시도와 비교하려면 별도 자료가 필요하며, 명세상 연간 단위로 만들어지는 파일이므로 데이터기준일자를 확인하고 쓴다.
