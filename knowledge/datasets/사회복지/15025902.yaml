summary_user: 광주 지역 한부모가족복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설 구분(기본형·공동생활가정 등), 시설명, 시설장, 설립 일자, 주소, 운영주체, 법인대표를 담는다. 한부모 당사자나 상담 실무자가 '광주에서 미혼모자가 입소할 수 있는 시설은 어디이고 누가 운영하나'를 확인할 때, 또는 분석가가 자치구별 시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 복지시설 데이터와는 시설명·주소를 맞춰 잇거나 같은 기관 자료끼리 묶어 쓰며, 사회복지시설 공통 마스터를 참조할 때 보조 자료로 쓴다.
description_portal: 광주광역시에는 한부모가족을 위한 복지시설이 총 5곳 운영되고 있으며, 모자가정과 미혼모자가정을 위한 기본형 시설과 공동생활가정 형태로 구분됩니다. 주요 시설로는 인애빌, 우리집, 엔젤하우스, 평안의집, 편한집 등이 있으며, 광주 남구와 광산구에 주로 위치해 있습니다. 이들 시설은 주거 공간을 제공할 뿐 아니라 양육지원, 정서적 상담, 자립을 위한 교육과 훈련 등 다양한 복지서비스를 함께 제공합니다. 대부분 사회복지법인이 운영하고 있으며, 입소자에게는 기본적인 생활환경은 물론 자녀 양육에 필요한 지원도 함께 제공되어 한부모가정의 안정적 생활과 자립 기반 마련에 중요한 역할을 하고 있습니다.
