description_portal: 서울특별시의 저상버스 도입 노선 및 노선별 보유율 데이터를 제공합니다. 노선번호, 인가대수, 저상대수, 보유율 등의 항목을 제공합니다. 저상버스는 교통약자, 특히 휠체어 이용자나 노약자의 이동 편의성을 높이기 위해 도입된 차량으로, 서울시의 대중교통 접근성 향상을 평가할 수 있는 중요한 지표입니다. 이 데이터는 각 버스 노선별로 저상버스가 얼마나 보급되어 있는지 비교할 수 있으며, 대중교통 서비스의 포용성과 접근성 개선 현황을 확인하는 데 활용될 수 있습니다. 또한 정책 수립, 교통 복지 평가, 노선별 개선 필요성 분석 등에 기초자료로 쓰일 수 있는 의미 있는 데이터입니다.
