description_portal: 본 데이터는 경기도 광주시청에서 관리하는 기초생활수급자 현황 자료입니다. 주요 제공 항목은 시도명, 시군구명, 읍면동명칭, 수급자의 자격, 수급자의 연령구간, 수급권자수, 통계년도 등으로 구성되어 있으며, 광주시 내 기초생활수급자 현황을 자격별, 연령별, 지역별로 확인할 수 있도록 통계자료를 제공하고 있습니다. 해당 데이터는 사회복지 정책 수립과 지원 대상 선정, 복지 서비스 제공의 기초자료로 활용됩니다. 또한, 수급권자 현황 분석을 통해 지역 내 복지 수요를 파악하고, 맞춤형 복지정책 개발에 기여합니다.
