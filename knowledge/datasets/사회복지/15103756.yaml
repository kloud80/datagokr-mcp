description_portal: 한국동서발전의 사회적기업 제품 구매실적 정보는 공공기관이 사회적경제조직으로부터 구매한 실적을 연도별로 집계한 데이터로, 사회적 가치 중심 조달 활동의 이행 수준을 정량적으로 보여주는 자료입니다.해당 데이터는 연도, 구분(‘사회적기업 제품 구매액’, ‘(인증)사회적기업 제품 구매액’), 물품 구매액, 용역 구매액, 물품 구매 비율(%), 용역 구매 비율(%) 등의 항목으로 구성되어 있으며, 사회적기업의 인증 여부에 따른 조달 유형을 구분하여 제공합니다.이 데이터는 한국동서발전이 사회적경제조직과의 연계 조달을 통해 지역사회 기여 및 포용적 성장에 얼마나 참여하고 있는지를 수치적으로 분석할 수 있도록 구성되어 있습니다.학계 및 연구기관에서는 본 데이터를 활용하여 사회적기업 인증 유무에 따른 구매 실적 비교, 물품과 용역 간 구매 비중 변화 추이, 공공기관의 사회적경제 활성화 정책 이행 현황 분석 등을 수행할 수 있습니다.또한 ESG 경영 성과 분석, 공공조달 내 사회혁신 조직의 참여 확대 경향 분석, 사회적경제조직 대상 지원정책의 실효성 검토, 타 공공기관과의 조달 기여도 비교 등 다양한 정책 연구와 실증 평가에 활용될 수 있습니다.특히 인증 여부에 따른 구매 성과 비교는 사회적기업 육성 정책의 구체적 효과를 평가하는 데에도 유용한 분석 기준을 제공합니다.
