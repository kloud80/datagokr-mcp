summary_user: 경기도 시군별로 긴급복지지원사업을 맡은 담당부서명, 담당팀명, 전화번호를 한 행씩 담은 연락처 목록이며, 지원 실적이나 수급 통계는 들어 있지 않다. 위기 상황에 놓인 주민이나 민원 안내 담당자가 '우리 시군에서 긴급 생계비·의료비 지원을 문의하려면 어느 부서에 전화해야 하나'를 확인하는 데 쓴다. 실측 컬럼에서 전국 공통 조인 키는 확인되지 않아, 시군명(SIGUN_NM)이나 경기도 자체 시군코드를 기준으로 같은 기관(경기도)의 다른 시군별 데이터와 이름·코드 매핑으로만 잇는다.
description_portal: '이 데이터는 경기도 내 각 시군별로 긴급복지지원사업을 담당하는 부서 및 연락처 정보를 포함하고 있으며, 시군명, 담당부서명, 담당팀명, 전화번호 등의 세부 항목으로 구성되어 있습니다. 긴급복지지원사업은 긴급복지지원법에 따라 갑작스러운 위기 상황으로 인해 생계유지가 곤란한 가구를 대상으로 일시적 생계비, 의료비 등을 지원하기 위한 제도입니다. 본 API는 XML 및 JSON 형식으로 제공되며, 지역별 위기대응 복지체계를 분석하거나 민원 안내 시스템에 활용될 수 있습니다.-긴급복지지원법: 생계유지 곤란 등의 위기 상황에 처한 국민에게 신속한 지원을 제공하기 위한 법률로, 복지 사각지대를 최소화하기 위한 국가 제도입니다. 관련 내용은 법제처 국가법령정보센터에서 확인할 수 있습니다.-긴급복지지원사업: 중대한 위기 상황에서 생계, 의료, 주거 등을 단기간 내에 지원하는 제도이며, 복지 사각지대 해소를 목적으로 시행됩니다.'
