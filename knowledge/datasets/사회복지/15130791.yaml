description_portal: '서울특별시 서초구 관내 가게 중 무장애가게 현황 정보로 상호명, 주소, 일층, 경사로, 입구턱, 엘리베이터 유무 등의 정보관련하여 2024년 8월에 정리한 데이터를 제공합니다.무장애가게(Barrier-Free Shop)는 휠체어 경사로, 낮은 문턱, 넓은 이동 동선 등 편의시설을 갖추어 장애인, 노약자, 임산부 등 누구나 편리하게 이용할 수 있는 상점입니다. 턱이 없거나 낮은(2cm 이하) 입구, 장애인 화장실, 시각장애인용 안내판 등이 설치되며, 전국적으로 ‘우리동네 무장애지도’ 등을 통해 정보가 제공됩니다. 주요특징으로는 경사로가 설치되어 휠체어 출입이 가능하도록 입구의 문턱 제거가 있고, 접근성 보장이 되어 휠체어 회전이 가능한 공간(보통 80cm 이상 폭)과 내부 이동 편의성이 있습니다.편의 기능으로는 화장실 핸드레일, 도움벨, 점자 메뉴판, AAC(보완대체의사소통)판 등이 있습니다.※ 기타유의사항 : 빈공란은 데이터 미집계입니다.'
