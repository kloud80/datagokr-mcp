description_portal: '공무원연금공단에서 제공하는 연금수급자유형별 사유별(사망,청산,유족승계,합산신청,퇴직처분취소 등) 연금수급종결자 현황 데이터로, 1982년부터 기준년도까지 제공하고 있습니다.본 데이터는 사망 이외의 다양한 사유로 인한 연금 수급 종료 실태를 분석하는 데 활용될 수 있습니다.1. 청산 : 이민 또는 국적상실시 본인의 원에 의한 청산(4년분 연금액의 상당금액을 일시 지급) 및 유족이 아닌 직계비속 또는 기관장에게 지급되는 특례급여2. 퇴직처분취소 : 파면, 해임, 직권면직, 의원면직 등 퇴직처분 취소3. 기타 - 퇴직연금수급자 : 퇴직연금→일시금 전환, 퇴직자 행방불명 등'
