summary_user: 부산광역시 사하구 어린이집을 한 곳씩 담은 건별 원천 데이터로, 어린이집명·유형·운영 여부, 주소·연락처·위경도, 보육실 수와 면적·놀이터·CCTV 수, 보육교직원 수, 정원·현원, 통학차량 운영 여부, 인가일자를 담는다. 부모가 사하구에서 통학차량을 운영하고 현원이 정원보다 적은 어린이집이 집 근처 어디에 있는지 찾거나, 분석가가 동네별 보육 수급을 볼 때 쓴다. 전역 조인 키가 없어 다른 어린이집 데이터와는 어린이집명·주소를 맞추거나 시설 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 어린이집 현황 API는 부산광역시의 어린이집 운영 현황과 기본 정보를 체계적으로 제공하는 서비스입니다. 응답 항목에는 어린이집의 행정구역 정보(시도명, 시군구명), 기관명과 유형, 운영 여부가 포함되어 있어 기본적인 식별이 가능합니다. 또한 우편번호, 상세주소, 전화번호, 팩스번호, 홈페이지 URL을 제공하여 이용자가 직접 연락하거나 위치를 확인할 수 있습니다. 시설 관련 정보로는 보육실 수와 면적, 놀이터 수, CCTV 설치 수 등이 제공되며, 보육교직원 수, 정원 및 현원 현황을 통해 운영 규모와 안전 수준을 파악할 수 있습니다. 아울러 위도와 경도 좌표를 제공하여 지도 기반 서비스와 연계가 가능하며, 통학차량 운영 여부와 인가일자를 통해 운영 형태를 명확히 확인할 수 있습니다. 추가적으로 제공 서비스 항목과 데이터 기준일자가 포함되어 있어 정책 수립, 학부모 선택, 지역별 보육 수급 분석 등에 활용할 수 있습니다. 이 API는 어린이집 이용자와 행정기관 모두에게 투명하고 신뢰성 있는 보육 정보를 제공하는 데 목적이 있습니다. ※ 원시시스템 한계로 인해 구군별로 데이터 조회 가능합니다. (부산시 전체 조회 불가)
