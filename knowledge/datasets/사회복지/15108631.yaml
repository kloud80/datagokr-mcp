summary_user: 원주시를 500m 격자 단위(cell_id·격자 도형)로 나눠 월별(ym)로 어린이·노인 보호구역 유무와 개수, 횡단보도·과속방지턱 수, 어린이집·유치원·경로당 수, 평일·휴일 유동인구, 어린이·노인 교통사고 건수(부상·경상·중상·사망 구분)와 사고 위치 좌표를 담은 집계 데이터다. 원주시 교통안전 담당자나 분석가가 '어린이·노인 사고가 잦은데 보호구역이 지정되지 않은 격자는 어디인가'를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 격자 도형·사고 좌표로 공간 결합하거나 같은 기관 코드로만 잇는다.
limits: 범위는 원주시 한 곳뿐이라 다른 시군구와 비교할 수 없고, 건물관리번호·PNU 같은 공통 키가 없어 건물 단위 편의시설 원장과 직접 조인되지 않는다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
