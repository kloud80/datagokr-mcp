description_portal: 관내에 존재하는  수련활동에 필요한 여러 시설, 설비, 프로그램 등을 갖추고 청소년지도자의 지도하에 체계적이고 조직적인 수련활동을 실시하는 시설의 현황을 안내합니다.2004년까지 청소년기본법상에서 생활권 수련시설(청소년수련관, 청소년문화의집), 자연권 수련시설(청소년수련원, 청소년야영장), 유스호스텔로 구분하였으나,2005년 청소년활동 진흥법 시행에 따라 청소년수련관, 청소년수련원, 청소년문화의집, 청소년특화시설, 청소년야영장, 유스호스텔로 구분됩니다.현재 시립시설 8개소와 구립시설 11개소, 총 19개소가 위치하고 있습니다.
