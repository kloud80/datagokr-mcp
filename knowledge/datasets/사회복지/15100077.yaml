summary_user: 대구광역시 동구에 있는 노인요양시설을 시설 한 곳당 한 행으로 담은 원천 목록 파일로, 시설명·소재지 주소·시설장·전화번호·운영주체·개원일자를 담는다. 동구 주민이 집 근처 요양시설의 위치와 운영 주체(개인·법인 등), 개원 시점을 확인하거나, 복지 담당자가 동구 내 요양시설 분포와 운영 형태를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건강보험 장기요양기관 정보나 사회복지시설 목록과는 시설명·주소를 맞춰 이어 쓰고, 지역 통계와는 시군구(동구) 단위로만 연결한다.
limits: 범위가 대구 동구 한 시군구로 한정되어 다른 지역과 비교하려면 각 시군구 파일을 따로 모아야 한다. 시설코드 같은 공통 키가 없어 다른 데이터와 붙일 때 시설명·주소 문자열 매칭에 의존해야 하며, 정원·현원·평가등급 같은 운영 실적은 담겨 있지 않다.
