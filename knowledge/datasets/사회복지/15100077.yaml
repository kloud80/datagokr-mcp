description_portal: '대구광역시 동구에서 보유중인 노인요양시설 공공데이터는  동구 소재 42개 노인요양시설 정보를 제공하고 있으며, 주소, 전화번호, 시설장, 운영주체, 개원정보 등을 포함하고 있습니다. 이 데이터는 동구 노인요양시설의 조직·운영 체계를 파악하고, 복지 인프라 분석 및 서비스 향상을 위한 기반 자료로 유용할 수 있습니다. 복지정책담당자에게 요양시설의 분포, 운영 형태, 개원 연도를 분석해 지역 복지서비스 계획 수립에 활용할 수 있으며, 주민들에게 인근 요양시설의 위치, 운영 주체, 개원 시점 등을 참고하여 시설 선택에 도움을 줄 수 있습니다.주요 데이터 구성주소: 시설의 도로명 및 지번 주소 정보전화번호: 연락 및 상담 가능한 대표 전화시설장: 시설을 책임·운영하는 대표자 이름운영주체: 개인, 법인, 재단 등 시설을 운영하는 기관개원일자: 시설이 정식 개원한 날짜'
