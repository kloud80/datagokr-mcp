summary_user: 공무원연금 지급액 조정에 반영된 소비자물가변동률을 연금적용연도별로 한 행씩 담은 전국 단위 집계표로, 물가변동연도와 고시일자가 함께 들어 있다(csv 794바이트의 작은 파일). 공무원연금 수급자나 연금 분석가가 '올해 연금이 몇 % 올랐고 어느 해 물가를 기준으로 했나'를 확인하거나 연도별 연금 인상률 추이를 볼 때 쓴다. 전역 조인 키는 없어서 다른 직역연금 통계나 물가 통계와는 연도(연금적용연도·물가변동연도)를 맞춰 이어 쓴다.
