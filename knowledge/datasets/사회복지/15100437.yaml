description_portal: 본 데이터는 2021년 한 해 동안 CYS-Net을 통해 지원된 위기청소년에 대한 지역별·성별 수혜청소년 인원 수치 통계를 제공합니다. 한국청소년상담복지개발원을 중심으로 운영된 CYS-Net은 지역사회 중심의 위기청소년 조기발견 및 개입을 위한 연계망이며, 본 데이터는 해당 사업의 연도별 운영성과를 수치로 나타낸 것입니다. 데이터는 12월 말 기준으로, 지역 단위별로 남자, 여자, 전체 합계 지원 인원으로 구성되어 있으며, 지역별 수요 분포와 성별 특성에 따른 차이를 비교·분석할 수 있습니다. 이를 통해 정책 수립, 자원 배분, 맞춤형 개입전략 수립 등 다양한 분야에서 활용이 가능합니다. 데이터는 위기청소년 지원체계의 실질적 운영현황을 반영합니다.
