summary_user: 국민연금공단이 위탁 심사하는 장애인활동지원 수급자를 장애유형(지체·뇌병변·시각·자폐·정신 등 15개 유형)별로 중증(심한 장애)과 경증(심하지 않은 장애)으로 나눠 센 전국 단위 집계표로, 2024.12.31. 기준 누적 수급자 161,603명을 담는다. 복지 정책 분석가가 '활동지원 수급자 가운데 어떤 장애유형의 비중이 크고, 유형별로 중증·경증 구성은 어떤가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 장애인 통계와는 장애유형 이름을 맞춰서만 이어 쓴다.
