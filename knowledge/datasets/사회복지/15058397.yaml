summary_user: 노인 일자리·사회활동 관련 사회참여 자원을 건별로 담은 API로, 시도·시군구 코드와 조회 기간을 넣으면 해당 지역·기간의 자원별 기관명, 주소, 서비스 분류, 모집기간·모집정원·모집연령, 참여기간, 등록기관을 돌려준다(범위 전국). 노인 사회참여 기관 담당자나 연구자가 "우리 시군구에서 올해 모집하는 노인 사회활동 자원은 어떤 분류에 몇 명 정원인가"처럼 지역·서비스별 공급 현황과 모집 시기를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구명(sidoname, gunguname)이나 행정구역 코드, 기관명 같은 이름·코드 매핑으로만 잇는다.
description_portal: 한국노인인력개발원에서 제공하는 「사회참여 자원조회」 오픈API로, 노인 일자리 및 사회활동 지원 관련 정보를 체계적으로 조회할 수 있는 데이터입니다. API는 시도/시군구 코드와 기간(조회 시작일, 종료일)을 입력값으로 받아 해당 지역과 기간 내 사회참여 자원 정보를 반환합니다. 출력 데이터에는 행정구역 코드, 시군구명, 기관명, 서비스 분류코드 및 명칭, 참여기간, 모집유형, 모집정원, 등록기관, 자원정보 코드와 명칭, 일련번호, 지역본부 등의 세부 항목이 포함됩니다. 이를 통해 기관 및 연구자는 노인 사회활동 참여 현황을 지역별, 서비스별로 분석할 수 있으며, 정책 수립이나 현장 운영 시 참고자료로 활용 가능합니다. 특히 모집정원, 모집일자, 참여기간과 같은 항목을 통해 자원 운영의 시기적 특성을 파악할 수 있어, 지역사회 내 노인 일자리 및 복지서비스 공급·수요 균형을 진단하는 데 기여할 수 있습니다.
