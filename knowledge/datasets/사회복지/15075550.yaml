description_portal: 본 데이터는 한국청소년상담복지개발원이 수집한 청소년상담복지센터의 연계자원 현황을 연도별로 제공합니다. 데이터는 각 연도별로 상담복지센터가 협력하고 있는 외부 자원의 종류 수를 포함하고 있으며, 지역사회 내 다양한 기관과의 연계 수준을 파악하는 데 활용됩니다. 연계자원에는 경제적 지원, 학업, 정신건강, 취업, 문화/복지, 상담, 교정, 의료지원, 보호, 법률지원 등 다양한 분야가 포함되며, 청소년 대상 맞춤형 서비스 제공의 기반이 됩니다. 본 데이터는 청소년 지원체계의 통합성과 연계 협력의 강화를 위한 정책 수립, 자원 배치 및 서비스 개선에 참고자료로 활용될 수 있습니다.
