summary_user: 아이돌봄 서비스의 누적 이용 아동 수를 기준연월·아이돌봄기관별로 집계해 담으며, 전염성질병 아동 여부와 돌봄구분별로 남아·여아 아동수와 유형별 아동수를 나눠 제공하는 전국 범위의 집계 데이터다. 정책 분석가나 지자체 담당자가 "우리 지역 아이돌봄기관에서 남아와 여아의 돌봄 이용 규모에 차이가 있는가"를 점검할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 아이돌봄기관 번호·이름(childCareInstNo)이나 상위기관 정보로 같은 기관 데이터끼리 맞춰 연결하거나 사회복지시설 공통 마스터에 이름으로 대조해 쓴다.
description_portal: 아이돌봄 성별 누적아동실적현황 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 기준연월, 아이돌봄기관명, 전염성질병 아동여부, 돌봄구분명, 아동수, 남아아동수, 여아아동수 등의 정보를 확인할 수 있습니다.봄 수요의 성별 불균형 여부를 분석하는 데 유용합니다. 남아와 여아 각각의 돌봄 이용률을 비교함으로써, 특정 성별에 대한 접근성이 제한되지 않는지 점검할 수 있습니다. 성별 데이터는 젠더 관점에서의 아동 복지 접근성을 점검하는 통계 근거로 활용되며, 정책 설계 시 성별 형평성을 고려한 돌봄 서비스 확충에도 활용될 수 있습니다.
