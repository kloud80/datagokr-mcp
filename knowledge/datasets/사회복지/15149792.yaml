description_portal: 해당 데이터는 창원시에서 추진하는 사랑의pc사업에 대한 데이터입니다.본 파일은 보급 연도/월 및 설치대수에 대한 정보가 기재돼있습니다.설치대수 열의 단위는 "대"로 관리하시면됩니다.2021년 1월~2025년 9월까지 약 5년간 취약계층에게 보급된 pc의 수를 확인하실 수 있습니다.사랑의 PC 사업은 행정기관·공공기관·기업체 등에서 발생한 중고 PC를 수집하여 정비한 다음 정보소외 계층에 무상으로 보급하는 복지‑디지털포용 사업입니다. 대상은 기초생활수급자  등의 정보 취약 가정입니다. 이 사업은 기술 격차 완화, 디지털 접근성 확보, 사회복지 향상, 공공 자원 활용 효율성 및 환경적 재활용 효과 증대 등의 목적으로 운영되며, 지역별 신청 절차, 보급 기준 및 제외 기준 등을 명확히 하고 있어 투명성과 공정성을 확보하고 있습니다.
