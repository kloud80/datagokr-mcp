description_portal: 성남시내 장애인시설(시설종류,시설명,소재지,규모,전화,이용자수,종사자,주요프로그램 소유자 등) 현황입니다.성남시는 경기도 내에서 인구 밀도가 높은 대도시로, 장애인을 위한 복지 인프라 구축에 꾸준히 힘써 왔습니다. 현재 성남시에는 장애인 생활시설, 주간보호센터, 직업재활시설, 자립생활센터(IL센터) 등 다양한 유형의 복지시설이 운영되고 있습니다. 각 시설은 중증·경증 장애인, 지적·지체 장애인 등 다양한 유형에 따라 맞춤형 서비스를 제공하며, 일부는 국공립 형태로, 일부는 민간 위탁 운영됩니다.
