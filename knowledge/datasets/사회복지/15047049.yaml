description_portal: '○ 통계개요* 통계명 : 장애인 생활인원* 통계종류 : 서울시 장애인 생활시설 생활인원 현황을 제공하는 일반ㆍ조사통계* 근거법령 :「장애인복지법」제48조에 의거 장애인이 일정기간 생활하면서재활치료를 받거나 요양하는 시설* 작성목적 : 장애인 생활시설의 생활인원 현황을 파악하여 장애인 관련 정책 수립을위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 장애인복지정책과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 장애인 생활시설수 및 성별ㆍ연령별ㆍ장애유형별생활인원 현황○ 용어설명* 장애인 생활시설 : 장애인이 필요한 기간 생활하면서 재활치료를 받거나 장기간요양하는 시설○ 기타* 장애유형 기타에 "중증장애" 포함됨'
