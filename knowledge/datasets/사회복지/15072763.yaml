summary_user: 광주광역시 다함께돌봄센터를 센터 1곳당 한 행으로 담은 2024년 12월 말 기준 현황 파일로, 도로명주소·개소일·전용면적·위탁기관과 위탁기간·운영시간·학기중 월 이용료·정원과 현원·종사자·프로그램 운영을 담는다. 초등학생 자녀를 둔 보호자가 집 근처 센터의 운영시간과 이용료, 남은 정원을 확인하거나, 분석가가 지역별 초등돌봄 공급과 정원 대비 이용률을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명주소나 센터·위탁기관 이름을 맞춰 연결해야 하며, 사회복지시설 공통 마스터와 대조하는 용도로 쓴다.
