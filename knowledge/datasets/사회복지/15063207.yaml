summary_user: 대전광역시 안에서 운영 중인 노인요양공동생활가정을 시설 한 곳당 한 행으로 담은 파일 목록이다. 시설명, 소재지, 시설 유형, 입소자 정원, 전화번호, 설치주체가 들어 있다. 치매·중풍 등으로 돌봄이 필요한 어르신의 가족은 "우리 동네 가까운 공동생활가정은 어디이고 정원은 몇 명인가"를 찾는 데 쓰고, 정책 담당자는 구별 시설 분포와 정원 규모를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 시설명으로 맞춰 이어야 하며, 지역 단위 노인 인구 같은 시군구 통계와는 주소에서 뽑은 구 이름으로 연결한다.
limits: 시설 코드 같은 공통 식별자가 없다. 그래서 장기요양기관 목록 등 다른 시설 데이터와 정확히 맞추려면 이름과 주소를 일일이 대조해야 한다. 범위는 대전광역시 한 곳뿐이라 다른 시도와 비교하려면 별도 자료가 필요하다.
