summary_user: 경기도 장애인 의료비 지원 현황을 기준년도·시군 단위로 묶은 집계 자료로, 전체 진료실인원·진료건수·의료비와 입원·외래·약제 조제별 인원·건수·지원액을 담는다. 복지 행정 담당자나 분석가가 '어느 시군에서 장애인 입원 의료비 지원 규모가 크고, 연도별로 어떻게 변했나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 시군 단위 통계와는 시군명(SIGUN_NM)이나 시군코드 같은 기관 내부 코드를 매핑해 연결한다.
description_portal: 이 데이터는 장애인의 의료비 지원 현황을 연도별·지역별로 집계한 자료로, 진료 유형별 의료 이용 현황과 비용을 파악할 수 있습니다. 주요 항목에는 기준년도, 시군명, 전체 진료실인원수, 전체 진료건수, 전체 장애인 의료비, 입원·외래·조제 진료별 인원수와 건수, 해당 진료별 의료비 지원액이 포함되어 있습니다. 이를 통해 장애인의 입원, 외래, 약제 조제 등 의료 서비스 이용 현황을 구체적으로 확인할 수 있으며, 지역별 의료비 지원 규모의 차이를 비교할 수 있습니다. 또한 연도별 추이를 통해 의료비 지원 정책의 효과성과 지원 사각지대 여부를 검토할 수 있어 보건복지 행정 및 재정 정책 수립에 중요한 자료로 활용됩니다.
