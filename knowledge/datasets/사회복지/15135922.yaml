description_portal: 한국건강가정진흥원이 제공하는 "기관 대표 누리집 상담기관 정보 현황"으로, 공식 웹사이트에서 제공하는 관심 주제별 상담기관 정보를 포함하고 있습니다. 데이터 항목은 연번, 상담기관, 연락처, 상담방법, 관심주제, 홈페이지명, 홈페이지주소로 구성되어 있으며, 이를 통해 각 상담기관의 기본 정보와 제공하는 상담 서비스의 내용을 확인할 수 있습니다. 이러한 정보는 가족상담전화(양육비상당, 한부모가족상당, 심리정서지원), 가족정책, 정신건강상담, 임신육아종합포털(아이사랑), 자살예방 상담 등 다양한 분야에서 활용될 수 있으며, 상담기관을 찾는 개인이나 관련 기관이 유용하게 사용할 수 있습니다
