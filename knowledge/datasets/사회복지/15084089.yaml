description_portal: '성남시 내 수유시설 현황 데이터로, 구별, 동별, 시설구분(가족수유실, 모유수유실), 시설명, 상세위치, 소재지도로명주소, 소재지지번주소, 이용대상, 면적, 비치물품, 관리기관, 전화번호 등의 항목으로 구성되어 있습니다.※ 지하철역 수유시설 출처: 레일포털 OpenAPI※ 전국의 수유시설 현황은 수유시설 검색 홈페이지(https://sooyusil.com)에서도 확인하실 수 있습니다.성남시 수유시설 현황은 시민 누구나 편리하게 이용할 수 있도록 공공 및 민간 다중이용시설에 설치된 모유수유실 및 영유아 휴게시설의 위치와 운영 정보를 포함합니다. 성남시는 공공청사, 도서관, 보건소, 복지관, 여성회관, 시립도서관 등 다수의 공공건물 내에 전용 수유공간을 조성해 왔으며, 특히 수유 전용 의자, 기저귀 교환대, 세면대, 냉온수기 등 기본 편의시설을 구비해 부모와 영유아 모두의 편의를 도모하고 있습니다.'
