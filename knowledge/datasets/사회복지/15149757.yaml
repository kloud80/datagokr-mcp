description_portal: '서울특별시 강서구 내 장애인 등록 인구 및 기초생활보장수급자(생활이 어려운 가구)의 현황을 정리한 자료입니다.이 자료는 취약계층을 위한 복지 정책 수립, 돌봄 인프라 구축, 맞춤형 복지서비스 제공 등을 위한 필수 기초자료로 사용됩니다.특히 행정동 단위로 제공되면, 지역 간 복지 수요 격차 파악과 서비스의 형평성 확보에도 큰 역할을 합니다. 디지털 약자 공공데이터 접근성 제고를 위하여 점자파일을 개방합니다. * 점자데이터 파일 형식- blb: 편집용 점자 문서- brf: 출력용 점자 문서 (점자 프린터 전용)- brl: 출력용 점자 문서 (점자 디스플레이 장치용)해당 점자데이터 파일 형식의 문서는 점자데이터 시스템 설치 후 확인 가능합니다.ex) 점사랑 (국립국어원 홈페이지에서 다운로드 가능:  https://korean.go.kr/braille/common/greeting.do)'
