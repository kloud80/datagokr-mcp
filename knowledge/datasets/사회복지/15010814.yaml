summary_user: 국민연금공단 지사와 상담센터를 한 곳당 한 행으로 담은 전국 목록으로, 기관명·우편번호·주소·전화번호·팩스번호를 담는다. 국민이나 민원 담당자가 "우리 동네에서 가장 가까운 국민연금 지사나 상담센터는 어디이고 전화번호는 무엇인가"를 확인하는 데 쓴다. 지사(센터)명(nps_branch_cd)이 조인 키여서 같은 지사 단위로 집계된 국민연금 통계와 이어 쓰고, 주소를 기준으로 지역 단위 가입·수급 통계에도 연결한다.
description_portal: 본 데이터는 국민연금공단 지사 및 상담센터 현황을 제공하기 위해 2026년 8월 1일 기준으로 작성된 자료입니다. 국민연금공단은 전주에 본부를 두고 있으며, 전국적으로 112개 지사와 장애심사센터, 국제연금지원센터 및 26개 상담센터인 총 140곳을 운영하고 있습니다. 데이터에는 각 지사와 상담센터의 명칭, 우편번호, 주소, 전화번호, 팩스번호가 포함되어 있어 이용자가 기관의 위치와 연락처를 신속하고 정확하게 확인할 수 있습니다. 이는 기관 운영 관리, 민원 응대, 대외 협력 등 다양한 행정적 활용을 지원하기 위한 기초 자료로 활용될 수 있습니다.
