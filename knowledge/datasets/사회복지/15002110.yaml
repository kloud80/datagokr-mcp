summary_user: 광주광역시 노인일자리 및 사회활동지원사업을 수행하는 기관(시니어클럽·노인복지관·비영리법인 등)의 기관명·시군구·전화·팩스·도로명주소를 기관 한 곳당 한 행으로 담은 소규모 CSV 목록이다(약 7.7KB). 노인일자리에 참여하려는 어르신이나 가족이 '우리 구에서 노인일자리 신청을 받는 기관이 어디이고 연락처가 무엇인가'를 찾을 때, 또는 분석가가 시군구별 수행기관 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 시군구 이름, 도로명주소를 맞춰 연결해야 하며, 시군구 단위로 지역 통계와 잇거나 주소로 다른 노인복지시설 목록과 대조하는 식으로 쓴다.
description_portal: '○ 광주광역시 노인일자리 및 사회활동지원사업  수행기관 현황   - 운영기관 : (재)광주복지연구원, 시니어클럽, 노인복지관, 비영리법인 ·단체 등   - 사업목적 : 노인이 일자리와 사회활동을 통하여 활동적이고 생산적인 노후생활을 영위할 수 있도록 지원함으로써 노인의 건강과 복지를 증진하는 데 이바지   - 사업내용 : 노인을 위한 다양한 일자리 및 사회활동 지원   - 사업유형 : 노인공익활동사업(노노케어, 취약계층지원, 공공시설봉사, 경륜전수활동), 노인역량활용사업(보육시설지원, 청소년시설지원, 취약계층전문서비스, 안전관리지원, 시니어컨설턴트 등), 공동체사업단(식품제조 및 판매, 공산품제작 및 판매, 매장운영 등), 취업지원(취업알선형)'
