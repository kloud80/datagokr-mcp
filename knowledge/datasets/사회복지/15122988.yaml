summary_user: 경기도 시군별 장애인 복지시설의 입소정원수와 실제 생활자인원수를 시설유형별로 담은 집계 통계이며, 포털 설명상 매년 12월 말 기준으로 작성된다. 복지 정책 분석가나 지자체 담당자가 '우리 시군의 장애인 거주시설은 정원 대비 얼마나 차 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구명(signgu_nm)을 이름으로 맞추거나 같은 기관의 코드로만 다른 시군 단위 통계와 연결한다.
description_portal: 이 데이터는 시군구별 장애인 복지시설의 수용 능력과 실제 입소자 현황을 시설유형별로 제공하는 통계 자료로 매년 12월 말 기준 시군명, 장애인 관련 복지시설 유형별 입소정원수 및 생활자인원수를 제공합니다. ‘통계년월’은 통계가 집계된 시점을 나타내며, ‘시군구명’은 행정구역 명칭, ‘복지시설유형코드’는 복지시설의 기능에 따라 분류된 유형을 의미합니다. ‘입소정원수’는 각 시설이 수용할 수 있도록 정해진 최대 인원수를 의미하며, ‘생활자인원수’는 해당 시점 기준 실제로 입소하여 생활 중인 인원 수를 나타냅니다.
