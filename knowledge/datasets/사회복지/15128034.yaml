summary_user: 1992년부터 2024년까지 전국 어린이집 수를 연도별로 설치·운영 주체 유형(국공립·사회복지법인·단체·민간·가정·부모협동·직장)에 따라 집계한 전국 단위 통계 파일입니다. 정책 분석가나 연구자가 지난 30여 년간 국공립과 민간·가정 어린이집 비중이 어떻게 바뀌었는지 살펴볼 때 쓴다. 실측 컬럼에 어린이집코드 같은 전역 조인 키가 없어 개별 어린이집 데이터와는 연결되지 않고, 다른 연도별 통계와 '연도' 기준으로 나란히 비교하는 정도로만 이어 쓴다.
