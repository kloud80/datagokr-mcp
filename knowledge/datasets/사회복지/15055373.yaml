description_portal: 본 데이터는 여수시 내 차상위 계층의 복지 수급 현황을 파악하여 사회적 안전망 강화 및 지원 정책 수립의 기초 자료로 활용하기 위해 제작되었다. 자료는 매년 복지급여 대상 자격 재조사를 통해 수급권을 보유한 개인의 유형별 분포를 종합한 것으로, 행정기관 간 협업을 통해 정기적으로 갱신된다.주요 데이터 항목은 총 수급권자 수, 한부모가족, 차상위 본인부담경감대상자, 차상위계층 확인, 차상위장애인, 차상위자활 등 6개 유형으로 구분되어 있으며, 각 항목별 수급자 수를 순위 또는 점유율로 분석해 제공한다. 이를 통해 지역 내 복지 수요의 구조적 변화를 파악하고, 맞춤형 지원 정책 발굴에 기여할 것으로 기대된다. 또한 수급 대상의 균형적 배분과 중복 지원 방지를 위한 모니터링 자료로도 활용될 수 있을 것이다. 본 데이터는 보건복지부와 협업해 수집·정제한 공공정보로, 활용 시 출처 명시와 비영리 목적이 전제되어야 한다.
