description_portal: 해당 기준년도에 사학연금에서 퇴직 후 급여를 수령한 교직원의 급여종류(퇴직연금, 퇴직연금일시금, 퇴직일시금, 퇴직연금공제일시금 등)별 지급건수, 급여액 등 지급현황을 제공합니다. 이 데이터를 통해 공단의 연금 지급 투명성을 제고하고, 가입자 및 수급자들이 연금 지급 현황을 명확하게 이해할 수 있도록 돕습니다. 또한, 급여종류별 지급 현황 데이터를 통해 급여지급 동향을 파악함으로써 향후 재정추계 및 효율적인 기금운용에 활용 가능하며 관련 정책이나 예산 산정 시 참고 자료로도 활용할 수 있습니다. 본 데이터는 공공기관의 책임 있는 연금 운용을 입증하고, 이해관계자들이 공단의 재무 건전성을 명확히 파악할 수 있도록 지원합니다.
