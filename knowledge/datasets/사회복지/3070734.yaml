summary_user: 부산 영도구의 청소년 지원시설 3개소(청소년수련관, 청소년상담복지센터, 학교밖청소년지원시설)를 시설 한 곳당 한 행으로 담은 목록이며, 시설명·소재지·시설종류·공공/민간 구분·운영방법·운영주체·대표자·부지 및 연면적·전화번호가 들어 있다. 영도구 주민이나 보호자가 위기청소년 상담이나 학교밖 청소년 지원을 받을 수 있는 곳이 어디이고 누가 운영하는지 확인할 때 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 시설명이나 소재지 주소를 맞추거나 같은 기관(영도구) 기준으로만 잇는다.
description_portal: '영도구 청소년복지지원시설 3개소(활동에 관한 다양한 프로그램을 지원하는 함지골청소년수련관, 위기청소년 통합상담지원 및 맞춤형복지 지원을 하는 청소년상담복지센터:   청소년안전망 운영(청소년상담, 긴급구조, 자립, 의료지원 등 통합 지원 서비스를 제공하여 청소년의 건강한 성장 지원), 청소년동반자 프로그램 운영(청소년 상담전문가의 사례관리를 통한 정서적·심리적 지지 제공),지방상담사업 운영(청소년 및 보호자에 대한 지역자원 연계 및 상담),청소년관련기관 및 단체 간 협력체계 구축을 통한 지원연계 강화위기청소년 통합상담, 학교밖 청소년에 대한 상담, 급식지원 사업, 청소년의 꿈을 지원하기 위해 다양한 진로교육 프로그램을 추진하는 학교밖청소년지원시설)에 대한 데이터로 시설명,소재지, 시설종류, 운영방법, 운영주체, 대표자, 면적, 전화번호 등에 대한 상세설명입니다.'
