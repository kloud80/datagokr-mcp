description_portal: 서울시설공단의 서울시립승화원에서 운영중인 시립봉안시설의 최근 3개년 연도별 봉안 안치 통계자료입니다. 본 데이터는 일반(대인·소인), 행려(대·소인), 개장유골 등 봉안 유형별로 구분된 안치 건수를 연도별로 제공하며, 서울시립봉안시설의 이용현황과 수용 추이, 무연고 사망자 증가, 개장유골 안치 비율 등 다양한 사회적 흐름을 파악할 수 있습니다. 특히 해당 봉안시설은 2022년 4월 25일부터 만장으로 인해 신규 봉안 안치가 불가능한 상태이며, 이 통계는 기존 안치 또는 합골 안치의 운영 실태를 반영합니다.
