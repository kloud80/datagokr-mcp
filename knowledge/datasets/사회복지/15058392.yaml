summary_user: 경기도에서 장애인·거동불편 이용자에게 책을 집으로 배달하는 책나래 서비스를 제공하는 도서관을 도서관 한 곳당 한 행으로 담은 목록이며, 시군명·기관명·지번/도로명 주소·우편번호·위경도·전화번호·홈페이지를 포함한다. 장애인 가족이나 복지 담당자가 '우리 시군에서 책나래 배달을 신청할 수 있는 도서관이 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 시군별 제공 도서관 분포로 서비스 사각지대를 찾는 데 쓴다. 실측상 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 도서관명 매핑으로 다른 경기도 데이터와 잇고, 위경도 좌표로 지도·거리 분석에 겹쳐 쓴다.
description_portal: 이 데이터는 장애인과 거동이 불편한 이용자를 위해 책을 집으로 배달해주는 책나래 서비스 제공 도서관의 현황을 정리한 자료입니다. 주요 항목에는 시군명, 기관명, 소재지 지번주소와 도로명주소, 우편번호, WGS84 좌표(위도·경도), 전화번호, 홈페이지 URL이 포함되어 있으며, 각 도서관의 위치 및 접근 정보를 제공합니다. 해당 데이터는 도서관 서비스 접근성 강화, 취약계층 독서 지원, 문화 복지 확대 정책 수립 등에 활용될 수 있으며, 지역별 분포 현황을 분석하여 서비스 사각지대를 파악하는 데에도 유용합니다. 또한 공공도서관, 시립도서관, 구립도서관 등 다양한 운영 주체별 비교 분석 자료로 활용할 수 있습니다.
