summary_user: 전국 청소년 수련활동 신고프로그램과 수련시설 정보를 건별로 담는 API로, 활동명·프로그램 내용·참가 인원 구성·지도사 수·인증 및 고위험활동 여부와 시설의 주소·수용 인원·숙박 정원을 개별 주소 단위로 제공한다. 학부모나 학교 담당자가 특정 시도·시군구에서 인증받은 숙박형 수련활동이 어디서 어떤 규모로 열리는지 확인하거나, 분석가가 지역별 활동 참여 특성을 비교하는 데 쓴다. 운영기관의 사업자등록번호(brno)를 키로 사업자 정보와 잇고, 시도·시군구명으로 지역 통계와 연결한다.
description_portal: 청소년 활동 신고프로그램 및 수련시설 정보 서비스는 수련활동명, 인증여부, 시도명, 시군구명 조건을 기반으로 전국 청소년 수련활동 현황과 시설 정보를 조회할 수 있는 Open API입니다. 이 데이터는 활동 내용, 참가 규모, 지도사 구성, 이동 경로, 안전 관련 사항부터 수련시설의 위치, 수용 인원, 운영기관 정보 및 연도별 종합·분야별 평가등급까지 폭넓은 항목을 포함하고 있어 특정 지역의 청소년 활동 운영 실태와 시설 안전 수준 변화를 정량적으로 파악할 수 있습니다. 이를 통해 청소년 활동 프로그램의 질적 수준 분석, 지역별 활동 참여 특성 파악, 시설 안전관리 추세 이해, 인증제 운영 효과 분석 등 다양한 정책·연구 목적에 활용될 수 있습니다. 행정기관은 이를 기반으로 청소년 활동의 안전성 검증, 프로그램 인증제 운영 개선, 시설 관리 정책 수립, 지역별 수련활동 수요 분석 등을 수행할 수 있으며, 민간·연구기관은 청소년 활동 프로그램 개발, 청소년 참여행태 연구, 안전 모니터링 서비스 개발, 지역 간 수련시설 비교 분석 등에 활용할 수 있습니다.데이터 제공 형식은 JSON, XML 형식으로 제공됩니다.
