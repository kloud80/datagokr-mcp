summary_user: 대한노인회가 운영하는 노인일자리 사업의 모집 정보를 사업 건별로 담은 전국 단위 CSV 파일(약 443KB)로, 사업번호·사업연도·사업명·사업계획서 변경순번을 기록한다. 노인일자리 정책 담당자나 연구자가 '올해 대한노인회가 어떤 노인일자리 사업을 모집했고 연도별로 어떻게 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업명 같은 이름 매핑이나 같은 기관(한국노인인력개발원) 데이터의 사업번호로만 이을 수 있다.
description_portal: 이 데이터는 노인일자리 사업 중 대한노인회가 운영하는 모집 관련 정보를 제공하는 자료입니다. 사업번호, 사업명, 사업연도, 사업계획서 승인번호 등 주요 항목이 포함되어 있으며, 사회복지형, 공익활동형, 사회서비스형 등 다양한 노인일자리 사업의 모집 현황을 체계적으로 기록하고 있습니다. 이를 통해 노인회 중심의 일자리 참여 기회를 한눈에 파악할 수 있으며, 지역별·사업별로 어떤 모집이 이루어지고 있는지 비교·분석할 수 있습니다. CSV 형식으로 제공되어 데이터 가공과 분석이 용이하고, 정기적으로 갱신되어 최신 모집 정보를 반영하므로 기관 및 연구자, 정책 담당자가 사업 운영 현황과 수요 변화를 파악하는 데 유용한 자료입니다. 특히 노인 참여 확대와 지역사회 기반 일자리 창출 정책의 성과를 점검하는 근거 자료로 활용도가 높습니다.
