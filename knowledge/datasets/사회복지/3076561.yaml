description_portal: 장애인활동지원에 관한 법률 제21조(활동지원기관 정보의 안내)에 관한 데이터로서, 부산광역시 장애인활동지원기관 현황(기관명, 주소, 연락처 등)을 제공합니다.  활동지원 제공기관은 활동지원사와 이용자를 연계하여 활동지원수급자가 원활하게 서비스를 이용할 수 있도록 지원하고 있습니다.  장애인활동지원급여의 종류는 활동보조, 방문목욕, 방문간호가 있습니다.  장애인활동지원 사업은 신체적, 정신적 장애 등의 사유로 혼자서 일상생활과 사회생활을 하기 어려운 장애인에게 활동지원급여를 제공하여 장애인의 자립생활을 지원하고 그 가족의 부담을 줄임으로써 장애인의 삶의 질을 높이는 것을 목적으로 합니다.
