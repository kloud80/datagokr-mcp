summary_user: 아이돌봄통합지원 설문조사의 응답 건별 기록을 담으며, 한 건마다 설문연월·답변자 구분·작성 여부·센터코드·판정등급·돌봄구분·아동연령과 등록·수정일자가 들어 있고 범위는 전국이다. 아이돌봄서비스 정책 담당자나 분석가가 "판정등급이나 아동연령에 따라 이용하는 돌봄 방식이 어떻게 다르고, 설문은 얼마나 작성됐나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 데이터와는 센터코드(cntrCd)나 코드값 매핑처럼 같은 기관 코드 체계로만 연결할 수 있다.
description_portal: 아이돌봄통합지원 설문조사의 정보를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 수정일자, 설문연월, 답변자관리번호, 답변자구분코드, 작성여부, 센터코드, 판정등급코드, 돌봄구분 코드, 이동연령, 등록일자의 내용을 확인할 수 있습니다.서비스 대상자의 세부 특성과 서비스 제공 방식간의 상관관계를 분석하는 데 유용합니다. 이를 통해 수혜자의 다양성을 반영한 정책 보완이 가능해지며, 설문 작성 여부를 확인하여 데이터 완결성을 확보하는게 기여할 수 있습니다. 대상자 분석 및 지역별 정책 효율성 개선을 위한 기초자료로 활용될 수 있습니다.
