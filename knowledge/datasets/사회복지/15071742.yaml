description_portal: '○ 통계개요* 통계명 : 가계 자산 및 부채 현황(전가구 평균)* 통계종류 : 지정통계, 조사통계* 작성목적 : 가계의 자산, 부채, 소득 등의 규모, 구성 및 분포와 미시적 재무건전성을 파악하여사회 및 금융관련정책과 연구에 활용* 조사체계 : 조사원 → 지방통계청(사무소) → 통계청* 기준시섬 : 자산, 부채, 가구구성: 조사연도 3월 31일 현재소득, 지출, 원리금상환액: 전년도 1월1일~12월 31일(1년간)* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시, 전국내용 - 경상소득, 자산, 부채, 순자산액 등○ 용어설명* 근로소득 : 기본급, 각종 수당, 성과급, 보너스 등 세금공제 전 소득* 사업소득 : 제조업, 서비스업 등 사업수입(매출액, 판매수입 등)에서 사업지출(총비용)을 뺀 금액* 재산소득 : 금융소득(이자, 배당) 및 주택, 건물, 토지 임대수입, 개인연금, 퇴직연금 등* 이전소득 : 공적이전소득 - 국가나 지방자치단체에서 각종 법률에 의해 지급하는 공적 사회보장 수혜금사전이전소득 - 부모, 자녀, 형제, 친지 및 민간회사나 교회, 비영리단체로부터 정기적으로 받은 소득* 금융자산 : 저축, 펀드, 보장성 보험, 주식, 채권, 권리금, 빌려준 돈, 임차보증금 등* 실물자산 : 부동산, 자동차, 골프회원권, 귀금속, 골동품 등* 금융부채 : 담보대출, 신용대출, 신용카드 관련 대출 등* 순자산액 : 총자산 - 총부채○ 기 타* 조사단위는 가구(가구원)이나 취업, 학업 등으로 떨어져있는 가족(주말부부, 학기중 외지거주 학생등)은 포함하고,가족이 아니면서 함께 거주하는 가구원(가사사용인, 하숙인 등)은 제외* 실물자산은 시장가격으로 조사되며, 금액자료는 명목금액으로 작성됨* 동일가구를 장기간에 걸쳐 조사하는 연동패널조사이며, 다음년도 조사시 금년 조사결과와 확인과정을거쳐 보완될 수 있음* 통계표에 수록된 숫자는 반올림되었으므로 세목과 그 총계가 일치되지 않을 수 있음* 2018년부터 소득'
