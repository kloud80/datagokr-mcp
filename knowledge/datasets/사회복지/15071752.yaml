description_portal: 해당 데이터는 서울시 보육통계_어린이집 정원 현황(자치구,유형별) 정보입니다. 데이터는 통계연도, 자치구코드, 자치구명, 정원합계, 정원_국공립, 정원_사회복지법인, 정원_법인단체등, 정원_민간, 정원_가정, 정원_부모협동, 정원_직장으로 구성됩니다.이 데이터는 자치구별 보육시설의 정원 정보를 포함하고 있으며, 각 유형별 정원 수를 제공하여 보육시설의 수용 능력을 파악할 수 있습니다. 이를 통해 각 자치구의 보육 수요와 공급 현황을 분석하고, 보육 정책 수립에 중요한 기초 자료로 활용됩니다.※ 바로가기 클릭 시 열린데이터광장에서 개방된 데이터를 확인할 수 있습니다.
