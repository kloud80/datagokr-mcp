summary_user: 경기도 시군별 노인주거복지시설(양로시설, 노인공동생활가정)을 시설 한 곳당 한 행으로 담는다. 시설 종류, 주소, 연락처, 설치일, 설치·운영 주체 구분과 함께 입소정원과 입소현원(남녀, 기초수급·실비·기타별), 종사자 정원·현원을 포함한다. 예를 들어 분석가는 '우리 시군의 양로시설 정원 대비 실제 입소 인원은 얼마이고 가까운 시설은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없으므로, 다른 자료와 이을 때는 시군코드·시군명(SIGUN_CD)이나 정제 주소·WGS84 좌표로 직접 매핑해야 한다.
description_portal: 경기도 노인주거복지시설(양로시설, 공동생활가정) 현황 데이터는 노인의 안정적인 주거와 생활 지원을 목적으로 운영되는 복지시설 정보를 제공하며, 시군명, 시설종류, 시설명, 도로명 및 지번 주소, 우편번호, 전화번호, 팩스번호, 입소정원, 입소현원(남자·여자), 설치일자, WGS84 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 해당 데이터는 고령자의 생활 여건을 지원하는 시설 분포와 수용 규모를 파악하는 데 활용되며, 특히 입소정원과 실제 입소현원 비교를 통해 지역별 복지 수요 충족도를 평가할 수 있습니다. 또한 위치좌표가 제공되어 GIS 기반의 공간분석 및 복지 접근성 연구에 적합하며, 시설별 운영 특성과 설치 연도 분석을 통해 고령화 사회에 대응하는 정책 수립 자료로 활용 가능합니다.
