description_portal: 본 데이터는 인천광역시 미추홀구 관내에서 활동 중인 사회적기업 현황을 수록한 자료입니다. 총 33개 기업의 기관명, 사업분류, 유형, 주요 사업내용, 인증여부, 예비여부, 전화번호, 도로명주소와 지번주소, 홈페이지 주소, 위도와 경도 좌표가 포함되어 있습니다. 데이터에는 일자리제공형, 창의혁신형 등 다양한 유형의 사회적기업이 포함되어 있으며, 빈집 리모델링, 종이컵 생산, 목재 가구 제작, 농산물 가공·위탁판매, 대안교육 프로그램 운영 등 다양한 사회적 목적과 사업을 수행하고 있습니다. 특히 인증사회적기업과 예비사회적기업으로 구분되어 있어 행정기관에서는 사회적경제 지원정책 및 관리에 활용할 수 있고, 지역 주민들은 연락처와 주소를 통해 직접 기업에 접근할 수 있습니다. 이 자료는 사회적 가치 창출, 지역경제 활성화, 취약계층 고용 확대 등 다양한 사회적 목적 실현을 위한 기초 데이터로 제공되며, 정기적으로 갱신되어 최신 현황을 반영합니다.
