summary_user: 울산광역시 관내 노인요양시설을 시설 한 곳당 한 행으로 담은 파일로, 구군명·시설명·소재지·운영주체·연락처·정원·현원을 포함한다(약 4KB 규모의 CSV). 가족의 요양시설 입소를 알아보는 시민이 우리 구·군에 어떤 시설이 있고 정원 대비 현원이 얼마인지 확인하거나, 분석가가 구·군별 요양 정원 공급을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건강보험 장기요양기관 목록이나 사회복지시설 자료와는 시설명·주소를 맞춰 잇고, 지역 통계와는 구군명으로 연결한다.
