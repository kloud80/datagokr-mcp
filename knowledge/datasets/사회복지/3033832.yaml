summary_user: 남양주시 안에 있는 장애인복지시설을 한 곳씩 담은 시설 목록 파일로, 시설 구분·시설명·소재지주소·정원·전화번호와 데이터기준일을 기록한다. 남양주시에 사는 장애인 가족이 집 근처 이용 가능한 시설과 그 정원을 찾거나, 분석가가 시 안의 장애인복지시설 분포와 수용 규모를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 주소를 맞춰 잇거나, 주소를 좌표로 바꿔 지도·인구 자료와 겹쳐 쓴다.
description_portal: 남양주시 장애인복지시설 정보에 대한 데이터로 구분(장애인), 시설명, 소재지주소, 정원, 전화번호 등의 항목을 제공합니다.해당 데이터는 「장애인복지법」 및 관련 법령에 따라 장애인의 재활, 자립, 보호, 요양 등을 목적으로 설립 및 운영되는 다양한 장애인 복지시설의 위치, 종류, 규모, 제공 서비스 등에 대한 정보를 담고 있는 공공데이터입니다. 이 자료는 장애인 복지 서비스의 접근성을 높이고, 정부 및 지자체의 복지 정책 수립 및 평가에 필수적인 기반 정보를 제공합니다. 장애인복지시설은 장애인이 필요로 하는 서비스의 성격에 따라 다양하게 분류됩니다. 이 데이터는 복지 서비스 접근성 강화등에 활용가능합니다.
