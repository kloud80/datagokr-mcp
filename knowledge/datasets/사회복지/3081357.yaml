description_portal: 전북특별자치도 내에 설치 및 운영 중인 정신재활시설의 상세 현황 데이터입니다. 이 자료는 정신질환자의 사회복귀를 돕는 공동생활가정, 주간재활시설 등 다양한 시설의 목록을 담고 있으며, 각 시설의 명칭과 주소, 연락처, 운영 법인 정보를 포함합니다. 또한, 종사자 및 이용자(생활인)의 정원과 현원 정보를 구체적으로 제공하여 시설의 운영 규모와 현재 수용 현황을 정확히 파악할 수 있도록 돕습니다. 이 데이터는 정신건강 서비스가 필요한 당사자와 가족, 그리고 관련 전문가들에게 지역사회의 지원 체계를 안내하는 중요한 정보가 됩니다.
