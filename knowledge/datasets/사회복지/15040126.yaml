summary_user: 인천광역시 서해구(포털 설명상 인천 서구) 관내에서 운영 중인 요양원을 시설 한 곳당 한 행으로 담은 건별 목록이며, 시설명·소재지·전화번호·팩스번호로 구성된 약 9KB 크기의 CSV 파일입니다. 주민이나 보호자가 '우리 동네에 어떤 요양원이 있고 어디로 연락하면 되나'를 확인하거나, 분석가가 시군구 안의 요양시설 분포를 주소 단위로 파악할 때 쓴다. 전역 조인 키가 없어 건강보험 장기요양기관 목록이나 사회복지시설 정보와는 시설명·소재지 주소를 맞춰 연결해야 하며, 지역 통계와는 시군구 단위로 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 관내에서 운영 중인 요양원의 현황을 정리한 자료입니다. 본 자료는 시설명, 소재지, 전화번호, 팩스번호 등의 항목으로 구성이 되어있습니다. 본 데이터를 통해 노인 장기요양서비스 제공 긴관에 대한 정보를 주민에게 제공하여, 이용자들에게 요양시설 선택에 도움을 줄 수 있을것으로 판단이 되며, 또한 관련 행정업무의 효율성을 높일수 있다고도 판단이 됩니다. 또한 관련 복지정책 수립에도 기여할것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
