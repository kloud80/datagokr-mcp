summary_user: 전국 청소년 활동정보 운영기관 930곳을 기관 단위로 담은 현황 데이터로, 시도·시군구 구분, 기관명, 주소, 전화번호를 확인할 수 있다. 지자체 청소년 정책 담당자나 앱 개발자가 우리 지역에 청소년 활동 기관이 어디에 얼마나 있는지 찾는 질문에 쓴다. 주소(addr)가 실측 조인 키라서 주소 기반 지오코딩이나 지역 단위 통계와 이어 쓰며, 기관 고유번호 같은 별도 키는 확인되지 않는다.
description_portal: 청소년 활동정보 운영기관의 현황 정보를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 시도구분, 시군구구분, 기관명, 주소, 전화번호의 정보를 확인할 수 있습니다. 전국 단위의 청소년 관련 기관 분포를 체계적으로 파악할 수 있습니다. 시도 및 시군구 구분 정보를 기반으로 지역별 기관 밀집도나 서비스 격차를 시각화할 수 있으며, 주소 및 전화번호 항목은 외부 플랫폼에서 기관 연결 서비스나 방문 안내 기능으로도 연계할 수 있습니다. 특히 지역 특화 청소년 정책을 기획하거나 협력 거점 기관을 찾는 데 있어 핵심 기초자료로 활용될 수 있으며, 지도 기반 위치정보 서비스나 모바일 청소년 활동 앱에서도 기관 탐색 기능에 효과적으로 활용될 수 있습니다.
