summary_user: 경기도 내 지역아동센터를 시설 한 곳당 한 행으로 담은 목록으로, 시군명, 시설명, 시설정원, 전화번호, 도로명·지번 주소, 우편번호, 위도·경도 좌표가 들어 있다. 학부모가 우리 동네 가까운 지역아동센터와 정원을 찾거나, 분석가가 시군별 방과후 돌봄시설 분포와 정원 규모를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군명·시군코드(SIGUN_CD) 같은 이름·코드 매핑이나 주소·좌표를 이용한 공간 매칭으로 잇는다.
description_portal: '이 데이터는 경기도 내 지역 아동센터에 대한 정보를 제공하며, 각 센터의 시설명, 시군명, 전화번호, 시설정원, 주소(도로명 및 지번), 우편번호, 위도·경도 좌표 등의 세부 항목으로 구성되어 있습니다. 지역 아동센터는 방과 후 돌봄이 필요한 아동을 대상으로 보호, 급식, 학습, 정서 지원 등의 종합 서비스를 제공하는 복지시설로, 본 데이터는 시군 단위 복지자원 분포 현황을 파악하고, 복지정책 수립 및 지역사회 서비스 연계 구축에 활용될 수 있습니다. API는 XML 및 JSON 형식으로 제공되며, 데이터는 경기도 아동돌봄과에서 연간 주기로 갱신됩니다.- 지역 아동센터: 지역사회 내 취약계층 아동의 보호와 복지를 위해 방과 후 돌봄서비스, 학습지도, 문화체험 등을 제공하는 사회복지시설입니다. 아동복지법에 따라 지정되며, 공공 및 민간이 함께 운영할 수 있습니다.- 시설정원: 해당 아동센터가 수용할 수 있는 최대 인원을 의미하며, 아동의 안전한 보호와 효율적 운영을 위한 기준입니다.'
