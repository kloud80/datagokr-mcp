summary_user: 경기도 내 미혼모·모자가족 등 한부모가족복지시설을 시설 한 곳당 한 행으로 담은 목록이며, 시설구분·유형·시설명·전화번호·정원(세대/명)·도로명/지번 주소·우편번호·위경도 좌표를 담는다. 한부모 당사자나 지원기관이 '우리 시군 근처에 출산·양육 지원을 하는 한부모 시설이 어디에 있고 몇 세대를 받을 수 있나'를 확인하거나, 분석가가 지역별 시설 분포와 수용 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어, 다른 사회복지시설 데이터와는 시설명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 한부모가족복지시설 현황 데이터는 경기도 내 미혼모·모자가족 등 한부모가족을 대상으로 운영되는 복지시설 정보를 담고 있으며, 시설구분, 유형, 시설명, 소재지 주소(도로명·지번), 우편번호, 전화번호, 위도·경도 좌표, 정원(세대/명) 등의 항목으로 구성되어 있습니다. 본 데이터는 한부모가족을 위한 주거·양육·출산 지원 현황을 파악하고, 지역별 복지시설 분포와 수용 가능 규모를 분석하는 데 활용될 수 있습니다. 또한 시설유형별로 출산지원, 양육지원, 기본생활 지원 등 세부 지원 기능을 확인할 수 있어, 취약계층 맞춤형 복지정책 수립에 기초자료로 제공됩니다. 위치정보(WGS84 좌표)가 포함되어 있어 지도 기반 분석 및 접근성 평가에도 활용 가능하며, 한부모가족의 생활 안정과 자립 지원을 위한 사회복지 서비스 연구에 중요한 자료가 됩니다.
