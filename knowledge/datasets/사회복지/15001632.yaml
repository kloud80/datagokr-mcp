summary_user: 18세 이상 경증 등록장애인 중 기초생활수급자·차상위계층에게 지급하는 장애수당의 수급자 수를 연도·시도별로 집계한 파일로, 포털 설명상 2018~2024년을 다루며 생계·의료급여 수급자(일반·시설)와 차상위 및 교육·주거급여 수급자로 나눠 담는다. 지역 복지 분석가나 지자체 담당자가 '우리 시도의 저소득 경증장애인 장애수당 수급자는 해마다 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시도 이름과 연도를 맞춰 장애인연금 수급자 현황이나 시도별 등록장애인 통계와 이어 쓴다.
description_portal: 보건복지부의 장애수당 수급자 현황 자료로 2018년부터 2024년까지 기초생활보장 생계급여/의료급여 수급자, 차상위 및 기초생활보장 교육/주거급여 수급자 현황 데이터를 시도별로 제공하고 있습니다.<데이터 이용 시 참고사항>1. 18세 이상 등록장애인 중 중증장애인에 해당하지 않는 기초생활수급자 및 차상위계층에 대하여 장애수당을 지급하고 있습니다.2. 중증장애인의 경우 장애인연금 수급으로 지급하고 있습니다.2. 2010년 7월부터 경증장애인만 장애수당을 지급하고 있습니다.
