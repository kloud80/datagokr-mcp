summary_user: 제주특별자치도에 있는 아동양육시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·소재지·아동 정원과 현원·종사자 수·설치일·연락처를 포함한다(파일 크기 537바이트의 소규모 목록). 보호가 필요한 아동의 입소 시설을 찾는 보호자·담당 공무원이나, 제주 시설별 정원 대비 현원 수준을 살피려는 분석가가 "제주에서 아동양육시설은 어디에 있고 얼마나 차 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지 주소를 맞춰 잇거나 사회복지시설 공통 마스터를 참조해 연결한다.
