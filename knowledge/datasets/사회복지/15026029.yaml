description_portal: '부산광역시 북구 관내에 존재하는 아동복지시설 현황 데이터로 시설명, 신고일, 시설장, 운영주체, 정원, 전화번호 , 주소 등의 항목을 제공하고 있습니다. 지역아동센터 : 돌봄이 필요한 아동·청소년에게 다양한 프로그램을 통해 정서적 안정 및 건강한 신체, 인지, 사회성 발달의 기회 제공 등 종합적인 복지서비스를 제공하는 아동복지시설 자립지원시설 :아동복지시설에서 퇴소한 사람에게 취업준비기간 또는 취업 후 일정 기간 동안 보호함으로써 자립을 지원하는 것을 목적으로 하는 시설 그룹홈 :보호대상아동에게 가정과 같은 주거여건과 보호, 양육, 자립지원 서비스를 제공하는 것을 목적으로 하는 시설 다함께돌봄센터 : 초등학교 정규교육 이외의 시간 동안 돌봄서비스를 제공하기 위해 시·도지사 및 시장·군수·구청장이 설치·운영하는 시설 (「아동복지법」제44조의2제1항)로, 사회복지사업법 제2조에 따라 “사회복지사업”을 행할 목적으로 설치된 사회복지시설임'
