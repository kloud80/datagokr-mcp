summary_user: 부산광역시 북구 관내 아동복지시설(지역아동센터·그룹홈·자립지원시설·다함께돌봄센터 등)을 시설 한 곳당 한 행으로 담은 파일로, 시설명·시설종류·소재지·위도·경도·정원·현원·종사자·설치일자·전화번호를 포함한다. 북구 주민이나 보호자가 집 근처에 정원 여유가 있는 지역아동센터나 다함께돌봄센터가 어디인지 찾거나, 분석가가 북구 내 아동 돌봄시설의 분포와 정원 대비 현원을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소로 매칭하거나 위도·경도로 공간 결합해야 하며, 사회복지시설 공통 마스터를 참조할 때도 같은 방식으로 맞춘다.
limits: 부산 북구 한 개 시군구만 다루므로 다른 구나 부산 전체 비교에는 다른 구군 데이터를 따로 모아야 한다. 고유 시설 코드가 없어 다른 시설 목록과 이을 때 이름·주소 표기 차이로 매칭이 어긋날 수 있다.
