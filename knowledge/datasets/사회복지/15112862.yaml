description_portal: 본 데이터는 인천광역시 부평구에 거주하며 등록된 장애인 인구 현황을 상세히 제공하는 통계 자료입니다. 부평구 내 행정동별로 분류된 동별구분을 기초로 하며, 장애 정도에 따른 장애구분뿐만 아니라 장애 유형별 상세 현황을 포함하고 있습니다. 구체적인 항목으로는 지체, 시각, 청각, 언어, 지적, 뇌병변, 자폐성, 정신, 신장, 심장, 호흡기, 간 장애 등 법정 장애 유형 전반에 걸친 등록 인구수를 수록하고 있습니다.본 자료는 부평구의 지역별·유형별 장애인 인구 분포를 정밀하게 파악할 수 있는 기초 자료로서, 장애인 복지 시설의 확충, 맞춤형 활동 지원 서비스 설계, 교통 약자를 위한 편의 시설 우선 설치 등 데이터 기반의 복지 행정을 수립하는 데 필수적입니다. 또한 민간 부문에서는 장애인 보조기기 개발, 맞춤형 정보 서비스 제공 등 교통 약자의 편의 증진을 위한 연구 및 서비스 기획 자료로 광범위하게 활용될 수 있습니다.
