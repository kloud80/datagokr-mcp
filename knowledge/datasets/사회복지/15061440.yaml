description_portal: '한국사회보장정보원에서 1년 주기로 제공하는 통계자료로, 특성별(성별, 연령대), 지역별, 월별로 구분한 후 다시 장애등급별로 구분한 차상위장애아동수당 수급자 수에 대한 정보를 담고 있습니다.   데이터구성항목은 성별별, 연령대별, 지역별, 월별로 장애등급(1~6급)에 따른 차상위장애아동수당 수급자수 항목으로 구성되어 있습니다.   공공데이터 추출 기준은 o 사회보장정보시스템(행복e음)에 등록된 차상위장애아동수당 수급자를 6월 말 기준으로 집계* 장애등급 : 의학적 상태에 따라 1급부터 6급까지 세부등급을 부여하며 장애인등급제 폐지에 따라 "19년 6월까지만 등급으로 구분해 집계   차상위장애아동수당 수급자에 대해 성별별, 연령대별, 지역별 분포를 확인하거나 지역별 비교, 또는 월별 변화 추이를 확인하고자 할 때 활용하실 수 있습니다.'
