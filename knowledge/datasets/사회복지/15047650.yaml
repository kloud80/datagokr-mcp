description_portal: '제공부서 : 생활복지과노숙인 등의 복지 및 자립지원에 관한 법률에 따라 전주내에 시설 소재지를 두고 있는 노숙인복지시설의 (시설명, 주소, 전화번호, 수용능력, 상세위치 등) 정보를 제공하고 있는 데이터 입니다.노숙인 생활시설은 지역 사회와 협력하여 지속 가능한 자립을 돕는 다양한 프로그램을 운영하고 있습니다. 필요하신 경우, 해당 시설이나 지원 기관에 문의하여 자세한 정보를 얻으시기 바랍니다.본 자료는 노숙인 복지서비스 접근성 향상,복지시설 운영의 효율성 제고, 취약계층 지원 정책의 객관적 근거 마련, 지역 복지 인프라 현황의 체계적 관리,  시민과 관계기관의 시설 정보 이용 편의성 증대를 위해 활용할 수 있습니다.'
