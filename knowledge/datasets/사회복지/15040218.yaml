summary_user: 서울 강동구 관내 키즈카페·장난감 도서관 등 영유아복지시설을 시설 한 곳당 한 행으로 담은 작은 파일(CSV 약 6.5KB)로, 시설명·행정동·도로명/지번 주소·수용인원·설립연도·전화번호·홈페이지를 포함한다. 강동구에 사는 영유아 부모가 '우리 동네에서 아이와 갈 수 있는 장난감 도서관이나 공공 키즈카페가 어디 있고 몇 명까지 받나'를 찾거나, 분석가가 행정동별 시설 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(지오코딩)나 행정동 이름, 시설명 매칭으로만 이어 쓰며, 사회복지시설 공통 마스터를 참조할 때도 이름·주소 대조가 필요하다.
limits: 강동구 한 개 시군구만 다루므로 다른 구나 서울 전체와 비교하려면 각 자치구 자료를 따로 모아야 한다. 시설 코드 같은 공통 키가 없어 다른 시설 데이터와 결합할 때 이름·주소 매칭 오류에 주의해야 한다.
