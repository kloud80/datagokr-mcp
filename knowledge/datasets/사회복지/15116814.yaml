description_portal: '경상남도 창원시 여성가족과에서 관리중인 여성안심택배함(7개소-의창구1, 성산구2, 마산합포구2, 마산회원구1,  진해구1)의 2021년, 2022년 이용건수 입니다.( 여성안심택배함이란 ? ) ­집에서 택배를 받기 어려운 여성 또는 1인 가구원들이 무인택배함을 통해 원하는 장소에서 안전하게 택배를 수령할 수 있는 서비스(2017. 6월부터 시행 중) ○ 이용목적 : 여성이 택배 수령 시, 택배기사 비대면으로 범죄 예방 및 생활 편의 제공 ○ 이용대상 : 시민 누구나 이용 가능  ○ 이용시간 : 연중무휴, 24시간 운영 ○ 이용요금 : 48시간 무료(단, 48시간 초과 시 24시간마다 1천원 요금 부과) ○ 이용절차   ­  1.  이  용  자 : 주문시 택배수령지를 안심택배함으로 신청       2.  택배기사 : 물품보관, 기사 수령자 연락처 입력    3.  관리업체 : 택배정보 SMS전송, 모니터링    4.  수  령  자 : 보관소 방문 정보 입력, 물품수령'
