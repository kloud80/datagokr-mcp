summary_user: 청소년 자기도전포상제 참가자의 활동 한 건마다 운영기관·광역시도 중앙시설, 활동 상태, 심사비용 결제, 포상심사 신청·결과, 포상감독관 확인 일시를 담은 전국 단위 건별 원천 데이터다. 운영기관이나 분석가가 기관별로 포상심사 신청에서 결과까지 얼마나 걸리는지, 감독관 확인과 재심이 어떻게 이뤄지는지를 점검하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 운영기관명·시설명 매핑으로만 잇고, 데이터 안에서는 이전활동일련번호(bfrActvSn)로 같은 참가자의 앞선 활동을 이어 활동 연속성을 본다.
limits: 다른 데이터셋과 공통 코드로 바로 조인할 수 없어 기관명 문자열 매핑에 기대야 한다. 위치 정보가 없는 비공간 데이터라 시군구 단위 지도 분석에는 그대로 쓰지 못한다. 갱신 주기는 이벤트 단위로 분류돼 있어 정기 갱신을 전제로 시계열을 구성하면 안 된다.
