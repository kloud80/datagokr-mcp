summary_user: 인천광역시 군·구별로 결식 우려 아동 급식지원 아동 수를 연도 단위로 집계한 파일(csv, 약 1KB)로, 지원방법(도시락·전자카드·단체급식 등), 교육과정(미취학~고등학교), 지원사유(수급자·차상위, 법정한부모, 보호자부재 등)별 인원을 담는다. 지역 복지 담당자나 분석가가 '인천 어느 구에서 결식아동 급식지원이 많고, 주로 어떤 방식과 사유로 지원되는가'를 비교할 때 쓴다. 전역 조인 키는 없어 군구명과 연도를 기준으로 다른 시군구 단위 취약계층·인구 통계와 이름을 맞춰 연결한다.
description_portal: 인천광역시 자치구별 결식아동 급식지원 현황 공공데이터는 지역 내 결식 우려가 있는 아동들을 대상으로 제공되는 급식 지원 실적을 군·구별로 집계한 자료입니다. 이 데이터는 아동 복지 증진과 사회 안전망 강화를 위해 마련된 것으로, 각 자치구별 지원 규모와 대상 아동 수를 확인할 수 있습니다.- 교육과정별, 지원방법별, 지원사유별 아동 수 제공하고 있습니다.이 자료는 저소득층 아동의 건강한 성장 지원, 지역별 복지 격차 분석, 정책 개선 및 예산 집행의 투명성을 확보하는 데 중요한 기초 자료로 활용됩니다.
