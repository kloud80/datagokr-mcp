description_portal: 경기도 수원시 영통구 각 행정복지센터에서 한 마을 만들기 프로그램과 내용을 포함한 데이터입니다. 내가 사는 동네에서 어떤 활동이 있었는지 쉽게 알 수 있고, 관심 있는 주민이 다음 활동에 자발적으로 참여할 기회가 늘어날 수 있습니다. 다른 마을 사례를 참고해서 새로운 아이디어를 얻어 벤치마킹이 가능하며 동네별로 특색있는 프로그램이 공유되면서 주민의 자긍심이 고취될 수 있습니다. 마을만들기의 프로그램 내용을 비교 분석하여 개선 방안을 마련하는데 활용할 수 있습니다. 또한 언론이나 시민단체에서 마을만들기 성과를 분석해 홍보 및 확산에 활용할 수 있습니다.
