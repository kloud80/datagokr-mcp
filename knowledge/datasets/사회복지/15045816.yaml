summary_user: 사학연금 퇴직연금수급자 수를 연령(50세 미만~90세 이상, 1세 단위) 행과 재직기간(21년 미만~33년 이상) 열로 교차 집계한 전국 단위 통계표로, 건별 원천이 아닌 집계 파일(CSV, 약 2.5KB)이다. 연금 분석가나 정책 담당자가 '재직 33년 이상 퇴직연금수급자는 어느 연령대에 몰려 있는가'처럼 수급자의 연령·재직기간 분포와 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연령·재직기간 구간 이름을 맞추거나 같은 기관의 다른 사학연금 통계표와 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 사립학교교직원연금공단 사학연금수급자 현황 (재직기간별, 연령별 퇴직연금수급자) 데이터는 연금수급자 중 퇴직연금을 받는 수급자들의 수를 재직기간별(21년미만 ~ 33년 이상) 연령(50세 미만~90세 이상) 항목으로 구분하여 집계하여 제공합니다. 재직기간은 수급자가 재직당시 근무한 기간을 의미하며, 연령은 50세 미만부터 90세 이상으로 1세씩 증가하는 추이로 나누어 집계되었습니다.해당 데이터는 연금 수급자 추이 파악 및 제도 개선을 위한 기초 자료로 활용될 수 있습니다.이 데이터를 통해 사학연금제도의 운영 현황을 투명하게 공개하고, 연금 수급자에 대한 정확한 이해를 돕고자 합니다.
