description_portal: 광주광역시 동구민을 대상으로 한 건강요구도 조사 결과 데이터는 지역 주민들의 전반적인 건강 인식과 삶의 질 수준을 수치화해 정리한 자료로, 2020년과 2021년 두 해에 걸쳐 동별로 비교할 수 있도록 구성되어 있습니다. 이 데이터는 주민 스스로 느끼는 건강 수준뿐 아니라, 가족·마을·지역사회에 대한 건강 인식까지 폭넓게 조사한 결과를 담고 있어 동구의 보건 정책과 지역 건강증진 사업을 설계하는 데 중요한 근거 자료로 활용됩니다.자료에는 삶의 질 인식, 마을 건강수준 인식, 본인 건강수준 인식, 가족 건강수준 인식 등을 포함해 총 31개 조사 항목에 대한 점수가 수록되어 있습니다. 이를 통해 각 동별 주민들이 얼마나 건강하다고 느끼는지, 주변 환경이 건강에 도움이 되는지, 본인과 가족의 건강 상태를 어떻게 평가하는지 등 다양한 관점의 건강 요구도를 세밀하게 파악할 수 있습니다.연도별 비교가 가능하기 때문에, 특정 건강 영역의 개선 여부나 악화 흐름을 확인할 수 있으며, 동별 차이를 분석해 어느 지역에서 건강격차가 존재하는지도 판단할 수 있습니다. 이 데이터는 향후 보건소 사업 우선순위 설정, 건강 취약지역 선정, 주민참여 건강 프로그램 기획 등 동구의 지역 맞춤형 공공보건 전략 수립에 매우 유용한 기초 자료라고 할 수 있습니다.
