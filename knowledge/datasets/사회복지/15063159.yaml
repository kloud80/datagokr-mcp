description_portal: '"아이돌봄서비스 이용시 요금표에 대한 정보를 제공하는 파일형 개방 데이터입니다.해당 개방 데이터는 아동인원, 돌봄구분, 소득유형, 이용시간, 30분당 이용요금, 정부지원금, 본인부담금의 내용을 확인할 수 있습니다.아동 수, 돌봄 유형, 소득유형 등 다양한 조건에 따른 이용 요금 구조를 한눈에 파악할 수 있도록 돕습니다. 30분당 요금과 정부지원금, 본인부담금이 함께 제공되어 실제 부담 수준을 실질적으로 분석할 수 있습니다. 이 데이터는 요금 책정의 합리성 검토와 이용자 중심의 가격 정책 수립에 기초 자료로 활용됩니다. 서비스 접근성 향상과 수요 기반 요금 정책 개발에 활용될 수 있습니다."'
