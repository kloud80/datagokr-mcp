summary_user: 충청남도 내 경로당을 시설 한 곳당 한 건으로 담으며, 시설명·종류·전화번호·주소와 법정 읍면동명, 제공기관명, 기준일자를 포함한다. 노인 주민이나 가족이 '우리 동네(읍면동)에 있는 경로당은 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 충남 시군·읍면동별 경로당 분포를 살펴볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·읍면동명(STTY_EMD_NM)이나 시설명 매핑으로 이어 쓰며, 같은 부문의 노인복지시설·장기요양기관 데이터나 시군구·시도 단위 지역 통계와 붙일 때도 이 방식을 쓴다.
