description_portal: 보건복지부에서 관리하는 보건복지현황 중 2015년~2024년까지 시도별 아동학대 발생현황(시도구분, 년도, 아동학대유형_중복학대, 아동학대유형_신체학대, 아동학대유형_정서학대, 등)에 대한 정보를 제공 합니다.<통계 이용 시 주의사항>○아동학대 신고･접수 건 중 일반상담 건수를 제외한 사례 중 아동학대로 판정되어 보호된 사례를 아동학대 발생 현황으로 보고○아동학대 발생 건수는 해마다 신고율이 증가하여 학대피해아동이 늘어나는 현상을 보이는 것으로 실제 학대가 증가했다고 볼 수는 없음○아동：18세 미만의 사람○아동학대：보호자를 포함한 성인이 아동의 건강 또는 복지를 해치거나 정상적 발달을 저해할 수 있는 신체적･정신적･성적 폭력이나 가혹행위를 하는 것과 아동의 보호자가 아동을 유기하거나 방임하는 것을 말함○신체학대：보호자를 포함한 성인이 아동에게 우발적인 사고가 아닌 상황에서 의도적으로 행하는 신체적 폭력 또는 가혹행위○정서학대：보호자를 포함한 성인이 아동에게 행하는 언어적 모욕, 정서적 위협, 감금이나 억제, 기타 가학적인 행위를 하는 것○성학대：보호자를 포함한 성인이 자신의 성적 욕구 충족을 목적으로 아동과 함께하는 모든 행위○방임：고의적, 반복적으로 아동양육과 보호를 소홀히 함으로써 정상적인 발달을 저해하는 모든 행위○유기：보호자로부터 보호를 받아야 하는 아동을 버리는 행위(2012년부터 유기를 방임에 포함)
