summary_user: 서울 강북구에 있는 노인교실을 시설 한 곳당 한 행으로 담은 원천 목록입니다. 노인교실명, 소재지 주소, 전화번호, 운영 강좌, 데이터기준일이 들어 있고 내려받은 CSV 파일 크기는 약 2KB입니다. 강북구 어르신이나 가족이 '집 근처에서 서예나 요가 강좌를 여는 노인교실이 어디이고 연락처는 무엇인가'를 찾을 때 씁니다. 전역 조인 키가 없어 다른 노인복지시설 목록이나 장기요양기관 자료와는 시설명과 소재지 주소를 맞춰 이어야 하며, 지역 통계와는 강북구라는 시군구 단위로만 연결됩니다.
description_portal: 노인교실은 노인들의 복지증진을 위하여 지역 어르신들을 대상으로 한 교양강좌, 글짓기, 요가, 가요, 생활체조, 장고, 바둑, 영어, 서예, 레크레이션 등 프로그램을 운영중인 곳으로 60세 이상(노인)을 대상으로 사회활동 참여욕구를 충족시키기 위하여 건전한 취미생활·노인건강유지·소득보장 기타 일상생활과 관련한 학습프로그램을 제공하는 것을 목적으로 하는 시설에 대한 정보입니다.서울특별시 강북구 노인교실 현황 데이터는 연번, 노인교실명 자료, 소재지 자료, 전화번호 자료, 강좌 자료, 데이터기준일로 구성되어 있습니다
