summary_user: 인천광역시 미추홀구 안의 장애인 복지시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 5.8KB)로, 시설 유형·종류, 기관명, 도로명주소, 근무자 수, 이용정원·이용현원, 설치신고일, 전화번호, 위도·경도를 포함한다. 장애인 당사자나 보호자가 "우리 동네 가까운 장애인 시설은 어디이고 정원 대비 자리가 남아 있는가"를 확인하거나, 분석가가 구내 시설 분포와 규모를 지도로 보는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 기관명·주소로 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 내 장애인 복지시설의 현황을 제공하는 공공데이터입니다.시설의 유형 및 종류 정보를 통해 장애인 대상 복지서비스의 제공 형태를 확인할 수 있습니다. 기관명과 도로명주소를 포함하여 시설의 위치를 정확히 파악할 수 있습니다. 근무자 수, 이용정원, 이용현원 데이터를 통해 시설 규모와 운영 현황을 분석할 수 있습니다. 시설장 정보를 제공하여 민원 및 서비스 관련 문의의 연결이 가능합니다. 설치신고일 정보를 통해 시설 운영 기간 및 설립 이력을 파악할 수 있습니다. 전화번호가 포함되어 있어 복지 서비스 이용자 및 보호자의 접근성을 높일 수 있습니다. 위도 및 경도 정보를 통해 위치 기반 분석 및 지도 시각화에 활용할 수 있습니다.
