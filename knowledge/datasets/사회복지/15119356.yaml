summary_user: 대전광역시 중구에서 65세 이상 어르신 대상 노인일자리 사업을 수행하는 기관의 명칭·도로명 소재지·전화번호를 기관별로 담은 소규모 목록(CSV 742바이트)입니다. 중구 주민이나 보호자가 근처 노인일자리 수행기관이 어디이고 어디로 문의하면 되는지 찾을 때 쓰고, 지역 노인복지 기반을 정리하는 분석가도 참고 자료로 쓴다. 전역 조인 키가 없어 다른 노인복지시설 목록이나 장기요양기관 자료와는 기관명·도로명 주소를 맞춰 붙여야 한다.
description_portal: 본 공공데이터는 대전광역시 중구에서 65세 이상 어르신을 위해 노인 일자리를 수행하고 있는 기관의 명칭, 소재지, 전화번호에 관한 자료입니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.데이터 기준일과 데이터 활용일간 차이로 인해 실제 현황과 다를 수 있으니 참고하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 소재지는 해당 노인일자리 수행기관의 도로명 주소를 기준으로 작성되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
