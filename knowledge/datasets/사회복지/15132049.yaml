description_portal: 본 데이터는 대구광역시 서구청에서 운영하는 생활공구 대여 서비스 현황을 정리한 자료이다. 서구 관내 각 동 행정복지센터에서 제공하는 공구의 품목, 수량, 규격, 단위, 비고 및 데이터 기준일자를 포함하고 있으며, 주민의 생활 편의 증진 및 공공 자원의 효율적 활용을 목적으로 한다. 제공되는 공구는 전기대패, 건타카, 가정용공구함 등 일상 생활에서 활용도가 높은 품목으로 구성되어 있으며, 동별로 보유 현황이 다르게 나타난다. 본 데이터는 공공 물품 공유 및 지역 내 자원 순환을 장려하고자 개방되며, 주민들이 원하는 품목의 대여 가능 여부를 사전에 확인할 수 있도록 정보를 투명하게 제공한다. 데이터는 정기적으로 갱신되며, 생활밀착형 공공서비스의 기초 자료로 활용된다.
