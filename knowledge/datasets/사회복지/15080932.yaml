summary_user: 보령시 경로당을 한 곳씩 시설명, 종류(INST_TYPE), 전화번호, 소재지 주소로 담은 시설 목록으로, 범위는 보령시 한 시군구이고 개별 시설 단위입니다. 보령시 주민이나 노인복지 분석가가 '우리 동네 가까운 경로당은 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 시설명이나 주소를 맞춰 잇거나 같은 기관 코드로만 연결한다.
limits: 실측 컬럼에 표준 시설코드 같은 전역 조인 키가 없어 다른 데이터와 정확히 묶으려면 이름·주소 매칭이 필요하다. 이용 인원이나 운영 실적 같은 내용은 없고 보령시 밖의 경로당은 담지 않는다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하며 개발계정은 하루 8,000회로 제한된다.
