summary_user: 아이돌봄 제공기관별·기준연월별로 전체·웹·승인대기·정회원·정기정회원·대기정회원·휴면·신규 회원 수와 신규 아동 수를 담은 전국 단위 집계 데이터입니다. 지자체 담당자나 분석가가 '어느 기관에 대기 정회원이 몰려 있고 신규 가입이 늘고 있는가'를 보고 돌보미 인력 배치나 홍보 효과를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 기관명(childCareInstNm)·상위기관 이름이나 같은 기관의 기관번호로만 다른 아이돌봄 데이터와 맞춰 쓴다.
description_portal: 아이돌봄 회원현황 정보 서비스를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 기준연월, 아이돌봄기관명, 전체회원수, 웹회원수, 승인대기회원수, 정회원수, 정기정회원수, 대기정회원수, 휴면회원수, 신규회원수, 신규아동수 등의 내용을 확인할 수 있습니다. 지역별 또는 기관별 회원 유형의 구성 현황을 파악함으로써, 아이돌봄 서비스 운영 실태를 분석하는 데 도움이 됩니다. 특히 정회원, 대기회원 등의 세부 분류 정보를 통해 서비스 수요 예측과 인력 운영 계획 수립에 활용할 수 있습니다. 더불어 신규회원 및 신규아동 수 변화 추이를 비교 분석하면 홍보나 지원정책의 효과도 확인 가능하며, 정책 개선 및 맞춤형 서비스 전략 수립에 활용될 수 있습니다.
