summary_user: 공무원연금공단 퇴직연금 수급자 수를 현재 연령 구간(38세 미만부터 고령층까지)별 행(구분)과 정무직·일반직·경찰·소방·교육직·군무원 등 직종별 열로 교차 집계한 전국 단위 표이며, 건별 원천이 아닌 집계 파일(csv 약 3KB)이다. 분석가나 연금 정책 담당자가 '경찰·소방 등 특정 직종의 퇴직연금 수급자는 어느 연령대에 몰려 있는가'처럼 직종별 수급자 연령 분포와 고령화 정도를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 직종명·연령 구간 이름을 맞추거나 같은 기관의 다른 공무원연금 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 공무원연금공단에서 제공하는 직종별·연령별 퇴직연금수급자 현황(현재 연령 기준) 데이터입니다. 본 자료는 퇴직연금 수급자의 현재 연령을 기준으로 38세 미만부터 고령층까지 구분하고, 정무직, 별정직, 일반직, 경찰, 소방, 교육직, 법관·검사, 기능직, 고용직, 공안직, 군무원, 연구직, 지도직, 계약직, 기타(우정직, 외무직, 청원경찰, 전문경력관 등) 등 주요 직종별 수급자 규모를 제공합니다. 해당 데이터는 특정 직종의 연령 분포를 종합적으로 분석할 수 있어, 직군별 고령화 추세, 청·장년층 퇴직연금 수급자 비율, 직종별 퇴직 특성 등을 파악하는 데 유용합니다.
