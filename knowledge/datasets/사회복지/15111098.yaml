description_portal: 대전광역시 아동보호전문기관 자료는 지역 내 아동학대 예방과 피해아동 보호, 긍정적 양육 환경 조성을 위해 운영되는 3개 아동보호전문기관(대전광역시아동보호전문기관, 대전서부아동보호전문기관, 대전북부아동보호전문기관)의 현황을 제공합니다. 각 기관은 아동복지법 제45조에 근거하여 설치·운영되며, 피해아동 및 가족, 학대행위자 상담과 치료, 아동학대 예방사업, 아동권리교육, 현장조사 및 사례관리 등 다양한 업무를 수행합니다. 기관 별 명칭, 소재지, 위탁 법인 등의 정보가 포함되어 있습니다. 상담 사업은 아동 및 가족 대상 심층상담, 치료보호사업은 학대피해아동 및 학대행위자 치료, 예방사업은 아동권리옹호 및 지역사회 교육 등으로 구성됩니다.
