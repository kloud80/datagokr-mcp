summary_user: 한국영유아보육교육진흥원이 2007년부터 교부한 어린이집 원장 자격증 수를 연도별 한 행씩, 일반·40인 미만·가정·영아전담·장애아전문 다섯 유형별 열로 정리한 전국 단위 집계표(CSV 약 628바이트)를 담는다. 보육 정책 분석가나 연구자가 "원장 자격증 교부가 해마다 어떻게 변했고 어떤 유형이 늘거나 줄었는가"를 보는 데 쓴다. 실측 컬럼에 어린이집코드 같은 전역 조인 키가 없으므로, 다른 데이터와는 연도(구분)를 기준으로 연도별 보육 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 한국영유아보육·교육진흥원이 2007년부터 2026년 6월말까지 어린이집 원장 자격증을 교부한 연도별 현황을 정리한 통계 자료입니다. 자격증은 일반형, 40인 미만 어린이집 전용형, 가정 어린이집형, 영아전담형, 장애아전문형으로 구분되며, 각 유형별로 매년 교부된 자격증 수가 INT 형식으로 제공됩니다. 데이터는 연도별로 행 구분되고, 자격 유형별 수치가 열에 배치된 구조로 되어 있어 유형 간 비교 및 시계열 분석이 가능한 형식을 갖추고 있습니다. 주요 컬럼은 연도, 일반형, 40인 미만형, 가정형, 영아전담형, 장애아전문형 등으로 구성되어 있으며, 정량적 자격 교부 실적을 표 형식으로 제시한 집계형 데이터입니다.
