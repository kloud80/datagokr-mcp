description_portal: 서울글로벌센터 상담유형별(분기) 상담실적 데이터는 연도별로 상담유형(기관/유형)에 따른 분기별 상담 실적을 집계한 통계자료입니다. 각 상담유형에 대해 1분기부터 4분기까지의 실적과 해당 분기가 연간 실적에서 차지하는 비율을 함께 제공하여, 어느 시기에 상담 수요가 집중되는지 파악할 수 있습니다. 또한 해당 연도와 이전 연도의 실적 및 비율을 함께 제시함으로써, 상담 실적의 연도 간 증감 추이와 변화 양상을 비교·분석하는 데 활용할 수 있는 데이터입니다. 나아가 특정 연도나 분기별 정책·사업 시행 효과를 정량적으로 평가하고, 향후 상담 인력 및 예산 배분 계획 수립의 근거 자료로 활용할 수 있는 중요한 통계입니다.
