summary_user: 충청남도 안의 노인복지시설을 시설 한 곳씩 담은 건별 목록으로, 시설 구분·건물(시설)명·상세주소·전화번호·제공기관명·기준일자를 담는다. 충남에 사는 가족이나 사회복지 분석가가 "우리 시군 근처에 어떤 노인복지시설이 있고 연락처는 무엇인가"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 같은 기관 코드로만 잇는다. 이렇게 맞춘 뒤 건강보험 장기요양기관 목록이나 시군구 단위 지역 통계와 함께 본다.
description_portal: 시설명, 시설상세주소, 전화번호 등의 입력 파라미터를 이용하여 충청남도 내에 있는 노인복지시설의 정보를 조회 할 수 있는 API
