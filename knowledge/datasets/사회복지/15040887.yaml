description_portal: ‘서민금융진흥원 미소금융 대출실적 현황’ 공공데이터는 서민금융의 대표 정책상품인 미소금융의 연도별 전체 지원 실적을 보여주는 자료입니다. 이 데이터는 연도별로 전국에서 실행된 미소금융 대출의 총 금액과 총 건수를 포함하고 있어, 미소금융 사업의 규모와 실질적인 지원 현황을 파악하는 데 유용합니다. 미소금융은 저소득·저신용 서민을 대상으로 창업자금, 운영자금 등을 지원하는 상품으로, 해당 데이터를 통해 연도별 수요 추이와 정책효과의 변화를 분석할 수 있습니다. 또한 정책금융의 집행 실적을 수치로 확인함으로써 향후 제도 개선, 맞춤형 금융상품 기획 등에도 활용할 수 있는 기초 자료로 기능하며, 금융소외계층에 대한 공공 금융의 접근성과 지속가능성을 판단하는 데 중요한 참고자료가 됩니다.※ 전통시장, 민간사업수행기관 소액대출 제외
