summary_user: 청소년 매체이용 및 유해환경 실태조사에서 연도별로 어떤 통계 항목을 조사했는지를 담은 항목 목록(메타데이터)으로, 조사분류·조사명·조사년도·통계항목 ID와 이름을 행 단위로 제공하며 범위는 전국이고 지역 구분은 없다. 연구자나 정책 평가 담당자가 '특정 매체이용·유해환경 항목이 몇 년부터 반복 조사됐고 언제 바뀌었나'를 확인해 분석 설계나 시계열 연속성을 점검하는 데 쓴다. 전역 조인 키는 없고, 같은 실태조사의 통계 수치 데이터와는 통계항목ID(statsId)나 조사명·연도를 이름 매칭해 잇는 방식으로만 연결한다.
description_portal: 청소년 매체이용 및 유해환경 실태조사 통계데이터 항목 정보를 오픈 API형 데이터입니다.해당 개방 데이터는 실태조사분류명, 실태조사명, 실태조사년도, 통계항목명 등의 내용을 확인할 수 있습니다.연도별 조사 항목 변화를 비교 분석하거나 특정 항목의 반복적 조사 추이를 파악함으로써 정책 수립에 필요한 데이터 연속성을 확보할 수 있습니다. 실태조사명을 기준으로 다층적인 데이터 연계를 시도할 수 있으며, 연구기관이나 정책 평가 담당자들이 보다 정밀한 분석 설계를 구성할 수 있으며,  청소년 관련 정책의 정합성과 실효성을 높이기 위한 기초 자료로 활용될 수 있습니다.
