description_portal: 대전광역시시설관리공단에서 관리 운영 중인 대전추모공원의 월별 자연장 현황 정보를 제공하고 있습니다. 대전추모공원의 주소는 대전광역시 서구 상보안윗길 160 이며 체육, 환경, 복지, 기반 중 복지시설에 해당됩니다. 추모공원 월별 자연장 현황은 추후 자연장 데이터가 추가되는 경우 변경될 수 있음을 알려드립니다. 해당 파일에서 제공하는 정보는 연도, 월, 총계, 잔디장 소계, 잔디장 관내, 잔디장 관외, 수목장 소계, 수목장 관내, 수목장 관외, 화초장 소계, 화초장 관내, 화초장 관외입니다. 추모공원  자연장 현황 데이터 기준일은 2025년 7월 1일 입니다. 추가로 필요하신 사항이 있다면 공공데이터 담당자(042-610-2746)에게 문의하여 주시기 바랍니다.
