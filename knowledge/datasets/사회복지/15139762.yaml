summary_user: 전국 사회복지시설을 시설 한 곳 단위로 담은 상세 정보로, 시설코드·시설명·사업자등록번호·대표자명·주소·전화번호·설립일자·업종과 시설 종류 등이 들어 있다. 노인·아동·장애인·노숙인 시설 전체에 공통으로 쓰는 마스터 성격이어서, 분석가나 사업자가 '이 시설의 정식 명칭과 주소, 설립일, 연락처는 무엇인가'를 확인하거나 지역별 시설 목록을 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 사회복지시설 데이터와는 시설코드(FCLT_CD)로, 다른 데이터와는 시설명·주소 매핑으로 연결한다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 사회복지시설 상세 정보로,시설코드, 시설명, 사업자등록번호, 홈페이지주소, 시설주소, 시설전화번호, 설립일자 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
