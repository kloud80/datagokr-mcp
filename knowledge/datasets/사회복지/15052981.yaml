summary_user: 공무원연금공단의 연금수급이 끝난 사람을 광역자치단체(서울~제주 17개 시도) 단위로 집계한 표로, 퇴직·유족·장해연금별로 사망, 청산, 유족승계, 재임용 후 합산, 퇴직처분 취소, 배우자 재혼, 직계비속 19세 도달 등 종결 사유별 인원을 담는다. 분석가가 '어느 시도에서 공무원연금 수급 종결이 많고, 그 사유가 사망인지 유족승계인지 청산인지'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 다른 지역별 통계와는 시도 이름(지역)을 매핑해 잇고 같은 기관의 지역별 수급자 현황과 나란히 본다.
description_portal: '공무원연금공단에서 관리하는 연금수급종결 지역별 사유별(사망,청산,유족승계,합산신청,퇴직처분취소 등) 연금수급종결자 현황 데이터입니다.지역 : 서울, 부산, 대구, 인천, 광주, 대전, 세종, 울산, 경기, 강원, 충북, 충남, 경북, 경남, 전북, 전남, 제주(광역자치단체 기준)1. 청산 : 이민 또는 국적상실시 본인의 원에 의한 청산(4년분 연금액의 상당금액을 일시 지급) 및 유족이 아닌 직계비속 또는 기관장에게 지급되는 특례급여2. 퇴직처분취소 : 파면, 해임, 직권면직, 의원면직 등 퇴직처분 취소3. 기타 - 퇴직연금수급자 : 퇴직연금→일시금 전환, 퇴직자 행방불명 등'
