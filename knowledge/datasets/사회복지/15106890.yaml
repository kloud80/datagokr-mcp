summary_user: 국민연금공단이 상장주식 지분율 5% 이상을 새로 취득하거나 그 뒤 지분율이 1% 이상 변동되어 전자공시시스템(DART)에 보고한 내역을 보고 건별로 담으며, 2026-01-02~2026-03-31 기간 142건이 들어 있다. 투자자나 분석가가 '이번 분기 국민연금이 5% 이상 지분을 새로 늘리거나 줄인 종목은 어디인가'를 확인하는 데 쓴다. 발행기관명·보고서 작성기준일·지분율만 있고 종목코드 같은 전역 조인 키가 없어, 주식·금융 데이터와는 발행기관명을 종목명에 맞춰 매핑해 연결한다.
