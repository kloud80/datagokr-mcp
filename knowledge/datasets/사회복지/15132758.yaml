summary_user: 전국 시도 청소년활동진흥센터의 연락처 현황을 센터 1곳당 1건으로 담는 목록이며, 센터명·사업자등록번호·우편번호·주소·전화·팩스·이메일·누리집 주소를 포함한다. 청소년 단체·학교·지자체 담당자가 "우리 시도의 청소년활동진흥센터 연락처와 누리집은 어디인가"를 확인하거나 협력 기관 연락망을 만들 때 쓴다. 사업자등록번호(brno)를 키로 사업자 정보 등 사업자등록번호 기반 데이터와 잇고, 주소로 시도 단위 지역 통계에 연계한다.
description_portal: 시도 청소년활동진흥센터 정보 서비스 조회를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 시도센터명, 사업자등록번호, 우편번호, 주소이전내용, 주소이후내용, 전화번호, 이메일 이전 내용, 이메일도메인코드, 누리집주소, 팩스번호 등의 내용을 확인할 수 있습니다.지역 청소년 활동지원 조직의 기본 현황을 제공하며, 기관 간 연계 및 정보 전달 체계 구축에 효과적으로 활용됩니다. 이메일, 전화번호, 주소 등의 상세 정보가 포함돼 있어 빠른 연락 및 협업 체계 수립에 유리하며, 활동 네트워크 플랫폼 구축 시 기초 정보로도 중요합니다. 지역기반 청소년 정책 협력과 소통 강화를 위한 인프라 정보로 활용될 수 있습니다.
