summary_user: 서울 동작구가 추진하는 장애인 일자리 사업을 사업별로 정리한 작은 목록 파일(약 1.4KB CSV)로, 사업명·직무·근무지·배정 일자리 수·사업 시작·종료일과 소관부서 연락처를 담는다. 동작구에 사는 장애인이나 가족이 "지금 동작구에서 어떤 장애인 일자리 사업이 몇 자리로 운영되고 어디서 일하나"를 확인하거나, 복지 분석가가 구 단위 장애인 일자리 공급 규모를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업명·근무지 이름을 맞추거나 같은 기관(동작구) 데이터끼리 묶어서 이어 쓴다.
description_portal: 이 데이터는 서울특별시 동작구 장애인일자리현황에 관한 데이터입니다.장애인들의 일자리 사업명과 일자리직무, 근무지 등의 데이터를 포함하고 있습니다.데이터에는 추진 중인 장애인 일자리 사업명 정보가 포함되어 있습니다.배정일자리수 항목을 통해 각 사업별로 배정된 일자리 규모를 확인할 수 있습니다.사업시작일자 항목은 해당 일자리 사업이 시작된 시점을 나타냅니다.사업종료일자 항목을 통해 사업 운영 종료 예정 시점을 확인할 수 있습니다.근무지 항목은 장애인 근로자가 실제로 근무하는 장소 정보가 포함됩니다.
