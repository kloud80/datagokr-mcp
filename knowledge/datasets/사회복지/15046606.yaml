description_portal: '통계활용사례 등록URL 복사목록 이동서울시 고용보험 피보험자수 현황 통계○ 통계개요* 통계명 : 고용보험 피보험자수 현황* 통계종류 : 서울시 고용보험 피보험자수 현황을 제공하는 일반·보고통계* 작성목적 : 고용보험사업 시행에 의해 축정된 행정DB를 이용하여 고용보험사업의 사업성과모니터링과 노동시장 분석을 위한 기초자료로 활용* 조사체계 : 지방노동관서→한국고용정보원* 공표주기 : 정기(매월)* 공표범위 : 지역 ? 서울시내용 ? 고용보험 피보험자 수○ 용어설명* 고용보험 : 실직근로자에게 실업급여를 지급하는 실업보험사업외에 적극적인 취업알선을통한 재취업의 촉진과 근로자의 고용안정을 위한 고용안정사업, 근로자의 직업능력개발사업 등을 상호 연계하여 실시하는 사회보험제도임* 피보험자 : 고용보험에 가입되어 있는 근로자. 단, 소정근로시간이 월 60시간 미만인 자(주소정 근로시간이 15시간 미만인 자) 중 3개월 미만 계속 근무하는 자, 국가공무원법 및지방공무원법에 따른 공무원, 사립학교교직원 연금법의 적용을 받는 자 등은 적용 제외됨○ 기 타* 피보험자 통계는 상시근로자(임금근로자+자영업자) 대상이며, 일용근로자는 제외됨* 산업분류는 한국표준산업분류(2008년 9차 개정) 기준을 따름* 분류불능은 표기하지 않아 각 셀의 합이 전체 수치와 일치하지 않을 수 있음* 과거 피보험자 자료는 이중취득자가 중복된 사례가 있었으나,"10.1월부터 이중취득의 경우 1건으로만 집계○ 출 처 : 한국고용정보원, 고용보험통계'
