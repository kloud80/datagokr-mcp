description_portal: 사립학교 교직원의 해당연도의 합산내역별 승인 건수와 관련된 데이터로, 타 공적연금의 재직기간 합산승인을 신청한 사례들을 연도별로 집계하고, 그 내역을 유형별(사립학교교원, 사립학교사무직원, 재임용교원, 재임용사무직원, 공무원군인교원, 공무원군인사무직운)로 분류하여 합산승인된 건수를 제공합니다.이 데이터를 통해 교직원의 합산 제도 이용 현황과 공적연금 간 이동 추세를 파악하고 공단의 연금 업무 처리 투명성을 높이며, 특정 기간 동안의 업무량 및 승인 추이를 명확하게 이해할 수 있습니다. 또한, 연금 제도 개선을 위한 정책 수립 및 서비스 효율성 증대를 위한 기초 자료로 활용될 수 있습니다. 본 데이터는 공공기관의 책임 있는 정보 공개를 통해 대국민 신뢰도를 향상시키며, 연금 가입자 및 관련 연구자들이 공단의 운영 현황을 객관적으로 분석하는 데 기여합니다.
