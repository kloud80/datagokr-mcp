summary_user: 춘천시 독거노인 수를 행정동(읍면동)별·연령대별로 집계해 전체·남자·여자 인원과 기준일자를 담은 CSV 파일이다. 복지 담당자나 분석가가 '춘천시 어느 동에 어떤 연령대의 홀로 사는 노인이 많고 성비는 어떤가'를 보고 돌봄·방문 서비스 배치를 정할 때 쓴다. 전역 조인 키(행정코드)가 없어 시군구명·행정동명 같은 이름을 매핑해 시군구·읍면동 단위 노인인구·복지시설 데이터와 잇는다.
limits: 행정동코드 같은 표준 키가 없어 다른 데이터와 붙일 때 이름 표기 차이를 직접 맞춰야 한다. 범위가 춘천시 한 곳의 읍면동이라 다른 시군구 비교나 전국 실태 파악에는 따로 데이터를 모아야 한다.
