summary_user: 국민연금기금의 포트폴리오를 시장가 기준 말잔(십억 원)으로 공공·복지·금융(국내주식·해외주식·국내채권·해외채권·대체투자·단기자금)·기타 부문별로 나눠 담은 집계 파일로, 2026년 6월 현황과 2021~2025년 연도별 값을 한 표(약 669바이트 CSV)에 담는다. 분석가나 국민이 '국민연금기금에서 해외주식·대체투자 비중이 최근 몇 년간 얼마나 늘고 국내채권은 얼마나 줄었나'처럼 자산배분 변화를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 자산군 이름이나 같은 기관(국민연금공단)의 기금 운용 성과·국내 주식 보유 현황 데이터와 이름으로 맞춰 이어 쓰며, 종목·금융회사 단위 연결은 이 표만으로는 되지 않는다.
limits: 부문·자산군 단위 합계만 있어 개별 종목·채권·위탁운용사 수준 분석은 못 하고, 다른 데이터와 묶을 공통 코드가 없어 이름 매핑으로만 연결한다. 포털 설명상 반올림 때문에 세부내역 합과 합계가 단수 차이로 어긋날 수 있고, 금융부문 금액에는 전술적 외환 익스포저 등이 포함돼 있다.
