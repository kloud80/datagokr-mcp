summary_user: 경기도 내 품질인증 농촌교육농장(농촌에듀팜)을 농장 한 곳당 한 행으로 담고, 농장명·인증년도·시군명과 도로명·지번 주소, 우편번호, 위도·경도 좌표를 포함한다. 학교 교사나 학부모가 우리 시군에서 체험학습을 보낼 만한 인증 교육농장이 어디 있는지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD) 이름 매핑이나 주소·좌표 기반으로만 이어 쓴다.
description_portal: '이 데이터는 경기도 내 농촌교육농장(농촌에듀팜)의 현황을 담고 있으며, 각 시군별로 품질인증을 받은 농촌교육농장에 대한 정보를 제공합니다. 주요 항목으로는 농장명, 인증년도, 시군명, 사업구분명, 교육 주제, 전화번호, 홈페이지 주소, 도로명 및 지번 주소, 우편번호, 위도·경도 좌표 등이 포함됩니다. 농촌에듀팜은 농업자원과 교육 과정을 연계한 체험학습 프로그램을 제공하는 농장으로, 학생들에게 자연친화적 교육 환경을 제공하고 지역 농업에 대한 이해를 높이는 역할을 합니다. 본 데이터는 XML 및 JSON 형식으로 제공되며, 교육기관의 체험학습 기획, 농업 관련 콘텐츠 개발, 농촌 자원 활용 정책 수립 등에 활용될 수 있습니다.- 농촌에듀팜: 농촌에듀팜은 농업자원과 학교 교과 과정을 연계하여 운영되는 체험 중심의 교육농장으로, 농촌교육문화 확산과 지역 활성화를 목적으로 조성됩니다.- 품질인증농장: 교육 프로그램의 적정성과 안전성, 운영체계 등을 기준으로 정부나 지자체로부터 인증받은 농장을 의미합니다.'
