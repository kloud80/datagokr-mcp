description_portal: '○ 통계개요* 통계명 : 노인주거·의료복지시설(1993년-2007년)* 통계종류 : 서울시 노인주거ㆍ의료복지시설 현황을 자치구별로 제공하는 일반ㆍ보고통계* 근거법령 :「노인복지법」34조에 규정된 생활시설로 서울시에서 관리하는 시설* 작성목적 : 노인복지시설 설치신고를 마친 노인복지시설의 수, 입소정원을 집계하여적정수의 시설수요와 충족율을 분석하고 분석결과에 따른 정책 수립 및평가를 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당시설 → 자치구 → 서울특별시 어르신복지과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 노인주거ㆍ의료복지시설(무료양로, 무료노인요양, 실비및유료시설)의 시설수, 생활인원 수○ 기 타* 노인복지법 개정("08. 4)으로 명칭 및 분류 변경되어 2008년부터 자료생산 안함("노인주거복지시설", "노인의료복지시설" 참고)'
