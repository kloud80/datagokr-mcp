summary_user: 경기도 일반학급(전일제 통합학급)에 배치된 특수교육대상 학생 수를 기준년도와 학교유형(국립·공립·사립)별로 집계하고, 학교급(유치원·초등·중·고)과 성별로 나눈 시도 단위 통계다. 교육정책 담당자나 분석가가 '경기도 통합학급의 특수교육대상 학생은 학교급별로 남녀 비율이 어떻게 다른가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 같은 기관의 다른 특수교육 통계와는 기준년도(STD_YY)와 학교유형명으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 교육부의 특수교육통계를 기반으로 경기도 내 일반학급(전일제 통합학급)에 배치된 특수교육대상 학생 수를 성별, 학교유형(국립, 공립, 사립), 학교급(유치원, 초등학교, 중학교, 고등학교)별로 집계한 통계입니다. 항목에는 ‘기준년도’, ‘학교유형명’, ‘전체학생수(명)’, ‘전체남자학생수(명)’, ‘전체여자학생수(명)’, ‘유치원전체학생수(명)’, ‘초등학교전체학생수(명)’ 등과 같은 세부 항목이 포함되며, 매년 6월 말 기준으로 집계됩니다. 이 데이터는 통합교육의 운영현황을 파악하고, 성별 및 학교급에 따른 교육지원 필요 수준을 분석하는 데 활용될 수 있으며, 특히 지역별 특수교육 지원정책 수립, 성별 격차 해소 방안 마련, 학교유형별 자원 배분의 기초자료로 활용 가능합니다.
