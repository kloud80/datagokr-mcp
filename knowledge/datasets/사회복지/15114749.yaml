description_portal: 한국사회의 특수성을 반영한 다문화 수용성 지수를 개발하고 다문화수용 수준과 전개 방향을 파악한 결과 및 코드북 데이터를 제공하는 파일형 개방데이터입니다. 해당 개방데이터는 연령대, 현재 한국 국적 여부, 지역구분 및 규모, 대중매체 다문화 접촉 경험, 대중매체 외국 이주민 접촉 경험 유무 등의 내용을 확인할 수 있습니다.다문화에 대한 사회적 인식과 수용 정도를 지역, 연령, 경험 등 다양한 요소를 바탕으로 분석할 수 있어 다문화 관련 정책의 기초자료로 활용될 수 있으며, 한국 사회 특성에 맞는 수용성 조사 데이터를 바탕으로 정책 방향성을 보다 명확히 설정하는 데 활용될 수 있습니다. 국민다문화수용성 조사의 핵심이라고 할 수 있는 다문화수용 지수와 이를 측정하기 위한 다문화수용성 진단도구는 한국인의 다문화수용성을 구성하는 주요 축을 관계성, 다양성, 보편성 이라는 3개 차원으로 설정하고 총 8개 하위 구성요소를 측정하였습니다
