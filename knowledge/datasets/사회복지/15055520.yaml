description_portal: 본 데이터는 관내 폭력 피해 지원 상담소의 현황 정보이다. 상담소별 명칭, 소재지, 연락처, 지원 대상, 제공 서비스 등의 세부 내용을 포함한다. 폭력 피해 지원 상담소는 가정폭력, 성폭력, 데이트폭력 등의 피해자에게 상담, 보호, 법률 지원 등을 제공하는 전문 기관이다. 해당 자료는 폭력 예방 정책 수립, 피해자 보호 체계 강화, 상담 서비스 확대 계획에 활용된다. 피해자에게 심리 상담 및 치료 서비스를 제공하여 정신적 외상을 치유하고 일상 복귀를 지원한다. 또한 법률 상담 및 소송 지원을 통해 피해자의 권리를 보호하고 가해자 처벌을 돕는다. 임시 보호 시설 연계 및 자립 지원을 통해 안전한 생활 환경을 조성한다. 폭력 예방 교육 및 인식 개선 활동을 통해 폭력 없는 사회 조성에 기여한다.
