summary_user: 경기도 시군별 정신건강복지센터 이용자 수를 집계연도 단위로 모은 집계 통계이며, 시군명·집계연도·이용자수와 시군별 이용자수 산정 기준을 적은 비고(rm)를 담는다. 정책 담당자나 분석가가 "우리 시군의 정신건강복지센터 이용자가 해마다 늘고 있는가"를 확인하거나 지역 정신건강증진사업 계획의 기초 자료로 쓴다. 전역 조인 키는 없어서 다른 시군 단위 통계(인구·복지 지표 등)와는 시군명(sigun_nm)과 연도를 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터는 경기도 각 시군 단위의 정신건강복지센터 이용자 현황을 연도별로 집계한 자료로, 각 지역별로 센터를 이용한 사람들의 규모와 변화를 파악할 수 있는 통계입니다. 주요 항목으로는 시군명, 집계연도, 이용자수 등이 포함되어 있으며, ‘비고’ 항목을 통해 각 시군에서 적용한 이용자수 산정 기준을 확인할 수 있습니다. 본 자료는 시군별 정신건강 서비스 이용 실태를 종합적으로 파악하는 데 활용되며, 정신건강 정책 수립, 지역 맞춤형 서비스 계획, 정신건강증진사업의 기초 자료로 활용 가능합니다. 다양한 산정 기준이 존재하므로, 지역 간 통계 비교 시 이용자수 기준의 차이에 유의해야 합니다.
