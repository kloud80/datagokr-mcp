summary_user: 부산광역시 서구의 노인일자리 지원사업을 사업 건별로 정리한 소규모 파일(csv 약 6KB)로, 수행기관·사업명·유형(공익활동형·역량활용형·공동체사업단)·시행인원·활동내용·전화번호를 담는다. 서구에 사는 어르신이나 가족이 어떤 기관에서 어떤 노인일자리에 참여할 수 있고 몇 명을 뽑는지 확인하거나, 분석가가 유형별 시행인원 규모를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 노인복지시설·장기요양기관 데이터와는 수행기관 이름 매칭이나 같은 기관(부산 서구) 단위로만 연결한다.
description_portal: '어르신이 활기차고 건강한 노후생활을 영위할수 있도록 다양한 일자리와 사회활동을 지원하여 노인복지 향상에 기여하고 하는 목적사업임.노인일자리 유형에는 공익활동형, 역량활용형, 공동체사업단  3가지가 있음. 1. 공익활동형 노인일자리:  취약노인가정 방문, 노노케어, 초등학교 주변  주정차 관리 및 주차 질서 지도, 시설환경정비  및  급식실 보조 등2. 역량활용형: 시설업무 지원관리, 시설내 민원업무 보조 등3. 공동체사업단:  노인 인력을 이용한 제조, 판매업 등으로 부산 서구에서는 전통 음료 제조 판매, 단체 도시락 제작, 국수, 어묵, 두부 과자 제조, 판매 등'
