description_portal: 대구광역시 동구의 동별 장애인등록현황에 관한 데이터로 장애인등록현황에 대한 내용을 전달합니다. 대구광역시 동구는 신암1동을 포함해 공산동까지 총 22개의 행정동으로 구성되어있으며, 지역별 장애인 등록 현황을 파악하여 장애 복지 정책의 우선순위 수립 가능합니다. 또한  장애인 인구 수 뿐 아니라 각 동별 총 인구를 같이 넣어 동별 총인구 대비 장애인 수에 대한 비율을 확인 할 수 있습니다. 이에 사회복지 자원 배분의 효율성 향상시킬 수 있으며  NGO, 민간 복지단체, 연구자들이 동 단위 분석(집중지역, 변화 추이) 등으로 연구 및 캠페인 기획 가능할 것으로 판단됩니다.
