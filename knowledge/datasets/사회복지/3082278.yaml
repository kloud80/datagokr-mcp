summary_user: 광산구에 있는 장애인 복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설 구분·시설명·주소·운영주체·종사자 수·이용자 수·위도·경도를 포함한다. 광산구 주민이나 보호자가 "우리 동네 가까운 장애인복지관은 어디이고 누가 운영하나"를 찾을 때 쓰고, 분석가는 시설별 종사자 대비 이용자 규모를 비교하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시설명·주소로 매칭하거나 위도·경도로 지도 위에 겹쳐 이어 쓴다.
description_portal: 광주광역시 광산구 내 장애인 복지시설 현황에 대한 데이터로 시설명, 도로명주소, 운영주체, 종사자, 인원 등의 정보를 제공합니다.광주광역시 광산구에는 장애인의 자립과 복지를 지원하기 위해 여러 장애인복지관 및 장애인 관련 복지시설이 운영되고 있으며, 이에 대한 현황 데이터에는 다양한 핵심 정보가 체계적으로 수록되어 있습니다.운영주체 정보를 통해 복지관이 지방자치단체, 비영리법인, 민간단체 또는 사회적기업 등에 의해 운영되는지 구분할 수 있습니다.인원 정보는 해당 복지시설이 지원하거나 돌보는 이용자 수를 나타냅니다.이와 같은 데이터는 장애인 복지 정책 수립, 서비스 현황 점검, 시설 배치 및 인력 지원 계획, 예산 편성, 이용자 맞춤형 프로그램 개발, 민관 협력 구조 마련 등 다양한 분야에서 기반 자료로 널리 활용될 수 있습니다.
