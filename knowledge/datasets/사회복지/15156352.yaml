summary_user: 아이돌봄서비스 업무에 관한 질문·지문·답변을 한 건씩 담은 질의응답 학습 데이터로, 질문자 구분, 주제분류, 근거 문장, 추론내용, 원본 문서명과 페이지까지 함께 담는다. 아이돌봄 상담 챗봇이나 업무 안내 AI를 만드는 개발자·연구자가 '이용 요금이나 정부 지원 기준 같은 질문에 어떤 근거 문서로 답해야 하나'를 학습·검증하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 원본 문서명(document)·키워드 같은 이름 매칭이나 같은 기관 자료로만 이어 쓴다.
description_portal: 아이돌봄서비스 업무 질의응답 학습 데이터는 공공데이터법 제24조에 따라 추진되는 제4차 국가중점데이터 개방계획에 포함된 아이돌봄 지원사업 관련 데이터입니다.이 데이터는 국가적 파급효과와 활용가치가 높은 고수요 데이터를 국가중점데이터로 개방한다는 취지에 따라 선정되었으며, 표준화 절차와 품질 점검을 거쳐 신뢰성을 확보한 후 오픈API 방식으로 제공됩니다.이를 통해 이용자는 아이돌봄 서비스 현황 분석, 민간 서비스 연계 검토 등 다양한 정책·연구·서비스 기획 목적에 활용할 수 있으며, 다른 공공데이터와 결합하여 공공 및 민간 분야 전반에서 활용 범위를 넓힐 수 있습니다.
