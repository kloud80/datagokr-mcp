summary_user: 청소년이 자발적으로 결성해 봉사활동을 하는 자원봉사 터전동아리를 동아리 한 건 단위로 담으며, 동아리명·동아리 설명·활동내용·처리상태와 단체번호를 제공하고 범위는 전국이다. 청소년이나 학부모가 어떤 봉사 동아리가 있고 무슨 활동을 하는지 찾거나, 정책 담당자가 청소년 자원봉사 동아리 운영 현황을 파악할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 동아리명·단체번호(grpNo) 같은 같은 기관 내부 번호나 이름 매핑으로만 이어 쓴다.
limits: 실측 컬럼에 지역 코드·주소 같은 전역 조인 키가 없어 시군구 통계나 다른 기관 데이터와 직접 결합하기 어렵다. 이벤트 시점에 생성된 뒤 바뀌지 않는 주기로 분류돼 있어 동아리의 현재 운영 여부는 처리상태 등으로 따로 확인해야 한다.
