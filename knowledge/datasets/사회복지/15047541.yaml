summary_user: 제주특별자치도 안에서 활동하는 청소년단체를 단체 한 곳당 한 행으로 정리한 목록으로, 단체명·설립년도·회원·목적·관련부서·데이터기준일자를 담은 작은 CSV 파일(약 900바이트)이다. 제주에서 청소년 육성을 주된 목적으로 하는 단체가 어디이고 언제 세워졌는지, 회원 규모와 활동 목적은 무엇인지 알아보려는 학부모·청소년 활동 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 단체명을 직접 맞추거나 같은 기관(제주특별자치도) 자료끼리만 이을 수 있고, 지역 단위 통계와 연계할 때는 제주도 시도 단위로만 붙인다.
description_portal: '"제주특별자치도 내 청소년단체현황 데이터를 제공합니다.항목: 단체명, 설립년도, 회원, 목적 등*보건복지가족부의 ‘청소년 기본법’에서 따라 대통령령이 정하는 청소년 육성을 주된 목적으로 설립된 법인 또는 단체*청소년 관련 행정부처 및 유관 사회단체와 연계적인 협력체계를 구축함자세한 사항은 제주통계포털 주요행정통계 자료를 확인하시기 바랍니다.https://www.jeju.go.kr/stats/mdis/report/administration.htm?act=view&seq=1508325"'
