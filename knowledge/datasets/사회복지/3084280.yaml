summary_user: 서귀포시 읍·면·동별로 일반·조건부·특례·기타 일반·시설 수급자의 가구수와 수급권자수를 집계한 기초생활보장 수급자 통계로, 1KB 남짓의 작은 CSV 파일이다. 복지 담당자나 분석가가 '서귀포시에서 기초생활 수급 가구가 많은 읍·면·동은 어디이고 조건부·시설 수급 비중은 어떤가'를 따져 지역 복지 사업이나 시설 배치를 검토할 때 쓴다. 전역 조인 키(행정동 코드 등)는 없으며, 다른 데이터와는 읍면동 이름을 행정구역 코드에 매핑하거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 기초생활보장 수급자 현황 데이터는 읍·면·동 단위로 일반, 조건부, 특례, 시설 수급자 등의 세부 수급 현황을 집계한 통계 자료입니다. 각 행에는 수급자 유형별 대상자 수, 시설수급자 가구수·수급권자 수, 그리고 데이터 기준일자가 포함되어 있어, 저소득층 복지 지원 현황 분석에 적합합니다. CSV 파일 형식으로 제공되며, 무료로 연 1회 갱신됩니다.공공데이터포털에서 로그인 없이 다운로드 가능하며, 오픈API(XML/JSON) 연동 또한 지원되어 사회복지 정책 수립 및 지역별 복지 수준 평가, 취약계층 지원 사업 기획 등에 유용하게 활용될 수 있습니다.
