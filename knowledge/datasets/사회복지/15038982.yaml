summary_user: 경기도 양주시 관내 장애인 일자리를 일자리 유형별로 정리한 집계 파일로, 일자리 수·급여일·급여액과 관리기관명, 데이터기준일을 담으며 파일 크기는 353바이트로 몇 행 안팎의 소규모다. 양주시에서 어떤 유형의 장애인 일자리가 몇 개 운영되고 급여 수준이 어느 정도인지를 확인하려는 장애인·보호자, 복지 담당자, 지역 고용 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자리 유형 이름이나 관리기관명(양주시)을 기준으로 수작업 매핑해 이어 쓴다.
description_portal: 관내 장애인 일자리 현황에 대한 데이터로 일자리 유형, 일자리수, 급여일, 급여액 등을 포함하고있습니다.이를 통해 장애인의 고용 기회 현황, 배치기관별 참여 규모, 그리고 지역사회 내 장애인 근로환경에 대한 기초 정보를 제공하며, 나아가 고용 미스매칭, 근로환경 개선, 자립생활 지원, 노동시장 소외계층의 포용성 강화 등 사회적 이슈와 연계한 정책·연구 자료로 활용될 수 있습니다.
