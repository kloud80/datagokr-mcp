description_portal: 본 데이터는 화장시설의 현황에 대한 상세 정보를 제공합니다. 이는 경상북도 내에서 시신 또는 유골을 화장하는 서비스를 제공하는 화장 시설의 운영 실태, 규모 및 서비스 제공 범위를 파악하는 데 목적이 있습니다. 이 데이터는 변화하는 장례 문화 수요에 대응하기 위한 기초 자료로 활용됩니다.주요 내용으로는 시설의 공식 명칭인 화장시설명과 시설 운영의 책임 주체인 운영주체 정보가 포함됩니다. 시설의 물리적 위치인 위치와 문의를 위한 전화번호가 기록되어 있으며, 시설의 건립 이력을 알 수 있는 설치년도 정보도 제공됩니다.시설의 규모를 정량적으로 파악할 수 있도록 시설규모 부지 및 시설규모 연면적 정보가 포함됩니다. 핵심 시설인 화장로 수, 현재 운영 중인 운영화로, 그리고 비상 상황에 대비한 예비화로의 수량이 상세히 기록되어 있습니다. 마지막으로, 유골을 자연에 뿌리는 산골장서 제공 여부를 명시하고 있습니다. 이 자료는 장사 시설 수급 계획 수립 및 공공 장례 문화 정책 연구 등에 귀중한 기초 자료로 활용됩니다.자료 관련 문의는  054-880-2299로 하시기 바랍니다.
