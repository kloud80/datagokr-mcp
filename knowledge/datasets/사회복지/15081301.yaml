description_portal: 사립학교교직원의 사망 현황을 나타내고 있는 데이터로 연령, 합계, 교직원(교원, 사무직원), 성별(남, 여), 학교급별(유치원, 초등학교, 중학교, 고등학교, 전문대학, 대학교, 특수학교, 학교경영기관) 등을 제공합니다. 교직원의 사망 현황 데이터는 유족연금대상자 선정 시 사용될 수 있으며, 이를 지역별(서울, 경기, 인천, 충남, 충북, 영남, 전남, 전북, 제주) 등으로 세분화하여 제공하는 것을 목표로 하고 있습니다.해당 데이터는 연금 수급자 예측 및 연금 재정 안정성 분석을 위한 기초 자료로 활용될 수 있습니다. 또한, 교직원 복지 정책 수립 및 사회 복지 연구에 필요한 통계 정보를 제공하여 관련 분야의 발전에 기여합니다. 본 데이터는 공공기관의 투명한 정보 공개를 통해 사회 변화를 이해하고, 효율적인 공적 연금 제도 운영을 지원하고자 합니다.
