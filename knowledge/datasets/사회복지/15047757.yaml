description_portal: '한국사회보장정보원에서 제공하는 요보호아동 중 가정위탁아동 양육보조금 서비스를 받는 수급자를 기준으로 월별, 시군구별, 성별, 연령구간별로 집계한 통계데이터입니다. 데이터 구성은 통계년월, 시도명, 시군구명, 연령구간, 성별, 수급자수 항목으로 구성되어 있습니다.이 데이터를 활용하여 연령별, 성별 가정위탁아동의 분포를 비교하여 맞춤형 지원 방안을 분석할 수 있습니다.○ 요보호아동「아동복지법」 제3조에서 규정하는 개념으로,보호자가 없거나 보호자의 양육이 어려워 국가나 지자체의 보호가 필요한 아동을 말합니다.○ 가정위탁아동아동복지시설 대신 일반 가정에서 위탁·양육하는 아동을 의미합니다.가정위탁제도: 친부모 또는 보호자가 양육할 수 없는 아동을 일정 자격을 갖춘 위탁가정에 맡겨 가정적인 환경에서 성장하도록 지원하는 제도유형: 친인척위탁, 일반위탁, 전문위탁 등'
