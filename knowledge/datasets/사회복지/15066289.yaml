summary_user: 인천광역시 내 노숙인 시설을 시설 한 곳당 한 행으로 담은 작은 목록 파일(csv, 931바이트)로, 시설유형·운영주체·시설명·주소·전화·설립일·설치 신고일과 입소자 정원·현원을 담는다. 시민이나 지원 단체가 인천에서 노숙인이 입소할 수 있는 시설이 어디에 있고 정원 대비 현재 몇 명이 지내는지 확인하거나, 분석가가 시설별 이용률을 비교하는 데 쓴다. 공통 조인 키(사회복지시설코드 등)가 실측 컬럼에 없어 다른 사회복지시설 데이터와는 시설명이나 주소를 맞춰 이어 써야 한다.
description_portal: 인천광역시는 노숙인의 생활 안정과 복지를 위해 다양한 시설 현황 데이터를 제공하고 있습니다. 이 데이터는 사회복지 취약계층 지원을 목적으로 수집되며, 주요 항목으로는 시설유형, 운영주체, 시설명, 주소, 전화번호, 팩스번호, 설립일, 설치 신고일, 입소자 정원 및 현원 등이 포함됩니다. 이를 통해 각 시설의 기본 정보와 운영 현황을 체계적으로 파악할 수 있으며, 행정기관과 시민이 노숙인 지원 정책을 수립하거나 연구 자료로 활용할 수 있습니다. 입소자 정원과 현원 데이터를 통해 실제 이용률을 확인할 수 있어 정책적 개선 방향을 제시하는 근거가 됩니다. 이 공공데이터는 인천광역시 내 노숙인 지원 체계의 투명성과 효율성을 높이는 중요한 자료로 활용됩니다.
