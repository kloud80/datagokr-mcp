summary_user: 전국 아동·청소년 보호기관을 기관 한 곳당 한 행으로 담은 원천 목록으로, 기관명·기관 구분·시도/시군구/읍면동·행정동·우편번호·주소·지도 좌표가 들어 있다(CSV 약 28.7MB). 성범죄자 신상정보 고지 업무 담당자나 분석가가 "우리 동네 읍면동 안에 고지 대상이 되는 아동·청소년 보호기관이 몇 곳이고 어디에 있나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 사회복지시설 데이터와는 기관명·주소나 시도·시군구·읍면동 이름을 맞추거나 좌표로 공간 결합해 이어 쓴다.
description_portal: '본 공공 데이터는 성범죄자 신상 정보 공개 고지 제도의 효율적 운영을 위해 전국 아동·청소년 보호 기관의 상세 정보를 수록한 파일 형 개방 데이터입니다.해당 개방 데이터는 기관 명, 기관 구분 값,완료 여부 행정 구역: 시도,주소지 시군구, 읍면동 정보, 행정동 명, 교육기관 시도/시군구/읍면동 위치 정보: 우편번호, 기관 주소, 주소지 지도 X/Y좌표를 확인할 수 있습니다.아동 청소년 성범죄자 고지  행정의 정확성 향상으로 누락 없는 완전한 고지 시스템을 구축 하고 지역 별 고지 수요 예측 및 우선 순위 설정을 통한 업무 효율성 극대화 및 성범죄자 고지 제도의 지역 별 이행 관리 및 모니터링 강화하고, 아동 청소년 보호 정책 수립 및 안전 환경 조성에 기여합니다.'
