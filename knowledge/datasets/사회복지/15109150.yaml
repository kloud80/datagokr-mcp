summary_user: 제주특별자치도 안에 있는 노숙인지원시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·유형·소재지·연락처·정원·관리부서를 담으며 파일 크기는 436바이트로 몇 건 안 되는 소규모 목록이다. 제주에서 노숙인 쉼터나 자활·재활 시설을 찾는 당사자·지원기관이나, 도내 노숙인 시설의 수용 정원을 파악하려는 복지 분석가가 쓴다. 전역 조인 키가 없어서 다른 사회복지시설 데이터와는 시설명·주소를 맞춰 보거나 같은 기관(제주특별자치도) 자료끼리만 이어 쓴다.
description_portal: '제주특별자치도 내 소재하는 노숙인지원시설 현황 데이터를 제공합니다.항목: 소재지, 연락처, 정원, 관리부서 등* 설치 및 지원근거- 노숙인 등의 복지 및 자립지원에 관한 법률 (약칭: 노숙인복지법)- 제주특별자치도 노숙인 등의 복지 및 자립지원에 관한 조례 (복지정책과)* 치료 및 각종 재활프로그램을 제공하고 사회 적응 훈련을 실시함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1480'
