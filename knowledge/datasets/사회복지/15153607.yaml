description_portal: 「아동급식카드 가맹점 현황」 데이터는 결식 우려 아동에게 지급되는 아동급식카드로 결제가 가능한 가맹점의 세부 정보를 체계적으로 제공하는 자료입니다. 본 데이터에는 가맹점명, 가맹점유형, 시도명, 시군구명, 시군구코드, 소재지도로명주소, 위도·경도 기반의 위치정보, 전화번호 등 가맹점 이용과 분석에 필요한 항목이 포함되어 있습니다.이 데이터는 지자체의 아동급식 정책 운영, 지역별 급식 사각지대 분석, 아동 밀집지역 대비 가맹점 접근성 평가, 신규 가맹점 발굴, 복지 서비스 품질 관리 등에 활용될 수 있습니다.민간기업·연구기관에서는 지도 기반 서비스 개발, 지역 상권·이용패턴 분석, 복지 인프라 최적화 모델링, 아동·복지 데이터와의 연계 분석 등 다양한 목적의 데이터 기반 연구·서비스에 활용할 수 있으며, 지역 간 비교·통계분석에도 적합한 구조로 제공됩니다.
