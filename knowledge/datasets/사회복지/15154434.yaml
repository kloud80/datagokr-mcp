description_portal: 이 데이터는 전체 보육아동 대비 공공형 어린이집을 이용하는 아동의 현황을 나타낸 자료입니다. 구분 항목에는 만0세, 만1세 등 연령별 아동이 포함되며, 각 연령대별로 법인단체, 국공립, 사회복지법인, 직장 어린이집을 이용하는 아동 수가 집계되어 있습니다. 이 데이터는 특정 연령대 아동이 어떤 운영주체의 어린이집을 이용하는지 기본적인 분포를 보여주며, 운영주체별로 아동 수를 비교하거나 전체 대비 각 유형의 비중을 산출하는 데 활용할 수 있습니다. 또한 연령별로 국공립, 법인단체, 사회복지법인, 직장 어린이집 이용 규모를 확인함으로써, 연령대별 시설 이용 특성을 기초적으로 파악할 수 있습니다. 이를 통해 전체 보육아동 중 공공형 어린이집 이용 현황을 기초적으로 이해하는 데 도움이 됩니다.
