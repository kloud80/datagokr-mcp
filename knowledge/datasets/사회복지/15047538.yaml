summary_user: 제주특별자치도에서 활동하는 청소년유해환경감시단을 운영단체별로 한 행씩 담은 소규모 파일(CSV 396바이트)로, 운영단체명·주소·감시단 인원·지정일을 담는다. 제주 지역 청소년 보호 담당자나 연구자가 '도내 어느 민간단체가 유해환경 감시단을 맡고 있고 인원은 몇 명인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 운영단체명을 기준으로 맞추거나 시도 단위 지역 통계에 붙여 쓴다.
