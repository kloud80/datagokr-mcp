summary_user: 대전광역시 서구의 여성폭력상담 현황을 연도별로 집계한 통계 파일(csv, 712바이트)로, 가정폭력·성폭력·성매매피해 유형별 상담소 수와 상담 건수, 심리정서·수사법적·의료·시설입소연계 등 피해자 지원 내역을 담는다. 서구에서 유형별 여성폭력 상담 건수가 해마다 어떻게 바뀌었는지, 피해자 지원이 어느 분야에 몰리는지를 보려는 정책 담당자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 자치구 통계나 사회복지시설 마스터와는 연도(연별)와 기관명을 맞춰 이어 쓴다.
description_portal: 대전광역시 서구 소재 여성폭력상담 현황 데이터는 지역 내 여성폭력 피해자 지원 체계를 파악하기 위해 구축된 상담·지원 통계 자료입니다. 이 데이터에는 여성폭력상담소의 운영 개소 수, 연도별·유형별 상담 건수, 피해자 지원 실적(의료·법률·심리상담 등), 위기 개입 및 연계 서비스 이용 현황, 사례 개입 규모 등의 항목이 포함되어 있습니다. 이를 통해 서구 지역에서 발생하는 여성폭력 관련 상담 수요의 증가·감소 추세, 유형별 피해 현황, 지원 서비스의 이용 패턴 등을 객관적으로 분석할 수 있습니다.이 자료는 지역사회 내 성폭력·가정폭력·스토킹·디지털성범죄 등 다양한 폭력 유형에 대한 대응 수준을 확인하는 데 활용되며, 피해자 보호정책 개선, 상담인력 배치, 예산 편성, 지역 안전망 구축 등 공공정책 수립에 중요한 근거로 사용됩니다. 또한 여성폭력 예방 교육, 지역사회 캠페인, 피해자 지원기관 간 협력체계 강화와 같은 행정적 판단에도 기초 자료로 의미가 큽니다.
