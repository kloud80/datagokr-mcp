summary_user: 경기도가 선정한 밀크스쿨 낙농체험목장을 목장 한 곳당 한 행으로 담은 현황 목록으로, 시군명·목장명·조성년도·사육두수·목장면적·주요시설·연락처·주소·위경도를 포함한다. 가족이나 교사가 "우리 시군 근처에 아이와 우유 짜기·치즈 만들기를 체험할 목장이 어디 있나"를 찾거나, 농촌관광·체험교육 기획자가 목장 분포와 규모를 파악하는 데 쓴다. 실측상 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD) 이름 매핑이나 주소·위경도 좌표로 다른 시군 통계나 지도 데이터와 이어 쓴다.
description_portal: '이 데이터는 경기도 내 낙농체험목장에 대한 정보를 제공하며, 경기도가 선정한 밀크스쿨 체험목장을 중심으로 시군별 체험 가능한 목장 현황을 수록하고 있습니다. 주요 제공 항목에는 목장명, 조성년도, 목장주명, 전화번호, 사육두수(두), 목장면적(㎡), 주요시설명, 홈페이지 주소, 소재지 주소(도로명 및 지번), 우편번호, 위도·경도 좌표가 포함됩니다. 낙농체험목장은 어린이와 보호자가 함께 젖소 관찰, 치즈 만들기, 우유 짜기, 마차 타기 등의 활동을 통해 낙농업과 농촌 문화를 생생하게 체험할 수 있는 공간으로 활용됩니다. 본 데이터는 XML 및 JSON 형식으로 제공되며, 농촌관광 활성화, 체험형 교육콘텐츠 개발, 지역사회 축산업 홍보 등에 유용하게 활용될 수 있습니다.- 밀크스쿨(Milk School): 낙농 체험을 통해 어린이와 가족에게 우유 생산 과정을 교육하고 농촌과의 유대를 강화하는 현장 체험 교육 프로그램입니다.- 낙농체험목장: 젖소 사육과 우유 가공 등을 기반으로 체험활동을 제공하는 목장 형태로, 농업과 교육, 관광을 결합한 6차 산업의 일환입니다.'
