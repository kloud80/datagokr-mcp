summary_user: 국민연금기금의 조성(연금보험료·운용수익금·국고보조금 등)과 지출(연금급여·관리운영비·복지타운관리운영비), 그 결과인 적립 누계액을 구분 항목별로 담은 집계표로, 단위는 십억 원이며 누계금액과 당기(2026년 6월), 2021~2025년 연도별 값이 열로 들어 있는 573바이트짜리 작은 CSV 파일이다. 분석가나 국민이 "국민연금기금이 지금까지 얼마나 쌓였고, 해마다 보험료와 운용수익으로 얼마가 들어와 급여로 얼마가 나갔나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 항목명이나 연도를 기준으로 수작업 대응해야 하며, 같은 기관의 기금 운용 현황·성과 데이터와 함께 보는 보조 자료로 쓴다.
description_portal: 기금 적립현황 데이터는 매입가 기준에 따라 작성된 국민연금기금의  월별 적립 현황으로, 연금보험료와 운용 수익금, 국고보조금 등으로 조성된 금액에서 연금급여, 관리운영비, 복지타운관리운영비를 지출하여 적립한 기금의 누계액입니다. 조성·지출 및 적립현황은 현금주의로 작성되었으며, 모든 수치들이 각각 반올림되어 단수차이가 발생할 수 있습니다.국고 보조금 등에는 국고보조금, 공단 사옥 임대보증금, 복지연금전입금이 해당하며,관리운영비에는 인건비, 경비, 제도사업비 등이 있습니다.
