description_portal: 본 데이터는 경기도 광주시청에서 관리하는 등록장애인 집계현황 자료입니다. 주요 제공 항목은 시군명, 읍면동명, 장애유형, 등록장애인수(합계 및 성별), 심한장애인수(합계 및 성별), 심하지 않은 장애인수(합계 및 성별), 데이터 기준일자로 구성되어 있으며, 광주시 내 장애인의 유형별 및 장애 정도별 현황을 체계적으로 수록하고 있습니다. 해당 데이터는 장애인 복지 정책 수립 및 서비스 제공의 기초자료로 활용되며, 지역별 장애인 현황 파악과 맞춤형 지원 정책 개발에 기여합니다. 또한, 성별 및 장애 정도별 통계를 통해 다양한 복지 수요를 정확히 분석할 수 있어 행정 효율성 향상에 이바지합니다.
