summary_user: 경기도 내 수화통역센터(수어통역센터)를 시설 한 곳당 한 행으로 담으며, 시군명, 사업장명, 인허가일자, 영업상태, 폐업일자, 소재지 면적, 정원, 자격소지 인원, 총인원, 지번·도로명 주소와 위경도를 포함한다. 청각장애인 가족이 가까운 수어통역센터를 찾거나, 복지 분석가가 시군별 통역센터 분포와 자격 인력 확보 수준을 비교하는 데 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)나 시군명으로 다른 경기도 시군 단위 데이터와 맞추고, 위경도로 지도 위에서 위치를 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 수화통역센터(수어통역센터)의 운영 현황을 나타내며, 청각·언어장애인의 의사소통 지원을 위한 지역 기반 통역 서비스 기관의 위치, 인력, 인허가 정보 등을 포함하고 있습니다. 수화통역센터는 공공기관 방문, 의료기관 이용, 교육 참여 등 일상생활에서 청각장애인이 겪는 소통의 장벽을 해소하기 위해 통역사를 통해 수어(수화)를 매개로 지원하는 역할을 수행합니다. 이를 통해 지역별 통역서비스 인프라의 분포와 인력 확보 상황을 파악할 수 있습니다. 이 데이터는 청각장애인의 소통권 보장, 지역 복지 서비스 균형 분석, 수어통역 인프라 확충 전략 수립 등에 기초 자료로 활용될 수 있습니다.
