description_portal: '전북특별자치도 전주시 내 어린이집의 상세 목록을 담고 있는 데이터입니다. 이 자료는 어린이집의 명칭과 함께, 국공립, 사회복지법인, 민간, 가정, 직장 등 설립 유형을 구체적으로 보여줍니다. 또한 어린이집전화번호, 어린이집팩스번호, 보육실수, 홈페이지 등 데이터를 포함하고 있어 학부모들이 자녀를 믿고 맡길 수 있는 신뢰도 높은 보육 시설을 선택하는 데 매우 유용한 정보를 제공합니다. 이 데이터는 지역별 보육 인프라의 분포와 유형별 현황을 파악하는 데 필수적인 기초 자료로 활용할 수 있습니다. 항목 : 어린이집명, 어린이집유형구분,  어린이집전화번호, 어린이집팩스번호, 보육실수, 보육실면적 등제공부서 : 전주시청 여성아동과'
