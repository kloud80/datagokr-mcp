description_portal: 성남시내 노인의료시설(노인요양시설 및 노인요양공동생활가정) 현황(종류,시설명,정원,소재지,전화번호,시설장 등)입니다. 성남시는 고령 인구의 증가에 대응하기 위해 다양한 노인 의료복지시설을 확충·운영하고 있으며, 이는 장기요양, 질환 치료, 돌봄 서비스를 통합적으로 제공하는 복합형 인프라로 기능하고 있다. 현재 성남시에는 요양병원, 노인요양시설(요양원), 치매전담형 요양시설, 노인전문병원, 공동생활가정형 장기요양기관 등 다양한 형태의 시설이 분당구, 중원구, 수정구 전역에 분포하고 있다. 이들 시설은 장기요양 1~5등급 수급자 또는 치매 진단을 받은 노인을 대상으로 의료서비스와 일상생활 지원을 함께 제공하며, 일부 기관은 물리치료·인지재활·의료진 상주 등 고도화된 전문 서비스를 갖추고 있다.
