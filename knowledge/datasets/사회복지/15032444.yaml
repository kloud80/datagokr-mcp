summary_user: 성남시 안의 노인의료복지시설(노인요양시설·노인요양공동생활가정)을 시설 한 곳당 한 행으로 담은 파일로, 종류·시설명·정원·소재지·전화번호·시설장과 데이터기준일자가 들어 있다(CSV 약 6.5KB, 범위는 성남시 한 개 시군구). 보호자나 돌봄 담당자가 '성남시 어느 구에 정원 몇 명 규모의 요양원·공동생활가정이 있고 연락처는 무엇인가'를 찾을 때, 분석가가 시 안의 요양시설 분포와 정원 규모를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·소재지 주소를 맞춰 잇는다. 건강보험 장기요양기관 목록이나 지역 고령 인구 통계에 이렇게 붙여 쓴다.
limits: 시설코드 같은 공통 키가 없어 장기요양기관·사회복지시설 목록과 연결하려면 시설명·주소를 직접 맞춰야 한다. 범위가 성남시에 한정되어 다른 시군구나 전국 비교에는 다른 지자체 데이터를 따로 모아야 한다.
