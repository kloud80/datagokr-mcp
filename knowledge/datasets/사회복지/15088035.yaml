summary_user: 대구광역시 안의 인증 사회적기업과 (예비)사회적기업을 기업 한 곳당 한 행으로 담은 목록 파일이며, 구군·기관명·업종 분류·인증번호·인증일·전화번호·사업내용·소재지 주소를 포함한다. 시민이나 사회적경제 지원 담당자가 "우리 구에서 돌봄·청소 같은 사회서비스를 하는 사회적기업은 어디이고 연락처는 무엇인가"를 찾거나, 공공구매·윤리적 소비 대상 업체를 고를 때 쓴다. 다른 데이터와 공통으로 쓸 전역 조인 키는 없으므로, 인증번호나 기관명·주소를 기준으로 사회적기업 인증 현황이나 기업 정보 데이터와 맞춰 이어 쓴다.
limits: 사업자번호 같은 표준 키가 없어 다른 기업 데이터와 연결할 때는 기관명·인증번호 매칭에 기대야 하므로 오매칭을 확인해야 한다. 범위는 대구광역시 한 곳뿐이어서 다른 시도와 비교하려면 별도 자료가 필요하다.
