description_portal: 대구광역시 (예비)사회적기업 현황 데이터입니다. (예비)사회적기업은 취약계층에게 일자리나 사회서비스를 제공하여 공공의 이익을 추구하면서 영업활동도 하는 기업입니다 인증사회적기업은 고용노동부에서 인증하며 부처형 예비사회적기업은 중앙부처에서 지역형 예비사회적기업은 자치단체장이 지정합니다. 고용창출, 사회서비스 제공, 윤리적 소비 촉진 등 다양한 사회적 가치를 실현합니다. 공공데이터를 통해 구군명, 기관명, 업종별분류, 인증번호, 인증일, 전화번호, 사업내용, 소재지 정보를 확인할 수 있습니다.
