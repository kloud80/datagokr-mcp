summary_user: 공무원연금 수급자를 연금수급기간 구간(구분)별로 나눠 퇴직연금·유족연금·장해연금의 인원과 평균 수급기간을 담은 전국 단위 집계표로, 약 1.9KB 분량의 CSV 파일 하나다. 연금 정책 분석가나 연구자가 "공무원 퇴직연금 수급자는 평균 몇 년 동안 연금을 받으며, 유족연금은 퇴직연금 기간을 포함하면 얼마나 길어지는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수급기간 구간 이름을 맞추거나 같은 기관(공무원연금공단)의 다른 통계표와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
