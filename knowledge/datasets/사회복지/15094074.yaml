description_portal: '이 데이터는 봉화군에서 출산을 장려하고 축하하기 위해 지급한 금전적 지원 현황을 정리한 것입니다. 구체적으로 보면, 출산장려금과 출산축하금 두 가지 항목으로 나뉘어 있으며, 각각 지급 대상 인원과 지급 금액이 기록되어 있습니다. 출산장려금은 출산을 장려하기 위해 일정 기준에 따라 신생아 출산 가정에게 지급되는 금전적 지원을 의미하고, 출산축하금은 출산을 축하하는 의미로 지급되는 소액의 지원금을 의미합니다. 데이터에는 지원연월, 지원 실적(명), 지원 금액(원), 기관명, 데이터 기준일자 등이 포함되어 있어, 언제 얼마나 많은 가정에 얼마의 지원이 이루어졌는지를 알 수 있도록 구성되어 있습니다.이 데이터는 봉화군이 출산을 장려하고 지원하는 정책의 집행 규모와 성과를 보여주는 통계 자료라고 할 수 있습니다. 또한, 이를 통해 출산 관련 지원 정책이 실제로 어느 정도 활용되고 있는지, 월별·연도별 지급 추세가 어떠한지 등을 분석하는 기초 자료로 활용할 수 있습니다. [컬럼별 항목 설명]지원연월: 출산장려금 및 지축하금이 지급도니 연도와 월출산장려금 지원실적:해당 월에 출산장려금을 지급받은 가정 또는 신생아 수출산장려금 지원금액: 해당 월에 지급된 총 출산장려금 금액출산축하금 지원실적: 해당 월에 출산축하금을 지급받은 가정 또는 신생아 수출산축하금 지원금액 :해당 월에 지급된 총 출산축하금 금액기관명: 지원을 집행한 기관명을 기록한 항목으로, 여기서는 봉화군으로 고정데이터기준일자: 데이터 집계 기준일'
