summary_user: 서울 성동구 안의 경로당을 한 곳씩 담은 시설 목록으로, 행정동 이름, 경로당 이름, 주소, 소유 형태(소유)를 담는다. 주민이 '우리 동네 가까운 경로당이 어디인가'를 찾거나, 분석가가 성동구 행정동별 경로당 분포와 소유 형태를 비교하는 데 쓴다. 전역 조인 키나 코드가 없어서 다른 데이터와는 동 이름이나 주소 문자열을 맞추는 방식으로만 이어 쓴다. 지역 노인복지시설·장기요양기관 목록과 지역 통계를 붙일 때도 같은 방식이다.
limits: 성동구 한 곳만 담은 파일이라 다른 구나 시도와 바로 비교할 수 없다. 시설코드 같은 공통 키가 없어 다른 데이터와 붙이려면 동명·주소를 직접 맞춰야 한다. 좌표 필드는 없다.
