summary_user: 용인시 안의 장애인 복지시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·시설구분·도로명주소·전화번호와 데이터기준일자를 담는다(파일 크기 약 4KB). 시민이 "우리 동네 가까운 장애인복지관이나 생활시설은 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 시설 유형별 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 도로명주소를 맞춰 붙여야 하며, 주소를 지오코딩해 지도·인구 자료와 겹쳐 보는 방식으로 잇는다.
description_portal: 본 데이터는 용인시 내 장애인 복지시설의 현황을 종합적으로 제공한다. 각 시설의 명칭, 시설구분, 도로명주소, 전화번호 등 기본 정보가 포함되어 있어 시설 유형별 분포와 위치를 한눈에 파악할 수 있다. 복지관, 생활시설 등 다양한 장애인 복지 관련 기관이 포함되며, 이를 통해 장애인 복지 서비스의 접근성을 분석하고, 지역사회 복지 인프라 현황을 진단할 수 있다. 또한 행정기관에서는 정책 수립, 복지 자원 배분, 장애인 지원 서비스 개선 등에 활용할 수 있으며, 시민은 가까운 복지시설 확인 및 이용 계획 수립에 도움이 된다.
