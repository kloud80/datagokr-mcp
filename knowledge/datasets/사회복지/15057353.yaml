summary_user: 경기도 내 진로직업특수교육지원센터를 기관 한 곳당 한 행으로 담은 목록으로, 시군명·기관명·관할지역·지번/도로명 주소·우편번호·위경도·전화번호·홈페이지를 포함한다. 학부모나 교육 행정 담당자가 '우리 시군의 특수교육 대상 학생 진로·직업 교육은 어느 센터가 맡고, 연락처와 위치는 어디인가'를 확인하거나 시군별 관할 누락·중복을 점검하는 데 쓴다. 전역 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)으로 다른 경기도 시군 단위 자료와 맞추거나 위경도로 지도·시설 자료와 겹쳐 쓰며, 사업자번호·인증번호 같은 기업 식별자는 실측 필드에 없다.
description_portal: 본 데이터는 경기도 내 진로직업특수교육지원센터의 현황을 정리한 자료로, 시군별로 특수교육 대상 학생의 진로 및 직업 교육을 지원하는 기관 정보를 포함합니다. 주요 항목으로는 ‘시군명’, ‘기관명’, ‘관할지역정보’, ‘소재지지번주소’, ‘소재지도로명주소’, ‘WGS84위도’, ‘WGS84경도’, ‘전화번호’, ‘홈페이지URL’ 등이 있으며, 이를 통해 센터의 지리적 위치와 관할 범위, 연락처 및 온라인 정보 등을 확인할 수 있습니다. 해당 데이터는 지역 내 진로·직업 특수교육 서비스 접근성 분석, 기관 간 관할구역 중복 또는 누락 점검, 지역 간 교육 인프라 격차 해소를 위한 기초자료로 활용 가능하며, 공공서비스 제공자와 학부모, 학생 간 원활한 연결을 위한 행정 지원 수단으로도 유용합니다.
