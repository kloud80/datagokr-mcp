description_portal: '○ 통계개요* 통계명 : 반환일시금 지급현황(연령별)* 통계종류 : 반환일시금의 수급자 및 지급액 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 국민연금제도의 업무추진 실적 및 가입자ㆍ징수ㆍ급여ㆍ기금현황 등을파악하여 연금정책 수립 및 관련 연구를 위한 기초자료로 활용하는 것을목적으로 함* 조사체계 : 지사 및 기금운용본부 → 국민연금공단* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 반환일시금의 연령별ㆍ성별 수급자수 및 지급액 등○ 용어설명* 반환일시금 : 60세 도달·사망·국외이주 등으로 국민연금에 더 이상 가입할 수 없게되었거나 연금수급요건을 채우지 못한 경우에 지급되는 급여○ 기 타* 숫자의 단위미만은 반올림하였으므로 내용의 합계와 일치하지 않을 수도 있음○ 출 처 : 국민연금공단'
