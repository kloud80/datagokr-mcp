summary_user: 전국의 사회복지시설을 시설 한 곳당 한 건으로 담은 목록으로, 시설코드·시설명·시설종류·업종·관할 시군구·대표자명·건물관리번호를 제공한다. 노인·아동·장애인·노숙인 시설 전체의 공통 마스터 역할을 하므로, 분석가나 지자체 담당자가 '우리 시군구에 어떤 종류의 복지시설이 몇 곳 있는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 복지시설 데이터와는 시설코드(FCLT_CD)·시설명 매핑이나 관할 시군구코드 같은 같은 기관 코드로만 이어 쓴다.
description_portal: 행정안전부에서 운영하는 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)에서 제공하는 사회복지시설 목록 정보로, 시설코드, 시설명, 사업자등록번호, 홈페이지주소, 시설주소, 시설전화번호, 팩스번호, 설립일자, 업종분류코드 등을 제공하고 있습니다. 데이터의 갱신주기는 일 1회입니다. 요청변수 및 출력결과는 링크를 통하여 접속한 후 데이터 상세내용 페이지에서 확인하여 주시기 바라며, 데이터에 관한 문의가 있으신 경우에는 상세 페이지에 기재된 담당부서 전화번호 또는 홈페이지 하단의 문의처&Helpdesk로 문의 바랍니다.
