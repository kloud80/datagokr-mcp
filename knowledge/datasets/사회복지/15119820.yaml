summary_user: 경기도여성가족재단이 발간한 연구보고서를 보고서 한 건당 한 행으로 정리한 목록으로, 과제유형·보고서명·연구책임자·출판년도·연구 시작·완료 연월·페이지 수·ISBN·보고서 설명 URL을 담는다. 정책담당자나 연구자가 '경기도에서 보육수요 예측이나 아동학대 대응을 다룬 선행 연구가 있는가'를 찾고 원문 링크로 넘어갈 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 보고서명·ISBN 같은 이름·코드 매핑으로만 연결한다.
description_portal: '이 데이터는 경기도여성가족재단이 발간한 연구보고서의 목록을 정리한 자료로, 보고서명, 과제유형, 연구책임자, 출판년도, 연구기간, ISBN, 페이지 수, 보고서 설명 URL 등을 포함합니다. 연구보고서는 성인지 예산, 여성친화도시, 보육수요 예측, 아동학대 대응, 차별금지법 등 다양한 여성과 가족 관련 정책 이슈를 다루며, 정책 개발 및 성평등 실현을 위한 기초자료로 활용됩니다. 데이터는 보고서의 유형(이슈분석, 정책과제 등)별로 분류되어 있어 목적별 접근이 가능하며, 보고서 URL을 통해 원문에 쉽게 접근할 수 있어 학계, 정책담당자, 시민단체 등에서 연구와 정책 수립에 직접 활용할 수 있습니다.※ 유의사항 : 이용 허락 조건은 간행물 목록에 대한 것으로, 연구보고서 각각에 대한 이용 허락 조건은 "출처표시+상업적 이용금지+변경금지"입니다.'
