summary_user: 경기도 마이데이터 통합플랫폼에 올라온 복지·채용·교육 등의 공고를 공고 한 건 단위로 담고, 공고명·공고기간·대상조건·신청방법·접수 주소·지원내용·모집인원·교부방법을 항목별로 정리한다. 경기도 주민이나 복지 담당자가 '지금 신청 기간 중인 복지 공고 가운데 내 조건에 맞는 것은 무엇이고 어디서 신청하나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 다른 데이터와는 공고명·복지카테고리 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 이 데이터는 경기도 내 다양한 복지 관련 사업, 채용, 지원 등에 대한 공고 정보를 포함하고 있으며, 각 공고의 세부정보를 항목별로 정리한 자료입니다. 주요 항목에는 복지정보코드, 공고일시, 복지카테고리, 공고명, 공고시작일자 및 종료일자, 대상조건내용, 신청방법, 접수URL주소, 지원내용, 모집인원수, 교부방법 등이 포함되어 있습니다. "복지카테고리"는 채용, 복지, 교육 등 공고의 성격을 구분하며, "대상조건내용"은 신청자격이나 제한조건을 명시합니다. 또한 "접수URL주소"를 통해 온라인 신청 경로가 제공되는 등 공고관련 상세내용이 포함되어 있어 사용자에게 구체적인 정보를 제공합니다. 이 데이터는 복지 정책 수요자 맞춤형 정보 제공, 지자체 공공일자리 매칭, 사회복지 자원 연계 등 다양한 분야에 활용될 수 있습니다.
