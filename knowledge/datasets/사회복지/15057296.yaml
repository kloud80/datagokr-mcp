summary_user: 경기도 내 특수학교를 학교 한 곳당 한 행으로 담은 현황 자료로, 시군, 공립·사립 구분, 장애영역(지적·청각 등), 인가일과 개교일, 지번·도로명 주소, 위경도 좌표, 연락처, 홈페이지를 포함한다. 학부모가 우리 시군에 청각장애 특수학교가 있는지와 그 위치를 찾거나, 분석가가 시군별 특수학교 분포와 설립 연혁을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 시군 코드·시군명(SIGUN_CD)이나 학교명으로 매핑해 다른 경기도 시군 단위 자료와 붙이고, 위경도로 지도 위 공간 결합을 한다.
description_portal: 본 데이터는 경기도 내 특수학교에 대한 기본 현황을 시군별로 정리한 자료로, 학교유형(공립/사립), 장애영역(지적장애, 청각장애 등), 학교명, 인가년월일 및 개교년월일, 학교 주소(지번 및 도로명), 위경도 좌표(WGS84 기준), 연락처, 홈페이지 URL 등의 정보를 포함하고 있습니다. 각 특수학교가 제공하는 교육 서비스의 특성과 설립 연혁을 파악할 수 있으며, 교육청이나 지방자치단체에서 특수교육 정책 수립, 지역 내 교육자원 분포 파악, 학교 배치 계획 등에 활용할 수 있습니다. 또한 위경도 정보와 주소 데이터를 통해 지도 기반의 시각화 및 공간분석도 가능하며, 대국민 서비스 제공을 위한 행정자료로도 활용도가 높습니다.
