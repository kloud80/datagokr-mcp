description_portal: 이 데이터는 아동·청소년 보호를 목적으로 운영 중인 공동생활가정 현황을 정리한 자료입니다. 시설구분, 시설명, 시설 소재지 주소, 전화번호 및 정원 등의 항목으로 구성되어 있으며, 모든 시설은 소규모 가정형 보호시설 형태로, 공동생활가정의 핵심 가치와 기능을 보장하기 위해 소규모 정원으로 운영되고 있습니다. 해당 시설들은 아동들에게 안정적인 보호와 개별 맞춤 돌봄을 제공함으로써 정서 회복, 사회성 향상 및 자립심을 강화하는데 도움을 주고 있습니다. 본 자료는 아동보호 및 복지사각지대 해소를 위한 정책 수립에 활용할 수 있습니다.
