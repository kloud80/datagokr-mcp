summary_user: 대구광역시 북구에 있는 재가노인복지시설(방문요양·방문목욕·방문간호·주야간보호·단기보호 등)을 시설 한 곳당 한 건으로 담은 목록이며, 기관명·상세 주소·전화번호를 제공한다. 북구에 사는 노인이나 가족이 집 근처에서 방문요양이나 주야간보호를 받을 수 있는 기관을 찾고 연락처를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 건강보험 장기요양기관 목록이나 사회복지시설 정보와는 기관명·주소를 맞춰 대조해야 이어 쓸 수 있다.
limits: 대구 북구 한 개 시군구만 다루므로 다른 지역이나 대구 전체 현황은 이 데이터로 알 수 없다. 시설코드 같은 공통 키가 없어 다른 데이터와 붙이려면 기관명·주소 매칭에 의존해야 한다.
