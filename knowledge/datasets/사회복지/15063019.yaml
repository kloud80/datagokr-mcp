description_portal: 본 데이터는 장애인 거주시설 중 개인 운영 시설의 현황에 대한 정보를 제공합니다. 이는 경상북도 내에서 장애인의 주거 및 일상생활 지원을 목적으로 개인이 운영하는 장애인 거주시설의 운영 실태 및 규모를 파악하는 데 목적이 있습니다.주요 내용으로는 각 시설의 고유 식별을 위한 연번과 시설이 위치한 행정 구역인 시군명 정보가 포함됩니다. 시설의 공식 명칭인 시설명과 해당 시설이 어떤 유형에 속하는지 나타내는 유형 정보가 기록되어 있습니다. 시설 운영의 이력을 알 수 있는 설치일 정보와 이용자의 접근성을 위한 소재지 및 연락처 정보도 제공됩니다.시설의 서비스 제공 역량을 나타내는 종사자수와 함께, 시설이 수용 가능한 최대 인원인 정원, 그리고 현재 실제 거주 중인 장애인 수인 현원 정보가 포함됩니다. 이 자료는 지역별 장애인 주거 복지 인프라 현황 분석, 서비스의 수급 현황 파악 및 장애인 복지 정책 수립 등에 귀중한 기초 자료로 활용됩니다.
