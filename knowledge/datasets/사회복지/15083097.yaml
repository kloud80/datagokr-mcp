description_portal: 본 데이터는 장애인 직업재활시설 현황을 제공한다. 장애인복지법에 따라 장애인의 직업능력 향상과 고용 증진을 위해 설립된 사회복지시설 운영 정보를 포함한다. 시설유형, 시설명, 소재지, 시설장,  종사자, 근로장애인 정원, 설립일자, 생산품목 등을 수록한다. 시설명은 시설 명칭이며, 시설유형은 보호작업장, 근로사업장 등 운영 형태를 구분한다. 시설장은 대표자 성명이며, 정원은 이용자 수용 가능인원이다. 장애인 직업재활시설은 일반 고용이 어려운 장애인에게 직업훈련과 취업 기회를 제공하여 자립 능력을 키우고 사회 통합을 촉진한다. 본 데이터로 지역 내 직업재활 인프라를 파악할 수 있으며, 복지 정책 수립 및 서비스 연계 기초 자료로 활용된다.
