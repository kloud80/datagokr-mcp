summary_user: 인증받았다가 취소된 사회적기업을 기업 한 곳당 한 행으로 담은 건별 원천 파일로, 범위는 전국입니다. 기업마다 기업명, 사회적기업 구분, 인증번호, 인증공고일, 사업지역, 사회적 목적, 취소일자, 부적합·보류·취소 사유가 들어 있습니다. 연구자나 지자체 담당자가 어느 지역, 어떤 유형의 사회적기업이 언제, 왜 인증을 잃었는지 살펴 지역별 생존을 분석하는 데 씁니다. 공통 조인 키는 실측 컬럼에서 확인되지 않았으므로, 사회적기업 인증 현황 데이터와는 인증번호나 기업명을 맞춰 연결해야 합니다.
description_portal: 위 데이터는 인증 사회적기업의 인증 취소내역을 제공합니다.기업명/사회적기업구분/인증번호/인증공고일/사업지역명/사회적목적/취소일자/부적합보류취소사유를 제공합니다.사회적기업 인증 정보와 함께 이용하여 연구나 지역별 사회적기업 생존 등에 사용 가능합니다.위데이터에 관련하여 문의가 있으시다면 한국사회적기업진흥원 정보화기획팀 한태휘대리(031-697-7871)로 연락부탁드리겠습니다. 감사합니다.* 취소일자나 부적합보류취소사이에 공란은 DB상 존재하지 않는 데이터이니 유의하시길 바랍니다.
