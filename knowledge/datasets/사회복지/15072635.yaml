summary_user: 경기도 내 아동돌봄공동체를 공동체 한 곳당 한 행으로, 기준년도·시군명·공동체명·구성원 수·돌봄아동 수를 담은 현황 자료다. 시군별로 주민 주도 돌봄공동체가 얼마나 있고 공동체마다 몇 명의 아동을 돌보는지 비교하려는 돌봄정책 담당자나 분석가가 쓴다. 전역 조인 키는 없으며, 다른 시설·인구 데이터와는 시군명(sigun_nm)을 이름으로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 아동돌봄공동체 운영 현황을 파악하기 위한 자료로, 기준년도, 시군명, 공동체명, 공동체구성원수, 돌봄아동수 등의 항목으로 구성되어 있습니다. 각 공동체는 지역 내 주민이나 기관이 주체가 되어 아동을 함께 돌보는 모델로, 지역사회 중심의 돌봄 시스템 구축 및 가족의 돌봄 부담을 경감하는 역할을 합니다. 데이터는 아동돌봄 수요 분석, 지역 간 돌봄 자원 분포 비교, 돌봄정책 기획 및 운영평가 등 다양한 분야에 활용될 수 있으며, 특히 공동체별 아동 수용 규모나 구성원 수를 통해 서비스 제공역량을 간접적으로 파악할 수 있습니다. 해당 자료는 지역사회 기반의 돌봄서비스 체계화를 위한 기초자료로 매우 유용합니다.※ 사업이 종료됨에 따라 2022년 3월 11일부로 갱신이 중단됩니다.
