summary_user: 서울시 365열린어린이집(시간연장형·장애아통합·24시간 운영 등 특성을 가진 시설)을 어린이집 한 곳당 한 행으로 담으며, 지역코드·자치구명, 어린이집명, 유형(국공립·민간·가정 등), 특성, 주소·전화·팩스·홈페이지, 인가일자, 정원과 보육서비스 정원을 포함한다. 맞벌이 학부모가 '우리 구에서 야간이나 주말에도 아이를 맡길 수 있는 국공립 어린이집은 어디이고 정원은 얼마인가'를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 어린이집 데이터와는 어린이집명·주소 매칭이나 같은 기관(서울시)의 코드(지역코드 ARCODE, 시설코드 STCODE 등)로만 이어 쓴다.
description_portal: 이 데이터는 서울시 365열린어린이집 정보로, 서울시 전역의 어린이집 현황과 특성을 정리한 자료입니다. 주요 항목에는 지역코드, 어린이집명, 유형(국공립, 민간, 가정 등), 어린이집 특성(시간연장형, 장애아통합, 24시간 운영 등), 주소, 전화번호, 팩스번호, 홈페이지 주소, 인가일자, 정원, 보육서비스 정원 등이 포함됩니다. 예를 들어 구로구 성은어린이집은 국공립 시설로 시간연장형 서비스를 제공하며, 노원구 상계5동보듬이나눔이어린이집은 장애아통합·24시간 운영이 가능한 어린이집으로 등록되어 있습니다. 이 데이터는 학부모가 자녀 특성에 맞는 어린이집을 선택하는 데 유용하며, 서울시 보육 정책 수립 및 관리에도 활용됩니다.
