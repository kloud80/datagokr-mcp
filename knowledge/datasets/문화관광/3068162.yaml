summary_user: 인천광역시 제물포구(포털 설명상 동구)에 등록된 여행업소를 업소 한 곳당 한 행으로 담은 건별 현황 파일로, 업종·상호명·도로명주소·전화번호가 들어 있으며 파일 크기는 1,350바이트로 작습니다. 주민이나 관광 분석가가 '이 구에 어떤 여행사가 어디에 있고 연락처는 무엇인가'를 확인하거나 구 단위 여행업 분포를 파악할 때 쓴다. 등록번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 관광사업 등록 자료나 지도 데이터와는 상호명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
