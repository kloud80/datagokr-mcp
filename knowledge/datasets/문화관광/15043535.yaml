summary_user: 제주 섭지코지 한 곳의 무장애여행 정보를 지점 단위로 담은 파일로, 장애인 주차장·화장실·산책로·전망 지점 같은 장소의 위도·경도·해발고도와 장소설명·이미지를 담는다. 휠체어 이용자나 교통약자 동행 가족이 섭지코지에서 어느 동선과 편의시설을 이용할 수 있는지 미리 확인할 때, 또는 지자체가 열린관광지 시설을 점검할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 장소 이름이나 좌표를 직접 맞춰 연결해야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 섭지코지 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다.* 섭지코지는 제주 동부 해안의 곶 지형으로, 붉은 화산송이 지형, 기암절벽, 바다 절경, 봄철 유채꽃밭, 제주 조랑말 방목지 등 자연과 문화가 어우러진 해안 관광지이다. 본 무장애 여행 정보에서는 휠체어 및 교통약자 이용자를 위해, 장애인 전용 주차장, 장애인 화장실, 접근 가능한 산책로 및 해안 동선, 주요 관광 스팟(등대, 송이길, 전망 지점 등) 정보를 포함하고 있다. 일부 구간은 경사가 15~17도까지 완만하지 않은 구간이 있어 수동휠체어 사용 시 동행 보조가 권장되지만, 전동휠체어나 동행 보조가 가능할 경우 해안절경과 자연 경관을 비교적 무장애로 즐길 수 있도록 설계된 열린관광지이다. 이 데이터는 관광약자 접근성 보장, 무장애 관광 인프라 확충 및 여행 안내, 관광 서비스 개선, 정책 수립 등에 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
