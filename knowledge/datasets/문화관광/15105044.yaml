summary_user: 국립국악원이 정리한 국악사전 항목을 한 건씩 담은 원천 데이터로, 항목마다 명칭·다른 이름, 정의와 내용, 주제 분류·핵심어, 관련 인물·장소·시대, 재생시간, 참조 자료, 저작권 정보가 들어 있고 지역 단위가 없는 전국 범위 자료다. 국악 교육자나 학생, 콘텐츠 기획자가 '특정 악기나 악곡, 국악 용어의 정의와 관련 인물·시대가 무엇인가'를 찾거나 교육 자료를 만들 때 쓴다. 다른 데이터와 맞춰 쓸 전역 조인 키는 없으며, KOPIS 공연 데이터와 이으려면 공연ID 같은 공통 키 대신 명칭(title)이나 인물(person) 이름을 대조해야 한다.
description_portal: 국립국악원에서 제공하는 국악사전 데이터는 국악과 관련된 다양한 정보를 체계적으로 정리하여 제공합니다. 자원의 명칭, 정의, 주요 책임자, 소속, 기관별 주제 분류, 핵심 주제어, 재생시간, 내용, 관련 장소, 시간적 범위, 인물, 언어, 참조 자료, 저작권 등 국악에 관한 폭넓은 정보를 포함하고 있습니다. 국악 연구자, 교육자, 학생, 문화예술 종사자 등에게 국악의 이해와 연구, 교육 자료로 활용될 수 있으며, 국악 관련 콘텐츠 개발이나 문화유산 보존에도 유용하게 쓰일 수 있습니다. 국악의 전통과 현대적 가치를 연결하는 데 중요한 자료로 활용 가능합니다.
