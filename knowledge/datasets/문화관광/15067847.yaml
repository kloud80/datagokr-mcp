summary_user: '독립기념관 한국독립운동사연구소가 발행한 독립운동 연구논문을 논문 한 편 단위로 정리한 목록으로, 제목·저자·페이지·권집·출판년도·관리번호와 원문 파일명(설명문)을 담으며 약 82KB 크기의 CSV 파일로 제공된다. 독립운동사 연구자나 학생이 특정 인물·단체(예: 신흥무관학교)를 다룬 논문이 어느 권 몇 쪽에 실렸는지 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 저자명·논문 제목 같은 이름 매칭이나 같은 기관(독립기념관)의 다른 독립운동정보 데이터와 관리번호·권집을 대조하는 방식으로만 이어 쓴다.'
description_portal: 독립기념관 한국독립운동사연구소에서 발행한 독립운동 연구논문의 자료입니다.주요 항목으로는 제목, 저자, 페이지, 권번호, 내용, 출판연도, 관리번호 수정일자 등으로 구성되어 있습니다.논문집의 구성은 연구논문 8~11편, 한국독립운동사연구소에서 발행하는 휘보(연구소일지)로 구성되어 있으며, 특집 구성시 독립기념관에서 보관하고 있는 자료소개 코너를 추가하는 경우도 있다.자료예시)논문제목                                                       저자       페이지     권수     설명문                         출판연도         검색인데스       관리번호       신흥교우보를 통해 본 신흥무관학교        김주용           3,      40,      20120103.pdf        2012               588                 20120103
