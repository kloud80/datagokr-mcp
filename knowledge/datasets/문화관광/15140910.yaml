description_portal: 이 데이터는 서울특별시 광진구 관내에서 비디오물배급업 인허가를 받아 운영 중인 업소 현황을 제공하는 공공데이터입니다. 비디오물배급업은 비디오물(영화, 다큐멘터리, 애니메이션 등)을 수입하거나 저작권을 직접 소유하거나 위탁받아 관리하며, 이를 판매하거나 대여하는 업종을 의미합니다. 배급 대상은 오프라인 유통뿐 아니라 온라인 플랫폼을 통한 유통 경로도 포함될 수 있으며, 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등의 정보가 포함되어 있습니다. 본 데이터는 지역 내 콘텐츠 유통 산업 구조 분석, 문화콘텐츠 저작권 관리, 영상 배급 경로 파악 등 다양한 정책 및 산업적 활용이 가능합니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 좌표는 포함되어 있지 않아 GIS 연동 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준으로 정기 갱신되며, 문화산업 행정, 유통업체 현황 조사 등에 활용됩니다.
