description_portal: '한국예술인복지재단의 2013년~2025년 예술활동증명 누적 완료자 데이터를 제공합니다. - 예술활동증명: 한국예술인복지재단의 예술인 복지 사업 참여를 위한 기본 절차로, 「예술인 복지법」에 따라 직업적으로 예술활동을 하고 있음을 확인하는 제도 - 예술활동증명 절차의 연도별 누적 완료자 수를 성별, 연령별, 예술활동분야별, 지역별(시도), 지역별(시군구) 기준 상세 통계 자료 제공 - 예술활동증명 방법인 일반, 신진, 특례별 누적 가입자를 제공하며, 장애예술인 예술활동증명 누적 완료 현황을 함께 제공'
