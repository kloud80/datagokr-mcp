summary_user: 국립춘천박물관 소장 유물을 한 건씩 담은 목록으로, 명칭·별칭, 분류·키워드, 크기(extent), 설명, 출토·관련 지역(spatial)과 시대(temporal), 저작권 정보, 원문 링크 등을 제공한다. 연구자나 교육·전시 기획자가 '춘천박물관에 어떤 시대·재질의 유물이 있고 어디서 출토됐는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 유물명·지역명 같은 이름 매핑이나 같은 기관(한국문화정보원 api.kcisa.kr) 계열 유물정보 API끼리만 이어 쓴다.
description_portal: 국립춘천박물관이 소장하고 있는 다양한 유물의 정보를 체계적으로 제공하는 데이터셋입니다. 유물의 명칭, 시대, 재질, 크기, 출토지 등 주요 정보를 포함하고 있어 박물관 연구, 전시 기획, 문화유산 교육 자료로 활용하기에 적합합니다. 문화재 관련 연구자, 박물관 관계자, 일반 시민 등 다양한 이용자가 유물의 세부 내역을 확인하고, 문화유산의 보존 및 활용 방안 마련에 참고할 수 있습니다. 또한, 지역 문화유산의 가치 확산과 문화관광 활성화에도 기여할 수 있는 자료로서, 문화재 정보의 접근성을 높이고 문화적 자산의 공유를 촉진합니다.
