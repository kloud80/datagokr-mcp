summary_user: 경상남도 거제시 안의 유원시설업 사업장을 한 행에 한 곳씩 담은 건별 목록으로, 종류·상호명·주소·위도·경도·전화번호·영업 상태(영업구분)·신고일자·기준일자를 담는다(파일 약 3.9KB의 소규모 CSV). 거제에서 지금 영업 중인 놀이시설이 어디에 있는지 찾는 시민이나, 시내 유원시설 분포와 신고 시점을 살피는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 위도·경도 좌표를 이용한 위치 결합으로만 이어 쓴다.
description_portal: 이 데이터는 경상남도 거제시 내 유원시설업의 현황을 제공하는 공공데이터로, 각 시설의 영업 종류, 상호명, 소재지, 위도, 경도, 전화번호, 영업상태, 신고일자, 기준일자 등의 정보를 포함하고 있습니다. 이를 통해 유원시설의 위치와 운영 여부를 쉽게 파악할 수 있으며, 관광이나 여가 활동을 계획하는 데 유용하게 활용될 수 있습니다. 또한 안전 관리나 지역 정책 수립 등 다양한 분야에서도 참고 자료로 사용될 수 있습니다. 데이터는 공공기관, 기업, 연구자, 일반 시민 등 누구나 활용할 수 있도록 제공됩니다. 정기적으로 갱신되는 이 데이터는 거제시 유원시설업의 투명한 관리와 정보 공개를 목적으로 합니다.
