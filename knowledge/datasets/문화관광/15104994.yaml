summary_user: 문화체육관광부가 제공하는 체육 분야 뉴스·소식을 기사 한 건 단위로 담으며, 제목·본문 요약·발행일·작성자·원문 주소 등을 전국 범위의 비공간 정보로 제공한다. 언론인이나 연구자가 최근 발표된 체육 정책이나 주요 체육 행사 소식을 모아 동향을 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·기관명 같은 텍스트 매칭으로만 느슨하게 연결한다.
description_portal: 체육 분야의 최신 소식과 정보를 한눈에 확인할 수 있도록 다양한 체육 관련 뉴스를 제공합니다. 주요 체육 행사, 정책 발표, 선수 동향, 스포츠 산업 소식 등 체육계 전반에 걸친 정보를 신속하게 전달하여 국민들이 체육 활동과 관련된 다양한 이슈를 쉽게 파악할 수 있도록 돕습니다. 체육에 관심 있는 일반인, 연구자, 언론인 등 다양한 이용자가 체육 정책 동향이나 주요 이슈를 파악하는 데 유용하게 활용할 수 있으며, 체육 관련 콘텐츠 제작이나 정책 분석 자료로도 활용 가능합니다. 체육계의 변화와 흐름을 이해하는 데 도움이 되는 신뢰성 높은 정보를 제공합니다.
