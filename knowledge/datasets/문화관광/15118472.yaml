summary_user: 제주관광공사 온라인면세점 관리자시스템에서 개인정보처리방침·영상기기처리방침이 개정될 때마다 올린 방침 문서를 버전별 한 건씩 담은 파일(약 579KB CSV)로, 방침 유형, 버전, 노출 상태, 방침 본문, 등록·수정 일시, 노출 장비유형을 담는다. 개인정보 보호 담당자나 감사·연구자가 '이 면세점의 개인정보처리방침은 언제 몇 번 바뀌었고 어떤 내용이 달라졌나'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 같은 기관의 온라인면세점 다른 테이블과 방침 아이디 등 이름 기준으로만 맞춰 쓴다.
description_portal: 이 데이터는 온라인면세점 관리자시스템을 통해 개인정보처리방침 또는 영상기기처리방침이 개정될 때, 관리자가 업로드하여 생성된 "방침관리" 관련 정보입니다. 총 39건의 데이터로 구성되어 있으며, 주요 항목은 방침아이디, 방침유형, 방침버전, 노출여부, 방침내용, 등록일자, 수정일자, 노출디바이스타입 등이 포함됩니다. 본 데이터는 방침의 변경 이력을 체계적으로 관리하고, 각 디바이스 유형에 따른 방침 노출 여부를 명확히 함으로써 사용자에게 투명한 정보 제공이 가능하게 합니다. 이를 활용하면 방침 변경 추이를 분석하거나, 사용자 접근성 개선, 시스템 운영의 투명성 확보, 개인정보 보호 수준 향상 등 다양한 효과를 기대할 수 있습니다. 특히, 개인정보 보호 관련 정책 수립 및 감사 대응에도 활용도가 높습니다.
