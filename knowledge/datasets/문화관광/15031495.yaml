summary_user: 성남종합운동장에서 운영하는 체육강좌를 강좌 한 건씩 담은 파일로, 시설명·장소·강좌명·수강시간·강습일·대상·정원을 담는다(csv 약 30KB). 성남 시민이 수영장 아쿠아로빅·필라테스·요가처럼 원하는 종목이 어느 시간·요일에 어떤 대상으로 열리고 정원이 몇 명인지 확인하거나, 분석가가 지역 생활체육 강좌 공급을 살피는 데 쓴다. 전역 조인 키가 없어 다른 공공 체육시설·프로그램 데이터와는 시설명·강좌명 같은 이름 매칭이나 같은 기관(성남시) 단위로만 이어 쓴다.
description_portal: 성남종합운동장의 채육프로그램정보(시설명, 장소, 강좌명, 수강시간, 강습일, 대상, 정원 등)입니다. ※ 상세한 체육프로그램 강좌는 홈페이지(https://spo.isdc.co.kr/)를 참고하세요.성남종합운동장 체육프로그램 정보 데이터는 성남시가 시민의 건강 증진과 여가 활동 활성화를 위해 운영하는 다양한 체육강좌 및 스포츠 활동 정보를 담고 있는 자료입니다. 성남종합운동장은 수영장 등 다양한 체육시설을 보유하고 있으며, 이를 기반으로 아쿠아로빅, 필라테스, 요가 등 여러 종목의 프로그램이 정기적으로 개설됩니다. 이러한 정보는 성남도시개발공사에서 관리하며, 시민들의 수강 선택을 위한 안내자료로 제공되는 동시에, 생활체육 참여 통계와 정책 수립의 기초자료로도 활용됩니다.
