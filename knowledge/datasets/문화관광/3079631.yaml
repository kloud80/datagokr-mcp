summary_user: 경기도 고양시에 있는 전통사찰을 사찰 1곳당 1행으로 담은 건별 목록 파일로, 지정번호·사찰명·창건연대·등록일·소재지·전화번호가 들어 있으며 파일 크기는 958바이트로 작습니다. 고양시에서 전통사찰로 지정된 절이 어디이고 언제 등록됐는지를 확인하려는 주민·답사객이나, 지역 불교 문화유산 분포를 정리하는 분석가가 씁니다. 전역 조인 키가 없어 다른 지역 전통사찰 현황이나 문화재 데이터와는 사찰명·지정번호나 소재지 주소를 맞춰 연결해야 합니다.
description_portal: '경기도 고양시 전통사찰 현황에 대한 데이터로 경기도 고양시 전통사찰 지정번호, 사찰명, 등록일, 소재지, 전화번호 등의 항목을 제공합니다.ㅇ 전통사찰 지정등록 현황은 전국의 불교사찰 중 민족문화의 유산으로서 보존 가치가 있는 사찰의 연도별 지정현황, 지역별 분포도를 보여 줌으로써 전통불교에 대한 미래의 문화재적 가치를 보존하는 지표로 활용ㅇ 전통사찰이 차지하는 비율- 전국의 사찰 수는 약 17,141여개로 추정*되고 있으며 이 중 전통사찰로 지정 등록된 사찰은 982개 사찰로 전체 사찰 대비 5.7% 비율을 차지하고 있음.* 출처 : 2018년 한국의 종교현황, 한국학중앙연구원, 2018ㅇ 최근 지정등록 증가 추이- 최근 3년간 "21년 4개, "22년 7개, "23년 2개 전통사찰 지정 등록- 문화유산의 미래가치를 보존 유지하기 위해 보존 가치가 있는 사찰은 이미 대다수 전통사찰로 지정 등록된 것으로 보여짐.'
