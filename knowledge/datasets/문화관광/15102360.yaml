description_portal: 이 데이터는 대구광역시 수성구에 위치한 고모령비와 영남제일관을 상공에서 촬영한 항공뷰 사진으로, 전통 구조물과 주변 지형, 도로, 인근 시설을 시각적으로 확인할 수 있도록 구성되어 있다. 고모령비는 실향민의 애환을 담은 기념비이며, 영남제일관은 영남대로 관문 역할을 한 역사적 건축물이다. 두 시설은 지역의 상징성과 역사성을 지녀 교육, 관광, 유산 보존 등 다양한 분야에서 활용된다. 고해상도 이미지는 구조물 형태, 진입로, 녹지 등을 명확히 표현하고, 계절 변화도 일부 반영되었다. 본 데이터는 공간정보 기반 행정업무 및 공공서비스 기획에 유용하며, 관련 정보와 함께 제공된다. 이용자가 위치와 주변 환경을 직관적으로 파악할 수 있도록 구성되어 있다.이미지는 JPG 파일로 제공합니다.
