summary_user: 사서가 직접 고른 추천 도서를 한 권씩 담은 목록으로, 도서명·요약·사서 추천 글·핵심 주제어·목차·발행일·소속 기관 같은 서지 메타데이터가 들어 있고 범위는 전국·비공간이다. 도서관 이용자나 교육자가 '이번 독서 프로그램에 쓸 주제별 사서 추천 도서가 무엇인가'를 찾을 때 쓰고, 출판 동향이나 추천 주제 분석에도 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 도서명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 사서들이 직접 선정하고 추천하는 다양한 도서의 정보를 한눈에 확인할 수 있도록 구성된 데이터셋입니다. 도서의 명칭, 요약, 소속 기관, 제작일, 발행일, 등급 정보, 장소, 시간적 범위 등 도서와 관련된 상세한 메타데이터를 포함하고 있어 도서관 이용자, 연구자, 교육자 등에게 유용하게 활용될 수 있습니다. 또한, 각 도서에 대한 사서의 추천 글과 핵심 주제어, 목차 정보, 관련 자원에 대한 참조 정보 등이 제공되어 도서 선택과 독서 활동에 실질적인 도움을 드립니다. 공공 도서관의 자료 관리, 독서 프로그램 기획, 출판 동향 분석 등 다양한 분야에서 활용 가능합니다.(문화체육관광부,국립세종도서관,국립중앙도서관,국립어린이청소년도서관,한국출판문화산업진흥원)
