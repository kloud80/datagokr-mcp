summary_user: 경상남도 창녕군에서 개최하는 각종 체육대회를 대회 한 건당 한 행으로 담은 파일(csv, 약 2.5KB)로, 대회명·개최장소·대회기간·주최·주관·후원·홈페이지·문의처를 담는다. 창녕군 대회에 참가하려는 선수·동호인이나 방문 수요를 따지는 지역 숙박·음식 사업자가 "올해 창녕에서 언제 어디서 어떤 대회가 열리나"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 개최장소 이름을 체육시설 목록과 맞추거나 같은 기관(창녕군) 데이터끼리 이름으로 이어 쓴다.
limits: 창녕군 한 개 시군구 범위만 담으며 대회 결과·참가자 수 같은 정보는 없다. 다른 데이터와 코드로 붙일 키가 없어 장소명·대회명 문자열 매칭에 의존해야 한다. 포털 설명상 하반기 일정은 기준일 당시 확정되지 않았고 홈페이지·문의처가 빈 행도 있다.
