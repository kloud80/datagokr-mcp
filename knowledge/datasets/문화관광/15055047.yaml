summary_user: 장수군립도서관이 구입한 도서를 도서별 한 행으로 담은 목록으로, 도서명·저자·출판사·구입 권수(단위 권)·데이터 기준일자가 들어 있고 포털 설명상 2026년 1월부터 5월 7일까지 구입분이다. 장수군 주민이나 도서관 이용자가 최근 군립도서관에 어떤 신간이 들어왔는지 확인하거나, 분석가가 작은 군 단위 공공도서관의 장서 구입 경향(출판사·분야 편중 등)을 살피는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어 도서관정보나루 등 다른 도서 데이터와는 도서명·저자·출판사 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 전북특별자치도 장수군에 소재한 장수군립도서관에서 구입한 도서 목록 현황을 데이터로 제공하고자 합니다.데이터 구성은 도서명, 저자, 출판사, 권수, 데이터 기준일자로 구성되어 있습니다.데이터 기준일자는 2026년 1월 부터 2026년 5월 7일까지를 기준으로 군립도서관에서 구입한 도서 목록입니다.데이터 중 권수에 대한 단위는 권으로 데이터 사용시 참고하시기 바랍니다.추가적인 데이터가 필요할 경우 공공데이터포털(data.go.kr) 누리집에서 데이터 제공 신청을 해주시기 바랍니다.
