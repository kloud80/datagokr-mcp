summary_user: 경기도 군포시 관내 게임제공업소를 업소 한 곳당 한 행으로 담은 파일로, 업종(인터넷컴퓨터게임시설제공업·청소년게임제공업·일반게임제공업·복합유통게임제공업·게임물제작업·게임물배급업)과 상호, 도로명 소재지, 데이터기준일자를 담는다. 군포시에서 PC방이나 청소년게임장이 어느 동네에 몇 곳 있는지 확인하려는 주민·창업 예정자, 지역 게임산업 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소를 주소 매칭·지오코딩하거나 시군구명으로 맞춰 이어 써야 한다.
description_portal: '경기도 군포시 관내 게임제공업(인터넷컴퓨터게임시설제공업, 청소년게임제공업, 일반게임제공업, 복합유통게임제공업, 게임물제작업, 게임물배급업 등 게임산업 전반)현황에 대한 데이터로 시도명, 시군구명, 업종, 상호, 소재지(도로명), 데이터기준일자 항목을 제공합니다.현재 관내 게임산업(25.11월 말 기준)○ 인터넷컴퓨터게임시설제공업 : 66건○ 청소년게임제공업 : 22건○ 복합유통게임제공업 : 10건○ 일반게임제공업 : 9건○ 게임물배급업 : 2건○ 게임물제작업 : 19건데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 분석 전용 소프트웨어를 이용해주시기 바랍니다.'
