summary_user: 서울 성북구에 있는 문화시설을 시설 한 곳당 한 행으로 담은 작은 CSV 파일(약 2.4KB)이다. 각 행에는 구분, 시설명, 도로명주소, 전화번호, 기준일자, 위도·경도, 행정동이 들어 있다. 주민이나 분석가가 "우리 동네 행정동에는 어떤 문화시설이 있고 어디에 몰려 있나"를 지도로 확인하거나 접근성을 분석할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소 문자열 매칭, 좌표 기반 공간 결합, 행정동 이름 매핑으로 잇는다.
limits: 범위가 성북구 한 곳뿐이라 서울 전역이나 다른 구와 비교하려면 구별 파일을 따로 모아야 한다. 문화시설 공통 코드(cultural_facility_cd)나 공연시설 ID(kopis_id) 같은 표준 키가 없다. 그래서 전국 문화기반시설총람이나 공연 데이터와는 이름·주소로 맞춰야 하고, 이 과정에서 매칭 오류가 생길 수 있다.
