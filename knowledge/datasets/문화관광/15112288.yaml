summary_user: 부산광역시 문화관광해설사의 집을 한 곳당 한 행으로 담은 목록 파일(csv, 약 6.8KB)로, 해설사의 집 이름·위치·주소·전화번호·하절기/동절기 운영시각·휴무일·평균 근무인원·영어/일본어/중국어 안내 가능 여부·위도·경도를 담는다. 부산 여행객이나 여행 앱 개발자가 '이 관광지 근처에서 외국어 해설을 받을 수 있는 해설사의 집은 어디이고 언제 여는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 시도·시군구명, 주소, 위도·경도 근접 매칭으로 이어 써야 한다.
limits: 관광지 코드 같은 공통 식별자가 없어 다른 관광 데이터와 정확한 키 조인이 되지 않고 이름·주소·좌표 매칭에 의존한다. 이 부문의 대표 원장은 TourAPI이며 이 지자체 파일은 보조 자료로 분류돼 있다.
