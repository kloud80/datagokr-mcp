summary_user: 대전광역시 서구에서 운영하는 생활체육교실을 프로그램(클럽) 단위로 한 줄씩 담은 파일 데이터로, 운영요일·운영시간·종목·담당 클럽명·지번/도로명 주소·법정동·신청방법이 들어 있습니다(csv 약 10KB). 서구 주민이 '우리 동네에서 평일 저녁에 배드민턴이나 요가를 배울 수 있는 곳과 신청 방법'을 찾거나, 분석가가 법정동별 생활체육 프로그램 분포를 볼 때 쓴다. 전역 조인 키는 없어 법정동명이나 주소를 기준으로 다른 서구·대전 체육시설 데이터와 이름 매칭으로 잇는다.
limits: 공통 코드 키가 없어 다른 데이터와는 법정동명·주소 문자열 매칭으로만 연결되며, 범위는 대전 서구 한 개 시군구에 한정된다. 명세상 연간 단위로 생성되는 파일이라 실시간 강좌 개설·마감 여부나 정원은 확인할 수 없다.
