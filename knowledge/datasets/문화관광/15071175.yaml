summary_user: 경상북도 관내 시도기념물을 한 건씩 담은 목록 파일로, 기념물별 명칭·종목·분류·소재지 주소·시대·지정일·지정 면적(제곱미터)·수량을 담는다. 지역 연구자나 관광 기획자가 '우리 시군에 어떤 시도기념물이 있고 언제 지정됐으며 구역 규모는 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(국가유산청 종목코드·지정번호, 소재지 PNU 등)가 없어 국가유산청 유산 API 등과는 명칭·소재지 주소를 맞춰 이어 써야 한다.
description_portal: 경상북도 관내에 지정되어 관리 중인 시도기념물의 체계적인 보존 현황을 종합적으로 제공하는 데이터입니다. 본 자료는 각 기념물의 고유 명칭과 종목, 상세 소재지 정보를 포함하여 지역별 문화유산 분포를 파악할 수 있도록 구성되어 있습니다. 또한, 해당 유적의 역사적 배경을 이해할 수 있는 시대명과 행정적 가치를 인정받은 지정일 및 분류 정보를 상세히 수록하고 있습니다. 아울러 문화재 구역의 물리적 규모를 확인할 수 있는 지정 면적($m^2$)과 수량 통계 정보를 함께 제공하여, 지역 역사 연구 및 문화 관광 자원 개발을 위한 기초 자료로 활용됩니다. 자료 관련 문의는 054-880-3165로 하시기 바랍니다.
