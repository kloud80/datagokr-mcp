summary_user: 소마미술관의 조각작품 투어 예약, 소장도서 목록, 소장품 목록, 전시정보, 입장인원을 5개 오퍼레이션으로 나눠 건별 목록 형태로 담는다(도서명·저자, 작품명·작가·크기·이미지 주소, 전시명·기간·장소 등). 미술관 관람객이나 문화시설 분석가가 '지금 소마미술관에서 어떤 전시를 언제까지 하고, 어떤 작품을 소장하고 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(문화시설 코드 등)가 없어 다른 문화시설 데이터와는 미술관명·작가명 같은 이름 매칭이나 같은 기관 코드로만 연결한다.
description_portal: 소마미술관 투어는 국민체육진흥공단에서 운영하는 소마미술관 투어 관련 정보를 제공합니다. 조각작품투어예약 정보, 미술관 소장도서 목록, 미술관 소장품 목록, 미술관 전시정보, 미술관 입장인원 정보에 대한 데이터를 조회할 수 있습니다. 국민체육진흥공단에서 운영하는 소마미술관 관련 작품이나 투어에 관한 데이터를 투어 날짜 등 조회조건를 이용하여 소마미술관 조각작품에 대한 투어 예약 정보를 조회하는 기능을 제공하는 API서비스입니다. 이 서비스는 소마미술관의 투어 일정 및 작품 정보를 제공하여 관람객의 예약 편의성과 전시 운영의 효율성을 높이는 데 활용될 수 있습니다.
