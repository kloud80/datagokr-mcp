summary_user: '아르코미술관이 2018년 기준 소장한 미디어 작품을 작품 한 건씩 담은 목록으로, 수집 구분(예: 2015 ARKO media), 작가 국·영문명, 작품 제목 국·영문, 제작연도, 상영시간, 색(컬러·흑백), 소리 유무, 자막 정보를 담는다. 연구자나 전시 기획자가 아르코미술관이 어떤 작가의 어떤 영상 작품을 몇 년도에 수집했는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름 매칭으로만 이어 쓴다.'
description_portal: 아르코미술관의 2018년도 기준으로 소장하고 있는 미디어 소장자료에 대한 정보입니다. 각 구성 항목으로는 구분, 작가국문명, 작가영문명, 타이틀국문, 타이틀영문, 년도, 시간, 색, 소리, 자막 항목으로 구성되어 있습니다. 구분 항목에는 2015 ARKO media, 2013 ARKO media 등으로 연도와 함께 ARKO media라고 나타나 있습니다. 년도 항목은 2014와 같이 숫자형식으로 연도만 나타나 있습니다. 시간은 13" 24"와 같은 형식으로 나타나 있고 색 항목은 Color와 B/W, B/W Color와 같은 항목으로 구성되어 있습니다. 소리 항목은 Sound, Silent로 구성되어 있습니다.
