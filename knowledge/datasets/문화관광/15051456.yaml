description_portal: '제주특별자치도는 잊혀져가는 제주의 주요 민속문화 자원에 대한 가치발굴과 원형보존을 위해 관련 자료를 동영상, 그래픽, 플래쉬애니메이션 등으로 디지털화하여 제공하고 있습니다.*제주속담: 사월 달 부지깽이는 땅에 꽂아도 순이 난다, 돈은 세어서 주고 세어서 받는다, 검은 닭도 하얀 달걀를 낳는다, 삼사월에 태어난 아기 저녁에 인사한다, 호박은 늙을수록 달다, 제주 뱀신의 발상(신당)표, 닭발 그리듯, 까마귀가 우니 참새도 따라 운다, 작은 고기가 가시 쎄다, 손이 놀면 입도 논다, 놓친고기가 커보인다*파일을 다운로드 하시면 관련 설명 자료가 함께 첨부되어 있습니다. ※ 추가 참고 자료: 제주도청 문화/역사/체육 분야별홈페이지 디지털콘텐츠 https://www.jeju.go.kr/culture/digitalContents/directory.htm'
