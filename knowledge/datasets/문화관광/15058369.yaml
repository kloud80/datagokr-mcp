summary_user: 경기도 시군별 휴양콘도미니엄업 사업장의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가·폐업일자, 영업상태, 양실·한실 객실 수, 면적, 건물 소유 구분, 주소와 WGS84 좌표를 포함한다. 관광 분석가나 지자체 담당자가 '경기도 어느 시군에 영업 중인 콘도가 몇 곳이고 객실은 얼마나 되는가'처럼 지역별 휴양형 숙박 수용능력을 파악하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·좌표로 다른 경기도 숙박업·관광 데이터와 맞춰 쓰며, 공중위생법 신고 기반이라 지방행정 인허가(LOCALDATA) 숙박업 자료와 같은 원천으로 비교한다.
description_portal: 이 데이터는 경기도 내 숙박업 중 휴양콘도미니엄업의 인허가 현황을 제공하며, 휴양콘도미니엄은 분양자가 사용하지 않는 기간에는 관리회사가 운영권을 위탁받아 임대료 수익을 창출하는 숙박시설 유형을 의미합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘위생업종명’, ‘위생업태명’, ‘건물소유구분명’, ‘양실수’, ‘한실수’, ‘소재지면적’, ‘다중이용업소여부’, ‘우편번호’, ‘WGS84 위도·경도’ 등이 포함됩니다. 이를 통해 휴양콘도의 위치, 운영 상태, 객실 구성, 위생·안전 관리 현황을 확인할 수 있습니다. 데이터는 경기도 31개 시군 단위로 제공되며, 지역별 숙박 인프라 분석, 관광객 수용능력 평가, 휴양형 숙박산업 정책 수립, 위생·안전 관리 점검 등에 활용할 수 있습니다. 또한 일반호텔, 여관, 펜션 등과 비교하여 콘도형 숙박업의 특성과 시장 구조를 분석하고, 관광산업 활성화 전략 및 투자 유치 기초자료로 활용이 가능합니다.
