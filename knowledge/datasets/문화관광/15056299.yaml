description_portal: '본 데이터는 제주특별자치도 제주시 체육진흥과에서 관리하는 자료로, 제주시에서 전지훈련을 실시한 스포츠 종목별 팀 수 및 참가 인원 수를 연도별로 집계한 통계 정보입니다. 골프, 육상, 수영, 야구, 유도 등 총 41개 종목을 대상으로 하며, 스포츠 훈련 인프라 운영 현황 분석 및 체육 관련 정책 수립에 필요한 기초자료로 활용됩니다. 지역경제 활성화, 체육 관광 연계 정책에도 중요한 역할을 합니다.주요 항목구분연도: 전지훈련이 실시된 기준 연도분류(팀수/인원수): 종목별 전지훈련 참가 규모를 나타내는 수치 구분스포츠 종목: 검도, 게이트볼, 골프, 근대5종 등 총 41개 종목별 데이터 제공데이터기준일: 해당 통계가 산출된 기준일자활용 목적이 데이터는 제주 지역의 계절별 전지훈련 수요 및 종목별 훈련 트렌드 분석, 체육시설 수요 예측, 유치 전략 수립 등에 활용됩니다. 데이터는 제주시 체육진흥과에서 정기적으로 집계 및 관리하며, 최신 전지훈련 유치 현황을 반영해 갱신됩니다.'
