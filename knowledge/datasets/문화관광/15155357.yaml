description_portal: 이 데이터는 주요 관광통계의 공표 일정을 공지·관리하기 위하여 구축한 통계 공표 일정 테이블이다. 각 레코드는 게시글 시퀀스(BOARD_SEQ)를 기본 식별자로 하며, 공지 제목(TITLE), 공지 내용(CONTENTS), 실제 공표일(NTCE_DE)을 함께 저장한다. 또한 부모메뉴코드(PARENT_SQ)와 자식메뉴코드(MENU_SQ)를 통해 공표 공지가 연결되는 통계메뉴 위치를 표시하고, 구분(GUBUN) 값으로 해당 통계가 ‘확정’ 또는 ‘잠정’ 공표인지 식별할 수 있도록 구성되어 있다. 아울러 사용여부(USE_AT), 최초 등록 시점(FRST_REG_DT)과 등록자 ID(FRST_REG_ID), 최종 수정 시점(LAST_MOD_DT)과 수정자 ID(LAST_MOD_ID)를 관리하여 공표 공지의 게시·수정·중지 이력을 추적할 수 있다. 이 테이블은 통계 공표 캘린더 및 공지 게시판 화면에서 연도별·월별 공표 일정을 제공하고, 공표 유형과 메뉴 위치를 연계하여 이용자와 내부 담당자가 공표 현황을 한눈에 파악하는 데 활용된다.
