summary_user: 역대 전국체육대회에서 나온 신기록을 건별로 담은 파일로, 대회구분·종목·종별·세부종목·경기구분·경기일자와 선수의 소속 시도·소속명, 실제 기록과 기존 기준기록, 대회신기록·한국신기록 같은 신기록 종류를 기록한다. 체육 분석가나 시도 체육회가 '어느 시도가 어떤 종목에서 전국체전 신기록을 가장 많이 냈는가'를 따지거나 종목별 기록 경신 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 대회 결과·선수 데이터와는 종목명·소속시도명 같은 이름을 맞춰서만 이어 쓴다.
description_portal: 대한체육회가 주관하고 전국의 시도에서 참가한 역대 전국체육대회의 신기록 명세 정보를 제공합니다.제공되는 정보는 대회 구분, 종목, 종별, 세부 종목을 명확히 분류하며, 선수들이 신기록을 달성한 경기 구분과 경기 일자를 포함합니다. 또한 선수가 속한 소속 시도와 소속명, 그리고 실제 기록과 기존의 기준 기록, 해당 신기록이 대회 신기록인지, 한국 신기록인지 등의 상세한 신기록명을 표기된 데이터를 제공합니다.좀 더 세부적인 정보가 필요하신 경우 대한체육회 또는 각 종목단체로 문의 바랍니다.
