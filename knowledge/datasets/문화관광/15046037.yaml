description_portal: '이 데이터는 한국문화예술위원회가 운영하는 한국예술디지털아카이브(구 ‘미술작가 500인’)에 등록된 미술작가 목록으로, 총 505명의 작가 정보가 포함되어 있으며 가나다 순으로 정렬되어 있습니다. 각 항목은 이름, 이형표기, 분야로 구성되어 있으며, 이형표기 항목에는 한글 이름에 대응하는 영문 표기(예: Kang Kyung Koo)가 기재되어 있어 국내외 활용을 고려한 정리 형식을 따르고 있습니다. 분야 항목에는 회화, 조각, 미술작가, 시각기타, 공예, 사진 등이 포함되며, 해당 작가의 전문 장르를 구분할 수 있도록 구성되어 있습니다. 예를 들어, 공예 작가는 총 7명, 조각 작가는 총 9명으로 확인되며, 분야별 작가 수 분석도 가능해 시각예술 내 세부 분야의 분포와 집중도를 파악하는 데 유용합니다. 이 자료는 작가 아카이브, 전시 기획, 미술사 연구, 교육자료 구축 등 다양한 목적으로 활용될 수 있습니다.'
