summary_user: 한국관광공사 '대한민국 구석구석' 사이트에 실린 국내 여행기사를 기사 한 건당 한 행으로 담은 목록 파일로, 콘텐츠 ID·분류·제목·지역(광역·시군구)·대표이미지 URL·기사 상세 URL을 전국 시군구 단위로 제공한다. 여행 앱·콘텐츠 운영자나 분석가가 '특정 시군구를 다룬 공식 여행기사가 무엇이 있고 어디서 볼 수 있나'를 찾아 링크로 안내하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 데이터와는 지역명·시군구명이나 같은 기관의 광역·시군구코드 매핑으로만 이어 쓴다.
description_portal: '- 여행 정보 확산을 통한 국내 관광 활성화 및 국민 편의 확대 등을 위해 한국관광공사 운영 국문 여행정보 제공 사이트 "대한민국 구석구석"에서는 국내 여행기사 정보를 제공하고 있습니다. - URL: korean.visitkorea.or.kr - 개방 데이터는 콘텐츠 ID, 콘텐츠분류명, 콘텐츠분류코드, 콘텐츠명, 지역명, 광역코드, 시군구명, 시군구코드, 대표이미지 URL, 기사상세 URL 총 10가지 정보로 구성됩니다. - 제공되는 여행기사는 상업적 이용 및 변경이 금지되며 활용시 출처 표기가 필수로 필요합니다. - 더 자세하고 다양한 여행기사 내용은 "대한민국 구석구석 > 여행정보 > 여행기사" 통해 확인 가능합니다. (단, 기사 내용 활용시 공공누리 유형 확인 필수)'
