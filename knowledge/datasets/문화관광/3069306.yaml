summary_user: 부산광역시 북구에 등록된 체육시설업을 시설 한 곳당 한 행으로 담은 파일로, 업종·상호·도로명 시설주소·전화번호·공영/민영 구분을 담는다. 북구 주민이 집 근처 헬스장·당구장·골프연습장 같은 체육시설을 업종별로 찾을 때 쓰고, 분석가가 공영과 민영 시설의 비중을 살필 때도 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 상호나 도로명 주소를 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 부산광역시 북구 관내에 등록된 체육시설업 현황에 관한 데이터로 업종, 상호, 시설주소, 시설전화번호, 공영민영구분 등의 항목을 제공하고 있습니다.등록된 파일명 기준이며 북구 교육체육과에 변경신고 사항 반영입니다. 업종, 상호, 시설주소, 대표자, 시설상세(구조 등 변경), 체육지도자 변경 등 변경사항은 체육시설의 설치ㆍ이용에 관한 법률 제20조 의거 필수절차입니다.본 정보는 2026년 7월 14일 기준으로 작성되었습니다. 현재 북구의 공공 및 민간 체육시설은 264개이며, 그 중 2개의 공공시설과 262개의 민간시설이 있습니다.
