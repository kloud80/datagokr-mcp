summary_user: 제주특별자치도 안에 있는 관광숙박업소를 업소 한 곳당 한 행으로 담은 파일(약 46KB CSV)로, 관광호텔·가족호텔·호스텔·소형호텔 같은 업종 구분과 상호명, 소재지, 객실수, 연락처를 담는다. 관광객이나 숙박 사업자, 분석가가 제주에 등록된 관광숙박업소가 업종별로 몇 곳인지, 어느 지역에 객실이 얼마나 몰려 있는지 알아볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 소재지 주소를 맞춰 보는 방식으로 이어야 하며, 같은 기관이 낸 관광사업 등록 데이터와 함께 보는 정도에 그친다.
description_portal: '제주특별자치도 내에 소재하고 있는 관광숙박업소 데이터를 제공합니다.항목: 구분, 상호명, 소재지, 객실수「관광진흥법」에 의거하여 관리됨- 관광호텔업 : 관광객의 숙박에 적합한 시설을 갖추어 관광객에게 이용하게 하고 숙박에 딸린 음식ㆍ운동ㆍ오락ㆍ휴양ㆍ공연 또는 연수에 적합한 시설 등 을 함께 갖추어 관광객에게 이용하게 하는 업(業)- 한국전통호텔업 : 한국전통의 건축물 + 이하 내용 관광호텔업과 같음- 가족호텔업 : 가족단위 관광객의 숙박에 적합한 시설 및 취사도구를 갖춤 + 이하 내용 관광호텔업과 같음- 호스텔업: 배낭여행객 등 개별 관광객의 숙박에 적합한 시설로서 샤워장, 취사장 등의 편의시설과 외국인 및 내국인 관광객을 위한 문화ㆍ정보 교류시설 등을 함께 갖추어 이용하게 하는 업- 소형호텔업: 관광객의 숙박에 적합한 시설을 소규모로 갖추고 숙박에 딸린 음식ㆍ운동ㆍ휴양 또는 연수에 적합한 시설을 함께 갖추어 관광객에게 이용하게 하는 업자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1034'
