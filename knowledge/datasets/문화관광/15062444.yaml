summary_user: 고양도시관리공사가 위탁운영하는 고양체육관·고양어울림누리·고양백석체육센터 등 체육문화센터의 시설별 정보를 센터명·시설명·시설현황(면적·규격·강좌명 등)·이용시간·이용요금 단위로 담은 소용량 CSV 파일(약 11KB)이다. 고양시 주민이나 방문객이 '근처 공공 수영장·체육관을 몇 시에, 얼마에 이용할 수 있나'를 확인하거나, 분석가가 지자체 공공체육시설 요금·운영시간을 비교할 때 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 센터명·시설명 같은 이름 매칭이나 같은 기관 데이터로만 연결한다.
description_portal: 경기도 고양시 고양도시관리공사에서 위탁운영하는 체육문화시설  시설명, 시설현황, 이용시간, 이용요금 등의 시설관련 자료입니다. 고양도시관리공사에서 운영하는 고양체육관, 고양어울림누리, 고양백석체육센터, 고양문화의집, 고양국민체육센터 등 주요시설의 정보를 제공하고 있습니다. 공공시설로써 일반시민들이 자유롭게 이용할 수 있으며 유무료 운영시설의 정보를 제공하고 있습니다. 시민들의 시설을 편리하게 이용하기 위한 정보를 개방공개함으로써 알권리충족 및 유익한 자료의 제공을 목적으로 합니다.
