description_portal: 성남시는 경기 남부권의 주요 문화도시로, 다양한 규모와 용도의 공연장을 갖추고 있다. 대표적으로 성남아트센터(오페라하우스, 콘서트홀, 앙상블시어터)는 대형 복합문화시설로 클래식, 뮤지컬, 연극 등 다양한 장르의 공연이 정기적으로 개최된다. 이 외에도 소공연장, 청소년수련관의 다목적홀, 지역 예술단체가 운영하는 소규모 민간 공연장이 다수 분포한다. 특히 분당, 수정, 중원 각 권역별로 문화 접근성을 고려해 균형 있게 조성되어 있으며, 문화 소외계층을 위한 프로그램이나 대관지원도 이루어진다. 이러한 공연장들은 성남시의 문화예술 진흥, 시민 여가 확대, 청년예술가 창작활동의 거점으로 기능하고 있습니다.
