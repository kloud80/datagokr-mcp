summary_user: 전국 자치단체가 관리하는 공연장업 인허가 정보를 모은 건별 원천 데이터로, 사업장명·인허가일·영업상태·주소·좌표 등을 담고 전체 2,838건이며 인허가일은 2014-05-30부터 2026-10-01까지다. 공연장이 지금 영업 중인지, 어느 주소에 있는지 알아보려는 국민이나 지역별 공연시설 현황을 분석하려는 사람이 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 주소 키로 다른 주소 기반 데이터와 잇고, KOPIS의 공연장ID(mt10id)와는 직접 맞는 키가 없어 주소로 대조해야 한다.
description_portal: '문화_공연장 데이터는 대중에게 공연을 주된 목적으로 설치하여 운영하는 시설 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 공연장업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 공연전통예술과 / 044-203-2733, 2744 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
