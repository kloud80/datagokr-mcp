description_portal: 이 데이터는 온라인면세점 입점한 브랜드의 기본적인 정보를 관리하는 데이터입니다. 브랜드 정보는 브랜드 코드, 브랜드명, 삭제여부, 값(기업형태), 등록일자, 수정일자 항목으로 구성되어 있습니다. 브랜드 코드는 각각의 브랜드를 식별할 수 있도록 중복되지 않은 숫자형식의 일련번호로 구성되어 있어 온라인면세점에서 카테고리와의 매핑, 상품코드와의 매핑, 프로모션과의 매핑을 할때 유용하게 사용하고 있습니다. 브랜드명은 브랜드에 대한 명칭을 뜻하며 한글 또는 영문으로 저장되고 있습니다. 삭제여부는 실제 해당 브랜드가 폐점을 할 경우 논리적으로 삭제여부를 바꿔 브랜드 코드를 사용하지 않도록 하고 있습니다. 또한, 값(기업형태)은 브랜드가 대기업, 중소기업, 해당없음으로 구분되어 값을 넣고 있으며 해당 값은 세관에 신고할때 사용하고 있습니다. 등록일자는 브랜드가 입점되어 시스템에 등록한 일자를 말하며, 수정일자는 브랜드 정보가 수정됐을때의 일자를 뜻합니다.
