description_portal: 서울특별시 중랑구에는 총 16게 동으로 이루어져 있으며, 각 동에는 자치회관을 운영중입니다.각 동에는 자치회관 시설이 위치해 있으며, 세개 동은 자치회관 별관을 추가로 운영중입니다.중랑구는 자치회관 활성화를 위해 힘쓰고 있으며, 누구나 쉽게 자치회관을 이용할 수 있도록 적극 홍보하고 있습니다.또한 자치회관 수강료를 면제해주거나 감면해주는 등 수강생들이 부담없이 이용할 수 있도록 지원하고 있습니다.다음은 자치회관 프로그램에 대한 정보입니다.각 동의 자치회관에 대해 동명, 프로그램명, 교육요일 및 운영시간, 교육대상, 수강료를 나타냅니다.참고해주시기 바랍니다.
