summary_user: 광주 일가정양립지원본부 행복작은도서관 한 곳이 보유한 어린이·청소년 도서를 관리번호 순으로 한 권씩 나열한 소장 목록 파일(CSV)로, 도서명·저자·출판사와 데이터기준일자를 담는다. 아이와 함께 이 도서관을 이용하려는 보호자가 원하는 동화책이나 시리즈를 이 도서관이 갖고 있는지 확인하는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어서, 다른 도서관 소장 정보나 국가서지와는 도서명·저자 문자열을 맞춰 보는 방식으로만 이어 쓴다.
limits: ISBN 등 전역 식별자가 없어 도서관정보나루나 국가서지 데이터와 정확히 연결하기 어렵고, 동명 도서나 표기 차이 때문에 이름 매칭에서 오류가 생길 수 있다. 소장 목록일 뿐이라 대출 가능 여부나 대출 이력은 확인할 수 없다.
