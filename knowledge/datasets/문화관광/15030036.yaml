summary_user: 부산광역시 연제구에 있는 영화상영관을 한 곳당 한 행으로 담은 파일로, 등록일자·상영관명·연락처·면적·도로명 소재지·관람정원을 담으며 파일 크기가 826바이트에 그칠 만큼 건수가 적다. 연제구에서 영업 중인 영화관이 어디이고 좌석 규모가 얼마인지 확인하려는 주민이나, 구 단위 문화시설 현황을 정리하는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상영관명이나 도로명 주소를 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: '부산광역시 연제구에 소재한 영화상영관 관련 데이터로 등록일자, 상영관명, 소재지, 전화번호, 면적, 관람객수 등의 항목을 제공합니다.영화: 연속적인 영상이 필름 또는 디스크 등의 디지털 매체에 담긴 저작물로서 영화상영관 등의 장소 또는 시설에서 공중(公衆)에게 관람하게 할 목적으로 제작한 것영화산업 : 영화의 제작ㆍ활용ㆍ유통ㆍ보급ㆍ수출ㆍ수입 등에 관련된 산업상영 : 영화를 공중에게 관람하도록 하는 행위영화상영관 : 영리를 목적으로 영화를 상영하는 장소 또는 시설( 다만, 연간 영화상영일수가 대통령령으로 정하는 일수의 범위 이내인 장소 또는 시설은 제외)'
