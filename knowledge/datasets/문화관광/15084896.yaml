summary_user: KTV 국민방송에서 방송된 정책이슈 콘텐츠를 콘텐츠 한 건씩 담은 목록 파일로, 2018-09-16부터 2026-07-13까지 4,876행이 들어 있다. 연구자·언론인·정책 담당자가 특정 정책 이슈로 어떤 프로그램이 언제 방송됐고 조회수는 얼마인지 찾아볼 때 쓴다. 이슈홈주소·링크주소·이미지주소 같은 주소(address) 필드가 조인 키로 확인되지만 이슈아이디·콘텐츠아이디에는 키 표시가 없어 다른 데이터와 잇는 근거는 주소 필드뿐이다.
