summary_user: 부산 전역의 해안·강변·숲·도심에 조성된 걷기길인 갈맷길을 코스·구간 단위로 담은 API입니다. 포털 설명 기준으로 9개 코스 23개 구간, 총 278.2km이며 구간별 거리·난이도·시작·중간·종료 지점과 코스 소개를 담습니다. 부산 시민이나 여행자가 "난이도가 낮은 해안 구간은 어디서 시작하나"를 찾거나, 걷기·여행 앱이 코스 안내를 채울 때 씁니다. 실측 컬럼에 전역 조인 키가 없어, TourAPI 관광 콘텐츠 등 다른 데이터와는 코스명·지점명 같은 이름 매핑으로만 이어 씁니다.
description_portal: 부산의 시민의 여가활동 및 건강 유지를 위해 개발한 부산시 갈맷길 코스 데이터를 개방합니다. 부산 갈맷길은 부산시 전역에 조성된 걷기 코스로 2009년 부산시민 공모를 통해 갈매기와 길을 합성한 명칭입니다. 해안, 강변, 숲, 도심 전지역에 걸쳐 조성되어 있습니다. 참고로 갈매는 순 우리말로 깊은 바다 라는 뜻이 있습니다.개방된 데이터에는 코스, 구간, 구간별 거리, 난이도, 시작지점, 중간지점, 종료지점, 코스요약, 코스 소개로 구성되어 있습니다.총 9개 코스 23개 구간으로 구성되어 있으며 난이도 상 3개 구간, 중 15개 구간, 하 5개 구간입니다. 가장 긴 구간은 1코스 2구간 기장군청에서 송정해수욕장 까지로 15.2km이고 가장 짧은 구간은 8코스 2구간 동천교에서 민락교 까지 7.0km입니다. 갈맷길 총 길이는 278.2km입니다. 개방된 데이터의 갈맷길 정보를 통해 부산 갈맷길을 걸으며 여가활동을 하면 좋을것입니다.
