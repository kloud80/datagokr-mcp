description_portal: 한국언론진흥재단 미디어연구센터에서 정부광고 수수료를 활용하여 제작한 조사연구 자료입니다. 유튜브 이용자들의 유튜버에 대한 인식을 주제로 진행된 사회적 이슈 관련 일회성 조사로, 동영상 플랫폼의 급속한 성장과 함께 새로운 미디어 주체로 부상한 유튜버에 대한 이용자들의 인식과 평가를 체계적으로 분석했습니다. 유튜버의 사회적 영향력, 콘텐츠 신뢰도, 전문성 평가, 윤리적 책임에 대한 인식 등을 조사했으며, 전통 미디어와 비교한 유튜버의 위상과 역할에 대한 시민 의식을 파악했습니다. 1인 크리에이터 중심의 새로운 미디어 생태계에서 콘텐츠 생산자와 소비자 간의 관계 변화를 이해하는 데 중요한 통찰을 제공합니다. 조사연구에 대한 PDF 파일 형태로 제공되며, 공공누리 공공저작물 자유이용허락 조건에 따라 연구 목적으로 자유롭게 활용할 수 있습니다.
