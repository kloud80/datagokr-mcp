summary_user: 한국언론진흥재단 미디어연구센터가 유튜브 이용자들의 유튜버 인식(사회적 영향력, 콘텐츠 신뢰도, 전문성, 윤리적 책임, 전통 미디어와의 비교)을 조사한 일회성 연구 결과를 담은 전국 범위의 집계 자료로, 응답자 구분(대분류·중분류·소분류)별 사례수 형태의 PDF 파일(약 14KB)이다. 연구자나 언론·미디어 정책 분석가가 "유튜브 이용자들은 유튜버를 기존 언론과 비교해 얼마나 신뢰하고 어떤 책임을 기대하는가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 응답자 구분 이름을 맞추거나 같은 기관의 다른 미디어이슈 조사와 주제별로 나란히 비교하는 방식으로만 이어 쓴다.
