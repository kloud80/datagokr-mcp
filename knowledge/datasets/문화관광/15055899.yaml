summary_user: 한국지식재산연구원 지식재산전문도서관이 소장한 특허·상표·디자인·저작권·지식재산 정책 등 분야 도서의 서지정보를 자료 한 건씩 담은 목록 파일(CSV, 약 1.6MB)로, 자료명·저자·발행지·발행년을 담는다. 연구자·학생·기업 실무자가 '특정 지식재산 주제나 저자의 전문도서가 이 도서관에 있는지, 언제 발행됐는지'를 찾을 때 쓴다. 실측 컬럼에 ISBN·도서관코드 같은 전역 조인 키가 없어 다른 도서관 목록이나 도서관정보나루 데이터와는 자료명·저자 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 본 서비스는 지식재산과 관련된 다양한 도서정보를 제공하여 이용자들이 필요한 전문자료를 쉽고 편리하게 찾을 수 있도록 지원합니다. 특허, 상표, 디자인, 저작권, 기술사업화, 지식재산 정책 등 다양한 분야의 전문도서와 참고자료에 대한 정보를 체계적으로 제공하며, 연구자, 학생, 기업 관계자 및 일반 이용자 모두에게 유용한 학습과 연구 자료를 안내합니다. 또한 최신 발간 도서와 분야별 추천도서를 통해 지식재산에 대한 이해를 높이고 전문성을 향상시킬 수 있도록 돕습니다. 이를 통해 이용자들은 신뢰할 수 있는 도서정보를 바탕으로 지식재산 관련 연구와 학습, 실무에 필요한 자료를 효율적으로 활용할 수 있으며, 지식재산 분야의 지속적인 역량 강화와 정보 접근성 향상에 도움을 받으실 수 있습니다.
