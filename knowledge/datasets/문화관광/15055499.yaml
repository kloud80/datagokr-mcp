summary_user: 부산광역시 남구 관내 체육시설업소를 한 줄에 한 곳씩 담은 명부 파일로, 업종·상호·도로명주소·전화번호를 담는다(CSV 약 21.8KB). 남구 주민이 집 근처 헬스장·체육도장 같은 체육시설을 찾거나, 분석가가 남구 안 업종별 민간 체육시설 분포와 개폐업 흐름을 상권 신호로 볼 때 쓴다. 전역 조인 키나 인허가번호가 없어 다른 데이터와는 도로명주소나 상호 문자열 매칭으로만 잇고, 같은 남구 기관의 다른 업종 현황 파일과 나란히 보는 정도로 연결한다.
description_portal: 「부산광역시 남구_체육시설업현황」 데이터는 남구 관내에서 운영 중인 각종 체육시설업(헬스장, 요가·필라테스, 무도학원, 수영장 등)의 설치 및 영업 현황을 체계적으로 파악하기 위해 구축된 생활·체육 기반 자료입니다. 본 데이터에는 업소명, 소재지, 연락처 등의 정보가 포함됩니다. 이를 통해 지역 내 체육 인프라 분포 파악, 주민 건강·여가활동 지원 정책 수립, 안전점검 계획 마련, 취약시설 관리, 체육산업 활성화 등 행정·정책적 활용이 가능합니다. 또한 생활체육 참여 확대, 운동시설 접근성 개선, 지역사회 건강 증진 등 남구의 체육·건강환경 조성에 기여하는 필수 공공데이터입니다.
