summary_user: 한라산 둘레길(제주특별자치도)의 코스별 이름, 거리(km), 시점·종점, 데이터 기준일을 코스 한 줄씩 담은 목록 파일로, 포털 설명상 2021년 기준이다. 도보 여행자나 관광 안내 서비스 담당자가 '한라산 둘레길 중 어느 코스가 얼마나 길고 어디서 어디까지 잇는가'를 확인해 트레킹 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키나 TourAPI 콘텐츠ID·지역코드가 없어 다른 관광 데이터와는 코스명·지점명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터셋은 2021년 기준으로 한라산 둘레길(제주특별자치도)의 각 코스별 정보를 정리한 것으로, 각 코스의 이름, 거리, 출발 지점(시점), 도착 지점(종점) 정보가 포함되어 있다. 데이터 제공기관은 제주특별자치도청이며, 데이터 형식은 CSV로 누구나 별도 비용 없이 다운로드 가능하다. 해당 정보는 제주 내 도보 여행, 생태관광, 지역 관광 인프라 조사, 관광 안내 시스템 구축 등에 활용 가능하다. 예컨대, 어떤 코스가 얼마나 긴지, 어느 구간을 잇는지 등을 기반으로 트레킹 계획을 세우거나 관광자원 분포를 분석할 수 있다. 다만 2021년을 기준으로 작성된 데이터로, 이후 코스 변경이나 관리 상태 변동이 있을 경우 반영되지 않았을 수 있다.
