summary_user: 제주특별자치도의 2015~2016년 관광객 유동인구를 기준년월별·250m×250m 격자별로 집계해, 0시부터 24시까지 1시간 단위 유동인구와 시간대별 비율을 담은 파일 데이터이다. 관광 분석가나 지역 사업자가 '제주에서 관광객이 몰리는 격자는 어디이며 몇 시에 붐비는가'를 확인하는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어, 다른 데이터와는 격자 좌표를 지도 위에서 공간 매핑하거나 이름·코드를 별도로 맞춰야 이어 쓸 수 있다.
limits: 관광지점코드·시군구코드 등 표준 키가 없어 관광지점 입장객이나 시군구 통계와 바로 조인되지 않는다. 범위는 제주 한 시도의 2015~2016년 시점이므로 최근 추세 분석에는 맞지 않는다. 포털 설명에 따르면 유동인구 수는 비율 추정 탓에 소수점으로 나오고, 중복 카운트가 있어 실제 방문객 수로 읽으면 안 된다.
