summary_user: KTV 국민방송에서 방영된 특집 프로그램을 영상 콘텐츠 1건 단위로 담은 목록으로, 제목·프로그램명·카테고리·회차·방송일시·재생시간·조회수·영상 링크와 섬네일 주소를 포함하며 약 4.7MB 크기의 CSV 파일로 받는다. 연구자나 시청자가 '어떤 특집 프로그램이 언제 방송됐고 조회수가 얼마나 되는가'를 확인하거나 특집 방송 아카이브·추천 목록을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 데이터와는 프로그램명·카테고리명 같은 이름 매핑이나 같은 기관(한국정책방송원)의 다른 KTV 프로그램 목록과 콘텐츠·프로그램 아이디로만 이어 쓴다.
description_portal: KTV 국민방송에서 방영된 특집 프로그램의 목록과 관련 정보를 상세히 제공하는 데이터입니다. 콘텐츠 아이디, 제목, 프로그램명, 카테고리, 전체영상 여부, 섬네일 주소, 링크 주소, 조회수, 프로그램 회차, 방송일, 방송시간, 재생시간, 등록일 등 다양한 항목을 포함하고 있습니다. 이를 통해 특집 프로그램의 방송 내역을 체계적으로 파악할 수 있으며, 방송사, 연구자, 일반 시청자 등은 이를 활용해 특집 프로그램의 트렌드 분석, 시청 기록 관리, 미디어 콘텐츠 추천, 아카이브 구축 등 다양한 목적으로 사용할 수 있습니다. 또한 미디어 산업 동향 연구, 프로그램 편성 전략 수립, 시청자 맞춤형 서비스 개발에도 유용한 기초 자료가 됩니다.
