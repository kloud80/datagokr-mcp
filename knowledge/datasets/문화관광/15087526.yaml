description_portal: '문화재 야행사업 지원 현황은 국민의 문화재에 대한 인식을 고양하고 향유를 촉진하기 위한 문화재 활용사업 현황을 파악할 수 있다.“국가유산청_문화재 야행사업 지원 현황”은 문화재 야행(夜行) 사업에 대한 지원 실적과 현황을 정리한 데이터입니다. 문화재 야행 사업은 야간에 문화재를 활용한 다양한 체험과 행사를 통해 국민들의 문화유산 향유 기회를 확대하고 지역 문화 활성화를 도모하는 사업으로, 이 데이터는 전국에서 진행되는 야행 사업의 지원 대상, 지원 금액, 사업 내용, 참여 기관 및 성과 등을 체계적으로 관리하고 분석하는 데 활용됩니다.📌 기본 정보대상 사업: 문화재 야행사업주요 내용: 사업별 지원 현황(지원 기관, 지원 금액, 사업 내용, 참여 인원 등)목적: 문화재 야간 활용 활성화 및 지역 문화 진흥데이터 형태: 표 형식(엑셀, 데이터베이스 등)🛠 데이터 구성사업명 및 위치: 사업이 진행되는 지역 및 문화재 명지원 기관 및 주관 단체: 해당 사업을 지원하거나 운영하는 기관 정보지원 규모 및 예산: 지원 금액과 집행 내역사업 내용 및 행사 개요: 야간 문화재 관람, 체험, 공연, 전시 등 구체적 프로그램참여 인원 및 성과 지표: 방문객 수, 참여자 만족도, 지역 경제 효과 등🎯 활용 분야정책 평가 및 개선: 사업 효과 분석과 지원 정책 수립문화재 홍보 및 관광 활성화: 지역 문화재 야간 관광 활성화 전략 수립학술 연구: 문화재 활용과 지역 문화 활성화 사례 연구행사 기획 및 운영 지원: 향후 야행 사업 기획 시 참고 자료이 데이터는 문화재 야행 사업 전반의 지원 실적을 체계적으로 파악하고, 문화재의 야간 활용을 촉진하며 지역 문화 발전에 기여하는 중요한 자료로 활용됩니다.'
