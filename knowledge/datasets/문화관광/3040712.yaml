summary_user: 부산광역시 연제구에 신고된 체육시설업 업체를 한 곳씩 업종·상호·도로명 시설주소로 담은 건별 명부 파일(CSV 약 20KB)이다. 연제구에서 헬스장·당구장·골프연습장 같은 업종별 업체가 어디에 몇 곳 있는지 확인하거나 민간 체육시설을 상권 분석의 한 축으로 보려는 사업자·분석가가 쓴다. 공통 조인 키는 없으므로 다른 데이터와는 도로명 주소를 지오코딩하거나 상호·업종 이름을 맞춰 연결하고, 같은 구의 다른 인허가·상권 자료와는 주소 기준으로 붙여 쓴다.
