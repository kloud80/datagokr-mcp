description_portal: 전북특별자치도 무주군의 관광코스 현황을 매년 갱신하여 파일데이터로 제공하고 있습니다.해당 데이터는 공공데이터 중장기 개방계획의 일환으로 2026년 개방계획을 수립하여 조기개방 대상으로 파일데이터 형식으로 작성하였습니다.테마명(일정여행,사계여행,역사여행,자연여행), 계절(봄,여름,가을,겨울), 코스 명칭, 주소, 홈페이지, 연락처, 코스 소개, 교통정보, 데이터 기준일자 등으로 구성되었으며 1년 주기로 데이터를 갱신하여 관리합니다. (추후 필요한 사항이 발견되면 더 추가 할 예정입니다.)해당 데이터는 전북특별자치도 무주군 행정복지국 관광진흥과 관광정책팀에서 관리하고 있으며 자세한 내용은 063-320-2559(관광진흥과)로 연락주시기 바랍니다.
