description_portal: 공공누리시스템을 통해 제공되는 우수저작물 중 웹툰 분야의 저작물 정보를 한눈에 확인할 수 있는 데이터셋입니다. 저작물코드, 저작물명, 적용일, 분류코드, 분류명, 형태명, 형태코드, 저작물URL, 썸네일파일경로, 공개여부, 조회수, 키워드명, 게시판코드, 게시판명 등 다양한 항목으로 구성되어 있어 웹툰 저작물의 관리 및 활용에 유용합니다. 웹툰 관련 콘텐츠 기획, 저작권 관리, 문화산업 연구, 데이터 기반 서비스 개발 등 다양한 분야에서 활용할 수 있으며, 우수저작물의 현황 파악과 정책 수립에도 도움이 됩니다. 또한 웹툰 산업의 발전과 공공저작물의 개방 확대에 기여할 수 있는 자료로서, 창작자와 연구자, 정책 담당자 등에게 실질적인 정보를 제공합니다.
