summary_user: 경기도 안양시 시립도서관 소속 작은도서관을 한 곳당 한 행으로 정리한 목록 파일로, 이름·주소·우편번호·전화번호와 운영시간·휴관일·대출안내·상호대차 여부·장서수·면적·열람석 수를 담는다. 안양시민이 집 근처에서 주말에 문을 열고 상호대차가 되는 작은도서관을 찾거나, 분석가가 시내 작은도서관의 장서·열람석 규모를 비교하는 데 쓴다. 전역 조인 키(도서관코드 등)가 없어 다른 도서관 데이터와는 작은도서관명이나 주소를 맞춰 이어 써야 한다.
description_portal: 본 데이터는 경기도 안양시에 위치한 시립도서관의 작은도서관의 운영 현황을 정리한 정보입니다. 각 도서관별로 도서관명, 주소, 우편번호, 전화번호 등 기본 정보와 함께 운영시간, 휴관일, 대출안내, 상호대차 여부, 장서수, 면적, 열람석 수 등의 세부사항을 포함하고 있습니다. 시민들이 가까운 생활권 내에서 독서 및 학습 활동을 원활히 수행할 수 있도록 돕는 생활밀착형 문화시설로서의 역할을 강조하며, 정보 접근성과 이용 편의성을 높이기 위한 목적을 가집니다. 해당 데이터는 지역 독서문화 확산과 공공서비스 향상을 위한 기초자료로 활용될 수 있으며, 안양시의 문화 인프라 현황을 파악하는 데에도 유용합니다.
