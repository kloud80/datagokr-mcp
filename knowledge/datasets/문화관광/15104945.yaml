summary_user: 국립제주박물관 소장 유물을 한 점씩 기록한 원천 목록으로, 명칭·이칭, 국적·시대(temporal), 크기(extent), 관련 인물, 언어, 주제 분류·키워드, 공간 범위, 저작권 정보를 담는다. 연구자나 교사가 '제주 지역 유물 가운데 특정 시대나 주제에 해당하는 것은 무엇이고 이미지·설명을 교육 자료에 써도 되는가'를 확인할 때 쓴다. 다른 데이터와 묶을 전역 조인 키는 없으므로, 다른 박물관 소장품 데이터와는 유물 명칭·시대·키워드를 텍스트로 맞추거나 같은 기관 기준으로만 연결한다.
description_portal: 국립제주박물관에서 소장하고 있는 다양한 유물에 대한 상세 정보를 제공하는 데이터셋입니다. 유물의 명칭, 국적 및 시대, 재질, 크기, 관련 인물, 언어, 저작권 정보 등 폭넓은 항목이 포함되어 있어 연구자, 교육자, 문화예술 종사자 등에게 유용하게 활용될 수 있습니다. 또한 유물의 소속, 주제 분류, 핵심 키워드, 공간 및 시간적 범위 등도 함께 제공되어, 제주 지역의 역사와 문화를 심층적으로 이해하는 데 도움을 줍니다. 문화유산 연구, 전시 기획, 교육 자료 개발 등 다양한 분야에서 활용 가능하며, 문화재의 보존과 가치 확산에 기여할 수 있습니다.
