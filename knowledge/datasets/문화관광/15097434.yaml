summary_user: 제주 서귀포 퍼시픽마리나요트공원 인근의 음식점·카페·편의점·숙박시설·관광지 등을 시설 한 곳당 한 행으로 정리한 목록으로, 명칭·거리(km)·주소·전화번호와 휠체어 진입 여부, 장애인 화장실 여부를 담는다. 휠체어 이용자나 영유아 동반 가족이 '요트공원 근처에서 휠체어로 들어갈 수 있고 장애인 화장실이 있는 식당이나 숙소가 어디인가'를 찾을 때, 또는 지자체가 무장애 관광지도를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 시설 명칭이나 주소를 직접 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 내 제주특별자치도_퍼시픽마리나요트공원_무장애주변관광지 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도에서 제공하는 퍼시픽마리나요트공원 인근의 무장애 여행 가능 주변 관광시설 정보를 정리한 통계자료입니다. 본 자료는 음식점, 카페·편의점, 숙박시설, 관광지 등 다양한 유형의 시설들에 대해 명칭, 거리, 주소, 연락처, 휠체어 진입 가능 여부 및 장애인 화장실 제공 여부 등의 접근성 정보를 포함하고 있어 장애인, 노약자, 영유아 동반 가족 등 관광약자의 이동·이용 여건을 객관적으로 파악할 수 있습니다. 또한 해당 정보는 무장애 관광 지도 제작, 관광접근성 개선, 정책 수립 및 평가 등 관광서비스 개선과 행정지원의 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
