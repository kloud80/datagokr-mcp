summary_user: 부산광역시 금정구에 있는 국가지정(등록)·부산광역시지정(등록) 국가유산을 한 건씩 담은 목록 파일로, 유산명·종별·지정번호·지정일자·시대·소재지·관리주체·위도·경도 등을 담는다(포털 설명 기준 2025년 8월 28일 현재 총 138건, 대부분 범어사 소재). 금정구 주민·관광객·지역 연구자가 '금정구에 어떤 보물·유형문화유산이 어디에 있고 누가 관리하나'를 확인하거나 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 국가유산청 자체 API 등과는 유산명·종별·지정번호를 맞춰 잇고, 위도·경도와 소재지로 위치 기반 연계를 하며, 같은 기관 자료와는 기관코드로 묶는다.
description_portal: 2025. 8. 28.기준 부산광역시 금정구 소재 국가지정(등록) 및 부산광역시지정(등록) 국가유산 현황입니다.국가지정(등록)유산은  국보2개, 보물13개,사적1개, 천연기념물1개 ,민속유산1개, 등록유산3개로 총 21개이고,시지정(등록)유산은 유형문화유산 70개, 무형유산1개, 자연유산1개, 기념물2개, 민속문화유산3개, 문화유산자료38개, 등록유산2개로 총 117개이며,총 138개의 국가유산이 금정구에 소재하고 있습니다. 금정구 대부분의 유산은 범어사에 있는것으로 파악됩니다.
