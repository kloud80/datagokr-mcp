summary_user: 빅카인즈(BIGKinds)에 수록된 국내 신문·방송의 게임 관련 기사를 기사 한 건당 한 행으로 담은 메타데이터로, 보도 일자·언론사·제목·통합 분류·키워드·특성추출어를 포함한다(CSV 약 20.8MB, 전국·비공간). 연구자나 산업·정책 분석가가 'e스포츠나 게임 중독 같은 주제가 시기별로 어느 언론사에서 얼마나, 어떤 키워드로 보도됐는가'를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자·언론사명·키워드 같은 텍스트 값을 맞춰 연결해야 하며, 같은 재단의 다른 주제별 뉴스빅데이터 메타데이터와 같은 필드 구성으로 나란히 비교하는 방식이 현실적이다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 게임 관련 뉴스 메타정보 자료입니다. 게임은 단순한 오락을 넘어 문화 산업과 디지털 경제의 핵심 요소로 자리 잡았으며, 청소년 문화, 글로벌 e스포츠, 신기술 접목, 사회적 논란 등 다양한 맥락에서 언론 보도의 주제로 다뤄지고 있습니다. 본 자료는 국내 주요 신문과 방송 보도에서 게임과 관련된 기사들을 분석하여 주요 키워드와 등장 빈도를 추출하고, 시기별 보도 경향과 사회적 인식 변화를 살펴볼 수 있도록 구성되었습니다. 이를 통해 게임 산업 발전, 청소년 보호를 위한 규제와 자율성 논의, e스포츠의 성장, 게임 중독 논란, 글로벌 시장에서의 경쟁력 등이 언론 담론 속에서 어떻게 다루어졌는지를 객관적으로 확인할 수 있습니다. 또한 학술 연구, 산업 분석, 정책 수립, 교육 현장에서 활용 가능한 기초 자료로, 게임이 현대 사회에서 가지는 문화적·경제적 의미를 심층적으로 이해하는 데 기여할 수 있습니다.
