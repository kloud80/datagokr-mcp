summary_user: 제주국제자유도시개발센터가 운영하는 제주항공우주박물관의 소장 유물을 한 점씩 담은 목록으로, 유물번호·세부번호별로 명칭, 수량, 작자·제작처, 국적·시대, 장르, 주재질을 기록한다(CSV 약 34KB). 연구자나 전시 기획자가 '이 박물관이 어떤 시대·재질의 항공우주 유물을 몇 점 갖고 있는가'를 확인할 때 쓴다. 다른 데이터와 이을 공통 조인 키(문화시설코드 등)가 없어, 다른 박물관 소장품 목록과는 명칭·장르·재질 같은 항목을 글자로 맞춰 비교하는 정도로만 연결한다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주항공우주박물관의 2020년 기준 유물(소장품) 현황에 대한 정보를 담고 있습니다. 각 유물은 소장구분, 유물번호, 세부번호, 명칭, 주수량, 작자 및 제작처, 국적·시대, 장르, 재질1 등의 항목으로 구성되어 있습니다. 소장구분은 유물의 소유 또는 관리 유형을 나타내며, 유물번호 및 세부번호는 각각 고유 식별자와 세부 식별을 위한 정보로 활용됩니다. 명칭은 해당 유물의 이름이나 명확한 식별을 위한 설명이며, 주수량은 유물의 기본 단위 수량을 나타냅니다. 작자 및 제작처 항목은 해당 유물을 만든 인물 또는 기관을 나타내고, 국적·시대 항목은 유물의 출신 국가와 역사적 시대 구분을 포함합니다. 장르는 유물의 용도나 형식에 따른 분류이며, 재질1 항목은 유물의 주된 소재를 나타냅니다. 이 재질 항목에는 ‘금속 및 철제’, ‘지 및 양지’, ‘피모 및 기타’, ‘금속 및 복합금속’ 등 다양한 재료 유형이 포함되어 있어 유물의 물리적 특성을 분류하고 관리하는 데 활용됩니다. 해당 정보는 박물관 유물의 체계적인 보존과 전시 기획, 학술연구, 문화재 정책 수립 등을 위한 기초 자료로 유용하게 쓰일 수 있습니다.
