summary_user: 춘천시 관내에서 열리는 공연행사를 행사 건별로 담은 원천 데이터로, 행사명·장소·기간과 시각·관람요금·입장연령·할인·예매정보·주차장 여부·주소와 좌표를 함께 제공한다. 춘천 시민이나 관광객이 이번 주말 춘천에서 볼 만한 공연과 요금·예매 방법을 찾을 때, 또는 분석가가 시내 공연 개최 장소 분포를 지도에 올릴 때 쓴다. 전역 조인 키나 KOPIS 공연ID(mt20id)는 없으므로 KOPIS 공연 목록과는 행사명·장소명 매칭으로, 다른 공간 데이터와는 주소·위경도(latitude, longtitude)로 잇는다.
description_portal: 강원도 춘천시의 관내 공연행사 데이터로 행사명, 장소, 행사내용, 행사시작일자, 행사종료일자, 행사시작시각, 행사종료시각, 요금정보, 주관기관, 주최기관, 전화번호, 후원기관, 객석수, 관람요금, 입장연령, 할인정보, 유의사항, 홈페이지주소, 예매정보, 주차장보유여부 등에 대한 데이터를 제공합니다.
