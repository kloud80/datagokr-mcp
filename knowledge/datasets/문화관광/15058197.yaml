summary_user: 경기도 31개 시군의 헬스장·피트니스센터 등 체력단련장업 인허가 건을 사업장 단위로 담으며, 인허가·폐업일자, 영업상태, 지도자 수, 회원모집 인원, 건물 연면적, 보험가입 여부, 주소와 WGS84 좌표를 포함한다. 주민이 우리 동네에서 영업 중인 헬스장을 찾거나, 분석가가 시군별 체력단련장 분포와 폐업 추이를 지도로 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 시군명·주소 문자열 매핑, 또는 좌표를 이용한 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군의 체력 단련장 업체 인허가 현황을 제공하는 자료로, 헬스장, 피트니스센터 등 체격관리 및 체력 증진을 위한 운동시설을 포함합니다. 총 32개 항목으로 구성되며, 사업장명, 인허가일자, 영업상태, 위치정보(WGS84 좌표 포함), 지도자 수, 회원모집 가능 인원, 건축물 정보(동수, 연면적), 업태 및 세부업종명, 보험가입 여부 등의 정보를 포함합니다. 특히 위치 기반 분석과 시군별 현황 파악, 체육시설 분포 지도화 등에 활용될 수 있으며, 공공 및 민간 운영 여부에 따른 정책 수립에도 유용합니다. 데이터는 행정안전부에서 주간 단위로 제공하며, Open API를 통해 시스템 간 연계 사용이 가능합니다.
