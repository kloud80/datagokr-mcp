description_portal: 국립중앙박물관 교육 통합 플랫폼 "모두(MODU)"는 국립중앙박물관 및 소속 13개 박물관의 교육 콘텐츠(동영상, 활동지 등)를 통합 제공하는 플랫폼이다. 교육통합플랫폼 "모두"는 이용자 현황을 파악하기 위해 날짜별로 페이지뷰수, 사이트 방문횟수, 콘텐츠 조회수, 활용 콘텐츠 수를 확인하고 있다. 통계자료는 2022년 4월 14일부터 2025년 11월 10일까지의 통계를 산출하였다. 평균적으로 하루에 페이지뷰수는 3~5천회 ,사이트 방문횟수는 2~4천회, 콘텐츠 조회수는 1천회이다.
