summary_user: 제주도를 찾은 내국인 관광객 수를 월별로 집계한 통계로, 여행 형태(개별여행·부분패키지·패키지)와 방문 목적(레저스포츠·회의및업무·휴양및관람·친지방문·교육여행·기타)별 인원을 담는다(CSV 약 1.4KB의 작은 집계 파일). 관광업 사업자나 분석가가 '최근 제주 내국인 관광객 중 개별여행 비중이 얼마나 늘었고, 어느 달에 교육여행 방문이 몰리는가'를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 기준 연월(구분연월)을 맞춰 제주 관련 월별 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '제주특별자치도를 방문하는 입도 관광객의 현황 통계 데이터를 제공합니다.항목: 월별 내국인 형태별, 목적별 방문자 수 (잠정 집계 기준)*형태별: 개별여행, 부분패키지, 패키지*목적별: 레저스포츠, 회의및업무, 휴양및관람, 친지방문, 교육여행 등*자료제공: 제주특별자치도관광협회 (홈페이지: www.visitjeju.or.kr)자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1035'
