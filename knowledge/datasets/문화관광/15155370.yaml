description_portal: 이 데이터는 통계 포털 내 메뉴 구조를 일괄적으로 관리하기 위하여 구축한 통계메뉴모음 테이블이다. 각 레코드는 메뉴명을 나타내는 ‘메뉴명’과 서비스 호출을 위한 프로그램 경로를 담은 ‘메뉴주소’, 메뉴가 속한 영역을 구분하는 ‘메뉴분류’와 더불어 고유 식별자인 ‘메뉴시퀀스’를 저장한다. ‘부모메뉴시퀀스’와 ‘메뉴 순서’ 항목을 통해 상·하위 메뉴 관계 및 화면 출력 순서를 정의하며, ‘메뉴인지여부 C:카테고리 M:메뉴’ 값으로 실제 선택 메뉴인지, 카테고리성 그룹 메뉴인지를 구분한다. 또한 ‘업무지원여부 B:업무지원 D:현황조회’ 항목을 통해 게시판·자료등록 등 내부 업무지원 메뉴와 통계조회용 메뉴를 구분하고, ‘작업중여부’ 값으로 개발·개편 중 메뉴를 식별할 수 있도록 되어 있다. 이 테이블은 통계 포털 화면의 내비게이션 체계를 구성하는 기준 정보로 활용되며, 메뉴 개편, 신규 서비스 추가, 접근 경로 정비 등 통합 메뉴 운영과 관리에 활용된다.
