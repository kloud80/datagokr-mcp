summary_user: 국립중앙도서관이 구축한 저자 전거데이터를 개인명과 단체명으로 나눠 저자 한 명(한 단체)당 한 건씩 담으며, 채택표목·이형표목·출생/사망연도·활동분야·ISNI 같은 식별 정보를 전국 범위로 제공한다. 동명이인이나 표기가 다른 이름을 구분해 특정 저자의 저작을 빠짐없이 찾으려는 사서·연구자·서비스 개발자가 '이 이름의 저자는 누구이며 다른 표기는 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 찾지 못해, 국립중앙도서관 저자 제어번호(AUTHOR_ID)·ISNI·동일개체 링크나 이름 매핑으로 같은 기관의 서지 데이터와 이어 쓴다.
description_portal: 저자 정보 제공 서비스는 국가지식 정보자원에 대한 효율적인 접근 및 공유를 극대화하기 위해 국립중앙도서관이 구축하고 제공하는 저자에 대한 전거데이터(Authority Data) 기반의 서비스입니다. 이 서비스는 한 명의 저자를 유일하게 식별하고 그와 관련된 모든 저작을 통합적으로 묶어주기 위해 설계되었으며, 크게 개인명과 단체명 두 가지 유형으로 명확히 구분되어 제공됩니다. 특히, 이 서비스는 개인 및 단체 등의 창작자를 위한 단 하나의 국제표준이름식별자인 ISNI(International Standard Name Identifier) 식별번호를 포함하여 데이터의 상호운용성을 확보합니다. 또한, 단순히 이름 정보를 제공하는 것을 넘어, 해당 저자의 저작 관계에 따른 서지정보의 연결 값을 포함하고 있어, 이용자가 해당 저자의 모든 저작물(단행본, 논문 등)을 놓치지 않고 정확하게 검색할 수 있도록 지원합니다. 결과적으로 이 서비스는 도서관 정보 시스템의 전거통제 기능을 수행함으로써, 정보 이용 환경의 정확성과 풍부한 맥락을 동시에 제공하는 국가 지식정보 공유의 핵심 인프라 역할을 수행하고 있습니다.
