legal_basis_portal: 국민체육진흥법제3조(체육 진흥 시책과 권장) 국가와 지방자치단체는 국민체육 진흥에 관한 시책을 마련하고 국민의 자발적인 체육 활동을 권장ㆍ보호 및 육성하여야 한다. 구리시 체육진흥 조례제3조(생활체육의 진흥 등) ① 구리시장(이하 “시장”이라 한다)은 시민의 건강과 체력증진을 위하여 행하는 자발적이고 일상적인 체육활동을 권장하고 보호·육성하여야 한다.② 시장은 생활체육을 진흥시키기 위하여 생활체육 관련 단체와 생활체육 동호인 조직을 육성·지원할 수 있다.③ 시장은 생활체육 진흥을 위하여 제4조에 따른 사업을 구리시(이하 “시”라 한다) 체육회와 시 장애인체육회에 위탁할 수 있으며, 위탁사업에 대하여 관리·감독을 하여야 한다.
