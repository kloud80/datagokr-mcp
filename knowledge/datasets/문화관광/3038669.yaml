description_portal: '○ 구리시민의 체육활동 참여 확대와 건강한 공동체 실현 및 지역 체육 진흥을 도모하기 위하여, 구리시 관내 구리시체육회 소속 각 종목단체별 가입 클럽 수와 회원 규모를 중심으로 동호회 등록 현황과 종목별(축구, 풋살, 배드민턴, 게이트볼, 태권도, 테니스, 볼링, 검도, 탁구, 족구, 파크골프 등) 조직 구성 및 단체 운영 현황 등 전반적인 실태를 종합적으로 파악하고, 생활체육 활성화와 스포츠 복지 확대, 시민 참여 기반의 체육정책 수립을 위한 기초자료 제공○ 구리시체육회 : 031-557-7676(운영지원팀 내선 1번, 체육진흥팀 내선 2번, 생활체육팀 내선 3번) ○ 홈페이지 : https://gurisports.kr - 종목별 클럽 가입 절차 및 등록 방법 안내, 종목단체별 운영 현황 및 참여 방법 안내, 신규 회원 가입 및 동호회 활동 관련 상담 - 생활체육대회 및 각종 행사 일정 안내, 생활체육 프로그램 참여 및 신청 접수 안내, 종목별 문의사항 및 체육활동 전반에 대한 종합 안내 등 - 공공체육시설 이용 문의        · 왕숙체육공원(테니스장 17면, 축구장 1면, 풋살장 1면)     · 시립테니스장(6면)    · 시민운동장(축구장 2면)    · 한강야구장(사회인 1면)'
