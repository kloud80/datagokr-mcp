summary_user: 서울 동작구 내 공원·공공장소에 설치된 실외 운동기구를 공원(설치 장소) 단위로 정리한 파일로, 공원명·주소·위도·경도와 함께 설치 운동기구 종류, 업체 관리 횟수(월), 고장난 운동기구 정보를 담는다(CSV 약 3.9KB의 소규모 현황). 주민이 집 근처 어느 공원에 어떤 운동기구가 있는지 찾거나, 구청·분석가가 고장 기구가 있는 공원과 관리 빈도를 점검하는 데 쓴다. 전역 조인 키는 없으므로 공원명·주소로 공원 현황 데이터와 맞추거나 위도·경도로 지도·인구 등 공간 데이터와 겹쳐 쓴다.
description_portal: 이 데이터에는 동작구 내 공원 및 공공장소에 설치된 운동기구의 현황과 관리 정보가 포함되어 있습니다.이 데이터에는 운동기구가 설치된 공원명 정보가 포함되어 있습니다.주소 항목을 통해 시설 위치 및 이용 가능 장소를 확인할 수 있습니다.위도와 경도 정보가 포함되어 위치 확인 및 공간 분석이 가능합니다.설치된 운동기구 종류 정보를 통해 시설별 운동기구 현황을 파악할 수 있습니다.고장난 운동기구 항목을 통해 시설 유지관리 상태를 확인할 수 있습니다.이 데이터는 공공 체육시설 운영 및 유지관리의 기초자료로 활용될 수 있습니다.
