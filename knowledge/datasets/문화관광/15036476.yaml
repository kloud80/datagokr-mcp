status: active
summary_user: 국립춘천박물관 한 곳의 관람객 수를 구분별로 대인·소인·합계로 나눠 담은 집계 파일이며, 포털 설명상 2007~2018년 연도별 현황이다. 지역 박물관 운영 담당자나 문화정책 분석가가 '국립춘천박물관 관람객이 연도별로 어떻게 늘고 줄었고 어른·어린이 비중은 어떤가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(시설코드 등)가 없어, 다른 국립박물관 관람객 현황이나 문화시설 데이터와는 박물관 이름이나 같은 기관 기준으로 맞춰 이어 쓴다.
limits: 시설코드·좌표 같은 공통 키가 없어 문화기반시설총람 등과 자동으로 결합되지 않고 이름 매핑이 필요하다. 범위 표기는 전국·비공간이지만 실제 내용은 춘천박물관 단일 시설의 집계라 지역 분포 분석에는 쓰기 어렵다.
