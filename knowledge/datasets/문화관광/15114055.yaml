summary_user: 충청남도 보령시 관내 유원시설업체를 업체 한 곳당 한 행으로 담은 파일로, 업종·사업체명·허가신고일자·대표 유기기구·놀이기구·물놀이 대상·주소·위도경도를 포함한다. 관광객이나 여행사가 '보령에서 물놀이 시설이나 놀이기구를 갖춘 유원시설이 어디에 있나'를 확인하거나, 지자체가 관내 유원시설 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업체명·주소 문자열 매칭이나 위도·경도 좌표로 이어 쓴다.
description_portal: 여가문화 확산과 관광산업 발전으로 다양한 레저·오락시설에 대한 수요가 증가하고, 유원시설의 안전관리 강화 및 체계적인 운영 현황 파악 필요성이 대두되며, 관광객과 지역주민의 여가시설 이용 편의성 향상과 투명한 시설 정보 제공에 대한 요구가 높아짐에 따라 충청남도 보령시는 관내 유원시설업체의 위치, 보유시설, 관리현황 등 이용객의 시설 선택과 안전한 이용에 필요한 종합적인 정보를 제공하고 있습니다.개방 데이터는 유원시설업의 연번, 업종, 사업체명, 대표 유기기구, 놀이기구, 물놀이대상, 전화번호, 도로명주소, 지번주소, 관리기관, 위도, 경도, 데이터기준일자 등 총 13개 항목 23건의 상세 정보를 포함하고 있습니다.관광객·이용객은 지역 내 유원시설 현황 및 보유 놀이기구 정보 확인을 통해 여가활동 계획 수립에 활용하고, 관광업체·여행사는 지역별 레저시설 현황 파악을 통해 관광상품 개발 및 코스 구성에 활용하며, 지방자치단체·안전관리기관은 유원시설 운영 현황 분석 및 안전관리 정책 수립, 관광 인프라 개발 계획 수립에 활용할 수 있습니다.
