summary_user: 제주의 실내 체험형 미술관 '박물관은 살아있다' 한 곳에 대한 무장애여행 정보를 담고, 실측 필드는 지점별 아이디·위도·경도·해발고도로 구성된 좌표 원천 자료다. 휠체어 이용자나 보행 약자를 동반한 여행자가 이 시설의 위치를 확인하고 장애인 주차구역·경사로·휠체어 대여 등이 갖춰진 무장애 관광지로 방문 동선을 짤 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 문화시설코드 같은 공통 코드로 다른 데이터와 붙일 수 없고 시설 이름 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 박물관은살아있다 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* ‘박물관은 살아있다’는 착시미술, 미디어아트, 오브제아트 등 여러 테마를 통해 관람객이 작품 속에 직접 참여하고 체험할 수 있는 실내 체험형 미술관이다. 본 시설은 휠체어 이용자나 보행 약자를 고려하여 장애인 전용 주차구역, 경사로를 갖춘 출입구, 휠체어 대여, 장애인 화장실 등 무장애 편의시설을 구비하고 있다. 날씨에 관계없이 관람이 가능하고, 실내 공간으로 구성되어 있어 가족 단위 방문객, 고령자, 이동에 제약이 있는 방문객도 편안하게 이용할 수 있으며, 무장애 관광지 및 열린관광지로서 접근성과 관광 편의성을 동시에 확보한 시설이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
