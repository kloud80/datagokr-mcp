summary_user: 부산광역시 부산도서관이 제공하는 주간 인기 대출 도서 현황으로, 도서 한 권마다 순위·표제·저자·발행자·자료실명·대출횟수·발행년·소장도서관명·표지이미지 주소를 담은 집계형 순위 데이터이며, 대상은 부산광역시 산하 도서관과 교육청 도서관이다. 시민이나 서점·출판 관계자가 '이번 주 부산 공공도서관에서 가장 많이 빌린 책은 무엇이고 어느 도서관·자료실에 있나'를 확인하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서관·서지 데이터와는 표제·저자·발행자나 소장도서관명(lib_name)을 이름으로 맞춰 이어야 한다.
description_portal: 부산광역시 부산도서관의 주간 인기 대출  도서 현황(순위, 표제, 저자 명, 발행자, 자료실명, 대출횟수, 발행년, 소장도서관명, 표지이미지 URL 등)를 조회하는 API 서비스입니다. 도서관 정보의 대상은 부산광역시 산하 도서관 및 교육청 도서관입니다. 해당 자료는 XML, JSON, CSV, XLSX, TXT 파일로 다운로드 가능합니다. 이 API자료는 누구나 다운로드가 가능하며 비용은 무료입니다. 기타 문의사항은 부산도서관 관리팀(051-310-5422)으로 연락주시기 바랍니다.
