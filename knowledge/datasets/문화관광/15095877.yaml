summary_user: 대구광역시 북구 관광지 주변 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 사업장명·업종분류·인허가일자·영업상태·전화번호·지번/도로명주소·경도·위도가 들어 있으며 포털 설명상 94건입니다. 북구 관광지를 찾는 방문객이나 숙박 사업자·분석가가 '북구 관광지 근처에 영업 중인 숙박업소가 어디에 얼마나 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 '대구광역시 북구_유형별 관광지 정보'와는 경도·위도 기반 거리 계산이나 주소·이름 매칭으로 이어 쓰고, 인허가 원천(LOCALDATA 숙박업)과도 사업장명·주소로만 대조한다.
limits: 2021년 공공데이터 기업매칭 사업 때 1회 구축된 데이터로 더 이상 갱신되지 않으므로, 영업상태·인허가 정보는 현재 상황과 다를 수 있다. 범위는 대구 북구 한 시군구에 한정되고, 다른 데이터와 직접 붙일 공통 코드가 없다.
