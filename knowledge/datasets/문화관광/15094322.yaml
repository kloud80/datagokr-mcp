summary_user: 국립무형유산원이 제공하는 무형문화재 체험교육 자료를 목록 단위로 담으며, 항목별로 자료명과 상세 페이지로 이동하는 URL 등을 제공한다. 교사나 일반인이 "무형문화재를 직접 배워볼 수 있는 체험교육 자료가 어떤 것이 있고 어디서 자세히 보나"를 찾거나, 교육 콘텐츠 기획자가 체험교육 자료 목록을 모을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 무형유산 데이터와는 자료명 같은 이름 매칭이나 같은 기관 데이터끼리로만 이어 쓴다.
description_portal: '입력 파라미터를 이용하여 무형문화재 체험교육 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형문화재 체험교육 정보 목록 조회 서비스는 무형문화재를 직접 체험·학습할 수 있는 다양한 교육 프로그램 정보를 온라인으로 제공하는 디지털 플랫폼입니다. 이 서비스는 체험교육의 프로그램명, 운영 단체 및 전승자, 교육 대상 및 인원, 일정·장소, 교육 방식(예: 실기 체험, 시연 관람, 워크숍 등), 참가비, 사전 예약 여부, 신청 방법, 제공 자료(교안, 영상 콘텐츠 등)를 체계적으로 정리하여 이용자가 주제별, 지역별, 대상별로 맞춤형 검색과 필터링을 통해 손쉽게 정보를 조회하도록 구성되어 있습니다. 또한 수강 후기, 예·결산 현황, 프로그램 사진 및 관련 영상·해설 자료 등의 부가 정보를 포함하여 학습 효과와 현장 활용도를 높이고 있습니다. 이 플랫폼은 일반인·학생·교사·전승교육사 등 다양한 이용자가 무형문화재의 기술과 문화를 체험하고 전승 지식을 습득하는 데 있어 교육 콘텐츠 기획, 지역 문화 활성화, 학술 연구, 디지털 콘텐츠 제작 등 다방면에서 유용한 디지털 인프라로 활용될 수 있습니다.'
