summary_user: 대구광역시 북구 관광지 주변 카페를 사업장 한 곳당 한 행으로 담은 파일로, 포털 설명 기준 751건에 업종·인허가일자·영업상태·주소·경위도·대표메뉴·영업시간이 들어 있다. 북구 관광지를 찾는 방문객이나 카페 창업을 검토하는 사업자가 '이 관광지 근처에 영업 중인 카페가 어디에 몇 곳 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 주소·사업장명 매칭이나 경위도 기반 거리 계산으로만 연결한다.
description_portal: 먼저 해당 데이터는 2021년 공공데이터 기업매칭 사업 완료시 구축된 1회성 데이터이며, 더이상 업데이트가 진행되지않음을 말씀드립니다.대구광역시 북구에 위치한 관광지주변 카페 현황에 대한 751건의 데이터입니다. 사업장명, 업종분류, 서비스명(휴게음식점, 제과점영업>카페,일반음식점) , 서비스아이디, 인허가일자(YYYY-MM-DD), 영업상태, 소재지 전화번호, 구우편번호(6자), 지번 주소, 도로명 우편번호(5자), 도로명 주소, 경도, 위도, 대표메뉴, 영업시간 등의 데이터를 제공하고있습니다.
