description_portal: 제주특별자치도와 제주관광공사는 관광서비스의 전문성과 지속 가능성을 높이기 위해 ‘관광종사원 교육과정’ 데이터를 공공데이터로 제공합니다. 해당 자료는 2026년 한 해 동안 진행되는 관광종사원을 대상으로 한 교육과정의 세부 내용을 담고 있으며, 과정명, 교육주제, 교육대상, 교육일정(기간 및 시간), 교육형태, 대상 인원 등으로 구성되어 있습니다. 데이터에는 신규 종사자를 위한 기본 교육부터 재직자를 대상으로 한 직무역량 강화 프로그램까지 다양한 대상과 주제가 포함되어 있으며, 교육과정별 일정과 내용이 명확하게 정리되어 있어 지역 관광 인재 양성의 체계성과 지속성을 진단하는 데 유용합니다.
