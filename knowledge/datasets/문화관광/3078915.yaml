summary_user: 부산광역시 동래구 관내에서 운영 중인 체육시설업소를 업소 한 곳당 한 행으로 담은 명부 파일로, 업종·상호·지번 및 도로명 주소·전화번호·시설부지면적·시설면적·건물연면적·체육도장업 세부분류를 담는다. 동래구에서 헬스장·체육도장 같은 민간 체육시설이 어디에 얼마나 있고 규모가 어느 정도인지 확인하려는 주민·창업자·상권 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 주소나 상호를 매칭하거나 같은 동래구 기관 데이터끼리 이어 써야 한다.
