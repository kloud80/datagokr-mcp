summary_user: 대구광역시 주요 관광지점별 입장객 수를 내국인·외국인으로 나눠 2018년부터 2025년까지 연도별 열로 담은 집계 통계로, 시도·군구·관광지 이름이 행을 구분한다. 관광 분석가나 지자체·관광사업자가 "대구의 어느 관광지에 외국인 방문객이 코로나 이전보다 얼마나 회복됐나" 같은 관광지별 연도 추이를 비교할 때 쓴다. 실측 컬럼에 관광지점코드나 시군구코드 같은 전역 조인 키가 없어, 다른 관광 통계나 지역 데이터와는 군구·관광지 이름을 매핑해서만 이을 수 있다.
limits: 월별이 아니라 연도별 집계라 계절·월 단위 변동은 볼 수 없고, 범위는 대구광역시 한 시도에 한정된다. 표준 코드 키가 없어 이름 표기가 다르면 다른 데이터와 연결이 어긋날 수 있다.
