summary_user: 충남도서관이 소장한 도서를 한 권(등록번호) 단위로 담은 장서 목록 파일로, 서명·저자·발행자·ISBN과 자료실·자료상태·이용대상·입수구분·가격 같은 관리 정보가 들어 있으며 CSV 한 파일이 약 89MB 규모다. 이용자가 "충남도서관에 이 책이 있고 어느 자료실에 있는가"를 확인하거나, 분석가가 지역 공공도서관의 분야별·입수경로별 장서 구성을 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, ISBN 값을 매개로 도서관정보나루나 국가서지 ISBN 자료와 이름·코드 매핑 방식으로 이어 쓰는 정도가 가능하다.
