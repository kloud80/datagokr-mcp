description_portal: 군포시 도서관 홈페이지에서 최근 3개월 동안 이용자들이 자주 검색한 인기 검색어에 대한 데이터를 제공합니다. 군포시 6개 공공도서관(중앙, 산본, 부곡, 당동, 어린이, 대야)의 데이터가 포함되어 있습니다. 이 데이터는 도서관 이용자의 정보 수요와 관심 주제를 파악하는 데 활용할 수 있습니다. 제공 항목으로는 검색순위, 검색어, 검색건수, 검색일자, 데이터기준일자가 포함됩니다. 특히 검색횟수가 20건 이상인 검색어만 선별하여 제공하고 있기 때문에 보다 신뢰도 높은 검색어 통계를 확인할 수 있으며, 도서관 서비스 개선이나 자료 구입 시 참고자료로 활용할 수 있습니다.
