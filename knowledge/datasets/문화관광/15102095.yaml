summary_user: 화성시 관내 공원에 설치된 야외 물놀이장을 시설 한 곳당 한 행으로 정리한 현황 파일로, 권역·공원명·위치·관리기관·관리자 연락처를 담으며 파일 크기는 약 2KB(csv)로 소규모입니다. 화성시 주민이나 방문객이 여름철에 가까운 공원 물놀이장이 어디 있는지, 문의는 어느 기관에 하면 되는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 공원명이나 위치(주소) 텍스트를 맞춰 화성시 공원 현황이나 공공 체육시설 데이터와 이어 써야 합니다.
description_portal: 이 데이터는 화성도시공사에서 관리하는 화성시 관내 공원 내에서 이용할 수 있는 야외 물놀이장 시설 현황 자료 입니다. 주요 항목으로는 물놀이장이 설치된 공원명, 공원위치, 관리주체, 관리기관, 관리자 연락처로 구성되어 있습니다. 현재 운영 중인 물놀이장으로는 다람산공원, 반월물빛공원, 노작호수공원 등이 있습니다.해당데이터는 시민과 이용자들이  정보를 보다 투명하고 쉽게 파악할 수 있도록 함으로써, 공공데이터의 개방 및 활용 가치를 제고하고, 데이터 기반 행정 실현에 기여할 수 있는 기반자료로도 매우 유용합니다.
