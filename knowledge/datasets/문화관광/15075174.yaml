description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 제주특별자치도가 제공하는 ‘해거름공원 바다산책로’ 데이터는 해당 장소의 위도·경도, 명칭, 장소상세정보, 그리고 무장애관광 정보 등을 포함한 공공데이터입니다. 이 산책로는 누구나 이용 가능한 열린 관광지를 추구하며, 장애인이나 사회적 약자를 포함한 모든 이용자에게 편의성을 제공합니다. 산책로와 인접한 주변 시설 및 접근 정보가 구조화되어 있어 무장애 여행 계획, 관광자원 연계, 도시계획 또는 관광정책 기획 등에 활용될 수 있습니다. 별도 입장료 없이 제공되며, 데이터는 CSV 형식으로 제공됩니다. * 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
