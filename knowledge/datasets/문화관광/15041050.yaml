description_portal: '이 데이터는 **전라남도 강진군 소재 ‘고려청자박물관’**에서 제공 및 운영하는 체험형 교육·문화 프로그램에 대한 상세 정보를 담고 있습니다.박물관 방문객, 가족 단위 관광객, 학생 단체 등을 대상으로 진행되는 도예·공예 중심 체험 활동의 개요, 운영 조건, 이용 안내 등의 정보를 포함하고 있으며, 문화관광 정보 제공, 프로그램 안내 자료, 정책 기획 및 홍보자료 작성 등에 활용될 수 있습니다.체험프로그램명박물관에서 운영하는 체험 프로그램의 명칭예: 고려청자 만들기, 물레 체험, 청자 문양 찍기 등교육적·문화적 목적을 반영한 고유 프로그램 이름운영시간해당 체험이 운영되는 시작~종료 시간 또는 운영 요일 및 회차예: 매일 오전 10:00 ~ 오후 4:00 / 주말 3회 운영 등계절(성수기·비수기) 또는 휴관일 여부에 따라 변동 가능체험비용1인 기준 체험 참여 비용무료/유료 여부, 재료비 포함 여부 명시예: 1인 5,000원 (재료비 포함)체험소요시간프로그램 1회 참여 시 예상 소요 시간예: 약 30분 / 1시간 / 90분 등일부 체험은 제작 후 작품 수령까지 시간이 소요될 수 있음안내 및 문의예약, 참가 방법, 대상 연령, 유의사항 등 전반적 안내 정보운영기관 연락처(전화번호, 이메일), 홈페이지 등 포함'
