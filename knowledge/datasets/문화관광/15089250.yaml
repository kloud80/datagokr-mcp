summary_user: 인천 부평구의 체육시설을 행정동별로 한 시설씩 담은 파일로, 시설 유형(공공체육관·구민운동장 등)과 시설명, 소재지 주소, 경기장과 부대시설 현황을 담는다. 주민이 우리 동네 근처에 어떤 체육관·운동장이 있고 주차장 같은 부대시설이 있는지 확인하거나, 분석가가 행정동별 생활체육 시설 분포를 비교하는 데 쓴다. 전역 조인 키는 없어서 행정동 이름이나 소재지 주소를 매칭해야 다른 데이터와 이을 수 있다.
description_portal: '행정동별 체육시설의 구분, 시설명, 소재지, 경기장, 부대시설 등을 수록한 데이터.지역 주민의 생활체육 참여와 건강 증진을 위한 기반 시설 현황을 파악하고, 생활SOC 확충, 체육 인프라 개선, 지역 커뮤니티 활성화 정책 등에 활용 가능하다.활용 목적 및 특징– 행정동별 체육시설 분포 및 구분 현황 분석– 시설명·소재지를 통한 입지 특성 및 이용 접근성 파악– 경기장·부대시설 현황을 통한 시설 활용도 분석– 생활체육 활성화 및 주민 건강 증진 정책 자료 활용주요 항목 설명● 행정동: 체육시설이 위치한 행정동 명칭● 구분: 체육시설의 유형(공공체육관, 구민운동장 등)● 시설명: 체육시설의 공식 명칭● 소재지: 체육시설의 위치 주소● 경기장: 주요 운동 경기 시설 현황● 부대시설: 편의시설, 주차장 등 부대시설 현황'
