description_portal: '도서관 강좌 현황 데이터는 도서관 홈페이지 DB의 데이터로서 시민의 평생교육 참여 기회를 확대하고 지역 문화·교육 프로그램의 운영 실태를 체계적으로 파악하기 위해 수집된 자료입니다. 이 데이터를 공공데이터로 개방함으로써 도서관 프로그램의 접근성을 높이고, 교육 수요 분석, 강좌 운영 효율화, 프로그램 품질 개선 등 다양한 정책적·사회적 가치를 창출할 수 있습니다. 공개되는 데이터에는 강좌명, 운영기관, 교육일정, 담당강사, 모집정원 및 수강현황, 대상연령, 장소 등 주요 항목이 포함되어 있으며, 이를 통해 시민·연구자·기업은 지역별 교육 수요 파악, 강좌 트렌드 분석, 맞춤형 서비스 개발 등 다양한 분야에서 활용할 수 있습니다.이 데이터는 실제와 다소 차이가 발생할 수 있습니다.본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시청 안중도서관(031-8024-8337)※ 홈페이지 URL : https://www.ptlib.go.kr/onebook/quizList.do'
