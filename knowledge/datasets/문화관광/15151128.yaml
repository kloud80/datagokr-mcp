description_portal: 무대예술전문인 자격검정 시험정보는 무대예술분야 전문인력 확충과 저변확대를 기하고자  공연법 제14조에서 동 자격제 도입 이후 1년에 한 번 (1회 또는 2회 진행, 현재는 1회) 진행되고 있는 시험에 대한 데이터베이스입니다. 이 데이터는 시험연도, 시험일자, 시험장소,  시험급수, 시험분야, 시험분류(필기/실기)에 대한 정보를 제공합니다.무대예술전문인 자격검정 시험은 2000년부터 시행되고 있으며 본 공공데이터는 2012년 부터 2025년 까지 구축된 데이터 입니다. 현재 홈페이지에서는  최근 4개년도에 대한 시험일정만 노출되고 있습니다.
