description_portal: '부산광역시 사상구는 어린이들의 건강과 안전을 위해 관내 공원 내 어린이놀이터의 모래소독을 정기적으로 실시하고 있습니다. 모래놀이터는 야외 환경에 노출되어 있어 동물이나 조류의 배설물로 인해 기생충류와 세균류에 오염될 위험이 높습니다. 이로 인해 어린이들의 건강이 위협 받을 수 있으므로 정기적인 소독과 관리가 필수입니다.어린이놀이터 모래소독 현황 데이터는 부산광역시 사상구의 공원 내 위치한 어린이 놀이터에 대한 모래소독 정보를 제공하는 데이터입니다. 사상구 관내 총 4개의 어린이 놀이터에 관한 놀이시설(공원)명, 해당 데이터 소재지 지번주소, 모래 소독면적(단위: 제곱미터), 최근 소독일자, 바닥재, 데이터기준일(2026년 5월 7일자)을 포함하여 제공 중입니다.'
