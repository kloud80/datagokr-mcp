summary_user: 전라남도 내 미술관을 한 행에 한 곳씩 담은 목록으로, 공립·사립 구분, 미술관명, 주소, 연락처, 등록일을 담는다(포털 설명 기준 39개소, CSV 약 2.8KB). 지역 주민이나 관광객이 '우리 군·시에 있는 공립 미술관은 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 전남 지역 미술관의 분포와 등록 시기를 살펴보는 데 쓴다. 전역 조인 키(문화기반시설 코드 등)가 없어, 다른 문화시설 데이터와는 미술관명이나 주소 문자열을 맞춰 이어 써야 한다.
description_portal: '- 전라남도 내 주요 미술관 39개소에 대한 현황을 조회하실 수 있습니다.- 공립/사립 여부, 미술관명, 주소, 연락처, 등록일자 등에 대한 데이터를 제공합니다.- 전라남도는 풍부한 자연경관과 함께 다양한 미술관들이 있어 문화예술을 즐기기에 훌륭한 장소입니다.- 전라남도는 자연과 예술이 어우러진 아름다운 지역으로, 다양한 미술관들이 여러분을 기다리고 있습니다. 각 미술관의 전시와 프로그램을 통해 풍성한 문화체험을 즐기시길 바랍니다.- 특히, 전남 도립미술관은 현대미술에 대한 깊은 이해와 즐거움을 제공하며, 예술의 개방성, 다양성, 생명력을 보여주는 미술관입니다.'
