summary_user: 경기도 내 무장애(배리어프리) 관광지별로 장애인화장실·엘리베이터·장애인주차장·경사로·휠체어 대여·촉지도식 안내판·오디오가이드·수유실·무장애 객실·유아차 대여 등 편의시설 유무와 인근 지하철역·버스정류장 정보를 관광지 한 곳당 한 행으로 담은 목록이다. 휠체어 이용자나 유아차를 끄는 가족이 "경기도에서 장애인화장실과 휠체어 대여가 모두 되는 관광지는 어디인가"를 찾거나, 지자체 담당자가 편의시설이 빠진 관광지를 골라 개선 대상을 정하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지명(touresrt_nm)을 이름으로 맞춰 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 무장애(배리어프리) 관광지의 장애인 및 관광약자를 위한 편의시설 정보를 정리한 자료입니다. 주요 항목은 무장애관광지명, 장애인화장실, 엘리베이터, 장애인주차장, 경사로, 휠체어대여, 촉지도식안내판설치, 오디오가이드, 아기돌봄·수유실, 무장애객실, 유아차대여 등으로 구성되어 있습니다. 관광지 내 접근성과 이용 편의성을 높이기 위해 설치된 시설들의 유무 정보를 통해 장애인과 고령자, 영유아 동반 가족 등 관광 약자들이 안전하고 편리하게 관광지를 이용할 수 있도록 지원합니다. 본 데이터는 관광지 선택 시 유용한 정보 제공은 물론, 정책 수립, 시설 개선 및 유니버설 관광환경 조성에 활용될 수 있습니다.
