description_portal: 본 데이터는 서울특별시 종로구에서 외국인을 대상으로 숙박 서비스를 제공하는 도시형 민박시설의 인허가 현황을 정리한 자료입니다. 포함된 항목은 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등으로 구성되어 있으며, 소규모 숙소의 개업 및 폐업 이력, 행정상태 변동 등을 파악할 수 있습니다. 해당 업종은 「관광진흥법」 제3조 및 제4조의2에 따라 등록 및 관리되며, 주거용 건축물의 일부를 활용하여 외국인에게 숙박을 제공할 수 있도록 허가된 업태입니다. 데이터는 지역 내 숙박 인프라의 다양성 확보, 관광객 수용 태세 점검, 비정형 숙박 수요 분석 등에 활용될 수 있습니다. 또한 도시형 관광 활성화를 위한 기반자료로서, 정책 수립, 안전점검, 문화관광 서비스 기획 등 다양한 분야에 제공됩니다. 해당 정보는 정기적으로 갱신되며, 공공데이터의 제공 및 이용 활성화에 관한 법률에 따라 개방됩니다.
