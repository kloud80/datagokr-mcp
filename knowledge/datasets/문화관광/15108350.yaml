description_portal: 사문진나루터의 하천 경관과 주요 공간을 드론을 활용하여 항공 촬영한 이미지 데이터로, 상공에서 촬영한 고해상도 이미지를 통해 지역의 공간적 특성과 경관을 입체적으로 확인할 수 있도록 구축된 자료이다. 본 자료는 사문진나루터의 나루터 일대, 수변 공간, 주변 경관을 시각적으로 기록한 디지털 이미지 자료로, 관광 콘텐츠 및 수변 공간 관리에 필요한 기본 정보를 포함하고 있다.또한 드론 이미지데이터를 통해 사문진나루터의 전반적인 공간 구조와 경관을 다양한 시점에서 확인할 수 있어, 관광지 홍보, 수변 경관 콘텐츠 제작 및 디지털 관광 서비스 제공을 위한 기초자료로 활용된다. 본 자료는 관광 자원의 시각적 기록과 보존, 홍보용 콘텐츠 제작, 공간 정보 분석 및 관광 안내 서비스 제공 등 다양한 관광·문화 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 디지털 기술을 활용한 항공 이미지 콘텐츠 확산과 지역 관광 자원의 홍보 강화를 통해 관광 활성화를 도모하고, 스마트 관광 환경 조성과 수변 관광 정책 추진을 위한 기초자료로 활용되며, 지속적인 관광·문화 행정 업무 수행을 지원하는 디지털 행정자료로 활용된다.
