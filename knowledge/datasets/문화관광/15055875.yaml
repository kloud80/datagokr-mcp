summary_user: 인천광역시가 지정한 시지정문화유산을 한 건씩 담은 목록 파일로, 번호·종목(유형문화유산·무형유산·기념물·민속문화유산·자연유산·문화유산자료)·국가유산명·지정일자·소재 시군구를 담는다(CSV 약 10KB). 시민이나 연구자가 '우리 구·군에 있는 시지정 문화유산은 무엇이고 언제 지정됐나'를 확인하거나, 종목별·시군구별 지정 현황을 집계하는 데 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록 API와는 유산명·종목 이름 매칭으로, 다른 행정 데이터와는 시군구 이름으로만 이어 쓴다.
limits: 실측 컬럼에 종목코드·지정번호(ccbaKdcd·ccbaAsno 등)나 소재지 PNU 같은 공통 키가 없어 국가유산청 데이터와 정확히 1:1로 연결되지 않고 이름 매칭에 의존해야 한다. 위치는 시군구 단위까지만 있어 지점 좌표나 보호구역 분석에는 쓰지 못한다.
