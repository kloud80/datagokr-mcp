description_portal: 지정문화유산은 대한민국 문화유산보호법에 의해 국가지정문화유산과 시도지정문화유산, 문화유산자료로 구분된다. 시도지정문화유산은 특별시장·광역시장·도지사가 국가지정문화유산으로 지정되지 아니한 문화유산 중 보존가치가 있다고 인정되는 것을 지방자치단체의 조례에 의하여 지정한 문화유산을 뜻한다. 해당 자료는 인천광역시의 시지정문화유산에 대한 자료로 유형문화유산, 무형유산, 기념물, 민속문화유산, 자연유산, 문화유산자료로 분류되며번호, 종목, 국가유산명, 지정일자, 소재시도 내용을 포함한다.
