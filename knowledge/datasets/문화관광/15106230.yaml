description_portal: '- 전라남도내 설치된  요트장 현황(공공체육시설, 시설명, 운영조직, 관리주체,  부지면적, 준공연도) 등의 정보를 조회할 수 있습니다.- 전라남도는 아름다운 남해안과 섬들이 어우러진 해양 환경 덕분에 요트와 해양 레저 활동에 최적의 조건을 갖추고 있습니다. 최근에는 여수, 목포, 고흥 등지에서 마리나 시설과 요트 체험 프로그램이 활성화되며, 해양 관광의 중심지로 떠오르고 있습니다.- 전라남도의 요트장과 해양 레포츠 시설은 자연과 어우러진 아름다운 풍경 속에서 다양한 해양 활동을 즐길 수 있는 최적의 장소입니다. 요트 여행을 통해 전라남도의 매력을 만끽해 보시기 바랍니다.- 사전 예약 : 인기 있는 요트장과 프로그램은 사전 예약이 필수입니다.- 안전 장비 : 요트 탑승 시 구명조끼 등 안전 장비 착용이 의무입니다.'
