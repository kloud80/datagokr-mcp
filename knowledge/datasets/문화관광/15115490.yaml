summary_user: 서울 중랑구에 등록된 일반여행업 업소를 한 행씩 담은 인허가 원장으로, 관리번호, 인허가일자, 영업상태, 폐업일자, 전화번호, 지번·도로명 주소, 사업장명, 중부원점TM(EPSG:5174) 좌표를 포함한다. 여행업 창업을 준비하는 사업자나 지역 분석가가 '중랑구에서 지금 영업 중인 일반여행업체는 어디이고 최근 폐업한 곳은 얼마나 되나'를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 주소·사업장명을 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중랑구의 국내 또는 국외를 여행하는 내국인 및 외국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
