description_portal: 본 데이터는 전북특별자치도 내 생활체육 종목별 및 시·군 지역별 동호회(클럽)와 동호인 수의 현행화 된 통계 현황을 제공합니다. 데이터 출처는 전북특별자치도 체육회 및 14개 시군 체육회에서 관리하는 자료로 작성되었습니다.  각 시·군 지역 단위의 생활체육 종목별 클럽 수 및 동호인 수를 확인 하실 수 있습니다. 이를 통해 도내 생활체육의 종목별 수요와 지역별 참여 규모를 한눈에 파악할 수 있습니다. 전북특별자치도의 생활체육 활성화 및 도민 건강 증진에 많은 관심과 지원을 부탁드립니다. 체육정책과(063-280-3533)
