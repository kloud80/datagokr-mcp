summary_user: 제주 1100고지습지 무장애 탐방로 지점의 위도·경도·해발고도와 장소 설명·이미지 정보를 지점 단위로 담는 제주데이터허브 파일입니다. 휠체어 이용자 등 관광약자를 위한 여행 앱 개발자나 관광 정책 담당자가 '1100고지습지 탐방로의 어느 지점까지 무리 없이 이동할 수 있는가'를 지도에 표시할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 TourAPI 관광지 정보 등과는 장소 이름 매핑이나 위경도 좌표 근접으로만 연결한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 1100고지습지 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 1100고지습지는 한라산 중턱 해발 약 1,100 m 지점에 위치한 고산습지로, 16개 이상의 습지가 불연속적으로 분포해 있으며 2009년에 습지보호지역 및 람사르협약 등록지로 지정되었다. 해당 지역은 습지와 주변 활엽수림, 초지, 관목림이 어우러진 생태환경을 이루며, 멸종위기종을 포함한 다양한 야생동식물이 서식하고 있다. 나무 데크로 조성된 자연 생태 탐방로는 경사도가 낮아 휠체어 이용자 등 관광약자도 상대적으로 무리 없이 산책할 수 있으며, 습지보호 구역으로서 환경 보전 및 생태 교육, 무장애 관광지 안내, 관광 콘텐츠 제작, 정책 기초자료 등 공공 및 관광 분야 기초자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
