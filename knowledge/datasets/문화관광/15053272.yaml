description_portal: 대구광역시 달서구에서 운영하는 공공체육시설에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 종류, 시설명, 주소, 소유기관, 관리주체, 부지면적, 준공연도, 건설사업비, 비고, 데이터기준일자 등으로 구성되어있으며, 1년 주기에 따라 최신 정보를 반영하여 업데이트합니다.해당 자료는 달서구청 홈페이지(www.dalseo.daegu.kr)를 통해 분야별정보> 생활체육> 생활체육 > 공공체육시설에서 확인할 수 있습니다.지역 사회의 건강 증진 및 생활 체육 활성화를 위한 기초자료로 활용될 수 있습니다.
