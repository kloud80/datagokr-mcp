summary_user: 대구 달서구가 운영하는 공공체육시설을 시설 한 곳당 한 행으로 정리한 파일이며, 종류·시설명·주소·위경도·소유기관·관리주체·부지면적·준공연도·건설사업비를 담는다(CSV 약 6KB 규모). 주민이나 분석가가 '우리 동네 근처에 어떤 공공체육시설이 있고 누가 관리하며 언제 지어졌나'를 확인하거나 시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소나 위경도 좌표, 시설명을 기준으로 맞춰 이어 쓴다.
limits: 달서구 한 구의 시설만 담고 있어 대구 전체나 전국 비교에는 문체부 전국체육시설 자료 등 다른 데이터가 필요하다. 예약·대관 정보는 들어 있지 않다. 표준 시설 코드가 없어 다른 데이터와 맞출 때는 이름과 주소를 직접 대조해야 한다.
