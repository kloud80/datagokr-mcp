summary_user: 충청남도 계룡시 관내 지정 문화재를 한 건씩 담은 목록으로, 문화재 명, 지정 주체·지정 구분, 지정번호, 지정 연도·일자, 행정구역, 소재 위치를 제공하며 포털 설명상 2021년 9월 1일 기준으로 수집된 현황이다. 계룡시에 어떤 국가·도 지정 문화재가 어디에 있고 언제 지정됐는지 확인하려는 주민, 답사·관광 기획자, 지역 문화유산 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 국가유산청 유산 API의 종목코드·지정번호 체계와는 문화재 명칭이나 지정번호(APPN_NO)를 이름·번호로 대조해 이어 써야 한다.
limits: 국가유산청 공통 코드(종목코드·지정번호·시도코드)나 필지 고유번호(PNU) 같은 조인 키가 없어 다른 유산 데이터와 바로 결합할 수 없고, 범위는 계룡시 한 곳으로 한정된다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
