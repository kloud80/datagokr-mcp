summary_user: 경상남도 밀양시 관광지를 한 곳당 한 행으로 담은 목록 파일로, 관광지명·구분, 도로명·지번 주소, 위도·경도, 면적, 수용인원, 주차가능수, 공공편익시설, 관광지 소개, 관리기관 연락처를 개별 주소·좌표 단위로 담는다. 여행자나 지역 관광 분석가가 '밀양에서 주차가 되고 편의시설이 있는 관광지는 어디이며 위치는 어디인가'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 관광지명이나 주소·좌표로 맞춰 이어 쓰며, 관광지 콘텐츠의 대표 원장인 TourAPI(contentId·지역코드)와도 이름·위치 매칭으로 연결한다.
limits: 표준 코드 형태의 조인 키가 없어 TourAPI나 다른 지자체 데이터와 붙일 때 이름·주소 매칭 오류에 주의해야 한다. 밀양시 한 곳의 관광지 목록이라 다른 시군구와의 비교에는 각 지자체 파일을 따로 모아야 하며, 관광 콘텐츠 영역에서는 TourAPI가 대표이고 이 파일은 보조 자료로 분류돼 있다.
