summary_user: 빅카인즈에서 수집한 인공지능 관련 뉴스를 기사 한 건당 한 행으로 담은 메타데이터 파일로, 기사 주소·보도 일자·언론사·제목·통합분류(1~3단계)·개체명(인물·지역·기업기관)·키워드·특성추출 값·본문을 포함하며 CSV 한 파일이 약 305MB입니다. 언론 연구자나 기술 정책 분석가가 '생성형 AI나 AI 규제 이슈가 어느 시기에 어떤 언론사에서 집중 보도됐고 어떤 키워드로 다뤄졌나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 언론사명·기업기관명 같은 개체명 텍스트나 보도 일자를 기준으로 이름 매칭해 붙여 써야 한다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 인공지능(AI) 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사,  제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적·정량적 분석이 가능합니다.본 자료는 국내 주요 언론사의 AI 관련 보도를 대상으로, 어떤 기술·산업·정책 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 프레임이 어떻게 형성되었는지 등을 파악하는 데 중점을 두고 있습니다. 이러한 분석을 통해 언론이 생성형 AI, 규제 정책, 산업 적용 사례, 노동·윤리·교육 등 사회적 영향, 기업 전략, 글로벌 경쟁 구도 등의 이슈를 어떤 관점에서 재현하는지 확인할 수 있으며, 이러한 보도 경향이 국내 여론과 정책 논의에 어떻게 작용했는지를 추적하는 데도 유용합니다.또한 이 자료는 학계, 언론 연구자, 기술 정책 전문가, 산업 관계자 등에게 AI 관련 보도의 흐름, 이슈별 프레임 변화, 언론의 기술 이슈 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
