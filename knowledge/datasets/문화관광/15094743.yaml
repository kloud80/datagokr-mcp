summary_user: 제주 도내 골프장에서 내국인이 쓴 매출액을 기준연월·성별·연령대·이용자 유형별로 묶은 집계 통계이며, 포털 설명상 2018~2020년이 대상이고 금액은 백만 원 단위(use_amount_by_million)입니다. 관광·레저 분석가가 '코로나 시기 전후로 제주 골프장 내국인 매출이 어느 연령대·성별에서 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 연월·성별·연령대 같은 값을 맞추거나 같은 기관(제주특별자치도)의 다른 관광 통계와 나란히 놓고 비교하는 방식으로 이어 쓴다.
description_portal: 이 데이터셋은 2018-01-01부터 2020-12-31까지 제주도 내 골프장에서 내국인이 지불한 매출액을 연도별·성별·연령대·타입별로 집계한 통계자료입니다. 제공기관은 제주특별자치도이며, 관리부서는 디지털혁신과입니다. 데이터는 CSV 형식으로 공개되어 있어 누구나 무료로 다운로드할 수 있고, 여행 · 레저 · 스포츠 분야 분석에 활용이 가능합니다. 이 자료는 제주 지역 골프장 산업 규모 및 내국인 이용 패턴 변화를 파악하는 데 유용하며, 관광산업 동향, 지역 레저 인프라 평가, 정책 수립, 시장 분석 등에 활용될 수 있습니다. 다만 2020년까지의 집계만 포함되어 있어 이후의 변화는 반영되어 있지 않을 수 있다는 한계가 있습니다.
