summary_user: IBK기업은행 IBK경제연구소 소속 도서실에 새로 들어온 도서를 한 권씩 서명·저자·출판사·출판년도로 담은 목록 파일(CSV)이며, 포털 설명상 2024년 하반기 신착 도서는 591권이다. 경제·산업 분야 신간을 찾는 연구자나 독자가 은행 연구소 도서실이 최근 어떤 책을 들였는지 확인하는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어서, 다른 도서 데이터와는 서명·저자 이름을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: IBK도서실은 1961년 8월 1일 중소기업은행 창립시 기획조사부 소속 도서실로 설립되었으며, 중소기업은행 직제개편에 따라 현재는 IBK경제연구소 소속으로 되어있습니다.해당 파일에서는 중소기업은행의 IBK도서실에 보관/관리중인 도서의 목록, 저자명 , 출판사, 출판년도에 대한 데이터를 제공중입니다.2024년도 하반기 신축도서로는2024~2025 대한민국 산업지도, 이코노미스트 2024 세계대전망, 뉴럴링크, 나무에서 만난 경영지혜  등 591개의 신규도서가 입고 됐으며IBK도서관에 보관중인 도서의 분류는 듀이십진분류법에 의하여 분류함을 원칙으로 하되, 필요에 따라 부분별로 별도 분류할 수 있게 되어있습니다.
