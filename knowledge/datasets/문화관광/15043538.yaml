summary_user: 제주시 조천읍 에코랜드의 무장애여행 정보를 담은 파일로, 지점별 아이디와 위도·경도·해발고도를 담고 포털 설명상 장소 설명과 이미지 정보도 함께 제공한다. 휠체어 이용자나 보행이 어려운 여행자가 에코랜드 기차 순환 구간의 주요 지점 위치를 확인하거나, 관광 담당자가 무장애 관광지 동선을 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소명이나 좌표를 직접 맞춰 연결해야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 에코랜드 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 에코랜드는 제주 제주시 조천읍에 위치한 자연친화형 테마파크로, 1800년대 증기기관차 모델의 기차를 타고 곶자왈 숲속을 4.5 km 구간 순환하며 관람할 수 있는 무장애 여행지 정보를 포함한다. 해당 자료는 위도·경도, 각 역 및 주요 지점별 설명, 이동 경로, 무장애 편의시설 현황(휠체어 대여, 장애인 주차, 장애인 화장실 등) 등을 체계적으로 제공한다. 특히 기차탑승을 기본으로 함으로써 보행이 어려운 이용자도 숲길과 정원, 수상 경관, 테마 공간을 무리 없이 즐길 수 있으며, 무장애 관광지 조성, 접근성 기반 관광서비스 강화, 정책 수립 등에 유용한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
