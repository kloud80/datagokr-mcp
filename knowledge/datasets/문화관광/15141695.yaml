summary_user: 서울특별시 용산구에 신고된 체육시설업 중 수영장업(실내·야외)을 업소 한 곳당 한 행으로 담은 인허가 원천 명부로, 상호명·소재지·인허가일·영업상태·폐업일·좌표 등을 포함한다. 사업자나 분석가가 '용산구에 지금 영업 중인 수영장은 어디이고 최근 폐업한 곳은 있는가'처럼 민간 체육시설의 분포와 개폐업 흐름을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 상호명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 업종 체육시설업 명부나 상권 데이터와 같은 축으로 비교하는 데 쓴다.
description_portal: 서울특별시 용산구에 정식으로 신고된 체육시설업 중 수영장업(실내수영장, 야외수영장)의 현황 정보를 제공하고 있습니다. 이 정보에는 용산구 내 위치한 수영장업(실내수영장, 야외수영장)에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구에 정식으로 신고된 다른 업종의 신고체육시설업의 정보 또는 공공체육시설에 대한 정보가 가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
