description_portal: '국가유산진흥원은 문화유산 향유 기회를 확대하고 공연장 운영의 효율성을 높이기 위해, 민속극장 풍류 및 한국문화의집(KOUS) 등 소속 공연장의 월별 이용객 수 데이터를 수집하고 있습니다. 본 데이터는 소속 전통문화 공연장의 관람객 수를 기반으로 하며, 공연장별 월별 이용 현황을 정량적으로 파악할 수 있도록 구성되어 있습니다.본 데이터는 공연장 운영 효율성 평가, 문화공간 수요 분석, 지역별 문화향유 지표 산출, 문화행사 수요 예측, 시즌별 관람 추세 분석, 공공문화공간 활성화 정책 기획 등 다양한 용도로 활용될 수 있습니다. 특히 문화정책 수립기관, 전통문화 기획자, 공연장 운영자, 문화기반시설 평가기관 등에서 공연장별 활용도를 분석하는 데 기초자료로 유용합니다.제공 항목은 다음과 같습니다.ㆍ 연도: 해당 통계의 기준 연도ㆍ 공연장명: 시설명 (민속극장 풍류, KOUS 등)ㆍ 월별 이용객 수: 1월~12월(명 단위)ㆍ 합계: 연간 누적 이용객 수(명 단위)데이터는 연 1회 정기적으로 갱신되며, 공연장에 대한 상세한 내용은 아래 링크를 참고 바랍니다.- 민속극장 풍류, 한국문화의집 KOUS: www.kh.or.kr/cms/content/view/280'
