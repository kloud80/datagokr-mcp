summary_user: 2022년 국민 체육활동 실태 설문의 응답자별 원자료로, 지역·성별·연령 등 인구 특성과 건강상태 인식, 체육시설 이용, 생활체육 강좌·동호회 참여, 운동 빈도·동기, 안전사고 경험, 월평균 경비 문항을 응답자 한 행 단위로 담는다(전국 범위, zip 파일). 정책 담당자나 연구자가 '연령·지역별로 생활체육 강좌나 동호회 참여율과 운동 빈도가 어떻게 다른가'를 직접 교차분석할 때 쓴다. 실측 컬럼에서 다른 데이터와 잇는 공통 조인 키는 없으며, 지역 코드(AREA)도 명세상 의미가 비어 있어 시도 이름 매핑을 직접 만들어야 지역 통계와 붙일 수 있다.
limits: 필드 이름이 문항 번호(A01, XA02 등)만 있고 명세상 의미·코드표가 비어 있어 별도 설문지나 코드북 없이는 해석이 어렵다. 조사 시점에 한 번 만들어진 뒤 바뀌지 않는 이벤트성 자료라 연도별 추이는 이 파일만으로 볼 수 없다.
