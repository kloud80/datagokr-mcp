description_portal: 비디오물소극장업 인허가 정보는 구로구에서 소규모 상영관 형태로 비디오물을 관객에게 상영·제공하는 업소에 대한 인허가 내역을 관리하는 데이터로, 인허가일자, 영업상태명, 지번주소 및 시설 관련 세부 정보를 포함한다. 소극장업은 대규모 멀티플렉스와 달리, 독립·예술·특화 콘텐츠를 상영하는 경우가 많아 지역 문화다양성 측면에서 중요한 역할을 한다. 인허가 및 영업 상태 정보는 해당 업종의 지속 가능성과 시장 구조를 파악하는 데 사용되며, 시설 위치·규모 정보는 주변 상권과의 관계, 야간 유동인구, 문화 인프라 분포 등을 분석하는 데 도움을 준다. 이러한 데이터는 영상문화 진흥, 소규모 문화공간 지원, 안전·소방 점검 대상 관리 등 다양한 정책 분야에서 활용할 수 있다.
