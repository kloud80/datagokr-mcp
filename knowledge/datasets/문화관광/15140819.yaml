description_portal: '은평구의 책이나 잡지 따위의 인쇄물 출판을 전문으로 하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.은평구에 등록된 출판사들의 주소, 운영현황, 창업 연도 등 기본 정보를 포함한 자료입니다. 독립출판, 1인 출판과 같은 다양한 출판형태가 확산됨에 따라, 지역 출판문화의 기반을 형성하는 핵심 정보로 활용됩니다. 디지털 콘텐츠와의 융합, 창작 지원 정책 등과 연계해 창의 산업 전반을 이해하는 데도 도움이 됩니다.'
