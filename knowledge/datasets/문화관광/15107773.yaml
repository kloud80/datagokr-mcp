summary_user: 전국 체육시설의 안전점검 결과(종합·분야별)와 자율안전점검 결과를 시설 단위로 담은 API이며, 시설코드·점검일자·분야별 등급·결과요약·개선방향을 조회한다. 시설 이용자는 가까운 체육시설의 안전점검 등급이 어떠했는지 확인하고, 분석가는 지역·시설유형별 안전관리 현황을 살피는 데 쓴다. 시설코드(faci_cd)와 점검결과 일련번호로 같은 기관 내 종합·분야별 결과를 이어 쓰며, 다른 데이터와 잇는 전역 조인 키는 없어 이름이나 코드 매핑이 필요하다.
description_portal: 전국체육시설 안전점검은 서울올림픽기념국민체육진흥공단에서 관리하고 있는 전국체육시설 안전정보를 제공하는 API서비스 입니다. 체육시설안전정보, 안전점검결과(종합), 안전점검결과(분야별), 자율안전점검결과(종합), 자율안전점검결과(분야별)으로 나뉘어져 있고, 시설코드, 시설명, 시설구분명, 업종명, 시설유형명, 시도, 시군구명과 안전점검종합등급명, 안전점검공개일자, 시설정보등록일자 등 관련 데이터를 조회할 수 있습니다. 이 서비스는 전국 체육시설의 안전점검 결과를 종합적으로 제공하여 시설 이용자의 안전 확보와 정책적 안전관리 개선에 활용될 수 있습니다.
