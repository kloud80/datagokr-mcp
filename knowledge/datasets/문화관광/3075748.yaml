summary_user: 부산광역시 해운대구에 등록된 영화상영관을 한 곳씩 담은 목록으로, 상영관명·등록일자·연락처·도로명 소재지·관람정원이 들어 있고 단위는 시군구 내 개별 시설(주소)이다. 해운대구 주민이나 분석가가 '구내 영화관은 어디에 있고 좌석 규모는 얼마인가'를 확인하거나 문화시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상영관명이나 도로명 주소를 맞추는 방식으로만 잇고, 문화시설 코드나 KOPIS 식별자 같은 공통 키는 들어 있지 않다.
description_portal: 부산광역시 해운대구 관내 위치한 영화상영관 현황 목록으로 상영관명, 연락처, 소재지 등에 대한 정보를 제공합니다. 영화상영관이란 시민들에게 다양한 영상문화 콘텐츠를 향유할 수 있는 복합문화공간이며, 영리를 목적으로 영화를 상영하는 장소 또는 시설을 말합니다. 영화 및 비디오물의 진흥에 관한 법률에 의거 문화체육관광부령에 따라 시설기준을 갖추고 시군구에 등록한 영화상영관 정보를 제공합니다.또한 문화예술진흥법에 따라 문화시설로 분류되는 시설이자, 청소년활동진흥법 시행령에 따라 청소년이용시설로 분류되어 법적인 관리를 받고 있습니다.
