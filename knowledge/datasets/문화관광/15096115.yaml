summary_user: 곡성군 지역의 향토문화유적(유적명·유형·종류·지정일·소재지 도로명/지번 주소·위도경도·규모·조성시대·소개·이미지)과 지표조사보고서(조사명·조사일·보고서 다운로드 주소 등)를 유적·보고서 건별로 담는 API이다. 곡성군의 향토문화유적이 어디에 있고 언제 지정됐는지, 특정 유적 주변에서 어떤 지표조사가 있었는지 확인하려는 주민·연구자·개발사업자가 쓴다. 전역 조인 키가 없어 국가유산청 지정 유산 목록(종목코드·지정번호)과는 유적명으로 맞춰야 하고, 위치 기반 연계는 주소나 좌표(LTTD·LNGTD)로 한다.
description_portal: 향토문화유적명, 향토문화유적소개 등의 유적지 데이터 정보와 문화재명 조사명, 향토문화유적명, 향토문화유적소개 등의 지표조사보고서 데이터 정보 등을 제공하는 곡성 지역 문화재 데이터 조회 서비스
