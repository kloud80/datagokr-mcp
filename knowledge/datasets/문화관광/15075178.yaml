description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 보목포로(볼레낭개길)는 제주 서귀포시 보목포구를 중심으로 펼쳐진 해안 마을과 포구, 숲길 및 해안 산책로가 이어지는 관광 코스로서 바다와 어촌 풍경, 현무암 해안, 포구 마을 분위기가 어우러진 공간이며 일부 구간에 평탄 보행로, 포장도로, 주차장, 무단차 출입구, 해안 조망 데크 등의 무장애 편의시설 정보가 포함되어 휠체어 사용자, 유모차 동반 가족, 고령자 등도 비교적 무리 없이 해안 산책과 마을 탐방, 자연 경관 감상을 즐길 수 있는 열린관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
