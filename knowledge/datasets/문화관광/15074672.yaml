description_portal: 본 데이터는 자전거 종주 활동 관련 인증 정보를 체계적으로 수집 및 관리한 자료입니다. 우리강(한강, 금강, 낙동강, 영산강 등) 주변으로 조성되어 자전거를 타고 라이딩을 할 수 있는 지점에 대한 종주 인증 정보를 제공합니다. 데이터는 안전관리와 자전거 문화 확산, 수변 코스 연계 등의 활성화를 목적으로 활용됩니다. 또한, 생태탐방 및 공공 인프라 활용 정보를 제공하며, 참여자 편의와 공공 서비스 투명성을 제고하여 자전거 종주 활동의 효율적 관리에 기여합니다.*제공정보 - 구간별종주, 4대강종주, 국토종주, 국토완주그랜드슬램
