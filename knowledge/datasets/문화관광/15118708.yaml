description_portal: 대구지역에서 선사시대 중 공백기로 여겨졌던 구석기, 신석기시대를 채워주는 고고학적 성과가 하나 둘 확인되면서 구석기시대부터 사람이 거주하였던 것으로 확인됩니다. 삼국이 성립되기 전까지 대구에는 작은 읍락이 모여 달구벌(達句伐) 또는 달구불(達句火) 등으로 일컫던 부족국가를 형성한 것으로 보이며, 신라 첨해이사금 15년(261)에 달벌성을 쌓고 나마(奈麻) 벼슬의 극종(克宗)을 성주로 삼았다는 내용이 『三國史記』에 전해지고 있습니다.'大丘'라는 이름은 신라 경덕왕 16년(757) 지방행정단위의 명칭을 개혁하면서 처음 사용되었으며, 정조 2년(1778) 정조실록에서 '大邱'라는 표기가 처음 나타났습니다. 선조 34년(1601)에는 경상도의 행정, 산업, 군수를 총괄하는 경상감영이 설치되어 정치ㆍ경제ㆍ문화 전 분야에 걸쳐 영남지역의 중심지가 되었습니다. 일제침략이 시작되던 1907년 대구의 서상돈이 중심이 되어「국채 1,300만원 보상취지서」란 격문을 발표하면서 시작된「국채보상운동」과 1960년 4ㆍ19 민주혁명의 기폭제가 되었던 「2ㆍ28 학생의거」등은 나라를 위해 중요한 고비마다 빛나는 향도의 역할을 다해 온 대구시민의 정신으로 자리 잡고 있습니다.1981년 7월 1일에는 직할시로 승격되면서 월배ㆍ성서ㆍ공산지역을 비롯해 칠곡ㆍ안심ㆍ고산지역을 편입하여 시역이 454.9㎢로 확장된 데 이어, 1995년에는 달성군 전역을 편입하면서 시역이 885.6 ㎢로 크게 늘어나게 되었고 대구광역시로 개칭하였습니다. 그해 7월 1일 본격적으로 지방자치가 실시되었으며,  2023년 7월 1일 군위군이 편입되어 시역이 1,499.53㎢로 확장 되었습니다.희망찬 2000년대의 세계적인 「섬유패션도시」, 쾌적하고 푸른「숲의 도시」를 꿈꾸는 250만 시민들이 세계 속의 일류도시로의 힘찬 도약을 준비하고 있습니다.
