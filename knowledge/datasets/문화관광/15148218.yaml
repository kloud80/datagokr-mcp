summary_user: 한국학중앙연구원 고문서자료관이 디지털화한 고문서의 이미지 단위 목록으로, 한 행이 문서 이미지 하나이며 문서명, 문서 세로·가로 크기(cm), 이미지 번호, 이미지 파일명, 자료 고유식별번호를 담는다(CSV 약 13.7MB). 연구자나 아카이브 담당자가 특정 고문서가 몇 장의 이미지로 디지털화됐는지, 실물 크기는 얼마인지 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 없어, 같은 기관의 자료 고유식별번호(UID)나 문서명으로만 고문서자료관의 다른 목록과 이어 쓴다.
description_portal: '이 데이터는 한국학중앙연구원 고문서자료관에서 디지털화하여 보유·관리 중인 전통문헌의 이미지 및 서지 메타데이터를 체계적으로 정리한 목록입니다. 각 행은 하나의 문서 이미지에 해당하며, 문서명, 문서의 세로·가로 크기(단위: cm), 이미지 번호, 이미지 파일명, 자료 고유식별번호(UID) 등의 항목으로 구성되어 있습니다. 이를 통해 해당 문헌이 어떤 물리적 형태로 존재하는지, 어떤 방식으로 디지털화되어 관리되고 있는지를 상세히 확인할 수 있습니다. 이러한 데이터는 고문서의 단순 보존을 넘어, 효율적인 검색·열람·활용을 위한 디지털 아카이빙 인프라의 핵심 자료로 활용됩니다.'
