summary_user: 울산대공원 안의 시설별로 시설명·연면적·대지면적·주요시설·주요기능·연락처·주소·데이터 기준일자를 담은 소규모 목록 파일(csv 약 2KB)이다. 시민이나 여행객이 울산대공원에 어떤 시설이 있고 각 시설의 규모와 용도, 연락처가 무엇인지 확인할 때 쓴다. 실측 조인 키는 시설명(uicf_facility_nm) 하나뿐이고 TourAPI 콘텐츠ID나 지역코드 같은 공통 코드가 없으므로, 다른 관광·시설 데이터와는 시설명이나 주소를 맞춰 이어 쓴다.
description_portal: 울산시설공단은 울산대공원의 시설 운영 현황과 관련 정보를 시민들에게 투명하게 제공하고, 공공시설 이용 편의를 높이기 위해 울산대공원 정보를 데이터 형태로 공개하고 있습니다. 이 데이터는 시설명, 연면적(제곱미터), 대지(부지)면적, 주요시설, 주요 기능, 연락처, 주소, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 시민들은 울산대공원의 시설별 면적, 주요 기능 및 용도를 확인할 수 있으며, 산책로, 놀이터, 생태 체험시설, 공연장 등 다양한 편의시설의 존재 여부를 파악할 수 있습니다. 데이터 기준일자를 통해 정보의 최신성도 확인할 수 있습니다.
