summary_user: 서울특별시 성동구의 청소년게임제공업(인형뽑기·오락실 등 전체이용가 게임장) 업소를 건별로 담은 인허가 원천 데이터로, 인허가·취소·폐업일자, 영업상태, 업소명, 지번·도로명 주소와 좌표, 층수·시설면적·비상구 등 시설 정보를 포함한다. 성동구에서 현재 영업 중인 오락실이나 인형뽑기방이 어디에 있고 언제 문을 열거나 닫았는지 확인하려는 주민·창업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 인형뽑기, 오락실 등 전체이용가 게임물을 설치·운영하여 다양한 연령대가 안전하게 게임을 즐길 수 있도록 하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 게임물관리 및 건전한 여가 문화 조성과 관련해 모든 이용자가 제한 없이 참여할 수 있는 오락시설의 행정관리와 업소 현황 파악은 지역사회 문화 복지와 안전한 놀이 환경 조성에 매우 중요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어, 각 업소의 인허가 내역, 영업 개시 및 종료, 운영 상태 등 행정정보를 상세히 확인할 수 있습니다. 성동구청 등 관할 행정기관의 정기적 점검 및 정보 갱신을 통해 데이터의 신뢰성과 최신성을 보장합니다. 본 데이터는 오락실 및 게임장 관리, 정책 수립, 시장 동향 분석, 소비자 정보 제공, 청소년 문화시설 연구 등 다양한 분야에서 활용됩니다. 업계, 행정기관, 연구자, 시민 모두에게 투명하고 실용적인 자료를 제공하며, 데이터는 지속적으로 최신화됩니다.
