summary_user: 부산시에서 열린 국악·전통무용 공연을 공연 건별로 담은 목록으로, 공연명(title), 공연 장소명, 시작·종료일, 유료 여부 등을 담는다. 부산에서 열리는 국악이나 탈춤 같은 전통예술 공연을 언제 어디서 볼 수 있는지, 무료 공연이 있는지 찾는 시민·관광객과, 지역 전통예술 공연 현황을 살피는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 KOPIS 공연ID·공연장ID로 바로 붙일 수 없고, 공연장명이나 공연명을 이름으로 맞춰 KOPIS 공연·공연장 데이터나 문화시설 목록과 이어 쓴다.
limits: 공통 조인 키가 없어 다른 공연·시설 데이터와는 이름 매칭으로만 연결되며 표기 차이로 누락이 생길 수 있다. 갱신은 정기적이지 않은 이벤트성 주기로 분류돼 있어 최신 공연이 바로 반영된다고 보기 어렵다. 개발계정 호출은 하루 10,000회로 제한된다.
