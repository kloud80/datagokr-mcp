description_portal: 부산시에서 공연된 전통예술 목록 데이터를 개방합니다.한국 전통 예술(Korean Traditional Arts)은 오랜 역사와 문화 속에서 형성된 한국 고유의 예술 형식으로, 음악, 무용, 미술, 공예, 문학 등 다양한 분야에 걸쳐 있습니다. 이 예술들은 조상들의 정서, 철학, 자연관, 공동체 정신을 바탕으로 발전해 왔으며, 오늘날에도 계승되고 있습니다.정악, 민속악으로 구분되는 국악과, 궁중무용, 민속무용, 탈춤으로 구분되는 전통무용, 그리고 회화, 도자기, 공예 등의 분야로 나눌 수 있으며개방되는 데이터는 국악, 전통무용에 대한 공연 데이가 포함되어 있습니다.
