description_portal: 경상감영 풍속재연 행사는 조선시대 경상도 지방의 정치‧문화 중심지였던 경상감영(慶尙監營)의 전통 의식과 문화를 체험할 수 있는 역사·문화 축제로 대구 중구에 위치한 경상감영공원(대구 중구 경상감영길99) 일원에서 매년 개최됩니다.  2025-10-18(토)~2025-10-19(일) 이틀간 경상감영공원으로 오시면, 역사 재연 프로그램(감영 안팎을 순찰하는 순라활동,  타종으로 백성에게 시간을 알리는 경점시보, 지휘관인 수문장 근무교대 의식, 군사들의 교열 및 전통무예 시범, 취타대 공연), 체험 및 참여 행사(향시, 전통의상(복식) 입기 및 기념사진 촬영, 형벌 및 가마 체험, 민속놀이, 마당놀이 등 시민 참여형 프로그램), 공연 및 볼거리(취타대 퍼레이드, 전통음악 연주 및 민속공연, 박진감 넘치는 무예 시범) 등 볼거리와 즐길거리가 가득한 행사를 만나실 수 있습니다. 선조 34년(1601년), 대구에 설치된 경상감영은 경상도를 관할하는 최고 지방 관청으로, 현재 공원으로 조성된 경상감영지에는 과거 관찰사가 공무를 보던 선화당과 징청각이 원 위치에 잘 보존되어 있습니다. 400년이 넘는 역사가 깃든 경상감영에서 유구한 전통과 문화를 느껴보시기 바랍니다.
