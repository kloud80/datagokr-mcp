summary_user: 경상북도 영천시 안의 동네 체육시설(공원·경로당·야외운동기구·산책로 등)을 시설 한 곳씩 시설명, 도로명·지번주소, 위도·경도로 담은 개별 시설 목록이다. 영천 시민이 집 근처에서 쓸 수 있는 야외운동기구나 체육시설이 어디 있는지 찾거나, 분석가가 읍면동별 체육시설 분포와 접근성을 따질 때 쓴다. 전역 조인 키는 없어서 주소를 행정구역으로 매핑하거나 좌표를 공간 결합해 인구·공원 등 다른 데이터와 잇는다.
description_portal: 해당 데이터는 경상북도 영천시의 동네 체육시설 현황을 상세하게 기록한 자료입니다. 영천시 내 각 지역별로 위치한 체육시설물, 공원, 경로당, 야외운동기구, 산책로 등 다양한 유형의 체육 시설 설치 정보를 포함하고 있으며, 시설명, 주소, 위도, 경도 등의 기본 정보를 제공하고 있습니다. 이를 통해 시민들의 건강 증진과 여가 활동을 지원하는 공공 체육 인프라의 현황을 파악할 수 있으며, 지역별 체육시설 분포와 접근성을 분석하는 데 유용하게 활용될 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 새마을체육과로 연락주시기 바랍니다.
