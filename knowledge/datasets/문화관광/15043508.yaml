summary_user: 비양도 무장애여행 지점별 위치 정보(위도·경도·해발고도)를 담는 제주데이터허브 원천 데이터로, 포털 설명상 해안산책로 주변 지형과 주차장·진입로·화장실 같은 교통약자 편의시설의 장소 설명·이미지를 함께 다룬다. 휠체어 이용자나 교통약자 동반 여행자, 관광 정책 담당자가 '비양도 안에서 무장애로 이동할 수 있는 지점과 편의시설은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 좌표나 장소 이름 매칭으로만 연결한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 비양도 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 비양도는 제주도 서쪽 한림항 에서 도항선을 이용해 약 15분 정도 이동하면 도달할 수 있는 작은 화산섬으로, 면적은 약 0.59 ㎢이며 2~3시간이면 섬 전체를 둘러볼 수 있을 정도로 규모가 아담하다. 섬 내부는 해안산책로를 중심으로 해안 절벽, 기암괴석, 염습지, 숲과 자연 지형이 어우러져 있으며, 본 무장애여행 데이터는 이러한 지형 및 구조에 대한 위치 좌표, 장소 설명, 이미지 정보 뿐 아니라 주차장, 진입로, 산책로, 화장실 등 장애인 및 교통약자 이용자를 위한 편의시설 현황과 접근성 정보를 포함한다. 다만 도항선의 구조상 휠체어 탑승이 어려울 수 있다는 안내가 포함되어 있으며, 섬 안에서의 이동은 해안 산책로 위주로 설계되어 있어 상대적으로 무장애 이동이 가능하다. 이 데이터는 비양도를 무장애 관광지로 분류하고, 관광정책 수립이나 정보 제공, 여행 안내 등에 활용 가능한 객관적 공공 정보 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
