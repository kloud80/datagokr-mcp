summary_user: 실감데이터공동활용플랫폼에 등록된 2D 문화 데이터 한 건을 한 행으로 담은 목록 파일로, 데이터명·시대·재질·분류·제공처·사용용도·설명·원본파일형태·파일확장자·생성일 등을 담는다(CSV 약 57KB, 전국·비공간). 콘텐츠 제작자나 전시·교육 기획자가 "특정 시대·재질의 유물 2D 이미지 자료가 있는지, 어디서 제공하고 어떤 형식인지" 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 데이터명·제공처 같은 이름 매칭이나 같은 기관의 3D 등 다른 실감데이터 목록과 이름으로만 이어 쓴다.
description_portal: 한국문화정보원에서 제공하는 실감데이터공동활용플랫폼의 2D 데이터는 문화산업 전반에 활용할 수 있도록 체계적으로 정리된 자료입니다. 데이터는 데이터명, 시대, 재질, 종류, 제공처, 사용용도, 설명, 상세정보, 원본파일형식, 파일확장자, 생성일, 형태 등 다양한 컬럼으로 구분되어 제공되며, 이를 통해 사용자는 원하는 정보를 손쉽게 검색하고 활용할 수 있습니다. 이러한 구조화된 데이터는 연구, 교육, 전시, 콘텐츠 제작 등 여러 분야에서 효율적으로 응용할 수 있으며, 특히 문화유산의 디지털 보존과 재창작에 중요한 역할을 합니다. 표준화된 형식을 기반으로 제공되기 때문에 다른 시스템과 연계하거나 확장 활용하기에도 적합합니다.
