description_portal: 무대예술전문인 자격검정 표준교재 정보는 무대예술분야 전문인력 확충과 저변확대를 기하고자 공연법 제14조에서 동 자격제 도입 이후 1년에 한 번 (1회 또는 2회 진행, 현재는 1회) 진행되고 있는 시험을 위해 수험생이 필독 해야하는 표준교재에 대한 데이터베이스입니다.이 데이터는 교재명, 저자, 출판사, 분야에 대한 정보를 제공합니다.본 공공데이터는 구 표준교재와 표준교재(신간), 용어집으로 구축된 데이터 입니다.구 표준교재는 과목별 3권씩이었고, 신간은 단권화 되었으며 이를 위해 내용 편집 및 최신 법규를 적용하였습니다. 구 표준교재를 보유하고 있는 수험생이 많아 홈페이지에서는 혼란을 방지하기 위해 구 표준교재와 표준교재(신간)를 함께 노출하고 있습니다.
