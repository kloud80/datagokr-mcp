summary_user: 서울특별시 성동구의 PC방 등 인터넷컴퓨터게임시설제공업 업소를 한 곳씩 담은 인허가 원천 데이터로, 인허가일자·취소일자, 영업상태와 상세 영업상태, 폐업·휴업 기간, 지번·도로명 주소와 좌표, 시설면적·층수·비상구 같은 시설 항목을 업소별로 담는다. 구청 담당자나 창업 예정자가 "성동구에서 지금 영업 중인 PC방은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드나 업소명·주소 매칭으로 잇는다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 PC방 등 컴퓨터를 비롯한 다양한 게임물 이용에 필요한 기자재를 설치하거나, 기타 정보제공물을 이용할 수 있도록 서비스를 제공하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 디지털 여가·문화 소비가 확산됨에 따라, 게임장 및 정보제공업소의 건전한 운영 환경 조성과 이용자 안전, 행정 관리의 중요성이 점점 커지고 있습니다. 데이터 항목에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 업소별 인허가 이력과 영업 개시, 종료, 행정변동 내역을 명확히 확인할 수 있습니다. 성동구청 등 관할 행정기관에서 정기적인 점검과 정보 갱신을 통해 데이터의 신뢰성과 최신성을 확보하였습니다. 본 데이터는 PC방 및 정보제공업 업계 현황 파악, 정책 수립, 시장동향 분석, 업소 관리, 소비자 정보 제공 등 다양한 분야에서 폭넓게 활용할 수 있으며, 행정기관, 업계, 연구자, 일반 시민 모두에게 객관적이고 실질적인 자료를 제공합니다. 데이터는 지속적으로 최신화됩니다.
