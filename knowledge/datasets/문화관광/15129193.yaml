summary_user: 경상북도 예천군 관내에서 인허가를 받은 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 주소·소재지 전화·데이터기준일자가 들어 있다. 예천 여행객이나 숙박업 창업 준비자가 '예천군에 어떤 숙박업소가 어디에 있고 연락처는 무엇인가'를 확인하거나, 군 단위 숙박업소 분포를 파악하는 데 쓴다. 전역 조인 키나 코드표는 없어서, 다른 데이터와는 업소명·주소 문자열 매칭으로 잇거나 공중위생 인허가(LOCALDATA) 숙박업 자료와 이름·주소로 대조해 쓴다.
limits: 예천군 한 곳만 다루며 공통 업소 식별 코드가 없어 다른 지역·원천 자료와 정확히 결합하려면 이름·주소 매칭에 의존해야 한다. 실측 컬럼에는 객실 수나 영업 상태가 없으므로 숙박 규모·시장 분석은 LOCALDATA 같은 인허가 원천을 함께 봐야 한다.
