summary_user: 경기도 내 하천·계곡·폭포 등 물놀이 장소별로 집계년도, 시군·읍면동, 장소명과 유형, 도로명주소·세부지명, 관리등급, 위험표지판·인명구조함·구명조끼·구명환·구명로프·구조봉 등 안전장비 수량을 장소 단위로 담는다. 여름철 앞두고 "우리 시군의 어느 계곡이 관리등급이 높고 구조장비가 부족한가"를 확인하려는 지자체 안전 담당자나 물놀이 장소를 고르는 시민이 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)나 시군·읍면동명, 장소명 매칭으로 같은 경기도 데이터나 관광지 목록과 이어 쓴다.
description_portal: 이 데이터는 경기도 내 하천, 계곡, 폭포 등 물놀이가 가능한 장소의 안전관리 현황을 제공하는 자료입니다. 각 장소에 대해 집계년도, 시군명 및 읍면동명, 물놀이장소명, 장소 유형, 도로명건물번호, 세부지명 등 기본 정보를 포함하며, 관리등급과 위험표지판 개수, 인명구조함, 이동식거치대, 구명조끼, 구명환, 구명로프, 구조봉, 기타 안전장비의 수량을 포함합니다. 이 데이터는 여름철 물놀이 시즌에 앞서 지자체 및 안전관리 기관이 위험지역을 사전에 점검하고, 안전조치를 강화하기 위한 근거 자료로 활용될 수 있습니다. 시민들은 이 데이터를 기반으로 안전하게 물놀이를 즐길 수 있는 지역을 선택할 수 있으며, 관광지 안전도 평가, 안전시설 배치 계획 수립, 물놀이 사고 예방 캠페인 등의 기초 자료로도 활용됩니다. 해당 데이터는 수시로 갱신되며, Open API 형식으로 제공되어 공공기관 및 민간 앱 서비스에서도 활용이 가능합니다.
