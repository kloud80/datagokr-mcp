summary_user: 대구광역시 북구 관내 생활체육시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·지번주소·위도·경도·설치년도·보유시설(축구장·테니스장·파크골프장 등)·관리기관과 연락처를 포함한다. 북구 주민이 "우리 동네에서 파크골프나 테니스를 칠 수 있는 공공 시설이 어디이고 누가 관리하나"를 찾거나, 분석가가 동별 체육시설 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표로 공간 결합하거나 시설명·관리기관 이름으로 맞춰 이어 쓴다.
description_portal: '대구광역시 북구 생활체육시설 정보본 자료는 대구광역시 북구 관내에 설치된 생활체육시설의 현황을 종합적으로 정리한 것으로, 각 시설별 위치 및 설치 시기, 보유 체육시설, 관리주체 등 세부 정보를 포함하고 있습니다. 이 데이터는 주민의 건강 증진과 여가 활동 활성화를 위한 체육 인프라 구축 현황을 파악하고, 향후 시설 유지관리 및 확충을 위한 정책 수립에 활용될 수 있도록 구성되었습니다.제공되는 항목은 다음과 같습니다.시설명: 생활체육시설의 공식 명칭소재지 주소: 도로명주소 기준의 정확한 위치 정보설치년도: 해당 시설이 최초로 설치된 연도보유시설: 축구장, 야구장, 테니스장, 파크골프장, 기타체육시설 등 보유 시설의 종류 및 수량관리기관: 시설의 유지보수 및 운영을 담당하는 주체 (예: 북구청 체육진흥과, 동 행정복지센터, 위탁단체 등)이 데이터는 북구 각 동에 분포된 체육시설의 운영 현황을 한눈에 파악할 수 있도록 구성되어 있으며, 축구, 야구, 테니스, 파크골프 등 다양한 종목별 생활체육 수요에 대한 지역별 접근성과 편의성 분석에 활용될 수 있습니다. 특히 고령자, 청소년, 일반 주민 등 다양한 계층이 일상적으로 참여할 수 있는 야외운동 공간이 포함되어 있어, 이용자 중심의 시설 확충 계획 수립과 민원 대응, 예산 배분 등의 행정업무에도 실질적인 기초자료로 활용됩니다.또한, 시설별로 어떤 종목이 가능한지 구체적인 분류가 포함되어 있어, 주민들에게 체계적인 체육시설 이용 안내를 제공하고, 지역 내 체육 활동의 균형 발전을 도모하는 데에도 유용합니다.'
