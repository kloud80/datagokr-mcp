description_portal: '- 한국방송광고진흥공사에서 관리하는 AiSAC(AI 기반 광고 창작 지원 시스템) 홈페이지의 2025년 이후 국가별 접속 현황 데이터를 제공합니다.- 개방 데이터는 년, 월, 일, 접속국 한글명, 접속국 영문명, 접속국별 접속수 총 6가지 항목으로 이루어져 있습니다.- 접속국은 대한민국, 미국, 싱가포르, 벨기에, 일본, 중국, 캐나다, 러시아, 오스트레일리아 등 다양한 국가로 구성되어 있습니다.- 공공기관 대표 홈페이지 및 AI 서비스 사이트 구축, 국가별 활용 현황 파악 및 연구를 위해 주요 접속국 현황 자료가 필요한 연구기관 및 학계, 기관에서 기초자료로 활용할 수 있습니다.'
