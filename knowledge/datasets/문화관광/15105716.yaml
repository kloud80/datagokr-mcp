summary_user: 전국 사후면세점(Tax Free 환급 매장)을 영업장 한 곳당 한 행으로 담은 목록 파일로, 영업장명·도로명/지번 주소·좌표·우편번호·영업요일·요일별 운영시간·전화번호·홈페이지를 포함하며 포털 설명상 약 6천 건이다. 외국인 관광객 대상 쇼핑 안내 서비스나 다국어 지도를 만드는 사업자, 그리고 '어느 지역에 사후면세점이 몰려 있고 어디가 부족한가'를 보려는 분석가가 쓴다. 전역 조인 키나 TourAPI contentId·지역코드가 없어 다른 데이터와는 주소 문자열이나 좌표(GPS X·Y축)로 행정구역·주변 관광지에 공간 매칭해 이어 쓴다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 전국 사후면세점 목록입니다. 외래관광객들의 쇼핑관광 편의 제고를 위해 전국 사후면세점에 대한 종합 정보를 구축하여, 외래관광객들이 사후면세점을 쉽고 편리하게 이용할 수 있도록 위치 및 판매 정보 등을 제공하고 있습니다. 개방 데이터는 사후면세점 영업장명, 주소, 좌표, 우편번호, 영업요일, 운영시간, 전화번호, 홈페이지 주소로 약 6천 건 입니다. 해당 데이터를 활용해 지역별 사후면세점 분포를 분석하여 정책 수요 예측 및 유치 전략 수립에 활용하고, 면세점 위치 정보를 이용해 다국어 지도 제작 및 관광 플랫폼 연동 등에 활용할 수 있습니다.
