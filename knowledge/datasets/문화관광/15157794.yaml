summary_user: 경상북도 영천시에 있는 태권도장·당구장·댄스클럽 등 민간 체육시설업 업소를 한 건씩 담은 명부로, 상호와 도로명·지번 주소, 위도·경도를 제공한다. 주민이나 분석가가 '우리 동네 근처에 어떤 체육도장·당구장이 있는가'를 찾거나 영천시 체육시설업의 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어서 다른 데이터와는 상호·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 인허가번호·사업자번호·업종코드가 없어 개폐업 이력이나 다른 기관 데이터와의 정확한 연결은 이 데이터만으로 하지 못한다. 범위는 영천시 한 곳에 한정되며, 호출에는 포털 활용신청 후 발급되는 serviceKey가 필요하다(개발계정 일 10,000회).
