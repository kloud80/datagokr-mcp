summary_user: 춘천시 관내에서 열리는 문화축제를 축제 한 건씩 담은 원천 목록으로, 축제명·개최장소·시작일과 종료일·축제내용·주관·주최·후원기관·전화번호·홈페이지와 도로명·지번 주소, 위경도 좌표를 포함한다. 춘천 여행을 계획하는 시민이나 관광객이 '이번 달 춘천에서 열리는 축제가 어디서 언제 하나'를 확인하거나, 분석가가 시내 축제의 개최 위치를 지도에 표시하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어서 축제명·주소 같은 이름 매핑이나 좌표(latitude·longtitude)로 주변 관광·시설 데이터와 이어 쓴다.
description_portal: 강원도 춘천시의 관내 문화축제 데이터로 축제명, 개최장소, 축제시작일자, 축제종료일자, 축제내용, 주관기관, 주최기관, 후원기관, 전화번호, 홈페이지주소 등에 대한 데이터를 제공합니다.
