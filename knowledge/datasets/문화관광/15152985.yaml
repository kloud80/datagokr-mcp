description_portal: 성북구 공연장 정보 데이터는 성북구 내 공공·민간 공연장의 시설 현황을 체계적으로 제공하는 데이터셋입니다.공연장의 기본 정보(공연장명, 소재지, 연락처)뿐 아니라, 법인명, 객석수, 영업상태, 운영형태(공공/민간 여부, 직영/수탁 여부), 건축면적·무대면적 등 공연장의 물리적·운영적 특징을 세부적으로 포함하고 있습니다.또한 구동식기구수, 고정식기구수 등 공연장 시설 장비 현황까지 제공하여 공연예술 인프라 분석에 매우 유용한 자료입니다.해당 데이터는 지역 공연예술 정책 수립, 문화시설 분포 분석, 공연장 이용 안내 서비스 개발, 문화예술 생태계 연구 등에 다양하게 활용할 수 있습니다.
