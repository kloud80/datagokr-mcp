summary_user: 서울 성북구 관내 공원 등에 설치된 야외 운동기구를 설치 장소(공원명)·도로명/지번 주소·기구 종류·수량 단위로 정리한 시군구 범위의 개별 시설 목록 파일입니다(포털 설명상 2021년 8월 13일 기준). 성북구 주민이 집 근처 어느 공원에 어떤 운동기구가 있는지 찾거나, 분석가가 공원별 기구 분포와 동네 간 편차를 살필 때 쓴다. 전역 조인 키는 없어 주소나 공원명을 기준으로 공원 현황·좌표 데이터 등과 이름·주소 매칭으로 이어 써야 한다.
description_portal: 이 데이터는 2021년 8월 13일 기준으로 서울특별시 성북구 관내에 설치된 야외 운동기구의 현황을 정리한 자료입니다. 각 운동기구가 설치된 공원명 또는 위치, 주소, 운동기구 종류, 기구 수량 등의 정보가 포함되어 있어 지역 내 공공체육 기반시설의 분포를 한눈에 파악할 수 있습니다. 본 자료는 주민의 생활체육 활성화를 위한 시설 개선, 도시공원 관리, 운동기구 안전점검 계획 수립 등 다양한 행정·연구 분야에서 활용될 수 있으며, 공원별 운동기구 종류와 밀집도를 분석하여 지역 간 체육시설 불균형 해소 및 생활체육 인프라 확충 정책 마련에도 도움을 주는 기초자료입니다.
