summary_user: 국가등록문화유산별 현장 안내판의 문안을 한 행씩 담은 건별 원천 파일로, 종목 및 관리번호·국가유산명·소재지·등록상태와 함께 한국어·영어·중국어·일본어 안내 문안, 폐기·공개 여부, 최종제출일자·설치일자를 담는다(전국 범위, CSV 약 30KB). 해설 콘텐츠나 다국어 안내 자료를 만드는 사람이 '이 등록문화유산 안내판에는 어떤 설명이 외국어로 어떻게 적혀 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 종목 및 관리번호나 국가유산명을 국가유산청 지정·등록 유산 목록·상세 API의 종목코드·지정번호에 매핑해야 다른 데이터와 이어 쓸 수 있다.
description_portal: 국가유산청_국가등록문화유산 안내문안목록 데이터는 국가등록문화유산을 국민에게 알기 쉽게 소개하기 위해 마련된 안내문 초안과 관련 정보를 체계적으로 정리한 자료이다. 이 데이터에는 각 등록문화유산의 명칭, 위치, 등록번호, 등록연도, 유형, 역사적 배경과 주요 특징, 보존 가치 등이 포함되며, 이를 설명하는 안내문 문안이 함께 제공된다. 특히 국가등록문화유산은 근현대 건축물, 산업시설, 생활사 관련 유산 등 다양한 범주를 포괄하기 때문에 안내문안목록은 국민이 유산의 역사적 의미와 문화적 맥락을 이해하는 데 중요한 역할을 한다. 또한 현장 안내판, 전시 해설, 홍보 자료, 교육 콘텐츠 제작에 직접 활용될 수 있으며, 연구자와 행정기관이 정책 수립이나 대국민 서비스 개선을 위한 기초 자료로 활용 가능하다. 본 데이터는 국가등록문화유산의 체계적 보존과 활용, 그리고 국민적 공감대 확산을 지원하는 공공 데이터로서 가치가 높다.
