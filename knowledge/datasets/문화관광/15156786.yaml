description_portal: '국립현대미술관 4관(서울, 과천, 덕수궁, 청주)에서 진행된 교육프로그램 목록입니다.- 데이터: 미술관명, 교육명, 교육대상, 교육시작일, 교육종료일, 교육장소- 기간: 2025년 1월 1일 ~ 12월 31일본 데이터는 국립현대미술관 4개 관(서울, 과천, 덕수궁, 청주)에서 2025년 1월 1일~12월 31일 기간 동안 운영된 교육프로그램의 운영 현황을 정리한 목록(리스트) 데이터입니다. 각 프로그램의 기본 식별정보와 운영정보를 체계적으로 수록하여, 연간 교육사업의 구성과 운영 범위를 한눈에 파악할 수 있도록 구성되었습니다.데이터 항목은 프로그램이 어느 관에서 운영되었는지를 나타내는 미술관명, 프로그램의 고유 명칭을 나타내는 교육명, 참여자 범주를 구분하기 위한 교육대상, 실제 운영 기간을 확인할 수 있는 교육시작일/교육종료일, 그리고 프로그램이 진행된 물리적 또는 지정 공간을 나타내는 교육장소로 구성됩니다. 이를 통해 이용자 관점에서는 “어떤 대상에게, 언제, 어디서, 어떤 교육이 제공되었는가”라는 핵심 정보를 확인할 수 있으며, 기관 운영 관점에서는 연간 교육프로그램의 대상별 편성 현황, 기간별 운영 집중도, 관별/공간별 운영 분포 등을 분석하는 기초 자료로 활용할 수 있습니다.또한 본 목록은 개별 교육프로그램의 상세 커리큘럼이나 운영 성과(참여자 수, 만족도 등)를 직접 포함하기보다, 프로그램 단위의 운영 이력(메타정보)을 중심으로 정리된 자료라는 점에서, 연간 사업 성과 보고, 운영 현황 공유, 대외 안내 자료 작성, 내부 통계 산출(대상·기간·장소 기준 분류/집계) 등에 적합합니다. 필요 시 본 데이터를 기반으로 대상군 분류 체계 정교화, 프로그램명 표준화, 운영 장소 코드화 등 후속 정비를 수행하면 데이터 활용도가 더욱 높아집니다.'
