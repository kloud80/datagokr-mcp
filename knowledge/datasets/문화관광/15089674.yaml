summary_user: 인천광역시 서구(서해구) 안에 등록된 국내외여행업체를 업체 한 곳당 한 행으로 담은 파일로, 업종·상호명·등록일자·도로명/지번 소재지·전화번호를 개별 주소 단위로 제공한다(CSV 약 9KB). 주민이나 여행객이 '우리 동네에 정식 등록된 여행사가 어디 있고 언제 등록됐는가'를 확인하거나, 분석가가 구 단위 여행업 분포를 볼 때 쓴다. 다른 데이터와 맞출 공통 조인 키(등록번호·사업자번호 등)는 실측 컬럼에 없어서, 상호명이나 소재지 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 내 국내외여행업 등록업체의 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 운영중인 국내외여행업체의 업종,상호명,등록일자,소재지(도로명),소재지(지번),전화번호 등 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 주민들은 서구 지역 내의 국내외여행업체를 손쉽게 파악할 수 있으며, 이를 통하여 주민들의 안전하고 신뢰할수 있는 여행서비스를 선택하는데에 도움을 줄 수 있을것으로 판단이 됩니다. 본 데이터는 연마다 정기적 갱신을 통해 최신정보를 반영하고 있습니다.
