summary_user: 경기도 내 숙박업체(여관·모텔·호텔·펜션 등)의 인허가 현황을 업소 한 곳당 한 행으로 담으며, 영업상태·인허가일·폐업일, 주소와 WGS84 좌표, 객실(한실·양실)·침대 수, 건물 층수, 종사자 수가 들어 있다. 분석가나 지자체 담당자가 '우리 시군에서 현재 영업 중인 숙박업소와 객실 규모는 얼마이고, 최근 폐업한 곳은 어디인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 시군 코드·시군명, 주소나 좌표 기준으로 관광 통계·관광사업 등록 같은 다른 데이터와 이어 붙이고, 같은 공중위생 인허가(LOCALDATA) 원천의 숙박업 자료와는 사업장명·주소로 대조한다.
description_portal: 이 데이터는 경기도 내 전체 숙박업체의 인허가 현황을 제공하며, 여관, 여인숙, 모텔, 호텔, 펜션, 풀빌라 등 다양한 숙박시설이 포함됩니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘재개업일자’, ‘휴업기간’, ‘조건부허가 사유 및 기간’, ‘소재지도로명주소’, ‘우편번호’, ‘WGS84 위도·경도’, ‘위생업태명’, ‘업태구분명정보’, ‘건물 지상·지하층수’, ‘객실수(한실·양실)’, ‘욕실수’, ‘침대수’, ‘세탁기수’, ‘여성·남성 종사자 수’, ‘다중이용업소여부’ 등이 있습니다. 이를 통해 숙박업체의 위치, 운영 상태, 시설 규모, 인력 현황, 위생·안전 관리 정보를 종합적으로 파악할 수 있습니다. 데이터는 경기도 31개 시군 단위로 제공되며, 지역별 숙박 인프라 분석, 관광산업 활성화 정책 수립, 안전 관리 및 위생 점검 자료로 활용됩니다. 또한 숙박업종별 차이를 비교하여 시장 구조를 분석하거나, 관광객 수용능력 평가 및 지역경제 기여도 분석 등에도 유용합니다.
