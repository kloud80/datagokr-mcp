description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 전기차(EV) 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적 분석이 가능합니다.본 자료는 국내 주요 언론사의 전기차 관련 보도를 대상으로, 어떤 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 보도 프레임이 어떠했는지 등의 패턴을 밝히는 데 중점을 두고 있습니다. 이러한 분석은 언론이 전기차 산업 동향, 배터리 기술 발전, 충전 인프라 확충, 글로벌 자동차 시장 변화 등을 어떻게 다루는지, 그리고 이러한 보도가 국내 산업정책, 소비자 인식, 기업 전략에 어떤 영향을 미쳤는지를 추적하는 데 유용합니다.또한 학계, 언론 연구자, 산업·기술 전문가, 모빌리티 정책 입안자 등에게 전기차 관련 보도의 경향, 이슈별 프레임 변화, 언론의 미래 산업·기술 이슈 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
