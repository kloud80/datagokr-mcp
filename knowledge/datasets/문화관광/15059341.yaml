summary_user: 경기도 내 영화상영관을 사업장(업소) 한 곳당 한 행으로 담은 건별 현황으로, 사업장명·인허가일·영업상태·폐업일·건물 층수·지번/도로명 주소와 WGS84 좌표 등을 포함한다. 시군별로 영업 중인 영화관이 어디에 몇 곳 있는지, 최근 문을 닫은 극장은 어디인지 확인하려는 문화정책 담당자나 상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 주소·좌표, 사업장명 매칭으로 이어 써야 한다.
description_portal: 이 데이터는 경기도 내 영화상영관 및 영화와 관련된 다양한 정보를 제공합니다. 데이터에는 영화관 및 극장의 위치, 상영관 현황, 영화배급 업체 등의 정보가 포함됩니다. 이를 통해 경기도 내 문화예술 인프라의 분포를 파악할 수 있으며, 영화산업 관련 정책 수립, 문화시설 계획, 관광 활성화, 상권분석 등 다양한 분야에 활용할 수 있습니다. 특히 지역별 영화관 수와 영화배급 현황을 기반으로 문화 접근성 및 시민 문화 향유권 확대에 기여할 수 있는 자료로 활용될 수 있습니다. 데이터 활용 시 시설 운영 현황이나 상영관 규모 등 세부 정보의 변동 여부를 고려해야 합니다.
