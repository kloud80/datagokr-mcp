summary_user: 경상남도 사천시 문화관광 홈페이지의 '사천의 길' 게시물을 걷기 코스(둘레길·산책로) 한 건씩 담은 CSV 파일(약 108KB)로, 코스 이름(제목)·소개 본문(내용)·조회수·등록일·계절 항목으로 구성된다. 사천을 찾는 관광객이나 시민이 "계절에 맞춰 걸을 만한 사천의 둘레길·산책로는 어디이고 어떤 코스인가"를 확인하거나, 분석가가 조회수로 코스별 관심도를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광 콘텐츠 등 다른 관광 데이터와는 코스 이름을 맞춰 보거나 같은 기관(사천시) 기준으로만 이어 쓴다.
