summary_user: 인천광역시 미추홀구가 외국인이 이용하기 편리한 곳으로 정한 음식점을 업소 한 곳당 한 행으로 담은 파일이며, 업소명·소재지·지번주소·위도·경도·전화번호·면적·좌석 수와 형태·주차대수·주메뉴·업태를 포함한다(파일 크기 773바이트의 소규모 목록). 미추홀구를 찾은 외국인 관광객이나 거주 외국인, 관광 안내 앱 운영자가 '근처에 외국인이 이용하기 편한 한식·중식당이 어디 있고 주차·좌석은 어떤가'를 확인하는 데 쓴다. 전역 조인 키는 없고 개별 주소와 좌표만 있으므로, TourAPI 음식 콘텐츠나 다른 음식점 목록과는 업소명·주소 대조나 좌표 기반 공간 매칭으로 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 내 외국인이 편리하게 이용할 수 있도록 지정된 음식점 현황을 담고 있습니다. 다국어 메뉴 제공, 외국어 가능 직원, 외국인 추천 여부 등의 항목이 포함되어 있으며, 업소명, 소재지, 업종, 연락처 등 기초 정보도 수록되어 있습니다. 음식점별로 면적, 좌석 수 및 형태, 주차 가능 대수, 위도·경도, 주메뉴 등 세부정보가 제공되며, 한식·중식 등 업종 구분과 주요 메뉴 항목은 관광객 맞춤형 정보 제공에 유용합니다. 좌석 형태는 입식과 좌식으로 구분되어 있고, 주차 가능 여부는 교통 접근성 파악에 활용됩니다. 이 데이터는 외국인 관광객과 거주자에게 접근성을 높이고, 문화 다양성을 반영한 음식점 안내를 지원하는 데 활용되며, 지역 관광 및 국제 교류 활성화의 기초자료로도 활용됩니다. 해당 데이터는 연 1회 갱신되며, 위치 기반 서비스 및 관광 앱 연계 자료로도 적합한 구조를 갖추고 있습니다.
