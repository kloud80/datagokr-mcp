description_portal: '제주특별자치도 민속자연사박물관에서 소장하고 있는 고고민속자료 데이터를 제공합니다.항목: 명칭, 수량, 규격, 국적, 재질, 수장여부 등*민속자연사박물관은 자연을 존중하고 사람의 숨결을 간직한 제주의 대표 박물관입니다. 민속전시실: 제1민속전시실에서는 자연과 공존하며 살아온 제주사람들의 생활 문화가 집약된 공간으로 제주인의 일생(기자祈子, 성장, 혼례, 환갑, 상례, 제례)과 의식주 문화를 소개하고 있습니다. 제2민속전시실에서는 ‘제주의 사계(四季)’를 주제로 계절의 흐름에 따라 의식주, 생산, 의례, 신앙, 음식 문화를 종합적으로 소개하고 있습니다.자세한 사항은 제주특별자치도 민속자연사박물관 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/museum/relicinfo/antiquities.htm'
