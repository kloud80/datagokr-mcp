summary_user: 충청북도 진천군에 신고 수리된 민간 체육시설업(당구장·골프연습장·체육도장·체력단련장·가상체험체육시설 등)을 업소 한 곳당 한 행으로 담은 명부로, 업종·상호·시설주소·영업구분을 담는다. 진천군에서 헬스장이나 골프연습장이 어디에 몇 곳 영업 중인지 찾는 주민이나, 체육시설 개폐업을 지역 상권 신호로 보려는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설주소나 상호 이름을 맞춰 연결하거나, 같은 진천군의 다른 데이터와 군 단위로 묶어 쓴다.
description_portal: 「체육시설의 설치·이용에 관한 법률」에 근거하여 충청북도 진천군에 신고 수리되어 영업 중인 민간체육시설의 현황에 대한 데이터로 업종,상호명,시설주소(도로명주소,지번주소),영업구분 상태에 대한 자료를 제공하고 있습니다. 현재 관내에는 당구장업 36개소, 골프연습장업 23개소, 체육도장업 29개소, 체력단련장업 17개소, 가상체험체육시설업 19개소, 체육교습업 5개소, 종합체육시설업 2개소가 운영 중이며 총 6개 업종, 131개소가 신고되어 있습니다. 해당 데이터는 다양한 운동 및 체육활동에 대한 수요자들에게 유용한 자료로 활용될 수 있습니다.
