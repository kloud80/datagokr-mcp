summary_user: 연천군 주요관광지별 방문객 수를 월별로 집계한 파일로, 한 행이 기준년월이고 관광지마다 열이 하나씩 있는 가로형 구조입니다(포털 설명은 21곳이지만 실제 열에는 당포성·임진강댑싸리공원·고대산캠핑장 등이 더해져 27곳). 한탄강관광지·재인폭포·전망대 같은 연천 관광지 가운데 어느 곳에 언제 방문객이 몰리는지 보려는 지자체 관광 담당자, 지역 상인, 분석가가 씁니다. 관광지점코드나 시군구코드 같은 공통 조인 키는 없으므로, 다른 관광 통계와는 관광지 이름이나 연천군이라는 지역 단위로 직접 맞춰 이어 씁니다.
