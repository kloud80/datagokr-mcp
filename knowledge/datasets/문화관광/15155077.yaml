summary_user: 전국 자치단체가 관리하는 헬스장 등 체력단련장업의 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 전국 27,969건이 있으며 인허가일자·영업상태·휴폐업일자·사업장명·주소·좌표·면적·지도자수 등을 제공한다. 창업자나 상권 분석가가 특정 지역의 헬스장 개업·폐업 추이와 현재 영업 중인 업소 수를 파악하는 데 쓴다. 지번·도로명 주소(LOTNO_ADDR, ROAD_NM_ADDR)로 상권·주소 기반 데이터와, 개방자치단체코드(OPN_ATMY_GRP_CD)는 행정표준 기관코드로 지자체 단위 데이터와 잇고, 영업상태는 영업상태코드표로 풀어 쓴다.
description_portal: '생활_체력단련장업 데이터는 헬스장과 같은 체격관리 및 근력, 유연성, 지구력 강화 등을 목표로 운동을 할 때 필요한 도구와 기구를 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 체력단련장업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부(스포츠산업과) / 043-203-3156 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
