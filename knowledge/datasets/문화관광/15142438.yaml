summary_user: 세종특별자치시 안의 파크골프장 7곳을 한 곳당 한 행으로 시설명·주소·면적(제곱미터)·홀 수·운영기관·연락처를 담은 작은 현황 파일(약 664바이트)이다. 세종시 주민이나 생활체육 동호인이 집 근처 파크골프장 위치, 홀 규모, 문의처를 확인할 때 쓰고, 분석가가 지역별 공공 체육시설 분포를 볼 때도 쓴다. 전역 조인 키나 코드표가 없어서, 다른 체육시설 데이터와는 시설명·주소를 맞춰 보는 방식으로만 연결된다.
description_portal: 세종특별자치시 파크골프장 현황 데이터를 제공합니다. 데이터는 연번, 시설명, 주소, 규모(제곱미터) 홀수, 운영기관 연락처로 구성되어있습니다.세종특별자치시에는 금강파크골프장, 한솔파크골프장, 오가낭뜰파크골프장, 부강파크골프장, 중앙공원파크골프장, 수질복원센터B파크골프장, 조천변 파크골프장 총 7개의 파크골프장이 있으며 세종동, 가람동, 아름동, 부강면, 대평동, 조치원에 소재하고 있고 5개의 골프장은 9개 홀, 18개홀 1개, 36개홀 1개 있습니다.가장 큰 규모의 파크골프장은 세종동에 위치한 금강파크골프장 입니다.
