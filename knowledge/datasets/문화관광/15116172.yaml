summary_user: 서울특별시 중구의 당구장업 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 관리번호(MGTNO), 인허가·취소일, 영업상태(영업·폐업 등), 지번·도로명 주소, 중부원점TM 좌표 등을 포함한다. 당구장 창업을 준비하는 예비 사업자나 상권 분석가가 '중구에서 지금 영업 중인 당구장은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 체육시설업·상권 데이터와는 업소명·주소 매핑이나 같은 기관(개방자치단체) 코드로만 연결한다.
description_portal: '서울특별시 중구의 당구를 하는데 필요한 시설을 갖추어 놓은 업소 정보입니다. 데이터는 각 당구장업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 당구장업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
