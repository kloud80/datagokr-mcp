summary_user: 울산광역시 안의 영화상영관을 한 곳씩 담은 목록으로, 상영관명과 구·군, 소재지 주소, 총스크린수·총좌석수, 전화번호, 홈페이지를 담는다. 시민이나 분석가가 "우리 구·군에는 영화관이 몇 곳이고 스크린과 좌석은 얼마나 되나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 상영관명·주소나 구·군 이름(gugun)으로 맞춰 연결해야 한다.
description_portal: 울산광역시에서 제공하는 영화상영관 현황으로 상영관명을 통해 소재지,총스크린수,총좌석수를 조회 할 수 있습니다.
