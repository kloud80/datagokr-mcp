description_portal: '대전광역시 서구에서 제공하는 강좌, 강연, 공연, 상담, 체험, 견학은 지역 주민과 방문객을 위한 다양한 문화·교육·체험 프로그램을 의미합니다. 이 중 일부는 공공데이터로 공개되어 있어 누구나 일정과 내용을 확인할 수 있습니다.대전광역시 서구 공공데이터 강좌·행사 종류강좌: 지역 내 도서관, 평생학습센터 등에서 진행되는 인문학, 예술, 실용 등 다양한 분야의 교육 프로그램강연: 전문가 초청 강연, 명사 특강 등 지식·경험을 나누는 오픈형 행사공연: 연극, 음악회, 전통예술 등 문화공연 및 축제상담: 법률, 건강, 진로 등 분야별 상담 서비스체험: 가족·청소년 대상 체험 프로그램, 생태·문화·예술 체험견학: 견학 프로그램이용 방법 및 참고사항대전 서구 공공데이터 강좌·행사는 지역 주민의 문화 향유와 평생학습 기회를 확대하는 데 중점을 두고 있습니다'
