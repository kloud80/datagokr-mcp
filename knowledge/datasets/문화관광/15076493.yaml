description_portal: 이 데이터는 한국문화예술위원회가 2014년부터 2019년까지 시행한 문예진흥기금 공모사업 중 시각예술 분야 ‘전시’ 지원 사업의 계량적 성과를 정리한 자료로, 전시 활동의 결과를 정량적으로 파악할 수 있도록 구성되어 있습니다. 주요 항목에는 전시단체명, 사업연도, 창작신작품수(건), 기존국내작품수(건), 기존외국작품수(건), 예술작품생산건수_계(건), 공연기간(일), 공연횟수(회), 전시기간(일), 전시횟수(회), 행사기간(일), 행사횟수(회), ISBN인증발간물종수(종), ISBN인증발간물부수(부), 기타발간물종수(종) 등이 포함되어 있습니다. 창작 신작과 기존 국내·외 작품 수를 통해 전시 콘텐츠의 구성 유형을 파악할 수 있으며, 전시·공연·행사 기간 및 횟수는 실제 운영 규모와 반복성을 가늠할 수 있는 지표로 활용됩니다. 또한 발간물 관련 항목은 결과물의 기록화 수준과 대중 접근 가능성을 보여줍니다. 본 데이터는 전시 실적에 대한 정량적 분석뿐만 아니라 지원사업의 예술적 파급력, 운영 효율성, 성과 확산 정도를 평가하는 데 유용하게 활용될 수 있습니다.
