description_portal: 서울시립미술관 소장품 정보(영문)는 서울시립미술관이 소장하고 있는 작품의 주요 정보를 체계적으로 제공하는 데이터입니다. 부문 항목을 통해 회화, 조각, 사진 등 작품의 분류를 확인할 수 있으며, 수집연도 정보는 작품이 미술관 컬렉션에 편입된 시점을 보여줍니다. 작품명(국문)과 작품명(영문)은 국내외 관람객과 연구자를 모두 고려한 제목 정보를 제공해 전시 안내, 도록 제작, 온라인 서비스 등에 폭넓게 활용할 수 있습니다. 작품규격과 제작년도, 재료/기법 정보는 작품의 물리적 특성과 제작 배경을 이해하는 데 중요한 기초 데이터입니다. 작가명 항목은 작품의 주체와 미술사적 맥락을 파악하는 핵심 요소이며, 메인이미지와 썸네일이미지는 온라인 컬렉션, 전시 홍보, 디지털 아카이브 구축 시 시각적 정보를 제공하는 데 활용됩니다. 이 데이터는 연구, 교육, 전시 기획, 디지털 서비스 등 다양한 분야에서 서울시립미술관 소장품을 효과적으로 소개하고 활용하기 위한 기반 자료입니다.
