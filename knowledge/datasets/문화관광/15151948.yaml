description_portal: '온라인 국어문화학교에서 제공하는 교육 과정 정보로, 국어문화학교는 국어 생활에 필요한 기본 지식, 어문 규범, 공문서 작성, 말하기·읽기·쓰기 능력, 바른 언어 사용 등 국어와 관련된 다양한 주제를 다루고 있습니다. 교육 구분과 분류 정보를 통해 학습 목적과 수준에 맞는 과정 선택이 가능합니다.이 데이터는 과정 테이블, 과정 교보재 콘텐츠 테이블, 동영상 콘텐츠 테이블, 강의 테이블, 총 네 개의 테이블을 포함하고 있습니다.1) 과정 테이블은  과정별 코드, 과정명, 교육 구분, 교육 분류, 과정 분류명, 수강신청 시작일·종료일, 수강취소 종료일, 교육 시작일·종료일, 교육일, 교육 시간, 썸네일, 등록일, 수정일로 구성되어 있습니다.2) 과정 교보재 콘텐츠 테이블은 과정아이디, 콘텐츠일련번호, 등록유저일련번호, 등록일, 콘텐츠순서로 구성되어 있습니다.3) 동영상 콘텐츠 테이블은 아이디, 제목, 내용, 파일이름, 파일경로, 섬네일명, 섬네일경로, 카테고리, 등록일, 수정일, 삭제여부로 구성되어 있습니다.4) 강의 테이블은 강의일련번호, 과정코드, 강의명, 강의타입, 등록일, 등록일련번호, 삭제여부로 구성되어 있습니다.이 데이터의 용도는 다음과 같습니다.1) 교수자 활용: 강의 설계, 교육 일정 계획, 과정별 난이도와 주제별 구성 분석2) 학습자 활용: 자기 주도적 학습 계획 수립, 관심 있는 주제와 일정 확인, 수강 신청 관리3) 연구 및 정책 분석: 교육 시기 및 등록일 정보를 활용한 국어 교육 변화 분석, 교육 수요 및 참여 패턴 연구4) 기술 개발: AI 기반 국어 교육 콘텐츠 개발, 교육 추천 시스템, 온라인 학습 플랫폼 설계'
