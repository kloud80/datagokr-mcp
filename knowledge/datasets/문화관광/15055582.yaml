summary_user: 전북특별자치도 안에서 운영 중인 영화관을 한 곳당 한 행으로 정리한 시설 목록으로, 지역명·상영관명·주소와 총 스크린 수·총 좌석 수를 담는다(CSV 약 2KB 분량의 소규모 파일). 도민이나 방문객이 우리 시군에 영화관이 몇 곳이고 규모가 어느 정도인지 확인하거나, 분석가가 시군별 상영 인프라 격차를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지역명이나 주소, 영화관 이름을 문자열로 맞춰 이어 써야 한다.
limits: 공통 시설 코드나 조인 키가 없어 다른 문화시설·상영 실적 데이터와 자동으로 연결되지 않는다. 범위는 전북특별자치도 한 곳뿐이며, 위치 정보는 주소 수준이라 지도에 표시하려면 별도로 좌표 변환을 해야 한다.
