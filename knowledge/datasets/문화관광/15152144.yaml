description_portal: 국립중앙박물관 교육 통합 플랫폼 "모두(MODU)"는 국립중앙박물관 및 소속 13개 박물관의 교육 콘텐츠를 통합 제공하는 플랫폼이다. 모두플랫폼에는 교육동영상, 교육활동지, 연구 자료 등의 박물관 교육 콘텐츠가 있다. 그 중 연구자료는 국립중앙박물관 및 소속박물관이 발간한 자료로, 모두플랫폼에는 490개의 연구자료가 업로드되어있다. 연구자료는 시대별, 전시 연계별, 발간 기관 등으로 분류되어있어 이용자가 카테고리에 맞게 검색해서 자료를 열람할 수 있다. 연구자료는 지속적으로 업로드 되고 있다.
