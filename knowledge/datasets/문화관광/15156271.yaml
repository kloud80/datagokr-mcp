summary_user: 대전관광공사 홈페이지와 엑스포과학공원 홈페이지에 게시된 페이지 콘텐츠를 게시물 단위로 담은 CSV 파일(약 111KB)로, 순번·게시물 내용·작성일자·수정일자를 담는다. 대전 관광 정보나 공사 사업 안내가 언제 올라오고 언제 마지막으로 고쳐졌는지 확인하거나, 홈페이지 콘텐츠의 현행화 상태를 점검하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 TourAPI 콘텐츠 ID나 지역코드로는 이을 수 없고, 다른 데이터와는 게시물 내용 속 이름이나 같은 기관 데이터로만 연결한다.
description_portal: "대전관광공사는 홈페이지 서비스의 신뢰성과 최신성을 유지하기 위해 다음과 같은 구성 요소로 홈페이지 콘텐츠 관리 데이터를 체계적으로 관리하고 있습니다.컬럼 내용① 순번: 콘텐츠를 고유하게 식별하기 위해 자동 부여되는 인덱스(Index) 값입니다. 시스템 내부 식별용이며, 개인정보를 포함하지 않는 체계적인 이력 관리의 기준이 됩니다.② 게시물 내용: 관광 정보, 사업 안내, 공지사항 등 공적 업무 수행을 목적으로 작성된 실제 홍보 및 정보 제공 콘텐츠입니다. 내부 운영 기준에 따른 사전 검토 후 등록됩니다.③ 작성일자: 해당 콘텐츠가 최초로 생성된 시점의 기록입니다. 콘텐츠의 생성 책임성을 명확히 하고, 정보 제공의 시작점을 관리하기 위해 활용됩니다.④ 수정일자: 콘텐츠의 최신성을 유지하기 위해 마지막으로 변경된 업데이트 일시입니다. 오류 수정이나 정보 현행화 등 변경 이력을 추적하고 점검하는 데 사용됩니다.데이터 관리 특징 요약① 체계성: 고유 순번(인덱스)을 통한 개별 페이지의 독립적 관리② 공익성: 대국민 서비스 제공 및 홍보 목적의 공적 업무 콘텐츠 구성③ 투명성: 작성 및 수정 일시 기록을 통한 정보의 신뢰성 및 최신성 확보④ 안전성: 내부 관리용 식별자 활용 및 접근 권한 제한을 통한 데이터 보호예상 활용처① 관광 서비스 고도화 및 개인화 추천: 홈페이지에 축적된 콘텐츠 데이터를 분석하여 사용자에게 더 나은 경험을 제공하는 데 활용됩니다.② 개인화 추천 시스템: 콘텐츠별 '수정일자'와 조회수 등을 결합하여, 현재 가장 화제가 되고 있는(Hot) 관광지나 최신 행사 정보를 사용자 취향에 맞춰 우선 노출합니다.③ 데이터 기반의 행정 및 성과 분석: 공적 업무 수행 기록으로서의 가치를 바탕으로 정책 의사결정에 기여합니다.④ 관광 정보 현행화 모니터링: '작성일자'와 '수정일자'를 대조하여 장기간 업데이트되지 않은 노후 콘텐츠를 선별하고, 정보의 최신성을 유지하는 관리 지표로 활용합니다."
