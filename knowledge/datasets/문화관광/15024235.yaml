summary_user: 남양주시 공공도서관(정약용·와부·화도·진건 등)별로 보유 장서를 도서와 비도서로 나눠 합계와 함께 집계한 소규모 통계 파일(CSV 629바이트)이다. 시민이나 도서관 정책 담당자가 "남양주시 어느 도서관이 장서를 가장 많이 갖고 있고 비도서 자료 비중은 얼마인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 도서관정보나루의 도서관코드나 다른 도서관 데이터와는 도서관 이름(구분)을 직접 맞춰 연결해야 한다.
description_portal: 남양주시 도서자료 현황 데이터로 구분(도서관별_정약용,와부,화도,진건 등 공공도서관), 도서, 비도서 등의 항목을 제공합니다.남양주시 도서에서 관리하고 있는 장서(도서 및 비도서 자료)의 보유량, 유형, 그리고 이용 현황 등을 집계하여 제공하는 통계 정보입니다.본 데이터는 도서관 운영 개선, 정책 수립, 학술 연구, 그리고 독서 산업 분석 등 다양한 분야에서 활용됩니다. 대출 현황과 분야별 장서 보유량을 비교 분석하여 이용자의 실제 수요가 높은 분야의 도서를 우선적으로 구입하고, 장서 편중 현상을 해소하는 데 활용됩니다.
