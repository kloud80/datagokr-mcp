summary_user: 빅카인즈(BIGKinds)에 수록된 청와대 관련 신문·방송 기사를 기사 한 건당 한 행으로 담은 CSV 파일(약 35MB)로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목이 들어 있다. 연구자나 정치·언론 분석가가 '청와대 이전 논의가 어느 시기에 어떤 언론사에서 어떤 키워드로 보도됐는가' 같은 보도 경향을 살피는 데 쓴다. 다른 데이터와 직접 이을 전역 조인 키는 없어서, 일자나 언론사 이름, 키워드를 기준으로 다른 빅카인즈 주제별 메타데이터와 맞춰 붙여 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 청와대 관련 뉴스 메타정보 자료입니다. 청와대는 대통령 집무실이자 국가 행정의 상징적 공간으로, 정책 결정 과정과 정치적 사건, 그리고 권력 구조와 밀접하게 연결되어 있습니다. 본 자료는 국내 주요 신문과 방송 보도에서 청와대와 관련된 기사를 분석하여 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 인식 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 국정 운영 방향, 대통령과 청와대의 관계, 정책 추진 과정, 권력 기관의 역할과 상징성, 청와대 이전 논의 등 다양한 이슈가 언론 담론에서 어떻게 다뤄졌는지 객관적으로 파악할 수 있습니다. 또한 학술 연구, 정치 분석, 정책 연구, 언론 보도 연구 등 다양한 분야에서 활용할 수 있는 기초 자료로, 한국 정치 구조와 행정 운영의 흐름을 이해하는 데 중요한 참고 자료가 됩니다.
