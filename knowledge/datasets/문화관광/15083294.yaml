description_portal: 국립국악원이 아카이브에 이관한 국악자료를 체계적으로 정리하여 제공하는 데이터셋입니다. 아이템명, 클립명, 기록일시, 장소, 기록유형, 지역, 소장처, 개요, 내용, 등록번호 등 다양한 정보를 포함하고 있어 국악 공연 및 관련 자료를 손쉽게 검색하고 활용할 수 있습니다. 모든 자료는 저작권 문제가 없는 공공누리 유형으로 구성되어 있어 연구, 교육, 문화 콘텐츠 제작 등 다양한 목적으로 안전하게 활용할 수 있습니다. 이 데이터는 국악의 보존과 전승, 대중화에 기여하며, 국악 관련 학술 연구, 창작 활동, 교육 프로그램 개발 등에도 유용한 기초 자료로 쓰입니다.
