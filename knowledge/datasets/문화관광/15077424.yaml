summary_user: 경기도 안의 중소벤처기업부 지정 백년가게를 업체 한 곳당 한 행으로 담은 목록으로, 구분(업종), 업체명, 주요 사업 내용, 전화번호, 도로명·지번 주소, 우편번호, 위도·경도, 데이터 기준일자를 담는다. 소상공인 지원 담당자나 관광 기획자가 '우리 시군에 30년 넘은 장수가게가 어디에 몰려 있나'를 지도에 찍어 보거나, 방문객이 근처 백년가게를 찾는 데 쓴다. 다른 데이터와 바로 붙일 공통 코드 키는 없어서 업체명·주소 문자열 매칭이나 위경도 좌표의 공간 중첩으로 상권·전통시장·관광지 데이터와 잇는다.
description_portal: 이 데이터는 중소벤처기업부에서 지정한 백년가게의 현황을 정리한 자료로, 경기도 내 장기간 영업 중인 우수 소상공인을 대상으로 하며, 구분(업종), 업체명, 업력(창업년도), 전화번호, 정제도로명주소, 정제지번주소, 정제우편번호, 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 백년가게는 30년 이상 업력을 가진 자영업체 중에서 경영 지속성, 제품·서비스 우수성 등을 기준으로 선정되며, 지역 전통 상권 보존, 로컬브랜드 육성, 소상공인 성공모델 발굴 등에 기여합니다. 본 데이터는 장수업체의 공간 분포 분석, 관광 자원 연계 전략 수립, 전통시장 활성화 정책, 소상공인 맞춤 지원 사업 설계 등에 활용될 수 있습니다.
