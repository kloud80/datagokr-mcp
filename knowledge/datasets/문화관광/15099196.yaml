summary_user: 경상북도교육청안동도서관에서 많이 대출된 도서를 순위별로 정리한 집계 파일로, 서명·저자·청구기호·출판사·출판년·소장 자료실과 대출횟수를 담는다(csv 약 38KB). 도서관 이용자나 사서가 '안동도서관에서 요즘 어떤 책이 가장 많이 빌려지나'를 확인하거나 장서 구입·독서 프로그램 기획에 참고하는 데 쓴다. 실측 컬럼에 ISBN·도서관코드 같은 전역 조인 키가 없어, 다른 도서관 인기 도서나 도서관정보나루 자료와는 서명·저자 이름 매칭으로만 이어 쓴다.
description_portal: 안동도서관에서 월별로 가장 많이 대출된 도서의 현황을 체계적으로 안내하는 자료입니다. 이 데이터에는 도서의 서명, 저자, 청구기호, 출판사, 출판연도, 소장처, 자료실, 대출횟수 등 대출 실적과 관련된 다양한 정보가 포함되어 있습니다. 해당 정보는 도서대출관리시스템에서 월별로 통계를 산출하여 수집하며, 「도서관법」 제28조에 근거해 공식적으로 보유·관리되고 있습니다. 데이터는 매월 정기적으로 갱신되어, 최신의 도서 대출 트렌드를 반영합니다.이 데이터는 도서관 이용자들이 인기 있는 도서를 쉽게 파악하고, 도서관의 장서 관리, 도서 구입 및 폐기, 독서 프로그램 기획 등 다양한 도서관 운영 및 정책 수립에 활용됩니다. 또한, 연구자와 정책 담당자, 교육기관 등에서 지역 독서 경향 분석, 독서문화 진흥 정책 연구, 도서관 서비스 개선 등 여러 분야에서 중요한 참고자료로 활용할 수 있는 핵심 공공데이터입니다
