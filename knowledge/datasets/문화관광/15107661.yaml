summary_user: 국민체육진흥기금 지원사업을 평가할 때 쓰는 평가항목을 적용년도별로 담은 기준표 데이터로, 문항명·평가항목 설명·비고·단계값(점수 수준)을 항목 단위로 제공하며 범위는 전국·비공간이다. 기금 지원을 신청하려는 체육단체나 사업 담당자가 '올해 기금지원사업은 어떤 문항과 단계 기준으로 평가받는가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 이을 전역 조인 키는 찾지 못했으며, 적용년도나 문항명 같은 이름 매핑, 또는 같은 기관 데이터와의 연결로만 이어 쓴다.
description_portal: 국민체육진흥기금 기금지원사업평가는 서울올림픽기념국민체육진흥공단에서 관리하는 국민체육진흥기금사업에 대한 기금지원 사업평가 정보를 제공하는 API서비스입니다. 평가 적용년도 등 조회조건을 이용하여 체육진흥기금사업에 대한 평가항목정보를 조회하는 기능입니다. 적용년도, 문항명, 평가항목에 대한 설명내용, 비고내용, 단계값 등과 같은 정보를 제공합니다. 체육진흥기금사업의 평가항목에 대한 데이터를 조회할 수 있습니다. 이 서비스는 국민체육진흥기금사업의 평가항목과 세부 기준을 제공하여 사업 성과의 체계적 평가와 향후 지원사업 개선 방향 설정에 활용될 수 있습니다.
