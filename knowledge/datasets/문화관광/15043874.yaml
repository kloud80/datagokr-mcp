description_portal: 1. 한국저작권위원회에서 보유한 저작물의 종류는 저작권법(제4조 내지 제6조)에 근거하며, 저작인접물의 종류는 저작권법(제64조)에 근거한 종류별 저작권등록건수 기재2. 한국저작권위원회에서 보유한 창작분야 저작권등록서비스 통계자료로 국가나 지방자치단체 등의 단체와 기등록 저작물에 대한 권리변동 등 후순위 등록의 경우 신청인 구분이 불가한 건수를 의미함을 유의3. 저작권 등록건수를 연도별로 어문저작물, 음악저작물, 연극저작물, 미술저작물, 건축저작물, 사진저작물, 영상저작물, 도형저작물, 컴퓨터프로그램저작물, 편집저작물, 2차적저작물, 실연, 음반, 데이터베이스, 방송 저작물종류 구분하여 등록건수로 추출한 통계자료이다
