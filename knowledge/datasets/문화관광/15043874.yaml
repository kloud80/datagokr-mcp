summary_user: 저작물 종류(어문·음악·미술·영상·컴퓨터프로그램·실연·음반·데이터베이스 등)별로 2013년부터 2025년까지 연도별 저작권 등록건수를 담은 전국 단위 집계 파일(CSV)이다. 연구자나 정책 분석가가 "최근 10여 년간 어떤 창작 분야의 저작권 등록이 늘었는가"처럼 분야별 등록 추세를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 저작권·콘텐츠 통계와는 저작물 종류 이름과 연도를 맞춰서만 이어 쓴다.
limits: 연도·종류별 합계만 있어 개별 등록 건이나 지역별 분포는 알 수 없다. 포털 설명상 국가·지자체 등 단체 신청과 기등록 저작물의 권리변동 같은 후순위 등록은 신청인 구분이 안 되는 건수로 섞여 있으니 해석에 유의한다.
