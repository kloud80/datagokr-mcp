summary_user: 광주 광산구에 등록된 관광사업체(여행업, 관광호텔·관광숙박업, 기타 유원시설업 등)를 사업체 한 곳당 한 행으로 담은 CSV 파일(약 14KB)로, 업종 구분·사업장명·주소·등록일자가 들어 있다. 지역 관광 정책 담당자나 분석가가 '광산구에 어떤 종류의 관광사업체가 언제 등록돼 어디에 분포하는가'를 파악하거나, 관광객·사업자가 구내 여행사·숙박시설을 찾는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 사업장명·주소를 맞춰 보거나 같은 기관의 다른 관광 데이터와 이름 기준으로만 이어 쓴다.
description_portal: 광주광역시 광산구 내에 위치한 다양한 관광사업체에 관한 상세한 정보를 제공합니다. 이 데이터에는 여행사, 관광호텔, 기타 유원시설업, 관광숙박업 등 여러 유형의 관광 관련 사업체가 포함되어 있으며, 각 사업체의 구분과 명칭, 실제 위치를 알 수 있는 주소, 그리고 등록일자와 같은 중요한 항목들이 체계적으로 기록되어 있습니다. 이러한 자료는 관광산업의 현황을 분석하고 지역 관광 인프라를 강화하는 데 큰 도움이 되며, 관련 정책 수립과 사업 계획 수립 시 유용하게 활용될 수 있습니다. 또한, 이 데이터를 바탕으로 관광객들이 이용할 수 있는 숙박시설과 여행 서비스를 쉽게 파악할 수 있어 지역 관광 활성화에도 기여합니다.
