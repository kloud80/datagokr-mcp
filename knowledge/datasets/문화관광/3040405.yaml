summary_user: 양산시 위생과가 관리하는 모범음식점 업소를 한 행에 한 곳씩 담은 목록으로, 업소명·전화번호·소재지·업태·주취급음식을 담으며 포털 설명 기준 6건이다. 시민이나 관광객이 양산에서 추어탕 같은 메뉴를 내는 지정 모범음식점이 어디이고 연락처가 무엇인지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 음식점·관광 데이터와는 업소명이나 주소 문자열로만 맞춰 이어 쓴다.
