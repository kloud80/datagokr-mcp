description_portal: '○ 통계개요* 통계명 : 공공도서관(구별)* 통계종류 : 서울시 공공도서관의 현황을 자치구별로 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 문화시설현황 파악을 통해 국민의 문화향유 확대 정책 수립을위한 기초자료로 활용하는 것을 목적으로 함* 조사체계 : 공공도서관 통계담당자 입력 → 시도별 통계담당자 검증 → 문화체육관광부,국가도서관통계시스템운영팀 검증* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구내용 - 공공도서관 자치구별 도서관수, 좌석수, 자료수, 도서관 방문자수,자료실 이용자수, 연간대출책수, 직원수, 예산○ 용어설명* 도서관 : 도서관자료를 수집?정리?분석?보존하여 공중에게 제공함으로써 정보이용?조사?연구?학습?교양?평생교육 등에 이바지하는 시설을 말람(「도서관법」제2조 ①항)* 공공도서관 : 공중의 정보이용?문화활동?독서활동 및 평생교육을 위하여 국가 또는지방자치단체가 설립한 도서관이나 공중에게 개방할 목적으로 민간기관 및 단체가설립한 도서관을 말함(「도서관법」제2조 ④항)* 좌석수 : 총 좌석수는 이용자들이 도서관 내에서 자료 열람 등의 이용이 가능한 전체좌석수를 말함(강당, 독서?문화프로그램실, 사무실, 회의실, 식당 등은 제외)* 도서 수 : 책의 형태로 되어 있는 비정기 간행물 성격의 인쇄형 자료를 말하며, 도서에는단행본, 보고서, 학위논문 및 연감류 등이 포함* 비도서 : 시청각자료(평면 영사자료/비디오, 오디오, 평면 비영사자료, 입체자료 및 실물자료와 키트 포함) 및 기타(시청각자료를 제외한 지도, 악보, 마이크로자료 및 그 밖의비도서 자료)* 연속간행물 : 일반적으로 종간을 예정하지 않고 정기적 또는 부정기적으로 권호나연?월?일순으로 계속해서 간행되는 출판물을 말함* 도서관 방문자수 : 통계 기준년도 1년 동안 해당도서관의 자료실, 자유열람실 등 도서관서비스를 이용하기 위해 출입한 이용자의 총 방문자 수* 자료실 이용자수 : 통계 기준년도 1년 동안 해당도서관'
