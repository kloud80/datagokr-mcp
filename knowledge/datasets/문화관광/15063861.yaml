summary_user: 부산광역시 문화예술과가 관리하는 부산 지역 연극 공연 정보를 공연 건별로 담은 API로, 공연명·공연기간(시작·종료일)·공연장명·공연시간·관람료·관람등급·러닝타임·출연진·제작진·평균 별점·예매 링크 등을 제공한다. 개발자나 연구자가 '지금 부산에서 어떤 연극이 어느 공연장에서 얼마에 열리는가'를 조회하는 앱이나 공연 현황 분석에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 KOPIS 공연ID·공연장ID와 직접 연결되지 않으며, 공연명·공연장명(place_nm) 이름 매칭이나 같은 기관의 공연장 식별자(place_id)로만 다른 데이터와 이어 쓴다.
description_portal: 연극은 배우들이 무대 위에서 대사와 행동을 통해 이야기를 전달하는 종합 예술입니다. 뮤지컬과 달리 노래나 춤이 주를 이루기보다는, 배우의 연기와 대사를 통해 인물의 감정과 극의 메시지를 표현하는 데 중점을 둡니다.개방되는 데이터는 일반 시민이 연극 정보를 검색하는 서비스가 아닙니다. 대신, 개발자나 연구자가 연극 관련 애플리케이션이나 서비스를 만들 때 활용할 수 있도록 데이터를 제공하는 공공데이터 API 서비스입니다.이 데이터는 부산광역시 문화예술과에서 관리하며, 공공데이터 포털을 통해 누구나 접근하고 활용할 수 있습니다.
