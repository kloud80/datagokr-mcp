summary_user: 서울 종로구 안의 종합체육시설업 사업장을 한 곳씩 담은 인허가 명부로, 인허가·취소 일자, 영업상태와 상세 상태, 폐업·휴업 기간, 사업장명, 지번·도로명 주소, 전화, 좌표(X·Y)를 담는다. 주민이 이용하려는 종합체육시설이 합법적으로 허가받아 현재 영업 중인지 확인하거나, 분석가가 종로구 체육시설의 개업·폐업 흐름을 상권 신호로 보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)로만 이어 쓰고, 같은 체계(LOCALDATA)의 다른 체육시설업 인허가 데이터와 나란히 비교하는 방식이 적합하다.
description_portal: 본 데이터는 서울특별시 종로구 내에서 운영되는 종합체육시설업의 인허가 현황을 정리하여 제공하는 자료입니다. 종합체육시설업은 「체육시설의 설치·이용에 관한 법률」 등 관련 규정에 따라 사업자 등록과 영업 허가를 받아야 하며, 지역 주민에게 다양한 체육 활동 공간을 제공하고 생활체육 활성화에 기여합니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등 기본 행정 정보가 포함되어 있어 종로구 내 종합체육시설업체의 등록 현황과 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 주민은 합법적인 시설 이용 여부를 확인할 수 있으며, 행정기관은 영업허가 관리, 시설 안전 점검, 체육 정책 수립에 활용할 수 있습니다. 또한 연구자와 민간 기관은 지역 체육시설 분포와 산업 동향을 분석하는 기초자료로 활용할 수 있습니다. 본 자료는 종로구 내 안전하고 건전한 체육 환경 조성을 지원하기 위해 공개됩니다.
