summary_user: 강릉시 관내 전통사찰을 사찰 한 곳당 한 행으로 정리한 현황 파일로, 소속 종단·사찰명·주지스님·소재지 주소·보유 문화재·지정일자·건립연대를 담으며 CSV 크기가 524바이트에 불과한 소규모 자료다. 강릉 여행객이나 문화관광 기획자가 '강릉에 어떤 전통사찰이 있고 각 사찰이 어떤 문화재를 보유하며 언제 세워졌는가'를 확인하는 데 쓴다. 공통 조인 키나 코드가 없어 다른 문화재·관광 데이터와는 사찰명이나 소재지 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: '강원특별자치도 강릉시 관내 전통사찰의 기본 현황과 문화재 정보를 정리한 데이터로, 사찰별 종단 소속, 위치, 주지스님, 보유 문화재, 지정·건립 시기 등을 한눈에 확인할 수 있도록 구성된 자료입니다. 불교 문화유산 관리와 관광·문화정책 수립에 활용할 수 있는 기초 정보입니다.소속종단: 각 전통사찰이 속해 있는 불교 종단 명칭(예: 대한불교조계종 등)사찰명: 전통사찰의 공식 명칭주지스님: 해당 사찰을 대표·관리하는 주지스님의 이름소재지: 전통사찰이 위치한 주소(지번 또는 도로명 주소 포함)보유문화재: 사찰이 보유하고 있는 국가·도·시 지정 문화재 및 중요 불교문화재 내역(불상, 탑, 전각, 성보 등)지정일자: 전통사찰 또는 관련 문화재가 지정·고시된 일자(YYYY-MM-DD 형식)건립연대: 사찰이 처음 창건되었거나 주요 전각이 조성된 역사적 연대(시대·연도 등 서술 형식)이 데이터는 전통사찰별 문화재 분포와 역사적 가치, 종단 및 위치 정보를 체계적으로 파악할 수 있어, 문화재 보존·정비 계획 수립, 사찰·템플스테이·문화관광 코스 기획, 지역 불교문화 연구, 교육·홍보 콘텐츠 제작 등 다양한 분야에서 활용할 수 있는 전통사찰 현황 자료입니다.'
