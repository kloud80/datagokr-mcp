summary_user: 경기도 안산시 행정기관이 소장·관리하는 도서와 통계연보·예산서 같은 행정자료를 한 권씩 도서명·저자·출판사·출판일자·등록일자와 함께 담은 건별 목록 파일(csv, 약 1.4MB)이다. 시민이나 담당자가 '안산시 행정자료실에 이 책이나 시 예산서가 있는가, 언제 입고됐는가'를 확인하거나 장서 구성과 신간 구입 계획을 살피는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어 다른 도서관·서지 데이터와는 도서명·저자 같은 이름 매칭으로만 이어 쓴다.
