description_portal: 본 데이터는 전국 21개 국립공원 내에 분포한 문화자원에 대한 공간정보를 체계적으로 수집·정리한 자료로, CSV 포맷으로 제공됩니다. 각 문화자원의 명칭, 문화재 분류(유형문화재, 기념물 등), 시대 구분(삼국시대, 조선 등), 보존 상태, 소유자 및 관리자 정보, 고도, 위도·경도 좌표 등의 속성 정보가 포함되어 있습니다. 본 데이터는 문화유산 보호와 활용을 위한 기초 자료로서, 민간 지도 서비스(Naver, Daum 등)의 Open API와 연계하여 시각화할 수 있으며, 문화관광 콘텐츠 개발, 해설 경로 설계, 문화재 관리 시스템 구축, 학술 연구 등 다양한 분야에 활용될 수 있습니다. 데이터는 구조화된 형식으로 제공되어 공간분석 및 타 시스템과의 연계에 용이합니다.
