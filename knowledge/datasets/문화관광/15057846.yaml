summary_user: 경기도 공공체육시설 가운데 씨름장을 시설 한 곳당 한 행으로 담은 현황 데이터로, 시군명·시설명·관리주체·소유기관, 씨름장 형태(원형·사각형 등)와 규격·면수·수용인원·좌석형태, 준공연도·부지면적·연면적·건설사업비, 주소와 위경도를 담는다. 지자체 체육 담당자나 분석가가 "경기도 어느 시군에 씨름장이 있고 얼마나 오래됐으며 몇 명을 수용하나"를 확인하거나 시설 현대화 대상을 고를 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)·시군명이나 주소·위경도로 다른 경기도 체육시설 현황이나 인구 통계와 이어 쓴다.
description_portal: 경기도의 공공체육시설 중 씨름 시설 현황입니다. 시설명, 씨름장형태명, 씨름장규격, 부지면적 등의 정보를 제공합니다.이 데이터는 공공체육시설 중 씨름장에 대한 현황을 포함하고 있으며, 각 시설의 위치(시군명), 명칭(시설명), 관리주체 및 소유기관, 씨름장의 형태와 규격, 면수, 면적, 수용인원, 좌석형태 등 씨름장 구조적 특성과 함께 준공연도, 건축면적, 부지면적, 연면적, 건설사업비 등의 정보를 제공합니다. 씨름장형태명은 원형, 사각형, 타원형 등으로 구분되며, 씨름장규격은 지름 또는 폭과 길이 형태로 기재되어 있습니다. 이 데이터는 지방자치단체의 체육 인프라 평가, 전통 스포츠인 씨름의 보급 및 시설 현대화 계획 수립, 체육시설 접근성 및 활용도 분석 등에 활용될 수 있습니다.
