summary_user: 국가유산청이 관리하는 문화재(국가유산) 마스터의 위치 정보를 유산별 한 건씩 담는 전국 범위 목록으로, 유산 코드·명칭·지정 구분·지정해제 여부·지번/도로명 주소·경위도(LOT, LAT)·수정일시를 포함한다. 개발 예정지나 재난 현장 주변에 어떤 지정 문화유산이 있는지 좌표로 찾아보려는 분석가·사업자·지자체 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 국가유산청 자체 API 등 다른 유산 데이터와는 유산 코드·명칭 매핑이나 주소·좌표 기반으로 이어 쓴다.
