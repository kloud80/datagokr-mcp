summary_user: 경기콘텐츠진흥원이 지원한 영화·드라마·예능 등 영상물의 촬영 기록을 작품별로 담으며, 촬영년도·시군·작품명·촬영구분·촬영장소·비고로 구성된 건별 목록이다. 지자체 관광·영상 담당자나 콘텐츠 기획자가 '경기도 어느 시군의 어떤 장소에서 어떤 드라마가 촬영됐나'를 확인해 촬영지 관광 코스나 로케이션 유치 전략을 짤 때 쓴다. 전역 조인 키는 없어서 시군명(SIGUN_NM)이나 시군코드(SIGUN_CD)를 기준으로 경기도의 다른 시군별 데이터와 이름·코드를 맞춰 잇는다.
description_portal: '이 데이터는 경기콘텐츠진흥원이 지원한 각종 영상물의 촬영 정보를 담고 있으며, 촬영년도, 시군명, 작품명, 촬영구분명(예: 영화, 드라마, 예능), 촬영장소명, 비고 등의 항목으로 구성되어 있습니다. 경기콘텐츠진흥원은 지역 영상산업 활성화를 위해 로케이션 정보 제공, 행정 지원, 촬영 허가 절차 협의 등을 수행하며, 해당 데이터는 이를 통해 실제 촬영이 이뤄진 장소와 작품 정보를 기록한 것입니다. 본 API는 XML 및 JSON 형식으로 제공되며, 지역 기반 콘텐츠 산업 정책 수립, 문화관광 콘텐츠 개발, 촬영 장소 마케팅 등 다양한 분야에서 활용될 수 있습니다. 특히 촬영장소에 대한 데이터는 지자체 간 영상 촬영 유치 경쟁력 강화에도 기여합니다.- 촬영구분명: 영화, 드라마, 예능 등 지원한 촬영 대상 영상물의 종류를 나타내는 항목입니다. 로케이션 지원 또는 작품 홍보자료로 분류될 수 있습니다.'
