summary_user: 광진구 관내 종합체육시설업 업소를 한 건씩 담은 인허가 원천 명부로, 상호명(BPLCNM)·인허가일자·폐업일자·영업상태·지번/도로명 주소·중부원점TM 좌표(X, Y)를 업소 단위로 제공한다. 상권 분석가나 창업 예정자가 "광진구에서 영업 중이거나 최근 폐업한 복합 체육시설이 어디에 몇 곳인가"를 확인하는 데 쓰며, 체육시설 개폐업은 상권 신호로도 읽힌다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·상호명 매핑이나 같은 기관 코드(OPNSFTEAMCODE), 관리번호(MGTNO) 기준으로만 이어 쓴다.
description_portal: 서울특별시 광진구_종합체육시설업 인허가 정보는 광진구 관내 수영, 골프, 체력단련 등 다양한 운동 종목의 시설을 하나의 장소에서 제공하는 복합 체육시설에 대한 인허가 현황 데이터입니다. 이 데이터는 해당 업소의 상호명, 소재지, 인허가일자, 영업상태, 업종 구분 등 주요 컬럼을 포함하고 있으며, 체력 유지와 건강 증진을 목적으로 하는 다기능 스포츠 시설의 운영 현황을 제공합니다. 종합체육시설업은 다양한 운동 공간을 갖추고 있어 시민들의 여가활동과 건강관리를 위한 필수적인 공간으로 활용됩니다. 해당 데이터는 중부원점TM(EPSG:2097) 기준 좌표계를 기반으로 위치 정보가 제공되며, 위도/경도는 포함되지 않습니다. 정보는 최신 기준에서 3일 전 시점을 기준으로 업데이트됩니다.
