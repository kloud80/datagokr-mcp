summary_user: 국가유산청이 내준 매장유산 발굴허가를 허가 한 건씩 담은 대장으로, 유적명·신청 시도와 시군구·조사기관·신청사유·허가일·착수일·완료일과 사업부지·시굴·발굴 면적이 들어 있으며 전국을 시군구 단위로 다룬다. 연구자나 지자체 담당자가 "우리 시군구에서 어떤 개발 사유로 발굴허가가 몇 건 나갔고 어느 조사기관이 맡았나"를 살피거나, 사업자가 인근 부지의 발굴 사례와 조사 기간을 가늠할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없으므로, 신청 시도·시군구 이름이나 유적명, 조사기관명을 맞춰 지표조사·발굴보고서 같은 다른 발굴조사 데이터나 지역 통계와 연결한다.
description_portal: '문화재청 문화재 발굴허가 현황, 문화재청 발굴허가 대장은 유적명 신청시도, 조사기관, 발굴신청면적 등  정보를 확인 할 수 있습니다.“국가유산청_발굴허가대장” 데이터는 우리나라 매장유산(유적 및 유물 발굴)에 대한 공식 허가 내역을 정리한 공공데이터입니다. 주요 특징은 다음과 같습니다:허가 대상 정보: 유적명, 신청 시도·시군구, 발굴 면적 및 위치, 조사 목적(신청사유) 등 기본 항목이 포함됩니다발굴 주체와 기간: 조사기관명 및 유형, 발굴 허가일, 착수일, 완료 예정일, 실제 완료일, 전체 사업부지·시굴·조사 면적 등의 세부사항이 있습니다데이터 형태 및 제공 방식: CSV, XML, JSON 포맷으로 수시 업데이트되며, 공공데이터포털에서 파일 및 오픈API 형태로 누구나 접근 가능🛠 활용 가능성학계 및 연구자: 매장문화재의 발굴 경향 분석 및 지역별 조사 현황 파악행정 및 정책 기획: 발굴 인허가 절차의 투명성 확보, 지자체 협력 체계 개선시민 및 민간 기관: 문화재 발굴 참여 유도, 현장 모니터링, 민간 발굴 사업 지원'
