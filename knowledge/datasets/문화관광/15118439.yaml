description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 메인팝업 내역입니다.- 해당 데이터는 운영자가 관리자 사이트를 통해 메인팝업을 추가/수정/삭제를 하면 해당 내역이 변경되어 생성합니다.- 개방데이터 항목은 일련번호, 언어, 제목, 시작일, 종료일, 공개여부, 이미지경로, 링크경로이며 전체 데이터 수는 5건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 메인팝업 관리 현황 파악, 최신 정보 제공 및 홍보 효과 증대, 이용자 관심 유도 및 참여 활성화, 맞춤형 홍보 콘텐츠 기획 및 운영, 플랫폼 사용자 경험 개선, 마케팅 전략 수립 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
