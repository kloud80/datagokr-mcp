summary_user: 경기도 용인시 내 도서관을 한 곳당 한 행으로 담은 목록 파일로, 도서관명·주소·전화·이용시간·휴관일·개관일자·장서 수·연면적·열람석 수·위도·경도와 작은도서관 여부·휴먼북 운영 여부를 포함한다. 시민이 '우리 동네에서 가까운 도서관은 어디이고 언제 쉬는가'를 확인하거나, 분석가가 용인시 구·동별 도서관 분포와 규모를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키(도서관정보나루 도서관코드 등)가 없어 다른 도서관 데이터와는 도서관명이나 주소·좌표로 맞춰 이어야 한다.
description_portal: 본 데이터는 경기도 용인시 내 각 도서관의 기본 현황과 운영 정보를 종합적으로 제공한다. 주요 항목은 도서관명, 위치(지역구, 지역동, 주소), 우편번호, 전화번호, 팩스번호, 별칭, 이용 시간, 휴관일, 개관일자, 장서 수, 연면적, 열람석 수, 위도, 경도, 데이터 기준일자 등으로 구성되어 있다. 또한 작은도서관 여부와 휴먼북 운영 여부와 같은 특화 정보가 포함되어 있어 도서관별 운영 특성과 서비스 제공 현황을 세부적으로 파악할 수 있다. 본 자료는 도서관 이용 안내, 시민 대상 서비스 홍보, 도서관 정책 수립, 지역별 문화 인프라 분석 등 다양한 목적으로 활용할 수 있으며, 연구자는 본 데이터를 통해 지역별 도서관 분포 현황과 규모, 운영 형태를 비교·분석할 수 있다. 시민은 이를 통해 가까운 도서관의 위치와 운영 정보를 쉽게 확인하고, 개관일자와 열람석 수 등 세부 정보를 기반으로 맞춤형 이용 계획을 세울 수 있다. 본 데이터는 최신 기준일자를 반영해 정기적으로 갱신되며, 공공데이터 개방을 통해 도서관 서비스의 접근성과 신뢰성을 높이고, 시민의 평생학습 기회 확대와 지역사회 문화 발전에 기여하는 것을 목표로 한다.
