summary_user: 서울 서초구 안에서 주택을 활용해 외국인 관광객에게 숙박을 제공하는 외국인관광도시민박업 업소를 업소별 인허가 건 단위로 담으며, 인허가일·취소일·영업상태·폐업일, 소재지 주소와 좌표, 객실 수 등을 포함한다. 서초구에서 현재 영업 중인 외국인관광도시민박이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지를 확인하려는 숙박 사업자나 관광 정책 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관의 자치단체코드(OPNSFTEAMCODE)·관리번호를 통해서만 연결한다.
description_portal: 서울특별시 서초구 내에서 도시지역 주민의 주택을 활용하여 외국인 관광객에게 한국의 가정 문화를 직접 체험할 수 있도록 숙식 등 다양한 서비스를 제공하는 외국인 대상 체험형 숙박업소 정보를 체계적으로 제공하기 위해 구축되었습니다. 한옥, 아파트, 일반 주택 등에서 이뤄지는 이 서비스는 전통 가정식 제공, 일상 생활체험, 문화교류 기회 확대 등 관광 다변화 및 지역문화 홍보에 중요한 역할을 합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 인허가 내역과 영업 개시와 종료, 폐업 여부 등 행정정보가 포함되어 있습니다. 서초구청 등 관할 행정기관의 정기적 점검과 관리, 정보 갱신을 통해 데이터의 신뢰성과 최신성이 보장됩니다. 본 데이터는 한류관광 활성화, 숙박산업 트렌드 분석, 방문객 정보 제공, 정책 수립, 업소 현황 및 경영 모니터링 등 다양한 분야에서 활용이 가능합니다. 객관적이고 실효성 있는 자료를 제공하며, 데이터는 정기적으로 최신화됩니다.
