summary_user: 서귀포시 돔베낭길(올레7코스) 한 구간을 대상으로 무장애 여행 코스의 지점별 정보(순서, 위도·경도, 구분, 설명, 상세정보, 전체·추천 코스 여부)를 담은 코스 단위 파일이다. 휠체어 이용자나 교통약자가 이 산책로의 어느 지점에 휴식 공간·주차장·화장실이 있고 노면·경사가 어떤지 확인하거나, 관광 담당자가 열린관광지 개선 지점을 고를 때 쓴다. 전역 조인 키는 없어 TourAPI 관광지 등 다른 데이터와는 코스·지점 이름 매핑이나 위도·경도 좌표로만 맞춰 써야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_돔베낭길(올레7코스)_무장애여행코스 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 본 데이터셋은 제주특별자치도 서귀포시 일대에 위치한 돔베낭길(올레7코스)을 대상으로 구성된 무장애 여행 코스 정보를 제공합니다. 해당 구간은 해안과 계곡이 만나는 지형적 특성을 가진 산책로로, 휠체어 이용자 및 교통약자의 접근성을 고려하여 이동 동선, 휴식 공간, 편의시설(주차장·화장실 등) 현황이 포함되어 있습니다. 노면 상태, 경사도, 보행환경 등 현장 기반 정보도 반영되어 있으며, 무장애 관광환경 구축과 열린관광지 개발, 관광 서비스 개선 및 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
