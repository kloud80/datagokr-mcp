description_portal: '인천관광공사는 인천지역의 관광 및 MICE 활성화를 위해 관련 기업들을 지원하고 있습니다.본 파일데이터는 인천관광기업지원센터에 입주해있는 기업들의 정보를 제공하고 있습니다.각 스타트업 기업들에 대해, 입주기업명, 기업분류, 기업정보(대표자, 기업주소, 상담전화번호, 홈페이지주소, 기업 소개내용)를 제공하고 있습니다.각 기업별 분류는 아래와 같습니다.1.지역혁신 관광 스타트업 : 인천 지역의 가치를 새롭게 재해석해 관광수요를 창출하는 기업2.지역상생 관광 스타트업 : 인천관광 발전에 기여할 수 있는 기업향후에도 인천관광공사는 인천관광 활성화를 위해 애쓰며, 그 일환으로 관광기업지원센터 운영을 통해 다양한 기업들을 지원할 계획입니다.'
