summary_user: 경기문화재단 등 경기도 내 문화 관련 기관이 낸 공고·소식(문화행사, 공모전, 채용, 참여 프로그램 등)을 한 건씩 담고, 건마다 기관명·제목·분류명·상세 링크·이미지 링크·시작일·종료일이 붙는다. 경기도 주민이나 문화예술인이 '지금 모집 중인 공모전이나 채용 공고가 무엇인지'를 시작일·종료일과 분류로 추려 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(inst_nm) 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기문화재단을 포함한 경기도 내 문화 관련 기관에서 제공하는 다양한 공고 및 소식 정보를 수록한 자료입니다. 주요 항목은 기관명, 제목, 분류명, 자세히 보기 URL, 이미지 URL, 시작일, 종료일 등으로 구성되어 있으며, 문화행사, 공모전, 채용 및 참여 프로그램 등 다양한 소식을 시기별로 확인할 수 있습니다. 이 데이터는 지역문화 행사 참여 유도, 문화소통 활성화, 정책적 문화행정 지원, 기관 홍보 자료로 활용될 수 있으며, 공공문화 플랫폼 구축 및 시민참여 확대를 위한 기초자료로도 유용합니다.
