summary_user: 한국관광공사 TourAPI 계열의 웰니스 관광 콘텐츠를 건별로 담는 API로, 온천·찜질방·한방 체험·힐링 명상·뷰티 스파 같은 웰니스 테마(wellnessThemaCd)별 시설의 제목·주소·WGS84 좌표·전화번호·대표이미지를 전국 범위에서 여러 언어로 제공한다. 여행 앱 개발자나 여행자가 "내 위치 근처나 특정 시군구에 있는 온천·스파·명상 시설은 어디인가"를 찾는 데 쓴다. 전역 조인 키는 실측에서 확인되지 않아 콘텐츠ID(contentId)·법정동 시도·시군구 코드·좌표로 같은 TourAPI 데이터나 행정구역 데이터와 이어 쓰고, 상세 조회에 필요한 콘텐츠ID·관광타입·언어 코드는 목록 조회에서 먼저 받아 넘긴다.
limits: 검증 호출에서 수신 행이 0건이었고 6개 오퍼레이션 중 키워드 검색·공통정보·소개정보 3개는 최소 파라미터로 응답이 없었으므로, 실제 내용과 규모는 파라미터를 갖춰 다시 확인해야 한다. 상세 조회 필수값(contentId, contentTypeId, keyword, langDivCd)은 다른 조회 결과의 코드라 단독 호출로는 쓸 수 없고, 개발계정은 하루 1,000회로 제한된다.
