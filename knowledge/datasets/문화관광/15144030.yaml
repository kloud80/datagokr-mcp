description_portal: 한국관광공사가 보유하고 있는 다양한 웰니스 관광 정보를 실시간으로 제공 받을 수 있으며, 국내 최대 관광정보 포털사이트(www.visitkorea.or.kr) 홈페이지에서 제공하는 웰니스 관광정보 중 저작권 등에 구애 없이 자유롭게 활용 가능한 정보만을 선별하여 OpenAPI를 통해서 최신 정보를 제공하고 있습니다. - 개방 데이터는 법정동 코드 정보, 지역기반 관광정보, 위치기반 관광정보, 키워드 검색, 웰니스 관광 동기화 정보, 공통정보, 소개정보, 반복정보, 이미지정보 9종으로 전반적인 국내 웰니스 관광 정보를 여러가지 언어로 제공합니다. - 모바일 앱 뿐만 아니라, 웹 서비스, 태블릿, 홍보물, 잡지 등 다양한 매체에서 어플리케이션을 개발, 활용할 수 있으며, 다양한 활동을 통해서 신규/융복합 관광 서비스를 창출할 수 있습니다
