summary_user: 경상북도문화관광공사가 운영하는 보문관광단지·감포해양관광단지·안동문화관광단지 안의 분양 가능 물건을 한 행씩 담은 작은 목록 파일(csv, 814바이트)로, 관광단지명·시설지구·물건명·부지면적·건축연면적·층수·건폐율·용적률을 담는다. 관광단지에 숙박·상가 등 시설을 지으려는 민간 투자자나 사업자가 '경북 관광단지에서 지금 분양받을 수 있는 부지와 그 면적·건폐율은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관광단지명이나 물건명 같은 이름으로만 맞춰 이어 쓴다.
description_portal: 경상북도문화관광공사에서 관리·운영 중인 보문관광단지, 감포해양관광단지, 안동문화관광단지 내 총 11개 시설에 대한 분양 가능 물건 정보를 제공합니다.제공 항목에는 관광단지명, 시설지구(관광진흥법 시행규칙 별표 19에 따른 설치 가능 시설), 물건명, 부지면적, 건축연면적, 층수, 건폐율, 용적률 등의 정보가 포함됩니다.이 데이터는 민간투자 유치 및 미분양 관리, 투자 유망 물건 탐색, 관광단지 개발 흐름 분석 등에 활용될 수 있는 유의미한 자료입니다.지역경제 활성화와 민간참여 확대를 위한 핵심 자료로, 공공기관의 부동산 자산 활용 전략 수립에도 실질적인 기초 자료가 됩니다.
