summary_user: 충청북도 음성군이 운영하는 공공체육시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 시설명·시설 유형·주요시설·도로명/지번 주소·관리기관·담당부서·안내 전화·설립연도를 담는다(약 5.7KB 규모의 CSV). 음성군 주민이 집 근처에 어떤 공공 체육시설이 있고 어디에 문의하면 되는지 찾거나, 분석가가 군내 체육시설의 유형별 분포와 설립 시기를 살펴보는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 시설명·주소를 맞추거나 같은 기관(음성군) 데이터끼리만 이어 쓴다.
