summary_user: 전국 지방자치단체가 관리하는 복합유통게임제공업(게임제공업과 다른 영업을 같은 장소에서 함께 하는 업소) 인허가 정보를 업소 건별로 담으며, 인허가·폐업·휴업 일자, 영업상태, 주소와 좌표, 시설면적·청소년실·노래방실 수·제공게임물 등 시설 정보를 포함한다. 창업 예정자나 분석가가 특정 지역에서 현재 영업 중인 복합유통게임장이 몇 곳이고 언제 인허가·폐업했는지를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드(OPN_ATMY_GRP_CD)·주소·사업장명 매핑으로 연결하며, 호출에 필요한 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: '문화_복합유통게임제공업 데이터는 게임제공업 또는 다른 영업을 동일 장소에서 함께 영업하는 업소정보의 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준으로, 전국 지방자치단체에서 관리하는 복합유통게임제공업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터의 법령 소관기관 및 문의처 : 문화체육관광부 게임콘텐츠산업과 / 044-203-3275 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
