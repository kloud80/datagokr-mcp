summary_user: 대한체육회 회원 종목단체가 입력한 대회 정보를 모은 파일로, 대회별로 종목·종별·세부종목, 대회명, 시작·종료일, 장소, 대회구분, 성별, 웹주소를 담으며 범위는 전국입니다. 특정 종목의 연간 대회 일정이 어디서 언제 열렸는지, 남녀부·종별(초·중·고·일반 등)로 어떤 대회가 있었는지 확인하려는 선수·지도자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 종목명·대회명·대회장소 같은 이름을 맞추는 방식으로만 연결한다.
description_portal: 대한체회의 회원 종목단체별 경기결과와 경기 기록을 제공합니다. 각 종목단체에서 주최하는 대회와 대한체육회의 종합대회 정보를 제공합니다. 데이터의 주요 내용은 종목명, 종별명, 세부종목명, 대회명, 대회시작일, 대회종료일, 대회장소, 대회구분, 성별 등입니다. 각 종목단체에서 입력한 정보를 대한체육회가 수집하여 하나의 홈페이지에서 통합으로 서비스 하고 있습니다. 좀 더 세부적인 대회의 정보가 필요한 경우에는 각 회원종목단체로 문의 하셔야 합니다. 아이디는 각 단체 내부용 값이라서 중복은 없지만, 표준화는 되어있지 않습니다.
