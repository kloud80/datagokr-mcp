description_portal: 본 데이터는 관악구의 공공미술 보유 현황을 정리한 정보입니다. 본 데이터는 프로젝트명, 소재지, 도로명주소, 지번주소, 위도·경도, 프로젝트 시작·종료 월, 관리기관명, 키워드 항목을 포함합니다. 공공미술 프로젝트가 실제로 설치된 위치와 기간, 공간적 좌표를 함께 제공함으로써 작품의 관리·보존, 지역문화정책 수립, 관광·도시브랜딩 활용에 참고자료로 쓰입니다. 특히 공공시설 배치 계획이나 문화도시 조성 전략 수립 시 기초 데이터로 활용도가 높으며, 예산집행 결과 확인 및 향후 유사 사업 추진 시 비교·평가 지표로도 활용할 수 있습니다.(2022년 2월 18일 기준 데이터입니다.)
