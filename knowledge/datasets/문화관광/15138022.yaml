summary_user: 경기도 용인시 도서관 홈페이지에 올라온 추천도서를 한 권씩 담은 건별 목록으로, 추천년도·추천월, 도서관명, 제목·저자·책소개, 국제표준도서번호(ISBN), 청구기호, 자료실명 등을 담으며 CSV 파일(약 298KB)로 받는다. 용인시민이 '이번 달 우리 동네 도서관이 추천한 책은 무엇이고 어느 자료실에 있나'를 찾거나, 독서 프로그램 담당자가 연도·월별 추천 경향을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키는 없지만, 국제표준도서번호(ISBN)로 도서관정보나루의 대출·인기 도서 데이터나 국가서지와 맞춰 볼 수 있고, 도서관은 도서관명으로만 이어진다.
limits: 표준 도서관코드 같은 전역 키가 없어 다른 도서관 데이터와는 도서관명 매핑이나 ISBN으로만 연결된다. 범위는 용인시 한 곳으로 한정되며, 실제 대출 여부나 소장 현황은 담지 않는다.
