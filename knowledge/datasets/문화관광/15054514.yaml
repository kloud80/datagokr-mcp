summary_user: 달성군 안에 있는 전통사찰을 한 곳씩 담은 목록으로, 사찰 명칭·소재지 주소·홈페이지·대표 전화번호와 위도·경도 좌표를 사찰별로 제공한다. 관광객이나 문화유산 담당자가 '달성군에 어떤 전통사찰이 있고 어디에 있으며 어떻게 연락하나'를 확인하거나, 좌표로 지도에 사찰 위치를 표시하는 데 쓴다. 다른 데이터와 바로 이을 공통 조인 키는 없어서, 사찰 명칭으로 맞추거나 주소·좌표(위도·경도)를 써서 위치 기반으로 결합해야 한다.
description_portal: 이 데이터는 달성군 내 전통사찰에 대한 현황으로, 사찰의 명칭, 소재지, 홈페이지 주소, 대표 전화번호, 위치 좌표(위도·경도) 등의 정보를 포함하고 있습니다. 전통문화 보존, 불교 관광 자원 관리, 문화유산 활용 정책 수립 등에 활용될 수 있는 기초 자료입니다.
