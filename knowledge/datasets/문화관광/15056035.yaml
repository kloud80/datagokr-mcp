summary_user: 강원특별자치도 시군별·연도별로 신고 체육시설업 수를 업종별(빙상장·승마장·수영장·체육도장·골프연습장·체력단련장·당구장·무도학원·체육교습업·인공암벽장 등)로 집계한 통계 파일이며, 건별 사업장 목록이 아니라 시군 단위 집계표입니다(CSV 약 1.2KB). 분석가나 지자체 담당자가 "강원도 어느 시군에 체력단련장·체육도장 같은 신고 체육시설업이 많고 연도별로 어떻게 늘고 줄었나"를 비교할 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 시군명·연도 이름 매칭으로만 이어 쓰며, 시군별 인구 통계나 공공 체육시설 현황과 나란히 놓고 비교하는 식으로 쓴다.
description_portal: 1. 데이터의 수집 목적 - 도내 체육시설의 설치 및 이용에 따른 법률상 신고 체육시설업으로 등록된 연도별 통계수치 제공을 통한 도내 신고 체육시설을 종합적으로 파악할 수 있도록 하고자 함(빙상장, 승마장, 종합체육시설, 수영장, 체육도장, 골프연습장, 체력단련장, 당구장, 썰매장, 무도장, 무도학원)2. 데이터 활용 기대효과 - 체육시설의 설치 및 이용에 관한 법률에 따라 공식적으로 시군별 신고된 체육시설업의 종류가 포함되어 있어 체육시설 정책 수립, 지역별 체육 인프라 분석, 스포츠 산업 동향 파악 등에 활용하실 수 있습니다.
