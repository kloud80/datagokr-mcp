summary_user: 인천광역시 미추홀구에 있는 인천광역시 지정문화유산(인천도호부 관아·인천향교 같은 건축물, 정우량 영정·불화 같은 회화 등)을 한 건씩 적은 목록 파일로, 지정·구분·명칭·내용·소유자(관리자)를 담고 파일 크기는 975바이트로 작다. 주민·방문객이나 구청 담당자가 '미추홀구에 어떤 시지정 문화유산이 있고 누가 관리하나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 자료(종목코드·지정번호)나 다른 데이터와는 문화유산 명칭을 맞춰 붙여야 한다.
description_portal: 본 데이터는 인천광역시 미추홀구에 위치한 지정문화유산의 현황을 수록한 자료입니다. 각 문화유산은 인천광역시 지정문화유산으로서 역사적·문화적 가치를 지닌 건축물, 유물, 종교미술품 등이 포함됩니다. 예시로 인천도호부 관아, 인천향교와 같은 전통 건축물, 정우량 영정 및 불화(백련정사 치성광여래회도, 시왕도) 등 귀중한 회화 자료가 수록되어 있습니다. 데이터에는 문화유산의 명칭, 구분, 주요 내용, 소유자 또는 관리자 정보가 포함되어 있어 해당 자산의 위치와 관리 주체를 명확히 파악할 수 있습니다. 이를 통해 행정기관과 연구자는 보존관리 계획 수립, 문화재 활용 프로그램 기획, 지역 문화관광 자원 개발 등에 활용할 수 있으며, 주민과 방문객은 지역의 역사와 문화를 보다 깊이 이해하는 데 도움을 받을 수 있습니다. 본 자료는 정기적으로 갱신되어 최신 문화유산 현황을 반영하며, 지역 문화유산 보존 및 홍보를 위한 기초자료로 활용됩니다.
