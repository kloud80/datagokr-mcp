summary_user: 대전광역시 서구에 등록된 게임 관련 업체(PC방·게임제공업 등)의 상호, 우편번호, 도로명·지번 소재지, 시설면적, 업종명을 업소 한 곳당 한 행으로 담은 건별 등록 목록(CSV 파일)이다. 창업 예정자나 상권 분석가가 '서구 어느 동네에 어떤 업종의 게임 업소가 얼마나 몰려 있고 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 소재지 주소를 지오코딩하거나 상호·주소 문자열로 다른 자치구의 게임업 현황이나 지방행정 인허가 데이터와 맞춰 이어 쓴다.
limits: 범위가 대전 서구 한 곳뿐이어서 시 전체나 전국 비교에는 다른 자치구 자료를 따로 모아야 한다. 공통 코드 키가 없어 다른 데이터와 연결하려면 주소·상호를 직접 매칭해야 한다.
