description_portal: 한국영상자료원에서 출판한 발간물 목록 데이터 입니다.해당 데이터는 정보언어, 종류, 구분, 제목, 제작사, 제작년도, 요약(가격, 페이지 등), 저자/감독, 저자/감독소개, 상세내용, 차례_DVD정보 열로 구성되며 총 342종의 발간물을 수록하고 있습니다.발간물은 도서와 DVD/블루레이로 구분되며 DVD/블루레이에는 한국영상자료원이 4K 복원한 고전영화 복원본이 포함됩니다.발간물의 시간 범위는 2004년부터 현재(2026년) 입니다.본 데이터는 한국영상자료원 기관홈페이지의 발간물 소개 페이지의 데이터를 기반으로 구성되어 있습니다.표지 이미지를 포함해 보다 상세한 정보를 확인하고 싶으시다면 아래 경로 참고 부탁드립니다.- https://www.koreafilm.or.kr/kofa/publication/books
