description_portal: 은평구 관내 관광사업현황입니다. 속성으로는 허가(신고)일자, 영업종류, 상호, 소재지 도로명주소, 전화번호, 영업상태로 구성되어있습니다.이 데이터는 유원시설업소의 명칭, 위치, 인허가 정보 등을 포함하며, 가족 단위 여가 공간 및  청소년·어린이 대상 놀이공간에 대한 정보를 제공합니다.  놀이공원, 키즈카페, 실내 놀이터 등 다양한 형태의 유원시설은  지역주민의 문화 여가권 보장과 아동복지 향상에 기여합니다.  본 데이터는 안전관리, 시설점검, 놀이시설 안전기준 수립,  시설 위치 분석 및 분포 불균형 해소 등 여가 인프라 정책의 기초 자료입니다.  아울러 이용자 통계 분석, 소상공인 지원 정책 기획 등  지역경제와 연계한 문화산업 진흥에도 활용될 수 있습니다.
