description_portal: 이 데이터셋은 제주특별자치도가 제공하는 ‘무장애여행 관광지’ 정보 중 하나로, 해거름바다산책로의 위치(위도/경도), 장소명칭, 주변 환경, 무장애 관광 접근성 정보 등을 CSV 형식으로 정리해 놓은 공공데이터입니다. 제공기관은 제주특별자치도, 관리부서는 디지털혁신과이며, 누구나 무료로 다운로드하여 이용할 수 있습니다. 산책로와 공원 구간, 바다 조망로, 전망대 카페, 공중화장실 등 주요 시설의 무장애 접근 여부, 주차장 및 주차 여건, 화장실의 장애인용 설비, 보도블록과 잔디길 여부, 경사로 및 단차 유무, 보행로 폭 및 장애인 주차구역 유무 등이 포함되어 있어, 휠체어나 유모차 이용자, 고령자, 영유아 동반 가족 등 누구나 여행 계획을 세울 수 있도록 돕습니다. 이 정보는 무장애 관광 정책, 관광약자 접근성 평가, 여행 가이드 제작, 관광 인프라 계획, 장애인·고령자 친화 관광지 개발 등에 유용합니다. 다만 ‘2020-12-24’ 기준으로 제공된 1회성 데이터이며, 시설 또는 접근 환경이 이후 변경되었을 가능성이 있으므로, 방문 전 최신 현황을 별도로 확인할 필요가 있습니다.
