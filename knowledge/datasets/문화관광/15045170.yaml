summary_user: 부산광역시 서구에 있는 체육도장업 업소(태권도·권투·합기도 등)를 업소 한 곳당 한 줄로 담은 명부로, 업체명·소재지주소·업종·전화번호가 들어 있으며 파일 크기는 약 2.4KB입니다. 서구 주민이 집 근처 태권도장이나 합기도장을 찾을 때, 분석가가 서구 내 민간 체육도장 분포를 상권 데이터와 함께 볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업체명·주소를 맞춰 보거나 같은 기관 데이터끼리만 이어 쓰고, 다른 시군구의 체육시설업 명부와는 주소를 기준으로 합친다.
description_portal: 부산광역시 서구 체육도장업 업소에 대한 데이터로서 업체명, 주소, 업종, 전화번호 정보가 포함되어 있습니다.여러가지 체육도장업 체육시설업에 대한 데이터로 서구에 살고 있는 구민들이 태권도, 권투, 합기도 등을 검색했을 때 보다 편리하게 이용할 수 있도록 제공된 정보입니다.체육시설의 설치ㆍ이용에 관한 법률 ( 제20조 )과 체육시설의 설치ㆍ이용에 관한 법률 시행규칙 ( 제21조 제1항)에 따라 해당 정보를 보유하고 있습니다. 많은 사람들이 체육도장업에 대한 접근을 원활하게 하여 건강하게 스포츠를 즐길 수 있기를 바랍니다.
