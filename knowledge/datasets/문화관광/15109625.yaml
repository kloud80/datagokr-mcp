summary_user: 대구광역시 관내 공원에 설치된 야외운동기구를 기구별로 담으며, 공원명·공원 유형·도로명/지번 주소·위경도·관리기관과 연락처·구군·동 정보가 함께 나오고 WGS84 좌표 기준 반경(km) 내로 조회한다. 시민이 '우리 집 근처 공원 중 야외운동기구가 있는 곳은 어디인가'를 찾거나, 구청·분석가가 공원별 운동기구 배치와 관리기관을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공원명·주소·구군/동 이름이나 좌표로 맞춰 이어 쓰고, 상세 조회에 필요한 식별값(id, parkMngNo 등)은 목록 조회 결과에서 먼저 받아 넘긴다.
description_portal: WGS84 위경도 좌표를 중심으로 좌표기반 반경거리(km단위) 내의 대구광역시 관내 공원에 설치된 야외운동기구 정보를 조회할 수 있는 서비스입니다. 조회 항목은 공원별 운동기구의 기본 정보(운동기구 관리번호, 운동기구명 등), 위치, 상태(동시 사용 가능인원수 포함), 제조사(제조사 홈페이지 및 연락처 정보 등), 이미지 등 정보를 제공합니다. 운동기구의 유지보수 상태를 분석하여 교체 및 수리 계획을 수립하거나, 시민들에게 최적의 운동 장소를 추천하거나 체육시설 관리 최적화, 운동기구 유지보수, 연구 및 데이터 분석, 스마트 도시 구축 등에 활용될 수 있습니다.
