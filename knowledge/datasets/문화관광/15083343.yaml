description_portal: 충청북도 시군(청주시, 충주시, 제천시, 보은군, 옥천군, 영동군, 증평군, 진천군, 괴산군, 음성군, 단양군)에 소재하고 있는 공공기관이 운영하는 체육시설에 대한 정보입니다. (시설명, 소재지, 소재지도로명주소, 소재지지번주소, 면적(제곱미터), 규격, 수용인원, 준공년도, 관리기관, 전화번호)의 컬럼 정보를 포함하고 있습니다. 소재지도로명주소가 없는 경우 소재지지번주소를 제공합니다. 면적, 수용인원, 준공년도의 데이터는 빈값이 존재할 수 있습니다. 골프장, 수영장, 조정카누요트경기장, 전천후게이트볼장, 야구경기장, 종합운동장의 정보는 해당 데이터 파일 목록에서 확인해주시기 바랍니다.
