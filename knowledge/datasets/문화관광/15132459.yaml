description_portal: '‘한국학중앙연구원_시기분류 정보’ 데이터는 한국사 전반에 걸쳐 역사적 시기를 체계적으로 구분한 자료로, 특정 역사 사건이나 인물, 문헌 등을 시대별로 정리하거나 분석할 때 기준이 되는 연표 성격의 데이터를 제공합니다.데이터는 시대(예: 삼국, 고려 등), 시기(예: 태조, 성종, 문종 등 왕명 중심), 각 시기의 시작년도, 종료년도로 구성되어 있어, 해당 시기의 연대 구간을 명확하게 파악할 수 있습니다. 이를 통해 한국사 관련 데이터나 고문서 등을 시대별로 정렬하거나, 시대 구분 기준을 정할 때 참고 지표로 활용할 수 있습니다. 특히 고려시대 왕대별 연도를 기준으로 정리되어 있어, 역사 연구자뿐만 아니라 교육자, 콘텐츠 개발자 등에게도 유용한 기초 데이터입니다.'
