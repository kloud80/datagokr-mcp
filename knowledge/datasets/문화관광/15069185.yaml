summary_user: 전국 주요 섬(도서지역)마다 도서코드·섬 이름과 그 섬에 전력을 공급·관리하는 한전 소속 사업소의 코드·이름을 한 행씩 짝지은 관할 목록으로, 활용신청 없이 받는 약 4KB 크기의 CSV 파일이다. 특정 섬에 정전이 났을 때 어느 한전 사업소에 연락해야 하는지 확인하거나, 사업소별로 관할하는 섬이 몇 곳인지 세어 도서 전력 인프라 점검 대상을 고르는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 섬 이름 매칭이나 같은 한전 데이터의 사업소코드(소속사업소코드)로만 잇는다.
description_portal: 한국전력공사에서 제공하는 도서지역 배전현황으로 전국 주요 도서지역의 전력 공급 및 관리 현황을 정리한 데이터입니다.도서코드, 도서명, 소속사업소코드, 소속사업소명 컬럼으로 구성되어 있으며, 각 섬이 어느 지사 및 사업소의 관할 아래 전력 공급을 받고 있는지 확인할 수 있습니다.데이터 이용자들은 특정 섬이 어떤 사업소에서 관리되는지를 확인하여 긴급 상황 시 대응 체계를 수립할 수 있습니다.또한 도서지역의 전력망 분포를 분석해 전력 인프라 투자 필요성을 검토하거나, 신재생에너지 도입 우선 지역을 선정하는 데 활용할 수 있습니다.
