summary_user: 한국문화예술위원회 나눔티켓에 등록된 공연 목록을 공연 1건당 1행으로 담은 2019년 7월 기준 파일(약 425건)로, 등록일자·지역·장르(연극·클래식·뮤지컬·아동극 등)·티켓구분·공연명·단체명·공연기간·공연장소를 담는다. 문화 소외계층 지원이나 공연 나눔 사업을 살피는 분석가가 '당시 나눔티켓으로 어떤 지역·장르의 공연이 제공됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연 목록(공연ID)이나 공연장 정보와는 공연명·단체명·공연장소 이름을 맞춰서만 연결할 수 있다.
limits: KOPIS 공연ID·공연장ID 같은 공통 코드가 없어 다른 공연 데이터와 정확히 조인하기 어렵고 이름 매칭에 의존해야 한다. 명세상 이벤트성으로 한 번 생성된 뒤 바뀌지 않는 파일이므로 현재 진행 중인 나눔티켓 공연 확인에는 쓰지 않는다.
