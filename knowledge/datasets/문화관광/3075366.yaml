description_portal: 한국문화예술위원회 나눔티켓 공연전시 목록 정보입니다. 해당 파일은 2019년 07월을 기준으로 작성되었습니다. 각 구성 항목으로는 순번, 등록일자, 지역, 유형, 장프, 티켓구분, 공연명, 단체명, 공연기간, 공연장소로 구성되어 있습니다. 순번은 1번부터 425번까지 오름차순으로 정렬되어 있습니다. 등록일자 항목은 날짜 형식으로 연월일이 나타나 있습니다. 유형 항목은 모두 공연으로 나타나 있고 장프 항목은 연극, 클래식, 퍼포먼스, 뮤지컬, 콘서트, 아동극, 발레/무용 등으로 구성되어 있습니다. 따라서 파일에서 한국문화예술위원회 나눔티켓 공연전시 목록 정보를 확인할 수 있습니다.
