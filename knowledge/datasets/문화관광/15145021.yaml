description_portal: '본 데이터는 경기도 가평군 군립도서관에서 운영하는 독서마라톤 프로그램의 운영 현황을 정리한 자료입니다. 독서마라톤은 독서와 마라톤을 결합한 캠페인으로, 참가자가 신청한 코스를 독서를 통해 완주하는 방식입니다. 항목에는 대회명, 운영연도, 대회 시작일과 종료일, 참가코스, 완주거리, 페이지수, 데이터기준일자가 포함됩니다. 참가자가 작성한 도서 감상평의 페이지 수에 따라 1페이지당 2미터로 환산하여 누적 거리를 산정합니다. 본 자료는 연도별 운영 내용, 독서량 통계, 코스별 참여 현황 등을 분석하는 데 활용되며, 지역 내 독서문화 확산과 공공도서관의 문화 프로그램 운영 성과를 파악하기 위한 기초자료로 활용됩니다.*가평군도서관홈페이지: https://www.gaplib.go.kr/intro/index.do'
