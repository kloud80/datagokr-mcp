description_portal: 국립중앙박물관 교육 통합 플랫폼 "모두(MODU)"는 국립중앙박물관 및 소속 13개 박물관의 교육 콘텐츠를 통합 제공하는 플랫폼이다. 모두플랫폼에는 교육동영상, 교육활동지, 연구 자료 등의 박물관 교육 콘텐츠가 있다. 이용자들의 박물관 교육 자료에 대한 접근성을 높이고자 구축한 플랫폼으로, 방대한 양의 콘텐츠를 탐구하기 어려운 이용자들을 위해  이용 편의성 향상을 목적으로 콘텐츠를 추천해주고 있다. 콘텐츠는 활동지, 영상, 연구자료 등이 추천된다. 이 기능을 통해 참여자는 쉽게 콘텐츠에 접근할 수 있다.
