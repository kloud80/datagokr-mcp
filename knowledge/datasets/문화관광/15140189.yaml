summary_user: 대전광역시 중구에 등록된 여행업 업체를 한 곳씩 담은 등록 명부로, 업종(국내여행업·국내외여행업·종합여행업)과 업소명·주소·연락처를 담는다. 중구에서 종합여행업으로 등록된 여행사가 어디에 있는지 확인하려는 주민·사업자나, 지역 여행업 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 시군구의 여행업 등록 데이터나 관광사업 등록 데이터와는 업소명·주소를 맞춰 붙이거나 같은 기관 기준으로 묶어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 내 등록된 여행업 업체 정보를 제공합니다. 여행업 업체는 업종, 상호, 소재지, 전화번호 등을 제공하고 있으며, 여행업종의 경우 국내여행업, 국내외여행업, 종합여행업으로 분류됩니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 주소는 도로명주소 및 지번주소가 혼합되어 기재되어 있습니다.데이터 컬럼 중 연락처는 지역번호로 작성되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
