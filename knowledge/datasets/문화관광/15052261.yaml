summary_user: 경상북도 관내 시군에서 열리는 지역 축제를 축제 한 건당 한 행으로 담은 목록으로, 개최 시군·축제명·개최 기간만 들어 있는 작은 CSV 파일(약 3.7KB)이다. 여행객이나 지역 관광 분석가가 '이번 계절 경북 어느 시군에서 어떤 축제가 열리나'를 확인하거나 시기별·시군별 축제 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 이름을 행정구역 코드에 매핑하거나 축제명을 TourAPI 행사 정보와 이름으로 맞춰 이어 쓴다.
