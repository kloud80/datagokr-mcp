summary_user: 부안군 줄포면 줄포만노을빛정원 안의 마루아리하우스펜션과 캠핑장을 객실(사이트) 한 건씩 담은 목록 파일로, 숙박 유형·객실명·규모·수용 인원·비수기와 성수기·주말 이용요금·객실 비품과 특징을 담는다. 관광객이 줄포만노을빛정원에서 4인 가족이 묵을 객실과 성수기 주말 요금이 얼마인지 비교할 때 쓰고, 군 담당자가 시설 구성과 요금 체계를 점검할 때 쓴다. 실측 컬럼에 사업자번호·등록번호 같은 공통 조인 키가 없어서, 다른 숙박·야영장 데이터와는 시설명이나 같은 기관(부안군) 기준으로만 맞춰 쓴다.
limits: 단일 시설의 객실·요금 안내 자료라서 예약 현황, 이용 실적, 수요 통계는 없다. 전역 조인 키가 없어 관광사업 등록 원장이나 다른 지역 숙박 데이터와 자동으로 연결되지 않는다.
