summary_user: 영화 엔딩 크레딧의 촬영협조·촬영지 목록을 바탕으로 촬영장소 한 곳당 한 행씩 누적 촬영횟수를 집계한 파일로, 포털 설명 기준 약 3만 1천여 개 장소를 관리번호·촬영장소·촬영횟수·수정일 4개 열로 담는다. 지자체 영상위원회나 관광 분석가가 "우리 지역에서 영화 촬영이 가장 많았던 장소는 어디인가"처럼 촬영지 이용 순위를 따져 볼 때 쓴다. 전역 조인 키가 없고 장소도 좌표·행정코드 없이 이름으로만 적혀 있어, 다른 데이터와는 장소명 매칭으로만 잇는다. 장소별 영화 목록은 KMDb에서 따로 확인한다.
description_portal: 한국영상자료원이 구축한 영화 로케이션별 촬영횟수 데이터입니다.해당 데이터는 영화 엔딩 크레딧에 포함된 촬영협조 또는 촬영지 목록을 기반으로 구축하였습니다.열은 관리번호, 촬영장소, 촬영횟수, 수정일 총 4개로 구성되어 있으며총 31,492개의 장소에 대한 촬영 정보를 포함하고 있습니다.- 촬영횟수 열을 통해 촬영지별 이용 순위 등을 산출할 수 있습니다.촬영장소별로 촬영된 영화 목록은 한국영화데이터베이스 KMDb를 통해 확인/검색 가능하니 많은 이용 부탁드립니다.https://www.kmdb.or.kr/main
