summary_user: 서울특별시 중랑구의 골프연습장업 인허가 업소를 한 건씩 담은 명부로, 관리번호·인허가일자·영업상태와 폐업일자·사업장명·지번/도로명 주소·중부원점TM(EPSG:5174) 좌표 등을 업소 단위로 제공한다. 중랑구에서 지금 영업 중인 골프연습장이 어디에 몇 곳 있고 최근 어떤 곳이 문을 열고 닫았는지 알고 싶은 주민·창업 예정자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 구의 같은 업종 데이터나 다른 체육시설업 명부와는 개방자치단체 코드(OPNSFTEAMCODE)·주소·사업장명으로 맞춰 이어 쓴다.
description_portal: '서울특별시 중랑구의 골프를 연습하기 위해 실내 또는 실외에 시설을 갖추어 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
