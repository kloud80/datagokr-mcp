summary_user: 경기콘텐츠진흥원이 지원한 다양성영화(독립·예술·다큐멘터리 등)의 작품별 개봉·상영 정보를 집계년도(SUM_YY)별로 담는 건별 목록으로, 작품명·감독·장르·상영시간·상영등급·개봉일·배급사를 포함한다. 지역 영화관 프로그래머나 정책 분석가가 '특정 연도에 경기도 지원을 받아 개봉한 다양성영화는 어떤 장르·배급사에 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 영화·공연 데이터와는 작품명·감독명·배급사명 같은 이름 매칭으로만 이어 붙인다.
description_portal: 「다양성 영화 상영 현황」 데이터는 경기콘텐츠진흥원이 지원하는 다양성영화의 개봉 목록과 상영 정보를 제공하는 자료입니다. 주요 항목은 작품명(WORK_NM), 감독명(MNG_NM), 장르구분명(GENRE_DIV_NM), 상영시간(SCREEN_TM), 상영등급(SCREEN_GRAD), 개봉일정보(PREMIERE_DE_INFO), 배급사명(DISTRBTR_NM) 등으로 구성됩니다. 해당 데이터는 독립영화, 예술영화, 다큐멘터리 등 상업 블록버스터 외 영화작품의 상영 현황을 파악할 수 있는 중요한 기초자료로, 다양성영화 지원 정책 수립, 문화예술산업 연구, 지역 영화관 운영 및 상영 프로그램 기획 등에 활용될 수 있습니다. 또한 집계년도(SUM_YY)별로 데이터를 제공하여 연도별 영화 개봉 및 상영 추세를 분석할 수 있습니다.
