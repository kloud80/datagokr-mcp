summary_user: 빅카인즈에서 수집한 혁신성장 관련 뉴스를 기사 한 건씩 담은 메타데이터로, 보도 일자·언론사·기고자·제목·통합분류(1~3단계)·사건/사고 분류·개체명(인물·기업/기관·지역)·중요키워드를 담으며 CSV 파일 한 개(약 27MB)로 받는다. 연구자나 정책 담당자가 '시기별로 디지털 전환·스타트업 육성 같은 혁신성장 주제가 언론에 얼마나 자주, 어떤 기업·인물과 함께 보도됐는가'를 살피는 담론 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 언론사명·기업/기관명·지역명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 혁신성장 관련 뉴스 메타정보입니다. 각 기사에는 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 사건/사고 여부, 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용, 원본 주소 등이 포함되어 있어, 기사 단위의 구조적·내용 분석이 가능합니다.본 자료는 언론 보도를 통해 혁신성장이라는 가치가 어떻게 담론화되었는지를 다양한 관점에서 보여줍니다. 예컨대 디지털 전환, 기술 혁신, 벤처 및 스타트업 육성, 정책 지원과 투자 유인, 미래 산업 육성 전략 등이 주요 주제로 드러날 수 있습니다. 이를 통해 시기별 언론의 혁신성장 담론 강도, 특정 산업 분야별 주목도 변화, 주요 기업 및 인물의 역할 부각 여부, 정책 제안과 사회적 반응 간 연관성 등을 정밀하게 분석할 수 있습니다. 정책 입안자, 학계, 산업계, 언론 연구자 등은 이 데이터를 바탕으로 혁신성장 전략의 담론 흐름을 파악하고, 사회적 합의 형성 과정 및 언론의 역할 변화를 탐색하는 데 활용할 수 있습니다.
