summary_user: 대전광역시 서구에서 영업 중인 유원시설(실내놀이시설·체험시설·레저업 등)을 업소 한 곳당 한 행으로 담은 원천 목록으로, 상호명·주소·행정동·법정동·시설면적·업종명·위도·경도를 포함하며 파일 크기는 약 2.9KB로 소규모입니다. 주민이나 분석가가 '서구의 어느 동에 어떤 유원시설이 얼마나 넓게 분포하는가'를 확인하거나 안전 점검 대상을 추려 지도로 그릴 때 쓴다. 법정동코드(bjd_cd)로 다른 법정동 단위 통계·시설 데이터와 잇고, 위도·경도로 공간 분석에 쓴다.
description_portal: '대전광역시 서구 유원시설업 현황 데이터는 지역 내에서 운영 중인 다양한 유원시설(놀이시설, 체험시설, 레저 관련 시설 등)에 대한 정보를 체계적으로 정리한 자료입니다. 데이터에는 시설을 구분하는 순번, 영업체를 식별할 수 있는 상호명, 위치 파악을 위한 우편번호·지번주소·도로명주소, 그리고 행정구역 정보를 나타내는 행정동코드·행정동명, 법정동코드·법정동명이 포함되어 있습니다.또한 시설의 규모를 확인할 수 있는 시설면적과 시설면적단위, 시설의 성격을 나타내는 업종명(예: 실내놀이시설, 체험시설, 레저업 등), 그리고 공간 분석을 가능하게 하는 위도·경도 정보가 함께 제공됩니다.이 자료는 유원시설의 분포도 작성, 지역별 여가시설 수요 분석, 안전 관리 점검 대상 파악, 관광·문화정책 수립 등 행정적 활용 가치가 높으며, 서구 주민의 여가 활동 기반을 파악하는 데 도움이 되는 기초 데이터로 활용됩니다.'
