description_portal: '- 덤프스테이션(dump station)이란 캠핑카 오수수집시설로, 캠핑카의 오수를 수집하여 하수처리시설로 이송하는 편의시설입니다. 덤프스테이션이 설치된 야영장과 주유소는 한국관광공사에서 운영하는 고캠핑 홈페이지 내 덤프스테이션 지도에서 확인 가능합니다.- 링크 내 "전국 덤프스테이션"엑셀 파일은 덤프스테이션명, 소개, 주소, 상세URL(고캠핑 내 상세페이지) 정보를 담고 있습니다. - 본 데이터를 야영객들의 편의를 위한 캠핑 및 액티비티 웹·앱 서비스 개발에 활용할 수 있습니다.'
