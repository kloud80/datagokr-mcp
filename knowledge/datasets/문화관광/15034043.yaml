summary_user: 부산 도시철도역과 관광지 인근에서 휠체어 사용 장애인이 이용할 수 있는 편의시설을 갖춘 업소를 한 건씩 담은 목록으로, 가까운 지하철 노선·업소명·위치·전화번호 등이 들어 있다. 휠체어를 쓰는 관광객이나 보호자가 '이 지하철역 근처에 휠체어로 들어갈 수 있는 식당이나 가게가 있는가'를 찾을 때 쓰고, 무장애 관광 안내 서비스를 만드는 사업자도 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 TourAPI 관광지 등 다른 데이터와는 업소명·주소 같은 이름 매칭으로만 이어 쓴다.
description_portal: "'부산광역시_관광지 장애인 편의시설 보유 업소 정보'는 무장애 관광 활성화를 위해서 도시철도 및 관광지 인근에 휠체어를 사용하는 장애인이 이용할 수 있는 편의시설 현황을 나타낸 데이터 입니다.2025년 8월 기준 1,000개의 데이터가 저정되어 있으며 세부 내용으로는 가까운 지하철 노선과 업소명, 위치, 전화번호 등이 포함되어 있습니다. 본 자료는 부산장애인여가활동지원협회에서 제공하고 있으며 더 자세한 자료는 http://wheelbusan.or.kr/ 에서 확인할 수 있습니다."
