summary_user: 경기도 군포시 공공도서관(중앙·산본·당동·대야·어린이·부곡도서관)이 소장한 도서를 한 권(등록번호) 단위로 담은 건별 목록 파일로, 서명·저자·발행처·청구기호·분관·서고·소장상태·언어·최종수정일 등을 담으며 xlsx 파일 크기는 약 77MB이다. 시민이 찾는 책이 군포시 어느 도서관 어느 서고에 있고 대출 가능한 상태인지 확인하거나, 분석가가 분관별 장서 구성(언어·서지유형)을 비교하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서관 데이터(도서관정보나루 등)와는 서명·저자 같은 이름 매칭이나 분관명으로만 이어 쓴다.
limits: ISBN·도서관코드가 없어 국가서지나 도서관정보나루 대출·인기도서 데이터와 정확히 조인되지 않고, 이름 매칭에 의존해야 한다. 범위는 군포시 한 곳의 공공도서관 소장 목록에 한정된다.
