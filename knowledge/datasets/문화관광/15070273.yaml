description_portal: 경기도 군포시에 소재하는 공공도서관 소장 도서에 관심이 있으신 분들에게 도움이 되는 데이터입니다. 군포시 소재 공공도서관은 중앙도서관, 산본도서관, 당동도서관, 대야도서관, 어린이 도서관, 부곡도서관이 있으니 참고 바랍니다. 이 시스템에 업로드된 데이터는 경기도 군포시에 소재하는 공공 도서관의 소장 도서 목록에 대한 데이터로 등록번호, 서지번호, 청구기호, 서명, 저자, 발행처, 분관, 서고, 소장상태, 언어, 서지유형, 딸림여부, 최종수정일자 항목을 제공합니다. 여러분의 많은 이용 바랍니다.
