description_portal: '"서울시 동북권(강북구, 광진구, 노원구, 도봉구, 동대문구, 성동구, 성북구, 중랑구) 공공도서관 61개관의 이용제한 도서 현황 정보, 종수/책수 제공 ‣ 열람제한 : 도서의 성격(문체부 고시, 사회적 이슈 등)에 따라 열람을 제한 ‣ 사서제한 : 도서의 상태 및 관리(파손, DB오류, 귀중서 등) 사유로 도서관 판단으로 제한* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함"'
