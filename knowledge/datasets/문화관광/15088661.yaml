summary_user: 국가유산청에 제출된 문화유산 발굴보고서를 보고서 한 건당 한 행으로 담은 전국 단위 목록 파일로, 보고서명·유적(사업)명·발간기관·제출일과 조사 시도·시군구·주소, 조사면적·조사기간·유적 성격·시대를 기록한다. 연구자나 개발사업자가 특정 시군구나 주소 일대에서 어떤 시대·성격의 유적이 언제 어느 기관에 의해 발굴·보고되었는지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 조사 시도·시군구 이름이나 주소 문자열을 맞추거나 유적명·기관명으로 대조해 이어 쓴다.
description_portal: 문화재청 문화재 발굴보고서 현황. 문화재 발굴보고서는 유적명, 조사기관, 보고제목, 주소등의 정보를 확인 할 수 있습니다.국가유산청_발굴보고서 제출목록은 국가유산청에서 관리하는 발굴조사 사업과 관련하여 작성된 발굴보고서의 제출 현황과 목록을 정리한 문서로, 각 발굴조사의 주요 정보와 보고서명, 제출일자, 담당 기관 및 조사 대상지 등을 체계적으로 수록하고 있습니다. 이 목록은 발굴조사의 투명성과 관리 효율성을 높이고, 관련 연구자 및 기관이 필요한 자료를 신속히 확인할 수 있도록 지원하며, 문화재 조사·복원 및 학술 연구, 정책 수립에 중요한 기초 자료로 활용됩니다. 또한 디지털 형식으로 관리되어 데이터베이스와 연동하여 손쉽게 검색 및 활용이 가능하며, 국가문화유산 보존과 관리에 핵심적인 역할을 수행하는 자료입니다.
