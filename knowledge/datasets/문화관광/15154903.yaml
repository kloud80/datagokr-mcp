summary_user: 전국 자치단체의 관광유흥음식점업 인허가 정보를 업소 한 곳씩 건별로 담으며, 검증 수신 기준 전체 23건에 인허가일자·영업상태·사업장명·소재지 주소·좌표가 들어 있다. 한국 전통 분위기 유흥 음식점이 어디에 언제 허가받았고 지금 영업 중인지 확인하려는 분석가나 사업자가 쓴다. 지번주소·도로명주소·영문상호주소의 주소 키로 다른 음식점·관광 데이터와 이어 쓰며, 관광지 콘텐츠 ID 같은 별도 조인 키는 없다.
description_portal: '식품_관광유흥음식점업 데이터는 유흥주점영업의허가를 받은자가 관광객의 이용에 적합한 한국전통분위기의 시설을 갖추어 그시설을 이용하는자에게 음식을 제공하고 노래, 춤을 감상하게 하거나 춤출 수 있도록 공간을 제공하는 업소 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 관광유흥음식점업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 융복합관광과 / 044-203-2882, 2888 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
