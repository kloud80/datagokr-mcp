summary_user: 제주 산굼부리 분화구 일대의 무장애 여행 지점을 지점별로 담은 원천 파일이며, 확인된 필드는 지점 아이디, 위도·경도, 해발고도입니다. 휠체어 이용자나 교통약자를 위한 앱·안내 서비스 개발자, 또는 관광 정책 담당자가 '산굼부리에서 휠체어로 이동 가능한 지점과 경로가 어디인가'를 지도 위에 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 관광지 이름이나 같은 기관 자료로 맞춰 연결해야 하고, 좌표는 지도에 겹쳐 보는 용도로 쓴다.
description_portal: '"제주특별자치도_무장애여행정보_48.산굼부리 데이터를 제공합니다.* 이 데이터셋은 산굼부리 분화구를 중심으로 한 무장애 여행 정보로, 위치 정보(위도·경도), 각 지점 설명, 접근성 및 편의시설 정보를 포함합니다. 분화구 내부 및 진입로는 휠체어 접근이 가능하며, 장애인 주차장과 장애인 화장실, 휠체어 대여 서비스가 제공되어 교통약자 및 휠체어 이용자도 이용할 수 있도록 설계되었습니다. 자연경관과 생태적 가치를 지닌 산굼부리는 누구나 안전하게 자연을 즐길 수 있는 열린관광지로, 무장애 관광 활성화, 관광 인프라 개선, 정책 수립 및 관광 서비스 제공을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
