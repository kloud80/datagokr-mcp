description_portal: '이 데이터는 서울특별시 광진구 관내에서 인허가된 복합영상물제공업소의 정보를 포함하고 있습니다. 복합영상물제공업이란 비디오물 감상 시설과 더불어 노래, 게임 등의 부가적인 오락 기능을 함께 제공하는 업소 형태를 의미합니다. 대표적으로 멀티방, 개인감상실, 영상오락실 등이 이에 해당되며, 다양한 여가활동을 한 공간에서 즐길 수 있도록 구성된 복합문화공간으로 분류됩니다. 본 데이터에는 각 업소의 상호, 주소, 업종 구분, 영업 상태 등의 정보가 포함되어 있어 유관 기관의 관리 및 정책 수립, 문화시설 이용 현황 파악 등에 활용될 수 있습니다.※ 좌표 안내: 본 데이터는 중부원점TM(EPSG:2097) 좌표계를 기준으로 한 위치 정보를 포함하며, 위도/경도 좌표는 별도로 제공되지 않습니다.※ 데이터는 수집일 기준 3일 전 정보를 기준으로 제공합니다.'
