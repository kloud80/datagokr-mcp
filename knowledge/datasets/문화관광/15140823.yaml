summary_user: 은평구에 있는 영화배급업 업소를 한 곳씩 담은 인허가 데이터로, 사업장명·인허가일·폐업일·영업상태·지번/도로명 주소·중부원점TM 좌표 등이 들어 있으며 범위는 은평구(시군구 단위)입니다. 은평구에서 지금 영업 중인 영화 배급사가 어디에 몇 곳 있는지, 언제 인허가를 받거나 폐업했는지를 확인하려는 창업자·지역 문화산업 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 연결한다.
description_portal: '은평구의 영화를 전문적으로 배급하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.은평구에서 활동하는 영화 배급사의 소재지, 사업 범위, 영업 여부 등을 포함한 정보로, 지역 문화산업의 흐름을 파악할 수 있는 데이터입니다. 문화 콘텐츠 산업의 성장은 지역 경제 및 청년 일자리 창출과도 밀접한 연관이 있으며, 영화 제작과 소비를 연계하는 유통구조의 현황을 이해하는 데 기초가 됩니다. 디지털 OTT 플랫폼 확산과 더불어 독립영화 유통의 중요성도 함께 부각되고 있습니다.'
