description_portal: '광주광역시에 등록된 공립박물관, 대학박물관, 사립박물관의 현황입니다. 박물관명, 소재지도로명주소, 전화번호, 개관일, 홈페이지 주소 등의 정보를 제공합니다.-공립박물관: 광주역사민속박물관, 김치박물관, 남도향토음식박물관-대학박물관: 광주교육대학교 교육박물관, 전남대학교 박물관, 전남대학교 의학박물관, 조선대학교 박물관-사립박물관: 한국미용박물관, 광주은행박물관, 비움박물관, 광주가톨릭박물관본 자료는 2026년 1월 30일 기준으로 작성된 정보로, 광주시 내 공립·대학교 박물관의 기본 현황을 확인할 수 있는 데이터입니다.'
