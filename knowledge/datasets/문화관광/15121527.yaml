summary_user: 국립중앙극장에서 열린 공연의 아카이브 자료를 자원 한 건 단위로 담으며, 제목·주된 책임자·등록일·소속 DB·주제 분류와 키워드·재생시간·공연 내용·공간·참여 인물·권리 정보 등을 포함한다. 공연예술 연구자나 기획자가 '특정 연출가나 출연자가 참여한 국립중앙극장 공연 기록이 무엇이 있고, 영상·자료는 어디서 볼 수 있나'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID 같은 외부 키로 바로 잇지 못하고, 공연 제목·인물 이름 매핑이나 자료 식별체계(uci)·참조 식별자를 통해 연결한다.
description_portal: 국립중앙극장에서 개최된 다양한 공연의 아카이브 정보를 체계적으로 제공하여 공연 예술의 기록과 연구, 교육, 문화 콘텐츠 개발 등에 활용할 수 있도록 지원합니다. 공연의 제목, 연출자, 공연기간, 공연단체 등 기본 정보뿐만 아니라, 자원의 명칭, 주된 책임자, 등록일, 소속 DB, 주제 분류, 핵심 키워드, 재생시간, 공연 내용, 공간, 해당 시간대, 참여 인물, 언어, 참조 자료, 썸네일 이미지, 권리 및 저작권 정보, 위치 정보, 식별 체계, 기여자 등 다양한 세부 항목을 포함하고 있습니다. 공연 예술 관련 연구자, 학생, 기획자, 일반 시민 등에게 공연 자료의 검색과 분석, 문화예술 정책 수립, 창작 활동의 자료로 활용될 수 있는 유용한 데이터입니다.
