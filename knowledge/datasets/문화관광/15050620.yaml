description_portal: '- 전라남도 내  지역 축제 개최 계획(축제명, 지역, 개최시기, 개최기간 등)에 관한 주요현황을 조회하실 수 있습니다.- 전라남도는 풍부한 자연경관과 전통문화를 바탕으로 다양한 지역축제를 개최하여 지역 주민과 관광객들에게 특별한 경험을 선사하고 있습니다. - 전라남도의 지역축제 일정과 상세 정보를 확인하시려면 다음의 공식 웹사이트를 참고하실 수 있습니다 : 전라남도 공식 관광 웹사이트: https://www.jeonnam.go.kr/tour/index.do이곳에서는 각 지역의 축제 일정, 프로그램, 참여 방법 등을 확인하실 수 있습니다.- 전라남도의 다양한 지역축제에 참여하셔서 아름다운 자연과 풍부한 문화를 만끽하시기 바랍니다.'
