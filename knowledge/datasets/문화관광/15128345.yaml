summary_user: 공유마당에서 공유 중인 저작물에 붙은 태그를 태그 한 건씩(태그일련번호·태그명·등록일자) 담은 목록 파일로, 약 4.7MB 크기의 CSV이며 범위는 전국·비공간입니다. 공유마당에서 자유이용 저작물을 찾는 국민이나 콘텐츠 분석가가 '어떤 주제어로 저작물이 분류·검색되고 있나'를 파악하거나 검색어 사전을 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 태그명 문자열 매핑으로만 이어 쓴다.
description_portal: 한국저작권위원회 공유마당 홈페이지에서 공유중인 저작물들의 태그 목록에 대한 데이터로 태그일련번호, 태그명, 등록일시 항목을 제공합니다.태그명으로 공유마당뿐만 아니라 공공누리, 외부연계의 저작물유형인 사진, 미술, 음악, 도형, 어문, 영상, 기타등 저작물과 저작권유형인 CC-BY(저작자표시), CC-BY-NC(저작자표시-비영리), CC-BY-ND(저작자표시-변경금지), CC-BY-SA(저작자표시-동일조건변경허락), CC-BY-NC-ND(저작자표시-비영리-변경금지), CC-BY-NC-SA(저작자표시-비영리-동일조건변경허락), 공공누리, 만료저작물, 기증저작물등 유형별로 많은 저작물에 대해 확인 가능합니다.
