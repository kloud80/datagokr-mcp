description_portal: 전라남도 해남군 공공체육시설 현황입니다.이 데이터에는 시설명, 위치, 준공일, 부지면적, 시설면적, 연면적, 경기장 면적,  경기장 바닥, 기타 9가지 정보로 구성되어 있습니다.체육시설은 우슬경기장 부지 내19개의 실내외 경기장, 읍내에 2개의 경기장,북평면과, 삼산면에 각각 1곳, 총 23곳의 체육시설이 있습니다. 읍면 체육시설을 제외한 체육시설은 스포츠사업단에서 관리하며 자체 홈페이지에서  이용요금을 지불하여 예약 후 이용할 수 있습니다.  해당 사이트는 해남군청 홈페이지를 통해  접속이 가능합니다.
