summary_user: 전라남도 해남군이 운영하는 공공체육시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·도로명/지번 주소·준공일·부지·시설·연면적·경기장 면적·바닥재 등을 담는다(포털 설명상 우슬경기장 부지 내 19곳 등 총 23곳). 해남군 주민이나 방문 동호인이 '해남에서 바닥이 어떤 재질인 실내 경기장이 어디에 있고 언제 지어졌나'를 확인하거나, 분석가가 군 단위 체육시설 규모를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 시설명으로 맞춰 문체부 전국체육시설 데이터 등과 이어 쓴다.
limits: 해남군 한 곳의 시설 목록만 담아 다른 시군과의 비교에는 다른 지자체 데이터를 따로 모아야 한다. 공통 코드 키가 없어 연결은 이름·주소 매칭에 의존한다. 이용요금·예약 가능 여부 등 대관 정보는 이 파일에 없다.
