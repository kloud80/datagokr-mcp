summary_user: 서울특별시 동작구에 있는 지정 국가유산을 한 건씩 담은 목록 파일로, 종목·명칭·소재지(구·상세)·지정일·관리부서·기준일을 담는다(csv 약 6KB 규모). 동작구 안에 어떤 국가유산이 어디에 있고 언제 지정됐으며 어느 부서가 관리하는지 확인하려는 주민·연구자·행정 담당자가 쓴다. 국가유산청 종목코드·지정번호 같은 전역 조인 키가 없어, 국가유산청 자체 API나 다른 목록과는 명칭·종목 이름 매칭이나 주소로만 이어 쓴다.
