summary_user: 국립국어원 한국수어사전의 표제어를 번호별로 담고, 각 수어 표제어에 대응하는 한국어 표현을 짝지은 전국 단위·비공간 사전 데이터로, 포털 설명에 따르면 용례가 있는 표제어 125건은 한국어 번역문과 용례 개수가 함께 들어 있습니다. 수어 학습자·교육자·연구자가 "이 한국어 단어는 한국수어 표제어 몇 번에 해당하는가"를 찾거나, 수어 번역·학습 서비스 개발자가 한국어–수어 대응표를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수어 표제어 번호나 한국어 대응표현 문자열을 같은 기관(국립국어원)의 수어 자료와 이름·번호로 맞춰 이어 쓴다.
description_portal: 국립국어원에서 제공하는 한국수어사전 표제어 및 용례 테이터는 한국수어 표제어의 번호와 그에 따른 한국어 대응표현을 제공합니다. 용례를 가지고 있는 표제어 125건은 한국어 번역문과 용례의 개수가 함께 제공됩니다.번호별로 수어 표제어와 해당 표제어의 한국어 대응표현, 다양한 용례의 수와 에시가 포함되어 있어 수어 학습자와 연구자, 일반인 모두가 한국수어와 한국어 간의 의미 연결을 쉽게 이해할 수 있도록 돕습니다. 교육 현장에서는 수어 교육 자료로 활용할 수 있으며, 언어 연구나 번역, 수어 관련 서비스 개발 등 다양한 분야에서 참고 자료로 활용하기에 적합합니다. 수어와 한국어의 상호 이해 증진과 소통 활성화에 기여할 수 있는 공공데이터입니다.
