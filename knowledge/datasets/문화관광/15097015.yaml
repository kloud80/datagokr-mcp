description_portal: 이 데이터는 한국문화예술위원회가 1999년부터 2006년까지 집계한 공연예술 분야의 공연행사 정보를 정리한 자료로, 해당 기간 동안 국내에서 진행된 주요 공연예술 행사의 흐름과 특성을 파악할 수 있는 기반 정보를 제공합니다. 각 항목은 연번, 연도, 행사명, 시작일, 종료일, 주최, 장소, 행사내용, 비고, 부문으로 구성되어 있으며, 연번은 1번부터 1325번까지로 구성되어 있어 방대한 양의 행사 정보를 체계적으로 관리하고 있습니다. 시작일과 종료일은 ‘2002-07-15’와 같은 날짜 형식으로 표기되어 있어 행사 일정의 시계열 분석이 가능하며, 부문 항목은 종합, 창작무용, 한국무용, 현대무용, 발레 등으로 구분되어 있어 공연예술 장르별 행사 분포 및 경향 분석에 유용합니다. 주최 항목에는 전라남도, 부산MBC 등과 같은 기관, 지자체, 방송사 등 다양한 주체가 포함되어 있어 주최 기관의 유형별 참여도와 역할을 파악할 수 있습니다. 이 데이터는 지역별 공연행사 분포, 장르별 활성도, 주최 유형별 주관 행사 특성 등을 분석하는 데 활용될 수 있습니다.
