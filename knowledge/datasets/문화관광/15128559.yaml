summary_user: 티맵 내비게이션 목적지 조회를 바탕으로 시군구별로 다른 관광지와 연계 방문이 많은 중심 관광지의 순위(hubRank)와 명칭·분류·좌표를 담은 집계 API이며, 검증 시 전국 76행이 수신됐다. 여행 앱 기획자나 지자체 관광 담당자가 '이 시군구에서 다른 관광지와 함께 가장 많이 묶여 방문되는 곳은 어디인가'를 확인하는 데 쓴다. 시군구코드(signguCd, 조인 키 sgg_cd)로 다른 시군구 단위 데이터와 이어 쓰고, 관광지 상세 정보는 TourAPI 관광 콘텐츠 원장과 연결해 보완한다.
description_portal: 티맵 모빌리티(주)의 내비게이션 데이터를 기반으로 산출된 지역별 중심 관광지 정보입니다. 해당 지역의 관광지 중 타 관광지와 연계 방문하는 빈도가 높은 관광지가 중심 관광지가 됩니다. Tmap 어플리케이션 사용자가 목적지를 조회하고 거리 기준으로 100m, 시간 기준으로 1분 이상 이동한 조건을 모두 충족한 경우에 한해 집계되며, 차량이동을 기준으로 하므로 실제 연계 방문 정도나 연계 방문하는 사람의 수와는 차이가 있을 수 있습니다. 지자체별 타 관광지와 가장 많이 연결되는 중심 관광지 100위 정보를 제공합니다.
