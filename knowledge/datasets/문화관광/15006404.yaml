summary_user: 대구광역시 북구 관내에 등록된 관광사업체(관광숙박업, 국내·국내외·종합여행업, 테마파크업 등)를 업체 한 곳당 한 행으로 담은 CSV 파일로, 영업종류·상호·도로명 소재지·연락처·위도·경도를 포함한다. 북구에서 영업 중인 여행사나 관광숙박업체가 어디에 몇 곳 있는지 알고 싶은 주민·사업자·분석가가 업종별 목록이나 지도 표시에 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 상호·도로명 주소 대조나 위도·경도 기반 위치 매칭으로만 잇고, 같은 업종의 타 시군구 관광사업 목록과는 영업종류 이름을 맞춰 합친다.
description_portal: 대구광역시 북구 관광시설정보는 관내의 관광진흥법에 따른 관광사업에 관한 정보를 제공합니다. 관광시설정보에 포함되는 대구광역시 북구 관내 관광사업(관광숙박업, 국내여행업, 국내외여행업, 종합여행업, 테마파크업 등)의 상호와 위치 등에 대한 정보를 포함하고 있습니다.해당 정보를 연간 갱신하고 있으나 갱신 주기 사이에 변동사항이 일시적으로 미반영될 수 있는 점 정보 처리 시 참고 부탁드립니다.데이터 건수가 많아 오류가 발생할 수 있으니 엑셀파일을 내려 받으실 경우 주의하여주십시오.
