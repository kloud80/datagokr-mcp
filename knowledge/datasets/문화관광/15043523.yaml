summary_user: 제주 일출랜드(미천굴 중심 종합 관광지) 한 곳의 무장애 여행 정보를 지점 단위로 담은 파일로, 각 지점의 아이디와 위도·경도·해발고도가 들어 있다. 휠체어 이용자·고령자·유아 동반 가족이나 관광 안내 콘텐츠 제작자가 일출랜드 안에서 무장애 편의 지점이 어디에 있는지 지도에 찍어 보는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 장소 이름 매칭이나 같은 기관(제주데이터허브)의 다른 무장애여행정보 파일과 좌표 기준으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 일출랜드 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."*본 데이터셋은 일출랜드의 무장애 여행 정보를 제공하며, 위치 정보, 장소 명칭, 장소 설명, 이미지 자료 등을 포함한다. 일출랜드는 자연용암동굴 미천굴 을 중심으로 수변공원, 잔디광장, 민속촌(제주종갓집 초가), 분재정원, 선인장 온실, 아열대 식물원, 조각 거리, 아트센터 등 다양한 테마로 구성된 종합 관광지이다. 휠체어 대여, 장애인 전용 주차구역, 장애인 화장실, 유모차 대여 등 무장애 편의시설이 마련되어 있으며, 대부분 관람로가 평탄하거나 완만한 경사를 제공해 장애인, 고령자, 유아동반 가족 등을 포함한 관광약자도 비교적 편안하게 이용 가능하다. 본 자료는 관광 안내, 무장애 관광지 홍보, 관광 콘텐츠 제작, 접근성 기반 관광 정책 수립, 열린관광지 조성 등 공공 및 관광 분야의 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
