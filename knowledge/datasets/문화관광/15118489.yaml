description_portal: 이 데이터는 온라인면세점 사이트에서 특정 프로모션(기획전, 이벤트 등) 화면 구성에 대한 정보를 관리하는 데이터입니다. 온라인면세점은 빌더라는 서비스를 이용하여 단발성(이벤트성) 웹페이지를 구성하여 만들 수 있어, 유연한 프로모션을 가능하게 하며, 해당 데이터는 빌더를 이용한 웹페이지 구성을 하였을때 빌더 아이디, 명칭 항목을 저장하여 관리하고 있습니다.빌더 아이디는 여러개의 빌더 중 특정 빌더를 명확하게 구분할 수 있도록 되어 있고 숫자 형태로 구성되어 있으며, 이를 통해 웹서버에서 빌더 아이디를 매핑하여 사용자에게 해당 웹페이지를 보여주도록 되어 있습니다. 명칭은 해당 빌더의 이름을 뜻하며, 관리자가 웹페이지 관리 용이성을 위해 사용하고 있습니다.
