summary_user: 경상북도 영천시에 있는 태권도장·당구장·댄스클럽 등 체육시설업 업소를 한 곳씩 상호, 도로명·지번 주소, 위도·경도로 담은 업소별 명부(CSV 파일)다. 우리 동네 가까운 체육도장이나 당구장이 어디 있는지 찾는 주민이나, 영천시 안 민간 체육시설의 분포와 상권을 살피는 분석가가 쓴다. 전역 조인 키는 실측 컬럼에 없어서, 다른 데이터와는 주소나 좌표를 공간 매칭하거나 상호 이름으로 맞춰 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시 내에 소재한 체육시설업 현황을 체계적으로 정리한 자료 입니다.  지역 내 태권도장, 당구장, 댄스클럽 등 다양한 체육시설들의 위치, 주소(도로명,지번), 위도, 경도 정보를 포함하고 있습니다. 이를 통해 지역 주민과 방문객들이 쉽게 접근할 수 있는 체육 인프라의 현황을 파악할 수 있으며, 지역 주민의 건강 증진과 여가 활동 활성화, 건강 증진, 지역 경제 활성화에 기여할 목적으로 제공됩니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 새마을체육과로 연락주시기 바랍니다.
