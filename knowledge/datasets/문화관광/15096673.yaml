summary_user: 제주특별자치도 시립 운동장별로 기준 연도마다 연면적, 필드 면적, 스탠드 및 기타 면적, 수용 인원, 관람 연인원을 담은 시설 현황 집계 자료이며, 포털 설명상 2011~2019년을 다룬다. 체육행정 담당자나 분석가가 '제주 시립 운동장의 수용 규모와 관람객 수가 연도별로 어떻게 달라졌나'를 확인하거나 스포츠 행사 개최 여건을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 자료와는 운동장명(운동장명)과 기준 연도를 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터셋은 제주특별자치도가 2011년부터 2019년까지 도내 시립 운동장(공공·공립 경기장)의 연면적, 경기장 필드 면적, 수용 인원 등의 시설 현황을 연도별로 정리한 공공데이터이다. 제공 형식은 CSV이며, 누구나 다운로드해 활용할 수 있다. 본 자료는 제주 지역의 공공 체육 인프라 규모와 변화 추이를 객관적으로 파악할 수 있는 기초 통계로서, 지역별 생활체육 시설 분포 분석, 체육시설 확충 필요성 평가, 주민 여가 및 건강 증진 정책 설계, 지역 균형 발전 및 체육복지 정책 수립, 스포츠 행사 개최 여건 분석 등 다양한 행정 및 기획 목적에 활용 가능하다. 또한 연면적·수용능력 데이터를 통해 인구 대비 체육시설 밀집 여부, 접근성, 활용률 등도 함께 분석할 수 있어, 도시 계획 및 지역복지 관점에서도 유의미한 기초자료가 된다.
