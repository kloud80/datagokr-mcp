summary_user: 인천광역시 부평구의 복합유통 게임제공업소를 업소 한 곳당 한 행으로 담은 파일로, 상호명과 소재지 도로명주소·지번주소가 들어 있다(CSV 약 1.5KB 규모). 구민이나 학부모, 지역 정책 담당자가 "부평구 안 어느 동네에 복합유통 게임제공업소가 몰려 있나"처럼 업소 분포와 입지를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소를 지오코딩하거나 상호명을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '복합유통 게임제공업소의 상호명, 소재지 도로명주소 및 지번주소 등을 수록한 데이터.PC게임, 오락기기, 인터넷 서비스 등 다양한 형태의 게임 제공 업소 현황을 파악하고, 청소년 보호, 건전한 게임문화 조성, 지역 여가·문화 산업 관리 및 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 복합유통 게임제공업 등록 현황 및 분포 분석– 도로명·지번주소 기반 업소 입지 특성 및 접근성 평가– 게임 산업 및 오락문화 관리 정책 근거 자료 활용– 청소년 보호와 건전한 여가문화 확산 지원주요 항목 설명● 연번: 데이터의 고유 번호● 상호명: 복합유통 게임제공업소의 공식 명칭● 소재지 도로명주소: 업소가 위치한 도로명 주소● 소재지 지번주소: 업소가 위치한 지번 주소'
