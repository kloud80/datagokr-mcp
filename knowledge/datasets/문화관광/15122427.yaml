description_portal: (데이터 수집목적 및 과정) 경상남도 인허가 체육업 데이터는 경남빅데이터허브플랫폼 데이터베이스에서 관리하고 있는 2023년 기준 인허가 체육업 현황입니다. 경상남도 인허가 체육업에 대한 현황 정보를 파악할 때 활용 할 수 있습니다.(데이터 구성 및 세부항목) 인허가 체육업 데이터는 사업장명, 지번주소, 도로명 주소, 인허가일자, 영업상태, 공사립구분으로 구성됩니다. 총 1114건입니다. 미집계 데이터는 공란 처리합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터이며 현행화 되지 않습니다.
