summary_user: 경상남도 체육시설업(골프·헬스·당구·체육도장 등) 인허가 사업장을 사업장별로 사업장명, 지번·도로명 주소, 인허가일자, 영업상태와 상세영업상태, 공사립구분을 담은 2023년 기준 현황 파일이며, 포털 설명상 총 1,114건이다. 분석가나 창업 예정자가 경남 어느 지역에 헬스장·체육도장 같은 민간 체육시설이 몰려 있는지, 영업 중인 곳과 폐업한 곳이 얼마나 되는지를 볼 때 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 실측 컬럼에 없어서, 다른 데이터와는 주소나 사업장명을 매칭해 이어 쓴다.
limits: 포털 설명상 1회성 데이터로 현행화되지 않아, 현재 영업 여부나 최근 개폐업 추이를 확인하는 데는 맞지 않는다. 공통 키가 없어 상권·사업자 데이터와 연결하면 주소·이름 매칭 오류가 생길 수 있다.
