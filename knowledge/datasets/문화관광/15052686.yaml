summary_user: 대한체육회가 집계한 종목별 대회의 참가자 정보를 참가자 건별로 담은 파일 데이터로, 대회연도·대회명·종목명·시작일과 참가자의 시도·팀명·성별·종별·학년을 기록하며 범위는 전국입니다. 분석가나 경기단체 관계자가 '특정 대회에 어느 시도·학년대 선수가 몇 명 참가했는가'처럼 대회별 참가자 구성을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대회명·종목명·시도명 같은 이름을 맞추거나 같은 기관(대한체육회)의 경기운영정보와만 연결해야 한다.
