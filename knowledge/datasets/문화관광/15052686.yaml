description_portal: 대한체육회에서 제공하는 이 데이터는 종목별 대회 참가자에 대한 상세 정보를 담고 있습니다. 이 데이터는 대회의 기본 정보인 대회연도, 대회명, 종목명을 제공하며, 참가자의 소속 정보인 시도명과 팀명을 담고 있습니다. 또한, 참가자에 대한 구체적인 정보인 성별, 종별, 학년을 기록하고 있어 대회별 참가자 구성에 대한 분석이 가능합니다. 각 참가자는 고유 식별자인 아이디와 키값을 가지며, 경기의 시작일을 나타내는 시작일 정보도 포함하고 있습니다. 관련 정보를 확인할 수 있는 웹주소 링크도 제공됩니다.
