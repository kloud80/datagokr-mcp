summary_user: 서울특별시 중구의 PC방 등 인터넷컴퓨터게임시설제공업 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 자료로, 관리번호·인허가일·영업상태(영업/폐업 등)·지번/도로명 주소·중부원점TM 좌표·시설 면적과 층수 같은 시설 정보를 포함한다. 중구에서 PC방 창업을 검토하는 예비 사업자가 현재 영업 중인 업소가 어디에 얼마나 몰려 있는지 확인하거나, 시민이 근처 PC방 위치를 찾는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중구의 PC방과 같이 컴퓨터 등 게임물을 이용하는데 필요한 기자재를 갖추거나 그 밖의 정보제공물을 이용할 수 있도록 제공하는 업소 정보입니다. 각 등록업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화공간 관련 여가생활 서비스 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 정보통신망 기반 등록업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 운영수칙 및 청소년보호 규정을 준수하며 건전한 여가생활을 위한 시간제서비스를 제공하는 문화공간의 위치를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
