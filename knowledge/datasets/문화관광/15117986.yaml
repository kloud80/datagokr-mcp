summary_user: 한국스포츠정책과학원이 수행한 연구과제를 과제 한 건 단위로 담으며, 과제 국문명·부제명, 연구 시작일·종료일, 총 예산금액을 제공한다. 체육 정책 분석가나 연구자가 '최근 몇 년간 스포츠정책과학원이 어떤 주제의 연구를 얼마의 예산으로 수행했는가'를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 과제명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 한국스포츠정책과학원 연구과제 기본은 서울올림픽기념국민체육진흥공단 한국스포츠정책과학원에서 수행하는 연구과제의 정보를 담은 데이터를 조회할 수 있습니다. 기본 정보에는 수행하는 연구과제의 국문명, 연구과제의 부제명, 연구의 시작일과 연구의 종료일, 그리고 연구과제의 총 예산금액 정보가 포함되어 있습니다. 연구 과제의 과제명, 연구시작일의 범위 등 조회조건을 이용하여 연구과제에 대한 기본 정보를 조회할 수 있는 API서비스입니다. 이 서비스는 한국스포츠정책과학원의 연구과제 현황을 파악하여 체육 분야 연구 동향 분석 및 정책 수립의 기초 자료로 활용될 수 있습니다.
