summary_user: 한국도로교통공단 도서실이 소장한 도서·보고서·정기간행물을 등록번호 단위로 한 건씩 담은 서지 목록이며, 서명·저자·출판사·출판년도·청구기호·소장처·자료유형을 담는다(CSV 약 21.7MB). 교통안전·교통공학 연구자나 정책 담당자가 '이 주제의 문헌을 공단 도서실이 갖고 있는지, 어디에 어떤 청구기호로 있는지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 도서관 목록이나 국가서지와는 서명·저자·출판사 같은 이름 매칭으로만 이어 쓴다.
description_portal: '본 데이터는 한국도로교통공단 도서실이 보유한 도서·보고서·정기간행물의 서지 메타데이터를 정리한 자료이다. 서명, 저자, 발행사, 발행연도, 자료유형, 식별자(ISBN/ISSN), 소장처, 청구기호를 표준 필드로 제공한다. 항목 명칭을 통일해 목록 검색과 연계 활용이 쉽고, 서명·저자·주제어 기반 교차 탐색과 서지관리 도구 연동이 가능하다. 본 자료는 교통안전·교통공학 문헌 출처 파악, 기관 지식자원 현황 점검, 주제별 자료 묶음 구성에 쓰인다. 이용자는 연구·정책 수립에 필요한 기본 문헌을 파악하고, 타 기관 자료와 결합해 소장 범위를 시각화한다. 요약: 공단 소장 자료의 표준 서지정보를 제공해 서명·발행사항·소장 위치를 일관되게 확인하도록 구성한 데이터다.'
