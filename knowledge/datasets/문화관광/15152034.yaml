description_portal: 연구자 및 일반 국민들이 자신이 원하는 국어 관련 정책 통계 자료에 쉽게 접근하고 활용할 수 있도록 국립국어원 대표 누리집을 통해 제공했던 통계 자료 목록입니다. 각 통계 자료의 조사 목적, 조사 대상, 방법 등 기본 정보 및 통계 데이터의 주요내용을 제공합니다. 관련된 데이터의 출처, 원문 링크 정보도 같이 제공하여, 이용자가 실 데이터 확인 및 활용이 가능하도록 구성하였습니다. 2011년~2014년에 조사된 통계 자료를 대상으로 하고 있으며, 현재 국립국어원 대표 누리집에서 제공되고 있지 않습니다.
