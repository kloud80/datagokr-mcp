summary_user: 전국 지자체가 관리하는 관광사업자(관광숙박업·국제회의업·일반여행업 등)의 인허가 정보를 사업장 단위로 담으며, 전체 2,651건에 인허가일자·영업상태·주소·좌표·보험 정보 등이 있다. 국민이나 분석가가 특정 지역에 등록된 여행업체나 관광숙박업소가 영업 중인지, 언제 인허가를 받았는지 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)가 조인 키라서 주소 기준으로 다른 숙박·관광 데이터와 이어 쓰며, 사업자번호 같은 별도 키는 필드에 없다.
description_portal: '문화_관광사업자 데이터는 관광숙박업, 국제회의업, 일반여행업 등 관광사업을 경영하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 관광사업자업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광정책과 / 044-203-2814 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
