summary_user: 한국저작권위원회의 저작권 분쟁조정 처리현황을 성립·불성립·취하·기타로 나눠 2012년부터 2024년까지 연도별 건수로 집계한 전국 단위 통계 파일(CSV, 270바이트)로, 처리현황 구분이 행이고 연도가 열인 형태다. 분석가나 정책 담당자가 "저작권 분쟁조정 중 화해가 성립한 비율이 해마다 어떻게 달라졌나" 같은 추이 질문에 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키나 코드표가 없어, 다른 저작권 통계와는 연도 기준으로 직접 맞춰 이어 써야 한다.
description_portal: 저작권에 관한 분쟁이라면 조정의 대상이 되며 저작재산권에 대한 분쟁, 저작인격권에 대한 분쟁, 저작인접권에 대한 분쟁, 보상금에 대한 분쟁 대표적인 경우가 있고 종법조계, 학계, 산업계를 대표하는 1~3인의 전문가들로 구성된 조정부의 조력을 통하여 당사자간 원만한 화해를 유도하는 대체적 분쟁해결제도 중 하나로서 신속, 저렴하며 비공개로 진행되어 당사자의 명예와 프라이버시를 보호받을 수 있는 유용한 분쟁해결 제도이며, 연도별로 성립, 불성립, 취하, 기타 구분하여 처리현황을 건수로 추출한 통계자료이다.
