description_portal: '비디오물(원판 포함)을 수입하거나 저작권을 소유, 관리하여 판매하거나 대여하는 사업을 하는 자에게 공급하는 영업의 형태를 비디오물배급업이라고 합니다. 서울특별시 용산구_비디오물배급업 인허가 정보에 대해 인허가 일자, 영업상태, 폐업일자, 전화번호, 주소, 사업장명에 대한 정보를 제공합니다. 비디오물 배급업을 하려는 경우 관할 관청에 신고하여 등록해야 합니다. 제출서류는 비디오물 배급업 신고서인 (제21호서식)비디오물제작(배급)업 신고서 (영화 및 비디오물의 진흥에 관한 법률 시행규칙 : 별지서식 20호), 영업소 사용권 권리관계 증명서류 및 사업자등록증, 법인인 경우 법인관련 서류, 대리인 방문시 대리인 신분증 사본, 사업계획서, 법인 대표자의 신분증 사본, 영업소 임대차 계약서 사본등이 필요하며 준비절차는 신고서의 작성, 비디오물배급업 관련 서류 준비, 시 군 구 담당부서에 서류접수, 서류 검토 및 확인, 결재, 신고증 발급의 절차를 거치며 비디오물배급업 관련 정보를 제공하고 있습니다'
