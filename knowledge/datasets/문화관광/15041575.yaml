summary_user: 강진군 고려청자박물관이 소장한 유물을 한 점(건)씩 유물번호·명칭·수량과 단위·국적·시대·재질(대·소분류)로 정리한 CSV 파일(약 760KB)이다. 연구자나 전시 기획자가 이 박물관에 어느 시대·어떤 재질의 청자 유물이 몇 점 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 박물관 소장품 데이터와는 유물 명칭·시대·재질 같은 이름 매핑이나 같은 기관(강진군) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 전라남도 강진군 고려청자박물관에 소장된 유물 현황을 정리한 자료로, 유물의 기본 정보와 분류 체계를 파악할 수 있도록 구성되어 있습니다. 각 유물은 순번과 유물번호로 식별되며, 주수량 및 단위, 유물 명칭이 기록되어 있습니다. 또한 국적과 시대 구분을 통해 유물의 역사적 배경을 알 수 있으며, 재질(대·소)을 통해 제작 기법과 특징을 구체적으로 파악할 수 있습니다. 주요 항목에는 순번, 유물번호, 주수량, 주수량단위, 명칭, 국적, 시대, 재질(대), 재질(소), 데이터기준일자가 포함됩니다. 이 자료는 고려청자박물관의 소장품 관리, 연구, 전시 및 문화재 보존 정책 수립에 중요한 기초자료로 활용될 수 있습니다.
