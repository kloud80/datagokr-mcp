summary_user: 부산광역시 동래구에 있는 문화재 매매업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 허가번호·상호·도로명/지번 영업장소·대표자성명·허가일자·구분·허가 상태를 기록하며 파일 크기는 319바이트에 그친다. 동래구에서 허가를 받고 영업 중인 문화재 매매업소가 어디인지 확인하려는 구매자나, 업소의 허가 일자와 현재 상태를 점검하려는 담당자·분석가가 쓴다. 전역 조인 키가 없어 국가유산청 지정유산 목록(종목코드·지정번호)과는 직접 이어지지 않으며, 영업장소 주소를 지오코딩하거나 상호·허가번호로 다른 지자체 매매업소 목록과 대조해 쓴다.
description_portal: '이 데이터는 부산광역시 동래구에 위치한 문화재 매매업소의 현황을 기록한 자료로, 문화재 관련 거래의 관리  기초정보로 제공됩니다.제공되는 주요 항목은 다음과 같습니다:허가번호: 문화재 매매업 등록 시 부여된 고유 허가 식별번호상호: 사업체의 공식 명칭영업장소: 사업장이 운영되는 장소의 주소 또는 위치대표자성명: 사업장 대표자의 실명허가일자: 해당 업소가 문화재 매매업 허가를 받은 날짜구분: 사업 유형 분류 상태: 현재 허가 상태 해당 데이터는 동래구청 문화관광과에서 관리및  현행화 하고 있으며 다른 내용이 궁금하시면 동래구청 문화관광과에 문의하시면 됩니다.'
