summary_user: 제주 한라도서관 등 제주특별자치도 공공도서관이 고른 추천도서를 책 한 권당 한 행으로 담은 파일로, 해당연도·대상·제목·저자·발행자가 들어 있으며 파일 크기는 약 1KB로 작습니다. 독자나 사서가 '올해 제주 공공도서관이 어린이·성인에게 권한 책은 무엇인가'를 확인하거나 독서 프로그램용 목록을 만들 때 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어서, 다른 도서 데이터와는 제목·저자 이름을 맞춰 보는 방식으로만 이어 쓴다.
limits: ISBN 같은 공통 키가 없으므로 도서관정보나루의 대출·인기도서 데이터와 정확히 매칭되지 않는다. 대출 횟수나 소장 여부는 담지 않는다. 포털에 올라온 파일이 아주 작아서 전체 추천 이력이 아닌 일부 연도분일 수 있다.
