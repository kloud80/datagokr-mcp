description_portal: 본 데이터는 서울특별시 종로구에서 운영되는 비디오물시청제공업소의 인허가 이력을 담고 있습니다. 주요 항목으로는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 업소의 행정적 변화 및 운영 상태를 파악할 수 있도록 구성되어 있습니다. 해당 업종은 「영화 및 비디오물의 진흥에 관한 법률」 제52조에 따라 등록·관리되며, 시민의 건전한 영상물 이용 환경 조성 및 불법영상물 차단 등을 목적으로 관리되고 있습니다. 이 데이터는 특정 시점의 운영 현황, 신규 개설 및 폐업 추세, 행정처분 내역 등의 정보를 포함하고 있어 문화산업 통계 분석, 도시 안전 정책 수립, 유관 부서의 점검 계획 수립 등 다양한 분야에서 활용 가능합니다. 정보는 정기적으로 갱신되며, 공공데이터 제공 및 이용 활성화에 관한 법률에 따라 개방됩니다.
