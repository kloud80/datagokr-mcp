summary_user: 부산광역시 서구 관내 일반 숙박업 중 여인숙업으로 신고된 영업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 주소·전화번호·업태명이 들어 있다(csv 1,634바이트 규모의 소량 목록). 서구에서 저렴한 숙소를 찾는 여행자나 지역 숙박 인프라·노후 숙박시설 분포를 살피는 분석가가 '서구에 여인숙이 어디에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 업소명·주소 문자열로 다른 데이터와 맞춰야 하며, 공중위생법 신고 기반의 숙박업 인허가 공통 원천(LOCALDATA)이나 같은 서구의 다른 숙박업 현황 파일과 이어 쓴다.
description_portal: 부산광역시 서구에서 관내 일반 숙박업 중 ‘여인숙업’ 업종에 해당하는 영업소 정보 현황 데이터입니다.수집 항목에는 업종명, 업소명, 영업소 주소(도로명), 전화번호, 업태명 등 기본 영업 정보가 포함되어 있으며, 이를 통해 각 숙박업소의 위치, 운영 형태, 연락처 등 사항을 확인할 수 있습니다.예시 데이터에는 신광, 동원여인숙, 부산, 남선, 하동, 동림, 부산장모텔, 수정, 동미, 정, 일신, 미진, 칠성여인숙, 창성, 재건, 동성, 우정, 동성여인숙, 광명 등 다수의 여인숙 업소가 포함돼 있으며, 각 영업소의 도로명 주소, 연락처, 업태 구분(여인숙업) 정보가 제공됩니다.본 데이터는 숙박업소 관리·점검, 안전·위생 지도, 관광객 편의 제공, 지역 내 숙박 인프라 분석 등 다양한 행정 및 서비스 분야에서 활용될 수 있습니다.
