summary_user: 국민체육진흥공단이 지정한 우수체육용구 생산업체를 업체·품목 단위로 정리한 전국 목록 파일로, 업체명·품목명·지정기간 시작일과 종료일·대표자명·주소를 담는다. 공공기관이나 학교·체육단체 구매 담당자가 '야구공이나 축구골대를 우수체육용구로 지정받은 업체가 어디이고 지정기간이 언제까지인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 업체명이나 주소를 기준으로 사업자 정보 등 다른 데이터와 이름 매칭해야 연결된다.
description_portal: 서울올림픽기념국민체육진흥공단 우수체육용구 생산업체 목록(업체명, 품목명, 지정기간, 담당자, 대표자명, 주소)입니다.ILB, 원앤원, 한아스포츠 등 국내 우수한 체육용구 생산 업체들의 정보를 제공하며, 야구공, 골프웨지, 양궁활, 자전거, 하늘, 축구골대, 농구대, 어린이놀이기구, 철봉 등 다양한 체육용구 품목에 대한 지정기간(2020-2023년), 대표자명, 생산업체의 주소 등의 정보를 포함하고 있습니다. 이를 통해 우수 체육용구 제조업체 현황을 파악할 수 있습니다. 이 서비스는 우수 체육용구 생산업체의 품목별 정보와 지정 현황을 제공하여 공공 및 민간의 체육용품 구매 시 신뢰도 높은 공급처 선정에 활용될 수 있습니다.
