description_portal: 국립중앙박물관 교육 통합 플랫폼 "모두(MODU)"는 국립중앙박물관 및 소속 13개 박물관의 교육 콘텐츠를 통합 제공하는 플랫폼이다. 모두플랫폼에는 이용자들이 직접 참여해볼 수 있는 다양한 디지털 콘텐츠가 있다. 그 중 ‘마음복원소’는 박물관이 오래되어 낡고 훼손된 문화재를 복원하여 전시하듯 마음을 치유하고 되살리는 곳이 될 수 있다는 취지로 국립중앙박물관과 대학생이 함께 기획한 온라인 콘텐츠이다. 마음복원소에서 이용자는 자신의 감정 상태를 진단하고 그에 맞는 관람코스를 추천받게 된다.
