description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 국립제주박물관은 제주시 건입동 일주동로 17에 위치한 고고·역사 박물관으로, 2001년 개관 이래 제주 지역의 선사시대부터 조선시대까지의 유물 16,000여 점을 포함한 문화유산을 체계적으로 전시하고 있다. 상설전시실, 옥외전시장, 실감영상실, 어린이박물관 등이 마련되어 있으며, 탐라시대 탐라문화부터 제주의 자연환경과 해양문화까지 아우르는 제주 문화의 흐름을 한눈에 보여준다. 이 박물관은 무장애 접근성을 고려하여 장애인 전용 주차장, 경사 출입구, 엘리베이터, 휠체어 및 유모차 대여, 장애인 화장실, 점자 안내판, 음성 안내, 수유실 및 기저귀 교환대 등 다양한 편의시설을 구비하고 있어 교통약자, 고령자, 유아 동반 가족도 편안하게 이용 가능하다. 이 자료는 관광 안내, 무장애 관광지 홍보, 접근성 중심 여행 코스 설계, 열린관광지 정책 수립, 지도 및 콘텐츠 제작 등 공공과 관광 분야 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
