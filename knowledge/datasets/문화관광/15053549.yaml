summary_user: 경기도 포천시 안에 있는 영화관을 상영관 한 곳당 한 행으로 담은 파일로, 상영관명·구분·지번 및 도로명 주소·관람정원을 기록한다(CSV 약 1KB의 소규모 목록). 주민이나 문화정책 담당자가 '포천시에 영화관이 어디에 몇 곳 있고 좌석 규모는 얼마인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상영관명이나 주소를 기준으로 맞춰 붙여야 한다.
description_portal: 경기도 포찬시에서 제공하는 영화관정보(상영관명, 상영관소재지번주소, 상영관소재도로명주소, 관람정원 등)데이터 입니다. 상영관명 항목은 영화관명을 나타냅니다. 상영관소재지(지번)주소 항목은 상영관이 위치한 지번 주소를 나타냅니다. 상영관소재지(도로명) 항목은 상영관이 위치한 도로명 주소를 나타냅니다. 관람정원 항목은 해당 상영관의 관람정원을 나타냅니다.  데이터는 정기적으로 갱신되어 최신 시설 현황을 반영합니다. 이 데이터는 지역 내 문화시설 분포 파악, 관람 환경 분석,  문화예술 관련 정책 수립 등 다양한 행정 목적에 활용될 수 있습니다.
