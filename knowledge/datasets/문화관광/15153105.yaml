summary_user: 국가유산청이 제공하는 보물 정보를 재난안전데이터 공유플랫폼을 거쳐 전국 단위로 제공하며, 건별로 지정일자·유산명·시대·분류·지정번호·소재지·좌표(XCRD·YCRD)를 담는다. 특정 지역에 있는 보물이 무엇이고 언제 지정됐는지 확인하거나, 좌표로 재난 위험지역 주변의 보물을 찾는 데 쓴다. 실측 컬럼에서는 전역 조인 키가 확인되지 않아, 국가유산청 자체 API 등 다른 유산 데이터와는 지정번호(DSGN_NO)나 유산명 매핑으로 이어 쓴다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국가유산청에서 제공하는 국가유산(보물)에 대한 관련 정보입니다.\""
