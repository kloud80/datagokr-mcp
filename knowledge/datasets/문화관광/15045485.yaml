summary_user: 인천광역시 미추홀구에 등록된 인터넷컴퓨터게임시설제공업(PC방) 업소를 한 곳씩 담은 건별 파일로, 상호명·등록일·도로명주소·위도·경도를 포함한다. 주민이나 사업자가 '우리 동네에 PC방이 어디에 얼마나 있고 언제부터 영업했나'를 확인하거나, 분석가가 청소년 이용시설 점검·상권 분석을 위해 PC방 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명주소나 위도·경도 좌표를 기준으로 공간 결합하거나 상호명으로 맞춰 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구 내에서 운영 중인 게임산업 관련 업소 현황을 수록한 자료로, 인터넷컴퓨터게임시설제공업(일명 PC방)에 대한 정보를 제공합니다. 데이터에는 업소의 상호명, 업종명, 등록일, 도로명 주소, 위도·경도 정보 등이 포함되어 있으며, 등록일을 통해 업소의 운영 시작 시점을 확인할 수 있습니다. 업종은 모두 ‘인터넷컴퓨터게임시설제공업’으로 분류되어 있고, 도로명주소 및 지번 정보는 각 업소의 정확한 위치를 파악하고 지도 기반 서비스 연계에 유리한 형식으로 제공됩니다. 위도·경도 항목은 행정지도 시스템 및 민간 내비게이션 서비스에 활용되며, 게임 산업의 지역적 분포를 분석하고 정책적 기반 마련에 유용한 기초자료로 활용됩니다. 해당 데이터는 청소년 이용시설 점검, 산업현황 조사, 지역 경제 분석 등 다양한 목적으로 활용될 수 있으며 연 1회 갱신합니다
