summary_user: 한국콘텐츠진흥원 콘텐츠산업정보포털에서 쓰는 공통 상세코드를 코드 한 건당 한 행으로 담은 코드표 파일이며, 코드·코드명·코드설명과 함께 카테고리코드번호, 상위코드, 사용상태, 정렬순서, 등록·수정일시를 담는다(CSV 약 174KB, 전국·비공간). 콘텐츠산업정보포털의 다른 데이터를 받은 분석가가 그 안의 코드값이 어떤 서비스 종류나 분류를 뜻하는지 풀어 읽을 때 쓴다. 실측 컬럼에서 다른 기관 데이터와 잇는 전역 조인 키는 찾지 못했으므로, 같은 기관(한국콘텐츠진흥원) 데이터의 코드값과 코드(또는 카테고리코드번호·상위코드 계층)를 맞추거나 이름으로 매핑해 연결한다.
description_portal: '한국콘텐츠진흥원의 콘텐츠산업정보포털에서의 공통 상세코드를 나타내는 정보를 담은 데이터 자료로 제공하고 있습니다. 이 데이터는 콘텐츠 산업의 다양한 관련 정보를 체계적으로 정리하고 있으며, 기업, 연구자, 공공기관 등에서 콘텐츠 산업에 대한 분석 및 연구에 활용할 수 있습니다. 예를 들어, 콘텐츠 제작사나 유통사의 서비스 종류를 식별하거나, 특정 코드에 대한 상세정보를 활용해 콘텐츠 개발에 필요한 기준을 파악하는 데 도움을 줄 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 코드(문자형): 각 코드의 고유 식별 번호입니다. 코드명(문자형): 각 코드의 명칭으로 사용자에게 제공되는 정보입니다. 코드설명(문자형): 각 코드에 대한 간략한 설명입니다. 사용상태값(문자형): 코드의 사용 가능 여부를 나타냅니다. 최초등록일시(문자형): 코드가 처음 등록된 날짜와 시간을 나타냅니다. 마지막수정일시(문자형): 코드가 마지막으로 수정된 날짜와 시간을 나타냅니다. 해당 데이터를 활용함으로써 콘텐츠 산업 관련 정책 수립 및 전략적 의사결정에 유용한 정보를 제공받을 수 있습니다.'
