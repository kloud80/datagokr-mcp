summary_user: 서울 성동구 안의 태권도·검도 등 체육도장업 업소를 한 곳씩 담은 인허가 명부로, 관리번호(MGTNO)별 인허가일자·취소일자·영업상태·폐업일자·소재지 주소·좌표·지도자 수 등 행정 이력과 현황을 담는다. 성동구에서 어느 동네에 체육도장이 새로 생기거나 문을 닫았는지, 현재 영업 중인 도장이 몇 곳인지 확인하려는 학부모·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드·주소·업소명 매칭으로만 이어 쓰며, 같은 LOCALDATA 체계의 다른 체육시설업(헬스·당구 등) 명부나 상권 데이터와 나란히 놓고 본다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 태권도, 검도 등 신체와 정신을 동시에 단련시키는 무도장 및 체육시설 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 전통 무도장은 청소년과 성인의 체력 증진, 인성 교육, 자기 수양, 지역사회 건강문화 조성 등 다양한 사회적 가치를 실현하는 중요한 역할을 맡고 있습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 설립·변경·폐업 등 주요 행정 이력과 현재 운영 현황이 필수적으로 포함되어 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현장 점검 및 자료 갱신을 실시해 데이터의 신뢰성과 최신성을 보장하고 있습니다. 본 데이터는 무도장 현황 분석, 체육정책 및 청소년 교육 프로그램 수립, 시장 동향 및 상권 분석, 소비자 안내, 업체 평가, 지역사회 연구 등 다양한 분야에서 실질적으로 활용될 수 있습니다. 정책입안자, 연구자, 업계, 일반 시민 모두에게 객관적이고 실효성 있는 자료를 제공하며, 데이터는 주기적으로 최신화됩니다.
