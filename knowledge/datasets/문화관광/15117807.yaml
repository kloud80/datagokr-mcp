description_portal: '이 데이터는 지역 내 종교시설의 분포 및 운영 정보를 정리한 자료로, 주민 생활과 밀접한 종교 활동 공간의 위치 및 기본 현황을 제공하기 위해 구축되었습니다. 각 시설은 종교 구분(기독교, 불교 등), 시설명, 지번주소 및 도로명주소, 연락처 등으로 구성되어 있으며, 이를 통해 지역 내 종교시설의 접근성 분석, 생활 SOC 연계, 재난 대응 및 행정 관리 등에 활용할 수 있습니다. 본 데이터는 총 7개 항목으로 구성되어 있으며, 기준일은 2025년 8월 21일입니다.순번: 데이터에 기록된 종교시설의 일련번호입니다.시설명: 종교시설의 명칭입니다.지번주소: 건축물의 지번 기준 주소입니다.도로명주소: 도로명 기반의 최신 주소 체계입니다.전화번호: 해당 종교시설의 대표 연락처입니다.종교구분: 해당 시설이 소속된 종교 분류입니다(예: 기독교, 불교 등).데이터기준일: 본 데이터가 집계된 기준일입니다.'
