description_portal: 이 데이터는 서울시 남부여성발전센터에서 제공하는 수강 가능한 교육강좌의 개설정보를 담고 있습니다. 강좌명, 교육내용 개요, 수강대상, 운영기간, 신청가능 여부 등이 포함되어 있어, 관심 있는 학습자가 어떤 강좌를 언제, 어떤 대상에게 제공되는지 쉽게 파악할 수 있도록 설계되어 있습니다. 접수 마감된 강좌는 목록에서 제외되어 실제 수강가능한 기회 중심으로 정보를 제공하므로, 프로그램 기획자나 참여희망자 모두에게 실질적 정보자료로 활용됩니다. 또한 이 데이터를 통해 교육기회 분포 분석, 대상자별 강좌 유형 비교, 프로그램 운영 기관 간 차이 평가 및 지역별 교육 공급량 분석 등이 가능합니다.남부여성발전센터에서 실시하는 교육강좌 정보입니다. 교육신청은 http://nambu.seoulwomen.or.kr/ 에서 직접 하셔야 합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://nambu.seoulwomen.or.kr/ 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
