description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 김녕고장난길은 제주 제주시 구좌읍 김녕리에 위치한 마을 탐방로로, 해안가 마을과 마을 담벼락에 설치된 금속공예 벽화 및 조형물 30여 점이 약 3 km 구간에 걸쳐 이어지며 ‘고장난길’은 제주어로 ‘꽃 핀 길’이란 뜻을 담고 있고 해안 풍경과 마을 이야기, 금속예술이 어우러진 장소이며 데이터에는 평탄하고 포장된 보행로, 장애인화장실 및 무장애 접근로 정보가 포함되어 있어 휠체어·유모차 이용자, 고령자, 교통약자 등 누구나 비교적 편안하게 마을 산책과 해안 경관 감상을 즐길 수 있는 열린 관광지로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
