summary_user: 여수시 관광문화홈페이지의 관광 키워드 목록으로, 관광 주제 표제(관광제목)와 해당 홈페이지 주소를 한 줄씩 담은 작은 파일(csv, 약 2KB)이다. 여수 관광 안내 서비스나 챗봇을 만드는 사업자가 '여수 관광 주제별로 어느 페이지로 연결하면 되나'를 정리할 때 쓴다. 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 제목 이름을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전라남도 여수시 관광문화홈페이지에서 제공하는 관광 키워드 관련 자료로, 관광 주제를 나타내는 표제와 관련 홈페이지 주소 등 정보 탐색에 필요한 항목을 포함하고 있습니다. 해당 데이터는 관광정보 분류, 연관 콘텐츠 연결, 이용자 검색 편의 제공, 관광안내 서비스 운영 지원 등을 위한 기초자료로 활용할 수 있도록 구성되어 있습니다. 또한 관광 주제별 정보 접근 경로를 체계적으로 제공하여 관광콘텐츠 탐색 효율을 높이고, 홈페이지 내 정보 연결성과 활용도를 높이는 데 참고할 수 있는 자료입니다. 아울러 관광 관련 검색어와 연결 정보를 기반으로 이용자 맞춤형 정보 제공과 콘텐츠 관리 체계 보완에도 활용할 수 있습니다.
