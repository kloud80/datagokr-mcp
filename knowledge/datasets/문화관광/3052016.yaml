summary_user: 영주시 소수박물관이 소장한 유물·전시품을 한 건씩 담은 CSV 파일(약 1.7MB)로, 소장품번호·명칭·수량·국적시대·재질·실측치·입수연유·입수처·지정구분·지정번호를 담는다. 전통문화 연구자나 문화유산 해설사, 교사가 '소수박물관에 어떤 시대·재질의 유물이 있고 그중 지정문화유산은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 명칭이나 지정번호를 이름·코드 매핑으로 맞춰야 하며, 문화시설 코드나 좌표 같은 공통 키로 바로 이어지지 않는다.
limits: 실측 컬럼에 전역 조인 키가 없어 문화기반시설 코드나 다른 박물관 소장품 데이터와 자동으로 연결되지 않는다. 범위는 영주시 한 시군구의 한 박물관이며 위치 정보가 없는 비공간 자료라 지역 분포 분석에는 맞지 않는다.
