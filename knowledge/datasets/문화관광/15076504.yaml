description_portal: 2004년 문예연감의 시각예술 관련 정보입니다. 총 9개의 시트로 구성되어 있습니다. 각 시트 항목에는 전시회 지역별(서울), 전시회 지역별(경기), 전시회 지역별(강원), 전시회 지역별(충청도), 전시회 지역별(경상도), 전시회 지역별(전라도), 전시회 지역별(제주도), 전시회 지역별(외국전), 국내작가 해외전시회로 구성되어 있습니다. 각 항목들은 모두 일자, 행사명, 장소, 비고, 부문으로 구성되어 있습니다. 부문 항목에는 종합, 회화, 사진, 한국화, 공예, 서예, 유물, 설치 등으로 구성되어 있습니다. 따라서 파일에서 2004년 문예연감의 시각예술 관련 정보를 확인할 수 있습니다.
