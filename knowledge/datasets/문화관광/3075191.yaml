summary_user: 부산광역시 중구 관내 동네체육시설을 시설 한 곳당 한 행으로 담은 작은 현황 파일(csv, 약 2KB)로, 명칭·소재지·조성시기·체육시설물 현황(설치된 운동기구·부대시설 목록)을 담는다. 중구 주민이 집 근처 공원·운동장에 어떤 운동기구가 있는지 찾거나, 분석가가 시설별 조성 시기와 기구 구성을 비교해 개보수·확충 대상을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 시설 명칭이나 소재지 주소를 맞춰서 연결해야 한다.
description_portal: '부산광역시 중구 관내 동네체육시설 현황 데이터를 제공합니다.(동네체육시설 현황에 대한 데이터로 명칭, 소재지, 조성시기, 체육시설물 현황 목록이 있음)체육시설물 현황에 변경사항을 반영하였습니다Ⅰ. 체육시설 현황 ○ 설치개소 : 중앙공원 운동장 등 22개소  ○ 운동기구 : 204종 263점 ○ 부대시설 : 111종 302점Ⅱ. 추진방향 ○ 체육시설 이용주민 의견수렴을 위한 수시 확인 점검 등 현장 행정 ○ 즉각적인 개보수 노력 등 이용주민 편의 제고 및 쾌적한 환경조성 ○ 주민수요를 반영한 체육시설 조성 및 운동기구 확충 노력'
