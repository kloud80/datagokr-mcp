limits: 명세상 갱신 주기는 연간이고 실측 최신 행 날짜는 2026-02-10(관측일 기준 234일 전)이므로 최신 신규 인허가·폐업을 즉시 반영한다고 보기 어렵다. 전주시 범위만 담으며, 관광 콘텐츠(TourAPI) 원장과 직접 연결되는 contentId 같은 키는 필드에 없다. 세부 부문은 관광 콘텐츠로 분류돼 있으나 식품위생업소 성격이라 이동 제안이 있다.
