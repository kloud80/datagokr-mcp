description_portal: 전북특별자치도 전주시 휴게음식점 현황 데이터는 전주시 관내 휴게음식점의 인허가 및 운영 현황 정보를 시민에게 투명하게 제공하기 위해 구축된 데이터셋입니다. 본 데이터는 번호, 업태구분, 사업장명, 인허가일자, 전화번호, 도로명주소, 지번주소, 위도, 경도, 소재지면적, 다중이용업소여부 등의 정보를 포함하여 휴게음식점의 기본 현황과 위치 정보를 체계적으로 확인할 수 있도록 구성되었습니다.특히 업태구분, 인허가일자 및 다중이용업소 여부 등의 정보를 함께 제공함으로써 시민이 업소의 운영 현황을 보다 명확하게 확인할 수 있도록 하였으며, 위치정보(위도·경도)를 통해 지도 기반 검색 서비스, 상권 분석, 위생·안전 정책 연구, 지역 외식업 현황 분석 등 다양한 분야에서 활용할 수 있도록 설계되었습니다. 또한 연구자 및 관련 종사자가 지역 산업 구조 분석 및 공공서비스 개선 자료로 활용할 수 있습니다.전주시는 본 데이터를 통해 식품위생 행정의 투명성과 공공정보 접근성을 강화하는 것을 목표로 하며, 신규 인허가, 변경 및 폐업 등 변동 사항을 반영하여 지속적으로 최신 정보를 제공할 예정입니다. 본 데이터는 전주시 구청 청소위생과에서 제공·관리합니다.
