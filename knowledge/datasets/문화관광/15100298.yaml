summary_user: 전국 중고서점을 한 곳씩 담은 시설 단위 목록으로, 시설명·분류·도로명주소·우편번호·위도·경도와 평일·토요일·일요일·휴일별 개점·마감 시간, 전화번호, 편의시설·부가 설명을 담는다. 시민이 "우리 동네 근처에 주말에 문을 여는 중고서점이 어디인가"를 찾거나, 분석가가 지역별 중고서점 분포를 지도로 그리는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 주소·우편번호로 행정구역을 맞추거나 위도·경도로 공간 매칭해 이어 쓴다.
description_portal: 전국 중고서점의 위치와 운영 정보를 한눈에 확인할 수 있도록 구성된 데이터셋입니다. 시설명, 분류, 주소, 위도·경도 등 위치 정보와 함께 평일·주말·휴무일별 개점 및 마감 시간, 전화번호, 화장실 등 편의시설 여부, 서점의 특성 등 다양한 세부 정보를 포함하고 있습니다. 중고서점 현황 파악, 문화공간 지도 제작, 지역별 서점 탐방, 문화정책 수립, 창업 정보 제공 등 여러 분야에서 활용이 가능합니다. 또한, 공공기관, 연구자, 일반 시민 모두에게 유용한 자료로, 전국 중고서점의 접근성과 이용 편의 증진에 기여합니다.
