summary_user: 제주특별자치도에서 지정된 농어촌 체험·휴양 마을을 마을 한 곳당 한 행으로 담은 목록으로, 마을명·시군구·지정연월·체험프로그램명과 주소·좌표를 개별 단위로 싣는다. 제주 여행객이나 마을관광 기획자가 "제주시·서귀포시에 어떤 체험마을이 있고 어떤 체험 프로그램을 운영하나"를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 관광 데이터와는 마을명이나 시군구 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터셋은 2021년을 기준으로 제주특별자치도 내에서 지정된 농어촌 체험·휴양 마을들의 현황 정보를 수록하고 있습니다. 각 마을의 명칭, 지정 연월, 체험 프로그램명, 보유 시설, 소재지(도로명/지번주소), 대표자 연락처, 관리 기관, 위도·경도 등의 항목을 포함하며 CSV 형식으로 무료 제공됩니다. 제공기관은 제주특별자치도청의 디지털혁신과입니다. 이 정보는 제주 지역 농어촌·어촌 마을의 체험 관광 자원 현황 파악, 마을 단위 관광 인프라 분석, 마을관광 기획 및 정책 수립, 지역 활성화 방안 모색 등에 활용될 수 있습니다. 다만 2021년 시점을 기준으로 하고 있어 그 이후의 추가 지정, 해제, 프로그램 변경 등은 반영되지 않았을 수 있다는 점을 유의해야 합니다
