description_portal: '한국영상자료원이 제작, 발행 중인 웹진 <아카이뷰>의 발행내역 데이터입니다.한국영상자료원에서는 기관 주요 사업과 소식들을 이용객에게 보다 균형있기 전달하기 위해 웹진을 제작하여 월 1회 발행하고 있습니다.기존에 발간하였던 기관지와는 달리 온라인으로만 제작되며한국영상자료원의 특징적인 요소와 업무를 중심으로 내용이 구성됩니다.해당 데이터는 웹진관리번호, 발행년월, 제목, 회차, 조회수 열로 구성되며 총 13행을 포함하고 있습니다.발행한 웹진은 아래 경로를 통해 열람 가능합니다.- URL : https://www.koreafilm.or.kr/webzine'
