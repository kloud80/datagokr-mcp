summary_user: 경기도 양주시에 등록된 여행업체를 업체 한 곳당 한 행으로 담은 파일로, 업종·상호·우편번호·지번/도로명 주소·위도·경도·관리기관 연락처를 포함한다. 양주시 안에서 국내·국외 여행사를 찾는 주민이나, 지역 여행업체 분포를 지도에 올려보려는 분석가가 '양주시에 어떤 여행사가 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호·주소 이름 매칭이나 좌표(위도·경도) 기반 공간 결합으로 이어 쓴다.
limits: 범위가 양주시 한 곳뿐이라 다른 시군이나 전국 비교에는 다른 지자체 파일을 따로 모아야 한다. 실측 컬럼에 등록번호·사업자번호 같은 공통 키가 없어 관광사업 등록 원장이나 사업자 정보와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다.
