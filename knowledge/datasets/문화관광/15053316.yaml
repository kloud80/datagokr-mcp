summary_user: 부산광역시 영도구가 운영하는 축구장을 시설 한 곳당 한 행으로 담은 현황 파일로, 위치·면적·시설정보·공사기간과 준공일자·사업비, 하절기·동절기 사용시간, 휴장일, 사용료(전일·평일·휴일 1시간), 조명 사용료를 담는다(CSV 566바이트의 작은 파일). 영도구 주민이나 동호회가 "영도구 공공 축구장은 어디에 있고 주말 1시간 대관료와 야간 조명비는 얼마인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·위치 문자열을 맞추거나 같은 기관(영도구) 단위로만 이어 쓰며, 문체부 전국체육시설 데이터나 다른 구의 체육시설 현황과 비교할 때도 이름 매칭이 필요하다.
description_portal: <부산광역시 영도구 축구장 현황 정보>*컬럼별 상세설명○ 구분 → 시설명○ 위치 → 시설위치○ 면적 → 시설면적○ 시설정보 → 구장 사용면적, 관리 건물 등○  그 외 사용 가능 시간, 사용료(평일, 주말, 주야간) 이 데이터는 부산광역시 영도구에서 운영 중인 축구장의 위치, 면적, 시설정보, 준공시기, 운영 시간, 사용료(평일·주말, 주간·야간) 등의 정보를 제공하며, 체육시설 현황 파악과 공공데이터 활용을 위한 자료입니다. 지역 주민의 체육 활동 증진과 시설 이용 편의를 도모하고자 작성되었습니다.*체육공원, 축구장, 동네체육, 체육인프라, 체육시설, 구기종목, 축구, 스포츠
