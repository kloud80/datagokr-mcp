summary_user: 전북특별자치도 산림박물관이 보유한 유물·학습자료·체험 소품을 물품 한 건씩 적은 목록으로, 유물번호·자료명·대분류·재질·수량과 곤충·토사·버섯·씨앗·목재·식물 같은 자료 구분, 전시실·수장고 보관 위치를 담는다. 체험학습을 준비하는 교사나 방문객이 '이 박물관에 어떤 산림 표본과 체험 도구가 있고 전시실에 나와 있는가'를 확인하거나, 박물관 소장품 구성을 살피는 분석가가 쓴다. 실측 컬럼에 전역 조인 키(문화시설 코드 등)가 없어 다른 데이터와는 박물관 이름이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도 산림박물관이 보유한 학습 자료 및 체험 소품의 현황을 상세히 보여주는 목록입니다. 투호, 대형 장기판과 같은 전통 놀이 도구부터 집음기, 굴삭기 모형 등 관람객의 흥미를 유발하는 과학 체험 소품, 그리고 빔프로젝터와 같은 영상 장비까지 다양한 교육용 자산을 포함하고 있습니다. 각 물품의 재질, 수량, 보관 위치 등을 명시하여 박물관의 교육 및 체험 프로그램 운영 현황을 체계적으로 파악할 수 있게 합니다. 이 자료는 박물관의 교육적 기능을 이해하고, 방문객에게 제공되는 체험 활동의 종류를 가늠해 볼 수 있는 중요한 정보입니다.
