description_portal: 대한체육회에서 발행하는 "스포츠원" 간행물은 스포츠 선수의 국내외 활동 정보, 대한체육회 및 회원종목단체의 다양한 소식을 한데 모아 매달 발행하는 잡지입니다. 이와 관련된 데이터는 간행물의 발행년도, 책호수와 같은 기본 식별 정보를 제공하며,사용자들이 잡지 내용을 직접 다운로드하여 이용할 수 있도록 책 다운로드주소(PDF), 이북 링크 주소, 그리고 간행물 표지 이미지 다운로드 주소까지 포함하고 있습니다. 이 "스포츠원" 간행물을 통해 특정 시기의 스포츠 이슈나 대한체육회의 활동을 확인 할 수 있습니다.
