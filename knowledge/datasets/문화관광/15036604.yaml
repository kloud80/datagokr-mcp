summary_user: 경기도 김포시 안의 문화공간(김포아트홀·김포아트빌리지 등)을 시설 한 곳당 한 행으로, 이름·소재지 주소·주요시설·주요프로그램·홈페이지·전화번호를 담은 작은 목록 파일(약 1.5KB csv)이다. 김포 시민이나 방문객이 공연·전시·체험을 할 수 있는 시내 문화시설이 어디에 있고 어떤 시설을 갖췄는지 확인할 때 쓴다. 전역 조인 키(문화시설코드 등)는 없어서, 다른 문화시설 데이터와는 시설명이나 소재지 주소를 맞춰 이어 쓴다.
description_portal: 경기도 김포시 문화공간 현황 정보에 대한 데이터로 문화공간명, 소재지주소, 주요시설, 주요프로그램, 홈페이지, 전화번호 등의 항목을 제공합니다.김포아트홀은 사우역 3번출구에서 도보 3분 거리에 위치해 접근성이 좋고, 공연장, 갤러리, 세미나실, 연습실 등의 시설이 구비되어있어 매월 다양한 전시와 공연이 열립니다.김포아트빌리지는 한옥마을, 미디어아트센터, 야외공연장, 전통한옥숙박체험관 등으로 구성되어 도심 속 한옥의 정취를 느끼며 다양한 전시, 체험, 숙박 등 다양한 놀거리를 즐길 수 있습니다.
