description_portal: 이 데이터셋은 대한민국 문화체육관광부 및 산하 기관에서 생산되는 공연, 전시, 문화예술, 문화유산, 관광, 체육, 도서 등 다양한 문화정보를 종합적으로 제공하는 OpenAPI 서비스입니다. 기간별, 지역별, 분야별 공연 및 전시 목록과 상세정보, 장소, 일정, 가격, 위치 좌표, 썸네일 이미지, 관련 링크 등 다양한 정보를 포함합니다. 그 뿐만 아니라 문화행사 일정 확인, 문화캘린더 서비스, 지역 문화 홍보, 문화정책 연구 등 다양한 분야에서 활용할 수 있으며, 데이터는 최신 정보를 반영해 주기적으로 갱신됩니다.
