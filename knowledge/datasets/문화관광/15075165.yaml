description_portal: 이 데이터는 구엄돌염전 에 대한 위치정보(위도·경도), 장소명칭, 장소 상세정보, 무장애 관광 편의시설 정보 등을 체계적으로 구조화한 공공데이터이다. 구엄돌염전은 제주 애월읍 구엄리에 위치한 전통 돌염전 유적으로, 평평한 현무암 암반 위에 바닷물을 받아 햇볕과 해풍으로 천일염을 생산하던 ‘소금빌레’이다. 현재는 원형을 일부 복원하여 관광지로 활용 중이며, 돌염전의 지형, 해안 누리길과의 연계 동선, 주차장 및 접근로 정보 등이 포함되어 있어 장애인, 고령자, 유모차·휠체어 이용자 등 모든 방문자가 무장애 환경 속에서 자연과 역사를 체험할 수 있도록 설계되었다. 이 데이터셋은 무장애 여행 경로 설계, 관광자원 관리, 여행 안내 자료 제작, 접근성 기반 관광 정책 수립 등 다양한 공공·민간 활용에 적합하며, CSV 형식으로 무료 제공된다.
