summary_user: KISS 인증을 받은 스포츠용품을 제품(모델)별로 한 건씩 담은 인증실적 목록 파일로, 업체명·품목·모델명·인증 유효기간을 담는다. 공공기관이나 체육시설 운영자가 인조잔디·실내체육관 바닥재·야구공 같은 용품을 살 때 '이 업체의 이 모델이 KISS 인증을 받았고 유효기간이 아직 남았는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 업체명이나 품목명을 문자열로 맞춰서만 이어 쓸 수 있다.
