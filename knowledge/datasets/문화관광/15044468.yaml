description_portal: 서울올림픽기념국민체육진흥공단에서 다양한 스포츠용품 대상으로 품질, 규격 운동기능 및 생산공정 등을 평가하여 KISS인증 마크를 부여하는 KISS 스포츠용품 인증실적(업체명, 품목, 모델명, 유효기간) 정보를 제공합니다. 홍인터내셔날, 코리아우드, 미에이비테크, 위한바이어티 등 다양한 업체들이 다트, 실내체육관바닥재, 인조잔디, 야구공 등의 품목에 대해 인증을 받았으며, 각 제품의 모델명과 인증 유효기간(2022~2025년)이 포함되어 있습니다. 이 서비스는 KISS 인증을 받은 스포츠용품의 품질 및 신뢰성 정보를 제공하여 공공 및 민간의 체육용품 구매 시 인증기준 기반의 객관적인 선택에 활용될 수 있습니다.
