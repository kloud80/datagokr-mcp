summary_user: 서울특별시 용산구에 신고된 종합체육시설업(실내수영장을 포함해 두 종류 이상의 체육시설을 한 장소에 둔 업종)을 사업장 한 곳당 한 행으로 담은 인허가 명부로, 인허가·취소 일자, 영업상태, 폐업·휴업 기간, 상호명, 지번·도로명 주소, 좌표가 들어 있다. 주민이나 분석가가 "용산구에서 지금 영업 중인 수영장 포함 복합 스포츠센터는 어디이고, 최근 문을 닫은 곳은 어디인가" 같은 질문에 쓰며, 민간 체육시설의 개폐업은 상권 신호로도 읽는다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 상호명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로 잇고, 다른 업종의 LOCALDATA 체육시설업 명부와는 같은 컬럼 구조로 이어 붙여 쓴다.
description_portal: 서울특별시 용산구에 정식으로 신고된 체육시설업 중 종합체육시설업의 현황 정보를 제공하고 있습니다. 이 정보에는 용산구 내 위치한 종합체육시설업(실내수영장을 포함한 두종류 이상의 체육시설이 같은 장소에 설치된 체육시설업)에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구에 정식으로 신고된 다른 업종의 신고체육시설업의 정보 또는 공공체육시설에 대한 정보가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
