summary_user: 해남군 송지면 땅끝오토캠핑장 한 곳의 주소, 규모, 시설현황, 최초개장일, 정기휴장, 전화번호와 캐러밴(5인 기준)·오토캠핑 사이트의 성수기·비수기 요금을 담은 시설 단위 파일이다(CSV 약 718바이트). 캠핑객이 "땅끝오토캠핑장 캐러밴을 주말 성수기에 쓰면 하루 얼마인가"를 확인하거나 해남 여행 일정을 짤 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 캠핑장 이름으로 맞춰 이어야 한다. 예를 들어 야영장 등록 목록이나 해남군의 다른 관광 데이터와 붙여 쓴다.
description_portal: '전라남도 해남군 땅끝오토캠팡장에 관한 공공데이터 입니다.데이터항목: 광역시도, 지번주소, 도로명주소, 규모(캠핑장), 야영장, 최초개장일, 시설현황, 캐러밴(5인 기준) 성수기/비성수기 요금(일, 월, 화, 수, 목),  캐러밴 (5인 기준) 성수기/비성수기 요금                      (금토, 연휴, 공휴일전날), 오토캠핑장 성수기/비성수기 요금(일, 월, 화, 수, 목), 오토캠핑장 성수기/비성수기 요금(금, 토, 연휴, 공휴일전날)시설위치: 전라남도 해남군 송지면  갈산길 25-5홈페이지: https://autocamp.haenam.go.kr땅끝오토갬핑장 주변에 송호해수욕장, 땅끝전망대 등 다양한 관광지가 있습니다.'
