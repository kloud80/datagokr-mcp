summary_user: 인천시 공식 관광포털 '인천투어'에 실린 관광지 정보를 대분류·소분류별로 묶어 콘텐츠 건수(DB콘텐츠건수)와 관련 페이지 주소를 담은 집계 목록으로, 개별 관광지 건별 원천이 아니라 2.7KB 남짓한 작은 CSV 파일이다. 인천 여행을 준비하는 관광객이나 분석가가 '인천투어에는 어떤 종류의 관광지가 분류별로 몇 건씩 올라 있고 어느 페이지에서 보나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 분류 이름을 맞춰 붙이거나 같은 기관 자료끼리만 연결하며, 개별 관광지 정보가 필요하면 TourAPI 관광 콘텐츠(contentId·지역코드 기반)를 대표 원장으로 함께 본다.
limits: 분류별 건수와 URL만 담아 개별 관광지의 이름·위치·운영정보는 알 수 없고, 좌표 등 공간 정보도 없다. 공통 코드나 키가 없어 TourAPI 등 다른 관광 데이터와 자동 조인이 되지 않으며 이름 매핑이 필요하다.
