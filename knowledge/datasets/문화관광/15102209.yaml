description_portal: 인천투어 홈페이지는 인천시가 운영하는 공식 관광포털로, 인천의 다양한 여행정보를 한눈에 볼 수 있도록 구성되어 있습니다.인천투어 홈페이지에서 제공하는  관광지  현황을 관광지 리스트 현황 데이터로  제공합니다. 관광지 리스트 현황 데이터는 대분류, 소분류, DB콘텐츠 건수, 관련URL  등 관광지 정보를 체계적으로 분류하여, 시민과 관광객에게 다양한 인천관광 자원에 대한 정보를 쉽게 찾아볼 수 있으며 여행 가기전 확정보를 확인할 수 있고 도움을 받을 수 있습니다. 해당 데이터는 공공데이터포털에서 CSV파일로 제공하고 있습니다.
