summary_user: 전북특별자치도 정읍시에 있는 공공체육시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 1.7KB)로, 시설명·소재지 주소·시설 현황·관리부서와 연락처·데이터 기준일자를 담는다. 정읍 시민이 집 근처 공공 수영장이나 테니스장이 어디 있고 어느 부서에 문의하면 되는지 찾는 데 쓰고, 분석가가 시내 운동 인프라가 부족한 지역을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소로 맞춰 이어야 하며, 문체부 전국체육시설 자료나 같은 기관의 다른 체육 데이터와 비교할 때도 이름 매칭에 의존한다.
description_portal: 전북특별자치도 정읍시에 소재한 공공체육시설 현황중 시설명, 소재지주소, 시설현황, 관리부서, 관리부서 연락처의 정보를 제공합니다.전북특별자치도 정읍시 공공체육시설 현황 데이터를 개방하며 시민들의 시설 접근성 향상을 돕고, 지자체가 운동 인프라 부족 지역을 파악해 맞춤형 체육 정책을 수립하게 됩니다.또한 민간, 기업의 관련 서비스 개발과 건강 증진 프로그램 개선에도 활용되어 지역 체육 활성화를 촉진할 것으로 예상됩니다.기타 공공체육시설 관련 궁금한 사항은 담당부서인 정읍시 시설운영과로 문의하시기 바랍니다.
