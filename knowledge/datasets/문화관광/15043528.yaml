summary_user: 제주데이터허브가 제공하는 한라생태숲의 무장애여행 지점 정보로, 지점마다 아이디·위도·경도·해발고도와 장소설명·이미지를 담는다. 휠체어·유아차 이용자나 무장애 관광 담당자가 한라생태숲 안 경사로 산책로, 장애인 주차구역·화장실, 휠체어 대여 같은 편의시설 위치를 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 장소 이름이나 위도·경도 좌표를 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 한라생태숲 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."*한라생태숲은 제주시 용강동 해발 약 600m 부근에 위치한 숲 복원 및 생태보존 공간으로, 과거 야초지였던 지역을 자연림으로 회복하여 난대 식물부터 고산대 식물까지 포함한 다양한 식생을 보전하고 있다. 이 데이터셋은 무장애 여행자를 고려해 경사로·우레탄 포장 산책로, 장애인 전용 주차구역, 장애인 화장실, 휠체어 대여, 유아차 대여 등 편의시설과 접근성 정보를 포함하고 있다. 외부 관람로 대부분은 3–5도 내 완만한 경사로 설계되었으나, 일부 구간은 약 10도 경사가 있어 휠체어 이용 시 주의가 필요하다. 이 정보는 무장애 관광지 조성, 열린관광지 확대, 관광 서비스 품질 향상 및 정책 수립 등의 기초 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
