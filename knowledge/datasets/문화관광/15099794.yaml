summary_user: 충청남도 금산군에 있는 지정 문화재(국가유산)를 한 건씩 담은 목록 파일이다. 항목마다 지정 구분, 이름, 소재지, 지정번호, 시대, 지정일, 면적, 상세 소개가 들어 있다. 포털 설명에 따르면 72건이다. 금산군에 어떤 지정 문화재가 어디에 있는지, 언제 지정됐는지 알고 싶은 주민·관광객이나 지역 문화유산 현황을 정리하는 분석가가 쓴다. 전역 조인 키는 없으므로, 국가유산청 API 등 다른 유산 데이터와 잇거나 지도에 올리려면 문화재명·지정번호 또는 소재지 주소로 직접 맞춰야 한다.
description_portal: 이 데이터는 충청남도 금산군의 문화재(구분, 문화재명, 소재지, 지정번호, 시대, 지정일, 면적, 소개 등)에 대한 정보를 제공합니다. 충청남도 금산군의 문화재 지정 현황에 관한 정보를 제공하는 데이터로, 총 72건의 문화재가 포함되어 있으며, 문화재의 상세 소개가 포함되어 있습니다. 해당 데이터는 지역의 역사·문화 자원 현황 파악, 문화재 보호정책 수립, 관광자원 개발 등의 목적으로 유용하게 활용될 수 있으며, 문화유산 행정관리 시스템이나 GIS 공간정보 시스템과 연계해 분석 자료로도 사용될 수 있는 유익한 공공데이터입니다.
