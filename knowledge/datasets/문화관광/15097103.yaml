summary_user: 제주 검은여 해안 주변을 중심으로 설계된 무장애 여행코스를 지점 단위로 담은 파일 데이터로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부를 함께 싣는다. 휠체어 이용자나 이동약자 동반 여행자가 '검은여 해안을 걸을 때 어느 지점이 추천 경로이고 주차장·화장실 같은 편의시설은 어떤가'를 확인하거나, 지자체·관광 분석가가 열린관광지와 무장애 관광 인프라 개선 대상을 고를 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등과는 지점 이름이나 위도·경도 좌표를 기준으로 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 내 제주특별자치도_검은여로_무장애여행코스데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 내 검은여 또는 검은여 해안 주변을 중심으로 설계된 무장애 여행 코스 정보를 제공합니다. 이동약자 및 휠체어 이용자 등을 고려해, 관광지 개요, 주소, 주차장 및 화장실 등 편의시설 상태, 이동 경로(코스), 추천 여부 등의 정보를 체계적으로 정리하였으며, 주요 지점별 사진 자료도 포함되어 실제 환경과 시설 상태를 시각적으로 확인할 수 있도록 설계되었습니다. 해당 자료는 무장애 관광환경 조성, 열린관광지 구축, 관광 인프라 개선, 관광 서비스 개발 및 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
