description_portal: 본 데이터는 2022년 12월 16일을 기준으로 경상남도 남해군 내 제로페이 가맹점의 종합적인 현황 정보를 제공하여, 소비자 결제 편의 증진 및 지역 소상공인 지원 강화를 목표로 합니다. 각 가맹점별 공식 '가맹점명', 제공 서비스 및 상품을 알 수 있는 '업종' 분류, 정확한 소재지 파악을 위한 '주소', 그리고 모바일 지도 서비스 연동 및 주변 검색에 필요한 '위도'와 '경도' 좌표 등 핵심 정보를 상세히 포함하고 있습니다. 특히, 본 자료는 국문뿐만 아니라 영문, 중문, 일문 등 총 4개 국어로 주요 정보를 제공하여 국내외 관광객을 포함한 모든 이용자들이 남해군 내 제로페이 사용처를 보다 쉽게 찾고 편리하게 활용할 수 있도록 정보 접근성을 크게 향상
