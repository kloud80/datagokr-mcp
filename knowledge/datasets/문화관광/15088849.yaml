summary_user: 경기도 본청·시군·의회·직속기관이 만든 전자책 자료를 한 건씩 담은 목록으로, 각 행에 제작일자, 분류, 자료명, 열람용 웹 URL이 들어 있다. 경기도 도시기본계획 보고서나 의회소식지 같은 행정 간행물을 온라인으로 찾아 읽으려는 도민이나 연구자가 '이 보고서 원문을 어디서 볼 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자료명·분류 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 경기도청 본청 및 시군, 의회, 직속기관 등에서 제작한 전자책(eBook) 자료의 목록을 제공하며, 각 자료는 제작일자, 분류내용, 자료명, 열람 가능한 웹 URL로 구성되어 있습니다. 자료명은 도시기본계획 보고서, G-Life 홍보지, 의회소식지 등으로 다양하며, 행정정보 제공 및 지역기록물의 디지털 보존을 목적으로 수집됩니다. 이용자는 해당 URL을 통해 각 전자책을 직접 열람할 수 있으며, 이는 경기도의 행정정보 접근성 제고, 정책자료의 온라인 보급 확대, 지역 간 정보 격차 해소 등에 기여할 수 있습니다.
