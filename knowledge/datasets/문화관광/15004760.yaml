summary_user: 강남구도시관리공단이 운영하는 강남구 관내 공공 체육시설과 공연장을 시설 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 3KB)로, 시설 유형·면적·층수, 평일·주말 운영시간, 휴관일, 유료 여부, 도로명주소·전화·홈페이지, 위도·경도를 담는다. 강남구 주민이 '집 근처 공공 체육시설이 주말 몇 시까지 열고 유료인지'를 확인하거나, 분석가가 구 단위 생활체육 시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소 매칭이나 위도·경도 기반 공간 결합으로 이어 쓰며, 문체부 전국체육시설 데이터와 맞출 때도 이름·주소로 대조해야 한다.
description_portal: 강남구도시관리공단 체육시설 및 공연장 정보 데이터는 강남구 관내 공공 체육시설 및 공연장의 기본 현황과 운영 관련 정보를 제공합니다.시설의 명칭, 위치, 시설 유형, 면적, 층수 등 물리적 현황을 비롯하여, 평일·주말 운영시간, 휴관일, 유료사용 여부 등의 이용 조건을 포함하여 시설 이용에 필요한 주요 정보를 종합적으로 제공합니다.또한 이용자가 시설을 쉽게 찾고 문의할 수 있도록 도로명 주소, 사용안내 전화번호, 홈페이지 주소와 함께 정확한 위치 정보(위도·경도)를 제공하며, 관리기관명과 담당부서명 정보도 포함되어 있어 시설 운영 주체에 대한 확인과 연락이 용이합니다.이 데이터는 공공시설 접근성과 편의성을 높이고, 체육·문화 활동을 지원하기 위한 기반자료로 활용될 수 있습니다.
