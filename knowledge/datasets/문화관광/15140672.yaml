summary_user: 은평구 내 당구장업 업소의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 업소명·지번/도로명 주소·인허가일·폐업일·영업상태·중부원점TM 좌표(X, Y) 등이 들어 있다. 동네에 영업 중인 당구장이 어디 있는지 찾는 주민이나, 은평구 당구장의 개업·폐업 추이를 상권 신호로 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 체육시설업 인허가 명부와 같은 축에서 비교하는 데 쓴다.
description_portal: '은평구에서 당구를 하는데 필요한 시설을 갖추어 놓은 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.본 데이터는 은평구 내 당구장업소에 대한 행정적 인허가 정보로, 업소의 명칭, 주소, 등록일, 운영 여부, 업장 유형(일반 당구장, 복합 문화공간 등)을 포함하고 있습니다. 당구는 오랜 기간 남성 중심의 스포츠로 인식되었으나, 최근에는 청소년·여성·중장년층까지 다양한 계층의 여가 문화로 확산되며 지역 커뮤니티 기반 스포츠로 자리잡고 있습니다. 본 정보는 해당 업종의 위생 관리, 안전 점검, 소음 민원 방지 등 행정적 대응을 위한 기반일 뿐 아니라, 지역 여가 시설 현황을 파악하고 생활체육 인프라 확충의 근거 자료로도 활용됩니다. 특히 실내 스포츠 공간에 대한 시민 수요가 높아지면서, 여가시설 접근성 불균형 문제 해결, 청소년 건전문화 형성, 시니어 스포츠 복지 정책 수립과 같은 다양한 분야로 확장이 가능하며, 민관 협력 기반 시설 리모델링 및 지역 특화형 문화시설 정책과도 연결될 수 있습니다. 또한 본 데이터는 각 업소의 밀집도, 운영 규모 등을 바탕으로 한 민원예방, 소방안전 대책 수립, 스마트 예약 시스템 적용 여부 등 실효성 높은 행정운영으로 연계될 수 있는 자료입니다.'
