status: active
summary_user: 부산 16개 구·군에 있는 관광명소를 한 곳씩 담은 목록으로, 명소별 이름·부제목·주소·위경도·연락처·홈페이지·교통정보·운영일과 운영시간·휴무일·이용요금·이미지 주소·상세설명을 제공한다. 부산 여행객이나 시민이 '이번 주말 영도구에서 갈 만한 명소가 어디고, 쉬는 날과 요금은 얼마인가'를 확인하거나, 여행 앱·지도 서비스가 부산 명소 정보를 채우는 데 쓴다. 전역 조인 키는 없어서 구·군 이름(GUGUN_NM)이나 명소 이름으로 맞추거나 위경도로 공간 결합해야 하며, TourAPI 관광지와도 이름·좌표 매칭으로만 이어진다.
limits: TourAPI contentId 같은 공통 식별자가 없어 다른 관광 데이터와 정확히 1:1로 연결되지 않고, 이름·좌표 매칭에는 오차가 생길 수 있다. 지자체 관광지 목록이라 범위는 부산에 한정되며, 관광 콘텐츠 부문에서는 보조 등급으로 TourAPI를 대표 원장으로 두고 함께 쓴다. 개발계정은 일 10,000회 호출 제한이 있다.
