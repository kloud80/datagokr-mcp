description_portal: 관광객들, 여행객들에게 도움이 될 수 있는 부산시에 있는 유명한 관광명소 데이터를 개방합니다. 개방되는 데이터에는 명소 이름, 제목, 부제목, 주소, 연락처, 홈페이지, 교통정보, 운영일, 휴무일, 운영시간, 이용요금, 이미지 주소, 상세내용등을 포함하고 있습니다.영도의 흰여울 문화마을, 기장의 아홉산숲, 보수동 책방골목, 임시수도 기념관, 아미동 비석마을, 호천마을, 부산시민공원, 화명수목원 등 부산 16개 구군에 산재한 관광명소가 있습니다.관광객들 뿐만아니라 부산 시민들도 개방되는 데이터를 통해 여가 시간을 부산 명소를 방문하며 즐겁게 보낼수 있을 것입니다.
