summary_user: 인천광역시 영종구(구 중구) 원도심·영종지역에 등록된 관광편의시설업(관광펜션업·관광면세업·관광지원서비스업 등) 업체를 한 줄에 한 곳씩 담은 등록 현황 파일로, 업종·업체명·주소·전화번호와 데이터 기준일자로 구성된다. 관광객이나 여행 사업자가 '영종·중구 일대에 등록된 관광펜션이나 관광면세점이 어디에 있고 연락처가 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 관광사업 등록 데이터와는 업체명·주소 문자열 매칭으로만 연결한다.
limits: 사업자등록번호나 표준 코드 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 주소 단위의 개별 업체 목록일 뿐 좌표·매출·이용객 같은 정보는 담지 않는다. 범위는 해당 구(시군구) 한 곳에 한정된다.
