summary_user: 인천 미추홀구 관내에 신고된 출판사를 사업체 한 곳당 한 행으로 담은 CSV 파일(약 48KB)로, 신고일자·사업체명칭·도로명 주소·지번 주소를 담는다. 구내 출판사가 어디에 몰려 있는지, 언제 신고된 곳인지를 확인하려는 지역 문화산업 분석가나 출판 관련 사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 다른 데이터와는 사업체명이나 주소(도로명·지번)를 매칭하거나 주소를 좌표로 바꿔 연결한다.
description_portal: 본 데이터는 미추홀구 관내 출판사 현황을 수록한 자료입니다. 출판업에 종사하는 사업체별 신고일자, 사업체명칭, 사업체 소재지의 도로명 주소 및 지번 주소가 포함되어 있어 지역 출판 산업의 분포와 특성을 파악할 수 있도록 구성되어 있습니다. 이를 통해 신규 등록된 출판사와 기존 사업체의 행정정보를 체계적으로 관리할 수 있으며, 출판업 종사자의 활동 기반과 지역 내 문화콘텐츠 산업의 현황을 살펴볼 수 있습니다. 특히 주소 정보는 도로명과 지번으로 모두 제공되어 행정적 활용과 공간적 분석에 유리하며, 특정 지역의 출판사 집중 현황이나 문화산업 기반 연구에도 기초자료로 쓰일 수 있습니다.
