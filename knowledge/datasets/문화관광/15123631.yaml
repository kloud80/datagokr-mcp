summary_user: 대한민국구석구석에 올라온 여행 가이드북을 한 권당 한 행으로 정리한 목록으로, 제목·제작처·시도·시군구·가이드북 링크를 담은 전국 단위 비공간 파일(csv 약 12KB)이다. 여행자가 '가려는 지역에 어떤 기관이 만든 가이드북이 있나'를 찾거나, 지자체·관광 담당자가 지역별 가이드북 발행 현황을 훑어보는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 시도·시군구 이름이나 제작처 이름을 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 한국관광공사의 공식 관광 포털 ‘대한민국구석구석(korea.visitkorea.or.kr)’에서 제공하는 여행 가이드북 정보를 수집·정리한 목록입니다. 국민의 국내여행 활성화 및 지역관광 홍보를 목적으로 수집되었으며, 각 가이드북은 여행 주제, 권역, 지역, 발행처, 링크 등의 세부 정보를 포함합니다. 수록된 콘텐츠는 테마여행 10선, 유네스코 문화유산, 생태관광, 자전거길, 웰니스 여행, 템플스테이 등 다양한 주제를 포괄하고 있으며, 계절별·목적별로 분류된 여행 정보를 제공합니다. 해당 데이터는 여행자에게 실질적인 여행 계획 자료로 활용될 수 있으며, 지자체 및 관련 기관의 관광콘텐츠 제작, 정책 수립, 데이터 기반 마케팅 자료로도 활용 가치가 큽니다.
