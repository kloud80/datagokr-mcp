description_portal: 이 데이터는 1999년 문예연감에 수록된 문학 관련 정보를 정리한 자료로, 총 12개의 시트로 구성되어 있으며, 해당 연도의 국내 문학 출판, 창작, 수상, 행사 및 매체 운영 현황을 포괄적으로 담고 있습니다. 각 시트 항목은 문학 관련 단행본_시집목록, 소설목록, 수필목록, 평론목록 등 장르별 출간 도서 정보, 문학잡지 수록 신작 작가별 일람_시, 소설, 수필, 평론 등 잡지에 실린 신작의 장르 및 작가별 현황, 문학상 수상자일람과 문학상일람을 통해 수상작과 수상자, 주최기관 등의 정보, 그리고 문학단체 행사 일람과 문학잡지 일람을 통해 해당 연도 주요 문학 활동과 매체 발간 실태를 확인할 수 있습니다. 이 자료는 1999년 한국 문단의 문학 생산 및 유통 구조를 종합적으로 이해하고, 출판 경향 및 작가 활동, 수상 흐름 등을 분석하는 데 유용한 기초 데이터로 활용될 수 있습니다. 특히 문학 정책 연구, 장르별 창작 동향 파악, 출판 현황 조사, 문예지 분석 등 다양한 영역에서 참조할 수 있는 공공 문학 기록물입니다.
