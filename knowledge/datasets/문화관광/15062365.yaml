summary_user: 광산구 도서관에서 운영하는 독서·문화 동아리를 동아리 한 건씩 담은 목록 파일로, 동아리명·대상·운영요일·장소·활동분야·운영 도서관명을 담는다(CSV 약 1.6KB의 소규모 파일). 광산구 주민이 '우리 동네 도서관에 아이나 성인이 참여할 수 있는 독서토론·글쓰기 동아리가 언제 어디서 열리나'를 찾거나, 구 담당자가 도서관별 프로그램 구성을 살피는 데 쓴다. 전역 조인 키나 도서관코드가 없어 도서관명(도서관명)을 이름으로 맞춰 도서관 목록·도서관정보나루 데이터와 이어 써야 한다.
description_portal: 광주광역시 광산구 도서관 동아리 현황에 관한 데이터로 동아리명, 대상, 시간, 장소, 활동분야 등의 항목을 제공합니다.광주광역시 광산구 도서관에서는 지역 주민의 자발적이고 다양한 독서·문화 활동을 지원하기 위해 여러 도서관 동아리를 운영하고 있으며, 이에 관한 현황 데이터에는 동아리의 핵심 정보가 체계적으로 수록되어 있습니다. 동아리명, 대상 항목을 통해 각 모임이 어떤 주제나 활동을 중심으로 구성되어 있는지와 참여할 수 있는 연령대나 주체(유아, 청소년, 성인, 가족 등)를 확인할 수 있습니다.시간, 장소 항목을 통해 정기 모임의 운영 요일과 시간대를 알 수 있으며, 해당 모임이 열리는 도서관 내 공간(작은 강의실, 시청각실, 열람실 등)을 확인할 수 있습니다.활동분야 항목은 독서토론, 창작글쓰기, 인문학강좌, 영화감상, 영어회화 등 동아리별 주제와 콘텐츠를 제시합니다.이러한 데이터는 광산구 도서관의 문화·교육 프로그램을 총체적으로 분석하고, 향후 운영 방향 설정 또는 신규 동아리 기획 시 기초 자료로 폭넓게 활용될 수 있습니다.
