description_portal: '제주특별자치도는 잊혀져가는 제주의 주요 민속문화 자원에 대한 가치발굴과 원형보존을 위해 관련 자료를 동영상, 그래픽, 플래쉬애니메이션 등으로 디지털화하여 제공하고 있습니다.제주역사: 삼별초(김통정장군의최후), 삼양동 선사유적지, 이재수의 난(난의 전개), 천연사후(활쏘기경연), 송악산진지동굴, 표류인, 해녀축제(해녀왕선발대회), 김만덕(기적에서 삭제), 법정사항일투쟁, 탐라국(탐라의해상교류), 관덕정(주민무술연마), 해녀항일운동(해녀항일투쟁), 알뜨르비행장, 4.3사건과 평화의 섬 제주, 제주민란 등*파일을 다운로드 하시면 관련 설명 자료가 함께 첨부되어 있습니다. ※ 추가 참고 자료: 제주도청 문화/역사/체육 분야별홈페이지 디지털콘텐츠 https://www.jeju.go.kr/culture/digitalContents/directory.htm'
