summary_user: 울주군에 있는 비지정 문화유산의 현황을 담은 파일 자료로, 포털 설명상 유산별 명칭·소재지·유형·시대·소유자·보존 상태를 다루며 약 285MB 크기의 zip 파일로 제공된다. 향토사 연구자나 지자체 문화유산 담당자가 '울주군에 아직 지정되지 않은 유산은 무엇이 있고 지정 검토 대상은 어디인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 국가유산청 지정유산 데이터(종목코드·지정번호 기반)와는 유산 명칭이나 소재지를 맞춰 보는 방식으로만 이어 쓴다.
limits: 공통 조인 키가 없어 다른 유산 목록이나 지번(PNU)과 자동으로 연결되지 않는다. 파싱된 필드가 개별 유산 이름 하나뿐이어서 표 형태의 정형 데이터가 아닐 수 있으므로, 내려받은 뒤 파일 구성을 직접 확인해야 한다.
