summary_user: 부산광역시 연제구에 신고·등록된 공연장을 한 곳당 한 행으로 담은 시군구 단위 파일로, 공연장 명칭·도로명/지번 주소·전화번호·면적·객석수·영업상태·운영주체·등록일자를 담으며 파일 크기는 552바이트로 소규모이다. 주민이나 공연 기획자가 '연제구에 객석 몇 석 규모의 공연장이 어디에 있고 지금 영업 중인가'를 확인하는 데 쓴다. 실측 컬럼에 KOPIS 공연장ID(mt10id) 같은 전역 조인 키가 없으므로, KOPIS 공연장 목록이나 다른 지자체 공연장 파일과는 공연장 명칭·주소를 맞춰 대조하는 방식으로만 연결한다.
description_portal: '부산광역시 연제구 공연장 현황(공연장 명칭, 주소지, 전화번호, 면적, 객석수, 운영주체 등)정보를 제공합니다.공연 : 음악ㆍ무용ㆍ연극ㆍ뮤지컬ㆍ연예ㆍ국악ㆍ곡예 등 예술적 관람물을 실연(實演)에 의하여 공중(公衆)에게 관람하도록 하는 행위공연자 : 공연을 주재(主宰)하거나 직접 하는 자공연장 :  공연을 주된 목적으로 설치하여 운영하는 시설로서 대통령령으로 정하는 것관련법 :  공연법(목적: 예술의 자유를 보장하고, 공연자 및 공연예술 작업자의 안전한 창작환경 조성과 건전한 공연활동의 진흥을 위하여 공연에 관한 사항을 규정함)'
