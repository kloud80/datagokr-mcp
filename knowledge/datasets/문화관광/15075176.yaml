description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 남원문화의거리는 제주 서귀포시 남원읍 해안에 자리한 보행 중심 거리로, 바다 전망을 따라 이어지는 카페·음식점·소규모 상점·갤러리 등이 조화롭게 배치되어 지역의 생활문화와 관광 요소가 결합된 해안 문화 공간이며, 이동이 비교적 수월하고 곳곳에 바다 조망 공간과 휴식용 벤치, 안전 시설물 등이 배치되어 해안 풍경 감상과 산책이 자연스럽게 이루어지도록 구성되어 있다. 또한 접근이 편리한 공영주차장, 보행자 우선 구간, 무단차 출입로 등의 편의 요소가 제공되어 무장애 관광지로서 기능하며, 지역 주민과 방문객이 함께 이용하는 열린 생활형 거리로서 식사, 산책, 소규모 문화 체험, 근처 관광지와의 연계 방문 등 복합적인 이용이 가능한 접근성 높은 관광 공간이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
