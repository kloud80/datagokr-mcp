summary_user: 국내외 글로벌 콘텐츠 플랫폼 기업별로 회사명·업종·설립일·상장여부·시가총액, 주요 서비스와 서비스 국가·단말, 가입자·사용자 수, 히트 IP, 한국 비즈니스 사례 등을 한 행에 정리한 기업 프로필 파일이다. 해외 진출을 준비하는 콘텐츠 사업자나 분석가가 '특정 국가에서 어떤 플랫폼이 어떤 서비스로 얼마나 많은 이용자를 확보했고 한국 기업과 어떤 사례가 있었나'를 확인하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 회사명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 한국콘텐츠진흥원에서 제공하는 글로벌 플랫폼 기업 정보에 관한 자료입니다. 이 데이터는 국내외 다양한 글로벌 플랫폼 기업에 대한 포괄적인 정보를 담고 있습니다. 제공되는 정보에는 구독자 수, 세부장르 구성, 수익구조, 자체콘텐츠 보유 여부, 등재가이드, 계약사항 등이 있습니다. 이러한 정보를 통해 기업의 현황과 동향을 이해하는 데 도움이 될 수 있습니다. 이 데이터는 연구자, 기업 관계자 및 정책 입안자들이 활용하여 글로벌 플랫폼 시장에 대한 분석 및 경쟁력 강화를 위한 전략적 결정을 내리는데 유용합니다. 또한, 해당 데이터는 다양한 학술 연구와 산업 분석에 기초 자료로 사용될 수 있습니다. 예를 들어, 특정 기업의 현황 및 특성을 분석하거나, 플랫폼 산업에 대한 정책 수립 시 참고 자료로 활용할 수 있습니다. 이를 통해 국내 콘텐츠 산업의 발전 및 글로벌 진출 전략 수립에 기여할 수 있는 중요한 정보로 여겨집니다.
