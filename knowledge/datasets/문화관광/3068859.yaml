summary_user: 경상북도교육청 구미도서관이 이용자 신청을 받아 구입한 희망도서를 한 권(건)씩 서명·저자·출판사·출판년·정가·수량·합계 금액으로 담은 CSV 파일(약 95KB)이다. 구미 지역 이용자나 도서관 담당자가 어떤 책이 희망도서로 신청·구입됐는지, 구입에 든 금액이 얼마인지 확인하는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어서, 다른 도서관 소장·대출 데이터와는 서명·저자·출판사 이름을 맞춰서만 이어 쓸 수 있다.
