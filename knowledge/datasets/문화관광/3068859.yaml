description_portal: 경상북도교육청 구미도서관의 분기별 희망도서 구입정보를 제공합니다. 도서의 제목(서명), 지은이(저자), 빌행자(출판사), 발행년도(도서의 출판년), 구입 시 금액 등의 정보를 포함합니다. 경상북도교육청 구미도서관의 희망도서는 홈페이지를 통해 이용자가 도서를 신청하고 도서관은 이용자가 신청한 도서를 구입하여 이용자가 원하는 도서를 빠르게 제공하는 서비스이며, 어린이 도서 일반 도서 모두 희망도서 서비스를 운영하고 있습니다. 희망도서 구입 간격은 매주 구입하고 있으며 데이터는 분기별로 제공합니다.
