summary_user: 경상북도교육청 영주선비도서관이 선정한 추천도서를 한 권당 한 행으로 담은 목록 파일로, 분류·서명·저자·출판사·출판년·청구기호가 들어 있다(실측 CSV 약 1.9KB의 작은 파일). 이용자나 교사·학부모가 '이 도서관이 추천한 책은 무엇이고 서가 어디에 있나'를 확인하거나 독서 프로그램용 도서를 고르는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어 다른 도서 데이터와는 서명·저자 이름 대조로만 이을 수 있다.
limits: 실측 컬럼에 ISBN·도서관코드 같은 전역 키가 없어 도서관정보나루 대출·인기도서 데이터와 정확히 매칭하기 어렵다. 파일이 매우 작아 한 시점의 추천 목록 일부만 담았을 수 있으므로 월별 추천 이력 전체로 보지 않는다.
