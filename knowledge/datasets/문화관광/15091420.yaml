summary_user: 인천광역시에 등록된 체육시설업(골프장·자동차 경주장)을 시설 한 곳당 한 행으로 담은 명부 파일로, 유형·시설명·사업자명·소재지·홀수·사업승인일자·등록일자를 담는다(파일 크기 약 1.6KB의 소규모 목록). 인천 안의 골프장이 어디에 몇 홀 규모로 있고 언제 승인·등록됐는지 확인하려는 시민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·사업자명이나 소재지 주소를 매칭해 이어 쓴다.
limits: 인허가번호·사업자번호 같은 공통 키가 실측 컬럼에 없어 LOCALDATA 체육시설업이나 상권 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 범위는 인천광역시이며 등록 체육시설업(골프장·자동차 경주장)만 담아 헬스·당구·체육도장 같은 신고 체육시설업은 없다.
