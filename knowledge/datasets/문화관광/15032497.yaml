description_portal: 성남시 탄천종합운동장에서 운영하는 체육프로그램(시설명,장소, 강좌명,수강시간,수강요일,강습대상, 정원)목록입니다. 성남시 탄천종합운동장은 시민 여러분의 건강 증진과 여가 활동을 지원하기 위해 다양한 체육 프로그램을 운영하고 있는 공공 체육시설입니다. 분당구에 위치한 이 종합운동장은 실내체육관, 수영장, 헬스장, 다목적 운동장, 테니스장, 축구장 등 다양한 체육 시설을 갖추고 있으며, 이러한 인프라를 기반으로 연령별·수준별 맞춤형 프로그램을 제공하고 있습니다. 대부분의 프로그램은 월 단위 또는 분기 단위로 운영되며, 주 2~3회 수업이 일반적입니다.
