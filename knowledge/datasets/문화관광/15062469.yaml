summary_user: 경상남도 내 경기장을 시설 한 곳당 한 행으로 담은 현황 데이터로, 시군구·시설명·소유기관·관리주체, 부지·건축·연면적, 트랙·필드 규격과 바닥재, 관람석 수, 준공연도, 주소·홈페이지를 제공한다. 지역 체육단체나 대회 주최자가 '경남에서 관람석이 일정 규모 이상이고 육상 트랙을 갖춘 경기장이 어디인가'를 찾을 때, 또는 분석가가 시군별 경기장 노후도·규모를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군구명·시설명 매칭이나 도로명·지번주소 지오코딩으로만 잇는다.
