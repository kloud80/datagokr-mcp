summary_user: 경상남도가 지정한 유형문화유산을 한 건씩 담은 목록 파일로, 종목·지정번호·명칭·지정일자·분야·수량/면적·소재지를 개별 유산 단위로 담는다. 연구자나 지역 주민이 '우리 시군에 있는 도 지정 유형문화유산은 무엇이고 언제 지정됐나'를 확인하거나, 분야별 지정 현황을 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 API 등 다른 유산 데이터와는 명칭·지정번호·소재지 주소를 맞춰 이어 써야 한다.
