summary_user: 하남문화재단이 운영하거나 대관한 공연·전시·축제를 행사 한 건씩 담은 파일(CSV, 약 60KB)로, 행사 구분, 제목, 시작·종료일, 관람연령, 티켓 정보, 문의전화, 위도·경도를 담는다. 하남시민이 '이번 달 하남에서 아이와 볼 수 있는 무료 공연이 있나'를 확인하거나, 분석가가 연도별 장르 비중과 문화시설 활용 흐름을 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 행사명·장소명 매칭이나 위도·경도 기반 공간 결합으로만 이어 쓴다.
description_portal: 경기도 하남시의 산하기관인, 하남문화재단이 운영하거나 대관한 공연·전시·축제 내역을 체계적으로 담고 있는 문화행사 정보로, 행사명, 구분명, 시작일자, 종료일자, 관람연령, 티켓정보, 문의전화, 위치좌표, 데이터기준일자 등의 항목으로 구성되어 있습니다. 전체적으로 보면 공연이 가장 큰 비중을 차지하고, 전시와 축제 정보도 함께 포함되어 있어 하남시 문화예술 운영 현황을 한눈에 파악할 수 있습니다. 특히 시민 입장에서는 관람 가능 연령, 유·무료 여부, 문의처, 장소 위치를 확인할 수 있어 실제 이용 편의성이 높고, 행정 측면에서는 연도별 행사 운영 흐름, 문화시설 활용도, 특정 장르 편중 여부 등을 분석하는 기초자료로 활용할 수 있습니다. 또한 하남시의 문화정책 성과 홍보, 문화복지 확대, 생활권 문화 접근성 분석, 향후 공연·전시 기획 방향 수립에도 활용 가치가 높습니다. 다만 관람연령 표기나 경도 값 형식이 일부 서로 다르게 입력된 흔적이 있어, 데이터 표준화를 함께 추진하면 공공데이터 품질과 활용성이 더욱 높아질 수 있습니다.
