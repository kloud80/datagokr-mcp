summary_user: 울산시설공단이 관리하는 시설별로 설치된 야외 운동기구의 종류·수량(종 수)·기구명과 대상지 주소, 위도·경도, 관리기관 연락처, 기준일자를 담은 작은 CSV 파일(약 1,500바이트)입니다. 울산 시민이 집 근처 공원·시설에 어떤 운동기구가 몇 종 있는지 확인하거나, 분석가가 생활체육 시설 분포를 지도에 표시할 때 씁니다. 전역 조인 키는 없어 위도·경도로 다른 공간 데이터와 겹쳐 보거나 시설명·주소를 이름 매핑해 다른 체육시설 목록과 연결합니다.
description_portal: 울산시설공단은 시민들의 건강 증진과 여가 활동을 돕기 위해 설치된 야외 운동기구에 대한 정보를 체계적으로 제공하고 있습니다. 해당 데이터는 공단이 관리하는 각 시설 내 운동기구의 종류와 위치, 수량 등을 포함하고 있어 시민들이 효율적으로 운동 시설을 이용할 수 있도록 돕습니다. 제공 항목은 시설명, 대상지 주소, 운동기구 수(종), 운동기구명, 위도, 경도, 관리기관, 관리기관 연락처, 기준일자 등으로 구성되어 있습니다. 이를 통해 시민들은 거주지 인근에 설치된 운동기구의 종류와 수량을 미리 파악할 수 있으며, 기구의 정확한 위치를 위도 및 경도 정보로 확인할 수 있어 접근성과 활용도가 높습니다. 기준일자는 데이터의 최신성을 확인할 수 있도록 하여 정보의 신뢰성과 활용 가치를 높이고 있습니다.
