description_portal: 광주광역시 남구 관내에 위치한 작은도서관에 대한 정보(도서관명, 소재지, 연락처, 운영시간, 휴관일, 상호대차 가능여부 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 도서관과(☎062-607-2542)에서 제공하며, 연락처와 관리기관(주체)에 개인정보가 포함되어 있는 경우에는 공란 처리하였음을 알려 드립니다.아울러, 현재 해당 데이터는 전국도서관표준데이터(https://www.data.go.kr/data/15013109/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다. ※ 작은도서관은 지역 주민 누구나 손쉽게 책과 자료를 접할 수 있도록 마을 단위에 설치·운영되는 소규모 도서관입니다. 일반적으로 공공도서관보다 규모는 작지만, 장서 대출과 열람 서비스, 독서 모임, 어린이 독서 교육, 문화 프로그램 등 다양한 활동을 제공합니다. 주민 자발적 운영이나 지자체·단체 지원으로 운영되며, 지역 공동체 활성화와 평생학습 기반 조성에 중요한 역할을 합니다. 가까운 생활권 내에서 지식과 문화를 나누는 소통 공간이자 주민 참여형 문화 거점입니다.
