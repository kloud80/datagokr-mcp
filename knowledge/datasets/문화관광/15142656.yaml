summary_user: 광주광역시 남구 관내 작은도서관을 한 곳당 한 행으로 담은 목록 파일로, 도서관명·도로명주소·위도경도, 평일·토요일·공휴일 운영시각과 휴관일, 열람좌석수, 도서·연속간행물·비도서 자료수, 대출가능권수·일수, 건물면적을 담는다. 주민이 집 근처에서 토요일에 문을 여는 작은도서관을 찾거나, 분석가가 남구 안 작은도서관의 분포와 장서 규모를 비교하는 데 쓴다. 전역 조인 키(도서관코드 등)가 없어 다른 도서관 데이터와는 도서관명·주소로 맞추거나 위도·경도로 공간 결합해 잇는다.
limits: 도서관코드 같은 공통 키가 없어 도서관정보나루의 대출·인기도서 데이터와 바로 연결되지 않고, 이름·주소 매칭이 필요하다. 범위는 남구 한 시군구로 한정되며, 포털 설명상 최신 정보는 전국도서관표준데이터에서 통합 관리되므로 이 파일의 데이터기준일자를 확인하고 쓴다.
