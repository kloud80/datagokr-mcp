summary_user: 제주를 찾은 크루즈 관광객의 1인당 지출 경비를 기준 연도와 거주국가별로 집계한 통계로, 1,000달러 미만부터 5,000달러 이상까지 지출 구간별 응답 비율(%)과 평균 지출액(달러)을 담는다. 관광 정책 담당자나 연구자가 '어느 나라 크루즈 관광객이 제주에서 1인당 얼마를 쓰는가'를 비교하거나 크루즈 관광의 지역경제 효과를 추정할 때 쓴다. 관광지점코드나 시군구코드 같은 전역 조인 키가 없어, 다른 관광 통계와는 연도와 거주국가 이름을 맞춰서만 이어 쓴다.
description_portal: 이 데이터셋은 2017년부터 2019년까지 제주를 찾은 크루즈 관광객을 대상으로 1인당 지출한 경비를 항목별로 집계한 통계자료이다. 항목에는 식음료비, 숙박비, 쇼핑비, 교통비, 기타 여행 경비 등이 포함되며, 거주 국가 및 입항 항구에 따라 지출 패턴을 구분할 수 있도록 구성되어 있다. 이를 통해 크루즈 관광객의 소비 구조와 제주 체류 시 지출 규모를 객관적으로 분석할 수 있어, 관광산업 관련 정책 수립, 항만 및 관광 인프라 계획, 관광 수요 예측, 지역경제 유발 효과 평가 등의 기초 자료로 활용 가능하다. 또한 민간 관광업체나 연구기관에서는 외국인 관광 소비 경향, 여행 경비 대비 소비 항목 구성, 제주 관광의 경제적 파급 효과 분석 등에 참고할 수 있는 신뢰성 있는 데이터이다.
