summary_user: 강북구도시관리공단이 운영하는 강북웰빙스포츠센터의 직영 프로그램(수영·헬스·스쿼시·생활체육)별 운영 요일·시간·정원·대상·수강료를 강좌 단위로 담은 CSV 파일(약 13KB)이다. 강북구 주민이 '평일 저녁에 들을 수 있는 수영 강습 수강료가 얼마인가'를 확인하거나, 분석가가 공공 체육시설 프로그램 가격을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·프로그램명(구분) 같은 이름 매칭이나 같은 기관 데이터로만 연결한다.
description_portal: 강북웰빙스포츠센터는 “고객의 건강한 미래를 열어가는 최고의 스포츠 문화 공간”이라는 비전 아래, 강북웰빙스포츠센터는 지역주민의 건강 증진과 행복한 여가생활을 위해 운영되는 종합 스포츠 문화 공간입니다. 주민 누구나 가까운 곳에서 편리하게 운동할 수 있도록 쾌적한 시설과 다양한 체육프로그램을 제공하고 있습니다.센터는 건강한 생활습관 형성과 활기찬 일상에 도움이 될 수 있도록 체계적인 프로그램을 운영하고 있습니다. 또한 남녀노소 누구나 자신의 체력과 운동 목적에 맞는 프로그램을 선택할 수 있어, 부담 없이 운동을 시작하고 꾸준히 이어갈 수 있습니다.특히 수영장은 깨끗한 수질과 철저한 위생관리로 안전하고 쾌적한 환경을 유지하고 있으며, 헬스, 스쿼시, 생활체육 프로그램도 이용자의 건강 증진과 여가활동에 도움이 될 수 있도록 알차게 구성되어 있습니다.강북웰빙스포츠센터는 단순한 운동시설을 넘어, 지역주민이 함께 건강과 활력을 키워가는 생활체육 공간이 되고자 합니다. 앞으로도 더욱 나은 시설관리와 다양한 프로그램 운영, 친절한 서비스로 지역주민 여러분의 건강한 삶과 행복한 일상을 함께하겠습니다.직영 프로그램인 수영, 헬스, 스쿼시, 생활체육 프로그램의 운영 요일, 시간, 수강료를 아래와 같이 안내해드립니다.
