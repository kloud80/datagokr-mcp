summary_user: 인천광역시 영종구(포털 설명상 옛 중구 관내) 체육도장업(태권도장·무도장 등) 시설을 한 곳씩 담은 명부로, 상호·도로명 주소·전화번호·최초등록일자·최근변경일자를 시설 단위로 제공한다. 지역 주민이나 학부모가 근처 체육도장을 찾거나, 분석가가 관내 체육도장의 개업 시점과 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 체육시설업 명부나 상권 데이터와는 주소나 상호를 맞춰 이어 써야 한다.
description_portal: '2025. 8월 8일 기준 정상적으로 영업 중인 인천광역시 중구 관내 체육도장업은 총 49개소입니다.인천광역시 중구 관내 체육도장업의 데이터로 시설명칭, 도로명 주소, 전화번호, 최초 등록일자, 최종 변경일자 등의 데이터를 제공합니다.[데이터 변경 안내]1. 시설 명칭 : 관내 체육도장장업 시설의 상호명2. 시설 도로명 주소 : 시설의 정확한 위치를 파악하기 위한 주소3. 시설 전화번호 : 시설 안내가 필요할 시 연락이 가능한 전화번호4. 최초 등록일자 : 체육도장업으로 신고하여 최초 영업 개시일5. 최종 변경일자 : 대표자, 상호, 면적 등의 변경으로 수정사항이 생긴 기준일'
