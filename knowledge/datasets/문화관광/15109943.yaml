description_portal: 한국수목원정원관리원은 전국 70여 개 수목원의 무장애 편의시설 관련 정보를 포함한 데이터를 공공데이터로 제공합니다. 이 데이터는 각 수목원 내 휠체어 접근 가능 여부, 장애인 전용 공간의 유무, 유아 동반 가족이 함께 사용할 수 있는 가족 공간 제공 여부 등을 항목별로 정리한 자료입니다. 해당 정보는 고령자, 장애인, 영유아를 동반한 관람객 등 이동약자를 위한 편의성 향상과 관광 접근성 확대를 목적으로 수집·공개되었습니다.CSV 형식으로 제공되는 본 데이터는 수목원별 주요 편의시설의 물리적 접근 가능 여부를 체계적으로 제공합니다.주요 항목에는 수목원명, 시설 위치 또는 명칭, 휠체어 접근 가능 여부, 장애인 편의공간 여부, 가족 전용 공간 제공 여부 등이 포함되며, 이용자 중심의 실질적 접근성 향상을 위한 자료로 활용될 수 있습니다. 다양한 기관의 포용적 관광 콘텐츠 개발과 민간 서비스와의 연계에도 적합합니다.본 데이터는 무장애 관광 확대, 사회적 약자에 대한 공공시설 안내 정보 제공, 관광지 환경 개선 등 다방면에서 활용가치가 높습니다.
