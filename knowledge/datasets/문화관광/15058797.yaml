summary_user: 경기도에서 지정된 관광농원을 농원 한 곳당 한 행으로 담으며, 시군명·농원명·대표자명·승인연도·농원면적·주요시설(야영장·낚시터·숙박·영농체험 등)·도로명/지번 주소·WGS84 좌표와 집계년월을 포함한다. 가족 나들이로 숙박이나 영농체험이 되는 경기도 농촌 체험농원을 찾는 사람이나, 시군별 농촌관광 시설 분포를 비교하는 정책 분석가가 쓴다. 전역 조인 키는 없어서 TourAPI 관광지 목록이나 다른 관광사업 데이터와는 시군명·시군코드(SIGUN_CD), 농원명·주소를 매칭해 잇고, 지도 위 겹쳐 보기는 좌표로 한다.
description_portal: 경기도 내 관광농원 지정 현황입니다. 관광농원은 농어촌의 자연자원과 농림수산 생산기반을 이용하여 지역특산물 판매시설, 영농 체험시설, 체육시설, 휴양시설, 숙박시설, 음식 또는 용역을 제공하거나 그 밖에 이에 딸린 시설을 갖추어 이용하게 하는 사업입니다. 농원명, 대표장명, 농원면적 등의 정보를 제공합니다.이 데이터는 경기도 내에서 「관광진흥법」에 따라 지정된 ‘관광농원’의 운영 현황을 정리한 자료로, 농업을 기반으로 한 체험·휴양·숙박 등의 관광서비스를 제공하는 복합형 농촌관광지에 대한 정보를 포함하고 있습니다. 주요 항목에는 집계년월, 시군명, 농원명, 승인연도, 농원면적(㎡), 주요시설정보(야영장, 낚시터, 숙박, 체육시설, 영농체험 등), 소재지(도로명주소 및 지번주소), 우편번호, 위도 및 경도 좌표(WGS84) 등이 포함되어 있습니다.관광농원은 농촌의 자연환경과 전통농업을 관광자원으로 활용하여, 도시민에게 휴양, 체험, 교육, 여가 활동의 기회를 제공함으로써 농외소득을 창출하고, 농촌지역 경제 활성화에 기여하는 것을 목적으로 합니다. 본 데이터는 지역별 농촌관광 인프라 현황 분석, 체험 프로그램 다양성 평가, 농업과 관광의 융합정책 수립, 농촌관광 활성화 사업 타당성 조사, 문화체험 지도 제작 등 다양한 분야에 활용될 수 있습니다. 또한 위도·경도 정보는 GIS 기반 공간분석을 통한 관광농원 분포 시각화에 적합합니다.이 자료는 경기도 및 시군 관광 또는 농정 부서에서 수집한 공공데이터로, 농촌관광 정책 개발 및 지역특화 콘텐츠 확산을 위한 기초 자료로 유용하게 활용됩니다
