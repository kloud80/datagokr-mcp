summary_user: 한국체육산업개발이 2011년부터 진행한 사회공헌·봉사활동 게시글을 건별로 담으며, 등록일·관련 장소·제목·내용 등을 제공하고 포털 설명 기준 2025년 6월 184건이다(전국 범위, 비공간 데이터). 기관의 사회공헌 활동 이력을 살펴보려는 분석가나 국민이 '이 기관이 소외계층 대상으로 어떤 봉사활동을 해 왔나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장소명·제목 같은 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: 한국체육산업개발 사회공헌  목록입니다.봉사활동에 대한 데이터로 등록일, 관련장소, 제목, 내용 , 첨부파일, 홈페이지URL 등 항목을 제공합니다.한국체육산업개발 홈페이지 > 열린경영> 사회공헌 게시판에서 확인이 가능합니다.https://www.ksponco.or.kr/gallery.es?mid=a10505000000&bid=00322025년 6월 기준 184건 제공이 되고 있으며, 2011년 부터 사회 봉사 활동 정보입니다.일산 사랑 나눔 봉사활동, 소외계층 아이스링크장 초청행사, 직거래 장터 물품 구입, 건강관리 서비스 봉사활동 등 정보입니다.
