summary_user: 서울 성동구에서 일반게임제공업(성인게임장·오락실 등)을 인허가받은 업소를 한 건씩 담은 원천 목록으로, 관리번호·인허가일자·취소일자·영업상태·폐업일자·주소·좌표·시설 면적과 층수 등 업소별 행정·시설 정보가 들어 있다. 구청 담당자나 분석가가 성동구 안에서 현재 영업 중인 게임장이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 성인게임장, 오락실 등 청소년이용불가 게임물과 전체이용가 게임물을 설치·운영하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 게임장 및 오락실 업종은 연령대별 이용 등급, 건전한 여가문화 조성, 청소년 보호 및 안전한 운영 환경 마련이 중요한 이슈로 인식되고 있어, 관련 업소의 인허가 및 행정 관리 이력이 매우 중요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 인허가 내역, 영업 개시 및 종료, 영업상태 등 주요 행정 정보가 포함되어 있어 투명한 관리가 가능합니다. 성동구청 등 관할 행정기관이 정기적으로 점검과 자료 갱신을 실시하여 데이터의 신뢰성과 최신성을 높이고 있습니다. 본 데이터는 게임장 업계 현황 분석, 청소년 보호 정책 수립, 시장 동향 모니터링, 소비자 정보 제공, 건전한 오락문화 조성 등 다양한 분야에서 활용될 수 있으며, 업계, 행정기관, 연구자, 시민 모두가 활용할 수 있는 신뢰성 높은 자료입니다. 데이터는 정기적으로 최신화됩니다.
