description_portal: 이 데이터는 온라인면세점에서 관리자가 기획전을 구성할 때, 해당 기획전에 포함될 상품 또는 사은품을 매핑하고 조건 설정을 하기 위해 생성하는 ‘기획전앵커’ 관련 정보입니다. 총 648건의 데이터로 구성되어 있으며, 주요 항목은 기획전앵커아이디, 기획전아이디, 기획전이름, 정렬순서, 사용여부, 등록일시, 수정일시 등입니다. 기획전앵커는 기획전 내 콘텐츠를 구역별로 나누어 구성할 수 있는 구조적 요소로, 이를 통해 다양한 상품군을 효과적으로 배치하고, 사용자에게 더 나은 쇼핑 경험을 제공할 수 있습니다. 이 데이터를 활용하면 기획전 내 콘텐츠 구성 방식 분석, 사용자 반응 기반 앵커 효과 측정, 상품 매핑의 효율성 개선 등이 가능하며, 전시 전략 수립과 마케팅 퍼포먼스 향상에도 도움이 됩니다. 또한 기획전 설계 시 반복적으로 활용 가능한 구조로서, 운영 효율성과 관리 편의성 제고에도 기여합니다.
