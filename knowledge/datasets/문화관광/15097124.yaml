summary_user: 제주시 애월읍 상가리 퐁낭마을길 무장애 여행코스를 지점(포인트) 단위로 순서·위도·경도·구분·설명·상세정보와 함께 담은 코스 데이터로, 전체코스·추천코스 여부가 표시된다. 휠체어 이용자나 교통약자를 위한 여행 상품을 만드는 사업자가 '이 마을길에서 어느 지점을 어떤 순서로 돌면 접근 가능한가'를 확인하는 데 쓴다. 전역 조인 키는 없어 TourAPI 관광지 등 다른 데이터와는 위도·경도나 지점 이름으로 맞춰 이어 써야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_상가리퐁낭마을길_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 제주시 애월읍 상가리 일대의 ‘퐁낭마을길’을 중심으로 구성된 무장애 여행 코스 정보를 제공한다. 해당 구간은 마을 산책로와 자연 경관을 따라 이동하는 보행 중심 코스로, 교통약자 및 휠체어 이용자의 이동 편의를 고려해 접근 가능한 동선, 휴식 공간, 전망 포인트, 편의시설 현황 등이 포함되어 있다. 또한 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 현장 기반 요소가 반영되어 있으며, 무장애 관광환경 조성, 열린관광지 개발, 관광 서비스 품질 개선 및 공공정책 수립을 위한 기초자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
