description_portal: '인천서구시설관리공단 서구구립도서관 사서 추천 도서, 사서의 서재는 서구구립도서관 장서 담당자의 선정 과정 및 지역 주민과 교감할 수 있는 주제에 대해 효과적으로 전달할 수 있는 사서 추천 도서 발행지명으로 2019년부터 발간한 서구 구립도서관 사서 추천도서 브랜드입니다. 계층별, 주제별 권장도서를 선정하여 도서 목록 및 정보(서명, 저자, 출판사 등)을 제공합니다.- 계층 구분 : 유아, 아동, 청소년, 성인 등 언어 및 사회성 발달에 따른 4개 계층으로 구분- 주제 선정 : 대중 주요 관심사 및 사회적 메시지를 담은 5~6개 키워드 선정- 선정기준 : 작품성, 확장성, 균형성, 시기성, 창작성- 기대효과1. 연령별, 주제별 추천도서 전시 및 목록 배포를 통해 이용자의 독서 접근성을 향상 시키고 도서관 이용 활성화2. 도서관에서 제공하는 다양한 자료를 쉽게 접할 수 있도록 도와주는 가이드 역할 수행3. 사서 역량을 활용한 주기적인 추천도서 목록 제공으로 사서 전문성 강화 및 주민 신뢰도 향상'
