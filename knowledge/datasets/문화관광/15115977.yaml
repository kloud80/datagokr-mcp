summary_user: 서울특별시 중구에서 주택을 이용해 외국인 관광객에게 숙식을 제공하는 외국인관광도시민박업 업소를 업소별로 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(등록·취소 등)·소재지 주소·중부원점TM 좌표·객실 수 등을 담는다. 중구에서 홈스테이·공유숙박 창업을 준비하는 예비 사업자가 '현재 영업 중인 등록 민박이 어느 동에 얼마나 몰려 있나'를 확인하거나, 관광객이 등록된 합법 업소인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 같은 이름 매칭이나 같은 기관(자치단체) 코드로만 연결한다.
description_portal: '서울특별시 중구의 도시 지역의 주민이 거주하고 있는 주택을 이용하여 외국인 관광객에게 한국의 가정 문화를 체험 할 수 있도록 숙식 등의 서비스를 제공하는 업소 정보입니다. 데이터는 각 등록업체에 부여된  관리번호, 현재의 운영 상태(등록, 취소 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 공유숙박 및 홈스테이 관련 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 외국인 관광객과 문화체험에 관심 있는 시민들에게는 법적 운영기준을 충족하며 관광진흥에 기여하는 신뢰할 수 있는 등록업체의 위치와 숙소 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
