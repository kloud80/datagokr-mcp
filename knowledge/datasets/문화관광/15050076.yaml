description_portal: 전라남도 해남군 문화예술회관 연간일정에 대한 데이터입니다.이 데이터에는 제목, 장르, 기간, 장소 항목을 제공합니다.해남문화예술회관은 다양한 문화의 생산과 공급자로서의 역할을 충실히 하기 위해 접근성이 용이하고 지역 주민이 이용하기에 편리한 위치인 군청 옆에 자리 잡았다. 문화예술회관의 안내를 담당하는 안내실과 연극·콘서트 연주회 등 대규모 공연과 행사를 진행하는 대공연장, 그리고 발표회·세미나 등 소규모 공연이 진행되는 다목적실로 구성되어 있다. 문화예술회관의 업무와 행사 대관 및 공연 예매의 안내를 담당함
