summary_user: 경기도 부천시에 관광진흥법에 따라 등록·지정된 관광사업체(관광숙박업, 외국인관광 도시민박업, 여행업, 국제회의기획업)를 업체 한 곳당 한 행으로 담고, 업종 유형·상호명·소재지를 제공하는 시군구 단위 CSV 파일이다. 부천에서 등록된 여행사나 외국인관광 도시민박업소가 어디에 몇 곳 있는지 확인하려는 시민·관광객·사업자, 업종별 분포를 보려는 분석가가 쓴다. 실측 컬럼에 등록번호나 사업자번호 같은 전역 조인 키가 없어서, 다른 관광사업체·숙박업 데이터와는 상호명과 소재지 주소를 맞춰 잇는다.
