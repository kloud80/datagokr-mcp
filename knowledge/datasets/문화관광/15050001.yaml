summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU)에서 이용자가 콘텐츠를 추천할 때마다 쌓인 건별 추천 기록으로, 콘텐츠명과 등록일시 두 항목만 담은 CSV 파일(약 43만 바이트)이다. 비짓제주 이용자가 어떤 관광지·콘텐츠를 많이 추천했는지, 시기별로 추천이 어떻게 달라지는지 알고 싶은 관광 마케팅 담당자나 분석가가 쓴다. 공통 조인 키가 없어 TourAPI 콘텐츠ID 등과 바로 이어지지 않으며, 콘텐츠명을 이름으로 맞춰 비짓제주의 다른 콘텐츠 데이터나 관광지 목록과 연결해야 한다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 관광 데이터와의 연결은 콘텐츠명 문자열 매칭에 의존한다. 범위가 전국·비공간으로 분류돼 있으나 실제 내용은 비짓제주 플랫폼 내 추천에 한정되며, 위치나 이용자 정보는 담지 않는다.
