description_portal: 이 데이터는 문학광장에서 보유하고 있는 근대문학총서 자료로, 한국 현대문학의 흐름과 잡지문학의 발간 이력을 체계적으로 파악할 수 있는 귀중한 문헌 정보입니다. 각 항목은 제목, 작품소개, 장르, 작가명으로 구성되어 있으며, 제목은 ‘한국산문 2013년도 10월호’처럼 특정 연도와 호수 정보를 포함하여 연대별 정리와 검색이 용이합니다. 장르 항목은 한국산문, 포지션, 시와세계, 시인동네, 현대시, 21세기문학, 시와사상, 시문학, 한국수필, 소설, 현대시학, 서정시학, 한국희곡, 시인수첩, 아동문예, 아동문학평론, 에세이문학, 시조문학, 인디고잉, 아시아, 발견, 딩아돌하, 시로여는세상, 미스터리, 어린이책이야기, 솟대문학, 문예중앙 등 매우 다양한 문예지 및 문학 장르로 구성되어 있어 문학사적 흐름을 종합적으로 조망할 수 있습니다. 작품소개 항목을 통해 각 작품의 내용이나 의의도 확인할 수 있으며, 작가명 항목은 주요 작가군의 활동 시기 및 장르별 분포 등을 분석하는 데 유용하게 활용될 수 있습니다.
