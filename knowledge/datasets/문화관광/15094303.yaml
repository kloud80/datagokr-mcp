summary_user: 국립무형유산원이 발간한 무형유산 기록화 디지털 보고서를 한 건씩 담은 목록으로, 자료명(nihcItmNm)·썸네일·열람 페이지 주소·작성자·발간연도·저작권/이용조건·키워드를 제공하며 범위는 전국·비공간이다. 연구자나 교육·콘텐츠 기획자가 '특정 종목이나 키워드에 관한 무형유산 기록화 보고서가 어느 해에 나왔고 어디서 원문을 열람하나'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 무형유산 데이터와는 종목명·키워드 같은 이름 매칭이나 같은 기관 자료끼리로만 이어 쓴다.
description_portal: 입력 파라미터를 이용하여 무형유산 기록화 디지털 보고서 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형유산 디지털 보고서 목록 조회 서비스는 무형문화유산의 보존, 전승, 활용을 위한 디지털 자료를 체계적으로 열람할 수 있는 온라인 플랫폼입니다. 이 서비스는 무형유산의 기록화, 보존처리, 전승 교육, 디지털 콘텐츠 개발 등 다양한 분야의 보고서와 자료를 포함하고 있습니다. 이 플랫폼은 웹 기반으로 제공되며, 사용자는 주제별, 연도별, 분야별 등 다양한 기준으로 검색하고 필터링하여 원하는 자료를 손쉽게 찾을 수 있습니다. 이는 연구자, 교육자, 문화기획자, 일반 관람객 등 다양한 이용자가 무형문화유산의 보존 및 활용에 필요한 정보를 효율적으로 접근할 수 있도록 지원합니다.이러한 디지털 보고서들은 무형유산의 전승과 보존을 위한 정책 수립, 교육 콘텐츠 개발, 디지털 전시 및 체험 콘텐츠 제작 등 다양한 분야에서 활용될 수 있는 중요한 자료로 활용됩니다.
