summary_user: 경기도 화성시에 인허가된 일반게임제공업소를 업소 한 곳당 한 행으로 담은 건별 파일(CSV 약 59KB)로, 사업장명·도로명/지번주소·인허가일자·영업상태·폐업일자·제공게임물명·총게임기수·좌표 등을 포함한다. 화성시 안에서 지금 영업 중인 게임장이 어느 동네에 몰려 있는지, 언제 문을 열고 닫았는지를 확인하려는 주민·창업자·행정 분석가가 쓴다. 전역 조인 키는 없으므로 주소나 좌표(X·Y)로 위치를 맞추거나, 업소명·영업상태 같은 이름 기준으로 다른 시군의 같은 업종 현황과 이어 쓴다.
description_portal: 데이터는 경기도 화성시 관내에 등록된 일반게임제공업소의 현황을 정리한 자료로, 지역 내 여가 및 오락시설 운영 실태를 파악하는 데 활용된다. 일반게임제공업은 게임 기기를 이용한 오락을 제공하는 업종으로, 해당 데이터는 업소명, 영업장 소재지, 허가일자 등의 정보를 포함하고 있다. 본 자료는 문화산업 관련 정책 수립, 업종별 분포 분석, 지역경제 영향 평가 등 다양한 행정 목적에 기초자료로 활용될 수 있다. 또한 게임업계 동향 파악, 업소 밀집 지역 분석, 민원 대응 및 지도점검에도 활용도가 높다. 화성시는 본 데이터를 통해 건전한 여가문화 조성 및 업소 관리의 효율성을 제고하고자 한다.
