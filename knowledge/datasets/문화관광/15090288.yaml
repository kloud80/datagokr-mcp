summary_user: 빅카인즈에 수록된 국내 신문·방송의 실업 관련 기사를 기사 한 건 단위로 담은 메타데이터 파일(CSV, 약 50MB)로, 일자·언론사·제목·통합 분류·키워드·특성추출 정보를 포함한다. 연구자나 정책 담당자가 '청년 실업이나 일자리 정책이 언론에서 언제, 어떤 키워드로 많이 다뤄졌는가'처럼 시기별 보도 경향과 이슈 변화를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자나 키워드 같은 이름 기준으로 맞춰 붙여야 하며, 고용 통계 등과는 시기별로 묶어 비교하는 방식으로 이어 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 실업 관련 뉴스 분석 메타정보 자료입니다. 실업은 경기 침체, 산업 구조 변화, 노동 시장 불균형 등 다양한 요인에 의해 발생하며, 개인의 삶뿐 아니라 사회 전반에 큰 영향을 미치는 핵심 경제·사회 문제입니다. 본 자료는 국내 주요 신문과 방송 보도에서 실업과 관련된 기사들을 수집·분석해 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 이슈 변화를 파악할 수 있도록 구성되었습니다. 이를 통해 청년 실업, 장기 실업, 일자리 정책, 사회 안전망 구축 등 다양한 주제가 언론 담론에서 어떻게 다루어졌는지를 확인할 수 있습니다. 또한 연구자, 정책 입안자, 언론인, 교육 관계자들이 실업 문제의 구조적 원인과 사회적 대응 방안을 탐색하는 데 활용할 수 있는 기초 자료로서 의미가 큽니다.
