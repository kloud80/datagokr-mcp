summary_user: 대구광역시 달성군 안의 시지정문화재를 한 건씩 담은 목록 파일로, 문화재 종별·명칭·수량·소유자·소재지·지정일자를 담는다(약 3KB 규모의 CSV). 달성군에 어떤 시지정문화재가 어디에 있고 언제 지정됐는지 확인하려는 주민·문화관광 자료 담당자·지역 유산 분석가가 쓴다. 국가유산청 종목코드·지정번호 같은 전역 조인 키가 없어서, 국가유산청 유산 목록 등 다른 데이터와는 명칭·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 달성군 내 시지정문화재의 현황 정보를 담고 있으며, 문화재의 종류, 명칭, 수량, 소유자, 소재지, 지정일자 등의 항목을 포함합니다. 해당 자료는 지역 문화유산 관리, 보존 정책 수립, 문화관광 자료 구축 등에 활용될 수 있습니다.
