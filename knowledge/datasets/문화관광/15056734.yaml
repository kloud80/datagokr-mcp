summary_user: 경기도 시군별 체육회 한 곳당 한 행으로 시군명, 도로명·지번 주소, 우편번호, 전화·팩스번호, 홈페이지 주소, WGS84 위도·경도를 담은 기관 목록 데이터로, 범위는 경기도 내 시군 단위이다. 주민이 우리 시 체육회의 연락처와 홈페이지를 찾거나, 분석가가 도내 체육회 위치를 지도에 올려 지역별 분포를 볼 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 시군명으로 다른 경기도 시군 데이터와 맞추고, 위경도 좌표로 체육시설 위치 데이터와 공간 결합한다.
description_portal: 경기도 시군별 체육회 현황 데이터는 도내 각 시군에서 운영되는 체육회의 정보를 담고 있으며, 시군명, 도로명 및 지번 주소, 우편번호, 전화번호, 팩스번호, 홈페이지 주소, WGS84 위도·경도 좌표 등의 항목으로 구성되어 있습니다. 이 데이터는 경기도 내 체육 행정 조직의 분포를 한눈에 파악할 수 있도록 제공되며, 체육회별 위치 정보와 함께 온라인 접속 경로(홈페이지)를 포함하고 있어 주민들의 체육 활동 참여 및 기관 접근성 향상에 도움이 됩니다. 또한 GIS 기반 분석을 통해 지역별 체육회 분포와 접근성을 평가할 수 있으며, 체육시설 정책 수립, 생활체육 활성화, 지역 스포츠 자원 관리 등 다양한 분야에서 기초 자료로 활용 가능합니다.
