summary_user: 서울 은평구에서 안전성 검사 대상 놀이기구를 한 종류 이상 설치해 운영하는 일반유원시설업 업소를 한 행에 한 곳씩 담은 인허가 원장으로, 인허가일·폐업일·영업상태, 소재지 주소, 중부원점TM 좌표, 놀이시설 수·시설면적, 보험 기간 등을 담는다. 은평구에서 지금 영업 중인 놀이시설·키즈 체험시설이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 연결한다.
description_portal: '은평구의 테마파크 등 안전성 검사대상의 놀이기구를 한 종류 이상 설치하여 운영하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.본 데이터는 은평구 내 일반유원시설업(놀이시설 등)의 등록 현황을 포함하며, 놀이공원, 어린이 실내체험장, 테마 공간 등 다양한 시설들의 업소명, 위치, 등록일, 운영 형태 등의 정보를 제공합니다. 유원시설업은 주로 어린이와 가족 단위의 여가 활동을 제공하는 공간으로, 이용자 안전이 매우 중요한 산업입니다. 본 정보는 놀이기구 안전검사 이력, 재난 예방 점검, 시설관리 인력 정보 등과 연계되어 아동안전 정책, 실내오락시설 위생관리, 감염병 확산 방지 등 다양한 행정업무의 기초자료로 활용됩니다. 또한 놀이시설의 분포는 도시 내 여가공간 불균형 해소, 가족 중심 여가정책 수립, 지역기반 놀이문화 확산 등과도 맞물려 있으며, 소득별·연령대별 체험 기회의 형평성 확보 측면에서도 중요합니다. 최근에는 키즈카페, AR체험형 유원시설 등 신개념 놀이공간이 등장하며, 정책 유연성이 더욱 요구되는 분야이기도 합니다.'
