description_portal: '전북특별자치도 전주시 노래연습장은 제공하며  연번, 업종, 사업장명, 인허가일자, 도로명주소, 지번주소, 위도, 경도, 전화번호, 시설면적, 노래방실수, 청소년실수, 비상계단여부, 비상구여부, 자동환기여부, 청소년실여부, 특수조명여부, 방음시설여부 등을 제공합니다.제공부서 : 전주시 여성가족과(양구청)전주시 관내에서 현재 영업 중인 노래연습장에 대한 현황 자료를 다음과 같이 제공합니다.따라서, 정보제공의 목적이 영업정보의 공개를 통한 건전한 여가문화 조성과 지역 현황 파악 등 공익적 목적임을 감안하여, 아래와 같이 해당 업소의 상호명, 영업소재지 도로명주소, 영업소재지 지번주소 등을 포함한 기본 현황을 안내드립니다.아울러, 본 자료는 2026.7. 10. 집계된 정보로서, 이후 폐업, 변경신고 등의 사유로 실제 현황과 다소 차이가 있을 수 있으므로, 참고용으로만 활용해 주시기 바랍니다.'
