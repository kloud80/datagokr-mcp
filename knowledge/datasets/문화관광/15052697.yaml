description_portal: 대한체육회의 경기인등록 시스템에 각 회원종목단체 별로 등록되어 있는 팀 정보를 제공합니다.이 데이터는 각 팀의  팀명과 등록년도, 그리고 등록일 정보를 포함합니다. 또한 팀의 종목, 세부종목을 명시하고, 종별과 종별구분, 소속구분, 시도 정보를 제공합니다.관련 정보를 확인할 수 있는 웹주소도 함께 제공됩니다. 해당 주소를 통해 접속하면 등록년도, 종목, 시도 등을 선택하여 통계정보를 확인 할 수 있습니다. 좀 더 세부적인 팀 정보가 필요한 경우에는 각 팀이 소속된 회원종목단체로 문의하셔야 합니다.
