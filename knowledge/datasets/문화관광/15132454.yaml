description_portal: ‘한국학중앙연구원_고문서 소장처별 보유 자료 통계 정보’ 데이터는 한국학중앙연구원 산하 한국고문서자료관에서 관리하는 고문서 자료를 소장처별로 분류하고, 각 소장처가 보유한 고문서 건수를 정리한 통계 자료입니다. 데이터는 상위코드, 코드, 소장처명, 보유자료건수로 구성되어 있으며, 고문서가 어느 기관이나 가문, 단체 등에 집중되어 있는지를 파악할 수 있도록 합니다.이 데이터를 통해 고문서의 소장처 분포 및 수량을 한눈에 파악할 수 있으며, 문헌 자료의 지역적·기관적 집중도 분석, 보존정책 수립, 연구 대상 선정 등 다양한 활용이 가능합니다. 또한 자료관리 체계를 이해하고, 고문서의 접근성과 관리방식 개선을 위한 기반 자료로 활용될 수 있는 실용적인 공공데이터입니다.
