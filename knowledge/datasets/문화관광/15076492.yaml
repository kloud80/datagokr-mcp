description_portal: 2003년 문예연감의 공연예술 관련 정보입니다. 총 23개의 시트로 구성되어 있습니다. 각 시트 항목에는 양악 작곡 발표회, 양악 독주회,  양악 관현악 연주회, 양악 실내악 연주회, 양악 독창회, 양악 합창 연주회, 양악 기타 성악 연주회, 양악 오페라 연주회, 양악 기타(종합) 연주회, 양악 교육단체 연주회, 양악 주요 내한 외국인연주단 및 솔리스트 현황, 양악 주요 해외공연, 양악 국내 음악콩쿠르  등의 항목으로 구성되어 있습니다.양악 주요 내한 외국인연주단 및 솔리스트 현황 항목은 일자, 이름, 부문, 연주회명, 장소, 비고로 구성되어 있습니다. 따라서 파일에서 2003년 문예연감의 공연예술 관련 정보를 확인할 수 있습니다.
