summary_user: 올림픽공원 평화의광장에서 운영한 스케이트장의 공지·이벤트 게시글을 건별로 담으며, 포털 설명상 2019년부터 2021시즌까지 운영하며 올린 11건(강습 일정, 개장식, 일일입장, 연휴 일정, 운영 중단, 환불 규정, 운영 종료 등)이다. 시민이나 분석가가 '올림픽공원 스케이트장이 언제 개장·종료했고 환불·운영 중단 공지는 어떻게 나갔나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·장소명 같은 이름 매핑이나 같은 기관(한국체육산업개발) 기준으로만 이어 쓴다.
description_portal: 서울 송파구에 위치한 올림픽공원내 평화의광장에서 운영하고 있는 스케이트장에 대한 공지와 이벤트정보를 제공하고 있습니다. 스케이트장소명, 제목, 기간, 시간, 게시일 등 자세한 정보제공하고 있으며2019년부터 2021시즌까지 운영하였으며, 향후에 다시 운영하게 되면 공지를 계속적으로 업데이트 할 예정입니다.스케이트강습일정, 개장식, 일일입장, 연휴 일정,  운영 중단, 환불 규정, 운영종료  등 다양한 공지 및 이벤트에 대해서 정보를 제공하고있습니다.2년정도 스케이트장을 운영해서 11건의 게시글을 공개하고 있습니다.
