summary_user: 경기도 내 관광호텔의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자, 양실·한실 객실 수, 소재지 면적, 도로명·지번 주소와 WGS84 좌표를 포함한다. 분석가가 경기도 시군별로 영업 중인 관광호텔이 몇 곳이고 객실 규모가 어느 정도인지 파악해 관광객 수용능력을 비교할 때 쓴다. 전역 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)이나 주소·좌표로 경기도의 다른 숙박업종 현황(일반호텔·여관 등)이나 시군 단위 통계와 이름·코드를 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내 관광호텔의 인허가 현황을 제공하며, 관광호텔은 손님이 머물며 숙박할 수 있도록 객실과 부대시설을 운영하는 숙박업 형태로, 일반호텔과 달리 관광 목적에 적합한 기준에 따라 분류된 시설입니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘위생업종명’, ‘위생업태명’, ‘건물소유구분명’, ‘양실수’, ‘한실수’, ‘소재지면적’, ‘다중이용업소여부’, ‘우편번호’, ‘WGS84 위도·경도’ 등이 포함됩니다. 이를 통해 관광호텔의 위치, 영업 상태, 객실 유형, 위생 및 안전 관리 현황을 확인할 수 있으며, 경기도 31개 시군 단위의 관광 숙박 인프라를 비교·분석할 수 있습니다. 데이터는 관광객 수용능력 평가, 지역 관광산업 활성화 정책 수립, 숙박 품질 관리 및 안전 점검 자료로 활용될 수 있습니다. 또한 일반호텔, 여관, 여인숙 등 다른 숙박업종과 비교하여 관광 숙박산업의 특성과 발전 방향을 도출하는 데 기초자료로 유용합니다.
