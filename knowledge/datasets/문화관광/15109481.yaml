summary_user: 경주시 전통 고택에서 운영하는 체험 프로그램 정보를 고택 한 곳당 한 건으로 담으며, 고택명·전화번호·입장 시작·종료 시간·주소·홈페이지가 들어 있고 범위는 경주시 한 개 시군구다. 경주 여행객이나 체험관광 상품을 기획하는 사업자가 '경주에서 고택 체험을 할 수 있는 곳은 어디이고 몇 시까지 들어갈 수 있나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 고택명이나 주소(ADRES)를 문자열로 맞춰 연결해야 한다.
description_portal: 본 오픈API는 경주시의 전통 고택에서 운영되는 체험 프로그램 정보를 REST 형식으로 제공한다. 고택별로 명칭, 위치, 체험 내용, 운영 시간, 숙박 여부, 연락처, 예약 가능 여부 등 다양한 정보가 포함되어 있으며, 이용자가 전통문화를 직접 체험하고 지역 고유의 정취를 느낄 수 있도록 구성되어 있다. 해당 데이터는 역사문화 콘텐츠 개발, 체험 관광 상품 기획, 숙박형 체험 홍보 등 다양한 분야에 활용 가능하다. 또한 외부 시스템과 연계하여 사용자 위치 기반 추천, 예약 서비스 연동 등 실질적인 활용도를 높일 수 있다. 표준화된 데이터 구조로 제공되며, 공공데이터포털을 통해 누구나 무료로 접근 및 조회가 가능한 공공서비스 데이터이다.
