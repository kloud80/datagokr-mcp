description_portal: '○ 통계개요* 통계명 : 한국여행 중 서울지역 방문지(성별/연령/방한목적/방한횟수)* 통계종류 : 일반통계, 조사통계* 작성목적 : 외래관광객의 한국여행 성향을 파악하고 연도별 변화추이를비교·분석함으로써 외래관광객 유치 증대 및 향후 관광수용태세개선을 위한 관광정책 수립의 기초 자료로 활용* 조사대상 : 한국을 방문한 후 출국하는 외국 국적의 여행객* 조사방법 : 조사대상 응답자가 직접 설문지를 통해 작성하는 자기기입식 방식* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 서울지역 방문지 중 상위지역 방문 비율○ 용어설명* 외래관광객: 사업, 여가 및 기타 개인적 목적 등 특정 목적을 위해 평상시의 생활환경 밖에 있는 주 목적지로여행을 가는 외국인 여행객. 단, 체류자격 상 관광 목적 외국인 여행객이라 보기 어려운 한국국적외국인, 국내 관광 없는 환승자, 관광 목적 아닌 자(기장, 승무원, 군인, 보따리상), 응답이 어려운만 15세 미만의 여행객은 제외'
