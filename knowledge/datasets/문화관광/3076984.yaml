summary_user: 전라남도 순천시가 정리한 맛집 목록으로, 업소 한 곳당 한 행에 업소명·읍면동·소재지 주소·전화번호를 담은 CSV 파일(약 4KB, 포털 설명상 78곳)이다. 순천을 찾는 관광객이나 지역 안내 서비스 운영자가 "순천 어느 동네에 어떤 추천 맛집이 있고 연락처는 무엇인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명이나 읍면동·주소 문자열을 맞춰 연결해야 하고, TourAPI 음식점 콘텐츠와 이어 쓸 때도 이름·주소 매칭이 필요하다.
description_portal: 전라남도 순천시의 맛집 현황 정보입니다. 78개의 맛집들에 대한 업소명, 읍면동, 소재지, 전화번호 항목을 제공합니다.전라남도 순천시의 '맛집 현황' 데이터는 순천시 내에서 인기 있는 음식점들의 정보를 제공합니다. 이 데이터는 업소명, 주소, 전화번호, 영업시간 등 다양한 항목으로 구성되어 있으며, 공공데이터포털을 통해 공개되고 있습니다. CSV 형식으로 제공되어 다운로드 및 활용이 용이하며, 업체들의 지리적 분포와 연락처를 통해 지역 내 맛집의 현황을 파악할 수 있습니다. 이 데이터는 관광객들에게 지역 맛집을 소개하거나, 지역 음식 산업의 현황을 분석하는 데 유용하게 활용될 수 있습니다. 업데이트 주기는 수시로 이루어지며, 최신 정보는 공공데이터포털에서 확인 가능합니다.
