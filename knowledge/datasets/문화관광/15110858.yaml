summary_user: 경상남도 남해군 내 음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·업종·업태·도로명/지번 주소·위도·경도·전화번호·인허가일자와 모범음식점 지정 여부·지정일자를 포함한다(포털 설명상 2022년 12월 16일 기준, 국·영·중·일 4개 국어 제공). 남해를 찾는 국내외 방문객이나 관광 서비스 개발자가 '남해군에서 모범음식점으로 지정된 횟집은 어디이고 연락처는 무엇인가' 같은 질문에 쓴다. 전역 조인 키는 없어 TourAPI 콘텐츠 등 다른 관광 데이터와는 업소명·주소 매칭이나 위도·경도 기반 공간 결합으로 이어 쓴다.
description_portal: 본 데이터는 2022년 12월 16일 기준으로 경상남도 남해군 내 다양한 음식점의 종합 정보를 제공하여, 국내외 방문객 및 지역 주민의 식도락 편의 증진과 지역 외식 산업 활성화를 목표로 합니다. 각 음식점별 공식 "업소명", 정확한 소재지 파악을 위한 "도로명주소", 그리고 예약 및 각종 문의에 필요한 "전화번호" 등 필수적인 정보를 상세히 포함하고 있습니다. 특히, 본 자료는 국문뿐만 아니라 영문, 중문, 일문 등 총 4개 국어로 주요 정보를 제공함으로써 다양한 국적의 방문객들이 남해군의 풍부한 먹거리를 보다 쉽게 탐색하고 접근할 수 있도록 지원합니다.
