description_portal: 서울특별시 광진구_음반음악영상물배급업 인허가 정보는 광진구 관내에서 음반, 음악파일(MP3 등), 음악이 수록된 영상물(DVD 등) 또는 음악영상파일을 배급하는 업소의 인허가 현황을 제공하는 데이터입니다. 배급업은 음반이나 영상물 등을 수입하거나 해당 저작권을 소유 및 관리하면서 이를 음악소매업자, 음반음악영상물판매업자, 또는 온라인 음악 서비스 제공업자 등에게 공급하는 사업을 포함합니다. 본 데이터에는 업소명, 소재지, 인허가 일자, 영업상태, 업종 유형 등 주요 항목이 포함되어 있으며, 음악 및 영상 콘텐츠 유통 현황 분석, 콘텐츠 산업 정책 수립, 저작권 유통관리 등에 활용될 수 있습니다. 좌표는 중부원점TM(EPSG:2097) 기준의 위치 정보가 제공되며 위도/경도 정보는 미포함됩니다. 제공되는 데이터는 수집일 기준 3일 전 자료를 반영합니다.
