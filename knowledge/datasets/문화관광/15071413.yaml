summary_user: 인천 미추홀구 관내에 신고된 체육시설을 시설 한 곳당 한 행으로 담은 파일로, 상호명·업종 구분(수영장업·체육도장업 등)·도로명/지번 주소·전화번호·위도·경도를 수록한다. 주민이 동네 근처 수영장이나 체육도장을 찾아 연락처를 확인하거나, 분석가가 구 안의 체육시설 분포와 생활권별 접근성을 지도로 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표나 상호명 매칭으로만 이어 쓰며, 문체부 전국체육시설 DB 등과 시설명·주소 기준으로 대조하는 방식이 된다.
description_portal: 본 데이터는 인천광역시 미추홀구 관내 신고 체육시설의 기본 현황을 수록한 자료입니다. 항목은 상호명, 구분(업종), 도로명주소, 지번주소, 전화번호, 위도·경도로 구성되어 시설의 위치와 연락 경로를 한눈에 파악할 수 있도록 설계되었습니다. 좌표 정보는 지도 서비스와 연계하여 접근성 분석과 생활권 내 체육 인프라 분포 시각화에 활용되며, 주소 체계는 행정동·도로명 기반의 정확한 길찾기와 민원 대응을 지원합니다. 구분 값은 수영장업, 체육도장업 등 시설 유형을 식별하여 안전점검 대상 분류, 혼잡 완화 대책, 시설별 지원사업 설계 시 참고가 됩니다. 전화번호는 이용자 안내와 현장 점검 시 사전 연락 창구로 쓰입니다. 본 자료는 체육시설 이용 편의 증진과 생활체육 활성화, 도시계획 및 건강증진 정책의 근거자료로 활용되며, 정기 갱신을 통해 주소 변경, 상호 변경, 좌표 보정 등 최신 현황을 반영합니다. 또한 시설 간 거리 분석과 대중교통 결절점 연계를 통해 배치 적정성을 평가하고, 응급 출동 경로 설계와 취약계층의 체육 접근성 진단에도 기여합니다.
