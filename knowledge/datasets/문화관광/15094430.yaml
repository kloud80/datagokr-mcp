summary_user: 빅카인즈(BIGKinds)에서 모은 게임 셧다운 제도 관련 뉴스 기사를 건별로 담은 메타정보 파일로, 기사마다 일자·언론사·제목·통합 분류·키워드·특성추출어를 기록하며 전국 단위의 비공간 자료다(CSV 약 554KB). 셧다운 제도를 둘러싼 언론 보도가 시기별로 어떻게 늘고 줄었는지, 청소년 보호와 게임 산업 규제 중 어떤 쟁점이 주로 다뤄졌는지 살피려는 연구자·정책 분석가가 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어서, 일자나 언론사 이름을 기준으로 다른 빅카인즈 주제별 메타데이터나 게임·청소년 정책 통계와 직접 맞춰 이어 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 게임 셧다운 제도 관련 뉴스 메타정보 자료입니다. 게임 셧다운 제도는 청소년의 수면권과 건강권 보호를 위해 심야 시간대 온라인 게임 접속을 제한하는 정책으로, 시행 이후 사회적으로 큰 논란과 관심을 받아왔습니다. 본 자료는 국내 주요 신문과 방송 보도에서 게임 셧다운 제도와 관련된 기사를 분석하여 주요 키워드와 빈도를 추출하고, 시기별 보도 경향과 사회적 인식 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 청소년 보호와 권리 보장, 게임 산업과 규제 간의 갈등, 인터넷 문화 변화, 정책 효과와 한계 등이 언론 담론 속에서 어떻게 다루어졌는지를 객관적으로 파악할 수 있습니다. 또한 학술 연구, 청소년 정책 분석, 게임 산업 연구, 사회 문화 연구 등 다양한 분야에서 활용할 수 있는 기초 자료로, 규제와 자율성의 균형 및 미래지향적 정책 논의에 중요한 참고 자료가 될 수 있습니다.
