summary_user: 핵심 저작권산업을 출판·문학, 음악·연극·오페라, 영화·비디오, 라디오·TV, 사진, 소프트웨어·데이터베이스, 시각·그래픽 예술, 광고서비스, 저작권협회 등 산업 부문별로 나눠 2013년부터 2021년까지 연도별 고용자 수를 담은 전국 단위 집계표입니다(CSV 728바이트의 작은 파일). 문화산업 정책 분석가나 연구자가 '소프트웨어·데이터베이스 분야 고용이 다른 저작권산업 부문보다 얼마나 빠르게 늘었나' 같은 부문별 고용 추이를 비교하는 데 씁니다. 공통 조인 키가 없어 다른 데이터와는 산업 부문 이름이나 연도를 직접 맞춰 붙여야 하며, 한국저작권위원회의 다른 저작권산업 통계와 부문명 기준으로 이어 씁니다.
description_portal: 한국저작권위원회에서 저작권산업인 산업 발전에 기여하는 창작물에 대한 권리를 포괄하고 좁게는 특허, 실용신안, 디자인, 상표와 같은 산업재산권을 의미하며, 넓게는 저작권까지 포함하는 개념이다. 특히 컴퓨터 프로그램이나 소프트웨어와 같이 산업적 측면이 가종되는 분야의 저작물에 대한 권리인데 이러한 출판 및 문학, 음악 연극 및 오페라, 영화 및 비디오, 라디오 및 TV, 사진, 소프트웨어 및 데이터베이스, 시각 및 그래픽 예술, 광고서비스, 저작권협회 산업분야로 구분하여 핵심 저작권산업의 분야별 고용자수에 대한 연도별 통계현황 및 데이터입니다.
