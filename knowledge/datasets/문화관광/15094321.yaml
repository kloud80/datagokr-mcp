summary_user: 국립무형유산원이 제공하는 무형유산 전시 정보를 전시 건별 목록으로 담으며, 자료명(nihcFdNm)·등록일자로 보이는 일자 항목·상세 페이지 이동 URL 정도의 간단한 항목으로 구성된다. 무형유산 전시를 찾는 관람객이나 교육·문화기획자가 "국립무형유산원에서 어떤 무형유산 전시가 열렸고, 상세 안내는 어디서 보나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 국가유산 데이터와는 전시명·유산 이름을 맞춰 보거나 같은 기관(국립무형유산원) 데이터끼리만 연결한다.
limits: 포털 설명에 나온 전승자·전시 기간·장소·전시품 같은 상세 항목은 실제 필드 목록에 없고, 응답은 자료명·일자·URL 수준이라 상세 내용은 링크된 페이지에서 확인해야 한다. 조인 키가 없어 지정 무형유산 목록 등과의 자동 결합이 어렵고, 개발계정은 하루 500회까지 호출된다.
