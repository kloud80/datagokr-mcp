summary_user: 제주 법화사 인근의 음식점·카페·편의점·숙박시설·관광지를 시설 한 곳당 한 행으로 정리한 목록으로, 시설 유형(구분), 명칭, 법화사로부터의 거리, 주소, 전화번호, 휠체어 진입 가능 여부, 장애인 화장실 제공 여부를 담는다. 휠체어 이용자나 영유아 동반 가족이 '법화사를 방문할 때 근처에서 휠체어로 들어갈 수 있고 장애인 화장실이 있는 식당·숙소가 어디인가'를 확인하는 데 쓰고, 무장애 관광 지도 제작이나 접근성 개선 검토의 기초자료로도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 시설 명칭이나 주소를 맞대어 연결해야 한다.
description_portal: '"제주특별자치도 내 법화사_무장애주변관광지 데이터를 제공합니다.* 제주특별자치도 법화사 인근에서 장애인·노약자·영유아 동반 가족 등 관광약자의 무장애 여행을 위한 주변 관광시설 정보를 체계적으로 정리한 통계자료입니다. 본 자료에는 음식점, 카페 및 편의점, 숙박시설, 관광지 등 다양한 유형의 시설에 대해 명칭, 거리, 주소, 연락처, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등이 포함되어 있어, 이동이나 이용에 제약이 있는 이용자의 방문 여건을 객관적으로 확인할 수 있습니다. 또한 이 정보는 무장애 관광 지도 제작, 관광서비스 접근성 개선 및 관광정책 수립·평가 등에 활용할 수 있는 기초자료로 제공됩니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
