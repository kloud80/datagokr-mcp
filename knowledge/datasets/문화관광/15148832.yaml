description_portal: 한국공예디자인문화진흥원은 「문화산업진흥기본법」제15조 및 같은 법 시행령 제19조, 동법 시행규칙 제7조에서 제9조에 의거하여, 우수문화상품 지정제도를 운영하고 있습니다. 한국의 문화적 가치를 지닌 우수문화상품의 체계적인 관리와 홍보를 통해 지정상품 인지도 강화를 목적으로 합니다. 그 중에서도 한복분야는 문화상품으로서의 가치를 지닌 양산 가능한 한복, 한복소품 등을 지원대상으로 합니다. 본 제도에서 지정된 한복분야 우수문화상품 정보를 제공하며 지정년도, 지정번호, 상품 설명 항목을 포함하고 있습니다.
