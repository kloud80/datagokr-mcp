description_portal: '"서울시 동북권(강북구, 광진구, 노원구, 도봉구, 동대문구, 성동구, 성북구, 중랑구) 공공도서관 61개관의 보존가치도서(유일본, 서울학, 고서, 귀중서) 연간 대출 현황 정보, 종건수/책건수/대출건수 등 제공※ 보존가치도서의 선정은 ①유일본 ②고서(1945년 이전) ③서울학(서울 및 서울의 지명을 포함한 자료) ④귀중서(자관 선정) 4개 항목 분석을 진행함* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함"'
