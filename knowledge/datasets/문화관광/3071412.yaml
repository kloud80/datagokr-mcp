summary_user: 경상북도 구미시의 주요 공공체육시설을 시설 한 곳당 한 행으로 정리한 파일 데이터(csv 약 4.5KB)로, 시설명·도로명/지번 주소·조성연도·수용인원·좌석·부지면적·건축연면적·주요시설·관리기관과 연락처를 담는다. 구미 시민이 근처에서 이용할 체육관·운동장을 찾거나, 분석가가 조성연도를 기준으로 오래된 시설과 지역별 분포를 점검하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 주소나 시설명을 맞춰 연결하며, 주소를 지오코딩해 지도·인구 자료와 겹쳐 본다.
description_portal: 경상북도 구미시의 주요 공공체육시설 현황을 정리한 자료로, 시설명과 조성연도, 위치(주소), 수용 인원, 면적 등 기본 정보를 상세히 제공합니다. 또한 체육관, 경기장, 운동장, 야외체육시설 등 주요 시설의 종류와 세부 현황도 함께 포함되어 있어 각 시설별 규모, 기능 및 이용 가능 범위를 한눈에 파악할 수 있습니다. 이 자료는 구미시 전역의 공공체육시설 분포 현황을 분석하는 데 기초 자료로 활용될 수 있으며, 시설 노후화 여부를 점검하거나 향후 개선·보수 및 신규 조성 계획을 수립할 때 중요한 참고자료로 쓰일 수 있습니다. 나아가 시민들의 생활체육 참여도를 높이고 건강한 여가문화 확산을 위한 정책 마련에도 실질적인 도움을 줄 수 있는 자료입니다.
