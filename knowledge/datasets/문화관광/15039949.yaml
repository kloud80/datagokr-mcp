summary_user: 인천광역시 서구(제목상 서해구)에 신고된 출판사를 한 곳씩 담은 건별 목록으로, 출판사 이름(사업체명칭), 신고일자, 도로명 소재지를 담는다. 구 내 출판사가 어디에 몇 곳 있는지, 언제부터 신고됐는지를 확인하려는 주민·출판 관련 사업자나 지역 문화산업 정책 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업체명칭이나 도로명 주소를 맞춰 잇거나, 같은 기관이 낸 자료끼리만 연결한다.
description_portal: 본 공공데이터는 인천광역시 서구에 위치한 출판사의 현황을 정리한 자료입니다. 본 자료는 인천광역시 서구 내 출판사의 이름, 소재지, 등록일자 등의 정보를 포함하고 있습니다. 본 데이터를 통해 인천광역시 서구 내 출판산업의 분포와 규모를 파악할 수 있습니다. 또한 문화 콘텐츠 산업 육성, 관련 정책 수립 및 연구 자료로 유용할것으로 판단됩니다. 그리고 인천광역시 서구의 출판 관련 사업의 활성화 현황을 알수 있는 기초자료로도 활용할 수 있을것으로 판단됩니다. 본 데이터는 연마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
