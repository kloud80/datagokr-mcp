summary_user: 충청남도 논산시에 있는 문화재를 한 건씩 담은 목록 파일(CSV, 약 18KB)로, 문화재명·지정주체·지정구분·지정번호·지정일과 행정구역, 도로명·지번 소재지 주소를 담는다. 논산시 주민이나 지역 정책 담당자가 "우리 동네(읍·면·동)에 어떤 국가·도 지정 문화재가 있고 언제 지정됐나"를 확인하거나 분포를 지도로 그리는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 국가유산청 유산 목록과는 문화재명·지정구분·지정번호를 맞춰 대조하고, 위치는 소재지 주소를 지오코딩해 다른 공간 데이터와 겹쳐 쓴다.
limits: 국가유산청 종목코드·지정번호 체계나 필지고유번호(PNU) 같은 공통 키가 없어서 다른 데이터와 자동으로 연결되지 않고, 이름·번호를 수작업으로 맞춰야 한다. 범위는 논산시 한 곳뿐이다. 관람·행사·재난관리 정보는 담지 않는다.
