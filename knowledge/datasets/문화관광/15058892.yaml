summary_user: 경기도 시군별 인허가로 설립된 문화예술·체육·관광 분야 비영리 법인을 사업장 한 곳당 한 행으로 담은 건별 현황으로, 사업장명·인허가일자·영업상태·법인설립목적·소재지 주소·좌표 등을 포함한다. 지역 문화정책 담당자나 연구자가 '우리 시군에 영업 중인 문화예술법인은 몇 곳이고 어떤 목적으로 설립됐나'를 시군끼리 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)나 주소·사업장명 매칭, 또는 위경도 좌표로 공간 결합하는 방식으로만 잇는다.
description_portal: 이 데이터는 문화예술, 체육, 관광 관련 비영리 법인의 현황 정보를 수록한 자료로, 각 시군별 인허가를 통해 설립된 문화예술법인의 상세 정보를 제공합니다. 주요 항목으로는 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태(BSN_STATE_NM), 개관일자(OPENHL_DE), 폐관일자(CLOSNG_DE), 법인설립목적(COPRTN_FOUND_PURPS), 자본금(CAPTL_AMT), 법인명정보(COPRTN_NM_INFO), 소재지 주소(REFINE_ROADNM_ADDR), 문화체육업종명(CULTUR_PHSTRN_INDUTYPE_NM) 등입니다.이 데이터는 지역 문화정책 수립과 문화 인프라 구축에 있어 기초 자료로 활용될 수 있으며, 특정 시군의 문화적 역량과 법인 활동 현황을 비교·분석하는 데 적합합니다. 또한 박물관미술관종류명(MUSEUM_ARTGLRY_KIND_NM), 유형명(MUSEUM_ARTGLRY_TYPE_NM), 설립운영주체구분명(FOUND_OPERT_MAINBD_DIV_NM) 등 법인의 성격과 운영주체를 세부적으로 파악할 수 있어, 지역문화시설 운영 실태 파악과 정책 방향 설정에 도움을 줍니다.공공부문 외에도 민간 연구기관, 문화 관련 스타트업, 학계에서도 비영리 문화법인 연구와 문화서비스 수요 분석 등에 본 데이터를 활용할 수 있습니다.
