summary_user: 전국 자치단체가 관리하는 요트장업 인허가 정보를 사업장 단위로 담는 데이터로, 인허가일자·영업상태·사업장명·주소·좌표 등을 포함하며 API 전체 32건이 2000-01-03부터 2026-08-13까지 걸쳐 있다. 요트 경기를 할 수 있는 시설이 어디에 등록돼 있고 지금도 영업 중인지 알아보려는 국민이나 분석가가 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 조인 키로 삼아 다른 체육시설업·상권 데이터와 주소 기준으로 잇고, 필수 파라미터인 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘긴다.
description_portal: '생활_요트장업 데이터는 요트 경기를 할 수 있도록 시설을 갖추어 놓은 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 요트장업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 스포츠산업과 / 044-203-3156 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
