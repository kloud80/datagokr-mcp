summary_user: 2021년 12월 기준 문화누리카드를 쓸 수 있는 전국 오프라인 가맹점을 가맹점 한 곳당 한 행으로 담은 파일로, 광역지자체 단위 지역·가맹점명·업종 분류(도서, 숙박, 교통수단, 체육시설 등)·주소를 담는다. 문화누리카드 이용자가 우리 지역에서 카드를 쓸 수 있는 서점이나 체육시설이 어디인지 찾을 때나, 분석가가 시도별·업종별 가맹점 분포를 비교할 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 지역명(시도)이나 주소 문자열을 매칭해 이어 써야 한다.
description_portal: 이 데이터는 2021년 12월을 기준으로 한국문화예술위원회가 제공한 문화누리카드 오프라인 가맹점 목록 정보로, 문화향유 확대를 위한 기초자료로 활용됩니다. 구성 항목은 지역, 가맹점명, 분류, 주소, 전화번호로 이루어져 있으며, 전국 단위의 문화 소비 네트워크를 이해하는 데 유용한 정보를 제공합니다. 지역 항목에는 서울, 대구, 부산, 인천, 경기 등 전국 광역지자체명이 포함되어 있으며, 분류 항목은 교통수단, 숙박, 여행사, 관광지, 도서, 문화체험, 음악, 체육시설, 체육용품, 스포츠관람 등으로 다양하게 구성되어 있어 사용처의 특성과 범위를 구체적으로 파악할 수 있습니다. 가맹점명에는 한옥마을 아트홀, 홍지서림 전주점, 여수엑스포역, 현대서점, 블루비치 민박 등 지역 기반의 가맹점들이 나타나 있어 실제 지역사회 내 문화 소비 지점을 확인할 수 있습니다. 이 데이터는 지역별 문화자원 분포와 소비 유형을 분석하고, 정책 수요 기반의 문화복지 서비스 확대 전략 수립에도 유용하게 활용될 수 있습니다. 문화 접근성 향상에 기여하는 정책 자료입니다.
