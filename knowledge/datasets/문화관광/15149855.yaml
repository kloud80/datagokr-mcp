summary_user: 공공누리 DB에서 공공이 신탁 관리하는 저작물을 건별로 제목·부제목·고유번호·공표언어·저작자·소속기관·유의사항·상세설명·구매문의와 함께 담은 파일이다(csv 약 3.9KB, 전국·비공간). 저작물을 쓰려는 국민·사업자가 '이 신탁저작물의 저작자와 이용 제한 조건은 무엇이고, 상업적으로 쓰려면 어디에 문의하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 고유번호나 저작자명·소속기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 공공누리 DB의 신탁저작물 정보 테이블은 공공이 신탁 관리하는 저작물의 핵심 메타데이터를 종합적으로 담고 있다. 제목·부제목은 저작물의 기본 식별과 분류를 가능하게 하며, 고유번호는 관리와 검색을 위한 고유 식별코드를 제공한다. 공표언어코드는 제공 언어를 표시해 이용자가 접근할 수 있는 언어 범위를 명확히 하고, 저작자명과 소속기관명은 저작권자 및 제작 주체를 나타내어 출처와 책임을 분명히 한다. 또한 유의사항에는 저작권과 관련된 주의사항 및 이용 제한 조건이 포함되어 있어 적법한 사용을 안내한다. 상세설명은 저작물의 내용과 특징, 활용 목적을 보완적으로 제시하여 이용자가 자료를 충분히 이해하고 활용할 수 있게 한다. 마지막으로 구매문의는 추가 이용이나 상업적 활용을 원할 때 필요한 문의처를 제공해 공공 이용 확대와 저작권 준수를 동시에 지원한다.
