summary_user: 여수시 관내에서 영업 중인 민간 헬스장을 시설 한 곳당 한 행으로 담은 명부로, 상호·우편번호·도로명 주소·전화번호가 들어 있고 범위는 여수시 한 개 시군구다. 주민이나 방문객이 '집 근처 헬스장이 어디 있고 연락처가 무엇인가'를 찾거나, 분석가가 여수시 안 헬스장 분포와 상권 입지를 살피는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 상호를 맞춰 잇는다.
limits: 전역 조인 키가 없어 지방행정 인허가(LOCALDATA) 체육시설업 자료나 상권 데이터와는 주소·상호 문자열 매칭으로만 연결된다. 좌표 필드가 없어 지도에 올리려면 도로명 주소를 지오코딩해야 하며, 개폐업 일자가 없어 영업 상태 변화는 이 파일만으로 알 수 없다.
