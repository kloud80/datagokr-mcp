summary_user: 제주특별자치도에 장기체류 방문 외국인으로 분류된 사람의 유동인구를 기준연월·국적·시간대·읍면동별로 월 단위 합산한 집계 통계입니다(매 정각 체류 분을 60으로 나눈 값). 제주 관광·다문화 정책 담당자나 분석가가 "어느 국적 장기체류 외국인이 어느 읍면동에, 어느 시간대에 많이 머무는가"를 월별 추이로 보는 데 쓴다. 전역 조인 키가 없어 읍면동 이름(emd_name)이나 국적 이름을 다른 제주 통계와 이름 매핑으로만 연결한다.
description_portal: 이 데이터셋은 제주특별자치도에 ‘장기체류 방문 외국인’으로 분류된 이들의 유동인구가 월별로 어떻게 변화해 왔는지를 집계한 통계자료입니다. 매일 01시부터 24시까지 매 정각 시점에서 체류 인구를 측정하며, 해당 시간 동안 머문 시간을 분 단위로 집계해 60분으로 나눈 값을 “유동인구”로 산출하고, 이를 월 단위로 합산하여 제공됩니다. 이 자료는 제주 내 장기체류 외국인의 생활 및 이동 패턴, 체류 규모 변화, 인구구조 변화 모니터링, 다문화 정책 수립, 공공서비스 및 도시계획을 위한 기초 데이터베이스로 활용할 수 있습니다. 다만, 이 통계는 해당 조사 기간 기준이며, 이후 입출국, 체류자격 변경, 체류 지속 여부 등 변동 사항은 반영되지 않을 수 있는 한계가 있습니다
