summary_user: 제주특별자치도 종달항과 해안길 한 곳을 대상으로 장애인·노약자·영유아 동반 가족 등 관광약자의 접근성 정보를 항목별(구분·유형·추천여부·비고)로 정리한 관광지 단위 자료로, 주차장·화장실 등 편의시설의 장애인 이용 가능 여부와 무장애 코스, 운영시간·요금 안내를 담는다. 휠체어 이용자나 유모차 동반 가족이 종달항 일대 해안길을 실제로 다닐 수 있는지, 장애인 화장실과 주차장이 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관광지 이름 매칭이나 같은 기관(제주특별자치도)의 다른 무장애 관광지 파일과 나란히 묶는 방식으로만 연결한다.
description_portal: '제주특별자치도 내 종달항과해안길_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도에서 제공하는 무장애 여행 관광지 정보로, “종달항과 해안길”을 대상으로 장애인·노약자·영유아 동반 가족 등 관광약자의 무장애 접근성 및 이용 환경을 체계적으로 정리한 자료입니다. 본 자료에는 관광지 개요, 주소, 주차장·화장실 등 주요 편의시설의 장애인 이용 가능 여부, 무장애 코스 안내, 운영시간 및 요금 정보 등이 포함되어 있습니다. 이 정보를 통해 관광약자의 여행 계획 수립과 접근성 개선 현황 점검이 가능하며, 지역 관광정책 수립 및 무장애 관광환경 조성에 활용될 수 있습니다.* 활용 분야 : 무장애 관광지 지도화 및 접근성 개선 사업, 관광지 안내 서비스 및 웹/앱 정보 제공 개선 등'
