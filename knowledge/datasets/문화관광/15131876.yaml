summary_user: 2023년 매장문화재 지표조사 신청을 사업(신청) 단위로 담은 건별 파일로, 사업명·시행자 구분·신청 시도·시군구·면적·조사기관·조사기간과 회신 결과, 입회·표본·시굴·발굴조사별 면적과 조사비용을 전국 시군구 단위로 담는다. 건설 사업자나 분석가가 "우리 지역 개발사업은 지표조사 뒤 어떤 후속조사(입회·표본·시굴·발굴)로 회신되는 경우가 많고, 조사 기간과 비용은 어느 정도인가"를 가늠하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 신청 시도·시군구 이름이나 사업명·조사기관 이름을 맞춰 연결하고, 관리번호는 같은 기관의 발굴 관련 자료와 대조할 때 단서로만 쓴다.
limits: 표준 행정코드 같은 조인 키가 없어 시군구 이름을 기준으로 직접 매핑해야 한다. 이벤트성으로 생성된 뒤 바뀌지 않는 파일이라 2023년 신청분만 담으며, 다른 연도와 비교하려면 별도 파일이 필요하다.
