description_portal: 매장문화재 지표조사는 건설공사의 사업계획 수립 시 해당 지역에 매장문화재(지하에 뭍혀 있는 유적 유물)의 존재 여부와 분포 상태를 확인하기 위한 사전 조사입니다. 이는 문화재를 보호하고, 공사 중 예상치 못한 문화재 발굴로 인한 지연이나 손실을 방지하기 위해 필수적입니다. 2023년 지표 조사  신청 현황(사업명, 사업시행자구분, 신청시도, 신청시군구, 사업개요, 면적, 조사기관, 관리번호, 조사기간, 조사일수, 회신일자, 회신구분, 공사시행면적, 입회조사면적, 표본조사면적, 발굴조사면적, 시굴조사면적, 기타면적, 조사비용)을 보실 수 있습니다.
