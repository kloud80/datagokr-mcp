description_portal: '"정보과학도서관 홈페이지 게시판 게시글" 데이터는 도서관 홈페이지 내 다양한 게시판에 등록된 게시글 정보를 체계적으로 관리하는 자료입니다. 이 데이터에는 각 게시글의 고유식별번호, 게시판명, 제목, 조회수 등 기본 정보와 함께 해당 게시글이 공지글인지 여부, 공지글로 노출되는 시작 및 종료일자가 포함되어 있어 게시글의 중요도나 공지 기간 등을 쉽게 파악할 수 있습니다. 또한 비밀글 여부, 전체공개 여부 등의 속성 정보도 제공되어 게시글의 열람 범위와 형식을 확인할 수 있습니다. 등록일 및 수정일 정보는 게시글의 작성 및 최신 업데이트 일자를 보여주며, 이를 통해 이용자는 보다 신뢰성 있는 정보를 확인할 수 있습니다.보다 정확한 정보는 과천시 정보과학도서관 홈페이지(https://www.gclib.go.kr/lib/menu/10099/bbs/20001/bbsPostList.do)를 통해 확인하실 수 있습니다.'
