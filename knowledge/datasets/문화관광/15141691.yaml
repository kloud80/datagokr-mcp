summary_user: 서울특별시 용산구에 신고된 골프연습장업(실내·야외 골프연습장, 스크린골프, 가상체험체육시설업)을 업소 한 곳당 한 행으로 담은 인허가 명부로, 인허가·취소·폐업 일자, 영업상태, 상호, 지번·도로명 주소, 좌표, 건물 층수·면적, 지도자 수 등을 포함한다. 창업 예정자나 상권 분석가가 '용산구에서 영업 중인 스크린골프장은 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하고, 좌표(X·Y)로 상권·지도 데이터와 겹쳐 본다.
description_portal: 서울특별시 용산구에 정식으로 신고된 체육시설업 중 골프연습장업의 현황 정보를 제공하고 있습니다. 이 정보에는 용산구 내 위치한 골프연습장업(실내골프연습장, 야외골프연습장, 스크린골프, 가상체험체육시설업)에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구에 정식으로 신고된 다른 업종의 신고체육시설업의 정보 또는 공공체육시설에 대한 정보가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
