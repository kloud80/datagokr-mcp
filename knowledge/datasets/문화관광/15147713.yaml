summary_user: 대한체육회에 등록된 회원종목단체를 단체 한 곳당 한 행으로 담은 목록 파일로, 회원 구분(정회원·준회원·인정단체), 단체명, 가입일, 연락처·팩스, 도로명 주소, 홈페이지, 회장·사무처장 정보를 담는다. 특정 종목의 경기단체가 어디이고 누가 대표인지, 연락처가 무엇인지 확인하려는 선수·지도자·대회 주최 측이나 체육 행정 담당자가 쓴다. 전역 조인 키가 없어서 선수·대회 결과 등 다른 전문체육 데이터와는 단체명이나 종목명을 맞춰 연결해야 한다.
description_portal: 이 데이터는 대한체육회의 회원단체로 등록되어있는 각종 종목단체의 정보를 제공합니다.데이터 기준일 기준, 정회원은 64개 단체, 준회원은 4개 단체, 인정단체는 14개 단체로 총 82개의 종목단체가 등록되어 있습니다.여기에는 정회원, 준회원, 인정단체로 구분된 총 단체 목록과 각 단체의 명칭, 가입일, 연락처, 주소, 이메일, 홈페이지, 회장 및 사무처장 정보, 그리고 인준일 등이 정리되어 있습니다.이를 통해 대한체육회 산하 종목단체의 기본 현황을 한눈에 파악할 수 있으며, 행정업무나 홍보자료 작성, 각종 통계 분석 및 정책 수립에 중요한 기초 자료로 활용할 수 있습니다.
