summary_user: 빅카인즈(BIGKinds)에 쌓인 국내 신문·방송 기사 가운데 미국 관련 기사를 기사 한 건당 한 행으로 담은 메타데이터로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목을 갖춘 약 126MB 크기의 CSV 파일이다. 연구자나 언론·국제관계 분석가가 한미 동맹, 무역 협상, 미국 정치 같은 의제를 한국 언론이 시기별로 얼마나, 어떤 키워드로 보도했는지 살필 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 일자나 언론사명, 키워드 같은 이름 값을 맞춰 붙여야 하며, 같은 재단의 다른 국가별 뉴스 메타데이터와 나란히 비교하는 방식으로 쓴다.
