description_portal: 대구광역시 서구 관내의 테니스장 및 배드민턴장 시설 현황입니다. 구분,시설명,위치,코트면수 등의 데이터입니다.본 데이터는 대구광역시 서구 관내에 위치한 테니스장과 배드민턴장 시설 현황을 체계적으로 정리한 자료이다. 각 시설명, 위치, 코트 면수 및 전화번호 등의 구체적인 정보를 포함하여 시민들이 스포츠 시설 이용 시 편리하게 참고할 수 있도록 구성하였다. 테니스장은 감삼테니스장, 상리테니스장 등 총 4곳이며, 크레이코트, 인조잔디, 우레탄 등 다양한 코트 재질별로 구분되어 있다. 배드민턴장은 평리공원, 이현공원 등 총 7개소로 면수 및 상세 주소가 명확히 제시되어 있다. 전화번호 정보는 각 시설별로 연락 및 예약 문의에 용이하도록 제공되어 있다. 본 자료는 지역 주민의 체육 활동 활성화 및 시설 접근성 향상을 목적으로 개방하는 공공데이터이다.
