summary_user: 한국도자재단이 소장한 도자 작품·유물을 한 점씩 담은 소장품 목록으로, 작품명·작가명·국적·제작연도·작품 구분·소장처(경기도자박물관, 경기도자미술관 등)·데이터 기준일자를 담는다. 연구자나 전시기획자가 '재단 소장품 가운데 특정 국적·시대의 도자 작품은 무엇이며 어느 관에 있는가'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름 매칭이나 같은 기관 기준으로만 연결한다.
description_portal: 이 데이터는 한국도자재단이 소장한 도자 작품 및 유물 정보를 정리한 자료로, 작품명, 작가명, 국적, 제작연도, 작품 구분(유물, 생활도자, 학술유물 등), 소장처(경기도자박물관, 경기도자미술관 등), 데이터 기준일자 등의 항목으로 구성되어 있습니다. 작가미상의 한국 전통 도자 유물부터 현대 유럽 작가의 창작 작품에 이르기까지 다양한 국적과 시대의 도자 자료가 포함되어 있으며, 전통 도자사 연구, 문화유산 데이터베이스 구축, 전시기획 자료로 활용될 수 있습니다. 또한, 도자작품의 시대별·국적별 경향 분석 및 교육 콘텐츠 개발, 도자문화 보존을 위한 정책 수립에도 유용한 자료입니다.* 작품 유형 분류가 미완료된 소장품의 경우 "작품유형명" 항목이 공란으로 제공됩니다
