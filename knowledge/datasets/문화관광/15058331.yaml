summary_user: 경기도 내 문화재 수리·실측설계·감리 업체를 사업장 한 곳당 한 건으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·법인명·업종명·도로명/지번주소와 위도·경도를 포함한다. 문화재 보수사업을 발주하거나 계획하는 담당자나 분석가가 '우리 시군에서 현재 영업 중인 문화재 수리업체는 어디이고 어떤 업종인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명으로 같은 기관 자료와 묶거나 주소·좌표, 업체명 매칭으로 다른 데이터와 잇고, 국가유산청 유산 목록의 종목코드·지정번호와는 직접 연결되지 않는다.
description_portal: 이 데이터는 문화재의 원형 보존과 계승을 위한 수리 및 실측설계, 감리 등을 수행하는 문화재수리업체의 현황 정보를 제공합니다. 포함된 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 소재지도로명주소(REFINE_ROADNM_ADDR), 법인명(COPRTN_NM), 법인설립목적(COPRTN_FOUND_PURPS), 문화체육업종명(CULTUR_PHSTRN_INDUTYPE_NM) 등이며, 위치좌표(WGS84 위도·경도)도 함께 수록됩니다.문화재수리업체는 국가나 지방자치단체가 관리하는 문화재의 복원·보존 작업을 전문적으로 수행하는 주체로, 법률적 인허가를 받은 기관입니다. 해당 데이터는 행정안전부가 지방행정데이터개방시스템을 통해 제공한 자료로, 각 업체의 법적 설립 근거, 운영 현황, 공간 정보 등을 통합적으로 제공합니다.이 데이터는 문화재 보존정책 수립, 보수사업 계획 수립, 문화재 관리 인프라 분석 등에 활용되며, 공공 및 민간 부문의 문화유산 보존활동의 기초자료로 활용될 수 있습니다. 특히 건축, 설계, 감리 등 다양한 문화재보수 관련 업종의 분류도 함께 제공되어, 종합적인 문화재 보수 인프라 파악이 가능합니다.
