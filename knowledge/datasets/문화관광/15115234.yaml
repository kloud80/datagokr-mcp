summary_user: 서울 송파구 수영장업 사업장의 인허가 정보를 사업장별로 담은 건별 원천 명부로, 시군구 범위입니다. 인허가·취소일자, 영업상태와 폐업·휴업기간, 주소와 좌표, 보험 가입 여부, 지도자 수, 건물 연면적, 회원 모집 인원 같은 항목을 함께 담습니다. 송파구 안에서 영업 중인 민간 수영장이 어디에 있고 언제 문을 열거나 닫았는지 확인하려는 주민이나 상권 분석가가 이 명부를 쓰고, 다른 데이터와는 전역 조인 키 없이 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드·관리번호)로 이어 헬스장 등 다른 체육시설업 인허가 명부나 상권 데이터와 함께 쓴다.
