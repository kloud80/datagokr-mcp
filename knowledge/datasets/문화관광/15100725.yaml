summary_user: 인천 미추홀구 관내에서 운영 중인 가상체험 체육시설업소(스크린골프·스크린야구 등)를 업소 한 곳당 한 행으로 담은 명부로, 상호명·구분·도로명/지번주소·전화번호·위도·경도를 포함하며 파일 크기는 약 3KB 규모다. 주민이나 사업자가 '우리 동네 어디에 스크린 스포츠 시설이 몰려 있나', 분석가가 '미추홀구 가상체험 체육시설이 어느 상권에 분포하나'를 확인하는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 위경도 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 본 데이터는 미추홀구 관내에서 운영 중인 가상체험 체육시설업소 현황을 수록한 자료입니다. 각 업소의 상호명, 도로명주소 및 지번주소, 전화번호, 위도와 경도 좌표 정보가 포함되어 있으며, 가상체험 기반 스포츠 시설의 분포 현황을 확인할 수 있습니다. 본 데이터는 주민의 실내 여가활동과 첨단 스포츠 체험 수요에 대응하기 위한 체육 인프라 관리의 기초 자료로 활용됩니다. 가상체험 체육시설은 실제 운동 환경을 모사하여 이용자가 공간의 제약 없이 다양한 스포츠를 체험할 수 있도록 설계되어 있습니다. 골프, 스크린야구 등 실감형 콘텐츠를 중심으로 운영되며, 스포츠 참여 기회 확대와 건강한 여가문화 조성에 기여하고 있습니다.
