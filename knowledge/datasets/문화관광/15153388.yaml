summary_user: BIGKinds 뉴스 데이터베이스에서 도널드 트럼프 관련 국내 언론 기사를 기사 한 건당 한 행으로 모은 메타데이터 파일로, 기사 주소·보도 일자·언론사·제목·통합분류(1~3단계)·인물·지역·기업 개체명·키워드·특성추출 값·본문을 담는다(CSV 약 209MB). 언론 연구자나 국제정치 분석가가 "트럼프 관세·선거 이슈가 어느 시기에 국내 언론에 집중 보도됐고 어떤 키워드로 다뤄졌나" 같은 보도 추이와 프레임 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 언론사명·보도 일자·개체명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 도널드 트럼프 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적 분석이 가능합니다.본 자료는 국내 주요 언론사의 도널드 트럼프 관련 보도를 대상으로, 어떤 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 보도 프레임이 어떠했는지 등의 패턴을 밝히는 데 중점을 두고 있습니다. 이러한 분석은 언론이 트럼프의 정책, 정치적 활동, 선거 전략, 법적 이슈, 국제 관계 등을 어떻게 다루는지, 그리고 이러한 보도가 국내 여론과 정책 논의에 어떤 영향을 미쳤는지를 추적하는 데 유용합니다.또한 학계, 언론 연구자, 정치 커뮤니케이션 전문가, 국제정치·외교 분야 분석가, 정책 입안자 등에게 트럼프 관련 보도의 경향, 이슈별 프레임 변화, 언론의 정치 인물 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
