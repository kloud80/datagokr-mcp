description_portal: 한국문학번역원이 운영하는 KLWAVE 플랫폼에서 제공하는 주제별(Discover by Theme) 큐레이션 목록 데이터로, 다양한 주제와 키워드를 중심으로 한국 문학 및 출판 콘텐츠를 분류·추천하기 위해 구축된 데이터입니다. 작품의 제목, 저자, 출판사, 발행 정보 등 이용자가 관심 있는 주제에 따라 도서를 탐색할 수 있는 정보를 포함하고 있습니다. 사랑, 가족, 역사, 사회, 성장, 치유, 여성, 환경 등 다양한 주제별로 한국 문학 작품을 선별하여 제공함으로써 국내외 독자들이 자신의 관심사에 맞는 콘텐츠를 보다 쉽게 발견할 수 있도록 지원합니다.또한 해외 출판사, 번역가, 연구자 및 문화산업 관계자들이 특정 주제와 연관된 한국 문학 작품을 효율적으로 탐색하고 활용할 수 있도록 지원하며, 한국 문학의 다양성과 특성을 국제사회에 소개하는 데 활용됩니다. 해당 데이터는 한국 문학 작품의 해외 번역 및 출간 대상 발굴, 국내외 독서문화 확산, 학술 및 문화 연구, 콘텐츠 기획 등 다양한 분야에서 활용될 수 있으며, 한국 출판 콘텐츠에 대한 접근성과 활용성을 높이는 데 기여합니다. 나아가 한국 문학과 출판 산업의 글로벌 홍보를 강화하고, 주제 기반의 콘텐츠 추천 서비스를 통해 국내외 이용자들의 독서 경험을 확대하며 한국 문화콘텐츠의 국제적 확산과 교류 활성화를 지원하는 데이터입니다.
