summary_user: 광주광역시 공연장을 시설 한 곳당 한 행으로 담은 CSV 파일(약 11KB)로, 주소·좌표·연락처와 휴무일·운영시간·입장료, 주차와 장애인·가족 편의시설 여부를 담는다. 관광객이나 보호자가 '휠체어로 들어갈 수 있고 주차가 무료인 광주 공연장이 어디인가'를 찾거나, 분석가가 공연장 접근성을 비교하는 데 쓴다. 전역 조인 키나 KOPIS 공연장ID(mt10id)가 없어 KOPIS 공연 목록 등과는 시설명이나 주소·좌표를 맞춰 이어 써야 한다.
description_portal: 광주광역시의 공연장에 대한 장소 상세 정보를 제공합니다 (시설명, 휴무일, 운영시간, 주차, 번지, 우편번호 등)
