summary_user: 전라남도 곡성군 문화재 지표조사보고서를 건별로 담은 파일로, 조사명·보고일자·용량·페이지수·보고서 다운로드 주소와 관련 향토문화유적의 이름·지정번호·구분·종류·소재지 주소·위도·경도·조성시대 등을 함께 싣는다(약 200KB CSV). 곡성군 안 특정 유적 주변에서 개발이나 연구를 계획하는 사업자·연구자가 "이 지역에 어떤 지표조사 보고서가 있고 원문은 어디서 받나"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 행정동코드·주소·좌표나 유적명·지정번호를 이름 매칭해 다른 문화재·토지 데이터와 잇는다.
limits: 전국 공통 조인 키가 없어 다른 데이터와는 이름·주소·좌표 매칭으로만 연결된다. 범위는 곡성군 한 곳에 한정되고, 갱신은 명세상 수시(이벤트성)이다. 보고서 본문은 파일에 없고 다운로드 주소만 제공한다.
