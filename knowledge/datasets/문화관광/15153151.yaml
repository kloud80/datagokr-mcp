summary_user: 국가유산청이 관리하는 전국 사찰 정보를 사찰 한 곳당 한 건씩 담으며, 사찰코드·사찰명·지번/도로명 주소·경위도 좌표가 들어 있습니다. 특정 지역에 어떤 사찰이 있는지, 사찰의 정확한 위치가 어디인지 확인하려는 국민이나 분석가가 지도 표시나 위치 조회에 씁니다. 다른 데이터와 공통으로 쓰는 조인 키는 실측 컬럼에서 확인되지 않았습니다. 따라서 사찰명·주소 문자열을 맞추거나 경위도로 공간 매칭해 국가유산청 유산 목록(종목코드·지정번호) 등과 연결합니다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국가유산청에서 제공하는 사찰정보관리에 대한 관련 정보입니다.\""
