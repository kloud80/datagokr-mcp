summary_user: 서울 서초구 관내 영업 중인 헬스장을 업소 한 곳당 한 행으로 담은 건별 명부이며, 검증 수신 기준 354행에 1993-02-10부터 2026-05-26까지의 등록·변경 이력이 들어 있다. 상권 분석가나 창업 준비자가 서초구에 헬스장이 어디에 얼마나 분포하는지, 개폐업 흐름이 어떤지 확인하는 질문에 쓴다. 지번주소·도로명주소(address)를 키로 다른 상권·인허가 데이터와 이어 쓰며, 별도의 사업자번호 필드는 없고 신고번호가 있다.
description_portal: '본 데이터는 서울특별시 서초구 관내 헬스장 현황을 정리한 자료이다. 주요 항목으로 업종, 신고번호, 헬스장 상호명, 지번주소, 도로명주소, 시설면적, 최초등록일자, 최근변경일자, 데이터기준일자 입니다. 지역 내 체육시설 이용 실태를 파악하는 데 활용된다. 해당 자료는 주민들의 건강 증진과 체력 단련을 지원하는 공공 및 민간 체육시설의 운영 현황을 분석하는 데 기초자료로 활용될 수 있다. 또한, 운동시설의 분포 및 이용 가능성을 평가하여 체육 정책 수립과 생활체육 활성화에 기여한다. 본 데이터는 지역 내 헬스장 운영 실태를 종합적으로 분석하여 건강한 생활환경 조성 및 체육시설 관리 정책 수립에 도움을 준다. 정기적으로 갱신되어 최신 정보를 제공하며, 체육시설 이용자 및 관련 기관이 헬스장 정보를 쉽게 확인할 수 있도록 제공된다.기타 유의사항 : 시설면적이 미수집된 상호가 있음.'
