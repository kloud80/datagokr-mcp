description_portal: 본 데이터는 한국관광공사가 스마트투어가이드 앱을 통해 제공하는 관광 스토리텔링 콘텐츠를 체계적으로 정리한 자료로, 관광지별 스팟ID, 명칭, 오디오명, 스토리텔링 대본, 재생시간 등으로 구성되어 있습니다. 스토리텔링은 한국어, 영어, 중국어, 일본어 등 4개 언어로 제공되며, 주요 문화유산, 관광지, 유적지 등의 역사적 배경과 문화적 의미를 흥미롭게 전달합니다. 이 데이터는 음성 기반 관광 서비스, 문화유산 콘텐츠 제작, 지역 관광 활성화를 위한 기반 자료로 활용될 수 있으며, 관광객에게 현장감 있는 해설을 제공함으로써 몰입도 높은 관광 경험을 지원합니다. 특히 관광정보서비스, 오디오 해설 앱, 콘텐츠 큐레이션 서비스 등 다양한 분야에서 활용 가치가 높습니다.
