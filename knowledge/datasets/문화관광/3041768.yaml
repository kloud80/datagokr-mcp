summary_user: 한국관광공사 스마트투어가이드 앱의 관광 스토리텔링 콘텐츠를 스팟(관광지·문화유산 해설 지점)별로 정리한 파일로, 스팟명·오디오명·해설 대본·재생시간(초)을 담는다. 오디오 가이드나 문화유산 해설 서비스를 만드는 사업자가 '특정 유적지에 쓸 해설 대본과 길이가 어떻게 되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 스팟명 같은 이름 매칭으로만 이어 쓴다.
limits: 스팟아이디는 이 데이터 안의 식별자일 뿐 TourAPI contentId나 지역코드 같은 공통 키가 아니어서, 다른 관광 데이터와 붙일 때 이름 매핑이 필요하다. 범위는 전국이지만 행정구역·좌표가 없는 비공간 데이터라 지역별 집계나 지도 표시는 바로 할 수 없다.
