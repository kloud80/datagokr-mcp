summary_user: 티맵 내비게이션 이동 데이터를 바탕으로 관광지별 연관 관광지를 순위(rlteRank)와 함께 담는 API로, 2024년 5월~2025년 4월 정보를 제공하며 검증 시 전국 시군구 단위 50행이 수신됐다. 여행 계획자나 지자체 분석가가 특정 관광지를 찾은 사람이 이어서 가는 관광지·음식·숙박이 어디인지 파악하는 질문에 쓴다. 관광지 시군구코드(signguCd)와 연관관광지 시군구코드(rlteSignguCd)가 모두 sgg_cd 키라서 다른 시군구 단위 데이터와 이어 쓰며, 필수 파라미터 areaCd는 다른 데이터의 코드를 먼저 받아 넘겨야 한다.
description_portal: '- 티맵 모빌리티(주)의 내비게이션 데이터를 기반으로 산출된 관광지별 연관 관광지 정보입니다. Tmap 어플리케이션 사용자가 목적지를 조회하고 거리 기준으로 100m, 시간 기준으로 1분 이상 이동한 조건을 모두 충족한 경우에 한해 집계되며, 차량이동을 기준으로 하므로 실제 연계 방문 정도나 연계 방문하는 사람의 수와는 차이가 있을 수 있습니다. 지자체별 중심관광지와 높은 연결성을 가지는 연관관광지의 전체, 관광지, 음식, 숙박 유형별 최대 각 50위까지 정보를 제공합니다.- 개방 데이터는 지역기반 관광지별 연관 관광지 정보 목록 조회 키워드 검색 관광지별 연관 관광지 정보 목록 조회  2종의 정보를 2024년 05월부터 2025년04월까지의 정보를 제공합니다.'
team:
  dept: AI인프라센터
