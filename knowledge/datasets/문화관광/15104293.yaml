summary_user: 경기도 시흥시 안의 영화상영관을 한 곳씩 담은 건별 현황으로, 상영관명·지번 및 도로명 소재지·영업상태로 구성된 작은 CSV 파일(약 4KB)이다. 시흥시 안에서 지금 영업 중인 영화관이 어디에 있는지, 동네별로 영화관 접근성이 어떤지를 확인하려는 시민·정책 담당자·입지 검토 사업자가 쓴다. 다른 데이터와 맞출 공통 조인 키는 없어서, 상영관명이나 도로명·지번 주소를 기준으로 맞추거나 주소를 좌표로 바꿔 지도·시설 데이터와 이어 쓴다.
