summary_user: 전주시에 인허가된 체력단련장업(헬스장 등) 업소를 한 곳씩 담은 건별 명부로, 사업장명·인허가일자·전화번호·도로명/지번주소·위도·경도와 지도자수·건축물연면적을 담는다. 창업 예정자나 상권 분석가가 '전주시 어느 동네에 헬스장이 몰려 있고 언제부터 영업했나'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표나 사업장명으로 맞춰 상권·인구 데이터와 겹쳐 본다.
description_portal: '전북특별자치도 전주시의 체력단련장업을 제공하며 업종, 사업장명, 인허가일자, 전화번호, 도로명주소, 지번주소 등을 제공합니다.체력단련장업 : 헬스장과 같은 체격관리 및 근력, 유연성, 지구력 강화 등을 목표로 운동을 할 때 필요한 도구와 기구를 제공하는 업소항목 : 연번, 업종, 사업장명, 인허가일자, 전화번호, 도로명주소, 지번주소, 위도, 경도 등제공부서 : 체육산업과'
