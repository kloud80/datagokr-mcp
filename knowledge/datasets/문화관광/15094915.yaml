summary_user: 경상북도 경산시 안의 음식점·숙박·관광명소·문화재 같은 관광 자원을 한 건씩 담은 목록으로, 항목마다 명칭·주소·전화·홈페이지·위도·경도·요약설명이 들어 있다. 관광객이나 앱 개발자가 "경산에서 가볼 만한 문화재와 근처 맛집이 어디 있고 연락처는 무엇인가"를 찾거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어 TourAPI 콘텐츠 등 다른 관광 데이터와는 명칭이나 주소·좌표로 맞춰 이어 써야 한다.
description_portal: 경산시 문화관광데이터는 경상북도 경산시 내의 다양한 관광 자원을 효율적으로 파악하고 활용할 수 있도록 구성된 공공데이터입니다. 이 데이터는 크게 음식, 숙박, 관광명소, 문화재의 네 가지 속성으로 분류되며, 각각의 항목은 자료명칭, 홈페이지, 주소, 위도, 경도, 요약설명 등의 세부 정보를 포함합니다. 예를 들어, 맛집의 위치와 특성, 숙박업소의 편의시설, 주요 관광명소의 역사와 특징, 문화재의 지정 현황 등을 한눈에 파악할 수 있습니다. 이 데이터는 관광객은 물론 연구자, 콘텐츠 제작자, 행정기관 등 다양한 이용자에게 유용하며, 위치 기반 정보와 간략한 설명을 통해 경산시를 보다 체계적으로 이해하고 방문 계획을 세울 수 있도록 도와줍니다. 특히 지도 기반 서비스나 앱 개발 등에도 폭넓게 활용될 수 있습니다.
