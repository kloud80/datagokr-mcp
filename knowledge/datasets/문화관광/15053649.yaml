summary_user: 대구광역시 수성구 관내 공연장을 시설 한 곳당 한 행으로 담은 파일로, 명칭·도로명 주소·객석 수·등록일자를 담는다(파일 크기 742바이트의 소규모 목록). 수성구에서 일정 규모 이상의 객석을 갖춘 공연장이 어디에 있는지 찾는 주민·공연 기획자나 지역 문화시설 분포를 보는 분석가가 쓴다. 전역 조인 키가 없어 KOPIS 공연장ID 등 다른 공연 데이터와는 시설 명칭이나 도로명 주소를 맞춰 이어야 한다.
description_portal: 본 데이터는 대구광역시 수성구 관내에서 운영 중인 공연장 및 문화예술 공간의 현황을 정리한 자료로, 시설명, 시설 유형(공연장·소극장·복합문화공간 등), 도로명 주소, 좌석 수 등의 항목으로 구성되어 있다. 이 자료는 공연장 분포와 규모, 운영 현황을 포괄하여 지역 문화 인프라를 직관적으로 이해할 수 있도록 구성되었으며, 문화정책 수립, 지역 예술 지원 계획, 시설 활용 분석, 관람객 편의 안내, 민원 대응 등에 활용 가능하다. 좌석 수와 무대 규모 정보를 통해 공간별 이용 유형을 비교할 수 있으며, 운영 주체 및 프로그램 정보를 바탕으로 민·관 협력 모델, 문화 관광 콘텐츠 기획, 지역 예술 생태계 활성화 전략 수립에도 유용하다. 수성구청은 공연장 운영 현황과 시설 변동 사항을 정기적으로 갱신하며, 본 데이터는 문화 부서, 예술 단체, 관광 기획자, 주민 등이 폭넓게 활용할 수 있는 기초자료입니다.
