summary_user: 광주광역시도시공사가 관리하는 체육시설을 시설 한 곳당 한 행으로 담은 작은 현황 파일(csv, 약 1KB)이며, 구분·시설명·도로명/지번 주소·전화번호·부지면적·건물면적·시설규모·준공일을 포함한다. 시민이 광주도시공사 체육시설의 위치와 연락처를 찾거나, 분석가가 준공일과 면적으로 시설 노후도와 규모를 비교할 때 쓴다. 전역 조인 키는 없어서 다른 체육시설 데이터와는 시설명이나 주소를 맞춰 연결해야 한다.
description_portal: 광주광역시도시공사에서 관리하는 체육시설의 기본 정보를 정리한 데이터입니다. 본 데이터는 구분, 시설명, 소재지 도로명주소, 지번주소, 전화번호, 부지면적(㎡), 건물면적(㎡), 시설규모, 준공일 항목으로 구성되어 있습니다. 각 시설의 위치, 규모, 연락처 등 기본 정보를 제공하여 시민의 시설 이용 편의성과 접근성을 높이는 데 목적이 있습니다. 부지면적과 건물면적, 시설규모 등을 통해 체육시설의 규모와 기능을 객관적으로 파악할 수 있으며, 준공일 정보를 통해 시설 노후도나 유지관리 계획 수립에도 활용이 가능합니다. 데이터는 구조화되어 제공되며, 행정업무, 공공시설 안내, 정책 수립 등의 분야에서 유용한 기초자료로 활용될 수 있습니다. 이해도와 활용도를 높이기 위해 상세한 설명과 검색에 용이한 키워드를 함께 제공합니다.
