summary_user: 인천광역시 서구 주민이 추천한 맛집을 업소 한 곳당 한 행으로 담은 파일(약 10KB CSV)로, 업소명·소재지 주소·전화번호·대표메뉴·업태와 데이터 기준일자를 담는다. 여행객이나 주민이 '서구에서 현지인이 추천하는 식당과 대표 메뉴가 무엇인가'를 찾거나, 지역 상권 홍보 콘텐츠를 만들 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 업소명이나 소재지 주소를 맞춰 보는 방식으로만 연결하며, 예를 들어 일반음식점 인허가 정보나 TourAPI 음식점 정보와 이름·주소로 대조한다.
description_portal: 본 공공데이터는 인천광역시 서구 주민들이 추천한 맛집 정보를 수록하고 있습니다. 본 자료는 인천광역시 서구 내 주민추천맛집의 업소명,소재지,전화번호,대표메뉴 등의 정보로 수록되어 있습니다. 본 데이터를 통해 지역 내 숨은 맛집을 발굴하고 홍보함으로써 소상공인의 매출 증대와 지역경제 활성화에 도모할수 있을것으로 판단이 되며, 또한 서구의 식문화 다양성과 특색을 알리는 콘텐츠로 활용이 될 수 있을것으로 기대가 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
