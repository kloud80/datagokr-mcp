description_portal: '문화_청소년게임제공업 데이터는 인형뽑기, 오락실 등의 전체 이용가 게임물을 설치하여 제공하는 업소정보 데이터로 인허가 일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준으로, 전국 지방자치단체에서 관리하는 청소년게임제공업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터의 법령 소관기관 및 문의처 : 문화체육관광부 게임콘텐츠산업과 / 044-203-3275 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
