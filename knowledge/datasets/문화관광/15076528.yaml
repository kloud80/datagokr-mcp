description_portal: 문예연감 내 표 목차 목록입니다. 각 구성 항목으로는 책자연도, 책자명, 표제목, 해당페이지로 구성되어 있습니다. 책자연도는 1998년부터 1976년까지의 내림차순으로 정렬되어 있고 책자명 항목은 모두 문예연감으로 구성되어 있습니다. 표 제목 항목은 1998년 문학 관련 단행본 목록_시집, 1988년 문학잡지 수록 신작 작가별 일람_시, 1998년 국제교류 공연 및 행사 일람, 잡지 - 제10회 한국잡지문화상 수상자와 같은 항목으로 구성되어 있습니다. 해당페이지 항목은 92-98과 같은 숫자 형식으로 나타나 있습니다. 따라서 파일에서 문예연감 내 표 목차 목록을 확인할 수 있습니다.
