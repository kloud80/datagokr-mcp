summary_user: 한국영상자료원과 국내외 영화 유관기관이 발표한 영화 리스트(한국영화100선, AFI 100선, BFI 100선, 사이트 & 사운드 2022 등)의 선정작을 작품 한 편당 한 행으로 담은 CSV 파일(약 8.5MB)이다. 리스트는 3단계 분류로 나뉘고 영화명·감독·제작년도·리스트설명이 영문과 함께 들어 있어, 영화 애호가나 큐레이터가 '어떤 영화가 여러 명작 리스트에 공통으로 뽑혔나' 같은 질문에 쓴다. 실측에서 전역 조인 키는 확인되지 않았다. 다른 데이터와는 KMDb 영화작품코드(영화작품코드)나 영화명·감독·제작년도 매칭으로 같은 기관의 KMDb 자료에만 잇는다.
description_portal: 한국영상자료원 및 국내외  영화 유관기관에서 발표하는 영화 리스트와 선정작 목록 입니다.[리스트 예시]- 한국영상자료원 선정 한국영화100선- 미국영화협회 AFI 선정 AFI"s 100 Years … 100 Movies- 영국영화협회 BFI 선정 The Ultimate Film 100- 사이트 & 사운드 2022해당 데이터는 리스트 분류와 영화작품코드, 영화명, 감독, 제작년도, 리스트설명으로 구성되며 각 항목은 영문으로도 제공됩니다.리스트는 조사년도, 조사대상자 등의 구분을 위해 3단계에 걸쳐 분류하고 있습니다.본 데이터는 한국영화데이터베이스 KMDb에서 서비스 중인 리스트 데이터를 기반으로 구축되었으며KMDb에서는 리스트별로 관람 여부를 체크할 수 있는 이용자 서비스를 제공하고 있습니다.
