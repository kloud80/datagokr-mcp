summary_user: 국립대구박물관이 소장한 유물을 한 점씩 담은 건별 목록으로, 명칭·이칭(alternativeTitle)·시대(temporal)·크기(extent)·출토지 등 공간 정보(spatial)·설명·저작권 정보를 포함한다. 연구자나 교사가 특정 시대나 지역에서 나온 국립대구박물관 소장 유물을 찾아 전시 기획이나 교육 자료에 쓸 때 활용한다. 실측 컬럼에 전역 조인 키가 없어, 다른 박물관 유물정보나 문화시설 데이터와는 유물 명칭·시대·지역 같은 이름 기준 매핑으로만 이을 수 있다.
description_portal: 국립대구박물관이 소장하고 있는 다양한 유물의 정보를 체계적으로 제공하여 문화유산의 보존과 연구, 교육에 활용할 수 있도록 지원합니다. 유물의 명칭, 시대, 재질, 크기, 출토지 등 주요 정보를 포함하고 있어 학술 연구, 전시 기획, 문화재 관리, 교육 자료 개발 등 다양한 분야에서 활용이 가능합니다. 또한, 유물의 세부 정보와 관련 이미지를 통해 대중이 우리 문화유산에 대한 이해를 높일 수 있으며, 문화유산의 가치를 널리 알리는 데에도 기여합니다. 데이터는 국립대구박물관의 공식 자료를 기반으로 신뢰성 있게 제공됩니다.
