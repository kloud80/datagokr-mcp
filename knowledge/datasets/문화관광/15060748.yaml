summary_user: 수원도시공사가 운영하는 종합운동장 국민체육센터의 생활체육 강좌를 강좌 한 건씩 담은 목록으로, 강좌명·강사·교육기간과 시각·운영요일·정원·수강료·접수기간과 방법을 담는다(포털 파일 csv 1189바이트 규모). 수원 시민이 탁구나 배드민턴 같은 종목을 어느 요일·시간대에 얼마에 배울 수 있고 언제 어떻게 접수하는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 교육장 도로명주소나 운영기관명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 「종합운동장 국민체육센터 스포츠프로그램」은 수원도시공사가 운영하는 체육강좌로, 다양한 연령과 생활패턴에 맞춘 프로그램이 체계적으로 편성되어 있습니다. 강좌명은 ‘탁구(오전)’, ‘배드민턴(야간)’과 같이 종목과 운영시간을 함께 명시하여 참여자가 쉽게 선택할 수 있게 하였으며, 대부분 “성인.중학생 이상”을 교육대상으로 하여 성숙한 참여자를 중심으로 수업이 이루어집니다. 교육은 주로 화·목, 수·금 등 특정 요일에 운영되며, 오전 9시부터 밤 10시까지 다양한 시간대에 열려 있어 주간 또는 야간 참여가 가능합니다. 접수는 매월 20일부터 시작되며 대부분 선착순 방식의 ‘방문접수’로 운영되어 조기 신청이 중요합니다. 수강료는 과목별로 다르지만 공공체육시설 특성상 비교적 저렴하며, 강좌정원도 정해져 있어 운영의 질을 유지합니다.
