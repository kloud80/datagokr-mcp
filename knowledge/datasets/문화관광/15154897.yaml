summary_user: 전국 자치단체의 관광식당업 인허가 정보를 업소 단위로 취합한 건별 원천 데이터로, 전체 526건이 인허가일자·영업상태·사업장명·주소·좌표 등을 담는다. 관광객에게 특정 국가의 음식을 전문 제공하는 인허가 업소가 어디에 있고 영업 중인지 알아보려는 사업자나 분석가가 쓴다. 지번주소·도로명주소·영문상호주소(address 키)로 다른 주소 기반 데이터와 이어 쓰며, 개방자치단체코드와 기준일자는 다른 데이터에서 먼저 받아 넘긴다.
description_portal: '식품_관광식당 데이터는 일반음식점영업의 허가를 받은자가 관광객의 이용에 적합한 음식제공시설을 갖추고 관광객에게 특정한 국가의 음식을 전문적으로 제공하는 업소 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 관광식당업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 융복합관광과 / 044-203-2882, 2888 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
