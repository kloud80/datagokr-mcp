summary_user: 정책여론수렴시스템이 수집한 온라인 매체 문건에서 중앙부처 이름이 언급된 양과 같은 시간대의 부처별 순위를 기관명·생성시간 단위로 담은 집계 파일이며, 전국 범위의 비공간 데이터로 약 26.8MB 크기의 CSV입니다. 언론·정책 분석가나 공공기관 홍보 담당자가 특정 시점에 어느 부처가 온라인에서 가장 많이 언급됐는지, 시간에 따라 언급 순위가 어떻게 바뀌었는지를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(부처 이름)을 이름으로 맞추거나 같은 기관 기준으로만 이어 쓴다.
description_portal: 문화체육관광부 국민소통실에서 운영하는 정책여론수렴시스템은 온라인 매치를  수집, 분석하여 정부 정책에 대한 국민 여론의 관심도와 반응을 시스템 내 다양한 기능을 통해 사용자에 제공합니다. 빅데이터를 통해 나타난 정책 여론 및 이슈를 신속하게 파악하여, 정부 정책에 대한 대국민 소통에 활용합니다. 부처별 언급량 및 연관어 정보는 중앙부처의 명칭을 키워드로 하여 시스템에 수집된 온라인 매체 문건에서 언급된  양을 측정하여 해당 기관이 온라인 상에서 이슈가 되는지 확인하는데 사용하는 수치입니다. 기관별 언급량의 수와 같은 시간대의 기관별 언급량의 순위를 제공하여 해당 시점의 어느 기관이 가장 이슈인지 확인 가능합니다. 이러한 기관명 언급량 및 순위는 온라인 일일이슈 등 보고서에 활용 가능합니다.
