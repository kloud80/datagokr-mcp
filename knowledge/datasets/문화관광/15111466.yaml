summary_user: 광주광역시 문화예술관광행사의 장소와 프로그램을 시설·행사 단위로 담은 약 3.5MB 분량의 CSV 파일로, 시설명·주소(지번·도로명)·위도·경도·우편번호와 프로그램 연도·행사명을 건별로 수록한다. 관광 마케팅 담당자나 분석가가 "광주의 어느 시설에서 어떤 연도에 어떤 문화예술 행사가 열렸나"를 확인하거나 행사 장소를 지도에 표시할 때 쓴다. 전역 조인 키(공연예술 식별자나 문화시설 코드 등)는 없어서, 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 좌표 기반 공간 결합으로만 이어 쓴다.
