summary_user: 전국 지자체가 관리하는 관광유람선업 인허가 업소를 사업장 단위로 담은 원천 데이터로, 전체 96건이 1998-12-30부터 2026-09-24까지 범위에 들어 있다. 유람선·크루즈 관광 사업장이 어디에 있고 지금 영업 중인지 폐업했는지 확인하려는 분석가나 사업자가 인허가일자·영업상태·소재지를 조회하는 데 쓴다. 도로명주소·지번주소·영문상호주소(address) 키로 다른 주소 기반 데이터와 이어 쓰고, 관광진흥법 등록 원장 성격의 관광 산업 데이터와 함께 볼 수 있다.
description_portal: '문화_관광유람선업 데이터는 유람선, 크루즈와 같은 선박을 이용하여 관광객에게 관광을 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준을 기준으로, 전국의 지방자치단체에서 관리하는 관광유람선업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터의 법령 소관기관 및 문의처 : 문화체육관광부 융복합관광과 / 044-203-2882, 2888 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
