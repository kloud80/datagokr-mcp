summary_user: 국립박물관문화재단이 운영하는 국립박물관 내 편의시설(박물관상품관, 식음료점)의 매장별 1월~12월 월별 이용객 수와 연간 합계를 담은 집계 파일(csv, 약 2KB)이다. 박물관 상권 분석가나 입점 검토 사업자가 "어느 매장·업종에 이용객이 많고 어느 달에 몰리는가"를 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키가 없어 상호·매장명을 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 국립박물관문화재단이 운영하는 국립박물관 내 편의시설(박물관상품관, 식음료점) 월별 이용객 현황 정보로, 상호(문자형), 매장명(문자형), 1월(숫자형)부터 12월(숫자형)까지의 월별 이용객 수 등의 항목을 포함하고 있습니다.국립박물관문화재단이 운영하는 편의시설로는 박물관상품관과 식음료점이 있습니다.박물관상품관에서는 유물 재현품, 명인의 수공예 작품, 박물관 방문을 기념할 수 있는 소품, 전통을 현대적으로 재해석한 생활용품, 어린이 대상의 교육·체험형 상품, 전시 도록 및 문화예술 관련 서적 등 다양한 상품을 만나볼 수 있습니다. 식음료점으로는 다양한 메뉴를 즐길 수 있는 푸드코트 외 한식당과 이탈리안 레스토랑이 있으며, 전통 찻집, 카페 등이 있습니다.각 편의시설마다 1월부터 12월까지 월별 이용객 변화 추이를 파악할 수 있습니다.해당 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 문의해주시기 바랍니다.
