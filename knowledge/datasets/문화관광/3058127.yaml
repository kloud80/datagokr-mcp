summary_user: 대한체육회가 회원종목단체별 대회 경기영상을 경기 한 건 단위로 모은 목록으로, 종목·대회년도·대회명·대회 기간·경기장·종별·세부종목·라운드와 영상 시청 URL을 담는다(CSV 약 21MB, 전국 범위). 지도자·선수·분석가가 '특정 종목의 지난 대회 결승 영상을 어디서 볼 수 있나'를 찾거나 경기 전략 분석용 영상을 고르는 데 쓴다. 공통 조인 키나 코드가 없어 다른 대회 결과·선수 데이터와는 종목명·대회명·대회년도 같은 이름 매칭으로만 잇는다.
description_portal: 대한체육회는 각 회원종목단체의 경기영상을 통합하여 제공하고 있으며, 이 데이터에서는 각 경기영상 정보에 대한 상세한 내용을 제공합니다.경기 영상의 종목명, 대회년도, 대회명, 대회시작일, 대회종료일, 경기장 등 대회의 기본 정보를 제공합니다. 또한, 종별명, 세부종목명, 라운드 등 경기 자체에 대한 구체적인 정보와 함께, 해당 경기 영상을 시청할 수 있는 URL을 포함하고 있습니다. 이 데이터를 활용하면 특정 종목의 과거 경기 영상을 찾아보거나, 선수들의 경기 기록과 전략을 분석하는 데 유용하게 활용될 수 있을 것입니다.
