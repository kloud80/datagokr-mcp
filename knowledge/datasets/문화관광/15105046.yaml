summary_user: 국립국악원이 소장한 고서를 한 건씩 담은 목록으로, 자료명·저자·소장 DB·주제 분류·키워드·크기·내용·공간·시간 범위·언어·저작권 정보를 담는다. 국악 연구자나 교육 자료 개발자가 특정 의궤·악보·의례 관련 고서가 국립국악원에 있는지, 어떤 내용과 시기를 다루는지 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 자료명·인물명 같은 이름 매칭이나 같은 기관 자료끼리만 연결하며, KOPIS 공연ID 같은 공연 키와는 바로 이어지지 않는다.
description_portal: 국립국악원이 소장하고 있는 다양한 고서에 대한 상세 정보를 제공하여 전통 음악과 관련된 학술연구 및 문화유산 연구에 활용할 수 있도록 지원합니다. 주요 항목으로는 자원의 명칭, 저자, 발행사항, 형태사항, 소속 DB, 주제 분류, 키워드, 크기, 내용, 공간 및 시간적 범위, 언어, 저작권 정보 등이 포함되어 있습니다. 연구자와 일반 이용자는 이 데이터를 통해 전통 음악, 악기, 의례, 의궤, 악보 등 다양한 분야의 자료를 탐색하고 분석할 수 있으며, 문화유산 보존 및 교육 자료 개발에도 유용하게 활용할 수 있습니다.
