summary_user: 경기도 31개 시군에서 인허가를 받은 관광사업자(여행업 등)를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 사업장명·인허가일자·영업상태·폐업일자·주소·WGS84 좌표·면적·자본금·부대시설 등을 포함한다. 특정 시군에 지금 영업 중인 여행사가 몇 곳이고 최근 몇 년 사이 어디서 폐업이 늘었는지 확인하려는 분석가나 사업자가 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)·시군명, 주소, 위경도 좌표, 사업장명 매칭으로 다른 경기도 데이터나 행정구역·지도 데이터와 잇는다.
description_portal: 경기도 내 관광사업자 현황입니다.사업자명, 영업상태명, 소재지도로명주소, 소재지지번주소 등을 제공합니다.※경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내에서 인허가를 받은 ‘관광사업자’의 운영 현황을 정리한 자료로, 여행업(일반여행업, 국내여행업, 국외여행업 등)을 포함한 관광산업 종사 사업체의 설립 및 운영 상태를 나타냅니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태(운영중·폐업), 소재지 정보(도로명주소, 전화번호), 면적, 부대시설 내역, 기획여행보험 기간, 놀이시설·방송시설·의무실·안내소 등 보유 여부를 포함한 총 49개 항목으로 구성되어 있습니다.관광사업자는 관광진흥법에 따라 등록된 사업체로, 여행상품 기획·판매, 관광객 안내 및 운송, 외국인 관광객 유치, 숙박 연계 서비스 등 다양한 업무를 수행하며, 이들은 지역 관광경제 활성화, 문화교류 확대, 외래 관광객 수용 역량 강화에 중추적인 역할을 합니다. 이 데이터는 관광산업 분포 및 규모 파악, 영업 중단 사업체 분석, 지역 기반 관광콘텐츠 산업화 전략 수립, 여행업체 보험관리 이력 점검 등 다양한 행정 및 민간 서비스 개발에 활용될 수 있습니다.본 자료는 경기도 및 관할 시군의 관광 관련 부서에서 수집한 공공데이터로, 지역별 관광산업 현황 및 관광정책 수립을 위한 핵심 기초자료로 사용됩니다.
