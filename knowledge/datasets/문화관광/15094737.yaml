summary_user: 2018년 이후 제주도에서 '근무 내국인'으로 분류된 유동인구를 월 단위로 집계한 통계로, 기준연월·성별·연령대·시간대별 근무인구(work_population_count)를 담는다. 제주 지역 출퇴근 시간대 통근 인구 규모나 성·연령별 근무인구 변화를 파악하려는 분석가·정책 담당자가 "어느 시간대에 근무인구가 몰리는가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연월이나 성별·연령대 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 2018년 이후 제주도에서 “근무 내국인”으로 분류된 유동인구가 월 단위로 어떻게 변화했는지를 집계한 통계자료입니다. “유동인구”는 하루 01시부터 24시까지 매 정각마다 그 시간에 머문 시간(분)을 60분으로 나눈 값을 기준으로 산출되며, 월별로 합산한 값이 “근무인구”로 정의됩니다. 제공기관은 제주특별자치도청이며, 관리 부서는 디지털혁신과, 파일 형식은 CSV로 공개되어 누구나 무료로 다운로드 가능합니다. 이 정보는 제주지역 노동인구의 시간·공간적 이동 패턴 분석, 출퇴근 흐름 및 통근 인구 규모 파악, 교통·도시 인프라 수요 예측, 도시계획 및 지역정책 수립, 거주-근무 인구 분포 변화 모니터링 등에 활용될 수 있습니다. 다만 수집된 시점 이후 인구 이동, 고용 변화, 통근지 변동 등으로 인한 구조 변화는 반영되지 않을 수 있습니다.
