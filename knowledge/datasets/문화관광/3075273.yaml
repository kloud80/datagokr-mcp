summary_user: 부산광역시 서구 관내에 있는 국보·보물 등 지정 문화재를 한 건씩 담은 파일 목록으로, 문화재명·종별·지정번호·지정일자·시대·관리주체와 소재지 주소·위도·경도를 개별 문화재 단위로 담는다. 서구에 어떤 지정 문화재가 어디에 있고 누가 관리하는지 확인하려는 주민·연구자·관광 콘텐츠 기획자가 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록과는 문화재명·종별·지정번호를 대조해 맞춰야 하고, 위도·경도로 지도나 다른 위치 데이터와 겹쳐 쓴다.
description_portal: 부산광역시 서구 관내 소재한 국보·보물 등 문화재의 현황 데이터입니다.데이터에는 문화재명, 소재지, 관리주체, 지정번호, 지정일자, 시대, 종별, 담당자 전화번호, 데이터 기준일자, 위도, 경도 등의 항목이 포함되어 있으며, 이를 통해 문화재의 위치, 관리기관, 시대별 분류, 지정 상태 등을 확인할 수 있습니다.예시 데이터에는 ‘심지백 개국원종공신녹권’, ‘동궐도’, ‘감지은니묘법연화경 권3’ 등의 문화재의 상세 정보가 포함되어 있습니다.본 데이터는 문화재 관리 및 보호 정책 수립, 관광·교육 콘텐츠 개발, 연구 및 학술자료 활용, 문화재 위치 기반 재난·보호 계획 수립 등 다양한 분야에서 활용될 수 있습니다.
