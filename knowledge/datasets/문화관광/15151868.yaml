    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: false
        desc: 한 페이지 결과 수
      - name: pageNo
        required: false
        desc: 현재 페이지 번호
      - name: MobileOS
        required: true
        desc: 'OS 구분 : IOS (아이폰), AND (안드로이드), WEB (웹사이트), ETC'
      - name: MobileApp
        required: true
        desc: 서비스명(어플명)
      - name: baseYm
        required: true
        desc: '조회 기준 연월 (형식 : YYYYMM)'
      - name: areaCd
        required: true
        desc: 지역 코드 (지역/시군구 코드 파일 참고)
      - name: signguCd
        required: false
        desc: 시군구 코드 (지역/시군구 코드 파일 참고)
      - name: tarSjrnDsIxCd
        required: false
        desc: '관광 체류 강도 지표 코드 (21 : 전체, 2101 : 타권역 방문자 비중, 2102 : 숙박 비중, 2103 : 1박 방문자수, 2104 : 2박 방문자수, 2105 : 3박 방문자수)'
