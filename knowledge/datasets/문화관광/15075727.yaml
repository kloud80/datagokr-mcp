description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다"* 감수굴밭담길은 제주시 구좌읍 평대리에 위치한 약 1.5km 길이의 전통 밭담 산책길로, 오래전부터 제주 농경문화의 특징을 보여주는 현무암 밭담과 자연 지형을 따라 조성된 마을길이 이어져 있으며 농촌 풍경과 목가적 정취를 느끼며 걷기 좋은 코스로 활용되고 무장애 관광지 주변정보 데이터에는 주차장, 접근 가능한 보행로 등의 정보가 제공되어 교통약자·고령자·유모차 이용자 등이 비교적 편하게 이동할 수 있는 열린 관광지로서 관광 안내와 무장애 여행 코스 설계 자료로 활용할 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
