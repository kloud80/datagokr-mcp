summary_user: 울산광역시 중구에 있는 문화재를 한 건씩 명칭, 종목, 소재지, 지정일자, 문의처로 정리한 목록 파일로, 2,386바이트 크기의 작은 CSV입니다. 중구 주민이나 관광·문화정책 담당자가 '중구에는 어떤 지정 문화재가 어디에 있고 언제 지정됐나'를 확인할 때 쓴다. 전역 조인 키(국가유산청 종목코드·지정번호, 소재지 PNU 등)가 없어 국가유산청 유산 API나 다른 데이터와는 문화재 명칭이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 울산광역시 중구 문화재현황에 대한 자료로, 울산광역시 중구 문화재현황 정보를 제공합니다.본 데이터는 명칭, 종목, 소재지, 지정일자, 문의처 등의 상세 현황을 확인할 수 있습니다.데이터 출처는 울산광역시 중구 문화관광과 문화유산계 (052-290-3650)이며, 추가적인 내용 요청 및 수정은 해당 부서에 요청하시기 바랍니다.업데이트 주기는 연간 업데이트 되며, 본 데이터의 기준일은 2026년 4월 28일입니다. 다음 업데이트는 2027년 4~5월 중 제공됩니다.본 자료는 울산광역시 중구 문화재의 지역별 분포 및 운영 현황 파악, 문화유산 보존 관리 분석, 관광 서비스 수요 예측 및 지역 문화 정책 수립 등을 위한 기초자료로 활용할 수 있습니다.
