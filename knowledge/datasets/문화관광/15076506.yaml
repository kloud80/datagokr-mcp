description_portal: 2005년 문예연감의 공연예술 관련 정보입니다. 총 19개의 시트로 구성되어 있습니다. 각 시트 항목에는 양악 작곡, 양악 기악, 양악 성악, 양악 오페라, 양악 기타, 양악 국내콩쿠르, 양악 국제콩쿠르, 양악 해외 공연, 양악 음악캠프마스터클래스,  양악 출판과 학술행사, 양악 한국음악가음반, 양악 음악계소식, 연극 일반공연, 뮤지컬, 아동극 및 청소년극, 연극제, 연극 워크숍 및 심포지엄, 연극 부문 시상, 연극관련 서적 등의 항목으로 구성되어 있습니다. 연극 워크숍 및 심포지엄 항목은 일자, 행사명, 장소, 주최, 내용으로 구성되어 있습니다. 따라서 파일에서 2005년 문예연감의 공연예술 관련 정보를 확인할 수 있습니다.
