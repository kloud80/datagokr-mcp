description_portal: '서울특별시 서초구 내에서 영화를 수입하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 영화 수입업소는 해외 영화콘텐츠의 국내 유통, 지역 문화 다양성 확대, 영상산업 국제화 촉진 등에서 중요한 역할을 하며, 관련 업소의 행정관리와 인허가 이력 투명성이 산업 질서 유지에 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 인허가 내역, 수입업 신고·변경·폐업 등 행정 정보가 포함되어, 업소별 영업현황과 변동을 명확히 파악할 수 있습니다. 서초구청 등 관할 행정기관이 정기적으로 현황 점검과 자료 갱신을 실시하여 데이터의 신뢰성과 최신성을 높이고 있습니다. 본 데이터는 영화 수입업체 관리, 해외 영상콘텐츠 도입 정책 수립, 시장 동향 분석, 콘텐츠 무역 통계, 관련 업계 연구 등 다양한 분야에서 효과적으로 활용할 수 있습니다. 업계 종사자, 정책입안자, 연구자, 시민 등 누구나 객관적이고 실효성 있는 정보를 제공받을 수 있도록 데이터는 지속적으로 최신화됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
