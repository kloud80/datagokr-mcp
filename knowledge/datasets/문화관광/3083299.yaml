summary_user: 경상북도에서 운영 중인 유원시설업 업소를 한 행에 한 곳씩 담은 목록으로, 업종·대표 상호·소재지·최초 허가일과 안전성 검사 대상·비대상 놀이기구의 기종과 대수를 함께 담는다(CSV 파일 약 3KB 규모). 지역 주민이나 관광 분석가가 '경북 어느 시군에 놀이기구 시설이 있고, 안전성 검사 대상 기구는 몇 대인가'를 확인하는 데 쓴다. 등록번호·사업자번호 같은 전역 조인 키가 없어서, 다른 관광사업 등록 자료나 시군 통계와는 상호명·소재지 문자열을 맞춰서만 이어 쓴다.
