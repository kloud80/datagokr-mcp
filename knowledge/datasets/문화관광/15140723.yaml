description_portal: 서울특별시 광진구_영화상영관 인허가 정보는 광진구 내에서 상업적 목적으로 영화를 상영하는 장소 및 시설에 대한 인허가 정보를 제공하는 공공데이터입니다. 이 데이터는 영화상영관의 명칭, 소재지 주소, 대표자명, 허가(신고)일자, 영업상태(정상영업, 폐업 등), 관리기관, 업태 및 종목명 등의 항목을 포함하고 있어 관내 영화관 운영 현황을 파악하는 데 유용합니다. 본 정보는 지역 문화시설의 분포와 영상 콘텐츠 소비 인프라를 이해하는 데 기초 자료로 활용될 수 있습니다. 또한 신규 문화공간 기획, 관람시설 접근성 분석, 인근 상권 연계 등을 위한 참고자료로도 사용 가능합니다. 위치정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공되며 위도·경도(WGS84) 좌표는 포함되지 않습니다. 본 데이터는 수집일 기준으로 약 3일 전 최신 자료입니다.
