summary_user: 국립중앙박물관과 경주·광주·전주·대구·부여·공주·진주·청주·김해·제주·춘천·나주·익산 지역 국립박물관 14곳의 관람객 수를 날짜(일별)마다 내국인·외국인으로 나눠 담은 집계 파일(CSV, 약 4만 바이트)이다. 특정 국립박물관의 외국인 관람객이 어느 시기에 늘었는지, 지방 국립박물관 간 방문 규모가 어떻게 다른지 비교하는 문화·관광 분석에 쓴다. 실측 컬럼에 공통 조인 키가 없어 박물관 이름(열 이름)과 날짜를 기준으로 문화기반시설총람 등 시설 목록이나 다른 관광 통계와 수작업으로 맞춰 이어 쓴다.
description_portal: 2025년 12월까지의 방문객·관람객(내·외국인) 관련 데이터와 관련하여 안내드립니다.해당 자료는 현재 관련 부서에서 수집·관리 중인 통계 항목으로,일부 데이터는 집계 기준, 공개 가능 범위, 내부 검토 절차 등에 따라즉시 제공이 어려운 경우가 있음을 양해 부탁드립니다.특히 연도 말 기준 자료의 경우, 최종 확정 및 검증 절차가 필요하여업데이트 시점에 차이가 발생할 수 있습니다.보내주신 요청 사항은 담당 부서에 전달하여제공 가능 항목, 제공 방식 및 업데이트 일정 등을 검토하도록 하겠습니다.검토 결과에 따라 추가로 안내가 필요한 경우 별도로 연락드리겠습니다.앞으로도 박물관 운영과 자료 활용에 도움이 될 수 있도록지속적으로 노력하겠습니다.소중한 의견에 감사드리며, 추가 문의 사항이 있으시면 언제든지 연락 주시기 바랍니다.
