summary_user: 부산문화재단이 운영하는 한성1918(부산생활문화센터) 홈페이지의 문화센터 정보를 센터 한 곳 단위로 담으며, 센터명·소재지주소·대표전화·위도·경도·소개 내용이 들어 있다. 부산 시민이나 문화기획자가 '한성1918 생활문화센터는 어디에 있고 연락처는 무엇인가'처럼 생활문화 공간의 위치와 안내 정보를 찾을 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 센터명·주소 문자열을 맞추거나 위도·경도 좌표로 지도·공간 데이터에 겹쳐 쓰는 방식으로만 잇는다.
description_portal: 부산광역시 부산문화재단 한성1918홈페이지 문화센터 데이터를 개방합니다.한성1918은 시민들이 생활 속 다양한 문화 활동에 직접 참여하고 공유할 수 있는 복합생활문화공간입니다. 일상 속 생활문화 환경을 시민들의 자발적인 참여로 만들어갈 수 있도록 만들었습니다. 한성1918의 건물은 1918년 한성은행 부산지점으로 설립된 이래 약 40년간 은행업무를 보던 곳이었습니다. 개인에게 매각되었다가 다시 부산시가 사들여 현재 한성1918-부산생활문화센터로 운영되고 있습니다. 개방되는 데이터에는 문화센터명, 소재지주소, 대표전화번호 등의 데이터를 제공합니다.
