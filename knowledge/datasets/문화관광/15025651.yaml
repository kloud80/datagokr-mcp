description_portal: '해당 데이터는 부산광역시 사상구의 전통사찰 현황 정보(사찰명, 소재지 주소, 면적 )를 제공합니다.전통사찰 : 불교 신앙의 대상으로서의 형상(形象)을 봉안(奉安)하고 승려가 수행(修行)하며 신도를 교화하기 위한 시설 및 공간으로서 제4조에 따라 등록된 것관련법: 전통사찰의 보존 및 지원에 관한 법률(목적: 민족문화의 유산으로서 역사적 의의를 가진 전통사찰과 전통사찰에 속하는 문화유산을 보존ㆍ지원함으로써 전통문화의 계승 및 민족문화 향상에 이바지함)본 데이터는 종교 및 문화 관련 정책 수립, 관광 콘텐츠 기획 등의 참고용 자료로 활용 가능합니다.'
