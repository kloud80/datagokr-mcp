summary_user: 경상북도 구미시 관내에 등록된 민간 체육시설업체를 업체 한 곳씩 담은 명부로, 업종·상호·우편번호·지번 및 도로명 주소·전화번호를 담는다. 시민이 가까운 헬스장이나 체육도장을 찾거나, 분석가가 구미시 안에서 업종별 체육시설업체가 어느 동네에 몰려 있는지 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소나 상호 이름을 맞춰 연결하며, 같은 축의 상권·인허가 데이터와 주소 기준으로 이어 쓴다.
limits: 인허가번호·사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하려면 주소·상호명 매핑이 필요하다. 범위는 구미시 한 곳이라 다른 시군구와 비교하려면 지역별 데이터를 따로 모아야 한다.
