summary_user: 경기도 성남시 안의 출판사·인쇄소를 사업장 한 곳당 한 행으로 담은 파일로, 구·동, 업종, 사업장명, 도로명 소재지 주소를 기록한다. 인쇄를 맡길 업체를 찾는 시민이나 사업자가 '분당구·중원구·수정구 중 어디에 어떤 인쇄소·출판사가 있나'를 확인하거나, 분석가가 구·동별 출판·인쇄업 분포를 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 구·동 이름이나 도로명주소를 문자열로 맞추거나 주소를 좌표로 바꿔 연결해야 한다.
description_portal: 성남시 내 출판 및 인쇄소 현황 데이터로 구별, 동별, 업종, 상호명, 소재지도로명주소 등의 항목으로 구성되어 있습니다.성남시는 분당구, 중원구, 수정구를 중심으로 다양한 출판 및 인쇄업체가 분포해 있습니다. 중원구와 수정구에는 전통적인 오프셋 인쇄소가, 분당구에는 디지털 기반의 디자인 인쇄업체가 밀집되어 있는 편입니다. 출판사는 주로 교육출판, 독립출판, 종교 관련 출판 형태로 구성되어 있으며, 소규모 사업장이 많습니다. 성남시  관련 업체 정보는 공공데이터포털을 통해 상호, 주소, 업종별로 확인할 수 있다.
