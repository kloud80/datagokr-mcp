description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로, 연도별 수능 관련 기사와 난이도 보도의 비중을 분석한 메타정보 자료입니다. 2013년부터 주요 언론에서 보도된 수능 기사 수와 그중 난이도 및 등급컷과 직접적으로 연관된 기사 수를 집계하여, 전체 대비 보도 비율을 수치화했습니다. 이를 통해 특정 연도별로 수능 난이도에 대한 언론의 관심이 어떻게 변화했는지, 교육 담론 속에서 난이도 문제가 얼마나 비중 있게 다루어졌는지를 객관적으로 확인할 수 있습니다. 본 자료는 수능 난이도와 관련한 사회적 파장, 입시 정책 논의, 학부모와 수험생의 관심사 변화를 분석하는 데 활용될 수 있으며, 교육 정책 연구자, 언론학자, 교육 현장 관계자들에게 유용한 참고 자료가 됩니다.
