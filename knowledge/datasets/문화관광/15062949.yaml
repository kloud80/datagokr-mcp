summary_user: 경상남도 계절관광 정보를 관광 콘텐츠 한 건마다 명칭(data_title), 계절 구분, 소개 내용, 코스 안내, 주소·전화·홈페이지, 이미지 링크 단위로 담은 시도 범위의 원천 목록이다. 여행객이나 여행 앱 개발자가 '이번 가을 경남에서 가볼 만한 곳과 추천 코스는 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 명칭·주소를 맞추는 방식으로만 연결한다.
limits: contentId 같은 공통 식별자나 지역코드가 없어 다른 관광 데이터와 자동으로 결합되지 않고, 이름·주소 매칭에 의존해야 한다. 호출에는 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
