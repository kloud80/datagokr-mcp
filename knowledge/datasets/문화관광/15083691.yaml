summary_user: '인천광역시 부평구에 체육시설법에 따라 신고된 체력단련장(헬스클럽·피트니스·요가·필라테스 등)을 업소 한 곳당 한 줄로 담은 명부 파일로, 업종·상호·도로명 주소·전화번호를 담는다(약 13KB CSV). 부평구 주민이나 창업 예정자가 "우리 동네에 헬스장·필라테스 업소가 어디에 몇 곳 있나"를 확인하거나, 분석가가 관내 생활체육 시설 분포를 파악하는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 데이터와는 도로명 주소나 상호를 맞춰 보는 방식으로만 이어 쓴다(예: 상권·업소 인허가 데이터).'
description_portal: (체력단련장업 현황) 인천광역시 부평구 내에 등록된 체력단련장업소의 기본 정보「체육시설의 설치·이용에 관한 법률」에 따라 신고된 체력단련장 기준*업소별 컬럼 상세설명○ 업종 → 헬스클럽, 피트니스센터, 요가, 필라테스, 운동교정센터 등 체력단련시설의 업종 유형○ 상호 → 업소 등록 시 기재한 정식 상호명○ 시설주소(도로명) → 해당 체력단련장이 위치한 도로명 기준 주소○ 시설전화번호 → 이용자 문의 및 시설 관련 정보 제공을 위한 전화번호※ 본 데이터는 관내 체력단련시설 분포 현황 파악, 생활체육 시설 정책 수립, 건강증진 기반 마련 등을 위한 기초자료로 활용될 수 있음
