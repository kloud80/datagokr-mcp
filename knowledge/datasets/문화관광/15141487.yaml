summary_user: 서울특별시 종로구에 등록된 게임물배급업 업체의 인허가 정보를 업체 한 곳당 한 행으로 담은 건별 행정 자료로, 인허가일자·취소일자, 영업상태와 상세상태, 폐업일자, 휴업 기간, 소재지 지번·도로명 주소, 좌표, 사업장명 등을 담는다. 종로구에서 영업 중인 게임 배급사가 어디 있는지, 언제 등록하고 언제 폐업했는지를 확인하려는 사업자·분석가의 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 지방자치단체코드(OPNSFTEAMCODE) 같은 같은 기관 코드로만 연결한다.
description_portal: 본 데이터는 서울특별시 종로구에서 게임물배급업을 영위하기 위해 등록된 업체의 인허가 정보를 정리한 자료입니다.수록 항목에는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 「게임산업진흥에 관한 법률」에 따라 인허가 절차를 거친 업체의 행정 정보를 제공합니다. 해당 자료는 게임물 유통 질서 확립과 건전한 유통환경 조성을 위한 관리 기반을 마련하며, 등록·폐업 현황, 영업상태 변화 등을 체계적으로 파악할 수 있도록 구성되어 있습니다. 또한 콘텐츠산업 육성, 청소년 보호, 게임산업 정책 수립, 관련 민원 대응 등 행정 실무 전반에 걸쳐 활용될 수 있으며, 지역 기반의 문화콘텐츠 산업 구조를 분석하는 데에도 기초자료로 제공됩니다.
