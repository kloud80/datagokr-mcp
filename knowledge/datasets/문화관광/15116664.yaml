summary_user: 구로구 안에서 성인 대상 오락게임기를 두고 영업하는 일반게임제공업소를 사업장 한 곳당 한 행으로 담은 인허가 원천 자료로, 인허가·취소 일자, 영업상태와 상세영업상태, 휴·폐업 기간, 시설면적·층수, 주소와 좌표를 포함한다. 구청 담당자나 분석가가 '구로구에서 지금 영업 중인 게임장은 어디이며 학교·주거지 가까이 몰려 있는가'를 확인하거나 위생·소방 점검 대상을 고를 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 주소·업소명 매칭이나 좌표(X, Y)를 이용한 공간 결합으로 잇고, 같은 기관이 쓰는 개방서비스 코드·관리번호(MGTNO)는 서울시 다른 인허가 자료와 맞출 때만 쓴다.
description_portal: 일반게임제공업 인허가 정보는 구로구에서 성인 대상 오락게임기(아케이드 등)를 설치·운영하는 사업장의 인허가 일자, 영업상태명, 기기수, 시설면적, 지번주소 및 좌표정보 등을 기록한 행정자료이다. 일반게임제공업은 기계·기구 수량과 안전·위생 기준 준수가 요구되므로, 시설규모·게임기수·부대시설 정보는 운영 건전성 평가에 중요한 역할을 한다. 영업상태 및 상세영업상태 이력은 행정처분 여부, 휴·폐업 흐름, 위생·안전 점검 대상 선정을 위한 기초자료로 쓰인다. 좌표 기반 위치 정보는 업소 분포를 시각화하여 학교·주거지역과의 거리, 상업지역 밀집도 등을 분석하게 해주며, 유해환경 관리 정책과 연계한 고위험 지역 식별에도 활용된다. 해당 자료는 성인 오락시설의 건전성 관리, 공중위생·소방 점검, 도시환경 관리 정책에 모두 중요한 기반이 된다.
