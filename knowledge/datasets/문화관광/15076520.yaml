summary_user: 한국문화예술위원회가 운영하는 Ak문학에 실린 국문학 학술행사 정보를 행사 한 건당 한 행으로 담은 파일(csv, 약 108KB)로, 연도·학술행사명·회차·시작일·종료일·주최 학회·장소·행사내용을 포함하며 포털 설명상 2015~2018년 행사를 다룬다. 연구자나 대학원생이 '한국고소설학회나 한국시가학회 같은 학회가 그 시기에 어떤 주제로 언제 어디서 학술대회를 열었는가'를 확인하거나 학회별 학술행사 이력을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주최 학회명이나 장소명 같은 이름을 맞춰서만 이어 쓸 수 있고, 공연·문화시설 키(kopis_id, cultural_facility_cd)와는 바로 연결되지 않는다.
limits: 명세상 이벤트 주기로 생성된 뒤 바뀌지 않는 자료라서, 포털 설명의 2015~2018년 이후 학술행사 일정은 담기지 않는다고 보고 써야 한다. 행정구역 코드가 없는 전국·비공간 자료라 지역별 집계나 지도 표시에는 장소 텍스트를 따로 정제해야 한다. 내부 검토에서는 보조 등급으로 분류되었다.
