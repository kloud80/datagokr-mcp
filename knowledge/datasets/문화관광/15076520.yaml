description_portal: Ak문학의 학술행사정보입니다.  각 구성 항목으로는 연번, 연도, 학술행사명, 회차, 시작일, 종료일, 주최, 장소, 행사내용, 비고로 구성되어 있습니다. 연도 항목으로는 2015부터 2018까지로 구성되어 있습니다. 시작일과 종료일은 날짜 형식으로 구성되어 있으며 2015-01-17과 같은 형식으로 나타나 있습니다. 주최 항목은 한국고전여성문학회, 한국문학치료학회, 한국고소설학회, 한국시가학회, 한국비평문학회 등의 항목으로 구성되어 있습니다.  학술행사명 항목은 "한국비평문학회 2015년 학술대회 및 총회"와 같은 행사명으로 구성되어 있습니다.
