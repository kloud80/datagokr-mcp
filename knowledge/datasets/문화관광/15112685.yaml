summary_user: 서울특별시 동작구 구립도서관이 보유한 전자도서를 한 권(건)씩 나열한 목록으로, 제목·저자·출판사·국제표준도서번호·보유 수량·카테고리·콘텐츠 유형·모바일/웹뷰어 이용 여부·입고일자를 담는다(동작구 단위, CSV 약 1.7MB). 동작구 주민은 읽고 싶은 책이 구립도서관 전자도서로 있는지, 웹이나 모바일로 바로 볼 수 있는지 확인하는 데 쓰고, 분석가는 분야별 전자도서 보유 구성과 입고 추이를 살피는 데 쓴다. 실측에서는 전역 조인 키가 확인되지 않아 다른 데이터와는 제목·저자 같은 이름 매칭으로 연결해야 하며, 국제표준도서번호 열이 있으므로 국가서지나 도서관정보나루의 ISBN 기반 자료와 대조할 수는 있다.
limits: 동작구 구립도서관 전자도서만 다루므로 종이책 소장 현황이나 다른 자치구·도서관과의 비교에는 쓸 수 없다. 실측상 전역 조인 키가 없어 다른 데이터와 연결하려면 이름 매핑을 해야 한다.
