summary_user: 용인시 공공체육시설을 시설 한 곳 단위로 담아 시설명·시설구분·주소·관리자·이용료·연락처와 부지면적·규격·면수·재질을 제공하는 시군구 범위의 API다. 용인 시민이 '집 근처 공공 테니스장이나 운동장이 어디 있고 이용료와 문의처는 어떻게 되나'를 확인하거나, 분석가가 시 안의 체육 인프라 분포와 규모를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 같은 이름 매칭이나 같은 기관 자료로만 연결하며, 문체부 전국체육시설 DB와 대조할 때도 이름·주소 기준으로 맞춘다.
description_portal: 본 데이터는 용인시 공공체육시설 정보 조회 API를 통해 제공되는 체육시설 현황 정보를 활용하기 위한 자료이다. 결과코드, 결과메시지, 한 페이지 결과 수, 페이지 수, 데이터 총 개수는 서비스 호출 결과의 상태와 응답 구조를 확인하는 데 사용된다. 번호별로 시설명, 시설구분, 주소, 관리자명, 이용료, 연락처를 제공하여 시민이 공공체육시설의 위치와 기본 이용 정보를 손쉽게 파악할 수 있도록 하였다. 또한 부지면적, 시설규격, 시설면수, 시설재질 정보는 시설 규모와 이용 환경에 대한 세부 특성을 이해하는 데 활용된다. 본 데이터는 생활체육 활성화, 공공체육시설 이용 안내, 체육 인프라 관리 및 정책 수립을 지원하는 기초 자료로 기능한다.
