summary_user: 창원시 대표 축제인 진해군항제와 마산가고파국화축제의 연도별 개최기간(시작·종료일)과 총 방문객수를 축제·연도 단위로 정리한 집계 파일로, 약 900바이트 분량의 작은 CSV입니다. 지역 관광 담당자나 분석가가 '진해군항제 방문객이 해마다 어떻게 변했고 행사기간 길이와 관계가 있는가' 같은 축제 성과 비교에 쓴다. 전역 조인 키는 없으며, 축제명과 개최년도를 기준으로 다른 축제·관광 통계나 TourAPI 행사 정보와 이름 매칭으로 이어 쓴다.
description_portal: 창원시 축제 방문객 현황에 대한 데이터로 진해군항제, 마산국화축제의 10년간 개최일, 행사기간, 방문객수에 대한 데이터를 제공합니다.진해군항제, 마산가고파국화축제 등 창원시의 주요 축제 방문객 수 및 개최 현황 정보를 10년간 정리한 자료입니다. 본 데이터는 연도별 축제명, 행사 기간, 총 방문객 수 통계를 포함하며, 지역 관광 활성화, 축제 성과 분석, 홍보 전략 수립 및 민원 대응 등에 활용될 수 있습니다. gnto.or.kr+8data.go.kr+8mk.co.kr+8방대한 연도별 통계를 포함하므로 엑셀 등 일반 뷰어에서는 일부만 표시될 수 있어, R, Python, GIS 등 분석 기반 도구 사용을 권장합니다.수집 기준, 집계 방식, 기준일 등 세부 정보는 제공기관의 메타데이터나 기술문서를 참조하시기 바랍니다.
