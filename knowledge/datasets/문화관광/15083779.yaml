summary_user: 광주광역시 남구에 있는 공공체육시설을 시설 한 곳당 한 행으로 담은 작은 파일(csv 약 1.6KB)로, 종목·시설명·주소·연락처·시설 현황·담당기관을 담는다. 남구 주민이 근처 테니스장·축구장·파크골프장 같은 공공체육시설의 위치와 문의처를 찾거나, 분석가가 구 단위 체육 인프라 분포를 살필 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소를 맞춰 보거나 같은 기관 단위로만 이을 수 있고, 주소를 좌표로 바꾸면 지도와 겹쳐 볼 수 있다.
description_portal: 현재 광주광역시 남구에 소재한 공공체육시설 현황 및 정보(시설명, 주소, 연락처 등)를 제공합니다. 총 12개소 중, 광주광역시 남구가 소유하고 있는 시설은 총 7개시설로, 봉선 테니스장, 남구 다목적체육관, 승촌게이트볼장, 진월복합운동장, 효천축구장, 승촌파크골프장, 남구 반다비체육센터 입니다. 해당 데이터는 광주광역시 남구청 교육체육과(☎062-607-2451)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 공공체육시설은 주민의 건강 증진과 여가 활동을 지원하기 위해 국가나 지방자치단체가 설치·운영하는 체육 공간입니다. 테니스장, 수영장, 생활체육관, 다목적 경기장 등 다양한 종목의 시설이 포함되며, 저렴한 비용으로 이용할 수 있습니다. 해당 데이터를 통해 체육 인프라 관리, 이용 활성화 계획 수립, 시설 확충 및 보수 우선순위 결정, 생활체육 프로그램 개발 등에 활용할 수 있을 것으로 보입니다.
