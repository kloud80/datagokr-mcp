summary_user: 제주 하모해수욕장 인근 음식점·카페·편의점·숙박시설·관광지를 시설 한 곳씩 정리한 목록으로, 명칭·해수욕장까지 거리·주소·전화번호와 휠체어 진입 가능 여부, 장애인 화장실 제공 여부를 담는다. 휠체어 이용자나 영유아 동반 가족이 '하모해수욕장 근처에서 휠체어로 들어갈 수 있고 장애인 화장실이 있는 식당이나 숙소는 어디인가'를 확인할 때 쓰고, 무장애 관광 지도를 만들 때도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보나 다른 시설 데이터와는 시설 명칭·주소를 맞춰 대조해야 연결할 수 있다.
description_portal: '"제주특별자치도 내 제주특별자치도_하모해수욕장_무장애주변관광지 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도 하모해수욕장 인근에서 장애인·노약자·영유아 동반 가족 등을 위한 무장애 여행 가능 주변 관광시설 정보를 체계적으로 정리한 통계자료입니다. 본 자료에는 음식점, 카페 및 편의점, 숙박시설, 관광지 등 지역 내 주요 시설들의 명칭, 거리, 주소, 전화번호, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등이 포함되어 있으며, 이용자의 접근성 및 이용 환경을 객관적으로 확인할 수 있게 구성되어 있습니다. 또한 이 정보는 무장애 관광 지도 개발, 관광서비스 접근성 개선, 관광정책 수립 및 평가에 유용한 기초자료로 활용됩니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
