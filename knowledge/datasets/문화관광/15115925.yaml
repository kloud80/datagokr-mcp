summary_user: 서울 강서구의 일반게임제공업소(게임장·오락실 등)를 업소 한 곳당 한 행으로 담은 인허가 원천 목록이며, 인허가일자·취소일자, 영업상태와 세부상태, 폐업·휴업 기간, 사업장명, 지번·도로명 주소, 좌표, 시설면적·층수·방 수·조명·비상구 같은 시설 항목을 포함한다. 주민이나 창업 예정자가 "우리 동네에서 지금 영업 중인 오락실은 어디이고 언제 허가됐나"를 확인하거나, 분석가가 구내 게임장 분포와 폐업 추이를 살펴볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체 코드로만 연결한다.
description_portal: 서울특별시 강서구 일반게임제공업 인허가 정보는 게임물관리위원회에서 등급 분류된 전체이용가 또는 일반 게임물을 설치하여 시민들에게 이용할 수 있도록 제공하는 업소에 대한 세부 정보를 포함하고 있습니다. 데이터는 인허가일자, 영업상태, 사업장명, 주소 등으로 구성되며, 강서구 내 게임장, 오락실 등의 운영 실태를 파악하고 지역 내 여가문화 시설의 분포 및 특성을 분석하는 데 활용할 수 있습니다. 또한 청소년 이용 가능 여부나 업종 특성에 따른 정책 수립, 민원 대응, 도시계획 등의 행정업무 수행에도 유용한 자료로 활용됩니다. 게임물 유통 및 제공업의 건전한 관리와 문화산업의 활성화를 위한 기초 데이터로서의 가치가 높습니다.
