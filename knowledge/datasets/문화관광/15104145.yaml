summary_user: 인천광역시 부평구가 외국인 이용에 편리하도록 지정한 음식점을 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·소재지 주소·전화번호·업태(한식·중식 등)를 수록하며 파일 크기는 345바이트로 작다. 부평구를 찾은 외국인 관광객이나 거주 외국인, 이들을 안내하는 담당자가 '부평구에서 외국인이 이용하기 편한 음식점은 어디이고 어떤 업태인가'를 확인하는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 소재지 주소나 업소명을 매칭하는 방식으로만 이어 쓸 수 있다.
