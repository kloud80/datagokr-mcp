description_portal: 이 데이터는 서울특별시 광진구 내에서 일반야영장업 인허가를 받아 운영 중인 업소 현황을 제공하는 공공데이터입니다. 일반야영장업은 야외에서 숙박이 가능하도록 텐트 설치 공간, 샤워장, 화장실 등 야영에 필요한 기본적인 시설과 설비를 갖추고, 이용객에게 안전하고 쾌적한 야영 환경을 제공하는 업종입니다. 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등의 정보가 포함되어 있으며, 광진구 내 캠핑 문화 확산, 도시형 여가 공간 분석, 관광 인프라 조성 등을 위한 기초 자료로 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되지 않아 지도 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준 자료로 정기적으로 갱신되며, 지역관광정책, 야외활동 안전관리, 친환경 여가시설 운영 등 다양한 분야에 활용할 수 있습니다.
