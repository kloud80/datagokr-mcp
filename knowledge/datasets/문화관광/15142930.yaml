summary_user: 부산광역시 서구에 있는 공공체육시설을 시설 한 곳당 한 행으로 담은 건별 목록으로, 시설명·소재지 주소·위도·경도·데이터 기준일자를 제공하는 작은 파일(약 289바이트)이다. 서구 주민이나 생활체육 이용자가 '우리 동네 근처에 이용할 수 있는 공공 체육센터가 어디 있나'를 확인하거나 지도에 시설 위치를 표시할 때 쓴다. 전역 조인 키나 코드는 없어서 다른 데이터와는 시설명·주소 문자열 대조나 위도·경도 기반 공간 결합으로 이어 쓴다.
limits: 범위가 부산 서구 한 구에 한정되고 시설명·주소·좌표만 있어 운영 프로그램, 이용료, 예약·대관 정보는 이 데이터로 알 수 없다. 공통 기관·시설 코드가 없어 문체부 전국체육시설 자료 등과 맞출 때는 이름·주소 매칭에 의존해야 한다.
