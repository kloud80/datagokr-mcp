summary_user: 제주올레트레일 코스를 코스 한 줄씩 담은 작은 목록 파일(CSV, 약 2KB)로, 코스명·거리·소요시간·시점과 종점·데이터기준일자를 담는다. 제주 걷기 여행을 준비하는 여행자나 관광 콘텐츠 분석가가 "어느 올레 코스가 짧고, 어디서 시작해 어디서 끝나는가"를 비교할 때 쓴다. 전역 조인 키가 없어 TourAPI 코스 정보 등 다른 데이터와는 코스명이나 시점·종점 지명을 직접 맞춰 이어야 한다.
