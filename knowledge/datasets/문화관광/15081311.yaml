description_portal: 본 공공데이터는 인천광역시 서해구 내 등록된 비디오물 제작업소의 현황을 정리한 자료입니다. 본 자료는 인천광역시 서해구 내 비디오물 제작업소의 업소명, 소재지, 전화번호, 제작 품목의  항목으로 구성되어 있습니다. 본 데이터는 영상 콘텐츠 제작 및 관련 산업의 분포를 파악할 수 있는 기초자료로서, 문화산업 육성, 미디어 관련 정책 수립, 지역 내 비디오물 제작 관련 산업 현황 분석 등에 활용될수 있을것으로 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
