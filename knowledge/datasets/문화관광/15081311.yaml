summary_user: 인천광역시 서해구에 등록된 비디오물 제작업소를 업소 한 곳당 한 행으로 담은 목록으로, 상호·영업소 소재지·전화번호·취급 제작품목·데이터기준일자를 포함한 작은 CSV 파일(약 6.8KB)입니다. 지역 영상 콘텐츠 산업 현황을 살피는 분석가나 담당 공무원이 "서해구에는 어떤 비디오물 제작업소가 어디에 있고 무엇을 제작하나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 영업소 소재지 주소나 상호 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
