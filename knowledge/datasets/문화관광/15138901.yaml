summary_user: 전국 독립서점을 한 곳씩 담은 건별 목록으로, 서점명·주소·전화번호·좌표와 운영시간·휴무일·카페 유무·독립출판물 취급 여부 같은 운영 정보를 함께 담는다. 독립서점을 찾아가려는 국민이 "우리 동네 근처에 카페를 겸한 독립서점이 있고 언제 여는가"를 확인하거나, 분석가가 지역별 독립서점 분포를 조사하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·서점명 문자열 매칭이나 좌표(COORDINATES) 기반 공간 결합으로만 이어 쓴다.
description_portal: 전국 독립서점의 위치와 운영 정보를 제공하는 자료로, 서점명, 분류, 주소, 전화번호, 좌표, 운영시간, 휴무일, 주차 가능 여부, 대여 가능 여부, 카페 유무, 독립출판물 취급 여부, 네이버 리뷰 유무 등 다양한 세부 항목을 포함합니다. 이를 활용하면 사용자는 가까운 독립서점의 위치와 운영 현황을 손쉽게 확인할 수 있으며, 독립서점 탐방, 지역 문화자원 조사, 위치 기반 서비스 개발, 문화정책 수립 등 폭넓은 분야에서 응용할 수 있습니다. 데이터는 수시로 업데이트되며, 제공되는 정보는 ‘수정일’ 기준으로 유효하므로 최신 현황을 반영한 분석과 서비스 구축이 가능합니다.
