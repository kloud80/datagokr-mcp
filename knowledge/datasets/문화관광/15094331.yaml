description_portal: '입력 파라미터를 이용하여 전수교육관 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_전수교육관 정보 목록 조회 서비스는 무형문화재 전승자가 보유한 전통 기능을 현장에서 교육·전수할 수 있도록 구축된 교육 공간 정보를 온라인에서 체계적으로 조회할 수 있는 디지털 플랫폼입니다. 이 서비스는 전수교육관의 명칭, 위치, 운영 전승자 및 단체, 지정된 전승 분야(예: 전통 문양, 목공, 금속공예 등), 수용 인원, 교육 일정, 체험·실기 교육 내용, 참가비 및 신청 절차, 예약 가능 여부, 제공 강의·교안 자료, 관련 사진·영상 및 프로그램 후기가 포함된 상세 메타데이터를 제공합니다. 이용자는 분야, 지역, 전승자, 교육 기간 등을 기준으로 맞춤형 검색과 필터링이 가능하며, 이 데이터를 통해 교육 기획자, 연구자, 전승교육사, 학생 및 일반인이 현장 중심의 전수교육 정보를 효율적으로 확인하고 전통문화 교육 콘텐츠를 설계·활용할 수 있습니다. 이는 무형유산의 기능적 전승과 교육 활성화, 디지털 기반 교육 인프라 구축에 중요한 기초 자료로서 활용됩니다.'
