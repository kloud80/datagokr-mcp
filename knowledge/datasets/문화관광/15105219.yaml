summary_user: 역사적 가치가 있는 유물·문화유산과 관련된 여행 정보를 자원 한 건 단위로 담으며, 명칭·핵심주제어·시대(temporal)·장소·관람요금·설명·위치 URL 등이 들어 있고 범위는 전국이다. 여행자나 교육자·문화유산 탐방 프로그램 기획자가 '특정 시대나 주제의 유물을 어디서 얼마에 볼 수 있는가'를 찾아 답사·시티투어 코스를 짜는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자원 명칭이나 장소명을 이름으로 맞춰 연결해야 한다.
description_portal: 역사적 가치가 높은 유물과 관련된 여행 정보를 통합적으로 제공하여, 이용자가 다양한 문화유산과 그 배경을 쉽게 이해할 수 있도록 구성되어 있습니다. 주요 컬럼에는 자원의 명칭, 핵심주제어, 참조식별정보, 시간적 범위, 장소, 요금 정보, 지식정보자원위치정보 등이 포함되어 있어, 각 유물의 상세 정보와 위치, 관람 요금, 관련 기관 등 실질적인 여행 계획에 필요한 정보를 한눈에 확인할 수 있습니다. 역사와 문화를 접목한 시티투어 코스 설계, 교육 자료 활용, 문화유산 탐방 프로그램 기획 등 다양한 분야에서 활용이 가능합니다. 여행자뿐만 아니라 연구자, 교육자에게도 유용한 자료로서, 문화유산의 보존과 대중적 확산에 기여합니다.
