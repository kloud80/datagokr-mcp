description_portal: '○ 통계개요* 통계명 : 옥외광고물 허가 및 신고 현황* 작성목적 : 행정기관 등에서 정책수립 및 집행, 연구 활동을 위한 기초자료로 활용* 작성체계 : 지자체 → 행정자치부* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 옥외광고물 허가 및 신고 현황○ 용어설명* 옥외광고물이란 공중에게 항상 또는 일정 기간 계속 노출되어 공중이 자유로이 통행하는장소에서 볼 수 있는 것으로서 간판ㆍ입간판ㆍ현수막ㆍ벽보ㆍ전단이나 그 밖에 이와유사한 것을 말함* 옥외광고물의 종류 : 가로형 간판, 세로형 간판, 돌출간판, 공연간판, 옥상간판, 지주이용간판, 현수막, 애드벌룬, 벽보, 전단, 공공시설이용 광고물, 교통시설이용 광고물,교통수단이용 광고물, 선전탑, 아치광고물 및 창문이용 광고물 등○ 기 타*「옥외광고물등 관리법」상 허가대상 또는 신고대상 광고물 등을 표시하거나 설치하려는자는 특별자치도지사ㆍ시장ㆍ군수 또는 구청장의 허가를 받거나 신고를 해야 함○ 출 처 : 행정자치부'
