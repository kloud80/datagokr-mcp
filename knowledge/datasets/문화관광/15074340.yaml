summary_user: 서울 강서구에서 영업 중인 체력단련장업(헬스장·피트니스센터 등) 업소를 한 곳씩 담은 명부 파일로, 업종·상호·시설주소·시설전화번호를 담는다. 주민이 집 근처 헬스장을 찾거나, 분석가·사업자가 강서구 안에서 피트니스 업소가 어느 동네에 몰려 있는지 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 맞춰 잇고, 같은 축의 상권 데이터나 다른 자치구 체육시설업 명부와 주소 기준으로 함께 본다.
