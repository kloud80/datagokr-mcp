summary_user: 생생문화재·문화재야행 등 지역문화재 활용사업의 프로그램을 건별로 담은 파일(csv, 약 650KB)로, 월·대상문화재·사업명·프로그램 유형·프로그램 내용·장소·참여대상·주관단체·상시 운영 여부를 시도·구군 단위로 기록한다. 지역 주민이나 여행자가 '우리 시군구에서 어떤 문화재 체험·야행 프로그램을 언제 누가 운영하는가'를 찾거나, 분석가가 지역별·사업유형별 운영 현황과 사회적약자 대상 프로그램 분포를 비교하는 데 쓴다. 전역 조인 키(문화재 종목코드·지정번호 등)가 없어 국가유산 지정 목록과는 대상문화재 이름, 지역 통계와는 시도·구군 이름을 맞춰 연결해야 한다.
description_portal: '지역문화재 활용사업 현황은 생생문화재, 문화재야행 등 지역별 운영된 무화재 활용사업 정보를 대상문화재, 사업명, 프로그램 유형, 주관단체 등의 세부항목으로 확인  할 수 있습니다.“국가유산청_지역문화재 활용사업”은 지역에 소재한 문화재를 대상으로 주민 참여형 프로그램, 관광 연계 콘텐츠, 교육·체험 활동 등을 기획·운영하여 문화유산의 가치 확산과 지역 활성화를 도모하는 사업의 현황을 정리한 데이터입니다. 이 자료는 지역문화재를 중심으로 다양한 활용사업이 어떻게 지원되고 운영되고 있는지를 보여주는 핵심 자료로, 정책 기획, 행정 관리, 성과 평가 등에 폭넓게 활용됩니다.📌 기본 정보대상 사업: 지역문화재 활용사업주요 내용: 사업 명칭, 위치, 운영 주체, 프로그램 내용, 지원 금액, 참여 인원 등목적: 문화유산 향유 기회 확대 및 지역문화 활성화데이터 형태: 표 형식(엑셀, 데이터베이스 등)🛠 데이터 구성사업명 및 문화재 정보: 대상 문화재의 명칭, 소재지, 지정 유형(예: 유형문화재, 기념물 등)운영 기관 및 주관 단체: 사업 수행 지자체, 민간단체 등지원 규모 및 예산: 국가 지원금, 지방비, 민간 협력 등 총 집행 내역주요 프로그램 내용: 전통문화 체험, 야행 행사, 문화재 교육, 공연, 전시 등성과 지표: 연간 방문객 수, 만족도 조사 결과, 지역 경제 파급 효과 등🎯 활용 분야지역문화 정책 수립: 지역 맞춤형 문화재 활용 전략 개발행정 및 예산 관리: 사업 성과 분석을 통한 예산 편성 및 배분교육 및 관광 콘텐츠 개발: 문화유산 기반 지역관광 및 교육 자원화학술 연구 및 사례 분석: 문화재 활용 모델 연구와 지역별 성공 사례 도출이 데이터는 지역문화재를 중심으로 한 다양한 활용 사업의 기획, 운영, 성과 등을 종합적으로 파악할 수 있게 하여, 문화유산의 보존과 함께 지역사회 발전을 이끄는 정책적·문화적 기초 자료로 활용됩니다.'
