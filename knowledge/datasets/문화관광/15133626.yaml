description_portal: '1. 사이트 : 인천투어(https://itour.incheon.go.kr/)2. 목록명: 키워드, 검색수3. 데이터 설명  인천광역시는 수도권과 가까운 지리적 이점과 풍부한 관광 자원을 바탕으로 다양한 여행 코스를 제공하고 있습니다. 이에 따라 ‘인천투어’ 관련 검색어 목록(키워드, 카페, 맛집, 관광지, 지역 등)을 공공데이터로 등록함으로써 시민과 관광객에게 유용한 정보를 제공하고, 지역 관광 활성화에 기여하고자 합니다. 해당 데이터는 인천투어패스 제휴지, 인기 관광지(송도 센트럴파크, 월미도, 차이나타운 등), 분위기 좋은 카페, 지역 맛집, 강화도·영종도 등 주요 지역을 포함하며, 검색량 기반으로 구성됩니다. 이를 통해 관광 트렌드 분석, 여행 콘텐츠 개발, 정책 수립 등에 활용 가능하며, 공공데이터포털을 통해 누구나 자유롭게 접근하고 활용할 수 있습니다'
