summary_user: 제주 안덕면 동광마을길을 대상으로 만든 무장애 여행코스 데이터로, 코스상의 지점을 순서대로 한 행씩 담고 위도·경도, 구분, 설명, 상세정보, 전체·추천코스 여부를 함께 싣는다. 휠체어 이용자나 교통약자 가족이 "동광마을길에서 주차장·화장실·쉼터가 어디 있고 어느 구간이 추천 동선인가"를 확인하거나, 지자체·분석가가 열린관광지 개선 대상을 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등과는 지점 이름이나 위도·경도 좌표로 맞춰 이어 써야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_동광마을길_무장애여행코스 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 본 데이터셋은 제주시 안덕면의 동광마을길을 대상으로 수립된 무장애 여행 코스 정보를 제공합니다. 해당 길은 교통약자 및 휠체어 이용자를 위하여 이동 동선, 접근 가능한 지점, 휴식 공간 및 편의시설(주차장, 화장실) 등의 현장 정보가 포함되어 있으며, 노면 및 경사 상태 등 보행환경 요소도 반영되어 있습니다. 이러한 자료는 무장애 관광환경 조성, 열린관광지 확대 및 관광 서비스 개선과 정책 수립 등에 활용될 수 있는 기초자료로 기능합니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
