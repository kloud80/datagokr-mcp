summary_user: 인천광역시가 관리하는 국가지정문화유산 목록을 유산 한 건당 한 행으로 담은 CSV 파일로, 종목·국가유산명·지정일자·소재 시군구가 들어 있다. 인천 시민이나 연구자가 '우리 구에 있는 국보·보물·사적은 무엇이고 언제 지정됐나'를 확인하거나 시군구별 국가유산 분포를 집계할 때 쓴다. 전역 조인 키(국가유산청 종목코드·지정번호 등)가 없어 국가유산청 API나 다른 유산 데이터와는 국가유산명·종목 이름 매칭으로, 지역 통계와는 시군구 이름으로 이어 쓴다.
description_portal: 지정문화유산은 대한민국 문화유산보호법에 의해 국가지정문화유산과 시도지정문화유산, 문화유산자료로 구분된다.국가지정문화유산은 문화유산보호법에 의하여 문화유산위원회의 심의를 거쳐 지정한 중요문화유산으로 국보·보물·국가무형문화유산·사적·명승·천연기념물 및 국가민속문화유산 등 7개 유형으로 구분된다.해당 자료는 인천광역시에서 관리하고 있는 국가지정문화유산에 대한 자료로 종목, 국가유산명, 지정일자, 시군구에 대한 자료를 포함하고있다.인천광역시는 총 71개의 국가지정문화유산을 관리하고 있다.
