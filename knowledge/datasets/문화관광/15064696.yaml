summary_user: 경기도 김포시 안의 전통사찰을 사찰 한 곳당 한 행으로 담은 목록으로, 사찰명·지정번호·도로명 주소·전화번호·데이터 기준일이 들어 있으며 파일 크기는 338바이트로 아주 작습니다. 김포시 주민이나 방문객이 읍면동별로 어느 전통사찰이 있는지 확인하고 운영 문의를 위해 연락처를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사찰명이나 주소를 맞춰 이어 붙여야 한다.
description_portal: 경기도 김포시의 전통사찰 현황에 대한 정보를 제공합니다. 제공 항목으로는 사찰명, 지정번호, 소재지 도로명 주소, 전화번호, 데이터 기준일로 구성되어있습니다. 본 데이터를 통해 김포시 내 읍면동별 사찰 분포 등을 알 수 있고, 사찰 전화번호 항목을 제공해 사찰 운영 등 문의사항 연락에 활용할 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 문화예술과로 연락주시기 바랍니다.
