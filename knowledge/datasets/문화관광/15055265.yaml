summary_user: 경상남도 창녕군에 있는 국가지정·도지정 국가유산을 한 건씩 담은 목록 파일(CSV, 약 15KB)로, 구분·종별·명칭·수량·소유자·위치·지정일·관리단체를 담는다. 창녕군의 보물·사적·천연기념물이 무엇이고 어디에 있으며 누가 관리하는지 확인하려는 주민·관광객·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 자료(종목코드·지정번호)와는 국가유산명·종별을 이름으로 맞춰 이어 쓴다.
description_portal: 경상남도 창녕군에 위치한 국가유산(기존 문화재) 현황입니다. 1. 국가유산구분(국가지정유산,  도지정유산), 종별(국보, 보물, 사적, 천연기념물,  명승, 국가민속문화유산, 국가무형유산, 국가등록문화유산 등), 국가유산명, 규모(수량), 소유자, 위치, 지정일, 관리단체(관리의무자) 정보를 포함하고 있습니다. 2. 데이터기준일은 2025년 9월 1일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다3. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 관광환경국 문화예술과 국가유산팀 055-530-1474로 문의 주시기 바랍니다.
