summary_user: 한국문화예술위원회가 게시한 문화예술 지원 공모사업 공고를 건별로 담은 파일 자료로, 공고마다 구분(공모·결과), 제목, 시작일·마감일, 조회수, 등록일, 작성자를 기록한다. 예술인이나 예술단체가 올해 어떤 공모가 언제 열리고 마감되는지 확인하거나, 분석가가 연도별 공모 공고 수와 접수 기간 패턴을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공고 제목 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 한국문화예술위원회에서 제공하는 공모사업 공고 정보를 정리한 자료로, 문화예술분야 지원사업의 일정과 진행현황을 체계적으로 파악하는 데 활용됩니다. 각 항목은 구분, 제목, 시작일, 마감일, 조회수, 등록일, 작성자로 구성되어 있으며, 구분은 공모와 결과로 나뉘어 있어 사업의 진행 단계별로 정보를 분류할 수 있습니다. 시작일, 마감일, 등록일은 모두 '2024-09-05'와 같은 연-월-일 형태의 날짜 형식으로 기록되어 있어 연도별, 기간별 필터링이 용이합니다. 작성자는 유종원, 관리자(테스트용), 김민주, 변세연, 이송하 등의 인물로 구성되어 있으며, 각 공고의 작성 주체를 파악할 수 있습니다. 제목 항목에는 ‘2025년 베니스비엔날레 제19회 국제건축전 한국관 예술감독 2차 심사(전시계획안 발표(PT), 인터뷰) 대상자 안내’ 등 세부적이고 구체적인 공고명이 포함되어 있어 사업 목적, 대상, 일정, 내용 등을 직접적으로 확인할 수 있습니다. 본 데이터는 예술행정 정보 분석, 공모사업 운영 패턴 파악, 연도별 공고 특성 분석 등에 유용하게 활용될 수 있습니다.
