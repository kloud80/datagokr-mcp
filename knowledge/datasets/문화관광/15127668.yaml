summary_user: 영상물등급위원회가 등급분류한 영화를 건별로 담으며, 등급분류번호·등급분류일자·결정등급과 함께 사용제명·원제명·감독·주연·제작국·상영시간·줄거리, 주제·선정성·폭력성·대사·공포·약물·모방위험 7개 기준별 평가와 흡연·음주·마약·자살·자해·성폭력 표현 여부를 제공한다. 학부모가 특정 영화의 관람등급과 그 사유(내용정보 표시항목)를 확인하거나, 분석가가 연도·제작국별로 청소년관람불가 판정 비율과 유해 요소 추이를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 영화·공연 데이터와는 영화 제목(사용제명·원제명)·감독·제작년도를 맞춰 이름 기반으로만 연결한다.
limits: 다른 데이터셋과 공유하는 공통 식별자가 없어 제목 표기 차이로 매칭이 어긋날 수 있다. 포털 설명상 시스템 구축 이후인 2009년 자료부터만 조회된다. 개발계정은 하루 1,000회 호출로 제한된다.
