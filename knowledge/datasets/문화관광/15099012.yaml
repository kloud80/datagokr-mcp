description_portal: '본 데이터는 충청북도 충주시가 보유·관리 중인 공공미술품의 현황을 제공하는 자료로, 제작연도, 작품명, 작품 유형(예: 조형물, 벽화 등), 작가명, 관리기관, 관리부서, 담당 전화번호 등의 항목으로 구성되어 있음. 해당 미술품들은 시내 주요 공공장소에 설치되어 있으며, 예술적 가치뿐만 아니라 지역의 문화정체성 형성과 도시경관 개선에 기여함. 이 데이터는 공공조형물의 체계적 관리, 도시문화 자산의 보존·활용, 지역 예술가 활동 이력 파악 등에 활용될 수 있으며, 예산계획 수립 및 공공예술 활성화 정책 수립을 위한 기초자료로도 유용함.'
