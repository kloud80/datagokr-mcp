summary_user: 경기도 내 복합영상물제공업소(멀티방 등)를 업소 단위로 담아 인허가·폐업 일자, 영업상태, 주소·좌표, 시설면적·층수·비상계단 여부 같은 시설 정보를 보여준다. 지역 여가시설 분석가나 청소년 정책 담당자가 '우리 시군에 영업 중인 멀티방이 몇 곳이고 최근 폐업이 늘었는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)나 업소명·주소 매칭으로만 다른 경기도 인허가 데이터와 연결하고, 위경도 좌표로 지도 위에 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 복합영상물제공업체(멀티방, 영상체험방 등)의 운영 현황을 정리한 자료입니다. 복합영상물제공업은 영상물 상영과 오락 기능을 함께 제공하는 소규모 문화시설로, 해당 자료를 통해 업종의 분포, 운영 실태, 폐업 추이 등을 확인할 수 있습니다. 특히 음향·편의·소방 시설 여부와 같은 항목은 안전관리 측면에서 중요한 지표로 활용됩니다. 본 데이터는 지역 여가문화 산업의 변동 추세 분석, 시설 운영의 안전성 검토, 청소년 문화공간 관리 정책 등 다양한 공공 및 정책적 활용에 기초 자료로 제공될 수 있습니다.
