summary_user: 대전광역시 동구에 등록된 체육시설업소를 업소 한 곳당 한 행으로 담은 명부로, 업종·상호·우편번호·지번 및 도로명 주소·전화번호를 담는다. 주민이 동구 안에서 가까운 헬스장이나 당구장·체육도장을 찾거나, 분석가가 업종별 민간 체육시설이 동네마다 어떻게 분포하는지 살피는 데 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 상권·인허가 데이터와는 주소나 상호를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대전광역시 동구 내 등록된 체육시설업소 현황을 체계적으로 수록한 데이터로, 업종, 상호명, 주소, 전화번호 등 다양한 정보를 포함하고 있습니다. 이 자료는 지역 주민의 건강 증진과 여가활동 확대를 위한 체육 인프라 현황 파악에 매우 유용하며, 공공 및 민간 체육시설의 분포와 특성을 분석하는 데 활용됩니다. 또한 생활체육 활성화를 위한 정책 수립과 지원 방안 마련에 기초 자료로 활용되어, 주민 만족도 향상과 건강한 지역사회 조성에 기여합니다. 시민들은 가까운 체육시설을 손쉽게 찾아 이용할 수 있어 생활 편의성도 증대됩니다.
