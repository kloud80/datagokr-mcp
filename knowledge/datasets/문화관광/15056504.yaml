summary_user: 경기도 31개 시군의 공공체육시설을 시설 한 곳씩 담은 건별 목록으로, 시설유형(체육관·수영장·풋살장 등)·시설명·연락처·도로명/지번 주소·우편번호·위경도를 담는다. 주민이 '우리 동네 가까운 수영장이나 풋살장은 어디이고 연락처는 무엇인가'를 찾거나, 분석가가 시군별 체육 인프라 분포와 접근성을 비교할 때 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)로 같은 경기도 데이터와 묶거나, 위경도 좌표로 인구·교통 등 공간 데이터와 겹쳐 쓴다.
description_portal: '이 데이터는 경기도 31개 시군 내 공공체육시설에 대한 정보를 제공합니다. 주요 항목에는 체육시설의 유형(예: 체육관, 수영장, 배드민턴경기장, 풋살장 등), 시설명, 연락처, 소재지 정보(도로명·지번·우편번호), 위도·경도 좌표 등이 포함됩니다. 이는 「체육시설의 설치·이용에 관한 법률」에 따라 수집된 자료로, 지역별 체육 인프라 분포 파악, 주민 접근성 평가, 체육 정책 수립, 체력 증진 프로그램 설계 등에 활용될 수 있습니다. 데이터는 시설유형별로 구분되어 있으며, 체계적인 시군 간 비교와 지도 기반 시각화 분석에도 적합합니다.'
