summary_user: 충청남도 보령시 관내 문화유산을 한 건씩 담은 파일로, 지정 구분과 번호, 지정일, 문화유산명, 소재지, 수량·면적, 시대, 소유자·관리자를 담는다(포털 설명상 59건). 지역 주민·관광 기획자·연구자가 '보령시에 어떤 국가·도 지정 문화유산이 어디에 있고 누가 관리하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록 등과는 문화유산명·지정 구분·번호를 직접 맞춰 이어 써야 하고, 소재지 주소로 지도 위치와 연결한다.
description_portal: 문화유산에 대한 국민적 관심 증대와 문화 정체성 확립의 중요성이 높아지면서, 지역 고유의 역사와 문화를 담고 있는 문화유산의 체계적인 보존과 관리 필요성이 중요한 사회적 과제로 대두되고 있습니다. 문화관광 활성화와 지역 브랜드 가치 향상을 위한 문화유산의 관광 자원화와 스토리텔링 개발 요구가 증가하고 있으며, 문화유산교육과 전통문화 계승을 통한 미래 세대의 문화적 소양 함양이 중요해지고 있습니다. 개발 압력과 도시화로 인한 문화유산 훼손 우려가 증가하면서 선제적 보호 대책 마련과 체계적인 관리 시스템 구축의 필요성이 대두되고 있으며, 문화재보호법에 따른 적정한 문화유산 관리와 보존 상태 모니터링을 위한 기초 자료 확보가 중요합니다. 또한 지역 주민들의 문화유산에 대한 이해 증진과 보존 의식 함양을 위한 정보 접근성 향상이 요구되고 있으며, 문화유산 활용 프로그램 개발과 지역 문화 진흥을 위한 정책 수립의 기초 자료 제공 필요성이 증대되고 있어, 충청남도 보령시는 관내 59건의 문화유산에 대한 지정 현황, 위치, 시대적 배경, 관리 주체 등 문화유산 보존과 활용에 필요한 종합적인 문화유산 현황 정보를 제공하고 있습니다.
