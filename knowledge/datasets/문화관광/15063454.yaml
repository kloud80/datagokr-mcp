summary_user: 부산관광포털 비짓부산의 추천 도보여행 코스를 코스·명소 단위로 담은 API로, 코스명·부제·장소·좌표(위경도)·교통정보·상세 설명·대표 이미지를 제공하며 범위는 부산 시 단위이고 개별 주소·좌표까지 내려간다. 부산 여행자나 관광 앱 개발자가 '부산에서 걸어서 둘러보기 좋은 코스와 각 지점의 위치·가는 법은 무엇인가'를 확인하거나 지도에 코스를 표시하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 등 다른 관광 데이터와는 명소 이름 매칭이나 좌표 근접으로만 이어 쓴다.
description_portal: 부산관광포털 비짓부산 내 추천여행 중 도보여행에 대한 정보를 제공하는 서비스 입니다.부산의 관광명소 중 도보로 이용하기 좋은 명소를 코스화하여 서비스 하고 있으며도보여행 추천코스 와 그에 따른 상세정보로 구성된 데이터 입니다.도보여행의 이름, 주소, 홈페이지, 전화번호, 좌표, 상세정보를 제공하고 있으며주변관광지, 여행사진, 리뷰도 함께  제공합니다.다국적 관광객을 위해 한국어, 영어, 일어, 중간체, 중번체 5개국어로 서비스 합니다.더 상세한 정보는 부산관광포털 비짓부산에서 확인 하실 수 있습니다.
