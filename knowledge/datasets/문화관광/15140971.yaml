description_portal: 서울특별시 마포구에서 인허가를 받은  인형뽑기, 오락실 등 전체이용가 게임물을 설치하여 제공하는 업소에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 소재지우편번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명, 문화사업자구분명, 시설면적, 제공게임물명 등의 세부 정보가 포함되어 있습니다. 이 데이터를 통해 시민과 관련 기관은 청소년 대상 게임시설의 합법 운영 여부와 위치를 확인할 수 있습니다.
