description_portal: 관광e배움터는 관광업계 및 예비종사자 대상 직무역량강화를 향상시키기 위해 직무강좌와 공개강좌 맞춤과정을 운영하고 있습니다. 공개강좌는 별도의 로그인 절차없이 공통소양/ 문화유산 교육과정을 학습 할 수 있는 강좌입니다. 제공되는 리스트는 공개강좌의 과정별 상세학습내용과 URL 데이터 이며, 누구나 쉽게 접근하여 자기주도적 학습을 실현하고 전문성을 심화할 수 있도록 지원하고 있습니다.* 관광산업 및 정책, 관광업 경영사무, 디지털 혁신(DX), 국가문화유산, k컬쳐, 음식관광 콘텐츠 등에 대한 교육 내용을 포함하고 있습니다.
