summary_user: 서울올림픽기념국민체육진흥공단이 장애체육인에게 지급하는 경기력성과포상금(구 경기력향상연구연금)의 월정금을 지급연월·종목별로 집계해 담은 전국 단위 API로, 개인별 건이 아니라 종목별 월 지급액을 담는다. 정책 분석가나 장애체육 단체 관계자가 '특정 종목의 장애체육인 포상금 월 지급액이 연월에 따라 어떻게 변했는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 비장애 체육인 포상금 정보 등 같은 기관의 다른 데이터와는 종목명(prg_item_nm)과 지급연월을 이름으로 맞춰 이어 쓴다.
limits: 개인·선수 단위 지급 내역은 없고 종목별 월 합계만 담는다. 공통 코드 키가 없어 다른 데이터와 연결할 때 종목명 표기 차이를 직접 맞춰야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하며, 개발계정은 일 10,000회로 제한된다.
