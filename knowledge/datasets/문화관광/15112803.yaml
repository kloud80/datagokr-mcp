description_portal: 체육인복지 경기력성과포상금 종목별 지급 정보_장애는 서울올림픽기념국민체육진흥공단에서 지급하는 종목별 장애체육인 대상 경기력성과포상금(구 경기력향상연구연금)의 월별 지급 현황 정보를 제공합니다. 경기력성과포상금이 지급된 연월과 해당되는 종목명, 월별 지급되는 월정금액 등의 정보를 포함합니다. 지급연월과 종목명으로 원하는 정보를 검색할 수 있습니다. 간단히 말해 장애체육인의 종목별 경기력성과포상금 월정금을 조회하는 기능입니다. 이 서비스는 장애체육인의 종목별 경기력 보상 현황을 확인하여 포상금 지급의 투명성과 정책적 지원의 근거 자료로 활용될 수 있습니다.
