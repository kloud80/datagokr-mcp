description_portal: '이 데이터는 국가유산진흥원이 주관하는 궁중문화축전(Royal Culture Festival)의 프로그램 정보를 수록한 자료입니다. 궁중문화축전은 조선 왕실의 역사와 문화를 현대적으로 재해석하여 국민과 관광객에게 선보이는 대표적인 국가문화유산 행사로, 본 데이터는 축전 기간 중 운영된 개별 프로그램의 개요와 운영 정보 등을 포함하고 있습니다. 각 프로그램의 명칭, 장소, 일정, 유형, 소개 등 상세한 정보를 통해 궁중문화축전의 콘텐츠 구성과 운영현황을 파악할 수 있으며, 행사 기획 및 홍보자료, 문화정책 수립, 연구자료로도 활용이 가능합니다. - 기준년도: 2026년 ※ 궁중문화축전 프로그램에 대한 자세한 정보는 아래 링크를 참고해주세요. ◎ 국가유산진흥원 궁중문화축전 홈페이지 : https://www.kh.or.kr/fest'
