summary_user: 인천광역시 영종구(포털 설명상 옛 중구) 관내 유원시설업체를 한 업체당 한 행으로 담은 목록으로, 업종·상호·소재지·전화번호를 담는다(약 2.6KB 크기의 작은 CSV 파일). 주민이나 관광객이 '영종 일대에 어떤 놀이시설·체험시설이 있고 연락처는 무엇인가'를 확인하거나, 분석가가 지역 유원시설 분포를 파악하는 데 쓴다. 실측 컬럼에 등록번호·사업자번호 같은 공통 조인 키가 없어서, 다른 관광사업 등록 데이터와는 상호명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 유원시설업이란? 사람들에게 휴식과 오락, 체험을 제공하는 시설을 운영하는 업종을 의미하며 대표적으로 놀이공원, 테마파크, 워터파크 , VR/AR 체험장 등이 포함됩니다. 이는 단순한 놀이와 여가를 넘어 일자리 창출, 지방소멸 및 지역 인구 감소 문제를 완화하는 중요한 역할을 하며 문화• 관광 융합 등 복합적인 사회적 가치를 창출하고 있으며 지역 경제 활성화의 촉진제 역할을 하고 있습니다. 이 데이터는 이러한 역할을 하는 인천광역시 중구 유원시설업의 업종, 상호, 소재지, 전화번호에 대한 정보입니다.
