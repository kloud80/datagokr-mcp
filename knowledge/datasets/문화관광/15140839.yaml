summary_user: 서울특별시 광진구 관내 골프연습장업 인허가 업소를 업소 단위로 담은 명부로, 업소명(BPLCNM)·지번/도로명 주소·인허가일자·폐업일자·영업상태·중부원점TM 좌표·건물 동수·면적·지도자 수 등을 건별로 싣는다. 광진구에서 지금 영업 중인 실내외 골프연습장이 어디에 몇 곳 있는지, 최근 새로 생기거나 문을 닫은 곳이 어디인지 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·업소명·주소를 직접 맞추거나 같은 기관(자치단체) 코드로만 이어 쓰며, 다른 체육시설업 명부와 함께 민간 체육시설·상권 축으로 비교할 때 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 골프연습장업 인허가를 받고 운영 중인 업소의 현황 정보를 제공합니다. 골프연습장업은 「체육시설의 설치·이용에 관한 법률」에 따라 실내 또는 실외 공간에 골프 연습을 위한 설비를 갖추고 일반인에게 유료로 제공하는 업종을 의미합니다. 본 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등 주요 항목이 포함되어 있으며, 이를 통해 지역 체육시설 인프라 파악, 스포츠 여가시설 수요 분석, 생활체육 활성화 정책 수립 등 다양한 분야에서 활용될 수 있습니다.특히, 실내 골프연습장은 도시밀집 지역에서의 운동 공간 확보 수단으로 중요하며, 청소년 및 성인 대상 건강 증진, 레저산업 활성화, 체육복지 확충 측면에서도 의미 있는 시설로 분류됩니다.위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위경도 좌표(WGS84)는 포함되어 있지 않기 때문에 지도 기반 활용 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 정보로 정기적으로 갱신되며, 광진구 내 실내외 골프 연습시설 운영 현황을 파악하는 데 활용할 수 있는 기초자료입니다.
