summary_user: 국립국어원 한국수어사전의 일상생활 용어와 전문용어 가운데 누리집 첫 화면에 하루 3개씩 무작위로 보여 주는 '오늘의 수어'를 표제어 번호와 한국어 대응표현 단위로 담은 CSV 파일(약 310KB)이며, 공간 정보가 없는 전국 단위 자료다. 수어 교육자나 수어 서비스 개발자가 '이 수어 표제어 번호에 대응하는 한국어 표현이 무엇인가'를 확인하거나 수어 학습 콘텐츠를 만들 때 쓴다. 전역 조인 키는 없고, 수어 표제어 번호나 한국어 대응표현을 기준으로 국립국어원의 한국수어사전 계열 자료와 이름·번호를 맞춰 잇는 방식으로만 연결한다.
description_portal: 국립국어원에서 제공하는 오늘의 수어 정보 테이터는 한국수어 표제어의 번호와 그에 따른 한국어 대응표현을 제공합니다. 오늘의 수어 정보는 한국수어사전에 있는 일상생활 용어와 전문용어 수어에서 나타납니다. 하루에 3개씩 노출이 되게 되어있으며, 무작위로  대문 화면에 나타나는 데이터를 의미합니다. 해당 데이터는 교육 현장에서는 수어 교육 자료로 활용할 수 있으며, 언어 연구나 번역, 수어 관련 서비스 개발 등 다양한 분야에서 참고 자료로 활용하기에 적합합니다. 수어와 한국어의 상호 이해 증진과 소통 활성화에 기여할 수 있는 공공데이터입니다.
