summary_user: 대구광역시 서구 관내 동네체육시설을 시설별로 한 건씩 담고, 시설명·주소와 함께 출입문 종류, 출입구 폭과 턱 높이, 경사로 유무와 각도, 휠체어 출입·활동공간, 장애인 화장실·세면대·손잡이, 주차장 유무 같은 교통약자 접근성 항목을 담는다. 휠체어 이용자나 노약자 가족이 '서구에서 턱 없이 들어갈 수 있고 장애인 화장실이 있는 체육시설이 어디인가'를 확인하거나, 구청·분석가가 시설별 접근성 개선 대상을 고르는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 체육시설 데이터와는 시설명(b_store_name)이나 주소를 맞춰 붙여야 한다.
description_portal: 대구광역시 서구 관내 동네체육시설 현황을 바탕으로 출입구 폭, 휠체어 출입가능 유무, 장애인 화장실 유무 등의  교통약자를 위한 상세데이터를 제공하는 서비스본 데이터는 대구광역시 서구청이 제공하는 교통약자의 접근성과 편의성을 고려한 동네체육시설 관련 상세 정보이다. 체육시설의 위치, 출입구 구조, 휠체어 출입 가능 여부, 경사면 유무, 장애인 화장실 및 주차장 유무 등 교통약자의 이용 편의를 판단할 수 있는 항목들로 구성되어 있다. 특히 문 종류, 턱 높이, 출입구 폭, 손잡이 유무 등 물리적 접근 요소와 활동 공간 확보 여부, 세면대와 테이블 설치 정보 등을 포함하여 장애인, 노약자 등의 안전한 이용을 위한 정보 제공에 중점을 두고 있다. 해당 데이터는 교통약자 친화적 공공시설 정책 수립, 시설 개선, 접근성 분석 등에 유용하게 활용될 수 있다.
