summary_user: 여수시 관광문화홈페이지에 등록된 숙박시설을 시설 한 곳당 한 행으로 담은 목록 파일로, 국문·영문 시설명과 주소, 좌표(동서·남북 위치), 홈페이지, 객실 수·등급, 주차·조식·반려동물·장애인 시설 여부, 쿠폰 정보까지 시설별 주소·좌표 단위로 기록한다. 여수 여행을 준비하는 관광객이나 여행 서비스 사업자가 '주차가 되고 반려동물 동반이 가능한 여수 숙소가 어디 있나'처럼 조건에 맞는 숙소를 찾거나 지도에 표시할 때 쓴다. 공통 조인 키가 없어 TourAPI 숙박 콘텐츠나 숙박업 인허가 자료와는 시설명·주소 문자열 매칭이나 좌표 근접으로만 이어 쓴다.
description_portal: 전라남도 여수시 관광문화홈페이지에 등록된 관광지 시설 관련 자료로, 숙박시설명, 영문 표기명, 소재지, 위치 정보, 홈페이지 주소 등 관광객이 숙소를 탐색하고 이용하는 데 필요한 항목을 포함하고 있습니다. 해당 데이터는 여수 지역 숙박시설의 기본 현황을 확인하고, 관광 편의 정보 제공, 여행 일정 수립, 위치 기반 서비스 연계, 관광 안내 자료 활용 등에 사용할 수 있도록 구성되어 있습니다. 또한 국내외 방문객이 숙박시설의 명칭, 접근 위치, 온라인 정보 확인 경로를 보다 쉽게 파악할 수 있도록 지원하며, 관광자원 정보 관리와 서비스 운영을 위한 기초자료로 활용할 수 있습니다.
