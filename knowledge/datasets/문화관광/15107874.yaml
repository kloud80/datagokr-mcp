summary_user: 장애인스포츠강좌이용권으로 이용할 수 있는 등록시설을 시설 단위로 담은 API이며, 시설명·대표 전화번호·도로명주소·상세주소·주종목·시도·시군구 정보를 낸다. 범위는 전국이지만 검증 호출에서 전체 건수와 수신 행이 모두 1건이었다. 장애인 수강생이나 보호자가 사는 지역에서 이용권을 쓸 수 있는 시설을 찾거나 분석가가 지역별 시설 분포를 볼 때 쓰며, 도로명주소(road_addr)와 상세주소(faci_daddr)의 주소 키로 다른 시설·지도 데이터와 이어 쓴다.
description_portal: 장애인스포츠강좌이용권 등록시설은 서울올림픽기념국민체육진흥공단에서 운영중인 장애인스포츠강좌이용권으로 이용가능한 등록시설정보에 대한 데이터로, 시설명, 대표자전화번호, 이용가능한 시설의 도로명주소와 시설상세주소, 주종목명, 시도명, 시군구명 정보를 조회할 수 있습니다. 시도명, 시군구명, 시설명, 주종목명으로 등록시설정보 등의 조회조건으로 장애인스포츠강좌이용권으로 이용가능한 등록시설정보에 대해 원하는 조건을 검색할 수 있습니다. 이 서비스는 지역별 장애인 스포츠 수강 가능 시설 정보를 제공하여 수요자 중심의 강좌 선택과 지역 체육복지 자원 분석에 활용될 수 있습니다.
