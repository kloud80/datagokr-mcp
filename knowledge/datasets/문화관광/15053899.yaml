summary_user: 전남광주통합특별시 관내 관광호텔업 등록 업소를 업소별로 담은 파일 데이터로, 지역·업종분류·등급·호텔명·객실수·소재지·전화번호·운영여부를 한 행에 담으며 파일 크기는 약 2.2KB로 작다. 여행객이나 숙박 시장을 분석하는 사람이 '이 지역에 등급별 관광호텔이 몇 곳 있고 객실은 얼마나 되며 지금 운영 중인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 숙박업 인허가 데이터(공중위생 숙박업 신고 등)나 관광사업 등록 자료와는 호텔명·소재지 주소를 맞춰 이어 붙여야 한다.
