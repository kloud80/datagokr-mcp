summary_user: 울산광역시 안의 게스트하우스·한옥스테이 업소를 한 곳씩 담은 목록으로, 업소명·소개·도로명/지번 주소·대표 전화·홈페이지·좌표(위경도)·수정일 등을 업소 단위로 제공한다. 울산 여행객이 묵을 게스트하우스나 한옥 숙소를 찾거나, 분석가가 울산 소규모 숙박시설이 어디에 모여 있는지 지도로 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키가 없어, 공중위생 숙박업 신고(LOCALDATA) 같은 인허가 자료나 관광 데이터와는 업소명·주소 대조나 좌표 기반 위치 매칭으로만 연결한다.
limits: 범위가 울산광역시 한 곳뿐이므로 전국이나 다른 시도와 비교하는 데는 쓸 수 없다. 표준 업소 식별자가 없어서 인허가 원천과 맞출 때는 이름·주소가 어긋나면 매칭이 틀릴 수 있다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며, 개발계정은 하루 10,000회까지 호출할 수 있다.
