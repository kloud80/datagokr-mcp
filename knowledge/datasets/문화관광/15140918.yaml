summary_user: 서울특별시 광진구 관내 한옥체험업 인허가 업소를 건별로 담은 원천 데이터로, 사업장명·소재지·인허가일자·영업상태·폐업일자·객실 수·중부원점TM 좌표(X, Y) 등을 담는다. 관광 사업자나 분석가가 광진구에서 현재 영업 중인 한옥체험 숙소가 몇 곳이고 어디에 있는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 이을 수 있고, 다른 시군구의 같은 숙박업 인허가 데이터와 같은 형식으로 묶어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 한옥체험업 인허가를 받아 운영 중인 업소 현황을 제공하는 공공데이터입니다. 한옥체험업은 우리나라 전통 건축양식인 한옥을 활용하여 숙박 체험이 가능하도록 시설을 갖추고, 국내외 관광객에게 한국 고유의 주거 문화를 직접 체험할 수 있도록 서비스를 제공하는 업종입니다. 데이터에는 업소명, 소재지, 업종유형, 인허가일자 등의 정보가 포함되어 있으며, 전통문화 관광자원 관리, 도시 내 체험형 숙박 인프라 분석, 외국인 관광 수요 대응 등에 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않아 지도 시스템 활용 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준으로 정기적으로 갱신되며, 문화관광 행정, 숙박업 관리, 지역 특화 콘텐츠 기획 등에 유용한 기초 자료입니다.
