summary_user: 충청남도 천안시에 있는 여행업체를 업체 한 곳당 한 행으로 담은 파일로, 업종·상호·도로명 소재지·전화번호·데이터기준일자를 담는다. 관광객이나 분석가가 '천안시 안에 어떤 종류의 여행사가 어디에 있고 연락처는 무엇인가'를 확인하거나 지역 여행업 현황을 파악하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 상호명이나 도로명 주소를 맞춰 보거나 같은 기관 자료끼리만 연결한다.
limits: 범위는 천안시 한 곳뿐이라 다른 시군구나 전국 여행사와 비교하려면 별도 자료가 필요하다. 명세상 연간 또는 이벤트 때 만들어지고 이후 바뀌지 않는 자료이므로 최신 영업 상태로 단정하지 않는다. 좌표나 등록번호 같은 공통 키가 없어 다른 데이터와 매칭할 때는 주소·상호 기반 정제가 필요하다.
