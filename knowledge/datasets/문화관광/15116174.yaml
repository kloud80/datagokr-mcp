summary_user: 서울 중구의 수영장업 인허가 업소를 업소(관리번호) 단위로 한 건씩 담은 원천 명부로, 인허가·취소 일자, 영업상태(영업·휴업·폐업 등), 지번·도로명 주소, 중부원점TM 좌표, 건물 면적·지도자 수·보험 가입 여부 등을 담는다. 수영장업 창업을 검토하는 예비 사업자가 중구에 현재 영업 중인 수영장이 몇 곳이고 어디에 있는지, 최근 폐업한 곳은 어디인지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 지역·업종의 체육시설업 인허가 데이터와는 업소명·주소 매칭이나 같은 형식의 관리번호·자치단체 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중구의 수영장 등 수영 같은 레크레이션을 즐기기 위해 인공적으로 물을 채워 제공하는 업소 정보입니다. 데이터는 각 수영장업체에 부여된 관리번호, 현재의 영업 상태(등록, 휴장, 폐업 등), 상세 소재지 등 행정처분 이력 등의 주요 항목들로 구성되어 있습니다. 이 자료는 수영장업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 정보를 제공하며, 일반 시민 및 이용자에게는 수영장업의 위치 및 시설 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
