summary_user: 제주특별자치도에 있는 전통사찰을 한 곳당 한 행으로 담은 목록 파일로, 사찰명·소속 종단·소재지 주소·등록일을 담으며 파일 크기는 957바이트 규모의 소량 데이터다. 제주에서 전통사찰로 지정된 절이 어디에 있고 어느 종단 소속인지 확인하려는 주민·관광객·문화유산 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 사찰명이나 소재지 주소를 맞춰 잇거나 다른 시도의 전통사찰 현황과 이름 기준으로 나란히 비교한다.
description_portal: "\"제주특별자치도 내 소재하는 전통사찰 데이터를 제공합니다.항목: 사찰명, 소속, 소재지*'전통사찰의 보존 및 지원에 관한 법률'에 따른 불교 신앙의 대상으로서의 형상(形象)을 봉안(奉安)하고 승려가 수행(修行)하며 신도를 교화하기 위한 시설 및 공간*민족문화의 유산으로서 역사적 의의를 가진 전통사찰과 전통사찰에 속하는 문화유산을 보존·지원함으로써 전통문화의 계승 및 민족문화 향상에 이바지함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1307\""
