summary_user: 제주시 한경면 저지리 생각하는정원 한 곳의 무장애여행 정보로, 주차장·진입로·내부 동선·휠체어와 유모차 이용 구역·장애인 화장실 같은 접근성 지점을 위도·경도·해발고도 단위로 담고 장소 설명과 이미지를 함께 제공한다. 휠체어 이용자나 유모차를 끄는 보호자가 생각하는정원을 찾기 전에 어느 구역까지 이동할 수 있는지, 장애인 화장실이 어디 있는지 확인하는 데 쓰고, 관광 접근성 개선을 검토하는 분석가도 쓴다. 실측 컬럼에는 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소명이나 좌표를 직접 맞춰야 이어 쓸 수 있다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 생각하는정원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 생각하는정원은 제주시 한경면 저지리의 황무지를 개척해 조성된 약 1만여 평 규모의 정원으로, 분재와 한국 고유 수목, 소정원, 연못과 폭포, 돌담길 등 자연과 조경 요소가 조화된 휴식 공간이다. 이 무장애여행 정보 데이터는 주차장과 진입 경로, 내부 이동 동선, 휠체어 및 유모차 이용 가능 구역, 장애인 화장실 등 교통약자를 위한 접근성 정보를 포함하며, 시설 전반의 이용 편의성과 이동 안전성을 객관적으로 확인할 수 있도록 구성되어 있다. 또한 관람 구역별 편의시설 위치, 안내 요소 등을 제공해 다양한 방문객이 안전하고 편리하게 관람할 수 있는 무장애 관광지 정보로 활용된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
