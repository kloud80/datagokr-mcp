summary_user: 광주광역시 일대 광장에서 매주 열리는 생활무용·에어로빅·스포츠댄스 등 무료 생활체육 강좌를 지역·운영장소·운영시간·프로그램 단위로 정리한 1.7KB 남짓의 소규모 CSV 목록이다. 시민이 "우리 동네 광장에서 언제 무슨 생활체육 강좌가 열리나"를 확인하거나, 분석가가 지역별 생활체육 프로그램 분포를 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 체육시설·프로그램 데이터와는 지역명·장소명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 본 자료는(생활체육광장 운영현황) 광주광역시 생활체육 활성화를 위해 생활무용, 에어로빅,  스포츠댄스 등 누구나 이용 또는 활용할 수 있는 광장에서 매주 생활체육광장을 운영하고 있습니다.생활체육광장은 별도 등록 또는 비용이 수반되지 않으며, 광장을 이용하는 시민 누구나 매주, 동일한 시간대에 운영하는 생활체육 강좌를 이용하실 수 있습니다.지역별, 공간별, 시간대별 현행자료는 조만간 현형화하여 재 게시될 예정입니다. 지역 생활체육의 활성화를 위해 많은 시민분들의 관심과 지원 부탁드립니다.
