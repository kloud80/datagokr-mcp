description_portal: 안동시 공공미술 관리현황 데이터는 안동시 관내 공공장소에 설치·관리되고 있는 미술 작품과 조형물에 대한 종합 정보를 제공하는 자료입니다. 본 데이터에는 작품명, 작가명, 설치 장소, 설치 연도, 작품 종류(조각, 벽화, 설치미술 등), 소재 및 재료, 작품 크기, 관리 기관, 유지·보수 현황, 작품 설명 및 관련 이미지 정보 등 다양한 항목이 포함되어 있습니다. 이 데이터는 공공미술 관리의 투명성을 확보하고, 시민과 관광객에게 지역 공공미술 정보를 제공하기 위해 공개됩니다.본 데이터는 시민, 연구기관, 예술 관련 기관, 언론, 관광객 등 다양한 사용자가 활용할 수 있으며, 활용 사례는 다음과 같습니다.지역 공공미술 작품 현황 분석 및 관리 계획 수립문화·예술 정책 연구와 도시 디자인 및 조형물 배치 계획관광 안내 및 문화 콘텐츠 개발, 지역 관광 활성화작품 보수 및 안전 점검 계획 수립예술 교육 및 시민 참여 프로그램 기획 자료 제공공공미술 관리현황 데이터를 통해 안동시는 지역 문화자산 관리의 효율성을 높이고, 공공미술 작품의 보존과 안전성을 확보할 수 있습니다. 또한, 데이터를 공개함으로써 시민과 연구기관, 예술 관련 단체 등이 지역 문화예술 자원을 기반으로 다양한 문화·예술 프로그램 개발과 정책 연구에 활용할 수 있으며, 지역 문화의 접근성과 참여도를 높이는 데 기여합니다.
