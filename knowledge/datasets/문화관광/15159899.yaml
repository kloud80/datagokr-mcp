description_portal: 본 자료는 울산광역시 생활체육 종목 및 동호인 현황입니다.자료출처는 울산광역시  체육회와 5개 구군 각 체육회에서 관리하는 종목 및 동호회를 출처로 하는 자료입니다.각 기초자치단체별 종목별 클럽 수 및 동호인 현황 등으로 관리되고 있습니다.본 자료를 통해 현재 울산광역시에 기반을 둔 생활체육 조정, 양궁등 96개 종목에 대하여 4,400개  클럽 및 종목별 동호회 총 인원수는 262,969명으로  확인 하실 수 있습니다. 시 체육회에서 관리하고 있는 자료는 53개 종목, 2,530개 클럽, 143,920명의 동호인으로 최다 관리. 아직까지는 e스포츠 동호회는 없는것으로 파악되고 있습니다.우리 울산광역시 지역 생활체육 활성화와 종목별 진흥을 위해 생활체육에 많은 관심과 지원을 부탁드립니다.
