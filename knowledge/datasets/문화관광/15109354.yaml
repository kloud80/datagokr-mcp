summary_user: 제주도 각 마을에 있는 요트·낚시·해녀체험·스쿠버다이빙 같은 해양레저스포츠 사업장을 한 행에 한 곳씩 담은 건별 목록 파일(csv, 약 27KB)로, 마을명·사업장명·주소·위도경도·인허가일자·영업상태·안전·편익시설·주차가능수를 함께 싣는다. 여행자나 마을관광 기획자가 '어느 마을에서 지금 영업 중인 스쿠버다이빙 업체와 주차 여건은 어떤가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 관광 데이터와는 주소·좌표나 사업장명·마을명 이름 매칭으로만 잇는다.
description_portal: 제주관광공사_마을해양레저스포츠 데이터는 2022년 공공데이터 뉴딜 사업의 일환으로 구축된 제주 마을관광 정보 데이터 입니다. 제주도 내 각 마을별로 위치한 요트, 낚시, 해녀체험, 스쿠버다이빙 등 주요 해양레저스포츠의  정보를 포함하고 있습니다. 데이터에는 마을명, 해양레저스포츠유형, 시군구명, 읍면동명, 행정리명, 사업장명, 해양레저스포츠유형, 소재지 전화번호, 소재지도로명주소, 소재지지번주소, 위도와 경도, 인허가일자, 상세영업상태코드, 상세영업상태명,  주변환경유형, 편의시설현황, 데이터기준일자 등의 항목을 제공합니다.
