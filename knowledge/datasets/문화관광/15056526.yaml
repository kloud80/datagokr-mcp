summary_user: 경기도 내 골프연습장 업체를 사업장 한 곳당 한 행으로 담은 인허가 명부로, 사업장명·시군·인허가일자·폐업일자·영업상태·주소·위경도와 함께 건물 면적, 지도자 수, 보험 가입 여부, 회원모집 총인원 같은 시설 정보를 싣는다. 우리 시군에 영업 중인 골프연습장이 몇 곳이고 최근 몇 년 사이 개업·폐업이 어떻게 바뀌었는지 보려는 분석가나, 출점 후보지 주변의 경쟁 업체를 확인하려는 사업자가 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·사업장명·정제 주소로 맞추거나 위경도로 공간 매칭하며, 헬스장·당구장 등 다른 체육시설업 명부나 상권 데이터와 같은 축에서 나란히 비교한다.
description_portal: 이 데이터는 경기도 내 골프연습장 운영업체의 현황을 수록한 자료로, 사업장의 명칭, 시군명, 인허가일자, 폐업일자, 영업상태(운영중·폐업·말소 등), 주소, WGS84 기준 위도·경도 좌표 등의 항목을 포함합니다. 골프연습장은 스포츠 활동 및 여가 활용 시설로 분류되며, 이 자료는 시설의 지역별 분포 현황 분석, 폐업률 추이 파악, 인허가 통계, 지역 여가문화 기반 확충, 체육정책 수립, 공공 체육시설 보조정책 개발 등 다양한 분야에서 활용될 수 있습니다.* 골프연습장업은 실내외 골프연습시설을 운영하는 업종으로, 일반 대중을 대상으로 골프 스윙, 퍼팅 등 기술을 연습할 수 있도록 제공하는 체육시설입니다.
