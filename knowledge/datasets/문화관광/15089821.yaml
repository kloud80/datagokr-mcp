summary_user: 국립중앙극장 공연예술박물관이 소장한 공연예술자료의 입수 이력을 건별로 담은 파일(CSV, 약 59KB)로, 입수번호·입수유형·입수명·입수 기간·입수처·최종수정일을 담는다. 국립극단·국립무용단 같은 국립단체나 극장 내부 부서가 어떤 자료를 언제 이관·납본했는지 확인하려는 연구자나 아카이브 담당자가 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 직접 이어지지 않으며, 입수처(단체명)나 입수명 같은 이름을 맞춰서만 다른 데이터와 연결한다.
description_portal: 국립중앙극장 공연예술박물관에서 소장하고 있는 공연예술자료의 입수 정보 데이터베이스입니다.  관리기관, 입수번호, 입수유형, 입수명, 입수일_시작, 입수일_종료, 기간구분, 입수처, 최종수정일의 정보를 제공합니다.국립단체(국립극단, 국립무용단, 국립창극단, 국립발레단, 국립국악관현악단, 국립오페라단, 국립현대무용단 등)와 내부 부서(공연기획팀, 무대예술팀, 홍보팀 등)에서 이관 및 납본한 이력 정보입니다.   본 공공데이터는 2025년 상반기까지 구축된 데이터이며, 연 단위로 신규 등록된 데이터를 업데이트하고 있는 최신 정보입니다.
