description_portal: 이 데이터는 전라남도 강진군에 위치한 다산청렴연수원에서 운영하는 교육 프로그램 정보를 담고 있으며, 교육프로그램명, 교육대상, 총기수, 교육인원, 교육장소, 교육내용, 교육비, 주관기관, 기준일자 등의 항목으로 구성되어 있습니다. 주로 전국의 공직자를 대상으로 운영되며, 청렴과 공직윤리, 다산 정약용의 철학을 중심으로 한 실천적 교육이 이루어집니다. 예를 들어 ‘다산공직관 청렴교육’은 다산의 청렴·애민 정신을 통해 공직자의 역량을 강화하는 프로그램으로, 15기수에 걸쳐 기수당 40명이 참여하며 교육비는 36만원입니다. 또한 ‘공무원 푸소 청렴교육’은 청렴 강의, 농촌 감성체험 등 다양한 현장 중심의 학습을 포함하고 있으며, ‘다산체험프로그램’은 수시로 운영되어 유연한 교육 수요에 대응합니다. 이 데이터는 청렴 교육 정책 수립, 공직자 대상 윤리 교육 운영, 지역 기반 인문학 연계 교육 연구 등에 유용하게 활용될 수 있습니다.
