description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 이호테우해변은 제주시 도심에서 가까운 해변으로, 해변의 상징인 붉은색 및 흰색의 말 모양 등대와 넓은 백사장, 소나무 숲·아카시아 숲을 배경으로 제주다운 자연 경관과 여유로운 해변 산책을 동시에 제공한다. 무장애 관광지 주변정보 데이터에는 장애인 전용 주차구역, 장애인 화장실, 단차 없는 출입구 등이 포함되어 있어, 휠체어나 유모차를 사용하는 방문자 및 교통약자도 비교적 무리 없이 해변과 등대까지 접근할 수 있다. 이 정보는 관광 일정 설계, 열린관광지 홍보, 접근성 중심 여행 코스 구성, 지도 서비스 및 관광 콘텐츠 제작, 공공·관광 정책 기초 자료로 활용하기에 적합하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
