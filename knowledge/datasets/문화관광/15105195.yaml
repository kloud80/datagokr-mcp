summary_user: 올림픽공원에서 열리는 공연을 건별로 담으며, 공연명·기간·장소·주최자·내용 설명·언어·저작권 정보를 한 건씩 제공한다. 시민이나 문화예술 관계자가 '이번 시즌 올림픽공원에서 어떤 공연이 언제 열리고 누가 주최하나'를 확인하거나 공연 일정 동향을 정리할 때 쓴다. 실측 컬럼에 KOPIS 공연ID 같은 전역 조인 키가 없어, KOPIS 공연 목록 등 다른 데이터와는 공연명·장소 이름을 맞춰 연결해야 한다.
description_portal: 올림픽공원에서 개최되는 다양한 공연의 정보를 한눈에 확인할 수 있도록 공연명, 기간, 시간, 장소, 주최자, 내용, 언어, 저작권 등 주요 세부사항을 체계적으로 제공합니다. 공연 일정이나 상세 내용을 미리 파악하고자 하는 시민, 문화예술 관계자, 연구자 등이 공연 관람 계획 수립, 문화행사 분석, 홍보자료 제작 등 다양한 목적으로 활용할 수 있습니다. 최신 공연 동향 파악이나 문화정책 수립, 지역사회 문화 활성화 연구에도 유용하며, 데이터는 정기적으로 갱신되어 신뢰성 높은 정보를 제공합니다. 공연 관련 데이터 활용을 통해 문화예술 접근성을 높이고, 올림픽공원 내 다양한 문화행사 참여 기회를 확대하는 데 기여합니다.
