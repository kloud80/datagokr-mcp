summary_user: 경기도 화성시 관내 전통사찰을 사찰 한 곳당 한 행으로 담은 작은 파일(csv 569바이트)로, 사찰명·소속 종단·창설연도·도로명/지번 주소·전화번호를 담는다. 화성시 안에 어떤 전통사찰이 있고 어느 종단 소속이며 언제 창건됐는지 확인하려는 방문객, 또는 종단별·창건 시기별 분포를 보려는 문화유산·종교시설 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사찰명이나 주소를 기준으로 맞춰 붙여야 하며, 주소를 좌표로 변환하면 지도·주변 시설 데이터와 함께 쓸 수 있다.
description_portal: 데이터는 경기도 화성시 관내에 위치한 전통사찰의 현황을 수록한 자료로, 사찰명, 소속 종단, 창설연도, 소재지 주소 및 전화번호 등의 정보를 포함하고 있다. 전통사찰은 역사적·문화적 가치가 있는 사찰로, 불교 종단에 소속되어 있으며, 지역사회에서 종교적 기능뿐 아니라 문화유산으로서의 역할을 수행하고 있다. 본 자료는 각 사찰의 창건 시기와 종단별 분포 현황을 파악할 수 있도록 구성되어 있으며, 사찰 방문 안내, 문화재 관리, 종교시설 정책 수립 등에 참고자료로 활용될 수 있다. 주소 및 연락처 정보는 사찰별 식별과 이용 편의를 높이기 위해 수록되어있다.
