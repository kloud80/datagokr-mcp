summary_user: 경상남도가 지정한 무형문화재를 종목별로 정리한 파일로, 명칭·분류·보유자 성명과 성별·보유 상세·소재지·지정일자를 담는다(CSV 약 7.5KB 규모의 도 단위 목록). 경남에 어떤 무형문화재가 있고 누가 보유자로 지정돼 언제 지정됐는지 확인하려는 연구자·지자체 담당자·관광 기획자가 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 국가유산 목록이나 다른 시도 현황과는 종목 명칭이나 소재지 주소를 맞춰 이어 쓴다.
