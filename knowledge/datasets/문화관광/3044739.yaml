summary_user: 강원특별자치도 안에서 영화·드라마 등 영상물을 찍은 촬영지를 한 곳씩 담은 목록으로, 시군명·촬영지명·주변 정보로 구성된 소규모 CSV 파일(약 8KB)입니다. 관광객이나 여행상품 기획자가 '강원도 어느 시군에 어떤 드라마 촬영지가 있고 근처에 무엇이 있나'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명 이름 매칭으로만 잇고, 같은 지역의 관광지·문화시설 목록과 시군 단위로 맞대어 쓴다.
limits: 표준 코드나 좌표 같은 조인 키가 없어 다른 데이터와 정확히 연결하려면 시군명·촬영지명을 이름으로 맞춰야 한다. 범위는 강원특별자치도 한 개 시도에 한정되며 위치 좌표가 없는 비공간 데이터라 지도 표시나 거리 계산에 바로 쓰지 못한다.
