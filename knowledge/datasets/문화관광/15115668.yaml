summary_user: 서울특별시 중랑구의 헬스장 등 체력단련장업 업소를 건별로 담은 인허가 명부로, 관리번호·인허가일자·영업상태·폐업일자·사업장명·주소·중부원점TM(EPSG:5174) 좌표 등을 한 업소당 한 행으로 제공한다. 중랑구에서 최근 헬스장이 얼마나 새로 문을 열고 닫았는지를 상권 신호로 보려는 창업자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중랑구의 헬스장과 같은 체격관리 및 근력, 유연성, 지구력 강화 등을 목표로 운동을 할 때 필요한 도구와 기구를 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
