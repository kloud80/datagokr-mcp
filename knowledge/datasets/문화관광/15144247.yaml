summary_user: 국립중앙박물관 한 곳의 관람객 수를 방문일별로 담은 집계 파일(CSV)로, 포털 설명상 2015년 1월 1일부터 2025년 12월 31일까지를 대상으로 합니다. 연도·계절·요일별로 관람객이 얼마나 오는지, 2020~2021년 감염병 시기에 관람객이 얼마나 줄었다가 회복됐는지 확인하는 분석가나 관람 계획을 세우는 사람이 씁니다. 실측 컬럼에 전역 조인 키(문화시설코드 등)가 없어 다른 시설 데이터와는 기관명으로만 연결할 수 있고, 방문일을 기준으로 날짜별 자료와 맞춰 볼 수 있습니다.
limits: 국립중앙박물관 한 곳의 총 관람객 수만 담고 있어 다른 박물관과 비교하거나 전시·연령·지역별로 나눠 볼 수 없습니다. 시설코드나 좌표가 없어 문화시설 총람 데이터와 바로 조인되지 않습니다. 포털 설명의 연도별 합계는 2024년이 빠져 있고 2025년 수치의 기준도 분명하지 않으므로, 파일의 일별 값을 직접 합산해 확인해야 합니다.
