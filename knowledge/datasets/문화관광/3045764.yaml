summary_user: 부산광역시 사하구 관내에 신고된 체육시설업(수영장업·체육도장업 등)을 시설 한 곳씩 업종, 상호, 도로명주소, 전화번호, 최초등록일자로 담은 시군구 단위 명부 파일(CSV)이다. 사하구에서 어떤 동네에 태권도장·수영장이 몇 곳 있고 언제부터 영업했는지 알고 싶은 주민이나, 체육도장 개업 입지를 보는 사업자·상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명주소를 맞춰 잇거나, 같은 기관(사하구)의 다른 파일과 나란히 놓고 쓴다.
description_portal: '부산광역시 사하구 관내에서 신고체육시설업으로 등록된 수영장업 및 체육도장업 관련 시설 현황 데이터를 제공합니다. * 전화번호에 휴대폰번호 등 개인정보가 있을 경우 공백으로 처리합니다. -> 비공개* 일부 전화번호가 미집계되어 공백처리 되어 있습니다.*주요 데이터 컬럼별 상세설명○ 업종 → 사하구 관내에 있는 신고체육시설의 업종 구분(예: 수영장업, 체육도장업 등)○ 상호 → 사하구 관내에 있는 신고체육시설의 상호명○ 시설주소(도로명) → 사하구 관내에 있는 신고체육시설의 소재지 도로명주소○ 최초등록일자 → 사하구 관내에 있는 신고체육시설이 최초로 등록된 날짜'
