description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 송당당오름산책길과소원길은 제주 제주시 구좌읍 송당리에 위치한 숲길과 마을길이 연결된 탐방로로, 둥글고 낮은 봉우리인 당오름 둘레길과 전통 신당이 있는 본향당, ‘소원비 나무’가 있는 소원길을 포함하며 삼나무숲·숲길·포장도로 등이 적절히 조성되어 자연 속 산책과 지역 신화를 체험할 수 있는 열린 공간으로 설계되었고 일부 구간은 무장애 접근 조건을 고려해 휠체어 이용자도 이용 가능한 코스 정보가 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
