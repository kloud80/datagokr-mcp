description_portal: '한성백제박물관 소장유물에 대한 자세한 정보 제공를 제공*용어설명- 한성백제박물관은 서울 송파구 올림픽공원 안에 있는, 백제의 시초인 한성(漢城) 시대 백제를 전문적으로 다루는 박물관- 고구려·신라 중심의 전시에 비해 백제 초기 역사를 전문적으로 보여주는 공간이 부족했기 때문에, 서울시가 직접 박물관을 세워 백제의 정체성과 서울의 역사적 뿌리를 알리기 위해 개관- 전시 주제: 백제가 건국(기원전 18년) 이후 한성(현재의 서울) 지역을 수도로 삼았던 약 500년간(기원전~475년)의 역사와 문화를 집중적으로 다룸'
