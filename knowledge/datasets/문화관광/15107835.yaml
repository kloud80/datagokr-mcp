description_portal: 한국저작권위원회에서 국민의 평생교육을 촉진하고 인적자원 개발 및 관리를 위해 학습계좌 제도를 도입하고 운영하도록 노력해야 합니다. 학습계좌는 개인의 학습경험을 종합적으로 관리하는 시스템을 의미하는데평생교육법 시행령 제23조 기반으로 강의식 교육, 토론식 교육, 체험 학습, 워크숍, 컨설팅 등으로 나눌 수 있습니다. 각 방법은 학습 목표와 대상에 따라 효과적인 교육 결과를 얻을 수 있습니다.이러한 수업방식인 저작권 교육의 방법(오프라인)에 따른 교육 인원과 교육 횟수 연도별 통계 현황 및 데이터입니다.
