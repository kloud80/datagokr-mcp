description_portal: '세종특별자치시시설관리공단은 시민이 체육시설 강습 프로그램의 운영 일정을 쉽게 확인할 수 있도록 강습요일정보 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 각 센터별 강습반의 요일별 운영 현황을 투명하게 공개하여, 시민의 일정 선택 편의성을 높이고 체육시설 이용 활성화를 지원하기 위해 구축되었습니다.■ 데이터 컬럼 구성센터명 - 강습이 운영되는 체육시설명    예: 보람수영장, 조치원복합커뮤니티센터 등강습반명 - 강습 프로그램 또는 반의 명칭강습요일 - 해당 강습이 운영되는 요일 정보■ 데이터 제공 목적강습요일정보 데이터는 다음과 같은 목적을 위해 제공됩니다. - 체육시설 강습 운영 일정의 투명한 공개 및 접근성 향상 - 시민이 희망 요일에 맞는 강습 프로그램을 손쉽게 선택할 수 있도록 지원 - 시설별 강습 운영 효율성 및 일정 관리 체계 강화 - 공공체육시설 이용률 제고 및 시민 여가활동 활성화 기여세종특별자치시시설관리공단은 시민이 보다 편리하게 체육시설을 이용할 수 있도록 강습 정보를 지속적으로 갱신하고, 이용자 중심의 체육행정을 추진해 나가겠습니다.'
