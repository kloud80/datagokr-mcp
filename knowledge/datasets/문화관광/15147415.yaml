summary_user: 서울특별시 강북구에 인허가된 당구장업 업소를 한 곳씩 담은 건별 명부로, 영업 중인 곳과 폐업한 곳을 함께 포함하며 인허가일·폐업일·영업상태·소재지 주소·중부원점TM(EPSG:5174) 좌표·건물 면적 등을 담는다. 강북구에서 영업 중인 당구장이 어디에 몇 곳 있는지, 최근 어느 업소가 문을 닫았는지 확인하려는 주민·창업 예정자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관(개방자치단체) 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 체육시설업 인허가 명부나 상권 데이터와 나란히 놓고 보는 용도에 맞는다.
