summary_user: 저작권 등록건수를 개인·법인·기타단체·개인사업자·국가지자체 등 등록 주체별과 온라인·오프라인 등록 방법별로 나눠 2013년부터 2024년까지 연도별로 집계한 전국 단위 통계표로, 건별 등록 원천이 아니라 구분 행과 연도 열로 된 작은 CSV 파일(594 bytes)이다. 분석가나 정책 담당자가 '저작권 등록에서 법인 신청 비중이 늘었는가, 온라인 등록이 오프라인을 얼마나 대체했는가' 같은 추세를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 저작권 등록 통계와는 연도와 구분 이름을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 1. 저작권 등록은 저작권, 저작인접권 등의 권리 및 그러한 권리 등의 변동에 대한 사항을 저작권 등록부, 저작인접권등록부 등 공적인 장부에 등재하고 일반에게 공개, 열람하도록 공시하는 제도2. 저작권 및 저작인접권, 데이터베이스 제작자 권리의 등록신청 종류는 저작권법 제53조(저작권의 등록) 및 제54조(권리변동 등의 등록 효력), 제90조(저작인접권의 등록), 제98조(데이터베이스제작자의 권리의 등록)에 따름3. 저작권 등록건수를 연도별로 개인, 법인, 기타단데, 개인사업자, 국가지자체, 온라인, 오프라인 주체별, 방법별 구분하여 등록건수로 추출한 통계자료이다
