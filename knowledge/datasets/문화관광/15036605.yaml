summary_user: 경기도 김포시에 있는 여행업체를 업체 한 곳당 한 줄로 담은 현황 파일이며, 업체명·소재지주소·전화번호·업종(국내여행업, 국내외여행업, 국외여행업, 종합여행업 등)·데이터기준일자를 담는다. 김포에서 국외여행을 맡길 여행사를 찾는 주민이나 시 안의 여행업 업종 분포를 살피는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 관광사업 데이터와는 업체명이나 주소를 맞춰 붙여 써야 한다.
description_portal: 경기도 김포시 여행사업체 현황 정보에 대한 데이터로 업체명, 소재지주소, 전화번호, 업종구분, 데이터기준일자 등의 항목을 제공합니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다. 데이터 내에는 국내여행업, 국내외여행업, 국외여행업, 종합여행업 등 다양한 업종이 포함되어 있습니다. 본 데이터를 통해 경기도 김포시 내 여행업체의 현황을 파악하실 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 관광진흥과로 연락주시기 바랍니다.
