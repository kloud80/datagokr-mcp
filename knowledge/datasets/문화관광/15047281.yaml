summary_user: 서울시 체육시설관리사업소가 관리하는 잠실종합운동장·잠실야구장·목동야구장·신월야구공원 등 체육시설에서 열리는 공연·경기·행사를 건별로 담으며, 행사명·시작일·종료일·이용시간·이용연령·이용료·이용대상·홈페이지 주소를 제공한다. 시민이나 행사 기획자가 "이번 달 잠실·목동 경기장에서 어떤 공연이나 경기가 열리고 입장료는 얼마인가"를 확인하는 데 쓴다. 실측 컬럼에 KOPIS 공연ID 같은 전역 조인 키가 없어서, 다른 공연 데이터와는 행사명·시설명을 이름으로 맞추거나 같은 기관 코드로만 연결한다.
description_portal: 서울특별시 체육시설관리사업소에서 관리하는 체육시설에서 진행하는 공연, 경기, 행사정보입니다. 행사제목, 시작일, 종료일, 이용시간, 이용연령, 이용료, 이용대상, 홈페이지 주소 등의 정보를 제공합니다. (잠실종합운동장, 올림픽주경기장, 잠실보조경기장, 잠실야구장, 잠실실내체육관, 잠실종합운동장 광장, 목동주경기장, 목동야구장, 목동실내빙상장, 신월야구공원, 구의야구공원)제공부서는 서울특별시 체육시설관리사업소 스포츠마케팅과(02-2240-8970) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
