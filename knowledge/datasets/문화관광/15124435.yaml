summary_user: 전라남도 내 박물관을 한 곳당 한 행으로 정리한 시설 목록 파일로, 박물관명·주소·연락처·등록일·비고(국공립 여부 등)를 담는다(포털 설명 기준 67개소). 지역 주민이나 관광객이 근처에 어떤 박물관이 있는지 찾고 연락처를 확인할 때, 또는 분석가가 시군별 박물관 분포를 볼 때 쓴다. 전역 조인 키가 없어 문화기반시설총람 시설코드 등과 직접 연결되지 않으므로, 박물관명이나 주소를 기준으로 맞춰 이어 쓴다.
description_portal: '- 전라남도 내 박물관 67개소에 대한 정보(박물관 명, 주소, 연락처, 등록일, 국공립 여부 등)에 대해서 조회하실 수 있습니다.- 전라남도에는 지역의 역사, 문화, 자연 등을 소개하는 다양한 박물관이 있습니다.- 운영 시간 확인 : 각 박물관의 운영 시간과 휴관일은 홈페이지를 통해 사전에 확인하시기 바랍니다.- 입장료 : 일부 박물관은 무료로 개방되며, 일부는 입장료가 부과될 수 있습니다.- 전시 일정 : 특별 전시나 이벤트 일정은 각 박물관의 홈페이지나 SNS를 통해 확인하실 수 있습니다.- 전라남도의 다양한 박물관을 방문하여 지역의 역사와 문화를 깊이 있게 체험하시기 바랍니다.'
