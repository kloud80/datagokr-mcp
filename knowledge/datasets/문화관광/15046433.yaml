description_portal: '○ 통계개요* 통계명 : 주요관광지점 입장객(4대궁 및 종묘)* 통계종류 : 서울시 주요관광지점(4대궁 및 종묘) 이용현황을 제공하는 일반ㆍ보고통계* 작성목적 : 주요관광지점인 고궁의 이용현황 파악을 통해 관광 활성화 및 국민의휴양ㆍ정서 향유 확대 정책수립을 위한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 해당기관 → 시도, 문화체육관광부* 공표주기 : 정기* 공표범위 : 지역 - 서울 4대궁 및 종묘내용 - 서울시 4대 고궁과 종묘의 내국인 외국인 입장객수○ 용어설명* 입장객 : 관광지 및 관광시설의 물리적 공간 안으로 이동하는 모든 사람을 말함○ 기 타* 어린이대공원은 무료이용자 포함임* 개별관광지에 대한 입장객집계자료로서 지방자치단체 또는 특정지역의 관광객 총량과상이하므로 자료 활용 시 해당 관광지 방문객 수요로만 활용할 수 있음* 관광지별로 방문객 및 이용객을 집계함에 따라 조사대상기간 중 한명의 방문객 및이용객이 여러 관광지에 중복 집계될 수 있음* 일평균 입장객 : 월 누적 입장객 ÷ 31일(1월, 3월, 5월, 7월, 8월, 10월, 12월)월 누적 입장객 ÷ 30일(4월, 6월, 9월, 11월),월 누적 입장객 ÷ 28일(2월)○ 출 처 : 2012년이전 : 문화재청 궁능문화재과, 어린이대공원, 서울대공원2013년이후 : 문화체육관광부 관광지식정보시스템'
