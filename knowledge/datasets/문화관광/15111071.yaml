summary_user: 대전광역시 2021년 2분기 기준으로 자치구별 관광사업체 수를 업종별(여행업, 관광호텔업 등 호텔업 유형, 야영장업, 유원시설업, 관광편의시설업 등)로 집계한 소용량 CSV 파일(1,045바이트)이며, 사업체 건별 등록 원장이 아니라 시군구 단위 집계표다. 관광 정책 분석가나 창업 검토자가 '대전의 어느 자치구에 여행업·호텔업·야영장 등 관광사업체가 몇 곳씩 몰려 있는가'를 확인하는 데 쓴다. 공통 조인 키는 없어 자치구 이름으로 다른 대전시 자치구별 통계와 맞춰 이어 써야 한다.
limits: 단일 분기(2021년 2분기) 시점의 업체 수 집계라 개별 사업체의 등록번호·사업자번호·주소는 알 수 없고 시계열 비교도 이 파일만으로는 어렵다. 전역 조인 키가 없어 다른 데이터와 연결할 때 자치구 이름 매핑이 필요하다.
