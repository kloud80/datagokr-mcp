summary_user: 올림픽공원 장미광장에서 촬영한 장미 사진 정보를 품종 단위로 담으며, 장미명·계통·꽃색·육성국·특성 같은 설명이 제목·설명·키워드·이미지 식별자(uci) 등 문화자료 메타데이터 형식으로 들어 있다. 올림픽공원 방문객이나 정원·교육 콘텐츠 제작자가 '장미광장에 어떤 계통(하이브리드 티, 플로리분다, 덩굴장미 등)의 장미가 있고 각각 어떤 특성인가'를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 장미 품종명 같은 이름 매핑이나 같은 기관 자료로만 연결한다.
description_portal: 올림픽공원을 대상으로 촬영한 장미 사진정보 제공하고 있습니다.장미명, 품명, 계통, 꽃색, 육성국, 특성 등에 대한 정보제공올림픽공원 홈페이지에 들어가시면https://www.ksponco.or.kr/olympicpark/menu.es?mid=a20403010000확인가능합니다.Hybrid Tea Roses, Antique Touch Roses,Floribunda Roses,Landscape Roses,Climbing Roses 등다양한 장미 사진, 특성, 대표장비를 알수 있습니다.
