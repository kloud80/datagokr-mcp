description_portal: 건강한 생활에 대한 관심 증가와 생활체육 활성화 정책 추진으로 시민 체육시설 수요가 증대되고 있으며, 각 분야에서 지역 내 체육 인프라 현황 및 접근성 정보에 대한 활용 요청이 증가함에 따라 보령시는 관할 지역 내 생활체육시설의 상세 현황 정보를 제공하고 있습니다.개방 데이터는 시설명, 시설 유형(체육관, 체육공원, 경기장, 게이트볼장, 요트경기장, 족구장, 농구장, 씨름장 등), 소재지(도로명주소 또는 지번주소), 관리기관(공공기관, 민간 등), 데이터 기준일자 등의 항목으로 구성되어 있습니다.지자체·체육진흥기관은 생활체육시설 분포 현황 분석, 시설 부족 지역 파악, 체육시설 확충 계획 수립, 시설별 이용률 관리 및 생활체육 활성화 정책 수립에 활용하고, 연구기관·학계는 지역별 체육시설 접근성 연구, 시설 유형별 수요 분석, 주민 건강 증진 효과 연구 및 도시계획 연구에 활용하며, 체육단체·동호회는 활동 장소 탐색, 대회 및 행사 개최지 선정, 정기 모임 공간 확보에 활용할 수 있습니다. 또한 시민은 거주지 인근 체육시설 검색, 생활체육 참여 계획 수립 및 건강 관리에 활용할 수 있으며, 민간 체육시설 운영자는 시장 분석 및 입지 선정에 참고할 수 있습니다.
