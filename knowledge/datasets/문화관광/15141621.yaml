summary_user: 서울특별시 용산구 관내 영화상영업 사업장별 인허가 원천 기록으로, 인허가일자·영업상태(영업/휴업/폐업)·폐업일자·전화번호·지번/도로명 주소·사업장명·좌표 등을 사업장 단위로 담는다. 영화 관련 사업자나 분석가가 '용산구에서 지금 영업 중인 영화상영업체는 어디이고 언제 인허가를 받았는가'를 확인하거나 문화행사 장소·거래처를 찾을 때 쓴다. 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 서울특별시 용산구에서 운영·관리하는 「영화상영업 인허가 정보」는 관내에서 영화상영업을 영위하는 사업체의 인허가 현황과 기본 정보를 종합적으로 제공하는 공공데이터입니다. 이 데이터에는 각 사업체가 인허가를 받은 일자, 현재의 영업상태(영업 중, 휴업, 폐업 등)와 폐업일자 등 영업 지속 여부를 확인할 수 있는 항목이 포함됩니다. 또한 사업체와 직접 연락이 가능하도록 등록된 전화번호, 사업장이 위치한 정확한 주소, 사업장명(상호)과 같은 식별 정보도 함께 제공되어, 이용자는 해당 사업체의 위치와 연락처를 명확히 파악할 수 있습니다. 이러한 정보는 행정기관이 영화상영업의 관리·감독을 체계적으로 수행하고, 관련 정책 수립 및 문화산업 지원 계획을 마련하는 데 중요한 자료로 활용됩니다. 아울러 업계 종사자나 일반 시민은 해당 데이터를 통해 관내 영화상영업체를 쉽게 찾아보고, 문화행사 기획, 거래처 발굴, 시장 분석 등 다양한 목적으로 활용할 수 있습니다. 본 정보는 투명하고 건전한 영화 상영 환경을 조성하고, 지역 문화 향유 기회를 확대하며, 용산구민 모두가 보다 다양한 영상 콘텐츠를 접할 수 있는 기반 마련에 기여할 것입니다.
