summary_user: 빅카인즈(BIGKinds)에서 '정의'와 관련된 신문·방송 기사를 기사 한 건당 한 행으로 모은 메타데이터로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목을 담은 약 55MB 분량의 CSV 파일이다. 연구자나 정책 분석가가 '공정·형평·인권 같은 정의 담론이 시기별로 어떤 키워드와 함께 얼마나 보도됐는가'를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자나 언론사명을 기준으로 맞춰 붙이는 방식으로만 연결된다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 정의 관련 뉴스 메타정보 자료입니다. 정의는 사회와 국가 운영의 근본 가치로, 법과 제도의 공정한 적용, 사회적 형평성 보장, 인권 실현과 직결된 중요한 의제입니다. 본 자료는 국내 주요 신문과 방송 보도에서 정의와 관련된 기사들을 분석하여 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 담론의 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 정의 실현을 위한 법·제도적 노력, 사회 갈등 해결 과정, 공정성과 형평성을 둘러싼 논의 등이 언론 보도에서 어떻게 다뤄졌는지를 객관적으로 파악할 수 있습니다. 또한 학술 연구, 정책 수립, 언론 분석, 교육 현장에서 활용 가능한 기초 자료로, 정의 담론이 시대적 맥락 속에서 어떻게 변화하고 강조되는지를 이해하는 데 중요한 참고 자료가 됩니다.
