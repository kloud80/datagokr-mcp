summary_user: 순천시 안에서 등록·신고된 체육시설업 사업장을 한 곳당 한 행으로 담은 건별 명부로, 업종·상호·지번/도로명 주소·인허가일자·데이터 기준일을 담는다(CSV 약 51KB). 시민이 동네 헬스장·당구장·체육도장 같은 민간 체육시설을 찾거나, 분석가가 "순천시에서 최근 몇 년 사이 새로 인허가된 헬스장은 어느 동네에 몰려 있나" 같은 상권 질문을 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소를 지오코딩하거나 상호·업종 이름을 맞춰 이어 쓰며, 같은 축인 상권·사업자 데이터와 묶어 본다.
description_portal: 전라남도 순천시 체육시설업 현황 데이터는 순천시 내 체육시설의 운영 현황과 관련된 정보를 제공합니다. 이 데이터에는 체육시설의 명칭, 위치, 시설 유형(스포츠센터, 실내·외 운동장, 헬스장 등), 시설주소(지번, 도로명), 인허가 일자 등이 포함됩니다. 이를 통해 시민들은 지역 내 체육시설의 이용 가능성 및 편의성을 쉽게 파악할 수 있으며, 건강 증진 및 운동 프로그램에 대한 접근성을 높일 수 있습니다. 이 데이터는 체육시설의 효율적인 운영과 관리, 시민들의 체육 활동을 증진시키는 데 중요한 기초 자료로 활용됩니다.
