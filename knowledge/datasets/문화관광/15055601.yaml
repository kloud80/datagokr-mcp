description_portal: 전북특별자치도 내 한옥에서 숙박과 함께 전통문화를 체험할 수 있는 프로그램 운영 업체의 현황 데이터입니다. 이 자료는 전주, 정읍 등지에 위치한 한옥 숙박시설의 이름과 주소, 그리고 각 시설에서 제공하는 특색 있는 체험 프로그램의 목록을 담고 있습니다. 한지 공예, 다도, 비빔밥 체험과 같은 음식 문화부터 고택 음악회, 과거시험 체험에 이르기까지 다양한 프로그램을 확인할 수 있습니다. 이 데이터는 단순한 숙박을 넘어, 한국의 전통문화를 깊이 있게 경험하고 싶은 국내외 관광객들에게 유용한 정보를 제공하며 지역 관광 콘텐츠의 다양성을 보여줍니다.
