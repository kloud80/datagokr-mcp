description_portal: 이 데이터는 걸매예술마을 에 대한 위치 정보(위도·경도), 명칭, 장소 상세정보 및 무장애 관광 관련 편의시설 현황을 체계적으로 정리한 공공데이터입니다. 걸매예술마을은 2007년 공공미술 프로젝트를 통해 조성된 벽화 마을로, 절벽 위 마을과 골목길을 따라 예술작품이 설치되어 있으며 주변의 걸매생태공원 과 연계되어 자연과 문화가 어우러진 공간입니다. 데이터에는 보행로 상태, 경사도, 무장애 관람로 여부, 주차장 및 편의시설 위치, 접근로 여건 등이 포함되어 있어 휠체어 이용자나 이동 약자를 고려한 관광 코스 설계, 접근성 기반 여행 안내, 관광자원 관리, 정책 기획 등 다양한 목적에 활용될 수 있습니다. 이 자료는 CSV 형식으로 제공됩니다.
