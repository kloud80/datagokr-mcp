description_portal: "의정부도시공사에서 운영하는 스포츠센터 프로그램 종류에 따른 이용 요금에 대한 정보를 제공합니다.의정부시 스포츠센터에서는 수영장, 헬스장, 에어로빅, 요가, 댄스스포츠 등 프로그램들을 운영합니다.강습 프로그램별 이용대상에 따른 이용요금 현황을 세부 정보로 제공하고 있습니다.해당 정보는 스포츠센터 이용희망자, 이용자, 기타 정보수요자를 위하여 정확하고 신속하게 제공 및 현행화되고 있습니다.※ 운영사항     -관외회원은 50% 가산 부가     -영향지역 주민은 증명서 제시할 경우 30% 할인     -수영 1회 이용요금: 대인 3,900원, 소인 2,600원     -아쿠아로빅의 경우 소인은 이용 대상 아님(데이터상 '0'으로 표시함)     -소인은 만18세이하(2006년 이후 출생)     -5세미만은 입장 불가(2020년 이후 출생)     -이용요금은 부가가치세 포함그외 운영프로그램, 강습일정 등 스포츠센터 이용 관련 정보는 의정부도시공사 대표 홈페이지에 접속하시면 시설소개>스포츠센터>스포츠센터 소개에서 확인할 수 있습니다.https://www.uiuc.or.kr/facilityInfo/sportsPage/sports/content.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다."
