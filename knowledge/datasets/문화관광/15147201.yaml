description_portal: '유원시설업은 유기시설 또는 유기기구를 설치해 관광객에게 제공하는 업종으로, 안전성검사 대상 시설 수에 따라 종합유원시설업 , 일반유원시설업 , 기타유원시설업 으로 구분됩니다서울특별시 강북구 일반유원시설업 인허가 정보: 강북구의 테마파크 등 안전성 검사대상의 놀이기구를 한 종류 이상 설치하여 운영하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
