description_portal: 광주광역시 예술의전당 개관이후 대극장 및 소극장 공연 실적 정보입니다. 공연일자, 공연제목, 주최 등의 항목을 제공합니다. (개관~2024년 12월)데이터 건수가 많아 엑셀, 메모장 등으로 모든 데이터가 표출되지 않으니, 광주광역시 예술의전당 전용 홈페이지를 이용해주시기 바랍니다.광주예술의전당은 1991년에 개관한 이래 현재까지 명실상부한 광주의 문화중심지로 그 역할을 담당하고 있습니다.전당에는 총8개 예술단체 300여명의 단원이 소속되어 활발한 활동을 하고 있으며 전통음악과 교향악, 창극부터 발레에 이르기까지 다양한 장르의 수준 높은 공연을 시민들에게 선보여 문화예술의 저변확대와 지역 인재양성에 기여하고 있습니다.
