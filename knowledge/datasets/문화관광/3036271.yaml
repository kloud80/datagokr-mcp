summary_user: 광주 예술의전당 개관 이후 2024년 12월까지 대극장·소극장에서 열린 공연 실적을 공연 한 건씩 년도·공연일시·공연제목·주최로 담은 CSV 파일(약 538KB)이다. 지역 공연 기획자나 문화정책 분석가가 연도별로 어떤 장르와 주최 단체의 공연이 얼마나 열렸는지 추이를 볼 때 쓴다. 공연ID·공연장ID 같은 전역 조인 키가 없어 KOPIS 공연 목록 등과는 공연제목·일시·주최 이름을 맞춰 연결해야 한다.
