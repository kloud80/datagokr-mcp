summary_user: 경주시 관내 오토캠핑장과 야영장을 시설 한 곳당 한 건으로 담은 현황 데이터로, 캠핑장 명칭·주소·홈페이지 등이 들어 있다. 경주 여행을 계획하는 관광객이나 위치 기반 앱 개발자가 '경주에서 묵을 수 있는 캠핑장은 어디이고 어떻게 연락하나'를 찾을 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓸 조인 키가 없어, 관광사업 등록 원장 등 다른 데이터와는 시설 이름이나 주소를 맞춰 보는 방식으로만 연결된다.
limits: 전역 조인 키나 등록번호가 확인되지 않아 다른 데이터와 정확히 연결하려면 이름·주소 매칭이 필요하다. 범위는 경주시 한 곳으로, 다른 시군구 야영장은 담지 않는다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
