summary_user: KTV 국민방송에서 방송된 정책뉴스 프로그램의 방송 목록을 콘텐츠(영상) 1건 단위로 담은 파일로, 제목·프로그램명·카테고리·조회수·회차·방송일시·재생시간·링크 주소가 들어 있으며 CSV 원본은 약 131MB다. 연구자·언론인·정책 담당자가 "특정 시기에 어떤 정책 주제가 정책뉴스로 몇 번 방송됐고 조회수는 어땠나"를 확인하는 데 쓴다. 다른 데이터와 잇는 전역 조인 키는 없으며, 프로그램아이디·카테고리아이디나 같은 기관(한국정책방송원)의 다른 방송 목록과 이름·코드로 맞춰 연결한다.
description_portal: KTV 국민방송에서 방송된 정책뉴스 프로그램의 방송 목록을 제공하는 데이터셋입니다. 콘텐츠아이디, 제목, 프로그램명, 카테고리, 전체영상 여부, 섬네일 주소, 링크 주소, 조회수, 프로그램 회차, 방송일, 방송시간, 재생시간, 등록일 등 다양한 정보를 포함하고 있습니다. 이를 통해 정책 관련 뉴스 프로그램의 방송 이력과 주요 내용을 한눈에 파악할 수 있으며, 정책 동향 분석, 미디어 연구, 뉴스 아카이브 구축, 공공정보 제공 등 여러 분야에서 활용이 가능합니다. 특히 정책뉴스에 관심 있는 연구자, 언론인, 정책 담당자에게 실질적인 도움이 되며, 방송 콘텐츠 분석, 정책 홍보 전략 수립, 미디어 활용 교육, 디지털 아카이브 자료 구축 등에도 유용한 기초 자료로 쓰입니다.
