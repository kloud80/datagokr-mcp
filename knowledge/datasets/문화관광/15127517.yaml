summary_user: 태백시에 등록된 야영장을 한 곳당 한 행으로 담은 건별 현황 파일로, 야영장 명칭·소재지·업종(일반 또는 자동차 야영장)·등록일·부지면적·사이트 수·기타 시설현황을 담는다(파일 크기 692바이트의 소규모 목록). 태백 여행을 계획하는 사람이나 관광 분석가가 "태백시에 자동차 야영장은 몇 곳이고 사이트 수와 면적은 얼마나 되나"를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 야영장 명칭이나 소재지 주소를 맞춰 보거나 같은 기관(태백시) 자료끼리 연결해 쓴다.
