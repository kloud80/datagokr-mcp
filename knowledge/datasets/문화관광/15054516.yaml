summary_user: 대구광역시 달성군 안의 서원을 한 곳당 한 행으로 담은 작은 목록 파일(CSV 약 1.4KB)로, 서원명·도로명 주소·문의처·홈페이지·위도·경도를 담는다. 달성군의 서원을 답사하거나 관광 안내·지도 서비스에 표시하려는 사람이 '달성군에 어떤 서원이 어디에 있고 어디로 문의하나'를 확인하는 데 쓴다. 공통 조인 키(문화재 종목코드·지정번호, PNU 등)가 없어 국가유산청 지정유산 데이터와는 서원명으로 맞추거나, 위도·경도로 다른 위치 데이터와 공간적으로 겹쳐 쓴다.
description_portal: 이 데이터는 전통 교육시설인 서원의 명칭, 도로명 주소, 문의처, 공식 홈페이지, 위치 좌표(위도 및 경도) 등의 정보를 포함하고 있으며, 지역 내 유교 문화유산 및 전통 교육기관에 대한 현황을 파악하고 문화재 및 관광 자원으로의 활용을 위한 기초자료로 활용될 수 있습니다.
