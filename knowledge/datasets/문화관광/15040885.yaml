description_portal: 서울시내에 있는 조선시대 4대궁(경복궁, 창덕궁, 덕수궁, 창경궁)과 종묘의 관람객 숫자를 집계한 엑셀자료입니다. 1년 주기로 업데이트 되며 각 날짜별로 유료 관람객, 무료 관람객, 내국인 관람객, 외국인 관람객의 숫자를 알 수 있습니다. 외국인 관람객은 영어권, 일어권, 중어권, 기타언어권으로 상세 구별되어 있습니다. 데이터를 통해서 어느 시기에 국내 관람객이 많은지, 외국인 관람객은 어느 궁을 많이 찾는지 등 관광수요와 추이를 확인해볼 수 있습니다. 경복궁과 종묘는 화요일에 휴관이며 창덕궁, 덕수궁, 창경궁은 월요일에 휴관입니다.
