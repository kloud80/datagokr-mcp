description_portal: 한국문학번역원이 운영하는 KLWAVE 플랫폼에서 제공하는 신간(New Releases) 큐레이션 목록 데이터로, 최근 출간된 한국 도서 및 출판 콘텐츠에 대한 다양한 정보를 체계적으로 제공하는 데이터입니다. 도서의 제목, 저자, 출판사, 발행일 등 신간 도서와 관련된 주요 정보를 포함하며, 국내외 독자들이 최신 한국 문학 및 출판 동향을 쉽고 빠르게 파악할 수 있도록 지원합니다. 또한 해외 출판사, 번역가, 에이전시, 연구자 및 문화산업 관계자들이 새로운 한국 콘텐츠를 발굴하고 활용할 수 있는 기초자료로 활용되며, 한국 문학 작품의 해외 번역·출간 및 국제 유통 확대를 촉진하는 데 기여합니다. 아울러 국내 출판시장의 최신 트렌드와 주목할 만한 신간 정보를 제공함으로써 한국 문학과 출판 콘텐츠의 국내외 홍보 및 이용 활성화를 지원하고, 한국 문화콘텐츠의 글로벌 확산과 경쟁력 강화에 기여하는 데이터입니다.
