description_portal: 서울시 유적지 현황(영어) 데이터는 서울에 위치한 주요 역사 유적지를 영어로 소개하기 위해 구축된 기초 자료입니다. 메인 키는 각 유적지를 식별하는 고유 번호이며, 영문 명칭 항목은 외국인 방문객이 유적지를 정확히 인지할 수 있도록 제공됩니다. 행정 시, 행정 구, 행정 동 정보는 유적지의 행정구역 위치를 영문 표기로 나타낸 것으로, 지도 검색이나 외국인용 관광 안내 서비스에 활용됩니다. 이 데이터는 해외 관광객 대상 안내자료 제작, 다국어 기반 관광 플랫폼 구축, 문화유산 접근성 향상 등에 중요한 기반으로 활용됩니다.
