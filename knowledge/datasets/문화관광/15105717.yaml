description_portal: "- 문화체육관광부와 한국관광공사는 2015년부터 대한민국 각 지역마다 '열린관광지'를 선정하여, 관광지의 접근성 개선과 편의시설 구축 등 다양한 사업을 진행하고있습니다.- 열린관광지는 장애인, 고령자, 영유아가족 등 '모든 관광객'이 이동의 불편 및 관광활동의 제약없이 이용할 수 있는 장애물 없는 관광지입니다.- 열린관광지명, 지역 및 주소, 설명, 연락처의 제공으로 모든 이들에게 관광향유권을 평등하게 보장하고 지속 가능한 관광의 경쟁력을 강화시킬 수 있습니다.- 본 데이터는 배리어-프리 관광 모바일 어플리케이션 또는 홈페이지 제작에 활용할 수 있습니다."
