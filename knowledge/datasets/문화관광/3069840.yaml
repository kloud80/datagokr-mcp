summary_user: 대전 유성구가 고른 대표 관광명소 10곳을 명소 한 곳당 한 행으로 담은 작은 목록 파일(csv, 약 1.3KB)로, 명소명·지번주소·도로명주소·연락처가 들어 있다. 유성구를 찾는 관광객이나 안내자료를 만드는 담당자가 '유성구에서 꼭 가볼 만한 곳과 그 주소·연락처는?'을 확인할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 같은 다른 데이터와는 명소명이나 주소를 문자열로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 대전광역시 유성구의 주요 관광명소 10곳에 대한 정보를 포함하고 있으며, 명소명, 지번주소, 도로명주소, 연락처 등의 항목으로 구성되어 있습니다. 유성온천문화축제, 충남대학교 벚꽃길, 국립중앙과학관 등 유성구의 대표적 자연·문화 명소가 수록되어 있으며, 이를 통해 관광안내 지도 제작, 지역축제 기획, 문화관광 콘텐츠 개발 등의 분야에서 활용이 가능합니다. 또한 관광객 안내 자료 제공, 지역명소 활성화 정책 수립, 위치 기반 관광 서비스와의 연계 등 행정 및 민간 활용도 높습니다. 유성구의 관광자원을 통합적으로 파악할 수 있는 기초자료로 쓰일 수 있습니다.
