description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 제주현대미술관은 제주 제주시 한경면 저지리 저지문화예술인마을 중심부에 위치한 실내·야외 복합 미술관으로, 상설전시실과 기획전시실, 야외 조각공원, 아트숍, 세미나실 등을 갖추고 있다. 이 데이터셋은 미술관 주변의 편의시설, 교통시설, 장애인 및 교통약자 접근성 정보 등을 포함해 관광지 주변 환경을 상세히 제공한다. 무장애 접근로, 장애인 화장실, 주차시설 등의 정보가 반영되어 있어, 교통약자·휠체어 사용자·고령자 등 누구나 보다 편안하게 방문할 수 있는 열린관광지로서의 활용이 가능하다. 공공 및 관광 분야에서는 무장애 관광 안내, 접근성 기반 관광 코스 설계, 지도/콘텐츠 제작, 정책 수립 등의 기초 자료로 사용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
