summary_user: 전라남도 시군의 생활체육관을 시설 한 곳당 한 행으로 담은 파일로, 시설명·소유기관·관리주체·부지·건축·연면적, 체육관과 수영장의 면적·규격, 가능종목, 체력단련실, 준공 연도를 시군구 단위로 정리한다. 주민이나 지역 분석가가 '우리 군에 수영장이나 체력단련실을 갖춘 생활체육관이 있는지, 언제 지어졌는지'를 확인하거나 시군별 생활체육 시설 규모와 노후도를 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군구 이름이나 시설명을 맞춰 이어야 한다.
description_portal: '- 전라남도 내 시군의 생활체육관(시설명, 소유기관, 면적, 종목, 준공년도 등)에 관한 데이터를 조회하실 수 있습니다.- "생활체육관"은 지역 주민들이 일상 속에서 쉽고 편하게 운동하고 건강을 증진할 수 있도록 마련된 체육 시설입니다. 특별한 선수 훈련이나 대회 목적이 아니라, 누구나 참여 가능한 건강 증진과 여가 활동 공간으로 운영됩니다.- 정의: 지역주민의 생활체육 활성화를 위한 체육시설- 목적: 주민 건강 증진, 여가 선용, 공동체 활성화- 설치 주체: 지방자치단체, 체육단체, 학교 등- 주요 이용자: 일반 주민, 노인, 청소년, 장애인 등- 설치 기준: 주민 수, 지역 특성, 수요 조사 반영'
