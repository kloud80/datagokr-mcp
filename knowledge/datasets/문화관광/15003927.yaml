summary_user: 국립중앙도서관이 관리하는 저자 한 명당 한 행으로 이름, 생몰년(출생·사망연도), 저작권 소멸연도, 도서관 전거 제어번호, 국제표준이름식별자(ISNI)를 담은 전국 단위 파일 데이터입니다. 출판사·콘텐츠 제작자·연구자가 "이 작가의 작품은 저작권이 만료되어 자유롭게 쓸 수 있는가"를 가늠하는 참고자료로 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 찾지 못했으므로, 저자명 매칭이나 전거 제어번호·ISNI 번호를 국립중앙도서관 저자전거·ISNI 서비스와 맞춰 보는 방식으로 이어 쓴다.
description_portal: 'ㅇ 저작권은 법으로 보호되는 권리로, 국립중앙도서관에서는 보다 쉽게 작품의 저작권 만료 여부 판단에 도움을 줄 수  있도록  저자 정보 데이터를 공개합니다.ㅇ 국립중앙도서관 저자정보는 생몰년도는 확정보다는 추정이며, 저자의 생몰년을 파악하여 저자의 작품을 저작권 만료 여부 판단에 참고자료로 활용할 수 있습니다.ㅇ저자 정보에는 이름, 생몰년(출생연도, 사망연도), 저작권 소멸연도, 국립중앙도서관의 전거 제어번호, ISNI(International Standard Name Identifier, 국제표준이름식별자)를 제공하고 있습니다.     (13,879명 / "25.6.16 기준) ※  국립중앙도서관 저자전거 - https://librarian.nl.go.kr/LI/contents/L20101000000.do                                                                                                              ※  ISNI(국제표준이름식별자) - https://www.nl.go.kr/isni/main/index                                                           작가, 연구자, 실연자, 영상제작자 등 연구 및 창작 활동과 관련된 개인과 단체를 식별하기 위해 부여 (KS X ISO 27729 국가표준)* 참고사항:  CSV로 서식 변경 시 외국 저자명 변환 오류가 발생하여 유사한 알파벳으로 변경하였으며, 정확한 저자명 확인을 위하여 엑셀 파일을 함께 첨부하였습니다.'
