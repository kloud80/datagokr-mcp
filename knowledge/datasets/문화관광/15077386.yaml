summary_user: 광양시 안에 있는 헬스장을 한 곳씩 담은 명부로, 상호·지번주소·도로명주소·전화번호·데이터 기준일을 담은 작은 CSV 파일(약 5KB)이다. 주민이 집 근처 헬스장을 찾거나, 분석가가 광양시 안에서 헬스장이 어느 동네에 몰려 있는지 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 없으므로 다른 체육시설업 명부나 상권 데이터와는 상호명·주소를 맞춰 이어 쓴다.
description_portal: 헬스장 현황 데이터는 지역 내 등록된 헬스장 시설 정보를 체계적으로 관리하기 위해 제공되는 자료입니다. 데이터에는 헬스장의 상호명, 지번주소와 도로명주소, 시설 전화번호, 데이터 기준일 등이 포함되어 있습니다. 이를 통해 주민들이 가까운 헬스장을 손쉽게 찾을 수 있도록 돕고, 지방자치단체는 생활체육 인프라 분포를 파악하여 건강증진 정책을 수립하는 데 활용할 수 있습니다. 또한 헬스장 운영 현황을 분석하면 특정 지역의 체육시설 수급 불균형을 개선하거나, 맞춤형 운동 프로그램 및 공공 체육시설 확충 계획을 마련하는 기초자료로도 쓰일 수 있습니다.
