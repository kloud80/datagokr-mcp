summary_user: 영등포구 구민체육센터에서 개설하는 강좌를 강좌 한 건 단위로 담은 파일(csv, 약 50KB)로, 장소·종목·프로그램명·강좌년월·시작/종료시간·수강요일·대상·정원·성인/청소년 회비를 담는다. 구민이 "집 근처 센터에서 평일 저녁에 들을 수 있는 수영 강좌와 성인 회비는 얼마인가"를 확인하거나, 분석가가 종목별 정원과 회비 수준을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 장소(센터) 이름이나 종목 이름을 맞춰 연결해야 하며, 같은 구의 공공 체육시설 목록 등과 이름 매핑으로 이어 쓴다.
description_portal: '서울특별시 영등포구 구민들에게 제공되는 구민체육센터의 강좌 프로그램 및 수강신청에 필요한 상세 정보를 담고 있는 데이터셋입니다. 이 정보는 구민들이 체력 증진과 여가 활동을 위해 센터의 다양한 스포츠 강좌를 쉽게 탐색하고 등록할 수 있도록 돕습니다.데이터셋에는 강좌가 진행되는 장소와 강좌의 종류인 종목(예: 수영, 헬스, 요가 등), 그리고 구체적인 프로그램 명칭이 포함되어 있습니다. 강좌가 개설되는 강좌년월을 기준으로 시작시간, 종료시간, 수강요일 정보가 제공되어 시간표 확인이 용이합니다.또한, 강좌 참여 대상과 정원 정보가 명시되어 있으며, 수강료 정보를 위해 성인회비와 청소년회비가 구분되어 있어 투명한 비용 확인이 가능합니다. 이 데이터는 지역 체육 시설의 이용 활성화와 구민 건강 증진 정책 수립에 기여합니다.'
