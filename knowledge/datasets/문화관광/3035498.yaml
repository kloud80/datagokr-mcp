description_portal: 경기도 과천시 관내 지정문화유산 및 향토유산의 현황에 대한 데이터로 문화유적명, 문화유적 지정번호, 문화유적 구분, 문화유적 종류, 소재지 도로명 주소, 소재지 지번 주소, 위도, 경도, 지정 일자, 소유주체 구분, 소유자명, 조성시대, 이미지 정보, 문화유적 소개, 관리기관 전화번호, 관리기관명, 데이터 기준일자 정보를 제공합니다. 문화유산은 시도 지정과 시군수 지정으로 나뉘며, 시군구 지정유산의 경우, 향토유산이라는 명칭으로 구분하여 사용하고 있습니다. 본 데이터에는 경기도 지정유산과 과천시 지정유산 정보를 제공합니다.
