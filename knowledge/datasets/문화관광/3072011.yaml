summary_user: 부산광역시 기장군 관내에 영업 중으로 신고된 체육시설업을 시설 한 곳당 한 줄로 담은 명부로, 업종·상호·지번 주소·도로명 주소만 들어 있다(CSV 약 33KB). 주민이나 창업 예정자가 '기장군 어느 읍면에 헬스장·당구장·체육도장이 몇 곳 있나'를 확인하거나, 분석가가 민간 체육시설 분포를 상권 신호로 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호·좌표 등)가 없어 다른 데이터와는 주소나 상호를 맞춰 붙여야 한다.
description_portal: 부산광역시 기장군 관내에 현재 영업 중으로 등록되어 있는 신고 체육시설업에 대한 데이터로 신고 체육시설업의 상호, 주소 등에 대한 자료입니다.현재 기장군 관내에 있는 신고 시설업 업종에 해당하는 신고되어 있는 시설 목록입니다주소와 상호명을 기재해 놓았고 업종까지 등록되어 있어 목록을 보면 검색하고 싶은 시설을 확인할수가 있습니다여러가지 정보 중에서 가장 필수적인 정보만 추려놓았고  기장군에 있는 읍면별로 등록 목록이 나와있습니다업종 검색 하시면 쉽게 원하는 업체를 찾을수 있습니다
