summary_user: 게임물관리위원회가 운영하는 불법게임물 신고 포상금 제도의 지급 기준을 기준 한 건당 한 행으로 담은 코드표 성격의 파일이며, 상위·중위 분류와 상세 신고 대상(지급기준3)으로 구성된다. 일반 국민이나 게임 이용자가 미등급 게임물 유통, 핵·오토 프로그램 배포, 환전 알선, 사행성 광고 같은 행위를 신고하면 어떤 기준으로 포상금 대상이 되는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 지급기준ID나 분류명을 사람이 직접 매핑하거나 같은 기관 데이터와 이름으로만 이어 쓴다.
description_portal: 본 데이터는 "게임산업진흥에 관한 법률"에 의거하여 게임물관리위원회에서 운영 중인 불법게임물 신고 포상금 제도의 세부 지급 기준 정보를 제공합니다.데이터는 총 25가지의 상세 지급 기준(지급기준ID P001~P025)을 포함하고 있으며, 주요 내용은 다음과 같습니다.첫째, 법 제32조(불법게임물 등의 유통금지 등) 위반과 관련하여 미등급 게임물 유통, 등급과 다른 내용의 게임물 제공, 사행성 게임물 유통, 타인의 정보를 도용한 게임 이용 등 불법 유통 및 이용 제공 행위에 대한 구체적인 신고 기준을 명시하고 있습니다. 특히 최근 이슈가 되는 게임물 관련 사업자가 승인하지 않은 프로그램(핵, 오토 등) 제작 및 배포, 환전 및 환전 알선 행위에 대한 기준도 포함되어 있습니다.둘째, 법 제28조(게임물 관련 사업자의 준수사항) 위반과 관련하여 도박 및 사행행위 방조, 경품 제공을 통한 사행성 조장 행위 등에 대한 지급 기준을 상세히 다루고 있습니다.셋째, 법 제34조(광고·선전의 제한) 위반과 관련하여 허위 광고, 사행심 조장 광고 및 선전물 배포 등에 대한 신고 대상을 규정하고 있습니다.데이터 구성 항목은 "지급기준ID", "상위 분류(지급기준1)", "중위 분류(지급기준2)", "상세 내용 및 신고 대상(지급기준3)"으로 이루어져 있어 일반 국민이 불법 행위를 인지하고 신고할 때 어떤 기준에 따라 포상금이 산정되는지 명확하게 파악할 수 있도록 돕습니다.해당 데이터는 관련 법령 개정 및 위원회의 포상금 운영 지침 변경 시 실시간으로 업데이트되어 최신성을 유지하며, 건전한 게임 문화 조성 및 게임 산업의 법적 준수 성능 강화를 위한 기초 자료로 활용될 수 있습니다.
