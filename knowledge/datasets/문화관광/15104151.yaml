summary_user: 인천광역시 부평구에 등록(신고)된 인터넷컴퓨터게임시설제공업(PC방) 업소를 한 곳씩 담은 건별 목록으로, 상호·등록(신고)일자·도로명 및 지번 소재지를 수록한 CSV 파일(약 17KB)이다. 부평구 안 어느 동네에 PC방이 몰려 있는지, 최근 몇 년 사이 신규 등록이 늘었는지를 알고 싶은 창업자나 청소년 보호 정책 담당자가 쓴다. 전역 조인 키나 기관 코드는 없어서, 다른 데이터와는 소재지 주소를 지오코딩하거나 상호·주소 문자열로 맞춰 이어 써야 한다.
description_portal: '인터넷컴퓨터게임시설제공업(PC방) 업소의 상호, 소재지, 등록(신고)일자 등을 수록한 데이터.청소년 보호 및 건전한 게임문화 조성, 지역 내 여가·문화 인프라 현황 파악, 게임산업 관리 및 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 인터넷컴퓨터게임시설제공업 등록 현황 및 분포 분석– 등록일자 기반 업소 증가 추세 및 운영 특성 파악– 도로명·지번주소를 통한 입지 특성 및 상권 분석– 청소년 보호, 건전한 여가문화 조성 정책 자료 활용주요 항목 설명● 연번: 데이터의 고유 번호● 등록(신고)일자: 업소가 등록·신고된 날짜● 상호: 인터넷컴퓨터게임시설제공업소의 명칭● 영업소소재지(도로명): 업소가 위치한 도로명 주소● 영업소소재지(지번): 업소가 위치한 지번 주소'
