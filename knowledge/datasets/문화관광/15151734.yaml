summary_user: 한국문화예술위원회가 기록한 공연 건별 상세정보를 장르, 공연 시작·종료일, 공연장소, 지원기관, 조회수 단위로 담은 전국 범위의 CSV 아카이브(약 2.7MB)다. 연구자나 정책 담당자가 '시기별로 어떤 장르의 공연이 어느 장소에서 많이 열렸고 어떤 기관이 지원했는가' 같은 장기 장르·장소 추세를 볼 때 쓴다. 공연ID나 공연장ID 같은 전역 조인 키가 없어서 KOPIS 공연·공연장 데이터와는 공연장소 이름이나 장르명을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 공연 장소, 장르, 공연 일정, 지원기관 등 공연예술장 운영에 대한 구체적 정보가 약 40년간 기록되어 있습니다. 해당 데이터를 통해 문화산업 전반의 흐름에 대한 파악이 가능합니다. 또한 지역별 공연 특색을 파악한 문화격차 해소, 공공예술정책 수립, 예술인 지원정책 설계 등을 도모하는 기초참고자료로써 사회적 가치 창출에 기여할 것으로 기대됩니다.해당 데이터는 시기별 공연 장소 수요, 장르 트렌드의 시간적 패턴 학습이 가능한 장기 시계열 데이터입니다. 전국 공연장소, 장르 등이 지역, 유형별로 고르게 포함되어 있습니다. 데이터 사용자가 AI 학습에 활용할 수 있도록 표준 csv 기반 정형데이터로 제공합니다.
