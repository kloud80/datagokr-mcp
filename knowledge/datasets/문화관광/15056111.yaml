summary_user: 경상남도가 지정한 도 기념물을 한 건씩 담은 목록 파일로, 종목·관리번호·기념물명·지정일자·소재지를 담으며 범위는 경상남도 전역, 위치는 개별 주소 단위다(포털 설명 기준 2026년 4월 30일 225건). 도민·연구자·지자체 담당자가 '우리 시군에 어떤 도 기념물이 있고 언제 지정됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 유산 API나 다른 시도 유산 목록과는 기념물명·소재지를 이름으로 맞춰 이어 써야 한다.
description_portal: 경상남도 기념물은 도내 국가지정문화유산(사적)으로 지정되지 아니한 문화유산 중 역사적 가치, 학술적 가치가 뛰어난 유산을  지정하여 보존.관리하고 있습니다. 2026년 4월 30일 기준으로 경상남도 기념물 현황은 총 225건 이며, 유형별로는 선사시대 , 정치.국방, 산업.교통,주거생활, 제사.장례에 관한 유적, 인물의 기념과 관련된 유적 등으로 분류하고 있습니다.본 데이터는 기념물 종목, 관리번호, 기념물명, 지정일자,  소재지 등의 항목으로 정보를 제공합니다.  * 미집계 데이터는 공란 처리하였습니다.
