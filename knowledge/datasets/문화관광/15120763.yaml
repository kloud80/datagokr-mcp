description_portal: 본 데이터는 공공도서관의 단행본 도서 삭제 정보이다. 도서별 분류기호, 수입구분, 수입년도, 저작자, 크기, 삭제날짜, 발행년, 최초배가일자 등의 세부 내용을 포함한다. 단행본 정보는 도서관 이용자가 원하는 책을 검색하고 대출하는 데 필요한 기본 자료이다. 해당 정보는 도서관 장서 관리, 도서 구입 계획 수립, 이용자 서비스 개선에 활용된다. 분야별 장서 현황 분석을 통해 부족한 분야의 도서를 확충하고 균형 잡힌 장서 구성을 도모할 수 있다. 시민들이 도서관 소장 도서를 온라인으로 검색하고 대출 가능 여부를 확인하여 도서관 이용 계획을 수립하는 데 유용하다. 또한 독서 문화 진흥 및 평생 교육 프로그램 운영에 필요한 기초 자료를 제공한다. 신간 도서 입고 및 폐기 도서 처리 시 정보가 업데이트된다.
