description_portal: 2011~2024년 인천아트플랫폼 월별 이용객 수 제공을 통해 인천아트플랫폼에 관심이 많은 시민들에게 유익한 정보를 제공하고자 합니다.1. 2014년도까지는 중앙광장 통행인원을 포함하여 관람객 산정2. 2015년도부터는 경영평가 기관의 지적에 따라 관람객을 프로그램 참여자에 한정함(전시, 공연, 교육, 축제 등)3. 2020년도는 183일간 임시휴관 하였으며, 사회적 거리두기에 따라 대부분의 프로그램을 온라인으로 진행함4. 2022~2023년도는 코로나19에 따른 사회적 거리두기 지침이 해제되며 기획사업 및 기획전시 등 계획 대비 정상 운영함5. 2024년 정상 운영
