summary_user: 경상남도 거창군에 있는 게임업(게임제공업 등) 영업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업체명·도로명/지번주소·위도·경도를 포함하며 CSV 용량이 약 2KB로 작은 규모입니다. 거창군 주민이나 창업 예정자가 "우리 동네 근처에 PC방·오락실 같은 게임 영업소가 어디에 몇 곳 있나"를 확인하거나, 분석가가 지도에 업소 위치를 찍어 보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소 문자열이나 위도·경도 좌표 매칭으로, 또는 같은 거창군 기관의 다른 업종 현황과 나란히 놓는 방식으로 이어 쓴다.
description_portal: 경상남도 거창군 게임업 현황에 대한 데이터로 경상남도 거창군 게임업 현황 업종, 경상남도 거창군 게임업 현황 업체명, 경상남도 거창군 게임업 현황 도로명주소, 경상남도 거창군 게임업 현황 지번주소, 경상남도 거창군 게임업 현황 위도, 경상남도 거창군 게임업 현황 경도 항목을 제공합니다.○ 게임제공업은 게임물을 이용할 수 있도록 하는 영업을 말합니다. 즉, 일정한 물리적 장소에 설비를 갖추고 게임물을 제공하는 사업을 의미합니다. 이에는 청소년이용불가 게임물과 전체이용가 게임물을 포함할 수 있습니다.
