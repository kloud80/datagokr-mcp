description_portal: 올림픽공원 내 위치하고 있는 올림픽수영장 강좌정보입니다.  수영강습, 필라테스, 헬스,  바디컨트롤, 요가, 라인댄스, 가요교실, 발레핏, 벨리댄스, TRX요가, 점핑트램폴린, 아티스틱 스위밍 등 다양한 강좌들이 있습니다.강좌 시작일, 강좌명, 시작시간, 종료시간, 정원, 강좌금액,시작일,종료일 등 정보입니다. 하나의 강좌명에 대해 해당 기간별 여러개의 강좌가 보이도록 처리되어있습니다.  종료일이 9999-12-31 인경우 현재 영구 기간으로 등록되어있는 강좌입니다.2013년 부터 2026년 5월 강좌까지 확인하실수 있습니다.
