summary_user: 경정 경주에 쓰이는 모터를 연도(stnd_yr)와 모터번호별로 묶어 출주횟수, 1~3착 횟수, 평균착순점, 연대율, 최소 소개항주타임을 담은 집계 성적 데이터로, 전국 단위·비공간 자료다. 경정 팬이나 분석가가 "이번 경주에서 선수가 추첨으로 배정받은 모터가 올해 몇 번 출주해 몇 번 입상했나"처럼 모터 성능을 비교하고 경주를 예측하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 모터번호와 연도를 같은 기관의 경정 출주표·경주결과 데이터에 이름이나 코드로 맞춰 붙여야 한다.
description_portal: 서울올림픽기념국민체육진흥공단 경륜경정총괄본부에서 제공하는 경정모터정보는 연도 및 모터번호별로 출주횟수, 1~3착 횟수, 6회 평균착순점, 연대율, 최소 소개항주타임 등 다양한 성적 데이터를 포함한 API 서비스입니다. 경정경주에서 모터는 보트, 선수와 함께 경기 결과에 큰 영향을 미치는 핵심 장비로, 공정성을 확보하기 위해 경주 전 선수들이 직접 추첨을 통해 모터와 보트를 배정받습니다. 이 정보는 모터 성능을 분석하고 경기 예측 및 전략 수립에 활용할 수 있어 관계자와 팬 모두에게 중요한 참고 자료로 활용됩니다.
