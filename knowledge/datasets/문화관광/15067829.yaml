summary_user: 독립기념관이 관리하는 국외 독립운동 사적지별 첨부 이미지 파일의 관리정보를 파일 1건당 1행으로 담은 CSV 파일(약 1.2MB)이며, 사적지 번호(관리번호)·파일명·파일 설명·정렬 순서·등록/수정일자를 포함한다. 포털 설명에 따르면 사적지 하나에 보통 1~8개 안팎의 이미지가 등록된다. 독립운동 사적지 안내 콘텐츠나 아카이브를 만드는 사람이 특정 사적지에 어떤 사진이 있고 각 사진이 무엇을 찍은 것인지 확인할 때 쓰며, 실측 컬럼에서 전역 조인 키는 찾지 못해 같은 기관의 국외사적지 목록 데이터와 사적지 번호(관리번호)를 맞춰 이어 쓴다.
description_portal: 독립기념관에서 관리하고 있는 국외사적지별 첨부파일에 대한 관리정보이다.관리하고 있는 주요 항목으로는 사적지번호, 첨부화일 이미자료명, 첨부화일 제목, 첨부화일 설명 등이다.보통 1개의 사적지에 대해 1~8개 내외의 이미지를 등록하여 관리하고 있다.사적지번호         첨부화일 제목(사적지명)     첨부화일 순서          첨부화일명                                        첨부화일 설명    HL01_0101       한성전기회사 사옥 터            1                               HL01_0101_01.jpg                      한성전기회사 사옥 터 주변           HL01_0101       한성전기회사 사옥 터            2                               HL01_0101_02.jpg                      한성전기회사 사옥 터-현 장안빌딩         HL01_0101       한성전기회사 사옥 터            3                               HL01_0101_03.jpg                      한성전기회사
