description_portal: 한국언론진흥재단 미디어연구센터에서 정부광고 수수료를 활용하여 제작한 조사연구 자료입니다. 언론 자유와 기사삭제 청구에 대한 시민 인식조사를 주제로 한 사회적 이슈 관련 일회성 조사로, 언론의 보도 자유와 개인의 삭제 요구권 사이의 갈등 상황에 대한 일반 시민들의 인식과 태도를 체계적으로 분석했습니다. 디지털 시대 언론 환경 변화와 개인정보보호에 대한 사회적 관심이 높아지는 상황에서 언론 자유의 가치와 개인의 권리 보호 간의 균형점에 대한 시민 의식을 파악하고자 했습니다. 조사연구에 대한 PDF 파일 형태로 제공되며, 공공누리 공공저작물 자유이용허락 조건에 따라 연구자와 일반인 모두 자유롭게 열람하고 활용할 수 있습니다.
