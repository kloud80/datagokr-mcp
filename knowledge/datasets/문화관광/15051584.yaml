summary_user: 인천광역시 군구별로 국보·보물·사적·명승·천연기념물 같은 국가지정유산과 시도유형문화유산·기념물·무형유산 등 시지정유산, 국가·시도 등록문화유산의 종류별 개수를 담은 집계표로, 543바이트 크기의 작은 CSV 파일입니다. 인천의 어느 군구에 어떤 종류의 지정·등록 유산이 몇 건씩 있는지 비교하려는 분석가나 지역 문화정책 담당자가 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 군구 이름으로 맞춰 이어 쓰고, 개별 유산의 종목코드·지정번호·소재지가 필요하면 국가유산청 자체 API를 따로 쓴다.
description_portal: 인천광역시의 국가유산 현황표입니다. 해당 자료는 인천광역시의 지정유산과 등록문화유산을 포함하고 있으며 국가지정, 시지정으로 분류한 자료입니다. 인천광역시 내 군구별 문화유산의 자료가 포함되어 있습니다. 국가지정유산으로는 문화유산과 자연유산으로 분류됩니다. 문화유산에는 국보, 보물, 사적, 민속문화유산이 포함되어 있으며자연유산에는 명승, 천연기념물 및 무형유산이 별도로 있습니다. 시지정유산으로는 유형문화유산, 기념물, 민속문화유산, 문화유산자료, 자연유산, 무형유산으로 분류됩니다.등록문화유산 또한 국가등록문화유산과 시등록문화유산으로 분류됩니다.
