description_portal: 전라남도 목포시 문화예술과에서는 2022년 이전 종료된 공공미술 프로젝트를 통해 설치된 미술작품의 현황을 체계적으로 관리하고 있습니다. 본 데이터는 당시 조성된 공공미술 작품의 명칭과 해당 설치 장소 정보를 포함하고 있으며, 시민 누구나 지역 내 조형 예술작품의 위치 및 존재 여부를 확인할 수 있도록 구성되었습니다. 공공미술은 도시 환경의 품격을 높이고 주민의 문화 향유 기회를 확대하는 중요한 자산으로, 본 자료는 행정적 활용뿐만 아니라 교육, 관광, 도시계획 등 다양한 분야에 유용하게 쓰일 수 있습니다. 본 데이터는 문화예술 기반 자산의 유지·보존 및 지속적인 관리의 일환으로 제공되며, 정기적으로 확인·갱신되고 있습니다. 공공데이터 포털을 통해 자유롭게 열람하실 수 있습니다.
