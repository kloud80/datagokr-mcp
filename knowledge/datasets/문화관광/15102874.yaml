description_portal: '예술의전당 대관시설 정보(2012~2028)- 관련 데이터: 연도, 장소, 신청건수, 신청기획사수, 승인건수, 승인기획사수- 데이터 기간: 2012 ~2028- 예술의전당의 대관은 공연, 전시 등을 위해 예술의전당 내 다양한 공간을 외부 기획사에 임대하는 절차를 말합니다. 예술의전당 대관시설 정보 데이터는 공연장·전시실의 대관절차중 신청 및 승인 이력을 통계적으로 보여주는 자료입니다.    이 데이터는 기획사들의 수요(신청)와 공급(승인)의 차이, 그리고 승인율을 분석하는 데 유용합니다. 예를 들어 승인율 = 승인건수 ÷ 신청건수 × 100(%) 으로 계산할 수 있습니다.   * 하나의 기획사가 여러 건을 신청할 수 있으므로 신청건수는 신청기획사 수보다 많을 수 있습니다.'
