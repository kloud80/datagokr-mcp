description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 오조포구마을길은 제주 서귀포시 성산읍 오조리에 위치한 해안 포구와 마을길이 연결된 관광 코스로, 바다와 성산일출봉 조망이 가능한 평탄한 포장 보행로와 무장애 편의시설(장애인 전용 주차구역, 무단차 출입로, 보행폭 확보 등)이 일부 구간에 갖춰져 있어 휠체어 사용자, 유모차 동반자, 고령자 등 누구나 비교적 무리 없이 포구 산책, 바다 경관 감상 및 마을길 탐방을 즐길 수 있는 열린 관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
