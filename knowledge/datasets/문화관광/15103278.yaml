summary_user: 경기도 이천시에 있는 지정문화재를 한 건씩 담은 목록 파일로, 구분·지정번호·문화재명·수량·소유자·소재지·지정일·관리자·비고 9개 항목이 있다(약 5.7KB CSV). 이천시에 어떤 국가·도 지정문화재가 어디에 있고 누가 소유·관리하며 언제 지정됐는지 확인하려는 주민, 문화관광 기획자, 지역사 연구자가 쓴다. 전역 조인 키가 없어 국가유산청 API의 종목코드·지정번호와는 문화재명과 지정번호를 직접 대조해 이어 써야 하고, 소재지 주소는 주소 정제를 거쳐 지도·필지 데이터와 붙인다.
description_portal: 본 데이터는 경기도 이천시에 소재한 지정문화재의 현황을 체계적으로 관리하기 위한 자료로, 구분, 지정번호, 문화재명, 보유 수량, 소유자, 소재지, 지정일, 관리자, 비고 등 총 9개 항목으로 구성되어 있습니다. 각 항목은 해당 문화재의 행정 구분, 법적 지정번호, 실물 수량, 소유 관계, 위치 정보 등을 포함하고 있으며, 문화재의 체계적인 보존·활용을 위한 기초 자료로 활용됩니다. 이 데이터는 문화재 행정관리, 보존계획 수립, 문화관광자원 개발, 문화재 관련 통계 산출 등 다양한 목적에 활용될 수 있으며, 지자체의 문화유산 관리 정책 수립과 공공서비스 기획 시 기반 자료로도 사용됩니다. 특히 문화재별 소재지 및 지정일 정보는 문화재 연혁 분석 및 지역문화자산 연구, 학술조사에도 기여할 수 있습니다.
