summary_user: 경기도 시군별로 추진한 공공체육시설 확충 사업을 사업 한 건당 한 행으로 담으며, 시군명·사업명·지원금액(백만원)·주요시설정보(트랙, 인조잔디 운동장, 탁구장 등)로 구성된다. 체육 정책 담당자나 분석가가 "우리 시군은 다른 시군보다 체육시설 확충 지원금을 얼마나 받았고 어떤 시설을 지었나"를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm)을 이름으로 맞춰 연결해야 한다.
description_portal: '이 데이터는 지역별 공공체육시설 확충 현황을 정리한 자료로, 각 시군에서 추진한 체육시설  확충을 위한 관련 사업의 세부정보를 제공합니다. 데이터는 ‘시군명’, ‘사업명’, ‘지원금액(백만원)’, ‘주요시설정보’의 네 개 항목으로 구성되어 있으며, 체육시설의 설치 시군과 명칭, 사업별 예산 규모, 주요 시설 유형(예: 트랙, 인조잔디 운동장, 탁구장 등)을 포함하고 있습니다. 이 데이터는 지방자치단체의 체육 인프라 정책 수립 및 지역 간 지원금 비교 분석, 생활체육 활성화 방안 마련 등에 활용될 수 있습니다. 데이터의 지원금 단위는 백만원이며, 일부 항목은 학교 운동장을 포함하여 다양한 공공장소에서의 체육시설 조성을 다룹니다.'
