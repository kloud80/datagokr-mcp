description_portal: 서울특별시 광진구_옥외광고업 인허가 정보는 광진구 관내에서 간판, 현수막, 전단지, 벽보 등 다양한 옥외 광고물의 제작, 표시, 설치를 수행하거나 옥외광고를 대행하는 업소에 대한 인허가 현황을 제공합니다. 본 데이터는 광고물의 유형에 따라 필요한 게시시설을 설치하고, 지정된 장소에 적법하게 광고를 진행할 수 있는 자격을 보유한 사업체 정보를 담고 있으며, 옥외 광고의 안전성 확보와 도시 미관 유지에 기여합니다. 포함된 주요 항목은 업소명, 소재지 주소, 업종명, 인허가일자, 허가번호, 영업상태 등으로 구성되며, 위치 정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공됩니다. 위도·경도 좌표는 포함되어 있지 않으며, 제공되는 정보는 3일 이내의 최신 자료를 기반으로 합니다. 옥외 광고 관련 행정 업무, 정책 수립, 현황 분석 등에 활용할 수 있는 유용한 데이터입니다.
