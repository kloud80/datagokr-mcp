summary_user: 경상북도 칠곡군 관내 주요 관광명소를 한 곳당 한 행으로 정리한 목록 파일(csv, 약 5.7KB)로, 명소 이름·위치·소개·전화번호·홈페이지·데이터기준일자를 담는다. 칠곡군을 찾는 여행자나 지역 관광 안내 서비스를 만드는 사업자가 '칠곡에 가볼 만한 곳은 어디이고 연락처와 위치는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 관광명소명·주소 문자열 매칭이나 같은 기관(칠곡군) 기준으로만 이어 쓰며, 전국 단위 관광 콘텐츠는 TourAPI(contentId·지역코드)가 대표 원장이다.
description_portal: 본 데이터는 경상북도 칠곡군 관내 주요 관광지에 대한 위치 정보, 관광명소 소개, 주소, 홈페이지, 문의 연락처 등을 정리한 데이터입니다. 문화유산, 자연지형, 유적지, 지질공원 등 다양한 관광 자원을 포함한다. 칠곡군을 방문하는 이용자가 목적지 탐색, 경로 설정, 사전 정보 확인 등에 활용할 수 있도록 구성되었으며, 관광 홍보 및 지역 문화유산 보존 자료로도 활용 가능하다. 행정기관 및 민간 서비스 제공자에게도 관광 정보 연계 기반자료로 제공된다. 전체 데이터는 칠곡군 관할 지역에 국한되며 정기적으로 최신화될 예정이다.
