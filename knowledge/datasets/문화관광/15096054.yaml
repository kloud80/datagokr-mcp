summary_user: 충청남도 계룡시 안의 공립·사립 작은도서관을 도서관 한 곳당 한 건으로 담은 목록으로, 도서관명·운영 유형·운영 주체·소재지·개관 요일과 시간·휴관일·면적·장서 수·열람석 수·연락처·등록일을 포함한다. 계룡시 주민이 집 근처에서 주말에 문을 여는 작은도서관이 어디인지, 분석가가 시 안의 작은도서관 장서와 열람석 규모가 어떻게 분포하는지 확인하는 데 쓴다. 실측 컬럼에 도서관코드 같은 전역 조인 키가 없어, 다른 도서관 데이터(도서관정보나루 등)와는 도서관명이나 소재지 주소를 맞춰 연결해야 한다.
limits: 범위가 계룡시 한 곳이라 다른 시군구와 비교하려면 별도 데이터가 필요하다. 도서관코드·ISBN 같은 공통 키가 없어 대출·인기 도서 데이터와 바로 연결되지 않는다. 호출에는 포털에서 발급받은 serviceKey가 필요하고, 개발계정은 하루 10,000회로 제한된다.
