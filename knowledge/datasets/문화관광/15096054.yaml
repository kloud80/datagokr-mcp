description_portal: 충청남도 계룡시의 '작은도서관' 데이터는 지역 주민들의 생활 속 독서 환경 조성 및 문화 향유 증진을 위해 운영되는 소규모 도서관들의 상세 운영 정보 자료입니다. 이 데이터에는 각 작은도서관에 대해서 도서관명을 비롯하여, 운영의 성격을 나타내는 운영 유형과 실제 관리 주체를 나타내는 운영 주체 정보가 명시되어 있습니다. 또한, 도서관을 방문하는 이용자를 위해 정확한 소재지와 더불어, 개관 요일, 시간, 정기 휴관일 등의 운영시간 정보가 상세히 기록되어 있습니다. 나아가, 도서관의 규모를 가늠할 수 있는 면적(단위_제곱미터), 보유 도서 권수, 이용 가능한 열람석 수 등 물리적 현황을 제공합니다. 문의를 위한 연락처와 공식 등록일 정보도 포함되어 있습니다.
