summary_user: 대구광역시 북구 관내 숙박업소를 업소 한 곳당 한 행으로 담으며, 업종(일반·생활숙박), 신고일자, 업소명, 도로명·지번 주소, 전화번호, 객실수를 포함한다. 북구에 숙박업소가 몇 곳 있고 객실 규모가 어느 정도인지, 특정 동네에 어떤 숙박시설이 신고돼 있는지 확인하려는 주민·사업자·숙박 시장 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 문자열을 맞추거나 같은 기관 자료끼리 이어 써야 하며, 공중위생법 신고 기반의 지방행정 인허가(LOCALDATA) 숙박업 자료와 대조하는 용도가 대표적이다.
limits: 범위가 대구 북구 한 시군구로 한정되므로 대구 전체나 다른 지역과 비교하려면 다른 자료를 따로 모아야 한다. 업소를 식별하는 공통 코드가 없어 다른 데이터와 연결할 때 이름·주소 매칭 오류에 주의해야 한다.
