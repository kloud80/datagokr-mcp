summary_user: 강원특별자치도 안의 관광숙박시설(호텔)을 한 곳당 한 행으로 담은 파일로, 시도·시군구, 업종, 호텔명, 호텔등급, 도로명주소를 포함한다. 여행객이나 여행사가 '강릉·속초에서 몇 성급 호텔이 어디에 있나'를 확인하거나, 지자체·분석가가 시군별 관광숙박 인프라 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구 이름이나 호텔명·도로명주소를 맞춰 붙여야 하며, 주소를 좌표로 바꾸면 지도·관광지 데이터와 겹쳐 볼 수 있다.
limits: 등록번호·사업자번호 같은 공통 키가 실측 컬럼에 없어 관광사업 등록 원장 등과 정확히 일대일로 잇기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 강원특별자치도 한 곳으로 한정되며, 파일 형태라 실시간 갱신 여부는 이 자료만으로 확인되지 않는다.
