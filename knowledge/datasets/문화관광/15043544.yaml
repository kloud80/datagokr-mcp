summary_user: 제주민속촌 한 곳의 무장애여행 정보를 장소 단위로 담은 파일로, 위도·경도·해발고도 좌표와 장소 설명, 이미지, 장애인 주차장·휠체어 접근로·장애인 화장실 같은 교통약자 편의시설 정보를 담는다. 휠체어 이용자나 유아 동반 가족이 제주민속촌 안에서 어디까지 편하게 이동할 수 있는지 확인하거나, 지자체·여행 서비스가 무장애 관광 지도를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 장소명이나 좌표로 맞춰 이어야 하며, 같은 제주 무장애여행정보 시리즈 파일들과 묶어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 제주민속촌 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 제주민속촌은 19세기 말 당시 제주 도민의 생활방식과 민속문화를 고증에 따라 재현한 야외 민속박물관으로, 산촌·중산간촌·어촌·토속신앙촌 등에 속한 전통가옥을 포함해 약 100여 채의 가옥과 농기구, 생활용구 등 민속 자료가 전시되어 있다. 본 무장애여행 데이터셋은 이 관광지의 위도·경도 좌표, 장소명, 장소 설명, 이미지 정보뿐 아니라 장애인 전용 주차장, 휠체어 접근로, 장애인 화장실, 유모차 대여, 완만한 동선 등 교통약자 접근성을 고려한 편의시설 정보를 포함하고 있다. 따라서 관광약자, 고령자, 유아 동반 가족 등 다양한 이용자가 보다 편리하게 이용할 수 있으며, 관광 안내, 무장애 관광지 홍보, 열린관광지 조성, 관광 정책 수립, 지도 및 콘텐츠 제작 등 공공 및 관광 분야에서 기초자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
