summary_user: 제주 신흥리 방파제와 환해장성 구간의 무장애 관광 정보를 지점별 행으로 담은 파일이며, 구분·유형·추천여부·비고 항목으로 편의시설·접근성 정보를 정리한다. 장애인·고령자·교통약자나 그 보호자가 "휠체어로 신흥리 방파제 산책로를 다닐 수 있고 주차장·화장실은 어디 있나"를 여행 전에 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지(contentId) 등 다른 데이터와는 장소명 매칭으로만 연결한다.
description_portal: '제주특별자치도 내 신흥리방파제와환해장성 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도_신흥리방파제와 환해장성_무장애여행관광정보」 로, 제주특별자치도 디지털혁신과에서 제공하는 무장애 관광 안내 자료이다. 신흥리 방파제 및 환해장성 구간에 대해 코스 개요, 주소 및 위치 정보, 주차장 및 화장실 등의 편의시설 현황, 휴무일 및 관람료 등의 운영 정보, 각 포인트별 사진 이미지 자료 등이 포함되어 있다. 이 자료는 장애인·고령자·교통약자 등이 여행 전에 시설 접근성 및 경로 상태를 확인하여 보다 안전하고 쾌적한 여행을 계획할 수 있도록 돕는다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
