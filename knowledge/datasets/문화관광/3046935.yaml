summary_user: 경기도 화성시 주요 관광지(공룡알화석산지, 국화도, 우리꽃식물원, 융건릉, 향토박물관)별 관광객 수를 구분 항목별로 정리한 집계 파일로, 2KB 남짓한 소규모 CSV입니다. 화성시 관광정책 담당자나 지역 분석가가 "융건릉과 국화도 중 어느 관광지에 방문객이 더 몰리고 시기별로 어떻게 달라지나" 같은 질문에 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 공통 조인 키가 없어, 다른 관광지점 입장객 통계와는 관광지명 또는 화성시라는 지역명으로 직접 맞춰 이어 써야 한다.
limits: 관광지가 열(컬럼)로 펼쳐진 가로형 표라 관광지별로 행을 세워 쓰려면 형태 변환이 필요하고, 조인 키가 없어 이름 매핑으로만 다른 데이터와 연결된다. 범위는 화성시 한 곳의 비공간 집계라 지점 좌표나 방문객 특성(연령·출신지 등)은 담지 않는다.
