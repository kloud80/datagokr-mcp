summary_user: 국립중앙극장이 보유한 의상·소품·장신구·배경막 같은 공연용품을 물품 한 건씩 담은 목록으로, 물품명·공연명·총수량과 보유수량·단가·대여비·보관처·담당 부서를 함께 적는다(CSV 약 500KB). 외부 극단이나 공연 기획자가 '특정 작품에 쓰인 의상이나 소품을 빌릴 수 있는지, 대여비는 얼마인지'를 확인하거나, 극장 자산을 관리하고 예산을 잡을 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID와 바로 붙지 않으며, 공연명(공연명)을 이름으로 맞춰 KOPIS 공연 목록 등과 이어 써야 한다.
description_portal: 국립중앙극장이 보유하고 있는 공연용품 정보를 체계적으로 관리하는 데이터셋입니다. 의상, 소품, 장신구, 배경막 등 다양한 공연 관련 물품의 명칭, 수량, 단가, 대여비, 보관처, 부서 등 주요 정보를 포함하고 있어 공연 준비 및 자산 관리에 활용할 수 있습니다. 또한 외부 기관이나 단체에서 공연용품 대여를 계획할 때 필요한 정보를 신속하게 파악할 수 있어 효율적인 자원 활용이 가능합니다. 공연 예술 분야 연구, 문화재 관리, 예산 산정 등 다양한 목적으로 활용될 수 있으며, 공연 기획자나 관련 종사자에게 실질적인 도움을 제공합니다.
