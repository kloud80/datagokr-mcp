description_portal: 안양시 시립도서관은 매년 독서마라톤 대회를 매년 개최하며 참가자는 대회 기간 동안 읽은 책의 페이지 수를 기록하고 이를 마라톤 거리로 환산하는 프로그램입니다.해당 대회는 일반 시민, 학생, 어린이 등 다양한 유형으로 구성되며, 각 유형에 맞는 독서 목표를 설정할 수 있습니다. 이 행사는 시민의 자기계발과 독서습관 형성에 기여하며, 도서관의 문화행사로서 지역사회와의 소통을 강화합니다. 참가자는 독서 기록을 통해 성취감을 얻고, 도서관은 이를 바탕으로 맞춤형 프로그램을 기획할 수 있습니다.대회는 상반기에 시작되어 하반기까지 이어지며, 참가 신청은 도서관 홈페이지를 통해 가능합니다.
