summary_user: 서울 강북구 수유동·우이동 일대 북한산 자락에 있는 순국선열 묘역(손병희·여운형·이준·김병로·이시영·조병옥 선생 묘역과 광복군 합동묘역 등)을 묘역별 한 행으로 묘역명, 주소, 국가유산 등록현황, 기준일자와 함께 담은 소규모 파일(CSV 약 1.3KB)이다. 강북구 일대 독립운동가·애국지사 묘역 답사 경로를 짜거나 어느 묘역이 국가유산으로 등록돼 있는지 확인하려는 시민·교사·지역 연구자가 쓴다. 전역 조인 키나 국가유산 종목코드·지정번호가 없어서, 국가유산청 유산 목록과는 묘역명·주소를 직접 맞춰 이어 쓴다.
limits: 국가유산 지정번호·소재지 PNU 같은 공통 코드가 없어 다른 유산 데이터와 자동으로 결합되지 않는다. 범위는 강북구 안의 선열묘역에 한정되고, 묘역 관람·행사·관리 정보는 담지 않는다.
