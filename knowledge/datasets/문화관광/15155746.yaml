description_portal: 이 데이터는 영화진흥위원회의 예산재무회계(ERP) 시스템 운영에 필요한 계정과목코드를 정리한 자료입니다.계정과목코드, 계정과목구분코드, 상위계정과목코드 등 시스템 운영에 필수적인 데이터베이스(DB) 테이블 구조와 데이터 내용이 포함되어 있습니다.※ 일부 항목은 DB 컬럼 특성상 필수값이 아니거나, 폐기일자가 아직 발생하지 않은 경우 공란으로 제공될 수 있습니다.국민은 이를 통해 공공기관의 예산재무회계시스템 운영 방식과 현황을 이해할 수 있습니다.예산재무회계 담당자 및 실무자는 ERP 운영을 위한 코드 체계, 메뉴 구성, 데이터베이스 구조를 파악하여 업무 프로세스 개선, 시스템 고도화, 정보 관리 체계 구축에 참고할 수 있습니다.
