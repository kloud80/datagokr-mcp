summary_user: 문화체육관광부와 산하 공공기관이 만든 3D 에셋·동영상·이미지·오디오·텍스트·인공지능 학습데이터 같은 디지털 문화자원을 자원 한 건 단위로 담고, 자원명·설명·제공 기관·공공누리 유형·데이터 유형 분류·조회수·다운로드 수·수정일을 함께 준다. 콘텐츠 제작자나 연구자가 '상업적으로 써도 되는 공공누리 유형의 문화유산 3D·이미지 자료가 어느 기관에 있는가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관아이디·기관명(instId, instNm)이나 작가명·전시명 같은 이름 매핑으로만 잇는다.
description_portal: 대한민국 문화체육관광부 및 산하 공공기관에서 생산된 다양한 디지털 문화자원을 한 곳에서 조회할 수 있는 데이터셋입니다. 3D 데이터 에셋, 동영상, 이미지, 오디오, 텍스트, 인공지능 학습데이터 등 다양한 유형의 문화자료를 포함하고 있으며, 각 자원의 설명, 저작권 유형, 분류 정보, 제공 기관, 다운로드 수, 최종 수정일 등 주요 정보를 제공합니다. 연구, 교육, 콘텐츠 개발, 인공지능 학습 등 다양한 분야에서 활용할 수 있으며, 디지털 문화자원의 접근성과 활용도를 높이고자 하는 기관 및 개인에게 유용한 자료입니다.
