summary_user: 인천광역시 안 캠핑장을 한 곳당 한 행으로 정리한 목록 파일로, 명칭·주소·전화번호·홈페이지와 수용인원·규모·주차시설·개장기간·휴무일·반려동물 동반 여부·예약방법을 담는다. 캠핑객이 '인천에서 반려견과 함께 갈 수 있고 홈페이지로 예약되는 캠핑장이 어디인가'를 찾거나, 관광 분석가가 인천 캠핑장의 수용 규모와 운영 기간을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 야영장 등록 자료나 관광 데이터와는 캠핑장 이름·주소를 맞춰 붙여야 한다.
description_portal: 인천광역시 내에 존재하는 캠핑장 목록을 파일데이터 형태로 제공합니다.제공데이터는 다음과 같습니다. - 캠핑장명칭, 캠핑장주소, 캠핑장 전화번호, 홈페이지 주소, 캠핑 수용인원, 캠핑장 전체규모, 주차시설, 이용가능시간, 개장기간, 휴무일, 애완동물동반 가능여부, 예약방법(전화예약, 홈페이지예약 등)인천관광공사는 공사 공공데이터 개방 및 인천관광 활성화를 위하여 주기적으로 데이터를 현행화하여 제공할 예정입니다.인천시 캠핑장 관련 문의는 공사홈페이지 및 공공데이터 통합플랫폼을 통해 해주시기 바랍니다.
