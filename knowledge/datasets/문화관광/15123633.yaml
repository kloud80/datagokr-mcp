description_portal: 본 데이터는 한국관광공사에서 제공하는 '여행가는 달' 콘텐츠의 태그 목록입니다. 여행가는 달은 한국관광공사와 문화체육관광부에서 국내 여행 수요 확대 및 지역경제 활성화를 위하여 추진하는 대국민 국내관광 캠페인으로, 1개월의 기간 동안 핵심 여행 할인혜택(교통, 숙박, 여행상품)을 제공하고, 민관 협업을 통한 지역 특화 관광 콘텐츠를 발굴/홍보하며 다양한 여행 프로그램을 통해 전국적인 국내 여행 활성화 분위기를 조성하고 있습니다. 본 데이터로 그간 진행되었던 여행가는 달 콘텐츠 명, 소속 태그를 확인하실 수 있습니다.
