description_portal: 국립소록도병원의 문화유산 현황을 설명합니다. 소록도 자혜의원 본관 등17건 문화유산에 대한  설명으로 문화유산명, 소유 및 관리자, 지정일자 등 정보를 담았습니다. 소록도는 섬 전체가 병원으로 운영되어 섬 곳곳에 한센병 역사 흔적이 남아 았습니다. 그 중 건축물 14건과 동산분야 3건이 문화유산으로 등록되어 있습니다. 소록도 내 문화유산 17건은 소록도 한센인들의 100년 역사를 증명하는 자료로 향후 소록도의 장소성을 확인하고, 집합적 정체성을 구성할 매우 중요한 자료들입니다.
