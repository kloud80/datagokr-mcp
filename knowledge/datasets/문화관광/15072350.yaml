summary_user: 전국 장애인도서관별로 평가년도마다 장서(인쇄 도서자료) 수, 대출권수, 자료구입비를 담은 집계 파일로, 행정구역·시군구 단위까지 위치를 적는다. 정책 담당자나 연구자가 '어느 시군구의 장애인도서관이 장서와 자료구입 예산에 비해 대출이 적은가'처럼 지역별 장애인 정보 접근 격차를 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 도서관 데이터와는 도서관코드나 도서관명·시군구 이름 매칭으로만 이어 쓴다.
description_portal: 전국 장애인도서관의 운영 현황과 주요 통계 정보를 종합적으로 파악할 수 있는 데이터로, 평가년도, 도서관구분, 도서관코드, 도서관명, 행정구역, 시군구, 장서수, 대출권수, 도서예산 등 다양한 항목을 포함하고 있습니다. 장애인도서관의 지역별 분포와 자원 현황, 도서 대출 및 예산 규모 등 세부적인 정보를 제공하여, 장애인 정보 접근성 향상 정책 수립이나 지역별 도서관 서비스 개선, 연구 및 행정 자료로 활용하기에 적합합니다. 도서관 서비스의 형평성과 접근성 분석, 장애인 문화복지 증진 방안 마련 등 다양한 분야에서 참고 자료로 활용하실 수 있습니다.
