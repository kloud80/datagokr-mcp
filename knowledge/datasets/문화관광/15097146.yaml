summary_user: 제주시 한림읍 금능리 일대 제주올레길 14코스 휠체어구간을 무장애여행코스로 정리한 파일로, 코스 위 지점별로 순서·위도·경도·구분·설명과 전체코스·추천코스 여부를 담는다. 장애인·노약자·영유아 동반 가족이 이 해안 산책로를 휠체어로 다닐 수 있는지, 주차장과 장애인 화장실이 어디 있는지 미리 확인하는 데 쓰고, 무장애 관광 콘텐츠 제작이나 접근성 개선 검토에도 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 관광 데이터와는 위경도 좌표나 코스·지점 이름으로만 이어 붙인다.
description_portal: '제주특별자치도 내 제주올레길14코스(휠체어구간)금능리_무장애여행코스 데이터를 제공합니다.* 제주특별자치도 제주시 한림읍 금능리 일대의 제주올레길 14코스(휠체어구간)는 장애인·노약자·영유아 동반 가족 등 관광약자의 무장애 여행을 위해 설계된 평탄한 해안 산책로입니다. 본 자료에는 해당 코스의 주소, 주차장(장애인 주차구역 포함), 장애인 화장실 등 접근성 핵심 편의시설, 추천 동선 및 코스 길이 등이 포함되어 있어, 이동이나 이용에 제약이 있는 이용자도 사전 방문 계획을 수립할 수 있도록 구성되어 있습니다. 또한 이 정보는 무장애 관광 콘텐츠 제작, 관광서비스 접근성 개선 및 정책 수립·평가 등에 활용 가능한 기초자료입니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
