description_portal: '2015~2016년도 시점의 제주특별자치도 성연령별 제주도민 300그리드단위 유동인구 현황입니다.유동인구란 일정 시간 동안 해당 지역을 방문하거나 이동한 사람들의 수를 말합니다. * 그리드(Grid) : 격자 단위 (본 데이터는 300m × 300m 크기의 격자(grid)를 사용함)* 데이터 구분자 : ""|""* 특이사항1 : 유동인구 추정과정에서 비율을 사용하여 유동인구 수가 소수점으로 표현됨* 특이사항2 : 유동인구는 단위지역에서 이동이 있는 개념으로 인구수와 달리 중복 카운트가 발생함※ 파일 다운로드 시 데이터에 대한 설명 txt 파일이 포함되어 있습니다.'
