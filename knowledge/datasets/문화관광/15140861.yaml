summary_user: 서울특별시 광진구 관내에서 게임물배급업 인허가를 받은 업소를 업소별 건 단위로 담으며, 업소명·소재지(지번·도로명 주소)·인허가일자·폐업일자·영업상태·중부원점TM 좌표 등을 수록한다. 사업자나 분석가가 광진구에 현재 영업 중인 게임물배급업체가 어디에 몇 곳 있고 언제 인허가를 받았는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)·관리번호로만 연결한다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 게임물배급업 인허가를 받은 업소 현황을 제공합니다. 게임물배급업은 「게임산업진흥에 관한 법률」에 따라 게임물을 수입하거나 저작권을 보유 및 관리하면서, 이를 게임제공업소나 관련 사업자에게 공급하는 영업 형태를 말합니다.광진구 내 게임물배급업체에 대한 업소명, 사업장 소재지, 인허가일자, 업종 분류, 영업상태, 관할 행정기관 등의 정보가 수록되어 있으며, 이는 지역 게임산업 유통 구조 파악, 불법 게임물 유통 관리, 콘텐츠산업 정책 기반자료, 업계 트렌드 분석 등에 활용될 수 있습니다.※ 좌표 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 좌표는 포함되어 있지 않습니다.※ 본 데이터는 3일 전 기준의 최신 인허가 내역을 반영하고 있습니다.
