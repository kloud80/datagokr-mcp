summary_user: 대한체육회가 집계한 종목별 국내·국제 대회 일정을 대회 한 건당 한 행으로 담은 CSV 파일(약 2.9MB)로, 대회설명·종목단체·개최단체·시작/종료일자·개최지·국제대회 여부·단체 홈페이지 링크를 담는다. 선수·지도자·동호인이나 스포츠 분석가가 "올해 특정 종목의 국내외 대회가 언제 어디서 열리고 어느 단체가 주최하나"를 확인할 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 종목단체명·개최지 같은 이름 매핑으로만 이어 쓴다.
description_portal: 대한체육회가 제공하는 종목별 국내대회 및 국제대회의 일정에 대한 전반적인 정보를 담고 있습니다. 이 데이터는 각 행사(대회) 정보의 게시등록일 정보를 포함하며, 대회별 대회설명, 종목단체, 개최단체 등 행사의 성격과 주최 기관에 대한 정보를 제공합니다. 또한, 시작일자, 종료일자, 개최지를 통해 행사 일정과 장소를 명확히 파악할 수 있으며, 단체홈페이지, 자료바로가기를 통해 관련 정보에 쉽게 접근할 수 있습니다. 좀 더 세부적인 대회의 정보가 필요한 경우에는 각 회원종목단체로 문의 하셔야 합니다.
