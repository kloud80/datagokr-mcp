description_portal: '○ 통계개요* 통계명 : 출판관련업체 현황* 통계종류 : 서울시 각 자치구 출판관련업체 현황을 제공하는 일반ㆍ조사통계* 작성목적 : 한국표준산업분류에 의해 "제조업-출판, 인쇄 및 기록매체 복제업"으로분류된 산업체 현황을 파악하여, 산업체에 대한 효율적인 지원과 관련정책수립을 위한 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 자치구 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 출판, 인쇄 및 기록매체 복제업(서적출판업ㆍ신문, 잡지 및 정기간행물 출판업ㆍ오디오물출판 및 기타출판업 등)의 사업체수 및 종사자수'
