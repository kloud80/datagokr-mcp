description_portal: 광주광역시에 소재한 영화상영관 현황입니다. 총 19개의 상영관이 있으며 동구에 6개 서구에 3개 북구에 3개 광산구에 7개가 있습니다. 영화상영관의 종류로는 메가박스, 롯데시네마, CGV, 광주극장, 광주독립영화관, 광주자동차가 있습니다. CGV는 총 7개가 있고, 롯데시네마는 5개, 메가박스는 4개, 광주극장, 광주독립영화관, 광주자동차극장이 있습니다. 데이터에는 상영관별 전화번호와 홈페이지주소까지 나와있으니 각 영화상영관에 대한 일반적인 자료를 얻는 데 부족함이 없을 것입니다. 문화산업 활성화를 위해 영화상영관 지원은 잘 이루어져야하며 이를 위해 공공데이터를 목록화가 잘 이루어져 편리한 데이터 이용이 촉진되는 것을 목적으로 합니다.
