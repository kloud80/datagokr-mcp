summary_user: 경제·교통·법률·의학·정보통신 등 분야별 전문용어 한 건마다 수어 명칭, 수형 설명(signDescription), 수형 이미지, 주제 분류·키워드, 저작권 정보를 담은 건별 원천 데이터이며, 범위는 전국이고 공간 정보와는 연결되지 않습니다. 수어 통역사나 교육자가 '이 의학·법률 용어를 수어로 어떻게 표현하나'를 확인하거나, 개발자가 수어 학습 콘텐츠를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 용어명(title)이나 주제 분류 같은 이름 매핑으로만 이어 쓴다.
description_portal: 전문 분야별 용어의 수어 표현과 관련 정보를 통합적으로 제공하여, 다양한 산업 및 학문 분야에서 수어 활용도를 높일 수 있도록 지원합니다. 경제, 교통, 법률, 의학, 정보통신 등 여러 분야의 전문용어에 대한 수어 명칭, 수형 설명, 수형 이미지, 관련 장소, 시간적 범위, 저작권 정보 등 상세한 데이터를 포함하고 있습니다. 수어 통역사, 교육자, 연구자, 개발자 등에게 전문용어의 정확한 수어 표현을 전달함으로써, 정보 접근성을 높이고 수어 기반 콘텐츠 개발 및 학습 자료 제작에 유용하게 활용할 수 있습니다. 또한, 다양한 주제 분류와 키워드 정보를 제공하여 원하는 용어를 손쉽게 검색하고 활용할 수 있도록 구성되어 있습니다.
