summary_user: 한국관광공사가 해외 MICE(회의·포상관광·컨벤션·행사) 관계자를 위해 만든 국내 MICE 시설 영문 정보를 시설 1곳당 1행으로 담은 CSV 파일(약 154KB)로, 시설명·상세내역(규모·위치·객실 수·특징)·시설 형태·홈페이지·주소를 전국 범위로 제공한다. 해외 기획사나 영문 서비스 개발자가 '한국에서 국제회의나 인센티브 행사를 열 만한 시설은 어디이고 규모와 특징은 어떤가'를 확인하거나 영문 안내 앱·웹에 시설 목록을 넣을 때 쓴다. 실측 컬럼에 TourAPI contentId 같은 전역 조인 키가 없어, 다른 관광 데이터와는 시설명·주소를 맞춰 붙여야 한다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 MICE(회의, 인센티브(포상 휴가), 컨벤션 및 행사) 관광과 관련된 영문 시설정보 데이터입니다. 데이터는 각 MICE 관련 시설의 시설명, 상세내역(크기와 위치, 객실 수, 특징 등), 형태, 홈페이지 및 주소 등의 정보는 포함합니다. 본 데이터는 한국 내 회의, 인센티브, 컨벤션 및 행사 주최 의사가 있는 해외 MICE 관련산업 종사자들에게 시설을 홍보·설명에 직접 활용 또는 관련 모바일 어플리케이션 및 웹 서비스를 개발하는 데에 할 수 있습니다. 추가적인 MICE 관련 정보는 한국관광공사 MICE 정보시스템(https://k-mice.visitkorea.or.kr/)에서 확인하실 수 있습니다.
