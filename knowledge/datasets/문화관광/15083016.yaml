summary_user: 충청남도 시군이 운영·관리하는 대표 관광지를 한 행에 한 곳씩 관광지명·주소·연락처와 함께 시군별로 정리한 목록 파일(csv, 약 11KB)이다. 충남 여행을 계획하는 사람이나 여행업체가 '이 시군에 어떤 대표 관광지가 있고 연락처는 무엇인가'를 확인하거나, 분석가가 시군별 관광지 분포를 비교하는 데 쓴다. 전역 조인 키나 코드 필드가 없어 TourAPI 관광지 원장 등 다른 데이터와는 관광지명·주소 문자열 매칭이나 시군명으로만 이어 쓴다.
limits: 관광지 코드(TourAPI contentId 등)나 좌표 필드가 없어 다른 관광 데이터와 바로 결합되지 않고, 이름·주소 매칭에 의존해야 한다. 관광 콘텐츠 분야에서는 보조 등급으로 분류돼 상세 정보가 필요하면 TourAPI 관광지 데이터를 기준으로 삼는 것이 낫다.
