description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 자구리공원은 제주 서귀포시 동홍동(이어도로) 해안에 위치한 도심 속 해안 산책 공원으로, 바다 조망이 뛰어난 포장 산책로와 완만한 경사 보행로, 벤치 및 휴식 공간이 조성되어 있으며 해안 절경과 야간 조명이 어우러진 산책 환경을 갖추고 있다. 무장애 관광지 정보에는 장애인 전용 주차구역, 무단차 출입구, 장애인 화장실 등 접근성 편의시설이 포함되어 있어 휠체어 이용자, 유모차 동반 가족, 고령자 등도 비교적 편안하게 해안 산책과 전망 감상을 즐길 수 있는 열린 관광지로 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
