summary_user: 경기도 내 관광 숙박업체를 사업장 한 곳당 한 행으로 담은 인허가 원천 자료이며, 인허가·폐업 일자, 영업상태, 객실 수, 건물 층수·면적, 자본금, 회의실 수용 인원과 부대시설, 주소와 좌표가 들어 있다. 관광 분석가나 지자체 담당자가 '경기도 시군별로 지금 영업 중인 관광숙박업체와 객실 규모는 얼마나 되는가' 같은 숙박 시장·관광 인프라 질문에 쓴다. 전역 조인 키는 없으므로 경기도 시군 코드(SIGUN_CD)로 같은 기관의 다른 데이터와 묶고, 그 밖의 데이터와는 사업장명·주소·위경도로 맞춰 쓰며, 인허가 공통 원천인 지방행정 인허가(LOCALDATA) 숙박업 자료와 대조할 때도 이 방식을 쓴다.
description_portal: 경기도 내 관광 숙박업체 인허가 현황입니다. 관광객이 잠을 자고 머물 수 있도록 시설(취사시설 포함) 및 설비 등의 서비스를 제공하는 업소의 정보를 제공합니다.이 데이터는 경기도 내 관광숙박업체의 운영 현황을 나타내는 자료로, 사업장명, 시군명, 인허가일자, 영업상태, 소재지 및 도로명 주소, 시설면적, 자본금, 부대시설 내역 등 총 42개 항목으로 구성되어 있습니다. 각 숙박업체의 인허가 정보와 영업 여부(영업중, 폐업 등), 시설 규모, 놀이시설, 방송 및 발전시설, 회의실 수용 인원 등 관광객 수용 능력에 대한 정보를 포함하고 있으며, 숙박업체 운영 실태 파악, 지역 관광 인프라 분석, 정책 기반 데이터로 활용될 수 있습니다. 특히 사업장별 세부 정보는 관광 정책 수립, 숙박 수요 예측, 안전시설 현황 점검 등 다양한 분야에서 유용하게 쓰일 수 있습니다.
