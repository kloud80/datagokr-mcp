summary_user: 경상남도 안의 미술관을 한 곳씩 담은 시설 목록으로, 시군구·명칭·대표자·전화·팩스·도로명주소·홈페이지를 조회하는 API입니다. 경남 주민이나 여행자가 '우리 시군에 어떤 미술관이 있고 연락처·주소는 무엇인가'를 찾을 때, 분석가가 시군별 미술관 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 문화기반시설 코드(cultural_facility_cd) 등과 직접 연결되지 않으며, 시설명·도로명주소를 맞춰 다른 문화시설 데이터와 이어 쓴다.
