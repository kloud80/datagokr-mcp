description_portal: 국립중앙박물관 교육 통합 플랫폼 "모두(MODU)"는 국립중앙박물관 및 소속 13개 박물관의 교육 콘텐츠를 통합 제공하는 플랫폼이다. 커뮤니티 콘텐츠 데이터는 모두플랫폼을 이용하는 사람들이 박물관 교육을 쉽고 재미있게 이해할 수 있도록 퀴즈 등의 이용자 참여형 콘텐츠를 제공하고 있다.  퀴즈는 객관식, 주관식 등으로 이루어져있으며 퀴즈와 관련된 내용은 모두플랫폼에 있는 교육 동영상, 교육 활동지, 연구자료에서 살펴볼 수 있도록 구성되어있다. 퀴즈에 참여하면 기록이 누적되어 확인할 수 있다.
