summary_user: 부산 영도구의 당일·숙박 관광 코스를 코스별 한 행으로 담은 작은 CSV 파일(약 3.8KB)로, 관광구분·숙박 여부·코스명·코스 경로 설명을 담는다. 영도구를 찾는 여행자나 지역 관광 콘텐츠를 만드는 사업자가 '영도대교 도개 관람이나 흰여울 문화마을·태종대를 묶은 하루 코스는 어떻게 짜나'를 확인할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 코스정보 안의 장소 이름을 직접 맞춰 이어야 한다.
description_portal: 부산광역시 영도구 관광 시 유용하게 참고할 수 있는 영도구 당일 및 숙박 관광 코스 정보를 제공합니다.영도대교 도개관람형 코스(1~5코스), 체험관광형 코스(6~9코스), 등반산책형 코스(10~11코스), 스토리형 코스(12~13코스), 체류형 코스(14~15코스) 등 다양한 테마별 코스를 제공합니다.영도대교에서는 매주 토요일 14:00부터 15분간 국내 유일의 도개 행사를 진행하고 있으며, 흰여울 문화마을과 절영해안산책로를 따라 걸으로 바다의 절경을 감상할 수도 있고, 국립해양박물관을 통해 해양 체험형 관광을 하고 태종대의 해안 절경을 감상할 수도 있습니다.
