summary_user: 서울특별시 용산구에 신고된 당구장업(당구장·실내당구장)을 사업장 한 곳당 한 행으로 담은 인허가 명부로, 상호명, 지번·도로명 주소, 인허가일과 폐업일, 영업상태, 좌표 등을 포함한다. 창업 예정자나 상권 분석가가 '용산구에서 영업 중인 당구장은 어디이고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 관리번호(MGTNO)·주소·상호 같은 이름 매칭이나 같은 기관(개방자치단체) 코드로만 연결하고, 같은 축의 다른 체육시설업·상권 데이터와 나란히 놓고 보는 방식이 적합하다.
description_portal: 서울특별시 용산구에 정식으로 신고된 체육시설업 중 당구장업(당구장, 실내당구장)의 현황 정보를 제공하고 있습니다. 이 정보에는 용산구 내 위치한 당구장업(당구장, 실내당구장)에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구에 정식으로 신고된 다른 업종의 신고체육시설업의 정보 또는 공공체육시설에 대한 정보가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
