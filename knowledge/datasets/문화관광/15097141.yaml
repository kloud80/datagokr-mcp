summary_user: 제주 위미 동백나무 군락 일대의 무장애 여행코스를 지점 단위로 담은 파일로, 순서·위도·경도와 함께 지점 구분, 설명, 상세정보, 전체·추천코스 여부, 데이터기준일자를 담는다. 휠체어 이용자나 고령자 등 관광약자가 위미 동백군락을 둘러볼 때 어떤 동선으로 가고 어디서 쉬거나 편의시설을 이용할 수 있는지 확인하는 데 쓰고, 지자체·분석가는 무장애 관광환경 개선의 기초자료로 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 TourAPI contentId 등과 바로 이을 수 없고, 위도·경도로 다른 공간 데이터와 겹쳐 보거나 지명·같은 기관 코드로만 연결한다.
description_portal: '"제주특별자치도 내 제주특별자치도_위미동백나무군락_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 위미 지역의 동백나무 군락지 일대를 대상으로 구성된 무장애 여행 코스 정보를 제공한다. 해당 구간의 이동 동선, 휠체어 접근 가능 지점, 전망 및 휴식 공간, 편의시설 위치 등을 포함해 관광약자와 이동취약계층의 안전하고 편리한 관광을 지원하기 위해 구축된 자료이다. 현장 기반의 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 접근성 요소를 비롯하여 자연경관 보전과 무장애 관광환경 조성 정책 수립에 활용될 수 있는 기초자료를 제공한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
