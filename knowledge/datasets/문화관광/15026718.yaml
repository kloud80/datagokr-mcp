description_portal: '"체력단련 장비"는 신체 능력을 향상시키기 위한 운동기구나 기계를 말합니다. 일반적으로 다음과 같은 종류로 나뉩니다:1. 유산소 운동 기구 (Cardio Equipment): 심폐 기능을 강화하고 지방 연소를 돕는 장비입니다. - 러닝머신 (트레드밀): 걷기나 달리기용, 사이클 머신 (자전거 타는 기구): 실내 자전거,  엘립티컬 머신: 무릎에 부담을 덜 주며 전신 유산소 운동, 스텝퍼/클라이머: 계단 오르기 동작2. 근력 운동 기구 (Strength Training Equipment): 근육을 키우거나 근력을 강화하는 데 사용됩니다. - 덤벨/바벨: 자유중량 운동 기구, 케이블 머신: 다양한 방향으로 당기거나 밀 수 있음, 벤치 프레스 머신: 가슴, 어깨, 삼두 운동, 레그 프레스 머신: 하체 근력 강화, 멀티 스테이션 머신: 여러 부위 운동이 가능한 복합 기구3. 기타 보조 운동 도구 - 폼롤러: 근막 이완 및 스트레칭, 매트: 바닥 운동 시 사용, 저항 밴드: 스트레칭 또는 근력 운동 보조, 메디신볼 / 케틀벨: 전신 기능성 트레이닝창녕군 시설관리공단 체육시설물 헬스장에서 보유중인 체력단련 장비 현황 내역(품명, 규격, 수량등) 데이터를 제공합니다.'
