description_portal: 이 데이터는 동작여성인력개발센터에서 제공하는 수강 가능한 교육강좌 목록을 담고 있습니다. 강좌명, 교육내용 요약, 수강대상, 신청 가능 여부, 운영기관·기간 등 주요 항목이 포함되어 있어, 여성 인력 역량강화 프로그램을 빠르게 파악할 수 있도록 설계되어 있습니다. 제공된 정보는 접수 마감된 강좌를 제외한 실제 신청 가능한 상태의 강좌들로 구성되어 있어, 교육기획자나 수요자 모두에게 실질적인 수강 기회 탐색에 유용합니다. 또한 자치구 차원에서 여성교육 강좌의 유통 구조, 대상별 공급량, 지역 내 교육격차 등을 분석할 수 있으며, 수강자 모집 전략, 교육 프로그램 개선, 지역사회 역량강화 이니셔티브 설계 등에 활용될 수 있습니다.동작여성인력개발센터에서 실시하는 교육강좌 정보입니다. 교육신청은 http://dongjak.seoulwomen.or.kr/ 에서 직접 하셔야 합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://dongjak.seoulwomen.or.kr/ 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
