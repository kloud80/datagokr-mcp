summary_user: 경기도 가평군 관내 농어촌민박업소를 사업장 1곳당 1행으로 담은 개별 현황 파일이며, 검증 시 1,067행이 수신됐고 사업장명·객실 수·서비스 대상 구분·외국어 안내 여부를 포함한다. 가평군에 민박이 어디에 몇 개 객실 규모로 있는지, 외국인 대응 민박이 어디 있는지 알고 싶은 분석가나 지자체 담당자가 지역 숙박 인프라 분석에 쓴다. 도로명주소·지번주소(address)와 위도·경도(coord)를 키로 다른 숙박·관광 데이터나 지도 자료와 이어 쓰며, 인허가 원천(LOCALDATA) 같은 숙박업 자료와 짝지어 본다.
description_portal: 해당 데이터는 경기도 가평군 관내에서 운영 중인 농어촌민박업 현황을 정리한 자료로, 농어촌 지역에서 관광객을 대상으로 숙박 서비스를 제공하는 소규모 민박업소의 운영 실태를 파악할 수 있습니다. 데이터 항목에는 사업장명, 업종명, 서비스 대상 구분(내국인·외국인 여부 등), 외국어 안내 서비스 제공 여부, 소재지 도로명 주소 및 지번 주소, 객실 수, 위도, 경도, 데이터 기준일자 등이 포함되어 있습니다. 농어촌민박업은 「농어촌정비법」에 따라 등록된 사업으로, 농촌 지역 경제 활성화와 도시민의 농촌 체험 확대를 목적으로 운영됩니다. 이 자료는 농촌관광 정책 수립, 지역별 숙박 인프라 분석, 외국인 관광객 대응 전략 마련 등 다양한 행정 및 산업적 활용이 가능한 기초정보입니다.
