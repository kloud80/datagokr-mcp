summary_user: 공공누리시스템의 추천 공공저작물 이미지를 저작물 한 건 단위로 담은 파일(CSV 약 42MB)로, 상·중·하위 분류, 저작물명, 촬영년도, 촬영·소장기관, 이용유형, 썸네일·원본 파일 경로, 조회수, 키워드를 포함한다. 교사나 콘텐츠 제작자가 '수업자료나 홍보물에 저작권 걱정 없이 쓸 수 있는 특정 주제의 공공 이미지가 무엇이고 어떤 이용조건인가'를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 촬영기관 코드·기관명이나 분류 코드명 같은 이름·코드 매핑으로만 연결한다.
description_portal: 공공누리시스템에서 제공하는 추천 공공저작물 이미지 데이터는 저작물코드, 상위·중위·하위 코드 및 명칭, 저작물명, 촬영년도, 촬영기관 및 소장기관 정보, 저작물이용유형코드, 썸네일 및 원본 파일 경로, 삭제여부, 조회수, 저작물구분, 키워드 등 다양한 항목으로 구성되어 있습니다. 이를 통해 공공저작물 이미지의 체계적인 분류와 관리가 가능하며, 문화콘텐츠 개발, 교육자료 제작, 연구 및 홍보 등 다양한 분야에서 활용할 수 있습니다. 저작물의 상세 정보와 이용 유형을 확인하여 저작권 걱정 없이 안전하게 이미지를 사용할 수 있도록 지원합니다.
