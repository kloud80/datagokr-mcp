description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."*보롬왓은 제주 서귀포시 표선면에 위치한 자연 체험형 관광지로, 계절마다 메밀, 유채, 튤립, 수국, 맨드라미 등 다양한 꽃과 초원이 펼쳐지는 넓은 농장과 정원, 동물농장, 카페, 꽃밭 산책로 등을 포함한다. 해당 데이터에는 이 관광지의 위치정보, 명칭, 주변 편의시설, 접근로 및 환경 정보 등이 담겨 있으며, 관광약자나 휠체어 이용자 등을 포함한 방문자가 가능한지 여부를 가늠할 수 있는 무장애 주변정보가 일부 제공된다. 본 정보는 관광 코스 설계, 장애인·고령자 친화 여행 안내, 열린관광지 홍보, 관광 콘텐츠 제작, 접근성 기반 정책 수립, 지도 서비스 개발 등 공공과 관광 분야의 기초자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
