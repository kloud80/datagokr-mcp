summary_user: 인천시가 선정한 우수 숙박업소(I_STAY) 가운데 부평구 소재 업소의 업종, 업소명, 도로명주소, 전화번호를 업소 한 곳당 한 행으로 담은 소규모 목록 파일(csv 약 900바이트)이다. 부평구를 찾는 여행객이 '인천시 인증을 받은 믿을 만한 숙소가 어디 있고 어떻게 연락하나'를 확인하거나, 지자체 담당자가 우수 숙박업소 현황을 관리하는 데 쓴다. 전역 조인 키나 코드표가 없어, 숙박업 인허가 자료(LOCALDATA) 같은 다른 데이터와는 업소명·도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '인천시에서 선정한 우수 숙박업소인 ‘I_STAY’ 인증업체의 업종, 업소명, 소재지, 연락처를 정리한 자료.관광객 대상 신뢰도 높은 숙박정보 제공 및 지역 숙박업소의 위생·서비스 품질 향상 유도를 위한 행정지원 기반자료로 활용됨.활용 목적 및 특징– 인천시가 인증한 숙박업소 정보를 통해 여행객의 숙박 선택 지원– 우수 숙박업소 발굴·관리 및 지역 관광 활성화를 위한 자료로 활용– 업종 구분을 통한 다양한 형태의 숙박시설 정보 제공– I_STAY 브랜드 신뢰도 기반 관광객 만족도 향상 기여주요 항목 설명● 업종: 숙박업소의 업종 구분 (예: 호텔, 모텔, 게스트하우스 등)● 업소명: I_STAY 인증을 받은 우수 숙박업소의 명칭● 소재지(도로명주소): 업소가 위치한 도로명 주소● 전화번호: 숙박업소의 대표 연락처'
