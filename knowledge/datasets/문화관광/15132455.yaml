description_portal: 한국학중앙연구원의 ‘고문서 자료 지역별 보유 정보’ 데이터는 전국 각 지역에서 보유하고 있는 고문서 자료의 분포 현황을 파악할 수 있도록 구성된 자료입니다. 이 데이터는 시도명, 시군구명, 자료 보유 건수의 세 가지 항목으로 구성되어 있으며, 특정 지역이 보유하고 있는 고문서의 수량을 통해 지역별 문화유산 및 역사자료의 집중도나 분포 양상을 확인할 수 있습니다. 이를 통해 연구자나 일반 국민은 특정 지역의 고문서 보유 현황을 비교·분석할 수 있으며, 지역문화재 관리나 보존정책 수립, 학술 연구 등의 기초자료로 활용될 수 있는 유용한 공공데이터입니다.
