summary_user: 빅카인즈(BIGKinds)에서 뽑은 평등 관련 뉴스 기사의 메타데이터를 기사 한 건당 한 행으로 담은 CSV 파일(약 5.3MB)로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목을 포함한다. 연구자나 정책 담당자가 '성평등이나 차별 해소 보도가 언제, 어느 언론사에서, 어떤 키워드로 늘었는가'처럼 시기별·언론사별 보도 경향을 살필 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 언론사명이나 일자를 기준으로 다른 빅카인즈 주제별 메타데이터나 언론사 등록 자료와 맞춰 붙여야 한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 평등 관련 뉴스 메타정보 자료입니다. 평등은 헌법과 사회 제도의 근본 가치로, 성평등, 교육 기회의 균등, 노동 시장에서의 차별 해소, 사회적 약자 보호 등 다양한 영역에서 핵심적인 의제로 다뤄지고 있습니다. 본 자료는 국내 주요 신문과 방송 보도에서 평등과 관련된 기사를 분석하여 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 인식 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 평등권 보장, 법·제도 개선, 사회 정의 실현을 위한 논의가 언론 담론에서 어떻게 다뤄졌는지를 객관적으로 살펴볼 수 있습니다. 또한 학술 연구, 정책 수립, 언론 보도 분석, 교육 현장 등에서 활용 가능한 기초 자료로, 평등 사회 구현을 위한 제도적·사회적 방향을 모색하는 데 중요한 참고 자료가 됩니다.
