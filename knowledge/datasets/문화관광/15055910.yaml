summary_user: 전라남도 시군구별 구기체육관을 시설 한 곳당 한 행으로 담은 현황 파일(csv 약 6KB)로, 소유기관·관리주체, 부지·건축·연면적, 가능종목, 바닥재료, 경기장 크기, 좌석수·수용인원, 준공연도, 건설사업비(백만원)를 담는다. 생활체육 동호회나 주민이 '우리 시군에서 배구·농구를 할 수 있는 체육관이 어디이고 관람석은 몇 석인가'를 찾거나, 분석가가 시군별 체육관 규모·노후도를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 시군구명·시설명을 이름으로 맞춰 이어야 한다.
limits: 시설 코드 같은 공통 키가 없어 문체부 전국체육시설 데이터 등과 연결하려면 시군구명·시설명 문자열 매칭에 의존해야 한다. 이용·예약·대관 정보는 들어 있지 않으므로 해당 시군 체육시설 부서나 홈페이지에서 따로 확인해야 한다.
