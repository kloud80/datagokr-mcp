description_portal: '- 전라남도내 구기체육관에 관한 데이터를 조회하실 수 있습니다.- 시군명, 시설명, 소유기관, 관리주체, 부지면적, 건축면적, 연면적, 건축구조, 가능종목, 바닥재료, 폭/길이/면적/높이, 좌석수, 수용인원, 좌석형태, 준공연도, 건설사업비 등에 관한 데이터를 제공합니다.- 전라남도에는 다양한 구기종목을 위한 체육관이 있으며, 각 시군별로 시설이 분포되어 있습니다.- 각 체육관의 이용 및 예약 방법은 해당 시군의 체육시설 관리 부서나 공식 홈페이지를 통해 확인하실 수 있습니다. 일반적으로 온라인 예약 시스템을 통해 사전 예약이 가능하며, 일부 시설은 전화 예약도 지원합니다.- 전라남도의 구기체육관은 지역 주민들의 건강 증진과 체육활동을 지원하는 중요한 시설입니다. 각 체육관의 이용 방법과 시설 정보를 사전에 확인하시어 원활한 이용이 되시길 바랍니다.'
