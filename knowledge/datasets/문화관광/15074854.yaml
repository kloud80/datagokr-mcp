summary_user: 인천광역시 영종구에 등록된 체력단련장업(헬스장 등) 사업장을 한 건씩 담은 명부 파일로, 상호·도로명 주소·전화번호·최초등록일자·최근변경일자·데이터기준일자를 담는다. 영종구에서 헬스장 창업 입지를 검토하는 사업자나 상권 분석가가 '이 지역에 체력단련장이 몇 곳 있고 언제 등록됐는가'를 확인하고, 등록·변경 시점으로 개폐업 흐름을 읽는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 체육시설업 명부나 상권 데이터와는 상호·주소 매칭으로만 잇는다.
description_portal: 인천광역시 영종구가 제공하는 ‘체력단련장업’ 데이터는 영종구 내 영업 중인 체육시설(헬스장·크로스핏 등)의 사업자 정보와 시설 현황을 한눈에 파악할 수 있도록 정리한 자료이다. 사업자명, 업종코드, 주소, 전화번호, 개업연도, 시설 규모·운영시간 등 기본적인 행정 정보를 포함한다.데이터는 2022년 1월부터 매년 1월에 최신화되며, CSV·JSON·XLSX 등 여러 형식으로 제공된다. 주요 필드에는 체육시설업 등록번호, 시설 유형(헬스장, 크로스핏, 종합체육관 등), 주 이용자 연령대, 연간 회원수, 부대시설(샤워실·락커·카페 등) 여부가 포함된다. 또한, 각 시설의 위·경도 좌표가 제공돼 GIS 기반 분석이 가능하다.지방자치단체, 연구기관, 사업자, 시민 등 다양한 이해관계자가 지역 체육 인프라 현황을 파악하고, 신규 입지 선정, 마케팅 전략 수립, 정책 효과 분석 등에 활용할 수 있다. 특히, 운동 참여 촉진 정책이나 건강증진 프로그램 설계 시 기초 자료로서 가치가 높다.
