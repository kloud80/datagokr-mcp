summary_user: 제주 관광지 오설록의 무장애여행 정보를 지점 단위로 담은 파일로, 지점마다 아이디와 위도·경도·해발고도, 장소 설명·이미지 정보가 들어 있습니다. 휠체어 이용자나 교통약자가 오설록을 찾기 전에 장애인 화장실·엘리베이터·주차장 같은 시설이 어디 있는지 확인하거나, 관광 정책 담당자가 무장애 시설 배치를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설·관광지 이름으로 맞추거나 위경도 좌표를 기준으로 겹쳐 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 오설록 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 오설록은 차 문화 전시, 녹차 밭 전망, 체험 공간 등이 결합된 관광지로, 교통약자를 위한 접근성 개선 요소가 반영된 무장애 시설을 제공한다. 본 데이터는 주차장 배치, 이동 경로의 안전성, 휠체어 이동 가능 구간, 실내·외 편의시설 현황 등 이용자의 이동 편의를 높이기 위한 정보를 포함한다. 또한 장애인 화장실, 안내 표지, 엘리베이터 등 주요 시설의 위치 정보를 공공기관 기준에 따라 체계적으로 정리하여 방문자가 시설을 효율적으로 이용할 수 있도록 지원한다. 무장애 관광지의 접근성 평가 및 정보 제공에 활용되는 자료로 구성되어 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
