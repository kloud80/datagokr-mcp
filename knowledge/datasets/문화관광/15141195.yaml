summary_user: 경상북도 고령군이 지정한 향토문화유적을 유적 한 건당 한 행으로 담은 목록 파일(약 3KB CSV)로, 유적명·구분·지정번호·지번/도로명 소재지·지정일자·소유자명이 들어 있다. 고령군을 찾는 관광객이나 지역 해설·교육 콘텐츠 기획자가 "국가·도 지정 문화유산 말고 군이 따로 지정한 향토유적이 어디에 있고 누가 소유하나"를 확인할 때 쓴다. 국가유산청의 종목코드·지정번호나 필지 고유번호 같은 전역 조인 키가 없어서, 다른 유산 목록과는 유적명이나 소재지 주소를 맞춰 연결해야 한다.
description_portal: 경상북도 고령군에 등록된 향토문화유적의 현황을 정리한 것으로, 각 유적의 명칭, 문화재 유형, 소재지 주소, 지정일자, 소유자명 등 주요 정보를 포함하고 있습니다. 해당 자료는 고령군 관내 향토문화유산을 체계적으로 관리하기 위한 기초 행정자료로, 지역의 역사적 정체성과 문화적 전통을 보존하고 계승하기 위한 기반이 됩니다. 특히 향토문화유적은 국가 지정 문화재와는 별도로 지역 고유의 특성과 문화적 가치를 반영하고 있어, 지역민의 문화적 자긍심을 높이고 지역 정체성 확립에 기여합니다. 본 자료는 문화재 보존 및 유지 관리 정책 수립, 지역 기반 관광자원 발굴과 스토리텔링 콘텐츠 개발, 학교 및 지역사회 교육자료 개발 등 다양한 문화 행정 분야에 활용됩니다. 또한 향토유적의 위치와 소유 형태, 지정 이력 등을 종합적으로 파악함으로써 향후 문화유산 보호 계획, 활용 전략 수립, 관광 동선 설계 등에도 유용한 실무 중심의 자료입니다.
