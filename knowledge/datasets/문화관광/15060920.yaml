description_portal: 대전광역시 대덕구 관내 간이 주민운동 시설(야외운동기구) 설치 현황 안내대전광역시 대덕구는 주민들의 건강 증진과 여가활동 활성화를 위해  유휴공간 등 다양한 지역에 간이 주민운동 시설(일명 야외운동기구)을 설치해오고 있습니다.본 시설은 주민 누구나 자유롭게 이용할 수 있도록 개방형으로 설치되며, 주로 노약자와 중장년층, 일반 주민들이 기초적인 근력 강화 및 스트레칭 등을 할 수 있도록 구성된 기구들로 이뤄져 있습니다. 주요 설치기구로는 하체운동기구, 상체운동기구, 허리돌리기, 철봉, 공중걷기, 어깨돌리기 등 다양한 기능성 운동기구가 포함됩니다.각 기구는 해당 장소의 면적, 주민 수요, 이용 편의성 등을 종합적으로 고려하여 배치되며, 설치연도에 따라 일부 기구는 노후되어 교체 또는 보수계획이 수립되어 있는 상태입니다.설치장소는 각 동 구민 이용이 많은 공원 및 산책로 주변에 집중되어 있으며, 설치연도는 구별로 상이하나 대체로 2010년대 초반부터 순차적으로 설치가 이루어졌으며, 일부 지역은 최근까지도 지속적으로 신규 설치되고 있습니다.이와 같은 야외운동기구 설치 현황은 구민들의 건강한 생활환경 조성을 위한 기본 인프라로서 활용되고 있으며, 향후 주민들의 이용 편의성과 안전성 강화를 위해 정기적인 유지보수 및 신규 설치 수요조사 등을 통해 시설 개선이 이루어질 예정입니다.
