summary_user: 광주광역시 북구에 있는 민간 체육시설업 업체를 업체 한 곳당 한 행으로 담은 명부로, 사업장명·대표자·전화번호·주소·업종분류와 데이터기준일을 CSV 파일(약 69KB)로 제공한다. 북구에서 헬스장·당구장·체육도장 같은 체육시설업 업체가 어디에 몇 곳 있는지 찾는 주민이나, 업종별 분포를 상권 신호로 보는 분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 데이터와는 주소나 사업장명을 맞추거나 같은 북구 데이터끼리만 이어 쓴다.
description_portal: 광주광역시 북구에 소재한 체육시설업 업체의 현황 데이터입니다.각 체육시설별 사업장명, 대표자, 전화번호, 주소, 업종분류 정보를 공공데이터포털을 통해 CSV 파일로 제공합니다.* 사업체 주소는 도로명주소를  기준으로 표기하였습니다. 단, 체육시설업 업체 위치가 도로명주소가 부여되지 않은 장소이거나 업체 위치의 도로명주소를 확인할 수 없는 경우에는 부득이하게 지번 주소로 표기하였습니다.** 사업체 대표자가 두 명 이상인 경우, 대표자 1인만 명시한 후, "(외 N 명)" 의 형태로 표기하였습니다.
