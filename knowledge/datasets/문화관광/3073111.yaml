summary_user: 한국 문화재 분야 용어 2,482건(건축 395, 고고학 884, 미술사 1,203)을 용어 단위로 한자·독음·국영문 설명과 함께 정리한 사전형 원천 데이터로, 포털 CSV 파일로 활용신청 없이 받는다. 번역가나 외국인 대상 해설·관광 안내 자료를 만드는 사람이 '이 문화재 용어를 영어로 어떻게 표기하고 풀이하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 지정 유산 목록(종목코드·지정번호) 등과는 용어 이름(한자·독음)을 문자열로 맞춰 연결해야 한다.
description_portal: 한국 문화재 분야에서 자주 사용되는 주요 용어 2,482건을 국문과 영문으로 정리한 데이터입니다. 한국 문화재 중 건축(395개), 고고학(884개), 미술사(1,203개) 관련 용어를 국영문으로 풀이한 사전입니다.이 데이터는 국내외 연구자, 번역가, 문화유산 관련 종사자들이 한국 문화재 용어를 표준화된 형태로 정확하게 이해하고 사용할 수 있도록 지원하기 위해 마련되었습니다. 각 용어는 건축, 고고학, 미술사 등 다양한 분야를 포괄하며, 전문가의 감수를 거쳐 신뢰성을 확보하였습니다. 해당 데이터는 학술 연구, 영문 번역, 외국인 대상 문화재 해설, 관광 안내 자료 제작 등 여러 방면에서 유용하게 활용될 수 있습니다.이 데이터는 한국 문화유산의 국제적 소통과 이해 증진에 기여할 수 있습니다.
