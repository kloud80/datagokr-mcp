description_portal: 서울시 한양도성 첨부파일 상세 데이터는 한양도성과 관련된 문서, 이미지, 영상 등의 파일 정보를 체계적으로 관리하기 위한 메타데이터입니다. 첨부파일 일련번호는 각 파일을 고유하게 식별하기 위한 기본값이며, 첨부파일순서는 하나의 게시글 또는 자료에 여러 파일이 연결된 경우 표출 순서를 지정하는 데 사용됩니다. 첨부파일경로와 첨부파일 명칭은 서버 내 실제 저장 위치와 시스템에서 사용하는 저장 파일 이름을 의미하며, 첨부파일 본명칭은 이용자에게 보여지는 원래 파일 이름으로 다운로드 시 표시되는 명칭입니다. 첨부파일 확장자와 첨부파일 용량은 파일 유형과 크기를 파악해 이미지, 문서, 압축파일 등 형식별 관리 및 서비스 제공 시 용량 제한, 미리보기 여부 등을 판단하는 기준이 됩니다. 첨부파일 설명은 파일에 담긴 내용, 활용 목적, 관련 구간이나 행사 정보를 보충적으로 기재하는 항목으로, 이용자가 파일을 열어보지 않아도 대략적인 성격을 이해할 수 있도록 돕는 메타정보입니다. 이 데이터는 학술자료, 도성사진, 행사 안내문, 지리정보 문서 등 한양도성 관련 다양한 자료의 파일 관리를 일관성 있게 수행하고, 웹·모바일 서비스에서 파일을 안정적으로 제공하기 위한 핵심 기반 자료입니다.
