summary_user: 저작권산업 대분류(산업분야)별 전국 매출액 규모를 2013~2021년 연도별 열로 정리한 집계 통계로, 포털 설명상 명목·실질 매출액을 WIPO 지침에 따라 통계청 등 자료를 가공해 한국저작권위원회가 자체 산출한 값이다. 분석가나 정책 담당자가 '핵심·상호의존·부분·비전용 지원 등 저작권산업 분야별 매출이 2013년 이후 어떻게 변했나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 산업분야 이름이나 연도를 직접 맞춰 이어 써야 한다.
limits: 전국 단위 집계라 지역별·기업별 매출은 알 수 없고, 포털 설명상 2021년까지의 자료만 담긴다. 공통 코드 키가 없어 다른 통계와 결합할 때는 산업분야 이름을 수작업으로 대응시켜야 한다.
