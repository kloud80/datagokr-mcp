description_portal: 연도별 산업분야 전체 저작권산업 규모_매출액(명목매출액, 실질매출액)- 산업 분야의 통계자료는 WIPO "저작권산업 경제기여도 조사 산출 지침(2015)"에 따라 통계청 등의 자료를 가공하여 한국저작권위원회 자체 산출한 결과임 - 저작권산업은 창작물 및 보호대상물(소설·시·음악·미술·지도·설계도안·영화·소프트웨어 등)의 창작, 생산, 공연, 방송, 전시 또는 도소매 활동을 영위하는 산업과 저작권이 그 산업의 수립에 중요한 역할을 하는 산업(저작권산업 및 4개 산업분야 정의는 WIPO, 저작권기반산업의 경제적기여도 조사 가이드 참고함) - 2021년까지의 자료만을 포함함
