description_portal: '본 데이터는 경기도 가평군 군립도서관홈페이지에 게시된 도서관별 일정 정보를 수록한 자료입니다. 항목에는 도서관명, 구분, 일자, 행사명, 데이터기준일자 등이 포함되어 있으며, 각 도서관에서 월별로 운영되는 문화행사, 강연, 프로그램 등의 일정을 확인할 수 있습니다. 도서관명은 한석봉도서관, 설악도서관, 청평도서관, 조종도서관 등이 있으며, 구분 항목을 통해 행사 유형(강연, 전시, 체험 등)을 파악할 수 있습니다. 본 자료는 도서관별 일정의 시기와 내용을 정리하여 도서관 이용자의 편의를 높이기 위해 제공되며, 도서관 운영 및 참여 프로그램 계획 수립 시에도 유용하게 활용됩니다. 최신 일정은 군립도서관 홈페이지를 통해 실시간 확인할 수 있습니다.*군립도서관홈페이지: https://www.gaplib.go.kr/intro/index.do'
