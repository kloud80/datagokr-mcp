summary_user: 전라남도 농업박물관(나주시 금천면) 체험 프로그램에 들어온 참가 신청을 예약 한 건씩 담은 원천 목록으로, 참가일·신청날짜·진행상태와 성인·청소년·어린이별 참가인원, 신청자 거주 시도·구군을 포함하며 포털에서 약 58KB 크기의 CSV 파일로 받는다. 박물관 운영자나 지역 문화 분석가가 '어느 달에, 어느 지역에서 온 가족 단위 참가자가 체험 프로그램을 많이 신청하는가'를 살펴보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시도·구군 이름이나 같은 기관 데이터의 프로그램ID 매핑으로만 이어 쓰며, 문화시설코드나 좌표가 없어 문화기반시설총람과는 박물관 이름으로 맞춰야 한다.
description_portal: '- 전라남도 농업박물관의 체험 프로그램에 등록한 신청자 목록입니다.(참가일, 진행상태, 신청날짜, 성인참가인원, 청소년참가인원,어린이참가인원, 기타사항, 삭제여부, 기타참가수 등)- 위치: 전라남도 나주시 금천면에 위치한 전라남도 농업박물관은 전라남도의 농업 역사와 문화를 전시하고 있습니다.- 설립 목적: 전라남도의 농업 발전과 농촌 문화의 보존 및 전파를 위해 설립되었습니다.- 농업 역사: 전라남도의 농업 발전 과정과 주요 농작물의 재배 역사에 대한 전시가 이루어집니다.- 농기구 및 도구: 전통 농업에서 사용되었던 다양한 농기구와 도구들을 전시하여 농업 기술의 변천사를 보여줍니다.- 농촌 생활: 농촌 주민들의 일상 생활과 문화, 전통 의식 등에 대한 전시를 통해 농촌 문화의 다양성을 소개합니다.'
