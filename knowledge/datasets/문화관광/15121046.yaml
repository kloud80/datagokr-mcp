description_portal: 본 데이터는 관내 도서관이 소장하고 있는 단행책 정보이다. 도서별 제목, 저자, 출판사, 출판 연도, 분류 번호, 소장 위치 등의 세부 내용을 포함한다. 단행책은 한 권으로 완결되는 도서로서 도서관 장서의 주요 유형이다. 해당 자료는 장서 개발 정책 수립, 도서 구입 계획, 도서관 서비스 개선에 활용된다. 소장 도서 현황 분석을 통해 이용자 수요가 높은 분야의 장서를 확충하고 이용률이 낮은 도서의 폐기 또는 재배치를 결정할 수 있다. 시민들이 원하는 도서를 검색하고 소장 여부를 확인하여 도서관 이용 계획을 수립하는 데 유용하다. 또한 도서관 간 상호대차 서비스 운영 및 지역 도서관 협력 사업에 활용되어 시민의 독서 문화 향유 기회를 확대한다.
