summary_user: 부산 금정구에 등록된 영화상영관을 한 곳씩 상호명(상영관명)과 지번·도로명 소재지 주소로 담은 시군구 단위 파일 목록이다. 금정구 주민이나 상권·문화시설 분석가가 '금정구 안에 등록된 영화관이 어디에 몇 곳 있는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상영관명이나 주소 문자열을 맞춰 붙이거나, 주소를 지오코딩해 다른 시설 데이터와 위치로 겹쳐 쓴다.
description_portal: 영화및비디오물의 진흥에 관한 법률에 따라 영화상영관을 설치 및 경영하려는 자는 법령에 따른 시설을 갖추어 그 시설 소재지의 시장, 구청장 또는 군수에게 등록하여야 합니다.해당 정보는 영화및비디오물의 진흥에 관한 법률에 따라 금정구에 등록된 영화상영관에 대한 것입니다.영화상영관이란 영리를 목적으로 영화를 상영하는 장소 또는 시설을 말합니다.이 정보에는 금정구에 등록된 영화상영관의 상호명과 영화상영관의 소재지 주소가 포함되어 있습니다.데이터 내용을 업무 등에 참고 부탁드리며, 오류가 있을 경우 연락주시면 수정토록 하겠습니다.
