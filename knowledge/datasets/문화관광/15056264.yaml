summary_user: 제주 세계자연유산(제주 화산섬과 용암동굴)을 이루는 구역별로 구분·상세·천연기념물 지정현황·지정연도·등재일을 담은 소규모 목록 파일이다(CSV 635바이트). 제주 세계자연유산에 어떤 곳이 포함되고 각각 언제 천연기념물로 지정되고 세계유산에 등재됐는지 확인하려는 관광·교육 분야 이용자나 분석가가 쓴다. 전역 조인 키는 없어서 국가유산청 유산 목록 등과 이으려면 유산 이름으로 맞추거나 종목코드·지정번호를 따로 매핑해야 한다.
description_portal: "제주특별자치도 내 유네스코 지정 제주세계자연유산과 관련한 데이터를 제공합니다.항목: 구분, 상세, 천연기념물 지정현황, 지정연도, 등재일 등*제주도는 2007년 7월 우리나라 최초로 '제주 화산섬과 용암동굴(Jeju Volcanic Island and Lava Tubes)'이라는 이름으로 세계자연유산에 등재되었다. 등재된 곳은 한라산천연보호구역, 성산일출봉, 거문오름용암동굴계로 제주도 전체 면적의 약 10%를 차지한다.자세한 사항은 세계자연유산 제주 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jejuwnh/index.htm"
