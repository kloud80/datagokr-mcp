summary_user: 전국 전문도서관을 도서관별 한 행으로, 평가년도 기준 장서(인쇄 도서자료) 수·사서 수·방문자 수·자료구입비(천원)를 시도·시군구와 함께 담은 집계 파일이다. 지역별 전문도서관의 장서·인력·예산 규모를 비교하거나, 특정 시군구에 어떤 전문도서관이 있고 이용자가 얼마나 되는지 확인하려는 도서관 정책 연구자와 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도서관코드·도서관명 매핑이나 시군구 이름으로 연결해야 하며, 도서관정보나루 등 도서관코드를 쓰는 데이터와는 코드 대응을 먼저 확인해야 한다.
limits: 표준 조인 키가 없어 다른 도서관·행정 데이터와 결합하려면 이름·코드 매핑 작업이 필요하다. 행정단위는 시군구까지이며, 도서관별 연간 집계라 대출·이용 건별 내역은 담지 않는다.
