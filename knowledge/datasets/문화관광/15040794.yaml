summary_user: 인천어린이과학관에서 운영하는 공연·체험형 프로그램을 공연 한 건당 한 행으로 담은 소규모 파일(csv 약 1.4KB)로, 공연명·공연 시작일과 종료일·공연시간·공연장소·문의처·데이터기준일자를 담는다. 인천어린이과학관 방문을 계획하는 가족이나 지역 문화행사 안내를 만드는 사람이 '이 기간에 과학관에서 어떤 공연을 언제 어디서 하나'를 확인하는 데 쓴다. 전역 조인 키(KOPIS 공연ID 등)가 없어 다른 공연 데이터와는 공연명·장소 이름을 맞추거나 같은 기관(인천시설공단) 자료끼리만 이어 쓴다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 KOPIS 공연 목록이나 예매·매출 데이터와 바로 연결되지 않는다. 명세상 연간·이벤트 단위로 만들어진 뒤 바뀌지 않는 파일이라 상시 최신 공연 일정으로 보기 어렵다. 실측 필드에는 요금·정원이 보이지 않으므로 포털 설명과 달리 참가 비용이나 수용 인원 분석에는 쓰기 어렵다.
