summary_user: 서울 마포구 관광과가 2021 공공데이터 뉴딜 사업 결과로 만든 파일로, 마포구 추천 관광지별 주소, 실측 영역과 네이버 지도상 영역, 상권골목 연장, 관광객수·상가수·SNS 언급량·인지도 응답수를 관광지 한 곳당 한 행으로 담는다. 마포구 관광 담당자나 분석가가 "홍대·망원 같은 관광지의 실제 범위가 지도 서비스 표시와 얼마나 다르고, 방문객·상가 규모는 어느 정도인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 목록이나 상권 데이터와는 관광지 이름이나 주소를 직접 맞춰 이어 써야 한다.
description_portal: 서울특별시 마포구 관광과에서 2021 공공데이터 뉴딜 사업의 추진 결과로 제공하는 마포구 관광지 경계 분석 결과 데이터입니다. 이 데이터는 추천 관광지, 주소, 실측_영역, 네이버_영역, 상권골목 연장, 관광객수, 상가수, SNS 언급량수, 인지도응답수 등이 포함되어 있습니다.이 데이터를 통해 주민과 방문객은 관광지의 위치와 범위를 정확히 파악할 수 있으며, 지자체는 이를 기반으로 관광 안내 서비스 개선, 혼잡도 예측, 관광 기반 시설 배치, 도보 이동 경로 설정, AR·VR 기반 관광 콘텐츠 개발 등 다양한 스마트 관광 정책 및 서비스 개발에 활용할 수 있습니다.
