summary_user: 전북특별자치도 내 미술관을 시설 한 곳당 한 행으로 정리한 현황 파일로, 공립·사립 구분, 운영 주체, 등록일, 연면적, 대표자, 전화번호를 담는다(포털 설명상 18개 미술관, CSV 약 1.2KB). 도내 어느 시군에 어떤 규모의 공립·사립 미술관이 있는지 파악하려는 지역 문화정책 담당자나 문화관광 분석가가 쓴다. 전역 조인 키나 시설코드가 없어, 다른 문화시설 데이터와는 시설명을 맞춰 보는 방식으로만 연결한다.
description_portal: 이 데이터는 전북특별자치도 내 미술관 시설의 운영 형태, 위치, 연면적, 등록일, 대표자 정보, 연락처 등을 종합적으로 정리한 자료입니다. 공립 및 사립 미술관으로 구분되어 있으며, 전주시, 군산시, 익산시 등 도내 주요 시군별로 분포되어 있는 18개 미술관의 세부 현황을 포함합니다. 연면적 기준으로는 대규모 시설부터 소규모 지역 기반 미술관까지 다양하며, 운영 주체는 도지사, 시장, 군수 등의 공공기관 또는 개인으로 나타납니다. 이 데이터는 문화시설 분포를 파악하고, 지역 문화 정책 수립, 문화 관광 자원화, 미술관 접근성 분석 등 다양한 분야에서 활용될 수 있습니다. 특히 지역 간 문화 인프라의 불균형 해소, 공공문화서비스 확대, 지역 예술가 지원 등을 위한 기초자료로서 유용한 역할을 합니다.
