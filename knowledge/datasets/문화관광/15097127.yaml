summary_user: 제주특별자치도 세천포구 일대 무장애 여행 코스를 지점 단위로 담은 데이터로, 각 행에 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부가 들어 있다. 휠체어 이용자나 교통약자 동반 여행자가 세천포구 주변에서 어떤 동선으로 이동하고 어디서 쉬고 전망을 볼 수 있는지 확인하거나, 열린관광지·관광 인프라 개선 검토에 쓴다. 전역 조인 키는 없어 다른 데이터와는 위도·경도 좌표나 지점 이름으로 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 내 제주특별자치도_세천포구_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 세천포구 일대를 중심으로 구성된 무장애 여행 코스 정보를 제공한다. 세천포구 주변의 해안 산책로와 접근 가능한 이동 동선, 전망 지점, 휴게 및 편의시설 정보를 포함하여 교통약자와 휠체어 이용자의 이동 편의를 높이기 위해 구축된 자료이다. 현장 기반의 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등이 반영되어 있으며, 안전한 항포구 관광환경 조성, 열린관광지 개발, 관광 서비스 개선 및 공공정책 수립을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
