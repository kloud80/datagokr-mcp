summary_user: 국립중앙박물관을 포함한 400여 개 협력 박물관·미술관의 소장품 약 280만 건을 건별로 담아, 명칭·보유 기관·소장품번호·국적/시대·분류·재질 같은 기본정보 목록과 단일 소장품 상세(설명, 이미지 목록, 연관 소장품)를 API로 조회한다. 연구자나 문화콘텐츠 기획자가 "특정 시대·재질의 유물을 어느 박물관이 갖고 있는가"를 찾거나 소장품 이미지와 설명을 서비스에 붙이는 데 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키는 찾지 못했으므로, 소장품 코드 목록 오퍼레이션으로 받은 분류 코드와 목록 조회로 얻은 소장품 고유 ID를 상세 조회에 넘기는 내부 연결이 중심이고, 외부 데이터와는 기관명·명칭 매칭으로만 잇는다.
description_portal: '국립중앙박물관을 포함한 400여 개 협력 박물관의 약 280만 건의 박물관/미술관 소장품 정보(소장품 명칭, 소장품 보유 기관, 소장품번호, 국적/시대, 분류, 재질 등)에 대한  목록과 데이터 상세 정보를 호출할 수 있는 API 서비스입니다.[Open API 서비스 제공 목록]1. 소장품 코드 목록: 상위 코드를 기준으로 소장품 구분과 관련된 코드 목록을 조회할 수 있습니다.2. 소장품 목록 조회: 다양한 소장품 관련 코드 및 텍스트 검색 필터를 이용하여 소장품의 기본정보 목록을 조회할 수 있습니다.3. 소장품 상세 조회: 소장품의 고유 ID를 이용하여 단일 소장품의 정보(상세 내용, 이미지 목록, 연관 소장품 목록)를 조회할 수 있습니다.'
