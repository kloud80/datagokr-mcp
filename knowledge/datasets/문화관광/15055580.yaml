summary_user: 전북특별자치도 14개 시군에 있는 지역 문화원의 현황을 문화원별 한 행으로 정리한 소규모 파일(CSV 649바이트)로, 문화원명·설립연도·회장·회원수를 담는다. 도민이 "우리 시군 문화원은 언제 세워졌고 회원은 몇 명인가"를 확인하거나, 분석가가 시군별 문화원 참여 규모를 비교하는 데 쓴다. 전역 조인 키나 시설코드가 없어 다른 문화시설 데이터와는 문화원명·시군 이름을 맞춰 연결해야 한다.
description_portal: 전북특별자치도 내 14개 시군에 설립되어 지역 문화의 발굴, 보존, 창달에 기여하는 '문화원'의 현황을 정리한 데이터입니다. 이 자료는 각 지역 문화원의 명칭과 설립 연도, 그리고 해당 지역의 문화 활동을 이끌어가는 회장의 정보와 함께, 문화에 관심 있는 지역 주민들의 참여 규모를 보여주는 총 회원 수를 포함하고 있습니다. 이 데이터는 각 지역의 문화적 구심점 역할을 하는 기관들의 현황을 한눈에 파악할 수 있게 합니다. 향토사 연구나 지역 문화 프로그램에 참여하고자 하는 도민들에게 유용한 정보를 제공하며, 지역 문화 진흥 정책 수립의 기초 자료로 활용될 수 있습니다.
