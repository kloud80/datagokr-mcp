description_portal: 서울시 예술단 공연 정보는 서울시 산하 예술단의 다양한 공연 일정을 한눈에 확인할 수 있도록 제공하는 데이터입니다. 공연코드와 예술단구분코드·명으로 어떤 예술단이 어떤 공연을 진행하는지 식별할 수 있으며, 공연명과 장르, 공연시작일과 종료일, 시간, 장소 정보를 통해 시민들이 관람 가능한 공연을 쉽게 찾을 수 있습니다. 연령 정보는 관람 가능 대상 연령을 안내하고, 기획사, 문의전화, 문의메일을 통해 상세 문의가 가능합니다. 티켓정보, 할인정보, 유료할인율 항목은 관람료와 혜택을 확인하는 데 유용하며, 게시여부와 게시여부명은 현재 공개된 공연인지 여부를 나타냅니다. 메인이미지와 썸네일이미지는 공연 홍보에 활용되며, 공연개요, 프로그램 정보, 출연진 소개를 통해 공연 내용과 구성, 참여 예술가 정보를 자세히 파악할 수 있는 문화·예술 행정 서비스 데이터입니다.
