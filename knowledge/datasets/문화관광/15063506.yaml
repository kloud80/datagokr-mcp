summary_user: 부산관광포털 비짓부산의 테마여행 추천코스를 장소별로 담은 API로, 코스 제목·장소명·구군·주소·좌표(위도·경도)·연락처·홈페이지·교통·휴무·이용시간·이용요금·상세 설명·대표 이미지를 건별로 제공하며 범위는 부산광역시 한 곳이다. 부산 여행자나 관광 앱 개발자가 '해운대구에서 테마별로 추천되는 코스와 각 장소의 운영시간·교통편은 무엇인가'를 확인하거나 지도에 표시할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광 콘텐츠 등 다른 데이터와는 장소명·주소 매칭이나 좌표 근접으로만 연결한다.
description_portal: 부산관광포털 비짓부산 내 추천여행 중 테마여행에 대한 정보를 제공하는 서비스 입니다.부산의 관광명소 및 관광자원을 테마별로 분류하여 서비스 하고 있으며테마여행 추천코스 와 그에 따른 상세정보로 구성된 데이터 입니다.테마여행의 이름, 주소, 홈페이지, 전화번호, 좌표, 상세정보를 제공하고 있으며주변관광지, 여행사진, 리뷰도 함께  제공합니다.다국적 관광객을 위해 한국어, 영어, 일어, 중간체, 중번체 5개국어로 서비스 합니다.더 상세한 정보는 부산관광포털 비짓부산에서 확인 하실 수 있습니다.
