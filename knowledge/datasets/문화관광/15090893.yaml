summary_user: 빅카인즈(BIGKinds) 뉴스 데이터베이스에서 모은 장애인 관련 기사를 기사 한 건씩 담은 메타정보 파일로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목으로 구성된다(CSV 약 18.6MB, 전국·비공간). 연구자나 정책 담당자가 '장애인 고용·복지 이슈가 시기별로 언론에서 얼마나, 어떤 키워드로 보도됐나'를 살피는 보도 경향 분석에 쓴다. 전역 조인 키가 없어서 다른 데이터와는 일자나 언론사 이름, 키워드 문자열을 맞춰 붙이는 방식으로만 연결한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 장애인 관련 뉴스 메타정보 자료입니다. 장애인은 사회적 약자로서 다양한 영역에서 차별과 제약을 경험해왔으며, 이에 대한 언론 보도는 인권 보장, 복지 정책, 사회적 포용의 중요성을 드러내는 지표 역할을 합니다. 본 자료는 국내 주요 신문과 방송 뉴스에서 장애인과 관련된 기사들을 분석하여 주요 키워드와 등장 빈도를 추출하고, 시기별 보도 경향과 이슈 변화를 살펴볼 수 있도록 구성되었습니다. 이를 통해 장애인 권익 신장, 고용·교육 기회의 확대, 복지 제도의 개선, 사회적 인식 변화와 같은 핵심 의제가 언론 보도 속에서 어떻게 다루어졌는지 확인할 수 있습니다. 또한 학술 연구, 정책 수립, 언론 분석, 교육 현장에서 유용하게 활용될 수 있는 기초 데이터를 제공하며, 장애인과 비장애인이 함께하는 포용적 사회로 나아가는 데 기여할 수 있습니다.
