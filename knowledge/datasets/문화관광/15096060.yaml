summary_user: 충청남도 계룡시 관내 출판사·인쇄소를 업체 한 곳씩 담은 현황 목록으로, 업체명·도로명주소·우편번호·업종을 담는다. 계룡시 안에 있는 인쇄소나 출판사를 찾거나, 시 단위로 출판·인쇄 업체 분포를 파악하려는 사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·등록번호 등)가 없어 다른 데이터와는 업체명이나 주소를 맞춰 연결해야 한다.
limits: 계룡시 한 시군구만 다루므로 충남 전체나 전국 현황으로 볼 수 없다. 사업자번호·등록번호 같은 식별 키가 없어 출판사 신고 원장 등과 정확히 대조하기 어렵고, 이름·주소 매칭에 의존해야 한다.
