summary_user: 한국저작권위원회 저작권등록관리시스템에 등록된 데이터베이스 저작물의 등록부를 등록 건별로 담은 전국 단위 파일(CSV)로, 개인정보·민감정보를 뺀 저작물 제호·내용·창작일자·공표일자·공표매체·등록일시·사본발급가능 여부 등을 담는다. 사업자나 분석가가 "특정 데이터베이스 저작물이 언제 창작·공표되어 등록됐고 사본 발급이 가능한가"를 확인하거나 연도별 데이터베이스 저작권 등록 추이를 볼 때 쓴다. 다른 데이터셋과 이을 전역 조인 키는 없고, 등록 건 내부에서는 등록계정과 관련등록계정(관련등록계정)으로 연관 등록을 찾아가며, 외부 데이터와는 저작물 제호 같은 이름 매칭으로만 연결한다.
