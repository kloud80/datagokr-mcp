summary_user: 대한민국역사박물관에서 열리는 특별 전시를 전시 한 건씩 담으며, 제목·설명·전시 기간·장소·등록일·상세 링크와 발행기관·작성자 정보를 포함한다. 관람객이나 역사 교육 담당자가 지금 또는 특정 기간에 이 박물관에서 어떤 특별전이 열리는지, 언제까지인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 문화시설·공연 데이터와는 박물관 이름이나 전시 제목으로 맞추거나 같은 기관의 다른 데이터와만 연결된다.
description_portal: 대한민국역사박물관에서 개최되는 특별 전시에 관한 상세 정보를 제공하며, 전시의 제목, 기간, 장소, 주요 내용 등 다양한 정보를 포함하고 있습니다. 전시와 관련된 발행기관, 책임자, 소속, 등록일, 실행시기, 위치 정보 등 주요 항목을 체계적으로 정리하여 이용자들이 전시 일정과 세부 내용을 쉽게 파악할 수 있도록 지원합니다. 연구자, 학생, 일반 시민 등 다양한 이용자가 전시 관람 계획을 세우거나 문화예술 관련 자료로 활용하는 데 유용하게 사용할 수 있습니다. 또한, 문화유산 및 역사 교육 자료로도 폭넓게 활용될 수 있습니다.
