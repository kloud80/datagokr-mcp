summary_user: 전통 공예 공방이 만든 공예품을 한 행씩 기록한 파일로, 공방·공예품 고유번호와 공방명, 종목명, 제작자 훈격, 공예품명, 크기, 재질을 담는다(전국 범위, CSV 약 80KB). 연구자나 박물관·교육 담당자가 '특정 종목이나 재질의 전통 공예품을 어느 공방이 만들었는가'를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 공방명이나 종목명을 이름으로 맞춰 국가유산청의 무형유산·보유자 데이터와 연결해야 한다.
description_portal: 국가유산청_공방공예품정보는 전통 공예 유산의 보존과 전승, 활용을 목적으로 제공되는 종합 데이터 서비스로, 공방고유번호, 공예품고유번호, 공방명, 종목명, 제작자훈격, 공예품명, 크기, 재질, 비고 등 세부 항목을 체계적으로 기록하고 관리합니다. 이를 통해 개별 공방과 해당 공예품의 역사적, 예술적, 기술적 특징을 명확하게 파악할 수 있으며, 자료는 전통 공예 연구, 문화재 복원, 교육 프로그램, 박물관 전시, 디지털 아카이브 구축 등 다양한 분야에서 폭넓게 활용됩니다. 또한 검색 및 분류 기능을 통해 지역, 종목, 재질, 제작자 등 조건별 정보 탐색이 가능하여 연구자와 일반 이용자가 손쉽게 필요한 자료를 확인하고 응용할 수 있습니다. 이러한 정보는 전통 공예의 가치와 맥을 후대에 전하는 데 중요한 기반이 됩니다.
