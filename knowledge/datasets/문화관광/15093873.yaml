summary_user: 국립박물관문화재단이 국립박물관 안에서 운영하는 오프라인 박물관상품관을 매장 한 곳당 한 행으로 담은 목록으로, 매장코드·매장명·위치·전화번호를 수록한 작은 CSV 파일(약 1KB)이다. 박물관 방문객이 "이 박물관 안에 기념품·도록을 파는 상품관이 어디 있고 전화번호는 무엇인가"를 확인할 때 쓰고, 분석가는 문화상품 판매 거점 현황을 파악할 때 쓴다. 전역 조인 키나 행정구역 코드가 없어 다른 박물관 데이터와는 매장명·위치에 적힌 박물관 이름을 맞춰 연결해야 한다.
description_portal: 국립박물관문화재단이 운영하는 국립박물관 내 오프라인 상품관의 현황 정보로, 매장명(문자형), 매장 위치(문자형), 전화번호(문자형) 등의 항목을 포함하고 있습니다.※ 본 데이터에는 공사 등으로 인해 휴점 중인 상품관은 제외되어 있으며, 현재 운영 중인 매장 정보를 기준으로 수록되어 있습니다.박물관상품관에서는 유물 재현품, 명인의 수공예 작품, 박물관 방문을 기념할 수 있는 소품, 전통을 현대적으로 재해석한 생활용품, 어린이 대상의 교육·체험형 상품, 전시 도록 및 문화예술 관련 서적 등 다양한 상품을 만나볼 수 있습니다.해당 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 문의해주시기 바랍니다.
