description_portal: 입력 파라미터를 이용하여 전승자 구술채록 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형유산 전승자 구술채록 정보 목록 조회 서비스는 무형문화유산 전승자의 경험과 인식을 담은 구술자료를 체계적으로 수집·관리하고, 이를 연구자·학생·일반인이 온라인으로 열람할 수 있도록 지원하는 디지털 정보 서비스입니다. 이 서비스는 무형유산 전승자의 인적 사항, 구술자 경력, 채록 일시 및 장소, 녹음·녹화 원본자료, 요약 전문, 분야별 키워드 등 상세한 기록을 포함하며, 검색 기능 및 메타데이터 기반 필터를 통해 특정 유산, 전승자, 지역, 채록 주제에 따른 맞춤형 자료 탐색이 가능합니다. 제공된 구술자료는 전통예술, 민속신앙, 생활기술 등 다양한 무형유산 분야의 구전·실천 지식을 보존하고, 학술 연구와 교육자료로 활용될 수 있으며, 특히 영상·음성 자료는 문화유산 교육, 디지털 전시, 후속 인터뷰·현장 조사에 유의미한 기초 자료로 활용 가능합니다. 이로써 무형유산의 생생한 전승 맥락을 기록·보존하여 디지털 아카이빙과 문화 전승을 동시에 촉진하는 전문 정보 인프라로서 중요한 역할을 수행합니다.
