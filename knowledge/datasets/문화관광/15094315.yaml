summary_user: 국립무형유산원이 수집한 무형유산 전승자 구술채록 자료를 자료 한 건 단위로 담은 목록이며, 자료명과 상세 페이지 이동 URL 등을 돌려준다. 연구자·학생·교사가 "특정 전통예술이나 공예 분야 전승자의 구술 녹음·영상 자료가 어디 있는가"를 찾아 원문 열람 페이지로 넘어갈 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 무형유산 데이터와는 분야명·전승자명 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
