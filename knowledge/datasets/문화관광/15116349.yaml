summary_user: 울산 문수체육관의 대관 신청을 접수번호 한 건씩 담은 원천 기록으로, 사용 목적·대관 시작일과 종료일·사용시설·사용 인원·사용 시간·대관 비용·신청일을 포함한 약 16KB 규모의 CSV 파일이다. 체육 행사를 준비하는 단체나 분석가가 '문수체육관은 언제, 어떤 시설이, 어떤 용도로 얼마의 비용에 대관됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 체육시설·예약 데이터와는 시설명이나 날짜를 직접 맞춰 이어 쓴다.
description_portal: 울산시설공단은 문수체육관의 효율적인 운영과 공정한 대관 관리를 위해 대관 신청 현황 데이터를 투명하게 제공하고 있습니다. 이 데이터는 접수번호, 사용 목적, 대관 시작일, 대관종료일, 사용시설, 사용 인원, 사용 시간, 대관 비용, 신청일 등의 항목으로 구성되어 있습니다. 사용 목적을 통해 해당 대관이 어떤 행사나 용도로 이루어졌는지를 확인할 수 있습니다. 사용시설 항목은 대관된 공간의 종류를 구체적으로 보여줍니다. 또한 사용 인원과 사용시간, 대관비용 항목은 신청 규모와 이용 요금, 시간 단위 사용 내역을 파악하는 데 도움이 됩니다.
