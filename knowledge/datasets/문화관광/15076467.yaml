description_portal: '이 데이터는 한국문화예술위원회 문학 분야 문예진흥기금 공모사업 중 ‘문학행사 및 연구’ 사업의 행사 세부 내용을 정리한 자료로, 2014, 2015, 2018, 2019년도의 사업 실적을 기반으로 구성되어 있습니다. 주요 항목은 문학단체명, 사업연도, 행사시작일, 행사종료일, 본행사_일시, 부대행사_일시, 기타행사_일시, 참여예술가수(명) 등이며, 행사 관련 일자는 모두 날짜 형식(예: 2019-06-15)으로 나타나고 참여예술가수는 숫자 형식으로 제공됩니다. 이 데이터를 통해 각 문학단체가 수행한 문학행사의 실제 운영 시기, 본행사와 부대행사의 구성, 예술가 참여 규모 등을 정량적으로 분석할 수 있으며, 행사 운영 방식과 규모, 참여자 중심의 성과 지표 평가에 활용할 수 있는 기반 자료입니다.'
