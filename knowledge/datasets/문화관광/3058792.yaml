description_portal: 한국문화예술교육진흥원에서 발간·제작한 각종 자료의 목록 정보를 제공하는 데이터로, 발간물의 제목, 발간연도, 자료 유형, 주제 분야, 요약 정보, 국제표준도서번호(ISBN) 등 기본 메타데이터를 포함한다. 본 데이터는 문화예술교육 정책 수립 및 연구, 관련 사업 기획과 학술·교육 현장에서의 활용을 목적으로 하며, 문화예술교육 관련 공공자료에 대한 체계적인 접근과 정보 활용을 지원한다.또한 본 데이터는 문화예술교육 관련 자료의 현황 파악과 통계 분석을 가능하게 하여 정책 평가 및 성과 관리의 기초 자료로 활용될 수 있다.공공데이터로 개방됨으로써 연구자, 교육기관, 일반 국민 등 다양한 이용자가 문화예술교육 자료를 폭넓게 활용할 수 있도록 지원한다.
