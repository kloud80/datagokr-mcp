summary_user: 국립무형유산원이 소장한 무형유산 기록영화(16mm)를 자료 한 건씩 목록으로 담으며, 자료명과 상세 페이지로 이동하는 URL 등을 제공한다. 연구자나 교육·방송 제작자가 특정 무형유산 종목을 16mm 필름으로 남긴 기록영화가 있는지 찾고 원문 페이지로 바로 이동하려 할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 무형유산 데이터와는 자료명·종목명을 이름으로 맞추거나 같은 기관 데이터끼리만 연결한다.
description_portal: 입력 무형유산 기록영화(16mm) 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형유산 기록화 영상 정보 목록 조회 서비스는 한국의 전통문화와 무형유산을 체계적으로 기록하고 보존하기 위해 제작된 다양한 영상 자료를 온라인으로 제공하는 디지털 플랫폼입니다. 이 서비스는 국가무형문화재, 지방무형문화재, 인류무형문화유산 등 다양한 무형유산 분야의 공연, 기술, 의례, 구술 등 다양한 주제의 영상 자료를 포함하고 있습니다. 이러한 영상 자료들은 무형유산의 전승 과정과 가치를 시청각적으로 기록하여 후대에 전하고 있습니다.
