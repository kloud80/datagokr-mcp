summary_user: 인천광역시 영종구에 있는 유형문화재를 한 건씩 나열한 소규모 목록 파일(csv, 약 1.7KB)로, 유형·문화재명·지정일자·데이터기준일자를 담는다. 주민이나 관광 안내 담당자가 '영종구에는 어떤 유형문화재가 있고 언제 지정됐나'를 확인하는 데 쓴다. 전역 조인 키(종목코드·지정번호·소재지 PNU 등)가 없어 국가유산청 유산 목록 API 등과는 문화재명을 맞춰서만 이을 수 있다.
description_portal: 유형문화유산은 건축물, 유적지, 미술품 등 물리적 형태로 존재하는 문화재로, 문화재 보호법에 따라 체계적으로 관리됩니다. 보존과 복원, 무분별한 개발 방지, 관광 활성화, 지역사회 참여, 지속 가능성 등이 사회적 이슈로 대두되고 있습니다. 데이터는 이해와 가공이 용이하도록 표준화되며, 문화유산 관리 시스템 및 관광정보와 연계 가능하여 활용도가 높습니다. 최신 법규와 정책 준수를 바탕으로 신뢰성 있는 정보를 제공합니다.문화유산은 과거로부터 전해 내려오는 인간의 삶과 문화를 보여주는 중요한 자산입니다. 크게 유형문화유산과 무형문화유산으로 나뉘는데, 유형문화유산은 건축물, 유적, 미술품 등 눈에 보이는 물리적 자산을 말하고, 무형문화유산은 전통 공연, 예술, 풍습, 지식 등 눈에 보이지 않는 문화적 표현을 뜻합니다. 문화유산은 한 나라의 역사와 정체성을 담고 있어 보호와 보존이 매우 중요하며, 이를 통해 과거와 현재, 미래를 잇는 문화적 가치를 전달합니다.
