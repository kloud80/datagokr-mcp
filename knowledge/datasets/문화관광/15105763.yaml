summary_user: 전라남도 도립미술관 소장품 가운데 기증받은 작품을 작품 한 점당 한 행으로 담은 목록 파일(CSV, 약 11KB)로, 작가명·작품명·제작연도·재료·크기·장르를 담는다. 미술 연구자나 지역 문화 분석가가 특정 지역 작가의 작품이 도립미술관에 얼마나 기증됐는지, 어떤 장르와 재료가 많은지를 확인하는 데 쓴다. 전역 조인 키나 문화시설 코드가 없어, 다른 소장품·전시 데이터와는 작가명·작품명 같은 이름 매칭이나 미술관 내부 관리번호로만 이어 쓴다.
description_portal: '- 전라남도 도립미술관에 있는 소장품 중 기증목록 정보로 작품명, 작가명, 제작연도, 유형, 제작기법, 작품크기를 포함하고 있습니다.- 전라남도 도립미술관은 지역의 문화유산을 보존하고 전시하기 위해 다양한 작품을 소장하고 있으며, 기증받은 작품들도 중요한 부분을 차지합니다. 특히, 지역 예술가들의 작품이나 전라남도의 자연과 문화를 담은 작품들이 기증되어 미술관의 소장품으로 추가되고 있습니다.- 기증에 대한 자세한 정보나 문의는 전라남도 도립미술관에 직접 연락하시거나 공식 홈페이지를 통해 확인하실 수 있습니다.- 전라남도 도립미술관은 지역 예술가들의 작품을 소중히 여기며, 기증을 통해 더욱 풍성한 컬렉션을 구축하고 있습니다. 관심 있는 분들의 많은 참여를 바랍니다.'
