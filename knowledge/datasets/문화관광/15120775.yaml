summary_user: 게임물관리위원회 누리집 자료실에 올라온 게시물(내용수정 신고서 양식, 등급분류 규정, 사업자 법정교육 자료, 게임이용지도서 등)을 게시물 한 건당 한 행으로 담은 목록 파일로, 제목·본문·조회수·첨부파일 이름과 다운로드 경로·작성일과 수정일을 포함하며 전국 단위·비공간 자료다(csv 약 19KB). 게임 사업자가 내용수정 신고에 필요한 양식이나 법정교육 자료를 찾거나, 분석가가 위원회가 공개한 규정·교육 자료의 종류와 게시 시점을 훑어볼 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 게임 등급분류 결과 등 같은 기관 데이터와는 제목·자료명을 기준으로 직접 맞춰 이어 써야 한다.
limits: 다른 데이터셋과 바로 연결할 공통 키가 없어 이름 매칭으로만 연결된다. 게시판 목록 자료이므로 등급분류 결과 같은 게임물별 정보는 담지 않는다.
