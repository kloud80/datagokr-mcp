summary_user: 군산시 도서관 열람실 좌석예약시스템의 이용 통계를 일자별로 집계한 파일 데이터로, 전체 이용자 수와 남녀별 이용자 수, 강제종료 처리 횟수를 담는다. 도서관 운영자나 분석가가 날짜별 열람실 이용 규모와 성별 구성, 강제종료가 잦은 날을 확인하는 데 쓴다. 실측 컬럼에 도서관코드 같은 전역 조인 키가 없어 다른 데이터와는 일자나 기관(군산시) 기준으로만 맞춰 이어 쓴다.
description_portal: 전북특별자치도 군산시 도서관열람실 좌석예약시스템현황(일자, 전체이용자수, 남자,여자,강제종료처리 등)을 파악 할 수 있도록 사용자 통계를 제공도서관 열람실 좌석예약시스템은 이용자가 편리하게 열람실 좌석을 예약, 이용할 수 있도록 지원하는 전산 시스템 입니다. 이용자는 열람실 문 옆에 위치한 키오스크를 통해 실시간으로 빈 좌석 현황을 확인하고 원하는 좌석을 선택, 예약 할수 있으며, 이용자는 대기없이 열람실을 이용 할 수 있고, 도서관은 좌석 운영 효율성과 이용자의 만족도를 동시에 향상시킬 수 있습니다.
