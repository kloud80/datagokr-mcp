description_portal: '문화재 도난목록은 도난,유실된 문화재 현황, 문화재 지정유형, 도난일자, 수량 소유자 시대 등의 정보를 확인 할수 있습니다.“국가유산청_도난문화재 목록” 데이터는 국내 문화유산 중 도난, 도굴, 해외 밀반출로 분류된 유산 정보를 체계적으로 정리한 공공데이터입니다. 수백 건에 달하는 도난 문화재의 명칭, 발생일, 지정종별, 등록공고일 등을 포함하며, 해당 유산에 대한 신속한 정보 제공을 통해 불법 유통 차단과 회수 지원을 목표로 합니다기본 항목: 유산명, 피해 발생 일시, 지정 유형(국가지정·시도지정·비지정 등), 등록 공고일활용 목적:공항·항만 등에서의 해외 밀반출 예방국민 제보 및 수사 기관의 회수 노력 지원언론 및 문화재 애호가 대상 경각심 및 주의 환기 자료 공개 방식: 국가유산청 웹사이트 및 Open API로 제공되며, 목록 조회와 상세 조회 API를 통해 실시간 정보 확인 가능 이 데이터는 문화재 수집가, 박물관, 언론, 수사기관, 일반 시민 등 다양한 이해관계자가 도난 문화재 정보를 빠르게 파악하고 대응할 수 있도록 지원하는 중요한 자료입니다.'
