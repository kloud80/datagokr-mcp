summary_user: 국내에서 도난·유실된 문화재를 건별로 정리한 목록으로, 문화재명·지정유형·도난일자·수량·규격·시대·도난장소를 한 행에 담은 전국 단위 CSV 파일(약 118KB)이다. 수사기관·박물관·고미술 거래자나 시민이 '지금 거래되거나 눈에 띈 이 유물이 도난 신고된 문화재인가'를 확인하는 데 쓴다. 실측 컬럼에 종목코드·지정번호 같은 전역 조인 키가 없어, 국가유산청 지정·등록 유산 목록과는 문화재명과 지정유형을 이름으로 맞춰 이어 써야 한다.
