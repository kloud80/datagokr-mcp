description_portal: '- 전라남도 지정 관광지 현황에 대한 데이터로 관광지명, 위치, 관광지 지정일, 면적 등 7개 항목으로 구성되어 있습니다.- "지정 관광지"는 국가나 지방자치단체가 관광객 유치와 지역 발전을 위해 법적으로 지정한 특정 지역이나 시설을 말합니다. 이 제도는 「관광진흥법」에 따라 운영되며, 관광지로 지정되면 개발, 투자, 행정지원 등에서 혜택을 받을 수 있습니다.- 정의: 관광객의 유치 및 관광산업 발전을 위하여 지자체장이 지정하고, 문화체육관광부 장관이 승인한 지역으로, 관광개발계획에 따라 조성되거나 조성 중인 장소.- 근거 법령: 「관광진흥법」 제52조- 지정 관광지의 목적: 체계적인 관광자원 개발, 지역경제 활성화 및 일자리 창출, 관광객 유치 및 관광 기반 강화, 문화, 자연, 역사 자원의 보호와 활용'
