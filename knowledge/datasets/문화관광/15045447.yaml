summary_user: 부산광역시 남구에 등록된 영화상영관을 업소 한 곳당 한 행으로 담은 건별 등록 목록으로, 업종·상호명·도로명/지번 주소·전화번호·등록일자·영업상태를 제공하며 파일 크기가 383바이트에 불과한 소규모 자료다. 남구 주민이나 분석가가 '남구에 영업 중인 영화관이 어디이고 언제 등록됐는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소(소재지 도로명·지번)를 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: '- 부산광역시 남구 영화상영관 등록현황에 대한 데이터로 업종, 상영관명, 주소, 전화번호 등의 자료를 제공하고 있습니다.- 해당 영화상영관은 경성대학교와 부경대학교 주변에 위치해 있어, 영화관람 뿐 아니라 다양한 시설을 활용할 수 있는 곳에 있습니다. - 해당 상영관은 부산광역시 남구 수영로 305, 6층~8층(대연동, 스파크)에 위치해 있으며,  총 8개의 상영관이 있습니다.- 각  상영관의 관람정원은 1관 107명, 2관 122명, 3관 135명, 4관 136명, 5관 279명, 6관 122명, 7관 134명, 8관 136명 입니다.'
