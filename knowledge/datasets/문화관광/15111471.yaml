summary_user: 광주광역시 공공·민간 미술관에서 열리는 전시·행사 프로그램을 건별로 담은 파일(CSV, 약 1.2MB)로, 시설명·주소·위도경도와 함께 행사명, 프로그램 내용, 예매처, 입장료 무료 여부·가격·할인정보를 담는다. 시민이나 관광객이 '광주에서 무료로 볼 수 있는 미술관 전시가 어디서 열리나'를 찾거나, 분석가가 지역 미술관 프로그램의 분포와 유료·무료 비중을 살펴보는 데 쓴다. 전역 조인 키(문화시설 코드 등)가 없어서 다른 문화시설 데이터와는 시설명·주소로 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
limits: 공식 시설 코드가 없어 문화기반시설총람 등 다른 시설 목록과 정확히 연결되지 않으며, 이름·주소 매칭 결과는 따로 검증해야 한다. 포털 설명은 광주광역시 미술관 대상이지만 범위 표기는 전국으로 되어 있으므로, 실제 지역 범위는 시도명칭으로 확인하고 쓴다.
