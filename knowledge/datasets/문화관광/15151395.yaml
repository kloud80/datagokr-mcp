description_portal: 국립국악원 본원과 3개 소속 국악원(부산, 민속, 남도)이 보유한 40여 편의 국악 공연 360도 VR 영상 링크 정보를 제공하는 페이지입니다.본 리스트를 통해 사용자는 국가무형문화재인 궁중음악(대취타), 정악(영산회상), 명인들의 산조(가야금산조 서공철류, 해금산조 지영희류 등), 판소리(수궁가), 지역별 민요, 그리고 궁중무용(춘앵전) 및 민속무용(승무, 살풀이, 진주검무 등)을 포함한 한국 전통 공연 예술의 다양한 장르를 고화질 360도 가상현실로 생생하게 경험할 수 있는 URL 정보를 쉽게 찾을 수 있습니다.
