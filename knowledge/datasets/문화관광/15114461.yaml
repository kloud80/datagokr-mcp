summary_user: 경주시 문화관광 사이트에 올라온 먹거리 명소(음식점)를 한 곳씩 담는 API로, 이름·주소·전화번호·설명·이미지와 위도·경도 좌표를 함께 준다. 경주 여행객이나 관광 앱 개발자가 "황리단길 근처에서 갈 만한 맛집은 어디인가"처럼 지도 위에서 음식점을 찾고 추천할 때 쓴다. 전역 조인 키는 없다. 다른 데이터와는 주소·위도·경도로 위치를 맞추거나 음식점 이름을 대조해 잇는다. 지역아이디(AREA_UID) 같은 기관 내부 코드는 같은 경주시 관광 API끼리 연결할 때만 쓴다.
description_portal: 경상북도 경주시에서 제공하는 본 오픈API는 지역 내 다양한 먹거리 명소 정보를 통합 제공한다. 데이터는 음식점 명칭, 대표 메뉴, 주소, 전화번호, 영업 시간, 이미지, 편의시설 유무, 주요 특징 등의 항목으로 구성되어 있다. 사용자는 해당 데이터를 활용하여 지도 기반 검색, 음식 테마별 탐색, 음식점 추천 등 다양한 용도로 활용할 수 있다. 본 자료는 경주를 방문하는 관광객과 시민에게 맛집 정보를 손쉽게 제공하고, 음식문화 체험을 통한 관광 활성화에도 기여할 수 있다. 또한, 관련 콘텐츠 제작과 정책 수립 시 기초 자료로 활용 가능하다. API는 관광 앱, 웹사이트, 민간 플랫폼 등과 연계가 용이하며, 외식업계 및 관련 산업 종사자에게 유익한 실무 정보를 제공한다.
