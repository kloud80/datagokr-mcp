description_portal: 이 데이터는 한국문화예술위원회가 2018년을 기준으로 정리한 해외예술정보 레지던시 지원 프로그램에 대한 자료로, 전 세계 예술인을 대상으로 한 다양한 국제 레지던스 기회와 그에 따른 지원 조건을 체계적으로 정리한 정보를 제공합니다. 총 389개의 행으로 구성되어 있으며, 주요 항목은 프로젝트명, 전화번호, 제공내역(지원금), 지원 마감일로 구성되어 있습니다. 프로젝트명에는 ‘오토데스크 피어 나인 예술가 레지던스 프로그램’과 같이 구체적인 프로그램 이름이 명시되어 있으며, 각 항목은 예술가들이 참여할 수 있는 국제적 창작·교류의 기회를 나타냅니다. 제공내역(지원금) 항목은 거주 공간, 스튜디오 제공, 창작 활동비, 항공료, 체류비 등 다양한 형태의 시설 및 금전적 지원 규모가 포함되어 있어, 프로그램별 혜택을 비교 분석하는 데 유용합니다. 지원 마감일은 '2018-02-25'와 같이 날짜 형식으로 제공되어 시기별 신청 가능 여부를 확인할 수 있으며, 전화번호 항목을 통해 해당 프로그램의 운영기관 또는 문의처 정보도 확인할 수 있습니다. 본 데이터는 예술가의 해외 진출 전략 수립, 국제 교류 분석, 지원정책 비교 및 활용도 평가에 활용될 수 있는 실무적 가치가 높은 자료입니다.
