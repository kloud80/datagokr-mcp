summary_user: 서울특별시 용산구의 청소년게임제공업(청소년 대상 오락실 등) 인허가를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가일·취소일, 영업상태, 폐업·휴업 일자, 소재지 지번·도로명 주소와 좌표, 시설 면적·층수·조명·음향 같은 시설 항목을 포함한다. 동네에서 지금 영업 중인 청소년 오락실이 어디인지 확인하려는 주민이나, 용산구 내 청소년게임장 개업·폐업 추이를 보려는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·사업장명 매칭이나 좌표(X, Y)로 잇고, 같은 체계의 다른 업종 인허가 데이터와는 관리번호(MGTNO)·자치단체 코드 같은 기관 내부 코드로만 맞춘다.
description_portal: 청소년게임제공업은 청소년을 주요 이용 대상으로 하는 업종으로, 주로 오락실·멀티방 등에서 건전한 아케이드형 게임을 제공하는 시설을 의미합니다. 「게임산업진흥에 관한 법률」에 의거하여 해당 업종은 반드시 관할 구청장의 인허가를 받아야 하며, 청소년 보호와 건전한 놀이문화 형성이 최우선 과제입니다. 인허가를 신청할 때에는 건축물 용도 확인, 소방·위생 등 안전 기준 준수, 업주의 범죄경력 여부 확인 등의 절차를 거쳐야 하며, 유해·사행성 게임물은 절대 제공할 수 없습니다. 특히 청소년 고용 및 이용과 관련하여는 고용시간, 심야시간 출입 제한, 게임물의 등급제도 준수 등의 법적 의무를 반드시 지켜야 합니다. 만약 이를 위반할 경우 영업정지, 허가취소, 과태료 부과 등의 행정 제재를 받을 수 있습니다. 구청은 인허가 접수 및 현장 실사를 통해 시설의 적합성을 검증하고, 이후에도 정기적으로 지도·점검을 실시하여 청소년들이 안전하게 이용할 수 있는 놀이 문화를 조성하고 있습니다.
