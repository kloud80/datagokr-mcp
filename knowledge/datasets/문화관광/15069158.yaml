summary_user: 전라남도 내 골프장을 한 곳씩 담은 명부로, 시군구별 골프장명·위치·사업자명·홀 수·면적(제곱미터)·회원제/비회원제/대중형 구분·대중형골프장 지정일을 담으며 4KB 남짓의 작은 CSV 파일이다. 지역 개발·관광 분석가가 '전남 어느 시군에 대중형 골프장이 몰려 있고 규모는 어느 정도인가'를 확인하거나, 레저 사업자가 지역별 골프장 공급 현황을 파악하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 체육시설업 인허가나 상권 데이터와는 골프장명·사업자명이나 시군구 이름을 맞춰서만 이어 쓴다.
description_portal: '- 전라남도내 골프장정보(시군명, 골프장명, 위치, 면적_제곱미터, 규모 홀, 운영방식, 운영주체, 승인일 등)에 관한 데이터입니다.- 전라남도는 다양한 골프장이 위치한 지역으로, 골프 인프라가 잘 갖추어져 있습니다. 이 지역의 골프장은 관광, 레저, 비즈니스 등 다양한 목적에 맞춰 설계되어 있으며, 국내외 골프 애호가들에게 인기가 높습니다.- 예약 : 주말이나 공휴일에는 골프장 이용이 혼잡할 수 있으므로 사전 예약을 권장합니다.- 복장 : 대부분의 골프장에서는 골프복과 골프화를 착용해야 하며, 드레스 코드를 준수해야 합니다.- 장비 대여 : 클럽과 카트 등의 장비는 대부분의 골프장에서 대여가 가능하므로 사전에 문의하시기 바랍니다.'
