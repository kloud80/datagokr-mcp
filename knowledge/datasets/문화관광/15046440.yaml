description_portal: 한국관광공사 관광통계를 기반으로 전국 기준 입국교통수단별 외국인 방문객 현황을 제공하는 자료이다. 외국인 방문객의 입국 규모를 대륙별(아시아, 미주, 구주, 대양주, 아프리카 등)과 입국 교통수단 및 입국 공항·항만별로 구분하여 연도별로 제공한다. 인천국제공항, 김해국제공항, 김포국제공항 등 주요 입국 거점별 외국인 방문객 수를 확인할 수 있으며, 국가별·권역별 관광객의 입국 경로와 이용 패턴을 분석하는 데 활용할 수 있다. 또한 관광객 유치 전략 수립, 공항 및 항만 운영계획 수립, 국제관광 동향 분석, 교통 인프라 정책 수립, 관광산업 활성화 및 지역관광 수요 예측을 위한 기초 통계자료로 활용 가능하다.
