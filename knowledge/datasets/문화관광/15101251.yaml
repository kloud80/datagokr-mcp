description_portal: 수원도시공사 산하 가족여성회관에서 운영하는 평생학습 강좌 정보를 담고 있으며, 총 217개의 강좌가 수록되어 있습니다. 각 강좌는 ‘강좌명’, ‘강사명’, ‘교육시작일자’, ‘교육종료일자’, ‘교육방법’ 등 다양한 속성으로 구성되어 있어, 개설 강의의 일정, 대상자, 운영방식 및 접수 방식 등을 명확히 파악할 수 있습니다.총 65개의 고유한 강좌가 있으며, 47명의 강사가 참여하고 있습니다. 대부분의 수업은 대면 방식으로 운영되며, ‘화, 목’, ‘월, 수’, ‘토’ 등 다양한 요일에 수업이 분포되어 있습니다. 접수는 대부분 인터넷 접수 방식으로 진행되며, 수강생 선정은 ‘1차 추첨/2차 선착순’ 등의 절차를 따릅니다.이 데이터는 2025년 6월 30일 기준으로 정리된 최신 자료이며, 교육장소, 수강료, 운영기관 연락처, 지원 여부(학점은행제, 직업능력훈련 등)까지 포함된 종합적인 교육행정 데이터를 제공합니다.
