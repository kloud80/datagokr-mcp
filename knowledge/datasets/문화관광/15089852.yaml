summary_user: 빅카인즈(BIGKinds)에서 모은 가계부채 관련 뉴스 기사를 기사 한 건당 한 행으로 담은 메타정보 파일(CSV, 약 2.6MB)로, 일자·언론사·제목·통합 분류·키워드·특성추출 값을 담는다. 연구자나 정책 담당자가 '금리 인상이나 대출 규제 시기에 가계부채 보도량과 주요 키워드가 어떻게 바뀌었나'를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자나 키워드 같은 이름 기준으로만 맞춰 붙여야 하며, 주로 금리·대출 통계 같은 시계열과 날짜를 기준으로 나란히 놓고 비교하는 데 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 가계부채 관련 뉴스 메타정보 자료입니다. 가계부채는 가계 경제와 국가 경제 전반에 중요한 영향을 미치는 요소로, 금리 변화, 대출 규제, 부동산 시장 상황, 경기 침체 등과 밀접하게 연결됩니다. 본 자료는 주요 신문과 방송 보도에서 가계부채 관련 키워드와 빈도를 추출하여 시기별 변화를 분석할 수 있도록 구성되어 있습니다. 이를 통해 가계부채 문제를 둘러싼 사회적 담론과 정책적 대응이 언론에서 어떻게 다루어지는지 확인할 수 있으며, 금융 안정성 연구, 정부 정책 수립, 학술 연구 및 교육 자료로 활용될 수 있습니다. 특히 장기적인 추이를 살펴봄으로써 가계 경제의 취약성과 구조적 위험 요인을 객관적으로 분석하는 데 기초 자료를 제공합니다.
