description_portal: 한국언론진흥재단 미디어연구센터에서 정부광고 수수료를 활용하여 제작한 조사연구 자료입니다. 네이버 많이 본 뉴스 개편에 대한 이용자 인식을 주제로 한 사회적 이슈 관련 일회성 조사로, 국내 최대 포털 사이트인 네이버의 뉴스 서비스 개편이 이용자들에게 미친 영향과 인식 변화를 체계적으로 분석했습니다. 뉴스 노출 방식의 변화, 알고리즘 기반 추천 시스템 도입, 언론사별 뉴스 배치 방식 등에 대한 이용자들의 만족도와 우려사항을 조사했습니다. 디지털 뉴스 소비 패턴과 포털 미디어의 사회적 영향력에 대한 중요한 시사점을 제공하며, 온라인 뉴스 생태계 변화를 이해하는 데 필요한 기초 자료입니다. 조사연구에 대한 PDF 파일 형태로 제공되며, 공공누리 공공저작물 자유이용허락 조건에 따라 연구 및 정책 수립 목적으로 자유롭게 활용할 수 있습니다.
