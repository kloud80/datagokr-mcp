summary_user: 국립국악원이 수집한 국악연감 내용을 항목별로 제목·설명·저자·소속·참조자원제목·부가설명·관련장소 형태로 담은 텍스트 자료이며, 범위는 전국이고 지역 단위로 나뉘지 않는다. 연구자나 공연 기획자가 '특정 해에 어떤 국악 단체가 어떤 활동을 했는가'처럼 국악계 활동 내역과 동향을 찾아보는 데 쓴다. 실측 컬럼에 공연ID 같은 전역 조인 키가 없어 KOPIS 공연 목록 등 다른 데이터와는 제목·장소·소속 이름을 맞춰서만 이을 수 있다.
description_portal: 국악 분야의 다양한 활동과 동향을 체계적으로 정리한 국악연감 데이터는 국립국악원이 수집한 통계 및 정보를 기반으로 구성되어 있습니다. 주요 컬럼에는 제목, 설명, 저자, 소속, 참조자원제목, 부가설명, 관련장소 등이 포함되어 있어 국악 관련 연구, 정책 수립, 문화행사 기획 등 다양한 분야에서 활용할 수 있습니다. 국악의 발전 현황을 파악하거나, 국악 관련 자료를 찾는 연구자 및 일반인에게 유용하며, 국악 교육 자료로도 활용 가능합니다. 또한 국악 관련 기관이나 단체의 활동 내역을 한눈에 확인할 수 있어 국악계 전반의 흐름을 이해하는 데 도움이 됩니다.
