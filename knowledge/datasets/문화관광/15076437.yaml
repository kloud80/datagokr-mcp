description_portal: 이 데이터는 한국문화예술위원회 문학 분야 문예진흥기금 공모사업 중 종이책 문예지 보급 현황을 정리한 자료로, 문학단체의 유통성과 보급 활동을 수치로 파악할 수 있도록 구성되어 있습니다. 주요 항목에는 문학단체명, 사업연도, 종이책 판매 추세(3년 전~1년 전), 판매 실적(부), 기증 추세 및 실적(부), 기타 실적(부), 총발행부수 실적(부) 등이 포함되어 있으며, 모두 부수 단위의 숫자 형식으로 제공됩니다. 이를 통해 단체별 종이책 문예지의 판매 및 기증 흐름, 유통 성과, 발행 규모 등을 정량적으로 비교·분석할 수 있으며, 출판 보급 전략 수립과 정책 효과 평가에 활용 가능한 기초 자료로 기능합니다.
