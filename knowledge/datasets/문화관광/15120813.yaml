description_portal: 최근 한국은 국제 행사와 글로벌 이슈의 중심지로 주목받고 있습니다. 한류 문화 콘텐츠, 반도체·배터리 산업, ESG·기후위기 대응, 한반도 정세 등 세계 언론의 관심이 집중되는 이슈들이 잇따르고 있습니다.이에 따라 외신들의 신속하고 정확한 취재를 지원하기 위해, 코시스센터는 외신홍보 행사공간, 자유로운 소통공간, 취재·편집 업무공간을 갖춘 원스톱 취재 지원 인프라를 운영하고 있습니다.이곳에서 외신기자들은 한국 사회의 현안을 심층적으로 취재하고, 각국과 실시간으로 연결하며, 보다 객관적이고 신뢰성 있는 보도를 만들어낼 수 있습니다.
