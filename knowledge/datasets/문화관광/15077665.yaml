summary_user: 경기도 내 오토캠핑장·수상레저·글램핑장 등 레저스포츠 시설을 시설 한 곳당 한 행으로 담은 현황 목록으로, 시군명·시설명·전화번호·도로명/지번 주소·우편번호·WGS84 위경도·기준일자를 포함한다. 캠핑객이나 관광 기획자가 '우리 시군 근처에 어떤 수상레저·캠핑 시설이 있고 연락처는 무엇인가'를 찾을 때 쓰고, 지자체 담당자가 야외 레저 시설 분포를 파악할 때도 쓴다. 전역 조인 키는 없어서 시군명이나 시설명·주소 문자열로 다른 경기도 데이터와 맞추고, 위경도로 지도 위 근접 분석에 이어 쓴다.
description_portal: 이 데이터는 경기도 내의 다양한 레저 및 스포츠 관련 시설 정보를 포함하며, 주요 항목으로는 시설명, 시군명, 정제된 도로명 및 지번 주소, 전화번호, 기준일자, 그리고 WGS84 기준의 위도 및 경도 정보가 포함됩니다. 데이터에는 오토캠핑장, 수상레저, 글램핑장 등 다양한 야외 활동 시설이 수록되어 있어 레저 관광 콘텐츠 기획, 야영장 정보 서비스, 캠핑장 안전 관리 정책, 관광객 대상 아웃도어 정보 제공 등에 활용될 수 있습니다. 또한 지역 기반 여가 활성화 전략 수립과 휴양형 관광산업 개발에도 유용한 데이터입니다.
