description_portal: 1. 페이지 만족도 테이블 개요홈페이지 이용자가 각 페이지를 이용한 후 평가한 만족도 결과를 체계적으로 관리하기 위한 서비스 품질 관리용 데이터 테이블이다. 본 테이블은 대민 서비스의 이용 편의성, 정보 신뢰도 및 콘텐츠 품질을 점검하고, 향후 홈페이지 개선 방향을 도출하기 위한 통계·분석 자료로 활용되고 있다.2. 컬럼 구성 및 역할 설명 - 순번은 만족도 응답을 구분하기 위해 자동으로 부여되는 고유 식별자로, 내부 관리 및 데이터 정합성 유지를 위한 용도로 사용된다. - 설문분류(scicd)는 만족도 설문의 유형, 페이지 성격 또는 설문 문항 그룹을 구분하기 위한 코드로, 설문 결과를 유형별로 분류·분석하는 데 활용된다.  - 설문내용은 만족도 평가 대상이 되는 페이지 또는 메뉴를 구분하기 위한 코드값으로, 페이지 단위의 만족도를 분석하고 서비스 품질을 비교·분석하는 데 활용된다. - 평가내용(contents)은 이용자가 페이지 이용 후 남긴 의견 또는 응답 내용으로, 불편사항, 긍정적 의견 등 서비스 개선에 필요한 참고 자료로 활용된다. - 점수(point)는 페이지 만족도 평가 수치로, 일정 척도를 기준으로 기록되며 페이지별 만족도 통계 산출의 핵심 지표로 활용된다. - 사용자 ID(user_id)는 만족도 설문 참여자의 시스템상 식별을 위해 생성되는 식별자로, 로그인 정보나 세션 기반으로 임의 생성된 값이다. 중복 응답 방지 및 비정상 이용 분석을 위한 목적에 한정하여 사용된다. - 사용자명(name)은 설문 응답 확인을 위한 참고 정보로, 성명 일부 마스킹 또는 별칭 형태로 관리되어 외부에 공개되지 않는다. 내부 관리용으로만 활용되며 개인정보 노출을 최소화한 방식으로 운영되고 있다. - 중복확인 여부(dupinfo)는 동일 이용자의 반복 참여를 방지하거나 통계 왜곡을 방지하기 위해 활용되는 항목이다. - 작성일자(reg_dt)는 만족도 평가가 시스템에 등록된 일시를 의미한다.
