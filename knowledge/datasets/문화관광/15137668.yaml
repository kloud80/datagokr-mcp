description_portal: 이 데이터는 온라인면세점에 입점한 브랜드의 에이전트들에 대한 발전기금 수입현황을 관리하는 데이터입니다. 해당 데이터는 아이디, 성명, 제휴사아이디, 발전기금요율, 총액, 등록일자, 수정일자 항목으로 구성되어 있습니다. 아이디는 온라인면세점 시스템에서 발전기금 데이터를 식별할 수 있도록 숫자 형식의 코드화된 데이터를 뜻합니다. 성명은 에이전트의 이름을 저장하여 관리하고 있으며, 제휴사 아이디는 이름과 연계하여 에이전트들의 직접 사용가능한 계정아이디를 뜻합니다. 발전기금요율은 에이전트 물품 판매금액에서 어느정도 금액을 기금을 전달할지 기준요율을 뜻합니다. 총액은 판매금액에서 요율을 곱하여 실제 발전기금으로 얼마의 원화금액을 납부할지에 대한 정보를 관리하고 있습니다. 등록일자는 해당 정보들을 처음 등록한 일자를 뜻하며, 수정일자는 정보를 수정한 일자를 뜻합니다.
