summary_user: 서울 서초구 내 영화배급업소의 인허가 정보를 업소 단위로 담는다. 인허가일자·취소일자, 영업상태(영업·폐업 등)와 상세상태, 폐업일자, 지번·도로명 주소, 사업장명, 중부원점TM 좌표(X·Y)가 포함된다. 분석가나 영화업계 관계자가 "서초구에 지금 영업 중인 영화배급사는 몇 곳이고 언제 등록·폐업했나"를 확인하는 데 쓰며, 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 서초구 내에서 영화를 전문적으로 배급하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 영화 배급업은 국내외 영화 콘텐츠의 유통과 접근성 향상, 영상산업 진흥 및 지역 문화 다양성 증진에 매우 중요한 역할을 하며, 업소별 인허가 이력투명성과 행정관리의 신뢰도 확보가 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 설립, 배급업 허가 및 변경, 폐업 등 행정정보가 포함되어 있어, 영화 배급 시장의 운영현황을 명확하게 파악할 수 있습니다. 서초구청 등 관할 행정기관이 정기적으로 현황 점검과 자료 갱신을 통해 데이터 신뢰성과 최신성을 유지하고 있습니다. 본 데이터는 영화 배급사 관리, 영화 유통정책 수립, 시장 동향 조사, 통계 분석, 관련 업계 연구, 소비자 및 업계 신뢰성 평가 등 다양한 분야에 활용될 수 있습니다. 정책입안자, 영화산업 관계자, 연구자, 시민 모두에게 실효성 있고 객관적인 자료를 제공하며, 데이터는 정기적으로 최신화됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
