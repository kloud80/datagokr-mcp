summary_user: 경주시 관내 천연기념물로 지정된 관광자원을 한 건씩 담은 API로, 이름·설명과 함께 이미지 파일명·이미지 링크, 주소와 위도·경도 좌표를 제공한다. 관광 앱 개발자나 지역 홍보 담당자가 '경주에 있는 천연기념물은 어디에 있고 어떤 모습인가'를 지도와 사진으로 보여 줄 때 쓴다. 전역 조인 키가 없어 다른 문화유산 데이터와는 천연기념물 이름이나 주소·좌표로 맞춰 연결해야 한다.
limits: 표준 문화재 코드 같은 공통 키가 없어 국가유산 지정 정보 등과 정확히 일치시키려면 이름·좌표 매칭이 필요하다. 범위는 경주시 한 곳뿐이며, 개발계정은 하루 10,000회로 호출이 제한된다.
