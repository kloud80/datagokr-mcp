summary_user: 서울 성북구에 있는 지정문화재를 한 건씩 담은 목록 파일로, 종목(국보·보물 등), 명칭, 주소, 관리 단체, 소유자, 지정일, 행정동, 위도·경도를 담는다. 성북구 주민이나 관광 콘텐츠 기획자가 "우리 동네 어느 행정동에 어떤 보물·사적이 있고 누가 관리하나"를 확인하거나 지도에 문화재 위치를 찍을 때 쓴다. 국가유산청의 종목코드·지정번호 같은 전역 조인 키가 없어서, 다른 데이터와는 명칭이나 행정동 이름을 맞춰 붙이거나 위도·경도로 공간 결합한다.
limits: 국가유산 지정 체계의 종목코드·지정번호나 소재지 PNU가 없어서 국가유산청 API와 바로 조인되지 않고, 명칭 매핑에 기대야 한다. 범위는 성북구 한 곳뿐이다.
