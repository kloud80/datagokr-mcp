summary_user: 제주 항공우주박물관 한 곳의 무장애여행 정보를 지점 단위로 담는다. 각 지점에는 아이디, 위도, 경도, 해발고도가 있고, 포털 설명상으로는 장소설명과 이미지도 함께 제공된다. 휠체어 이용자나 교통약자 동반 여행객이 박물관 안에서 경사로·승강기·무장애 화장실 같은 지점이 어디 있는지 지도에 표시하거나 동선을 짤 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 제주 무장애여행정보 시리즈나 문화시설 목록과는 시설 이름이나 좌표를 직접 맞춰 이어야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 항공우주박물관 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 항공우주박물관은 항공·우주 분야의 전시와 체험 콘텐츠를 제공하는 복합 문화시설로, 교통약자의 관람 편의를 고려한 무장애 환경을 갖추고 있다. 본 데이터는 시설 내부의 주요 전시장, 체험구역, 이동 동선에 대한 접근성 정보와 함께 장애인 전용 주차장, 경사로, 승강기 등 이동 지원 설비의 현황을 포함한다. 또한 휠체어 이동 가능 범위, 안내 표지판 배치, 무장애 화장실의 위치 등 이용자의 실질적 이동 편의를 위한 정보를 공공기관 기준에 따라 체계적으로 제공하여 무장애 관광지 관리 및 정보 제공에 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
