summary_user: 부산문화재단이 운영하는 부산문화포털 다봄의 공연·전시를 테마별로 묶어 건별 목록으로 제공하는 API이며, 제목, 운영 시작·종료일, 장소명, 유료 여부, 다봄 상세 페이지 주소 같은 항목을 담는다. 부산 시민이나 문화 앱 개발자가 "이번 달 부산에서 볼 수 있는 특정 테마의 공연·전시가 어디서 언제 열리고 유료인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 바로 연결되지 않으며, 장소명(place_nm)이나 다봄 자체 장소ID·프로그램 코드를 이름 매핑으로 맞춰 KOPIS 공연장 목록 등과 이어 쓴다.
description_portal: 부산문화포털 다봄은 부산시민의 문화생활을 지원하기 위해 부산문화재단이 운영하는 온라인 플랫폼입니다.주요서비스로 부산지역의 다양한 공연, 전시, 문화행사 정보를 한눈에 볼수 있는 공연/전시정보시민들이 참여하는 각종 문화체험 및 교육프로그램 정보예술인들을 위한 정보를 제공하고 공연 및 전시티켓 판매를 대행하는 예술인 공간으로 구성되어있습니다온라인 방문객들은 정보검색, 프로그램 신청등의 다양한 서비스를 이용할 수 있으며예술인들 또한 개인전 신청, 티켓 판매등의 다양한 지원을 받을 수 있습니다.개방되는 데이터는 공연, 전시별로 상세내역(공연기간, 시간, 장소, 대상, 출연진, 티켓 구매처와 가격정보를 제공합니다.
