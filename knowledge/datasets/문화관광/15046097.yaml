summary_user: 제주 지역을 특성별로 나눈 구분(구분)마다 BC카드 내국인 관광업종 결제 이용금액을 남녀·연령대(20대 이하~60대 이상)별로 집계한 파일로, 2014년 9월~2016년 8월 약 2년간 카드 매출을 바탕으로 한 2016년 보고서 자료입니다. 관광정책 담당자나 분석가가 '제주 어느 유형의 지역에서 어떤 성별·연령대 관광객이 돈을 많이 썼는가'를 살펴볼 때 씁니다. 실측 컬럼에 시군구코드나 관광지점코드 같은 전역 조인 키가 없어, 다른 관광 통계와는 지역 구분 이름을 맞춰 붙이거나 같은 기관(제주특별자치도) 자료끼리만 연결합니다.
description_portal: '제주도 내 지역 특성에 따른 지역별, 성연령별, 시간대별, 요일별 관광업종 결제 데이터 (카드이용금액, 카드이용건수, 카드이용자수 등) 정보 제공자료출처: 제주특별자치도 FIT 증가에 따른 제주 관광객 소비패턴 변화 분석 보고서 (2016년도)* 본 보고서는 ’14. 9월 ~ ’16. 8월까지 약 2년 간 BC카드(내국인) 및 유니온페이카드(중국인) 매츨데이터를 기반으로 작성한 자료임내국인과 중국인 카드 결제 대이터 등 객관적인 자료를 활용하여 관광 및 지역 경제 관련한 스마트한 정책의 수립과 실행을 지원하기 위하여 수행된 과업으로 제주 관광객의 전반적인 소비와 지역별 소비 분석, 개별 관광객 증가 대응 총 3가지 과업으로 구성되어 있다. 본 자료를 통해서 제주도를 찾은 관광객의 패턴 및 성향 분석을 통해 수요자 중심의 맞춤형 관광정책 개발을 지원하고, 민간데이터 기반한 객관적이고 과학적인 분석으로 현안문제 해결 지원을 기대할 수 있다.'
