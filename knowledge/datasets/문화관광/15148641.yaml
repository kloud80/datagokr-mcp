description_portal: 한국학 주제어 사전 데이터는 한국학 관련 인물, 제도, 문헌, 사상 등을 주제어 단위로 체계화한 메타데이터 자료입니다. 각 행은 고유한 주제어 ID를 중심으로 ‘주표제어(대표 용어)’, ‘부표제어(한자나 이칭 등 보조 용어)’, ‘분야(정치·법제, 종교·철학 등 세부 학문 분류)’, ‘유형(인물, 제도, 개념 등)’, ‘시대(고려, 조선, 근대 등 역사적 구분)’, 그리고 ‘정의(해당 주제어에 대한 서술형 설명)’로 구성되어 있습니다.한국학 주제어 사전은 한국학 연구자, 교육자, 일반 이용자 모두가 한국의 역사·문화·사상 관련 핵심 개념을 검색·분석할 수 있는 기초 인프라 역할을 하며, 데이터 기반의 학술 연구 및 디지털 인문학 활용에도 중요한 가치를 가집니다.
