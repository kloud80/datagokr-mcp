status: active
summary_user: 광주광역시관광재단이 제공하는 문화예술관광행사 프로그램 파일로, 행사 장소(시설명·주소·위도/경도·우편번호)와 행사명, 프로그램연도, 입장료 무료 여부·가격·할인정보를 행사 프로그램 단위로 담는다. 시민·관광객이나 분석가가 "광주에서 열리는 이 행사가 어느 시설에서 열리고 입장료는 얼마이며 할인은 있는가"를 확인하는 데 쓴다. 실측 컬럼에 공연ID·공연장ID 같은 전역 조인 키가 없어, KOPIS 공연·공연장 데이터 등과는 시설명·행사명 이름 매칭이나 주소·좌표로만 이어 쓴다.
limits: KOPIS 공연ID·공연장ID 등 공통 키가 없어 다른 공연 데이터와의 연결은 이름·주소 매칭에 의존하므로 오매칭에 주의한다. 명세상 수시·이벤트성으로 생성되는 파일이라 정기 갱신을 전제로 최신 행사 현황을 판단하기 어렵다.
