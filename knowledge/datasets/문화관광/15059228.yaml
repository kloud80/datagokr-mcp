summary_user: 경기도 안의 공공 국궁장(궁도장)을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군명·시설명·소유기관과 운영조직, 준공연도, 사대 수와 경기장 거리·면적, 건설사업비, 주소와 WGS84 좌표를 포함한다. 국궁을 하려는 도민이 우리 시군에서 가까운 활터와 운영 주체를 찾을 때나, 정책 담당자가 노후 국궁장의 리모델링 우선순위를 준공연도와 면적으로 따질 때 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 경기도의 다른 공공체육시설 현황이나 지역 통계와 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 공공 국궁장(궁도장)의 시설 현황을 수록한 자료로, 시군명, 시설명, 준공연도, 소유기관, 관리 및 운영조직, 좌석형태, 경기장 사대 폭 및 수, 경기장 거리, 연면적, 건축·부지면적, 건설사업비 등의 정보를 포함하고 있습니다. 주요 항목으로는 ‘시설명’, ‘경기장거리’, ‘경기장사대수’, ‘경기장면적(㎡)’, ‘건설사업비(백만원)’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며, 국궁 진흥정책, 전통체육 활성화 방안, 체육시설 리모델링 계획 등에서 활용될 수 있습니다. 대부분 야외 경기장 형태로 제공되며, 일부 시설은 ‘궁도협회’ 등의 민간 기관에 위탁되어 운영되고 있습니다. 경기장 거리(145m)는 국궁의 규정 거리를 반영하며, 비고사항에는 별도 특이사항이 기록될 수 있습니다. 일부 항목은 결측값이 존재하므로 분석 시 주의가 필요합니다.
