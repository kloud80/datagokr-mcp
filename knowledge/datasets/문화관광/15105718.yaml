description_portal: 본 데이터는 한국관광공사에서 제공하는 1975년부터의 연도별 및 월별 관광통계 자료이며 한국관광 데이터랩을 통해 수시로 업데이트되고 있습니다. 컬럼명은 한국어 및 영어로 제공됩니다. 연도별 및 월별 방한 외래관광객, 국민 해외관광객, 관광수입, 관광지출, 관광수지를 포함하고 있습니다. 한국 관광 산업 전반에 대한 시계열성을 지닌 거시적 지표로 활용될 수 있으며  본 데이터 단독 이용시 연도별 및 월별 인바운드, 아웃바운드 관광객 및 관광수지에 대한 수치를 비교 및 분석할 수 있습니다. 타 데이터와 연계 시 인과관계 파악에 활용할 수 있습니다.
