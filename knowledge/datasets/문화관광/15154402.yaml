description_portal: 국립중앙도서관에서 제공하는 서지 정보 제공 서비스는 국내외 학술 및 지식 정보 자원의 체계적인 통합과 효율적 이용을 위해 구축된 핵심 서지 메타데이터입니다. 본 서비스는 개발자 및 이용자가 다양한 유형의 지식 자원에 대한 정확한 정보를 표준화된 형태로 활용할 수 있도록 지원하며, 특히 Dublin Core, BIBO(Bibliographic Ontology) 등의 온톨로지로 구성된 국가서지 LOD(Linked Open Data) 데이터를 기반으로 제공합니다. 제공되는 서비스는 국립중앙도서관의 메타데이터 입력 형식에 따라 크게 MARC(Machine-Readable Cataloging) 기반의 오프라인 자료와 MODS(Metadata Object Description Schema) 기반의 온라인 자료로 구분됩니다. MARC 기반의 오프라인 자료는 단행본, 연속간행물, 학위논문, 고문헌 등 인쇄 자료와 더불어 녹음자료, 시청각자료, 악보 등 물리적 또는 비도서 형태를 포괄합니다. 반면, MODS 기반의 온라인 자료는 전자책, 전자저널, 동영상, 이미지, 사운드, 웹사이트 등 디지털 형태의 콘텐츠를 대상으로 합니다.제공되는 서지 정보는 단순 목록을 넘어, 저자 정보와 주제 정보가 각각 저작 관계 및 주제 관계로 유기적으로 연결되어 있습니다. 이로써 이용자는 특정 저자의 다른 저작물을 찾거나 주제별 연관 자료를 확장 탐색하는 등 심도 있는 정보 활용이 가능합니다. 개발자는 이처럼 표준화된 LOD 기반의 서지 메타데이터를 활용하여 검색 시스템, 추천 서비스 등 다양한 응용 서비스를 개발할 수 있으며, 이는 국내 지식 정보 자원의 상호운용성을 높이고 학술 연구 활동 증진에 크게 기여할 것으로 기대됩니다.
