summary_user: 경상남도 거창군이 허가한 문화재매매업 업소를 한 곳씩 담은 건별 목록으로, 허가번호·업소명·도로명/지번주소·허가일자·전화번호·위도·경도를 담는다(CSV 390바이트의 소규모 파일). 거창군에서 허가받은 골동품·문화재 매매 업소가 어디에 있는지, 거래하려는 업소가 정식 허가를 받았는지 확인하려는 주민·구매자에게 쓴다. 전역 조인 키는 없어 국가유산청 지정 유산 데이터(종목코드·지정번호)와는 직접 연결되지 않고, 주소나 위경도로 다른 시군구의 문화재매매업 목록 또는 지도 데이터와 이어 쓴다.
limits: 업소 허가 현황만 담고 거래 내역이나 취급 문화재 정보는 없다. 공통 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 좌표로만 연결된다. 범위는 거창군 한 곳에 한정된다.
