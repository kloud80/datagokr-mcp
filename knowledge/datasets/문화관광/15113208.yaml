description_portal: '○ 경상남도 거창군 문화재매매업의 데이터로  경상남도 거창군 문화재매매업 허가번호,  경상남도 거창군 문화재매매업 업소명,  경상남도 거창군 문화재매매업 도로명주소,  경상남도 거창군 문화재매매업 지번주소,  경상남도 거창군 문화재매매업 허가일자,  경상남도 거창군 문화재매매업 전화번호 등의 항목을 제공합니다○ 데이터 기준일 : 2026. 03. 13.○문화재매매업은 동산에 속하는 유형문화재나 유형의 민속문화재를 매매하거나 교환하는 것을 업으로 하는 사업을 의미합니다. 이는 문화재의 보호와 유통 질서 확립을 위해 「문화재보호법」에 따라 엄격하게 관리되는 분야입니다.과거에는 신고제로 운영되기도 했으나, 문화재의 불법 유통을 방지하고 체계적인 관리를 위해 현재는 허가제로 전환되었습니다. 따라서 문화재매매업을 하고자 하는 개인이나 법인은 대통령령으로 정하는 자격 요건을 갖추어 관할 지방자치단체장(특별자치도지사, 시장·군수 또는 구청장)의 허가를 반드시 받아야 합니다.문화재매매업자는 거래되는 문화재의 투명성을 확보하기 위해 매매 내역을 장부에 기록하고, 관련 사진을 첨부하는 등 법적 의무를 성실히 이행해야 합니다. 또한, 문화재를 다루는 전문성과 윤리 의식을 바탕으로 우리 문화유산의 원형을 보존하고 가치를 전달하는 중요한 역할을 수행합니다. 허가 없이 영업하거나 불법적인 거래를 할 경우 「문화재보호법」에 따라 처벌받을 수 있으므로 철저한 법규 준수가 필수적입니다.'
