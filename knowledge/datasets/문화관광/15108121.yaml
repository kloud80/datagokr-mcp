summary_user: 충청남도 서천군의 지정문화유산(기념물·보물·사적 등)을 유산 한 건 단위로 담으며, 명칭·지정번호·종류·지정등록일·시대·소개와 함께 도로명·지번 주소와 위경도 좌표, 담당부서·연락처를 제공한다. 서천군 안에 어떤 지정문화유산이 어디에 있고 언제 지정됐는지 확인하려는 주민·관광객이나, 지역 유산 분포를 지도로 정리하려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 API 등 다른 유산 데이터와는 유산 명칭·지정번호를 맞추거나 주소·좌표로 이어 써야 한다.
description_portal: 서천군 지정문화유산정보에 대한 정보이며, 기념물/보물/사적 명칭과 소개, 지정등록일, 해당 보물의 시대적 배경, 지역명과 담당부서에 대한 정보를 나타냅니다.
