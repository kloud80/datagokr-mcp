summary_user: 서울특별시 중랑구에 있는 국가지정·서울시지정 국가유산(문화재)을 한 건씩 나열한 목록 파일로, 지정 종류, 지정번호, 지정명칭, 위치(보호구역), 소유·관리 주체를 담는다(약 4KB 분량의 CSV). 주민이나 지역사 연구자가 중랑구 안에 어떤 지정 문화재가 어디에 있고 누가 관리하는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로, 국가유산청 유산 목록과 잇는다면 지정 종류와 지정번호 또는 명칭을 직접 대조해 매핑해야 한다.
