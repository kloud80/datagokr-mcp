description_portal: '- 서울특별시 중랑구에 있는 국가유산(문화재) 현황 정보를 제공합니다. 지정품종, 지정번호, 지정명칭, 소유관리 현황, 위치등을 제공합니다.- 서울특별시 중랑구에는 국가지정 국가유산과 서울시지정 국가유산을 포함하여 다양한 국가유산이 소재해 있습니다.- 중랑구는 국가유산의 보호와 관리를 위해 다양한 정책을 시행하고 있으며, 국가유산 영향진단, 정기 점검, 국가유산 보수정비를 통해 국가유산의 원형을 보존하고 있습니다.- 중랑구 국가유산의 세부 목록은 파일을 참고해주시기 바랍니다.- 국가유산 별 자세한 설명은 중랑구청 홈페이지 분야별정보 -> 문화관광 -> 국가유산 탭에서 확인 가능합니다.'
