summary_user: 인천 부평구에 등록된 당구장을 한 곳씩 담은 명부로, 업종(일반당구장·포켓볼 등), 상호, 도로명 주소, 전화번호를 사업장 단위로 담는다(csv 약 11KB). 주민이 동네 당구장 위치와 연락처를 찾거나, 분석가가 부평구 안 당구장 분포와 다른 체육시설업·상권과의 관계를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 상호 이름으로 맞춰 잇는다.
description_portal: '당구장 현황 데이터는 부평구에 등록된 당구장의 위치, 업종, 연락처 등을 정리한 공공데이터이다.지역 내 당구시설 분포를 확인하거나 시설 이용 정보를 찾는 데 활용할 수 있다.주요 항목 설명● 업종: 일반당구장, 포켓볼 등 당구장 종류를 구분한 항목● 상호: 사업장에 등록된 당구장 이름● 시설주소(도로명): 도로명 기준으로 작성된 당구장 위치● 시설전화번호: 이용 문의, 예약 등에 활용 가능한 연락처※ 본 데이터는 생활체육 정보 제공, 지도 기반 위치 서비스, 청소년 이용 가능 시설 안내 등 다양한 목적에 활용 가능함'
