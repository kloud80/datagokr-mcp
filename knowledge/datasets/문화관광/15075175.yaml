description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다. "* 감수굴밭담길은 제주 제주시 구좌읍 평대리에 위치한 약 1.5 km 길이의 전통 밭담길 산책로로, 현무암 돌을 이용해 세운 밭담과 제주 농촌 특유의 돌담 마을풍경, 밭과 들판, 마을길이 어우러진 농촌의 정취가 살아 있는 공간이며 평탄한 포장 또는 잘 정비된 보행로 덕분에 휠체어나 유모차 이용자, 고령자, 보행 약자도 크게 무리 없이 천천히 걸으며 농촌 경관과 마을 분위기를 감상할 수 있고 돌담 너머로 보이는 밭과 들녘, 제주 특유의 자연과 계절 변화를 함께 누릴 수 있어 도심을 벗어난 여유와 치유를 원하는 이들에게 적합한 무장애 친화 관광지로 기능하며 관광 안내, 무장애 여행 코스 설계, 열린관광지 홍보, 관광 콘텐츠 제작 등 다양한 공공 및 관광 분야 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
