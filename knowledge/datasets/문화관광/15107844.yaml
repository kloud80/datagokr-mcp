summary_user: 경륜 선수별로 경기연도(stnd_yr) 기준 등급, 기수, 출주회차·출전횟수, 1~9위별 입상 횟수, 승률·연대율·삼연대율, 실격·낙차포기·고장포기 횟수를 담은 선수 단위 성적 집계 API입니다. 경륜 팬이나 분석가가 특정 선수의 연도별 승률과 입상 이력을 확인하거나 선수 간 성적을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 경륜 데이터와는 선수명·기수번호 같은 이름·코드를 맞추거나 같은 기관 코드로만 잇는다.
description_portal: 경륜-선수정보는 국민체육진흥공단이 운영하는 경륜 경주의 선수 개별 정보를 종합적으로 제공하는 공공데이터 API 서비스입니다. 이 데이터는 선수번호, 이름, 등급과 같은 기본적인 신상정보는 물론, 출전회수, 출전일수, 각 순위별 입상 횟수(1위, 2위, 3위 등), 승률, 연대율, 삼연대율 등 상세한 성적 통계를 포함하고 있습니다. 또한 실격 및 포기 횟수, 전법별 1착 횟수, 기수, 평가점, 기어배수 등 경주 전략과 관련된 지표도 제공됩니다. 더불어 흡연량, 혈액형, 결혼 여부, 시력 같은 생체 정보까지 포함되어 있어 선수들의 전반적인 특성을 다각도로 분석할 수 있도록 설계되어 있습니다. 이 데이터는 성적 분석, 전략 수립, 예측 모델 구축 등 다양한 분야에서 활용도가 높으며, 경륜 팬들과 연구자, 데이터 분석가 모두에게 중요한 인사이트를 제공합니다.
