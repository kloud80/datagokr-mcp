summary_user: 이천시시립도서관 장서를 한 권(서지 레코드) 단위로 담은 원천 목록으로, 서명·저자·출판년·청구기호·언어·출판국가·페이지·ISBN·소장처와 마크 생성일·자관 입력일을 포함하며 약 9.8MB 규모의 CSV 파일로 제공된다. 이천시 주민이나 연구자가 '이천시립도서관에 이 책이 있고 어느 소장처에 있는가', '외국도서나 특정 언어 장서 비율은 얼마인가'를 확인하는 데 쓴다. 실측상 전역 조인 키는 확인되지 않았으나, ISBN(국제표준도서번호) 필드를 매개로 국가서지나 도서관정보나루의 도서·대출 데이터와 이름·번호 매핑 방식으로 이어 쓸 수 있다.
limits: 실측 컬럼에서 공식 조인 키가 확인되지 않아 다른 데이터와는 ISBN·서명 등의 값 매칭이나 같은 기관 기준으로만 연결된다. 이천시 한 지자체 도서관의 장서만 담으며, 대출 이력이나 이용 통계는 들어 있지 않다.
