description_portal: '은평구의 영리를 목적으로 영화를 상영하는 장소 또는 시설 정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 영리를 목적으로 영화를 상영하는 장소 또는 시설의 인허가 현황을 담고 있습니다. 데이터에는 각 영화상영관의 상호명, 소재지 주소, 최초 허가일, 현재 영업 상태(영업중, 폐업 등)와 같이 문화시설 관리의 핵심적인 정보가 포함되어 있으며, 정확한 위치 파악을 위한 좌표 정보도 함께 제공됩니다.영화상영관은 「영화 및 비디오물의 진흥에 관한 법률」에 따라 관할 지자체에 신고해야 하는 문화시설로, 일정한 시설 기준과 안전 기준을 충족해야 합니다. 이 데이터는 주민들이 정식으로 허가받은 안전하고 신뢰할 수 있는 영화관을 확인하고 선택하는 데 도움을 줍니다. 특히, 최신 상영 기술을 갖춘 대형 멀티플렉스부터 지역 밀착형 소규모 극장까지 다양한 형태의 영화상영관 현황을 파악할 수 있어, 문화 향유 기회를 찾는 구민들에게 유용한 정보를 제공합니다.또한, 지자체는 이 데이터를 기반으로 지역 내 문화 인프라 분포를 파악하고, 문화 소외 지역에 대한 지원 정책을 수립하거나 영화 관련 문화 행사를 기획하는 등 구민의 문화적 삶의 질 향상을 위한 정책을 수립하는 데 기초 자료로 활용합니다.'
