summary_user: 충청남도 계룡시 관내에서 열리는 체육대회·경진대회를 대회 한 건씩 담은 목록으로, 대회명·장소·기간·주최·주관·후원·문의처를 제공한다. 시민이나 참가 희망 선수가 계룡시에서 언제 어떤 대회가 열리고 누구에게 문의해야 하는지 확인하거나, 분석가가 지역 대회 개최 현황을 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대회명·장소 이름 매핑이나 같은 기관(계룡시) 기준으로만 이어 쓸 수 있다.
description_portal: 충청남도 계룡시의 '체육대회 정보 API' 데이터는 관내에서 개최되는 각종 스포츠 및 경진대회에 대한 상세 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 체육대회 정보를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 대회의 공식 명칭인 경진대회 명, 대회가 열리는 경진대회 장소, 진행 기간 정보가 포함됩니다. 또한, 대회를 조직하고 책임지는 주최, 주관 기관과 지원하는 후원 기관 정보, 그리고 참가자 및 일반인의 문의를 위한 문의처까지 상세히 제공됩니다.
