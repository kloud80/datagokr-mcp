summary_user: 일상생활에서 자주 쓰는 수어 표현을 한 건씩 담은 원천 데이터로, 표현마다 명칭, 손 모양 설명(signDescription), 수어 이미지, 주제 분류, 관련 장소·시간 범위, 저작권 정보를 기록하며 범위는 전국·비공간이다. 수어를 처음 배우는 사람이나 교육 콘텐츠 개발자가 '병원·은행 같은 장소에서 쓰는 인사말을 수어로 어떻게 표현하나'처럼 표현의 동작과 이미지를 찾을 때 쓴다. 다른 데이터와 맞물리는 전역 조인 키는 없어서, 주제 분류나 표현 명칭을 기준으로 이름을 맞추거나 같은 기관의 다른 수어 데이터와 이어 쓴다.
description_portal: 일상생활에서 자주 사용되는 수어 표현과 관련 정보를 체계적으로 제공하는 데이터셋입니다. 다양한 주제별로 분류된 수어의 명칭, 수형 설명, 이미지, 내용, 관련 장소, 시간적 범위, 저작권 정보 등 폭넓은 정보를 포함하고 있어 수어 학습, 교육 자료 개발, 정보 접근성 향상 등에 활용할 수 있습니다. 특히 수어를 처음 접하는 일반인, 교육자, 연구자, 콘텐츠 개발자 등 다양한 이용자가 손쉽게 수어의 의미와 사용 방법을 이해할 수 있도록 상세한 설명과 시각 자료를 함께 제공합니다. 이를 통해 수어에 대한 인식 제고와 소통의 폭을 넓히는 데 기여합니다.
