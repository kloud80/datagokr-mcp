summary_user: 경기도 시군별 예총(한국예술문화단체총연합회)·민예총(한국민족예술인총연합) 지부를 단체 한 곳당 한 행으로 담은 현황 자료로, 집계년도·시군·단체구분·대표자·예술분야 비고와 지번·도로명 주소, WGS84 위경도를 포함한다. 지역문화 정책 담당자나 분석가가 "우리 시군에는 어떤 예술단체 지부가 어디에 있고 어떤 분야를 아우르나"를 확인하거나, 예술 지원 사업·행사 분산 계획의 기초 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, KOPIS 공연ID·공연장ID와는 직접 연결되지 않고 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 다른 경기도 데이터와 맞춰 쓴다.
description_portal: 경기도 내 공연예술단체 현황입니다. 단체명, 단체구분명, 대표자명, 위치 등의 정보를 제공합니다.이 데이터는 경기도 내 지역 예술인 단체인 예총(한국예술문화단체총연합회) 및 민예총(한국민족예술인총연합)의 시군별 지부 현황을 나타낸 자료입니다. 주요 항목은 집계년도, 시군명, 단체명, 단체구분명(시군예총/민예총), 대표자명, 예술분야 비고사항, 소재지 주소(지번 및 도로명), 우편번호, WGS84 기준 위도·경도 좌표입니다. 각 지부는 사진, 국악, 문인, 미술, 연극 등 다양한 예술 분야를 아우르고 있으며, 이를 통해 지역 예술 활동 기반, 문화 인프라 분포, 지역 예술인 네트워크 형성 등을 분석할 수 있습니다. 해당 데이터는 지역문화 정책 수립, 예술 지원 사업 기획, 예술행사 분산계획 등의 기초자료로 활용될 수 있습니다.
