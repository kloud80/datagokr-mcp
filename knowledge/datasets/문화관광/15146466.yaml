description_portal: 이 데이터는 서울시 및 자치구 장난감도서관 운영 현황을 정리한 자료입니다. 포함된 열은 연번, 자치구(개소수), 명칭, 연락처, 대여가능품목(장난감, 도서), 홈페이지이며, 이를 통해 각 자치구별 장난감도서관의 위치와 운영 개수, 제공 서비스, 연락처 및 온라인 정보까지 확인할 수 있습니다. 시민들은 이 자료를 활용하여 가까운 도서관을 찾아 장난감과 도서를 대여하고, 온라인을 통해 세부 정보를 확인할 수 있습니다. 서울시 전체 장난감도서관의 현황을 한눈에 파악할 수 있다는 점에서 행정·이용자 모두에게 유용합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
