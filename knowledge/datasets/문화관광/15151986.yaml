description_portal: 문화체육관광부 산하 기관인 국립중앙박물관과 관련된 통계 데이터를 제공합니다. 그 중에서도 온라인 부문의 데이터에 초점을 맞추었으며, 통계 기간은 2018년 12월부터 2021년 1월까지입니다. 제공 항목은 집계 월별로 각각 ICT 건수, 안드로이드 버전 박물관 앱 다운로드 수, iOS 버전 앱 다운로드 수, 누리집(홈페이지) 방문자 수, 홈페이지에서의 페이지 전체 조회수, 박물관에서 운영하는 X(구 트위터)의 팔로워 수, 인스타그램 팔로워 수, 유튜브 팔로워 수, 네이버 블로그 조회수를 제공합니다. 해당 데이터는 교육 자료 및 문화 연구 자료로도 활용이 가능하며, 그외에도 다양한 분야에서 유용하게 활용될 수 있을 것입니다.
