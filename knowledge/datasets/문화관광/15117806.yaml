description_portal: 광주광역시 동구에 위치한 종교시설 현황 데이터는 코로나19 방역을 강화하기 위한 목적에서 2023년 2월 20일 기준으로 일회성으로 조사된 자료입니다. 이 데이터는 지역 내 종교시설의 분포를 파악해 집단 감염을 예방하고, 방역 지침 안내 및 현장 점검을 체계적으로 실시하기 위한 기초 자료로 활용되었습니다.데이터에는 각 시설의 명칭을 나타내는 시설명이 포함되어 있어 어떤 종교시설들이 조사 대상이었는지를 직접 확인할 수 있습니다. 자치구 항목은 해당 시설이 속한 행정 관할 구역을 보여 주며, 여기서는 모두 광주광역시 동구 내 시설을 의미합니다.또한 행정동 정보는 시설이 위치한 보다 세부적인 지역 단위를 제공하여, 방역 점검이나 행정 안내가 필요한 경우 정확한 위치 기반의 대응이 가능하도록 합니다. 마지막으로 소재지는 종교시설의 도로명주소 또는 지번주소 등 구체적인 위치 정보를 담고 있어, 현장 방문이나 방역 점검 시 활용도가 높습니다.이 데이터는 조사 당시 방역 정책 지원을 위해 활용되었으며, 정기적 업데이트 없이 일회성으로 작성된 자료라는 점에서 역사적·정책적 참고 가치가 있습니다.
