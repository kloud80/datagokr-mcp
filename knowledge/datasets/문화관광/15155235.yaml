summary_user: 전국 자치단체가 관리하는 전통사찰 인허가 정보를 사찰 한 곳당 한 건으로 담은 원천 데이터로, API 전체 1,907건이며 인허가일자·영업상태·주소·좌표·신도수·승려수·지정취소 여부 등을 포함한다. 분석가나 지자체 담당자가 특정 지역에 어떤 전통사찰이 있고 지정취소나 폐업 상태인지 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 주소 키로 삼아 다른 주소 기반 데이터와 이어 쓰며, 필수 조건인 기준일자와 개방자치단체코드는 다른 데이터에서 먼저 받아 넘긴다.
