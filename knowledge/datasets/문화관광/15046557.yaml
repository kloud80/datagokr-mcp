description_portal: '○ 통계개요* 통계명 : 언론매체(2009년 이후)* 통계종류 : 서울시 자치구별 언론매체 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 신문사ㆍ방송국 등 언론매체(기관) 현황을 파악하여 시민들에게 정보제공을원활히하고 언론관련 정책수립에 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 한국언론재단 미디어◎가온* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시 자치구별 방송사(지상파방송ㆍ케이블TVㆍ라디오 등) 및신문사(일간ㆍ주간ㆍ인터넷신문) 현황○ 기 타* 2009년부터 조사방법 변경 자치구보고통계 → 한국언론재단 미디어◎가온 통계활용* 기타방송은 유선방송, 방송채널사용자 포함* 일간신문중 종합일간지는 25개이며(2010년말 기준) 스포츠신문, 지역일간신문,무료신문, 특수신문을 포함하며, 주간신문사에 격주간신문사 포함'
