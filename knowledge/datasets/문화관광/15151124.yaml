summary_user: 국립어린이청소년도서관 사서들이 발행 6개월 이내 신간 중에서 골라 격월로 공개하는 추천도서를 도서 한 권당 한 행으로 담은 파일이며, 제목·저자·발행처·발행연도·주제·청구기호·추천 연월과 유아·초등(저)·초등(고)·청소년 대상 구분, 추천 내용을 함께 싣는다. 학부모·교사·학교도서관 사서가 "우리 아이 연령대에 맞는 최근 추천 신간은 무엇인가"를 찾거나, 분석가가 대상별·주제별 추천 경향을 살피는 데 쓴다. 실측에서 전역 조인 키는 확인되지 않았으므로 ISBN 필드를 매개로 도서관정보나루 대출·인기도서나 국가서지 정보와 맞춰 보는 식으로 이어 쓰되, 이 연결은 별도 검증이 필요하다.
description_portal: 국립어린이청소년도서관 사서추천도서는, 국립어린이청소년도서관 사서들이 발행 6개월 이내의 신간도서 중에서 어린이, 청소년의 발달 단계를 고려하여 공감할 수 있는 도서를 선정하고 유아, 초등(저), 초등(고), 청소년으로 대상을 구분하여 책 내용과 함께 누리집에 격월 공개합니다.해당 데이터는 사서추천도서에 대한 정보를 저장하고 있으며, 제목, 저자, 출판연도, 출판사 등 각 도서의 전반적인 정보로 구성되어 있습니다.해당 정보는 국립어린이청소년도서관 대표 홈페이지 [ 자료검색 > 사서추천도서 ] 메뉴에서도 확인 가능합니다.
