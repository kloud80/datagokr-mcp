summary_user: 충청북도 내 종합운동장·공설운동장 14개소(포털 설명 기준)를 시설 한 곳당 한 행으로 담은 소규모 현황 파일로, 시설명·소재지·면적(제곱미터)·규격·수용인원·준공년도를 담는다. 도민이나 행사 주최자가 "우리 시군에 수용인원이 몇 명인 운동장이 있고 언제 지어졌나"를 확인하거나, 분석가가 도내 시군별 대형 체육시설 분포를 비교하는 데 쓴다. 전역 조인 키나 코드 필드가 없으므로 다른 체육시설 데이터와는 시설명이나 소재지 주소의 시군명을 직접 맞춰 이어 써야 한다.
