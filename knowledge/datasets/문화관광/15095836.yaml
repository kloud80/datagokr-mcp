status: active
summary_user: 경상남도 주요 관광지별로 월 단위 관광객 수(turist_co)와 전년 같은 달 관광객 수, 관광지 언급 수, 함께 언급된 화제어와 그 빈도를 담은 집계 데이터로, 범위는 경상남도 시군구 단위다. 지자체 관광 담당자나 분석가가 "이 관광지의 올해 월 방문객이 전년보다 늘었는지, 그때 어떤 키워드로 화제가 됐는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관광 통계와는 시군구명(sigugn)·관광지명 같은 이름 매핑으로만 연결한다.
limits: 관광지점코드나 표준 시군구코드 같은 공통 키가 실측 컬럼에서 확인되지 않아, 다른 데이터와 붙일 때 이름 표기 차이를 직접 맞춰야 한다. 범위는 경상남도 안의 시군구로 한정된다. 개발계정은 하루 1,000회 호출로 제한된다.
