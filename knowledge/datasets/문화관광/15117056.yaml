summary_user: 한국도자재단이 매년 여는 도자기 박람회 경기도자페어의 연도별 개최 정보를 행사(본행사·사전행사) 단위로 담으며, 행사명·연도·주제·시작일·종료일·장소·참가업체명을 포함한다. 공예산업 종사자나 행사 기획자가 해마다 주제와 개최 장소가 어떻게 바뀌었고 어떤 업체가 참가했는지 알아볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 참가업체명 같은 이름 매칭이나 행사년도·개최일자 기준으로만 맞춰 이어 쓴다.
description_portal: 한국도자재단에서 매년 개최하는 국내 유일 도자기 박람회 경기도자페어의 연도별 개최 정보에 관한 정보입니다.도자 문화 확산과 산업 활성화를 위한 전시회 정보를 포함하고 있습니다. 항목은 행사명, 행사년도, 구분(본행사/사전행사), 주제, 시작일, 종료일, 장소, 참가업체명, 데이터기준일자로 구성되어 있으며, 도자 전시회의 트렌드와 변화를 시계열적으로 파악할 수 있도록 설계되었습니다. 행사주제의 다양성, 장소의 이동, 참가업체 구성 등은 문화 행사 분석, 예산 지원 계획, 행사 운영 전략 수립 등에 활용될 수 있습니다. 해당 자료는 문화예술 분야의 정책 입안자, 행사 기획자, 공예산업 종사자들에게 유용한 기초 데이터로 기능합니다.
