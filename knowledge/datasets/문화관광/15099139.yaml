description_portal: 서울특별시 광진구_공공미술 데이터는 광진구 관내에 설치된 공공미술 작품의 현황과 관리 정보를 제공하는 행정 데이터입니다. 이 데이터는 “작품유형”, “작품분류”, “작품명”, “규격”, “재료”, “설치일자”, “작품주소”, “관리기관”, “데이터기준일” 필드로 구성되어 있습니다. ‘작품유형’과 ‘작품분류’는 공공미술의 종류와 세부 카테고리를 구분하며, ‘작품명’은 해당 미술 작품의 이름을 제공합니다. ‘규격’은 작품의 크기와 형태를 나타내고, ‘재료’는 제작에 사용된 주된 소재를 명시합니다. ‘설치일자’는 작품이 설치된 날짜를 보여주며, ‘작품주소’는 해당 작품의 위치를 제공합니다. 또한 ‘관리기관’은 작품의 유지관리 책임 기관을 나타내며, ‘데이터기준일’은 정보의 최신화 기준일을 명시합니다. 이 데이터는 도시 미관 관리, 문화예술 자산 조사, 공공미술 정책 수립 및 지역 문화 활성화의 기초 자료로 활용될 수 있습니다.
