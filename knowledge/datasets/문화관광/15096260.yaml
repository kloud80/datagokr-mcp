summary_user: 국립중앙도서관이 한국고문헌종합목록시스템 참여 기관 가운데 직접 디지털 파일을 구축해 서비스하는 공공도서관 소장 고문헌의 원문 목록 2,000여 건을 담은 엑셀 파일로, 건별 자료 목록이며 범위는 전국입니다. 연구자나 일반 이용자가 '어느 공공도서관 소장 고문헌이 원문(디지털 파일)으로 공개되어 있는가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 도서관·서지 데이터와는 기관명이나 자료명 같은 이름 매핑으로만 이어 쓴다.
limits: 파일 머리행이 '고문헌원문목록(2025.7.7. 현재)'이라는 제목 한 줄이고 나머지 열은 이름 없이 읽혀, 실제 열 이름은 파일 안의 다음 행에서 다시 확인해야 한다. 도서관코드·ISBN 같은 공통 키가 없어 도서관정보나루 등과 코드로 바로 조인할 수 없고, 위치 좌표가 없는 비공간 자료다.
