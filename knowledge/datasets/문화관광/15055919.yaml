summary_user: 광주 광산구 관내 공공 체육시설(축구장·야구장·테니스장·족구장·농구장·게이트볼장·동네체육시설 등)을 시설 한 곳당 한 행으로 담은 파일로, 종류(구분)·시설명·주소·설치시설물·등록일자를 담는다. 광산구 주민이 집 근처에서 쓸 수 있는 테니스장이나 족구장이 어디에 있고 어떤 시설물이 있는지 찾는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소나 시설명을 맞춰 붙이거나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: 광산구 관내 공공 체육시설에 대한 데이터로 축구장, 야구장, 테니스장, 족구장, 동네체육시설, 농구장, 게이트볼장 등의 현황 정보를 제공합니다.광주광역시 광산구에는 다양한 공공 체육시설이 마련되어 있어 주민들의 건강 증진과 여가 활동에 기여하고 있습니다. 이들 시설은 축구장, 야구장, 테니스장, 족구장, 농구장, 게이트볼장 등 다양한 종목을 수용할 수 있도록 조성되어 있습니다. 이러한 시설들은 지역 주민들에게 스포츠 활동의 기회를 제공하며, 건강한 지역사회를 형성하는 데 중요한 역할을 하고 있습니다. 각 시설의 상세한 위치와 정보는 공공데이터포털을 통해 확인할 수 있으며, 이를 통해 주민들은 가까운 체육시설을 쉽게 찾을 수 있습니다.
