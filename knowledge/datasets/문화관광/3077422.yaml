summary_user: 울산광역시 관내 문화시설(공연장·전시관·박물관·도서관 등)을 시설 한 곳당 한 행으로 담은 파일로, 시설명·구분·주소·위도·경도·전화번호·누리집 주소·좌석수 또는 열람석수·개관일을 포함한다. 시민이 "우리 동네 가까운 공연장이나 도서관이 어디인가"를 찾거나, 분석가가 울산 구·군별 문화시설 분포와 공백 지역을 파악하는 데 쓴다. 전역 조인 키(문화시설 코드 등)는 없으므로 다른 데이터와는 시설명·주소로 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
limits: 공식 시설코드가 없어 KOPIS 공연장 정보나 도서관 정보나루 같은 전국 데이터와 바로 조인되지 않고, 이름·주소 매칭에 기대야 한다. 범위는 울산광역시 한 곳뿐이라 다른 시도와 비교하려면 별도 데이터가 필요하다.
