summary_user: 부산광역시에서 열리는 콘서트를 공연 건별로 담은 API로, 제목·공연 시작/종료일·공연장명·출연진·관람등급·가격·공연시간·예매 링크 등을 제공한다. 앱·웹 개발자나 분석가가 '이번 달 부산에서 열리는 무료 콘서트는 어디서 언제 하나' 같은 일정·장소 조회에 쓴다. 실측 컬럼에서 KOPIS 공연ID 같은 전역 조인 키는 확인되지 않아, 다른 공연·문화시설 데이터와는 공연장명·공연명 등 이름 매칭이나 부산광역시 자체 공연장 식별자(place_id)로만 이어 쓴다.
limits: KOPIS 공연ID·공연장ID와 직접 연결되는 키가 없어 전국 공연·예매/매출 데이터와 정확히 결합하기 어렵다. 범위는 부산 한 시도이고, 갱신은 이벤트 단위로 생성된 뒤 바뀌지 않는 방식으로 분류되어 있다. 활용신청은 자동승인이며 개발계정은 하루 10,000회 호출 제한이 있다.
