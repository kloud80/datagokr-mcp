description_portal: 콘서트는 음악가나 음악 단체가 관객 앞에서 직접 음악을 연주하거나 노래를 부르는 라이브 공연을 의미합니다. 그 범위가 매우 넓고 다양하며, 클래식부터 팝, 록, 재즈, K-팝 등 모든 음악 장르를 포괄합니다.개방되는 데이터에는 콘서트 관련 정보를 담은 공공데이터 API(Application Programming Interface)입니다. 일반 시민이 직접 콘서트 정보를 찾아볼 수 있는 웹사이트가 아니라, 개발자나 연구자들이 새로운 서비스를 만들 때 활용할 수 있는 원천 데이터를 제공하는 것을 목적으로 합니다.콘서트 제목, 공연기간, 공연장명, 유무료 구분등의 정보를 제공하며 이 데이터를 활용하여 부산에서 열리는 콘서트 일정을 한눈에 보여주는 앱 개발, 장르별 콘서트 정보와 예매 링크를 제공하는 웹사이트 개발 등을 할 수 있습니다.
