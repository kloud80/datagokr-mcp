description_portal: 본 데이터는 한국문화관광연구원이 수행한 기본연구사업의 과제목록을 체계적으로 정리한 현황 자료이다. 연구원의 고유 목적사업으로 추진된 연구과제를 대상으로 하며, 기초연구, 정책연구, 수시연구 등 연구 유형별 과제 정보를 포함한다. 주요 수록 항목은 과제 수행 연도, 과제명 및 보고서명, 연구 책임자명 등 과제 식별과 이해에 필요한 기본 속성정보로 구성되어 있다. 본 데이터는 연구 수행 이력과 연구 주제의 흐름을 파악할 수 있도록 구조화되어 있으며, 연구성과 관리, 과제 검색, 정책연구 동향 분석 등을 위한 기초자료로 활용된다. 또한 문화·관광·콘텐츠 분야 정책연구 축적 현황을 종합적으로 확인할 수 있어 대외 정보 제공과 연구 투명성 제고에 기여한다.
