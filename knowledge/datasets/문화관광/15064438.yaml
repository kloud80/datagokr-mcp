summary_user: 한국동서발전 사내 전자도서관에 등록된 도서를 한 권(바코드) 단위로 담은 건별 원천 파일로, 책이름·저자·출판사·출판일·가격·줄거리·소속 사업소와 함께 대여 상태·대여 기간·연장 횟수, 리뷰·평점·서평 항목이 들어 있다(csv 약 8.1MB). 분석가나 연구자가 '공기업 사내 도서관은 어떤 분야 책을 보유하고, 사업소별로 어떤 책이 많이 대여·추천되는가'를 살피는 데 쓴다. 실측 컬럼에 ISBN·도서관코드 같은 전역 조인 키가 없어 다른 도서관·국가서지 데이터와는 책이름·저자·출판사를 맞춰 붙이는 방식으로만 연결된다.
description_portal: 한국동서발전의 전자도서관 운영 현황 정보 데이터입니다. 해당 데이터는 전자도서관에 등록된 도서의 바코드, 책이름, 도서 시리즈명, 저자, 출판사, 출판일, 등록일, 가격(원), 간단 줄거리, 책 이미지, 소속 사업소 등의 항목으로 구성됩니다. 이 데이터는 기업 내부 지식경영과 독서문화 확산을 위한 자원 활용 현황을 파악할 수 있도록 도와주며, 도서관 운영 효율성과 콘텐츠 선호 경향을 분석하는 데 유용합니다. 학계 및 연구기관에서는 기업의 조직 내 지식자료 축적 현황, 분야별 도서 보유 경향, 지역별 지식자원 접근성 분석, 독서 프로그램 효과성 검토, 디지털 도서관 구축 사례 비교연구 등에 활용할 수 있습니다. 특히 공기업의 독서·문화 기반 조성 전략 수립 시 참고자료로 적합합니다.
legal_basis_portal: 임직원 교육·복지 및 독서지원 운영계획에 따른 도서 보유, 분류, 이용, 질의응답 및 독서후기 관리
