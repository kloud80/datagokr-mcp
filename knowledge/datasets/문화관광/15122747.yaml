summary_user: 경기도 예술단(경기도극단, 경기도무용단, 경기시나위오케스트라, 경기필하모닉오케스트라, 팝스앙상블 등)의 정원과 현원을 구분(div)별로 정리한 집계 현황 자료로, 경기도 단위 비공간 데이터다. 문화예술 정책 담당자나 분석가가 "경기도 각 예술단은 정원 대비 실제 인력이 얼마나 채워져 있는가"를 확인하거나 충원 계획을 검토할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 예술단 이름을 직접 맞추거나 같은 기관(경기도) 자료끼리만 연결한다.
description_portal: 이 데이터는 경기도 예술단의 현원과 정원을 구분별로 정리하여 제공하는 현황 자료로, 경기도극단, 경기도무용단, 경기시나위오케스트라, 경기필하모닉오케스트라, 팝스앙상블 등 주요 예술단체별 인력 현황을 확인할 수 있습니다. 각 예술단체의 정원 대비 실제 활동 인력 규모를 비교할 수 있어 인력 충원 정도와 운영 상태를 분석하는 데 유용하며, 이를 통해 예술단체의 공연 기획 및 운영 효율성 평가, 향후 인력 충원 계획 수립, 문화예술 정책의 효과 분석 등에 중요한 참고 자료로 활용될 수 있습니다. 이 데이터는 경기도 내 공공 예술단체의 현황을 한눈에 파악할 수 있도록 제공되어 문화예술 지원 정책과 지역 예술 발전 전략 수립에 기초자료로 쓰일 수 있습니다.
