description_portal: 부천시 관내 정보 제공의 기준이 되는 공간정보 파일로, 국가지점번호 체계를 활용해 시 전역을 50m 간격의 격자(임의 보정)로 구획한 ‘도서관 임의격자데이터’입니다. 각 셀은 고유 식별자와 중심점 좌표 등 기본 속성을 갖고, 도서관 분포·접근성 분석, 서비스 권역 설정, 열지도(Heatmap)·밀도 분석 등 다양한 공간 통계에 활용할 수 있습니다. 데이터는 ESRI Shapefile 형식(cpg, dbf, prj, qix, shp, shx)으로 제공되며, prj 파일에 정의된 좌표계를 그대로 사용하면 됩니다. 국가지점번호(國家地點番號)는 국토·해양을 일정한 격자로 구획한 지점에 부여되는 번호로, 한글 2자와 아라비아 숫자 8자의 조합으로 표현됩니다. 행정경계와 정확히 일치하지 않을 수 있으므로 분석 시 경계 매칭 또는 공간조인 기준을 명확히 설정하는 것을 권장합니다.
