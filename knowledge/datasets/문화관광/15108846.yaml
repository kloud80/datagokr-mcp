description_portal: 국민체력100 동영상은 서울올림픽기념국민체육진흥공단에서 제공하는 국민체력100 동영상의 체력인증 및 측정방법, 운동처방가이드, 운동처방동영상, 근골격계운동, 생애주기별표준운동, 목적별루틴운동, 운동처방가이드 등의 정보를 제공합니다. 연령대별, 체력요인별, 운동장소별, 운동부위별, 운동단계별, 운동주차별, 운동순서별, 운동목적별 등 각 운동에 맞는 기준별 조회조건을 이용하여 국민체력100 동영상의 목록조회(검색) 정보를 제공합니다. 이 서비스는 연령, 체력 수준, 운동 목적 등에 따라 맞춤형 운동 정보를 제공함으로써 국민의 체력 증진과 건강 관리를 효과적으로 지원할 수 있습니다.
