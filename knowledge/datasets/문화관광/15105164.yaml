summary_user: 문화유산·박물관·역사·예술 등 문화정보를 다룬 수어 자료를 자원 한 건씩 담은 메타데이터로, 제목·등록일·소속 DB·주제 분류·주제어·내용·관련 장소·시간 범위·저작권·원문 링크(url) 등을 포함하며 범위는 전국·비공간이다. 청각장애인용 교육 콘텐츠나 서비스를 만드는 개발자·교육기관이 '특정 박물관이나 문화유산을 설명하는 수어 자료가 있고 어디서 볼 수 있나'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 자료명·주제어 같은 이름 매핑이나 같은 기관(한국문화정보원 계열) 데이터를 통해서만 이어 쓴다.
description_portal: 문화정보와 관련된 수어 자료를 체계적으로 제공하여 정보 접근성을 높이고자 마련된 데이터셋입니다. 자원의 명칭, 주된 책임자, 등록일, 소속 DB, 주제 분류, 핵심 주제어, 자원 크기, 내용, 관련 장소, 시간적 범위, 언어, 저작권 등 다양한 정보를 포함하고 있어 문화 관련 수어 자료의 검색과 활용이 용이합니다. 문화기관, 교육기관, 연구자, 개발자 등이 문화정보 수어 자료를 활용하여 교육 콘텐츠 개발, 연구, 서비스 개발 등에 활용할 수 있습니다. 특히 문화유산, 박물관, 역사, 예술 등 다양한 분야의 문화정보를 수어로 제공함으로써 청각장애인 등 정보 소외계층의 문화 접근권을 확대하는 데 기여합니다.
