summary_user: 전라남도 시군구별 육상경기장을 시설 한 곳당 한 행으로 담은 현황 파일로, 소유기관·관리주체, 부지·건축·연면적, 트랙 바닥재료·주로 길이·주로 수, 좌석수·수용인원, 준공연도, 건설사업비(백만원)를 담는다(파일 약 3KB 규모). 체육 행정 담당자나 대회 유치를 검토하는 분석가가 "우리 지역 어느 육상경기장이 몇 명을 수용하고 트랙이 몇 레인인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 체육시설·인구 데이터와는 시군구 이름이나 시설명을 맞춰 붙여야 한다.
description_portal: '- 전라남도 시군의 육상경기장(시설명, 소유기관, 관리주체, 면적, 수용인원 등)에 관한 데이터를 조회하실 수 있습니다.- 시군명, 시설명, 소유기관, 관리주체, 부지면적/건축면적/연면적, 트랙바닥재료, 트랙주로연장, 트랙주로수, 바닥재료, 폭/길이, 좌석수, 수용인원, 준공연도, 건설사업비 등에 관한 데이터를 제공합니다.- 전라남도에는 육상경기와 다양한 체육활동을 지원하는 시설들이 여러 곳 있습니다.- 각 시설의 이용 및 예약 방법은 해당 시군의 체육시설 관리 부서나 공식 홈페이지를 통해 확인하실 수 있습니다. 일반적으로 온라인 예약 시스템을 통해 사전 예약이 가능하며, 일부 시설은 전화 예약도 지원합니다.- 전라남도의 육상경기장과 종합운동장은 지역 주민들의 건강 증진과 체육활동을 지원하는 중요한 시설입니다. 각 시설의 이용 방법과 시설 정보를 사전에 확인하시어 원활한 이용이 되시길 바랍니다.'
