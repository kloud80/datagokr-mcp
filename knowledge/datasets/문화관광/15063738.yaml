description_portal: 전시는 미술품, 공예품, 사진, 과학 기술 자료 등 다양한 분야의 작품이나 자료를 대중에게 공개하는 행위나 공간을 말합니다. 이는 예술가와 관람객이 직접 만나는 가장 중요한 통로 중 하나입니다.개방되는 데이터는 일반 시민이 직접 전시회 정보를 검색하는 서비스가 아닙니다. 이는 개발자나 연구자가 전시 관련 애플리케이션이나 서비스를 만들 때 활용할 수 있도록 데이터를 제공하는 공공데이터 API 서비스입니다.REST API를 통해 JSON 및  XML 포맷으로 데이터를 제공합니다.전시회 제목, 전시기간, 전시장명, 유무료구분, 주최기관의 정보를 제공합니다.
