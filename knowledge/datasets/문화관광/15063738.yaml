summary_user: 부산광역시가 제공하는 전시 상세 정보 API로, 전시 한 건마다 제목, 전시 시작·종료일, 전시장 이름, 관람료, 주최·제작 기관, 출연·참여진, 관람 시간 같은 항목을 담는다. 개발자나 연구자가 '이번 달 부산에서 열리는 무료 전시는 어디서 하나' 같은 질문에 답하는 전시 안내 앱이나 서비스를 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 문화시설·공연 데이터와는 전시장 이름(place_nm)이나 기관 자체 장소 코드(place_id)를 이름·코드 매핑해서만 잇는다.
limits: KOPIS ID나 문화시설 코드 같은 공통 키가 없어 다른 데이터와 정확히 조인하기 어렵다. 범위 정보는 시도 단위 비공간으로 표시되어 있어 좌표 기반 지도 분석에는 바로 쓰기 어렵다. 갱신은 이벤트 주기로 분류되어 있으므로 상시 최신 일정이 보장되는지는 호출해서 확인해야 한다.
