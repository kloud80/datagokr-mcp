summary_user: 국가유산청이 3D 스캐닝 등으로 구축한 국가유산 3D 원형 데이터의 목록으로, 문화재번호·문화재명·건물명별로 구축 사업명과 사업연도, 생산연도, 데이터 취득 방식, 데이터·파일 형식, 폴리곤 수, 서비스 용량을 담은 전국 단위 CSV 파일(약 298KB)이다. 연구자나 콘텐츠 사업자가 "어떤 문화재 건물에 어떤 방식으로 만든 3D 데이터가 있고, 해상도(폴리곤 수)와 용량은 얼마인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 국가유산 지정·등록 목록과는 문화재번호나 문화재명을 이름·코드로 맞춰 연결해야 한다.
description_portal: 국가유산청의 ‘국가유산 3D 원형 정보자원 목록’은 국가유산의 원형적 가치를 디지털 기술로 보존하고 활용하기 위해 구축된 데이터 자원으로, 각 유산의 고유 식별번호, 명칭, 위치, 유형, 제작 시기와 같은 기본 속성 정보뿐만 아니라 3D 스캐닝을 통해 얻은 정밀 형상 데이터, 텍스처, 구조적 특성 등의 디지털 원형 자료를 포함하고 있다. 이를 통해 문화재의 외형적 특징과 재질감을 실제와 유사하게 재현할 수 있으며, 연구자들에게는 학술적 비교 분석 자료로, 국민에게는 체험형 교육 및 가상 전시 콘텐츠로 활용할 수 있는 기반을 제공한다. 또한 해당 목록은 유산 관리기관의 보존 상태 점검, 수리·복원 계획 수립에도 직접적으로 기여하며, 공공 데이터로서 민간의 문화·관광·콘텐츠 산업과 연계될 수 있어 디지털 전환 시대의 국가유산 가치 확산과 지속 가능한 활용을 위한 중요한 정보체계라 할 수 있다.
