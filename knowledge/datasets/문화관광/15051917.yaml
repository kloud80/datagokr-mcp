description_portal: 서울시립미술관 교육 정보 데이터는 서울시립미술관에서 운영하는 다양한 교육 프로그램의 내용을 체계적으로 제공하는 자료입니다. 각 교육 과정은 고유 교육번호와 교육명을 통해 구분되며, 초등학생·청소년·일반인 등 교육대상을 명시해 참여 가능 대상을 쉽게 확인할 수 있습니다. 교육장소, 시작일과 종료일, 교육시간, 교육요일 정보는 수강 일정과 동선을 계획하는 데 도움을 줍니다. 모집 시작일과 마감일, 모집정원, 수강료 정보는 신청 기간과 인원, 비용을 한눈에 파악할 수 있도록 구성되어 있습니다. 또한 교육내용과 강사명, 테마이미지, 바로가기 링크가 제공되어 프로그램의 성격과 수준, 상세 안내를 보다 깊이 이해할 수 있습니다. 조회일자는 정보의 최신성 확인에 활용되며, 이 데이터는 시민 대상 문화예술 교육 안내, 온라인 홍보, 프로그램 분석 및 정책 수립에 유용한 기초 자료로 활용될 수 있습니다.
