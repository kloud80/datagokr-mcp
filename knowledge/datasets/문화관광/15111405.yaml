summary_user: 영상물(미디어타입·제목)별 촬영지의 장소명·장소타입·설명·영업시간·휴무일·주소·좌표를 한 행씩 담은 건별 파일로, 전국 15,034행이 들어 있다. 촬영지 투어 코스를 짜는 관광 기획자나 "이 드라마는 어디서 찍었나"를 찾는 팬이 쓴다. 주소(address)와 위도·경도(coord)가 조인 키라서 지도, 주변 관광지·음식점, 행정구역 데이터와 좌표나 주소로 이어 쓴다.
description_portal: 국내외 미디어콘텐츠, 특히 넷플릭스 등 다양한 영상물의 촬영지 정보를 체계적으로 정리한 데이터입니다. 미디어 타입, 작품명, 촬영 장소명, 장소 설명, 주소, 영업시간, 휴무일 등 촬영지 관련 세부 정보를 포함하고 있어, 영상 콘텐츠 팬, 관광객, 로케이션 헌터, 미디어 산업 관계자 등이 활용하기에 적합합니다. 촬영지 투어 코스 개발, 미디어 관광 활성화, 콘텐츠 기반 지역 홍보, 영상 제작 참고 등 다양한 분야에서 활용할 수 있습니다. 이 데이터는 ‘최종작성일’ 기준으로 최신 정보가 반영되며, 이후 시설 정책이나 운영 상황에 따라 변동될 수 있습니다.
