summary_user: 국립장애인도서관 국가대체자료공유시스템(DREAM)에서 서비스하는 대체자료의 대표 서지정보를 자료 한 건당 한 행으로 담은 전국 단위 CSV 파일로, 표제·저자·출판사·출판년도로 구성된다(포털 설명 기준 약 46만 건). 시각장애인 등 이용자나 도서관 사서가 "이 책이 점자·음성 등 대체자료로 이미 만들어져 있는가"를 확인하거나, 분석가가 대체자료 제작 현황을 출판년도·출판사별로 살펴보는 데 쓴다. 실측 컬럼에 ISBN·도서관코드 같은 전역 조인 키가 없어, 다른 도서 데이터와는 표제·저자·출판사 이름을 맞춰서만 연결할 수 있다.
