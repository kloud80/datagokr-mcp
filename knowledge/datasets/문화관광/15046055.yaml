summary_user: 한국관광공사가 선정한 코리아 유니크베뉴를 장소 한 곳당 한 행으로 담은 전국 단위 파일(xlsx)로, 장소명·주소·좌표·시설유형과 함께 공항·기차역·지하철 접근성, 도심·강·바다·산 경관, 숙박·취사·케이터링·주차, 외국어 직원·동시통역, 제공 장비, 프로그램, 과거 개최 이력을 담는다. MICE 기획사나 행사 담당자가 '바다 경관이 있고 숙박·케이터링이 되며 외국어 직원이 있는 행사 장소가 어디인가'처럼 행사 개최지 후보를 고를 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 장소명·주소로 맞추거나 좌표(XMAP·YMAP)로 공간 대조해 이어 쓴다.
description_portal: 본 데이터는 한국관광공사에서 선정한 한국적인 대표성과 지역의 특색을 갖춘 장소인 코리아 유니크베뉴의 기본 정보(장소명, 주소, 위도 및 경도, 홈페이지, 시설 유형, 부대시설 및 개요)를 제공합니다. 뿐만 아니라 교통(공항 및 대중교통 접근성, 주차시설), 풍경(도심, 강, 바다, 산, 기타 경치), 숙박, 취사 가능 여부, 외국어가능직원 보유 여부, 제공 장비, 프로그램과 과거 개최 이력 정보 등 세부적인 정보를 추가적으로 제공하여 보다 구체적인 장소를 조사하거나 MICE 행사 개최 장소 후보를 선정할 때 이용할 수 있습니다.
