summary_user: 충청남도 보령시 대천해수욕장·무창포해수욕장·보령머드박물관 등 주요 관광지별 방문객 수를 연·월 단위로 집계한 시계열 표로, 관광지가 열로 나뉘고 월별 합계와 외국인 방문객(머드축제 포함) 열이 함께 들어 있다. 관광업체나 지자체 담당자가 '대천해수욕장 방문객은 몇 월에 가장 많고 머드축제 기간에 얼마나 늘어나는가' 같은 성수기·비수기 질문을 확인할 때 쓴다. 관광지점코드나 시군구코드 같은 전역 조인 키가 없어서, 다른 관광 통계와는 관광지 이름이나 보령시라는 지역명을 직접 맞춰 이어 써야 한다.
limits: 관광지가 코드 없이 이름으로만 구분되므로 다른 데이터와 자동으로 연결되지 않고, 이름을 하나씩 매핑해야 한다. 범위는 보령시 한 곳의 관광지에 한정된다.
