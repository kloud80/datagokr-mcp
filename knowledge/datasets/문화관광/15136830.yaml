status: active
summary_user: KTV 국민방송에서 방송된 정책뉴스·공공정보·문화교양 등 방송 영상을 영상 한 건 단위로 담으며, 방송일·프로그램명·분류·방송길이·조회수·대본·썸네일과 영상 링크를 포함한다. 정책 홍보 담당자나 미디어 연구자가 '특정 기간에 어떤 정책 주제 방송이 나갔고 조회수는 얼마였나'를 확인하거나 방송 아카이브를 만드는 데 쓴다. 다른 데이터셋과 공통으로 쓰는 전역 조인 키는 없고, 데이터 안에서는 콘텐츠 ID(contentId)·프로그램 ID(programId)·프로그램 분류(categoryId)로 영상과 프로그램을 묶어 보며, 외부 자료와는 제목·프로그램명 같은 이름으로만 맞춰 쓴다.
limits: 전국·비공간 데이터라 지역별 분석에는 쓸 수 없고, 다른 공공데이터와 직접 이어 줄 조인 키가 없다. 부문은 공공 체육시설로 분류돼 있으나 내용은 방송 영상 목록이라 체육시설 현황·예약 정보는 담지 않는다. 호출에는 활용신청 후 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
