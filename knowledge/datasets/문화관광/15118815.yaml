description_portal: 경상남도 거제시 관광객 이용시설업 현황에 대한 자료입니다.거제시에는 일반관광유람선업, 일반야영장, 외국인관광 도시민박업 등 관광객 이용시설업 등이 등록되어 있습니다. 상호는 각 관광객 이용시설업의 공식 명칭을 나타내며, 이는 정확한 식별 및 검색을 위한 기준이 됩니다.전화번호는 각 관광객 이용시설업의 대표 연락처로, 운영 여부 등을 사전에 확인할 때 유용합니다.소재지는 각 관광객 이용시설업이 실제 어디에 있는지를 알려주는 정보로, 도로명 주소를 기본으로 제공합니다.업종, 상호, 소재지(지번, 도로명), 연락처 정보를 확인하실 수 있습니다.
