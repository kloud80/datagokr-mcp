summary_user: 제주데이터허브가 제공하는 서귀포 새연교(새섬) 한 곳의 무장애여행 정보로, 지점별 아이디·위도·경도·해발고도와 장소 설명·이미지를 담은 건별 원천 데이터입니다. 휠체어 이용자나 보행약자가 새연교·새섬 산책로의 위치와 접근성을 미리 확인하거나, 관광약자 친화 관광지 개선 계획을 세우는 분석가가 현장 위치 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 장소 이름 매칭이나 위도·경도 좌표로 TourAPI 관광지 정보 등 다른 관광 데이터와 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 새연교(새섬) 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 새연교는 제주특별자치도 서귀포항과 무인도 새섬을 연결하는 보도교로, 테우(제주 전통 나무배) 형상을 모티브로 한 독특한 구조가 특징이다. 다리와 새섬 산책로는 휠체어 이용자 및 보행약자를 고려한 무장애 접근성을 일부 확보하고 있으며, 장애인 전용 주차장과 장애인 화장실이 마련되어 있어 접근 편의를 지원한다. 새연교를 걸으며 서귀포 앞바다와 주변 섬들, 일몰 및 야경을 감상할 수 있으며, 새섬 내 목재 데크, 산책로, 광장 등이 조성되어 있어 누구나 자연과 바다를 느끼며 여유롭게 산책을 즐길 수 있는 열린관광지이다. 관광약자 친화 관광환경 조성, 무장애 관광 인프라 확대, 관광 서비스 개선 및 정책 수립을 위한 기초자료로 활용되기에 적합하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
