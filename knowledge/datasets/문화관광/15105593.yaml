summary_user: 구리시에 있는 인터넷컴퓨터게임시설제공업체(PC방)를 업체 한 곳당 한 행으로 담은 파일로, 상호·업종명·소재지 주소와 위도·경도, 관리기관명, 데이터기준일자를 포함한다. 창업을 검토하는 사업자나 상권 분석가가 구리시 안에서 PC방이 어느 동네에 몰려 있는지, 특정 지역에 경쟁 업체가 몇 곳인지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소 문자열이나 위도·경도 좌표로 공간 매칭해 연결하며, 다른 시군구의 같은 업종 파일과는 같은 컬럼 구성을 기준으로 이어 붙인다.
description_portal: 구리시 소재 인터넷컴퓨터게임시설제공업체 현황 정보(업체명, 업종명, 소재지 주소, 주소의 위도와 경도, 데이터기준일자) 제공합니다. 제공하는 정보 항목은 상호와 업종명, 소재지 주소, 주소의 위도와 경도 등이며, 데이터 기준일자는 2025. 11. 20. 입니다. 제공하는 데이터는 게임산업등록 대장에 입력된 정보를 기준으로 합니다.인터넷컴퓨터게임시설제공업은 컴퓨터 등 필요한 기자재를 갖추고 공중이 게임물을 이용하게 하거나 부수적으로 그 밖의 정보제공물을 이용할 수 있도록 하는 영업을 말하며 소위 "PC방" 영업을 의미합니다.인터넷이 연결된 컴퓨터를 일정시간 동안 제공하고 이용자는 자유롭게 게임, 웹서핑, 기타 콘텐츠를 이용하는 방식으로 운영된다는 점에서 게임제공업과 구분됩니다.
