summary_user: 서울특별시 중구에 등록된 한옥체험업소를 업소별로 담은 인허가 원천 자료로, 관리번호, 인허가·취소일, 영업 상태(영업·폐업 등), 지번·도로명 주소, 객실 수(STROOMCNT)와 중부원점TM 좌표를 포함한다. 중구에서 한옥스테이 창업을 준비하는 예비 사업자가 현재 영업 중인 한옥체험업소가 몇 곳이고 어디에 몰려 있는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 숙박업 인허가 자료와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중구의 우리나라 고유의 형식으로 지은 한옥에 숙박 체험하기에 적합한 시설을 갖추어 관광객에게 이용을 제공하는 업소 정보입니다. 데이터는 각 등록업체에 부여된 관리번호, 현재의 운영 상태(등록, 취소 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 관광진흥 및 문화재생 관련 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민 및 관광객에게는 법적 운영기준을 충족하며 전통문화 체험 기회를 제공하는 신뢰할 수 있는 숙박시설의 위치와 문화재 관련 정보를 투명하게 확인할 수 있도록 지원합니다. * 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음'
