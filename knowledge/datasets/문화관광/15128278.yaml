description_portal: 예산 1100년 기념관은 "예산지명 1100주년"을 맞이하여 군민의 자긍심을 고취하고 부족한 공공체육 및 문화시설 인프라를 구축하고자 건립되었습니다.충청남도 예산군 예산읍 벚꽃로 214-14에 위치하고 있으며 기념관 내 수영장(1층)에서 운영하고 있는 강습 및 자유수영 프로그램에 대한 정보를 공공데이터 파일을 통해 확인하실 수 있습니다.이 데이터는 충청남도 예산군 예산 1100년 기념관 내 수영장에서 운영되는 프로그램 현황을 제공합니다.예산군민의 생활체육 활성화와 시설 이용 편의 제공을 목적으로 공개되며, 이용자는 이를 통해 수영 강좌의 종류와 시간표를 확인 할 수 있습니다.
