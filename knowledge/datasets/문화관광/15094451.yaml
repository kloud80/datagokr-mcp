summary_user: 빅카인즈 뉴스 데이터베이스에서 모은 한류 관련 기사를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV, 약 226KB)로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목이 들어 있다. 연구자나 정책 담당자가 "어느 시기에 어떤 언론사가 한류를 얼마나 자주, 어떤 키워드로 보도했는가"를 살펴볼 때 쓴다. 실측 컬럼에는 다른 데이터와 이을 공통 조인 키가 없어서, 일자나 언론사 이름, 키워드 문자열을 기준으로 다른 빅카인즈 주제별 메타데이터나 통계와 맞춰 써야 한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 한류 관련 뉴스 분석 메타정보 자료입니다. 한류는 K-팝, 드라마, 영화, 게임, 패션 등 다양한 한국 문화 콘텐츠가 전 세계적으로 인기를 얻으며 확산된 현상으로, 국가 브랜드와 문화 산업 성장에 큰 기여를 하고 있습니다. 본 자료는 국내 주요 신문과 방송에서 보도된 한류 관련 기사들을 수집·분석하여, 특정 시기별 키워드와 보도 빈도의 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 한류가 문화 산업, 외교, 경제, 사회적 인식에 어떤 영향을 미쳤는지, 그리고 글로벌 팬덤과 문화 교류가 어떻게 언론에 반영되었는지를 파악할 수 있습니다. 또한 학술 연구, 국제 문화 교류 정책 수립, 산업 전략 마련, 교육 현장 등 다양한 분야에서 활용 가능한 기초 자료를 제공하여, 한류 확산의 흐름과 의미를 심층적으로 이해하는 데 도움을 줍니다.
