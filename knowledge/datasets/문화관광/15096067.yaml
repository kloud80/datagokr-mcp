summary_user: 중국인 단체관광객을 유치하도록 지정된 전담여행사를 여행사별 한 행으로 담은 전국 단위 명단 파일로, 포털 설명상 여행사 명칭·대표자·연락처·소재지·지정일자를 수록한다. 여행업계 종사자나 지자체 관광 담당자가 '특정 여행사가 중국 단체관광 전담여행사로 지정돼 있는가, 언제 지정됐는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 관광진흥법상 여행업 등록 원장 등과는 여행사 이름이나 소재지 매칭으로만 이어 쓴다.
description_portal: 문화체육관광부가 제공하는 중국 단체관광객 유치 전담여행사 명단 데이터는 중국인 단체관광객을 유치할 수 있도록 지정된 전담여행사에 대한 정보를 수록하고 있습니다. 본 데이터에는 여행사 명칭, 대표자 성명, 연락처, 소재지, 지정일자 등 기본 현황이 포함되어 있어 관련 기관과 업계 종사자가 신뢰성 있는 정보를 확인할 수 있습니다. 이를 통해 관광객에게는 안전하고 품질 높은 여행 서비스 제공이 가능하며, 행정기관은 관리·감독과 정책 수립에 활용할 수 있습니다. 또한 관광산업의 건전한 운영과 한중 관광교류 활성화, 지역 관광산업 발전에도 기초자료로 활용됩니다.
