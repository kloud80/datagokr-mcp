summary_user: 제주 서귀포 위미동백나무군락 한 곳에 대한 무장애 관광 안내 자료로, 구분·유형·추천여부·비고 항목으로 코스 개요, 주차장·화장실 같은 편의시설, 관람료·휴무일, 포인트별 사진 등을 담는다. 휠체어 이용자나 노약자 등 교통약자가 방문 전에 "위미동백나무군락에 장애인 주차장과 이용 가능한 화장실이 있고, 동선이 접근 가능한가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 TourAPI 관광지 정보나 같은 기관의 다른 무장애 관광 파일과는 관광지 이름으로만 맞춰 이어 쓴다.
description_portal: '제주특별자치도 내 위미동백나무군락_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도_위미동백나무군락_무장애여행관광정보」로, 제주특별자치도 디지털혁신과에서 제공한 무장애(Barrier-free) 관광 안내 자료이다. 위미동백나무군락에 대한 코스 개요, 위치 및 주소, 주차장 및 화장실 등의 편의시설, 관람료 및 휴무일 등의 운영 정보, 각 포인트별 사진 이미지 자료 등이 포함되어 있다. 이 정보는 장애인, 노약자, 교통약자 등이 여행 전에 시설 접근성 및 편의성을 파악할 수 있게 함으로써, 보다 안전하고 편안한 관광체험을 지원한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
