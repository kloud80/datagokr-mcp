description_portal: '본 데이터는 서울특별시 중구 지역 내에서 음반·음악·영상물 등의 배급업 허가를 받은 업체에 관한 정보를 수록한 자료입니다. 수록 항목에는 사업자명, 대표자, 소재지, 업종 구분, 인허가일자, 허가상태, 등록번호, 관할기관 등이 포함됩니다. 해당 데이터는 「음반·비디오물 및 게임물에 관한 법률」에 따라 인허가 절차를 거친 배급업체를 대상으로 하며, 문화콘텐츠 유통 현황을 파악하고 관련 산업 지원 정책 수립을 위한 기초자료로 활용됩니다. 일반 시민은 사업체 정보를 통해 정식 등록 여부를 확인할 수 있으며, 콘텐츠 제작자나 기업은 유통 파트너 발굴 및 시장 조사 등에 본 자료를 참고할 수 있습니다. 데이터는 표준화된 구조로 제공되어 정보 활용도 및 재이용성이 높으며, 공공기관, 연구기관, 민간 기업 등 다양한 주체에서 활용이 가능합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
