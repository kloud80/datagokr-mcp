description_portal: 본 API는 한국관광공사에서 제공하는 서비스인 포토코리아(phoko.visitkorea.or.kr)에서 제공하는 사진에 대한 사진 제목, 촬영일, 촬영지, 촬영자, 키워드, 웹용 이미지 URL 등을 제공합니다. 한국의 다채로운 관광사진 10만여 장을 보유하고 있는 포토코리아의 사진들은 공공누리 1유형의 콘텐츠들로서, 자유롭게 다운로드 및 활용이 가능합니다. 모바일 앱 뿐만 아니라, 웹 서비스, 홍보물, 잡지 등 여러 매체에서 활용할 수 있으며 신규/융복합 관광 서비스를 창출할 수 있습니다.
