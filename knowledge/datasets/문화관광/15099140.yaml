description_portal: '경상남도 거창군의 공공미술프로젝트에 관한 데이터이며 주관처, 프로젝트명, 작가팀명, 사업대상지, 사업기간, 총사업비 정보를 제공합니다.○ 데이터 기준일 : 2026. 03. 05.○ Gemini의 응답공공미술(Public Art)이란 미술관이라는 폐쇄적인 공간을 벗어나, 광장, 공원, 거리 등 대중이 공유하는 열린 공간에 설치된 예술 작품을 의미합니다.과거에는 기념비적인 조형물 중심이었으나, 오늘날에는 지역 사회의 역사와 환경을 반영하고 시민이 직접 참여하여 소통하는 장소성을 강조합니다. 즉, 단순한 감상의 대상을 넘어 시민들의 일상 속에서 문화적 향유를 누리고, 도시의 경관을 개선하며 공동체 의식을 높이는 사회적 예술 활동이라 할 수 있습니다.'
