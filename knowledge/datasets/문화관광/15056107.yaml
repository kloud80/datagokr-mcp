summary_user: 경상남도에 있는 민속문화재를 한 건씩 담은 목록 파일로, 명칭·수량 및 면적·소재지 주소·관리자(단체)·지정일자를 담는다. 문화유산 연구자나 지역 여행·교육 기획자가 "경남 어느 시군에 어떤 민속문화재가 있고 누가 관리하며 언제 지정됐나"를 확인하는 데 쓴다. 국가유산청 종목코드·지정번호 같은 전역 조인 키가 없어서, 국가유산청 유산 목록이나 다른 문화재 데이터와는 명칭이나 소재지 주소를 맞춰 붙여 써야 한다.
