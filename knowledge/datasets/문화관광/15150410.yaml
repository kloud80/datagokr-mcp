summary_user: 한국정책방송원(KTV)이 만든 정책 카드뉴스를 한 건씩 담으며, 건마다 제목·내용·썸네일 주소·콘텐츠 링크·조회수·생성일·등록일이 붙는다. 정책 소식 앱이나 홈페이지 운영자가 '최근 등록된 정부 정책 카드뉴스는 무엇이고 어디로 연결되나'를 확인해 목록을 보여 주는 데 쓴다. 실측 컬럼에는 다른 데이터와 잇는 공통 조인 키가 없어, 카드뉴스 고유 ID(cardId)는 이 서비스 안에서만 식별자로 쓰고 외부 데이터와는 제목이나 등록일로 직접 맞춰야 한다.
description_portal: KTV 국민방송 카드뉴스 API는 국민이 정부 정책과 주요 생활 정보를 쉽고 빠르게 이해할 수 있도록 시각적 카드뉴스 형태로 제공되는 데이터를 외부 서비스에서 조회할 수 있게 지원하는 서비스입니다. 카드뉴스는 각 정책의 핵심 내용과 배경, 실생활 관련 정보를 이미지와 간단한 글로 구성하여 누구나 한눈에 이해할 수 있도록 제작되며, 제목, 요약, 대표 이미지, 등록일 등의 정보를 포함합니다. 이 API를 통해 국민은 공식적이고 신뢰할 수 있는 정책 소식을 언제든 최신 상태로 확인할 수 있으며, 복잡한 문서 없이 핵심 내용을 직관적으로 받아볼 수 있습니다. 또한 카드뉴스는 다양한 분야의 정책 정보를 시각적·간결하게 전달하므로, 국민 생활과 정책 이해도를 높이는 데 기여합니다.
