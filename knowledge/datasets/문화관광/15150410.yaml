services:
  - op: /cardNewsList
    name: 카드뉴스 정보 조회
    endpoint: https://apis.data.go.kr/1371037/ktvCardNews/cardNewsList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: false
        example: '10'
        desc: 한 페이지 결과 수
      - name: orderBy
        required: false
        example: regDate
        desc: "정렬 기준(등록일:regDate, 조회수:viewCnt)\t"
      - name: startDate
        required: false
        example: '20250801'
        desc: 시작일(등록일[registDate] 기준, 미 입력 시 종료일 이전 30일)
      - name: endDate
        required: false
        example: '20250925'
        desc: 종료일(등록일[registDate] 기준, 미 입력 시 오늘날짜)
      - name: title
        required: false
        example: 대통령
        desc: 제목
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
