summary_user: 광주광역시(현 전남광주통합특별시)에 등록된 게임제공업소를 업소 한 곳당 한 행으로 담은 파일로, 상호명·업종·도로명주소·데이터기준일자를 제공한다. 창업 예정자가 특정 구나 동네에 PC방·게임랜드가 얼마나 몰려 있는지 확인하거나, 분석가가 자치구별 게임제공업소 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 도로명주소를 지오코딩하거나 주소 문자열로 행정구역을 뽑아 다른 상권·인구 데이터와 맞춰 쓴다.
description_portal: 광주광역시에 등록된 게임제공업소 현황에 대한 데이터로, 상호명, 업종, 소재지도로명주소 등의 항목을 제공합니다. 주로 PC방과 게임랜드 관련 업소가 많으며 동구, 서구, 남구, 북구, 광산구에 분포되어 있습니다. 총 1210개의 게임제공업소가 있는 것으로 확인됩니다. 동구에 총 132개의 업소가 있으며, 서구에는 221개, 남구에는 127개가 있고, 북구에는 394개 마지막으로 광산구에는 336개가 있습니다. 북구에 가장 많은 게임제공업소가 있으며 그 다음으론 광산구, 서구, 동구, 남구 순으로 게임제공업소가 많이 있습니다. 게임제공업소별 상세한 주소가 나와있어서 유용한 데이터 제공이 가능합니다.
