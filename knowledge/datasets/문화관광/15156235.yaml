description_portal: 본 자료는 한국언론진흥재단이 운영하는 뉴스 데이터베이스 BIGKinds를 기반으로 수집·분석된 항공사 관련 뉴스 메타정보 자료입니다. 보도 일자, 언론사, 제목, 통합분류(1~3단계), 개체명(인물·기관·기업·지역), 키워드, 특성추출 값 등 다양한 항목을 포함하고 있으며, 이를 통해 개별 기사 단위의 구조적·정량적 분석이 가능합니다.본 데이터는 국내 주요 언론사가 보도한 국내·외 항공사 및 항공 산업 전반의 이슈를 대상으로, 어떤 항공사와 공항, 노선, 항공기, 사고·안전·서비스·경영 전략 이슈가 어느 시기에 집중적으로 보도되었는지, 그리고 주요 키워드와 보도 프레임이 어떻게 형성·변화했는지를 파악하는 데 중점을 두고 있습니다.이를 통해 언론이 항공사를 교통 인프라의 핵심 주체, 글로벌 산업 및 국가 경쟁력의 요소, 혹은 안전·사고·노동·소비자 보호 논의의 대상으로 어떻게 재현하는지를 분석할 수 있으며, 항공편 운항과 노선 전략, 항공기 도입 및 정비, 항공 사고와 위기 대응, 항공 서비스 품질, 인수·합병 및 경영 이슈, 국제 정세와 항공 수요 변화 등 다양한 맥락이 어떤 관점에서 보도되는지도 확인할 수 있습니다.아울러 본 자료는 항공·물류 산업 연구자, 교통·안전 정책 담당자, 항공사 경영·전략 전문가, 언론·커뮤니케이션 연구자, 데이터 기반 정책 분석 및 미디어 리터러시 교육자 등에게 항공사 보도의 흐름과 이슈별 프레임 변화, 언론의 산업·재난·안전 이슈 재현 방식을 이해하는 데 기초 자료로 활용될 수 있으며, 항공 산업을 둘러싼 사회적 인식과 정책·시장 환경 변화 과정을 종합적으로 분석하는 데 유용한 분석 기반을 제공합니다.
