summary_user: 한국영화의 국내 촬영지를 촬영 장소 한 곳씩 담은 건별 데이터로, 작품명·제작연도·촬영장소명·장면설명·등장인물과 시도·시군구, 지번·도로명 주소, 위도·경도를 전국 범위로 담고 CSV와 SHP 파일로 받는다. 지자체·관광기관이 '우리 지역에서 촬영된 영화와 장면은 무엇인가'를 확인하거나, 연구자가 지역별 촬영 빈도와 분포를 지도로 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 영화작품코드(KMDb 작품코드)나 작품명, 시도·시군구 이름, 좌표를 매칭해 잇는다.
description_portal: '본 데이터는 **2022년 공공데이터 기업매칭 지원사업**을 통해 한국영상자료원이 구축한 **전국 영화 로케이션 촬영 정보 데이터**로, 국내에서 제작된 영화 가운데 국내 촬영지를 대상으로 수집·정리한 공공데이터입니다. 한국영화의 촬영 장소와 제작 흐름을 지리적 관점에서 분석할 수 있도록 설계된 이 데이터는, 영화산업 연구자·로케이션 전문가·지자체·관광기관 등 다양한 분야에서 활용이 가능합니다.데이터는 **작품명, 촬영장소명, 제작년도, KMDb 영화작품코드, 주소(지번주소·도로명주소), 위도, 경도** 등의 항목으로 구성되어 있으며, 각 영화의 실제 촬영 지점을 구체적인 좌표값과 함께 제공합니다. 이를 통해 특정 영화의 촬영지를 지도 기반으로 시각화하거나, 지역별 촬영 빈도 및 분포를 통계적으로 분석할 수 있습니다.첨부된 파일은 두 가지 형태로 제공됩니다.* **CSV 포맷 데이터 파일**: 일반적인 데이터 분석 도구(예: Excel, Python, R 등)에서 바로 불러올 수 있으며, 텍스트 기반의 표 형식으로 각 레코드의 상세 정보를 제공합니다.* **SHP 포맷 지리정보 파일**: QGIS, ArcGIS 등 **지리정보시스템(GIS)** 소프트웨어를 통해 활용할 수 있으며, 지도 상에서 영화 촬영지의 실제 위치를 직관적으로 확인하거나 공간분석을 수행할 수 있습니다.※ 지번주소 및 도로명주소 중 하나라도 불명확한 경우 해당 필드는 공란으로 표시되지만, **두 주소 항목 모두 비어 있는 레코드는 존재하지 않습니다.** 즉, 모든 촬영지는 최소 1개 이상의 주소 정보가 포함되어 있습니다.※ SHP 파일은 전용 GIS 프로그램(QGIS, ArcGIS 등)을 통해서만 시각화 및 분석이 가능하며, 일반 스프레드시트 프로그램에서는 열람할 수 없습니다.'
