summary_user: 서울 구로구의 체력단련장업(헬스장) 사업장별 인허가 정보를 건별로 담으며, 인허가일자·영업상태(개설·휴업·폐업 등)·사업장명·지번/도로명 주소·좌표·시설 면적·법인명 등이 들어 있다. 구로구에서 영업 중이거나 최근 폐업한 헬스장이 어디에 몇 곳 있는지, 특정 헬스장이 합법적으로 운영 중인지를 확인하거나 헬스장 개폐업을 상권 변화 신호로 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 잇고, 좌표(X·Y)로 지도·상권 데이터와 공간 결합한다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 체력단련장업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 체력단련장업 시설의 면적, 건축물 연면적, 업태구분, 법인명 등 주요 속성이 기록된다. 또한 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 시설 운영 현황 파악에 활용된다. 행정기관은 이를 통해 지역 내 체력단련장업을 관리하며, 시민은 합법적 운영 여부를 확인할 수 있다. 데이터는 정기적으로 갱신되어 최신 행정정보를 반영하므로 정책 수립, 연구 분석, 민원 처리 등에 활용된다. 좌표정보는 지도 서비스 및 공간 분석에 연계 가능하여 행정 투명성과 정보 접근성을 높이는 기반 자료로 기능한다.
