description_portal: 이 자료는 서귀포시 관내 아직 공식 지정 문화재로 등록되지는 않았으나 문화적·역사적 가치가 인정되는 비지정 문화재들의 현황을 정리한 데이터입니다. 문화재명, 종류, 소재지, 지정대상 형태, 소유자, 지도 좌표 등의 항목이 있어, 문화 유산 보존 정책 수립, 예방적 관리(노후 방지, 훼손 점검), 주민 문화 인식 제고, 문화재 지정 가능성 평가 등에 활용할 수 있습니다. 행정기관은 이 데이터를 바탕으로 문화재 지정 후보지 탐색, 보존 우선순위 설정, 정책적·예산적 지원 필요 지역을 선정할 수 있고, 연구자 및 문화단체는 문화재 분포 및 소유구조 분석, 향토유산 조사, 공공 문화 자산 관리의 투명성 확보 등에 참고할 수 있어요. 또한 도시개발 계획·관광 계획 등과의 조화를 고려해 문화적 가치가 훼손되지 않도록 조치할 수 있는 기초자료 역할을 합니다.
