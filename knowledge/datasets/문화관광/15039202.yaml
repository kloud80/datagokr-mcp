summary_user: 서귀포시 관내에서 공식 지정되지 않은 비지정 문화재를 한 건씩 담은 목록으로, 종별·문화재명·지정대상·소재지·소유자와 위도·경도 좌표를 포함하며 CSV 파일 하나(약 2.4KB)로 제공된다. 향토유산을 조사하는 연구자나 행정 담당자가 '서귀포 어느 마을에 어떤 비지정 문화재가 있고 누가 소유하는가'를 확인하거나 지정 후보를 추리는 데 쓴다. 전역 조인 키가 없어 국가유산청 지정유산 목록과는 문화재명·소재지 이름 매칭으로만 연결하고, 위도·경도로 지도나 다른 공간 데이터에 겹쳐 쓴다.
limits: 국가유산청 종목코드·지정번호나 필지 고유번호(PNU) 같은 공통 키가 없어 다른 유산 데이터와의 연결은 이름·주소 대조에 의존한다. 범위가 서귀포시 한 곳에 한정되므로 제주시나 다른 지역 비지정 문화재는 담지 않는다.
