summary_user: 부산광역시 구·군에 소재한 국가·시 지정 문화재를 건별로 담으며, 문화재명(cultHeritNm)·종별·시대·지정일자·관리주체·주소와 위경도 좌표·주요내용을 포함한다. 시민이나 관광·교육 분야 분석가가 '우리 구에 어떤 지정 문화재가 있고 정확히 어디에 있는가'를 확인하거나 구·군별 문화재 분포를 지도로 그리는 데 쓴다. 전역 조인 키는 없어 국가유산청 유산 API 등과는 문화재명·지정번호를 맞춰 붙이거나 주소·좌표로 공간 결합해 이어 쓴다.
limits: 국가유산청 자료와 공통으로 쓰는 종목코드·지정번호 체계나 필지고유번호(PNU)가 확인되지 않아 다른 유산 데이터와 바로 조인되지 않고, 이름이나 주소로 매핑해야 한다. 범위는 부산광역시 한 곳에 한정된다.
