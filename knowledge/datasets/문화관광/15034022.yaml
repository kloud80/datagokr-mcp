description_portal: 시민들의 지역 문화재에 대한 관심을 높이고 문화적 소양을 높이기 위해 부산시 소재 문화해 현황을 개방하고 있습니다. 개방된 자료는 문화재명, 소재지, 관리주체, 지정일자, 시대, 종별, 건립주체, 건립연도, 주요내용, 관련 홈페이지, 면적, 담당자 전화번호 문화재 번호 등의 데이터가 포함되어 있습니다.중구 7, 북구 8, 사상구 10, 연제구 11, 사하구 13, 수영구 17, 강서구 19, 동구 19, 해운대구 23, 영도구 26, 부산진구 29, 동래구 45, 남구 54, 기장군 65, 서구 76, 금정구 135 등 총 557종의 문화재가 있습니다.국가 지정 문화재, 시지정 문화재 또 유형문화재, 무형문화재, 건축물, 그림, 책자 등 다양한 문화재를 통해서 부산에 소재한 문화재를 보호하고 관람하여 시민들의 문화재에 대한 관심도 높아지고 문화적 소양도 높아질 것으로 기대합니다.*기준일 2025.5.19 현재
