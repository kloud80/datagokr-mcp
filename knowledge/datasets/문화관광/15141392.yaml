summary_user: 서울 종로구 수영장업의 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 명부로, 관리번호·인허가일·취소일·영업상태·폐업일·주소·좌표·사업장명·보험가입 여부·건물 규모 등이 들어 있다. 종로구에서 지금 영업 중인 수영장이 어디이고 언제 허가받았거나 폐업했는지 확인하려는 주민이나, 지역 체육시설 분포와 개폐업 흐름을 보려는 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 지방자치단체 코드(OPNSFTEAMCODE)로만 이어 붙이며, 같은 축의 헬스·체육도장 등 다른 체육시설업 인허가나 상권 데이터와 함께 본다.
description_portal: 본 데이터는 서울특별시 종로구 내에서 운영되는 수영장업체의 인허가 현황을 집계하여 제공하는 자료입니다. 수영장업은 「체육시설의 설치·이용에 관한 법률」 및 관련 행정 규정에 따라 사업자 등록과 영업 허가를 받아야 하며, 이용자의 안전과 건강을 보장하는 역할을 담당합니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등 기본 행정 정보가 포함되어 있어 종로구 내 수영장업체의 등록 현황과 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 주민은 합법적인 시설 이용 정보를 확인할 수 있으며, 행정기관은 영업허가 관리, 시설 안전 점검, 체육정책 수립에 활용할 수 있습니다. 또한 연구자와 민간 기관은 지역 체육시설 분포와 산업 현황을 분석하는 기초자료로 활용할 수 있습니다. 본 자료는 종로구 내 안전하고 질 높은 체육시설 운영을 지원하기 위해 공개됩니다.
