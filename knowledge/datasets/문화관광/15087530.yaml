description_portal: 국외문화재 환수 현황은 국외에 유출된 한국문화재를 체계적으로 조사 연구하고 활용 홍보하기 위한 사업활동 현황을 파악할 수 있다.“국가유산청_국외문화재 환수 현황” 데이터는 해외로 유출된 한국 문화재의 환수 및 조사 현황을 체계적으로 정리한 공공데이터입니다. 이 데이터는 대한민국 문화재의 불법 반출을 방지하고, 회수된 유물에 대한 정보를 투명하게 제공하며, 환수 정책 및 홍보 활동을 지원하기 위해 활용됩니다. 주요 내용은 아래와 같습니다📌 주요 내용데이터 수록 항목문화재 명칭, 분류, 해외 유출 발생 연도, 환수 일자, 환수 건수 및 점수 등 2021년 기준 총 12건이 수록되었으며(2024년 5월 기준 최신 업데이트) 제공 방식공공데이터포털에서 CSV, JSON, XML 형식으로 무료로 다운로드 가능하며, Open API로도 제공 활용 목적문화재청과 관계 기관의 환수 정책 및 실행 현황 분석언론 및 시민을 위한 투명한 정보 제공문화재 환수 관련 연구, 교육, 홍보 자료로 활용🎯 활용 및 의의활용 분야설명정책 관리 및 분석환수 실적·추세 파악, 제도 개선 기초 자료언론·시민 감시 기능환수 현황 투명화로 여론 형성 및 공감대 확장교육·연구 콘텐츠해외 반출 사례를 통한 전문 연구 및 교육홍보 및 협력 촉진외교·국제 교류 시 환수 의지 및 성과 홍보
