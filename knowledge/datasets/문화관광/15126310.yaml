summary_user: 전라남도(전남광주통합특별시) 안의 관광농원을 농원 한 곳당 한 행으로 시군명·농원명·소재지·주요시설을 담은 CSV 파일(약 10KB)이다. 가족 나들이를 계획하는 사람이나 농촌관광 분석가가 '우리 시군에는 어떤 관광농원이 있고 어떤 시설을 갖췄나'를 확인하는 데 쓴다. 공통 조인 키가 없어 TourAPI 관광지나 다른 시설 목록과는 시군명·농원명·주소를 맞춰 이어 써야 한다.
description_portal: '- 전라남도 내 관광농원 현황에 대한 자료입니다. - 시군별 농원명, 소재지, 농원 주요시설 등에 대한 자료를 조회하실 수 있습니다.- 전라남도에는 다양한 관광농원이 조성되어 있어 자연과 농업을 체험하며 휴식을 취할 수 있는 기회를 제공합니다. 이러한 관광농원은 농업과 관광이 결합된 형태로, 농촌의 특색을 살린 체험 프로그램과 숙박 시설 등을 갖추고 있어 가족 단위 방문객들에게 인기가 높습니다.- 사전 예약 : 인기 있는 관광농원의 경우 사전 예약이 필수일 수 있으므로 방문 전에 확인하시기 바랍니다.- 계절별 프로그램 확인 : 계절에 따라 제공되는 체험 프로그램이 다를 수 있으므로 방문 전에 프로그램 일정을 확인하시기 바랍니다.'
