summary_user: 충청북도에 등록된 국가유산 수리업체를 업체 한 곳당 한 행으로 담은 명단 파일로, 업체명·업종·소재지·연락처를 기록한다(파일 크기 약 2KB의 소규모 목록). 문화재 보수나 단청·석공·조경 공사를 맡길 충북 지역 업체를 업종별로 찾으려는 소유자·지자체 담당자, 또는 도내 수리업체 분포를 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 국가유산 데이터와는 업체명이나 소재지 주소 문자열로만 맞춰 이어 써야 한다.
limits: 업체 고유번호나 등록번호 같은 공통 키가 없어 국가유산청 수리업 등록 정보 등과 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 충청북도 한 곳에 한정되어 다른 시도 업체는 포함하지 않는다.
