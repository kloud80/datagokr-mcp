summary_user: 국립부산국악원에서 열리는 국악 공연을 공연 한 건 단위로 담으며, 공연명·등록일·주제 분류와 핵심 주제어·재생시간·공연 내용·공간·시간대·언어·저작권·원문 위치(url) 같은 항목을 함께 제공한다. 관람객이나 국악 콘텐츠 제작자, 문화예술 연구자가 "국립부산국악원에서 어떤 국악 공연이 언제, 어떤 내용으로 열렸는가"를 확인하거나 공연 기록을 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했고 KOPIS 공연ID 같은 공통 키도 없어서, 다른 공연 데이터와는 공연명이나 같은 기관 기준으로만 맞춰 이을 수 있다.
description_portal: 국립부산국악원에서 개최되는 다양한 공연의 상세 정보를 한눈에 확인할 수 있도록 구성된 데이터셋입니다. 공연명, 공연일자, 공연시각, 장소, 주최 등 기본 정보는 물론, 자원의 명칭, 주된 책임자, 등록일, 기관별 주제 분류, 핵심 주제어, 재생시간, 공연 내용, 공간, 해당 시간대, 언어, 저작권, 지식정보자원 위치 등 폭넓은 항목을 포함하고 있습니다. 공연 일정 관리, 문화예술 연구, 국악 관련 콘텐츠 제작, 지역 문화행사 홍보 등 다양한 분야에서 활용할 수 있으며, 국악 공연의 체계적 기록과 문화유산 보존에도 기여합니다. 공연 정보의 체계적 제공을 통해 문화예술 접근성을 높이고, 관련 산업 및 학술 연구에 필요한 기초 자료로 활용될 수 있습니다.
