summary_user: 경상북도 시군별로 등록된 야영장을 한 행씩 담은 파일 원천 자료로, 명칭·소재지·소유주체·업종·등록일·부지면적·건축연면적과 사이트, 카라반, 글램핑 시설 수를 담는다. 캠핑 이용자가 우리 시군 근처의 글램핑 가능한 등록 야영장을 찾거나, 분석가가 시군별 야영장 분포와 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군구 이름이나 소재지 주소, 야영장 명칭을 맞춰 이어 쓴다.
limits: 등록번호·사업자번호 같은 공통 식별자가 실측 컬럼에 없어 다른 등록 원장과 정확히 이을 때는 이름·주소 매칭에 의존해야 한다. 범위는 경상북도 한 곳뿐이고 좌표 없이 주소 문자열로 위치를 담는다.
