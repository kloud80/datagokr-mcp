summary_user: 경기도 '13B 워라밸링크' 플랫폼에 올라온 워라밸 테마 콘텐츠를 글 한 건 단위로 담은 원천 목록이다. 고유번호·제목·썸네일·조회수·작성일·수정일·게시/삭제 여부와 HTML 본문(subjct_cont)이 들어 있으며, 가족친화 정책·재직자 지원제도·자가진단 안내·워라밸 트렌드를 다룬다. 정책 담당자나 분석가가 '경기도 워라밸 콘텐츠 중 어떤 주제가 조회수가 높은가'를 보거나 본문 키워드로 관심도를 분석하는 데 쓴다. 다른 데이터와 잇는 전역 조인 키가 없어 제목 같은 이름 매칭이나 같은 기관(경기도) 데이터끼리만 연결한다.
description_portal: 본 데이터는 경기도에서 운영하는 ‘13B 워라밸링크’ 플랫폼의 콘텐츠 정보를 수록한 자료로, 콘텐츠 기본정보(고유번호, 제목, 썸네일, 조회수, 작성일, 수정일 등)와 함께 HTML 형태로 구성된 상세 테마 내용을 포함하고 있습니다. 콘텐츠 주제는 일과 삶의 균형(워라밸)을 중심으로 가족친화 정책, 재직자 지원제도, 자가진단 안내, 최신 워라밸 트렌드 등을 다루며, 게시여부 및 삭제여부 등의 항목을 통해 콘텐츠 운영 현황을 파악할 수 있습니다. 콘텐츠 제목 기반의 통계 분석뿐만 아니라 본문 내용을 활용한 키워드 추출, 정책 홍보효과 측정, 사용자 관심도 분석 등의 고차원적 활용이 가능하며, 공공부문의 워라밸 콘텐츠 기획 및 효과성 평가에 유용한 자료입니다.
