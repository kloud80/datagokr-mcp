description_portal: '- 전라남도 식당 상세 데이터(식당명, 업종정보, 테이크아웃여부, 예약가능여부 등 35개 항목)- 전라남도(전남)는 풍부한 자연경관과 함께 다양한 지역 특산물을 활용한 맛집이 많아 미식 여행지로 각광받고 있습니다.- 여수 돌산 갓김치: 여수 돌산 갓을 활용한 김치로 유명한 곳으로, 신선하고 아삭한 맛이 일품입니다.- 순천만 갈대밭 근처 한정식: 순천만 갈대밭 근처에 위치한 한정식 집으로, 신선한 제철 재료를 사용한 다양한 반찬이 제공됩니다.- 광양 불고기: 광양의 대표적인 음식인 불고기를 전문으로 하는 음식점으로, 달콤하고 짭조름한 양념이 특징입니다.- 목포 홍어삼합: 목포의 대표적인 음식인 홍어삼합을 전문으로 하는 음식점으로, 홍어, 삼겹살, 무김치의 조합이 일품입니다.'
