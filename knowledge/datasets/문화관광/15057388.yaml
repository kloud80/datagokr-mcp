summary_user: 한국영상자료원이 보유한 시나리오를 작품 한 건 단위로 담은 목록 데이터로, 제목·대체제목·작가(creator)·주제 분류·키워드·분량·설명·시간적 배경·언어·권리 정보·원문 링크(url) 등을 함께 제공한다. 연구자나 창작자가 '특정 작가나 시대의 한국 영화 시나리오가 어떤 것이 남아 있고 원문은 어디서 볼 수 있는가'를 찾을 때 쓴다. 실측 컬럼에서 다른 데이터와 이어 쓸 전역 조인 키를 찾지 못해, 다른 영화·작품 데이터와는 제목·작가 이름을 맞추거나 같은 기관 자료끼리 연결해야 하며, 식별자 성격의 uci 필드도 연계에 쓸 수 있는지는 확인되지 않았다.
description_portal: 한국영상자료원이 보유한 다양한 시나리오 정보를 체계적으로 제공하여 영화, 방송, 문화 연구 및 창작 활동에 활용할 수 있도록 지원합니다. 시나리오의 제목, 작가, 장르, 제작 연도 등 주요 정보를 포함하고 있어 창작자, 연구자, 교육자 등에게 유용한 자료로 활용됩니다. 또한, 문화산업 종사자들이 작품 기획이나 콘텐츠 개발 시 참고 자료로 활용할 수 있으며, 일반 대중에게도 한국 영상문화의 흐름과 트렌드를 이해하는 데 도움이 됩니다. 문화예술 분야의 데이터 기반 정책 수립이나 학술 연구, 창작 지원 등 다양한 목적에 맞게 활용 가능합니다.
