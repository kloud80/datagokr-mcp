summary_user: 인천 중구(현 영종구 관할 포함) 관내 여행업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·업종(국내·국내외·종합여행업)·도로명 소재지·전화번호·신고일자를 담으며 포털 설명상 2025년 8월 기준 68개소 규모다. 여행자나 사업자가 영종·중구 원도심에 어떤 종합여행업체가 있는지, 언제 신고됐는지 확인하거나 지역 여행업 분포를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 붙이거나 같은 기관의 관광사업 데이터와 나란히 보는 방식으로만 이어 쓴다.
limits: 등록번호·사업자번호 같은 공통 키가 실측 컬럼에 없어 전국 관광사업 등록 원장과 정확히 연결하기 어렵다. 범위는 한 시군구 관내 업소로 한정되며, 전화번호는 개인 휴대전화일 경우 비어 있을 수 있다.
