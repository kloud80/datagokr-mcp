summary_user: 국립박물관에서 열린 전시의 도록 정보를 전시(도록) 한 건 단위로 담으며, 제목·부제·상세 설명·키워드·조회수·썸네일 이미지·규격·유료 여부·전시 기간이 들어 있고 범위는 전국·비공간이다. 연구자나 전시 기획자가 '특정 주제로 국립박물관에서 어떤 전시가 언제 열렸고 도록이 있는가'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 박물관·유물 데이터와는 전시 제목·키워드 같은 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: 국립박물관에서 개최된 다양한 전시의 도록 정보를 한눈에 확인할 수 있는 데이터셋입니다. 각 전시의 제목, 부제, 상세 설명, 부가설명 등 전시에 대한 핵심 정보를 비롯해 키워드, 조회수, 이미지(썸네일), 창작일, 규격, 유료 또는 무료 여부, 전시 기간 등 다양한 부가 정보를 포함하고 있습니다. 전시 기획자, 연구자, 문화예술 관련 종사자뿐만 아니라 일반 시민들도 박물관 전시의 내용을 쉽게 파악하고, 관심 있는 전시를 선택하거나 관련 자료를 활용하는 데 유용하게 활용할 수 있습니다. 문화유산의 이해와 교육, 전시 홍보, 연구 자료로도 폭넓게 활용 가능합니다.
