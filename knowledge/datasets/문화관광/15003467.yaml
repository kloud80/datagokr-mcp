summary_user: 전국 21개 국립공원의 탐방로를 코스·구간 단위로 담은 CSV 파일로, 코스명(한글·영문), 상세구간, 가는·오는 소요시간, 거리, 난이도, 통제 여부와 위경도 좌표, GPS 수신 품질 지표가 함께 들어 있다. 등산·트레킹 앱이나 지도 서비스를 만드는 사업자가 "이 국립공원에서 지금 통제되지 않은 쉬운 코스는 어디이고 왕복 몇 분 걸리나"를 지도 위에 보여 주는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어, 국립공원관리번호·공원사무소코드 같은 공단 내부 코드나 공원·코스 이름 매칭으로만 이어 붙인다.
description_portal: 전국 21개 국립공원의 탐방로, 고도(m), 위경도 좌표 정보 등을 CSV 포맷으로 제공하여 민간 사업자가 Naver, Daum과 같은 지도 Open API 위에 표출할 수 있도록 제공합니다.
