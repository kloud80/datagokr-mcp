summary_user: 대구광역시 북구청이 직영하는 파크골프장(검단·무태·금호 3곳)의 시설명, 지번 주소, 위도·경도, 규모, 홀수, 운영기관과 연락처를 시설 1곳당 1행으로 담은 소규모 CSV 파일이다. 북구 주민이나 생활체육 동호인이 가까운 파크골프장 위치와 홀 수, 문의할 운영기관 연락처를 찾을 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·주소로 매핑하거나 위도·경도 좌표로 지도·주변 시설 데이터와 겹쳐 쓴다.
description_portal: 대구광역시 북구 파크골프장 정보는 대구광역시 북구청 체육진흥과에서 제공하는 데이터로, 북구청에서 직영으로 관리 및 운영하는 파크골프장에 대한 내용을 제공합니다. 제공 대상 시설은 검단파크골프장, 무태파크골프장, 금호파크골프장 세 곳이며, 주요 제공 정보로는 각 파크골프장의 이름, 주소, 규모, 홀수, 운영기관, 운영기관의 연락처 등입니다.  시설 관련 문의사항 발생 시 연락할 수 있는 관리주체의 정보를 조회할 수 있습니다. 구장별 이용방법과 시간은 구장 내 안내게시문을 통해 확인할 수 있습니다.
