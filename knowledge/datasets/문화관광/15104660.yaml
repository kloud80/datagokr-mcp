description_portal: '2004~2025년도에 대한 연도별 경상남도 도립미술관 관람객 현황 정보를 제공합니다.도립미술관 관람객 현황 정보는 티켓 발권 이력을 기반으로 집계되며 티켓 발권 권종에 따라 어른, 청소년, 어린이, 무료 등으로 구분되고있습니다.무료입장객의 경우에도 0원으로 티켓을 발급하여 입장 가능하며 각종 행사 참여 등의 목적으로 입장하여 미술관을 관람하는 입장객에게도 티켓을 발권하여 입장토록 하고 있습니다. 전년도 발권 내역은 그 다음연도 최종 집계하여 갱신합니다.구분 : 어른, 청소년, 어린이, 무료'
