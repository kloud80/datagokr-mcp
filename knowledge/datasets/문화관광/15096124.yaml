status: active
summary_user: 곡성군 관내 관광지를 한 곳씩 담은 목록으로, 관광지명·유형·도로명/지번 주소·위경도·면적·공공편익시설·지정일·수용인원·주차가능 대수·관리기관 연락처 등을 관광지 단위로 제공한다. 곡성 여행을 계획하는 사람이나 지역 관광 분석가가 '곡성에서 단체로 방문할 수 있고 주차가 넉넉한 관광지는 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 관광지명·주소로 맞추거나 위경도(LTTD·LNGTD)로 공간 결합해 TourAPI 관광 콘텐츠 등과 이어 쓴다.
limits: 곡성군 한 시군구 범위만 담으며, TourAPI의 contentId 같은 공통 코드가 없어 다른 관광 데이터와 붙일 때 이름·주소 매칭이 필요하다. 관광 콘텐츠 부문에서는 TourAPI가 대표 원장이고 이 지자체 목록은 보조 자료로 분류된다. 호출에는 serviceKey가 필요하며 개발계정은 하루 5,000회로 제한된다.
