summary_user: 광주광역시 도시철도 역 인근 장소를 한 행에 한 곳씩 담은 파일로, 역명(문화노선도)·역에서의 직선거리(미터)·카테고리·위도·경도·소재지·운영시간·전화번호·SNS 정보를 포함하며 문화공간 외에 음식점·카페·헤어·네일샵 등 다양한 업종이 섞여 있다. 시민·관광객이 '이 역에서 걸어갈 만한 문화공간이나 가게는 어디인가'를 찾거나, 서비스 개발자가 역세권 위치 기반 추천·지도 시각화를 만들 때 쓴다. 전역 조인 키나 문화시설 코드가 없어 다른 데이터와는 역명이나 장소명·주소 문자열, 위도·경도 좌표로만 이어 붙인다.
description_portal: 이 데이터는 광주광역시 도시철도 역 인근의 문화공간 정보를 담은 자료입니다. 각 항목은 문화노선도(역명), 거리, 입장료정보, 카테고리, 홈페이지, 이미지, 키워드, 위도·경도, 소재지, 운영시간, 플레이스명, 전화번호, SNS 정보·명 등으로 구성됩니다. 데이터에는 음식점, 카페, 헤어·네일샵 등 다양한 업종이 포함되며, 거리 정보는 해당 역으로부터의 직선거리를 미터 단위로 제공합니다. 일부 항목은 결측치가 존재하며, 특히 ‘입장료정보’와 ‘상세정보’는 대부분 비어 있습니다. 위치 정보(위도·경도)와 주소, 운영시간, 연락처가 포함되어 있어 지도 시각화, 위치 기반 추천, 문화관광 서비스 개발 등에 활용 가능합니다. 또한 SNS 정보와 홈페이지 링크가 제공되어 실제 방문 전 온라인 평판 확인이나 사전 조사에 유용합니다.
