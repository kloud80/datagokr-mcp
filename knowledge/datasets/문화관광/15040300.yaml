summary_user: 국악방송이 매년 제작해 온 신규 국악 음원(새음원)의 역대 목록을 음원 한 곡 단위로 담은 CSV 파일로, 음반명·트랙번호·음원명·연주자·연주시간을 담는다. 국악 방송 편성자나 연구자가 '특정 연주자가 참여한 국악방송 제작 음원은 무엇이고 길이는 얼마인가'를 찾을 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID 등과 바로 연결되지 않으며, 연주자명·음반명 같은 이름 매칭으로만 다른 공연·음반 자료와 이어 쓴다.
limits: 공통 식별 코드가 없어 다른 데이터와는 이름 기준으로만 연결되므로 동명이인·표기 차이에 주의해야 한다. 명세상 연간 단위로 제작분이 추가되는 목록이며 전국·비공간 자료라 지역별 분석에는 쓰지 못한다.
