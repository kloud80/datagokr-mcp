summary_user: 제주 신흥리 방파제와 환해장성 일대 무장애 여행 코스를 지점 단위로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부를 담는다. 휠체어 이용자나 교통약자 동반 여행자가 이 해안 구간에서 어떤 동선으로 이동하고 어디서 쉬거나 전망을 볼지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 관광 데이터와는 지점 이름이나 위도·경도 좌표를 맞춰 이어 써야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_신흥리방파제와환해장성_무장애여행코스 데이터를 제공합니다.*본 데이터셋은 제주특별자치도 신흥리 방파제와 환해장성 일대를 중심으로 구성된 무장애 여행 코스 정보를 제공한다. 해당 구간은 해안 경관을 따라 이동하는 접근 가능한 산책로로서, 교통약자와 휠체어 이용자를 위한 이동 동선, 전망 지점, 휴식 공간, 편의시설 현황 등이 포함되어 있다. 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 현장 기반 요소가 반영되어 있으며, 무장애 관광환경 조성, 열린관광지 구축, 지역 관광 활성화 및 공공정책 수립 등 다양한 활용 목적에 부합하는 기초 자료로 기능한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
