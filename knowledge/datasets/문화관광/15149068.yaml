summary_user: 서울 동작구에 있는 골프연습장업 업소를 한 곳씩 담은 인허가 명부입니다. 업소별로 사업장명, 인허가·폐업 일자, 영업상태, 주소, 중부원점TM 좌표가 들어 있습니다. 동작구에서 지금 영업 중인 골프연습장이 어디에 있는지, 최근 문을 연 곳과 닫은 곳은 어디인지 알아보는 데 쓰고, 분석가는 민간 체육시설의 개업·폐업을 상권 신호로 볼 때 씁니다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으므로, 다른 데이터와는 관리번호(MGTNO)·주소·사업장명을 맞대거나 같은 기관 코드(OPNSFTEAMCODE)로 이어 씁니다.
description_portal: '서울시 동작구 골프연습장업 인허가 정보 (https://data.seoul.go.kr/dataList/OA-19596/S/1/datasetView.do) 입니다.동작구의 골프를 연습하기 위해 실내 또는 실외에 시설을 갖추어 제공하는 업소정보를 제공합니다.영업상태명, 전화번호, 도로명주소, 도로명우편번호, 사업장명, 지번주소, 문화체육업종명, 공사립구분명, 좌표정보 등을 제공합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음'
