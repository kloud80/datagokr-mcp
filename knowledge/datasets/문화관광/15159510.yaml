description_portal: 정책연구 데이터는 2014년 4월 12일부터 2024년 11월 27일까지 수행된 제주관광공사의 정책연구 관련 게시 정보를 제공합니다. 항목은 순번, 제목, 작성일, 조회수, 첨부파일명, 첨부파일주소, 내용으로 구성되어 있으며, 관광정책 수립 및 지역관광 활성화를 위한 각종 연구·분석 자료를 포함하고 있습니다. 연구 주제별 추진 이력과 정책 방향을 시계열로 확인할 수 있어 정책 참고자료 및 관광산업 분석자료로 활용 가능하며, 2024년 11월 27일 이후 정보는 제주 관광빅데이터 서비스 플랫폼을 통해 제공되어 추가 업데이트는 제공되지 않습니다.
