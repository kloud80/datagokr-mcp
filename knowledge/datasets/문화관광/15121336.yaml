summary_user: 경북관광기업지원센터에 입주했거나 비상주 협력기업으로 참여하는 관광기업을 기업 한 곳당 한 행으로 정리한 목록 파일이다. 입주연도, 기업명, 주요업종, 사업개요, 상주 여부, 홈페이지, 소재지를 담는다. 경북 지역 관광 스타트업과 협력기업을 찾는 사업자나 관광 기업 지원 정책을 짜는 분석가가 "센터에 어떤 업종의 기업이 언제 들어왔고 어디에 있나"를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어서 다른 관광사업 등록 데이터와는 기업명이나 소재지 주소를 직접 맞춰야 연결된다.
description_portal: 경상북도와 경상북도문화관광공사가 운영하는 경북관광기업지원센터는 22개 시‧군의 경북지역 관광기업 발굴 및 지원을 통해 경북 관광 활성화와 관광 일자리 창출을 목적으로 센터 입주기업 및 경북관광 협력기업을 발굴 및 육성하고자 합니다. 또한 관광산업의 혁신과 성장을 위한 핵심거점으로서 입주기업과 협력기업의 상호 협력을 통해 지역경제 활성화에 기여하고 있습니다.붙임의 파일은 기업의 입주년도, 기업명, 소재지, 주요업종, 사업개요 등을 작성해 놓았습니다. 본 데이터는 관광산업 정책 개발과 기업 지원 전략 수립에 활용됩니다.
