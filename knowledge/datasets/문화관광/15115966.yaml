description_portal: '서울특별시 중구의 반주에 맞추어 노래를 부를 수 있는 반주장치 등의 시설을 갖추어 제공하는 업소 정보입니다.데이터는 각 등록업소에 부여된 관번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화산업 분야의 문화시설 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 청소년보호 및 시설기준을 준수하며 건전한 문화시설 여가생활을 제공하는 등록업소의 위치를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
