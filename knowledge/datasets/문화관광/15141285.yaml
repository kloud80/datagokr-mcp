summary_user: 서울 금천구에 인허가된 영화배급업 사업장을 사업장 단위로 한 행씩 담은 건별 원천 데이터로, 인허가일자·취소일자, 영업상태와 상세 영업상태, 폐업·휴업 기간, 사업장명, 지번·도로명 주소, 위치 좌표(X, Y), 건물 층수·시설면적 같은 시설 정보를 포함한다. 문화산업 분석가나 창업 예정자가 '금천구에서 현재 영업 중인 영화배급업체는 어디이고 언제 인허가·폐업했는가'를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 연결한다.
description_portal: 영화배급업에 대한 인허가 현황과 관련 정보를 한눈에 파악할 수 있도록 구성된 데이터로, 인허가일자, 영업상태, 사업장명, 소재지, 전화번호 등 기본 항목과 함께 사업장별 영업상태 변화, 휴업 및 폐업 이력, 업종 구분, 시설 현황 등 세부 정보도 포함합니다. 또한 위치 좌표와 업종 세부 정보가 제공되어 지도 기반의 공간 분석이나 통계 자료 작성에 활용하기 적합합니다. 해당 자료는 영화산업 관련 정책 수립, 지역 내 문화산업 동향 분석, 신규 사업장 입지 선정, 산업 경쟁 구조 파악 등 다양한 분야에서 활용할 수 있으며, 영화 유통망 및 문화 인프라 현황을 종합적으로 이해하는 데 중요한 기초 자료로 기능합니다.
