summary_user: 2018년 1월~2019년 12월 제주도를 찾은 내국인 유동인구를 연월(base_year_month)·성별·연령대·시간대(01~24시)별로 묶은 집계 통계이며, 유동인구는 매 정각 머문 시간(분)을 60분으로 나눈 값을 합산한 것이다. 관광업계나 정책 분석가가 '팬데믹 이전 제주 내국인 방문객은 몇 월, 몇 시에, 어떤 연령대가 많았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로 다른 관광 통계와는 연월·성별·연령대 같은 이름 기준으로 맞춰 붙여야 한다.
description_portal: '이 데이터셋은 2018년 1월부터 2019년 12월까지 제주도를 방문한 내국인들의 유동인구 추이를 시간대(01시~24시), 성별, 연령대 기준으로 집계한 통계자료입니다. 유동인구는 “해당 시간 정각에 머문 시간(분)/60분” 기준으로 산출한 값을 바탕으로 연월별 합계를 포함하고 있어, 월별 제주 방문 내국인 규모와 시간대·연령대별 이용 패턴을 분석할 수 있습니다. 제공기관은 제주특별자치도청이며, 파일 형식은 CSV로 누구나 무료로 다운로드 가능합니다. 이 자료는 제주 지역 관광 수요 분석, 유동인구 기반 관광객 트렌드 파악, 관광 인프라 계획, 지역 상권 또는 서비스 공급 전략 수립, 관광정책 평가 등에 활용될 수 있습니다. 다만 데이터는 2018~2019년 기준으로 작성되었으며, 이후 시점의 방문객 변화나 외부충격(예: 팬데믹) 이후 유동인구 변화는 반영되어 있지 않을 수 있다는 점에 유의해야 합니다.'
