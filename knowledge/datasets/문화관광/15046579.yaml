description_portal: 해당 데이터는 서울시 통계정보시스템에서 제공하는 미술관 현황에 대한 통계정보 입니다. 서울특별시 자치구별 미술관 현황(국립공립, 대학, 사립)을 제공합니다. 데이터는 특정 자치구의 문화 인프라 수준을 파악하고, 국립·공립·대학·사립 등 운영 주체별 분포를 비교 분석하는 데 활용할 수 있습니다. 특히 합계와 소계 항목을 통해 서울 전체 현황과 구별 분포를 동시에 확인할 수 있으며, 문화 정책 수립이나 지역 균형 발전 연구에도 참고 자료로 유용합니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
