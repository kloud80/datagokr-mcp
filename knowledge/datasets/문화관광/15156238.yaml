description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 보이스피싱(Voice Phishing) 관련 뉴스 메타정보 자료입니다. 포함 항목에는 기사 주소, 보도 일자, 언론사, 제목, 통합분류(1~3단계), 개체명(인물·지역·기관·기업), 키워드, 특성추출 값, 본문 내용 등이 제공되며, 이를 통해 개별 기사에 대한 구조적·정량적 분석이 가능합니다.본 자료는 국내 주요 언론사의 보이스피싱, 전화금융사기, AI 음성 사기 등 신종 금융범죄 관련 보도를 대상으로, 어떤 범죄 수법·피해·예방 정책 이슈가 어느 시기에 집중적으로 보도되었는지, 주요 키워드와 보도 프레임이 어떻게 형성되었는지를 파악하는 데 중점을 두고 있습니다. 이를 통해 언론이 보이스피싱 조직의 범죄 수법, AI·딥페이크 기반 신종 사기, 금융기관의 대응 전략, 경찰·정부의 단속 및 예방 정책, 피해자 보호 체계, 고령층·취약계층 피해 증가 등 다양한 이슈를 어떤 관점에서 재현하는지 분석할 수 있습니다. 또한 이러한 보도 경향이 국민 불안 심리, 금융 소비자 행동, 정책 대응 강화 등 사회적 논의에 어떤 영향을 미쳤는지도 추적하는 데 유용합니다.아울러 이 자료는 범죄학 연구자, 금융보안 전문가, 경찰·정부 정책 담당자, 금융기관 실무자, 언론·커뮤니케이션 연구자 등에게 보이스피싱 보도의 흐름, 이슈별 프레임 변화, 언론의 금융범죄·안전 이슈 재현 방식을 이해하는 기초 자료로 활용될 수 있습니다.
