summary_user: 빅카인즈(BIGKinds)에서 모은 보이스피싱·전화금융사기 관련 뉴스를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV 약 25MB)로, 보도 일자·언론사·제목·통합분류 1~3단계·인물/지역/기업·기관 개체명·키워드·특성추출 값을 담는다. 범죄학·금융보안 연구자나 정책 담당자가 "AI 음성·딥페이크 사기 같은 신종 수법 보도가 언제 늘었고 어떤 키워드로 다뤄졌나"를 시기별·언론사별로 집계하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자나 지역·기관 개체명 같은 이름 매칭으로만 이어 쓴다.
limits: 기사 메타정보이므로 실제 보이스피싱 발생·피해 건수나 금액을 알려주지 않고, 보도량 추이로만 읽어야 한다. 표준 코드 형태의 조인 키가 없어 통계·행정 데이터와 연결할 때 지역·기관 이름을 직접 맞춰야 한다.
