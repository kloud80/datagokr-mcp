description_portal: '문화재청 동물치료소 현황은 전국의 동물병원, 관리단체 또는 축산관련기관, 야생동물구조치료센터를 지역별로 구성된 현황이다.“국가유산청_동물치료소 현황” 데이터는 국가유산청 산하 또는 관련 기관에서 운영 중인 동물치료소의 현황을 정리한 자료입니다. 이 데이터는 동물 보호와 관리, 문화재 주변 동물 관리 등을 위해 활용됩니다.주요 내용대상: 국가유산청 관련 동물치료소 및 관리 시설항목:치료소 명칭위치 및 주소운영 주체 및 연락처치료 가능 동물 종류주요 진료 및 치료 서비스 내용시설 규모 및 인력 현황목적:문화재 및 주변 지역 동물 보호 관리동물 복지 증진 및 치료 지원관리 체계 구축 및 현황 파악활용 분야동물 치료 및 복지 정책 수립문화재 주변 생태계 관리 및 보호연구 및 행정 자료 활용대국민 안내 및 서비스 홍보'
