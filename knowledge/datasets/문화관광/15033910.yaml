description_portal: '남해군 내 이순신바다공원 이용 현황을 나타내는 공공데이터로, 구분(연도), 이순신바다공원 입장객수, 이순신영상관 입장객수, 비고 등의 항목으로 구성되어 있습니다.○ 구분 : 연말 기준 기준일자를 표시하고 있으며, 각 연도별 데이터를 연도-12-31 형식으로 표기합니다.○ 이순신바다공원 입장객수 : 남해군 이순신바다공원에 방문한 연간 누적 입장객 수를 명시하고 있으며, 일부 연도(2019~2020년)는 집계되지 않았습니다.○ 이순신영상관 입장객수 : 이순신바다공원 내에 위치한 이순신영상관을 방문한 연간 누적 입장객 수를 명시하고 있습니다.○ 비고 : 각 연도별 특이사항을 기재한 항목으로, 예를 들어 입장료 무료 조치(2018년 11월), 무인계수기 설치(2022년 5월) 등이 포함되어 있습니다.이 데이터는 남해군 관광지별 방문객 추이 분석, 시설 운영 효과 평가, 계절별·연도별 관광 수요 예측, 지역경제 활성화 방안 수립 등에 유용하게 활용될 수 있습니다'
