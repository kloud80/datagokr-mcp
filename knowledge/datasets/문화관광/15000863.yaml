summary_user: 대전광역시가 위생·서비스 수준이 우수하다고 지정한 모범음식점을 음식점 한 곳당 한 건으로 담으며, 상호·우편번호·주소·전화·대표음식·영업시간·휴무 안내·소개글·위경도 좌표가 들어 있다. 대전을 찾은 여행객이나 시민이 '이 동네에서 믿고 갈 만한 모범음식점이 어디이고 대표 메뉴와 영업시간은 무엇인가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 음식점 이름·주소로 매칭하거나 위경도 좌표(mapLat·mapLot)로 지도·주변 관광지와 공간 결합해 잇는다.
limits: TourAPI의 contentId나 지역코드 같은 공통 키가 없어 TourAPI 음식 콘텐츠나 인허가 데이터와는 이름·주소 매칭에 의존해야 한다. 범위는 대전광역시 한 곳뿐이며, 호출에는 활용신청 후 발급받은 serviceKey가 필요하다(개발계정 일 10,000회).
