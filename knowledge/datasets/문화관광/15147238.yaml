summary_user: 서울특별시 동작구의 인쇄사 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 인허가일자·취소일자, 영업상태(정상·휴업·폐업 등), 휴업 기간, 소재지 지번·도로명 주소, 사업장명, 문화체육업종명, 시설 면적·층수 등을 포함한다. 동작구에서 지금 영업 중인 인쇄업체가 어디에 몇 곳 있는지, 언제 인허가를 받고 언제 폐업했는지 확인하려는 사업자나 지역 상권 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 인쇄사 인허가 정보 데이터는 인쇄업과 관련된 사업장의 운영 현황과 인허가 상태를 보여줍니다.데이터에는 영업상태명이 포함되어 정상, 휴업, 폐업 등 사업 운영 상황을 확인할 수 있습니다.인허가일자는 사업장이 정식으로 영업을 시작한 날짜를 나타냅니다.데이터갱신일자는 해당 인허가 정보가 마지막으로 갱신된 시점을 보여줍니다.문화체육업종명 항목은 인쇄사와 관련된 업종명을 기록하여 분류와 관리에 활용됩니다.이 데이터는 사업장의 영업 상태, 업종 구분, 인허가 시점을 종합적으로 파악할 수 있는 기초 자료입니다.
