summary_user: 국립항공박물관이 운영한 교육 프로그램을 건별로 정리한 소규모 CSV 파일(약 3.7KB)로, 교육명·대상·시작/종료일자·회차당 인원·총교육인원·신청방법·내용을 담는다. 항공 교육을 기획하는 교사나 연구자가 "이 박물관은 어떤 대상에게 어떤 항공 교육을 얼마나 운영했나"를 확인할 때 쓴다. 실측 컬럼에 시설코드 같은 전역 조인 키가 없어 다른 문화시설 데이터와는 기관명으로만 수동 연결해야 한다.
