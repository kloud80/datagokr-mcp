description_portal: '1. 주요 데이터 구성 항목본 데이터셋은 이용자가 교육 현황을 다각도에서 분석할 수 있도록 다음과 같은 상세 정보를 포함하고 있습니다.- 프로그램 정보: 교육 명칭, 교육 과정에 대한 간단한 설명- 운영 일정 및 대상: 교육 대상(연령, 계층 등), 시작 및 종료 일자, 총 운영 회차- 이용 안내: 교육 신청 방법(사전 예약, 현장 접수 등)- 성과 데이터: 연말 기준으로 집계된 최종 교육 수료 및 참여 인원 통계2. 데이터 구축 및 활용 목적본 데이터는 단순한 기록 보존을 넘어 다음과 같은 목적으로 구축되었습니다.- 운영의 투명성 및 효율성 제고: 박물관 교육 운영 현황을 정기적으로 파악하여 교육 서비스의 질적 향상을 도모합니다.- 대국민 알권리 충족: 공공기관이 운영하는 교육 정보를 투명하게 공개하여 국민의 정보 접근성을 높입니다.- 교육 콘텐츠의 확산: 학계 및 교육 관련 종사자들이 항공 교육 트렌드를 분석하고, 새로운 교육 콘텐츠 개발 및 연구에 활용할 수 있는 기초 자료를 제공합니다.3. 상세 정보 확인 및 문의본 데이터에 포함된 프로그램 외에 현재 진행 중인 교육이나 최신 소식은 아래의 경로를 통해 가장 빠르게 확인하실 수 있습니다.국립항공박물관 공식 누리집: www.aviation.or.kr확인 방법: 누리집 접속 후 상단 "교육" 메뉴 클릭'
