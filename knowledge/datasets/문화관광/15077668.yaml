summary_user: 경기도 안의 자연공원·산림·생태공원·호수·산 같은 자연관광지를 한 곳당 한 행으로 담은 시도 단위 현황 목록이며, 관광지명, 관할 시군명, 소재 주소, 전화번호, 기준일자, WGS84 위도·경도를 담는다. 경기도에서 주말에 갈 만한 숲이나 호수가 우리 시군 근처 어디에 있는지 찾는 시민, 그리고 생태관광 동선이나 위치 기반 관광 서비스를 짜는 분석가·사업자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명(sigun_nm)이나 관광지명을 이름으로 맞추고, 위도·경도로 공간 결합을 해서 잇는다.
description_portal: 이 데이터는 경기도 내 자연환경을 기반으로 한 주요 자연관광지 정보를 포함하고 있으며, 각 관광지의 명칭(관광정보명), 관할 시군명, 상세 주소(소재주소), 전화번호, 기준일자, 그리고 WGS84 좌표계 기반의 위도 및 경도 정보를 제공합니다. 자연공원, 산림, 생태공원, 호수, 산 등 자연환경을 중심으로 관광이 이루어지는 장소들이 수록되어 있어, 자연휴양지 정보 제공, 생태관광 정책 수립, 환경교육 콘텐츠 개발 등 다양한 분야에 활용될 수 있습니다. 또한 위치 기반 관광정보 서비스 구축과 지역자원 활용 전략 수립에도 유용한 데이터입니다.
