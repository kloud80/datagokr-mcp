summary_user: 빅카인즈(BIGKinds)에서 모은 초고령 사회·고령화·인구 구조 변화 관련 뉴스를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV, 약 30MB)로, 보도 일자·언론사·제목·통합분류 1~3단계·인물·지역·기관 개체명·키워드·특성추출 값을 포함한다. 언론·커뮤니케이션 연구자나 고령화·복지 정책 담당자가 '노인 돌봄·연금·지방 소멸 같은 의제가 어느 시기에 어떤 키워드로 집중 보도됐는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키는 없으므로, 일자 기준 시계열 결합이나 지역 개체명·언론사 이름을 매핑해 다른 통계·빅카인즈 주제별 메타데이터와 이어 쓴다.
limits: 공통 조인 키가 없어 행정구역 코드나 기관 코드로 바로 결합할 수 없고, 지역 개체명은 텍스트라 이름 매핑이 필요하다. 범위는 전국 단위의 비공간 자료여서 지도 분석에는 별도 지역 매핑이 필요하다.
