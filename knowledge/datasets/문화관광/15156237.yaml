description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 초고령 사회 관련 뉴스 메타정보 자료입니다. 포함 항목에는 기사 주소, 보도 일자, 언론사, 제목, 통합분류(1~3단계), 개체명(인물·지역·기관·기업), 키워드, 특성추출 값, 본문 내용 등이 제공되며, 이를 통해 개별 기사에 대한 구조적·정량적 분석이 가능합니다.본 자료는 국내 주요 언론사의 초고령 사회, 고령화, 인구 구조 변화 관련 보도를 대상으로, 어떤 사회·복지·의료·정책 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 프레임이 어떻게 형성되었는지를 파악하는 데 중점을 두고 있습니다. 이를 통해 언론이 노인 돌봄, 지역 복지 서비스, 고령 인구 증가에 따른 의료·요양 수요 확대, 일자리·연금 제도 논쟁, 지방 소멸 위험, 정부 및 지자체의 고령사회 대응 정책 등 다양한 의제를 어떤 관점에서 재현하는지 확인할 수 있으며, 이러한 보도 경향이 여론 형성, 정책 수립, 지역사회 대응 전략 등에 어떤 영향을 미치는지 추적하는 데도 유용합니다.아울러 이 자료는 사회복지 연구자, 고령화·인구정책 전문가, 보건의료 관계자, 지방정부 정책 담당자, 언론·커뮤니케이션 연구자 등에게 초고령 사회 보도의 흐름, 이슈별 프레임 변화, 언론의 인구·복지·의료 정책 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
