summary_user: 독립기념관이 보관한 황성신문(1898-09-05~1910-09-14 발행분)의 이미지 자료 목록을 건별로 담은 파일로, 관리번호·발행일·등록일·내용과 IDP·UCI 코드가 함께 들어 있습니다. 한국 근대사 연구자나 교사가 '을사늑약 무렵 황성신문은 어떤 기사를 실었나'처럼 특정 날짜·시기의 지면을 찾을 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않았고, 발행일이나 UCI 코드 같은 식별자를 기준으로 이름·코드를 맞춰 독립기념관의 다른 신문·아카이브 자료와 이어 쓴다.
description_portal: 독립기념관에서 보관하고 있는 황성신문에 대한 이미지 정보로 1898-09-05 ~ 1910-09-14 까지의 자료이다.황성신문(皇城新聞)은 남궁억, 나수연 등이 중심이 되어 1898년(광무(光武) 2년) 9월 5일 《대한황성신문》의 판권을 인수받아 창간한 일간 신문이자 민간 자본 신문이다.주필로는 유근, 박은식, 장지연, 신채호 등이 활동하였다. 국한문혼용체가 쓰였으며, 애국적 논조로 일관했다. 1905년 을사늑약에 대한 장지연의 항일 사설 〈시일야방성대곡〉 기사로 인해 정간당했고, 다시 1906년 복간되었다. 원래는 주2회 2면으로 발행하였지만 광무 3년 11월 23일부터 4단 4면제로 바뀌었다. 황성신문이 발행된 13년간 평균 발행 부수는 3000부 가량이었다고 한다1910년 일제강점기 경술국치 직후에 신문제호가 강제로 '한성신문(漢城新聞)'으로 바뀌었으며, 9월 14일 제3470호를 끝으로 종간되었다.
