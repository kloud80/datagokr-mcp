summary_user: '전북특별자치도에 등록된 박물관을 한 행에 한 곳씩 담은 목록으로, 박물관명·주소·연락처와 설립 주체 구분(공립·사립·대학), 등록일을 담는다(CSV 약 2KB 규모의 소량 파일). 도민·관광객이 도내 어느 지역에 어떤 박물관이 있는지 찾거나, 분석가가 시군별 공립·사립 박물관 분포와 등록 시기를 살피는 데 쓴다. 전역 조인 키나 시설코드가 없어 다른 문화시설 데이터(예: 문화기반시설총람)와는 박물관명·주소를 맞춰 이어야 한다.'
