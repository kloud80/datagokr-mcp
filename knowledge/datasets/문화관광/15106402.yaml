description_portal: '"(주)강원랜드_하이원포인트 사용현황"은 하이원포인트의 지역별·업종별 사용 현황을 제공하는 자료로, 사용일자, 업종, 지역별 사용건수(고한읍, 사북읍, 정선군, 태백시, 영월군, 삼척시)와 총건수, 총사용금액으로 구성되어 있습니다. 하이원포인트는 (주)강원랜드 카지노를 이용할 때 적립되며, 고객은 이를 가맹계약이 체결된 외부 가맹점에서 사용할 수 있습니다. 본 데이터는 하이원포인트의 실제 사용 지역과 업종별 이용 분포를 통해 지역 내 소비 흐름과 가맹점 이용 현황을 파악할 수 있도록 구성되었습니다. 또한 포인트 사용이 지역경제에 미치는 파급 효과를 분석하고, 가맹점 운영 및 제휴 정책 수립 등 지역 상생 기반 조성을 위한 참고자료로 활용할 수 있습니다.'
