summary_user: 경정 경주에 쓰이는 보트별 성적 기록을 보트번호 단위로 담은 집계 데이터로, 기준연도별 출주횟수, 1·2·3착 횟수, 평균착순, 최고 기록 등을 포함한다. 경정 팬이나 분석가가 특정 보트의 최근 성적이 어떤지, 어느 보트의 입상 빈도가 높은지를 비교할 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 같은 기관의 경정 선수·모터 정보와는 보트번호나 기준연도를 이름으로 맞춰 연결해야 한다.
description_portal: 서울올림픽기념국민체육진흥공단 경륜경정총괄본부에서 제공하는 경정보트정보는 경주별 보트번호, 출주횟수, 1착, 2착, 3착 횟수, 평균착순점, 최고타임 등 다양한 데이터를 포함합니다. 경정보트는 국산제품으로 고강도, 경량화를 통해 박진감 있고 흥미로운 경주를 위해 최적화하였습니다. 보트는 선수와 모터와 함께 경기 성적에 큰 영향을 미치는 핵심 요소로, 각 보트의 성능과 기록을 분석하는 데 중요한 자료로 활용됩니다. 이 정보는 선수와 관계자들이 전략을 세우고, 팬들이 경주를 이해하는 데 도움을 주는 신뢰할 만한 데이터로 제공됩니다.
