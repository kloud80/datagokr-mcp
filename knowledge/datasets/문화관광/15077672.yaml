summary_user: 경기관광공사가 선정한 경기도 명소를 한 곳씩 담은 목록으로, 시군명·명소명·전화번호·입장료 같은 부가정보와 정제된 도로명·지번 주소, 우편번호, 위경도를 포함한다. 여행객이나 관광 홍보 담당자가 '우리 시군에 있는 경기명소는 어디이고 입장료는 얼마인가'를 확인하거나 지도에 명소 위치를 표시할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군명이나 명소명을 이름으로 맞추거나 위경도(refine_wgs84_lat·logt)로 공간 매칭해 잇는다.
description_portal: 이 데이터는경기관광공사가 선정한 "경기명소"에 관한 정보를 제공하며, 시군별로 분류된 주요 관광지의 명칭, 주소, 연락처, 입장료 정보 등 실질적인 이용 편의를 위한 정보를 포함하고 있습니다. 주요 항목은 시군명, 명소명, 전화번호, 부가정보(입장료 등), 데이터기준일자, 정제도로명주소, 정제지번주소, 정제우편번호, 정제WGS84 위도 및 경도입니다. 이 데이터는 여행 계획 수립, 관광 홍보, 문화자원 위치 시각화, 스마트관광 정보시스템 구축 등의 목적으로 활용될 수 있으며, 지역경제 활성화를 위한 기초자료로도 사용됩니다.
