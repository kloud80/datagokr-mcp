description_portal: 세종특별자치시시설관리공단은 시민과 데이터 이용자의 파크골프장 이용 편의를 위해 공단에서 운영·관리하는 파크골프장 정보를 공공데이터로 제공합니다.본 데이터는 공단에서 관리하는 파크골프장 6개소를 대상으로 하며, 다음과 같은 정보를 포함합니다.■ 제공 내용1. 파크골프장명- 공단에서 운영·관리하는 파크골프장의 명칭2. 위치 및 시설정보- 소재지 도로명주소 및 지번주소- 위도·경도(WGS84)- 홀수, 코스수 및 면적- 편의·부대시설3. 운영정보- 전화번호 및 운영기관명- 운영시간 및 휴무일- 이용요금4. 예약정보- 예약방식- 예약처 URL- 예약 문의 전화번호- 실시간 잔여·예약현황- 예약 가능 시간 슬롯■ 활용 예시- 사용자의 현재 위치를 기준으로 가까운 파크골프장을 검색하거나 지도에 표시할 때- 홀수, 코스수, 면적 등을 기준으로 시설 규모를 비교할 때- 운영시간, 휴무일 및 이용요금을 확인하여 방문계획을 수립할 때- 예약처 URL이나 문의전화번호를 활용하여 예약 안내 서비스를 제공할 때- 민간 앱이나 웹서비스에서 세종시 파크골프장 정보를 제공할 때시민이 파크골프장 위치와 운영·예약정보를 편리하게 확인하고, 민간에서도 시설 안내 및 예약 연계 서비스에 활용할 수 있도록 제공하는 데이터입니다.※ 실시간 잔여·예약정보를 별도로 보유·관리하지 않는 시설은 해당 항목을 ‘해당없음’으로 표기하였습니다.
