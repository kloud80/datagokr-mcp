summary_user: 수원시에 소재한 공연·예술단체(한국예총·민예총 산하 국악·무용·연극·음악 협회 등)의 단체명, 지부명, 도로명·지번 주소, 대표명, 기준일자를 단체 한 곳당 한 행으로 담은 소규모 CSV 파일(약 1KB)이다. 수원 시민이 "우리 동네에서 활동하는 연극·무용·전통예술 단체는 어디이고 연락처 주소는 어디인가"를 확인하는 데 쓴다. 공통 조인 키가 없어 KOPIS 공연ID·공연장ID 등과 바로 연결되지 않으며, 단체명이나 주소를 기준으로 이름 매칭하거나 주소를 지오코딩해 다른 문화시설 데이터와 맞춰 써야 한다.
description_portal: 경기도 수원시에 소재하고 있는 예술단체의 단체명, 지부명, 주소, 대표명 등을 제공합니다. (한국예총, 국악협회, 무용협회, 문인협회, 미술협회, 사진협회, 연극협회, 연예예술인협회,  음악협회, 민예총 등)우리 지역에 어떤 공연예술단체가 활동하는지 쉽게 확인할 수 있어 관심 있는 장르(연극, 무용, 전통예술 등)의 단체를 바로 찾을 수 있습니다. 특정 단체를 응원하거나 후원하고 싶은 시민이 활용 할 수 있습니다.  공연예술단체를 더 가깝게 접하고 참여 소통 기회를 넓히며 지역 문화예술의 신뢰와 다양성을 체감할 수 있습니다.
