summary_user: 2020년 이후 전국 테마파크(유원시설)의 유기기구별 안전검사(안전성검사·확인검사) 결과를 검사 건 단위로 담은 CSV 파일로, 업체·영업소, 대표 기구명과 공원 내 호칭, 승용물 대수, 검사결과, 검사완료일, 검사기관을 포함한다. 놀이공원 이용객이나 안전 분석가가 '특정 테마파크의 이 놀이기구가 최근 안전검사를 통과했는지, 언제 어느 기관이 검사했는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(사업자번호·등록번호 등)가 없어 관광사업 등록 원장 등 다른 데이터와는 업체명·영업소명 이름 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 2020년 이후 진행된 테마파크(유원시설)의 테마파크기구(유기기구) 보유현황(종류, 수량)과 안전검사(안전성검사, 확인검사)결과 데이터입니다. 검사 종류, 검사 분야, 업체명, 영업소명, 대표유기기구명, 승용물대수, 검사결과, 검사완료일, 검사기관 등의 정보를 포함하고 있습니다. CSV파일로 제공되며 가변문자형 데이터입니다. 데이터파일 업데이트 일자 이후의 내용은 포함하고 있지 않습니다. 테마파크 안전정보망 홈페이지에서도 같은 내용을 열람할 수 있습니다.
