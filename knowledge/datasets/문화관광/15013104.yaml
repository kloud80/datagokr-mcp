summary_user: 전국 지역 문화축제를 축제 한 건씩 담은 원천 표준데이터로, 축제명·개최장소·시작/종료일·주관·주최기관·주소·좌표를 싣고 검증 수신 기준 1,321행이다. 주말·계절 나들이를 계획하는 국민이나 지역 관광 분석가가 어느 지역에서 언제 어떤 축제가 열리는지 찾을 때 쓴다. 도로명주소·지번주소·홈페이지주소(address)와 위도·경도(coord)가 조인 키라서 지도·주소 기반 데이터나 TourAPI 행사 정보와 이어 쓰며, 중복 행사는 같은 데이터로 보고 정리한 뒤 남는 것을 본다.
