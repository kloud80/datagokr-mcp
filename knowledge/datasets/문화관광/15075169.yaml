description_portal: 이 데이터는 제주올레길 10코스 의 휠체어 접근 가능 구간에 대한 위치(위도·경도), 경로 정보, 접근성 여부, 보행로 상태, 편의시설 정보 등을 체계적으로 정리한 공공데이터입니다. 이 코스는 해안가와 산책로, 마을길을 포함하며 평탄하거나 완경사 구간이 많아 휠체어나 유모차 사용자가 이용하기에 적합하도록 일부 동선이 조정되고 안내 표식 및 보조시설이 마련되어 있습니다. 따라서 이 데이터는 장애인, 고령자, 유아 동반자 등 이동 약자도 포함한 누구나가 안전하게 제주를 여행할 수 있도록 무장애 여행 경로 설계, 관광정책 수립, 여행 안내 자료 제작 등에 활용될 수 있으며, CSV 형식으로 무료 제공됩니다.
