summary_user: 제주관광공사가 운영하는 관광정보플랫폼 비짓제주에서 일정 기간마다 선정한 인기검색어를 언어별로 단어·정렬순서·기존순위·등록일시와 함께 담은 소규모 집계 파일(csv 약 3KB)이다. 제주 관광 마케팅 담당자나 분석가가 "비짓제주 이용자들이 요즘 어떤 관광지나 키워드를 많이 찾는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 목록 등과는 검색어 단어를 관광지 이름에 직접 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 인기검색어 내역입니다.- 해당 데이터는 비짓제주 내부 시스템에서 검색어 내역을 바탕으로 일정 기간에 한 번씩 인기검색어를 선정하여 생성합니다.- 개방데이터 항목은 일련번호, 언어, 정렬순서, 단어, 생성일, 기존순위이며 전체 데이터 수는 88건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 이용자 검색 트렌드 및 관심사 파악, 인기 관광지 및 콘텐츠 발굴, 맞춤형 추천 서비스 및 마케팅 전략 수립, 플랫폼 내 검색 기능 개선, 관광객 만족도 및 이용 편의성 향상 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
