summary_user: 서울 강북구에서 인터넷컴퓨터게임시설제공업과 다른 영업을 한 장소에서 함께 하는 복합유통게임제공업소의 인허가 내역을 업소 단위로 담는다. 인허가일자, 영업·휴업·폐업 상태, 주소, 면적, 중부원점TM 좌표(EPSG:5174)와 시설 관련 항목이 들어 있다. 동네 PC방 겸업 업소가 지금 영업 중인지, 언제 문을 열고 닫았는지 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 개방자치단체코드·관리번호·주소·사업장명 같은 이름이나 기관 코드로 맞춰 잇는다.
description_portal: '서울시 강북구 복합유통게임제공업 인허가 정보 : 강북구의 인터넷컴퓨터게임시설제공업 또는 다른 영업을 동일 장소에서 함께 영업하는 업소정보* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.서울특별시 강북구 복합유통게임제공업 인허가 정보 데이터는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일자, 휴업종료일자, 재개업일자, 전화번호, 소재지면적, 소재지우편번호, 지번주소, 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신구분, 데이터갱신일자, 업태구분명, 좌표정보(X), 좌표정보(Y), 문화체육업종명 등으로 구성되어 있습니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
