summary_user: 부산광역시 북구 관내 공연장을 한 곳씩 담은 목록 파일로, 공연장 이름, 지번·도로명 주소, 전화번호, 객석 수, 이용 시간을 담는다(파일 크기 507바이트의 소규모 CSV). 주민이나 지역 문화정책 담당자가 '북구에 객석 몇 석 규모의 공연장이 어디에 있고 언제 이용할 수 있나'를 확인하는 데 쓴다. 공연장ID 같은 전역 조인 키가 없어 KOPIS 공연장 정보 등 다른 데이터와는 공연장 이름이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 부산광역시 북구 관내에 위치한 공연장 현황을 제공하는 공공데이터입니다. 공연장 명칭, 소재지(지번 및 도로명), 객석 수, 이용 시간 등의 항목을 포함하고 있어 지역 내 공연장 분포와 운영 실태를 체계적으로 파악할 수 있습니다. 시민들은 이를 통해 공연장의 위치, 규모, 이용 가능 시간 등을 확인하여 문화생활 계획에 활용할 수 있으며, 문화 인프라 분석과 공연 예술 활성화를 위한 정책 수립에 기초 자료로 활용될 수 있습니다. 해당 자료는 정기적으로 갱신되며, 지역 문화시설에 대한 접근성과 활용도를 높이고, 주민들의 문화 향유 기회를 확대하는 데에도 기여할 수 있습니다.
