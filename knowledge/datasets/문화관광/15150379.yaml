description_portal: 국립아시아문화전당은 광주광역시 동구에 위치하고 아시아 과거-현재의 문화예술과 혁신적인 아이디어, 신념이 만나 미래지향적인 새로운 결과물을 생산해내는 국제적인 예술기관이자 문화 교류기관입니다. ACC는  민주평화교류원, 문화정보원, 문화창조원, 예술극장, 어린이문화원의 5개원으로 구성되어있으며 1년 내내 다양하고 역동적인 프로그램(전시, 공연, 교육, 축제, 기타 행사)들이 펼쳐집니다.국립아시아문화전당에서 개최 됐던 국립아시아문화전당재단 관련 공연, 전시, 행사 등에 대해 제목, 장소, 공연기간, 카테고리 등의 자료를 제공합니다.매년 9월에 전년도 자료를 갱신할 예정입니다.
