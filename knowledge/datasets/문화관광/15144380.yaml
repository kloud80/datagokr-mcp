description_portal: 1958년 ‘한국의집’ 1주년 기념행사에서는 기념식과 함께 저명한 서화가들이 참여한 휘호회가 개최되었습니다.이 행사에는 고희동, 김은호, 이상범, 김기창, 변관식, 이응노 등 원로·중견 작가뿐 아니라 김학수, 함영식, 김정묵 등 제자 세대의 신진 작가들도 포함되어 있었으며, 37여명의 작가가 100여점 이상의 작품을 남겼습니다.해당 작품들은 1981년 한국문화재보호협회(현 국가유산진흥원)에서 한국의집을 수탁 운영하게 되면서 당시 한국의집에서 소장하고 있던 서화작품 146점은 국립현대미술관으로 이관되었습니다.본 데이터는 당시 참여 작가명과 함께 이관된 서화작품 목록을 기반으로 작성되었으며, 일부 작가 또는 작품 정보는 미상으로 표기되어 있습니다.해당 데이터는 전통예술 연구, 미술사적 활용 등의 기초자료로 활용될 수 있습니다.데이터 항목은 작가명, 작품명, 작품크기, 취득일자가 포함되어 있습니다.
