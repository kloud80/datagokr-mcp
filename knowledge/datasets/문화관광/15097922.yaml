summary_user: 빅카인즈 뉴스데이터베이스에서 ESG 관련 보도를 골라 기사 한 건마다 일자·언론사·제목·통합 분류·키워드·특성추출 정보를 담은 메타데이터로, 약 61MB 크기의 CSV 파일 하나로 제공된다. 연구자나 기업 분석가가 시기별·언론사별로 환경·사회·지배구조 의제가 어떻게 다뤄졌는지, 어떤 키워드가 자주 나왔는지를 살필 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 일자나 언론사명, 키워드 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 ESG(Environment·Social·Governance) 관련 보도를 분석한 메타정보 자료입니다. ESG는 기업의 지속가능성과 사회적 책임을 평가하는 핵심 기준으로, 최근 언론 보도에서 큰 비중을 차지하고 있습니다. 본 자료는 주요 신문 및 방송사의 뉴스 기사에서 ESG 관련 키워드와 등장 빈도를 추출하고, 시기별·주제별 변화를 살펴볼 수 있도록 구성되어 있습니다. 이를 통해 환경 문제, 사회적 가치, 기업 지배구조와 같은 의제가 어떻게 언론 담론 속에서 다루어지는지 파악할 수 있으며, 기업 연구, 정책 분석, 학술 연구, 교육 현장에서 활용할 수 있는 기초 데이터를 제공합니다.
