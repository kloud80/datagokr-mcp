summary_user: 경상북도 영주시에 있는 국보·보물·사적·천연기념물·명승·국가민속문화유산·도지정유산 등 지정유산을 한 건씩 종별, 명칭, 소재지, 지정일자로 담은 목록 파일(CSV)이다. 영주시 문화유산을 답사하거나 안내하려는 시민·관광객, 그리고 시군 단위 지정유산 현황을 정리하는 분석가가 '영주시에 어떤 국가유산이 어디에 있고 언제 지정됐는가'를 확인하는 데 쓴다. 실측 컬럼에 국가유산청 종목코드·지정번호 같은 전역 조인 키가 없어서, 국가유산청 자체 API나 다른 유산 데이터와는 명칭·종별을 맞춰 대조하거나 소재지 주소로 연결해야 한다.
limits: 종목코드·지정번호·필지번호(PNU) 같은 표준 식별자가 없어 다른 유산 데이터와 정확히 연결하기 어렵고, 명칭이나 주소로 매칭할 때는 오류를 따로 확인해야 한다. 범위는 영주시 한 곳에 한정되어 다른 시군이나 전국 현황은 이 파일만으로 볼 수 없다.
