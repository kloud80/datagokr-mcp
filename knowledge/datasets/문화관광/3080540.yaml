description_portal: 국가유산으로 지정된 국보, 보물, 사적, 천연기념물, 명승, 국가민속문화유산, 경상북도 유·무형유산 등에 대한 정보를 제공합니다. 영주시의 국가유산 정보를 통해 선조들이 남긴 유구한 문화유산을 영주시민은 물론 국민들이 알 수 있게 정보를 제공하여 관심을 가질 수 있도록 정보를 제공하고 있습니다.  영주시는 2026년 현재 국보 7건, 보물 27건, 사적 4건, 명승 1건, 천연기념물 3건, 국가민속문화유산 5건, 국가등록문화유산 8건, 도지정유산 49건, 문화유산자료 49건 등 총 153건의 지정유산을 보유하고 있으며 보유한 정보를 모두 제공 하고 있습니다.
