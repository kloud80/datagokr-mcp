summary_user: 국립국악원의 국악이론 학술연구 자료(관현악 편성, 병창, 관현합주편성, 삼현삼죽 등)를 자료 한 건씩 담으며, 명칭·책임자·등록일·주제분류·키워드·재생시간·내용·관련장소·시간적 범위·언어·저작권 정보를 함께 제공하는 전국 단위 비공간 메타데이터다. 국악 연구자·교육자·학생이 "삼현삼죽 편성에 관한 국립국악원 자료와 원문 링크가 있는가"처럼 특정 이론 주제의 기초 자료를 찾을 때 쓴다. 전역 조인 키는 없어서, 다른 국립국악원 학술연구 데이터와는 자료명·키워드·주제분류 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 국립국악원의 국악이론 관련 학술연구 정보를 체계적으로 제공하여 전통음악의 이해와 연구에 도움을 드립니다. 관현악 편성, 병창, 관현합주편성, 삼현삼죽 등 다양한 국악 이론과 관련된 자료를 포함하고 있으며, 자원의 명칭, 책임자, 등록일, 주제분류, 키워드, 재생시간, 내용, 관련장소, 시간적 범위, 언어, 저작권 등 주요 정보를 상세하게 담고 있습니다. 국악 연구자, 교육자, 학생 등에게 국악 이론의 기초 자료로 활용될 수 있으며, 전통음악의 보존과 확산, 교육자료 개발, 문화콘텐츠 제작 등 다양한 분야에서 유용하게 활용하실 수 있습니다.
