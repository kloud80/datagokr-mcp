summary_user: 경상남도 안의 마이스(MICE) 회의시설과 인프라시설을 시설 한 곳당 한 행으로 담은 기본정보 CSV 파일(약 7MB)로, 시설명·시설구분·도로명/지번주소·위경도·대표전화·영업 업태와 인허가명·시설소개를 포함한다. 행사 기획사나 기업 담당자가 '경남에서 학회나 기업 회의를 열 만한 회의장과 그 연락처·위치는 어디인가'를 찾을 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어, 시설명·주소로 맞추거나 위경도로 지도·주변 관광지 데이터에 겹쳐 쓴다.
