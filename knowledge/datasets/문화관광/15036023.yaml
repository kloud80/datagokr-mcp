summary_user: 국립박물관문화재단이 국립박물관 상품관과 온라인 뮤지엄숍에서 판매하는 도서를 한 권당 한 행으로 담은 목록 파일(약 20KB 규모의 CSV)로, 도서명·출판사·저자·ISBN·발행연도·판매가격을 담는다. 박물관 전시 도록이나 어린이 학습교재를 찾는 관람객, 박물관 출판물 현황을 정리하려는 연구자가 "이 전시 도록은 얼마이고 언제 나왔나" 같은 질문에 쓴다. 공통 조인 키는 없으며, 바코드(ISBN)로 외부 도서 서지 정보와 이름 기준으로 맞춰 보는 정도로만 연결한다.
