description_portal: '- 한국방송광고진흥공사에서 진행하는 혁신형 중소기업 방송광고 활성화 지원사업에 선정된 기업의 제작비 지원 내역 데이터를 제공합니다.- 개방 데이터는 지원년도, 접수번호, 지원매체, 지역, 제작 건수, 제작 초수, 제작비 총 7가지 항목으로 이루어져 있습니다.- 2019년 이후 제작비 지원내역이 포함되어 있으며 지원매체는 TV, 라디오로 나뉩니다.- 지역은 서울, 경기, 인천, 강원, 경남, 경북, 대구, 부산, 울산, 광주, 전남, 전북, 대전, 충남, 충북으로 구분되어 있습니다.- 지역별, 매체별 방송광고 제작비 현황 파악이 필요한 기업, 학계 및 연구기관에서 활용할 수 있습니다.'
