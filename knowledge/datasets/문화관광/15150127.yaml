summary_user: 콘텐츠수출마케팅플랫폼 마켓플레이스에 국내 콘텐츠 기업이 등록한 작품을 한 건씩 담은 전국 단위 파일로, 회사명·장르·세부장르·국문/영문 콘텐츠명·제작연도·홍보 영상 주소·콘텐츠 유형·상품 유형·서비스 플랫폼·타깃 연령을 담는다. 해외 바이어나 수출 지원 분석가가 "어떤 국내 기업이 특정 장르·연령층 대상 애니메이션이나 웹툰을 수출용으로 내놓았는가"를 찾거나 장르별 등록 현황을 집계하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 회사명이나 콘텐츠명을 이름으로 맞춰 기업정보·콘텐츠 데이터와 이어 쓴다.
description_portal: 콘텐츠수출마케팅플랫폼의 마켓플레이스 셀러 콘텐츠 정보는 국내 콘텐츠 기업이 보유한 작품을 해외 바이어에게 소개하고 글로벌 유통 기회를 확대하기 위해 제공되는 데이터입니다. 데이터에는 회사명, 장르 및 세부 장르, 콘텐츠명(국문·영문), 제작연도, 홍보용 영상 URL, 콘텐츠 유형, 상품 유형, 서비스 플랫폼, 타깃 연령층 등이 포함되어 있습니다. 바이어는 이를 통해 기업이 보유한 콘텐츠의 특성과 시장성을 파악할 수 있으며, 기업은 자사 콘텐츠를 홍보하여 판로를 개척하고 해외 파트너십을 모색할 수 있습니다. 연구자와 교육기관은 산업별 제작 동향을 분석하는 자료로 활용할 수 있고, 정책기관은 국내 콘텐츠 산업의 수출 역량을 평가하는 지표로 삼을 수 있습니다. 이 데이터는 콘텐츠 기업의 해외 시장 진출, 국제 네트워크 확대, 글로벌 경쟁력 강화를 지원하는 실질적인 비즈니스 자료입니다.
