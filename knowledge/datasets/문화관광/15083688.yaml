summary_user: 인천광역시 부평구에서 운영 중인 골프연습장을 시설 한 곳당 한 행으로 담은 명부로, 업종(실내골프연습장·스크린골프장 등), 상호, 도로명 주소, 전화번호가 들어 있으며 파일 크기는 약 3.5KB입니다. 부평구 주민이 집 근처 실내·스크린 골프연습장의 위치와 연락처를 확인할 때 쓰고, 분석가는 구 안의 민간 체육시설 분포를 볼 때 씁니다. 실측 컬럼에 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 다른 체육시설업 명부나 상권 데이터와는 상호나 도로명 주소를 맞춰 보는 방식으로만 연결됩니다.
