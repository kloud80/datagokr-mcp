summary_user: 수원도시공사가 운영하는 종합운동장의 체육 강좌를 강좌 한 건당 한 행으로 담은 원천 목록이며, 강좌명·강사·교육 기간과 시각·운영 요일·장소·정원·수강료·접수 기간과 방법을 포함한다(내려받은 CSV는 1,154바이트로 작은 파일). 수원 시민이 종합운동장에서 어떤 운동 강좌가 언제, 얼마에 열리고 언제까지 접수하는지 확인하거나, 분석가가 지역 공공 체육시설의 생활체육 프로그램 공급 현황을 살피는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 교육장 도로명주소(교육장도로명주소)나 운영기관명으로 이름·주소를 맞춰 붙여 써야 한다.
