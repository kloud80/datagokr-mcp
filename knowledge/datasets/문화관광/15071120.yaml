summary_user: 국립아시아문화전당(ACC)에서 열렸던 공연·전시·행사·교육을 한 건씩 담은 파일 데이터로, 공연명·장르·이용대상·시작일과 종료일·장소·요금정보가 들어 있다. 광주 ACC 프로그램을 찾는 관람객이나 분석가가 '이 장르 공연이 ACC에서 언제, 어디서, 얼마에 열렸나'를 확인하는 데 쓴다. 실측 컬럼에 KOPIS 공연ID 같은 공통 조인 키가 없어서, KOPIS 공연 목록 등 다른 데이터와는 공연명·장소 이름을 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: '국립아시아문화전당에서 개최 됐던 공연, 전시, 행사, 교육 등에 대해 공연명, 공연기간, 이용대상, 요금정보 등 자료를 제공합니다. 할인 및 예매 팁 ACC 전당 공연은 1인당 최대 4매까지 예매 가능하며, 공연 당일 티켓 환불·취소·변경은 불가하니 유의해주세요. "ACC 공연정보"에서 ACC는 일반적으로  아시아문화전당(Asia Culture Center)을 의미합니다. 이는 대한민국 광주광역시에 위치한 대규모 문화 예술 복합 기관입니다. 따라서, "ACC 공연정보"는 다음과 같은 의미를 가집니다: 아시아문화전당에서 열리는 공연에 대한 정보 예: 연극, 무용, 콘서트, 전통공연, 현대예술 공연 등 구성 예시 (ACC 공연정보에 포함될 수 있는 항목들): 공연명, 공연 일시, 공연 장소 (예: ACC 예술극장 극장1) 출연진 및 제작진 장르 (연극, 무용, 음악 등) 예매 정보 및 가격 관람 연령 공연 소요 시간'
