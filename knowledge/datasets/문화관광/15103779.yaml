description_portal: '2025. 8월 8일 기준 정상적으로 이용 가능한 인천광역시 중구 관내 인라인스케이트장은 총 5개소(원도심 1개소 / 영종 4개소)입니다.인천광역시 중구 관내 농구장의 데이터로 시설명칭, 시설 주소, 시설 개방시간 등의 데이터를 제공합니다.해당 정보는 「공공데이터의 제공 및 이용 활성화에 관한 법률」에 따라 일반 시민에게 개방되며, 지역 체육시설 이용 활성화와 행정의 효율성 제고, 민간의 창의적 서비스 개발 등에 활용됩니다.[데이터 변경 안내]1. 시설 명칭 : 관내 농구장 시설의 상호명2. 시설 주소 : 시설의 정확한 위치를 파악하기 위한 주소3. 시설 개방시간 : 시설 이용 가능한 시간4. 조성연도 : 시설이 조성된 연도5. 관리주체 : 시설 관리주체'
