description_portal: 인천광역시 인천데이터포털의 시티투어 정보입니다.인천광역시 시티투어 관련 공공데이터는 인천의 주요 관광 명소를 편리하게 여행 할 수 있도록 돕는 정보를 제공합니다.이 데이터에는 시티투어 노선, 정류장 위치, 운행 시간, 요금, 그리고 각 정류장의 관광 명소 정보가 포함되어 있습니다.데이터 주요 내용으로 시티투어코스명, 시티투어문의처, 운영시간, 운행방법, 탑승장소, 코스정보 등 다양한 정보가 포함되어 있습니다.이 데이터를 활용하면 맞춤형 인천 여행 코스를 추천하거나, 효율적인 여행 계획을 세울 수 있습니다.시티투어에 대한 자세한 정보는 https://citytour.ito.or.kr/ 에서 확인이 가능합니다.
