summary_user: 제주 삼양동 일대 환해장성과 벌낭포구 해안길을 따라가는 무장애 산책 코스를 지점 단위(순서·위도·경도·구분·설명)로 담은 파일로, 전체코스·추천코스 여부와 지점별 상세정보가 함께 들어 있다. 휠체어 이용자나 교통약자 동반 여행자가 '삼양 해안길을 휠체어로 어디까지, 어떤 순서로 돌 수 있나'를 확인하거나, 관광 담당자가 열린관광지·무장애 동선 개선 자료로 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 지점 이름 매칭이나 위도·경도 좌표 근접으로만 이어 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_삼양환해장성과벌낭포구해안길_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 삼양동 일대의 환해장성과 벌낭포구 해안길을 중심으로 한 무장애 여행 코스 정보를 제공한다. 해안 경관을 따라 이동하는 산책형 코스로서, 교통약자와 휠체어 이용자의 안전하고 편리한 이동을 고려해 접근 가능한 동선, 전망 지점, 휴게 및 편의시설 정보가 포함된다. 현장 기반의 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등이 반영되어 있으며, 지역 해안 문화자원과 열린관광지 조성, 무장애 관광 인프라 구축 및 관련 정책 수립을 지원하는 기초자료로 활용된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
