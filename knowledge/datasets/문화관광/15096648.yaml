summary_user: 제주 지역 해수욕장별·조사 지점별 수질 측정 결과를 담은 건별 조사 데이터로, 2021년 기준 개장 전·개장 중·폐장 후 측정 시기(측정 구분)와 측정 항목, 측정값, 적합 여부를 기록한다. 피서객이나 관광 안내 담당자가 "올여름 가려는 제주 해수욕장의 수질이 기준에 적합했나"를 확인하거나, 연구자가 해수욕장별 수질 차이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관광지·해수욕장 데이터와는 해수욕장명을 이름으로 맞춰 연결해야 한다.
description_portal: 이 데이터셋은 2021년 기준으로 제주특별자치도청이 조사한 제주지역 해수욕장들의 수질 현황을 수록하고 있다. 조사 시점은 개장 전 1회, 개장 중 매달 2회, 폐장 후 1회로 총 4회이며, 각 조사 지점에서 채취한 시료 6개 중 4개 이상이 수질기준에 적합할 경우 ‘적합’으로 판단하는 방식이다. CSV 형식으로 제공되며, 데이터 항목에는 해수욕장 이름, 조사 지점, 측정 항목별 결과, 수질 적합 여부 등이 포함되어 있어 제주 해양환경 상태 점검, 해수욕장 위생안전성 평가, 관광안전 정보 제공, 환경 정책 수립 및 학술 연구 등에 활용 가능하다. 다만 2021년 조사 기준으로 과거 시점의 데이터이며 이후 변화한 수질 상태는 반영되지 않을 수 있다는 한계가 있다.
