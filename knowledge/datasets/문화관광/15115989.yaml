summary_user: 서울특별시 중구에 신고된 영화배급업소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 관리번호·인허가일·영업상태(신고·폐업 등)·지번/도로명 주소·중부원점TM 좌표를 포함한다. 영상콘텐츠 유통 분야 창업을 준비하는 예비 사업자가 '중구에 영업 중인 영화배급업체가 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명·주소 매칭이나 같은 기관(자치단체) 코드로만 연결한다.
description_portal: '서울특별시 중구의 영화를 전문적으로 배급하는 업소 정보입니다. 데이터는 각 신고업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 영상콘텐츠 유통 및 문화산업 분야의 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 신고업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 법적 절차를 거쳐 저작권을 준수하며 영화를 극장에 유통하는 신뢰할 수 있는 문화산업 신고업체를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
