summary_user: 서울특별시 성동구의 복합유통게임제공업 업소를 업소별 인허가 건으로 담으며, 인허가·취소·폐업 일자, 영업상태, 소재지 주소와 좌표, 시설 면적·층수·방 수·비상구 같은 시설 항목을 포함한다. 성동구에서 영업 중이거나 폐업한 PC방 등 복합 게임업소가 어디에 몇 곳 있는지, 언제 인허가를 받았는지를 확인하려는 주민·창업 예정자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 자치구 같은 업종 데이터와는 개방자치단체코드·관리번호 같은 같은 기관 코드나 업소명·주소 매칭으로 잇는다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 인터넷컴퓨터게임시설제공업(PC방 등)과 같은 정보제공서비스업을 운영하거나, 다른 업종과 동일 장소에서 함께 영업하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 복합업장 형태의 영업은 다양한 소비자 서비스 제공과 신산업 창출에 기여하는 동시에 행정상 관리의 중요성도 커지고 있으므로, 관련 업소의 인허가 및 복수 영업 현황을 정확히 파악하는 것이 필요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 주요 항목이 포함되며, 업소별 인허가 내역, 영업 개시 및 종료, 행정 변동 사항 등 운영현황을 상세히 확인할 수 있습니다. 성동구청 등 관할 행정기관에서는 주기적인 점검과 자료 갱신을 통해 데이터의 신뢰성과 최신성을 확보합니다. 본 데이터는 복합 업소 관리, 정책 수립, 업계 동향 분석, 시장 현황 파악, 소비자 정보 제공 등 다양한 분야에서 활용 가능하며, 행정기관, 업계, 연구자 및 시민 모두에게 신뢰도 높은 자료를 제공합니다. 데이터는 정기적으로 최신화됩니다.
