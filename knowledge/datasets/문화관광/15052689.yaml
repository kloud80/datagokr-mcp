description_portal: 대한체육회가 주관하고 전국시도가 참가한 역대 전국체육대회의 상세한 메달 정보를 제공합니다.데이터의 주요 내용은 고유 식별자인 아이디와 각 메달 정보와 관련된 웹주소를 포함하며, 메달이 획득된 대회, 종목, 종별, 세부종목을 명확히 구분합니다. 또한, 선수 개개인의 정보인 시도, 경기일, 성명, 팀명, 그리고 획득한 메달의 종류(금, 은, 동)를 상세하게 기록합니다.아이디의 경우 중복은 없지만, 표준화는 되어있지 않습니다. 웹주소를 통해 해당 정보 이외의 전국체전의 다양한 정보를 확인할 수 있습니다.
