summary_user: 인천광역시 미추홀구에서 생활체육지도자가 배치된 장소별로 운영 종목, 시설명, 도로명주소, 전화번호, 위경도를 한 줄씩 담은 시군구 단위 원천 목록입니다. 주민이 집 근처 복지관이나 행정복지센터에서 요가·탁구·걷기 같은 생활체육 강좌를 어디서 하는지 찾을 때, 또는 분석가가 구 내 생활체육 프로그램 접근성을 따질 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 도로명주소·장소명 매칭이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구의 생활체육지도자 배치사업 현황 정보를 담고 있습니다. 종목, 장소, 도로명주소, 전화번호, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 생활체육지도자가 배치된 장소와 운영 종목을 파악할 수 있으며, 걷기, 유아체육, 배드민턴, 밴드체조, 써킷트레이닝, 요가, 타바타, 탁구, 테니스, 실버요가, 박수체조, 스트레칭, 헬스, 다이어트댄스 등 다양한 생활체육 프로그램이 제공됩니다. 국민체육센터, 체육관, 학교, 복지관, 행정복지센터, 노인복지관 등 다양한 시설에서 운영되며, 유아부터 노인까지 전 연령층을 대상으로 합니다. 각 시설의 위경도 좌표를 통해 정확한 위치를 확인할 수 있습니다. 이 데이터는 지역 내 생활체육 프로그램 접근성 분석, 생활체육지도자 배치 현황 파악, 주민 건강증진 정책 연구 등에 활용될 수 있습니다.
