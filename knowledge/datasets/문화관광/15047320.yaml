description_portal: 서울시여성능력개발원이 제공하는 「북부여성발전센터 교육강좌 정보」는 센터에서 운영하는 다양한 교육강좌의 내용을 한눈에 파악할 수 있도록 구성된 데이터로서, 강좌명, 난이도, 교육기간, 요일·시간, 수강료, 정원, 접수기간 등 핵심 정보를 포함하고 있으며 수강 준비와 프로그램 비교·선택에 활용할 수 있도록 설계된 자료입니다. 접수 마감 강좌는 제공되지 않아 현재 운영 중이거나 신청 가능한 강좌 중심으로 구성되며, 실제 수강신청은 센터 홈페이지에서 별도로 진행해야 한다는 점이 안내되어 있습니다. 강좌 운영 특성, 시간대별 편성, 비용 구조 등을 분석할 수 있어 여성 대상 직업교육·평생교육 정책 설계, 수요 분석, 프로그램 개선 등 행정적 활용도가 높은 데이터입니다.북부여성발전센터에서 실시하는 교육강좌 정보입니다. 교육신청은 http://bukbu.seoulwomen.or.kr/ 에서 직접 하셔야 합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://bukbu.seoulwomen.or.kr/ 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
