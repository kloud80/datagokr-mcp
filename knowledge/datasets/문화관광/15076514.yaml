summary_user: 한국문화예술위원회 AK공연예술이 정리한 공연예술 분야 학술행사(세미나·심포지엄 등)를 행사 한 건당 한 행으로 담은 CSV 파일로, 연도(2007·2008·2015·2017·2018), 행사명, 회차, 시작·종료일, 주최, 분야, 지역, 장소, 행사내용, 참여인원을 기록한다. 연구자나 공연예술 기획자가 '특정 연도에 어떤 분야의 공연예술 학술행사가 어느 지역에서 얼마나 열렸고 몇 명이 참여했나'를 살펴보는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 직접 연결되지 않으며, 다른 데이터와는 주최 기관명·장소명·지역명 같은 이름 매칭으로만 이어 쓴다.
limits: 연도가 2007·2008·2015·2017·2018만 있고 연번이 연도마다 1부터 다시 시작하므로 연번을 고유 식별자로 쓰면 안 된다. 수시·이벤트성으로 생성된 뒤 바뀌지 않는 파일이어서 최근 학술행사 현황은 담지 않는다.
