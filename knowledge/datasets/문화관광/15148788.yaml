description_portal: 한국영상자료원 상암본원 2층에 위치한 영상도서관의 자료 대출 및 열람 이력입니다.2012년 8월 1일부터 2025년 9월 7일까지 총 319417건의 대출/열람 건에 대한 기록이 포함되어 있습니다.열은 대출관리번호, 이용구분, 자료명, 배가번호, 이용일, 자료유형, 자료번호, 일일이용순위, 일일이용건수로 구성되어 있어자료별 총 이용건수 등을 계산하여 이용횟수가 많은 영화 또는 영상자료를 조회할 수 있습니다.자료 유형은 동영상(VOD)과 비디오로 구분되어 있으며비디오는 테이프, 디스크 등 실물 매체를 지닌 자료, 동영상은 동영상 파일로 존재하며 별도의 대출 없이 열람용 PC에서 재생이 가능한 유형을 의미합니다.
