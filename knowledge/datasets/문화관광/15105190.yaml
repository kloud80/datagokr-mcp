summary_user: 올림픽공원 장미광장에 관한 자료를 한 건씩 담은 메타데이터로, 자원 명칭·등록일·주제 분류와 주제어·공간·시간대·언어·저작권 정보를 항목별로 제공한다. 공원 방문 안내문이나 관광 콘텐츠를 만드는 사람이 장미광장에 어떤 자료가 있고 저작권 조건이 어떤지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 자원 명칭이나 같은 기관 자료 기준으로만 이어 쓴다.
description_portal: 올림픽공원 내 장미광장과 관련된 다양한 정보를 종합적으로 제공하는 데이터셋입니다. 자원의 명칭, 등록일, 소속, 기관별 주제 분류, 핵심 주제어, 공간, 시간대, 언어, 저작권 등 주요 항목을 포함하여 장미광장의 현황과 특성을 체계적으로 파악할 수 있습니다. 본 데이터는 공원 방문객 안내, 문화예술 행사 기획, 생태공원 연구, 관광 콘텐츠 개발 등 다방면에서 활용 가능하며, 특히 공공서비스 제공 기관, 연구자, 문화기획자, 관광업계 등에게 실질적인 자료로서 유용합니다. 또한 장미광장 관련 정보를 체계적으로 관리·공유함으로써 공공데이터 활용도를 높이고, 도시 공원의 가치 확산과 문화 향유 기회 확대에 기여하는 중요한 기반 자료입니다.
