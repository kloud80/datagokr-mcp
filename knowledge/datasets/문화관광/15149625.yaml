summary_user: 경상남도 거제시 시립도서관이 보유한 도서를 한 권 단위로 담은 목록 파일로, 도서명·저자·ISBN·출판일·정가·할인금액이 들어 있으며 CSV 파일 크기는 약 19MB다. 시민이 시립도서관에 특정 책이 있는지 찾거나, 분석가가 거제시 시립도서관 장서의 출판 시기·가격 구성을 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았지만, 국제 표준 도서 번호(ISBN) 컬럼을 매개로 국가서지나 도서관정보나루의 대출·인기 도서 자료와 맞춰 보는 방식으로 연결을 시도할 수 있다.
limits: 전역 조인 키가 실측으로 확인되지 않아 다른 데이터와는 ISBN·도서명 같은 값 매칭이나 같은 기관 기준으로만 연결된다. 범위가 거제시(시군구) 한 곳이라 다른 지역 도서관과 비교하려면 별도 자료가 필요하다.
