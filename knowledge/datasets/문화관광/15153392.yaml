description_portal: 서울공예박물관에서 제공하는 데이지파일은 시각장애인을 포함한 정보 취약계층이 인쇄자료를 보다 쉽게 이용할 수 있도록 제작된 디지털 전자자료입니다. 종이도서를 스캔한 뒤 원본의 구조와 내용을 그대로 유지하면서 데이지 국제표준(DAISY)에 맞춰 편집한 오디오·텍스트 기반 파일로, 사용자 친화적인 탐색 기능과 음성 안내를 제공합니다. 이 자료는 공예 관련 도서와 전시 해설 등을 접근성 높게 제공하기 위해 마련되었으며, 이용을 위해서는 서울공예박물관 홈페이지에서 별도의 신청 절차를 거쳐야 합니다. 신청 방법, 제공 범위, 지원 기기 등 자세한 정보는 공예박물관 공식 홈페이지에서 확인할 수 있습니다.
