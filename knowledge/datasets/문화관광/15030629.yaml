description_portal: 본 데이터는 경기도 광주시에 설치된 공공 체육시설의 현황 정보를 제공합니다. 구분 항목을 통해 운동장, 게이트볼장, 종합체육시설 등 다양한 유형의 체육시설을 분류하여 확인할 수 있으며, 시설명과 주소는 각 시설의 명칭과 위치를 안내합니다. 면적 정보는 시설의 규모를 제곱미터(㎡) 단위로 제공하여 수용 인원 및 활용 범위를 파악할 수 있습니다. 주요시설 항목은 해당 체육시설에 구비된 운동 기구 및 편의시설을 나타내며, 설치년도는 시설의 신축 시기를 보여주어 노후도 및 관리 상태를 판단하는 기준이 됩니다. 이를 통해 시민들은 자신의 거주지 인근에 위치한 체육시설을 손쉽게 찾아 이용할 수 있습니다.
