description_portal: 연도별  저작권산업의 경제적 기여도(GDP 비중)_통계현황- 저작권산업의 경제적 기여도는 국내 저작권산업을 매출액, 부가가치, 고용 등의 측면에서 그 규모를 산출하고 이를 통해 국가 경제에 있어서 저작권산업이 가지는 중요성과 산업 실태를 정량적 관점에서 조망할 수 있는 핵심 지표로 활용됨- GDP(국내총생산)는 한나라의 영역내에서 가계, 기업, 정부 등의 모든 경제주체가 일정기간 동안 생산활동에 참여한 결과 창출된 부가가치를 시장가격으로 평가해서 합계한 것으로 국내에 거주하는 생산자가 자국의 생산요소와 결합하여 발생시킨 부가가치를 말함- 명목 GDP는 최종생산물의 가치 총계를 당해연도 시장가격(경상가격)으로 계산하며, 실질 GDP는 최종생산물의 가치 총계를 기준연도의 시장가격(불변가격)으로 계산한 것을 말함- 명목(실질) GDP 비중 = 전체(핵심) 저작권산업의 명목(실질) 부가가치 ÷ 명목(실질) GDP × 100
