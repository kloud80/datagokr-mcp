summary_user: 대구광역시가 발행한 관광안내책자(eBook)의 목록을 책자 한 건당 한 행으로 담은 작은 CSV 파일(약 4KB)로, 분야·제목·주소·등록일·조회수가 들어 있다. 대구 여행을 준비하는 사람이나 관광 콘텐츠를 정리하는 담당자가 '대구시가 어떤 분야의 관광 책자를 언제 냈고 어디서 받을 수 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 데이터 등과는 제목·분야 이름을 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 대구의 주요 관광지, 문화유산, 자연경관, 전통시장, 음식점, 숙박시설 등 다양한 관광 정보를 포함하고 있는 관광안내책자(eBook)에 대한 정보를 담고 있습니다. 이 자료는 PDF 형식으로 제공되며, 스마트폰, 태블릿, PC 등 다양한 디지털 기기에서 열람할 수 있어 언제 어디서든 편리하게 이용할 수 있습니다. 대구광역시 공식 관광 홈페이지나 관련 기관의 웹사이트를 통해 다운로드할 수 있으며, 대구를 방문하는 관광객들에게 유용한 정보 제공의 역할을 합니다. 여행 계획 수립이나 현장 방문 시 참고 자료로도 활용도가 높습니다.
