description_portal: 화성도시공사에서 관리하는 경기도 화성시 관내 설치된 야외 체육시설의 설치 및 운영 현황을  정리한 데이터입니다. 화성시 각지에 위치한 족구장, 농구장, 축구장, 배드민턴장, 게이트볼장 등 다양한 실외 체육시설의 물리적 정보와 행정 관리 정보를 포함하고 있으며, 도시공원과 생활체육공간의 실질적 활용도를 종합적으로 파악할 수 있도록 구성되어 있습니다. 각 데이터 항목은 화성도시공사가 직접 관리하고 있는 체육시설의 유형(시설명), 해당 시설이 포함된 공원명, 시설이 실제로 위치한 행정구역(지번 기준 주소), 면수(각 시설이 보유한 코트 또는 경기장 수), 시설면적(㎡ 단위), 시설이 포함된 전체의 총 면적, 그리고 이를 관리하는 담당기관 및 연락처 등의 정보를 포함하고 있습니다.
