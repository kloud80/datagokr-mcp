summary_user: 화성도시공사가 관리하는 화성시 관내 야외 체육시설(족구장·농구장·축구장·배드민턴장·게이트볼장 등)을 시설 한 건씩 담은 현황 파일로, 공원명·지번 주소·면수·시설면적·총 면적·관리기관·연락처를 함께 싣는다(CSV 약 31KB). 화성시 주민이나 생활체육 동호회가 '우리 동네 어느 공원에 족구장이나 게이트볼장이 몇 면 있고 어디에 문의하나'를 확인하거나, 분석가가 공원별 체육시설 배치를 살피는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 공원명·지번 주소(위치) 같은 이름 매칭으로만 이어 쓴다.
limits: 표준 행정코드나 시설 식별 코드가 없어 다른 체육시설·공원 데이터와 바로 결합되지 않고, 이름·주소 매칭이 필요하다. 좌표가 없는 비공간 데이터로 분류돼 지도 표시에는 주소 지오코딩이 따로 필요하며, 예약·대관 정보는 담지 않는다.
