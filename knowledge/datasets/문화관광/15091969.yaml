summary_user: 대구광역시 서구 관내에 등록된 인터넷컴퓨터게임시설제공업소(PC방)를 업소 한 곳당 한 행으로 담은 목록으로, 업종명·상호·도로명 소재지·보유 PC 대수를 포함하며 CSV 파일 하나(약 6KB) 규모다. 주민이나 분석가가 '서구 안 어느 동네에 PC방이 몰려 있고 업소별 PC 규모는 어느 정도인가'를 확인하거나, 청소년 이용시설 관리·상권 분석의 기초 자료로 쓴다. 전역 조인 키나 코드표가 없으므로 다른 데이터와는 도로명 주소를 지오코딩하거나 상호·주소를 이름으로 맞춰 연결해야 한다.
