summary_user: 경상남도 내 등록 골프장과 스키장을 시설 한 곳당 한 행으로 담은 명부로, 시설명·종류·홀 또는 슬로프 수·면적·등록일자·운영자·도로명/지번 주소를 담는다(포털 설명 기준 총 43개소, 골프장 42·스키장 1). 도민·관광객이 경남 어느 시군에 몇 홀 규모 골프장이 있고 누가 운영하는지 확인하거나, 분석가가 시군별 골프장 분포와 면적을 비교하는 데 쓴다. 전역 조인 키는 없으므로 시설명이나 소재지 주소(우편번호 포함)를 맞춰 체육시설업 인허가(LOCALDATA) 명부나 숙박·음식점 상권 데이터와 이어 쓴다.
description_portal: 경남도내 골프장 및 스키장 현황에 대한 데이터로 총 43개소이고 이중 골프장 42개소, 스키장 1개소 입니다.사업장명, 종류, 면적, 운영자 현황 등을 제공합니다.- 경남도민이 골프장 및 스키장 현황을 쉽게 확인하여 여가·체육활동 계획 수립에 활용할 수 있으며, 시설의 위치 및 운영 현황을 한눈에 파악할 수 있어 이용 편의성 향상- 등록 체육시설의 운영자, 면적, 시설 현황 등을 공개함으로써 행정의 신뢰성과 투명성을 높일 수 있으며, 공공데이터 개방을 통한 도민의 알 권리를 보장- 골프 및 스키 관광자원 정보를 민간 서비스와 연계하여 관광객 유치에 활용할 수 있으며, 지역 숙박·음식점 등 연관 산업의 활성화에 기여
