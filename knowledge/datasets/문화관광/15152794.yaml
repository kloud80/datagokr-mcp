description_portal: 문화체육관광부 국민소통실에서 운영하는 정책여론수렴시스템은 온라인 매치를 수집, 분석하여 정부 정책에 대한 국민 여론의 관심도와 반응을 시스템 내 다양한 기능을 통해 사용자에 제공합니다. 빅데이터를 통해 나타난 정책 여론 및 이슈를 신속하게 파악하여, 정부 정책에 대한 대국민 소통에 활용합니다. 해당 자료는 정책여론수렴시스템 내 키워드의 기간별 감성 언급량의 정보이며 각 키워드에 대한 긍정, 부정, 중립의 수치를 나타냅니다. 긍부정의 정보는 주로 정책키워드의 여론 반응이 호감도가 어느정도인지 판단하는 지표로 사용하게 됩니다. 긍부정 연관어는 보고서 작성에 활용 가능합니다
