summary_user: 전북특별자치도 남원시에 등록된 공연장을 한 곳당 한 행으로 담은 파일(약 816바이트 csv)로, 등록일자·공연장 이름·도로명주소·전화번호·대표자 성명·객석수·무대면적을 싣는다. 공연 기획자나 예술단체가 남원에서 몇 석 규모의 공연장이 어디에 있고 무대가 얼마나 넓은지 비교해 대관 후보를 고를 때 쓴다. 전역 조인 키가 없어 다른 공연장·문화시설 자료와는 공연장 이름이나 도로명주소를 맞춰 이어 써야 한다.
description_portal: 1. 데이터 설명본 데이터는 전북특별자치도 남원시의 공연장 등록 현황을 체계적으로 정리한 공공데이터입니다. 춘향문화예술회관과 국립민속국악원 같은 주요 문화시설부터 뮤지컬, 오페라, 판소리, 사물놀이, 콘서트 등 다양한 공연이 열리는 장소들의 기본 정보를 포함하고 있습니다. 각 공연장의 위치, 규모, 연락처 등 실제 운영 정보를 제공함으로써 시민들의 문화예술 참여를 지원하고, 공연 기획자와 예술단체에 공연장 선택에 필요한 정보를 제공하는 것이 주요 목적입니다.2. 데이터 항목명등록일자, 공연장명칭, 도로명주소, 전화번호, 성명, 객석수, 무대면적, 비고3. 기대효과이 데이터를 활용하면 지역 문화예술 생태계의 투명성과 접근성을 높이고, 공연장 운영 현황을 체계적으로 관리하여 향후 문화정책 수립을 위한 기초 자료로 활용할 수 있습니다.
