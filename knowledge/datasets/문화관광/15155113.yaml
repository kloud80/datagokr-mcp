summary_user: 전국 지자체의 농어촌민박업 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, API 전체 55,673건이며 사업장명·인허가일자·영업상태·객실수·주소·좌표와 소방·위생 설비 현황을 담는다. 분석가나 지역 사업자가 특정 지역에 영업 중인 농어촌민박이 몇 곳이고 객실이 얼마나 되는지 같은 숙박 시장 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 주소 키로 다른 인허가·숙박 데이터와 이어 쓰며, 필수 조건값인 기준일자(BASE_DATE)와 개방자치단체코드(OPN_ATMY_GRP_CD)는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: '문화_농어촌민박업 데이터는 농어촌지역 또는 준농어촌지역의 주민이 소유 및 거주하고 있는 주택을 이용하여 농어촌 소득을 늘릴 목적으로 투숙객에게 숙박,취사시설,조식 등을 제공하는 업소정보로, 사업장명, 허가일자, 사업장주소, 영업상태 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 농어촌민박업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 농림축산식품부 농촌정책과 / 044-201-1522, 1523 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
