description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 새별오름은 제주 제주시 애월읍 봉성리에 위치한 고도 약 519.3 미터의 오름으로, 완만한 능선과 억새·풀밭이 어우러진 자연 경관과 제주 서해안 및 비양도 조망이 가능한 대표 오름이며, 일부 구간에 무단차 출입로, 포장 보행로, 주차장, 장애인 화장실 등 무장애 여행 편의시설 정보가 제공되어 휠체어 사용자나 보행 약자도 오름 아래 접근로와 전망 구간을 이용할 수 있어 관광 안내, 무장애 관광 코스 설계, 자연 관광 콘텐츠 제작 등에 활용 가능한 열린관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
