summary_user: 경기도 내 대형마트·복합쇼핑몰·쇼핑센터 같은 대규모점포를 점포 한 곳당 한 행으로 담은 인허가·입지 목록으로, 사업장명·인허가일자·영업상태·폐업일자·점포구분·면적·주소와 위경도 좌표를 포함한다. 상권 분석가나 유통 사업자가 '우리 시군에 영업 중인 대형마트·쇼핑몰은 어디에 몇 곳이 있고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·주소 이름 매핑이나 위경도 좌표로 다른 상권·인구 데이터와 붙여 쓴다.
description_portal: 이 데이터는 경기도 내 대규모점포에 대한 인허가 및 입지 정보를 담고 있으며, 사업장명, 인허가일자, 소재지, 영업상태, 면적, 업태구분 등 점포 운영에 필요한 다양한 행정 정보를 포함합니다. 대규모점포는 대형마트, 복합쇼핑몰, 쇼핑센터 등 소비자 접근성이 높은 상업시설로, 지역경제 활성화와 고용창출에 영향을 미치는 핵심 유통 기반입니다. 이 자료는 지역 상권 분석, 점포 분포 현황 파악, 유통산업 정책 수립, 도시계획 내 상업시설 배치, 인허가 관리 등에 활용될 수 있습니다. 특히 영업개시 전 점포나 폐업된 시설 정보를 포함함으로써 유통시설의 변동성을 분석하는 데에도 활용도가 높습니다.
