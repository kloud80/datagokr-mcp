summary_user: 울산시설공단이 주최·주관하는 행사를 한 건씩 담은 파일(csv, 약 19KB)로, 행사명·시작일·종료일·장소·요금·대표번호를 담는다. 울산 시민이나 방문객이 이번 주말이나 이번 계절에 공단 시설에서 열리는 행사가 언제 어디서 열리는지, 무료인지 유료인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행사명·장소 이름을 맞추거나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: 울산시설공단은 시민들의 문화·체육·여가 활동 참여를 확대하고, 다양한 공공 행사에 대한 접근성을 높이기 위해 행사 정보를 공공데이터로 제공하고 있습니다. 이 데이터는 울산시설공단이 주최하거나 주관하는 각종 행사의 세부 정보를 담고 있으며, 항목으로는 행사명, 시작 날짜, 종료 날짜, 장소, 요금, 대표번호 등이 포함되어 있습니다. 이를 통해 시민들은 행사 일정과 기간, 개최 장소를 명확하게 확인할 수 있으며, 무료 또는 유료 여부를 사전에 파악하여 개인 일정이나 예산에 맞는 참여 계획을 세울 수 있습니다.
