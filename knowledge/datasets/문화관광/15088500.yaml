summary_user: 인천 미추홀구 지역스포츠클럽이 운영하는 축구·농구·배드민턴 등 프로그램을 한 줄에 하나씩 담은 원천 목록으로, 종목·프로그램명·이용대상·운영요일·시간·장소·도로명주소·모집정원·연락처를 담는다(csv 약 6KB 규모의 소량 파일). 미추홀구 학부모나 청소년이 "우리 아이 학년에 맞는 주말 체육 프로그램이 어느 시설에서 몇 시에 열리나"를 찾을 때나, 분석가가 구내 청소년 생활체육 접근성을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 운영장소명·도로명주소를 이름이나 주소로 맞춰 공공체육시설 목록 등과 이어 쓴다.
description_portal: 본 데이터는 인천광역시 미추홀구의 지역스포츠클럽 연계 프로그램 정보를 담고 있습니다. 연번, 기관명, 도로명주소, 전화번호, 프로그램명, 기간, 요일, 운영시간, 이용대상, 인원수, 위도, 경도 등의 데이터를 포함하고 있습니다. 미추홀구 내 지역스포츠클럽이 운영하는 다양한 체육 프로그램의 위치와 운영 정보를 파악할 수 있으며, 축구, 농구, 배드민턴, 합창 등 다양한 종목의 프로그램이 제공되고 있습니다. 초등학생 저학년·고학년, 중학생 등 연령대별로 구분된 프로그램과 운영시간, 요일 정보를 확인할 수 있습니다. 미추홀구청 풋살장, 숭의복지관 체육관, 연경산 배드민턴장, 주안스포츠문화센터 등 다양한 시설에서 운영됩니다. 이 데이터는 지역 내 생활체육 프로그램 현황 파악, 청소년 체육활동 접근성 분석, 스포츠클럽 운영 실태 연구 등에 활용될 수 있습니다.
