description_portal: 서울미래유산홈페이지 참여프로그램 정보는 서울 미래유산을 주제로 한 답사, 강연, 체험 등 다양한 참여형 프로그램의 모집 및 운영 현황을 제공하는 데이터입니다. 프로그램별 연번, 제목, 내용, 대상, 주최, 문의처, 홈페이지, 참가비, 모집 정원과 대기자 정원 정보가 포함되어 있어 시민 참여 기획과 홍보에 활용하기 적합합니다. 또한 프로그램 신청 시작일자와 마감일자, 행사 시작일자와 마감일자, 각 회차별 날짜, 요일, 시간, 장소 정보가 함께 제공되어 실제 운영 일정과 세부 구성을 체계적으로 파악할 수 있습니다. 입력시간과 수정시간 항목을 통해 정보의 갱신 여부를 확인할 수 있어, 행정 담당자 및 운영기관은 프로그램 관리에, 시민과 관광객은 참여 신청 및 일정 확인에 유용하게 활용할 수 있는 실무 중심의 데이터입니다.
