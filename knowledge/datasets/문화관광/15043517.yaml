summary_user: 제주데이터허브가 제공하는 한림공원 무장애여행 정보로, 공원 안 지점별 위도·경도·해발고도와 장소 설명·이미지를 담는 지점 단위 파일이다. 휠체어 이용자나 유모차 동반 가족이 한림공원 안에서 어느 지점을 거쳐 이동할 수 있는지 지도에 표시하려는 관광 서비스 개발자나 열린관광지 담당자가 쓴다. 실측 컬럼에 TourAPI contentId 같은 전역 조인 키가 없어, 다른 관광지 데이터와는 장소 이름이나 좌표로 직접 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 한림공원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 본 데이터셋은 한림공원의 무장애 여행 정보를 제공하며, 위치 좌표, 관광지 명칭, 장소 설명, 이미지 자료 등을 포함한다. 한림공원은 제주 서부 한림읍에 위치한 약 10만 평 규모의 테마공원으로, 야자수길·열대식물원·분재원·민속마을·동굴·조류 사파리·수석전시관 등 9개 테마 구역과 계절별 꽃 정원 등 다채로운 볼거리를 갖추고 있다. 이 공원은 장애인 주차장, 휠체어 대여, 장애인 화장실, 유모차 대여 및 평탄한 출입로 등 무장애 편의시설이 갖춰져 있어 교통약자, 고령자, 영유아 동반 가족 등 누구나 접근 가능하다. 이 데이터는 무장애 관광지 안내, 관광 정책 수립, 열린관광지 조성, 지도 서비스 및 관광 콘텐츠 제작 등 공공 및 관광 분야의 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
