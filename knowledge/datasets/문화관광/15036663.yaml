summary_user: 인천관광공사 유튜브 채널의 2018~2020년 연도별 운영 지표(구독자 수, 시청시간, 시청자 연령대·성별 비율, 노출 수, 노출 클릭률)를 지표별 행과 연도별 열로 정리한 소규모 집계 파일이다. 관광 홍보 담당자나 분석가가 "인천관광공사 유튜브 구독자와 노출 클릭률이 연도별로 어떻게 변했고 주 시청층은 어느 연령대인가"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 연도를 기준으로만 맞춰 볼 수 있다.
description_portal: 인천관광공사가 운영하는 유튜브 채널의 운영현황을 파일데이터로 제공하고 있습니다.2018년부터 2020년까지의 유튜브 채널 운영현황을 제공하고 있으며, 제공정보는 아래와 같습니다. - 구독자 수, 시청시간(분), 시청자 연령대, 주 이용자 연령대, 남성시청자 비율, 여성시청자 비율, 노출 수(회), 노출 클릭률인천관광공사는 공사 공공데이터 개방 및 인천관광 활성화를 위하여 주기적으로 데이터를 현행화하여 제공할 예정입니다.공사 유튜브채널 운영현황 관련 문의는 공사홈페이지 및 공공데이터 통합플랫폼을 통해 해주시기 바랍니다.
