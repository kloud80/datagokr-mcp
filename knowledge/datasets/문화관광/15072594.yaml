summary_user: 강남구 소재 의료기관 400여 곳의 기관명을 중국어로 적은 목록 파일로, 기관 하나가 한 행이며 기관명(기관명) 한 컬럼만 담긴 작은 CSV(5,731바이트)다. 중국어권 의료관광객이나 이들을 안내하는 관광·통역 사업자가 '강남구 병원 이름을 중국어로 어떻게 표기하나'를 확인하거나 중국어 안내물을 만들 때 쓴다. 실측 컬럼에 기관코드 같은 전역 조인 키가 없어, 같은 강남구 의료관광DB의 다른 언어판이나 기관 상세정보와는 기관명 매핑으로만 이을 수 있다.
