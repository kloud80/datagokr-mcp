summary_user: 국립중앙극장 공연예술박물관이 소장한 공연예술 자료를 자료 한 건 단위로 담은 소장목록 파일로, 생산년도·폴더번호·자료번호·자료유형·매체유형·자료명·원본 여부·기증자료 및 중요자료 여부를 포함하며 전국 단위의 비공간 데이터입니다. 연구자나 아카이브 이용자가 특정 공연과 관련해 박물관에 어떤 유형·매체의 자료(원본, 기증품 등)가 남아 있는지 찾을 때 쓴다. 실측 컬럼에서 KOPIS 공연ID·공연장ID 같은 전역 조인 키를 찾지 못해 다른 공연 데이터와는 자료명 등 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 국립중앙극장 공연예술박물관에서 소장하고 있는 공연예술 정보에 대한 자료정보 데이터베이스입니다.  생산년도, 폴더번호, 자료번호, 자료유형, 매체유형, 자료명, 원본구분, 기증자료, 중요자료 여부 등의 정보를 제공합니다.본 공공데이터는 2016년부터 2025년 상반기에 구축된 데이터이며, 연 단위로 신규 등록된 데이터를 업데이트하고 있는 최신 정보입니다.   목록 상의 자료정보는 공연예술박물관 누리집인 공연예술 아카이브 플랫폼 "별별스테이지"에도 공개되어 있으니 참고하시기 바랍니다.
