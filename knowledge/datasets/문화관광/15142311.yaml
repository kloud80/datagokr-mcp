summary_user: 광주광역시 관내 파크골프장을 시설 한 곳당 한 행으로 정리한 소규모 목록 파일(csv 896바이트)로, 시설명·위치·면적(규모)·홀수·운영기관·연락처를 담는다. 시민이나 생활체육 담당자가 '집 근처에서 18홀 이상 파크골프장은 어디이고 어느 기관에 문의하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설·인허가 데이터와는 시설명이나 위치(주소)를 문자로 맞춰 붙여야 한다.
description_portal: 본 데이터는 광주광역시 관내 파크골프장 현황을 정리한 자료로, 연번, 시설명, 위치, 규모, 홀수, 운영기관, 연락처 항목으로 구성되어 있습니다. 염주파크골프장은 11,847㎡ 규모의 9홀 시설이며 시체육회에서 운영하고 있습니다. 첨단체육공원파크골프장은 5,091㎡, 대상파크골프장은 17,074㎡ 규모이며 각각 9홀과 18홀로 구성되어 있습니다. 효령파크골프장과 무등산파크골프장은 각각 효령노인복지타운, 광주광역시 동구체육회에서 운영하고 있으며 9홀 규모입니다. 승촌파크골프장은 38,335㎡ 규모의 36홀 대형 시설로 남구청과 남구체육회가 운영하고 있으며, 북구파크골프장은 34,336㎡의 36홀 규모로 북구시설관리공단이 운영합니다. 서봉파크골프장과 임곡파크골프장은 광산구에서 운영하는 시설로 36홀 및 9홀 구성입니다. 본 자료는 2025년 3월 11일 기준으로 구성된 파크골프장 시설 정보입니다.
