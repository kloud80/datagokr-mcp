summary_user: 인천광역시 서구(서해구) 안에 지정된 문화재자료를 한 건씩 담은 목록 파일로, 명칭·지정번호·지정일자·소재지·소유자와 수량·가로·세로 크기를 개별 문화재 단위로 담는다(CSV 777바이트의 소규모 파일). 지역 주민이나 교사, 도시계획 담당자가 '서구에 어떤 문화재자료가 어디에 있고 언제 지정됐는가'를 확인할 때 쓴다. 전역 조인 키는 없어서 다른 문화유산 데이터와는 명칭이나 지정번호를 직접 맞추거나 소재지 주소를 기준으로 이어 써야 한다.
limits: 표준 코드 형태의 조인 키가 없어 국가유산 목록 등과 자동으로 연결되지 않고, 이름·주소 매핑에 의존해야 한다. 관람 정보나 행사·관리 이력은 이 데이터의 대상이 아니며, 범위는 서구 한 시군구에 한정된다.
