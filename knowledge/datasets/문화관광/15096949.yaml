description_portal: '"제주특별자치도 내 중국인 관광객 방한 시 방문 지역 통계 데이터를 제공합니다.항목: 연도, 방문지역, 비율 등* 한국을 방문한 중국인 관광객 중에서 제주특별자치도를 방문한 비율을 연도별로 정리한 통계자료입니다. 즉, 중국인 방한객 전체 중 제주를 여행지로 선택하는 관광객의 비중이 시계열로 어떻게 변화해 왔는지를 보여주고 있습니다. 제주관광의 국제적 인지도 및 매력도, 외국 관광객 유치 전략, 관광업 마케팅의 효과 측정 등에 기반이 되는 핵심 지표입니다.* 활용 분야 : 관광 유치 마케팅 전략 수립, 항공 및 교통 서비스 계획, 숙박·관광 인프라 배치 및 수요 예측 등"'
