description_portal: 이 데이터는 통계 작성과 지역 단위 분석을 위해 구축한 광역·기초 행정구역 기준 테이블이다. 각 레코드는 ‘지역코드(ADDR_CD)’를 통해 광역시·도 및 시·군·구 단위를 식별하며, 상위 행정단위를 나타내는 ‘상위지역코드(PRNT_ADDR_CD)’를 함께 저장하여 광역–기초 간 계층 구조를 표현한다. ‘최종 행정구역명’ 항목에는 광역 수준일 경우 시·도명, 기초 수준일 경우 시·군·구명이 입력되며, 광역단위에 대해서는 화면 표출과 보고서 작성을 위한 ‘줄임행정구역명(SHORT_NM)’이 별도로 제공된다. 또한 ‘광역_기초_구분코드(ADDR_LV_FL)’를 통해 해당 코드가 광역(W)인지 기초(L)인지를 구분할 수 있다. 이 테이블은 여러 통계자료에 포함된 지역 정보를 공통 코드로 연계하고, 광역·기초 단위별 집계·비교 분석을 수행하기 위한 기준 자료로 활용되며, 행정구역 체계 변화에도 일관된 지역 단위 통계를 제공하는 데 기여한다.
