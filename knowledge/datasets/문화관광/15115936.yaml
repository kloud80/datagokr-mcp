summary_user: 서울특별시 중구에 등록된 게임물배급업 업소를 건별로 담은 인허가 원천 데이터로, 관리번호·인허가일·영업상태(등록·폐업 등)·지번/도로명 주소·중부원점TM 좌표를 업소 단위로 제공한다. 게임 유통업 창업을 준비하는 예비 사업자가 '중구에 영업 중인 게임물 배급업체가 몇 곳이고 어디에 몰려 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 같은 서울시 인허가 체계의 다른 업종·자치구 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호나 주소·좌표로 맞춰 이어 쓴다.
description_portal: '서울특별시 중구의 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 업소 정보입니다. 각 등록 업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지현황 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화산업 분야의 IT산업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 유통경로 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 등급분류 등 법적 절차를 거친 건전한 게임물을 콘텐츠공급하는 문화산업 업체를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
