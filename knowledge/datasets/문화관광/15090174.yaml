summary_user: 국립중앙극장 공연예술박물관이 소장한 공연예술자료와 관련된 공연예술단체·기관 등 조직을 한 건씩 담은 목록 파일로, 관리기관명·조직유형·조직명·유형 상세 설명(비고)·등록일을 담고 포털 설명상 2013~2016년에 구축된 데이터다. 연구자나 아카이브 담당자가 '박물관 소장자료에 등장하는 극단·예술단체가 어떤 유형으로 분류되어 있는가'를 확인하는 데 쓴다. 자체 조직코드는 있으나 전역 조인 키가 없어 KOPIS 공연ID·공연장ID 등과 직접 연결되지 않고, 조직명 문자열 매칭으로만 다른 공연 데이터와 이어 쓴다.
description_portal: 국립중앙극장 공연예술박물관에서 소장하고 있는 공연예술자료의 공연예술단체 및 기관 등과 같은 조직 관련 데이터베이스입니다.  관리기관 명칭, 조직유형, 조직명, 비고(조직 유형의 상세 설명), 등록일의 정보를 제공합니다.본 공공데이터는 2013년부터 2016년 까지 구축된 데이터이며, 이후로는 참여인력(출연진, 스태프, 제작)으로 데이터를 구축하고 있습니다. 참여인력 정보는 공연예술박물관 누리집인 공연예술 아카이브 플랫폼 "별별스테이지"에 공개되어 있으니 참고하시기 바랍니다.
