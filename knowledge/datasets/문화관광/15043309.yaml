summary_user: 국가유산진흥원이 운영하는 등록 민간자격인 국가유산교육사의 연도별·등급별(1~3급) 접수자 수와 취득자 수를 담은 전국 단위 집계 파일로, 자격명·발급기관·등록번호가 함께 들어 있다. 문화유산 교육 정책 담당자나 연구자가 '국가유산교육사 자격 취득자가 해마다 등급별로 얼마나 늘었고 접수 대비 취득 비율은 어떤가'를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도나 자격명·기관명을 기준으로 수작업으로 맞춰 이어 써야 한다.
description_portal: '본 데이터는 국가유산교육 강사의 체계적 양성과 역량 강화를 위한 국가유산교육사 자격제도 운영 현황을 제공합니다. 해당 자격은 문화유산 교육 분야의 전문 인력을 육성하기 위한 민간자격으로, 본 데이터에는 국가유산교육사 자격의 등급별 접수자 수, 자격취득자 수, 발급기관 정보, 자격 등록번호 등 주요 지표가 포함되어 있습니다.제공 항목은 다음과 같습니다.자격명칭: 국가유산교육사자격등급: 1급, 2급, 3급발급기관: 국가유산진흥원자격구분: 등록 민간자격등록번호: 2019-001567등급별 접수자 수 및 취득자 수본 데이터는 문화유산 교육 관련 정책 수립, 교육사 자격 제도 운영 성과 분석, 민간자격 제도 개선, 국가유산 교육 수요 예측, 교육인력 공급 현황 파악 등에 활용될 수 있으며, 자격 제도 관련 연구와 통계 분석의 기초자료로도 유용하게 활용됩니다.본 데이터는 매년 갱신되며, 국가유산교육사 자격제도에 대한 자세한 내용은 아래 국가유산진흥원 누리집에서 확인하실 수 있습니다.국가유산교육사 자격제도 안내 링크: www.kh.or.kr/cms/content/view/1487'
