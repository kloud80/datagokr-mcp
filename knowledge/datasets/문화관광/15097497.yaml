summary_user: 제주 이호테우해변과 내도동 알작지 두 곳의 무장애 여행 정보를 구분·유형·추천여부·비고 항목으로 담은 지자체 파일로, 포털 설명상 코스 개요, 주소·위치, 주차장·화장실 같은 편의시설, 관람료·휴무일 등 운영 정보가 들어 있다. 휠체어 이용자나 고령자, 교통약자와 동행하는 가족이 "이호테우해변이나 알작지에 장애인 주차장과 화장실이 있고 접근이 수월한가"를 여행 전에 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: '제주특별자치도 내 이호테우해변과내도동알작지_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도_이호테우해변과 내도동 알작지 무장애여행관광정보로, 제주특별자치도 디지털혁신과에서 제공한 무장애(Barrier-free) 관광 정보 자료이다. 이호테우해변과 내도동 알작지 지역에 대해 코스 개요, 주소 및 지리적 위치, 주차장 및 화장실 등의 편의시설, 관람료 및 휴무일 등의 운영 정보, 각 포인트별 사진 이미지 자료 등이 포함되어 있다. 해당 정보는 교통약자, 고령자, 장애인 등이 사전에 정보를 확보함으로써 여행 계획을 보다 안전하고 편리하게 할 수 있게 돕는다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
