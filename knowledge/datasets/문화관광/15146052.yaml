description_portal: '"서울시 서남권(강서구, 관악구, 구로구, 금천구, 동작구, 양천구, 영등포구) 공공도서관 46개관의 Trusewell 80_20에 따른 대출 현황 정보※ Trusewell의 80_20 법칙 : 특정 도서관에서 20%의 도서가 전체대출량의 80%를 만족한다는 법칙으로 총대출 도서의 80%(핵심도서)가 소장도서의 몇 %에 해당하는지 분석* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함"'
