summary_user: 장흥군 관내 농어촌민박과 펜션을 업체 한 곳당 한 행으로, 소재 읍·면, 업종 구분(펜션/농어촌민박), 업체명, 객실 수를 담은 4KB 남짓의 시군구 단위 CSV 파일이다. 장흥군에서 읍·면별로 민박·펜션이 몇 곳이고 객실이 얼마나 되는지 알고 싶은 관광객·숙박 사업자·지역관광 분석가가 숙박 공급 분포와 수용력을 가늠하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면명·업체명 같은 이름 매칭으로만 이어 쓰며, 공중위생 숙박업 인허가 자료(LOCALDATA)와 대조하는 용도가 대표적이다.
description_portal: 장흥군 관내 농어촌민박과 펜션의 소속 지역(읍·면), 업종 구분(펜션/농어촌민박), 업체명, 객실 수 등 주요 정보를 제공합니다. 관광정책 수립, 숙박 수급 분석, 지역관광 활성화 및 민박업 안전관리·통계 작성에 활용 가능합니다. 제공형식은 CSVN이며 주기적으로 갱신되고 개인정보는 비식별 처리되어 있습니다. 또한 지역별 숙박시설 분포 파악과 관광객 수용력 분석에도 활용될 수 있습니다. 공공기관, 연구기관, 지자체 등에서 정책 연구나 관광산업 발전 자료로 다양하게 이용될 수 있으니 참고바랍니다.
