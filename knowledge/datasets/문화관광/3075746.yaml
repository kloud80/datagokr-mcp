description_portal: 부산광역시 해운대구에 등록된 국내, 국내외, 종합여행업에 대한 데이터로 업종, 상호, 소재지, 연락처의 등록에 대한 현황자료입니다.여행업은 여행자 또는 운송시설·숙박시설, 그 밖에 여행에 딸리는 시설의 경영자 등을 위하여 그 시설의 이용 알선이나 계약 체결의 대리, 여행에 관한 안내, 그 밖의 여행 편의를 제공하는 업을 말한다.종합여행업은 국내외를 여행하는 내/외국인을 대상으로 하는 여행업,  국내외여행업은 국내외를 여행하는 내국인을 대상으로 하는 여행업,  국내여행업은 국내를 여행하는 내국인을 대상으로 하는 여행업을 말한다.
