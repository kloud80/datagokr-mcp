summary_user: 경기도 고양시에 등록된 정기간행물을 한 건씩 담은 등록 현황 파일로, 시군구·제호(정기간행물명)·발행인·등록일자를 담으며 크기는 약 5.9KB(csv)인 시군구 단위 원장이다. 고양시에 어떤 잡지·간행물이 언제 누구 명의로 등록됐는지 확인하려는 시민·언론 연구자나 지역 매체 현황을 파악하려는 분석가가 쓴다. 전역 조인 키(등록번호·사업자번호 등)가 실측 컬럼에 없어 다른 시군의 정기간행물 등록 현황과는 제호·발행인 이름이나 같은 기관 기준으로만 맞춰 이어 쓴다.
