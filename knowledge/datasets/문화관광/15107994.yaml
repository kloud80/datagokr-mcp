summary_user: 유네스코 세계유산으로 등재된 한국 유산을 유산 한 건당 한 행으로 정리한 전국 범위의 목록 파일로, 유산 명칭과 해설 내용, 세계유산적 가치, 관련 링크를 담는다. 교육·관광 콘텐츠 제작자나 연구자가 '한국의 세계유산은 무엇이며 각각 어떤 가치를 인정받아 등재됐는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(종목코드·지정번호, 소재지 PNU 등)가 없어 국가유산청의 다른 지정·등록 유산 데이터와는 유산 명칭을 맞춰 연결해야 한다.
description_portal: '유네스코 세계유산으로 등재된 한국의 15개 세계유산에 관한 내용 및 해설, 등재 기준/유산의 가치 정보 등을 데이터로 제공합니다.“국가유산청_한국의 유네스코 세계유산 정보”는 유네스코 세계유산으로 등재된 대한민국의 유산 목록 및 상세 정보를 수록한 데이터입니다. 이 자료는 문화유산·자연유산·복합유산 등 유네스코에 공식 등재된 유산들의 명칭, 위치, 등재 연도, 가치 기준, 설명 등을 포함하고 있어, 국제적 문화유산 관리와 연구, 교육, 관광 콘텐츠 제작 등 다양한 분야에서 활용됩니다.📌 기본 정보대상: 유네스코 세계유산으로 등재된 대한민국 소재 유산형태: 표 형식 데이터(엑셀, DB 등) 또는 설명문서(PDF)관리기관: 국가유산청, 유네스코한국위원회 등라이선스: 공공저작물 – 출처 표기 시 자유 이용 가능🛠 데이터 구성기본 항목:유산 명칭 (예: 종묘, 해인사 장경판전, 백제역사유적지구 등)등재 연도 및 결정 회차 (예: 1995년 제19차 세계유산위원회 등재)위치 (도시/도 또는 위도·경도 좌표)유산 유형 (문화유산 / 자연유산 / 복합유산)유네스코 등재 기준 (i~x 중 해당 기준)간략 설명 및 역사적 가치보존 관리 기관 또는 지역사진 및 관련 자료 링크🎯 활용 분야세계유산 관리 및 보존 정책 수립학술 연구 및 문화유산 교육 자료관광 정보 제공 및 콘텐츠 개발 (예: AR/VR 투어, 앱, 영상)국제 협력사업 기획 및 유네스코 보고서 작성지역 브랜드 및 문화도시 개발 기반 자료이 데이터는 대한민국이 보유한 세계적 수준의 문화·자연유산 목록과 핵심 정보를 집대성한 자료로, 문화유산을 통한 국제적 위상 강화, 지역 발전 도모, 디지털 전환 기반 구축 등 다양한 분야에서 폭넓게 활용되고 있습니다.'
