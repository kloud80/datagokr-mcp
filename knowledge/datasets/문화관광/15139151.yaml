description_portal: '경기도 군포시의 그림책복합문화공간인 그림책꿈마루에서 진행하는 그림책 관련 전시, 교육, 강연, 공연 등 문화행사에 대한 기본 정보와 참여를 위한 신청 내역으로 구성된 데이터입니다.  ○ 시 설 명 : 그림책꿈마루 ○ 위      치 : 경기도 군포시 청백리길 16○ 주요 사업 : 그림책 관련 전시, 교육, 강연, 공연 및 기타 체험 프로그램○ 기본 정보 : 행사명, 행사기간, 행사내용, 행사대상, 행사장소, 강사, 정원 , 접수기간, 참여비용  등본 데이터는 그림책꿈마루 프로그램 운영 현황을 파악하고, 지역 주민에게 정보를 제공하기 위한 기초 자료로 활용될 수 있으며, 연간 추진 일정에 따라 등록되며 일정에 따라 변경 등록될 수 있습니다.'
