summary_user: 대구광역시 달성군에서 영업하는 체육시설업 사업장을 업소별로 한 행씩 담은 명부 파일로, 업소명·업종·소재지·전화번호·영업시간과 위도·경도 좌표를 포함한다. 주민이나 창업자가 달성군 안에 헬스장·당구장·체육도장 같은 민간 체육시설이 어디에 얼마나 몰려 있는지 확인하거나, 분석가가 상권 분석에서 체육시설 분포를 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어서 다른 데이터와는 업소명·주소 매칭이나 위도·경도 기반 공간 결합으로만 이어 쓴다.
