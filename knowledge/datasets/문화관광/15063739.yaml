summary_user: 부산광역시에서 열린 콘서트를 공연 한 건씩 담은 목록으로, 콘서트 제목·공연 시작일과 종료일·오픈런 여부·유료 여부·공연장 이름 등이 들어 있다. 부산 시민이나 공연 기획자가 특정 기간에 어느 공연장에서 어떤 콘서트가 열렸는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 KOPIS 공연ID·공연장ID와 바로 이을 수 없고, 공연장 이름(place_nm)이나 제목을 기준으로 이름 매칭해야 한다.
description_portal: 부산광역시 내에서 개최된 콘서트 목록 데이터를 개방합니다.콘서트(Concert)는 음악을 공연하는 행사로, 가수, 밴드, 오케스트라 등이 무대에서 직접 관객 앞에서 연주하거나 노래를 부르는 라이브 음악 공연을 의미합니다.실시간 공연, 관객과의 소통, 화려한 조명과 의상 등을 특징으로 하는 콘서트는 팝/대중음악, 클래식, 재즈/록, 코미디, 마술쇼 등 다양한 종류가 있습니다.라이브의 감동, 아티스트와 팬의 교감, 현장의 뜨거운 열기등은 콘서트의 매력이기도 합니다.개방되는 데이터에는 콘서트 제목, 공연기간, 오픈런, 공연장 명 등의 데이터가 포함되어 있습니다.
