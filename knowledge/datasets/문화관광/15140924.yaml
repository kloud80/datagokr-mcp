summary_user: 서울 광진구에서 영화배급업 인허가를 받은 업소를 한 곳씩 담은 건별 인허가 자료로, 사업장명·인허가일자·폐업일자·영업상태·지번/도로명 주소·좌표(X, Y) 등을 포함하며 범위는 광진구 한 곳입니다. 영화 유통업 창업을 검토하는 사업자나 지역 콘텐츠 산업을 보는 분석가가 '광진구에 영업 중인 영화배급사는 몇 곳이고 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 영화배급업 인허가를 받아 운영 중인 업소 현황을 정리한 자료입니다. 영화배급업은 극장, 방송, 온라인 플랫폼 등 다양한 경로를 통해 영화 콘텐츠를 유통·공급하는 전문 사업체를 대상으로 하며, 배급사명, 소재지, 업종 구분, 인허가일자 등의 항목이 포함됩니다. 이 데이터는 지역 내 영상 콘텐츠 산업 구조 파악, 영화 유통 네트워크 분석, 문화산업 진흥 정책 수립 등에 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84) 좌표는 포함되어 있지 않아 지도 연계 시 별도 변환이 필요합니다. 본 데이터는 3일 전 기준으로 정기적으로 갱신되며, 영화산업 관계자, 정책 담당자, 연구자 등이 활용할 수 있는 기초 공공데이터입니다.
