description_portal: 전천후 게이트볼장이라는 말은 “비, 눈, 햇빛 등 날씨와 관계없이 이용 가능한 구조(지붕이나 덮개가 있는)” 게이트볼 시설입니다.게이트볼은 노년층을 중심으로 커뮤니티 및 여가스포츠 역할을 하며, 접근성과 시설 환경이 중요하기에충청북도에는 도민들의 건강한 체육활동을 위한 전천후 게이트볼장이 여러 곳 있습니다.붙임파일을 보시면 현재 도내의 게이트볼장(115개소)에 대한 소재시군, 도로명주소, 건축면적, 규격, 관리기관, 연락처 등에 대해 알 수 있습니다.더 궁금한 사항이 있으실 경우 각 시군에 문의하시면 더 상세한 정보를 얻으실 수 있습니다.
