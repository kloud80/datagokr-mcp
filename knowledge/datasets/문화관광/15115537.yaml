summary_user: 전국 해수욕장별 2023년 이용객 수를 시도·시군구·해수욕장명과 함께 담은 연간 집계 파일로, 관리주체인 지자체에서 취합한 자료이며 행정단위는 시군구까지다. 지자체·관광 분석가가 '2023년 여름 어느 시군구 해수욕장에 이용객이 몰렸는가'처럼 지역별 해수욕장 방문 분포를 비교하는 데 쓴다. 실측 컬럼에 시군구코드 같은 전역 조인 키가 없어, 다른 관광 통계나 지역 데이터와는 시도·시군구 이름을 코드로 매핑해 이어 써야 한다.
limits: 2023년 한 해의 연간 이용객 수만 있어 월별·일별 추이나 다른 연도와의 비교는 이 파일로 할 수 없다. 표준 지역코드·관광지점코드가 없어 다른 데이터와 붙일 때 이름 매칭 오류에 주의해야 한다.
