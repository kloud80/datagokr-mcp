summary_user: 경기도 내 기타 유원시설업체(캠핑장·소규모 놀이시설 등)를 사업장 단위로 담은 현황으로, 사업장명·인허가일·폐업일·영업상태·시설면적·놀이시설 수·주소와 위경도 좌표를 포함한다. 여가 인프라를 보는 분석가나 이용자가 "우리 시군에서 지금 영업 중인 기타 유원시설은 어디에 몇 곳 있는가" 같은 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군 코드(SIGUN_CD)·사업장명·주소 매핑이나 위경도 좌표로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 유원시설업체(캠핑장, 테마파크 등 기타 여가·오락시설)의 운영 현황을 정리한 자료입니다. 유원시설은 주민과 관광객에게 여가·휴식 공간을 제공하는 지역 문화자원으로, 본 자료를 통해 시설의 분포, 운영 현황, 규모 등을 파악할 수 있습니다. 특히 캠핑장과 소규모 놀이시설이 다수 포함되어 있어 최근 증가하는 생활형 관광·체험 수요를 반영하며, 안전관리 및 보험 가입 여부 등의 항목은 이용자 보호와 직결됩니다. 이 데이터는 관광 정책 수립, 지역경제 활성화 전략, 여가 인프라 확충 계획, 안전관리 체계 마련 등에 기초자료로 활용될 수 있습니다.
