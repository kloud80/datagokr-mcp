description_portal: 이 데이터는 광양시에 조성된 공원 정보 DB를 민간에서 자유롭게 활용할 수 있도록 표준화하여 관리할 수 있는 체계를 마련한 자료입니다. 공원 관련 정보를 지도데이터와 속성데이터로 분류해 제공함으로써, 위치 기반 서비스뿐만 아니라 공원 시설, 운영 현황 등 세부 속성까지 체계적으로 관리할 수 있습니다. 이를 통해 다양한 개별 서비스에 적용할 수 있는 표준 연계 방법을 지원하며, 이용자가 쉽게 활용 가능한 형태의 파일 서비스로 제공됩니다. 이러한 기반은 관광, 도시계획, 환경 관리, 안전 점검 등 여러 분야에서 활용할 수 있으며, 특히 다양한 Mash-Up 서비스 개발을 가능하게 하여 스마트 행정과 민간 서비스 혁신을 동시에 촉진합니다. 나아가 공공데이터 개방과 시민 참여형 서비스 확대에도 기여할 수 있는 핵심 인프라로서 가치가 큽니다.
