description_portal: 이 데이터는 온라인면세점에서 고객 또는 관리자에게 발송되는 SMS메시지의 정보를 관리하는 데이터입니다. 각종 프로모션과 안내사항을 고객에게 쉽게 전달하기 위해 연락처를 이용한 SMS발송 데이터가 저장되며, 관리자에게는 각종 문의사항 및 알림사항을 실시간으로 확인할 수 있도록 SMS메시지를 발송하고 있습니다. 데이터 항목으로는 일련번호, 제목, 발송메시지, 발송요청일시로 구성되어 있습니다. 일련번호는 발송메시지를 식별할 수 있도록 자동으로 부여되는 숫자형식의 데이터입니다. 제목은 SMS발송을 할때 메시지 첫 상단에 보여지는 제목 정보를 뜻하며, 발송메시지는 어떤 내용을 고객에게 전달 또는 알릴지에 대한 구체적인 내용이 저장됩니다. 발송요청일시는 해당 메시지를 즉시 발송할지, 또는 예약발송할지를 정할 수 있도록 발송을 원하는 일자와 시간을 뜻합니다.
