description_portal: 휠체어 출입 가능한 음식점(업장, 화장실) 현황입니다. 항목은 번호, 업소명, 소재지, 주메뉴, 전화번호, 영업장, 화장실입니다.휠체어 출입 가능 음식점 데이터는 도로 접근로, 출입문 형태(무턱 또는 경사로 포함), 실내 테이블 간 거리, 1층 위치 여부 등 물리적 접근성 정보를 중심으로 음식업소를 정리한 자료입니다. 이 데이터는 장애인·노약자 접근성 향상, 관광·문화시설 안내, 소상공인 배치 전략, 민원 대응 및 위생·편의 정책 수립, 공간 기반 이벤트 기획 등에 활용될 수 있으며, GIS 기반 시각화 결합 시 접근성 개선 지역 선별 및 안내지도로 활용할 수 있는 핵심 기초자료로 기능합니다.
