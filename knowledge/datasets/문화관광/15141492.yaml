summary_user: 서울 종로구 안 관광공연장업 업소를 건별로 담은 인허가 원천 자료로, 업소마다 관리번호·인허가일자·취소일자·영업상태(영업/폐업 등)·폐업일자·주소·좌표와 무대면적·객석 수 같은 시설 정보를 담는다. 종로구에서 지금 영업 중인 관광공연장이 어디이고 언제 새로 생기거나 문을 닫았는지 확인하려는 사업자·정책 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했다. 그래서 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 지자체 코드(OPNSFTEAMCODE)로만 잇고, KOPIS 공연장ID(mt10id)와 직접 맞물리는 키는 없다.
description_portal: 본 데이터는 서울특별시 종로구 내 관광공연장업에 대한 인허가 정보를 수록한 자료입니다. 항목에는 지방자치단체 코드, 고유 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 관광진흥법령에 따라 등록된 공연장 업소에 대한 행정정보를 제공합니다. 관광공연장업은 관광객을 대상으로 음악, 무용, 연극 등의 공연을 기획·운영하는 시설로, 지역 문화 진흥과 관광 활성화에 기여하는 주요 업종입니다. 본 데이터는 업종별 현황 파악, 지역 문화정책 수립, 시설 운영 실태 분석, 폐업 및 신규업소 동향 모니터링 등에 활용될 수 있습니다. 해당 정보는 종로구청 및 관계 기관에서 관리하며, 공공데이터 개방 지침에 따라 정기적으로 갱신되어 제공됩니다.
