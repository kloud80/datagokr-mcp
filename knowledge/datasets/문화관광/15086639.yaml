description_portal: '사용전검사란 연면적 150㎡초과 ~ 5,000㎡미만 신·증축 건축허가 대상 건축물에 대하여 준공허가 전에 동 정보통신설비가 관련 기술기준에 적합하게 시공되었는지의 여부를 판단하는 검사이다. 정보통신설비란 구내통신선로설비, 방송공동수신설비 (의무사항 : 공동주택 및 바닥면적 5,000㎡이상의 업무시설,숙박시설), 이동통신구내선로설비 (의무사항 : 건축물의 지하층 및 특정시설 지상층)를 의미하며, 해당 검사신청 시 소요되는 수수료에 대한 데이터이다.본 자료는 민원인의 수수료 예측 및 제출서류 준비를 위한 행정 서비스 편의 제공을 목적으로 제공된다.'
