summary_user: 부산광역시 기장군이 운영하는 공공체육시설을 시설 한 곳당 한 행으로 정리한 소규모 파일(csv 약 2KB)로, 시설명·위치·예약방법·전화번호·보유 시설을 담는다. 기장군 주민이나 방문객이 "근처에서 예약해 쓸 수 있는 수영장이나 야구장이 어디이고 어떻게 예약하나"를 확인하거나, 분석가가 군 단위 체육시설 현황을 정리할 때 쓴다. 전역 조인 키나 코드 필드가 없어 다른 데이터와는 시설명·위치(주소) 문자열을 맞춰 연결해야 하며, 문체부 전국체육시설 DB나 광역 단위 예약 데이터와 이름 매칭으로 대조하는 방식이 현실적이다.
limits: 기장군 한 시군구 범위만 담고 좌표가 없는 비공간 데이터라 지도 매핑에는 위치 문자열의 별도 지오코딩이 필요하다. 표준 시설코드 같은 공통 키가 없어 다른 기관 데이터와의 연결은 이름·주소 매칭에 의존한다. 예약방법은 안내 문구 수준이며 실시간 예약 가능 여부는 담지 않는다.
