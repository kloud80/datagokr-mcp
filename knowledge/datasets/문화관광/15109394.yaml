summary_user: 경주시 관내에서 운영 중인 콘도미니엄을 숙소 한 곳당 한 건으로 담은 목록으로, 명칭·전화번호·주소·홈페이지가 들어 있고 위치는 개별 주소·좌표 단위다. 관광객이나 여행 서비스 개발자가 '경주에 어떤 콘도가 있고 연락처와 주소는 어떻게 되는가'를 확인하거나 숙소 안내·검색 화면에 띄우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 숙박·인허가 데이터와는 콘도 이름(CNDMNM_NM)이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 오픈API는 경주시 관내에서 운영 중인 콘도미니엄 현황 정보를 REST 형식으로 제공한다. 숙소별로 명칭, 주소, 연락처, 객실 수, 주차 가능 여부, 위치 좌표, 업종 분류 등 다양한 항목이 포함되어 있으며, 시민과 관광객이 지역 숙박시설 정보를 쉽게 확인하고 활용할 수 있도록 구성되어 있다. 이를 통해 외부 시스템이나 모바일 앱에서 숙소 정보를 연계 활용할 수 있어 접근성과 편의성이 향상된다. 본 데이터는 숙소 안내 서비스, 검색 플랫폼, 지역 홍보, 여행 추천 등 다양한 분야에 활용된다. 또한 표준화된 데이터 구조로 제공되어 개발자와 일반 사용자 모두 편리하게 사용할 수 있으며, 공공데이터포털을 통해 무료로 접근·조회 가능한 공공서비스 데이터이다.
