summary_user: 인천광역시 서구(제목상 서해구) 관내 민간 체육시설업소를 업소 한 곳당 한 행으로 담은 명부로, 업종·상호·지번 및 도로명 주소·전화번호·데이터기준일자를 시군구 범위에서 개별 주소 단위로 제공한다. 구민이나 사업자가 '우리 동네에 헬스장·당구장·체육도장이 어디에 몇 곳 있나'를 확인하거나, 분석가가 체육시설업 분포를 상권 신호로 볼 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관 데이터로만 이어 쓴다.
limits: 전역 조인 키가 없어 LOCALDATA 인허가 데이터나 상권 데이터와 정확히 1:1로 연결되지 않고, 상호·주소 매칭에 의존해야 한다. 범위가 서구 한 개 시군구에 한정되어 다른 지역과의 비교에는 별도 데이터가 필요하다.
