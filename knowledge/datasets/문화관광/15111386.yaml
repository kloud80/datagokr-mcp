summary_user: 전국 배리어프리 문화예술·관광 시설을 한 행에 한 곳씩 담은 건별 목록으로, 시설명·분류·주소(도로명·지번)·위경도·운영시간과 장애인용 출입문, 휠체어 대여, 장애인 화장실·전용 주차장, 안내견 동반, 점자·오디오 가이드 여부 같은 접근성 항목을 담는다. 휠체어 이용자나 시각장애인 가족이 '우리 지역에서 휠체어를 빌릴 수 있고 장애인 화장실이 있는 박물관·관광지는 어디인가'를 찾을 때, 복지기관·정책 담당자가 지역별 접근성 편의시설 분포를 파악할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소 이름 매칭이나 위도·경도 좌표 기준 공간 결합으로 이어 쓴다.
description_portal: 전국의 배리어프리 문화예술관광지 정보를 제공하여 장애인과 교통약자도 편리하게 문화예술 및 관광을 즐길 수 있도록 지원합니다. 시설명, 위치, 운영시간, 휠체어 대여, 전용 주차장, 점자 가이드, 시각장애인 안내견 동반 가능 여부 등 다양한 접근성 정보를 포함하고 있습니다. 이 데이터는 여행자, 복지기관, 정책 담당자 등이 장애인 친화적 관광지와 문화시설을 찾고, 접근성 개선 정책을 수립하는 데 활용할 수 있습니다. 데이터는 수시로 업데이트되지만, 실제 방문 전에는 시설의 편의시설 현황을 직접 확인하는 것이 정확합니다.
