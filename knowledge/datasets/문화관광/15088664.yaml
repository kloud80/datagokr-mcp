summary_user: 문화재수리업으로 등록된 업체를 한 행씩 담은 전국 단위 업체 목록 파일로, 시도명·업종·등록번호·상호·영업장 소재지·연락처·등록일을 담는다. 문화재 보수 공사를 발주하는 기관이나 사업자가 '우리 지역에 등록된 특정 업종의 문화재수리업체가 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 상호·등록번호나 영업장 주소를 기준으로 이름·주소 매칭을 해야 다른 데이터와 이어 쓸 수 있다.
description_portal: '문화재수리업자 현황입니다. 문화재수리업으로 등록된 수리업체 현황을 시도, 업종, 등록번호, 상호, 주소 등 정보를 확인할 수 있습니다.“국가유산청_문화재수리업자 현황” 데이터는 문화재 수리업자로 등록된 업체들의 등록 정보, 활동 현황, 설립 형태, 기술 종목, 주요 담당 문화재, 사업 범위 등을 포함하고 있는 공공데이터입니다. 이 데이터는 문화재 보존·복원 분야에서 공식 수리 허가를 받은 기업과 단체들의 실태를 한눈에 파악할 수 있다는 점에서 큰 의의가 있습니다. 일반적으로 포함된 정보로는 업체명, 대표자, 설립 연도, 주사무소 및 지점 주소, 등록일 및 갱신일, 보유 기술 종목(예: 단청, 목조구조물, 석조·미술·조경·채색 등), 최근 완료 또는 진행 중인 주요 문화재 수리 사업 내역, 인증 및 수상 이력 등이 포함됩니다.이 데이터는 문화재청 및 국가유산청이 문화재 수리업체의 투명성과 전문성을 확보하기 위해 관리하는 자료로, 문화재 수리 실명제와도 연관되어 있습니다. 따라서 공공 모니터링, 정책 수립, 학계 및 산업계 연구, 관련 교육·훈련, 수리 업체 선별 및 발주 업무 등에 널리 활용됩니다. 데이터는 공공데이터포털을 통해 CSV, XML, JSON 등의 형식으로 다운로드할 수 있고, API 연동도 지원되어 학술, 행정, 기업 단위의 분석 및 시스템 통합에 적합합니다.'
