summary_user: 전국 단위 문화체육관광 부문 지수와 전체 산업 지수를 날짜(년월일)별로 나란히 담은 집계 시계열 CSV 파일(약 5.7KB)로, 건별 원천 자료가 아니다. 분석가나 정책 담당자가 '문화·체육·관광 부문의 가격 또는 생산 흐름이 전체 산업과 비교해 언제 더 오르거나 꺾였는가'를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜 기준으로만 맞춰 붙이며, 같은 기간의 관광객 수나 소비 지출 같은 다른 시계열과 나란히 놓고 비교하는 방식으로 쓴다.
description_portal: 국내생산자가 국내시장에 공급하는 문화체육관광 산업 관련 상품과 서비스의 가격변동을 종합적으로 파악하기 위해 작성한 지수를 뜻한다. 문화체육관광 서비스업생산지수는 문화·체육·관광 산업 전반의 생산활동 변화를 종합적으로 측정하여 지수화한 국가 승인 통계이다. 본 지수는 문화예술, 스포츠, 관광, 여가, 오락, 숙박, 음식, 출판, 영상, 공연, 전시, 광고, 전문서비스 등 다수의 세부 산업 부문을 포함하며, 각 부문의 월별 생산 수준을 체계적으로 집계한다. 이를 통해 경기 변동과 산업 성장세, 소비자 활동 양상, 서비스 수요 변화를 객관적으로 분석할 수 있다. 문화체육관광 서비스업은 국민 생활의 질, 여가 활용 방식, 고용 창출, 지역 경제 활성화, 국가 경쟁력 강화와 직결되는 산업으로, 해당 지표의 정책적 파급효과가 크다. 따라서 이 데이터는 정부의 문화·관광 정책 수립, 산업 지원 전략, 투자계획, 지역균형 발전 방안 마련 등 공공 부문에서 폭넓게 활용된다. 또한 학계와 연구기관에서는 산업 구조 변화 분석, 소비 패턴 연구, 국제 비교 분석 등에 기초자료로 사용하며, 민간 기업과 산업계에서도 시장 진단 및 사업 전략 수립에 참조할 수 있다. 한국문화관광연구원은 통계청 등 관계기관과 협력하여 본 지수를 산출·개방함으로써 정책 활용과 산업 연구를 동시에 지원한다.
