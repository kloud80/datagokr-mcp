description_portal: 이 데이터는 주요 관광통계 및 조사 통계에 대한 설명 정보를 체계적으로 관리하기 위하여 구축한 통계 메타데이터 테이블이다. 각 레코드는 메뉴시퀀스(MENU_SQ)를 통해 통계포털 메뉴와 연계되며, 통계명(통계명), 통계종류(보고통계·조사 등), 법적근거, 계속통계 여부, 주요연혁, 조사대상, 목적, 조사체계, 조사내용 등의 항목을 포함한다. 또한 공표주기, 간행물명, 담당기관, 사용 시 유의사항을 함께 저장하여 각 통계가 어떤 주기로, 어떤 기관에 의해 생산·공표되는지와 해석 시 유의해야 할 점을 일목요연하게 제시한다. 이 테이블은 통계표 화면의 “통계 설명” 영역과 연계되어 이용자에게 통계의 배경과 작성 방법을 제공하고, 내부적으로는 통계 항목 개편·신규 도입·법적근거 변경 시 메타정보를 일관되게 관리하는 데 활용된다.
