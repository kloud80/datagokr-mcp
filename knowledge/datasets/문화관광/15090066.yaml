summary_user: 빅카인즈 뉴스 데이터베이스에서 여성 관련 기사를 뽑아 기사 한 건마다 일자·언론사·제목·통합 분류·키워드·특성추출어를 담은 건별 메타데이터 파일이다(CSV 약 46MB, 전국 단위, 비공간). 연구자·정책 담당자·언론 분석가가 성별 임금 격차나 경력 단절 같은 여성 이슈가 언제 어느 언론사에서 어떤 키워드로 많이 보도됐는지 추적하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 일자나 언론사 이름, 키워드 같은 텍스트 값을 맞춰서만 연결한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 여성 관련 뉴스 메타정보 자료입니다. 여성은 사회 각 분야에서 중요한 역할을 수행하고 있으며, 성평등, 고용, 정치 참여, 인권 보장 등 다양한 이슈가 언론 보도를 통해 꾸준히 조명되고 있습니다. 본 자료는 국내 주요 신문과 방송 보도에서 여성과 관련된 기사들을 분석하여 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 인식의 변화를 파악할 수 있도록 구성되었습니다. 이를 통해 성별 임금 격차, 경력 단절, 돌봄 노동, 젠더 갈등, 여성의 사회 진출 확대 등 다양한 주제가 언론 담론에서 어떻게 다뤄졌는지를 객관적으로 확인할 수 있습니다. 또한 학술 연구, 정책 수립, 언론 분석, 교육 현장에서 활용할 수 있는 기초 자료로, 성평등 사회 실현과 여성 권익 증진을 위한 사회적 논의와 제도 개선 방향을 모색하는 데 중요한 참고 자료가 됩니다.
