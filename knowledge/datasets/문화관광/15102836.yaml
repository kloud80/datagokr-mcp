summary_user: 수원시립미술관의 매표 현황을 해당연월별로 성인·청소년·어린이·유공자·경로·복지 및 장애 등 매표유형으로 나눠 이용객수와 매표수익을 담은 월별 집계 파일(CSV, 약 19.8KB)이다. 수원시 문화정책 담당자나 분석가가 '연도별로 미술관 입장객과 매표수익이 어떻게 변했고, 할인 대상 관람객 비중은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(문화시설코드 등)가 없어 다른 데이터와는 시설명이나 같은 기관 기준으로만 이어 쓸 수 있다.
description_portal: 경기도 수원시 대표 전시관 수원시립미술관 이용 매표 현황으로 해당연월, 매표유형, 이용자 수, 매표 수익에 대한 데이터를 월별로 만19세 이상 성인, 청소년, 어린이 또는 유공자, 경로, 복지 및 장애 별로 나눠 데이터 정리하여 해당 년도에 월별 통계치를 알 수 있는 자료로 사용 할 수 있고, 년도 별로 비교 하여 입장객 추이와 매출 추이를 비교 분석하여 해당 년도의  수원시 시민들의 미술관에 대한 반응을 확인 할 수 있다.또 유공자, 경로우대, 장애 및 복지 관련 할인으로 모든 시민들이 자유롭고 편하게 이용할 수 있는 장소가 될 수 있는점도 확인 할 수 있다.
