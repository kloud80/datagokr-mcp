description_portal: 이 데이터는 서울특별시 및 산하기관·자치구가 운영하는 체육시설, 시설대관, 교육, 문화행사, 진료 예약 등 다양한 공공서비스 예약 내역을 영문 정보로 제공하는 자료입니다.외국인을 포함한 다국어 사용자 대상 공공서비스 접근성 개선 및 정책 분석, 참여현황 모니터링 등에 활용될 수 있습니다.서울시 및 산하기관, 자치구의 체육시설, 시설대관, 교육, 문화행사, 진료 예약 영문 정보를 제공합니다. 예약은 http://yeyak.seoul.go.kr 에서 직접 하셔야 합니다. 바로가기 URL을 통해서 해당정보의 상세내용을 조회하시기 바랍니다.※ 제공되는 데이터는 연계시간 차이로 일부 차이가 날 수 있으니 양해 바랍니다.
