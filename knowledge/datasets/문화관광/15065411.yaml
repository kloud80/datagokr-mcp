description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 공공데이터입니다. 104개 주요 신문과 방송사에서 제공한 기사 텍스트를 대상으로 정치면 보도를 분석하여, 월별로 가장 많이 등장한 명사 200개를 추출하고 순위와 빈도를 함께 제공합니다. 이를 통해 특정 시기 정치 뉴스에서 어떤 이슈와 키워드가 두드러졌는지 파악할 수 있으며, 언론 보도의 경향 분석, 정치 의제 탐색, 연구 및 교육 자료로 활용할 수 있습니다. 특히 빅데이터 분석 기법을 활용한 언론 메타데이터 자료라는 점에서, 정책 연구자, 학계, 저널리스트뿐 아니라 일반 이용자에게도 의미 있는 참고 자료가 될 수 있습니다.
