summary_user: 성읍민속마을 안의 무장애여행 관련 지점을 한 건씩 담은 원천 파일로, 지점마다 아이디·위도·경도·해발고도가 있고 포털 설명상 장소 설명과 이미지 정보도 함께 제공된다. 휠체어 사용자나 고령자·유아 동반 가족이 성읍민속마을의 접근 가능한 이동 동선과 편의시설 위치를 미리 확인하거나, 무장애 관광 지도 서비스를 만드는 사업자가 지점 좌표를 확보하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 장소 이름을 매핑해서만 연결하며, 같은 제주 무장애여행정보 시리즈의 다른 관광지 파일과는 같은 기관 데이터로 묶어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 성읍민속마을 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."*이 데이터셋은 성읍민속마을의 무장애 여행 정보를 담고 있으며, 위도·경도 좌표, 장소 명칭, 장소 설명, 이미지 자료 등을 포함한다. 성읍민속마을은 15세기 조선 초기 행정 중심지였던 유서 깊은 마을로, 현재까지도 제주 전통 초가와 돌담, 옛 가옥들이 보존되어 있으며 실제 주민들이 거주하고 있다. 본 자료는 휠체어 사용자, 교통약자, 고령자, 유아 동반 가족 등 누구나 접근 가능한 열린관광지를 목표로, 이동 동선, 편의시설, 출입로 구조에 관한 정보를 제공하여 관광 안내, 무장애 관광지 홍보, 관광 정책 수립, 관광 콘텐츠 제작 및 지도 서비스 구축 등 공공 및 관광 분야에서 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
