summary_user: 서울특별시 중랑구에서 춤(댄스)을 가르치는 무도학원업 업소를 한 곳씩 담은 인허가 명부로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 업소 단위로 담는다. 중랑구에서 지금 영업 중인 댄스학원이 어디에 몇 곳 있는지, 최근 개업·폐업 흐름이 어떤지를 알아보려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 체육시설업 인허가 명부와 함께 상권 신호로 본다.
description_portal: '서울특별시 중랑구의 댄스학원과 같이 춤(댄스) 등을 가르치는 것을 목적으로 운영되는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
