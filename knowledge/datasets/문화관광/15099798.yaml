summary_user: 충청남도 금산군 안의 숙박업소를 업소 한 곳당 한 행으로 담은 목록으로, 업종구분(일반·생활 숙박업), 업소명, 행정구역, 주소, 전화번호, 데이터기준일자를 싣는다. 금산 여행을 준비하는 사람이 읍·면별로 어떤 숙소가 있고 연락처가 무엇인지 확인하거나, 분석가가 행정구역별 숙박업소 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 행정구역명·주소나 업소명을 맞춰 붙여야 하며, 공중위생법 신고 기반 인허가 원천(LOCALDATA)과 대조하는 식으로 이어 쓴다.
description_portal: '이 데이터는 충청남도 금산군의 숙박업(업종구분, 업소명, 행정구역, 주소, 전화번호)에 대한 정보를 제공합니다. 금산군에 위치한 총 57개의 숙박업소 정보가 수록되어 있으며, 일반 숙박업 55개, 생활 숙박업 2개로 구성되어 있습니다. 해당 정보는 지역 관광자원 개발 및 숙박 수요 분석, 유관기관의 관광행정 수립 등 다양한 분야에서 활용될 수 있습니다. 또한 숙박업소의 행정구역별 분포 파악, 지역 편의시설 연계 지도 제작, 교통 및 여행 동선 분석 등의 목적으로 활용이 가능합니다. *공중위생관리법에 따른 숙박업의 종류 및 정의 - 숙박업(일반) : 손님이 잡을 자고 머물 수 있도록 시설(취사시설은 제외한다) 및 설비 등의 서비스를 제공하는 영업 - 숙박업(생활) : 손님이 잠을 자고 머물 수 있도록 시설(취사시설을 포함한다) 및 설비 등의 서비스를 제공하는 영업'
