description_portal: '○ 통계개요* 통계명 : 문화재* 통계종류 : 서울시 문화재의 지정ㆍ등록현황을 제공하는 일반ㆍ보고통계* 작성목적 : 문화재 지정 및 관리 관련 기초 통계를 작성, 지정 변동 추이 등을 파악하여효율적 문화재 보존관리에 기여할 수 있는 기초자료를 제공하는 것을목적으로 함* 조사체계 : 해당 지정(등록)기관 → 시도 → 문화재청* 공표주기 : 정기(매년)* 공표범위 : 지역 - 지정(등록)기관 및 자치구내용 - 국가지정문화재, 시ㆍ도지정 문화재, 등록문화재 현황 등○ 용어설명* 국가지정문화재 : 문화재청장이 문화재보호법에 의하여 문화재위원회의 심의를 거쳐지정한 중요문화재- 국보 : 보물에 해당하는 문화재 중 인류문화의 견지에서 그 가치가 크고 유례가 드문 것- 보물 : 건조물·전적·서적·고문서·회화·조각·공예품 등의 유형문화재 중 중요한 것- 사적 : 기념물중 유적·제사·신앙·정치·국방·산업·교통·토목·교육 등으로서 중요한 것- 명승 : 기념물 중 경승지로서 중요한 것- 천연기념물 : 기념물 중 동물, 식물, 지질·광물로서 중요한 것- 중요민속문화재 : 의식주·생산·생업·교통·운수·통신·교역·사회생활 등으로서 중요한 것- 중요무형문화재 : 연극, 음악, 무용, 공예기술 등 무형의 문화적 소산으로서 역사적·예술적또는 학술적 가치가 큰 무형문화재 중에서 중요한것* 시ㆍ도지정문화재 : 국가지정문화재로 지정되지 아니한 문화재 중 시도 문화재보호조례에 의거 시도문화재위원회의 심의를 거쳐 시도지사가 지정한 문화재- 유형문화재 : 유형의 문화적 소산으로서 역사상 또는 예술상 가치가 큰 것과 이에 준하는 고고자료- 기념물 : 사적지로서 역사상, 학술상 가치가 큰 것, 경승지로서 예술상, 관람상 가치가 큰 것 및동물(서식지,번식지,도래지를 포함한다), 식물(자생지를 포함한다), 광물, 동굴로서 학술상가치가 큰 것- 민속자료 : 의식주·생업·신앙·연중행사 등에 관한 풍속· 관습과 이에 사용되는 의복·기구·가옥등으로서 국민생활의 추이'
