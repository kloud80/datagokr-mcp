summary_user: 광주광역시 일가정양립지원본부 행복작은도서관이 보유한 일반도서를 관리번호 순으로 한 권씩 정리한 소장 목록으로, 도서명·저자·출판사·데이터기준일자를 담는다(CSV 파일 약 168KB). 이 작은도서관을 이용하려는 주민이 '찾는 책이 이곳에 있는가'를 확인하거나, 분석가가 작은도서관 장서 구성(소설·시집·에세이 등)을 살펴보는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어서, 다른 도서관 장서·대출 데이터와는 도서명·저자 문자열 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 광주광역시 일가정양립지원본부 행복작은도서관이 보유한 일반도서의 목록을 관리번호 순서로 정리한 자료로, 각 도서의 도서명과 저자, 출판사, 데이터기준일자를 포함하여 제공합니다. 목록에는 소설, 시집, 에세이 등 다양한 분야의 도서가 포함되어 있으며, 착한 고양이 알퐁소, 괭이부리말 아이들, 지나가는 도둑을 쳐다보지 마세요, 바람의 열두방향, 슬픔이여 안녕 등 여러 작품의 기본 서지정보를 확인할 수 있습니다본 자료는 2024년 10월 28일 기준으로 정리되었습니다. ※평일운영 09:00~18:00 주말 및 공휴일 미운영
