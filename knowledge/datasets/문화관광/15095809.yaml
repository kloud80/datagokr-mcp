summary_user: 마포구 망리단길 일대의 유동인구를 격자 단위로 집계한 2021년 공공데이터 뉴딜 사업 결과 파일입니다. 격자 id와 경계 좌표(left·top·right·bottom)가 있고, 연령대·시간대·주말별 유동인구 값(14세 이하, 65세 이상, 20~60대 주간 등)이 들어 있으며, 약 15KB zip으로 내려받습니다. 상권 분석가나 구청 관광 담당자가 망리단길에서 어느 구역에 어떤 연령층이 언제 몰리는지 확인할 때 씁니다. 전역 조인 키는 없으므로 다른 데이터와 붙이려면 EPSG:3857 격자 좌표로 공간 중첩을 하거나, 같은 마포구 관광인구분석 시리즈와 격자 id·이름으로 맞춰야 합니다.
limits: 실측 컬럼에 행정코드나 관광지 ID 같은 공통 조인 키가 없어서 TourAPI 관광지 등과 코드로 바로 연결되지 않습니다. 공간 파일(SHP)은 QGIS·ArcGIS 같은 GIS 도구로 열어야 하고, 좌표계는 EPSG:3857이라 다른 좌표계 데이터와 겹칠 때는 먼저 변환해야 합니다. 컬럼 이름이 줄임말이라 정확한 연령·시간 구간은 컬럼정의서로 확인하는 것이 좋습니다.
