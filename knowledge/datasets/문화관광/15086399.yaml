description_portal: 광주광역시도시공사_지하도상가현황 데이터는 광주광역시도시공사가 관리하는 지하도상가의 시설 운영 및 이용 정보를 체계적으로 제공하기 위한 자료입니다. 본 데이터는 시설명, 소재지 도로명주소 및 지번주소, 전화번호, 총면적, 임대면적, 규모, 점포수, 이용시간, 정기휴일, 부대시설, 화장실 수, 화장실 위치, 데이터기준일자 항목으로 구성되어 있습니다. 이용자는 상가의 위치와 규모, 운영시간, 휴무일, 편의시설 현황 등을 한 번에 확인할 수 있으며, 점포 수와 임대면적을 통해 상가 운영 규모와 시설 특성을 파악할 수 있습니다. 또한 화장실 위치와 부대시설 정보는 방문객의 이용 편의를 높이고 접근성을 향상하는 데 활용됩니다. 본 데이터는 시민의 생활편의 증진과 공공시설 이용 활성화를 지원하며, 상권 분석, 시설 운영 관리, 공공서비스 개선 및 정책 수립을 위한 기초자료로 활용할 수 있도록 제공합니다.
