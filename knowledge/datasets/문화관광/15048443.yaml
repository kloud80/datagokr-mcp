summary_user: 계절별로 가기 좋은 농촌여행 코스의 세부 여행지를 한 건씩 담은 파일로, 여행지명·사진파일·위도·경도·주소·설명을 담고 범위는 전국이며 위치는 개별 주소와 좌표 단위다. 여행 계획자나 지역관광 콘텐츠 담당자가 '이번 계절에 갈 만한 농촌 여행지가 어디이고 정확한 위치가 어디인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 등 다른 관광 데이터와는 여행지명 매칭이나 위도·경도·주소 기반 공간 결합으로만 이어 쓴다.
description_portal: '- 누구나 불편함 없이 농촌으로 여행갈 수 있도록 농촌 여행 정보를 제공합니다.- 본 데이터는 계절별 가기 좋은 농촌여행 코스로 여행지명, 사진파일, 위도, 경도, 주소 데이터를 개방하여 제공하고 있습니다.- 파일에 포함된 콘텐츠의 경우 저작권자의 허가없이는 자유이용 할 수 없으므로, 해당 정보에 대한 자세한 내용은 웰촌포털 내 계절테마여행코스에서 확인하실 수 있습니다.- 봄, 여름, 가을, 겨울 별 이색투어, 축제, 이색여행 등의 여행정보를 확인하실 수 있습니다.- 본 개방데이터는 관광 마케팅 및 정책 수립, 지역관광 콘텐츠 구성, 지역개발 연구 등의 자료로 활용 가능합니다.'
