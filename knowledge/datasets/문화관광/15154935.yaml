description_portal: 본 데이터는 전라남도 화순군 내 관광객과 주민을 위한 쉴거리 현황 정보를 체계적으로 제공한다. 관광숙박업, 리조트, 호텔, 캠핑시설, 야영장 현황뿐만 아니라 활용 가능한 빈집 및 농지 정보까지 포함되어 있다.  이 자료는 각 파일 종류별  쉴거리현황을 소개하는데 업소명, 주소, 연락처 등 주요 항목이 수록된다. 이 자료는 화순군 내 관광객의 숙박 선택, 지역유휴자원의 효율적 활용, 관광 인프라 확충, 지역경제 활성화 정책 수립 등 다양한 행정적 목적에 활용될 수 있다. 중장기 개방계획에 의해 공개되는 쉴거리현황 데이터는 정기적인 현장 조사와 행정보고를 통해 최신성을 유지하며, 주민, 관광객, 연구자 등 다양한 수요자가 참고할 수 있다.
