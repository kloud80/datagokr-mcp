summary_user: 문화체육관광부 산하 기관이 주최하는 공연을 건별로 담은 목록으로, 공연 제목·설명·조회수·장소·유형·문의처·유료/무료 여부·관람 등급·공연 기간을 전국 범위로 제공한다. 일반 시민이 "이번 달 문체부 산하 기관 무료 공연은 어디서 열리나"를 찾거나, 공연기획자·연구자가 기관 주최 공연 현황을 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 직접 연결되지 않으며, 다른 공연 데이터와는 공연명·공연장 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 문화체육관광부 산하 기관에서 주최하는 다양한 공연의 정보를 한눈에 확인할 수 있는 데이터셋입니다. 공연의 제목, 상세 설명, 조회수, 관련 URL, 썸네일 이미지, 행사 정보, 유형, 문의 안내, 유료 또는 무료 여부, 관객 등급 및 나이, 공연 기간 등 주요 정보를 포함하고 있어 공연 일정 파악과 관람 계획 수립에 유용합니다. 문화예술 관련 기관, 공연기획자, 연구자, 일반 시민 등 다양한 이용자가 공연 현황을 파악하거나 홍보 자료로 활용할 수 있으며, 문화행사 일정 관리, 공연 추천 서비스, 문화정책 연구 등에도 폭넓게 활용할 수 있습니다.
