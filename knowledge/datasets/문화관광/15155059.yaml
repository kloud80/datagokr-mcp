summary_user: 전국 자치단체가 관리하는 비디오물시청제공업(숙박·휴게 시설 등에서 비디오 시청기자재를 제공하는 업소) 인허가 정보를 업소 한 곳당 한 건으로 담으며, 인허가·폐업·휴업 일자, 영업상태, 사업장명, 도로명·지번 주소와 좌표, 시설면적·소방·비상구 같은 시설 항목을 포함한다. 사업자나 분석가가 "우리 동네에서 현재 영업 중인 비디오물시청제공업소는 어디이고 언제 인허가를 받았나"를 확인하거나 지역별 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서 개방자치단체코드(OPN_ATMY_GRP_CD)나 주소·좌표로 다른 지역 데이터와 이어 쓰고, 이 자치단체코드와 기준일자는 다른 데이터에서 먼저 받아 조회 조건으로 넘겨야 한다.
limits: 필수 조회 조건인 기준일자와 개방자치단체코드는 이 API가 주지 않으므로 먼저 다른 데이터에서 받아야 하고, 이력(/history) 오퍼레이션은 최소 파라미터로는 응답이 없었다. 좌표는 보정계수가 들어가지 않은 Bessel 중부원점TM(EPSG:5174)이라 지도에 올리려면 변환이 필요하다.
