summary_user: 전북특별자치도 장수군 7개 읍면에서 운영 중인 농어촌민박을 업소 한 곳당 한 행으로 담은 원천 목록으로, 읍면·업체명·도로명주소·객실수(1~6실)·데이터기준일자를 포함한다. 장수군에서 묵을 농어촌민박을 찾는 여행객이나 읍면별 민박 분포와 객실 규모를 파악하려는 지역 관광·숙박 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명주소나 읍면 이름을 매핑해 잇고, 같은 기관의 숙박·관광 자료나 인허가 원천(LOCALDATA)과 주소·업체명으로 대조한다.
