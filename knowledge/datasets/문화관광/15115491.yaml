summary_user: 서울특별시 중랑구에서 영화배급업 인허가를 받은 업소를 한 건씩 담은 원천 목록으로, 관리번호·인허가일자·영업상태·폐업일자·사업장명·주소·전화번호와 중부원점TM(EPSG:5174) 좌표를 담는다. 중랑구 안에 영업 중인 영화배급업체가 어디에 있고 언제 인허가·폐업했는지 확인하려는 사업자나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 다른 자치구의 같은 인허가 데이터와는 같은 컬럼 구조(개방자치단체코드 OPNSFTEAMCODE 등)로 묶고, 그 밖의 데이터와는 사업장명·주소로 이어 쓴다.
description_portal: '서울특별시 중랑구의 영화를 전문적으로 배급하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
