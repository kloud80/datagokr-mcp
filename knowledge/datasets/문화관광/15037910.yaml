summary_user: 충청남도 금산군에 설치된 야외(실외)운동기구를 기구 한 건씩 담은 원천 목록으로, 담당 읍면·설치연도·기구 종류·설치 주소를 기록한다. 주민이나 분석가가 '우리 읍면에는 어떤 운동기구가 어디에 있고, 언제 설치됐나'를 확인하거나 읍면별 설치 밀집도를 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치 주소나 읍면 이름을 매핑해야 연결된다.
