description_portal: 본 데이터는 충청남도 금산군에 위치한 야외(실외)운동기구의 현황정보(담당읍면, 설치연도, 설치기구종류, 설치주소)를 제공합니다. 2024년 8월 기준 총 445건의 운동기구 정보가 수록되어 있으며, 지역별 체육시설 현황 파악 및 이용자의 운동 편의성 증진을 위한 기초 자료로 활용할 수 있습니다. 해당 데이터를 활용하여 생활권 내 공공 체육시설 접근성 및 밀집도를 분석하고 건강취약지역 대상 야외(실외)운동기구 확충 계획을 수립할 수 있습니다. 이 데이터는 매년 업데이트되며 공공데이터포털을 통해 제공됩니다.
