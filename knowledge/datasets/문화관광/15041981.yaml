summary_user: 비짓제주(VISIT JEJU) 관리자가 입력한 다국어 사전 설정값을 한 행에 한 용어씩 담은 파일로, 국문·영문·중문·일문 표기와 등록·수정 일시가 들어 있으며 실측 파일 크기는 427바이트로 아주 작습니다. 제주 관광 서비스나 번역 작업을 하는 개발자·운영자가 비짓제주에서 특정 국문 용어를 영어·중국어·일본어로 어떻게 표기하는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 관광 데이터와는 국문 용어 이름을 맞춰 연결하는 방식으로만 이어 쓴다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 다국어사전 내역입니다.- 해당 데이터는 운영자가 비짓제주 관리자페이지에서 다국어 사전 설정값을 입력할 때 저장하여 생성합니다.- 개방데이터 항목은 일련번호, 국문, 중문, 일문, 등록일시, 수정일시이며 전체 데이터 수는 5건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 다양한 언어별 정보 제공, 외국인 관광객 편의성 증대, 다국어 서비스 품질 강화, 관광지 정보 접근성 및 이해도 향상, 글로벌 관광객 만족도 증진 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
