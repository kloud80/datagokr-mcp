description_portal: '"서울시 동북권(강북구, 광진구, 노원구, 도봉구, 동대문구, 성동구, 성북구, 중랑구) 공공도서관 61개관의 이용자 현황 정보, 성별/연령별 정보 제공* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함"자치구 간 이용자 이동: 특정 자치구 거주자가 다른 자치구 도서관을 이용한 경우의 실거주지 및 이용자 수가 표기되어 있습니다.인구 대비 이용 현황: 각 자치구의 총인구, 도서관 이용자 수, 실거주 이용자 수, 인구 대비 이용자 비율(%)이 포함되어 있습니다.대출 이용 현황: 대출한 이용자 수, 실거주 대출 이용자 수가 별도로 기록되어 있어, 이용 행태 분석이 가능합니다.'
