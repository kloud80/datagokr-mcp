summary_user: 서울 종로구 당구장업의 인허가 현황을 업소별로 담은 건별 원천 데이터로, 인허가일·취소일, 영업상태·상세영업상태, 폐업일·휴업기간, 지번·도로명 주소, 좌표, 업소명 등을 포함한다. 종로구에서 현재 영업 중이거나 최근 폐업한 당구장이 어디에 있는지, 언제 문을 열고 닫았는지 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관(지방자치단체 코드, OPNSFTEAMCODE) 기준으로만 이어 쓰며, 다른 체육시설업 인허가 명부나 상권 데이터와 나란히 개폐업 흐름을 보는 데 쓴다.
description_portal: 본 데이터는 서울특별시 종로구에서 운영되는 당구장업의 인허가 현황을 수록하고 있습니다. 당구장은 대표적인 실내 스포츠·여가 시설로, 지역 주민의 건강 증진과 여가 활동을 지원하며, 종로구 상권 내 다양한 문화·서비스 산업과도 밀접하게 연계되어 있습니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드, 영업상태명 등의 항목이 포함되어 있어 당구장업체별 등록 절차와 운영 상태를 명확히 확인할 수 있습니다. 이를 통해 행정기관은 업소의 합법적 운영 여부를 감독하고, 시설 안전 및 위생 관리 기준을 준수하는지를 점검할 수 있습니다. 또한 지역사회는 데이터 활용을 통해 건전한 여가문화 확산을 도모할 수 있으며, 연구자와 정책 담당자는 이를 기반으로 체육·여가 산업의 분포 현황과 수요 변화를 분석할 수 있습니다. 나아가 종로구는 본 자료를 활용하여 주민 생활과 밀접한 체육 여가 인프라를 체계적으로 관리하고, 공공 서비스 품질을 향상시키는 기초 자료로 삼을 수 있습니다.
