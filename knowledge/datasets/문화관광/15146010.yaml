description_portal: '"서울시 서남권(강서구, 관악구, 구로구, 금천구, 동작구, 양천구, 영등포구) 공공도서관 46개관의 이용제한 도서 현황 정보* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함"각 자치구별로 ‘일반 제한’, ‘사서 제한’, ‘열람 제한’ 등 도서 이용 제한 유형에 따른 자료 수량이 세부 분류(총류, 철학, 종교, 사회과학, 자연과학 등)별로 집계되어 있습니다. 표에는 종수(타이틀 수), 책수(권 수), 종비율, 책비율 등이 포함되어 있어 도서관별·유형별 제한 도서의 규모와 비중을 비교할 수 있습니다.'
