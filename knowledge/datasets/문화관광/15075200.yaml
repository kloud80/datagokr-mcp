description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 제주도립미술관은 제주 제주시 1100로 2894-78에 위치한 공립 미술관으로 2009년 개관 이후 제주 특유의 자연과 문화적 정체성을 반영한 전시와 현대미술 기획전을 선보이는 복합문화공간이며, 장애인 전용 주차구역, 실내 단차 제거 출입구, 엘리베이터, 장애인 화장실, 휠체어 및 유모차 무료대여 등 무장애 편의시설을 갖춰 교통약자, 고령자, 유모차 동반 가족 등 누구나 편히 관람과 산책이 가능한 열린관광지로 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
