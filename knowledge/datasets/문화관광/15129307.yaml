description_portal: 수집 목적 및 내용한류 콘텐츠의 글로벌 확산에 따라 국내 콘텐츠 기업 및 창작자의 해외 진출이 활발해지는 가운데, 이에 비례해 해외에서의 저작권 침해 사례도 지속적으로 증가하고 있습니다. 이에 따라 한국저작권보호원은 국내 콘텐츠 기업 및 개인 창작자가 해외에서 겪을 수 있는 저작권 침해 문제를 예방하고, 분쟁 발생 시 신속하게 대응할 수 있도록 법률적·행정적 비용을 지원하는 바우처 사업을 운영하고 있습니다.본 사업은 해외 진출 단계 또는 해외 진출 중인 콘텐츠 창작자를 대상으로 하며, 지정된 수행기관을 통해 법률 자문, 사전 모니터링, 경고장 발송, 권리 주장, 소송 대응 지원 등의 서비스를 제공합니다.데이터 세부 항목으로는 수행기관과 대표자, 분류, 소재지 등을 제공하며 총 47건이며 유관 공공기관 데이터와의 연계 활용이 가능합니다.활용 기대효과콘텐츠 기업 및 창작자는 해외 저작권 침해 리스크를 사전에 방지하고, 침해 발생 시 법률적 대응 비용 부담을 줄여 안정적으로 글로벌 시장에 진출할 수 있습니다.정부 및 유관기관은 축적된 데이터 기반으로 해외 저작권 침해 동향을 분석하고, 국가 차원의 저작권 보호 정책을 정교화할 수 있습니다.수행기관은 수요자 맞춤형 보호 서비스를 제공함으로써 민간 영역의 저작권 보호 역량을 제고하고, 향후 상시적인 국제 저작권 보호 체계 구축에 기여할 수 있습니다.사업 종료 후 수집된 침해 차단 건수, 경고장 발송 결과, 분쟁 해결 사례 등의 데이터를 축적하여, 유사 분야의 정책 수립이나 타 콘텐츠 산업군의 저작권 보호 방안 마련에 참고자료로 활용할 수 있습니다.
