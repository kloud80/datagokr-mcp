summary_user: 제주러브랜드 테마공원 안의 무장애 여행 지점을 한 건씩 담은 원천 목록으로, 지점마다 아이디와 위도·경도·해발고도가 있고 포털 설명에 따르면 지점 설명, 이동 동선, 장애인 주차구역·경사로·장애인 화장실·휠체어 대여 같은 편의시설 현황이 함께 들어 있다. 휠체어 이용자나 고령자가 러브랜드 안에서 어떤 경로로 다니고 편의시설이 어디 있는지 확인할 때 쓰고, 열린관광지 개선 같은 관광 정책·서비스 기획의 기초자료로도 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 실측 컬럼에서 확인되지 않았으므로, TourAPI 관광지 정보 등과는 시설 이름을 맞추거나 위도·경도로 위치를 대조해 연결한다.
description_portal: '"제주특별자치도_무장애여행정보_47.러브랜드 데이터를 제공합니다.* 이 데이터셋은 제주러브랜드 테마공원에 대한 무장애 여행 정보를 제공한다. 공원 내 위치 정보(위도·경도), 개별 지점 설명, 이동 동선, 무장애 편의시설 현황(장애인 전용 주차구역, 경사로, 장애인 화장실, 휠체어 대여 등) 등이 포함되어 있어, 휠체어 이용자·고령자·교통약자도 이용할 수 있도록 설계되었다. 이를 통해 누구나 접근 가능한 관광환경을 조성하며, 무장애 관광지 확대, 열린관광지 구축 및 관광 서비스 개선, 정책 수립 등에 기초자료로 활용 가능한 가이드 역할을 수행한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
