summary_user: 부산광역시 영도구에 공중위생관리법에 따라 영업신고된 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·도로명 주소·전화번호·객실수를 제공한다. 영도구에서 숙박업소가 어디에 몇 곳 있고 객실 규모가 어느 정도인지 알아보려는 여행객·사업자·지역 관광 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 업소명이나 도로명 주소를 맞춰 붙여야 하며, 전국 숙박업 인허가 데이터(LOCALDATA)와 대조할 때도 같은 방식으로 연결한다.
description_portal: '부산광역시 영도구 숙박업 현황입니다.공중위생관리법 제3조(공중위생영업의 신고 및 폐업신고)에 의거 영업신고된 숙박업 업소에 관한 데이터로서 업종, 업소명, 소재지주소, 소재지전화, 객실수 항목을 제공합니다.- 업종: 공중위생관리법상 신고업종- 업소명: 신고된 숙박업소의 명칭- 소재지주소(도로명): 업소의 사업장 주소- 소재지전화번호: 업소와 연락 가능한 유선 전화번호- 객실수: 업소 객실수본 현황은 특정 시점 기준으로 작성되었으며, 이후 업소 폐업, 변경 등의 사유로 변동이 있을 수 있습니다.기타 문의사항은 정보공개청구 또는 환경위생과 유선 문의 바랍니다.'
