description_portal: 본 데이터는 게임물관리위원회로부터 등급 분류 업무를 위탁받은 민간 등급 분류 기관(게임콘텐츠등급분류위원회, GCRB)에서 심의하고 결정한 게임물 등급 분류 정보를 제공합니다. 주요 내용으로는 각 게임물별 공식 명칭, 고유 등급분류번호, 최종 등급 결정일과 함께 부여된 이용 등급(전체이용가, 청소년이용불가 등) 정보를 포함하고 있습니다. 또한, 해당 게임물을 개발하거나 등급 분류를 신청한 업체(신청자) 명칭과 심의를 진행한 등급분류기관 정보를 상세히 기록하고 있어, 국내에서 유통되는 민간 위탁 게임물의 심의 현황과 등급 정보를 투명하게 파악할 수 있는 기초 자료로 활용 가능합니다.
