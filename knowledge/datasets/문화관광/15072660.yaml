summary_user: 게임물관리위원회로부터 등급분류 업무를 위탁받은 민간 기관(게임콘텐츠등급분류위원회)이 결정한 게임물 등급분류 결과를 게임물 한 건씩 담은 전국 단위 파일로, 게임물명·등급분류번호·결정일·이용등급·신청자·등급분류기관을 기록하며 파일 크기는 약 3.9KB로 작다. 게임 이용자나 보호자가 특정 게임이 어떤 이용등급을 언제 받았는지, 사업자나 분석가가 어떤 업체가 민간 위탁 심의를 신청했는지 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 게임물명이나 신청자 이름을 맞춰 위원회의 다른 등급분류 데이터와 대조하는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름 매칭에 기대야 하고, 이때 표기 차이로 오매칭이 생길 수 있다. 파일 규모가 매우 작아 민간 위탁 등급분류 전체 현황을 대표한다고 보기는 어렵다.
