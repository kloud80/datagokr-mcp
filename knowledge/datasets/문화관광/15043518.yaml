summary_user: 제주 사려니숲길 붉은오름 방향 무장애 구간의 경로를 지점별 아이디·위도·경도·해발고도로 담은 건별 좌표 데이터다. 휠체어 이용자나 노약자·유아 동반 여행자가 이 구간의 경로와 고도 변화를 미리 확인하거나, 분석가가 무장애 관광 인프라를 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 장소 이름으로 맞춰 이어 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_무장애여행정보_51.사려니숲길-2(붉은오름방향) 데이터를 제공합니다.* 이 데이터셋은 제주도 내 사려니숲길의 붉은오름 방향 구간에 대해, 무장애 여행자(휠체어 이용자 등)를 고려한 산책로 정보, 위치(위도/경도), 장소 설명, 편의시설 및 경로 데이터 등을 포함한다. 숲길은 빽빽한 삼나무 등 자연림 속에서 형성된 산책로이며, 누구나 접근 가능한 ‘무장애 나눔길’ 구간으로 설계되어 장애인·노약자·유아 동반자도 자연을 경험할 수 있도록 지원된다. 이 자료는 관광 접근성 향상, 열린관광지 조성, 무장애 관광 인프라 구축 및 관련 정책 수립에 활용할 수 있는 공공기반 자료이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
