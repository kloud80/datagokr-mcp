summary_user: 제주 서귀포시 중문관광단지 안의 PLAY K-POP 한 곳에 대한 무장애여행 정보를 담는다. 포털 설명상 장소 설명과 이미지가 포함되고, 실제 필드는 아이디·위도·경도·해발고도 같은 지점 좌표다. 휠체어 이용자나 보행약자가 이 시설의 출입구·동선·편의시설 접근성을 확인하거나, 관광약자 안내 서비스에 시설 위치를 넣을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI contentId 같은 공통 코드로는 바로 잇지 못하고, 시설명 매핑이나 위경도 좌표로만 다른 관광지 데이터와 연결한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 플레이케이팝 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 이 데이터셋은 제주 서귀포시 중문관광단지 내 PLAY K-POP의 무장애 여행 정보를 제공한다. 과거 K-POP을 테마로 한 디지털 테마파크로서, 홀로그램 콘서트, 증강현실·가상현실 기반 체험, 댄스 및 사진 체험 등 다양한 콘텐츠가 마련되어 있었다. 휠체어 이용자 및 보행약자도 입장 가능하도록 출입구 및 내부 동선 설계 여부, 관람석 접근성, 편의시설(주차, 화장실 등) 여부를 포함한 접근성 정보가 데이터셋에 담겨 있다. 해당 자료는 제주 관광의 다양성과 접근성 강화를 위한 공공 인프라로 설계되었으며, 관광약자 맞춤 관광지 안내, 열린관광지 조성, 관광 정책 수립 및 서비스 개선 등에 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
