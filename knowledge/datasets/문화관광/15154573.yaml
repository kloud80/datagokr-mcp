description_portal: '세종특별자치시시설관리공단은 시민이 체육시설의 강좌별 요금 체계를 명확히 확인할 수 있도록 강좌별요금품목설정 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 각 센터별 강습반에 적용되는 요금 항목을 체계적으로 관리하기 위해 구축되었으며, 투명한 정보 공개를 통해 시민의 이용 편의성과 행정 신뢰성을 높이는 것을 목표로 합니다.■ 데이터 컬럼 구성센터명 - 강좌 또는 강습이 운영되는 체육시설명    예: 보람수영장, 조치원복합커뮤니티센터 등강습반명 - 운영 중인 강습 프로그램 또는 강좌의 명칭요금품목명 - 요금을 부과하는 기준이 되는 품목의 명칭■ 데이터 제공 목적강좌별요금품목설정 데이터는 다음과 같은 목적을 위해 제공됩니다. - 강습 프로그램별 요금 항목의 투명한 공개 및 정보 접근성 향상 - 센터별 요금 체계의 일관성 확보 및 행정 효율화 - 시민이 강습 선택 시 요금 구조를 명확히 이해하도록 지원 - 공공체육시설의 공정한 요금 운영 및 신뢰도 제고세종특별자치시시설관리공단은 앞으로도 시민이 체육시설을 합리적으로 이용할 수 있도록, 강습 요금 관련 정보를 지속적으로 갱신·공개하겠습니다.'
