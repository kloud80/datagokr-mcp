summary_user: 경상남도 레저관광지 한 곳당 한 건으로 명칭·레저구분(분류명)·소개 내용·주소·위도경도·교통편·전화·홈페이지·이미지 주소를 담는 시도 단위 목록이다. 여행자나 관광 앱 개발자가 "경남에서 즐길 수 있는 레저 체험 장소는 어디이고 어떻게 가나"를 찾을 때 쓴다. 전역 조인 키가 없어 TourAPI 관광 콘텐츠 등 다른 데이터와는 명칭·주소 매칭이나 좌표(lattitude·logitude) 기반 근접 매칭으로만 잇는다.
limits: contentId 같은 공통 식별자가 없어 TourAPI 원장과 정확히 1:1로 연결되지 않으며, 지자체 관광지 목록이라 국내 관광 콘텐츠의 대표 원장으로는 TourAPI를 우선한다. 개발계정은 일 10,000회 호출 제한이 있다.
