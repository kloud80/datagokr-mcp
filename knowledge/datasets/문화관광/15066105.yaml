summary_user: 인천관광공사와 경기관광공사 유튜브 채널의 운영현황을 채널별 집계로 담은 파일로, 동영상 수·조회수·시청시간·구독자수·노출수·노출 클릭률과 성별·연령·국가별 시청 분포를 비교표 형태(구분1·구분2 행, 기관별 열)로 정리했다. 관광 마케팅 담당자나 분석가가 "두 지역 관광공사 유튜브 채널은 개설 이후 어느 연령·국가 시청자에게 얼마나 도달했나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 기관명이나 채널명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: '인천관광공사와 경기관광공사의 유튜브 운영현황에 대한 융합데이터를 제공합니다.본 데이터의 상세 정보는 다음과 같습니다. - 유튜브 기본정보 : 분석기간, 유튜브채널명, 동영상 수, 조회수, 시청시간, 구독자수, 노출수, 노출 클릭률, 성별, 연령, 국가(대한민국, 미국, 일본, 캐나다, 베트남, 인도네이시아, 인도, 필리핀, 싱가포르, 브라질, 아르헨티나, 말레이시아) 인천관광공사 분석기간 : 2017.07.10.(채널 개설 시점)~2021.07.31. 경기관광공사 분석기간 : 2011.12.01.(채널 개설 시점)~2021.07.31.'
