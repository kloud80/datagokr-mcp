description_portal: 이 데이터는 서울특별시 내 자치구별로 한옥 등록·관리 업무를 담당하는 담당자 정보를 정리한 자료입니다. 각 자치구에서 한옥보전정책 실행 및 지원업무를 위해 지정된 담당자의 성명, 연락처, 직위 등 기본 정보가 포함되어 있습니다. 이 자료는 한옥 보전정책 및 등록관리시스템이 원활하게 운영되도록 지원하기 위한 것이며, 자치구 담당자별 연락망 구축과 행정지원체계 분석에 활용 가능합니다. 또한 자치구 간 한옥지원 인프라의 조직체계 격차를 살펴보거나, 한옥관련 행정서비스 개선을 위한 기초자료로도 유용합니다.한옥등록관리시스템은 서울시 소재 한옥에 대한 등록여부, 지원금액, 지원일자, 수선가능시기 등의 정보를 제공하여 서울시 한옥보전 정책 및 실적안내를 위한 시스템으로자치구별 한옥등록관리시스템 사용자(담당자) 정보를 제공하여 원활한 지원을 도모함주택정책실 한옥정책과 김용덕 (02-2133-5576)
