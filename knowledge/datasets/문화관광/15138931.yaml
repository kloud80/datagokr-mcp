summary_user: 공연 티켓 할인 정보를 티켓 한 건(티켓번호 seq) 단위로 담으며, 공연 제목·포스터, 티켓요금, 할인율, 지역, 공연장, 시작일·마감일을 전국 범위로 제공한다. 공연을 보려는 사람이 '지금 우리 지역에서 할인 중인 공연과 할인율은 얼마인가'를 확인하거나, 분석가가 지역·공연장별 할인 프로모션 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 직접 연결되지 않으므로, 공연 제목·공연장명·지역 이름으로 맞춰 KOPIS 공연 목록·공연장 데이터와 이어 쓴다.
limits: 상세 조회의 필수 파라미터 seq(티켓번호)는 목록 조회 등에서 먼저 받아 넘겨야 한다. 공연ID·공연장ID 같은 공통 키가 없어 다른 공연 데이터와는 이름 매칭으로만 연결되며, 매칭 오류에 주의해야 한다.
