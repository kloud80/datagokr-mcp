summary_user: 제주올레길 1코스 중 종달리 일대 휠체어 이용 가능 구간을 지점(포인트) 단위로 순서·위도·경도·구분·설명·상세정보와 함께 담은 무장애 여행코스 파일입니다. 휠체어 이용자나 교통약자 동반 여행객이 '종달리 올레길에서 휠체어로 어디까지, 어떤 순서로 이동할 수 있나'를 확인하거나, 무장애 관광 서비스를 만드는 사업자가 코스 지도를 그리는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 콘텐츠 등 다른 관광 데이터와는 지점 이름이나 위도·경도 좌표를 맞춰 연결해야 한다.
description_portal: '"제주특별자치도 내 제주올레길1코스(휠체어구간)종달리_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 제주올레길 1코스 중 종달리 구간의 휠체어 접근 가능 구간을 중심으로 구성된 무장애 여행 정보를 제공한다. 해당 코스의 위치 정보, 이동 동선, 주변 관광 여건, 편의·안전 요소 등을 기반으로 교통약자의 이동 편의 증진을 목적으로 공공기관에서 수집·정비한 자료이다. 특히 노면 상태, 경사도, 휴식 지점, 접근성 시설 등 현장 기반의 세부 요소를 포함하여 관광약자를 위한 맞춤형 여행 서비스 개발, 무장애 관광환경 조성, 정책 수립 등 다양한 활용을 지원한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
