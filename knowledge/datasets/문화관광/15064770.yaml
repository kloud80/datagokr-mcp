summary_user: 경기도 포천시가 관리하는 공공체육시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 13KB)로, 읍면동·시설명·지번/도로명 주소·조성면적(제곱미터)·조성연도·관리기관과 전화번호·위도/경도를 담는다. 포천시 주민이 집 근처에서 이용할 공공 운동장이나 체육관이 어디 있고 누구에게 문의하면 되는지 찾거나, 분석가가 읍면동별 체육시설 분포와 조성 시기를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소·좌표나 읍면동 이름, 시설명 매칭으로 이어야 하며, 문체부 전국체육시설 자료나 인구 통계와는 이런 방식으로 맞춰 쓴다.
description_portal: 경기도 포천시_공공체육시설 현황입니다. 포천시에서 제공하는 공공체육시설 위치, 조성년도, 조성규모 등 항목을 제공하고 있습니다. 읍면동 항목은 공공체육시설이 위치한 행정구역을 나타냅니다. 시설명 항목은 공공체육시설의 시설명을 나타냅니다. 소재지지번주소 항목은 공공체육시설이 위치한 지번주소를 나타냅니다. 소재지도로명주소 항목은 공공체육시설이 위치한 도로명주소를 나타냅니다. 조성면적 항목은 공공체육시설의 면적을 제곱미터 단위로 나타냅니다. 조성연도 항목은 공공체육시설이 조성된 연도를 나타냅니다. 관리기관 항목은 공공체육시설을 관리하는 기관을 나타냅니다. 위도 항목은 공공체육시설 위치의 위도를 나타냅니다. 경도 항목은 공공체육시설 위치의 경도를 나타냅니다. 관리기관 전화번호 항목은 공공체육시설을 관리하는 기관의 전화번호를 나타냅니다.
