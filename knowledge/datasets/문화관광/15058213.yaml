summary_user: 경기도 내 지방문화원을 사업장 한 곳씩 담은 인허가 현황으로, 시군·사업장명·인허가일자·영업상태·법인명과 설립목적·도로명/지번 주소·WGS84 위경도를 함께 제공한다. 지역문화 정책 담당자나 연구자가 '우리 시군에는 운영 중인 문화원이 어디에 있고 언제 인허가를 받았나'를 확인하거나 시군별 문화 인프라 분포를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어 다른 데이터와는 시군 이름·코드(SIGUN_CD), 주소, 위경도 좌표로 맞춰 잇는다.
description_portal: 이 데이터는 지방문화원의 인허가 현황을 포함한 정보를 제공하는 자료로, 각 문화원의 설립과 운영 현황을 파악할 수 있는 공공 문화 인프라 관리 데이터입니다. 항목은 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 폐업일자(CLSBIZ_DE), 소재지도로명주소(REFINE_ROADNM_ADDR), 법인명(COPRTN_NM), 법인설립목적(COPRTN_FOUND_PURPS) 등으로 구성되어 있으며, 문화시설의 위치정보(WGS84 위경도 및 좌표값)도 함께 제공합니다.이 자료는 지역문화 기반시설의 현황 분석, 전통문화와 민속행사 활동 기획, 문화정책 수립, 지역별 문화인프라 불균형 해소 등을 위한 기초자료로 활용됩니다. 특히 지방문화원은 지역 고유 문화의 보존과 발전에 중심적 역할을 하며, 각종 문화행사, 교육 프로그램, 전통문화 계승 사업 등을 수행하는 비영리 특별법인입니다.이 데이터를 통해 각 지역 문화원의 운영상태 및 위치를 파악하고, 지역문화 향유기회 확대, 균형발전, 주민 문화복지 증진 등의 정책수립에 실효성 있는 자료로 활용될 수 있습니다.
