description_portal: 서울서베이의 서울시민 하고 싶은 여가활동을 제공하는 일반ㆍ조사통계로 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써 서울의 현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을 모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는 정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을  제시하는데 목적이 있습니다. 서울시민(성별ㆍ연령별ㆍ지역별ㆍ학력별 등)의 하고싶은 여가활동(여행또는 야외나들이, TV또는 비디오시청, 문화예술관람, 운동 등)에 대한 항목을 제공합니다.
