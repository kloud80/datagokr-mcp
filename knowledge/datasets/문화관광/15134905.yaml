description_portal: 광주시립미술관에서 진행 중이거나 예정된 전시에 대한 정보를 표 형식으로 정리하여 제공합니다. 해당 표에는 각 전시의 제목을 비롯해 관람 시 제공되는 전시 언어, 입장 요금(무료 또는 유료 여부), 주최 기관, 전시되는 작품의 수, 전시 시작일과 종료일, 그리고 참여 작가의 이름 등 주요 정보를 포함하고 있습니다. 이러한 항목들을 통해 관람객들이 전시에 대한 전반적인 내용을 쉽게 파악하고, 관심 있는 전시를 사전에 확인하여 방문 일정을 계획할 수 있도록 돕고자 합니다. 이 테이블은 전시 내용을 한눈에 보기 좋게 정리한 것으로, 광주시립미술관의 다양한 전시를 효과적으로 소개하기 위한 목적을 가지고 있습니다.
