summary_user: 서울 마포구에서 인터넷컴퓨터게임시설제공업(PC방)과 다른 영업을 한 장소에서 함께 하는 복합유통게임제공업소의 인허가 정보를 업소별로 담는다. 인허가일자·영업상태·폐업일자·주소·좌표와 시설면적·층수·비상구 등 시설 항목이 함께 들어 있다. 시민이나 감독기관이 "우리 동네 이 복합게임업소가 정식 인허가를 받고 지금도 영업 중인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 잇는다.
description_portal: 서울특별시 마포구 내 인터넷컴퓨터게임시설제공업 또는 다른 영업을 동일 장소에서 함께 영업하는 업소에 대한 정보를 제공합니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명, 문화사업자구분명, 총층수, 제작취급품목내용, 시설면적, 지상층수 및 지하층수 등의 정보가 포함되어 있습니다. 이 데이터를 통해 시민과 감독기관은 해당 업종의 합법적인 운영 여부와 안전한 게임 이용 환경을 확인할 수 있습니다.
