description_portal: 소마미술관 조각작품은 국민체육진흥공단에서 운영하는 소마미술관 관련 작품 등 정보를 제공합니다. 소마미술관의 작품명과 작가명을 국문 또는 영문으로 검색할 수 있습니다.(국문작품명, 영문작품명, 국문작가명, 영문작가명) 그리고 소마미술관 조각작품의 국·영문 작품명, 국·영문 작가명,작품의 크기, 재질(재료명), 작품이 설치된 장소 및 사진 URL, 전시명과 구매일자, 국적명 등 작품에 대한 상세한 정보 조회 기능을 가지고 있습니다. 이 서비스는 소마미술관의 조각작품 정보를 다국어로 제공하여 예술 연구, 전시 기획, 문화 콘텐츠 개발 등에 활용될 수 있습니다.
