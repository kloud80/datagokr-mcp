summary_user: 소마미술관(올림픽공원 내 조각작품)의 조각작품을 작품 1점 단위로 담은 목록으로, 국·영문 작품명과 작가명, 국적, 제작연도, 크기, 재료, 설치 위치·작품영역, 전시명, 구매일자, 사진 URL을 제공한다. 전시 기획자나 연구자가 '특정 작가의 조각이 어디에 설치되어 있고 어떤 재료로 만들어졌는가'를 확인하거나, 관람객용 다국어 안내 콘텐츠를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름 매칭으로만 이어 쓴다.
limits: 문화시설 코드나 좌표 같은 공통 키가 없어 문화기반시설·공연 데이터와 직접 조인할 수 없다. 설치 위치(location_nm)는 이름 텍스트일 뿐 좌표가 아니므로 지도 분석에는 별도 위치 매핑이 필요하다.
