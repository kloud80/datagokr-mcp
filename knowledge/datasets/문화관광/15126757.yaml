summary_user: 인천 서구 구립도서관(검암·단봉늘봄·검단·심곡·석남·신석 등) 도서관별로 연간 대출 상위 100위 도서의 순위, 도서명, 저자, 출판사, 출판년도, 등록번호, ISBN, 대출횟수를 담은 집계 파일입니다. 지역 주민이나 도서관 운영자가 "우리 동네 도서관에서 올해 가장 많이 빌려간 책은 무엇인가"를 확인하거나 장서 구성·추천 도서 선정에 쓴다. 전역 조인 키는 실측되지 않았으나, ISBN 컬럼을 매개로 국가서지나 도서관정보나루의 도서 정보와 이름·번호 매핑으로 이어 쓸 수 있다.
description_portal: 인천서구구립도서관 각 도서관 별(검암, 단봉늘봄, 검단, 심곡, 석남, 신석도서관) 연간 인기 대출 도서 100위까지의 정보를 제공합니다.  (각 도서관 명, 순위, 도서명, 저자, 출판사, 출판년도, 등록번호, ISBN, 대출횟수으로 구성)각 도서의 식별을 위한 제어번호, 제목, 저자, 발행처, 발행연도, ISBN과 같은 서지 정보뿐만 아니라 실제 대출 횟수까지 포함되어 있어 실질적으로 이용자들에게 어떤 책들이 높은 선호도를 보였는지 파악할 수 있습니다. 이 자료는 이용자들의 독서 동향 분석, 도서관 장서 구성 등 관련 전략 수립, 추천 도서 서비스 운영 등에 활용될 수 있으며 추출된 패턴을 기반으로 한 독서 문화 조성 방향을 마련하는 데 중요한 자료로 사용됩니다.
