summary_user: 독립기념관이 소장한 독립운동 관련 신문 11종(독립신문, 국민보, 대한민국임시정부공보, 북미시보, 신한국보 등)의 서지정보를 기사·문서 단위로 담은 파일 데이터로, 자료명·대제목·발행일·문서분류를 포함하며 약 10MB 크기의 CSV로 활용신청 없이 받는다. 독립운동사 연구자나 교육자가 '1920년대 상해 독립신문에 어떤 제목의 기사가 실렸는지', '하와이 한인신문이 언제 어떤 내용을 보도했는지'를 찾아볼 때 쓴다. 관리번호(ikm_newspaper_mgmt_no)로 독립기념관 소장자료를 식별하고, UCI코드(uci_cd)로 국가 콘텐츠 식별체계를 쓰는 다른 아카이브·디지털 자료와 이어 쓴다.
description_portal: '독립기념관에서 소장하고 있는 독립운동 관련 신문에 대한 XML 정보로 독립신문, 국민보 등 11종의 자료를 포함하고 있다국민보 : 1913년 8월 1일 발간된 이래 1968년 12월 25일 폐간되기까지 하와이 한인사회에서 발행되었던 신문들 중 가장 대표적인 국문판 주간신문이다.대한민국임시정부공보 : 대한민국임시정부(이하 임시정부)가 공식적으로 발행한 일종의 官報이며, 임시정부가 존재하고 활동하는 기간 동안 줄곧 발행되었다.독립신문 : 중국 상해에서 발행된 신문으로 상해에 대한민국임시정부가 수립되자 이내 공보를 발행하여 널리 그 결의 내용을 알렸다.북미시보 : 북미지역 동지회의 역량을 강화하고 독립운동을 적극 지원하기 위해 대한인동지회 북미총회가 발행한 신문이다신한국보 : 하와이 한인사회가 북미의 한인사회와 함께 국민회로 통합된 후 발간된 대표적인 하와이 한인신문이다.'
