summary_user: 부산광역시 해운대구 관내 관광지를 한 곳당 한 건으로 담은 목록 API로, 관광지명·소개·주소·문의전화·홈페이지·VR 영상 주소·위도·경도·대표이미지를 제공한다. 해운대구를 찾는 여행자나 지역 안내 서비스를 만드는 사업자가 '해운대구에 어떤 관광지가 있고 어디에 있으며 어떻게 문의하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지명(trrsrtNm)이나 주소·좌표로 맞춰 이어 써야 한다.
description_portal: '부산광역시 해운대구 관내에 있는 관광지에 대한 정보를 조회할 수 있는 오픈 API 서비스를 제공합니다.관광지명, 관광지 소개, 주소, 문의전화, 홈페이지 주소, VR URL 주소, 위도, 경도, 대표이미지 정보를 포함하고 있습니다.각 항목별 설명은 다음과 같습니다.- 관광지명: 관광지의 이름- 소개: 관광지에 대한 설명- 주소: 관광지가 위치한 곳의 주소- 문의전화: 관광지에 대해 문의할 수 있는 전화번호- 홈페이지 주소: 관광지에 대한 대표 홈페이지 주소- VR URL 주소: 관광지 VR 영상을 볼 수 있는 URL 주소- 위도: 관광지 주소의 위도값- 경도: 관광지 주소의 경도값- 대표이미지: 관광지의 대표이미지 사진'
