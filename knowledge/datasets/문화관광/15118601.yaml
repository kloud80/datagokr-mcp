description_portal: 이 데이터는 판소리를 중심으로 한 국악 공연의 영상 목록 정보를 담고 있는 디지털 아카이브입니다. 각 영상 콘텐츠에 대해 공연의 제목, 주요 공연자, 그리고 공연의 성격과 배경을 설명하는 내용을 상세히 기술하고 있습니다. 또한, 각 공연의 날짜 정보와 함께 영상의 내용을 짐작할 수 있는 썸네일 이미지 파일의 웹 주소를 제공하여 사용자의 이해를 돕습니다. 이 자료는 판소리를 비롯한 다양한 전통 예술 공연의 영상 기록을 체계적으로 정리한 것으로, 온라인을 통해 우리 전통문화유산을 접하고 연구하는 데 있어 중요한 가치를 지니는 데이터입니다.
