summary_user: 제주농업생태원 한 곳의 무장애 여행 코스를 지점 단위로 담은 파일로, 지점마다 순서·위경도·동선 구분·설명·주요 포인트·상세정보와 전체코스·추천코스 여부를 담는다. 휠체어 이용자나 이동약자가 이 생태원을 어떤 동선으로 돌면 되는지, 노면·경사·화장실 접근이 어떤지 확인하는 데 쓰고, 열린관광지 정책 담당자의 현장 점검 자료로도 쓴다. 실측 컬럼에 전역 조인 키나 TourAPI 콘텐츠 ID가 없어서, 다른 관광 데이터와는 시설 이름으로 맞추거나 위경도로 공간 매칭해 잇는다.
description_portal: '"제주특별자치도 내 제주특별자치도_농업생태원_무장애여행코스 데이터를 제공합니다.*본 데이터셋은 제주농업생태원(제주특별자치도 소재) 무장애 여행 코스 정보를 제공합니다. 해당 자료는 이동약자 및 휠체어 이용자의 편의를 고려하여 위치 정보, 동선 구분, 각 지점 설명, 주요 포인트 및 추천코스 등으로 구성되어 있으며, 노면 상태 및 경사도, 보행환경, 주차 및 화장실 접근성 등 현장기반 정보도 포함하고 있습니다. 무장애 관광환경 조성, 열린관광지 확대 및 관광 서비스 개선과 관련한 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
