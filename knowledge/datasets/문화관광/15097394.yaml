summary_user: 제주특별자치도 농업생태원 일대에서 장애인·노약자·영유아 동반 가족이 이용할 수 있는 주변 음식점, 카페·편의점, 숙박시설, 관광지를 시설 한 곳당 한 행으로 담은 목록이며, 농업생태원으로부터의 거리, 주소, 전화번호, 휠체어 진입 가능 여부, 장애인 화장실 여부를 함께 싣는다. 휠체어를 쓰는 가족이 농업생태원 방문 전후에 들를 식당이나 숙소 가운데 휠체어로 들어갈 수 있고 장애인 화장실이 있는 곳을 고르거나, 무장애 관광 지도를 만들 때 쓴다. 전역 조인 키는 없으며, TourAPI 관광지 목록 같은 다른 관광 데이터와는 시설 명칭이나 주소를 직접 맞춰 이어야 한다.
description_portal: '"제주특별자치도 내 농업생태원_무장애주변관광지 데이터를 제공합니다.* 제주특별자치도 농업생태원 일대에서 관광약자인 장애인, 노약자, 영유아 동반 가족 등이 무장애로 이용 가능한 주변 관광시설 정보를 체계적으로 정리한 통계자료입니다. 이 자료는 음식점, 카페·편의점, 숙박시설, 관광지 등 다양한 유형의 시설에 대해 명칭, 거리, 주소, 연락처, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등의 접근성 지표를 포함하고 있어, 이동 및 이용에 제약이 있는 이용자들의 방문 여건을 객관적으로 확인할 수 있습니다. 또한 이 정보는 무장애 관광 지도 제작, 관광서비스 접근성 개선, 지역 관광정책 수립 및 평가 등에 활용될 수 있는 기초자료로 제공됩니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
