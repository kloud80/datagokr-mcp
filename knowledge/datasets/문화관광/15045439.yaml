summary_user: 경기도 시군별로 열린 민물고기 이동전시 행사를 행사 한 건씩 담은 목록으로, 시군명·행사명·전시기간·전시장소·행사내용·비고를 담는다. 교육기관이나 지역축제 담당자가 "우리 시군에서 언제, 어디서 민물고기 생태교육 전시가 열렸나"를 확인하거나 다음 전시를 기획할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명(sigun_nm) 같은 이름 매칭으로만 잇는다.
description_portal: 이 데이터는 시군별로 운영된 민물고기 이동전시 행사에 대한 현황을 정리한 자료입니다. 각 행사는 전시의 목적과 대상에 따라 다양한 주제와 장소에서 이루어졌으며, 주요 항목으로는 시군명, 행사명, 전시기간, 전시장소명, 행사내용, 비고사항이 포함됩니다. 전시내용은 민물고기를 주제로 한 생태교육, 전시 및 체험활동, 지역축제 등으로 구성되어 있으며, 각 시군의 교육기관, 전시장소 또는 야외공간 등에서 진행되었습니다. 해당 데이터는 지역사회 생태환경교육, 문화행사 기획, 정책 평가 및 향후 전시기획에 유용하게 활용될 수 있습니다.
