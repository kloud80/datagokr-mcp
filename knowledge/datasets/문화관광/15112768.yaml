description_portal: 서울올림픽기념국민체육진흥공단이 운영 중인 경륜·경정 전용 온라인 발매시스템인 '스피드온(Speed-On)'을 통해 수집된 이용자의 일자별 발매 현황을 기반으로 일자별, 시행체별, 연령대별, 성별로 구분하여 집계된 발매 이용자 수를 제공합니다. 스피드온은 경륜 및 경정 경기의 경주관련 발매서비스를 이용자들이 손쉽게 비대면을 접근할 수 있도록 개발된 시스템으로, 사용자 중심의 서비스 환경을 구축하고자 하는 목적에서 출발하였습니다. 경륜·경정 사용자 집단별 다양한 패턴을 분석할 수 있으며, 트렌드 및 매출 변화 등을 파악할 수 있습니다. 또한 서비스분석, 정책 수립, 마케팅 전략 수립 등에 활용할 수 있는 자료입니다.
