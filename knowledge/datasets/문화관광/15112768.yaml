status: active
summary_user: 경륜·경정 온라인 발매시스템 스피드온의 발매 이용자 수를 경주일자·시행처별로 연령대(20대~80대)와 성별로 나눠 집계한 데이터로, 건별 원천이 아닌 일자 단위 집계이며 범위는 전국·비공간입니다. 분석가나 정책 담당자가 '경륜·경정 온라인 이용자 중 어떤 연령·성별 집단이 늘고 있는가' 같은 이용자 구성 변화와 추세를 볼 때 쓴다. 전역 조인 키가 없어 경주일자(race_ymd)와 시행처 코드(meet_cd)를 기준으로 같은 기관의 경륜·경정 경주·매출 데이터와 이름·코드 매핑으로만 맞춰 쓴다.
limits: 이용자 수 집계만 담아 개별 이용자나 발매 금액은 알 수 없고, 탈퇴 회원은 연령·성별 미분류로 따로 잡힌다. 시행처 코드의 뜻을 풀어주는 코드표가 없어 경륜·경정 구분은 같은 기관 코드로 맞춰야 한다. 체육 부문 정리에서 경륜·경정은 핵심 범위에서 제외된 보조 등급 데이터다.
