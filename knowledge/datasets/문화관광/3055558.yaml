summary_user: 대구광역시 동구에 있는 지정·등록 문화재(국가유산)를 한 건씩 담은 목록 파일로, 유산명·지정구분·종류·지정번호·수량(무형유산은 보유자)·소유자·소재지·지정일·관리자를 담는다. 동구 안에 어떤 보물·기념물·무형유산이 어디에 있고 누가 관리하는지 알고 싶은 주민·연구자·관광 콘텐츠 개발자가 쓴다. 실측 컬럼에 전역 조인 키가 없어서 국가유산청 자체 API나 다른 유산 목록과는 유산명·지정번호·지정구분을 맞춰 보는 방식으로만 잇는다.
description_portal: '대구광역시 동구의 문화재 현황 공공데이터는 동구에 소재한  문화재 정보를 구조화해 제공합니다. 문화재명, 지정구분, 종류, 수량(보유자), 소유자(보유자 기예능), 소재지(전승지), 지정일, 관리자(대표) 등의 항목을 포함합니다.포함 항목은 다음과 같습니다문화재명, 지정구분(예: 보물·기념물), 종류(건축·유물 등)지정번호, 수량(보유자), 소유자/기예능 보유자, 소재지(전승지)지정일, 관리자(대표), 비고 등의 세부정보해당 데이터는 문화재 기본정보 외에도, 관리자·보유자 정보, 상세 비고를 포함해 다양한 분야에서 활용 가능한 형태로 제공되어 지자체·학계·개발자 모두에게 유용합니다.'
