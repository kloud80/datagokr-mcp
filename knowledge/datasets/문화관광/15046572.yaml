description_portal: '○ 통계개요* 통계명 : 예술단* 통계종류 : 서울시 예술단의 운영현황을 제공하는 일반ㆍ보고통계* 작성목적 : 객관적이고 신뢰성 있는 공연예술분야의 통계산출 및 공연예술시장운용실태에 대한 체계적 분석으로 예술정책을 위한 기초자료로활용하는 것을 목적으로 함* 조사체계 : 세종문화회관, 서울시립교향악단 등 해당기관* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 소속 단원수 등의 예술단 운영 현황 등○ 기 타* 서울시립교향악단은 2006.6.1. 독립재단으로 분리됨○ 출 처 : 세종문화회관, 서울시립교향악단'
