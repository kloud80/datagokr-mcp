summary_user: 충청남도 홍성군 안의 게이트볼장을 시설 한 곳당 한 행으로 담은 1KB 남짓한 소규모 CSV 파일로, 시설명·도로명주소·연면적·면수·관리기관·전화번호·데이터기준일자를 담는다. 홍성군 주민이나 생활체육 동호인이 가까운 게이트볼장의 위치, 경기장 면수, 문의 연락처를 찾을 때 쓰고, 군 담당자는 지역 체육시설 현황을 파악하는 데 쓴다. 전역 조인 키나 시설 코드가 없으므로 다른 체육시설 데이터와는 도로명주소나 시설명으로 맞춰 붙이거나, 같은 홍성군 자료끼리 묶어 쓴다.
