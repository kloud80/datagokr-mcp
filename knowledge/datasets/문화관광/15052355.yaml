summary_user: 서울 전역에서 열리는 공연·문화행사를 행사 한 건씩 담으며, 분류·자치구(GUNAME)·행사명·장소·기간·이용대상·요금·유무료·출연자·프로그램 소개·문의처·위경도를 함께 제공한다. 시민이 '이번 주말 우리 구에서 열리는 무료 공연이 무엇인가'를 찾거나, 분석가가 자치구별·테마별 문화행사 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자치구명·장소명 같은 이름 매칭이나 위경도 기반 공간 결합으로 이어 쓴다.
description_portal: 서울시 문화행사 정보 데이터는 서울 전역에서 열리는 다양한 공연과 문화행사 현황을 한눈에 파악할 수 있도록 정리한 공공 데이터입니다. 분류, 자치구, 공연·행사명, 날짜, 장소 정보로 어떤 행사가 언제 어디서 열리는지 알 수 있으며, 기관명, 이용대상, 이용요금, 유무료 정보가 함께 제공되어 시민들이 본인에게 맞는 행사를 선택하는 데 도움을 줍니다. 출연자 정보, 프로그램 소개, 기타내용을 통해 행사 내용을 구체적으로 파악할 수 있고, 문의 및 홈페이지 주소, 문화포털 상세 URL을 통해 추가 안내 및 사전 예약, 상세 조회가 가능합니다. 또한 시작일과 종료일, 행사시간, 경도·위도 정보까지 포함하고 있어 지도 서비스 연계, 일정 추천 서비스, 자치구별·테마별 문화 인프라 분석 등 다양한 행정·민간 활용에 적합한 데이터입니다.
