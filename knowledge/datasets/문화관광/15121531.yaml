summary_user: 국립국악원이 수집한 국악 관련 구술채록 자료를 건별로 담으며, 자료마다 명칭·생산자·등록일·재생시간 등 크기(extent)·내용 설명·관련 인물과 장소·시간 범위·언어·저작권 정보가 들어 있다. 국악 연구자나 교육 콘텐츠 제작자가 '특정 명인이나 지역의 국악 전승에 대해 남겨진 구술 기록이 무엇이 있고 이용 조건은 어떤가'를 찾는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 인물명·주제어(subjectKeyword) 같은 이름 매핑이나 같은 기관 자료끼리로만 연결한다.
description_portal: 국립국악원에서 수집한 구술채록 자료는 전통 음악과 관련된 인물, 장소, 시간적 범위, 언어, 저작권 등 다양한 정보를 포함하고 있습니다. 명칭, 발행처, 출판년도, 자원의 크기나 재생시간, 내용, 관련 장소, 기여자 등 주요 항목을 체계적으로 제공하여 국악 연구, 문화유산 보존, 교육 자료 개발 등에 활용할 수 있습니다. 또한, 기관별 주제 분류와 핵심 주제어, 참조 자원 정보 등도 포함되어 있어 국악 분야의 학술 연구 및 문화예술 콘텐츠 제작에 유용하게 쓰입니다. 국악의 전승과 확산, 문화예술 정책 수립, 디지털 아카이브 구축 등 다양한 분야에서 참고자료로 활용 가능합니다.
