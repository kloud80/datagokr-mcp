description_portal: 인천관광공사는 인천관광이 처음이시거나, 잘 모르는 분들을 위해 인천지역 내 관광안내소 정보를 파일 데이터 형태로 제공하고 있습니다.제공하는 정보로는, 관광안내소 명칭, 관광안내소 위치, 안내소 연락처, 운영시작시간 및 운영종료시간, 휴관일, 안내소 제공 부가서비스입니다.인천관광공사 개방 공공데이터 활성화 및 인천관광의 활성화를 위하여, 인천관광공사는 관광안내소 정보를 지속적으로 현행화하여 개방할 예정입니다.관련문의는 인천관광공사 홈페이지 공공데이터 창구 및 공공데이터 플랫폼을 통해 해주시기 바랍니다.
