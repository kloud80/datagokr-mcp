summary_user: 전라남도 농업박물관(영암군 삼호읍)이 운영하는 교육·체험·행사 프로그램을 프로그램 한 건씩 담은 CSV 파일(약 8KB)로, 프로그램명·행사기간·일시·장소·참가대상·성인/청소년/어린이별 참가비·내용을 담는다. 가족이나 학교·단체 담당자가 '이 박물관에서 언제 어떤 체험을 하고 아이 참가비는 얼마인가'를 확인할 때, 또는 지역 문화행사 현황을 정리하는 분석가가 쓴다. 실측 컬럼에 전역 조인 키(문화시설 코드 등)가 없어 다른 문화시설·행사 데이터와는 시설명이나 같은 기관 기준으로만 이어 쓴다.
description_portal: '- 전라남도 농업박물관 교육/행사 프로그램 정보입니다.(카테고리, 프로그램명, 행사기간시작, 행사기간끝, 행사시작일시, 행사종료일시, 행사장소, 참가대상, 참가비_성인, 참가비_청소년, 참가비_어린이등)- 전라남도 농업박물관은 전라남도 영암군 삼호읍에 위치한 농업 및 농경 문화를 주제로 한 전문 박물관입니다.- 내부 전시관- 농경문화관 : 선사시대부터 현대까지 사계절 농업사와 영산강 유역의 농경 발달 - 쌀문화관: 쌀의 역사적·문화적 가치, 가공 및 유통 방식 소개 - 남도생활민속관: 전라남도 지역의 생활 풍습 및 민속 자료 전시- 체험 & 야외 시설- 농경문화체험관: 도리깨, 연자매, 지게 등 전통 농기구와 놀이 체험 가능- 농업테마공원 & 야외전시장: 민속 도구 전시, 생태연못, 공연장, 텃밭 및 체험 학습장'
