summary_user: 전남 관광 안내 홈페이지 '남도여행길잡이'의 자유게시판 글을 게시글 한 건마다 제목·작성일·내용으로 담은 CSV 파일(약 2.1MB)이며, 관광 새소식·공모·홍보성 글이 섞인 건별 원천 텍스트입니다. 분석가가 '전남 관광 게시판에 어떤 주제(섬·해양 관광, 방문의 해 홍보 등)의 글이 언제 많이 올라왔나'를 보는 텍스트 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 글 속 관광지명·지역명을 이름으로 맞춰 잇거나 같은 기관 자료끼리만 묶어 쓴다.
limits: 관광지 코드나 지역코드 같은 조인 키가 없어 TourAPI 관광 콘텐츠와 직접 연결되지 않고, 공간 정보가 없는 비공간 데이터라 위치 기반 분석에는 쓸 수 없습니다. 관광 부문에서 보조 등급으로 판정 보류된 자료로, 관광지 원장 용도로는 TourAPI를 대표 자료로 씁니다.
