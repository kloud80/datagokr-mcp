summary_user: 충청남도 금산군 안의 문화체육관광부 지정 전통사찰을 사찰 한 곳당 한 줄로 담은 작은 CSV 파일로, 지정번호·지정일·사찰명·주소·지목·면적(제곱미터)을 수록한다. 금산군의 전통사찰이 어디에 있고 언제 지정됐으며 부지 면적이 얼마인지 확인하려는 문화유산 담당자·연구자·관광 기획자가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사찰명이나 주소를 직접 맞춰 이어야 한다.
description_portal: 이 데이터는 문화체육관광부에서 지정한 충청남도 금산군 내 전통사찰에 대한 데이터로 지정번호, 지정일, 사찰명, 주소, 지목, 면적(제곱미터)에 대한 정보를 제공합니다. 2023년 8월 기준 총 6개 사찰에 대한 정보가 수록되어 있습니다. 해당 데이터는 종교 및 문화시설 현황을 파악하고 문화유산 관리 정책을 수립하거나 관광자원을 개발하는 등 다양한 목적으로 활용될 수 있습니다. 특히 지정 사찰의 행정적 등록 사항과 위치 정보를 명확히 확인할 수 있어, 관련 기관 및 연구자들에게 기초 자료로서 유용합니다.
