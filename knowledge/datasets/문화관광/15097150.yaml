summary_user: 제주 칠머리당터와 건입동 벽화거리 일대의 무장애 여행코스를 지점(순서) 단위로 담은 코스 원천 파일로, 지점별 위도·경도, 구분, 설명, 포인트, 상세정보, 전체·추천 코스 여부를 담는다. 휠체어 이용자나 영유아 동반 가족이 '이 코스를 어떤 순서로 돌고, 주차장·화장실은 어디서 이용하나'를 미리 확인하거나, 무장애 관광 콘텐츠를 만드는 사업자가 경로 지도를 그릴 때 쓴다. 실측 컬럼에 전역 조인 키(TourAPI contentId·지역코드 등)는 없고, 위도·경도로 다른 관광지·편의시설 위치와 공간적으로 맞추거나 장소 이름으로 대조해 잇는다.
description_portal: '"제주특별자치도 내 칠머리당터와건입동벽화거리_무장애여행코스 데이터를 제공합니다.* 제주특별자치도 칠머리당터와 건입동 벽화거리 일대는 장애인·노약자·영유아 동반 가족 등 관광약자의 무장애 여행을 고려한 코스로 설계된 지역입니다. 본 자료에는 이 장소의 위치, 주차장 및 화장실의 접근성, 추천 동선 및 주요 포인트 등이 포함되어 있어 이동이나 시설 이용에 제약이 있는 이용자도 사전에 방문 계획을 체계적으로 세울 수 있도록 구성되어 있습니다. 또한 이 정보는 무장애 관광 콘텐츠 제작, 관광서비스 접근성 개선 및 관련 정책 수립과 평가 등에 활용될 수 있는 중요한 기초자료입니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
