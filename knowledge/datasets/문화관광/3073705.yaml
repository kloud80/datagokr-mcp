description_portal: 성남시는 시민의 문화 향유 기회를 확대하고 영상문화 기반을 강화하기 위해 다양한 형태의 영화상영관을 운영하고 있다. 현재 성남시에는 **민간 복합상영관**이 분당구, 중원구, 수정구에 고르게 분포하고 있으며, 대부분 쇼핑몰이나 대형 복합문화시설 내에 위치해 접근성이 높다. 이들 상영관은 최신 디지털 상영시스템과 다관 상영체계를 갖추고 있어 상업영화, 예술영화, 개봉작 등 다양한 콘텐츠를 제공하고 있다.또한, 데이터 내용은 구별, 상영관명, 연락처, 상영관 소재지 등의 내용으로 현황이 작성되어 공개되고 있다.
