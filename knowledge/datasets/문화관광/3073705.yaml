summary_user: 성남시 안의 영화상영관을 한 곳당 한 행으로 정리한 현황 파일로, 구별·상영관명·연락처·도로명 소재지·데이터기준일자를 담는다(시군구 범위, 개별 주소 단위). 성남 시민이나 분석가가 '분당·중원·수정구에 영화관이 어디에 몇 곳 있고 연락처는 무엇인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 상영관명 매칭, 구 이름 기준으로만 이어 쓴다.
