summary_user: 서울 강서구 안 당구장업의 인허가 정보를 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 관리번호·인허가일·취소일·영업상태와 세부상태·폐업일·휴업기간·소재지 주소·좌표 등을 포함한다. 강서구에서 지금 영업 중인 당구장이 몇 곳이고 최근 어디서 폐업이 늘었는지를 알아보려는 분석가나 창업 예정자가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 구의 같은 체육시설업 인허가 데이터나 상권 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 서울시 강서구 지역 내 당구장 운영에 관한 인허가 정보를 제공하며, 개별 사업장의 등록번호, 등록일, 폐업 여부, 세부 영업상태 등을 포함합니다. 실내 스포츠 여가시설인 당구장의 행정이력과 업종 운영 실태를 파악할 수 있으며, 체육시설 공급 현황 및 변화 추이 분석에도 유용합니다. 특히 지역 기반 체육 및 여가 정책 수립, 민간 체육시설의 운영 활성화 전략 마련, 도시 여가 공간 연구 등에 활용도가 높습니다. 데이터는 체육관광과에서 제공하며, 영업 중지 및 폐업 정보도 포함되어 있어 현재 가동 여부 분석도 가능합니다.
