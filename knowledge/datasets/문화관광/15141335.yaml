summary_user: 서울 금천구의 청소년게임제공업소를 업소(관리번호) 단위로 담은 인허가 원천 데이터로, 인허가·취소·폐업·휴업 일자, 영업상태, 지번·도로명 주소와 좌표, 시설면적·층수·방 수, 비상계단·소방·조명·음향 등 시설 여부를 포함한다. 창업 예정자나 구청 담당자가 '금천구에서 지금 영업 중인 청소년 게임장은 어디이고 시설 요건은 어떠한가'를 확인하거나 지역 내 업소 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관(자치단체) 코드로만 이어 쓴다.
description_portal: 청소년게임제공업의 인허가 및 영업 현황을 체계적으로 정리한 데이터입니다. 인허가일자, 영업상태, 사업장 주소, 전화번호, 사업장명, 시설면적, 총게임기수, 청소년실 여부, 편의시설, 소방시설 등 다양한 항목을 포함하고 있습니다. 이를 통해 청소년 대상 오락시설의 창업 준비, 운영 현황 파악, 정책 수립, 지역 내 업소 분포 분석, 안전 점검 등에 활용할 수 있습니다. 또한 해당 데이터는 청소년 건전 놀이문화 조성, 시설 안전 관리 강화, 지역 상권 분석, 게임 산업 동향 파악 등 여러 분야에서 기초 자료로 유용하며, 행정기관·연구기관·민간 부문 모두에서 참고할 수 있는 실효성 높은 정보입니다.
