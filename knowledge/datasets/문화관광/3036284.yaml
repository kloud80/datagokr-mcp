summary_user: 광주광역시 관내 공연장을 한 곳당 한 행으로 담은 현황 파일로, 공연장명·소재지 주소·관리자·전화번호와 객석수·객석면적·무대면적을 담는다. 공연 기획자나 예술단체가 '광주에서 300석 안팎에 무대가 넓은 공연장은 어디이고 관리 주체는 누구인가'처럼 대관 후보를 고를 때 쓰며, 지역 공연 인프라 규모를 파악하는 기초 자료로도 쓴다. 전역 조인 키가 없어서 KOPIS 공연장 목록(공연장ID)이나 문화시설 데이터와는 공연장명·주소를 맞춰 이어 써야 한다.
description_portal: 광주광역시에서는 2024년 12월 말 기준으로 관내 공연장에 대한 상세한 현황 정보를 제공합니다. 이 자료에는 각 공연장의 명칭, 정확한 소재지 주소, 운영 및 관리 주체, 연락 가능한 전화번호 등 기본적인 정보뿐만 아니라, 공연장 면적 및 공연객석수 등 실질적인 안내 항목들이 포함되어 있습니다.  해당 정보는 문화예술 활동의 활성화를 위한 기초 자료로 활용될 수 있으며, 공연 기획자, 예술단체, 일반 시민 등 다양한 이용자들에게 실질적인 도움이 될 수 있습니다. 또한, 지역문화 인프라 현황을 체계적으로 파악하고 향후 공연장 운영에 필요한 기초자료로 활용될 수 있습니다.
