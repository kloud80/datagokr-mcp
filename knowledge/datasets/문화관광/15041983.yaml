summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU)에 등록된 쇼핑 콘텐츠를 업소 한 건당 한 행으로 담은 파일로, 콘텐츠명과 평일·주말 영업 시작·종료 시간, 택배 배송 여부를 포함한다. 제주 여행객이나 여행 앱 개발자가 "주말 저녁에 문을 열고 택배 발송이 되는 제주 쇼핑 장소는 어디인가" 같은 일정·추천 질문에 쓴다. 실측 컬럼에 전역 조인 키나 TourAPI contentId가 없어, 다른 관광 콘텐츠 데이터와는 콘텐츠명 문자열 매칭으로만 이어 쓸 수 있다.
