status: active
summary_user: 전국 자치단체가 관리하는 음반물배급업 인허가 정보를 업소 한 곳당 한 건으로 모은 데이터로, 사업장명·인허가일자·영업상태·휴폐업일자·소재지 주소와 좌표를 담는다. 음반 유통 사업을 준비하는 사업자나 분석가가 "우리 지역에 영업 중인 음반 배급업소가 몇 곳이고 최근 폐업한 곳은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 개방자치단체코드(OPN_ATMY_GRP_CD)·주소·사업장명으로 같은 기관의 다른 인허가 업종 데이터나 행정구역 자료와 맞춰 잇는다.
limits: 필수 조건인 기준일자와 개방자치단체코드는 다른 데이터의 코드값이라 먼저 받아서 넘겨야 호출이 된다. 이력(/history) 오퍼레이션은 최소 파라미터로 호출했을 때 응답이 없었다. 소재지 주소는 동·호수 등 상세 주소가 비식별 처리되어 있고, 좌표는 Bessel 중부원점TM(EPSG:5174)이라 변환 후 써야 한다.
