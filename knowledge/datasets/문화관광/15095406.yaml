summary_user: 울산광역시 울주군에 있는 국가지정유산(국보·보물·민속문화유산·기념물·무형유산·명승·천연기념물)을 유산 한 건씩 이름·종목·시대·수량·지정일·소재지·내용과 함께 담고, 포털 설명상 이미지 자료도 포함한 파일 데이터다(zip 약 213MB). 울주군에 어떤 국가지정유산이 있고 각각 언제 지정됐는지, 어디에 있는지를 알아보려는 주민·관광 안내 담당자·지역 문화 분석가가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않았으므로 국가유산청 자료와는 유산 이름·종목으로 맞춰 이어 쓴다.
description_portal: 울산광역시 울주군 관할 및 소재의  국가지정유산(국가유산청장이 문화유산법, 무형유산법 또는 자연유산법에 의하여 문화유산위원회, 무형유산위원회 또는 자연유산위원회의 심의를 거쳐 지정(인정)한 국가유산으로서 국보, 보물, 민속문화유산, 기념물, 무형유산, 명승 또는 천연기념물 7개 유형으로 구분)에 관한 이미지 데이터 등을 제공합니다.
