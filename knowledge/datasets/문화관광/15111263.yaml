summary_user: 강남구도시관리공단이 운영하는 매봉산실내배드민턴장의 강좌별 프로그램 정보를 강좌 한 건당 한 행으로 담은 작은 파일(CSV 약 1.1KB)로, 강좌명·운영요일·교육 시작·종료 시각·교육대상·정원·수강료·접수방법·교육장 도로명주소를 담는다. 주민이 '매봉산 배드민턴장에서 평일 저녁 성인 강좌가 있고 수강료와 신청 방법은 어떤가'를 확인하거나, 분석가가 공공체육시설 생활체육 강좌의 시간대·요금을 비교하는 데 쓴다. 전역 조인 키는 없어서 다른 시설 프로그램 데이터와는 시설명·운영기관명 같은 이름이나 교육장 도로명주소로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 매봉산실내배드민턴장에서 운영하는 프로그램의 상세 정보를 종합적으로 정리하여 제공하는 자료입니다.강좌명, 교육 시간, 교육 대상, 교육 방법, 강좌정원 및 수강료 등 프로그램 신청에 필요한 핵심 정보를 포함하여, 강좌 내용을 쉽게 확인하고 이용할 수 있도록 제공합니다.교육이 진행되는 장소 정보와 운영기관 연락처 등 이용 편의를 위한 정보도 함께 제공되며, 접수 방법 구분을 통해 온라인, 방문 등 신청 절차를 명확히 안내합니다.이 데이터는 생활체육 참여 활성화와 공공체육시설 프로그램의 투명한 공개 및 수강 편의 증진에 활용될 수 있습니다.
