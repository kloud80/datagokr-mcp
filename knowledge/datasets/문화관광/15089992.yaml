summary_user: 국립중앙극장 공연예술박물관이 소장한 공연예술자료를 생산한 공연을 폴더 단위로 정리한 목록으로, 폴더번호·폴더유형·제목·부제목·기간(시작일·종료일)·장소·수행주체를 건별로 담으며 활용신청 없이 CSV 파일(약 1.9MB)로 받는다. 연구자나 공연 기획자가 '특정 작품이나 단체의 과거 공연 기록이 박물관에 어떤 자료로 남아 있는가'를 찾을 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID와 직접 연결되지 않으므로, 다른 공연 데이터와는 제목·장소·수행주체 이름을 맞춰 이어 쓴다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 이름 매칭에 의존하므로 동명 공연이나 표기 차이가 있으면 연결 오류가 생긴다. 명세상 연 단위로 갱신되므로 최근 공연 기록은 다음 갱신 전까지 빠져 있을 수 있다.
