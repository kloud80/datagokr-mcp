description_portal: 경기도 광명시 박물관 및 미술관 현황 데이터로, 등록 박물관은 충현박물관이 있으며 미등록 사립박물관으로 청곡부채 박물관이 있음. 미술관은 없음. 현황 정보로는 시설명, 박물관미술관구분, 소재지도로명주소, 소재지지번주소, 위도, 경도, 운영기관전화번호, 운영기관명칭, 움영홈페이지, 편의시설정보, 관람시간, 휴관정보, 관람료, 교통안내 등 기본 정보를 제공. 충현박물관은 이원익 종가에서 운영하는 광명시 유일의 등록 사립박물관으로 많은 유물을 보관하고 있는 수장고, 전시관, 오리이원익 고택 및 관감당, 조각상 등을 보유하고 있음
