summary_user: 한국정책방송원(KTV)이 만든 정책·문화 교양 프로그램의 목록과 상세 정보를 건별로 담으며, 제목·제작자·등록일·주제분류·키워드·분량·설명·출연자·저작권 같은 메타데이터를 내려주고 범위는 전국·비공간이다. 시민이나 콘텐츠 기획자가 특정 주제나 키워드로 KTV 교양 영상을 찾거나, 분석가가 정책방송 교양물의 주제 분포를 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 제목·키워드 같은 이름 매핑이나 같은 기관 데이터로만 잇는다.
description_portal: 한국정책방송원의 문화교양 정보를 외부 개발자 및 사용자가 이를 활용 할 수 있도록 전달하는 API 서비스입니다. 문화교양 목록정보와 상세정보 등 다양한 정보를 제공합니다.
