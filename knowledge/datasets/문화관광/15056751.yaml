summary_user: 경기도 내 여관업(10실 이상 30실 미만, 욕실 등 일부 시설 공동 사용) 숙박업체의 인허가 현황을 업소 한 곳당 한 행으로 담으며, 시군명·인허가일자·영업상태·폐업일자·양실 수와 한실 수·면적·주소와 WGS84 좌표를 포함한다. 분석가나 정책 담당자가 "우리 시군에 지금 영업 중인 여관이 몇 곳이고 객실은 얼마나 되는가"를 확인하거나, 창업 예정자가 주변 여관의 분포를 살피는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 시군 코드·시군명, 주소, 좌표를 기준으로 여인숙·일반호텔 등 같은 기관의 다른 숙박업 현황이나 공중위생 인허가 원천(LOCALDATA)과 이름·위치를 맞춰 잇는다.
description_portal: 이 데이터는 경기도 내 숙박업체 중 여관업의 인허가 현황을 제공하며, 여관은 10실 이상 30실 미만 규모로 객실을 운영하고 욕실 등 일부 시설을 공동으로 사용하는 숙박업 형태를 의미합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘위생업종명’, ‘위생업태명’, ‘건물소유구분명’, ‘양실수’, ‘한실수’, ‘소재지면적’, ‘다중이용업소여부’, ‘우편번호’, ‘WGS84 위도·경도’ 등이 포함됩니다. 이를 통해 여관업체의 위치, 운영 현황, 객실 구성, 위생 및 건물 관리 정보를 종합적으로 확인할 수 있습니다. 데이터는 경기도 31개 시군 단위로 제공되며, 지역별 숙박 인프라 분석, 소규모 숙박산업 정책 수립, 안전·위생 관리 점검 자료로 활용될 수 있습니다. 또한 여인숙, 일반호텔 등과 비교하여 숙박업 시장 구조를 이해하고, 관광객 수요에 따른 숙박시설 발전 방향을 모색하는 데 기초자료로 활용할 수 있습니다.
