summary_user: 궁능유적본부가 관리하는 조선왕릉(동구릉·광릉·홍유릉·사릉·태릉·정릉·헌릉 등)의 관람객 수를 일자별로 집계한 파일이며, 왕릉마다 유료·무료, 내국인, 영어권·일어권·중어권·기타외국인 관람객 수를 열로 나눠 담는다. 관광 분석가나 지자체가 어느 시기에 내국인 관람객이 몰리는지, 외국인은 어느 왕릉을 많이 찾는지 같은 관광수요와 추이를 볼 때 쓴다. 전역 조인 키가 없고 왕릉 이름이 열 이름에 들어 있을 뿐이어서, 다른 유산 데이터(종목코드·지정번호 기반)와는 왕릉 이름을 직접 매핑해야 이어 쓸 수 있다.
description_portal: '궁능유적본부가 보존하고 관리하는 조선왕릉의 관람객 숫자를 집계한 엑셀자료입니다. 일자별 유료와 무료 관람객, 내국인과 외국인(영어권, 중국어권, 일본어권, 기타언어권)의 관람객 숫자를 알 수 있습니다.데이터를 통해서 어느 시기에 국내 관람객이 많은지, 외국인 관람객은 어느 왕릉을 많이 찾는지 등 관광수요와 추이를 확인해볼 수 있습니다.모든 조선왕릉은 월요일에 휴관입니다.조선왕릉 : 동구릉, 광릉, 홍유릉, 사릉, 태릉, 정릉, 헌릉, 선릉, 의릉, 영휘원, 서오릉, 서삼릉, 융릉, 파주삼릉, 파주장릉, 김포장릉, 양주온릉, 세종대왕릉'
