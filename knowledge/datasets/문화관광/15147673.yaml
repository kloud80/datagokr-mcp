summary_user: 서울특별시 강북구 관내 인쇄소 등 인쇄업소의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 영업 중인 곳과 폐업한 곳이 모두 들어 있다. 인쇄업 창업을 준비하는 사업자가 강북구에서 영업 중인 인쇄소의 위치와 인허가·폐업 시점을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 지번·도로명 주소, 업소명(BPLCNM) 같은 이름 매핑이나 같은 기관의 자치단체 코드로만 연결한다.
