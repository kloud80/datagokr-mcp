summary_user: 한국예술디지털아카이브에 등록된 예술단체·예술인을 한 줄에 하나씩 담은 목록 파일로, 단체명·대표명·아카이브 상세페이지 주소 세 항목으로 구성되며 CSV 크기는 약 6KB입니다. 연구자나 예술행정 담당자가 '이 극단이나 무용단이 아카이브에 등록돼 있는지, 대표는 누구인지' 확인하고 상세페이지로 넘어갈 때 쓴다. 공통 조인 키가 없어 다른 공연·시설 데이터와는 단체명·대표명 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 한국문화예술위원회가 운영하는 한국예술디지털아카이브에 등록된 예술단체 및 예술인 목록 현황 자료로, 국내 예술계의 주요 단체 정보를 체계적으로 정리한 자료입니다. 각 항목은 단체명, 대표명, URL로 구성되어 있으며, 단체명 항목에는 강통아트센터, 극단 로얄씨어터, 구보댄스컴퍼니, 아즐가, 무빙 이미지그룹 반달 등 다양한 장르와 성격의 예술단체 이름이 포함되어 있습니다. URL 항목은 해당 단체의 상세 정보를 열람할 수 있는 링크로, 접속 시 한국예술디지털아카이브 홈페이지 내 해당 단체의 단체유형, 대표자 정보, 홈페이지 주소, 설립일, 단체 소개, 사진 자료 등이 제공됩니다. 이를 통해 예술단체의 기본 정보뿐 아니라 활동 이력과 시각자료까지 종합적으로 확인할 수 있어, 예술기관 네트워크 구축, 정책자료 활용, 예술행정 및 연구 목적의 기초자료로 폭넓게 활용될 수 있습니다.
