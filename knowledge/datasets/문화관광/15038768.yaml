summary_user: 여주시 관내 게임산업 관련 사업장을 업소 한 곳당 한 행으로 담은 등록(신고) 현황 파일로, 업종명·등록(신고)번호·등록일자·상호·도로명/지번 주소·시설면적을 포함한다(약 8KB 규모의 CSV). 시민이나 분석가가 "여주시 어느 동네에 PC방·게임장 같은 게임 관련 업소가 몰려 있고 언제 등록됐나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 상호를 매칭하거나 같은 기관(여주시) 자료끼리 이어 써야 하며, 주소를 지오코딩하면 위치 기반 분포 분석에 붙일 수 있다.
limits: 범위가 여주시 한 곳에 그쳐 다른 시군과 비교하려면 각 지자체 파일을 따로 모아야 한다. 공통 코드 키가 없어 다른 데이터와 연결할 때는 주소·상호 문자열 매칭에 기대야 한다.
