summary_user: 경기도 내 영화 제작업체의 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 인허가일자·폐업일자·영업상태·도로명/지번 주소·위경도 좌표·시설면적·층수 같은 건물 정보가 들어 있습니다. 문화산업 분석가나 시군 담당자가 "우리 시군에 영업 중인 영화 제작업체는 몇 곳이고 어디에 몰려 있나"를 확인하는 데 씁니다. 전역 조인 키는 없으므로 시군코드(SIGUN_CD)처럼 같은 기관(경기도)이 쓰는 코드나 사업장명·주소로 맞춰 잇고, 위경도 좌표로 지도 위에 겹쳐 본다.
description_portal: 「영화 제작업체 현황」 데이터는 경기도 내 영화 제작업체의 인허가 정보를 제공하는 자료입니다. 주요 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태명(BSN_STATE_NM), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT), 문화체육업종명(CULTUR_PHSTRN_INDUTYPE_NM), 시설면적(FACLT_AR), 소방시설여부(FIREFACLT_YN), 편의시설여부(CONVNCE_FACLT_YN) 등입니다. 이 데이터는 31개 시군별로 영화 제작 관련 사업체의 분포와 상태를 확인할 수 있으며, 영화 제작 산업의 현황 파악, 지역별 문화산업 정책 수립, 시설 안전관리 및 제작 인프라 분석에 활용될 수 있습니다. 또한 건물용도, 주변환경, 층수 등 세부 항목이 포함되어 있어 제작업체의 물리적 환경까지 파악할 수 있습니다.
