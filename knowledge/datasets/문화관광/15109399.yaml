summary_user: 경주시에서 열리는 축제를 축제 한 건 단위로 담은 API로, 축제 이름·주소·개최 장소·시작일과 종료일·연락처를 제공한다. 관광객이나 관광 앱 개발자가 '이번 주말이나 이번 계절에 경주에서 열리는 축제가 어디서 언제 하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 축제명·주소 같은 이름 매칭으로만 연결한다(TourAPI 행사 정보와 겹치는 축제도 이름으로 대조해야 한다).
limits: 경주시 한 곳의 축제만 담으므로 다른 시군이나 전국 축제 비교에는 단독으로 쓸 수 없다. 데이터는 이벤트성으로 생성된 뒤 바뀌지 않는 주기로 분류돼 있어, 최신 축제 일정이 반영됐는지 호출 시점에 기간(시작일·종료일)을 직접 확인해야 한다. 개발계정은 하루 10,000회까지 호출할 수 있다.
