status: active
summary_user: 소마미술관과 올림픽기념관에서 운영하는 대국민 교육프로그램을 프로그램 건별로 담으며, 교육명·교육 시작·종료일자·장소·수강료·정원 구분·교육대상·교육종류·설명·자료 URL을 포함한다. 국민이 '이번 달 소마미술관에서 우리 아이가 들을 수 있는 교육이 있는지, 수강료는 얼마인지'를 확인하거나, 분석가가 미술관 교육 운영 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키나 문화시설 코드가 없어 다른 데이터와는 시설명·교육명 같은 이름 매칭이나 같은 기관 데이터로만 이어 쓴다.
limits: 실측 컬럼에서 조인 키를 찾지 못해 문화시설총람 시설코드나 좌표로 바로 연결할 수 없다. 범위는 전국·비공간으로 분류되지만 실제 내용은 소마미술관 한 곳의 프로그램이며, 지역별 문화 분포 분석에는 맞지 않는다.
