description_portal: 소마미술관 교육프로그램은 서울올림픽기념국민체육진흥공단의 올림픽기념관과 소마미술관에서 진행하는 대국민 교육 프로그램의 정보를 제공합니다. 교육시작일자 및 교육명을 이용하여 서울올림픽기념국민체육진흥공단의 소마미술관에서 국민대상으로 진행하는 소마미술관 교육프로그램 정보를 조회하는 기능을 제공합니다. 교육 시작 및 종료일자, 설명 및 상세설명 내용, 교육장소명, 교육을 수강하는 비용금액, 교육을 수강할 수 있는 정원구분명, 자료 URL, 교육종류, 교육명, 교육대상명 등에 대한 정보를 조회할 수 있습니다. 이 서비스는 소마미술관에서 운영하는 교육 프로그램 정보를 제공하여 국민 대상 문화예술 교육 참여 확대와 프로그램 운영의 효율성 제고에 활용될 수 있습니다.
