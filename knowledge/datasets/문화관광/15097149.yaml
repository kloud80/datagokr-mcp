summary_user: 제주시 추억애거리와 도두등대 일대 무장애 여행코스를 지점 단위 행으로 담은 파일이며, 각 지점의 순서·위도·경도·구분·설명·포인트·상세정보와 함께 전체코스와 추천코스에 속하는지 표시한다. 휠체어 이용자나 영유아 동반 가족이 이 코스를 걸을 때 주차장·화장실 접근성과 추천 동선이 어떻게 되는지 미리 확인하는 데 쓰고, 무장애 관광 지도 제작에도 쓴다. 전역 조인 키는 없으므로 위도·경도로 다른 관광지·편의시설 위치 데이터와 겹쳐 보거나, 장소 이름으로 TourAPI 관광지 정보와 맞춰 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_추억애거리와도두등대_무장애여헹코스 데이터를 제공합니다.* 제주특별자치도 추억애거리와 도두등대 일대는 장애인, 노약자, 영유아 동반 가족 등 관광약자의 무장애 여행을 고려해 설계된 여행코스로, 벽화 거리와 해안 경관이 조화를 이루는 평탄하고 접근성이 높은 산책 동선을 제공합니다. 본 자료에는 해당 장소의 위치, 주차장 및 화장실의 접근성, 추천 동선 및 주요 포인트, 휴무일 및 관람료 정보 등이 포함되어 있어 이동이나 이용에 제약이 있는 이용자도 사전에 방문 계획을 수립할 수 있도록 구성되어 있습니다. 이 정보는 무장애 관광 지도 제작, 관광서비스 접근성 개선 및 지역관광정책 수립·평가 등에 유용한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
