summary_user: 부산광역시 안 공연장을 한 곳씩 담은 시설 목록으로, 시설명·주소·위경도 좌표·개관연도·좌석수·시설 특징·홈페이지·대관 여부 등을 개별 시설 단위로 제공한다. 공연 기획자나 문화 분야 분석가가 '부산에서 좌석 500석 이상이면서 대관이 가능한 공연장은 어디인가'처럼 규모·위치·대관 조건으로 공연장을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 KOPIS 공연장ID(mt10id) 같은 외부 키와는 바로 연결되지 않으며, 공연장명·주소 매칭이나 좌표(위도·경도)를 이용한 공간 결합으로 KOPIS 공연 목록 등 다른 데이터와 이어 쓴다.
description_portal: 공연장 목록 서비스는 일반 시민을 위한 서비스가 아닙니다. 이는 부산시 내 공연장 정보를 담은 공공데이터 API(Application Programming Interface)이며, 개발자나 연구자들이 활용할 수 있도록 제공되는 데이터셋입니다.데이터 제공 형식은 Open API (JSON, XML 형식)와 더불어, 지도에 표출 가능한 SHP 파일 형식으로도 제공됩니다.시설명, 주소, 좌표, 개관연도, 좌석수, 시설특징, 홈페이지 주소 등의 정보를 제공합니다.개방되는 데이터를 통해 민간 서비스 개발을 촉진하여 시민들이 더욱 편리하게 문화 정보를 접할 수 있도록 지원하는 역할을 할 수 있습니다.
