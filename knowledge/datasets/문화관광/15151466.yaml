summary_user: 조난·부상 동물(천연기념물 등)을 구조해 치료한 건마다 조난일자, 동물명, 수량, 조난장소, 치료기관, 치료결과, 청구금액·지급금액을 한 행씩 담은 전국 단위 원천 파일(CSV)이다. 분석가나 보호단체가 "어떤 동물이 어느 지역에서 자주 조난되고, 어느 치료기관에서 얼마의 비용을 들여 어떤 결과를 냈는가"를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산 지정 목록(종목코드·지정번호)과는 동물명 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 「국가유산청_동물치료 현황통계」는 조난되거나 부상당한 동물의 구조 이후 치료 및 지원 현황을 체계적으로 관리하기 위해 구축된 공공데이터입니다. 주요 항목에는 조난일자, 동물명, 수량, 치료기관, 치료결과, 청구금액, 지급금액 등이 포함되어 있습니다. 이를 통해 구조된 동물이 언제, 어디서, 어떤 기관에서 치료를 받았는지와 치료 결과 및 예산 집행 내역을 한눈에 파악할 수 있습니다. 본 데이터는 동물보호 및 복원 사업의 투명성을 제고하고, 향후 국가유산 관련 생태계 보전 및 긴급 구조 정책 수립에 근거 자료로 활용됩니다.
