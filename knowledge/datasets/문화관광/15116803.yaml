summary_user: 광주 남구 관내에서 운영 중인 여행업 업체를 한 곳씩 담은 건별 목록으로, 업체명·도로명 소재지·전화번호·데이터기준일자를 담는다(csv 약 5KB). 남구에서 동네 여행사를 찾는 주민이나, 구 단위 여행업체 분포를 보려는 분석가가 '남구에 여행사가 어디에 몇 곳 있나'를 확인하는 데 쓴다. 전역 조인 키나 등록번호가 없어 다른 데이터와는 업체명이나 도로명 주소를 맞춰 잇거나, 같은 남구의 다른 관광사업 목록과 나란히 놓는 방식으로만 연결한다.
limits: 등록번호·사업자번호 같은 식별 키가 없어 관광사업 등록 원장이나 타 지역 자료와 정확히 매칭하기 어렵다. 범위는 남구 한 시군구로 한정되며, 개인정보가 포함된 전화번호는 비어 있다.
