description_portal: 울산시설공단은 시민들이 공공시설 내에서 더 깨끗하고 쾌적한 환경을 유지할 수 있도록, 각 시설에 설치된 먼지털이기의 위치 및 관련 정보를 체계적으로 제공합니다. 제공되는 데이터에는 시설명, 주소, 상세위치, 운영시간, 연락처, 위도, 경도, 기준일자 등의 항목이 포함되어 있습니다. 이 정보는 시민들이 시설 내 먼지털이기를 쉽게 찾고, 적절한 시간에 사용할 수 있도록 돕는 데 유용합니다. 시설명과 주소 항목을 통해 각 먼지털이기가 설치된 공공시설의 위치를 확인할 수 있으며, 상세위치를 통해 더 구체적인 설치 지점을 알 수 있습니다. 또한, 운영시간 정보를 통해 이용 가능한 시간을 미리 확인할 수 있어 불편함 없이 시설을 이용할 수 있습니다. 기준일자는 제공된 정보의 최신성을 확인할 수 있도록 해줍니다.
