summary_user: 광주광역시 남구 구립 공공도서관을 도서관 1곳당 1행으로 담은 작은 목록 파일(csv 약 1.4KB)로, 운영시간·휴관일·열람좌석수·장서 수·대출 규정·주소·위도/경도를 담는다. 남구 주민이 '토요일이나 공휴일에 문을 여는 가까운 구립도서관이 어디인가'를 찾거나, 분석가가 구 단위 도서관 시설·장서 규모를 비교하는 데 쓴다. 전역 조인 키나 도서관코드가 없어 다른 데이터와는 도서관명·주소로 맞추거나 위도·경도로 공간 결합해야 하며, 전국도서관표준데이터의 같은 기관 행과 이름으로 대조해 쓴다.
description_portal: 광주광역시 남구 구립도서관에 대한 정보(도서관명, 소재지, 연락처, 운영시간, 휴관일, 상호대차 가능여부 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 도서관과(☎062-607-2542)에서 제공합니다. 현재 해당 데이터는 전국도서관표준데이터(https://www.data.go.kr/data/15013109/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다. ※ 공공도서관은 모든 시민이 자유롭게 이용할 수 있도록 국가나 지방자치단체가 설립·운영하는 도서관입니다. 책, 정기간행물, 전자자료 등 다양한 자료를 무료 또는 저렴하게 제공하며, 독서와 학습, 문화 활동의 거점 역할을 합니다. 자료 열람과 대출 서비스뿐 아니라 독서 프로그램, 강연, 전시, 문화 행사 등 다양한 평생교육 서비스도 운영합니다. 공공도서관은 정보 접근성을 높이고 지역 주민의 지식·문화 수준 향상과 여가 선용에 기여하는 중요한 공공시설입니다.
