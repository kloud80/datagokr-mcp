summary_user: 제주 마을별 특화자원(주요생산물, 문화재, 체험프로그램, 축제 등)을 자원 한 건씩 마을명·행정리, 주소, 위도·경도, 이용시간, 요금, 수용인원, 주차와 함께 담은 원천 목록이며, 포털에서 CSV 파일(약 190KB)로 받는다. 여행자나 마을관광 기획자가 "이 마을에서 체험하거나 볼 수 있는 자원은 무엇이고 언제, 얼마에 이용할 수 있나"를 찾는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 관광 데이터와는 주소, 좌표, 마을·행정리 이름을 맞춰 이어 쓴다.
description_portal: 제주관광공사_마을특화자원 데이터는 2022년 공공데이터 뉴딜 사업의 일환으로 구축된 제주 마을관광 정보 데이터 입니다. 제주도 내 각 마을별 주요생산물, 문화재, 체험프로그램, 축제, 유형문화재, 무형문화재 등의 정보를 포함하고 있습니다. 데이터에는 마을명, 시군구명, 읍면동명, 행정리명, 특화자원명, 특화자원유형, 소재지 전화번호, 소재지도로명주소, 소재지지번주소, 위도와 경도, 특화자원내용, 수용인원수,주차가능수, 휴무일, 이용시간, 요금정보, 편의시설, 데이터기준일자 등의 항목을 제공합니다.
