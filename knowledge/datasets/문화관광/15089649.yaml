summary_user: 인천광역시 서구(제목상 서해구) 안의 테니스장을 시설 한 곳당 한 행으로 정리한 현황 파일로, 시설명·유형·주소·데이터기준일자를 담는다(CSV 399바이트의 소규모 파일). 주민이나 생활체육 담당자가 '우리 동네 근처에 어떤 공공 테니스장이 있나'를 확인하거나 구 안의 테니스장 분포를 볼 때 쓴다. 전역 조인 키는 없고 주소(주소)를 기준으로 좌표 변환이나 다른 체육시설 목록과의 이름·주소 매칭으로만 이어 쓴다.
