summary_user: 경기도 양주시 안에 지정된 문화재를 한 건씩 담은 목록 파일(CSV, 약 8.7KB)로, 문화재 구분(보물·사적 등)과 지정번호·지정명칭·소재지·지정일자·관리기관명을 담는다. 양주시에 어떤 국가·도 지정 문화재가 어디에 있고 언제 지정됐으며 누가 관리하는지 알고 싶은 시민·탐방객·지역 연구자가 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록과는 지정명칭과 구분·지정번호를 대조해 맞추고, 위치 연계는 소재지 주소 문자열에 기대야 한다.
description_portal: 경기도 양주시_문화재현황 데이터는 양주시 내에서 지정된 문화재의 전반적인 현황을 담고 있다. 데이터에는 문화재의 구분(보물, 사적 등), 지정번호, 지정명칭, 소재지, 지정일자, 관리기관명 등이 포함되어 있어, 문화재 보호와 관리 체계를 이해하는 데 유용하다. 예를 들어, 양주 회암사지 석조약사여래좌상, 회암사지 대웅전터 등 주요 문화재의 위치와 지정 현황이 데이터에 반영되어 있다. 이를 통해 시민들은 지역 내 문화유산의 가치를 알 수 있으며, 행정기관은 문화재 보존 및 활용 정책 수립 시 참고 자료로 활용할 수 있다. 또한 소재지 정보는 문화재 탐방 및 관광 활성화에 기여하며, 지정일자는 문화재 지정 역사와 과정을 추적하는 데 활용 가능하다. 관리기관명은 각 문화재를 담당하는 기관을 명시하여 책임 소재를 명확히 하고, 관리 체계의 효율성을 높인다. 본 데이터는 학술 연구, 교육 자료, 지역 문화유산 홍보 등 다양한 목적으로도 활용될 수 있으며, 양주시의 역사·문화적 자산을 체계적으로 이해하고 보존하는 데 중요한 기반 자료로 제공된다.
