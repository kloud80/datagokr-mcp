summary_user: 전국 지자체 인허가에 등록된 야영장(캠핑장)을 시설 단위로 담은 건별 원천 API로, 전체 3,115건에 야영장명·구분·주소·좌표·사이트 수·편의·안전 시설 항목이 들어 있다. 캠핑을 가려는 국민이나 분석가가 특정 지역에 어떤 유형의 야영장이 있는지, 지역 간 시설 격차는 어떤지 확인하는 데 쓴다. 사업자등록번호(bizrno→bizno)와 주소(addr1, addr2→address)를 키로 관광사업 등록 데이터나 다른 주소 기반 데이터와 이어 쓴다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 전국 지방자치단체 인허가 시스템에 등록된 야영장(캠핑장) 운영 현황을 체계적으로 수집한 데이터입니다. 야영장명, 구분 유형, 위치 정보, 화장실·샤워실·개수대 등 편의 시설과 소화기·방화수 등 안전 시설 보유 현황을 포함합니다. 캠핑 관련 정책 수립, 관광 인프라 분석, 안전 관리 체계 구축에 활용 가능하며, 캠핑장 서비스 품질 향상, 지역별 관광 자원 개발 전략 수립, 캠핑 수요 예측 및 시설 투자 계획 수립에 기여할 수 있습니다. 또한 야영장 운영 현황 모니터링, 지역 간 시설 격차 분석, 안전 기준 준수율 평가를 통한 체계적인 관리 방안 도출에도 활용 가능합니다.
