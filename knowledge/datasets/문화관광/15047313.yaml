description_portal: 이 데이터는 송파여성인력개발센터에서 제공하는 수강 가능한 교육강좌들의 정보를 담고 있습니다. 강좌명, 교육내용, 신청가능 여부, 운영기간, 수강대상, 교육기관 등의 항목이 포함되어 있어, 관심 있는 수강생이 어떤 강좌를 언제 신청할 수 있는지 한눈에 확인할 수 있게 구성되어 있습니다. 또한 접수마감 된 강좌는 제외되어 실질적으로 신청 가능한 강좌 위주로 정보가 제공되며, 여성 인력개발 및 역량강화 프로그램의 운영 현황 분석이나 수강 기회의 지역·대상별 격차 파악에도 활용 가능합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://songpa.seoulwomen.or.kr/ 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
