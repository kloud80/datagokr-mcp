summary_user: 부산 해운대구 관내 쇼핑상점을 상점 한 곳당 한 건으로 담으며, 상점명·전화번호·주소·소개·홈페이지·대표이미지와 위도·경도 좌표, VR 영상 주소를 포함한다. 해운대 여행객이나 관광 앱 개발자가 '해운대에서 들를 만한 쇼핑 장소는 어디이고 위치·연락처는 무엇인가'를 확인하거나 지도에 상점을 표시할 때 쓴다. 전역 조인 키나 코드표는 없어서, 다른 관광 데이터(TourAPI 등)와는 상점명·주소를 맞추거나 좌표로 근접 매칭해 잇는다.
description_portal: '부산광역시 해운대구 관내에 있는 쇼핑상점에 대한 정보를 조회할 수 있는 오픈 API 서비스를 제공합니다.상점명, 홈페이지, 전화번호, 주소, 소개, VR 주소, 위도, 경도, 대표이미지 정보를 포함하고 있습니다.각 항목별 설명은 다음과 같습니다.- 상점명: 쇼핑상점의 고유 명칭- 홈페이지: 쇼핑상점에 대한 대표 홈페이지 주소- 전화번호: 쇼핑상점에 대해 문의할 수 있는 전화번호- 주소: 쇼핑삼점이 위치한 곳의 주소- 소개: 쇼핑상점에 대한 설명- VR 주소: 쇼핑상점 VR 영상을 볼 수 있는 RURL 주소- 위도: 쇼핑상점 위치의 위도 좌표- 경도: 쇼핑상점 위치의 경도 좌표- 대표이미지: 쇼핑상점의 대표이미지 사진'
