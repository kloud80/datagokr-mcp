summary_user: 경기도 내 사찰에서 운영하는 템플스테이 프로그램을 사찰 한 곳씩 담은 목록으로, 사찰명·시군·프로그램 유형·산 이름·홈페이지·전화번호와 도로명·지번 주소, 위경도 좌표를 포함한다. 여행객이나 여행상품 기획자가 "경기도 어느 시군에서 어떤 유형의 템플스테이를 체험할 수 있나"를 찾고 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 사찰명 이름 매칭, 위경도 좌표로 다른 관광지·숙박 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 사찰에서 운영되는 템플스테이 프로그램의 현황을 담고 있으며, 사찰명, 시군명, 프로그램유형, 홈페이지 주소, 전화번호, 산명, 주소 정보(도로명·지번·우편번호), WGS84 기준 위도 및 경도 등 다양한 정보를 제공합니다. 템플스테이는 불교 전통과 문화를 체험할 수 있도록 기획된 프로그램으로, 각 사찰별로 운영 형태가 상이하며, 프로그램유형 항목을 통해 체험 유형을 확인할 수 있습니다. 해당 데이터는 종교 및 전통문화 체험 기반 관광 콘텐츠 기획, 정신건강 힐링 여행상품 개발, 지역 문화자원 관리 등 다양한 정책 및 민간 활용 방안에 기여할 수 있습니다. Open API를 통해 데이터 접근성이 높으며, 상업적 이용과 콘텐츠 변경도 가능하여 민간 활용성이 뛰어납니다.
