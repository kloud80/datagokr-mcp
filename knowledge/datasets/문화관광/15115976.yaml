description_portal: '서울특별시 중구의 여관, 여인숙, 호텔 등 잠을 자고 머물수 있도록 시설 및 설비 등의 서비스를 제공하는 업소 정보입니다. 각 등록업소에 부여된 관번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지, 객실수 등의 주요 항목들로 구성되어 있습니다. 이 자료는 관광진흥 및 숙박 서비스 관련 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 객실수 규모 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민과 관광객에게는 위생관리 및 공중위생 기준을 충족하며 운영되는 신뢰할 수 있는 관광호텔 및 등록업소의 위치와 이용시설 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
