summary_user: '독립기념관이 관리하는 국외 독립운동사적지별로 관련 인물·사건·단체를 한 줄씩 기록한 파일로, 사적지관리번호 하나에 구분(인물·사건·단체)과 등록순번, 내용, 등록일자가 붙는 건별 목록이다(CSV 약 45KB). 연구자나 교육·답사 기획자가 특정 국외 사적지(예: 중국 소재 사적지)에 어떤 독립운동가나 단체가 관련되어 있는지, 또는 특정 인물·단체가 어느 국외 사적지와 이어지는지 찾을 때 쓴다. 전역 조인 키는 없으며, 사적지관리번호(관리번호)를 통해 같은 독립기념관의 국외사적지 기본정보 데이터와 맞춰 쓰고, 인물·단체 이름은 다른 독립운동 인물 자료와 이름으로 대조해야 한다.'
