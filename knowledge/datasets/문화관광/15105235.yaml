summary_user: 문화체육관광부 산하 기관이 주최·주관하는 문화예술·체육·관광 행사를 행사 한 건 단위로 담으며, 행사명·설명·유형·기간·유무료 여부·조회수·관련 URL을 전국 범위로 제공한다. 국민이나 여행·여가 서비스 사업자가 '이번 달 문체부 기관에서 여는 무료 전시·행사는 무엇인가'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공연·문화시설 데이터와는 행사명이나 기관명 매칭으로만 연결한다(원천 기관 자료 식별자 localId는 기관 내부 식별용).
description_portal: 문화체육관광부 산하 각 기관에서 주최하거나 주관하는 다양한 문화 행사와 관련 정보를 종합적으로 제공합니다. 주요 항목으로는 행사 제목, 상세 설명, 부가설명, 조회수, 행사 유형, 기간, 유료 또는 무료 여부, 관련 URL 등이 포함되어 있어 이용자가 행사 내용을 쉽게 파악하고 참여 여부를 결정하는 데 도움이 됩니다. 또한, 참조 자원 제목과 원천 기관 자료 식별자 등 부가 정보를 통해 행사와 관련된 추가 자료를 확인할 수 있습니다. 문화예술, 체육, 관광 등 다양한 분야의 행사 정보를 한눈에 확인할 수 있어, 국민의 문화생활 증진과 여가 활용에 유용하게 활용하실 수 있습니다.
