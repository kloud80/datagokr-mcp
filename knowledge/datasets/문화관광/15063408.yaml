summary_user: 청주시 시립도서관(산하 전체)이 보유한 소장자료를 한 건씩 담은 목록으로, 서명·저작자·매체 구분(도서, DVD 등)·수입 구분과 수입 연도·이용 제한·소장 자료실 등을 담으며 CSV 파일 하나가 약 334MB 규모다. 시민이나 분석가가 '청주시 도서관에 이 책이 있는지, 어느 자료실에 있는지'를 확인하거나 연도별 수서 경로와 매체 구성을 살펴보는 데 쓴다. ISBN이나 도서관코드 같은 전역 조인 키가 없어서 다른 도서관·서지 데이터와는 서명·저작자 같은 이름 매칭이나 같은 기관 데이터로만 이어 쓴다.
description_portal: '청주시에 있는 시립 도서관(산하 모든 도서관)이 보유하고 있는 소장도서 목록데이터입니다. 제공되는 정보는 다음과 같습니다. 각 자료의 서명, 즉 책의 이름을 기본으로 하며, 해당 도서에 부록이 포함되어 있는지 여부를 나타내는 책 부록 플래그가 있습니다. 자료가 도서관에 들어오게 된 경로를 알려주는 수입 구분과 그 시기를 명시하는 수입 연도도 포함됩니다. 또한, 도서관 내부적인 분류 체계를 반영한 관리 구분, 자료의 물리적 형태를 구분하는 매체 구분(예: 도서, DVD 등), 그리고 이용에 특정 제한이 있는지 여부를 나타내는 이용 제한 정보도 제공됩니다. 이 외에도 자료가 등록된 방식을 알려주는 등록 구분, 해당 자료를 만든 저작자 정보, 마지막으로 자료가 실제로 소장되어 있는 특정 자료실 정보까지 상세하게 포함되어 있습니다.'
