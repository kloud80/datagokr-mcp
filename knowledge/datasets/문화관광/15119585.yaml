summary_user: 독립기념관이 마이크로필름으로 보관한 일제강점기 전후 소장자료(상해독립신문, 일제 경찰심문조서, 일본 외무성 소장 한국관계문서, 간도 영토분쟁문서 등)를 자료 건별로 담은 목록으로, 관리번호·문서명·자료명·원문명·시기·페이지·발신자/수신자·키워드 등을 기록한 CSV 파일(약 6.3MB)이다. 독립운동사 연구자나 학생이 특정 인물·사건 키워드로 어떤 원문 문서가 어느 마이크로필름 어느 페이지에 있는지 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 문서명·키워드·발신자 같은 이름 매칭이나 같은 기관(독립기념관) 다른 목록과의 수작업 연결로만 이어 쓴다.
description_portal: 독립기념관에서 마이크로필름 형태로 보관하고 있는 소장자료 목록으로 미국 국무부 소장 한국관계정보, 일제경찰 심문조서, 일본외무성소장 한국관계문서 등 일제강점기 자료에 대한 목록정보와 키워드/검색정보이다.주요 항목으로는 관리번호, 문서명, 수집방법, 자료명, 원문명, 시기, 페이지 수 자료유형, 키워드, 검색어 등으로 구성되어 있다.주요 문서로는 상해독립신문, 일제 경찰심문조서, 일본 외무성소장 한국관계문서, 간도 영토분쟁문서, 일본군의 만주 출병 관계 문서 등이다.시기로는 개항기, 대한제국기, 일제강점기, 대한민국기 등으로 구분
