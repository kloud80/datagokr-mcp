summary_user: 주요 오픈소스 소프트웨어 라이선스(포털 설명상 약 80여 종)별로 라이선스 명칭, 고유ID, 관련 라이선스, 한글 요약 내용을 담은 라이선스 단위 참조 정보로, 지역 구분이 없는 전국·비공간 데이터다. 개발자나 기업이 '이 오픈소스를 제품에 넣어 배포할 때 어떤 의무를 지켜야 하나'를 확인할 때 쓴다. 다른 데이터와 잇는 전역 조인 키는 없고, 라이선스 명칭으로 매핑하거나 목록 오퍼레이션에서 받은 고유ID(lid)를 상세 조회에 넘기는 식으로 서비스 안에서만 연결한다.
description_portal: 일반적인 저작권과는 상이한 오픈소스 소프트웨어 라이선스에 대한 정보를 제공하는 서비스입니다. 대략 80여 종의 주요 오픈소스 라이선스에 대해 요약 정보, 주요 특징, 사용 시 의무사항 등을 알기 쉽고 체계적으로 제공하여, 개발자나 기업이 오픈소스를 도입하거나 배포할 때 저작권 문제를 사전에 인지하고 대응할 수 있도록 합니다. 오픈소스 SW의 무단 사용이나 조건 미이행으로 인한 저작권 분쟁 발생을 예방할 수 있으며, 안전하고 합법적인 오픈소스 활용 문화를 정착시키는 데 기여할 수 있습니다.
