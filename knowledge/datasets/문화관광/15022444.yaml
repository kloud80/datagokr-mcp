summary_user: 국립중앙박물관과 전국 소속 박물관의 특별전시를 전시 1건당 1행으로 담은 파일 데이터로, 전시명·기간·시간·요금·주최기관·장소 주소와 좌표를 포함하며 전국 37행, 2017-12-19부터 2026-06-30까지의 범위다. 관람객이 특별전시가 지금 열리는지, 요금과 할인·예매는 어떤지 찾아볼 때나 분석가가 전시 이력을 훑을 때 쓴다. 도로명주소·지번주소·홈페이지주소(address)와 경도·위도(coord)를 키로 지도나 주변 관광·교통 데이터와 이어 쓰며, 전시 자체를 가리키는 고유 ID는 없다.
