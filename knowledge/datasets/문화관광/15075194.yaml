description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 제주도립김창열미술관은 제주시 한림읍 용금로 883-5에 위치한 공립 미술관으로, ‘물방울’ 화풍으로 세계적으로 알려진 김창열 화백이 기증한 회화·판화·설치작품 약 220점을 소장하며, 건축적으로도 중정을 중심으로 8개의 큐브형 전시동이 둘러싸인 독특한 구조와 창을 통한 자연 채광, 분수와 야외 공간(빛의 정원), 디지털 아트 스페이스, 아트샵 등 복합 문화 공간을 갖추고 있고, 장애인 전용 주차장, 무단차 출입구, 엘리베이터, 단층 평면 구조 등 무장애 편의시설을 갖춰 누구나 쉽게 관람이 가능하며 제주 자연과 김창열의 예술세계를 동시에 체험 가능한 열린문화 공간이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
