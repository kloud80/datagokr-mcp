summary_user: 한국문화예술위원회 AK시각예술이 정리한 2015~2018년 시각예술 전시·행사를 행사 한 건당 한 행으로 담은 CSV 파일(약 18만 바이트)로, 행사명·회차·시작일·종료일·주최·장소·행사내용을 포함한다. 연구자나 기획자가 '2015~2018년에 어떤 기관이 어느 장소에서 어떤 시각예술 전시를 열었나'를 확인하거나 연도별 전시 이력을 정리할 때 쓴다. 전역 조인 키(공연예술 통합전산망 공연 ID, 문화시설 코드 등)가 없어 다른 공연·문화시설 데이터와는 주최·장소 이름을 직접 맞춰 연결해야 한다.
description_portal: AK시각예술의 전시행사정보입니다. 각 구성 항목으로는 연번, 연도, 행사명, 회차, 시작일, 종료일, 주최, 장소, 행사내용, 비고로 구성되어 있습니다. 연도는 2015부터 2018까지로 구성되어 있고 시작일과 종료일 항목은 날짜 형식으로 2015-01-29와 같은 형식으로 나타나 있습니다. 행사명 항목은 "주한도미니카공화국 카르나발 축제 사진전"과 같은 행사 이름이 나타나 있고 주최 항목은 백남준아트센터와 같이 주최사 이름이 나타나 있습니다. 장소 항목은 안산문화예술의전당과 같이 장소 이름이 나타나 있습니다. 따라서 파일에서 AK시각예술의 전시행사 정보를 확인할 수 있습니다.
