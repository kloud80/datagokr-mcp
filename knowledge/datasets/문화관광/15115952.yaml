summary_user: 서울특별시 강서구에서 인허가된 외국인관광도시민박업소를 업소 한 곳당 한 건으로 담은 인허가 원장이며, 인허가일자·취소일자, 영업상태와 상세상태, 폐업일·휴업기간, 사업장명, 지번·도로명 주소, 좌표, 객실 수와 건물 층수 같은 시설 정보를 포함한다. 강서구에서 현재 영업 중인 외국인 대상 도시민박이 어디에 몇 곳 있는지, 언제 개업하거나 폐업했는지를 확인하려는 주민·사업자·관광 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구 같은 업종 인허가 데이터나 숙박업 데이터와는 같은 기관 코드(OPNSFTEAMCODE), 주소·사업장명 매칭으로만 이어 쓴다.
description_portal: 서울특별시 강서구 외국인관광도시민박업 인허가 정보는 도시 지역의 일반 가정집 또는 주거용 건축물을 활용하여 외국인 관광객에게 숙박시설을 제공하는 민박업소에 대한 데이터를 포함하고 있습니다. 이 업소들은 단순한 숙박 제공을 넘어, 한국의 전통문화와 일상생활을 체험할 수 있도록 구성되어 있으며, 이를 통해 외국인 관광객의 지역사회 체류 경험을 증진시킵니다. 제공 항목으로는 인허가일자, 영업상태, 사업장명, 주소 등이 포함되며, 관광산업 육성, 민간 참여 활성화, 지역 경제의 다변화를 위한 기초자료로도 활용될 수 있습니다. 특히, 강서구는 인천공항과의 접근성이 뛰어나 외국인 숙박 수요가 높아, 본 데이터는 해당 수요를 반영한 실태 파악에 유용합니다.
