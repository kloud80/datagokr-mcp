summary_user: 제주특별자치도 관광객 유동인구를 기준년월·지번(PNU) 단위로 묶어 00시부터 24시까지 1시간 간격의 유동인구 수와 시간대별 비율로 담은 추정 집계 파일로, 포털 설명상 2015~2016년 시점 자료이며 범위는 제주도 한 곳, 공간 단위는 개별 지번이다. 관광 분석가나 상권·관광지 운영자가 '특정 필지 주변에 관광객이 몰리는 시간대는 언제인가'를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으나, 19자리 지번코드(PNU) 앞 10자리가 법정동리 코드라서 이를 잘라 법정동 단위 자료와 이름·코드 매핑으로 이어 쓴다.
description_portal: '2015~2016년도 시점의 제주특별자치도 시간대별 관광객 지번(PNU)단위 유동인구 현황입니다.유동인구란 일정 시간 동안 해당 지역을 방문하거나 이동한 사람들의 수를 말합니다. * PNU : 지번코드 (총19자리, 10자리-동리단위법정코드 + 1자리-일반/산 지번구분 + 4자리-본번 + 4자리-부번)* 데이터 구분자 : ""|""* 특이사항1 : 유동인구 추정과정에서 비율을 사용하여 유동인구 수가 소수점으로 표현됨* 특이사항2 : 유동인구는 단위지역에서 이동이 있는 개념으로 인구수와 달리 중복 카운트가 발생함※ 파일 다운로드 시 데이터에 대한 설명 txt 파일이 포함되어 있습니다.'
