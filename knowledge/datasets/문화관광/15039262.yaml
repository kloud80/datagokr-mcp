summary_user: 인천광역시 연수구 관내 공동주택 단지 안에 설치된 어린이놀이시설을 시설 한 곳당 한 행으로 담은 파일로, 시설번호·놀이시설명·설치일자 세 항목만 있습니다. 주민이나 관리주체가 우리 단지 놀이터가 언제 설치됐는지 확인하거나, 구·분석가가 설치 시점이 오래된 시설을 골라 안전점검·유지보수 대상을 정할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설번호나 놀이시설명을 이름·코드로 맞춰 연결해야 하며, 같은 기관(연수구) 자료끼리 잇는 정도로만 쓴다.
