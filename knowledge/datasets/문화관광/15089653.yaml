summary_user: 인천광역시 서구 내 족구장을 시설 한 곳당 한 행으로 담은 목록 파일로, 체육시설명·유형·주소와 데이터기준일자를 담는다(파일 크기 872바이트의 소규모 CSV). 주민이 "우리 동네 근처에 이용할 수 있는 족구장이 어디 있나"를 찾거나, 구 단위 생활체육 시설 배치를 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 시설명으로 맞추거나 같은 서구의 다른 체육시설 목록과 나란히 놓고 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 족구장 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 내 족구장의 체육시설명, 주소 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역주민들은 지역 내 족구장을 쉽게 찾아볼수 있으며 이로인해 주민들의 건강증진, 여가활동에 기여할 수 있을것으로 판단됩니다. 또한, 주민들의 생활체육 활성화 등 체육 관련 정책에도 활용할 수 있을것으로도 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
