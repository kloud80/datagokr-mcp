summary_user: 제주 차귀도-엉알해안로 무장애여행 코스의 지점별 위도·경도·해발고도를 담은 좌표 데이터이며, 포털 설명상 장소 설명과 이미지 정보도 함께 제공한다. 휠체어 이용자나 교통약자 동반 여행자가 엉알 해안산책로의 경로와 고저차를 지도에서 확인하거나, 관광 안내 콘텐츠 제작자가 접근성 코스 지도를 만들 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 TourAPI 관광지 정보 등 다른 데이터와는 장소 이름이나 좌표를 직접 맞춰서만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 차귀도-엉알해안로 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."*이 데이터셋은 차귀도-엉알해안로의 무장애 여행 정보를 제공하며, 위도·경도 좌표, 관광지 명칭, 장소 설명, 이미지 자료 등을 포함한다. 엉알 해안산책로는 해안 절벽과 바다 풍경, 낙조가 어우러진 자연 경관을 특징으로 하며, 휠체어 이용자 및 교통약자를 고려한 무장애 관광지로 데이터에 기초 정보를 제공한다. 공공 관광 안내, 접근성 평가, 지도 서비스와 관광 안내 콘텐츠 제작, 열린관광지 조성·정책 수립 및 관광 인프라 개선 등 공공 및 관광 분야에서 기초 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"1'
