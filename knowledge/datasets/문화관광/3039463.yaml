summary_user: 부천시가 시민에게 개방하는 공연장(부천시민회관, 부천아트센터 등)을 시설별 한 행으로 정리한 소규모 목록 파일(csv 약 5.6KB)로, 시설명·주소·좌석수·면적·사용용도·주요 보유 장비·연락처·소유기관을 담는다. 공연·행사를 열려는 단체나 시민이 '부천에서 몇 석 규모 공연장을 빌릴 수 있고 어떤 무대·조명·영사 장비를 갖췄는지'를 확인하는 데 쓴다. 전역 조인 키(공연시설 코드, 문화기반시설 코드 등)가 없어 다른 데이터와는 시설명이나 주소를 맞춰 이어 쓴다.
description_portal: '- 부천시는 시민들의 문화향유 기회 확대를 위해서 공연장을 갖춘 시설들을 운영하고 있으며, 부천시에서 개방하고 있는 공연장에 대한 데이터로 시설명, 주소, 좌석수, 사용용도, 주요보유장비 및 설비,  전화번호, 소유기관 등의 정보를 제공합니다.- 부천시민회관은 중동에 있는 공연장으로 대공연장, 소공연장을 갖추고 있어 연극, 음악공연 등 다양한 공연들을 제공합니다. - 부천아트센터는 콘서트홀과 소공연장을 갖춘 시설로 클래식 공연 맞춤 공연장을 제공합니다.- 공연장별로 좌석 수에 따라 대공연장 및 소공연장으로 나누어지며 각 시설별로 무대, 조명, 영사기, 스크린 등의 장비를 보유하고 있습니다.'
