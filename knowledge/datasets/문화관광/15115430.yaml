summary_user: 서울특별시 중랑구에서 청소년이용불가·전체이용가 게임물을 설치해 제공하는 일반게임제공업소(성인게임장·오락실 등)의 인허가 정보를 업소 한 곳당 한 행으로 담는 건별 원천 데이터다. 주민이나 분석가가 중랑구 안에서 지금 영업 중이거나 폐업한 게임장이 어디에 있는지, 언제 인허가·폐업했는지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(지번·도로명)나 사업장명, 같은 기관 코드로 맞춰 이어 쓰고, 좌표(X, Y)는 중부원점TM(EPSG:5174) 기준이라 지도에 올리려면 좌표 변환이 필요하다.
description_portal: '서울특별시 중랑구의 성인게임장, 오락실 등 청소년이용불가의 게임물과 전체이용가의 게임물을 설치하여 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
