description_portal: 한국토지주택공사가 개발 조성한 전국 여러 지역에서 출토되어 토지주택박물관이 현재 소장중인 주요 유물 데이터를 제공합니다. 당사의 토지주택박물관은 주거건축문화와 토목건축기술을 테마로 한 전문박물관입니다. 국문 유물명, 한문 유물명, 영문 유물명을 제공하고 있습니다. 상환증서, 토지매매문서, 측량기와 같은 근대 시대 유물부터 빗살무늬토기, 주먹도끼와 같이 구석기 및 신석기 유물 또한 소장 및 전시하고 있습니다. 2022년부터 주택도시역사관을 통해 역사 및 문화 공간을 무료로 개방하고 있습니다.
