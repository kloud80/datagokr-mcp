summary_user: 부산광역시 강서구에 등록된 민간 체육시설업을 업소 한 곳당 한 행으로 담은 명부 파일로, 업종(수영장·체육도장·골프연습장·체력단련장·당구장·가상체험 체육시설·체육교습업 등), 상호, 시설주소를 담는다. 강서구에서 헬스장이나 골프연습장 같은 업종이 어디에 얼마나 있는지 알아보려는 주민·창업자·정책 분석가가 쓴다. 인허가번호나 사업자번호 같은 공통 조인 키가 없어서, 상권·인허가 데이터 등과는 시설주소나 상호를 문자열로 맞춰 이어 써야 한다.
description_portal: 부산광역시 강서구 체육시설업 등록 현황에 대한 정보입니다.다양한 민간 실내 체육시설이 운영되고 있으며, 주민들의 건강 증진과 여가 생활을 위한 다양한 업종의 체육시설이 등록되어 있습니다.강서구 체육시설업 현황 데이터를 활용해 체육 관련 정책 수립과 효과 평가를 데이터 기반으로 수행할 수 있습니다. - 강서구 체육시설 업종을 제공합니다. (수영장업, 체육도장업, 골프연습장, 체력단련장, 당구장업, 가상체험 체육시설업, 체육교습업 등) - 강서구 체육시설 상호명을 제공합니다. - 강서구 체육시설 시설주소 등을 제공합니다. *강서구 미보유 데이터는 미기재될 수 있으니 양해부탁드립니다.
