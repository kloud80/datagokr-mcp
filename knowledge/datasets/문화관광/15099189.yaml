description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시 관내에 설치된 공공미술 작품들의 현황을 체계적이고 포괄적으로 정리한 정보입니다. 상징조형물, 조형시설물, 환경시설물 등 다양한 형태의 공공예술작품과 미술관, 전시관, 아트홀 등 문화예술시설의 정확한 위치와 고유한 특성을 상세히 파악할 수 있도록 구성되었습니다. 이 자료는 시민들의 문화예술 향유 기회를 확대하고, 지역 관광자원을 개발하며, 도시 미관을 개선하기 위한 정책 수립의 중요한 기초자료로 활용됩니다.2. 데이터 항목명시군구, 작품명, 위치, 건립일자, 형상, 관리기관3. 기대 효과공공미술 자원의 체계적이고 전략적인 관리를 통해 독창적인 문화관광 콘텐츠 개발과 시민의 문화복지 수준을 획기적으로 향상시킬 수 있습니다. 또한 예술작품의 효율적인 유지관리와 혁신적인 공공미술 설치를 위한 정확하고 신속한 정책 의사결정을 지원할 수 있습니다.
