description_portal: 코시스센터는 해외문화홍보 업무를 총괄하는 문화체육관광부가 운영하는 정부기관으로, 외신기자들의 보다 정확하고 깊이 있는 보도활동을 할 수 있도록 정부 소식을 제공하고 취재를 지원하는 기관입니다.센터에서는 정부기관의 정책토론회, 브리핑을 개최하고 주요인사와의 인터뷰 주선, 프레스투어 등 다양한 언론행사를 주최하고 이와 관련한 서비스와 시설 이용을 제공합니다.정책토론회한국 정부 각 부처의 고위급 관계자(장‧차관급)가 발표자로 참여하여 주요 정책을 설명하고 질의응답을 통해. 다양한 의견을 나누는 행사이며, 월 1회 개최합니다.브리핑과 인터뷰주요 현안에 대해 신속하고 정확한 정보를 제공하기 위해 정부부처 대변인 또는 정부 관계자가 브리핑을 주재하며, 정부관계자와 전문가, 특정인물 중심의 취재시, 인터뷰를 주선합니다.보도자료 배포정부 각 부처의 주요 정책과 행사, 메시지 등에 대한 참고를 위해 보도자료를 배포합니다.
