summary_user: 예술의전당이 회원을 대상으로 진행한 댓글이벤트·광고이벤트를 이벤트 한 건당 한 행으로 담은 파일로, 제목·구분·시작일·종료일·대상·조회수·댓글 참여수·발표일·등록일을 포함하며 포털 설명상 기간은 2020년 12월부터 2026년 5월까지다. 공연기관 마케팅 담당자나 분석가가 "어떤 유형의 회원 이벤트가 조회수와 댓글 참여를 많이 끌어냈는가"를 비교하는 데 쓴다. 실측 컬럼에 공연 ID나 시설 코드 같은 전역 조인 키가 없어, 다른 공연·시설 데이터와는 이벤트 제목의 공연명을 이름으로 맞추거나 같은 기관(예술의전당) 기준으로만 연결한다.
description_portal: '예술의전당 이벤트 정보에 대한 데이터 입니다.- 데이터 기간: 2020.12 ~ 2026.5- 제공 데이터 : 제목, 구분, 이벤트시작일, 이벤트종료일, 이벤트대상, 조회수, 댓글참여수, 발표일, 등록일- 데이터 설명: 예술의전당 회원 대상 이벤트는 주로 댓글이벤트, 광고이벤트 형태로 진행되고 있습니다. 댓글이벤트 같은 경우 댓글을 단 회원 대상으로 선착순 또는 추첨을 통해 당첨자를 선별하며 당첨자에게는 다양한 혜택을 제공합니다.   이벤트 참여 및 현재 진행중인 이벤트 확인을 위해서는 예술의전당 홈페이지의 이벤트 페이지(https://www.sac.or.kr/site/main/board/event)를 참고하시기 바랍니다.   예술의전당 이벤트 정보데이터는 예술의전당이 회원 대상으로 진행했던 모든 이벤트들의 상세 데이터를 확인하실 수 있습니다.'
