summary_user: 제주특별자치도가 제공하는 무장애 여행 안내 자료 중 하모해수욕장 한 곳에 대한 정보로, 개요·주소·주차장·화장실·여행코스·휴무일·관람료 같은 안내 항목과 시설 사진을 담는다. 휠체어 이용자나 거동이 불편한 여행자가 '하모해수욕장에 장애인 주차장과 이용 가능한 화장실이 있는가'를 확인하거나, 무장애 여행 코스 추천 콘텐츠를 만드는 데 쓴다. 실측 컬럼(구분·유형·추천여부·비고)에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지 이름을 맞추거나 같은 기관(제주특별자치도)의 다른 무장애 관광정보 파일과 묶는 방식으로만 이어 쓴다.
description_portal: '"제주특별자치도 내 하모해수욕장_무장애여행관광정보 데이터를 제공합니다.항목: 개요, 주소, 주차장, 화장실, 여행코스, 휴무일, 관람료 등 * 제주특별자치도가 제공하는 무장애 여행 관광 안내 자료 중 하나로, 하모해수욕장에 대한 정보를 담고 있습니다. 이동이 어려운 여행자나 장애인도 편하게 여행할 수 있도록, 관광지의 개요, 접근 위치(주소), 주차장 및 화장실 시설 현황, 여행 코스, 휴무일, 관람료 등 필수 안내 항목을 포함하고 있으며, 특히 화장실이나 주차장 등의 시설 사진을 포함하여 실제 시설의 상태를 시각적으로 파악할 수 있게 되어 있습니다.* 활용 분야 : 관광 안내 콘텐츠 제작, 접근성 평가 및 시설 개선, 무장애 여행 코스 추천 서비스 등"'
