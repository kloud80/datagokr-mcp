description_portal: 한국문학번역원이 운영하는 KLWAVE 플랫폼에서 제공하는 베스트셀러 큐레이션 목록 데이터로, 국내외 독자들에게 주목받고 있는 한국 도서 및 출판 콘텐츠의 다양한 정보를 체계적으로 제공하는 데이터입니다. 도서의 제목, 저자, 출판사 등 베스트셀러와 관련된 주요 정보를 포함하며, 한국 문학과 출판 콘텐츠에 대한 국내외 이용자의 관심과 접근성을 높이는 데 활용됩니다. 또한 해외 출판사, 번역가, 연구자 및 일반 독자들이 한국 문학 시장의 동향과 인기 작품을 파악할 수 있도록 지원하며, 한국 문학 작품의 번역·출간·유통 활성화와 국제적 확산을 촉진하기 위한 기초자료로 활용되는 데이터입니다. 이를 통해 한국 문학 및 출판 산업의 글로벌 경쟁력 강화와 문화 콘텐츠 교류 확대에 기여합니다.
