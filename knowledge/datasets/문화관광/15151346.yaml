description_portal: 본 데이터는 경상북도 경주시 상상황리단길 내 상점의 기본 정보를 수록한 파일 형식의 공공데이터이다. 데이터에는 매장명ID, 매장명, 업종명, 주소, 주메뉴1~3, 상점소개, 인스타그램, 블로그, 페이스북, 스마트스토어, 홈페이지, 위도, 경도 등의 항목이 포함되어 있다. 해당 자료는 경주시의 대표적인 관광 상권인 상상황리단길에 위치한 상점들의 현황을 체계적으로 파악하기 위한 기초자료로 활용된다. 이를 통해 지역 소상공인 지원, 상권 분석, 관광 활성화 정책 수립, 소비자 이용행태 연구 등 다양한 행정 및 민간 분야에서 유용하게 쓰인다. 경주시는 본 데이터를 정기적으로 갱신하며, 정확하고 신뢰성 있는 상권 정보를 제공하기 위해 지속적으로 관리하고 있다.
