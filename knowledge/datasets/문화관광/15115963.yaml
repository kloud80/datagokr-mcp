summary_user: 서울 강서구의 영화배급업 인허가 업소를 한 건씩 담은 원천 목록으로, 사업장명, 인허가일자와 취소일자, 영업상태와 폐업일자, 지번·도로명 주소, 좌표(X·Y), 문화체육업종명 등을 담는다. 영화·콘텐츠 사업자나 분석가가 강서구에서 현재 영업 중인 영화배급사가 어디에 몇 곳 있고 언제 등록·폐업했는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없으므로, 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 강서구의 영화를 전문적으로 배급하는 업소정보로 인허가일자, 영업상태, 사업장명, 주소, 좌표정보, 문화체육업종명 등 정보를 제공합니다.영화배급업은 제작된 영화 또는 콘텐츠를 상영관, 방송사, 온라인플랫폼 등에 배급하여 대중에게 유통하는 업무를 수행하는 사업체입니다. 강서구의 영화배급업 인허가 정보는 배급사명, 대표자, 등록일, 배급 장르, 주요 상영처 등의 항목을 포함합니다. 이 데이터는 콘텐츠 유통망 구조 파악, 영화 산업 정책 수립, 지역 상영 인프라와의 연결성 분석 등에 활용되며, 문화도시 조성을 위한 콘텐츠 순환 체계를 구축하는 데도 유익합니다.
