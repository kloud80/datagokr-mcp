summary_user: 올림픽공원(서울 송파구 소재)에서 촬영한 식물·경관 사진 정보를 사진 한 건 단위로 담은 목록으로, 제목·설명·주제 키워드·촬영 장소·저작권·홈페이지 URL 등을 포함하며 포털 설명 기준 2025년 6월 현재 264건이다. 공원 방문객이나 콘텐츠 제작자가 '몽촌뜰이나 장미광장의 계절별 개화 모습 사진이 있는가'를 찾거나, 사진 출처·이용 조건을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 다른 데이터와는 사진 제목·장소명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓸 수 있다.
description_portal: 올림픽공원을 대상으로 촬영한 사진정보를 제공하고있습니다. 올림픽공원 내 식물사진, 식물명, 홈페이지URL 등 정보제공하고 있습니다2025년 6월 현재 264건의 데이터를 제공하고 있으며,올림픽공원 홈페이지에 들어가시면 https://www.ksponco.or.kr/olympicpark/gallery.es?mid=a20404000000&bid=0024자세한 정보 확인가능합니다.가을몽촌뜰, 조각의 숲 자작나무 군락지, 장미광장 봄 개화, 봄 몽촌뜰, 뜰꽃마루 등 다양한 사진을 확인하실 수 있습니다.
