summary_user: 대구광역시 북구에 등록된 게임제공업소(인터넷컴퓨터게임시설제공업·일반·청소년·복합유통게임제공업)를 업소 한 곳당 한 행으로, 업종명·상호·도로명 소재지 주소·데이터기준일을 담은 시군구 단위 파일(CSV 약 14KB)이다. 주민이나 창업 예정자가 "북구 안 어느 동네에 PC방이나 청소년게임장이 몰려 있나"를 확인하거나, 분석가가 업종별 업소 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 도로명 주소나 상호를 매칭하거나 같은 기관(북구) 자료끼리만 이어 쓴다.
limits: 업소를 식별하는 코드나 좌표가 없어 다른 지자체·인허가 데이터와 키로 바로 결합할 수 없고, 주소 문자열로 매칭해야 한다. 범위는 대구 북구 한 곳에 한정되므로 다른 구·시도와 비교하려면 해당 기관 파일을 따로 받아야 한다.
