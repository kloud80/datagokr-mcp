description_portal: 게임제공업 현황 정보는 대구광역시 북구에 등록된 게임제공업소(인터넷컴퓨터게임시설제공업, 일반게임제공업, 청소년게임제공업, 복합유통게임제공업)에 대한 기본정보와 업종별 상세 현황으로 구성된 데이터입니다.해당 데이터는 각 업소별로 상호명, 영업장 소재지 주소 등의 항목으로 구성되어 있으며, 시도 및 행정구역별 분류가 가능하도록 설계되어 있습니다.업종 구분은 「게임산업진흥에 관한 법률」에 따른 분류 기준에 따라 적용됩니다.주소 정보는 사업체 소재지까지만 표기됩니다.파일 내 항목별 상세 설명 및 코드 해석은 “게임제공업 현황 데이터 사용자 매뉴얼”을 참고해 주시기 바랍니다.데이터 건수가 많아 엑셀 또는 메모장 등 일반 텍스트 편집기에서는 일부만 표출될 수 있으므로, 분석 전용 소프트웨어(R, Python, Excel Power Query 등)의 활용을 권장합니다.
