summary_user: 서울도서관이 운영하는 교육·문화 강좌를 강좌 한 건 단위로 담으며, 강좌 제목·대상·운영 기간과 시간·장소·수강료·정원·모집 기간과 모집 상태·신청 인원·포스터 이미지와 강좌 내용을 포함한다. 시민이 '지금 접수 중인 어린이 대상 무료 강좌가 있는지, 언제까지 신청하는지' 확인하거나, 분석가가 대상별·기간별 강좌 운영 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 강좌명·장소 이름 매칭이나 같은 기관 기준으로만 이을 수 있고, 도서관 분야의 공통 키인 도서관코드·ISBN과는 직접 연결되지 않는다.
description_portal: 서울도서관 강좌정보는 서울도서관에서 운영하는 다양한 교육·문화 강좌의 모집 및 운영 현황을 제공하는 데이터입니다. 강좌 ID와 제목을 통해 개별 강좌를 식별할 수 있으며, 대상 정보는 유아, 어린이, 청소년, 성인 등 참여 가능 대상을 구분하는 데 활용됩니다. 시작일과 종료일, 요일·시간, 장소 정보는 강좌의 운영 기간과 진행 시간, 위치를 파악할 수 있게 하여 이용자의 참여 계획 수립에 도움을 줍니다. 요금과 인원, 모집방법, 모집상태, 신청인원은 수강료, 정원, 접수 방식, 현재 모집 진행 상황을 확인하여 신청 가능 여부를 판단하는 데 유용합니다. 모집시작일과 모집종료일은 접수 기간을 명확히 알려주며, 전화번호 정보는 문의 및 안내 창구 역할을 합니다. 또한 포스터 이미지 링크와 강좌 내용은 강좌의 성격과 주요 내용을 시각적·텍스트로 제공하여 홍보와 정보 전달에 효과적으로 활용될 수 있습니다.
