summary_user: 서울특별시 은평구 안의 인터넷컴퓨터게임시설제공업(PC방) 인허가를 업소 한 곳당 한 행으로 담는 원천 목록이다. 업소명, 지번·도로명 주소, 인허가·취소·폐업 일자, 영업상태, 시설면적·층수 같은 시설 정보, 중부원점TM 좌표가 들어 있다. 은평구에서 지금 영업 중인 PC방이 어디에 얼마나 있는지, 최근 새로 생기거나 문을 닫은 곳이 어디인지를 확인할 때 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 다른 데이터와는 주소·업소명을 맞춰 보거나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '은평구의 PC방과 같이 컴퓨터 등 게임물을 이용하는데 필요한 기자재를 갖추거나 그 밖의 정보제공물을 이용할 수 있도록 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.서울특별시 은평구 내 인터넷컴퓨터게임시설제공업의 인허가 정보를 정리한 데이터입니다. 해당 업종은 일명 ‘PC방’이라 불리며, 청소년과 성인을 불문하고 다양한 계층의 사람들이 여가·게임·정보검색 등을 위해 이용하는 대표적인 디지털 여가공간입니다. 이 데이터는 업소명, 소재지 주소, 인허가 일자, 영업상태 등 기본적인 행정 정보뿐만 아니라, 지역 내 디지털 문화 인프라 분포를 파악하는 데 활용될 수 있습니다. 최근 e스포츠 산업의 성장, 1인 미디어와 스트리밍 트렌드의 확산, 게임 중독 문제 등과 맞물려 인터넷컴퓨터게임시설에 대한 정책적 관심도 높아지고 있으며, 특히 청소년 보호, 게임 셧다운제, 24시간 운영규제 등 다양한 사회적 논의가 이뤄지고 있습니다. 또한, 지역별 디지털 불균형 해소, 청년창업 공간 대체 가능성, 범죄 예방을 위한 위치분석 등 여러 공공 행정 및 산업 연구 목적으로도 의미 있는 기초자료입니다. 본 데이터는 은평구의 도시계획, 생활환경 분석, 청소년 정책 등 다양한 정책 수립과 서비스 설계에 기여할 수 있는 공공자원으로 활용 가능합니다.'
