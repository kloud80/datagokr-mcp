summary_user: BIGKinds 뉴스데이터베이스에서 모은 수능 난이도 관련 기사를 기사 한 건 단위로 담은 CSV 파일(약 3.3MB)로, 기사마다 제목·본문·언론사·보도 일자·사건/사고 분류·키워드와 국어·수학·영어 과목별 난이도 평가(쉬움·보통·어려움)가 들어 있다. 교육학·언론 연구자나 입시 정책 담당자가 "특정 연도에 언론이 수능 국어·수학·영어 난이도를 어떻게 평가해 보도했는가"를 연도·언론사별로 비교하는 데 쓴다. 다른 데이터와 묶을 전역 조인 키는 없으므로, 언론사 이름이나 보도 일자를 기준으로 이름 매핑해 다른 뉴스·입시 자료와 이어 써야 한다.
