description_portal: 이 데이터는 한국언론진흥재단의 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 수능 난이도 보도 메타데이터 자료입니다. 각 기사에는 제목, 본문, 언론사, 보도 일자, 사건/사고 분류, 키워드, 그리고 국어·수학·영어 등 주요 과목의 난이도 평가(쉬움·보통·어려움) 정보가 포함되어 있습니다. 이를 통해 특정 연도와 시기별로 언론이 수능 난이도를 어떻게 해석하고 보도했는지, 과목별 난이도 평가가 어떻게 달리 나타났는지를 체계적으로 분석할 수 있습니다. 특히 보도 키워드와 분류 체계를 함께 제공하여, 수능 난이도 담론이 교육 정책, 사회적 논란, 입시 제도 변화와 어떤 연관성을 보였는지 파악할 수 있도록 돕습니다. 본 자료는 교육학 연구, 언론 보도 분석, 입시 정책 검토, 사회 인식 변화 탐구 등 다양한 분야에서 활용할 수 있는 기초 데이터로서 가치가 큽니다.
