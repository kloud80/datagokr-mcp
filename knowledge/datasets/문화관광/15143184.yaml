summary_user: 부산문화재단 홈페이지에 올라온 문화예술행사를 공연 한 건 단위로 담으며, 공연명·설명·시작/종료일자·공연시간·장소·주최·관람가격·할인내용·문의전화 등을 제공한다. 부산 시민이나 관광객이 '이번 주 부산에서 열리는 공연은 무엇이고 어디서 얼마에 볼 수 있나'를 확인하거나, 분석가가 부산문화재단 행사의 장소·유형별 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 공연장소명 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 부산광역시 부산문화재단 홈페이지 문화예술행사 데이터를 개방합니다.부산문화재단은 문화예술을 통해 부산시민의 삶을 풍요롭게 하고 부산을 창의와 품격을 갖춘 문화도시로 변화시킨다는 미션을 가지고 지난 2009년 1월 설립되었습니다.문예창작, 학예진흥의 지원을 통하여 지역문화예술을 활성화하고 지역문화의 정체성 확립을 목적으로 합니다.또, 문화창작기반을 조성하고 시민들의 문화향유 기회를 확대하여 부산을 창의와 품격을 갖춘 세계적인 문화도시로 만드는 목적을 가지고 있습니다.개방되는 데이터에는 공연명, 공연설명, 공연일자, 공연시간 등의 데이터를 제공합니다.
