summary_user: 국립무형유산원이 제공하는 무형유산 공연 정보를 공연(자료) 단위 목록으로 담으며, 자료명·등록일로 보이는 날짜·상세 페이지 이동 URL 정도의 필드를 돌려주는 전국 범위 API입니다. 관람객이나 문화기획자가 '국립무형유산원에서 어떤 무형유산 공연이 올라와 있고 상세 안내는 어디서 보나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 무형유산 데이터와는 자료명(공연명) 문자열 매칭이나 같은 기관 데이터끼리만 이어 쓴다.
limits: 필드가 자료명·날짜·URL 세 개뿐이라 포털 설명에 나온 전승자·장소·유산 유형·영상 자료 등은 이 응답만으로 확인되지 않으며 상세는 URL로 넘어가 봐야 한다. 조인 키가 없어 지정 무형유산 목록과 코드로 연결할 수 없고, 개발계정은 일 500회 호출 제한이 있다.
