description_portal: 입력 파라미터를 이용하여 무형문화재 공연 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형유산 공연 정보 목록 조회 서비스는 국가무형문화재, 지방무형문화재, 인류무형문화유산 등 다양한 무형유산 분야의 공연 정보를 체계적으로 수집·관리하고 온라인으로 제공하는 디지털 플랫폼입니다. 이 서비스는 공연명, 전승자 및 단체, 공연 일시·장소, 유산 유형, 공연 구성 내용, 영상·음원·해설 자료 링크 등의 메타데이터를 포함해 이용자가 주제별, 지역별, 시기별로 맞춤형 검색 및 필터링을 통해 원하는 공연 정보를 쉽게 확인할 수 있도록 설계되었습니다. 또한 실시간 공연 스케줄과 공연 후 기록 영상·음원 및 해설 자료가 함께 제공되어 연구자, 교육자, 문화기획자, 일반 관람객들이 학술 연구, 교육 콘텐츠, 디지털 전시, AR/VR 공연 콘텐츠 개발 등 다양한 분야에서 활용할 수 있는 중요한 디지털 문화자원입니다.
