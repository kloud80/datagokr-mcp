summary_user: 한국 저작권산업을 핵심·상호의존·부분·지원 저작권산업 등 대분류별로 나눠 2013년부터 2021년까지 연도별 명목부가가치를 담은 집계 통계로, 연도가 열로 펼쳐진 1KB 남짓의 작은 전국 단위 CSV 파일이다. 정책 연구자나 콘텐츠 산업 분석가가 '저작권산업 부가가치가 연도별로 어떻게 변했고 2020~2021년에 어떤 분류가 크게 움직였나'를 확인할 때 쓴다. 공통 조인 키가 없어서 다른 데이터와는 산업 분류 이름이나 연도를 맞춰 붙여야 하며, 같은 기관의 저작권산업 규모 통계와 함께 보는 것이 현실적이다.
description_portal: 본 데이터는 한국의 저작권 산업별 규모와 부가가치 창출 현황을 연도별(2013년~2021년)로 집계한 통계 자료입니다. 저작권 산업을 핵심 저작권산업, 상호의존 저작권산업, 부분 저작권산업, 저작권 지원산업의 4가지 주요 분류로 나누어 각 분야가 창출한 명목부가가치 정보를 상세히 제공합니다.핵심 저작권산업은 문학, 음악, 연극, 소프트웨어 등 저작물 생성에 직접 기여하는 분야를 포함하며, 상호의존 저작권산업은 TV, 컴퓨터 등 저작물 이용에 필요한 기기 제조와 관련된 수치를 담고 있습니다. 또한, 부분 저작권산업 및 저작권 지원산업을 통해 유통 및 보조 서비스의 경제적 가치까지 포괄적으로 파악할 수 있습니다.이 데이터는 국내 저작권 산업의 성장 추이를 분석하고, 콘텐츠 산업 정책 수립 및 경제적 파급효과 연구를 위한 기초 자료로 활용 가치가 매우 높습니다. 특히 2020년과 2021년의 급격한 수치 변화 등 연도별 변동 추이를 통해 디지털 전환과 미디어 환경 변화가 저작권 시장에 미친 영향을 분석하는 데 유용합니다.
