summary_user: 제주시 조천읍 함덕서우봉해변 한 곳의 무장애 여행 정보를 지점별로 담는다. 위도·경도·해발고도와 장소설명·이미지가 들어 있다. 휠체어 이용자나 교통약자가 이 해변의 화장실 같은 편의시설과 접근 지점이 어디에 있는지 확인할 때 쓰고, 관광 접근성 개선이나 열린관광지 검토의 기초자료로도 쓴다. 전역 조인 키가 없어 TourAPI 관광지(contentId) 등 다른 데이터와는 장소명이나 위경도 좌표를 맞춰서 이어 써야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 함덕서우봉해변-화장실 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다.* 본 데이터셋은 제주특별자치도 제주시 조천읍에 위치한 함덕서우봉해변을 대상으로, 휠체어 이용자 및 교통약자를 위한 무장애 여행 정보를 제공한다. 해당 해변은 백사장, 해안 산책로, 주차장, 화장실 등 편의시설과 이동 동선이 정리되어 있으며, 장애인 전용 주차구역과 장애인 화장실이 설치되어 있어 접근성을 확보하고 있다. 또한 해변 접근로와 일부 산책로는 완만한 경사 또는 평지로 구성되어 있어 보행약자도 이용이 비교적 원활하다. 이 데이터는 무장애 관광지 등록, 열린관광지 조성, 관광 편의성 개선, 관광 정책 수립 및 서비스 제공의 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
