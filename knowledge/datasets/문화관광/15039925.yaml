summary_user: 인천광역시 서구 관내 국가 지정 사적을 한 건씩 담은 목록 파일로, 사적별 명칭·지정번호·지정일자·소재지·면적(제곱미터)과 기준 연도를 담는다(전체 618바이트 규모의 작은 CSV). 도시 개발 부지 인근에 보존해야 할 사적이 있는지, 서구 지역 교육·관광에 쓸 사적이 어디에 있는지 확인하려는 주민·사업자·담당자가 쓴다. 전역 조인 키는 없어 국가유산청 유산 목록과는 지정번호와 명칭으로 맞춰 이어 쓰고, 소재지 주소로 지도·토지 정보와 연결한다.
description_portal: 본 공공데이터는 인천광역시 서구 관내 국가 지정 사적의 현황을 담고 있습니다. 본 공공데이터는 인천광역시 서구 내 사적의 명칭, 소재지, 지정일자, 지정번호 등의 항목이 포함되어 있습니다. 사적은 역사상 중요한 사건이나 유적을 보존하고 기념하기 위한 문화재로, 본 데이터를 통해 문화유산 보호정책 수립, 도시 개발 시 문화재 보존 계획 수립, 지역문화 교육 및 관광 자원으로서 활용할 수 있을것으로도 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
