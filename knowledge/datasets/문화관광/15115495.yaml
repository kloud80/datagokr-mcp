summary_user: 서울특별시 중랑구에서 영리 목적으로 영화를 상영하는 업소(영화관 등)의 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·주소·전화번호·좌표 등을 포함한다. 중랑구에 현재 영업 중인 영화관이 어디이고 언제 인허가를 받았는지, 최근 폐업한 곳이 있는지 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 자치구의 같은 형식 인허가 데이터와는 관리번호(MGTNO)·개방자치단체코드 같은 같은 기관 코드로, 그 밖의 데이터와는 사업장명·주소 매칭으로 연결한다.
description_portal: '서울특별시 중랑구의 영화관 등 영리를 목적으로 영화를 상영하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
