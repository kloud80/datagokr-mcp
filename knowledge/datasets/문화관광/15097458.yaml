summary_user: 제주 공천포구와 넙빌레 일대의 무장애여행 정보를 시설·항목별 목록으로 담으며, 구분·유형·추천여부·비고 정도의 컬럼으로 이루어진 현장 점검 기반 자료다. 휠체어 이용자나 유모차를 동반한 가족이 '공천포구·넙빌레에 경사로, 접근 가능한 화장실, 장애인 주차구역이 있고 이용을 추천할 만한가'를 확인하거나, 지자체가 관광지 접근성 개선 대상을 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI contentId나 지역코드로 바로 잇지 못하고, 시설명이나 같은 기관 자료를 기준으로 수작업 매핑해야 한다.
description_portal: 제주특별자치도 공천포구와 넙빌레 일대의 무장애여행관광정보는 교통약자와 가족 단위 이용객이 편리하게 여행할 수 있도록 이동 동선, 접근성 시설, 편의서비스 현황 등을 체계적으로 제공하는 데이터다. 주요 관광지의 경사로, 보행 동선, 주차구역, 화장실 접근성처럼 이용자의 안전과 이동 편의를 좌우하는 요소를 중심으로 구성되며, 현장 점검 기반의 실제 이용 가능 정보를 포함해 정책 수립과 관광환경 개선에 활용할 수 있다. 관광약자의 여행 선택권 확대와 지역 관광 품질 향상을 위한 기반자료로 활용도가 높다.
