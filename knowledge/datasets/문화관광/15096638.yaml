summary_user: 강원특별자치도 안에서 반려동물과 함께 갈 수 있는 숙박·식음료·관광지·동물병원 등 업소를 한 행씩 담은 목록 파일로, 장소명·지역·주소·업체 구분·위도/경도·전화번호를 담는다(포털 설명상 2025.9.17. 기준 작성). 반려인 여행객이나 여행 서비스 사업자가 '강원도 어느 시군에 반려견 동반 숙소나 식당이 있나'를 찾거나 지도에 표시할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지(contentId) 등과는 장소명·주소 매칭이나 위경도 좌표 근접으로만 이어 쓴다.
