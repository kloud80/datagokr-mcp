summary_user: 대구 서구 국민체육센터가 주민 대상으로 운영하는 취미 스포츠교실(헬스·에어로빅·요가·댄스 등 8개 종목)의 강좌별 종목, 시간 구분(주중·주말·주간·야간), 시작·종료 시간, 운영 요일, 정원, 대상, 비용, 접수 일자를 강좌 단위로 담는다. 서구 주민이 '저녁에 다닐 수 있는 요가 강좌가 있고 수강료와 접수일이 언제인가'를 확인하거나, 분석가가 구 단위 생활체육 프로그램 공급 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 지자체 생활체육 강좌 데이터와는 종목명 같은 이름 매핑이나 같은 기관 단위로만 이어 쓴다.
limits: 한 개 구(대구 서구)의 국민체육센터 한 곳만 다루므로 다른 시설이나 지역과의 비교는 별도 데이터가 필요하다. 수강 신청은 방문 접수 방식이며, 데이터는 생성 후 갱신되지 않는 이벤트성 주기로 분류돼 현재 개설 강좌와 다를 수 있다.
