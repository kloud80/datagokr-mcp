summary_user: 인천 중구(현 영종구) 원도심·영종지역에서 영업 중인 관광숙박업소(관광호텔·호스텔)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·소재지·전화번호·데이터기준일을 포함하며 범위는 시군구 단위 개별 주소다. 관광객이 영종·중구 일대에서 묵을 관광호텔이나 호스텔을 고를 때, 또는 분석가가 지역 관광숙박업소 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 숙박업·관광사업 등록 데이터와는 업소명이나 소재지 주소를 맞춰 이어 써야 한다.
