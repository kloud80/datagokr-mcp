description_portal: 문화예술 활동을 진흥시키고 국민의 문화 향유 기회를 확대하기 위하여 <문화예술진흥법 시행령> 제12조에 근거 <문화예술진흥법> 제9조제1항에 따라 건축주가 건축 비용의 일정 비율에 해당하는 금액을 사용하여 회화, 조각, 공예 등 설치해야하는 건축물 미술작품에 대하여 진주시 관내 설치된 건축물 미술작품 현황임. 건축물 미술작품으로는 회화, 조각, 공예, 사진, 서예, 벽화, 미디어아트 등 조형예술물과 분수대 등 건축물미술작품으로 인정할 만한 공공조형물이 있다. 건축물 미술작품을 통하여 국민생활의 질적 향상 및 건전한 생활 문화를 영유할 수 있다.
