description_portal: 대구광역시 북구 관내 어린이 놀이시설 현황에 대한 놀이시설명과  소재지 주소, 설치일자, 설치장소,  시설면적 등 정보를 제공합니다.어린이놀이시설 안전관리시스템으로 체계적으로 어린이놀이시설을 현행화하고 어린이 안전사고 방지와 더불어 보험가입, 안전점검, 관리자 교육 등으로 시설을 관리합니다.어린이놀이시설 안전관리법이 꾸준히 개정되고 있지만 어린이가 놀이기구 사용으로 인한 모든 부상과 위험을 방지할 수 있는 것이 아니라 중대한 사고를 막기 위한 최소한의 안전기준을 제시한 것이다. 따라서 안전한 놀이를 위해서는 어린이의 보호관찰을 강화된다면 어린이놀이시설에서 어린이들이 안심하고 놀이시설을 이용할 수 있을 것 입니다.
