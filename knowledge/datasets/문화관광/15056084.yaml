description_portal: 본 자료는 광주광역시 문화산업 투자진흥지구에 입주한 기업들이 받을 수 있는 다양한 인센티브 현황을 체계적으로 정리한 데이터입니다. 주요 항목은 국세와 지방세 감면 등 세제 혜택, 국·공유재산의 임대 및 사용수익 허용 조건, 법률적 근거와 적용 기간 등이 포함되어 있습니다. 예를 들어, 법인세·소득세는 최초 3년간 전액 감면, 이후 2년간 50% 감면을 받을 수 있으며, 취득세와 재산세 역시 일정 기간 면제·감면 규정이 마련되어 있습니다. 또한 국·공유재산의 임대 기간과 갱신 조건, 관련 법률 조항이 구체적으로 제시되어 기업이 실제로 정책을 활용할 때 참고할 수 있도록 구성되어 있습니다. 해당 데이터는 문화산업 분야 기업의 지역 정착을 지원하고 투자 활성화를 유도하는 행정 근거 자료로 활용될 수 있으며, 기준일자는 2025년 9월 11일로 최신성을 반영하고 있습니다.
