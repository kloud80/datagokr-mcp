summary_user: 대한체육회 스포츠지원포털에 등록된 국내 스포츠 지도자를 한 사람·한 해 등록 단위로 담은 파일로, 등록년도·성별·지도자 구분(감독·코치 등)·종목과 세부종목·종별·소속명과 소속구분·시도를 전국 범위로 담는다. 체육 분석가나 경기단체 담당자가 "어느 시도·종목에 감독과 코치가 몇 명 등록돼 있고 성별 구성은 어떤가" 같은 질문에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시도명·종목명·소속명 같은 이름을 맞춰 붙이거나 같은 대한체육회 데이터(선수 등록·대회 결과 등)와 이름 매핑으로만 이어 쓴다.
description_portal: 대한체육회가 제공 및 운영하는 경기인 등록 시스템의 데이터입니다.스포츠지원포털을 통해 등록된 국내 스포츠 지도자들에 대한 정보를 제공합니다.이 데이터는 지도자의 등록 시점인 등록년도, 성별과 지도자의 구분(감독, 코치 등), 존재하는 경우 세부종목을 제공합니다.또한,  각 지도자의 소속명과 소속구분, 시도, 종목, 종별을 포함합니다. 지도자는 매년 등록하며 각 회원종목단체의 승인을 통해 등록이 완료됩니다.좀 더 세부적인 지도자 정보가 필요한 경우에는 소속된 회원종목단체로 문의하셔야 합니다.
