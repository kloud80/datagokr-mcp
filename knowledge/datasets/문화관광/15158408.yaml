description_portal: 경기도 구리시내에서 활동하는 문화관광해설사 인원들 대한 일반 정보(성별, 연령대, 양성년도, 거주지 등)을 제공합니다.문화관광해설사는 관광객들에게 방문하는 장소의 역사, 문화, 자연 환경 등 다양한 정보를 전문가의 시선으로 깊이 있게 이해하고, 이를 쉽고 친근하게 풀어서 전달하는 역할을 합니다. 단순히 지식을 전달하는 것을 넘어, 관광객이 현장에서 직접 체험하고 공감할 수 있도록 이야기하듯 안내하는 ‘문화 스토리텔러’라고 할 수 있습니다. 이들은 경기도에서 주관하는 신규 양성 과정을 통해 선발되며, 이론 교육과 현장 실습을 거쳐 전문성을 갖춥니다. 문화관광해설사는 관광객의 공감을 이끌어내는 고품격 해설 서비스를 제공하고 있습니다. 문화관광해설사시스템은 관광객이 문화·관광지 해설을 예약하고, 지자체·해설사가 예약·배정·근무를 관리하는 통합 플랫폼을 운영하고 있습니다.
