summary_user: 화산체육공원 골프시설 프로그램의 정기회원 이용 조건을 프로그램별 한 줄로 정리한 소규모 파일(csv 738바이트)로, 회원 구분·사용 기간과 요일·1일 이용 시간·대상·수강료(원)·비고를 담는다. 수원 시민이나 이용 희망자가 화산체육공원 골프 정기회원 기간별 수강료와 이용 시간 조건을 비교하거나, 분석가가 공공 체육시설 골프 프로그램 요금 수준을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·프로그램명 같은 이름 매핑이나 같은 기관(수원도시공사)의 다른 체육시설 데이터와 묶어서만 이어 쓴다.
description_portal: '이 데이터는 화산체육공원에서 운영하는 골프시설 프로그램의 정기회원 이용 현황을 2025년 12월 31일 기준으로 정리한 체육시설 운영 통계 자료이다. 주요 항목으로는 프로그램 이용 내역, 회원 구분(정기회원 등), 사용 기간(1개월, 3개월, 6개월, 12개월 등), 사용 요일, 1일 수업 시간(예: 80분), 대상자 유형(일반), 수강료(예: 130,000원~2,200,000원), 세부 이용 조건(예: 평일 12시 이전 90분 제공, 주말은 70분 제한), 부부회원과 같은 특수 회원 유형, 그리고 비고란에 기재된 추가 안내 사항 등이 포함되어 있다. 이 자료는 골프시설 프로그램의 운영 실태를 파악하고, 향후 프로그램 개선이나 요금 조정 등을 위한 기초 자료로 활용될 수 있다.'
