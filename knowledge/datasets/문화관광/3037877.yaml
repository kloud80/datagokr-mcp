summary_user: 올림픽공원에서 열린 뮤지컬·콘서트·페스티벌·어린이 공연 등 공연·행사 정보를 행사 한 건 단위로 담으며, 행사명·기간·장소·설명·홈페이지 등을 제공하고 포털 설명 기준 2025년 6월 2,592건이다. 공연 관람객이나 분석가가 '올림픽공원에서 언제 어떤 공연이 열렸거나 열리는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 KOPIS 공연ID(mt20id)·공연장ID(mt10id)도 들어 있지 않아, 다른 공연 데이터와는 행사명·장소·기간 같은 이름 매칭으로만 잇는다.
description_portal: 올림픽공원에서 열리는 다양한 공연과 행사 정보제공 행사명, 행사기간, 행사장소, 홈페이지URL 등 정보제공을 하고 있습니다.2025년 6월기준 2,592건 정보를 제공하고 있으며,올림픽공원 홈페이지> 문화공간 으로 들어오시 자세한 공연정보 확인이 가능합니다.https://www.ksponco.or.kr/olympicpark/eventInfo/eventInfoList?mid=a20301010100뮤지컬, 콘서트, 페스티벌, 갈라콘서트, 재즈페스티벌, 어린이 공연 등 정보확인이 가능합니다.
