summary_user: 서울시설공단이 운영하는 고척체육센터의 사업장 기본 정보(사업장 코드, 이름, 사업자등록번호, 대표자, 업태·종목, 주소, 전화·팩스번호, 문자 발신 아이디 등)를 담은 505바이트 크기의 소형 CSV 파일이다. 고척체육센터의 공식 연락처나 소재지, 사업자 정보를 확인하려는 이용자나, 공공 체육시설 목록을 정리하는 분석가가 시설 기본 정보를 채울 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장 이름·주소로 매칭하거나 같은 서울시설공단의 다른 체육센터 사업장 데이터와 사업장 코드로 맞춰 이어 쓴다.
description_portal: 고척체육센터의 사업장 정보 데이터는 고척체육센터의 기본 식별 및 연락 정보를 포함하고 있으며, 사업장 코드, 아이디, 이름, 사업자등록번호, 대표자명, 업태, 종목, 우편번호, 주소, 전화번호, 팩스번호, 문자 아이디 등의 항목으로 구성되어 있습니다.사업장 코드는 고척체육센터를 고유하게 식별하기 위한 코드이며, 아이디는 내부 시스템에서 사용되는 로그인 또는 식별용 계정 정보입니다.이름은 사업장 명칭으로 고척체육센터를 나타내며, 번호는 사업자등록번호를 의미합니다.대표자는 사업장 대표자의 성명을 나타내며, 업태와 종목은 각각 사업장의 업종 분류와 세부 종목 정보를 제공합니다.또한 우편번호와 주소는 사업장 소재지를 나타내는 기본 정보이며, 전화번호와 팩스번호는 사업장 대표 연락처와 팩스번호를 나타냅니다.마지막으로 문자 아이디는 문자 발송 시 발신자명으로 사용되는 사업장 문자 서비스용 아이디를 의미합니다.
