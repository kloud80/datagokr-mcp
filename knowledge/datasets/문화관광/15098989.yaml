description_portal: 본 데이터는 전라남도 화순군 관내에 설치·운영 중인 공공미술 작품의 현황 정보를 종합적으로 제공한다. 조형물, 벽화, 조각상, 미술설치 등 다양한 유형의 예술작품을 대상으로 작품명, 작품수량, 작품유형, 공공미술 프로젝트 명칭 등을 포함하고 있다. 해당 자료는 문화공간 조성 및 도시경관 개선, 주민의 문화향유 기회 확대, 지역문화 정책 마련 등에 활용도가 높다. 데이터는 정기적으로 현장 점검과 실태조사를 통해 최신성을 유지하며, 공공예술의 분포와 특성, 예산 및 사업 경과 등의 정보를 체계적으로 정리하였다. 특히, 공공미술이 지역사회에 미치는 긍정적 효과 분석, 도시재생 사업과 연계된 미술 프로젝트 성과 평가, 예술인 지원 정책 마련과 같은 다양한 행정적 영역에서 참고자료로 활용될 수 있다.
