summary_user: 인천시설공단이 운영하는 인천대공원·삼산월드체육관 등 공공체육시설의 대관 신청을 건별로 담은 파일(CSV, 약 19.6MB)로, 담당부서·대관시설·신청일자·단체명·사용자수·사용 시작일과 종료일을 포함한다. 시설 운영자나 분석가가 '어느 시설에 어느 시기에 대관 신청이 몰리고, 어떤 단체가 몇 명 규모로 쓰는가'를 파악할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·단체명 같은 이름 매핑이나 같은 기관(인천시설공단) 자료끼리로만 연결한다.
description_portal: 인천시설공단이 운영하는 공공체육시설에서 이루어진 시설 대관 신청 정보를 정리한 자료로, 담당부서와 대관시설명, 신청일자, 이용 단체명, 사용자 수, 실제 사용 시작일과 종료일 등 예약 처리 과정에서 필요한 핵심 정보를 포함하고 있습니다. 이를 통해 특정 시설의 예약 수요 분석, 단체 유형별 이용 현황 파악, 예약 시기별 혼잡도 예측 등이 가능하며, 향후 시설 운영 계획이나 이용자 편의 개선을 위한 기초 자료로 활용할 수 있습니다. 날짜 기반의 신청 패턴을 분석하거나 단체 규모별 수요를 예측하는 데에도 유용하여 공공시설 관리 효율성 향상에 기여할 수 있습니다.(인천대공원, 삼산월드체육관, 송도공원사업단, 청소년수련관 등)
