summary_user: 스포츠강좌이용권(구 스포츠바우처)으로 수강할 수 있도록 등록된 강좌를 강좌 한 건 단위로 담으며, 강좌명·종목·강사·진행 요일·시작/종료 시각·수강료·상세설명을 전국 범위로 제공한다. 이용권을 받은 가정이나 지원 담당자가 "평일 저녁에 수강료 얼마 이하로 들을 수 있는 수영 강좌가 어디 있나"처럼 요일·강사·금액 조건으로 강좌를 고를 때 쓴다. 사업자등록번호(brno)로 체육시설업 등록·사업자 정보와 잇고, 시설일련번호(facil_sn)로 같은 공단의 이용권 가맹시설 정보와 이어 쓴다.
description_portal: 스포츠강좌이용권 등록강좌는 서울올림픽기념국민체육진흥공단의 스포츠강좌이용권(구 스포츠바우처) 관련 시설정보입니다. 해당 시설에서 진행 중인 강좌명, 종목명, 강사명, 강좌에 대한 상세설명, 강좌 결제금액, 시작, 종료 시각, 용품판매여부, 강좌가 진행되는 요일 등의 데이터를 조회할 수 있는 서비스를 제공합니다. 스포츠 강좌명, 강사명, 강좌가 진행되는 요일 정보, 결제금액의 조회조건을 이용하여 원하는 정보를 조회할 수 있습니다. 이 서비스는 스포츠강좌 수강을 위한 강좌 정보를 요일, 강사, 비용 등 다양한 기준으로 제공하여 이용자의 맞춤형 강좌 선택과 참여 확대에 활용될 수 있습니다.
