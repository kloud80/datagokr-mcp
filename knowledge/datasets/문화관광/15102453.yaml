summary_user: 인천 서구 '서로이음길' 도보 코스별 현황을 코스 단위로 담은 작은 CSV 파일(약 1.2KB)로, 코스명·시작점·구간 경로·거리(km)·예상 소요시간(분)·데이터기준일자를 담는다. 주민이나 걷기 여행자가 '서구에서 몇 km, 몇 분짜리 걷기 코스가 어디서 시작하는가'를 확인하거나 지역 걷기길 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 코스명·시작점 주소 같은 이름 매칭으로만 이어 쓰며, TourAPI 코스 정보와 대조할 때도 이름 기준으로 맞춘다.
description_portal: 본 공공데이터는 인천광역시 서구에 있는 "서로이음길" 코스별 현황을 정리한 자료입니다. 본 자료는 도보 코스의 명칭, 시작점 주소, 경로, 거리(킬로미터), 예상 소요시간 등 세부 정보를 포함하고 있어 이음길 코스를 이용하는 주민들한테 유용한 정보가 될 것으로 판단됩니다. 관련 정보는 홈페이지(https://seo.incheon.kr/open_content/eumroad/)에서도 세부코스 등 자세한 사항을 확인 가능합니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
