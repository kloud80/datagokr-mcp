summary_user: 광주시립미술관이 보유한 소장품을 장르별(한국화·회화·드로잉·판화·조각·뉴미디어·공예·사진·서예·디자인·건축 등)로 나눠 순수소장품과 하정웅 기증품 수량을 집계한 표로, 파일 크기가 319바이트인 소규모 현황 자료입니다. 미술관 소장품의 장르 구성과 하정웅 컬렉션의 비중을 알고 싶은 연구자·기자·지역 문화정책 담당자가 '광주시립미술관은 어떤 장르의 작품을 얼마나 갖고 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 미술관 이름이나 같은 기관 기준으로만 맞춰 붙일 수 있으며, 문화기반시설총람 같은 시설 목록과 연결하려면 시설명을 수작업으로 대응시켜야 한다.
description_portal: 광주시립미술관의 소장품 현황은 크게 순수소장품과 하정웅 기증품으로 구분되어 있으며, 이를 통해 미술관이 보유하고 있는 예술 작품의 폭넓은 스펙트럼을 확인할 수 있습니다. 소장품 목록에는 전통과 현대를 아우르는 다양한 예술 장르가 포함되어 있으며, 구체적으로는 한국화, 회화, 드로잉, 판화, 조각, 뉴미디어, 공예, 사진, 서예, 디자인, 건축 등 여러 분야의 작품들이 체계적으로 분류되어 있습니다. 이러한 소장품들은 광주시립미술관의 전시 및 연구, 교육 활동에 활용되며, 지역 문화예술 발전에 기여하고 있습니다. 또한 기증품의 경우, 특히 하정웅 컬렉션은 광주 미술계에 의미 있는 문화유산으로 평가받고 있습니다.
