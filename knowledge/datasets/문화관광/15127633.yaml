summary_user: 여수시에서 사업계획 승인을 받은 관광숙박시설을 건별로 담은 파일로, 업종·업소명·도로명 주소·객실 수·지하/지상 층수·연면적·사업계획 승인일과 추진 현황을 시설 단위로 수록한다. 여수에 관광호텔 같은 숙박시설이 언제 얼마 규모로 승인됐고 지금 공사·영업 중인지 여부를 확인하려는 투자 검토자나 지역 관광정책 분석가가 쓴다. 전역 조인 키는 없어서, 다른 관광사업 등록·숙박업 데이터와는 업소명이나 도로명 주소·우편번호를 맞춰 이어 쓴다.
limits: 등록번호·사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 1:1로 연결하기 어렵고, 업소명·주소 매칭에 의존한다. 범위는 여수시 한 곳의 시설 단위 목록이라 다른 시군 비교에는 해당 지역 자료를 따로 모아야 한다.
