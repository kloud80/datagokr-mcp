summary_user: 경기도 시군의 종합체육시설업(수영·골프·체육단련 등을 한 곳에 모은 복합 체육시설) 인허가 사업장을 건별로 담는 데이터로, 사업장명·인허가일자·영업상태·폐업일자·주소·WGS84 위경도를 포함한다. 주민이 우리 시군에서 지금 영업 중인 종합체육시설이 어디 있는지 찾거나, 분석가가 시군별 체육시설 분포와 개·폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)나 시군명·주소·사업장명 매칭으로 다른 경기도 데이터나 행정안전부 인허가 데이터와 잇고, 위경도로 지도·공간 분석에 얹는다.
description_portal: 이 데이터는 경기도 31개 시군의 종합체육시설업체에 대한 인허가 현황을 담고 있습니다. 수영, 골프, 체육단련 등 여러 체육활동이 가능한 시설을 한 곳에 모은 복합 체육시설이 포함되며, 총 23개 항목으로 구성되어 있습니다. 사업장명, 인허가일자, 영업상태, 폐업일자, 위치정보(WGS84 위도·경도 및 좌표값), 소재지 주소, 업태 구분명 등 다양한 정보를 포함하고 있습니다. 종합체육시설에 대한 공간분석, 운영현황 파악, 지역별 체육시설 수요분석 등에 활용 가능하며, 공공 및 민간 부문의 체육 인프라 계획 수립에도 유용한 자료입니다. 행정안전부가 원본 데이터를 제공하며 주간 단위로 갱신되고, Open API를 통해 접근할 수 있어 시스템 연계도 용이합니다.
