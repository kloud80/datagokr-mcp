description_portal: 한국예술인복지재단에서 지원하는 예술인 생활안정자금(융자) 사업의 연단위(2020년~2025년) 수혜자 통계자료 제공- 연도별 통계 분류는 엑셀 내 연령시트, 분야시트, 지역시트로 구분되어 있음- 2020년~2022년에 한시적으로 진행한 코로나19 지원 통계가 있으며, 현재는 지원하지 않음- 재단에서 운영하고 있는 예술인 생활안정자금(융자) 사이트를 통해 온라인으로 매월 신청접수를 받고 있음(artloan.kr)- 2019년 7월 시범사업으로 시작된 예술인생활안정자금(융자) 사업은 복권기금법과 문화예술진흥법을 근거로 제도권 금융서비스를 충분히 누리지 못하는 예술인의 창작환경 개선과 생활 기반 마련을 지원하는 저금리 대출 제도
