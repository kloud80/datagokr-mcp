summary_user: 서울 강남구에 있는 의료기관의 기관명을 일본어로 적은 목록 파일로, 기관 한 곳당 한 행이며 필드는 기관명 하나뿐이고 파일 크기는 약 7.7KB(csv)다. 일본어권 의료관광객 안내 자료나 다국어 병원 검색 서비스를 만드는 사업자가 '강남구 병원 이름을 일본어로 어떻게 표기하나'를 확인하는 데 쓴다. 실측 컬럼에 기관 코드나 주소 같은 전역 조인 키가 없어서, 다른 의료기관 자료와는 기관명을 직접 맞대는 이름 매핑으로만 이을 수 있다.
description_portal: 서울특별시 강남구에 위치한 400여개 의료기관에 대한 기관명 데이터를 제공합니다.각 의료기관의 이름을 일본어로 기재하여 영어 사용권자, 즉 일본어를 주로 사용하는 외국인들이 기관을 쉽게 식별하고 이해할 수 있도록 구성하였습니다.이러한 방식으로 정리함으로써 일본어권 방문자가 원하는 병원을 쉽고 빠르게 찾을 수 있도록 정보를 직관적이고 체계적으로 정렬하였습니다.이와 관련하여 보다 구체적인 안내나 추가적인 자료가 필요하거나 궁금한 점이 있다면, 강남구청 관광진흥과로 문의하여 주시기 바랍니다.
