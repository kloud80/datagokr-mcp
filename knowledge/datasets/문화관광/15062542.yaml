summary_user: "경상남도 내 박물관을 시설 한 곳당 한 건으로 담으며, 명칭·시군·도로명주소·대표자·전화·팩스·홈페이지를 제공하는 시도 범위의 개별 시설 목록이다. 주민이나 관광객이 '우리 시군에 있는 박물관은 어디이고 연락처·홈페이지는 무엇인가'를 찾거나, 분석가가 경남 시군별 박물관 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키(예: 문화시설 총람 코드)가 없어 다른 문화시설 데이터와는 시설명·주소 매칭이나 시군명(sigungu)으로만 이어 쓴다."
