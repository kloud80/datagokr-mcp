description_portal: 국립어린이청소년도서관, 국립현대미술관, 대한민국역사박물관 등 12개 주요 문화예술 기관의 전시 정보를 통합하여 제공합니다. 전시 제목, 연계 기관명, 전시 일정, 장소, 장르, 관람 시간, 전시품 정보, 작가, 출연진, 주최 및 후원, 관람료, 예매 안내 등 다양한 세부 정보를 포함하고 있어 전시 기획자, 문화예술 연구자, 일반 관람객 등 다양한 이용자가 손쉽게 전시 현황을 파악하고 활용할 수 있습니다. 또한, 각 기관의 전시 소식과 안내 사항을 한눈에 확인할 수 있어 문화예술 관련 서비스 개발이나 전시 일정 관리, 홍보 자료 작성 등에도 유용하게 활용할 수 있습니다.
