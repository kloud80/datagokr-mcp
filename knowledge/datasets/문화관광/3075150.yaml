summary_user: 고흥군이 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 지자체 목록 파일로, 업소명·소재지·주메뉴·비고를 담고 범위는 고흥군 한 개 시군구다(CSV 약 2.3KB의 소규모 파일). 고흥을 찾는 여행자나 주민이 '고흥에서 믿고 갈 만한 모범음식점이 어디이고 무엇을 파는가'를 확인할 때 쓰고, 지역 관광 안내 콘텐츠를 만드는 사업자도 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓰며, 음식 분야 관광 콘텐츠의 대표 원장인 TourAPI 음식점 정보와 비교·보완하는 용도로 쓴다.
