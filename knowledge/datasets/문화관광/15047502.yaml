summary_user: 인천 강화군 관내 일반음식점을 업소 한 곳당 한 행으로 담은 2019년 기준 파일(CSV 약 258KB)로, 인허가번호·인허가일자·업소명·도로명/지번 소재지·영업장면적·업태명·행정동명 등을 담는다. 강화 여행 안내를 만들거나 지역 상권을 보는 분석가가 '강화군 어느 동에 어떤 업태의 음식점이 몰려 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 인허가번호·업소명·주소(우편번호 포함) 같은 이름·주소 매칭으로만 잇는다. TourAPI 음식 콘텐츠도 같은 방식으로 맞춘다.
description_portal: '2019년 기준 인천광역시 강화군 관내에서 영업 중인 식품위생업소 중 일반음식점 현황을 정리한 자료로서, 식품위생 행정업무 수행과 지역 내 음식점 분포 현황을 파악하기 위해 작성되었습니다. 강화군에서는 식품위생법에 따라 일반음식점의 인허가 및 영업 현황을 관리하고 있으며, 해당 자료는 업소 운영 현황과 지역별 분포 특성을 이해하는 데 참고할 수 있습니다.인허가번호, 인허가일자, 업소명, 소재지 등 항목을 포함한 일반음식점 현황 자료이며, 관련 행정업무 참고자료 및 기초 통계자료로 활용할 수 있도록 제공됩니다.공공데이터 제공신청(제공신청 번호 : 19176)을 통해 1회성으로 개방하는 데이터이므로 정기적 갱신이나 현행화를 진행하지 않습니다.'
