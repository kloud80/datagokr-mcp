summary_user: 한국문화예술위원회 시각예술 분야의 학술행사(심포지엄·세미나 등)를 행사 한 건씩 담은 파일로, 포털 설명상 2008년부터 2018년까지의 행사명·회차·시작일·종료일·주최·장소·행사내용을 담는다. 미술 연구자나 분석가가 '2010년대에 어떤 기관이 어떤 주제로 시각예술 학술행사를 열었나' 같은 질문에 답할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 주최 기관명이나 장소명 같은 이름 매핑으로만 이어 쓸 수 있다.
description_portal: Ak시각예술의 학술행사정보입니다. 각 구성 항목으로는 연번, 연도, 학술행사명, 회차, 시작일, 종료일, 주최, 장소, 행사내용으로 구성되어 있습니다. 또한 연도 항목은 2008부터 2018까지로 구성되어 있고 시작일과 종료일 항목은 날짜 형식으로 2008-02-01과 같은 형식으로 나타나 있습니다. 주최 항목은 대안공간루프 홍익대 예술학과, 한국미술사교육학회 등으로 구성되어 있습니다. 행사내용 항목은 아시아 현대미술과 자본의 관계에 대한 진지하고 적극적인 고찰, 아네트 메사제 작품세계와 전시 등과 같이 내용이 나타나 있습니다.
