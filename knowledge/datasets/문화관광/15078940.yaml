summary_user: 인천광역시 송암미술관을 방문한 이용객 수를 연도·월 단위로 집계한 파일 데이터로, 개별 방문·단체 관람·교육 프로그램 참석자 등 전시동 관람 인원을 모두 합한 수치를 담는다. 문화시설 담당자나 분석가가 '송암미술관 방문객이 연도·계절별로 어떻게 변했고 휴관 기간 전후로 얼마나 달라졌나' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키나 시설코드가 없어 다른 데이터와는 미술관명이나 연도·월 기준으로 직접 맞춰 이어 써야 한다.
description_portal: 2011~2026년까지 송암미술관을 방문한 이용객 수를  월별로 정리하여 제공합니다.이용객 수는 개별 방문, 단체 관람, 미술관 교육 프로그램 참석자 등 미술관 전시동을 관람한 모든 사람의 수를 취합하여 정리한 숫자로,매월 정리한 이용객 수를 분기별로 업로드 합니다.* 매주 월요일은 휴관일이며,  월요일이 공휴일인 경우 정상 개관합니다.* 2020년과 2023년은 각각 몇개월 간 임시휴관을 하였고, 2020년에는 1개의 프로그램을 제외한 모든 교육프로그램이 온라인으로 진행되었습니다.
