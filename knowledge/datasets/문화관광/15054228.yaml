summary_user: 서울시에 있는 호텔을 한 곳당 한 행으로 담은 목록으로, 고유 식별키(MAIN_KEY), 단계별 분류, 명칭, 지번·도로명 주소, 시·구·동 행정구역을 담는다. 관광정책 담당자나 숙박·상권 분석가가 '특정 구·동에 호텔이 몇 곳 있고 어떤 유형인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 숙박업 인허가(LOCALDATA) 자료나 관광 통계와는 호텔 명칭·주소 또는 구·동 이름을 맞춰 연결해야 한다.
description_portal: 서울시 호텔리스트 현황(한국어) 데이터는 서울시에 위치한 다양한 호텔 정보를 체계적으로 제공하는 공공 데이터입니다. 메인 키를 통해 각 호텔을 고유하게 식별하며, 분류 항목을 통해 호텔의 유형과 특성을 단계적으로 파악할 수 있습니다. 명칭과 지번·도로명 주소, 행정 시·구·동 정보가 함께 제공되어 행정구역별 호텔 분포를 분석하거나 관광·숙박 서비스를 기획하는 데 활용할 수 있습니다. 특히 구와 동 단위 위치 정보를 통해 특정 지역의 숙박 인프라 현황을 세밀하게 파악할 수 있어 관광정책 수립, 상권 분석, 민간 숙박 플랫폼 구축 등 다양한 분야에서 참고 자료로 사용하기에 적합한 데이터입니다.
