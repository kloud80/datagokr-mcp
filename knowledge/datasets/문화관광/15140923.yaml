summary_user: 서울 광진구 관내 일반여행업 인허가 업체를 업소 단위로 담은 원천 목록으로, 업체명·소재지(지번·도로명 주소)·인허가일자·영업상태·폐업일자·중부원점TM 좌표 등을 포함한다. 광진구에서 현재 영업 중인 일반여행사가 어디에 몇 곳 있는지, 언제 인허가를 받거나 폐업했는지를 확인하려는 사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·주소 매칭이나 같은 기관(개방자치단체) 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 일반여행업 인허가를 받아 운영 중인 여행업체 현황을 나타냅니다. 일반여행업은 국내외 여행객(내국인·외국인)을 대상으로 여행 일정을 기획하고, 비용 산출, 숙박 예약, 관광지 안내, 교통편 연결 등 종합적인 여행 서비스를 제공하는 업종입니다. 데이터에는 여행사명, 소재지, 업종 유형, 인허가일자 등 기본 정보가 포함되며, 지역 내 관광산업 구조 및 서비스 제공 현황을 파악하는 데 유용합니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위경도(WGS84) 좌표는 포함되어 있지 않기 때문에 GIS 시스템 연동 시 변환이 필요합니다. 본 데이터는 3일 전 기준으로 정기 갱신되며, 관광산업 관리, 정책 수립, 여행업 인프라 분석 등 다양한 분야에서 활용 가능한 기초 자료입니다.
