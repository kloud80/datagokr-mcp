description_portal: 의정부도시공사에서 운영하는 주경기장의 이용요금에 과한 정보(평일, 주말)입니다. 공휴일은 주말 이용요금이 적용됩니다.필드(축구경기장)와 트랙(육상경기장)으로 구분하며, 주간별, 야간별 대관료에 관한 세부정보를 제공합니다.또한, 체육경기, 체육행사, 체육 외 행사 요금을 구분하여 제공합니다.경기장 대관 이용 희망자 및 이용자, 기타 정보수요자를 위하여 해당 정보를 정확하고 신속하게 제공 및 현행화하고 있습니다.의정부도시공사 대표 홈페이지에 접속하시면 시설소개>주경기장>주경기장 소개에서도 해당 정보를 확인할 수 있습니다.https://www.uiuc.or.kr/facilityInfo/stadiumPage/stadium/content.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.
