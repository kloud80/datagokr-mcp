description_portal: 서울시 생활권계획 시설(공원) 공간정보는 서울시가 도시 생활권 단위로 관리하는 공원 및 관련 공간시설의 위치와 행정 정보를 체계적으로 정리한 데이터입니다. 각 공원의 식별을 위한 ID와 도시계획코드, 시설 분류명, 고시·조서 관련 행정 정보 등이 포함되어 있어 공원 지정의 법적·행정적 근거를 확인할 수 있습니다. 또한 X·Y 좌표가 함께 제공되기 때문에 지도 기반 분석, 공간 데이터 시각화, 생활권별 공원 분포 파악 등에 바로 활용할 수 있습니다. 이런 정보는 도시계획 수립, 생활권 기반 인프라 분석, 공원 접근성 연구, 공공 공간 개선 전략 마련 등 다양한 도시정책 분야에서 핵심 기초 자료로 활용됩니다.
