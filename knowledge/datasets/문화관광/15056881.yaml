summary_user: 예술의전당 공연을 건별로 담은 데이터로, 공연마다 제목·기간·시간·장소·공연시간·요금·출연진·관람 대상·장르 등 24개 표준 메타데이터 항목을 문화체육관광부 공연정보(통합) 형식으로 제공한다. 관람객이나 공연 안내 서비스 운영자가 '이번 달 예술의전당에서 열리는 클래식 공연의 일정과 요금은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID(mt20id)·공연장ID(mt10id)와는 바로 이어지지 않으며, 다른 공연 데이터와는 제목·장소 이름 매칭이나 같은 기관(연계기관명 CNTC_INSTT_NM) 기준으로만 연결한다.
description_portal: 문화체육관광부 소속/공공(유관) 기관에서 개별 운영 중인 공연 정보를 연계, 통합하여 "제목(TITLE), 기간(PERIOD), 시간(EVENT_PERIOD), 장소(EVENT_SITE), 공연시간(DURATION), 요금(CHARGE), 할인정보(CHARGE) 등" 총 24개 메타데이터 칼럼(COLUMN_ID) 정보를 공통 항목으로 표준화하여 제공합니다. 2024년 현재 공연정보(통합) 오픈 API를 구성하는 10개 기관(국립중앙극장, 한국예술종합학교, 국립부여박물관, 국립아시아문화전당, 예술의전당, 국립오페라단, 한국체육산업개발(주), 국립극단, 국립현대무용단) 데이터를 최신화 하여 제공 중입니다. 추가로 문화체육관광부 소속‧공공(유관) 기관의 23개 공연 정보 자원에 대한 API 원천데이터 표준화를 진행 중이며, 상시 업데이트 됩니다.
