summary_user: 경기도 연천군에 있는 국가지정·도지정·향토유산 등 문화재를 한 건씩 담은 목록 파일로, 문화재명·지정 구분·지정일자·소재지(주소)를 담는다(파일 크기 약 5.5KB의 소규모 CSV). 연천군 안에 어떤 지정·등록 유산이 어디에 있는지, 언제 지정됐는지를 확인하려는 주민·관광객·지역 연구자가 쓴다. 전역 조인 키가 없어 국가유산청 유산 API 등과는 문화재명이나 소재지 주소를 맞춰서만 이을 수 있다.
description_portal: 연천군은 선사시대부터 삼국시대, 고려·조선, 근대에 이르기까지 폭넓은 역사층을 품고 있는 지역으로, 국가지정유산·도지정유산·향토유산 등 다양한 문화유산이 고르게 분포한다. 국가지정유산으로는 연천 전곡리 유적을 비롯해 삼국시대 방어시설인 호로고루·당포성·은대리성 등이 지정되어 있으며, 임진강 생태 환경을 보여주는 은대리물거미 서식지와 두루미류 도래지가 천연기념물로 보호되고 있다. 또한 연천역 급수탑, UN군 화장장시설 등 근·현대사 자료도 국가등록문화유산으로 포함되어 지역의 전쟁사와 교통사를 확인할 수 있다.도지정유산은 조선·신라·백제 등 각 시대를 대표하는 묘역, 고인돌, 산성, 부도군 등으로 구성되어 있어 연천의 역사적 연속성을 보여준다. 특히 청동기 고인돌군과 삼국~조선 시대 묘역들이 고르게 분포해 지역의 생활사·장례문화를 이해하는 중요한 자료가 된다.향토유산은 묘역, 향교, 서원, 무형유산 등 지역의 정체성과 생활문화가 반영된 자산이 많다. 아미산 울어리, 미산성주걸이, 연천 숭의전 제례 등 무형유산은 지역 공동체의 전통과 의례문화를 드러내며, 최근에는 전곡리 소방 사이렌탑 같은 생활유산도 향토등록유산으로 등재되어 문화재 범위가 현대까지 확장되고 있다. 이처럼 연천군 문화유산은 역사·생태·생활문화가 복합적으로 어우러져 보전 가치가 매우 높다.
