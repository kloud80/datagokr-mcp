description_portal: '부천시 소재 공공도서관의 ‘주력 이용 도서관’을 나타내는 공간정보 데이터입니다. 주력 이용 도서관은 개별 회원의 실제 대출 이력을 기준으로, 가장 많은 대출이 발생한 도서관을 1곳 지정해 정의합니다. 예: A회원이 원미 4권, 글마루 7권, 무지개 11권을 대출했다면 A회원의 주력 이용 도서관은 무지개도서관입니다. 데이터는 도서관별 집계값과 기관 식별자, 주소, 좌표 등 속성을 포함하며, 이용 패턴 분석, 권역 설정, 서비스 공급 최적화, 분관 배치 검토 등에 활용할 수 있습니다. GeoJSON/SHP 등 표준 포맷으로 제공됩니다'
