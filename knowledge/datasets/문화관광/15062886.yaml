status: active
summary_user: 경상남도 자연관광지를 한 곳씩 담은 목록으로, 명칭·소개 내용·주소·위도경도·전화번호·홈페이지·교통 안내·분류명·이미지 주소를 조회한다. 경남 여행을 계획하는 사람이나 여행 서비스 개발자가 '경남의 산·계곡·해변 같은 자연 명소는 어디에 있고 어떻게 가나'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 원장 등 다른 데이터와는 명칭이나 주소·좌표를 맞춰 연결해야 한다.
limits: contentId 같은 공통 식별자가 없어 TourAPI 등 다른 관광 데이터와 바로 조인할 수 없고 이름·주소 매핑이 필요하다. 경상남도 범위만 담으며, 관광 콘텐츠의 대표 원장은 TourAPI이고 이 데이터는 지자체 목록으로 보조 등급이다.
