summary_user: 지역신문발전위원회 홈페이지에 등록된 전국 지역언론사를 언론사 한 곳당 한 행으로 담은 목록으로, 언론사명·주소·사용여부만 있으며 CSV 한 파일(약 220KB)로 활용신청 없이 받는다. 지역 언론 현황을 파악하려는 연구자나 특정 시·군에 어떤 지역신문이 있는지 찾는 기관·사업자가 '우리 지역에서 활동하는 지역언론사는 어디인가'를 확인하는 데 쓴다. 공통 조인 키나 등록번호·사업자번호 같은 코드가 없어 다른 언론사 등록 데이터와는 언론사명으로 맞추거나 주소를 행정구역으로 변환해 이어 써야 한다.
description_portal: 한국언론진흥재단의 지역신문발전위원회 공식 홈페이지에는 전국 각 지역에서 활발히 활동하고 있는 지역언론사들의 포괄적인 목록과 함께 각 언론사별 소재지 정보가 체계적으로 정리되어 등록되어 있습니다. 이러한 정보는 지역 언론 생태계의 현황을 파악하고 각 언론사와의 원활한 소통을 위한 중요한 기초 자료로 활용되고 있습니다. 다만, 해당 정보들은 각 지역언론사의 자율적이고 자발적인 등록 절차를 통해 수집된 것으로, 언론사의 이전이나 조직 변경 등의 사유로 인하여 홈페이지에 등록된 소재지 정보와 현재의 실제 소재지가 상이한 경우가 있을 수 있음을 미리 양해해 주시기 바라며, 정확한 정보 확인을 위해서는 해당 언론사에 직접 문의하시기를 권합니다.
