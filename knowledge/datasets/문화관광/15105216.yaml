summary_user: 국립세종도서관이 제공하는 국내 데이터베이스 자료를 건별로 담으며, 자료마다 발행기관·책임자·소속 DB·자원 명칭·등록일·접근 URL·내용·참조 자원 제목이 들어 있고 범위는 전국·비공간이다. 연구자나 학생이 '국립세종도서관에서 이용할 수 있는 국내 학술·정보 DB에는 무엇이 있고 어느 기관이 발행했나'를 찾아볼 때 쓴다. 실측 컬럼에서 도서관코드나 ISBN 같은 전역 조인 키는 확인되지 않아, 다른 도서관 데이터와는 발행기관명이나 자원 명칭을 이름으로 맞춰 이어 써야 한다.
description_portal: 국립세종도서관에서 제공하는 국내 데이터베이스 자료에 대한 상세 정보를 담고 있습니다. 발행기관, 책임자, 소속 DB, 자원 명칭, 등록일, 위치 정보, 내용, 참조 자원 제목 등 다양한 항목을 포함하여 도서관 자료의 체계적인 관리와 활용을 지원합니다. 연구자, 학생, 일반 이용자 등 다양한 사용자가 국내 도서관 자료를 효율적으로 검색하고 분석할 수 있도록 설계되어 있으며, 문화·체육·관광 분야의 정책 수립, 학술 연구, 정보 서비스 개발 등 여러 방면에서 활용이 가능합니다. 데이터의 신뢰성과 접근성을 높여 지식 정보 자원의 활용도를 극대화할 수 있습니다.
