description_portal: 부천시 공공도서관의 전자책 대출 이력을 정리한 데이터셋입니다. 2019년부터 2021년까지 3년간 대출된 전자책 자료를 대상으로 도서명, 대출일시, 반납일시, 자료유형, 이용도서관, 회원구분, 대출채널(모바일·웹) 등 기본 속성을 포함합니다. 이를 통해 기간별 대출 추이, 인기 전자책 순위, 계절별·요일별·시간대별 이용 패턴, 연령대별 선호 자료 분석이 가능하며, 디지털 자료 서비스 품질 개선, 신규 콘텐츠 구입 계획, 맞춤형 추천 서비스 개발 등 다양한 정책 및 서비스 의사결정에 활용할 수 있습니다. CSV, XLSX 등 표준 형식으로 제공되어 가공 및 시각화 작업이 용이합니다.
