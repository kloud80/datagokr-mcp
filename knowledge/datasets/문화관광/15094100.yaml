summary_user: 충청남도 보령시 읍면동별 야외운동시설을 설치장소 한 곳당 한 행으로 담은 파일로, 행정동·설치장소·주소·운동기구 현황·설치연도·데이터기준일을 담는다(csv 약 42KB). 시민이 집 근처 무료 운동기구 위치를 찾거나, 시·보건소가 읍면동별 시설 분포와 노후 시설(설치연도 기준) 교체 우선순위를 따질 때 쓴다. 전역 조인 키는 없으므로 행정동 이름이나 설치장소 주소를 매핑해 행정구역 통계·인구 자료나 다른 체육시설 목록과 잇는다.
description_portal: 고령화 사회 진입과 시민 건강 증진에 대한 관심 증가로 생활 밀착형 운동시설 수요가 증대되고 있으며, 각 분야에서 지역별 야외운동시설 배치 현황 및 접근성 정보에 대한 활용 요청이 증가함에 따라 보령시는 읍면동별 야외운동시설의 상세 설치 현황 정보를 제공하고 있습니다.개방 데이터는 행정동(읍면동), 설치장소(공원, 아파트 단지, 경로당 인근 등), 주소, 운동기구 현황(철봉, 허리돌리기, 달리기운동, 파도타기, 등지압기, 벤치, 어깨근육풀기, 윗몸일으키기 등), 설치연도, 데이터 기준일자 등의 항목으로 구성되어 있습니다.지자체·체육진흥기관은 읍면동별 야외운동시설 분포 분석, 시설 공백 지역 파악, 노후 시설 교체 및 신규 설치 우선순위 결정, 주민 건강 증진 사업 계획 수립에 활용하고, 연구기관·학계는 생활권 단위 체육시설 접근성 연구, 고령자 친화 시설 배치 분석, 주민 건강 지표와의 상관관계 연구 및 도시계획 연구에 활용하며, 복지기관·보건소는 지역 주민 건강 프로그램 기획, 어르신 건강 증진 활동 장소 안내, 운동 처방 및 건강 상담 시 활용할 수 있습니다. 또한 시민은 거주지 인근 무료 운동시설 검색, 일상 운동 계획 수립 및 건강관리에 활용할 수 있으며, 부동산 관계자는 주거 환경 평가 시 생활 편의성 요소로 참고할 수 있습니다.
