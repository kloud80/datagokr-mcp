summary_user: 서울시설공단이 운영하는 고척체육센터의 강좌 종목별 신규·재등록 접수기간, 접수 시작·종료 시간, 강좌 운영기간, 온라인 접수 가능 여부를 종목 한 줄씩 담은 작은 CSV 파일(약 8.8KB)이다. 시민이 '고척체육센터 수영·헬스 같은 종목의 신규 접수가 언제 몇 시에 열리고 온라인으로 신청되는가'를 확인하거나, 개발자가 접수 일정 안내 서비스를 만들 때 쓴다. 사업장코드(gocheok_workplace_cd)가 조인 키로 확인되어 같은 키를 쓰는 고척체육센터의 다른 강좌·시설 데이터와 이어 쓴다.
description_portal: 서울시설공단이 운영하는 고척체육센터는 다양한 체육 프로그램의 효율적인 운영과 시민 편의를 위해 종목 관리 정보를 정형데이터 형태로 제공하고 있습니다. 이 데이터는 종목명, 신규 접수기간, 재등록 접수기간, 강좌 운영기간, 신규 및 재등록 접수 시작·종료 시간, 온라인 접수 가능 여부 등 주요 항목으로 구성되어 있으며, 각 프로그램의 운영 일정과 신청 정보를 체계적으로 담고 있습니다. 또한 사업장 코드, 정렬 순서, 삭제 여부, 데이터 생성 및 수정 날짜 등의 메타정보도 포함되어 있습니다. 이 정형데이터는 시민이 체육 강좌를 편리하게 신청할 수 있도록 돕고, 행정기관이나 민간 개발자가 시스템 연계, 일정 안내, 수요 분석 등에 폭넓게 활용할 수 있도록 설계되어 있습니다.
