summary_user: 전국 지자체가 관리하는 생활 빙상장업(아이스링크 등) 인허가 정보를 사업장 단위로 담으며, 검증 시 전체 247건이 1989-12-26부터 2026-09-17까지 수신됐다. 사업자나 분석가가 특정 지역에 빙상장이 언제 인허가를 받았고 영업·폐업 상태가 어떠한지 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 주소 키로 삼아 다른 체육시설업 명부나 상권 데이터와 이어 쓴다.
description_portal: '생활_빙상장업 데이터는 아이스링크장 등 빙상 위에서 스포츠를 즐길 수 있도록 시설을 갖추어 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준으로, 전국 지방자치단체에서 관리하는 빙상장업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터의 법령 소관기관 및 문의처 : 문화체육관광부 스포츠산업과 / 044-203-3156 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
