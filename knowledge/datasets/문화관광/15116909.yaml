summary_user: 인천 남동구가 입소문 난 맛집으로 선정한 음식점을 업소 한 곳당 한 행으로 담은 소규모 목록(CSV 약 2.5KB)으로, 업소명·업태(음식 종류)·연락처·주소·영업시간·주차정보를 포함한다. 남동구 주민이나 방문객이 '남동구에서 주차 가능한 한식 맛집은 어디고 몇 시까지 영업하나'를 확인하거나, 지역 외식 안내 콘텐츠를 만들 때 쓴다. 전역 조인 키가 없어 TourAPI 음식 콘텐츠나 음식점 인허가 데이터와는 업소명·주소 문자열을 맞춰 연결해야 한다.
description_portal: 이 데이터는 인천광역시 남동구 지역 내에서 많은 사람들에게 입소문이 난 맛집들의 현황을 수록한 것으로, 남동구를 방문하거나 거주하는 시민들이 다양한 외식 정보를 쉽게 확인할 수 있도록 제공됩니다. 데이터에는 각 맛집의 업소명, 업태명(음식점의 종류), 연락처, 상세 주소, 영업시간, 주차 가능 여부 등의 항목이 포함되어 있습니다. 이를 통해 이용자들은 방문 전 운영 시간이나 주차 편의성 등을 미리 파악할 수 있어 편리한 이용이 가능하며, 지역 경제 활성화 및 소상공인 지원에도 기여할 수 있습니다. 해당 데이터는 정기적으로 갱신되어 정확한 정보를 제공합니다.
