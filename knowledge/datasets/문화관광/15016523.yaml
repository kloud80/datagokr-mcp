summary_user: 서울특별시 동작구에 있는 민간 체육시설업 사업장을 한 곳당 한 행으로 담은 명부 파일(csv, 약 36KB)로, 업종(수영장업·체육도장업 등)·상호·시설주소·전화번호·관리부서·데이터갱신일자를 담는다. 동작구에서 업종별 체육시설이 어디에 얼마나 분포하는지 알고 싶은 주민이나, 헬스장·체육도장 같은 업종의 지역 상권을 살피는 사업자·분석가가 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 실측 컬럼에 없어 다른 데이터와는 상호명·주소 매칭이나 같은 기관 데이터끼리로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 동작구에 위치한 체육 관련 시설의 운영 현황을 제공합니다.이 데이터에는 시설의 업종 정보가 포함되어 있으며, 수영장업·체육도장업 등 시설 유형을 확인할 수 있습니다.각 시설의 상호 정보를 통해 사업장 명칭을 확인할 수 있습니다.주소 항목을 통해 체육시설의 위치를 파악할 수 있습니다.시설 전화번호 정보는 문의 및 이용 안내를 위한 연락 수단으로 활용됩니다.해당 데이터는 업종별 체육시설 분포 현황 분석에 활용 가능하며, 지역 내 생활체육 서비스 제공 현황 파악을 위한 기초자료로 활용됩니다.
