summary_user: 경기도 하남시 박물관이 소장한 유물을 한 점(소장품번호)씩 담은 건별 목록으로, 유물 명칭·소장구분·수량·국적과 시대를 포함하며 CSV 파일(약 174KB)로 활용신청 없이 받는다. 지역사 교육 담당자나 분석가가 '하남시 박물관에 원삼국 시대 유물이 얼마나, 어떤 종류로 있나' 같은 시대별 소장 현황을 확인하는 데 쓴다. 다른 데이터와 공통으로 맞출 조인 키는 없어, 유물 명칭이나 시대 표기를 이름으로 맞추거나 같은 기관 자료끼리만 연결한다.
description_portal: 해당 데이터는 경기도 하남시 박물관에서 소장 중인 유물에 대한 정보로, 소장품번호, 유물명칭, 소장구분, 주수량, 유물의 국적 및 시대가 포함되어 있습니다. 다수의 유물이 "한국-원삼국" 시대에 속해 있으며, 대표 유물로는 민무늬토기항아리, 돌뚜껑 등이 있습니다. 이 데이터를 활용하면 시대별 유물 통계 분석, 지역사 박물관 학습 콘텐츠 개발, 디지털 전시자료 제작 등 다양한 공공서비스 및 문화 활용이 가능하며, 공공데이터포털에 개방 시 교육·문화 분야의 AI 학습용 데이터로도 가치가 높습니다. 또한, 유물별 세부 정보를 통해 지역 고고학적 특성과 하남시의 역사문화 자산을 체계적으로 보존·홍보하는 기반자료로도 활용될 수 있습니다.
