description_portal: 본 공공데이터는 인천광역시 서구 관내에 지정된 천연기념물에 대한 현황을 수록하고 있습니다. 본 공공데이터는 천연기념물 명칭, 지정번호, 지정일자 등 정보가 포함되어 있습니다. 천연기념물은 학술적,자연사적 가치가 높아 국가에서 보호하는 대상물로 보호수, 휘귀식물 등이 포함됩니다. 본 데이터를 통해 생태환경 보존정책 수립, 지역생물자원 관리, 학술연구의 기초자료로도 활용될 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
