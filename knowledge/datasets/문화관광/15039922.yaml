summary_user: 인천광역시 서구(서해구) 관내에 지정된 천연기념물의 현황을 한 건씩 담은 파일 데이터로, 연도·지정번호·명칭·수량·소재지·지정일자를 포함하며 파일 크기는 608바이트로 소수 건이다. 지역 주민이나 생태·문화유산 연구자가 '서구에 어떤 천연기념물이 어디에 있고 언제 지정됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 유산 목록 등과는 지정번호나 명칭을 맞춰 연결해야 하고, 소재지 주소로 위치 데이터와 이을 수 있다.
