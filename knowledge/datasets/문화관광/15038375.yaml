summary_user: 서울 양천구 관내 공연장을 한 곳씩 담은 인허가 기반 목록으로, 포털 설명상 공연장명·소재지·전화번호·인허가등록번호·등록일자·객석수·영업상태·폐업일자를 담는다. 주민이나 공연기획자가 '양천구에 지금 영업 중인 공연장은 어디이며 객석은 몇 석인가'를 확인하거나, 구청이 공연장 관리·시설 점검 대상을 추릴 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연장ID(mt10id) 같은 외부 키와는 직접 붙지 않으며, 공연장 이름·주소로 매칭하거나 같은 기관 코드로만 다른 데이터와 잇는다.
description_portal: 본 자료는 서울특별시 양천구 관내 공연장 설치 및 운영 현황을 종합적으로 수록한 데이터이다. 공연장명칭,소재지, 전화번호,  인허가등록번호, 등록일자, 객석수, 영업상태, 폐업일자를 제공하여 주민과 방문객이 공연 서비스를 편리하게 이용할 수 있도록 구성되어 있다. 해당 데이터는 정확성을 기하기 위하여 관할 문화·예술 관련 부서에서 수집한 공식 정보를 기반으로 하며, 공연장별 시설 현황과 운영 상태를 체계적으로 확인할 수 있도록 정리되어 있다. 이를 통해 공연장 관리, 문화 정책 수립, 시설 점검 및 지역 문화 활성화에 활용 가능하며, 주민 편의 증진과 지속 가능한 문화 인프라 운영에 기여한다.
accrual_periodicity: 수시
