summary_user: 국가유산청과 소속기관이 개방한 공공데이터를 기관별로 정리한 목록 파일(CSV, 약 2KB)로, 행마다 개방기관·구분·데이터명·링크를 담는다. 분석가나 개발자가 '국가유산청 계열 기관이 어떤 공공데이터를 열어두었고 어디서 받는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 데이터명이나 기관구분코드를 이름으로 맞춰 연결해야 하며, 유산 지정·등록 데이터의 종목코드·지정번호 체계와는 직접 이어지지 않는다.
description_portal: '문화유산 데이터 지도는  문화재청 및 소속기관에서 제공하고 있는  공공데이터의  현황을 지도 형식으로 정보를 제공합니다.“국가유산청_문화유산 데이터 지도”는 문화재청과 소속 기관이 제공하는 공공데이터를 지도 형식으로 시각화한 자료입니다. 이 데이터는 문화재의 위치와 관련 정보를 통합하여, 문화유산의 분포와 현황을 한눈에 파악할 수 있도록 구성되어 있습니다.📌 주요 내용데이터 항목: 문화재의 명칭, 소재지, 지정 구분, 관리 기관, 관련 링크 등업데이트 주기: 수시 업데이트되며, 최신 수정일은 2024년 5월 22일입니다.🗺 활용 예시문화재 탐방: 특정 지역의 문화재를 지도에서 직접 확인하고 방문 계획을 세울 수 있습니다.연구 및 교육: 지역별 문화유산 분포를 분석하여 연구 자료로 활용하거나 교육 콘텐츠를 개발할 수 있습니다.정책 수립: 문화재 보호 및 관리 정책을 수립하는 데 필요한 기초 자료로 활용됩니다.'
