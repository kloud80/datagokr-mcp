summary_user: 경기문화재단과 산하 문화기관(경기도박물관, 경기도미술관, 백남준아트센터 등)이 낸 공고·소식을 글 한 건 단위로 모은 원천 목록이며, 기관명·이벤트 종류·제목·분류·글 주소·요약·이미지 주소·이벤트 기간·등록일을 담는다. 문화행정 연구자나 아카이브 구축자가 '2022년 개편 이전 경기문화재단 산하 기관들이 어떤 공고와 행사를 냈는가'를 되짚는 데 쓴다. 전역 조인 키는 없어 기관명(INST_NM) 같은 이름 매칭으로만 다른 경기도 문화기관 데이터와 이어 쓴다.
