summary_user: 서울 강북구의 수영·골프·체육단련 등 종합체육시설업 업소를 한 곳씩 담은 인허가 원천 명부로, 영업 중인 곳과 폐업한 곳이 모두 들어 있고 인허가일·폐업일·영업상태·주소·중부원점TM 좌표(X, Y)를 담는다. 강북구에서 어떤 종합체육시설이 언제 문을 열고 닫았는지, 지금 영업 중인 곳은 어디인지를 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 붙이며, 다른 체육시설업 인허가 명부나 상권 데이터와 함께 개폐업 흐름을 보는 데 쓴다.
description_portal: '서울특별시 강북구 종합체육시설업 인허가 정보 데이터는 강북구의 수영, 골프, 체육단련 등과 같은 체육시설을 한 곳에 모아놓은 업소정보입니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
