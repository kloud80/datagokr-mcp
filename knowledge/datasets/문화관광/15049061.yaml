description_portal: ‘한국학중앙연구원_장서각 소장 의궤 수록 반차도 직책별 복식 및 의물 착용 정보’ 데이터는 조선시대 의궤에 수록된 반차도(班次圖) 속 인물들이 각자의 직책에 따라 착용한 복식 및 의물 정보를 체계화한 자료입니다.이 데이터는 직책명과 해당 복식 항목(복식명, 복식ID) 연결하여, 조선시대 관직별 복식 규정과 위계질서를 시각적으로 파악할 수 있도록 구성되어 있습니다. 금관, 조복, 녹단령 등 다양한 복식 항목이 포함되어 있으며, 실제 문무백관의 복식 착용 사례를 통해 복식사 연구, 디지털 반차도 구현, 전통 문화콘텐츠 제작 등 다양한 분야에 활용이 가능합니다.특히 장서각이 소장한 의궤 반차도는 왕실 의례를 정밀하게 기록한 귀중한 자료로, 이 데이터는 의궤와 복식 정보를 연결하는 메타데이터 역할을 하며, 조선시대 의례 문화에 대한 깊이 있는 이해를 돕습니다.
