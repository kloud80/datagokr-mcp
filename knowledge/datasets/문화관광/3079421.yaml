summary_user: 경기도 안양시에 등록·신고된 민간 체육시설업 업소를 한 곳씩 담은 명부 파일로, 업종(헬스장·체육관·골프장·수영장 등)·상호·소재지·전화번호·데이터기준일을 담는다. 시민이 집 근처 헬스장이나 골프연습장을 찾거나, 분석가가 안양시 동네별 체육시설 업종 분포를 상권 데이터와 함께 볼 때 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호·소재지 주소를 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: '- 체육시설 검색: 시민이 가까운 헬스장, 체육관, 골프장,수영장 등 체육시설을 손쉽게 찾아 이용할 수 있도록 지원- 건강 증진 활동 유도: 다양한 체육시설을 안내함으로써 시민의 스포츠 참여율 제고 및 건강한 생활 유도- 동호회 및 클럽 활동: 체육시설 위치 및 운영 정보를 기반으로 커뮤니티 활동 장소 확보안양시 내 체육시설업 관련 업소들의 현황 정보를 담은 데이터입니다. 업종(헬스장, 체육관, 골프장, 수영장 등), 상호, 소재지, 전화번호  등의 항목을 포함하고 있으며, 시민의 건강 증진 및 체육 활동 활성화를 위한 기초자료로 활용됩니다. 해당 데이터는 체육시설 정책 수립, 민간 체육시설 이용 현황 파악 등 다양한 분석에 활용될 수 있습니다.'
