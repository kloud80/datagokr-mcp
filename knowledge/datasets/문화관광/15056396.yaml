summary_user: 경상북도 관내에 등록된 문화재 수리업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 업종 구분·회사명·대표자·주소가 들어 있다. 문화재 수리 공사를 발주하는 담당자나 사업자가 "경북 어느 지역에 어떤 업종의 수리업체가 있나"를 확인하거나 적격 업체 후보를 찾는 데 쓴다. 전역 조인 키나 업체 등록번호가 없어 다른 데이터와는 회사명·주소 같은 이름 매칭으로만 이을 수 있고, 유산 지정 목록의 종목코드·지정번호(ccbaKdcd·ccbaAsno)와 직접 연결되지 않는다.
description_portal: 경상북도 관내에서 문화유산의 원형 보존과 체계적인 수리·복원을 위해 관련 법령에 따라 등록된 문화재 수리업체의 상세 운영 현황을 제공하는 데이터입니다. 본 자료는 각 업체의 전문 시공 분야를 파악할 수 있는 업종 구분 정보와 함께, 수리 사업 수행 기관의 정확한 신원 확인을 위한 회사명 및 대표자 성명 정보를 핵심적으로 포함하고 있습니다. 또한, 지역별 수리업체의 분포 현황을 확인할 수 있는 상세 소재지(주소) 정보를 수록하여, 문화재 수리 공사 발주 시 적격 업체 선정 및 부실 시공 예방을 위한 관리 감독의 기초 행정 자료로 활용됩니다.
