summary_user: 전라남도 공공도서관을 한 곳당 한 행으로 담은 목록 파일로, 도서관명·설립주체(시립·교육청·군립 등)·시군구·주소·개관년도·전화·홈페이지를 담는다(csv 약 12.8KB). 주민이나 분석가가 "우리 시군에 어떤 공공도서관이 있고 누가 세웠으며 언제 문을 열었나"를 확인하거나 시군구별 도서관 분포를 볼 때 쓴다. 실측상 전역 조인 키는 확인되지 않아 시군구·도서관명으로 맞춰 쓰며, 도서관부호(도서관코드) 컬럼이 있으므로 도서관정보나루의 도서관코드와 대조해 대출·인기도서 데이터와 잇는 것을 검토할 수 있다.
description_portal: '- 전라남도에 있는  공공도서관에 대하여 설립주체(시립, 교육청, 군립), 도서관명, 주소, 개관연도 등의 정보를 볼 수 있습니다.- 전라남도에는 도서관이 여러 곳 있으며, 각 도서관은 지역 주민들에게 다양한 독서 및 문화 서비스를 제공합니다.- 회원 가입: 대부분의 도서관은 온라인 또는 현장 방문을 통해 회원 가입이 가능합니다.- 도서 대출: 회원 가입 후 도서 대출이 가능하며, 대출 기간과 권수는 도서관마다 다를 수 있으므로 사전에 확인하시기 바랍니다.- 문화 프로그램: 다양한 문화 프로그램이 정기적으로 운영되며, 일부 프로그램은 사전 신청이 필요할 수 있습니다.- 전자 자료실: 전자책, 오디오북 등 디지털 자료를 온라인으로 이용할 수 있는 서비스도 제공됩니다.'
