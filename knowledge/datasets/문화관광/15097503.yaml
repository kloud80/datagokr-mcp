summary_user: 경기도 여성창업지원시설 '꿈마루'의 대관 공간을 시설 한 곳씩 담은 목록으로, 시군명·시설명·시설구분·용도·담당자 연락처·예약 방법·운영시간·주소와 위경도를 포함한다. 여성 창업자나 일반 이용자가 '경기도에서 회의실이나 교육장을 빌릴 수 있는 꿈마루 공간이 어디이고 누구에게 예약하나'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명이나 주소 같은 이름 기준으로 맞추거나, 정제 위경도(refine_wgs84_lat·logt)로 다른 시설 데이터와 위치를 겹쳐 쓴다.
description_portal: '이 데이터는 경기도 여성창업지원시설인 ‘꿈마루’에서 제공하는 공간 대관 정보에 대한 자료로, 시군명, 시설명, 시설구분, 용도, 담당자 정보, 운영시간, 주소 등의 세부 항목을 포함하고 있습니다. 여성 창업자 및 일반 이용자들이 꿈마루 공간 활용을 위한 정보 탐색에 활용할 수 있으며, 창업 지원정책 분석 및 공공시설 운영 효율성 평가 자료로도 활용 가능합니다.※ 꿈마루 공간대관이 경기공유서비스와 합병됨으로 인해 갱신이 중단된 데이터입니다.※ 경기공유서비스: https://share.gg.go.kr/index'
