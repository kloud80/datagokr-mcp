description_portal: 이 데이터는 국악(한국 전통 음악)과 관련된 주요 공연장 및 기관의 정보를 담고 있는 목록입니다. 전북특별자치도립국악원, 국립민속국악원, 전주세계소리축제 조직위원회 등 국악계의 핵심적인 역할을 하는 기관들의 명칭과 유형(공연터), 그리고 홈페이지, 연락처, 주소와 같은 상세한 정보를 제공합니다. 이 자료는 국악 공연을 관람하고자 하는 일반 대중이나, 공연 및 협업을 희망하는 예술가들에게 필수적인 연락처 정보를 제공하는 역할을 합니다. 지역의 전통 예술 인프라 현황을 파악하는 데 유용한 기초 데이터입니다.
