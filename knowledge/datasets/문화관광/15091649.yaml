summary_user: '콘텐츠산업 유관기관(지역·산업 지원 기관)이 올린 공지·사업 공고·행사 소식을 게시글 한 건씩 모은 전국 단위 목록으로, 게시판 구분·분야·장르·제목·기관명·등록일을 담는다. 콘텐츠 기업이나 창작자가 "지금 어느 기관이 내 장르(예: 웹툰·게임)에 맞는 지원 사업을 공고했나"를 찾거나, 연구자가 기관별 공고 동향을 살피는 데 쓴다. 공통 조인 키는 없으므로 다른 데이터와는 기관명이나 분야·장르 이름을 맞춰서만 이어 쓴다.'
limits: 게시글 제목과 메타정보 위주라 공고 본문·지원 금액·마감일 같은 세부 조건은 확인되지 않는다. 전역 조인 키가 없어 기관명 문자열 매칭에 의존하고, 지역 단위 공간 정보 없이 전국·비공간 데이터로 분류된다.
