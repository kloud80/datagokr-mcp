summary_user: 인천광역시 영종구(옛 중구) 관내에서 영업 중인 수영장업 시설을 한 곳당 한 행으로 담은 소규모 파일 목록으로, 상호·도로명 주소·전화번호·최초 등록일자·최근 변경일자를 담는다. 주민이나 생활체육 이용자가 '집 근처에 등록된 수영장이 어디 있고 연락처는 무엇인가'를 확인할 때 쓰고, 분석가는 체육시설업 등록·변경 시점을 볼 때 쓴다. 전역 조인 키가 없어 다른 체육시설 현황과는 상호나 도로명 주소를 이름·주소 매칭으로 이어 쓴다.
description_portal: '2025. 8월 8일 기준 정상적으로 영업 중인 인천광역시 중구 관내 수영장업은 총 9개소입니다.인천광역시 중구 관내 수영장업의 데이터로 시설명칭, 도로명 주소, 전화번호, 최초 등록일자, 최종 변경일자 등의 데이터를 제공합니다.[데이터 변경 안내]1. 시설 명칭 : 관내 수영장업 시설의 상호명2. 시설 도로명 주소 : 시설의 정확한 위치를 파악하기 위한 주소3. 시설 전화번호 : 시설 안내가 필요할 시 연락이 가능한 전화번호4. 최초 등록일자 : 수영장업으로 신고하여 최초 영업 개시일5. 최종 변경일자 : 대표자, 상호, 면적 등의 변경으로 변경사항이 생긴 기준일'
