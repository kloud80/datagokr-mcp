summary_user: 국립중앙극장이 운영하는 공연장별로 이름·설명, 무대 면적·너비·깊이·높이, 총 객석수와 장애인석 수를 한 행씩 담은 소규모 시설 현황 파일(CSV 약 852바이트)이다. 공연 기획자나 연구자가 "국립중앙극장의 어느 공연장이 우리 공연의 무대 규모와 관객 수에 맞고 장애인석은 몇 석인가"를 확인할 때 쓴다. 실측 컬럼에 공연장ID(KOPIS mt10id) 같은 전역 조인 키가 없어, KOPIS 공연장 정보 등 다른 데이터와는 공연장 이름을 맞춰 연결해야 한다.
description_portal: 국립중앙극장에서 운영하는 공연장에 대한 상세 정보를 제공하는 데이터입니다. 공연장이름, 공연장 설명, 무대면적, 무대너비, 무대깊이, 무대높이, 총 객석수, 장애인석 등 주요 컬럼을 포함하여 각 공연장의 규모와 시설 현황을 한눈에 파악할 수 있습니다. 이를 통해 공연장 시설 비교, 무대 설계, 관객 수용 능력 분석, 접근성 평가 등 다양한 목적으로 활용할 수 있으며, 공연 기획자, 문화행정 담당자, 연구자 등에게 실질적인 참고 자료를 제공합니다. 또한 이 데이터는 공연장 이용 현황 분석, 시설 개선 방안 마련, 관객 편의 증진, 무대 기술 설계 최적화, 공연 환경 안전성 평가 등에도 유용하게 쓰이며, 공연 예술의 질적 향상과 효율적인 시설 운영을 지원하는 기초 자료로 활용될 수 있습니다.
