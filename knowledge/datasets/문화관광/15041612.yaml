summary_user: 한국콘텐츠진흥원이 안내하는 콘텐츠 산업 유관기관 목록을 기관 한 곳당 한 행으로 담은 CSV 파일(약 73KB)로, 기관명·누리집 링크·기관 구분·소개글과 등록일·수정일을 담는다. 콘텐츠 사업을 준비하는 기업이나 연구자가 '게임·음악·영화 등 분야별로 지원이나 정보를 얻을 수 있는 기관은 어디이고 누리집 주소는 무엇인가'를 찾을 때 쓴다. 실측 컬럼에 다른 데이터와 맞출 공통 조인 키나 코드표가 없어, 다른 데이터와는 기관명을 직접 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 본 자료는 한국콘텐츠진흥원이 제공하는 콘텐츠 산업 관련 유관기관 정보를 종합적으로 수집한 것입니다. 유관기관에 대한 정보는 다양한 형태로 제공되며, 각 기관에 대한 상세한 정보를 포함하고 있습니다. 해당 데이터는 콘텐츠 산업에 대한 전문적인 이해를 돕고, 관련 기관들의 유용한 정보를 찾아보는 데에 활용될 수 있습니다. 콘텐츠 관련 사업을 진행하는 기업, 연구자, 정책 입안자 등에게 유익한 자료로, 시장 조사 및 정책 개발에 기여할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 유관기관번호(숫자형), 유관기관명(문자형), 유관기관링크(문자형), 유관기관 구분(문자형), 유관기관 소개(문자형), 등록일(문자형), 수정일(문자형) 등의 정보가 포함되어 있습니다. 이 자료는 유관기관에 대한 포괄적인 데이터를 제공하여 콘텐츠 산업에 기여할 수 있는 기초 자료로 활용될 수 있습니다.
