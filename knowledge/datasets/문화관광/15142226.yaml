summary_user: 전북특별자치도 시군에 조성된 파크골프장을 시설 한 곳당 한 행으로 담은 명부로, 시군·시설명·주소·설치(개장)연도·홀 수·면적(제곱미터)을 담는다. 파크골프 동호인이 우리 동네 가까운 구장과 규모를 찾거나, 지자체 분석가가 시군별 구장 분포와 확충 필요 지역을 따질 때 쓴다. 전역 조인 키가 없어 시군 이름이나 주소를 행정구역 코드에 매핑해야 다른 체육시설·인구 데이터와 이을 수 있다.
limits: 인허가번호·사업자번호 같은 공통 식별자가 없어 체육시설업 등록 데이터 등과 키로 바로 붙일 수 없고, 이름·주소 매칭에 의존해야 한다. 범위는 전북특별자치도 한 곳뿐이라 다른 시도와 비교하려면 별도 자료가 필요하다.
