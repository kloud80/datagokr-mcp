summary_user: 남원시 광한루원 한 곳의 입장객을 연월별로 유료·무료·전체 인원으로 나눠 담은 월별 집계 통계 파일이다. 관광 분석가나 지자체 담당자가 광한루원의 성수기·비수기가 언제이고 무료 입장 비중이 어느 정도인지 확인하는 데 쓴다. 실측 컬럼에 관광지점코드나 시군구코드 같은 전역 조인 키가 없어서, 다른 관광지점 입장객 통계와는 관광지명·시군구명(남원시)을 직접 매핑하거나 연월 기준으로 맞춰 이어 쓴다.
