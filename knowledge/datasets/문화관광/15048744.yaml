summary_user: 인천광역시 내 경기장 체육시설을 시설 한 곳당 한 행으로 담은 CSV 파일(약 12.7KB)로, 시설명·군구·위치·면적·수용인원·건축년도·위탁기관·부속시설·주차·연락처·좌표를 포함한다. 시민이 '우리 구 근처에 관중석 있는 경기장이 어디고 주차는 되는가'를 찾거나, 시·군구 담당자가 시설 노후도(건축년도)와 위탁 운영 현황을 훑어볼 때 쓴다. 전역 조인 키는 없어 군구명으로 인천 행정구역 자료와 이름 매칭하거나 X·Y좌표로 지도·공간 자료와 겹쳐 쓴다.
description_portal: '*시민공모 당선작 아이디어로 시민들의 건강 증진을 위한 공원 내 체육시설, 경기장, 산책로 및 등산로, 공공주택 내 체육시설의 정보 입니다.<활용 목적>이 자료는 시민들의 건강 증진을 위해 가까운 체육 시설의 위치와 이용 정보를 제공하여 생활 체육 활성화에 기여합니다. 또한, 대규모 스포츠 행사 개최 시 시설 정보를 홍보하고, 시와 군·구의 체육 시설 관리 및 유지보수 계획 수립을 위한 기초 데이터로 활용됩니다.인천시민의 스포츠 접근성 향상과 체육 시설 이용 편의 증진에 중요한 정보입니다. 참고하시길 바랍니다.'
