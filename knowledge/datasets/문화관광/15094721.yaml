summary_user: 제주특별자치도에 장기체류하며 근무하는 외국인의 유동인구를 기준연월·국적·시간대·읍면동별로 집계한 통계로, 매 정각 체류 인원을 체류 분÷60으로 환산한 값의 월 합계(work_pop_cnt)를 담는다. 제주 지역 정책 담당자나 분석가가 어느 읍면동에 어떤 국적의 근무 외국인이 어느 시간대에 많이 머무는지, 계절별·연도별로 어떻게 달라지는지를 보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 읍면동 이름(emd_name)이나 기준연월을 이름 매핑해 연결해야 한다.
description_portal: 이 데이터셋은 제주특별자치도 관내에 장기체류 중이며 근무 중인 외국인의 월별 유동인구 변동을 집계한 통계자료입니다. “유동인구”는 하루 01시부터 24시까지 매 정각의 체류 인원을 측정한 뒤, 머문 시간을 분 단위로 계산해 60분으로 나눈 값을 기준으로 산출하며, 해당 월의 총합계가 “근무 외국인 인구”로 집계됩니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 파일은 CSV 형식으로 무료 제공되어 누구나 다운로드 및 활용 가능합니다. 이 자료는 제주 내 체류 외국인의 노동 인구 규모 변화, 계절성 또는 연도별 유입 변화 분석, 외국인 고용 및 생활 인구 흐름 파악, 다문화 정책 수립, 인프라 및 공공서비스 수요 예측, 지역사회 통합 계획 등에 활용될 수 있습니다. 다만 이 데이터는 마지막 갱신 시점까지의 집계치이며, 이후 체류자격 변경, 입출국, 고용 형태 변화, 이동 행태 변화 등은 반영되지 않을 수 있다는 한계가 있습니다.
