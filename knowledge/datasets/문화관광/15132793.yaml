description_portal: 콘텐츠수출마케팅플랫폼(WelCon)인 웰콘에서 제공하는 국제비즈니스 행사정보는 실제로 콘텐츠 산업의 글로벌 진출을 위한 중요한 기반이 됩니다. 이 데이터는 다양한 국제 비즈니스 행사에 대한 정보들을 한곳에 모아 제공하고 있어, 콘텐츠 기업들이 해외에서 개최되는 행사들을 손쉽게 찾아볼 수 있게 합니다. 이러한 정보는 콘텐츠 기업들이 참여할 이벤트를 선정하고, 정확한 스케줄을 계획하는 데 유용하게 사용될 수 있습니다. 출장 일정이나 비즈니스 미팅을 조율하는 데 필수적인 자료로 활용될 수 있는 이 데이터는, 산업 관련자들에게 실제로 필요한 정보를 시기적절하게 제공합니다. 데이터는 행사구분, 행사명, 국가, 개최연도, 개최시작일, 개최종료일, 해당장르의 컬럼으로 구성되어 있습니다. 데이터 구조는 다음과 같습니다. 행사구분(문자형), 행사명(문자형), 국가(문자형), 개최연도(숫자형), 개최시작일(문자형), 개최종료일(문자형), 해당장르(문자형)으로 이루어져 있습니다.
