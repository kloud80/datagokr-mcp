summary_user: 대구광역시가 외국인환자 유치에 앞장서는 의료기관·유치업체를 의료관광 선도유치기관으로 지정한 목록을 기관 단위로 담은 파일(csv, 약 2.6KB)로, 기관명·주소·연락처를 담는다. 대구로 의료관광을 오려는 외국인환자나 이들을 안내하는 여행·유치업체가 '대구시가 지정한 선도 의료관광 기관은 어디이고 어떻게 연락하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 의료기관·관광 데이터와는 기관명이나 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 외국인환자 유치를 위한 홍보, 마케팅 및 인프라 구축 등 지역 의료관광 활성화에 앞장서고 있는 의료기관 및 유치업체를 대상으로 의료관광 선도유치기관 지정.외국인환자 유치에 적극적인 의지를 가지고 사업을 추진 중이거나 추진을 희망하는 의료기관, 유치업체.선도유치기관(의료기관, 유치업체) 명칭 사용 가능.주요 언론매체 홍보지원 및 홍보물 지원, 팸투어 지원.대구시 주최 국내외 설명회 우선참가 지원.홈페이지, 통역 서비스 지원, 의료관광 지원사업 가점.기타 유치업체 역량 강화에 필요하다고 생각되는 지원 사업 지원.
