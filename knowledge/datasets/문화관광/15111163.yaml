summary_user: 경기아트센터가 해마다 구매한 전체 금액, 그중 여성기업이 생산한 제품의 구매액, 그 구매 비율(prchs_rt)을 연도 단위로 담은 집계 시계열입니다. 경기아트센터의 여성기업 제품 구매 비율이 해마다 어떻게 변했는지 확인하려는 정책 담당자나 분석가가 쓰는 자료입니다. 실측 컬럼에는 다른 데이터와 맞출 전역 조인 키가 없어서, 다른 기관의 여성기업 제품 구매현황과는 연도(yr)와 기관명을 기준으로 직접 맞춰 비교해야 합니다.
description_portal: 이 데이터는 여성기업이 생산한 제품에 대한 연도별 공공기관의 구매 실적을 나타낸 자료로, 전체 구매액과 여성기업 생산제품의 구매액, 해당 구매액이 차지하는 비율로 구성되어 있습니다. 연도별 수치를 통해 여성기업 제품의 공공조달 시장 참여 수준을 평가할 수 있으며, 여성기업의 경제적 기여도 분석, 성별 균형 정책의 효과 측정, 정부 지원 사업의 기초자료 등으로 활용 가능합니다. 데이터는 연속적인 연도별 시계열 구조를 가지며, 구매비율을 통해 시장에서의 여성기업 제품의 점유율 및 변화 추이를 한눈에 파악할 수 있습니다.
