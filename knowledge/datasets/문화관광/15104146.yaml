summary_user: 인천 부평구가 지정한 우수 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명 주소·전화번호가 들어 있고 용량은 약 3KB(csv)에 그친다. 부평구에 머물 방문객이 믿을 만한 숙소를 찾거나, 구청·분석가가 우수 숙박업소가 구 안 어디에 몰려 있는지 살펴볼 때 쓴다. 전역 조인 키는 없으므로, 공중위생법 숙박업 신고(LOCALDATA) 같은 인허가 자료와는 업소명이나 도로명 주소(소재지)를 맞춰 이어 붙여야 한다.
description_portal: '우수 숙박업소의 업소명, 소재지, 전화번호 등을 수록한 데이터.지역 내 관광객과 방문객에게 쾌적하고 신뢰성 있는 숙박 환경을 제공하며, 관광 인프라 확충 및 지역경제 활성화 정책 수립에 활용 가능하다.활용 목적 및 특징– 우수 숙박업소 등록 현황 분석– 소재지 기반 입지 특성 및 접근성 평가– 관광객 편의 증진 및 관광산업 활성화 지원– 지역경제 기여 및 관광 인프라 정책 자료 활용주요 항목 설명● 연번: 데이터의 고유 번호● 업소명: 등록된 우수 숙박업소 명칭● 소재지(도로명): 숙박업소의 도로명 주소● 전화번호: 숙박업소 문의·예약을 위한 연락처'
