summary_user: 세종특별자치시가 지정한 향토문화유적을 유적 한 건씩 담은 목록으로, 명칭·지정번호·구분과 종류·도로명/지번 주소·위경도·지정일자·소유 주체와 소유자·조성 시대·소개·관리기관을 담는다. 세종시 주민이나 지역사 연구자가 '우리 동네 근처에 어떤 향토문화유적이 있고 언제 지정됐으며 누가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 지정유산 데이터 등과는 명칭·주소로 맞춰 보거나 위경도로 지도 위에 겹쳐 쓴다.
description_portal: 세종특별자치시 향토문화유적 명칭, 지정 번호, 구분 및 종류, 주소, 지정 일자, 소유 주체, 소유자 명칭, 조성 시대, 관리기관 정보를 제공합니다.
