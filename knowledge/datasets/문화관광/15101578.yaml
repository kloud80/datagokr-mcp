summary_user: 한국관광공사 TourAPI 국문 관광정보 가운데 관광지 콘텐츠별(콘텐츠ID) 반려동물 동반 조건, 동반 가능 동물, 구비 시설, 사고 대비사항과 지역·시군구 코드를 건별로 담으며, API 전체 건수는 9,681건이고 범위는 전국, 단위는 개별 주소·좌표입니다. 반려동물과 함께 여행하려는 사람이나 여행 앱 개발자가 '이 관광지에 반려견을 데려갈 수 있고, 가져가야 할 것은 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 콘텐츠ID와 지역코드처럼 같은 기관(TourAPI) 안의 코드로 공통·소개·지역기반 관광정보와 연결해야 한다.
description_portal: '- 국내관광정보서비스 OpenAPI 신규 상세기능(법정동코드, 신분류코드) 안내 URL(https://api.visitkorea.or.kr/#/cmsNoticeDetail?no=207)- 한국관광공사가 보유하고 있는 전국의 다양한 관광정보와 사진정보를 실시간으로 제공 받을 수 있으며,국내 최대 관광정보 포털 사이트 Visitkorea(www.visitkorea.or.kr) 홈페이지에서 제공하는 관광정보 중 저작권 등에 구애 없이 자유롭게 활용 가능한 정보만을 선별하여 OpenAPI를 통해서 최신정보를 제공하고 있습니다. - 개방 데이터는 지역코드정보, 서비스분류코드정보, 법정동코드정보, 분류체계코드정보, 지역기반관광정보, 위치기반관광정보, 키워드검색, 행사정보, 숙박정보, 공통정보, 소개정보, 반복정보, 이미지정보, 관광정보 동기화 목록정보, 반려동물 동반여행정보 15종 약 26만 건의 국내 관광에 대한 전반적인 정보를 국문으로 제공합니다.- 모바일 앱 뿐만 아니라, 웹서비스, 태블릿, 홍보물, 잡지 등 다양한 매체에서 어플리케이션을 개발, 활용할 수 있으며 다양한 활용을 통해서 신규/융복합 관광서비스를 창출할 수 있습니다. ※ 제공되는 데이터중 사진 자료의 경우, 피사체에 대한 명예훼손 및 인격권 침해 등 일반 정서에 반하는 용도의 사용 및 기업 CI,BI로의 이용 금지하고 있습니다. (공공누리 1유형, 3유형 이미지 제공됨)'
