summary_user: 광주비엔날레가 열리는 시설의 주소·좌표와 해당 연도 비엔날레 프로그램(행사명, 프로그램 내용, 홈페이지, 예매처, 입장료·할인 정보)을 행사 단위 행으로 담은 약 8.7KB 규모의 소용량 CSV 파일이다. 광주비엔날레 관람을 계획하는 시민이나 지역 축제·전시 안내 서비스를 만드는 사업자가 "올해 비엔날레는 어디서 무슨 프로그램을 하고 입장료는 얼마인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 시설명·주소(시도·시군구·법정 읍면동 명칭) 문자열이나 위도·경도 좌표로 다른 문화시설·관광 데이터와 맞춰 이어 쓴다.
limits: 공통 식별 코드가 없어 다른 데이터와는 이름·주소·좌표 매칭으로만 연결되며, 매칭 오류를 따로 확인해야 한다. 명세상 수시·이벤트 주기로 행사 때 만들어진 뒤 바뀌지 않는 성격이라, 다른 회차 비엔날레 정보가 함께 들어 있다고 보면 안 되고 프로그램 연도 필드를 확인해야 한다.
