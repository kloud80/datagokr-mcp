description_portal: '- 전라남도 내 템플스테이를 운영하는 21개 사찰에 대한 정보(시군명, 사찰명, 주소)를 조회하실 수 있는 자료입니다.- 전라남도는 자연과 전통이 어우러진 템플스테이 명소가 풍부하여, 마음의 안식과 힐링을 원하는 분들에게 최적의 여행지입니다. 다양한 사찰에서 명상, 기도, 사찰음식, 전통 예절 체험 등을 통해 일상의 스트레스를 치유하고, 내면의 평화를 찾을 수 있습니다.- 템플스테이 공식 웹사이트 : https://www.templestay.com- 전남 템플스테이 안내 책자 : 전라남도청 또는 각 시군청 관광부서에서 배포하는 안내 책자를 통해 자세한 정보를 확인하실 수 있습니다.'
