summary_user: 전국 공공체육시설의 시설명·업종·시설유형·소유주체와 도로명주소, 좌표, 시설상태(정상운영·폐업)를 시설 한 곳씩 담은 건별 조회 API이다. 시민이나 분석가가 우리 동네 수영장·테니스장 같은 체육시설이 어디에 있고 지금 운영 중인지 확인할 때 쓴다. 도로명시도·시군구·읍면동 주소와 시설도로명주소, 위도 좌표를 키로 다른 주소·지도 데이터와 잇고, 예약·대관 정보와 이을 때는 시설명과 주소로 맞춰 본다.
description_portal: 공공체육시설 상세는 서울올림픽기념 국민체육진흥공단에서 전국체육시설안전을 위해 관리하는 공공체육시설상세정보를 조회하는 기능에 대한 정보 또는 데이터를 제공합니다. 체육시설의 이름, 업종명, 시설유형명, 소유주체시도명, 소유주체시군구명 등의 조회조건을 이용해 원하는 데이터를 조회할 수 있습니다. 공공체육시설의 도로명주소, 좌표경도, 좌표위도, 시설총면적을 확인할 수 있고 체육시설 내의 관람석수용인원수와 관람석좌석수, 홈페이지, 국가체육시설여부와 시설상태(정상운영, 폐업)에 대한 데이터를 제공합니다. 이 서비스는 공공체육시설의 위치, 규모, 운영 상태 등의 상세 정보를 제공하여 체육시설 현황 파악과 정책 수립, 이용자 안내에 효과적으로 활용될 수 있습니다.
