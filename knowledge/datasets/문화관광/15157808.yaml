summary_user: 경상북도 영천시에서 영업 중인 캠핑장을 시설 한 곳당 한 행으로 담은 목록으로, 상호·주소·전화번호를 제공한다. 캠핑객이 영천시 안 캠핑장이 어디에 있고 어디로 연락하면 되는지 찾거나, 분석가가 시군구 단위 야영장 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 야영장 등록·관광 데이터와는 상호명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 등록번호·사업자번호 같은 공통 키가 실측 컬럼에 없어 다른 데이터와 정확히 연결하기 어렵고, 범위가 영천시 한 곳에 한정된다. 필드가 상호·주소·전화번호뿐이라 운영 기간, 요금, 시설 규모는 이 데이터로 알 수 없다.
