summary_user: 빅카인즈 뉴스데이터베이스에서 최저임금 관련 기사를 뽑아 기사 한 건마다 일자·언론사·제목·통합 분류·키워드·특성추출어를 담은 건별 메타데이터 파일(CSV, 약 695KB)이다. 연구자·언론인·시민이 '최저임금 결정 시기마다 어느 언론사가 어떤 키워드로 보도했고 그 경향이 어떻게 바뀌었나'를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자나 언론사 이름을 맞춰 붙여야 한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 최저임금 관련 뉴스 메타정보 분석 자료입니다. 최저임금은 노동자 보호와 근로조건 개선을 위한 핵심 제도로, 매년 결정 과정에서 노사 협상과 사회적 논쟁을 불러일으키는 중요한 정책 이슈입니다. 본 자료는 주요 신문 및 방송 보도에서 최저임금과 관련된 키워드 및 등장 빈도를 추출하여 시기별 변화와 보도 경향을 분석할 수 있도록 구성되어 있습니다. 이를 통해 최저임금 인상 논의가 경제 전반, 기업 경영, 고용 시장, 사회적 형평성 문제와 어떤 연관성을 갖는지 살펴볼 수 있습니다. 또한 정책 연구자, 학계, 언론인, 일반 시민에게 유용한 참고 자료로 활용될 수 있으며, 노동정책 수립 및 사회적 합의 형성 과정에 기초 데이터를 제공한다는 점에서 의미가 큽니다.
