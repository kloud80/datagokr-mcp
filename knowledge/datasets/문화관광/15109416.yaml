summary_user: 경주시 관내 게스트하우스를 업소 한 곳당 한 건으로 담은 목록으로, 실측 필드는 업소명(BSSH_NM)·주소·홈페이지·전화번호이며 범위는 경주시 한 개 시군구입니다. 경주 여행객이나 여행 플랫폼 운영자가 '경주에서 묵을 만한 게스트하우스가 어디에 있고 어떻게 연락하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 지방행정 인허가(LOCALDATA) 숙박업 신고 자료 등과는 업소명·주소를 맞춰 보는 방식으로만 잇는다.
description_portal: 본 오픈API는 경주시 관내에 위치한 게스트하우스의 현황 정보를 제공하며, REST형식으로 구성되어 있다. 각 게스트하우스에 대한 명칭, 주소, 연락처, 객실 수, 숙박 가능 인원, 위치 좌표, 주차 여부 등의 정보가 포함되어 있으며, 방문객의 숙박 선택에 도움이 되도록 설계되었다. 본 데이터는 여행 플랫폼, 관광정보 시스템, 숙박 추천 서비스, 위치기반 안내 앱 등에서 다양하게 활용 가능하다. 특히 가격 대비 효율성을 중시하는 자유여행객이나 단체 이용객에게 유용한 자료로, 게스트하우스 유형별 분류를 통해 사용자 중심의 검색과 비교가 가능하다. 공공데이터포털을 통해 누구나 열람할 수 있으며, 실시간 정보 갱신을 통해 신뢰도 높은 공공서비스를 제공한다.
