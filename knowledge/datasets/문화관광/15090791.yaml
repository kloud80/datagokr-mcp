summary_user: 전라남도 고흥군의 인터넷컴퓨터게임시설제공업(PC방) 인허가 현황을 사업장 한 곳당 한 행으로 담은 파일(csv, 약 11.7KB)로, 사업장명·주소·좌표, 인허가일자·폐업일자·영업상태, 시설면적·총게임기수·제공게임물명 등을 포함한다. 고흥군에서 현재 영업 중인 PC방이 어디에 몇 곳 있고 규모가 어떤지 확인하려는 주민·창업 예정자·지역 분석가가 쓴다. 전역 조인 키는 없어 다른 시군의 같은 업종 데이터와는 개방자치단체코드·관리번호·업종명 기준으로 이어 붙이고, 주소·좌표로 지도나 다른 시설 데이터와 위치를 맞춘다.
limits: 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름·주소 매칭이나 같은 기관 코드로만 연결된다. 범위는 고흥군 한 곳의 개별 사업장으로 한정되어 전남·전국 비교에는 다른 시군 파일을 따로 모아야 한다.
