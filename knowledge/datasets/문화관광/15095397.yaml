summary_user: 울산광역시 북구에 있는 시지정유산을 유산 한 건씩 담은 목록 파일로, 이름·종목·시대·수량·지정일·보유단체·소재지·내용을 담고 이미지 중심의 zip 파일(약 223MB)로 제공된다. 북구 주민이나 답사·교육 기획자가 "북구에 어떤 시지정 기념물·무형유산·자연유산이 있고 언제 지정됐나"를 확인할 때 쓴다. 실측 컬럼에 국가유산청 종목코드·지정번호나 소재지 PNU 같은 전역 조인 키가 없어서, 국가유산청 유산 API 등 다른 데이터와는 유산 이름이나 소재지 문자열을 맞춰 이어 써야 한다.
description_portal: 본 데이터는 북구 관할 및 소재 지역의 시지정유산에 관한 정보를 제공하는 자료이다. 시지정유산은 국가지정유산으로 지정되지 아니한 국가유산 중 보존가치가 있다고 인정되는 것을 광역시장의 조례에 의하여 지정한 국가유산을 의미한다. 본 자료는 이미지 데이터를 중심으로 북구 지역의 다양한 유산을 수록하고 있으며,기념물, 무형유산, 문화유산자료, 유형문화유산, 자연유산의 5개 유형으로 구분된다. 유형문화유산은 건축물, 조각, 공예품 등 유형의 문화유산을 포함하고, 민속문화유산은 생활양식 및 관습에 관련된 유산을 지칭한다. 기념물은 역사적 사건이나 인물과 관련된 기념시설을 포함하며, 무형유산은 전통 기술, 예술, 의식 등을 수록한다. 자연유산 및 자연유산자료는 생태적·학술적 가치를 지닌 자연환경 자원을 기록한다. 본 데이터는 북구 지역의 문화적 정체성 보존과 유산 관리체계 구축에 활용된다.
