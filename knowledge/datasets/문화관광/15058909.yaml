summary_user: 경기도 내 영화 배급업체의 인허가 정보를 사업장 한 곳당 한 행으로 담으며, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·위경도 좌표·시설면적·층수 등을 포함한다. 시군별로 영업 중인 배급업체가 어디에 얼마나 있는지, 최근 폐업한 곳은 어디인지 확인하려는 분석가나 지역 문화산업 정책 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 시군코드(SIGUN_CD)·주소·사업장명 같은 이름·코드 매핑이나 같은 기관(경기도) 데이터의 코드로만 잇는다.
description_portal: 「영화 배급업체 현황」 데이터는 경기도 내 영화 배급업체의 인허가 정보를 제공하는 자료입니다. 주요 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태명(BSN_STATE_NM), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT), 문화체육업종명(CULTUR_PHSTRN_INDUTYPE_NM), 시설면적(FACLT_AR), 소방시설여부(FIREFACLT_YN), 편의시설여부(CONVNCE_FACLT_YN) 등입니다. 이 데이터는 경기도 31개 시군별 배급업체 분포와 운영 상태를 확인할 수 있으며, 영화 배급 시장 분석, 지역별 문화산업 정책 수립, 영화 콘텐츠 유통 구조 연구에 활용될 수 있습니다. 또한 건물 용도, 층수, 주변 환경 등 물리적 인프라 관련 항목도 포함되어 있어 배급업체의 입지 조건을 파악하는 데 도움이 됩니다.
