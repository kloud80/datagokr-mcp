summary_user: 국립민속박물관이 발간한 도서를 건별로 담은 목록으로, 발행기관·저자(책임자)·발행일·분량·등록/수정일·조회수 등을 전국 단위 비공간 자료로 제공한다. 민속 연구자나 교육 자료 담당자가 '국립민속박물관이 어떤 주제의 도서를 언제 얼마나 펴냈는가'를 확인하거나 발간 추이를 살피는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 서지·도서관 데이터와는 제목·발행기관 이름으로 맞춰 이어야 한다.
description_portal: 국립민속박물관에서 발간한 도서에 관한 상세 정보를 제공하는 데이터셋입니다. 발행기관, 책임자, 소속, 발행일 등 다양한 항목을 포함하고 있어 박물관의 출판물 현황을 체계적으로 파악할 수 있습니다. 연구자와 일반 이용자는 이 자료를 활용하여 민속 관련 도서의 발간 추이, 주제별 분포, 기관별 출판 활동 등을 분석할 수 있습니다. 또한 문화유산 연구, 교육 자료 개발, 출판 동향 조사 등 다양한 분야에서 참고 자료로 활용하기에 적합합니다. 도서의 발간 현황을 한눈에 확인하고, 관련 정보를 효율적으로 관리하거나 정책 수립의 기초 자료로도 사용할 수 있습니다.
