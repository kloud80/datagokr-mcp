summary_user: 인천 서구(제목상 서해구)에 등록된 야구장업 업소를 한 행씩 담은 소규모 파일(CSV 약 805바이트)로, 상호·도로명/지번 주소·전화번호·데이터기준일자를 담는다. 서구 주민이 동네에서 이용할 수 있는 야구장이 어디에 있고 어떻게 연락하는지 찾을 때 쓴다. 전역 조인 키는 없어 다른 체육시설 데이터와는 주소나 상호를 맞춰 잇거나 같은 기관의 다른 체육시설업 파일과 나란히 놓고 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 등록된 야구장업 현황을 제공하고 있습니다. 본 데이터는 인천광역시 서구 내 야구장업의 상호, 시설주소(도로명), 시설주소(지번), 전화번호 항목을 제공하고 있습니다. 본 공공데이터를 통하여 인천광역시 서구 주민들은 가까운 야구장을 손쉽게 찾을 수 있어 여가활동 기회를 확대할 수 있으며, 이를 통하여 주민들의 건강 증진, 공동체 형성에도 기여할 수 있을것으로 기대가 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
