description_portal: (설립목적)김천시 체육회는 김천 지역의 학교 및 사회 체육 진흥 통한 시민 체력 향상, 가맹 경기 단체 통합 지원, 엘리트 체육인 육성, 각종 대회 출전 및 개최를 통한 지역의 체육 발전과 주민 통합, 건강한 시민 사회 조성 등에 이바지하기 위해 설립되었다.(자료설명)시민과 스포츠가 공존하는 활기찬 체육도시를 만들기 위해 끊임없이 노력하고 있는 김천시 체육회에 소속되어 있는 종목별 가맹단체에 관련된 데이터로 1. 종목별(정회원, 준회원, 인정단체), 2. 우편번호, 3. 주소, 4. 데이터 기준일 등 김천시체육회 가맹단체를 소개합니다.
