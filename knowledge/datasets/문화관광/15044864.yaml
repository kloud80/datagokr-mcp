summary_user: 광주 광산구에서 활동하는 상설공연단체를 단체 한 곳당 한 행으로 담은 목록으로, 단체명·도로명/지번 주소·위도·경도·데이터기준일자를 개별 단위로 담는다(CSV 약 3.8KB 규모의 소규모 파일). 지역 주민이나 공연 기획자가 '광산구 안에 어떤 상설공연단체가 어디에 있는가'를 확인하거나 지도 서비스에 단체 위치를 표시할 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID 등과 바로 연결되지 않으며, 단체명 매칭이나 좌표·주소 기반 공간 결합으로만 다른 문화시설·공연 데이터와 이어 쓴다.
limits: 공연 일정·관객 수·매출 같은 활동 실적은 담지 않고 단체명과 위치만 있다. 공통 식별 코드가 없어 다른 데이터와 붙이려면 이름·주소 매칭에 의존해야 하며, 명세상 연간 또는 이벤트 시 생성되는 파일이라 수시 변동은 반영되지 않을 수 있다.
