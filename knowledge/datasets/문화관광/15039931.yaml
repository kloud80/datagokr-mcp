description_portal: 본 공공데이터는 인천광역시 서구 내 무형문화재의 현황을 제공하고 있습니다. 본 자료는 인천광역시 서구의 무형문화재의 문화재명, 보유자 성명, 지정일자 등의 정보를 수록하고 있습니다. 무형문화재란 형태 없이 전승되는 전토예술, 기술 등을 포함하는 문화유산입니다. 본 데이터를 통해 전통문화의 보존,계승을 위한 정책 수립, 지역 내 문화자산 관리, 문화교육 및 홍보자료로의 활용이 가능할것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
