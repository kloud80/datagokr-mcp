summary_user: 국립국어원이 모두의 말뭉치로 배포하는 말뭉치마다 이름, 성격(원시·분석·병렬·멀티모달 등), 파일 수, 문서 수 같은 기본 통계를 한 행씩 담은 목록이며, 전국 단위의 비공간 집계표로 9,450바이트짜리 CSV 파일 하나입니다. 연구자나 AI 개발자가 '어떤 종류의 말뭉치가 배포되고 있고 각각 규모가 얼마인가'를 확인할 때 씁니다. 전역 조인 키가 없어 다른 데이터와는 말뭉치 이름으로 맞춰 잇거나 같은 기관(국립국어원) 자료끼리만 연결합니다.
description_portal: 언어정보나눔터 통계 목록은 모두의 말뭉치를 통해 대국민 배포되고 있는 말뭉치의 기본 통계정보를 담고 있습니다. 기본 통계 정보라 함은 말뭉치 개별의 어절수, 문장수, 문단수를 의미합니다.또한 언어정보나눔터 모두의 말뭉치를 통해 배포되고 있는 원시 말뭉치, 분석 말뭉치, 병렬 말뭉치에 대한 통계 정보를 포함하고 있으며, 최근에 추가된 멀티모달 말뭉치의 기본 정보인 멀티 모달 데이터(영상, 이미지, 음성)의 기본 정보도 함께 확인이 가능합니다.또한 말뭉치 구축 사업을 기준으로 말뭉치를 분류하여 확인할 수 있으며 이를 통해 활용 및 연구 트랜드를 확인할 수 있습니다.
