summary_user: 서울특별시 동작구에 등록된 전통사찰의 인허가 정보를 사찰 한 곳당 한 행으로 담은 건별 파일로, 인허가일자·영업상태·주소·승려수·신도수·유래연혁·지정취소 여부와 중부원점 TM 좌표를 포함하며 파일 크기는 약 1KB로 소수 건이다. 동작구 주민이나 연구자가 '동작구에 지정된 전통사찰은 어디이고 현재 지정이 유지되는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 자치구의 전통사찰인허가정보와는 같은 컬럼 구조로 합치고, 다른 데이터와는 사찰명이나 도로명·지번주소로 맞춰 이어 쓴다.
limits: 공통 식별 코드가 없어 다른 데이터와는 이름·주소 매칭으로만 연결되므로 표기 차이에 주의해야 한다. 범위는 동작구 한 곳뿐이며, 좌표는 중부원점 TM(EPSG:2097)이라 위경도로 쓰려면 좌표 변환이 필요하다.
