description_portal: '서울특별시 중구의 관광호텔과 같은 숙박시설 및 음식, 운동, 오락 등 적합한 시설 등을 함께 갖추어 제공하는 업소 정보입니다. 데이터는 각 등록업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 관광진흥 및 호텔 서비스 관련 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 객실 규모 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 외국인을 포함한 관광객과 시민들에게는 시설기준을 충족하며 문화관광 서비스 품질을 유지하는 신뢰할 수 있는 등록업소의 위치와 객실 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
