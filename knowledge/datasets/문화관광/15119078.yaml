summary_user: 전국 공공체육시설 현황을 담은 엑셀(xlsx) 파일로, 포털 설명상 연도별·지역별 시설 개소 수와 소유·관리 주체, 부지·건축·연면적, 좌석 수, 수용 인원, 준공연도, 건설사업비 등 시설 항목을 담는다. 정책 담당자나 분석가가 '우리 시군구의 공공 수영장·체육관이 인구에 비해 부족한가, 노후 시설은 얼마나 되나' 같은 지역별 체육 인프라 분포와 확충 우선순위를 따지는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도·시군구 이름이나 시설명을 맞춰 붙여야 한다.
description_portal: 전국 각지의 공공체육시설 현황 정보를 종합적으로 제공하는 데이터셋입니다. 연도별·지역별 시설 개소 수, 면적, 소유기관, 관리주체, 부지 및 건축 면적, 연면적, 경기장 정보, 좌석 수, 수용 인원, 준공연도, 건설사업비 등 세부 항목을 포함하여 체육시설의 구조적 특성과 분포를 체계적으로 파악할 수 있습니다. 본 자료는 체육시설의 지역별 분포 현황을 분석하고, 공공 체육 인프라 확충과 효율적 관리 전략 수립에 활용될 수 있습니다. 또한 정책 개발, 학술 연구, 행정 기초 자료, 지역별 체육 수요 분석 등 다양한 분야에서 실질적으로 활용 가능한 국가 기반 데이터입니다.* 해당 데이터는 문화체육관광부 누리집에서 공개하고 있습니다.https://www.mcst.go.kr/kor/s_policy/dept/deptView.jsp?pCurrentPage=1&pType=07&pTab=01&pSeq=1692&pDataCD=0417000000&pSearchType=01&pSearchWord=%EA%B3%B5%EA%B3%B5
