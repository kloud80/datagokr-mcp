summary_user: 인천광역시 서해구 관내에 등록된 외국인관광 도시민박업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·상호·지번 및 도로명 소재지·데이터기준일자를 수록한다(약 2KB의 소규모 CSV). 서해구에서 외국인 관광객이 묵을 수 있는 도시민박이 어디에 몇 곳 있는지 확인하거나 외국인 대상 숙박시설의 동네별 분포를 볼 때 쓴다. 전역 조인 키는 없어 상호·주소를 기준으로 공중위생 영업신고(LOCALDATA) 숙박업 인허가 자료나 같은 기관의 다른 숙박·관광 자료와 맞대어 연결한다.
description_portal: 본 공공데이터는 인천광역시 서해구 관내에 등록된 외국인도시민박업소의 현황을 포함하고 있습니다. 본 자료는 인천광역시 서해구 내 외국인도시민박업소의 명칭, 소재지 등의 정보를 수록하고 있습니다. 본 데이터를 통해 관광객의 편의 증진 및 지역 관광산업 활성화를 위한 정책 자료로 활용 가능할 것으로 판단됩니다. 또한 외국인 대상 숙박시설의 분포 현황 분석과 관련 관광홍보 자료 구축에 유용할것으로도 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
