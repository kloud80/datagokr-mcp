summary_user: 대구광역시 수성구에 등록·신고된 민간 체육시설업(헬스·당구·체육도장·골프 등)을 시설 한 곳당 한 행으로 담은 명부 파일로, 업종·상호·지번 및 도로명 주소·전화번호·데이터기준일자를 담는다. 주민이나 상권 분석가가 '수성구 어느 동네에 헬스장·체육도장이 몰려 있나'처럼 업종별 시설 분포와 위치를 확인하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 실측 컬럼에 없어, 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관 자료끼리로만 잇는다.
description_portal: 이 데이터는 대구광역시 수성구 관내 등록된 체육시설업(체육관, 헬스장, 요가원, 수영장 등)의 현황을 정리한 자료로, 시설명, 업체 소재지,  연락처, 등록일자, 운영종목 등의 항목으로 구성된다. 본 자료는 시설별 주요 정보와 위치를 포함하며 주민과 공공기관이 체육 복지 자원 분포, 이용성 분석, 안전 점검 주기 관리, 지원 정책 수립 등에 활용하도록 설계되었다. 특히 수성구는 주민 건강 증진과 생활밀착형 체력 증진을 위해 시설 접근성, 운영 현황, 서비스 이용 패턴 등을 파악할 필요가 있으며, 본 데이터는 생활체육 활성화, 공공 서비스 기획, 행정 민원 대응, 안전 관리 체계 구축의 기초 자료로 유용하다. 데이터는 정기적으로 갱신되며, 행정 부서뿐 아니라 민간 연구기관, 사회복지 및 건강 관련 단체에서도 다양하게 활용 가능하다.
