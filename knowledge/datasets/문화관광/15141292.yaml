summary_user: 서울특별시 금천구의 당구장업 인허가 사업장을 한 곳씩 담은 건별 원천 명부로, 인허가일자·폐업일자·영업상태, 사업장명, 지번·도로명 주소와 좌표, 지도자 수·건물 면적·회원 모집 인원 같은 세부 항목을 포함한다. 금천구에서 지금 영업 중인 당구장이 어디에 몇 곳 있는지, 최근 폐업이 늘었는지를 알고 싶은 창업 예정자나 상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설업 인허가 명부나 상권 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE) 기준으로만 이어 쓴다.
description_portal: 당구장업에 대한 인허가 현황과 사업장 정보를 체계적으로 제공하는 데이터로, 인허가일자, 영업상태, 사업장명, 소재지, 전화번호 등 기본 정보와 함께 문화체육업종 구분, 지도자 수, 회원 모집 현황, 건축물 정보 등 다양한 세부 항목을 포함합니다. 이를 통해 당구장업의 지역별 분포, 영업상태 변화 추이, 시설 규모와 환경 등을 종합적으로 파악할 수 있습니다. 해당 자료는 체육시설 관련 정책 수립, 시장 동향 분석, 신규 사업장 입지 선정, 시설 환경 개선 계획 수립 등 다양한 분야에서 활용 가능하며, 나아가 지역 스포츠 문화 활성화와 생활체육 저변 확대를 위한 전략 마련에도 중요한 기초 자료로 활용될 수 있습니다.
