summary_user: 한국저작권위원회 공유마당에서 공유 중인 무료 폰트를 저작물 한 건씩 담은 목록으로, 저작물일련번호·저작물명·저작자·분류·원문제공·라이선스유형·등록일자를 담은 CSV 파일(약 104KB)이다. 디자이너나 소상공인이 "상업용 인쇄물에 써도 되는 무료 글꼴이 무엇이고 라이선스 조건은 어떤가"를 확인하거나, 공공·민간 안심글꼴 현황을 분류별로 세어 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 저작물명·저작자 이름 매칭으로만 이을 수 있고, 저작물일련번호는 공유마당 내부 식별용으로 보는 것이 맞다.
