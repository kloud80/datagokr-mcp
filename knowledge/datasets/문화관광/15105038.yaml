summary_user: 전국 20개 기관(국립박물관·문화재청·지방자치단체 등)이 소장한 유물을 한 점씩 담은 건별 원천 데이터로, 제목·요약·소속·제작일·시대·장소·물리적 상태·저작권·디지털화 일자 같은 기초 속성을 함께 담는다. 연구자나 교육 콘텐츠 개발자가 특정 시대나 주제의 유물을 어느 기관이 소장하고 있고 이미지 등 디지털 자료를 쓸 수 있는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 소장품 데이터와는 유물명·소장처 이름 매핑이나 같은 기관 기준으로만 연결한다.
description_portal: 국립박물관, 문화재청, 지방자치단체 등 전국 20개 기관이 소장한 유물의 상세 정보를 통합 제공하는 데이터셋입니다. 자원의 요약, 소속, 제작일, 발행일, 언어, 기간, 장소, 물리적 상태 등 기본 항목은 물론, 저작권, 디지털화 자료, 권리 관계까지 포함하여 유물의 기초 속성과 활용 가능성을 폭넓게 파악할 수 있습니다. 본 데이터는 문화재 연구자, 박물관 관계자, 교육자, 개발자 등 다양한 이용자에게 유물 현황 분석, 문화유산 교육 콘텐츠 개발, 디지털 아카이브 구축, 정책 기획 등 실무와 연구 전반에서 유용하게 활용될 수 있으며, 국가 문화유산의 보존·활용 가치 제고에 기여하는 중요한 기초 자료입니다.
