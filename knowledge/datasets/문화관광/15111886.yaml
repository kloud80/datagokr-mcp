description_portal: 부천시 소재 공공도서관의 기본 현황을 정리한 공간정보 데이터셋입니다. 부천시의 16개 시립도서관과 22개 작은도서관 등 공공 도서관 전반에 대해 명칭, 주소, 연락처, 운영 주체 등 기초 속성을 제공하고, 각 도서관의 상세 위치 좌표를 포함한 점(POINT) 레이어로 구축되었습니다. 또한 도서관별 자료 분류 기준, 운영 시간·휴관일, 제공 서비스(대출·반납·문화프로그램) 등 운영 기준 정보를 함께 담아 지도 기반 시각화와 접근성·분포 분석, 서비스 권역 설정, 수요 예측 등 다양한 활용이 가능합니다. 행정업무, 민원 응답, 정책 수립을 위한 기초자료로 유용합니다.
