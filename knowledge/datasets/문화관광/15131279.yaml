summary_user: 경북나드리 축제 메뉴를 기반으로 경상북도 시·군별 축제·행사를 건별로 담은 파일로, 축제명·지역·시작일과 종료일·주최기관·도로명주소·링크를 포함하며 검증 수신 442행, 기간은 2015-09-26부터 2026-05-24까지다. 주말이나 계절에 맞춰 경북 어느 시·군에서 어떤 축제가 열리는지 찾으려는 여행자나 지역 관광 분석가가 쓴다. 도로명주소(address)를 키로 TourAPI 행사 등 다른 관광 데이터와 이어 쓰며, 겹치는 행사를 걸러낸 뒤 남는 행사를 보완하는 용도다.
description_portal: 이 데이터는 경상북도 대표 관광 포털 ‘경북나드리’ 웹사이트 내 [축제(Festival)] 메뉴를 기반으로 수집된 시군별 관광행사 정보를 포함하고 있습니다. 경상북도 내 22개 시·군에서 연중 개최되는 지역 축제와 문화 행사를 정리한 자료로, 축제명, 개최지역(시·군), 일정, 주요 프로그램, 주최기관 등의 기본 정보를 제공합니다. 본 데이터는 지역 고유의 문화유산, 계절별 테마(봄꽃축제, 여름물놀이축제 등), 전통시장 및 특산물 중심의 지역자원 활용형 행사 등으로 구성되어 있으며, 지역 주민과 관광객 모두에게 유익한 여행 계획 수립에 도움이 됩니다. 특히 문화체육관광부 지정 문화관광축제를 비롯한 주요 관광 이벤트가 포함되어 있어, 지역 관광 활성화 정책 수립 및 문화 콘텐츠 분석 자료로도 활용 가능합니다. 해당 데이터는 ‘경북나드리’(https://tour.gb.go.kr/travel/festival.do)를 기준으로 정기 업데이트 예정입니다.
