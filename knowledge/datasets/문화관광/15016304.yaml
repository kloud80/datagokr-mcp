summary_user: 광주광역시(동·서·남·북·광산구)에 있는 국가지정·시지정·등록 문화유산을 한 건씩 담은 목록 파일로, 명칭·종별·지정일자·도로명 소재지 주소를 담는다(약 9KB 규모의 CSV). 광주 시민이나 답사·관광 기획자가 '우리 구에 있는 시지정 기념물이나 보물이 무엇이고 언제 지정됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 자료와는 명칭·종별을 맞춰 연결해야 하며, 다른 위치 데이터와는 도로명주소(소재지도로명주소)를 지오코딩해 잇는다.
description_portal: '국가지정 문화유산, 광주광역시 지정 문화유산(문화유산, 무형유산, 자연유산) 현황에 대한 데이터를 제공합니다. *광주광역시: 광주광역시 동구, 서구, 남구, 북구, 광산구국가지정문화유산(국보,보물,국가민속문화유산,사적,국가무형유산,자연유산(천연기념물,명승))시지정문화유산(유형문화유산,민속문화유산,기념물, 문화유산자료, 시무형유산, 자연유산, 자연유산자료)국가등록문화유산, 시등록유산이 있습니다.광주광역시 문화유산으로는 광양 중흥산성 쌍사자 석등 등 다수의 문화유산이 있습니다.2024년 5월 이후 기존 문화재 명칭이 문화유산으로 변경 되었습니다.'
