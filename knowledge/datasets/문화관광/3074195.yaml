summary_user: 경기도 부천시 관내 게임제공업소(일반게임장·청소년게임장 등)를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명주소를 시군구 범위에서 개별 주소 단위로 제공한다. 주민이나 학부모가 집·학교 주변에 청소년게임장이나 일반게임장이 어디 있는지 확인하거나, 분석가가 부천시 안에서 게임장이 어느 지역에 몰려 있는지 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 도로명주소를 지오코딩하거나 업소명을 대조해서 잇는다.
