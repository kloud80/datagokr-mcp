summary_user: 서울 용산구 관내 출판사를 한 곳당 한 행으로 담은 건별 목록으로, 사업체 명칭과 도로명 소재지를 담는다(CSV 약 98KB, 시군구 범위). 출판 거래처나 협력 출판사를 찾는 사업자, 또는 용산구에 출판사가 어느 동네에 몰려 있는지 알고 싶은 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 사업체명 매칭이나 도로명 주소를 지오코딩해 지도·인근 문화시설 데이터와 겹쳐 보는 식으로만 이어 쓴다.
