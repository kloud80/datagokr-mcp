summary_user: 인천광역시 남동구에 있는 게임제공업소(오락실·인형뽑기방 등)를 업소 한 곳당 한 행으로 담은 파일로, 상호·도로명 소재지·게임기 종류와 대수·업종명·데이터 기준일자가 들어 있다. 남동구에서 창업을 검토하는 사업자나 청소년 보호 업무 담당자가 "어느 동네에 게임장이 몰려 있고 업소마다 게임기를 몇 대 두는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 도로명 주소나 상호를 맞춰 보는 방식으로만 이어 쓴다.
limits: 표준 식별 키나 코드가 없어 다른 지자체 데이터나 인허가 데이터와 자동으로 연결되지 않는다. 주소 문자열을 맞춰 보는 방식에 기대야 한다. 범위는 남동구 한 곳뿐이므로 인천시 전체나 전국 비교에는 다른 시군구 파일을 따로 모아야 한다.
