description_portal: 문화예술을 통한 도시 경관 개선과 지역 문화 정체성 확립 필요성이 증대되고, 주민 참여형 문화사업 확산으로 공동체 활성화 및 문화 향유 기회 확대에 대한 요구가 높아지며, 문화도시 조성과 관광 자원화를 위한 체계적인 공공미술 사업 추진 및 현황 관리 필요성이 증가함에 따라 충청남도 보령시는 관내에서 추진된 공공미술 프로젝트의 사업 개요, 참여 작가 및 주민 현황, 작품 설치 및 전시 일정 등 지역 문화예술 활동과 공간 변화에 대한 종합적인 정보를 제공하고 있습니다.개방 데이터는 공공미술사업의 지자체명, 주관처, 사업유형, 작가팀명, 작가수, 참여주민수, 프로젝트명, 세부사업명, 사업시작시점, 사업종료시점, 사업대상지, 대상지주소, 작품수, 작품설치시작시점, 작품설치종료시점, 전시기간시작시점, 전시기간종료시점, 데이터기준일 등 총 18개 항목 4건의 상세 정보를 포함하고 있습니다.문화예술인·작가는 지역 공공미술 동향 파악 및 참여 기회 모색에 활용하고, 시민·관광객은 공공미술 작품 위치 확인을 통해 문화 관광 및 도시 탐방에 활용하며, 지방자치단체·문화기관은 공공미술 사업 성과 분석 및 문화정책 수립, 도시재생 사업 계획 수립에 활용할 수 있습니다.
