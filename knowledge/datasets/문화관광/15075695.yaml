summary_user: KINTEX에서 열리는 전시·행사를 지원하는 협력업체를 업체 한 곳당 한 행으로 정리한 목록으로, 업체 구분(div_nm)·업체명·웹사이트 주소·사업장 주소를 담는다. 전시 참가자나 행사 주최자·기획사가 "KINTEX 행사에 쓸 부스 디자인·시공 업체는 어디가 있나"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소를 이름 기준으로 맞춰 이어야 한다.
description_portal: 이 데이터는 KINTEX에서 개최되는 각종 전시 및 행사를 지원하는 협력업체들의 정보를 정리한 목록으로, 업체의 구분, 업체명, 웹사이트 주소, 사업장 주소 등의 정보를 포함하고 있습니다. 해당 자료는 전시 참가자, 행사 주최자, 기획사 등이 필요에 따라 적합한 분야의 협력업체를 선택할 수 있도록 도와주는 실무 중심의 자료입니다. 행사 품질 제고, 부스 디자인, 시공, 구조해석, 기타 운영 편의 서비스 등 마이스(MICE) 산업 전반의 행사 운영 인프라를 구성하는 기반 자료로 활용될 수 있으며, 지역 기반 업체 네트워크 분석 및 산업 연계 협업 체계 구축에도 기여할 수 있습니다.
