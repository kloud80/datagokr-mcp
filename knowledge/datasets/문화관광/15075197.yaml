description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 신천리벽화마을은 제주 서귀포시 성산읍 신천리에 위치한 어촌 마을로, 과거 영화 촬영을 계기로 시작된 벽화 작업을 중심으로 ‘해녀, 말, 동백꽃, 만화 캐릭터’ 등을 테마로 한 다채로운 벽화가 마을 골목과 담벼락을 따라 이어져 있으며, 일부 포장 보행로와 주차 공간, 무장애 접근로 등의 접근성 정보가 제공되어 휠체어 사용자, 유모차 동반자, 고령자 등도 비교적 편안히 마을 산책과 경관 감상을 즐길 수 있어 문화예술 체험과 무장애 관광을 동시에 제공하는 열린 관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
