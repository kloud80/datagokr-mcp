description_portal: 1999년 문예연감의 공연예술 관련 정보입니다. 총 21개의 시트로 구성되어 있습니다. 각 시트 항목에는 양악 국내 연주자 국제 콩쿨 입상 및 해외공연, 양악 국내 음악 콩쿨, 양악 주요 내한 외국 연주단 및 솔리스트 현황, 양악 작곡 발표회 일람, 양악 독주회 일람, 양악 실내악 연주회 일람, 양악 독창회 일람, 양악 합창 연주회 일람, 양악 기타 성악 연주회 일람, 양악 오페라 성악 연주회 일람, 양악 기타 연주회 일람, 양악 내한 연주인 및 재외한국인 주요 마스터 클래스, 연극 국내 극단 해외 공연 일람 등의 항목으로 구성되어 있습니다. 따라서 파일에서 1999년 문예연감의 공연예술 관련 정보를 확인할 수 있습니다.
