summary_user: 빅카인즈(BIGKinds)에서 모은 국내 언론사의 러시아 관련 기사를 한 행에 한 기사씩 담은 메타데이터 파일이다(약 225MB CSV). 기사 주소, 보도 일자, 언론사, 제목, 통합분류 1~3단계, 인물·지역·기업기관 개체명, 키워드, 특성추출 값, 본문이 들어 있다. 언론 연구자나 외교·안보 분석가가 '우크라이나 전쟁 전후로 러시아 보도의 키워드와 이슈 비중이 어떻게 달라졌나'를 일자·분류·키워드별로 집계해 보는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 다른 국가별 뉴스 메타데이터와는 일자·언론사·통합분류 이름을 맞추거나 개체명·키워드 문자열로 이어 쓴다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 러시아 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적 분석이 가능합니다.본 자료는 국내 주요 언론사의 러시아 관련 보도를 대상으로, 어떤 이슈가 어느 시기에 집중 보도되었는지, 보도 키워드와 프레임이 어떠했는지 등의 패턴을 밝히는 데 중점을 두고 있습니다. 이러한 분석은 언론이 러시아의 정치·외교·안보·경제 상황과 국제사회와의 관계, 우크라이나 전쟁 등 주요 글로벌 이슈를 어떻게 다루는지, 그리고 이러한 보도가 국내 여론 및 정책 논의에 어떤 영향을 미쳤는지를 추적하는 데 유용합니다.또한 학계, 언론 연구자, 국제정치 전문가, 외교·안보 관련 정책 입안자 등에게 러시아 관련 보도의 경향, 이슈별 프레임 변화, 언론의 국제 이슈 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
