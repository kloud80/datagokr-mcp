summary_user: 경기도 연천군 관내 주요 관광지를 한 곳씩 담은 목록 파일로, 관광지명·도로명주소·지번주소·위도·경도·문의전화를 개별 장소 단위로 수록한다(csv 약 7KB). 연천군을 찾는 여행자나 지역 관광 서비스 운영자가 '연천의 문화유산·지질공원 같은 명소가 어디에 있고 어디로 문의하나'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지명이나 주소·좌표로 맞춰 연결해야 한다.
description_portal: 본 데이터는 경기도 연천군 관내 주요 관광지에 대한 위치 정보, 주소, 위도·경도 좌표, 문의 연락처 등을 수록한 자료이다. 수록된 항목은 도로명주소, 지번주소, GPS 좌표, 기관 전화번호 등으로 구성되어 있으며, 문화유산, 자연지형, 유적지, 지질공원 등 다양한 관광 자원을 포함한다. 연천군을 방문하는 이용자가 목적지 탐색, 경로 설정, 사전 정보 확인 등에 활용할 수 있도록 구성되었으며, 관광 홍보 및 지역 문화유산 보존 자료로도 활용 가능하다. 행정기관 및 민간 서비스 제공자에게도 관광 정보 연계 기반자료로 제공된다. 전체 데이터는 연천군 관할 지역에 국한되며 정기적으로 최신화될 예정이다.
