summary_user: 국립현대미술관 소장품 가운데 저작권 보호기간이 만료된 작품을 작품 한 점당 한 행으로 담은 파일로, 관리번호·대표부문·작가명(국문·영문·한문)·작품명·제작연도·재료/기법·규격·설명문·이미지 항목을 포함하며 2024년 9월 27일 기준으로 현행화되었다. 디자이너나 교육·출판 사업자가 국립현대미술관 소장 작품 중 저작권 걱정 없이 이미지와 설명을 활용할 수 있는 작품이 무엇인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름 매칭이나 같은 기관의 관리번호로만 이어 쓴다.
limits: 전역 조인 키가 없어 공연·문화시설 등 다른 문화 데이터와 코드로 바로 연결되지 않고, 이름 매칭에 의존해야 한다. 포털 설명상 2024년 9월 27일 기준 현행화 자료이므로 이후 저작권이 만료된 작품은 들어 있지 않을 수 있다.
