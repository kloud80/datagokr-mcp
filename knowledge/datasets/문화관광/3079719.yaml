summary_user: 경기도 안양시에 등록된 비디오물감상실업소를 업소 한 곳당 한 행으로 담은 소규모 파일(csv 423바이트)로, 업종명·상호·우편번호·도로명 영업소소재지·데이터기준일이 들어 있다. 안양시에서 비디오물감상실이 어디에 몇 곳 영업 중인지 확인하려는 시민·사업자나, 시내 영상물 관련 업소 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명 주소로 맞추거나 같은 안양시 데이터끼리만 연결한다.
