summary_user: 전국 국민체력100 체력인증센터별로 측정 연월(test_ym)마다의 체력측정건수와 센터명·주소를 담은 센터·월 단위 집계 데이터이며, 위치는 개별 주소 수준으로 제공된다. 지역 생활체육 담당자나 분석가가 "우리 시군구 체력인증센터는 월별로 몇 건을 측정하고, 어느 지역에 센터가 부족한가"를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설·인구 데이터와는 센터명이나 주소 문자열을 매핑해 이어야 한다.
description_portal: 국민체력100 체력인증센터 측정건수는 서울올림픽기념국민체육진흥공단에서 운영하고 있는 국민체력100 체력인증센터에 관한 데이터를 담은 자료입니다. 현재 운영중인 전국 체력인증센터별 체력측정건수 및 위치정보를 조회할 수 있습니다.체력측정을 진행했던 연월, 체력인증센터명, 센터의 기본주소 등 조회조건을 이용하여 체력측정건수 및 체력인증센터의 위치정보에 대한 원하는 정보를 검색할 수 있습니다. 요약하면 체력인증센터의 데이터를 조회할 수 있는 API서비스입니다. 이 서비스는 전국 체력인증센터의 측정건수와 위치 정보를 제공하여 지역별 이용 현황 분석 및 체력인증 인프라 개선에 활용될 수 있습니다.
