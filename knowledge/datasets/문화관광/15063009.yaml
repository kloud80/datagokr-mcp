summary_user: 전북특별자치도의 전통 소리 공연을 공연 한 건씩 제목·요약·공연자·공연 종류(국악실내악, 전통무용, 창극 등)·악기·공연 장소와 일자·상세 설명·가사로 기록한 아카이브 파일(CSV 약 19.9MB)이다. 국악 연구자나 학생이 '전북에서 어떤 창극·판소리 공연이 어떤 악기 편성으로 언제 어디서 열렸나'를 찾아보거나 전통 공연 콘텐츠를 구성할 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 바로 연결되지 않으며, 공연명·공연장소 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: KOPIS 공연ID나 공연장ID 같은 공통 키가 없어 다른 공연·시설 데이터와는 이름 매칭에 의존해야 한다. 명세상 수시·이벤트성 생성 후 바뀌지 않는 자료로 표시돼 있어 현재 진행 중인 공연 일정이나 예매 정보로 쓰기 어렵다.
