summary_user: 전국 자치단체가 관리하는 온라인음악서비스제공업(정보통신망으로 음악·음악영상 파일을 제공하는 업소) 인허가 정보를 업소 한 건 단위로 담으며, 인허가일자·영업상태·폐업·휴업일자, 사업장명, 주소와 좌표가 들어 있다. 사업자나 분석가가 특정 지역에서 영업 중이거나 폐업한 온라인음악서비스 업체가 어디이고 언제 인허가를 받았는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 개방자치단체코드(OPN_ATMY_GRP_CD)나 주소·사업장명으로 다른 지방행정 인허가 데이터와 맞춰 쓴다.
description_portal: '문화_온라인음악서비스제공업 데이터는 정보통신망을 이용하여 음악파일 또는 음악영상파일을 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 온라인음악서비스제공업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 대중문화산업과 / 044-203-3293 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
