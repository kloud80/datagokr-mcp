summary_user: JDC가 2012~2014년 제주첨단과학기술단지 JDC 엘리트 빌딩에서 연 지구촌 축제를 행사 건별로 담은 2,375바이트 분량의 작은 CSV 파일로, 일시·장소·참여대상·축제구분(다문화 영화관, 지구마을, 나눔 마당 등)과 최대 6개의 세부 프로그램 내용을 기록한다. 제주 지역 다문화 행사를 기획하는 담당자나 연구자가 '과거 JDC 지구촌 축제는 누구를 대상으로 어떤 프로그램을 구성했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 공연·행사 데이터와는 행사명이나 날짜를 직접 맞추거나 같은 기관 데이터끼리만 이어 쓴다.
limits: 2012~2014년에 끝난 행사의 기록으로 한 번 만들어진 뒤 바뀌지 않는 데이터라 현재나 향후 축제 일정은 알 수 없다. KOPIS 공연 ID나 문화시설 코드 같은 공통 키가 없어 다른 문화행사 데이터와 자동으로 연결되지 않는다.
