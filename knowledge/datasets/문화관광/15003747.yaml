description_portal: 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 2012년부터 2014년까지 진행한 지구촌 축제 정보입니다. 이 데이터는 축제의 일시, 장소, 참여 대상, 축제 구분, 그리고 최대 6개의 축제 내용을 상세히 기록하고 있습니다. 모든 축제 장소는 제주첨단과학기술단지 내 JDC 엘리트 빌딩으로 통일되어 있으며, 축제 구분 항목에는 다문화 영화관, 지구마을, 나눔 마당 등 다양한 프로그램 이름이 포함되어 있습니다. 축제내용 1부터 축제내용 6까지는 각 축제에서 진행된 세부 행사나 프로그램 내용을 구체적으로 나타내고 있어, 축제의 다채로운 구성과 참여자들에게 제공된 다양한 체험 활동을 확인할 수 있습니다. 이 데이터는 제주지역 내 다문화와 지역사회 통합을 위한 문화 행사 운영 현황을 파악하고, 향후 행사 기획 및 지역 문화 활성화 정책 수립에 중요한 참고자료로 활용될 수 있습니다.
