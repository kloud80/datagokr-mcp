summary_user: 영상물등급위원회가 등급분류한 영화의 처리 건수를 연도·월별, 그리고 극영화·다큐멘터리·단편영화·애니메이션 같은 영화 분류별로 집계한 전국 단위 통계 파일(xlsx)이다. 영화 산업 분석가나 연구자가 '한 해 동안 등급분류를 받은 영화가 몇 편이며 어느 달, 어느 장르(분류)에 많았는가'를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도·월이나 영화 분류 이름을 맞춰 붙이는 방식으로만 이어 쓸 수 있다.
description_portal: 영상물등급위원회는「영화 및 비디오물의 진흥에 관한 법률」제71조에 따라 ‘영상물의 공공성과 윤리성을 확보하고 청소년을 보호’하기 위해 설립되었으며동법 제72조의 영상물등의 등급분류 및 내용정보, 청소년 유해성 확인 심의 등의 직무를 수행하는 문화체육관광부 산하 공공기관입니다.해당 데이터는 영상물등급위원회에서 등급분류한 영화의 등급분류 건수 통계 데이터로 연간 월별 영화 등급분류 처리 건수 통계와 영화 분류별(극영화, 다큐멘터리, 단편영화, 애니메이션 등) 등급분류 처리 건수 통계 데이터입니다.
