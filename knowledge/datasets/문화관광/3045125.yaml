summary_user: 부평구 관내에 「체육시설의 설치·이용에 관한 법률」에 따라 신고된 민간 체육시설업소를 업소 한 곳당 한 행으로 담은 명부 파일로, 업종(체력단련장·무도장·무도학원·체육도장 등), 상호, 도로명 주소, 전화번호를 담는다. 부평구에서 헬스장이나 체육도장을 열려는 사업자가 "우리 동네에 같은 업종 업소가 몇 곳이고 어디에 몰려 있나"를 확인하거나, 분석가가 업종별 체육시설 분포를 보는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 도로명 주소나 상호를 맞춰 붙이는 방식으로만 이어 쓰며, 상권·인허가(LOCALDATA) 체육시설업 자료와 같은 축으로 비교한다.
description_portal: (체육시설업 현황) 부평구 관내 등록된 체육시설업소의 기본 정보를 수록한 데이터「체육시설의 설치·이용에 관한 법률」에 따라 신고된 시설 기준*업소별 컬럼 상세설명○ 업종 → 체력단련장, 무도장, 무도학원, 체육도장 등 신고된 체육시설의 업종 유형○ 상호 → 각 체육시설이 등록한 공식 상호명○ 시설주소(도로명) → 체육시설이 위치한 도로명 기준 주소○ 시설전화번호 → 이용객 문의 및 시설 정보 확인이 가능한 전화번호※ 본 데이터는 지역 내 체육시설 분포, 업종별 현황 분석, 생활체육 인프라 조성 및 위생·안전관리 대상 파악 등을 위한 기초자료로 활용될 수 있음
