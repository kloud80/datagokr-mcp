description_portal: 서울시립교향악단 공연(영문) 정보 데이터는 해외 관객 및 영어 사용자를 위해 제공되는 공연 정보를 체계적으로 정리한 자료입니다. 공연일련번호는 각 공연을 식별하기 위한 고유 번호입니다. 공연구분1·2·3은 공연의 성격과 카테고리를 다층적으로 분류하여 프로그램 특성을 명확히 보여줍니다. 공연명과 공연장소는 영어로 제공되어 국제 관객의 접근성을 높입니다. 공연일시는 실제 공연이 열리는 시간을 나타내며, 티켓가격 정보는 예매 시 필요한 기본 안내입니다. 곡목과 프로그램 소개는 공연의 구성 및 예술적 내용을 이해하는 데 도움을 줍니다. 공연이미지 URL은 시각적 정보를 제공하여 공연의 분위기를 전달합니다. 유료회원·무료회원 예매시작일은 예매 일정 안내에 활용됩니다. 아티스트 사전은 공연 참여 예술가 정보를 담고 있으며, 등록일시는 데이터가 시스템에 입력된 시점을 나타냅니다. 이 자료는 국제 대상 홍보와 공연 접근성 향상에 중요한 역할을 합니다.
