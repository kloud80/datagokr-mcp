summary_user: 서울특별시 서초구의 일반게임제공업(성인 대상 아케이드 등 오락게임기 업소) 인허가 대장을 사업장 한 곳당 한 행으로 담으며, 인허가·취소·휴폐업 일자, 영업상태와 상세영업상태, 소재지 지번·도로명 주소와 좌표, 시설면적·층수·비상구 등 시설 정보를 포함한다. 구청 담당자나 분석가가 "서초구에서 현재 영업 중인 성인 게임장은 어디에 있고, 학교·주거지와 얼마나 가까운가" 같은 질문에 쓰고, 창업 예정자는 주변 동종 업소의 분포와 폐업 흐름을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·사업장명 매칭이나 좌표 기반 공간 결합으로 이어 써야 하며, 같은 기관 코드(OPNSFTEAMCODE)로 서초구의 다른 인허가 데이터와 묶을 수 있다.
description_portal: 일반게임제공업 인허가 정보는 서울특별시 서초구에서 성인 대상 오락게임기(아케이드 등)를 설치·운영하는 사업장의 인허가 일자, 영업상태명, 기기수, 시설면적, 지번주소 및 좌표정보 등을 기록한 행정자료이다. 일반게임제공업은 기계·기구 수량과 안전·위생 기준 준수가 요구되므로, 시설규모·게임기수·부대시설 정보는 운영 건전성 평가에 중요한 역할을 한다. 영업상태 및 상세영업상태 이력은 행정처분 여부, 휴·폐업 흐름, 위생·안전 점검 대상 선정을 위한 기초자료로 쓰인다. 좌표 기반 위치 정보는 업소 분포를 시각화하여 학교·주거지역과의 거리, 상업지역 밀집도 등을 분석하게 해주며, 유해환경 관리 정책과 연계한 고위험 지역 식별에도 활용된다. 해당 자료는 성인 오락시설의 건전성 관리, 공중위생·소방 점검, 도시환경 관리 정책에 모두 중요한 기반이 된다.
