summary_user: 경상북도교육청 영주선비도서관에서 대출이 많았던 도서를 순위별로 담은 집계 목록으로, 도서마다 서명·저자·출판사·출판년·청구기호·소장 자료실과 대출횟수가 들어 있다(받은 파일은 약 6KB 규모의 CSV). 영주 지역 도서관 이용자나 사서가 '이 도서관에서 요즘 가장 많이 빌려 간 책은 무엇인가'를 확인하고 장서 구입·독서 프로그램 기획에 참고하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서관 인기 도서나 도서관정보나루 자료와는 서명·저자 문자열 매칭으로만 이어 쓴다.
limits: ISBN이 없고 등록번호(도서관 내부 번호)만 있어 국가서지나 다른 도서관 대출 데이터와 정확히 연결하기 어렵다. 한 도서관의 상위 대출 목록이라 지역 전체 독서 경향이나 전체 대출 규모를 대표하지 않는다.
