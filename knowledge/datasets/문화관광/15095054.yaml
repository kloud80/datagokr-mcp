summary_user: 충청남도 안 작은도서관을 한 곳씩 담은 건별 목록 파일로, 지역·도서관 이름·소재지 주소·운영주체·면적(제곱미터)을 담는다. 주민이 우리 시군에 어떤 작은도서관이 있고 누가 운영하는지 찾거나, 분석가가 시군별 작은도서관 분포와 공공·민간 운영 비중, 면적 규모를 비교하는 데 쓴다. 도서관코드 같은 전역 조인 키가 없어서, 도서관정보나루 등 다른 도서관 데이터와는 도서관 이름이나 소재지 주소를 맞춰서 이어 써야 한다.
limits: 도서관코드·시설코드 같은 공통 키가 없어 대출·장서·인기도서 데이터와 바로 결합하지 못하고, 이름·주소 매칭에 기대야 한다. 범위는 충청남도 한 곳뿐이라 다른 시도와 비교하려면 별도 자료가 필요하다.
