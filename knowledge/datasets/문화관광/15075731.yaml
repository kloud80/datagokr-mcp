summary_user: 김대중컨벤션센터 전시장에서 열린 전시회·박람회·공연·채용행사 등을 행사 한 건씩 담은 파일로, 행사명·장소·주최/주관 기관·시작일과 종료일을 기록한다. 지역 행사 기획자나 분석가가 연도별로 어떤 행사가 언제 얼마 동안 전시장을 썼는지 확인해 공간 활용도와 행사 구성 추이를 파악하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어 다른 데이터와는 행사명·주최기관 이름 대조나 날짜 기준으로만 이어 쓴다.
description_portal: 본 데이터는 광주광역시관광공사에서 관리하는 김대중컨벤션센터의 연도별 전시장 이용현황을 수록한 자료이다. 다양한 주최·주관 기관의 전시회, 박람회, 공연, 채용행사 등 다채로운 행사가 포함되어 있으며, 행사명, 행사 장소, 주최 및 주관 기관, 행사 시작일과 종료일 등 세부 정보가 기록되어 있다. 이를 통해 전시장 운영 실태와 행사 구성 현황을 체계적으로 파악할 수 있으며, 공간 활용도 분석과 향후 운영 계획 수립에 기초자료로 활용된다. 또한 행사별 이용 추이를 분석하여 방문객 서비스 개선에 기여한다. 자료는 정기적으로 갱신되어 최신 현황을 반영하며, 관련 부서와 이용자에게 신뢰성 있는 정보를 제공한다.
