summary_user: 한국문화예술위원회 문학광장에 등록된 작품을 한 건씩 담은 원천 목록으로, 최초등록일시·작가명·추가작가명·작품 제목·소개 페이지 링크를 담으며 전국 범위·비공간 자료다(CSV 약 86KB). 독자나 문학 분야 분석가가 특정 작가의 작품이 문학광장에 언제 어떤 제목으로 소개됐는지, 시기별로 어떤 작품이 올라왔는지 확인하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 작가명·작품 제목을 이름으로 맞춰 잇고, 상세 내용은 대표사이트링크로 따라간다.
description_portal: 한국문화예술위원회가 운영하는 문학광장에서 제공하는 작가 및 작품 정보를 정리한 자료입니다. 주요 항목으로는 최초등록일, 작가명, 추가작가명, 제목, 대표사이트링크가 포함되어 있습니다. 최초등록일은 해당 작가와 작품이 문학광장에 처음 등록된 날짜를 보여주며, 이를 통해 시기별 작품 공개 현황을 확인할 수 있습니다. 제목 항목은 ‘봄날’, ‘일각고래의 뿔’, ‘화성의 아이’, ‘북극의 여인들’ 등 작품명을 나타내며, 대표사이트링크는 해당 작품이나 작가에 대한 소개 페이지로 연결됩니다. 이 데이터는 특정 작가의 작품 등록 현황을 확인하는 등 문학광장이 강조하는 콘텐츠를 파악하는 데 활용할 수 있습니다. 또한 등록일과 작품명을 결합하여 시기별로 어떤 작품이 소개되었는지 비교할 수 있으며, 대표사이트링크를 통해 추가 정보를 탐색하는 데 유용합니다.('추가작가명' 컬럼의 경우, 메인저자가 아닌 작가가 기록되어 있는 경우에만 값이 채워짐. 따라서 해당 컬럼 내 빈 값이 존재할 수 있음.)
