description_portal: 경상남도 창원시에서 시행한 공공미술 프로젝트의 순번, 작품명 및 작품 전시장소 등을 공공데이터포털에 개방합니다.공원, 광장, 도서관, 도시 공간 등을 중심으로 설치된 공공미술 작품의 위치, 작가, 설치 시기, 재료 및 작품 유형을 정리한 자료입니다. 이 데이터는 작품의 분포 및 테마 분석, 도시 경관 개선 계획, 문화·예술 정책 수립, 지역 커뮤니티 활성화, 민원 및 문화 관련 안내 등에 활용될 수 있습니다.설치 작품 수가 많아 엑셀 등 일반 뷰어에서 일부만 확인될 수 있으므로, R, Python, GIS 등의 분석 전용 도구를 활용한 시공간 시각화 및 통계 분석을 권장합니다.작품 분류 기준(조각, 벽화, 설치미술 등), 설치 연도, 작가 정보, 관리기관, 보존 상태 등 세부 기준은 제공기관의 메타데이터 또는 기술문서를 참고해 주세요.
