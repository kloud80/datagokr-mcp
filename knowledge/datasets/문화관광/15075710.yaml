description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 토끼섬과 하도포구는 제주 제주시 구좌읍 하도리에 위치한 해안 산책 및 역사·자연 체험 공간으로, 국내 유일의 ‘문주란’ 자생지인 토끼섬과, 과거 외침을 막기 위해 쌓았던 해안 석축 방어시설인 별방진, 그리고 포구(하도포구)와 해안도로가 연결된 산책로가 포함돼 있다. 해안로와 포구 접근로는 포장 또는 평탄 산책로로 보행약자와 휠체어 사용자를 포함한 누구나 이용 가능하도록 무장애 편의시설이 제공되며, 바다전망, 해양문화 및 생태자원 관찰, 역사유산 탐방, 해변 산책과 여유를 함께 누릴 수 있는 열린 관광지다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
