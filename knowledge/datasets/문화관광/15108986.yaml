summary_user: 전북특별자치도 내 문화유산을 유산 1건당 1행으로 담은 목록 파일로, 명칭(한글·한자)·종목·지정구분·지정번호·지정일·지정사유와 소재지·관리단체·기초지자체, 재질·제작연대·연혁·의의 같은 설명 항목을 함께 싣는다. 연구자나 문화관광 기획자가 '전북의 어느 시군에 어떤 지정 유산이 있고 언제, 왜 지정됐는가'를 확인하거나 지역 유산 분포를 정리할 때 쓴다. 전역 조인 키가 없어 국가유산청 자료 등 다른 데이터와는 유산 명칭·종목·지정번호를 맞춰 보거나 기초지자체 이름으로 연결해야 한다.
description_portal: 이 데이터는 전북특별자치도가 지정하고 관리하는 핵심 문화유산의 현황을 종합적으로 보여주는 공식 목록입니다. 건축물, 공예품 등 형태가 있는 유형문화재'와 판소리, 공예기술 등 형태가 없는 '무형문화재'로 나누어 각 자산의 정보를 상세히 제공합니다. 특히, 무형문화재가 단절되지 않고 다음 세대로 이어질 수 있도록 헌신하는 '전승단체'와 '전승자(보유자)'의 목록을 별도로 포함하여, 지역의 살아있는 문화 전통을 보존하고 계승하는 인적 자원의 현황까지 파악할 수 있도록 구성된 점이 특징입니다. 이 자료는 지역의 문화적 정체성을 구성하는 유산의 분포와 현황을 연구하고, 관련 보존 정책 및 문화 관광 콘텐츠를 개발하는 데 필수적인 기초 데이터입니다.
