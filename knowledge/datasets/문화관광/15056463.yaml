summary_user: 광주광역시에 등록 신고된 인쇄사를 업체 한 곳당 한 행으로 담은 파일로, 상호·주소·등록구분·영업구분과 데이터기준일자가 들어 있으며 포털 설명상 2022년 6월 21일 기준이다. 사업자나 분석가가 광주 지역 구별로 영업 중인 인쇄사가 어디에 몇 곳 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소를 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 사업자등록번호 같은 공통 식별 키가 없어 다른 데이터셋과 정확히 연결하기 어렵다. 포털 설명상 특정 기준일 시점의 현황이라 실시간 영업 여부는 문화체육관광부 출판사/인쇄사 검색 시스템에서 따로 확인해야 한다.
