summary_user: 광주광역시 남구 관내 미술관(포털 설명상 6개소)의 명칭·소재지·관람료·운영요일·운영 시작/종료시간·전화번호를 시설 1곳당 1행으로 담은 작은 CSV 파일(848바이트)이다. 주민이나 관광객이 '남구에서 오늘 문 연 무료 미술관이 어디인가'를 확인하거나, 분석가가 구 단위 문화시설 분포를 살필 때 쓴다. 전역 조인 키나 시설코드가 없어 다른 데이터와는 미술관명·주소 문자열 매칭으로만 잇고, 최신 정보는 전국박물관미술관정보표준데이터에서 '광주광역시 남구'로 찾아 대조한다.
description_portal: 광주광역시 남구 관내 미술관 6개소에 대한 현황 및 정보(명칭, 소재지, 관람료, 운영요일, 운영시간  등)를 제공합니다. 해당 데이터는 광주광역시 남구청 문화관광과(☎062-607-2315)에서 제공합니다. "갤러리 고철"의 경우, 전화번호에 개인정보가 포함되어 미기재하였음을 알려드리며, 현재 해당 데이터는 전국박물관미술관정보표준데이터(https://www.data.go.kr/data/15017323/standard.do)에서 통합 관리되고 있으며, 최신 정보는 위 링크 접속 후, 기관명에 "광주광역시 남구"를 검색하여 조회 가능합니다. ※ 미술관은 회화, 조각, 설치미술, 사진, 공예 등 다양한 시각예술 작품을 수집·보존·전시하는 문화 시설입니다. 상설전과 기획전을 통해 예술가의 창작물을 소개하며, 교육 프로그램과 강연, 체험 활동을 운영해 관람객의 예술 이해를 높입니다. 미술관은 지역 예술 활성화와 국제 교류의 장으로 기능하며, 작품 보존과 연구를 통해 문화유산으로서의 가치를 지킵니다. 또한 시민과 관광객이 예술을 향유하고 창의적 영감을 얻을 수 있는 중요한 문화 인프라 역할을 합니다.
