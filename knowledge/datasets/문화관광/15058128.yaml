summary_user: 경기도 안 공공 사격장을 시설 한 곳당 한 행으로 담은 현황 데이터로, 시군·소유기관·운영조직, 부지·건축·연면적, 거리별 사대 수와 클레이 사격장 면 수, 준공연도·건설사업비, 주소와 위경도를 포함한다. 사격 동호인이 우리 시군에서 가까운 공공 사격장과 클레이 사격 가능 여부를 찾거나, 분석가가 시군별 사격 인프라 분포와 운영 주체를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 시군명으로 같은 경기도 체육시설 현황과 묶고, 위경도로 지도·반경 분석에 붙인다.
description_portal: 경기도내 체육시설중 사격장 현황입니다. 사격장명, 소재지주소, 운영조직명, 사로유형 및 길이 정보등을 제공합니다.이 데이터는 전국 공공체육시설 중 사격장에 대한 현황을 담고 있으며, 각 사격장의 시설명, 시군명, 소유기관명, 관리주체명, 운영조직명 등을 포함하여 사격장의 물리적 규모(부지면적, 건축면적, 연면적), 시설 구성(RT10m사대수, 클레이트랩면수, 클레이스키트면수, 클레이아메리칸트랩면수), 준공연도, 건설사업비 등의 정보가 포함되어 있습니다. 또한, 소재지에 대한 지번주소, 도로명주소, 우편번호와 함께 위도(WGS84위도), 경도(WGS84경도) 정보를 제공하여 공간분석에 활용할 수 있습니다.본 데이터는 공공 체육 인프라의 분포와 운영 주체 파악, 지역별 체육 자원 현황 분석, 시설 투자 계획 수립 등 정책 결정과 연구에 유용하게 활용될 수 있습니다.
