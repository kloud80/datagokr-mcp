summary_user: 경기도 광주시에 있는 문화재를 한 건씩 담은 파일(약 8.6KB CSV)로, 문화재명·소재지·시대·지정 종별과 종류·지정년도·보호구역 면적과 함께 경도·위도 좌표를 담는다. 광주시 안에서 어떤 국가·도·시지정 문화재가 어디에 있고 보호구역이 얼마나 되는지 확인하려는 주민·개발사업자·분석가가 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록 등 다른 데이터와는 문화재명·소재지 이름 매칭이나 좌표로 이어 쓴다.
description_portal: 본 데이터는 경기도 광주시에 위치한 문화재의 상세 정보를 제공합니다. 지역의 역사적·문화적 가치가 있는 문화재의 위치와 지정 현황 정보를 담고 있어 문화유산 보호 관리에 활용됩니다. 문화재관리번호는 각 문화재를 식별하며, 문화재명과 소재지는 문화재의 명칭과 위치를 나타냅니다. 문화재 시대는 유물의 시대 구분을 표시하고, 문화재 종별과 종류는 국가지정, 도지정, 시지정 등 지정 등급과 유형을 나타냅니다. 지정년도는 문화재 지정 시기를 표시하며, 보호구역 면적과 문화재 보전지역은 보호 범위를 제공합니다. 경도와 위도는 정확한 위치 좌표를 나타냅니다.
