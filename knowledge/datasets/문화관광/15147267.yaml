summary_user: 서울 동대문구에 신고된 수영장업 사업장을 한 곳씩 담은 인허가 명부로, 상호·지번/도로명 주소·인허가일·폐업일·영업상태·좌표·건물 면적 등을 사업장 단위로 담는다. 동대문구에서 지금 영업 중인 수영장이 어디이고 최근 어떤 곳이 폐업했는지 확인하려는 주민·사업자, 생활체육 시설 분포를 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하고, 좌표(X, Y)로 상권·체육시설 데이터와 위치 기준으로 겹쳐 본다.
description_portal: '▶ 동대문구 수영장업 정보를 제공합니다.(상호명, 도로명주소, 지번주소, 영업여부 등)▶ 수영장업은 「체육시설의 설치·이용에 관한 법률」에서 규정된 체육시설업의 한 종류로, 수영을 목적으로 한 인공 시설(풀, 수조 등)을 설치·운영하여 일반인에게 이용하게 하는 업을 말합니다.▶ 수영장업 주요 내용- 운영 목적 : 수영 운동 및 레저 활동을 통해 체력 증진, 건강 유지, 여가 활용 지원- 시설 요건 : 수영장, 샤워실, 탈의실, 휴게 공간 등 부대시설 구비- 안전 관리 : 응급처치 장비 비치, 수질 관리 의무- 사회적 기능 : 유아부터 성인까지 다양한 연령층의 수영 교육, 생활체육 활성화, 지역 주민 건강 증진▶ 수영장업은 신고체육시설업에 해당하므로, 사업자는 관할 구청에 체육시설업 신고를 해야 합니다.▶사업자가 제출해야 할 서류에는 체육시설업 신고서, 임대차계약서, 지도자 자격증, 시설 평면도 등이 있습니다.'
