description_portal: 전북특별자치도 남원에 위치한 호국성지 만인의총(萬人義塚)에 소장된 유물의 종류별 수량 현황 데이터입니다. 이 자료는 정유재란 당시 남원성 전투의 역사를 증언하는 다양한 유물들의 목록을 담고 있으며, 교지, 문집과 같은 고문서부터 전투에 사용된 화살, 총통 등 무기류까지 포함하고 있습니다. 이 데이터는 역사학자나 연구자들이 정유재란과 의병 활동을 연구하는 데 귀중한 1차 사료가 되며, 박물관이나 전시관에서는 전시 기획 및 소장품 관리를 위한 기초 자료로 활용할 수 있습니다. 또한, 학생과 일반 대중에게는 남원성 전투의 치열했던 역사와 순국선열들의 숭고한 희생을 되새기는 교육적 가치를 지닙니다.
