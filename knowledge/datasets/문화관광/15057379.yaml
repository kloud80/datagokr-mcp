summary_user: 경기도 내에서 인허가된 게임물 배급업체를 사업장 한 곳당 한 행으로 담은 건별 현황으로, 인허가·취소·폐업 일자, 영업상태, 도로명·지번 주소와 WGS84 좌표, 시설면적·층수·건물 용도 같은 시설 정보를 포함한다. 게임산업 담당 공무원이나 분석가가 '경기도 시군별로 영업 중인 게임물 배급업체가 어디에 몇 곳 있는가'를 파악하거나 지도 점검 대상을 추릴 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 같은 경기도 인허가 데이터나 행정구역 자료와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 인허가된 게임물 배급업체의 현황을 수록한 자료로, 게임물을 수입(원판수입 포함)하거나 저작권을 소유·관리하면서 게임제공업체 등에 공급하는 업체 정보를 제공합니다. 주요 항목은 사업장명, 인허가일자 및 취소일자, 영업상태와 폐업일자, 소재지 주소와 전화번호, 건물 용도 및 층수, 시설면적, 통로너비, 조명·소방·환기·방음시설 등 안전 설비 여부, 제공 게임물명, 제작 취급 품목, 업태구분명, 문화체육업종명 등이 포함됩니다. 이를 활용하여 지역별 게임물 유통업체 분포, 업계 영업 현황, 공급망 특성, 시설 안전기준 준수 여부를 분석할 수 있으며, 문화산업 정책, 게임산업 육성 전략, 공공안전 관리 및 지도 점검 자료로도 유용합니다. 데이터는 Open API 방식으로 XML·JSON 형태 제공이 가능하며, 시군명 및 시군코드 조건으로 특정 지역 데이터를 조회할 수 있습니다.
