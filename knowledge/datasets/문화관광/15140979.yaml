summary_user: 서울특별시 마포구에서 게임물을 수입하거나 저작권을 관리하며 게임제공업자 등에 공급하는 게임물배급업소의 인허가 정보를 업소 한 곳당 한 행으로 담는다. 인허가일자·영업상태·폐업일자·주소·좌표·시설면적·제작취급품목 등이 들어 있어, 사업자나 분석가가 "마포구에 지금 영업 중인 게임물배급업체는 어디이고 언제 등록·폐업했나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드로만 이어 쓴다.
description_portal: 서울특별시 마포구의 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 업소정보에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 소재지우편번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명, 문화사업자구분명, 제작취급품목내용, 시설면적 등이 포함되어 있습니다. 이 데이터를 통해 시민과 산업 관계자는 등록된 게임물배급업체 현황을 확인하고, 합법적인 게임물 유통 경로를 파악할 수 있습니다.
