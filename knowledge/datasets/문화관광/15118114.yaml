summary_user: 전남광주통합특별시 도립도서관이 소장한 도서를 한 권(등록번호)씩 담은 건별 소장 목록으로, 청구기호·자료실·서명·저자·발행자·출판연도·편권차·면장수·자료상태·복본기호를 포함하며 약 67MB 규모의 CSV 파일로 제공된다. 도서관 이용자나 분석가가 "도립도서관에 이 책이 있는지, 어느 자료실에 어떤 청구기호로 꽂혀 있고 지금 대출 가능한 상태인지"를 확인하거나 장서 구성을 분석하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 도서관정보나루 등 다른 도서 데이터와는 서명·저자 같은 이름 매칭으로만 이어 쓴다.
