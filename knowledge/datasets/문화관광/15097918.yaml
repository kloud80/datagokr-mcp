summary_user: 빅카인즈(BIGKinds)에 쌓인 국내 신문·방송의 전염병 관련 기사를 기사 한 건당 한 행으로 담은 메타데이터로, 보도 일자·언론사·제목·통합 분류·키워드·특성추출 항목이 들어 있으며 파일은 CSV 약 1.5MB입니다. 연구자나 보건·언론 분석가가 '팬데믹 시기 언론이 백신·방역 정책을 언제 얼마나 다뤘고 주요 키워드가 어떻게 바뀌었나' 같은 보도 경향 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 일자나 언론사 이름, 키워드 문자열을 맞춰 붙이는 방식으로만 이어 쓴다.
