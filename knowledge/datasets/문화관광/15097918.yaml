description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 전염병 관련 뉴스 메타정보 자료입니다. 전염병은 개인의 건강을 넘어 사회·경제 전반에 걸쳐 광범위한 영향을 미치며, 특히 팬데믹과 같은 대규모 감염병 사태는 국가적 차원의 방역 정책과 국제 공조의 필요성을 부각시킵니다. 본 자료는 국내 주요 신문과 방송 보도에서 전염병과 관련된 기사들을 분석하여 주요 키워드와 등장 빈도를 도출하고, 시기별 보도 경향과 사회적 인식 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 감염병 발생과 확산, 정부와 의료계의 대응, 백신 및 치료제 개발, 방역 정책 논의 등이 언론 담론 속에서 어떻게 다뤄졌는지 객관적으로 파악할 수 있습니다. 또한 학술 연구, 보건 정책 수립, 언론 보도 분석, 교육 현장에서 활용할 수 있는 기초 자료로, 전염병 대응 체계의 개선과 공중보건 역량 강화를 위한 사회적 합의 형성에 기여할 수 있습니다.
