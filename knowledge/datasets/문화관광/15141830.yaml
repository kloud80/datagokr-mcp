summary_user: 서울 용산구의 인터넷컴퓨터게임시설제공업(PC방) 인허가를 사업장 단위로 담은 건별 데이터로, 인허가일·폐업일·영업상태, 소재지 지번·도로명 주소, 좌표, 시설면적·층수 등 시설 정보를 포함한다. 창업 예정자나 분석가가 용산구 안에서 현재 영업 중인 PC방이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 다른 데이터와는 주소·사업장명 매핑이나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE, 관리번호)로만 잇는다.
description_portal: 인터넷컴퓨터게임시설제공업은 일반적으로 ‘PC방’이라고 불리며, 컴퓨터를 통해 네트워크 게임, 온라인 게임 등을 제공하는 업종을 말합니다. 「게임산업진흥에 관한 법률」에 따라 해당 업종을 운영하기 위해서는 관할 구청장의 허가를 받아야 하며, 무허가 영업 시에는 형사처벌이나 행정처분을 받을 수 있습니다. 인허가 신청을 위해서는 건축물 용도 적합성, 소방·위생·환경 안전기준 준수, 사업자 본인의 범죄경력 여부 확인 등이 필수적입니다. 특히 청소년 이용시설로 운영될 경우, 음란물·사행성 게임물 제공 금지, 불법 주류 판매 금지, 청소년 고용 제한 등의 규정을 철저히 지켜야 합니다. 또한 PC방은 다중이용업소에 해당하여 소방 안전 설비를 반드시 갖추고 정기 점검을 받아야 하며, 영업자는 이용자의 쾌적한 환경을 위해 조명, 환기, 금연구역 설치 등을 의무적으로 이행해야 합니다. 관할 구청은 인허가 절차뿐만 아니라 정기 점검을 통해 건전한 게임 문화를 확립하고 있습니다.
