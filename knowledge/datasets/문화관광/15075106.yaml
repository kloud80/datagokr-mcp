summary_user: 경기아트센터가 펴내는 예술 매거진 「예술과 만남」의 호별 발간 목록으로, 한 행에 발간번호·발간연도·해당 월·주요 콘텐츠 주제·열람 웹 링크를 담는다. 문화기획자나 연구자가 "특정 연도에 이 매거진이 어떤 공연·인터뷰 주제를 다뤘고 원문은 어디서 보나"를 확인하거나 아카이빙·큐레이션 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 발간연도·월이나 기관명(경기아트센터)으로만 느슨하게 이어 쓴다.
description_portal: 「경기아트센터 정기간행물 예술과 만남 현황」 데이터는 경기아트센터에서 발간한 예술 전문 정기간행물의 "예술과 만남"에 대한 정보를 수록하고 있으며, 각 간행물의 발간번호, 발간연도, 해당 월, 주요 콘텐츠 주제, 열람 가능한 웹 링크로 구성되어 있습니다. 이 데이터는 월별 또는 격월 간행물의 발간 흐름과 주요 예술 담론의 변화를 파악할 수 있으며, 예술 관련 홍보, 아카이빙, 콘텐츠 큐레이션, 미디어 분석 등 다양한 문화기획 및 연구 활동에 활용될 수 있습니다.*"예술과 만남"은 국악, 클래식, 연극 등의 다양한 공연 소식과 일정, 인터뷰, 뉴스 정보 등 경기아트센터와 함께 문화의 향기를 느낄 수 있는 매거진입니다.
