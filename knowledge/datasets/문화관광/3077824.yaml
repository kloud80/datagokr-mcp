summary_user: 인천 계양구 안에서 외국인이 이용하기 편한 음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·소재지·전화번호·면적·좌석수·주차대수·회의 가능 여부·주메뉴·가격·업태가 들어 있다(CSV 619바이트의 작은 목록). 외국인 손님이나 그들을 안내하는 사람이 계양구에서 단체로 앉을 수 있고 주차가 되는 음식점이 어디인지, 메뉴와 가격대는 어떤지 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 업소명이나 소재지 주소를 맞춰 붙이거나, 같은 기관(계양구) 자료끼리 연결해 쓴다.
description_portal: 계양구 관내 외국인 이용이 편리한 음식점(업소명, 소재지, 전화번호, 면적, 좌석수, 주차대수, 회의가능유무, 주메뉴, 가격, 업태 등)에 대한 데이터파일입니다.이 데이터파일은 인천광역시 계양구 내에 위치한 외국인 친화 음식점 정보를 포함하고 있으며, 업소명, 소재지, 전화번호, 영업장 면적, 좌석 수, 주차 가능 대수, 회의 가능 여부, 주메뉴, 가격대, 업태 등의 세부 항목으로 구성되어 있습니다. 외국인이 이용하기에 편리한 환경을 제공하는 음식점을 식별할 수 있도록 다양한 편의 정보와 기본 영업 정보를 포함하고 있으며, 각 음식점의 특성과 이용 조건을 한눈에 파악할 수 있도록 설계되어 있습니다.업소의 면적과 좌석 수는 단체 이용 가능 여부를 판단하는 데 유용하며, 회의 가능 여부는 비즈니스 목적의 방문에도 참고할 수 있습니다. 주차대수 정보는 차량 이용 고객을 위한 필수 정보이며, 주메뉴와 가격은 음식 선택과 예산 계획에 도움이 됩니다. 업태 항목을 통해 한식, 중식, 일식, 양식 등 업종 구분도 가능합니다.해당 데이터파일의 데이터에 대한 추가 문의사항은 인천광역시 계양구 위생과(032-450-5435)로 해주시기 바랍니다.
