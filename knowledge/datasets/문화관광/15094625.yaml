summary_user: 서울 동작구의 여관·여인숙·호텔 등 숙박업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 인허가일자, 영업·상세 상태, 폐업일, 주소, 중부원점 TM 좌표, 객실 수(한실·양실), 건물 층수 같은 항목이 들어 있다. 동작구에서 지금 영업 중인 숙박업소가 어디에 몇 곳 있고 객실 규모가 어느 정도인지 알아보려는 분석가나 창업 예정자가 숙박 시장 현황을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 자치구 숙박업 인허가 데이터나 LOCALDATA 인허가 자료와는 관리번호(MGTNO)·주소·업소명을 맞춰 보거나 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓴다.
description_portal: '이 데이터는 서울특별시 동작구의 여관, 여인숙, 호텔 등 잠을 자고 머물수 있도록 시설 및 설비 등의 서비스를 제공하는 업소 정보를 포함하고 있습니다. 좌표안내 : 중부원점 TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 본 데이터는 3일전 자료를 제공합니다.'
