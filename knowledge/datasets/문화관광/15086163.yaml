summary_user: 인천 남동구 도서관 홈페이지에서 많이 검색된 검색어를 순위·생성일·데이터기준일자와 함께 담은 집계 파일로, CSV 전체 크기가 379바이트에 불과한 소량 데이터다. 남동구 주민이나 도서관 담당자가 '요즘 남동구 도서관 이용자들이 어떤 책·주제를 많이 찾는가'를 확인하는 데 쓴다. 실측 컬럼에 도서관코드나 ISBN 같은 전역 조인 키가 없어, 다른 데이터와는 검색어 텍스트를 도서명으로 직접 대조하거나 같은 기관(남동구) 기준으로만 이어 쓴다.
