summary_user: 경기도 시군에 있는 무도장업 사업장을 한 곳씩 담은 인허가 원천 명부로, 사업장명·인허가일자·폐업일자·영업상태·공사립 구분·건축물 동수와 연면적·회원모집 인원·주소·WGS84 좌표를 담는다. 지역 정책 담당자나 분석가가 "우리 시군에 영업 중인 무도장이 몇 곳이고 최근 몇 곳이 문을 닫았나"를 확인하거나, 안전점검 대상을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군코드(SIGUN_CD)·주소·좌표를 기준으로 다른 경기도 체육시설업·상권 데이터와 이름·위치 매핑으로 잇는다.
description_portal: 이 데이터는 경기도 31개 시군에 위치한 무도장업체의 인허가 및 운영 현황을 정리한 자료로, 도내 문화여가시설 현황 파악과 지역문화 정책 수립에 활용됩니다. 주요 항목으로는 사업장명, 시군명, 인허가일자, 폐업일자, 영업상태, 업태 및 세부업종명, 공사립구분, 지도자 수, 회원모집 인원, 건축물동수 및 연면적, 도로명 및 지번 주소, 전화번호, 좌표값(WGS84 기준) 등이 포함됩니다. 이 자료는 무도장 설치현황 분석, 생활문화시설 인프라 개선, 지도자 배치 현황 조사, 안전점검 대상 선정 등 다양한 행정 및 연구 목적에 사용될 수 있습니다. 특히 건축면적과 공사립구분은 무도장 운영형태를 구분하는 데 핵심적인 정보입니다.
