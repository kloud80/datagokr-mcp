summary_user: 경기도 구리시의 고구려대장간마을과 동구릉 두 관광지에 대해 월별(연월) 내국인·외국인·무료입장 관광객 수를 관광지별 열로 나눠 담은 집계 파일입니다(약 1.3KB 규모의 CSV). 구리시 관광 담당자나 지역 관광 분석가가 '동구릉과 대장간마을의 월별 방문객이 어떻게 변하고 외국인 비중은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어, 다른 관광 통계와는 연월과 관광지 이름·구리시라는 지역명으로 맞춰 이어 쓴다.
limits: 관광지점코드나 시군구코드가 없어 다른 기관 관광 통계와 코드로 바로 조인할 수 없고 이름 매핑이 필요하다. 범위는 구리시 두 관광지에 한정되며 공간 좌표가 없다.
