description_portal: 이 데이터는 한국언론진흥재단의 뉴스데이터베이스 BIGKinds를 기반으로, 연도별·과목별 수능 난이도에 대한 언론의 평가를 체계적으로 분석한 메타정보 자료입니다. 국어, 수학, 영어 등 주요 과목을 대상으로 해당 연도 기사 수, 언론이 추정한 난이도의 평균과 표준편차를 집계하여, 특정 시기에 언론이 수능을 어떻게 인식·보도했는지를 수치화했습니다. 이를 통해 과목별 난이도의 상대적 차이, 특정 연도에 대한 언론 담론의 강도와 경향, 그리고 교육 현안에 대한 사회적 관심도를 객관적으로 파악할 수 있습니다. 본 자료는 수능 난이도와 관련된 사회적 파장, 정책적 대응, 수험생과 학부모의 인식 변화를 분석하는 데 활용될 수 있으며, 교육 정책 연구, 언론 보도 분석, 학술 연구 및 교육 현장에서 중요한 기초 자료로 활용될 수 있습니다.
