description_portal: 기획취재의 비하인드스토리는 한국언론진흥재단에서 수행하는 기획취재 지원사업에서 심층 보도를 위한 언론사 및 기자들의 탐사 과정에서 발생하는 숨겨진 이야기들을 체계적으로 담고 있습니다. 기자들이 단순한 사실 전달을 넘어 사회적 이슈의 본질을 파헤치고 진실을 규명하기 위해 거치는 험난하고 치열한 여정이 바로 이 비하인드스토리의 핵심적 가치입니다.이러한 소중한 기록들의 상세한 내용과 전체적인 현황은 한국언론진흥재단 공식 누리집을 통해 국민 누구나 확인할 수 있으며, 투명성과 접근성을 보장하기 위해 공공데이터 포털에도 관련 정보를 제공하고 있습니다.다만 상세자료는 복잡한 구성과 다양한 형식을 포함한 비정형 PDF 파일 형태로 보관되어 있어, 공공데이터 포털에는 검색과 활용의 편의성을 위해 기본적인 리스트 형태만 개방하고 있습니다.제공되는 데이터는 소유자, 제목, 언론사명, 발행일 등의 메타데이터로 구성되어 있어 연구자나 관심 있는 시민들이 효율적으로 자료를 검색하고 활용할 수 있도록 체계화되어 있습니다.
