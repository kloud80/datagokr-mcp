summary_user: 경기도 내 공공 빙상장을 시설 한 곳당 한 행으로 담은 현황 자료로, 소유·관리기관, 준공연도, 건설사업비, 400m·쇼트트랙 링크 규격, 관람석·수용인원, 부지·건축·연면적, 주소와 위경도를 포함한다. 체육 정책 담당자나 분석가가 '경기도 시군별로 공공 아이스링크가 어디에 몇 곳 있고 규모와 관람 수용력은 어떤가'를 파악할 때 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 시설명으로 다른 경기도 데이터와 맞추고, 위경도로 지도·인구 데이터와 공간 결합한다.
description_portal: 이 데이터는 경기도 내 공공 빙상장(아이스링크) 시설의 현황을 수록한 자료로시설명, 소유기관, 관리주체, 준공연도, 건설사업비, 좌석형태 및 수용인원, 건축면적과 연면적, 부지면적, 위치정보(지번/도로명 주소, 위도/경도) 등을 포함하고 있습니다. 주요 항목으로는 ‘시설명’, ‘준공연도’, ‘쇼트트랙링크폭(m)’, ‘연면적(㎡)’, ‘건설사업비(백만원)’, ‘좌석형태명’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며,공공체육시설의 운영 실태 파악, 체육 인프라 분석, 지역사회 스포츠 활성화 정책 수립 등에 활용될 수 있습니다. 일부 시설은 다른 체육시설과 통합되어 운영되며, ‘비고사항’에 해당 내용이 명시되어 있습니다. 빙상장의 구조 및 설비 정보가 포함되어 있어 겨울 스포츠 기반 시설 구축에도 유용한 자료입니다.
