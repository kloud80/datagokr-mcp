summary_user: 전국의 문화재보호구역(문화재 보호를 위해 지정·고시된 구역)을 외부 vworld 서비스로 제공하는 API로, 시도·시군구명, 구역명(uname)·구역코드(ucode), 지번 본번·부번 등을 담는다. 토지를 개발하거나 건축하려는 사업자·개인이 해당 필지가 문화재보호구역에 걸리는지 확인하는 질문에 쓴다. 시도·시군구 코드(sido_cd, sigungu_cd, std_sggcd)와 구역코드로 같은 기관 데이터와 연결하며, 지번 필드로 필지 단위 대조를 시도할 수 있다.
description_portal: 지상에 고정되어 있는 유형물이나 일정한 지역이 문화재로 지정된 경우에 해당 지정문화재의 점유 면적을 제외한 지역으로서 그 지정문화재를 보호하기 위하여 「문화재보호법」에 따라 지정·고시된 구역 정보를 제공합니다.◎ 문화재보호구역은 국가지정문화재, 시·도지정문화재, 문화재자료로 지정을 할 때 문화재 보호를 위하여 특히 필요한 경우에 「문화재보호법 시행규칙」 별표2의 지정기준에 따라 지정함-◎ 문화재보호구역은 인위적 또는 자연적 조건의 변화 등으로 인하여 조정이 필요하다고 인정하면 조정할 수 있으며, 지정 또는 조정 후 매 10년이 되는 날 이전에 다음 각 호의 사항을 고려하여 그 지정 및 조정의 적정성을 검토함
