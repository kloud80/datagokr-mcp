summary_user: 강화군 도서관 홈페이지 자료검색 화면에서 입력된 검색어별 검색 횟수를 집계 기간(시작일·종료일)과 함께 담은 집계 통계로, 포털 설명상 2025년 11월 1일~15일 자료검색 데이터(약 105,000건)를 가공한 샘플이며 CSV 파일(약 1.25MB)로 활용신청 없이 받는다. 강화군 도서관 이용자가 어떤 자료·주제를 많이 찾는지 파악해 장서 구입이나 추천 도서 기획에 반영하려는 사서·분석가가 쓴다. 실측 컬럼에 도서관코드·ISBN 같은 전역 조인 키가 없어, 다른 도서관 데이터와는 검색어 텍스트를 도서명·주제어에 이름 매핑하거나 같은 기관(강화군) 기준으로만 이어 쓴다.
limits: 검색어 단위 집계만 있어 개별 이용자·검색 시각·검색 결과(소장 여부, 대출 연결)는 알 수 없다. 공개분은 2025년 11월 초 보름치 샘플이라 장기 추세나 계절 비교에는 맞지 않으며, 범위가 강화군 한 곳이라 타 지자체와 직접 비교하기 어렵다. 도서관코드·ISBN 키가 없어 도서관정보나루 등과 정확히 결합되지 않는다.
