description_portal: 전라남도 순천시는 자연과 문화, 전통을 아우르는 다양한 축제가 열리는 도시입니다. 대표적으로 푸드앤아트페스티벌, 풍덕동 장미축제, 낙안읍성 민속문화축제가 있으며, 각각 순천의 먹거리, 자연 경관, 전통문화를 잘 보여주는 축제들입니다.푸드앤아트페스티벌은 지역 특산물로 만든 음식과 예술 공연이 어우러져 미식과 문화를 함께 즐길 수 있고, 풍덕동 장미축제는 매년 5~6월 장미꽃이 만개한 거리에서 열려 가족 단위 나들이객에게 인기가 많습니다. 낙안읍성 민속문화축제는 조선 시대의 전통 문화를 체험할 수 있는 행사로, 역사적 가치와 재미를 동시에 느낄 수 있습니다.이 외에도 낙안면 열린 음악회, 화합앤힐링 축제, 은행나무 아래로 축제 등 다양한 행사들이 열려 계절마다 색다른 볼거리와 즐길 거리를 제공합니다. 이처럼 순천은 축제를 통해 지역의 매력을 알리고 관광 활성화에 크게 기여하고 있습니다.
