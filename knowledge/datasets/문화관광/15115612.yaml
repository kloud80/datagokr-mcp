summary_user: 서울특별시 양천구 관내 외국인관광도시민박업소의 인허가 내역을 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소, 좌표, 층수·객실 수, 영문 상호·주소 등을 포함한다. 외국인 관광객이나 주민이 양천구에서 현재 영업 중인 외국인 대상 도시민박 업소가 어디에 몇 곳 있는지 확인하거나, 분석가가 폐업·휴업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관의 관리번호(MGTNO)로만 이어 쓰며, 좌표(X·Y)로 지도 위에 겹쳐 볼 수 있다.
description_portal: 본 자료는 서울특별시 양천구 관내 외국인관광도시민박업체의 인허가 현황을 종합적으로 수록한 데이터이다. 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 층수, 영문상호명, 영문주소, 자본금, 시설규모 등을 제공하여 외국인 관광객과 주민이 안전하고 체계적으로 민박 서비스를 이용할 수 있도록 구성되어 있다. 해당 데이터는 정확성을 기하기 위하여 관할 관광·숙박 관련 부서에서 수집한 공식 정보를 기반으로 하며, 업체별 등록 현황과 운영 상태를 체계적으로 확인할 수 있도록 정리되어 있다. 이를 통해 외국인관광도시민박업 관리, 정책 수립, 안전 점검 및 서비스 품질 향상에 활용 가능하며, 지속 가능한 관광산업 관리 체계 확립과 지역 관광 활성화에 기여한다.* 외국인관광도시민박업 - 도시 지역의 주민이 거주하고 있는 주택을 이용하여 외국인 관광객에게 한국의 가정 문화를 체험 할 수 있도록 숙식 등의 서비스를 제공하는 업소
