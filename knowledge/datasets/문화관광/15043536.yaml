summary_user: 제주 구좌읍 비자림 한 곳의 무장애여행 정보를 지점 단위로 담은 파일로, 지점마다 아이디·위도·경도·해발고도가 있고 포털 설명상 장소설명과 이미지도 함께 제공된다. 휠체어 이용자나 보행약자, 동행자가 비자림에서 주차구역·화장실·숲길 같은 편의 지점이 어디에 있고 경사가 어떤지 미리 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 장소 이름을 맞추거나 위도·경도 좌표를 기준으로 붙여 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 비자림 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 비자림은 제주 제주시 구좌읍에 위치한 천연 숲으로, 500~800년생 비자나무 2,800그루가 우거진 세계적으로도 희귀한 원시림이다. 본 무장애 여행 정보는 휠체어 이용자 및 보행약자를 고려하여 장애인 전용 주차구역, 휠체어 무료 대여, 장애인 화장실 및 평탄·완만 경사의 숲길 등 접근성과 편의시설 현황을 포함하고 있다. 특히 매표소에서 숲길입구까지는 포장된 출입로가 확보되어 있고, 주요 산책로는 화산송이 등 부드러운 재질의 평지 또는 완만한 경사로가 많아 유모차·휠체어 접근이 가능하다. 다만 일부 구간(돌멩이길, 오르막/내리막 경사길)은 보조가 필요할 수 있어 방문자 동행 또는 보조 수단을 권장한다. 이 정보는 무장애 관광지 조성, 열린관광지 확대, 관광 편의성 개선 및 정책 수립의 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
