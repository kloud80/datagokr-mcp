summary_user: 연천군 관내 공공 체육시설을 시설 1곳당 한 행으로 정리한 현황 파일(CSV, 약 7KB)로, 종목 구분·시설명·주소·주요시설(실내외, 면·타석·홀 수)·준공년도·관리주체·전화번호·기준일자를 담는다. 연천군 주민이나 방문객이 '우리 읍·면 근처에 파크골프장이나 테니스장이 있는지, 문의는 어디로 하는지'를 확인하거나, 분석가가 시설 노후도와 관리 주체별 분포를 살펴보는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 주소나 시설명을 매칭하거나 같은 기관(연천군) 기준으로만 이어 쓰며, 전국 비교에는 문체부 전국체육시설 데이터와 이름·주소로 대조한다.
description_portal: 본 자료는 연천군 관내에 설치·운영 중인 체육시설 현황을 체계적으로 정리한 것이다. 시설 구분, 시설명, 주소, 주요 시설 구성, 준공년도, 관리 주체, 전화번호, 기준일자 등의 항목으로 구성되어 있으며, 주민 생활체육과 여가 활동과 관련된 기본 정보를 제공한다. 게이트볼장, 배드민턴장, 축구장, 풋살장, 테니스장, 탁구장, 야구장, 수영장, 파크골프장 등 다양한 종목의 체육시설이 포함되어 있어 연천군 전 지역의 체육 인프라 현황을 확인할 수 있다. 각 시설은 실외·실내 여부, 면 수, 타석 수, 홀 수 등 주요 시설 정보를 함께 기재하여 이용 목적에 따른 시설 특성을 파악할 수 있도록 구성되어 있다. 또한 시설별 준공연도를 통해 조성 시기를 확인할 수 있으며, 시설관리공단, 문화체육과, 읍·면 행정복지센터 등 관리 주체 정보가 포함되어 있어 행정적 관리 체계도 함께 파악할 수 있다. 전화번호 항목은 이용 문의 및 행정 처리에 활용할 수 있는 실무적 정보를 제공한다. 본 자료는  체육시설 관리, 주민 안내, 생활체육 정책 수립, 공공데이터 제공 등 다양한 행정·정보 활용 목적에 적합한 기초 자료로 활용될 수 있다.
