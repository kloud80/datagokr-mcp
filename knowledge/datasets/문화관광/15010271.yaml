summary_user: 예술의전당에서 열린 공연·전시의 회차별 입장객 수를 작품명·공간명·일자·시간과 함께 기획/대관 구분, 대관사, 유료·무료·합계 인원으로 담은 건별 기록이며, 포털 설명상 기간은 2011년 1월 1일부터 2025년 12월 31일까지다. 문화예술 분석가나 기획자가 '예술의전당 어느 공간에서 어떤 작품이 유료 관객을 가장 많이 모았나', '기획 공연과 대관 공연의 관객 규모가 어떻게 다른가' 같은 질문에 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 바로 붙지 않으며, 다른 데이터와는 작품명·공간명·일자를 이름으로 맞춰 연결해야 한다.
description_portal: '- 데이터 기간 : 2011. 1. 1.~ 2025. 12. 31.- 관련 데이터 : 작품명, 공간명,  구분(기획/대관), 대관사,  무료, 유료, 합계- 데이터 설명: "예술의전당_공연 및 전시 입장객 현황" 데이터는 예술의전당에서 개최되는 다양한 공연 및 전시의 관람객 수를 시간/장소별로 수집한 데이터입니다.이 데이터는 문화예술 수요를 분석하고, 운영 및 정책 개선에 매우 중요한 자료로 활용될 수 있습니다. 이 데이터는 단순히 몇 명이 관람했는지를 기록하는 데 그치지 않고, 시간대별 관람 트렌드, 장르별 인기, 시즌별 관람 패턴 등 다양한 분석이 가능하도록 구조화되어 있습니다.'
