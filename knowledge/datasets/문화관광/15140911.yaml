description_portal: 이 데이터는 서울특별시 광진구 관내에서 비디오물소극장업 인허가를 받아 운영 중인 업소에 대한 현황 정보를 제공합니다. 비디오물소극장업은 영사막과 다수의 객석을 갖추고 비디오물만을 상영하는 전용 시설로, 일반 영화관과 달리 극장에서 상영되지 않는 영상 콘텐츠 등을 집중적으로 제공하는 업종입니다. 해당 업소는 주로 소규모 관람 공간에서 비디오 콘텐츠 감상을 위한 시설과 시청 기자재를 갖추고 있으며, 데이터에는 업소명, 소재지, 업종 유형, 인허가일자 등의 정보가 포함됩니다. 본 데이터는 광진구 내 영상 문화공간 현황 파악, 콘텐츠 유통 구조 분석, 청소년 출입 제한 업소 관리 등 다양한 행정 및 정책 수립에 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84) 좌표는 포함되어 있지 않아 지도 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준 자료로 정기적으로 갱신됩니다.
