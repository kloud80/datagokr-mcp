description_portal: '세종특별자치시시설관리공단은 시민의 체육시설 이용 부담을 완화하고, 사회적 배려계층의 체육활동 참여를 확대하기 위해 강습대상 할인품목 정보를 공공데이터로 제공하고 있습니다.이 데이터는 공단이 운영하는 체육시설(보람수영장, 조치원복합커뮤니티센터)에서 적용 중인 회원 감면·할인 정책의 상세 현황을 담고 있습니다.■ 데이터 컬럼 구성센터명 - 할인 제도가 적용되는 시설명    예: 보람수영장, 조치원복합커뮤니티센터 등할인사유 - 감면 또는 할인 적용 사유    예: 국가유공자, 장애인, 기초수급자, 의사상자 등사용가능여부 - 해당 할인 사유가 현재 적용 가능한지 여부    예: Y(사용 가능), N(미사용)회원감면확정여부 - 할인 대상이 실제 회원 감면 처리로 확정되었는지 여부    예: Y(감면 확정), N(미확정)회원감면확정시작일자 - 회원 감면이 적용되기 시작한 날짜회원감면확정종료일자 - 회원 감면이 종료되는 날짜■ 데이터 제공 목적강습대상할인품목 데이터는 다음과 같은 목적을 위해 제공됩니다. - 체육시설 이용요금 할인 정책의 투명한 공개 및 접근성 향상 - 국가유공자, 장애인, 기초생활수급자 등 사회적 배려계층 지원 강화 - 회원 감면 기간 및 적용 여부의 체계적 관리 - 시민의 체육시설 이용 편의 증진 및 이용 불편 해소 - 체육 복지 확대를 위한 근거 데이터로 행정 효율성 향상 - 세종특별자치시시설관리공단은 앞으로도 시민 누구나 공정하고 합리적으로 체육시설을 이용할 수 있도록, 관련 데이터를 지속적으로 갱신·공개하겠습니다.'
