summary_user: 충청남도 보령시 관내 전통사찰을 사찰 한 곳당 한 행으로 담은 파일로, 사찰명·소속종단·건립연대·연혁 및 유래·전통사찰 등록번호·주소와 위도·경도를 포함한다. 여행자나 관광·교육 기획자가 "보령에 있는 전통사찰은 어디이고 어느 종단 소속이며 언제 세워졌나"를 확인하거나, 답사·체험 코스를 짤 때 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 사찰명이나 주소로 맞추거나 위도·경도로 지도·관광지 데이터와 위치를 겹쳐 연결한다.
description_portal: 우리나라 전통문화유산 보존에 대한 사회적 관심 증대와 문화관광 활성화 정책 추진, 지역 고유의 역사문화자원 발굴 및 보존 필요성에 따라 보령시는 관내 위치한 전통사찰의 체계적인 관리와 문화유산으로서의 가치 보존을 위해 종합적인 전통사찰 현황정보를 제공하고 있습니다. 이를 통해 지역 문화유산의 체계적 관리와 시민들의 전통문화 이해 증진, 문화관광 자원으로서의 활용 극대화에 기여하고자 합니다. 보령시에 소재한 전통사찰들의 역사적 배경, 건립시기, 소속종단, 위치정보 등 상세한 현황을 공개하고 있습니다.개방 데이터는 보령시 관내 전통사찰 5개소의 상세정보로 사찰명, 소속종단, 건립연대, 전화번호, 소재지 도로명주소, 소재지 지번주소, 위도, 경도, 연혁 및 유래, 등록일, 등록번호, 데이터 기준일 등 총 12개 항목 5건의 정보를 제공합니다.관광업계는 문화관광 상품 개발과 전통문화 체험 프로그램 기획에 활용하고, 교육기관은 지역사 교육과 전통문화 학습자료로 활용하며, 연구기관은 불교문화사 연구와 지역 문화유산 조사에 활용할 수 있습니다. 또한 시민들은 전통문화 체험과 정신적 힐링 공간 탐방에 기여할 수 있습니다.
