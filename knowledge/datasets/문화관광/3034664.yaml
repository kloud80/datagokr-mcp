summary_user: 부산광역시 남구에 등록된 여행업체를 업소 한 곳당 한 행으로 담은 파일로, 업종(국내여행업·국내외여행업·종합여행업), 상호, 도로명 소재지를 수록한다. 남구에서 해외여행 상품을 다룰 수 있는 국내외여행업·종합여행업체가 어디에 있는지 찾으려는 주민이나, 관내 여행업 분포를 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관(남구) 자료 기준으로만 이어 쓴다.
