summary_user: 반려동물과 함께 갈 수 있는 전국의 관광지·숙소·음식점·쇼핑시설을 장소 한 곳씩 개별 단위(주소·좌표 포함)로 담은 TourAPI 계열 API이며, 검증 시 전체 건수는 16건으로 확인됐다. 반려동물 동반 조건과 유의사항, 이용 가능 시설을 알고 싶은 여행자나 반려동물 여행 앱 개발자가 지역·현재 위치 기준으로 장소를 찾는 데 쓴다. 장소의 상세 정보는 다른 TourAPI 데이터의 contentId와 지역코드로 이어 쓰며, 실측 컬럼에서는 전역 조인 키를 찾지 못해 이름·코드 매핑이나 같은 기관 코드로만 연결된다.
limits: 필수 파라미터 contentId는 다른 데이터에서 먼저 받아 넘겨야 한다. 검증 호출에서 6개 오퍼레이션 중 3개만 성공했고, /detailPetTour2, /areaCode2, /areaBasedList2는 최소 파라미터로 응답이 없었다. 개발계정은 일 1,000회 호출 제한이 있다.
