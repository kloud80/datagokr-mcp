description_portal: 본 API는 반려동물과 함께 여행할 수 있는 전국의 관광지, 숙소, 음식점, 쇼핑시설 등 다양한 장소의 관광정보를 제공합니다. 각 관광지의 기본 정보(운영 시간, 휴무일 등) 뿐만 아니라 반려동물 동반 조건, 반려동물 동반 시 유의사항, 반려동물 이용가능 시설 등의 상세정보를 제공하고 있습니다. 또한 지역기반 조회, (현재)위치기반 조회 등의 기능을 제공하며 파라미터에 따라 제목순, 수정일순(최신순), 등록일순 정렬을 제공합니다. 모바일 앱 및 웹 서비스 등 다양한 매체에서 활용하여 반려동물 관광 서비스를 창출할 수 있습니다.
