summary_user: 성동구에 설치된 스마트도서관을 한 곳당 한 행으로 담은 시설 목록 파일로, 운영시간·휴관일·자료 수·대출 가능 권수와 일수·도로명주소·위도와 경도를 포함한다(파일 크기 약 2KB의 소규모 CSV). 주민이 '집 근처 스마트도서관이 어디 있고 주말에 몇 시까지 운영하며 몇 권을 며칠 빌릴 수 있나'를 확인하거나, 분석가가 구 단위 도서관 접근성을 볼 때 쓴다. 전역 조인 키(도서관코드 등)는 없어서 도서관정보나루 같은 다른 도서관 데이터와는 도서관명·주소로 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 서울특별시 성동구 스마트도서관 현황 데이터는 지역 내 설치된 스마트도서관의 운영 및 시설 정보를 종합적으로 제공하는 자료입니다. 데이터에는 도서관명, 시도명, 시군구명, 도서관 유형, 휴관일, 평일·토요일·공휴일 운영 시작 및 종료 시각, 열람좌석 수, 자료수(도서, 연속간행물, 비도서), 대출 가능 권수와 일수, 소재지 도로명주소, 운영기관명, 도서관 전화번호, 부지면적, 건물면적, 홈페이지 주소, 위도와 경도 등 항목이 포함되어 있습니다. 이를 통해 주민은 가까운 스마트도서관의 위치와 운영시간, 대출 가능 자료 현황을 쉽게 확인할 수 있으며, 행정기관은 도서관 운영 현황과 이용률을 분석하여 문화·교육 서비스 개선과 독서 활성화 정책 수립에 활용할 수 있습니다. 또한 연구기관과 민간에서는 도서관 접근성 연구, 공간 활용 분석, 공공 문화 인프라 평가 등 다양한 목적으로 데이터를 활용할 수 있습니다. 본 자료는 성동구의 스마트도서관 운영 현황을 체계적으로 공개함으로써 주민 편의 증진, 지식 정보 접근성 강화, 지역 문화 발전에 기여하는 중요한 기초자료로 활용될 수 있습니다.
