description_portal: 한국관광 데이터랩(datalab.visitkorea.or.kr) 에서 제공하는 「한국관광 해외광고 마케팅 커뮤니케이션 효과조사」의 방한 여행 이미지 응답 결과를 담고 있습니다. 조사 대상은 해외 주요 국가 및 도시에 거주하는 15~59세 해외관광 소비자로, 최근 3년 이내 해외관광 경험이 있거나 향후 1년 내 해외관광 의향이 있는 사람들을 포함합니다. 데이터는 기준연도, 구분(한국 국가 이미지, 한국 인지도, 선호도), 값으로 구성되어 있으며, 한국에 대한 긍정적 응답 비율을 연도별로 확인할 수 있어 관광 이미지 분석 및 마케팅 전략 수립에 활용할 수 있습니다.
