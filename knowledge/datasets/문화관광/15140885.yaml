description_portal: 이 데이터는 서울특별시 광진구 관내에서 청소년 보호법에 따라 유해업소로 분류된 업소들의 현황 정보를 제공합니다. 청소년 유해업소란 청소년의 출입 및 고용이 금지되거나 제한된 장소로, 주로 유흥·오락·성 관련 업종이나 음주 및 흡연 유도 시설 등이 해당됩니다.본 데이터는 광진구에서 청소년 유해업소로 분류된 업종에 대한 처리일자, 업종코드, 업종명, 건수 등을 포함하며, 단속·행정처리 현황 및 업종별 분포, 특정 시기별 단속 빈도 파악 등에 활용됩니다.이 데이터는 청소년의 건전한 환경 조성을 위한 정책 수립, 단속 근거 자료, 지자체 및 교육기관의 연계 활용 등 다양한 행정목적에 기반하여 수집·제공됩니다.※ 본 데이터는 Sheet 형태로 서비스되며 최근 1개월 이내 수집된 정보만 제공되므로, 정기적인 최신 데이터 갱신 확인이 필요합니다.※ 위치정보는 포함되지 않으며, 통계성 수치 및 업종 유형 중심으로 제공됩니다.
