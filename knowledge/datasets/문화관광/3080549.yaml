summary_user: 경상남도 안 경기장을 시설 한 곳당 한 행으로 담은 현황 파일이다. 시군구, 소유기관·관리주체, 부지·건축·연면적, 트랙·필드 규격, 관람석 수, 준공연도, 주소가 들어 있다. 대회나 행사를 준비하는 사람이 '경남에서 관람석이 일정 규모 이상이고 육상 트랙을 갖춘 경기장이 어디 있나'를 찾을 때 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군구 이름이나 도로명·지번 주소로 맞춰 잇는다.
description_portal: 경남도내 경기장 현황 데이터입니다. 시군구별 시설명, 소유기관명, 관리주체, 부지면적, 건축면적, 연면적 등의 데이터를 포함하고 있습니다.
