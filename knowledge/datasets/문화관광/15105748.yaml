description_portal: '- 전라남도에서 운영하는 전님도립미술관 소장품  공모구입 정보 목록으로 작품명, 작가명, 제작연도, 유형, 제작기법, 작품크기, 재료, 장르 등을 포함하고 있습니다.- 장르는 한국화, 회화, 판화, 스케치, 드로잉, 조각, 미디어(뉴미디어), 사진, 설치, 공예 등으로 구분됩니다.  - 전라남도 도립미술관은 지역 작가들의 작품을 적극적으로 수집하고 있으며, 다양한 전시와 프로그램을 통해 지역 문화 예술의 발전에 기여하고 있습니다. 관람객 여러분께서는 미술관을 직접 방문하시거나 공식 웹사이트를 통해 최신 정보를 확인하시기 바랍니다.- 전라남도 도립미술관은 전라남도의 대표적인 공립 미술관으로, 지역 예술의 중심지로서 다양한 전시와 프로그램을 통해 관람객들에게 풍성한 문화 체험을 제공합니다.'
