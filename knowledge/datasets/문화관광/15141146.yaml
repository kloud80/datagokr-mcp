summary_user: 은평구 내 인형뽑기방·오락실 등 전체이용가 게임물을 제공하는 청소년게임제공업소의 인허가를 업소 한 곳당 한 행으로 담은 건별 원천 자료로, 업소명·지번/도로명 주소·인허가일·폐업일·영업상태·시설 정보(면적·층수·조명·비상구 등)와 중부원점TM 좌표를 포함한다. 주민이나 학부모가 우리 동네 인형뽑기방·오락실이 현재 영업 중인지 확인하거나, 분석가가 은평구 청소년게임장의 개·폐업 추이와 학교 주변 분포를 살필 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 주소·업소명 매칭이나 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드로만 연결한다.
description_portal: '은평구의 인형뽑기, 오락실 등 전체이용가 게임물을 설치하여 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 청소년 대상 게임제공업소에 대한 인허가 정보를 포함하고 있으며,  업소명, 주소, 인허가 일자, 영업상태, 관리기관 등의 항목이 포함됩니다.  청소년의 건전한 여가문화 형성과 유해환경 차단을 위한 관리 기반 자료로 활용됩니다.  해당 업종은 심야시간 영업제한, 셧다운제, 게임중독 예방 등과도 밀접한 관련이 있어  정책적 감시와 규제가 요구되는 영역입니다.  본 데이터를 통해 교육청, 경찰서, 지자체 등 유관기관 간 협력이 가능하며,  청소년 보호 행정의 효율성과 투명성을 높이는 데 기여합니다.'
