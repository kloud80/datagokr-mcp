description_portal: 이 데이터는 박물관에서 소장 및 전시 중인 근대 역사 유물들의 상세 정보를 체계적으로 정리한 아카이브 자료입니다. 안산과 깊은 연관이 있는 심훈의 장편소설 "상록수" 초판본(1936년)을 비롯하여, 일제강점기 당시의 지리적·행정적 상황을 기록한 "일본풍속지리대계", "시정25년사" 등의 문헌 자료가 포함되어 있습니다. 또한 "조선신지도", "수원군관내도", "원산부평면도" 등 당시의 지형과 행정 구역을 확인할 수 있는 희귀 고지도에 대한 정보도 담고 있습니다. 각 유물별로 발행 연도, 출판사, 물리적 형태(책갑 유무, 표지 색상, 보존 상태) 및 수록 내용이 매우 구체적으로 기술되어 있어, 근대 문학, 지리, 역사 연구를 위한 귀중한 기초 자료로 활용될 수 있습니다.
