summary_user: 제주 세계자연유산지구인 한라산·성산일출봉·만장굴·거문오름 네 곳의 연도별 내국인·외국인 방문자 수를 담은 집계 파일로, 포털 설명상 2010년부터 제공되며 내려받은 CSV는 약 1.2KB의 작은 표입니다. 관광 분석가나 지자체 담당자가 "성산일출봉의 외국인 방문객은 해마다 어떻게 변했나"처럼 유산지구별·내외국인별 방문 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도나 유산지구 이름으로 맞춰 이어 쓴다.
description_portal: "제주특별자치도 세계유산본부에서 제공하는 유산지구 방문자현황 데이터를 제공합니다.항목: 연도기준 내국인, 외국인 방문자 수*2010년도부터 제공*구분: 한라산, 성산일출봉, 만장굴, 거문오름*제주도는 2007년 우리나라 최초로 '제주 화산섬과 용암동굴'이라는 이름으로 세계자연유산에 등재됨, 한라산천연보호구역, 성산일출봉, 거문오름용암동굴계로 제주도 전체 면적의 약 10%를 차지함자세한 사항은 세계자연유산제주 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/jejuwnh/heritage/visitstats.htm"
