summary_user: 전북특별자치도 장수군에 있는 운영 중인 전통사찰을 사찰 한 곳당 한 행으로 담은 574바이트 규모의 소량 CSV 파일로, 사찰명·소재지·종단·창설연도·전화번호를 담는다. 장수군을 찾는 방문객이나 지역 문화유산 조사자가 "장수군에는 어떤 전통사찰이 어느 읍면에 있고 어느 종단 소속인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와 이으려면 사찰명이나 소재지 주소를 기준으로 이름·주소를 맞춰 연결해야 한다.
description_portal: 전북특별자치도 장수군에 소재하고 운영중에 있는 전통 사찰 현황에 대한 데이터를 제공하고자 합니다.데이터의 구성은 사찰명, 소재지, 종단명, 창설년도, 전화번호, 데이터기준일자로 구성되어 있습니다.사찰명은 암과 사로 구분됩니다. 종단명은 조계종과 태고종으로 구분됩니다.이 데이터의 경우 장수군 전체 5개읍면(장수읍, 산서면, 장계면, 천천면)에서 현황입니다.추가적인 데이터가 필요한 경우 공공데이터포털(data.go.kr) 누리집의 데이터 제공 신청을 통해 신청하여 주시기 바랍니다.
