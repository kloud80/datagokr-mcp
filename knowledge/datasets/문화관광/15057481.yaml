summary_user: 경기도 내에서 정보통신망으로 음악파일·음악영상을 제공하는 온라인음악서비스제공업 사업장을 한 곳씩 담은 건별 현황으로, 사업장명·인허가일자·영업상태·폐업일자와 도로명·지번 주소, WGS84 좌표를 포함한다. 분석가나 사업자가 '경기도에서 현재 영업 중인 온라인 음원 서비스 사업장은 어느 시군에 몰려 있고 언제 인허가·폐업했나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 주소·사업장명 매칭, 좌표로 다른 경기도 인허가·지역 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 정보통신망을 통해 음악파일 또는 음악영상파일 등의 디지털 콘텐츠를 소비자에게 제공하는 온라인 음악 서비스 사업장의 현황을 기록한 자료입니다. 각 사업장의 인허가일자, 영업상태(운영중, 폐업 등), 폐업일자와 같은 행정 정보와 함께, 도로명 주소 및 지번 주소 등 위치 정보가 포함되어 있어 서비스 제공업체의 지역 분포를 확인할 수 있습니다. 사업장명은 국내 디지털 음원 산업 생태계를 구성하는 주요 기업 정보를 반영합니다. 이 데이터는 음악 콘텐츠 유통 구조 분석, 디지털미디어산업 지원 정책, 음원 유통사업자 인허가 관리, 온라인 문화소비 서비스 동향 분석 등 다양한 정책 및 산업 연구 목적에 활용될 수 있습니다.
