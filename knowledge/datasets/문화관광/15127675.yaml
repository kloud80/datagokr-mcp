description_portal: 영상물등급위원회는「영화 및 비디오물의 진흥에 관한 법률」제71조에 따라 ‘영상물의 공공성과 윤리성을 확보하고 청소년을 보호’하기 위해 설립되었으며 동법 제72조의 영상물등의 등급분류 및 내용정보, 청소년 유해성 확인 심의 등의 직무를 수행하는 문화체육관광부 산하 공공기관입니다.해당 공공데이터는 영상물등급위원회에서 등급분류한 비디오물의 등급분류 정보와 해당 비디오물의 상세 정보를 제공하는 서비스입니다.사용제명, 원제명, 감독명, 관람등급, 내용정보 표시항목 등의 정보를 제공※ 시스템 구축 이후인 2009년 자료부터 조회 가능합니다.※ 요청 메세지에 필수값만 입력하여 조회할 경우 대량의 데이터가 한 번에 조회되어 타임아웃으로 인한 에러(99, UNKNOWN_ERROR)가 발생할 수 있으니, 원활한 이용을 위해 옵션 항목 중 최소 한 가지 이상을 함께 입력해 주시기 바랍니다.
