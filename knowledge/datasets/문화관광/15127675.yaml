status: active
summary_user: 영상물등급위원회가 등급분류한 비디오물을 건별로 담으며, 등급분류번호·결정등급·등급분류일자와 사용제명·원제명·감독·주연·줄거리, 주제·선정성·폭력성 등 내용정보 표시항목을 함께 제공하고 2009년 자료부터 조회된다. 부모나 유통·서비스 사업자가 특정 비디오물이 몇 세 관람가로 결정됐고 어떤 이유(폭력성·약물·모방위험 등)로 그 등급을 받았는지 확인하는 데 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어서 영화 정보 등 다른 데이터와는 제목·감독명 같은 이름 매칭으로만 이어 쓴다.
limits: 전역 조인 키가 없어 다른 콘텐츠 데이터와 정확히 연결하려면 이름 기반 매칭이 필요하다. 필수값만 넣어 호출하면 대량 조회로 타임아웃 오류가 날 수 있으므로 옵션 항목을 하나 이상 함께 넣어야 하며, 개발계정은 일 1,000회로 제한된다.
