summary_user: 서울 동작구의 종합체육시설업 인허가 사업장을 건별로 담은 데이터로, 사업장명·지번/도로명 주소·인허가일자·취소일자·영업상태(정상·휴업·폐업)·휴업 기간·폐업일자·좌표(X, Y)를 담는다. 동작구에서 영업 중인 종합체육시설이 어디에 몇 곳 있고 최근 문을 닫은 곳은 어디인지 확인하려는 주민·창업자·상권 분석가가 쓰며, 헬스장 등 체육시설의 개폐업 흐름을 상권 신호로 볼 때도 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드(OPNSFTEAMCODE)로만 이어 쓰고, 좌표로 상권·인구 데이터와 공간 결합한다.
description_portal: 종합체육시설업 인허가 정보 데이터는 시민에게 다양한 체육 활동과 운동 서비스를 제공하는 시설 현황을 담고 있습니다.사업장명과 주소 정보는 각 종합체육시설의 위치와 기본 정보를 제공합니다.문화체육업종명은 체육관, 헬스장, 다목적 운동 시설 등 업종 유형을 구분합니다.영업상태 항목은 정상, 휴업, 폐업 등 현재 운영 여부를 보여줍니다.보험가입여부 코드는 종업원과 이용자의 안전을 보장하기 위한 보험 가입 현황을 나타냅니다.시설규모 정보는 운동 공간, 장비 현황 등 시설 환경을 보여줍니다.
