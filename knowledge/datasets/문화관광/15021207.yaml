summary_user: 대한체육회 행복나눔교실(소외계층·다문화 청소년 대상 생활체육 강습회)을 강습회 한 건씩 담은 파일로, 연도·종목명·참가구분(단체/개인)·선정방법(심사·추천/선착순)·접수 시작·종료일·장소를 담는다(전국 범위, CSV 약 28KB). 청소년 지원 기관이나 정책 분석가가 "어떤 종목의 강습회가 어느 해에 어디서 어떤 방식으로 참가자를 모았나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 생활체육 데이터와는 종목명·연도·장소 이름을 맞춰 붙여야 한다.
description_portal: 대한체육회가 제공하는 생활체육 강습회(행복나눔교실) 정보를 제공합니다. 행복나눔교실은 소외계층 및 다문화(이주배경 포함) 청소년을 대상으로 다양한 체육활동 참여기회를 제공합니다. 이 데이터는 강습회가 진행된 년도, 종목명, 참가구분(단체, 개인 여부), 선정방법(심사/추천, 선착순), 접수시작일, 접수종료일, 장소의 컬럼으로 구성되어 있습니다. 해당 강습회의 좀 더 상세한 정보가 필요한 경우 해당 강습회를 진행하였던 종목단체를 통해 문의하셔야합니다.2025년 기준 문화체육관광부로 관련 사업이 이관되어 신규 데이터가 생성되지 않습니다.
