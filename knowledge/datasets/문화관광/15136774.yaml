summary_user: 방한 외래관광객 수를 기준연월별로 성별·연령별·목적별·교통수단별로 나눠 담은 전국 단위 월별 집계 파일로, 거주자·군인·영주 등 일부 체류자격 입국자는 빼고 재외국민(교포) 입국자는 포함한다. 관광 분석가나 사업자가 '특정 연령대·성별의 외래관광객이 어떤 교통수단으로, 어떤 목적으로 들어오는지 월별로 어떻게 변하는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 지역 코드가 없어 다른 데이터와는 기준연월을 맞추거나 항목 이름을 매핑하는 방식으로만 이어 쓴다.
limits: 전국·비공간 집계라 시군구나 관광지점 단위로 나눠 볼 수 없고, 관광지점코드·시군구코드 같은 지역 키로 연결되지 않는다. 승무원은 성별·연령을 구분해 기록하지 않으므로 성별·연령별 합계와 전체 인원이 다를 수 있다.
