summary_user: 부산시에서 열리는 전시를 건별로 담은 목록으로, 전시 제목·전시 시작일과 종료일·오픈런 여부·전시장 이름·유무료 구분·공연번호를 제공한다. 시민이나 관광객이 '이번 주 부산에서 무료로 볼 수 있는 전시가 어디에 있나'를 찾거나, 분석가가 전시장별 전시 개최 현황을 정리하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공연·문화시설 데이터와는 전시장 이름(place_nm)이나 제목을 기준으로 이름 매칭해 이어 써야 한다.
limits: KOPIS 공연 ID나 문화시설 코드 같은 공통 키가 없어 다른 데이터와 정확히 조인되지 않으며, 이름 매칭에 의존한다. 데이터는 생성 후 변하지 않는 이벤트성 주기로 분류돼 있어 상시 갱신을 전제로 쓰지 않는다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회까지 쓸 수 있다.
