description_portal: 부산시에서 운영되는 전시 목록 데이터를 개방합니다전시는 예술 작품, 물품, 정보, 사진 등을 사람들에게 공개적으로 보여주기 위해 마련된 행사나 공간을 말합니다. 전시의 목적은 작품을 감상하게 하거나, 지식을 전달하거나, 상업적 목적(판매)을 위한 경우도 있습니다. 개방되는 데이터는 공연번호, 제목, 전시기간, 오픈런 여부, 전시회장 명, 유무료 구분 등의 데이터가 포함됩니다. 시립미술관, 현대미술관, 부산시청 전시실, 해운대 문화회관, 을숙도 문화회관 등 공공 전시실 뿐아니라 다양한 사설 전시실도 포함되어 다양한 전시를 감상할 수 있습니다.
