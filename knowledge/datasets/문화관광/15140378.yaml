summary_user: 이천시시설관리공단이 중리동 공설운동장 안에서 대관하는 체육시설별로 세부시설, 주소, 연락처, 운영시간, 이용요금, 홈페이지를 담은 시설 단위 목록 파일(csv, 약 15KB)이다. 이천 시민이나 동호회가 축구·풋살·그라운드골프 경기나 체육행사를 열 때 어느 시설을 몇 시까지, 얼마에 빌릴 수 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 시설명이나 주소로 맞춰 이어 써야 한다.
description_portal: 이천시시설관리공단 중리동 소재 공설운동장 내 체육시설의 대관 운영 정보입니다. 이천시시설관리공단에서는 축구, 풋살, 그라운드골프 및 각종 체육행사를 위하여누구에게나 유료 개방, 대관하고 있습니다. 만 18세 이상 이천시민은 누구나 대관신청할 수 있으며, 야간에도 이용할 수 있습니다. 하절기와 동절기로 나눠 운영하며, 기존 오후 6시까지 운영하던 것을 개선하여 오후 9시까지 운영시간을 연장하여 이용의 편의를 도모하고 있습니다. 주말과 공휴일도 사전 예약 시 이용이 가능하며, 이천시민의 경우 요금감면을 하고 있습니다. 현재는 방송장비 및 마이크 대여도 가능하기 때문에 체육행사, 각종 행사를 위한 대관장소로도 사용할 수 있습니다.
