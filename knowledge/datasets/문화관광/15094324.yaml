summary_user: 국립무형유산원이 소장한 무형유산 관련 음원자료를 한 건씩 목록으로 담으며, 실측 필드는 자료명(nihcFdNm), 날짜 항목, 상세 페이지 이동 URL 정도로 구성된다. 연구자·교육자·일반인이 '전통음악이나 민요 음원 중 무형유산원이 소장한 자료에는 무엇이 있고 어디서 열람하나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자료명 같은 이름 매칭이나 같은 기관의 다른 소장자료 목록과 나란히 놓는 방식으로만 잇는다.
limits: 조인 키가 없어 무형유산 종목·보유자 데이터와 코드로 바로 연결할 수 없고 이름 매핑에 의존해야 한다. 포털 설명에 나오는 전승자·채록 장소·음원 길이 등 상세 항목은 실측 필드 목록에 보이지 않으므로 목록 응답만으로 얻는다고 가정하지 않는다. 개발계정은 하루 500회 호출로 제한된다.
