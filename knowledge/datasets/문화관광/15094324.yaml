description_portal: 입력 파라미터를 이용하여 소장 음원자료 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_소장 음원자료 정보 목록 조회 서비스는 무형문화유산과 관련된 전통음악·민요·의례·의식·구전 등 다양한 분야의 음원 자료를 체계적으로 수집·디지털화하여 누구나 온라인으로 열람할 수 있도록 제공하는 플랫폼입니다. 이 서비스는 각 음원의 제목, 전승자·연주자 정보, 채록 또는 녹음 일시 및 장소, 음원 길이, 음질 수준, 관련 무형유산 분류, 설명 및 키워드 등을 상세하게 안내하며 사용자는 검색 기능과 필터를 통해 특정 유산군, 지역, 유형, 채록 시기 등을 기준으로 자료를 손쉽게 찾고 스트리밍하거나 다운로드할 수 있습니다. 또한 원음의 음질 보존을 위해 원본 및 복원 파일을 함께 제공하며, 연구자·문화예술교육자·전승교육사·일반인들이 학술연구, 교육자료, 디지털 전시, AR/VR 문화콘텐츠 제작 등에 활용할 수 있는 중요한 디지털 문화자원입니다.
