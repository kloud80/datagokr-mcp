summary_user: 게임물관리위원회가 사전 공표하는 행정 정보의 목록을 파일 한 건당 한 행으로 담는다. 행마다 분야(등급분류·경영·사후관리·감사), 세부 주제, 파일명, 파일 형식, 입력일자가 들어 있다. 연구자나 업계 관계자가 "위원회의 수의계약 현황이나 불법 게임물 신고 포상금 지급 내역은 어느 공표 파일에 있나"를 찾을 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키는 없으므로, 게임 등급분류 등 같은 기관의 다른 데이터와는 주제명이나 기관 기준으로만 맞춰 본다.
description_portal: 본 데이터는 게임물관리위원회가 「공공기관의 정보공개에 관한 법률」에 의거하여 국민의 알 권리 보장과 투명한 행정 운영을 목적으로 사전 공표하는 행정 정보의 목록을 담고 있습니다. 2015년부터 2026년(예정)까지의 위원회 주요 활동 내역을 포괄하며, 크게 등급분류, 경영, 사후관리, 감사라는 네 가지 핵심 분야로 체계화되어 있습니다.먼저 "등급분류" 분야에서는 게임물 등급분류 결정 현황과 연감 등 위원회의 가장 본질적인 업무 결과를 제공합니다. "경영" 분야에서는 2020년부터 2025년까지의 분기별 수의계약 체결 현황을 비롯해, 임직원의 미국, 일본 등 국외 출장 계획 및 결과 보고서, 인사 채용 정보, 윤리경영 이행지침 등 기관 운영의 투명성을 확인할 수 있는 자료들이 포함되어 있습니다.가장 방대한 비중을 차지하는 "사후관리" 분야는 건전한 게임 생태계 조성을 위한 실무 기록들입니다. 여기에는 불법 게임물 신고 포상금 지급 내역, 등급분류 게임물에 대한 상시 모니터링 및 점검 결과, 게임물 분석 및 감정 내역, 그리고 관련 사업자와 유관기관을 대상으로 실시한 사후관리 교육 현황 등이 상세히 수록되어 있습니다. 마지막으로 "감사" 분야를 통해 임직원 청렴 교육 현황과 같은 내부 통제 및 윤리 경영 관련 지표를 공개하고 있습니다.이 데이터는 정보의 대분류(구분), 세부 주제(서브타이틀), 다운로드 가능한 실제 파일명, 파일 포맷(HWP, PDF, XLS 등), 그리고 정보 입력 일자 등 5가지 항목으로 구성되어 있어 사용자가 필요한 정보를 직관적으로 탐색할 수 있습니다. 이를 통해 연구자나 업계 관계자, 일반 시민들은 별도의 정보공개 청구 절차를 거치지 않고도 위원회의 예산 집행 내역과 정책 추진 현황을 손쉽게 파악하고 활용할 수 있습니다.
