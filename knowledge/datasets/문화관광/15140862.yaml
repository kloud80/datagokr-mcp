summary_user: 서울특별시 광진구 내 당구장업 인허가 업소를 한 건씩 담은 원천 명부로, 업소명·인허가일자·폐업일자·영업상태·지번/도로명 주소·중부원점TM 좌표(X, Y)·시설 면적 등을 포함한다. 광진구에서 현재 영업 중인 당구장이 어디에 몇 곳 있는지, 최근 어느 업소가 폐업했는지를 확인하려는 주민·창업 예정자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 체육시설업 인허가 명부와 함께 민간 체육시설·상권 축으로 묶어 쓴다.
description_portal: 본 데이터는 서울특별시 광진구 내 당구장업 인허가 현황에 관한 정보를 제공하는 자료입니다. 당구장업은 당구 게임을 즐기기 위해 필요한 테이블, 큐대, 당구공 등의 설비를 갖추고, 이를 일반인에게 이용할 수 있도록 제공하는 업소를 의미합니다.제공 항목에는 업소명, 영업자명, 인허가일자, 소재지 주소, 영업상태, 관리번호, 업종 구분 등 당구장 관련 주요 정보가 포함되어 있어, 문화 여가시설 관리, 공공안전, 인허가 현황 파악 및 정책 수립 등에 활용될 수 있습니다.※ 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준의 좌표로 제공되며, 위경도는 포함되어 있지 않습니다.※ 본 데이터는 3일 전 기준의 최신 자료를 기반으로 제공됩니다.
