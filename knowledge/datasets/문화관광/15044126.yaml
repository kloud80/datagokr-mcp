description_portal: '서울월드컵경기장은 공공체육시설로서의 기능 외에도 대규모 상업시설과 편의시설이 함께 입점해 있는 복합 운영 구조를 갖추고 있습니다. 서울시설공단은 경기장의 지속 가능한 재정 운영을 도모하고, 시민들에게 다양한 생활 편의 서비스를 제공하기 위해 경기장 내 수익시설 현황을 주기적으로 관리하고 있으며, 이를 데이터화하여 투명한 운영 기반을 마련하고자 본 자료를 수집·정비하였습니다.본 데이터는 서울월드컵경기장 내 입점한 수익시설에 대한 정보를 중심으로 구성되어 있으며, 아래와 같은 항목들을 포함합니다.(1) 시설명: 할인점, 복합영상관, 사우나, 예식장, 식음매장 등 공간 유형(2) 업체명: 각 편의시설을 운영하는 민간 사업자(3) 대부면적(㎡): 임대된 면적 단위로, 공간 운영 규모 파악 가능(4) 매장구성: 주요 입점 구성(수영장, 헬스장, 영화관 등 세부 내용)(5) 연간대부료: 계약 기준 연 단위 수익 정보(6) 대부기간: 시작일, 종료일, 총 계약 기간(년, 월)이 데이터는 다음과 같은 활용 가치를 가집니다.행정기관 및 정책 부서에서는 공공시설 내 수익 공간의 활용성과 임대수익 구조를 분석하여 적정 임대료 설정, 재계약 기준 수립, 민간참여 유도 등을 위한 기반자료로 활용할 수 있습니다.민간기업 및 사업자들은 유사한 공공시설 대부사업 참여 시, 기존 사례를 참고하여 사업성 분석, 입찰 준비 등에 실질적인 참고자료로 삼을 수 있습니다.연구기관 및 학계에서는 도시시설 내 수익시설 배치, 활용률, 면적 대비 수익효율 분석 등을 통해 공공시설 자산관리 및 운영모델 연구에 활용 가능하며, 시민들은 월드컵경기장의 공간 활용 현황을 투명하게 확인할 수 있습니다.'
