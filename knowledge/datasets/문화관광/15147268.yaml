summary_user: 동대문구에 신고된 무도학원업(국제표준무도 교습업) 사업장을 업소 한 곳당 한 행으로 담는 인허가 명부로, 상호명·도로명/지번주소·인허가일·폐업일·영업상태·좌표 등을 포함한다. 동대문구에서 현재 영업 중인 볼룸댄스 학원이 어디인지, 최근 문을 열거나 닫은 곳이 있는지 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 체육시설업 인허가 데이터나 상권 데이터와는 상호명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓴다.
description_portal: "▶ 동대문구 무도학원업 정보를 제공합니다.(상호명, 도로명주소, 지번주소, 영업여부 등)▶ 무도학원업은 「체육시설의 설치·이용에 관한 법률」에서 규정한 체육시설업의 한 종류로, 수강료 등 대가를 받고 국제 표준 무도 과정을 교습하는 업을 말합니다.▶ 주요 내용- 국제표준무도(볼룸댄스) 교습 : 왈츠, 탱고 등 국제적으로 인정되는 경기용 춤을 가르치는 것이 주된 목적- 유료 서비스 제공 : 수강료 등을 받고 국제표준무도 과정을 교습하는  업종- 체육시설업 신고 : '무도학원'으로 등록된 경우, 「체육시설의 설치ㆍ이용에 관한 법률」에 따라 신고·등록 대상이 됩니다▶ 무도학원업은 신고체육시설업에 해당하므로, 사업자는 관할 구청에 체육시설업 신고를 해야 합니다.▶사업자가 제출해야 할 서류에는 체육시설업 신고서, 임대차계약서, 시설 평면도 등이 있습니다."
