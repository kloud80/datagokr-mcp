summary_user: 저작권자를 찾을 수 없거나 협의가 성립되지 않아 보상금을 내고 저작물을 이용하는 법정허락의 승인 건수를 연도별(2012~2024년)로 집계한 전국 단위 통계 파일로, 행은 전체와 음악·어문·영상·기타 저작물 구분이다. 저작권 정책 담당자나 연구자가 '권리자 불명 저작물의 법정허락 이용이 해마다 늘고 있는지, 어느 분야에서 많은지'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 저작권 통계와는 연도와 저작물 분야 이름을 맞춰 붙여 쓴다.
description_portal: 법정허락은 저작권법 제5절(저작물 이용의 법정허락)에 의해 상당한 노력을 기울였어도 공표된 저작물의 저작재산권자나 그의 거소를 알 수 없어 그 저작물의 이용허락을 받을 수 없는 경우 또는 특별한 목적으로 저작물을 이용하고자 저작재산권자와 협의하였으나 협의가 성립되지 아니하는 경우 별도로 정하는 기준에 의한 보상금을 지급하고 이용할 수 있도록 하는 제도로서 이에 대한연도별로 법정허락건(전체)건수로 음악(승인저작물), 어문(승인저작물), 영상(승인저작물), 기타(승인저작물)구분하여 추출한 통계자료이다
