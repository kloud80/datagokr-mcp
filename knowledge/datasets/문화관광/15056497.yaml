summary_user: 경기도 내 공공 하키장(필드하키·인라인하키)을 시설 한 곳당 한 행으로 담으며, 시군명·소유/운영기관·부지·연면적·경기장 바닥재와 규격·관람석과 수용인원·준공연도·건설사업비·주소와 위경도를 포함한다. 생활체육 동호인이 우리 시군 근처 하키장 위치와 연락처를 찾거나, 분석가가 시군별 하키 인프라 규모와 노후도를 비교하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 위경도로 다른 경기도 체육시설 현황 데이터와 이어 붙인다.
description_portal: 이 데이터는 경기도 내 공공 하키장(필드하키 및 인라인하키) 시설의 현황을 기록한 자료로 시설명, 시군명, 소유기관, 운영 및 관리주체, 부지면적, 건축·연면적, 수용인원, 좌석형태, 준공연도, 건설사업비, 위치정보(지번·도로명 주소, 위도·경도) 등의 정보를 포함하고 있습니다. 주요 항목으로는 ‘연면적(㎡)’, ‘수용인원수(명)’, ‘건설사업비(백만원)’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며,지역 체육 인프라 구축 및 종목별 시설 분석, 하키 활성화를 위한 정책 수립 등에 활용될 수 있습니다.일부 시설은 ‘종합운동장’ 또는 ‘레포츠센터’에 포함되어 있으며, ‘비고사항’에 해당 내용이 표기됩니다. 연도별 준공 정보와 좌석 구성은 경기장 규모 및 이용 계획 수립에 참고할 수 있으며, 일부 항목은 누락값이 있어 주의가 필요합니다.
