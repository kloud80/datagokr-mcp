description_portal: 이 데이터는 경기관광공사에서 운영하는 경기관광누리집(https://ggtour.or.kr/main.php)에 등록된 관광 이미지에 대한 목록으로, ZIP 파일 형태로 제공되며 내부에 다수의 CSV 파일이 포함되어 있습니다. 주요 콘텐츠는 관광 메인이미지, 다국어 메인이미지, 디자인 시안 관리자료, 경기도 명소 100선의 계절별 이미지 목록 등으로 구성되어 있습니다. 각 CSV 파일은 이미지명, 파일경로, 설명, 분류 등 항목별로 정리되어 있으며, 누리집 콘텐츠 관리를 위한 기준 정보 제공을 목적으로 합니다. 공공데이터 활용자 및 관광 콘텐츠 운영자에게 유용한 참고자료입니다.
