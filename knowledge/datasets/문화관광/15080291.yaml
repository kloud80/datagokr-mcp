summary_user: 서울 용산구 공원에 설치된 실외(야외) 운동기구를 공원 단위로 담은 건별 원천 파일로, 공원명·공원구분·설치주소·위도·경도·운동기구 종류·관리기관·전화번호를 담는다(CSV 약 5KB). 주민이나 생활체육 분석가가 '우리 동네 어느 공원에 어떤 운동기구가 있나'를 찾거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어서 위도·경도나 주소로 다른 공원·체육시설 데이터와 공간 결합하거나 공원명으로 이름 매칭해 잇는다.
description_portal: 서울특별시 용산구에서 운영, 관리중인 실외운동기구, 야외운동기구에 관한 공공데이터입니다. 이 정보에는 용산구에서 운영 관리중인 실외 운동기구 및 야외 운동기구에 대한 세부사항이 포함되며, 각 운동기구의 위치, 운동 기구의 종류 및 개수 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구의 공공체육시설 정보 또는 공공체육시설에 대한 정보가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
