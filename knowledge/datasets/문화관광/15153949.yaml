description_portal: 지역어 종합 정보 누리집에서는 생활어와 관련된 지역어 정보를 사진과 함께 제공하고 있습니다. 생활어의 여러 주제를 목록으로 제공하고, 주제와 연관되어 있는 여러 생활어의 설명을 사진 정보로도 확인할 수 있습니다. "사진으로 보는 생활어"에서는 생활어의 조사 지역 정보도 제공하여, 해당 생활어의 쓰임을 파악할 수 있습니다. 이를 통해 지역별 생활어의 특징을 알아 보고, 언어학 연구자뿐만 아니라 교사, 학생, 일반인도 생활어의 분포를 쉽게 파악할 수 있습니다. 나아가 사진을 통해 지역별 생활어의 쉬운 이해와 언어 다양성 증진에 기여할 수 있습니다.
