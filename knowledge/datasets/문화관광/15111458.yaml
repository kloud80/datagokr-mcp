summary_user: 광주광역시 문화관광해설 장소별로 운영하는 문화관광 프로그램을 시설·행사 단위로 담은 건별 파일 데이터로, 시설명·주소·위경도와 행사명·프로그램 내용·입장료(무료 여부·가격·할인) 정보를 함께 담는다(CSV 약 246KB). 관광객이나 여행 기획자가 광주에서 해설이 붙는 문화관광 프로그램이 어디서 열리고 입장료가 얼마인지 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명·도로명 주소·위경도로 매칭해 이어 쓰며, 지도나 주변 관광지·문화시설 데이터와 좌표 기준으로 겹쳐 보는 방식이 현실적이다.
limits: 공통 식별 코드(문화시설 코드 등)가 없어 다른 데이터셋과는 이름·주소 매칭에 의존해야 한다. 명세상 수시·이벤트성으로 생성 후 바뀌지 않는 파일이라 현재 운영 중인 프로그램 일정의 실시간 확인에는 맞지 않으며, 프로그램 연도와 데이터 입력 날짜를 확인해 써야 한다.
