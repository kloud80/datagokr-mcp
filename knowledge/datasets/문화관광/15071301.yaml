summary_user: 국립아시아문화전당 공연 예매에 쓰인 가상계좌의 거래를 은행별·월별로 묶어 거래건수와 거래금액을 담은 집계 파일로, 건별 예매 원천이 아니며 파일 크기는 약 1.3KB로 작다. 전당 운영 담당자나 분석가가 어느 은행 가상계좌로 예매 결제가 많이 들어왔는지, 월별 예매 입금 규모가 어떻게 달라졌는지 볼 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 직접 연결되지 않으며, 다른 데이터와는 월과 은행 이름을 맞추거나 같은 기관(국립아시아문화전당) 자료끼리만 이어 본다.
limits: 공연별·관객별 예매 내역이 없어 어떤 공연이 얼마나 팔렸는지는 알 수 없고, 가상계좌 결제분만 담는다. 명세상 수시·이벤트 주기로 만든 뒤 바뀌지 않는 파일이라 최신 월이 계속 이어진다고 기대하면 안 된다. 범위는 비공간 자료여서 지역별로 나눠 볼 수 없다.
