summary_user: 국립청주박물관 소장 유물을 한 점씩 담은 목록으로, 유물명·이칭(alternativeTitle)·크기(extent)·설명·관련 시대와 지역·인물·주제어 같은 서지형 항목을 함께 제공한다. 연구자나 교사, 전시 기획자가 '국립청주박물관에 특정 시대나 재질의 유물이 어떤 것이 있고 어떻게 설명되어 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 시설코드가 없어 다른 박물관 유물 데이터나 문화시설 목록과는 유물명·시대·주제어 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 국립청주박물관이 소장하고 있는 다양한 유물의 정보를 체계적으로 제공하는 데이터셋입니다. 유물의 명칭, 시대, 재질, 크기, 용도 등 주요 정보를 포함하고 있어 역사적 가치와 문화적 의미를 이해하는 데 도움이 됩니다. 연구자, 학생, 일반 시민 등 다양한 이용자가 박물관 유물의 세부 내역을 확인하거나 교육, 연구, 전시 기획 등 여러 목적으로 활용할 수 있습니다. 문화유산의 보존과 전승, 지역 문화 연구, 문화콘텐츠 개발 등에도 유용하게 활용될 수 있으며, 청주 지역의 역사와 문화를 깊이 있게 탐구하는 데 기초 자료로 활용할 수 있습니다.
