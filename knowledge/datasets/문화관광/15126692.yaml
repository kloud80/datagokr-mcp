summary_user: 강원특별자치도 정선군에 등록된 야영장을 한 곳당 한 행으로 담은 등록 현황 파일로, 업종·상호·지번/도로명 주소·전화번호·사이트수·등록일을 개별 업소 단위로 담는다. 캠핑객이나 관광 분석가가 정선군 안에서 어떤 등록야영장이 어디에 있고 몇 개 사이트를 운영하는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소를 맞춰 붙이는 방식으로만 연결한다.
description_portal: 1. 강원특별자치도 정선군 소재지의 등록야영장 현황 데이터를 제공합니다.2. 데이터의 기준일은 2026년 5월 29일 입니다.3. 해당 데이터(강원특별자치도 정선군_야영장)는  업종, 상호, 지번소재지, 도로명소재지, 전화번호, 사이트수 등록일, 데이터기준일의 데이터를 제공합니다.4. 현재 강원특별자치도 정선군 소재의 운영중인 야영장 현황은 총 24개소입니다.5. 데이터의 보유 근거는 「관광진흥법」 제4조 제1항( 제3조제1항제1호부터 제4호까지의 규정에 따른 여행업, 관광숙박업, 관광객 이용시설업 및 국제회의업을 경영하려는 자는 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)에게 등록하여야 한다. )에 근거을 근거로하여 보유하고 있습니다.6. 해당 관련 업무는 정선군청 시설국 관광과 관광기획팀에서 담당하고 있으며, 문의사항은 033-560-2569로 문의주시기 바랍니다.
