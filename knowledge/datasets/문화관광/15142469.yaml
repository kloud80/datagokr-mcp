summary_user: 전국 자치단체가 주요 교통시설·관광지에 둔 공영 물품보관함을 보관함 단위로 담은 API로, 설치 위치·주소·좌표·운영시간 같은 기본정보, 칸 종류·크기·요금·결제수단 같은 상세정보, 실시간 이용현황을 나눠 제공한다. 여행객이나 관광 서비스 개발자가 '지금 이 역이나 관광지 근처에 짐을 맡길 수 있는 보관함이 어디 있고 요금과 운영시간은 어떤가'를 확인하는 데 쓴다. 오퍼레이션끼리는 물품보관함 아이디(stlckId)로 기본정보와 상세정보를 잇고, 다른 데이터와는 전역 조인 키가 없어 지자체 코드·시군구명 같은 이름 매핑이나 위경도 좌표로 연결한다.
description_portal: 자치단체에서 운영되고 있는 주요 교통시설 및 관광지에 비치된 공영 물품보관함의 기본정보 및 보관함의 상태를 비롯한 실시간 이용가능한 물품보관함의 정보를 제공 합니다. 제공되는 정보는 설치 위치 및 주소 등 공영 물품보관함의 기본 정보를 담은 "공영 물품보관함 정보"를 비롯하여 공영 물품 보관함의 갯수 및 규모를 확인할 수 있는 공영물품보관함의 세부정보를 담고있는  "공영 물품보관함 상세 정보", 마지막으로 현재 공영 물품보관함의 이용내역을 실시간으로 확인할 수 있는  "공영 물품보관함 실시간 현황정보"를 제공합니다.
