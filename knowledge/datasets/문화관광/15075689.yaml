description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 고성신양해녀의길은 제주 서귀포시 성산읍 섭지코지 인근 해안산책로로, 휠체어 접근 가능한 해안 보행로와 완만한 산책 구간을 갖추고 있어 교통약자와 유모차 동반 가족도 제주 바다와 성산일출봉 전경을 감상하며 산책할 수 있도록 설계된 열린관광지이며 과거 해녀들이 물질하던 해안가의 역사적 공간과 해녀 문화의 흔적이 남은 장소로, 자연 경관과 문화 heritage 가 결합된 관광지로 무장애 여행 안내, 관광 코스 설계, 문화유산 보존 및 관광 콘텐츠 제작 등에 활용 가능한 유의미한 자원이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
