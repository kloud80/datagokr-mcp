summary_user: 군포시 관내에 있는 수영장·체육도장·체력단련장·당구장·가상체험 체육시설·체육교습업 등 민간 체육시설업을 업소 한 곳당 한 행으로 담은 명부 파일입니다. 허가번호, 상호명, 소재지주소, 전화번호, 면적, 데이터기준일자가 들어 있습니다. 주민이나 사업자가 "군포시 어느 동네에 헬스장·태권도장이 몇 곳 있고 규모는 어떤가"를 확인하거나, 분석가가 상권 분석에서 체육시설 분포를 볼 때 씁니다. 전역 공통 조인 키는 없어서, 다른 데이터와는 소재지주소나 상호명을 맞추거나 허가번호로 같은 기관 자료끼리만 이어 씁니다.
description_portal: '군포시 체육시설업 현황에 대한 데이터입니다. 체육시설업종에는  수영장업, 체육도장업(권투, 레슬링, 태권도, 유도, 검도, 우슈, 합기도), 체력단련장업, 당구장업, 무도장업, 무도학원, 가상체험 체육시설(골프, 야구), 체육교습업(농구, 롤러스케이트, 배드민턴, 빙상, 수영, 야구, 줄넘기, 축구) 및 인공암벽장업이 있습니다. 현재 군포시 관내에 위치한 체육시설업의 허가번호, 상호명, 소재지주소, 전화번호, 면적, 데이터기준일자 항목을 제공합니다. 관련법령: 체육시설의 설치 이용에 관한 법률, 시행령, 시행규칙을 참고하여주시기 바랍니다'
