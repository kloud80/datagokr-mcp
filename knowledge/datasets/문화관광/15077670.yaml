summary_user: 경기도 전역의 체험관광지를 관광지 한 곳당 한 행으로 담으며, 관광지명·시군명·연락처·기준일자·도로명/지번주소·우편번호·WGS84 위도·경도를 포함한다. 여행객이나 관광 서비스 개발자가 '우리 시군 근처에서 아이와 갈 만한 체험관광지가 어디이고 연락처는 무엇인가'를 찾을 때 쓴다. 전역 조인 키는 없으므로 시군명(sigun_nm)으로 다른 경기도 시군 단위 자료와 이름 매핑하거나, 위도·경도 좌표로 지도·주변 시설 자료와 위치 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 전역의 주요 체험관광지 정보를 담고 있으며, 각 관광지의 명칭(관광정보명), 위치한 시군명, 연락처, 기준일자, 정제된 도로명주소 및 지번주소, 우편번호, 그리고 공간정보(WGS84 기준 위도 및 경도 좌표)를 포함합니다. 데이터는 문화체험, 교육체험, 자연체험 등 다양한 체험 활동이 가능한 관광지를 대상으로 하며, 관광 콘텐츠 개발, 체험형 관광 마케팅, 지역 관광 활성화 전략 수립에 활용될 수 있습니다. 또한 관광객 맞춤형 추천 서비스 및 체험지 정보 제공 시스템 구축 등에 필요한 기초자료로서 유용합니다.
