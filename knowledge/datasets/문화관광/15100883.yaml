summary_user: 한국체육산업개발이 만든 홍보동영상 목록을 영상 한 건 단위로 담으며, 제목·등록일·설명·주제어·권리 정보 등 메타데이터를 제공하고 범위는 전국·비공간이다. 기관 홍보 자료를 찾는 기자·연구자나 콘텐츠 담당자가 "비전선포식이나 일자리 홍보 영상이 언제 어떤 내용으로 올라왔나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·주제어 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국체육산업개발 홍보동영상 목록입니다. 홍보동영상에 대한 데이터로 등록일, 관련동영상 링크주소, 제목, 내용 , 첨부파일 등 항목을 제공합니다.한국체육산업개발 홈페이지에 들어가시면 홍보동영상관련 정보 확인이 가능합니다.https://www.ksponco.or.kr/gallery.es?mid=a10307000000&bid=00312025년 6월 기준 총 65건의 동영상을 제공하고 있으며, 홍보영상, 비전선포식, 일자리 홍보 동영상, 축구대회 홍보 등 정보를 제공하고 있습니다.
