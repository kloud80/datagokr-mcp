description_portal: 해당 데이터는 2022년 12월 16일 기준, 경상남도 남해군 내 다양한 음식점 정보를 영어로 제공하여 영어권 관광객의 편의를 지원합니다. 각 음식점의 '업소명'(Restaurant Name), '도로명 주소'(Address), '전화번호'(Phone Number) 등 주요 정보가 이해하기 쉬운 영어로 안내되어 식당 선택을 돕습니다.이러한 영어 음식점 정보를 통해 해외 방문객들은 남해의 현지 맛집, 다양한 종류의 식당을 손쉽게 찾아보고, 메뉴, 운영 시간 등을 확인해 방문 계획이 가능합니다. 본 서비스가 영어권 사용자의 풍요로운 남해 미식 경험과 즐거운 여행에 기여하길 바랍니다.
