summary_user: 한국관광 데이터랩의 한국관광통계 중 방한 외래관광객 수를 연도별로 성별·연령·방문목적·교통수단에 따라 나눈 전국 단위 집계 파일(csv)로, 건별 입국 기록이 아니라 기준연도별 인원수를 담는다. 관광 정책 분석가나 관광 사업자가 '방한 외래관광객 중 어떤 연령대·목적의 방문이 해마다 늘고 있는가'처럼 방한 수요 구성의 연도별 변화를 볼 때 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어 다른 데이터와는 기준연도나 성별·연령 등 구분값의 이름 매칭으로만 이어 쓴다.
limits: 전국·비공간 집계라 지역별·관광지점별 분석에는 쓰지 못하고, 관광 통계 부문의 주 연결 키인 관광지점코드·시군구코드로 다른 데이터와 붙일 수 없다. 포털 설명상 승무원은 성별·연령이 구분되어 있지 않고, 거주자·군인·영주·외교 등 일부 체류자격 입국자는 제외되고 재외국민(교포)은 포함되므로 총 입국자 수와 다르다.
