description_portal: 한국수목원정원관리원은 전국 80여 개 정원의 이용자 편의성과 접근성 향상을 위해 무장애 이동 관련 정보를 공공데이터로 제공합니다.이 데이터는 각 정원에 마련된 장애인 우선 공간, 여성 배려 공간, 전기차 충전소 등의 설치 여부를 포함하고 있으며, 정원을 방문하는 이동약자, 고령자, 일반 관람객의 편리한 접근을 지원합니다. 특히 관광지 내 친환경 교통 인프라 확대와 사회적 약자를 위한 이용환경 개선을 위한 기초자료로 활용됩니다.데이터는 CSV 형식으로 제공되며, 주요 항목은 정원명, 공간 위치, 우선 이용구역 유무, 친환경 설비 보유 여부 등이 포함됩니다.구체적으로는 장애인 우선 공간 여부, 여성 배려 공간 보유 여부, 전기차 충전소 보유 여부 등이 있으며, 다양한 주체가 활용 가능한 사용자 중심의 안내정보를 제공합니다. 해당 데이터는 지자체의 포용적 관광정책 수립, 친환경 기반시설 확대, 공공 및 민간 관광 서비스 고도화 등에 실질적으로 기여할 수 있습니다.이 데이터는 모두를 위한 편의 환경 조성, 접근성 기반 공공시설 운영, 지속 가능한 관광 생태계 마련을 위한 기반 자료로 활용도가 높습니다.
