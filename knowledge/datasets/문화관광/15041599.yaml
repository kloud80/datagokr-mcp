summary_user: 광화문 CKL기업지원센터에 입주한 콘텐츠·스타트업 기업을 한 기업당 한 행으로 담은 목록 파일로, 입주 연도·기업명·대표자·기업 소개·분야·홈페이지가 들어 있다(CSV 약 19KB). 콘텐츠 분야 투자자나 연구자가 "어느 해에 어떤 분야의 콘텐츠 기업이 센터에 입주했는가"를 확인하거나 협업·네트워킹할 기업을 찾을 때 쓴다. 사업자번호 같은 전역 조인 키가 없어서, 다른 기업 데이터와 연결하려면 기업명이나 분야 이름을 직접 맞춰야 한다.
limits: 기업을 식별하는 공통 코드가 없다. 그래서 다른 기업·산업 데이터와 연결할 때는 기업명 문자열 대조에 의존해야 하며, 이 과정에서 동명이나 표기 차이로 오매칭이 생길 수 있다. 위치 좌표나 행정구역 정보가 없어 지역별 분석에는 쓸 수 없다.
