summary_user: 수원월드컵경기장에서 열린 문화공연·축제·콘서트·체육대회 등의 행사를 한 건씩 담은 자료로, 행사 기간·장소·시간·행사명·주요내용·참여방법·입장객 수(audenc_cnt)를 기록한다. 지역 주민이 경기장에서 어떤 무료·유료 행사가 열렸는지 확인하거나, 분석가가 행사 종류별 입장객 수로 경기장 활용도를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설·행사 데이터와는 행사명이나 장소 이름을 맞추거나 같은 기관(경기도) 자료끼리만 이어 쓸 수 있다.
description_portal: 이 데이터셋은 경기도 수원월드컵경기장에서 개최된 다양한 행사 운영 현황을 정리한 자료로, 행사 기간, 장소, 시간, 행사명, 주요내용, 참여방법, 입장객 수 등의 정보를 담고 있습니다. 이를 통해 경기장 내에서 진행된 문화공연, 축제, 콘서트, 체육대회 등 다채로운 프로그램의 운영 실태와 시민 참여 현황을 파악할 수 있으며, 무료 개방 행사부터 유료 예매 공연까지 다양한 참여 방식이 포함되어 있습니다. 또한 행사별 입장객 수가 함께 기록되어 있어 경기장의 활용도와 지역사회 문화·체육 활동 참여도를 분석하는 데 유용한 자료입니다.
