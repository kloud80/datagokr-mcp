summary_user: 인천 부평구가 지정한 맛집을 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·소재지 주소·지정메뉴·전화번호·업태(한식·중식 등)가 들어 있다. 주민이나 관광객이 '부평구에서 구가 추천하는 한식집은 어디이고 대표 메뉴는 무엇인가'를 찾거나, 분석가가 업태별 맛집 분포를 살피는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 업소명이나 소재지 주소를 맞춰 보는 방식으로만 연결된다.
limits: 부평구 한 곳만 다루므로 다른 시군구와 비교하려면 지자체별 파일을 따로 모아야 한다. 공통 코드(사업자번호·TourAPI contentId 등)가 없어 음식점 인허가나 관광 콘텐츠 데이터와 붙이려면 이름·주소 매칭이 필요하다.
