summary_user: 서울 광진구에서 인허가를 받은 공연장을 한 곳씩 담은 건별 인허가 목록으로, 관리번호(MGTNO)·사업장명·인허가일과 취소일·영업상태·폐업일·지번과 도로명 주소·좌표·층수·시설면적 등을 담는다. 구민이나 문화행정 담당자가 광진구에서 현재 영업 중인 공연장이 어디이고 언제 인허가를 받았는지, 시설 규모는 어떤지 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연장ID와 같은 외부 코드로는 바로 붙지 않으며, 공연장명이나 주소로 매핑하거나 좌표로 지도에 올려 다른 데이터와 맞춘다.
description_portal: 이 데이터는 서울특별시 광진구 관내에 인허가를 받은 공연장 현황 정보를 제공합니다. 광진구 지역에 위치한 각 공연장의 공연장명을 통해 시설을 식별할 수 있으며, 주소 항목은 실제 공연장의 위치 정보를 나타내어 지도 연계 및 접근성 분석 등에 활용할 수 있습니다. 좌석수는 공연장의 수용 가능 인원을 보여주는 항목으로, 공연 규모나 시설 규모를 비교하는 데 유용합니다. 전화번호는 공연장 이용 문의, 대관 상담 등 민원 응대 및 시설 이용 편의성을 높이는 데 필요한 기본 연락처 정보를 포함합니다. 이 데이터는 공연장에 대한 행정 관리, 문화 인프라 분포 분석, 문화시설 접근성 향상, 지역문화 활성화를 위한 기초 자료로 활용할 수 있으며, 문화예술 관계자, 시민, 행정기관 등 다양한 수요자에게 제공됩니다. 인허가 기반 데이터이므로 시설 운영의 적법성과 안전성도 확인할 수 있습니다.
