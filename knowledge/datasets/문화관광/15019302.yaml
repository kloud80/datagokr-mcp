summary_user: 광주광역시 주요관광지점(국가승인통계 대상 지점)을 찾은 내·외국인 방문객 수를 방문기간(시작일·종료일)별로 유료·무료 지점으로 나눠 담은 집계 파일(CSV, 약 6KB)이다. 지역 관광 담당자나 분석가가 광주를 찾는 관광객이 월별로 얼마나 늘고 줄었는지, 유료와 무료 관광지 방문 비중이 어떻게 다른지 확인하는 데 쓴다. 실측 컬럼에는 관광지점코드나 시군구코드 같은 공통 조인 키가 없어서, 다른 관광 통계와는 기간(방문기간)과 지역명을 직접 맞춰 이어 써야 한다.
description_portal: '- 관광지점이란 관광진흥법 등 관광 관련 법령을 근거로 분류된 주요 관광지 중 지자체 관광진흥 정책상 중요하다고 판단되는 대표 지점으로서 국가승인통계 대상지로 지정된 지점입니다.- 본 데이터는 광주광역시의 주요관광지점을 방문한 내·외국인 방문객의 월별 현황이며 유료 및 무료 관광지점을 구분하여 정리한 것입니다.- 「주요관광지점 입장객통계」는 국가승인통계 승인번호 제113005호로 지정·생산되고 있으며, 매분기 종료 후 관광지식정보시스템을 통해 잠정치가 공표되고, 매년 6월에 전년도 확정치가 공표됩니다.'
