summary_user: 경상북도 울진군 안에 있는 국가지정·도지정·국가등록 유산을 한 건씩 담은 목록 파일로, 지정 구분(지정명)·종별(국보·보물·천연기념물 등)·번호·유산명·수량·지번/도로명 주소·지정일자를 담는다. 울진군에 어떤 보물이나 천연기념물이 어느 주소에 있고 언제 지정됐는지 확인하려는 주민·여행자·지역 문화유산 담당자가 쓴다. 전역 조인 키나 국가유산청 코드(종목코드·지정번호·시도코드)가 없으므로, 국가유산청 API나 다른 목록과는 종별+번호+유산명 매칭이나 주소 기반으로만 이어 쓴다.
description_portal: 경상북도 울진군 지정국가유산 현황 데이터는 지역 내 등록된 국가유산을 지정명별, 종별, 번호별, 국가유산명, 수량, 지번주소, 도로명주소, 지정일자등으로 분류하여 통계적으로 제공하는 자료입니다. 지정명별 항목은 국가지정유산, 도지정유산 및 문화유산자료, 국가등록유산등을 구분하며, 종별 항목은 국보, 보물, 천연기념물, 유형문화유산, 자연유산, 기념물, 민속문화유산등으로 나누어 국가유산을 파악할 수 있도록 합니다. 국가유산명은 해당 국가유산의 명칭을 제공하며, 지번 주소 및 도로명주소별 항목에는 각 국가유산의 주소를 구분하고 있으며. 지정일자는 국가유산의 지정일자에 대한 자료를 포함하고 있습니다. 이 데이터는 울진군 국가유산 관리 및 국가유산의 재난·안전 관리등 다양한 분야에서 활용될 수 있으며, 국가유산에 대한 활성화 정책 수립에도 기여할 수 있습니다.
