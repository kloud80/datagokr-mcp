summary_user: 부산광역시 영도구 안의 국가지정유산(사적·명승·보물)과 시지정 문화유산을 한 건씩 나열한 소규모 목록 파일로, 지정구분·종별·분야·지정번호·명칭·제작연도·지정일자·소유자를 담는다(CSV 약 2KB). 영도구에 어떤 지정 유산이 있고 언제 지정됐으며 누가 소유하는지 확인하려는 주민·연구자·지역 관광 기획자가 쓴다. 전역 조인 키가 없어 국가유산청 목록 API 등과는 명칭이나 지정번호(관리(지정)번호)를 이름·코드 매핑으로 맞춰 이어 써야 한다.
description_portal: '부산광역시 영도구 국가유산 현황(지정구분, 종별, 분야, 지정번호, 명칭, 지정일자 등)에 대한 정보를 제공하고 있습니다.- 제공되는 자료 : 국가지정유산(사적, 명승, 보물) 및 시지정 문화유산(유형문화유산, 문화유산자료, 민속문화유산 등)영도구 대표 홈페이지에서는 각 국가유산의 현황의 사진, 위치, 지리정보 등을 확인할 수 있으며, 문화체육관광 메뉴에서 확인하실수 있습니다. *부산광역시 영도구에서는 지역 내 국가유산의 지정구분, 종별, 분야, 지정번호, 명칭, 지정일자 등 다양한 현황 정보를 종합적으로 제공하고 있습니다. 제공 자료에는 사적·명승·보물 등 국가지정유산과 더불어 시지정 유형문화유산, 문화유산자료, 민속문화유산 등이 포함됩니다. 영도구 대표 홈페이지의 문화체육관광 메뉴에서는 각 유산의 사진, 위치, 지리정보 등을 한눈에 확인할 수 있어 이용자의 편의를 높이고 있습니다.'
