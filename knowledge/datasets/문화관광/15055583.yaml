summary_user: 전북특별자치도에 법적으로 등록된 전통사찰을 사찰 한 곳당 한 행으로 담은 파일(csv, 약 7KB)로, 시군·사찰명·상세 주소·소속 종단·등록번호를 기록한다. 연구자나 여행자가 "우리 시군에 등록된 전통사찰은 어디이고 어느 종단 소속인가"를 확인하거나, 도내 불교 유산 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 시군명이나 주소를 기준으로 다른 시군 단위 자료나 지도 좌표 자료와 이름 매칭으로 잇는다.
description_portal: 전북특별자치도 내에 법적으로 등록된 전통사찰의 현황을 정리한 데이터입니다. 이 자료는 각 시군에 위치한 사찰의 명칭, 상세 주소, 조계종이나 태고종 등 소속 종단, 그리고 고유 등록번호를 포함하고 있어 지역 내 불교 문화유산의 분포 현황을 정확하게 파악할 수 있습니다. 이 데이터는 문화재를 관리하거나 역사를 연구하는 전문가뿐만 아니라, 템플스테이나 사찰 순례 등 문화 관광에 관심 있는 일반인에게도 유용한 정보를 제공합니다. 지역의 소중한 역사·문화 자원을 보존하고 그 가치를 널리 알리는 데 기여하는 기초 자료입니다.
