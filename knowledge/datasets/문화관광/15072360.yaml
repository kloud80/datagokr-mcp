description_portal: '○ 통계개요* 통계명 : 주로 이용하는 운동 장소* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축 및 분석을 실시함으로써서울의 현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전수준을 모니터링 하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서느끼는 정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을제시하는데 목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민 성별·연령별·지역별 등의 주로 이용하는 이동 장소○ 용어설명○ 기 타* 문항 : 귀하께서 주로 운동하시는 장소는 어디입니까?1) 공원 및 산 등의 산책로 2) 지자체 및 공공기관 운영 시설(문화센터 등)3) 학교체육시설 4) 민간상업체육시설(헬스클럽, 피트니스, 요가 등)5) 직장내 체육시설 6) 집에서 간단한 운동(스트레칭 등) 7) 기타* 해당연도가 없는 것은 그해 조사항목에서 제외된 것임'
