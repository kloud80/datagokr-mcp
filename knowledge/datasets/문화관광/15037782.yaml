summary_user: 한국방송광고진흥공사가 운영하는 한국광고박물관의 2014년 이후 이용자 수를 기준연월·기준일별로 이용자구분(어린이·청소년·대학생·성인)과 개인/단체 구분에 따라 집계한 파일 데이터다. 연구자나 관련 기관이 '광고박물관 방문객은 연도·월별로 어떻게 변했고, 단체 관람 비중은 어느 연령층에서 높은가'를 살필 때 쓴다. 실측 컬럼에 시설코드 같은 전역 조인 키가 없어, 다른 문화시설 데이터와는 박물관 이름을 직접 맞추는 방식으로만 이어 쓸 수 있다.
limits: 한국광고박물관 한 곳의 집계라 지역별 비교나 다른 박물관과의 비교에는 쓰기 어렵다. 문화기반시설총람의 시설코드나 좌표가 들어 있지 않아 공간 분석이나 키 기반 결합이 되지 않는다.
