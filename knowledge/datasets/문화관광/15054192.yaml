summary_user: 대구광역시에 지정된 관광식당업 업체를 한 행에 한 곳씩 담은 업체 목록 파일(csv, 약 10KB)로, 구군·업체명·소재지 주소·전화번호를 담는다. 관광객이나 여행 기획자가 '대구에서 관광식당으로 지정된 식당이 어느 구군에 어디 있는가'를 확인하거나, 분석가가 구군별 관광식당 분포를 볼 때 쓴다. 전역 조인 키(등록번호·사업자번호 등)가 없어 다른 데이터와는 업체명·주소 문자열 매칭이나 구군 이름 기준으로만 이어 쓴다.
limits: 실측 컬럼에 등록번호·사업자번호 같은 공통 키가 없어 관광사업 등록 원장이나 인허가 데이터와 정확히 맞추기 어렵고, 이름·주소 매칭에 기대야 한다. 범위는 대구광역시 한 곳뿐이며, 포털 설명상 휴대전화 번호 등 일부 업체 연락처는 개인정보 보호로 빠져 있다.
