summary_user: 전국의 연극·뮤지컬·음악·국악·무용·전시 등 문화예술공연을 공연 한 건 단위로 담으며, 제목·분야·기간·장소·요금·문의처·관련 URL·이미지·상세설명·조회수가 들어 있다. 시민이 이번 달 가까운 곳에서 열리는 공연의 일정과 요금을 찾거나, 분석가가 분야별 공연 공급 현황을 살피는 데 쓴다. 실측 컬럼에 KOPIS 공연ID·공연장ID 같은 공통 조인 키가 없어서, KOPIS 공연·공연장 데이터와는 공연 제목·장소명을 맞춰 이어 쓴다.
description_portal: 연극, 뮤지컬, 오페라, 음악, 콘서트, 국악, 무용, 전시 등 다양한 분야의 문화예술공연 정보를 한눈에 확인할 수 있도록 통합 제공하는 데이터셋입니다. 공연의 제목, 분야, 기간, 시간, 장소, 금액, 문의 안내, 관련 URL, 이미지(썸네일), 상세 설명, 조회수 등 주요 정보를 포함하고 있어 공연 일정 확인, 예매, 문화예술 관련 연구 및 정책 수립, 홍보 자료 작성 등 다양한 목적으로 활용할 수 있습니다. 문화예술에 관심 있는 일반 시민부터 연구자, 정책 담당자까지 폭넓게 이용할 수 있는 자료로, 최신 공연 동향 파악과 문화 향유 기회 확대에 기여합니다.
