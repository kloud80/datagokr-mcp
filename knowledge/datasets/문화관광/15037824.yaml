summary_user: 인천 송도컨벤시아의 전시장·회의실·볼룸 등 개별 시설을 한 행씩 담은 파일로, 시설구분·시설명·면적(㎡)·9㎡ 기준 부스 수·수용인원·주요시설·문의번호를 담는다. 행사 기획사나 학회·기업 담당자가 '몇 명 규모 회의나 몇 개 부스 전시를 송도컨벤시아 어느 공간에서 열 수 있나'를 따져 볼 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 시설명 같은 이름 매칭이나 같은 기관(인천관광공사) 데이터 단위로만 연결한다.
description_portal: 인천관광공사가 운영하는 송도컨벤시아 관련 시설물 정보를 파일데이터로 제공하고 있습니다.주요 제공정보로는, 시설구분(전시장, 회의실, 볼룸 등), 시설 명칭, 시설면적, 부스개수, 수용가능 인원, 주요시설, 대표연락번호, 기타시설 등입니다.인천관광공사는 공사 공공데이터 개방 및 인천관광 활성화를 위하여 주기적으로 데이터를 현행화하여 제공할 예정입니다.송도컨벤시아 시설물 데이터 관련 문의는 공사홈페이지 및 공공데이터 통합플랫폼를 통해 해주시고,송도컨벤시아 대관 등 유선문의는 송도컨벤시아 원스탑지원센터를 통해 해주시기 바랍니다.
