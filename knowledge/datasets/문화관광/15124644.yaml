summary_user: 전국 공공스포츠클럽별로 소재 시도·시군구와 클럽명, 현재 회원 수를 담은 클럽 단위 현황 파일이며, 회원 수는 성별(남·여)과 연령대(미취학, 초중고생, 60세 이상)로 나뉜다. 지역 생활체육 정책 담당자나 분석가가 "우리 시군구 공공스포츠클럽의 회원 규모와 유소년·고령층 참여 비중은 다른 지역과 비교해 어떤가" 같은 질문에 쓴다. 전역 조인 키나 행정구역 코드가 없어 시도명·시군구명이나 클럽명을 이름으로 맞춰 인구 통계나 공공체육시설 데이터와 연결해야 한다.
description_portal: 대한체육회에서 제공하는 공공스포츠클럽 회원 수 현황 데이터는 전국 공공스포츠클럽의 회원 수에 대한 상세 정보를 담고 있습니다. 이 데이터는 클럽의 위치를 나타내는 시도명과 시군구명, 그리고 클럽명을 제공합니다. 또한, 현재 총 회원 수와 함께 남성회원수, 여성회원수 등 성별 회원의 수, 그리고 미취학회원수, 초중고생회원수, 60세이상회원수 등 연령대별 회원 수를 구체적으로 기록하고 있습니다. 이 데이터를 활용하면 지역별 공공스포츠클럽의 규모와 함께 성별, 연령대별 스포츠 참여 현황을 확인할 수 있습니다.
