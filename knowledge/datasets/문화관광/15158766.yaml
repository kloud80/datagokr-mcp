summary_user: 저작권 보호기간이 끝난 공유(만료) 저작물을 이미지·멀티미디어·텍스트 형태별로 저작물 한 건씩 담은 API로, 저작물명·저작자명(한글·한문)·파일 및 이미지 링크를 제공하며 포털 설명상 약 16만 건 규모다. 교사·창작자·연구자가 수업 자료나 콘텐츠 제작에 저작권 걱정 없이 쓸 옛 그림·문헌·영상이 있는지 찾고 원본 파일을 내려받는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 저작물명·저작자명 같은 이름 매핑으로만 잇고, 내부적으로는 목록 조회에서 얻은 저작물번호(writingSeq)를 상세 조회에 넘겨 연결한다.
description_portal: 저작권 보호기간이 종료되어 자유롭게 활용 가능한 공유(만료) 저작물에 대한 정보를 제공하는 서비스입니다. 이미지, 멀티미디어, 텍스트 형태의 저작물 약 16만 건에 대한 저작권 정보를 바탕으로, 저작물의 제목, 저작자명, 저작물 형태, 제작연도, 공표국가 등 다양한 메타데이터를 조회할 수 있습니다. 해당 데이터를 통해 사용자는 저작권 걱정 없이 자유롭게 활용할 수 있는 콘텐츠를 검색하고, 상세한 정보를 확인하여 교육, 창작, 연구 등 다양한 분야에서 안전하게 사용할 수 있습니다. 제공되는 API를 활용하면 만료 저작물 목록 검색 및 개별 저작물의 상세 정보 조회가 가능하며, 이를 통해 저작권 걱정 없는 콘텐츠 활용 기반을 마련할 수 있습니다.
