summary_user: 전국 자치단체가 관리하는 영화배급업 인허가 정보를 업소 한 곳당 한 건으로 모아, 사업장명·인허가일자·영업상태·휴폐업일자·주소·좌표를 담는다. 특정 지역에서 현재 영업 중인 영화배급사가 몇 곳이고 언제 등록·폐업했는지를 확인하려는 사업자나 분석가가 쓴다. 실측 컬럼에 전역 조인 키는 없어 개방자치단체코드(OPN_ATMY_GRP_CD)나 주소·이름으로만 다른 데이터와 연결하고, 좌표는 Bessel 중부원점TM(EPSG:5174)이라 지도에 올리려면 변환이 필요하다.
description_portal: '문화_영화배급업 데이터는 영화를 전문적으로 배급하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 영화배급업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 영상콘텐츠산업과 / 044-203-3232 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
