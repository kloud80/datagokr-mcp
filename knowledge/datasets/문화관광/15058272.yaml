summary_user: 경기도 내 한옥체험업 사업장을 한 곳씩 담은 건별 현황으로, 사업장명·인허가일자·폐업일자·영업상태와 객실수·층수·건축연면적 같은 시설 정보, 도로명·지번주소와 WGS84 좌표를 포함한다. 관광 사업자나 분석가가 "경기도에서 지금 영업 중인 한옥숙박은 어느 시군에 몇 곳이고 객실은 얼마나 되나" 같은 숙박 시장 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 시군 코드(SIGUN_CD)나 사업장명·주소 매핑으로 연결하고, 숙박업 인허가 공통 원천(LOCALDATA) 계열 자료와 이름·주소 기준으로 대조해 쓴다.
description_portal: 이 데이터는 전통 한옥 양식으로 지어진 숙박형 체험시설인 경기도 내 한옥체험업의 현황을 제공합니다. 사업장명, 인허가일자, 폐업일자, 영업상태, 객실수, 총층수, 지상·지하층수, 건축연면적(㎡), 시설규모(㎡), 건물용도명, 주변환경명 등의 다양한 건축 및 운영 정보를 포함합니다. 위치정보는 도로명주소, 지번주소, 우편번호, WGS84 위도·경도 좌표로 구성되며, 문화사업자 구분, 문화체육업종명, 보험기관명 등 문화관광업으로서의 특성도 확인할 수 있습니다. 이 데이터는 전통문화 관광자원 활용, 한옥숙박 체험 활성화, 지역관광 콘텐츠 기획, 한옥시설 안전관리 등 다양한 분야에서 활용될 수 있으며, Open API 방식으로도 접근 가능합니다. 상업적 활용 및 콘텐츠 변경이 허용되어 데이터의 응용 가능성이 높습니다.
