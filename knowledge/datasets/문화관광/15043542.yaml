summary_user: 제주 서귀포시 수목원 상효원 한 곳의 무장애여행 정보를 지점(아이디)별 위도·경도·해발고도로 담은 외부 파일 데이터로, 포털 설명상 장소설명·이미지 정보도 함께 제공된다. 휠체어 이용자나 유모차 동반 가족이 상효원 안 편의시설·접근 지점의 위치를 지도에 표시하거나 무장애 관광 안내 서비스를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소 이름이나 같은 기관(제주특별자치도) 기준으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 상효원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 상효원은 제주 서귀포시 산록남로에 위치한 약 8만 평 규모의 수목원으로, 해발 300~400m 산록에 자리해 있어 북쪽으로는 한라산, 남쪽으로는 서귀포 바다가 조망된다. 제주 고유 자생식물과 1,200여 종의 식물이 자라는 희귀 수목이 밀집해 있으며, 16개 이상의 테마 정원과 곶자왈, 습지, 정원·숲·숲길이 조성되어 있다. 무장애 여행지로 정보가 제공되며, 장애인 전용 주차장, 장애인 화장실, 휠체어·유모차 대여, 매표소 접근로 등 편의시설이 마련되어 있어 교통약자, 고령자, 유아동반가족 등 다양한 방문자가 이용할 수 있다. 본 데이터는 관광 안내, 무장애 관광지 홍보, 지도 서비스 개발, 열린관광지 정책 수립, 관광 콘텐츠 제작 및 인프라 개선 등의 공공·관광 분야 기초자료로 활용 가능하다* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
