summary_user: 부산광역시 남구 관내에서 문화재 매매·중개를 하는 업소를 업소 한 곳당 한 행으로 담은 파일로, 허가번호·업소명·소재지·연락처·영업 상태·허가일자를 수록하며 파일 크기가 302바이트에 불과해 업소 수는 몇 곳 수준이다. 남구에서 허가받고 영업 중인 문화재매매업소가 어디인지 확인하려는 시민·연구자나 관내 업소 허가 현황을 점검하는 행정 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 소재지 주소를 매칭해 연결하며, 국가유산청 유산 지정 목록의 종목코드·지정번호와는 직접 이어지지 않는다.
