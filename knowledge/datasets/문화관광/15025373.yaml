summary_user: 여수시를 찾은 관광객 수를 연도별로 1~4분기와 연간 합계로 나누어 담고, 같은 해의 관광사업 투자예산(백만원)을 함께 실은 시군구 단위 집계 파일(CSV, 939 bytes)이다. 여수시 관광객이 어느 분기에 몰리는지, 관광 투자예산이 늘어날 때 방문객 규모도 함께 움직였는지를 살피려는 지역 관광 분석가나 관광업 사업자가 쓴다. 실측 컬럼에 관광지점코드나 시군구코드 같은 공통 조인 키가 없어서, 다른 관광 통계와는 '여수시'라는 지역명과 연도(년도)를 기준으로 맞춰 이어 쓴다.
description_portal: 개방 데이터는 여수시를 찾는 관광객의 분기별·연도별 규모와 연도별 관광산업 투자 현황으로 구성되어 있어 관광산업의 전반적인 수준과 흐름을 종합적으로 분석할 수 있습니다. 자료에 따르면 관광객 수는 매년 천만 명 이상을 안정적으로 유지하며 큰 변동 없이 꾸준한 방문 수요가 이어지고 있습니다. 계절별로는 해양관광 특성이 반영되어 여름철인 2분기에 방문객이 집중되고, 가을철인 3분기에도 각종 행사와 축제가 더해지며 높은 관광 수요가 나타납니다. 급변하는 글로벌 관광 환경 속에서 본 데이터는 여수시 관광산업의 현재 위치를 진단하고 중장기 발전 방향을 전망하는 기초 자료로 활용되어 지역경제 활성화에 기여할 수 있습니다.
