summary_user: 경기도 내 국외여행업체를 사업장 한 곳씩 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업일자와 도로명·지번 주소, WGS84 좌표, 자본금, 보험기관과 보험기간을 담는다. 해외여행을 예약하려는 국민이 업체가 지금 영업 중이고 보험 기간이 유효한지 확인하거나, 분석가가 시군별 국외여행업 분포와 폐업 추이를 볼 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 시군코드(SIGUN_CD)·주소·좌표나 사업장명 매칭으로 같은 기관의 다른 관광사업 현황이나 지도 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 국외 여행업체의 인허가 현황을 제공하며, 국외 여행업체는 내국인을 대상으로 해외 여행 일정을 기획·운영하고 관련 서비스를 제공하는 사업체를 포함합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘WGS84 위도·경도’, ‘업태구분명’, ‘문화체육업종명’, ‘자본금’, ‘보험기관명 및 보험기간’, ‘객실수’, ‘회의실 수용인원’, ‘부대시설 내역’, ‘좌석수’, ‘시설규모’ 등이 있습니다. 이를 통해 각 여행업체의 위치, 운영 상태, 규모, 안전 및 보험 현황 등을 종합적으로 확인할 수 있으며, 경기도 31개 시군 단위의 국외여행업 분포 현황을 분석할 수 있습니다. 데이터는 해외여행 수요 분석, 관광정책 수립, 지역 여행업 관리, 시장 경쟁력 평가 등에 활용 가능하며, 나아가 국제 관광객 유치 전략과 서비스 품질 개선에도 기여할 수 있습니다.
