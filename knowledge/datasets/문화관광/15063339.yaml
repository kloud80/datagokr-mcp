summary_user: 경상북도 시군별로 국보·보물·사적·명승·천연기념물·국가무형문화재 등 국가지정 유산과 도지정 유형·무형문화유산, 기념물, 등록문화유산, 문화유산자료의 지정 건수를 종류별로 집계한 표로, 개별 문화재 목록이 아닌 1KB 남짓의 작은 CSV 파일이다. 지역 문화정책 담당자나 분석가가 '경북에서 국가지정 보물이 가장 많은 시군은 어디인가', '시군별 도지정 유산 분포는 어떤가' 같은 질문에 쓴다. 전역 조인 키가 없어 시군 이름을 행정구역 코드에 직접 맞춰 다른 시군 단위 통계와 이어야 하고, 개별 유산 단위의 종목코드·지정번호는 국가유산청 자체 API 쪽에서 구해야 한다.
description_portal: 「지정문화재」 데이터는 도내 각 시·군에서 보유한 국가 및 도 지정문화재 현황을 제공합니다. 시군별로 국보, 보물, 사적, 명승, 천연기념물, 국가무형문화재, 등록문화유산, 도지정 유형·무형문화유산 등으로 구분되어 있으며, 문화유산의 종류별 지정 현황과 분포를 체계적으로 파악할 수 있도록 구성되어 있습니다. 본 데이터는 지역 문화자원의 보존·관리 및 정책 수립에 활용되며, 문화재 보호와 관광자원 개발의 기초자료로서 활용가치가 높습니다. 자료관련 문의는 054-880-3177로 하시기 바랍니다.
