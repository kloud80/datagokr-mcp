summary_user: 경상남도 김해시 관내에서 외국인이 운영하는 음식점을 업소 한 곳당 한 행으로 담은 파일로, 업소명·도로명/지번 주소·영업장 면적·업태·급수시설·영업상태·운영자 국적을 담는다. 김해 동상동·서상동 일대에서 베트남·우즈베키스탄 등 특정 국적 음식점이 어디에 몇 곳 영업 중인지 찾는 여행자나 상권·다문화 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소(소재지) 문자열이나 업소명 매칭으로만 잇고, TourAPI 음식 콘텐츠 등과도 이 방식으로 대조한다.
description_portal: '이 데이터는 경상남도 김해시 외국인 음식점 현황을 나타내는 데이터입니다.경상남도 김해시 관내에서 외국인이 운영하는 음식점은 124곳(2025년 11월 기준)으로, 각 음식점의 업종, 업소명, 업소 주소(도로명), 업소주소( 지번), 영업장 면적, 업태(예: 중국식, 한식, 경양식, 식육, 외국음식전문점, 분식 등) 급수시설, 영업상태, 내외국인구분, 국적 등으로 구성된 데이터를 제공합니다.특히 김해시 동상동과 서상동 일대는 베트남, 우즈베키스탄, 인도네시아, 태국, 러시아 등 다양한 국적의 음식점들이 밀집해 있습니다.'
