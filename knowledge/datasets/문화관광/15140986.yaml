summary_user: 서울 마포구에서 숙박·휴게 시설 등에 비디오물 시청기자재를 갖추어 제공하는 업소의 인허가 정보를 업소 1곳당 1행으로 담는 건별 원천 데이터이다. 인허가일자·폐업일자, 영업상태, 주소·좌표, 시설면적·층수·방 수, 비상구·조명·음향시설 여부 같은 항목이 들어 있다. 시민이나 감독 기관이 "마포구에서 지금 영업 중인 비디오물시청제공업소는 어디이고 비상구 등 시설 요건을 갖췄나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)로 같은 기관끼리 묶거나 사업장명·주소를 맞춰 이어 쓴다.
description_portal: 서울특별시 마포구숙박 및 휴게 등의 목적으로 이용하는 장소 또는 시설에서 비디오물 시청기자재를 갖추어 제공하는 업소정보에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소, 도로명주소, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명, 주변환경명, 시설면적, 지상층수 및 지하층수, 건물용도명, 지역구분명 정보가 포함되어 있습니다. 이 데이터를 통해 시민과 감독 기관은 합법적인 시청 제공업소의 운영 실태를 확인하고, 청소년 보호 및 콘텐츠 이용의 건전성을 확보할 수 있습니다.
