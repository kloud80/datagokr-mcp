description_portal: 본 데이터는 부산광역시와 부산관광공사가 운영하는 부산관광기업지원센터의 공식 웹사이트 방문객 현황을 집계한 월별 웹로그 통계 데이터입니다. 2023년 4월부터 2026년 6월까지의 연월별 총 방문자 수 수치 정보를 포함하고 있습니다. 본 자료는 센터에서 제공하는 관광기업 육성, 공모 사업, 공유 오피스 입주 지원 등 다양한 프로그램에 대한 온라인 관심도 및 디지털 이용 트렌드를 시계열로 분석할 수 있는 핵심 지표입니다. 부산 지역 관광·MICE 생태계 분석, 공공 웹사이트 이용자 패턴 연구, 정보공개 청구 대민 대응, 그리고 온라인 홍보 및 정책 수립을 위한 다각적인 행정·학술 기초 통계 자료로 활용할 수 있습니다
legal_basis_portal: 본 데이터는 부산관광공사 부산관광기업지원센터의 연도별 센터 운영 및 관광기업 육성 사업 계획에 의거하여 보유·관리하는 정보입니다. 센터 공식 홈페이지를 통한 관광 스타트업 지원 정보 제공, 공모 사업 안내, 입주 신청 등 대민 서비스 제공 현황을 모니터링하고, 월별 웹사이트 방문자 수 추이를 분석하여 디지털 서비스의 효율성을 높이기 위한 목적으로 관리하고 있습니다. 서비스 이용 실적 관리, 정보공개청구 대응, 센터 온라인 채널의 성과 평가 및 향후 웹사이트 고도화 정책 수립을 위해 지속적으로 집계하고 있는 정당한 보유 근거를 갖춘 공공데이터입니다.
