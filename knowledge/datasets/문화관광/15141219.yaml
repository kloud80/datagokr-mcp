summary_user: 금천구 내 영화상영업 사업장별 인허가 정보를 건별로 담으며, 인허가일자·영업상태·폐업/휴업 이력·주소·사업장명·좌표·시설면적·층수·건물용도 등을 포함한다. 구민이나 창업 준비자가 금천구에 현재 영업 중인 영화상영관이 어디에 있고 언제 허가·폐업했는지 확인하거나, 분석가가 지역 문화 인프라 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 금천구 내 영화상영업에 대한 인허가 현황을 체계적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 폐업 및 휴업 이력, 사업장 주소, 전화번호, 사업장명 등 기본 정보와 함께 소재지 면적, 좌표, 업태 구분, 시설 면적, 건물 용도, 조명 및 소방시설, 편의시설 등 영화상영업 운영에 필요한 다양한 세부 항목을 포함하고 있습니다. 이를 통해 영화상영업 분포 분석, 문화산업 정책 수립, 창업 지원, 위치 기반 서비스 개발 등에 활용할 수 있습니다. 또한 해당 데이터는 지역 내 문화 인프라 확충, 영화관 서비스 품질 개선, 안전관리 강화, 영화산업 활성화 전략 마련 등 다양한 행정·연구·산업 분야에서 기초 자료로 유용하게 쓰입니다.
