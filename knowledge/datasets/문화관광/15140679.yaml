summary_user: 광진구 관할 영화관·복합상영관 등 영화상영업소를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일·취소일, 영업상태와 상세상태, 폐업일, 휴업 기간, 소재지·도로명 주소, 중부원점TM 좌표(X·Y), 건물 층수와 시설면적을 포함한다. 광진구에서 현재 영업 중인 영화관이 어디이고 언제 인허가를 받았는지, 폐업한 상영관은 어디인지 확인하려는 주민·사업자·지역문화 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어 관리번호(MGTNO)와 개방서비스 코드(OPNSFTEAMCODE)는 같은 인허가 체계 안에서만 맞춰 쓰고, 다른 데이터와는 사업장명이나 주소를 매핑해 잇는다.
description_portal: 서울특별시 광진구_영화상영업 인허가 정보는 광진구 관할 내에서 영리를 목적으로 영화 또는 영상물을 관객에게 상영하기 위해 운영되는 영화관, 복합상영관 등의 시설에 대한 인허가 현황을 제공하는 데이터입니다. 해당 데이터는 영화상영업소의 사업장 명칭, 소재지 주소, 업종분류, 인허가 일자, 운영 여부 등의 정보를 포함하고 있어, 지역 내 대중문화공간의 현황을 파악하는 데 유용합니다. 영화상영업은 일정 수준 이상의 상영관 시설, 관람석, 음향 및 영상 설비 등을 갖춘 후 법적 절차에 따라 인허가를 받아야 하며, 이 데이터를 통해 문화산업 활동과 공공서비스 운영의 기반 자료로 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며 위도·경도 좌표는 포함되어 있지 않습니다. 본 자료는 3일 전 기준으로 최신 정보를 반영하며, 지역문화 분석, 공공안전 지도, 상업시설 분포 분석 등에 응용될 수 있습니다.
