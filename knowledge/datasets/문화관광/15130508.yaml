description_portal: '- 전라남도 마한사 디지털 아카이브 홈페이지의 전라남도 내 마한사 관련 출토된 문화재, 유적지 사진자료에 대해 조회하실 수 있습니다.- 마한(馬韓)은 고대 한국의 삼한 시대(기원전 1세기경 ~ 기원후 4세기경)에 존재했던 삼한 중 하나입니다. 마한은 한반도 서남부 지역, 오늘날의 전라남도와 전라북도, 충청남도의 일부 지역을 중심으로 형성된 여러 소국들의 연합체였습니다.- 전라남도와 전라북도 지역에 여러 마한 유적이 발견되고 있습니다. 고인돌, 토기, 철기 등 마한 문화 유물이 전해지고 있으며, 이를 통해 마한 사람들의 생활과 문화를 엿볼 수 있습니다.- 마한은 한국 고대사의 중요한 한 축으로, 특히 백제 초기 국가 형성에 결정적인 역할을 했던 고대 연맹체입니다.'
