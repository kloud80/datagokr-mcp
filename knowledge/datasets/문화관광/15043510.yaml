summary_user: 가파도의 무장애여행 관련 장소를 건별로 담은 외부 파일 데이터로, 실측 필드는 아이디·위도·경도·해발고도 정도의 위치 정보다. 휠체어 이용자나 교통약자 동반 여행객이 가파도에서 이동 가능한 지점의 위치를 지도에 표시하거나 여행 동선을 짤 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지나 다른 데이터와는 장소 이름 매핑이나 좌표 근접 비교로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 가파도 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 가파도는 제주 본섬에서 배로 접근 가능한 부속섬으로, 섬 전체가 ‘무장애 여행 정보’ 데이터셋에 포함돼 있다. 이 데이터에는 위도·경도, 장소 설명, 이미지 정보뿐 아니라 주차장, 선착장, 진입로 및 내부 이동 동선, 무장애 산책로(완경사 또는 판석길), 휠체어 이동 가능 구간, 장애인 화장실 등 교통약자를 위한 편의시설 현황이 포함되어 있다. 특히 섬을 도보 또는 휠체어로 둘러볼 수 있도록 무장애 코스가 지정되어 있어, 이동에 제약이 있는 관광객도 자연 경관과 문화유산(예: 청보리 밭, 해안 절벽, 돌담길, 고인돌 유적) 등 섬의 매력을 경험할 수 있도록 설계되었다. 이 데이터는 무장애 관광지 평가, 여행 계획, 정보 제공 및 관광 정책 수립 시 객관적 근거 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
