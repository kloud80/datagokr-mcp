description_portal: 본 데이터는 인천광역시 미추홀구에 지정된 무형유산의 현황을 수록한 자료입니다. 무형유산은 지역 고유의 전통기술, 예술, 공연, 생활문화 등을 보존·전승하기 위해 지정된 문화재로, 단소장, 가곡(여창), 대금장, 범패와 작법무(바라춤), 인천근해 도서지방 상여소리 등 다양한 종목이 포함되어 있습니다. 각 항목은 명칭, 보유자 성명, 세부 비고 사항으로 구성되어 있으며, 해당 종목의 전승자와 특징을 명확히 파악할 수 있습니다. 이를 통해 연구자, 문화기관, 교육기관 등은 무형유산의 보존과 활용 전략을 마련할 수 있고, 시민들은 지역의 문화적 뿌리와 예술적 가치를 이해하는 데 도움을 받을 수 있습니다. 특히, 단소제작, 전통음악, 불교의식무 등 다양한 장르의 무형유산이 포함되어 있어 교육·전시·공연 프로그램 기획 시 기초자료로 활용이 가능합니다. 본 자료는 정기적으로 갱신되어 무형유산 보유자나 종목의 변경 사항을 최신 상태로 반영하며, 지역 문화 정체성 확립과 전통문화 계승에 중요한 역할을 합니다.
