summary_user: 비짓제주에 등록된 관광 콘텐츠를 콘텐츠 한 건씩 담은 원천 파일로, 8,090건에 지번·도로명 주소와 위도·경도, 평점·조회수·좋아요수 같은 이용 지표가 들어 있다. 제주 여행 앱 개발자나 관광 분석가가 어떤 관광 콘텐츠가 어디에 있고 이용자 반응이 어떤지 살필 때 쓴다. 지번주소·도로명주소로 다른 주소 기반 데이터와, 위도·경도로 좌표 기반 데이터와 잇는다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 콘텐츠 내역입니다.- 해당 데이터는 운영자가 비짓제주 관리자사이트에서 신규 콘텐츠 등록 시 생성합니다.- 개방데이터 항목은 콘텐츠ID, 콘텐츠분류, 제목, 언어, 타이틀, 연관콘텐츠, 지번주소, 도로명주소, 위도, 경도, 탐나오연동여부, 평점 등이며 전체 데이터 수는 8,090건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 다양한 관광 콘텐츠 정보의 체계적 관리 및 제공, 이용자 맞춤형 정보 서비스 개발, 관광지 접근성 및 정보 정확성 향상, 관광객 만족도 증진, 마케팅 및 홍보 전략 수립 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
