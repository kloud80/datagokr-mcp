description_portal: 본 데이터는 이용자의 예약 및 이용 내역을 관리하기 위한 정보로 당진시 내 캠핑장 관련된 통계자료 입니다. 이용일자, 사이트명, 예약 기준(7세 미만 아동 포함 여부), 이용기간, 총 결제금액, 거주지역 등의 항목으로 구성되어 있습니다. 또한 당진시민, 국가유공자, 기초생활수급자에 대한 감면 적용 여부를 포함하여 사회적 배려계층의 할인 현황을 확인할 수 있습니다. 아울러 입실예정시간 및 예약 상태(예약 완료, 취소, 이용 중 등)를 함께 기록하여 이용 현황을 종합적으로 분석할 수 있도록 구성된 데이터입니다.
