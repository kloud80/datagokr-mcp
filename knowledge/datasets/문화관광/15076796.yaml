description_portal: 이 데이터는 2020년 하반기 3개월에 걸쳐 전북특별자치도 내 68개 전통시장과 그 안의 5,223개 개별 상점의 운영 실태를 현장 실측을 통해 상세히 조사한 결과입니다. 공공데이터 뉴딜 청년인턴 사업의 일환으로 수집된 이 자료는 각 시장과 상점의 정확한 위치 정보뿐만 아니라 운영 현황에 대한 귀중한 정보를 담고 있습니다. 이를 통해 지역별 전통시장의 분포와 규모, 상점들의 업종 구성 등을 다각적으로 분석할 수 있으며, 소상공인 지원 정책 수립 및 지역 상권 활성화 전략을 모색하는 데 매우 중요한 기초 데이터로 활용될 수 있습니다.
