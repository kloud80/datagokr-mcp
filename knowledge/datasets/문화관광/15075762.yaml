description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 제주도립김창열미술관은 제주 제주시 한림읍 용금로 883-5에 위치한 공립 미술관으로, ‘물방울’이라는 독창적 모티브로 세계적으로 알려진 작가 김창열 의 작품 약 220여 점을 기증 받아 상설 및 기획 전시를 운영하고 있다. 본 미술관은 장애인 전용 주차장, 휠체어 대여, 단차 없는 출입구, 장애인 화장실 등 무장애 편의시설을 갖추고 있어 휠체어 이용자, 고령자, 유모차 동반자 등 교통약자도 편리하게 방문 가능하다. 실내·실외 전시관, 휴게 공간, 아트샵 등을 갖춘 복합 문화 공간으로, 비 오는 날이나 계절에 관계 없이 이용 가능하다. 이 데이터는 무장애 관광 안내, 관광 코스 설계, 열린관광지 정책 수립, 지도 및 관광 콘텐츠 제작 등 공공·관광 분야에서 기초자료로 활용하기 적합하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
