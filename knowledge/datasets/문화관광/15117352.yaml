description_portal: '서울올림픽기념국민체육진흥공단 한국스포츠정책과학원에서 실시한 「레저스포츠산업 실태조사」 의 시설업 안전관리 현황 데이터를 제공합니다.(원문보기) https://www.sports.re.kr/lib/#/search/detail/615753(일러두기)1. 본 보고서의 내용을 인용할 때에는 반드시 문화체육관광부와 국민체육진흥공단 한국스포츠정책과학원의 자료임을 밝혀야합니다.2. 통계표 및 도표 내의 숫자는 반올림되었으므로 세부 항목의 합이 전체 합계와 일치하지 않을 수 있습니다.3. 통계표 및 도표에 사용된 기호의 뜻은 다음과 같습니다.-: 조사되었으나 정보가 없는 경우0: 조사 결과 값이 0이거나 0에 근사한 경우4. 2024년 레저스포츠산업 실태조사의 조사 기준 연도는 2023년입니다.5. 조사결과의 표본 수가 작은 경우, 결과 해석 시 유의해야 합니다.* 산업별 사업체 수는 전체 레저스포츠 사업체 중 공공 사업체를 제외한 결과임'
