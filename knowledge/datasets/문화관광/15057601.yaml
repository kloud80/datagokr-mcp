summary_user: 경기도 안에서 인허가된 게임물 제작업체를 사업장 한 곳당 한 행으로 담는 건별 데이터로, 사업장명·인허가일자·영업상태·폐업일자·주소와 좌표·건물 층수와 시설면적·제작 취급 품목 등을 포함한다. 분석가나 정책 담당자가 '경기도 어느 시군에 게임 제작업체가 몰려 있고, 그중 얼마나 영업을 이어가고 있는가'를 살피는 데 쓴다. 전역 조인 키는 없으므로 시군코드(SIGUN_CD)나 정제 주소·위경도를 기준으로 다른 경기도 데이터나 행정구역 자료와 이름·좌표로 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내에서 인허가된 게임물 제작업체의 현황을 제공하며, 게임 기획·제작·복제 등과 관련된 사업체 정보를 담고 있습니다. 주요 항목에는 사업장명, 인허가일자 및 취소일자, 영업상태, 폐업일자, 소재지 주소 및 전화번호, 건물 용도와 층수, 시설면적, 통로너비, 안전·소방·환기·방음시설 여부, 제공 게임물명, 제작 취급 품목, 문화체육업종명, 업태구분 등이 포함됩니다. 이를 통해 지역별 게임 제작업체 분포, 영업 지속성, 제작 품목 및 시설 특성을 파악할 수 있으며, 게임산업 현황 분석, 정책 수립, 업계 동향 모니터링, 산업 육성 및 관리 정책 연구에 활용 가능합니다. 또한 데이터는 Open API를 통해 XML·JSON 형태로 제공되며, 시군명과 시군코드를 조건으로 지역별 조회가 가능합니다.
