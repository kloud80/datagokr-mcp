summary_user: 경상북도에 있는 천연기념물을 한 건씩 담은 목록 파일로, 종목·명칭·소재지·지정일·분류·수량(주)·면적(제곱미터)을 수록하며 범위는 경상북도 한 시도이고 소재지는 개별 주소 수준입니다. 지역 연구자나 여행·교육 기획자가 "경북 어느 시군에 노거수·식물 천연기념물이 몇 그루, 언제 지정되어 있나"를 확인하는 데 쓴다. 실측 컬럼에 국가유산청의 종목코드·지정번호 같은 전역 조인 키가 없어서, 국가유산청 유산 API 등 다른 데이터와는 명칭·소재지 문자열을 맞춰서만 연결합니다.
description_portal: 본 데이터는 경상북도에 소재한 천연기념물에 대한 상세 정보를 제공합니다. 주요 내용은 종목별로 구분된 명칭을 포함하고 있으며, 해당 천연기념물의 정확한 소재지 정보를 제공합니다. 더불어 문화재로 지정된 일자를 수록하여 역사적 맥락을 파악할 수 있도록 합니다. 각 천연기념물의 분류 정보 및 수량(주), 그리고 면적 등 구체적인 규모 현황이 포함되어 있습니다. 이 자료는 대한민국의 자연유산 관리 및 연구, 그리고 지역 문화재 현황 파악 등에 활용될 수 있는 중요한 공공데이터입니다. 사용자 이해를 높이기 위해 컬럼명을 기반으로 상세히 기술하였습니다.
