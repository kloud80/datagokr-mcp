description_portal: '제주특별자치도 내 문화재 지정 현황 데이터를 제공합니다.항목: 지정연도, 시도, 문화재대분류, 문화재소분류, 등록건수 등* 제주특별자치도 내에서 문화재가 어떻게 지정되어 왔는지, 지정 건수 변화 양상을 연도별로 기록한 통계자료입니다. 구체적으로는 문화재의 대분류(예: 국보, 보물, 지정문화재 등)와 소분류(예: 기념물, 문화유산 유형 등)별로 제주도 내 지정 건수가 얼마인지가 정리되어 있습니다. 지정 건수가 시간이 흐르면서 어느 분류에서 증가 혹은 감소했는지 파악할 수 있습니다.* 활용 분야 : 문화재 지정 강화 및 문화유산 보존 정책 기획, 문화관광 자원 개발 및 홍보전략 수립 등'
