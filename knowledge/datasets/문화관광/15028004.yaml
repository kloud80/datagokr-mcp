summary_user: 성주군이 개최하는 성주참외 전국마라톤대회의 개요를 대회 단위로 담은 소규모 파일(CSV 396바이트)로, 대회명·일시·장소·예상인원·주최·주관·후원·종목·접수·기념품 정보를 담는다. 마라톤 참가를 고민하는 국민이 '성주참외 마라톤은 언제 어디서 열리고 어떤 종목과 기념품이 있나'를 확인하거나, 지역 체육행사 담당자가 대회 규모(예상인원)와 운영 주체를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대회명·장소 이름 매칭이나 같은 기관(성주군) 기준으로만 이어 쓸 수 있다.
description_portal: 성주군에서 개최하는 성주참외 전국마라톤대회에 대한 데이터로 대회명, 일시, 장소, 예상인원, 주최, 주관 등을 포함합니다.본 데이터는 성주군에서 개최되는 체육대회 관련 정보를 체계적으로 정리한 자료이다. 대회명, 일시, 장소, 예상인원, 주최, 주관기관 등 주요 사항을 포함하여 지역 내 체육행사 운영 현황을 종합적으로 파악할 수 있도록 구성하였다. 해당 자료는 행사 기획과 운영 지원, 지역 주민 참여 활성화, 체육 정책 수립 등 행정 의사결정에 필요한 근거자료로 활용된다. 또한 대회별 진행 결과와 참가 현황을 정기적으로 갱신하여 정보의 신뢰성을 유지하며, 주민의 체육 참여 기회를 증진하고 성주군 체육 환경 개선을 지원하는 공공데이터이다.
