summary_user: 경상남도 내 자주 찾는 문화재를 한 건씩 담은 목록으로, 명칭(한글·한자), 지정번호, 지정일, 시대, 면적, 소유자·관리자, 소재지 주소와 UTM-K 좌표, 설명 내용, 사진 파일 주소를 제공한다. 경남 지역 문화재의 위치와 내력을 찾는 국민이나 관광·지역 콘텐츠를 만드는 사업자가 '이 문화재는 어디에 있고 언제 지정됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 유산 API 등과는 명칭이나 지정번호(DOJIJUNG_NO)를 맞춰 이어야 하고, 주소·좌표로 지도나 행정구역 데이터와 겹쳐 쓴다.
description_portal: 명칭, 내용, 작성자 등을 조회하는 경상남도 자주찾는 문화재 조회 서비스
