summary_user: 경기도 시군별로 운영하는 시티투어 프로그램을 코스 단위로 담은 현황 자료로, 집계 연도·시군명·코스명·운행일·탑승장소·이용요금·문의처·홈페이지를 담는다. 관광객이 '이번 주말 수원이나 가평에서 탈 수 있는 시티투어 코스와 요금, 탑승 위치는 어디인가'를 확인하거나, 분석가가 시군별 시티투어 운영 여부와 요금 수준을 비교하는 데 쓴다. 전역 조인 키는 없어 시군명이나 시군코드(SIGUN_CD)로 경기도 내 다른 시군 단위 자료와 이름·코드를 맞춰 연결하며, TourAPI 관광지 목록과도 이름 대조로만 이을 수 있다.
description_portal: 이 데이터는 경기도 내 시군별로 운영 중인 시티투어 프로그램의 현황을 수록한 자료로, 시티투어의 코스명, 운행일자, 탑승장소, 운행요금, 문의 연락처, 홈페이지 주소 등 다양한 정보가 포함되어 있습니다. 관광객에게 지역 기반 맞춤형 투어정보를 제공하며, 각 시군의 관광자원 홍보, 관광정책 수립, 지역관광 활성화에 유용하게 활용될 수 있습니다. 데이터는 연간 단위로 갱신되며, Open API 방식으로도 제공되어 JSON 또는 XML 포맷으로 실시간 활용이 가능합니다. 특히 탑승장소 및 요금 정보는 실제 이용자의 접근성과 편의성 분석에 유용하며, 관광경로 최적화 및 마케팅 자료로도 쓰일 수 있습니다.
