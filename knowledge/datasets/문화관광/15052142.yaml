summary_user: 문경시 모전도서관이 소장한 도서를 한 권(서지) 단위로 나열한 목록으로, 서명·저자·출판사를 담으며 포털 설명상 약 10만 건 규모의 CSV 파일이다. 문경 주민이나 연구자가 '모전도서관에 이 책(저자·출판사)이 있는가', '이 도서관 장서는 어떤 출판사·저자 비중이 높은가' 같은 질문에 쓴다. 실측 컬럼에 ISBN·도서관코드 같은 전역 조인 키가 없어 다른 도서관 장서나 국가서지와는 서명·저자 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 문경시 모전도서관이 소장하고 있는 도서의 서지정보 데이터는 약 100,156건으로 구성되어 있으며, 도서의 서명, 저자, 출판사 등의 주요 정보를 포함하고 있습니다. 이 데이터는 경상북도 문경시에서 제공하며, 문화예술회관에서 관리하고 있습니다. 데이터는 주로 CSV 파일 형식으로 제공되어 다양한 분석과 활용이 가능하며, 연 1회 이상 정기적으로 업데이트됩니다. 또한, 도서관의 자료 관리뿐만 아니라 학술 연구, 도서관 서비스 개선, 독서 트렌드 분석 등 다양한 목적으로 활용될 수 있습니다. 이를 통해 중앙도서관의 소장 자료 현황을 한눈에 파악할 수 있고, 도서 대출 및 추천 시스템 개발에도 유용한 기초 자료가 됩니다.
