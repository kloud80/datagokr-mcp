summary_user: 화성도시공사가 운영하는 화성시 공공 체육시설의 예약·이용 건을 시설 구분, 단체명, 신청일자, 예약 시작·종료 일시, 이용요금 단위로 담은 CSV 파일(약 2MB)이다. 화성시 체육시설 운영 담당자나 분석가가 어느 시설이 어느 요일·시간대에 많이 예약되고 요금 수입이 얼마인지 같은 이용 수요 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 시설명(구분) 이름 매칭이나 같은 기관 자료로만 이어 쓴다.
description_portal: 본 데이터는 화성도시공사가 관리·운영하는 화성시 공공 체육시설의 이용 현황을 제공하는 자료입니다. 야외 체육시설을 포함한 공공 체육시설을 대상으로 시설별 이용 실적을 집계하여 제공하며, 시설 이용 현황을 체계적으로 확인할 수 있도록 구성되어 있습니다.해당 데이터에는 사용 시설명, 신청 일자, 예약 일시, 예약 종료 일시, 이용 요금 등 체육시설 이용과 관련된 주요 정보가 포함되어 있어, 체육시설의 예약 및 이용 현황과 이용 패턴을 종합적으로 파악할 수 있습니다. 이를 통해 공공 체육시설의 이용 수요 분석, 시설 운영 효율성 점검, 예약 제도 및 운영 기준 검토, 향후 체육시설 운영 계획 수립을 위한 기초자료로 활용할 수 있습니다.또한 데이터기준일자를 함께 제공하여 자료의 집계 및 제공 기준 시점을 명확히 하였으며, 개인을 식별할 수 있는 정보는 포함되어 있지 않습니다. 본 데이터는 공공 체육시설 운영 현황을 객관적으로 공개함으로써 시민의 알 권리를 보장하고, 체육 정책 수립 및 공공체육 서비스 개선을 위한 통계·분석 자료로 활용될 수 있습니다.
