summary_user: 부산 영도구가 운영하는 동네체육시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·설치장소·시설면적·부지소유·재원별 사업비(국비·시비·구비, 천원)·간이운동장과 체력단련시설 등 보유 내역·운영주체를 담는다. 영도구 주민이 집 근처에 배드민턴장이나 운동기구가 있는 체육시설이 어디인지 찾거나, 분석가가 시설별 사업비 재원 구성과 직영·위탁 운영 현황을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 다른 체육시설 데이터와는 시설명·설치장소 같은 이름으로 맞춰 이어야 한다.
description_portal: <부산광역시 영도구 동네체육시설 현황 정보>*컬럼별 상세설명○ 구분 → 시설명○ 위치 → 설치장소○ 면적 → 시설면적○ 사업비 → 국비, 시비, 구비 등 구분하여 사업비 작성○ 시설내역(간이운동장 등) → 해당 체육시설 내 간이운동장, 배드민턴장 등 보유 내역○ 시설내역(체력단련기구 등) → 해당 체육시설 내 체력단련기구 등 보유 내역○ 운영주체 → 구직영, 위탁관리 등 구분○ 비고 → 소유주체 등 등 구분 이 데이터는 부산광역시 영도구에서 운영 중인 동네체육시설의 시설명, 설치장소, 면적, 사업비, 시설내역(간이운동장 등 편의시설), 시설내역(체력단련기구 등), 운영주체  등의 정보를 제공하며, 체육시설 현황 파악과 공공데이터 활용을 위한 자료입니다. 지역 주민의 체육 활동 증진과 시설 이용 편의를 도모하고자 작성되었습니다.
