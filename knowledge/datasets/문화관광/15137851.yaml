summary_user: 용인시 도서관 홈페이지에 소개된 지역서점을 서점 한 곳당 한 행으로 담은 목록 파일(약 8.7KB CSV)로, 서점명·구 이름·주소·위경도·전화번호·운영시간·휴무일·SNS 주소·소개를 포함한다. 용인시민이 우리 구에서 지금 문을 연 동네서점이 어디인지 찾거나, 분석가가 구별 지역서점 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·위경도나 구 이름(지역구명)으로 공간·이름 매칭해서 잇고, 도서관정보나루의 도서관코드·ISBN과는 직접 연결되지 않는다.
description_portal: 본 데이터는 경기도 용인시 도서관 홈페이지에서 제공하는 지역서점 현황 정보를 체계적으로 정리한 자료이다. 주요 항목은 관리번호, 서점명, 위치(주소), 연락처, 운영시간, 휴무일, 소셜미디어 주소, 소개, 데이터 기준일자 등으로 구성되어 있으며, 이를 통해 시민은 가까운 지역서점의 운영 현황과 특성을 손쉽게 확인할 수 있다. 본 자료는 지역서점 활성화 정책 수립, 지역 경제 분석, 독서문화 진흥 등 다양한 행정 및 연구 분야에 활용될 수 있으며, 서점별 세부 정보를 바탕으로 문화 공간 네트워크 구축이나 지역 독서 동아리 활동 지원에도 기여할 수 있다. 행정기관과 연구자는 서점의 분포 현황과 운영 특성을 분석하여 문화 정책 및 상권 지원 전략을 마련할 수 있고, 시민은 실질적인 생활 정보로 활용 가능하다. 또한 소셜미디어 주소와 소개 정보는 서점 홍보 및 시민과의 소통을 강화하는 데 유용하며, 운영시간 및 휴무일 정보는 이용 편의성을 높인다. 본 데이터는 정기적으로 최신 현황을 반영하여 갱신되며, 공공데이터 개방을 통해 지역 독서문화 확산, 주민 생활 편의 향상, 지역경제 활성화에 기여하는 것을 목표로 한다.
