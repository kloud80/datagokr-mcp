summary_user: 동대문구에 신고된 종합체육시설업 사업장을 한 곳씩 담은 인허가 원천 목록으로, 상호명(BPLCNM)·인허가일자·폐업일자·영업상태·도로명/지번주소·좌표를 담는다. 동대문구에서 지금 영업 중인 종합체육시설이 어디 있는지, 최근 문을 닫은 곳은 어디인지 확인하려는 주민·창업자·상권 분석가가 쓴다. 전역 조인 키는 없어 주소나 상호명 매칭, 또는 같은 서울시 인허가 데이터의 관리번호·자치단체코드 체계로 다른 체육시설업·상권 데이터와 잇는다.
description_portal: ▶ 동대문구 종합체육시설업 정보를 제공합니다.(상호명, 도로명주소, 지번주소, 영업여부 등)▶ 종합체육시설업은 「체육시설의 설치·이용에 관한 법률」에서 정하는 업종의 하나로, 다양한 체육 종목을 동시에 수용할 수 있도록 종합적인 시설과 공간을 갖추어 일반인에게 이용하게 하는 업을 말합니다. 즉, 특정 종목만 운영하는 단일 체육시설과 달리, 종합체육시설업은 여러 가지 운동·스포츠 활동이 가능하도록 종합적인 체육시설을 설치·운영하는 것이 특징입니다.▶ 종합체육시설업은 신고체육시설업에 해당하므로, 사업자는 관할 구청에 체육시설업 신고를 해야 합니다.▶사업자가 제출해야 할 서류에는 체육시설업 신고서, 임대차계약서, 지도자 자격증, 시설 평면도  등이 있습니다.
