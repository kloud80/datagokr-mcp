description_portal: 해당 데이터의 경우 조세특례제한법 제126조의2에 근거, 현재 문화체육사용분에 해당하는 상품을 판매하는 사업자 모수의 추정치입니다. 해당 모수의 경우 산업계 일반적인 현황이 아닌  해당 상품을 판매하는 사업자입니다. 문화분야의 경우 자유업 특징이 있어 실제 사업자 모수를 특정할 수 없는 한계가 있습니다. 도서의 경우 ISBN 978, 979도서(전자책의 경우 ECN 포함)을 판매하는 사업자이며 공연은 공연티켓, 박물관 미술관의 경우 입장권 및 일일교육체험비 판매하는 곳, 신문은 종이신문 구독권, 영화는 영화티켓, 체력단련장 및 수영장은 지자체에 해당 업종으로 신고된 사업자를 의미합니다.
