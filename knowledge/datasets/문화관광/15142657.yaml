description_portal: 광주광역시 남구 관내에 위치한 스마트도서관에 대한 정보(도서관명, 소재지, 연락처, 운영시간, 상호대차 가능여부 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 도서관과(☎062-607-2525)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 스마트도서관은 정보통신기술(ICT)을 활용해 무인으로 도서 대출·반납, 검색 등 서비스를 제공하는 자동화 도서관입니다. 주로 지하철역, 공원, 주민센터 등 생활권 근처에 설치되며, 광주광역시 남구의 경우에는 푸른길 공원, 주월2동 행정복지센터, 남광주농협, 다목적체육관, 효천 공원 인근에 설치되어 있습니다. 이용자는 운영 시간에 제약 없이 24시간 도서 이용이 가능하며, 회원 인증 후 원하는 책을 대출하거나 반납할 수 있습니다. 스마트도서관은 비대면 서비스 확대와 정보 접근성 향상에 기여하며, 바쁜 일상 속에서도 독서와 학습을 이어갈 수 있는 편리한 문화 인프라입니다.
