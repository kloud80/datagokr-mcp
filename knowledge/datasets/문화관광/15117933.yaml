description_portal: 본 데이터는 전북특별자치도 순창군 관내 종교시설 정보를 제공하는 행정 데이터입니다. 이 데이터는 시설구분, 종단, 시설명, 소재지주소, 데이터기준일로 구성되어 있습니다.기독교, 천주교, 불교 등 종교시설 정보이며 종교시설은 등록시설업이 아니므로 실제 수량 및 현황과 차이가 일부 있을 수 있으며 해당 데이터는 참고자료로 활용하는 것을 권장합니다. 이 데이터는 지역 종교시설분포 파악, 시설 위치 정보 제공, 행정 참고용 기초 자료 등으로 사용될 수 있으며 지역사회 내 종교시설 분포 현황 파악과 종교 관련 문화행정 서비스 기획, 복지자원 연계 분석에도 활용이 가능합니다.
