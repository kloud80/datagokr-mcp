summary_user: 강남구도시관리공단이 운영하는 강남스포츠문화센터의 생활체육 강좌를 강좌 한 건당 한 행으로 담은 파일(CSV 약 43KB)로, 강좌명·운영요일·교육 시작·종료 시각·대상·교육방법·정원·수강료·교육장 도로명주소·접수방법(온라인·방문 등)을 포함한다. 강남구 주민이나 수강 희망자가 "평일 저녁에 들을 수 있는 성인 대상 강좌 중 수강료가 얼마이고 어떻게 신청하나"를 확인하거나, 분석가가 공공체육시설 강좌의 수강료·정원 수준을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 체육시설·강좌 데이터와는 운영기관명이나 교육장 도로명주소를 이름·주소 매칭으로 이어 써야 한다.
description_portal: 본 데이터는 강남스포츠문화센터에서 운영하는 프로그램의 상세 정보를 종합적으로 정리하여 제공하는 자료입니다.강좌명, 교육 시간, 교육 대상, 교육 방법, 강좌정원 및 수강료 등 프로그램 신청에 필요한 핵심 정보를 포함하여, 강좌 내용을 쉽게 확인하고 이용할 수 있도록 제공합니다.교육이 진행되는 장소 정보와 운영기관 연락처 등 이용 편의를 위한 정보도 함께 제공되며, 접수 방법 구분을 통해 온라인, 방문 등 신청 절차를 명확히 안내합니다.이 데이터는 생활체육 참여 활성화와 공공체육시설 프로그램의 투명한 공개 및 수강 편의 증진에 활용될 수 있습니다.
