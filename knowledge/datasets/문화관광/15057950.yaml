summary_user: 경기도 31개 시군의 골프장 인허가 자료를 사업장 한 곳당 한 행으로 담으며, 사업장명·인허가일·영업상태·폐업일, 지번·도로명 주소와 위경도, 건축물 연면적, 공사립 구분, 보험 가입 여부, 회원모집 인원 등이 들어 있다. 분석가나 사업자가 '경기도 어느 시군에 영업 중인 골프장이 몰려 있고, 최근 폐업한 곳은 어디인가'처럼 골프장 분포와 개폐업 흐름을 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소·사업장명을 맞춰 붙여야 하며, 같은 경기도 체육시설업 인허가 데이터나 상권 데이터와 함께 쓴다.
description_portal: 경기도 내 골프장 현황입니다. 골프를 치기 위해 조성된 잔디밭, 황무지, 장애 구역 등으로 구성된 골프장 업체의 사업장명, 소재지주소 등의 정보를 제공합니다.※경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내 골프장의 현황을 정리한 자료로, 각 골프장의 시군명, 사업장명, 인허가일자, 영업상태(영업중, 폐업 등), 소재지 정보(지번주소, 도로명, 전화번호, 우편번호), 도로명주소, 위도·경도, X/Y좌표 등 위치 정보와 함께, 건축물 연면적, 공사립 구분, 보험 가입 여부, 회원모집 인원 등의 세부 항목으로 구성되어 있습니다. 이를 통해 골프장 분포, 체육시설 규모, 보험·회원 운영 여부 등을 종합적으로 분석할 수 있으며, 지역 내 체육 인프라 구축 현황 파악, 문화관광 자원 분석, 지역경제 파급효과 측정 등 다양한 용도로 활용될 수 있습니다.
