summary_user: 제주 신천목장 일대 무장애 산책 코스를 이루는 지점들을 순서대로 담은 코스 파일로, 지점마다 위도·경도, 구분, 설명, 상세정보와 전체코스·추천코스 해당 여부가 들어 있다. 휠체어 이용자나 교통약자, 동반 가족이 '신천목장 산책길에서 쉬어 갈 곳과 전망 지점은 어디이고, 추천 동선은 어떻게 되나'를 확인할 때 쓰고, 열린관광지 조성을 검토하는 담당자도 쓴다. 실측 컬럼에는 전역 조인 키가 없어 TourAPI 관광지 같은 다른 데이터와는 지점 이름이나 좌표(위도·경도)를 직접 맞춰서만 이어 쓸 수 있다.
description_portal: '"제주특별자치도 내 제주특별자치도_신천목장산책길_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 신천목장 일대를 중심으로 구성된 무장애 여행 코스 정보를 제공한다. 해당 코스는 목장 주변의 완만한 산책길을 따라 이동하는 형태로, 교통약자와 휠체어 이용자의 접근성을 고려한 이동 동선, 휴식 공간, 전망 지점, 편의시설 현황 등을 포함한다. 현장 기반의 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등이 반영되어 있으며, 자연경관을 활용한 무장애 관광환경 조성, 열린관광지 개발, 정책 수립 및 관광 서비스 개선을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
