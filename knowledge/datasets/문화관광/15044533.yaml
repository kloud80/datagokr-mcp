summary_user: 체육지도자 자격등급(전문·생활스포츠지도사, 건강운동관리사, 장애인·유소년·노인스포츠지도사 등)별로 남자·여자·성별불명 취득자 수를 2023년 이전, 2024년, 2025년 구간으로 나눠 담은 전국 단위 집계표(CSV, 644바이트)다. 체육 정책 분석가나 지도자 양성기관이 "생활스포츠지도사 자격 취득자 중 여성 비중이 최근 늘었는가" 같은 자격 종류별 성비와 연도별 추이를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 자격등급 이름을 직접 맞춰 붙이거나 같은 기관의 체육지도자 관련 통계와 나란히 놓고 보는 방식으로만 연결한다.
description_portal: 서울올림픽국민체육진흥공단에서 진행하는 체육지도자 자격증의 남녀별 취득 현황에 대한 통계 정보를 제공합니다.※"체육지도자"란 학교ㆍ직장ㆍ지역사회 또는 체육단체 등에서 체육을 지도할 수 있도록 국민체육진흥법에 따라 해당 자격을 취득한 사람을 말한다. 전문·생활스포츠지도사·건강운동관리사·장애인스포츠지도사·유소년·노인스포츠지도사 등 다양한 체육지도자 자격증별 남녀 취득자 수를 보여줍니다. 2023년 이전과 2024년의 남녀별 취득 현황을 데이터로 비교할 수 있습니다.
