summary_user: 경기도 성남시 관내에 등록된 숙박업소를 업소 한 곳당 한 행으로 담은 파일(CSV, 약 52KB)로, 업태 구분(호텔·여관·여인숙 등), 사업장명, 지번·도로명 주소, 전화번호, 데이터 기준일자를 담는다. 시민·방문객이 '성남시 어느 동에 어떤 종류의 숙박업소가 있는가'를 찾거나, 분석가가 업태별 숙박업 분포와 밀집 지역을 살펴보는 데 쓴다. 전역 조인 키는 없어서 사업장명·주소를 기준으로 공중위생 영업 인허가(LOCALDATA) 숙박업 자료나 성남시의 다른 시설 자료와 이름·주소 매칭으로 이어 쓴다.
limits: 성남시 한 곳만 다루며, 공통 식별 코드가 없어 다른 데이터와 연결하려면 사업장명·주소를 직접 맞춰야 한다. 실측 컬럼에는 객실 수·영업상태·좌표가 없어 숙박 규모나 영업 여부를 이 파일만으로는 판단할 수 없다.
