description_portal: 성남시 숙박업소 현황 자료는 성남시 관내에 등록된 숙박업소의 기본정보를 제공하는 자료입니다. 호텔, 여관, 여인숙 등 업태별 분류와 사업장 주소, 전화번호 등의 기초정보를 제공합니다. 데이터는 연간 주기로 업데이트되어 정보를 반영하며 CSV 형식, 오픈API 형식으로 제공됩니다. 제공데이터중 미수집 항목은 공란으로 처리됩니다. 해당 자료는 시민과 방문객이 숙박시설을 효율적으로 이용할 수 있도록 정보를 제공하고 위생점검과 숙박업 밀집 지역분석 등을 통해 행정서비스 품질을 높이는 기초자료로 활용 할 수 있습니다.
