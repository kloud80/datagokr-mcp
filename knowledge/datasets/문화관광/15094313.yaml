summary_user: 국립무형유산원이 제공하는 무형유산 음원자료 디지털 해설서의 목록을 해설서 한 건 단위로 담으며, 자료명·썸네일·페이지 이동 URL·재생 시간·제작자·제작일·분류·이용허락(CCL)·저작권·설명 등을 전국 범위의 비공간 데이터로 제공한다. 국악·민속음악 연구자나 교육·콘텐츠 제작자가 "특정 무형유산 분야의 음원 해설서가 있는지, 원문 페이지는 어디이고 저작권 조건은 무엇인지"를 확인하는 데 쓴다. 다른 데이터와 잇는 공통 조인 키는 없어, 국립무형유산원의 다른 목록과는 자료명이나 분류명(종목·유형명)을 이름으로 맞춰 연결해야 한다.
description_portal: 입력 파라미터를 이용하여 무형유산 음원자료 디지털 해설서 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형유산 음원자료 디지털 해설서 목록 조회 서비스는 무형문화유산 관련 음원 자료에 대한 상세 해설과 정보를 체계적으로 제공하는 온라인 플랫폼으로, 음원 제목, 전승자, 제작 연도, 음원 길이, 관련 유산 분야, 녹음 환경 및 제작 배경, 해설 내용 등이 포함되어 있습니다. 이용자는 검색과 필터 기능을 통해 원하는 음원 해설서를 쉽게 찾을 수 있으며, 학술 연구, 교육, 문화 콘텐츠 제작 등에 유용하게 활용됩니다.
