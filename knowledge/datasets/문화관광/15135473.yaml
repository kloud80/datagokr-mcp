description_portal: 이 데이터는 특정 지역에서 추진된 마을공동체, 청년정책, 세대 공감 등의 주제를 중심으로 제작된 영상기록물 목록을 정리한 자료입니다. 사업명, 동영상 제목, 파일 크기, 확장자 등의 항목으로 구성되어 있으며, 다양한 주체들이 참여한 시민기록 프로젝트의 결과물로 제작되었습니다. 영상은 다큐멘터리 형식, 공공캠페인 클립, 마을활동 스케치, 청소년 참여 콘텐츠 등으로 구분되며, 일부는 마을 현안 의식조사나 도시문화 실험의 과정을 담고 있어 지역의 사회적 맥락을 깊이 있게 반영하고 있습니다. 본 자료는 디지털 아카이빙 기반 지역문화 기록 구축, 주민참여형 정책 개발, 마을방송 콘텐츠 확대, 시민교육자료 활용 등 다양한 공공문화 행정에 활용하실 수 있습니다.
