summary_user: 제주 올레7코스 돔베낭길 한 곳의 무장애(배리어프리) 여행 정보를 담는 지자체 관광지 파일로, 주차장·화장실 같은 주요 지점별로 구분·유형·추천여부·비고를 기록하고 관광지 개요·주소·코스·휴무일·관람료 같은 기본 정보와 지점별 사진을 함께 제공한다. 휠체어 이용자나 고령자 동반 여행객이 '돔베낭길에 장애인 주차장과 이용 가능한 화장실이 있는지'를 미리 확인하거나, 관광 인프라 개선 담당자가 시설 상태를 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지 이름으로 맞추거나 같은 기관의 다른 무장애여행 파일과 나란히 놓고 쓴다.
description_portal: '제주특별자치도 내 돔베낭길(올레7코스)_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도 돔베낭길(올레7코스) 무장애여행관광정보」로, 제주특별자치도에서 제공하는 관광지 돔베낭길(올레7코스)에 대한 무장애(Barrier-Free) 여행 정보이다. 자료에는 관광지 개요, 주소, 주차장 및 화장실 시설 현황, 코스 정보, 휴무일 및 관람료 등의 기본 정보가 포함되어 있으며, 주차장이나 화장실 등 각 주요 포인트별 사진 이미지가 제공되어 현실적 시설 상태를 파악할 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
