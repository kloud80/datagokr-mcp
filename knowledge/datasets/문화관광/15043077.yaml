summary_user: 해남군에서 호텔업 사업계획 승인을 받은 시설을 호텔별 한 건씩 담은 파일로, 호텔명·소재지·객실수·규모·사업계획 승인일·준공예정 시기를 담는다(593바이트 CSV의 소규모 목록). 해남 지역에 새로 들어설 호텔이 어디에 몇 객실 규모로 승인됐는지 확인하려는 관광 분야 사업자·분석가·행정 담당자가 숙박시설 공급 전망을 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 숙박업 인허가 자료(LOCALDATA 등)와는 호텔명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 해남군 내 호텔업 사업계획 승인 현황에 관한 공공데이터로, 「관광진흥법」 등 관련 법령에 따라 사업계획 승인을 받은 관광숙박업(호텔업) 시설의 현황 정보를 제공합니다. 주요 항목으로는 호텔명, 소재지, 객실수, 사업계획 승인일자 등의 정보가 포함되어 있으며, 지역 관광숙박시설 개발 현황과 투자 동향을 파악하고 관광정책 수립, 행정업무, 연구·분석 자료 등 다양한 목적으로 활용될 수 있습니다. 다만, 본 자료는 사업계획 승인 단계의 정보를 기준으로 작성된 자료이므로 실제 호텔 준공 여부, 운영 개시 여부 등 운영 사항과는 차이가 있을 수 있습니다.
