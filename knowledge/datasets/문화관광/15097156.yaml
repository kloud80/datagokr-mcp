summary_user: 제주 행원리 풍차마을의 무장애 여행코스를 지점별 행으로 담은 파일로, 각 행에 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 해당 여부, 데이터기준일자가 들어 있습니다. 휠체어 이용자나 영유아 동반 가족이 이 마을에서 어떤 순서로 어느 지점을 거치면 무장애로 둘러볼 수 있는지 계획할 때 쓰고, 무장애 관광 안내 자료를 만들 때도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 마을 이름이나 위도·경도 좌표를 기준으로 맞춰 이어 써야 합니다.
description_portal: '"제주특별자치도 내 행원리풍차마을_무장애여행코스 데이터를 제공합니다.* 제주특별자치도 행원리 풍차마을은 장애인·노약자·영유아 동반 가족 등 관광약자의 이용 편의를 고려해 무장애 여행이 가능한 코스를 제공하는 관광지입니다. 본 자료에는 마을의 개요, 위치 정보, 주차장 및 화장실의 접근성, 추천 여행 코스, 휴무일 및 관람료 등의 기본 정보를 포함하고 있어 이동이나 이용에 제약이 있는 이용자의 방문 계획에 유용합니다. 또한 이 정보는 관광 서비스 접근성 개선, 무장애 여행 안내 자료 제작 및 관련 정책 수립의 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
