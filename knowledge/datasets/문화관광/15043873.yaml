summary_user: 한국저작권위원회가 운영한 저작권 교육을 교육대상(청소년·성인)별로 나눠 교육횟수와 교육인원을 연도별로 집계한 전국 단위 통계 파일(csv, 428 bytes)이다. 2009~2015년 합계와 2016년부터 2025년까지 연도별 열로 되어 있어, 연구자나 교육 담당자가 청소년과 성인 대상 저작권 교육이 해마다 얼마나 늘거나 줄었는지 살펴보는 데 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키나 코드가 없어, 다른 통계와 이을 때는 연도·교육대상 이름을 직접 맞추거나 같은 기관의 다른 저작권 통계와 나란히 놓고 본다.
limits: 교육 건별 원천이 아닌 연도별 집계라 지역·기관·교육과정별로 나눠 볼 수 없다. 2009~2015년은 한 열로 합쳐져 있어 이 기간의 연도별 추이는 알 수 없다. 연도가 행이 아니라 열로 펼쳐져 있으므로 분석 전에 형태를 바꿔야 한다.
