description_portal: 한국저작권위원회에서 국민의 평생교육을 촉진하고 인적자원 개발 및 관리를 위해 학습계좌 제도를 도입하고 운영하도록 노력해야 합니다. 학습계좌는 개인의 학습경험을 종합적으로 관리하는 시스템을 의미하는데 평생교육법 시행령 제23조 기반으로 저작권 교육은 대상별 맞춤형으로 제공되며 각 대상에 맞게 교육 내용과 방식이 다르게 구성되어 있습니다. 청소년별 교육횟수, 교육인원과 성인별 교육횟수, 교육인원을 교육대상구분하여 저작권 교육대상별 따른 교육 인원과 교육 횟수 연도별 통계 현황 및 데이터입니다.
