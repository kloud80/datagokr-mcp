description_portal: '- 통영시 시립박물관을 방문하는 방문객 수(성인, 청소년, 어린이)에 대하여 통영시민과 타지역  관광객을 구분한  정보입니다.- 경상남도 통영시 시립박물관 일일이용객현황 데이터는 매월 갱신되며, 날짜별로 통영시민과 타지역 관광객의 방문자 수를 성인, 청소년, 어린이로 구분해 제공한다. 또한 휴관일 정보와 데이터 기준일자를 포함하여 박물관 운영 현황을 종합적으로 파악할 수 있다. 최근 지역관광과 전시, 문화 등의 키워드가 이슈가 되면서 해당 데이터는 관광 수요 분석과 방문객 트렌드 예측에 활용도가 높다.'
