summary_user: 경기도 안의 공공 기타체육시설(썰매장·풋살장·파크골프장 등)을 시설 한 곳당 한 행으로 담은 현황 자료이며, 시군명, 관리주체, 준공연도, 부지·건축·연면적, 수용인원, 관람석 수, 건설사업비, 주소와 위경도를 포함한다. 주민이나 분석가가 "우리 시군에 파크골프장이나 풋살장이 몇 곳 있고, 수용 규모는 어느 정도인가"를 확인하고 시군별 체육 인프라를 비교하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 시군 코드·시군명, 시설명 같은 이름이나 위경도를 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내 공공 기타체육시설(썰매장, 풋살장, 파크골프장 등)의 현황을 수록한 자료로, 시설명, 시군명, 관리주체, 준공연도, 부지 및 건축·연면적, 수용인원, 관람석 수, 건설사업비, 위치정보(지번 및 도로명 주소, 위도·경도) 등의 정보를 포함하고 있습니다. 주요 항목으로는 ‘시설명’, ‘연면적(㎡)’, ‘수용인원수(명)’, ‘건설사업비(백만원)’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며, 시민 여가활동 활성화, 지역 맞춤형 체육 인프라 분석, 시설 운영 실태 점검 등에 활용될 수 있습니다. ‘비고사항’에는 복합시설 여부 등이 표시되며, 다양한 유형의 체육시설이 포함되어 있어 용도별로 세분화된 분석이 가능하고, 일부 항목은 누락되어 있으므로 해석 시 주의가 필요합니다.
