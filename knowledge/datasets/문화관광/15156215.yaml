summary_user: BIGKinds(빅카인즈)에서 수집한 재건축·정비사업 관련 뉴스를 기사 한 건 단위로 담은 메타데이터 파일로, 보도 일자·언론사·제목·통합분류(1~3단계)·인물·지역·기업 개체명·키워드·특성추출 값을 담는다(CSV 약 82MB). 도시·부동산 연구자나 정책 담당자가 '안전진단·초과이익환수제 같은 제도 변화 시기에 어떤 지역과 단지가 언론에 집중적으로 다뤄졌는가'를 보는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 일자, 지역 개체명, 언론사 이름을 맞춰 연결해야 한다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 재건축 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적·정량적 분석이 가능합니다.본 자료는 국내 주요 언론사의 재건축·정비사업 관련 보도를 대상으로, 어떤 지역과 단지가 어느 시기에 집중적으로 다뤄졌는지, 주요 키워드와 보도 프레임이 어떻게 형성되었는지 등을 파악하는 데 중점을 두고 있습니다. 이러한 분석을 통해 언론이 재건축 규제·완화 정책, 안전진단·초과이익환수제 등 제도 변화, 서울·수도권 주요 단지 사례, 분양·정비사업 추진 동향, 시장 영향 및 주택가격 논쟁 등의 이슈를 어떤 관점에서 재현하는지 확인할 수 있으며, 이러한 보도 경향이 국내 여론과 정책 논의에 어떤 영향을 미쳤는지를 추적하는 데도 유용합니다.또한 이 자료는 학계, 도시·부동산 연구자, 정책 담당자, 지자체 및 사업 시행자 등에게 재건축 관련 보도의 흐름, 이슈별 프레임 변화, 언론의 도시·주택 정책 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
