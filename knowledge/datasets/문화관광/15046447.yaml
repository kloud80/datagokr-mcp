description_portal: '○ 통계개요* 통계명 : 주요관광지점 입장객(박물관 및 전시관 등)* 통계종류 : 서울시 주요 관광지점 입장객 현황을 제공하는 일반ㆍ보고통계(승인번호 제11305호)* 작성목적 : 관광지, 관광시설, 국,도,군립공원, 문화유적지 등의 입장객 및 시설이용객현황을 조사하여 국민 관광형태의 분석자료로 활용* 조사체계 : 입장료징수자(유료관광지) 및 조사원(무료관광지)→구·시·군 관광담당부서→시·도 관광담당부서→문화체육관광부* 공표주기 : 정기* 공표범위 : 지역 - 서울시 주요 관광지점내용 - 주요 관광지점 입장객(내국인, 외국인)○ 용어설명* 입장객 : 관광지 및 관광시설의 물리적 공간 안으로 이동하는 모든 사람을 말함'
