description_portal: 이 데이터는 서귀포칠십리시공원 의 위도·경도, 장소명칭, 장소 상세정보, 무장애 관광편의시설 정보를 체계적으로 정리한 공공데이터이다. 이 공원은 잔디 광장, 연못, 산책로, 놀이터, 파크골프장, 조형물 및 전시 공간 등을 포함하며, 평지 또는 완만한 도로로 대부분 구성되어 있어 휠체어나 유모차, 고령자 등 이동 약자도 이용 가능하도록 동선과 접근성이 확보되어 있다. 또한 공원 안과 주변의 문화‧자연 자원을 연결하는 열린 관광지로서, 무장애 여행 코스 설계, 관광안내 자료 제작, 도시·관광 정책 수립, 관광자원 관리 등에 활용 가능하며, 데이터는 CSV 형식으로 무료 제공된다.
