summary_user: 국내외 144개 도서관이 참여한 한국고문헌종합목록시스템에 구축된 고문헌 서지데이터 약 51만 건을 레코드 단위로 담은 파일로, 레코드마다 MARC 서지 기록과 소장 도서관의 부호·이름이 붙어 있습니다. 연구자나 분석가가 특정 고서·문집이 어느 도서관에 소장돼 있는지, 기관별로 어떤 고문헌을 갖고 있는지 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 도서관부호나 도서관명을 다른 도서관 목록과 이름·코드로 맞춰 연결해야 한다.
