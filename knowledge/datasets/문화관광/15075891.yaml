summary_user: 대전광역시 안의 관광명소를 한 곳당 한 행으로 담은 목록 파일로, 구분·명소명·소재지·전화번호·상세소개 링크·담당부서와 그 연락처를 담는다(CSV 약 12.7KB). 대전 여행을 계획하는 사람이 '대전에서 가볼 만한 곳과 위치, 문의처는 어디인가'를 확인하거나, 분석가가 대전 관광지 현황 목록을 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광정보(contentId·지역코드) 등 다른 데이터와는 명소명이나 소재지 주소를 맞춰서만 이을 수 있다.
limits: TourAPI의 contentId 같은 공통 코드가 없어 다른 관광 데이터와 자동으로 결합되지 않고, 이름·주소 매칭에 의존해야 한다. 관광 콘텐츠 분야에서는 TourAPI를 대표 원장으로 두고 이 같은 지자체 관광지 파일은 보조 자료로 분류되어 있다. 상세소개는 본문이 아니라 URL로 제공된다.
