summary_user: 전북특별자치도 순창군에 등록된 여행업체를 업체별로 한 줄씩 담은 등록현황 파일로, 업종·상호·소재지·전화번호 네 항목만 있고 파일 크기는 534바이트로 소규모다. 순창군에서 영업 중인 여행사를 찾거나 연락처를 확인하려는 주민·여행객, 군 단위 여행업체 분포를 살피는 관광 행정 담당자가 쓴다. 실측 컬럼에 등록번호·사업자번호 같은 전역 조인 키가 없어, 다른 관광사업 등록 자료와는 상호·주소 이름 매칭이나 같은 기관(순창군) 기준으로만 이어 쓴다.
