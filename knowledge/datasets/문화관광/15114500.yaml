description_portal: 본 오픈API는 경주시 관내에 지정된 중요무형문화재에 대한 영상이미지 정보를 REST 방식으로 제공한다. 각 무형문화재별로 파일명, 이미지 URL, 주소, 위도·경도 등 위치정보가 구조화되어 포함되어 있다. 이를 통하여 외부 시스템 및 모바일 애플리케이션에서 무형문화재의 시각 콘텐츠를 연계 조회할 수 있으며, 시민 및 관광객의 문화유산 정보 접근성을 강화한다. 또한 관광문화 홍보, 여행 플랫폼 연동, 향후 AI 기반 문화서비스 개발을 위한 기초 자료로 활용 가능하다. 제공 데이터는 표준 포맷과 명확한 구조를 갖추어 개발자 및 일반 사용자 모두 쉽게 활용할 수 있으며, 공공데이터포털을 통해 무료로 접근·조회할 수 있다는 특징이 있다.
