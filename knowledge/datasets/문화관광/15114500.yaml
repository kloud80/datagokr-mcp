summary_user: 경주시 관내 중요무형문화재별 영상·이미지 정보를 항목 단위로 담으며, 이름·이미지파일명·주소·위도·경도·설명 같은 개별 위치·콘텐츠 정보를 함께 제공한다. 관광 앱이나 여행 플랫폼 개발자가 '경주의 무형문화재를 사진과 위치와 함께 지도에 보여주려면 어떤 자료가 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 문화재·관광 데이터와는 무형문화재 이름이나 주소·좌표 매칭, 또는 같은 경주시 관광자원 API의 분류아이디(CODE_UID)로만 연결한다.
limits: 표준 문화재 코드 같은 공통 키가 없어 국가유산 지정 정보와 바로 결합할 수 없고, 이름·좌표를 대조해 맞춰야 한다. 범위는 경주시 한 곳뿐이다. 개발계정은 하루 10,000회까지 호출할 수 있다.
