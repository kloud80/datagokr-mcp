summary_user: 경상북도 시군별 파크골프장을 시설 한 곳당 한 행으로 정리한 목록으로, 시군·시설명·주소·홀수·운영기관을 담는다(CSV 약 4.7KB). 주민이 우리 시군에서 가까운 파크골프장이 어디이고 몇 홀 규모인지, 누가 운영하는지 확인하거나 분석가가 시군별 시설 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 다른 체육시설·인구 데이터와는 시군명이나 주소를 기준으로 맞춰 이어 쓴다.
description_portal: 경상북도 파크골프장현황은 도내 각 시군에 위치한 파크골프장의 현황을 종합적으로 정리한 자료입니다. 주요 항목에는 시군, 파크골프장명, 주소, 홀수, 운영기관이 포함되어 있으며, 각 시설의 위치와 규모, 관리 주체를 체계적으로 파악할 수 있습니다. 본 자료는 시민의 여가활동 및 생활체육 참여 확대를 위한 기초자료로 활용되며, 시설 운영의 효율성 제고와 신규 체육시설 조성 계획 수립에도 이용됩니다. 데이터는 행정기관의 관리 현황에 따라 주기적으로 갱신되며, 시군 단위의 공공체육시설 정보를 표준화된 형식으로 제공합니다.
