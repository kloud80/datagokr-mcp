summary_user: 경기도 내 유선업(관광·유락 목적 선박 운항)과 도선업(사람·물건 수송) 사업자를 사업자 한 곳당 한 행으로 담고, 상호·업종구분·시군·전화번호·선박내역·영업구역·사업기간·운영시간·운임·선원 수·주소·좌표를 포함한다. 하천·호수에서 유람선이나 나룻배를 운영하는 업체를 찾는 관광객, 또는 시군별 수상관광·수상교통 사업자 분포와 안전관리 대상을 파악하려는 분석가가 쓴다. 실측상 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD), 주소·좌표, 사업자등록번호로 다른 경기도 데이터나 관광지 목록과 이름·위치 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 유선 및 도선 관련 수상운송사업자의 현황을 정리한 자료로, 사업자의 상호명, 업종구분(유선업/도선업), 시군명, 전화번호, 선박내역, 영업구역, 사업기간, 운영시간, 운임요금, 선원 수 등 다양한 정보를 포함합니다. 유선사업은 관광이나 유락 목적의 선박 운항을, 도선사업은 사람 또는 물건을 수송하는 영업을 의미하며, 모두 해운법의 적용을 받지 않고 지방자치단체의 관리하에 이루어집니다. 해당 데이터는 수상관광산업 육성, 하천·호소 기반 관광지 분석, 지역 수상교통 인프라 평가, 안전관리 대상지 선별, 민간 운영 정보 통계 구축 등에 활용할 수 있습니다.
