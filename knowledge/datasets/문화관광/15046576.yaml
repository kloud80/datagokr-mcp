description_portal: '○ 통계개요* 통계명 : 문화공연 및 전시회* 통계종류 : 서울시 공연ㆍ전시 등 문화행사 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 객관적이고 신뢰성있는 공연예술 분야의 통계산출 및 공연예술시장 운용실태에 대한 체계적 분석으로 예술정책을 위한 기초자료로 활용하는 것을목적으로 함* 조사체계 : 해당기관 → 한국문화예술위원회* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 미술전시건수, 국악, 양악, 연극, 무용 등 공연건수○ 용어설명* 공연건수 : 한 공연장에서 일정기간 동안 한 공연이 무대에 오르는 것을 한 건으로 함* 시각예술 : 회화, 서예, 공예, 조소, 디자인, 영상, 만화, 건축, 행위, 조형, 혼합, 기타 등* 국악 : 기악, 성악, 합창, 연희, 복합, 기타* 양악 : 기악, 성악, 합창, 오페라, 복합, 기타* 무용 : 한국무용, 현대무용, 발레, 복합, 기타* 연극 : 연극, 뮤지컬,복합, 기타* 혼합 : 국악, 양악, 무용, 연극 장르간 결합된 공연'
