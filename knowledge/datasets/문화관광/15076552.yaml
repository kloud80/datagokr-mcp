summary_user: '한국문화예술위원회가 정리한 공연예술 편람으로, 공연 한 건마다 연도·장르 분류(대·중·소분류, 예: 뮤지컬·연극·성악·기악·현대무용)·공연명·단체·주최·시작일과 종료일·공연횟수·지역(광역·기초)·공연장을 담은 전국 단위 건별 파일(CSV 약 53MB)이다. 연구자나 정책 분석가가 "어느 해, 어느 지역에서 어떤 장르의 창작초연 공연이 몇 건, 몇 회 열렸나" 같은 공연 활동 현황을 집계할 때 쓴다. 실측 컬럼에 공연ID·공연장ID 같은 공통 조인 키가 없어서, KOPIS 공연·공연장 데이터나 행정구역 자료와는 공연명·공연장명·시군구 이름을 맞춰 연결해야 한다.'
description_portal: AK공연에술의 편람정보입니다. 각 구성 항목으로는 연도, 대분류, 중분류, 소분류, 공연명1, 공연명2, 행사명, 세부장르, 창작초연/재공연, 단체, 단체국적, 참여작가수, 주최, 시작일, 종료일, 공연기간, 공연횟수, 지역1_광역자치단체, 지역2_기초자치단체, 공연장, 공연장_세부, 미등록공연장, 미등록공연장_세부, 공연시설 외, 공연장 운영주체, 실내/실외, 비고, 프로그램, 연번 항목으로 구성되어 있습니다. 또한 중분류 항목으로는 뮤지컬, 연극, 기타, 성악, 기악, 현대무용 등으로 구성되어 있습니다.  따라서 파일에서 AK공연에술의 편람 정보를 확인할 수 있습니다.
