summary_user: 핵심 저작권산업의 산업 부문별(출판·문학, 음악·연극·오페라, 영화·비디오, 라디오·TV, 소프트웨어·데이터베이스 등) 명목 매출액을 2013년부터 2021년까지 연도별 열로 담은 전국 단위 집계 통계 파일이다. 연구자나 정책 담당자가 '소프트웨어·데이터베이스 부문 매출이 2013년 이후 다른 부문에 비해 얼마나 늘었나' 같은 부문별 시장 규모와 추이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 산업 부문 이름을 직접 맞춰 붙이거나 같은 기관의 저작권 통계와 나란히 놓고 보는 방식으로만 이어 쓴다.
description_portal: 본 데이터는 2013년부터 2021년까지 국내 핵심 저작권산업의 부문별 연간 매출액 변화를 기록한 통계 자료입니다. 핵심 저작권산업이란 문학, 음악, 영화, 방송, 소프트웨어 및 데이터베이스 등 창작물의 생산과 직접적으로 관련된 분야를 의미합니다.데이터는 출판 및 문학, 음악·연극·오페라, 영화 및 비디오, 라디오 및 TV, 소프트웨어 및 데이터베이스 등 주요 산업 부문별 명목 매출액을 체계적으로 분류하여 제공합니다. 특히 소프트웨어 및 데이터베이스 분야의 지속적인 성장세와 미디어 콘텐츠 산업의 매출 구조 변화를 명확하게 확인할 수 있습니다.본 통계 자료는 국내 핵심 저작권 분야의 시장 규모를 파악하고, 디지털 콘텐츠 비즈니스의 성장 추이를 분석하는 데 핵심적인 지표로 활용됩니다. 정책 입안자, 연구자 및 기업 관계자들이 산업의 미래 전략을 수립하거나 시장 점유율을 분석하는 등 다각적인 의사결정을 내리는 데 유용한 기초 자료가 될 것입니다.
