summary_user: 서울 은평구에서 인터넷컴퓨터게임시설제공업과 다른 영업을 같은 장소에서 함께 하는 복합유통게임제공업소의 인허가 정보를 업소 한 곳당 한 행으로 담는다. 사업장명, 지번·도로명 주소, 인허가일·취소일, 영업상태·폐업일, 시설 면적·층수·조명·비상구 같은 시설 항목, 중부원점TM 좌표(X, Y)가 들어 있다. 구청 담당자나 주민이 '우리 동네에서 지금 영업 중인 복합유통게임장은 어디인가'를 확인하거나, 불법 사행성 게임 점검 대상을 추릴 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어, 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '은평구의 인터넷컴퓨터게임시설제공업 또는 다른 영업을 동일 장소에서 함께 영업하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.복합유통게임제공업은 게임기기 제공과 물품 판매가 병행되는 업종으로,  이 데이터는 해당 업종의 인허가 현황을 정리한 것입니다.  업체명, 주소, 인허가일, 영업상태, 담당기관 등의 정보로 구성되어 있으며,  불법 사행성 게임 운영 여부 점검, 유사 업종 비교 분석,  청소년 출입 제한 여부 관리 등에 활용됩니다.  해당 업종은 규제 사각지대에 놓이기 쉬워 공공안전과 밀접한 관련이 있으며,  지역 사회 내 게임산업 건전성 확보 및 민원 대응 체계 구축에 필요한 정보입니다.  또한, 유통구조 분석과 정책 대응 마련을 위한 기초자료로도 중요합니다.'
