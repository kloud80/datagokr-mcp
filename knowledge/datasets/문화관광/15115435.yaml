summary_user: 서울특별시 중랑구의 관광극장유흥업(관광객용 무도 시설을 갖춘 유흥주점) 업소를 인허가 건별로 담으며, 관리번호·인허가일자·영업상태·폐업일자·주소·전화번호·중부원점TM 좌표 등을 포함한다. 중랑구에서 현재 영업 중이거나 폐업한 관광극장유흥업소가 어디에 있고 언제 허가·폐업했는지 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관의 코드(개방자치단체코드, OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중랑구의 유흥주점영업의 허가를 받은 자가 관광객이 이용하기 적합한 무도 시설을 갖추어 음식 제공 및 노래와 춤을 감상 또는 춤을 출 수 있는 공간을 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
