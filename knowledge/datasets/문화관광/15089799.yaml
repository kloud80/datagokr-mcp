summary_user: 올림픽공원 안의 자판기·쓰레기통·화장실·간이편의점 같은 편의시설을 시설물 한 건씩 담은 CSV 파일로, 시설 구분·위치·상세위치·위도·경도·비고를 기록한다. 공원 방문객이나 시설 관리자가 '특정 광장이나 티켓박스 근처에 가장 가까운 화장실·자판기가 어디 있는가'를 확인하거나 지도에 시설을 표시하는 데 쓴다. 전역 조인 키는 없으므로 위도·경도 좌표로 다른 위치 데이터와 공간 결합하거나 위치 이름을 직접 맞춰 이어 쓴다.
limits: 다른 데이터와 공통 코드로 바로 연결되는 키가 없어 좌표나 장소명 매칭에 의존해야 한다. 데이터 범위는 '전국'으로 분류돼 있지만 실제 내용은 올림픽공원 한 곳의 시설이며, 영업일이 바뀌거나 사용할 수 없는 시설은 비고란에만 적혀 있어 현재 운영 여부를 별도로 확인해야 한다.
