description_portal: 서울올림픽기념국민체육진흥공단에 배치된 2021년 공공데이터 청년인턴(일경험 수련생)을 통해 수집된 올림픽공원 내 편의시설(자판기, 쓰레기통, 간이편의점 등) 정보를 제공하는 데이터 입니다. 쓰레기통, 자판기, 화장실 등 공원 내 편의시설의 위치 정보를 제공하며, 장소별로 시설물이 어디에 배치되어 있는지 확인할 수 있습니다. 각 시설물의 상세위치(1-3개이를 앞, 티켓박스 근처, 광장 근처 등)와 위도·경도 좌표를 포함하고 있어 방문객들이 필요한 편의시설을 쉽게 찾을 수 있도록 돕습니다. 유동적인 영업일이나 사용불가의 편의시설의 경우 비고에 기재하고 있습니다.
