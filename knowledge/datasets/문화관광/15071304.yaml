summary_user: 국립아시아문화전당의 공연·전시 등 프로그램별로 판매 창구(현장, PC, 기타 온라인 등)를 한 행씩 기록한 파일로, 구분·장르·대상·상영시간·공연 기간·요금정보를 함께 담는다(약 14KB 규모의 CSV). 문화기관 운영자나 분석가가 "이 전당의 어떤 장르·대상 프로그램이 어느 판매 창구로 팔렸는가"를 살펴보는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연ID 같은 외부 키로 바로 연결되지 않으며, 다른 공연 데이터와는 공연명·기간을 이름으로 맞춰 이어 쓴다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 다른 공연 목록·예매 데이터와의 결합은 공연명 매칭에 의존한다. 명세상 수시·이벤트성으로 생성되는 파일이라 정기 갱신을 전제로 시계열을 만들기 어렵다. 국립아시아문화전당 한 기관의 프로그램만 담아 전국 공연 시장을 대표하지 않는다.
