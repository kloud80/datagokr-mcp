description_portal: '국립아시아문화전당의 공연·전시 등 프로그램에 대해, 판매 창구 유형별 거래 현황을 제공하는 데이터입니다. 각 행은 하나의 프로그램과 해당 프로그램의 판매 창구(예: 현장, PC, 기타 온라인 등)에 대해 기록된 거래 정보를 나타냅니다. 제공 데이터 항목은 구분, 공연명, 장르, 대상, 상영시간(분), 공연시작일, 공연종료일, 요금정보, 창구이며, 프로그램의 기본 속성(구분·장르·대상·상영시간·기간)과 함께, 요금 체계 관련 정보(요금정보), 판매가 이뤄진 창구(창구)를 포함합니다. 이 데이터를 통해 프로그램별·창구별 거래 규모와 분포를 파악하고, 채널 특성에 따른 행사, 공연에 따른 장르 등을 분석할 수 있습니다. 또한 기간 정보(공연시작일·공연종료일)와 결합하여 특정 시기 또는 회차 단위의 판매 양상을 비교하는 등 운영·정산·보고서 작성에 활용 가능합니다.'
