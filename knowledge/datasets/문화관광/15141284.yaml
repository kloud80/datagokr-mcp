summary_user: 서울특별시 금천구에 있는 인터넷컴퓨터게임시설제공업(PC방) 인허가 사업장을 한 행에 한 곳씩 담은 건별 원천 데이터로, 인허가일자·영업상태·폐업일자·전화번호·지번/도로명 주소·사업장명·좌표(X, Y)와 시설면적·층수 같은 시설 항목을 담는다. 주민이 집 근처에서 지금 영업 중인 PC방을 찾거나, 예비 창업자가 금천구 안의 영업 중·폐업 PC방 현황을 보고 경쟁 상황을 가늠하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소를 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있다.
description_portal: '본 자료는 서울특별시 금천구에 위치한 인터넷컴퓨터게임시설제공업, 흔히 ‘PC방’이라 불리는 시설의 인허가 현황을 체계적으로 정리한 것입니다. 각 사업장의 인허가일자, 현재 영업 상태, (폐업한 경우)폐업일자, 전화번호와 주소, 사업장명이 포함되어 있어 주민 여러분께서 신뢰할 수 있는 정보를 확인하실 수 있도록 하였습니다.이 자료는 게임 이용을 원하는 주민들께서 가까운 PC방의 위치와 영업 상태를 확인하는 데에 큰 도움이 됩니다. 또한, 신규 사업자나 예비 창업자분들께서도 현재 운영 중인 시설 현황을 파악하고, 지역 내 경쟁 상황과 인허가 절차를 이해하는 데 유용하게 활용하실 수 있습니다.폐업일자가 함께 수록되어 있으므로, 영업 중인 PC방과 폐업한 곳을 구분하여 혼선을 줄이고 정확한 정보 제공에 힘쓰고 있습니다. 전화번호를 통해 영업 시간이나 서비스 내용 등 구체적인 문의도 가능하오니, 방문 전 참고하시길 바랍니다.우리 구는 앞으로도 주민 여러분께 안전하고 투명한 정보 제공을 위해 최선을 다하며, 쾌적한 지역 생활 환경 조성에 힘쓰겠습니다.(담당부서 : 금천구 문화체육과)'
