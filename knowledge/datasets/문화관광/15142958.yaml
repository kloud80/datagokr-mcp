summary_user: 서울 마포구에 등록된 한옥체험업 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호·사업장명·인허가일자·영업상태·도로명/지번주소와 중부원점TM 좌표를 포함한다. 마포구에서 지금 영업 중인 한옥 숙박 체험 업소가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지를 확인하거나 지역 숙박 시장을 분석하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 다른 숙박업 인허가 데이터와 같은 공통 원천 구조로 함께 묶어 쓴다.
description_portal: '마포구의 우리나라 고유의 형식으로 지은 한옥에 숙박 체험하기에 적합한 시설을 갖추어 관광객에게 이용을 제공하는 업소정보각 업체가 위치한 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 실제 위치를 나타내는 도로명 주소 및 지번주소가 포함되어 있으며, 사업장명, 관리번호, 등록일자, 영업 상태(영업 중, 폐업, 말소 등) 등의 세부 항목이 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
accrual_periodicity: 수시
