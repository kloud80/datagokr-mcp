summary_user: 부산광역시 부산진구 관내 국가유산을 한 건씩 담은 목록 파일로, 유산명·소재지·관리주체·지정번호·지정일자·시대·종별·위도·경도를 개별 유산 단위로 담는다. 주민이나 관광·문화 분석가가 '부산진구에 어떤 지정 유산이 어디에 있고 언제 무슨 종별로 지정됐나'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키가 없어 국가유산청 자료와는 유산명·지정번호·종별을 이름 매핑으로 맞춰야 하며, 위도·경도로 다른 위치 데이터와 공간적으로 겹쳐 볼 수 있다.
