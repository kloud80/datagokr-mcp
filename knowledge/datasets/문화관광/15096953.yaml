description_portal: '제주특별자치도 내 국민 여행 조사_성별 제주 여행 횟수 데이터를 제공합니다.항목: 연도, 시도, 성별, 여행횟수(천회) 등* 한국 내 국민을 대상으로 이루어진 “국민 여행 조사”에서 성별에 따라 제주특별자치도를 여행한 횟수를 집계한 통계 자료입니다. 즉, 남성과 여성이 제주를 방문한 평균 횟수 또는 전체 응답자 중 특정 성별이 제주 여행을 얼마나 자주 했는지를 보여주는 정보이며, 제주관광이 어느 정도 성별에 따라 여행 빈도가 차이가 있는지를 파악할 수 있습니다.* 활용 분야 : 성별 맞춤 관광 마케팅, 관광 상품 및 서비스 개선, 관광객 수요 예측 및 자원 배분 등- 데이터 제공처; 한국관광 데이터랩'
