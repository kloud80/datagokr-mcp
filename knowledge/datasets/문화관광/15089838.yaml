summary_user: 빅카인즈(BIGKinds)에서 모은 사회적 약자(장애인·노인·아동·저소득층·이주민 등) 관련 기사의 메타정보를 기사 한 건당 한 행으로 담은 CSV 파일(약 95KB)로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목이 들어 있다. 연구자나 정책 분석가가 '특정 시기에 장애인·이주민 같은 사회적 약자 이슈가 어느 언론사에서 어떤 키워드로 보도됐는가'처럼 보도 경향과 담론 변화를 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자나 언론사 이름, 키워드 문자열을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 사회적 약자 관련 뉴스 메타정보 자료입니다. 사회적 약자는 경제적·신체적·사회적 여건으로 인해 차별이나 불이익을 겪는 집단으로, 장애인, 노인, 아동, 저소득층, 이주민 등이 포함됩니다. 본 자료는 국내 주요 신문과 방송에서 사회적 약자와 관련된 기사들을 수집하여 주요 키워드와 빈도를 추출하고, 시기별 보도 경향과 사회적 인식 변화를 파악할 수 있도록 구성되었습니다. 이를 통해 차별 해소, 복지 확대, 사회 안전망 강화, 포용적 사회 실현 등과 같은 핵심 이슈가 언론 담론에서 어떻게 다루어졌는지를 확인할 수 있습니다. 또한 학술 연구, 정책 분석, 언론 연구, 교육 현장에서 활용할 수 있는 기초 자료로, 사회적 약자를 둘러싼 담론의 흐름을 객관적으로 이해하고 보다 공정하고 포용적인 사회를 구축하는 데 기여할 수 있습니다.
