summary_user: 대구도시개발공사 유니버시아드레포츠센터가 운영하는 문화·체육 강좌를 강좌 한 건당 한 행으로 담은 파일로, 교육기간·시각·운영요일·장소·정원·수강료·접수기간과 방법을 포함한다(CSV 약 4.8KB). 대구 시민이 "이번 분기 레포츠센터에서 평일 저녁에 들을 수 있는 강좌와 수강료, 접수 기간은 언제인가"를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 기관의 강좌 데이터와는 강좌명·교육장 도로명주소·운영기관명 같은 이름 기준으로만 맞춰 쓴다.
description_portal: 이 데이터는 대구도시개발공사 유니버시아드레포츠센터에서 운영하는 다양한 문화 및 체육 강좌에 대한 정보를 시민들에게 투명하고 효율적으로 제공하기 위한 목적으로 마련되었습니다. 이 데이터에는 강좌명, 교육시작일, 교육종료일, 교육시작시각, 교육종료시각, 강좌내용, 교육대상, 교육방법, 운영요일, 교육장소 등 상세한 내용이 포함되어 있습니다. 해당 데이터는 시민들이 유니버시아드레포츠센터의 강좌 프로그램을 쉽게 검색하고 자신에게 적합한 강좌를 선택하는 데 유용하게 활용될 수 있습니다.
