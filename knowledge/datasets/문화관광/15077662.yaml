summary_user: 경기도 내 관광객용 우수숙박시설을 업체 한 곳당 한 행으로 담은 현황 자료로, 시군명·업체명·전화번호·도로명/지번주소·우편번호·WGS84 위도·경도와 데이터 기준일자를 담는다. 관광객이나 여행 서비스 운영자가 '이 시군에 지정된 우수숙박시설이 어디 있고 연락처는 무엇인가'를 찾는 데 쓰고, 분석가는 관광지와의 거리 같은 접근성 분석에 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명·업체명·주소를 맞추거나 위경도 좌표를 지도에 겹쳐 연결한다.
description_portal: '이 데이터는 경기도 내 관광객을 위한 우수 숙박시설에 대한 현황 정보를 제공하는 자료로, 시군별로 등록된 숙소의 기본 정보를 포함합니다. 주요 항목은 시군명, 업체명, 전화번호, 도로명주소, 지번주소, 우편번호, 위도·경도 좌표(WGS84) 등으로 구성되어 있으며, 숙소의 위치 및 연락처, 지도 기반 서비스와의 연계에 필요한 공간 정보까지 함께 제공됩니다. 본 자료는 관광객을 위한 숙소 선택 지원, 지역관광지 접근성 분석, 행정기관의 숙박환경 관리 및 품질 향상 정책 수립, 공공 포털(예: 경기관광포털)과의 연계자료로 활용될 수 있습니다.※ 한국관광품질인증제 도입에 따라 한국관광공사의 굿스테이 지정사업은 2018년 10월 31일부로 종료되었습니다.'
