summary_user: 대구광역시 서구에 있는 민간 체육시설업(체육도장·골프연습장·체력단련장·당구장·무도학원·수영장 등)을 업소 한 곳당 한 줄로 담은 명부로, 업종·상호·도로명주소·행정동·전화번호가 들어 있고 범위는 서구 한 개 시군구다. 서구에서 헬스장이나 태권도장 같은 업종이 어느 동에 몰려 있는지 보려는 주민·창업자·상권 분석가가 쓴다. 전역 조인 키가 없어서 다른 데이터와는 상호·주소·행정동 이름을 맞춰 붙여야 하고, 다른 시군구의 체육시설업 현황이나 상권 데이터와 업종·행정동 단위로 비교하는 식으로 이어 쓴다.
description_portal: 대구광역시 서구의 체육시설업 현황을 나타내는 데이터 입니다. 체육시설업, 체육도장업, 무도학원업 등 업종별 상호와 주소 등의 데이터를 포함하고 있습니다.본 데이터는 대구광역시 서구 내에 소재한 다양한 체육시설업의 현황을 체계적으로 정리한 자료이다. 업종별로 수영장, 체육도장, 골프연습장, 체력단련장, 당구장, 무도학원, 가상체험 체육시설, 체육교습업, 인공암벽장 등 다양한 분야의 시설 명칭과 도로명 주소, 행정동, 연락처 정보를 포함하고 있다. 이를 통해 지역 주민과 방문객이 체육시설에 대한 정보를 손쉽게 확인할 수 있으며, 행정적 관리와 정책 수립, 민간 사업자의 사업 분석 및 지원에도 활용 가능하다. 체육 활성화 및 생활체육 인프라 확충을 위한 기초자료로서의 역할을 수행한다.
