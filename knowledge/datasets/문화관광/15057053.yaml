summary_user: 경기도 내 자연공원(국립·도립·군립·지질공원 등)을 공원 한 곳당 한 행으로 정리한 현황 목록으로, 공원명·구분·위치(시도·시군)·면적(㎢)·지정일자·주요시설(탐방안내소·화장실·주차장 등)을 담는다. 여행자나 지역 관광 분석가가 "경기도 어느 시군에 어떤 자연공원이 있고, 주차장이나 탐방안내소를 갖췄는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 공원명이나 시군명 같은 이름을 맞춰서만 연결한다.
description_portal: 이 데이터는 경기도 내 다양한 유형의 자연공원에 대한 현황 정보를 정리한 자료로, 각 공원의 명칭, 위치, 지정일자, 면적, 주요시설, 연락처 등을 포함합니다. 공원은 국립공원, 도립공원, 군립공원, 지질공원 등으로 구분되며, 위치정보는 시도 및 시군 단위로 표시되어 지역별 분포를 확인할 수 있습니다. 주요 항목은 공원명, 구분, 공원면적(㎢), 지정일자, 주요시설정보(탐방안내소, 화장실, 주차장 등), 연락처로 구성되어 있으며, 이를 통해 공원별 규모 및 접근성, 방문 편의시설 여부를 파악할 수 있습니다. 본 데이터는 환경보전 정책 수립, 지역 관광 개발, 자연환경 교육 자원 활용, 공원관리계획 수립 등에 유용하게 활용될 수 있습니다.
