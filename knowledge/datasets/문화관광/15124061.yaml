description_portal: 한국공예디자인문화진흥원은 공예문화산업 진흥법 제14조 1항 및 동법 시행령 제12조, 동법 시행규칙 제3조에 의거하여, 우수공예품 지정제도를 운영하고 있습니다. 대한민국을 대표하는 우수 공예품을 발굴, 지원하여  한국공예 상품의 품질과 소비자의 신뢰도 향상을 목적으로 합니다. 지원대상은 접수 마감일까지 대한민국 소재 사업자등록을 완료한 개인 또는 사업체(대표자는 대한민국 국적자)이며, 공예 종사자가 디자인을 개발하고 직접 제작(공정의 50% 이상 신청업체 수작업)하며, 유통중이거나 유통 준비가 완료된 지속 생산이 가능한 공예품입니다.  본 제도에서 지정된 우수공예품 정보를 제공하여 지정년도, 지정번호, 대표명, 업체명, 상품명, 판매가, 용도, 소재, 크기 설명 항목을 포함하고 있습니다.
