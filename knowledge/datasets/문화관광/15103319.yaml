summary_user: 군산시에 등록된 외국인관광 도시민박업체를 업체 한 곳당 한 행으로 담은 파일로, 업체명·국문 소재지 주소·영문 주소·운영상태를 담는다. 외국인 관광객이나 여행 플랫폼 사업자가 군산 시내에서 영업 중인 외국인 대상 도시민박이 어디에 있는지 찾을 때, 또는 분석가가 군산의 외국인 민박 분포를 볼 때 쓴다. 등록번호나 사업자번호 같은 전역 조인 키가 없어 다른 숙박·관광사업 데이터와는 업체명이나 주소를 맞춰 보는 방식으로만 연결한다.
limits: 실측 컬럼에 전역 조인 키가 없어 업체명·주소 매핑에 의존해야 하며, 동명 업체나 주소 표기 차이로 연결이 어긋날 수 있다. 범위는 군산시 한 곳의 개별 업체 주소이며 좌표는 컬럼에 없다.
