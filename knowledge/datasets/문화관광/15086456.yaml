description_portal: 한국언론진흥재단 미디어연구센터에서 정부광고 수수료를 재원으로 제작한 조사연구 자료입니다. 한일 갈등에 대한 양국 시민 인식 조사를 주제로 진행된 사회적 이슈 관련 일회성 조사로, 한국과 일본 양국 시민들이 상호간의 갈등 상황을 어떻게 인식하고 있는지를 비교 분석했습니다. 역사적 쟁점, 경제적 분쟁, 문화적 교류 등 다양한 차원에서 발생하는 한일 간 갈등에 대한 양국 국민의 인식 차이와 공통점을 파악하고, 미디어 보도가 상호 인식에 미치는 영향을 조사했습니다. 동아시아 지역의 중요한 외교적 관계에 대한 시민 의식을 이해하는 데 필요한 기초 자료를 제공하며, 향후 양국 관계 개선을 위한 정책 수립에 참고할 수 있는 데이터입니다. 조사연구에 대한 PDF 파일 형태로 제공되며, 공공누리 공공저작물 자유이용허락 조건에 따라 자유롭게 활용 가능합니다.
