summary_user: 경기도 내 영화관·자동차극장 등 영화 상영업체를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·좌표·시설면적·층수 같은 시설 정보를 함께 담는다. 지역 주민이나 분석가가 '우리 시군에 지금 영업 중인 영화관이 어디에 몇 곳 있는가'를 확인하거나 상영시설 분포를 지도로 그릴 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·주소·사업장명이나 위경도 좌표로 다른 경기도 데이터나 지도 자료와 맞춰 이어 쓴다.
description_portal: 「영화 상영업체 현황」 데이터는 경기도 내 영화관 및 자동차극장을 포함한 상영업체의 인허가 현황을 제공하는 자료입니다. 주요 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도(REFINE_WGS84_LAT, REFINE_WGS84_LOGT), 문화체육업종명(CULTUR_PHSTRN_INDUTYPE_NM), 시설면적(FACLT_AR), 소방시설여부(FIREFACLT_YN), 편의시설여부(CONVNCE_FACLT_YN) 등입니다. 데이터는 31개 시군별 인허가 정보로 구성되며, 영화관 위치 분석, 시설안전 점검, 문화시설 분포 연구, 지역별 영화산업 현황 파악 등에 활용할 수 있습니다. 또한 상영업체의 영업상태와 시설여건을 함께 제공하여 정책 수립 및 민간 연구에 유용한 기초자료로 활용됩니다.
