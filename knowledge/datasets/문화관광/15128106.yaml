summary_user: 창원시 관내 공공체육시설을 시설 한 곳당 한 행으로 정리한 파일(CSV, 약 14KB)로, 시설명·지역구·위치·시설 분류·주요시설·부지면적·준공연도·주요 이용 연령층과 연간·월간·1일평균 이용인원을 담는다. 창원시 어느 구에 어떤 종류의 체육시설이 있고 어느 시설에 이용자가 많이 몰리는지 파악하려는 주민·체육행정 담당자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 지역구 이름을 맞춰 연결해야 하며, 문체부 전국체육시설 자료 등과 비교할 때도 이름 매핑이 필요하다.
