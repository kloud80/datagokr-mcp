summary_user: 인천 서구(제목상 서해구)에 신고된 인쇄사를 업체 한 곳당 한 줄로 담은 건별 목록이며, 신고일자·사업체명·도로명 소재지가 들어 있다(CSV 약 5KB 규모). 지역 인쇄 업체를 찾거나 구 안에서 인쇄사가 어디에 몰려 있는지, 언제 신고됐는지를 확인하려는 주민·사업자·지역 산업 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 도로명 주소(사업체소재지)를 맞춰 잇거나, 주소를 좌표로 바꿔 지도·상권 자료와 겹쳐 쓴다.
