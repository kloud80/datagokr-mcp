summary_user: 서울 광진구에서 관광공연장업 인허가를 받은 업소를 한 곳씩 담은 건별 원천 데이터로, 관리번호·인허가일자·폐업일자·영업상태, 지번·도로명 주소, 좌표(X·Y), 무대면적·객석 수 같은 시설 정보를 포함한다. 관광·문화 분석가나 사업자가 '광진구에서 지금 영업 중인 관광공연장은 어디이고 객석 규모는 얼마인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 같은 기관 코드(OPNSFTEAMCODE)로 다른 자치구의 같은 업종 인허가 데이터와 묶거나, 업소명·주소를 맞춰 KOPIS 공연장 목록과 연결한다.
description_portal: 이 데이터는 서울특별시 광진구에서 관광공연장업 인허가를 받아 운영 중인 업소에 대한 현황 정보를 제공합니다. 관광공연장업은 공연물 상연을 위한 시설을 갖추고, 공연을 제공하면서 관광객을 대상으로 식사 및 주류를 함께 제공하는 형태의 업소입니다. 데이터에는 업소명, 소재지, 업종 유형, 인허가 상태 등 기본 정보가 포함되어 있으며, 지역 내 관광 기반 공연시설의 운영 현황을 파악하는 데 활용됩니다. 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84) 좌표는 포함되어 있지 않아 GIS나 지도 시스템 활용 시 좌표 변환이 필요합니다. 이 데이터는 3일 전 기준으로 갱신되는 자료이며, 지역 문화관광자원 분석, 관광산업 관리, 야간 관광 콘텐츠 기획, 외식 및 공연 융복합 산업 연구 등에 유용한 기초 데이터입니다.
