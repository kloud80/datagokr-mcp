summary_user: 전라남도 화순군 주요 관광지별 관광객 수를 연도 단위로 정리한 집계 파일(csv, 약 27KB)로, 범위는 화순군 한 개 시군구다. 지역 관광 담당자나 분석가가 '화순군에서 어느 관광지의 방문객이 해마다 늘거나 줄었는가'를 확인하는 데 쓴다. 전역 조인 키나 관광지점코드·시군구코드 없이 시도명·시군구명·관광지명만 있으므로, 다른 관광 통계나 지역 데이터와는 이름 매핑으로만 이어 쓴다.
limits: 관광지점코드·시군구코드 같은 표준 키가 없어 다른 지자체 관광지점 입장객 통계와 바로 결합하기 어렵고, 관광지명 표기를 맞춰야 한다. 포털 설명에는 월별·내외국인 구분이 언급되지만, 필드 목록에는 연도와 관광객 수만 있어 월별·유형별 분석 가능 여부는 파일에서 직접 확인해야 한다.
