description_portal: '문화재 돌봄사업을 수행하는 수행기관 현황. 문화재돌봄사업은 문화재 훼손을 사전에 예방하고 관람환경을 개선하는 문화재 보존관리사업입니다.「국가유산청_문화재 돌봄사업 수행기관」 데이터는 우리나라 각 지역에서 문화재 돌봄사업을 실질적으로 수행하는 기관들의 정보를 정리한 공개 목록입니다. 이 데이터는 문화재의 일상적 유지·관리와 보존을 담당하는 현장 기관들을 파악하고, 지역별 관리 체계를 확인할 수 있도록 돕습니다.📌 기본 정보데이터 명: 국가유산청_문화재 돌봄사업 수행기관제공 기관: 국가유산청공개 여부: ✅ 공개됨 (공공데이터포털 등에서 자유 이용 가능)파일 형식: CSV, XLSX 등 (기관명, 주소, 담당구역, 연락처 등 포함)🛠️ 주요 수록 내용항목설명기관명돌봄사업을 수행하는 비영리법인·재단·지자체 위탁기관소재지 주소해당 기관이 위치한 행정구역 주소담당 지역기관이 관리하는 시·군·구 또는 도별 구역주요 역할문화재 순찰, 경미 수리, 위험요소 점검, 자연재해 대비 등연락처전화번호, 이메일 등 대민 안내 정보 포함🎯 활용 사례정책 수립: 지역별 문화재 관리 현황 분석 및 예산 분배 근거로 활용연구·보고서 작성: 문화재 보존 체계와 인프라 연구 시 기반 자료로 활용현장 협력·공모: 문화재 보수·보존 관련 사업자 및 연구자와의 협업 기준 정보국민 이용: 지역 주민 또는 여행객이 지역 문화재 관리기관에 문의 시 활용 가능'
