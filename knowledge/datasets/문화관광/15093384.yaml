summary_user: 한국콘텐츠진흥원이 주관하거나 지원하는 콘텐츠 행사·마켓을 행사 단위로 담은 파일(zip, 약 66KB)로, 국·영문 행사명과 설명, 행사·공고 주소, 개최연도와 진행 여부, 모집·준비·개최·마감 기간이 들어 있다. 콘텐츠 사업자나 창작자가 올해 참가 모집 중인 해외·국내 콘텐츠 마켓이 무엇이고 신청 마감이 언제인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공연·문화행사 데이터와는 행사명이나 주소 문자열로만 맞춰 이어 쓴다.
description_portal: 본 자료는 콘텐츠 행사와 마켓 정보에 관한 상세한 내용을 포함하고 있습니다. 이 데이터셋은 대한민국 내에서 진행되는 다양한 콘텐츠 행사와 관련된 마켓 정보를 수집하여 구성된 것으로, 이러한 정보는 국내외 콘텐츠 산업의 동향을 파악하는 데 유용합니다. 또한, 행사 날짜, 장소, 주최자, 참가자 수, 입장료 등의 정보가 포함되어 있어 참여를 고려하는 이들에게 필요한 기본적인 참고 자료가 될 수 있습니다. 활용 방안으로는 콘텐츠 관련 사업자, 창작자, 마케팅 담당자 등이 이 데이터를 활용하여 행사 계획을 수립하거나 자신의 콘텐츠를 홍보하는 기회를 모색하는 데에 도움을 받을 수 있습니다. 이외에도 학술 연구자들이 콘텐츠 산업에 대한 분석을 위한 기초 자료로도 사용할 수 있습니다.
