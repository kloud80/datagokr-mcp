description_portal: '국립박물관문화재단이 운영하는 온라인 뮤지엄숍의 고객만족도 조사 관련 정보입니다.뮷즈(MU:DS)란 국립박물관이 소장한 문화유산을 모티브로 많은 사람들이 일상에서 가깝게 느끼고 사용할 수 있도록 만든 국립박물관문화재단의 박물관 상품 브랜드로 박물관 문화유산의 고유한 가치에 오늘날의 쓰임새를더해 유물을 소장하는 즐거움을 제공하고 박물관에서의 좋았던 순간을 일상에서 두고두고 이어가고 싶은 마음을 채웁니다.해당 데이터파일의 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 해주시기 바랍니다.  * 데이터 내용: 구분, 전체, 성별_남자, 성별_여자, 연령대_20대 이하, 연령대_30대, 연령대_40대 등'
