summary_user: 국립민속박물관이 수집·보존하는 민속 사진 자료를 자료 한 건 단위로 담으며, 자원 명칭·내용 설명·식별자·주제 분류·핵심주제어·제작일·물리적 형태·관련 공간 정보를 함께 제공한다. 민속학 연구자나 전시·교육 기획자가 '특정 지역이나 세시풍속 주제의 옛 민속 사진이 어떤 것이 있고 언제 만들어졌나'를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자료 명칭·주제어·공간(spatial) 같은 텍스트 매칭이나 같은 기관의 다른 민속아카이브 데이터와의 대조로만 잇는다.
description_portal: 국립민속박물관에서 수집·보존하고 있는 다양한 민속 사진 자료에 대한 상세 정보를 제공하는 데이터셋입니다. 소속DB, 책임 개체, 발행기관, 자원 명칭, 내용, 자원 식별, 관련자원, 핵심주제어, 제작일, 물리적 상태, 공간 등 주요 컬럼을 포함하고 있어 사진 자료의 체계적인 관리와 연구에 활용할 수 있습니다. 민속학 연구자, 문화예술 종사자, 교육기관 등에서 전통문화 연구, 전시 기획, 교육 자료 개발 등 다양한 목적으로 활용하기에 적합하며, 사진 자료의 용도와 기능, 주제 분류 등도 함께 확인할 수 있어 민속문화 이해에 도움을 줍니다.
