summary_user: 전국 광역·기초 지자체별로 활동 중인 문화관광해설사 인원을 집계한 데이터로, 포털 설명상 2023년 12월 31일 기준이며 지자체명과 활동인원(명) 두 항목만 담은 작은 CSV 파일(391바이트)이다. 지역관광 담당자나 연구자가 '우리 시군에는 문화관광해설사가 몇 명 활동하며 다른 지역과 비교해 많은가 적은가'를 확인하거나 지역별 해설 인력 분포를 볼 때 쓴다. 행정구역 코드 같은 공통 조인 키가 없어서 다른 관광 통계와는 지자체명을 이름으로 맞춰서만 이어 쓸 수 있다.
description_portal: 문화체육관광부가 제공하는 문화관광해설사 현황 데이터는 2023년 12월 31일 기준으로 전국 광역시 및 기초 지자체에서 활동 중인 문화관광해설사 인원 정보를 집계하여 제공한다. 본 데이터는 지자체별 배치 규모와 운영 현황을 확인할 수 있어 지역별 해설사 분포를 분석하거나 관광자원 해설 서비스 수급 현황을 파악하는 데 활용된다. 또한 문화관광해설사 인력 관리, 교육·양성 정책, 관광 해설 서비스 품질 제고, 지역관광 활성화 등 다양한 정책 수립 및 연구에 기초자료로 제공되며, 문화관광 분야 인적 자원 현황을 체계적으로 파악할 수 있도록 지원한다.
