summary_user: 인천광역시 서구에 등록된 수영장업 현황을 시설 한 곳당 한 행으로 담은 파일로, 상호·지번 주소·도로명 주소·전화번호·업종·데이터기준일자를 개별 시설 단위로 제공한다(csv 약 2.6KB 규모). 서구 주민이 집 근처에서 이용할 수 있는 수영장이 어디에 있고 연락처가 무엇인지 찾을 때, 또는 분석가가 구 단위 체육시설업 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명·지번 주소나 상호 이름을 맞추는 방식으로만 이어 쓰며, 좌표가 필요하면 주소를 지오코딩해 지도 데이터와 결합한다.
limits: 인천 서구 한 시군구만 다루므로 다른 지역이나 전국 비교에는 이 파일 하나로 부족하다. 코드 형태의 공통 식별자가 없어 다른 체육시설 데이터와 연결할 때 주소·상호 문자열 매칭에 의존해야 한다. 예약·대관 정보는 담지 않는다.
