description_portal: '이 데이터는 국가유산진흥원에서 운영하는 국가유산채널에 등록된 영상 콘텐츠의 프로그램 정보를 수록한 자료입니다. 각 프로그램별로 제목, 제작기관, 제작연도, 프로그램 소개문 등이 포함되어 있으며, 국가유산(문화유산, 자연유산, 무형유산 등)의 가치와 이야기를 다양한 형식으로 전달하는 콘텐츠를 체계적으로 관리·검색할 수 있도록 구성되어 있습니다.기준년도: 2025년「국가유산채널」은 소중한 한국의 유산과 그 의미를 알리기 위해 다양한 미디어 플랫폼을 통해 고품질의 콘텐츠를 제공합니다. 이 채널은 국가유산청과 국가유산진흥원에서 제작합니다. 국가유산채널에 대한 자세한 정보는 아래 링크를 참고해주세요. ◎ 국가유산채널 홈페이지 : https://www.k-heritage.tv/ ◎ 국가유산채널 유튜브 : https://www.youtube.com/@koreanheritage'
