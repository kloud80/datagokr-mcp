description_portal: 대중문화예술기획업자(연예기획사 등)는 대중문화예술산업발전법 제26조에 따라 대중문화예술기획업을 등록해야 합니다. 이 데이터는 대중문화예술종합정보시스템에서 제공하는 대중문화예술기획업 등록기업 정보 및 현황 데이터입니다. 등록된 대중문화예술기획업체 현황을 통해 해당 업체들의 기획업 상태와 관할 청을 알 수 있으며, 이 정보는 대중문화예술분야의 현황 파악 및 정책 수립에 활용될 수 있습니다. 예를 들어, 예술 기획사에 대한 통계 분석이나 시장조사, 지원 정책 개발 등에 사용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 번호(숫자형), 기업명(문자형), 대표자(문자형), 주사업장 소재지(문자형), 기획업 상태(문자형), 관할(문자형), 등록번호(문자형), 등록일자(날짜형)로 구성되어 있습니다. 이는 대중문화예술기획업의 전반적인 폐쇄와 운영에 대해 깊이 있는 통찰을 제공하는 자료가 될 것입니다.
