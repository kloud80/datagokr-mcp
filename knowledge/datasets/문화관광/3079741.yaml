summary_user: 경상남도 내 공공 수영장을 시설 한 곳당 한 행으로 담은 현황 파일로, 시군·시설명·소유기관·관리주체·부지·건축·연면적·실내외 구분·관람석 수용인원·준공연도를 시군구 단위로 정리했다. 도민이나 분석가가 '우리 시군에 실내 수영장이 몇 곳이고 언제 지어졌나'처럼 지역별 수영장 설치 현황과 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 체육시설·인구 데이터와는 시군 이름이나 시설명을 매핑해 이어 써야 한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 수영장 현황 데이터는 2020년 12월 기준 경상남도 내 수영장 현황에 대한 정보입니다. 수영장 시설이름과 면적 및 실내외 구분을 통해 수영장 설치현황에 대한 분석을 할 수 있습니다.(데이터 구성 및 세부항목) 데이터는 시도, 시군, 시설명, 소유기관, 관리주체, 부지면적(제곱미터), 건축면적(제곱미터), 실내외구분, 관람석 수, 준공연도로 구성됩니다. 총 29건입니다. 미집계 데이터는 공란처리합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터며 현행화 하지 않습니다.
