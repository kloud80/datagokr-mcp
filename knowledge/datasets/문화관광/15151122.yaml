summary_user: 국립어린이청소년도서관이 2006년 12월부터 게재해 온 독서칼럼을 칼럼 한 편당 한 행으로 담은 파일로, 제목·칼럼 본문·조회수·등록일·출판연도로 구성된다(CSV 약 64만 바이트). 청소년 독서지도 교사나 연구자가 '전문가들이 청소년에게 어떤 책과 독서 이야기를 권해 왔고, 어떤 칼럼이 많이 읽혔나'를 살펴보거나 본문 텍스트 분석 자료로 쓴다. 실측 컬럼에 도서관코드·ISBN 같은 전역 조인 키가 없어 다른 도서관·서지 데이터와는 칼럼 제목이나 본문에 나온 책 이름을 직접 맞춰 보는 방식으로만 이을 수 있다.
limits: 칼럼에 언급된 도서를 ISBN이나 도서관 소장·대출 데이터와 자동으로 연결할 키가 없다. 지역 구분이 없는 전국 단위 비공간 자료라 지역별 분석에는 쓰지 못한다.
