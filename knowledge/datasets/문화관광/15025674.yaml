summary_user: 부산진구에 등록된 관광숙박업(관광호텔·호스텔 등)을 업소별로 상호, 숙박업분류, 도로명 소재지, 전화번호와 함께 담은 시군구 단위 파일(CSV 약 3.8KB)이다. 부산진구에 묵을 관광호텔이나 호스텔을 찾는 여행객, 또는 구 내 관광숙박업소 분포를 파악하려는 분석가가 '부산진구에 등록된 관광숙박업소는 어디에 있고 어떤 유형인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(등록번호·사업자번호 등)가 없어 다른 숙박·관광사업 데이터와는 상호명이나 도로명 주소를 맞춰 이어 써야 한다.
description_portal: 안녕하세요. 부산광역시 부산진구 내 등록된 관광숙박업현황 정보데이터입니다.내국인, 외국인이 숙박할 수 있는 관광호텔, 호스텔에 관한  정보를 제공합니다주로 고가숙소는 관광호텔, 중저가 숙소는 호스텔입니다.자세하게는 업종,숙박업분류,상호명,주소 정보를 안내하고 있습니다.매년 업데이트하는 정보로서 최신화된 인포메이션을 제공하고 있습니다.저희 부산 진구에 방문하셔서 편안하고 즐거운 여행이 되면 좋겠습니다혹시 추가적인 문의사항은 부산진구청 홈페이지를 방문해주시기 바랍니다.감사합니다.
