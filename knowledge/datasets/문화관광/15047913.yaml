summary_user: 광주 김치타운 교육체험장(김치 담그기 등 체험) 이용객 수를 연도별 행(구분)로 묶어, 성인·청소년·어린이·외국인 구분과 1월~12월 월별 인원으로 담은 집계 파일이며 원본 크기는 861바이트로 작다. 지역 관광·식문화 담당자나 분석가가 "김치타운 체험 이용객이 어느 달에 몰리고 외국인 비중은 해마다 어떻게 변했나" 같은 질문에 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어, 다른 관광지점 입장객 통계와는 시설명·지역명을 손으로 맞춰야 이어 쓸 수 있다.
description_portal: 광주광역시  김치타운 교육체험장 이용객  현황 광주광역시 김치타운에서는 김치담그기 체험 등 김치에 대한 다양한 교육 및 체험을 운영하고 있으며 이에 따른 이용객을 연령별, 월별 등으로 구분하여 관리하고 있습니다.김치타운 교육체험장 이용객 현황은 김치타운 내 교육체험장 이용객을 연령별(성인, 어린이, 청소년), 외국인, 월별(1월 ~ 12월)로 구분하여 제공하는 데이터입니다.또한 연도별(2017년,2018년,2019년,2020년,2021년,2022년,2023년,2024년,2025년) 이용객 현황 데이터를 제공합니다.
