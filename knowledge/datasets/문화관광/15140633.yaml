description_portal: '은평구의 간판, 현수막, 전단지 등 광고물 또는 게시시설을 제작, 표시 및 설치하거나 옥외광고를 대행하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 간판, 현수막, 디지털 광고물 등 옥외광고물을 제작, 설치하거나 광고를 대행하는 업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 소재지 주소, 최초 등록일, 현재 영업 상태(영업중, 폐업 등)와 같은 도시 경관 및 광고 산업 관리를 위한 핵심 행정 정보가 포함되어 있습니다 .이 데이터를 통해 광고를 필요로 하는 소상공인이나 기업은 정식으로 등록된 합법적인 옥외광고 사업자를 확인하고 의뢰할 수 있습니다. 또한, 지자체는 이를 기반으로 난립하기 쉬운 옥외광고물을 체계적으로 관리하고, 관련 법규 및 조례를 준수하는지 감독하여 안전하고 쾌적한 도시 경관을 조성하는 데 필수적인 기초 자료로 활용합니다 . 최근 디지털 사이니지 등 신기술 광고물이 증가함에 따라, 이 데이터는 전통적인 간판 산업을 넘어 지역의 디지털 광고 산업 생태계를 파악하는 중요한 지표가 되고 있습니다 .'
