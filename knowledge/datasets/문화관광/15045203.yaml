description_portal: 이 데이터는 한국문화예술위원회가 운영하는 아르코예술인력개발원의 무대예술현장전문가 연수 교육목록에 대한 정보로, 무대기술 분야 전문 인력 양성을 위한 체계적인 교육과정 정보를 담고 있습니다. 모든 교육은 2018년을 기준으로 운영되었으며, 구성 항목은 연도, 분야, 분류, 과정명, 교육기간, 강사명, 기간(시수)로 이루어져 있습니다. 분류 항목은 조명, 음향, 영상으로 구성되어 있으며, 무대예술의 핵심 기술 분야를 대상으로 한 전문 과정임을 보여줍니다. 과정명 항목에는 ‘무대예술현장전문가연수[1]-집중교육 음향’ 등과 같이 과정의 성격과 연번이 포함되어 있어 연속성과 교육 목적을 알 수 있습니다. 교육기간은 각 과정별로 상이하며, 기간(시수) 항목은 ‘3일(21시간)’, ‘5일(30시간)’처럼 교육의 집중도와 운영 일정을 명확히 보여줍니다. 강사명도 함께 제공되어 실제 현장 전문가 또는 교수진이 참여한 내용을 확인할 수 있으며, 이 데이터는 공연예술 기술 인력의 전문성 제고를 위한 정책자료, 교육운영 평가, 교육 수요 분석 등에 활용될 수 있습니다.
