summary_user: 빅카인즈(BIGKinds)에서 모은 헌법 관련 뉴스 기사를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV 약 9.3MB)로, 일자·언론사·제목·통합분류·키워드·특성추출 등을 담는다. 연구자나 언론 분석가가 개헌 논의나 헌법재판소 결정이 시기별로 어느 언론사에서 어떤 키워드로 보도됐는지 추적하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자·언론사명·키워드 같은 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 헌법 관련 뉴스 메타정보 자료입니다. 헌법은 국가의 최고 규범으로서 국민의 기본권을 보장하고 권력 분립 및 민주적 질서를 유지하는 근간이 되며, 개헌 논의, 헌법재판소 판례, 정치·사회적 갈등 조정 등과 깊이 연결되어 있습니다. 본 자료에는 기사별 주소, 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 사건/사고, 개체명(인물·지역·기업), 키워드, 특성추출, 본문, 원본주소 등이 포함되어 있습니다. 이를 통해 특정 시기별 헌법 관련 담론의 흐름, 주요 사건과 판례, 정치권 및 시민사회의 반응이 언론에 어떻게 반영되었는지 체계적으로 확인할 수 있습니다. 또한 학술 연구, 법학 교육, 정책 수립, 언론 분석 등 다양한 분야에서 활용할 수 있는 기초 자료로, 헌법적 가치와 민주주의 발전 방향을 탐구하는 데 중요한 참고 자료가 됩니다.
