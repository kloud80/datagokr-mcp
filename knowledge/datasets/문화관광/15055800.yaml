description_portal: 본 데이터는 전북특별자치도 김제시에 위치한 전북조종면허시험장의 수상레저장비 보유 현황을 보여주는 자료입니다. 아웃보트, 인보트와 같은 동력선뿐만 아니라 바나나보트, 플라이피쉬, 수상스키, 웨이크보드 등 다양한 종류의 레저 및 시험용 장비의 연도별 보유 수량을 기록하고 있습니다. 이 자료를 통해 조종면허시험장의 시험 수행 및 교육 역량과 인프라 규모를 파악할 수 있습니다. 면허 취득을 준비하는 응시생이나 수상레저 활동에 관심 있는 일반인에게 유용한 정보를 제공하며, 지역의 해양레저스포츠 활성화 수준을 가늠하는 기초 데이터로도 활용됩니다.
