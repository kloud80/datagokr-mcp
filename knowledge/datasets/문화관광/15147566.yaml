summary_user: 서울특별시 동작구에서 비디오물(영화 등)을 제작·복제하는 업소를 인허가 건별로 담으며, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표 등을 포함한다. 영상 제작사를 차리려는 사업자나 분석가가 "동작구에 현재 영업 중인 비디오물제작업체는 어디에 몇 곳 있나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구의 같은 인허가 데이터와는 같은 컬럼 구조를 맞춰 이어 붙이고 다른 데이터와는 주소·사업장명 매핑으로만 연결한다.
description_portal: '서울특별시 동작구 비디오물제작업 인허가 정보(https://data.seoul.go.kr/dataList/OA-17386/S/1/datasetView.do)입니다.동작구의 영화제작과 같은 비디오물을 제작하거나 복제하는 업소정보를 제공합니다.이 데이터는 인허가일자, 영업상태, 주소, 사업장명, 좌표 등의 정보를 포함합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다.* 본 데이터는 3일전 자료를 제공합니다.'
