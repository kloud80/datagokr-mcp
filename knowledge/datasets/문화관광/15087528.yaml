description_portal: '전통산사문화재 사업 지원 현황은 국민의 문화재에 대한 인식을 고양하고 향유를 촉진하기 위한 문화재 활용사업 현황을 파악할 수 있다.“국가유산청_전통산사문화재 사업 지원 현황”은 전통산사(전통 사찰과 그 주변 자연 경관을 포함하는 문화재)를 대상으로 한 다양한 보존·관리·활용 사업에 대한 지원 내역과 현황을 체계적으로 정리한 데이터입니다. 이 자료는 전통산사의 역사적·문화적 가치를 보존하고, 지역사회와 연계한 문화관광 및 체험 프로그램 등을 활성화하기 위한 사업들의 지원 규모, 내용, 수행 기관, 성과 등을 포함하며, 전통산사 문화재의 지속 가능한 관리와 지역 문화 발전에 중요한 기초 자료로 활용됩니다.📌 기본 정보대상 사업: 전통산사문화재 관련 보존·관리·활용 사업주요 내용: 사업별 지원 현황(지원 기관, 지원 금액, 사업 내용, 참여 인원 등)목적: 전통산사 문화유산 보존과 지역문화 활성화데이터 형태: 표 형식(엑셀, 데이터베이스 등)🛠 데이터 구성사업명 및 위치: 지원 대상 전통산사 명칭과 소재지지원 기관 및 주관 단체: 사업을 지원하거나 운영하는 기관 정보지원 규모 및 예산: 지원 금액과 집행 내역사업 내용 및 활동 개요: 보수·복원, 문화 행사, 관광 활성화, 교육 프로그램 등참여 인원 및 성과 지표: 방문객 수, 참여자 만족도, 지역 경제 효과 등🎯 활용 분야정책 평가 및 개선: 사업 효과 분석과 향후 지원 정책 수립문화재 보존 및 활용 촉진: 전통산사 문화재의 지속 가능한 관리와 활용학술 연구: 전통산사 문화재 보존 및 활용 사례 연구지역사회 문화 발전 지원: 주민 참여와 문화 체험 확대 전략 수립이 데이터는 전통산사문화재의 역사적·문화적 가치를 보존하고, 지역 문화와 연계한 다양한 활용 사업을 체계적으로 관리하는 데 중요한 자료로 활용됩니다.'
