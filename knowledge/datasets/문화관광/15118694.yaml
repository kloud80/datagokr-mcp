summary_user: 제주관광공사 온라인면세점 고객센터에 반복해서 들어온 문의를 FAQ 형태로 정리한 파일로, 질문 한 건마다 유형·제목·내용·게시 상태·랭킹 노출 여부와 순위·등록·수정 일시를 담는다(포털 설명 기준 총 30건, CSV 약 10KB). 온라인면세점 이용자나 상담 분석가가 '구매·인도·환불 관련해 어떤 질문이 자주 나오고 무엇이 상위에 노출되는가'를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 잇는 공통 조인 키가 없어, 같은 기관의 다른 면세점 자료와는 질문 유형이나 이름을 맞춰 보는 방식으로만 연결된다.
description_portal: 온라인면세점 시스템의 자주묻는질문 데이터는 고객센터를 통해 접수된 문의 중 반복적으로 발생하는 질문을 취합하여 FAQ 형태로 제공하기 위해 생성·관리되는 자료입니다. 데이터는 자주묻는질문아이디, 자주묻는질문타입, 자주묻는질문제목, 자주묻는질문상태, 자주묻는질문랭킹설정여부, 자주묻는질문랭킹, 등록일시, 수정일시 항목으로 구성되며 총 30건이 제공됩니다. 이를 통해 고객은 원하는 정보를 신속하게 확인할 수 있고, 운영자는 상담 업무 효율화를 달성할 수 있습니다. 또한 데이터는 고객 응대 품질 향상, 이용자 편의성 강화, 온라인면세점 서비스 개선 및 관광객 만족도 제고에도 기여할 수 있습니다.
