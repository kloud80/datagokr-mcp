summary_user: 경기도 공공체육시설 가운데 게이트볼 전용 시설을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군명, 관리주체, 준공연도, 부지·건축면적, 게이트볼장 규격, 면 수, 부대시설, 주소와 위경도를 포함한다. 경기도 주민이 가까운 게이트볼장을 찾거나, 지자체·체육진흥 담당자가 시군별 시설 분포와 노후도(준공연도)를 따져 확충·유지보수 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 시군명·시군코드(SIGUN_CD)나 시설명·주소로 맞춰 이어 쓴다.
description_portal: 본 데이터는 경기도 공공체육시설 중 게이트볼 전용 시설의 현황을 수록한 자료입니다. 주요 항목으로는 시설명, 관리주체명, 준공연도, 부지면적, 건축면적, 게이토볼장 규격 등에 대한 정보가 포함됩니다.이를 통해 각 지역별 게이트볼 시설의 분포, 설치연도별 현황, 관리기관별 시설 관리상황 등을 파악할 수 있습니다.부지면적 및 건축면적 데이터를 활용하여 시설 규모 분석이 가능하며, 부대시설정보를 통해 이용 편의성 평가에도 활용될 수 있습니다. 지방자치단체, 체육진흥기관, 도시계획 담당 부서 등에서 체육시설 확충계획 수립, 시설 유지보수 계획 수립, 주민편의시설 평가 등에 활용할 수 있습니다.
