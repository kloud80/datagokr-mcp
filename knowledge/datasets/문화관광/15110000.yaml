description_portal: 광양시 둘레길 및 등산로 트레킹 공간정보는 주요 산과 유원지의 등산로 및 둘레길을 GIS DB로 구축하여 통합 관리하는 자료입니다. 이 데이터는 백운산, 가야산, 국사봉, 마로산, 삼봉산, 서산, 구봉산, 마동근린공원, 마동유원지 등 광양시 주요 트레킹 지역을 포함하고 있으며, 등산로에 위치한 각종 편의시설(이정표, 화장실, 쉼터, 음수대 등) 정보를 함께 데이터베이스화하여 제공합니다. 한국지능정보사회진흥원과 협약을 통해 구축된 본 자료는 시민과 관광객에게 안전하고 편리한 트레킹 환경을 제공하고, GIS 기반의 공간정보 분석을 통해 사고 예방 및 효율적인 시설 관리에도 기여할 수 있습니다. 더 나아가 관광 활성화, 건강 증진, 환경 보존 등 다방면에서 활용 가능하며, 대국민 서비스 제공을 통한 안전한 트레킹 문화 정착을 목표로 하고 있습니다.
