summary_user: 전라남도의 레포츠 시설·장소를 한 곳씩 담은 건별 목록으로, 명칭·주소·좌표·전화·홈페이지·주차 여부·이용요금 여부·간략 개요·사진 파일을 제공한다. 여행객이나 여행 앱 개발자가 '전남 어느 시군에서 어떤 레포츠를 즐길 수 있고 주차·요금은 어떤가'를 찾을 때 쓴다. 전역 조인 키는 없어 TourAPI 레포츠 정보나 다른 관광 데이터와는 명칭·주소 매칭이나 좌표(경도·위도) 근접으로 이어 쓰고, 지역코드(leportsZoneCd)는 이 기관 내부 코드로만 연결된다.
limits: TourAPI contentId 같은 공통 키가 없어 다른 관광 데이터와 정확히 1:1로 묶기 어렵고 이름·주소 매핑에 의존한다. 개발계정은 하루 1,000회 호출 제한이 있다.
