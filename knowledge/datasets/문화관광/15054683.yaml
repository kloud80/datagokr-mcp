description_portal: 한국문화예술위원회에서 발간한 복권기금 문화복지사업의 수혜대상[문화소외계층] 수요조사 연구입니다. 목차로는 총 5장으로 구성되어 있습니다. 제 1장으로는 서론, 제 2장은 이론적 논의, 제 3장은 문화나눔사업 대상 추계 및 욕구조사 연구방법, 제 4장은 문화나눔사업 대상 추계 및 욕구조사 분석 결과, 제 5장은 결론 및 제언으로 구성되어 있습니다. 마지막 장인 제 5장은 1. 문화나눔사업 대상 개념화와 재규정, 2. 문화나눔사업 전달체계, 3. 문화나눔사업 내용으로 구성되어 있습니다. 참고문헌과 부록으로 설문지가 포함되어 있으며, 실천적 활용 가능성을 담고 있습니다.
