description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 누웨마루거리는 제주 제주시 연동 연동7길에 위치한 보행자 전용 쇼핑·문화 거리로, 2010년 ‘차 없는 거리’로 조성되었고 2017년 명칭을 누웨마루거리로 변경하였다. 이 거리는 음식점, 카페, 패션 및 기념품 가게, 엔터테인먼트 공간 등이 밀집해 있으며 낮과 밤 모두 조명이 켜진 거리 산책, 쇼핑, 거리 공연 등 다양한 문화 체험이 가능하고 일부 구간은 보행 통로가 확보되어 휠체어 이용자나 교통약자도 비교적 접근 가능한 열린 관광지의 성격을 가진다. 공공 데이터로 관광 안내, 무장애 여행 정보 제공, 여행 코스 설계, 관광 콘텐츠 제작 등에 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
