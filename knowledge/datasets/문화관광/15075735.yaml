description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 삼양해수욕장은 제주 제주시 삼양동에 위치한 검은모래 해변으로 화산암과 규산염광물이 혼합된 세립질 검은 모래가 특징이며 투명한 바닷물과 깨끗한 자연 환경 덕분에 소박하고 조용한 분위기에서 해수욕과 해변 산책이 가능하고 해변을 따라 나무 데크 산책로가 마련되어 있어 비교적 평탄한 이동이 가능하며 일부 구간에서 무장애 관광지로 접근성이 확보된 정보를 포함하고 있어 교통약자, 휠체어 이용자, 고령자, 유아 동반 가족 등도 바다와 해변 경관을 부담 없이 즐길 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
