summary_user: 제주특별자치도에 등록된 문화예술 법인을 한 건씩 담은 인허가 현황으로, 법인명·인허가일자·영업상태·지번/도로명 소재지·문화체육업종명을 기록한다. 연구자나 정책 담당자가 "제주에서 영업 중인 문화예술 법인은 어느 지역에 몰려 있고 언제 많이 생겼나"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 법인명이나 소재지 주소를 맞춰 잇거나 같은 기관 자료끼리만 연결한다.
description_portal: 제주특별자치도 문화 예술 법인 현황 데이터는 제주 지역에서 등록된 문화예술 법인(비영리법인 또는 단체 포함)의 명칭, 인허가일자, 소재지, 대표자 정보, 법인 유형 및 영업상태 등을 포함한 기본 인허가 현황을 정리한 공공 통계자료이다. 이 자료는 지역 문화예술 생태계의 구조 파악, 법인 분포 현황 점검, 문화예술 활성화 정책 수립, 지원 대상 선정 등의 기초 자료로 활용 가능하다. 또한 문화단체의 분포를 행정구역 단위로 분석하거나, 타 지자체 및 전국 데이터와 비교하여 제주만의 예술법인 밀도, 성장 추세, 유지·폐업 현황 등을 검토하는 데 유용하며, 문화정책 기획, 연구, 민간 협력 사업 설계 시에도 신뢰할 수 있는 데이터베이스 역할을 한다. 제공기관은 제주특별자치도이며, CSV 등 개방 포맷으로 배포되어 공공·민간 누구나 접근 가능하다.
