summary_user: 단양군 다누리센터(민물고기 전시시설)에 있는 전시생물을 수조별로 생물명과 마릿수로 정리한 건별 목록으로, 13851바이트 크기의 CSV 파일 한 건이다. 관람객이나 연구자가 '다누리센터 어느 수조에 어떤 생물이 몇 마리 전시되어 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 생물명이나 시설명을 이름으로 맞춰 이어야 한다.
description_portal: 충청북도 단양군에서 운영하는 다누리센터관리사업소에 보유중인 전시생물 현황데이터로 연번, 수조명칭, 전시생물명, 생물수량, 데이터 기준일자 항목 등으로 구성되어 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 다누리센터 전시생물 보유현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 16일입니다. 담당부서는 단양군 관광건설국 체육레저과이며 문의주시면 최신의 충청북도 단양군 다누리센터 전시생물 보유현황을 열람하실 수 있게 도와드립니다.
