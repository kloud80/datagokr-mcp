description_portal: 서울특별시 용산구에 정식으로 신고된 체육시설업 중 체육도장업의 현황 정보를 제공하고 있습니다. 이 정보에는 용산구 내에 위치한 체육도장업(권투, 레슬링, 태권도, 유도, 검도, 우슈, 합기도 종목의 운동을 하는 체육도장)에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구에 정식으로 신고된 다른 업종의 신고체육시설업의 정보 또는 공공체육시설에 대한 정보가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
