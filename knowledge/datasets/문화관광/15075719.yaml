description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 사려니숲길-무장애나눔길은 제주시 조천읍 교래리 산 137-1 일대에 위치한 삼나무 숲길로, 2020년 무장애 동선으로 조성되어 숲 입구부터 나무 데크와 포장보행로, 장애인 전용 주차구역, 장애인 화장실, 휠체어·유모차 대여 등의 편의시설을 갖추어 교통약자나 고령자, 유모차 동반 가족도 삼나무 숲의 자연과 치유의 숲길을 비교적 무리 없이 이용할 수 있는 열린관광지이며, 숲속 산책, 자연치유, 생태 체험, 관광 코스 설계 및 무장애 관광 안내 자료로 활용 가능한 공간이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
