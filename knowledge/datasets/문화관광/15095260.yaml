summary_user: 경기도여성가족재단이 구독 중인 여성·가족 관련 신문·잡지 등 연속간행물을 간행물 한 건당 한 행으로 정리한 목록이며, 간행물명·발간기관·발행주기를 담는다. 여성정책·성평등·가족 이슈 자료를 찾는 연구자나 도민이 '여성가족도서관 여울에서 어떤 정기간행물을 열람할 수 있나'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 간행물명이나 발간기관 이름을 매칭하는 방식으로만 이어 쓴다.
description_portal: '이 데이터는 경기도여성가족재단이 구독 중인 여성 및 가족 관련 신문, 잡지 등 연속간행물 목록을 정리한 자료로, 연속간행물명, 발간기관, 발행주기 항목으로 구성되어 있습니다. 각 간행물은 여성정책, 가족이슈, 성평등 등 다양한 주제를 다루며, 여성신문사, 여성가족재단 등 관련 기관에서 발행됩니다. 구독 자료들은 경기도여성가족재단이 운영하는 복합문화공간 ‘여성가족도서관(라키비움) 여울’에서 열람할 수 있습니다.※ 라키비움(LARCHIVIUM) : 도서관(Library), 기록관(ARCHIve), 박물관(museUM)이 결합된 복합문화공간'
