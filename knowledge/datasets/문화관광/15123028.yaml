summary_user: 강원특별자치도 홍천군 관광지별로 1~6월 월별 내국인 방문객 수를 담은 집계 파일로, 관광지명·요금 유무(유료/무료)·관광지 구분(관광지/관광단지)·소재지 주소가 함께 있습니다. 홍천군의 어느 관광지에 상반기 어느 달에 내국인 방문객이 많았는지, 유료와 무료 관광지 사이에 방문 규모 차이가 있는지를 보려는 분석가나 지역 관광 담당자가 씁니다. 전역 조인 키(관광지점코드·시군구코드)는 없어서, 다른 관광 통계와는 관광지명이나 소재지 주소로 맞추어 이어 쓰거나 같은 기관(홍천군) 기준으로 묶어야 합니다.
description_portal: 강원특별자치도 홍천군의 2025년 06월 30일 기준으로 작성된 월별 관광지 방문객수(내국인) 정보입니다.각 구성 항목으로는 관광지명, 요금유무, 소재지도로명주소, 소재지지번주소, 관광지구분, 1월 방문객, 2월 방문객, 3월 방문객, 4월 방문객, 5월 방문객, 6월 방문객, 관리기관전화번호, 관리기관명, 데이터기준일자로 구성되어 있습니다. 요금유무 항목은 유료와 무료로 구성되어 있고 관광지구분 항목은 관광지, 관광단지로 구성되어 있습니다. 월별 방문객 항목은 숫자로 나타나 있습니다. 관리기관명 항목은 모두 강원특별자치도 홍천군청으로 나타나 있습니다.
