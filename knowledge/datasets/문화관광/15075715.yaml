description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 알뜨르격납고밭담길은 제주 서귀포시 대정읍 상모리 일대의 들판과 과거 군사시설이 남은 알뜨르 비행장 구역을 중심으로 형성된 산책로 및 역사 탐방 코스로, 격납고와 밭담, 평야 풍경이 어우러진 공간이며 일부 구간은 포장 보행로와 장애인 전용 주차장, 무단차 출입구, 장애인 화장실 등 무장애 편의시설이 갖추어져 있어 보행 약자, 휠체어 이용자, 유모차 동반자도 접근이 가능하며 일제강점기 및 4·3사건 등 제주 근현대사의 아픈 역사와 함께 자연 경관도 함께 체험할 수 있어 관광, 역사 교육, 무장애 여행 코스 설계 등에 활용 가능한 열린 관광지 정보이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
