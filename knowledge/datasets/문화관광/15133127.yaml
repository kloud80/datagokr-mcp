summary_user: 전라남도 관광 안내 서비스 '남도여행길잡이'에 실린 숙박시설을 한 곳씩 담은 건별 목록으로, 상호명·주소·문의전화·주차시설·홈페이지·설명·사진 파일과 경위도 좌표를 시도 범위로 제공한다. 여행자나 관광 서비스 개발자가 "여수 쪽에 주차 가능한 숙소가 어디 있고 연락처는 무엇인가" 같은 질문에 답하거나 지도 위에 숙소를 표시하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·주소 문자열 매칭이나 좌표 근접으로만 이어 붙일 수 있고, 지역명(roomZoneNm)으로 시군 단위 묶음을 만들어 공중위생 숙박업 신고 자료(LOCALDATA)나 관광 콘텐츠와 대조한다.
description_portal: '- 입력 파라미터를 이용하여 전라남도 숙박 정보을 조회할 수 있는 서비스로 숙박 장소, 숙박 전화, 숙박 설명등의 항목을 제공합니다.- 전라남도(전남)는 자연경관, 역사, 문화, 미식 등 다양한 매력을 지닌 여행지로, 여름철에도 시원하고 다채로운 여행을 즐길 수 있습니다.- 교통: 전남 지역은 대중교통이 제한적일 수 있으므로, 렌터카를 이용하시는 것을 추천합니다.- 숙박 예약: 여름철에는 관광객이 많아 숙박 시설이 빠르게 마감될 수 있으므로, 미리 예약하시는 것이 좋습니다.- 체험 예약: 일부 체험 프로그램은 사전 예약이 필요할 수 있으므로, 방문 전에 확인하시기 바랍니다.- 전남은 자연과 문화, 미식을 동시에 즐길 수 있는 매력적인 여행지입니다.'
team:
  dept: 정책기획관실
services:
  - op: /getRoomInfoList
