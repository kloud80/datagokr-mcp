      - name: roomNm
        required: false
        desc: 상호명
      - name: startPage
        required: false
        desc: 시작 페이지
      - name: pageSize
        required: false
        desc: 페이지 크기
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getRoomImgList
    name: 남도여행길잡이 숙박이미지 정보
    endpoint: https://apis.data.go.kr/6460000/rest/jnRoomInfo/getRoomImgList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: roomId
        required: true
        example: '0000012918'
        desc: 고유 코드
      - name: startPage
        required: false
        example: '1'
        desc: 시작 페이지
      - name: pageSize
        required: false
        example: '10'
        desc: 페이지 크기
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
