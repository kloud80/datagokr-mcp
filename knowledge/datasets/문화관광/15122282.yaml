summary_user: 국립국어원 온라인 국어문화학교에서 제공하는 강좌를 한 행씩 담은 목록 파일로, 강의명·교육 유형·차시·인정 교육시간·데이터 기준일을 담는다(파일 크기 약 1.4KB의 소규모 목록). 공무원이나 일반 국민이 어문 규범·공문서 작성 같은 주제의 온라인 강좌가 무엇이 있고 몇 차시, 몇 시간으로 인정되는지 확인해 학습 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 강좌명 같은 이름 매칭이나 같은 기관(국립국어원) 데이터 단위로만 이어 쓴다.
description_portal: 국립국어원에서 운영하는 국어문화학교의 세부 과정 중 하나인 <온라인 국어문화학교>의 강좌 목록을 소개합니다. 온라인 국어문화학교에서는 시간과 공간의 제약 없이 국어 교육을 받을 수 있으며, 국어 생활에 필요한 기본 지식과 어문 규범, 공문서 작성, 바른 언어 사용 등 국어와 관련된 다양한 주제를 다루고 있습니다. 강좌는 학습자의 관심사와 필요에 따라 선택적으로 학습할 수 있도록 구성되어 있습니다. 따라서 강좌 목록 데이터는 자기 주도적 학습을 설계하는 데에 참고 자료로 활용할 수 있습니다.
