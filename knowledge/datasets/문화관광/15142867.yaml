summary_user: 서울특별시 마포구에서 안전성 검사 대상 놀이기구를 한 종류 이상 설치해 운영하는 일반유원시설업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장이며, 인허가일자·영업상태·폐업일자·주소·중부원점TM 좌표와 함께 놀이시설 수·시설면적·보험 기간 같은 시설 항목을 담는다. 마포구에서 지금 영업 중인 유원시설이 어디에 몇 곳 있는지, 언제 인허가를 받거나 폐업했는지 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 개방자치단체코드로만 이어 쓴다.
description_portal: '서울특별시 마포구의 테마파크 등 안전성 검사대상의 놀이기구를 한 종류 이상 설치하여 운영하는 업소정보에 대한 설명입니다.이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 시설을 관리·감독하는 부서나 기관의 정보도 함께 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
