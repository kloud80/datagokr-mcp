summary_user: 영상물등급위원회가 지정한 영상물 자체등급분류사업자를 사업자 한 곳당 한 행으로 담은 전국 단위 목록으로, 법인명·사업자등록번호·지정사업자식별코드·지정시작일자·지정기간을 담는다(파일 크기 965바이트의 소규모 CSV). 콘텐츠 사업자나 분석가가 특정 OTT·플랫폼 법인이 자체등급분류 사업자로 지정돼 있는지, 지정이 언제 시작됐고 기간이 얼마인지 확인하는 데 쓴다. 사업자등록번호(bizno)를 키로 국세청 사업자 상태 조회나 다른 사업자 단위 데이터와 이어 쓴다.
description_portal: 영상물등급위원회는「영화 및 비디오물의 진흥에 관한 법률」제71조에 따라 ‘영상물의 공공성과 윤리성을 확보하고 청소년을 보호’하기 위해 설립되었으며동법 제72조의 영상물등의 등급분류 및 내용정보, 청소년 유해성 확인 심의 등의 직무를 수행하는 문화체육관광부 산하 공공기관입니다.해당 데이터는 영상물등급위원회에서 지정한 자체등급분류사업자 목록 입니다.법인명, 사업자등록번호, 지정사업자식별코드, 지정일자, 지정기간의 정보가 제공되며 해당 데이터를 통하여 영상물 자체등급분류 사업자의 정보를 확인할 수 있습니다.
