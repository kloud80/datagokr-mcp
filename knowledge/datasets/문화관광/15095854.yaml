summary_user: 국악방송이 주관하는 국악 창작곡 경연대회 「21세기 한국음악 프로젝트」의 역대 대회를 회차(연도)별 한 행으로 정리한 집계 자료로, 접수곡 수(노래곡·연주곡 구분), 접수·예선·본선 일정과 본선 장소·관객 수, 수상곡 수·공연자 수·시상금, 발표 앨범·음원 수, 정부 시상 내역을 담는다. 국악 창작 정책 연구자나 문화예술 사업 기획자가 '이 대회의 참가 규모와 수상·음원 발표 성과가 해마다 어떻게 변했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 직접 연결되지 않으며, 다른 데이터와는 연도나 본선 장소 이름을 수작업으로 맞춰 이어 쓴다.
description_portal: 본 공공데이터는 국악방송에서 주관하는 국악 창작곡 경연대회인 「21세기 한국음악 프로젝트」의 역대 대회 운영 전반에 관한 정보를 종합적으로 수록한 자료입니다. 본 데이터에는 각 회차별로 대회 번호 및 개최 연도, 접수된 전체 곡 수, 노래곡 및 연주곡 구분별 접수 현황, 참가 신청 접수 기간, 1차·2차 예선 일정, 본선 일정 및 개최 장소, 본선 관객 현황 등 대회의 진행 과정과 규모를 파악할 수 있는 운영 정보가 포함되어 있습니다. 또한 수상곡 수, 수상곡 공연자 수, 시상금 규모, 발표된 앨범 수 및 음원 수, 정부 시상 내역 등 비고 사항을 함께 제공함으로써, 각 연도별 대회의 성과와 결과를 입체적으로 확인할 수 있도록 구성되어 있습니다. 이를 통해 「21세기 한국음악 프로젝트」의 연도별 대회 운영 현황, 국악 창작곡 참가 및 수상 추이, 경연 규모와 성과 변화, 창작곡 발표 및 유통 현황 등을 종합적으로 분석할 수 있으며, 국악 창작 정책 연구, 문화예술 사업 기획, 성과 평가, 교육·홍보 자료 등 다양한 분야에서 기초 자료로 활용할 수 있습니다.
