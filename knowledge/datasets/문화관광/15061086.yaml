summary_user: 경상남도 밀양시에 있는 출판사를 사업체 한 곳당 한 행으로 담은 현황 파일로, 업종·사업체명·도로명 소재지·영업상태·데이터기준일자를 담는다(CSV 약 2.5KB 규모). 밀양 지역에서 영업 중인 출판사가 어디에 있는지, 또는 폐업 여부를 확인하려는 주민·사업자·지역 문화 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업체명이나 도로명 주소를 맞춰 잇거나 같은 밀양시 자료끼리 연결한다.
