summary_user: 제주 상명정낭마을(대문없는마을)의 무장애 여행 환경을 항목별로 담은 파일로, 구분·유형·추천여부·비고 칸에 마을 개요, 주소, 주차장·화장실 접근성, 이동 코스, 휴무일·관람료 같은 기본 정보를 정리한다. 휠체어 이용자나 유모차를 동반한 가족이 상명정낭마을에 갈 때 주차와 화장실을 쓸 수 있는지, 어떤 코스가 다니기 편한지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지(contentId) 등 다른 데이터와는 마을 이름 매핑이나 같은 기관 코드로만 연결한다.
description_portal: '제주특별자치도 내 대문없는마을상명정낭마을_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도 대문없는마을 상명정낭마을 무장애여행관광정보」로, 제주특별자치도가 제공하는 상명정낭마을(대문없는마을) 지역의 무장애(Barrier-Free) 여행 환경에 관한 상세 자료이다. 내용에는 마을의 개요, 주소, 접근 가능한 주차장 및 화장실 시설, 코스(이동 경로) 정보, 휴무일 및 관람료 등의 기본 정보가 포함되어 있으며, 주요 포인트별로 시설 사진도 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
