summary_user: 빅카인즈(BIGKinds) 뉴스 데이터베이스에서 모은 백신 관련 기사를 기사 한 건당 한 행으로 담은 메타정보 파일로, 일자·언론사·제목·통합분류·키워드·특성추출 등을 포함하며 범위는 전국·비공간이다. 연구자나 정책 분석가가 코로나19 시기 백신 수급, 부작용 논란, 접종 정책이 언론에서 언제 어떻게 다뤄졌는지 추적할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자나 언론사 이름, 키워드를 기준으로 맞춰 이어 써야 한다.
limits: 기사 메타정보이므로 실제 접종률이나 부작용 건수 같은 보건 통계를 대신하지 못하고, 언론 보도에 나타난 양상만 보여준다. 공통 코드나 키가 없어서 다른 데이터와 연결할 때는 이름 매칭에 기대야 한다.
