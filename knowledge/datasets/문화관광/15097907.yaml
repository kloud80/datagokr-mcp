description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 백신 관련 뉴스 메타정보 자료입니다. 백신은 감염병 확산을 막고 공중보건을 지키는 핵심 수단으로, 특히 코로나19 팬데믹 시기 사회적 관심과 언론 보도의 중심 이슈로 다뤄졌습니다. 본 자료에는 기사별 주소, 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 사건/사고, 개체명(인물·지역·기업), 키워드, 특성추출, 본문, 원본주소 등이 포함되어 있습니다. 이를 통해 특정 시기별 백신 수급 문제, 접종률 추이, 부작용 및 안전성 논란, 정부의 보건 정책, 국제 협력과 제약 산업 동향 등이 언론 보도에서 어떻게 다뤄졌는지를 심층적으로 분석할 수 있습니다. 또한 학술 연구, 보건 정책 수립, 언론 보도 분석, 교육 현장에서 활용 가능한 기초 자료로, 백신 담론의 사회적·정치적 의미와 공중보건 체계 강화를 위한 논의를 이해하는 데 중요한 참고 자료가 됩니다.
