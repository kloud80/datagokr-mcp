description_portal: 본 데이터는 한국관광공사에서 제공하는 중국 사천지역 한국문화관광 및 개인선호조사(한국방문 희망활동) 합성데이터입니다. - 원본데이터의 경우 응답자의 개인정보를 포함하고 있어 전처리 후 데이터 합성 모델을 이용하여 합성데이터로 제작하였으며, 데이터의 안전성 및 유용성 측정 후 심의위원회의 검토를 거쳐 개방하였습니다. - 각 컬럼은 응답자 정보에 대한 영역(구분(번호), 성별, 나이, 방문목적, 여행동행자, 여행방법)과 응답내용 정보로 이루어져 있습니다. 응답내용 정보는 방한 시 참여하고 싶은 활동의 경우 Y, 아닌 경우 N으로 응답하였습니다. - 본 데이터는 중국의 잠재 방한객 분석 및 마케팅에 활용할 수 있습니다.
