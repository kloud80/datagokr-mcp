summary_user: 제주도에 장기체류하며 거주하는 외국인의 유동인구를 연월·국적·시간대·읍면동 단위로 집계한 통계로, 매 정각 기준 체류 시간(분)을 60으로 나눈 값을 월별로 합산해 거주 외국인 인구(resd_pop_cnt)로 담는다. 다문화·외국인 정책 담당자나 분석가가 '어느 읍면동에 어느 국적 외국인이 어느 시간대에 많이 머무는가'를 보고 주거·복지·공공서비스 수요를 가늠하는 데 쓴다. 전역 조인 키는 없어서 읍면동 이름이나 국적명으로 같은 기관의 다른 제주 통계와 이름 매핑으로만 잇는다.
description_portal: 이 데이터셋은 제주특별자치도에 장기체류 중이며 거주 중인 외국인의 유동인구 변동을 월별 단위로 집계한 통계자료입니다. 데이터는 매일 01시부터 24시까지 매 정각 기준으로 체류 인구 수를 기록하고, 해당 시간 동안 머문 시간을 분 단위로 집계한 뒤 60분으로 나눈 값을 “유동인구”로 산출하며, 이 값을 연월별로 합산한 결과가 “거주 외국인 인구”로 제공됩니다. 제공기관은 제주특별자치도청이고, 관리 부서는 디지털혁신과이며, 데이터는 CSV 형식으로 공개되어 누구나 무료로 다운로드·활용할 수 있습니다. 이 자료는 제주지역 내 체류 외국인 인구의 월별 변화 추이 관찰, 장기체류 외국인의 생활권 및 정주 현황 분석, 다문화 정책 수립을 위한 기초 통계, 외국인 인구 증가에 따른 주거·복지·공공서비스 수요 예측 및 도시계획 수립 등에 유용합니다. 다만 이 데이터는 등록일 및 최근 수정일 기준으로 1회성 개방된 자료이고, 이후 입출국, 체류자격 변경, 이주 등의 변동 사항은 반영되지 않을 수 있다는 한계가 있습니다
