description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 국립제주박물관은 제주 제주시 일주동로 17에 위치한 제주 고유의 역사·문화유산을 선사시대부터 조선시대까지 망라해 전시하는 고고·역사 박물관으로, 상설전시실, 기획전시실, 실감영상실, 어린이박물관, 야외전시장과 숲길, 정원, 연못 등 다양한 전시 및 체험 공간을 갖추고 있으며 장애인 전용 주차장, 경사로 출입구, 엘리베이터, 휠체어 및 유모차 대여, 장애인 화장실, 점자안내판, 음성안내, 수유실 등 무장애 편의시설이 잘 갖춰져 있어 교통약자·고령자·유아 동반 가족도 제주의 자연과 역사문화를 편안히 체험할 수 있는 열린관광지이다. * 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
