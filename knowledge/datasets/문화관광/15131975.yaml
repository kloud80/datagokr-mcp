description_portal: 대구광역시 서구의 비원뮤직홀강좌안내 데이터입니다. 대상, 연령, 수강료, 수강일 등의 정보가 포함 되어 있습니다.비원뮤직홀은 대구 서구 달서천로 374에 위치하고 있으며 22면(장애인 전용석 2석)의 주차면수를 가지고 있습니다. 대중교통으로 방문하는 경우 지하철 3호선 원대역 1번출구에서 도보 13분, 팔당시장역 1번출구에서 도보 16분, 북구청역 1번 출구에서 도보 13분 거리에 있습니다. 또한 버스로는 234, 309, 523(원대오거리방면), 527, 750, 서구 1-1, 순환2, 250등 다양한 교통편을 통해 접근할 수 있습니다.비원뮤직홀에서는 기타 아카데미(통기타, 베이스, 우크렐레), 타악(드럼), 성악(가곡), 관악(클라리넷,플루트,색소폰), 피아노, 현악(바이올린, 첼로)과 관련된 다양한 프로그램을 분기별로 운영하고 있습니다. 신청방법은 비원뮤직홀 3층 사무실로 방문 접수하거나,  053-663-3681로 전화접수 받고 있습니다.더 자세한 사항은 홈페이지 https://www.dgs.go.kr/reserve/contents.do?mid=0206020000 에서 확인할 수 있습니다.
