summary_user: 서울특별시 중구의 태권도·검도 등 체육도장업소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 관리번호, 인허가·취소일, 영업 상태(등록·폐업 등), 폐업일, 지번·도로명 주소, 중부원점TM 좌표, 지도자 수·건물 면적 등을 포함한다. 중구에서 체육도장 창업을 검토하는 예비 사업자가 "지금 영업 중인 도장이 어디에 몇 곳 있고 최근 폐업은 얼마나 되나"를 확인하거나, 주민이 가까운 도장을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설업(헬스·당구 등) 인허가나 상권 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중구의 태권도, 검도 등 신체 및 정신을 단련시키는 업소 정보입니다. 데이터는 각 체육도장업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 체육도장업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 정보를 제공하며, 일반 시민 및 청소년 수련 희망자에게는 체육도장업의 위치 및 교육 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
