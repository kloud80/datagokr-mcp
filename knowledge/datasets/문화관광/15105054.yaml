summary_user: '국립국악원이 발간한 논문집에 실린 학술논문을 한 편씩 담은 목록으로, 제목·저자·등록일·주제분류·주제어·초록 내용·언어·저작권·원문 링크를 전국 범위의 비공간 자료로 제공한다. 국악 연구자나 학생이 특정 주제어(예: 판소리, 궁중음악)를 다룬 국악원 논문을 찾아 선행연구를 정리할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID나 문화시설 코드와 직접 연결되지 않고, 논문 제목·주제어·인물명 같은 이름 매칭으로만 다른 데이터와 이어 쓴다.'
description_portal: 국립국악원에서 발간한 논문집에 수록된 다양한 학술연구 정보를 체계적으로 제공합니다. 자원의 명칭, 책임자, 등록일, 소속, 기관별 주제 분류, 핵심 주제어, 자원 크기, 내용, 관련 장소, 시간적 범위, 언어, 저작권 등 주요 정보를 포함하고 있어 국악 관련 연구자와 학생, 문화예술 종사자들이 국악 분야의 학술적 성과를 탐색하고 연구 자료로 활용하는 데 유용합니다. 또한 논문집의 참조 정보와 위치 정보, 기여자 정보 등도 함께 제공되어 국악 연구의 심층적 분석과 문화유산 보존, 정책 수립, 교육 자료 개발 등 다양한 목적으로 활용할 수 있습니다.
