summary_user: 순천시 관광지별 입장객 수를 연간 총계와 1월부터 월별로 집계해 담은 CSV 파일(약 7.7KB)로, 각 집계를 일반·학생·외국인으로 나눠 보여 준다. 순천시 관광 담당자나 지역 관광 분석가가 "순천의 어느 관광지에 어느 달에 외국인 방문객이 많았나" 같은 질문에 쓴다. 전역 조인 키(관광지점코드·시군구코드)가 실측 컬럼에 없어서, 다른 관광 통계와 이을 때는 관광지명(관광지명)을 이름으로 맞추거나 순천시라는 기관 단위로만 연결한다.
description_portal: 전라남도 순천시의 "관광객 현황" 데이터는 순천시를 방문한 관광객에 대한 다양한 통계 정보를 제공합니다. 이 데이터는 관광객 수, 방문 시기, 주요 방문지, 체류 기간, 관광 형태(개인/단체), 연령대, 성별 등 다양한 항목으로 구성되어 있습니다. 이를 통해 순천시를 찾은 관광객들의 특성과 행동 패턴을 분석할 수 있으며, 지역 관광 정책 수립 및 마케팅 전략 개발에 유용하게 활용될 수 있습니다. 또한, 공공데이터포털에서는 지도 시각화 기능을 제공하여, 관광객들의 지리적 분포를 한눈에 확인할 수 있습니다. 이 데이터는 CSV 형식으로 제공되며, 다운로드하여 다양한 분석 및 활용이 가능합니다. 업데이트 주기는 수시로 이루어지며, 최신 정보는 공공데이터포털에서 확인 가능합니다. 이 데이터는 순천시의 관광객 현황을 파악하고, 관련 정책 수립 및 산업 분석에 유용한 자료로 활용될 수 있습니다.
