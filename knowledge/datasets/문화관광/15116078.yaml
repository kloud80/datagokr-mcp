summary_user: 대전광역시 서구 관내 지정문화재를 한 건씩 담은 목록 파일로, 종목·지정번호·문화재명·지정일과 소재지, 지정구역·보호구역 면적, 소유구분·관리단체를 문화재별로 기록한다(CSV 약 2.8KB의 소규모 파일). 서구 주민이나 문화관광 담당자가 "우리 구에 어떤 지정문화재가 어디에 있고, 보호구역이 얼마나 되며 누가 관리하는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 종목과 지정번호, 문화재명을 맞춰 국가유산청 지정 유산 목록과 이어 보거나, 소재지 주소로 위치 데이터와 연결한다.
description_portal: '본 자료는 대전광역시 서구 관내에 지정되어 있는 문화재의 현황 정보를 수록한 공공데이터로서, 서구 지역 내 문화유산의 보호 및 관리 실태를 파악할 수 있도록 구성되어 있습니다.해당 자료에는 서구 관내에서 지정문화재로 등록된 대상별 세부정보가 포함되어 있으며, 문화재별로 구분된 순번, 문화재의 분류를 나타내는 종목(예: 유형문화재, 기념물 등), 문화재명(명칭), 문화재 지정번호, 해당 문화재가 공식적으로 지정된 지정일, 문화재의 법적 보호 범위를 나타내는 지정구역, 문화재가 차지하고 있는 면적(㎡ 단위), 그리고 등록 당시 기준으로 명시된 소유자 정보 등의 항목으로 구성되어 있습니다.자료는 서구 내 문화재 자산의 목록을 체계적으로 정리한 것으로, 문화재 개별 정보에 따라 위치, 성격, 지정 시기, 공간 범위, 관리 주체 등을 종합적으로 파악할 수 있도록 되어 있으며, 지역 내 문화유산의 보호 관리, 활용 정책 수립, 문화관광 자원 연계 등의 다양한 분야에서 기초자료로 활용될 수 있는 문화재 지정 현황 자료입니다.'
