summary_user: 국립중앙박물관 소장 유물을 한 점씩 기록한 건별 데이터로, 유물 명칭과 이칭(alternativeTitle), 주제 분류·핵심어, 크기, 공간·시대 범위, 관련 인물, 언어, 참조 자료, 저작권·기여자 정보를 담는다. 연구자나 교사가 '특정 시대나 주제에 해당하는 국립중앙박물관 소장 유물에는 무엇이 있고, 이미지를 수업 자료로 쓸 수 있는 저작권 조건인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 박물관·문화재 데이터와는 유물명이나 시대·주제어 같은 이름 매핑으로만 이어 쓴다.
description_portal: 국립중앙박물관에서 소장하고 있는 다양한 유물에 대한 상세 정보를 제공하는 데이터셋입니다. 유물의 명칭, 국적 및 시대, 재질, 크기, 소속, 주제 분류, 핵심 주제어, 저작권, 기여자 등 주요 정보를 포함하고 있어 연구자, 교육자, 문화예술 종사자들이 유물의 학술적 분석이나 전시 기획, 교육 자료 개발 등에 활용할 수 있습니다. 또한 유물의 공간적·시간적 범위와 관련 인물, 언어, 참조 자료 등도 함께 제공되어 문화유산의 체계적 관리와 대국민 서비스 개선에 기여합니다. 다양한 분야에서 문화유산의 가치를 높이고자 하는 분들에게 유용한 자료입니다.
