description_portal: 본 데이터는 세종특별자치시 내에 공식 등록되어 활동 중인 생활체육 종목과 스포츠클럽의 현황을 제공합니다. 데이터는 종목명, 클럽명, 회원수, 등록일자 등 핵심 행정 정보로 구성되어 있으며, 총 42개 클럽의 데이터가 포함되어 있습니다.축구, 테니스, 배드민턴 등 대중적인 단일 종목 중심의 동호회부터 여러 종목을 통합 운영하는 종합스포츠클럽까지 고루 등록되어 있습니다. 세종시민들의 체육 활동 참여 규모와 선호 종목을 보여주며, 지역 내 생활체육 참여 규모와 종목별 활성화 수준을 분석하는 기초 자료로 활용하기 좋습니다.※ 데이터 관련 자세한 문의는 세종특별자치시 체육진흥과 생활체육팀(044-300-6423)으로 연락바랍니다.
