description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 기후변화 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적 분석이 가능합니다.본 자료는 국내 주요 언론사의 기후변화 및 환경 관련 보도를 대상으로, 어떤 기후 이슈가 어느 시기에 집중 보도되었는지, 보도에 활용된 핵심 키워드와 프레이밍이 어떠했는지 등의 패턴을 밝히는 데 중점을 두고 있습니다. 이러한 분석은 언론이 기후위기 담론을 어떻게 형성하는지, 주요 기후정책·산업 변화·사회적 인식에 어떤 영향을 미쳤는지를 추적하는 데 유용합니다.또한 학계, 언론 연구자, 환경정책 전문가, 기후과학자, 기업 및 공공기관 관계자들이 기후변화 보도의 경향, 이슈 집중도 변화, 언론의 기후인식 및 프레임 변화를 이해하고, 보다 균형 있는 보도 기준 마련이나 정책·전략 수립을 모색하는 데 기초 자료로 활용될 수 있습니다.
