summary_user: 빅카인즈(BIGKinds)에서 모은 기후변화 관련 뉴스를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV 약 153MB)로, 기사 주소·보도일자·언론사·제목·통합분류 1~3단계·인물/지역/기업·기관 개체명·키워드·특성추출 값·본문을 포함한다. 언론 연구자나 환경정책 분석가가 "어떤 기후 이슈가 언제 집중 보도됐고 어떤 키워드로 다뤄졌는가"를 시기별·언론사별로 추적할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 언론사명·지역 개체명·기업 개체명 같은 이름 매핑이나 보도일자 기준으로만 이어 쓴다.
limits: 실측 컬럼에 표준 코드형 조인 키가 없어 정책·통계 데이터와 붙이려면 이름 매칭을 직접 해야 한다. 파일 단위로 받는 자료라 수록 기간과 갱신 여부는 파일을 열어 일자 컬럼으로 확인해야 한다.
