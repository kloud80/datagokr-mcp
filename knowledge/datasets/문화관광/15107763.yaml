summary_user: 강원특별자치도의 반려동물 동반 관광지 694건을 장소별 한 행으로 담은 목록 파일로, 장소명·지역·주소·구분·전화번호를 싣는다. 반려동물과 강원도 여행을 계획하는 관광객이 동반 가능한 장소를 찾는 질문에 쓴다. 주소(address)를 조인 키로 삼아 다른 관광지·시설 목록과 이어 쓰며, 좌표나 TourAPI 콘텐츠 ID 같은 별도 키는 필드에 없다.
description_portal: 강원특별자치도 반려동물 관광정보를 안내하여 드립니다.강원특별자치도에는 반려동물을 동반한 다양한 관광장소들이 있습니다.본 자료는 관광객들의 편의를 돕기 위해 관광지, 동물병원, 숙박, 식음료, 약국, 체험으로 구분되어,원활한 반려동물 관광을 돕고자 만든 자료입니다.도내 반려동물동반 관광을 위해 유익한 자료가 될 것입니다.강원특별자치도에서 반려동물과 함께 즐거운 시간을 보내시기 바랍니다.강원특별자치도 여행을 좋아하고 반려동물을 사랑하는 모두에게 열려 있습니다.* 본 데이터는 2025.11.7.기준으로 작성하여 수집된 자료입니다.
