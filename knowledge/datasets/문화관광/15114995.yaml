description_portal: 대구광역시 중구에 위치한 작은도서관현황 데이터입니다.- 연번,시도명,시군구명,도서관명,도로명주소,이용시간,휴관일,전화번호,누리집주소,데이터기준일자 정보를 제공합니다.- 일반 공공도서관보다 작은 규모로, 지역 주민들에게 더 가까운 곳에서 지식 정보 서비스와 독서 문화 프로그램을 제공하는 공간입니다.- 이러한 작은도서관들은 운영 주체에 따라 공립과 사립으로 나뉘며, 주로 개인이나 단체가 운영하는 사립 작은도서관이 많습니다. - 작은도서관은 문화체육관광부에서 제공하는 웹사이트(https://www.smalllibrary.org)에서 전국 데이터를 확인 할 수 있습니다.
