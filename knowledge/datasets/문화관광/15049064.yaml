description_portal: ‘한국학중앙연구원_장서각 소장 의궤 수록 반차도 복식_사전 연계 정보’ 데이터는 장서각 소장 의궤에 수록된 반차도(班次圖) 속 복식 정보를 조선왕조실록사전 등 외부 전문 사전과 연계한 메타데이터입니다.각 항목은 복식의 고유 ID와 함께 복식명(한글 및 한자), 연계 번호, 실록사전 URL, 연계 사이트명 등이 포함되어 있으며, 이를 통해 복식의 명칭뿐만 아니라 해당 복식의 역사적 의미나 용례를 심층적으로 탐색할 수 있도록 구성되어 있습니다.특히 금관(金冠), 단령(團領), 전복(戰服), 전립(氈笠) 등 조선시대 의례와 관직 복식에 쓰인 주요 항목들을 실록사전과 연결함으로써, 반차도에 표현된 복식의 맥락을 문헌적으로 해석하고, 복식사 연구와 전통문화 교육 자료로서의 활용 가치를 높여 줍니다.이 데이터는 디지털 반차도 구현, 시각문화 연구, 전통 의복 콘텐츠 개발 등에서 유용하게 활용될 수 있는 사전 연계형 고문서 메타데이터입니다.
