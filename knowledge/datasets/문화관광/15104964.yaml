summary_user: 국립중앙박물관 소장 유물을 한 점씩 담은 건별 정보로, 유물 명칭·별칭, 소속 DB, 주제 분류·주제어, 크기, 재질, 공간·시간 범위, 관련 인물, 저작권 정보를 제공하며 범위는 전국·비공간이다. 연구자나 교육자가 '특정 시대·주제에 해당하는 국립중앙박물관 소장 유물에는 어떤 것이 있고 재질과 크기는 어떤가'를 확인하거나 전시·교육 자료를 준비할 때 쓴다. 전역 조인 키가 없어 다른 문화유산·소장품 데이터와는 유물명(title)이나 시대·주제어 같은 이름 매핑으로만 이어 쓴다.
description_portal: 국립중앙박물관에서 소장하고 있는 다양한 유물의 정보를 체계적으로 제공하는 데이터셋입니다. 유물의 명칭, 국적과 시대, 재질, 크기, 소속 DB, 주제 분류, 핵심 주제어, 물리적 상태 등 상세한 항목을 포함하고 있어 연구자, 교육자, 문화예술 종사자들이 유물의 특성과 배경을 심층적으로 파악하는 데 활용할 수 있습니다. 또한, 저작권 및 기여자 정보, 언어, 공간과 시간적 범위 등 다양한 부가 정보를 함께 제공하여 유물의 가치와 맥락을 종합적으로 이해하는 데 도움을 줍니다. 박물관 전시 기획, 문화유산 연구, 교육 자료 개발 등 다양한 분야에서 유용하게 활용될 수 있습니다.
