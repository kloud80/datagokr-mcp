summary_user: 경기도 동두천시에 있는 공연장·다목적홀·운동장을 시설 한 곳당 한 행으로 담은 파일로, 시설명·개방시설 유형·휴관일·신청방법·도로명/지번 주소·위도·경도·관리기관 연락처를 포함한다(약 1.9KB 규모의 csv). 동두천시 주민이나 행사 주최자가 "동두천에서 대관 가능한 공연장이 어디 있고 언제 쉬며 어떻게 신청하나"를 확인할 때 쓴다. KOPIS 공연장ID 같은 전역 조인 키는 없어서, 다른 공연·문화시설 데이터와는 시설명이나 주소, 위도·경도를 기준으로 맞춰 이어 쓴다.
description_portal: 경기도 동두천시에 위치한 공연장정보(공연장, 다목적홀, 운동장)를 민원인에게 제공하고자 합니다.공공데이터의 제공 항목으로는 공연장명, 개방시설유형구분, 휴관일, 신청방법구분, 소재지도로명주소, 소재지지번주소, 위도, 경도, 홈페이지 주소, 관리기관명, 관리기관 전화번호의 정보입니다. 예약방법은 방문 또는 이메일로 접수 가능하니 참고하여 주시기 바랍니다.데이터의 기준일자는 2026년 6월 15일입니다.데이터에 대하여 추가적인 문의사항이 있으실 경우 관리기관 전화번호를 참고하여 문의주시기 바랍니다.
