summary_user: 일제강점기 국내에 머문 선교사들이 본국에 보고한 독립운동 당시 상황 자료(편지·성명서·비망록·전보·청원서·사진 등)를 문건 한 건씩 자료번호·문서종류·제목·생산날짜·내용으로 담은 목록이며, 포털에서 약 1.8MB 크기의 CSV 파일로 받는다. 독립운동사 연구자나 교사가 3·1운동 무렵 외국인 선교사가 일제 통치를 어떻게 보고했는지 시기와 문서 종류별로 찾아볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 생산날짜나 제목·내용 속 인물·사건 이름을 맞추거나 같은 기관(독립기념관)의 다른 아카이브 목록과 나란히 보는 방식으로만 잇는다.
description_portal: 일제강점기 국내에서 체류 중인 선교사들이 본국에 보고한 독립운동 당시 상황정보에 대한 원문이미지 정보로 편지, 성명서, 비망록, 교육자료, 전보, 회담보고서, 청원서, 사진자료 등 다양한 자료이다.선교사들이 한국에 온 목적은 복음전도와 교회의 설립 위해 왔으나 을사늑약 이후 재한 선교사들은 일제에 대해서 관망하는 자세를 가지고 있었으나 3·1운동에 이르러 선교사들온 정치중립의 원칙에는 변함이 없지만 일제의 학정과 만행적인 통치에 대해서는 대항하게 되었을 뿐만 아니라 세계에 이 사실을 알리는 역할도 감당하였다.
