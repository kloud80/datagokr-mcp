description_portal: 광주광역시 남구에서 보유하고 있는 지정 등록 문화유산 현황 및 정보(구분, 유산명, 소재지, 지정일자 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 문화관광과(☎062-607-2333)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 문화유산은 과거로부터 전해 내려오는 역사적·예술적·학문적 가치를 지닌 유·무형의 자산을 말합니다. 건축물, 유적지, 고문서, 예술품과 같은 유형 유산뿐 아니라 전통 의식, 공연예술, 민속기술과 같은 무형유산이 포함됩니다. 이러한 유산은 한 지역과 민족의 정체성과 문화를 형성하는 핵심 요소로, 후손에게 계승하기 위해 보존·관리됩니다.
