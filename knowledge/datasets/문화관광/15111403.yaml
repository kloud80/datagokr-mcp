summary_user: 전국 연극장·소극장·독립극장 등 공연 시설 정보에 공연 상세(제목·공연 기간·연령·출연진 등)를 붙인 공연 단위 파일로, 4,191행을 담고 기간은 2011-08-19부터 2022-11-30까지다. 관객이나 분석가가 특정 지역의 소극장에서 어떤 공연이 올라왔는지 찾는 질문에 쓴다. 위도·경도(coord)와 도로명주소·지번주소(address)로 다른 위치·시설 데이터와 이어 쓰며, KOPIS 공연ID나 공연장ID 필드는 이 파일에 없다.
description_portal: 이 데이터는 연극장, 소극장, 독립극장 등의 공연 시설에 대한 정보를 담고 있으며, 공연 상세 정보가 함께 포함되어 있습니다.데이터는 공연 단위로 구축되었기 때문에, 동일한 공연장이 여러 건으로 중복되어 보일 수 있습니다. 그러나 이는 중복 데이터가 아니라, 공연마다 서로 다른 개별 정보가 반영된 독립적인 건임을 안내드립니다.또한, 데이터는 "최종작성일" 컬럼을 기준으로 구축되었기 때문에, 조회 시점에 따라 일부 정보가 상이할 수 있습니다.본 데이터는 2022년을 기준으로 자체 수집 및 구축된 자료로, 현실적인 제약으로 인해 향후 정기적인 갱신이 어려울 수 있음을 양해 부탁드립니다.
