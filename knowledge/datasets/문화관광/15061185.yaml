description_portal: 본 데이터는 양평군 문화체육과 제공 자료로, 지역 내 게임·여가시설 현황 파악을 목적으로 구축됨. 경기도 양평군 관내 게임 제공 업소 및 노래연습장에 대한 위치 기반 현황 정보로, 업종구분, 상호명, 도로명주소, 지번주소, 위도, 경도, 전화번호, 데이터기준일을 포함함. 대상 업종은 인터넷컴퓨터게임제공업, 복합유통게임제공업, 청소년게임제공업, 일반게임제공업, 노래연습장업임. 본 데이터는 2025년 12월 기준 최신 자료를 반영함. 위치정보(위도, 경도)를 포함하여 공간 분석 및 지도 서비스 활용이 가능함.
