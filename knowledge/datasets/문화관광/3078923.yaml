summary_user: 부산광역시 동래구가 설치·운영하는 공공 체육시설을 시설 한 곳당 한 행으로 담은 CSV 파일로, 시설명·지번주소·설치년도·면적·유형과 간이운동장·체력단련시설·부대편의시설 구성, 위도·경도를 포함한다. 동래구 주민이 집 근처 간이운동장이나 운동기구가 있는 체육시설을 찾을 때, 또는 분석가가 구 안의 체육시설 분포와 노후도(설치년도)를 살필 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소나 위도·경도 좌표로 공간 매칭하거나 시설명으로 맞춰 이어 쓴다.
description_portal: 부산광역시 동래구에 설치, 운영 중인  체육시설 현황을 나타내는 데이터로 쉼표로 분리된 (.csv) 파일 데이터입니다.데이터 항목 설명1. 체육시설명2. 위치(지번주소)3. 설치년도4. 면적(제곱미터)5. 유형6. 간이운동장7. 체력단련시설8. 부대편의시설9. 위도10. 경도본 파일 데이터는 부산광역시 동래구가 관리하는 체육시설로 운영, 관리 방침에 따라 달라질 수 있고 유지보수로 인해 운영이 중단될 수 있습니다.사정상 직접확인이 어려우신 경우에는 부산광역시 동래구 하천관리과 051 550 6644로 문의 하시길 바랍니다.
