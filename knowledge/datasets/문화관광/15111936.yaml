summary_user: 경기도 부천시 공공도서관의 대출 거래를 한 행이 한 건의 대출인 건별 원천 형태로 담으며, 도서명·카테고리·대출일시·반납일시와 이용자 성별·연령대, 대출·반납·소장 도서관 코드, 상호대차 여부를 포함한다(zip 약 169MB). 도서관 운영자나 분석가가 "부천시 도서관별로 어느 달에 어떤 분야 책이 많이 대출되고, 상호대차는 얼마나 쓰이나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 도서관 코드(대출_도서관_코드)를 같은 기관의 도서관 목록과 이름·코드 매핑하거나 도서명으로 맞춰 이어 쓴다.
description_portal: 경기도 부천시 공공도서관의 대출현황을 제공하는 콤마구분 텍스트 형식 데이터셋이다. 도서관별로 대출거래가 분리되어 기록되며 한 행은 한 건의 대출을 의미한다. 도서명 대출일시 반납일시와 함께 도서관명 자료유형 회원구분 등의 기본 속성을 포함한다. 기간 필터를 통해 월별 계절별 이용추세를 분석할 수 있고 도서관 간 비교 신간 수요 파악 인기자료 랭킹 산출 권역별 서비스 격차 확인 등 다양한 통계 활용이 가능하다. 지도 플랫폼과 연계하면 분포 시각화와 열지도 작성도 가능하다. 데이터 품질 점검과 전처리 기준을 병기하면 비교 가능성이 높아진다.
