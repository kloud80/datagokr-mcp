summary_user: 서귀포시 관내 유원시설업 업소를 한 곳씩 담은 현황 파일로, 업종 구분(종합·일반·기타 유원시설업), 상호명, 소재지, 연락처, 위도·경도를 업소 단위로 기록한다(CSV 약 4.7KB의 소규모 파일). 관광객이나 주민이 '서귀포에서 갈 만한 놀이·체험 시설이 어디에 있고 어떤 종류인가'를 찾을 때, 또는 지자체가 유원시설 분포와 밀집 지역을 파악할 때 쓴다. 전역 조인 키나 등록번호가 없어 다른 데이터와는 상호명·주소 문자열 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
description_portal: 이 데이터는 서귀포시 관내의 유원시설업 업소들을 종류별로 나누어 상호명, 소재지, 연락처, 그리고 위도/경도 정보까지 포함한 현황 자료입니다. 구분 항목으로 ‘종합유원시설업’, ‘일반유원시설업’, ‘기타유원시설업’ 등이 있어 시설 규모 및 시설 유형별 비교가 가능합니다. 관광객이나 시민들이 놀거리·여가활동 장소를 찾을 때 유용하며, 지자체에서는 유원시설의 분포 및 밀집 지역을 파악하여 안전관리, 입지정책, 관광 인프라 확충 등에 활용할 수 있습니다. 지도 기반 서비스, 관광 안내 앱, 지역별 테마 개발 및 마케팅 자료로도 유용하고, 접근성 및 이용객 유치 측면에서 경쟁력 있는 지역 선정에도 도움이 됩니다.
