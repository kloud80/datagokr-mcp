summary_user: 한국관광공사가 이동통신 데이터(내국인 KT, 외국인 SK텔레콤)로 집계한 광역·기초지자체별 일자별 방문자 수를 담는 API이다. 지역 관광 분석가나 지자체 담당자가 특정 날짜·요일에 시군구별로 내국인과 외국인 방문자가 얼마나 되는지 확인하는 데 쓴다. 시군구코드(signguCode, sgg_cd)로 다른 시군구 단위 지역 정보와 이어 쓰고, 시도 단위는 시도코드(areaCode)를 쓴다.
description_portal: ㈜케이티(내국인)와 SK텔레콤(주)(외국인)의 이동통신 데이터를 기반으로 제공되는 광역 및 기초지자체별 방문자 수 정보입니다. ‘방문자’는 거주, 통근, 통학 등의 일상생활권을 벗어나 관광 등의 목적으로 한 장소에 일정시간 머문 사람으로, 정확한 방문목적을 알 수 없는 데이터 특성상의 한계로 ‘관광객’과 동일하게 정의되지 않습니다. 또한 방문자 수는 일자별 순방문자 수로서, 특정 방문자가 2박 3일간 한 지역을 방문했을 경우 3명으로 집계되며, 기초지자체와 광역지자체가 별도의 집계 기준을 가지고 있어 임의의 데이터 합산이 불가능합니다. 더 자세한 데이터 해석 유의사항은 한국관광 데이터랩(https://datalab.visitkorea.or.kr)의 데이터 설명을 참조 부탁드립니다.
