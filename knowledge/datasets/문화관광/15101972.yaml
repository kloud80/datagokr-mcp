services:
  - op: /metcoRegnVisitrDDList
    name: 광역 지자체 지역방문자수 집계 데이터 정보 조회
    endpoint: https://apis.data.go.kr/B551011/DataLabService/metcoRegnVisitrDDList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: false
        desc: 한페이지결과수
      - name: pageNo
        required: false
        desc: 페이지번호
      - name: MobileOS
        required: true
        desc: 'OS 구분 : IOS (아이폰), AND (안드로이드), WIN (윈도우폰), ETC(기타)'
      - name: MobileApp
        required: true
        desc: 서비스명(어플명)
      - name: startYmd
        required: true
        desc: 시작연월일(YYYYMMDD)
      - name: endYmd
        required: true
        desc: 종료연월일(YYYYMMDD)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /locgoRegnVisitrDDList
    name: 기초 지자체 지역방문자수 집계 데이터 정보 조회
    endpoint: https://apis.data.go.kr/B551011/DataLabService/locgoRegnVisitrDDList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: false
        example: '10'
        desc: 한페이지결과수
      - name: pageNo
        required: false
        example: '1'
        desc: 페이지번호
      - name: MobileOS
        required: true
        example: ETC
        desc: 'OS 구분 : IOS (아이폰), AND (안드로이드), WIN (윈도우폰), ETC(기타)'
      - name: MobileApp
        required: true
        example: AppTest
        desc: 서비스명(어플명)
      - name: startYmd
        required: true
        example: '20210513'
        desc: 시작연월일(YYYYMMDD)
      - name: endYmd
        required: true
        example: '20210513'
        desc: 종료연월일(YYYYMMDD)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
