summary_user: 서울 종로구 내 복합유통게임제공업소의 인허가 내역을 업소 한 곳당 한 행으로 담으며, 인허가·취소 일자, 영업상태, 휴업 기간, 소재지 주소와 좌표, 시설 층수·면적·방 수 같은 시설 항목이 들어 있다. 주민이나 창업 준비자가 종로구에서 지금 영업 중인 허가 복합유통게임제공업소가 어디에 있고 언제 허가·폐업했는지 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 본 데이터는 서울특별시 종로구 내 복합유통게임제공업체의 인허가 현황을 정리하여 제공하는 자료입니다. 복합유통게임제공업은 유통 매장이나 복합시설 내에서 게임물을 설치·운영하여 이용자가 여가를 즐길 수 있도록 하는 업종으로, 「게임산업진흥에 관한 법률」 및 관련 규정에 따라 사업자 등록과 영업 허가를 받아야 합니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등 주요 행정 항목이 포함되어 있어 종로구 내 업체의 등록 현황과 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 행정기관은 게임제공업 관리, 지도점검, 건전한 여가문화 조성을 위한 정책 수립에 활용할 수 있으며, 주민은 합법적으로 허가된 시설을 안전하게 이용할 수 있습니다. 또한 연구자와 업계 관계자는 지역 내 게임산업 분포와 운영 현황을 분석하는 기초자료로 활용할 수 있으며, 종로구의 여가산업 발전과 지역경제 활성화에 기여할 수 있습니다.
