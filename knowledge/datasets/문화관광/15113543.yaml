summary_user: 서울특별시 성북구에서 운영 중인 민간 체육시설업을 시설 한 곳당 한 행으로 담은 명부이며, 업종·상호명·도로명주소·지번주소·매장번호를 포함한다. 성북구 주민이나 체육 관련 사업자가 '우리 동네에 헬스장·당구장·체육도장 같은 체육시설이 어디에 얼마나 있나'를 확인하거나, 분석가가 체육시설 개폐업을 상권 신호로 볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)는 실측 컬럼에 없으므로, 다른 데이터와는 주소나 상호명을 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 2023년 4월 25일 기준으로 서울특별시 성북구 내에서 운영 중인 체육시설업 현황을 정리한 자료입니다. 각 시설의 업종, 상호명, 도로명주소, 매장번호 등 기본 정보를 포함하고 있으며, 수영장·헬스장 등 생활체육시설의 분포와 운영 현황을 파악할 수 있습니다. 본 자료는 성북구 지역 내 체육 인프라 분석, 체육시설 정책 수립, 생활체육 프로그램 운영, 지역 주민의 체육시설 접근성 평가 등 다양한 행정 및 연구 목적에 활용될 수 있습니다. 특히 시설별 업종 및 위치 정보를 기반으로 지역별 체육서비스 제공 현황을 비교·분석하는 데 유용한 기초 데이터입니다.
