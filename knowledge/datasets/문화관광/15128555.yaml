summary_user: KT 이동통신 데이터를 바탕으로 관광지별로 조회일부터 향후 30일간의 방문자 집중률(가장 붐비는 시기를 100으로 둔 상대값)을 날짜별 예측치로 담으며, 검증 호출에서는 전국 시군구 범위로 30행(2026-09-30~2026-10-29)이 수신됐다. 여행객이 "다음 주 이 관광지가 얼마나 붐빌까"를 확인해 방문 날짜를 고르거나, 지자체·사업자가 혼잡 예상 시기에 인력·안전 대책을 준비하는 데 쓴다. 시군구코드(signguCd)를 키로 같은 시군구 단위의 관광지점 입장객·방문객 통계나 지역 정보와 이어 쓴다.
limits: 집중률은 실제 방문자 수가 아닌 머신러닝 기반 상대 예측값이라 실측 인원과 차이가 날 수 있다. 날짜 컬럼에 미래 날짜(향후 30일)가 들어 있으므로 데이터의 최신성은 기준일자가 아닌 적재·조회 시점으로 판단해야 한다.
