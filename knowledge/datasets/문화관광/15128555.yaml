description_portal: ㈜케이티의 이동통신 데이터를 기반으로 제공되는 관광지별 조회일 기준 향후 30일간의 관광지 방문자의 집중률 정보입니다. 2018년부터의 방문자 데이터를 기반으로 패턴을 분석하여 해당 관광지에 방문자가 얼마나 집중되는지를 예측한 값으로, 가장 붐비는 시기를 100으로 보았을 때 향후 30일간의 집중률을 상대 수치로 환산한 값입니다. ㈜케이티에 가입된 휴대전화 단말기를 소지한 사람의 이동 정보를 기반으로 평일/공휴일, 휴가시즌 등의 시기적 특성을 반영하여 머신러닝 기법으로 추정되었기 때문에 각종 환경변화에 따라 실제 방문자 수와 예측값 간에 차이가 있을 수 있습니다.
