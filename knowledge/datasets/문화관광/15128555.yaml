        required: true
        example: AppTest
        desc: 서비스명(어플명)
      - name: areaCd
        required: true
        example: '51'
        desc: 관광지 지역코드 ( 참고문서 매뉴얼 파일중 '관광지_시군구_코드정보' 파일 참고 )
      - name: signguCd
        required: true
        example: '51130'
        desc: 관광지 시군구코드  ( 참고문서 매뉴얼 파일중 '관광지_시군구_코드정보' 파일 참고 )
      - name: tAtsNm
        required: false
        example: 간현관광지
        desc: 관광지명
      - name: _type
        required: false
        example: json
        desc: '응답메세지 형식 : REST방식의 URL호출 시 json값 추가(디폴트 응답메세지 형식은XML)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
