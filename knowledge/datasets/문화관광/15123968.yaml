summary_user: 경기도 양평군에서 저소득층 유청소년 대상 스포츠강좌이용권(보조금)을 쓸 수 있는 시설을 시설 단위로 담은 파일 데이터로, 시설명·종목·도로명주소·데이터기준일을 담는다. 양평군에 사는 이용권 대상 가정이 '아이가 이용권으로 다닐 수 있는 수영·태권도 시설이 근처 어디에 있나'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 시군의 같은 이용권 시설 목록이나 체육시설 데이터와는 시설명·도로명주소를 맞춰 연결해야 한다.
limits: 파일에 시설 코드나 표준 조인 키가 없어 다른 데이터와 붙일 때 이름·주소 매칭에 의존해야 한다. 범위는 양평군 한 곳뿐이다. 명세상 연간 또는 이벤트 주기로 만들어지는 파일이라 수시로 바뀌는 가맹 현황을 실시간으로 반영한다고 보기 어렵다.
