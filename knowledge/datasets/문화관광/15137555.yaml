description_portal: '- 제주관광공사에서 운영하는 플랫폼의 큐레이션 콘텐츠 내역입니다.- 해당 데이터는 운영자가 큐레이션하고 싶은 콘텐츠를 입력하면 데이터베이스에 저장하여 생성합니다.- 개방데이터 항목은 큐레이션콘텐츠아이디, 큐레이션타입, 세그먼트아이디, 콘텐츠아이디이며 전체 데이터 수는 68건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 다양한 테마별·타깃별 콘텐츠 큐레이션 현황을 파악하여, 맞춤형 관광코스 및 추천 서비스 개발, 이용자 관심사 기반 콘텐츠 기획, 신규 관광 트렌드 발굴, 플랫폼 내 콘텐츠 다양성 강화, 관광객 만족도 향상 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
