summary_user: 장애인스포츠강좌이용권으로 수강할 수 있는 등록 강좌를 강좌 한 건 단위로 담으며, 종목명·강좌명·운영 요일(7자리 월~일 구분값)·시작/종료 시간·수강료·사업자등록번호·강좌 상세설명을 제공한다. 장애인 당사자나 가족이 이용권으로 들을 수 있는 특정 종목 강좌가 어느 요일·시간에 얼마의 수강료로 열리는지 찾는 데 쓰고, 종목명·강좌명을 조회조건으로 검색한다. 실측 컬럼에 전역 조인 키가 없어, 같은 기관의 스포츠강좌이용권·시설 데이터와는 사업자등록번호(busi_reg_no)나 강좌번호·종목명 같은 이름·코드 매핑으로만 연결한다.
description_portal: '"장애인스포츠강좌이용권 등록강좌는 서울올림픽기념국민체육진흥공단에서 운영중인 장애인스포츠강좌이용권으로 이용가능한 강좌 정보를 담은 데이터로, 사업자번호, 강좌번호, 종목명, 강좌명, 강좌기타사항, 시작시간, 종료시간, 강좌에 대한 상세설명, 결제금액(수강료) 등의 정보를 제공합니다. 강좌의 종목명, 강좌명 등의 조회조건을 이용하여 강좌 정보를 조회할 수 있는 API서비스입니다.* 요일구분값(월~일) : 1111100 ☞ 월~금, 1111100 => 0111101 ☞ 화수목금일"이 서비스는 장애인 대상 스포츠 강좌 정보를 요일별·종목별로 제공하여 수강 신청 및 강좌 운영의 효율성을 높이는 데 활용될 수 있습니다.'
