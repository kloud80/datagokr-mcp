summary_user: 한국영상자료원의 KMDb 온라인 VOD, 영상도서관 멀티미디어석 VOD, 영상도서관 비디오 열람석에서 이루어진 관람을 한 건씩 기록한 이력 파일로, 열람일·열람시간, 온라인·오프라인 구분, 자료명·제작년도·제작국가·관람기준, 열람자 나이·성별을 담는다. 연구자나 기관 담당자가 '어떤 연령·성별의 이용자가 어느 시기의 어느 나라 영화를 온라인과 영상도서관 중 어디서 더 많이 보는가'처럼 서비스 유형별 이용 추이와 선호를 분석하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고, 영화코드(영화등록번호)나 자료명을 매개로 같은 기관의 KMDb 영화 정보와 이름·코드 매핑으로만 연결한다.
description_portal: 한국영상자료원이 운영하는 온라인 및 오프라인 영상 열람 서비스의 이용 현황을 종합적으로 기록한 데이터입니다.본 데이터는 **KMDb 온라인 VOD 서비스**, **영상도서관 멀티미디어석 VOD 서비스**, **영상도서관 비디오 열람 서비스**의 이용자 관람 이력을 포괄적으로 포함하고 있으며,각 서비스별 이용 형태를 비교·분석할 수 있는 기초자료로 활용할 수 있습니다.데이터에는 **열람일, 열람시간, 열람구분(온라인·오프라인), 자료구분(비디오·VOD 등), 자료명, 제작년도(또는 제조년도), 제작국가(또는 제조국가), 관람기준, 영화코드(또는 영화등록번호), 자료번호, 열람자 연령 및 성별** 등의 정보가 포함되어 있어, 이용자의 관람 패턴과 선호도 분석에 유용합니다.* **영상도서관 비디오 열람실적**은 2012년 8월 1일부터 2025년 9월 26일까지의 기간 동안 서울 상암동에 위치한 한국영상자료원 영상도서관 내 비디오 열람석을 통해 이루어진 오프라인 관람 이력을 수집한 자료입니다.* **영상도서관 VOD 열람실적**은 동일한 기간 동안 영상도서관 멀티미디어석을 통해 디지털 영상 콘텐츠를 시청한 기록을 포함하며, 자료원의 디지털 전환 흐름을 반영한 VOD 이용 행태를 보여줍니다.* **온라인 VOD(KMDb VOD) 열람실적**은 2007년 11월 21일부터 2025년 9월 26일까지 한국영상자료원이 운영하는 **한국영화데이터베이스(KMDb)** 플랫폼을 통해 온라인으로 제공된 VOD 콘텐츠의 이용 이력을 집계한 데이터로, 국내 영화 콘텐츠의 온라인 확산과 이용 트렌드를 파악하는 데 활용할 수 있습니다.이 데이터는 **1년 주기**로 정기 갱신되며, 장기간 축적된 시계열 데이터를 기반으로 연도별 이용 경향, 서비스 유형별 열람 빈도, 관람자 특성 변화 등을 종합적으로 분석할 수 있습니다. 이를 통해 영화문화 향유 행태의 변화를 살피고, 한국영상자료원의 서비스 개선 및 영화문화 정책 수립에 기초자료로 활용할 수 있습니다.
