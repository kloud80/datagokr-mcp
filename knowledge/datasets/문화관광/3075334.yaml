summary_user: 부산 해운대구 관내에 있는 국가지정·부산시지정 문화유산을 건별로 담은 목록 파일로, 종류·종별·지정번호·지정일자·문화재명·소재지·관리주체를 담는다(약 2.6KB 규모의 CSV). 주민·관광객·연구자가 '해운대구에 어떤 지정 문화유산이 있고 어디에 있으며 누가 관리하는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 국가유산청 문화유산 API 등과는 문화재명이나 종별+지정번호를 맞춰 이어 쓰고, 소재지 주소로 지도·위치 데이터와 연결한다.
description_portal: '- 부산광역시 해운대구 관내에 소재하고 있는 국가지정 및 부산광역시지정 문화유산(유형,무형,자료,자연,기념물 등) 현황을 소개합니다.- 국가지정등록 문화유산 및 부산광역시지정 문화유산에 따른 문화유산, 문화유산자료, 자연유산, 기념물 그리고 무형문화유산 등을 소개합니다.- 각각의 국가지정등록 문화유산 및 부산광역시지정 문화유산에 따른 문화유산 지정 종목, 문화유산 종류(유형,무형,자료,자연,기념물 등), 문화유산 지정번호, 지정일자, 소재지(위치), 관리단체(개인, 단체, 공공기관) 등을 소개합니다.'
