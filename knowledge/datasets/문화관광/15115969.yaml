description_portal: '본 데이터는 서울특별시 중구 관내에서 인허가를 받은 비디오물 감상실업에 대한 정보를 수록한 자료입니다. 수록 항목은 업체명, 대표자, 영업소 주소, 인허가일자, 허가상태, 업소유형, 관할기관 등으로 구성되어 있으며, 지역 내 영상 콘텐츠 관련 업종의 운영 현황을 확인하는 데 활용됩니다. 해당 자료는 「음반·비디오물 및 게임물에 관한 법률」에 따라 허가 또는 신고된 사업체를 기준으로 작성되며, 공공기관의 콘텐츠 관련 정책 수립 및 업소 관리 행정에 필요한 기초자료로 제공됩니다. 시민은 업소 정보 및 운영 현황을 확인함으로써 청소년 보호 및 시설 이용 시 참고할 수 있으며, 관련 기관은 점검계획 수립, 통계 분석, 문화산업 환경 조성 등에 본 데이터를 활용할 수 있습니다. 데이터는 정형화된 구조로 제공되어 행정업무 및 시스템 연계에 용이합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
