summary_user: 인천광역시 서구(서해구) 안에 있는 문화공연장의 이름, 소재지, 관리기관, 전화번호, 홈페이지 주소를 공연장 한 곳당 한 행으로 담은 시군구 단위 목록 파일(csv, 약 1.3KB)이다. 주민이 "우리 동네 가까운 공연장은 어디고 어디에 문의하나"를 확인하거나, 분석가가 구 내 공연 인프라 분포를 살펴볼 때 쓴다. 전역 조인 키가 없어 KOPIS 공연장ID(mt10id) 등 다른 공연 데이터와는 공연장명·소재지 주소를 맞춰 이어 써야 한다.
limits: 공연장 고유 코드가 없어 KOPIS 공연 목록·예매 데이터와 바로 연결되지 않고, 이름·주소 매칭에 의존해야 한다. 명세상 연간 갱신이지만 한 번 만든 뒤 바뀌지 않는 이벤트형 주기로도 표시되어 있으니 데이터기준일자를 확인하고 쓴다.
