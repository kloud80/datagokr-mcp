summary_user: 대구광역시에 있는 공연장·문화예술회관·미술관·박물관 등 문화시설 23곳의 시설 구분, 시설명, 홈페이지, 주소, 대표전화를 시설 1건당 1행으로 담은 작은 CSV 목록이다. 시민이나 관광객이 '대구에서 공연이나 전시를 볼 수 있는 시설이 어디이고 연락처는 무엇인가'를 확인하거나, 분석가가 대구 지역 문화시설 분포를 볼 때 쓴다. 전역 조인 키(공연시설 ID나 문화시설 코드)가 없어서 다른 문화시설·공연 데이터와는 시설명이나 주소로 맞춰 이어야 한다.
description_portal: 대구광역시에 위치한 23개의  공연장,  문화예술회관,  미술관, 박물관 등 문화시설현황(홈페이지, 주소, 대표전화번호 등) 입니다.대표적인 문화시설인 대구문화예술회관은 연극, 음악, 무용 등 다양한 공연을 손보이며, 대구콘서트하우스, 대구오페라하우스 등 각종 공연 시설에서도다양한 장르의 문화예술을 접할 수 있습니다. 또한 대구미술관과 대구간송미술관이 서로 인접한 곳에 위치해 있어 고전미술에서 현대미술까지 한번에 경험할 수 있는 기회를 제공하고 있습니다. 각종 공연과 기획전시들을 통해 대구시민들의 알찬 여가시간과 문화 생활 향상을 위해 힘쓰고 있으며,대구광역시 내 문화시설에서는 다양한 연령층과 계층을 대상으로 폭넓은 문화 프로그램을 운영하여 대구시민들의 문화 향유 기회를 확대하고, 지역 문화 발전에 기여하고 있습니다.
