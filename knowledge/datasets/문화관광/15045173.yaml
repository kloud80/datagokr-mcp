summary_user: 부산광역시 서구 관내 일반 숙박업 중 모텔 업종 영업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 6KB)로, 업종명·업소명·도로명 주소·전화번호·업태명이 들어 있다. 주민·관광객이 서구에서 묵을 모텔의 위치와 연락처를 찾거나, 구청·분석가가 서구 모텔이 어느 지역에 몰려 있는지 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞춰 붙여야 하며, 공중위생법 숙박업 신고 인허가 원천(LOCALDATA)과 대조할 때도 이 방식을 쓴다.
description_portal: 부산광역시 서구에서 관내 일반 숙박업 중 ‘모텔’ 업종에 해당하는 영업소 정보 현황 데이터입니다.수집 항목에는 업종명, 업소명, 영업소 주소(도로명), 전화번호, 업태명 등 기본 영업 정보가 포함되어 있으며, 이를 통해 각 숙박업소의 위치, 운영 형태, 연락처 등 사항을 확인할 수 있습니다.예시 데이터에는 호성장, 송도모텔, 구덕장모텔, 금호장모텔, S모텔, 원모텔, 온모텔 등 다수의  업소가 포함돼 있으며, 각 영업소의 도로명 주소, 연락처, 업태 구분 정보가 제공됩니다.본 데이터는 숙박업소 관리·점검, 안전·위생 지도, 관광객 편의 제공, 지역 내 숙박 인프라 분석 등 다양한 행정 및 서비스 분야에서 활용될 수 있습니다.
