summary_user: 경기도 31개 시군의 수영장업 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가·폐업일자, 영업상태, 지도자 수, 회원모집 인원, 건물 면적, 보험 가입 여부, 주소와 위경도 좌표가 들어 있다. 주민이나 분석가가 '우리 시군에서 지금 영업 중인 수영장은 어디이고, 지도자는 몇 명인가'를 확인하거나, 지역별 수영장 분포와 공공·민간 운영 비중을 따질 때 쓴다. 전역 조인 키는 없으며, 시군 코드(SIGUN_CD)로 같은 경기도 데이터와 묶거나 주소·좌표로 다른 체육시설 자료와 공간적으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 31개 시군의 수영장업체 인허가 현황을 제공하는 자료로, 수영 등의 레크리에이션을 위해 인공적으로 물을 채운 체육시설에 대한 정보를 포함합니다. 총 32개 항목으로 구성되며, 사업장명, 인허가일자, 영업상태, 폐업일자, 지도자 수, 회원모집 가능 인원, 건축물 정보, 위치정보(WGS84 위도·경도, 좌표값), 소재지 주소, 업태 및 세부업종명, 보험가입 여부 등 다양한 정보가 제공됩니다. 수영장 시설의 공간분석, 지역별 수영장 운영 현황 파악, 정책 수립 시 기초자료로 활용될 수 있으며, 공공·민간 운영 구분, 지도자 확보 여부 등도 확인 가능합니다. 데이터는 행정안전부에서 주간 단위로 갱신되며, Open API를 통해 시스템 간 연계 활용이 가능합니다.
