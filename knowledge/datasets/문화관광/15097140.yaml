summary_user: 제주 월정리 진빌레 밭담길 일대 무장애 여행 코스의 지점들을 순서·위도·경도·구분·설명·상세정보 단위로 담고, 각 지점이 전체코스·추천코스에 드는지도 표시한 지점 목록이다. 휠체어 이용자나 교통약자와 동행하는 여행자, 열린관광지 담당자가 "진빌레 밭담길을 어떤 경로로 돌면 되고 중간에 어떤 지점과 편의시설이 있는가"를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 위도·경도로 위치를 맞추거나 지점 이름으로 대조해 잇는다.
description_portal: '"제주특별자치도 내 제주특별자치도_월정리진빌레밭담길_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 월정리 일대의 ‘진빌레 밭담길’을 중심으로 조성된 무장애 여행 코스 정보를 제공한다. 밭담길의 특성에 맞춰 안전한 이동 경로, 접근 가능한 지점, 휴게시설 및 편의시설 현황을 포함해 교통약자와 휠체어 이용자의 이동 편의를 확보하기 위해 마련된 자료이다. 현장 기반의 경사도, 노면 상태, 보행환경, 주차 및 화장실 접근성 등 요소가 반영되어 있으며, 지역 고유 경관 보호와 더불어 무장애 관광환경 구축, 열린관광지 개발 및 정책 수립을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
