summary_user: 대구광역시의 주제별 관광코스를 코스별로 묶어, 코스에 포함된 관광지의 이름·주소·전화번호·홈페이지와 코스 설명을 담은 CSV 파일(약 32KB)이다. 대구 여행을 준비하는 관광객이나 여행 콘텐츠를 만드는 사업자가 '역사·문화를 주제로 하루에 둘러볼 대구 코스는 어떻게 짜여 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지 이름이나 주소를 맞춰 연결해야 한다.
description_portal: 대구광역시를 여행하는 관광객을 위해 제공되는 다양한 관광 코스 정보를 담은 데이터입니다. 이 자료는 대구의 주요 관광지들을 연결하여, 관광객들이 한 번에 여러 명소를 효율적으로 탐방할 수 있도록 돕습니다. 각 관광 코스는 주제별로 구분되어 있으며, 각 코스에는 방문할 관광지의 위치, 이동방법 등  실용적인 정보가 포함되어 있어 여행 준비에 유용합니다. 또한, 대구의 특색 있는 문화와 역사, 자연을 경험할 수 있는 코스를 통해 지역 관광을 활성화하고, 관광객들이 만족스러운 여행을 즐길 수 있도록 지원하는 자료입니다.
