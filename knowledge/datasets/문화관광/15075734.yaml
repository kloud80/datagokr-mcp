description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 너븐숭이 4·3기념관과 북촌 4·3길은 제주시 조천읍 북촌리에 위치하며 1949년 1월 17일 당시 무고한 마을 주민들이 집단 희생된 북촌리 학살사건의 기억을 보존하고 위로하기 위해 2009년 세워진 위령·기념 공간과, 당시 흔적과 마을 길을 따라 조성된 역사 탐방로로서 영상 및 전시관, 위령비, 애기무덤, 문학비, 산책로, 위령탑 등을 포함하고 있으며 장애인 전용 주차구역, 단차 없는 출입로, 휠체어 이용 가능한 내부 관람로, 장애인 화장실 등의 무장애 접근성 시설이 제공되어 누구나 접근 가능한 열린 역사문화 공간이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
