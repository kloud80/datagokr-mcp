description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 보목포로(볼레낭개길)는 제주 서귀포시 보목포구를 중심으로 펼쳐진 어촌 마을과 해안 산책로로, 바다와 현무암 해안, 포구, 숲과 오름 풍경이 어우러진 경관을 갖추고 있으며 일부 구간에서는 무장애 관광을 고려해 단차 없는 출입로, 장애인 전용 주차구역 및 화장실 등의 편의시설 정보가 제공되어 휠체어나 유모차 이용자, 고령자 등 누구나 바다 경관과 마을 풍경을 부담 없이 즐길 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
