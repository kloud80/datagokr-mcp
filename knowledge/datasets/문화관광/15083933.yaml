summary_user: 서울시 관광 명소를 명소 한 곳당 한 건으로 담으며, 고유번호·언어 구분·명소명·상세 URL·지번/도로명 주소·연락처·운영시간과 휴무일·지하철 교통정보·태그·장애인편의시설 설명을 함께 제공한다. 관광객이나 관광 안내 서비스 개발자가 "이 명소는 언제 열고 어느 지하철역에서 가며 휠체어로 접근 가능한가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 명소명·주소 매칭으로만 이어 쓴다.
description_portal: 서울시 관광 명소 데이터는 서울을 방문하는 관광객에게 주요 명소 정보를 체계적으로 제공하기 위해 구축된 자료입니다. 고유번호는 각 명소를 식별하는 값이며, 언어 코드는 제공되는 정보의 언어를 구분합니다. 상호명과 콘텐츠 URL은 명소의 기본 소개와 상세 내용을 확인할 수 있는 핵심 항목입니다. 주소와 신주소는 위치 기반 안내에 활용되며, 전화번호와 팩스번호, 웹사이트는 문의 및 추가 정보 탐색에 도움을 줍니다. 운영시간·운영요일·휴무일은 방문 일정 계획에 필수적인 정보입니다. 지하철 등 교통정보는 접근성을 높이는 요소입니다. 태그는 명소의 특징을 한눈에 파악할 수 있게 하며, 장애인편의시설 정보는 접근성 향상과 배리어프리 관광 지원에 중요한 역할을 합니다. 이 데이터는 관광 안내, 도시 홍보, 관광 서비스 품질 향상에 기여하는 기반 자료입니다.
