summary_user: 게임국가기술자격검정 합격자의 자격증 발급 기록을 자격번호별로 담은 건별 원천 파일로, 용지 수입년도·회차·수입량, 내지번호, 발급일, 출력상태, 파지 사유가 함께 들어 있다(CSV 약 212KB, 전국 범위). 운영기관이나 연구자가 '특정 회차에 들어온 자격증 용지 가운데 몇 장이 정상 출력되고 몇 장이 파지 처리됐는가'처럼 발급·용지 관리 현황을 점검하는 데 쓴다. 자격번호(game_qual_cert_no)가 실측 조인 키여서 같은 번호를 가진 게임자격 검정·합격자 데이터와 이어 붙일 수 있다.
description_portal: 게임국가기술자격검정 자격증발급 정보는 시험 합격자의 자격증 발급 현황을 관리하고 추적하기 위해 제공되는 데이터입니다. 데이터에는 수입년도, 수입회차, 수입량, 등록일, 자격번호, 발급일, 출력상태, 파지사유 등의 항목이 포함되어 있습니다. 이를 통해 합격자는 자신의 자격증 발급 여부와 상태를 확인할 수 있으며, 운영기관은 자격증 발급 건수를 체계적으로 관리할 수 있습니다. 또한 발급 과정에서 정상 처리 여부와 파기 사유가 기록되어 제도 운영의 투명성과 신뢰성을 높입니다. 교육기관과 연구자는 이를 기반으로 게임 분야 국가자격검정 제도의 운영 현황을 분석할 수 있고, 정책기관은 발급 관리 체계를 점검하는 근거 자료로 활용할 수 있습니다. 결국 이 데이터는 자격 검정 제도의 공정성과 신뢰성을 보장하는 핵심 자료로 기능합니다.
