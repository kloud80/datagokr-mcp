description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 이호테우해변은 제주 제주시 이호일동에 위치하며 제주시 도심과 가까워 접근이 편리한 해변으로, 부드러운 경사와 백사장, 해안 산책로 및 주차장, 장애인 전용 주차구역, 장애인 화장실 등 무장애 관광 정보가 포함된 열린관광지이며 붉은색과 흰색의 말 모양 등대, 소나무 숲, 캠핑장, 일몰 명소로서의 경관이 어우러져 휠체어 사용자, 유모차 동반 가족, 고령자 등 누구나 바다와 산책, 휴식, 해변 감상을 비교적 무리 없이 즐길 수 있는 관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
