summary_user: 인천광역시 관내 피서지 주변 업소에서 파는 주요 품목의 상표·규격, 판매가격, 가격 적용일, 이전가격, 업소명을 업소·품목별 행으로 담은 CSV 파일(약 11KB)입니다. 휴가철 관광객이나 물가 분석가가 '인천 해수욕장 주변 음식·용품 값이 얼마이고 이전보다 올랐는지'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 피서지명·업소명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 인천광역시가 제공하는 피서지 물가 현황 공공데이터는 지역 내 주요 피서지 및 관광지 주변에서 판매되는 주요 품목의 가격을 조사하여 집계한 자료입니다. 이 데이터는 휴가철 소비자 물가 안정을 도모하고, 관광객에게 합리적인 물가 정보를 제공하여 지역 관광 활성화에 기여하는 것을 목적으로 합니다.인천광역시 소재 관내 피서지 물가정보(품목, 상표, 판매가격, 업소명 등)등의 정보에 대한 항목 정보를 알 수 있습니다.해당 데이터는 공공데이터포털에서 CSV파일을 무료로 다운로드 할 수 있습니다.
