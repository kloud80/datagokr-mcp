summary_user: 한국관광 데이터랩의 국민 해외관광객 수를 기준연도·성별·연령대별로 나누고 인천공항·김포공항·김해공항·제주공항·부산항구 등 출국 공항·항구별로 집계한 전국 단위 연도별 통계 파일(csv, 890 bytes)이다. 관광 분석가나 여행업 사업자가 '어느 연령대·성별의 국민이 어느 공항이나 항구로 해외여행을 많이 떠나는가'를 연도별로 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연도나 공항·항구 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: "- 본 데이터는 한국관광공사에서 운영하는 한국관광 데이터랩(datalab.visitkorea.or.kr)에서 제공하는 한국관광통계의 국민 해외관광객 연도별 상세 데이터입니다.- 해당 자료에는 연도별 국민 해외관광객의 성별, 연령별, 교통수단별 국민 해외관광객 수 등의 데이터를 포함하고 있습니다.- 국민 해외관광객에는 전체 국민 출국자 중 세계관광기구(UN Tourism) 거주지 분류 권고안에 근거하여 재외국민 출국자(교포)는 제외하고 있습니다.- '승무원'은 별도의 출국절차를 밟아 출국하여 남녀/연령 구분이 되지 않습니다"
