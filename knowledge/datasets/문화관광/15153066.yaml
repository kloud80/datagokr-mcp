summary_user: 국가유산청이 제공하고 재난안전데이터 공유플랫폼을 거쳐 연계되는 문화재 방재설비 정보로, 필드 이름으로 보아 문화재별 소화기·소화전·감지기·경보설비·CCTV 보유 현황과 소방차 도착 소요시간을 담는 전국 범위의 비공간 데이터입니다. 문화재 안전 담당자나 분석가가 '어느 문화재가 화재 감지·소화 설비를 갖추지 못했거나 소방차 도착이 오래 걸리는가'를 살피는 데 쓴다. 전역 조인 키는 확인되지 않아, 국가유산 코드로 보이는 필드(NTN_HEITG_CD)를 국가유산청 지정·등록 목록의 종목코드·지정번호와 이름·코드로 매핑해야 연결된다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계되어 제공하고 있습니다.- 해당 데이터는 국가유산청에서 제공하고 있는  문화재방재설비 관련 정보입니다.\""
