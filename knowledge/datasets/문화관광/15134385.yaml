summary_user: 인천광역시가 문화유산 표준관리시스템에서 관리하는 유물을 한 건씩 담은 파일로, 유물마다 연번·일련번호, 소장구분, 유물명을 기록한다. 연구자나 시민이 인천시가 어떤 유물을 어느 소장 범주로 보유하고 있는지 목록으로 확인하거나 특정 유물명을 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 유물명 같은 이름 매핑이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 문화유산 표준관리시스템에서 유물의 기본 정보를 체계적으로 관리하기 위해 구축된 자료입니다. 각 유물은 연번과 일련번호를 통해 고유하게 식별되며, 소장구분 항목은 해당 유물이 어느 기관이나 범주에 속하는지를 명확히 보여줍니다. 유물명은 구체적인 대상의 성격과 내용을 기록하여 문화재의 성격을 이해하는 기초 자료로 활용됩니다. 이러한 데이터는 유물의 분류, 보관, 검색을 체계화할 뿐만 아니라 행정적 보고와 기록 관리의 정확성을 높이는 역할을 합니다. 더 나아가 연구자와 관계 기관이 문화유산을 효율적으로 보존·활용할 수 있도록 지원하며, 문화재 관리의 투명성과 신뢰성을 확보하는 기반 자료로도 사용됩니다.
