summary_user: 서울특별시 중랑구의 수영장업 인허가 업소를 사업장 한 건씩 담은 원천 명부로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표 등을 포함한다. 주민이나 상권 분석가가 '중랑구에서 지금 영업 중인 수영장은 어디이고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매핑이나 같은 기관의 체육시설업 인허가 데이터(헬스·당구·체육도장 등)와 같은 항목 구조로 나란히 이어 쓴다.
description_portal: '서울특별시 중랑구의 수영장 등 수영 같은 레크레이션을 즐기기 위해 인공적으로 물을 채워 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
