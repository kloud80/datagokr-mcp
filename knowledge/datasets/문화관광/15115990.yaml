description_portal: '서울특별시 중구의 영리를 목적으로 영화를 상영하는 장소 또는 시설 정보입니다. 데이터는 각 등록업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화산업 분야의 멀티플렉스 또는 독립 문화시설 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 스크린 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 안전시설 기준을 충족하며 대중문화 향유 기회를 제공하는 신뢰할 수 있는 등록업소의 위치와 스크린 규모 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
