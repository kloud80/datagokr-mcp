summary_user: 경상남도 내 문화예술회관을 시설 한 곳당 한 건씩 담은 목록으로, 시설명·시군구·도로명주소·전화·팩스·홈페이지·운영 주체를 담는다. 도민이나 공연 기획자가 "우리 시군에 있는 문예회관은 어디이고 연락처·홈페이지는 무엇인가"를 확인하거나, 분석가가 도내 문예회관의 지역 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 공연장·문화시설 데이터(KOPIS 공연시설 ID, 문화기반시설총람 시설코드)와는 시설명이나 시군구·주소를 맞춰 연결해야 한다.
