summary_user: 울산 동구 대왕암공원 캠핑장 예약 홈페이지에서 결제를 시도했으나 완료되지 않은 임시결제 기록을 건별로 담은 CSV 파일(약 1MB)로, 등록일자·상태·사이트번호로 구성된다. 캠핑장 운영 담당자나 분석가가 '어느 사이트에서 결제 이탈이 많고 임시 점유가 언제 몰리는가'처럼 예약 전환율과 이탈 양상을 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 같은 캠핑장의 예약·결제 데이터와 사이트번호·날짜 기준으로 맞춰 보는 방식으로만 이어 쓴다.
