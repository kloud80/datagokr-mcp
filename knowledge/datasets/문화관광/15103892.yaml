description_portal: '인천광역시의 전문예술·법인 단체 지정 현황입니다. 매년 하반기 심의를 통해 지정하여, 단체의 전문성을 인정하고 제도적·간접적 지원을 통하여 자생력과 경쟁력을 갖춘 단체를 육성하고자 합니다.추진근거: 문화예술진흥법 제7조(전문예술법인,단체의 지정,육성), 인천광역시 문화예술진흥 조례 제14조(전문예술법인,단체의 지정)지정대상: 1.국가 또는 지자체가 설치,설립한 공연장 또는 예술단의 운영을 주된 목적으로 하는 비영리법인 또는 단체 2.미술,음악,무용,연극,국악 사진과 관련된 전시, 공연, 기획 및 작품 제작을 주된 목적으로 하는 비영리법인 또는 단체 3.공연 또는 전시시설의 운영을 주된 목적으로 하는 비영리법인 또는 단체 4.문화예술분야의 잔흥을 위한 사업과 활동을 지원하기 위하여 국가 또는 지방자치단체가 설립한 비영리법인'
