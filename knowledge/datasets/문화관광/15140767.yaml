summary_user: 광진구 내 수영장업 업소를 한 곳당 한 행으로 담은 인허가 원천 명부로, 관리번호·인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표·보험가입 여부·지도자 수·건축물 면적 등을 포함한다. 생활체육 수요를 분석하는 분석가나 창업을 검토하는 사업자가 '광진구에서 지금 영업 중인 수영장은 어디이고 최근 폐업한 곳은 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 상권 데이터나 다른 체육시설업 인허가 명부와 주소 기준으로 이어 쓴다.
description_portal: 서울특별시 광진구_수영장업 인허가 정보는 광진구 내에서 인공적으로 물을 채운 시설을 통해 수영, 물놀이, 수중운동 등 다양한 레크리에이션 활동을 제공하는 수영장 관련 업소에 대한 인허가 정보를 포함합니다. 본 데이터는 수영장을 운영하는 시설에 대한 업소명, 대표자명, 인허가일자, 영업상태, 소재지 주소, 업종분류명, 관리기관명 등의 항목으로 구성되어 있으며, 공공체육시설, 실내·실외수영장 등 다양한 유형의 수영시설 정보를 포함합니다. 위치정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도/경도 형식은 포함되어 있지 않습니다. 이 데이터는 지역 내 체육 및 여가시설 분포를 파악하고, 생활체육 인프라 수요 분석이나 정책 수립을 위한 기초자료로 활용될 수 있습니다. 제공 데이터는 3일 전 기준으로 최신화됩니다.
