summary_user: 전라남도 남도여행길잡이에 실린 낚시여행지를 한 곳씩 담은 건별 관광 콘텐츠로, 명칭·지역·주소·전화번호와 위치 좌표, 이용요금, 상세소개를 시도 범위에서 개별 주소·좌표 단위로 제공한다. 전남에서 낚시 여행지를 찾는 관광객이나 여행 앱 개발자가 '이 지역에 어떤 낚시터가 있고 연락처·요금은 어떤가'를 조회할 때 쓴다. 전역 조인 키가 없어 다른 관광 데이터와는 명칭·주소 매칭이나 같은 기관 데이터로만 연결하고, 상세 조회에 필요한 게시물번호(id)는 목록 조회에서 먼저 받아 넘긴다.
description_portal: 본 데이터는 전라남도 남도여행길잡이에서 제공하는 낚시여행 관광정보를 OpenAPI 형태로 개방한 데이터이다. 전라남도 내 지역별 낚시여행지 및 관련 관광정보를 제공하며, 낚시여행지의 명칭, 지역, 주소, 상세주소, 연락처, 위치 좌표(위도·경도), 이용요금, 상세소개, 이미지정보, 등록일시 및 수정일시 등의 정보를 포함하고 있다. 또한 키워드 검색과 지역 검색 기능을 지원하여 이용자가 원하는 낚시여행 정보를 효율적으로 조회할 수 있도록 구성되어 있으며, 관광객의 여행 편의 증진 및 지역 관광 활성화를 목적으로 제공되는 공공데이터이다.
team:
