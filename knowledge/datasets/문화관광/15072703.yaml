summary_user: 인천 미추홀구시설관리공단이 운영하는 국민체육센터의 수영 등 생활체육 프로그램을 강좌 단위로 담은 파일로, 유형·장소·정원·강습요일·시간·대상과 관내·관외 요금이 들어 있다(csv 약 7KB). 주민이나 이용자가 "평일 저녁 성인 수영 강좌가 있는지, 관외 거주자는 요금이 얼마인지"를 확인하거나, 분석가가 요일·시간대별 프로그램 배치와 관내·관외 요금 차이를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 센터·프로그램 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 인천광역시 미추홀구시설관리공단에서 운영하는 국민체육센터의 프로그램 정보를 제공합니다.해당 데이터는 수영을 포함한 다양한 생활체육 프로그램의 유형, 운영 장소, 강습 정원, 요일, 운영 시간, 대상, 요금 정보를 포함하고 있으며, 센터 이용자 안내, 프로그램 배치 계획 수립, 이용요금 비교 분석 등에 활용할 수 있습니다. 관내·관외 요금을 모두 제공하여 지역 주민 대상 요금체계 이해 및 행정 운영에도 도움이 됩니다.데이터 활용 - 국민체육센터 프로그램 안내 서비스 구축- 연령·시간대별 수요 분석을 통한 프로그램 개편-요일/정원/요금 기반 이용 패턴 분석-관내·관외 요금 비교를 통한 주민편익 정책 검토
