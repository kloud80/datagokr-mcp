summary_user: 서울특별시 마포구에서 성인게임장·오락실 등 게임물을 설치해 제공하는 일반게임제공업소를 업소 1곳당 1행으로 담은 인허가 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·좌표·시설 면적과 층수 등을 포함한다. 마포구에서 지금 영업 중인 게임장이 어디에 있는지, 최근 폐업한 업소가 얼마나 되는지를 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결한다.
description_portal: 서울특별시 마포구의 성인게임장, 오락실 등 청소년이용불가의 게임물과 전체이용가의 게임물을 설치하여 제공하는 업소정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 소재지우편번호, 지번주소 및 도로명주소, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명, 문화사업자구분명 등이 포함되어 있습니다. 이 데이터를 통해 시민은 합법적인 게임 시설을 이용할 수 있으며, 감독기관은 업소의 운영 실태를 파악하고 안전한 게임 환경을 조성할 수 있습니다.
