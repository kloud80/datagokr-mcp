summary_user: 한국도자재단이 보유한 경기도 내 요장(가마를 갖추고 도자기를 생산하는 공방)을 한 곳씩 담은 목록으로, 요장명·시군명·주소·위경도 좌표를 포함하며 이천·여주·용인 등 주요 도예지역이 중심이다. 관광객이나 교육 기획자가 "이천이나 여주에서 방문할 수 있는 도자기 공방은 어디에 있나"를 찾을 때, 분석가가 시군별 도예공방 분포를 볼 때 쓴다. 전역 조인 키는 없어 시군명(sigun_nm)이나 요장명으로 다른 경기도 데이터와 이름을 맞춰 잇고, 좌표가 있는 요장은 위경도로 지도 위에서 겹쳐 쓴다.
description_portal: 경기도 산하 공공기관인 한국도자재단이 보유한 경기도 내 요장의 분포 및 현황을 수록한 자료로, 요장명, 시군명, 상세 주소, 위치 좌표(경도, 위도) 등의 정보를 포함하고 있습니다. 요장은 도자기를 굽는 가마가 설치되어 있고 도자기 생산이 이루어지는 작업장으로 일반적으로 도예가들이 도자기를 만들고 가마에 구워 완성품을 생산하는 도자기 공방에 대한 정보입니다. 주요 도예지역인 이천, 여주, 용인 등을 중심으로 다양한 도예공방의 위치와 기본 정보가 제공되며, 도자기 산업 현황 분석, 문화 관광자원 개발, 공예산업 정책 수립 등에 활용될 수 있습니다. 도예작가 또는 요장을 대상으로 한 연구 및 산업 지원, 교육 콘텐츠 기획 자료로도 적합한 데이터입니다.* 일부 요장의 경우 상세주소를 제공하지 않아 위경도 값이 공란으로 표기됩니다.
