description_portal: '"서울시 서북권(마포구, 서대문구, 은평구) 공공도서관 15개관의  연간 대출 현황 정보* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함"공공도서관 KDC 분류별 연간 대출 현황 : 종건수, 책건수, 대출건수 및 각 비율(종비율, 책비율, 대출건수비율)을 기록한 자료공공도서관 소장처별 연간 대출 현황 : 공공도서관의 소장처 유형(자료실, 보존실 등)에 따른 종건수, 책건수, 대출건수 및 비율을 보여줍니다.'
