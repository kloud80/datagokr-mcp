description_portal: 광주광역시도시공사에서 운영하는 실내빙상장의 월별 이용객 수를 연령대별로 정리한 데이터입니다. 본 데이터는 구분, 성인, 청소년, 어린이, 월별 일일입장 인원, 데이터기준일자 항목으로 구성되어 있습니다. 실내빙상장 이용현황을 성인, 청소년, 어린이로 세분화하여 파악할 수 있으며, 월별 통계를 통해 계절별 이용 패턴이나 수요 변화 분석이 가능합니다. 데이터는 연령대별 입장 인원을 명확히 제공하여, 시설 운영 계획 수립이나 정책 평가 등에 기초자료로 활용할 수 있습니다. 또한, 시민의 여가활동 참여 수준과 생활체육 시설 이용 실태를 객관적으로 확인할 수 있도록 구성하였습니다. 항목별 정보는 체계적으로 정리되어 있으며, 검색과 활용 편의를 고려하여 설명과 키워드를 설계하였습니다. 데이터는 정기적으로 갱신되어 최신 정보를 반영합니다.
