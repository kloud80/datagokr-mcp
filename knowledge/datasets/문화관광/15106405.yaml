description_portal: 2021년 신산업 기반 문화공공데이터 개방 실적을 바탕으로, 전통유물과 실감형 3D 콘텐츠 24종에 대한 정보를 제공합니다. 각 데이터는 제목, 국적, 재질, 용도, 소장처, 원천유물 설명, 활용설명, 주소 등으로 구성되어 있어, 전통문화자원의 디지털화와 실감형 콘텐츠 개발에 활용할 수 있습니다. 특히 북한 민족악기 ‘단소’를 비롯한 다양한 유물의 상세 정보가 포함되어 있어, 문화유산 연구, 교육, 창작, 콘텐츠 산업 등에서 폭넓게 활용될 수 있습니다. 문화공공데이터의 개방 실적을 확인하고자 하는 분들에게도 유용합니다.
