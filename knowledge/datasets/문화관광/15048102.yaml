summary_user: 전북특별자치도 정읍시에 있는 민간 일반체육시설업(체육도장·골프연습장·체력단련장·당구장·볼링장·탁구장 등)을 업소 한 곳당 한 행으로 담은 파일로, 업종·상호·도로명주소·전화번호·관리부서·데이터기준일자를 담는다. 시민이 "우리 동네 근처 헬스장이나 탁구장이 어디 있나"를 찾거나, 분석가가 정읍시 안에서 업종별 체육시설 분포와 부족 지역을 살피는 데 쓴다. 인허가번호 같은 전역 조인 키가 없어서, 다른 데이터와는 도로명주소나 상호를 맞추거나 같은 기관(정읍시) 기준으로만 이어 쓴다.
description_portal: '전북특별자치도 정읍시 소재한 일반체육시설업 현황중 업종, 상호, 소재지도로명주소, 전화번호, 관리부서의 정보를 제공합니다.- 업종 : 승마장업, 체육도장업, 골프연습장업, 야구연습장업, 체력단련장업, 당구장업, 무도학원업, 볼링장업, 탁구장업, 에어로빅장업, 테니스장업체육시설 데이터 개방은 시민들의 시설 접근성 향상을 돕고, 지자체가 운동 인프라 부족 지역을 파악해 맞춤형 체육 정책을 수립하게 합니다. 또한 민간과 기업의 관련 서비스 개발과 시민들의 건강증진 프로그램 개선에도 활용되어 지역 체육 활성화를 촉진할 것으로 예상됩니다.'
