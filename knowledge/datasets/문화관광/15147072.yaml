summary_user: 서울 강서구의 체력단련장업(헬스장·PT센터·피트니스 클럽 등) 인허가를 업소 한 곳당 한 행으로 담은 원천 명부로, 인허가일·취소일, 영업 상태와 상세 상태, 폐업일, 휴업 기간, 소재지 지번·도로명 주소, 좌표, 사업장명, 시설 면적, 지도자 수 등을 포함한다. 창업 예정자나 상권 분석가가 '강서구에서 최근 헬스장이 어느 동네에 새로 생기고 어디서 문을 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·사업장명·주소를 이름 매핑하거나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 축의 상권·다른 체육시설업 인허가 데이터와 나란히 보는 용도에 맞다.
description_portal: 서울시 강서구 지역의 체력단련장업에 대한 인허가 현황을 담고 있으며, 헬스장, PT센터, 피트니스 클럽 등에서 운영되는 체력 단련시설의 행정정보를 포함하고 있습니다. 해당 업종은 지역주민의 건강 증진과 생활체육 참여 확대를 위해 중요한 역할을 하며, 운동시설의 확충과 접근성 향상을 위한 정책 수립에 기초자료로 활용될 수 있습니다. 본 데이터에는 사업자 등록번호, 인허가 일자, 영업 상태, 폐업 여부 등의 정보가 포함되어 있어 민간 체육시설 동향 파악, 건강 증진 사업 타당성 검토, 스포츠 산업 활성화 계획 수립 등에 기여할 수 있습니다. 특히 인허가 취소 및 폐업 데이터도 함께 제공되어, 업종 변화에 따른 수요예측에도 유용하게 활용됩니다.
