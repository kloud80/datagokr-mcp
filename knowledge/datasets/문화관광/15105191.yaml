summary_user: 경기도 주요관광지 방문객 실태조사에서 방문객을 세는 조사지점을 지점 한 곳당 한 행으로 정리한 목록으로, 지점명·조사위치·출구 개수·계수방법과 도로명·지번 주소를 담는다(파일 약 5KB 규모의 소량 CSV). 경기도 관광지 방문객 통계를 보는 분석가나 지자체 담당자가 "이 관광지 방문객 수는 어느 출입구에서 어떤 방식으로 셌는가"를 확인하는 데 쓴다. 관광지점코드·시군구코드 같은 공통 조인 키가 없으므로, 방문객 통계나 다른 관광지 데이터와는 지점명이나 주소를 맞춰서 이어 쓴다.
limits: 이 목록에는 방문객 수가 없고 조사지점의 위치와 계수 방식만 있어서, 방문객 규모나 추이는 별도의 실태조사 결과 데이터가 있어야 볼 수 있다. 실측 컬럼에서 공통 조인 키를 찾지 못했으므로 다른 데이터와 연결할 때는 지점명·주소 매핑 오류에 주의한다.
