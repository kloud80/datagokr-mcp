summary_user: 부산광역시에서 열리는 연극을 공연 한 건 단위로 담은 목록으로, 공연 제목, 공연 시작일·종료일, 공연장 이름, 유무료 여부를 담는다. 부산 시민이나 관광객이 '이번 달 부산에서 볼 수 있는 무료 연극이 어디서 하는가'를 찾거나, 문화 분야 분석가가 부산 지역 연극 공연 현황을 정리할 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다(KOPIS 공연ID·공연장ID 없음). 따라서 KOPIS 공연 목록이나 문화시설 데이터와는 공연 제목·공연장 이름(place_nm)을 문자열로 맞춰서만 이어 쓴다.
limits: 공연ID나 공연장 코드 같은 공통 키가 없어 다른 공연·시설 데이터와 정확히 연결하기 어렵고, 이름 기반 매칭은 수작업 검토가 필요하다. 갱신 주기는 이벤트성으로 분류돼 있어 정기적으로 최신 공연이 추가된다고 보장되지 않는다. 호출하려면 포털 활용신청 후 받은 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
