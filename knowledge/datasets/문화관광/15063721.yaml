description_portal: 다양한 문화 예술 활동 중 부산시에서 공연하는 연극목록 데이터를 개방합니다.연극은 무대에서 배우들이 대본에 따라, 때로는 즉흥적으로 대사를 주고 받고 감정과 행동을 표현하면서 이야기를 전달하는 공연예술의 한 형태입니다. 극장이나 공연장에서 관객앞에서 실시간으로 이루어지며 문학적 요소인 줄거리, 인물, 갈등 등과 시각적 요소인 무대, 조명, 의상 등이 합쳐져 있습니다.장르에 따라 희극(코미디), 비극, 역사극, 현대극 등으로 나뉘며 아주 다양한 스타일의 연극이 존재합니다.개방되는 데이터는 연극 공연 제목, 공연시작, 종료일, 공연장 명, 유무료 여부를 포함합니다.
