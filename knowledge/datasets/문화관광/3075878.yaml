description_portal: '부천시 문화강좌로 강좌명, 운영도서관,  대상, 접수 기간, 교육 기간, 정원 등 강좌예약시스템 내용을 제공합니다.강좌명: 강좌의 제목이나 이름입니다. 강좌의 주제를 쉽게 알 수 있도록 명시되어 있습니다.운영도서관: 강좌가 운영되는 장소, 즉 어느 도서관에서 강좌가 진행되는지 나타냅니다. 부천시 내 여러 도서관 중 특정 도서관 이름이 표기됩니다.대상: 강좌에 참여할 수 있는 사람들의 조건이나 연령대, 예를 들어 ‘초등학생 대상’, ‘성인 대상’, ‘가족 참여 가능’ 등입니다.접수 기간: 강좌 신청이 가능한 기간을 의미합니다. 접수가 시작되는 날짜와 마감 날짜가 포함되어, 언제까지 신청해야 하는지 알 수 있습니다.교육 기간: 실제 강좌가 진행되는 기간입니다. 수업이 시작하고 끝나는 날짜, 그리고 강좌가 열리는 요일과 시간대 등이 포함될 수 있습니다.정원: 강좌에 참여할 수 있는 최대 인원 수를 나타냅니다. 이 정보는 신청자가 빠르게 예약 여부를 판단하는 데 도움을 줍니다.'
