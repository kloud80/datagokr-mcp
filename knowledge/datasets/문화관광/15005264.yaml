summary_user: 세계 각국 박물관 등 소장 기관별로 한국문화재 소장 현황을 정리한 목록으로, 기관명(영문·한글)·국가와 함께 해당 기관의 한국문화재 페이지, 국립중앙박물관 웹진 기사, 국립문화재연구소 보고서 링크를 한 행씩 담는다(파일 크기 약 8KB의 소규모 CSV). 연구자나 교육·홍보 담당자가 '어느 나라 어떤 박물관에 한국문화재가 있고 관련 조사 보고서는 어디서 보나'를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 기관명이나 국가명을 이름으로 맞춰 연결해야 한다.
description_portal: 세계 각국의 유명 박물관이 소장하고 있는 한국문화재 정보를 온라인으로 열람할 수 있도록 제공하는 데이터입니다. 각 기관별로 소장된 한국문화재의 현황과 관련 링크, 현지 큐레이터의 해설, 국립중앙박물관 웹진 기사, 국립문화재연구소 보고서 등 다양한 자료를 포함하고 있습니다. 이를 통해 해외에 있는 한국문화재의 보존 상태와 전시 현황을 파악할 수 있으며, 국제적 문화 교류와 공동 연구에도 활용할 수 있습니다. 또한 학술 연구, 문화재 정책 수립, 해외 홍보, 교육 자료 제작 등 여러 분야에서 유용하게 쓰일 수 있으며, 전 세계에 흩어져 있는 우리 문화유산의 가치 확산과 보존 의식 제고에도 기여하는 중요한 자료입니다.
