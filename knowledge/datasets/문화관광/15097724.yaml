summary_user: 경상남도 내 마이스(MICE) 회의시설과 인프라시설의 운영정보를 시설 단위로 담은 CSV 파일(약 5.2MB)로, 시설명·시설구분·지역명과 함께 좌석수, 룸 개수·면적·최대수용인원, 회의 가능 여부와 회의기자재, 주차·와이파이·배리어프리·반려동물 입장·다국어 메뉴판·서비스 언어 등 편의 항목을 포함한다. 행사 기획자나 기업 담당자가 "경남에서 100명 이상 수용하고 회의기자재와 주차가 갖춰진 회의장은 어디인가" 같은 질문에 시설을 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광 콘텐츠 등 다른 데이터와는 시설명·지역명 매칭이나 인근 랜드마크 위경도를 이용한 위치 근접으로만 이어 쓴다.
limits: 공식 조인 키가 없어 다른 관광·시설 데이터와 연결하려면 이름·지역명 매칭을 따로 해야 한다. 좌표는 시설 자체가 아니라 인근 랜드마크의 위경도이므로 시설 위치로 그대로 쓰면 안 된다.
