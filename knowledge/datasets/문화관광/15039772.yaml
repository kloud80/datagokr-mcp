summary_user: 충청북도 제천시 안의 관광 레포츠 시설을 한 곳씩 명칭·주소·전화번호·홈페이지·데이터기준일로 정리한 작은 목록 파일(csv 약 1.3KB)이다. 제천에 놀러 가는 여행객이나 지역 여행 콘텐츠를 만드는 사업자가 '제천에서 즐길 수 있는 레포츠 시설이 어디 있고 연락처가 무엇인지' 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 TourAPI 레포츠 원장이나 다른 관광 데이터와 이으려면 시설 명칭이나 주소를 직접 맞춰야 한다.
description_portal: 해당 데이터는 충청북도 제천시의 관광레포츠이용안내를 정리한 데이터입니다. 명칭, 주소, 전화번호, 홈페이지, 데이터기준일자 등의 정보를 포함하고 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 충청북도 제천시의 관광레포츠이용안내의 이용정보 등은, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 12월 29일입니다. 담당부서는 제천시 문화복지국의 관광과이며 문의주시면 최신의 충청북도 제천시 관광레포츠 이용안내를 열람하실 수 있게 도와드립니다.
