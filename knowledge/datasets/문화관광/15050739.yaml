summary_user: KTV 국민방송 문화교양 프로그램의 방송 영상을 한 건씩 담은 목록으로, 콘텐츠별 제목·프로그램명·회차·방송일·조회수·재생시간·영상 링크와 섬네일 주소를 담는다(포털 CSV 파일 약 17.5MB). 문화교양 방송을 찾아보려는 시청자나 미디어 분석가가 "어느 프로그램의 어느 회차가 조회수가 높았나"를 따질 때 쓴다. 다른 데이터와 이어 쓸 전역 조인 키는 없고, 프로그램 단위로 묶을 때는 이 파일 안의 프로그램 식별자(프로그램아이디)나 카테고리를 쓰며 외부 데이터와는 프로그램명 같은 이름 매칭이나 같은 기관 데이터로만 연결한다.
description_portal: KTV 국민방송에서 제공하는 문화교양 프로그램의 방송 목록을 한눈에 확인할 수 있는 데이터셋입니다. 각 프로그램의 제목, 프로그램명, 방송일, 회차, 조회수, 영상 링크, 섬네일 주소 등 주요 정보와 함께 방송별 상세 정보, 재생시간, 등록일 등의 항목도 포함되어 있습니다. 이를 통해 문화와 교양에 관심 있는 국민들이 원하는 방송을 쉽게 검색하고 시청할 수 있으며, 교육 자료 제작, 문화 콘텐츠 연구, 미디어 트렌드 분석 등 다양한 분야에서 활용이 가능합니다. 또한 해당 데이터는 프로그램별 시청 패턴 분석, 콘텐츠 기획, 맞춤형 추천 서비스 개발 등에도 유용한 기초 자료로 쓰입니다.
