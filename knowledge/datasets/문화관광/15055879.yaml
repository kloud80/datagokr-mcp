description_portal: '인천광역시의 신고등록 체육시설 현황 공공데이터는 시내에 신고 및 등록된 체육시설의 개수를 군/구별, 시설 유형별로 집계한 통계 자료입니다. 이 데이터는 지역 체육 인프라의 규모 및 분포를 파악하고, 체육 시설 확충 계획, 생활 체육 진흥 정책, 지역 주민의 체육 활동 접근성 개선 등의 기초 자료로 활용됩니다.*체육시설종류: 빙상장, 승마장, 종합체육시설, 수영장, 체육도장, 골프연습장, 가상체험체육시설, 야구장 ,체력단련장, 당구장, 썰매장 등 여러 종류의 정보를 제공하고 있습니다.해당 데이터는 공공데이터포털에서 확인할 수 있습니다.'
