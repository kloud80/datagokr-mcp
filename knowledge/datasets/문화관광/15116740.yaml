summary_user: 구로구 안 일반야영장(캠핑장)의 인허가 현황을 사업장 한 건씩 담은 원천 목록으로, 인허가·취소·휴폐업 일자, 영업상태, 지번·도로명 주소, 좌표, 시설면적 등을 포함한다. 구로구에서 지금 영업 중인 캠핑장이 어디에 있고 언제 허가됐는지 확인하거나, 안전점검·관광 정책을 위해 야영장 공급 현황을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 자치구·업종 인허가 자료와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 일반야영장업 인허가 정보는 구로구에서 텐트를 설치하고 야외 숙박·휴식을 제공하는 일반야영장(캠핑장)의 인허가 현황을 관리하기 위한 데이터이다. 인허가일자, 영업상태명, 소재지주소, 시설면적, 야영 사이트 수, 부대시설 내역 등이 포함되어 있어, 자연친화 여가공간의 공급 수준과 시설 안전성을 동시에 파악할 수 있다. 일반야영장은 화재·안전사고·환경오염과 밀접하게 연관되므로, 이 자료는 안전점검 계획 수립, 환경관리, 이용객 수용률 분석, 휴양·관광 정책 설계에 직접적으로 활용된다. 또한 시설면적과 부대시설 정보는 가족·청소년 대상 프로그램 구성, 지역축제 연계 등 문화·관광 정책에도 중요한 기초가 된다.
