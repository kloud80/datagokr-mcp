summary_user: 경기도 시군별로 운영 중인 문화관광 해설사 현황을 담으며, 시군 단위로 기준연도(SUM_YY), 시군명, 해설대상지 현황, 문의 연락처를 정리한 운영 현황 자료다. 관광객이 '우리 동네나 여행지 시군에서 해설사를 어디서 어떻게 신청하나'를 확인하거나, 분석가가 시군별 해설 인프라 분포를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으므로, 다른 데이터와는 시군명이나 시군 코드(SIGUN_CD)를 이름·코드 매핑해 경기도 내 시군 단위로 연결한다.
description_portal: 이 데이터는 경기도 각 시군에서 운영 중인 문화관광 해설사 현황에 대한 정보를 제공하며, 시군명, 해설대상지 현황, 해설사 문의 연락처 등의 항목으로 구성되어 있습니다. 문화유산, 관광지, 지역 명소 등을 대상으로 활동하는 해설사의 운영 정보를 통해, 지역별 관광서비스 인프라 현황을 파악할 수 있으며, 관광정책 수립, 해설인력 배치계획, 지역 문화자원 홍보 등에 활용할 수 있습니다. 본 데이터는 Open API를 통해 XML 또는 JSON 형식으로 제공되며, 연간 단위로 갱신됩니다. 특히, 해설대상지에 대한 구체적인 설명과 연락처 정보는 이용자의 관광계획 수립과 현장 접점 활용에 도움이 됩니다.
