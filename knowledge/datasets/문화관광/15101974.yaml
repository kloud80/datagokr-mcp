summary_user: 코리아둘레길 트래킹 코스를 코스 단위로 담은 API로, 코스명·거리·소요시간·난이도·시군·GPX 파일 경로와 주변 관광정보를 제공하며 전체 139건, 전국 범위다. 걷기 여행자나 앱 개발자가 '이 코스는 얼마나 걸리고 난이도는 어떤가, GPX는 어디서 받나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 코스 인덱스(routeIdx, crsIdx)나 이름·코드 매핑, 같은 기관(한국관광공사) 코드로만 이어 쓴다.
limits: 전역에서 통용되는 조인 키가 없어 타 기관 데이터와는 이름·코드 매핑이 필요하다. 포털 설명의 284개 코스와 실측 전체 건수 139건이 다르므로 건수 해석에 유의하고, 개발계정은 일 1,000회로 호출이 제한된다. 실측 최신 행 날짜는 2026-07-27이며 검증 호출 조건에 따른 값이라 데이터가 오래됐다고 단정할 수 없다.
