summary_user: 국가유산청이 제공하는 국가민속문화유산 정보를 재난안전데이터 공유플랫폼을 거쳐 유산 한 건씩 담으며, 지정일자·유산명·시대·분류·지정번호·소재지와 좌표(XCRD·YCRD)가 들어 있고 범위는 전국이다. 문화유산 분석가나 지자체 담당자가 어느 지역에 어떤 시대·분류의 국가민속문화유산이 언제 지정됐는지 파악하거나 지도에 표시하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 국가유산청 자체 API나 다른 유산 목록과는 지정번호(DSGN_NO)·유산명 매핑으로 연결하고, 공간 연계는 좌표나 소재지 문자열로 한다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국가유산청에서 제공하고 있는 국가민속문화유산 정보입니다.
