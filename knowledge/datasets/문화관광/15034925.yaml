summary_user: 광주 서구에서 영업 중인 골프연습장을 사업체 한 곳당 한 행으로 담은 명부 파일이며, 상호·도로명주소·전화번호·시설면적·최초등록일자를 포함한다(CSV 약 3KB 규모). 주민이나 창업 예정자가 서구에 골프연습장이 어디에 몇 곳 있고 언제 등록됐는지, 시설 규모는 어느 정도인지를 확인하는 데 쓴다. 전역 조인 키나 인허가번호는 없으므로, 다른 체육시설업 명부나 상권 데이터와는 상호·도로명주소를 맞춰 보거나 같은 기관 자료끼리 이어 쓴다.
limits: 인허가번호·사업자번호 같은 공통 키가 없어 다른 데이터와 자동으로 정확히 연결하기 어렵다. 범위는 서구 한 곳뿐이어서 광주 전체나 다른 자치구와 비교하려면 각 구의 자료를 따로 모아야 한다.
