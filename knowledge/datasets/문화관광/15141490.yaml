summary_user: 종로구 청소년게임제공업소의 인허가 행정정보를 업소 한 곳당 한 행으로 담는 건별 원천 데이터로, 관리번호·인허가일자·인허가취소일자·영업상태·폐업일자·소재지 주소·좌표·시설면적·층수 같은 시설 항목이 들어 있다. 종로구 안에서 현재 영업 중인 청소년게임장이 어디에 몇 곳 있고 언제 개설·폐업했는지 확인하려는 주민·창업자나 청소년 여가 정책 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(지방자치단체코드)로만 이어 쓴다.
description_portal: 본 데이터는 종로구 내 청소년게임제공업소에 대한 인허가 행정정보를 담고 있습니다. 청소년게임제공업은 일반적으로 PC방, 키오스크형 게임 시설 등 청소년에게 건전한 오락을 제공하는 업소를 말하며, 청소년보호법 및 게임산업진흥에 관한 법률에 따라 지정된 기준을 충족해야 운영이 가능합니다. 본 데이터는 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등으로 구성되며, 업소의 개설·폐업·영업정지 등 행정 이력을 확인할 수 있습니다. 청소년 여가 정책 수립, 지역 내 게임문화 분석, 인허가 절차 연구 등에 유용한 기반 자료입니다.
