summary_user: 전라남도 해남군 안의 국가지정·도지정·군지정 유산을 한 건씩 담은 목록으로, 명칭·지정구분·분류·지정번호·수량·면적·소유자·소재지·지정일을 담는다(포털 설명 기준 2026년 4월 128건). 주민이나 여행자, 지역 분석가가 해남에 어떤 국보·보물·천연기념물·향토문화유산이 어디에 있고 언제 지정됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서 국가유산청 자체 목록이나 API와는 유산 명칭·지정번호를 손으로 맞춰 이어야 하고, 위치 연결은 소재지 주소를 기준으로 한다.
description_portal: 전라남도 해남군의 국가유산 현황 정보에 대한 데이터입니다.이 데이터에는 국가유산의 명칭, 상세, 지정번호, 지정구분, 분류, 수량, 면적, 소유자, 소재지, 지정일 등의 항목을 제공합니다.26년 4월 기준 총 128건의 국가유산이 있습니다. - 국가지정 41종, 도지정 47, 군지정 40종 - 국가지정문화유산으로  국보 2종, 보물 20종, 사적 9종, 국가지정자연유산 천연기념물 4종, 명승 2종, 국가무형유산 1종, 국가민속유산 2종, 국가등록유산 1종 - 전라남도지정으로 유형문화유산 12종, 무형유산 3종, 전라남도 기념물 15종, 전라남도 민속문화유산 1종, 문화유산자료 11종  - 해남군 지정 향토문화유산 40종
