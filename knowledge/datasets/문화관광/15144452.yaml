description_portal: '대전컨벤션센터 내 보유한 전시 및 회의시설의 공간별 정보로, 시설의 위치, 용도, 명칭, 면적 등 기본 현황을 제공하는 데이터입니다. 공간의 활용 목적(전시/회의), 시설 통합 여부 등 세부 구성 정보를 포함하고 있어, 대관 관리 및 공간 활용 기획, 행사 기획 시 유용하게 활용될 수 있습니다.○ 연번: 데이터 식별을 위한 일련번호○ 위치: 제1전시장 등 시설의 주요 공간 단위○ 시설구분: 전시홀, 회의실 등 공간 용도 분류○ 시설명: 호수 또는 병합된 공간명칭(예: 109호 전시홀, 109~112호 전시홀)○ 면적: 각 공간의 면적(㎡ 기준)- 데이터 특이사항전시홀은 단일 호실뿐 아니라 복수 호실(예: 109~112호) 병합 공간의 정보도 포함되어 있어, 공간 구성 유연성 및 병합 사용 가능 여부를 확인할 수 있습니다.회의실의 경우도 개별 호실 외에 통합형 회의실 정보가 포함되어 있어 대형 세미나 등 다목적 활용이 가능합니다.면적 기준은 정형화된 시설 기준으로, 실제 좌석 수용 가능 인원은 배치 방식(강의형, 연회형 등)에 따라 달라질 수 있습니다.본 데이터는 대전컨벤션센터 공식 도면 및 대관 시스템 기준으로 작성된 정규 정보이며, 공간 변경 또는 리모델링 등으로 향후 변동될 수 있습니다.상세 좌석 배치, 설비 유무(빔, 음향 등), 대관 가능 시간 등은 별도 운영기관(대전관광공사 또는 대전컨벤션센터) 문의 필요.'
