description_portal: '518자유공원에서 실시하고 역사체험 정보 - 법정.영창체험 시설견학 : 영상자료 관람 및 역사체험시설 관람 - 오월나눔의 주먹밥 체험 : 대동정신과 오월정신을 대표하는 주먹밥 만들기 체험 - 법정 영창 상황재현극 : 80년 당시 법정.영창에서의 구속, 재판과정 등 상황재현극 체험 - 5.18 역사체험은 민주주의의 소중함을 직접 느끼게 하여 시민의식을 키움. -현장을 체험함으로써 교과서에서 배운 내용을 더 깊이 이해하고 공감함. -역사 왜곡을 막고 올바른 역사 인식을 다음 세대에 전달하는 데 중요한 역할을 함.'
