summary_user: 제주 난미밭담길 무장애 여행코스의 지점 정보를 지점별(순서·위도·경도·구분·설명·상세정보)로 담고, 전체코스 여부와 추천코스 여부를 표시한다. 휠체어 이용자나 교통약자, 그 동행자가 "난미밭담길에서 주차장·화장실·휴식 지점이 어디에 있고 어떤 순서로 걸으면 되나"를 확인하거나, 지자체가 열린관광지 조성을 검토할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 지점 이름이나 좌표(위도·경도)로 직접 맞춰 이어 써야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_난미밭담길_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 소재 ‘난미밭담길’의 무장애 여행 코스 정보를 제공합니다. 해당 코스는 밭담으로 둘러싸인 농촌마을 경관을 따라 걷기 편하게 설계된 이동 동선, 접근 가능한 휴식 및 전망 지점, 휠체어 이용자 및 교통약자를 위한 편의시설 정보(주차장·화장실 포함)를 포함하고 있습니다. 노면 상태, 경사도, 보행환경 등의 현장 요소가 반영되어 있으며, 무장애 관광환경 조성, 열린관광지 개발, 관광 서비스 개선 및 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
