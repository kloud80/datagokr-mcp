summary_user: 경기도 내 음반·음악영상물 배급업체의 인허가 현황을 사업장 1곳당 1행으로 담는 건별 원천 데이터로, 시군·사업장명·인허가일자·영업상태·폐업일자·주소와 WGS84 좌표·시설면적·층수 등을 포함한다. 음악 유통 사업자나 문화산업 분석가가 "우리 시군에 영업 중인 음반 배급업체가 몇 곳이고 어디에 있는가"를 확인하거나 폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)·시군명이나 주소·좌표로 경기도의 다른 업종 인허가 데이터 또는 행정구역 자료와 이름·위치 기준으로 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 음반 및 음악영상물 배급업체의 인허가 현황을 제공하며, 배급업체는 음반이나 음악영상물을 수입하거나 저작권을 보유·관리하여 판매업자 또는 온라인음악서비스 제공업체에 공급하는 사업체를 포함합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘WGS84 위도·경도’, ‘업태구분명’, ‘문화체육업종명’, ‘총층수’, ‘시설면적’, ‘편의시설여부’, ‘소방시설여부’ 등이 포함되어 있습니다. 이를 통해 각 배급업체의 위치, 운영 상태, 시설 및 안전설비 현황을 종합적으로 파악할 수 있으며, 경기도 31개 시군 단위의 배급업 분포 현황을 확인할 수 있습니다. 데이터는 문화산업 정책 수립, 지역 배급망 관리, 콘텐츠 산업 분석, 유통 구조 개선 연구 등에 활용될 수 있으며, 음악 및 영상 배급업계의 성장 추세 파악과 서비스 품질 향상에도 기여할 수 있습니다.
