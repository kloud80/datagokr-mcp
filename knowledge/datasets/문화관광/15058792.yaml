summary_user: 경기도 시군에 있는 승마장업체의 인허가 현황을 업체 한 곳당 한 행으로 담은 건별 명부로, 사업장명·인허가일자·영업상태·폐업일자·주소·위경도·지도자 수·회원모집 인원·건축물 연면적·보험가입 여부 등을 포함한다. 승마 체험 사업을 검토하는 사업자나 지역 분석가가 "우리 시군에 지금 영업 중인 승마장은 몇 곳이고 어디에 있는가"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시군코드(SIGUN_CD)·사업장명·주소 매칭으로 잇고, 위경도로 다른 체육시설업 명부나 상권 데이터와 공간적으로 겹쳐 본다.
description_portal: 이 데이터는 경기도 31개 시군에 위치한 승마장업체의 인허가 현황을 제공하는 자료로, 말타기 체험을 제공하는 체육시설에 대한 정보를 포함합니다. 총 32개 항목으로 구성되며, 사업장명, 인허가일자, 영업상태, 폐업일자, 주소, 위치정보(WGS84 위도·경도 포함), 지도자 수, 회원모집 인원, 건축물 연면적 및 동수, 보험가입 여부, 업태구분명, 세부업종명 등이 포함됩니다. 이 자료는 지역 내 이색 체육시설 분포 파악, 체험형 체육시설 정책 수립, 공간정보 분석 등에 활용 가능하며, 행정안전부가 주간 단위로 갱신하여 Open API를 통해 제공하고 있어 데이터 활용의 범용성이 높습니다.
