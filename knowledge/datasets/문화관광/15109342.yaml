summary_user: 제주 마을별 관광지(테마파크·오름·숲길·동굴·해변·곶자왈 등) 정보를 관광지 한 곳당 한 행으로 담은 파일로, 검증 시 381행을 받았다. 제주 마을관광 코스를 짜려는 여행자나 지역 관광 분석가가 마을별로 어떤 관광지가 있고 요금·휴무일·주차 여건이 어떤지 찾는 데 쓴다. 도로명주소·지번주소와 위도·경도가 조인 키라서 다른 관광지·지도·주소 데이터와 주소나 좌표로 이어 쓴다.
description_portal: 제주관광공사_마을관광지 데이터는 2022년 공공데이터 뉴딜 사업의 일환으로 구축된 제주 마을관광 정보 데이터 입니다. 제주도 내 각 마을별로 위치한 테마파크, 오름, 숲길, 동굴, 해변, 곶자왈 등 관광지 정보를 포함하고 있습니다. 데이터에는 마을명, 관광지유형, 시군구명, 읍면동명, 행정리명, 관광지명, 소재지도로명주소, 소재지지번주소, 위도와 경도, 면적, 지정일자, 수용인원수, 주차가능수, 관광지소개, 휴무일, 요금정보, 주요목적, 편의시설, 관리기관명, 관리기관전화번호, 데이터기준일자 등의 항목을 제공합니다.
