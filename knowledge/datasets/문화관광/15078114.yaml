summary_user: 여성사전시관이 소장·관리하는 도서를 한 권 단위로 담은 목록으로, 도서명·저자명·출판사명·출판연도와 데이터 기준일자를 제공하며 범위는 전국·비공간입니다. 여성사 관련 자료를 찾는 연구자나 이용자가 특정 저자나 주제의 책이 여성사전시관에 있는지, 어느 시기에 출판된 책들인지 확인하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서관·서지 데이터와는 도서명·저자명·출판사명 문자열 매칭으로만 연결한다.
limits: ISBN 등 공통 식별자가 없어 국가서지나 도서관정보나루 데이터와 정확히 일치시키기 어렵고, 이름 매칭 시 표기 차이에 주의해야 한다. 개발계정은 하루 5,000회 호출로 제한된다.
