description_portal: 서울시 동상 현황 데이터는 서울시 전역에 설치된 동상의 분포와 특성을 체계적으로 관리하기 위해 구축된 공공데이터입니다. 이 데이터에는 각 동상의 이름을 나타내는 작품명, 동상이 설치된 시점을 알 수 있는 설치연도, 그리고 동상이 위치한 장소를 확인할 수 있는 작품주소와 상세주소 정보가 포함되어 있습니다. 이를 통해 시민은 특정 동상의 위치를 쉽게 찾을 수 있고, 행정기관은 자치구별·지역별 동상 분포를 공간적으로 분석할 수 있습니다. 또한 동상의 설치와 관리에 관여하는 기관 정보를 함께 제공함으로써, 어느 기관이 해당 동상의 설치를 주관하거나 관리·협력에 참여했는지 파악할 수 있도록 구성되어 있습니다.
