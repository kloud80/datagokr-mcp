summary_user: 김해시 공립 제1종 전문박물관인 김해목재문화박물관의 이용객 수를 연도·월 단위로 집계한 파일로, 시설명·박물관미술관 구분·도로명주소·전화번호와 함께 담는다. 지역 문화시설 담당자나 분석가가 "이 박물관의 월별 방문객이 계절·연도에 따라 어떻게 달라지나"를 살피는 데 쓴다. 전역 조인 키는 없으므로 다른 문화시설·박물관 데이터와는 시설명이나 도로명주소로 맞춰 이어 쓴다.
limits: 실측 컬럼에 문화시설코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소 매핑으로만 연결된다. 한 시설의 월별 합계만 담아 개인 속성이나 시간대별 방문 분포는 알 수 없다.
