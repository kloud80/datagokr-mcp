summary_user: 강원특별자치도 동해안 6개 시군(강릉·동해·속초·삼척·고성·양양)의 해양레저관광시설과 주변 숙박·음식점·카페 등 시설을 시설 한 건씩 담은 파일로, 시설명·업종·주소와 위도·경도 좌표를 포함한다. 동해안 여행객이나 지역 관광 분석가가 "양양·속초 해변 주변에 해양레저시설과 숙박·음식점이 어디에 몰려 있는가"처럼 시설 밀집도와 수용 여건을 지도에서 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 관광 데이터와는 시설명·주소로 맞추거나, 시군구·읍면동 이름 또는 좌표 기반 공간 결합으로 이어 쓴다.
limits: TourAPI의 contentId나 표준 지역코드 같은 공통 키가 없어 다른 데이터와 연결하려면 이름·주소 매핑이 필요하다. 범위는 강원 동해안 시군의 개별 시설 주소·좌표에 한정되며, 이 분류에서는 보조 등급으로 TourAPI 관광 콘텐츠를 대표 원장으로 두고 있다.
