description_portal: 'o 강원특별자치도 동해안의 중요,관심 해양레저관광시설 데이터 및 콘텐츠 현황/ 지역별 해양레저관광시설 밀집 정보 분석, 지역별 해양레저관광시설 관광객 수용 정보 분석 데이터를 제공합니다.  - 주요제공현황 : 시설명, 업종(일반, 해양레저), 위도, 경도, 주소, 지번주소, 시군구읍면동 등- 제공시설현황 : 해양레저관광시설 (일반시설 , 해양레저시설 ), 주변시설 (마트 2개, 숙박 107개, 야외시설 2개, 음식점 214개, 절 1, 카페 74개)- 자료수집방법 : 6개 시군을 대상으로 자료 취합 후 제공* 해양레저관광시설 및 주변 관광시설이 필요하신 분은 6개 시군(강릉, 동해,속초,삼척,고성,양양) 관광과로 문의하시기 바랍니다.'
