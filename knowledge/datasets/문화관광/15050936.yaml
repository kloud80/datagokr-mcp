summary_user: 세종특별자치시에 등록된 영화상영관 6곳을 한 행씩 담은 파일로, 상영관명과 도로명주소·지번주소, 등록기준일을 담는다. 세종시 주민이나 문화시설 분석가가 '세종시 안에 영화관(자동차극장 포함)이 어디에 몇 곳 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상영관명이나 주소를 기준으로 맞춰 이어야 한다.
description_portal: 세종특별자치시에 소재하는 영화상영관에 대한 정보를 제공합니다.데이터는 상영관명, 도로명주소, 지번주소, 등록기준일로 구성되어 있으며,세종특별자치시에는 총 6개의 영화상영관이 등록되어 있습니다.CGV 세종(세종특별자치시 도움1로 108), 메가박스 세종나성(세종특별자치시 나성로 38), 메가박스 세종청사(세종특별자치시 도움3로 19),메가박스 세종조치원(세종특별자치시 새내로 122), 세종자동차극장(세종특별자치시 대평동 261-4번지 ), 초이자동차극장(세종특별자치시 대교해솔1길 2)이 있습니다.이 데이터는 세종특별자치시 문화체육관광국 문화예술과에서 관리하고 있는 데이터입니다.
