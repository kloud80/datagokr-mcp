description_portal: 이 데이터는 서울특별시 광진구 관내에서 비디오물시청제공업 인허가를 받아 운영 중인 업소 현황을 나타내는 공공데이터입니다. 비디오물시청제공업은 숙박, 휴게, 오락 등의 목적으로 이용되는 장소나 시설에서 영화, 영상물 등을 시청할 수 있도록 관련 기자재를 갖추어 제공하는 업종을 의미합니다. 주로 비디오방, 멀티방 등의 형태로 운영되며, 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등의 정보가 포함되어 있습니다. 이는 지역 내 영상 콘텐츠 소비 공간의 분포, 이용 형태, 위생 및 청소년 보호 등 관련 행정 관리에 유용한 기초 자료로 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않아 지도 시스템 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준 자료로 정기적으로 갱신되며, 관련 정책 수립 및 영업 현황 분석에 활용할 수 있습니다.
