description_portal: '서울시 한강사업본부에서 제공하는 2009년~2013년, 2017년 한강공원 이용객 현황 정보입니다. 서울시 한강공원의 다양한 이용객 유형과 활동을 세분화해 보여주며, 이용 패턴 분석, 시설 개선, 행사 기획 등 공원 운영 및 관리에 필요한 통계 자료로 활용할 수 있습니다.강서, 난지, 망원, 양화, 여의도, 이촌, 반포, 잠원, 뚝섬, 잠실, 광나루의 일반이용자, 운동시설, 자전거, 주요행사 및 마라톤, 특화공원, 기타 이용객 현황을 제공합니다.년도: 데이터가 수집된 연도를 나타내며, 시간에 따른 변화 추이를 분석할 수 있습니다.구분: 한강공원 이용객을 구분하는 항목으로 보이며, 데이터 내 세부 항목에 따라 이용객의 성격이나 목적별로 분류할 수 있습니다.일반이용자: 특별한 시설이나 이벤트와 무관하게 일반적으로 공원을 방문한 이용객 수를 의미합니다.운동시설: 운동 목적으로 공원 내 운동시설을 이용한 사람들의 수입니다.자전거: 자전거 이용객 수로, 한강공원 내 자전거 관련 활동 인원을 나타냅니다.주요행사 및 마라톤: 공원에서 열린 대규모 행사나 마라톤 참가자 수를 집계한 항목입니다.특화공원: 특정 테마나 특화된 시설을 가진 공원의 이용객 수를 뜻합니다.기타: 위 항목에 포함되지 않는 기타 이용객을 나타냅니다.합계: 각 항목의 이용객 수를 모두 더한 총 이용객 수를 의미합니다.'
