summary_user: 서울 강서구 종합체육시설업(수영·헬스 등 복합 체육시설) 사업장별 인허가 현황을 건별로 담으며, 인허가일·취소일, 영업상태와 상세영업상태, 폐업일, 휴업 기간, 소재지 지번·도로명 주소, 사업장명, 좌표(X, Y)를 포함한다. 주민이나 상권 분석가가 '강서구에서 지금 영업 중인 종합체육시설은 어디이고 최근 폐업한 곳은 어디인가'처럼 시설 위치와 개폐업 흐름을 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
description_portal: 서울시 강서구 내 종합체육시설업에 대한 인허가 현황을 담고 있습니다. 종합체육시설은 수영, 헬스, 체력단련 등 다양한 체육 활동을 복합적으로 제공하는 공간으로, 지역주민의 건강 증진과 여가생활 향상에 중요한 역할을 합니다. 본 데이터에는 사업장별 인허가일, 폐업 여부, 영업상태, 상세영업상태 등이 포함되어 있어 행정기관의 정책 수립, 공공체육시설 확충, 민간시설 관리 및 통계 기반 분석 등에 활용될 수 있습니다. 특히 건강 도시 구현, 생활체육 활성화 전략 수립 등 정책 목적의 기초자료로 유용합니다.
