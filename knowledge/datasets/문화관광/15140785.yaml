summary_user: 광진구 내 태권도·검도·유도·합기도 등 체육도장업 업소를 한 곳씩 담은 인허가 명부로, 업소명, 지번·도로명 주소, 인허가·취소·폐업 일자, 영업상태, 중부원점TM 좌표(X, Y) 등을 담는다. 사업자나 분석가가 광진구 동네별로 체육도장이 얼마나 영업 중이고 언제 개업·폐업했는지를 확인해 상권이나 학원가 경쟁 상황을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 관리번호(MGTNO)나 자치단체 코드(OPNSFTEAMCODE)처럼 같은 체계의 코드, 또는 업소명·주소 매칭으로 잇는다.
description_portal: 서울특별시 광진구_체육도장업 인허가 정보는 광진구 내에서 태권도, 검도, 유도, 합기도 등 무도와 체육활동을 통해 신체 및 정신을 단련시키는 체육도장 형태의 업소에 대한 인허가 현황을 포함한 데이터입니다. 체육도장업은 청소년 및 성인을 대상으로 한 규칙적인 운동 및 무술 지도를 목적으로 하며, 체계적인 훈련과 더불어 건강 증진 및 인성 교육을 함께 추구합니다. 본 데이터에는 업소명, 사업장 주소, 인허가 일자, 운영 형태, 업종 구분 등의 항목이 포함되며, 관내 체육시설 분포 및 정책 수립에 필요한 기초자료로 활용될 수 있습니다. 좌표 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위경도 값은 포함되지 않습니다. 제공되는 데이터는 최신 인허가 현황을 반영한 3일 전 기준 자료입니다.
