summary_user: 대구광역시 북구 관내에 등록된 종합여행업(구 일반여행업) 사업체를 한 곳씩 담은 건별 원천 데이터로, 상호·도로명주소·전화번호·직종명을 제공한다. 북구에서 해외·국내 여행을 모두 취급하는 여행사를 찾는 주민이나, 관내 종합여행업체의 수와 사무실 분포를 파악하려는 분석가가 쓴다. 실측 컬럼에 등록번호·사업자번호 같은 전역 조인 키가 없어, 다른 관광사업 등록 데이터와는 상호나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 위 데이터는 대구광역시 북구 관내의 종합여행업=구 일반여행업(직종명, 상호, 도로명주소, 전화번호 등)의 정보를 포함하고 있습니다.입력 파라미터 이용하여 대구광역시_북구청_종합여행업의 정보를 조회할 수 있도록 구성되어 있는 파일입니다.또한 위 데이터로 관내의 종합여행업의 수, 위치, 사무실 주소 등을 파악할 수 있으니 데이터 이용 시 참고 부탁드립니다.데이터 이용 범위의 제한은 없으나 정보 이용 시 최대 동시 요청 수의 제한이 있으니 위 정보 접속 시에 이를 참고하여 이용해주시기를 바랍니다.
