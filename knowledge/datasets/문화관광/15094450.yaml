description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 체육 관련 뉴스 메타정보 자료입니다. 체육은 국가 경쟁력 강화와 국민 건강 증진에 중요한 역할을 하며, 엘리트 스포츠 성과뿐만 아니라 생활 체육 활성화, 스포츠 인권 보장, 체육 인프라 확충 등 다양한 영역에서 사회적 관심을 받아왔습니다. 본 자료는 국내 주요 신문과 방송 보도에서 체육과 관련된 기사들을 분석해 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 논의 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 국제 스포츠 경기 성과, 체육 정책 방향, 선수 인권 문제, 국민 체력 증진을 위한 제도적 지원 등이 언론 담론에서 어떻게 다루어졌는지를 객관적으로 파악할 수 있습니다. 또한 학술 연구, 체육 정책 수립, 스포츠 산업 분석, 교육 현장 등 다양한 분야에서 활용할 수 있는 기초 자료로, 한국 사회에서 체육이 지니는 의미와 발전 과정을 다각도로 이해하는 데 도움을 줍니다.
