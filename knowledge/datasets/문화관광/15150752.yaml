summary_user: 비짓제주에 올라간 관광 콘텐츠 한 건마다 관리자가 붙인 3단계 분류(1·2·3단계 카테고리)를 콘텐츠명과 함께 담은 분류표 파일입니다. 제주 관광 서비스를 만드는 사업자나 분석가가 비짓제주 콘텐츠가 어떤 주제·계층으로 나뉘어 있고 분류별로 몇 건인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 등 다른 관광 데이터와는 콘텐츠명 같은 이름 매칭이나 같은 기관(제주관광공사)의 비짓제주 콘텐츠 데이터와 맞춰 이어 쓴다.
