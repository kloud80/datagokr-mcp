summary_user: 경기도 내 일반 유원시설업체를 사업장 한 곳당 한 행으로 담은 인허가 원장으로, 시군·사업장명·인허가일자·영업상태·폐업일자와 도로명·지번 주소, WGS84 좌표, 놀이시설 수·시설규모·부대시설 내역을 개별 시설 단위로 담는다. 관광 분석가나 지자체 담당자가 '우리 시군에 현재 영업 중인 놀이기구 시설이 어디에 몇 곳 있고 규모는 어떤가'를 확인하거나 지도에 분포를 그리는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명이나 주소·좌표, 사업장명 매칭으로 다른 경기도 관광사업 등록 데이터나 행정구역 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 일반 유원시설업체의 인허가 현황을 제공하며, 안전성 검사 대상의 놀이기구 한 종류 이상을 갖추어 관광객에게 서비스를 제공하는 시설 정보를 담고 있습니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘WGS84 위도·경도’, ‘업태구분명’, ‘문화체육업종명’, ‘놀이시설수’, ‘놀이기구수내역’, ‘좌석수’, ‘시설규모’, ‘자본금’, ‘보험기관명 및 보험기간’, ‘방송시설·발전시설·의무실·안내소 보유 여부’ 등이 포함됩니다. 이를 통해 각 시설의 위치, 운영 현황, 규모, 안전설비, 보험 가입 현황 및 부대시설 정보를 종합적으로 파악할 수 있습니다. 데이터는 경기도 31개 시군 단위로 제공되며, 관광산업 분석, 안전 관리 정책 수립, 지역별 유원시설 분포 연구에 유용하게 활용될 수 있습니다. 또한 시설 운영의 안전성 검토, 여가·관광 트렌드 파악, 투자 및 지역 개발 전략 수립의 기초자료로도 활용할 수 있습니다.
