description_portal: 클래식(Classic)은 일반적으로 서양 전통 음악을 의미하지만, 상황에 따라 더 넓은 의미로 사용되기도 합니다. 보통 우리가 말하는 클래식은 중세부터 현대에 이르기까지 서양 음악사 속에서 형성된 예술 음악을 말합니다개방되는 데이터는 일반 시민을 위한 서비스가 아닌, 공공데이터 포털을 통해 제공되는 데이터 API(Application Programming Interface) 서비스입니다. 즉, 클래식 공연 정보를 직접 검색하고 볼 수 있는 웹사이트가 아니라, 개발자들이 오페라 관련 애플리케이션이나 서비스를 만들 때 활용할 수 있는 원천 데이터를 제공합니다.부산에서 열리는 클래식 공연에 대한 상세 정보를 포함합니다. 공연제목, 공연기간, 오픈런 여부, 공연장명, 유무료 등
