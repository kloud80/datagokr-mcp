summary_user: 부산에서 열리는 클래식 공연을 공연 한 건 단위로 담은 상세 정보 API로, 공연제목·공연기간(시작·종료일)·오픈런 여부·공연장명·관람등급·러닝타임·출연진·가격·공연시간 등을 제공한다. 부산 시민이나 공연 안내 앱 개발자가 "이번 달 부산에서 볼 수 있는 클래식 공연은 어디서, 언제, 얼마에 하나"를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고 공연장 식별값(place_id)과 공연장명이 있지만 KOPIS 공연ID·공연장ID와 같은 체계인지 확인되지 않아, 다른 공연·시설 데이터와는 공연장명·공연제목 매핑으로 연결한다.
limits: KOPIS 공연ID 같은 전역 키가 없어 KOPIS 예매·매출 데이터와 직접 조인할 수 없고 이름 매칭에 의존해야 한다. 이벤트성으로 생성된 뒤 갱신되지 않는 주기로 분류되어 있어 최신 공연 목록이 계속 반영된다고 가정하면 안 된다. 개발계정은 일 10,000회 호출로 제한된다.
