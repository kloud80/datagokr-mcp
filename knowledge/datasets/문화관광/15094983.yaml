summary_user: 빅카인즈(BIGKinds)에서 모은 대통령 관련 뉴스 기사를 기사 한 건씩 담은 메타데이터 파일로, 일자·언론사·제목·통합분류·키워드·특성추출 등이 들어 있으며 전국 범위의 비공간 자료다(CSV 약 121MB). 정치·언론 연구자나 분석가가 "정권 교체 시기나 주요 외교 일정 전후로 언론사별 대통령 보도량과 주제가 어떻게 달라졌나" 같은 질문에 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키는 없어서, 일자나 언론사 이름, 키워드 같은 텍스트 값으로 맞춰 다른 빅카인즈 주제별 메타데이터나 일정 자료와 붙여 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름이나 날짜를 매칭해서만 연결한다. 지역 단위 분석은 할 수 없다(전국·비공간). 파일 용량이 커서(약 121MB) 내려받은 뒤 나눠서 파싱해야 할 수 있다.
