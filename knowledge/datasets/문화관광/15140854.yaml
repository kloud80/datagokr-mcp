summary_user: 서울 광진구에서 청소년게임제공업(인형뽑기방·일반 오락실 등 전체이용가 게임시설) 인허가를 받은 업소를 업소 한 곳당 한 행으로 담는 건별 인허가 원천 데이터로, 업소명·주소·인허가일자·폐업일자·영업상태·시설면적·층수·방 수 등 시설 정보를 포함하고 범위는 광진구 한 곳입니다. 주민이나 창업 예정자, 청소년 보호 정책 담당자가 '광진구에서 지금 영업 중인 인형뽑기방·오락실은 어디에 몇 곳 있고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소(지번·도로명)나 업소명을 맞춰 연결하고, 다른 자치구의 같은 업종 인허가 데이터와는 같은 컬럼 구조를 기준으로 합쳐 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 청소년게임제공업 인허가를 받은 업소 현황을 제공하는 공공데이터입니다. 주요 업종에는 인형뽑기방, 일반 오락실 등 전체이용가 게임물을 설치·운영하는 업소가 포함되며, 청소년을 포함한 모든 연령층이 이용 가능한 게임시설을 제공하는 사업체를 대상으로 합니다. 데이터에는 업소명, 소재지, 업종유형, 인허가일자 등 주요 항목이 포함되어 있어, 관내 게임제공업의 운영 분포 및 시설 특성을 파악하는 데 유용합니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계를 기반으로 제공되며, 위도·경도(WGS84) 좌표는 제공되지 않으므로 지도 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준으로 정기 갱신되며, 게임물관리, 청소년 보호 정책, 지역 여가문화 시설 현황 분석 등 다양한 분야에서 활용 가능한 자료입니다.
