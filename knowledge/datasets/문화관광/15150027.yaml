summary_user: 대전광역시 중구 안의 문화재를 한 건씩 담은 목록 파일로, 문화재명·지정 종류(종별)·지정일·설명·규모·조성시기와 주소·위도·경도를 담는다. 주민이나 관광·지역사 분석가가 "중구에 있는 시도지정 문화재는 어디에 있고 언제 지정됐나"를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키나 국가유산청 종목코드·지정번호가 없어서, 다른 데이터와는 문화재명·주소로 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구의 문화재 정보(문화재명, 종별, 지정일, 내용, 위도, 경도, 규모, 조성시기, 주소, 상세주소 등)입니다.대전광역시 중구 홈페이지에 축적된 자료를 기반으로 개방되었습니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 "내용"은 해당 문화재에 대한 설명을 담고 있습니다.종별을 통해 문화재 지정 종류를 확인하고 지정일 또한 확인하실 수 있습니다.해당 공공데이터와 관련하여 문의사항이 있을 경우, 담당부서로 연락주시기 바랍니다.
