summary_user: 국립공원 안의 재해위험지구(산사태·낙석·침수 등)를 지점 한 곳당 한 행으로 담은 공간 원천 파일로, 각 지점의 명칭·위험유형·GIS 위치와 소속 국립공원·관리사무소를 담는다(CSV 약 11.9KB, 전국 국립공원 대상). 탐방객 안전 담당자나 등산 앱 개발자가 '이 탐방로 주변에 낙석·산사태 위험지역이 어디 있나'를 지도에 표시하거나 사고 예방 계획을 세울 때 쓴다. 국립공원코드(npark_cd)와 사무소코드(npark_dept_cd)로 국립공원공단의 다른 공간데이터(탐방로·시설 등)와 이어 쓰고, 고유번호(npark_gis_obj_id)로 지점을 식별한다.
description_portal: 본 데이터는 국립공원 내 재해위험지구에 대한 공간정보 자료로, 국립공원공단에서 운영하는 ‘국립공원 재난안전 스마트플랫폼’을 통해 관리되고 있습니다. 데이터는 각 위험지역의 명칭, 유형(산사태, 낙석, 침수 등), 위치 좌표(위도·경도), 고도, 위험등급, 관리주체, 관리상태 등 재난안전자원에 대한 속성 정보를 포함하고 있으며, CSV 포맷으로 제공됩니다. 이 자료는 국립공원 내 탐방객 안전관리, 사고 예방 시스템 구축, 응급 대응 체계 수립, 재난 예·경보시스템 설계, 공공 안전지도 서비스 개발 등에 활용될 수 있습니다. 민간 지도 API(Naver, Daum 등)와의 연계를 통해 시각적 표출이 가능하며, 정기적인 갱신과 위치 기반 분석에 적합하도록 구조화되어 있습니다.
