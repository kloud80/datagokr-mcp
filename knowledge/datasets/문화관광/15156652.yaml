summary_user: 인문네트워크에서 운영하는 인문프로그램을 프로그램 한 건 단위로 담으며, 프로그램명·분류·분야·운영방법, 시작·종료일과 수강신청 기간, 운영 시설, 활동지역(시도·시군구)을 포함하고 범위는 전국 시군구 단위다. 내 지역에서 지금 신청할 수 있는 인문강좌가 무엇인지 찾는 국민이나, 지역·분야별 인문프로그램 운영 현황을 비교하려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 활동지역 시도·시군구명이나 시설명 같은 이름 매핑으로만 잇고, 프로그램·지원사업·시설 일련번호는 이 서비스 안에서만 통하는 내부 번호다.
limits: 다른 기관 데이터와 직접 연결되는 공통 키가 없어 지역명·시설명 문자열로 맞춰야 한다. 갱신 성격이 이벤트형(생성 후 불변)으로 분류돼 있어 상태값이나 신청 현황이 실시간으로 바뀐다고 가정하지 말고 호출 시점의 값으로 해석해야 한다.
