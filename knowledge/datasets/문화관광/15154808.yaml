summary_user: 전국 자치단체가 관리하는 한옥체험업 인허가 정보를 사업장 단위 건별로 담으며, 전체 3,197건에 인허가일자·영업상태·객실수·주소·좌표 등이 있다. 한옥 숙박 시설이 지역별로 몇 곳 영업 중인지, 객실 규모가 어느 정도인지 살피려는 분석가나 여행 사업자가 쓴다. 도로명주소·지번주소·영문상호주소(address) 키로 다른 숙박업 인허가 데이터나 주소 기반 데이터와 이어 쓰며, 개방자치단체코드(OPN_ATMY_GRP_CD)로 지자체별 구분도 한다.
description_portal: '문화_한옥체험업 데이터는 우리나라 고유의 형식으로 지은 한옥에 숙박 체험하기에 적합한 시설을 갖추어 관광객에게 이용을 제공하는 업체 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 한옥체험업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광산업진흥과 / 044-203-2837, 2838 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
