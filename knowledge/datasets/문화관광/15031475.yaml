summary_user: 성남아트센터에서 열린 전시를 한 건씩 담은 파일로, 전시명(국문·영문), 기획·대관 구분, 카테고리, 시작일·종료일, 전시장소, 입장 연령, 관람 시간, 티켓 가격을 담는다. 시민이나 방문객이 '이번 달 성남아트센터에서 열리는 전시는 무엇이고 요금과 관람 연령은 어떤가'를 확인하거나, 분석가가 기획전과 대관전의 비중·기간을 살펴보는 데 쓴다. 전역 조인 키(공연시설 코드, KOPIS ID 등)가 없어 다른 데이터와는 전시명·장소 이름을 맞추거나 같은 성남시 기관 자료끼리만 이어 쓴다.
description_portal: 남아트센터 전시정보 데이터는 성남아트센터에서 개최되는 다양한 전시회에 대한 세부 정보를 포함한 자료로, 주최기관, 전시명, 일정, 장소, 작품 소개, 관람 요금, 사전 예약 정보, 관람 가능 연령 등의 항목으로 구성됩니다. 이 데이터는 시민과 방문객에게 문화예술 향유 기회를 제공하고, 전시 홍보 및 지역 문화 활성화를 목적으로 운영됩니다.예를 들어, 전시 일정은 시작일과 종료일로 구성되어 관람 계획 수립에 활용될 수 있습니다. 성남문화재단 또는 아트센터 공식 홈페이지, 문화포털, 지역 문화시설 데이터 허브를 통해 수집 가능하며, 데이터 기반 문화정책 수립에도 유용하게 활용될 수 있습니다.
