summary_user: 구미시 관내에 소재한 문화재를 한 건씩 담은 목록으로, 종류·종별·지정번호·문화재명·소재지·소유자·지정일을 문화재 단위로 제공한다. 시민·연구자·관광 기획자가 '구미시에 어떤 지정 문화재가 어디에 있고 누가 소유하며 언제 지정됐나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 국가유산청 API 등 다른 유산 데이터와는 지정번호(appn_no)·문화재명·종별을 이름 매핑해 잇는다.
limits: 국가유산청 체계의 종목코드·지정번호 코드나 소재지 PNU 같은 공통 키가 없으므로, 다른 데이터와 연결할 때는 이름·지정번호 문자열 매칭에 의존한다. 범위는 구미시 한 곳에 한정되고, 관람·행사·관리 정보는 담지 않는다.
