description_portal: 서산시에 소재한 각종 종교시설의 현황 정보를 제공하는 데이터이다. 본 데이터는 기독교, 불교, 신천지, 이슬람, 천주교 등 다양한 종교구분별 시설 정보를 포함한다. 각 종교시설의 정확한 시설명과 도로명주소를 상세히 수록하여 시민들이 종교활동 장소를 쉽게 찾을 수 있도록 지원한다. 서산시 관내 종교시설 분포 현황을 파악하고 종교 다양성을 확인할 수 있는 기초자료로 활용된다. 종교시설 이용을 희망하는 시민, 종교 관련 연구자, 지역사회 분석 기관 등에서 유용하게 사용할 수 있다. 정확하고 최신의 종교시설 정보를 통해 서산시민의 종교생활 편의를 도모하고 지역 내 종교문화 이해 증진에 기여한다.
