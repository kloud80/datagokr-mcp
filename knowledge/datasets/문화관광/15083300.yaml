limits: 국가유산청 표준 종목코드·지정번호 체계나 필지 고유번호(PNU) 같은 공통 키가 실측 컬럼에 없어, 다른 데이터와는 이름·번호를 수작업으로 맞춰야 한다. 범위는 청양군 한 곳뿐이다.
