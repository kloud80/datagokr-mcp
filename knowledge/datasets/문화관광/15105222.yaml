summary_user: 국립중앙박물관과 국립지방박물관에서 열리는 교육·문화행사를 행사 한 건씩 담은 데이터로, 제목·설명·기간·장소·유료 여부(charge)·문의처·이미지·동영상 정보를 포함하며 범위는 전국이다. 주말에 가까운 국립박물관에서 무료로 참여할 수 있는 체험 프로그램이 있는지 찾는 시민이나, 지역별 박물관 행사 운영 현황을 비교하는 기획자·연구자가 쓴다. 실측 컬럼에 공연·문화시설 공통 키가 없어 다른 문화시설·행사 데이터와는 기관명·장소명을 이름으로 맞추는 방식으로만 이어 쓴다.
description_portal: 국립중앙박물관과 전국 13개 국립지방박물관에서 진행되는 다양한 교육 및 문화행사 정보를 한눈에 확인할 수 있도록 통합 제공하는 데이터셋입니다. 연계기관ID, 자원명, 기관명, 행사 제목, 설명, 기간, 장소, 유료/무료 여부, 문의 안내 등 주요 정보를 포함하고 있어, 박물관 방문을 계획하는 시민이나 문화행사 기획자, 연구자 등에게 유용하게 활용될 수 있습니다. 각 행사별 상세 정보와 이미지, 동영상 자료도 함께 제공되어 박물관의 다양한 프로그램을 쉽게 비교·검색할 수 있으며, 문화예술 체험 기회 확대와 지역 문화 활성화에 기여합니다.
