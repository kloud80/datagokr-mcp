summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU)에 등록된 축제·행사 콘텐츠를 건별로 담은 파일로, 행사명·시작일·종료일·시작·종료시간·요금·주최·주관·후원 정보가 들어 있다(포털 설명 기준 792건). 제주 여행을 계획하는 관광객이나 분석가가 '특정 주말·계절에 제주에서 열리는 축제와 입장 요금은 무엇인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 행사 정보 등 다른 데이터와는 행사명·기간을 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 축제행사콘텐츠 내역입니다.- 해당 데이터는 운영자가 비짓제주 관리자페이지에서 축제/행사 정보를 입력할 때 저장하여 생성합니다.- 개방데이터 항목은 콘텐츠명, 시작일, 종료일, 시작시간, 종료시간, 요금, 주최자이며 전체 데이터 수는 792건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 축제 및 행사 정보의 신뢰성 강화, 관광객 편의성 증진, 맞춤형 축제 추천 서비스 제공, 관광객 유입 및 지역경제 활성화, 마케팅 및 홍보 전략 수립, 관광 콘텐츠 다양성 확보 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
