description_portal: 이 데이터는 온라인면세점 관리자시스템에서 기획전을 등록할 때 생성되는 ‘기획전’ 관련 정보입니다. 총 646건의 데이터로 구성되어 있으며, 주요 항목은 기획전아이디, 기획전이름, 디바이스타입, 시작일자, 종료일자, 노출여부, 링크타입컴퓨터, 링크타입모바일, 할인전사용여부, 전관사용여부, 앵커사용여부, 등록일시, 수정일시, 명품관기획전여부 등입니다. 기획전 등록 시 할인행사 연계 여부, 노출 디바이스에 따른 링크 설정, 전관행사 여부 등을 선택하여 입력하면 데이터가 생성됩니다. 이 데이터는 다양한 유형의 프로모션 기획과 운영 현황을 체계적으로 관리하고, 사용자의 접속 환경에 맞춰 맞춤형 콘텐츠를 제공하기 위한 기반 자료로 활용됩니다. 이를 통해 기획전별 운영 성과 분석, 채널별 반응 비교, 할인 및 노출 전략 수립 등이 가능하며, 고객 맞춤형 마케팅 및 명품관 전용 프로모션 설계 등에도 활용되어 전체적인 판매 효율과 고객 만족도를 높일 수 있습니다.
