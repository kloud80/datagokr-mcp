summary_user: 제주관광공사 온라인면세점의 상품 카테고리를 대분류·중분류·소분류 체계로 한 행씩 담은 코드표 파일이며, 포털 설명 기준 총 106건이고 위치 정보는 없습니다. 면세점 상품 데이터를 분석하는 사람이 '이 상품 코드는 어느 대분류·중분류에 속하나'를 확인하거나 카테고리 구조를 재구성할 때 쓴다. 상위카테고리코드를 같은 파일의 아이디에 연결하면 계층 트리를 만들 수 있으나, 다른 기관 데이터와 잇는 전역 조인 키는 없어 같은 기관의 상품 데이터와 카테고리 코드나 이름으로만 연결한다.
description_portal: 온라인면세점 시스템의 카테고리 데이터는 상품을 적절하게 사이트에 노출하고 고객이 원하는 상품을 쉽게 탐색할 수 있도록 대분류, 중분류, 소분류 체계로 구성해 생성·관리되는 자료입니다. 데이터는 카테고리코드, 카테고리명, 상위카테고리코드, 카테고리유형, 정렬순서, 카테고리전시여부, 유의어, 등록일시, 수정일시 항목으로 구성되며 총 106건이 제공됩니다. 이를 통해 운영자는 상품 전시와 분류를 효율적으로 관리할 수 있고, 고객은 직관적인 탐색 경험을 얻을 수 있습니다. 또한 카테고리 데이터는 상품 관리 체계화, 검색 편의성 향상, 맞춤형 마케팅 전략 수립, 온라인면세점 경쟁력 강화 및 관광객 만족도 제고에 중요한 역할을 합니다.
