description_portal: '"제주특별자치도 내 한국 관광 인지도 조사-외국인이 관광 목적지로 제주도를 연상하는 비율 데이터를 제공합니다.항목: 연도, 국가, 연상 관광 목적지, 비율 등* 한국 관광 인지도 조사(Korea Tourism Awareness Survey)에 포함된 항목 중, 외국인 관광객들이 한국을 방문할 때 ‘관광 목적지로서 제주특별자치도’를 연상하는 비율을 연도별로 제공하는 통계자료입니다. 외국인의 인식 조사를 통해 제주가 한국 내 관광지로서 어느 정도 머릿속 연상도(브랜드 이미지)를 가지고 있는지 파악할 수 있으며, 연도 간 변화 추이를 통해 제주 관광의 국제적 인지도 및 매력도, 마케팅 효과 등을 측정할 수 있습니다.* 활용 분야 : 관광 브랜딩 및 홍보 전략 수립, 연도별 인식 변화 추이 파악 등"'
