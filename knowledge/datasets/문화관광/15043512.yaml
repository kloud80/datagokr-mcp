summary_user: 제주 싱계물해양공원 한 곳의 무장애여행 정보를 지점별로 담은 원천 데이터로, 아이디와 위도·경도·해발고도 좌표가 들어 있고 범위는 시도 단위이며 위치는 개별 좌표로 표시된다. 휠체어 이용자나 고령자, 유아 동반 가족이 싱계물해양공원에서 어느 지점을 거쳐 이동하는지 지도에 표시하려는 관광 안내·지도 서비스 개발자가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, TourAPI 관광지 목록 같은 다른 데이터와는 장소 이름을 맞추거나 좌표를 비교해서만 이을 수 있다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 싱계물해양공원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 제주특별자치도에서 제공하는 본 데이터셋은 싱계물해양공원의 무장애 여행 정보를 담고 있으며, 위도-경도 좌표, 관광지 명칭, 장소 설명 및 이미지 자료를 포함한다. 본 데이터는 장애인, 고령자, 유아동반가족 등 이동 약자를 고려한 무장애 관광지 정보를 제공하며, 관광 안내, 지도 서비스, 무장애 관광지 홍보 및 정책 수립, 열린관광지 조성 등 공공 및 관광 분야에서 기초 자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
