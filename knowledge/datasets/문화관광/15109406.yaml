summary_user: 경주시가 운영하거나 지원하는 교육강좌를 강좌 한 건 단위로 담은 API로, 강좌명·강좌 분류·교육기관·강의 기간·교육 시간·접수 기간·장소·연락처 등을 제공한다. 경주 시민이 '지금 접수 중인 평생교육·문화강좌가 무엇이고 언제 어디서 열리는가'를 찾거나, 평생학습 앱이 강좌 일정을 연동하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 강좌명·기관명·장소명 같은 이름 매칭이나 같은 경주시 기관 데이터로만 이어 쓴다.
description_portal: 본 오픈API는 경주시에서 운영하거나 지원하는 교육강좌 개설 현황 정보를 REST 형식으로 제공한다. 강좌별로 강의명, 교육기관, 운영기간, 수강료, 강의내용, 신청방법, 장소, 연락처 등이 포함되어 있으며, 시민이 평생교육 및 문화강좌 정보를 탐색하고 활용할 수 있도록 구성되어 있다. 이를 통해 외부 시스템이나 모바일 앱에서 교육 정보를 연계 활용할 수 있어 접근성과 편의성이 향상된다. 본 데이터는 평생학습 서비스, 강좌 추천 시스템, 일정 연동, 맞춤형 콘텐츠 등 다양한 분야에 활용된다. 또한 표준화된 데이터 구조로 제공되어 개발자와 일반 사용자 모두 편리하게 사용할 수 있으며, 공공데이터포털을 통해 무료로 접근·조회 가능한 공공서비스 데이터이다.
