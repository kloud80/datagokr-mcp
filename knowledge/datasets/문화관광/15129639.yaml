description_portal: 국가유산진흥원은 국가유산의 전승, 보급, 활용을 위해 다양한 활동을 펼치고 있습니다. 그 중 하나로 국가유산도서를 무료로 이용할 수 있도록 제공하고 있습니다. 국가유산도서를 선택하여 [장바구니]에 담아 신청하실 수 있으며, PDF로도 다운로드할 수 있습니다. 한 아이디당 신청 가능한 권수는 신청 건당 최대 10권, 도서 1종당 최대 2권으로 제한되며, 신청한 도서는 마이페이지에서 확인하실 수 있습니다. 이용하고자 하는 도서의 PDF 등 자료는 상세화면의 공공누리 표시에 따라 이용할 수 있습니다1. 국가유산진흥원은 국가유산의 가치와 중요성을 널리 알리고, 문화유산을 사랑하는 분들에게 즐거움을 제공하고 있습니다.
