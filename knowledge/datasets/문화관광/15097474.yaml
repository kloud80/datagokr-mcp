summary_user: 제주 서귀포 사계마을과 형제해안로 구간의 무장애 여행 정보를 포인트별로 담은 파일로, 구분·유형·추천여부·비고 항목과 코스 개요, 주차장·화장실 등 편의시설, 휴무일·관람료 같은 운영 정보를 함께 제공한다. 장애인·고령자·교통약자나 이들을 돕는 여행 서비스 개발자가 '이 해안 코스에 휠체어로 갈 만한 주차장과 화장실이 있는가'를 여행 전에 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 장소 이름이나 주소를 맞춰 연결해야 한다.
description_portal: '제주특별자치도 내 사계마을과형제해안로_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도_사계마을과형제해안로_무장애여행관광정보」로, 제주특별자치도 디지털혁신과가 제공하는 무장애 여행관광 안내 자료이다. 사계마을 및 형제해안로 구간에 대해 코스 개요, 주소, 주차장 및 화장실 등 편의시설 현황, 운영 정보(휴무일, 관람료 등), 그리고 주차장·화장실 등의 각 포인트별 사진 이미지 등이 포함되어 있다. 이 자료는 장애인, 고령자, 교통약자 등이 여행 전에 시설 접근성 및 경로 상태를 사전에 파악하여 보다 안전하고 쾌적한 여행 계획을 수립할 수 있게 돕는 것을 목적으로 한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
