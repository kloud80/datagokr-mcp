description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 그리스신화박물관은 제주 제주시 한림읍 광산로 942에 위치한 체험형 미술관으로, 고대 그리스 신화를 주제로 루브르나 바티칸 등에 소장된 명화와 대리석 조각상을 재현한 약 200여 점의 전시물을 갖추고 있으며, 관람객이 직접 그리스 의상을 입어 보는 체험, 올림포스 12신 가면 만들기, 신화 속 인물이 되어보는 포토존 등 다양한 상호작용 전시를 제공하고 무장애 접근을 고려해 장애인 전용 주차장, 무단차 출입구, 휠체어 및 유모차 대여, 장애인 화장실 등 편의시설이 갖춰져 있어 교통약자나 가족 단위 방문객도 편안하게 이용 가능한 열린문화 공간이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
