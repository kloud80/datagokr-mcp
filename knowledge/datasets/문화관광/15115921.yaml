summary_user: 서울 강서구의 복합유통게임제공업소를 업소별로 담은 인허가 원천 데이터로, 인허가일자·폐업일자, 영업상태와 세부 상태, 사업장명, 지번·도로명 주소, 좌표, 시설면적·층수·방 개수 같은 시설 정보가 들어 있다. 강서구에 지금 영업 중인 복합유통게임업소가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 알고 싶은 주민·창업자·상권 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)·지자체 코드로만 이어 쓰고, 좌표(X·Y)로 지도 위에 겹쳐 볼 수 있다.
description_portal: 서울특별시 강서구 내 이러한 복합 업종에 대한 인허가 정보를 제공하며, 인허가일자, 현재 영업상태, 사업장명, 소재지 주소 등의 기본 정보를 포함합니다. 복합유통게임제공업은 인터넷컴퓨터게임시설제공업 또는 기타 업종과 동일한 장소에서 함께 운영되는 업소 유형으로, 게임과 관련된 다양한 콘텐츠 및 서비스가 결합되어 있는 것이 특징입니다. 이를 통해 관내 게임 관련 복합시설의 분포 현황을 파악하고, 업종 특성 및 지역 상권과의 연계 가능성을 분석할 수 있는 기초자료로 활용할 수 있습니다. 특히 문화콘텐츠, 청소년 이용시설, 여가산업 등과 관련된 정책 수립 및 민간 활용에도 유의미한 정보를 제공합니다.
