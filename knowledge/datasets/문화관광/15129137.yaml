description_portal: 광주광역시 남구 관내 비디오물 제작업소 현황 및 정보(상호명, 소재지도로명주소, 소재지지번주소, 취급 · 제작 품목, 영업상태 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 문화관광과(☎062-607-2323)에서 제공하며, 60개소의 비디오물 제작업소 외에 배급업소 3개소, 감상실업소 1개소가 같이 포함되어 있는 점 참고 부탁드립니다. ※ 비디오물 관련 업종은 영화, 드라마, 광고, 교육 영상, 행사 기록 등 다양한 영상을 기획·촬영·편집해 제작하는 사업을 말합니다. 이 업종에는 개인 스튜디오부터 방송국, 영상 전문 회사까지 포함되며, 제작된 영상은 방송, 영화관, 온라인 플랫폼(유튜브, OTT 등), 교육 기관 등 여러 경로로 유통됩니다. 또한 단순 촬영뿐 아니라 후반 작업(편집, 색보정, 특수효과)과 기획·각본 제작까지 담당하기도 합니다.
