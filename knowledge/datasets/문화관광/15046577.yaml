description_portal: '○ 통계개요* 통계명 : 도서관 현황* 통계종류 : 서울시 도서관 현황을 관종별로 제공하는 일반ㆍ보고통계* 작성목적 : 서울시 각 구의 관종별 도서관 현황에 대한 정보를 제공하여 도서관정책 및 연구 지원을 위한 기초 자료를 제공하는 것을 목적으로 함* 조사체계 : 한국도서관협회* 공표주기 : 정기(매년)* 공표범위 : 지역 - 자치구 및 도서관내용 - 관종별(국립/공공/대학/전문) 도서관 현황○ 용어설명* 공공도서관 : 공중의 정보이용, 문화활동, 독서활동 및 평생교육을 위하여 국가또는 지방자치단체가 설립한 도서관 및 공중에게 개방할 목적으로 민간기관 및단체가 설립한 도서관(※도서관법 제2조 4항)* 대학도서관 : 고등교육법 제2조의 규정에 따른 대학 및 다른 법률의 규정에 따라설립된 대학 교육과정 이상의 교육기관에서 교수와 학생에게 제공할 목적으로설립한 도서관* 전문도서관 : 해당 설립기관ㆍ단체의 소속 직원 또는 공중에게 특정 분야에 관한전문적인 도서관 서비스를 제공하는 것을 주된 목적으로 하는 도서관○ 기 타* 학교도서관은 제외* 국립도서관은 국립중앙도서관, 국회도서관, 법원도서관* 2007년 12월 기준 통계부터 "전국도서관통계조사"(문화체육관광부)통계적용 이전 데이터는 국립중앙도서관에서 실시한 통계적용(2007. 공공도서관 607개관)'
