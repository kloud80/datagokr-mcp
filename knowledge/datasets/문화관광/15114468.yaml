summary_user: 경주시 문화관광 사이트에 올라간 테마별 숙박업소를 업소 한 곳당 한 건으로 담고, 이름·분류(CODE_NAME)·주소·위도경도·연락처·주차·예약링크·홈페이지 같은 안내 정보를 함께 제공한다. 경주 여행객이나 여행 앱 개발자가 '경주에서 주차되는 한옥체험 숙소는 어디 있나'처럼 테마와 위치로 숙소를 찾을 때 쓴다. 전역 조인 키는 없어서, 다른 숙박·관광 데이터와는 업소명·주소로 맞추거나 좌표로 지도에 겹쳐 쓴다.
description_portal: 본 오픈API는 경주시의 관광 수요에 맞춰 제공되는 테마별 숙박업소 정보를 REST형식으로 제공한다. 숙소별로 업소명, 분류, 주소, 연락처, 주차 가능 여부, 테마 유형 등 다양한 정보가 포함되어 있으며, 여행객이 주제별 숙박지를 쉽게 탐색할 수 있도록 구성되어 있다. 이를 통해 외부 시스템이나 앱에서 숙박 정보를 연계 활용할 수 있으며, 관광객의 편의성과 접근성이 높아진다. 본 데이터는 지역관광 연계 서비스, 숙소 검색 플랫폼, 여행 콘텐츠 개발 등 다양한 분야에서 활용된다. 또한 표준화된 데이터 구조로 제공되어 개발자와 일반 사용자 모두 편리하게 사용할 수 있으며, 공공데이터포털을 통해 무료로 접근·조회 가능한 공공서비스 데이터이다.
team:
