summary_user: 전국 자치단체가 관리하는 종합여행업 인허가 정보를 사업장 단위로 취합한 API로, 사업장명·인허가일자·영업상태·주소·좌표를 담고 전체 19,938건이다. 여행사의 영업·폐업 여부나 소재지를 확인하려는 국민·사업자·분석가의 질문에 쓴다. 사업자등록번호(BRNO)와 지번·도로명·영문 주소 필드를 키로 삼아 다른 사업자·주소 기반 데이터와 이어 쓴다.
description_portal: '문화_종합여행업 데이터는 국내 또는 국외를 여행하는 내국인 및 외국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 종합여행업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 국제관광서비스과 / 044-203-2893'
