description_portal: '본 데이터는 제주특별자치도 제주시에서 직접 주관하거나 지원·관리하는 각종 체육대회의 개최 현황을 수록한 자료입니다. 지역 주민의 건강 증진과 생활체육 활성화, 체육문화 진흥을 목적으로 운영되는 체육행사의 정보를 체계적으로 관리하고 있으며, 행정 계획 수립과 대회 운영의 투명성 제고를 위한 기초자료로 활용됩니다.주요 항목대회명: 개최된 체육대회의 공식 명칭주최: 대회를 주관하거나 후원한 기관 또는 단체명시작기간 / 종료기간: 체육대회가 실제로 개최된 기간(연·월·일 기준)장소: 대회가 개최된 체육시설 또는 지역 명칭참여인원: 해당 대회에 참여한 선수 및 관계자 등 전체 참가 인원 수활용 목적이 데이터는 지역 체육 행사 운영 현황을 분석하고, 향후 대회 유치, 예산 집행, 체육 인프라 확충 등 정책 수립에 활용되며, 제주시에서 수집·관리하며 정기적으로 갱신됩니다.'
