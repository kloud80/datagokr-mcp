summary_user: 부산광역시 동구에 있는 외국인전용 유흥음식점업 업소를 한 행씩 담은 소규모 목록 파일(CSV 약 1.3KB)로, 업종·상호·도로명 소재지·전화번호를 담는다. 동구에서 외국인 대상 관광 편의시설로 지정된 유흥음식점이 어디에 있고 연락처가 무엇인지 확인하려는 관광객 안내 담당자나 지역 관광업 현황을 정리하는 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·주소를 맞춰 보거나 같은 기관 데이터끼리만 이어 쓴다.
description_portal: '본 데이터는 「관광진흥법」 및 동법 시행령에 의거하여, 외국인이 이용하기 적합한 시설을 갖추고 주류 및 음식 등을 제공하거나 노래와 춤을 감상하게 하는 "외국인전용유흥음식점업"의 지정 및 운영 현황을 제공합니다. 이는 일반 식품위생법상 유흥주점과는 구별되는 관광 편의시설업의 일종입니다. 법적 근거: 관광진흥법 제3조(관광사업의 종류) 및 동법 시행령 제2조입니다.부산광역시 동구 소재 외국인 전용 유흥 음식점업 현황에 대한 데이터로 해당 업체의 상호명,  주소, 연락처 등을 제공합니다.         사업장 대표자 성명 등 개인 식별 가능 정보는 비식별 조치 후 제공됩니다.'
