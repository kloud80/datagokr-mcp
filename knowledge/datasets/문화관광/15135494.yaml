summary_user: 광주광역시립도서관 홈페이지에서 희망도서 신청 때 네이버 도서 API로 조회된 도서 정보를 책 한 권 단위로 담은 CSV 파일(약 6.7MB)로, 국제표준도서번호(ISBN)·책제목·저자·출판사·출판일·가격·설명·링크·표지 이미지를 담는다. 도서관 담당자나 분석가가 시민들이 희망도서로 어떤 책을 찾았는지, 그 출판사·출간 시기·가격 분포가 어떤지 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키는 없지만 국제표준도서번호를 매개로 국가서지나 도서관정보나루의 대출·인기 도서 데이터와 도서 단위로 맞춰 볼 수 있다.
description_portal: 광주광역시립도서관 홈페이지를 통해 희망도서 신청시 네이버 API의 데이터를 가져와 국제표준도서번호, 링크주소, 이미지, 가격등의 정보를  나타냅니다.광주광역시립도서관 홈페이지의 네이버도서조회 서비스는 네이버와 연동되어 도서의 상세정보를 쉽게 확인할 수 있는 기능입니다. 이용자는 도서 제목, 저자, 출판사 등 다양한 검색 조건을 활용해 원하는 책을 빠르게 찾을 수 있으며, 책의 내용, 출판 정보, 평점 등 다양한 정보를 한눈에 볼 수 있어 도서 선택에 도움을 줍니다. 이 서비스는 이용자의 편리한 도서 탐색을 지원하며, 광주 시민들의 독서 생활을 풍부하게 만듭니다.
