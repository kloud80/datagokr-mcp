description_portal: 부천시 관내 착한가격업소 현황으로 업소명, 소재지(도로명), 연락처, 품목 및 가격 정보를 제공합니다.착한가격업소는 정부와 지방자치단체가 지정한 물가안정 모범업소입니다.저렴하게 안심하고 이용할 수 있는 착한가격업소는 효율적인 경영을 통하여 소비자에게 저렴한 가격으로 양질의 서비스를 제공하는 정부와 지방자치단체가 지정, 관리하는 업소를 말합니다.각 지자체별 착한가격업소에 대한 다양한 지원혜택을 제공합니다.쓰레기봉투, 상하수도요금 가면 등 다양한 혜택을 지공하며, 온라인/모바일을 통한 업소 홍보를 제공합니다.총 61개소
