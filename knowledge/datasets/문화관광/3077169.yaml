summary_user: 성북구도시관리공단이 운영하는 성북구 소재 스포츠센터의 강좌를 프로그램 단위로 담은 파일로, 프로그램 그룹·프로그램명·운영 시간·대상·수강료(원)가 행마다 들어 있다. 성북구 주민이 특정 시간대에 수강할 수 있는 성인·어린이 대상 강좌와 수강료를 비교하거나, 분석가가 공공 체육시설 생활체육 프로그램의 수강료 수준을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·프로그램명 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
