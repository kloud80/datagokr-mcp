summary_user: 울산광역시 안의 박물관·전시관을 시설 한 곳당 한 행으로 담으며, 시설명·소개·도로명/지번 주소·대표 전화·홈페이지·좌표(위경도)를 제공한다. 시민이나 관광객이 '울산에서 가 볼 만한 박물관이 어디 있고 연락처는 무엇인가'를 찾거나, 분석가가 지역 문화시설 분포를 지도에 올릴 때 쓴다. 실측 컬럼에 전국 공통 조인 키(문화기반시설 코드 등)가 없어 다른 데이터와는 시설명·주소 매칭이나 좌표 기반 공간 결합으로만 이어 쓴다.
limits: 울산광역시 범위만 담아 다른 시도와의 비교에는 다른 기관 데이터가 필요하다. 전역 시설코드가 없어 문화기반시설총람·KOPIS 등과 연결할 때 이름·주소 매칭 오류에 주의해야 한다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
