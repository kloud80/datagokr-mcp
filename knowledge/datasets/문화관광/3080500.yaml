description_portal: '서울특별시 마포구의 종합여행업(구 일반여행업) 등록 현황에 대한 정보입니다. 이 데이터에는 종합여행업체가 위치한 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 도로명 주소 등의 정보가 포함되어 있습니다. 또한 상호와 업종에 대한 세부 정보도 함께 제공됩니다. 종합여행업은 국내외 여행 알선, 항공권 및 숙박 예약, 단체 여행 기획 등 전반적인 여행 관련 서비스를 제공하는 업종으로, 관련 데이터는 지역 내 관광산업의 규모와 특성을 이해하는 데 유용합니다. 또한 시민은 합법적으로 등록된 여행사를 통해 안전하고 신뢰할 수 있는 여행 서비스를 이용할 수 있습니다.'
