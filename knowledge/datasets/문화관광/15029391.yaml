summary_user: 충청북도가 지정한 도지정 문화유산을 건별로 담은 파일 데이터로, 구분·종목·명칭·소재지·관리자·소유자·지정일·지정규모를 싣고 540건 전체가 시도 범위에 해당한다. 지역 문화유산이 어디에 어떤 종목으로 지정되어 있는지 확인하려는 주민·연구자·정책 담당자가 쓴다. 소재지(address) 주소 문자열로 다른 지역·위치 데이터와 이어 쓰고, 종목코드+지정번호나 PNU 같은 코드 키는 이 파일 필드에 없어 국가유산청 API와는 명칭·소재지 대조가 필요하다.
description_portal: 충청북도에서 지정 관리하고 있는 도지정 문화유산의 현황을 체계적으로 정리한 자료입니다. 충청북도 문화유산 보존 및 활용에 관한 조례, 충청북도 무형유산 보전 및 진흥에 관한 조례에 의거하여 지정된 문화유산을 대상으로 하며 유형문화유산, 무형유산, 기념물, 민속문화유산, 자연유산, 문화유산자료, 자연유산자료, 도등록문화유산으로 구분됩니다. 지정번호, 종목, 문화유산명, 지정일자, 소재지, 관리주체 등이 데이터가 구성되어 있습니다. 이를 통해 문화유산 지정 및 관리 현황을 한눈에 파악할 수 있으며 정책수립, 학술 연구 교육 및 관광자원화 등 다양한 분야에서 활용할 수 있습니다.
