summary_user: 2019년 경기그랜드투어 코스에 포함된 경기도 시군별 주요 관광지와 그에 딸린 연계관광지를 시군명·관광지명·연계관광지 세 항목으로 담은 작은 목록 파일(CSV, 2,776바이트)이다. 여행 기획자나 지자체 관광 담당자가 특정 시군에서 어느 관광지를 묶어 동선을 짜면 좋은지, 시군별로 코스 관광지가 어떻게 분포하는지 확인하는 데 쓴다. 관광지 코드나 TourAPI 콘텐츠ID 같은 공통 조인 키가 없어서, 다른 관광 데이터와는 시군명·관광지명을 이름으로 맞춰 이어 쓴다.
limits: 실측 컬럼에 전역 조인 키가 없어 TourAPI 등 다른 관광 데이터와 연결하려면 시군명·관광지명 문자열 매칭에 의존해야 하며, 표기 차이로 누락될 수 있다. 관광지의 주소·좌표·운영정보 같은 상세 속성은 없고, 내용은 2019년 코스 기준이다.
