description_portal: 이 데이터는 경기관광공사에서 제공하는 2019년 경기그랜드투어 투어코스 관련 정보로, 경기도를 일주하는 역사·문화·생태 중심 관광코스에 포함된 각 시군별 주요 관광지와 연계관광지에 대한 정보를 담고 있습니다. CSV 파일은 시군명, 관광지명, 연계관광지 항목으로 구성되어 있으며, 지역별 관광지 간의 연계성 및 시군 단위의 관광 자원 분포를 파악할 수 있도록 설계되었습니다. 본 데이터를 활용하면 관광 콘텐츠 기획, 연계형 여행 동선 구성, 시군별 관광 분석 등 다양한 분야에서 유용하게 적용할 수 있으며, 자세한 사항은 경기그랜드투어 누리집(grand.ggtour.or.kr)에서 확인 가능합니다.
