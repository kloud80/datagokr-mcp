summary_user: 국내 소재 유네스코 세계유산별로 2016년부터 2020년까지 연도별 관람객 수(명)를 한 행에 담은 집계표로, 전국 범위의 소규모 CSV 파일(752바이트)이다. 관광 분석가나 지자체 담당자가 '어느 세계유산의 관람객이 2016~2020년 사이 늘었고 줄었나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 세계유산 이름으로 국가유산청 유산 목록(종목코드·지정번호)이나 소재지 정보와 수작업 매핑해야 이어 쓸 수 있다.
description_portal: '세계유산 관람객 현황은 국내 소재 세계유산별 관람객의 추이를 통해 관람객의 관심도, 호응, 인지도 등을 확인할 수 있다.“국가유산청_세계유산 관람객 현황” 데이터는 국내에 소재한 유네스코 세계유산의 연도별/유산별 관람객 추이를 제공하는 공공데이터입니다. 주로 아래와 같은 정보를 포함합니다:대상 세계유산별 관람객: 2016년부터 2020년까지 각 지정 유산의 관람객 수(명 단위)관람객 변화 추이 분석: 연도별 비교가 가능해 유산별 인지도 및 방문 호응의 변화를 평가할 수 있음 제공 방식: CSV, XML, JSON 등의 오픈 포맷 파일 및 REST 기반 Open API를 통해 누구나 무료로 접근 가능데이터 업데이트: 최초 공개일은 2021년 9월 8일이며, 최근 수정일은 2024년 5월 22일로 연속성을 갖춘 시계열 분석에 활용 가능 📊 활용 예시활용 분야설명관광분석인기 세계유산의 연도별 관람객 변화 분석 가능정책 수립방문자 유치 전략 및 시설 개선 계획 수립 지원결과 공유 및 홍보지자체·문화재청·관광업계의 홍보 및 성과 지표로 활용연구 및 교육문화유산 연구 및 관광학 교육 자료로 사용'
