description_portal: '데이터 기간: 2014. 6 ~ 2026. 5 관련 데이터: 콘텐츠 타입, 장르명, 콘텐츠명, 제작년도, 제작사명, 배급사명, 기획자, 공연장소, 공연일자, 썸네일, 시청등급, 서비스 구분데이터 내용: 예술의전당 디지털스테이지 플랫폼은 공연 예술 콘텐츠를 디지털화하여 온라인으로 제공하는 서비스입니다. 이 플랫폼은 코로나19 팬데믹 이후 관객의 안전을 고려하여 비대면으로 공연을 관람할 수 있는 환경을 마련하고자 시작되었습니다. 해당 데이터는 디지털스테이지 플랫폼에서 운영하는 콘텐츠의 상세 데이터 입니다. 데이터를 분석 및 활용을 통해 콘텐츠 전략, 사용자 경험 개선, 비즈니스 확장 등 다양한 목적에 쓰일 수 있습니다.* (서비스 구분)예술의전당 디지털스테이지 콘텐츠는 라이브 스트리밍과 VOD(다시보기) 콘텐츠로 서비스 유형이 나눠져 있습니다.'
