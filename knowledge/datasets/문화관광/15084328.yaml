description_portal: 서울시 책방(서점) 현황정보 데이터는 서울시에 위치한 개별 책방의 기본 정보를 제공하는 공간 기반 행정·문화 데이터입니다. 책방 이름, 주소, 전화번호, 홈페이지 URL, SNS URL 등을 통해 시민과 방문객이 원하는 서점을 쉽게 찾고 직접 방문하거나 온라인으로 접근할 수 있도록 돕습니다. 구 코드와 구 이름을 함께 제공하여 자치구 단위의 책방 분포를 분석할 수 있으며, 책방 구분 및 구분명 정보를 통해 독립서점, 전문서점, 복합문화공간형 서점 등 유형별 특성을 파악할 수 있습니다. 또한 위도와 경도 좌표를 포함하고 있어 지도 서비스, 위치 기반 추천 서비스, 지역 문화 인프라 분석 등에 활용 가능한 데이터입니다.
