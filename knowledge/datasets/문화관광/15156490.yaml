description_portal: 부산 마이스 얼라이언스(BMA)는 부산시와 부산관광공사가 부산의 MICE 산업 육성을 위해 설립한 MICE 민관협력체입니다.부산 마이스 얼라이언스는 MICE 전문시설 분과(컨벤션센터, 호텔, 유니크베뉴 등), 기획운영 분과(PCO, 여행사 등), 지원분과(수송, 체험, 미팅테크놀로지 등), 주최자 분과(UIA 국제기국 등록업체 등), 총 4개 분과로 구성되어 있습니다.회원사 대상 MICE 포럼, 워크숍 등을 개최하여 지역 MICE 성장 및 공동마케팅을 위한 기반을 마련하고 있으며, 해외 MICE전시회 공동참가, 국제회의 현장답사 지원 등을 통해 부산에 MICE 유치를 위한 다양한 공동 협력사업을 전개하고 있습니다.
