summary_user: 국외 52개 기관이 소장한 한국 고문헌 약 14,000건의 서지정보를 건별로 담은 엑셀(xlsx) 파일로, 한국고문헌종합목록(KORCIS)에 참여 중인 국외 기관 자료가 대상이다. 연구자나 분석가가 '해외로 나간 특정 한국 고문헌이 어느 나라 어느 기관에 소장돼 있는가'를 확인하거나 국외 소재 현황을 집계할 때 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못했으므로, 서명·기관명 같은 이름을 맞춰 연결해야 한다.
description_portal: 한국고문헌종합목록(KORCIS)은 한국 고문헌의 소재를 파악하고 목록, 해제, 원문 등의 관련 정보를 온라인으로 제공하는 국내외 유일의 한국 고문헌의 종합목록으로 국내뿐 아니라 국외 유출된 한국 고문헌을 조사하여 관련 정보를 제공하고 있다.2025년 현재 한국고문헌종합목록에 참여 중인 국외 52개 기관소재 한국 고문헌 서지데이터  약 14,000건을 개방합니다.
