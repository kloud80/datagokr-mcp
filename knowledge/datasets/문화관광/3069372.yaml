summary_user: 국악방송이 제작한 전통문화 공연 중계 녹화, 다큐멘터리 등 방송 영상 콘텐츠를 영상 한 편씩 담은 목록으로, 대분류·중분류, 제목, 등록일, 내용 설명, 이미지와 페이지 주소를 담는다(CSV 약 44만 바이트). 국악 공연이나 전통문화 다큐 영상을 찾는 시청자·교육자, 국악 콘텐츠 현황을 살피는 분석가가 '어떤 분류의 국악 방송 영상이 언제 올라왔고 어디서 볼 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID 등과 직접 연결되지 않으며, 다른 데이터와는 제목·공연명 같은 이름 매칭으로만 이어 쓴다.
