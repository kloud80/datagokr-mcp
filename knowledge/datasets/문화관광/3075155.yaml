summary_user: 한국콘텐츠진흥원이 정리한 국내 콘텐츠 산업(출판·만화 등) 장르별 주요 통계를 산업명 한 행씩 2016~2020년 연도별 수치와 비중·전년대비 증감률·연평균 증감률로 담은 전국 단위 집계표(CSV, 667바이트)입니다. 분석가나 콘텐츠 사업자가 '최근 5년간 어느 콘텐츠 장르가 가장 빠르게 커졌고 전체에서 차지하는 비중은 얼마인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 산업명(장르명)을 이름으로 맞추거나 같은 기관의 콘텐츠 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
