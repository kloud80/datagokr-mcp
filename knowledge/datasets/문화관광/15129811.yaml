summary_user: 광주광역시관광공사가 관리하는 문화관광해설사의 배치 장소별 현황을 담은 작은 CSV 파일(1,447바이트)로, 배치장소·소재지·도로명주소·전화번호·관련기관을 장소 단위로 담는다. 광주를 찾는 관광객이나 단체가 '어느 관광지에 해설사가 배치돼 있고, 해설을 받으려면 어디로 연락하나'를 확인할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 목록 등과는 배치장소 이름이나 도로명주소를 맞춰 연결해야 한다.
description_portal: 본 데이터는 광주광역시관광공사에서 관리하는 문화관광해설사의 배치 현황 및 활동 정보를 포함한다. 주요 수록 항목으로는 해설사의 위치, 배치된 장소, 도로명 주소, 연락처 및 관련 기관 정보 등이 있다. 문화관광해설사는 광주를 방문하는 관광객에게 관광지의 역사, 문화, 자연환경 등에 관한 전문 해설을 제공하여 관광객의 이해도 향상에 기여한다. 해당 데이터는 기관 및 단체, 일반 시민이 문화관광해설 서비스에 관한 문의나 행사 준비 시 기초 자료로 활용 가능하다. 특히, 현장 해설 인력 배치 상황을 한눈에 파악할 수 있어 관광지 운영과 방문 계획 수립에 실질적 도움을 준다. 데이터는 정기적으로 업데이트되며 지역 관광 활성화를 위한 중요한 정보로 사용된다.
