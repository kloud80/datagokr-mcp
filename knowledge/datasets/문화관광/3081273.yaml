summary_user: 전북특별자치도 시군별 주요 관광지(전동성당, 경기전, 고인돌유적 등)를 한 행에 한 곳씩 담은 목록 파일로, 시군명·명칭·구분·도로명주소·전화번호·소개글을 담는다. 전북 여행을 계획하는 관광객이나 지역 관광 콘텐츠를 만드는 사업자가 '전주 시내 대표 역사 명소의 주소와 연락처, 소개는 무엇인가' 같은 질문에 쓴다. 전역 조인 키가 없어 TourAPI contentId나 지역코드와 바로 붙지 않고, 시군명이나 관광지 명칭·주소를 이름 매칭해 TourAPI 관광지 정보나 다른 전북 데이터와 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도의 주요 관광지 현황을 상세히 담고 있는 자료입니다. 전동성당, 경기전, 고인돌유적 등 각 시군을 대표하는 명소의 공식 명칭, 주소, 연락처 정보와 함께 각 관광지의 역사적, 문화적 의미를 설명하는 소개글을 포함하고 있습니다. 이 자료는 지역을 방문하는 내외국인 관광객에게 신뢰도 높은 여행 정보를 제공하는 핵심적인 안내서 역할을 합니다. 또한, 지방자치단체나 관광 기관이 지역의 관광 자산을 체계적으로 관리하고, 홍보 전략을 수립하며, 새로운 관광 콘텐츠를 개발하는 데 있어 중요한 기초 데이터로 활용됩니다.
