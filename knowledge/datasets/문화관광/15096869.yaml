summary_user: 제주를 찾은 크루즈 관광객 실태조사 결과 중 '지출 기준 인원', 즉 응답한 지출액이 몇 명분인지를 연도·거주국가별로 집계한 통계로, 1명부터 11명 이상까지의 응답 비율(%)과 평균 지출 기준 인원(명)을 담는다. 분석가가 크루즈 관광객 1인당 지출을 추정할 때, 국가별로 지출 응답이 몇 명 단위로 이뤄졌는지 확인해 1인당 금액을 환산하는 데 쓴다. 전역 조인 키는 없어 같은 제주 방문관광객 실태조사의 크루즈 지출액 표 등과 기준 연도·거주국가 이름을 맞춰 이어 쓴다.
description_portal: 이 데이터셋은 2017년부터 2019년까지를 대상으로, 제주를 찾은 크루즈 관광객의 ‘지출 기준 인원’ 통계를 연도 및 거주 국가별로 집계해 제공하는 공공통계자료이다. 즉, 크루즈를 통해 제주에 방문한 관광객들이 여행에서 지출한 비용을 인원수 기준으로 나누어 정리한 것으로, 여행객 수 대비 지출 규모를 분석할 수 있게 구성되어 있다. 이 통계는 제주 관광 정책 수립, 크루즈 관광객의 경제 효과 분석, 관광수요 예측, 관광산업 및 서비스업 유치 전략 마련 등 다양한 목적에 활용될 수 있다. 특히 외국인 또는 해외 거주 관광객 유입이 많은 제주 특성을 고려할 때, 국가별 방문객 지출 수준 파악, 크루즈 중심 관광 수요와 소비 패턴 분석, 항만 인프라 계획, 관광 관련 업종의 지역 투자 타당성 검토 등에 중요한 기초 자료로 쓰일 수 있다. 데이터는 CSV 형식으로 공개되어 누구나 다운로드 후 활용 가능하다.
