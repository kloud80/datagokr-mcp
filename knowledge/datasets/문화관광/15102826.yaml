summary_user: 전라남도 광양시 관내 국가·도 지정 문화재를 한 건씩 담은 목록으로, 지정 주체(구분)·종별·명칭·구군·소재지·데이터기준일로 구성된 작은 CSV 파일(약 4KB)이다. 광양시에 어떤 사적·기념물·유형문화재가 어디에 있는지 확인하려는 시민·관광 콘텐츠 기획자·연구자가 방문 안내나 유형별 분포 파악에 쓴다. 전역 조인 키나 국가유산 종목코드·지정번호가 없어서, 국가유산청 지정 유산 목록이나 주소 기반 자료와는 문화재 명칭과 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 본 자료는 전라남도 광양시 관내에 위치한 국가 및 지방문화재의 기본 현황 정보를 체계적으로 정리한 공공 데이터입니다. 자료는 문화재 구분, 종별, 명칭, 행정구역, 소재지, 데이터 기준일 등으로 구성되어 있으며, 광양시 내 문화유산의 유형별 분포, 보존 대상 파악, 문화관광 자원 활용 등을 위한 기초자료로 활용됩니다.구분 항목은 문화재의 지정 주체(국가/전라남도 등)를 구분하며, 종별은 유형문화재·무형문화재·사적·기념물 등 법적 분류 기준을 따릅니다. 명칭과 소재지는 현장 식별 및 방문 안내, 학술조사 자료와의 연계 등에 활용됩니다.또한 이 데이터는 문화재 보수·정비 예산 배정, 지방문화재 신규 발굴 및 등록 검토, 관광 콘텐츠 개발 등에도 사용되며, 행정기관, 연구기관, 일반 시민 모두에게 신뢰도 높은 문화자원 정보를 제공합니다.
