description_portal: "'부산원도심활성화축제 택슐랭' 선정된 식당 리스트 공공데이터입니다. 부산의 10년 이상 경력의 베테랑 택시기사들을 대상으로 진행한 설문을 통해 선정된 부산 로컬 맛집들의 정보를 제공합니다. 내비게이션보다 더 정확한 부산 베테랑 택시기사들이 추천한 로컬 맛집을 맛보고 체험해보세요. 위치(중구, 서구, 동구, 영도구), 식당명, 분류(한식, 중식, 일식, 양식, 분식, 카페), 주소, 추천메뉴, 위도, 경도 데이터를 제공합니다. 위경도는 WGS84 좌표계를 이용합니다. 2024년, 2025년 택슐랭 선정된 식당들의 리스트입니다.(연도 표기는 하지 않음)"
