summary_user: 서울특별시 강북구에서 실내·실외 시설을 갖추고 골프 연습을 제공하는 골프연습장업 업소의 인허가 정보를 업소 한 건씩 담으며, 영업 중인 곳과 폐업한 곳을 모두 포함하고 인허가일·영업상태·폐업일·주소·중부원점TM(EPSG:5174) 좌표 등을 제공한다. 상권 분석가나 창업 예정자가 "강북구에 골프연습장이 몇 곳 영업 중이고 최근 어디서 개업·폐업했나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 구의 같은 체육시설업 인허가 데이터와는 관리번호(MGTNO)·주소·업소명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: '서울특별시 강북구 골프연습장업 인허가 정보 데이터는 강북구의 골프를 연습하기 위해 실내 또는 실외에 시설을 갖추어 제공하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
