description_portal: '문화재수리업자 등 지역별 등록현황입니다. 문화재수리업자 지역별 등록현황은 지역별 문화재 수리업체의 세부적인 업종 현황을 파악할 수 있습니다.“국가유산청_문화재수리업자 지역별 등록현황” 데이터는 국내에서 문화재 수리 및 복원을 수행하는 업체들의 지역별 등록 상황을 정리한 자료입니다. 이 데이터는 문화재 보존과 수리 사업 관리, 정책 수립 등에 활용됩니다.주요 내용대상: 문화재 수리업자로 등록된 업체항목:업체명등록 지역(시·도, 시·군·구)수리 분야(건축, 목재, 금속, 도자기 등)연락처 및 주소등록일 및 유효 기간목적:문화재 수리업자 분포 파악지역별 문화재 수리 역량 및 현황 분석관리 및 행정 지원활용 분야문화재 보수·복원 사업 계획 수립지역별 수리업체 매칭 및 의뢰문화재 수리 품질 관리 및 감독연구 및 통계 자료 활용'
