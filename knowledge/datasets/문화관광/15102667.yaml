summary_user: 인천 부평구에 등록된 종합여행업체를 업체 한 곳당 한 행으로 담은 파일로, 업종 분류·상호·지번 주소·도로명 주소를 담는다(csv 약 6KB, 시군구 범위의 개별 사업장 단위). 부평구 주민이나 분석가가 "우리 구에 국내외 여행을 모두 취급하는 여행사가 어디에 몇 곳 있나"를 확인하거나 관내 여행업체 분포를 지도로 그릴 때 쓴다. 전역 조인 키(등록번호·사업자번호 등)가 없어 다른 데이터와는 상호명이나 주소를 맞춰 잇거나, 주소를 지오코딩해 위치 기반으로 겹쳐 쓴다.
limits: 등록번호·사업자번호 같은 고유 키가 없어 다른 관광사업 등록 데이터나 사업자 정보와 정확히 연결하기 어렵고, 상호·주소 매칭에 의존해야 한다. 부평구 한 곳의 업체만 담으므로 인천 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다.
