summary_user: 한국관광공사 여행정보 사이트 '대한민국 구석구석'에 실린 지자체별 여행 콘텐츠 목록을 콘텐츠 한 건씩 지역·타이틀·서브타이틀·상세 페이지 연결주소 4개 항목으로 담은 파일(csv, 약 13KB)이다. 여행 기획자나 지역 관광 담당자가 "우리 시·군을 소개하는 공식 여행 콘텐츠로 어떤 것이 올라와 있나"를 확인하고 원문 페이지로 바로 이동할 때 쓴다. 실측 컬럼에 전역 조인 키나 지역코드가 없어서 다른 데이터와는 지역 이름을 매핑해 이어 써야 한다.
limits: 포털 설명상 2023년 8월 기준으로 만든 목록이다. 최신 콘텐츠는 '대한민국 구석구석 > 지역 > 우리 지역 이야기'에서 따로 확인해야 한다. TourAPI의 콘텐츠ID나 지역코드가 없어서 관광지·주소·좌표 데이터와 키로 바로 붙일 수 없다.
