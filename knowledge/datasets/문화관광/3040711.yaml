status: active
summary_user: 부산 연제구에 등록된 여행업·관광숙박업 등 관광사업체를 업체 한 건씩 담은 등록 원장 파일로, 등록번호·업종·상호·지번/도로명 소재지·시설면적·영업상태·보험 가입 기간과 보험기관 등을 포함한다. 여행사를 고르려는 주민이나 사업자가 "연제구에서 지금 영업 중이고 보험이 유효한 여행사는 어디인가" 같은 질문에 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호·주소 같은 이름 매칭이나 같은 기관 데이터끼리만 이어 쓰고, 지도 표시에는 도로명 주소를 좌표로 바꿔 쓴다.
limits: 범위는 연제구 한 곳이라 부산 전체나 다른 구와 비교하려면 각 구 파일을 따로 모아야 한다. 표준 코드나 공통 식별자가 없어 다른 기관 데이터와 정확히 연결하기 어렵고, 결합은 상호·주소 문자열 매칭에 의존한다.
