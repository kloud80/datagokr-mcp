description_portal: '부산광역시 연제구 관광 및 여행업에 대한 데이터로 상호, 소재지 등의 항목을 포함하고 있습니다.  데이터 제공 항목 등록번호: 해당 업체가 행정기관에 정식 등록된 고유번호로, 식별 및 관리 목적으로 사용됨 등록일자: 해당 업체가 관광 관련 사업으로 등록된 날짜. 연도-월-일 형식 권장 업종: 업체가 영위하는 관광업의 종류 (예: 일반여행업, 국내여행업, 국외여행업, 관광숙박업 등) 상호: 업체의 상호 또는 공식 명칭 우편번호: 업체 소재지의 우편번호. 도로명 주소와 함께 행정구역 파악에 유용 소재지(지번): 업체의 지번 주소. 예: 연산동 123-45 소재지(도로명): 업체의 도로명 주소. 예: 중앙대로 1000, 13층 등 시설면적(㎡): 관광사업 관련 시설의 면적을 제곱미터(㎡) 단위로 표기. 규모 분석 등에 활용 가능 영업상태: 업체의 현재 영업상태. 예: 영업중, 휴업, 폐업 등 보험시작일: 해당 업체가 사업 운영을 위한 보험을 개시한 날짜 보험종료일: 보험의 유효기간 종료일. 사업 운영의 안정성과 리스크 관리 상황 파악에 활용 보험기관: 업체가 계약한 보험사를 표기. 예: 삼성화재, DB손해보험 등 대표자성명: 해당 사업체의 대표자 이름 조직(단체)명: 소속된 법인 또는 단체 명칭 (예: ○○여행협동조합, ○○관광개발주식회사 등) 변경일자: 업체 정보에 마지막으로 변경이 발생한 날짜. 최신 정보 여부 확인에 활용'
