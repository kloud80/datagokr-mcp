status: active
summary_user: 경정 경주별로 출전 선수 한 명씩의 출주 정보를 담는 API로, 선수명·등급·나이·성별·체중과 최근 6회차 성적·승률·연대율·평균 사고점, 배정된 모터·보트 번호와 장비별 착순점·연대율을 함께 제공한다. 경정 경주를 앞두고 특정 경주에 나오는 선수와 장비의 최근 성적이 어떤지 비교하려는 분석가나 관람객이 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 다른 경정 데이터(경주 결과 등)와는 연도·회차·경주번호(race_no)나 선수명·모터·보트 번호를 직접 맞춰 연결해야 한다.
limits: 다른 기관 데이터와 이어 쓸 공통 코드가 없어 이름·번호 매핑으로만 연결된다. 체육 부문 정책상 경륜·경정은 핵심 범위에서 제외된 데이터라 생활·전문체육 분석 자료와 묶어 쓰는 용도로는 맞지 않는다. 개발계정은 하루 10,000회로 호출이 제한된다.
