summary_user: 경기도 31개 시군이 관광식당으로 지정·허가한 업소를 한 업소당 한 행으로 담은 인허가 원천 목록이다. 사업장명, 인허가일자·폐업일자, 영업상태, 도로명·지번 주소, 위경도 좌표, 시설규모 같은 항목이 들어 있다. 관광객이 많이 찾는 지역에 현재 영업 중인 관광식당이 어디에 몇 곳 있는지 알고 싶은 지자체 관광 담당자나 분석가가 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 시군명·시군코드(SIGUN_CD), 주소, 좌표나 업소명을 맞춰 이어 쓴다.
description_portal: 경기도 내 관광식당 현황입니다. 일반음식점영업의 허가를 받은자가 관광객의 이용에 적합한 음식제공시설을 갖추고 관광객에게 특정한 국가의 음식을 전문적으로 제공하는 업소의 정보를 제공합니다.※경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내 ‘관광객을 위한 식당시설’로 지정된 관광식당의 현황을 정리한 자료로, 관광객 편의와 만족도 향상을 위한 지정음식점 관련 공공정보를 포함합니다. 주요 항목은 시군명, 사업장명, 인허가일자 및 폐업일자, 영업상태, 도로명우편번호, 도로명주소 및 지번주소, 소재지전화번호, 놀이시설 및 안내소 보유 여부, 발전시설·의무실·보험 정보, 부대시설 내용, 시설규모 등 총 47개에 이릅니다. 특히 관광식당은 일반 음식점과 달리 관광지 인근에 위치하고 관광객 대상 서비스 품질이 검증된 식당으로, 관광 인프라의 일환으로 관리됩니다. 본 데이터는 관광객 유입경로 내 식사 인프라 분석, 관광특구 서비스 점검, 관광지도 제작, 위생 및 안전관리대상 식당 파악 등에 활용될 수 있으며, 문화체육관광부 및 지방자치단체의 관광식당 인증관리 시스템에서 수집한 공공데이터입니다.
