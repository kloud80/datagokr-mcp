description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 법환포구는 제주 서귀포시 법환동에 위치한 항구 및 해안 관광지로, 해녀문화, 바다 전망, 작은 포구 풍경, 주변 섬(범섬, 섶섬, 문섬, 새섬) 조망이 가능한 자연경관이 특징이며, 무장애 관광지 데이터에는 포구 접근로, 주차장, 무단차 출입구, 해녀체험센터, 공용화장실 등 편의시설 정보가 포함되어 있어 휠체어 사용자, 고령자, 유모차 동반 가족 등도 비교적 편안하게 해안 산책과 포구 방문, 해녀 문화 체험, 바다 풍경 감상 등을 즐길 수 있는 열린관광지로 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
