summary_user: '광주에서 열린 2019 광주세계수영선수권대회와 이를 잇는 전국 규모 수영대회(광주전국수영선수권대회, 광주전국마스터즈수영대회 등)를 대회 1건당 한 행으로 담은 작은 목록 파일(약 1KB)로, 대회명·기간·장소·종목·주최·주관을 담는다. 수영 동호인이나 선수·지도자가 "광주에서 열린 전국 수영대회는 언제, 어느 수영장에서, 어떤 종목으로 열렸나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 대회장소 이름(예: 남부대 시립국제수영장)이나 같은 기관 체육 데이터와 이름으로 맞춰 이어 쓴다.'
description_portal: '"2019 광주세계수영선수권대회" 개최 레거시 (유산사업)사업으로 추진중인 광주광역시에서 개최하는 전국 규모 수영대회에 관한 데이터입니다.(대회명, 종목, 대회시작일, 대회종료일 등)2019광주세계수영선수권대회는 남부대 시립국제수영장, 남부대 축구장, 염주종합체육관, 조선대학교 축구장에서 개최되었으며, 경영·다이빙·수구·아티스틱스위밍·하이다이빙 종목이 포함되어 있습니다. 제1회 및 제2회 광주전국수영선수권대회와 광주전국마스터즈수영대회는 남부대 시립국제수영장에서 진행되었으며, 경영과 다이빙을 중심으로 구성되어 있습니다'
