summary_user: 서울 광진구에서 인허가를 받은 복합유통게임제공업소(PC방 등과 음식점·편의점 같은 다른 업종을 한 곳에서 함께 운영하는 업소)를 업소 단위로 담은 인허가 원천 목록으로, 업소명·소재지·인허가 일자·영업상태·폐업일 외에 층수·시설면적·객실 수·비상구·조명·음향 설비 같은 시설 정보와 중부원점TM 좌표를 담는다. 창업 예정자나 상권 분석가가 '광진구에서 지금 영업 중인 복합게임업소가 어디에 몇 곳 있고 언제 인허가를 받았는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소(도로명·지번)나 업소명 매칭, 또는 같은 기관의 관리번호(MGTNO)로만 연결한다.
description_portal: '이 데이터는 서울특별시 광진구 관내에서 인허가를 받아 운영 중인 복합유통게임제공업소의 정보를 담고 있습니다. 복합유통게임제공업은 인터넷컴퓨터게임시설제공업(예: PC방)과 **다른 업종(예: 음식점, 편의점 등)**을 동일 장소 내에서 병행 운영하는 형태의 업소를 의미합니다. 이러한 형태는 게임 이용자에게 다양한 편의 서비스를 제공하기 위해 점차 확산되고 있으며, 융합 업종으로서 창업 및 유통 구조 변화의 중요한 지표로 활용됩니다.본 데이터에는 업소의 명칭, 소재지, 업종 유형, 인허가 일자 및 영업상태 등의 정보가 포함되어 있으며, 관련 행정기관이나 정책수립기관이 복합 업종 관리 및 규제 정책 수립에 활용할 수 있습니다.※ 좌표 안내: 중부원점TM(EPSG:2097) 좌표계를 기반으로 제공되며, 위도·경도(WGS84)는 제공되지 않습니다.※ 데이터 기준일: 3일 전 기준으로 수집된 최신 인허가 정보입니다.'
