summary_user: 울산시설공단이 운영하는 종합운동장의 시설명, 상세 시설, 연면적·대지면적, 주요 시설과 기능, 연락처, 주소를 시설 단위로 담은 작은 CSV 파일(655바이트)이다. 울산 시민이나 생활체육 이용자가 종합운동장 안에 어떤 세부 시설이 있고 규모가 어느 정도인지, 어디로 연락하면 되는지를 확인할 때 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 시설명이나 주소를 직접 맞추거나 같은 기관(울산시설공단) 데이터끼리만 이어 쓴다.
description_portal: 울산시설공단은 종합운동장에 대한 전반적인 정보를 제공하고 있습니다. 이 데이터는 시설명, 상세 시설, 연면적(제곱미터), 대지(부지)면적, 주요시설, 주요 기능, 연락처, 주소, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 시민들은 각 시설의 규모와 용도, 세부적인 구성 요소들을 파악할 수 있습니다. 또한 해당 시설의 연면적과 부지면적을 비교함으로써 공간 활용도를 가늠할 수 있으며, 상세 시설 항목을 통해 이용자가 원하는 시설을 정확히 찾는 데에도 도움이 됩니다. 데이터 기준일자를 통해 정보의 최신성을 확인할 수 있습니다.
