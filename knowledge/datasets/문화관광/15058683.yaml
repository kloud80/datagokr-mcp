summary_user: 경기도 31개 시군의 인허가 자료를 바탕으로 공연장을 사업장 한 곳당 한 행으로 담은 건별 현황이며, 사업장명, 인허가·폐업일자, 영업상태, 지번·도로명 주소, 좌표, 건물 면적·층수, 부대시설 내역 같은 행정·시설 정보를 포함한다. 주민이나 공연기획자가 '우리 시에서 지금 영업 중인 공연장은 어디이고 규모가 어느 정도인가'를 확인하거나, 분석가가 시군별 공연시설 분포와 폐업 추이를 비교하는 데 쓴다. 전역 조인 키는 없으므로 같은 경기도 데이터와는 시군코드(SIGUN_CD)로 잇고, KOPIS 공연장ID(mt10id)는 들어 있지 않아 KOPIS 공연장·공연 목록과는 사업장명·주소를 직접 대조해 연결해야 한다.
description_portal: 경기도 내 공연장 현황입니다. 대중에게 공연을 주된 목적으로 설치하여 운영하는 시설정보를 제공합니다.※경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내에서 운영 중이거나 등록된 공연장에 대한 현황을 종합한 자료로, 문화예술 공연이 이뤄지는 시설에 대한 행정정보 및 부대시설 정보를 포함하고 있습니다. 주요 항목은 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, 소재지 주소 및 전화번호, 도로명우편번호, 시설 면적, 놀이시설 수, 회의실 수용 인원, 자본금, 부대시설내역 등 총 38개 항목으로 구성되어 있으며, 공연장 운영의 물리적·행정적 특성을 종합적으로 파악할 수 있습니다.공연장은 연극, 뮤지컬, 음악회 등 다양한 예술 공연이 이루어지는 공간으로, 지역 주민의 문화향유권 보장, 예술생태계 확산, 관광 활성화 등의 측면에서 중요한 인프라입니다. 본 데이터는 지역별 공연시설 현황 분석, 민간·공공 문화시설 비교, 문화정책 수립, 공연산업 기반 확충 전략 마련, 공연장 기반 관광상품 개발 등 다양한 분야에서 활용할 수 있습니다.자료는 경기도 및 시군 문화예술 행정기관에서 수집한 공공데이터로, 공연장 정보의 체계적 관리, 정책 지원 대상 선별, 공간 활용 효율화 등의 목적에 따라 활용될 수 있습니다.
