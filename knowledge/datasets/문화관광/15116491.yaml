description_portal: 광주광역시 남구 구립도서관에서 상영하는 영화 제목, 등급, 장르, 감독, 상영일 등의 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 도서관과(☎062-607-2523)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 주민들에게 문화 향유 기회를 확대하기 위해 도서관에서 정기적으로 해당 서비스를 제공하고 있습니다. 가족 단위 관람이 가능한 애니메이션, 어린이 영화, 고전 명작, 교육용 다큐멘터리 등이 주로 편성되며, 독서문화 행사와 연계해 운영되기도 합니다.
