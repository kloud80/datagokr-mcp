summary_user: 전국 국립공원 안에 있는 야영장을 한 곳씩 담은 공간데이터로, 야영장 이름(한글·영문), 지번·도로명 주소, 전화번호, 야영동 수, 야영료 징수 여부, 사용 여부, 고도와 위도·경도 좌표를 담는다. 탐방객이나 캠핑 정보 서비스 개발자가 '이 국립공원 근처에 지금 쓸 수 있는 야영장이 어디이고 사이트가 몇 개인가'를 지도 위에 띄워 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 공원사무소코드(PO_CD)·국립공원관리번호 같은 공단 내부 코드로 같은 기관의 다른 공간데이터와 잇거나, 좌표나 주소로 지역 데이터와 공간 결합한다.
description_portal: 본 데이터는 전국 21개 국립공원에 위치한 야영장에 대한 주요 정보를 포함한 공간데이터로, CSV 포맷으로 제공됩니다. 각 야영장의 명칭, 주소, 전화번호, 야영동(사이트) 수, 야영료 징수 여부, 사용 가능 여부, 위도·경도 좌표 등의 항목으로 구성되어 있으며, 캠핑 및 자연 체험을 위한 시설 안내에 활용됩니다. 민간 지도 서비스(Naver, Daum 등)의 Open API와 연계하여 탐방객에게 야영장 위치 및 상세 정보를 시각적으로 제공할 수 있도록 설계되었습니다. 본 데이터는 국립공원 이용자 편의 증진, 관광정보 시스템 구축, 공공안전 대응 체계 마련, 민간 콘텐츠 개발 등 다양한 분야에서 실효적으로 활용될 수 있습니다. 표준화된 구조로 구성되어 있어 공간정보 기반 시스템 연계 및 분석이 용이합니다.
