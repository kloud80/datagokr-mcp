summary_user: 인천시민 대상 조사 결과를 응답자 특성별(두 단계 구분)로 집계한 통계로, 음악 연주회·연극/뮤지컬·무용·영화·박물관·미술관·스포츠·기타 등 장르별 관람 만족도 5단계 응답 비율(%)과 5점 평균을 담은 약 11KB 분량의 CSV 파일이다. 시 문화·체육 정책 담당자나 분석가가 '어느 연령대·지역 집단에서 어떤 장르 관람 만족도가 낮은가'를 확인하거나, 예산 배분과 프로그램 개선의 근거를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 특성 구분 이름이나 장르명을 맞춰 붙이거나 같은 기관(인천광역시) 통계끼리만 연결한다.
limits: 개별 행사·시설 단위가 아닌 응답자 특성별 집계 비율이어서 공연 식별자(kopis_id)나 문화시설 코드로 특정 공연장·행사와 연결할 수 없다. 조사 시점에 생성된 뒤 바뀌지 않는 연간·이벤트성 자료이므로 시계열을 보려면 다른 연도 파일을 따로 모아야 한다. 일부 장르는 응답 단계 컬럼이 빠져 있으니(무용의 '매우 불만족', 기타의 일부 단계) 비율 합계를 해석할 때 주의한다.
