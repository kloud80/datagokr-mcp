summary_user: '순천시에 있는 헬스장을 업소 한 곳당 한 행으로 담은 명부이며, 업종·상호·주소·전화번호 네 항목으로 된 작은 CSV 파일(약 5.7KB)이다. 순천시 안에서 동네별로 헬스장이 어디에 몇 곳 있는지 알아보려는 주민, 또는 헬스장 창업 입지를 검토하는 사업자가 쓴다. 전역 조인 키나 코드표가 없어서, 다른 데이터와는 상호·주소를 직접 맞춰 보는 방식으로만 이어 쓴다(예: 상권·인허가 데이터와 대조).'
description_portal: 전라남도 순천시의 "체육시설 현황" 데이터는 순천시 내 공공 및 민간 체육시설에 대한 상세 정보를 제공합니다. 이 데이터는 시설명, 위치, 부지면적, 관람석 수, 주요시설, 부대시설 사용료 등 다양한 항목으로 구성되어 있습니다. CSV 형식으로 제공되며, 공공데이터포털을 통해 무료로 다운로드할 수 있습니다. 업데이트 주기는 수시로 이루어지며, 최신 정보는 공공데이터포털에서 확인 가능합니다. 이 데이터는 체육시설의 분포와 특성을 파악하고, 지역 스포츠 정책 수립 및 시설 이용 계획 수립에 유용하게 활용될 수 있습니다. 또한, 공공데이터포털에서는 지도 시각화 기능을 제공하여, 업체들의 지리적 분포를 한눈에 확인할 수 있습니다. 이 데이터는 순천시의 체육시설 현황을 파악하고, 관련 정책 수립 및 산업 분석에 유용한 자료로 활용될 수 있습니다.
