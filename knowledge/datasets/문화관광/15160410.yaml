description_portal: 본 데이터는 부산관광공사 부산관광기업지원센터에서 지역 관광 산업 활성화 및 일자리 창출을 목적으로 매년 공식 공모하여 선정하고 시행하는 부산관광스타기업 및 부산관광스타트업의 종합적인 기업정보를 제공합니다. 주요 데이터 구성 항목으로는 연도별 입주 및 선정 기업의 명칭, 공모 모집 분야 현황, 세부 관광 사업 분류 유형(관광IT, 플랫폼, 로컬 콘텐츠 등), 기업별 주요 사업 내용 요약, 그리고 센터 내 실제 입주 공간 및 호실 정보와 개업연월일 등의 현황을 체계적으로 포함하고 있습니다. 본 공공데이터는 부산 지역의 관광 스타트업 생태계 연구, 마이스(MICE) 산업 트렌드 분석, 유관 기관 및 기업 간의 비즈니스 매칭, 창업 지원 정책 수립 등을 위한 다각적인 기초 통계 자료 및 분석 자원으로 활용할 수 있습니다.
legal_basis_portal: 본 데이터는 부산광역시와 부산관광공사 부산관광기업지원센터에서 매년 지역 내 유망한 관광 창업 기업을 발굴 및 육성하기 위해 공식 시행하고 있는 '부산관광스타기업 및 부산관광스타트업 공모·선정 사업 운영 지침'과 매년 수립되는 연도별 사업 계획에 행정적 근거를 두고 있습니다. 공모를 통해 정당하게 선정된 기업들의 기본 현황을 체계적으로 관리하고, 맞춤형 컨설팅 제공, 사업화 자금 지원, 육성 프로그램 운영 등 지원 사업의 효율적인 성과 점검 및 사후 관리 업무를 수행하기 위한 목적으로 공식 수집하여 보유하고 있는 정당한 기관 보유 데이터입니다.
