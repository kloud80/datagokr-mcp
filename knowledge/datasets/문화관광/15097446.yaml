description_portal: '태권도 관련 주요 단체들의 창립일, 회원국 수, 총재, 본부 위치, 국제올림픽위원회 인가일 등 다양한 정보를 비교할 수 있도록 구성된 데이터입니다. 각 단체의 설립 배경과 국제적 위상, 조직 구조를 한눈에 파악할 수 있어 태권도 분야 연구, 정책 수립, 스포츠 행정 등 다양한 분야에서 활용이 가능합니다. 특히 국제 스포츠 교류나 올림픽 관련 업무, 태권도 단체 간 협력 방안 모색, 체육 정책 개발 등에도 유용하게 참고하실 수 있습니다. 태권도 단체의 현황과 특성을 체계적으로 분석하고자 하는 분들에게 신뢰할 수 있는 정보를 제공합니다.세계태권도연맹 홈페이지: www.worldtaekwondo.org/about-wt/cumna.html국제태권도 연맹 홈페이지: www.itf-tkd.org/members*  태권도 올림픽 정식 종목 채택 : 2000년 시드니 올림픽, 2004년 아테네 올림픽,   2008년 베이징 올림픽, 2012년 런던 올림픽, 2016년 리우 올림픽, 2020년 도쿄올림픽'
