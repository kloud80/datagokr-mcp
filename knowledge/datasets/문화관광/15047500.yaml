description_portal: '인천광역시 강화군 관내 식품위생업소 중 폐업한 업소의 현황을 정리한 자료로서, 식품위생 행정업무 수행과 업소 관리 이력 파악을 위해 작성되었습니다. 강화군에서는 식품위생업소의 인허가 및 영업 상태를 체계적으로 관리하고 있으며, 해당 자료는 업종별 폐업 현황과 지역별 분포 특성을 이해하는 데 참고할 수 있습니다. 업종명, 인허가번호, 인허가일자, 업소명, 소재지(도로명·지번), 영업장면적, 전화번호, 영업자시작일, 우편번호, 행정동명, 폐업일자, 폐업구분, 폐업사유, 업태명 등 항목을 포함한 폐업업소 현황 자료이며, 2016년 8월 10일 등록된 파일을 기준으로 제공합니다.공공데이터 제공신청(제공신청 번호 : 20002)을 통해 1회성으로 개방하는 데이터이므로 정기적 갱신이나 현행화를 진행하지 않습니다.'
