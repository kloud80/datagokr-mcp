summary_user: 영상물등급위원회가 외국인의 국내 공연에 대해 내린 추천 결정을 건별로 담으며, 공연물 제명·종류·분류, 공연장소, 공연 시작·종료일, 추천번호와 추천일자, 연소자 유해 여부를 포함하고 2009년 이후 자료를 전국 범위로 조회한다. 공연기획사나 분석가가 특정 외국인 공연이 언제 추천을 받았는지, 연소자 유해 판정을 받았는지 확인하는 데 쓴다. 실측 컬럼에 KOPIS 공연ID 같은 전역 조인 키가 없어서 KOPIS 공연 목록 등 다른 데이터와는 공연명·공연장소 이름과 공연 기간을 맞춰 연결해야 한다.
description_portal: 영상물등급위원회의 외국인 국내 공연추천 정보와 해당 공연의 정보를 제공하는 서비스입니다. 공연명, 공연장소, 공연시작일, 공연종료일, 추천번호, 추천일자 등의 정보를 제공 ※ 시스템 구축 이후인 2009년 자료부터 조회 가능합니다.
