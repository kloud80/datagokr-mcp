summary_user: 대구광역시 북구 관내에 신고된 체육시설업체 가운데 체력단련장업(헬스장), 골프연습장업, 가상체험체육시설업(스크린골프 등)의 업소별 명부로, 업종·상호·소재지 주소·전화번호·기준일자를 한 행에 한 업소씩 담은 약 23KB 분량의 CSV 파일이다. 북구에서 헬스장이나 골프연습장을 찾는 주민, 동네별 운동시설 분포나 헬스장 개폐업 흐름을 상권 신호로 보려는 창업자·분석가가 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 상호명이나 소재지 주소를 매칭해 잇거나 같은 기관(북구) 단위로만 연결한다.
description_portal: 대구광역시 북구 관내에 정식으로 신고된 체육시설업체(체력단련장업, 골프연습장업, 가상체험체육시설업)의 현황 정보를 제공하고 있습니다. 이 정보에는 헬스장(체력단련장업)과 골프연습장업 및 가상체험체육시설(골프종목) 등 다양한 체육시설에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소, 연락 가능한 전화번호 등의 기본 정보가 제공됩니다.  해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 다른 업종의 신고체육시설업의 정보가 필요한 경우 관련 부서에 문의해주십시오.
