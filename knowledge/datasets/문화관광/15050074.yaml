summary_user: 해남군 문화예술회관 2층 문화의집에서 여는 문화강좌를 강좌 한 건당 한 행으로 담은 파일로, 강좌명·신청일·마감일·강좌 시작일과 종료일·정원을 담는다. 해남 주민이 이번 학기에 어떤 강좌가 언제 접수를 받고 몇 명까지 받는지 확인하거나, 분석가가 군 단위 생활문화 강좌 공급 규모를 살펴보는 데 쓴다. 문화시설코드 같은 전역 조인 키가 없어 다른 문화시설 데이터와는 시설명(해남문화예술회관)이나 같은 기관 기준으로만 이어 쓴다.
