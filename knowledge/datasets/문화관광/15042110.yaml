summary_user: 전주시에 소재한 출판사를 한 곳씩 담은 목록 파일로, 등록구분·사업체명칭·주소와 데이터기준일자를 개별 사업체 단위로 담는다. 전주시 안 어느 구·동에 출판사가 몰려 있는지, 특정 출판사가 전주에 신고돼 있는지 확인하려는 출판 지원사업 담당자나 지역 문화산업 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업체명칭이나 주소를 맞춰 붙여야 하며, 주소를 좌표로 바꿔 인쇄업·문화시설 위치 데이터와 겹쳐 보는 방식으로 이어 쓴다.
limits: 사업자번호나 신고번호 같은 공통 식별 키가 실측 컬럼에 없어 다른 기관 데이터와 정확히 1:1로 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위가 전주시 한 곳이라 다른 시군구나 전국 출판사 현황은 담지 않는다.
