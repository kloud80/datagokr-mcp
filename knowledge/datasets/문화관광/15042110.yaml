description_portal: '전북특별자치도 전주시 내 출판사 현황 정보입니다.제공부서 : 전주시 완산구·덕진구 여성가족과본 공공데이터는 전주시에 위치한 출판사의 현황을 정리한 자료입니다. 본 자료는 전주시 내 출판사의 이름, 소재지 등의 정보를 포함하고 있습니다. 본 데이터를 통해 전주시 내 출판산업의 분포를 파악할 수 있습니다.지역별 출판사 밀집도 분석, 출판산업 지원사업 대상 선정, 문화콘텐츠 산업 현황 조사, 출판사 위치 기반 지도 서비스 구축, 문화시설 및 인쇄업 데이터와 연계한 산업 분석, 등에 활용가능합니다. 본 데이터는 연마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.'
