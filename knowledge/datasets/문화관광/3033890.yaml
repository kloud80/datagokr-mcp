summary_user: 대전광역시 중구 관내 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업종(숙박업 일반·생활 구분), 업소명, 도로명·지번 주소, 전화번호, 운영 중인 총 객실수를 담는다. 여행객이 중구에 있는 숙소와 연락처를 찾거나, 분석가가 중구 숙박시설의 업종별 분포와 객실 공급 규모를 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 맞춰 잇는다. 예를 들어 공중위생 인허가 원천(LOCALDATA) 숙박업 자료와 대조할 때도 이 방식으로 연결한다.
