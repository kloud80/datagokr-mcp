description_portal: '안양시 관내의 공연장 현황(관내 공연장 종류, 관내 공연장 대상명, 관내 공연장 대표자, 관내 공연장 연락처, 관내 공연장 소재지)데이터 정보입니다.데이터 설명: 안양시_공연장 현황이 데이터는 「공연장법」에 따라 경기도 안양시 관내에서 등록된 공연장의 현황을 수록한 자료입니다. 공연장은 연극, 음악, 무용, 전통예술 등 다양한 문화예술 공연이 이루어지는 공간으로, 본 데이터는 시민의 문화 향유 기회 확대와 공연 인프라 분석을 위해 다음과 같은 정보를 제공합니다: 주요 제공 항목:- 공연장명: 공연장의 공식 명칭- 공연장 종류: 예) 전문공연장, 일반공연장 등- 대표자명: 공연장 운영자 또는 대표자- 소재지 주소: 공연장의 위치 정보- 연락처: 공연장 전화번호- 데이터 기준일자: 정보가 수집된 기준 날짜이 데이터는 지역 문화예술 인프라 분석, 공연장 분포 파악, 문화정책 수립, 시민 문화 접근성 향상 등에 활용될 수 있으며, 특히 공연예술단체, 기획사, 문화기관 등 민간 활용도가 높은 기초자료입니다.'
