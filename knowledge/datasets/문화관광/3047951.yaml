summary_user: 경상북도 경주시에 등록된 외국인관광 도시민박업소를 업소 한 곳당 한 행으로 담은 파일로, 상호·업종·등록일자·도로명 소재지·우편번호를 담는다. 경주에서 외국인 관광객이 묵을 수 있는 도시민박이 어디에 몇 곳 있는지, 언제부터 등록됐는지를 확인하려는 관광객·숙박 사업자·관광 기획 담당자가 쓴다. 전역 조인 키나 코드표는 없어 다른 숙박업·관광사업 데이터와는 상호나 도로명 주소를 맞춰 이어 써야 한다.
