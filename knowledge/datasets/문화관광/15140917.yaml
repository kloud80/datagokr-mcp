summary_user: 서울 광진구에서 외국인관광도시민박업 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일자·취소일자·영업상태·휴폐업일자·지번/도로명 주소·업소명·객실 수·건물 층수 같은 항목이 들어 있고 범위는 시군구 하나다. 광진구에서 지금 영업 중인 외국인 대상 도시민박이 어디에 몇 곳 있는지, 언제 인허가를 받았고 폐업했는지를 확인하려는 주민·사업자·관광정책 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 자치구의 같은 인허가 데이터나 숙박업 데이터와는 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 내에서 외국인관광도시민박업 인허가를 받아 운영 중인 업소의 현황 정보를 제공합니다. 외국인관광도시민박업은 도시 지역의 일반 주택에 거주하는 주민이 자신의 거주 공간 일부를 활용해, 외국인 관광객에게 숙박과 함께 한국의 가정 문화를 체험할 수 있는 기회를 제공하는 숙박업 형태입니다. 데이터에는 업소명, 소재지, 인허가일자, 업종 구분 등의 정보가 포함되어 있으며, 외국인 대상의 체험형 숙박시설 운영 현황, 지역 내 관광 수용력, 문화 교류 기반 구축 등에 활용할 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도 좌표는 포함되어 있지 않으므로 지도 기반 서비스 활용 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준으로 정기 갱신되며, 외국인 관광 활성화 정책, 숙박 인프라 관리, 생활형 관광모델 분석 등에 유용합니다.
