    source: portal_meta:보유근거
legal_basis_portal: 도서관 법 제32조(공공도서관의 업무) 공공도서관은 공중의 정보이용, 문화활동, 평생학습 등의 기능을 발휘할 수 있도록 다음 각 호의 업무를 수행한다.1. 공중을 위한 도서관자료의 수집ㆍ정리ㆍ보존 및 제공2. 공중의 문화활동 및 평생학습에 필요한 프로그램의 제공 및 장려3. 독서의 생활화를 위한 계획의 수립 및 실시4. 다른 도서관과의 긴밀한 협력 및 도서관자료의 상호대차(相互貸借, 도서관 간에 도서관자료를 서로의 이용자에게 빌려주는 것을 말한다)5. 지역 특성에 따른 분관 등의 설립 및 운영6. 그 밖에 공공도서관으로서 기능을 수행하는 데 필요한 업무
