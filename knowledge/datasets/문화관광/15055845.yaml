description_portal: (2025년) 광주광역시에서 지정한 우수숙박업소(크린숙박업소)에 대한 현황자료입니다.(연번,업소명,소재지,객실수)광주광역시는 숙박문화 개선과 위생관리 수준 향상을 위해 관내 중저가 숙박업소 중 시설과 서비스가 우수한 업소를 “크린숙박업소(우수숙박업소)”로 지정하여 운영하고 있습니다. 우리 시를 찾는 국내외 관광객과 시민 여러분께서는 지정 업소를 적극 이용해 주시기 바라며, 이용 중 불편한 사항은 알려주시면 즉시 개선하여 쾌적한 숙박환경을 제공하겠습니다. 현재 동구, 서구, 남구, 북구, 광산구에 걸쳐 총 99개소가 지정돼 있으며, 각 업소는 위생, 편의시설, 친절서비스 등 엄격한 심사를 거쳐 선정되었습니다.
