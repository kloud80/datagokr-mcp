summary_user: 서울 종로구 관내 체육도장업소(태권도장·유도장·합기도장 등)의 인허가 정보를 업소 한 곳당 한 행으로 담은 명부로, 인허가일자·취소일자, 영업상태와 상세 영업상태, 폐업일자, 휴업 기간, 소재지 지번·도로명 주소, 좌표, 업소명, 지도자 수, 건물 면적 등을 포함한다. 종로구에 지금 영업 중인 태권도장이 어디에 몇 곳 있는지, 최근 몇 년간 체육도장 창업·폐업이 어떻게 변했는지 알고 싶은 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설업 인허가 데이터나 상권 데이터와는 업소명·주소·좌표 매핑이나 같은 지자체 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 체육도장업소에 대한 인허가 정보를 정리한 공공데이터입니다. 주요 항목에는 지방자치단체 코드, 사업체 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등이 포함되어 있으며, 태권도장, 유도장, 합기도장 등 체육도장업의 운영 현황을 확인할 수 있습니다. 해당 자료는 업소의 인허가 이력과 영업 상태별 분포를 파악하여, 체육시설 안전관리, 생활체육 기반 조성, 지역주민 건강증진을 위한 행정계획 수립에 기초자료로 활용됩니다. 또한 체육도장의 창업 및 폐업 추이를 분석하고, 인허가 절차의 적정성 검토, 업종별 수요 예측 등 체육산업 진흥정책 수립에 유용한 행정정보로 제공됩니다.
