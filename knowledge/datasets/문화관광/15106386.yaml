summary_user: 전라남도에 등록된 야영장을 한 곳당 한 행으로 담은 등록 현황 파일로, 시군구·소재지·소유주체(공립·민간)·업종·등록일과 부지면적·사이트수·글램핑 시설 수·전기·가스시설 여부, 보험 가입·방염 기준 충족 여부 등을 담는다. 캠핑객이 특정 시군에서 전기시설이 있는 야영장을 찾거나, 분석가가 시군별 야영장 규모와 안전요건 준수 현황을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 야영장 명칭·소재지 주소나 시군구 이름을 맞춰 연결한다.
description_portal: '- 전라남도에  등록된 야영장 (시군별, 소재지,  공립, 민간, 부지면적, 전기시설, 가스시설, 업종 등) 등록현황을 제공합니다.- 전라남도에는 자연 속에서 캠핑과 야영을 즐길 수 있는 다양한 야영장이 있습니다. 가족 단위나 단체, 커플 등 다양한 여행객들이 편안하게 이용할 수 있는 시설들이 마련되어 있습니다. - 예약 방법: 각 야영장의 공식 웹사이트나 전화로 사전 예약이 필요합니다.- 이용 시기: 성수기(7~8월)에는 예약이 조기에 마감될 수 있으므로 미리 계획하는 것이 좋습니다.- 준비물: 텐트, 취사도구, 개인 위생 용품 등을 준비하시고, 시설에 따라 제공되는 장비나 용품이 다를 수 있으므로 사전에 확인하시기 바랍니다.- 교통편: 대중교통 이용이 어려운 지역도 있으므로 자가용 이용을 권장합니다.'
