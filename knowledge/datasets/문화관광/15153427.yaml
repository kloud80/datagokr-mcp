summary_user: BIGKinds에서 모은 의대 증원 관련 뉴스 기사를 기사 1건당 1행으로 담은 CSV 파일(약 165MB)로, 기사 주소·보도 일자·언론사·제목·통합분류 1~3단계·인물·지역·기업기관 개체명·키워드·특성추출 값·본문이 들어 있다. 언론 연구자나 보건의료 정책 분석가가 '의대 정원 확대 논의가 어느 시기에 집중 보도됐고 어떤 키워드와 프레임으로 다뤄졌는가'를 살필 때 쓴다. 다른 데이터와 바로 맞물리는 전역 조인 키는 없으므로, 보도 일자로 정책 발표 일정과 시기를 맞추거나 지역 개체명·언론사 이름을 문자열로 대조해 이어 쓴다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 의대 증원 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적 분석이 가능합니다.본 자료는 국내 주요 언론사의 의대 증원 관련 보도를 대상으로, 어떤 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 보도 프레임이 어떠했는지 등의 패턴을 밝히는 데 중점을 두고 있습니다. 이러한 분석은 언론이 의대 정원 확대 논의를 어떻게 다루는지, 의료 인력 수급 문제, 의료계·정부·시민사회 간의 갈등, 지역 의료 격차 등과 같은 핵심 쟁점이 어떤 방식으로 보도되는지를 파악하는 데 유용합니다.또한 학계, 언론 연구자, 보건의료 정책 전문가, 공공정책 분석가 등에게 의대 증원 관련 보도의 경향, 이슈별 프레임 변화, 언론의 보건의료 이슈 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
