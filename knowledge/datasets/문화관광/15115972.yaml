description_portal: '서울특별시 중구의 영사막 및 다수의 객석과 비디오물 시청기자재를 갖추어 비디오물만을 전용으로 제공하는 업소 정보입니다. 데이터는 각 등록업소에 부여된 관번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 영상산업 분야의 문화공간 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 등급분류 등 법적 절차를 거친 상영시설에서 청소년보호 기준을 준수하며 운영되는 신뢰할 수 있는 영상관람실 문화공간의 위치를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
