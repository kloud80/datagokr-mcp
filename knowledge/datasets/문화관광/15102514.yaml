description_portal: 수원 박물관 사업소 이용 매표 현황은 수원을 찾는 많은 관광객들이 우리 수원의 역사와 문화 등을 널리 알리고 수원 박물관을 방문하는 관람객 등을 위한 표준 데이터를 제공하고 있습니다.수원시 내의 3개 수원박물관, 화성박물관, 광교박물관을 방문하는 관광객 및 시민들에게 연도별 , 시설별, 권종, 상세권종[유료,무료, 교육참가자(어른, 장애인, 경로,어린이,청소년, 군인,자원봉사자,국가유공자 ,어린이체험실,수원시민(다자녀2명 이상)등)] 이용객수, 매표수익등을 분기별로 이용 현황을 업데이트하여 제공합니다.
