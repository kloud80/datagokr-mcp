summary_user: 서울시 전역 공공도서관을 도서관 한 곳당 한 행으로 담은 목록으로, 도서관명·자치구·주소·전화·홈페이지·운영시간·정기 휴관일·도서관 유형(공공·어린이·작은도서관 등)·위경도를 포함한다. 시민이 '우리 구에서 일요일에 여는 어린이도서관이 어디인가'를 찾거나, 분석가가 자치구별 도서관 분포를 지도에 올려 보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 도서관정보나루의 대출·인기도서 데이터와는 도서관명·주소 매칭으로 잇고, 자치구 코드(GU_CODE)나 위경도로 다른 서울시 구별·공간 데이터와 맞춘다.
description_portal: 서울시 공공도서관 현황정보는 서울시 전역에 위치한 공공도서관의 기본 정보를 제공하는 데이터입니다. 도서관명과 구명, 주소를 통해 도서관의 위치와 행정 구역을 쉽게 파악할 수 있으며, 전화번호와 홈페이지 URL은 이용자가 도서관에 직접 문의하거나 온라인 서비스를 이용하는 데 도움을 줍니다. 운영시간과 정기 휴관일 정보는 도서관 방문 가능 시간을 확인하고 효율적으로 이용 계획을 세우는 데 유용합니다. 또한 도서관 구분명은 공공도서관, 어린이도서관, 작은도서관 등 도서관 유형을 이해하는 데 활용되며, 위도와 경도 값은 지도를 통한 위치 검색, 내 주변 도서관 찾기 서비스, 길찾기 연계 등 공간 정보 서비스에 활용 가능한 기초 자료입니다.
