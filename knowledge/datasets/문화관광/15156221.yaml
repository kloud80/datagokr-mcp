summary_user: 빅카인즈(BIGKinds)에 수록된 국내 언론사의 비트코인·가상자산 관련 뉴스를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV, 약 40MB)로, 보도 일자·언론사·제목·통합분류 1~3단계·인물/지역/기업·기관 개체명·키워드·특성추출 값을 포함한다. 금융·경제 연구자나 언론·커뮤니케이션 연구자가 'SEC의 비트코인 ETF 승인 전후로 국내 언론 보도량과 주요 키워드가 어떻게 달라졌나' 같은 질문에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 보도 일자로 가격·시장 지표 시계열에 맞추거나 언론사명·기업명 같은 이름을 맞춰서만 연결된다.
limits: 다른 데이터와 바로 붙일 공통 코드가 없어 언론사·기업·인물은 이름 문자열로 매핑해야 한다. 비공간 자료라 지역별 분석은 개체명(지역) 텍스트에 기댈 수밖에 없다.
