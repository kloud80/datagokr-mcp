summary_user: 부산광역시 구·군이 지정한 모범음식점을 업소 한 곳당 한 행으로 담는 API로, 업종·업태(한식·중식·일식 등), 업소명, 도로명·지번 주소, 대표 메뉴, 전화번호, 지정일, 위경도 좌표를 포함한다(포털 설명 기준 2025.5.19 현재 285곳). 관광객이나 시민이 '해운대구에서 모범음식점으로 지정된 횟집은 어디이고 대표 메뉴는 무엇인가'를 찾거나, 여행 앱 사업자가 지역 음식점 정보를 보강하는 데 쓴다. 공통 조인 키는 없어서 다른 데이터와는 구군명(gugun)·주소 문자열이나 위경도 좌표로 맞춰 이어 쓴다.
description_portal: 부산광역시 구군에서 지정한 모범음식점 현황입니다. 업종, 업태(한식, 중식, 일식 등), 업소명, 주소(지번, 도로명), 메뉴, 소재지, 전화번호 등이 포함되어 있습니다. 총 285개의 음식점이 있습니다. 강서구 3곳, 북구 4곳, 영도구 5곳, 남구 8곳, 서구 9곳, 사상구 14곳, 연제구 14곳, 수영구 16곳, 기장군 17곳, 중구 17곳, 동구 19곳, 동래구 22곳, 해운대구 26곳, 사하구 32곳, 금정구 33곳, 부산진구 46곳의 업체가 포함되어 있습니다. 한식집이 214곳으로 가장 많고 횟집 24곳, 중식집 15곳, 일식집 12곳, 분식집 8곳, 경양식집 4곳, 뷔페식 3곳, 패스트 푸드 1곳, 외국음식전문전(태국, 인도) 1고, 기타 3곳 등 총 285곳의 모범음식점이 있습니다*기준일 2025.5.19 현재
