summary_user: 전라남도 고흥군의 숙박업 신고 사업장을 한 곳씩 담은 건별 현황 파일로, 사업장명·인허가일자·영업상태·폐업일자·주소와 좌표, 한실·양실 객실 수와 건물 층수 등을 사업장 단위로 담는다. 고흥군에서 지금 영업 중인 펜션·민박·호텔이 어디에 몇 곳 있고 객실 규모가 어느 정도인지 알아보려는 여행자·숙박 사업자·관광 분석가가 쓴다. 전역 공통 조인 키는 없어서 같은 지방행정 인허가(LOCALDATA) 계열의 다른 업종 데이터와는 개방자치단체코드·관리번호로, 그 밖의 데이터와는 사업장명·주소·좌표를 맞춰 잇는다.
description_portal: 전라남도 고흥군 숙박업 현황에 대한 데이터로 영업상태명, 소재지면적, 지역구분명, 사업장명, 위생업태명, 양실수, 건물소유구분명 등을 제공합니다.
