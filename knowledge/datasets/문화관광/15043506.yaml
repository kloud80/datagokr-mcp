summary_user: 제주 유리의성 한 곳의 무장애여행 정보를 담은 파일로, 위도·경도·해발고도 같은 위치 좌표와 장소 설명, 이미지, 주차장·진입로·내부 동선 등 장애인 편의시설 현황을 담는다. 휠체어 이용자나 고령 동반 가족이 유리의성의 주차와 진입로, 내부 이동이 가능한지 미리 확인하거나, 관광 안내 서비스 개발자가 무장애 관광지 정보를 지도에 표시할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 TourAPI contentId 같은 공통 코드로는 연결되지 않고, 장소명이나 좌표로 TourAPI 관광지 정보나 다른 제주 무장애여행 파일과 맞춰 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 유리의성 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 제주 유리의성은 유리공예를 중심으로 한 전시관·조형물·테마파크로, 관람객이 남녀노소 누구나 체험과 관람을 즐길 수 있도록 설계된 복합 관광지이다. 본 무장애여행 정보 데이터셋은 위치 좌표, 장소 설명, 이미지, 장애인 편의시설 현황 등을 포함하며, 주차장, 진입로, 내부 동선, 이동 지원 설비 등을 통해 장애인 및 교통약자의 접근성과 이용 편의를 고려한 정보를 제공한다. 이 데이터는 무장애 관광지로서의 적합 여부를 객관적으로 판단할 수 있도록 정리된 자료로, 관광 정책, 정보 제공, 이용자 안내 등에 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
