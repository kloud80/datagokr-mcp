summary_user: 제주관광공사가 운영하는 비짓제주에 운영자가 입력한 음식점 콘텐츠를 음식점 1곳당 1행으로 담은 파일로, 포털 설명 기준 2,884건이며 노키즈존·예약 가능 여부·룸 보유 여부·유아 서비스·평일/주말 영업시간·휴식시간·대표 메뉴를 담는다. 아이를 데리고 제주 여행을 가는 가족이나 여행 앱 사업자가 '노키즈존이 아니고 룸이 있으며 예약되는 식당이 어디이고 주말 몇 시까지 여는가'를 확인하는 데 쓴다. 실측 컬럼에 주소·좌표·사업자번호·TourAPI 콘텐츠ID 같은 공통 조인 키가 없어 다른 관광·음식점 데이터와는 음식점 이름(콘텐츠명)으로만 맞춰 이어 써야 한다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 음식점콘텐츠 내역입니다.- 해당 데이터는 운영자가 비짓제주 관리자페이지에서 음식점 정보를 입력할 때 저장하여 생성합니다.- 개방데이터 항목은 콘텐츠명, 노키즈존, 예약가능여부, 룸보유여부, 유아서비스기타, 평일오픈시간, 평일클로즈시간, 주말오픈시간, 주말클로즈시간, 휴식시작시간, 휴식종료시간, 대표메뉴기타이며 전체 데이터 수는 2,884건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 음식점별 상세 정보 제공, 가족 및 다양한 연령대 이용객 편의성 증대, 예약 및 룸 정보 기반 맞춤형 추천 서비스 개발, 대표 메뉴 및 운영 시간 정보를 통한 관광객 만족도 향상, 지역 음식점 활성화 및 마케팅 자료 활용 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
