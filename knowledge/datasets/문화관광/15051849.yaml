summary_user: 서울도서관에서 일정 기간 가장 많이 대출된 도서 100권을 권별로 담은 집계 목록으로, 제목·저자·발행처·발행연도·ISBN·분류기호와 대출 횟수(CNT)를 포함한다. 도서관 사서나 독서 경향을 보는 분석가가 '서울도서관 이용자가 요즘 가장 많이 빌린 책과 분야는 무엇인가'를 확인하고 추천 도서·장서 확충 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키는 없지만 ISBN 값을 기준으로 도서관정보나루(data4library.kr) 대출 데이터나 국가서지 정보와 맞춰 볼 수 있다.
description_portal: 서울도서관 인기대출 도서목록 100선 정보는 서울도서관에서 일정 기간 동안 가장 많이 대출된 도서 100권의 세부 정보를 정리한 데이터입니다. 각 도서의 식별을 위한 제어번호, 제목, 저자, 발행처, 발행연도, ISBN과 같은 서지 정보뿐 아니라 도서 분류기호와 실제 대출 횟수까지 포함되어 있어 어떤 분야와 저자가 이용자들에게 높은 선호도를 보였는지 파악할 수 있습니다. 이 자료는 이용자들의 독서 경향 분석, 도서관 장서 구성 및 확충 전략 수립, 추천 도서 서비스 운영 등에 활용되며 대출 패턴을 기반으로 한 독서 문화 조성 방향을 마련하는 데 중요한 자료로 사용됩니다.
