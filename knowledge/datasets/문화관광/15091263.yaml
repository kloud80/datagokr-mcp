summary_user: 인천광역시 남동구 안의 테니스장을 한 곳당 한 행으로 담은 시설 목록 파일로, 업체명·소재지 주소·전화번호·데이터 기준일자를 담는다(CSV 744바이트의 소규모 파일). 남동구 주민이 "집 근처 테니스장이 어디이고 연락처는 무엇인가"를 확인하거나, 분석가가 구 단위 테니스 시설 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 소재지 주소나 업체명을 맞춰 보거나 같은 기관(남동구) 데이터끼리만 이어 쓴다.
limits: 범위가 남동구 한 곳의 개별 시설이라 인천 전체나 전국 비교에는 다른 지자체 자료나 전국체육시설 DB가 따로 필요하다. 좌표·시설코드 같은 공통 키가 없어 다른 데이터와 붙이려면 주소 지오코딩이나 이름 매칭을 거쳐야 한다. 예약·대관 정보는 담지 않는다.
