description_portal: 이 데이터는 한국언론진흥재단의 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 범죄 보도율 메타정보 자료입니다. 특정 시기별로 주요 언론사가 보도한 기사 중 범죄 관련 보도의 비중을 정량화했으며, 범주에는 이상동기 범죄, 폭력·강도·살인 범죄, 성범죄 등이 포함됩니다. 이를 통해 범죄 유형별 언론 보도 경향과 특정 시기의 사회적 관심도를 파악할 수 있으며, 범죄 보도가 사회적 불안과 정책 담론 형성에 어떤 영향을 주었는지도 분석할 수 있습니다. 특히 일자별 데이터로 제공되므로 특정 사건이나 사회적 사건 발생 전후의 보도 변화를 정밀하게 추적할 수 있습니다. 본 자료는 언론 보도 연구, 범죄학적 분석, 사회 인식 조사, 정책 수립 등 다양한 분야에서 활용할 수 있는 기초 데이터로서, 범죄와 언론의 관계를 심층적으로 이해하는 데 중요한 기반이 됩니다.
