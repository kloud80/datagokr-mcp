description_portal: 서울시 호텔리스트 현황(영어) 데이터는 서울 내 호텔 정보를 외국인 관광객과 국제 서비스 이용자를 위해 영어로 제공하기 위해 구축된 자료입니다. 메인 키는 각 호텔을 식별하는 고유 식별번호이며, 영문 명칭은 해외 이용자가 호텔을 정확히 인지하고 검색할 수 있도록 지원합니다. 행정 시·행정 구·행정 동 정보는 호텔의 위치를 영문 표기 방식으로 제공하여 지도 검색, 관광 플랫폼 연동, 숙박 정보 서비스 구축에 활용됩니다. 이 데이터는 서울 관광 서비스의 국제화와 외국인 편의 증진에 중요한 기반 자료로 사용됩니다.
