summary_user: 한국관광공사 TourAPI 기반으로 장애인·고령자·영유아 가족 등이 이용할 수 있는 무장애 관광정보를 지역·위치·키워드 등 13종 오퍼레이션으로 제공하는 API이며, 전국 범위에 주소·좌표를 가진 개별 관광지 단위 정보를 담는다. 휠체어 이용자나 고령자 동반 가족이 가려는 지역에서 접근 가능한 관광지를 찾는 여행 앱·서비스 개발자가 쓴다. 지역코드(code)와 contentId, 법정동코드(lDongRegnCd), 분류체계코드(lclsSystm1)를 같은 기관 코드로 이어 쓰며, 다른 기관 데이터와 잇는 전역 조인 키는 실측에서 확인되지 않았다.
description_portal: "- 국내관광정보서비스 OpenAPI 신규 상세기능(법정동코드, 신분류코드) 안내 URL(https://api.visitkorea.or.kr/#/cmsNoticeDetail?no=207)- 장애인, 고령자, 영유아가족 등 '모든 관광객'이 이동의 불편 및 관광활동의 제약없이 이용할 수 있는 장애물 없는 정보이며,국내 최대 무장애 관광정보 포털 사이트 열린관광 모두의여행(access.visitkorea.or.kr) 홈페이지에서 제공하는 관광정보 중 저작권 등에 구애 없이 자유롭게 활용 가능한 정보만을 선별하여 OpenAPI를 통해서 최신정보를 제공하고 있습니다. - 개방 데이터는 지역코드정보, 서비스분류코드정보, 법정동코드정보, 분류체계코드정보, 지역기반관광정보, 위치기반관광정보, 키워드검색, 공통정보, 소개정보, 반복정보, 이미지정보, 무장애 정보, 무장애 여행정보 동기화 목록정보 13종 약 6만 건의 국내 관광에 대한 전반적인 정보를 국문로 제공합니다.- 모바일 앱 뿐만 아니라, 웹서비스, 태블릿, 홍보물, 잡지 등 다양한 매체에서 어플리케이션을 개발, 활용할 수 있으며 다양한 활용을 통해서 신규/융복합 관광서비스를 창출할 수 있습니다. ※ 제공되는 데이터중 사진 자료의 경우, 피사체에 대한 명예훼손 및 인격권 침해 등 일반 정서에 반하는 용도의 사용 및 기업 CI,BI로의 이용 금지하고 있습니다. (공공누리 1유형, 3유형 이미지 제공됨)"
