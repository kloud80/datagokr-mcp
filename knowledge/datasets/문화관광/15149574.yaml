summary_user: 거제시 시립도서관의 문서·일정 관리 기록을 건별로 담은 CSV 파일(약 5.7MB)로, 도서명·저자·카테고리 제목·문서 제목·출력날짜·이전 데이터 등록일 같은 항목이 들어 있다. 도서관 업무 분석가가 거제시 시립도서관이 어떤 분류의 문서와 일정을 언제 등록·출력했는지 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 도서관 데이터와 붙이려면 도서명·저자 같은 이름 매핑이나 같은 기관(거제시) 기준으로만 연결한다.
description_portal: 이 데이터는 경상남도 거제시 시립도서관의 문서관리 정보를 제공하는 공공데이터입니다. 도서키값, 도서명, 저자, 저널내용, 완료키값, 출력날짜 등 도서 및 문서 관련 주요 정보가 포함되어 있습니다. 또한 문서 분류에 해당하는 카테고리 제목과 문서 제목, 이전 데이터의 고유키 및 등록일, 일정 ID, 일정명, 일정내용 등 일정 정보도 함께 포함되어 있습니다. 일부 항목은 테이블 간 연계 과정에서 참조값이 존재하지 않거나, 아직 입력되지 않아 비어 있는 경우가 있습니다. 이는 데이터 수집 및 등록 단계에서의 상황에 따른 것입니다.  이용자는 이 점을 참고하여 데이터를 분석 및 활용할 수 있습니다. 본 데이터는 도서관의 문서 및 일정 관리 업무를 이해하고 활용하는 데 유용하게 활용될 수 있습니다.
