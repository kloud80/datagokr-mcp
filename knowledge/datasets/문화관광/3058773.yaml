summary_user: 한국공예디자인문화진흥원 자료실에 새로 들어온 도서를 한 권당 한 행으로 서명·저자·출판사·출판년만 담은 작은 목록 파일(CSV 약 7.6KB)이다. 공예인·디자이너나 연구자가 '이 전문 자료실에 최근 어떤 공예·디자인 책이 들어왔나'를 훑어보고 방문·열람할 책을 고르는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어서, 다른 도서관 목록이나 도서관정보나루 자료와는 서명·저자 문자열을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 한국공예디자인문화진흥원 자료실은 공예·디자인 관련 전문 자료를 체계적으로 수집 및 정리하여 공예인과 디자이너들이 쉽게 활용할 수 있도록 2009년 4월 개관하여 운영 중인 국내 최초의 공예·디자인 전문 자료실입니다. 해당 데이터는 한국공예디자인문화진흥원 자료실의 신착도서목록 데이터로 서명, 저자, 출판사, 출판연도 항목을 제공합니다. 한국공예디자인문화진흥원 자료실(library.kcdf.kr) 웹사이트를 통해  자료실 도서의 목차, 표지이미지 등 상세정보를 확인할 수 있습니다.
