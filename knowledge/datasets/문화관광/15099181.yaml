description_portal: 서울특별시 마포구에 소재하고 있는 공공조형물의 현황입니다.공공조형물은 도시의 미관을 향상시키고, 시민의 문화적 향유 기회를 증대시키며, 지역 정체성 형성과 사회적 메시지 전달 등의 목적으로 설치되고 있습니다. 최근에는 도시공간의 효율적 활용,  유지관리의 체계화 필요성 등이 대두됨에 따라 공공조형물에 대한 관심과 정보 활용 수요가 증가하고 있습니다.이에 따라 조형물의 명칭과 소재지 주소(지번주소)를 제공합니다. 정몽주 선생 동상, 황포 돛배, 토정 선생 동상 등이 포함되어 있습니다.
