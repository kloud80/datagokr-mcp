description_portal: 본 데이터는 경상북도 경주시의 상상황리단길 일대 골목 공간을 고해상도 가상현실(VR) 영상으로 구현한 현황 자료이다. 경주는 문화관광도시로서 특색 있는 골목길을 관광자원으로 활용하기 위해 본 자료를 구축하였다. 본 데이터는 골목길의 VR 촬영 영상, 위치정보, 구조 특성, 메타데이터 등으로 구성되어 있으며, 비대면 관광 체험, 콘텐츠 제작, 지역 홍보 및 연구 목적으로 활용 가능하다. 특히, 현장 방문이 어려운 외부 이용자나 연구자, 기획자에게 생생한 골목 환경을 제공함으로써 경주시 원도심의 문화적 가치와 현장감을 효과적으로 전달하는 데 기여한다.
