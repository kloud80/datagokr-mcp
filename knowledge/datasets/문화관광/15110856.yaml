description_portal: 본 데이터는 2022년 12월 16일을 기준으로 경상남도 남해군의 다양한 낚시터(유어장 포함)에 대한 종합 현황 정보를 제공하여, 낚시 애호가 및 국내외 관광객의 레저 활동 편의 증진과 지역 해양레저관광 산업의 활성화를 목표로 합니다. 각 낚시터별 공식 명칭, 방문객이 쉽게 찾아갈 수 있도록 정확한 '주소', 지리 정보 시스템(GIS) 분석 및 내비게이션 연동에 필요한 '위도'와 '경도' 좌표, 그리고 실제 낚시가 이루어지는 '유어장면적' 등 핵심 정보를 상세히 포함하고 있습니다. 특히, 본 자료는 국문뿐만 아니라 영문, 중문, 일문 등 총 4개 국어로 주요 정보를 제공함으로써 다양한 국적의 방문객들이 남해군의 우수한 낚시 명소를 보다 쉽게 탐색하고 관련 정보를 얻을 수 있도록 정보 접근성을 크게 향상
