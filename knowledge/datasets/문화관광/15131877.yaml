summary_user: 문화재 수리기술자 한 사람마다 기술종목(단청·보수·보존과학·식물보호·실측설계·조경 등), 성별, 소속 업체, 퇴사 여부(비고)를 담은 전국 단위 명단형 파일(CSV)입니다. 수리업체를 고르거나 조사하는 사업자·분석가가 특정 업체에 어떤 종목의 기술자가 소속돼 있는지, 종목별 인력이 어떻게 분포하는지 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업체명 같은 이름 매칭으로만 연결하고, 유산 지정번호나 소재지 코드로는 이어지지 않는다.
description_portal: 수리기술자 소속정보 현황 데이터는 기술종목, 성별, 업체, 비고(퇴사여부) 등을 보실 수 있씁니다. 기술종목에는 단청, 보수, 보존과학, 식물보호, 실측설계, 조경 항목이 있습니다.“국가유산청_수리기술자 소속정보 현황”은 문화재 수리 분야에서 활동하는 기술자들의 소속 정보와 관련된 공공데이터입니다. 이 데이터는 문화재 수리 기술자들의 기술 종목, 성별, 소속 업체, 퇴사 여부 등을 포함하고 있어, 수리 인력의 분포와 현황을 파악하는 데 유용합니다. 주요 기술 종목으로는 단청, 보수, 보존과학, 식물보호, 실측설계, 조경 등이 있으며, 총 7,882건의 데이터가 포함되어 있습니다. 이 정보는 문화재 수리 실명제의 일환으로 제공되며, 문화재 수리의 투명성과 신뢰성을 높이는 데 기여하고 있습니다.해당 데이터는 공공데이터포털에서 CSV, XML, JSON 형식으로 제공되며, 누구나 무료로 다운로드하여 활용할 수 있습니다. 또한, 오픈 API를 통해 데이터 연계 및 활용이 가능하므로, 관련 분야의 연구자나 기업들이 참고하기에 적합한 자료입니다.데이터에 대한 자세한 정보나 다운로드는 공공데이터포털의 국가유산청_수리기술자 소속정보 현황 페이지에서 확인하실 수 있습니다.
