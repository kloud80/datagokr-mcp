summary_user: 경상남도 숙박업 인허가 사업장 3,613건을 사업장 한 곳당 한 행으로 담은 2023년 기준 1회성 현황 파일로, 사업장명·지번/도로명 주소·인허가일자·영업상태·업종구분·다중이용업소 여부가 들어 있다. 경남 지역에서 시군·읍면동별로 영업 중인 숙박업소가 얼마나 되고 언제 인허가를 받았는지 보려는 분석가나 숙박 창업을 검토하는 사업자가 지역 숙박 공급 현황을 파악하는 데 쓴다. 공통 조인 키는 없어서 다른 데이터와는 주소나 사업장명을 맞춰 이어야 하며, 공중위생법 신고 기반 전국 인허가 원천(LOCALDATA) 숙박업 자료와 대조하는 용도로 쓴다.
limits: 2023년 기준 1회성 데이터라 이후 갱신되지 않으므로 현재의 영업 여부는 따로 확인해야 하고, 미집계 항목은 빈칸으로 남아 있다. 전역 조인 키가 없어 다른 데이터와의 연결은 이름·주소 매칭에 기대야 한다.
