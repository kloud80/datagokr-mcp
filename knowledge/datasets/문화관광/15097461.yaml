summary_user: 제주 금악리 일대 골목 식당 투어 코스의 무장애 관광 정보를 구분·유형·추천여부·비고 항목으로 담은 지자체 관광 콘텐츠 파일이다. 휠체어 이용자·고령자·유아 동반 여행객이 '금악리 식당 거리에 주차장과 화장실 같은 편의시설이 있는지' 미리 확인하거나, 관광 담당자가 접근 편의시설 개선 지점을 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장소 이름 매핑이나 같은 기관(제주특별자치도) 자료로만 이어 쓴다.
description_portal: '제주특별자치도 내 금악리골목식당투어_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도 금악리 골목식당투어 무장애여행관광정보」로, 제주 금악리 일대 골목 식당 투어 코스에 대한 무장애(Barrier-Free) 관광 정보를 담고 있다. 자료에는 식당 거리 투어의 개요, 위치, 주차장 및 화장실 등 접근 편의시설, 코스 안내, 휴무일 및 관람료 등의 기본 정보가 포함되어 있으며 각 포인트(화장실, 주차장 등)의 사진 이미지도 제공된다. 이동 약자(장애인, 고령자, 유아 동반자 등)가 사전 탐색을 통해 여행 계획을 세우고 실제 방문 시 편의성을 확보하는 데 유용하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
