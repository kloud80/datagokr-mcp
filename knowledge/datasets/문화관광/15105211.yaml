summary_user: 전국 관광지별로 주소·관리기관·좌표(lat, lon)와 공공편익·숙박·운동오락·휴양문화·접객·지원시설 현황, 주차·수용 인원, 내진 설계 등급, 지진해일 대피소 운영 상태 같은 안전·재난 대비 정보를 관광지 한 곳당 한 행으로 담는다. 여행객이나 지자체 관광 담당자가 "이 관광지의 수용 인원과 내진 등급은 어떤지, 가까운 지진해일 대피소가 운영 중인지"를 확인할 때 쓴다. 전역 조인 키가 없어 다른 관광·재난 데이터와는 관광지명(tourName)이나 시도·시군구 이름 매핑, 위경도 근접으로만 잇는다.
description_portal: 관광지의 안전과 관련된 다양한 정보를 한눈에 파악할 수 있도록 구성된 데이터셋입니다. 지번 주소, 도로명 주소, 관리기관명 등 기본 정보와 함께 공공편익시설, 숙박시설, 운동 및 오락시설, 휴양 및 문화시설, 접객시설, 지원시설 등 관광지 내 다양한 시설 현황을 제공합니다. 또한 주차 가능 여부, 수용 인원, 지정 일자, 내진 적용 여부, 내진 설계 등급, 해발 높이, 해안석 이격 거리 등 안전과 직결되는 세부 정보도 포함되어 있습니다. 지진해일 대피소 유형과 운영 상태, 대피 안내 표지판 수, 주민 대피 지구 내 인구 현황 등 재난 대비 정보도 함께 제공되어, 관광객과 관계자들이 안전한 여행 계획을 수립하는 데 유용하게 활용할 수 있습니다.
