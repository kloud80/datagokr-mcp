summary_user: 울산광역시 남구 주요 관광지(고래생태체험관, 고래문화마을, 태화강동굴피아)별로 월 방문객 수와 분기 합계를 관광지 한 곳당 한 행으로 담은 소규모 집계 CSV 파일(약 430바이트)이다. 지자체 관광 담당자나 분석가가 '남구 고래 관광지 중 어느 곳에 이번 분기 방문객이 많았고, 월별로 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키(관광지점코드·시군구코드)가 없어서, 다른 관광 통계나 지역 데이터와는 관광지명·주소를 직접 맞춰 연결해야 한다.
description_portal: 울산광역시 남구의 주요 관광지인 고래생태체험관, 고래문화마을, 태화강동굴피아의 월별 방문객 현황을 제공하는 데이터입니다. 제공 항목으로는 주요관광지명, 주소, 관리기관, 1월 방문객수, 2월 방문객수, 3월 방문객수, 1분기 총방문자수, 데이터기준일이 포함됩니다. 데이터 기준일은 2026년5월12일이며, 분기마다 갱신되며, 차기 등록 예정일은 2026년 8월 31일입니다. 관광객 추이 분석, 지역 관광 정책 수립, 관광 자원 활성화 전략 수립 등에 활용할 수 있는 기초자료입니다.※ 데이터 기준일은 데이터 추출일과 동일합니다.
