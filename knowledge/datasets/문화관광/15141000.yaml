summary_user: 서울 마포구에 신고·등록된 인쇄소 등 인쇄 전문 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일자·영업상태·폐업일자·주소·좌표·업종명 같은 항목을 함께 제공한다. 창업 예정자나 상권 분석가가 마포구에서 지금 영업 중인 인쇄소가 어디에 몰려 있는지, 최근 폐업한 곳은 얼마나 되는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 이어 쓴다.
description_portal: <인쇄문화산업 진흥법> 관련법에 따라 신고되어 등록된 서울특별시 마포구 소재의 인쇄소 등 인쇄를 전문으로 하는 업소 정보에 대한 설명입니다. 이 데이터에는 각 인쇄사의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 소재지우편번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민들과 행정기관은 관내 인쇄사의 위치와 자격 정보를 쉽게 확인하고, 관련 정책 수립 및 지원을 효율적으로 수행할 수 있습니다.
