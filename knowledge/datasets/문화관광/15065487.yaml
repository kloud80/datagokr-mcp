summary_user: 부산광역시가 지정한 전통사찰을 한 사찰당 한 행으로 담은 목록 파일로, 지정호수·사찰명·법명(주지)·도로명주소·전화번호·건물 동수·면적·등록일자·위도·경도를 포함한다. 부산에서 방문할 만한 전통사찰의 위치와 연락처를 찾는 시민·관광객, 또는 사찰별 규모와 지정 시기를 비교하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 문화재·관광 데이터와는 사찰명이나 주소로 맞추거나, 위도·경도로 지도·주변 시설 데이터와 공간 결합해 쓴다.
description_portal: 부산광역시  전통사찰 현황에 대한 데이터로 부산시에서 가볼만한 장소 전통사찰, 인정한 사찰 힐링장소를 나타내고 있음. 전통사찰은 시지정문화재 또는 나라에서 지정한 국보 보물을 보유하고 있는 사찰로서 1988년부터 지정하기 시작하여 최근까지 36개의 사찰을 인정하고 있음.전통사찰로 지정되면 보수정비 지원사업 및 방재시스템 구축 유지보수 지원사업의 혜택을 받을수 있음.지정호수, 사찰명, 법명, 도로명주소, 전화번호, 건물동수, 면적, 등록일자, 위도, 경도, 데이터기준일자 항목 정보를 제공합니다.
