summary_user: 경기도 내 주요 테마관광지를 관광지 한 곳당 한 행으로 담은 목록으로, 시군명·관광지명·전화번호·도로명/지번 주소·우편번호·WGS84 위도·경도와 데이터 기준일자를 담는다. 여행자나 관광 앱 개발자가 '우리 시군 근처에 어떤 테마관광지가 있고 정확한 위치는 어디인가'를 확인하거나, 분석가가 시군별 관광지 분포를 볼 때 쓴다. 다른 데이터와 공유하는 전역 조인 키는 없으므로, 시군명이나 주소·좌표를 기준으로 다른 경기도 데이터와 이름 매칭이나 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 전국의 문화관광자원 중 경기도 내 주요 테마관광지 정보를 수록한 자료로, 각 관광지의 명칭(관광정보명), 소재지 시군명, 전화번호, 주소(도로명주소 및 지번주소), 우편번호, 그리고 공간정보(WGS84 기준의 위도 및 경도 좌표)를 포함하고 있습니다. 데이터는 특정 기준일자를 기준으로 수집되었으며, 관광지별 정확한 위치정보를 제공하여 관광지 안내 서비스, 관광 애플리케이션, 지역 관광지 분석 등에 활용할 수 있습니다. 또한 행정구역별 관광자원 분포 및 관광지 접근성 분석 등 공공정책 및 관광 마케팅 전략 수립에 유용한 자료로 활용될 수 있습니다.
