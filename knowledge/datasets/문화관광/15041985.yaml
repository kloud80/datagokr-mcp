summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU)에 운영자가 입력한 숙박시설별 상세 정보를 숙소 한 곳당 한 행으로 담은 파일로, 객실 수·반려동물 동반·조식·금연·셔틀버스·체크인/체크아웃 시간·장애인 전용객실·부대시설·유아 서비스 항목을 포함하며 포털 설명 기준 전체 1,424건이다. 제주 여행객이나 여행 서비스 개발자가 '반려견과 함께 묵을 수 있고 조식을 주는 제주 숙소는 어디인가', '장애인 전용객실이 있는 숙소는 어디인가' 같은 질문에 답하거나 조건별 숙소 추천을 만드는 데 쓴다. 전역 조인 키가 없어 숙박업 인허가(LOCALDATA)나 다른 관광 데이터와는 숙소 이름(콘텐츠명)을 맞춰 연결해야 한다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 숙박콘텐츠 내역입니다.- 해당 데이터는 운영자가 비짓제주 관리자페이지에서 숙박 정보를 입력할 때 저장하여 생성합니다.- 개방데이터 항목은 콘텐츠명, 룸개수, 애완동물동반허용여부, 조식제공여부, 금연여부, 공항교통편, 셔틀버스운행여부, 등급, 체크인시간, 체크아웃시간, LATE체크인여부, 장애인전용객실여부, 부대시설기타, 유아서비스기타이며 전체 데이터 수는 1,424건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 숙박시설별 상세 정보 제공, 이용자 편의성 증대, 맞춤형 숙박 추천 서비스 개발, 애완동물 동반 가능 숙소 정보 제공, 장애인 접근성 강화, 부대시설 및 서비스 정보 기반 관광객 만족도 향상, 숙박업체 운영 효율화 및 마케팅 전략 수립 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
