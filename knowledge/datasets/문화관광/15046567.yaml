description_portal: '○ 통계개요* 통계명 : 한강공원 이용객 현황* 통계종류 : 한강공원 이용객 현황을 제공하는 일반·보고 통계* 통계목적 : 한강공원의 자연경지를 보호하고 이용객들의 휴양 및 정서생활의향상에 기여하는 것을 목적으로 함* 조사체계 : 한강사업본부* 공표주기 : 정기* 공표범위 : 지역 - 서울시내용 - 한강공원의 이용객 현황○ 용어설명* 자전거 등: 자전거, 인라인, PM(개인형이동장치) 등* 운동시설 등: 야구장, 론볼링장, 트랙구장, 롤러장, 자전거공원, 운동시설 등* 특화공원 : 수상무대, 서울색공원, 물빛광장, 음악분수, 갈대숲탐방로, 세빛섬 등* 기타 : 전망쉼터, 캠핑장, 빙상장/눈썰매장, 수영장/물놀이장 등○ 기타* 특화공원, 운동시설 등, 기타의 상세 현황은 한강사업본부 홈페이지(https://hangang.seoul.go.kr/archives/11160)를 이용하시기 바랍니다.○ 출 처 : 한강사업본부, 한강공원이용현황'
