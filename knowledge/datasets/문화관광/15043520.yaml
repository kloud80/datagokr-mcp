summary_user: 제주특별자치도가 제공하는 마라도 무장애 여행 경로 정보로, 지점마다 아이디·위도·경도·해발고도를 담은 위치 점 단위 자료입니다. 휠체어 이용자나 보행약자의 여행을 돕는 서비스 개발자가 '마라도에서 휠체어로 다닐 수 있는 동선이 어디로 이어지고 경사는 어떤가'를 지도에 그릴 때 씁니다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 TourAPI 관광지 정보 등과는 좌표 근접이나 이름 매핑으로만 이어 씁니다.
description_portal: '"제주특별자치도_무장애여행정보_49.마라도 데이터를 제공합니다.* 이 데이터셋은 제주특별자치도에서 제공하는 마라도 섬의 무장애 여행 정보로, 위도·경도 등의 위치 정보와 각 지점 설명, 이동 동선 및 접근성 정보를 포함하고 있다. 섬 전체를 통틀어 휠체어 및 보행약자도 이동 가능한 여행 환경을 고려해 마련된 자료이며, 해안길, 산책로, 주요 관광 포인트, 편의시설 접근성 등을 정리하여 누구나 안전하고 편리하게 관광할 수 있도록 설계되었다. 또한 본 정보는 무장애 관광지 확대, 열린관광지 활성화, 관광 서비스 개선 및 정책 수립을 위한 기초 데이터로 활용 가능하다* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
