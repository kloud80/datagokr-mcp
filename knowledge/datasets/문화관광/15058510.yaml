summary_user: 경기도 내 비디오물소극장업 업소를 한 곳씩 담은 건별 현황으로, 업소명·인허가일·영업상태·폐업일과 지번·도로명 주소, 좌표, 층수·시설면적·방음·조명·음향·비상계단 같은 시설 항목을 담는다. 문화시설 변화나 여가산업 쇠퇴를 보는 분석가가 "경기도 어느 시군에서 비디오물소극장이 언제 문을 닫았나"를 확인할 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 주소·업소명으로만 다른 경기도 데이터와 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내 비디오물소극장업의 현황을 수록한 자료입니다.  비디오물소극장은 과거 소규모 영상물 상영 시설로 운영되었으나, 다수의 업체가 폐업하거나 직권말소 처리되어 현재는 쇠퇴한 업종으로 기록되는 경우가 많습니다. 데이터는 극장의 기본 운영 정보뿐 아니라 방음·조명·음향·소방시설 여부 등 시설 안전 기준과 관련된 항목도 포함하고 있어 당시 운영 환경을 파악할 수 있습니다. 본 자료는 문화시설의 변화 추세, 여가산업의 쇠퇴 및 전환 양상 분석, 과거 행정 관리 기록 확인 등에 활용될 수 있습니다.
