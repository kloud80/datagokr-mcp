summary_user: 서울시설공단이 운영하는 서울어린이대공원의 입장객 현황을 API로 제공하는 데이터입니다. 공원 방문 수요를 살피는 분석가나 운영 담당자가 '어린이대공원 입장객이 시기별로 어떻게 달라지는가' 같은 질문에 쓴다. 명세에는 페이지 정보와 결과 묶음(items)만 있고 관광지점코드·시군구코드 같은 전역 조인 키가 없으므로, 다른 관광지 입장객 통계와는 공원 이름이나 같은 기관 기준으로 맞춰 이어 쓴다.
description_portal: 서울시 능동에 위치한 서울어린이대공원은 53만여㎡의 넓은 공간 속에 동물원, 식물원, 놀이동산 및 다양한 공연시설과 체험공간이 가득한 어린이 가족테마공원으로, 사계절 내내 다양한 연간 행사와 축제를 운영하며 가족 단위 방문객에게 즐거움을 선사합니다. 이용시간은 오전 5시부터 오후 10시까지 운영하고 있습니다. 서울어린이대공원의 연혁 및 현황에 대한 데이터로 일자별 주요연혁의 자료를 안내합니다. 더 나아가 서울어린이대공원의 운영 전반에 대한 이해도를 높일 수 있는 자료로도 활용됩니다. 서울시설공단 홈페이지 URL 연결해 주요 정보를 제공하고 있습니다.
