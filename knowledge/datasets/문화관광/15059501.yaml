summary_user: 경기도 내 여인숙업(10실 미만·공동 욕실 형태) 숙박업체의 인허가 현황을 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 시군명·인허가일자·영업상태·폐업일자·양실/한실 수·면적·도로명/지번 주소·WGS84 좌표를 포함한다. 지자체 위생·안전 담당자나 관광 분석가가 "우리 시군에 아직 영업 중인 여인숙이 몇 곳이고 어디에 몰려 있나"를 확인하거나 저가 숙박 수용 규모를 따질 때 쓴다. 실측상 전역 조인 키는 없어 경기도 시군 코드(SIGUN_CD)·시군명이나 주소·좌표로 같은 기관의 여관·모텔 등 다른 숙박업종 현황이나 지도 데이터와 맞춰 쓴다.
description_portal: 이 데이터는 경기도 내 숙박업체 중 여인숙업의 인허가 현황을 제공하며, 여인숙은 10실 미만의 객실을 보유하고 욕실 등 공동시설을 사용하는 형태의 숙박시설을 의미합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘위생업종명’, ‘위생업태명’, ‘건물소유구분명’, ‘양실수’, ‘한실수’, ‘소재지면적’, ‘다중이용업소여부’, ‘우편번호’, ‘WGS84 위도·경도’ 등이 포함됩니다. 이를 통해 여인숙업체의 위치, 운영 현황, 객실 형태, 위생 및 시설 정보를 종합적으로 확인할 수 있습니다. 데이터는 경기도 31개 시군 단위로 제공되며, 지역별 소규모 숙박 인프라 파악, 관광객 수용능력 분석, 위생·안전 관리 정책 수립, 저가 숙박업 시장 현황 연구 등에 유용합니다. 또한 여관·모텔 등 다른 숙박업종과 비교한 시장 구조 분석, 관광산업 활성화 전략 수립에도 기여할 수 있습니다.
