summary_user: 부산진구 관내 동별로 설치된 동네 야외운동기구 시설을 시설 한 곳당 한 행으로 담은 파일로, 시설명·설치 위치(주소)·설치된 기구 내역·설치 대수·위도·경도를 포함한다(약 38KB CSV). 주민이 '우리 동네 근처에 야외운동기구가 어디 있고 어떤 기구가 몇 대 있나'를 찾거나, 분석가가 동별 시설 분포를 비교해 부족 지역을 가려내는 데 쓴다. 전역 조인 키는 없으므로 주소 문자열이나 위도·경도 좌표를 기준으로 다른 체육시설·인구 데이터와 공간적으로 맞춰 이어 쓴다.
description_portal: '부산진구는 총 20개 동(부전1동, 부전2동, 연지동, 초읍동, 양정1동, 양정2동, 전포1동, 전포2동, 부암1동, 부암3동, 당감1동, 당감2동, 당감4동, 가야1동, 가야2동, 개금1동, 개금2동, 개금3동, 범천1동, 범천2동)으로 구성되어 있으며, 각 동별로 다양한 야외 체육시설이 설치되어 있습니다.본 데이터는 부산진구 관내 각 동에 설치된 동네체육시설(야외운동기구)에 대한 상세 정보를 포함하고 있습니다.데이터 항목동네체육(야외)시설명: 각 시설의 명칭동네체육(야외)시설 위치: 시설이 설치된 구체적인 장소동네체육(야외)시설 내역: 설치된 운동기구 종류 및 상세 내역동네체육(야외)시설 설치 대수: 각 시설별 설치된 운동기구의 수량위도, 경도: 각 시설의 지리적 좌표 정보로, 지도 시각화 및 위치 기반 분석에 활용 가능활용 목적 및 기대 효과지역 주민 건강 증진: 동네 체육시설의 위치와 종류를 파악하여 주민들에게 편리한 운동 공간 제공시설 관리 및 확충 계획: 동별 시설 분포와 설치 대수를 분석하여 부족한 지역에 대한 체육시설 확충 계획 수립도시 계획 및 환경 개선: 체육시설 위치 정보를 활용한 도시 공간 활용도 향상데이터 시각화: 위도/경도 정보를 기반으로 한 지도 시각화로 주민 접근성 및 시설 분포 이해도 증진'
