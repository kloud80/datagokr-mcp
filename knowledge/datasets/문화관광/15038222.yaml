summary_user: 김포시에 있는 출판사와 인쇄소를 업체 한 곳당 한 행으로 담은 CSV 파일로, 업체구분(출판사·인쇄소), 업체명, 도로명·지번 주소, 인허가년월일, 데이터기준일자를 담는다. 김포시 안 어느 동네에 출판사·인쇄소가 모여 있는지, 근처에서 인쇄를 맡길 업체가 있는지 찾는 시민·사업자나 지역 출판산업 분포를 보는 분석가가 쓴다. 등록번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 업체명이나 주소를 맞춰 붙이거나 다른 시군의 같은 형식 출판사·인쇄소 파일과 나란히 놓고 쓴다.
description_portal: 경기도 김포시의 출판사및인쇄소에 대한 정보를 제공합니다. 제공 항목으로는 업체구분, 업체명, 소재지도로명주소, 소재지지번주소, 인허가년월일, 데이터기준일자으로 구성되어있으며 주소는 지번과 도로명의 형태로 제공하여 필요한 형태로 선택하실 수 있습니다. 본 데이터를 통해 지역별 출판사 및 인쇄소 분포 등을 알 수 있습니다.본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있으며 csv 파일 형태로 제공합니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 김포시 문화예술과로 연락주시기 바랍니다.
