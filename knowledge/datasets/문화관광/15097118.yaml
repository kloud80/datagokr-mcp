summary_user: 제주 무오법정사 항일운동발상지를 중심으로 한 무장애 여행 코스를 지점별로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부가 들어 있다. 휠체어 이용자나 교통약자 동반 여행객이 이 유적지에서 어떤 동선으로 이동하고 어디서 쉬거나 편의시설을 쓸 수 있는지 확인할 때, 또는 지자체가 열린관광지 개선 지점을 찾을 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지나 다른 데이터와는 장소명 매칭이나 위경도 좌표 기준으로만 이어 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_무오법정사항일운동발상지_무장애여행코스 데이터를 제공합니다.*본 데이터셋은 제주특별자치도 소재 ‘무오법정사 항일운동발상지’를 중심으로 한 무장애 여행 코스 정보를 제공합니다. 이 코스는 교통약자 및 휠체어 이용자를 고려하여 이동 동선, 접근 가능한 지점, 휴식 및 전망 공간, 편의시설 현황 등을 체계적으로 수집하였으며, 노면 상태·경사도·보행환경·주차 및 화장실 접근성 등의 세부 정보가 반영되어 있습니다. 또한 해당 장소는 제주의 대표적 역사문화 유적으로서 열린관광지 조성, 무장애 관광 인프라 구축 및 관광 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
