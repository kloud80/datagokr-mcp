summary_user: 경기도 광주시 소재 도서관이 시민에게 추천하는 도서를 한 권당 한 행으로 담은 목록으로, 제목·저자·추천년도·등록날짜를 담는다(CSV 파일 약 5.6KB 규모). 시민이나 독서 프로그램 담당자가 '광주시 도서관이 올해 어떤 책을 추천했나'를 확인하고 독서 계획을 세울 때 쓴다. ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서관·서지 데이터와는 제목·저자 이름을 맞춰서만 연결할 수 있다.
limits: ISBN·도서관코드가 없어 도서관정보나루 대출·인기도서 데이터나 국가서지와 바로 결합할 수 없고, 이름 매칭에 의존해야 한다. 범위는 광주시 한 곳이며, 포털 파일 다운로드 방식으로만 제공된다.
