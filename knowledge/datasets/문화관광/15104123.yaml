summary_user: 인천광역시 관내에 등록된 공연장을 시설 한 곳당 한 행으로 정리한 목록으로, 시설명·운영주체(운영)·등록일·객석수를 담는다(약 2KB 분량의 CSV). 인천에서 공연을 기획하는 사업자나 분석가가 "인천에 객석 몇 석 이상의 등록 공연장이 어디 있고, 공공·민간 중 누가 운영하나"를 확인하는 데 쓴다. 전역 조인 키가 없어서 KOPIS 공연장 정보(공연장ID) 같은 다른 데이터와는 시설명을 맞춰 보는 방식으로만 이을 수 있다.
limits: KOPIS 공연장ID 같은 공통 키가 없어 다른 공연·예매 데이터와 붙이려면 이름 매칭이 필요하다. 명세상 연 단위로 관리되는 현황이므로 연중에 새로 등록되거나 폐업한 공연장은 반영되지 않았을 수 있다. 공연 일정, 관객 수, 매출 정보는 담겨 있지 않다.
