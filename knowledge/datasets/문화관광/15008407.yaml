summary_user: 전남 나주시에서 운영하는 게이트볼장 20여 곳을 시설 한 곳당 한 행으로 담은 파일로, 명칭·지번주소·규모(제곱미터)·관리기관·전화번호·이용시간·이용요금을 포함한다. 나주 주민이나 생활체육 동호인이 집 근처 게이트볼장이 어디에 있고 몇 시에 얼마에 이용할 수 있는지 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 체육시설 데이터와는 시설명이나 지번주소를 맞춰 보거나 같은 나주시 자료끼리만 연결한다.
description_portal: 전라남도 나주시에는 지석천 게이트볼장, 팔마아파트 게이트볼장, 벽산 게이트볼장, 본양 게이트볼장, 양산 게이트볼장, 흥덕 게이트볼장, 금곡 게이트볼장, 인동 게이트볼장, 안곡 게이트볼장, 노안 게이트볼장, 구남초 게이트볼장, 매성 게이트볼장, 신동 게이트볼장, 죽석 게이트볼장, 송월동 게이트볼장, 삼영동 게이트볼장, 남산공원 게이트볼장, 대호동 게이트볼장, 이창동 게이트볼장, 오량동 게이트볼장이 운영되고 있고, 이 데이터는 20여개 게이트볼장의 명칭, 주소, 규모(제곱미터), 관리기관, 이용시간, 요금에 관한 정보를 제공합니다.  게이트볼장의 자세한 정보는 첨부된 파일을 참고하여 주시기 바랍니다.
