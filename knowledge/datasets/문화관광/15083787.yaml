description_portal: '- 전북특별자치도 전주시 내 전국대회를 제공하며 구분, 대회명, 대회시작일, 대회종료일, 참가인원 등을 제공하고 있습니다.- 전주에서는 지역경제에 활기를 불어넣을 수 있는 크고 작은 국내외 체육행사 유치에 나서고 있고, 2025년에는 28개 국제‧전국규모 대회가 개최됩니다.- 이러한 대규모 체육행사의 경우 전국 각지의 선수들은 물론 선수단과 가족, 관람객들이 대거 전주를 찾아 숙식을 해결하는 만큼 지역경제 활성화에 크게 기여할 수 있습니다.항목 : 구분, 대회명, 대회시작일, 대회종료일, 참가인원, 장소, 주최주관, 담당부서제공부서 : 체육산업과'
