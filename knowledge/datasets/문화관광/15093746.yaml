description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 불평등 관련 뉴스 분석 메타정보 자료입니다. 불평등은 현대 사회에서 중요한 사회적·경제적 이슈로, 소득 격차, 자산 불균형, 교육 기회의 차이, 지역 간 발전 격차 등 다양한 형태로 나타납니다. 본 자료는 국내 주요 신문과 방송 보도에서 불평등과 관련된 키워드와 기사의 빈도를 추출하여, 특정 시기와 주제별로 언론이 불평등 문제를 어떻게 다루었는지 보여줍니다. 이를 통해 불평등 담론의 변화와 주요 쟁점을 분석할 수 있으며, 정책 결정 과정, 사회학 연구, 교육 및 언론 연구에 폭넓게 활용할 수 있습니다. 또한 장기적 보도 경향을 살펴보면 사회적 불평등에 대한 인식과 대응이 어떻게 진화해 왔는지를 파악할 수 있어, 사회적 합의 형성 및 제도 개선을 위한 기초 자료로도 의미가 큽니다.
