summary_user: 빅카인즈(BIGKinds)에서 불평등 관련 뉴스를 골라 기사 한 건마다 일자·언론사·제목·통합 분류·키워드·특성추출어를 담은 메타데이터 CSV 파일(약 1.6MB)이며, 지역 구분이 없는 전국 단위 자료다. 연구자나 언론·정책 분석가가 '소득·자산·교육 격차 같은 불평등 이슈를 언론이 언제, 어떤 키워드로 얼마나 보도했나'를 시기별·언론사별로 살펴보는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자·언론사명·키워드 같은 이름 매칭으로만 잇고, 같은 재단의 다른 뉴스빅데이터 메타데이터 파일과는 같은 컬럼 구조로 나란히 비교해 쓴다.
