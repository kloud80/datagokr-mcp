summary_user: 서울 금천구의 수영장업 인허가를 사업장 단위로 담은 건별 명부로, 인허가·취소·폐업 일자, 영업상태, 사업장명, 지번·도로명 주소, 좌표(X, Y), 지도자 수, 회원 모집 인원, 보험 가입 여부, 건물 면적 등을 포함한다. 창업 예정자나 상권 분석가가 '금천구에서 지금 영업 중인 수영장은 어디이고 최근 폐업한 곳은 어디인가'를 확인하거나, 구청·연구자가 지역 내 체육시설 분포를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이을 수 있고, 헬스장·골프 등 다른 체육시설업 인허가나 상권 데이터와 같은 축으로 나란히 놓고 본다.
description_portal: 수영장업 인허가 현황을 한눈에 파악할 수 있도록 정리한 데이터입니다. 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등 기본 항목은 물론 사업장별 위치 좌표, 면적, 업종 구분, 지도자 수, 회원 모집 인원, 보험 가입 여부 등 다양한 세부 정보가 포함되어 있습니다. 이를 통해 지역 내 수영장업의 분포와 운영 현황을 체계적으로 파악할 수 있으며, 신규 창업 입지 선정, 정책 수립, 안전관리 체계 강화, 체육 인프라 확충 등 여러 분야에서 활용할 수 있습니다. 또한 공간적 분석이 가능해 지역별 체육시설의 균형 배치 연구나 공공서비스 기획에도 도움을 주며, 공공기관, 연구자, 일반 시민 모두가 실질적으로 참고할 수 있는 가치 있는 공공 데이터입니다.
