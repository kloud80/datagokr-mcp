summary_user: 넷플릭스·티빙·쿠팡플레이·디즈니+ 등 자체등급분류 사업자가 분류한 영상물을 작품 한 건 단위로 담으며, 작품명·결정등급·등급분류일자·서비스제공일자와 주제·선정성·폭력성·대사·공포·약물·모방위험 7개 요소별 등급, 내용정보표시항목, 감독·주연·제작사·줄거리를 함께 제공한다(전국 범위, 2023년 6월 이후 자료). 보호자나 콘텐츠 분석가가 'OTT에서 공개된 이 시리즈는 몇 세 관람가이고 어떤 요소(폭력·선정성 등) 때문에 그 등급을 받았나', '사업자별로 청소년관람불가 판정이 얼마나 되나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 영화·콘텐츠 데이터와는 작품명·원제명·감독명 같은 이름 매칭으로만 이어 쓰며, 등급분류번호(rtNo)는 이 데이터 안에서 건을 식별하는 용도다.
description_portal: 영상물등급위원회는「영화 및 비디오물의 진흥에 관한 법률」제71조에 따라 ‘영상물의 공공성과 윤리성을 확보하고 청소년을 보호’하기 위해 설립되었으며동법 제72조의 영상물등의 등급분류 및 내용정보, 청소년 유해성 확인 심의 등의 직무를 수행하는 문화체육관광부 산하 공공기관입니다.해당 데이터는 영상물등급위원회에서 보유한 넷플릭스, 티빙, 쿠팡플레이, 디즈니+ 등 자체등급분류 사업자의 영상물 등급분류 정보를 제공하는 서비스 입니다. 제목, 서비스제공일자, 자체등급분류 사업자, 관람등급, 내용정보표시항목 등의 정보를 제공※자체등급분류 시행일 이후인 2023년 6월 이후 자료부터 조회 가능합니다.
