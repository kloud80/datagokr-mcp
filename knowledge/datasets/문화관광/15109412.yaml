summary_user: 경주시에서 열렸거나 열릴 예정인 전시회를 건별로 담으며, 전시회명·시작일·종료일·도로명주소 등 개별 주소·좌표 단위의 정보를 제공한다. 관광객이나 시민이 '이번 주 경주에서 볼 수 있는 전시가 무엇이고 어디서 하는가'를 확인하거나, 관광 앱 개발자가 지역 전시 일정을 안내하는 데 쓴다. 전역 조인 키가 없어 다른 문화행사·시설 데이터와는 전시회명이나 주소(RDNMADR) 같은 이름·주소 매칭으로만 이어 쓸 수 있다.
limits: 공연예술통합전산망 ID나 문화시설 코드 같은 공통 키가 없어 다른 데이터와 정확한 연결이 어렵고, 범위는 경주시 한 곳에 한정된다. 갱신은 행사 발생 때 생성되는 이벤트 주기라 정기적 최신화를 전제로 하면 안 된다.
