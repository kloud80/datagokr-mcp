description_portal: 이 데이터는 한국문화예술위원회가 운영하는 ‘문화예술 내 일 프로그램’의 개설 과목 정보를 정리한 자료입니다. 개설과목명에는 온라인마케팅, 그로스해킹 등 디지털 기술과 관련된 다양한 교육 과정이 포함되어 있습니다. 각 과목에는 목표 항목이 함께 제공되어 있습니다。 이 데이터는 특정 연도에 어떤 과목이 개설되었는지와 각 과목이 지향하는 교육 목표를 파악하는 데 활용할 수 있습니다. 또한 과목명과 목표를 비교하여 프로그램이 어떤 역량 강화를 중점적으로 다루는지 기초적으로 확인할 수 있으며, 교육과정의 성격을 분류하거나 과목별 목표를 나열하는 수준에서 분석이 가능합니다. 개설 과목 현황과 목표 정보를 단순히 파악하고, 프로그램의 기본적인 방향성을 이해하는 데 참고가능합니다.
