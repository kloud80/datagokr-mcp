summary_user: 경기도 내 인쇄 관련 사업장을 한 행씩 담은 건별 현황으로, 사업장명·인허가일·폐업일·영업상태와 함께 지번·도로명 주소, 위경도 좌표, 시설면적, 지역구분(주거·상업·관리지역 등)을 담는다. 분석가나 정책 담당자가 '경기도 시군별로 운영 중인 인쇄업체가 어디에 얼마나 몰려 있고, 최근 몇 년간 폐업은 얼마나 늘었나'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 시군명, 주소·좌표를 기준으로 이름·위치를 맞춰 연결한다.
description_portal: 이 데이터는 인쇄 관련 사업장의 운영 현황을 나타내며, 각 사업장의 인허가일자, 영업상태, 폐업 여부 등의 행정 정보와 사업장의 소재지, 지역구분 등을 포함합니다. 데이터에는 사업장의 명칭, 인허가일, 소재지 정보 외에도 ‘운영중’, ‘폐업’ 등 현재 영업상태가 기록되어 있으며, 이를 통해 인쇄업체의 활동 현황을 지역 단위로 파악할 수 있습니다. 또한 ‘지역구분명’을 통해 해당 사업장이 위치한 지역이 주거지역, 상업지역, 관리지역 등으로 분류되어 있어 지역별 인쇄업 밀집도나 입지 특성 분석이 가능합니다.이 데이터는 지역산업 구조 분석, 인쇄산업 육성정책 수립, 사업장 분포 모니터링 등 다양한 공공 및 연구 목적에 활용될 수 있습니다.
