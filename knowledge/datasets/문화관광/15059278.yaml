summary_user: 경기도 공공체육시설 가운데 골프연습장을 시설 1곳당 1행으로 담은 현황 자료로, 집계년도·시군·시설명·소유기관·관리주체와 부지·건축·연면적, 주연습장 타석수·면적, 퍼팅·어프로치 연습코스, 준공연도·건설사업비, 주소와 WGS84 좌표를 포함한다. 시군별 공공 골프연습장 공급 규모나 타석 수를 비교하거나, 주민이 가까운 공공 골프연습장의 위치·연락처를 찾는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 시설명·주소 매칭, 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 공공체육시설 중 골프연습장의 현황을 보여주는 자료로 집계년도, 시군명, 시설명, 준공연도, 관리주체명, 소유기관명, 주연습장면적 정보, 부지면적, 건축면적, 연면적, 주연습장타석수, 소재지  등을 포함하고 있습니다. 공공체육시설의 효율적인 관리와 지역별 체육 인프라 현황 파악, 정책 수립 및 예산 배분 등 다양한 분야에서 활용될 수 있습니다. 특히, WGS84 좌표계를 기반으로 한 위치 정보가 포함되어 있어 GIS 분석 및 지도 시각화에도 유용합니다. 데이터의 주요 항목으로는 ‘시설명’, ‘관리주체명’, ‘주연습장면적(㎡)’, ‘주연습장타석수’, ‘건설사업비(백만원)’, ‘소재지도로명주소’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며, 일부 시설은 준공연도나 면적 정보가 누락되어 있으므로 활용 시 주의가 필요합니다.
