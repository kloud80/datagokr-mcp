summary_user: 게임물관리위원회가 발표한 보도자료를 게시물 한 건 단위로 담은 파일(csv, 약 16만 바이트)로, 제목·본문·조회수·첨부파일 정보·생성일과 변경일이 들어 있습니다. 게임산업 동향을 살피는 분석가나 기자가 '게임물관리위원회가 특정 시기에 어떤 정책·교육·사회적 이슈 대응을 발표했나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 제목·날짜 같은 텍스트 매칭이나 같은 기관 자료끼리로만 이어 쓴다.
description_portal: 게임물관리위원회_보도자료 게임물관리위원회에서 발표한 공식 보도자료와 (출간지)게임위,게임문화산업전문 웹진 발간, (정책)정책토론회 관련 소개, 해외정책 연계 방안 소개, (교육)게임전문가 양성 교육 , 대민 교육 소개 , 대외홍보 및 보도 ,최근 사회적 이슈에 대한 대응 및 조직개편과 같은 중요한 내부 일정 과 같은 내용이 담겨 있으며, 내용에 대한 사이트링크를 제공하여 필요한 경우 보도내용을 직접 확인할 수 있도록 하였고, 게임물관리위원회의 중요일정 및 정책 방향성 각종 이벤트 및 서비스의 홍보자료 및 첨부파일 과 같은 내용들을 확인 할 수 있으며, 해당 내용 들은 2007년 부터 현재까지의 정보를 포함하고 있습니다.
