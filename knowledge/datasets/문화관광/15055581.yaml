summary_user: 전북특별자치도 안에서 운영 중인 영화관을 한 곳씩 담은 목록 파일로, 시군(지역명)별 영화관 이름, 총 스크린 수, 총 좌석 수, 상세 주소가 들어 있다. 도민이나 방문객이 우리 시군에 어떤 영화관이 있는지 찾을 때, 연구자나 배급사가 시군별 스크린·좌석 규모로 지역 상영 인프라 분포를 비교할 때 쓴다. 전역 조인 키나 시설 코드가 없어, 다른 데이터와는 지역명·영화관명·주소를 이름 기준으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 전북특별자치도 내에 운영 중인 영화관의 현황을 담고 있는 자료입니다. 각 영화관의 명칭, 총 스크린 수, 전체 좌석 수, 그리고 상세 주소 정보를 목록 형태로 제공하고 있습니다. 이 자료에는 대형 멀티플렉스 체인뿐만 아니라 독립 영화를 상영하는 전용관까지 포함되어 있어, 지역의 영화 상영 인프라 전체를 조망할 수 있습니다. 도민과 방문객에게는 문화생활을 위한 정보를 제공하며, 영화 배급사나 관련 연구자에게는 지역별 상영관 분포와 시장 규모를 분석하고, 문화시설의 접근성을 파악하는 데 중요한 기초 데이터로 활용됩니다.
