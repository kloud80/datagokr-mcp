description_portal: 본 오픈API는 경주시 관내 무장애 여행지를 소개하는 공공데이터로, 장애인과 노약자 등 교통약자를 위한 편의시설 정보를 포함하고 있다. 제공 항목에는 관광지명, 주소, 연락처, 장애인 주차장, 경사로, 휠체어 접근 가능 여부, 점자 안내, 장애인 화장실 유무 등이 있으며, REST형식으로 이용 가능하다. 해당 데이터는 사회적 약자의 관광 접근성을 높이고, 포용적 여행 환경 조성을 위한 기초자료로 활용된다. 복지 정책 수립, 관광 안내 앱 개발, 맞춤형 여행 콘텐츠 제작 등 다양한 목적에 활용될 수 있다. 누구나 공공데이터포털을 통해 열람할 수 있으며, 주기적인 갱신을 통해 최신 정보를 제공하는 신뢰성 높은 공공서비스이다.
