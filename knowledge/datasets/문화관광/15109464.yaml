summary_user: 경주시 관내 무장애 여행지를 관광지 단위로 담은 API로, 관광지명·위치·연락처와 장애인 주차장·경사로·휠체어 접근·점자 안내·장애인 화장실 같은 무장애 편의 정보를 함께 담는다. 휠체어 이용자나 노약자를 동반한 여행자가 경주에서 접근 가능한 관광지를 고를 때 쓰고, 관광 안내 앱 개발자가 접근성 정보를 덧붙일 때도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지명이나 주소를 맞춰서만 이을 수 있다.
limits: 관광지 코드(contentId 같은) 공통 키가 없어 다른 관광 데이터와 자동 결합이 안 되고 이름·주소 매칭에 기대야 한다. 범위는 경주시 한 곳이며 좌표 없는 비공간 데이터다. 활용신청은 자동승인이고 개발계정은 하루 10,000회까지 호출된다.
