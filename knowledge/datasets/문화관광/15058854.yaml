summary_user: 경기도 안의 외국인관광 도시민박업체를 사업장 한 곳당 한 행으로 담은 인허가 현황으로, 사업장명·인허가일자·영업상태·폐업일자·객실 수·건물 용도와 연면적·도로명/지번주소·WGS84 좌표 등을 포함한다. 관광정책 담당자나 분석가가 "경기도 시군별로 지금 영업 중인 외국인 대상 도시민박은 몇 곳이고 객실은 얼마나 되는가"를 따지거나, 숙박 사업자가 주변 경쟁 업소 분포를 볼 때 쓴다. 전역 조인 키는 없으므로 시군 코드(SIGUN_CD)·시군명이나 사업장명·주소 매칭으로 다른 경기도 숙박·관광 데이터나 공중위생 인허가(LOCALDATA) 자료와 잇고, 좌표로는 지도 위에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 외국인을 대상으로 운영 중인 도시민박업체의 현황을 정리한 자료로, 각 사업장의 명칭, 인허가일자, 영업상태, 위치정보 및 도로명주소 등 다양한 숙박 관련 정보를 포함하고 있습니다. 도시민박업체는 외국인 관광객에게 한국의 일상적인 주거 공간을 체험할 수 있도록 하는 숙박 형태로, 일반주택을 활용해 단기 체류형 숙소를 제공하며 관광 편의성과 지역문화 체험을 동시에 지원합니다. 이 자료는 지역별 관광자원 분포 분석, 외국인 대상 관광 서비스 확충, 숙박시설 인허가 현황 파악, 민간 숙박 인프라 정비 등 관광정책 수립과 외래 관광객 수용역량 분석 등에 활용됩니다. 특히 지역 관광 활성화를 위한 기초자료로 활용도가 높습니다.
