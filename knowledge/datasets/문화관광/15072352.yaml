summary_user: 전국 학교도서관을 도서관 한 곳씩 평가년도별로 담은 통계 파일로, 도서관구분·행정구역·시군구와 함께 인쇄 장서 수, 사서 수, 자료구입비(원)를 담는다. 교육 정책 담당자나 연구자가 "우리 시군구 학교도서관은 다른 지역보다 사서와 자료구입비가 얼마나 부족한가" 같은 지역 간 비교에 쓴다. 전역 조인 키가 없어서 다른 데이터와는 행정구역·시군구 이름이나 도서관명을 직접 맞춰 이어 써야 하며, 도서관정보나루의 도서관코드와도 바로 연결되지 않는다.
description_portal: 전국 학교도서관의 운영 현황과 자원 배분, 이용 실태를 종합적으로 파악할 수 있도록 평가년도, 도서관구분, 도서관명, 행정구역, 시군구, 장서수, 사서수, 도서예산 등 다양한 항목의 통계 정보를 제공합니다. 학교도서관의 규모와 서비스 수준, 자료 구입 현황, 인력 배치, 이용자 활동 등 세부적인 데이터를 바탕으로 교육 정책 수립, 도서관 운영 개선, 지역 간 비교 분석 등에 활용할 수 있습니다. 연구자, 정책 담당자, 교육기관 관계자 등에게 학교도서관의 현황을 객관적으로 파악하고 미래 발전 방향을 모색하는 데 유용한 자료입니다.
