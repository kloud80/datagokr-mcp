description_portal: '부산광역시 북구 홈페이지에서 제공하는 상영정보 테이블은 북구 내 도서관(만덕, 화명, 금곡, 솔밭, 상학 등)에서 토요일마다 상영되는 영화 목록에 대한 상세 정보를 담고 있습니다. 이 데이터는 지역 주민들이 가까운 도서관에서 어떤 영화를 언제 볼 수 있는지 쉽게 확인할 수 있도록 구성되어 있으며, 문화예술 향유 기회를 넓히는 데 중요한 역할을 합니다.테이블 구성 항목 및 데이터 설명영화제목: 상영되는 영화의 제목을 나타냅니다. 영화 선택 시 가장 기본적이고 중요한 정보로, 이용자는 이 항목을 통해 상영작을 직접 확인할 수 있습니다.영화상영일: 각 영화가 실제로 상영되는 날짜를 명시합니다. 주로 토요일 상영 일정이 등록되어 있어, 주말 문화생활 계획에 참고할 수 있습니다.영화 러닝 타임: 각 영화의 상영 시간을 의미합니다.영화 상영 시간: 영화 상영 시작 시간을 의미합니다. 이용자는 이 정보를 통해 상영 시간에 맞춰 도서관을 방문할 수 있습니다.등급: 해당 영화의 관람 등급(예: 전체관람가, 12세 이상, 15세 이상 등)을 표시합니다. 가족 단위 관람이나 어린이 관람 시 필수적으로 확인해야 할 정보입니다.내용: 영화의 주요 내용과 줄거리를 간략하게 소개하는 항목입니다. 이용자는 줄거리 정보를 통해 영화 선택에 참고할 수 있으며, 사전 정보 없이도 영화의 대략적인 분위기와 주제를 파악할 수 있습니다.'
