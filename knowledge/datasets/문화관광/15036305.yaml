summary_user: 울산대곡박물관의 개관(2009년 6월) 이후 관람객 수를 월별로 집계한 파일로, 기관명·주소·연락처와 함께 월과 관람객 수를 한 행씩 담는다. 지역 문화시설 담당자나 분석가가 이 박물관 관람객이 계절·연도별로 어떻게 달라졌는지, 특별전 시기에 늘었는지를 볼 때 쓴다. 실측 컬럼에 문화시설코드 같은 전역 조인 키가 없어, 다른 문화시설 데이터와는 기관명·주소를 이름으로 맞추거나 같은 기관(울산광역시) 자료끼리만 연결한다.
