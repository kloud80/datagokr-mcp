description_portal: 울산광역시 울산대곡박물관은 울산 시민의 식수원 확보를 위한 대곡댐 건설로 인해 건립된 박물관입니다. 울산광역시 울주군 두동면 천전리의 대곡댐 아래에 위치하고 있으며, 국보 "울주 천전리 명문과 암각화"와 1km 거리에 있습니다. 울산대곡박물관은 2009년 6월 24일 개관하였으며, 2010년 4월 19일 울산시 제3호로 등록되었습니다. 등록번호는 2018년 ‘울산-공립12-2010-01호’로 개정되었습니다. 상설전시실에서는 대곡댐 편입부지 발굴성과와 서부 울산 지역 ‘언양 문화권’ 역사 문화를 전시하고 있습니다. 매년 울산 지역사를 조명하는 특별전과 학술회의를 개최하고 있으며, 전시도록과 학술자료집을 발간하고 있습니다. 울산대곡박물관은 서부 울산의 거점 박물관으로 발전해 가고 있습니다. 앞으로도 시민 여러분께 더 사랑받는 박물관이 될 수 있도록 노력하겠습니다. 울산대곡박물관의 개관(2009년 6월 24일) 이후부터의 관람객 데이터로, 월별 관람객 수를 제공합니다.
