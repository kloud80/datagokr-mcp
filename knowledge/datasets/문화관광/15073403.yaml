summary_user: 전국 단위로 저작권산업이 전체 취업자 중 차지하는 고용 비중(%)을 핵심·상호의존·부분·지원 4대 분류와 전체 합계로 나누어 담은 연도별 집계 통계입니다. 저작권·콘텐츠 정책 연구자나 산업 분석가가 '최근 10여 년 사이 저작권산업의 고용 비중이 얼마나 늘었고, 어느 분류가 성장을 이끌었나'를 확인하는 데 쓴다. 전역 조인 키는 없으므로, 다른 고용·산업 통계와는 연도와 산업 분류 이름을 직접 맞춰 이어 쓴다.
description_portal: 해당 데이터는  '저작권산업의 경제적 기여도(고용 비중)' 통계 자료입니다. 2007년부터 2023년까지의 장기 시계열 데이터를 담고 있으며, 한국 경제 전체 취업자 수 대비 저작권산업이 차지하는 고용 창출 효과를 수치화하여 제공합니다.데이터의 세부 구성은 핵심 저작권산업, 상호의존 저작권산업, 부분 저작권산업, 저작권 지원산업의 4대 분류와 이들을 합산한 전체 저작권산업의 고용 비중(%)으로 이루어져 있습니다. 또한, 비중 산출의 기초가 되는 전체 산업 취업자 수(천 명) 데이터가 함께 포함되어 있어 산업별 실제 고용 규모 추산이 가능합니다. 특히 2007년 6.14%였던 전체 저작권산업의 고용 비중이 2023년 8.08%까지 점진적으로 상승하는 추이를 명확히 보여주고 있어, 국내 지식재산 및 콘텐츠 산업의 고용 성장세 분석에 핵심적인 지표로 활용될 수 있습니다. 연구자, 정책 입안자, 산업 분석가들이 국내 저작권 경제의 인력 구조 변화를 파악하고 관련 정책을 수립하는 데 있어 객관적인 근거 자료로 활용하기에 적합합니다.
