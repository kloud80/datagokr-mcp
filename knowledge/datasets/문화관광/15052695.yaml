summary_user: 대한체육회 회원종목단체에 등록된 선수를 건별로 담은 파일로, 선수마다 등록년도·성별·종별·종목·세부종목·소속·소속 구분(학교·직장운동부 등)·시도를 기록하며 범위는 전국입니다. 체육 행정가나 연구자가 '특정 종목의 시도별 등록 선수 수가 연도별로 어떻게 변했나'처럼 지역·종목별 선수 분포와 등록 추이를 볼 때 쓴다. 전역 조인 키가 없어 다른 체육 데이터와는 종목명·시도명 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 대한체육회 회원종목단체별로 등록된 선수의 상세 정보를 포함하고 있습니다. 등록 선수의 등록년도, 성별, 종별, 종목, 세부종목, 소속, 소속 구분, 소속 세부 구분, 시도 등 다양한 항목으로 구성됩니다. 학교 또는 직장운동부 등 소속 유형에 따른 체계적인 분류가 반영되어 있어, 전국 시도별 선수 분포 현황, 종목별 등록 트렌드 분석 등에 활용할 수 있습니다. 공공체육 정책 수립, 선수 육성 전략 수립, 지역별 편차 분석, 스포츠 기반 연구 등 행정·정책적 분야의 다양한 목적을 위해 활용 및 참고 가능한 데이터입니다.
