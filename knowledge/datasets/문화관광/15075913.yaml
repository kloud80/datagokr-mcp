description_portal: 서울특별시 강동구에 등록된 청소년 유해업소의 등록 현황을 제공하는 공공데이터로 처리일자, 청소년유해업소업종코드, 청소년유해업소업종명, 건수 등의 핵심 정보를 제공합니다.해당 데이터는 강동구 관내에서 「청소년 보호법」에 따라 청소년의 출입 및 고용이 금지되거나 제한되는 '청소년 유해업소'의 현황을 업종별 통계로 집계한 자료입니다. 유흥주점, 단란주점, 비디오/DVD방, 기타 청소년 출입·고용금지 표시 의무 대상 등 청소년의 건전한 성장에 해를 끼칠 우려가 있는 사업장들의 수를 파악할 수 있습니다.이 데이터는 지자체와 경찰이 관내 청소년 유해환경을 체계적으로 진단하고, 학교 주변 교육환경보호구역(정화구역)을 포함한 지역 전반의 지도·단속 활동을 강화하는 핵심 기초 자료로 활용됩니다. 이를 통해 청소년 비행을 예방하고, 유해환경으로부터 청소년을 안전하게 보호하는 건전한 성장 환경 조성에 기여합니다.※ 본 데이터는 Sheet 서비스의 경우 최근 1달 데이터만 제공합니다.
