status: active
summary_user: 한국스포츠정책과학원이 정기적으로 내는 간행물(주간 스포츠 동향지수, 스포츠 동향 아카이브, 글로벌 스포츠산업 리포트, 스포츠 현안과 진단, 체육과학연구)을 건별 목록으로 담으며, 실측 응답에는 제목·등록일자·수정일자·첨부파일 경로가 들어 있고 범위는 전국·비공간이다. 체육 연구자나 정책 담당자가 특정 주제의 최근 동향 보고서나 학술 논문 원문을 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 제목 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
limits: 6개 오퍼레이션 중 실호출에 성공한 것은 1개뿐이며, 체육과학연구·주간 스포츠 동향·동향 아카이브·현안과 진단 등은 최소 파라미터로 호출했을 때 응답이 없었으므로 호출 조건을 따로 확인해야 한다. 선수·대회 결과 같은 전문체육 실적 수치는 담지 않는 보조 등급 자료다.
