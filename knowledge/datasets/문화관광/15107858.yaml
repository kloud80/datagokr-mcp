description_portal: 한국스포츠정책과학원 정기간행물은 서울올림픽기념국민체육진흥공단 한국스포츠정책과학원에서 정기적으로 발행하는 간행물 정보를 제공합니다. 정기간행물 주간 스포츠 동향지수, 정기간행물 스포츠 동향 아카이브, 정기간행물 글로벌 스포츠산업 리포트, 정기간행물 스포츠 현안과 진단 조회, 정기간행물 체육과학연구에 대한 정보를 조회할 수 있습니다. 원문존재여부, 상세URL, 저자명, 발행일자, 저널명 등의 조회조건으로 원하는 정보를 검색할 수 있습니다. 이 서비스는 체육 및 스포츠산업 관련 정기 발행 콘텐츠를 제공하여 연구, 정책 개발, 산업 동향 분석에 유용한 자료로 활용될 수 있습니다.
