description_portal: 이 데이터는 2006년 문예연감에 수록된 시각예술 관련 정보를 정리한 자료로, 총 15개의 시트로 구성되어 있으며, 전국 및 해외 전시 활동의 현황을 지역 및 유형별로 파악할 수 있도록 설계되어 있습니다. 각 시트는 지역별 전시회(서울, 부산, 광주, 대구, 대전, 인천, 울산, 강원도, 경기도, 경상도, 전라도, 충청도, 제주도)와 해외미술 국내전, 한국미술 해외전으로 구성되어 있어 국내외 전시 흐름을 비교할 수 있습니다. 이를 통해 해당 연도 지역별 전시 수, 개최 장소, 주최 단체, 참여 작가 등의 세부 정보를 확인할 수 있으며, 시각예술의 지역 분포, 전시 기획 경향, 국제 교류 규모 등을 종합적으로 분석할 수 있습니다. 이 자료는 연도별 전시 활동 통계뿐만 아니라, 문화정책 수립 및 시각예술 생태계 연구를 위한 기초자료로 활용 가능합니다. 문화행정 실무에도 유용한 참고자료입니다.
