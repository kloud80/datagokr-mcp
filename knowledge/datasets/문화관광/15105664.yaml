summary_user: 울산항만공사 열린도서관이 소장한 도서를 한 권(등록번호) 단위로 담은 목록 파일로, 자료명·저자·출판사·출판년도·청구기호 같은 서지 정보가 들어 있다. 열린도서관 이용자가 "찾는 책이 이 도서관에 있는지, 서가 어디(청구기호)에 있는지"를 확인할 때 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어서, 다른 도서관·국가서지 데이터와는 자료명·저자 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: '- 울산항만공사 열린도서관 소장 도서목록을 공공데이터 포털을 통해 국민들에게 개방하여 공사가 보유한 신규 도서목록을 매년 현행화하여 열린 도서관 이용자들의 편의를 제고하고자 합니다. 따라서, 열린 도서관에서 원하는 도서 정보를 찾고자 하실 경우 해당 데이터를 참고하시기 바랍니다.- 개방 데이터에는 등록번호, 구분,  자료명(도서명), 저자, 출판사, 출판년도, 청구기호 등의 내용이 포함되어 있습니다.- 또한, 해당 데이터는 공공저작물(제1유형)로 지정되어 있으므로 데이터 활용 시 해당 사항을 참고하시기 바랍니다.'
