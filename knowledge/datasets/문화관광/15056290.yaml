summary_user: 제주특별자치도에 소재·운영하는 국내여행업체를 업체 한 곳씩 상호명, 소재지, 연락처, 데이터기준일자로 담은 등록 현황 파일(CSV, 약 40KB)이다. 제주에서 국내여행을 알선하는 여행사가 어디에 있고 어떻게 연락하는지 확인하려는 여행자나, 지역별 여행업체 분포를 보려는 분석가가 쓴다. 전역 조인 키나 등록번호가 없어 다른 관광사업 등록 데이터와는 상호명·소재지 주소를 맞춰서만 이어 쓸 수 있다.
description_portal: '제주특별자치도 내에 소재 / 운영하고 있는 국내여행업과 관련한 데이터를 제공합니다.항목: 상호명, 소재지, 연락처*「관광진흥법」에 의거하여 관리됨- 여행업 : 여행자 또는 운송시설ㆍ숙박시설, 그 밖에 여행에 딸리는 시설의 경영자 등을 위하여 그 시설 이용 알선이나 계약 체결의 대리, 여행에 관한 안내, 그 밖의 여행 편의를 제공하는 업- 국내외여행업: 국내외를 여행하는 내국인을 대상으로 하는 여행업(사증을 받는 절차를 대행하는 행위를 포함)- 국내여행업 : 국내를 여행하는 내국인을 대상으로 하는 여행업 자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1036'
