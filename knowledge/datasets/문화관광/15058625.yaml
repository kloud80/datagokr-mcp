summary_user: 경기도 내 음반·음악영상물 제작업체의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 시군코드·사업장명·인허가일자·영업상태·폐업일자·주소와 WGS84 좌표·시설면적·층수 등을 포함한다. 음악 제작 창업을 준비하는 사업자나 문화산업 분석가가 '우리 시군에 영업 중인 음반 제작업체가 몇 곳이고 어디에 모여 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명이나 주소·좌표로 경기도의 다른 업종 인허가 데이터나 지도와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 음반 및 음악영상물 제작업체의 인허가 현황을 제공하며, 음반·음악영상물 제작업체는 음반, 음악파일, 음악영상물 등을 기획·제작하거나 복제·제작하는 사업체를 포함합니다. 주요 항목으로는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘WGS84 위도·경도’, ‘업태구분명’, ‘문화체육업종명’, ‘총층수’, ‘시설면적’, ‘편의시설여부’, ‘소방시설여부’ 등이 있습니다. 이를 통해 각 제작업체의 위치, 영업상태, 시설 및 안전설비 현황을 종합적으로 파악할 수 있으며, 경기도 31개 시군별 인허가 현황이 포함되어 지역별 분포 분석도 가능합니다. 본 데이터는 문화산업 정책 수립, 지역 기반 제작업체 관리, 콘텐츠 산업 활성화 연구 등에 활용될 수 있으며, 나아가 대중문화 트렌드 분석, 음악 및 영상 제작업계 성장 동향 파악, 관련 서비스 품질 개선에도 기여할 수 있습니다.
