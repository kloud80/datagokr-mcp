summary_user: 제주특별자치도 안에 조성된 산책로를 사업 연도별로 한 줄씩 정리한 현황 파일로, 위치·사업량(km)·주요 시설·데이터 기준일을 담는다. 제주에서 걷기 코스를 찾는 관광객이나 보행·녹지 인프라 분포를 살피는 분석가가 '어느 지역에 언제 몇 km의 산책로가 어떤 시설과 함께 조성됐나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 좌표가 없어, 다른 데이터와는 산책로 위치 이름을 행정구역명이나 관광지명에 맞추는 방식으로만 이을 수 있다.
description_portal: 이 데이터셋은 2021년 기준으로 제주특별자치도 내에서 조성된 산책로의 위치, 사업량, 주요 시설 정보 등을 체계적으로 정리한 공공 통계자료이다. 산책로의 명칭, 시작·종료 지점, 길이, 경로, 조성 시점과 보행자를 위한 주요 편의시설 현황 등이 포함되어 있어, 제주 지역의 보행 인프라 분포와 접근성 현황을 파악할 수 있다. 이 정보는 지역 관광 코스 설계, 주민 여가 공간 확보, 보행 환경 개선, 도시 계획 및 녹지 정책 수립, 관광 활성화 전략 마련 등에 기초 자료로 활용될 수 있으며, GIS 지도 제작이나 공간 분석, 관광객·주민의 이동 패턴 분석에도 유용하다. 제공 기관은 제주특별자치도이며, CSV 형식으로 공개되어 누구나 다운로드 및 분석이 가능하다
