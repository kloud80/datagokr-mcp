description_portal: '서울특별시 중구의 국내를 여행하는 내국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소 정보입니다. 해당 데이터에는 사업장명, 소재지(도로명·지번), 관리번호, 인허가일자, 영업상태, 업종명 등의 항목이 포함됩니다. 국내여행업은 국내 관광객을 대상으로 여행상품을 기획·판매·운영하는 업종으로, 관광진흥법에 따라 등록기준을 충족해야 하며, 본 데이터는 관광산업의 건전한 발전과 소비자 보호를 위해 활용되며, 정기적으로 갱신되어 최신 정보를 반영합니다. 시민과 행정기관은 이를 통해 여행업체의 신뢰성과 운영 현황을 쉽게 확인할 수 있습니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
