summary_user: 전라남도 남도여행길잡이에 올라온 남도먹방(지역 음식·맛집 관광) 콘텐츠를 게시물 한 건 단위로 담으며, 게시물마다 고유번호·제목·작성자·조회수가 있고 목록 조회와 상세 조회 두 오퍼레이션으로 나뉜다. 여행 앱 개발자나 지역 관광 홍보 담당자가 '전남에서 많이 본 먹거리 소개 콘텐츠는 무엇인가'를 확인하거나, 서비스에 남도 음식 관광 콘텐츠를 붙일 때 쓴다. 전역 조인 키는 없어 TourAPI 관광 콘텐츠 등 다른 데이터와는 제목·이름 매핑으로만 이어 쓰며, 데이터셋 안에서는 목록에서 받은 고유번호(mukbangId)를 상세 조회에 넘겨 연결한다.
description_portal: 전라남도 남도여행길잡이에서 제공하는 남도먹방 관광 콘텐츠 정보를 조회할 수 있는 OpenAPI 서비스입니다. 본 데이터는 남도 지역의 음식 관광 및 맛집 콘텐츠를 기반으로 구성되며, 남도먹방 목록 및 상세 정보를 제공합니다. 이용자는 제목, 작성자, 등록일, 조회수, 콘텐츠 내용, 영상 URL 등의 정보를 조회할 수 있으며, 전라남도 관광 홍보 및 지역 먹거리 관광 활성화를 위한 기초자료로 활용할 수 있습니다. 또한 다양한 관광 서비스 및 민간 애플리케이션 개발에 활용 가능한 공공데이터입니다.
