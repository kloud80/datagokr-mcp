summary_user: 대전광역시 대덕구 관내에서 영업 중인 숙박업소를 업소 한 곳당 한 행으로 담은 파일(csv, 약 8.5KB)로, 업종·업소명·도로명 주소·우편번호·전화번호·데이터 기준일자를 담는다. 대덕구에서 숙박업 창업을 검토하는 사업자가 "관내에 어떤 업종의 숙박업소가 어디에 몇 곳 있는가"를 확인하거나, 시민·분석가가 지역 숙박 공급 현황을 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 도로명 주소·우편번호나 업소명을 매칭하거나 공중위생법 신고 기반 인허가 데이터(LOCALDATA)와 이름·주소로 대조해 이어 쓴다.
