summary_user: 서울 동대문구의 태권도장·합기도장·유도관·검도장 같은 체육도장업 인허가를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 상호명, 도로명·지번 주소, 인허가일과 취소일, 영업상태, 폐업일, 좌표, 지도자 수 등이 들어 있다. 학부모가 동네에서 지금 영업 중인 태권도장을 찾거나, 분석가가 동대문구 무도장의 개업·폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·주소·상호명 매칭이나 같은 기관 코드로만 연결하며, 다른 자치구의 체육시설업 인허가 데이터와 같은 컬럼 구조로 묶어 볼 때 쓴다.
description_portal: '▶동대문구 체육도장 정보를 제공합니다.(상호명, 도로명주소, 지번주소, 영업여부 등)▶체육도장업이란 무도(武道) 지도자가 태권도·합기도·유도·검도 등 무도 종목을 가르치거나 수련할 수 있도록 마련된 체육시설업, 즉 무도를 수련하거나 지도하는 공간을 갖추어 운영하는 업종을 말합니다. 흔히 동네에서 볼 수 있는 태권도장, 합기도장, 유도관, 검도장 등이 이에 해당합니다.▶체육도장 주요 특징- 법적 성격 :「체육시설의 설치·이용에 관한 법률」에 따른 신고체육시설업의 한 유형으로, 관할 지자체에 신고 후 운영 가능-시설적 특징 : 매트, 마루 등 낙상 방지와 충격 흡수 시설 설치- 운영적 특징 : 주로 회원제·정규반 운영 (아동·청소년 대상 방과 후 수련, 성인반 운영 등)- 교육·사회적 특징 : 신체 능력 향상(체력, 유연성, 민첩성, 호신 능력), 예절·인내·자기통제력 등 인성 교육 기능, 청소년 선도, 건전한 여가 공간 제공▶체력단련장업은 신고체육시설업에 해당하므로, 사업자는 관할 구청에 체육시설업 신고를 해야 합니다.▶사업자가 제출해야 할 서류에는 체육시설업 신고서, 임대차계약서, 지도자 자격증, 시설 평면도 등이 있습니다.'
