summary_user: 서울특별시 금천구 안의 전통사찰을 사찰(사업장)별로 한 건씩 담은 인허가 원천 데이터로, 인허가일자·영업상태·소재지·전화번호·승려 수·신도 수·창립 연대·유래·연혁과 지정취소 여부·사유·일자를 포함한다. 불교문화 연구자나 지역 관광·문화유산 담당자가 '금천구에 지정된 전통사찰은 어디이고 현재 지정이 유지되고 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 사찰명·주소 매핑이나 같은 기관의 관리 코드로만 연결한다.
description_portal: 전통사찰의 인허가 정보를 종합적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 소재지, 전화번호, 승려 수, 신도 수, 창립 연대, 유래·연혁 등 다양한 항목을 포함하며, 지정취소 여부와 사유, 지정취소일자 등 행정적 변동 사항도 함께 제공합니다. 이를 통해 지역 내 전통사찰의 현황을 파악하고 불교 문화 연구, 종교시설 정책 수립, 관광자원 개발 등에 활용할 수 있습니다. 또한 해당 데이터는 문화유산 보존, 종교 관련 연구, 지역 역사 기록 보전, 문화 관광 활성화 전략 마련 등에도 유용한 기초 자료로 쓰입니다.
