summary_user: 서울특별시 용산구에 등록된 게임물배급업 사업장을 한 곳씩 담은 인허가 원천 목록으로, 인허가 일자, 영업상태와 상세상태, 폐업일자, 전화번호, 지번·도로명 주소, 사업장명, 좌표(X·Y)를 담는다. 게임 수입·유통 사업자나 분석가가 '용산구에서 현재 영업 중이거나 최근 폐업한 게임배급업체는 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 지자체 인허가 데이터나 게임제작업 등 관련 데이터와는 사업장명·주소를 매칭하거나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: “게임배급업”이라 함은 게임물을 수입(원판수입을 포함한다)하거나 그 저작권을 소유ㆍ관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 영업을 말합니다. 게임배급업 관련 법령은 게임산업진흥에관한법률 제25조제1항, 동법시행규칙 제15조 제1항으로 게임배급업 처리 절차는 신청서 작성 → 접수 → 검토 확인 → 결재 → 등록증 작성 → 등록증 발급으로 이루어집니다. 신청방법은 방문, 인터넷등을 통해 신청할 수 있으며 필요서류로는 영업소의 임대차계약서 사본(임차한 경우에 한함), 제작시설 및 장비의 명세서(임차하여 사용하는 경우 포함, 게임제작업에 한함), 사업계획서(게임배급업에 한함), 담당공무원이 확인(행정정보공동이용)하는 사항은 법인등기부등본(법인에 한함)과 건물등기부등본(임차한 경우로서 건축물대장의 소유자와 임대차계약서의 임대인이 다른 경우에 한함)입니다. 게임배급업의 경우에는 게임제작업의 등록과 달리 사업계획서도 필수로 제출해야 합니다. 서울특별시 용산구_게임물배급업 인허가 정보에 대해 인허가 일자, 영업상태, 폐업일자, 전화번호, 주소, 사업장명에 대한 정보를 제공합니다.
