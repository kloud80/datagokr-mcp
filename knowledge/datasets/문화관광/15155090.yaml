summary_user: 전국 지자체가 관리하는 관광숙박업(관광호텔 등) 인허가 정보를 사업장 단위로 담으며, 검증 시 전체 4,411건 중 1,000행을 받았고 인허가일자 기준 2023-12-29부터 2026-10-01까지 포함된다. 분석가나 사업자가 특정 지역에 영업 중인 관광숙박업소가 몇 곳인지, 객실수와 영업상태가 어떤지 확인하는 질문에 쓴다. 지번주소·도로명주소·영문상호주소(address 키)로 다른 주소 기반 데이터와 이어 쓰며, 좌표(X·Y)도 함께 담지만 별도 조인 키로 확인된 것은 주소뿐이다.
description_portal: '문화_관광숙박업 데이터는 관광호텔과 같은 숙박시설 및 음식, 운동, 오락 등 적합한 시설 등을 함께 갖추어 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 지방자치단체에서 관리하는 관광숙박업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광산업진흥과 / 044-203-2837, 2838 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
