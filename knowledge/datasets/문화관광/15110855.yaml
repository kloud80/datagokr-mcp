description_portal: 본 데이터는 2022년 12월 16일을 기준으로 경상남도 남해군에 위치한 주요 관광지들의 종합적인 현황 정보를 제공하여, 국내외 관광객의 방문 편의 증진 및 지역 관광 활성화를 목표로 합니다. 각 관광지별 공식 '관광지명', 상세 '주소', 지리 정보 시스템(GIS) 분석 및 내비게이션 연동에 필요한 '위도'와 '경도' 좌표, 그리고 방문 문의 및 안내를 위한 '전화번호' 등 핵심 정보를 상세히 포함하고 있습니다. 특히, 본 자료는 국문뿐만 아니라 영문, 중문, 일문 등 총 4개 국어로 동일한 주요 정보를 제공함으로써 다양한 국적의 외국인 관광객들의 정보 접근성을 획기적으로 개선하였습니다.
