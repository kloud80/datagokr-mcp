summary_user: 서울 광진구에서 인터넷컴퓨터게임시설제공업(PC방) 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 건별 인허가 자료로, 업소명·지번/도로명 주소·인허가일과 취소일·영업상태·폐업일·시설면적·층수 등 시설 정보와 중부원점TM 좌표(X, Y)를 포함한다. 구청 담당자나 연구자가 '광진구에서 현재 영업 중인 PC방은 몇 곳이고 어느 동네에 몰려 있는가' 같은 분포·영업 현황 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 인터넷컴퓨터게임시설제공업 인허가를 받은 업소에 대한 정보를 제공합니다. 해당 업종은 일반적으로 PC방과 같이 컴퓨터 또는 게임물을 이용할 수 있도록 기자재를 갖추고, 이용자에게 게임 또는 정보 검색 환경을 제공하는 업소를 포함합니다. 업소명, 소재지, 업종유형, 인허가일자 등 주요 정보를 통해 광진구 내 인터넷게임시설의 분포와 운영 현황을 확인할 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84) 좌표는 포함되지 않으므로 지도 연계 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준으로 갱신된 자료이며, 게임산업 관리, 청소년 보호 정책, 정보이용시설 현황 분석 등 다양한 행정 및 연구 목적으로 활용할 수 있는 기초 자료입니다.
