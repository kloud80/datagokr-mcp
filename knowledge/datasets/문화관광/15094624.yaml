summary_user: 서울 동작구에 인허가된 국내여행업 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 인허가일·취소일, 영업상태와 상세상태, 폐업·휴업 기간, 사업장명, 지번·도로명 주소, 중부원점 TM 좌표(X, Y)를 담는다. 동작구에서 지금 영업 중인 국내여행사가 어디에 몇 곳 있는지, 최근 폐업한 곳은 어디인지 확인하려는 주민·창업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소를 맞추는 방식으로 이어 쓰고, 같은 서울시 인허가 계열 데이터와는 관리번호(MGTNO)나 자치단체 코드(OPNSFTEAMCODE)를 기준으로 맞춰 본다.
description_portal: '이 데이터는 서울특별시 동작구의 국내를 여행하는 내국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보를 포함하고 있습니다. 좌표안내 : 중부원점 TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 본 데이터는 3일전 자료를 제공합니다.'
