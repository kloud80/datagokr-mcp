summary_user: 전국 시내순환관광업(버스로 시내와 주변 관광지를 정기 순회하는 업체)의 인허가 정보를 사업장 단위로 담으며, 검증 수신 기준 115건에 인허가일자·영업상태·사업장명·주소·좌표 등이 있다. 관광객이나 분석가가 특정 지역에 시내순환 관광버스 업체가 등록돼 있는지, 영업 중인지 폐업했는지 확인하는 질문에 쓴다. 지번·도로명 주소(address) 필드를 키로 다른 주소 기반 데이터와 이어 쓰며, 사업장 단위의 등록번호 같은 별도 식별 키는 필드에 없다.
description_portal: '문화_시내순환관광업 데이터는 버스, 택시 등과 같이 승객이 가고자 하는 목적지까지 운전기사가 운송해주는 여객자동차 운송사업의 면허를 받거나 등록을 한자가 버스를 이용하여 관광객에게 시내와 그외 주변 관광지를 정기적으로 순회하면서 관광을 제공하는 업체 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 시내순환관광업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광정책과 / 044-203-2814 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
