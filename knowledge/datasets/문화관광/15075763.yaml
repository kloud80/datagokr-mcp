description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 그리스신화박물관은 제주시 한림읍 광산로 942에 위치한 테마형 문화시설로, 고대 그리스 신화를 소재로 한 명화·조각상 전시와 체험형 콘텐츠를 제공한다. 루브르와 바티칸의 명작 및 대리석 조각을 재현한 약 200여 점의 전시품을 비롯해, ‘창조관·올림포스관·신탁관·영웅관·휴먼관·사랑관’ 등 주제별 공간이 구성되어 있어 방문객이 전시물과 상호작용하며 신화의 세계를 체험할 수 있다. 박물관은 무장애 환경을 갖추고 있어, 장애인 전용 주차장(7대), 턱 없는 출입구, 휠체어 대여, 장애인 화장실, 유모차 대여 등이 제공되어 교통약자, 고령자, 영유아 동반 가족 등 누구나 비교적 편리하게 이용 가능하다. 이 자료는 무장애 관광지 안내, 관광 코스 설계, 관광 인프라 평가, 열린관광지 정책 수립, 문화관광 콘텐츠 제작, 지도 서비스 구축 등 공공 및 관광 분야에서 기초 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
