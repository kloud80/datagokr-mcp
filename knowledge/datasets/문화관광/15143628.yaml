summary_user: 전국 국가어항별로 월별 관광객·방문객 수를 항명 단위로 담은 집계 파일로, 통신사·카드사 빅데이터를 분석해 만든 국가어항 기초조사 자료이며 실측 컬럼은 연번·항명과 2024년 월별 값으로 구성된다. 어촌 관광 분석가나 지자체 담당자가 어느 국가어항에 어느 달 방문객이 몰리는지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 항명을 이름으로 매핑해야 다른 어항·지역 데이터와 연결되며, 관광지점코드나 시군구코드는 파일에 들어 있지 않다.
description_portal: 국가어항관리사업 중 기초조사 분야의 국가어항 및 인근 지역 방문객 수와 매출액 현황에 대한 정보를 통신사 및 카드사 빅데이터를 분석하여 국가어항 기초자료 데이터베이스 구축을 위하여 수잡힌 데이터
