description_portal: 본 사업은 동해안 해양관광시설물 안전데이터 구축과 관련하여 현장조사를 기반으로 수행되는 사업입니다.해당 사업은 해양관광시설의 화재위험 요소 및 안전시설 실태 파악, 강릉시 다중이용시설의 안전데이터 구축, 무허가 숙박업체 현황 도출 등을 포함합니다. 본 데이터는 강원특별자치도 강릉시 내의 불법숙박업의심 사업장의 상호명, 주소 등을 포함합니다. 이를 통해 지역 시설물의 실제 운영 상태와 잠재적 위험요인을 체계적으로 분석하여 안전관리 강화 및 행정 대응력 향상에 필요한 기초자료를 마련하는 데 목적이 있습니다.
