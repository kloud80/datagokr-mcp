summary_user: 콘텐츠산업특수분류 코드·명칭과 10차 한국표준산업분류 코드, 그 대분류·중분류·분류명을 한 행씩 대응시킨 전국 단위 분류 연계표이다(CSV 파일 약 27KB). 콘텐츠 기업이나 분석가가 '게임·음악·출판 같은 콘텐츠 업종이 표준산업분류의 어느 코드에 해당하는가'를 확인해 산업 통계를 재분류할 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 표준산업분류코드(표준산업분류코드)를 사업체·산업 통계의 업종코드와 코드 값으로 맞춰 연결하는 방식으로 이어 쓴다.
description_portal: 콘텐츠산업특수분류와 10차 한국표준산업분류 연계 데이터는 콘텐츠산업의 세부 영역을 국가 표준 분류 체계와 연결하여 산업 현황을 더욱 정밀하게 파악할 수 있도록 구성된 자료입니다. 데이터에는 콘텐츠산업특수분류 코드와 명칭, 표준산업분류 코드, 대분류, 중분류, 세분류명 등이 포함되어 있습니다. 이를 통해 출판, 영상, 음악, 게임 등 콘텐츠산업의 특수한 활동이 국가 통계 체계 속에서 정확히 반영되며, 연구자와 기업은 산업 구조를 심층적으로 분석할 수 있습니다. 또한 정책기관은 해당 자료를 활용해 산업 지원 정책을 설계하고 성장 전략을 수립할 수 있으며, 국제 산업 분류와 비교하여 글로벌 경쟁력을 진단하는 근거로 삼을 수 있습니다. 이 데이터는 콘텐츠산업의 통계 정밀성 강화, 정책 기반 마련, 글로벌 표준화를 지원하는 핵심 자료입니다.
