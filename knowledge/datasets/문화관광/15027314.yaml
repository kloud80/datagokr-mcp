summary_user: 서귀포시에서 열리거나 관여하는 전국 규모 대회를 대회 한 건당 한 행으로 담은 파일(csv, 약 1.4KB)이며, 대회명·상세 장소·접수 기간·대회 기간·주최/주관·후원사·문의처를 담는다. 대회 참가를 준비하는 선수·동호인이나 방문객이 '올해 서귀포에서 열리는 전국대회는 언제 어디서 하고 접수는 언제까지인가'를 확인하는 데 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 대회명·장소명 같은 이름 매칭이나 같은 기관(서귀포시) 자료끼리만 이어 쓴다.
