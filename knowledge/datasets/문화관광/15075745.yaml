description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 서귀포매일올레시장은 1960년대 초 자연발생적으로 형성된 제주 서귀포의 대표 전통시장으로 620 m 길이의 아케이드형 상가에 200여 개 점포와 다양한 먹거리·제주 특산품·수산물 매장이 밀집해 있으며, 감귤·한라봉·흑돼지·옥돔·은갈치 등 지역 특산물을 구입하거나 즉석 분식·해산물 요리를 즐길 수 있고 공영주차장, 장애인 전용 주차구역, 턱 없는 출입구, 장애인 화장실, 유모차 대여 등 무장애 편의시설이 마련되어 있어 교통약자, 고령자, 유아동반 가족도 이용 가능한 열린관광지로서 전통시장 관광, 지역경제 활성화, 관광 콘텐츠 제작 및 여행 코스 설계 등에 유용한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
