description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 제주조각공원은 제주 서귀포시 안덕면 일주서로 1836번지에 위치한 야외 조각공원으로 자연림 속에 수백여 점의 현대 조각 작품이 전시되어 있으며 공원 내 둘레길과 일부 평탄 산책로, 접근 가능한 동선이 마련되어 휠체어나 유모차 이용자, 고령자 등도 자연과 예술을 함께 감상할 수 있도록 구성되어 있고 일부 구간에는 경사·비포장 구간이 존재할 수 있으므로 사전 확인이 권장되지만, 일반적으로 자연 속 문화예술 탐방과 무장애 관광이 가능한 열린 관광지 정보로 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
