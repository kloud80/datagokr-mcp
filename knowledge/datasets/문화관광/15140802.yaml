summary_user: 서울 은평구에 비디오물감상실업(DVD방·영화방 등)으로 인허가된 업소를 한 곳씩 담은 건별 인허가 데이터로, 인허가일·폐업일·영업상태, 지번·도로명 주소, 중부원점TM 좌표(X, Y)와 시청실 수·조명·비상계단 같은 시설 정보를 포함한다. 구청 담당자나 분석가가 "은평구에서 지금 영업 중인 DVD방은 어디에 몇 곳이고, 최근 몇 년 사이 얼마나 폐업했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관의 관리번호(MGTNO)·지자체 코드로만 이어 쓴다.
description_portal: '은평구의 DVD방, 영화방 등 다수의 시청실과 시청기자재를 갖추어 비디오물의 시청을 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 항목은 은평구 내에서 비디오물감상실업으로 등록된 업소의 기본 정보를 담고 있으며, 해당 업소의 등록일, 주소, 영업 상태 등을 포함합니다. 해당 업종은 과거 비디오 감상실 형태로 존재했으나, 영상 소비 방식의 변화와 스마트폰·OTT 이용률 증가로 인해 그 수가 점차 줄어들고 있습니다. 하지만 여전히 일부 지역에서는 소규모 영상감상 수요, 시니어 대상 감상공간, 특화 콘텐츠 상영 등으로 존재 가치가 남아 있으며, 도시 내 다양한 생활문화 공간으로 전환 가능성이 존재합니다. 이 데이터는 감상실의 위생상태, 시설 안전, 성인물 차단, 청소년 보호 등 공공 안전정책과도 연결되며, 유휴공간 전환, 커뮤니티 문화시설 전환 정책의 대상 선정을 위한 기초자료로 활용될 수 있습니다. 또한 감상실 업종의 등록 추이 및 변화 분석을 통해, 도시문화 변화 흐름을 읽고 생활 기반 문화시설 정책 수립의 디딤돌로 삼을 수 있는 행정 자료입니다.'
