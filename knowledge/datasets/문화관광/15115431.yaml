summary_user: 서울특별시 중랑구에서 인형뽑기·오락실처럼 전체이용가 게임물을 설치해 제공하는 청소년게임제공업 업소를 업소 한 곳씩 담은 인허가 원천 데이터로, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표와 시설 층수·면적 같은 시설 항목을 포함한다. 중랑구 주민이나 창업 예정자가 "우리 동네에 지금 영업 중인 인형뽑기방·오락실은 어디이고 최근 폐업한 곳은 몇 곳인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 위치 분석을 하려면 좌표를 EPSG:5174에서 변환해 지도 데이터와 겹친다.
description_portal: '서울특별시 중랑구의 인형뽑기, 오락실 등 전체이용가 게임물을 설치하여 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
