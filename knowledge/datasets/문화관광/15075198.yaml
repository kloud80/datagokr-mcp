summary_user: 제주현대미술관 한 곳의 무장애여행 정보를 위도·경도, 장소명칭, 장소상세정보, 무장애관광정보, 추천코스 여부, 데이터기준일자로 담은 작은 CSV 파일(3,175바이트)입니다. 휠체어 이용자나 고령자 동반 여행객이 제주현대미술관 안팎을 불편 없이 다닐 수 있는지 확인하는 데 쓰고, 관광 분석가는 제주 무장애 관광 인프라 점검에 쓴다. 전역 조인 키가 없어 같은 제주특별자치도 무장애여행정보 시리즈의 다른 관광지 파일과 장소명칭으로 묶거나, 위도·경도로 지도·문화시설 목록과 맞춰 쓴다.
description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 제주현대미술관은 제주시 한경면 저지문화예술인마을 중심부에 위치한 공립 미술관으로 2007년 개관 이후 제주 자연환경 속에서 현대미술 전시와 야외 조각공원, 공연장, 아트숍, 기획 및 상설 전시실 등을 운영하며 예술·자연·문화가 어우러진 복합 문화공간을 제공하며 건물과 주변 야외공간 모두 관람객을 위해 설계되어 누구나 편안히 관람이 가능하고 지역 주민과 관람객이 함께 누릴 수 있는 열린 관광지로 기능하고 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
