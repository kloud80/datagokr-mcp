summary_user: 구례군 안에서 호텔업 사업계획 승인을 받은 사업을 호텔 한 건씩 담은 파일로, 호텔명·소재지·객실수·규모·사업계획 승인일자·준공(예정)일자를 싣는다(CSV 381바이트의 소규모 목록). 지역 숙박 공급을 분석하는 사람이 '구례에 승인된 호텔 사업은 몇 곳이고 객실은 언제 얼마나 늘어나는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 숙박업 인허가 자료(LOCALDATA 등)와는 호텔명이나 소재지 주소를 맞춰서만 이어 쓸 수 있다.
