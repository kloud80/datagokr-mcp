summary_user: 독립기념관이 펴낸 한국독립운동사 자료총서의 목록을 권별로 담은 파일로, 관련 인물·제목·설명문·PDF 첨부파일 정보로 이루어져 있다(전국·비공간, CSV 약 80KB). 연구자나 교사, 일반 국민이 안중근 의거 관련 일본신문 기사집이나 한국광복군 자료집처럼 특정 인물·주제의 원문 자료집을 찾아 PDF를 받아 보려 할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 인물 이름이나 자료 제목을 맞춰 보는 방식으로만 연결한다.
description_portal: 독리기념관에서 발행한 한국독립운동사 자료총서 자료로 관련인물, 제목, 설명문, PDF 첨부화일로 구성되어 있습니다.주요 자료로는 한국독립운동사략, 일본신문 기록된 안중근의거 기사집, 이인섭과 독립운동자료집, 중국신문 한국독립운동기사집, 한국광복군 자료집, 안중근 문집, 고베신문 한국관계기사집, 3.1운동에 대한 도장관 보고서, 스탈린시대 정치탄ㄹ압 고려인 희생자들 인명편, 오사카아사히신문 의열투쟁 기사집, 시사일보 한국관계기사집, 독일어신문 한국관계기사집, 의병장 간찰 등의 자료로 되어있다.
