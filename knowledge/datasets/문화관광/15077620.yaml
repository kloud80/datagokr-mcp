summary_user: 구례군 안의 헬스장 등 체육시설을 업소 한 곳당 한 행으로 상호명·도로명주소·연락처·운영여부를 담은 개별 시설 명부이며, 파일 크기가 453바이트로 몇 건 안 되는 소규모 목록이다. 구례 주민이 근처에서 지금 운영 중인 헬스장이 어디인지, 연락처가 무엇인지 찾을 때 쓴다. 인허가번호나 사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 상호명이나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다. 예를 들어 체육시설업 인허가(LOCALDATA)나 상권 데이터와 이렇게 맞춰 본다.
description_portal: '"헬스장(체육시설) 현황" 공공데이터는 구례 지역 내에 위치한 헬스장 및 기타 체육시설에 관한 정보를 제공합니다. 이를 통해 지역 주민들은 건강한 생활을 유지하고 적절한 운동을 즐길 수 있는 장소를 쉽게 찾을 수 있습니다. 또한, 이 데이터는 지역의 체육 활동을 촉진하고 지역 주변 거주자들의 삶의 질을 향상시키는 데에도 도움이 됩니다.'
