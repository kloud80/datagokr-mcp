description_portal: 서울특별시 마포구에서 내 영리 등을 목적으로 영화를 수입하는 업소에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소, 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명의 정보가 포함되어 있습니다. 영화수입업은 해외에서 제작된 영화를 국내에 수입하여 상영·배급·판매할 수 있도록 법적으로 허가받은 업종이며, 문화체육관광부 또는 지자체의 인허가 절차를 통해 등록됩니다. 이 데이터를 통해 시민과 산업 관계자들은 정식 등록된 영화수입업체의 현황을 파악하고, 저작권 보호와 정품 유통을 확인할 수 있습니다.
