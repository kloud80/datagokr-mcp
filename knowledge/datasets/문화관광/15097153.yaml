summary_user: 제주 표선해수욕장 한 곳의 무장애 여행 코스를 지점(포인트)별 행으로 담은 원천 목록으로, 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 해당 여부를 함께 담는다. 휠체어 이용자나 영유아 동반 가족이 표선해수욕장 방문 전에 주차장·화장실 접근성과 추천 동선을 확인하는 데 쓰고, 무장애 관광지도를 만드는 데에도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보와는 해수욕장 이름으로 맞추거나 위도·경도 좌표로 위치를 겹쳐 이어 쓴다.
description_portal: '"제주특별자치도 내 표선해수욕장_무장애여행코스 데이터를 제공합니다.* 표선해수욕장은 장애인, 노약자, 영유아 동반 가족 등 관광약자들도 안전하고 편안하게 이용할 수 있도록 무장애 여행 코스 및 시설정보가 정리된 통계자료입니다. 본 자료에는 해당 해수욕장의 위치, 주차장과 화장실의 접근성, 추천 코스 및 주요 포인트 등이 포함되어 있어 이동이나 이용에 제약이 있는 이용자도 사전에 방문 계획을 세우는 데에 유용합니다. 또한 이 정보는 무장애 관광지도 제작, 관광서비스 접근성 개선, 관련 정책 수립 및 평가 등의 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
