description_portal: 독립기념관 단산시보에 관한 데이터로 관리번호, 신문유형, 제목, 발행처, 발행일, 내용 등의 자료를 제공합니다.단산시보는 1925년 5월 12일 하와이에서 창간된 교민지로, 주필은 강영효이며 한 달에 2회 간행되었다. 국한문 혼용체로 10개월 동안 계속 발간되었다.단산시보 주필 강영효는 1880년생이며, 평안남도 증산군 황상면 무본리 출신이다. 일찍이 하와이로 노동 이민하였고, 1909년 대한인 국민회 하와이지방총회 북고나 훌루알로아지방회 의장을 역임하였고, 1914년 하와이 힐로지방회 법무원으로 활동했다. 1918년 하와이에서 국민보안공동회와 갈리히연합회를 조직하고, 조용하, 조병요 등과 함께 <태평양시사> 발간에 참여했다.
