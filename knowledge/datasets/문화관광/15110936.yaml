summary_user: 영주시 시민운동장 등 공공체육시설의 연도별 사용 횟수(USE_NMTM)와 사용 인원을 등록번호·구분별로 담은 집계 데이터로, 범위는 영주시 한 곳(시군구 단위)이다. 영주시 체육 담당자나 분석가가 "시민운동장 시설별 이용 횟수와 인원이 해마다 어떻게 바뀌었나"를 보고 수요가 적은 시설을 가려내거나 운영 시간 조정을 검토하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 체육시설 현황 데이터와는 시설 이름 매핑이나 같은 기관(영주시) 기준으로만 이어 쓴다.
limits: 영주시 관내만 다루고 공간 좌표가 없어 지도 결합이나 타 시군 비교에는 별도 데이터가 필요하다. 공통 조인 키가 없어 시설 단위 연계는 이름 매칭에 의존한다. 이 데이터에는 예약·대관 정보가 없다.
