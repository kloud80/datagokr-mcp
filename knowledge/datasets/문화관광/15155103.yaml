summary_user: 전국 지자체가 관리하는 관광펜션업 인허가 정보를 업소 건별로 담은 API로, 전체 1,678건이며 인허가일자·영업상태·사업장명·주소·객실수 등을 제공한다. 여행객이나 분석가가 특정 지역에 인허가를 받은 관광펜션이 몇 곳이고 영업 중인지, 객실 규모가 어느 정도인지 확인하는 질문에 쓴다. 도로명주소·지번주소 등 주소 키로 다른 숙박·인허가 데이터나 지도·좌표 데이터와 이어 쓰며, 개방자치단체코드와 기준일자는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: '문화_관광펜션업 데이터는 숙박시설을 운영하며, 자연,문화 체험관광에 적합한 시설을 갖추어 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 지방자치단체에서 관리하는 관광펜션업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광산업진흥과 / 044-203-2837, 2838 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
