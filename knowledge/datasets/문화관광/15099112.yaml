description_portal: '🎨 경상남도 사천시 공공미술 현황 상세 설명이 공공데이터는 경상남도 사천시 전역에 설치된 공공미술 작품들의 상세 정보를 종합적으로 제공하는 자료입니다. 공공미술은 지역사회의 미적 환경을 개선하고 시민들의 문화 향유 기회를 확대하며, 지역 정체성을 강화하는 중요한 역할을 합니다.제공되는 주요 데이터 항목은 다음과 같습니다.소재지: 해당 공공미술 작품이 실제 설치된 구체적인 위치 (주소 또는 장소명)를 나타냅니다. 이는 시민 및 관광객이 작품을 쉽게 찾아볼 수 있도록 돕습니다.작품명: 작품의 고유한 이름을 명시합니다.규격: 작품의 크기를 나타내는 정보를 제공하여 작품의 규모를 파악할 수 있습니다.재질: 작품 제작에 사용된 주요 재료 (예: 청동, 화강암, 스테인리스 스틸 등)를 명시합니다.이 현황 자료는 사천시의 공공 예술 자원을 체계적으로 관리하고, 시민들이 지역 내 예술 작품을 쉽게 접하고 이해할 수 있도록 지원하는 문화 행정의 기초 자료로 활용됩니다.'
