summary_user: 경기도 내 비디오물감상실업 사업장을 한 곳씩 담은 건별 현황으로, 사업장명·인허가일자·폐업일자·영업상태와 도로명·지번 주소, 위경도 좌표, 시설면적·층수·소방시설 여부 같은 시설 정보를 함께 담는다. 지자체 담당자나 분석가가 '우리 시군에 영업 중인 비디오물감상실이 몇 곳이고 최근 몇 곳이 폐업했는가'를 보거나 학교 주변 등 청소년 접근성을 점검하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소·좌표를 기준으로 맞춰 이어 쓴다.
description_portal: '이 데이터는 다수의 시청실 및 다수의 비디오물 시청기자재를 갖추고 비디오물을 공중의 시청을 제공하는 경기도 내 비디오물 감상실업 현황입니다.각 사업장의 인허가일자, 폐업일자, 영업상태(예: ‘영업중’, ‘폐업 등’), 위치정보 등을 포함합니다. 도로명주소, 시군명, 지역구분 등을 통해 사업장의 공간적 분포를 파악하는데 활용할 수 있습니다. 해당 데이터는 영상 콘텐츠 소비 공간에 대한 실태 조사, 폐업율 추이, 유흥업소 관련 정책 모니터링, 청소년 접근성 관리, 상업지역 내 콘텐츠 업종 분포 분석 등에 유용합니다.'
