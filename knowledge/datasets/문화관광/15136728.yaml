description_portal: 서울시 종로구 관광데이터 정보(영어)는 종로구 내 주요 관광지와 관광 관련 시설 정보를 영어로 제공하는 데이터입니다. 이 데이터는 각 관광지나 시설의 영어 명칭, 행정 시, 행정 구, 행정 동, 전화번호, 홈페이지주소, HTML 사용 여부, X 좌표, Y 좌표로 구성되어 있습니다. 명칭 항목에는 관광지 또는 시설의 영어 이름이 수록되어 영어권 관광객이 장소를 쉽고 직관적으로 이해하고 검색할 수 있도록 합니다. 행정 시, 행정 구, 행정 동 정보는 해당 관광지가 어느 행정구역에 속하는지 단계별로 나타내어, 영문 관광 안내 책자, 외국인용 지도, 다국어 안내 시스템 제작에 활용될 수 있습니다. 전화번호는 문의와 예약, 이용 안내를 위한 연락처 정보이며, 홈페이지주소는 상세 설명, 운영시간, 이용 방법, 예약 안내 등을 확인할 수 있는 웹페이지 주소입니다. HTML 사용 여부는 이 정보가 웹 서비스에서 HTML 형식으로 제공·활용 가능한지를 나타내는 기술적 속성입니다. X 좌표와 Y 좌표는 WGS84 좌표계를 기준으로 한 위치 정보로, 영어 기반 지도 서비스나 외국인용 관광 애플리케이션에서 종로구 관광지의 위치를 정확하게 표출하고 길 안내 기능과 연계하는 데 활용되는 공간 데이터입니다.
