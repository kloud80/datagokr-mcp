summary_user: 대구광역시 달서구 안에서 운영하는 문화시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 시설 구분·이름·도로명/지번 주소·위도·경도·운영 시각·휴관일·전화번호·홈페이지·관리부서·기준일자를 담는다. 달서구 주민이 가까운 문화시설과 운영 시간·휴관일을 찾거나, 분석가가 구 안의 문화시설 분포를 지도에 올려 보는 데 쓴다. 문화시설코드 같은 전역 조인 키는 없어서 다른 데이터와는 시설명·주소를 맞추거나 좌표로 공간 결합해 이어 쓴다.
limits: 달서구 한 개 시군구의 시설만 담으므로 대구 전체나 다른 지역과 비교하려면 다른 기관 파일을 따로 모아야 한다. 문화기반시설총람 시설코드가 없어 전국 문화시설 데이터와 묶을 때는 이름·주소 매칭에 의존해야 하며, 이 과정에서 오매칭이 생길 수 있다.
