summary_user: 대구광역시 북구 관내에 등록된 국내여행업체를 업체 한 곳씩 담은 목록으로, 상호·도로명주소·전화번호·직종명을 제공한다. 북구에서 국내여행을 다루는 여행사를 찾거나 연락처를 확인하려는 주민·사업자, 구 단위 여행업 분포를 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 상호나 도로명주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대구광역시 북구 관내의 국내여행업(직종명, 상호, 도로명주소, 전화번호 등)에 대한 정보를 포함하고 있습니다. 입력 파라미터 이용하여 대구광역시_북구청 국내여행업 데이터를 조회하는 서비스를 제공합니다. 관광진흥법에 따른 여행업에는 종합, 국내, 국내외여행업으로 나누어지며 위 데이터는 국내여행업에 대한 정보를 제공하고 있으니 정보 처리 시에 관련 사항을 참고하여 목적에 맞게 이용해주시기를 바랍니다. 또한 데이터 이용 허락 범위에는 제한이 없으나 최대 동시 접속 수의 제한이 있으니 이용 시 참고하여 주시길 바랍니다.
