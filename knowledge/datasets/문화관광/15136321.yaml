summary_user: 한국관광 데이터랩의 국민 해외관광객 수를 기준년월별로 성별·연령대(20세 이하부터 61세 이상까지 6구간)로 나눠 담은 전국 단위 집계 파일이며, 성별·연령 구분이 없는 승무원은 따로 한 열로 둔다. 여행업계나 관광 분석가가 '어느 연령대·성별의 해외여행이 월별로 늘거나 줄었는가'를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년월을 맞춰 같은 기관의 출입국·관광 통계와 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '- 본 데이터는 한국관광공사에서 운영하는 한국관광 데이터랩(datalab.visitkorea.or.kr)에서 제공하는 한국관광통계의 국민 해외관광객 성별/연령별 데이터입니다.- 해당 자료에는 조회 기간의 국민 해외관광객의 성별, 연령별 국민 해외관광객 수 등의 데이터를 포함하고 있습니다.- 국민 해외관광객에는 전체 국민 출국자 중 세계관광기구(UN Tourism) 거주지 분류 권고안에 근거하여 재외국민 출국자(교포)는 제외하고 있습니다.- 승무원은 별도의 출국절차를 밟아 출국하여 남녀 및 연령을 구분하여 기록하고 있지 않습니다.'
