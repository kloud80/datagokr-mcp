summary_user: 제주 마을별 경찰서(파출소·지구대), 병원, 약국, 보건소, 소방서 등 안전시설을 시설 한 곳당 한 행으로 담은 파일 데이터이며, 검증 때 328행을 모두 받았다. 마을 관광객이나 지역 계획 담당자가 특정 마을 가까이에 어떤 안전시설이 있고 운영시간·휴무일이 어떤지 확인하는 질문에 쓴다. 도로명주소·지번주소와 위도·경도 키로 다른 제주 위치 데이터와 이어 쓰며, 시설을 식별하는 별도 ID 키는 없다.
limits: 실측 최신 행 날짜가 2022-09-30 하나뿐이고 2022년 뉴딜 사업으로 구축한 시점 자료이므로, 현재 운영 여부는 별도로 확인해야 한다. 명세상 갱신은 수시이나 실측 날짜가 한 시점뿐이다. 실측 범위가 전국으로 표기돼 있어도 설명상 대상은 제주 마을이다.
