summary_user: 제주 감귤박물관 한 곳의 무장애여행 정보를 담은 파일로, 지점별 아이디와 위도·경도·해발고도를 수록하며 포털 설명상 장소설명과 이미지 정보도 제공된다. 휠체어·유모차 이용자나 고령자가 감귤박물관을 방문하기 전에 접근 가능한 동선과 위치를 확인하거나, 관광 정책 담당자가 무장애 관광지 인프라 현황을 점검할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 좌표나 시설 이름으로 매핑하거나 같은 기관(제주데이터허브)의 다른 무장애여행정보 시리즈와 묶어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 감귤박물관 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 감귤박물관은 제주도의 대표 특산물인 감귤을 주제로 한 공립 전문 박물관으로, 감귤의 역사·재배법·세계 품종 등 다양한 정보를 전시하고 체험할 수 있는 공간입니다. 상설전시관, 세계 감귤 전시관, 아열대 식물 온실, 체험관, 전통 민속농기구 전시 및 감귤 체험 프로그램 등을 포함하여, 연령과 신체 조건에 상관없이 누구나 제주 감귤 문화를 이해하고 경험할 수 있도록 설계되어 있습니다. 무장애 접근성을 고려해 장애인 전용 주차구역, 경사로, 엘리베이터, 장애인 화장실, 휠체어 유모차 대여 등 편의시설이 마련되어 있어 휠체어나 유모차 이용자, 고령자, 보행약자도 이용 가능하며, 열린관광지 및 무장애 관광지로 활용할 수 있는 공공 인프라입니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
