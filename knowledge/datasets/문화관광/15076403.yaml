description_portal: 이 데이터는 한국문화예술위원회가 2014년부터 2019년까지 운영한 문예진흥기금 공모사업 중 공연예술 분야의 '올해의 신작' 사업 개요 정보를 정리한 것으로, 창작 공연 활성화 및 우수 신작 발굴을 목적으로 한 사업의 세부 항목들을 포함하고 있습니다. 구성 항목은 공연단체명, 사업연도, 분야, 창작형태, 공연장 규모, 공연장 객석수(석), 소요시간(분), 공연회차(회), 주요 타깃 관객 등으로 이루어져 있습니다. 분야는 연극, 기타 등으로 나뉘며, 창작형태는 순수창작, 각색, 원형의 재해석 또는 새로운 양식화 등 다양한 창작 접근 방식을 포함합니다. 공연장 규모는 소극장, 중대극장으로 구분되어 공연의 규모나 제작 조건을 비교할 수 있으며, 객석 수와 공연 시간, 회차 정보는 정량적 지표로 활용되어 공연 기획의 현실성과 완성도를 평가하는 데 기여합니다. 주요 타깃 관객 항목을 통해 작품의 관람층이나 기획 의도에 따른 관객 전략도 분석할 수 있어, 이 데이터는 공연예술 기획, 정책 평가, 관객 개발 전략 수립 등 다각적인 분석에 활용 가능한 실무 기반 자료입니다.
