description_portal: 문화체육관광부 국립국어원의 한국어 어문규범  규정 정보 목록을 제공합니다. 한국어 어문규범은 우리말의 맞춤법에 대한 안내를 설명하고, 올바른 국어의 쓰임에 도움을 주기 위해 맞춤법과 관련된 다양한 정보를 제시합니다. 테이블은 결정근거정보, 고시정보, 관련규정정보, 발행고시규정정보, 북한규정정보, 용례정보, 최신고지규정정보, 항별연혁정보로 총 8개로 구성되어 있습니다. 이들 자료에 대한 목록 공개와 제공을 통해 한국어 어문규범에 대한 이해를 높이는 것을 목표로 하고 있습니다. 한국어 어문규범의 정보돌을 활용하여 한국어의 위상을 높일 것을 기대합니다.
