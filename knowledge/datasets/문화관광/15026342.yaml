summary_user: 부산광역시 강서구에 「관광진흥법」에 따라 등록된 여행업체를 업체 한 곳당 한 행으로 담은 파일로, 업종(국내여행업·국내외여행업·종합여행업), 상호, 우편번호, 도로명 소재지, 전화번호가 들어 있다. 강서구에서 사증 대행까지 하는 종합여행업체가 어디 있고 연락처가 무엇인지 찾는 주민이나, 구 단위 여행업 분포를 보는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관 자료끼리 연결해야 한다.
limits: 등록번호·사업자번호 같은 공통 키가 실측 컬럼에 없어 다른 관광사업 등록 자료나 사업자 데이터와 정확히 조인하기 어렵다. 범위는 강서구 한 곳뿐이라 부산 전체나 다른 시군구 비교에는 각 구 자료를 따로 모아야 한다.
