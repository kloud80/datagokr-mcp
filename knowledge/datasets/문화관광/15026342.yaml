description_portal: '「관광진흥법」에 따라 부산광역시 강서구에 등록된 여행업에 대한 정보입니다.여행업은 여행자 또는 운송시설·숙박시설, 그 밖에 여행에 딸리는 시설의 경영자 등을 위하여 그 시설 이용 알선이나 계약 체결의 대리, 여행에 관한 안내, 그 밖의 여행 편의를 제공하는 업입니다. 여행업의 종류는 아래와 같습니다. 1. 국내여행업: 국내를 여행하는 내국인을 대상으로 하는 여행업  2. 국내외여행업: 국내외를 여행하는 내국인을 대상으로 하는 여행업[사증(査證)의 절차를 대힝하는 행위를 포함] 3. 종합여행업: 국내외를 여행하는 내/외국인을 대상으로 하는 여행업[사증의 절차를 대힝하는 행위를 포함]현재(2026. 2. 11.기준 ) 관내에 등록된 여행업체은 총 40개소(국내여행업 5개소/ 국내외여행업 19개소/ 종합여행업 16개소)입니다.'
