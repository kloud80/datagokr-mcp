summary_user: 강원특별자치도 동해안 6개 시군(강릉·동해·속초·삼척·고성·양양)의 해양레저관광시설을 시설 한 곳당 한 행으로 담은 목록으로, 서핑·배낚시·스킨스쿠버·요트·일반관광지·해수욕장 등 업종별 시설명, 대표자, 가용·고용 인원, 주차면수, 홈페이지·SNS 주소, 체험·패키지 상품 내용을 담는다. 여행자나 레저 사업자가 '양양·속초에서 한 번에 수용 인원이 많고 주차가 되는 서핑업체는 어디인가' 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광 콘텐츠 등 다른 데이터와는 시설명·시군 이름을 맞춰 연결해야 한다.
description_portal: 'o 강원특별자치도 동해안 6개시군(강릉,동해,속초,삼척,고성,양양) 의 해양레저관광시설 현황  400건을 제공합니다. - 주요제공현황 : 시설명, 업종(서핑, 배낚시, 요트, 일반관광, 해수욕장 등), 대표자, 가용인원(한번에 수용 가능한 인원), 주차면수, 대표사이트(홈페이지 또는 SNS 주소),                                 관광상품(프로그램/패키지/체험 내용 등) - 제공시설현황 : 배낚시 37개,  서핑업체 106개,  스킨스쿠버 17개,  요트 5개, 일반관광지 195개(박물관,체험관, 농장, 휴양림 등),  해변 및 해수욕장 40개 - 자료수집방법 : 6개 시군을 대상으로 자료 취합 후 제공'
