summary_user: 서울 동대문구에 신고된 당구장업 사업장을 한 건씩 담은 인허가 명부로, 상호명·도로명/지번 주소·인허가일·폐업일·영업상태·좌표 등을 사업장 단위로 담는다. 동대문구에서 지금 영업 중인 당구장이 어디 있는지, 최근 어떤 곳이 문을 열고 닫았는지를 보려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 체육시설업 명부나 상권 데이터와는 관리번호(MGTNO)·자치단체 코드·주소·상호명 매칭으로 연결한다.
description_portal: '▶ 동대문구 당구장업 정보를 제공합니다.(상호명, 도로명주소, 지번주소, 영업여부 등)▶ 당구장업은 「체육시설의 설치·이용에 관한 법률」에서 규정한 체육시설업의 한 종류로, 당구를 목적으로 한 시설을 설치·운영하여 일반인에게 이용하게 하는 업을 말합니다.▶ 주요 특성- 운영 목적 : 생활체육 활성화, 여가·오락 제공, 집중력과 전략적 사고 향상- 시설 요건 : 당구대, 큐대, 조명, 환기 등 안전하고 쾌적한 시설 확보- 운영 대상 : 남녀노소 누구나 이용 가능하며, 동호회 활동 등 커뮤니티 형성에도 활용- 사회적 기능 : 지역사회 체육 활성화, 주민 여가 증진, 생활체육 저변 확대▶ 당구장업은 신고체육시설업에 해당하므로, 사업자는 관할 구청에 체육시설업 신고를 해야 합니다.▶ 사업자가 제출해야 할 서류에는 체육시설업 신고서, 임대차계약서, 시설 평면도 등이 있습니다.'
