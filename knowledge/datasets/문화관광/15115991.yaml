summary_user: 서울특별시 중구에 등록된 영화관 등 영화상영업 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일·폐업일, 영업상태(등록·폐업 등), 소재지 지번·도로명 주소, 시설면적·층수, 중부원점TM 좌표(X, Y)를 포함한다. 영화상영업 창업을 검토하는 예비 사업자가 '중구에서 지금 영업 중인 영화관은 어디이고 규모는 어떤가'를 확인할 때 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙일 전역 조인 키가 없어서, 업소명이나 주소 같은 이름 매칭, 또는 같은 기관의 관리번호(MGTNO) 체계로만 다른 인허가 데이터와 연결한다.
description_portal: '서울특별시 중구의 영화관 등 영리를 목적으로 영화를 상영하는 업소 정보입니다. 데이터는 각 등록된 상영업체에 부여된 관번호, 현재의 운영현황(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 영화상영업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 좌석수 규모별 대형극장 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 등록기준 및 시설관리 점검을 마친 신뢰할 수 있는 영상시설 여가 공간의 위치와 관람석 좌석수 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
