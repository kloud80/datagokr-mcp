description_portal: 이 데이터는 시민이 직접 참여한 ‘타임슬립 포토 프로젝트’를 통해 수집된 과거와 현재의 도시 모습을 기록한 사진 자료입니다. 타임슬립 제목, 사진 설명, 촬영 날짜, 타임슬립 등록 날짜 등의 항목으로 구성되어 있으며, 가족 나들이, 철도 이야기, 일상 공간 등 시민의 삶이 깃든 장소와 기억을 중심으로 구성되어 있습니다. 사진에는 과거의 추억과 그 시절을 살아간 경험이 고스란히 담겨 있으며, 과거의 장소를 현재의 시선으로 다시 바라보는 기록적 가치를 지니고 있습니다. 본 자료는 시민참여형 도시기록 콘텐츠 구축, 사진 기반 디지털 아카이브 조성, 지역문화공동체 확산, 도시재생 연계 문화정책 기획, 교육·전시자료 등으로 다양하게 활용하실 수 있습니다.
