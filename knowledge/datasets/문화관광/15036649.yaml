summary_user: 광양시 관내 체육도장을 한 곳씩 담은 명부로, 상호·지번/도로명 주소·전화번호·최초등록일자·최근변경일자를 시설 단위로 제공하는 소규모 CSV 파일(약 10KB)이다. 시민이 집 근처 태권도·합기도·검도 도장을 찾거나, 분석가가 광양시 체육도장이 언제 등록되고 바뀌었는지 살펴볼 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 상호·주소 문자열 매칭이나 같은 기관 기준으로만 이어 쓰며, 주소를 지오코딩해 다른 체육시설업·상권 데이터와 겹쳐 보는 방식이 현실적이다.
description_portal: 이 데이터는 관내 체육도장의 분포와 운영 현황을 제공하는 자료입니다. 각 체육도장의 상호명, 소재지(주소), 전화번호, 최초등록일자, 최근변경일자, 데이터기준일 등의 항목으로 구성되어 있습니다. 이를 통해 체육도장의 설립 시점, 변경 이력, 현재 운영 여부를 확인할 수 있으며, 무도(태권도, 합기도, 검도 등) 및 생활체육 관련 시설의 관리 현황을 체계적으로 파악할 수 있습니다. 행정기관은 해당 데이터를 활용하여 체육도장 등록 관리, 지도 점검, 체육진흥 정책 수립 등에 활용할 수 있고, 시민은 가까운 체육도장을 검색하거나 최신 등록 정보를 확인하는 데 참고할 수 있습니다.
