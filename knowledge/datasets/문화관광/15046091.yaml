summary_user: 제주를 찾은 내국인 관광객의 BC카드 결제를 기준년월·업종·성별·연령대별로 묶어 카드이용금액·이용건수·건당이용금액을 담은 집계 파일로, 2016년 FIT 증가에 따른 소비패턴 분석 보고서의 기초 자료(2014년 9월~2016년 8월 약 2년)다. 관광 정책 담당자나 분석가가 '개별관광이 늘던 시기 내국인 관광객은 어느 업종에서 어떤 연령·성별이 얼마나 썼는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준년월과 업종명·제주 대분류·중분류 같은 이름 매핑으로만 맞춰 쓰며, 같은 보고서의 중국인(유니온페이) 자료와 나란히 비교하는 용도가 자연스럽다.
limits: 관광지점코드·시군구코드 같은 표준 키가 없어 다른 관광 통계와는 이름 매핑으로만 연결된다. 개별 결제 건이 아닌 집계값이며, 내국인 BC카드 결제만 담아 전체 관광객 소비를 대표하지 않는다.
