description_portal: '서울특별시 중구의 키즈카페 등 안전성 검사 대상이 아닌 유기시설 또는 유기기구를 설치하여 운영하는 업소 정보를 제공합니다. 각 등록업소에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 좌표정보 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화관광 및 여가활동 관련 사업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 놀이공간 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 안전점검 기준을 충족하고 이용기준을 준수하는 신뢰할 수 있는 여가활동 등록업소의 위치정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
