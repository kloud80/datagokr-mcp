description_portal: 1999년 문예연감의 공연예술 관련 정보입니다. 총 20개의 시트로 구성되어 있습니다. 각 시트 항목에는 국악 기타 공연 일람, 국악 관현악단(국악단) 연주회 일람, 국악 실내악단 연주회 일람, 국악 교육단체 연주회 일람, 국악 기타단체 연주회 일람, 국악 단체 성악 연주회 일람, 국악 개인 성악 연주회 일람, 국악 개인 기악 연주회 일람, 국악 주요 국악 기획공연 일람, 국악 국내단체 해외공연 및 강습활동 일람, 국악 해외민속공연단 내한공연 일람, 국악강습 및 강좌 일람, 주요 국악경영대회 및 수상자 명단  등으로 구성되어 있습니다. 따라서 파일에서 1999년 문예연감의 공연예술 관련 정보를 확인할 수 있습니다.
