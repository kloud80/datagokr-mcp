summary_user: 마포구에 등록된 일반여행업 업소를 업소 한 곳당 한 건씩 담은 인허가 원장으로, 관리번호·인허가일자·영업상태(영업·폐업 등)·폐업일자·소재지 도로명/지번 주소·전화번호·중부원점TM 좌표를 포함한다. 여행업 창업을 검토하는 사업자나 분석가가 "마포구에서 현재 영업 중인 일반여행업체는 어디이고 최근 폐업한 곳은 몇 곳인가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 관광사업 등록 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관의 관리번호(MGTNO) 체계로만 이어 쓴다.
description_portal: '마포구의 국내 또는 국외를 여행하는 내국인 및 외국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보각 사업체가 위치한 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 실제 사업장 주소(도로명 주소와 지번 주소), 도로명우편번호가 포함되어 있으며, 관리번호, 등록일자, 영업상태(영업 중, 폐업, 말소 등) 등의 세부 정보가 제공됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
accrual_periodicity: 수시
