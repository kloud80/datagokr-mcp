summary_user: 대전광역시 안의 쇼핑 장소(전통시장·상점가·쇼핑몰 등)를 장소 한 건씩 담으며, 이름·주소·전화·주차시설·홈페이지·영업시간·소개와 위경도 좌표를 함께 제공한다. 관광객이나 여행 앱 개발자가 '대전역 근처에서 지금 영업 중인 쇼핑 장소와 주차 여부'를 찾는 데 쓴다. 전역 조인 키는 없어 TourAPI 쇼핑 콘텐츠나 다른 대전 관광 목록과는 상호명·주소로 맞추거나 좌표(mapLat·mapLot)로 거리 기반 연결을 해야 한다.
description_portal: 대전광역시 문화관광(쇼핑) 데이터는 대전 지역 내 다양한 쇼핑 장소와 관련 문화 체험 정보를 포괄하여 제공합니다. 이 자료에는 주요 전통시장, 상점가, 쇼핑몰, 테마 거리 등 다양한 쇼핑 공간의 위치, 상호명, 특성 등이 포함되어 있어 관광객과 시민들이 편리하게 쇼핑 활동을 계획할 수 있도록 돕습니다. 또한 문화와 관광이 어우러진 쇼핑 환경을 소개하여 지역 경제 활성화는 물론 외래 관광객 유치를 촉진하는 데 중요한 역할을 합니다. 이 데이터는 대전역의 꿈돌이 매장, 쇼핑트래블라운지 등 대표적인 관광·쇼핑 명소뿐 아니라 원도심 재래시장과 현대적 쇼핑 공간의 정보를 망라하고 있어, 도시의 문화·체육관광과 연계하여 다양한 행정 및 마케팅 활용이 가능합니다.
team:
