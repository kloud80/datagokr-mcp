summary_user: 서울 강북구에서 영리 목적으로 영화를 상영하는 영화관 등 영화상영업소의 인허가 내역을 업소 한 곳당 한 행으로 담으며, 인허가·폐업·휴업 일자, 영업상태, 주소, 중부원점TM 좌표, 시설 규모(층수·면적) 등이 들어 있다. 강북구에 지금 영업 중인 영화관이 어디 있는지, 최근 폐업하거나 휴업한 상영관이 있는지를 확인하려는 주민·사업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 개방자치단체코드(OPNSFTEAMCODE)처럼 같은 기관 코드로만 잇는다.
