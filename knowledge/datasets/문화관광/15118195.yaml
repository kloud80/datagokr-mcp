summary_user: 서울 성동구에 있는 영화배급업 업소의 인허가 정보를 업소 단위로 담는다. 인허가일자·취소일자, 영업상태, 휴·폐업일자, 소재지 주소와 좌표, 업소명 등이 들어 있다. 성동구에서 지금 영업 중인 영화배급사가 어디이고 언제 허가받았는지, 언제 폐업했는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했다. 그래서 다른 데이터와는 업소명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 영화를 전문적으로 배급하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 영화 배급업은 국내외 영화 콘텐츠의 유통과 접근성 향상, 영상산업 진흥 및 지역 문화 다양성 증진에 매우 중요한 역할을 하며, 업소별 인허가 이력투명성과 행정관리의 신뢰도 확보가 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 설립, 배급업 허가 및 변경, 폐업 등 행정정보가 포함되어 있어, 영화 배급 시장의 운영현황을 명확하게 파악할 수 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현황 점검과 자료 갱신을 통해 데이터 신뢰성과 최신성을 유지하고 있습니다. 본 데이터는 영화 배급사 관리, 영화 유통정책 수립, 시장 동향 조사, 통계 분석, 관련 업계 연구, 소비자 및 업계 신뢰성 평가 등 다양한 분야에 활용될 수 있습니다. 정책입안자, 영화산업 관계자, 연구자, 시민 모두에게 실효성 있고 객관적인 자료를 제공하며, 데이터는 정기적으로 최신화됩니다.
