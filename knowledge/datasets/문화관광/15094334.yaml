summary_user: 국립무형유산원이 소장·관리하는 전통 공예품을 한 건씩 목록으로 담으며, 자료명(ntcrSj)과 여러 본문 항목, 상세 페이지 이동 URL을 돌려주는 전국 범위의 비공간 API이다. 연구자·교사·전시 기획자가 "국립무형유산원에 어떤 전통 공예품 자료가 있고 상세 설명은 어디서 보나"를 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 맞출 전역 조인 키가 없어, 무형유산 보유자·종목 데이터와는 공예품 이름이나 기법 명칭을 문자열로 맞춰 이어 써야 한다.
description_portal: 입력 파라미터를 이용하여 공예품 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_공예품 정보 목록 조회 서비스는 전통 공예 유산과 관련된 작품 및 도구 등에 대한 정보를 온라인으로 체계적으로 제공하는 디지털 플랫폼입니다. 이 서비스는 각 공예품의 명칭, 제작 전승자 또는 장인, 공예 기법 분야, 제작 시기 및 소재지, 재료 및 크기, 작품 상태, 사진·영상 자료 및 설명, 지정 여부(국가·지방무형문화재 등), 관련 서지 및 전시 이력 등의 상세 메타데이터를 포함합니다. 이용자는 주제별, 전승자별, 지역별, 기법별로 맞춤형 검색과 필터링이 가능하며, 이를 통해 연구자·학생·교사·문화기획자·일반인들이 공예품 연구, 교육 콘텐츠 개발, 전시 기획, 디지털 전시 및 체험 콘텐츠 제작, 무형문화유산 기록·보존 정책 수립 등에 폭넓게 활용할 수 있는 중요한 디지털 문화자원입니다.
