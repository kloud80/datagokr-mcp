summary_user: 인천 부평구의 동네 생활체육시설을 시설 한 곳당 한 행으로 담은 파일로, 행정동·시설명·소재지 주소·설치된 경기장 종류와 수량·부대시설(화장실·음수대·조명 등)·관리 주체(직영·위탁 등)를 담는다. 주민이 우리 동네에 농구장이나 축구장이 있는 생활체육시설이 어디인지 찾을 때, 또는 구 담당자나 분석가가 동별 체육시설 분포와 편의시설 부족 지역을 따져 정비계획을 세울 때 쓴다. 전역 조인 키가 없어 행정동 이름이나 소재지 주소를 매칭해 다른 부평구·인천시 체육시설 자료나 인구 통계와 이어 쓴다.
description_portal: '생활체육시설의 명칭, 위치, 체육시설 구성, 부대시설, 관리주체 등의 정보를 수록한 자료.주민 건강 증진, 여가 활용, 지역 커뮤니티 활성화를 위한 체육 인프라 현황을 파악할 수 있으며, 시설 확충 및 정비계획 수립에 활용됨.활용 목적 및 특징– 동별 체육시설 분포 및 활용 가능 공간 현황 분석– 경기장 유형(축구장, 농구장 등)별 설치 비율 파악 가능– 부대시설 유무(화장실, 음수대 등)를 통한 편의성 평가– 시설 관리주체 확인을 통한 유지보수 및 민원 대응 체계 마련주요 항목 설명● 동별: 체육시설이 위치한 행정동● 시설명: 해당 체육시설의 명칭● 소재지: 시설의 도로명 또는 지번 주소● 체육시설현황(경기장): 설치된 경기장의 종류 및 수량 정보● 부대시설: 샤워실, 조명, 음수대, 화장실 등 부대 편의시설 현황● 관리: 해당 시설의 관리 주체 또는 관리 방법(직영, 위탁 등)'
