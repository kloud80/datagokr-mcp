summary_user: 제주 귀덕해안길 주변의 음식점·카페/편의점·숙박시설·관광지를 시설 한 곳당 한 행으로 정리한 목록이며, 명칭·구분·거리(km)·주소·전화번호와 휠체어 진입 가능 여부, 장애인화장실 제공 여부를 담는다. 휠체어 이용자나 영유아 동반 가족이 '귀덕해안길을 걷고 나서 휠체어로 들어갈 수 있고 장애인화장실이 있는 식당이나 숙소가 근처에 있는가'를 확인하거나, 무장애 관광 지도를 만들 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 시설 명칭·주소를 맞춰 보는 방식으로만 연결한다.
description_portal: '제주특별자치도 내 귀덕해안길_무장애주변관광지 데이터를 제공합니다.* 제주특별자치도 귀덕해안길 인근에서 장애인·노약자·영유아 동반 가족 등 관광약자의 무장애 여행이 가능한 주변 관광시설 정보를 체계적으로 정리한 통계자료입니다. 본 자료에는 음식점, 카페 및 편의점, 숙박시설, 관광지 등 다양한 유형의 시설에 대해 명칭, 거리, 주소, 전화번호, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등이 포함되어 있으며, 이동이나 이용에 제약이 있는 이용자의 방문 여건을 객관적으로 확인할 수 있습니다. 또한 이 정보는 무장애 관광 지도 제작, 관광서비스 접근성 개선, 접근성 평가 및 관광정책 수립 등에 유용한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
