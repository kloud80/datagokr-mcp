description_portal: 울산광역시 북구 공공체육시설 현황 데이터로, 울산광역시 북구의 공공시설 구분, 체육시설명, 체육시설의 위치 정보를 제공하고 있습니다.해당 데이터를 활용하기에 적합한 대상으로는 체육관 개관을 계획하는 사업자, 체육관을 이용하는 주민, 특정 스포츠를 즐길 수 있는 공간을 찾고 계신 분들입니다.포함된 장소로는 범용적으로 사용가능한 운동장, 강의를 신청할 수 있는 체육센터, 뛰거나 일정 공간내에서 행해지는 다목적구장과 네트가 필요한 족구장 및 테니스, 배드민턴장, 많이 분포하지 않은 국궁장, 게이트볼장이 있습니다.추가적인 문의사항은 문화체육과(공공체육시설 담당), 미디어정보과(공공데이터 담당)에 연락주시기 바랍니다.
