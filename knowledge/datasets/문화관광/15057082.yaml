summary_user: 경기도 내 공공 수영장을 시설 한 곳당 한 행으로 담으며, 시설명·소유기관·운영조직·준공연도·건설사업비·부지/건축 면적·정규/비정규 경영장 레인 수와 수영조면적·관람석 수 등을 포함한다. 생활체육 이용자가 우리 시군의 공공 수영장 위치·연락처를 찾거나, 분석가가 '어느 시군에 대회 개최가 가능한 정규 레인 수영장이 있는가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명·시군코드(SIGUN_CD)나 정제 주소·우편번호로 경기도 다른 체육시설 현황 데이터와 이름·코드 매핑으로만 잇는다.
description_portal: '경기도의 공공체육시설 중 수영장 체육시설 현황입니다. 시설명, 준공연도, 소유기관명, 부지면적 등의 정보를 제공합니다.이 데이터는 경기도 내 공공 수영장의 현황을 나타내며, 각 시설의 명칭, 준공연도, 소유기관, 관리주체, 운영조직, 실내외 구분, 건설사업비, 수영장 형태, 좌석 수, 수영조면적, 레인 수 등 총 29개 항목으로 구성되어 있습니다.실내 수영장을 중심으로 수영장별 건축 규모 및 운영 정보, 관람석 유무 및 수용 인원 등의 세부 시설 정보를 포함하고 있으며, 이는 지역 체육시설 현황 분석, 공공 체육자원 분포 조사, 수영 인프라 투자 계획 수립 등에 활용됩니다. 특히 수영조면적, 정규/비정규 레인 수, 좌석형태 등은 대회 개최 여부와 시민 이용 편의성 판단에 중요한 기준이 됩니다.실내외구분명 ‘실내’ : 해당 수영장이 실내에 설치된 구조물로, 기후 영향을 적게 받고 연중 운영이 가능한 형태임.정규경영장 / 비정규경영장 : 대한수영연맹 기준에 따른 정규 수영장과 일정 기준 미달이나 훈련, 체험용으로 사용되는 비정규 수영장을 구분.수영조면적(㎡) : 수영장에서 실제 물이 채워져 경영 또는 체험이 이루어지는 수면의 면적으로, 시설 규모의 직접적 지표임.'
