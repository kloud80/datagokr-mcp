summary_user: JDC가 운영하는 제주항공우주박물관의 전시실별 현황을 층·공간 구분과 위치, 면적, 전시내용, 영상·모형·패널·작동 전시물 수량으로 정리한 집계 표이며, 파일 크기가 817바이트인 소규모 CSV다. 전시 기획자나 분석가가 "이 박물관에서 관람객이 직접 조작하는 체험형 전시물은 어느 전시실에 얼마나 있나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(문화시설 코드 등)가 없어서 다른 데이터와는 박물관 이름이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 이 데이터는 제주특별자치도에 위치한 국토교통부 산하 공기업인 제주국제자유도시개발센터(JDC)에서 운영하는 제주항공우주박물관의 2018년 6월 기준 전시현황을 정리한 자료입니다. 데이터는 각 전시실의 구분(층수), 위치, 면적, 전시내용, 영상, 모형, 패널, 작동 항목으로 구성되어 있으며, 전시실의 구분에는 1층, 2층, 옥상 등 건물의 물리적 층수와 우주체험관, 테마존, 특수시설 등의 전시 공간 구분이 포함되어 있습니다. 전시내용 항목에는 상징조형물, 대한민국 공군갤러리, 항공역사관, 어린이 체험관 등 전시실별 주제와 관련된 주요 콘텐츠가 명시되어 있어 공간별 전시 주제를 쉽게 파악할 수 있습니다. 영상, 모형, 패널, 작동 항목은 각 전시물의 유형별 설치 수량을 수치로 나타낸 것으로, 전시 구성의 밀도와 콘텐츠 구성을 정량적으로 분석할 수 있게 해줍니다. 특히 작동 항목은 실제로 관람객이 조작하거나 체험할 수 있는 인터랙티브 요소의 비중을 나타내며, 관람객 참여형 전시의 규모를 확인하는 데 유용합니다. 이 데이터는 박물관의 전시 콘텐츠 운영 현황, 공간 활용 효율성, 체험형 전시비율 등을 종합적으로 분석할 수 있는 기초 자료로 활용될 수 있으며, 향후 전시 기획, 시설 리뉴얼, 교육연계 콘텐츠 개발 등의 전략 수립에 있어 유의미한 참고자료로 활용 가능합니다.
