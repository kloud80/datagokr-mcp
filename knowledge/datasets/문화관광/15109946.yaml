description_portal: '- 전라남도 농업박물관에서 소장하고 있는 각종 농경 생활용품을 비롯한 전통 생활민속용품 등에 대한 2D 데이터자료의 상세정보를 조회할 수 있습니다.- 전라남도 영암군 삼호읍에 위치한 전라남도 농업박물관은 1993년 9월 24일 개관한 공립 농업 전문 박물관으로, 전라남도의 풍부한 농업 문화유산을 연구·수집·보존·전시하는 공간입니다 .- 농경문화관 (본관): 선사 시대부터 현대 미래 농업 트렌드까지 시대별 농경 발달사, 사계절 농경 생활, 공동체 및 신앙·놀이 문화를 전시합니다.- 쌀문화관: ‘겨레와 함께한 쌀’ 주제로 쌀의 역사와 생태·문화·경제·환경 등 종합 콘텐츠를 AR 및 XR 체험과 함께 보여줍니다.- 남도생활민속관: 전형적인 남도 주택 구조, 의생활·식생활·공예·민속신앙 등 지역 생활문화 재현'
