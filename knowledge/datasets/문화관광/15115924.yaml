summary_user: 서울 강서구의 인터넷컴퓨터게임시설제공업(PC방) 업소를 한 건씩 담은 인허가 원천 데이터로, 인허가일자·폐업일자·영업상태·사업장명·지번/도로명 주소·좌표와 시설면적·층수·비상구 등 시설 항목을 포함한다. 창업 예정자나 분석가가 '강서구에서 지금 영업 중인 PC방은 어디에 몇 곳이고 최근 폐업은 얼마나 되나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드로만 연결한다.
description_portal: 서울특별시 강서구 지역 내 인터넷컴퓨터게임시설제공업에 해당하는 업소 정보를 수록한 자료로, 주로 PC방 형태로 운영되며 게임물 이용에 필요한 컴퓨터 및 관련 장비를 갖추고 이용자에게 서비스를 제공하는 업소의 인허가 현황을 포함하고 있습니다. 데이터는 인허가일자, 사업장명, 주소, 영업상태, 문화체육업종명 등을 기반으로 구성되어 있으며, 해당 업종은 청소년 및 일반인의 여가 활동, e스포츠 저변 확대, 지역 내 소상공업 경제 활동과 밀접한 관련이 있습니다. 본 자료는 강서구 내 게임문화 소비 인프라 현황을 파악하는 데 유용하며, 관련 업계의 밀집도, 창업 현황, 규제 동향 등도 분석할 수 있습니다. 또한 디지털 콘텐츠 소비 트렌드와 공공안전, 청소년 보호정책 수립 등 다양한 정책적 활용이 가능합니다.
accrual_periodicity: 수시
