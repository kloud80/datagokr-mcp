description_portal: 경상북도 문화재지정내역 자료는 경상북도 내 각 시군별로 지정되어 있는 국가 및 도 지정 문화유산의 현황을 유형별로 집계한 통계성 자료입니다. 이 자료에는 국보, 보물, 사적, 명승, 천연기념물, 국가무형문화재, 국가민속문화유산, 등록문화유산과 함께 도 지정 유형문화유산, 무형문화유산, 기념물, 민속문화유산, 문화유산자료 등의 수량이 시군별로 정리되어 있습니다. 이를 통해 지역별 문화유산 보유 현황과 유형별 분포 상태를 한눈에 파악할 수 있으며, 문화유산 보존·관리 정책 수립, 문화재 행정 업무, 지역 문화자원 관리 계획 수립을 위한 기초 참고 자료로 활용할 수 있습니다. 본 자료는 경상북도 내 문화유산 관리 현황을 체계적으로 파악하고 정책 수립에 활용하기 위한 현황성 통계 자료입니다. 자료 관련 문의는 054-880-3177로 하시기 바랍니다.
