description_portal: "인천광역시 인천투어 설문조사 이벤트 공공데이터는 인천시가 관광포털 '인천투어'에서 시행한 설문 이벤트의 결과를 정리한 데이터입니다.이 파일은 시민과 관광객이 인천투어 서비스에 대해 남긴 다양한 의견과 기본정보(성별, 연령, 이용 횟수 등)를 담고 있어 인천시가 더 나은 관광정책을 만드는 데 큰 도움을 줍니다.데이터 구성과 특징1. 참여자 정보: 참가자의 성별, 연령, 관광포털 이용횟수 등 인구통계 자료가 포함됩니다.2. 이벤트 현황: 설문에 응답한 전체 인원과 각 항목별 선택 결과 등 이벤트 실적 현황이 표로 정리됩니다.3. 해당 목록은 2022년에 실시한 설문조사로 1회성 데이터입니다."
