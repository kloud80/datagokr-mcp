summary_user: 한국관광공사 TourAPI의 일문판으로, 전국 관광지·행사·숙박 등 관광정보와 사진정보를 지역코드·분류코드 목록, 지역·위치 기반 목록, 키워드 검색, 상세(공통·소개·반복·이미지) 정보 등 14종 오퍼레이션으로 개별 콘텐츠(주소·좌표) 단위로 제공합니다. 일본인 관광객 대상 여행 앱·웹 개발자가 "특정 지역의 관광지와 축제를 일본어 설명과 사진으로 보여주려면 어디서 받나" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 같은 TourAPI 계열(국문·타 언어판)과는 콘텐츠 ID나 지역코드·시군구코드(code, name) 같은 기관 자체 코드로만 연결한다.
description_portal: '- 국내관광정보서비스 OpenAPI 신규 상세기능(법정동코드, 신분류코드) 안내 URL(https://api.visitkorea.or.kr/#/cmsNoticeDetail?no=207)- 한국관광공사가 보유하고 있는 전국의 다양한 관광정보와 사진정보를 실시간으로 제공 받을 수 있으며,국내 최대 관광정보 포털 사이트 Visitkorea(japanese.visitkorea.or.kr) 홈페이지에서 제공하는 관광정보 중 저작권 등에 구애 없이 자유롭게 활용 가능한 정보만을 선별하여 OpenAPI를 통해서 최신정보를 제공하고 있습니다. - 개방 데이터는 지역코드정보, 서비스분류코드정보, 법정동코드정보, 분류체계코드정보, 지역기반관광정보, 위치기반관광정보, 키워드검색, 행사정보, 숙박정보, 공통정보, 소개정보, 반복정보, 이미지정보, 관광정보 동기화 목록정보 14종 약 8만 건의 국내 관광에 대한 전반적인 정보를 일문으로 제공합니다.- 모바일 앱 뿐만 아니라, 웹서비스, 태블릿, 홍보물, 잡지 등 다양한 매체에서 어플리케이션을 개발, 활용할 수 있으며 다양한 활용을 통해서 신규/융복합 관광서비스를 창출할 수 있습니다. ※ 제공되는 데이터중 사진 자료의 경우, 피사체에 대한 명예훼손 및 인격권 침해 등 일반 정서에 반하는 용도의 사용 및 기업 CI,BI로의 이용 금지하고 있습니다. (공공누리 1유형, 3유형 이미지 제공됨)'
