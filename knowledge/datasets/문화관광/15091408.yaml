summary_user: 인천광역시 관내에 등록되어 운영 중인 박물관을 한 곳씩 나열한 목록 파일로, 설치 구분(공립·사립·대학), 시군구, 박물관명, 주소, 관리기관, 전화번호를 담는다. 시민·관광객이나 문화정책 담당자가 '인천 어느 구에 어떤 공립·사립·대학 박물관이 있고 연락처는 무엇인가'를 확인하거나 지역별 박물관 분포를 파악하는 데 쓴다. 전역 조인 키가 없어 다른 문화시설 데이터(문화기반시설총람 등)와는 박물관명·주소 같은 이름 매칭이나 시군구 단위로만 이어 쓴다.
description_portal: '인천광역시가 제공하는 등록 박물관 현황 공공데이터는 관내에 등록되어 운영 중인 박물관의 설치 구분(공립/사립/대학), 주소, 관리 기관 등의 상세 정보를 집계한 목록 자료입니다. 이 데이터는 지역 문화 시설 인프라의 현황을 파악하고, 지역 문화 예술 정책 수립, 관광 정보 제공, 교육 및 연구 활동 지원 등의 기초 자료로 활용되는 것을 목적으로 합니다.*구분: 박물관의 설치 주체를 구분합니다.-공립: 시립, 구립 등 공공기관이 운영하는 박물관입니다.-사립: 재단, 개인 등이 운영하는 박물관입니다.-대학: 대학교 소속의 박물관입니다.'
