summary_user: 경상북도 김천시 관내 공공 생활체육시설을 시설 한 곳당 한 행으로 담은 파일(csv, 약 1.9KB)로, 시설명·지번주소·시설유형(축구장·테니스장·체육관 등)·위도·경도·관리기관과 전화번호를 포함한다. 김천시 주민이나 위치 기반 안내 서비스 개발자가 '우리 동네 근처에 어떤 공공 체육시설이 있고 어디에 문의하나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소 같은 이름 매칭이나 위도·경도 좌표로만 이어 쓴다.
description_portal: '이 데이터는 경상북도 김천시 관내의 공공 생활체육시설 정보를 수록한 자료로, 시민들이 다양한 체육활동을 손쉽게 이용할 수 있도록 제공됩니다. 주요 항목으로는 체육시설명, 소재지 지번 주소, 시설유형(예: 축구장, 테니스장, 체육관 등), 관리기관(예: 김천시청, 읍·면·동 주민센터 등), 전화번호 등이 포함되어 있어 체육시설의 위치 및 관리현황을 체계적으로 파악할 수 있습니다. 지역 주민의 건강 증진과 여가 활성화를 위한 행정 기초자료로 활용 가능하며, 체육 정책 수립, 시설 운영 효율화, 민간 협력 사업 발굴 등에도 도움이 됩니다. 또한 공공데이터 활용 기업이나 플랫폼에서 위치 기반 체육시설 안내 서비스 개발에도 유용하게 활용될 수 있습니다.'
