summary_user: 서울 동작구 안 당구장업의 인허가 정보를 사업장 1곳당 1행으로 담은 건별 원천 데이터로, 사업장명·지번/도로명 주소·좌표, 인허가일·폐업일, 영업상태(정상·휴업·폐업), 보험가입 여부, 건물 면적·종사자 수 등을 포함한다. 동작구에서 지금 영업 중인 당구장이 어디에 몇 곳 있는지, 최근 폐업이나 휴업이 늘었는지를 보려는 창업 예정자나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 체육시설업이나 상권 데이터와는 주소·좌표나 관리번호(MGTNO)·개방자치단체코드 같은 기관 내부 코드로만 맞춰 잇는다.
description_portal: 당구장업 인허가 정보 데이터는 시민에게 실내 체육과 레저 활동을 제공하는 시설 현황을 담고 있습니다.사업장명과 주소 정보는 각 당구장의 위치와 기본 정보를 제공합니다.문화체육업종명은 당구 등 다양한 실내 체육 게임 유형을 구분합니다.영업상태 항목은 정상, 휴업, 폐업 등 현재 운영 여부를 보여줍니다.보험가입여부 코드는 종업원과 이용자의 안전을 보장하기 위한 보험 가입 현황을 나타냅니다.시설규모 정보는 면적 등 시설 환경을 보여줍니다.종사자 현황은 관리자, 직원 등 규모를 나타냅니다.
