description_portal: 광주광역시 남구 양림동에 위치한 「이장우 가옥」 일별 입장객 현황을 제공합니다. 해당 데이터는 광주광역시 남구청 문화관광과(☎062-607-2321)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 이장우가옥은 500여 평 규모 대지 위에 안채·사랑채·행랑채·곳간채·문간채로 구성된 근대 상류층 한옥으로, 초기 건축은 1899년부터 시작되었고 이후 증개축을 거쳐 현재의 형태를 갖추었습니다. 안채는 ‘ㄱ’자형 평면과 대청·툇마루·부엌 등 독특한 공간 구성으로 근대 한옥의 특징을 보여 주며, 원형 보존 가치가 인정되어 광주광역시 민속문화재로 지정되었습니다. 전통 한옥과 정원이 조화된 문화유산으로, 근대기 상류 주거문화를 이해할 수 있는 대표적인 사례입니다. 해당 데이터는 여행 플랫폼의 방문 통계 분석, 관광객 행동 예측, 지역 문화콘텐츠 개발 등 다양한 산업 분야에서 활용 가치가 있을 것으로 보입니다.
