summary_user: 제주 곤을동 환해장성 구간의 무장애 여행 코스를 지점(포인트)별로 담은 파일로, 각 행에 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부가 들어 있다. 휠체어 이용자나 교통약자, 동행 가족이 '곤을동 환해장성을 휠체어로 돌 때 어느 지점이 노면·경사·화장실·주차 여건상 다닐 만한가'를 확인하는 데 쓰고, 열린관광지 조성이나 무장애 관광 정책의 기초자료로도 쓴다. 실측 컬럼에 전역 조인 키나 TourAPI contentId 같은 코드는 없어서, 다른 관광 데이터와는 위도·경도 좌표나 장소 이름을 맞춰 연결해야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_곤을동환해장성_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 소재 곤을동 환해장성 구간을 중심으로 구성된 무장애 여행 코스 정보를 제공합니다. 해당 자료는 교통약자 및 휠체어 이용자의 이동 편의를 고려하여 위치(위도·경도), 구분, 설명, 추천코스 등의 정보를 포함하고 있으며, 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 실제 이동 여건을 반영하였습니다. 무장애 관광환경 구축, 열린관광지 조성, 관광 서비스 개선 및 정책 수립 등에 필요한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
