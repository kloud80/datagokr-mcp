summary_user: 경기도 공공체육시설 가운데 승마장을 시설 한 곳씩 담은 현황 자료로, 집계연도·시군·시설명·소유·운영기관·관리주체·연락처와 부지·건축 면적, 주마장·보조·실내 마장 규격, 관람석 수, 준공연도, 공사비를 담는다. 지자체 체육 담당자나 승마 수요 분석가가 어느 시군에 공공 승마장이 있고 실내마장과 관람석 규모가 어느 정도인지 비교하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 시설명으로 같은 경기도 체육시설 자료와 맞춰 이어 쓴다.
description_portal: 경기도 공공체육시설현황중 승마장 시설 현황입니다. 시설명, 연락처, 관리주체명, 부지면적 등의 정보를 제공합니다.이 자료는 대한민국 내 공공 체육시설 중 승마장 현황을 시·도별로 집계한 데이터입니다. 주요 항목으로는 시도, 시설명, 주소, 개방 여부, 등록번호, 개장 연도, 이용료 등이 포함되어 있으며, 총 17개 시도에 걸쳐 승마장의 위치와 운영 상태를 망라하고 있습니다. 예컨대 “서울특별시 OO승마장”처럼 특정 승마장의 지자체 소속 및 개장 정보를 확인할 수 있으며, 이를 통해 지역 간 프로젝트 설계, 승마 수요 분석, 정책 수립 시 비교 지표로 활용할 수 있습니다. 단, 이용료는 변경 가능성 있으므로 실제 이용 시 최신 정보 확인이 필요하며, 시설의 등록번호는 관리·행정 목적으로 쓰입니다. 이 데이터는 공공체육시설 확보 및 활성화 정책, 지역별 시설 분포 분석, 승마산업 현황 연구 등에 유용합니다.
