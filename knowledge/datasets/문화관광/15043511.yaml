summary_user: 송악산전망대 한 곳의 무장애여행 관련 지점 정보를 위도·경도·해발고도 좌표와 아이디 단위로 담은 제주데이터허브 외부 제공 데이터다. 교통약자나 휠체어 이용자를 위한 지도 서비스 개발자, 관광 안내 자료 제작자가 "송악산전망대의 무장애 동선과 지점이 지도상 어디에 있나"를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소명 매핑이나 좌표 근접으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 송악산전망대 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 제주특별자치도에서 제공하는 본 데이터는 송악산전망대의 무장애 여행 관련 장소 정보를 담고 있다. 위도·경도 좌표를 포함한 위치 정보, 관광지 명칭, 장소 설명, 이미지 정보 등이 포함되어 있으며, 교통약자 및 휠체어 이용자를 고려한 무장애 여행지로서의 접근성 데이터로 활용될 수 있다. 이 자료는 관광지의 접근 가능성, 무장애 편의시설 유무, 위치 기반 지도 서비스, 관광 안내 자료 제작, 열린관광지 조성 및 관광 정책 수립 등 공공·관광 분야에서 기초자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
