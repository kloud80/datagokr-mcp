summary_user: 서울특별시 중구의 비디오물제작업 신고 업소를 업소 한 곳당 한 행으로 담은 인허가 원천 데이터로, 관리번호(MGTNO), 인허가·폐업 일자, 영업 상태, 지번·도로명 주소, 중부원점TM 좌표 등을 포함한다. 영상콘텐츠 제작 창업을 준비하는 예비 사업자가 '중구에 영업 중인 비디오물 제작업체가 어디에 몇 곳 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중구의 영화제작과 같은 비디오물을 제작하거나 복제하는 업 소정보입니다. 데이터는 각 신고업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 영상산업 및 문화산업 분야의 영상콘텐츠 제작 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 신고업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 법적 기준을 충족하며 등급분류 등 절차를 준수하는 신뢰할 수 있는 영상콘텐츠 제작업체의 위치를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
