summary_user: 경상북도 경주시가 지정한 모범음식점을 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·영업자 성명·도로명 소재지·전화번호·업태·주된 음식을 담는다(약 12KB 규모의 CSV). 관광객이나 시민이 '경주에서 위생·서비스가 검증된 한식당을 어디서 찾을까'를 확인하거나, 관광 콘텐츠·지도 서비스 제작자가 추천 음식점 목록을 만드는 데 쓴다. 전역 조인 키가 없어 TourAPI 음식 콘텐츠나 다른 업소 데이터와는 업소명·도로명 주소를 맞춰 이어 써야 한다.
description_portal: 경상북도 경주시에서 지정한 모범음식점의 현황 정보를 제공하는 공공데이터이다. 음식점명, 운영자명, 소재지 주소, 전화번호, 업태명, 주된 음식 항목 등으로 구성되어 있으며, 위생 상태가 양호하고 서비스 품질이 우수한 업소에 대한 정보를 담고 있다. 시민과 관광객이 신뢰하고 이용할 수 있는 음식점을 선택할 수 있도록 지원하며, 지역경제 활성화와 음식문화 수준 향상에도 기여한다. 본 데이터는 위생관리 유도와 행정기관의 정책 수립, 평가 및 관리의 기초자료로 활용된다. 또한, 관광 콘텐츠 제작, 위치 기반 서비스 등 다양한 분야에서 활용될 수 있다. 파일 데이터 형식으로 제공되며, 정기적으로 갱신되어 최신 정보를 반영하고 있다.
