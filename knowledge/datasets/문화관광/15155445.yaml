description_portal: 안동시 체육시설현황 데이터는 안동시 관내에 설치·운영 중인 각종 공공 및 생활 체육시설의 위치,  주요 시설, 문의처 등을 종합적으로 수록한 기초 행정 데이터입니다. 본 데이터는 시민들의 체육 활동 접근성을 향상시키고, 지역 체육 인프라의 균형적 배치를 위한 정책 자료로 활용될 수 있도록 정기적으로 조사·관리되고 있습니다.본 데이터는 도시계획, 체육 인프라 확충, 주민 생활환경 개선, 시설 유지관리 및 신규 조성 계획 수립 등 다양한 행정 분야에서 활용이 가능하며, 민간에서도 지도 기반 서비스, 운동시설 위치 제공 서비스, 지역 체육 활동 분석 등의 목적으로 사용할 수 있습니다. 체계적인 체육시설 정보 제공을 통해 시민의 건강 증진 및 생활체육 참여 활성화에 기여하는 것을 목표로 합니다.
