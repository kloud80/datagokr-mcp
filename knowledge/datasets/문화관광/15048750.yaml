description_portal: 서울시 한양도성 행사 및 프로그램 정보 데이터는 한양도성과 관련된 각종 행사, 프로그램, 홍보 콘텐츠를 배너 형태로 관리하고 제공하기 위한 자료입니다. 배너 ID와 배너구분은 개별 배너를 구분하고 유형을 식별하는 기본 정보이며, 배너명과 설명, 에디터 설명은 이용자에게 노출되는 행사명과 내용 소개를 구성하는 핵심 요소입니다. 링크 URL은 상세 안내 페이지나 예약·접수 사이트로 직접 이동할 수 있는 경로를 제공하고, 이미지명과 이미지파일은 온라인·모바일 화면에서 시각적으로 행사를 알리는 데 활용됩니다. 정렬순서는 여러 배너 중 노출 우선순위를 조정하기 위한 값이며, 반영여부와 에디터 사용여부는 실제 서비스 화면에 배너를 표시할지, 편집기 기반 콘텐츠를 적용할지를 제어하는 관리용 항목입니다. 등록ID·등록일과 최종수정ID·최종수정일 정보는 데이터의 생성과 변경 이력을 추적할 수 있게 해 주어, 최신 행사와 종료된 프로그램을 구분하고 관리하는 데 중요한 기준으로 활용됩니다. 이 데이터는 한양도성 공식 홈페이지, 관광 포털, 모바일 앱 등에서 한양도성 관련 행사와 프로그램을 시민과 관광객에게 체계적으로 안내하기 위한 기본 인프라 자료입니다.
