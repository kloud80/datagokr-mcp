summary_user: 서울특별시 중구에 있는 종합체육시설업(수영·골프·체육단련 등) 업소를 한 곳씩 담은 인허가 명부로, 관리번호(MGTNO), 인허가·취소·폐업 일자, 영업 상태, 지번·도로명 주소, 사업장명, 좌표를 담는다. 예비 창업자가 중구에서 영업 중이거나 최근 폐업한 종합체육시설이 어디에 얼마나 있는지 확인하거나, 분석가가 체육시설 개폐업을 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 지역의 체육시설업 인허가 데이터나 상권 데이터와 나란히 놓고 본다.
description_portal: '서울특별시 중구의 수영, 골프, 체육단련 등과 같은 체육시설을 한 곳에 모아놓은 업소 정보입니다. 데이터는 각 종합체육시설업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 종합체육시설업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 정보를 제공하며, 일반 시민 및 다중이용 시설 이용자에게는 종합체육시설업의 위치 및 시설 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
