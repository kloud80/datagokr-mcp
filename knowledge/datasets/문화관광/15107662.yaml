summary_user: 국민체육진흥기금 기금지원시스템의 지원 실적을 사업연도·프로그램·단위사업·세부사업·기관(단체)별로 담고, 사업예산금액과 실적(지원)금액, 세출목명을 함께 제공하는 전국 단위 집계성 조회 API입니다. 체육 정책 분석가나 경기단체 담당자가 "특정 연도에 어느 단체가 어떤 사업으로 기금을 얼마나 받았고 예산 대비 얼마나 집행했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(org_nm)·사업명 같은 이름 매칭이나 같은 공단의 코드로만 연결한다.
description_portal: 국민체육진흥기금 종합지원실적지표는 년도, 프로그램, 단체명 등의 조회조건을 이용해 서울올림픽기념국민체육진흥공단에서 관리하는 기금지원시스템의 조회하는 기능을 제공합니다. 사업연도, 프로그램명, 단위사업, 세부사업명, 기관명, 내역사업, 보조사업, 사업예산금액, 실적금액, 세출목명 등의 정보를 포함하고 있습니다. 간단히 말해 체육진흥공단에서 관리하는 기금지원시스템의 종합지원실적지표정보에 대해 조회할 수 있는 서비스입니다. 이 서비스는 체육 관련 기금의 지원 현황과 집행 실적을 분석하여 예산 계획 수립 및 정책 평가에 활용할 수 있습니다.
