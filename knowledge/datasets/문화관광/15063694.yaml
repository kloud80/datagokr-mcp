description_portal: '서울특별시 은평구 종교시설 현황입니다. 은평구 종교시설 현황 속성은 소재구, 유형, 시설명, 소재지주소로 구성되어있습니다.해당 데이터는 서울특별시 은평구 내 종교시설 580여 개소의 명칭, 주소, 종교 유형을 정리한 현황 정보입니다.주요 구성 비율개신교 계열 교회: 전체의 80% 이상 (갈릴리순복음교회, 사랑의교회, 여의도순복음교회 등)불교 사찰: 50여 개소 (진관사, 각황사, 불광사 등 - 주로 북한산 자락 위치)천주교 성당: 9개 본당 (녹번동성당, 불광동성당, 갈현동성당 등)기타: 원불교, 여호와의 증인, 말일성도 등 소수 포함데이터 특징여의도순복음교회의 경우 본교회 외에도 1교구부터 15교구까지 각각의 기도처가 구내 전역에 분포되어 있습니다. 같은 이름의 교회가 서로 다른 동네에 여러 곳 존재하는 경우도 많습니다.데이터 한계종교시설은 등록허가업이 아니므로 신설·폐쇄가 빈번하여 실제 현황과 차이가 있을 수 있습니다. 2021년 기준 참고자료로만 활용 권장됩니다.'
