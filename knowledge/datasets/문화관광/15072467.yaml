summary_user: 세븐럭 카지노 강남코엑스점의 전자게임기기별 고객 이용 현황을 담은 건별 기록 파일로, 2019년 4월 26일부터 28일까지 사흘간 기기 구분번호·이용 일자·기기 발생 번호와 결과값(총 베팅금액 또는 총 게임횟수)을 담는다. 분석가가 외국인 전용 카지노에서 어떤 전자게임기기에 베팅과 게임 횟수가 몰렸는지 날짜별로 비교하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 같은 기관의 다른 데이터와는 기기 구분번호 같은 이름·코드를 맞춰 붙이는 방식으로만 이을 수 있다.
