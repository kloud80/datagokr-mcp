description_portal: '조사개요- 청소년 도박이 날로 심화됨에 따라 청소년의 도박 실태 및 인식 등에 대해 파악하기 위해 시행되는 조사통계- 통계종류: 일반, 조사통계(승인통계)- 법적근거 : 승인번호 제469001호조사목적- 국가 차원의 청소년 도박 실태 데이터를 체계적으로 수집·분석하여 예방정책 수립에 활용할 수 있는 기초자료 확보가 필요한 상황임- 이에 청소년의 도박 행동, 인식 및 태도 등의 변화를 정기적으로 파악하고 추이를 분석함으로써, 청소년 도박 예방정책을 효과적으로 추진하기 위한 신뢰성 있는 근거자료를 마련하고자 하며, 궁극적으로 청소년의 건강한 성장 환경을 조성하는 데 목적이 있음조사대상 및 표본설계-목표 모집단 : 2025년 현재 초등학교 고학년(4~6학년), 중학교, 고등학교에 재학 중인 학생-조사 모집단 : 조사 시점에 초등학교 고학년(4~6학년), 중학교, 고등학교에 재학 중인 학생-표본틀 : 교육기본통계조사 내 유·초·중등 교육기본통계(2024년 하반기 기준)-표본 규모 : 초등학교 4학년~고등학교 3학년 13,000명-표본추출방법 : 학교급(4), 시도(17) 항목에 대한 제곱근 비례배분조사방법 및 조사체계-조사 방법 : 학교방문 온라인 자기기입식 집단설문조사-조사 체계 : 조사 전문기관 → 한국도박문제예방치유원조사항목- 도박 인지 및 정보 노출 현황, 도박 이용 실태, 예방교육 참여실태, 도박 인식과 태도 등 34문항조사다상별 문항 차이- 초등학생과 중고등학생으로 구분한 설문에서 문항의 수나 내용은 차이가 없으나 초등학생의 경우 용어에 대한 개념이나 문장에 대한 이해도가 낮아 비교적 쉬운 용어를 표기하였음'
