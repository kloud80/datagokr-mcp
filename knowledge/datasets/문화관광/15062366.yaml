summary_user: 광산구 도서관들이 운영하는 강좌·체험 프로그램을 강좌 한 건당 한 행으로 담은 파일로, 강좌명·강사·대상·운영요일·장소·수강료·내용·도서관명을 포함한다(CSV 약 4KB의 소규모 목록). 주민이 '우리 동네 도서관에서 초등학생 대상 무료 독서·글쓰기 강좌를 무슨 요일에 하는지'를 찾거나, 분석가가 도서관별 평생교육 프로그램 구성을 살펴보는 데 쓴다. 실측 컬럼에 도서관코드 같은 전역 조인 키가 없어, 다른 도서관 목록 데이터와는 도서관명(도서관명) 이름 매칭으로만 연결한다.
description_portal: 광주광역시 광산구 도서관 프로그램 현황에 관한 데이터로 강좌명, 강사, 대상, 운영요일, 장소, 수강료 등의 항목을 제공합니다. 광주광역시 광산구 도서관에서는 지역 주민들의 평생 교육과 문화 확산을 위해 다양한 프로그램을 운영하고 있으며, 이에 대한 현황 데이터에는 중요한 항목들이 체계적으로 수록되어 있습니다. 강좌명을 통해 어떤 주제의 교육·강연·체험이 제공되는지 알 수 있으며, 예를 들어 인문학, 독서지도, 글쓰기, 그림책 만들기, 외국어 회화 등 여러 장르가 포함됩니다. 대상 항목을 보면 유아, 아동, 청소년, 성인, 노인, 가족 등 누구를 위한 강좌인지 파악할 수 있습니다.운영요일과 함께 장소 정보도 제공되어, 프로그램이 일정에 맞추어 도서관 내 어느 공간(열람실, 강의실, 다문화실 등)에서 열리는지를 확인할 수 있습니다.이처럼 광산구 도서관 프로그램 현황 데이터는 시민들의 학습 기회를 확장하고 도서관 자원을 효과적으로 활용하기 위한 기초 자료로 활용될 수 있습니다.
