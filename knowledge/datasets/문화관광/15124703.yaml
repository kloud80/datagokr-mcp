description_portal: 의정부도시공사에서 운영하는 컬링장 이용 요금에 관한 정보입니다. 컬링시트를 사용하는 체육경기 및 체육경기 외 행사시 컬링장 이용요금에 대한 정보입니다. 컬렁장 이용요금은 시트당 2시간 기준입니다.평일과 주말을 구분하여 이용시간대별 이용요금 현황을 세부 정보로 제공하고 있습니다.의정부도시공사에서 운영하는 컬링장 이용희망자 및 단체, 기타 정보수요자는 해당 정보를 통해 정확하고 신속하게 요금 현황 관련 정보에 접근하실 수 있습니다.의정부도시공사 대표 홈페이지에 접속하시면 시설소개>컬링경기장>컬링경기장 소개에서도 해당 정보를 확인할 수 있습니다.https://www.uiuc.or.kr/facilityInfo/curlingPage/curling/content.do2025.12.31. 기준으로 현행화된 정보를 제공하고 있습니다.
