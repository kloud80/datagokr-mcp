description_portal: 이 데이터는 한국문화예술위원회가 2014년부터 2019년까지 시행한 문학 분야 문예지 발간 지원사업의 개요를 정리한 자료입니다. 주요 항목으로는 문학단체명, 사업연도, 사업시작일 및 종료일, 문예지 분야(종합, 시(조), 희곡, 수필, 평론 등), 발간주기, 발간형태(종이책, 전자책, 웹진, 기타), 종이책·전자책 총 발행호수(호), 웹진 누적 방문수(명) 등이 포함되어 있습니다. 문예지의 발행 방식과 형식, 장르별 특성, 디지털 전환 정도, 온라인 접근성 등을 종합적으로 파악할 수 있는 자료로, 문학 지원사업의 운영 현황 분석 및 향후 발간 전략 수립에 유용하게 활용될 수 있습니다.
