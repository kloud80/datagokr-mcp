summary_user: 전주시 관광명소를 한 곳당 한 행으로 담은 지자체 관광지 목록 파일로, 명소명·도로명/지번 주소·전화번호·운영여부·운영시간·이용요금·편의시설·홈페이지·위경도를 담는다(내려받은 CSV는 1,564바이트의 소규모 파일). 전주 여행을 계획하는 사람이나 관광 안내 서비스 개발자가 '지금 운영 중인 전주 명소는 어디이고 몇 시에 문을 열며 요금은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 명소명이나 주소·위경도 좌표로 맞춰 TourAPI 관광지 정보나 지도 데이터와 이어 쓴다.
limits: TourAPI의 콘텐츠ID 같은 공통 키가 없어 다른 관광 데이터와 붙이려면 이름이나 좌표 매칭이 필요하다. 범위는 전주시 한 곳뿐이라 다른 시군구와 비교하려면 별도 자료가 필요하다.
