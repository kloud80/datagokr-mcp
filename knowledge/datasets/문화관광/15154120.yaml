description_portal: 주제 정보 서비스는 국립중앙도서관의 주제명표목표(NLSH)를 핵심 데이터 기반으로 활용하여 구축된 표준화된 주제 접근점 제공 서비스입니다.NLSH는 자료의 주제 및 형식을 나타내는 용어와 그들 간의 계층적 관계를 포함한 관계 표기로 구성된 시소러스(통제어휘집)로서, 도서관 자료의 색인 및 검색 일관성을 확보하는 데 목적이 있습니다.주제 정보 서비스는 국제 표준인 SKOS(Simple Knowledge Organization System) 온톨로지 기반으로 설계되었으며, 이를 통해 우선어(USE), 비우선어(UF), 상위어(BT), 하위어(NT), 관련어(RT) 등의 항목을 제공합니다. 이러한 관계 정보를 활용하여 이용자는 검색 용어의 통일성을 확보할 수 있으며, 주제 간의 논리적 연계를 기반으로 검색 범위를 확장하거나 축소하는 정교한 탐색이 가능합니다. 나아가, 해당 주제에 연결된 서지정보와의 관계 정보까지 통합 조회할 수 있도록 지원함으로써, 도서관 및 아카이브 시스템 개발 시 자료 탐색의 정확성과 효율성을 획기적으로 향상시키는 데 기여합니다.
