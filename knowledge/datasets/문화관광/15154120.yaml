summary_user: 국립중앙도서관 주제명표목표(NLSH)의 주제어 하나하나를 개념 단위로 담아 채택표목·이형표목·관련어·이전/이후 용어·정의와 그 주제로 쓰인 자료 링크를 SKOS 형식으로 제공하는 전국 단위 비공간 API다. 도서관·아카이브 시스템 개발자나 서지 분석가가 '이 검색어의 표준 주제어는 무엇이고, 관련어로 검색 범위를 어떻게 넓힐까' 같은 질문에 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 전역 조인 키는 찾지 못해, 주제 제어번호(SUBJECT_ID)나 URI·주제어 이름 매핑으로 같은 기관의 서지 데이터와 연결해 쓴다.
limits: ISBN·도서관코드 같은 전역 조인 키가 없어 도서관정보나루 대출·인기도서 데이터와 바로 붙일 수 없고, 주제어 이름 매칭으로 연결해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
