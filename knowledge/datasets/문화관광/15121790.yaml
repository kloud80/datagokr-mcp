summary_user: 대한민국 구석구석(korean.visitkorea.or.kr)에 실린 전국 기초 지자체별 문화관광 홈페이지 주소를 지자체 한 곳당 한 행으로 담은 목록 파일이며, 고유 아이디·지역코드·시구군코드·홈페이지 주소 4개 항목으로 구성된다. 여행 앱·서비스 개발자나 여행자가 '이 시군구의 공식 문화관광 홈페이지는 어디인가'를 찾아 링크로 연결할 때 쓴다. 지역코드·시구군코드는 TourAPI 지역코드 체계와 맞춰 이어 쓰는 것이 자연스러우나, 실측에서 전역 조인 키는 확인되지 않았으므로 행정구역 이름이나 코드 매핑을 거쳐 다른 데이터와 연결한다.
description_portal: '- 여행 정보 확산을 통한 국내 관광 활성화 및 국민 편의 확대 등을 위해 한국관광공사 운영 국문 여행정보 제공 사이트 "대한민국 구석구석*"에서는 기초 지자체 문화 관광 홈페이지 URL 정보를 제공하고 있습니다.   * URL: korean.visitkorea.or.kr - 개방 데이터는 고유ID,지역코드,시구군코드,지역별 문화관광 홈페이지 URL로 총 4가지 정보로 구성됩니다. - 지자체별 여행소식  그리고 각 지역별 축제 정보 등 세부적인 여행정보는 "대한민국 구석구석 > 지역" 통해 확인 가능합니다.'
