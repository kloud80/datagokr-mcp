summary_user: 서울시가 선정한 서울미래유산을 유산 1건당 1행으로 담으며, 미래유산 ID·이름, 지역·소재지, 분야·유형, 선정연도, 건립시기·용도, 이력사항, 보존필요성·설명문, 대중교통·주차 안내, 좋아요·조회수, 좌표, 이미지 경로를 함께 제공한다. 시민이나 관광 안내 서비스 개발자가 '우리 동네 근처에 어떤 미래유산이 있고 어떻게 찾아가나'를 확인하거나, 분석가가 분야·선정연도별 미래유산 분포를 살피는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 국가유산청 지정유산(종목코드·지정번호) 데이터와는 유산명이나 좌표(XCRD·YCRD)로만 맞춰 써야 한다.
description_portal: 서울시 서울미래유산 정보는 서울의 역사, 문화, 생활사를 담고 있는 미래유산의 현황을 종합적으로 제공하는 데이터입니다. 미래유산 ID와 미래유산명으로 각 유산을 고유하게 식별할 수 있으며, 지역과 소재지를 통해 행정구역과 위치 정보를 함께 파악할 수 있습니다. 분야, 유형 1, 유형 2는 유산의 성격과 특성을 분류해 연구와 정책 수립에 활용하기에 적합한 구조입니다. 선정연도, 건립시기, 건립용도, 이력사항은 유산의 역사적 배경과 변천 과정을 이해하는 데 중요한 정보를 제공합니다. 보존필요성과 설명문은 미래유산의 가치와 의미를 시민에게 알리는 핵심 콘텐츠로 활용될 수 있습니다. 대중교통, 주차장 정보는 방문 편의를 높이는 데 도움이 되며, 좋아요 개수와 뷰 카운트는 시민 관심도와 대중적 인지도를 보여주는 지표입니다. 좌표 정보와 이미지경로는 지도 서비스, 관광 안내, 홍보자료 제작 등 다양한 공공·민간 서비스에서 활용 가능한 기반 데이터입니다.
