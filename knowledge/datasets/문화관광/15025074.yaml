summary_user: 부산광역시 연제구에 등록된 전통사찰을 사찰 한 곳당 한 행으로 담은 작은 파일(CSV 601바이트)로, 사찰명과 종단, 대표자 법명, 주소, 전화번호, 신도 수와 승려 수, 창립·중건 연대, 전통사찰 등록일을 담는다. 연제구에 어떤 전통사찰이 있고 언제 창건돼 언제 전통사찰로 등록됐는지, 연락처와 주소가 어떻게 되는지 확인하려는 주민·답사객·문화유산 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 사찰명이나 주소를 직접 맞추는 방식으로만 이어 쓴다.
description_portal: '부산광역시 연제구 전통사찰 현황 정보(사찰명, 대표자, 주소, 전화번호, 신도 수, 전통사찰 등록일  등)를 제공합니다.전통사찰 : 불교 신앙의 대상으로서의 형상(形象)을 봉안(奉安)하고 승려가 수행(修行)하며 신도를 교화하기 위한 시설 및 공간으로서 제4조에 따라 등록된 것문화유산 : 전통사찰에 속한 불교건축, 불교조각, 불교회화, 불교공예, 경전, 그 밖의 문서 등의 유형문화유산과 불교의례, 불교예능, 세시풍속, 전통문화행사 등 무형문화유산관련법: 전통사찰의 보존 및 지원에 관한 법률(목적: 민족문화의 유산으로서 역사적 의의를 가진 전통사찰과 전통사찰에 속하는 문화유산을 보존ㆍ지원함으로써 전통문화의 계승 및 민족문화 향상에 이바지함)'
