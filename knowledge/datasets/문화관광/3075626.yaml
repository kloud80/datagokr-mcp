description_portal: 국내에서 운영 중인 뉴스통신사의 등록 현황을 종합적으로 제공하는 데이터입니다. 제호, 상호명, 대표자, 편집인, 소재지, 연락처, 등록일 등 주요 정보를 포함하여 각 통신사의 기본 현황을 한눈에 확인할 수 있도록 구성되어 있습니다. 이 자료는 언론 및 미디어 산업 연구, 뉴스통신사 현황 분석, 정책 수립, 언론 관련 기관의 업무 지원, 미디어 시장 동향 파악 등 다양한 분야에서 활용이 가능합니다. 특히 언론 관련 종사자, 연구자, 정책 담당자에게 유용한 자료로, 언론사 간 비교 분석, 지역별·유형별 분포 조사, 미디어 정책 개선 방안 마련 등에도 기초 자료로 쓰일 수 있습니다.(2022.5.24.일 기준 32개)
