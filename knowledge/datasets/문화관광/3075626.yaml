summary_user: 전국에 등록된 뉴스통신사를 한 곳당 한 행으로 담은 등록 현황 파일로, 제호·상호명·대표·편집인·소재지·연락처·등록일을 담는다(포털 설명 기준 2022년 5월 24일 현재 32개사). 언론 연구자나 정책 담당자가 국내에 어떤 뉴스통신사가 언제 등록됐고 어디에 있는지 확인하거나 지역별 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 언론사 등록 자료와는 제호나 상호명 같은 이름 매칭으로만 이어 쓴다.
limits: 사업자번호 같은 공통 식별 코드가 없어 다른 데이터와 정확히 연결하기 어렵고 이름 매칭에 의존해야 한다. 체육 부문으로 분류돼 있으나 내용은 언론 등록 자료여서 문화체육관광일반으로 이동이 제안된 상태다.
