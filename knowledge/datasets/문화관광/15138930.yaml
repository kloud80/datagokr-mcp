summary_user: 전국 문화예술 공간(공연장·미술관·박물관·도서관 등) 시설 단위의 명칭·구분·전화·홈페이지·좌표를 조회하는 API로, 전체 3,352건을 담는다. 지역에 어떤 문화시설이 몇 곳 있는지, 내 주변에 어떤 시설이 있는지 알고 싶은 국민·사업자·분석가가 상권·지역 문화 분포를 볼 때 쓴다. 전역 조인 키는 없어 좌표(gpsX, gpsY)나 시설명 매핑, 같은 기관의 시설코드(총람)로 다른 문화 데이터와 잇고, 필수 파라미터 seq는 다른 데이터에서 받은 코드를 넘겨야 한다.
description_portal: 이 데이터셋은 공연장, 미술관, 박물관, 도서관 등 다양한 문화예술 공간의 정보를 한눈에 조회할 수 있는 공공데이터 OpenAPI 서비스입니다. 각 시설의 명칭, 분류, 그룹, 연락처, 홈페이지, 주소, 개관일, 운영정보, 상세설명, 대표 이미지, 위치 좌표, 우편번호 등 주요 정보를 제공합니다. 그뿐만 아니라 사용자는 전국의 문화시설 현황을 손쉽게 파악할 수 있으며, 문화 관련 서비스 개발, 위치 기반 추천, 문화관광 안내, 정책 수립 등 다양한 분야에 활용할 수 있습니다. 데이터는 정기적으로 갱신되어 최신 정보를 제공합니다.
