status: active
summary_user: 전라남도 테마파크를 한 곳씩 담은 건별 목록으로, 명칭·주소·좌표·전화·홈페이지·주차장 유무와 주차요금·이용요금 여부·간략개요·이미지 파일을 제공한다. 여행객이나 여행 앱 개발자가 "전남에서 주차가 되는 테마파크는 어디이고 위치는 어떻게 되나" 같은 질문에 쓴다. 전역 조인 키는 없어서 다른 관광 데이터와는 테마파크 명칭·주소 매칭이나 좌표(경도·위도)로 잇고, 기관 자체 지역코드(themeParkZoneCd)는 같은 기관의 남도여행길잡이 데이터끼리 묶을 때만 쓴다.
limits: 필수 파라미터인 시작 페이지와 테마파크 명칭은 다른 호출에서 먼저 받아 넘겨야 하므로, 목록을 먼저 조회한 뒤 상세를 요청해야 한다. TourAPI의 contentId 같은 공통 키가 없어 전국 관광 원장과 바로 조인되지 않는다. 개발계정은 하루 1,000회로 호출이 제한된다.
