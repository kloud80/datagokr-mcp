description_portal: '- 입력 파라미터를 이용하여 전라남도 테마파크 정보를 조회할 수 있는 서비스로 테마파크  목록, 테마파크 장소, 테마파크 개요 등의 항목을 제공합니다.- 전라남도(전남)는 자연경관, 역사, 문화, 미식 등 다양한 매력을 지닌 여행지로, 여름철에도 시원하고 다채로운 여행을 즐길 수 있습니다.- 교통: 전남 지역은 대중교통이 제한적일 수 있으므로, 렌터카를 이용하시는 것을 추천합니다.- 숙박 예약: 여름철에는 관광객이 많아 숙박 시설이 빠르게 마감될 수 있으므로, 미리 예약하시는 것이 좋습니다.- 체험 예약: 일부 체험 프로그램은 사전 예약이 필요할 수 있으므로, 방문 전에 확인하시기 바랍니다.- 전남은 자연과 문화, 미식을 동시에 즐길 수 있는 매력적인 여행지입니다.'
