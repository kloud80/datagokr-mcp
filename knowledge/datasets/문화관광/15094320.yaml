summary_user: 서울 서초구의 청소년게임제공업(인형뽑기·오락실 등 전체이용가 게임물 제공 업소) 인허가 정보를 업소 한 곳당 한 행으로 담으며, 관리번호·인허가일·영업상태(영업/폐업 등)·소재지 주소·중부원점TM 좌표·시설 면적과 층수 같은 시설 항목을 포함한다. 서초구에서 오락실·인형뽑기방 창업을 검토하는 예비 사업자가 현재 영업 중인 업소가 어디에 얼마나 몰려 있는지 확인하거나, 학부모가 집 근처 청소년 이용 가능 게임장 위치를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 서초구의 인형뽑기, 오락실 등 전체이용가 게임물을 설치하여 제공하는 업소 정보입니다. 각 등록 업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 여가시설 관련 문화공간 창업을 희망하는 예비 사업자에게는 서초구 지역의 시장 분석 및 미성년자 관련 영업신고 업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 학부모 및 시민들에게는 연령제한 및 운영수칙을 준수하며 미성년자에게 건전오락 여가시설을 제공하는 문화공간의 위치를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다'
