summary_user: 제주특별자치도 가문동해안길의 무장애 여행 정보를 구분·유형·추천여부·비고 항목으로 정리한 파일이며, 포털이 아니라 외부 사이트(jejudatahub.net)에서 내려받는다. 휠체어 이용자, 고령자, 유아 동반 여행객이 가문동해안길의 화장실·주차장 같은 편의시설과 코스를 실제로 이용할 수 있는지 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, TourAPI 관광지 정보나 제주특별자치도의 다른 무장애여행 파일과는 장소 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: '제주특별자치도 내 가문동해안길_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도에서 제공하는 “검은여로 무장애여행관광정보”로, 검은여 혹은 검은여해안을 중심으로 이동 약자(장애인, 고령자, 유아 동반자 등)의 관광 접근성 및 편의시설 현황을 안내하기 위해 작성된 정보이다. 주요 구성 항목으로는 관광지 개요, 주소, 주차장 및 화장실 등의 편의시설 상태, 경로(코스) 안내, 휴무일 및 관람료 등의 기본 정보가 포함되어 있으며, 화장실·주차장 등 주요 포인트별 사진 이미지가 제공되어 실제 이용 가능성 및 시설 상태를 시각적으로 확인할 수 있도록 되어 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
