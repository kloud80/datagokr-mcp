description_portal: '제주특별자치도 내 국민 여행 조사_연령대별 제주 여행 횟수 데이터를 제공합니다.항목: 연도, 시도, 연령대, 여행횟수(천회) 등* 국민 여행 조사에서 제주의 방문 횟수를 연령대별로 조사한 통계자료입니다. 연령대(예: 10대, 20대, 30대, 40대, 50대, 60대 이상 등)에 따라 제주를 여행한 횟수가 얼마나 되는지 평균 또는 비율 형태로 정리돼 있어요. 이를 통해 어떤 연령층이 제주 여행을 더 선호하는지, 여행 빈도에 연령대 간 차이가 있는지, 그리고 2018년에서 2019년으로 이동하면서 연령대별 여행 횟수가 어떻게 변화했는지를 파악할 수 있습니다.* 활용 분야 : 연령대별 맞춤 관광상품 및 체험 프로그램 개발, 관광 마케팅 및 홍보 전략 설정, 관광 인프라 및 서비스 수요 예측 등- 데이터 제공처; 한국관광 데이터랩'
