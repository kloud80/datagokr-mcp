description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 낙천의자공원은 제주 제주시 한경면 낙수로 97에 위치한 공원으로, 마을 주민들이 직접 제작한 천 개의 의자가 설치된 공간과 올레길 13코스를 잇는 잣길 및 마을 숲길, 엘리베이터가 설치된 전망대 등을 갖추어 누구나 휴식과 경관 감상을 즐길 수 있도록 조성되었으며 일부 구간은 무단차 출입로와 보행 편의시설이 마련되어 있어 휠체어 사용자, 유모차 동반자, 고령자 등 보행 약자도 비교적 편하게 이용 가능한 열린관광지로 무장애 여행 정보에 포함되어 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
