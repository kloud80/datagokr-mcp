summary_user: 서울 마포구에서 인허가를 받은 PC방 등 인터넷컴퓨터게임시설제공업 업소를 사업장 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·좌표·시설면적·층수·주변환경 등을 포함한다. 주민이나 창업 예정자가 "마포구에서 지금 영업 중인 정식 등록 PC방은 어디이고 최근 폐업한 곳은 어디인가"를 확인하거나, 분석가가 동네별 PC방 개업·폐업 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 기관 내부 코드나 사업장명·주소·좌표 매칭으로만 이어 쓴다.
description_portal: 서울특별시 마포구에서 인허가를 받은 PC방과 같이 컴퓨터 등 게임물을 이용하는데 필요한 기자재를 갖추거나 그 밖의 정보제공물을 이용할 수 있도록 제공하는 업소정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 소재지우편번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명, 문화사업자구분명, 주변환경명, 건물용도명 등의 세부 정보가 포함되어 있습니다. 이 데이터를 통해 시민은 합법적으로 등록된 PC방을 확인하고, 감독기관은 지역 내 게임이용시설을 효율적으로 관리할 수 있습니다.
