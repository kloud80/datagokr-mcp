summary_user: 부산광역시 기장군에 등록된 출판사와 인쇄사를 업체 한 곳씩 담은 현황 파일로, 업종·사업체 명칭·도로명 소재지·행정동을 담는다(약 11KB 규모의 CSV). 기장군 안에서 출판·인쇄 업체를 찾는 사업자나 지역 출판·인쇄업 분포를 행정동별로 보려는 분석가가 "우리 동네에 어떤 인쇄소가 있나" 같은 질문에 쓴다. 전역 조인 키는 없으며, 도로명 주소나 행정동 이름을 매핑해 다른 기장군·부산시 자료와 연결해야 한다.
description_portal: 부산광역시 기장군청에서 관리하는 자료로, 기장군 내에 등록된 출판사 및 인쇄사의 업체명, 주소, 업종 등의 정보를 제공하는 자료입니다. 부산광역시 기장군 문화관광과에서 관리하고 있는 부산광역시 기장군 출판사 및 인쇄사 현황 관련 데이터로 업종, 사업체 명칭, 사업체 소재지(행정동) 등의 정보를 포함하고 있습니다.* 데이터 활용시 참고사항1. 이 데이터는 부산광역시 기장군 문화관광과에서 연간 현행화되고 있으며, 수시로 변경될 수 있습니다.2. 현재 데이터 기준일자는 2025년 9월입니다.
