summary_user: 전국의 카페를 함께 운영하는 서점(북카페)을 한 곳씩 담은 목록으로, 상호명·등록일·분류·안내문·주소·전화번호·좌표를 담는다. 주말에 들를 만한 우리 동네 북카페가 어디 있는지 찾는 이용자나, 지역별 북카페 분포를 보며 문화 인프라·창업 입지를 검토하는 분석가가 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·좌표(COORDINATES)나 상호명 매칭으로 이어 붙여야 한다.
description_portal: 전국의 카페가 함께 운영되는 서점에 대한 위치 정보와 운영 현황, 시설 구분, 운영시간, 휴무일, 주차 가능 여부, 화장실 남녀 구분, 대여 서비스, 독립출판물 취급 여부, 네이버 리뷰 제공 여부 등 다양한 정보를 종합적으로 제공합니다. 해당 데이터는 서점 방문을 계획하는 이용자에게 편리한 정보 탐색을 지원하며, 문화 공간으로서의 북카페 현황 파악, 지역별 문화 인프라 분석, 창업 및 마케팅 전략 수립 등에도 활용할 수 있습니다. 주요 컬럼으로는 상호명, 등록일, 분류, 안내, 주소, 전화번호, 시설물 좌표 등이 포함되어 있습니다.
