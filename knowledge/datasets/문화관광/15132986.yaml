description_portal: 대구광역시 남구에서 지역 문화 활성화를 위하여 다양한 공연 및 전시, 문화예술 특강 등을 개최하고 있으며 이에 대한 전체 행사 현황에 대한 정보를 등록합니다.본 데이터에는 전시명, 공연명, 행사명, 공연코드, 공연유형, 공연장소, 공연제목, 공연시작일자, 공연종료일자, 공연시작시간, 공연종료시간 입장료, 입장권 구입사이트, 홈페이지 주소, 공연 주최주관, 관련 전화번호, 주차정보, 행사 세부 내용 등을 제공하여 지역민이 보다 쉽게 문화를 향유 할 수 있도록 합니다.또한 공공기관의 데이터를 현행화하여 데이터의 정확도를 높이고 데이터 베이스로 구축하여 아카이브 자료로써 관리하고자 합니다. 대구광역시 남구의 대덕문화전당 드림홀 및 대덕문화전당 전시실에서 열리는 주요 행사 및 남구 지역 내 야외 행사장, 관내 학교 등 찾아가는 공연 등 다양한 행사 정보를 포괄하고 있습니다.
