summary_user: 대구광역시 남구가 대덕문화전당 드림홀·전시실, 야외 행사장, 관내 학교 찾아가는 공연 등에서 연 공연·전시·문화예술 행사를 한 행사당 한 행으로 담은 파일(CSV, 약 82KB)로, 행사명·장소·기간·시각·요금·주최/주관기관·객석수·주소와 위도·경도가 들어 있다. 남구 주민이나 지역 문화 분석가가 '남구에서 언제 어떤 무료·유료 공연이 어디서 열렸고 주차가 되는가'를 확인하거나 구 단위 문화행사 이력을 정리하는 데 쓴다. 전역 조인 키(KOPIS 공연ID 등)는 없어 다른 공연 데이터와는 행사명·장소명 매칭이나 주소·좌표 기반 위치 결합으로만 잇는다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 KOPIS 예매·매출 데이터와 직접 연결되지 않으며, 대구 남구 한 시군구의 구 주관 행사만 다룬다. 명세상 연간·이벤트성으로 생성되는 파일이라 실시간 공연 일정 조회용으로는 맞지 않는다.
