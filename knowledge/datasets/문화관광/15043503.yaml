summary_user: 제주 카멜리아힐 한 곳의 무장애여행 지점 정보를 지점별 위도·경도·해발고도와 아이디로 담은 파일이며, 포털 설명상 장소설명과 이미지 정보도 함께 제공한다. 휠체어 이용자나 교통약자 동반 여행자가 카멜리아힐 안에서 이동 가능한 동선과 편의시설 위치를 미리 확인하는 데 쓰고, 관광 인프라 개선을 검토하는 분석가도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소 이름이나 좌표로 직접 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 카멜리아힐 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 카멜리아힐은 사계절 다양한 동백 수종을 중심으로 조성된 식물·정원 관광지로, 교통약자의 이동 편의를 고려한 무장애 관광 환경을 제공한다. 본 데이터는 시설 전반의 접근성 정보를 포함하며, 주차장과 진입로의 구조, 차량 및 휠체어 이용 가능 구역, 주요 동선의 경사도 및 노면 상태 등을 상세히 제시한다. 또한 관람 구역별 편의시설 위치, 장애인 화장실 및 이용 가능한 보조기기 현황 등 방문자를 위한 실질적 이용 정보를 제공하여 무장애 관광환경 조성 및 정보 접근성을 높이는 데 활용된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
