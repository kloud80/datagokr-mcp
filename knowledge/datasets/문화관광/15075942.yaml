description_portal: '강원특별자치도 강릉시의 주요 문화시설 정보를 시설별로 정리한 데이터로, 각 시설의 위치, 개관일, 연락처, 홈페이지 등을 한 번에 확인할 수 있도록 구성된 자료입니다. 공연·전시·독서·문화교육 공간 현황을 파악하고 이용 안내 서비스에 활용할 수 있습니다.시도: 시설이 위치한 시·도 명칭시군구: 시설이 속한 시·군·구 행정구역 명칭시설명: 문화시설의 공식 명칭(공연장, 도서관, 박물관, 문화원 등)개관연월일: 시설이 정식으로 문을 연 날짜(YYYY-MM-DD 형식)도로명주소: 시설이 위치한 도로명 주소로, 내방·네비게이션 검색 시 활용위도: 시설 위치의 위도 좌표 값(지도 서비스, GIS 분석용)경도: 시설 위치의 경도 좌표 값(위도와 함께 공간 분석·지도 표출에 활용)전화번호: 시설 안내, 예약, 대관 문의 등을 위한 대표 전화번호홈페이지: 프로그램 안내, 일정, 예약 정보를 제공하는 웹사이트 주소기준일자: 문화시설 정보가 최종으로 확인·갱신된 기준 날짜(YYYY-MM-DD 형식)이 데이터는 지역 문화시설 분포 분석, 생활권별 문화 인프라 격차 파악, 문화예술 정책 수립, 문화달력·지도 서비스 구축, 관광·교육·복지 프로그램 연계 등에서 기초 자료로 활용할 수 있는 문화 인프라 현황 데이터입니다.출처: 문화예술과'
