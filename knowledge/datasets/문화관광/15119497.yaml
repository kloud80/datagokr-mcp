summary_user: 대전광역시 중구 관내 공연장을 한 곳씩 담은 파일로, 공연장 이름·도로명 소재지·전화번호·수용 가능 객석수를 기록하며 범위는 중구 한 개 시군구입니다. 주민이나 공연 기획자가 '중구에서 객석 몇 석 이상인 공연장이 어디 있고 연락처는 무엇인가'를 찾을 때 쓴다. 실측 컬럼에 공연장ID 같은 전역 조인 키가 없어 KOPIS 공연장 목록 등 다른 데이터와는 공연장명칭이나 도로명 주소를 맞춰서만 이어 쓴다.
description_portal: 해당 공공데이터는 대전광역시 중구 관내  공연장 ( 공연장명칭, 공연장소재지, 전화번호, 객석수) 현황정보를 제공합니다.본 공공데이터는 데이터 업데이트 주기가 연간 1회로, 데이터 기준일을 확인하여 주시기 바랍니다.(데이터 컬럼 상세정보 안내)데이터 컬럼 중 공연장소재지는 도로명주소를 기준으로 작성되어 있습니다.데이터 컬럼 중 전화번호는 사업장에서 공개한 유선 또는 안심번호로 작성되어 있습니다.데이터 컬럼 중 객석수는 해당 공연장 수용가능 객석 수를 숫자로 작성되어 있습니다.본 데이터와 관련하여 문의사항이 있으신 경우 담당 전화번호로 연락주시기 바랍니다.
