summary_user: 인천광역시 관내 지정(법정) 관광지(마니산관광지·서포리관광지)별로 조성면적(제곱킬로미터)과 연도별 방문객 수(전체·내국인·외국인)를 2016~2019년 기준으로 집계한 소형 통계 파일(csv 415바이트)이다. 지역 관광 분석가나 정책 담당자가 '강화 마니산과 옹진 서포리 관광지의 방문객이 연도별로 어떻게 변했고 외국인 비중은 얼마인가'를 확인하는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어서, 다른 관광지점 입장객 통계와는 관광지 이름을 직접 매핑해야 이어 쓸 수 있다.
description_portal: '인천광역시가 제공하는 지정(법정) 관광지 현황 및 방문객수 공공데이터는 관내 지정 관광지의 조성 면적, 연도별 방문객 수 등을 집계한 통계 자료입니다. 이 데이터는 지역 관광 인프라의 규모와 관광지 운영 성과를 객관적으로 파악하고, 관광객 유치 정책, 시설 관리 계획, 지역 경제 파급 효과 분석 등의 기초 자료로 활용되는 것을 목적으로 합니다.<주요 구성 항목>-시점: 데이터가 집계된 기준 연도를 나타냅니다 (2016년, 2017년, 2018년, 2019년).-관광지별: 현황이 집계된 지정 관광지의 명칭을 구분합니다 (마니산관광, 서포리관광).'
