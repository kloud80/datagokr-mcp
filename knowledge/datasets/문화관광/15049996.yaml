summary_user: 제주관광공사 비짓제주(VISIT JEJU) 플랫폼에서 이용자가 여행일정에 단 댓글을 한 건씩 담은 원천 파일로, 포털 설명 기준 전체 161건이다. 비짓제주 운영자나 분석가가 어떤 여행일정에 댓글·답글이 달렸고 언제 소통이 있었는지 파악할 때 쓴다. 전역 조인 키는 없어, 같은 기관의 비짓제주 여행일정 데이터와 여행일정 식별값(여행일정)으로만 이어 볼 수 있고, 답글 구조는 상위댓글아이디와 깊이로 파일 안에서 재구성한다.
limits: TourAPI contentId나 지역코드 같은 전역 키가 없어 다른 관광 데이터와 직접 결합하기 어렵다. 규모가 161건으로 작아 이용자 만족도나 관광 동향을 일반화하는 근거로 쓰기 어렵다.
