summary_user: 제주특별자치도의 2015~2016년 관광객 유동인구를 기준년월과 300m×300m 격자 단위로 집계해 00시부터 24시까지 1시간 간격의 인원과 비율로 담은 파일 데이터다. 관광 분석가나 사업자가 '제주에서 관광객이 몰리는 지점과 시간대가 언제인가'를 격자 수준에서 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했고 관광지점코드·시군구코드도 없으므로, 격자 ID를 공간 격자 체계와 직접 맞추거나 같은 기관의 다른 데이터와 이름·코드 매핑으로만 연결한다.
limits: 유동인구는 추정 과정에서 비율을 써 소수점 값이며, 이동 개념이라 인구수와 달리 중복 카운트가 생겨 방문객 실인원으로 해석하면 안 된다. 2015~2016년 시점의 자료로 최근 추세 파악에는 쓰지 못한다. 전역 조인 키가 없어 시군구·관광지점 단위 통계와 바로 붙지 않는다.
