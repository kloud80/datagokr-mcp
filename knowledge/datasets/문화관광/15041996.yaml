summary_user: 전라남도 22개 시군의 관광지를 한 곳당 한 행으로 담은 목록 파일로, 구분·지역·관광지명·주소·문의전화·주차시설·홈페이지를 담는다(csv 약 115KB). 여행객이나 여행 콘텐츠 사업자가 '특정 시군에 주차가 가능한 관광지가 어디이고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지명·주소 문자열이나 시군 이름을 맞춰서만 연결한다.
description_portal: '- 전라남도 22개 시군의 주요 지역별 관광정보(남도여행 길잡이 홈페이지)에 대한 데이터를 조회하실 수 있습니다.(지역, 관광지명, 문의처, 주차가능 여부, 홈페이지 링크 등)- 전라남도는 풍부한 자연경관과 역사적 유산을 자랑하는 지역으로, 각 시군마다 독특한 매력을 지닌 관광지가 많습니다.- 전라남도의 다양한 지역별 관광 정보를 활용하여, 계절별로 아름다운 자연과 문화를 만끽하시기 바랍니다.- 미식관광 : 여수 돌문어숙회, 갓김치, 서대회, 목포 세발낙지, 홍어삼합, 순천 꼬막정식, 보성 녹차요리 등- 체험힐링관광 : 섬여행(신안 천사대교를 통해 암태도, 자은도, 팔금도 등 연결), 슬로시티 탐방(청산도, 고흥 도화면 등), 자전거여행코스(강진만 생태공원 등), 온천체험(해남 해창온천, 화순온천 등)'
