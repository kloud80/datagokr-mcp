summary_user: 부산광역시 동구에 등록된 호텔업 업체를 한 줄에 한 곳씩 담은 목록으로, 업종 분류·등급·호텔명·소재지·전화번호를 담는다(파일 크기 822바이트의 소규모 CSV). 동구를 찾는 관광객이 관내 호텔의 등급과 위치·연락처를 비교하거나, 분석가가 동구 숙박시설 분포를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 호텔명·소재지 주소를 이름 매칭하거나 같은 기관 자료끼리 연결하는 방식으로만 이어 쓰며, 숙박업 인허가 공통 원천(LOCALDATA)과 대조할 때도 이름·주소 기준이다.
