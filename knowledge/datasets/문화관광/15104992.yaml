summary_user: 문화체육관광부 공감코리아의 정책·문화 정보 자료를 한 건씩 담은 목록으로, 자료마다 제목, 작성 주체, 등록일, 주제 분류, 핵심 주제어, 관련 장소, 시간 범위, 언어, 저작권, 원문 링크(url)를 기록하며 범위는 전국이다. 정책 연구자나 콘텐츠 기획자가 "체육·문화 분야에서 문체부가 최근 어떤 정책 자료를 냈나"를 주제어나 등록일로 찾아볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주제어·장소 같은 이름 매핑이나 같은 기관 자료끼리만 연결한다.
description_portal: 공감코리아 정책정보문화 데이터는 문화체육관광부가 제공하는 다양한 정책 및 문화 관련 정보를 체계적으로 수록하고 있습니다. 자원의 명칭, 책임 주체, 등록일, 기관별 주제 분류, 핵심 주제어, 관련 장소, 시간적 범위, 언어, 저작권 등 주요 항목을 포함하여 정책 자료의 상세한 내용을 확인할 수 있습니다. 정책 입안, 연구, 문화 콘텐츠 개발, 교육 등 다양한 분야에서 활용이 가능하며, 정책 정보의 접근성과 투명성을 높이는 데 기여합니다. 또한, 정책 자료의 신뢰성과 최신성을 보장하여 공공 및 민간 부문의 정보 활용도를 증진합니다.
