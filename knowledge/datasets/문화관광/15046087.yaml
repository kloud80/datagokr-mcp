summary_user: 제주도 방문 관광객의 카드 매출을 국적·상품유형·체류기간·방문빈도·방문도시별로 묶어 소비금액 상위 3개 업종과 인당 소비금액(만원)을 정리한 집계 자료로, 2014년 9월~2016년 8월 BC카드(내국인)·유니온페이(중국인) 결제를 분석한 2016년 보고서에서 나왔다. 관광정책 담당자나 분석가가 개별관광객과 단체관광객, 내국인과 중국인 사이에 어떤 업종에 얼마를 쓰는지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관광 통계와는 국적·방문도시 같은 이름을 맞춰서만 이어 쓴다.
