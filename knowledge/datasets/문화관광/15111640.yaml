summary_user: 중국 단체관광객 유치 전담여행사로 지정된 업체를 한 줄에 한 곳씩 담은 명단으로, 업체명과 대표자(한글·중문), 전화·팩스, 주소, 등록번호, 지정일이 들어 있다. 여행사나 관광객, 관련 기관이 어떤 여행사가 공식 전담여행사로 지정됐는지, 언제 지정됐는지를 확인해 비공식 여행사와 구별할 때 쓴다. 전역 조인 키가 없어 다른 관광사업 등록 데이터와는 업체명이나 등록번호를 직접 맞춰 이어야 하고, 주소로 지역별 분포를 볼 수 있다.
description_portal: 해당 데이터는 중국 단체 관광객 유치 전담 여행사 정보를 포함하고 있습니다. 해당 데이터는 여행사 정보, 업체명(중문 포함), 대표자, 대표자(중문), 전화전호, 팩스번호, 주소, 등록번호, 지정일을 포함하고 있습니다. 한류 확산으로 인한 중국 단체 관광객 유치를 위한 전담 여행사 정보로 데이터를 이용하시는 분은 해당 업체 정보를 활용하여 비공식 여행사 등 만일 발생할 수 있는 문제를 사전에 예방하고 업체와 대표자, 등록번호 등을 확인하여 보다 정확한 데이터를 활용할 수 있는 목적으로 이용하여 중국 단체 관광객 전문 여행사의 신뢰를 향상할 수 있습니다.
