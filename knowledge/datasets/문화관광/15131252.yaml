description_portal: 건강한 생활 습관에 대한 시민 관심 증가와 공공체육시설의 다양한 강습 프로그램에 대한 수요가 확대되는 가운데, 충청남도 보령시는 관내 공공체육시설에서 운영하는 강습 현황 데이터를 제공합니다. 본 데이터는 강습유형, 분류, 강좌명, 강습시작시각, 강습종료시각, 강습료, 강사명, 강습대상자, 강습시작일, 강습종료일, 강습요일 항목으로 구성되어 있으며, 공공체육시설에서 운영 중인 강습 프로그램의 세부 현황을 체계적으로 파악할 수 있도록 정리되어 있습니다. 지자체 및 체육시설 운영 기관은 본 데이터를 통해 강습 유형별·대상자별 운영 현황을 분석하고, 수요 대비 강습 프로그램 공급 현황 파악 및 신규 강좌 개설 계획 수립에 활용할 수 있습니다. 또한 체육·복지 연구기관에서는 강습료 및 운영 일정 데이터를 바탕으로 공공체육 서비스 접근성 분석 및 프로그램 다양화 방안 연구에 기여할 수 있으며, 시민들은 강습 일정 및 강좌 정보를 통해 체육 프로그램 참여 계획 수립에 본 데이터를 활용할 수 있습니다. 현재 접수 중인 강습은 보령시공공체육시설누리집(https://www.brcn.go.kr/sport/fmcs/1)에서 확인하실 수 있습니다.
