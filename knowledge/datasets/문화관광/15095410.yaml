summary_user: 울산광역시 울주군에 있는 시 지정 문화유산을 유산 한 건당 한 행으로 담은 파일로, 이름·종목·시대·수량·지정일·관리단체·소재지·내용 설명을 포함한다. 지역 주민이나 연구자·관광 기획자가 '울주군에 있는 시 지정 기념물·민속문화재는 무엇이고 언제 지정됐으며 누가 관리하나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키(종목코드·지정번호·PNU 등)가 없어, 국가유산청 유산 목록 등과는 유산 이름이나 소재지 문자열을 맞춰서만 이어 쓸 수 있다.
description_portal: 본 데이터는 울주군 지역에 소재한 시 지정 문화유산의 상세 정보이다. 문화재이름, 종목, 시대, 수량, 지정일, 관리단체,소재지, 내용 등의 세부 정보를 포함한다. 유형문화재, 무형문화재, 기념물, 민속문화재 등 다양한 종류의 문화유산이 포함되어 있으며, 각 문화재의 역사적 가치와 특징이 기술되어 있다. 본 정보는 문화재 보존 관리, 문화유산 보호 정책 수립, 관광 자원 개발, 지역 역사 교육 등에 활용되며, 지역 문화 정체성 확립을 위한 기초 자료로 제공된다. 시 지정 문화유산 정보를 통해 체계적인 문화재 관리와 보존 활동을 지원하고, 지역의 역사와 문화를 계승 발전시키며, 문화 관광 활성화에 기여한다.(2)
