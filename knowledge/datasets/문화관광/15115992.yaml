description_portal: '서울특별시 중구의 영화를 수입하는 업소 정보를 제공합니다. 데이터는 각 신고업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 영상산업 및 문화교류 분야의 영화수입업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 신고업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 법적 절차를 거쳐 등급분류를 준수하며 배급권 저작권 문제를 해소한 신뢰할 수 있는 외국영화 수입업체를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
