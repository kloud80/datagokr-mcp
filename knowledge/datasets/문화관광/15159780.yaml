summary_user: (주)강원랜드 카지노의 영업일자별·게임명별 이용자 수를 담은 집계 데이터로, 한 행은 하루 동안 한 게임을 이용한 고객 수(UTZTN_CUST_CNT)입니다. 관광·카지노 산업 분석가가 "연휴나 성수기에 어떤 게임 이용자가 늘었는가" 같은 질문에 답하려고 게임별 일자 추이를 비교할 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업일자를 기준으로 달력·공휴일 정보나 같은 기관의 입장객 통계와 날짜 단위로 맞춰 이어 씁니다.
description_portal: "'(주)강원랜드_게임종류별이용고객현황'은 (주)강원랜드 카지노를 방문한 내국인과 외국인의 일자별 게임 종류별  입장 인원을 제공하는 데이터입니다. 이 데이터는 관광산업 동향 분석, 국내외 관광객 유입 패턴 파악, 계절·공휴일·연휴  및 게임 종류별  이용 추이 분석 등에 활용할 수 있습니다. 또한 팬데믹, 사회적 거리두기, 기후 변화 등 외부 요인이 입장객 수에 미친 영향 분석에도 유용하며, 관광정책 수립, 지역경제 활성화 전략 마련, 카지노 산업 연구, 게임별 마케팅 전략 수립, 게임 학술 연구 등 다양한 분야에서 활용 가능한 가치 있는 데이터입니다."
