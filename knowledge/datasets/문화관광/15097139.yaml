summary_user: 제주 월대천(외도물길 20리) 구간의 무장애 여행 코스를 지점별로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부를 담는다. 휠체어 이용자나 교통약자, 동반 가족이 월대천을 산책할 때 어느 동선과 지점이 접근 가능한지 확인하는 데 쓰고, 관광 정책 담당자가 열린관광지 조성을 검토할 때도 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도나 지점 이름으로 맞춰 이어 쓰고, TourAPI 관광지 정보(contentId)와도 이름 매핑으로만 연결된다.
description_portal: '"제주특별자치도 내 제주특별자치도_월대천(외도물길20리)_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 월대천(외도물길 20리) 구간을 중심으로 구성된 무장애 여행 코스 정보를 제공한다. 해당 구역의 접근 가능한 산책로, 이동 동선, 휴식 및 전망 공간, 편의시설 현황 등을 포함하여 교통약자와 휠체어 이용자의 안전한 이동을 지원하기 위해 수집된 자료이다. 노면 상태, 경사도, 보행환경, 주차시설 및 화장실 접근성 등 현장 정보가 반영되어 있으며, 자연하천 경관 보전과 더불어 무장애 관광환경 구축, 열린관광지 조성, 공공정책 수립 등 다양한 활용을 위한 기반 자료로 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
