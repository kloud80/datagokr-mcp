summary_user: 부산광역시 수영구 관내 국가유산을 한 건씩 담은 목록 파일(CSV, 약 4KB)로, 유산명·소재지·관리주체·지정번호와 지정일자·시대·종별·건립 정보·주요내용·면적·담당자 전화번호와 위도·경도를 수록한다. 수영구에 어떤 지정 유산이 어디에 있고 누가 관리하는지 알고 싶은 주민·관광객·교육 담당자나, 구 단위 유산 분포를 지도에 올리려는 분석가가 쓴다. 전역 조인 키는 없어서 국가유산청 자료와는 유산명·지정번호를 이름이나 코드로 직접 맞춰 이어야 하고, 다른 공간 데이터와는 위도·경도나 소재지 주소로 연결한다.
description_portal: '부산광역시 수영구 관내 국가유산현황 데이터를 제공합니다. 보존하고 관리하는 유산들에 대한 포괄적인 정보를 제공하여, 연구, 교육, 관광 등 다양한 목적으로 활용될 수 있도록 구성되어 있습니다. 파일 내에는 국가유산의 이름, 국가유산이 위치한 소재지, 국가유산을 관리하는 관리 주체, 공식 지정번호와 지정일자, 국가유산이 속한 시대, 국가유산의 종별 (예: 유형문화유산, 보물), 건립 주체와 건립 연도 정보가 포함되어 있습니다. 또한, 국가유산의 주요 내용 설명, 관련 홈페이지 주소, 면적 정보, 그리고 문의를 위한 담당자 전화번호 등 세부적인 항목들이 수록되어 있습니다. 이 데이터는 국가유산의 체계적인 이해와 접근성을 높이는 데 유용합니다.'
