description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 제주올레 10코스 휠체어길은 제주 서귀포시 화순금모래해변에서 하모체육공원에 이르는 전체 17.3 km 구간 가운데, 특히 사계포구~송악산주차장까지 약 3 ~ 3.2 km에 걸쳐 평탄한 포장 또는 판석길 보행로가 마련되어 휠체어 사용자와 보행 약자도 해안 절경과 바다 풍경을 안정적으로 즐길 수 있도록 설계된 열린관광 코스로, 공용주차장 및 장애인 주차면, 무단차 출입구, 장애인 화장실 등 편의시설 정보가 포함된 무장애 관광 데이터로 관광 안내, 접근성 여행 설계 및 콘텐츠 제작 등에 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
