description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 여행일정 사진 내역입니다.- 해당 데이터는 사용자가 여행일정에 사진을 등록할 때 데이터베이스에 저장하여 생성합니다.- 개방데이터 항목은 일련번호, 사진아이디, 여행일정아이디, 노출순서이며 전체 데이터 수는 6건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 여행일정별 사진 현황을 파악하여, 여행 경험 공유 및 체험 정보 제공, 일정별 시각적 콘텐츠 품질 향상, 이용자 참여 활성화, 맞춤형 추천 및 마케팅 자료 활용, 신규 여행일정 기획 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
