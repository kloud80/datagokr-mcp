summary_user: 무안군의 초의선사탄생지·무안황토갯벌랜드·오승우미술관 등 관광지를 한 행에 한 곳씩 담은 목록 파일로, 주소·위경도·대표전화·키워드·요약 설명·주차장 유무·신용카드 결제 여부·영업 시작/종료 시간이 들어 있으며 파일 크기는 약 3KB(CSV)로 작다. 무안군을 찾는 여행객이나 지역 여행 안내 서비스 운영자가 '주차가 되고 카드 결제가 가능한 무안 관광지는 어디이고 몇 시까지 여는가'를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지명·주소 매칭이나 위경도 기반 공간 결합으로 이어 쓴다.
limits: TourAPI의 콘텐츠ID나 지역코드 같은 공통 키가 없어 다른 관광 데이터와 자동으로 연결되지 않고, 이름·주소 매핑이 필요하다. 범위는 무안군 한 곳에 한정되며 관광지 개별 목록일 뿐 방문객 수 같은 통계는 담지 않는다.
