description_portal: '서울특별시 서초구 내에서 테마파크 등 안전성 검사대상 놀이기구를 한 종류 이상 설치하여 운영하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 놀이기구는 이용자들의 안전과 직결되므로 정기적인 안전성 검사와 업소 운영 현황의 철저한 관리는 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 놀이시설 업소의 인허가 이력, 개장 및 폐장, 운영 상태 변화 등 행정 현황을 상세히 확인할 수 있는 핵심 항목이 포함되어 있습니다. 서초구청 등 관할 행정기관이 수시로 현장 점검 및 정보갱신을 실시하여 데이터의 신뢰성과 최신성을 꾸준히 유지하고 있습니다. 본 데이터는 놀이기구 안전관리, 업소 인허가 및 운영 모니터링, 정책 수립, 사고 예방 대책 마련, 시장 동향 분석, 소비자 정보 제공 등 다양한 분야에서 활용이 가능합니다. 시민, 업계, 연구자 및 관계 행정기관 모두에게 투명하고 실효성 높은 정보를 제공하며, 데이터는 지속적으로 최신화됩니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
