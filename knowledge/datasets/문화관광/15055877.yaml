summary_user: 인천광역시가 지정한 무형유산을 종목별·보유자별로 정리한 소규모 파일 데이터로, 지정 구분, 무형유산명, 보유자와 성별, 기능, 지정연도를 담는다(csv 약 1.6KB). 시민이나 연구자가 '인천에서 지정된 무형유산은 무엇이고 누가 언제부터 보유자로 전승하고 있나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 무형유산명이나 보유자 이름을 맞춰 연결해야 한다.
description_portal: 인천광역시 무형유산 공공데이터는 지역의 전통문화와 역사적 가치를 보존하고 시민들에게 알리기 위해 제공되는 자료입니다. 이 데이터에는 지정 구분, 무형유산명, 보유자, 성별, 기능, 지정연도  등 주요 정보가 포함되어 있습니다. 이를 통해 시민은 인천에서 이어져 내려오는 전통 예술, 기술, 의례, 놀이 등 다양한 무형유산을 쉽게 확인할 수 있으며, 연구자와 행정기관은 문화 정책 수립과 보존·활용 방안 마련에 활용할 수 있습니다. 공데이터 포털을 통해 누구나 접근할 수 있어 문화유산의 가치 확산과 교육 자료로서의 활용성을 높이고 있습니다.
