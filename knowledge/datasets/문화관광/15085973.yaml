summary_user: '경상남도 하동군에 등록된 관광객이용시설업 업체를 한 곳씩 담은 목록으로, 업종소분류·업체명·대표자명·읍면·소재지·전화번호·최초등록일·시설종류·등록번호·휴업 여부를 담는다(2,869바이트 규모의 작은 CSV 파일). 하동군에서 영업 중인 관광객이용시설(예: 야영장 등)이 어느 읍면에 어떤 종류로 있는지, 휴업한 곳은 어디인지 확인하려는 관광객·사업자·지역 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명·소재지 주소나 읍면 이름으로 맞추거나 같은 하동군 자료끼리 이어 써야 한다.'
limits: 관광지점코드·시군구코드 같은 공통 키가 없어 관광 통계(입장객·방문객)와 바로 결합되지 않고, 이름·주소 매칭에 의존해야 한다. 범위는 하동군 한 곳으로 한정되며 업체별 이용객 수나 매출은 담지 않는다.
