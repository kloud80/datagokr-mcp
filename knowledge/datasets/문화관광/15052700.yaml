description_portal: 한국공예디자인문화진흥원은 창의적인 공예문화, 디자인문화, 전통생활문화의 확산과 진흥을 통하여 한국문화의 정체성을 확립하고 경쟁력을 강화하여 국민의 삶의 질 향상에 기여함을 목적으로 하고 있습니다. 해당데이터는 한국공예디자인문화진흥원이 추진한 공예현황 연구자료 결과물 (개관, 제도 및 정책, 산업, 전시와 행사, 연구, 교육) 링크데이터입니다. 한국공예디자인문화진흥원 대표누리집(www.kcdf.or.kr)> 성과자료> 출판물 메뉴를 통해 표지이미지 등 출판물 상세정보를 확인할 수 있습니다.
