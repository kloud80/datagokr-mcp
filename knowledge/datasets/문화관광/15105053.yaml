summary_user: 국립국악원이 보유한 학술연구용 악보와 무보를 자료 한 건씩 담은 목록으로, 자료명·작성자·주제어·크기·시간적 범위·언어·저작권·썸네일 참조 등 메타데이터를 제공한다. 전통음악 연구자나 국악 교육자가 특정 악곡이나 춤의 악보·무보가 국립국악원에 있는지 확인하고 원문 위치(url)를 찾는 데 쓴다. 실측 컬럼에는 공연ID 같은 전역 조인 키가 없어 다른 공연·문화시설 데이터와는 자료명·작성자 같은 이름 매칭이나 같은 기관 자료로만 연결한다.
description_portal: 국립국악원에서 보유한 학술연구용 악보와 무보 자료에 대한 상세 정보를 제공하는 데이터셋입니다. 자원의 명칭, 작성자, 출판지역, 등록번호, 출판사 등 다양한 메타데이터와 함께, 자원의 크기, 재생시간, 관련 장소, 시간적 범위, 언어, 저작권 정보 등도 포함되어 있습니다. 연구자와 교육자, 문화예술 분야 종사자들이 전통음악 연구, 교육 자료 개발, 디지털 아카이브 구축 등 다양한 목적으로 활용할 수 있습니다. 또한, 썸네일 이미지와 참조 식별정보를 통해 자료의 시각적 확인이 가능하며, 자원 위치 정보와 기여자 정보도 함께 제공되어 자료의 신뢰성과 활용도를 높입니다.
