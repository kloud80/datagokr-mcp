summary_user: 의정부시 공원 안에 있는 시설물을 한 건씩 담은 원천 목록으로, 공원명·시설종류·시설명과 관리상태·수리필요 여부, 도로명·지번 주소와 위경도 좌표를 시설물 단위로 기록한다. 시민이 '우리 동네 공원에 운동기구나 편의시설이 있나'를 찾거나, 담당 부서·분석가가 수리가 필요한 시설이 어느 공원·행정동에 몰려 있는지 파악하는 데 쓴다. 전역 조인 키가 없으므로 공원명·행정동 이름 매칭이나 위경도 좌표를 이용한 공간 결합으로 다른 공원·체육시설 데이터와 이어 쓴다.
description_portal: 공원시설물 정보 공공데이터는 다양한 사회적, 행정적, 산업적 가치를 지닌 데이터로서 아래와 같은 활용성을 가집니다<데이터 활용성>1.도시계획 및 정책 수립:공원시설물의 분포, 종류, 상태 데이터를 통해 도시 내 부족 지역을 파악하여 공원 확충 및 개선 정책 수립에 활용,생활권 공원 조성, 공원 접근성 향상, 도시 녹지 비율 제고에 기여2.시민 편의 서비스 제공:시민들이 근처 공원 및 시설물 현황을 쉽게 조회할 수 있는 위치 기반 앱 또는 공공 포털 서비스 구축 가능3.장애인·노약자 편의시설 정보 제공으로 모두를 위한 접근성 개선4.효율적인 시설물 유지보수 및 스마트 관리 시스템 구축5.안전 관리 및 유지보수 최적화:시설물 노후도, 점검 이력 등의 데이터를 분석해 선제적 보수 관리 가능 등
