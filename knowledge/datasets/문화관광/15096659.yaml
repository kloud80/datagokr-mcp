summary_user: 의왕도시공사가 운영하는 체육시설의 강좌를 강좌 한 건씩 담은 목록으로, 시설명·프로그램 구분·강좌명·운영요일·시작·종료 시간·정원·강좌대상·시설 전화번호가 들어 있으며 CSV 파일(약 46KB)로 활용신청 없이 받는다. 의왕 시민이 '평일 저녁에 다닐 수 있는 성인 대상 수영·헬스 강좌가 어느 시설에 있고 정원은 몇 명인가'를 확인하거나, 분석가가 시설별 강좌 구성과 정원을 비교할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·운영기관명 같은 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 의왕도시공사는 공사에서 운영하는 다양한 문화 및 체육 강좌에 대한 정보를 시민들에게 투명하고 효율적으로 제공하고자 데이터를 정형데이터 형태로 가공하여 제공하고 있습니다. 데이터는 의왕도시공사에서 운영하는 체육시설의 강좌현황에 대한 자료로써 시설명, 프로그램 구분, 강좌명, 운영요일, 강좌시작시간, 강좌종료시간, 정원, 강좌대상, 운영기관명, 시설전화번호 정보가 포함되어 있습니다. 데이터는 연 1회 업데이트됩니다. 해당 데이터는  시민이 체육 강좌를 편리하게 확인하고 공공 및 민간기관과의 시스템 연계, 일정 안내, 수요 분석 등에 폭넓게 활용할 수 있도록 설계되어 있습니다.
