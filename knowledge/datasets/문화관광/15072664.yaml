description_portal: '게임물관리위원회가 관리하는 지방자치단체 새올 행정망 연계 시스템의 업데이트 및 변경 이력을 기록한 자료입니다. 주로 2026년 2분기 동안 발생한 지자체망 연계 사업자 및 시스템의 정보 갱신 현황을 포함하고 있습니다. 파일의 주요 항목으로는 업데이트 키(Key), 업데이트 값(Value), 실제 업데이트가 발생한 일자, 그리고 해당 정보가 시스템에 최종 등록된 일자를 제공합니다. 이 데이터는 연계 사업자(예: 주식회사 드림에이지, 칠성소프트 등)의 시스템 변경 내역을 추적하고, API 통신 환경의 안정성을 점검하며, 연계 업데이트 상황을 투명하게 관리하는 데 활용될 수 있습니다.'
