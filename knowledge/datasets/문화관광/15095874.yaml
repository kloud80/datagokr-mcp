summary_user: 대구광역시 북구 관내 주요 관광지(대구국제사격장, 구암서원, 대구교육박물관, 운암지수변공원 등)별로 집계일자·관광객 유형(내국인·외국인 등)·방문객 수를 담은 집계 파일로, 약 15KB 크기의 CSV입니다. 북구 관광지 운영자나 지역 관광 분석가가 '어느 관광지에 언제 내외국인 방문객이 얼마나 왔는가'를 확인하는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 공통 조인 키가 없어, 다른 관광 통계와는 관광지명을 이름으로 맞추거나 북구라는 기관 단위로만 이어 쓴다.
description_portal: 대구광역시 북구 관내의 주요 관광지(대구국제사격장, 구암서원, 대구교육박물관, 운암지수변공원 등)별 내외국인 입장객 정보에 대한 데이터 입니다.관광지명, 집계기간, 관광객의 유형, 방문객의 수 등에 대한 항목으로 구성되어 있으니 정보 처리 시 참고 부탁드립니다.무인계측장치, 수기집계, 계측프로그램 등을 이용하여 북구의 주요 관광지 방문객 수를 집계하여 반영하고 있습니다.그러나 일부 집계에 미세한 오차가 발생할 수 있음을 안내드리니 처리 시 참고 부탁드립니다.데이터 건수가 많아 엑셀 다운로드 시 오류가 발생할 수 있으니 참고하여 데이터 처리하여 주시기 바랍니다.
