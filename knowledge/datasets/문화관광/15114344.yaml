summary_user: 시흥시에 있는 국가지정·경기도지정·향토문화유산을 한 건씩 나열한 목록 파일로, 종별·지정번호·지정일자·문화재명·위치를 담는다(약 2.4KB의 작은 CSV). 시민이나 지역문화 연구자가 '시흥시에 어떤 지정 문화유산이 있고 언제 지정됐으며 어디에 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 유산 목록과는 문화재명이나 종별+지정번호를 손으로 맞춰 이어야 한다.
description_portal: 본 데이터는 시흥시에 소재한 국가지정문화유산, 경기도지정문화유산, 향토문화유산에 대한 정보를 제공합니다. 각 문화재에 대한 지정 구분, 문화재명, 지정일, 소재지 주소, 관리기관 등의 항목으로 구성되어 있으며, 시흥시 내 문화자원의 현황을 체계적으로 파악하고 관리할 수 있도록 지원합니다. 본 데이터는 문화재 보존과 활용, 관광자원 개발, 지역문화 연구 등의 기초자료로 활용될 수 있습니다. 특히 문화정책 수립, 문화유산 해설 자료 개발, 문화재 관리업무 효율화 등에 기여할 수 있으며, 시민 및 연구자들이 지역의 문화유산에 쉽게 접근할 수 있도록 정보를 제공합니다. 또한 행정기관 간 정보 공유를 통해 문화재 보호 및 홍보 전략 수립에 필요한 공공데이터로서의 활용 가치가 높습니다.
