summary_user: 전북특별자치도 순창군 안에 있는 지정 문화재를 한 건씩 나열한 목록 파일로, 지정구분·형태·문화재명·지정년월일·지정번호·소재지·소유자·관리자를 담는다(CSV 약 4KB의 소규모 파일). 순창군에 어떤 국가·도 지정 문화재가 어디에 있고 누가 소유·관리하는지 확인하려는 주민·관광 사업자·지역 문화유산 담당자가 쓴다. 전역 조인 키가 없어서 국가유산청 유산 목록(종목코드·지정번호 체계)과는 문화재명·지정번호를 대조해 맞춰야 하고, 소재지 주소는 지도·지번 자료와 문자열 매칭으로 연결한다.
limits: 표준 코드(유산 종목코드·지정번호 체계, 소재지 PNU)가 없어 다른 문화재 데이터와 바로 결합하지 못하고, 이름·번호를 수작업으로 매핑해야 한다. 순창군 한 개 시군구만 다루므로 다른 지역 비교에는 국가유산청 API 등 별도 자료가 필요하다.
