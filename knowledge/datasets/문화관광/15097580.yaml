summary_user: 춘천시 관광지와 상권의 업소(상호)별·날짜별 위치기반 이용자 수와 성별·연령대(10대~50대 이상) 비율을 위경도·주소(시도·시군구·읍면동)와 함께 담은 파일로, 2021년 공공데이터 기업매칭 사업으로 구축됐고 CSV 한 파일이 약 128MB입니다. 춘천시 관광·상권 담당자나 창업 예정자가 '어느 상권·관광지에 어떤 연령·성별 이용자가 언제 많이 몰리는가'를 확인할 때 쓴다. 전역 조인 키는 없어 TourAPI 관광지 목록이나 상권 데이터와는 상호명·읍면동 이름 매칭 또는 위경도 근접 매칭으로만 잇는다.
description_portal: 해당 데이터는 2021년 공공데이터 기업매칭 사업을 통해 구축된 강원특별자치도 춘천시의 관광지 및 상권에 대한 정밀 위치기반 이용자 실태 현황에 관한 자료로, 주요 항목으로는 상호, 날짜, 업종, 위경도, 주소, 이용자수 및 성별 연령별 비율 등이 포함되어 있습니다. 이 데이터는 춘천시의 관광 전략 수립, 상권 활성화 방안 마련, 유동인구 기반 마케팅 기획, 지역 경제 분석 등에 활용될 수 있습니다. 또한, 위치기반 데이터를 바탕으로 한 서비스 개선, 상업시설 입지 전략, 관광객 대상 콘텐츠 개발 등 다양한 분야에서 실질적 의사결정을 지원하는 기초 자료로 활용될 수 있습니다.
