summary_user: 서울특별시 중랑구의 수영·골프·체육단련 등 종합체육시설업 업소를 한 곳씩 담은 인허가 명부로, 관리번호·인허가일자·영업상태·폐업일자·사업장명·주소·중부원점TM(EPSG:5174) 좌표를 업소 단위로 담는다. 중랑구에서 어떤 종합체육시설이 영업 중이거나 최근 폐업했는지 확인하려는 주민·창업자, 헬스장 등 체육시설 개폐업을 상권 신호로 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관(개방자치단체 코드, OPNSFTEAMCODE) 기준으로만 이어 쓰며, 상권 데이터와 함께 보는 축으로 쓴다.
description_portal: '서울특별시 중랑구의 수영, 골프, 체육단련 등과 같은 체육시설을 한 곳에 모아놓은 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
