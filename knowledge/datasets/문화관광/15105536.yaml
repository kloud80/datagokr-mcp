description_portal: 한국디자인진흥원이 운영하는 디자인 데이터 전문 플랫폼 디자인DB에 아카이브된 한국 디자인 모티브 중 춤과 놀이 카테고리의 게시글 목록을 제공합니다. 대분류로 궁중무용과 민속무용을 제공하며, 각 이미지 모티브에 대한 설명을 텍스트로 설명한 목록 데이터입니다. 수집 시기를 정확하게 유추할 수 없는 고 자료 데이터이기에 정확한 생성 일자를 표시할 수 없으나, 공익 목적으로 공개하는 것이기에 비영리적 사용만을 허가하며 이미지의 변경을 금지합니다. 해당 이미지는 디자인DB 홈페이지 내 아카이브 > 한국디자인 모티브 > 춤/놀이 탭에서 확인할 수 있습니다. (https://www.designdb.com/?menuno=1323&access=menu#gsc.tab=0)
