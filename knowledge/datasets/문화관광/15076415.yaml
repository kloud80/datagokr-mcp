description_portal: 이 데이터는 한국문화예술위원회가 2014년부터 2019년까지 문학 분야 문예지 발간 지원사업을 통해 수집한 분야별 계량성과 정보를 정리한 자료입니다. 주요 항목은 문학단체명, 사업연도, 연간발행호수, 장르별 수록작품 수(소설, 시, 시조, 수필, 동시, 동화, 평론, 희곡, 기타), 원고료 지급 총 창작자 수 및 보조금 지급 대상 창작자 수로 구성되어 있습니다. 수록작품 수는 ‘건’ 단위, 창작자 수는 ‘명’ 단위로 정량화되어 있으며, 문예지의 발간 규모, 장르별 편중도, 창작자 참여 현황을 수치로 파악할 수 있습니다. 이 데이터는 문학 장르별 지원성과 분석, 창작자 대상 정책 효과 진단, 문예지의 내용 다양성과 발
