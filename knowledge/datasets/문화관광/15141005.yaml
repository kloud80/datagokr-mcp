summary_user: 서울 양천구 관내 체력단련장업(헬스장 등) 영업장을 한 곳씩 담은 인허가 원천 명부로, 영업장명·인허가일자·폐업일자·영업상태·지번/도로명 주소·좌표·공사립 구분·면적 등을 담는다. 주민이 집 근처에서 영업 중인 헬스장을 찾거나, 분석가가 양천구 헬스장의 개업·폐업 추이를 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·영업장명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 LOCALDATA 체육시설업 명부나 상권 데이터와 나란히 본다.
description_portal: 서울특별시 양천구에서 제공하는 본 데이터는 관내에서 운영 중인 체력단련장업의 인허가 현황을 종합적으로 파악하기 위하여 구축된 행정자료이다. 본 자료에는 영업장이름, 인허가일자, 영업상태,  주소, 업종명, 공사립구분명, 연면적  등 관련 법령에 따라 확인해야 하는 핵심 항목이 포함된다. 해당 데이터는 체육시설의 적정한 설치와 운영 실태를 점검하고 이용자 안전 확보를 위한 행정업무 수행에 활용되며, 시설 개선 필요 여부를 판단하는 기초자료로도 활용된다. 또한 주민은 본 자료를 통해 체력단련장의 위치, 접근성, 시설 특성 등을 사전에 확인할 수 있어 공공 체육서비스 이용 편의성을 높일 수 있다. 아울러 지역 내 체육시설 공급 현황을 분석하여 정책 방향을 설정하고 행정지원 범위를 조정하는 데 활용됨으로써 건강한 생활체육 환경 조성에 기여한다. 본 데이터는 체력단련장업의 운영 투명성을 확보하고 지역사회 체육 인프라의 발전에 필요한 정보를 제공하는 중요한 자료이다.*체력단련장 -  헬스장과 같은 체격관리 및 근력, 유연성, 지구력 강화 등을 목표로 운동을 할 때 필요한 도구와 기구를 제공하는 업소 정보
