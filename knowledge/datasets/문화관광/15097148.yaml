summary_user: 제주 중문관광단지의 중문단지축구장과 대포연대 일대 무장애여행코스를 지점 단위로 담은 파일로, 지점마다 순서·위도·경도·구분·설명과 전체코스·추천코스 여부를 기록한다. 휠체어 이용자나 노약자·영유아 동반 가족이 '이 코스를 턱이나 경사 걱정 없이 돌 수 있는가'를 미리 확인하거나, 무장애 관광 콘텐츠를 만드는 사업자가 경로 지점을 지도에 올리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 지점 이름으로만 맞춰 붙인다.
description_portal: '"제주특별자치도 내 중문단지축구장과대포연대_무장애여행코스 데이터를 제공합니다.* 제주특별자치도의 중문단지축구장과 대포연대 일대는 장애인, 노약자, 영유아 동반 가족 등 관광약자의 이용 편의를 고려해 무장애여행코스로 선정된 지역입니다. 이 코스는 중문관광단지 내 평탄하고 접근이 용이한 길을 통해 바다전망과 숲 터널을 아우르며, 휠체어 진입 가능 여부, 턱·경사도 정보, 장애인화장실 및 장애인 주차구역 여부 등이 포함되어 있어 이동이나 이용에 제약이 있는 이용자도 사전에 방문 계획을 세울 수 있도록 구성되어 있습니다. 또한 이 정보는 무장애 관광 콘텐츠 제작, 관광서비스 접근성 개선, 지역관광정책 수립 및 평가 등에 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
