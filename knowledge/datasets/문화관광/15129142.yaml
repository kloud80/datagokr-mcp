description_portal: '광주광역시 남구 관내 음악산업 현황 및 정보(상호명, 소재지도로명주소, 소재지지번주소, 영업상태, 업종구분 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 문화관광과(☎062-607-2323)에서 제공합니다. 소재지도로명주소가 조회되지 않는 업장의 경우 미기재하였으니, 소재지지번주소를 참고하여 주시기 바랍니다. ※ 음악산업은 음악을 만들고, 유통하고, 공연하는 모든 경제 활동을 포함하며, 다음과 같습니다.- 노래연습장업 : 흔히 말하는 노래방 운영이 해당하며, 고객이 기계와 반주 음악을 이용해 노래를 부를 수 있도록 공간과 장비를 제공합니다.- 음반 · 음악 영상물 제작업 : 가수나 밴드의 음원, 앨범, 뮤직비디오 등을 기획·녹음·촬영·편집해 완성품으로 만드는 일을 말하며, 제작사는 완성된 음악을 음원 사이트나 CD, 영상물 형태로 유통합니다.'
