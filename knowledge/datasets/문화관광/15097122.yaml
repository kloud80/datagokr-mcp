summary_user: 제주 산이물공원 한 곳의 무장애 여행 코스를 지점(순서) 단위로 나눠 위도·경도, 구간 구분, 설명, 주요 포인트, 상세정보, 전체·추천 코스 여부를 담은 파일입니다. 휠체어 이용자나 교통약자 동반 여행자, 열린관광지 담당자가 '산이물공원 산책로를 어떤 동선으로 돌면 노면·경사·편의시설 걱정 없이 다닐 수 있나'를 확인하는 데 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와 붙이려면 좌표(위도·경도)나 공원 이름으로 TourAPI 관광지 정보 등과 맞춰야 합니다.
description_portal: '"제주특별자치도 내 제주특별자치도_산이물공원_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 ‘산이물공원’ 무장애 여행 코스 정보를 제공하며, 위치 정보(위도·경도), 구간 구분, 설명, 주요 포인트, 추천 코스 등이 포함되어 있다. 해당 코스는 장애인 및 교통약자의 이동 편의성을 고려하여 산책로의 노면 상태, 경사도, 접근 가능한 이동 동선, 휴식공간 및 주차·화장실 등의 편의시설 정보를 포함하고 있다. 무장애 관광 활성화와 열린관광지 확대를 위한 기초자료로서, 정책 수립 및 관광서비스 개선 등에 활용될 수 있도록 설계되었다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
