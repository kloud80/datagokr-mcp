description_portal: 중요 목조 문화재 방재 인적 인프라 현황입니다.  목조문화재, 방재시설 업체명, 연락처, 관할소방서명, 연락처 등  현황입니다.국가유산청_중요목조문화재 방재 인적 인프라 현황은 대한민국의 중요 목조 문화재를 보호하기 위해 구축된 전문 인력 기반의 방재 체계 현황을 정리한 자료입니다. 이 자료는 문화재 수리기술자, 전통 건축 전문가, 방제 전문 인력 등 다양한 분야의 전문가들이 포함되어 있으며, 이들의 역할과 자격 요건, 활동 범위 등을 상세히 담고 있습니다. 특히, 전통 건축 수리기능자 제도 도입 이후, 무형유산 보유자와 전승교육사 등 전통 기술 보유자들이 국가유산 수리 현장에 직접 참여할 수 있는 기회가 확대되어, 국가유산 보존의 질을 높이는 중요한 전환점이 되었습니다 . 또한, 국가유산청은 흰개미와 같은 해충으로부터 목조 문화재를 보호하기 위해 국제 전문가들과의 협력을 강화하고 있습니다. 2025년 3월에는 미국과 대만의 흰개미 전문가들을 초청하여 '흰개미 피해 방제 전략'을 주제로 세미나를 개최하였으며, 기후 변화에 따른 흰개미 개체 증가와 활동 영역 확대, 외래 흰개미 유입으로 인한 피해 예방과 보존 방안을 논의하였습니다 . 이러한 인적 인프라와 국제 협력은 중요 목조 문화재의 방재와 보존을 위한 핵심 요소로 작용하고 있으며, 지속적인 기술 개발과 인력 양성을 통해 문화유산 보호의 수준을 한층 높이고 있습니다
