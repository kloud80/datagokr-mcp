description_portal: '경상남도 거창군 게이트볼장의 데이터로 시설명, 소재지도로명주소, 소재지지번주소, 면적(제곱미터), 경기장수, 전화번호, 관리기관, 위동, 경도 등의 항목을 제공합니다.○ 데이터 기준일 : 2025. 05. 27.○ 게이트볼은 야외에서 망치처럼 생긴 스틱으로 공을 쳐서 게이트를 통과시켜 득점하는 구기 스포츠입니다. 5명이 한 팀을 이루어 2팀이 교대로 경기하며, 경기 시간은 30분입니다. 게이트볼은 신체에 부담이 적고 전신 운동 효과가 있어 노년층에게 특히 인기가 있으며, 100만 명 정도의 회원들이 즐기는 생활체육입니다.'
