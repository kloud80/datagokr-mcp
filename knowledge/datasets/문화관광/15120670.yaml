description_portal: 본 데이터는 부산교통공사 도시철도 역사 및 전동차 공간을 활용한 영상 로케이션 촬영 현황을 정리한 자료입니다.촬영일자, 장르, 촬영건명, 해당 호선, 세부 장소, 방송사 및 비고 항목으로 구성되어 있으며, 드라마, 예능, 시사 프로그램, 공익 광고, 영화 등 다양한 콘텐츠 제작 사례가 포함되어 있습니다. 본 데이터는 도시철도 공간의 활용성, 대중교통 기반 콘텐츠 제작 동향, 협업 수요 등을 파악하는 데 유용하며, 영상산업 진흥 및 공공 인프라 기반 콘텐츠 확산을 위한 기초자료로 활용될 수 있습니다. 호선별로 촬영장소와 장르별로 분류하여 분석할 수 있습니다.
