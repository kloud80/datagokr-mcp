summary_user: 공공생활체육시설을 시설 한 곳당 한 행으로 담은 현황 자료로, 집계년도·시군명·소유기관·관리주체와 부지·연면적, 체육관·수영장 면적과 규격, 가능 종목, 준공연도, 건설사업비, 주소·좌표를 기록한다. 분석가나 지자체 담당자가 '우리 시군에는 어떤 종목이 가능한 공공체육관이 몇 곳 있고, 규모와 조성비는 이웃 시군과 비교해 어떤가'를 따질 때 쓴다. 전역 조인 키는 없으며, 시군명·시군코드(SIGUN_CD)나 시설명으로 같은 기관(경기도)의 다른 데이터와 이름·코드를 맞춰 이어 쓴다.
description_portal: 이 데이터는 전국 각 시군에 위치한 공공생활체육시설의 현황을 기록한 자료로 집계년도, 시군명, 시설명, 소유기관, 관리주체명, 체육관가능종목내용(가능한 체육 종목), 준공연도, 부지면적 등의 정보를 포함하고 있습니다. 주요 항목에는 ‘체육관면적(㎡)’, ‘체육관규격’, ‘수영장면적(㎡)’, ‘수영장규격’, ‘체육관가능종목내용’, ‘기타시설명’ 등이 있으며, 일부 항목은 비고란을 통해 상세설명이 제공됩니다. 특히 ‘건설사업비(백만원)’ 항목은 시설 조성에 소요된 비용 분석에 활용될 수 있고, ‘부지면적(㎡)’과 ‘연면적(㎡)’ 정보는 시설 규모 파악에 유용합니다. 데이터는 공공체육시설의 운영, 정책 수립, 체육 인프라 분석, 지역 간 체육 자원 분포 비교 등에 활용할 수 있으며, 특정 항목은 누락된 값이 있어 해석 시 주의가 필요합니다.
