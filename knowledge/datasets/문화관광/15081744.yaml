summary_user: 대전예술의전당에서 열린 공연을 공연명별로 공연장·기간·장르·공연구분과 함께 공연횟수·공연일수·준비일수, 유료·무료·총 관람객수를 담은 실적 파일로, 포털 설명상 2003년 개관 초기부터의 기록이며 CSV 한 개(약 3.7KB) 규모입니다. 지역 공연 기획자나 문화정책 분석가가 "대전예술의전당의 연도별·장르별 공연 수와 관객 규모, 유료 관람 비중은 어떻게 변해 왔나"를 확인하는 데 쓴다. 공연ID·공연장ID 같은 전역 조인 키가 없어 KOPIS 공연 목록 등 다른 공연 데이터와는 공연명·공연장 이름과 기간을 맞춰 붙여야 한다.
limits: KOPIS 공연ID(mt20id)·공연장ID(mt10id) 같은 공통 키가 없어 다른 공연·예매 데이터와 정확한 건 단위 연결이 어렵고 이름 매칭에 의존한다. 대전예술의전당 한 곳의 실적만 담아 다른 공연장이나 지역과의 비교에는 별도 자료가 필요하다.
