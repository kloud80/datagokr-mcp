summary_user: 전남 보성군에서 열리는 차 관련 문화행사(다향대축제, 다도 경연, 차 품평회, 공연 등)를 행사 한 건씩 담은 파일로, 행사명·장소·기간·시각·요금·주최·주관기관·도로명/지번 주소를 포함한다(CSV 약 85KB). 관광객이 보성 차 축제가 언제 어디서 열리고 입장료가 있는지 확인하거나, 지역 축제 기획자가 보성군의 연간 차 행사 일정을 정리하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행사명이나 소재지 주소 문자열 매칭, 또는 같은 기관(보성군) 기준으로만 연결한다.
