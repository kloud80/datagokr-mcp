description_portal: '경기도 양평군의 맨발걷기 길 현황 자료입니다.맨발걷기 길이란 안전을 위해 이물질이 없고 부드러운 흙길이나 황톳길로 만들어지는 곳입니다.효능은 발 근육 강화, 혈액순환 개선, 스트레스 완화 등이 있습니다.- 길명칭: 맨발걷기 길의 정식 명칭입니다.- 거리: 코스를 따라 걸었을 때의 길이 입니다. 단위는 미터를 사용합니다.- 개통년월: 맨발걷기 길은 개통한 년도와 월을 의미합니다.- 유형: 습식, 황토길, 갯벌, 풀, 편도, 순환 등의 맨발 걷기 길의 특징과 정보를 자유롭게 나타냅니다.양평군은 어디서나 관광을 위한 요소 중 하나로 맨발걷기 길을 개통 중이며 해당 자료는 개통 시 업로드 예정입니다.'
