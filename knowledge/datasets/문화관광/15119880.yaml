summary_user: 킨텍스에서 열린 전시회·박람회별로 킨텍스앱을 통한 사전등록자 수를 행사명·행사기간과 함께 집계한 자료로, 전체 등록자 수와 함께 고양·경기·서울 등 광역시도별, 해외·기타 등록자 수를 행사 한 건당 한 행으로 담는다. 전시 주최사나 지역 관광·마케팅 분석가가 '특정 박람회의 앱 사전등록자는 어느 지역에서 많이 왔나'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행사명이나 시도 이름을 맞춰 연결해야 한다.
description_portal: '이 데이터는 킨텍스(KINTEX)에서 개최된 전시회 및 박람회의 모바일 앱을 통한 사전등록자 현황을 집계한 자료로, 행사별 등록자 수와 지역별 참여 분포를 확인할 수 있습니다주요항목으로는 행사명, 행사기간, 광역시도별 사전등록자 수, 사전등록 입장객 수 정보를 제공합니다.※ 킨텍스앱을 통해 사전등록한 현황만을 제공합니다. (인터넷을 통한 사전등록 현황 및 현장 등록자 수 제외)※ 2019. 12. 31.까지 세종특별자치시는 기타로 분류되어 있으니 참고하시기 바랍니다.※ 킨텍스앱 : 킨텍스에서 열리는 다양한 전시회의 무료 사전등록 서비스, 각종 이벤트 진행, 맛집/핫플레이스/호텔 할인권 제공, 실시간 주차장 현황, 주차비 결제 서비스를 제공'
