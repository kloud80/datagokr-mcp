summary_user: 강남구도시관리공단이 운영하는 봉은테니스장과 포이테니스장의 테니스 강좌를 강좌 한 건당 한 행으로 담은 파일로, 강좌명·교육 시간·운영요일·교육 대상·정원·수강료·교육장 도로명주소·접수 방법을 포함한다(약 2KB 규모의 소규모 CSV). 강남구 주민이나 생활체육 참여자가 '평일 저녁에 들을 수 있는 성인 테니스 강습이 어디에 있고 수강료와 접수 방법은 무엇인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 공공체육시설·생활체육 프로그램 데이터와는 시설명·운영기관명 같은 이름이나 교육장 도로명주소(교육장도로명주소)로 맞춰 이어 쓴다.
