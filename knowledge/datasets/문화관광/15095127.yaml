description_portal: '서울특별시 중랑구의 공연을 주된 목적으로 설치하여 운영하는 공연장 인허가 정보입니다. 사업장명,  제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
