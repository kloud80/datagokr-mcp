summary_user: 서울특별시 은평구에서 영리 목적으로 영화를 상영하는 영화관 등 업소의 인허가 내역을 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가일·취소일·폐업일, 영업상태, 상호명(BPLCNM), 지번·도로명 주소, 중부원점TM 좌표, 층수·시설면적 등을 포함한다. 주민이나 문화정책 분석가가 '은평구에 지금 영업 중인 영화관은 어디이고, 최근 폐업하거나 새로 문을 연 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명·주소를 맞추거나 같은 기관이 쓰는 관리번호(MGTNO)·자치단체 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울시 은평구 영화상영업 인허가 정보은평구의 영화관 등 영리를 목적으로 영화를 상영하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 영화관 등 영리를 목적으로 영화를 상영하는 업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 영화관의 상호명, 소재지 주소, 최초 등록일, 현재 영업 상태(영업중, 폐업 등), 상영관 수와 같은 지역 문화시설 운영의 핵심 행정 정보가 포함되어 있습니다 .이 데이터를 통해 주민들은 지역 내 이용 가능한 영화관의 위치와 현황을 파악하여 문화생활을 계획하는 데 도움을 받을 수 있습니다. 특히 이 데이터는 온라인 동영상 서비스(OTT)의 급부상으로 인해 급격한 변화를 겪고 있는 영화 산업의 오프라인 생태계를 직접적으로 보여주는 중요한 지표입니다 . 신규 및 폐업 영화관 현황은 OTT 시대에 맞서 프리미엄 상영관, 복합문화공간으로 진화하려는 영화관들의 생존 전략과 그 성과를 가늠하게 해줍니다 . 이는 지역의 문화 인프라 현황을 진단하고 관련 정책을 수립하는 데 필수적인 기초 자료로 높은 활용 가치를 지닙니다.'
