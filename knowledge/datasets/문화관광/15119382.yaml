description_portal: '이 데이터는 전북특별자치도의 전통 문화유산인 판소리에 대한 다양한 정보를 체계적으로 정리한 목록입니다. 각 행은 판소리 관련 주제(예: 판소리의 정의, 기원, 역사, 유파, 장단 등)를 제목과 함께 소개하며, 해당 항목에 고유한 판소리 코드가 부여되어 있어 체계적인 분류 및 검색이 가능하도록 구성되어 있습니다. 일부 주제는 세부 항목(부제목)으로 더 세분화되어 있으며, 각 부제목에도 고유 코드가 포함되어 있어 상세한 문화 콘텐츠 데이터베이스로 활용될 수 있습니다. 판소리의 예술적 특성, 음악 구조, 계보와 전승, 대표 작품 등을 폭넓게 이해하실 수 있는 자료입니다.'
