description_portal: 이 데이터는 경상남도 진주시 관내 읍면동 단위로 설치된 야외운동기구의 현황을 제공하는 공공데이터입니다. 각 기구의 행정동, 관리부서, 설치장소명, 리·통, 번지, 야외운동기구 수량 등이 포함되어 있으며, 읍면동별로 생활체육 인프라의 분포와 시설 수준을 파악할 수 있습니다. 해당 정보는 지역 주민의 건강 증진, 체육 활동 참여율 향상, 운동기회 형평성 확보, 체육시설 접근성 개선 등을 위한 정책 수립과 행정 계획 수립에 활용됩니다. 또한, 노후 시설의 유지보수와 교체 주기 결정, 신규 야외운동기구 설치 위치 선정 등 효율적인 체육시설 관리와 예산 편성에도 중요한 기초 자료로 쓰입니다. 이를 통해 지역 간 체육 인프라 격차를 해소하고 주민 삶의 질 향상에 기여할 수 있습니다.
