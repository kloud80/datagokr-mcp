summary_user: 제주 방문 내국인 관광객 실태조사 결과 가운데 완전패키지 여행객의 1인당 지출 경비를 기준 연도와 거주지(시도 단위)별로 집계한 통계로, 금액 구간별 응답 비율(%)과 평균 지출액(원)을 담는다. 관광업계나 정책 담당자가 '서울·부산 등 어느 지역 출신 패키지 관광객이 제주에서 더 많이 쓰는가'처럼 출발 지역별 소비 규모를 비교하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없으므로, 다른 관광 통계와는 거주지 시도명을 이름으로 맞추거나 같은 기관의 실태조사 표끼리 연도·거주지 기준으로 이어 쓴다.
description_portal: 이 데이터셋은 2017~2019년 사이 제주를 방문한 내국인 관광객을 대상으로, 출발 거주지(시도 등)별로 ‘완전패키지 여행’을 선택한 관광객 1인당 평균 지출 경비를 집계한 통계자료이다. ‘완전패키지’란 교통, 숙박, 식사, 관광, 체험 등이 포함된 패키지 여행상품을 의미하며, 이 자료는 지역별 관광객 소비 규모 비교, 지역 출신에 따른 여행 행태 분석, 여행비용 대비 관광 만족도 및 경제적 파급 효과 평가를 위한 기초 데이터로 활용될 수 있다. 특히 관광 정책 수립, 관광객 유입 전략, 패키지 여행 상품 기획, 지역 간 관광 소비 격차 분석 등에 유용하며, 공공기관·연구기관·관광업계에서 제주 관광의 내국인 수요와 소비 구조를 파악하는 데 중요한 근거로 활용 가능하다. 제공 기관은 제주특별자치도이며, CSV 형식으로 공개되어 있어 누구나 다운로드 및 분석이 가능하다.
