summary_user: 광양시의 주요 관광지를 한 곳씩 행으로 담은 지자체 관광지 목록 파일로, 시군명·관광지 명칭·소재지·소개·담당부서·연락처·데이터기준일을 수록하며 파일 크기는 약 4KB(CSV)로 작다. 광양에 가볼 만한 관광지가 어디에 있고 어떤 곳인지, 문의는 어느 부서로 하면 되는지 확인하려는 여행자나, 광양 관광지 목록을 지도·안내 콘텐츠로 정리하려는 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 관광지 명칭·소재지 주소를 문자열로 맞추거나 같은 기관 자료끼리만 이어 쓸 수 있고, 전국 단위 관광 콘텐츠는 TourAPI(contentId) 쪽이 대표 원장이다.
limits: 관광지 고유 ID나 TourAPI contentId 같은 공통 키가 없어 다른 관광 데이터와 자동으로 결합되지 않고 명칭·주소 매칭에 의존해야 한다. 범위는 광양시 한 곳의 관광지 목록에 그쳐 시군 간 비교나 전국 분석에는 TourAPI 등 다른 원장을 써야 한다.
