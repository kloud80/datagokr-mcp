summary_user: 서수원칠보체육관에서 2025년 하반기(7~12월)에 운영한 스포츠 강좌 43개를 강좌 한 건당 한 행으로 담은 파일로, 강좌명·강사·운영 요일·교육 장소·정원·수강료·접수 기간과 방법을 포함한다. 수원 서부 주민이 이 체육관에서 어떤 요일에 어떤 강좌를 얼마에 들을 수 있고 언제 어떻게 접수하는지 확인하거나, 분석가가 공공 체육시설의 생활체육 강좌 구성과 정원을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 체육시설 프로그램 현황이나 평생학습 강좌 자료와는 강좌명·운영기관명·교육장 도로명주소 같은 이름·주소 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 서수원칠보체육관에서 2025년 하반기(7~12월) 동안 운영된 스포츠 프로그램 현황을 정리한 자료입니다. 총 43개 강좌가 포함되어 있으며, 각 강좌는 강좌명, 강사명, 운영 요일, 교육 장소, 강좌 정원, 접수 방법 등 다양한 항목으로 구성되어 있습니다. 대부분의 강좌는 일반인을 대상으로 오프라인 방식으로 진행되며, 접수는 인터넷 예약 및 방문 결제 병행 형태로 운영됩니다. 이 외에도 직업능력개발훈련비, 학점은행제, 평생학습계좌제 관련 항목은 모두 "N"으로 되어 있어 지원이나 인정 대상이 아님을 나타냅니다. 데이터는 2025년 12월 30일 기준으로 작성된 최신 정보입니다.
