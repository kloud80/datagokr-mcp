description_portal: '창원시 관내 입영장병 가족할인업소현황( 할인율 : 카드 5%, 현금 10%)입니다. 항목은 업소명, 주메뉴, 소재지, 전화번호입니다.입영 장병 및 가족 할인 업소 현황 데이터는 창원시 관내에서 입영 예정자, 현역 병사 및 동반 가족에게 식음료나 숙박에 대해 일정 할인율을 적용하는 지정 업소들의 정보를 체계적으로 정리한 자료입니다. 주요 항목으로는 업소명, 소재지, 업종(음식점, 숙박 등), 할인율, 적용 조건 및 영업일 여부 등이 제공되며, 이 데이터는 군 장병 대상 생활 편의 지원, 지역 상권 활성화 전략, 관광 및 방문객 안내, 민원 대응, 문화·관광 정책 연계 자료로서 활용 가치가 높습니다. 특히 GIS 기반 시각화와 연계 시 할인 업소 밀집도 분석과 최적 경로 안내, 접근성 평가 등의 정책 수립에 기반이 되는 핵심 기초자료로 기능합니다'
