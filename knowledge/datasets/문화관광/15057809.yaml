summary_user: 경기도 내 출판사를 사업장 단위로 한 건씩 담은 인허가 원천 데이터로, 사업장명·인허가일자·영업상태·폐업일자·주소와 위경도 좌표·시설 면적 등을 영업 중인 곳과 폐업한 곳 모두 포함해 기록한다. 지역 출판 정책 담당자나 분석가가 "우리 시군에 영업 중인 출판사가 몇 곳이고 최근 몇 년간 얼마나 문을 닫았나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)나 주소·사업장명 매칭으로 연결해야 하고, 위경도 좌표로 지도나 다른 공간 데이터 위에 겹쳐 볼 수 있다.
description_portal: 이 데이터는 경기도 내 출판사의 현황을 기록한 자료로, 사업장명, 인허가일자, 영업상태, 폐업 여부, 소재지 및 연락처, 시설 정보 등을 포함하고 있습니다. 출판사는 지역 문화산업의 중요한 기반으로, 도서 및 콘텐츠 제작·유통을 담당하며 지식과 정보 확산의 중심 역할을 수행합니다. 본 자료는 영업 중인 출판사와 폐업한 업체를 함께 기록하고 있어 산업의 변동 추이를 분석할 수 있으며, 지역별 출판 인프라 분포와 운영 실태를 파악하는 데 유용합니다. 또한 문화정책 수립, 콘텐츠 산업 활성화, 지역 출판 생태계 분석, 독서문화 진흥 전략 마련 등 다양한 분야에서 기초자료로 활용될 수 있습니다.
