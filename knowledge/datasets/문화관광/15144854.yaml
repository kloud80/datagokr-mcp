description_portal: 이 데이터는 도서관에 기증된 자료의 누적 현황을 담고 있습니다. 고유식별번호는 각 기증자료를 유일하게 식별할 수 있도록 하며, 서지키는 도서의 기본적인 서지 정보 값입니다. 자료구분명과 형식구분명은 해당 기증자료가 어떤 종류(일반, 교과서, 고서 등)이고 어떤 형식(예:도서, 전자자료 등)인지 구분하는 데 사용됩니다. 이용대상명은 이 자료가 어떤 연령대나 계층을 위한 것인지를 나타내며, 수입년도와 입력일을 통해 자료의 도입 및 등록 시점을 확인할 수 있습니다. 화폐구분과 가격은 기증자료의 가치를 표현한 항목이며, 총권수는 기증된 해당 자료의 수량을 보여줍니다. 이 데이터는 도서관 기증 현황 분석, 문화기부 통계, 지역별 기증 활성화 전략 수립 등에 유용하게 활용될 수 있습니다.※본 데이터의 "서지키"와 [경기도 과천시_도서관 색인정보]의 "고유식별번호"를 매핑할 경우 도서명을 조회할 수 있습니다.
