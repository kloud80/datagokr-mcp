summary_user: 서울특별시 은평구에 등록된 외국인관광 도시민박업소를 업소 단위로 담은 인허가 원장으로, 인허가일·취소일, 영업상태·상세영업상태, 폐업일, 지번·도로명 주소, 업소명, 객실 수, 영문 상호·주소, 중부원점TM 좌표(X, Y) 등을 담는다. 은평구에서 현재 영업 중인 외국인 대상 민박이 어디에 몇 곳 있는지, 언제 등록·폐업했는지 확인하려는 주민·사업자·관광정책 담당자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 자치구의 같은 인허가 데이터나 숙박업 데이터와는 개방서비스 코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드나 주소·업소명 매핑으로만 잇는다.
description_portal: '은평구의 도시 지역의 주민이 거주하고 있는 주택을 이용하여 외국인 관광객에게 한국의 가정 문화를 체험 할 수 있도록 숙식 등의 서비스를 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.이 데이터는 서울특별시 은평구에 등록된 외국인관광 도시민박업소에 대한 인허가 정보를 담고 있으며, 민박업소의 주소, 영업상태, 등록일, 호스트 유형 등으로 구성되어 있습니다. 외국인관광 도시민박업은 외국인을 대상으로 주거지 내 일부 공간을 활용해 숙박을 제공하는 형태로, 최근 들어 ‘로컬 경험 중심의 여행’, ‘홈쉐어링’ 트렌드와 함께 빠르게 확산되고 있습니다. 특히 대형호텔 중심의 숙박 문화에서 벗어나, 일상적인 한국 가정의 분위기와 문화를 체험하려는 수요 증가에 따라 외국인 대상 민박업은 지역관광의 다양성과 포용력을 높이는 매개가 되고 있습니다. 이 데이터는 해당 업소의 위치 분포와 등록 현황을 기반으로, 도시 내 불법 숙박업소 대응, 공공안전 및 범죄 예방, 생활 소음 민원 조정, 관광객 편의 확보 등 다양한 정책 수립에 기초 자료로 활용됩니다. 또한, 국제관광 활성화, 외국인 대상 환대 서비스 교육, 한류 콘텐츠와 연계한 관광자원 발굴 등 민관 협력 기반 정책 기획 시에도 활용성이 높으며, 플랫폼 기반 숙박중개 서비스 현황과의 비교 분석에도 기초가 됩니다. 해당 데이터는 지역 브랜딩, 도시 이미지 제고, 생활형 관광 플랫폼 확산 등 다양한 트렌드에도 밀접하게 연결되는 중요한 기반 자료입니다.'
