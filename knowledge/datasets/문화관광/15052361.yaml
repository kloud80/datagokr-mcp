description_portal: 서울시 유적지 현황(중국어 간체) 데이터는 서울에 위치한 주요 유적지의 명칭과 행정구역 정보를 중국어 간체로 제공하는 공공데이터입니다. 각 유적지는 메인 키를 통해 고유하게 구분되며, 유적지 명칭은 중국어 간체로 표기되어 중국어권 이용자의 이해와 활용을 돕고 있습니다. 또한 행정 시, 행정 구, 행정 동 정보가 중국어 간체로 함께 제공되어 유적지의 위치를 시·구·동 단위까지 정확히 파악할 수 있습니다. 이 데이터는 중국어 관광 안내 서비스, 다국어 지도 제작, 관광 정책 수립 등 서울시 유적지의 국제적 홍보와 접근성 향상을 위한 기초 자료로 활용될 수 있습니다.
