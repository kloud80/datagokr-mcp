description_portal: '이 데이터는 서울시 야경명소 정보를 제공하며, 문화·체육시설, 공원·광장 등 다양한 카테고리의 서울시 주요 야경 관람지를 포함하고 있습니다.기본 정보: 번호, 분류, 장소명, 주소(도로명·지번)와 위도·경도 좌표 제공.연락·운영 정보: 전화번호, 홈페이지 URL, 운영시간, 유·무료 구분, 이용 요금.소개 내용: 명소에 대한 설명과 특징, 역사적·문화적 가치 포함.교통 정보: 인근 지하철역, 버스 노선, 주차 안내.데이터 관리 정보: 등록일시, 수정일시로 최신성 확인 가능.이 자료를 통해 서울 야경 관광지도 제작, 관광 코스 추천, 문화 관광 정책 수립, 야간 관광 활성화 프로그램 기획 등이 가능합니다. 특히 위도·경도 좌표와 대중교통 정보를 이용해 GIS 기반의 위치 분석과 접근성 평가를 수행할 수 있습니다.'
