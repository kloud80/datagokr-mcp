summary_user: 전국 자치단체의 기타 인쇄사(인쇄소) 인허가 정보를 업소 건별로 담으며, 사업장명·인허가일자·영업상태·주소·좌표 등을 포함해 전체 24,081건이다. 인쇄소의 영업 여부나 소재지를 확인하려는 국민·사업자, 지역별 인쇄업 분포를 보려는 분석가가 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 조인 키로 다른 주소 기반 데이터와 이어 쓰며, 사업자번호 같은 별도 키는 필드에 없다.
description_portal: '기타_인쇄사 데이터는 인쇄소 등 인쇄를 전문으로 하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 인쇄사 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의  - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 출판인쇄독서진흥과 / 044-203-3284 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
services:
  - op: /info
    name: 기타_인쇄사 데이터 조회
    endpoint: https://apis.data.go.kr/1741000/printing_shops/info
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        desc: 페이지번호
      - name: numOfRows
        required: true
        desc: '한 페이지 결과 수(max: 100)'
      - name: returnType
        required: false
        desc: 응답의 데이터 타입
      - name: cond[LCPMT_YMD::GTE]
        required: false
        desc: 인허가일자 이상의 값(YYYYMMDD)
      - name: cond[LCPMT_YMD::LT]
        required: false
        desc: 인허가일자 미만의 값(YYYYMMDD)
      - name: cond[SALS_STTS_CD::EQ]
        required: false
        desc: 영업상태코드 와 일치하는 값
      - name: cond[FBCTN_HNDL_ITEM_CN::LIKE]
        required: false
        desc: 제작취급품목내용 을(를) 포함하는 값
      - name: cond[SURRND_ENVRNMNT_NM::LIKE]
        required: false
        desc: 주변환경명 을(를) 포함하는 값
      - name: cond[DAT_UPDT_PNT::GTE]
        required: false
        desc: 데이터갱신시점 이상의 값(YYYYMMDDHHMMSS)
      - name: cond[DAT_UPDT_PNT::LT]
        required: false
        desc: 데이터갱신시점 미만의 값(YYYYMMDDHHMMSS)
      - name: cond[OPN_ATMY_GRP_CD::EQ]
        required: false
        desc: 개방자치단체코드
      - name: cond[BPLC_NM::LIKE]
        required: false
        desc: 사업자명 을(를) 포함하는 값
