description_portal: 국립국악원 국악아카이브의 귀중한 소장 자료를 기반으로 기획된 온라인 전시 콘텐츠 링크 목록을 한눈에 제공하는 페이지의 목록 정보입니다.한국 전통 음악과 춤의 역사, 유물, 인물, 악기 등 폭넓은 주제를 심층적으로 다루며, 일반 대중의 이해를 돕기 위해 카드뉴스 및 스토리텔링 기법을 활용하여 쉽고 흥미롭게 구성되어 있습니다. 이 페이지는 국악 지식과 정보에 접근할 수 있는 가장 편리하고 포괄적인 온라인 통로 역할을 수행합니다. 사용자들은 이 목록을 통해 시간과 공간의 제약 없이 국립국악원 아카이브가 큐레이션한 국악 관련 전시를 온라인으로 열람할 수 있는 전시 목록을 제공하고 있습니다.
