summary_user: 제주 표선면 가마리 포구 해안로에서 해비치호텔 해안로까지 이어지는 해비치올레길 무장애 여행 코스의 지점별 위도·경도·해발고도와 장소 설명·이미지를 담은 코스 단위 원천 데이터다. 휠체어·유모차 이용자나 고령자의 여행 안내를 맡은 관광 서비스 개발자가 이 코스를 지도 위에 그리고 경사 변화를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지나 다른 무장애 코스와는 장소명 매칭이나 좌표 근접으로만 연결한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 해비치올레길 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 해비치올레길은 제주 동남부 표선면의 가마리 포구 해안로에서 시작해 해비치호텔 해안로까지 이어지는 해안 도보 코스로, 무장애 여행 정보 데이터셋을 통해 위도·경도 좌표, 장소명, 장소 설명, 이미지 자료 등이 제공된다. 해당 구간은 시멘트 포장 또는 자전거도로를 활용한 해안도로로 노면이 평탄하며, 장애인 화장실과 주차장 등 편의시설이 마련되어 있어 휠체어나 유모차 이용자, 고령자, 교통약자도 비교적 편안하게 이용 가능하다. 이 데이터는 열린관광지 홍보, 무장애 관광 안내, 접근성 기반 관광 정책 수립 및 관광 콘텐츠 개발, 지도 서비스 구축 등의 공공·관광 분야 기초자료로 유용하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
