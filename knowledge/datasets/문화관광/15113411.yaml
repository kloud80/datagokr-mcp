summary_user: 서울 광진구 관내 민간 체육시설업체를 업체 한 곳당 한 행으로 담은 명부 파일(csv, 약 4.8KB)로, 상호·우편번호·도로명 시설주소·전화번호를 담는다. 주민이나 분석가가 '광진구 안에 어떤 체육시설업체가 어디에 있고 연락처는 무엇인가'를 확인하거나, 헬스장 같은 업소 분포를 상권 관점에서 살필 때 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 상호명이나 도로명 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 서울특별시 광진구_체육시설업 현황 데이터는 광진구 관내에서 운영되는 체육시설업체의 기본 정보를 제공하는 행정 데이터입니다. 이 데이터는 “상호”, “우편번호”, “시설주소”, “시설전화번호”, “데이터기준일” 필드로 구성되어 있습니다. ‘상호’는 해당 체육시설업체의 이름을 나타내며, ‘우편번호’는 시설이 위치한 지역의 우편번호를 제공합니다. ‘시설주소’는 체육시설의 상세 위치를, ‘시설전화번호’는 문의 및 예약을 위한 연락처를 제공합니다. 또한 ‘데이터기준일’은 정보의 최신화 기준일을 명시하여 데이터의 시점을 확인할 수 있도록 합니다. 이 데이터는 지역 내 체육시설 분포 파악, 생활체육 정책 수립, 주민 편의시설 안내 및 체육 인프라 관리에 활용될 수 있는 기초 자료입니다.
