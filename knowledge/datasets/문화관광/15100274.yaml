description_portal: 이 데이터는 서울특별시 동작구 관내에서 허가된 옥외광고물의 현황 정보를 제공하며,정보 항목에는 광고물의 종류(간판, 현수막, 벽보 등), 허가 일자, 설치 위치, 허가 유효기간, 허가 유형 등이 포함됩니다. 본 자료는 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」에 따라 광고물의 적정한 설치와 관리 현황을 파악하기 위해 수집됩니다.데이터는 민원 처리, 광고물 점검, 불법 광고물 단속 및 행정처분 등의 행정 업무 수행에 활용되며, 또한 광고 산업 종사자, 연구자, 시민 등 다양한 이용자가 지역 내 광고물 설치 현황을 파악하거나 상업적 계획 수립, 도시 경관 개선, 공공디자인 기획 등에 참고할 수 있습니다.
