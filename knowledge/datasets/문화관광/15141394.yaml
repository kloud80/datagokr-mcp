summary_user: 서울 종로구 안 체력단련장업(헬스장 등) 업소별 인허가 원천 기록으로, 사업장명·인허가일·취소일·영업상태·폐업일·휴업기간·주소·좌표·면적·지도자 수 등을 업소 한 건씩 담는다. 주민이 다니려는 헬스장이 정식 신고된 영업 중 업소인지 확인하거나, 분석가가 종로구 헬스장 개업·폐업 추이를 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 지자체 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 축의 다른 체육시설업·상권 인허가 데이터와 나란히 놓고 본다.
description_portal: 본 데이터는 서울특별시 종로구 내 체력단련장업체의 인허가 현황을 정리하여 제공하는 자료입니다. 체력단련장업은 주민의 건강 증진과 생활체육 참여를 위한 시설을 운영하는 업종으로, 「체육시설의 설치·이용에 관한 법률」 등 관련 법령에 따라 사업자 등록과 영업 허가를 받아야 합니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등 기본 행정 정보가 포함되어 있어 종로구 내 체력단련장업체의 등록 현황과 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 주민은 합법적인 시설 이용 여부를 확인할 수 있으며, 행정기관은 영업허가 관리, 시설 안전 점검, 생활체육 정책 수립 및 지역 체육산업 발전에 활용할 수 있습니다. 또한 연구자와 민간 기관은 지역 체력단련장 분포와 산업 동향을 분석하는 기초자료로 활용할 수 있으며, 지역 사회의 건강 증진과 스포츠 활성화 기반 마련에 기여할 수 있습니
