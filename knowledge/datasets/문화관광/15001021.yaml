summary_user: 대전광역시 내 호텔·모텔·게스트하우스·펜션 등 숙박시설을 업소 한 곳당 한 행으로 담은 API이며, 이름·우편번호·주소·연락처·분류·홈페이지·소개 문구를 제공한다. 대전 여행객이 특정 구나 동네 근처 숙소의 연락처와 홈페이지를 찾거나, 분석가가 대전 숙박시설의 유형별 분포를 볼 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 공중위생 숙박업 인허가(LOCALDATA) 등과는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 대전광역시 문화관광(숙박정보) 데이터는 지역 내 주요 숙박 시설의 현황을 집중적으로 제공합니다. 호텔, 모텔, 게스트하우스, 펜션 등 다양한 유형의 숙박 시설이 행정 구역별로 분류되어 수록되어 있으며, 각 숙박 업소의 명칭, 위치, 연락처, 부대 시설 등 이용객에 필요한 실질적인 정보가 다각적으로 포함됩니다. 이 자료는 관광객은 물론 기업, 연구자, 행정기관 등 다양한 이용자에게 여행 경로 설계, 지역 산업 분석, 관광 자원 활용, 정책 기획 등 다방면에서 활용됩니다. 2022년 대전광역시 공공데이터 기업매칭 지원사업 개발 OpenAPI입니다.
team:
