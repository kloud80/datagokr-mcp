summary_user: 경상북도 청송군 안의 호텔·모텔·여관 숙박업소를 한 곳당 한 행으로 담은 목록 파일(csv, 약 6KB)로, 업소명·업종명·도로명주소·지번주소·전화번호·데이터기준일자를 담는다. 청송 여행객이 군내 숙소 연락처와 위치를 찾거나, 분석가가 청송군 숙박업소의 업종 구성과 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소를 기준으로 맞춰 이어 쓰며, 공중위생 숙박업 인허가 원천(LOCALDATA)과 대조하는 용도에 맞는다.
description_portal: 경상북도 청송군 호텔, 모텔, 여관의 정보입니다. 숙박업소명, 업종명, 소재지의 도로명주소, 소재지의 지번주소, 대표전화번호 정보를 제공하는 데이터 입니다. 산소카페 청송에 관광오시어 편안한 휴식을 보내실수 있는 다양한 숙박시설을 소개합니다. 가족, 친구, 연인과 함께 오시어 맑은 공기와 빼어난 경관이 있는 청송으로 관광오시기 바랍니다. 청송 숙박은 대형 호텔 부터 민박까지 다양하게 제공되고 있습니다. 먹거리 즐길거리 다양하게 경험하시고 편안한 숙박시설에서 사랑하는 사람들과 좋은 시간 보내시길 바랍니다.
