summary_user: 한국저작권위원회가 관리하는 소프트웨어 임치(소스코드·기술자료를 제3기관에 맡겨 두는 제도) 건수를 2012년부터 2025년까지 연도별 열로 정리한 전국 단위 집계 통계로, 383바이트짜리 작은 CSV 파일이다. 정책 분석가나 IT 기업 담당자가 '소프트웨어 임치 이용이 해마다 늘고 있는가'처럼 임치 제도 이용 추이를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도를 기준으로 맞추거나 같은 기관의 다른 저작권 통계와 나란히 놓고 비교하는 방식으로만 이어 쓴다.
description_portal: 한국저작권위원회가 관리하는 연도별 소프트웨어 임치 건수 현황을 정리한 통계자료로, 소프트웨어 개발 결과물에 대한 권리 보호와 산업 안정성 확보를 위한 제도적 기반을 보여준다. ‘소프트웨어 임치’란 개발된 소프트웨어의 소스코드나 기술자료를 신뢰성 있는 제3기관에 보관하여, 개발사가 폐업하거나 유지보수를 제공할 수 없는 상황이 발생했을 때 이를 사용자에게 제공함으로써 서비스 연속성을 보장하는 제도다. 본 데이터는 연도별 접수된 임치 건수, 보관 중인 프로그램 수, 신규 임치와 갱신 임치 건수 등을 포함하고 있어, 국내 소프트웨어 산업의 성장 추이 및 기업의 지식재산권 보호에 대한 관심도를 가늠할 수 있다. 특히 공공기관 및 민간 기업의 소프트웨어 안정성 확보 수요가 반영된 수치로, IT산업 정책 및 보안관리 전략 수립 시 유용하게 활용될 수 있다.
