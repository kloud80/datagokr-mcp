summary_user: 전통문화포털에 실린 전통문화공간·문화인물·100대 민족문화상징 등의 항목을 건별로 담은 CSV 파일(약 2.4MB)로, 구분·제목·키워드·주소·좌표·상세분류 등을 함께 제공한다. 전국의 전통문화공간 위치를 지도에 올리거나 특정 문화인물·민족문화상징의 설명을 찾아보려는 국민·콘텐츠 제작자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 제목 같은 이름 매칭이나 주소·좌표(X좌표·Y좌표)를 이용한 위치 결합으로만 이어 쓴다.
description_portal: 전통문화포털은 올바른 전통문화 지식 공유 및 정보 제공을 위한 전통문화 대표 플랫폼입니다. 해당 데이터는 전통문화포털 내 전통문화공간,  문화인물, 100대 민족문화상징 등의 정보 데이터로  2020년 개방되었으며, 구분, 제목, 키워드, 설계자, 대상, 주소, 출처, 상세분류 등의 항목을 제공합니다. 전통문화포털은 한국문화정보원에서 한국공예디자인문화진흥원으로 2021년 이관되었으며, 공공누리 마크가 부착되어있는 저작물에 한하여 해당 공공누리 유형에 맞게 이용이 가능합니다.
