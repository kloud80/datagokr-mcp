summary_user: 전국 자치단체가 관리하는 관광궤도업 인허가 업체를 사업장 단위로 담는 API로, 전체 26건이며 인허가일자 기준 2008-01-21부터 2026-07-14까지 분포한다. 관광궤도(케이블카 등) 사업장이 전국에 어디 있고 영업·폐업·휴업 중 어떤 상태인지 확인하려는 국민이나 분석가가 쓴다. 지번주소·도로명주소(address) 필드를 키로 다른 관광 사업 등록 데이터나 주소 기반 데이터와 이어 쓰며, 사업자번호 같은 별도 식별 키는 필드에 없다.
description_portal: '문화_관광궤도업 데이터는 궤도사업의 허가를 받은 자가 주변 관람과 운송에 적합한 시설을 갖추고 관광객에게 이용을 제공하는 업체(소) 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 관광궤도업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광산업진흥과 / 044-203-2830, 2832 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
