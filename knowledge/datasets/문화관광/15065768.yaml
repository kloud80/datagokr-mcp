summary_user: 인천광역시의 대표 음식문화거리 11곳의 거리명, 대표음식, 거리위치를 거리 한 곳당 한 행으로 담은 작은 목록 파일이다. 인천 여행객이나 관광 콘텐츠 기획자가 '인천에서 밴댕이·꽃게·냉면 같은 특정 음식으로 유명한 거리가 어디인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 관광지·음식점 데이터와는 거리명이나 위치 문자열을 직접 맞춰서만 이어 쓸 수 있다.
description_portal: 인천광역시의 대표적인 음식문화거리에 대한 현황정보를 파일데이터로 제공하고 있습니다.제공하는 정보는 음식문화거리명칭, 대표음식, 음식문화거리 위치이며아래와 같이 총 11개의 음식문화거리를 제공하고 있습니다. - 더리미 장어마을, 만석동 쭈꾸미거리, 선수 밴댕이마을, 송도 꽃게거리, 송현동 순대골목거리, 연락골 추어마을, 연안부두 밴댕이 회무침거리, 외포리꽃게마을, 용현동 물텀벙이거리, 월미문화거리, 화평동 세숫대야 냉면거리인천관광공사는 공사 공공데이터 개방 및 인천관광 활성화를 위하여 주기적으로 데이터를 현행화하여 제공할 예정입니다.인천시 음식문화거리 관련 문의는 공사홈페이지 및 공공데이터 통합플랫폼을 통해 해주시기 바랍니다.
