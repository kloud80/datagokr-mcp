summary_user: 제주시 한림읍 금능석물원 한 곳의 무장애여행 정보를 담은 파일로, 위도·경도·해발고도 같은 위치 좌표와 장소 설명·이미지를 담는다. 휠체어 이용자나 교통약자를 위한 여행 안내·지도 서비스를 만드는 사업자나 지자체가 '금능석물원의 정확한 위치와 무장애 동선 정보가 무엇인가'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, TourAPI 관광지 목록 등 다른 데이터와는 관광지 이름이나 좌표로 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 금릉석물원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 본 데이터셋은 제주 제주시 한림읍에 위치한 금능석물원의 무장애 여행 정보를 포함하며, 위도·경도 좌표, 관광지 명칭, 장소 설명, 이미지 자료를 담고 있다. 금능석물원은 약 40년간 돌하르방을 제작한 장공익 명장이 제주의 생활과 민속, 전통을 돌 조각으로 표현한 약 10,000평 규모의 돌문화 공원으로, 해녀상·동자상·어머니상 등 다양한 조각품과 동굴(정여굴 · 조롱굴) 내 암자까지 포함되어 있다. 이 데이터는 휠체어 이용자 및 교통약자도 고려한 무장애 관광지 정보로, 관광 안내, 지도 서비스, 무장애 관광지 홍보, 열린관광지 조성, 관광 정책 수립 등 공공 및 관광 분야에서 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
