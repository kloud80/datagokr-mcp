summary_user: 빅카인즈(BIGKinds) 뉴스 데이터베이스에서 '자유' 관련 기사를 모아 기사 한 건마다 일자·언론사·제목·통합 분류·키워드·특성추출어를 담은 건별 메타데이터 CSV 파일(약 57MB)이다. 연구자·정책 분석가가 표현·언론·집회의 자유 같은 자유 담론이 시기별로 어느 언론사에서 얼마나, 어떤 키워드와 함께 보도됐는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자나 언론사 이름을 맞춰 붙여야 하며, 같은 빅카인즈 주제별 메타데이터와 나란히 비교하는 방식이 현실적이다.
