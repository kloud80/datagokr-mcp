description_portal: '도서관 정보  데이터는 도서관 홈페이지 DB 데이터로서 지역 내 도서관의 운영 실태와 시설·서비스 현황을 종합적으로 파악하여 시민에게 정확한 이용 정보를 제공하고, 도서관 정책 수립의 기초자료로 활용하기 위해 수집된 자료입니다. 이를 공공데이터로 개방함으로써 시민은 각 도서관의 정보 등 이용에 필요한 정보를 쉽게 확인할 수 있으며, 민간·연구기관은 도서관 인프라 분석, 접근성 연구, 서비스 개선 모델 개발 등 다양한 분야에서 활용할 수 있습니다. 공개되는 데이터에는 도서관코드, 도서관명, 주소, 전화번호 등의 항목이 포함됩니다. 이러한 자료는 도서관 이용 활성화와 시민 편의를 높이는 데 기여하며, 지역의 문화·교육 인프라를 강화하기 위한 정책적 판단에도 중요한 기반을 제공합니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시청 안중도서관(031-8024-8337)※ 홈페이지 URL : https://www.ptlib.go.kr/onebook/quizList.do'
