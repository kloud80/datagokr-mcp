summary_user: 경기도 내 관광지·관광단지·관광특구를 지정 건별로 담으며, 시군명, 관광지 구분, 지정일자와 지정면적, 조성계획 최초 승인일자와 면적, 운영주체, 지번·도로명 주소, 위경도 좌표를 포함한다. 지역 관광정책 담당자나 분석가가 '경기도 시군별로 지정 관광지·관광특구가 어디에 얼마나 넓게 지정돼 있는가'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 관광지명 매칭, 또는 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: '경기도 내 관광지, 관광단지, 관광특구 현황입니다. 관광지구분명, 관광지명, 위치 등의 정보를 제공합니다.-관광지: 자연적 또는 문화적 관광자원을 갖추고 관광객을 위한 기본적인 편의시설을 설치하는 지역-관광단지: 관광객의 다양한 관광 및 휴양을 위하여 각종 관광시설을 종합적으로 개발하는 관광 거점지역-관광특구: 외국인 관광객의 유치 촉진 등을 위하여 관광 활동과 관련된 관계 법령의 적용이 배제되거나 완화되고, 관광 활동과 관련된 서비스,안내체계 및 홍보 등 관광여건을 집중적으로 조성할 필요가 있는 지역이 데이터는 경기도 내 주요 관광지의 지정 현황과 조성계획 정보를 담은 자료로, 각 관광지의 구분(일반 관광지/관광특구), 지정일자, 최초 조성계획 승인일자, 지정면적 및 조성계획면적, 운영주체(시군 단체장), 위치정보(지번주소 및 도로명주소), 우편번호, 위경도 좌표(WGS84) 등을 포함합니다. 관광지는 일반적인 명소 외에도 관광특구로 지정된 지역이 포함되어 있으며, 지역관광 활성화, 관광 인프라 개발, 지역경제 진흥 정책 수립을 위한 핵심 자료로 활용될 수 있습니다. 예를 들어, 고양시 한류월드 관광특구, 동두천시 소요산 관광특구 등은 전략적으로 조성된 관광 허브로 분류되며, 면적 규모와 조성계획에 따라 관련 인프라 개발이 연계됩니다. 이 데이터는 관광산업 정책 개발, 지역별 관광지 분포 분석, 시설 투자 우선순위 평가, 관광객 유입 경로 분석(GIS 기반) 등에 활용할 수 있으며, 경기도 및 문화체육관광부 관련 부서에서 수집한 공공데이터입니다.'
