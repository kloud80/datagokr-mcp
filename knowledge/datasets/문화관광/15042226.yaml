description_portal: 본 데이터는 경기도 광주시 공간정보시스템에 등록된 호수의 위치 정보를 제공합니다. 광주시 내 자연 호수와 인공 호수 등 수자원 시설의 지리 정보를 담고 있어 환경 관리와 공간 계획에 활용됩니다. 지형지물부호는 호수를 식별하는 지형 분류 코드이며, 경도와 위도는 호수의 정확한 지리 좌표를 제공합니다. 지번주소는 호수가 위치한 토지의 주소 정보를 나타냅니다. 본 데이터는 수자원 관리, 환경 보전 계획, 친수 공간 조성, 생태 환경 분석, 지리 정보 시스템 구축 등에 활용되며 자연 환경 보호와 지속 가능한 수자원 관리를 지원합니다.
