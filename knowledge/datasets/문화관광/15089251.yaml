summary_user: 인천광역시 부평구에 있는 무도학원업소(태권도·합기도·검도 등)를 업소 한 곳당 한 행으로 담은 명부로, 업종·상호·도로명/지번 주소·위도·경도·전화번호·데이터기준일을 수록한 작은 CSV 파일(552 bytes)이다. 학부모나 지역 생활체육 담당자가 '우리 동네 근처에 어떤 무도학원이 어디에 있나'를 확인하거나, 업종별 분포와 생활권 접근성을 살피는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소·상호를 매핑하거나 위도·경도로 공간 결합해 이어 쓰며, 같은 축의 체육시설업 인허가·상권 데이터와 함께 보는 것이 자연스럽다.
description_portal: '무도학원업소의 업종, 상호, 소재지 주소, 전화번호 등을 수록한 데이터.태권도, 합기도, 검도 등 다양한 무도 관련 학원의 분포 현황을 파악하고, 청소년 체육 진흥, 건전한 여가활동 지원, 지역 생활체육 활성화 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 무도학원업 등록 현황 및 업종별 분포 분석– 학원 소재지 기반 입지 특성 및 생활권 접근성 파악– 청소년 체육 교육 및 지역 생활체육 활성화 자료 활용– 건전한 여가·체육 활동 지원 정책 근거 제공주요 항목 설명● 연번: 데이터의 고유 번호● 업종: 무도학원의 업종 구분(태권도, 합기도 등)● 상호: 등록된 무도학원의 명칭● 소재지주소: 학원이 위치한 도로명 주소● 전화번호: 학원 문의 및 연락을 위한 전화번호'
