description_portal: '성남미디어센터 장비대여 정보는 시민의 미디어 창작활동을 지원하기 위해 제공되는 각종 영상장비의 대여 현황과 이용 관련 데이터를 포함한 자료입니다. 이 데이터에는 장비의 명칭(예: 카메라, 삼각대, 조명, 마이크, 편집용 노트북 등), 제조사, 사양, 수량 등의 항목이 포함됩니다. 장비는 센터의 미디어교육 수강자, 창작자, 시민 영상동아리 등이 사용할 수 있도록 운영되며, 대여 절차는 사전 예약, 현장 수령, 기한 내 반납의 방식으로 관리됩니다. 이 데이터는 시민의 창작 수요를 분석하거나, 장비 유지·보수 계획 수립, 구매 우선순위 조정, 대여 정책 개선 등의 행정 목적에도 활용됩니다.'
