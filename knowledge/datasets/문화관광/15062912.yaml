summary_user: 경상남도 내 지방문화원별로 명칭, 시군구, 도로명주소, 대표자, 전화·팩스, 홈페이지를 담는 기관 단위 목록 데이터이며, 범위는 경상남도 한 시도이고 개별 기관 주소 수준이다. 주민이나 문화 분야 분석가가 '우리 시군에 있는 문화원은 어디이고 연락처는 무엇인가'를 확인하거나, 도내 지역 문화시설 분포를 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 문화시설 데이터(문화기반시설총람의 시설코드 등)와는 문화원 이름이나 시군구명을 맞춰 연결해야 한다.
