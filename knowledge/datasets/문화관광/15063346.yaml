description_portal: 이 데이터셋은 서대문형무소역사관 소장 유물을 3D로 촬영하여 복원한 이미지 자료를 제공하고 있습니다. 주요 컬럼에는 분류, 제공처, 데이터명, 설명, 원본파일형태, 파일확장자, 생성일, 주소 등이 포함되어 있습니다. 복원된 3D 이미지는 역사 교육, 전시 기획, 디지털 콘텐츠 제작, 문화유산 연구 등 다양한 분야에서 활용할 수 있습니다. 모든 자료는 공공누리 제1유형(출처표시) 조건에 따라 자유롭게 이용할 수 있습니다. 그뿐만 아니라, 이 데이터 셋은 주기적으로 갱신되어 최신 복원 자료를 제공합니다.
