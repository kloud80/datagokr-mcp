summary_user: 서울 중구의 인쇄사 인허가 정보를 업소별로 담은 데이터로, 관리번호·인허가일·영업상태(영업/폐업 등)·폐업일·소재지 지번·도로명 주소·중부원점TM 좌표·시설면적·층수·주변환경 등을 담는다. 인쇄소 창업을 준비하는 예비 사업자가 중구 안에서 영업 중인 인쇄사가 어디에 얼마나 몰려 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)나 주소·업소명 매핑으로 이어 쓴다.
description_portal: '서울특별시 중구의 인쇄소 등 인쇄를 전문으로 하는 업소 정보입니다. 데이터는 각 등록업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화산업 및 미디어산업 분야의 인쇄사 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 인쇄시설 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 관련 업계 종사자 및 시민들에게는 법적 기준을 충족하며 출판문화 및 산업진흥에 기여하는 신뢰할 수 있는 등록업체의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
