summary_user: 충청북도 아키비움 누리집이 관리하는 도내 문화유산(유형·무형유산, 실록, 민간기록물 등) 목록 일부를 문화재 한 건당 한 행으로 담은 CSV 파일(약 238KB)로, 문화재명·구분·지정번호·등록일·한문·영문명·재료·형식·크기·수량·면적 등을 담는다. 연구자나 도민이 '충북에 어떤 지정문화재가 있고 각각의 재료·규모·지정 시기는 어떤가'를 확인하거나, 지정·보존 업무의 기초자료로 쓴다. 전역 조인 키가 없어 국가유산청 자료와는 문화재명이나 지정번호를 기준으로 이름·번호 매칭해 이어 써야 하며, 국가유산청의 종목코드·지정번호 체계와 바로 맞물리지 않는다.
description_portal: 이 자료는 충청북도역사문화연구원이 운영하는 충청북도 아키비움 누리집에서  관리하는 문화재 목록 중 일부로, 도내 유형유산·무형유산·실록·민간기록물 등 다양한 문화유산의 기본 정보를 정리해 제공합니다. 각 문화재에 대해 문화재명, 구분, 지정번호, 등록일, 한문·영문 표기, 재료와 형식, 규모, 수량 등 행정 관리에 필요한 항목들이 포함되어 있습니다.이를 통해 문화재 지정·보존·활용 업무를 수행하는 과정에서 기초자료로 활용할 수 있으며, 도민에게는 지역 문화유산의 현황을 투명하게 공개하는 역할을 합니다.
