      - name: MobileApp
        required: true
        desc: 서비스명(어플명)
      - name: baseYm
        required: true
        desc: '조회 기준 연월 (형식 : YYYYMM)'
      - name: areaCd
        required: true
        desc: 지역 코드 (지역/시군구 코드 파일 참고)
      - name: signguCd
        required: false
        desc: 시군구 코드 (지역/시군구 코드 파일 참고)
      - name: culResDemIxCd
        required: false
