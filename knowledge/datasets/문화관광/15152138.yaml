summary_user: 관광 빅데이터(카드·통신·내비게이션)로 만든 관광수요지수 중 관광 서비스 수요(SNS 언급량·업종별 소비액·목적지 검색량)와 문화 자원 수요를 시군구 단위로 담은 집계 데이터이다. 지자체 담당자나 분석가가 특정 시군구의 관광 수요 세부 지표가 기준 연월마다 어떻게 달라지는지 볼 때 쓴다. 시군구 코드(signguCd, 키 sgg_cd)로 다른 지역 데이터와 잇고, 필수 파라미터인 지역 코드(areaCd)는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 본 API는 한국관광공사 한국관광데이터랩의 관광수요지수(https://datalab.visitkorea.or.kr/datalab/portal/loc/getTourActivateForm.do)에서 제공하는 관광 자원 수요 정보를 제공합니다.관광 자원 수요는 관광 빅데이터(신용카드, 이동 통신, 내비게이션)를 활용하여 해당 지역의 관광 산업 수요 활성화 정도를 평가하는 지수인 관광 수요 지수를 구성하는 지표 중 하나입니다. 관광 서비스 수요(유형별 SNS 언급량, 업종별 관광 소비액, 내비게이션 유형별 목적지 검색량), 문화 자원 수요(내비게이션 유형별 목적지 검색량) 등 세부 지표로 구성되어 있으며 각 세부 지표별 하위 지표의 평균값을 보여줍니다.- 개방데이터는 지역별 관광 서비스 수요 정보, 지역별 문화 자원 수요 정보 조회 기능 총 2종으로 구성되어 제공합니다.- 개방데이터는 홍보물, 잡지 등 다양한 매체에서 활용할 수 있으며, 모바일 앱, 웹 서비스 등 신규/융복합 관광 서비스 개발에도 활용할 수 있습니다.
team:
  dept: AI인프라센터
services:
  - op: /areaTarSvcDemList
    name: 지역별 관광 서비스 수요 정보 목록 조회
    endpoint: https://apis.data.go.kr/B551011/AreaTarResDemService/areaTarSvcDemList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: false
        example: '10'
        desc: 한 페이지 결과 수
      - name: pageNo
        required: false
        example: '1'
        desc: 현재 페이지 번호
      - name: MobileOS
        required: true
        example: ETC
        desc: 'OS 구분 : IOS (아이폰), AND (안드로이드), WEB (웹사이트), ETC'
      - name: MobileApp
        required: true
        example: AppTest
        desc: 서비스명(어플명)
      - name: baseYm
        required: true
        example: '202509'
        desc: '조회 기준 연월 (형식 : YYYYMM)'
      - name: areaCd
        required: true
        example: '11'
        desc: 지역 코드 (지역/시군구 코드 파일 참고)
      - name: signguCd
        required: false
        example: '11530'
        desc: 시군구 코드 (지역/시군구 코드 파일 참고)
      - name: tarSvcDemIxCd
        required: false
        example: '1101'
        desc: '관광 서비스 수요 지표 코드 (11 : 전체, 1101 : 레포츠 SNS 언급량, 1102 : 휴식 힐링 SNS 언급량, 1103 : 미식 SNS 언급량, 1104 : 체험 SNS 언급량, 1105 : 쇼핑업 소비액, 1106 : 식음료 소비액, 1107 : 숙박업 소비액, 1108 : 여가 서비스업 소비액, 1109 : 운송업 소비액, 1110 : 내비게'
      - name: _type
        required: false
        example: json
        desc: '응답 메세지 형식 : REST 방식의 URL 호출 시 json값 추가(디폴트 응답 메세지 형식 XML)'
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 1000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /areaCulResDemList
    name: 지역별 문화 자원 수요 정보 목록 조회
    endpoint: https://apis.data.go.kr/B551011/AreaTarResDemService/areaCulResDemList
