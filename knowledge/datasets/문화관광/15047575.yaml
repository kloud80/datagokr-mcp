summary_user: 2010년부터 2023년까지 연도별 국내 잡지산업 전체 매출액(억원)과 1개사 평균 매출액(백만원)을 담은 전국 단위 집계 파일로, 2024 잡지산업 실태조사 결과에서 나온 자료다. 출판·미디어 분석가나 정책 담당자가 '최근 10여 년 동안 잡지산업 시장 규모와 사업체당 매출이 어떻게 변했나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 연도(구분) 기준으로 맞춰 붙여 쓰며, 같은 실태조사의 다른 통계표나 정기간행물 등록 현황과 나란히 놓고 비교한다.
limits: 전국 합계와 평균만 담고 있어 지역별·사업체별·잡지 분야별 매출은 알 수 없다. 코드나 키 컬럼이 없어서 다른 데이터와 연결하려면 연도나 명칭을 직접 맞춰야 한다.
