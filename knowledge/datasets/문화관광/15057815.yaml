summary_user: 경기도 내 일반 여행업체의 인허가 현황을 사업장 한 곳당 한 행으로 담는 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·WGS84 좌표·자본금·보험 가입 기간 등을 포함한다. 여행사 창업을 검토하는 사업자나 지역 관광정책 분석가가 '우리 시군에 영업 중인 여행사가 몇 곳이고 어디에 몰려 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·사업장명·주소로 경기도의 다른 관광사업 등록 데이터와 맞추고, 좌표로는 지도·상권 데이터와 공간 결합한다.
description_portal: 이 데이터는 경기도 내 일반 여행업체의 인허가 현황을 제공하며, 일반 여행업체는 국내외 여행객을 대상으로 일정 기획, 숙박 예약, 관광 안내, 비용 산출 등 여행 관련 서비스를 제공하는 사업체를 포함합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘WGS84 위도·경도’, ‘업태구분명’, ‘문화체육업종명’, ‘자본금’, ‘보험기관명 및 보험기간’, ‘객실수’, ‘회의실 수용인원’, ‘부대시설 내역’, ‘놀이시설수’, ‘좌석수’ 등이 있습니다. 이를 통해 여행사의 위치, 운영 상태, 시설 규모, 보험 가입 현황, 부대시설 보유 여부를 종합적으로 확인할 수 있으며, 경기도 31개 시군 단위의 여행업 분포와 현황을 분석할 수 있습니다. 데이터는 관광산업 정책 수립, 지역 여행업 관리, 서비스 품질 평가, 여행 산업 활성화 전략 마련 등에 활용 가능하며, 국내외 관광객 동향 분석과 여행업 시장 변화 추적에도 기여할 수 있습니다.
