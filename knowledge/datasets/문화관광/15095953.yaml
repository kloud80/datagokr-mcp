summary_user: 대구광역시 북구 관내에 등록된 국내외여행업 사업체를 업체 한 곳당 한 건으로 담으며, 상호·직종명·도로명주소·전화번호를 제공한다. 북구에서 해외·국내 여행 상품을 다루는 여행사를 찾는 주민이나, 지역 여행업체 분포를 파악하려는 분석가가 '북구에 국내외여행업으로 등록된 여행사는 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호 이름이나 도로명주소 매핑으로만 이어 쓰며, 같은 기관의 다른 관광사업 데이터와 나란히 보는 정도로 연결한다.
limits: 여행업 중 국내외여행업만 담으므로 종합여행업·국내여행업은 포함되지 않고, 범위는 대구 북구 한 곳으로 한정된다. 등록번호·사업자번호 같은 공통 키가 실측 컬럼에 없어 다른 등록 원장과 정확히 매칭하기 어렵다. 개발계정은 일 10,000회 호출 제한이 있고 동시 접속 수 제한도 있다.
