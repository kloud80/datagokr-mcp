summary_user: 제주올레길 1코스 휠체어 구간(종달리) 주변의 음식점·카페·편의점·숙박시설·관광지를 시설 한 곳당 한 행으로 담은 목록으로, 시설 구분과 명칭, 코스로부터의 거리(km), 주소, 전화번호, 휠체어 진입 가능 여부, 장애인 화장실 여부가 들어 있다. 휠체어 이용자나 유모차를 끄는 가족이 종달리 올레길을 걸으면서 들를 수 있는 식당·화장실·숙소를 미리 확인하거나, 지자체가 무장애 관광 지도를 만들 때 쓴다. 실측 컬럼에 전역 조인 키(TourAPI contentId 등)가 없어서, 다른 관광 데이터와는 시설 명칭이나 주소를 맞대어 이어 써야 한다.
description_portal: '"제주특별자치도 내 제주올레길1코스(휠체어구간)종달리_무장애주변관광지 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도 종달리 지역 내 제주올레길1코스(휠체어구간) 주변의 무장애 관광시설 정보를 체계적으로 정리한 통계자료입니다. 본 자료에는 음식점, 카페 및 편의점, 숙박시설, 관광지 등 다양한 시설의 명칭, 거리, 주소, 연락처, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등이 포함되어 있어 장애인·노약자·영유아 동반 가족 등 이동과 이용에 제약이 있는 관광약자들의 방문 여건을 객관적으로 확인할 수 있습니다. 또한 해당 정보는 무장애 관광 지도 제작, 관광서비스 접근성 개선, 관광정책 수립 및 평가 등 행정 및 관광서비스 분야에서 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
