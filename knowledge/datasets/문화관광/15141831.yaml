summary_user: 서울특별시 용산구의 복합유통게임제공업(PC방·멀티방 등) 인허가 정보를 사업장 단위로 담으며, 인허가·취소 일자, 영업상태, 폐업일자, 소재지 주소, 좌표, 시설 현황 항목이 포함된다. 창업 예정자나 분석가가 '용산구에서 현재 영업 중인 멀티방·PC방형 게임업소가 어디에 얼마나 있고, 언제 문을 열고 닫았는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 다른 자치구 인허가 데이터 등과 이어 쓴다.
description_portal: 복합유통게임제공업은 일반적인 오락실 형태의 게임제공업과 달리, PC방·멀티방 등과 같은 유통시설 내에서 여러 형태의 게임을 함께 제공하는 업종을 말합니다. 해당 업종은 청소년 보호, 이용자 안전, 건전한 게임 문화 조성을 위해 「게임산업진흥에 관한 법률」에 따라 반드시 관할 구청장의 인허가를 받아야 영업이 가능합니다. 인허가 신청을 위해서는 사업장 건축물 용도 적합 여부 확인, 소방·위생·환경 등 관계 법령 준수, 청소년 출입 및 고용 관련 규정 이행이 필수적입니다. 또한 업주는 신원조회 및 범죄경력 확인 절차를 거쳐야 하며, 사업장 내에는 청소년 유해 게임물 제공 금지, 불법 사행성 게임기 운영 금지, 영업시간 준수 등 의무사항을 지켜야 합니다. 위 규정을 위반할 경우 행정처분, 과태료, 허가 취소 등의 제재를 받을 수 있습니다. 구청은 인허가 접수부터 현장 실사, 허가증 교부까지 전 과정을 투명하게 진행하며, 이를 통해 지역 내 건전한 여가 문화 공간을 확산하고 불법 게임 영업을 예방하고 있습니다.
