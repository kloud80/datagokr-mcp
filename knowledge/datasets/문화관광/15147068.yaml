summary_user: 서울 강서구 관내 체육도장업(태권도·유도·검도 등 무도 도장)의 인허가 건을 업소 단위로 담으며, 인허가일·취소일·영업상태·폐업일·휴업기간·소재지 주소·좌표·상호·지도자 수 등을 포함한다. 강서구에 영업 중인 도장이 어디에 몇 곳 있는지, 최근 어떤 도장이 폐업했는지를 확인하려는 학부모·창업 예정자나 생활체육·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·개방자치단체코드 같은 기관 내부 코드나 주소·상호 매칭으로만 이어 쓰며, 같은 LOCALDATA 체계의 다른 체육시설업 인허가 데이터와 같은 축으로 묶어 본다.
description_portal: 서울시 강서구 관내 체육도장업에 대한 인허가 정보를 담고 있습니다. 체육도장업은 태권도, 유도, 검도 등 무도 종목을 중심으로 체력단련과 정신 수양을 위한 시설 운영을 목적으로 하며, 어린이와 청소년의 인성 교육 및 건강한 신체 발달을 돕는 중요한 사회적 기능을 수행합니다. 본 데이터에는 인허가 일자, 상태 구분, 폐업 여부, 상세 영업 형태 등의 정보가 포함되어 있어 관련 행정자료 구축, 청소년 체육교육 정책 수립, 민간 체육시설 분석, 체육지도자 인프라 관리 등에 활용될 수 있습니다. 체육도장 수요 파악 및 지역별 균형 정책에도 활용도가 높습니다.
