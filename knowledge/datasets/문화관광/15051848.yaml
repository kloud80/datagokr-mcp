description_portal: 서울시 독서실태조사 데이터는 시민들의 독서 행태와 문화활동 참여 양상을 파악하기 위해 구축된 조사 기반 자료입니다. 성별, 연령, 학력, 직업 등 인구사회학적 특성과 함께 연간 독서량, 독서 유형(종이책·전자책·오디오북 등), 도서 선호 형태, 도서 이용 방식 등 주요 독서 지표를 포함합니다. 또한 도서관 이용 여부, 문화프로그램 참여 경험, 도서관 선택 이유 같은 항목을 통해 시민의 독서 환경과 문화 향유 수준을 종합적으로 분석할 수 있습니다. 이 데이터는 독서 문화 정책 수립, 도서관 서비스 개선, 시민 독서 활성화를 위한 기초 자료로 활용됩니다.
