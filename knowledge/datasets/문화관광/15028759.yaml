summary_user: 경상북도에서 등록되어 운영 중인 골프장을 한 곳당 한 행으로 담은 명부 파일(CSV, 약 6KB)로, 골프장명·운영 업체명·등록번호·업종·면적(㎡)·승인일·등록일·위치·전화번호가 들어 있습니다. 레저 산업 분석가나 지역 정책 담당자가 '경북 시군별로 운영 중인 골프장이 어디에 몇 곳 있고 규모는 얼마인가'를 확인하는 데 씁니다. 전역 조인 키가 없어 다른 체육시설업 인허가 자료나 상권 데이터와는 골프장명·업체명 같은 이름이나 위치(주소) 문자열을 맞춰서 연결합니다.
description_portal: 본 데이터는 운영 중인 골프장의 현황에 대한 상세 정보를 제공합니다. 이는 경상북도 내에서 정식으로 등록 및 운영 허가를 받아 영업 중인 골프장 시설의 기본 정보, 규모, 그리고 행정 관리 이력을 파악하는 데 목적이 있습니다. 이 데이터는 체육 시설 이용 현황 및 레저 산업 분석을 위한 기초 자료로 활용됩니다.주요 내용으로는 시설의 구분 정보와 공식 명칭인 골프장명, 그리고 실제 운영 주체인 업체명이 기록되어 있습니다. 시설의 공식 등록 번호인 등록번호와 업종 정보가 포함되어 있어 사업체의 성격을 명확히 알 수 있습니다. 시설의 규모를 정량적으로 파악할 수 있도록 면적 정보가 제공됩니다.또한, 시설 운영의 행정 이력을 알 수 있는 승인일과 등록일 정보가 포함됩니다. 이용자 접근성을 위한 위치 정보와 문의를 위한 전화번호 정보도 제공됩니다. 이 자료는 지역 체육 시설 인프라 분석, 레저 관광 산업 활성화 정책 수립, 그리고 골프장 이용자 및 관련 연구자에게 유용한 기초 자료로 활용됩니다.
