summary_user: 부산광역시 안의 재래시장·백화점·아울렛·면세점·선물가게·먹거리 명소 등 쇼핑 장소를 장소 한 곳당 한 건으로 담고, 구군·주소·좌표(LAT, LNG)·연락처·운영시간·휴무일·교통정보·이미지·상세설명을 함께 제공한다. 부산 관광객이나 시민이 '해운대구에서 주말에 문을 여는 시장이나 선물가게는 어디이고 어떻게 가는가'를 찾을 때, 또는 관광 앱 개발자가 쇼핑 명소를 지도에 올릴 때 쓴다. 전역 조인 키가 없어 TourAPI 콘텐츠나 다른 기관 데이터와는 장소명·주소 매칭이나 좌표 근접 비교로 연결해야 하고, 구군명(GUGUN_NM)으로 부산 구·군 단위 데이터와 묶어 볼 수 있다.
limits: TourAPI의 contentId 같은 공통 식별자가 없어 다른 관광 데이터와 자동으로 정확히 연결되지 않고, 이름·주소 매핑이 필요하다. 범위는 부산광역시로 한정된다. 개발계정은 하루 10,000회까지 호출할 수 있다.
