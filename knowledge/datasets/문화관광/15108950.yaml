summary_user: 한국영상자료원 한국영화데이터베이스(KMDb)의 영화정보관리번호와 영화진흥위원회 통합전산망(KOBIS)의 FIMS 코드를 영화 한 편 단위로 짝지은 매핑표로, 영화명·제작연도·감독을 함께 담은 약 1MB 크기의 CSV 파일이다. KMDb의 작품 정보와 KOBIS의 박스오피스·상영 기록을 같은 영화로 묶어 분석하려는 분석가나 서비스 개발자가 '이 영화의 KMDb 번호에 해당하는 KOBIS 코드는 무엇인가'를 확인하는 데 쓴다. 이 파일은 그 자체로 두 체계를 잇는 다리 역할을 하며, KMDb 관리번호로 KMDb 자료를, FIMS 코드로 KOBIS 자료를 붙이되, 포털 전역에서 통용되는 공통 조인 키는 실측에서 확인되지 않았다.
limits: 포털 전체에서 쓰이는 전역 조인 키가 없어 KMDb·KOBIS 외의 데이터와는 영화명 등 이름 매핑으로만 연결해야 한다. 지역 구분이 없는 전국·비공간 자료라 상영 지역이나 관객 수 같은 실적 정보는 담지 않는다.
