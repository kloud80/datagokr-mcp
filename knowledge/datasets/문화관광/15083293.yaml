summary_user: 1988년부터 2024년까지 전국 건축물에 설치된 미술작품을 작품 한 점씩 담은 파일로, 설치일자·지역(시/자치구)·작품명·작가명·장르 분류·건축물명·주소·건축물 용도를 기록한다. 연구자나 지자체 담당자가 '어느 도시에 어떤 용도 건물에 조각·회화·미디어 작품이 얼마나 설치됐나' 같은 공공미술 분포와 추이를 분석하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 건축물주소나 지역 이름을 매핑해 이어 써야 한다.
description_portal: 이 데이터는 1988년부터 2024년까지 설치된 건축물미술작품에 대한 정보를 포함하고 있으며, 공공미술 정책의 흐름 및 도시별 예술 환경을 분석하는 데 유용한 자료입니다. 주요 구성 항목으로는 설치일자, 지역, 작품명, 작가명, 분류, 건축물명, 건축물주소, 건축물용도가 포함되어 있습니다. 설치일자는 '2024-12-31'과 같은 연-월-일 형식의 날짜로 되어 있으며, 지역은 '인천/서구'처럼 시와 자치구 단위로 표기되어 있어 지역별 분포 분석이 가능합니다. 분류는 조각, 회화, 미디어 등 작품의 예술 장르를 나타내며, 건축물용도는 공동주택, 업무시설, 운수시설, 숙박시설, 근린생활시설 등으로 다양하게 구성되어 있어, 공간적 특성과 예술작품의 연계성을 파악할 수 있습니다. 이 데이터는 예술작품과 도시건축 간의 상호작용을 파악하고, 공공미술 설치의 정책적 방향성을 도출하는 데 활용될 수 있습니다.
