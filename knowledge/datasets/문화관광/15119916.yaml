summary_user: 인천광역시 주요 관광지별 입장객 수를 군구·관광지·내외국인 구분으로 나눠 2023년과 2024년의 월별 값과 연 합계로 담은 집계 CSV 파일(약 12KB)이다. 인천 안에서 어느 관광지에 외국인 방문이 많은지, 계절에 따라 입장객이 어떻게 달라지는지 알고 싶은 관광 분석가나 지자체 담당자가 쓴다. 실측 컬럼에 관광지점코드나 시군구코드 같은 전역 조인 키가 없어서, 다른 관광 통계나 지역 데이터와는 군구명·관광지명을 이름으로 맞춰 이어 쓴다.
description_portal: '1. 사이트 : 인천투어(https://itour.incheon.go.kr/)2. 목록명: 시도, 군구, 관광지, 내외국인, 2023년 합계, 2024년 합계3. 데이터 설명인천광역시 주요관광지점 입장객 현황 데이터는 지역 관광 수요를 분석하고 정책 수립에 활용하기 위한 핵심 자료입니다. 본 데이터는 시도명, 군구명, 관광지명, 내·외국인 구분, 월별 입장객 수로 구성되어 있으며, 인천 내 주요 관광지(예: 송도 센트럴파크, 월미도, 강화도 등)의 방문 추이를 정량적으로 파악할 수 있습니다. 이를 통해 관광객의 계절별 이동 패턴, 외국인 관광객 유입 현황, 지역별 인기 관광지 등을 분석할 수 있으며, 관광 마케팅 전략 수립, 인프라 개선, 지역경제 활성화 등에 폭넓게 활용됩니다. 해당 데이터는 공공데이터포털에서 CSV 형식으로 제공되며, 누구나 자유롭게 다운로드하여 활용 가능합니다.'
