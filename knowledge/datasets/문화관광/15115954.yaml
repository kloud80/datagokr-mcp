description_portal: '서울특별시 중구의 버스를 이용하여 관광객에게 시내와 그 주변 관광지를 정기적으로 순회하면서 관광을 제공하는 업소 정보입니다. 각 등록업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 도시여행 및 운송사업 관련 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 운행노선 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 탑승객 및 시민들에게는 안전관리 기준을 충족하며 차량운영을 하는 신뢰할 수 있는 운송사업체를 확인할 수 있도록 투명한 정보를 제공하여 관광진흥에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
