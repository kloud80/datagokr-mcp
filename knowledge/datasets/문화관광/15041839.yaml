summary_user: 환경부가 지정한 국가생태탐방로를 탐방로 한 곳당 한 행으로 정리한 전국 범위 파일(CSV 약 191KB)로, 탐방로 소개, 최대 3개 경로 설명, 추천 체험·해설 프로그램, 지역정보 홈페이지, 주변 탐방로를 담는다. 국민이나 여행 콘텐츠 사업자가 '이 지역 국가생태탐방로에는 어떤 코스와 체험 프로그램이 있고 근처에 이어 걸을 탐방로는 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 탐방로 이름(생태탐방로 이름)으로 TourAPI 관광 콘텐츠의 코스·관광지 정보와 이름 매칭해 이어 쓴다.
description_portal: 환경부는 점차 심화되는 도시화와 여가문화의 확산 등으로 생태 탐방 수요가 지속적으로 증대함에 따라 국립공원 등 우수한 자연자원, 문화⋅역사자원이 있는 일부 지역에 탐방객이 집중되는 것을 최소화하기 위해 2008년부터 국가생태탐방로를 조성해왔습니다. 그 지역의 자연과 문화, 역사를 효과적으로 체험할 수 있는 길들을 선택적으로 발굴하여 조성·관리하고 탐방 자원에 대한 체계적인 보호·복원 관리를 통해 지속 가능한 이용을 도모하였습니다. 환경부 지정 국가생태탐방로 추천 코스 정보,  해당 탐방로 추천 포인트 정보, 기타 추가 정보(숙박, 쇼핑, 교통 등) 등을 제공하고 있습니다.
