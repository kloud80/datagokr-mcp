summary_user: 대구광역시 도시공원에 설치된 야외운동기구를 기구 한 대 단위로 담은 건별 파일로, 기구명·동시사용인원·설치일·시설상태·수리필요 여부·KC인증 유무·크기와 공원명, 주소·위도·경도, 제조사 정보가 들어 있다(CSV 약 612KB). 주민이 '우리 동네 공원에 어떤 운동기구가 있나'를 찾거나, 관리 담당자·분석가가 수리가 필요하거나 KC인증이 없는 기구가 어느 공원에 몰려 있는지 파악하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 공원명·공원관리번호, 행정동이나 주소 이름 매핑, 위도·경도 좌표로 이어 붙인다.
description_portal: 이 데이터는 도시공원 내 설치된 운동시설물에 대한 정보로, 이 데이터에는 시민들이 자유롭게 이용할 수 있는 운동시설의 위치, 종류, 규모, 운영 시간 등의 정보를 포함하고 있습니다. 주요 항목으로는 시설명, 주소, 설치 유형(운동기구, 농구대, 배드민턴장 등), 설치일자, 관리기관 연락처 등이 있으며, 이를 통해 지역 주민들은 주변 운동시설을 쉽게 찾고 활용할 수 있습니다. 건강 증진을 위한 도시 인프라 활용도를 높이고, 지역 사회의 삶의 질 향상에 기여하며, 공공기관, 연구기관 등에서도 유용하게 사용할 수 있는 개방형 자료입니다.
