description_portal: 본 데이터는 전북특별자치도의 청렴 및 반부패 업무를 담당하는 전담 인력의 현황과 역할 분담을 보여주는 자료입니다. 감사총괄팀 소속 직원들의 직급과 함께, 반부패 청렴업무 총괄, 부패영향평가, 공무원 행동강령 관리 등 각자가 맡은 세부 업무 내용을 상세히 기술하고 있습니다. 이 자료는 지방자치단체의 청렴도 향상과 투명성 강화를 위한 내부 조직 체계와 인력 구성을 명확하게 보여줍니다. 도민과 외부 기관이 반부패 정책의 책임 소재와 추진 구조를 이해하고, 행정의 신뢰도를 평가하는 데 중요한 참고 자료가 될 수 있습니다.
