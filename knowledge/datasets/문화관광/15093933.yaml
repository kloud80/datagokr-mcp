summary_user: 국립박물관문화재단의 박물관 상품 브랜드 뮷즈(MU:DS) 판매 정보를 상품 단위로 담은 파일로, 상품명·판매가·소분류(상품 종류)가 들어 있다. 박물관 굿즈를 기획하는 사업자나 문화상품 분석가가 "어떤 종류의 박물관 상품이 어느 가격대로 팔리고 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 데이터와는 상품명·분류명을 직접 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 국립박물관문화재단 박물관상품 판매 정보로, 상품명(문자형), 판매가(숫자형), 소분류(문자형)항목을 포함하고 있습니다.뮷즈(MU:DS)란 국립박물관이 소장한 문화유산을 모티브로 많은 사람들이 일상에서 가깝게 느끼고 사용할 수 있도록 만든 국립박물관문화재단의 박물관 상품 브랜드로 박물관 문화유산의 고유한 가치에 오늘날의 쓰임새를 더해 유물을 소장하는 즐거움을 제공하고 박물관에서의 좋았던 순간을 일상에서 두고두고 이어가고 싶은 마음을 채웁니다.데이터를 통해 분기별 인기상품 추이를 한번에 확인할 수 있습니다.해당 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 문의해주시기 바랍니다.
