summary_user: 제주 한림읍 귀덕리 리사무소에서 라신동까지 이어지는 마을길 무장애 여행코스를 지점 단위로 담는다. 각 행은 순서, 위도·경도, 구분, 설명, 상세정보, 전체코스·추천코스 여부로 이루어져 있다. 휠체어 이용자나 교통약자 동반 여행객이 "귀덕마을길을 걸을 때 어느 지점에 쉼터·편의시설이 있고 동선은 어떻게 되나"를 확인하는 데 쓰고, 열린관광지 정책 담당자는 무장애 관광환경 점검 자료로 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도 좌표나 지점 이름을 맞춰 연결해야 하며, TourAPI 관광 콘텐츠와도 같은 방식으로만 이어 쓸 수 있다.
description_portal: '"제주특별자치도 내 제주특별자치도_귀덕마을길(리사무소-라신동)_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 귀덕리의 리사무소 지점부터 라신동까지 이어지는 마을길을 대상으로 한 무장애 여행 코스 정보를 제공합니다. 해당 코스는 교통약자 및 휠체어 이용자의 이동 편의를 고려하여 설계되었으며, 이동 동선, 접근 가능한 지점, 휴식 공간 및 편의시설 등의 정보를 포함하고 있습니다. 더불어 노면 상태, 경사도, 보행환경, 주차·화장실 접근성 등 실제 이용 여건을 반영하여 무장애 관광환경 조성, 열린관광지 확대, 관광서비스 개선 및 정책 수립 등에 활용될 수 있는 기초자료로 제공됩니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
