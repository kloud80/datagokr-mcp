summary_user: 경기도 가평군 주요 관광지를 한 곳당 한 행으로 담은 지자체 관광지 목록 파일(CSV, 약 20KB)로, 관광지 구분·이름·읍면동·도로명/지번 주소·위경도·상세설명·전화번호·URL을 담는다. 가평 여행을 계획하는 사람이나 관광 안내 서비스를 만드는 사업자가 '가평 어느 읍면에 어떤 관광지가 있고 지도상 어디에 있나'를 확인하고 동선을 짜는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, TourAPI 관광 콘텐츠 같은 전국 원장과는 관광지명·주소를 맞추거나 위경도로 가까운 지점을 찾아 이어 쓴다.
limits: 전역 조인 키(TourAPI contentId·지역코드 등)가 없어 다른 데이터와 붙일 때 이름·주소 매칭에 기대야 한다. 가평군 한 시군구만 다루므로 다른 지역이나 전국 비교에는 TourAPI 같은 전국 데이터를 대표로 쓴다.
