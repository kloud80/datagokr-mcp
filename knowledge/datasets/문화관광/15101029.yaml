summary_user: 대구 달서구 안의 경로회관·복지관·학교·공원·산책로 등에 설치된 간이 운동시설을 시설물 단위로 정리한 파일(CSV, 약 36KB)로, 시설명·위치·새주소·위경도·시설물명·수량·조성년도·제작사·행정동·관리부서를 담는다. 달서구 주민이 우리 동네 공원에 어떤 야외운동기구가 몇 개 있는지 찾거나, 분석가가 행정동별 운동기구 분포와 노후(조성년도) 현황을 살피는 데 쓴다. 전역 조인 키는 없어 행정동 이름이나 주소·좌표를 기준으로 다른 체육시설·인구 자료와 맞춰 붙여야 한다.
