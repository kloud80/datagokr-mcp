summary_user: 충청북도 내 영화상영관을 한 곳당 한 행으로 담은 목록 파일로, 영화관명·소재지·전화번호·상영관수·좌석수를 담는다. 주민이나 지역 문화 분석가가 "우리 시·군에 영화관이 몇 곳이고 좌석 규모는 어느 정도인가"를 확인하거나 시·군별 상영 인프라를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 영화관명이나 소재지 주소를 이름·주소 매칭으로 맞춰 이어 써야 한다.
limits: 공통 식별 코드가 없어 공연시설·문화시설 데이터와 연결할 때 이름·주소 매칭에 의존해야 한다. 범위는 충청북도 한 개 시도의 개별 영화관으로 한정되며, 상영 영화나 관객 수 같은 운영 실적은 담지 않는다.
