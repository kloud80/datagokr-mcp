summary_user: 올림픽공원과 미사경정공원의 연·월별 입장객 수와 출입차량(주차) 수 같은 운영현황을 담은 집계 자료로, 포털 설명상 2013년부터 2025년 6월 기준 584건이 제공된다. 공원 운영 분석가나 방문 계획자가 '올림픽공원 방문객이 어느 달에 가장 많은가', '주차 수요가 연도별로 어떻게 변했나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 시설명·기간 같은 이름 매핑이나 같은 기관(한국체육산업개발) 자료끼리만 이어 쓴다.
description_portal: 올림픽공원 및 미사경정공원 주차장 및 입장객 운영현황 제공하고 있으며,  올림픽공원 및 미사경정공원에 방문한 연, 월별 주차 수 및 입장객 수 등에 대한 정보제공를 제공하고 있습니다.한국체육산업개발 홈페이지에 들어오시면 알림홍보>연차보고서에도 정보를 확인하실수 있습니다.https://www.ksponco.or.kr/gallery.es?mid=a10308020000&bid=0034올림픽수영장, 스포츠센터, 분당 및 일산 스포츠센터 등 운영현황을 자세하게 제공해주고 있습니다2025년 6월 기준 총 584건을 제공하고 있으며, 2013년부터 올림픽공원 및 미사경정공원 입장객 수 , 출입차량 수 등 정보를 제공하고 있습니다.
