description_portal: '대구광역시 북구의 유형별 주요관광지(북구8경, 자연경관, 체험관광, 전통시장, 문화예술공간 등)에 대한 데이터로주요 관광지의 일반현황(관광지명, 주소 등), 입장료, 휴무일, 영업시간, 영업일 등의 항목을 제공합니다.1. 북구8경 : 금호강하중도, 꽃보라동산, 운암지수변공원, 팔달대교 야경, 경북대학교 캠퍼스, 함지공원, 구암서원, 침산정2. 자연관광 : 서리지수변생태공원, 대구에스파스3. 체험관광 : 별별상상이야기관, 신전뮤지엄, 금호강오토캠핑장, 대구국제사격장, 칠곡향교 등4. 전통시장 : 동대구시장, 칠성시장, 팔달시장, 별별상상칠성야시장 등5. 문화예술공간 : 대구오페라하우스, 어울아트센터, 경북대학교 박물관, 북구 청소년회관 등6. 북구의길 : 금호강변자전거길, 이인성사과나무길, 안경특화거리, 이태원길7. 기타 : 연암서당골, 삼성창조캠퍼스, 광해군태실, 삼성상회터 등'
