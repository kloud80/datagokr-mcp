summary_user: 대구광역시 북구의 주요 관광지(북구8경, 자연관광, 체험관광, 전통시장, 문화예술공간, 북구의 길 등)를 한 곳당 한 행으로 담은 지자체 관광지 목록 파일로, 관광지명·주소·좌표·입장료·휴무일·영업시간·영업일·관광종류를 담는다. 북구에서 쉬는 날 없이 무료로 갈 수 있는 체험관광지나 전통시장이 어디인지, 운영 시간은 언제인지 찾는 주민·여행객·여행 앱 개발자가 쓴다. 전역 조인 키가 없어 관광지명으로 TourAPI 관광지 원장과 맞추거나, 위도·경도로 지도·주변 시설 데이터와 공간 결합해 쓴다.
