summary_user: 전국에서 운영 중인 작은도서관을 도서관 한 곳당 한 행으로 담은 건별 목록으로, 도서관명·주소·운영주체(공립·사립)·도서수·개관년도를 싣고 전체 6,876건이다. 지역 주민이나 분석가가 우리 동네에 작은도서관이 어디에 몇 곳 있고 장서 규모가 어떤지 확인하는 질문에 쓴다. 주소와 주소상세를 조인 키로 삼아 다른 시설·지역 데이터와 주소 기준으로 이어 쓰며, 도서관코드나 ISBN 같은 키는 이 파일에 없다.
description_portal: 문화체육관광부 '작은도서관 운영 현황' 데이터는 전국에서 운영중인 작은도서관을 정리한 목록입니다.각 항목은 도서관명, 우편번호, 주소, 상세주소, 운영주체(공립, 사립), 도서수, 개관년도로 구분되어 있습니다.이를 통해 지역 단위의 협력과 정보 공유를 촉진하고 홍보, 행사 안내, 자원 연계, 정책 연구 등 다양한 목적에 활용할 수 있습니다.CSV 파일로 제공되어 다양한 시스템과의 연동, 필터링 및 검색에 용이하며, 지역사회 문화 인프라 분석과 도서관 서비스 개선, 정책 수립을 위한 기초자료로도 활용 가치가 높습니다.
