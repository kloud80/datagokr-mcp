description_portal: 국립아시아문화전당의 공연·전시·행사 등 프로그램별로 고객이 티켓을 재출력한 건수를 제공하는 데이터입니다. 컬럼은 구분, 공연명, 장르, 대상, 상영시간, 공연시작일, 공연종료일, 티켓재출력건수로 구성되며, 각 행은 하나의 프로그램 정보와 해당 프로그램과 관련해 발생한 재출력 횟수를 함께 제시합니다. 구분은 프로그램 유형을, 공연명은 작품 또는 프로그램의 명칭을 나타내며, 장르와 대상은 프로그램의 성격과 관람 대상을 설명합니다. 상영시간은 관람 소요 또는 운영 시간을, 공연시작일과 공연종료일은 진행 기간을 의미합니다. 티켓재출력건수는 프로그램과 연계된 재출력 발생 규모를 수치로 제공하여, 프로그램 특성과 기간 정보와 함께 확인할 수 있도록 합니다. 본 데이터는 프로그램 단위의 이용 현황 파악, 유형별 비교, 기간별 경향 확인 등 기본적인 참고 자료로 활용할 수 있습니다.
