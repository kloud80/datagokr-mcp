description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 제주추사관은 조선 후기 명필 겸 학자 김정희 선생이 유배 생활을 했던 제주 서귀포시 대정읍에 위치한 기념관으로, 그의 서화 작품과 편지, 현판 글씨 등 유배 당시의 생활 흔적과 예술 세계를 전시하고 있으며 복원된 초가집, 전시실, 엘리베이터 및 무단차 출입구, 장애인 전용 주차구역, 장애인 화장실 등 무장애 편의시설이 제공되어 휠체어나 보행 약자도 편리하게 관람할 수 있는 열린 관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
