summary_user: 대구광역시 마을체육시설을 구·군(지역구분)별로 집계해 설치위치 유형(체육공원·둔치·마을공터·아파트단지·약수터·등산로·도시공원 등)별 시설수, 시설조성면적, 축구장·테니스장·게이트볼장·배드민턴장·수영장 같은 종목별 시설 내역을 담은 877바이트 분량의 소규모 CSV 집계표다. 구·군 담당자나 분석가가 "우리 구에는 등산로·약수터 같은 생활권 운동시설이 다른 구에 비해 얼마나 있나"처럼 지역 간 생활체육 기반을 비교하고 예산 배분을 검토하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 구·군 이름을 맞춰서만 이을 수 있다.
description_portal: 대구광역시 관내 공공체육시설(마을체육시설) 현황에 대한 자료로 이와 관련된 정보를 제공합니다. 공공체육시설 중 마을체육시설로 구분된 데이터는 지역별(구·군), 설치유형별(체육공원, 마을공터, 등산로 등 체육시설 설치위치) 시설수 및 시설종목별 내역 등을 포함하고 있으며, 해당 자료는 생활체육 활성화, 건강증진, 지역 공동체 강화 등에 대한 목적의 정책수립 자료로 활용이 가능합니다. 또한 지역사회의 생활체육 기반을 파악하고, 정책 수립과 예산 배분 등에 활용하기 위해 수집된 자료로써 매년 12월말 기준으로 작성됩니다.
