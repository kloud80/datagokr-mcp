description_portal: '데이터 기준일: 2026. 5. 7.관련 데이터: 나이, 성별, 전체, 골드, 블루,그린, 무료, 기타데이터 내용:  예술의전당의 나이, 성별에 따른 회원수 통계 데이터 입니다. 예술의전당은 회원은 크게 유료회원과 무료회원으로 나눠져 있으며, 유료회원에는 골드, 블루, 그린 등의 유료 회원등급이 존재합니다.예술의전당의 유료회원(멤버십)은 공연 관람, 전시 관람, 문화 행사 참여 등 다양한 문화 예술 활동에 대한 접근성과 혜택을 향상시키기 위해 마련된 멤버십 프로그램입니다.* 기타에는 후원회원, 싹틔우미회원, 노블회원 등 이 포함되어 있습니다.'
