summary_user: 서울 은평구의 일반여행업 인허가 업소를 업소 한 곳당 한 행으로 담는 원천 목록이며, 인허가일·취소일, 영업상태(TRDSTATENM)·폐업일, 사업장명, 지번·도로명 주소, 중부원점TM 좌표가 들어 있다. 은평구에서 지금 영업 중인 일반여행사가 어디에 있는지, 최근 폐업하거나 신규 등록한 여행사는 어떤 곳인지를 확인하는 사업자·분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 구의 같은 인허가 데이터나 관광사업 등록 자료와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '은평구의 국내 또는 국외를 여행하는 내국인 및 외국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.은평구 지역 내 일반여행업체의 상호, 위치, 서비스 범위 등의 정보로, 국내외 관광수요 대응과 지역 기반 여행산업 구조를 분석하는 데 유용한 자료입니다. 포스트코로나 시대에 여행 패턴이 변화함에 따라, 중소형 여행사들의 대응 전략과 고객 맞춤형 상품 개발 동향을 파악하는 데 활용됩니다. 또한 지역 거점 관광 정보 연계에도 기반이 되는 데이터입니다.'
accrual_periodicity: 수시
