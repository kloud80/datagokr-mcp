description_portal: 이 데이터는 전라남도 강진군에서 2021년 2월에 진행된 공공미술 프로젝트 **‘강진품에 안기다’**와 관련된 작품 정보를 정리한 것이다. 각 항목에는 작품이 위치한 시군명, 프로젝트 연월, 프로젝트명, 조형물 또는 벽화의 종류, 작품명, 그리고 최신 데이터 기준일이 포함된다. 작품 종류는 벽화, 철판부조, 청자부조, 타일벽화, 목재조형 등 다양한 공공미술 형식을 포함하며, ‘내고향 문학갤러리’, ‘동백꽃 핀날’, ‘강진역’, ‘정물화’, ‘솟대’ 등 지역 문화·문학·풍경을 반영한 작품들이 다수 기록되어 있다. 이 데이터는 강진군 공공미술 조성 현황을 파악하거나 작품 관리, 문화 자원 분석 등에 활용될 수 있다.
