summary_user: 수성구청 홈페이지 지도에 등록된 수성구 관내 미술관을 한 곳당 한 행으로 담은 파일로, 관명·설명·전화번호·주소·위도/경도·등록/수정일자·사용여부를 담는다(CSV 약 63KB). 주민·관광객 안내나 지도 앱 개발자가 '수성구에 어떤 미술관이 어디에 있고 연락처는 무엇인가'를 확인하거나 지역 문화시설 분포를 지도에 표시하는 데 쓴다. 문화시설 코드 같은 전역 조인 키가 없어서 다른 문화시설 데이터와는 관명·주소를 맞추거나 좌표로 공간 결합해 이어 쓴다.
limits: 수성구 한 시군구만 다루며, 문화기반시설 코드(cultural_facility_cd) 같은 공통 키가 없어 전국 문화시설 데이터와 바로 조인되지 않는다. 실제 파일의 컬럼명이 '마켓명·마켓내용'으로 되어 있어 포털 설명의 '제목·컨텐츠' 항목과 이름이 다르니 해석할 때 주의한다.
