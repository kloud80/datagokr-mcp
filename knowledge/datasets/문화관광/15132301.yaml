description_portal: 본 데이터는 수성구청 홈페이지에 등록된 미술관 위치 지도 정보를 포함하는 자료로, 미술관ID, 제목(관명), 컨텐츠(설명), 전화번호, 주소, 상세주소, 위치(위도·경도), 카테고리, 첫·마지막 등록 및 수정일자, 사용여부 등의 항목이 포함되어 있다. 이를 통해 수성구 관내의 문화시설 분포를 시각적으로 이해할 수 있으며, 문화 접근성 향상, 관람객 대상 안내, 행정 홍보 자료 제작, 지도 기반 관광 서비스 연계 등에 활용 가능하다. 특히 대구미술관과 대구간송미술관을 중심으로 하여 전시·교육 프로그램부터 지역문화 콘텐츠 강화까지 민간 및 공공 문화정책 수립에 유용한 기초 데이터이다. 데이터는 연 1회 갱신되며, 주소·위치·연락처 정보는 지도 기반 앱, 웹, 관광 안내 등 다양한 플랫폼에서도 활용될 수 있다
