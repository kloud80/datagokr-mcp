summary_user: 서울 구로구의 체육도장업(태권도·유도 등 도장) 사업장을 한 건씩 담은 인허가 원천 명부로, 사업장명·인허가일자·영업상태(영업·휴업·폐업)·폐업일자·지번/도로명 주소·좌표와 시설 면적·지도자 수 같은 속성을 사업장 단위로 기록한다. 구로구에 지금 영업 중인 도장이 어디 있는지, 최근 개업·폐업이 어느 동네에 몰렸는지 확인하려는 학부모·창업 예정자·상권 분석가가 쓴다. 실측 컬럼에 전역 조인 키는 없어서, 같은 LOCALDATA 체계의 다른 체육시설업·상권 명부와는 관리번호(MGTNO)·자치단체 코드, 사업장명·주소로 맞춰 잇고, 지도·공간 분석에는 좌표(X, Y)를 쓴다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 체육도장업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 체육도장업 시설의 면적, 건축물 연면적, 업태구분, 법인명 등 주요 속성이 기록된다. 또한 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 시설 운영 현황 파악에 활용된다. 행정기관은 이를 통해 지역 내 체육도장업을 관리하며, 시민은 합법적 운영 여부를 확인할 수 있다. 데이터는 정기적으로 갱신되어 최신 행정정보를 반영하므로 정책 수립, 연구 분석, 민원 처리 등에 활용된다. 좌표정보는 지도 서비스 및 공간 분석에 연계 가능하여 행정 투명성과 정보 접근성을 높이는 기반 자료로 기능한다.
