summary_user: 올림픽공원 축구장(올팍축구장) 홈페이지 공지사항 게시물을 건별로 담으며, 포털 설명 기준 2025년 6월 219건으로 풋살 대관 개장, 서비스 중단, 축구교실 모집, 회원 이벤트 안내 등이 들어 있다. 축구장·풋살장 이용자가 대관 개장 일정이나 축구교실 모집 시기, 운영 중단 공지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 시설 이름이나 같은 기관의 다른 스포츠센터 공지와 이름으로만 연결한다.
description_portal: 올팍축구장 공지사항 정보입니다, 한국체육산업개발 홈페이지 > 스포츠센터 > 올팍축구장 > 커뮤니티 > 공지사항으로 들어가시면 자세한 정보 확인이 가능합니다. https://www.ksponco.or.kr/sports/board.es?mid=a80301000000&bid=0010 2025년 6월 기준 219건의 게시물 정보가 있으며, 풋살경기 대관 개장 안내, 고객의견 개선 사항, 서비스 중단안내 , 온라인 수강신청 방법 안내,  회원 이벤트, 축구교실 모집안내 등 다양한 정보를 확인하실수 있습니다.
