description_portal: 한국국제교류재단은 한식의 세계화와 외국인의 한국음식 이해 증진을 위해 ‘한국국제교류재단_한국음식정보_영문’ 데이터를 공공데이터 포털에 개방하고 있습니다. 해당 데이터는 재료(면, 떡, 채소류, 젓갈 등) 및 조리법(찜, 구이, 조림, 등) 별로 분류한 약 700여가지의 한국음식에 대한 정보를 영문으로 제공합니다. 표준화된 영문 명칭과 상세 설명을 통해 해외에서 한식 메뉴 번역, 글로벌 식문화 콘텐츠 제작, 외국인 대상 교육 자료 개발, 음식 추천 시스템 구축, 한식 홍보자료 제작, 관광 안내, 식품 산업의 해외 진출, 데이터 기반 연구, 음식 관련 앱 개발 등 다양한 분야에서 활용할 수 있습니다.
