description_portal: 한국언론진흥재단이 시행하고 있는 잡지산업 실태조사는 문화체육관광부 정기간행물 등록 업체 중 잡지 발행이 확인된 약 1,800여 개 사업체를 모집단으로 합니다. 조사에는 사업체의 매출 변화, 경영 환경, 인력 현황, 제작·유통 구조, 디지털 전환, 향후 전망 등이 포함됩니다. 본 조사는 잡지 산업의 현황과 과제를 분석하고, 정책 수립 및 산업 지원 전략 마련에 활용할 수 있는 기초 자료로 활용될 수 있습니다.  이 자료는 2023년 12월 기준 잡지산업 경력별 종사자 수 현황입니다. 2024 잡지산업 실태조사에서 제공하는 데이터입니다.
