description_portal: '서울특별시 마포구의 국가유산 현황에 대한 정보입니다. 이 데이터에는 각 국가유산이 위치한 구체적인 행정 구역 정보(예: 시도명, 시군구명, 행정동명)와 실제 위치를 나타내는 도로명 주소및 법정동이 포함되어 있습니다. 또한, 문화재의 구분(예: 국가지정, 시지정 등), 문화재종류(예: 보물, 사적, 기념물, 민속문화유산, 무형유산, 등록유산, 등), 지정번호, 문화재명과 수량, 소유자 및 관리자, 소장처보관(예: 박물관, 도서관, 교회, 석불사, 재단 등), 지정일자 등의 세부적인 행정 정보도 함께 제공됩니다.이 데이터를 통해 주민들과 관계 기관은 우리 지역의 문화유산 분포와 상태를 쉽게 파악할 수 있으며, 보존·관리 및 활용을 위한 정책 수립과 문화재 교육·홍보에 유용하게 활용할 수 있습니다.'
