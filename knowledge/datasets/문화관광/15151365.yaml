summary_user: 한국관광데이터랩 관광수요지수의 관광 다양성 지표를 시군구 단위로 담은 집계 API로, 관광객·관광소비·국제적 다양성 조회 3종으로 구성된다. 지자체 담당자나 분석가가 특정 시군구의 관광 소비 다양성 세부 지표값이 기준 연월별로 어떤지 볼 때 쓴다. 시군구 코드(signguCd, 키 sgg_cd)로 같은 키를 쓰는 다른 지역·관광 통계와 이어 쓰며, 필수 파라미터 areaCd는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 본 API는 한국관광공사 한국관광데이터랩의 관광수요지수(https://datalab.visitkorea.or.kr/datalab/portal/loc/getTourActivateForm.do)에서 제공하는 관광 다양성 정보를 제공합니다.관광 다양성은 관광 빅데이터(신용카드, 이동 통신, 내비게이션)를 활용하여 해당 지역의 관광 산업 수요 활성화 정도를 평가하는 지수인 관광 수요 지수를 구성하는 지표 중 하나입니다. 관광객 다양성(연령별 방문객 수), 관광소비 다양성(연령별 소비액), 국제적 다양성(외국인 소비액, 국적별 방문자 수, 방문객 국적 다양성) 등 세부 지표로 구성되어 있으며 각 세부 지표별 하위 지표의 평균값을 보여줍니다.- 개방데이터는 지역별 관광객 다양성 정보, 지역별 관광 소비 다양성 정보, 지역별 국제적 다양성 정보 조회 기능 총 3종으로 구성되어 제공합니다.- 개방데이터는 홍보물, 잡지 등 다양한 매체에서 활용할 수 있으며, 모바일 앱, 웹 서비스 등 신규/융복합 관광 서비스 개발에도 활용할 수 있습니다.
