summary_user: 인천광역시 부평구에 신고된 체육도장업소(태권도·유도·검도·복싱·합기도 등)를 업소 한 곳당 한 행으로 담은 명부 파일로, 업종·상호·도로명 주소·전화번호를 담는다. 학부모나 지역 주민이 집 근처 태권도장·합기도장을 찾거나, 분석가·정책 담당자가 부평구 안 체육도장 분포를 동네별로 파악하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 없어 다른 데이터와는 상호명이나 도로명 주소를 맞춰 붙여야 하며, 주소를 좌표로 바꿔 상권·인구 데이터와 겹쳐 보는 방식으로 이어 쓴다.
description_portal: (체육도장업 현황) 인천광역시 부평구 관내에 등록된 체육도장업소의 기본 정보「체육시설의 설치·이용에 관한 법률」에 따른 체육도장업 신고 기준*업소별 컬럼 상세설명○ 업종 → 태권도, 유도, 검도, 복싱, 합기도 등 체육도장업에 해당하는 업종명○ 상호 → 각 체육도장이 신고한 정식 상호명○ 시설주소(도로명) → 체육도장이 소재한 도로명 기준 주소○ 시설전화번호 → 시설 이용 문의 및 운영 정보 확인을 위한 전화번호※ 본 데이터는 지역 내 체육도장업소 분포 파악, 아동·청소년 체육활동 지원, 체육정책 수립 및 생활체육 기반 조성 등의 기초자료로 활용될 수 있음
