summary_user: 전국 전통 공예·기술 전승자의 공방 58건을 건별로 담은 목록 API로, 공방 자료명(ntcrSj), 주소(adrname), 페이지 이동 URL(url)과 본문성 항목(nttCn~nttCn7)을 제공한다. 문화기획자나 관광객이 체험할 수 있는 전통 공방이 어느 지역에 있는지 찾아볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 공방명·주소 매핑이나 같은 기관 코드로만 잇는다.
description_portal: '입력 파라미터를 이용하여 공방 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_공방 정보 목록 조회 서비스는 전통 공예·기술 분야의 전승자인 장인들이 활동하는 공방에 대한 정보를 온라인으로 손쉽게 열람할 수 있도록 제공하는 디지털 플랫폼입니다. 이 서비스는 공방명, 운영 전승자 및 단체, 소재지, 전승 기술 분야, 주요 작업 품목, 창업 연도, 연락처 및 예약 방법, 체험 가능 여부·방법, 지정 현황(예: 국가무형문화재·지정·예고), 관련 사진·영상 자료 등의 상세 메타데이터를 포함하며, 이용자는 분야별·지역별·전승자별로 맞춤형 검색과 필터링을 통해 원하는 공방 정보를 쉽게 찾아볼 수 있습니다. 또한 각 공방의 전통 기술 및 작품 사례, 체험 프로그램, 교육 일정, 참여 후기 등 부가 정보를 함께 제공하여 연구자·문화기획자·일반인·관광객 등 다양한 이용자가 학술 연구, 교육 콘텐츠 제작, 문화관광 활용, 디지털 전시·체험 콘텐츠 개발 등에 유용하게 활용할 수 있는 중요한 디지털 문화유산 인프라입니다'
