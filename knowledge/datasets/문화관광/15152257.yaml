description_portal: 본 데이터는 제주를 방문한 내국인 관광객을 대상으로 연간 약 12,000명의 표본을 무작위로 추출하여 실시한 ‘제주 방문관광객 실태조사’ 결과 중, 내국인 관광객 1인당 지출 경비(단위:원) 통계를 정리한 자료입니다. 교통비, 숙박비, 음식·음료비, 쇼핑비, 관광·체험비 등 주요 소비 항목별 지출금액을 세부적으로 제공하며, 월별 분석값을 함께 수록하여 계절별·시기별 관광소비 패턴 비교가 가능하도록 구성하였습니다. 이를 통해 제주 지역의 관광 소비 구조와 경제 파급효과를 객관적으로 파악할 수 있으며, 향후 관광정책 수립, 민간 서비스 기획, 지역경제 활성화 연구 등 다양한 분야에서 기초 자료로 활용될 수 있도록 개방하였습니다.
