summary_user: 서울 구로구 안의 자동차야영장업(오토캠핑장) 인허가 내역을 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가일자·영업상태·폐업일자·소재지 주소·좌표·시설면적 등이 들어 있다. 구로구에서 지금 영업 중인 오토캠핑장이 있는지, 언제 인허가를 받고 언제 폐업했는지를 확인하려는 캠핑 이용자·사업자·관광 분석가가 쓴다. 전역 조인 키는 없어서 사업장명·주소를 매핑하거나 같은 기관 코드(개방자치단체코드)로 다른 구의 야영장·관광사업 인허가 데이터와 이어 붙이고, 좌표(X·Y)는 지도 위에 겹쳐 보는 데 쓴다.
description_portal: 자동차야영장업 인허가 정보는 구로구 내에서 캠핑카·차량을 이용해 직접 야영할 수 있는 자동차야영장(오토캠핑장)의 인허가 내역을 기록한 데이터이다. 일반야영장과 달리 차량 진입·주차를 전제로 하므로, 사이트 구성, 차량 동선, 안전시설 등에서 별도의 기준이 요구된다. 인허가일자, 영업상태명, 소재지주소, 시설규모, 수용대수, 부대시설 내역 등은 구로구가 차량 기반 야영 인프라의 공급 수준과 안전성을 파악하는 데 도움을 준다. 이 데이터는 자동차 관광 수요, 주말·성수기 이동 패턴, 교통·주차 문제와의 연계 분석 등에도 활용 가능하며, 친환경·안전한 야영문화 조성 정책의 기반 자료로 사용된다.
