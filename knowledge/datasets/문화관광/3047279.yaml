summary_user: 함평군 관내 관광택시의 코스별 운행 구간, 소요시간, 요금과 관리처·담당부서·문의처를 담은 소규모 목록 파일(CSV 약 1KB)입니다. 함평을 찾는 관광객이나 여행상품 기획자가 "함평 관광지를 택시로 돌면 어느 코스가 있고 시간과 요금은 얼마인가"를 확인할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 코스·구간에 적힌 관광지 이름을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 전라남도 함평군은 관광객의 편리한 이동 지원과 지역 관광 활성화를 위해 관광택시 운영 정보에 대한 자료를 공공데이터로 제공하고 있습니다. 본 자료는 함평군 관내 관광택시의 운영 구간, 운행 시간, 요금 정보 등을 포함하고 있으며, 지역의 주요 관광지를 연계한 관광 전용 교통서비스 운영 현황을 나타냅니다. 해당 데이터는 방문객 맞춤형 교통 안내, 관광 동선 최적화, 지역 관광자원과의 연계 강화 등에 활용될 수 있으며, 관광지 접근성 향상, 교통 편의성 증대, 민간 여행상품 개발 등의 정책 및 사업 추진에 실질적인 기초자료로 활용될 수 있습니다. 또한, 관광객의 이동 패턴 분석, 만족도 향상 전략 수립, 스마트관광 서비스 구축 등 다양한 분야에서 응용 가능한 공공자원입니다.
