description_portal: '1.부산광역시 남구 소재 국가유산 현황 정보(종류, 종별, 지정번호, 지정일자, 국가유산명, 소재지, 관리주체)를 제공합니다.2. 부산박물관 소개  위치 : 부산광역시 남구 유엔평화로 63(대연동)   관람시간 : 화요일~일요일(09:00~18:00) :  부산박물관에는 선사시대부터 현대에 이르는 부산의 역사를 한눈에 보여주는 상설전시실과 다채로운 주제의 문화 콘텐츠를 선보이는 특별기획전시실이 마련되어 있습니다. 또한 시민 여러분의 지적 호기심과 문화적 갈증을 채워줄 다양한 프로그램을 운영하고 있습니다. 박물관에 전시된 유물들은 단순한 과거의 흔적이 아니라, 오늘날 우리를 이어주는 연결고리이자 시간과 공간을 초월해 감동을 나누는 매개체입니다.'
