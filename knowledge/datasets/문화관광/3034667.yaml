summary_user: 부산광역시 남구에 있는 국가유산을 한 건씩 담은 목록 파일로, 종목·관리번호·국가유산명·지정일자·소재지·소유구분·관리자 구분을 담는다(약 10KB 규모의 CSV). 남구 주민이나 지역 연구자가 '우리 구에 어떤 지정 유산이 어디에 있고 누가 관리하나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없으므로, 국가유산청 유산 목록·상세 API와는 국가유산명·종목·관리번호를 이름·코드로 맞춰 대조해야 하고, 지도 연계는 소재지 주소를 지오코딩해 이어 쓴다.
limits: 국가유산청의 종목코드·지정번호·시도코드나 필지 고유번호(PNU) 같은 표준 키가 없어 다른 유산 데이터와 정확히 1:1로 묶기 어렵다. 범위는 남구 한 곳에 한정되며, 포털 설명의 부산박물관 소개는 관람 안내일 뿐 이 파일의 내용이 아니다.
