summary_user: 강화군시설관리공단이 관리하는 관광시설별로 시설명, 어른·청소년(군인)·어린이의 개인 및 20인 이상 단체 입장요금, 휴일여부, 도로명주소, 연락처를 한 행씩 담은 작은 CSV 파일(약 1.6KB)이다. 강화도 여행을 계획하는 개인이나 단체 인솔자가 '이 시설의 단체 입장료는 얼마이고 쉬는 날은 언제인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보나 다른 관광 데이터와는 시설명이나 도로명주소를 맞춰 이어 써야 한다.
