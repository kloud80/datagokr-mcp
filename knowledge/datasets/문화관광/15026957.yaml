summary_user: 고창군에서 열리는 전국 규모 대회를 대회 한 건당 한 줄로 담은 목록 파일(CSV, 약 4.8KB)로, 대회명칭·장소·기간·주최·주관·담당기관·문의전화를 담는다. 선수·지도자·학부모나 숙박·관광 사업자가 "올해 고창에서 어떤 전국대회가 언제, 어느 경기장에서 열리고 문의는 어디로 하나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 대회명이나 장소명을 이름으로 맞추거나 같은 기관(고창군) 자료끼리만 이어 쓴다.
