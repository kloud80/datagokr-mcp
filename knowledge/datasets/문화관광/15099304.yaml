description_portal: 본 데이터는 전북특별자치도 순창군에서 2022년 이전에 공공미술프로젝트가 완료되어 현재 지자체에서 의무 관리하고 있는 공공미술프로젝트 현황입니다. 데이터항목은 연번, 지자체명, 사업유형, 작가수, 프로젝트명, 작품명, 사업시작시점, 사업종료시점, 사업대상지, 대상지 주소, 작품수로 구성되어 있습니다. 이 데이터는 지역문화진흥법에 따른 공공예술사업 실적공개와 더불어, 도시경관 개선, 지역 정체성 강화, 생활 속 예술 환경 조성을 위한 행정적·디자인적 기초자료로 활용됩니다. 본 데이터는 공공데이터포털에 등록되어 누구나 사용 가능합니다.
