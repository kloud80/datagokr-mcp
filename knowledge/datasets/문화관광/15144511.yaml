summary_user: 부산광역시 영도구 관내에서 현재 영업 중인 신고체육시설업(체육도장, 골프연습장, 체력단련장, 체육교습업, 가상체험 체육시설업, 당구장 등)을 시설 한 곳당 한 행으로 담은 명부 파일이며, 업종·상호명·지번 및 도로명 주소·전화번호가 들어 있다. 주민이 영도구에서 동네 헬스장이나 당구장, 태권도장을 찾거나, 분석가가 구 안의 민간 체육시설이 어느 업종에 얼마나 몰려 있는지 살펴보는 데 쓴다. 전역 조인 키나 인허가번호는 없어서 다른 데이터와는 주소나 상호명을 맞춰 붙여야 하며, 상권 데이터나 다른 시군구의 체육시설업 현황과 이 방식으로 이어 쓴다.
