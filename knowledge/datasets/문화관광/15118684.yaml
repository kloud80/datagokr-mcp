description_portal: 이 데이터는 온라인면세점 이용 고객이 상품을 검색한 이후, 해당 상품을 장바구니에 담거나 실제 구매했는지를 추적하여 자동으로 생성되는 ‘검색매출매핑’ 정보입니다. 총 117,241건의 데이터로 구성되어 있으며, 주요 항목은 검색매출매핑아이디, 검색어이력아이디, 상품아이디, 장바구니아이디, 주문서아이디, 삭제여부, 등록일시 등입니다. 본 데이터는 검색 행동과 구매 전환 간의 관계를 분석할 수 있는 핵심 자료로, 고객의 검색 패턴과 구매 행동을 연계하여 마케팅 전략 수립에 효과적으로 활용될 수 있습니다. 이를 통해 검색어별 전환율 분석, 인기 검색어 기반 상품 추천, 구매 유도 전략 강화 등이 가능하며, 검색 효율성 개선과 사용자 맞춤형 서비스 제공에도 기여합니다. 또한, 장바구니 이탈 분석과 함께 프로모션 타이밍 최적화 등 정교한 데이터 기반 운영이 가능해집니다.
