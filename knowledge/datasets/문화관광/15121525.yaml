summary_user: 대한민국예술원이 발행한 예술논문집을 논문집 한 건 단위로 담은 목록 데이터로, 제목·발행기관·저자(소속)·주제분류·발행일·주요 내용·원문 링크·권리정보를 포함한다. 예술 연구자나 학생이 특정 주제나 발행 시기의 예술원 논문집을 찾아 인용하거나 원문을 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 실측 컬럼에 없어 제목·발행기관 같은 이름 매핑으로만 연결한다.
description_portal: 대한민국예술원이 발행하는 예술논문집의 다양한 정보를 한눈에 확인할 수 있도록 구성된 데이터셋입니다. 논문집의 제목, 발행년도, 주요 내용, 썸네일 이미지 등 핵심 정보를 포함하고 있어 예술 관련 연구자, 학생, 일반인 모두가 예술 논문 자료를 손쉽게 탐색하고 활용할 수 있습니다. 또한 발행기관, 소속, 자원명칭, 주제분류, 발행일, 권리정보 등 상세한 메타데이터를 제공하여 예술 논문집의 체계적인 관리와 인용, 연구 자료로의 활용에 큰 도움이 됩니다. 예술분야 연구, 교육자료 개발, 문화정책 수립 등 다양한 분야에서 참고자료로 활용할 수 있습니다.
