summary_user: 경기도가 추진한 민물고기 이동전시 사업의 운영 현황을 행사 한 건 단위로 담으며, 집계연도·시군·행사명·전시기간·전시장소·행사내용을 시군구 단위로 기록한다. 환경교육 담당자나 지역 연구자가 '우리 시군에서 언제, 어디서 민물고기 이동전시가 열렸고 무엇을 보여줬나'를 확인하는 데 쓴다. 실측상 전역 조인 키는 없어, 시군명이나 시군코드(SIGUN_CD)를 같은 기관(경기도) 데이터의 이름·코드와 맞춰 잇는 방식으로만 연결한다.
description_portal: 「민물고기이동전시운영현황」 데이터는 경기도에서 추진한 민물고기 이동전시 사업의 운영 현황을 제공하는 자료입니다. 주요 항목에는 집계년도(SUM_YY), 시군명(SIGUN_NM), 시군코드(SIGUN_CD), 행사명(EVENT_NM), 전시기간(EXHIBIT_PERD), 전시장소명(EXHIBIT_PLC_NM), 행사내용(EVENT_CONT), 비고사항(RM_MATR)이 포함되어 있습니다. 이를 통해 특정 시군에서 개최된 민물고기 이동전시 행사명, 기간, 장소 및 전시 내용 등을 확인할 수 있습니다. 데이터는 환경교육, 수산자원 보존 홍보, 지역 축제와의 연계 효과 분석 등에 활용할 수 있으며, Open API(https://openapi.gg.go.kr/FreshwaterFishMoveExhibitOp)를 통해 연도별·지역별 조건 조회가 가능합니다. 본 자료는 관광문화체육 분야 데이터로서 상업적 활용과 가공이 허용되며, 수산자원 보전 정책, 환경교육 프로그램 개발, 지역 관광 활성화 연구에 유용하게 활용될 수 있습니다. 다만, 해당 사업은 해양수산자원연구소 사업 종료로 2019년 이후 갱신이 중단된 점을 유의해야 합니다.
