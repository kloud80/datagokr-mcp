summary_user: 성남시 관내 초·중·고등학교가 보유한 체육시설(운동장, 체육관, 배드민턴장 등)을 학교·시설 단위로 한 행씩 정리한 현황 파일로, 학교명·시설종류·지번/도로명 주소·설치년도를 담는다. 주민이나 생활체육 동호회가 '우리 동네 어느 학교에 체육관이나 배드민턴장이 있나'를 찾거나, 분석가가 지역별 학교 체육 인프라 분포를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 학교명이나 주소(지번·도로명)를 맞춰 붙여야 하며, 주소를 좌표로 바꿔 공공 체육시설 위치 데이터와 겹쳐 보는 식으로 잇는다.
description_portal: 성남시내 학교체육시설에 대한 자료이며, 학교명, 시설종류, 학교위치, 설치년도 등의 항목으로 구성되어 있습니다 ※ 학교 체육시설과 관련한 세부사항은 경기도 성남교육지원청(031-780-2500)으로 문의해주시기 바랍니다성남시 학교 체육시설 현황 데이터는 관내 초·중·고등학교가 보유한 체육 관련 시설의 종류 등을 종합적으로 정리한 자료로, 공공 체육 인프라의 실태를 파악하고 지역사회 활용도를 높이기 위한 기초자료로 활용됩니다. 이 데이터에는 학교명, 소재지, 시설 종류(운동장, 체육관, 배드민턴장 등)의 정보가 포함됩니다. .
