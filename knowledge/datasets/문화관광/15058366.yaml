summary_user: 경기도 내 로컬푸드 직매장을 매장 한 곳당 한 행으로 담은 현황 목록으로, 시군명·상호·업종 상세·전화번호·영업시간·지번/도로명 주소·우편번호·WGS84 위경도가 들어 있다. 소비자가 우리 동네 가까운 로컬푸드 직매장의 위치와 영업시간을 찾거나, 분석가가 시군별 직거래 판매 인프라 분포를 비교하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 주소·위경도를 기준으로 다른 경기도 데이터나 행정구역 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 로컬푸드 직매장의 운영 현황을 정리한 자료로, 각 직매장의 상호명, 위치정보, 전화번호, 우편번호 등이 포함되어 있습니다. 로컬푸드 직매장은 지역 농업인들이 생산한 농산물을 소비자에게 직접 판매하는 공간으로, 유통 단계를 최소화하여 신선한 먹거리를 제공하고 농가의 소득을 증대시키는 역할을 합니다. 이 자료는 지역 먹거리 순환체계 분석, 직거래 기반 유통구조 설계, 농산물 소비 활성화 정책 수립, 지역별 농산물 판매 인프라 현황 파악 등에 활용될 수 있습니다. 특히 지속 가능한 지역 농업 활성화와 먹거리 선순환 구조 구축을 위한 기초자료로 활용 가치가 높습니다.
