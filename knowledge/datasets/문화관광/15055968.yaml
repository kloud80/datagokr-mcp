description_portal: 대구광역시 관내 공공체육시설 현황에 대한 자료로 이와 관련된 정보를 제공합니다. 공공체육시설은 국내·외 경기대회와 선수 훈련에 필요한 전문체육시설 및 시민이 거주지와 가까운 곳에서 쉽게 이용할 수 있는 생활체육시설을 포함하고 있으며 공공체육시설 현황자료는 시설명, 관리주체, 부지면적, 좌석수, 수용인원, 준공연도 등의 데이터를 포함하고 있습니다. 또한 체육시설의 설치·이용에 관한 법률 제36조에 따라 작성하여 문화체육관광부로 제출하는 자료로써  매년 12월 말 기준으로 조회할 수 있습니다.
