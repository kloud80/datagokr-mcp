description_portal: 본 데이터는 한국문화관광연구원이 수행한 문화예술 분야 연구성과와 정책자료, 통계정보, 동향분석 결과 등을 체계적으로 수집·정리하여 제공하기 위한 자료이다. 문화예술 관련 지식정보를 통합적으로 관리함으로써 이용자가 필요한 정보를 신속하게 탐색하고 활용할 수 있도록 구성하였다. 주요 내용은 문화예술 정책 연구보고서, 산업 및 시장 동향, 관련 통계자료, 학술자료 등으로 이루어져 있으며, 문화예술 분야의 정책 수립과 학술 연구, 산업 분석 등에 활용 가능한 기반 정보를 제공한다. 또한 데이터 이용자의 이해도를 높이기 위해 항목별 설명과 구조를 명확하게 설계하였으며, 지속적인 갱신을 통해 최신 정보를 반영하고자 한다.
