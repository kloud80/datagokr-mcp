summary_user: 서귀포시 공영 관광지별로 사용료 구분, 일반 요금, 주차료, 비고, 주소, 문의전화, 서귀포시 이티켓 홈페이지 예약 여부를 담은 시설 단위 목록 파일이다(CSV 약 2.6KB 규모의 소규모 원천). 관광객이나 여행 사업자가 '서귀포 공영 관광지 입장료와 주차료가 얼마이고 온라인 예약이 되는가'를 방문 전에 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보나 다른 관광지 목록과는 시설명·주소를 맞춰 이어 써야 한다.
description_portal: 이 자료는 서귀포시의 공영 관광지들에서 통합 예약 시스템을 통해 제공되는 이용 정보들을 정리한 것으로, 관광지명, 개장/폐장 시간, 휴무일, 주소, 전화번호, 위치 좌표 등이 포함되어 있어 관광객 및 주민 모두에게 현장 방문 전 유용한 참고자료 역할을 합니다. “통합예약요금정보”라는 제목에 맞게 일반 요금, 주차 요금 여부, 할인 가능 여부 등이 포함될 수 있는데, 요금 체계의 투명성을 높이며 예약 편리성, 방문 계획 수립, 예산 준비 등에 도움이 돼요. 행정적으로는 관광지 이용 패턴 분석, 요금 정책 개선, 예약 시스템의 운영 실태 평가 등에 활용될 수 있고, 관광지 간 경쟁력 비교, 운영시간 조정, 공공시설 접근성 평가 등에 기반 자료로 작동해요. GIS 지도를 활용하면 위치 기반 접근성, 주변 숙박시설과의 거리, 주차 요건이 있는 관광지 vs 없는 관광지 비교 등도 가능합니다.
