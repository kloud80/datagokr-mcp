summary_user: 인천 중구(영종구) 원도심과 영종지역에 등록된 관광객 이용시설업 중 전문휴양업·야영장업·관광유람선업 업체를 한 행에 한 곳씩 업종·업체명·주소로 담은 작은 CSV 파일(약 1.4KB)이다. 관광객이나 관광 사업자가 '영종도 근처에 등록된 야영장이나 유람선 업체가 어디에 있나'를 확인하거나, 분석가가 지역 관광 시설 분포를 파악하는 데 쓴다. 공통 조인 키(관광지점코드·시군구코드 등)는 없어서 다른 관광 통계나 시설 데이터와는 주소 또는 업체명을 맞춰 이어 쓴다.
description_portal: 인천광역시 중구 관광객 이용시설업 현황입니다.관광객이용시설업은 관광진흥법상 전문휴양업, 종합휴양업, 야영장업(일반, 자동차), 관광유람선업(일반, 크루즈), 관광공연장업, 외국인관광도시민박업, 한옥체험업으로 구성되어 있습니다.이 데이터는 현재 중구 원도심 지역 및 영종지역에 등록되어 있는 전문휴양업, 야영장업, 관광유람선업에 대한 내용으로,항목은 업종, 업체명, 주소를 포함하고 있습니다.(관광객이용시서업 중 외국인관광도시민박업은 별도 데이터로 등록되어 있으니, 참고하여 주시기 바랍니다.)
