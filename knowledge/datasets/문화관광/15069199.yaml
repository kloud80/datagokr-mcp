summary_user: 전라남도(현 전남광주통합특별시)가 지정한 도 지정 문화재·도 문화재자료 등의 목록을 유산 한 건당 한 행으로 담은 CSV 파일로, 종목·지정번호·국가유산명·한자명·지정일·소재 시군구가 들어 있다. 연구자나 지역 주민이 '우리 시군에 도 지정 문화재가 어떤 종목으로 몇 건 있고 언제 지정됐는가'를 확인하거나 시군별 분포를 집계하는 데 쓴다. 실측 컬럼에 국가유산청 API의 종목코드·지정번호 체계나 소재지 PNU 같은 전역 조인 키가 없으므로, 다른 유산 데이터와는 종목·지정번호·유산명 문자열이나 시군구 이름을 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 국가유산청 자체 API 등과 붙일 때 이름·종목 매핑을 따로 해야 하고, 위치는 시군구 단위까지만 있어 필지·좌표 단위 분석에는 쓰지 못한다. 포털 설명상 도 지정 문화재 중심이므로 국가지정 유산 전체 목록으로 해석하면 안 된다.
