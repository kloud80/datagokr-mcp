description_portal: '- 전라남도 도 문화재 지정 현황(도 지정, 도 문화재자료 등)에 대한 내용으로 문화재명, 종목, 년대, 시군 등을 알 수 있는 내용입니다.- 전라남도는 풍부한 역사와 문화유산을 보유한 지역으로, 다양한 문화재가 분포하고 있습니다. 이러한 문화재들은 전라남도의 역사적 가치와 전통을 대표하며, 문화재 보호와 관리를 위한 다양한 정책이 시행되고 있습니다.- 전라남도에는 국가지정문화재와 도지정문화재를 포함하여 다양한 문화재가 분포하고 있습니다.- 전라남도는 문화재 보호와 관리를 위해 다양한 정책을 시행하고 있습니다. 문화재 보호구역 설정, 정기적인 문화재 점검, 문화재 보수·정비 사업 등을 통해 문화재의 가치를 유지하고 있습니다.'
