description_portal: 게임산업진흥에 관한 법률에 의거 부산광역시 강서구 내 인터넷컴퓨터게임시설제공업(PC방) 등록 현황에 대한 데이터로 업체이름, 위치(주소), 업종명(상호) 등의 항목을 제공하오니, 관내 pc방을 이용하시려는 분들의 현황 파악 또는 창업하시는 분들을 위한 기본 자료로 활용 가능합니다. pc방을 등록하시려면 먼저 교육환경보호구역인지 확인이 먼저 선행되어야 하고, 건축물대장 상 용도는 제2종근린생활시설이고 표시사항은 인터넷컴퓨터게임시설제공업입니다. 때에 따라서 건축물의 용도가 맞지 pc방과 맞지 않거나, 표시사항이 맞지 않다면 관할구역 건축과나 부산진해경제자유구역청에 용도변경이나 표시변경을 문의가 필요합니다.
