summary_user: 경기도 내 민박·펜션 업소를 업소 한 곳당 한 행으로 담은 현황 데이터로, 시군명, 업소명·업종, 도로명·지번 주소와 좌표, 객실 수, 부대시설, 주차장 보유 여부, 결제 방식, 주변 관광 정보가 들어 있으며, 포털 설명상 전국관광펜션업소 표준데이터 제정 이후 갱신이 중단되었다. 여행자나 관광·숙박 분석가가 '경기도 어느 시군에 주차 가능한 펜션이 몇 곳이고 객실 규모는 어느 정도인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서, 같은 기관의 시군 코드(SIGUN_CD)나 시군명, 업소명·주소 매칭, 위경도 좌표로 다른 숙박·관광 데이터와 잇는다.
description_portal: 이 데이터는 경기도 내 민박 및 펜션업소 운영 현황을 제공하며, 업소명, 업종명, 주소(도로명 및 지번), 전화번호, 객실 수, 대표자명, 부대시설, 주차장 보유 여부, 결제 방식, 홈페이지 주소, 주변 관광 정보 등이 포함되어 있습니다.주요 활용처는 지역 관광정보 시스템 구축, 숙박업 관련 인프라 분석, 여행 추천 시스템 개발, 행정/소비자 서비스 개선 등입니다.단, 본 데이터는 행정안전부의 전국관광펜션업소 표준데이터 제정으로 인해 갱신이 중단된 상태이므로, 최신 정보는 별도의 '관광 펜션업체 현황' 데이터셋을 확인해야 합니다.
