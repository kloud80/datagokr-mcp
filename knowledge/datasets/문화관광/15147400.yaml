summary_user: 서울특별시 동작구의 수영장업 인허가 사업장을 한 곳씩 담은 명부로, 사업장명·주소·인허가일자·영업상태(정상·휴업·폐업)·폐업일자·보험가입여부·시설규모 등을 사업장 단위로 담는다. 동작구에서 지금 영업 중인 수영장이 어디 있는지, 최근 폐업·휴업한 곳이 있는지를 확인하려는 주민·사업자나 지역 체육시설 공급을 보는 분석가가 쓴다. 전역 조인 키는 실측 컬럼에서 찾지 못해 다른 데이터와는 관리번호(MGTNO)·사업장명·주소를 매핑하거나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 같은 축의 다른 체육시설업 인허가 명부와 나란히 볼 때 쓸모가 크다.
description_portal: 수영장업 인허가 정보 데이터는 시민에게 수영 및 수중 체육 활동을 제공하는 시설 현황을 담고 있습니다.사업장명과 주소 정보는 각 수영장의 위치와 기본 정보를 제공합니다.문화체육업종명은 일반 수영장, 강습용 수영장, 실내·외 수영장 등 업종 유형을 구분합니다.영업상태 항목은 정상, 휴업, 폐업 등 현재 운영 여부를 보여줍니다.보험가입여부 코드는 종사자와 이용자의 안전을 보장하기 위한 보험 가입 현황을 나타냅니다.시설규모 정보는 수영장 면적, 수영장 수, 탈의실, 샤워시설 등 공간 환경을 보여줍니다.
