description_portal: 이 데이터는 한국문화예술위원회 문학 분야 문예진흥기금 공모사업 중 전자책 및 웹진 형태의 문예지 보급 현황을 수치로 정리한 자료입니다. 구성 항목에는 문학단체명, 사업연도, 전자책 단권 판매량의 3년간 추세 및 실적(부), 정기구독 추세(부), 총판매부수 실적(부), 웹진 연간 방문자 수 추세(명) 등이 포함되어 있습니다. 모든 판매 및 방문 수치는 정량화된 숫자 형식으로 제공되며, 각 단체의 디지털 문예지 확산 현황과 독자 접근도를 분석하는 데 활용됩니다. 이 데이터는 전자책 기반 유통성과 변화 추이, 디지털 콘텐츠의 이용 행태, 온라인 문예지 플랫폼의 운영 효과를 비교·평가할 수 있는 근거 자료로서, 향후 문예지 보급 전략 수립과 지원 방향 결정에 유용합니다.
