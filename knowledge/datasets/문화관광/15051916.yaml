description_portal: 서울시립미술관 전시 정보(영문)는 서울시립미술관에서 개최된 전시의 주요 내용을 종합적으로 제공하는 데이터입니다. 전시NO와 전시일련번호는 개별 전시를 고유하게 식별하는 데 활용되며, 전시회명과 전시부제는 전시의 주제와 성격을 이해하는 기본 정보를 제공합니다. 전시장소, 전시시작기간, 전시끝기간, 전시(관람)시간은 언제 어디에서 어떤 일정으로 전시가 진행되는지 확인할 수 있는 핵심 운영 정보입니다. 홈페이지URL, 바로가기링크는 온라인 상세 안내와 예약, 홍보 페이지로 연계하는 데 유용하며, 부대행사와 주최및후원 정보는 전시와 연계된 프로그램과 협력 주체를 파악하는 데 도움을 줍니다. 관람료, 전시부문, 작품수, 출품작가 정보는 관람 계획과 전시 규모, 구성 내용을 미리 가늠하게 해 줍니다. 관람포인트와 전시설명은 전시의 감상 포인트와 기획 의도를 전달하는 설명 자료로 활용되며, 대표이미지는 전시를 시각적으로 소개하는 홍보 및 안내용 이미지로 쓰이는 실무 중심 데이터입니다.
