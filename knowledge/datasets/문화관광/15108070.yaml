summary_user: 한국스포츠정책과학원이 보유한 연구보고서를 보고서 한 건 단위로 담으며, 제목·저자·발행처·발행일자·페이지·원문 존재 여부·서지 상세 URL을 제공하는 전국 범위의 비공간 서지 목록이다. 체육 정책 담당자나 연구자가 '특정 종목이나 주제의 선행 연구보고서가 있는지, 원문을 볼 수 있는지'를 제목·저자·발행일로 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·저자명 같은 이름 매칭으로만 연결하며, 원문 확인은 서지 상세 URL(detail_url)로 넘어간다.
limits: 보고서 서지 정보만 담고 본문 내용이나 선수·대회 기록 같은 실데이터는 없으며, 다른 체육 데이터와 코드로 바로 결합할 수 없다. 호출에는 포털 활용신청으로 받은 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
