summary_user: 인천 안에서 반려동물과 함께 갈 수 있는 관광지·업소를 한 곳씩 담은 건별 목록으로, 지역·구분·상호·주소·전화번호와 반려동물용 서비스 시설, 동반 가능 공간(실내·실외), 입장 제한, 이용료, 이용시간, 휴무, 주차 여부를 담는다. 반려동물과 인천 여행을 계획하는 시민·관광객이 '대형견도 실내에 들어갈 수 있고 주차되는 곳이 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소를 맞춰 붙이거나 TourAPI 관광지 정보와 이름으로 대조해 이어 쓴다.
description_portal: 인천광역시_반려동물 동반 관광지 정보 리스트는 인천 내에서 반려동물과 함께 방문할 수 있는 관광지 정보를 체계적으로 제공하는 공공데이터로, 시민과 관광객이 반려동물 친화적 공간을 쉽게 찾을 수 있도록 지원합니다.이 데이터는 지역, 구분, 소구분, 상호, 주소, 전화번호, 웹사이트 같은 기본 정보뿐 아니라, 반려동물 전용 메뉴 및 서비스 시설, 동반 가능 공간, 입장 제한사항, 이용료, 특이사항, 운영시간, 휴무일, 주차 여부까지 상세히 담고 있습니다. 이를 통해 반려동물과 함께할 수 있는 관광지의 조건과 편의성을 한눈에 확인할 수 있으며, 공공데이터포털에서 CSV 파일로 다운로드가 가능합니다.
