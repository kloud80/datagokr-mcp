summary_user: 전북특별자치도 내 국가 지정 사적지에 있는 유물 전시관·박물관을 시설 한 곳당 한 행으로 정리한 소규모 현황 파일(약 636바이트 CSV)로, 시군·지정 구분·명칭·규모(제곱미터)·소장자료·개관일을 담는다. 역사 교육이나 문화 관광을 준비하는 사람이 '전북 사적지 안에 어떤 전시관이 있고 무엇을 소장하고 있는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 시설코드가 없어, 다른 문화시설 데이터와는 시군 이름이나 시설 명칭을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도 내 국가 지정 사적지에 위치한 유물 전시관 및 박물관을 안내하는 현황 자료입니다. 어진박물관, 미륵사지유물전시관, 동학농민혁명기념관 등 각 전시관의 명칭과 규모, 개관일과 같은 기본 정보와 함께, 소장하고 있는 유물의 종류와 수량을 상세히 소개하고 있습니다. 고고학 자료부터 민속품, 문서, 도자기류에 이르기까지 각 전시관의 특색 있는 소장품 정보를 통해 지역의 풍부한 역사와 문화를 엿볼 수 있습니다. 이 자료는 역사 교육과 문화 관광을 위한 중요한 가이드 역할을 합니다.
