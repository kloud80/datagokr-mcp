summary_user: 대구광역시 공공도서관이 운영하는 스마트도서관(무인 대출기)별 보유 도서를 권(등록번호) 단위로 담으며, 표제·발행자·청구기호·비치 여부·반납예정일·예약 수 같은 서지·소장 상태 정보를 준다. 시민이 '집 근처 스마트도서관에 이 책이 지금 비치돼 있나, 언제 반납되나'를 확인하거나, 개발자가 스마트도서관 위치와 인기·신착 도서 안내 앱을 만드는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 도서관 데이터와는 도서명·청구기호 같은 이름 매핑이나 같은 기관의 스마트도서관 코드로만 연결하며, 검색 전에 스마트도서관 코드를 먼저 받아 넘겨야 한다.
limits: 필수 파라미터인 스마트도서관 코드와 검색어는 다른 데이터에서 먼저 받아 넘겨야 하며, 실측에서는 4개 오퍼레이션 중 1개만 호출에 성공했고 도서검색·스마트도서관 위치·인기도서 목록은 최소 파라미터로 응답이 없었다. 필드에 ISBN이 없어 국가서지·도서관정보나루 데이터와 바로 붙일 수 없다. 개발계정은 하루 3,000회로 호출이 제한된다.
