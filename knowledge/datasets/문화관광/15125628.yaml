description_portal: 대구광역시 스마트도서관 도서검색서비스는 대구광역시의 공공도서관 스마트도서관에서 제공하는 도서 검색 서비스입니다. 이 서비스는 스마트도서관의 고유코드를 기준으로 도서관의 위치를 안내하고, 보유 도서를 검색할 수 있도록 지원합니다. 또한 인기 도서 검색 및 신착 도서 검색 기능을 제공하여 이용자들이 최신 도서 정보를 쉽게 확인할 수 있도록 합니다.이 서비스는 REST API 형태로 제공되며, 데이터 포맷은 JSON을 사용합니다. 이를 통해 개발자들은 스마트도서관의 도서 정보를 활용하여 다양한 애플리케이션이나 웹 서비스를 개발할 수 있습니다. API를 활용하면 스마트도서관의 위치 정보를 조회하거나, 특정 도서의 소장 여부를 확인할 수 있으며, 인기 대출 도서 목록을 받아볼 수도 있습니다.
team:
  dept: 도서관정책과
services:
  - op: /newBookList
    name: 대구 스마트도서관 신착도서 검색
    endpoint: https://apis.data.go.kr/6270000/dgsmartlib/newBookList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지번호
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: code
        required: true
        example: AA51
        desc: 스마트도서관 Code
      - name: shelf_change_start_date
        required: true
        example: '2023-01-01'
        desc: 도서비치시작일(YYYY-MM-DD 형식)
      - name: shelf_change_end_date
        required: true
        example: '2023-12-31'
        desc: 도서비치종료일(YYYY-MM-DD 형식)
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 3000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
  - op: /bookSearch
