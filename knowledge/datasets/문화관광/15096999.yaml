description_portal: 이 데이터는 한국문화예술위원회가 수집한 1999년부터 2006년까지의 문예잡지 정보를 정리한 자료로, 당시 국내 문학계의 흐름과 출판 경향을 파악할 수 있는 귀중한 문헌 기록입니다. 각 항목은 연번, 연도, 잡지명, 호, 발행형태, 대표장르, 시, 소설, 수필_산문, 평론_인문연구서, 희곡_시나리오, 기타, 비고로 구성되어 있으며, 연번은 1번부터 2608번까지 부여되어 방대한 분량을 체계적으로 관리하고 있습니다. 호 항목은 봄호, 여름호, 가을호, 겨울호 등 계절별로 구성되어 있으며, 발행형태는 계간, 격월간, 월간, 연간 등으로 다양하여 출판 주기를 분석하는 데 유용합니다. 대표장르는 시, 소설, 수필/산문, 평론/인문연구서, 기타 등으로 구성되어 있어 잡지의 성격을 파악할 수 있으며, 장르별 기고 유무도 별도 항목으로 정리되어 있어 각 문예지의 성향 및 문학 양식의 분포를 정량적으로 분석하는 데 활용할 수 있습니다.
