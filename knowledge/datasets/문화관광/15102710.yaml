summary_user: 인천 부평구에 있는 인공암벽장과 수영장을 시설 한 곳당 한 행으로 담은 파일(csv, 722바이트)로, 업종·상호·도로명 소재지 주소·시설 전화번호를 담는다. 부평구 주민이 "집 근처에 이용할 수 있는 수영장이나 실내 암벽장이 어디 있고 문의 전화는 무엇인가"를 찾거나, 분석가가 구 안의 시설 분포와 접근성을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호(시설명)나 소재지 주소를 맞춰 붙이는 방식으로만 이어 쓰며, 주소를 좌표로 바꾸면 다른 체육시설 현황과 지도 위에서 겹쳐 볼 수 있다.
limits: 부평구 한 곳의 시설만 담고 있어 다른 시군구와 비교하려면 별도 데이터가 필요하다. 시설을 묶는 공통 코드가 없어 다른 데이터와 붙일 때는 이름·주소를 직접 대조해야 한다. 주소 열 이름이 '소새지주소'로 오기되어 있으니 파싱할 때 주의한다.
