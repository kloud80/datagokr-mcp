summary_user: 경기도 시군별로 우리 민족 근대사 관련 사적지(항일·호국 유적, 평화의 소녀상, 독립운동가 기념비 등)를 사적지 1곳당 1행으로 담은 목록이다. 사적지명·위치·국가 구분·사적분류·형태분류(동상·탑·안내 등)·도로명/지번주소·위경도·사진 링크·수정일이 들어 있다. 교사나 탐방객이 '우리 시군에 있는 항일 유적과 소녀상은 어디인가'를 찾거나 역사 탐방 코스를 짜는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 시군명이나 주소로 매칭하거나 위경도(refine_wgs84_lat·refine_wgs84_logt)로 지도·다른 공간 데이터에 얹어 쓴다.
description_portal: '이 데이터는 우리 민족의 근대사와 관련된 주요 사적지를 종합적으로 수록한 자료로, 시군별로 정리된 사적지명과 위치, 국가, 사적분류(항일, 호국 등), 형태분류(동상, 탑, 안내 등), 도로명주소 및 지번주소, 위경도 좌표 등 다양한 정보를 포함합니다. 데이터는 항일운동 유적, 평화의 소녀상, 독립운동가 기념비와 같은 역사적 시설물들을 탐방·관리하는 데 활용되며, 역사교육 자료로도 가치가 높습니다. 사적사진 링크와 수정일 정보도 포함되어 있어 문화재 및 역사시설의 디지털 관리 및 홍보 자료로도 활용될 수 있습니다.※ 제공 : KDMT'
