description_portal: 한국언론진흥재단 미디어연구센터에서 정부광고 수수료를 재원으로 제작한 조사연구 자료입니다. 코로나19 관련 시민 인식조사를 주제로 진행된 사회적 이슈 관련 일회성 조사로, 팬데믹 상황에서 시민들의 코로나19에 대한 전반적인 인식과 태도 변화를 종합적으로 분석했습니다. 감염병 확산에 대한 우려 수준, 방역 정책에 대한 평가, 일상생활 변화 적응도, 백신 접종 의향 등 다양한 측면에서 시민 의식을 조사했습니다. 또한 코로나19로 인한 사회적 거리두기, 경제적 영향, 심리적 스트레스 등이 개인과 사회에 미친 영향에 대한 인식도 포함되어 있습니다. 공중보건 위기 상황에서 시민 사회의 대응 양상을 이해하는 데 중요한 기초 자료를 제공합니다. 조사연구에 대한 PDF 파일 형태로 제공되며, 공공누리 공공저작물 자유이용허락 조건에 따라 자유롭게 활용 가능합니다.
