summary_user: 부산광역시 강서구 관내 전통사찰을 사찰 한 곳당 한 행으로 담은 파일로, 사찰명·소속 종단·주지 성명·건립 연대·전통사찰 지정일자·보유 문화재와 주소·좌표를 수록하며 파일 크기는 326바이트로 소량이다. 강서구에 어떤 전통사찰이 있고 언제 지정됐으며 어떤 문화재를 보유했는지 확인하려는 주민·답사객·지역 문화유산 분석가가 쓴다. 전역 조인 키는 없으므로 사찰명으로 다른 문화유산 자료와 맞추거나, 도로명·지번주소와 위도·경도로 지도·다른 시군구 전통사찰 현황과 공간적으로 이어 쓴다.
description_portal: 부산광역시 강서구에 위치한 전통사찰의 전반적인 현황을 체계적으로 정리하고, 이들 사찰이 지닌 역사적·종교적 의미와 지역사회 내 역할을 종합적으로 파악하기 위해 마련되었습니다. 강서구는 도시 개발과 산업 인프라가 지속적으로 확장되고 있는 지역임에도 불구하고, 오랜 세월 동안 지역민의 삶과 함께해 온 유서 깊은 사찰들이 다수 분포해 있으며, 이들 전통사찰은 불교 신앙의 중심지로서 뿐만 아니라 지역문화의 중요한 축으로 기능하고 있습니다.이 자료는 강서구 관내 전통사찰에 대한 구체적인 정보를 종합하여 수록하고 있으며, 각 사찰의 명칭과 함께 소속된 불교 종단, 주지를 맡고 있는 스님의 성명, 사찰이 창건된 시기 또는 연대, 그리고 전통사찰로서의 지정일자 등의 항목을 포함하고 있습니다. 이러한 정보는 각 사찰의 역사적 배경과 종단적 정체성, 운영 주체에 대한 기본적인 이해를 돕는 데 목적이 있습니다.
