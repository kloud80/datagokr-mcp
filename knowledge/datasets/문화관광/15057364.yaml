summary_user: 경기도 31개 시군에서 인허가된 청소년게임 제공업소를 사업장 한 곳당 한 행으로 담은 건별 현황으로, 인허가·취소·폐업일자와 영업상태, 지번·도로명 주소와 WGS84 좌표, 시설 면적·층수·건물 용도, 총 게임기 수, 제공 게임물명을 포함한다. 청소년 보호 담당자나 분석가가 특정 시군에 영업 중인 청소년게임장이 몇 곳이고 어디에 몰려 있으며 시설 규모가 어떤지 확인하는 데 쓴다. 전역 공통 조인 키는 없어 시군코드(SIGUN_CD)·시군명 같은 경기도 자체 코드, 주소 문자열, 좌표로 다른 데이터와 연결한다.
description_portal: 본 데이터는 경기도 내 31개 시군에서 인허가된 청소년 게임 제공업체의 현황을 담고 있습니다. 제공 항목은 사업장명, 인허가일자 및 취소일자, 영업상태(폐업 포함), 소재지 주소 및 연락처, 시설 면적과 건물 용도, 층수, 통로너비, 조명 및 음향·방음·소방 등 안전 시설 여부, 총 게임기 수, 제공 게임물명 등으로 구성됩니다. 이를 통해 게임제공업 운영 현황, 시설 안전성, 지역별 업종 분포를 파악할 수 있으며, 청소년 보호정책 수립, 문화산업 분석, 업종 관리 및 지도 점검 자료로 활용 가능합니다. 또한 Open API로 제공되어 XML·JSON 형식의 연계 활용이 가능하며, 시군명과 시군코드 조건 검색을 통해 특정 지역 현황을 조회할 수 있습니다.
