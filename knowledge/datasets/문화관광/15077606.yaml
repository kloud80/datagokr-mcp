summary_user: 부산 갈맷길 코스 주변의 명소·맛집·숙박 시설을 시설 1건씩 담는 원천 목록으로, 코스·구간, 장소명, 위도·경도 좌표, 이미지 경로, 소개글을 포함하며 범위는 부산 한 시도이고 위치는 개별 주소·좌표 단위다. 갈맷길을 걷는 여행자나 여행 앱·지도 서비스 개발자가 '이 코스의 이 구간 근처에 볼거리·먹거리·숙소가 어디 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 관광 데이터(TourAPI 등)와는 장소 이름 매칭이나 위도·경도 좌표 근접으로만 이어 쓰고, 갈맷길 내부에서는 코스(course)·구간(gugan) 값으로 묶어 본다.
limits: TourAPI의 콘텐츠 ID나 지역코드 같은 공통 키가 없어 다른 데이터셋과 직접 조인할 수 없고, 이름·좌표 기반 매칭만 가능하다. 이미지 필드는 상대 경로이므로 'https://www.visitbusan.net/'을 앞에 붙여야 접근된다. 개발계정은 하루 10,000회로 호출이 제한된다.
