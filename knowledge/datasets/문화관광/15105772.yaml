summary_user: 전라남도 도립미술관이 제안구입으로 들인 소장품을 작품 한 점당 한 행으로 담은 목록으로, 작가명·작품명·제작년도·크기(높이×너비)·재료·장르를 싣고 있으며 CSV 파일 크기는 약 6KB로 작다. 미술 연구자나 관람객이 이 미술관이 제안구입으로 어떤 작가의 어떤 장르 작품을 모았는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름으로 맞춰 잇거나 같은 기관의 다른 소장품 목록과 나란히 보는 정도로만 연결한다.
description_portal: '- 전라남도 도립미술관 소장품  제안구입 목록 정보로 작품명, 작가명, 제작연도, 유형, 제작기법, 작품크기 등을 포함하고 있습니다.- 전라남도 도립미술관의 소장품은 지역의 문화적 정체성을 반영하며, 전통과 현대를 아우르는 다양한 작품들로 구성되어 있습니다. 특히 남도 지역의 자연, 역사, 정서를 담은 미술 작품들이 중심을 이루고 있습니다.- 전라남도 도립미술관은 지역의 문화와 예술을 체험할 수 있는 중요한 공간으로, 다양한 전시와 프로그램을 통해 관람객들에게 풍성한 문화적 경험을 제공합니다.- (미술관 방문 정보) 1. 위치: 전라남도 무안군 삼향읍 오룡길 15 2. 개관 시간: 화~일요일 10:00 ~ 18:00 (월요일 휴관)'
