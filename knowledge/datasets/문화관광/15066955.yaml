summary_user: 전북특별자치도의 전통 소리 공연을 공연 한 건 단위로 기록한 아카이브 파일로, 제목·요약·공연자·공연장소·공연일과 함께 공연종류(국악실내악·전통무용·창극 등), 사용 악기, 배경을 설명하는 상세내용을 담는다(CSV 약 8.4MB). 국악 연구자나 학생이 '전북에서 열린 창극 공연에는 어떤 악기와 공연자가 참여했나'처럼 특정 장르·악기별 전통 공연 기록을 찾을 때 쓴다. 실측 컬럼에 KOPIS 공연ID 같은 전역 조인 키가 없어, 다른 공연 데이터와는 공연명·공연장소 이름을 맞춰 연결해야 한다.
description_portal: '이 데이터는 전북특별자치도의 풍부한 전통 소리 자원을 집대성한 공연 정보 아카이브입니다. 각 공연의 제목, 요약 내용, 공연자, 공연 장소 및 일시와 같은 기본 정보는 물론, 공연의 종류(예: 국악실내악, 전통무용, 창극)와 사용된 악기까지 상세히 기록하고 있습니다. 특히, 각 공연의 배경과 의미를 설명하는 상세 내용 항목을 포함하여 단순한 정보 목록을 넘어 깊이 있는 문화 콘텐츠로서의 가치를 지닙니다. 이 자료는 사라져가는 우리 전통 예술을 보존하고, 국악 연구자, 학생, 그리고 일반 대중이 한국의 소리 문화를 쉽게 접하고 이해할 수 있도록 돕는 중요한 문화유산 데이터입니다.'
