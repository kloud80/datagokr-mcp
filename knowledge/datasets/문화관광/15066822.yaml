summary_user: 경기도 평화누리길을 따라 관찰된 자생식물을 한 행에 한 종씩 과명·속명·국명으로 정리한 목록 파일(csv)로, 포털 설명 기준 1,120종을 담는다. 탐방 해설사·생태교육 담당자나 탐방객이 "평화누리길에서 볼 수 있는 식물은 어떤 과·속에 속하나"를 확인하거나 관찰 체크리스트를 만드는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 국명·학명 같은 이름 매칭으로만 이을 수 있다.
description_portal: 이 데이터는 경기도 평화누리길을 따라 관찰된 자생식물 1,120종의 분류 정보를 정리한 생태 목록입니다. 평화누리길은 DMZ 접경 지역을 따라 조성된 탐방로로 다양한 식물종이 자라며, 생태 관광 명소로 주목받고 있습니다. 목록에는 각 식물의 과명(특징이 유사한 식물 집단), 속명(분류상 더 세부 그룹), 국명(우리말로 통용되는 이름) 정보가 포함되어 있으며, 자연 관찰 및 생태 환경 이해, 탐방 교육, 생물다양성 보존 등 다양한 분야에서 활용 가능한 기초 자료입니다. 식물과 환경을 함께 체험할 수 있는 콘텐츠로 누구나 쉽게 접근할 수 있습니다.
