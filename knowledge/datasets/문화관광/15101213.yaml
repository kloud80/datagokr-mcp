summary_user: 문화체육관광부 e브리핑에 올라온 공식 발표·자료를 한 건씩 담은 메타데이터로, 제목·등록일·주제분류·핵심주제어·관련장소·시간적 범위·저작권·원문 위치(url) 등을 담으며 범위는 전국이고 공간 좌표는 없다. 연구자나 기자가 '특정 체육·관광 정책 발표가 언제, 어떤 주제어로 나왔는가'를 찾거나 정책 동향을 시기별로 훑는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 제목·주제어 같은 이름 매칭이나 같은 기관(문체부) 데이터 기준으로만 이어 쓴다.
description_portal: 문화체육관광부에서 제공하는 e브리핑 데이터는 다양한 문화, 체육, 관광 관련 공식 발표와 자료를 체계적으로 제공합니다. 자원의 명칭, 등록일, 주제분류, 핵심주제어, 관련장소, 시간적 범위, 언어, 저작권 등 주요 정보를 포함하고 있어 정책 연구, 미디어 보도, 학술 분석 등 다양한 분야에서 활용할 수 있습니다. 또한 참조자원제목, 썸네일 이미지, 지식정보자원위치정보 등 부가 정보도 함께 제공되어, 문화정책 동향 파악이나 관련 자료의 신속한 접근에 유용합니다. 공공기관, 연구자, 언론인 등에게 신뢰성 높은 문화체육관광 정보를 제공합니다.
