description_portal: 인천지역유산은 인천광역시의 역사와 문화를 이해할 수 있는 중요한 자산으로, 역사적, 예술적, 학술적 또는 경관적 가치가 있는 유,무형의 것으로 소유자 등의 동의 및 인천지역유산위원회의 심의를 거쳐 인천광역시장이 선정한 것을 말한다. 다만, 국가유산기본법에 따라 지정, 등록된 국가유산은 제외되며, 지역 고유의 생활유산과 시민 기역 자산을 중심으로 운영된다. 해당 자료는 인천지역유산 분류, 유형, 명칭, 선정연도, 소재군,구 정보가 포횜되어 있으며, 인천광역시 홈페이지 분야별 정보, 문화관광 메뉴를 통해 시민 누구나 쉽게 확인할 수 있다.
