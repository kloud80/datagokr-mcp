description_portal: 서울역사자료실은 송파구에 위치하고 있으며 서울특별시사편찬위원회자료, 시정자료, 역사자료, 지명자료 등 서울의 역사와 관련된 다양한 자료들을 수집 및 정리하여 제공하고 있습니다. 문헌자료로는 약 20,000권 (서울시 간행물, 타 시·도 간행물, 정기간행물, 신문, 일반 단행본, 비도서자료 등)와 사진자료 약 30,000매를 소장하고 있으며, 일반 시민들이 자유롭게 자료를 열람할 수 있습니다. 서울시사편찬위원회의 소장도서 중 단행본에 대해 소장하고 있는 목록 정보를 제공합니다.제공부서는 서울특별시 서울역사편찬원 시사편찬과(02-413-9625) 입니다.※ 바로가기 클릭 시 서울 열린데이터광장 개방 데이터로 이동합니다.
