summary_user: 경기도 내 공공 롤러스케이트장(인라인스케이트장)을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군명, 소유·관리 주체, 준공연도, 실내외 구분, 트랙·필드 바닥재와 규격, 면적, 관람석·수용인원, 건설사업비, 주소와 위경도를 포함한다. 주민이 집 근처 인라인스케이트장의 위치와 실내외 여부를 확인하거나, 분석가가 시군별 롤러스케이트장 분포와 시설 규모를 비교할 때 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)나 시설명·주소로 맞추고, 위경도를 이용해 다른 체육시설 자료와 위치 기준으로 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 공공 롤러스케이트장(인라인스케이트장) 시설의 현황을 기록한 자료로시군명, 시설명, 소유기관, 관리주체, 준공연도, 실내외 구분, 트랙 및 필드 바닥재료, 트랙주로폭과 주로 수, 필드길이·폭, 면적, 관람석 좌석수, 건설사업비 등의 정보를 포함하고 있습니다. ‘시설명’, ‘트랙바닥재료명’, ‘필드바닥재료명’, ‘면적(㎡)’, ‘수용인원수(명)’, ‘WGS84위도’, ‘WGS84경도’ 등이 주요 항목으로, 체육 인프라 분석 체육시설 설치 기준 수립 등에 활용 가능합니다. 대부분 실외 시설이며 트랙과 필드의 구조가 명시되어 있어 시설 설계 및 기능성 평가에 유용합니다. 일부 항목은 결측값이 존재하므로 분석 시 주의가 필요하며, ‘비고사항’을 통해 시설의 특징이 간단히 제시되는 경우도 있습니다.
