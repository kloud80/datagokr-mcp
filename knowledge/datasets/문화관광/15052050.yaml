summary_user: 울산시설공단 동천국민체육센터에서 이루어진 카드 결제를 거래 한 건 단위로 담은 원천 기록으로, 거래일자·승인/취소 여부·카드사·승인금액·거래 목적(수강료·입장료·대관료 등) 6개 항목으로 구성되며 CSV 파일 약 16MB 분량이다. 시설 운영 분석가나 공단 관계자가 월별·용도별 결제 금액 추이와 취소 비율을 살펴보거나, 수강료와 대관료 중 어느 수입이 큰지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명 같은 이름 매칭이나 같은 울산시설공단의 다른 시설 카드거래내역과 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: 동천국민체육센터에서는 이용자의 카드 결제 관련 정보를 보다 명확하게 제공하기 위해 카드 거래 내역 데이터를 공개하고 있습니다. 해당 데이터는 시설명, 거래일자, 승인구분, 카드종류, 승인금액, 구분 등 총 6개의 항목으로 구성되어 있으며, 각 항목은 다음과 같은 정보를 포함합니다. 시설명은 결제가 이루어진 체육시설의 이름을 나타내며, 거래일자는 카드 승인 또는 취소가 이루어진 날짜를 의미합니다. 승인구분은 해당 거래가 승인인지 취소인지의 여부를 나타내고, 카드종류는 사용된 카드의 회사를 구분합니다. 승인금액은 실제 결제된 금액이며, 구분 항목은 수강료, 입장료, 대관료 등의 거래 목적을 구분짓는 항목입니다.
