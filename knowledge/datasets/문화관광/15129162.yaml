summary_user: 경상북도 상주시에서 영업신고를 마친 일반 숙박업소 57개소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·전화번호가 들어 있다. 상주를 찾는 여행객이 시내 숙박업소의 위치와 연락처를 확인하거나, 분석가가 상주시 숙박업 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소를 맞춰 붙이거나 같은 기관 자료끼리만 연결하며, 인허가 공통 원천인 공중위생법 신고 자료(LOCALDATA)와 대조해 쓰는 것이 기본이다.
description_portal: 경상북도 상주시에서 영업신고가 완료된 총 57개소의 숙박업소에 대한 정보를 안내해드립니다. 본 자료에는 각 업소의 업종명, 업소명, 영업소 주소, 소재지에 대한 세부 정보가 포함되어 있으며, 이를 통해 숙박업소 현황을 보다 명확히 파악하실 수 있습니다. 참고로, 본 자료에 포함된 업소들은 농어촌민박, 외국인도시민박업, 관광숙박업, 야영장 및 캠핑장, 한옥체험업 등과는 구분되는 일반 숙박업소에 해당합니다.
