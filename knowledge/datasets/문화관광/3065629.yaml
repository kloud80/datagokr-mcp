summary_user: 경상남도 산청군 안의 국가유산을 한 건씩 담은 목록 파일로, 유산 구분·종류·지정번호·명칭·지정일·관리자·관리단체를 담는다(포털 설명상 2024년 기준, CSV 약 15KB). 산청군에 어떤 국가·도지정 유산이 있고 언제 지정됐으며 누가 관리하는지 확인하려는 주민·여행자·문화재 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 자료 등과는 국가유산명·종류·지정번호를 이름·번호 매핑으로 맞춰 이어 써야 한다.
limits: 국가유산청 종목코드·지정번호 체계나 소재지 지번(PNU) 같은 표준 키가 없어 다른 데이터와 자동 연결이 안 되며, 산청군 한 시군구 범위의 비공간 목록이라 위치 좌표로 지도화할 수 없다. 국가유산청 자체 API가 따로 있으므로 상세 정보는 그쪽과 대조가 필요하다.
