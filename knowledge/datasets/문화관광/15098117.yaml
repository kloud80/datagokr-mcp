description_portal: 전라남도 해남군 야외운동기구 현황입니다이 데이터에는 연번, 읍면, 리, 설치년도, 주소, 세부위치, 수량, 주이용자, 관리부서, 관리자 총 10개의 정보로 구성되어 있습니다. 야외운동기구는 해남군 내 14개 읍면 모든 지역에 설치되어 있고 총 428곳에 설치되어 있으며 각 장소마다 최소 1개에서 최대 23개가 설치되어 있습니다.설치장소는 주로 마을회관 주변에 설치되었으며, 초등학교, 공원, 체육공원, 공터, 등산로 등에서도 설치되어 있습니다.2007년부터 시작하여 최근까지 설치한 현황입니다.
