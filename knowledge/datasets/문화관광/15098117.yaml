summary_user: 전라남도 해남군 14개 읍면에 설치된 야외운동기구를 설치 장소 한 곳당 한 행으로 담은 파일로, 읍면·마을명·주소·세부위치와 설치년도·수량·주이용자·관리부서를 기록한다. 주민이나 생활체육 담당자가 '우리 마을이나 근처 공원에 운동기구가 있는지, 몇 개이고 언제 설치됐는지'를 확인하거나 노후 기구 교체 대상을 고를 때 쓴다. 전역 조인 키는 없어 다른 체육시설 자료와는 읍면·마을명이나 주소 문자열로 맞춰 이어야 한다.
limits: 좌표나 표준 행정코드가 없어 지도 표시나 다른 데이터와 연결하려면 주소를 따로 변환해야 한다. 범위는 해남군 한 곳뿐이라 다른 시군과 비교하려면 지자체별 파일을 따로 모아야 한다.
