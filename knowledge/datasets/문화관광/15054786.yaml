summary_user: 광주광역시 시 체육회와 5개 자치구·자치구 체육회가 운영하는 생활체육 프로그램을 종목·운영장소·요일·시간 단위로 정리한 파일(csv, 약 3.7KB)이다. 시민이 "우리 구에서 배드민턴 강좌를 언제 어디서 들을 수 있나"처럼 원하는 종목의 장소와 시간을 찾는 데 쓴다. 전역 조인 키는 없고, 자치구 이름이나 운영장소 이름으로 공공 체육시설 현황 같은 데이터와 맞춰 이어 쓴다.
description_portal: 본 자료는(생활체육프로그램 운영) 광주광역시 1인 1운동 갖기를 위한 생활체육 프로그램 운영현황에 대한 데이터입니다.시 체육회와 5개 자치구 및 5개 자치구별 체육회를 통해 운영되고 있는 프로그램별 운영 장소, 운영 시간 등의 항목을 제공합니다.해당 장소와 시간에 방문하시면 누구가 강좌에 등록하실 수 있고 강좌를 수강하실 수 있습니다.시민 1인 1종목 갖기를 위해  록에 첨부된 자료를 보시고 원하시는 종목의 장소와 시간을 확인하시고 시민여러분의 많은 관심과 지원을 부탁드립니다.
