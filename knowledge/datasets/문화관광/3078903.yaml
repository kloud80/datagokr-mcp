summary_user: 부산진구가 지역 주민 대상으로 운영하는 생활체육교실 강좌를 강좌 1건당 1행으로 담은 원천 목록 파일로, 교육기간·시간·운영요일·장소·정원·접수기간과 접수·선정 방법을 포함한다. 부산진구 주민이 '가까운 곳에서 평일에 들을 수 있는 배드민턴이나 라인댄스 강좌가 있는지, 언제 어떻게 신청하는지'를 확인하거나, 분석가가 구 단위 생활체육 강좌 공급 현황을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 운영장소·운영기관명 같은 이름 매칭이나 같은 기관(부산진구) 기준으로만 이어 쓴다.
description_portal: '이 엑셀파일은 「부산광역시 부산진구 생활체육프로그램 정보(2025년 7월 기준)」로, 지역 주민을 대상으로 운영되는 생활체육교실의 강좌 정보를 담고 있습니다. 주요 항목으로는 강좌명, 교육기간(시작일·종료일), 교육시간, 대상(지역주민), 운영요일, 운영장소, 정원수, 운영기관명 및 전화번호, 접수기간, 접수방법(인터넷), 선정방법(선착순) 등이 포함되어 있습니다. 예컨대 라인댄스, 한국무용율동, 댄스스포츠, 여성풋살, 배드민턴 등 다양한 프로그램이 주중에 걸쳐 운영되며, 대부분 정원은 15~20명 내외입니다. 데이터 기준일은 2025년 7월 1일입니다. 국민의 체력증진을 위한 부산진구 생활체육프로그램 정보를 제공하고있습니다. - 제공정보 : 생활체육 프로그램 강좌명, 교육일, 교육대상, 장소 정보, 상담 전화번호, 운영기관명 등'
