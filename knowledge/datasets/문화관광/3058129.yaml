summary_user: 올림픽·아시안게임·세계대학경기대회 등 국제종합경기대회를 대회 한 건당 한 행으로 정리한 CSV 파일(약 15KB)로, 대회명·개최국·개최도시·개막일·폐막일과 한국의 금·은·동메달 수, 한국 선수·임원 수, 전체 참가국·참가인원, 비고를 담는다. 분석가나 기자가 '역대 아시안게임에서 한국 선수단 규모와 메달 수는 어떻게 변해 왔나' 같은 질문에 대회별 성적 추이를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 체육 데이터와는 대회명·개최연도(개막일) 같은 이름·날짜 매칭으로만 이어 쓴다.
description_portal: 대한체육회에서 제공하는 이 데이터는 올림픽, 아시안게임, 세계대학경기대회 등 국제종합대회에 대한 상세한 기록을 담고 있습니다. 대회명을 비롯하여 개최국, 개최도시, 개막일, 폐막일 등 기본적인 행사 정보를 제공합니다. 특히, 한국 선수단의 성과를 파악할 수 있는 한국 금메달, 은메달, 동메달 수를 비롯해 참가 규모를 확인할 수 있도록 한국 선수 및 임원 수를 포함하고 있습니다. 또한, 해당 대회의 전체적인 규모를 알 수 있는 전체 참가국과 전체 참가인원 정보도 함께 제공됩니다. 비고란에는 특이사항이 기록되어 있습니다.
