summary_user: 전북특별자치도 남원시에 신고된 인쇄업체를 한 행에 한 곳씩 담은 원천 목록으로, 신고일자·사업체 명칭·소재지·전화번호·대표자 성명·업종을 담는다(csv 약 3.7KB 규모의 소규모 파일). 남원에서 포스터·현수막·팜플렛을 맡길 인쇄소를 찾는 시민이나 지역 인쇄업 현황을 보려는 담당자가 '남원 시내 어디에 어떤 인쇄업체가 있나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 사업체 명칭·소재지 주소를 문자열로 맞추거나 같은 남원시 자료끼리만 이어 쓴다.
description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에 등록된 인쇄업체들의 현황을 체계적으로 정리한 공공데이터입니다. 포스터, 팜플렛, 현수막 등 다양한 홍보물 제작과 인쇄대행 서비스를 제공하는 사업체들의 기본 정보를 담고 있으며, 지역 내 인쇄산업의 현황을 파악하고 시민들의 인쇄서비스 접근성을 높이기 위해 구축되었습니다. 행정기관의 효율적인 업체 관리와 시민들의 업체 선택에 도움을 줄 수 있는 신뢰할 수 있는 정보를 제공합니다.2. 데이터 항목명- 신고일자- 사업체명칭- 사업체소재지- 전화번호- 성명- 업종3. 기대효과지역 인쇄업체 정보를 투명하게 공개함으로써 시민들의 합리적인 업체 선택을 지원하고, 지역 소상공인들에게 더 넓은 홍보 기회를 제공할 수 있습니다.
