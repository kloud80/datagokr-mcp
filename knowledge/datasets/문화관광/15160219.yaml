description_portal: '본 데이터는 국가유산 방문자 여권투어에서 방문객에게 배포된 여권의 월별·연도별 배포 현황을 제공하는 데이터입니다.국가유산진흥원은 국가유산 방문 캠페인의 일환으로 운영되는 국가유산 방문자 여권투어의 운영 현황을 관리하기 위해 방문자 여권의 연도별·월별 배포 현황을 수집·관리하고 있습니다. 본 데이터는 방문자 여권 배포 추이를 정량적으로 분석하고, 국가유산 방문 캠페인 운영 성과와 문화관광 정책 수립을 지원할 수 있도록 구성되어 있습니다.본 데이터는 국가유산 방문 캠페인 운영성과 분석, 문화관광 수요 분석, 지역관광 활성화 정책 수립, 방문객 추이 분석, 관광통계 작성, 공공데이터 분석 및 연구 등 다양한 분야에서 활용할 수 있습니다. 특히 국가유산 방문객 유입 변화와 방문자 여권 활용 현황을 분석하는 기초자료로 활용이 가능합니다.제공 항목은 다음과 같습니다.연도 : 해당 통계의 기준 연도월 : 해당 통계의 기준 월구분 : 국문 여권 / 외국어 여권 / 한정판 여권배포수량 : 월별 방문자 여권 배포수량(권)합계 : 연도별 누적 배포수량(권)국가유산 방문자 여권은 2023년 국가유산 방문 캠페인 시작과 함께 운영되었으며, 2024년 국가유산법 시행에 따른 방문자 여권 전면 개편으로 당해년도 5월부터 배포가 재개되었습니다.데이터는 연 1회 정기적으로 현행화되며, 국가유산 방문자 여권투어에 대한 자세한 내용은 아래 홈페이지를 참고하시기 바랍니다.국가유산 방문 캠페인 : https://visitkoreanheritage.kr'
legal_basis_portal: 국가유산 방문 캠페인 운영 과정에서 생성·관리되는 행정데이터로 국가유산진흥원이 업무 수행을 위해 지속적으로 생산·관리하는 공공데이터입니다.
