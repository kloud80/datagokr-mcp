summary_user: 경상남도 창녕군 안의 공공 체육시설을 시설 한 곳당 한 행으로 담은 소규모 CSV 목록(약 4.6KB)으로, 전문·생활체육시설 구분(종류), 시설 명칭, 도로명 또는 지번 주소, 건축 구조·면적·경기장 수 같은 세부 내역을 담는다. 창녕군 주민이나 생활체육 동호인이 '군내에 어떤 운동장·체육관이 어디에 있고 규모가 어떤가'를 확인할 때, 또는 지역 체육 인프라 현황을 정리하는 분석가가 쓴다. 실측 컬럼에 시설 코드 같은 전역 조인 키가 없어서 다른 데이터와는 시설 명칭이나 주소 문자열을 맞춰서만 이어 쓸 수 있다.
description_portal: 경상남도 창녕군에 위치한 체육시설 현황에 대한 정보입니다.1. 해당 자료는 체육시설의 종류(전문체육시설 또는 생활체육시설 구분), 시설의 공식 명칭, 위치 정보(도로명 주소를 우선하며, 없는 경우 지번 주소로 표기), 각 시설의 세부 내역(건축물 구조 및 면적, 트랙이나 경기장 수, 보조 시설 현황 등)을 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 18일이며, 업데이트 주기는 1년입니다.3. 자료에 대한 문의나 세부 정보가 필요하신 경우에는 창녕군청 관광환경국 관광체육과 체육지원팀(055-530-1484)으로 연락 주시기 바랍니다.
