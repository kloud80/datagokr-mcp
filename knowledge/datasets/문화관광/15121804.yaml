summary_user: 인천 서구(서해구) 관내에 신고된 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명 주소·객실수·신고일자·영업 시작일·전화번호가 들어 있다. 관광객이나 주민이 '서구에 객실이 많은 숙박업소는 어디 있나'를 찾을 때 쓰고, 분석가는 업종별 업소 수와 객실 규모를 볼 때 쓴다. 전역 조인 키가 없어서 다른 데이터와는 업소명이나 도로명 주소를 맞춰 붙여야 하고, 공중위생 영업신고 원천인 지방행정 인허가 데이터(LOCALDATA)의 숙박업 자료와 대조할 수 있다.
description_portal: 본 공공데이터는 인천광역시 서구 관내에 등록된 숙박업소의 세부 현황을 수록한 자료입니다. 본 자료는 인천광역시 서구 내 숙박업소의 업소명, 업종 구분, 도로명 주소, 객실 수, 영업 개시일, 신고일자, 전화번호 등의 항목을 포함하고 있습니다. 본 데이터를 통해 숙박시설 이용을 원하는 시민과 관광객에게 편의를 제공할 수 있으며, 지방자치단체는 이를 기반으로 숙박업소 분포, 위생관리 상태 등을 파악하여 도시계획 및 관광정책 수립에 활용 될수 있을것입니다. 본 데이터는 매년마다 정기적인 갱신을 통해 최신정보를 반영하고 있습니다.
