summary_user: 경기도 내 주요 무장애 관광지별로 장애인 화장실·엘리베이터·장애인 주차장·경사로·휠체어 대여·촉지도식 안내판·오디오 가이드·수유실·유아차 대여 등 관광약자 편의시설의 유무를 관광지 한 곳당 한 행으로 담은 CSV 파일(약 2KB)이다. 장애인·고령자·영유아 동반 가족이 '이 관광지에 휠체어로 갈 수 있고 장애인 화장실과 수유실이 있는가'를 확인해 여행지를 고르거나, 분석가가 경기도 무장애 관광지의 시설 갖춤 정도를 비교하는 데 쓴다. 실측 컬럼에 관광지 코드(contentId 등) 같은 공통 조인 키가 없어서, TourAPI 관광지 정보나 다른 관광 데이터와는 관광지명을 맞춰서 이어 써야 한다.
description_portal: 해당 데이터는 경기관광공사가 제공하는 경기도 내 주요 무장애 관광지의 편의시설 현황 정보를 담고 있으며, 관광약자(장애인, 고령자, 영유아 동반자 등)의 이동 편의와 접근성을 위한 시설 유무를 CSV 파일로 제공합니다. 주요 항목으로는 관광지명, 장애인 화장실, 엘리베이터, 장애인 주차장, 경사로, 지하철, 버스정류장, 휠체어 대여, 촉지도식 안내판 설치, 오디오 가이드, 아기돌봄, 수유실, 무장애 객실, 유아차 대여 등이 포함되며, 각 항목은 시설 유무 형태로 제공됩니다. 본 데이터는 관광약자의 정보 접근성과 여행 계획 수립을 지원하며, 공공서비스 개선, 관광지 접근성 평가, 무장애 관광 환경 조성 등을 위한 기초자료로 활용 가능합니다.
