summary_user: 대구광역시 남구에 있는 국가유산을 한 건씩 정리한 목록으로, 보물·국가등록문화유산·대구광역시 지정 유산 등 종목, 유산명, 수량·면적, 소재지, 지정일자를 담으며 1,304바이트 크기의 작은 CSV 파일이다. 남구 주민이나 지역 연구자가 '우리 구에 어떤 지정·등록 유산이 있고 언제 지정됐는가'를 확인할 때 쓴다. 전역 조인 키(국가유산청의 종목코드·지정번호 등)가 없어 국가유산청 API나 다른 자료와는 유산명·소재지 주소를 맞춰 이어 써야 한다.
description_portal: 대구광역시 남구 내에 위치한 국가유산 현황에 대해 정리한 자료를 공공데이터포털을 통해 제공합니다. 종목(보물, 국가등록문화유산, 대구광역시유형문화유산, 대구광역시무형유산, 대구광역시기념물, 대구광역시문화유산자료), 국가유산명(지장시왕도, 대봉배수지, 판소리, 대덕산성 등), 수량/면적, 소재지, 지정일자 항목으로 구성되어 있으며 1년 주기에 따라 최신 정보를 반영하여 업데이트 합니다. 일부 데이터는 정보 미보유 및 미수집 등의 사유로 정보가 부존재함을 알려드리오니, 참고하시기 바랍니다.
