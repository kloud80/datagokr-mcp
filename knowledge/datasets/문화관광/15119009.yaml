description_portal: '국민의 여가활동 실태와 변화 양상을 체계적이고 과학적으로 파악하기 위해 실시된 「국민여가활동조사」의 원시데이터와 코드북을 제공합니다. 본 조사는 2006년부터 2022년까지 2년 주기로 시행되었으며, 국민의 여가시간 활용, 활동 유형, 참여 빈도, 만족도, 제약 요인 등 다양한 항목을 포함합니다. 해당 자료는 국민 여가생활의 구조적 변화와 트렌드를 분석하고 정책 효과성을 검증하며, 문화·관광·체육 등 다방면의 연구 및 산업 서비스 기획에 활용될 수 있습니다. 학계 연구자, 정책 담당자, 기업 및 기관 종사자 등에게 공공정책 평가, 사회통계 연구, 여가산업 전략 수립 등 실질적인 의사결정 자료로 제공되는 중요한 국가 통계 기반 자료입니다.(제공년도 : 2006년, 2008년, 2010년, 2012년, 2014년, 2016년, 2018년, 2019년, 2020년, 2021년, 2022년)'
