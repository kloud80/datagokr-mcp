summary_user: 부산광역시 남구에 등록된 게임제공업소(오락실, PC방, 성인오락실, 뽑기방 등)를 업소 한 곳당 한 행으로 담은 파일로, 상호·도로명 소재지·업종명·영업상태가 들어 있다(csv 약 6.6KB, 포털 설명상 2025.9.12. 기준). 남구 안에서 PC방이나 오락실이 어디에 몰려 있는지, 지금 영업 중인 곳이 어디인지 확인하려는 주민·창업자·청소년 보호 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 상호를 맞춰 붙이거나 같은 기관(부산 남구) 자료끼리만 이어 쓴다.
description_portal: 부산광역시 남구 게임업 현황 데이터입니다.2025.9.12. 자 기준 부산광역시 남구 내에 등록된 게임 관련 업소의 기본 정보를 제공하는 공공데이터 입니다.게임업에는 오락실, pc방, 성인오락실, 뽑기방 등 이 포함되며, 각 업소의 상호명, 주소, 운영상태, 등이 수록됩니다.본 자료는 게임 관련 시설 분포를 파악하고 문화 및 여가시설의 관리, 청소년 보호정책, 지역 상권 분석, 경제 지표 등 여러방면으로 활용 될 수 있습니다.(게임업에는 청소년 이용불가 게임물과 전체이용가 게임물이 포함되어있습니다)
