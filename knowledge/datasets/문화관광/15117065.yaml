summary_user: 경기도에서 생존수영 교육을 하는 수영장을 한 곳씩 담은 목록으로, 관할 교육지원청, 수영장 구분(공공·사설·사립), 수영장명, 주소로 이루어져 있다. 학부모나 교육 담당자가 "우리 지역 교육지원청 관할에서 생존수영 강습을 받을 수 있는 수영장은 어디이고, 공공시설인가 민간시설인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 수영장명·주소 같은 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 생존수영 교육을 실시하는 수영장의 현황을 정리한 자료로, 교육지원청명, 수영장 구분(공공, 사설, 사립), 수영장명, 수영장 주소로 구성되어 있습니다. 경기도 내 각 지역에 분포된 수영장을 기반으로 생존수영 교육이 실시되는 장소를 파악할 수 있으며, 공공 체육시설과 민간 운영시설을 함께 포함하여 수영교육 인프라의 다양성과 분포를 확인할 수 있습니다. 해당 데이터는 학생 대상 안전교육 계획 수립, 지역별 교육격차 해소, 교육자원 배분, 체육시설 운영 정책 개선 등의 기초 자료로 활용될 수 있습니다. 또한 수영장 위치 정보는 공간분석 기반 교육 인프라 시각화 및 접근성 평가 등에도 유용합니다.
