description_portal: 광주광역시립미술관에서는 본관을 비롯하여 다양한 분관 및 전시 공간에서 연중 다채로운 전시 프로그램을 운영하고 있습니다. 본관에서는 ‘광주비엔날레 네덜란드 파빌리온전’ 등 국내외 현대미술의 흐름을 반영한 주요 전시가 열리며, 사진전시관에서는 다양한 주제의 사진 작품들을 통해 현대 사진예술의 경향을 소개하고 있습니다. 하정웅미술관에서는 ‘하정웅 청년작가 초대전 <빛2023>’과 같이 젊은 작가들을 발굴하고 지원하는 전시가 진행되어 미래 세대 예술가들의 창작 활동을 조명하고 있습니다. 또한 광주미디어아트센터에서는 ‘광주비엔날레 이스라엘 파빌리온전’ 등 기술과 예술의 융합을 선보이는 실험적인 미디어아트 전시가 운영되고 있습니다. 이처럼 각 공간별로 특색 있는 전시들이 예정되어 있으며, 이에 대한 자세한 일정과 내용은 광주시립미술관 공식 홈페이지를 통해 확인할 수 있습니다.
