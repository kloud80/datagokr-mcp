summary_user: 경상북도교육연수원 도서관이 소장한 도서를 한 권(행)씩 서명·저자·출판사·출판년으로 정리한 소장 목록 파일(CSV 약 1.9MB)이다. 경북교육청 소속 교직원이나 연수생이 '연수원 도서관에 이 책이 있는지, 어느 출판사·몇 년판인지'를 확인하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 공통 조인 키가 없어, 다른 도서관 목록이나 국가서지와는 서명·저자 문자열 매칭으로만 이어 쓴다.
description_portal: 경북교육연수원에서 연수생 및 내부 직원의 직무역량 및 내적 역량 함량을 위하여 도서분류법에 의해 철학, 종교, 사회과학, 자연과학, 기술과학, 예술, 언어, 문학, 역사, 사전, 전집 및 잡지, 영상매체, 마이크로필름 등의 소장 도서를운영하고 있으며, 운영하고 있는 도서의 목록을 추천도서, 이달의 도서, 신간도서, 인문학, 교직원, 청소년에 대한 도서를 분류별 도서목록을 정리하고 관리중. 경상북도교육청 소속 교직원이면 누구나 열람하고 대출할 수 있으며, 교육.업무.여가 선용에도 중요한 역할을 한다.  공공데이터 목록등록 관리시스템에는 경북교육청 연수원 내 도서관에 소장 중인 도서 목록 현황을 정리하여 공개하고 있음.
