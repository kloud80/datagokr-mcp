summary_user: 국립세종도서관 사서가 직접 고른 추천도서를 한 권씩 담은 목록으로, 서명·저자·등록일·주제 분류와 주제어·내용 소개·언어·저작권·상세 페이지 주소 등을 함께 제공하며 범위는 전국·비공간이다. 독서 활동가나 교사가 "이번 달 사서가 추천한 사회과학 분야 책은 무엇인가"를 찾아 독서 목록이나 수업 자료를 꾸리는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어서, 도서관정보나루의 인기·대출 도서 데이터와는 서명·저자 이름을 맞춰 연결해야 한다.
description_portal: 국립세종도서관에서 사서가 직접 선정한 추천도서의 목록과 상세 정보를 체계적으로 제공합니다. 도서의 명칭, 책임자, 등록일, 주제 분류, 핵심 주제어, 내용, 관련 장소, 시간적 범위, 언어, 저작권, 위치 정보 등 다양한 항목을 포함하고 있어 도서관 이용자뿐만 아니라 연구자, 교육자, 독서 활동가 등에게 유용하게 활용될 수 있습니다. 추천도서 선정 기준과 관련 정보가 함께 제공되어 독서 자료 선택에 도움을 주며, 도서관 서비스 개선 및 독서 문화 확산에도 기여할 수 있습니다. 또한, 도서관 자료 관리 및 정보 제공의 효율성을 높이고, 다양한 분야에서 참고 자료로 활용하기에 적합합니다.
