description_portal: 전북특별자치도 내에 지정된 '예비 사회적기업'과 인증받은 '사회적기업'의 현황을 정리한 데이터입니다. 이 자료는 취약계층에게 일자리나 사회서비스를 제공하는 등 사회적 목적을 추구하며 영업 활동을 수행하는 기업들의 목록입니다. 각 기업의 명칭과 소재지, 주요 업종, 그리고 지정 및 인증 일자 정보를 포함하고 있어, 지역 내 사회적경제 생태계의 규모와 현황을 파악하는 데 유용합니다. 윤리적 소비에 관심 있는 시민이나 사회적 가치를 추구하는 투자자에게는 의미 있는 기업 정보를 제공하며, 지역사회의 긍정적인 변화를 이끌어가는 주체들을 확인할 수 있는 중요한 자료입니다.
