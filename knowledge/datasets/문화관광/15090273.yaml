summary_user: 부산광역시 영도구에 있는 공립·사립 작은도서관을 도서관 한 곳당 한 행으로 담은 목록 파일(약 4KB CSV)로, 도서관유형·운영주체·도로명 주소·휴관일·평일/토요일/공휴일 운영시간·열람좌석수·도서 자료수·대출 가능 권수와 일수·면적(제곱미터)을 담는다. 영도구 주민이 '토요일에 문을 열고 우리 동네에서 가까운 작은도서관이 어디인가'를 찾거나, 분석가가 작은도서관의 좌석·장서 규모와 운영 특성을 비교하는 데 쓴다. 도서관코드 같은 전역 조인 키가 없어 다른 데이터와는 도서관명·도로명 주소 매칭이나 시도명·시군구명 기준으로만 이어 쓴다.
description_portal: '2026년 7월 기준 부산광역시 영도구에 위치한 공립 및 사립 작은도서관의 운영 현황을 확인할 수 있는 데이터입니다.각 작은도서관 명칭, 도서관유형, 도로명 주소, 운영주체(공립, 사립), 휴관일, 평일 운영 시작 시간, 평일 운영 종료 시간, 연락처(시설 전화번호), 시설 면적 등과 같이 도서관을 탐색하고 비교하는 데 필요한 주요 기본 정보를 제공합니다.* 시설면적 단위: 제곱미터이를 통해 일상적인 영도구 작은도서관 이용에 필요한 핵심 정보를 얻을 수 있으며, 이를 활용하여 접근성, 운영 특성 등을 파악하고 비교할 수 있습니다.'
