description_portal: '본 데이터는 지정문화재의 해제 정보에 대한 상세 기록을 제공합니다. 이는 경상북도에서 기존에 도 지정 문화재로 등록 및 관리되던 문화유산에 대해 지정 해제 또는 등급 조정 등의 행정 처분이 이루어진 현황을 파악하는 데 목적이 있습니다.주요 내용으로는 해제된 문화재의 종 별 구분과 지정번호가 포함되며, 해당 유산의 명칭인 문 화 재 명과 수 량 정보가 기록되어 있습니다. 문화재의 관리 주체인 소 유 자 및 유산의 위치인 소 재 지 정보가 제공됩니다. 핵심적으로, 해당 문화재의 지정 효력이 상실된 해제일자와 해제 사유를 나타내는 비 고 (예: 민속 문화재로 승격, 등급 조정 등) 정보가 상세히 포함되어 있습니다.이 자료는 문화재 지정 및 해제 이력의 투명한 공개를 통해 문화유산 관리 정책의 변화를 이해하는 데 도움을 줍니다. 또한, 지역 문화유산의 보존 및 관리 정책 연구, 문화유산 목록 갱신 등에 귀중한 기초 자료로 활용됩니다.'
