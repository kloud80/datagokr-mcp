summary_user: 광주광역시 북구에 있는 실외체육시설(게이트볼장·론볼장·배드민턴장·야구장·운동장·족구장·축구장·풋살장 등)을 시설 한 곳당 한 행으로 담은 CSV 파일(약 3KB)이며, 시설구분·시설명·지번주소·규격·바닥재·관리기관을 담는다. 북구 주민이나 생활체육 동호회가 '우리 동네 근처에 인조잔디 풋살장이나 족구장이 어디 있고 누가 관리하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 지번주소를 지오코딩하거나 시설명·관리기관 이름을 맞춰 이어 써야 하며, 문체부 전국체육시설 데이터 등과 연결할 때도 이름 매핑이 필요하다.
description_portal: 광주광역시 북구 실외체육시설현황 데이터입니다.광주광역시 북구에 위치한 실외체육시설의 시설구분, 시설명, 지번주소, 규격, 바닥재, 관리기관[광주광역시 북구청, 광주광역시 북구 장애인체육회, 광주광역시 시설관리공단], 데이터기준일의 항목에 대한 정보를 공공데이터포털에 CSV 파일로 제공합니다.* 야외시설 특성상 시설 위치에 도로명주소가 부여되지 않은 경우가 많아 도로명주소 없이 지번주소 데이터만을 제공합니다.※ 광주광역시 북구 내 실외체육시설 시설구분(가나다순) - 게이트볼장 - 론볼장 - 배드민턴장 - 야구장 - 운동장 - 족구장 - 축구장 - 풋살장
