summary_user: 경기도 내 사찰·사적지·유적지·고분·묘역 등 역사관광지를 한 곳당 한 행으로 담은 목록으로, 관광지명·시군명·도로명/지번 주소·우편번호·전화번호·기준일자와 WGS84 위경도 좌표를 포함한다. 여행자나 교육·탐방 프로그램 기획자가 '우리 시군에 있는 역사 유적지는 어디이고 어떻게 찾아가나'를 확인하거나 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 시군명이나 관광지명 문자열, 위경도 좌표를 기준으로 다른 문화재·관광 데이터와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경기도 내 주요 역사·문화 자원을 중심으로 한 역사관광지 정보를 포함하며, 각 관광지의 명칭(관광정보명), 관할 시군명, 정제된 도로명 및 지번 주소, 전화번호, 기준일자, 공간정보(WGS84 기준의 위도 및 경도 좌표)를 제공합니다. 사찰, 사적지, 유적지, 고분, 묘역 등 다양한 역사적 장소를 포함하고 있어, 지역문화유산 관리, 문화재 안내 시스템, 역사관광 콘텐츠 개발 등에 유용하게 활용될 수 있습니다. 또한 교육용 자료 및 역사탐방 프로그램 기획, 문화재 보존 및 활용 정책 수립의 기초자료로서도 활용 가능합니다.
