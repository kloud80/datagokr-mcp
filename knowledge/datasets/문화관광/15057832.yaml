summary_user: 경기도 내 문화예술회관을 회관 한 곳당 한 행으로 담아, 개관일·연면적·공연장별 객석수와 면적·전시장 규모·인력 같은 시설 구성과 공연일수·전시일수·유료관객수·총이용자수 같은 운영 실적, 도로명·지번 주소와 위경도 좌표를 제공한다. 분석가나 정책 담당자가 '경기도 시군별로 대공연장 객석 수와 연간 관객 수가 어떻게 차이 나는가' 같은 지역 문화 인프라 비교나 운영성과 평가에 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 회관 이름으로 다른 문화시설 자료와 맞추고, 좌표로 상권·지역 문화 분포 자료와 공간적으로 겹쳐 쓴다.
description_portal: 문화예술회관 현황은 경기도가 제공하는 문화예술 기반시설 정보로, 도내 문화예술회관의 위치와 시설구성, 운영 실적 등을 포함한 상세 데이터를 제공합니다. 각 회관의 명칭(FACLT_NM), 개관일자(OPEN_DE), 연면적(TOT_AR), 공연장 및 전시장 규모(SYNTH_PERFORM_PLC_AR, EXHBTNHL_AR 등), 객석수(SYNTH_PERFORM_PLC_SEAT_CNT, SM_PERFORM_PLC_SEAT_CNT), 운영기관명(OPERT_INST_NM), 운영유형(OPERT_INST_TYPE) 등을 포함하고 있습니다. 또한 위치정보(REFINE_ROADNM_ADDR, REFINE_LOTNO_ADDR, REFINE_ZIP_CD, REFINE_WGS84_LAT, REFINE_WGS84_LOGT)와 더불어 공연일수(PERFORM_DAY_CNT), 전시일수(EXHIBIT_DAY_CNT), 관객수(PERFORM_PAYCHRG_AUDINC_CNT, TOT_USER_CNT) 등 실적 기반 항목도 제공됩니다. 이 데이터는 문화예술 기반시설의 분포 및 운영성과를 평가하거나, 지역 간 문화 인프라 비교 분석, 문화정책 기초자료 등으로 활용할 수 있습니다.
