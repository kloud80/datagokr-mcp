description_portal: '전라남도 해남군 해남문화예술회관 휴관일에 대한 데이터입니다.데이터 항목: 연번, 휴관일, 사유휴관일: 매주 월요일(정기휴무), 법정공휴일 등해남문화예술회관은2000년 4월에 개관하였으며 다양한 문화의 생산과 공급자로서의 역할을 충실히 하기 위해 해남군청과 붙어 있으며 앞에는 해남광장이 있습니다.시설은 지하1층에 탁구장, 헬스장 등 생활문화 체육시설이 있으며, 1층은 대공연장, 다목적실, 전시실, 2층은 무용연습실과 문화의집3층은 어린이 자료실, 4층과 5층은 자료실이 위치해 있습니다.'
