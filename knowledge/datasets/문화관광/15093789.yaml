summary_user: 빅카인즈(BIGKinds)에서 모은 민주주의 관련 뉴스 기사를 기사 한 건당 한 행으로 담은 메타정보 파일로, 일자·언론사·제목·통합분류·키워드·특성추출 등이 들어 있고 범위는 전국·비공간이다. 연구자나 언론·정책 분석가가 "특정 시기에 어느 언론사가 민주주의·선거제도·정치개혁을 어떤 키워드로 보도했는가"를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 언론사 이름이나 일자, 키워드 같은 값 매칭으로만 잇는다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 민주주의 관련 뉴스 메타정보 자료입니다. 민주주의는 현대 정치 체제의 핵심 원리로, 시민의 자유와 권리 보장, 선거 제도 운영, 권력 분립, 정치 개혁 및 참여 확대와 직결된 중요한 가치입니다. 본 자료에는 기사별 주소, 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 사건/사고, 개체명(인물·지역·기업), 키워드, 특성추출, 본문, 원본주소 등의 정보가 포함되어 있어, 언론 보도 속에서 민주주의 담론이 어떻게 전개되었는지를 다각도로 분석할 수 있습니다. 이를 통해 특정 시기별 민주주의 발전 논의, 제도 개혁 방향, 시민사회와 정치권의 역할, 민주주의 위기 및 도전 요인이 언론에 어떻게 반영되었는지 객관적으로 확인할 수 있습니다. 또한 학술 연구, 정치·법학 교육, 정책 분석, 언론 보도 연구 등 다양한 분야에서 활용할 수 있는 기초 자료로, 민주주의의 현재와 미래를 탐구하는 데 중요한 참고 자료가 됩니다.
