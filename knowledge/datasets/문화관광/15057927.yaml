summary_user: 경기도 내 30실 이상 일반호텔(관광진흥법상 관광호텔·수상관광호텔·한국전통호텔 제외)의 인허가 현황을 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 시군명·인허가일자·영업상태·폐업일자·양실·한실 객실 수·주소·WGS84 좌표가 들어 있다. 숙박 사업자나 분석가가 "우리 시군에서 지금 영업 중인 일반호텔은 몇 곳이고 객실은 얼마나 되나"처럼 지역별 숙박 공급 규모와 개·폐업 흐름을 볼 때 쓴다. 실측상 전역 조인 키는 없어서 시군 코드·시군명(SIGUN_CD)이나 주소·좌표로 다른 경기도 데이터와 맞춰 붙이고, 같은 공중위생법 신고 원천(LOCALDATA)에서 나온 다른 숙박업 인허가 데이터와는 업소명·주소로 대조한다.
description_portal: 이 데이터는 경기도 내 숙박업체 중 일반호텔의 인허가 현황을 제공하며, 관광진흥법에 등록된 관광호텔·수상관광호텔·한국전통호텔을 제외한 30실 이상의 일반호텔을 대상으로 합니다. 주요 항목에는 ‘시군명’, ‘사업장명’, ‘인허가일자’, ‘영업상태명’, ‘폐업일자’, ‘소재지도로명주소’, ‘위생업종명’, ‘위생업태명’, ‘건물소유구분명’, ‘양실수’, ‘한실수’, ‘다중이용업소여부’, ‘소재지면적’, ‘우편번호’, ‘WGS84 위도·경도’ 등이 포함됩니다. 이를 통해 일반호텔의 위치, 운영 현황, 객실 규모, 위생 관리, 건물 소유 형태 및 다중이용 여부를 종합적으로 파악할 수 있습니다. 데이터는 경기도 31개 시군 단위로 제공되며, 지역별 숙박 인프라 현황 분석, 관광객 수용능력 평가, 숙박 산업 정책 수립, 안전 관리 및 위생 점검 자료로 활용될 수 있습니다. 또한 관광산업 활성화 전략, 지역경제 기여도 분석, 숙박시설 품질 개선에도 기여할 수 있습니다.
