summary_user: 경상남도 안의 인허가 공연장을 사업장 1곳당 1행으로 담은 2022년 기준 현황 파일로, 사업장명·지번/도로명 주소·인허가일자·영업상태·상세영업상태 6개 항목에 총 77건이 들어 있다. 문화정책 담당자나 분석가가 '경남 시군별로 영업 중인 공연장이 몇 곳이고 언제 인허가를 받았는가'를 파악할 때 쓴다. 공통 조인 키가 없어 KOPIS 공연장ID(mt10id) 같은 다른 공연 데이터와는 사업장명·주소를 맞춰 이어 써야 한다.
description_portal: (데이터 수집목적 및 과정) 경상남도 인허가 공연장 데이터는 경남빅데이터허브플랫폼 데이터베이스에서 관리하고 있는 2022년 기준 인허가 공연장 현황입니다. 경상남도 인허가 공연장에 대한 현황 정보를 파악할 때 활용 할 수 있습니다.(데이터 구성 및 세부항목) 인허가 공연장 데이터는 사업장명, 지번주소, 도로명 주소, 인허가일자, 영업상태, 상세영업상태로 구성됩니다. 총 77건입니다. 미집계 데이터는 공란 처리합니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터이며 현행화 되지 않습니다.
