summary_user: 부산광역시 금정구 관내 공연장을 한 곳당 한 행으로 담은 파일로, 공연장 명칭·지번/도로명 소재지·전화번호·객석수·등록일자를 담으며 받은 CSV는 892바이트의 작은 목록이다. 금정구 주민이나 공연 기획자가 '금정구에 객석 몇 석 규모의 공연장이 어디에 있고 연락처는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연장ID(mt10id) 같은 코드로 바로 잇지 못하고, 공연장 명칭이나 주소를 맞춰서만 다른 공연·문화시설 데이터와 연결한다.
