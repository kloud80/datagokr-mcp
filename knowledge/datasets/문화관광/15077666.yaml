summary_user: 경기도 안의 박물관·미술관·공연장·문화센터·기념관 같은 문화시설을 시설 한 곳당 한 행으로 담은 목록이며, 시군명·전화번호·도로명/지번 주소·우편번호·WGS84 위경도·기준일자를 함께 담는다. 주민이나 분석가가 '우리 시군에는 공연장과 미술관이 몇 곳이고 어디에 있는가'를 확인하거나 문화시설 위치 안내에 쓴다. 전역 조인 키는 없으므로 다른 데이터와는 시군명이나 주소·좌표를 기준으로 이름을 맞춰 연결한다.
description_portal: 이 데이터는 경기도 내의 다양한 문화시설 정보를 포함하고 있으며, 각 시설의 명칭(시설명), 위치한 시군명, 전화번호, 정제된 도로명 및 지번 주소, 우편번호, 기준일자, 그리고 WGS84 좌표계 기반의 위도 및 경도 정보를 제공합니다. 데이터에는 박물관, 미술관, 공연장, 문화센터, 기념관 등 다양한 유형의 문화시설이 포함되어 있어 지역 문화자원의 현황 분석, 문화시설 위치기반 안내서비스, 문화정책 수립 및 문화관광 콘텐츠 개발 등에 활용할 수 있습니다. 또한 문화 접근성 향상 및 공공문화 서비스 강화 방안 마련에도 기초자료로 활용될 수 있습니다.
