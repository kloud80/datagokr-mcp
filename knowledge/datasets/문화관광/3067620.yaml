summary_user: 서귀포시 관내 공공 체육시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설 구분(경기장·체육관 등)·명칭·운영 종목·위치·전화번호·위경도 좌표가 들어 있다. 서귀포 주민이나 동호인이 '집 근처에서 테니스나 수영을 할 수 있는 공공시설이 어디 있나'를 찾을 때 쓰고, 행정 분석가가 읍면동별 체육시설 분포와 부족 지역을 지도로 확인할 때도 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없으므로, 위도·경도로 공간 결합하거나 위치 주소·시설명을 맞춰 문체부 전국체육시설 자료 등과 연결한다.
limits: 서귀포시 한 개 시만 포함하므로 제주시나 다른 지역과 비교하려면 별도 자료를 모아야 한다. 예약·대관 정보는 들어 있지 않다. 표준 코드 키가 없어 다른 자료와 연결할 때는 이름·주소 매칭 오차에 주의해야 한다.
