summary_user: 서울시립미술관에서 열린 전시를 한 건씩 담은 원천 목록으로, 전시명·부제·장소·기간·관람시간·관람료·출품작가·작품수·전시설명·대표이미지·바로가기 링크를 전시번호(DP_EX_NO)와 일련번호 단위로 제공한다. 시민이 '지금 서울시립미술관에서 무슨 전시를 언제까지, 얼마에 볼 수 있나'를 확인하거나, 분석가·서비스 개발자가 전시 안내·홍보 콘텐츠를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키(공연예술 ID나 문화시설 코드 등)가 없어 다른 데이터와는 전시명·장소명 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 서울시립미술관 전시 정보는 서울시립미술관에서 개최된 전시회의 주요 내용을 종합적으로 제공하는 데이터입니다. 전시번호와 전시일련번호를 통해 각 전시를 식별할 수 있으며, 전시회명과 전시부제, 전시장소 정보로 어떤 전시가 어디에서 열렸는지 알 수 있습니다. 전시기간, 관람시간, 관람료 항목은 시민들이 실제 관람 계획을 세우는 데 필요한 실질적인 정보를 제공합니다. 부대행사, 주최 및 후원 정보는 전시와 연계된 프로그램과 참여 기관을 확인할 수 있게 해줍니다. 전시부문, 작품수, 출품작가, 관람포인트, 전시설명은 전시의 성격과 내용, 특징을 이해하는 데 중요한 자료입니다. 대표이미지와 바로가기 링크는 온라인 전시 안내, 홍보 콘텐츠 제작, 웹 서비스 구축 등에 활용할 수 있는 시각 및 접근성 정보를 제공합니다.
