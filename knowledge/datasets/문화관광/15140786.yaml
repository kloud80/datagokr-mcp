summary_user: 광진구에서 인허가를 받은 체력단련장업(헬스장·피트니스 센터 등) 업소를 한 곳씩 담은 건별 인허가 명부로, 사업장명·소재지 주소·인허가일과 취소일·영업상태·폐업일·시설 면적·회원모집 인원 등을 포함한다. 창업 예정자나 상권 분석가가 '광진구에서 최근 문을 연 헬스장과 폐업한 헬스장이 어느 동네에 몰려 있나'처럼 지역 체육시설 공급과 개폐업 흐름을 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·사업장명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 같은 축의 다른 구 체육시설업·상권 데이터와 비교할 때 이 방식으로 연결한다.
description_portal: 서울특별시 광진구_체력단련장업 인허가 정보는 광진구 내에서 허가를 받아 운영 중인 체력단련장의 현황을 담은 데이터입니다. 이 데이터는 헬스장, 피트니스 센터 등과 같이 일반인 또는 회원이 체격관리, 근력 향상, 유산소 및 무산소 운동, 유연성 향상, 지구력 강화 등을 목적으로 이용할 수 있는 운동기구 및 시설을 갖춘 업소의 정보를 포함합니다. 주요 제공 항목은 체력단련장 명칭, 소재지, 인허가 일자, 영업 상태, 업소 형태 등이며, 관할 행정기관의 관리 하에 인허가된 공식 시설만 포함됩니다. 본 정보는 건강관리 및 지역 체육시설 조사, 생활체육 수요 분석, 운동시설 접근성 향상 등의 정책 활용을 위한 기초 자료로 적합합니다. 좌표 정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공되며, 위도 및 경도는 포함되지 않으며, 데이터는 최신 기준으로 3일 전 정보를 반영하고 있습니다.
