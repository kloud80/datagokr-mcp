description_portal: 이 데이터는 종로구 관내 비디오물소극장업의 인허가 관련 행정정보를 포함합니다. 비디오물소극장업은 일반 관람객을 대상으로 비디오물을 상영할 수 있는 소규모 극장업을 말하며, 영상진흥기본법에 따라 일정 기준을 갖추어 인허가를 받아야 합니다. 수록된 항목은 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등으로, 업소의 개설과 운영 상태, 행정처분 이력 등을 확인할 수 있습니다. 지역 내 영상문화 콘텐츠 산업 현황 파악, 유사 업종 정책 수립, 영업 지속성 분석 등에 활용될 수 있습니다.
