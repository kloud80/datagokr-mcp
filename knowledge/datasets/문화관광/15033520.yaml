summary_user: 광주광역시 서구 관내 여성안심숙박시설을 업소 한 곳당 한 행으로 담은 소규모 파일(csv 약 2KB)로, 업소명·주소·위경도·행정동·지정층 및 지정룸·전화번호를 포함한다. 혼자 여행하거나 출장 가는 여성이 서구에서 안심 지정 객실이 있는 숙소를 찾거나, 분석가가 여성안심시설의 행정동별 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 숙박업 인허가 데이터 등과는 업소명·주소로 맞춰 잇고, 위경도와 행정동으로 다른 공간 데이터에 겹쳐 쓴다.
description_portal: 이 데이터는 광주광역시 서구 관내에 설치된 여성안심숙박시설의 위치 정보와 관련 행정 정보, 지정 여부 및 연락처 등을 포함하고 있는 행정 서비스 정보입니다. 구체적으로는 각 시설의 업소명, 주소(상세주소), 위도/경도 좌표, 행정동 단위를 비롯해 전화번호(공개 가능 범위 내) 등을 포함합니다.이 정보는 여성 대상 범죄 예방 및 지역 안전 강화를 위한 정책 수립의 기초자료로 활용될 수 있으며, 특히 위경도 데이터와 행정동 정보는 공간정보 기반의 분석과 연계가 가능하여 GIS(지리정보시스템) 분석, 범죄예방 전략 수립, 공공안전 시설 연계 등의 응용에도 유용합니다.또한, 여성가족부 및 지자체의 여성안전 정책 평가, 주거환경 분석, 취약계층 거주지 환경 조사 등 다양한 행정 목적과 연구에 사용될 수 있습니다.
