summary_user: 한국저작권위원회 저작권교육의 교육인원과 교육횟수를 교양·전문·협력(기타) 등 교육목적별로 나눠 2009-2015년 합계와 2016년부터 2025년까지 연도별 열로 담은 전국 단위 집계표(CSV 523바이트)다. 저작권 교육 담당자나 정책 분석가가 교양 교육과 전문 교육 중 어느 쪽의 인원·횟수가 해마다 늘었는지 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 교육목적 이름이나 연도를 기준으로 맞추거나 같은 기관의 다른 저작권교육 통계와 나란히 놓고 쓴다.
description_portal: 한국저작권위원회에서 국민의 평생교육을 촉진하고 인적자원 개발 및 관리를 위해 학습계좌 제도를 도입하고 운영하도록 노력해야 합니다. 학습계좌는 개인의 학습경험을 종합적으로 관리하는 시스템을 의미하는데 평생교육법 시행령 제23조 기반으로 교육의 목표화 내용을 교육 대상을 비롯한 다양한 기준에 따라 구분하고 교육의 효율성을 높이고 맞춤형 교육을 제공하는데 중요한 역할을 합니다.교양별 교육횟수, 교육인원과 전문별 교육횟수, 교육인원과 협력(기타)별 교육횟수, 교육인원으로 구분하여 교육목적별 따른 교육 인원과 교육 횟수 연도별 통계 현황 및 데이터입니다.
