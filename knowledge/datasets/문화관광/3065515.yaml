summary_user: 경상남도 시군별 관광지 1,653건을 관광지 한 곳당 한 행으로 담은 1회성 CSV 파일로, 관광지명·주소·지도 좌표·전화번호·홈페이지·1·2차 관광분류·담당기관을 담는다. 여행자나 지역 관광 분석가가 '경남 특정 시군에 어떤 분류의 관광지가 어디에 있고 담당기관은 어디인가'를 찾거나 지도에 표시하는 데 쓴다. 전역 조인 키(TourAPI contentId 등)는 없어 관광지명·주소 매칭이나 좌표 기반 공간 결합으로 TourAPI 관광 콘텐츠 등 다른 관광 데이터와 이어 쓴다.
description_portal: (데이터 수집목적 및 과정) 경상남도 관광정보 데이터는 경남관광길잡이에서 관리하고 있는 경상남도 내 시군별 관광지에 대한 정보입니다. 관광지명, 좌표, 홈페이지 등을 통해 관광에 대한 정보를 얻을 수 있습니다.(데이터 구성 및 세부항목) 데이터는 관광지명, 주소, 지도 좌표, 전화번호, 홈페이지 주소, 관광분류, 담당기관 등으로 구성됩니다. 경남관광길잡이 시스템 내 보유하고 있지 않은 데이터이거나, 개인정보에 해당하는 데이터는 공란처리 되었음을 안내드립니다. 총 1653건입니다.(데이터 현행화 시기) 해당 데이터는 1회성 데이터며 현행화 하지 않습니다.
