summary_user: 대구광역시 북구 관내 지정 문화유산을 한 건씩 담은 파일로, 문화유산명·종류·지정번호·한문명칭·이용시간·쉬는날·소재지 주소·위도·경도를 담는다. 북구에 있는 보물·사적 같은 지정유산이 어디에 있고 언제 관람할 수 있는지 알고 싶은 주민·관광객이나, 지역 역사문화 관광 코스를 짜는 담당자가 쓴다. 전역 조인 키는 없어 국가유산청 자료와는 문화유산명·종류·지정번호를 맞춰 대조해 잇고, 위도·경도와 주소로 지도·주변 시설 데이터와 겹쳐 쓴다.
limits: 국가유산청 종목코드·지정번호 체계나 소재지 PNU 같은 공통 키가 실측 컬럼에 없어 다른 데이터와는 이름·번호 매핑으로만 연결된다. 범위는 북구 한 개 시군구에 한정되어 다른 지역 유산은 담지 않는다.
