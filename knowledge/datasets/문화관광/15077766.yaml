summary_user: 국립중앙도서관이 디지털화한 자료 가운데 저작권자 거소를 조사했으나 찾지 못한 권리자 불명(고아) 저작물을 한 건씩 담은 목록으로, 제호·발행년도·출판사·저작자·이용 방법·권리자불명 판단일 등을 기록한다. 연구자나 출판·콘텐츠 사업자가 특정 옛 문헌이 권리자 불명 저작물로 지정돼 도서관 원문 서비스로 이용되는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 국립중앙도서관 제어번호나 제목·저작자 이름을 기준으로 국립중앙도서관 소장 목록과 대조해 연결한다.
description_portal: 저작권법 시행령 제16조의3(상당한 조사의 기준)에  따라 저작권자 또는 저작재산권자의 거소를 조사하였으나 파악되지 않은  저작물에 대하여 2020년 NIA와 협업하여 공공데이터 기업 매칭 지원사업으로 수행된 "국가문헌 원문DB 이용확대를 위한 고아저작물 조사 시스템 개발 및 메타데이터 구축" 사업의 산출물입니다.국립중앙도서관에서 구축한 디지털화 자료 대해 권리자 불명 저작물 조사를 수행하고, 그 결과 10,102건의 권리자 불명 저작물을 발굴 대국민 디지털 원문 서비스를 제공합니다.
