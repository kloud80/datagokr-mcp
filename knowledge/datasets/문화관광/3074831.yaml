summary_user: 경상남도 진주시 소재 일반음식점·휴게음식점을 업소 한 곳당 한 행으로 담은 목록 파일로, 업종명·도로명/지번 소재지·전화번호·데이터기준일을 담는다. 진주 여행객이나 상권 분석가가 '진주시 어느 동네에 음식점·휴게음식점이 얼마나 몰려 있나'를 확인하거나 주변 식당 연락처를 찾는 데 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 주소 문자열(도로명·지번)이나 업종명으로 맞춰 이어야 하며, 같은 진주시 관광 데이터와는 기관 기준으로만 묶인다.
description_portal: '경상남도 진주시 소재의 음식점에 대한 데이터를 제공합니다.* 제공 정보 내용 : 연번, 시도, 시군구, 업종명, 소재지(도로명, 지번), 전화번호, 데이터기준일* 업종 : 일반음식점, 휴게음식점* 데이터 현행화 주기 : 연간* 파일 내 업종의 정의는 식품위생법 시행령 제21조(영업의 종류)를 참고해 주시기 바랍니다. - 2025년 8월 27일자 기준, 음식점 정보 데이터 건수는 6,898건입니다.* 식품접객업소의 현황은 진주시청 홈페이지에서 열람 가능합니다. (매월 초 업데이트)- 정보소재 : 진주시청 홈페이지 식품관련업소현황 검색 또는 진주시청홈페이지-진주소개-실과안내-문화관광체육국-위생과-식품관련 업소 현황 (https://www.jinju.go.kr/00135/01112/05121.web)* 경상남도 진주시 관광 음식점 안내 관련은 진주시청 홈페이지-진주관광 탭에서 확인 가능합니다.- 정보소재 : 진주시청 홈페이지-진주관광-음식, 숙박, 쇼핑-음식점 (https://www.jinju.go.kr/02234/02349/02354.web)- 제공 내용 : 진주의 전통맛집(비빔밥, 냉면, 장어, 전통 한정식 등), 진주의 일반맛집, 위생등급 지정업소,  안심식당, 진주빵아요  ** 진주빵아요는 진주 빵 맛집을 표시한 지도 및 업체목록(업체명, 소재지, 전화번호, 대표메뉴)을 볼 수 있습니다.'
