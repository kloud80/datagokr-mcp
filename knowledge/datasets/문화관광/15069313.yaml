summary_user: 빅카인즈(BIGKinds)에서 뽑은 뉴딜정책 관련 뉴스 기사를 한 행에 한 건씩 담은 CSV 파일(약 215KB)로, 기사 일자·언론사·기고자·제목·통합분류와 사건사고 분류(1~3단계)·인물·지역·기업기관 개체명·키워드·본문·원본주소를 포함한다. 연구자나 정책 분석가가 "디지털·그린 뉴딜이 시기별로 어떤 언론사에서 어떤 주제·기업·지역과 함께 보도됐는가"를 살피는 언론 담론 분석에 쓴다. 다른 데이터와 공통으로 묶을 전역 조인 키는 없어서, 언론사명·개체명(지역·기업기관)·일자 같은 이름과 날짜를 맞춰 붙이는 방식으로만 연결한다.
limits: 표준 코드형 조인 키가 없어 행정구역·기업 원장 등과 붙일 때는 이름 매칭에 기대야 하고 오매칭을 직접 확인해야 한다. 파일 크기로 보아 수록 기사는 뉴딜 보도 전체가 아닌 표본 규모로 보이므로, 보도량 추세를 전수로 해석하지 않는다.
