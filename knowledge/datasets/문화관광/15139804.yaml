description_portal: 광주광역시 남구 구립도서관별로 진행하는 행사명, 행사 날짜 및 시간, 행사 운영대상, 행사 운영장소 등에 대해 안내합니다. 해당 데이터는 광주광역시 남구청 도서관과(☎062-607-2523)에서 제공합니다.공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다.※ 도서관 행사는 책과 문화를 중심으로 주민들이 함께 참여할 수 있도록 기획된 지역 문화 활동입니다. 대표적으로 독서축제, 작가와의 만남, 북콘서트, 전시회, 강연회, 독서캠프 등이 있으며, 아동부터 성인까지 다양한 연령층이 참여할 수 있습니다. 이러한 행사는 단순히 책 읽기를 넘어 주민 간 교류와 지역사회 문화 활성화를 촉진하는 역할을 합니다.
