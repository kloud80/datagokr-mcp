summary_user: 부산광역시 동래구 관내 문화재(유산)를 한 건씩 담은 CSV 목록으로, 유산마다 종류(국가지정·시지정·시유산자료·국가등록), 종별, 지정번호, 유산명, 소재지, 지정일자, 관리주체가 들어 있다. 동래구에 어떤 국가·시 지정 유산이 어디에 있고 누가 관리하는지 확인하려는 주민, 답사 기획자, 지역 문화 분석가가 쓴다. 전역 조인 키는 없으므로 국가유산청 유산 목록과는 종별·지정번호·유산명을 맞춰 연결하고, 지도와는 소재지 주소를 지오코딩해 연결한다.
description_portal: 부산광역시 동래구 관내에 위치한 문화재 현황을 나타내는 데이터로 쉼표로 분리된 (.csv) 파일 데이터입니다.데이터 항목 설명1. 종류(국가지정유산, 시지정유산, 시유산자료, 국가등록유산)2. 종별(국가보물, 국가사적, 중요무형유산, 유형유산, 무형유산, 민속자료, 기념물, 유산자료, 국가등록유산)3. 지정번호4. 유산명5. 소재지6. 지정일자7. 관리주체본 파일 데이터는 부산광역시 동래구 관내에 위치한 문화재현황으로 사정에 따라 데이터 항목이 변경되거나 삭제됨에 유의하시길 바랍니다.사정상 직접확인이 어려우신 경우에는 부산광역시 동래구 문화관광과 051 550 4085로 직접 문의 하시길 바랍니다.
