description_portal: 한국콘텐츠진흥원이 운영하는 에듀코카의 온라인 교육과정 체계도 정보입니다. 교육과정 체계도는 방송영상, 게임, 만화/애니/캐릭터, 음악/공연 등 콘텐츠 산업의 주요 분야에 대한 정규과정과 열린강좌 교육과정으로 구성되어 있으며, 각 과정은 난이도에 따라 초급, 중급 및 고급으로 분류되어 있습니다. 이 데이터를 활용하여 관련 산업 종사자들이 온라인 교육 과정을 선택하고 참여하여 자신의 전문성을 강화할 수 있습니다. 또한, 교육 기관이나 기업에서 교육 과정을 기획하고, 필요한 내용을 선정하는 데 유용하게 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 구분(문자형), 분류코드(문자형), 대분류(문자형), 중분류(문자형), 소분류(문자형), 과정명(문자형), 난이도(문자형)입니다. 이와 같은 구조를 통해 사용자는 원하는 교육 과정을 체계적으로 검토하고 선택할 수 있습니다.
