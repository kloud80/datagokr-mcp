summary_user: 서울월드컵경기장 주경기장에서 열린 축구경기·콘서트·대관행사를 행사 한 건씩 담은 파일로, 개최 일시·행사 분류·행사명·주최·관람인원·수입금·사용일수를 기록한다(포털 설명상 2015~2025년, CSV 약 37KB). 연구자나 시설 운영 담당자가 'K리그와 콘서트 중 어떤 행사가 관람객과 수입이 더 많고, 어느 달에 행사가 몰리는가'를 따질 때 쓴다. 다른 데이터와 맞출 전역 조인 키는 없어서, 행사 일시나 행사명·주최 이름을 기준으로 직접 맞춰 연결해야 한다.
description_portal: '서울특별시의 주요 스포츠·문화 복합시설인 서울월드컵경기장은 연간 수많은 축구경기와 대형 행사가 열리는 대규모 공공시설입니다. 이에 따라 서울시설공단은 주경기장에서 개최된 각종 행사 및 경기 현황을 체계적으로 관리하고, 경기장 운영의 효율성 및 공공시설 활용도 제고를 위한 기초자료 확보를 목적으로 본 데이터를 수집하였습니다. 특히 2015년부터 2025년까지의 데이터를 통합하여 장기적 추세 분석과 정책적 활용이 가능하도록 정비하였습니다.제공되는 데이터는 다음과 같은 항목으로 구성되어 있습니다.(1) 경기/행사 일정: 연·월·일 및 시간 등 행사별 개최 시점(2) 경기/행사 분류: K리그, 국가대표 경기, 콘서트, 기타 대관행사 등 유형 구분(3) 경기/행사명: 상대 팀, 공연자, 대회명 등 고유 명칭(4) 주최기관: 주관 및 주최 단체(5) 관람인원(명): 회차별 실제 관람객 수(6) 수입금(원): 티켓 판매 및 대관에 따른 수익(7) 사용일수(일): 행사별 경기장 점유 기간본 데이터는 다음과 같은 분야에서 유의미하게 활용될 수 있습니다.학계·연구기관은 장기적인 경기장 이용 패턴, 시즌별 관람객 증감 추이, 행사 유형별 수익 분석 등을 통해 공공체육시설의 운영 효율성과 수요 분석을 위한 연구에 활용할 수 있습니다.공공기관 및 정책 수립 부서는 스포츠 및 문화행사의 집중 시기, 관람객 분포, 수익 구조 등의 통계 자료를 기반으로 하여 향후 공공시설 배정, 대관 기준, 수익성 분석 및 고객 만족도 향상을 위한 전략 수립 등에 참고할 수 있습니다.민간 기업이나 협력 단체는 유사 행사 기획 시 관람객 규모, 적정 수익 예측 등을 통해 비즈니스 모델 수립 및 행사 유치 전략 수립에 실질적으로 활용할 수 있습니다.또한 시민들에게는 경기장 운영의 투명성과 활용 현황에 대한 정보를 제공함으로써 공공자산의 이용 실태에 대한 신뢰도와 참여도를 높일 수 있습니다.'
