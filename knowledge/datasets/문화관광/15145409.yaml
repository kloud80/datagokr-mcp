description_portal: 해당 데이터는 전국 박물관 및 미술관의 기본 현황과 운영 정보를 제공하고 있습니다. 주요 항목에는 시설명, 박물관·미술관 구분, 소재지 도로명주소와 지번주소, 위도·경도 좌표가 포함되어 있습니다. 또한 운영기관명, 운영기관 전화번호, 홈페이지 주소, 편의시설 정보, 평일·공휴일 관람 시작 및 종료 시각, 휴관 정보 등을 제공하고 있습니다. 아울러 어른·청소년·어린이 관람료, 관람료 기타 정보, 시설 소개, 교통 안내 정보도 포함되어 있습니다. 관리기관명과 관리기관 전화번호, 데이터기준일자를 통해 관리 주체와 최신 데이터 기준 시점을 확인할 수 있습니다.
