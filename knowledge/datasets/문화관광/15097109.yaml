summary_user: 제주시 금악리 골목식당 투어 코스를 교통약자·휠체어 이용자 기준으로 정리한 무장애 여행 코스 파일로, 코스 지점별 순서·위도·경도·구분·설명·추천 포인트·상세정보와 전체/추천 코스 여부를 담는다. 휠체어 이용자나 고령 여행자가 '금악리 식당 골목을 어떤 순서로 돌면 경사·노면·화장실 걱정 없이 다닐 수 있나'를 확인하거나, 지자체·분석가가 열린관광지 조성과 무장애 관광 인프라 개선의 기초자료로 쓴다. 실측 컬럼에 전역 조인 키(TourAPI contentId 등)가 없어 다른 데이터와는 위도·경도 좌표나 장소 이름 매칭으로만 이어 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_금악리골목식당투어_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 제주시 금악리 일대의 골목식당 투어 코스를 대상으로 교통약자 및 휠체어 이용자의 여정을 고려해 설계된 무장애 여행 정보입니다. 골목 식당 거리의 위치(위도·경도), 코스 설명, 추천 포인트, 휴식 및 편의시설 현황 등이 포함되어 있으며, 노면 및 경사도, 주차 및 화장실 접근성 등 실제 이용 여건을 반영하고 있습니다. 관광약자 친화형 열린관광지 조성 및 무장애 관광 인프라 구축을 위한 기초자료로서 관광 서비스 개선과 정책 수립에도 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
