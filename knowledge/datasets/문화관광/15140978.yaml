summary_user: 서울 마포구에서 인허가를 받은 영화배급업 사업장을 한 건씩 담은 원천 목록으로, 사업장명·인허가일자·폐업일자·영업상태·주소·전화번호·좌표 등을 포함한다. 마포구에서 지금 영업 중인 영화배급사가 어디에 몇 곳 있는지, 언제 등록하고 언제 폐업했는지를 확인하려는 사업자나 분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE)·관리번호를 기준으로 같은 기관의 다른 인허가 데이터와만 잇는다.
description_portal: 서울특별시 마포구에서 인허가를 받은 영화배급업체에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명 등의  세부 정보가 포함되어 있습니다. 이 데이터는 영화 유통의 합법성 확보, 콘텐츠 유통 경로의 투명성 보장, 저작권 보호 등 공공적 목적을 위해 활용될 수 있으며, 영화 제작사, 상영관, 소비자 등 다양한 이해관계자에게 유용한 정보를 제공합니다.
