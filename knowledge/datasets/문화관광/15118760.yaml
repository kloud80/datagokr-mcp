summary_user: 가야금·거문고·대금·피리 등 국악기의 명칭과 현악기·관악기·타악기 구분(타입), 악기별 고유 코드를 한 줄씩 담은 작은 분류표(약 1.3KB CSV)다. 국악 데이터베이스나 음악 정보·교육용 앱을 만드는 개발자가 '이 악기는 어떤 계열이고 어떤 코드로 관리하나'를 정할 때 기준 사전으로 쓴다. 전역 조인 키가 없어 다른 데이터와는 악기 명칭 또는 이 표의 코드를 직접 매핑해 이어 쓰며, KOPIS 공연ID·공연장ID와는 바로 연결되지 않는다.
description_portal: 이 데이터는 한국 전통악기(국악기)에 대한 분류 체계를 담고 있는 기준 정보(메타데이터)입니다. 가야금, 거문고, 대금, 피리 등 다양한 전통악기의 명칭과 함께, 해당 악기가 현악기(string), 관악기(wind), 타악기(percussion) 중 어디에 속하는지를 나타내는 타입 정보를 제공합니다. 또한, 각 악기마다 고유한 식별 코드를 부여하여 체계적인 데이터 관리가 가능하도록 구성되어 있습니다. 이 자료는 국악 관련 데이터베이스를 구축하거나, 음악 정보 서비스 및 교육용 애플리케이션을 개발할 때 악기 정보를 표준화하고 분류하기 위한 핵심적인 데이터 사전으로 활용될 수 있습니다.
