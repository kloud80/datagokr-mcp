summary_user: 전북특별자치도 진안군 안에 설치된 야외 운동기구를 설치 장소별로 한 행씩 담은 파일로, 마을·소재지 주소·상세 위치·설치연도·기구 종류·관리부서를 제공한다(csv 약 45KB). 주민이나 생활체육 담당자가 '우리 마을이나 읍면 근처에 어떤 운동기구가 언제 설치됐고 어느 부서가 관리하나'를 확인하거나, 지역별 기구 종류 분포를 살피는 데 쓴다. 전역 조인 키나 코드 필드가 없어 다른 체육시설 자료와는 시군구·마을 이름이나 주소 문자열을 맞춰서만 연결된다.
description_portal: 전북 특별자치도 진안군 내에 설치된 야외 운동기구 현황에 대한 공공데이터 자료입니다. 이번 자료에서는 연번, 시도, 해당 시군구명, 운동기구가 설치된 마을 이름, 운동기구를 설치한 위치 주소(읍면 순으로 제공), 상세 위치, 설치 연도, 설치된 운동기구 종류와 관리부서, 데이터 기준일자 정보를 제공합니다. 이 자료 중 기구 종류를 통해 주로 어떤 운동기구가 설치되었는지 확인할 수 있습니다. 특히 빈칸은 집계되지 않아서 데이터값이 존재하지 않습니다. 그리고 추후 정보는 개방 표준으로 제공 예정입니다.
