summary_user: 국가기록원이 소장한 1950~1990년대 문화영화의 목록을 작품 한 편당 한 행으로 담은 파일(csv, 약 45KB)로, 분야·제목·생산년도·감독·생산기관·관리번호·재생기간이 들어 있다. 교사나 연구자가 특정 시기에 어느 기관이 어떤 정책 홍보·교육 영상을 만들었는지 찾아 수업이나 생활사 연구 자료를 고를 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 제목·생산기관 이름을 맞추는 식으로만 이어 쓰고, 영상 열람은 국가기록원 관리번호로 원본을 찾아가는 데 쓴다.
description_portal: 이 데이터는 국가기록원이 소장하고 있는 문화영화 콘텐츠의 목록을 수록한 데이터베이스로, 1950년대부터 1990년대까지 제작된 영상 기록을 통해 시대적 배경과 국민 생활상을 생생하게 확인할 수 있도록 구성되어 있습니다. 해당 콘텐츠는 제목, 감독, 생산년도, 생산기관, 관리번호, 재생기간 등의 항목으로 구성되어 있으며, 각종 문화정책 홍보 영상, 교육용 영상, 생활기록 등이 포함되어 있습니다. 교육 및 학술연구 목적은 물론, 과거 생활사 및 사회상을 시각적으로 이해하는 데 유용한 자료로 활용 가능합니다.
