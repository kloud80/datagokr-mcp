summary_user: 서울시에 있는 유형·무형 문화재를 한 건씩 담은 목록으로, 명칭(한글·영문·한자), 문화재 번호, 자치구, 소재지 주소, 좌표, 제작자·제작 연대·재질·규모, 지정 구분·지정일·해제일, 종목, 안내판 문구와 소개 내용을 담는다. 연구자나 관광 서비스 개발자가 '우리 자치구에 있는 지정 문화재는 무엇이고 어디에 있으며 언제 지정됐나'를 확인하거나 문화유산 탐방 지도를 만드는 데 쓴다. 전역 조인 키가 실측 컬럼에서 확인되지 않아 국가유산청 자료와는 문화재 명칭이나 종목·지정번호를 매핑해 붙여야 하고, 자치구 코드(REG_CD)로 서울시 다른 자료와 묶을 수 있다.
description_portal: 서울시에 등록된 유형·무형 문화유산의 상세 정보를 체계적으로 관리하기 위한 공개 데이터로, 각 문화재의 명칭(한글·영문·한자), 문화재 번호, 자치구 코드 및 명칭, 소재지 주소, GPS 좌표(위도·경도), 제작자, 제작 연대, 재질, 재질 상세, 구조·형식, 규모, 수량, 보존대상, 부속시설, 안내판 문구, 소개내용 등 폭넓은 설명 요소를 제공합니다. 이를 통해 문화재의 역사적 가치와 특징을 확인할 수 있을 뿐 아니라, 문화재의 현장 관리·보존정책 수립, 관광 콘텐츠 제작, 교육자료 개발, 도시문화 연구 등에 실질적으로 활용될 수 있는 기반 데이터를 제공합니다. 특히 위치 기반 데이터와 제작정보가 포함되어 있어 데이터 분석, 시각화, 문화유산 탐방 서비스, LOD 연계 등에 매우 높은 활용 가능성을 갖는 자료입니다.
