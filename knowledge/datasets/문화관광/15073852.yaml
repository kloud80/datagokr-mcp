description_portal: '대구광역시립동부도서관 신착도서목록입니다. 동부도서관에서 해당 분기에 새롭게 구입한 신착자료로 구성된 데이터입니다.데이터는 다음과 같은 컬럼을 포함하고 있습니다. 서명, 저자, 발행자, 발행년, 등록번호, 청구기호, 자료실목록형식으로 해당 자료의 서지사항을 제공하고 있어 최근 출판도서의 동향 파악 및 이용자를 위한 최신자료 제공 등 장서관리 및 서비스 개선에 활용될 수 있으며,향후 신간 도서 선정 및 자료확충계획 수립에 유용한 기초 자료로 사용될 수 있습니다.담당부서: 대구광역시립동부도서관 자료봉사과'
