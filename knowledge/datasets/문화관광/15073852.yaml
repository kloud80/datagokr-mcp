summary_user: 대구광역시립동부도서관이 분기마다 새로 구입한 신착도서를 책 한 권(등록번호) 단위로 담은 목록 파일로, 서명·저자·발행자·발행년·청구기호·소장 자료실을 담는다(CSV 약 316KB). 이용자가 동부도서관에 최근 들어온 책이 무엇이고 어느 자료실에 있는지 찾거나, 사서·분석가가 최근 구입 장서의 분야·출판 동향을 살펴 다음 자료 선정에 참고하는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어서 다른 도서관 목록이나 도서관정보나루 데이터와는 서명·저자 문자열을 맞춰야만 이어 쓸 수 있다.
limits: ISBN·도서관코드 같은 전역 키가 없어 국가서지나 대출·인기도서 데이터와 정확히 연결하기 어렵고, 이름 매칭에 의존해야 한다. 동부도서관 한 곳의 신착 자료만 담고 있어 전체 소장 장서나 대출 현황은 알 수 없다.
