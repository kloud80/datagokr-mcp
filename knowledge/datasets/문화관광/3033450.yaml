summary_user: 콘텐츠산업 지역별 매출액을 출판·만화·음악·게임·영화·애니메이션·방송·광고·캐릭터·지식정보·콘텐츠솔루션 11개 업종별로 나눈 집계표를 담으며, 합계와 지역 비중(%)이 함께 있고 실측 파일 제목은 2014년 기준이다. 분석가나 지자체 담당자가 '2014년에 어느 지역에서 게임·방송 같은 콘텐츠 매출이 집중됐는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 지역 통계와는 지역명을 직접 맞춰 이어 붙여야 한다.
description_portal: '<콘텐츠 산업통계>는 애니메이션, 캐릭터, 음악, 게임 등 다양한 콘텐츠 사업체들을 대상으로 실증적 조사 분석을 통해 산업 진흥을 위한 기초 데이터를 제공하는 중요한 자료입니다. 본 통계정보는 국내 콘텐츠 산업의 현재 상황과 트렌드를 파악하는 데 유용한 기초 자료로 활용될 수 있으며, 다양한 연구자와 관련 기관에서도 이러한 데이터를 활용하여 정책 수립 및 산업 발전 방안을 모색할 수 있습니다. 특히, 콘텐츠 관련 기업들은 이 통계를 통해 시장 성격을 이해하고 자사 전략을 수립하는 데 도움을 받을 수 있으며, 이를 통해 콘텐츠 생태계 전반에 긍정적인 영향을 미칠 수 있을 것입니다. 이 데이터는 콘텐츠 산업의 성장과 발전을 도모하는 데 필요한 다양한 인사이트를 제공할 수 있으며, 국내외 콘텐츠 사업체들은 이를 기반으로 효과적인 기획 및 마케팅 전략을 수립하는 데 기여할 수 있습니다. 따라서 한국콘텐츠진흥원에서 제공하는 국내통계정보는 콘텐츠 업계 종사자 및 연구자들에게 매우 가치 있는 자원임을 이해해 주시기 바랍니다. 데이터 구조는 다음과 같은 칼럼으로 이루어져 있습니다: 산업명, 조사기간, 기업수, 매출액, 고용인원, 출처, 지역.'
