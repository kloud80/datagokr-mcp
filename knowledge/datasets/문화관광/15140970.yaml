summary_user: 서울 마포구에서 인허가를 받은 DVD방·영화방 같은 비디오물감상실 업소를 업소별로 한 건씩 담은 인허가 원천 목록이다. 사업장명, 인허가·폐업일자, 영업상태, 주소와 좌표, 시설면적·층수·객실 수·비상구 등 시설 정보가 들어 있다. 시민이나 분석가가 '마포구에 지금 영업 중인 합법 비디오물감상실은 어디이고 시설 기준은 어떤가'를 확인할 때 쓰며, 전역 조인 키는 없어 같은 기관 코드(개방자치단체코드)나 사업장명·주소 매칭으로 다른 인허가·지도 데이터와 잇는다.
description_portal: 서울특별시 마포구에서 인허가를 받은 의 DVD방, 영화방 등 다수의 시청실과 시청기자재를 갖추어 비디오물의 시청을 제공하는 업소에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 소재지우편번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, X좌표 및 Y좌표, 문화체육업종명, 문화사업자구분명, 시설면적과 건물용도명 등의 세부 정보가 포함되어 있습니다. 이 업종은 콘텐츠의 적법성, 청소년 보호, 영업 환경 안전 기준 준수 등을 의무화하며, 시민과 관련 기관이 합법적인 비디오물감상실을 확인할 수 있도록 정보를 제공합니다.
