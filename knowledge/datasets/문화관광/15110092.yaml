summary_user: 경상북도 영천시에 있는 여행사를 업체 한 곳당 한 행으로 담은 목록 파일로, 업종명(국내·국내외·국외·종합여행업), 상호명, 도로명주소, 전화번호가 들어 있다(약 1.4KB 규모의 작은 CSV). 영천 지역에서 단체여행이나 해외여행을 맡길 여행사를 찾는 주민, 또는 시 단위 여행업체 분포와 업종 구성을 파악하려는 분석가가 쓴다. 공통 조인 키나 코드가 없어 다른 관광사업 등록 데이터와는 상호명·도로명주소를 맞춰 대조하는 방식으로만 연결한다.
description_portal: 해당 데이터는 경상북도 영천시에 소재한 여행사들의 정보를 포함하고 있습니다. 각 업체의 업종명, 상호명, 도로명주소, 연락처 등의 기본 정보를 확인하실 수 있습니다. 개인 휴대전화를 사용하는 업체의 경우 공란데이터를 입력하였습니다.데이터 내에는 국내여행업, 국내외여행업, 국외여행업, 종합여행업 등 다양한 업종이 포함되어 있습니다. 이를 통해 지역 내 여행업체의 현황을 파악하실 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 관광진흥과로 연락주시기 바랍니다.
