summary_user: 빅카인즈(BIGKinds)에서 뽑은 중국 관련 국내 신문·방송 기사를 기사 한 건당 한 행으로 담은 메타데이터로, 일자·언론사·제목·통합 분류·키워드·특성추출 값이 들어 있으며 CSV 파일 하나(약 38.8MB)로 제공된다. 연구자나 정책 분석가가 특정 시기에 한중 외교·무역 갈등 같은 중국 이슈가 어느 언론사에서 얼마나 자주, 어떤 키워드로 보도됐는지 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 일자나 언론사 이름을 기준으로 다른 빅카인즈 국가별 메타데이터나 시계열 지표와 맞춰 붙여야 한다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·날짜 매핑으로만 연결된다. 범위는 전국 단위이고 공간 정보가 없는 비공간 데이터라서 지역별 분석에는 쓸 수 없다. 기사 본문은 필드 목록에 없고 제목과 키워드 수준의 메타정보만 담는다.
