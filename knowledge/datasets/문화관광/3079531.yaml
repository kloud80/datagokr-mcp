summary_user: 경기도 안양시 관내에 인쇄업을 신고한 인쇄사를 업체 한 곳당 한 행으로 담은 파일로, 상호명·우편번호·도로명 소재지·전화번호·데이터기준일을 수록한다. 안양시에서 인쇄물을 맡길 업체를 찾는 시민·사업자나, 시 안의 인쇄업 분포를 파악하려는 분석가가 쓴다. 실측 컬럼에 사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 상호명·주소를 맞춰 보거나 같은 시 단위로만 이어 쓴다.
