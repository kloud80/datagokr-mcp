description_portal: '제주지역의 마을 여행지 분포를 분석하여 상대적으로 소외된 지역을 발굴하고 해당 지역의 관광자원을 활용한 형태의 창의적 여행서비스를 제안합니다. A~H로 분류된 여행 일정과 먹거리, 체험컨텐츠, 사진 정보를 제공합니다. - A: 자연을 벗삼다- B: 오래된 미래시간을 따라가는 한림읍 여행- C: 자연과 하나되는 동부관광지 순환버스 여행- D: 역사를 품은 도시 정읍 여행- E: 제주4.3길을 따라 걷는 북촌마을 여행- F: 세월을 품은 풍차해안도로 자전거 여행- G: 한적한 포구를 거니는 귀덕마을 여행- H: 차가운 마음을 따뜻하게 녹여줄 성산읍 여행'
