summary_user: "제주 마을 도보여행 코스 8개(A~H 일정, 예: 북촌마을 4.3길·귀덕마을·성산읍 여행)별로 연계 여행지와 먹거리·체험 업체의 이름·소개·대표메뉴 가격·주소·전화·휴무일, 주차·놀이방 여부, 관광약자용 화장실·단차·출입문 폭 같은 편의 정보를 업체 단위로 담은 파일(zip 약 35MB, 사진 포함)이다. 여행자나 여행 서비스 기획자가 '북촌마을 코스를 걸으며 들를 만한, 휠체어로 출입 가능한 식당이 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 업체명·주소 같은 이름 매칭으로만 이어 쓴다."
limits: 표준 코드나 contentId 같은 공통 키가 없어 다른 관광 데이터와 자동 결합이 어렵고 이름·주소 매칭이 필요하다. 활용신청 없이 받는 파일 데이터로, 제주 일부 마을 코스에 한정된 보조 자료다.
