summary_user: 제주 워터서커스 공연장과 주변 이용 환경을 휠체어 이용자·고령자 등 이동약자 관점에서 정리한 무장애 여행 정보로, 필드 명세상 지점별 아이디와 위도·경도·해발고도를 담는다. 휠체어 이용자나 그 가족이 '워터서커스 공연장까지 이동 동선과 위치를 미리 확인할 수 있나'를 따져 보거나, 지자체·관광 분석가가 열린관광지 조성과 무장애 관광 안내를 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 관광 데이터와는 시설 이름 매핑이나 위경도 근접 비교로만 이어 쓴다.
description_portal: '"제주특별자치도_무장애여행정보_45.워터서커스 데이터를 제공합니다.* 이 데이터셋은 제주도 내 워터서커스 공연장 및 이용 환경에 대해 무장애 여행자(휠체어 이용자, 이동약자, 고령자 등)를 고려한 정보를 제공합니다. 해당 자료는 공연장 위치, 접근 동선, 편의시설 현황, 이동 편의성 여부 등을 포함하며, 장애인 주차장, 경사로, 휠체어 접근 가능한 출입구 및 내부 동선, 장애인 화장실 등 편의 설비 현황을 점검한 항목이 포함되어 있습니다. 이를 바탕으로 무장애 관광지 안내, 접근성 기반 관광 서비스 개선, 열린관광지 조성, 관광 정책 수립 등에 활용 가능한 기초자료로 설계되었습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
