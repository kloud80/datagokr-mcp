summary_user: 경주시에서 열리는 공연을 건별로 담으며, 공연명·시작일·종료일·장소·주소·연락처 등을 시군구 범위의 개별 주소 단위로 제공한다. 경주를 찾는 관광객이나 시민이 "이번 달 경주에서 어떤 공연이 어디서 열리나"를 확인하거나, 지역 문화 일정 앱·관광 서비스에 공연 목록을 붙일 때 쓴다. 실측 컬럼에 KOPIS 공연ID·공연장ID 같은 전역 조인 키가 없어서, 다른 공연·문화시설 데이터와는 공연명·장소명·주소를 이름으로 맞춰 연결해야 한다.
limits: 공통 식별자가 없어 KOPIS 공연 목록이나 예매·매출 데이터와 정확히 조인하기 어렵고, 이름·주소 매칭에 의존한다. 갱신이 정기적이지 않고 이벤트가 생길 때 만들어진 뒤 바뀌지 않는 성격이므로, 최신 공연 일정이 계속 반영된다고 가정하면 안 된다.
