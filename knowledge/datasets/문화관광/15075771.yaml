description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 이 데이터셋은 제주도립미술관을 중심으로 한 무장애 여행지 주변 정보에 관한 자료로서, 관광지 인근의 식당, 편의시설, 교통시설 등의 주변시설 정보를 포함한다. 미술관은 제주시 1100로 2894-78에 위치하며, 장애인 전용 주차구역, 휠체어 및 유모차 대여, 단차 없는 출입구, 엘리베이터, 장애인 화장실 등 무장애 편의시설을 갖추고 있어 교통약자, 고령자, 유아 동반 가족 등 누구나 비교적 편안하게 이용 가능한 환경이다. 본 정보는 관광 일정 계획, 접근성 고려 여행 코스 설계, 장애인·고령자 친화 관광 홍보, 열린관광지 정책 수립, 지도 서비스 개발 및 관광 콘텐츠 제작 등 공공 및 관광 분야의 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
