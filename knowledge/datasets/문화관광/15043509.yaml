summary_user: 제주시 한림읍 협재해수욕장 한 곳의 무장애여행 정보를 지점별 위도·경도·해발고도와 장소 설명, 이미지로 담은 건별 원천 데이터로, 제주데이터허브(jejudatahub.net)에서 제공한다. 휠체어 이용자나 이동약자 가족이 주차장에서 백사장까지 경사로·장애인 화장실·해변 접근로를 따라 갈 수 있는지 미리 확인하거나, 지자체가 무장애 관광지 시설을 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 위경도 좌표나 장소 이름으로 맞춰 이어 쓰며, 같은 시리즈의 다른 제주 무장애여행 지점 파일과 함께 묶어 쓰는 경우가 많다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 협재해수욕장 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 협재해수욕장은 제주 제주시 한림읍에 위치하며 투명한 에메랄드빛 바다와 은빛 백사장, 완만한 수심과 완경사 해변으로 어린이와 가족, 수영 초보자도 안전하고 편안하게 이용할 수 있는 자연 해변지다. 이 무장애여행 정보 데이터셋은 주차장 위치 및 접근 경로, 휠체어 또는 이동약자용 경사로(램프), 장애인 화장실, 해변 접근로 등 무장애 설비의 현황을 포함하며, 백사장 앞까지 도달 가능한 동선과 주차장에서 해변까지의 이동 편의성 정보를 제공한다. 또한 주변 편의시설 정보도 포함되어 있어, 교통약자와 일반 방문객 모두에게 안전하고 접근 가능한 관광지로의 정보 제공 및 무장애 관광지 관리, 여행 안내에 활용할 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
