description_portal: 강서구 도서관에서 운영하는 문화 행사 신청 정보를 제공합니다. 각 강좌별로 강좌명, 대상, 접수 시작 및 종료일, 강좌 시작 및 종료일, 현재 접수 인원, 정원, 신청 상태, 데이터 기준일자를 포함하고 있습니다. 어린이, 청소년, 성인, 양육자, 어르신 등 다양한 연령과 계층을 대상으로 하며, 강좌는 독서 활동, 손뜨개, 부모코칭, 스마트폰 활용 교육 등으로 구성되어 있습니다. 접수 현황과 일정 정보를 통해 시민들이 문화 프로그램을 쉽게 확인하고 참여할 수 있도록 돕습니다. 자세한 사항은 강서구 통합도서관 홈페이지(https://lib.gangseo.seoul.kr/)에서 확인 가능합니다.
