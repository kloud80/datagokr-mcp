summary_user: 경상남도 창녕군에 등록된 숙박업소를 업소 한 곳당 한 행으로 담은 목록 파일로, 업종명·업소명·도로명 영업소주소·전화번호·객실수를 담는다(약 8KB CSV). 창녕 여행자나 숙박업 창업 검토자가 "창녕군에 어떤 종류의 숙박업소가 몇 곳 있고 객실은 얼마나 되나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 문자열로 맞춰 쓰며, 공중위생 숙박업 신고 인허가 원천(LOCALDATA)과 대조하는 용도가 대표적이다.
description_portal: 경상남도 창녕군에 등록된 숙박업소(숙박업 등록 업소) 현황입니다.1. 숙박 업종명(분류), 숙박 업소의 명칭, 영업소 소재지 주소(도로명주소), 전화번호(일반 전화번호), 객실수 데이터를 포함하고 있습니다.2. 데이터 기준일은 2026년 5월 13일이며, 해당 자료는 매년 1회 정기적으로 갱신 및 업데이트됩니다.3. 전화번호가 없는 업소도 존재합니다.4. 데이터와 관련하여 추가적인 문의사항이나 세부 설명이 필요하신 경우에는 창녕군청 관광환경국 환경위생과 위생팀 055-530-1164로 문의 주시기 바랍니다.
