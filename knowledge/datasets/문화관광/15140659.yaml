summary_user: 서울 종로구 안 영화상영업체를 업소 한 곳당 한 행으로 담은 인허가 원천 자료로, 관리번호·인허가일·취소일·영업상태·폐업일·휴업기간·소재지 주소·좌표·시설면적·층수 등을 포함한다. 주민이나 업계·분석가가 "종로구에서 지금 영업 중인 합법 영화상영관은 어디이고 언제 허가·폐업했나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어, 다른 자치구의 같은 형식 인허가 자료와는 지자체 코드(OPNSFTEAMCODE)·관리번호로, 다른 데이터와는 업소명·주소 매칭으로 연결한다.
description_portal: 본 데이터는 서울특별시 종로구 내에서 운영되는 영화상영업체의 인허가 현황을 정리하여 제공하는 자료입니다. 영화상영업은 「영화 및 비디오물의 진흥에 관한 법률」에 따라 정식 인허가를 받아야 하며, 지역 주민에게 합법적 영화 상영 서비스를 제공하고 문화산업을 활성화하는 역할을 담당합니다. 데이터에는 지방자치단체 코드, 관리번호, 인허가 일자, 인허가 취소일자, 영업상태 코드 및 영업상태명 등 기본 행정 정보가 포함되어 있어 종로구 내 영화상영업체의 등록 현황과 영업 상태를 체계적으로 확인할 수 있습니다. 이를 통해 주민과 관련 업계는 합법적인 상영업체 정보를 확인할 수 있으며, 행정기관은 영업허가 관리, 문화정책 수립, 지역 영화산업 분석 등에 활용할 수 있습니다. 또한 연구자와 민간기관은 영화 상영업 분포와 산업 동향을 분석하는 기초자료로 활용할 수 있습니다. 본 자료는 종로구 내 영화 산업의 건전한 운영과 투명한 문화 환경 조성을 위해 공개됩니다.
