description_portal: 강원특별자치도 내 국가유산(국가지정유산 및 도지정유산)에 대한 통계정보제공국가유산 보호 정책의 기본원칙1. 국가유산의 유형적, 무형적 가치를 온전히 지키고 전승할 것2. 국가유산과 주변의 자연경관이나 역사적, 문화적 가치가 뛰어난 공간을 함께 보호할 것3. 적극적인 공개 및 활용을 통하여 국가유산의 가치 증진 및 새로운 가치 창출을 도모할 것4. 쉽고 다양한 방법을 통하여 국민이 일상에서 능동적으로 참여, 향유할 수 있도록 할 것5. 국가유산의 보존과 활용 간 조화, 균형을 이루며, 국민의 사회경제적 활동 및 다른 정책, 시책과의 조화를 이룸으로써 국가유산의 지속가능성을 도모할 것6. 지역의 고유한 역사와 다양성을 존중하며, 다양한 공동체의 활성화와 지역 발전에 이바지할 것
