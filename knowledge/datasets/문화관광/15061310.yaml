description_portal: 이 데이터는 경기관광공사가 코로나19로 침체된 지역 관광업체를 지원하기 위해 2020년 5월에 진행한 ‘착한여행 캠페인’ 참여 업체 정보를 제공합니다. 캠페인은 관광객이 경기도 내 관광지 입장권을 할인된 가격에 미리 구매하고, 2021년까지 사용할 수 있도록 설계되었습니다. 데이터에는 업체명, 판매 상품명, 할인율(공사 분담률), 티켓 종류(모바일, 실물 등), 홈페이지 주소, 전화번호, 업체 위치 등이 포함됩니다. 이 정보는 지역 관광 활성화, 여행 소비 촉진, 공공 캠페인 성과 분석, 관광업체 지원 현황 파악 등에 활용될 수 있습니다.
