summary_user: 경기도 시군의 공공 축구장을 시설 한 곳씩 담은 현황 목록으로, 시군명·시설명·준공연도·소유기관·관리주체·바닥재료·면적·수용인원·관람석 수와 정제된 주소·위경도를 함께 담는다. 생활체육 동호인이 우리 시군에 인조잔디 축구장이 어디 있는지 찾거나, 분석가가 시군별 축구장 수와 수용 규모를 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명·시설명 같은 이름 매핑이나 주소·위경도(refine_wgs84_lat 등)로 이어 쓰며, 같은 기관의 다른 종목 공공체육시설 현황과 나란히 쓴다.
description_portal: '경기도의 공공체육시설 중 축구경기를 할 수 있는 체육시설 현황입니다. 시설명, 바닥재료명, 면적 등의 정보를 제공합니다.이 데이터는 경기도 내 공공 체육시설 중 ‘축구’를 위한 시설 현황을 정리한 자료입니다. 주요 항목으로는 시설명, 시군명, 소재지(도로명·지번), 인허가일자, 개장일자, 운영기관(직영·위탁 여부), 시설규모(면적 또는 구장 수) 등이 포함되어 있을 것으로 예상됩니다. 이를 통해 각 시군별로 축구장 시설의 분포, 개장 시기 및 운영 주체를 파악할 수 있으며, 특히 생활SOC 확충이나 체육 인프라의 균형 배치를 위한 기초자료로 활용할 수 있습니다.데이터의 활용 예시는 다음과 같습니다:지역별 체육 시설 접근성 분석: 시군 간 축구장 분포와 수용 규모 비교운영 실태 연구: 직영 vs 위탁 운영 방식에 따른 효율성과 유지보수 현황 분석정책 수립 기반: 신규 축구장 설치, 리노베이션, 유지보수 우선순위 설정 시 참고자료로 활용주의사항: 데이터의 ‘인허가일자’나 ‘개장일자’는 향후 변경될 수 있으므로 최신 운영 상태는 관련 지방자치단체의 행정 시스템을 통해 확인하는 것이 좋습니다.'
