summary_user: 경기도 양주시의 공공 체육시설을 시설 한 곳당 한 행으로 담은 파일이며, 읍면동·시설명·종목·위치·조성면적·조성연도·운영시간·관리기관을 기록한다. 양주시 주민이 "우리 동네(읍면동)에 어떤 종목의 체육시설이 있고 몇 시까지 여는가"를 찾거나, 분석가가 읍면동별 체육시설 분포와 조성 시기를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름이나 시설명을 맞춰 붙여야 하고, 문체부 전국 체육시설 자료와도 이름 매칭으로 연결한다.
limits: 표준 코드가 없어 시설명·읍면동 문자열로만 연결할 수 있고, 범위는 양주시 한 곳(읍면동 단위)에 한정된다. 예약·대관 정보는 담고 있지 않다.
