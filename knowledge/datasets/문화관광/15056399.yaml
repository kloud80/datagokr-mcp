summary_user: 경상남도 내 시내순환관광업으로 등록된 업체를 업체 한 곳당 한 행으로 담은 원천 목록으로, 시군명·업종분류·업체명·소재지·연락처를 담으며 포털 설명상 2022년 11월말 기준이고 파일 크기는 329바이트로 매우 작다. 경남에서 시티투어·순환관광버스를 운영하는 업체가 어느 시군에 있고 연락처가 무엇인지 확인하려는 여행객이나 관광업 현황을 보는 분석가가 쓴다. 실측 컬럼에 등록번호·사업자번호 같은 전역 조인 키가 없어, 다른 관광사업 등록 데이터와는 시군명이나 업체명·주소를 이름으로 맞춰 이어 써야 한다.
limits: 공통 조인 키가 없어 다른 데이터와의 연결은 업체명·주소 문자열 매칭에 의존한다. 범위는 경상남도 한 시도에 한정된다. 운영 노선·요금·운행 일정 같은 상품 정보는 없다.
