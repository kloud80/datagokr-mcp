description_portal: '제주특별자치도 민속자연사박물관에서 소장하고 있는 자연사자료(광식물) 데이터를 제공합니다.항목: 분류, 속명, 종명, 수량, 수집방법, 현위치 등*민속자연사박물관은 자연을 존중하고 사람의 숨결을 간직한 제주의 대표 박물관입니다. 자연사전시실: 크게 지질관, 육상생태관으로 구분하여 제주도의 지질자료와 동식물 표본자료 등을 전시하고 있습니다.지질관은 화산섬 제주의 형성 과정을 소개하는 곳으로, 제주의 지질 구조와 다양한 화산 분출물, 용암동굴 생성물 등을 전시합니다. 자세한 사항은 제주특별자치도 민속자연사박물관 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/museum/relicinfo/antiquities.htm'
