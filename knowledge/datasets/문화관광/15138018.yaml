summary_user: 인천관광공사 도서발전지원센터가 공개하는 인천 섬 목록을 섬 한 곳당 한 행으로 담은 CSV 파일(약 32KB)로, 섬 이름·행정구역·위치와 위경도, 총면적, 인구수, 접근성, 섬 설명, 계절별 낚시 정보, 예약·특산품 구매 링크가 들어 있다. 여행자나 관광 서비스 개발자가 '인천에서 봄에 낚시하기 좋은 섬은 어디이고, 어떻게 가며 예약은 어디서 하나'와 같은 질문에 쓴다. 전역 조인 키는 없어서, TourAPI 등 다른 관광 데이터와는 섬이름·행정구역(군구코드) 같은 이름·코드를 맞추거나 위경도로 붙여 쓴다.
description_portal: 인천섬정보 데이터는 인천관광공사에서 관리하고 있는 도서발전지원센터 홈페이지에서 공개하고 있는 인천섬 관련 정보목록입니다.인천 섬에 대한 다양한 정보를 제공하고 있으며, 섬의 위치, 섬에 대한 설명, 섬 거주 인구수, 특산물, 계절별 날씨 등을 제공하고 있습니다.또한 섬 방문객을 위한 예약 및 특산품 구매 링크를 제공하고 있어 등 데이터 수요자의 편의를 맞춘 항목들도 제공하고 있습니다. 현재 제공하고 있는 정보 외에도, 인천 섬에 대한 데이터 수요자의 편의를 맞춘 더욱 상세한 정보들을 제공할 예정입니다.
