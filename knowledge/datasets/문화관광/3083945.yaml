summary_user: 경상남도 안의 관광숙박업소를 업소 한 곳당 한 행으로 담은 파일 목록으로, 업체명·구분(업종)·소재지·객실수를 담는다(CSV 약 9KB). 경남에서 관광호텔 등 관광숙박업소가 어디에 몇 곳 있고 객실 규모가 어느 정도인지 확인하려는 여행객·숙박 사업자·관광 분석가가 쓴다. 등록번호나 표준 코드 같은 전역 조인 키가 없어서, 다른 숙박업·관광사업 등록 데이터와는 업체명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
