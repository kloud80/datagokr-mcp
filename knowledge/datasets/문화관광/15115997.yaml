description_portal: '서울특별시 중구의 간판, 현수막, 전단지 등 광고물 또는 게시 시설을 제작, 표시 및 설치하거나 옥외광고를 대행하는 업소 정보입니다. 데이터는 각 등록업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 옥외광고업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 도시미관 및 도시경관을 해치지 않고 안전관리 기준을 충족하는 적법한 광고물 및 간판 설치를 진행하는 신뢰할 수 있는 등록업체의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
