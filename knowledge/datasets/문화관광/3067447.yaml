summary_user: 제주특별자치도 기록관이 도내 기관·개인에게서 기증받아 수집한 민간기록물을 한 건씩 담은 목록으로, 고유번호·제목·내용·생산정보·유형·수량(권·건·점)·규격·재질을 기록한다(CSV 약 14만 바이트). 제주 지역사 연구자나 기록물 기증을 검토하는 도민이 "제주도 기록관에 어떤 종류의 민간 기록이 얼마나, 어떤 재질로 모여 있나"를 확인할 때 쓴다. 전역 조인 키는 없어 다른 박물관·아카이브 소장 목록과는 제목·유형 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
limits: 표준 식별자나 코드 체계가 없어 다른 기관 소장품 데이터와 자동으로 결합하지 못한다. 제주특별자치도 범위의 비공간 목록이라 소장 위치 좌표나 열람·이용 정보는 없다.
