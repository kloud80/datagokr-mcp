summary_user: 전북특별자치도의 대표 음식점을 한 곳당 한 행으로 담은 파일로, 상호·지역·소재지·전화번호와 영업시간·휴일·좌석수·예약·주차 여부, 음식점 소개글과 대표 음식(관련음식)을 함께 싣는다. 관광객이나 지역 주민이 '전주에서 예약 가능하고 주차되는 비빔밥집이 어디인가'를 찾을 때, 또는 여행 앱 사업자가 전북 음식 관광 콘텐츠를 구성할 때 쓴다. 전역 조인 키가 없어 TourAPI 음식 콘텐츠나 다른 음식점 데이터와는 음식점명·주소(소재지) 문자열 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 전북특별자치도의 음식 문화를 대표하는 음식점들의 상세 정보를 담고 있는 자료입니다. 각 음식점의 상호명, 주소, 연락처 등 기본 정보뿐만 아니라, 영업시간, 좌석 수, 예약 및 주차 가능 여부와 같은 실용적인 정보까지 포함하고 있습니다. 특히, 각 식당의 유래나 특징을 설명하는 소개글과 대표 메뉴 정보를 제공하여 사용자가 자신의 취향과 목적에 맞는 음식점을 선택하는 데 도움을 줍니다. 이 자료는 지역 주민과 관광객에게는 신뢰할 수 있는 맛집 안내서 역할을 하며, 지역의 음식 관광 자원을 홍보하고 관련 산업을 활성화하기 위한 중요한 기초 데이터로 활용됩니다.
