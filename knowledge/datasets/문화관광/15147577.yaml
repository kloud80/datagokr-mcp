summary_user: 서울 동작구 안의 일반게임제공업소(성인 게임장 등)를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가·취소일자, 영업상태(영업·휴업·폐업), 전화번호, 지번·도로명 주소, 좌표, 시설면적·층수 같은 시설 정보를 포함한다. 주민이나 분석가가 "동작구에 지금 영업 중인 게임제공업소가 어디에 몇 곳 있고 언제 폐업했나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구의 같은 인허가 데이터와는 같은 컬럼 구조로 이어 붙이고, 다른 데이터와는 주소나 좌표(X, Y)를 기준으로 맞춰 연결한다.
description_portal: 서울특별시 동작구 일반게임제공업 인허가 정보(https://data.seoul.go.kr/dataList/OA-16811/S/1/datasetView.do) 관련입니다.이 데이터는 각 일반게임제공업체의 인허가일자, 영업상태, 전화번호, 주소, 좌표정보 등의 정보를 제공합니다.게임제공업체의 주소 및 좌표 정보를 통해 업체의 정확한 주소를 확인할 수 있습니다.영업상태 항목을 통해 해당 업체가 현재 영업 중인지, 휴업 또는 폐업 상태인지 확인할 수 있습니다.또한 사업장명 항목을 통해 개별 일반게임제공업체를 식별할 수 있습니다.
