description_portal: 본 데이터는 광주광역시 동구, 서구, 남구, 북구, 광산구 등 전 자치구에 소재한 등록 및 신고 체육시설업 현황을 종합적으로 정리한 자료입니다. 「체육시설의 설치·이용에 관한 법률」에 따라 등록 또는 신고된 체육시설업을 대상으로 하며, 골프장업, 골프연습장업, 체력단련장업, 수영장업, 당구장업, 체육도장업 등 업종별 현황을 포함하고 있습니다. 또한 업소명, 소재지, 등록·신고일자, 관리기관 등의 정보를 제공하여 체육시설업 운영 실태와 행정 관리 현황을 파악할 수 있으며, 정책 수립, 지도·점검, 통계 분석 및 시민 이용 정보 제공을 위한 기초자료로 활용될 수 있습니다. 자료는 정기적으로 현행화됩니다.
