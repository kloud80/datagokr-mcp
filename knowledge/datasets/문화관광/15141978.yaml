summary_user: 서울 마포구에 인허가된 당구장업 사업장을 업소 1건씩 담은 원천 명부로, 인허가일자·영업상태(영업/폐업)·폐업일자·지번·도로명 주소·좌표(X, Y)·사업장명 등을 포함한다. 주민이나 상권 분석가가 '마포구에서 지금 영업 중인 당구장은 어디이고 최근 몇 곳이 폐업했나'를 확인하거나 체육시설업 개폐업을 상권 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결하며, 좌표를 쓰면 같은 지역의 다른 업종 인허가 명부와 위치 기준으로 겹쳐 볼 수 있다.
description_portal: 서울특별시 마포구에 등록된 당구장업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 당구장의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민과 행정기관은 관내 당구장 위치와 운영 현황을 쉽게 확인하고, 안전·위생·문화 정책을 효율적으로 수립하고 지원할 수 있습니다.
