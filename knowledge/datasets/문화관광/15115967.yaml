summary_user: 서울특별시 강서구에서 영리 목적으로 영화를 상영하는 업소의 인허가 정보를 업소별 한 건씩 담으며, 사업장명·지번/도로명 주소·인허가일자·영업상태·폐업일자·건물 층수와 시설면적·TM 좌표(EPSG:5174) 등을 포함한다. 강서구에서 지금 영업 중인 극장·소규모 상영관이 어디에 있는지, 언제 인허가를 받거나 폐업했는지 확인하려는 주민·사업자·분석가가 쓴다. 전역 조인 키는 실측되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)·관리번호로만 연결하고, 다른 자치구의 같은 형식 인허가 데이터와 이어 붙여 비교한다.
description_portal: '서울특별시 강서구에서 영리를 목적으로 영화를 상영하는 업소에 대한 인허가 정보를 제공합니다.이 데이터는 일반적인 영화상영업(예: 독립영화관, 소규모 극장 등)에 대한 정보를 담고 있습니다.각 업소는 아래와 같은 항목들로 정리되어 있습니다.사업장명: 영화상영업을 영위하는 업소의 이름주소: 지번주소 및 도로명주소 형식으로 기재인허가일자: 해당 업소가 처음 인허가를 받은 날짜영업상태: 현재 영업 중인지, 폐업했는지 등 (예: 영업중, 폐업)업종명: 문화체육부문에서의 분류명칭 (예: 영화상영업)좌표정보: 위치를 나타내는 TM 좌표계(EPSG:5174 기준)'
