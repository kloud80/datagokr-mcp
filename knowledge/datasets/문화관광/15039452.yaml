description_portal: '이 데이터셋은 세종특별자치시시설관리공단이 운영하는 보람수영장, 장애인형국민체육센터, 조치원수영장 등 세종시 내 공공수영장에서 진행되는 다양한 수영 강습 프로그램 정보를 체계적으로 제공하고 있습니다.본 데이터는 수영강습, 아쿠아로빅, 자유수영 등 다양한 프로그램의 정보를 포함하고 있으며, 주요 컬럼은 아래와 같습니다.사업장: 강습이 이루어지는 수영장의 명칭을 나타냅니다. (예: 보람수영장, 장애인형국민체육센터, 조치원수영장 등)분류: 해당 강습 프로그램의 유형이나 성격을 구분합니다. (예: 수영강습, 아쿠아로빅, 자유수영 등)강습요일: 각 프로그램이 운영되는 요일을 명시합니다. (예: 월, 수, 금 등)운영시간: 강습 또는 자유수영이 실제로 운영되는 시간대를 의미합니다. (예: 09:00, 09:50, 19:00, 19:50 등)대상: 프로그램이 주로 제공되는 대상 연령층 또는 특수대상(유아, 아동, 청소년, 성인, 시니어, 장애인 등)을 구체적으로 안내합니다.수강료: 해당 강습 또는 프로그램에 참여할 때 납부해야 하는 이용 요금을 표시합니다.관리기관명: 프로그램을 주관·운영하는 기관명을 기재합니다. (예: 세종특별자치시시설관리공단 등)이 데이터셋은 시민 여러분이 각 수영장별로 제공하는 강습 프로그램의 일정을 쉽게 비교하고, 본인 또는 자녀에게 적합한 프로그램을 편리하게 찾아볼 수 있도록 구성되어 있습니다.특히, 연령별·대상별 맞춤형 강습, 장애인 등 소외계층을 위한 특화 프로그램 등 다양한 프로그램 정보를 수록하고 있어, 지역사회 구성원 모두의 건강 증진과 체육 활동 참여 기회 확대에 기여하고 있습니다.'
