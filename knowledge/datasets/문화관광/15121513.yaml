summary_user: 국립현대미술관 소장작품을 작품 한 점씩 담은 목록으로, 작품명·작가·주제분류와 핵심주제어·크기·설명·저작권·참조 이미지 주소 등을 담고 범위는 전국·비공간이다. 미술 연구자나 전시 기획자가 '특정 작가의 국립현대미술관 소장작이 무엇이고 어떤 주제로 분류되는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 국립현대미술관이 소장하고 있는 다양한 작품에 대한 상세 정보를 제공하는 데이터셋입니다. 작가명, 작품명, 제작연도, 자원의 명칭, 소속, 주제분류, 핵심주제어, 자원의 크기, 내용, 공간, 해당 시간대, 언어, 저작권, 위치정보 등 다양한 항목을 포함하고 있어 미술 연구, 전시 기획, 예술 교육, 문화 정책 수립 등 여러 분야에서 활용할 수 있습니다. 또한, 각 작품의 썸네일 이미지와 참조 정보도 함께 제공되어 시각적 자료로도 유용하게 사용할 수 있습니다. 예술 관련 데이터 분석, 작품 목록 관리, 미술관 정보 시스템 구축 등에도 적합한 자료입니다.
