summary_user: 한국관광공사 TourAPI 계열의 의료관광 정보를 법정동 코드, 지역·위치기반 목록, 키워드 검색, 동기화, 공통·소개·의료관광 상세 등 오퍼레이션별로 여러 언어로 제공하는 API로, 전국 범위의 개별 시설 단위(주소·좌표) 정보를 담는다. 외국인 대상 의료관광 앱이나 안내 서비스 개발자가 '특정 시도·시군구 또는 내 위치 주변에 어떤 의료관광 시설이 있고 상세 정보는 무엇인가'를 조회하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았으며, 법정동 시도·시군구 코드(code)와 이름 매핑 또는 같은 기관의 TourAPI 콘텐츠 ID로만 다른 관광 데이터와 연결한다.
description_portal: 한국관광공사가 보유하고 있는 다양한 의료 관광 정보를 실시간으로 제공 받을 수 있으며, 국내 최대 관광정보 포털사이트(www.visitkorea.or.kr) 홈페이지에서 제공하는 의료 관광정보 중 저작권 등에 구애 없이 자유롭게 활용 가능한 정보만을 선별하여 OpenAPI를 통해서 최신 정보를 제공하고 있습니다. - 개방데이터는 법정동 코드 정보,  지역기반 관광정보, 위치기반 관광정보, 키워드 검색, 의료 관광 동기화 정보, 공통정보, 소개정보, 의료 관광정보 8종의 전반적인 국내 의료 관광정보를 여러가지 언어로 제공합니다. - 모바일 앱 뿐만 아니라, 웹 서비스, 태블릿, 홍보물, 잡지 등 다양한 매체에서 어플리케이션을 개발, 활용할 수 있으며, 다양한 활동을 통해서 신규/융복합 관광 서비스를 창출할 수 있습니다.
