summary_user: 경상남도 김해시의 박물관·미술관·학습관·공연장·문화의집·청소년수련관 등 문화공간 개방시설을 시설 한 곳당 한 행으로 담고, 공공·민간 운영구분과 도로명·지번 주소, 위도·경도, 연락처, 휴관정보를 함께 제공하는 소규모 파일(csv 약 6.7KB)이다. 김해 주민이나 방문객이 집 근처에서 쉬는 날 없이 열린 공공 문화시설이 어디인지 찾거나, 분석가가 시 안의 문화시설 분포를 지도에 올려 볼 때 쓴다. 전역 조인 키나 문화시설 코드가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 좌표 기반 공간 결합으로 잇고, 전국공공시설개방정보 표준데이터와 대조해 쓴다.
description_portal: 경상남도 김해시 문화공간 개방시설 현황에 관한 데이터로 시설명, 시설구분(박물관, 미술관, 학습관, 공연장, 문화의집, 청소년수련관), 운영구분(공공, 민간), 소재지도로명주소, 소재지지번주소, 위도, 경도, 연락처, 홈페이지, 휴관정보, 운영기관명, 데이터기준일자의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2025년 1월 7일로, 표준데이터로 이관하여 관리하고 있습니다.* 전국공공시설개방정보표준데이터(https://www.data.go.kr/data/15013117/standard.do)* 데이터 미집계 등의 사유로 공란이 있습니다.* 데이터 기준일자와 수정일자가 상이하오니 이용에 유의하시기 바랍니다.* 해당 데이터는 분석·연계하여 정책 수립 및 지역 사회 문제 해결 등 다양한 분야에 활용하실 수 있습니다.
