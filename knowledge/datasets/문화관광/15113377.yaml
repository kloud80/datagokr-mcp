summary_user: 경상남도 거창군에 있는 파크골프장을 시설 한 곳당 한 행으로 담은 명부 파일로, 시설명·도로명/지번 주소·면적(제곱미터)·규모(홀)·전화번호·관리기관·위도·경도를 담는다. 거창군 주민이나 방문객이 가까운 파크골프장의 위치와 홀 수, 연락처를 확인하거나, 분석가가 군내 생활체육 시설의 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도 좌표, 시설명 매칭으로 잇는다.
description_portal: '경상남도 거창군 파크골프장의 데이터로 경상남도 거창군 파크골프장의 시설명, 경상남도 거창군 파크골프장의 소재지도로명주소, 경상남도 거창군 파크골프장의 소재지지번주소, 경상남도 거창군 파크골프장의 면적(제곱미터), 경상남도 거창군 파크골프장의 규모(홀), 경상남도 거창군 파크골프장의 전화번호, 경상남도 거창군 파크골프장의 위도, 경상남도 거창군 파크골프장의 경도 등의 항목을 제공합니다○ 데이터 기준일 : 2025년 08월 01일○ 파크골프란 : 파크골프는 말 그대로 공원에서 즐기는 골프를 뜻합니다. 공원(Park)과 골프(Golf)를 합쳐서 만든 말로, 소규모 공원이나 녹지 공간에서 즐길 수 있는 골프의 한 형태입니다. 1983년 일본에서 시작되어 현재는 많은 국가에서 즐겨지는 생활 스포츠로 자리 잡았습니다.'
