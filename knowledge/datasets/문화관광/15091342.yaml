summary_user: 인천광역시 남동구에 있는 게이트볼장을 한 곳당 한 행으로 담은 시설 목록 파일로, 시설명·소재지(주소)·전화번호·데이터기준일자를 담는다(파일 크기 504바이트의 소규모 목록). 주민이나 노인복지 담당자가 '우리 동네 가까운 게이트볼장은 어디이고 연락처는 무엇인가'를 확인하거나 남동구 내 게이트볼장 분포를 파악하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 체육시설 데이터와는 시설명이나 소재지 주소를 기준으로 맞춰 이어 써야 한다.
