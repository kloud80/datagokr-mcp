description_portal: 본 데이터는 한국저작권위원회가 수집·제공한 통계 자료로, 저작물별 창작과 관련된 교육과정별(특성화 고등학교, 전문대학, 대학, 대학원 석사 및 박사 과정) 인력 배출 현황을 연도별로 정리한 것입니다. 2013년부터 2022년까지의 데이터를 포함하고 있으며, 성별 구분(2018년부터 남녀 분리 통계)도 일부 제공됩니다. 이를 통해 저작물별 창작 분야의 인재가 어떤 교육 단계를 거쳐 배출되고 있는지를 시계열로 분석할 수 있으며, 창작 산업의 인력 수급, 정책 기획, 전공 교육의 질 개선 등에 필요한 기초 자료로 활용될 수 있습니다. 특히, 창작자 수의 증감 추이를 통해 관련 산업의 성장 가능성이나 지원 필요성을 도출할 수 있습니다.
