description_portal: 법원연계조정은 법원에 접수된 소송사건을 첫 변론(준비)기일 전에 조정절차에 회부해 외부 전문조정기관으로 하여금 조정을 진행해 당사자 사이의 합의를 유도하고, 합의가 성사되지 않을 경우 다시 법원이 돌려받아 재판절차를 진행하는 제도로서 법원연계조정의 주요 내용으로 재판부의 조정회부, 전문 조정기관의 조정, 신속하고 저렴한 해결, 합의 성립 시, 합의 불성립 시 내용이 있다. 그리고 법원연계형, 법원부속형 유형에 따라 시간과 비용 절감, 자율적인 해결, 전문가의 도움을 통한 유연한 해결로 법원연계조정의 장점을 활용 활 수 있다. 이에 연도별로 조정건수합계, 성립, 불성립, 취하, 기타, 진행 구분한 통계자료입니다.
