description_portal: 광주광역시 생활체육지도자 현황입니다.광주광역시는 자치구별로 생활체육지도자를 배치하고 있습니다.생활체육지도자는 총 84명으로 동구11명, 서구16명, 남구17명, 북구19명, 광산구 21명이 배치되어 있습니다.생활체육지도자는 광주시민 누구나를 대상으로 지도 활동을 하는 일반지도자50명과 65세이상 어르신을 대상으로 지도활동하는 어르신지도자34명이 있으며,주로 복지관, 행정복지센터, 노인정, 경로당, 체육공원, 병설유치원 등에서 생활체육 수업을 진행하고 있습니다.
