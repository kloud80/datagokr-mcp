summary_user: 국립어린이청소년도서관이 올린 공개모집 공지(인재채용·공모전·워크숍·행사 안내 등)를 게시물 한 건 단위로 담으며, 발행기관·담당자·제목·내용·원문 주소·조회수·등록일을 포함하고 범위는 전국·비공간이다. 구직자나 학부모·교사가 "이 도서관에서 지금 모집 중인 채용이나 공모전·행사가 무엇인가"를 확인하거나, 분석가가 도서관 공지의 종류와 조회수 추이를 볼 때 쓴다. 실측 컬럼에 도서관코드나 ISBN 같은 전역 조인 키가 없어, 다른 도서관·독서 데이터와는 기관명이나 제목 텍스트를 맞춰서만 이어 쓴다.
description_portal: 국립어린이청소년도서관에서 진행하는 각종 공개모집과 관련된 정보를 한눈에 확인할 수 있도록 제공하는 데이터셋입니다. 발행기관, 소속, 책임자, 자원 위치, 명칭, 내용, 조회수, 등록일 등 주요 정보를 포함하고 있어, 도서관에서 주최하는 인재채용, 공모전, 워크숍, 행사 안내 등 다양한 공지사항을 신속하게 파악하실 수 있습니다. 연구자, 학생, 일반 이용자 등 다양한 사용자가 도서관의 최신 소식과 참여 기회를 쉽게 확인하고, 관련 정보를 데이터 기반으로 분석하거나 홍보 자료로 활용하는 데 유용합니다. 또한, 도서관 정책 수립이나 문화행사 기획 시 참고 자료로도 활용할 수 있습니다.
