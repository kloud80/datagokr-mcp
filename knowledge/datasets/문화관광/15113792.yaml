summary_user: 경상남도 의령군 관내 작은도서관(문고)을 시설 한 곳당 한 행으로 담은 목록 파일로, 읍면·시설명칭·도로명주소·개관일·유형·전화번호를 담는다(파일 크기 627바이트의 소규모 CSV). 주민이 "우리 읍면에서 가까운 작은도서관은 어디이고 연락처는 무엇인가"를 찾거나, 분석가가 의령군 읍면별 작은도서관 분포를 확인하는 데 쓴다. 전역 조인 키(도서관코드 등)는 없어서, 도서관정보나루 등 다른 도서관 데이터와는 시설명칭·도로명주소를 맞춰 보거나 읍면 이름으로만 이어 쓴다.
