summary_user: 서울특별시 중랑구 관내에 등록된 캠핑장(야영장)의 명칭, 도로명 소재지 주소, 영업등록일, 사이트 개수를 시설별로 담은 134바이트 분량의 작은 CSV 파일이며, 포털 설명상 중랑가족캠핑장 한 곳의 정보를 담는다. 중랑구 주민이나 캠핑 이용자가 구내에 어떤 등록 야영장이 있고 사이트가 몇 개인지 확인하거나, 분석가가 서울 자치구별 야영 시설 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 지자체 야영장 현황이나 관광사업 등록 자료와는 캠핑장명이나 주소를 맞춰 이어 써야 한다.
description_portal: 서울특별시 중랑구 관내 캠핑장(야영장) 등록 현황입니다. 이 데이터의 카테고리는 문화체육관광의 관광분야입니다. 중랑구 관내캠핑장의 주요 제공 항목으로는 캠핑장명, 소재지 주소, 영업등록일, 사이트규모(개수)의 정보를 포함하고 있습니다. 캠핑장 정보는 중랑가족캠핑장의 내용입니다. 영업등록일은 2015-04-16입니다. 관내 캠핑장 규모 및 야외 야영 시설 현황 파악 등에 데이터를 활용할 수 있습니다. 자세한 사항은 엑셀 파일을 다운로드 받아서 내용을 확인하여 주시기 바랍니다. 감사합니다.
