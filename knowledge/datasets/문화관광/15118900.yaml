summary_user: 전국 호텔 863건을 호텔 단위로 담은 파일 데이터로, 호텔업 구분·결정 등급·등급 결정일·등급 인정처·지역·객실수·주소·전화번호·홈페이지를 포함한다. 지역별 호텔 분포나 등급별 현황, 특정 지역에 어떤 등급의 호텔이 몇 실 규모로 있는지 알아보려는 분석가·정책 담당자·여행객이 쓴다. 조인 키는 주소(address)뿐이라 같은 주소 필드를 가진 다른 관광숙박·등록 데이터와 주소 문자열을 맞춰 이어 쓰며, 등록번호나 사업자번호 같은 별도 키는 필드에 없다.
description_portal: 전국 각지의 호텔에 대한 등급, 위치, 객실 수, 연락처 등 주요 정보를 체계적으로 제공하여 호텔 산업 현황을 한눈에 파악할 수 있도록 구성되어 있습니다. 호텔업 구분, 등급 결정일, 인정처 등 다양한 항목을 포함하고 있어 지역별 호텔 분포와 등급별 현황 분석에 유용합니다. 관광산업 연구, 숙박업 정책 수립, 여행객의 호텔 선택, 지역별 관광 인프라 조사 등 다양한 분야에서 활용할 수 있으며, 최신 호텔 정보와 등급 변동 사항을 신속하게 확인하는 데에도 도움이 됩니다. 호텔 관련 통계 자료가 필요한 연구자, 정책 담당자, 일반 이용자 모두에게 실질적인 정보를 제공합니다.
