summary_user: 충청남도 보령시 관내 체육시설업체를 한 곳씩 담은 명부로, 포털 설명 기준 83개소에 대해 업종·상호·지번/도로명 주소·전화번호·위도·경도·데이터기준일을 담는다. 시민이 "우리 동네 근처에 헬스장이나 당구장, 체육도장이 어디 있나"를 찾거나, 체육 관련 사업자가 보령시 안 업종별 업체 분포를 보고 입지를 검토하는 데 쓴다. 전역 조인 키나 인허가번호는 없어서, 다른 데이터와는 주소·좌표로 위치를 맞추거나 상호·업종 이름으로 매핑해 이어 쓴다.
description_portal: 국민 건강증진에 대한 관심 확산과 생활체육 참여 인구 증가, 다양한 체육활동에 대한 시민들의 수요 증대에 따라 보령시는 관내 체육시설업체의 체계적인 관리와 시민들의 편리한 체육시설 이용을 위해 종합적인 체육시설업 현황정보를 제공하고 있습니다. 이를 통해 시민들의 건강한 여가생활 지원과 지역 체육산업 발전, 체육시설 접근성 향상에 기여하고자 합니다. 보령시에 등록된 각종 체육시설업체들의 업종별 분포, 위치정보, 연락처 등을 포함한 상세 현황을 투명하게 공개하고 있습니다.개방 데이터는 보령시 관내 체육시설업 83개소의 상세정보로 업종, 상호, 도로명주소, 위도, 경도, 데이터기준일 등 총 9개 항목 83건의 정보를 제공합니다.시민들은 거주지 인근 체육시설 검색과 운동시설 선택에 활용하고, 체육관련 사업자는 시장현황 파악과 사업계획 수립에 활용하며, 보건의료기관은 지역사회 건강증진 프로그램 기획에 활용할 수 있습니다. 또한 관광업계는 체육관광 상품 개발과 스포츠 이벤트 기획에 기여할 수 있습니다.
