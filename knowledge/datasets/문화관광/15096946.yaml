description_portal: '제주특별자치도 내 관광 사업체별 종사자 수 현황 데이터를 제공합니다.항목: 연도, 시도, 업종 구분, 종사자수(명) 등* 제주특별자치도 내 관광 사업체들을 사업체 종류별로 구분하고, 각 사업체에서 일하는 종사자 수(직원 수)의 변화를 연도별로 나타낸 것입니다. 사업체 구분에는 숙박업, 여행업, 음식업 등 여러 관광 관련 업종이 포함되며, 제주 관광산업이 성장 또는 변화함에 따라 종사자 규모가 어떻게 달라졌는지 파악할 수 있습니다.* 활용 분야 : 관광 고용 영향 분석, 업종별 인력 수요 예측 및 인력 양성, 정책 및 지원 프로그램 설계 등- 데이터 제공처: KOSIS 국가통계포털'
