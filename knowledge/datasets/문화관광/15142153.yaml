summary_user: 전라남도 각 시군에 있는 파크골프장을 한 곳씩 시군·이름·주소·홀 수(9·18·36홀 등)로 담은 개별 시설 목록으로, 포털 설명 기준 41곳이며 작은 CSV 파일 하나다. 생활체육 동호인이나 지자체 담당자가 '우리 시군에 18홀 이상 파크골프장이 어디 있나'를 찾거나 시군별 시설 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명이나 주소를 기준으로 맞춰 이어 써야 한다.
description_portal: '- 전라남도 각 시군에 소재하고있는  파크골프장 현황 정보에 관한 데이터를 제공합니다.- 시군소재지, 파크골프장명, 주소, 홀수(9홀, 18홀, 36홀 등)에 관한 세부 데이터를 제공합니다. - 총 41개 업체의 데이터를 제공합니다. - 경기방법 : 출발지점(티오프)에서 홀(hole)을 향해 볼을 치고 차례로 코스를 돕니다. 최종코스까지 가장 적은 타수로 홀에 볼을 넣는 사람이 승리합니다. 보통 4인 1조로 게임을 하며 게임 당, 18홀 기준으로 약 1시간 30분~2시간이 소요되는데 체력적인 부담은 적습니다. 장비는 합성수지로 내부를 채운 직경 6cm의 공을 쓰며, 나무로 만든 길이 86cm,무게 600g의 클럽 하나만 사용합니다. 클럽에는 로프트(클럽과 페이스가 이루는 각도)가 전혀 없어 뜨거나 날아가지 않아 위험하지 않습니다.'
