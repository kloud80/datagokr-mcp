summary_user: 광진구 관내 영화상영관을 한 곳씩 담은 건별 행정 목록으로, 신고(등록)번호·등록일자·상영관명·지번/도로명 소재지·대표자·관람정원·영업상태를 담는다. 주민이나 지역 문화정책 담당자가 '광진구에 영업 중인 영화관이 어디에 있고 좌석 규모는 얼마인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상영관명·주소를 매칭하거나 같은 기관(광진구) 자료끼리만 이어 쓴다.
description_portal: 서울특별시 광진구_영화상영관 데이터는 광진구 관내에서 운영되는 영화상영관의 허가 및 기본 현황을 제공하는 행정 데이터입니다. 이 데이터는 “상영관 허가번호”, “상영관명”, “주소”, “대표자”, “좌석수”, “데이터기준일” 필드로 구성되어 있습니다. ‘상영관 허가번호’는 해당 영화상영관의 인허가를 식별하는 고유번호를 나타내며, ‘상영관명’은 영화상영관의 공식 명칭을 제공합니다. ‘주소’는 상영관의 위치 정보를, ‘대표자’는 상영관의 운영 책임자를 명시합니다. 또한 ‘좌석수’는 상영관 내 관람석의 총 수를 나타내며, ‘데이터기준일’은 정보의 최신화 기준일을 명시합니다. 이 데이터는 지역 문화시설 현황 파악, 영화산업 분석, 생활문화 인프라 정책 수립 및 주민 문화 서비스 개선의 기초 자료로 활용될 수 있습니다.
