summary_user: 비짓제주 이용자가 여행일정을 만들고 세부일정을 등록할 때 쌓인 기록을 세부일정 한 건 단위로 담은 원천 파일로, 일정 제목·방문 콘텐츠명·대표일정 여부·여행일수·시작/종료 시간·장소 구분·등록/수정 일시가 들어 있으며 포털 설명상 전체 146,508건이다. 관광 기획자나 분석가가 '비짓제주 이용자들이 일정에 어떤 관광지를 많이 넣고, 하루에 몇 곳을 어떤 시간대로 도는가'를 파악하거나 일정 추천 서비스를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI contentId 같은 코드로 바로 붙지 않으며, 콘텐츠명을 비짓제주 관광지 정보와 이름으로 맞추거나 여행일정아이디로 같은 기관의 여행일정 데이터와 묶어 쓴다.
limits: 관광지 코드나 좌표가 없어 다른 관광 데이터와는 이름 매칭으로만 연결되므로 표기 차이로 누락·오매칭이 생길 수 있다. 범위는 비공간 데이터로 분류되어 지역 단위 분석에는 별도 위치 정보가 필요하다.
