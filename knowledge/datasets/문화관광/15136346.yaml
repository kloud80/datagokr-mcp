summary_user: 한국관광 데이터랩의 한국관광통계에서 가져온 방한 외래관광객 수를 기준연월별로 20세 이하부터 61세 이상까지 연령대와 승무원으로 나눠 담은 전국 단위 월별 집계 파일(csv, 782 bytes)이다. 관광업계·분석가가 "방한 외래관광객 중 20~30대 비중이 월별로 어떻게 달라지는가" 같은 연령 구성 변화를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관광 통계와는 기준연월을 맞춰 붙여 쓰는 수밖에 없고, 관광지점·시군구 코드가 없어 지역 데이터와는 직접 이어지지 않는다.
limits: 전국·비공간 집계라 지역별·국적별 연령 분포는 알 수 없고, 승무원은 연령 구분 없이 별도 항목으로만 집계된다. 거주·군인·영주·외교 등 일부 체류 자격 입국자는 빠지고 재외국민(교포)은 포함되므로 법무부 외국인 입국자 수와 그대로 비교하면 안 된다.
