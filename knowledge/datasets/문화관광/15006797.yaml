summary_user: 하이원리조트 골프장 18홀을 밸리코스·마운틴코스(각 9홀)로 나눠, 홀별로 블루·화이트·골드·레드 티 기준 거리(m)와 파 수를 담은 작은 정리표(csv 814바이트)다. 이용자나 안내자료 작성자가 '이 홀은 티별로 몇 m이고 파 몇인가'를 확인하거나 코스 공략을 짤 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 골프장 이름이나 같은 기관(강원랜드) 기준으로만 이어 쓴다.
description_portal: "(주)강원랜드_골프장 코스 현황'은 하이원리조트 내에 조성된 골프장의 코스별 구성 현황을 정리한 데이터입니다.골프장은 총 18홀로 구성되어 있으며, 밸리코스(Out Course)와 마운틴코스(In Course)로 나뉩니다. 각 코스는 9개 홀로 구성되어 있으며, 각 홀마다 블루 티, 화이트 티, 골드 티, 레드 티 기준 거리(단위: m)와 PAR(파) 수 정보가 제공됩니다.거리 정보는 코스별, 홀별로 구체적으로 제시되어 있으며, 다양한 수준의 골퍼가 이용할 수 있도록 티 구분별 차등 거리가 설정되어 있습니다.골프장 운영 현황 파악, 이용자 대상 코스 안내자료 작성, 경기 전략 수립 등 다양한 목적으로 활용될 수 있으며, 관광·레저 인프라 개발 및 체험형 콘텐츠 설계에도 참고 자료로 활용 가능합니다."
