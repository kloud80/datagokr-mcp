summary_user: 빅카인즈에 모인 104개 주요 신문·방송사의 경제면 기사를 분석해 월별로 가장 많이 나온 명사 200개를 순위와 빈도수로 정리한 집계 데이터이며, 기사 단위 원천 자료는 아니다(CSV 파일, 3,394바이트). 연구자·기자·정책 분석가가 '특정 시기 경제 뉴스에서 어떤 이슈와 키워드가 두드러졌나'를 확인하거나 보도 경향을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 키워드 문자열을 기준으로 직접 맞춰 쓰거나, 같은 기관의 다른 면 고빈도 명사 데이터와 나란히 비교하는 정도로 연결한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 공공데이터입니다. 104개 주요 신문과 방송사에서 제공한 기사 텍스트를 대상으로 경제면 보도를 분석하여, 월별로 가장 많이 등장한 명사 200개를 추출하고 순위와 빈도를 함께 제공합니다. 이를 통해 특정 시기 경제 뉴스에서 어떤 이슈와 키워드가 두드러졌는지 파악할 수 있으며, 언론 보도의 경향 분석, 경제 의제 탐색, 연구 및 교육 자료로 활용할 수 있습니다. 특히 빅데이터 분석 기법을 활용한 언론 메타데이터 자료라는 점에서, 정책 연구자, 학계, 저널리스트뿐 아니라 일반 이용자에게도 의미 있는 참고 자료가 될 수 있습니다.
