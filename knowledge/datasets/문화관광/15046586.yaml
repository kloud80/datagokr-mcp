description_portal: '○ 통계개요* 통계명 : 국제행사(MICE) 개최 현황* 통계종류 : 서울시 국제행사 개최실적을 제공하는 일반ㆍ보고통계* 작성목적 : MICE 산업의 규모를 종합적으로 파악하여 각종 정책의 수립 및 평가,기업의 경영계획 수립, 그리고 학계 및 연구소 등 학술연구 활성화를위한 기초자료를 제공하기 위함* 조사기관 : 한국관광공사* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시내용 - 세계국제회의(UIA) 및 MICE 행사 개최건수, 참가자수 등○ 용어설명* MICE는 Meetings, Incentive tours, Conventions, Exhibitions의 머리글자를 딴 단어로고부가가치 산업인 회의 및 전시산업을 통칭하는 용어임* 세계국제회의 : 국제협회연합(Union of International Associations, UIA) 기준 국제회의- 국제기구가 주최하거나 후원하는 회의로 총 참가자수가 50명 이상인 회의- 국제기구에 의해 주최되거나 후원되지 않더라도, 국내단체 또는 국제기구의 국내지부가 주최하는 회의로 "참가국수 5개국 이상, 총 참가자수 250명 이상이거나전시회를 동반한 경우 (인원 상관 없음)'
