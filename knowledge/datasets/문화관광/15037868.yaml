summary_user: 서울 강북구 관내 공원·산책로·체육공원에 설치된 야외운동기구를 설치 장소별로 담은 파일로, 기구 종류·개수·설치주소·설치연도·설치업체·담당부서가 들어 있다(약 17KB CSV, 시군구 범위의 개별 주소 단위). 강북구 주민이 집 근처 어느 공원에 어떤 운동기구가 몇 개 있는지 찾거나, 구청 담당자가 오래된 기구의 교체·보수 대상을 고를 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 설치주소를 지오코딩하거나 공원명·기관명을 맞춰 연결해야 한다.
description_portal: 이 데이터는 관내 공원, 산책로, 체육공원 등에 설치된 야외운동기구 현황을 제공하는 공공데이터입니다. 주요 항목으로는 운동기구 관리부서명, 설치장소, 설치연도, 설치 운동기구 종류, 기구 개수 등이 포함되어 있으며, 각 운동기구의 위치와 유형, 관리 주체를 확인할 수 있습니다. 주민들은 이 데이터를 활용하여 가까운 운동기구를 찾아 신체 활동을 계획하고, 건강 증진과 여가 활동에 적극 활용할 수 있습니다. 또한 행정기관은 설치 현황을 체계적으로 관리하고, 시설 보수, 교체, 추가 설치 계획 수립, 주민 건강 정책 개발 등 다양한 행정적 목적으로 활용할 수 있습니다. 서울특별시 강북구에 등록된 야외운동기구현황(야외운동 기구종류, 설치수량, 설치주소, 설치년도, 관리담당부서, 설치업체 등)를 포함합니다
