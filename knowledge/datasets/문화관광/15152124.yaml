description_portal: '부산관광공사에서 운영 중인 해외홍보사무소 현황입니다. 2017년 타이베이 홍보사무소 개소를 시작으로 베이징, 오사카 홍보사무소가 개소했으며 2018년도에 방콕, 2019년도에 쿠알라룸푸르, 2025년 도쿄 홍보사무소가 개소되어 총 6개의 홍보사무소를 운영 중입니다.데이터는 개소년월을 기준으로 정렬되어 있으며 타이베이, 오사카, 베이징, 쿠알라룸푸르 홍보사무소는 한국관광공사(KTO) 해외지사와 동일 건물을 사용하고 있기 때문에 한국관광공사 해외지사와 동일한 주소지를 가집니다.개소년월은 월(月) 단위까지 제공되는 데이터로, 셀 서식으로 인해 일(日) 단위가 공통적으로 01일로 표기되었으나 무시해주시면 됩니다. (예시: 타이베이 홍보사무소 개소년월 = 2017년 6월)'
