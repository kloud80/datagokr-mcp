summary_user: 국악방송과 원트리즈 뮤직이 공공데이터 기업매칭 사업으로 제작한 전국 8도 민요 MR(반주 음원) 목록을 음원 한 곡씩 담은 파일로, 음원코드·자료명·제작사·연주자·제작년도·장르·키워드·홈페이지 주소를 포함한다(CSV 약 30KB). 국악 교사나 공연·영상 제작자가 '특정 지역 민요의 반주 음원을 어디서 구할 수 있나'를 찾을 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID 같은 외부 데이터와 직접 이어지지 않고, 자료명(곡명)이나 키워드를 기준으로 이름 매칭할 때만 연결된다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 공연 목록·예매 데이터와 자동 결합이 되지 않으며, 곡명 등 텍스트 매칭에 의존한다. 명세상 수시·이벤트성으로 한 번 생성된 뒤 바뀌지 않는 성격의 목록이다.
