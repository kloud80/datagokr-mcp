summary_user: 부산 기장군에 있는 야영장·캠핑장을 업체 1곳당 1행으로 담은 건별 목록이며, 업종·상호·소재지·전화번호·영업상태를 담는다(파일 크기 641바이트의 소규모 CSV). 기장군에서 캠핑할 곳을 찾는 여행객이 어느 읍에 어떤 야영장이 영업 중인지, 연락처가 무엇인지 확인하는 데 쓴다. 등록번호나 사업자번호 같은 전역 조인 키가 없어서, 다른 데이터와는 상호명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 부산광역시 기장군에 있는 7개의 야영장 및 캠핑장에 대한 공공데이터입니다.각 업체의 업종, 상호명, 소재지, 전화번호, 영업상태 등의 자료가 포함되어 있습니다.기장군에는 총 7개의 야영장이 있으며 모두 일반야영장업의 형태로 운영되고 있습니다.상호는 만석꾼 캠핑장, 부산카라반파크, 지오클럽, 제이스글램핑, 더무빙카라반캠핑, 초원숲속야영장, 장안캠프가 있으며기장군 정관읍에 1개소, 일광읍에 3개소, 장안읍에 3개소가 위치하고 있습니다.자세한 내용은 파일을 참고하시기 바랍니다.
