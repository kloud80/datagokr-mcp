description_portal: '"하이원리조트 VOC 접수 분석 데이터"은 (주)강원랜드에서 접수된 VOC 현황을 연도와 월 단위로 집계한 자료입니다. 접수경로별로 분류된 VOC를 사업부 단위의 대분류와 항목별 중분류로 구분하여 관리하며, 고객 불만, 칭찬, 제안·건의, 문의, 보상, 규제애로, 아이디어 제안, 개선제안, 모니터링 등 다양한 유형별 건수를 포함합니다. 이를 통해 특정 시기, 사업부, 접수경로에 따른 고객 의견의 양상과 변화를 종합적으로 파악할 수 있습니다. 고객만족도 분석, 불만 원인 진단, 서비스 개선방안 도출, 운영 효율화, 고객 소통 강화 등 다양한 목적으로 활용할 수 있으며, 특히 식음·카지노·스키 운영 등 영업장별 특성을 고려한 고객 경험 분석에 유용한 기초자료가 됩니다. 또한 VOC 유형별 합계 건수를 포함하여 전사 차원의 고객 의견 관리 및 품질 경영 활동에도 활용할 수 있습니다.'
