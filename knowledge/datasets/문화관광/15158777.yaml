services:
  - op: /getOpnSourSWProjtList
    name: 오픈소스SW프로젝트조회
    endpoint: https://apis.data.go.kr/B552546/OpnSourSWProjtInfoService/getOpnSourSWProjtList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: projectName
        required: false
        desc: 프로젝트 명칭
      - name: licName
        required: false
        desc: 라이선스 명칭
      - name: summaryEn
        required: false
        desc: 프로젝트 내용의 영문 요약
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getOpnSourSWProjtDetail
    name: 오픈소스SW프로젝트세부정보 조회
    endpoint: https://apis.data.go.kr/B552546/OpnSourSWProjtInfoService/getOpnSourSWProjtDetail
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: pid
        required: true
        desc: 고유ID
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: false
