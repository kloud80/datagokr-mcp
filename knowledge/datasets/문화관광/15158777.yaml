summary_user: 국내외 오픈소스 소프트웨어 프로젝트(포털 설명상 약 60만여 개)를 프로젝트 단위로 담은 목록으로, 프로젝트 고유ID·프로젝트 명칭·라이선스 명칭을 제공하며 상세 정보 오퍼레이션이 따로 있다. 기업·기관 개발자가 "도입하려는 오픈소스 프로젝트가 어떤 라이선스를 쓰는가"를 확인해 라이선스 준수와 법적 분쟁 예방에 쓴다. 다른 데이터와 잇는 전역 조인 키는 없어 프로젝트명·라이선스명 같은 이름 매칭으로만 연결하며, 목록에서 받은 고유ID(pid)를 상세 조회에 넘겨 쓰는 내부 연계 구조다.
description_portal: 오픈소스SW프로젝트정보 서비스는 국내외 오픈소스 개발자들에 의해 추진되고 있는 약 60만여 개의 오픈소스 소프트웨어 프로젝트에 대한 정보를 제공합니다. 프로젝트명, 라이선스 명칭 등 다양한 항목을 조회할 수 있으며, 프로젝트의 상세 정보도 함께 제공합니다. 이를 통해 관심 있는 오픈소스 프로젝트의 라이선스를 확인할 수 있으며, 오픈소스 사용에 따른 법적 분쟁 예방 및 효율적인 관리에 활용할 수 있습니다. 기업, 기관, 개발자들이 오픈소스를 안전하게 도입하고 활용하는 데 도움이 될 수 있습니다.
team:
