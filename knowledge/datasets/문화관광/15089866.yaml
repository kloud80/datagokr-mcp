summary_user: 독립기념관이 서비스하는 소장자료 가운데 국민이 자주 찾는 자료를 한 건씩 담은 목록 파일로, 자료 구분·자료명·설명·등록날짜·자료번호·지정번호·지정일자를 담는다. 태극기·독립선언서·유묵·임시정부·한국광복군 관련 자료 중 어떤 것이 대표 소장품인지 확인하려는 교사·연구자·전시 기획자가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 문화유산·소장품 데이터와는 자료명이나 지정번호를 이름·코드로 맞춰 연결한다.
description_portal: 독립기념관에서 서비스하고 있는 소장자료 중에서 국민들이 즐겨찾는 자료에 대한 정보로 데이터로 순번, 자료구분, 제목, 설명, 등록날짜, ID, 자료분류 등을 제공합니다.주요 내용으로는 태극기 목각판, 한국광복군 서명문 태극기 등 태극기 관련 자료, 3.1독립운동 선언서 등 독립선언서 관련 자료, 독립운동가가 사용했던 인장과 직접 쓴 글씨인 유묵, 민족기록화, 독립운동가 엽서, 3.1운동 자료, 대한민국 임시정부 자료, 한국광복군 자료, 소년운동/군사자료, 어린이날 자료, 윤봉길 의사 상하이 의거,  하와이 한인과 독립운동, 독립운동가 김상옥 의사 자료 등으로 구성되어 있습니다.
