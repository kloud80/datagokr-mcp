summary_user: 강원특별자치도 양구군에 등록된 야영장 5곳(국토정중앙천문대야영장, 약수골캠프촌 숲속·오토캠핑장 등)의 명칭·주소·등록일·사이트 수를 야영장 한 곳당 한 행으로 담은 소규모 파일(csv, 505바이트)이다. 양구에서 캠핑할 곳을 찾는 여행객이나 군 단위 야영장 공급 규모(사이트 수)를 파악하려는 관광 분석가가 '양구군에는 어떤 야영장이 있고 각각 몇 면 규모인가'를 확인하는 데 쓴다. 전역 조인 키나 코드 필드가 없어 다른 야영장·관광사업 등록 데이터와는 야영장 명칭이나 주소 문자열 매칭으로만 이어 쓴다.
description_portal: 강원특별자치도 양구군에서 관리하는 야영장 현황입니다.야영장명칭, 주소, 등록일, 사이트수 정보를 제공합니다.국토정중앙천문대야영장, 약수골캠프촌 숲속캠핑장, 약수골캠프촌 오토캠핑장, 동수리 인문학마을 협동조합 야영장, 곰취향 가득한 팔랑골 캠핑장 정보를 제공합니다.2002년 우리나라의 4극지점인 독도 동단, 평북 마안도 서단, 제주 마라도 남단, 함북 유포면 북단을 기준으로 한 중앙위선과 중앙경선이 만나는 중앙 지점이 인공위성을 이용한 과학적 측정에 의해 국토정중앙면 도촌리 산 48번지로 확인되었습니다.
