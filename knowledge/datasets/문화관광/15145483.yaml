description_portal: '○ 통계개요* 통계명 : 서울축제 참여율 및 만족도* 통계종류 : 서울서베이의 서울시민 서울 대표축제 인지도를 제공하는 일반ㆍ조사통계* 작성목적 : 도시정책지표에 대한 포괄적인 자료구축및분석을 실시함으로써서울의 현재 상태에 대한 객관적이고 심층적인 분석과 현재 도시발전 수준을모니터링하는 한편, 시정의 변화에 따른 시민과 기업의 입장에서 느끼는정책의 실효성을 객관적으로 측정하여 보다 발전된 정책의 방향을제시하는데 목적이 있음* 조사체계 : 조사기관 → 서울특별시 스마트도시담당관* 공표주기 : 정기(매년, 8월)* 공표범위 : 지역 - 서울시 및 자치구내용 - 서울시민(성별·연령별·지역별·학력별 등)의 서울 대표축제 인지도및 만족도, 참여경험 등○ 용어설명* 서울축제 인지도 : 서울시 및 구청에서 개최하고 있는 다양한 축제에 대하여들어본 경험이 있는 비율* 서울축제 참가율 : 인지자 중에서 축제에 참여한 경험이 있는 비율* 서울축제 만족도 : 참여자 중에서 만족하는 정도○ 기 타* 질문 : 귀하는 서울에서 개최된 축제에 참여한 경험이 있으신지요?귀하는 축제에 참여하신 후 어느 정도 만족하셨는지요?'
