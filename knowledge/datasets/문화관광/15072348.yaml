summary_user: 전국 대학도서관별로 평가년도마다 장서수·사서수·대출자수·대출권수·자료구입비를 담은 도서관 단위 통계 파일이며, 소재지는 행정구역·시군구 수준으로 표시된다. 대학 관계자나 정책 분석가가 "우리 지역 대학도서관의 사서 1인당 장서·대출 실적과 자료구입비가 다른 시도와 비교해 어느 수준인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 도서관코드(같은 체계를 쓰는 데이터에 한함)나 도서관명·시군구 이름 매칭으로만 잇는다.
limits: 전역 조인 키가 없어 학교 정보나 다른 도서관 데이터와 붙이려면 이름·코드 매핑을 따로 해야 한다. 위치는 시군구 단위까지만 있어 그보다 세밀한 지역 분석에는 쓰지 못한다.
