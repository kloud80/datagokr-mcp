summary_user: 서울 강서구의 수영장업 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가일자·취소일자, 영업상태와 세부 영업상태, 폐업일자, 지번·도로명 주소와 좌표, 사업장명, 건물 면적 등 시설 정보를 포함한다. 주민이나 분석가가 '강서구에서 지금 영업 중인 수영장은 어디이고, 최근 폐업한 곳은 어디인가'를 확인하거나 체육시설 공급 분포를 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 사업장명·주소 매칭이나 자치단체 코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드로만 이어 쓰며, 같은 LOCALDATA 체육시설업 명부(헬스·당구·체육도장 등)나 상권 데이터와 나란히 놓고 개폐업 흐름을 보는 데 쓴다.
description_portal: 서울시 강서구 지역 내 수영장 시설의 인허가 현황을 정리한 것으로, 각 수영장의 인허가일자, 폐업 여부, 세부 영업상태 등의 정보를 포함합니다. 수영장 시설은 주민 건강 증진과 레저 활동에 중요한 기반 시설로, 해당 데이터를 통해 지역 내 스포츠·여가 기반시설의 공급 분포 및 운영 상태를 체계적으로 파악할 수 있습니다. 체육복지 정책 수립, 안전관리 대상시설 목록화, 공공체육시설 확대 검토 등 다양한 정책적 활용이 가능하며, 폐업 이력 정보도 함께 제공돼 실효성 분석에도 유리합니다. 데이터 제공처는 체육관광과입니다.
