summary_user: 경기도 시군별 공공 야구장을 시설 한 곳당 한 행으로 담은 현황 자료로, 준공연도·소유기관·관리주체, 내야·외야 바닥재료, 면적과 루 간 거리, 관람석 수·수용인원, 건설사업비, 주소와 위경도를 포함하며 전용경기장과 연습장이 함께 들어 있다. 동호인이 우리 시군에 인조잔디 야구장이 어디 있는지 찾거나, 분석가가 시군별 야구장 수와 노후도(준공연도)를 비교해 보수·확충 대상을 고를 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 시군명·시군코드(SIGUN_CD)나 시설명·주소로 맞추거나 위경도로 공간 결합해 이어 쓴다.
description_portal: 이 데이터는 경기도 내 공공 야구장의 현황을 정리한 자료로, 각 시군별 야구장명, 준공연도, 소유기관, 관리주체, 내야 및 외야 바닥재료, 야구장 면적, 루 간 거리, 관람석 좌석수, 수용인원수, 건설사업비, 위치정보 등을 포함하고 있습니다. 주요 항목으로는 ‘시설명’, ‘내야바닥재료명’, ‘외야바닥재료명’, ‘면적(㎡)’, ‘1-3루길이(m)’, ‘소재지도로명주소’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며, 지역 체육 인프라 분석, 야구 저변 확대 정책, 시설 보수 및 확장 검토 등에 유용하게 활용될 수 있습니다. 특히, 바닥재료는 대부분 인조잔디로 되어 있으며, 일부 항목은 결측값이 존재해 자료 분석 시 주의가 필요합니다. 야구장은 전용경기장뿐 아니라 연습장도 포함되어 있으며, 위탁 운영 여부도 명시되어 있어 운영형태 분석에도 활용 가능합니다.
