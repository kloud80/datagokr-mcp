summary_user: 경주시 관내 주요 관광지를 한 곳씩 담은 목록으로, 관광지 구역·관광지명·주소·전화번호를 개별 주소 단위로 제공한다. 경주 여행을 계획하는 관광객이나 지역 관광 앱 개발자가 "경주의 어느 관광지가 어디에 있고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 등 다른 관광 데이터와는 관광지명이나 주소를 직접 맞춰 연결해야 한다.
description_portal: 경상북도 경주시에서 제공하는 본 오픈API는 관내 주요 관광지의 위치 및 관련 정보를 체계적으로 제공한다. 본 데이터는 관광지의 명칭, 주소, 연락처, 위치좌표, 입장료, 운영시간, 편의시설 정보 등을 포함하며, 관광객의 여행계획 수립과 관광 콘텐츠 개발에 활용될 수 있다. 특히 문화재, 자연유산, 공원 등 다양한 유형의 관광지를 포괄하고 있어 사용자 맞춤형 관광서비스 구현이 가능하다. 또한 지도 기반의 정보 시스템이나 모바일 앱과의 연계를 통해 실시간 정보 제공이 용이하며, 관광산업 활성화를 위한 기초 자료로서의 가치가 높다. 관광객의 편의 증진은 물론, 지역 경제 및 문화콘텐츠 산업에도 긍정적인 효과를 기대할 수 있다
