summary_user: 국립국어원의 외래어 한글 표기 기준을 표기 항목별로 담은 데이터로, 한글 표기와 원어 표기, 국명, 언어명이 제목·대체제목·설명·언어 등 메타데이터 형식의 필드에 들어 있으며 지역 구분이 없는 전국 단위 자료다. 기자·편집자·교사나 번역·자동교정 시스템 개발자가 특정 외국 인명·지명·용어를 한글로 어떻게 적는 것이 표준인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 다른 데이터와는 원어나 한글 표기 문자열을 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 외래어의 한글 표기 기준을 체계적으로 제공하여 올바른 언어 사용을 지원하는 데이터셋입니다. 한글 표기와 원어 표기, 국명, 언어명 등 다양한 정보를 포함하고 있어 외래어 표기법의 정확한 적용이 필요한 분야에서 활용할 수 있습니다. 언론, 출판, 교육, 정보통신 등 다양한 분야에서 외래어 표기 통일과 표준화에 기여하며, 데이터에는 자원의 명칭, 책임 주체, 등록일, 소속 DB, 주제 분류, 키워드, 관련 장소, 시간적 범위, 언어, 저작권 등 상세 정보가 포함되어 있습니다. 외래어 표기 관련 연구, 자동화 시스템 구축, 콘텐츠 제작 등 다양한 목적으로 활용 가능합니다.
