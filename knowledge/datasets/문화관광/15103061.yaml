summary_user: 부산광역시 연제구의 공원·등산로 등에 설치된 야외 운동기구를 시설별로 담은 파일로, 시설명·주소·위도·경도와 운동기구 종류·수량, 담당부서를 개별 행 단위로 제공한다. 주민이나 생활체육 분석가가 '우리 동네 근처 어느 공원에 어떤 운동기구가 몇 개 있나'를 찾거나 구 안의 기구 분포를 지도에 올려 보는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소나 위도·경도로 공간 매칭하거나 시설명을 이름 대조해 연결한다.
description_portal: 부산광역시 연제구 야외(실외) 운동기구 현황으로 시설명, 주소, 위도, 경도, 운동기구 종류, 수량에 대한 정보를 제공하고 있습니다.운동 기구 중에서도 야외에 설치되어있는 운동 기구를 야외 운동 기구라고 한다. 야외 설치에 적합한 형태와 실내 설치에 적합한 형태 모두 존재하기 때문이다.공원이나 등산로에 설치된 운동기구로 지나가는 사람은 누구나 사용할 수 있다. 젊은 사람들에겐 여러모로 아쉽지만 근력이 부족한 노년층에게는 좋은 운동기구로 건강에 필수적인 근력 운동을 도와준다.특히 노년층은 유산소에 치우친 운동을 하는 경우가 많은데 노화에 따른 근력을 최대한 보존하기 위해서는 이러한 야외 운동 기구를 사용해서 근력 운동을 병행하는 편이 좋다. 일반적으로 걷기, 런닝에서 챙기기 힘든 코어 운동이나 스트레칭을 할 수 있으며 자신이 젊더라도 운동을 등한시 했다면 야외 운동기구로도 충분히 자극이 간다.
