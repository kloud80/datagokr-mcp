summary_user: 국립중앙극장 공연예술박물관이 관리하는 공연예술자료의 장르 분류 코드표로, 코드번호·코드명·전체 경로명·최상위 코드·레벨을 한 행씩 담는다(약 14KB 크기의 CSV 파일 한 개). 연극·무용·음악·연희·공연일반 및 행사·전시 같은 장르가 하위 단계로 어떻게 나뉘는지 확인하거나, 공연예술 아카이브 자료를 장르별로 묶어 분석하려는 연구자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID(mt20id) 등과 바로 이을 수 없고, 같은 기관 자료의 분류 코드나 장르명을 맞춰 연결해야 한다.
description_portal: 국립중앙극장 공연예술박물관에서 작성 및 관리하고 있는 공연예술정보의 장르별 분류 데이터베이스입니다.  코드번호, 코드명, 코드전체명, 최상위코드명, 장르의 레벨 등의 정보를 제공합니다.분류유형은 공연예술  장르인 연극, 무용, 음악, 연희, 공연일반 및 행사, 전시 등으로 구분되어 있으며 각 장르에 하위 단위의 5단계 레벨까지 제공하고 있습니다. 목록 상의 분류유형 정보는 공연예술박물관 누리집인 공연예술 아카이브 플랫폼 "별별스테이지"에서 장르별 메뉴로 검색도 가능하니 참고하시기 바랍니다.
