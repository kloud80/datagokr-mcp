summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU)에서 이용자가 만든 여행일정을 일정 1건당 1행으로 담은 원천 목록으로, 포털 설명 기준 15,507건이며 제목·언어·여행 시작일과 종료일·인원·태그·조회수·공유수·좋아요수·인기점수 등을 포함한다. 관광 마케터나 서비스 기획자가 '제주 여행일정 중 어떤 기간·인원·태그의 일정이 조회와 공유를 많이 받는가'를 분석해 인기 코스 기획이나 일정 추천에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 날짜(여행시작일·종료일)나 태그·제목 같은 이름 매칭으로만 느슨하게 이어 쓰고, TourAPI 관광지(contentId)와 직접 연결되지는 않는다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 여행일정 내역입니다.- 해당 데이터는 사용자가 사이트에서 여행일정 기능을 통해 여행일정을 생성합니다.- 개방데이터 항목은 여행일정아이디, 언어코드, 제목, 조회수, 공유수, 여행시작일, 여행종료일이며 전체 데이터 수는 15,507건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 여행일정 생성 및 관리 현황을 파악하여, 이용자 맞춤형 여행일정 추천 서비스 개발, 인기 일정 분석, 이용자 참여 증진 및 커뮤니티 활성화, 여행코스 기획 및 개선, 관광 콘텐츠 기획 및 마케팅 전략 수립 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
