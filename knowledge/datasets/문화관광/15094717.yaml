summary_user: 제주 관내 장기체류 외국인 유동인구를 기준연월·분기·국적·시간대·읍면동별로 나누어 거주·직장·방문 인구로 담은 집계 통계로, 유동인구는 정각마다 같은 장소에 머문 시간을 분 단위로 모아 60으로 나눈 뒤 월별로 합산한 값이다. 제주 다문화·외국인 정책 담당자나 분석가가 "어느 읍면동에 어떤 국적의 장기체류 외국인이 어느 시간대에 많이 머무는가"를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동명(emd_name)이나 국적 이름을 맞추는 방식으로만 이어 쓴다.
description_portal: '이 데이터셋은 제주특별자치도 관내에서 장기체류 중인 외국인 유동인구의 구성 비율을 기록한 통계 자료입니다. “유동인구”는 매일 01시부터 24시까지 정각마다 동일 장소에 머문 시간을 분 단위로 집계하고, 이를 60분으로 나눈 뒤 월별로 합산한 수치이며, 장기체류 외국인 전체 중 각 카테고리별 비중(예: 연령대, 성별, 체류 형태 등)을 백분율 또는 비율 형태로 제공하는 형태입니다. 제공기관은 제주특별자치도청이며, 관리 부서는 디지털혁신과입니다. 데이터 형식은 CSV로 공개되어 있어 누구나 무료로 다운로드 및 활용할 수 있습니다. 이 자료는 제주 지역 내 외국인 거주 기반 현황 파악, 다문화 정책 수립, 체류 외국인 커뮤니티 분석, 도시계획 및 복지 서비스 설계, 인구 구조 변화 모니터링 등에 유용합니다. 다만 측정 시점 및 수집 방식 기준으로 산출된 정적 요약치이므로, 이후 체류 외국인의 유입‧퇴출, 체류 형태 변화, 갱신된 체류자격 등의 변동은 반영되지 않을 수 있다는 한계가 있습니다.'
