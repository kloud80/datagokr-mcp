description_portal: '전통사찰의 지정등록 현황은 충북의  불교사찰 중 민족문화의 유산으로 보존가치가 있는 사찰을 사찰측의 신청에 의하여 지정 등록된 전통사찰민족문화의 유산으로서 역사적 의의를 가진 사찰을 "전통사찰"이라 하며,  정보 데이터로 충청북도에 소재하는 전통사찰에 대한 정보를 제공합니다. 사찰의 연도별 지정현황,  위치를 제공하며 전통불교에 대한 충청북도의 미래의 문화재적 가치를 보존하는 지표로 활용 될 수 있습니다.- 전통사찰 : 불상 등 불교신앙의 대상으로서의 형상을 봉안하고 승려가 수행하며 신도를 교화하기 위하여 건립, 축조된 건조물(경내지, 동산 및 부동산을 포함)로서 문화관광부장관이 전통사찰로 지정하여 각 시.도에 등록된 사찰전통사찰보존지 : "전통사찰보존지"란 불교의 의식, 승려의 수행 및 생활과 신도의 교화를 위하여 사찰에 속하는 토지를 말함'
