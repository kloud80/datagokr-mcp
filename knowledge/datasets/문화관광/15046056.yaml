summary_user: 한국관광공사가 정리한 국내 MICE 관련 정보를 행사정보·시설(베뉴)정보·서비스 업체 정보 3개 파일로 담은 전국 단위 목록형 데이터이며, 행사정보에는 행사명(국문·영문)과 본부단체명, 단체 유형이 들어 있다. 국내·외 MICE 업계 종사자가 "국내에서 열리는 국제회의·행사는 어떤 것이 있고 어떤 단체가 주최하며, 어떤 베뉴와 서비스 업체를 쓸 수 있나"를 파악하는 데 쓴다. 실측 컬럼에 TourAPI contentId나 지역코드 같은 전역 조인 키가 없어, 다른 관광 데이터와는 행사명·시설명·업체명 같은 이름 매칭으로만 이어 쓴다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 MICE 개최관련 정보 및 서비스를 제공하는 데이터입니다. 데이터 파일은 총 3가지로 MICE행사정보, 시설정보, 서비스 업체 정보를 포함합니다. 행사정보는 행사명(국문 및 영문), 본부단체명, MICE관련 정보를 포함합니다. 시설정보는 국문 및 영문으로 베뉴(Venue)명, 유형, 상세내역 그리고 홈페이지 주소를 제공하며, 서비스 업체 정보는 업체의 유형, 업체명(국문 및 영문), 홈페이지 주소를 제공합니다. 본 자료는 국내·외 MICE관련 산업 종사들이 국내 관련 행사 및 시설 현황을 파악하는 데 용이하게 사용할 수 있습니다.
