summary_user: 게임물관리위원회에서 등급분류 결정을 받은 게임물의 증명서·결정서 정보를 한 건씩 담은 파일(csv, 약 40KB)로, 등급분류번호·생성일과 선정성·폭력성·사행성·약물 등 심의 요소를 적은 등급분류사유 텍스트로 이루어진다. 게임 개발사가 비슷한 게임이 어떤 사유로 등급을 받았는지 선례를 찾거나, 연구자가 기간별로 자주 나오는 심의 이슈를 텍스트로 분석할 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 다른 등급분류 자료와는 등급분류번호를 이름·번호 매핑으로 맞춰야만 이어 쓸 수 있다.
