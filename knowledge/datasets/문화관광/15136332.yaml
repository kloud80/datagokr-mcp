summary_user: 월별로 방한 외래관광객 수를 방한 목적(관광·상용·공용·유학연수·기타)별로 나눠 담은 전국 단위 집계 파일로, 기준연월 한 행에 목적별 인원이 열로 들어 있다. 관광업계·분석가가 "최근 방한객 중 관광 목적과 상용 목적 비중이 월별로 어떻게 달라졌나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 통계와는 기준연월을 맞춰 붙이는 식으로만 이어 쓴다.
limits: 전국·비공간 집계라 지역별·관광지점별 분석에는 쓸 수 없고, 관광지점코드·시군구코드 같은 키가 없어 지역 데이터와 직접 조인되지 않는다. 내려받은 파일이 558바이트로 작아 수록 기간이 짧을 수 있으니 포함된 연월 범위를 먼저 확인한다.
