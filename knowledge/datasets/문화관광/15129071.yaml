description_portal: 성남시 평생스포츠센터의 체육프로그램정보(장소, 강좌명, 수강시간, 강습일, 대상 등)입니다. 성남시에서 운영하는 공공체육시설인 평생스포츠센터에서 제공하는 다양한 생활체육 강좌 및 프로그램의 운영 현황을 담고 있는 자료입니다. 해당 정보는 시민들이 건강한 여가활동을 할 수 있도록 도우며, 시민 맞춤형 체육복지 실현, 체육시설 이용률 분석, 행정 정책 수립 및 예산 계획 수립에 활용됩니다. 특히 성남시민의 건강 증진과 지역 커뮤니티 형성, 운동 기회 형평성 확보 등을 위한 기반자료로서 공공적 가치가 큽니다.자세한 내용은 홈페이지(https://spo.isdc.co.kr/)를 참고하세요.
