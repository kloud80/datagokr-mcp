summary_user: 성남시 평생스포츠센터에서 운영하는 생활체육 강좌를 강좌 한 건씩 담은 파일로, 시설명·장소·강좌명·수강시간·강습일·대상을 담는다(CSV 약 9.6KB). 성남 시민이 "근처 평생스포츠센터에서 평일 저녁에 들을 수 있는 성인 대상 강좌가 무엇인가"를 찾거나, 분석가가 시설별 강좌 구성과 대상층 분포를 살피는 데 쓴다. 전역 조인 키가 없어 다른 체육시설·프로그램 데이터와는 시설명 같은 이름 매핑으로만 이어 쓴다.
