summary_user: 서울특별시 중구에서 안전성 검사 대상 놀이기구를 한 종류 이상 설치해 운영하는 일반유원시설업 업소를 업소별로 담은 인허가 원장으로, 관리번호·인허가일·영업상태(영업/폐업 등)·소재지·놀이시설 수·보험 기간 등을 포함한다. 레저·놀이시설 창업을 검토하는 예비 사업자가 '중구에 현재 영업 중인 유원시설이 어디에 몇 곳 있는가'를 확인하거나, 시민이 등록된 시설인지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중구의 테마파크 등 안전성 검사대상의 놀이기구를 한 종류 이상 설치하여 운영하는 업소 정보입니다. 각 등록업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 관광진흥 및 레저활동 관련 사업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 놀이시설 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 시설점검 기준을 충족하고 이용안전에 중점을 둔 신뢰할 수 있는 여가생활 등록업소를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
