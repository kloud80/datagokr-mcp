summary_user: 구로구 내 복합유통게임제공업 업소를 건별로 담은 인허가 원천자료로, 업소명·인허가일자·취소일자·영업상태·폐업·휴업 기간, 지번·도로명 주소와 좌표, 시설면적·층수·방 수·비상구 등 시설 항목을 담는다. 구청 담당자나 분석가가 '구로구에서 현재 영업 중인 복합유통게임장이 어디에 있고 학교 주변에 몰려 있는가'를 확인하거나 점검 대상을 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 자료와는 관리번호(MGTNO)·업소명·주소 같은 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 복합유통게임제공업 인허가 정보는 구로구에서 유통 매장과 게임기기를 함께 운영하는 형태의 복합 오락시설을 관리하기 위해 구축된 행정자료이다. 데이터에는 인허가일자, 영업상태명, 상세영업상태, 지번주소·좌표, 게임기기 수, 시설면적, 부대시설 여부 등이 포함되어 있어 업소의 운영 실태와 건전성 기준 충족 여부를 종합적으로 파악할 수 있다. 복합유통시설은 게임 제공과 상품 판매가 혼합된 업종으로, 청소년 보호·소비자 안전·유해환경 관리와 밀접히 연관되므로, 기기 수량 및 영업 형태 정보는 규제 준수와 점검 우선순위 설정에 활용된다. 좌표 기반 정보는 업소의 지역 내 분포, 학교 주변 위험지대 파악, 상권 밀집도 분석 등 공간정책에도 직접적으로 기여한다.
accrual_periodicity: 일간
