description_portal: 「관광진흥법」에 따른 성남시  유원시설업(기타유원시설업, 일반유원시설업) 운영 현황으로 업종, 사업장명, 주소, 면적, 놀이기구(시설)종류 항목으로 구성되어 있습니다. 실내 놀이시설, 체험형 키즈카페, 복합문화공간 등의 시설을 말하며 , 수정구는 다양한 규모의 키즈카페 가 분포하며 지역특성에 맞춘 테마형 키즈카페가 있습니다. 중원구는 주거 밀집 지역 내 소형 키즈카페 중심으로 운영되며, 지역 주민 대상의 커뮤니티 시설로 운영되는 경우도 있습니다. 분당구는 대형 쇼핑몰, 상업시설 인근에 키즈카페가 다수 있습니다. 프랜차이즈 형태의 체험형 키즈카페가 다수 운영중입니다.
