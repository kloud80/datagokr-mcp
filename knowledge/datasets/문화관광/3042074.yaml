summary_user: 부산광역시 수영구에 등록된 문화재매매업 업소를 한 행에 한 곳씩 담은 목록으로, 상호·소재지 주소·대표자·허가일을 포함하며 파일 크기가 402바이트에 불과한 소규모 CSV다. 수영구에서 정식 등록된 고미술품·골동품 매매업소인지 확인하려는 구매자나, 지역 문화재 유통업 현황을 살피려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 상호를 이름으로 맞추는 방식으로만 연결되고, 국가유산 지정번호나 지번(PNU)과는 직접 이어지지 않는다.
