summary_user: 국립무형유산원에 기증·기탁된 무형유산 관련 자료를 자료 한 건씩 목록으로 담으며, 필드는 자료명(nihcFdNm)·날짜·상세 페이지 이동 URL 세 가지가 확인된다. 연구자나 전시·교육 기획자가 "국립무형유산원에 어떤 기증·기탁 자료가 들어와 있고 상세 페이지는 어디인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자료명 같은 이름 매핑이나 같은 기관 데이터 기준으로만 연결한다.
limits: 포털 설명에 나오는 기증자·유물 종류·상태·보관 기관·사진 같은 상세 메타데이터는 실제 필드 목록에서 확인되지 않으므로, 상세 정보는 URL로 이동해 봐야 한다. 개발계정은 하루 500회 호출로 제한되고 serviceKey가 필요하다.
