summary_user: 성남시 시립 체육시설(게이트볼장·국궁장·배드민턴장·축구장·테니스장·야구장·파크골프장 등)을 시설 한 곳씩 시설구분·상세명, 지번·도로명 주소, 전화번호, 관리 주체, 준공일, 부지·경기장 면적, 시설 규모, 협약기간과 함께 담은 시군구 단위 현황 파일이다. 성남 시민이 동네 근처의 테니스장·축구장·파크골프장을 찾거나, 분석가가 시설별 관리 주체(성남도시개발공사·성남시체육회·성남시청)와 면적을 비교하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 시설명이나 주소 문자열로 맞춰 이어야 하며, 문체부 전국체육시설 데이터나 같은 기관(성남시)의 다른 체육 데이터와 이름·주소 기준으로 연결한다.
