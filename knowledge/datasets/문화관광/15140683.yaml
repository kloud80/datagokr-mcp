description_portal: '은평구에서 태권도, 검도 등 신체 및 정신을 단련시키는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 태권도, 합기도, 검도, 유도 등 「체육시설의 설치·이용에 관한 법률」에 규정된 운동을 전문적으로 지도하는 체육도장의 인허가 현황을 담고 있습니다. 데이터에는 각 도장의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같이 생활 체육시설 관리의 핵심 정보가 포함되어 있습니다.체육도장은 주로 아동과 청소년들이 심신을 단련하는 중요한 생활체육 공간입니다. 이 데이터는 학부모와 수련생들이 정식으로 신고된 합법적이고 안전한 시설을 확인하고 선택할 수 있도록 돕습니다. 또한, 지자체는 이를 기반으로 관내 체육도장의 현황을 체계적으로 파악하고, 시설 안전 점검 및 운영을 지원하는 등 구민들의 건전한 체육 활동 환경을 조성하기 위한 필수적인 기초 자료로 활용합니다.'
