summary_user: 2025년 제주를 방문한 외국인 관광객과 한국 전체 외국인 입국자를 권역별(아시아·서구 등)·주요 국가별(일본·중국·대만 등)로 비교해, 한국 입국자 중 제주 방문 비율(제주 점유율)을 산출한 집계표 파일이다. 제주 관광 마케팅 담당자나 분석가가 '어느 나라 관광객이 한국에 와서 제주까지 오는 비율이 높은가'를 보고 국가별 홍보 우선순위를 정하는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어, 다른 출입국·관광 통계와는 국가명·권역명을 이름으로 맞춰 연결해야 한다.
