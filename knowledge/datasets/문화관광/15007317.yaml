description_portal: 본 데이터는 제주특별자치도관광협회의 외국인 관광객 입도통계와 한국관광공사의 국제관광 입국통계자료를 기반으로 2025년 제주 방문 외국인 관광객 현황과 한국 전체 외국인 관광객 입국 현황을 비교·분석한 결과입니다. 아시아, 서구 등 권역별 및 일본, 중국, 대만, 홍콩, 싱가포르, 태국 등 주요 국가별로 한국 입국자 중 제주 방문자 비율(제주 점유율)을 산출하였으며, 이를 통해 제주 관광 수요의 국가별 분포와 트렌드 변화 양상을 체계적으로 파악하고 정책 수립과 마케팅 전략 수립에 활용할 수 있습니다.
