summary_user: 서울특별시 중구의 무도학원업(댄스·사교무용 교습 업소) 인허가를 업소 1곳당 1행으로 담은 건별 원천 명부로, 관리번호, 인허가·취소·폐업 일자, 영업 상태, 지번·도로명 주소, 중부원점TM 좌표, 지도자 수·건물 면적 등을 포함한다. 무도학원 창업을 준비하는 예비 사업자가 '중구에 현재 영업 중인 댄스학원이 어디에 몇 곳 있고 최근 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)를 기준으로 다른 LOCALDATA 체육시설업 명부나 상권 데이터와 맞춰 쓴다.
description_portal: '서울특별시 중구의 댄스학원과 같이 춤(댄스) 등을 가르치는 것을 목적으로 운영되는 업소 정보입니다. 데이터는 각 무도학원업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 무도학원업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 사교 무용 강사 기술 보유 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
