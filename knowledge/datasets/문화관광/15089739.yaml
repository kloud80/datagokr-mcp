description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 질병 관련 뉴스 메타정보 자료입니다. 질병은 개인의 건강뿐 아니라 사회·경제 전반에도 큰 영향을 미치는 주요 보건 이슈로, 감염병의 확산, 만성질환의 증가, 의료 체계의 대응, 예방 정책 등 다양한 차원에서 언론 보도의 중요한 주제로 다뤄져 왔습니다. 본 자료는 국내 주요 신문과 방송 보도에서 질병과 관련된 기사들을 분석해 주요 키워드와 빈도를 추출하고, 시기별 보도 경향과 사회적 인식 변화를 파악할 수 있도록 구성되었습니다. 이를 통해 감염병 대응, 백신 및 치료제 개발, 만성질환 관리, 의료 인프라 확충, 보건 정책의 방향성이 언론 담론에서 어떻게 다뤄졌는지를 객관적으로 확인할 수 있습니다. 또한 학술 연구, 정책 수립, 언론 분석, 교육 현장에서 활용할 수 있는 기초 자료로, 국민 건강 증진과 지속 가능한 보건 체계 마련을 위한 사회적 논의에 기여할 수 있습니다.
