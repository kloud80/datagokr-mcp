description_portal: '경상남도 거창군의 공공체육시설 이용현황에대한 데이터로, 공공체육시설명, 소재지 주소, 연평균이용횟수 등의 정보를 제공합니다.○ 데이터 기준일 : 2024.  05. 22. (일회성 데이터)○ 공공체육시설이란 국가나 지방자치단체, 공공기관 등이 국민의 건강 증진과 여가 활동을 위해 설치·운영하는 체육 공간을 말합니다. 대표적으로 체육관, 수영장, 축구장, 테니스장, 체력단련실, 야외 운동기구 등이 있으며, 주민 누구나 저렴하거나 무료로 이용할 수 있도록 개방되어 있습니다. 이러한 시설은 지역사회 내 체육활동 참여를 촉진하고, 세대 간 교류와 공동체 의식을 강화하는 데 기여합니다. 또한 체육복지 실현과 건강한 삶을 위한 기반으로서 중요한 역할을 수행합니다.'
