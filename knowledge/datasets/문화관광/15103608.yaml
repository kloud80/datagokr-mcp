summary_user: 군산시 내 유료·무료 주요 관광지점별로 2023~2025년 연도마다 1~12월 월별 관광객 수와 연간 합계를 한 행에 담은 집계 파일이다(csv 약 4KB). 군산 관광 담당자나 지역 상권 분석가가 '어느 관광지에 어느 달 방문객이 몰리고, 연도별로 늘었는가'를 확인하는 데 쓴다. 관광지점 코드나 시군구 코드 같은 공통 조인 키가 없어 다른 관광 통계와는 관광지 이름(관광지)과 연도를 맞춰 붙여야 한다.
