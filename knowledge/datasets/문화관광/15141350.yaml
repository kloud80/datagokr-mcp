summary_user: 서울특별시 금천구의 비디오물제작업 사업장을 한 곳씩 담은 인허가 원천 데이터로, 인허가일자·취소일자, 영업상태와 상세상태, 휴업·폐업 일자, 사업장명, 지번·도로명 주소와 좌표(X, Y), 시설 면적·층수 같은 항목을 담는다. 금천구에서 지금 영업 중인 영상 제작 사업장이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하려는 창업자·상권 분석가·연구자에게 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 실측 컬럼에서 확인되지 않아, 사업장명·주소를 직접 맞추거나 같은 기관 코드(개방자치단체코드)로만 다른 인허가 데이터와 연결한다.
description_portal: 비디오물제작업의 인허가 현황을 상세히 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등 기본 정보와 함께 각 사업장의 영업 현황, 위치, 시설 규모, 업종 구분 등 세부 항목을 포함하고 있습니다. 이를 통해 문화콘텐츠 제작업의 동향을 파악하고, 정책 수립, 창업 및 투자 분석, 지역 내 산업 분포 조사 등에 활용할 수 있습니다. 또한 해당 데이터는 문화산업 연구, 상권 분석, 지도 기반 서비스 개발, 제작 인프라 확충 계획 수립 등 다양한 분야에서 유용하며, 행정기관·연구기관·민간 기업 모두가 참고할 수 있는 기초 자료로 기능합니다.
