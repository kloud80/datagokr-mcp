summary_user: 서귀포시 중문동 주상절리대(산책로) 한 곳의 무장애여행 정보를 위도·경도·해발고도와 장소설명·이미지로 담은 지점 단위 원천 자료이며, 제주데이터허브 외부 API로 제공한다. 휠체어 이용자나 교통약자가 주상절리대 산책로를 찾아갈 때 위치를 확인하거나, 여행 앱 개발자가 무장애 관광지 지도에 이 지점을 올릴 때 쓴다. 전역 조인 키는 없으므로 TourAPI 관광지 목록 등 다른 데이터와는 장소 이름이나 좌표로 맞춰 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 주상절리(산책로) 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 주상절리대는 제주특별자치도 서귀포시 중문동 해안에 위치한 화산암이 바다에 식으며 기둥 모양으로 굳어진 해안 절벽지대로, 높이 30~40 m, 폭 약 1 km의 아름답고 웅장한 해안 경관을 자랑한다. 본 무장애 여행 정보는 휠체어 이용자와 교통약자의 접근성을 고려하여 장애인 전용 주차구역, 경사로를 갖춘 진입로, 장애인 화장실, 매표소까지의 무단차 동선 등을 포함한다. 다만 전망대는 계단형 데크로 구성되어 있어 휠체어 접근이 어려우므로, 해안 산책로 중심으로 순환 탐방하는 방식이 권장된다. 이 자료는 무장애 관광지 등록, 접근성 기반 여행 안내, 관광 서비스 개선 및 정책 수립 등에 활용 가능한 공공 데이터이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
