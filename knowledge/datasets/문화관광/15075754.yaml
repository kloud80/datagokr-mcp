description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 제주추사관은 조선 후기의 명필이자 학자인 김정희의 제주 유배 생활과 예술세계를 기리는 전시관으로, 서귀포시 대정읍에 위치한다. 전시실, 교육실, 수장고 등을 갖추고 있으며, 그의 현판과 편지글, 서화 유물 등이 전시되어 있다. 무장애 편의시설이 갖춰져 있으며, 장애인 전용 주차구역, 단차 없는 보조 출입구, 엘리베이터, 장애인 화장실 등이 제공되어 휠체어 사용자·고령자·유모차 이용자 등도 편안히 방문할 수 있다. 또한 본 유배지와 복원 초가집, 주변 전통 공간까지 관람이 가능하여 제주 문화유산과 역사 체험을 제공하며, 무장애 관광지 안내, 지도 서비스 제작, 관광 코스 설계, 문화유산 보존 및 홍보 자료로 공공 및 관광 분야에서 유용한 기초자료가 된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
