description_portal: '- 전라남도에 위치한 식당의 메뉴에 대한 설명을 한국어, 중국어(간체), 중국어(번체), 영어, 일본어로 번역한 데이터 입니다.- 식당명, 메뉴명, 메뉴설명(주재료,조리법,소스,옵션) 등의 다국어 메뉴 설명정보를 포함하고 있습니다.- 다국어 메뉴 설명 정보는 외국인 관광객들에게 식당 선택에 큰 도움이 됩니다. 해당 데이터를 활용하여 전라남도 지역의 다양한 식당 정보를 손쉽게 확인하시기 바랍니다.- 지역별 검색 : 데이터를 지역별로 필터링하여 원하는 지역의 식당 정보를 쉽게 찾을 수 있습니다.- 영업시간 및 휴무일 확인: 식당의 영업시간과 휴무일 정보를 통해 방문 계획을 세울 수 있습니다.'
