summary_user: 한국농어촌공사가 웰촌포털 계절테마여행코스로 소개하는 농촌관광 여행정보를 주제별로 한 행씩 담은 CSV 파일(약 161KB)로, 주제·태그·요약·코스정보와 시도·시군구를 함께 싣고 범위는 전국, 지역 단위는 시군구이다. 관광 마케팅 담당자나 지역관광 연구자가 '가을에 특정 시군구에서 소개된 농촌 체험 코스는 무엇인가'처럼 계절·테마별 농촌 여행 콘텐츠를 지역별로 찾을 때 쓴다. 전역 조인 키가 없어 시도코드·시군구코드나 시도·시군구 이름을 맞춰 다른 지역 단위 관광·통계 자료와 이어 써야 하며, TourAPI 콘텐츠와 직접 연결되는 식별자는 없다.
description_portal: '- 한국농어촌공사에서 관리하는 농촌관광에 대한 계절, 테마별 여행정보 데이터로, 주제, 태그, 코스정보, 시도, 시군구 등의 정보를 개방하여 제공하고 있습니다.- 파일에 포함된 콘텐츠의 경우 저작권자의 허가 없이는 자유 이용할 수 없으므로, 해당 정보에 대한 자세한 내용은 웰촌포털 내 계절테마여행코스에서 확인하실 수 있습니다.- 월촌포털은 누구나 불편함 없이 농촌으로 여행갈 수 있도로고 농촌 여행 정보를 제공하며,- 계절테마여행코스에서 봄, 여름, 가을, 겨울별 이색투어, 축제등의 여행정보를 확인하실 수 있습니다.- 본 개방데이터는 관광 마케팅 및 정책 수립, 지역관광 콘텐츠 구성, 지역개발 연구 등의 자료로 활용 가능합니다.'
