summary_user: 서울특별시 송파구의 체력단련장업(헬스장 등) 인허가 내역을 사업장 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가일·취소일·영업상태·폐업일·휴업기간·소재지 주소·좌표·면적·지도자 수 등을 포함한다. 창업 예정자나 상권 분석가가 '송파구에서 최근 문을 연 헬스장과 폐업한 헬스장은 어디이고 몇 곳인가'처럼 지역 헬스장 개폐업 흐름을 상권 신호로 볼 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 사업장명·주소 같은 이름 매핑이나 같은 기관의 자치단체 코드(OPNSFTEAMCODE)로 이어 쓰고, 다른 구의 같은 업종 인허가 데이터나 상권 데이터와는 주소·좌표 기준으로 맞춘다.
