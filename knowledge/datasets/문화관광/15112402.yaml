summary_user: 송파어린이영어도서관이 보유한 영어도서를 한 권(등록번호) 단위로 담은 소장 목록 파일로, 청구기호·도서명·저자명·발행자명과 기준일자가 들어 있으며 범위는 송파구 한 곳의 도서관입니다. 아이에게 읽힐 영어 원서가 이 도서관에 있는지 찾는 학부모나, 어린이 영어도서 소장 구성을 살펴보는 분석가가 쓴다. ISBN·도서관코드 같은 전역 조인 키가 없어 도서관정보나루 등 다른 도서 데이터와는 도서명·저자명 문자열 매칭으로만 이어 쓴다.
limits: ISBN이 없어 국가서지나 대출·인기도서 데이터와 정확히 조인하기 어렵고, 이름 매칭에 의존해야 한다. 대출 여부나 이용 실적은 담지 않는 소장 목록이며, 송파구 한 도서관만 다룬다.
