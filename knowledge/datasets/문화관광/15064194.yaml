description_portal: 은평구 관내 출판사 현황입니다. 속성으로는 번호, 사업체명칭, 소재지도로명주소,소재지지번주소,영업상태로 구성되어있습니다.해당 데이터는 서울특별시 은평구 내 「출판문화산업 진흥법」에 따라 등록된 출판사 1037개 업체의 현황 정보입니다.데이터 구성 항목은 번호, 사업체명칭, 소재지도로명주소, 소재지지번주소, 영업상태로 구성되어 있으며, CSV 형태로 제공됩니다. 각 출판사의 정확한 위치 파악을 위해 중부원점TM 좌표계 기반의 좌표 정보도 포함되어 있으나, 위경도 좌표는 제공되지 않습니다.출판사는 서적, 잡지, 정기간행물 등 다양한 출판물을 전문적으로 제작하는 업체로, 지역 내 문화콘텐츠 산업의 핵심 구성 요소입니다. 구민들이 출판 관련 서비스가 필요할 때 정식으로 등록된 업체를 확인할 수 있습니다.
