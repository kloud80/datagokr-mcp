description_portal: '제주특별자치도 내에 위치하고 있는 각종 전통 건축물 관련 조사 결과 데이터를 제공합니다.항목:  지역, 건축물명, 건축년도 등*돌과 진흙, 그리고 새로 지어진 제주 초가(草家)는 제주 특유의 건축양식으로 험한 자연조건을 이겨낸 제주 사람들의 지혜와 소박한 정서를 반영하고 있다. 한 울 안에 안거리와 밖거리 두 채의 집이 평등하게 배치된 ‘두커리집’은 제주 초가의 대표양식으로 꼽히는데 안거리는 부모세대가, 밖거리는 출가한 자녀가 거처하였다. (참고문헌: 제주의 문화재)자세한 사항은 제주도청 분야별 문화/역사/체육 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/culture/folklore/life/dwelling/dwelling01.htm'
