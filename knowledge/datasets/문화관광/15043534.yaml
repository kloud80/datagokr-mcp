summary_user: 제주 성산읍 일대 이생진거리 무장애여행 코스의 지점별 위도·경도·해발고도와 장소설명·이미지 정보를 지점 단위 건별로 담는다. 휠체어 이용자나 보행약자 가족이 "이생진거리를 어느 지점까지 평탄하게 둘러볼 수 있는가"를 확인하거나, 지자체·여행 서비스가 무장애 코스 안내 지도를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소명 매칭이나 좌표 근접으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 이생진거리 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 이생진거리는 제주 서귀포시 성산읍 일대 해안 절벽과 낭떠러지가 어우러진 경관 속에 조성된 무장애 여행 코스로, 시인 이생진 의 시비가 설치된 ‘시비 거리’와 바다 전망 지점을 포함한다. 이 데이터는 위치 정보, 지점별 설명, 이동 동선과 접근성 정보를 제공하며, 휠체어나 보행약자를 위한 진입 조건, 경로 여건 등을 고려해 정비된 자료이다. 공터 주차장 이용이 가능하나 장애인 전용 주차구역 등이 명시되어 있지 않고, 일부 구간은 잔디 또는 비포장이어 가급적 평탄한 루트 선택이 권장된다. 무장애 관광지 안내, 열린관광지 확대, 관광 서비스 개선 및 정책 수립을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
