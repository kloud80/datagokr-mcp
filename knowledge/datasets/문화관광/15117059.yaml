summary_user: 경기문화재단이 운영하는 지지씨플랫폼에 등록된 경기도 내 소식을 건별로 담으며, 항목마다 기관명, 제목, 분류명, 상세 보기 URL, 이미지 URL, 시작일·종료일, 작성일이 들어 있다. 도민이나 문화정보 서비스 운영자가 "이번 달 경기도에서 열리는 전시·행사 소식은 무엇이고 언제까지 하나"를 확인하거나 일정 안내 화면을 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(INST_NM)·제목 같은 이름 매칭으로만 이을 수 있고, 문화 분야 공통 키(공연 ID, 문화시설 코드)와도 바로 연결되지 않는다.
description_portal: 경기문화재단이 운영하는 지지씨플랫폼 내 등록된 경기도 내 일반 소식 정보입니다.문화 행사의 기관명, 제목, 분류명, 자세히 보기 URL, 이미지 URL, 시작일, 종료일을 제공합니다.이 데이터는 경기도 내에서 개최되는 문화행사 중 전시를 중심으로 한 행사 정보를 제공하는 자료입니다. 각 행사에 대해 주최 기관명, 전시 제목, 행사 분류, 행사 시작일자 및 종료일자, 관람 시간, 비용, 전화번호, 주최기관명, 행사 관련 URL 및 이미지 URL, 홈페이지 주소, 작성일자 등의 정보를 포함하고 있어 사용자는 지역 내 문화 콘텐츠를 쉽게 확인할 수 있습니다. 본 데이터는 지역 문화예술 프로그램 홍보, 문화행사 일정 관리, 참여자 대상 맞춤형 콘텐츠 제공 및 지역문화 활성화를 위한 자료로 활용될 수 있습니다. 특히, 이미지 URL 및 상세 URL 항목을 통해 시각자료와 세부정보 접근이 가능하다는 점에서 온라인 문화정보 플랫폼 구축에도 유리합니다.
