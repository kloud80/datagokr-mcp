summary_user: 대구광역시 서구가 연 서구청장배 체육대회를 행사 한 건씩 담으며, 행사명·시작일·종료일·장소를 제공하는 건별 목록이다. 서구 주민이나 지역 체육단체가 '올해 서구청장배 대회는 언제, 어디서 열렸나'를 확인하거나 연도별 개최 이력을 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 행사명·장소 이름을 맞추거나 같은 기관(대구 서구) 기준으로만 이어 쓴다.
limits: 대구 서구 한 시군구의 구청장배 대회만 다루며 좌표 등 공간 정보가 없어 지도 결합이 어렵다. 참가자·종목·경기 결과는 담지 않는다. 활용신청 후 serviceKey로 호출하며 개발계정은 하루 10,000회로 제한된다.
