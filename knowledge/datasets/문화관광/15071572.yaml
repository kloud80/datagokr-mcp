summary_user: 서울시 내 숙박업소(호텔·모텔·여관·게스트하우스 등)를 사업장별 한 건씩 담은 인허가 원천 데이터로, 인허가일·폐업일·영업상태와 주소·좌표, 한실·양실 수, 건물·사용 층수, 종사자 수, 다중이용업소 여부를 함께 담는다. 분석가나 정책 담당자가 '서울의 어느 지역에 현재 영업 중인 숙박업소와 객실이 얼마나 있고, 최근 폐업은 어디서 늘었나' 같은 숙박 시장 질문에 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사업장명·주소 매칭이나 좌표(X·Y), 자치단체 코드(OPNSFTEAMCODE)·관리번호(MGTNO)처럼 같은 인허가 체계(LOCALDATA) 안의 코드로 이어 쓴다.
description_portal: 서울시 숙박업 인허가 정보는 서울시 내 숙박시설(호텔, 모텔, 여관, 게스트하우스 등)에 대한 인허가 및 영업 현황을 보여주는 데이터입니다. 인허가일자, 인허가취소일자, 폐업일자, 휴업·재개업일자, 영업상태·상세영업상태를 통해 각 숙박업소가 현재 영업 중인지, 휴업 또는 폐업 상태인지를 행정 이력과 함께 확인할 수 있습니다. 사업장명, 전화번호, 지번·도로명주소, 우편번호, 좌표정보, 업태구분명, 위생업태명은 숙박업소의 위치, 유형, 위생 관련 분류를 파악하는 데 핵심적으로 사용됩니다. 건물 지상·지하층수와 실제 사용 시작·종료 층 정보는 숙박시설이 어느 범위의 층을 사용하는지, 건물 내에서 차지하는 규모를 보여 주며, 한실수·양실수·침대수·욕실수는 객실 구성과 수용 능력을 파악하는 데 중요한 지표입니다. 발한실여부, 좌석수, 세탁기수, 회수건조수 등은 사우나·휴게공간·세탁 등 부대서비스 제공 수준을 나타내는 항목입니다. 조건부허가 사유 및 기간 정보는 특정 조건 하에 영업이 허용된 시설을 식별하는 데 활용할 수 있고, 건물소유구분명은 자가·임대 여부 등 운영 형태를 파악하는 데 도움이 됩니다. 남성·여성 종사자수는 숙박업 인력 규모와 성별 분포를 분석하는 데 활용되며, 다중이용업소여부는 화재·안전 관리 등 규제 적용 대상을 구분하는 데 중요한 정보로, 전반적으로 서울시 숙박업 현황 파악, 관광·숙박 정책 수립, 안전관리 및 위생 점검 계획 수립 등에 활용 가능한 데이터입니다.
