summary_user: 제주 한림읍 대문없는마을 상명정낭마을 일대 무장애 여행 코스를 지점(포인트) 단위로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명과 전체코스·추천코스 여부를 담는다. 휠체어 이용자나 교통약자, 그리고 이들과 함께하는 여행자가 '상명정낭마을 산책로에서 휠체어로 갈 수 있는 동선과 쉬어갈 지점은 어디인가'를 확인하는 데 쓰고, 열린관광지 개발이나 무장애 관광 정책의 기초자료로도 쓴다. 실측 컬럼에 TourAPI contentId 같은 전역 조인 키는 없으므로, 다른 관광 데이터와는 위도·경도 기반 공간 대조나 마을·지점 이름 매칭으로 이어 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_대문없는마을상명정낭마을_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 대문없는마을 상명정낭마을(제주특별자치도 한림읍) 일대를 중심으로 조성된 무장애 여행 코스 정보를 제공합니다. 해당 마을 산책로는 교통약자와 휠체어 이용자의 이동 편의를 고려하여 설계되었으며, 접근 가능한 동선, 전망 및 휴식 포인트, 편의시설 현황 등이 포함되어 있습니다. 노면 상태, 경사도, 보행환경, 주차·화장실 접근성 등 현장 기반 요소가 반영되어 있어 무장애 관광환경 구축, 열린관광지 개발 및 관광 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
