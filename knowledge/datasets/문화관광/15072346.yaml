summary_user: 전국 교도소 내 도서관을 한 행으로 두고 평가년도별 장서수(인쇄), 대출자수, 대출권수, 자료구입비(천원)를 시군구 단위 소재지와 함께 담은 국가도서관통계 파일(csv, 약 4KB)이다. 교정정책 연구자나 분석가가 "교정시설 간 장서와 자료구입 예산 격차가 얼마나 되고, 수형자 대출 이용이 어느 시설에서 활발한가"를 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으며, 도서관코드나 도서관명·시군구로 다른 국가도서관통계(공공·작은도서관 등)나 도서관정보나루 자료와 이름·코드 매핑해 잇는다.
limits: 전역 조인 키가 없어 다른 데이터와는 도서관코드·이름 매핑으로만 연결되고, 매핑 정확도는 직접 확인해야 한다. 시설별 집계값이라 개별 대출 기록이나 도서 목록은 담지 않는다.
