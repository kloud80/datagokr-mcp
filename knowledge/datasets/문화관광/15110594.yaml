summary_user: 대구광역시 동구에서 임산부에게 혜택을 주는 우대 음식점을 업소 한 곳당 한 건으로 담으며, 등록번호·업체명·주소·전화번호·주요 음식을 제공한다. 임산부나 가족이 '동구에서 임산부 우대를 받을 수 있는 식당이 어디이고 무슨 음식을 파는가'를 찾을 때, 또는 지자체·분석가가 우대업소의 분포를 볼 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 업체명이나 주소를 기준으로 맞춰 음식점 인허가 정보나 지도 좌표와 이어 쓴다.
limits: 범위는 대구 동구 한 곳의 시군구 단위이므로 다른 지역의 임산부 우대 음식점은 이 데이터로 확인할 수 없다. 전역 조인 키가 없어 다른 데이터와 붙이려면 업체명·주소를 맞춰야 한다. 호출에는 포털 활용신청 후 받은 serviceKey가 필요하고, 개발계정은 하루 10,000회까지 호출할 수 있다.
