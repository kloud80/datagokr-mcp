description_portal: 이 데이터는 한국디지털아카이브가 보유한 한국 유성기 음반 정보를 정리한 자료로, 근현대 음반문화와 전통음악의 보존 및 연구에 중요한 기초 자료입니다. 모든 음반은 ‘한국 유성기 음반’이라는 시리즈명 아래 수록되어 있으며, 항목에는 제목, 음반사1, 음반사2, 장르1, 장르2, 장르3, 추정발매년도, 연주 정보가 포함되어 있습니다. 장르1은 전통음악과 기타로 대별되며, 장르2에는 잡가, 판소리, 민요, 가요극, 궁중음악, 풍류음악, 민속기악, 서양음악, 전통음악 등 세부 갈래가 존재하여 시대별·유형별 음악양식을 파악할 수 있습니다. 장르3은 남도잡가, 적벽가, 병창, 심청가, 춘향가, 단가, 흥보가, 서도잡가, 경기잡가, 창극 등으로 구성되어 있어 한국 전통 성악 및 기악 양식의 세분화된 형태를 보여줍니다. 또한 연주 항목을 통해 연주자 또는 단체 정보를 확인할 수 있어 연행사 연구나 음반 유통사를 중심으로 한 문화사 연구에도 유용하게 활용될 수 있습니다.
