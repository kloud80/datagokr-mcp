summary_user: 충청북도 단양군에 있는 국가지정문화유산을 한 건씩 정리한 목록 파일(CSV, 약 5.9KB)로, 지정번호·명칭(한자 포함)·수량(면적)·소유자·관리자·소재지·지정일·분야·종류·동산/부동산 구분을 담는다. 연구자나 관광·문화 담당자가 '단양군에 어떤 국가지정문화유산이 어디에 있고 누가 관리하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 API의 종목코드·지정번호와는 명칭이나 지정번호를 직접 맞춰 이어야 하고, 위치 데이터와는 소재지 주소로 연결한다.
limits: 단양군 한 개 시군구 범위의 국가지정 유산만 담으며, 시도지정·등록 유산이나 다른 지역 비교에는 쓰지 못한다. 표준 종목코드나 PNU 같은 공통 키가 없어 국가유산청 자료와 자동 결합되지 않으므로 이름·지정번호 매핑이 필요하다.
