summary_user: 제주특별자치도 향기마을 용흥리 지역의 무장애 여행 관광 정보를 담은 파일로, 포인트별 구분·유형·추천여부·비고와 여행지 개요, 위치, 주차장, 화장실, 코스, 휴무일, 관람료 같은 편의시설 정보를 담는다. 장애인·교통약자나 그 보호자가 "용흥리 일대에서 휠체어로 둘러볼 수 있는 곳과 주차·화장실이 갖춰진 곳은 어디인가"를 확인하거나, 무장애 관광지 지도화·안내 서비스 개선 작업에 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 장소 이름 매칭이나 같은 기관(제주특별자치도) 자료끼리만 연결된다.
description_portal: '제주특별자치도 내 향기마을용흥리 무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도 향기마을 용흥리 지역의 무장애 여행 관광 정보를 정리한 자료이다. 해당 자료에는 여행지 개요, 위치, 주차장, 화장실, 코스, 휴무일, 관람료 등 관광지 이용을 위한 기본 편의시설 정보가 포함되어 있으며, 각 포인트별 사진 자료도 제공된다. 이를 통해 장애인 및 교통 약자도 이용 가능한 관광지의 시설 수준과 접근성을 파악할 수 있고, 무장애 관광 활성화 및 여행지 선정 기준 수립, 여행 정보 제공 시스템 개선 등의 정책적 및 행정적 기초자료로 활용할 수 있다.* 활용 분야 : 무장애 관광지 지도화 및 접근성 개선 사업, 관광지 안내 서비스 및 웹/앱 정보 제공 개선 등'
