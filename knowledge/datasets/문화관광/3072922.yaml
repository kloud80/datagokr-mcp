summary_user: 익산시 안에 있는 문화재를 한 건씩 담은 목록 파일로, 종별·명칭·소재지 또는 보관장소를 담는다(csv 약 12KB). 시민이나 연구자가 '익산시에는 어떤 종류의 지정 문화재가 어디에 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록 등 다른 데이터와는 문화재 명칭이나 소재지 주소를 맞춰 연결해야 한다.
description_portal: 익산시 내에 위치한 다양한 문화재의 정보를 제공한다. 본 데이터는 각 문화재의 명칭, 소재지, 문화재의 종류 등을 포함하고 있으며, 이를 통해 익산시의 역사적 가치와 문화유산을 보다 명확하게 이해할 수 있다.  해당 데이터는 문화재 보호 및 관리, 관광 활성화 등 다양한 분야에서 유용하게 활용될 수 있다. 또한, 본 자료는 지역 주민들에게 문화재에 대한 이해를 돕고, 관련 부서에서는 문화재 보존과 관리에 필요한 정책을 수립하는 데 중요한 기초 자료로 활용될 것이다.  이 데이터는 시민들이 지역 문화재를 쉽게 찾고, 학술 연구자들이 지역의 문화재를 분석하는 데 유용한 자료가 된다.
