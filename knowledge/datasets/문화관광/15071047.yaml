summary_user: 한국저작권보호원이 정품 콘텐츠를 유통한다고 공식 지정한 '저작권OK' 매장·서비스를 업체 한 곳씩 담은 전국 단위 목록 파일(CSV, 약 26KB)로, 서비스분류·유통콘텐츠·지역·업체명·서비스명·링크주소·지정기간·관리번호를 담는다. 소비자가 음악·영화·웹툰 같은 콘텐츠를 합법적으로 이용할 수 있는 지정 업체가 어디인지, 사업자나 분석가가 지역·콘텐츠 분야별로 지정 현황이 어떤지 확인하는 데 쓴다. 다른 데이터와 직접 이을 전역 조인 키는 없고, 업체명·지역 같은 이름 매칭으로만 다른 사업자·콘텐츠 데이터와 연결한다.
description_portal: 한국저작권보호원이 운영하고 관리하는 '저작권OK 지정제도'는 정품 콘텐츠만을 판매, 유통, 서비스하는 신뢰할 수 있는 업체를 공식적으로 지정해 소비자가 안심하고 이용할 수 있도록 돕는 제도입니다. 이 제도를 통해 지정된 '저작권OK 지정매장'은 저작권을 준수한 정품 콘텐츠를 제공하는 곳으로, 소비자가 합법적인 콘텐츠를 쉽게 찾고 구매할 수 있도록 안내하는 역할을 합니다. 해당 매장 정보는 정품 유통망 확보와 소비자 보호를 위한 중요한 자료로 활용되며, 올바른 저작권 이용 문화를 정착시키는 데 기여하고 있습니다.
