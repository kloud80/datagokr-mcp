description_portal: 서울특별시 마포구에서 인허가를 받은 영화제작업체에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명 등의 세부 정보가 포함되어 있습니다. 이 데이터는 영화 산업 종사자 및 관련 기관이 합법적으로 등록된 제작사의 현황을 파악하고, 영화 콘텐츠의 품질 및 저작권 보호를 지원하는 데 활용됩니다.
