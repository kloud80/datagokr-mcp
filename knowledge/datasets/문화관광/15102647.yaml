summary_user: 전라남도 순천시와 무안군의 관광지·편의시설을 장소(POI) 한 건씩 담은 영어 지도 서비스용 콘텐츠 파일(zip, 약 1.4MB)로, 명칭·지역·주소·전화번호·홈페이지·운영시간·주차장 유무·이용요금·간단한 설명을 담는다. 외국인 관광객 안내 앱이나 지도를 만드는 개발자가 '순천·무안의 관광지별 운영시간과 주차 가능 여부를 지도에 어떻게 표시할까'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관광·시설 데이터와는 장소 명칭이나 주소를 맞춰 이어 써야 한다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 대한민국 전라남도 순천시와 무안군 지역의 관광객 편의를 위한 외국어(영어) 기반 지도 서비스 콘텐츠입니다. 각 관광지 또는 편의시설의 한글 명칭, 지역, 주소, 전화번호, 홈페이지, 운영시간, 주차장 유무, 이용요금, 간단한 설명 등을 포함하고 있으며 특히 외국인 관광객을 위한 안내 서비스 개발 및 지도 제작에 유용하게 활용할 수 있습니다. 추가로 각 장소별 POI 데이터를 기반으로 제공되어 이를 통해 관광객들이 쉽게 정보를 탐색할 수 있는 점 참고하시기 바랍니다.
