description_portal: 국립박물관문화재단이 운영하는 국립중앙박물관 ‘극장 용’의 공연별 입장객 정보로, 연번(숫자형), 장소(문자형), 공연 구분(문자형), 공연명(문자형), 공연시작일(문자형), 공연종료일(문자형), 관람객 수(숫자형) 등의 항목을 포함하고 있습니다.국립박물관문화재단 ‘극장 용’은 국내 최초로 박물관 내에 위치한 전문공연장으로 어린이ㆍ가족 공연장으로서 특화되어 시즌 레퍼토리 공연과 다양한 이벤트로 즐거움을 선사합니다.데이터를 통해 연간 대관, 기획 공연별 입장객 추이를 한번에 확인할 수 있습니다.해당 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 문의해주시기 바랍니다.
