summary_user: 국립중앙박물관 '극장 용'의 공연 한 건마다 장소, 공연 구분(대관·기획 등), 공연명, 공연 시작·종료일, 관람객 수를 담은 공연별 집계 파일로, 739바이트짜리 작은 CSV다. 문화예술 분야 분석가나 공연 기획자가 '극장 용에서 어떤 기획 공연에 관객이 많이 들었고 해마다 입장객이 어떻게 달라졌나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 공연명이나 기간을 직접 맞추거나 같은 기관(국립박물관문화재단)의 다른 통계와 나란히 놓고 본다.
limits: 단일 공연장(극장 용)의 공연별 합계만 담으므로 회차별·일별 관람객이나 관객 특성은 알 수 없고, 파일 크기로 보아 수록 건수가 매우 적다. 공연을 다른 데이터와 묶어 줄 표준 코드가 없어 연계하려면 이름이나 날짜로 직접 맞춰야 한다.
