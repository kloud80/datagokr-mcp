description_portal: 부산관광공사 부산관광기업지원센터 개방 계획에 따른 센터 홈페이지_게시판 정보, 센터 소개, 시설 안내, 담당자 안내, 찾아오는 약도, 공모사업, 지원사업, 부산관광 스타트업, 스타기업 소개, 졸업기업 소개, 분야별 무료 컨설팅, 부산관광벤쳐상생센터, KTO기업자문, 관광 일자리 정보 등  부산관광기업에 관한 다양한 컨텐츠 정보, 사이트 정보 및 기업지원센터 시설물, 담당자 정보 등 실제 메타 데이터를 개방 합니다. 부산관광기업비원센터 홈페이지는 부산 지역 관광스타트업을 발국 육성하며 지역 특화 관광 콘텐츠 개발과 홍보 판촉을 적극 지원하려는 목적이며, 산,관,학 협력을 통해 지역 관광 인재를 양성하고 일자리 창출 사업을 추진하며 부산관광 생태계 조성과 관광산업 활성화를 위한 목적이다. 지역 관광 세미나, 회의를 위한 회의장 무료 대관 신청을 홈페이지를 통해 받고 있다.
