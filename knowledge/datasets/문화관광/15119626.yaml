summary_user: 부산관광기업지원센터 홈페이지 게시판에 올라온 게시글을 한 건씩 담은 원천 데이터로, 제목·내용·작성자·조회수·댓글건수·공지 여부·등록/수정일자 같은 게시판 메타정보가 들어 있고 파일(xlsx)로 내려받는다. 부산 관광 스타트업이나 관광 사업자가 센터의 공모·지원사업, 컨설팅, 관광 일자리 공지가 언제 어떤 내용으로 올라왔는지 확인하거나, 분석가가 게시글 조회수 추이를 보는 데 쓴다. 전역 조인 키는 없고 게시글 고유번호·게시판정보 고유번호·부모 SEQ는 이 파일 안에서 게시판과 답글 관계를 잇는 내부 키일 뿐이어서, 다른 데이터와는 제목·기관명 같은 이름 매칭으로만 연결된다.
limits: 관광진흥법상 관광사업 등록 원장이 아니어서 등록번호나 사업자번호로 업체를 식별하거나 관광사업 등록 데이터와 키로 맞붙일 수 없다. 범위가 전국·비공간으로 표시돼 있지만 게시판 정보에는 지역 좌표나 행정코드가 없어 지역별 분석에는 맞지 않는다.
