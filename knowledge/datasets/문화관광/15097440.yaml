summary_user: 제주 향기마을 용흥리 주변의 음식점·카페·편의점·숙박시설·관광지를 시설 한 곳당 한 행으로 담고, 마을로부터의 거리·주소·전화번호·휠체어 진입 가능 여부·장애인 화장실 유무를 함께 적은 목록이다. 휠체어 이용자나 영유아 동반 가족이 용흥리에 머물 때 "근처에서 휠체어로 들어갈 수 있고 장애인 화장실이 있는 식당이나 관광지가 어디인가"를 확인하는 데 쓰고, 무장애 관광 지도를 만드는 데에도 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 시설 명칭이나 주소를 맞춰 연결해야 한다.
description_portal: 제주특별자치도 향기마을 용흥리 일대에서 무장애 여행이 가능한 주변 관광시설 정보를 종합적으로 정리한 통계자료입니다. 본 자료는 음식점, 카페 및 편의점, 숙박시설, 관광지 등 마을 내 주요 시설들의 명칭, 거리, 주소, 전화번호, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등을 포함합니다. 이를 통해 장애인, 노약자, 영유아 동반 가족 등 여행약자의 방문 환경을 파악하고, 관광약자 접근성 향상을 위한 기초자료로 활용할 수 있습니다. 해당 정보는 무장애 관광지 지도화, 관광안내 서비스 개선, 관광정책 수립 등 행정적·관광서비스적 의사결정에 유용한 근거 자료가 됩니다.
