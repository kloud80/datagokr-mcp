description_portal: '이 데이터는 서울특별시 및 산하기관·자치구가 운영하는 공공시설의 대관 예약 정보를 정리한 자료로서, 대관 가능 시설(예: 강당, 회의실, 전시실, 다목적실 등)의 명칭, 위치, 예약 가능 여부 및 예약을 위한 시스템 안내 URL 등의 항목을 포함하고 있습니다.  예약 신청은 실제로 별도 예약시스템(예: yeyak.seoul.go.kr)을 통해 이루어지며, 이 데이터는 연계 시간차로 인해 실제 시점과 일부 차이가 있을 수 있다는 유의사항이 명시되어 있습니다.  또한 이 데이터는 이용이 종료된 대관건은 포함하지 않도록 구성되어 있어 현재 신청 가능한 시설 중심으로 정보를 제공하고 있습니다.  본 데이터는 공공시설의 이용 현황 파악, 대관 정책 분석, 시설 활용도 조사 등의 행정·정책 분석 목적으로 유용하게 활용될 수 있습니다.서울시 및 산하기관, 자치구의 시설대관 예약정보를 제공합니다. 예약은 http://yeyak.seoul.go.kr 에서 직접 하셔야 하며, 데이터별 [바로가기 URL]항목을 통해서 해당정보의 상세내용을 조회하시기 바랍니다. ※ 제공되는 데이터는 연계시간 차이로 일부 차이가 날 수 있으니 양해 바랍니다.'
