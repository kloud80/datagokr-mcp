description_portal: 이 데이터는 한국문화예술위원회 문학 분야 문예진흥기금 공모사업 중 ‘문학행사 및 연구’ 사업의 개요 정보를 정리한 자료로, 2014, 2015, 2018, 2019년을 기준으로 운영된 다양한 문학 프로젝트의 유형별 구성을 확인할 수 있습니다. 주요 항목은 문학단체명, 사업연도, 사업유형_행사, 사업유형_연구조사, 사업유형_기타, 사업시작일, 사업종료일로 구성되어 있으며, 사업유형 항목은 Y/N 형식으로 구분되어 각 단체가 수행한 사업의 성격을 명확히 파악할 수 있습니다. 시작일과 종료일은 2018년, 2019년 또는 N/A로 표기되어 있어 사업 진행 여부나 자료 미기재 여부도 함께 판단할 수 있습니다. 이 데이터는 연도별 문학행사 및 조사연구사업의 유형 분포, 운영 시기, 사업 유형 간 조합 특성 등을 분석하는 데 활용할 수 있는 기초자료입니다.
