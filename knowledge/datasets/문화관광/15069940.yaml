status: active
summary_user: 2015~2016년 제주특별자치도 관광객 유동인구를 250m×250m 격자와 기준년월 단위로 집계한 파일로, 성별·연령대(10대 이하~60대 이상)별 유동인구 추정값과 비율을 담는다. 관광 분석가나 지자체 담당자가 '특정 시기 제주의 어느 격자에 20~30대 여성 관광객이 많이 몰렸나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 관광지점코드·시군구코드로 바로 붙일 수 없고, 격자 좌표를 공간 처리해 지역 정보와 맞추거나 이름 매핑으로만 다른 관광 통계와 이어 쓴다.
limits: 유동인구는 비율로 추정해 소수점 값으로 나오고 이동 개념이라 중복 집계되므로 실제 방문자 수나 인구수로 읽으면 안 된다. 공통 조인 키가 없어 다른 데이터와 연결하려면 격자 좌표나 이름 기반 매핑이 따로 필요하다. 활용신청 없이 받는 zip 파일이며 구분자가 '|'이다.
