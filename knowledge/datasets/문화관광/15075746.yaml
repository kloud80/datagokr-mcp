description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 세화항과세화오일장은 제주 제주시 구좌읍 세화리에 위치한 항구 및 민속 장터로, 항구 주변 해안도로와 포구, 그리고 매월 5·10일마다 열리는 전통 오일장이 함께 어우러진 공간으로서 주민과 관광객 모두에게 열려 있으며 세화항 공터에 주차 후 해안도로를 따라 포구 등대, 시장, 바다 풍경을 한 번에 즐길 수 있도록 보행환경과 무장애 코스가 마련되어 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
