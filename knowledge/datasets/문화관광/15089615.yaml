summary_user: 인천광역시 서구(서해구) 안에 등록된 종합여행업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 업종·상호명·등록일자·도로명/지번 소재지·전화번호를 담는다. 지역 주민이나 관광 정책 담당자가 '서구에 등록된 종합여행사는 어디에 몇 곳이 있고 언제 등록했나'를 확인하거나 여행업체 입지를 분석할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 문자열 매칭이나 같은 기관의 다른 관광사업 등록 파일과의 대조로만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 내 종합여행업 등록 업체의 현황을 수록한 자료입니다. 본 자료는 인천광역시 서구 내 종합여행업 등록 업체의 업종, 상호명, 등록일자, 소재지(도로명,지번),전화번호 등의 정보를 수록하고 있습니다. 본 데이터를 통해 지역 관광산업의 규모 및 분포를 파악하고 관광 정책 수립 등 기초자료로서 활용할 수 있을것으로 판단이 되며, 지역 기반 관광자원 활용 현황, 여행업체 입지 분석 등 다양한 분야에 기여할 수 있을거로 기대가 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
