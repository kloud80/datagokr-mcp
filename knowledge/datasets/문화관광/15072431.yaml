summary_user: KCDF갤러리에서 열린 전시를 한 건씩 담은 목록으로, 전시명·작가(단체)·전시장소·전시 시작일과 종료일을 CSV 파일(약 37KB)로 제공한다. 공예·디자인 전시를 찾는 관람객이나 대관 전시 이력을 살펴보려는 작가·분석가가 '언제 어떤 작가가 이 갤러리에서 전시했나'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 전시·문화시설 데이터와는 전시명·작가명 같은 이름 매칭으로만 이을 수 있다.
limits: 공연·문화시설 식별 코드 같은 공통 키가 없어 다른 데이터와 정확히 결합하기 어렵다. 명세상 수시 갱신으로 정해진 주기가 없고, 전시 상세 내용은 이 파일에 없어 진흥원 누리집에서 따로 확인해야 한다.
