description_portal: 한국수목원정원관리원은 전국 80여 개 정원에 설치된 무장애 편의시설 관련 정보를 공공데이터로 제공합니다.본 데이터는 정원 내 편의공간에 대한 휠체어 접근 가능 여부, 장애인 전용 공간 보유 여부, 유아동반 가족이 사용할 수 있는 공간 마련 여부 등을 포함하고 있어, 이동약자를 위한 접근성 향상과 포용적 문화공간 조성에 기여합니다. 특히 고령자, 장애인, 시각장애인, 유아 동반 관람객 등이 보다 쾌적하게 정원을 이용할 수 있도록 정보 제공을 목적으로 하고 있습니다.데이터는 CSV 형식으로 제공되며, 각 정원별 주요 항목이 표준화되어 정리되어 있습니다.주요 항목은 정원명, 편의공간 명칭 및 위치 정보, 휠체어 접근 가능 여부, 장애인 전용공간 유무, 유아동반 편의시설 보유 여부 등으로 구성되며, 다양한 사용자에게 실질적인 안내정보로 활용될 수 있습니다. 해당 정보는 지자체의 무장애 관광정책 수립이나 공공시설 개선 우선순위 결정, 포털·앱 기반 편의서비스 구축에도 활용 가치가 높습니다.본 데이터는 유니버설 디자인 기반 확산, 문화 공간의 평등한 접근권 보장, 사회적 약자 친화형 공간 설계에 필요한 기초자료입니다.
