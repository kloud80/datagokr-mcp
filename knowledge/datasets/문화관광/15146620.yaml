description_portal: 2015년에 설립한 수원시립미술관은 다양한 연령과 관심사를 아우르며 모든 관람객이 함께 즐길 수 있는 열린 문화의 되도록 노력하고 있습니다. 기획 전시와 연계하여 풍성한 주제와 다채로운 교육 프로그램을 신설하여 남녀노소 누구나 공감하고 참여할 수 있는 교육 프로그램을 준비하고 있습니다. 교육 프로그램 내용과  시작일자, 참여인원을 참고하시어 수원시립미술관 홈 페이지(suma.suwon.go.kr)의 교육에 참여 신청을 하시면 됩니다. 수원시립미술관의 전시는 시민 여러분이 함께 참여하고 즐길 수 있는 열린 공간을 지향하고 있으며, 많은 분들의 관심과 성원을 통해 더욱 풍성한 문화 교류의 자리가 되기를 기대하고 있습니다.
