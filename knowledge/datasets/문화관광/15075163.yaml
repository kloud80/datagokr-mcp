description_portal: 이 데이터는 열리해안길 에 대한 위도·경도, 장소명칭, 장소 상세정보, 무장애 관광 편의시설 여부 등 관광지 정보를 구조화하여 제공하는 공공데이터이다. 열리해안길은 제주올레길 8코스 구간에 속하며, 바다를 따라 연장된 해안 산책길(약 2–4 km 내외)의 일부 구간들로 구성되어 있어 장애인, 고령자, 유아 동반자, 유모차·휠체어 이용자 등 누구나 비교적 무리 없이 자연경관과 바다 경치를 감상하며 보행할 수 있는 열린 관광지다. 해당 데이터에는 경로 정보, 보행로 상태, 접근성 여부, 주변 편의시설 및 관광지 주변 정보까지 포함되어 있어 무장애 여행 경로 설계, 관광 안내 자료 제작, 정책 및 관광자원 관리 등에 활용 가능하며, 데이터 형식은 CSV로 무료 제공된다.
