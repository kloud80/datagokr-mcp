summary_user: 경상남도 도립미술관의 관람권 판매 내역을 건별로 담은 파일(CSV)로, 권종(유료·무료·할인·제로페이 등)과 인원, 결제방식, 결제금액, 결제일시를 기록한다. 미술관 운영 담당자나 문화정책 분석가가 "어떤 권종으로 언제 얼마나 관람권이 팔렸는가"를 살펴 관람 수요와 할인·무료 관람 비중을 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없고 KOPIS 공연ID 같은 공통 코드도 없어서, 다른 데이터와는 기관명이나 날짜를 기준으로 수작업으로 맞춰야 한다.
limits: 무료 관람 대상은 인원·결제방식·결제금액·결제일시가 공란이어서 무료 관람객 수와 시점은 집계할 수 없다. 공연·문화시설 데이터와 이어 줄 공통 키가 없다. 명세상 주기는 연간이지만 이벤트형(생성 후 불변)으로도 표시돼 있어 갱신 여부를 따로 확인해야 한다.
