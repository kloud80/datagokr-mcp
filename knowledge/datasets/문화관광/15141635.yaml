description_portal: 서울특별시 용산구 내에서 음반·음악영상물배급업을 영위하는 사업장에 관한 정보를 제공합니다. 음반·음악영상물배급업은 음반(음원이 유형물에 고정되어 재생하여 들을 수 있도록 제작된 것) 혹은 음악파일(음원이 전자적 형태로 제작되거나 전자적 기기에 수록된 것)과 음악영상물(음원의 내용을 표현하기 위하여 해당 음원에 영상이 포함되어 제작된 것을 말하며 음악의 실연에 대한 영상물을 포함) 혹은 음악영상파일(음악영상물이 전자적 형태로 제작되거나 전자적 기기에 수록된 것)을 수입하거나 원판 수입을 포함하여 그 저작권을 소유 및 관리하면서, 이를 음반·음악영상물 판매업자와 온라인 음악 서비스 제공업자에게 공급하는 배급 활동을 의미합니다. 이와 관련한 배급업 인허가 정보는 해당 사업장의 인허가일자, 현재 영업상태, 사업장 주소, 전화번호, 그리고 사업장명 등의 항목들로 구성되어 있습니다. 이러한 정보는 음반 및 음악영상물의 원활한 유통과 배급 체계 파악에 실질적인 큰 도움을 주며, 사업자나 이용자가 음반·음악영상물을 이용하거나 관련 행정을 처리할 때 매우 유용하게 활용될 수 있습니다.
