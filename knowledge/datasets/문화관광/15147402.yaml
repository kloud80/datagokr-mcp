summary_user: 서울 동작구의 무도학원업 인허가 사업장을 한 곳씩 담은 명부로, 사업장명·지번/도로명 주소·인허가일과 취소일·영업상태(정상·휴업·폐업)·폐업일·보험가입여부·지도자 수·건물 면적·좌표 같은 항목이 있다. 동작구에서 지금 영업 중인 무도학원이 어디 있는지, 최근 휴·폐업한 곳이 어디인지 확인하려는 주민·창업 예정자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 관리번호(MGTNO)·자치단체코드, 사업장명·주소 매핑, 좌표로 연결하며, 다른 체육시설업 인허가 명부나 상권 데이터와 함께 본다.
description_portal: 무도학원업 인허가 정보 데이터는 시민에게 체육 교육을 제공하는 학원 현황을 담고 있습니다.학원명과 주소 정보는 각 무도학원의 위치와 기본 정보를 제공합니다.문화체육업종명은 다양한 무술 교육 유형을 구분합니다.영업상태 항목은 정상, 휴업, 폐업 등 현재 운영 여부를 보여줍니다.보험가입여부 코드는 강사와 수강생의 안전을 보장하기 위한 보험 가입 현황을 나타냅니다.시설규모 정보는 수련장 면적, 운동 공간, 장비 현황 등 시설 환경을 보여줍니다.종사자 현황은 사범, 관리 직원 등 인력 구성과 규모를 나타냅니다.
