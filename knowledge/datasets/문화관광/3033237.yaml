summary_user: 경산시 소속 공공도서관과 작은도서관이 구입한 도서를 한 권(등록번호) 단위로 담은 건별 목록으로, 구분·등록번호·서명·저작자·발행자·발행년을 포함한 약 1.3MB 분량의 CSV 파일이다. 시민이나 분석가가 '경산시 도서관이 최근 어떤 책을, 어느 출판사·발행년 위주로 사들였나'를 확인하거나 원하는 자료가 소장됐는지 찾는 데 쓴다. ISBN이나 도서관코드 같은 전역 조인 키가 없어서 도서관정보나루 등 다른 도서 데이터와는 서명·저작자 이름 매칭으로만 이어 쓴다.
description_portal: 경산시 소속 도서관(공공도서관, 작은도서관)에서 구입한 도서목록 현황 데이터로 등록번호, 서명, 저작자, 발행자, 발행년의 데이터를 포함하고 있습니다.  이 자료는 과년 연말 기준이며, 해당 자료를 통해 경산시 소속 도서관의 도서구입목록을 파악할 수 있습니다. 이 자료는 도서관의 투명한 운영과 시민의 알 권리를 위해 공개되며, 독서 생활에 도움이 될 수 있습니다. 매년 갱신되는 자료를 통해 경산시 소속 도서관의 신속하고 정확한 도서구입목록을 파악할 수 있으며, 시민들이 원하는 자료를 검색할 수 있습니다.
