summary_user: 한국관광공사가 보유한 전국 관광지·숙박·행사 등 관광정보와 사진정보를 러시아어(노어)로 제공하는 API로, 관광 콘텐츠 하나하나를 주소·좌표 단위로 담는다. 러시아어권 여행객을 위한 여행 앱이나 웹서비스를 만드는 개발자가 '이 지역에 어떤 관광지와 숙소가 있고 상세 소개는 무엇인가'를 러시아어로 보여줄 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 지역코드·시군구코드(code)와 지역명 같은 이름·코드 매핑으로만 잇고, 상세 조회는 목록 오퍼레이션에서 먼저 받은 콘텐츠 ID와 콘텐츠 유형 ID를 넘겨 이어 쓴다.
description_portal: '- 국내관광정보서비스 OpenAPI 신규 상세기능(법정동코드, 신분류코드) 안내 URL(https://api.visitkorea.or.kr/#/cmsNoticeDetail?no=207)- 한국관광공사가 보유하고 있는 전국의 다양한 관광정보와 사진정보를 실시간으로 제공 받을 수 있으며,국내 최대 관광정보 포털 사이트 Visitkorea(russian.visitkorea.or.kr) 홈페이지에서 제공하는 관광정보 중 저작권 등에 구애 없이 자유롭게 활용 가능한 정보만을 선별하여 OpenAPI를 통해서 최신정보를 제공하고 있습니다. - 개방 데이터는 지역코드정보, 서비스분류코드정보, 법정동코드정보, 분류체계코드정보, 지역기반관광정보, 위치기반관광정보, 키워드검색, 행사정보, 숙박정보, 공통정보, 소개정보, 반복정보, 이미지정보, 관광정보 동기화 목록정보 14종 약 3만 건의 국내 관광에 대한 전반적인 정보를 노어로 제공합니다.- 모바일 앱 뿐만 아니라, 웹서비스, 태블릿, 홍보물, 잡지 등 다양한 매체에서 어플리케이션을 개발, 활용할 수 있으며 다양한 활용을 통해서 신규/융복합 관광서비스를 창출할 수 있습니다. ※ 제공되는 데이터중 사진 자료의 경우, 피사체에 대한 명예훼손 및 인격권 침해 등 일반 정서에 반하는 용도의 사용 및 기업 CI,BI로의 이용 금지하고 있습니다. (공공누리 1유형, 3유형 이미지 제공됨)'
