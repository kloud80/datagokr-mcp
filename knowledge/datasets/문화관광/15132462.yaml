summary_user: 한국학중앙연구원 장서각과 관련 기관에 소장된 고문서를 한 건씩, 현소장처·원소장처·자료명과 형식분류(대·중·소)·내용분류(대·중·소)로 정리한 목록 파일(CSV 약 9.6MB)이다. 연구자나 교육·콘텐츠 개발자가 원문을 보기 전에 "특정 가문이나 기관에서 나온 고문서 가운데 행정·예제 관련 문서는 어떤 형식으로 몇 건 남아 있나" 같은 질문을 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 자료명이나 소장처 이름을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: ‘한국학중앙연구원_한국고문서자료관 안내정보’ 데이터는 한국학중앙연구원 장서각 및 관련 기관에 소장된 고문서에 대한 체계적인 분류 정보를 제공하는 자료입니다. 이 데이터는 원소장처, 자료명(한글/한자), 그리고 대형식분류, 중형식분류, 소형식분류를 통해 문서의 형식적 특징을 단계별로 분류하고 있습니다. 또한 대내용분류, 중내용분류, 소내용분류 항목을 통해 문서의 주제, 내용적 성격을 구체적으로 파악할 수 있으며, 유교적 예제, 행정, 문학, 교육 등 다양한 분야의 문서가 포함되어 있습니다.이 데이터는 고문서를 분류하고 해석하는 데 기초적인 정보를 제공하며, 연구자들이 고문서 원문에 접근하기 전에 문서의 성격과 맥락을 이해할 수 있도록 돕습니다. 학술연구, 교육, 전통문화 콘텐츠 개발 등에 폭넓게 활용될 수 있는 실용적이고 방대한 한국학 정보 자원입니다.
