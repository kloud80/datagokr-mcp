summary_user: 경상북도 영주시가 관리하는 지역 맛집을 업소 한 곳당 한 건으로 담으며, 등록번호·업소명·전화번호·주소가 들어 있고 범위는 영주시 한 시군구다. 영주를 찾는 관광객이나 여행 앱 개발자가 "부석사·소수서원 근처에서 시가 소개하는 식당은 어디이고 연락처는 무엇인가"를 찾을 때 쓴다. 전역 조인 키가 없어 TourAPI 음식점 정보나 다른 음식점 인허가 데이터와는 업소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 영주시가 관리하는 지역 맛집의 정보를 제공하는 API입니다.등록번호, 업소명, 전화번호, 주소 등 기본 정보가 포함되어 있어 위생적이고 신뢰할 수 있는 음식점에 대한 접근성을 높였습니다.관광객들의 지역 명소 방문 시 근처의 검증된 식당 탐색 및 공공기관의 지역 음식문화 확산 방안 모색 등 다양한 분야에서 활용될 수 있습니다.또한 외식업소 분석, 음식점 창업 입지 추천, 외식정보서비스 앱 개발 등에도 유용하게 활용될 수 있습니다.본 API는 REST 방식으로 JSON 포맷으로 제공됩니다.
