summary_user: 대구광역시가 지정한 우수숙박시설을 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·소재지·연락처와 객실수(한실·양실·트윈베드 구분), 일반호텔·여성안심숙박업소 지정 여부를 담는다. 대구를 찾는 방문객이 시가 인증한 숙소나 여성안심숙박업소를 고를 때, 또는 분석가가 대구 우수 숙박시설의 객실 규모를 살필 때 쓴다. 전역 조인 키가 없어 숙박업 인허가(LOCALDATA) 등 다른 데이터와는 업소명·소재지를 이름 매칭해서만 이어 쓴다.
description_portal: '목적: 대구를 찾는 방문객들에게 양질의 숙박 서비스를 제공하고, 지역 이미지를 제고하기 위해 대구광역시가 우수 숙박시설을 발굴하고 육성합니다.지정 기준: 시설 및 환경 서비스가 우수한 숙박업소를 대상으로, 영업주의 서비스 마인드와 손님맞이 태도, 시설 관리 상태 등을 종합적으로 평가하여 지정합니다.지정현황 : 2025년  12월 기준 더굿나잇(132개소), 일반호텔(59개소), 여성안심숙박업소(33개소) 를 지정하고 있습니다. 선정방법 : 평가표에 따른 구군 1차 현장조사 및 대구시 2차 평가'
