summary_user: 서울올림픽기념국민체육진흥공단이 운영하는 올림픽파크텔의 객실을 객실 유형 1건씩 담은 원천 목록입니다. 객실명·설명(한국어·영어·중국어·일본어), 가격, 사용 여부, 성인·어린이 수용 인원, 킹·더블·싱글 침대 구성, 면적, TV 크기, 공원·시티 전망 정보가 들어 있습니다. 국내외 여행객이나 숙박 안내 서비스 사업자가 '올림픽공원 근처에서 어른 2명·아이 1명이 묵을 수 있는 객실과 가격은?' 같은 질문에 답할 때 씁니다. 다른 데이터와 이어 붙일 전역 조인 키는 없으며, 객실명으로 맞추거나 같은 기관(국민체육진흥공단)의 다른 데이터와 기관 단위로만 연결할 수 있습니다.
limits: 공통 조인 키가 없어 다른 숙박·시설 데이터와 자동으로 결합되지 않고, 이름 매핑으로만 연결됩니다. 호출에는 포털 활용신청 후 발급되는 serviceKey가 필요하며, 개발계정은 하루 10,000회로 제한됩니다.
