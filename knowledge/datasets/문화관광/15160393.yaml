description_portal: '본 데이터는 전북특별자치도 내(전주, 익산, 군산, 부안군 등) 반려동물과 함께 방문할 수 있는 관광지 정보를 체계적으로 제공하는 공공데이터로, 사용자의 편의를 위해 지역, 관광지명, 주소, 전화번호, 동반가능 여부 등 필수항목으로 구성되어 제공하고 있습니다. 전북 지역을 여행하는 반려인들을 위한 맞춤형 관광 서비스 개발 및 민간 어플리케이션 제작, 지역 관광 활성화 분석 등 다각적인 서비스에 활용 가능하고, 반려가족의 안전하고 즐거운 여행 계획 수립과 시민과 관광객이 반려동물 친화적 공간을 쉽게 찾을 수 있도록 지원합니다.공공데이터포털에서 CSV 파일로 다운로드가 가능합니다.자료 출처 : 관광산업과(063-280-3322)'
