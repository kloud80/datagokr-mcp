description_portal: 한국문화예술위원회에서 제공하는 이 정보는 장애인 문화예술 활동의 확산과 지원을 위한 기초자료로 활용될 수 있습니다. 수록된 78개 단체는 전국 각지에서 다양한 예술 장르를 기반으로 활동 중이며, 단체명, 주소, 전화번호 등의 기본 정보를 포함하고 있습니다. 이 목록은 전체 장애인 문화예술 단체를 포괄하지는 않지만, 문화예술 분야에서 활동하는 장애인 단체를 파악하고 관련 네트워크를 형성하는 데 유용한 자료입니다.보다 정확하고 포괄적인 정보는 장애인문화예술원을 통해 확인하실 수 있습니다. 이 자료는 정부, 공공기관, 연구자, 예술가, 기획자 등 다양한 이해관계자들이 장애인 문화예술 분야에 대한 이해를 높이고 협업을 모색하는 데 활용될 수 있습니다. 특히 지역 단위 문화정책 수립이나 장애인 예술 지원사업 기획 시 참고자료로서의 가치가 높습니다. 또한 장애예술인의 창작 환경 개선 및 문화 향유권 증진을 위한 논의에도 기초자료로 활용될 수 있습니다.
