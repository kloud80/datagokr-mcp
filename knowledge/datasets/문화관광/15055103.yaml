summary_user: 시흥시 관내 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업종·업소명·도로명/지번 주소·전화·객실 수·데이터기준일을 담는다(포털 설명 기준 102건, 시군구 범위의 개별 주소 단위). 시흥시에 숙박업소가 어디에 얼마나 있고 객실을 몇 개나 수용할 수 있는지 알고 싶은 관광·상권 분석가나 숙소를 찾는 방문객이 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소나 업소명 매칭으로 잇고, 전국 숙박업 인허가 원천(LOCALDATA 공중위생 신고)과 업소명·주소로 대조해 보완한다.
limits: 표준 코드나 인허가 번호 같은 공통 키가 없어 다른 데이터와 붙이려면 업소명·주소를 직접 맞춰야 한다. 범위가 시흥시 한 곳이라 다른 시군과 비교하려면 지역별 파일을 따로 모아야 한다.
