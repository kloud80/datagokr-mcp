description_portal: 2015년 이후 문화체육관광부 국립중앙극장에서 진행된 공연에 관한 종합적인 예술정보 데이터로, 공연제목, 부제목, 공연 시작일과 종료일, 공연 장소, 장르, 공연 단체, 캐스팅 및 스태프 정보, 공연 시간(분) 등 총 10개의 주요 칼럼으로 구성되어 있다. 이 데이터는 국립중앙극장에서 이루어진 공연들의 전반적인 현황과 변화를 파악할 수 있는 기초 자료로 활용된다. 이를 통해 공연 기획 및 문화예술 연구에 필요한 객관적 정보를 제공하며, 공연의 형태와 범위, 장르별 분포 등 다양한 분석이 가능하도록 구성되어 있다.
