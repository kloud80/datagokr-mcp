summary_user: 국립중앙극장에서 2015년 이후 열린 공연을 한 건씩 담은 파일로, 공연제목·부제목·시작일·종료일·장소·장르·단체·캐스팅·스태프·공연시간(분) 10개 칼럼으로 구성된다. 공연 연구자나 기획자가 '국립중앙극장에서 연도별로 어떤 장르 공연이 몇 편 올랐고 어떤 단체·출연진이 참여했나'를 파악하는 데 쓴다. 공연ID 같은 전역 조인 키가 없어 KOPIS 공연 목록 등 다른 공연 데이터와는 공연제목·기간·장소 이름을 맞춰서만 이어 쓸 수 있다.
limits: KOPIS 공연ID(mt20id)·공연장ID(mt10id) 같은 공통 키가 없어 다른 데이터와의 연결은 이름 매칭에 의존한다. 명세상 갱신은 연간 단위이며, 관객 수·예매·매출 정보는 담지 않는다.
