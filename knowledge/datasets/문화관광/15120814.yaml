description_portal: 서울미래유산홈페이지 새소식 정보는 서울 미래유산과 관련된 각종 공지사항과 소식을 제공하는 데이터입니다. 연번으로 각 게시물을 구분하며, 공지사항 제목과 내용을 통해 미래유산 사업 안내, 행사 일정, 모집 공고, 서비스 변경 등 주요 안내 내용을 확인할 수 있습니다. 공지여부 항목을 통해 일반공지와 상단공지(중요 공지)를 구분하여 노출 우선순위를 설정할 수 있고, 상태 값으로 공개·비공개 여부를 관리할 수 있습니다. 입력시간과 수정시간 정보는 공지 등록 및 변경 시점을 파악할 수 있어, 이용자는 최신 정보를 확인할 수 있고, 관리자 역시 공지 이력 관리에 활용할 수 있는 구조화된 새소식 데이터입니다.
