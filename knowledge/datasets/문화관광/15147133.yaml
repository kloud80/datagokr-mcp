summary_user: 서울 강북구에서 게임물을 수입하거나 저작권을 관리하며 게임제공업자 등에게 공급하는 게임물배급업소의 인허가 내역을 업소 단위로 담으며, 인허가·폐업·휴업 일자, 영업상태, 주소, 중부원점TM 좌표, 시설면적·층수 등을 포함한다. 사업자나 분석가가 강북구에 현재 영업 중인 게임물배급업체가 어디에 몇 곳 있는지, 언제 인허가·폐업했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 개방자치단체코드(OPNSFTEAMCODE)나 주소·사업장명 매칭으로만 연결하며, 다른 자치구의 같은 업종 인허가 데이터와 같은 컬럼 구조로 이어 붙여 쓴다.
description_portal: '서울시 강북구 게임물배급업 인허가 정보: 강북구의 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 업소정보* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.서울특별시 강북구 게임물배급업 인허가 정보 데이터는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 휴업시작일자, 휴업종료일자, 재개업일자, 전화번호, 소재지면적, 소재지우편번호, 지번주소, 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신구분, 데이터갱신일자, 업태구분명, 좌표정보(X), 좌표정보(Y), 문화체육업종명, 문호사업자구분명, 총층수, 주변환경명, 제작취급품목내용, 시설면적, 지상층수, 지하층수, 건물용도명, 통로너비, 조명시설조도, 노래방실수, 청소년실수, 비상계단여부, 비상구여부, 자동환기여부, 청소년실여부, 특수조명여부, 방음시설여부, 비디어재생기명, 조명시설유무, 음향시설여부, 편의시설여부, 소방시설여부, 총게임기수, 기존게임업외업종명, 제공게임울명, 공연장형태구분명, 품목명, 최초등록시점, 지역구분명으로 구성되어 있습니다.해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
