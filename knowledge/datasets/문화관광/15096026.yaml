summary_user: 충청남도 계룡시가 관리하는 공공체육시설을 시설 한 곳당 한 건으로 담으며, 시설명·도로명/지번 주소·위도·경도·예약 방법·시설 현황·전화번호를 제공한다. 계룡시 주민이 '집 근처에서 예약해 쓸 수 있는 공공 체육시설이 어디이고 어떻게 예약하나'를 찾거나, 분석가가 시 단위 체육시설 분포를 지도에 올릴 때 쓴다. 전역 조인 키는 없어서 위도·경도 좌표나 주소로 다른 공간 데이터와 겹쳐 보거나, 시설명을 문체부 전국체육시설 데이터와 이름으로 맞춰 연결한다.
description_portal: 충청남도 계룡시의 '공공체육시설현황 정보 API' 데이터는 시민들의 건강 증진 및 여가 활동을 위해 시에서 관리하는 공공 체육 시설들의 상세 정보를 실시간으로 제공하는 공공데이터 서비스입니다. 이 API는 입력 파라미터를 활용하여, 2021년 9월 1일자 기준으로 수집된 계룡시의 공공체육시설 현황 데이터를 요청에 따라 조회하는 핵심 기능을 수행합니다. 주요 항목으로는 시설의 공식 시설 명, 시설을 찾는 데 필요한 소재지 도로명 주소와 지번 주소, 그리고 정확한 위도, 경도 좌표가 포함됩니다. 또한, 시설 이용을 위한 예약 방법 정보, 시설의 구체적인 시설 현황, 그리고 문의를 위한 전화번호까지 제공합니다.
