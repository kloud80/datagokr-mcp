summary_user: 경기도 여주시 안의 민박·펜션 업소를 한 곳씩 담은 파일로, 업소명·업종·주소(도로명·지번)·위경도·전화번호·객실수·부대시설·주차장 보유 여부 등을 업소 단위로 수록한다. 여행객이나 숙박 사업자가 '여주에서 수영장이나 바비큐장이 있고 주차 가능한 펜션은 어디인가', '여주 지역 펜션 객실 규모는 어느 정도인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 위경도 기반 위치 결합으로 잇고, 숙박업 인허가 공통 원천인 공중위생법 신고 자료(LOCALDATA)와 대조하는 방식으로 연결한다.
description_portal: 다음은 경기도 여주시 지역의 민박 및 펜션업소에 대한 상세 현황 데이터에 관한 설명입니다. 이 데이터에는 각 업소의 업소명, 업종명, 그리고 서비스 대상 구분 등 기본적인 식별 정보가 포함되어 있습니다. 또한 업소가 위치한 정확한 소재지 도로명 주소와 지번 주소를 함께 제공하여 위치를 쉽게 확인할 수 있도록 하였고, 고객들이 직접 연락할 수 있도록 전화번호 정보도 수록되어 있습니다. 객실수와 같은 숙박 규모를 보여주는 항목은 물론, 바비큐장·수영장 등과 같은 다양한 부대시설 정보, 그리고 주차장 보유 여부 등 편의시설에 대한 정보도 담고 있습니다.
