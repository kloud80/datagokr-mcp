description_portal: 해당 자료는 의왕시 도서관의 신간 및 추천 베스트 도서를 월별로 정리한 데이터로, 도서관 자료수집 현황과 독서트렌드 파악을 위해 구축된 정보입니다. 도서명, 기준년월, 메뉴구분(신간·추천 등), 저자, 출판사, 발행년도, 페이지수, 자료실 위치 등의 항목으로 구성되어 있으며, 해당 시기에 새롭게 입수되거나 추천된 주요 도서를 확인할 수 있도록 제공됩니다. 월별 신간 및 인기 도서의 수집 경향을 파악함으로써 도서관 장서 구성의 방향성을 분석하고, 이용자 서비스 개선 및 추천도서 선정 기준 수립 등에 활용할 수 있습니다. 자료실 정보는 실제 열람 가능 위치를 제시하여 이용자의 접근성을 높이며, 콘텐츠 기획, 독서문화 진흥, 수요 기반 장서개발 등 다양한 정책적 활용이 가능한 참고용 데이터입니다.(도서관 홈페이지 개편으로 2024년 10월 자료까지만 제공합니다.)
