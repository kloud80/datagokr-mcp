description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 보롬왓은 제주 서귀포시 표선면 번영로에 위치한 농업형 관광지로, 메밀·유채·수국 등 계절별 꽃밭과 잔디밭, 동물농장, 카페와 체험 공간이 조성된 자연 힐링 농장이며 장애인 전용 주차장, 포장된 보행로 등 일부 무장애 편의시설 정보가 제공되어 휠체어나 유모차 이용자, 고령자 등도 제주 자연과 계절의 변화를 비교적 수월하게 즐길 수 있어 관광, 휴식, 사진 촬영, 가족 나들이 등 다양한 목적으로 활용 가능한 열린 관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
