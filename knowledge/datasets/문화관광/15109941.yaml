description_portal: 한국수목원정원관리원은 전국 70여 개 수목원 내 부대공간의 접근성 정보를 체계화한 공공데이터를 제공합니다. 해당 데이터는 수목원별 ID와 명칭, 부대시설의 이름과 용도 구분, 휠체어 접근 가능 여부, 점자 유도 블록 설치 여부, 반려동물 및 안내견 동반 가능 여부 등의 정보를 포함하고 있어, 다양한 이용자층의 접근성과 이용 편의성을 고려한 시설 운영에 활용됩니다. 특히, 기념품 판매장, 휴게공간, 안내센터 등 주요 시설에 대한 정량적 접근 정보를 통해 이동약자나 보호자 동반 방문객들이 공간을 사전에 파악하고 이용할 수 있도록 돕습니다.데이터는 CSV 형식으로 제공되며, 수목원 고유 식별값과 시설 구분 정보를 기반으로 정리되어 있습니다. 주요 항목으로는 ‘수목원아이디’, ‘수목원명’, ‘부대시설 이름’, ‘부대시설 구분’, ‘휠체어접근가능여부’, ‘점자유도로여부’, ‘반려동물동반가능여부’, ‘안내견동반가능여부’ 등이 있으며, 해당 정보는 무장애 관광정책 수립, 공공시설 배치계획 수립, 민간 접근성 콘텐츠 제공 등에 활용 가능합니다.이 데이터는 접근성 증진과 사회적 약자를 위한 정보 격차 해소, 포용적 공공시설 개선 기반을 제공하는 실효성 높은 공공데이터입니다.
