description_portal: '‘주석 체계(tbl_annot_scheme)’는 2015년부터 2024년까지 구축된 한국어 학습자 말뭉치 가운데 형태 주석 말뭉치에 달아 놓은 주석에 대한 정보를 의미합니다. 한국어 학습자들이 작성하거나 발화한 문장과 그 문장들을 형태소 단위로 분석한 형태 주석 정보를 확인할 수 있습니다.※ 형태 주석 말뭉치: 단어가 어떻게 구성되어 있는지, 그것의 품사는 무엇인지에 대한 정보를 일관된 형식의 표지로 달아 놓은 말뭉치. ‘게시판 관리(tbl_board)’는 ‘한국어 학습자 말뭉치 나눔터’의 ‘알립니다(공지사항)’에 포함된 날짜와 제목 정보를 포함하고 있습니다. 이를 통해 ‘알립니다’의 주요 공지에 대한 기본적인 내용을 확인할 수 있습니다.※ ‘알립니다’의 자세한 내용은 한국어 학습자 말뭉치 나눔터의 ‘알립니다’ 게시판에서 확인하시기 바랍니다.https://kcorpus.korean.go.kr/index/goNoticeList.do'
