summary_user: 강원특별자치도 홍천군에 있는 캠핑장을 한 곳당 한 행으로 담은 파일로, 캠핑장명·연락처·주소와 데이터 기준일이 들어 있고 포털 설명상 2026년 2월 11일 기준 110곳이다. 홍천에서 캠핑할 곳을 찾는 여행객이 '홍천군 어느 지역에 어떤 캠핑장이 있고 연락처는 무엇인가'를 확인하거나, 분석가가 군 내 야영장 분포를 살피는 데 쓴다. 등록번호·사업자번호 같은 전역 조인 키가 없어서 다른 야영장·관광사업 등록 데이터와는 캠핑장명이나 주소를 맞춰 이어 써야 한다.
limits: 공통 식별 코드가 없어 다른 데이터와 붙일 때 이름·주소 매칭에 의존해야 하며 오매칭 가능성을 점검해야 한다. 범위는 홍천군 한 곳뿐이고 개별 시설의 주소만 담겨 있어 다른 시군 비교에는 별도 데이터가 필요하다.
