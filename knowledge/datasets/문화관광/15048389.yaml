summary_user: 제주시 우도해양도립공원의 입도객 인원과 입도 차량 대수를 연도별 한 행에 1~12월 값을 가로로 펼친 월별 집계 파일(csv, 약 2KB)로 담는다. 관광 분석가나 지역 행정 담당자가 '우도 방문객과 차량 반입이 어느 달에 몰리고 해마다 어떻게 변하는가'를 확인하는 데 쓴다. 관광지점코드나 시군구코드 같은 전역 조인 키가 없어 다른 관광 통계와는 연도·월과 '제주시 우도' 지명을 직접 맞춰 이어 써야 한다.
limits: 관광지점코드·시군구코드 등 표준 키가 없어 다른 데이터와 자동 조인이 되지 않고 이름·연월 매핑이 필요하다. 월이 열로 펼쳐진 형태이고 한 행의 '구분'이 인원인지 차량인지를 나누므로 분석 전에 연월 단위 세로형으로 바꿔야 한다. 공원 한 곳의 집계라 방문객 출신지·체류 시간 등 세부 특성은 없다.
