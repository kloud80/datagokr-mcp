summary_user: 부산광역시 16개 구군에 있는 공연장·전시장·갤러리·문화회관 등 약 530여 곳을 시설 한 곳당 한 건으로 담은 목록으로, 공공·민간 운영 구분과 주소·좌표, 전화번호, 홈페이지, 좌석수, 대관 가능 여부, 시설 사진 정보를 포함한다. 공연·전시 기획자나 시민이 '해운대구에서 대관 가능한 200석 이상 공연장은 어디인가' 같은 질문에 답하거나, 분석가가 구군별 문화시설 분포를 살피는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 시설명(placeNm)이나 주소·좌표, 시군구 이름을 맞춰 연결해야 한다.
description_portal: 부산광역시에 위치한 전시 공간의 목록을 개방합니다.개방되는 데이터에는 부산광역시 소재의 공연장, 전시장 등의 정보가 제공됩니다.각종 공연을 할 수 있는 예술회관, 문화센터, 문화회관, 공원, 관광단지, 미술관, 소극장 다양한 목록이 포함되어 있습니다.공공에서 운영하는 전시공간, 민간이 운영하는 공간으로 구분되고, 부산시내 16개 구군에 530여개의 공연장 목록이 있습니다.주소, 전화번호, 홈페이지, 좌석수, 대관 가능여부, 시설 사진, 시군구 등의 정보가 있습니다.영화의 전당, 금정문화회관, 북구문화예술회관, 동래문화회관, 해운대문화회관, 부산시민회관, 부산예술회관, 영도문화예술회관 등의 공공 시설갤러리 마레, 성원아트 갤러리, 소민아트센터, 해오름갤러리, 갤러리 조이, 아인 갤러리 등 민간 갤러리호천문화플랫폼, 낙동강 하구 에코센터, 부산해양자연사박물관 등 다양한 시설이 포함되어 있습니다.
