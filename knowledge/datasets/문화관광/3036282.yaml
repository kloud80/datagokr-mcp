summary_user: 광주광역시 예술의전당(구 문화예술회관)의 대극장·소극장별 무대시설물, 무대기계, 무대음향장비 등 보유 장비를 품목·수량·단위로 한 행씩 담은 소규모 목록 파일(csv 약 3.5KB)이다. 대관이나 공연을 준비하는 기획사·공연단체가 "대극장과 소극장에 어떤 무대·음향 장비가 몇 대 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(공연장 코드·시설코드 등)가 없어, KOPIS 공연시설 정보나 문화기반시설 총람과는 시설명(장소)을 직접 맞춰 이어 써야 한다.
description_portal: 광주광역시 예술의전당(구 문화예술회관) 공연시설에 관한 데이터로 대극장, 소극장의  무대시설물, 무대기계시설물, 무대음향장비 등의 보유 항목을 제공합니다.우리 예술의 전당은 대,소극장 2개의 극장으로 운영되고 있으며 각 극장당 시설물, 객석, 장비목록, 운영인력의 다름으로 각 극장에 대한 보유정보를 제공하고자 합니다.소극장은 약 380석 정도 운영하고 있으며 오케스트라 피트를 객석으로 운영시 약 460석 정도의 객석을 운영할 수 있는 극장입니다.대극장은 약 1500석 정도로 운영하고 있으며 주로 대형공연을 위주로 진행하고 있습니다.
