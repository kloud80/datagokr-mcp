summary_user: 제주 애월한담공원 한 곳의 무장애여행 정보를 담은 파일로, 위도·경도·해발고도 같은 지점 좌표와 장소 설명·이미지 정보를 담는다. 휠체어·유모차 이용자나 교통약자 동반 여행자가 '애월한담공원 해안 산책로를 어디서부터 어떻게 돌 수 있나'를 확인하거나, 무장애 관광 지도를 만드는 개발자가 지점 좌표를 얻는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 TourAPI 관광지 정보 등 다른 데이터와는 관광지 이름 매칭이나 좌표 기반으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 애월한담공원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 이 데이터셋은 애월한담공원이 제공하는 무장애 여행 정보를 담고 있으며, 위도·경도 좌표, 관광지 명칭, 장소 설명, 이미지 자료 등을 포함한다. 애월한담공원은 해안가를 따라 조성된 총 1.2 km 산책로를 갖춘 해안공원으로, 바다 조망과 자연경관을 누구나 쉽게 접근할 수 있도록 설계되었다. 산책로는 완만하거나 평지 위주로 구성되어 휠체어나 유모차 이용자, 교통약자도 이용 가능하며, 장애인 화장실 등의 편의시설이 제공되는 열린관광지이다. 해당 데이터는 관광 안내, 무장애 관광지 홍보, 지도 서비스 제작, 관광 정책 수립 및 관광 인프라 개선 등 공공 및 관광 분야에서 기초 참고 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
