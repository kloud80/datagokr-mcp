summary_user: 제주특별자치도 귀덕해안길 무장애 여행코스를 지점 단위로 담은 파일로, 순서·위도·경도·구분·설명·포인트·상세정보와 전체코스·추천코스 여부를 함께 담는다. 휠체어 이용자나 교통약자 동반 여행객이 귀덕해안길의 어느 구간을 어떤 순서로 걸을 수 있는지, 노면·경사·주차·화장실 접근성은 어떤지 확인할 때 쓰고, 열린관광지·무장애 관광 정책 검토의 기초자료로도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI contentId나 지역코드와 바로 잇지 못하며, 위도·경도로 다른 위치 데이터와 공간 매칭하거나 이름으로 맞춰 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_귀덕해안길_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도에서 제공하는 귀덕해안길 무장애 여행 코스 정보입니다. 해당 구간은 접근성이 향상된 해안 산책로로서, 위치 정보(위도·경도), 구분, 설명, 주요 포인트, 추천 코스 등이 포함되어 있어 교통약자 및 휠체어 이용자의 이동 편의를 지원합니다. 특히 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등의 현장 기반 요소까지 반영되어 있으며, 열린관광지 조성, 무장애 관광환경 구축, 관광 서비스 개선 및 정책 수립 등에 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
