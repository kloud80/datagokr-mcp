summary_user: 구로구 내 PC방(인터넷컴퓨터게임시설제공업) 업소별 인허가 정보를 건별로 담으며, 인허가·폐업일자, 영업상태, 시설면적, 층수, 조명·방음·환기 등 시설 여부, 지번·도로명 주소와 좌표(X, Y)를 포함한다. 구청 담당자나 분석가가 "학교 주변에 영업 중인 PC방이 몇 곳이고 어디에 몰려 있나" 같은 질문에 답할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·업소명 매칭이나 같은 기관의 관리번호(MGTNO)·자치단체코드로만 이어 쓴다.
description_portal: 인터넷컴퓨터게임시설제공업 인허가 정보는 구로구 내 **PC방(인터넷 게임 제공시설)**의 인허가일자, 영업상태명, 좌석수, 시설면적, 환기·조명·방음시설 여부, 지번주소와 좌표정보 등을 포함한 데이터이다. PC방은 청소년의 이용 빈도가 높은 업종으로, 시설기준 준수와 청소년보호법 이행 여부가 매우 중요하다. 이에 따라 시설환경(조명·음향·환기), 청소년실 설치 여부, 편의시설 구성 등 세부 행정 기준을 확인할 수 있도록 정보가 구조화되어 있다. 영업상태 이력과 좌표정보는 영업 밀집도 분석, 학교 주변 유해환경 모니터링, 안전·소방 점검 우선지역 선정 등에 활용된다. 또한 PC방은 지역 생활문화·야간경제와 연결되므로, 정책적 지원·단속·위생관리 등 다양한 분야에서 이 데이터를 근거로 의사결정을 수행할 수 있다.
