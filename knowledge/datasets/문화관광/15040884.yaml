description_portal: 서울에 있는 4대궁(경복궁, 창덕궁, 덕수궁, 창경궁)과 종묘의 한복 착용 입장객 숫자를 집계한 엑셀자료입니다. 각 궁궐별, 월별로 한복을 입고 입장하는 관람객 숫자를 알 수 있습니다. 한복 무료 입장을 실시하고 있습니다.• 궁·능·원·유적 국가지정문화유산은 2013년 8월 12일부터 학생 등 청소년의 문화유산 향유기회 확대를 위하여 만24세 이하 국민의 무료관람을 시행하였음.• 궁·능·원·유적 국가지정문화유산은 2013년 10월 19일부터 한복의 대중화·생활화·세계화·활성화를 위하여 한복 착용자 무료관람을 시행하였음.
