description_portal: '서울특별시 중구의 책이나 잡지 따위의 인쇄물 출판을 전문으로 하는 업소 정보입니다. 데이터는 각 신고된 출판사에 부여된 관리번호, 현재의 운영 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화예술 및 출판 분야의 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 정기간행물 발행 신고업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 법적 절차를 거쳐 등록필증을 발급받고 저작권을 준수하며 도서를 발행하는 신뢰할 수 있는 문화예술 출판사의 정보를 투명하게 확인할 수 있도록 지원하여 독서진흥에 기여합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
