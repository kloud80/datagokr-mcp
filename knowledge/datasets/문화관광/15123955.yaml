description_portal: 경기도 양평군의 전통사찰 현황(사찰명, 종단명, 소재지도로명주소, 소재지지번주소, 설립년도, 전화번호, 위도, 경도, 데이터기준일)등의 데이터를 제공하고 있습니다.양평군의 전통사찰은 총 4개소로, 전통사찰의 지정 및 등록은 아래의 법률에 근거하여 절차에 따라 지정됩니다.양평군 전통사찰에 대한 자료는 이전과 비교하여 변경사항이 없습니다.- 전통사찰의 지정 및 등록 관련 안내사항 -전통사찰의 보존 및 지원에 관한 법률 제4조(전통사찰의 지정 및 등록)① 사찰의 주지는 운영, 관리중인 사찰을 전통사찰로 지정받으려면 사찰이 속한 단체 대표자의 추천서를 첨부하여 대통령령으로 정하는 바에 따라 특별시장, 광역시장, 특별자치시장, 도지사, 특별자치도지사를 거쳐, 문화체육관광부장관에게 전통사찰의 지정을 신청할 수 있다.② 문화체육관광부장관은 제1항의 신청에 의하거나 직권으로 다음 각호의 어느 하나에 해당하는 사찰을 대통령령으로 정하는 바에 따라 전통사찰로 지정할 수 있다. 1. 역사적으로 볼때 시대적 특색을 뚜렷하게 지니고 있다고 인정되는 사찰 2. 한국 고유의 불교, 문화, 예술 및 건축사의 흐름을 이해하는 데에 특히 필요하다고 인정되는 사찰 3. 한국 문화의 생성과 변화를 고찰할 때 전형적인 모형이 되는 사찰 4. 그 밖에 문화적 가치로 보아 전통사찰로 등록하는 것이 타당하다고 인정되는 사찰③ 문화체육관광부장관은 제2항에 따라 전통사찰을 지정하면 이를 고시하고 그 사찰의 주지와 사찰이 속한 단체 대표자에게도 알려야한다.④ 제3항에 따라 통지를 받은 사찰의 주지는 시, 도지사에게 전통사찰의 등록을 하여야 한다. 등록사항을 변경하는 경우에도 같다.⑤ 제2항부터 제4항까지의 규정에 따른 전통사찰의 지정과 통지 및 등록에 필요한 사항은 대통령령으로 정한다.
