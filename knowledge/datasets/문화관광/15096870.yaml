summary_user: 2014~2019년 제주 방문 내국인 관광객 실태조사 결과를 기준 연도와 거주 시도별로 집계한 통계로, 응답자 수(명)와 구성비(%)를 담는다. 관광 마케팅 담당자나 분석가가 '제주 방문객은 어느 시도에서 많이 오고, 그 비중이 해마다 어떻게 바뀌었나'를 확인하는 데 쓴다. 전역 조인 키는 없으며, 거주지 시도명을 행정구역 코드나 다른 시도별 통계와 이름으로 맞춰 연결한다.
description_portal: 이 데이터셋은 2014년부터 2019년까지 기간 동안, 제주특별자치도를 방문한 내국인 관광객을 출발지(거주지)별로 집계한 통계자료이다. 각 거주지(시도 또는 시군구)에서 제주를 방문한 관광객 수와 연도별 변화 추이를 포함하고 있어, 연령·성별이 아닌 ‘출발 지역’ 기준으로 제주 방문객의 지역 분포와 유입 패턴을 분석할 수 있다. 이 정보는 지역 간 관광 수요의 차이를 파악하거나, 특정 출발지에서의 제주 여행 비중을 확인해 마케팅 전략 수립, 교통 수단 및 관광 홍보 정책 설계, 관광객 유입 유도 방안 기획 등에 활용 가능하다. 또한 거주지별 방문자 집중 지역 확인, 지역별 관광객 증가/감소 추이 분석, 제주 관광의 출발지 기반 변화 탐색 등 관광 정책과 상업 기획 양쪽 모두에 기초 자료로 유용하다. 제공기관은 제주특별자치도이며, CSV 형식으로 공개되어 누구나 다운로드 및 분석이 가능하다.
