summary_user: 전남광주통합특별시(포털 설명상 광주광역시 범위)의 유원시설업 사업장을 한 행씩 담은 원천 목록으로, 사업장명·구분·영업상태와 상세영업상태·도로명 소재지·물놀이형 여부·키즈카페 여부를 담는다(csv 약 7KB). 주민이나 사업자가 '우리 동네에서 지금 영업 중인 키즈카페형·물놀이형 유원시설은 어디인가'를 확인하거나, 분석가가 지역 유원시설의 영업·폐업 현황을 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·도로명주소를 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: '0 관광진흥법 제3조(관광사업의 종류) 제1항제6호 유원시설업 : 유기시설이나 유기기구를 갖추어 이를 관광객에게 이용하게 하는 업(다른 영업을 경영하면서 관광객의 유치 또는 광고 등을 목적으로 유기시설이나 유기기구를 설치하여 이를 이용하게 하는 경우를 포함한다)0 관광진흥법 제5조(허가와 신고) 제2항 제3조 제1항 제6호에 따른 유원시설업 중 대통령령으로 정하는 유원시설업을 경영하려는 자는 문화체육관광부령으로 정하는 시설과 설비를 갖추어 특별자치시장, 특별자치도지사, 시장, 군수, 구청장의 허가를 받아야 한다.0 광주광역시 유원시설업 현황'
