summary_user: 함안박물관이 소장한 유물을 한 점(건)씩 기록한 원천 목록으로, 소장구분·소장품번호·명칭·수량·국적시대·재질·입수연유를 담은 CSV 파일(약 415KB)이다. 연구자나 문화콘텐츠 제작자가 "함안박물관에 가야시대 토기나 철기가 몇 점 있고 어떻게 입수됐나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 박물관 소장품 데이터나 e뮤지엄 자료와는 유물 명칭·시대·재질 같은 이름 값으로 맞춰 이어 써야 한다.
