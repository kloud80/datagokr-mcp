summary_user: 경정 경주 한 건마다 시행년도(stnd_yr), 회차, 일차, 경주번호와 1~3위 선수, 승식별 배당값을 담은 경주 단위 결과 데이터로, 범위는 전국·비공간이다. 경정 경주 결과를 분석하는 사람이 특정 연도·회차 경주에서 누가 1~3위였고 승식별 배당이 얼마였는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 연도·회차·일차·경주번호 조합이나 선수 이름 매핑, 같은 기관 데이터의 코드로만 잇는다.
description_portal: 서울올림픽기념국민체육진흥공단 경륜경정총괄본부에서 제공하는 경정경주결과는 경주시행년도, 회차, 일차, 경주번호, 1~3위 선수 정보와 승식별 배당 정보를 포함합니다. 경정 승식은 총 7종으로 단승식, 연승식, 쌍승식, 복승식, 삼복승식, 쌍복승식, 삼쌍승식이 있습니다. 단승식은 1위 선수를 맞추는 방식이며, 복승식은 1,2위 선수 2명을 순위에 상관없이 맞추는 방식입니다. 쌍복승식은 1위 선수와 23위 선수 2명을 순위에 상관없이 맞추는 방식입니다. 승식이 복잡할수록 배당금이 높아질 가능성이 큽니다.
