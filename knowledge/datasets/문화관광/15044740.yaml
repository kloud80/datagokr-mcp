summary_user: 강남구도시관리공단이 구민회관에서 운영하는 체육교실 강좌를 강좌 한 건씩 담은 파일로, 강좌명·운영요일·교육 시작/종료 시각·교육 대상·정원·수강료·교육장 도로명주소·접수 방법(온라인·방문 등)을 담는다(csv 약 6KB). 강남구 주민이 '평일 저녁에 들을 수 있는 구민회관 체육 강좌가 있는지, 수강료와 정원은 얼마인지'를 확인하거나, 분석가가 공공체육시설 생활체육 프로그램 현황을 정리할 때 쓴다. 전역 조인 키는 없어서 교육장 도로명주소나 운영기관명을 기준으로 체육시설 목록 등 다른 데이터와 이름·주소를 맞춰 이어 쓴다.
description_portal: 본 데이터는 구민회관에서 운영하는 프로그램의 상세 정보를 종합적으로 정리하여 제공하는 자료입니다.강좌명, 교육 시간, 교육 대상, 교육 방법, 강좌정원 및 수강료 등 프로그램 신청에 필요한 핵심 정보를 포함하여, 강좌 내용을 쉽게 확인하고 이용할 수 있도록 제공합니다.교육이 진행되는 장소 정보와 운영기관 연락처 등 이용 편의를 위한 정보도 함께 제공되며, 접수 방법 구분을 통해 온라인, 방문 등 신청 절차를 명확히 안내합니다.이 데이터는 생활체육 참여 활성화와 공공체육시설 프로그램의 투명한 공개 및 수강 편의 증진에 활용될 수 있습니다.
