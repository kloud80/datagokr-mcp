summary_user: 전국 시도별로 연도·문화재 대분류·소분류에 따른 지정(등록) 건수를 담은 집계 통계로, 포털 설명상 2016~2020년 범위이며 KOSIS 국가통계포털이 원 제공처입니다. 분석가나 연구자가 "시도별로 국가지정·시도지정 문화재가 몇 건이고 5년 사이 어떻게 늘었나"를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시도명(시도)을 이름으로 매핑해 다른 시도 단위 통계와 붙여야 하며, 개별 유산 목록이 필요하면 종목코드·지정번호를 가진 국가유산청 자체 API를 따로 써야 합니다.
