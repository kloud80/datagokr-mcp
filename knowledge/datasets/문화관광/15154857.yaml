summary_user: 전국 자치단체가 관리하는 영화상영업(영화관 등 상영 사업장) 인허가 정보를 사업장 한 곳씩 건별로 담으며, 인허가·폐업·휴업 일자, 영업상태, 도로명·지번 주소와 좌표, 시설면적·층수 등을 포함한다. 문화 상권 분석가나 창업 준비자가 '우리 지역에서 현재 영업 중인 영화상영관은 어디이고 최근 몇 곳이 폐업했나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 개방자치단체코드(OPN_ATMY_GRP_CD)·주소·사업장명으로 다른 지방행정 인허가 데이터나 행정구역 자료와 맞춰 잇는다.
description_portal: '문화_영화상영업 데이터는 영화를 상영하는 장소 또는 시설(사업장) 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 영화상영업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 영상콘텐츠산업과 / 044-203-3232 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
