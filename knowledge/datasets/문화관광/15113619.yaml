summary_user: 경기도 내 골프장을 한 곳씩 담은 명부로, 골프장 이름, 업종(회원제·비회원 대중형), 면적, 홀 수, 도로명·지번주소, 우편번호, 위경도를 담는다. 시군별 골프장 분포나 대중형과 회원제의 규모 차이를 보려는 분석가, 또는 집 근처 대중형 골프장을 찾는 이용자가 쓴다. 전역 조인 키는 없으므로 다른 체육시설업 명부나 상권 데이터와는 주소·사업장명 매칭이나 위경도 공간 결합으로 잇는다.
description_portal: 각 골프장의 명칭, 업종(회원제/비회원 대중형), 면적, 홀 수, 도로명주소 및 지번주소, 우편번호, 경도·위도 등의 위치 정보를 포함하고 있습니다. 이를 통해 골프장의 규모와 업종별 분포, 지리적 위치를 종합적으로 파악할 수 있으며, 골프 산업 현황 분석, 관광 자원 개발, 지역 기반 스포츠 시설 분석 등에 활용할 수 있습니다.공간정보(위경도)가 포함되어 있어 위치 기반 분석이나 지역경제 활성화 계획 수립에 참고 자료로도 활용 가능합니다. 업종 구분은 "회원"과 "비회원(대중형)"으로 구분되어 있어 유형별 운영 특성 비교에 유리합니다.
