summary_user: 강남구도시관리공단이 운영하는 공공 체육시설과 공연장을 시설별 한 행으로 담은 파일로, 운영요일·휴관일·평일/주말 운영시간, 유료 여부와 평일/주말 사용료, 초과 사용 단위시간, 도로명 주소와 위도·경도, 관리기관·담당부서를 포함한다(CSV 2,775바이트 규모). 강남구 주민이나 동호회가 '주말에 빌릴 수 있는 근처 체육관·공연장이 어디이고 사용료는 얼마인가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 시설명이나 주소·좌표로 맞춰 이어 쓴다.
description_portal: 강남구도시관리공단 체육시설 및 공연장 대관 정보 데이터는 강남구 관내에서 운영되는 다양한 공공 체육시설 및 공연장의 대관 관련 정보를 종합적으로 제공합니다.해당 데이터는 시설을 이용하려는 분들에게 필요한 정보를 한눈에 확인할 수 있도록 구성되어 있으며, 각 시설의 운영 요일, 휴관일, 평일 및 주말 운영시간 등 기본적인 운영 조건을 비롯해 유료 사용 여부, 평일·주말 사용료, 초과 사용 단위시간 등 대관 시 필요한 비용 정보를 상세하게 포함합니다.또한 시설의 위치를 확인할 수 있도록 도로명 주소와 함께 위도·경도 기반의 위치 정보(GPS 좌표)를 제공하며, 시설 관리기관과 담당부서 정보도 함께 제공되어 시설 이용과 관련된 문의 및 절차를 보다 쉽게 진행할 수 있습니다.공공시설 이용 편의를 높이며, 시설별 대관 가능 여부 및 이용 요건 확인에 활용될 수 있습니다.
