summary_user: 경기도 내 공공 사이클 경기장을 시설 한 곳당 한 행으로 담은 현황 자료로, 시설명·시군·소유기관·준공연도·건설사업비·좌석형태·수용인원·면적·트랙 규격·주소·위경도 등을 담는다(포털 설명상 의정부시 사이클 경기장 1곳, 의자식 3,000명). 체육 행정 담당자나 분석가가 경기도 사이클 경기장의 규모·준공 시기·관리 주체를 확인하고 리모델링이나 투자 계획의 기초 자료로 삼을 때 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)나 시군명·시설명으로 같은 기관의 다른 경기도 체육시설 현황과 맞추고, 위경도로 지도 위에 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 공공 사이클 경기장의 현황을 수록한 자료로, 시설명, 시군명, 소유기관, 준공연도, 건설사업비, 좌석형태, 수용인원, 연면적, 건축 및 부지면적, 관리주체와 운영조직, 위치정보(지번 및 도로명 주소, 위도·경도) 등 총 27개 항목으로 구성되어 있습니다. 시설로는 ‘의정부시 사이클 경기장’이 있으며, 좌석은 ‘의자식’으로 3,000명의 수용능력을 갖추고 있습니다. 해당 데이터는 지역 공공체육시설의 활용 현황 파악, 사이클 종목 기반 체육 인프라 분석, 시설 리모델링 및 투자계획 수립 등에 활용될 수 있습니다. ‘건설사업비(백만원)’, ‘WGS84위도’, ‘WGS84경도’ 등 항목은 정책 수립 및 공간분석에 유용하며, 일부 항목은 정보가 누락되어 있어 활용 시 주의가 필요합니다.
