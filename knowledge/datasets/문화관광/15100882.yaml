summary_user: 한국체육산업개발주식회사(올림픽공원 운영)가 홈페이지에 올린 공지사항을 게시글 한 건 단위로 담으며, 등록일·제목·내용·첨부파일·홈페이지 주소 등을 제공한다. 올림픽공원 이용자나 생활체육 동호인이 대관 접수 일정, 자전거 대여소 운영, 버스킹 공연, 서비스 중단 같은 최근 안내를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 제목·키워드 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국체육산업개발 공지사항  목록입니다.공지사항에 대한 데이터로 등록일,  제목, 내용 , 첨부파일, 홈페이지URL 등 항목을 제공합니다.2025년 6월 기준 1,716건 올팍소식을 제공하고 있습니다. 상호존중의 날 운영, 자전거 대여소 안내, 대관 접수 안내, 버스킹 공연 안내, 서비스 중단 안내 등 다양한 정보 제공을 하고 있습니다. 한국체육산업개발 홈페이지 > 알림홍보 > 공지사항에 들어오시면 자세한 정보 확인이 가능합니다. https://www.ksponco.or.kr/board.es?mid=a10301000000&bid=0046
