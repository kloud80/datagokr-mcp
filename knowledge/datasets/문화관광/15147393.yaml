summary_user: 서울 동작구의 체육도장업(태권도·유도·검도 등) 인허가 사업장을 한 곳씩 담은 원천 명부로, 사업장명·주소·좌표, 인허가일·폐업일, 영업상태, 보험가입 여부, 지도자 수·건물 면적 등을 포함한다. 동작구에서 현재 영업 중이거나 최근 폐업한 태권도장이 어디에 몇 곳 있는지 확인하려는 학부모·창업자·상권 분석가가 쓴다. 전역 조인 키는 없어 다른 자치구의 같은 LOCALDATA 체육시설업 데이터와는 같은 기관 코드(OPNSFTEAMCODE)·관리번호 체계로, 상권 데이터와는 주소·좌표나 사업장명 매핑으로 잇는다.
description_portal: 체육도장업 인허가 정보 데이터는 시민에게 체육 프로그램을 제공하는 시설 현황을 담고 있습니다.사업장명과 주소 정보는 각 체육도장의 위치와 기본 정보를 제공합니다.문화체육업종명은 다양한 체육도장 업종을 구분합니다.영업상태 항목은 정상, 휴업, 폐업 등 현재 운영 여부를 보여줍니다.보험가입여부 코드는 종업원과 수강생의 안전을 보장하기 위한 보험 가입 현황을 나타냅니다.시설규모 정보는 운동 공간, 훈련장 면적, 장비 현황 등 시설 환경을 보여줍니다.종사자 현황은 사범, 강사, 관리 직원 등 인력 구성과 규모를 나타냅니다.
