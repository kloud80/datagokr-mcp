summary_user: BIGKinds 뉴스 데이터베이스에서 모은 폭염 관련 기사를 기사 한 건당 한 행으로 담은 건별 메타데이터 파일로, 기사 주소·보도 일자·언론사·기고자·제목·통합분류(1~3단계)·인물·지역·기업 개체명·키워드·본문을 포함한다(CSV 약 127MB). 언론 연구자나 재난안전 정책 담당자가 '폭염 보도가 어느 시기에 몰렸고 어떤 키워드와 프레임으로 다뤄졌는가'를 분석하는 데 쓴다. 다른 데이터와 공통으로 쓸 조인 키는 없어서, 보도 일자로 기상·온열질환 통계와 시기를 맞추거나 지역 개체명을 지역명으로 매핑해 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와 붙이려면 일자나 지역명 같은 이름 매핑에 의존해야 한다. 폭염 자체의 관측값이 아니라 뉴스 보도 메타정보이므로 실제 폭염 피해나 기온은 별도 데이터로 확인해야 한다.
