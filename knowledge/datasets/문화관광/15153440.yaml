description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 폭염 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적 분석이 가능합니다.본 자료는 국내 주요 언론사의 폭염 관련 보도를 대상으로, 어느 시기에 폭염 이슈가 집중적으로 보도되었는지, 주요 키워드와 보도 프레임이 어떠했는지 등의 패턴을 밝히는 데 중점을 두고 있습니다. 이러한 분석은 언론이 폭염 현상과 그로 인한 사회·경제적 영향, 기후변화와의 연관성, 정부 및 지자체 대책 등을 어떻게 다루는지, 그리고 폭염 보도가 시민 인식과 정책 논의에 어떤 영향을 미쳤는지를 추적하는 데 유용합니다.또한 학계, 언론 연구자, 기후·환경 전문가, 재난안전 정책 입안자 등에게 폭염 보도의 경향, 이슈별 프레임 변화, 언론의 기후·재난 이슈 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
