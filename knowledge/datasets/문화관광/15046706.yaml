description_portal: '○ 통계개요* 통계명 : 공공체육시설* 통계종류 : 서울시 공공체육시설의 현황을 시설종목별로 제공하는 일반ㆍ보고통계* 근거법령 :「체육시설의 설치이용에 관한 법률」에서 지정한 시설* 작성목적 : 서울시 공공체육시설 파악을 통해 시민의 체육 관련 정책 수립을 위한기초자료로 활용하는 것을 목적으로 함* 조사체계 : 자치구 및 해당시설→ 서울특별시 체육진흥과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 자치구 및 해당시설내용 - 공공체육시설의 시설종목별(육상, 축구, 하키 등) 시설의 개소및 면적 현황○ 용어설명* 공공체육시설 : 국가ㆍ지방자치단체 또는 공공단체(대한체육회, 서울올림픽기념국민체육진흥공단, 한국마사회 등 공공법인체)가 국민의 체육활동에 제공하기위하여 설치관리ㆍ운영하는 시설을 말함○ 기 타* 면적은 부지면적임* 기타(광명시)는 합계에서 제외함'
