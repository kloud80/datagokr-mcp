summary_user: 경기도 착한여행 캠페인에 참여한 관광업체를 업체·상품 단위로 담은 명단으로, 업체명·관광상품명·공사분담률·티켓 형태·홈페이지·전화번호·주소를 수록한다. 종료된 캠페인에 어떤 업체가 어떤 상품을 얼마의 분담률로 할인 제공했는지 확인하려는 분석가나 관광정책 담당자가 프로모션 실적 정리와 후속 상품 기획에 쓴다. 실측 컬럼에 전역 조인 키가 없어, 관광사업 등록 원장 같은 다른 데이터와는 업체명·주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 경기도의 착한여행 캠페인에 참여한 관광업체들의 명단과 관련 정보를 제공하며, 코로나19 이후 관광소비 진작과 지역 관광산업 회복을 목적으로 활용됩니다. 각 참여 업체별로 관광업체명, 관광상품명, 공사분담률, 티켓 형태, 홈페이지, 전화번호, 주소 항목이 수록되어 있으며, 캠페인을 통해 소비자는 할인된 가격으로 다양한 관광서비스를 이용할 수 있습니다. 본 데이터는 착한여행 프로모션 실적 분석, 소비자 홍보 콘텐츠 제작, 관광 관련 정책 수립, 지역 맞춤형 관광상품 기획 등에 활용할 수 있습니다.* 해당 캠페인은 종료된 캠페인입니다.
