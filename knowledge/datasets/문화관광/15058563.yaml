summary_user: 경기도 내 일반게임 제공업체(청소년이용불가·전체이용가 게임물을 함께 운영하는 사업장)의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가·폐업일자, 영업상태, 주소와 좌표, 건물 층수, 시설면적, 총 게임기 수, 제공 게임물명 등이 들어 있다. 지자체 담당자나 분석가가 "우리 시군에 지금 영업 중인 일반게임장은 몇 곳이고, 학교·주거지 주변에 얼마나 몰려 있나"를 확인하거나 지도 점검 대상을 고를 때 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명으로 같은 경기도 데이터와 묶거나, 정제 주소·위경도로 다른 시설 데이터와 위치 기준으로 맞춰 쓴다.
description_portal: 본 데이터는 경기도 내 일반 게임 제공업체의 인허가 현황을 정리한 자료로, 청소년이용불가 게임물과 전체이용가 게임물을 모두 설치하여 운영하는 사업장 정보를 포함합니다. 주요 항목은 사업장명, 인허가일자 및 취소일자, 영업상태, 폐업일자, 소재지 주소와 전화번호, 건물 용도 및 층수, 시설면적, 통로너비, 소방·조명·환기·음향·방음시설 등 안전설비 여부, 총 게임기 수, 제공 게임물명, 업태구분, 문화체육업종명 등이 있습니다. 이를 통해 지역별 게임업체 분포, 영업 현황, 시설 안전성, 업종 특성을 분석할 수 있으며, 문화산업 정책 수립, 청소년 보호, 업종 관리 및 지도 점검 자료로 활용이 가능합니다. 데이터는 Open API를 통해 XML·JSON 형태로 제공되며, 시군명과 시군코드 조건을 활용해 특정 지역 현황을 조회할 수 있습니다.
