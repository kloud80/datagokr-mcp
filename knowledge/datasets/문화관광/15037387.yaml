description_portal: 전라남도 함평군은 지역 특화 작물인 국화산업의 경쟁력 확보와 지식재산권 보호를 위해 출원 및 보호 중인 국화 품종 정보를 공공데이터로 제공하고 있습니다. 본 자료는 함평군이 자체 개발하여 출원한 국화 품종에 대한 정보를 포함하고 있으며, 품종명, 출원번호, 보호권 만료일 등의 항목으로 구성되어 있습니다. 해당 데이터는 품종별 권리 보호 현황 관리, 국화산업 육성 전략 수립, 품종 로열티 체계 구축 등에 활용될 수 있으며, 화훼농가의 품종 선택, 유통시장 품종구분, 지자체 간 품종 중복 방지 등 실무적인 활용에도 유용합니다. 또한, 지방자치단체 주도의 식물신품종 보호 및 농업 지식재산 확대를 위한 기초자료로서의 공공적 가치가 높은 데이터입니다.
