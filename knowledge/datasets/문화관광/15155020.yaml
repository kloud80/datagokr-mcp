summary_user: 전국 자치단체가 관리하는 출판사 인허가 정보를 업소 한 곳당 한 행으로 모은 건별 원천 데이터로, 인허가일자·영업상태·폐업일자·사업장명·주소·좌표를 담으며 API 전체 건수는 151,826건입니다. 출판 창업을 준비하는 사업자나 분석가가 '우리 시·군·구에서 영업 중인 출판사는 몇 곳이고 최근 폐업한 곳은 어디인가' 같은 질문에 쓴다. 개방자치단체코드(OPN_ATMY_GRP_CD)는 행정표준 기관코드로, 지번·도로명 주소는 주소 키로 다른 지역 데이터와 잇고, 영업상태는 코드표로 뜻을 풀어 쓴다.
description_portal: '기타_출판사 데이터는 책이나 잡지 따위의 인쇄물 출판을 전문으로 하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 출판사 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의  - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 출판인쇄독서진흥과 / 044-203-3284 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
