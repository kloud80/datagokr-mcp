summary_user: 종목별로 한 행씩 체육지도자 자격 종류·등급(전문·생활체육 1·2급 스포츠지도사, 건강운동관리사, 장애인·유소년·노인스포츠지도사)별 취득 인원을 2023년 이전, 2024년, 2025년 구간으로 나눠 담은 전국 단위 집계표이다. 체육단체·지도자 양성기관이나 분석가가 '어느 종목에서 어떤 등급의 지도자 자격 취득자가 최근 늘었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육 데이터와는 종목명을 문자 그대로 맞춰 연결해야 한다.
limits: 개인별·지역별 자격 취득 내역이 아니라 전국 종목별 집계라서 시도·시군구 단위 분석에는 쓰지 못한다. 종목 코드가 없어 다른 데이터와 붙일 때 종목명 표기 차이를 직접 맞춰야 한다. 포털 설명의 연도 구간(2022년 이전·2023·2024)과 실제 파일 컬럼(2023년 이전·2024·2025)이 다르므로 파일 컬럼을 기준으로 읽는다.
