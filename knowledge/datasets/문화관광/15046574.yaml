description_portal: '○ 통계개요* 통계명 : 전문예술법인 지정단체* 통계종류 : 서울시 전문예술법인 지정단체 현황을 제공하는 일반ㆍ보고통계* 근거법령 :「문화예술진흥법」에 의해 지정된 전문예술법인 또는 전문예술단체* 작성목적 : 전문예술법인 및 단체의 지정현황을 파악하여, 법인 및 단체에 대한효율적인 지원과 관련정책수립을 위한 기초자료를 제공하는 것을목적으로 함* 조사체계 : 자치구 → 서울특별시 문화예술과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 서울시내용 - 서울시 민법인, 상법인, 단체 등 전문예술법인 현황○ 용어설명* 전문예술법인ㆍ단체 : 전문예술법인ㆍ단체의 범위는 다음과 같음- 문화예술공연장 운영 법인 또는 단체- 극단, 뮤지컬단, 관현악단, 무용단, 합창단, 오페라단, 실내악단, 창극단,국악단, 공연기획단 또는 이와 유사한 예술단을 운영하는 법인 또는 단체- 전시행사의 개최를 주된 목적으로 하는 법인 또는 단체- 문화예술진흥사업을 목적으로 서울시가 설립한 법인'
