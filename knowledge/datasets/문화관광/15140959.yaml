description_portal: 이 데이터는 서울특별시 광진구 내에서 운영 중인 기타 유원시설업 인허가 업소 정보를 제공합니다. 해당 업소는 주로 키즈카페 등 안전성 검사 대상이 아닌 유기시설 또는 유기기구를 설치하여 운영하는 곳으로, 테마형 실내놀이시설이나 창의 체험공간 등이 포함됩니다. 업소별 명칭, 소재지, 업종 유형, 인허가 상태 등의 정보가 포함되어 있으며, 광진구 내 어린이 놀이시설 및 가족 여가 공간 분포 현황을 파악하는 데 유용합니다. 좌표 정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공되며, 위도·경도(WGS84) 좌표는 포함되어 있지 않으므로 지도 활용 시 변환이 필요합니다. 데이터는 3일 전 기준 자료로 정기적으로 갱신되며, 지역 내 유원시설 행정관리, 안전 지도 제작, 여가시설 정책 수립 등에 활용될 수 있는 기초자료입니다.
