summary_user: 한국방송광고진흥공사가 운영하는 한국광고박물관이 소장한 광고 유물(광고정보지·서적·신문·홍보물·잡지 등)을 한 점(건)씩 명칭·수량·재질·시대·용도기능·입수처·크기·특징으로 정리한 목록으로, 포털 설명상 1906년부터 2011년까지의 자료 1,467건을 담는다. 광고·홍보 연구자나 관련 기업이 특정 시대의 신문 광고나 홍보물 실물이 박물관에 소장돼 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시대·재질 같은 항목의 이름 매핑으로만 느슨하게 이어 쓴다.
