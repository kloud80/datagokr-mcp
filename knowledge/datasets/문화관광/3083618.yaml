summary_user: 제주시 체육진흥과가 운영하는 생활체육 프로그램(요가·배드민턴·탁구·건강체조 등)을 프로그램별 요일·시작·종료 시간·참여인원·지도자 단위로 담은 현황 파일(CSV 약 36KB)이다. 제주시 주민이 어떤 요일·시간에 어떤 생활체육 강좌가 열리는지 확인하거나, 분석가가 프로그램별 참여 규모와 지도자 배치를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 프로그램명·지도자명 같은 이름 매칭이나 같은 기관(제주시) 기준으로만 이어 쓴다.
