description_portal: '본 데이터는 제주특별자치도 제주시 체육진흥과에서 지역 주민의 건강 증진과 생활체육 활성화를 위해 운영하는 각종 생활체육 프로그램의 운영 현황을 수록한 자료입니다. 프로그램별 요일, 운영 시간, 참여 규모, 지도자 정보 등을 포함하고 있으며, 주민 맞춤형 체육 서비스 제공과 체육 복지 확대를 위한 행정 자료로 활용됩니다.주요 항목시작시간 / 종료시간: 각 생활체육 프로그램의 실제 운영 시간프로그램: 요가, 배드민턴, 탁구, 건강체조 등 운영 중인 체육 프로그램 명칭참여인원(명): 해당 프로그램에 참여한 인원 수지도자: 프로그램을 운영하는 전문 생활체육 지도자 성명 또는 식별 정보데이터기준일: 데이터가 집계 또는 갱신된 기준일자활용 목적이 데이터는 생활체육 참여율 분석, 지역별 체육 수요 파악, 프로그램 만족도 조사, 지도자 배치 계획 수립 등에 활용되며, 제주시 체육진흥과에서 정기적으로 관리 및 갱신하여 최신 운영 현황을 반영하고 있습니다.'
