summary_user: 울산 남구 선암호수공원 공연장의 대관 예약을 건별로 담은 파일로, 예약일(공연예정일)·시작·종료시간·행사 내용·전기 사용 여부·데이터기준일을 기록한다(csv 약 7.9KB 규모). 공연장 대관을 검토하는 주민·단체나 시설 운영 분석가가 "특정 날짜·시간대에 공연장이 이미 예약돼 있는지, 어떤 행사가 주로 열리는지"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID·공연장ID 같은 코드로는 연결되지 않으며, 다른 데이터와는 공연장 이름이나 같은 기관(울산 남구) 기준으로만 이어 쓴다.
limits: 공연장·공연 식별 코드가 없어 KOPIS 공연 목록이나 문화시설 데이터와 키로 결합할 수 없다. 명세상 반기·이벤트 주기로 생성되는 파일이라 실시간 예약 현황 확인에는 맞지 않으며, 범위는 울산 남구 한 시설에 한정된다.
