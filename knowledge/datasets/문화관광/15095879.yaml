summary_user: 대구광역시 북구 관광지 주변에 있는 쇼핑시설(대규모점포·기타 식품판매업 등) 82곳을 사업장 한 곳당 한 행으로 담은 파일로, 업종, 인허가일자, 영업상태, 주소, 경위도, 영업시간이 들어 있다. 북구 관광지를 찾는 여행자나 지역 상권을 보는 분석가가 "이 관광지 근처에 영업 중인 대형마트나 식품점은 어디인가"를 확인하는 데 쓴다. 전역 조인 키는 없으므로 도로명주소·경위도로 관광지 목록이나 TourAPI 쇼핑 콘텐츠와 위치 기준으로 맞춰 쓰고, 서비스ID는 인허가 업종 구분 정도로 참고한다.
