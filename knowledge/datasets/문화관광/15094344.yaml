description_portal: 입력 파라미터를 이용하여 무형유산 기록화 영상 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형유산 기록화 영상 정보 목록 조회 서비스는 한국의 무형문화유산을 체계적으로 기록하고 보존하기 위해 제작된 영상 자료를 온라인으로 열람할 수 있도록 제공하는 디지털 플랫폼입니다. 이 서비스는 각 영상의 제목, 제작 연도, 촬영 장소, 관련 무형유산 분야, 영상 길이, 제작 기관, 출연자 및 연출자 정보, 영상의 내용 요약, 관련 사진 및 스틸컷, 영상 파일 링크 등을 상세하게 안내합니다. 이용자는 주제별, 지역별, 분야별, 연도별 등 다양한 기준으로 맞춤형 검색 및 필터링을 통해 원하는 영상을 손쉽게 찾아볼 수 있으며, 이를 통해 무형문화유산의 전통적 가치와 전승 맥락을 시청각적으로 이해하고 학술 연구, 교육 콘텐츠 개발, 디지털 전시, AR/VR 구현 등 다양한 분야에서 활용할 수 있는 중요한 디지털 문화자원으로 활용됩니다.
