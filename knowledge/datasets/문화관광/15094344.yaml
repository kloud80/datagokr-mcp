summary_user: 국립무형유산원이 제작한 무형유산 기록화 영상을 한 건씩 담은 목록으로, 자료명(nihcItmNm)·썸네일·상세 페이지 URL·제작자·제작일·분류·촬영 장소·저작권/이용조건·키워드·영상 정보·설명·재생 시간을 담는다. 연구자나 교육 콘텐츠 제작자가 "특정 종목이나 분야의 기록 영상이 언제, 어디서 촬영됐고 어디서 볼 수 있나"를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 무형유산 데이터와는 종목명·분류명 같은 이름 매핑이나 같은 기관 데이터끼리만 이어 쓴다.
limits: 공통 식별 코드가 없어 보유자·종목 지정 정보 등과 이으려면 이름 매칭에 기대야 하고, 표기 차이로 누락될 수 있다. 전국 단위의 비공간 데이터라 좌표 기반 지역 분석에는 맞지 않는다. 개발계정은 하루 500회로 호출이 제한된다.
