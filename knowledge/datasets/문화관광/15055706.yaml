summary_user: 전북특별자치도에 등록된 골프장을 한 곳당 한 행으로 담은 명부 파일(csv, 약 3KB)로, 골프장명·주소·전화번호와 대중제/회원제 구분(종류), 홀수·면적·코스길이, 사업자, 등록일을 담는다. 도민·방문객이 "전북에서 18홀 대중제 골프장은 어디에 있나"를 찾거나, 분석가가 시군별 골프장 분포와 규모를 파악하는 데 쓴다. 전역 조인 키는 없어 주소나 골프장명·사업자명 매칭으로 다른 체육시설업 인허가(LOCALDATA)·상권 데이터와 이어 쓴다.
description_portal: 전북특별자치도 내에 정식으로 등록되어 운영 중인 골프장의 상세 현황 데이터입니다. 이 자료는 각 골프장의 명칭과 주소, 연락처 등 기본 정보와 함께, 누구나 이용 가능한 '대중제'와 회원 중심으로 운영되는 '회원제'를 구분하여 보여줍니다. 또한, 9홀, 18홀 등 전체 코스 규모와 총면적, 사업자 정보까지 포함하고 있어, 지역 내 골프 산업의 인프라를 한눈에 파악할 수 있습니다. 골프를 즐기는 도민이나 방문객에게는 원하는 조건의 골프장을 찾는 데 유용한 정보를 제공하며, 관광 및 체육 정책 수립을 위한 기초 자료로도 활용 가치가 높습니다.
