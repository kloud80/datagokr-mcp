description_portal: 부산광역시 문화회관에서 열리는 극장 공연의 제목, 일시, 장소 등의 정보가 들어있는 링크 데이터입니다. 부산문화회관은 부산광역시에 위치한 예술, 문화회관으로 예술공연, 연극공연 등이 이루어지는 곳입니다. 1988년 대극장(대형 공연장)을 시작으로, 1993년 중극장과 소극장 등을 포함한 전관이 개관하였으며 2017년에는 부산시민회관과 통합 운영하여 ‘재단법인 부산문화회관’이 공식 출범하였고, 부산 대표 공연공간으로 자리 잡고 있습니다. 위 데이터는 개인 및 단체의 현장학습 및 휴식 등의 계획 수립에 도움을 줄 수 있습니다.
