summary_user: 충청남도 보령시가 수집한 음식점을 한 곳씩 담은 목록으로, 음식점명·메인음식·주소·전화번호·테마·위도/경도 같은 개별 위치 정보를 시군구(보령시) 범위로 제공한다. 보령으로 여행 가는 사람이나 여행 앱 개발자가 '대천해수욕장 근처에서 이 음식을 파는 식당이 어디이고 주차는 되는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 TourAPI(contentId) 등 다른 관광 데이터와는 음식점명·주소 같은 이름 매칭이나 좌표로만 이어 쓴다.
limits: 다른 데이터셋과 바로 붙는 공통 키가 없어 이름·주소 매칭에 기대야 한다. 보령시 한 곳만 다루므로 다른 시군과 비교하려면 별도 데이터가 필요하다. 개발계정은 하루 8,000회로 호출이 제한된다.
