summary_user: 정선군 관내 작은영화관(정선읍 아리아리 시네마, 고한읍 고한시네마)을 상영관 한 곳당 한 행으로 담은 소규모 파일(364바이트 CSV)로, 상영관명·연락처·지번/도로명 주소·관람정원·영업상태·데이터기준일자를 담는다. 정선군 주민이나 방문객이 가까운 작은영화관의 위치와 좌석 규모, 운영 여부를 확인하거나, 분석가가 문화소외지역의 영화 상영 기반을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 영화관·문화시설 데이터와는 상영관명이나 주소를 맞춰 이어 쓴다.
description_portal: 정선군 관내에 있는 지역문화 공간인 작은영화관에 대한 정보입니다. 군민의 문화생활 제공과 문화소외지역 주민의 문화향유기회 확대 등을 위하여 위탁 운영중에 있습니다. 정선군 정선읍 아리아리 시네마, 정선군 고한읍 고한시네마에 관한 정보입니다. 더 넓고 편안한 관람을 위하여 정선시네마 2관은 리클라이너 좌석으로 운영하고 있습니다.  현재 관람 요금은 일반 영화 관람료 7천원, 3D 영화 관람료 9천원입니다.관람 요금은 관람 요금 정책에 따라 정해지므로 예매 시 관람 요금을 꼭 확인하여 주시기 바랍니다. 문의사항은 정선군청 문화체육과  문화예술팀(033-560-2549) 로 문의주시면 감사하겠습니다.
