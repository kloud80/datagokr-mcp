summary_user: 한국전력공사 나주 본사 전자도서관이 소장한 도서·자료를 한 권(등록번호)당 한 행으로 담은 소장 목록 파일로, 서명·저자·출판사·출판년도·청구기호를 담는다. 직원이나 외부 이용자가 '찾는 책이 한전 도서관에 있는지, 있다면 어느 청구기호 서가에 있는지'를 방문 전에 확인하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서관 목록이나 도서관정보나루 데이터와는 서명·저자 문자열 매칭으로만 이어 쓴다.
description_portal: 한국전력 전자도서관에서 보유 중인 도서 및 자료 정보 데이터 입니다. 한전 전자도서관 자료실은 나주 본사(전남 나주시 전력로 55) 1층에 위치하여 내부직원 및 외부 일반인에게 도서 및 자료 제공 서비스를 제공합니다.한전 도서관에서 소장하고 있는 도서명, 저자명, 발행자, 발행년, 분류기호 등의 데이터를 확인하실 수 있습니다.첨부 데이터의 청구기호를 활용하여 도서관 방문 시 찾으시는 도서의 위치 정보를 얻으실 수 있습니다.청구기호 및 보관 위치 등은 직접 도서관 방문 시 별도 안내가 가능한 점 참고하여 주시기 바랍니다.
