summary_user: 서울 성동구 안에서 수영·골프·체육단련 등 여러 종목을 한곳에서 운영하는 종합체육시설업소를 업소별로 담은 인허가 명부로, 관리번호·인허가일자·인허가취소일자·영업상태·폐업일자·휴업기간·소재지 주소·좌표를 포함한다. 성동구에서 어떤 종합체육시설이 영업 중이거나 언제 폐업했는지 확인하려는 주민, 체육시설 개폐업을 상권 신호로 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 같은 기관(개방자치단체) 코드로만 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 수영, 골프, 체육단련 등 다양한 종류의 체육시설을 한 곳에 집약하여 운영하는 종합체육시설업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 이러한 종합체육시설은 지역주민의 건강 증진, 여가 활용, 생활체육 활성화, 커뮤니티 형성 등 다양한 사회적 가치 실현에 기여하고 있습니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 업소의 설립과 인허가 내역, 영업 개시 및 종료, 운영상 행정변동 등 필수적인 관리 정보가 포함되어 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현장 점검과 자료 갱신을 실시하여 데이터의 신뢰성과 최신성을 확보합니다. 본 데이터는 종합체육시설 현황 분석, 체육정책 및 건강증진 프로그램 수립, 시장 동향 및 상권 평가, 소비자 안내정보 제공 등 다양한 분야에서 효율적으로 활용될 수 있습니다. 정책입안자, 연구자, 업계, 일반 시민 모두에게 객관적이고 실효성 있는 자료를 제공하며, 데이터는 정기적으로 최신화됩니다.
