description_portal: 본 데이터는 한국저작권보호원이 온라인상에서 불법 유통되는 콘텐츠에 대해 수행한 모니터링 활동의 결과를 월별로 정리한 자료입니다. 보호원은 영상, 출판, 음악, 웹툰, 소프트웨어 등 다양한 장르에 대해 상시적인 온라인 모니터링을 수행하고 있으며, 이 데이터는 국내외 온라인 플랫폼에서 발생하는 불법복제물 유통 현황을 정량적으로 파악하고, 저작권 보호 정책 수립에 필요한 기초자료로 활용되고 있습니다.해당 데이터는 불법복제물 유통의 장르별·시기별 발생 추이를 확인하고, 저작권 침해의 심각성 및 대응 수준을 객관적으로 진단하는 데 활용될 수 있습니다. 정책 수립 기관, 학계·연구기관, 콘텐츠 기업 등은 해당 데이터를 기반으로 불법 콘텐츠 유통 양상을 분석하고, 장르별 맞춤형 저작권 보호 전략을 마련하는 데 참고자료로 활용할 수 있습니다.
