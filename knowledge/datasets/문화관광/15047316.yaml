description_portal: 이 데이터는 서울시 장애여성인력개발센터에서 개설하는 교육강좌의 개설정보 및 신청가능 여부를 담고 있습니다. 강좌명, 교육내용, 수강대상, 신청상태 등이 포함되어 있으며, 접수 마감된 강좌는 목록에서 제외되어 실제로 신청 가능한 강좌 정보에 가깝습니다. 이를 통해 장애여성을 위한 역량강화 교육 프로그램의 공급 현황을 파악하고, 수강 기회, 교육내용, 대상자 유형 등 측면에서 프로그램 설계 및 정책 분석에 활용할 수 있습니다.장애여성인력개발센터에서 실시하는 교육강좌 정보입니다. 교육신청은 http://kangnam.seoulwomen.or.kr/ 에서 직접 하셔야 합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://kangnam.seoulwomen.or.kr/ 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
