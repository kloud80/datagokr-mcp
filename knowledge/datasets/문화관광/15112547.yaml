description_portal: 본 데이터는 경상북도 경주시 상상황리단길 내 소상공인 상점에서 판매 중인 상품의 VR 영상 콘텐츠 현황을 수록한 자료이다. 데이터에는 상품명, 촬영일자, 영상 URL, 상점명 및 위치 정보가 포함되어 있으며, 이용자는 이를 통해 실제 매장에 방문하지 않고도 상품의 외형 및 특징을 가상현실로 체험할 수 있다. 이는 지역 상권 활성화 및 비대면 마케팅 지원을 위해 구축된 스마트관광 인프라로, 관광객 및 소비자의 구매 편의성을 높이는 데 기여한다. 특히 각 상품에 대한 VR 영상은 직관적인 시각 정보를 제공함으로써 지역 특화상품의 홍보 효과를 극대화할 수 있다. 행정기관은 이를 기반으로 지역경제 진흥정책 수립 및 소상공인 지원사업 등 다양한 분야에 활용할 수 있다.
