description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 다문화 관련 뉴스 메타정보 자료입니다. 한국 사회는 빠르게 다문화 사회로 전환하고 있으며, 이에 따라 이주민, 다문화 가정, 외국인 노동자, 국제결혼 등 다양한 주제가 사회적 관심사로 부상하고 있습니다. 본 자료는 국내 주요 신문과 방송 보도에서 다문화와 관련된 기사들을 분석하여 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 인식 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 다문화 가정 지원 정책, 교육 현장의 다양성 논의, 사회 통합과 갈등 문제, 외국인 노동자의 권익 보장 등 주요 쟁점이 언론 담론에서 어떻게 다뤄졌는지 객관적으로 파악할 수 있습니다. 또한 학술 연구, 정책 분석, 언론 보도 연구, 교육 현장에서 활용할 수 있는 기초 자료로, 한국 사회가 다문화적 다양성을 수용하고 포용적 사회로 발전하는 데 중요한 참고 자료가 됩니다.
