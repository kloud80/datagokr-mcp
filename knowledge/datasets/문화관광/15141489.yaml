summary_user: 서울 종로구에서 인터넷컴퓨터게임시설제공업(PC방) 인허가를 받은 사업장을 한 곳당 한 행으로 담은 건별 원천 데이터로, 인허가·취소·폐업일자, 영업상태, 소재지 주소·좌표, 시설면적·층수 같은 시설 정보를 포함한다. 종로구 안에서 지금 영업 중인 PC방이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지를 확인하려는 주민·창업자·분석가가 쓴다. 전역 조인 키는 없어 사업장명·주소나 같은 기관 코드(지자체코드)로만 다른 구의 같은 업종 인허가 데이터나 주소 기반 데이터와 맞춰 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 내에서 인터넷 기반의 컴퓨터 게임 이용 공간을 운영하기 위해 인허가를 받은 사업체에 대한 정보를 제공합니다. 수록 항목은 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등으로 구성되어 있으며, 영업 개시 및 폐업, 상태 변경 등 사업체의 행정 이력을 체계적으로 파악할 수 있도록 설계되었습니다. 해당 업종은 「게임산업진흥에 관한 법률」 제26조에 따라 등록·관리되며, 주로 청소년 출입, 이용시간 제한, 불법 게임물 차단 등과 관련된 사회적 이슈와도 연계되어 관리됩니다. 본 데이터는 지역 내 여가시설 분포 현황, 업종 변화 추세, 도시 안전 및 청소년 보호정책 수립 등의 기초자료로 활용될 수 있습니다. 또한 민간에서는 소비자 이용패턴 분석, 시장 진입 전략 수립 등 다양한 산업적 분석에도 사용할 수 있습니다. 정보는 정기적으로 갱신되며, 공공데이터 제공 및 이용 활성화에 관한 법률에 따라 개방됩니다.
