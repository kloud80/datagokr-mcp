summary_user: 충청남도 공주시에 등록된 여행업체를 업체 한 곳당 한 행으로 담은 소규모 CSV 파일(약 5.5KB)로, 업종·상호·소재지 지번/도로명 주소·데이터기준일을 담는다. 공주시에서 영업 중인 국내·국외 여행사를 찾거나 주소로 위치를 확인하려는 주민·사업자, 지역 관광산업 현황을 보려는 분석가가 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 상호명이나 주소 문자열을 맞추는 방식으로만 이어 쓰며, 주소를 지오코딩해 지도에 올리거나 다른 시군구 여행업 등록현황과 나란히 비교하는 데 쓴다.
