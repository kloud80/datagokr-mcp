summary_user: 서울특별시 양천구 관내 영화배급업체의 인허가 정보를 업체별 건으로 담으며, 인허가일자·취소일자, 영업상태와 상세상태, 폐업일, 지번·도로명 주소, 사업장명, 좌표, 최초등록일 등을 포함한다. 영화산업 종사자나 분석가가 양천구에서 현재 영업 중인 영화배급업체가 어디에 몇 곳 있는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 업체명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드 OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 본 자료는 서울특별시 양천구 관내 영화배급업체의 인허가 정보를 체계적으로 정리한 데이터이다. 데이터에는 인허가일자, 업체명, 영업상태, 소재지, 업종구분, 최초등록일 등의 항목이 포함되어 있어영화산업 관련 종사자와 일반 이용자가 신뢰성 있는 정보를 확인할 수 있도록 구성하였다. 해당 데이터는 정확성을 담보하기 위해 관할 영화 관련 부서에서 수집한 공식 자료를 기반으로 하며, 업체별 등록 현황과 운영 상태를 상세하게 기록하였다. 이를 통해 영화배급업 관리, 정책 수립, 안전 점검, 서비스 품질 향상에 활용 가능하며, 지역 영화 산업 활성화와 문화 콘텐츠 발전에 기여한다.
accrual_periodicity: 수시
