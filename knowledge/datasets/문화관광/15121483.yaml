summary_user: 문화 정책포털에 모인 문화예술·체육 분야 채용공고를 공고 한 건씩 담는 데이터로, 공고 제목, 등록일, 소속 기관, 주제분류·핵심어, 관련 장소, 시간 범위, 원문 링크(url) 등을 포함하며 범위는 전국입니다. 구직자가 "지금 모집 중인 문화예술·체육 분야 공공기관 채용공고는 무엇인가"를 확인하거나, 분석가가 분야별 채용 동향을 살필 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했고, 다른 데이터와는 기관명·장소명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 문화체육관광부에서 제공하는 일자리 및 채용정보 데이터셋은 문화 정책포털을 통해 수집된 다양한 채용 관련 정보를 체계적으로 제공합니다. 자원의 명칭, 등록일, 소속, 기관별 주제분류, 핵심 주제어, 관련 장소, 시간적 범위, 언어, 저작권 등 주요 항목을 포함하고 있어 구직자와 연구자, 정책 담당자 등에게 유용하게 활용될 수 있습니다. 채용공고의 상세 내용과 관련 자료, 참조 정보까지 폭넓게 제공함으로써 문화예술 및 체육 분야의 일자리 동향 파악, 취업 준비, 정책 수립 등에 실질적인 도움을 드립니다. 데이터는 API 형태로 제공되어 다양한 서비스 개발 및 분석에 활용이 가능합니다.
