summary_user: 서울 강북구에서 인형뽑기·오락실처럼 전체이용가 게임물을 설치해 제공하는 청소년게임제공업소의 인허가 정보를 업소 한 곳당 한 행으로 담는다(인허가·취소일자, 영업상태, 휴·폐업일, 지번·도로명 주소, 상호, 중부원점TM 좌표, 시설 면적·층수 등). 동네에 영업 중인 오락실·인형뽑기방이 어디 있는지, 최근 새로 생기거나 문을 닫은 곳이 있는지 확인하려는 주민·창업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·상호 같은 이름 매핑이나 같은 기관의 코드(개방자치단체코드 OPNSFTEAMCODE, 관리번호 MGTNO)로만 잇는다.
description_portal: '서울시 강북구 청소년게임제공업 인허가 정보: 강북구의 인형뽑기, 오락실 등 전체이용가 게임물을 설치하여 제공하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.서울특별시 강북구_청소년게임제공업 인허가 정보 데이터는 해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
