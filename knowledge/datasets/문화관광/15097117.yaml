summary_user: 제주특별자치도 두멩이골목 일대 무장애 여행 코스를 지점별로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부를 담는다. 교통약자나 휠체어 이용자가 골목 코스를 어떤 순서로 돌고 어디서 쉬거나 화장실을 쓸 수 있는지 확인할 때, 또는 지자체가 열린관광지·무장애 관광환경 정비 대상을 고를 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 지점 이름 매칭이나 위경도 근접으로만 이을 수 있다.
description_portal: '"제주특별자치도 내 제주특별자치도_제주특별자치도_두멩이골목_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 두멩이골목 일대를 중심으로 구축된 무장애 여행 코스 정보를 제공한다. 좁은 골목길과 전통 주거지 환경을 포함한 해당 구간의 이동 동선, 접근 가능한 지점, 휴게 공간 및 편의시설 현황 등을 교통약자와 휠체어 이용자의 관점에서 수집·정비하였다. 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 현장 기반 자료가 포함되어 있으며, 지역 골목관광 활성화와 더불어 무장애 관광환경 조성, 열린관광지 개발, 정책 수립을 위한 기초정보로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
