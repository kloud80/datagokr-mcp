description_portal: 경상북도 도지정 무형문화재 현황 자료는 지역을 대표하는 전통 기술과 예술을 보존하기 위해 지정된 문화재의 정보를 정리한 것입니다. 각 항목에는 명칭과 분야를 비롯해 보유자와 전승교육사 전수장학생 등 전통기능을 이어가는 사람들의 기본 정보가 포함되어 있으며 거주지와 인정일자도 함께 제공됩니다. 이 자료는 전통문화의 맥을 유지하기 위해 활동하는 인적 자원의 분포와 전승 구조를 이해하는 데 활용될 수 있으며 지역 문화유산 보존정책의 기초 자료로 의미가 있습니다. 특히 개별 종목별로 어떤 인력이 어떤 지역에서 활동하는지를 확인할 수 있어 문화 전승의 흐름을 파악하는 데 도움을 줍니다. 자료 관련 문의는 054-880-3176으로 하시기 바랍니다.
