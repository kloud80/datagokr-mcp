description_portal: '독립기념관에서 보유하고 있는 독립운동관련 신문 원문 이미지정보로 대상신문으로는 대한민보, 태평양주보, 선봉, 대공보(중경), 북미시보, 대한매일신보, 독립신문, 단산시보, 국민보, 한민, 황성신문, 대한민국임시정부공보, 신한국보임국민보 : 1913년 8월 1일 발간된 이래 1968년 12월 25일 폐간되기까지 하와이 한인사회에서 발행되었던 신문들 중 가장 대표적인 국문판 주간신문이다.대한민국임시정부공보 : 대한민국임시정부(이하 임시정부)가 공식적으로 발행한 일종의 官報이며, 임시정부가 존재하고 활동하는 기간 동안 줄곧 발행되었다.독립신문 : 중국 상해에서 발행된 신문으로 상해에 대한민국임시정부가 수립되자 이내 공보를 발행하여 널리 그 결의 내용을 알렸다.북미시보 : 북미지역 동지회의 역량을 강화하고 독립운동을 적극 지원하기 위해 대한인동지회 북미총회가 발행한 신문이다신한국보 : 하와이 한인사회가 북미의 한인사회와 함께 국민회로 통합된 후 발간된 대표적인 하와이 한인신문이다.'
