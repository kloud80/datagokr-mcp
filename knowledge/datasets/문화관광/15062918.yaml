summary_user: 경상남도 공공 체육시설 345곳을 시설 단위로 담은 조회 API로, 명칭·관리기관·도로명주소·홈페이지·대표 연락처를 제공한다. 근처 체육시설이 어디 있고 어디에 문의하면 되는지 찾는 도민이나 생활체육 분석가가 쓴다. 도로명주소(roadaddress)가 주소(address) 키로 실측되어 있어 주소 기준으로 다른 시설·지역 데이터와 이어 쓴다.
limits: 시설 현황 정보만 담으며 예약·대관 기능은 이 데이터에 없고, 예약은 광역 단위만 다룬다고 검토되어 있다. 포털 활용신청은 자동승인이며 개발계정은 일 10,000회 호출로 제한된다. 범위는 경상남도 시도 단위이고 좌표 필드는 명세 목록에 없어 주소로만 위치를 잡는다.
