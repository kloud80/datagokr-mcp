description_portal: 이 데이터는 보행자의 안전을 강화하고 긴급 상황 발생 시 즉각적인 구조 요청이 가능하도록 설치된 안심벨의 위치 및 특성을 정리한 자료입니다. 설치 주소, 장치 유형(양방향 경광등+경보음), 위도·경도 좌표, 시행 시작일 및 종료일, 분류 등의 항목으로 구성되어 있으며, 대부분 가로변과 주거지 인근에 집중 설치되어 있습니다. 안심벨은 음성과 경광으로 위급 상황을 알릴 수 있어 범죄 예방과 위기 대응에 효과적이며, 특히 여성·청소년 등 사회적 약자 보호를 위한 생활안전 인프라로 활용되고 있습니다. 본 자료는 스마트도시 기반의 방범 체계 강화, 지역별 안전 사각지대 분석, 도시 보안정책 수립 등 다양한 공공안전 행정 업무에 활용하실 수 있습니다.
