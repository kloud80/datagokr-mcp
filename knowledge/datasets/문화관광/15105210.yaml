summary_user: 문화기반시설의 현황과 이용 실태에 관한 집계 통계를 통계 항목별로 제목, 설명, 공간 범위, 발행·수집일과 함께 담으며, 포털 설명상 시도·군구별 관광지 수, 내·외국인 방문객 수, 전시·공연 건수 같은 지표를 포함하고 범위는 전국이다. 정책 담당자나 연구자가 시도별 관광지 방문객 추이나 지역별 전시·공연 활동 규모를 비교할 때 근거 통계로 쓴다. 전역 조인 키가 없어 다른 데이터와는 공간 범위(SPATIAL_COVERAGE)에 적힌 지역명이나 통계 제목을 이름으로 맞춰 연결해야 한다.
description_portal: 문화기반시설의 현황과 이용 실태를 종합적으로 파악할 수 있는 통계정보를 제공하는 데이터셋입니다. 시도 및 군구별 관광지 수, 내·외국인 유료 및 무료 관광지 방문객 수, 연도별 방문 추이 등 주요 지표를 포함하고 있으며, 전시와 공연 관련 건수, 비율, 평균 전시 기간, 공연 횟수 등 문화예술 활동의 세부 현황도 함께 제공합니다. 이를 통해 지역별 문화 인프라의 분포와 이용 특성을 심층적으로 분석할 수 있으며, 문화정책 수립, 공공문화시설 운영 관리, 관광산업 연구, 지역 문화 활성화 전략 마련 등 다양한 분야에서 활용이 가능합니다. 연구자, 정책 담당자, 산업 관계자 모두에게 실질적인 근거 자료로 유용한 공공 통계 데이터입니다.
