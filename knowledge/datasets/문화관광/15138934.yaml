description_portal: 이 데이터셋은 한국 전통문양에 대한 다양한 정보를 제공하는 OpenAPI 서비스로, 인물문양, 동물문양, 식물문양, 인공물문양, 자연산수문양, 문자문양, 기하문양, 복합문양 등 여러 유형의 2D 및 3D 전통문양 데이터를 포함합니다. 그 뿐만 아니라 각 문양의 번호, 명칭, 섬네일 이미지, 형태, 유형, 시대, 소장기관, 설명, 원천유물명, 재질 등의 상세 정보를 제공합니다. 전통문양 연구, 디자인 개발, 문화유산 교육, 디지털 콘텐츠 제작 등 다양한 분야에서 활용할 수 있으며, 데이터는 정기적으로 업데이트됩니다.
