summary_user: 한국 전통문양을 문양 한 건 단위로 담는 API로, 인물·동물·식물·인공물·자연산수·문자·기하·복합 문양 유형별 2D·3D 문양의 명칭, 섬네일, 시대, 소장기관, 설명, 원천유물명·재질·용도를 제공하며 범위는 전국·비공간이다. 디자이너나 콘텐츠 제작자가 '조선시대 식물문양 중 도자기에서 나온 문양은 무엇이고 원본 유물은 어디에 있나'를 찾을 때 쓴다. 다른 데이터와 잇는 전역 조인 키는 없고, 목록 조회로 얻은 문양아이디(did)를 상세 조회에 넘겨 쓰는 내부 연결만 있으며 소장기관·원천유물명은 이름 매핑으로만 박물관 소장품 데이터와 맞춰 볼 수 있다.
limits: 상세 조회의 필수 파라미터인 문양아이디(did)는 먼저 목록 조회로 받아 넘겨야 한다. 외부 데이터와 직접 붙는 공통 키가 없어 소장기관·유물명은 이름으로 대조해야 하며, 개발계정은 하루 10,000회로 호출이 제한된다.
