summary_user: 한국문화예술위원회 국가문화예술지원시스템에 등록된 국고보조 '신나는 예술여행' 순회공연을 한 건씩(포털 설명상 2,581건) 담은 파일로, 사업유형·장르·예술단체·프로그램명·순회대상처·공연일·시간·지역·주소가 들어 있다. 문화정책 분석가나 지역 기관 담당자가 '어느 지역·대상처에 어떤 장르의 순회공연이 언제 얼마나 갔는가'를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없고 KOPIS 공연ID·공연장ID도 없으므로, 다른 공연·문화시설 데이터와는 지역명·주소나 예술단체·프로그램 이름을 맞춰서만 이어 쓴다.
description_portal: 이 데이터는 한국문화예술위원회 국가문화예술지원시스템에 등록된 국고보조금 지원사업 공연 행사 중 ‘신나는 예술여행’ 공연 목록에 대한 정보입니다. 총 2,581개의 공연 건이 포함되어 있으며, 각 공연은 순번, 사업유형, 장르, 예술단체, 프로그램명, 순회대상처, 공연일, 공연시간, 지역, 주소 항목으로 구성되어 있습니다. 사업유형은 (발굴형)문학순회사업, (매칭형)문학순회사업 등으로 나뉘며, 공연일은 날짜 형식으로 제공되어 일정 분석이 가능합니다. 이 자료를 통해 전국 각지에서 진행된 순회공연의 분포, 일정, 참여단체 및 프로그램 현황을 파악할 수 있습니다.
