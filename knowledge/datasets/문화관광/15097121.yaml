summary_user: 제주 산방산 일대와 하멜상선 유적지를 잇는 무장애 여행 코스를 지점 단위로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 해당 여부를 기록한다. 휠체어 이용자나 교통약자 동반 여행자가 이 코스를 어떤 순서로 돌고 어디서 쉬거나 경치를 볼 수 있는지 확인하는 데 쓰고, 열린관광지·무장애 관광 정책 담당자의 기초자료로도 쓴다. 전역 조인 키는 없어서 다른 데이터와는 위도·경도 좌표나 지점 이름으로 맞춰 이어 써야 한다.
description_portal: '"제주특별자치도 내 제주특별자치도_산방산과하멜상선_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 산방산 일대와 하멜상선 유적지를 중심으로 조성된 무장애 여행 코스 정보를 제공한다. 해당 구간은 자연경관과 역사문화 요소가 결합된 산책형 루트로서, 교통약자 및 휠체어 이용자의 이동 편의를 위한 접근 가능한 동선, 전망 지점, 휴식 공간, 편의시설 현황 등이 포함되어 있다. 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 현장 기반의 세부 요소가 반영되어 있으며, 무장애 관광환경 구축, 열린관광지 개발 및 문화역사 관광 활성화, 관련 정책 수립을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
