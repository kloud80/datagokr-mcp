summary_user: 서울특별시 마포구의 외국인관광도시민박업 인허가 업소를 한 업소당 한 행으로 담은 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·사업장명·좌표와 객실 수·건물 층수 같은 시설 항목을 포함한다. 마포구에서 지금 영업 중인 외국인 대상 도시민박이 어디에 몇 곳 있는지, 최근 폐업한 곳은 어디인지 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결한다.
description_portal: 서울특별시 마포구의 도시 지역의 주민이 거주하고 있는 주택을 이용하여 외국인 관광객에게 한국의 가정 문화를 체험 할 수 있도록 숙식 등의 서비스를 제공하는 업소 정보에 대한 설명입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업체를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민과 행정기관은 관내 외국인관광도시민박업체의 위치, 시설 구성 및 운영 현황을 파악하고, 위생 및 안전 관리 정책을 효율적으로 수립할 수 있습니다.
