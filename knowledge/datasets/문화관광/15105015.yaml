summary_user: 국립중앙극장·대한체육회·한국관광공사 등 15개 문화·체육·관광 기관이 낸 보도자료를 한 건씩 담은 건별 원천 데이터로, 제목·요약·소속 기관·발행일·주제어·장소 등을 포함하며 범위는 전국·비공간이다. 기자나 연구자가 "대한체육회가 최근 어떤 대회·정책을 발표했나"처럼 기관별 소식이나 정책 동향을 비교·추적할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기관명(affiliation)·주제어·장소 같은 이름 매칭으로만 느슨하게 이어 쓴다.
description_portal: 국립중앙극장, 대한체육회, 한국관광공사 등 15개 주요 문화·체육·관광 관련 기관에서 발행한 보도자료를 통합하여 제공하는 데이터셋입니다. 각 기관의 최신 소식, 정책 발표, 행사 안내 등 다양한 정보를 한 곳에서 확인할 수 있어 언론, 연구자, 일반 국민 등 다양한 이용자가 손쉽게 활용할 수 있습니다. 주요 컬럼에는 보도자료의 요약, 소속 기관, 발행일, 내용, 저작권, 주제어, 등록일, 장소 등이 포함되어 있어 기관별 소식 비교, 정책 동향 분석, 문화행사 홍보 등 다양한 목적으로 활용 가능합니다. 통합된 보도자료 정보는 데이터 기반의 정책 연구, 미디어 콘텐츠 제작, 공공 소통 강화 등에 유용하게 쓰일 수 있습니다.
