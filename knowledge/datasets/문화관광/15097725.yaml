summary_user: 경상남도 안의 마이스(MICE) 회의시설과 인프라시설별로 어워드 정보, RTI지수, 온라인화 진행 여부, 수용태세지수, 인기도, 트립어드바이저·씨트립·네이버 평점 같은 품질 지표를 담은 시설 단위 파일(CSV)이다. 행사 기획자나 관광 분석가가 "경남에서 국제회의를 열 만한 시설 가운데 수용태세와 온라인 평판이 좋은 곳은 어디인가"를 비교하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광 콘텐츠 등 다른 데이터와는 시설명·지역명을 이름 매칭하거나 같은 기관의 시설(ID) 기준으로만 이어 쓴다.
limits: 실측 컬럼에 TourAPI contentId 같은 공통 조인 키가 없어서, 다른 데이터와 붙이려면 시설명 매칭이 필요하고 이 과정에서 오매칭이 생길 수 있다. 메타데이터상 범위는 전국으로 표기돼 있지만 포털 설명은 경상남도 시설만 다룬다고 하므로, 범위는 실제 지역명 값으로 확인해야 한다.
