summary_user: 정읍시 관내 숙박업소를 업소 한 곳당 한 행으로 담은 목록 파일로, 업소명·도로명주소·지번주소·전화번호·데이터기준일자를 담는다. 정읍 여행객이나 관광 분야 사업자가 '정읍시에 어떤 숙박업소가 어디에 있고 연락처는 무엇인가'를 확인하거나, 분석가가 시 단위 숙박 공급 분포를 파악할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명이나 주소를 매칭해 잇고, 숙박업 인허가 공통 원천인 공중위생 영업신고(LOCALDATA) 자료와 대조할 때도 이 방식으로 연결한다.
description_portal: 전북특별자치도 정읍시에서 제공하는 숙박업 현황중 업소명, 영업소도로명주소, 영업소지번주소, 전화번호의 정보를 제공합니다.숙박업 데이터 개방은 지역별 숙박 수요와 공급 현황을 투명하게 제공하여 관광 정책의 정밀한 수립을 돕고, 창업·투자 판단에 필요한 정보를 강화해 지역 경제 활성화에 기여합니다. 또한 안전·위생 관련 정보를 시민에게 공개하여 신뢰도를 높이며, 민간 플랫폼·관광업계가 새로운 서비스와 콘텐츠를 개발할 수 있도록 지원해 관광 경쟁력을 높일 것으로 예상됩니다.기타 궁금한 사항은 담당부서인 정읍시 관광과로 문의하시기 바랍니다.
