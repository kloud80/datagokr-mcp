summary_user: 인천 부평구에 등록된 국외 여행업체를 업체 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 업종·상호·지번주소·도로명주소를 수록한다. 부평구 안에서 해외여행 상품을 파는 여행사가 어디에 몇 곳 있는지, 어느 동네에 몰려 있는지를 확인할 때 쓴다. 등록번호나 사업자번호 같은 공통 조인 키는 없으므로, 다른 데이터와는 상호명이나 주소를 맞춰 보거나 같은 부평구의 다른 여행업·관광사업 현황 파일과 나란히 놓고 쓴다.
description_portal: '국외 여행업체의 상호, 업종, 소재지 주소 등을 수록한 데이터.해외여행 상품 기획·판매·알선 등 국외 여행 관련 서비스 제공 현황을 파악하고, 지역 관광산업 분석, 여행업 관리, 주민 해외여행 수요 대응 및 관광 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 국외 여행업 등록 현황 및 업종별 분포 분석– 지번·도로명 주소 기반 입지 특성 및 접근성 평가– 해외여행 서비스 제공 업체 관리 및 관광산업 정책 자료 활용– 주민 해외여행 수요 충족 및 지역 관광산업 활성화 근거 제공주요 항목 설명● 업종: 등록된 여행업의 업종 구분(국외 여행업)● 상호: 여행업체의 명칭● 소재지 지번주소: 업체의 지번 주소● 소재지 도로명주소: 업체의 도로명 주소'
