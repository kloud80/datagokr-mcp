summary_user: 전북특별자치도 산림박물관이 소장한 전시자료를 물품 한 건씩 물품명·단위·수량·취득일자·보관실로 정리한 소장품 목록 파일(CSV, 약 48KB)이다. 연구자나 방문객이 '이 박물관에 어떤 곤충·식물 표본이나 고서·회화가 있고 어느 보관실에 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 시설코드가 없어 다른 데이터와는 박물관 이름이나 같은 기관 기준으로만 이어 쓴다.
