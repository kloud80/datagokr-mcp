summary_user: 제주데이터허브가 제공하는 천지연폭포 한 곳의 무장애 여행 정보로, 지점(아이디)마다 위도·경도·해발고도를 담고 포털 설명상 장소설명과 이미지도 포함한다. 휠체어 사용자나 유아차를 동반한 여행자가 천지연폭포 관람로의 높낮이 변화와 동선을 미리 확인하거나, 지자체가 열린관광지 접근성을 점검할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지(contentId) 등과 직접 이어지지 않으므로, 좌표나 장소명으로 맞춰 연결한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 천지연폭포 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 천지연폭포는 제주 서귀포시에 위치한 대표적인 자연관광지로, 높이 약 22m, 폭 약 12m의 폭포가 절벽 아래 깊이 20m의 연못으로 떨어지는 장관을 이루는 명소입니다. 이 데이터셋은 장애인, 고령자, 유아동반자 등 이동 약자를 고려한 무장애 접근성 정보를 포함하고 있으며, 평탄화된 산책로, 장애인 전용 주차구역 및 화장실, 휠체어 접근 가능한 동선, 식수대 및 휴게시설 등의 편의시설 현황이 포함되어 있습니다. 주요 관람 구간은 큰 단차 없이 이동이 가능하지만, 일부 징검다리나 계단 구간은 있어 휠체어나 보행 보조가 필요한 경우 방문길 선택 시 주의가 요구됩니다. 무장애 관광지로서의 접근성 보장, 열린관광지 확대, 관광 서비스 개선 및 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
