summary_user: 서울특별시 강북구의 헬스장 등 체력단련장업 인허가 업소를 한 곳씩 담은 건별 명부로, 인허가일·폐업일, 영업상태, 소재지 주소, 사업장명, 면적, 중부원점TM 좌표(X·Y)를 담고 영업 중인 곳과 폐업한 곳을 모두 포함한다. 강북구에서 헬스장이 어디에 얼마나 생기고 문을 닫았는지 보려는 창업 준비자나 상권 분석가가 개폐업 흐름을 상권 신호로 읽는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓰며, 다른 자치구나 다른 체육시설업 인허가 정보와 같은 형식으로 묶어 본다.
description_portal: '서울특별시 강북구 체력단련장업 인허가 정보 데이터는 강북구의 헬스장과 같은 체격관리 및 근력, 유연성, 지구력 강화 등을 목표로 운동을 할 때 필요한 도구와 기구를 제공하는 업소정보* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
