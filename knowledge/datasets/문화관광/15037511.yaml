description_portal: '○ 본 파일은 대전광역시 서구에 위치한 체육시설의 현황 정보를 포함하고 있으며, 각 시설의 명칭과 소재지(도로명 및 지번주소), 면적(제곱미터 기준), 설치된 운동시설의 종류(예: 스쿼시 코트, 배드민턴 코트, 수영 레인 수 등), 최대 수용 가능 인원, 준공연도, 시설 연락처, 관리기관 정보, 그리고 데이터 기준일자 등의 항목으로 구성되어 있습니다. 본 자료는 지역 내 체육 인프라 현황을 파악하고, 공간 분석이나 정책 수립 시 참고할 수 있도록 정리된 정보입니다.○ 수록된 데이터는 해당 기관의 관리 시스템을 기준으로 지정일에 맞추어 추출 및 정리된 것이며, 그 이후 발생한 시설 변경, 신규 개소, 폐쇄, 담당 기관 변경, 연락처 수정 등 일부 사항은 반영되지 않았을 수 있습니다. 이에 따라 실제 현황과 다소 차이가 있을 수 있으므로, 개별 시설의 정확한 정보가 필요할 경우에는 각 체육시설 또는 관리기관에 직접 문의하시어 확인하시는 것을 권장드립니다.'
