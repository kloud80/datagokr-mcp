summary_user: 경기도 내 관광진흥법상 관광펜션업으로 등록된 업소를 한 곳씩 담은 인허가 원천 목록으로, 시군·사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·좌표(위경도)·시설면적·놀이시설 수·부대시설·보험기관 등을 담는다. 여행자나 숙박 분석가가 '가평·양평 등 특정 시군에 지금 영업 중인 관광펜션이 몇 곳이고 어디에 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명(SIGUN_CD)·주소·사업장명 매핑이나 위경도 좌표로 다른 숙박·관광 데이터와 잇고, 공중위생법 숙박업 신고(LOCALDATA) 인허가 자료와는 이름·주소 대조로 맞춘다.
description_portal: 경기도 내 관광 펜션업체 인허가 현황입니다. 숙박시설을 운영하고 있는 자가 자연·문화 체험관광에 적합한 시설을 갖추고 관광객에게 이용을 제공하는 업소의 정보를 제공합니다.이 데이터는 경기도 내에서 관광펜션업으로 등록된 숙박업체들의 인허가 및 운영 현황을 종합한 자료입니다. 관광펜션은 일반 숙박업소와 달리 관광진흥법에 따라 등록된 시설로, 자연환경과 연계된 휴양 목적의 숙박 제공을 주목적으로 하며 주로 산간, 계곡, 관광지 인근에 위치합니다. 주요 항목에는 시군명, 사업장명, 인허가일자, 폐업일자, 영업상태, 도로명주소 및 지번주소, 전화번호, 시설면적, 놀이시설 보유여부, 부대시설 내역, 기획여행보험 가입일자 및 종료일자, 시설규모(객실 수 등) 등이 포함되어 있으며, 관광객의 안전과 편의를 위한 정보를 포괄적으로 제공합니다.해당 데이터는 지역별 숙박 인프라 분포 분석, 관광자원과 연계한 숙박 정책 수립, 여행자 보험 기반 안전관리 체계 마련, 소규모 관광숙박업체 현황 모니터링, 관광안내 지도 제작, 비대면 숙박 정보시스템 구축 등 다양한 정책 및 민간 서비스 개발에 활용될 수 있습니다. 본 자료는 경기도 및 각 시군의 관광부서 또는 문화체육관광부에서 수집한 공공데이터입니다.
