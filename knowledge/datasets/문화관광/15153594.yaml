summary_user: BIGKinds 뉴스 데이터베이스에서 모은 파리 올림픽 관련 기사를 기사 1건당 1행으로 담은 건별 메타데이터 파일로, 기사 주소·보도 일자·언론사·제목·통합분류(1~3단계)·인물·지역·기업 개체명·키워드·특성추출 값·본문을 포함한다(CSV 약 134MB). 언론·스포츠 정책 연구자가 '파리 올림픽 기간에 어떤 종목과 이슈가 언제 집중 보도됐고 어떤 키워드로 다뤄졌는가'를 분석하는 데 쓴다. 다른 데이터와 붙일 전역 조인 키는 없어서, 언론사명·일자나 개체명(인물·지역·기관) 같은 이름 기준 매칭으로만 연결한다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 파리올림픽 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적 분석이 가능합니다.본 자료는 국내 주요 언론사의 파리올림픽 관련 보도를 대상으로, 어떤 종목·이슈가 어느 시기에 집중 보도되었는지, 보도 키워드와 프레임이 어떠했는지 등의 패턴을 밝히는 데 중점을 두고 있습니다. 이러한 분석은 언론이 선수 성과, 메달 경쟁, 조직위원회 운영, 국제 스포츠 외교, 안전·교통·기후 등 개최국 이슈를 어떻게 다루는지, 그리고 이러한 보도가 국내 여론과 스포츠 정책 논의에 어떤 영향을 미쳤는지를 추적하는 데 유용합니다.또한 학계, 언론 연구자, 스포츠 정책 전문가, 국제 스포츠 기구 관계자 등에게 파리올림픽 관련 보도의 경향, 이슈별 프레임 변화, 언론의 국제 스포츠 이벤트 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
