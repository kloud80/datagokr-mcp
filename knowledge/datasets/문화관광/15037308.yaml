summary_user: 전라남도 시군에 있는 축구장을 시설 한 곳당 한 행으로 담은 현황 파일로, 시군구·시설명·소유기관·관리주체와 부지·건축·연면적, 경기장 바닥재료·폭·길이·면적·면수, 좌석수·수용인원·좌석형태, 건축구조·준공연도를 담는다. 생활체육 동호인이나 대회 주최 측이 '우리 시군에 인조잔디 축구장이 몇 면 있고 관중석은 얼마나 되는가'를 확인하거나, 분석가가 시군별 축구장 공급과 노후도(준공연도)를 비교하는 데 쓴다. 전역 조인 키나 코드 필드가 없어 다른 데이터와는 시군구 이름이나 시설명을 문자로 맞춰 연결해야 한다.
description_portal: '- 전라남도 각 시군에 소재하고 있는 축구장에 대한 데이터를 조회하실 수 있습니다.- 시군명, 시설명, 소유기관, 관리주체, 부지면적, 건축면적, 연면적, 경기장 바닥재료, 경기장 폭/길이/면적/면수, 좌석수, 수용인원, 좌석형태, 건축구조, 준공연도에 대한 자료를 제공합니다.- 전라남도에는 다양한 축구장이 있으며, 그 중 일부는 지방자치단체에서 관리하고 있습니다. - 각 시군의 체육시설 관리 부서나 해당 시설의 홈페이지를 통해 자세한 정보를 확인하실 수 있습니다.- 전라남도는 축구가 활발히 이루어지는 지역으로, 유소년부터 성인까지 다양한 연령층과 수준에서 축구 활동이 이루어지고 있습니다.'
