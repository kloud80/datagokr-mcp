description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 이 데이터는 제주특별자치도의 싱게물공원과 용당포 일대를 대상으로 위도·경도, 명칭, 장소 상세 정보, 무장애 관광 요소 등을 구조화하여 제공하는 공공데이터로, 장애인과 사회적 약자를 포함한 누구나 이용할 수 있는 열린 관광지 조성을 목적으로 한다. 해당 지역의 접근성, 주변 환경, 이용 편의성을 반영한 정보가 포함되어 있어 무장애 여행 계획 수립, 관광자원 관리, 정책 기획 등 다양한 공공·민간 분야에서 활용 가능하며, 데이터는 CSV 형식으로 무료 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
