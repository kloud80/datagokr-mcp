summary_user: 한국마사회가 제공하는 전국 승마장 정보를 사업장 한 곳당 한 행으로 담으며, 주소, 대표자 연락처, 운영시간, 휴무일, 승마장 유형, 보유 마필 수, 교육·참여 프로그램, 보험 만료일 등이 들어 있다. 승마를 배우려는 국민이 '우리 동네 근처에 어떤 교육 프로그램을 운영하는 승마장이 있고 언제 쉬는가'를 찾거나, 분석가가 지역별 승마시설 분포와 마필 보유 규모를 비교하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 확인되지 않아, 다른 데이터와는 사업장명이나 주소 문자열을 맞춰 연결해야 한다.
limits: 전역 조인 키가 없어 다른 데이터셋과는 이름·주소 매칭으로만 연결할 수 있다. 호출에는 포털 활용신청(자동승인)으로 받은 serviceKey가 필요하고, 개발계정은 하루 3,000회로 제한되며 결과는 페이지 번호와 페이지당 건수를 지정해 나눠 받는다. 포털상 세부 부문은 언론·출판으로 분류돼 있지만 실제 내용은 승마·체육시설 정보이므로 부문 분류로 검색할 때 주의한다.
