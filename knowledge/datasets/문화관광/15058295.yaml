description_portal: 한국마사회 전국 승마장 정보를 제공합니다. (제공자료는 사업장명, 사업장주소, 상세주소, 대표자명, 대표자이메일, 대표자전화번호, 휴무일, 홈페이지, 운영시간, 승마장유형, 협력승마시설유형, 대표코치, 마필보유두수, 교육프로그램, 참여프로그램, 보험만료일, 승마장소개글, 실무자명 자료입니다) ) - 요청메세지에 페이지당 건수와 페이지 번호를 이용하여 자료를 조회하실 수 있습니다.※ 승마란 생명이 있는 말과 일체가 되어야 하는 특수한 성격을 지닌 운동으로서 신체를 단련하고 기사도 정신을 함양하여 호연지기를 기르는 스포츠로, 올바른 신체 발달을 돕는 전신운동인 동시에 대담성과 건전한 사고력을 키우고 동물 애호정신을 통해 인간애를 고양시키는 정신 운동입니다
