description_portal: '제주특별자치도 내 제주시 야외운동기구 현황 데이터를 제공합니다.항목: 시설명, 설치 주소, 위치 좌표, 관리 상태, 노후화 여부, 사용 방법 안내 여부 등* 제주특별자치도 야외운동기구 위치 데이터는 공원, 체육공원, 해변 산책로 등 주민 생활체육 시설의 위치와 설치 정보를 제공하는 GIS 기반 데이터입니다. 시설명, 설치 위치, 운동기구 수 및 종류 등의 정보를 포함하며, SHP 파일 형식으로 제공됩니다.이를 통해 지역별 운동기구 분포와 시설 상태를 분석하고, 관리하는 데 중요한 기초 자료로 활용됩니다.* 활용분야 : 시설 관리 및 유지보수, 도시계획 및 정책 수립, 데이터 시각화 및 분석, 앱 및 서비스 개발"'
