summary_user: 콘텐츠수출마케팅플랫폼(WelCon)에서 국제비즈니스 행사마켓을 분류하는 카테고리 목록으로, 카테고리별 아이디·이름·활성여부·등록일자를 담은 소규모 코드표 파일(csv 약 7KB)이며 전국 단위·비공간 자료다. 콘텐츠 수출을 준비하는 사업자나 분석가가 'WelCon에서 현재 운영 중인 행사마켓 분류는 무엇인가'를 확인하거나, 행사 목록 데이터의 카테고리 코드를 이름으로 풀어 읽을 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 같은 기관(한국콘텐츠진흥원)의 WelCon 행사·마켓 데이터와 카테고리아이디 또는 카테고리명 매칭으로만 연결한다.
description_portal: '콘텐츠수출마케팅플랫폼(WelCon)에서 제공하는 국제비즈니스 행사마켓 카테고리 정보입니다. 본 데이터는 콘텐츠 수출을 위한 다양한 비즈니스 행사에 대한 중요한 기준을 제공하며, 이를 통해 관련 업계 종사자들이 행사 참여를 계획하고, 관련 네트워크를 형성하는 데 도움을 줄 수 있습니다. 데이터는 카테고리ID, 카테고리명, 활성여부, 등록일자로 구성되어 있으며, 이 정보를 통하여 특정 이벤트나 행사가 현재 활성화되어 있는지를 파악할 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다: 카테고리ID(문자형), 카테고리명(문자형), 활성여부(문자형), 등록일자(날짜형). 이 데이터를 활용하면 콘텐츠 관련 사업체는 참여 가능 행사들을 한눈에 확인할 수 있어, 보다 효율적으로 마케팅 전략을 세우고 기회를 모색할 수 있습니다. 또한, 행사 카테고리의 활성 여부를 통해 해당 행사에 대한 시장의 관심도를 판단할 수 있는 유용한 자료가 될 것입니다.'
