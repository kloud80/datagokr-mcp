summary_user: 광주광역시 전통문화행사가 열리는 시설과 행사 프로그램을 행사 건별로 담은 CSV 파일로, 시설명·주소·좌표, 프로그램 연도·행사명·내용, 홈페이지·예매처·입장료(무료 여부·가격·할인) 정보를 함께 담는다. 광주를 찾는 관광객이나 시민이 "이번에 열리는 전통문화행사는 어디서 하고 입장료는 얼마인가"를 확인하거나, 관광 안내 서비스가 행사 장소를 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 다른 공연·문화시설 데이터와는 시설명이나 주소·위경도로 맞춰 이어야 한다.
limits: 표준 코드(공연·문화시설 ID 등)가 없어 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 기대야 한다. 명세상 수시·이벤트 주기로 만들어지는 파일이라 정기적으로 갱신되는 행사 일정표로 보기는 어렵다.
