summary_user: 서울특별시 강남구에 있는 의료관광 관련 의료기관 400여 곳의 기관명과 기관분류(성형외과·안과·치과 등 진료과목·서비스 구분)를 기관 한 곳당 한 행으로 담은 한국어 목록 파일(csv, 약 11KB)이다. 강남구에서 특정 진료과목 병원을 찾는 외국인 환자·의료관광 안내 사업자나, 강남구 의료기관의 진료과목별 분포를 보려는 분석가가 쓴다. 전역 조인 키나 기관 코드가 없어 다른 의료기관 데이터와는 기관명을 맞춰 이어 써야 한다.
description_portal: 서울특별시 강남구에 위치한 400여개 의료기관에 대한 기관명, 기관분류에 대한 데이터를 제공합니다.   각 병원의 이름이 기재되어 있어 사용자가 특정 의료기관을 쉽게 식별할 수 있습니다. 또한 데이터에는 기관분류에 관한 정보도 함께 기재되어 있는대, 이 항목에는 성형외과, 안과, 치과 등과 같이 진료과목별 혹은 제공 의료 서비스별로 상세히 분류된 종류가 명시되어 있어, 데이터를 활용하는 사람이 원하는 의료서비스나 진료과목에 따라 병원을 손쉽게 찾아볼 수 있도록 분류 기준을 마련하였습니다. 이와 관련하여 보다 구체적인 안내나 추가적인 자료가 필요하거나 궁금한 점이 있다면, 서울특별시 강남구 관관진흥과로 문의하여 주시기 바랍니다.
