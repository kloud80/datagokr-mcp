description_portal: 무등도서관이 보유하고 있는 총 장서 수(375,158권)에 각 주제별 장서수를 나누어 추출한 주제별 장서비율 데이터로 주제는 총 10개로 분류되어 있습니다.※ 데이터기준일자 2021년 10월광주광역시립도서관 무등도서관의 주제별 장서비율은 전체 장서 중 각 주제가 차지하는 비율을 나타냅니다. 문학, 역사, 과학, 예술 등 다양한 분야별로 장서가 분포되어 있으며, 이 비율을 통해 도서관이 어떤 주제에 집중하여 장서를 확보하고 있는지 알 수 있습니다. 주제별 장서비율은 이용자 요구와 지역 특성을 반영해 도서관 자원 배분과 장서 확충 계획 수립에 중요한 기준이 됩니다. 이를 통해 효과적인 자료 관리와 균형 잡힌 장서 구성이 가능해집니다.
