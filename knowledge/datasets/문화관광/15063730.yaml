description_portal: 부산광역시 클래식음악 목록 데이터를 개방합니다클래식 음악(또는 서양 고전 음악)은 서양에서 발전한 전통적인 예술 음악을 의미하며, 일반적으로 중세부터 20세기 초반까지의 음악을 포함합니다. 보통 우리가 말하는 클래식 음악은 특히 바로크, 고전주의, 낭만주의 시대의 음악을 가리키는 경우가 많습니다. 클래식 음악의 주요 특징은 정교한 구조와 형식미, 악보중심의 연주, 현악기, 관악기, 타악기 등 다양한 악기구성 등이 있습니다.개방되는 데이터는 공연제목, 공연기간, 오픈런, 공연장 명, 유무료 구분등의 데이터가 포함되어 있습니다
