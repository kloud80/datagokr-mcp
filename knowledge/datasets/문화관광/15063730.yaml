summary_user: 부산광역시에서 열리는 클래식 음악 공연을 건별 목록으로 담으며, 공연제목·공연 시작일과 종료일·오픈런 여부·공연장 이름·유무료 구분을 포함한다. 시민이나 공연 기획자가 '이번 달 부산에서 열리는 무료 클래식 공연은 어디서 하나'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연ID·공연장ID와 직접 연결되지 않으며, 다른 공연·공연장 데이터와는 공연장 이름(place_nm)이나 공연제목을 맞대어 이어 써야 한다.
limits: 공연장 코드나 KOPIS 공연ID가 없어 이름 매핑 외에는 다른 데이터와 정확히 조인하기 어렵다. 이벤트 주기로 생성된 데이터라 상시 갱신을 전제로 해석하지 않는다.
