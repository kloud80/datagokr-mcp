description_portal: 정품 콘텐츠와 불법 복제물을 소비자가 명확히 구분하기 어려운 경우가 많아, 의도치 않게 불법 콘텐츠를 구매하거나 이용하면서 소송 등 법적 피해로 이어지는 사례가 증가하고 있습니다. 이러한 피해를 예방하고 소비자를 보호하기 위해 문화체육관광부에서는 정품 콘텐츠만을 판매·유통·서비스하는 신뢰할 수 있는 업체를 ‘저작권OK업체’로 지정하고 있습니다. 저작권OK업체는 온·오프라인에서 정품 콘텐츠를 안심하고 구매할 수 있도록 정부가 인증한 곳으로, 소비자가 안전하게 콘텐츠를 이용하고 권리를 침해받지 않도록 지원하는 제도입니다.
