summary_user: 전국 관광숙박시설의 업체 수와 객실 수를 업종(구분)·등급·분류별로 나누고 17개 시·도를 열로 펼친 집계표로, 2002바이트 남짓의 작은 CSV 파일 한 건입니다. 정책 담당자나 연구자가 '어느 시·도에 5성급 호텔 객실이 가장 많은가'처럼 지역별 관광숙박 인프라 분포를 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 시·도 이름을 행정구역 코드에 직접 매핑해야 다른 지역 통계와 이어 쓸 수 있다.
description_portal: 문화체육관광부에서 제공하는 전국 관광숙박시설 현황자료로, 관광숙박업체 수 및 객실수를 제공합니다.(2025년 4분기, 지자체 제출자료 기준)동 자료는 전국의 관광숙박시설 현황을 지역, 업종, 등급별로 정리하였으며, 각 광역지자체(시· 도)별 관광숙박업체 수 및 객실 수 현황을 파악할 수 있습니다. 이를 통해 지역별 관광숙박 인프라 현황 분석, 지역별 숙박시설 분포 비교, 정책 수립 등 다양한 분야에서 활용할 수 있습니다. 또한 관광·숙박 업계 종사자, 연구자, 정책 담당자에게 실질적인 정보를 제공합니다.
