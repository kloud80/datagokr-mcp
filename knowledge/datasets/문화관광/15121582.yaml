description_portal: 본 데이터는 경기도 광주시립도서관 홈페이지의 그룹 분류 정보를 제공합니다. 중앙도서관, 오포도서관, 곤지암도서관 등 광주시 내 각 도서관 시설을 그룹으로 구분하여 관리하는 정보를 담고 있습니다. 그룹번호는 각 도서관을 식별하는 고유 번호이며, 그룹명은 도서관의 명칭을 나타냅니다. 사용 여부는 현재 운영 중인 도서관을 표시하고, 등록날짜와 수정날짜는 정보의 생성 및 변경 이력을 기록합니다. 삭제날짜와 삭제 여부는 운영 종료된 시설의 이력 관리에 활용됩니다. 본 데이터는 도서관 홈페이지 구조 관리, 지역별 도서관 정보 제공, 시설별 콘텐츠 분류, 통합 도서관 시스템 운영 등에 활용됩니다.
