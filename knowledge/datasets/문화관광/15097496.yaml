summary_user: 제주 이중섭거리 한 곳에 대해 코스 개요, 위치·주소, 주차장·화장실 같은 편의시설, 휴관일·관람료 등 무장애 여행 안내 항목을 구분·유형·추천여부·비고 형태로 담은 소규모 안내 자료다. 휠체어 이용자·노약자·유모차 동반 가족이 이중섭거리에 가기 전에 주차와 화장실을 이용할 수 있는지, 접근이 편한지를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 TourAPI 관광지 정보 등과는 장소명으로 매핑해 이어 쓴다.
description_portal: '제주특별자치도 내 이중섭거리_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도_이중섭거리_무장애여행관광정보」 로, 제주특별자치도 디지털혁신과에서 제공한 무장애 관광 안내 자료이다. 이중섭거리에 대해 코스 개요, 위치 및 주소, 주차장과 화장실 등의 편의시설 현황, 휴관일 및 관람료 등의 운영 정보, 사진 이미지 자료 등이 포함되어 있다. 해당 자료는 장애인, 노약자, 가족 단위 여행객 등이 사전에 여행 경로 및 시설 접근성 등을 확인할 수 있도록 한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
