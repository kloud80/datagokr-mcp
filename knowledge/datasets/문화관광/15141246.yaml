summary_user: 서울 금천구의 종합체육시설업 인허가를 사업장 한 곳당 한 행으로 담은 건별 명부로, 인허가일자·취소일자, 영업상태와 상세상태, 폐업·휴업 일자, 사업장명·전화·지번/도로명 주소, 좌표(X, Y)를 포함한다. 금천구에서 지금 영업 중인 종합체육시설이 어디에 있는지, 최근 개업·폐업한 곳이 있는지 확인하려는 주민이나 상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구의 같은 인허가 데이터나 상권 데이터와는 관리번호(MGTNO)·자치단체코드, 사업장명·주소를 맞춰 이어 쓴다.
description_portal: 종합체육시설업의 인허가 정보를 체계적으로 제공하는 데이터입니다. 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등 기본 항목은 물론 시설 면적, 업종 구분, 위치 좌표 등 다양한 세부 정보가 포함되어 있습니다. 이를 통해 지역 내 종합체육시설의 분포와 운영 현황을 명확히 파악할 수 있으며, 시설 이용 현황 분석이나 신규 시설 입지 선정, 정책 수립, 체육 인프라 확충 등 다양한 분야에서 활용할 수 있습니다. 또한 공간 분석이 가능하여 지역별 체육시설의 균형 배치나 효율적인 자원 관리에도 기여할 수 있으며, 생활체육 활성화, 공공서비스 제공, 연구 및 행정 업무 지원 등에도 유용한 기초 자료가 됩니다. 공공기관, 연구자, 체육 관련 종사자뿐만 아니라 일반 시민에게도 실질적인 도움이 되는 중요한 공공 데이터입니다.
