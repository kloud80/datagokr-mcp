description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다.* 제주동문시장은 제주시 관덕로 인근에 위치한 제주에서 가장 규모가 크고 오래된 상설 재래시장으로, 신선한 해산물·제주 특산품·기념품·의류·먹거리 등을 판매하며 현지 주민과 관광객 모두에게 활발히 이용되는 전통시장이다. 이 데이터셋은 시장의 위치 정보, 명칭, 상세 장소 설명뿐 아니라 장애인 전용 주차구역, 장애인 화장실, 휠체어 대여 또는 접근로, 단차 제거 등 무장애(Accessibility) 편의시설 정보가 포함되어 있다. 이로써 장애인, 고령자, 유아 동반 가족, 교통약자 등이 보다 편리하게 시장을 이용할 수 있으며, 관광 안내 콘텐츠 제작, 무장애 관광지 홍보, 지도 서비스 구축, 열린관광지 정책 수립 등 공공 및 관광 분야에서 활용 가능한 기초 자료로서 의미를 가진다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
