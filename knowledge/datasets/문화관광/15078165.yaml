summary_user: 부산시립미술관의 월별 이용객 수를 연도·월 단위로 집계한 파일로, 포털 설명상 2011년부터 2025년 6월까지를 담는다. 문화정책 담당자나 연구자가 '코로나19 휴관이나 2024년 리노베이션 전후로 미술관 관람객이 어떻게 달라졌나'를 볼 때 쓴다. 실측 컬럼(연도, 월, 관람객 수)에 전역 조인 키가 없어, 다른 미술관·문화시설 데이터와는 시설 이름이나 연월을 맞춰 나란히 놓고 비교하는 방식으로만 잇는다.
limits: 단일 시설의 월 합계만 있어 연령·내외국인 같은 관람객 구분이나 전시별 관람 인원은 알 수 없고, 문화시설 코드·좌표가 없어 다른 시설 데이터와 키로 결합할 수 없다. 포털 설명에 따르면 코로나19 장기 휴관 기간 일부 값이 비어 있고, 2024년부터는 집계 대상이 본관과 이우환공간에서 이우환공간만으로 줄어 그 전후 수치를 그대로 비교하면 안 된다.
