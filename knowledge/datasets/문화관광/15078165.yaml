description_portal: '본 데이터는 2011년부터  2025년 6월까지 부산광역시립미술관을 이용한 이용객 수 현황입니다.데이터 항목: 년도, 월, 이용객 수 현황* 이용객 집계 대상: 일반, 청소년, 어린이, 경로, 외국인 등 부산광역시립미술관 이용객 일체* 개관일: 화~금(10:00~18:00), 월요일 휴관* 이용객 수 현황 중 일부는 코로나 19 등에 의한 장기 휴관으로 미제공됨을 알려드립니다.* 2024년부터 부산광역시립미술관 리노베이션으로 인하여 부산광역시립미술관 이용객 대상이 미술관 본관 및 이우환공간(전관)에서 이우환공간으로 축소되었습니다.데이터에 관한 추가적인 문의는 부산광역시립미술관 김지현(051-740-4262)으로 연락주시면, 성심껏 안내해 드리겠습니다.'
