summary_user: 서울 중랑구의 태권도·검도 등 체육도장업 업소를 인허가 건별로 담은 명부로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·좌표(중부원점TM) 등을 포함한다. 동네 체육도장의 개업·폐업 흐름을 보거나 특정 지역에 영업 중인 도장을 찾는 등 상권·생활체육 분석에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매핑이나 같은 기관(자치단체) 코드(OPNSFTEAMCODE)로만 이어 붙인다.
description_portal: '서울특별시 중랑구의 태권도, 검도 등 신체 및 정신을 단련시키는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
