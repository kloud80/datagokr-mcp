summary_user: 여수시 관광문화홈페이지로 접수된 문화관광해설사 이용 신청을 신청 건별로 담은 원천 파일로, 신청일자·신청번호·등록일자·신청자명·투어구분 항목이 있다. 관광 운영 담당자나 분석가가 "여수에서 어느 시기에 어떤 투어 유형의 해설 신청이 몰리는가"를 보고 해설사 배치나 운영 계획을 검토하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 투어 이름 매핑이나 같은 기관(여수시) 단위로만 이어 쓸 수 있다.
limits: 다른 데이터와 직접 연결할 공통 키(관광지 코드·지역코드 등)가 없어 TourAPI 관광지 정보 등과 자동으로 붙지 않는다. 범위는 여수시 한 곳의 신청 내역뿐이어서 다른 지역과 비교하는 데는 쓸 수 없다.
