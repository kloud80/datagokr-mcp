description_portal: 서울특별시 광진구_실외 운동기구 현황 데이터는 광진구 관내에 설치된 실외 운동기구의 위치와 관리 정보를 제공하는 행정 데이터입니다. 이 데이터는 “운동기구 위치”, “기구 종류”, “담당부서”, “설치현황”, “관리횟수”, “고장여부”, “데이터기준일” 필드로 구성되어 있습니다. ‘운동기구 위치’는 기구가 설치된 정확한 장소를 나타내며, ‘기구 종류’는 각 운동기구의 유형을 제공합니다. ‘담당부서’는 해당 운동기구의 설치 및 유지관리를 담당하는 행정 부서를 명시하고, ‘설치현황’은 기구의 설치 상태를 보여줍니다. 또한 ‘관리횟수’는 해당 기구의 점검 및 관리가 이루어진 횟수를 기록하며, ‘고장여부’는 현재 기구의 정상 작동 여부를 나타냅니다. ‘데이터기준일’은 정보의 최신화 기준일을 명시하며, 이 데이터는 지역 주민의 체육 활동 지원, 공공 편의시설 유지관리, 건강증진 정책 수립 및 실외 운동 인프라 분석의 기초 자료로 활용됩니다.
