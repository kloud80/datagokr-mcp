description_portal: 한국관광공사에서 제공하는 디지털 오디오 관광 해설 서비스인 오디(Odii)에 있는 콘텐츠의 음성, 대본, 사진 정보를 OpenAPI를 통해 무료로 제공합니다. 개방 데이터튼 관광지 기본 정보, 관광지 및 이야기 위치 기반 정보, 관광지 및 이야기 키워드 검색 목록, 정보 동기화 목록 등입니다. 오디(Odii)는 모바일 앱 뿐만 아니라 웹(www.odii.kr)을 통해서도 이용할 수 있는 오디오 가이드 서비스이며, 통합검색 및 위치 기반으로 편리하게 전국 주요 관광지의 이야기를 검색할 수 있습니다. 한국어, 영어, 중국어, 일본어로 다양한 관광지에 담긴 역사와 문화 이야기를 제공하고 있습니다. 제공되는 데이터를 이용해 오디오 가이드 관련 앱, 웹 서비스 개발 등에 활용할 수 있습니다.
