summary_user: 한국관광공사 오디오 가이드 서비스 오디(Odii)의 관광지·이야기 콘텐츠를 건별로 담으며, 제목·주소·좌표(mapX, mapY)·언어·이미지 주소와 생성·수정 시각을 전국 범위에서 제공한다. 여행 앱이나 웹 개발자가 '지금 위치 근처 관광지의 한국어·외국어 음성 해설을 붙이려면 어떤 콘텐츠가 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광 콘텐츠와는 관광지 이름이나 주소·좌표로 맞춰 이어 쓴다.
limits: 6개 오퍼레이션 중 3개(이야기 위치기반 목록, 이야기 검색 목록, 테마 동기화 목록)는 최소 파라미터로 호출했을 때 응답이 없었다. 필수 파라미터인 검색어(keyword)와 언어코드(langCode)는 미리 값을 확보해 넘겨야 한다. 개발계정은 하루 1,000회로 호출이 제한된다.
