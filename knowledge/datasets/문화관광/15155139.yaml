summary_user: 전국 지자체가 관리하는 외국인관광도시민박업 인허가 정보를 업소 단위(사업장명·주소·좌표·영업상태·객실수)로 담는 건별 원천 API이며, 전체 14,913건 중 1,000행을 검증했다. 외국인 관광객 대상 도시 민박이 어느 지역에 몇 곳, 어떤 영업상태로 있는지 확인하려는 분석가나 사업자의 질문에 쓴다. 도로명주소·지번주소·영문상호주소(address 키)로 다른 주소 기반 데이터와 이어 쓰고, 개방자치단체코드는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: '문화_외국인관광도시민박업 데이터는 도시 지역의 주민이 거주하고 있는 주택을 이용하여 외국인 관광객에게 한국의 가정 문화를 체험 할 수 있도록 숙식 등의 서비스를 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 외국인관광도시민박업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광산업진흥과 / 044-203-2835, 2836 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
