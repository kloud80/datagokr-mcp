summary_user: 경기도 내 전통사찰을 사찰 한 곳당 한 행으로 담은 개별 목록으로, 시군·사찰명·인허가일자·영업상태와 함께 도로명·지번 주소, WGS84 좌표, 승려수·신도수, 창립연대·유래연혁, 지정취소 여부와 사유를 포함한다. 관광 서비스 개발자나 연구자가 '우리 시군에 있는 전통사찰은 어디이고 언제 창건됐으며 지금도 지정이 유지되고 있는가'를 확인하고 지도에 표시하는 데 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD) 같은 기관 내부 코드나 사찰명, 주소·좌표 매칭으로 다른 문화재·관광 데이터와 잇는다.
description_portal: 「전통사찰현황」 데이터는 경기도 내 역사적·문화적 가치를 지닌 전통사찰의 현황을 제공하는 자료입니다. 주요 항목에는 시군코드(SIGUN_CD), 시군명(SIGUN_NM), 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 영업상태명(BSN_STATE_NM), 폐업일자(CLSBIZ_DE), 소재지도로명주소(REFINE_ROADNM_ADDR), 소재지지번주소(REFINE_LOTNO_ADDR), 소재지우편번호(REFINE_ZIP_CD), WGS84위도(REFINE_WGS84_LAT), WGS84경도(REFINE_WGS84_LOGT), 승려수(BM_CNT), 신도수(BLER_CNT), 창립연대(FNDTN_SLDRTY_CONT), 유래연혁정보(ORGN_HIST_INFO), 전통사찰명(TRADITN_INVSTGTN_NM)이 포함되어 있습니다. 또한 지정취소 여부, 지정취소일자 및 사유 등 관리 정보도 제공됩니다. 이 데이터는 불교문화재 보존 정책, 관광자원 연구, 종교사회학 분석, 지역축제와의 연계 연구 등에 활용 가능하며, Open API(https://openapi.gg.go.kr/Traditninvstgtn)를 통해 시군별 조건 검색이 가능합니다. 본 자료는 관광문화체육 분야 데이터로 상업적 활용과 가공이 허용되어, 공공기관과 연구기관뿐 아니라 민간 관광 서비스 개발에도 기초자료로 유용합니다.
