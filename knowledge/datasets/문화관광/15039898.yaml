summary_user: 경상남도 도립미술관의 티켓 판매를 결제 건별로 담은 파일로, 결제일시·인원·결제방식·결제금액을 기록하며 유료·무료·할인(그린카드·다누리카드·예술인카드 등)·제로페이 구분이 포함된다. 미술관 운영자나 문화정책 분석가가 "요일·월별로 관람객 수와 매출이 어떻게 변하고, 무료·할인 관람 비중은 얼마인가"를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없고 KOPIS 공연ID·공연장ID 같은 공통 코드도 없어, 다른 데이터와는 기관명이나 날짜(결제일시)를 기준으로 맞춰 이어 써야 한다.
limits: 전역 조인 키가 없어 KOPIS 공연·시설 데이터와 코드로 바로 연결되지 않는다. 명세상 갱신은 연간·이벤트 주기로 되어 있어 일 단위 최신 현황을 기대하기 어렵다. 범위는 경상남도 도립미술관 한 곳의 판매 내역이며 전시별 구분 필드는 없다.
