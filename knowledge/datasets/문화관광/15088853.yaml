summary_user: 경기도 전자책 플랫폼(eBook.gg.go.kr)에 등록된 콘텐츠를 1차·2차 분류별 등록건수와 접근 URL로 묶은 집계 통계로, 도정업무·백서/통계·보고서/단행본·정기간행물·예산서/결산서 같은 분류를 담는다. 경기도 디지털 간행물이 어떤 분류에 얼마나 몰려 있는지, 예를 들어 예산서·결산서나 백서가 몇 건 올라와 있는지를 확인하려는 분석가나 담당자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 분류명 같은 이름을 맞추는 방식으로만 연결한다.
description_portal: 이 데이터는 경기도에서 운영하는 전자책 플랫폼(eBook.gg.go.kr)에 등록된 콘텐츠의 통계 현황으로, 각 자료는 1차 및 2차 분류별 등록건수와 접근 가능한 URL 정보를 포함합니다. 주요 분류는 도정업무, 백서/통계, 보고서/단행본, 정기간행물, 디자인, 학술대회, 공공기관 발간물, 예산서/결산서 등으로 구성되며, 콘텐츠 유형에 따라 구분된 다양한 디지털 간행물의 통계적 분포를 파악할 수 있습니다. 이 데이터는 경기도의 디지털 행정자료 활용도 분석, 공공정보 서비스 개선, 콘텐츠 분류별 수요 예측 및 문화콘텐츠 관리 정책 수립 등에 활용될 수 있습니다.
