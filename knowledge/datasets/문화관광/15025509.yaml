summary_user: 광주시립미술관 문화센터에서 운영하는 강좌를 강좌 한 건씩 담은 파일로, 대상 구분(영아·유아·초등·성인·시니어·특강), 강좌명, 요일·시간, 강사명, 강의시수, 정원과 수강인원, 데이터기준일자를 포함한다(csv 약 3KB의 소규모 파일). 시민이 "아이 연령이나 성인 대상에 맞는 미술관 강좌가 무슨 요일에 열리고 정원이 얼마인가"를 확인하거나, 분석가가 강좌별 정원 대비 수강인원으로 모집률을 보는 데 쓴다. 실측 컬럼에 문화시설코드 같은 전역 조인 키가 없어 다른 문화시설 데이터와는 기관명·시설명으로만 맞춰 이어 쓴다.
limits: 전역 조인 키가 없어 문화기반시설총람의 시설코드나 좌표와 바로 연결되지 않고, 이 미술관 한 곳의 강좌만 담고 있어 지역 간 비교에는 맞지 않는다. 내부 검토에서 보조 등급, 보류(defer) 판정을 받은 데이터다.
