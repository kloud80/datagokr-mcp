description_portal: '서울특별시 서초구 내에서 비디오물감상실업으로 등록된 업소의 기본 정보를 담고 있으며, 해당 업소의 등록일, 주소, 영업 상태 등을 포함합니다. 해당 업종은 과거 비디오 감상실 형태로 존재했으나, 영상 소비 방식의 변화와 스마트폰·OTT 이용률 증가로 인해 그 수가 점차 줄어들고 있습니다. 하지만 여전히 일부 지역에서는 소규모 영상감상 수요, 시니어 대상 감상공간, 특화 콘텐츠 상영 등으로 존재 가치가 남아 있으며, 도시 내 다양한 생활문화 공간으로 전환 가능성이 존재합니다. 이 데이터는 감상실의 위생상태, 시설 안전, 성인물 차단, 청소년 보호 등 공공 안전정책과도 연결되며, 유휴공간 전환, 커뮤니티 문화시설 전환 정책의 대상 선정을 위한 기초자료로 활용될 수 있습니다. 또한 감상실 업종의 등록 추이 및 변화 분석을 통해, 도시문화 변화 흐름을 읽고 생활 기반 문화시설 정책 수립의 디딤돌로 삼을 수 있는 행정 자료입니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
