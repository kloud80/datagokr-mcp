summary_user: 안산시 행정자료 도서관에서 관리하는 도서의 대출·반납 이력을 대출 건별로 담은 원천 파일(CSV, 약 1MB)로, 도서 고유번호·바코드와 대여일·반납예정일·실제 반납일·연장횟수를 기록한다. 도서관 운영 담당자나 분석가가 "대출 도서 중 반납예정일을 넘겨 반납된 비율은 얼마이고, 연장은 몇 번까지 하는가"처럼 연체·연장 패턴과 장서 회전율을 따져볼 때 쓴다. 실측 컬럼에 ISBN·도서관코드 같은 전역 조인 키가 없어 도서관정보나루 등 다른 도서 데이터와는 바로 붙지 않고, 같은 기관 자료 안에서 바코드·고유번호로만 연결한다.
limits: ISBN·서명 같은 서지 정보가 없어 어떤 책이 많이 빌려졌는지는 알 수 없고, 다른 도서관 데이터와 키로 결합할 수 없다. 안산시 한 기관 범위의 자료라 지역 간 비교에는 쓰지 못한다.
