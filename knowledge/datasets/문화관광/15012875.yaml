description_portal: '본 데이터는 2016년도부터 제공된 데이터로 연도별 한국도박문제예방치유원에서 제공한 치유재활업무 실적현황 데이터입니다.데이터의 구성은 치유재활 서비스 모든 영역에서 제공된 서비스 실적으로 사례관리, 집단상담, 프로그램, 지역사회 연계사업, 인적자원 관리, 직원 교육 영역으로 구성되어 있습니다.*사례관리: 치유재활서비스 접수단계부터 사정평가까지 모든 단계별 서비스 이용 실적 현황*집단상담: 치유재활 서비스 중 집단상담 이용자 현황*프로그램: 치유재활 서비스 중 프로그램 이용자 현황*지역사회 연계사업: 지역사회로부터 연계받은 실적 현황*인적자원관리: 자원봉사 및 실습수련생 관리 인원 현황 *직원교육: 직원역량 강화를 위한 교육 건 수*자료출처: 한국도박문제예방치유원 치유재활서비스 실적 통계'
