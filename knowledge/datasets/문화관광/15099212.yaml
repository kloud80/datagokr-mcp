description_portal: 서울시 관리 공공 미술 목록 데이터는 서울시가 관리하는 공공 미술 작품의 현황을 파악하기 위한 정보입니다. 관리명은 공공미술 사업이나 관리 유형을 구분하는 항목이며, 작품명은 실제 설치된 미술 작품의 이름을 나타냅니다. 작품주소는 작품이 설치된 정확한 위치 정보를 제공하여 시민들이 현장을 방문하거나 지도 서비스에 연계해 활용할 수 있도록 합니다. 설치년도는 작품이 언제 조성·설치되었는지를 보여주어 시기별 공공미술 정책·추세를 분석하는 데 유용합니다. 관리기관 항목은 각 작품을 담당하는 부서를 나타내어 유지보수, 문의, 정책 담당 주체를 명확히 파악할 수 있게 해주는 행정·문화 데이터입니다.
