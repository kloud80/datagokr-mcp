summary_user: 전국 종합·일반·기타 유원시설업(테마파크업) 영업소를 한 곳당 한 행으로 담은 CSV 파일로, 영업소명·업종 종류·주소·우편번호·영업 상태와 허가 또는 신고일자, 기타유원시설업의 안전교육 수료일을 싣는다. 우리 지역에 어떤 놀이시설 업체가 운영 중이거나 휴업 중인지, 기타유원시설업체가 안전교육을 받았는지 확인하려는 국민·지자체 담당자·관광산업 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 영업소명이나 주소·우편번호를 맞춰 이어 써야 한다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 국내 종합, 일반, 기타 테마파크업(유원시설업) 영업소 데이터입니다. 본 업소들은 정상운영 및 휴업중인 영업소이며, 영업소명, 유원시설업종류, 주소, 우편번호,  허가 및 신고일자, 일부 안전교육 수료정보(2020년 5월 이후, 기타유원시설업 한정)을 제공합니다. 본 데이터는 CSV파일로 제공되며 가변문자형 데이터입니다. 데이터파일 업데이트 일자 이후의 내용은 포함하고 있지 않습니다. 테마파크 안전정보망 홈페이지에서도 같은 내용을 열람할 수 있습니다.
