summary_user: 경기도 내 비디오물 제작·복제업 사업장의 인허가 현황을 사업장 단위로 담으며, 업체명, 인허가·폐업일자, 영업상태, 제작취급품목, 도로명·지번 주소와 WGS84 위경도 좌표를 포함한다. 영상콘텐츠 산업 분석가나 지자체 담당자가 "경기도 어느 시군에 현재 영업 중인 비디오물 제작업체가 몰려 있고, 주로 어떤 품목을 만드는가" 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았다. 따라서 다른 데이터와는 시군 코드(SIGUN_CD)·주소·업체명 매칭이나 위경도 좌표 기반 공간 결합으로 이어 쓴다.
description_portal: 이 데이터는 경기도 내 비디오물 제작 또는 복제업을 영위하는 사업장의 인허가 현황을 수록한 자료로, 각 업체의 명칭, 인허가일자, 현재 영업상태와 더불어 사업장 소재지 및 제작취급품목 등의 정보를 포함합니다. 특히 ‘제작취급품목내용’ 항목은 각 업체가 어떤 종류의 비디오물을 제작하거나 복제하는지를 확인할 수 있게 해주며, 미디어 및 콘텐츠 산업의 업종 세분화 및 특성 분석에 활용될 수 있습니다. 도로명주소, 지번주소, 우편번호, WGS84 위경도 좌표 등 위치 기반 정보도 포함되어 있습니다. 본 데이터는 영상콘텐츠 산업 현황 파악, 지역 내 제작업 기반 시설 조사, 행정적 인허가 모니터링, 미디어산업 클러스터 분석 등에 유용하게 사용될 수 있습니다.
