summary_user: 경상북도교육청 구미도서관의 일반자료실과 어린이자료실에서 한 달 동안 가장 많이 대출된 도서 300권을 순위·서명·저자·청구기호·출판사·출판년·자료실·대출횟수와 함께 담은 월별 집계 목록이다. 지역 학부모나 독서 지도 교사가 '이번 달 구미도서관 어린이자료실에서 가장 많이 빌린 책은 무엇인가'를 확인하거나, 분석가가 일반·어린이 이용자의 대출 선호를 비교하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서관 인기 도서 자료와는 서명·저자 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 경상북도교육청 구미도서관의 자료실(일반자료실, 어린이자료실)에서 한 달 동안 대출된 도서의 목록을 제공하며 이 목록은 일반자료실과 어린이 자료실 이용자가 한 달 동안 제일 많이 대출한 도서이며(최다 대출 도서), 일반 도서와 어린이 도서를 합친 총 300권에 대한 목록입니다. 이 300권에 대한 도서정보인 도서의 대출 순위, 도서의 등록번호, 도서 제목(서명), 저자 이름(지은이), 도서관 청구기호, 출판사, 출판년, 소장처(구미도서관), 자료실(일반자료실, 어린이자료실), 도서의 대출횟수 등을 제공합니다.
