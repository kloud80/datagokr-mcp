summary_user: 국립민속박물관이 수행한 현장조사 결과 자원을 건별로 담으며, 자원 명칭(title), 책임자, 등록일, 소속 DB, 주제 분류·주제어, 크기·재생시간, 내용, 관련 장소·시간대·인물, 권리 정보를 기록한다. 연구자나 교육자가 특정 지역이나 주제의 민속 현장조사 기록이 있는지, 언제 누가 조사했는지를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 장소명(spatialCoverage)·주제어 같은 이름 매핑이나 같은 기관 코드로만 이어 쓴다.
description_portal: 국립민속박물관에서 수행한 다양한 현장조사 결과를 체계적으로 정리한 데이터베이스로, 자원의 명칭, 주된 책임자, 등록일, 소속 DB, 기관별 주제 분류, 핵심 주제어, 자원의 크기나 재생시간, 내용, 관련 장소, 해당 시간대, 관련 인물, 언어, 참조 자원 제목, 권리 및 저작권 정보, 기여자 등 폭넓은 정보를 포함하고 있습니다. 민속자료의 체계적 보존과 연구, 교육, 전시, 문화유산 정책 수립 등 다양한 분야에서 활용할 수 있으며, 민속문화의 이해와 전승, 지역사회 연구, 문화콘텐츠 개발 등에도 유용하게 쓰입니다. 연구자, 교육자, 일반 국민 모두가 민속자료에 쉽게 접근하여 활용할 수 있도록 구성되어 있습니다.
