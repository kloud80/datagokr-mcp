summary_user: 인천광역시 부평구에 등록(신고)된 청소년게임제공업 영업소를 업소 한 곳당 한 행으로 담은 파일(csv 약 5KB)로, 등록일자·상호·도로명/지번 주소를 담는다. 구청 담당자나 주민이 '우리 동네에 등록된 청소년 이용 가능 게임장이 어디 있고 언제 등록됐나'를 확인하거나 지도 점검 대상을 정리할 때 쓴다. 전역 조인 키는 없어 주소를 지오코딩하거나 상호·주소 문자열로 다른 시군구 게임업소 현황이나 인허가 자료와 맞춰 이어 쓴다.
description_portal: '부평구 내 청소년 이용 가능 게임시설의 등록일자, 상호, 위치 등을 정리한 자료청소년 대상 아케이드 게임 제공시설로, 시설 현황 파악, 민원 대응, 지도 점검 등에 활용 가능본 데이터는 다음과 같은 목적으로 활용 가능– 청소년게임제공업 등록업소 분포 및 운영 현황 파악– 청소년 보호 및 게임시설 관리 행정자료 활용– 영업소 위치 정보 제공 및 지도 기반 점검 대상 정리– 관련 민원 대응 및 불법영업 예방 기반자료 활용주요 항목 설명● 연번: 데이터 항목의 일련번호● 등록(신고)일자: 해당 업소의 행정 등록 또는 신고 완료일● 상호: 등록된 영업소의 정식 상호명● 영업소소재지(도로명): 도로명 주소 기준의 영업소 위치● 영업소소재지(지번): 지번 기준의 영업소 위치'
