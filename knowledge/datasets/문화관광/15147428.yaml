summary_user: 서울 강북구의 태권도·검도 같은 체육도장업 인허가 업소를 한 곳씩 담은 건별 명부로, 영업 중인 곳과 폐업한 곳을 모두 포함하며 인허가일·폐업일, 영업상태, 주소, 중부원점TM 좌표(X·Y), 지도자 수·건물 면적 같은 항목을 담는다. 학부모나 창업 예정자가 "강북구 우리 동네에 영업 중인 태권도장은 어디이고, 최근 몇 곳이 문을 닫았나"를 확인하거나, 분석가가 체육도장 개폐업을 상권 신호로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하며, 헬스장·당구장 등 다른 체육시설업 인허가 명부와 같은 축으로 묶어 쓴다.
description_portal: '서울특별시 강북구 체육도장업 인허가 정보 데이터는 강북구의 태권도, 검도 등 신체 및 정신을 단련시키는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
