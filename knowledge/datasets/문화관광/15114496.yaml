summary_user: 경주시 관내 국가지정 국보를 문화재 한 건씩 담은 영상이미지 목록으로, 이미지 파일명·이미지명과 주소, 위도·경도 등 개별 위치정보를 함께 수록한다. 여행 앱이나 관광 홍보 서비스를 만드는 개발자가 경주의 국보별 사진과 지도 위치를 화면에 함께 띄우는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, 문화재 이름(CON_TITLE)으로 맞추거나 좌표·주소로 공간 결합하거나 같은 경주시 관광자원 API끼리 연결해 쓴다.
description_portal: 본 오픈API는 경주시 관내 국가지정 국보에 해당하는 문화재의 영상이미지 정보를 REST 및 JSON 방식으로 제공한다. 각 문화재별로 파일명, 이미지 URL, 주소, 위도·경도 등의 위치정보가 구조화되어 수록되어 있다. 이를 통하여 외부 시스템 및 모바일 애플리케이션에서 경주 국보의 시각 콘텐츠를 연계 조회할 수 있으며, 관광객 및 시민의 문화재 정보 접근성을 강화한다. 또한 본 데이터는 관광문화 홍보 및 여행 플랫폼 연동, 향후 AI 기반 문화유산 서비스 개발을 위한 기초 자료로 활용 가능하다. 구조가 명확하고 표준 포맷을 갖추어 개발자 및 일반 사용자 모두 쉽게 활용이 가능하며, 공공데이터포털을 통해 무료로 접근·조회할 수 있다는 특징이 있다.
