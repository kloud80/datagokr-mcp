summary_user: 전북특별자치도에서 한국관광공사 우수숙박시설(굿스테이)로 지정된 업소를 한 행에 한 곳씩 담은 파일로, 업종·업소명·시군구·주소·총객실수·주차 가능 대수·결제방법·부대시설을 담는다(CSV 약 6KB 규모). 여행객이 '전주나 군산에서 주차가 되는 인증 숙소가 어디인가'를 찾거나, 분석가가 전북 시군별 인증 숙박업소의 분포와 객실 규모를 살피는 데 쓴다. 전역 조인 키가 없어 업소명·주소를 기준으로 숙박업 인허가(공중위생 신고) 자료나 관광 콘텐츠 데이터와 맞춰 이어 써야 한다.
