summary_user: 남원큰엉해안경승지 한 곳의 무장애여행 지점 정보를 지점별 행으로 담은 원천 데이터이며, 실측 필드는 아이디·위도·경도·해발고도이다. 휠체어 이용자나 고령자 동반 여행자가 이 경승지 안의 무장애 동선 위치를 지도에 표시하거나, 관광 안내 서비스 개발자가 열린관광지 경로를 구성할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 관광지 이름 매칭이나 위도·경도 좌표 근접으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 남원큰엉해안경승지 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 이 데이터셋은 남원큰엉해안경승지의 무장애 관광 정보를 담고 있으며, 위치 좌표, 관광지 명칭, 장소 설명, 이미지 자료 등으로 구성된다. 남원큰엉해안경승지는 바다를 향한 30m 높이의 기암절벽과 잔디가 깔린 평지, 약 970 m 해안 산책길을 포함한 해안 경승지로, 바다 절경과 기암괴석, 숲길이 어우러진 자연 경관을 제공한다. 데이터는 휠체어 접근로, 장애인 화장실 등의 무장애 편의시설 여부와, 주차장 정보, 접근 노면 상태 등을 포함하여 관광약자, 고령자, 유아 동반 가족 등 누구나 이용 가능한 열린관광지 조성, 관광 안내, 지도 서비스, 관광 정책 수립, 관광 콘텐츠 제작 등의 공공 및 관광 분야 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
