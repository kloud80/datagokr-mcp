summary_user: 경상남도 무형문화재 전수교육관 현황을 시설 한 곳당 한 행으로 담으며, 명칭·도로명주소·위경도 좌표·시군구와 함께 상주 단체(residentGroup), 건립 사업비, 대지·연면적, 규모, 준공일 같은 시설 정보를 싣는다. 경남에서 특정 무형문화재를 전수받거나 체험하려는 사람이 가까운 전수교육관과 그곳에 입주한 보존회를 찾을 때 쓰고, 분석가는 시군별 전승 시설 분포와 시설 규모를 비교할 때 쓴다. 전역 조인 키가 없어 다른 무형유산 데이터와는 상주 단체 이름이나 시군구명을 매핑해 잇고, 위치 기반 분석에는 주소·좌표를 지도와 겹쳐 쓴다.
limits: 무형문화재 지정번호나 기관 코드 같은 공통 키가 없어 보유자·종목 데이터와 바로 결합되지 않고 이름 매칭이 필요하다. 범위는 경상남도 한 곳뿐이라 다른 시도와의 비교에는 별도 자료가 필요하다.
