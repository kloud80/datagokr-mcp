description_portal: 이 데이터는 서울특별시 광진구 관내에서 시내순환관광업 인허가를 받아 운영 중인 업체에 대한 현황 정보를 제공합니다. 시내순환관광업은 관광버스를 활용하여 관광객에게 광진구 및 인근 지역의 주요 관광지를 정기적으로 순회 운행하며 관광 서비스를 제공하는 업종입니다. 각 업체에 대한 명칭, 주소, 업종 유형, 인허가 정보 등이 포함되어 있으며, 관광 인프라 현황 파악 및 교통연계형 관광 서비스 분석에 활용될 수 있습니다. 위치정보는 중부원점TM(EPSG:2097) 좌표계를 기준으로 제공되며, 위도·경도(WGS84)는 포함되지 않아 좌표 변환이 필요한 점에 유의해야 합니다. 데이터는 3일 전 기준으로 갱신된 최신 자료이며, 행정기관의 관광업 관리, 지역관광 정책 수립, 대중교통 연계형 관광 상품 개발 등에 유용한 기초 자료입니다.
