summary_user: 충청남도 보령시 관내 공공체육시설을 시설 한 곳당 한 행으로 담은 소규모 CSV 파일(약 1.3KB)로, 시설명·지번/도로명 주소·위도·경도·전화번호·휴관일과 하절기·동절기별 평일·토요일공휴일 이용시간을 담는다. 보령시 주민이나 방문객이 '근처 공공체육시설이 어디에 있고, 이번 계절 주말에는 몇 시까지 여는가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명이나 주소·좌표로 맞춰 잇는다. 예를 들어 문체부 전국체육시설 데이터나 같은 보령시의 다른 데이터와 이렇게 연결한다.
description_portal: 국민들의 건강 증진과 삶의 질 향상에 대한 관심이 높아지면서, 생활체육 활성화와 체육활동 참여 기회 확대를 위한 공공체육시설의 역할이 중요해지고 있습니다. 고령화 사회 진입과 함께 건강한 노후생활을 위한 체육활동 참여 수요가 증가하고 있으며, 체육시설의 설치 및 이용에 관한 법률에 따른 적정한 공공체육시설 운영과 시민 서비스 향상이 요구되고 있습니다. 지역 주민들의 체육시설 접근성 향상과 다양한 연령층이 이용할 수 있는 맞춤형 체육 프로그램 제공을 위한 시설 운영 개선이 필요하며, 코로나19 이후 건강 관리에 대한 관심 증대로 공공체육시설의 안전하고 쾌적한 이용 환경 조성이 중요해지고 있습니다. 또한 체육시설 운영의 투명성 확보와 시민들의 정보 접근성 향상을 위한 상세한 시설 정보 제공이 필요하며, 체육정책 수립과 시설 운영 효율화를 위한 이용 현황 분석과 개선 방안 모색이 요구되고 있어, 충청남도 보령시는 관내 공공체육시설의 위치, 연락처, 휴관일, 계절별 이용시간 등 시민들의 체육활동 참여와 건강 증진에 필요한 종합적인 공공체육시설 현황 정보를 제공하고 있습니다. 보다 자세한 내용과 시설 예약 등은 보령시 공공체육시설 누리집(https://www.brcn.go.kr/sport/fmcs/1)에서 이용하실 수 있습니다.
