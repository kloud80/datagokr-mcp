summary_user: 경주시 관내 음식점을 메뉴(음식 종류) 분류별로 묶어 음식점 한 곳당 한 건씩 이름·주소·위경도·연락처·영업시간·주차 여부·설명을 담은 건별 목록으로, 범위는 경주시 한 곳이며 위치는 주소와 좌표로 개별 표시된다. 경주 여행 앱이나 맛집 안내 서비스를 만드는 사업자가 '경주에서 한식·향토음식을 파는 집은 어디이고 주차가 되나' 같은 질문에 답할 때 쓴다. 전역 조인 키는 없어 TourAPI 음식점 콘텐츠 등 다른 데이터와는 음식점 이름·주소 매칭이나 위경도 근접으로 이어 쓰고, 분류 정보는 이 API 안의 분류명·메뉴명으로만 해석한다.
limits: TourAPI contentId나 사업자·인허가 번호 같은 공통 키가 없어 다른 데이터와 정확히 1:1로 묶기 어렵고, 이름·주소 매핑에 의존해야 한다. 경주시 한 곳만 다루므로 다른 지역 비교에는 쓸 수 없고, 개발계정은 하루 10,000회로 호출이 제한된다.
