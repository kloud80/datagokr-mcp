summary_user: 경기도 31개 시군의 썰매장업 인허가 사업장을 한 곳씩 담은 건별 명부로, 사업장명·인허가일자·영업상태·폐업일자·공사립 구분·도로명/지번 주소·WGS84 좌표 등을 포함한다. 겨울철 가족 나들이를 계획하는 시민이 집 근처에서 지금 영업 중인 눈썰매장을 찾거나, 분석가가 시군별 썰매장 개폐업 추이를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·주소·좌표나 사업장명 매핑으로 이어 써야 하며, 같은 기관의 다른 체육시설업 명부와 같은 축으로 묶어 보는 것이 자연스럽다.
description_portal: 경기도 내 썰매장 업체 현황입니다. 눈 위에서 썰매나 그 비슷한 기구를 이용하여 눈썰매 놀이를 할 수 있도록 시설을 갖춘 썰매장 업체(소)의 정보를 제공합니다.※ 경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내 등록된 썰매장 운영 사업장에 대한 정보를 담고 있으며, 썰매장의 명칭, 위치, 인허가일자, 폐업일자, 전화번호, 영업상태, 도로명 주소, 위경도 좌표, 운영구분(공사립) 등의 항목으로 구성되어 있습니다. 주요 항목에는 시군명, 사업장명, 인허가일자, 영업상태명, 폐업일자, WGS84 위도·경도, 공사립구분명, 문화체육업종명(썰매장업) 등이 포함되며, 이를 통해 해당 지역 겨울철 여가시설 현황 및 운영 실태를 확인할 수 있습니다. 데이터는 지역별 체육문화 인프라 분포 분석, 폐업 현황 파악을 통한 정책 조정, 겨울 관광 활성화를 위한 자료로 활용 가능하며, 공간 좌표 정보는 위치 기반 시설 접근성 분석 등에도 유용하게 사용됩니다.
