description_portal: '한국영상자료원이 운영하는 한국영화데이터베이스 KMDb 내 영화 리스트를 기반으로 추출한 데이터입니다.해당 데이터는 영화별로 한국영상자료원  한국영화100선, 사이트&사운드, 인디와이어 등 국내외 영화 리스트에 선정된 횟수를 집계한 자료로이용자들이 본인이 관람한 영화로 선정한 횟수도 별도의 필드로 제공합니다.한국영화100선 등 일부 리스트의 경우, 전체 리스트 외에도  선정위원별 선정 내역을 각각 기록하여 횟수에 큰 영향을 미치는 점 양해 바랍니다.총 3,712개의 영화 작품을 대상으로 아래와 같은 필드로 데이터를 제공합니다- 영화작품관리번호, 영화제목, 감독명, 제작년도, 리스트선정횟수, 선정된리스트명, 이용자선택횟수각 리스트 및 선정작에 대한 세부 정보는 아래 한국영화데이터베이스 KMDb의 리스트 상세정보 참고 바랍니다.- url : https://www.kmdb.or.kr/db/list?menuIndex=6'
