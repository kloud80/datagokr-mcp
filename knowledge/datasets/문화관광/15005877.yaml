summary_user: 국립소록도병원 한센병박물관이 소장한 한센병·소록도 역사 자료를 생활자료·행정자료·의학자료 세 분야로 나눈 건별 소장품 목록으로, 자료마다 관리번호·자료명·재질·크기·시대·소장경위를 담는다(CSV 파일, 약 87KB). 연구자나 교육·전시 기획자가 '소록도에서 직접 만들어 쓴 한센병 치료 기구에는 어떤 것이 있고 어느 시대 것인가'를 확인할 때 쓴다. 다른 데이터와 공통으로 쓰는 조인 키가 없어서, 다른 박물관 소장품 목록과는 자료명이나 시대를 직접 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 국립소록도병원 한센병박물관이 보유하고 있는 한센병 및 소록도 역사 관련 박물관 자료로 생활자료, 행정자료, 의학자료 세 분야에 대한 목록을 제공합니다. 생활자료는 소록도 한센인들이 실제 사용한 용품들 중 소록도의 특성을 잘 드러내주는 자료들입니다. 행정자료는 병원을 운영하면서 생산한 문서 중 보존가치가 있는 자료로 영구보존하여 관리하기 위함이며, 의학자료는 한센병 치료에 필요한 기구들로 기성품과 함께 소록도에서 필요에 의해 직접 제작하여 사용한 기구들이 포함되어 있습니다.
