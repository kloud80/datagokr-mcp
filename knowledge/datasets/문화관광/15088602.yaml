summary_user: 공공누리시스템에서 우수저작물로 선정된 공공저작물 중 문서 유형을 저작물 한 건당 한 행으로 담은 전국 단위 파일(CSV, 약 1.2MB)로, 저작물명·본문내용·적용일·분류·형태·URL·키워드·조회수 등을 포함한다. 창작자나 서비스 개발자가 '자유롭게 가져다 쓸 수 있는 공공 문서 저작물 중 어떤 주제의 것이 많이 조회되는가'를 찾거나 문서 저작물 현황을 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 저작물명·분류명 매핑이나 같은 기관의 저작물코드·분류코드로만 연결하며, 한국문화정보원의 다른 유형(이미지·영상 등) 우수저작물 목록과 같은 코드 체계로 나란히 보는 정도로 쓴다.
description_portal: 공공누리시스템에서 선정한 우수저작물 중 문서 유형의 저작물 정보를 체계적으로 제공하는 데이터셋입니다. 저작물코드, 저작물명, 본문내용, 적용일, 분류코드, 분류명, 형태명, 형태코드, 저작물URL, 썸네일파일경로, 공개여부, 조회수, 키워드명, 게시판코드, 게시판명 등 다양한 항목을 포함하고 있어 문서 저작물의 관리와 활용에 적합합니다. 공공저작물의 개방 및 활용 촉진, 저작권 정책 수립, 문화산업 연구, 데이터 기반 서비스 개발 등 다양한 분야에서 활용할 수 있습니다. 또한 문서 저작물의 현황 분석과 공공문화자원의 효율적 이용에 기여하며, 연구자와 정책 담당자, 창작자 등에게 실질적인 정보를 제공합니다.
