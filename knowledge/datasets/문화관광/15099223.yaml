description_portal: 본 데이터는 강원특별자치도 속초시에서 추진한 공공미술 프로젝트 현황 정보를 제공하는 자료이다. 시민과 방문객이 지역 내 공공미술 사업과 예술작품 정보를 쉽게 확인할 수 있도록 사업명, 작품명, 설치 위치, 조성 내용 등 관련 정보를 정리하여 개방한다. 지역 문화예술 진흥과 도시경관 개선을 목적으로 구축된 자료이며, 공공미술 정책 현황 파악과 문화예술 분야 연구 및 관광정보 활용에 참고자료로 활용할 수 있다. 또한 시민의 문화 향유 기회를 확대하고 지역 문화자원의 활용 기반을 높이고자 한다. 데이터는 속초시 공공미술 프로젝트 추진 현황을 기준으로 관리하며 관련 변동 사항을 반영하여 현행화한다. 이용자는 해당 정보를 통해 지역 내 공공미술 조성 현황과 문화예술 사업 정보를 확인할 수 있다.
