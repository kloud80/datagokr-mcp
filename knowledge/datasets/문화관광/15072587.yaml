summary_user: 서울 강남구 소재 의료기관 429곳의 기관명·기관분류(성형외과·안과·치과 등)·주소·홈페이지·의료진·전문분야·보험정보·교통편 등 35개 항목을 러시아어로 정리한 기관 단위 목록 파일이다. 러시아어권 의료관광객이나 이를 안내하는 여행사·통역 서비스가 '강남에서 특정 진료 분야를 보는 병원이 어디이고 어떻게 찾아가나'를 확인하는 데 쓴다. 실측 컬럼에 공통 조인 키가 없어, 다른 데이터와는 기관명·주소를 이름 매칭하는 방식으로만 이어 쓴다.
description_portal: 429개 의료기관에 대한 기관명, 기관분류, 주소, 홈페이지주소, 의료진, 면적, 기관소개, 좌표, 전문분야, 보험정보, 교통편 등 35개 항목에 대한 데이터를 제공합니다.(러시어)각 의료기관의 이름을 러시아어로 기재하여 러시아어 사용권자, 즉 러이사어를 주로 사용하는 외국인들이 기관을 쉽게 식별하고 이해할 수 있도록 구성하였으며, 기관명 옆에는 기관분류(예를 들면 성형외과, 안과, 치과 등 해당 의료기관의 핵심 진료 분야)를 함께 표기하였습니다. 이러한 방식으로 표를 정리함으로써 러시아권 방문자가 원하는 특정 의료 서비스를 제공하는 병원을 쉽고 빠르게 찾을 수 있도록 정보를 직관적이고 체계적으로 정렬하였습니다.
