summary_user: 경상북도 관내에 공연법에 따라 등록된 공연장을 시설 한 곳당 한 행으로 담은 파일(csv, 약 4KB)로, 시군구 소재지·시설명칭·시설구분·대표자·개관일자·등록일·면적(제곱미터)·객석수를 담는다. 도내 어느 시군에 공연장이 몰려 있고 객석 규모는 어느 정도인지 같은 문화 인프라 분포와 접근성을 살피는 분석가·행정 담당자의 질문에 쓴다. 전역 조인 키가 없어 KOPIS 공연장ID 같은 자체 키로는 바로 연결되지 않으며, 다른 공연장·문화시설 데이터와는 시설명칭이나 시군구 이름을 맞춰 이어 쓴다.
description_portal: 경상북도 관내에서 공연법 규정에 따라 등록되어 운영 중인 공연장의 상세 관리 현황을 제공하는 데이터입니다. 본 자료는 지역별 문화 시설의 분포와 특성을 파악할 수 있도록 시군구 소재지, 시설 명칭 및 시설 구분 정보를 핵심적으로 포함하고 있습니다. 또한, 공연장의 물리적 규모와 관람 수용 능력을 가늠할 수 있는 전체 면적($m^2$)과 객석 수(석) 통계를 제공하며, 운영 주체인 대표자 정보와 시설의 운영 이력을 확인할 수 있는 개관 일자 및 등록일 데이터를 상세히 수록하고 있습니다. 해당 데이터는 지역 문화 예술 진흥과 도민의 문화 접근성 향상을 위한 인프라 분석 및 안전 관리 정책 수립의 기초 자료로 활용됩니다.
