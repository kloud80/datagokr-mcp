summary_user: 경기도 안에 있는 유네스코 세계유산의 등재 현황을 유산별로 정리한 목록으로, 등재연도(REGST_YY), 유산 구분, 유산 소재지를 담는다. 관광 정책 담당자나 연구자가 "경기도의 세계유산은 무엇이고 언제 등재되어 어느 시군에 있나"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 지정유산 데이터(종목코드·지정번호)나 지번 정보와는 유산명·소재지 이름을 맞춰서만 연결된다.
description_portal: 경기도 유네스코 지정 세계유산 현황 데이터는 경기도 내에 위치한 세계문화유산의 등재 현황을 정리한 자료로, 유산명, 등재연도, 유산소재지 등으로 구성되어 있습니다. 본 데이터는 국제적으로 인정받은 문화유산의 현황을 지역별로 파악할 수 있도록 제공하며, 문화재 보존 및 관리, 학술 연구, 관광 정책 수립 등 다양한 목적으로 활용될 수 있습니다. 특히 등재연도를 통해 문화유산의 지정 시점을 확인할 수 있으며, 소재지 정보는 행정구역별 유산 분포를 분석하는 데 유용합니다. 이 데이터는 경기도의 역사적·문화적 가치를 높이고, 지역사회와 연계한 문화유산 활용 전략 수립에 기초 자료로 쓰일 수 있습니다.
