summary_user: 인천 중구(현 영종구) 관내 외국인관광 도시민박업소를 업소 한 곳당 한 행으로 담은 파일로, 상호와 지번·도로명 소재지, 데이터기준일이 들어 있으며 포털 설명상 원도심 13개소와 영종지역 33개소를 다룬다. 외국인 관광객 대상 민박이 영종·원도심 어디에 몇 곳 있는지 확인하거나 지역 숙박 공급 분포를 보려는 관광 분석가·사업자가 쓴다. 전역 조인 키가 없어 다른 숙박업·관광사업 등록 데이터와는 상호나 주소 문자열 매칭으로만 이어 쓴다.
description_portal: 인천광역시 중구 관내 외국인관광 도시민박업 현황에 대한 데이터입니다.외국인관광도시민박업은 주민 자신이 거주하고 있는 집(단독주택 또는 다가구주택, 아파트 등 법령에서 정하고 있는 건물)을 이용하여외국인 관광객에게 한국의 가정문화를 체험할 수 있도록 적합한 시설을 갖추고 숙식 등을 제공하는  업종을 뜻합니다.이 데이터는 인천 중구 원도심지역 13개소 및 영종지역 33개소의 외국인관광도시민박업소에 대한 내용이며.파일 내용에는 사업체명, 세부주소 등에 대한 정보가 포함되어 있습니다.
