summary_user: 국립국악원이 수행한 학술연구 자료의 영인·번역본을 자료 한 건 단위로 담는다. 각 건에는 자료명·책임자·등록일·소속 DB·주제 분류와 주제어·분량·내용 설명·관련 장소와 시대·언어·저작권·원문 링크가 들어 있다. 국악 연구자나 교육자가 특정 고악보나 문헌의 영인·번역본이 있는지, 어떤 시대와 주제를 다루는지 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자료명·주제어 같은 이름 매핑으로만 연결한다. 부문은 공연으로 분류돼 있지만 KOPIS 공연ID·공연장ID 같은 키를 담고 있지 않다.
description_portal: 국립국악원이 수행한 학술연구 자료의 영인 및 번역 정보를 체계적으로 제공하는 데이터셋으로, 전통음악 연구와 문화유산 보존에 활용될 수 있도록 구성되었습니다. 자원의 명칭, 책임자, 등록일, 소속 DB, 주제 분류, 핵심 주제어, 자원 크기, 내용, 관련 장소, 시간적 범위, 언어, 저작권, 위치 정보 등 폭넓은 항목을 포함하여 자료의 학술적 가치와 활용 가능성을 높입니다. 연구자, 교육자, 문화예술 관계자들은 이 데이터를 통해 국악 자료에 대한 접근성과 활용도를 제고할 수 있으며, 전통음악의 학술적 연구, 교육 자료 개발, 문화예술 정책 수립 등 다양한 목적에 유용하게 활용 가능합니다.
