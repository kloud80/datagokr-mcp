summary_user: 광주 서구에 있는 작은도서관을 한 곳당 한 행으로 정리한 목록으로, 도서관명·운영주체·연락처·도로명주소·위도·경도·운영 상태(도서관상태)를 담는다. 주민이 우리 동네에서 가까운 작은도서관을 찾거나, 분석가가 서구 안에서 작은도서관이 부족한 생활권을 찾을 때 쓴다. 전역 조인 키나 도서관코드는 없으므로, 다른 도서관 데이터와는 도서관명·주소를 맞춰 잇거나 위도·경도로 공간 결합해 쓴다.
limits: 도서관정보나루의 도서관코드 같은 공통 키가 없어 대출·인기도서 데이터와 바로 붙지 않고, 이름·주소 매핑이 필요하다. 범위는 서구 한 개 시군구에 그치므로 광주 전체나 다른 구와 비교하려면 각 구의 데이터를 따로 모아야 한다.
