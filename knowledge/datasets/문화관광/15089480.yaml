summary_user: 인천광역시 서구(제목상 서해구) 관내에 등록된 골프연습장업 사업장을 한 곳씩 담은 명부로, 상호·지번 및 도로명 주소·전화번호·데이터기준일자를 개별 사업장 단위로 제공한다. 주민이나 창업 예정자가 '우리 동네 어디에 골프연습장이 몇 곳 있고 연락처는 무엇인가'를 확인하거나, 분석가가 지역 내 실내외 골프 시설 분포를 파악하는 데 쓴다. 전역 조인 키(인허가번호·사업자번호 등)가 실측 컬럼에 없어, 다른 체육시설업 명부나 상권 데이터와는 상호·주소 문자열 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 본 공공데이터는 인천광역시 서구 지역에 등록된 골프연습장업 현황을 제공하고 있습니다. 본 공공데이터는 인천광역시 서구 지역 내 골프연습장의 상호, 시설주소(지번), 시설주소(도로명주소), 전화번호 항목 등을 제공하고 있습니다. 본 공공데이터를 통하여 인천광역시 서구 지역 내 골프연습장의 분포 및 현황을 알아볼수 있어, 지역 주민들은 여가활동 선택의 폭을 넓히는 것에 기여할 수 있을것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신 정보를 반영을 하고 있습니다.
