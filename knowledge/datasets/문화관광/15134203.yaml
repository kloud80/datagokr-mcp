description_portal: 생물다양성 교육 확대 및 생물자원 보전에 대한 사회적 관심 증가와 더불어, 국립낙동강생물자원관에서는 생물자원에 대한 국민의 인식 제고를 위해 다양한 전시 프로그램을 운영하고 있으며, 이에 따라 관련 전시프로그램에 대한 정보를 공공데이터로 개방하고 있습니다. 개방 데이터는 전시명, 이용대상, 전시 접수시작일, 전시 접수종료일, 전시 시작일, 전시 종료일, 전시장소, 이용안내, 홈페이지 주소 정보 등으로 구성되어 있습니다. 학계·연구기관은 계절별 전시 수요, 주제별 관심도, 관람객 연령별 이용 행태 분석 등을 통해 생물자원 전시 콘텐츠의 효과성 연구 및 향후 전시 콘텐츠 기획 방향 수립에 활용할 수 있습니다.교육·문화기관은 보유 중인 관람자 피드백 데이터와의 융·복합 분석을 통해 이용자 맞춤형 전시 프로그램 개발 및 운영 개선에 기여할 수 있습니다. 지자체 및 참여기관은 전시 프로그램 정보의 공유를 통해 관람객 유입, 지역 연계 프로그램 운영, 생태관광과의 연계 등을 위한 협력 기반을 마련할 수 있습니다.
