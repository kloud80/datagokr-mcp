summary_user: 서울특별시 중랑구의 외국인관광도시민박업 인허가 정보를 업소 한 곳당 한 행으로 담는다. 인허가일·취소일, 영업상태, 휴·폐업 기간, 지번·도로명 주소, 좌표, 객실 수 등이 들어 있다. 중랑구에서 지금 영업 중인 외국인 대상 도시민박 업소가 어디에 몇 곳 있는지 확인하려는 여행자·숙박사업자·관광 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구 데이터나 관광사업 등록 데이터와는 관리번호(MGTNO)나 업소명·주소를 맞춰 잇고, 지도 데이터와는 좌표를 써서 겹쳐 본다.
description_portal: '외국인관광도시민박업은 도시 지역에 거주하는 주민이 자신의 주택을 이용하여 외국인 관광객에게 한국의 가정문화를 체험할 수 있도록 숙식 등을 제공하는 사업을 말합니다. 흔히 게스트하우스나 에어비앤비 형태로 운영되는 숙소 중 외국인만 대사응로 하는 경우가 이에 해당합니다.※ 관광진흥법 상 (외국인관광 도시민박업 /한옥체험업 / 관광펜션업 / 호스텔업) 현재 운영중인 업소 중 정보제공에 동의한 민박업소의 상세정보를 확인할 수 있습니다.※ 현행 관광진흥법령상 외국인관광 도시민박업은 도시지역 주택에서 외국인 대상으로만 운영이 가능합니다.* 데이터명 : 서울특별시 중랑구 외국인관광도시민박업 인허가 정보* 데이터종류 : 서울시 업종별 관광사업체 등록현황을 자치구별로 제공하는 데이터*관련태그 : 외국인관광도시민박업, 관광객이용시설업 , 관광숙박업 , 관광편의시설업 , 국제회의업 , 여행업 , 유원시설업 , 카지노업 , 투어 , 관광 , 사업체 , 호텔업 , 휴양업 , 유람선업 , 공연장업'
