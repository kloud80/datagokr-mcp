description_portal: '전국체육시설은 서울올림픽기념국민체육진흥공단에서 전국체육시설안전을 위해 관리하는 체육시설의 상세정보를 조회할 수 있는 서비스를 제공하고 있습니다. 체육시설의 이름, 시설의 구분명, 업종명, 체육시설의 유형명과 시설 시도명, 시군구명 등의 조회조건을 이용하여 전국체육시설안전을 위해 관리하는 체육시설의 상세정보에 대한 데이터를 조회할 수 있습니다. 시설명, 시설구분명, 업종명, 시설의 주소, 우편번호, 소유주체시군구명, 담당자부서명 등의 정보를 포함하고 있습니다.기존 : 서울올림픽기념국민체육진흥공단_전국체육시설 상세 정보_GW (폐기예정)변경 : 서울올림픽기념국민체육진흥공단_전국체육시설 정보이 서비스는 전국 체육시설의 기본 정보와 위치, 관리 주체 등을 제공하여 시설 관리의 효율성 향상과 체육 인프라 현황 분석에 활용될 수 있습니다.'
