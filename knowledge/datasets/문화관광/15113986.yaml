summary_user: 전국 체육시설을 시설 한 곳 단위로 담은 건별 원천 데이터이며, 시설명·시설구분·업종·유형, 도로명주소와 위경도, 시설상태, 실내외 구분, 총면적, 국가체육시설 여부, 자율점검대상 여부를 포함한다. 주민이나 분석가가 '우리 시군구에 운영 중인 실내 공공 체육시설은 어디에 몇 곳 있는가'를 확인하거나 지역별 체육 인프라 현황을 비교하는 데 쓴다. 시도·시군구·읍면동명, 도로명주소, 위경도(faci_lat)를 키로 행정구역 통계나 지도·인구 데이터와 이어 쓴다. 시설코드는 암호화값이라 다른 데이터셋과 코드로 직접 조인하기 어렵다.
limits: 검증 호출에서 API 전체 건수가 1건, 수신 행도 1행으로 나와 실제 전체 규모는 확인되지 않았다. 이 값은 조회조건에 따른 결과일 수 있으므로 데이터가 적다고 단정하지 않는다. 경륜·경정·토토, 스포츠 산업, 안전·윤리 영역은 이 분류에서 다루지 않는다.
