summary_user: 한국문화예술위원회 문화다양성 사업인 디아스포라 영화제의 상영 영화를 한 편씩 담은 목록 파일로, 영화명·작가명·공동작가·제작년도·작품내용과 홈페이지·페이스북 주소를 담는다. 디아스포라·이주민을 다룬 영화를 찾는 관객이나 연구자가 "이주와 정체성을 다룬 영화에는 어떤 작품이 있고 누가 언제 만들었나" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 영화·공연 데이터와는 영화명이나 작가명을 이름으로 맞춰서만 이을 수 있다.
description_portal: 한국문화예술위원회의 문화다양성 사업중 하나인 디아스포라 영화제 영화 목록 정보입니다. 각 구성 항목으로는 영화명, 작가명, 홈페이지, 페이스북, 공동작가, 제작년도, 작품내용으로 구성되어 있습니다. 영화명 항목은 "국가보호가 필요하다(We Need National Protection)"와 같은 영화의 이름이 나타나 있고 홈페이지 항목과 페이스북 항목은 URL 주소가 나타나 있습니다. 공동작가 항목은 비어있는 항목도 있고 공동작가 이름이 나타나 있는 항목도 있습니다. 제작년도 항목은 1961년부터 2018년까지 다양하게 나타나 있습니다.
