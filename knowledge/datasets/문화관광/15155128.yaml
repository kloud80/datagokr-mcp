summary_user: 전국 자치단체가 관리하는 비디오물감상실업(DVD방·영화방 등) 인허가 정보를 업소 한 곳당 한 건으로 담으며, 사업장명·인허가일자·영업상태·휴폐업일자·도로명/지번주소·좌표와 함께 청소년실 수, 비상구·소방시설 여부 같은 시설 항목을 포함한다. 창업 예정자나 상권 분석가가 특정 지역에 영업 중인 DVD방이 몇 곳이고 최근 폐업이 얼마나 늘었는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키는 없어서 개방자치단체코드(OPN_ATMY_GRP_CD)나 주소·좌표, 사업장명으로 다른 지자체 인허가·상권 데이터와 맞춰 이어 쓴다.
description_portal: '문화_비디오물감상실업 데이터는 DVD방, 영화방 등 다수의 시청실과 시청기자재를 갖추어 비디오물의 시청을 제공하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 비디오물감상실업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 영상콘텐츠산업과 / 044-203-3240 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
