summary_user: 전라남도 테마여행 코스를 코스 단위(계절·여행 기간·동행 유형·인원·소개)와 코스별 일정 단위(일차·시간·여행지명·주소·위도경도·연락처·주차)로 담는 원천 API이며, 범위는 시도 한 곳이고 여행지는 개별 주소·좌표로 나온다. 여행 앱 개발자나 여행객이 "가족과 2박 3일로 여름에 전남을 돌 때 어떤 코스로 어디를 들르나"를 찾는 데 쓴다. 상세 일정은 코스 목록의 고유 코드(courseKey)를 planCourseId로 넘겨 받고, 외부 데이터와 이을 전역 조인 키는 없어 여행지명·주소나 좌표로 TourAPI 관광지 등과 맞춰 쓴다.
description_portal: '- 입력 파라미터를 이용하여 전라남도 테마여행 정보를 조회할 수 있는 서비스로 코스명, 여행기간, 여행 소개, 여행지 등의 항목을 제공합니다.- 전라남도(전남)는 자연경관, 역사, 문화, 미식 등 다양한 매력을 지닌 여행지로, 여름철에도 시원하고 다채로운 여행을 즐길 수 있습니다. - 교통: 전남 지역은 대중교통이 제한적일 수 있으므로, 렌터카를 이용하시는 것을 추천합니다. - 숙박 예약: 여름철에는 관광객이 많아 숙박 시설이 빠르게 마감될 수 있으므로, 미리 예약하시는 것이 좋습니다. - 체험 예약: 일부 체험 프로그램은 사전 예약이 필요할 수 있으므로, 방문 전에 확인하시기 바랍니다. - 전남은 자연과 문화, 미식을 동시에 즐길 수 있는 매력적인 여행지입니다.'
team:
  dept: 정책기획관실
services:
  - op: /getCourseList
    name: 남도여행길잡이 계절별 테마여행 목록
    endpoint: https://apis.data.go.kr/6460000/jnCourseInfo/getCourseList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: startPage
        required: false
        desc: 시작 페이지 (default:1)
      - name: pageSize
        required: false
        desc: 페이지 크기 (default:10)
      - name: courseCategory
        required: false
        desc: '테마여행 계절 검색 (default: 봄)'
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getCoursePlanList
    name: 남도여행길잡이 테마여행 코스 정보
    endpoint: https://apis.data.go.kr/6460000/jnCourseInfo/getCoursePlanList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: startPage
        required: false
        desc: 시작 페이지 (default:1)
      - name: pageSize
        required: false
        desc: '페이지 크기 (default: 10)'
      - name: planCourseId
        required: true
        desc: 테마여행 목록의 고유 코드 (courseKey)
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getCourseImgList
    name: 남도여행길잡이 테마여행 이미지 목록
    endpoint: https://apis.data.go.kr/6460000/jnCourseInfo/getCourseImgList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: startPage
        required: false
        example: '1'
        desc: 시작 페이지 (default:1)
      - name: pageSize
        required: false
        example: '10'
        desc: 페이지 크기 (default:10)
      - name: courseInfoId
        required: true
        example: '0000010555'
        desc: 고유 코드 (테마여행 목록의 courseInfoIds 중 하나)
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
