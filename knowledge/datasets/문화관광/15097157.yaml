summary_user: 제주 향기마을 용흥리의 무장애 여행코스를 지점 단위로 담은 파일로, 지점마다 순서·위도·경도·구분·설명·포인트·상세정보와 전체코스·추천코스 해당 여부, 데이터기준일자를 담는다. 휠체어 이용자나 교통약자 동행 여행자가 용흥리에서 어떤 경로로 걸으면 되는지, 추천 코스의 주요 지점과 편의시설이 어디인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 지점 이름 매칭이나 위도·경도 좌표 근접 비교로만 이어 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_향기마을용흥리_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 내 향기마을 용흥리 지역의 무장애 여행 코스 정보를 제공합니다. 해당 자료에는 각 지점의 위치(위도·경도), 구분, 설명, 주요 포인트 및 추천 코스 등의 정보가 포함되어 있어, 교통약자 및 휠체어 이용자의 이동 편의성을 고려한 설계가 반영되어 있습니다. 또한 주차장, 화장실, 휴식 공간 등 편의시설 현황과 보행환경 요소를 포함하므로, 무장애 관광지 관리, 열린관광지 조성, 관광 안내 서비스 개선 및 정책 수립을 위한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
