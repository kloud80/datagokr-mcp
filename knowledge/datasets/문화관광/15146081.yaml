description_portal: '"서울시 동남권(강남구, 강동구, 서초구, 송파구) 공공도서관 38개관의 연간 도서 보유량 현황 정보* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함"KDC 분류별 장서 보유량: 총류, 철학, 종교, 사회과학, 순수과학, 기술과학 등 한국십진분류법(KDC)에 따른 주제별 도서 권수를 연도별로 기록.'
