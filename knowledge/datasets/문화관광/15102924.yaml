summary_user: 경상남도에 등록된 관광유람선업(일반관광유람선업·크루즈업) 업체를 한 행씩 담은 목록 파일로, 시군명·업종소분류·업체명·소재지 주소를 담으며 파일 크기는 856바이트로 작다. 경남 지역에서 유람선 관광을 운영하는 업체가 어느 시군에 어디 있는지 찾는 여행자나, 지역별 관광유람선 사업체 현황을 파악하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명이나 업체명·소재지 주소를 이름으로 맞춰 TourAPI 관광 콘텐츠나 관광사업 등록 자료와 이어 쓴다.
description_portal: '경상남도 내 등록된 관광 유람선업에 대한 데이터로, 시군명, 업종소분류 및 업체명, 그리고 소재지 정보들을 제공합니다.*"관광진흥법 시행령 제2조 제1항 제3호 라목"에 따른 관광객 이용시설업 중1) 일반관광유람선업: 「해운법」에 따른 해상여객운송사업의 면허를 받은 자나 「유선 및 도선사업법」에 따른 유선사업의 면허를 받거나 신고한 자가 선박을 이용하여 관광객에게 관광을 할 수 있도록 하는 업2) 크루즈업: 「해운법」에 따른 순항(順航) 여객운송사업이나 복합 해상여객운송사업의 면허를 받은 자가 해당 선박 안에 숙박시설, 위락시설 등 편의시설을 갖춘 선박을 이용하여 관광객에게 관광을 할 수 있도록 하는 업'
