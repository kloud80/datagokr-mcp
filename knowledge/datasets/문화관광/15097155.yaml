summary_user: 제주 한수리방파제길 무장애여행코스를 지점 단위로 담은 파일로, 순서·위도·경도와 함께 구분·설명·포인트·상세정보, 전체코스·추천코스 여부를 행마다 기록한다. 장애인·노약자·영유아 동반 가족이나 무장애 관광 콘텐츠 제작자가 '휠체어나 유모차로 이 코스의 어느 지점까지 어떤 순서로 둘러볼 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 콘텐츠 등과는 코스·지점 이름 매핑이나 위경도 근접 비교로만 이어 쓸 수 있다.
description_portal: '"제주특별자치도 내 한수리방파제길_무장애여행코스 데이터를 제공합니다.* 제주특별자치도의 한수리방파제길은 장애인, 노약자, 영유아 동반 가족 등의 편의를 고려하여 설계된 무장애 여행코스로서, 해안가 산책로와 방파제길을 따라 평탄하게 이어지는 길이 특징입니다. 본 자료는 해당 코스의 개요, 주소, 주차장 및 화장실 등 접근성 정보, 추천 여행 동선과 주요 포인트, 휴무일 및 관람료 등을 포함하고 있어, 이동이나 이용에 제약이 있는 이용자도 사전에 이용 가능성을 확인하고 방문 계획을 세울 수 있도록 구성되어 있습니다. 이를 통해 무장애 관광 콘텐츠 제작, 관광서비스 접근성 개선, 무장애 여행 코스 추천 및 평가 등에 활용될 수 있는 기초자료로 제공됩니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
