summary_user: 우도 성산항 여객터미널의 무장애 여행 정보를 지점 단위로 담은 파일로, 실측 필드는 아이디·위도·경도·해발고도 네 개뿐이다. 휠체어 이용자나 교통약자와 함께 우도행 여객선을 타려는 여행객, 또는 이를 안내하는 관광 서비스 개발자가 '터미널 안팎 이동 동선이 어디로, 어떤 높낮이로 이어지는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 이름 매칭이나 같은 기관(제주특별자치도) 무장애여행정보 시리즈끼리만 연결되며, 좌표를 이용해 지도 위에 겹쳐 보는 정도가 현실적인 연계 방법이다.
description_portal: '"제주특별자치도_무장애여행정보_51.사려니숲길-2(붉은오름방향) 데이터를 제공합니다.* 이 데이터셋은 제주특별자치도에서 제공하는 우도 성산항 여객터미널에 대한 무장애 여행객(휠체어 이용자, 교통약자 등)을 위한 정보를 포함한다. 해당 터미널의 위치 정보, 여객선 접근 경로, 접근 가능 여부, 편의시설 상태, 대기 및 이동 동선 등 항만 이용 관련 실질적 조건을 체계적으로 정리하였다. 특히 장애인·고령자·유아 동반자 등을 고려한 이동 편의성 여부를 점검해, 무장애 관광 기반 구축 및 열린관광지 활성화를 위한 기초자료로 설계되었다. 이 자료는 접근성 정보 기반의 여행 안내, 관광 서비스 개선, 정책 수립 등에 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
