summary_user: 국내외 시각예술 전시를 연도별로 한 건씩 정리한 편람 파일로, 전시명·장르(중분류)·국내전/해외전·개인전/단체전·작가와 국적·참여작가수·주최·전시기간·광역자치단체·전시장소와 운영주체를 담는다(CSV 약 36MB). 연구자나 문화행정 담당자가 "특정 연도에 어느 지역에서 어떤 장르의 개인전·단체전이 얼마나 열렸고 해외전 비중은 어땠나" 같은 질문에 쓴다. 전역 조인 키는 없어, 다른 데이터와는 광역자치단체명이나 전시장소 이름을 맞춰 연결해야 한다.
description_portal: 이 데이터는 AK시각예술 편람정보로, 국내외 시각예술 전시 활동의 전반적인 현황을 연도별로 정리한 통합 기록입니다. 각 항목은 연도, 대분류, 중분류, 전시명, 부제, 행사명, 국내전_해외전, 개인전_단체전, 작가명_단체명, 국적, 참여작가수, 주최, 시작일, 종료일, 전시기간, 지역1_광역자치단체, 전시지역, 전시장소, 전시장외, 전시장운영주체, 비고, 연번으로 구성되어 있으며, 세부적인 전시 정보와 운영 주체까지 포괄적으로 포함되어 있어 시각예술 활동의 구조적 이해와 비교 분석이 가능합니다. 중분류 항목은 혼합, 조형, 공예, 회화, 기타, 조소, 설치, 영상 등 다양한 시각예술 장르로 구성되어 있어 전시 유형별 흐름을 분석할 수 있으며, 개인전_단체전 항목은 단체전, 개인전, 미지정으로 구분되어 전시 성격을 파악할 수 있습니다. 국적 및 참여작가수 항목은 전시의 국제성 및 규모를 분석하는 데 유용하고, 전시장소 및 전시장외 항목은 지역 및 공간 활용 측면의 특성을 드러냅니다. 이 편람은 예술정책 수립, 문화공간 운영 평가, 장르별 전시 트렌드 분석 등 시각예술 연구 및 행정기획에 필수적인 기초자료로 활용될 수 있습니다.
