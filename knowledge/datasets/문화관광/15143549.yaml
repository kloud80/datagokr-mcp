description_portal: 수원시에 등록되어 있는 도시재생거점시설 현황을 제공합니다. 데이터는 행정구역, 유형, 도로명주소, 지번주소, 연면적, 기능, 연이용자수, 관련부서, 데이터기준일자로 구성되어 있습니다. 도시재생이란 산업구조의 변화, 신도시 위주의 도시확장 등 다양한 원인으로 인해 상대적으로 쇠퇴하고 있는 기성시가지에 새로운 기능을 도입·창출함으로써 도시를 물리·환경적, 경제적, 생활·문화적으로 재활성화 또는 부흥시키는 창조적 작업을 의미합니다. 수원시 각 행정구역에 설립된 도시재생거점시설 현황을 참고하여 주시기를 바랍니다.
