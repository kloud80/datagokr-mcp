summary_user: 대전광역시 중구 관내 체육시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·시설유형(간이 운동시설, 국궁장, 체육관, 수영장 등)·지역·도로명/지번 주소·데이터 기준일자를 담는다. 중구 주민이나 생활체육 이용자가 '우리 동네 근처에 체육관이나 수영장이 어디 있나'를 찾을 때, 분석가가 구 단위 체육시설 분포를 볼 때 쓴다. 전역 조인 키나 코드표는 없어 다른 데이터와는 시설명·주소 문자열 매칭으로만 잇고, 문체부 전국체육시설 DB나 다른 시군구 체육시설 현황과 나란히 놓아 쓴다.
description_portal: 본 공공데이터는 대전광역시 중구 관내에 위치한 체육시설(연번, 시도, 시군구, 체육시설명, 시설유형, 지역, 도로명주소, 지번주소, 데이터 기준일자) 정보를 제공합니다.데이터 업데이트 주기는 연간으로, 데이터 기준일을 확인하시기 바랍니다.(데이터 컬럼 안내)데이터 컬럼 중 시설유형은 간이 운동시설, 국궁장, 체육관, 수영장 등으로 구분되어 있습니다.체육시설 주소는 도로명주소 및 지번주소로 기재되어 있습니다.해당 공공데이터와 관련하여 문의사항이 있으신 경우 담당부서로 연락주시기 바랍니다.
