summary_user: 한국저작권위원회의 저작권 등록건수를 저작물·저작인접물·데이터베이스별로 기본등록·권리변동·등록사항 변경 등 등록 유형(구분)으로 나눠 2013년부터 2024년까지 연도별로 집계한 전국 단위 통계표다. 연구자나 정책 담당자가 '최근 10여 년간 저작물 기본등록과 배타적발행권 등록은 어떻게 늘거나 줄었나' 같은 등록 추이를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 저작권·콘텐츠 통계와는 연도와 등록 유형 이름을 맞춰서만 이어 쓴다.
description_portal: 1. 한국저작권위원회에서 보유한 저작물의 종류는 저작권법(제4조 내지 제6조)에 근거하며, 저작인접물의 종류는 저작권법(제64조)에 근거한 종류별 저작권등록건수 기재2. 한국저작권위원회에서 보유한 창작분야 저작권등록서비스 통계자료로 국가나 지방자치단체 등의 단체와 기등록 저작물에 대한 권리변동 등 후순위 등록의 경우 신청인 구분이 불가한 건수를 의미함을 유의3. 저작권 등록건수를 연도별로 저작물-저작권 기본등록, 저작물-권리변동-일반, 저작물-권리변동-출판권등록, 저작물-권리변동-배타적발행권등록, 저작물-등록 사항 변경-저작권, 저작물-등록 사항 변경-출판권, 저작물-등록 사항 변경-배타적발행권, 저작인접물-저작권 기본등록, 저작인접물-권리변동-일반, 저작인접물-권리변동-배타적발행권등록, 저작인접물-등록 사항 변경-저작인접권, 저작인접물-등록 사항 변경-배타적발행권, 데이터베이스-DB제작자의 권리 기본등록, 데이터베이스-권리변동-일반, 데이터베이스-권리변동-배타적발행권등록, 데이터베이스-등록 사항 변경-DB제작자의 권리, 데이터베이스-등록 사항 변경-배타적발행권 구분하여 등록건수로 추출한 통계자료이다
