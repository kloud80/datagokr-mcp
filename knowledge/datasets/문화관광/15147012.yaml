summary_user: 서울 동대문구에 신고된 체력단련장업(헬스장·피트니스센터)을 업소 한 곳당 한 행으로 담은 인허가 원천 명부입니다. 상호, 지번·도로명 주소, 인허가일·폐업일, 영업상태, 좌표, 지도자 수 같은 항목이 들어 있습니다. 동대문구에서 최근 문을 연 헬스장과 닫은 헬스장이 어느 동네에 몰려 있는지 같은 상권 질문에 씁니다. 실측 컬럼에는 전역 조인 키가 없어서 다른 데이터와는 주소·상호 이름 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로 잇습니다.
description_portal: '▶동대문구 체력단련장 정보를 제공합니다.(상호명, 도로명주소, 지번주소, 영업여부 등)▶체력단련장업이란 헬스장과 같이 운동기구 및 장비를 갖추어 이용자에게 근력·지구력·심폐지구력 등 신체능력 단련을 할 수 있도록 시설을 제공하는 업종입니다.  흔히 우리가 말하는 헬스장, 휘트니스센터 등이 이에 해당합니다.  ▶체력단련장 주요 특징- 시설적 특징 : 웨이트 트레이닝 기구, 유산소 운동기구, 샤워실·탈의실 등 부대시설을 갖춤- 운영적 특징 : 회원제(월·분기·연 단위) 또는 자유 이용제 운영- 법적 특징 : 관할 지자체에 신고해야 하며, 시설·안전 기준 및 지도자 배치 의무 규정 적용▶체력단련장업은 법적으로 등록·신고를 통해 운영해야 하는 ‘체육시설업’의 한 업종이며, 국민들이 건강 증진을 위해 주로 이용하는 대표적인 생활체육시설입니다.▶체력단련장업은 신고체육시설업에 해당하므로, 사업자는 관할 구청에 체육시설업 신고를 해야 합니다.▶사업자가 제출해야 할 서류에는 체육시설업 신고서, 임대차계약서, 지도자 자격증, 시설 평면도 등이 있습니다.'
