description_portal: '- 전라남도 내 각 시군의 공공 도서관에 대한 정보(도서관명, 주소, 전화번호, 홈페이지 등)를 조회하실 수 있습니다.- 전라남도는 도민의 독서 문화 증진과 정보 접근성을 높이기 위해 각 시군에 공공도서관을 운영하고 있습니다. 이들 도서관은 도서 대출, 문화 프로그램, 디지털 자료 제공 등 다양한 서비스를 통해 지역 주민들에게 지식과 문화 향유의 기회를 제공합니다.- 전라남도립도서관과 각 시군 도서관은 온라인을 통해 도서 검색, 예약, 연장 등의 서비스를 제공합니다. 또한, 전자책, 오디오북 등 디지털 자료를 이용할 수 있는 플랫폼도 운영하고 있습니다.- 각 도서관의 위치, 운영 시간, 프로그램 등 자세한 정보는 해당 도서관의 공식 홈페이지나 전라남도립도서관 홈페이지를 통해 확인하실 수 있습니다.'
