description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 제주해녀박물관은 제주시 구좌읍 해녀박물관길 26에 위치한 제주 해녀 문화의 역사와 삶을 기록·전시하는 박물관으로 해녀의 집, 어로기구, 생활문화, 해녀의 일상과 공동체, 해녀항일운동의 역사까지 다양한 전시를 통해 제주 해녀의 사회적·문화적 가치를 조명하며 장애인 전용 주차장, 경사로 출입구, 휠체어·유모차 대여, 엘리베이터, 장애인 화장실, 수유실 등 무장애 편의시설을 갖추어 교통약자·고령자·유아 동반 가족 등도 이용 가능한 열린관광지로 설계되어 있어 제주 문화유산 보존과 관광 약자 접근성 보장을 동시에 제공한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
