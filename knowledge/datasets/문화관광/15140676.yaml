summary_user: 서울특별시 은평구에서 실내수영장을 포함해 두 종류 이상의 체육시설을 한 곳에서 운영하는 종합체육시설업의 인허가 정보를 업소 1건 단위로 담는다. 상호명·소재지(지번·도로명 주소)·인허가일·영업상태·폐업일과 중부원점TM 좌표를 담고 있어, 주민이나 분석가가 '은평구에서 지금 영업 중인 수영·헬스 복합 체육시설은 어디인가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 주소·상호명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '은평구에서 수영, 골프, 체육단련 등과 같은 체육시설을 한 곳에 모아놓은 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 실내수영장을 포함한 두 종류 이상의 체육시설을 한 곳에 모아 운영하는 종합체육시설업의 인허가 현황을 담고 있습니다 . 데이터에는 각 시설의 상호명, 소재지 주소, 최초 등록일, 현재 영업 상태(영업중, 폐업 등)와 같은 체육시설 운영에 대한 핵심 행정 정보가 포함되어 있습니다 .이 데이터를 통해 주민들은 헬스, 수영, 골프 등 다양한 운동을 한곳에서 즐길 수 있는 대규모 복합 체육시설의 현황과 위치를 파악하여 여가 및 건강 증진 활동을 계획하는 데 도움을 받을 수 있습니다. 또한, 주소 정보를 기반으로 지역 내 대규모 생활체육 인프라의 분포와 접근성을 분석할 수 있으며, 인허가 및 폐업 현황의 시계열 분석은 주민들의 다양화되는 스포츠 수요와 관련 산업의 동향을 파악하는 중요한 지표가 됩니다. 이는 지자체가 주민들의 건강 증진을 위한 공공 체육시설 정책을 수립하고 관리하는 데 기초 자료로 활용될 수 있습니다 .'
