summary_user: 제주에 실제 거주하는 내국인의 유동인구를 2018년 1월부터 월 단위로 집계한 통계로, 기준연월·성별·연령대·시간대별 체류 인구(머문 시간을 60분으로 나눈 값의 합)를 담는다. 제주 생활 인프라나 교통 수요를 검토하는 분석가가 '어느 연령대 도민이 어떤 시간대에 많이 움직이는가'를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기준연월·성별·연령대 같은 이름 매핑이나 같은 기관(제주빅데이터센터) 자료끼리만 이어 쓴다.
description_portal: 이 데이터셋은 2018년 1월 1일부터 최근 기준까지(데이터 확인 시점으로는 2025-04-30) 제주특별자치도에 실제 거주하는 내국인들의 유동인구 변동을 월 단위로 집계한 통계자료입니다. 유동인구는 하루 01시부터 24시까지 매 정각 기준으로 해당 시간 동안 머문 시간을 분 단위로 계산해 60분으로 나눈 값을 집계한 수치이며, 매월의 총 유동인구 합계로 정리되어 있습니다. CSV 형식으로 누구나 무료로 내려받아 이용 가능하며, 제공기관은 제주빅데이터센터 (운영 주체는 제주특별자치도청) 입니다. 이 정보는 제주 거주 실거주민의 이동·체류 패턴 분석, 시간대 및 계절별 인구 흐름 파악, 지역 교통 및 생활 인프라 수요 예측, 도시계획 및 지역정책 수립, 재난·재해 대비 인구분포 모델링 등에 유용합니다. 다만 이 데이터는 수집 시점 및 방법에 따라 한계를 가지며, 실시간 이동이나 미신고 주민 이동 등은 반영되지 않을 수 있습니다
