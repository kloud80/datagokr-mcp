description_portal: 국가유산청장이 지정 관리하는 등록문화유산 중 충청북도 관내 소재한 유산의 현황을 정리한 자료입니다. 등록문화유산은 강화도 조약 이후 근대기에 건립된 건축물, 산업시설, 생활사 유산, 기록물 등으로역사적, 학술적, 예술적 가치가 인정되는 문화유산을 대상으로 합니다. 충청북도의 등록문화유산 현황은 도내 각 시군에 소재한 근현대 건축물과 산업유산, 생활문화 관련 자료를 중심으로 구성되어 있습니다. 데이터는 문화유산명, 등록일자, 소재지, 소유자 및 관리주체 기본 항목으로 구성되어 있습니다. 충청북도 내 근현대 문화유산의 분포와 특성을 종합적으로 파악할 수 있습니다.
