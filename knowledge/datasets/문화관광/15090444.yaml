summary_user: 충청북도 관내에 있는 국가 등록문화유산(근대기 건축물·산업시설·생활사 유산 등)을 유산 한 건당 한 행으로 정리한 목록으로, 종목·명칭(한자 포함)·소재지·관리자·소유자·지정일·수량규모를 담는다(파일 크기 약 5KB). 도내 근현대 문화유산이 어느 시군에 어떤 종류로 분포하는지, 특정 근대 건축물의 소유·관리 주체가 누구인지 확인하려는 연구자나 지역 담당자가 쓴다. 공통 조인 키가 없어 국가유산청 목록과는 명칭·소재지로 맞춰 이어 써야 하며, 종목코드·지정번호 같은 코드는 이 파일에 없다.
