description_portal: '경기도 광명시 주요관광지 입장객수 현황 데이터로, 6개 주요관광지인 광명동굴, 광명스피돔, 광명도덕산캠핑장, 구름산산림욕장, 기형도문학관, 충현박물관의 2023년 1월부터의 입장객수 현황 데이터를 제공합니다. 1. 광명동굴 : 웜홀광장, 빛의공간, 예술의전당, 황금궁전 등 다채로운 문화공간으로 꾸며져 있음 2. 광명스피돔 :  4계절 내내 경륜 경기가 펼쳐지는 실내 경주장이며 국제사이클 연맹의 표준규격에 맞춰 설치되어 있음. 3. 광명도덕산캠핑장 :  총 42면의 공간을 제공하는 도심속의 자연 휴양림이여 부대시설에는 관리사무소, 매점, 쉼터연못, 화장실, 샤워장, 오수처리장, 취수대, 등산로, 약수터, 생태연못이 있음 4.구름산산림욕장 : 구름산 산림욕장은 높이 20m가량의 울창한 나무숲으로 조성되어 있음. 전나무 356그루와 184m 황톳길이 있어 맨발 산책이 가능함. 5. 기형도문학관 : 기형도문학관은 광명시를 대표하는 문학관으로서 기형도 시인의 문학 자료를 체계적으로 수집·보존하고,   연구·전시·교육 기능을 갖춘 복합문화공간임. 6. 충현박물관 : 전국 최초의 종가 박물관인 충현박물관은 조선시대 청백리 재상 오리 이원익과 후손들의 유적과 유물을 보존하고 있음.'
