summary_user: 경기도 광명시 6개 주요관광지(광명동굴, 광명스피돔, 광명도덕산캠핑장, 구름산산림욕장, 기형도문학관, 충현박물관)의 입장객수를 관광지별·월별(기준년월)로 담은 집계 파일이며, 2023년 1월부터의 값과 주소·위도·경도·관리기관을 함께 싣는다. 관광 분석가나 지역 상권 사업자가 '광명동굴 방문객은 어느 달에 가장 많고 다른 광명시 관광지와 비교하면 어떤가'처럼 관광지별 계절 추이와 비교를 확인하는 데 쓴다. 전역 조인 키나 관광지점코드가 없으므로, 다른 관광 통계와는 관광지명 매칭이나 소재지 주소·좌표 기반 지역 매핑으로 이어 쓴다.
limits: 관광지점코드·시군구코드 같은 공통 키가 실측 컬럼에 없어 다른 데이터와 자동 조인이 안 되고, 관광지명·주소를 직접 맞춰야 한다. 범위가 광명시 6개 관광지로 한정돼 다른 시군구와의 비교에는 따로 데이터가 필요하다.
