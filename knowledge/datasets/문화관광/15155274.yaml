summary_user: 경기도 파주시 대표홈페이지에 공개된 공공체육시설을 시설 1곳당 한 행으로 담은 파일로, 테니스 등 14개 시설류별 시설명·이용가능여부·주소·위경도·면적·주요시설·유료여부·이용시간·이용대상을 담는다. 파주시 주민이 '집 근처에서 무료로 쓸 수 있는 테니스장이나 운동시설이 어디에 있고 언제 이용할 수 있나'를 찾거나, 분석가가 시 안의 체육시설 분포와 접근성을 볼 때 쓴다. 전역 조인 키는 없어서 위경도·주소로 다른 위치 데이터와 공간 결합하거나 시설명·시설분류명을 맞춰 문체부 전국체육시설 자료 등과 연결한다.
limits: 파주시 한 곳의 시설 현황만 담고, 예약·대관 신청은 이 파일로 처리하지 않는다. 공통 코드 같은 전역 조인 키가 없어 다른 데이터와는 이름·주소·좌표 매칭으로만 이어 붙여야 한다.
