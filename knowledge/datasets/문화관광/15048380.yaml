summary_user: 문화체육관광부와 한국저작권보호원이 정품 콘텐츠만 판매·유통·서비스하는 업체로 지정한 저작권OK 오프라인 매장을 매장 한 곳당 한 행으로 담은 전국 단위 목록 파일(csv, 약 18KB)로, 매장명·서비스분류·유통콘텐츠·지역·지정기간·관리번호를 담는다. 소비자가 "우리 지역에서 정품 콘텐츠를 파는 오프라인 매장이 어디인가"를 확인하거나, 분석가가 지역·콘텐츠 분야별 지정 업체 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 매장명·지역 같은 이름 매칭이나 같은 기관의 관리번호로만 이어 쓴다.
description_portal: 소비자가 정품 콘텐츠와 불법복제물을 구별하기 어려운 경우가 많아, 의도치 않게 불법 콘텐츠를 이용하게 되고 그로 인해 소송 등 법적 분쟁이나 경제적 피해가 발생하는 사례가 증가하고 있습니다. 이러한 문제를 예방하고 소비자를 보호하기 위해, 문화체육관광부와 한국저작권보호원은 정품 콘텐츠만을 판매·유통·서비스하는 업체를 ‘저작권OK업체’로 지정하고 있습니다. 이 제도는 소비자가 안심하고 콘텐츠를 구매·이용할 수 있도록 지원하는 취지로, 온·오프라인에서 정품을 신뢰하고 선택할 수 있는 환경을 조성합니다.
