summary_user: 국립극장에서 열렸거나 열릴 예정인 공연을 작품 단위로 담은 CSV 파일(약 766KB)로, 공연명·장르·전속단체·공연 시작일과 종료일·장소·티켓가격·관람연령·러닝타임·주최 등을 건별로 담는다. 관객이나 분석가가 '국립극장 전속단체가 어떤 장르의 공연을 언제, 얼마의 티켓가격으로 올렸는가'처럼 국립극장의 공연 기획 흐름과 가격·관람연령 구성을 살피는 데 쓴다. 실측 컬럼에 KOPIS 공연ID(mt20id)나 공연장ID 같은 전역 조인 키가 없어, KOPIS 공연 목록 등 다른 데이터와는 공연명·기간·장소를 이름으로 맞춰 이어 써야 한다.
description_portal: 국립극장에서 실제로 공연되었거나 향후 공연이 예정되어 있는 모든 작품에 대한 포괄적이고 체계적인 정보를 담고 있는 중요한 데이터로, 단순한 공연명이나 일정뿐만 아니라 기획사, 장르, 전속단체, 공연 시작일과 종료일, 제작 구분, 공연 시간, 공연 장소, 티켓 가격 정보, 관람 연령 제한, 러닝타임, 주최 기관 등 다양하고 상세한 항목들이 체계적으로 포함되어 있으며, 해당 데이터를 통해 공연의 기획 방향이나 흐름을 깊이 있게 분석하고 문화예술 트렌드와 관객 선호도를 정확하게 파악하는 데 매우 유용하게 활용될 수 있다
