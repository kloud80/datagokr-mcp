summary_user: 서울특별시 광진구 관내 일반게임제공업(성인게임장·오락실 등) 업소의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일·폐업일·영업상태, 소재지 지번·도로명 주소, 중부원점TM 좌표(X, Y), 시설면적·층수·방 수·비상구 등 시설 항목이 들어 있다. 구청 담당자나 연구자가 '광진구에서 현재 영업 중인 일반게임제공업소는 어디에 몇 곳이고, 최근 폐업한 곳은 어디인가'를 확인하거나 청소년 보호구역·유해업소 관리 현황을 파악하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 관리번호(MGTNO)·업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 관내에서 일반게임제공업 인허가를 받아 운영 중인 업소의 현황 정보를 제공합니다. 일반게임제공업은 성인 전용 게임기기 및 전체이용가 게임기기를 설치하여 유료로 제공하는 업종으로, 성인게임장, 오락실 등 청소년이용불가 업소도 포함됩니다. 게임물관리위원회에서 등급 분류를 받은 게임물을 사용하며, 데이터에는 업소명, 소재지, 업종 유형, 인허가일자 등의 항목이 포함되어 있습니다. 해당 정보는 청소년 보호구역 설정, 유해업소 관리, 게임산업 정책 수립, 지역 여가문화 실태 파악 등 다양한 행정 및 연구 목적으로 활용될 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않아 GIS 기반 지도 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준으로 최신화되어 정기적으로 갱신되며, 광진구 내 일반게임제공업 인허가 및 관리 행정에 활용됩니다.
