summary_user: 한국문화예술위원회가 정리한 공연예술 분야 소사(주요 사건 연표)를 날짜별 한 줄 기록으로 담은 파일로, 포털 설명상 2015·2017·2018년 3개 연도의 기관장 취임 같은 사건이 일자와 내용으로 들어 있다(csv 약 55KB). 연구자나 기자가 '2017년 공연예술계에 어떤 기관·인사 변화가 있었나'처럼 특정 연도의 업계 주요 사건을 되짚을 때 쓴다. 공연ID·공연장ID 같은 전역 조인 키가 없어 KOPIS 공연 목록 등과는 일자나 기관·단체 이름을 텍스트로 맞춰 대조하는 방식으로만 이어 쓴다.
