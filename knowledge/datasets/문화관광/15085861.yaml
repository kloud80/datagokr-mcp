description_portal: 여성사전시관 영상물 정보 서비스를 파일 데이터로 제공합니다. 해당 개방 데이터를 통해 영상물제목명, 영상물매체분류명, 제작일자, 제작사명, 데이터기준일자 등의 내용을 확인할 수 있습니다. 교육기관, 콘텐츠 플랫폼 등에서 영상 콘텐츠를 자동으로 연동하거나 갱신하는 데 효과적입니다. 영상 제목, 제작일자, 매체 분류명 등의 정보를 활용하여 주제별 정리나 키워드 기반 콘텐츠 큐레이션이 가능하며, 데이터 기준일자를 통해 최신 콘텐츠 여부도 쉽게 파악할 수 있습니다. 영상 활용이 중요한 양성평등 교육 현장이나 시청각 기반 전시 콘텐츠 구성 등에 폭넓게 활용될 수 있습니다.
