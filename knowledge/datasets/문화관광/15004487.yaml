limits: ISBN 등 전역 키가 없어 국가서지나 다른 도서관 데이터와 정확히 연결하기 어렵고, 서명·저자 매칭에 의존해야 한다. 범위는 동구 가오도서관 한 곳으로, 다른 도서관이나 지역 전체 장서를 대신하지 않는다.
