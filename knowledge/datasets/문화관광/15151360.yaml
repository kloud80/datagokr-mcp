description_portal: 본 데이터는 경상북도 경주시 동궁원 공식 홈페이지 방문자의 유입 경로 정보를 수록한 파일 형식의 공공데이터이다. 데이터에는 일련번호, 방문일자, 유입키워드, 네이버, 네이트, 다음, 야후, 구글, 기타, 전체합계 등의 항목이 포함되어 있다. 이 자료는 검색 포털 및 외부 채널을 통해 동궁원 홈페이지로 유입된 방문 현황을 분석하기 위한 기초자료로 활용된다. 이를 통해 주요 유입 경로별 방문 비중, 홍보 효과, 이용자 관심도 등을 파악할 수 있으며, 향후 관광 마케팅 전략 및 온라인 홍보 정책 수립에도 활용된다. 경주시는 본 데이터를 정기적으로 갱신하여 정확하고 신뢰성 있는 관광 통계 정보를 제공하기 위해 지속적으로 관리하고 있다.
