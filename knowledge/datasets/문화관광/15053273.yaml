description_portal: 영도구 관내 기념비 현황을 보여주는 자료입니다. 영도구에서 관리하는 공공시설과 관내 시설(태종대유원지 사업소, 학교, 공원 등)에 설치된  기념비,송덕비,문학비,동상,헌장비 등과 관련한 데이터로기념비 등의 유형, 명칭, 설치일, 소재지, 건립주체, 관리주체에 대한 자료를 포함합니다.영도구에서 건립하고 관리하는 기념비 뿐 아니라 관내 기관(태종대 유원지사업소, 초중고교 등)에서 건립하고 관리하는 기념비 자료를 포함하고 있습니다.1880년대 설치된 것으로 추정되는 절영도진첨사 송덕비부터 최근 건립된 6.25참전유공자명비(2022년), 월남참전 유공자 명비(2023년) 까지 총 30개의 기념비에 대한 자료입니다.
