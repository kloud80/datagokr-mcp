summary_user: 부산 수영구에 등록된 공연장을 한 곳씩 담은 파일로, 등록일자·공연장 이름·도로명 소재지·전화번호·대표자 성명·객석수를 담는다(약 900바이트 규모의 소량 CSV). 수영구 주민이나 공연 기획자가 '수영구에서 객석 몇 석 규모의 공연장이 어디에 있고 어디로 문의하나'를 확인하는 데 쓴다. 공연장ID 같은 전역 조인 키가 없어 KOPIS 공연장 정보 등과는 공연장 이름·주소를 맞춰 보는 방식으로만 연결한다.
description_portal: 부산광역시 수영구 공연장 현황 데이터로, 행정 체계에 따라 관리되는 여러 정보가 포함되어 있습니다. 구체적으로는 공연장이 등록된 시점을 나타내는 등록일자와 공연이 열리는 구체적인 공연장명칭, 그리고 방문객들이 찾아갈 수 있는 공연장소재지가 명시됩니다. 또한 문의를 위한 전화번호와 해당 시설의 운영 책임자인 성명, 수용 가능한 인원을 파악할 수 있는 객석 정보가 함께 제공됩니다. 이러한 체계적인 데이터를 활용하면 시민들은 지역 내 문화생활을 보다 편리하게 누릴 수 있으며 관련 산업에서도 유용한 통계 자료로 활용할 수 있습니다.
