summary_user: 구로구 안에서 청소년게임제공업으로 인허가를 받은 업소를 한 곳씩 담은 건별 인허가 자료로, 인허가·취소·폐업 일자, 영업상태, 소재지 지번·도로명 주소와 좌표(X, Y), 층수·시설면적, 환기·방음·조명·음향·편의시설과 비상계단·비상구 유무 등을 담는다. 구청 담당자나 연구자가 '학교 주변에 지금 영업 중인 청소년게임장이 몇 곳이고, 청소년 보호용 시설기준을 갖췄는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자료와는 업소명·주소·좌표를 맞추거나 같은 기관의 관리번호(MGTNO)·서비스 코드로만 이어 쓴다.
description_portal: '청소년게임제공업 인허가 정보는 구로구에서 청소년을 대상으로 게임물을 제공하는 업소(예: 게임장, 일부 오락시설 등)에 대해 인허가일자, 영업상태명, 소재지주소, 기계·기기 수, 청소년실 여부, 자동환기·방음·조명·음향·편의·소방시설 유무, 총게임기수, 제공게임물명 등 세부적인 시설 정보를 포함한 데이터이다. 이 자료는 단순히 업소 수를 파악하는 수준을 넘어, 청소년 보호를 위한 시설 기준(청소년실 설치, 유해환경 차단), 안전·위생·소방 기준 충족 여부, 소음·조명 등 환경요인을 종합적으로 점검할 수 있도록 설계되어 있다.좌표·주소 기반 정보는 게임제공업소의 공간 분포를 분석하여 학교 주변·주거지역·상업지역과의 인접성을 파악하고, 청소년 유해환경 관리 정책과 연계해 고위험 지역을 식별하는 데 활용된다. 또한 영업상태 및 상세영업상태 정보는 업소 단속, 행정처분 이력 관리, 자율규제 효과 분석 등에 활용할 수 있다. 이 데이터는 청소년 보호정책, 도시환경·상권 관리, 안전·소방 행정이 함께 결합된 복합 정책 영역의 핵심 기반 자료이다.'
