summary_user: 국립중앙극장 공연예술박물관이 소장한 공연예술자료를 만든 공연을 한 건씩 담은 목록으로, 공연정보번호·공연유형·제목·공연 기간(시작·종료일)·수행단체·소장 폴더번호를 제공한다. 공연사 연구자나 아카이브 이용자가 특정 단체나 작품의 과거 공연 기록이 박물관에 남아 있는지, 어느 폴더에 있는지 찾을 때 쓴다. 다른 데이터와 잇는 공통 키는 없다. KOPIS 공연ID(mt20id) 같은 외부 키도 들어 있지 않아, 다른 공연 데이터와는 제목·수행단체·공연 기간을 이름으로 맞춰 연결한다.
limits: KOPIS 공연ID나 공연장 코드가 없어 공연 목록·예매 데이터와 정확히 조인되지 않고 이름 매칭에 의존한다. 갱신은 연 단위이므로 최근 공연은 아직 반영되지 않았을 수 있다. 공연장 위치 정보가 없는 비공간 데이터라 지역별 분석에는 쓸 수 없다.
