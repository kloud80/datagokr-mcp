summary_user: 대전광역시 동구 관내에 설치된 야외운동기구를 설치 장소별로 한 행씩 담은 현황 파일로, 행정동·시설명·상세주소·설치된 기구 종류를 담는다. 주민이 집 근처 공원이나 쉼터에 어떤 운동기구가 있는지 찾거나, 구청·분석가가 행정동별 운동기구 설치 분포와 유지보수 대상을 살피는 데 쓴다. 전역 조인 키가 없어 다른 체육시설·공원 데이터와는 행정동 이름이나 상세주소를 맞춰 연결해야 한다.
description_portal: 대전광역시 동구 관내 설치된 야외운동기구 현황을 체계적으로 제공하기 위해 구축된 데이터로, 행정동, 시설명, 상세주소, 설치된 운동기구 종류 등 다양한 정보를 포함하고 있습니다. 이 데이터는 주민들의 건강증진과 여가생활 지원을 위한 기초 자료로 활용되며, 지자체는 체육 인프라 확충 계획 수립과 유지보수 대상 선정, 운동기구 활용도 조사 등 다양한 행정 업무에 적극 활용할 수 있습니다. 또한 생활체육 활성화와 주민 만족도 제고에도 기여하여 지역사회 건강 증진과 쾌적한 생활환경 조성에 중요한 역할을 합니다.
