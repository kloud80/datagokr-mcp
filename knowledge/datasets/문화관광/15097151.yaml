summary_user: 제주 서귀포 태흥2리 옥돔마을 포구길 무장애 여행코스를 지점(포인트) 단위로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부가 들어 있다. 휠체어 이용자나 영유아 동반 가족이 이 해안 산책로의 추천 동선과 주차·화장실 위치를 미리 확인해 방문 계획을 세우거나, 무장애 관광 콘텐츠를 만드는 사람이 코스 지도를 그리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도 좌표나 코스·장소 이름으로 맞춰 이어 써야 하며, TourAPI 관광지 원장과도 contentId 같은 공통 키로 직접 연결되지 않는다.
description_portal: '"제주특별자치도 내 태흥2리옥돔마을포구길_무장애여행코스 데이터를 제공합니다.* 제주특별자치도 태흥2리 옥돔마을 포구길은 장애인·노약자·영유아 동반 가족 등 관광약자를 위한 무장애 여행코스로 설계된 해안 산책로입니다. 이 코스는 포구와 어촌 마을의 풍경을 가까이에서 즐길 수 있도록 평탄한 동선으로 구성되어 있으며, 주차장과 장애인화장실 등의 편의시설이 접근성 있게 제공됩니다. 본 자료에는 위치, 주차·화장실의 접근성, 추천 동선, 휴무일 및 요금 정보를 포함하여 이동이나 시설 이용에 제약이 있는 이용자도 사전에 방문 계획을 수립할 수 있도록 합니다. 이 정보는 무장애 관광 콘텐츠 제작, 관광서비스 개선, 지역 관광정책 수립 및 평가에 활용될 수 있는 중요한 기초자료입니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
