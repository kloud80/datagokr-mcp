summary_user: 한국문화예술위원회 예술자료원이 소장한 도서·예술 자료를 건별로 담으며, 자료명·저자·발행일·주제와 분류·형태·언어·권리·소장 위치 등의 서지 정보를 제공하고 범위는 전국·비공간이다. 연구자나 문화예술 종사자가 특정 작가나 주제의 공연·미술 관련 자료를 예술자료원이 소장하고 있는지, 어떤 형태로 열람할 수 있는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 자료명·저자 같은 이름 매칭으로만 잇고, 자료별 식별값(localId, uci)과 상세 링크(url)는 온라인 서비스 연계에 참고한다.
description_portal: 문화체육관광부가 제공하는 예술자료원 소장자료 데이터는 저자, 발행일, 주제, 분류 정보 등 다양한 도서 및 예술 관련 자료의 상세 정보를 포함하고 있습니다. 자원의 명칭, 책임자, 소속, 주제어, 구현 형태, 언어, 참조 정보, 권리, 위치 정보 등 폭넓은 항목을 통해 예술자료의 체계적 관리와 활용이 가능합니다. 연구자, 학생, 문화예술 종사자 등은 이 데이터를 활용하여 예술자료의 현황 파악, 학술 연구, 정책 수립, 문화콘텐츠 개발 등 다양한 목적으로 활용할 수 있습니다. 또한, 디지털 구현형과 참조식별정보 등은 온라인 서비스 개발에도 유용하게 쓰일 수 있습니다.
