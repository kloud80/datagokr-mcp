summary_user: 신안군 전역의 주요 관광명소를 한 곳당 한 행으로 담은 지자체 관광지 목록 파일로, 명소명·주소·상세설명·위도·경도를 개별 주소·좌표 단위로 제공한다. 여행자가 '신안 1004섬 중 어느 섬에 어떤 볼거리가 있고 정확한 위치는 어디인가'를 확인하거나, 지역 관광 서비스 개발자가 지도에 명소를 표시할 때 쓴다. 전역 조인 키나 코드가 없어 TourAPI 등 다른 관광 데이터와는 명소명·주소 문자열 매칭이나 위경도 근접 비교로만 연결한다.
limits: contentId·지역코드 같은 공통 키가 없어 TourAPI 관광지 원장과 자동으로 이어 붙일 수 없고, 이름·주소 매핑이 필요하다. 범위는 신안군 한 시군구에 한정되며, 관광 콘텐츠 부문에서는 TourAPI가 대표 원장이고 이 파일은 보조 자료로 분류돼 있다.
