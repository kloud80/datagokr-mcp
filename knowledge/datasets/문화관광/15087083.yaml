summary_user: 빅카인즈(BIGKinds)에서 모은 올림픽 관련 뉴스를 기사 한 건당 한 행으로 담은 원천 자료로, 보도 일자·언론사·기고자·제목·통합 분류·사건사고 분류·인물·지역·기업기관 개체명·키워드·본문·원본 주소를 포함하며 CSV 파일 크기는 약 33MB다. 언론 연구자나 정책 분석가가 '한국 언론이 올림픽의 메달 경쟁, 도핑, 대회 운영 중 어떤 측면을 언제 집중 보도했는가'를 시계열로 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 언론사명·개체명(인물·지역·기업기관)·일자 같은 이름 기반 매핑으로만 이어 쓴다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 올림픽 관련 뉴스 메타정보 자료입니다. 포함된 항목으로는 주소, 보도 일자, 언론사, 기고자, 제목, 통합분류1~3, 사건/사고 여부, 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용, 원본 주소 등이 있어, 개별 기사 단위의 구조적 분석이 가능합니다.이 데이터를 통해 언론 보도가 올림픽의 어떤 측면—예컨대 메달 경쟁, 선수 선발 및 경기 성적, 개최 도시 인프라, 대회 운영 이슈, 도핑 사건, 스포츠 외교 등—을 주로 다뤘는지를 시계열적으로 분석할 수 있습니다. 또, 주요 선수 및 국가, 경기 종목 등이 언론 담론 속에서 어떻게 부각되었는지, 사건/사고 중심 보도가 얼마나 빈번한지를 같이 볼 수 있습니다. 이는 스포츠 사회학, 문화외교, 언론 연구, 정책 연구 등 다양한 분야에서 유용한 기초 데이터로 활용될 수 있으며, 한국 언론의 스포츠 보도 경향과 대중 인식 변화를 정밀하게 이해하는 데 기여할 수 있습니다.
