summary_user: 경기아트센터의 연도별 간부 인원, 여성 간부 인원, 여성 비율(%)을 간부 구분별로 담은 기관 단위 집계 자료다. 성평등 정책을 살피는 분석가나 도민이 '경기아트센터의 여성 간부 비율이 해마다 늘었는가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 기관의 여성 간부 비율 자료와는 연도(yr)와 기관명을 맞춰 나란히 비교하는 방식으로만 잇는다.
description_portal: 이 데이터는 경기아트센터의 연도별 여성 간부 비율 현황을 집계한 자료로, 조직 내 성별 다양성과 인사 정책 변화를 가늠할 수 있는 중요한 지표를 제공합니다. 각 연도별 전체 간부 인원과 여성 간부 인원, 여성 비율(%)이 함께 기록되어 있습니다. 본 데이터는 여성의 리더십 참여 확대 여부, 성평등 지표, 문화예술기관 내 인사 운영 방향, 조직 내 의사결정 구조의 변화 등을 살펴볼 수 있는 근거 자료로 활용될 수 있으며, 특히 여성 간부 비율의 증감 추이를 통해 성별 균형 정책의 효과를 평가하거나 향후 개선 방안을 논의하는 데 참고할 수 있습니다.
