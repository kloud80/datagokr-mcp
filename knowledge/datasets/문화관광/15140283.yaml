description_portal: 인천관광공사는 2021년도 스마트여행앱 인천e지를 오픈하고, 서비스를 진행하고 있습니다.본 파일데이터는 인천e지 앱 상에서 확인 가능한 가맹점 중 인천e지 파트너스 멤버로 가입한 가맹점의 정보를 제공합니다.인천e지 앱 내의 노출 되는 가맹점 중 파트너스 멤버로 가입한 가맹점 정보를 제공 합니다.제공하는 정보로는, 가맹점 명칭, 가맹점 주소, 업체 카테고리, 운영시간, 홈페이지주소, 업체 소개, 업체 상세정보, 업체위치(위도 및 경도) 등을 제공하고 있습니다.추후 인천e지 파트너스 정보를 지속적으로 현행화하여  제공할 예정입니다.관련 문의는 공공데이터 플랫폼을 통해 해주시기 바랍니다.
