summary_user: 서울특별시 중구에서 청소년이용불가·전체이용가 게임물을 설치해 제공하는 일반게임제공업소(성인게임장·오락실)의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 관리번호, 인허가·취소일, 영업상태(영업·폐업 등), 소재지·도로명주소, 중부원점TM 좌표, 시설면적·층수·방 수 같은 시설 항목이 들어 있다. 중구에서 게임장 창업을 준비하는 예비 사업자가 "중구에 현재 영업 중인 게임제공업소는 몇 곳이고 어디에 몰려 있나"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 주소·업소명 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중구의 성인게임장, 오락실 등 청소년이용불가의 게임물과 전체이용가의 게임물을 설치하여 제공하는 업소 정보입니다. 각 등록업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화생활 여가활동 관련 문화공간 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 이용시간 및 청소년이용 관련 운영수칙을 준수하며 건전한 전자유희 문화공간의 위치를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
