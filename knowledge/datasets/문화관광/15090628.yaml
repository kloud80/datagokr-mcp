summary_user: 충청북도에 있는 국가지정 문화유산(국보·보물·사적·명승·천연기념물·무형유산·민속문화유산)을 유산 한 건당 한 행으로 담은 목록 파일이다. 종목·명칭·소재지·소유자·관리단체·지정일·지정규모가 들어 있다. 연구자나 관광·지자체 담당자가 '충북 어느 시군에 어떤 국보·보물이 있고 언제 지정됐는가'를 확인하거나 분포를 집계하는 데 쓴다. 전역 조인 키가 없어서 국가유산청 자료(종목코드·지정번호 체계)와는 명칭과 종목을 맞춰 연결하고, 지역 단위 분석은 소재지 주소 문자열로 붙인다.
description_portal: 문화유산의 보존 및 활용에 관한 법률에 의거하여 국가유산청장이 지정 관리하는 국가지정 문화유산의 현황을 체계적으로 정리한 것입니다. 국가지정 문화유산은 우리나라 문화유산 가운데 역사적 학술적 예술적 경관적 가치가 뛰어나 국가차원에서 보존과 관리가 이루어지는 유산으로 문화유산법에 따라 엄격한 심의를 거쳐 지정됩니다. 국가지정 문화유산은 국보, 보물, 사적, 명승, 천연기념물, 무형유산, 민속문화유산으로 관리됩니다. 이를 통해 국가지정 문화유산의 분포 현황을 한눈에 파악할 수 있으며, 국가적 차원에서의 보존 및 활용 체계 정비에도 활용됩니다.
