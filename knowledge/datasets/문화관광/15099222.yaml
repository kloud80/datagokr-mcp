description_portal: 🏛️ 경상남도 함안군 공공미술 작품 소장 현황 및 상세 정보 목록 (2022년 이전 프로젝트 기준)이 문서는 2022년도 이전에 중앙 정부 및 경상남도, 함안군 등 지방자치단체 주관으로 기획, 추진 및 시행되었던 **'공공미술 프로젝트'**를 통해 제작 및 설치된 작품들을 중심으로, 현재 경상남도 함안군이 공식적으로 소유하고 관리하고 있는 공공미술 작품들의 종합적이고 상세한 현황 정보를 제공할 목적으로 작성되었습니다.제공되는 핵심 정보는 각 개별 작품의 공식 명칭과 더불어, 관람객이 실제로 작품을 확인할 수 있는 구체적인 설치 위치(주소 또는 장소), 그리고 작품이 최종적으로 대중에 공개된 설치된 시기(연월일) 정보를 명확하게 포함하고 있습니다. 나아가, 작품의 예술적, 기능적 분류 정보가 함께 수록되어 있어, 함안군의 문화예술 자산을 체계적이고 심층적으로 파악하며, 향후 지역 문화 정책 수립, 관광 자원화, 도시 미관 개선 사업 등에 필수적인 정확한 기초 자료로 활용하는 데 큰 도움을 줄 것입니다.함안군의 공공미술 자산 현황을 투명하고 자세하게 확인할 수 있도록 모든 관련 자료를 정밀하게 취합하여 제공합니다.
