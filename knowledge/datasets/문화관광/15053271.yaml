summary_user: 대구광역시 달서구 안의 근린공원·어린이공원·녹지 등에 설치된 생활체육시설을 시설별로 한 건씩 담은 파일로, 시설명·소재지·위도·경도·설치연도·세부시설명·주관부서를 포함한다. 달서구 주민이 집 근처 공원에 어떤 운동시설이 있는지 찾거나, 분석가가 구 안의 생활체육시설 분포와 설치 시기를 살피는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 시설명·소재지 주소나 위도·경도 좌표로 맞춰 이어 쓴다.
description_portal: 지역 주민의 건강과 여가를 위한 대구광역시 달서구 내 운영하는 생활체육시설에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 구분, 시설명, 소재지, 설치연도, 세부시설명, 주관부서, 기준일자 등으로 구성되어있으며 1년마다 주기에 따라 현행화합니다.해당 자료는 달서구청 홈페이지(www.dalseo.daegu.kr)를 통해 분야별정보> 생활체육> 근린공원 내 체육시설, 어린이공원 내 체육시설, 녹지 및 조경 내 체육시설에서 확인할수있습니다.
