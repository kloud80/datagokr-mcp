summary_user: 영상물등급위원회 온라인등급분류시스템에 등록된 등급분류 신청 사업자를 사업자 한 곳당 한 행으로 담은 전국 단위 명단이며, 사업자번호·신청사명과 영화·비디오·공연 매체별 신청 여부를 담는다(CSV 파일 약 259KB). 분석가나 사업자가 '특정 회사가 영화나 비디오물 등급분류를 신청한 적이 있는 사업자인가', '공연 등급분류를 신청하는 사업자는 어디인가' 같은 질문에 쓴다. 전역 조인 키는 확인되지 않았고, 사업자번호나 신청사명을 기준으로 다른 사업자 명단과 이름·번호를 맞춰 이어 쓴다.
description_portal: 영상물등급위원회는「영화 및 비디오물의 진흥에 관한 법률」제71조에 따라 ‘영상물의 공공성과 윤리성을 확보하고 청소년을 보호’하기 위해 설립되었으며동법 제72조의 영상물등의 등급분류 및 내용정보, 청소년 유해성 확인 심의 등의 직무를 수행하는 문화체육관광부 산하 공공기관입니다.해당 데이터는 영상물등급위원회의 온라인등급분류시스템에 등록된 등급분류를 신청하는 사업자 데이터 입니다.사업자번호, 신청사명, 신청 매체 여부(영화, 비디오, 공연)의 정보가 제공되며 해당 데이터를 통하여 등급분류 신청 사업자의 정보를 조회할 수 있습니다.
