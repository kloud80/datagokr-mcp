summary_user: 완주군 읍면별로 설치된 실외(야외) 운동기구를 기구 한 건씩 담은 파일 데이터로, 위치·설치장소·기구명·관리번호를 기록하며 범위는 완주군 한 개 시군구다. 주민이나 생활체육 담당자가 '우리 동네 공원이나 마을에 어떤 야외 운동기구가 어디에 있나'를 확인하거나, 읍면별 기구 배치 현황을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 위치·설치장소 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
limits: 표준 행정코드나 시설 코드 같은 조인 키가 없어 다른 지역·전국 체육시설 DB와 자동 연결이 어렵고 이름 매핑이 필요하다. 범위는 완주군에 한정되고 좌표가 없는 비공간 자료라 지도에 바로 올릴 수 없다.
