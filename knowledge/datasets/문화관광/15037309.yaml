summary_user: 전라남도 시군에 있는 야구장을 시설 한 곳당 한 행으로 담은 현황 파일로, 시군구·시설명·소유기관·관리주체와 부지·건축·연면적, 내야·외야 바닥재료, 중앙길이, 좌석수, 수용인원, 준공연도를 싣는다(약 3KB 크기의 CSV). 사회인 야구 동호인이나 지역 체육 분석가가 '우리 시군에 천연잔디 야구장이 있는지, 관중석은 몇 석인지'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군구 이름이나 시설명을 맞춰 다른 공공 체육시설 현황이나 전국체육시설 자료와 이어 써야 한다.
description_portal: '- 전라남도 시군의 야구장에 대한 데이터를 조회하실 수 있습니다.- 시군명, 시설명, 소유기관, 관리주체, 부지면적/건축면적/연면적, 경기장 내야/외야 바닥재료, 중앙길이, 좌석수, 수용인원, 준공연도 등에 관한 데이터를 제공합니다.- 전라남도에는 다양한 야구장이 있으며, 각 시군별로 야구를 즐길 수 있는 시설이 마련되어 있습니다. - 각 야구장의 이용 및 예약 방법은 해당 시군의 체육시설 관리 부서나 공식 홈페이지를 통해 확인하실 수 있습니다. 일반적으로 온라인 예약 시스템을 통해 사전 예약이 가능하며, 일부 시설은 전화 예약도 지원합니다.- 시설 이용 시간: 대부분의 야구장은 평일과 주말에 운영되며, 특정 시간대에는 지역 학교나 클럽팀의 훈련으로 인해 일반 이용이 제한될 수 있습니다.'
