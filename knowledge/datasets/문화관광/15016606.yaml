summary_user: "한국문화관광연구원 관광지식정보시스템이 발간하는 관광 이슈 보고서(투어고 인사이트)를 보고서 한 건당 한 행으로 정리한 목록 파일로, 구분·제목·발간일·저자·키워드·자료주소를 담는다. 관광 정책 담당자나 연구자가 '최근 특정 관광 이슈(예: 외래관광객, 지역관광)에 대해 연구원이 어떤 보고서를 냈는가'를 키워드와 발간일로 찾아 원문 링크로 들어가는 데 쓴다. 다른 데이터와 잇는 전역 조인 키나 코드표가 없어, 키워드·제목 문자열로 다른 관광 통계나 보고서 목록과 대조해 쓴다."
description_portal: ㅇ 한국문화관광연구원 관광지식정보시스템에서 발간중인 관광관련 주요 이슈 보고서 현황(투어고 인사이트)의 발간일, 주요 키워드, 링크주소 정보- 본 데이터는 한국문화관광연구원이 수집·분석한 주요 관광 이슈에 대한 보고서 발간 현황을 정리한 공공데이터이다. 관광산업의 변화 양상과 사회·정책적 이슈에 따라 작성된 다양한 주제의 보고서 제목, 발간일, 주요 내용, 관련 기관 등의 정보를 포함한다. 각 보고서는 시의성 있는 이슈를 중심으로 전문가 분석을 바탕으로 작성되었으며, 정책 수립, 연구 활용, 학술 참고 등에 유용하다. 또한 보고서별 키워드, 발간주기, 연구 범위 등 다양한 메타정보를 함께 제공함으로써 이용자의 검색 편의성과 내용 이해도를 높이고 있다. 한국문화관광연구원은 이를 통해 관광 분야의 주요 동향을 체계적으로 파악하고, 데이터 기반의 정책 수립과 행정 의사결정에 기여하고자 한다.
