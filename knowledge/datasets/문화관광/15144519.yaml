description_portal: 아르피나 시설 이용자 현황 입니다. 해당 데이터는 연도 2021년 ~ 2024년 구분(엑셀시트 구분)에 따라 객실, 스포츠, 문화(청소년 활동) 분류에 따른 청소년, 성인 이용 현황 입니다.그 외에 2004 년 7월 설립 이래로 방문자 수 데이터를 포함하고 있습니다.아르피나가 부산관광공사에서 부산도시공사로 이관 된 2022년부터 2024년까지는 월별 데이터로 구분 되어있고 그 2021년 이전 부산관광공사 데이터 내용은 연도별로 구분됩니다. *아르피나는 2021년 10월 1일부로 부산관광공사에서 부산도시공사로 이관됨
