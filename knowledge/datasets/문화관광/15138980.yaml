summary_user: 국내에서 열리는 마라톤 대회를 대회 한 건당 한 줄로 담은 목록 파일로, 대회명·대회일시·대회장소·종목·주최를 전국 범위로 담는다(CSV 약 2KB 규모의 작은 파일). 마라톤 참가를 계획하는 시민이 "이번 시즌 내 지역 근처에서 하프·풀코스 대회가 언제 어디서 열리나"를 확인하거나, 행사 기획자가 대회 일정과 장소 분포를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키나 행정구역 코드가 없어, 다른 데이터와는 대회장소의 지역명이나 주최 기관명을 문자열로 맞춰 이어 써야 한다.
description_portal: 국내에서 개최되는 마라톤 대회에 관한 상세 정보를 제공하며, 대회명, 대회일시, 대회장소, 종목, 주최 등 주요 정보를 포함하고 있습니다. 지자체 및 민간단체가 주최하거나 문화체육관광부가 후원하는 다양한 마라톤 대회의 최신 현황을 한눈에 확인할 수 있어, 마라톤 참가를 계획하는 시민, 체육 관련 연구자, 스포츠 행사 기획자 등에게 유용하게 활용될 수 있습니다. 대회 일정 파악, 장소 비교, 종목별 특성 분석 등 다양한 목적으로 활용 가능하며, 국내 마라톤 문화의 활성화와 건강 증진, 지역사회 교류 증진에도 기여할 수 있습니다.
