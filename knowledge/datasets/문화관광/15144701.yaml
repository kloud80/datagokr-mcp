description_portal: '예술의전당 문화가있는날 전시 입장객수- 관련 데이터: 전시명, 전시일, 유무료여부, 가격, 문화의날 여부, 문화의날 할인정보, 유료입장객, 무료입장객- 데이터 기간: 2023.3 ~2025.3- 이 데이터는 2023년 3월부터 2025년 3월까지 예술의전당에서 개최된 전시와 관련된 정보를 기반으로 하여, ‘문화가 있는 날’ 행사로 할인이 제공된 전시에 대한 유료, 무료 입장객수 정보 입니다.‘문화가 있는 날’은 매월 마지막 수요일, 국민의 문화 향유 기회를 확대하기 위해 공연, 전시, 영화 등 다양한 문화 행사를 할인 또는 무료로 제공하는 문화체육관광부의 정책입니다.해당 데이터를 활용하여 ‘문화가 있는 날’ 행사와 입장객 수 변화의 상관관계를 분석할 수 있습니다. (앞으로 진행될 "문화가 있는 날" 행사 정보를 지속적으로 업데이트할 예정)'
