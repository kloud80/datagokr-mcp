description_portal: '- 본 데이터는 한국관광공사에서 선정한 비대면 안심관광지 목록입니다. - 코로나19 유행 후 한적한 개방형 공간에서의 관광 수요가 늘어남에 따라, 사회적 거리두기를 지키면서 자연을 즐길 수 있는 숨은 명소를 2021년 겨울시즌부터 2022년 여름시즌까지 선정하였습니다. - 선정시즌, 관광지명, 주소, 연락처, 홈페이지 주소(url)를 포함하고 있습니다. - 비대면 관광, 혼잡 회피 성향을 갖는 여행객을 위한 무장애(베리어프리) 관광 데이터로 이용할 수 있으며, 관련 앱·웹 서비스 개발 등에 활용할 수 있습니다.'
