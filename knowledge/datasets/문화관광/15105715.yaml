summary_user: 한국관광공사가 2021년 겨울시즌부터 2022년 여름시즌까지 선정한 비대면 안심관광지를 관광지 한 곳당 한 행으로 담은 전국 목록이며, 검증 시 114건 전체가 수신됐다. 혼잡을 피해 한적한 야외 관광지를 찾는 여행객이나 관련 앱·웹 서비스 개발자가 어느 지역에 어떤 안심관광지가 있는지 확인하는 데 쓴다. 주소(address)가 조인 키이므로 주소 기준으로 다른 관광지·지역 데이터와 이어 쓰며, TourAPI의 contentId 같은 별도 키는 이 파일의 필드에 없다.
