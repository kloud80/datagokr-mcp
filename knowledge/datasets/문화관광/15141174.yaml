summary_user: 서울 양천구 관내 수영장업의 인허가 내역을 업소 한 곳당 한 행씩 담은 건별 원천 자료로, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소와 좌표, 소재지면적, 지도자수, 보험 가입 여부 등을 포함한다. 양천구에서 지금 영업 중인 수영장이 어디에 있고 보험에 가입돼 있는지 확인하려는 주민이나, 지역 체육시설업의 개업·폐업 흐름을 상권 신호로 보려는 분석가가 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아, 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 본 데이터는 서울특별시 양천구에서 관내 수영장업의 인허가 현황을 체계적으로 관리하기 위하여 구축된 행정자료이다. 자료에는 업체명, 인허가 일자, 영업상태, 주소, 전화번호, 소재지면적, 업태구분, 지도자수, 보험 가입여부 등 주요 항목이 포함된다.본 정보는 공중위생법 및 관련 규정에 따른 시설기준 충족 여부를 확인하고, 이용자의 안전과 위생을 보장하기 위한 행정업무의 근거자료로 활용된다. 또한 지역 내 수영장업 운영 실태를 파악하여 지도점검 계획을 수립하고, 사고 예방 및 운영 개선을 위한 정책 마련에 필요한 정보를 제공한다. 인허가 변동사항은 주기적으로 갱신하여 최신성을 유지하며, 표준화된 구조로 제공함으로써 이용자가 지역의 수영장 운영체계를 명확히 이해할 수 있도록 지원한다.* 수영장업 - 수영장 등 수영 같은 레크레이션을 즐기기 위해 인공적으로 물을 채워 제공하는 업소
