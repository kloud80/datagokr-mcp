summary_user: 전국 문화기반시설 총람을 시설 한 곳당 한 건으로 담으며, 실호출로 확인된 응답에는 문학관별 기준연도·발간연도, 국공립 구분과 설립주체, 소장자료·프로그램·연간 방문인원, 정규직·비정규직 운영인력, 대지·시설면적, 주소·전화·홈페이지가 들어 있다. 지역 문화자원을 조사하는 분석가나 정책 담당자가 '우리 시군구 문학관의 연간 방문객과 운영 인력은 어느 정도인가'를 확인하는 데 쓴다. 시군구코드(sggCd)로 다른 시군구 단위 통계와 잇고, 주소(addr)로 위치 기반 자료와 맞춰 쓴다.
description_portal: 이 데이터셋은 전국 문화기반시설 총람의 정보를 제공하며, 문화체육관광부가 매년 수집·발간하는 자료를 기반으로 합니다. 주요 컬럼에는 시설명, 소재지, 연락처, 홈페이지, 개관일정, 관람료, 시설규모, 소장자료, 이용현황, 주요 프로그램, 운영인력 등이 포함되어 있습니다. 이를 통해 도서관, 박물관, 미술관, 생활문화센터 등 다양한 문화시설의 세부 정보를 확인할 수 있습니다. 문화정책 수립, 지역 문화자원 조사, 문화시설 안내 서비스 등 다양한 분야에서 활용할 수 있으며, 데이터는 정기적으로 갱신됩니다.
