summary_user: 전남광주통합특별시에 등록된 여행업체를 업체 한 곳당 한 행으로 담은 파일로, 지역·업종중분류·업체명·도로명 소재지 주소와 데이터기준일자를 포함한다(시도 범위, 개별 주소 단위). 여행객이나 관광 분석가가 '우리 지역(시군)에 등록된 여행사가 어디에 몇 곳 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 관광사업 등록 데이터와는 업체명·주소 문자열 매칭이나 같은 기관 자료끼리로만 이어 쓴다.
description_portal: '0 관광진흥법 제3조(관광사업의 종류) 제1항제1호 여행업 : 여행자 또는 운송시설, 숙박시설, 그 밖의 여행에 딸리는 시설의 경영자 등을 위하여 그 시설 이용 알선이나 계약 체결의 대리, 여행에 관한 안내, 그 밖의 여행 편의를 제공하는 업0 관광진흥법 제4조(등록) 제1항 제3조제1항제1호부터 제4호까지의 규정에 따른 여행업, 관광숙박업, 관광객 이용시설업 및 국제회의업을 경영하려는 자는 특별자치시장, 특별자치도지사, 시장, 군수, 구청장(자치구의 구청장을 말한다. 이하 같다)에게 등록하여야 한다.'
