summary_user: 경기도 31개 시군의 체육도장업(태권도·검도 등) 인허가 사업장을 업체 한 곳당 한 행으로 담은 건별 명부로, 인허가일·폐업일, 영업상태, 주소와 위경도, 지도자 수, 회원모집 인원, 보험가입 여부를 포함한다. 학부모나 창업 예정자가 "우리 동네에서 지금 영업 중인 태권도장이 몇 곳이고 최근 폐업한 곳은 어디인가"를 확인하거나, 분석가가 시군별 도장 분포와 개폐업 추이를 볼 때 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·주소·사업장명으로 다른 체육시설업이나 상권 데이터와 맞춰 잇고, 위경도로는 지도 위에서 공간 결합한다.
description_portal: 이 데이터는 경기도 내 31개 시군의 체육도장업체에 대한 인허가 현황을 제공하는 자료입니다. 태권도, 검도 등 신체 및 정신 단련을 위한 체육도장의 사업장명, 인허가일자, 영업상태, 소재지 정보, 지도자 수, 회원모집 인원, 건축물 정보, 업태 및 세부업종명 등 총 32개 항목으로 구성되어 있습니다. 주요 활용방안으로는 지역별 체육도장 분포 파악, 영업상태 변화 추이 분석, 체육시설 정책 수립 자료로의 활용이 있습니다. 또한 위치정보(WGS84 위도·경도, 좌표값 등)를 포함하고 있어 공간 분석이 가능하며, 공사립 구분과 보험가입 여부 등도 확인할 수 있습니다. Open API로도 제공되어 시스템 간 연계 활용이 가능합니다. 데이터는 행정안전부에서 주간 단위로 갱신되며, 지방행정 데이터 개방시스템을 통해 수집됩니다.
