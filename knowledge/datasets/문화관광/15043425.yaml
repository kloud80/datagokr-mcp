summary_user: 정읍시 내장산 국민여가캠핑장 한 곳 안의 개별 시설(야영 사이트·편의시설 등)을 시설 단위로 담은 소규모 CSV 파일(약 1.2KB)로, 시설분류·시설명·최대이용수·사용가능여부·도로명주소·관리기관 연락처를 담는다. 캠핑객이나 여행 서비스 사업자가 '내장산 캠핑장에 어떤 시설이 몇 명까지 이용 가능하고 지금 쓸 수 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 도로명주소나 시설명·관리기관명을 이름으로 맞추는 방식으로만 이어 쓴다.
