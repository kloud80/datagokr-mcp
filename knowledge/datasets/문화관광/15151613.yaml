summary_user: 경기도 주요 관광지점을 지점 한 곳당 한 행으로 정리한 목록으로, 관광지점번호·이름·관광유형·관광권역 코드, 주소·전화·홈페이지, 체류시간, 일부 지점의 성별·총 유동인구, 위경도와 공간 좌표를 담는다. 경기도 관광정책 담당자나 분석가가 "권역별로 체류시간이 길고 유동인구가 많은 관광지는 어디인가"를 확인하거나, 위치 기반 관광 서비스에 지점 위치를 넣을 때 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, TourAPI 관광 콘텐츠 같은 다른 데이터와는 관광지점명·주소 매칭이나 위경도 근접 매칭으로 이어야 한다.
description_portal: 이 데이터는 경기도 데이터 분석 포털에서 활용하기 위해 경기도의 주요 관광지점 정보를 정리한 자료로, 각 관광지점을 구별할 수 있는 관광지점번호, 관광지점명, 관광유형코드 및 관광권역코드를 포함합니다. 각 지점에 대한 주소, 전화번호, 홈페이지 URL, 체류시간값 등의 정보가 포함되어 있으며, 일부 지점에 대해서는 여성 및 남성 유동인구 수와 총 유동인구 수 등의 통계자료도 함께 제공됩니다. 또한, 위도와 경도 정보 및 공간 좌표(모양) 정보도 수록되어 있어 공간 분석 및 관광지 위치 기반 서비스에 활용할 수 있습니다. 해당 데이터는 관광지별 특성과 위치정보, 이용 패턴 등을 파악하고, 관광 인프라 구축, 관광정책 수립, 지역 홍보전략 수립 등에 유용하게 활용될 수 있습니다.
