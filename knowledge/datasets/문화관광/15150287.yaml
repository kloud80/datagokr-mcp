summary_user: 대한장애인체육회에 등록된 선수·지도자·심판·등급분류사·생활체육인 현황을 등록연도별로 성별·장애유형별·종목별·시도별·연령별 통계구분에 따라 남성수·여성수·합계로 집계해 담으며, 개인 단위가 아닌 전국·시도 단위 집계다. 정책 담당자나 분석가가 '시도별·장애유형별로 장애인 선수와 지도자가 얼마나 등록돼 있고 남녀 비율은 어떤가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시도명·종목명 같은 이름 매핑으로만 이을 수 있고, 조회에 필요한 통계구분코드(search_stats_cd)는 다른 데이터에서 먼저 받아 넘겨야 한다.
description_portal: 대한장애인체육회에서 제공하는 체육인 현황 통계로 선수통계자료, 지도자통계자료, 심판통계자료,등급분류사통계자료, 생활체육인통계자료 정보를통계구분별(성별/장애유형별/종목별/시도별/연령별)로 2025년도 부터 등록된 통계정보를 조회할 수 있는 서비스 입니다.해당데이터는 대한장애인체육회에 등록된 데이터를 기반으로 제공되며 대한장애인체육회 사이트 www.koreanpc.kr에서도 API신청 및 이용이 가능합니다(선수개인정보에 해당하는 데이터는 제공되지 않습니다)
