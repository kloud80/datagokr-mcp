summary_user: 인천광역시 부평구 관내 숙박업소를 업소 한 곳당 한 행으로 담은 파일로, 업종명·신고일자·업소명·도로명 주소·전화번호·영업자 시작일·객실 수를 포함한다. 부평구에서 숙박업 유형별 업소가 어디에 몇 곳 있고 객실 규모가 어느 정도인지 알고 싶은 분석가나 사업자, 위생·관광 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞춰 붙여야 하며, 공중위생법 신고 기반의 지방행정 인허가(LOCALDATA) 숙박업 자료와 대조하는 용도로 쓴다.
limits: 실측 컬럼에 사업자번호나 관리번호 같은 공통 키가 없어 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에 의존해야 한다. 범위는 부평구 한 곳뿐이므로 인천 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다.
