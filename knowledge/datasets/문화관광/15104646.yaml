description_portal: 독립기념관에서 보유한 구망일보에 관한 자료로 관리번호, 자료명, 발행일, 기사내용에 관한 정보를 담고 있습니다.구망일보』는 중국군 일본군 간의 공방전이 한창 진행 중이던 1937년 8월 24일 상해에서 창간되었다. 신문사 소재지는 南京東路 大陸商場 6樓였다. 일간으로 4면(1장)을 발간하였다 『구망일보』는 명의상으로는 ‘上海文化界救亡協會’의 기관지이나 실제상으로는 중국공산당 지도 하에 운영되었던 문화계 통일전선 신문이었다. 창간 당시 국 공 양당은 모두 인원을 신문사에 파견하였고 공동으로 경비를 충당하였다. 『구망일보』의 사장은 1937년 8월 일본에서 돌아온 郭沫若이 맡았으며, 중공 측의 夏衍이 總編輯, 阿英이 편집주임을, 국민당 측의 樊仲云이 총편집, 汪馥泉이 편집주임 그리고 周寒梅가 경리 업무를 맡았다. 그러나 후기에는 국민당 측의 인원들은 속속 철수하였고 신문 편집 활동은 중국공산당의 지도하에 진행되었다.
