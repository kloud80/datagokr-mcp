summary_user: 경기도 내 영화 수입업체를 사업장 한 곳당 한 행으로 담은 인허가 원천 자료로, 사업장명·인허가일자·영업상태·폐업일자·도로명/지번 주소·위경도 좌표·시설면적·층수 등을 포함한다. 문화산업 분석가나 정책 담당자가 "경기도 어느 시군에 영업 중인 영화 수입업체가 몰려 있나"를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)나 주소·사업장명 매칭으로 다른 경기도 인허가·문화시설 자료와 이어 쓰고, 위경도 좌표로 지도 위에 겹쳐 본다.
description_portal: 「영화 수입업체 현황」 데이터는 경기도 내 영화 수입업체의 인허가 정보를 제공하는 자료입니다. 주요 항목은 사업장명(BIZPLC_NM), 인허가일자(LICENSG_DE), 인허가취소일자(LICENSG_CANCL_DE), 영업상태명(BSN_STATE_NM), 소재지도로명주소(REFINE_ROADNM_ADDR), 위도·경도 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT), 문화체육업종명(CULTUR_PHSTRN_INDUTYPE_NM), 시설면적(FACLT_AR), 소방시설여부(FIREFACLT_YN), 편의시설여부(CONVNCE_FACLT_YN) 등입니다. 경기도 31개 시군 단위로 구성되어 있어 지역별 영화 수입업체 분포를 확인할 수 있으며, 해외 영화 콘텐츠 유통 현황, 문화산업 연구, 정책 기반 마련, 영화 수입 관련 안전 및 시설 관리 등에 활용할 수 있습니다. 또한 건물 용도, 층수, 주변환경 등의 세부 항목이 포함되어 업체 인프라 분석에도 유용합니다.
