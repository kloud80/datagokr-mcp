description_portal: 올림픽공원에서 진행했던 공연 포스터 정보입니다. 가수, 배우,뮤지컬배우들의 친필사인이 포함된 공연 포스터정보입니다.이적, 이승환, 김조한, 김동률, 이세진, 신화.빅마마, 리쌍,박정현, 인순이, 비스트, 신화, 문희준, 박재범, 정승환, 에일리, 박완규, 사라브라이트만, 서인국, SG워너비, 버스커버스커, 막심므라비차, 스팅, 울랄라세션, 엑소(EXO), 트레비스, 지드레곤,  등 약 200여명의 가수의 친필 sign도 포함되어 있습니다.공연포싸이, 슈퍼주니어스터 정보에는 공연포스터 제목, 공연일시, 공연장소, 공연가수, 등록일, 데이터기준일 등 확인하실수 있습니다.링크를 클릭하시면 공연포스터 이미지를 확인하실수 있으며, 올림픽공원 홈페이지 > 문화공간> 공연포스터 전시관 URL( https://www.ksponco.or.kr/olympicpark/gallery.es?mid=a20301060000&bid=0023 )로 들어오시면정보 확인이 가능하며, 현재 총 201건의 포스터가 저장되어있으며 참고하시기 바랍니다.
