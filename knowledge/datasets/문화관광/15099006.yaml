summary_user: 올림픽공원에서 열렸던 공연의 포스터를 한 장씩 담은 목록 파일로, 포스터 제목·공연일·공연장소·공연가수·포스터 이미지 링크·등록일을 건별로 담는다. 공연 기록을 찾는 팬이나 연구자가 '특정 가수가 올림픽공원에서 언제 공연했고 친필 사인 포스터가 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연 목록(공연ID)과는 공연가수 이름·공연일·공연장소를 맞춰 이어 써야 한다.
limits: 공연ID 같은 공통 키가 없어 다른 공연 데이터와는 이름·날짜 매칭으로만 연결된다. 명세상 이벤트성으로 생성 후 거의 바뀌지 않는 데이터라 최근 공연이 빠져 있을 수 있고, 예매·관객 수 같은 수요 정보는 담지 않는다.
