summary_user: 국립여성사전시관이 정리한 국내 여성 인물연구 정보를 연구 건별로 담으며, 인물연구명·인물연구실명·등록일자·데이터기준일자를 제공하는 전국 단위 비공간 오픈 API다. 여성사 교육 교재나 전시를 준비하는 교사·기획자·연구자가 '어떤 여성 인물이 연구·아카이빙되어 있고 언제 등록됐는가'를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 여성사·인물·문화시설 데이터와는 인물명이나 연구실명으로 맞춰 이어 써야 한다.
description_portal: 국립여성사전시관 인물연구 정보에 대한 서비스를 제공하는 오픈 API형 데이터입니다.해당 개방 데이터는 인물연구명, 인물연구실명, 등록일자, 데이터기준일자 등의 내용을 확인할 수 있습니다.국립여성사전시관의 인물연구 정보는 국내 여성 인물에 대한 학술적·교육적 활용 가능성을 높이는 기초 자료로 기능할 수 있으며, 여성사 연구 흐름을 연대기적으로 정리하거나 여성사 콘텐츠 개발에 유용하게 쓰일 수 있습니다. 또한 다양한 분야에서 관련 전시 기획이나 연구 보고서 작성의 기반이 될 수 있습니다. 따라서 여성 인물 아카이빙, 교육 교재 개발, 역사 콘텐츠 자료로 활용될 수 있습니다.
