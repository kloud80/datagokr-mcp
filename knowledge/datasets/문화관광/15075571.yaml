summary_user: 경기콘텐츠진흥원이 관리하는 경기도 내 공방을 한 곳당 한 행으로 담은 현황 자료로, 회사명·개업년월·기업소개·주요작품·주소·연락처·메이커스/콘텐츠 주요분야·SNS 주소·공개여부를 담는다. 예비 창업자나 지역 정책 담당자가 '우리 시군에 도예·목공 공방이 어디에 얼마나 있나'를 확인하거나, 연구자가 공방의 분야별 분포를 분석하는 데 쓴다. 실측에서 전역 조인 키를 찾지 못해 다른 데이터와는 회사명·주소 같은 이름 매핑으로만 잇는다.
description_portal: 공방사업자 현황 데이터는 경기콘텐츠진흥원이 관리하는 경기도 내 공방의 현황을 제공하는 자료로, 회사명, 사업자등록번호, 개업년월, 기업소개, 주요작품, 주소, 대표전화, 홈페이지, 메이커스주요분야, 콘텐츠주요분야, SNS주소, 공개여부 등으로 구성되어 있습니다. 목공, 도예, 패션, 금속공예, 천연비누, 캘리그라피, 떡케이크 등 다양한 수공예 활동과 창업 정보를 포함하며, 공방산업의 분포와 창작 분야 분석에 활용 가능합니다. 또한 창업지원정책 수립, 지역문화 활성화, 공예산업 연구 및 홍보 자료로도 유용합니다.
