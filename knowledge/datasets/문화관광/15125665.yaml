description_portal: 서울도서관 스마트도서관 소장자료 현황 데이터는 서울도서관 및 무인 스마트도서관에 비치된 도서 및 자료의 목록과 이용 가능 상태를 제공하는 공공데이터입니다. 자료명, 저자, 출판사, 발행년, 청구기호, 분류기호 등 기본 서지 정보와 함께, 소장처명과 자료실 이름을 통해 이용자가 원하는 자료의 정확한 위치를 쉽게 파악할 수 있도록 구성되어 있습니다. 또한 대출상태와 대출상태메시지를 통해 해당 자료가 현재 대출 가능한지, 대출 중인지, 관내열람만 가능한지 등을 한눈에 확인할 수 있어, 시민들이 스마트도서관 서비스를 효율적으로 활용하는 데 큰 도움을 주는 데이터입니다.
