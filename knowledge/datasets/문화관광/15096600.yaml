summary_user: 아르코예술기록원이 소장한 공연 프로그램북의 메타데이터를 주어·술어·목적어 3요소의 RDF 트리플 한 행씩으로 담은 파일로, 포털 설명 기준 959,701개 트리플이며 공연명·출연자·장르·장소·일시·주최기관 등이 속성으로 표현된다. 공연예술 연구자나 아카이브 담당자가 '특정 출연자나 단체가 어떤 공연에 참여했고 그 프로그램북이 기록원에 있는가'를 찾거나, 공연예술 지식그래프·시맨틱 검색을 만들 때 쓴다. 주어와 술어가 URL 식별자라 트리플끼리는 이어지지만, KOPIS 공연ID 같은 외부 전역 조인 키는 실측 컬럼에서 찾지 못해 다른 공연 데이터와는 공연명·장소 등 이름 매핑으로만 연결한다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 KOPIS 공연 목록이나 예매·매출 데이터와 바로 조인할 수 없고 이름 매칭에 기대야 한다. 명세상 수시·이벤트성으로 만들어진 파일이라 정기 갱신을 전제로 최신 공연 현황을 파악하는 데는 맞지 않는다. 행정구역 단위 공간 정보가 없는 비공간 자료다.
