description_portal: 이 데이터는 한국문화예술위원회 아르코예술기록원이 보유한 공연 프로그램북의 메타데이터를 온톨로지 기반으로 정리한 것으로, 총 959,701개의 트리플(Triple) 구조로 구성되어 있습니다. 각 행은 주어(Subject), 술어(Predicate), 목적어(Object)의 3요소로 이루어진 SPO 구조로 표현되며, RDF(Resource Description Framework) 형식을 따르는 메타데이터 모델입니다. 주어와 술어 항목은 URL 링크 형식으로 나타나 있어 각 자원(Resource)과 속성(Property)에 대한 고유 식별자가 부여되어 있으며, 이는 다양한 메타데이터 간의 연계와 의미론적 검색을 가능하게 합니다. 본 메타데이터는 공연 관련 정보의 체계적 기록, 디지털 아카이브의 구축, 공연 예술 자원의 지식 네트워크화 등에 유용하며, 프로그램북에 수록된 공연명, 출연자, 장르, 장소, 일시, 주최기관 등의 정보가 다양한 속성으로 표현되어 있어 공연예술분야의 데이터 기반 연구 및 시맨틱 웹 응용 개발에 활용할 수 있습니다.
