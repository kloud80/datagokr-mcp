description_portal: 본 데이터는 경상남도 의령군 관내에서 문화누리카드를 사용할 수 있는 가맹점의 현황 정보를 제공합니다. 문화누리카드는 기초생활수급자 및 차상위계층의 문화 향유 기회를 확대하기 위한 통합문화이용권으로, 해당 가맹점 정보는 문화복지 정책 수립 및 문화 접근성 향상에 기초자료로 활용됩니다. 본 데이터는 가맹점명칭과 가맹점의 온오프라인 구분, 대분류, 중분류, 소분류 및 가맹점의 도로명 주소, 전화번호와 관리기관 정보로 구성되어 있습니다. 본 데이터는 정기적으로 갱신되며, 공공기관 및 일반 국민에게 개방되어 있습니다. 의령군은 문화누리카드 가맹점 확대를 통해 지역 주민의 문화 향유 기회를 증진하고, 문화격차 해소를 위한 노력을 지속적으로 추진하고 있습니다.
