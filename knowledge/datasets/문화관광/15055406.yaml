summary_user: 순창군에 신고·등록된 출판업소와 인쇄업소를 업소 한 곳당 한 행으로 담은 파일로, 상호명·지번 소재지·전화번호가 들어 있다(CSV 약 2KB 규모의 소량 목록). 순창군 안에 어떤 인쇄소·출판사가 있고 어디에 있는지 찾으려는 주민·사업자나 지역 출판·인쇄 업체 분포를 보려는 분석가가 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 상호명이나 지번 주소를 기준으로 맞춰 이어야 하며, 주소를 좌표로 바꾸면 지도나 다른 시군의 같은 현황과 함께 쓸 수 있다.
description_portal: 출판문화산업 진흥법에 따른 간행물을 발행하기 위하여 인쇄사를 경영하고자 하는 자는 그 인쇄사의 소재지를 관할하는 군수에게 신고하여야 합니다. 해당 정보는 출판문화산업 진흥법에 따라 전북특별자치도 순창군에 신고 및 등록된 출판 및 인쇄업소 현황 입니다이 정보에는 순창군에 등록된 출판 및 인쇄업소의 사업체 명칭과 소재지(주소)가 포함되어 있습니다.데이터를 업무 등에 활용하시기 바라며, 정보가 잘못됨을 발견하였을 시 알려주시면 수정토록 하겠습니다.본 데이터는 공공 행정, 지역 경제부서, 디자인, 출판 관련 기관,연구자 등에서 기초자료로 폭넓게 활용 가능합니다.
