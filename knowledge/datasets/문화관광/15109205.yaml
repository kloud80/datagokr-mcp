summary_user: 서울 용산구의 길 관광 표준데이터에 속한 관광거리(해방촌거리, 대사관길, 앤틱가구거리, 한남동 가로수길 등)에 있는 상점을 한 행에 한 점포씩 담은 원천 목록으로, 업종·취급품목·운영시각·휴무일·영어 가능 여부·주차 가능 여부와 주소·좌표를 포함한다. 여행자나 관광 안내 서비스 개발자가 '이태원·해방촌 거리에서 영어가 통하고 주차되는 카페나 기념품점은 어디이고 몇 시까지 여는가'를 찾는 데 쓴다. 전역 조인 키는 없어서 길명·점포명·주소 같은 이름으로 맞추거나 위도·경도로 다른 관광지·상권 데이터와 공간 매칭해 이어 쓴다.
description_portal: 표준데이터 "길 관광" 정보 안에 위치한 거리상점정보를 정리한 파일입니다. 업종명, 행정동명, 운영시작, 종료시각, 휴무일, 키워드 등을 포함하고 있습니다. 해방촌거리, 대사관길, 남산숲속여행길, 로데오 패션거리, 순국열차 추모길, 마을관광길, 건축물 탐방코스, 자전거 도로 관광코스, 후암 벽화길 코스, 한남동 가로수길, 역사문화전문가코스, 앤틱가구거리등 용산구의 대표 관광거리에 있는 거리상점정보를 제공하며 디저트, 기념관, 카페, 야경, 관광상품, 기프트, 기념품판매점, 음식점, 용산아트홀, 음료, 칵테일, 술집, 맛집, 화장품판매점, 이태원시장등 용산구의 대표 관광상점을 설명합니다. 또한 구체적인 거리상점의 위치나 취급하는 품목등을 소개하고 있습니다. 거리상점의 운영시작시간과 운영종료시간, 상점의 휴무일, 영어가능여부, 주차가능여부, 점포명등이 설명되어있습니다. 용산구 거리상점 기준으로 관광코스도 함께 설명하고 있습니다. 거리상점의 소재지 도로명주소와 소재지 지번 주소도 제공하여 해당 관광지를 찾기 쉽게 설명되어있습니다.
