summary_user: 제주특별자치도 내 내국인 유동인구를 기준연월·분기·읍면동·성별·연령대·시간대별로 나누어 거주·근무·방문 체류형태별 인구로 담은 집계 자료이며, 정각마다 측정한 체류시간을 월별로 합산한 수치에 기반한다. 지역 분석가나 정책 담당자가 '어느 읍면동에 어느 시간대에 방문 인구 비중이 높은가'처럼 관광·상업·교통 인프라 수요를 따질 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동 이름(emd_name)을 행정구역 이름·코드로 매핑하거나 같은 기관(제주특별자치도) 자료끼리만 이어 쓴다.
description_portal: '이 데이터셋은 제주특별자치도 내 내국인 유동인구를 체류형태별(예: 거주, 방문, 근무 등) 구성 비율로 집계한 자료입니다. 유동인구는 매일 01시부터 24시까지 정각에 체류 인구를 측정하고, 체류 시간을 분 단위로 계산해 60분으로 나눈 뒤 월별로 합산한 수치를 기반으로 산출됩니다. 이 구성비율은 내국인 인구의 생활 패턴과 이동 특성을 이해하고, 주거·교통·상업·관광 기반 인프라 수요를 파악하며, 지역정책 수립 및 도시계획, 공공서비스 설계 등에 활용하기 적합합니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과입니다. 데이터는 CSV 형식으로, 무료로 다운로드 가능하며, 2021-11-23 기준으로 등록된 “1회성 데이터”입니다.'
