description_portal: 다양한 문화 예술 활동 중 부산시에서 공연하는 뮤지컬 목록 데이터를 개방합니다.뮤지컬(Musical)은 음악, 노래, 춤, 연기가 결합된 종합 공연 예술입니다. 일반적인 연극과는 달리, 뮤지컬에서는 인물의 감정이나 이야기의 전개가 노래와 춤을 통해 표현됩니다.뮤지컬의 주요요소는 대사, 노래, 안무, 무대연출 등이며 미국의 유명한 브로드웨이나 웨스트엔드 같은 유명 공연장뿐만 아니라 전세계적으로 확산되어 각 나라별로 다양한 작품들이 상연되고 있습니다.개방되는 데이터에는 제목, 공연기간, 오픈런 가능여부, 공연장 명, 유무료 구분의 데이터가 포함되어 있습니다.
