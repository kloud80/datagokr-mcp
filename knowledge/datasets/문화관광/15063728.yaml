summary_user: 부산에서 공연하는 뮤지컬을 작품 건별로 담은 목록으로, 제목·공연 시작일과 종료일·오픈런 여부·공연장명·유무료 구분을 담는다. 시민이나 관광객이 '지금 부산에서 볼 수 있는 무료 뮤지컬은 어디서 하나'를 찾거나, 분석가가 부산 지역 뮤지컬 공연장별 상연 현황을 훑어보는 데 쓴다. 실측 컬럼에 KOPIS 공연ID·공연장ID 같은 전역 조인 키가 없어, KOPIS 공연 목록이나 공연장 데이터와는 제목·공연장명 문자열 매핑으로만 이어 쓴다.
limits: 공연ID·공연장ID가 없어 KOPIS 예매·매출 데이터와 정확히 1:1로 연결할 수 없고, 이름 매칭에 의존해야 한다. 데이터는 이벤트 단위로 생성된 뒤 바뀌지 않는 주기로 분류돼 있어 실시간 공연 현황으로 쓰기 전 기간 필드를 확인해야 한다. 호출에는 serviceKey가 필요하며 개발계정은 하루 10,000회로 제한된다.
