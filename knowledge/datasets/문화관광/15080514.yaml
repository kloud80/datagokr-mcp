summary_user: 경상남도 남해군 관내 실내 체육·여가 시설을 시설 한 곳당 한 행으로 담은 파일로, 시설업종·시설유형·시설명·주소를 담는다(약 2.8KB 규모의 소규모 CSV). 주민이나 방문객이 남해군에서 체력단련장, 스크린골프 연습장, 당구장, 볼링장, 수영장, 요가·필라테스 시설이 어디에 있는지 찾는 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소를 맞추거나 같은 남해군 자료끼리만 이어 쓰며, 주소를 좌표로 바꾸면 지도 위 분포 분석에 쓴다.
description_portal: 경상남도 남해군 내 다양한 체육·여가 시설 현황을 보여주는 기초 자료입니다.각 시설은 고유 번호로 식별되며, 시설업종, 시설유형, 상세 주소를 포함한 시설명이 명시되어, 기본적인 특징과 이용 가능성을 파악하는 데 유용합니다. 이를 통해 남해군 관내 체력단련장, 골프연습장(스크린 포함), 당구장, 볼링장, 수영장, 요가·필라테스, 각종 자유업종 및 가상체험 시설 등 다양한 편의시설의 종류와 구체적인 분포를 알 수 있습니다. 이 정보는 주민과 방문객의 시설 선택을 폭넓게 돕고, 행정기관의 효율적 현황 관리와 지역 맞춤형 정책 수립에 중요한 근거가 되며, 지역사회 활성화에도 기여합니다.
