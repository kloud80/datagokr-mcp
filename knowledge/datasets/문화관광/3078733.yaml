summary_user: 부산 사상구 관내 동네체육시설을 시설 한 곳당 한 행으로 담으며, 시설명·소재지 주소와 위도·경도, 설치유형, 운동기구 종류·설치대수, 테니스장 같은 간이운동시설 종류·대수, 최초설치연도, 면적을 포함한다. 주민이 집 근처 야외 운동기구가 있는 곳을 찾거나, 구청·분석가가 동네별 생활체육 인프라 분포와 노후 시설을 파악하는 데 쓴다. 전역 조인 키는 없어서 소재지 주소나 좌표로 다른 체육시설·인구 자료와 공간적으로 맞추거나 시설명으로 대조해 잇는다.
description_portal: 해당 공공데이터는 부산광역시 사상구구 관내에 설치된 동네체육시설의 현황을 수록한 자료입니다. 설치유형, 체력단련시설 종류, 설치대수, 간이운동시설 설치대수, 최초설치년도 등 정보를 포함하고 있습니다. 본 데이터를 통해 지역 주민들의 건강 증진과 여가생활을 지원하기 위한 인프라 현황을 보여줄 수 있습니다. 또한 생활체육 활성화를 위한 정책 수립 및 주민 이용 편의성 분석 등 다양한 기초자료로 활용이 가능할 것으로 판단이 됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
