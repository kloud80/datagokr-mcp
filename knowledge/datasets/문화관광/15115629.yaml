summary_user: 서울특별시 양천구 관내 영화상영업 사업장을 한 건씩 담은 인허가 원천 데이터로, 사업장명·인허가일자·영업상태·지번/도로명 주소·좌표·층수·건물용도 등을 담는다. 주민이나 분석가가 '양천구에서 현재 영업 중인 영화관은 어디이고 언제 인허가를 받았나, 폐업한 곳은 어디인가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 사업장명·주소 매칭이나 같은 기관(개방자치단체) 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 본 자료는 서울특별시 양천구 관내 영화상영업의 인허가 정보를 체계적으로 정리한 데이터이다.사업장명, 인허가일자, 영업상태, 주소, 전화번호, 업종명, 사업자구분명, 총층수, 주변환경명, 층수, 건물용, 공연장구분명, 최초등록일 등을 제공하여 관내 영화관 운영 현황을 정확히 파악할 수 있도록 구성하였다.해당 데이터는 공식 관할 기관에서 수집한 자료를 기반으로 하며, 상영관별 등록 현황과 영업 상태를 상세히 기록하였다.이를 통해 영화관 관리, 정책 수립, 안전 점검 및 지역 문화 활성화에 활용 가능하며, 시민과 영화산업 관계자에게 신뢰성 있는 정보를 제공한다.
