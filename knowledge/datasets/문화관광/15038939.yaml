summary_user: 인천광역시 남동구에 있는 영화관을 한 곳당 한 행으로 담은 건별 목록 파일로, 상영관명·도로명 소재지·대표자·보유 상영관 수·연락처·데이터기준일자를 담는다(파일 크기 422바이트의 소규모 자료). 주민이나 지역 문화정책 담당자가 "남동구에 영화관이 어디에 몇 곳 있고 각각 상영관이 몇 개인가"를 확인하는 데 쓴다. 공통 조인 키가 없어 다른 데이터와는 상영관명이나 도로명 주소를 맞춰 붙이거나, 같은 기관(남동구) 단위로 묶어 쓴다.
limits: 남동구 한 시군구만 다루므로 인천 전체나 타 지역 영화관 현황은 이 파일로 알 수 없다. 영업장 고유 코드 같은 전역 키가 없어 문화시설·영화 관련 다른 데이터와 연결하려면 이름·주소 매칭이 필요하다.
