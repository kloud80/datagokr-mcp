summary_user: 대구광역시 북구청이 보유한 공공저작물을 한 건씩 담은 목록으로, 저작물마다 연번·제목·종류·개방 유형(공공누리 유형)·출처를 담는다. 주민이나 기업, 연구자가 '북구청 저작물 가운데 상업적으로 다시 써도 되는 사진이나 문서는 무엇인가'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 다른 데이터와는 제목·종류 같은 이름 매핑이나 같은 기관(대구 북구) 기준으로만 이어 쓴다.
description_portal: '이 서비스는 입력 파라미터를 활용하여 「대구광역시 북구청 공공저작물 현황」 데이터베이스에 등록된 정보를 조회할 수 있도록 설계되었습니다. 사용자는 원하는 조건(예: 공개 유형, 저작물 종류 등)을 입력하면, 시스템은 해당 조건에 부합하는 공공저작물 목록을 자동으로 선별하여 제공합니다. 출력 결과는 연번, 제목, 종류, 개방 유형, 출처의 5개 항목으로 구성되며, 각 공공저작물에 대한 핵심 정보를 명확하고 일목요연하게 확인할 수 있도록 도와줍니다. 이를 통해 주민, 기업, 연구자 등 누구나 북구청이 보유한 공공저작물을 효율적으로 탐색하고 활용할 수 있으며, 공공자원의 투명한 개방 및 재이용 활성화를 실현할 수 있습니다. 서비스는 웹 기반 사용자 인터페이스 또는 API 형식으로 구현될 수 있으며, 공공누리 유형에 따른 이용 조건도 함께 안내됩니다.'
