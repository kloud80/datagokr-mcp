summary_user: 한국관광공사 '대한민국 구석구석'에 실린 여행지·축제·공연/행사별 한 줄 소개(캐치프레이즈)를 콘텐츠 ID, 관광지명, 대·중분류코드, 시도·시군구 지역 정보와 함께 콘텐츠 단위로 담은 전국 범위 파일입니다. 여행 앱·안내 서비스 개발자나 콘텐츠 기획자가 '이 관광지를 한 문장으로 어떻게 소개할까'를 찾을 때 쓰고, 지역별 여행지 소개 문구를 모아 보는 데에도 씁니다. 실측 컬럼에서는 전역 조인 키를 찾지 못해 TourAPI 관광 콘텐츠와는 콘텐츠 ID나 관광지명·지역명을 맞춰 보는 방식으로만 이어 쓴다.
description_portal: 한국관광공사에서 운영하는 국내 여행정보 제공 플랫폼 "대한민국 구석구석*"에서 제공하는 여행지 한 줄 소개 정보 목록입니다. * https://korean.visitkorea.or.kr본 데이터는 여행지, 축제/공연/행사 의 콘텐츠 ID, 관광지명(제목), 분류코드, 캐치프레이즈, 지역 정보를 포함하고 있습니다.각 관광지별 상세한 내용, 이미지 등은 홈페이지 내에서 확인 가능합니다. * 여행정보 > 여행지, 공연/행사, 축제
