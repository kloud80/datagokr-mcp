summary_user: 전북특별자치도 장수군의 주요 관광지(체험휴양마을·리조트·캠핑장·휴양림·생가지·뜬봉샘·전시관·기념관 등)별로 2025년 한 해 입장객 수를 1월~12월 월별(단위 명)로 담은 집계 파일이다. 장수군 관광 담당자나 지역 분석가가 어느 관광지에 어느 달 방문객이 몰리는지, 성수기·비수기 차이가 얼마나 되는지 확인하는 데 쓴다. 관광지점코드나 시군구코드 같은 공통 조인 키가 없어, 다른 관광 통계나 관광지 정보와는 관광지 이름(주요관광지명)을 직접 맞춰 이어 써야 한다.
description_portal: 전북특별자치도 장수군의 주요 관광지 입장객 현황에 대한 데이터를 제공하고자 합니다.데이터 구성은 주요 관광지와 1월, 2월, 3월, 4월, 5월, 6월, 7월, 8월, 9월, 10월, 11월, 12월, 데이터 기준일자로 구성되어있습니다.주요관광지 현황은 체험휴양마을, 리조트, 파크, 캠핑장, 휴가촌, 휴양림, 생가지, 뜬봉샘, 전시관, 기념관, 사당, 목장, 홍보관, 항교 등으로 구성되어 있습니다.데이터 기준일자는 2025년 12월 31일로 2025년 한해에 해당하는 관광객 수 입니다.각 월의 단위는 명으로 데이터를 사용하실때 참고하시기 바랍니다.
