summary_user: 강남구 스마트도서관이 보유한 단행본을 책 한 권(등록번호)마다 한 행으로 담은 소장 도서 목록으로, 서명·저자·편권차·발행년·책크기·가격·분류기호·도서기호·구입년도가 들어 있으며 강남구 한 곳 범위의 CSV 파일(약 10.8MB)이다. 주민이나 분석가가 '강남구 스마트도서관에 어떤 주제(분류기호)의 책이 어느 해에 얼마나 들어왔나', '특정 제목·저자의 책을 갖고 있나'를 확인하는 데 쓴다. ISBN이나 도서관코드 같은 전역 조인 키가 없어, 도서관정보나루 등 다른 도서 데이터와는 서명·저자 문자열 매칭으로만 이어 쓴다.
limits: ISBN·도서관코드가 없어 국가서지나 대출·인기도서 데이터와 정확히 결합할 수 없고 이름 매칭에 따른 오차가 생긴다. 강남구 스마트도서관 소장분만 담아 다른 구·전국 비교에는 쓰지 못하며, 대출 여부나 이용 실적은 들어 있지 않다.
