summary_user: KMDb에 등록된 국내 영화를 한 편 단위로, 제명·제작년도·장르·상영시간·심의정보·줄거리 같은 상세정보와 크레딧(인명·배역), 참여사(제작·배급사 등) 정보로 나눠 담은 파일 데이터이며, 활용신청 없이 zip(약 3.7MB)으로 받는다. 영화 연구자나 콘텐츠 분석가가 '특정 감독·배우가 어떤 작품에 함께 참여했는가', '특정 제작사가 시대별로 어떤 장르를 만들었는가' 같은 질문에 쓴다. 세 파일은 영화 고유 식별자(KMDB영화정보관리번호)로 서로 묶어 쓰지만, 실측상 다른 데이터셋과 이을 전역 조인 키는 없어 외부 자료와는 영화 제목·인명·참여사명을 맞춰 연결해야 한다.
description_portal: 본 데이터는 **2022년 공공데이터 기업매칭 지원사업**을 통해 한국영상자료원이 구축한 ** 영화 상세정보 데이터**로, 국내 영화의 핵심 메타데이터를 구조적으로 정리한 공공데이터입니다.한국영화의 제작·참여·유통 정보를 체계적으로 관리하기 위한 목적으로 구축되었으며, 영화산업 분석, 콘텐츠 연구, 학술 활용 등 다양한 분야에서 활용될 수 있습니다.이 데이터는 KMDb의 영화 개별 항목을 중심으로 **‘상세정보’, ‘크레딧’, ‘참여사’**의 세 가지 파일로 구성되어 있으며,각 파일은 **KMDb 영화정보관리번호**(영화 고유 식별자)를 통해 서로 연계됩니다. 이를 통해 영화별 기본 정보에서부터 제작 참여자, 참여사 정보까지 일관된 구조로 연결하여 활용할 수 있습니다.세 데이터셋은 상호보완적 관계를 이루며, KMDb의 영화정보관리번호를 기준으로 통합 분석이 가능하도록 설계되어 있습니다.연구자는 이를 활용해 영화별 제작 인력 네트워크 분석, 특정 제작사의 활동 연혁 추적, 장르별·시대별 영화 제작 경향 분석 등을 수행할 수 있습니다.
