summary_user: 서울 은평구에 등록된 전통사찰을 사찰 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가·취소일자, 영업상태, 지번·도로명 주소, 중부원점TM 좌표(X·Y), 승려 수·신도 수, 창건일·유래, 지정취소 여부 등을 포함한다. 은평구에서 현재 지정이 유지되는 전통사찰이 어디에 있고 언제 창건됐는지 알아보려는 주민·관광 기획자·문화유산 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사찰명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '은평구의 불교 신앙의 대상으로서의 형상을 봉안하고 승려가 수행하며, 신도를 교화하기 위한 시설 및 공간 정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.은평구 내 「전통사찰보존법」에 따라 등록된 전통사찰의 인허가 및 기본 정보를 제공하는 데이터입니다. 전통사찰은 역사적으로, 문화적으로, 종교적으로 높은 가치를 지닌 건축물이자 지역의 상징적 공간으로, 본 데이터는 사찰명, 위치, 지정일자, 문화재 지정 여부, 관리주체 등을 포함합니다. 전통사찰은 단순한 종교시설을 넘어 관광자원, 교육 공간, 정신문화 체험장 등으로 활용되고 있으며, 특히 도시화 속에서 전통의 가치를 지키는 공간으로서 지속적인 보존·관리 정책이 요구됩니다. 본 데이터는 문화재 보호, 도시계획 연계, 전통건축 안전진단, 종교관광 육성 등 다양한 분야에서 활용될 수 있으며, 시민 정신건강 복지, 힐링명소 조성, 전통문화 교육 확산 등의 공익적 효과도 기대할 수 있습니다. 또한 종교갈등 예방, 자연보호 연계, 사찰숲길 탐방로 조성 등 생태·문화·종교 복합 정책 수립에 기초가 됩니다.'
