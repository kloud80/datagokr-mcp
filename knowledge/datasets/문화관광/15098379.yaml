summary_user: 세종특별자치시 안의 박물관·미술관을 시설 한 곳당 한 행으로 담으며, 명칭·구분, 도로명·지번 주소와 위경도, 운영기관명·전화번호, 홈페이지, 편의시설, 평일·휴일 관람시간과 휴관일, 어른·청소년·어린이 관람료, 교통안내, 관리기관, 기준일자를 포함한다. 시민이나 관광객이 '이번 주말 세종에서 무료로 들어갈 수 있고 휴일에도 여는 박물관은 어디인가'를 찾거나, 분석가가 세종 지역 전시시설의 분포를 지도에 올릴 때 쓴다. 전역 조인 키나 문화기반시설총람 시설코드가 실측 컬럼에 없어서, 다른 문화시설 데이터와는 시설명·주소를 맞추거나 좌표(la, lo)로 공간 결합해야 한다.
limits: 범위는 세종특별자치시 한 곳이라 다른 시도와 비교하려면 별도 데이터를 모아야 한다. 공통 시설코드가 없어 다른 데이터와 이으려면 이름·주소 매칭이 필요하다. 호출에는 포털에서 발급한 serviceKey가 필요하며, 개발계정은 하루 5,000회로 제한된다.
