description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 성김대건신부제주표착기념관은 제주 제주시 한경면 용수리에 위치하며 한국 최초의 천주교 사제 김대건 신부가 1845년 상해에서 귀국하던 중 폭풍으로 표류해 제주에 표착했던 역사적 장소를 기념하기 위해 조성된 전시시설로 1층 영상 및 이미지 전시 공간, 2층 제주 천주교 역사 및 김대건 신부의 생애와 업적을 소개하는 전시실, 옥상전망대와 복원된 목선 라파엘호 전시가 마련되어 있으며 접근로, 주차장 등 편의시설을 갖추어 교통약자 및 모든 관광객이 이용 가능한 무장애 환경을 제공한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
