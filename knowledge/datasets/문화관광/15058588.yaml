summary_user: 경기도 31개 시군에 등록된 국내 여행업체를 업체 한 곳당 한 행으로 담은 인허가 원장으로, 사업장명·인허가일자·영업상태·폐업 및 등록취소일자·자본금·보험 가입기간·도로명/지번 주소·좌표를 포함한다. 여행업 창업을 검토하는 사업자나 분석가가 '우리 시군에 영업 중인 국내 여행업체가 몇 곳이고 어디에 몰려 있나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 시군명으로 같은 경기도 관광사업 인허가 데이터와 묶고, 주소·위경도로 지도나 다른 위치 데이터와 겹쳐 쓴다.
description_portal: 경기도 내 국내 여행업체 현황입니다. 국내를 여행하는 내국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 여행업체(소)의 사업장명, 위치, 자본금 등의 정보를 제공합니다.※경기도 31개 시군의 인ㆍ허가 데이터입니다.이 데이터는 경기도 내에서 등록된 국내 여행업체의 인허가 및 영업 현황을 정리한 자료로, 사업장명, 시군명, 인허가일자, 등록취소일자, 영업상태, 소재지 정보(전화번호, 도로명우편번호 등), 자본금, 시설면적, 회의실 수용 인원 등 다양한 항목으로 구성되어 있습니다. 등록취소, 영업중 등의 상태 구분을 통해 각 업체의 활동 여부를 판단할 수 있으며, 소재지 기반 정보를 통해 지역별 관광업체 분포도 파악 가능합니다. 본 데이터는 관광산업 관련 정책 수립, 시장 분석, 시설 인프라 파악, 지역 관광 활성화 전략 수립 등 다양한 용도로 활용될 수 있습니다.
