summary_user: 경정 선수 한 명의 경주연도별 성적을 담은 집계 데이터로, 기수·등급과 출주횟수, 1~6착 횟수, 평균 착순, 평균 사고점, 평균 스타트타임, 승률·연대율·3연대율을 연도(stnd_yr)와 선수명 기준으로 제공한다. 경정 분석가나 관람객이 특정 선수의 올해 승률과 사고점이 지난해보다 나아졌는지, 같은 등급 선수 중 스타트가 빠른 선수는 누구인지 비교할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 같은 기관의 다른 경정 데이터(모터·보트·경주 결과)와는 선수명·기수번호 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 서울올림픽기념국민체육진흥공단 경륜경정총괄본부에서 제공하는 경정 선수정보는 경주연도와 선수명을 기준으로 선수의 기수, 등급, 출주횟수, 각 착순별 횟수(1~6착), 평균 착순점, 사고점, 스타트타임, 승률, 연대율, 3연대율 등의 데이터를 제공합니다. 선수정보는 경정경주에서 모터, 보트와 함께 성적을 좌우하는 핵심 요소로, 경기력 분석과 전략 수립에 있어 중요한 기준이 됩니다. 이 데이터를 활용하면 선수의 기량과 안정성을 종합적으로 파악할 수 있어, 예측 및 판단에 유용한 자료로 활용됩니다.
