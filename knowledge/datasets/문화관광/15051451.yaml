description_portal: '제주특별자치도는 잊혀져가는 제주의 주요 민속문화 자원에 대한 가치발굴과 원형보존을 위해 관련 자료를 동영상, 그래픽, 플래쉬애니메이션 등으로 디지털화하여 제공하고 있습니다.*제주민요: 동풍가, 산천초목, 검질매는노래, 마소 모는 노래, 해녀노래, 제주동요, 밭 밟는 노래, 이야홍 타령, 봉지가, 연자매노래, 나무 쪼개는 노래, 맷돌노래, 멸치 후리는 노래, 이어도(전설의 이어도 상상도), 오돌또기*파일을 다운로드 하시면 관련 설명 자료가 함께 첨부되어 있습니다. ※ 추가 참고 자료: 제주도청 문화/역사/체육 분야별홈페이지 디지털콘텐츠 https://www.jeju.go.kr/culture/digitalContents/directory.htm'
