description_portal: 이 데이터는 웹사이트에서 사용되는 팝업창(이벤트·공지 배너 등)을 체계적으로 관리하기 위하여 구축한 팝업창 관리 테이블이다. 각 레코드는 팝업창을 식별하는 팝업창아이디(팝업창관리.팝업창아이디)와 화면에 표시되는 제목(팝업창관리.제목)을 포함하며, 창의 가로·세로 크기(팝업창관리.가로크기, 세로크기), 화면 상단·좌측 여백(팝업창관리.상단여백, 좌측여백)으로 위치 속성을 지정한다. 또한 스크롤바 사용 여부(팝업창관리.스크롤바)와 실제 서비스 노출 여부(팝업창관리.사용여부)를 통해 팝업창의 표시 방식을 제어한다. 팝업 이미지 또는 HTML이 저장된 파일명(팝업창관리.팝업파일명), 팝업이 등록된 일시(팝업창관리.팝업등록일자), 클릭 시 연결되는 상세화면·이벤트 페이지의 링크 경로(팝업창관리.링크경로) 정보를 함께 관리함으로써, 과거·현재 팝업 운영 이력을 추적하고 웹사이트 개편, 이벤트 관리, 사용자 화면 설계 등에 활용할 수 있도록 구성되어 있다.
