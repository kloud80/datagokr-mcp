summary_user: 서울특별시 성동구 안 당구장업 업소를 한 곳씩 담은 인허가 원천 목록으로, 관리번호·인허가일자·인허가취소일자·영업상태·폐업일자·소재지 주소·좌표·사업장명·건물 면적 등을 담는다. 성동구에서 지금 영업 중인 당구장이 어디에 몇 곳 있는지, 최근 어느 동네에서 문을 열고 닫았는지를 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 주소·좌표나 사업장명 매핑, 같은 기관(개방자치단체코드) 기준으로만 이어 쓰며, 같은 LOCALDATA 체육시설업 명부와 함께 상권 개폐업 신호로 묶어 보는 데 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 당구를 즐길 수 있도록 당구대, 큐, 공 등 필요한 시설과 장비를 갖추어 제공하는 당구장 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 당구장은 여가활동, 동호회 모임, 생활체육 활성화 등 다양한 역할을 하며, 관련 업소의 인허가 내역과 운영 현황 파악은 이용자 안전과 건전한 영업 질서 유지에 매우 중요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어 각 당구장의 설립, 인허가 및 행정변경, 영업 개시 및 종료, 폐업 등 모든 행정 정보를 명확하게 확인할 수 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현장 점검과 자료 갱신을 실시해 데이터의 신뢰성과 최신성을 보장합니다. 본 데이터는 당구장 현황 분석, 체육시설 정책 수립, 지역상권 연구, 이용자 정보 제공, 업계 동향 파악 등 다양한 분야에서 활용될 수 있습니다. 정책입안자, 업계, 연구자, 일반 시민 모두에게 객관적이고 실효성 있는 자료를 제공하며, 데이터는 정기적으로 최신화됩니다.
