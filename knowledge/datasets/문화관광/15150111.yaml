summary_user: 기능성게임을 만드는 기업을 한 행에 한 회사씩 정리한 명부로, 사업자번호·회사구분·회사명·대표자·설립연도·소재지·홈페이지와 주요 개발 게임(최대 5개)을 담는다(전국 범위, 약 9KB CSV). 교육·보건·국방용 게임을 함께 만들 업체를 찾는 기관이나 협업·투자처를 고르는 사업자가 '이 분야 게임을 개발한 회사가 어디에 있고 언제 설립됐나'를 확인하는 데 쓴다. 사업자번호(bizno)를 키로 사업자 등록 상태, 기업 재무 등 다른 기업 정보와 이어 쓴다.
description_portal: 기능성게임사 정보 데이터는 교육, 보건, 공공, 국방 등 다양한 분야에서 활용되는 기능성게임을 제작하는 기업들의 현황을 체계적으로 정리한 자료입니다. 데이터에는 사업자번호, 회사구분, 회사명, 대표자, 설립연도, 소재지, 홈페이지, 주요 개발 게임 목록 등이 포함되어 기업별 특성과 개발 역량을 확인할 수 있습니다. 이를 통해 업계 관계자는 기업 규모와 전문성을 파악하고 협업이나 투자 기회를 탐색할 수 있으며, 교육기관과 연구자는 기능성게임 산업 구조와 기업 활동을 분석하는 자료로 활용할 수 있습니다. 또한 정책기관은 기업 현황을 기반으로 산업 지원 정책을 수립하고 성장 전략을 마련할 수 있습니다. 이 데이터는 기능성게임의 산업 생태계를 이해하고, 글로벌 경쟁력을 강화하며, 새로운 비즈니스 기회를 창출하는 데 중요한 역할을 합니다.
