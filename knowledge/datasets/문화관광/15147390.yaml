summary_user: 서울 동작구의 체력단련장업(헬스장·피트니스센터 등) 인허가를 사업장 한 곳당 한 행으로 담은 원천 명부로, 인허가·취소·폐업 일자, 영업상태, 주소와 좌표, 보험 가입 여부, 지도자 수·건물 면적 같은 시설 정보를 포함한다. 동작구에서 최근 문을 닫거나 새로 연 헬스장이 어디인지 확인하려는 창업자나, 헬스장 개폐업을 상권 신호로 보려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑으로 잇고, 같은 LOCALDATA 체육시설업 명부와는 관리번호(MGTNO)와 지자체 코드(OPNSFTEAMCODE)로 맞춰 쓴다.
description_portal: 체력단련장 인허가 정보 데이터는 시민에게 체력 단련과 운동 서비스를 제공하는 시설 현황을 담고 있습니다.사업장명과 주소 정보는 각 체력단련장의 위치와 기본 정보를 제공합니다.문화체육업종명은 헬스장, 피트니스센터 등 업종 유형을 구분합니다.영업상태 항목은 정상, 휴업, 폐업 등 현재 운영 여부를 보여줍니다.보험가입여부 코드는 종업원과 이용자의 안전을 보장하기 위한 보험 가입 현황을 나타냅니다.시설규모 정보는 운동 공간, 운동기구 수, 면적 등 시설 환경을 보여줍니다.종사자 현황은 트레이너, 강사, 관리 직원 등 인력 구성과 규모를 나타냅니다.운영형태는 개인사업자, 법인 등 운영 유형을 구분합니다.
