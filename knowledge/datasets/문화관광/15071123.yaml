summary_user: 국립아시아문화전당에서 열린 공연·전시·행사별로 공연명, 장르, 관람 대상, 상영시간, 공연 기간, 판매 형태와 결제 구분, 예매 시작·종료 일시, 환불기간을 한 행씩 담은 CSV 파일(약 42KB)이다. 관객이나 문화 분석가가 '전당 공연은 언제부터 어떤 창구로 예매가 열리고 환불은 언제까지 되는가'를 확인하거나 장르별 예매 운영 방식을 비교하는 데 쓴다. 실측 컬럼에 KOPIS 공연ID 같은 전역 조인 키가 없어, 다른 공연 데이터와는 공연명·기간을 이름 매칭하는 방식으로만 이어 쓴다.
limits: 공연ID·공연장ID가 없어 KOPIS 공연 목록이나 예매·매출 통계와 키로 바로 붙일 수 없다. 명세상 수시 갱신이며, 예매 건수나 판매 실적은 담지 않고 예매 조건만 담는다.
