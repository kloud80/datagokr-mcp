description_portal: '- 본 데이터는 문화체육관광부와 한국관광공사가 2023년부터 선정한 공공운영 우수야영장의 소개정보입니다. 현재 4개 부문(친환경, 가족 친화, 교통약자 배려, 반려동물 친화)에서 우수함으로 선정된 40개소의 야영장 정보가 소개되고 있습니다. - 링크에서 다운로드 가능한 "공공 우수야영장 엑셀"파일은 선정연도, 야영장명, 소개, 상세URL(고캠핑 내 상세페이지) 정보를 담고 있으며, "공공 우수야영장 소개" PDF 파일은 각 야영장의 사진과 선정유형 및 상세한 소개 정보를 담고 있습니다.- 여행지 추천 서비스, 캠핑 및 무장애 여행 웹·앱 서비스 개발에 활용할 수 있습니다.'
