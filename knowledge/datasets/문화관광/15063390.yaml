summary_user: 경상남도 시군별로 연도별 관광객 수를 내국인·외국인·합계로 나눠 담은 집계 데이터이며, 필드 구성상 2013~2016년 연도별 값과 관광지점 수(spot 계열)가 열로 펼쳐져 있다. 경남 시군 관광 담당자나 분석가가 "2013~2016년 사이 어느 시군에서 외국인 관광객이 늘었나" 같은 시군 간·연도 간 비교 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군구명(signguNm)을 이름 매핑해 다른 시군구 단위 관광·지역 통계와 붙여 쓴다.
limits: 시도·시군구 단위 연간 집계라 관광지점별·월별 분석에는 쓰지 못한다. 시군구코드 같은 공통 키가 없어 다른 데이터와 연결하려면 시군 이름으로 직접 매핑해야 한다.
