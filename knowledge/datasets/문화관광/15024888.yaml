summary_user: 올림픽공원 안의 수목과 장미광장 장미에 대해 이름·종류·설명 등을 한 건씩 담은 목록 데이터로, 포털 설명 기준 2025년 182건이다. 올림픽공원 방문객이나 공원 안내 앱 개발자가 "장미광장에 어떤 품종의 장미가 있고 각각 어떤 특징인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 수목명 같은 이름 매핑이나 같은 기관 데이터로만 연결한다.
description_portal: 올림픽공원 안에 있는 수목과 장미 등에 관한 정보 제공수목명, 수목종류, 설명 등 정보제공2025년 기준 182건의 데이터를 제공하고 있으며, 한국체육산업개발의 올림픽공원 장미정보를 외부 개발자 및 사용자가 이를 활용 할 수 있도록 전달하는 API 서비스입니다. 올림픽공원 장미광장의 장미 목록정보와 상세정보 등 다양한 정보를 제공합니다.올림픽공원 홈페이지에서도 정보를 제공하고있습니다. https://www.ksponco.or.kr/olympicpark/menu.es?mid=a20403010000
