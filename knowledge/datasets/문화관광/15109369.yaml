summary_user: 제주도 내 마을별로 위치한 마트·우체국·은행·전기차충전소·클린하우스·주차장·편의점·화장실 같은 편의시설을 시설 한 곳당 한 행으로 담은 건별 목록 파일(CSV, 약 734KB)로, 마을명·행정리명과 주소·위도·경도, 운영시간·휴무일, 영업상태를 함께 담는다. 제주 마을 여행을 계획하는 여행자나 마을관광 서비스를 만드는 사업자가 '이 마을 근처에 공영 화장실이나 전기차충전소가 어디 있고 언제 여는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 마을명·읍면동명 같은 이름 매칭이나 위도·경도 좌표 기반 근접 결합으로 이어 써야 한다.
description_portal: 제주관광공사_마을편의시설 데이터는 2022년 공공데이터 뉴딜 사업의 일환으로 구축된 제주 마을관광 정보 데이터 입니다. 제주도 내 각 마을별로 위치한 마트, 우체국, 은행, 전기차충전소, 클린하우스, 주차장, 편의점, 화장실  등 편의시설 정보를 포함하고 있습니다. 데이터에는 마을명, 시군구명, 읍면동명, 행정리명, 편의시설명, 편의시설유형, 소재지 전화번호, 소재지도로명주소, 소재지지번주소, 위도와 경도, 인허가일자, 상세영업상태코드, 휴무일, 운영시간, 데이터기준일자 등의 항목을 제공합니다.
