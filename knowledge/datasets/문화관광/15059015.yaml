summary_user: 경기도 내 공공 체육시설 중 유도·검도·복싱 등 투기 종목 경기장을 시설 한 곳당 한 행으로 담으며, 시군명·소유기관·연면적·건축구조·가능종목·바닥재료·관람석 수·준공연도·건설사업비·주소·위도·경도가 들어 있다. 도민이나 체육 정책 담당자가 '우리 시군에 유도·검도를 할 수 있는 공공 경기장이 어디에 있고 규모가 어떤가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해 시군 코드(SIGUN_CD)·시군명이나 시설명·주소 매칭으로만 다른 체육시설 현황과 이어 쓰며, 위도·경도로 지도에 올려 쓴다.
description_portal: 이 데이터는 경기도 내 공공 체육시설 중 투기 종목(유도, 검도, 복싱 등) 관련 경기장의 현황을 수록한 자료로시설명, 시군명, 소유기관, 연면적, 건축구조, 가능종목, 바닥재료, 부지면적, 건축면적, 관리주체, 도로명 및 지번 주소, 위도·경도 등의 정보를 포함하고 있습니다. 주요 항목으로는 ‘시설명’, ‘가능종목명’, ‘연면적(㎡)’, ‘바닥재료명’, ‘건설사업비(백만원)’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며, 경기장 구조분석, 시설 운영계획, 공공투기체육 활성화 정책 수립 등에 활용될 수 있습니다. 특히 ‘비고사항’에는 종목 외에도 다목적 활용 여부나 전용시설 여부가 명시되어 있고, ‘운영조직명’은 일부 시설에만 기재되어 있어 관리 체계 분석 시 주의가 필요합니다. 유도회관, 검도회관 등 종목별 전용 경기장이 포함되어 있어 전문 체육시설 분석에도 유용한 자료입니다.
