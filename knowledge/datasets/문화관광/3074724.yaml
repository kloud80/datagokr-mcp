summary_user: 세종특별자치시에 있는 보물 3건(연화사 칠존불비상, 연화사 무인명불비상 및 대좌, 비암사 극락보전)을 건별로 보물명·소재지 주소·위도·경도·건립시기·설명과 함께 담은 작은 파일(CSV, 약 2.8KB)이다. 세종시 문화유산 답사 경로를 짜거나 지도에 보물 위치를 표시하려는 시민·여행자·분석가가 "세종시에 어떤 보물이 어디에 있고 언제 만들어졌나"를 확인하는 데 쓴다. 전역 조인 키(국가유산 종목코드·지정번호 등)가 없으므로 보물명으로 국가유산청 지정유산 목록과 맞추거나 위도·경도·소재지 주소로 다른 위치 데이터와 공간 결합해 쓴다.
description_portal: 세종특별자치시 소재 보물 현황을 제공합니다.데이터는 보물명, 소재지, 위도, 경도, 건립시기, 설명으로 구성되어 있습니다.세종특별자치시에는 세종시 연화사 칠존불비상(世宗市 蓮花寺 七尊佛碑像)/건립시기-통일신라, 세종시 연화사 무인명불비상 및 대좌(世宗市 蓮花寺  戊寅銘佛碑像 및 臺座)/건립시기-통일신라,세종 비암사 극락보전 (世宗 碑岩寺 極樂寶殿)/건립시기-조선시대 총 3개의 보물이 있습니다.세종시 연화사 칠존불비상 및 연화사 무인명불비상 및 대좌는 세종특별자치시 연서면 연화사길 28-1에 소재하고 있으며,세종 비암사 극락보전은 세종특별자치시 전의면 비암사길 137에 소재하고 있습니다.이 데이터는 세종특별자치시 문화체육관광국 문화유산과에서 관리하고 있습니다.
