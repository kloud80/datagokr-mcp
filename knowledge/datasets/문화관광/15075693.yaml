summary_user: KINTEX(킨텍스) 안의 전시홀·회의실·로비·보관실·판매시설 등 시설을 한 행씩 담은 현황 자료로, 시설명·구분·약칭·세부규격·천장고·가용면적과 극장식·연회식·리셉션식·강의식 등 배치 형태별 수용인원을 포함한다. 행사 기획자나 MICE 분석가가 '500명 규모 강의식 학술행사를 열려면 킨텍스의 어느 회의실이 맞는가' 같은 공간 선택 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명 같은 이름 매칭이나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 KINTEX(킨텍스) 내 전시장, 회의실, 편의시설 등 다양한 시설의 현황을 정리한 자료로, 시설명, 약칭, 세부규격, 가용면적, 사용형태별 수용인원 등 공간의 물리적 특성과 활용 가능 정보를 포함하고 있습니다. 각 공간의 유형은 전시홀, 회의실, 로비, 보관실, 판매시설 등으로 구분되며, 국제회의, 박람회, 기업행사, 문화행사 등 다양한 목적에 맞춰 선택할 수 있는 기준을 제공합니다. 이 데이터는 행사 기획자와 운영자에게 실질적인 공간 선택과 구성 설계에 도움을 주며, 마이스(MICE) 산업에서 시설 운영 효율화 및 수요 예측, 공간 최적화 분석 등에 유용하게 활용됩니다.
