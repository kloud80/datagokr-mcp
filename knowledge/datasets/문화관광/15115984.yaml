summary_user: 서울특별시 중구에 등록된 일반여행업(종합여행업) 업소를 업소 한 곳당 한 행으로 담은 인허가 원장으로, 관리번호·인허가일·폐업일·영업상태·소재지 주소·전화·보증보험 기관·중부원점TM 좌표 등을 포함한다. 여행사 창업을 준비하는 사업자가 중구 안에서 현재 영업 중인 여행사가 어디에 몇 곳 있는지 확인하거나, 시민이 이용하려는 여행사가 등록된 상태인지 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관의 관리번호(MGTNO) 체계로만 이어 쓰며, 같은 중구의 다른 관광사업 인허가 데이터와 나란히 보는 용도에 맞다.
description_portal: '서울특별시 중구의 국내 또는 국외를 여행하는 내국인 및 외국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소 정보입니다. 데이터는 각 등록업체에 부여된 관번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 종합여행사 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 등록업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 일반 시민들에게는 국내여행, 해외여행을 막론하고 보증보험 가입 및 안전관리 기준을 충족하며 운영되는 신뢰할 수 있는 여행사의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
