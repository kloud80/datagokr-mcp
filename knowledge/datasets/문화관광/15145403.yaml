description_portal: '예술의전당 강좌별 수강생 평균나이- 관련 데이터: 아카데미명, 학기명, 강좌명, 강좌시작일, 강좌종료일, 강좌시작시간, 강좌종료시간, 수용인원, 강좌가격, 할인가능여부, 강좌요일, 수강생평균나이, 총 할인받은 가격- 데이터 기간: 2011.1 ~2025.7-이 데이터는 예술의전당에서 운영 중인 각 강좌별 정보와 수강생 통계를 담고 있는 자료입니다.각 강좌는 소속 아카데미명과 학기명으로 구분되며, 강좌명, 시작일과 종료일, 수업 요일 및 시간 등 운영에 필요한 기본 정보를 포함합니다. 또한, 해당 강좌의 수강료(가격), 할인 가능 여부, 최대 수용 인원이 명시되어 있어 강좌의 전반적인 구조와 운영 방식도 파악할 수 있습니다. 이 데이터는 시계열적 흐름을 갖고 있으며, 완결성과 신뢰성을 바탕으로 정제되어 있어 범용성이 높고, AI 분석 및 모델링에 적합한 구조를 갖춘 AI 친화적 데이터입니다.'
