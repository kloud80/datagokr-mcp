summary_user: "제주도 주요 축제별로 카드 결제 실적(가맹점수·카드이용자수·이용건수·이용금액)을 정리한 집계 파일로, 2014년 9월~2016년 8월 BC카드(내국인)와 유니온페이카드(중국인) 매출을 바탕으로 한 2016년 보고서 자료다. 관광정책 담당자나 분석가가 '제주의 어느 축제 기간에 내국인·중국인 관광객 카드 소비가 얼마나 일어났나'를 비교할 때 쓴다. 전역 조인 키가 없어 다른 축제·행사 데이터(예: TourAPI 행사 정보)와는 축제명으로 이름을 맞춰 연결해야 한다."
limits: 보고서 작성 때 한 번 만든 뒤 바뀌지 않는 자료라 2016년 8월 이후 소비 변화는 담지 않는다. BC카드·유니온페이 결제만 반영한 실적이므로 전체 관광객 소비로 일반화하지 않는다. 축제 번호는 이 파일 안의 번호일 뿐이어서 다른 데이터와의 연결은 축제명 매핑에 의존한다.
