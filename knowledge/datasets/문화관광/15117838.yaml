description_portal: '서울특별시 마포구 종교시설에 대한 정보입니다. 이 데이터에는 각 종교시설이 위치한 도로명 주소, 시설명, 종교구분(예: 개신교, 천주교, 불교, 원불교, 정교회 등) 등의 상세 정보가 포함되어 있습니다.이 데이터를 통해 지자체는 종교시설의 분포와 특성을 체계적으로 파악하여 도시계획, 안전관리, 문화행사 지원 등의 정책에 활용할 수 있으며, 시민들은 지역 내 종교시설 정보를 쉽게 확인하고 종교 활동이나 지역 공동체 참여에 활용할 수 있습니다.단, 종교시설은 자치구 신고 대상이 아니므로 정확한 현황자료를 보유하고 있지 않음을 알려드립니다.'
