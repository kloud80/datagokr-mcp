summary_user: 부산광역시 남구 도서관이 새로 구입한 도서를 한 권(건)씩 담은 원천 목록으로, 서명·저자·발행자·발행년·가격을 담는다(xlsx 파일, 약 1MB). 지역 주민이 남구 도서관에 어떤 신간이 들어왔는지 확인하거나, 분석가가 신착 도서의 출판사·발행연도·가격 구성을 살펴보는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 공통 조인 키가 없어 도서관정보나루 등 다른 도서 데이터와는 서명·저자 이름을 맞춰서만 연결할 수 있다.
description_portal: 부산광역시 남구 도서관 신규도서 구매에 대한 책명,  저자, 발행자, 발행년도, 가격에 대한 상세한 자료를 제공합니다.지역주민의 정보 요구에 부합하는 자료를 신속, 정확하게 구입하여 균형있는 장서구성으로 지역주민의 만족도 제고 및 지역사회 교육문화센터로서의 역할을 충실히 수행하고자 함.이용자 비치희망도서 서비스 및 지역서저 바로대출 서비스 제공.-도서관법 제32조 및 제45조의 2,3,4-부산광역시 남구도서관 관리 운영 조례 제10조의2, 제11조, 제12조 및 시행규칙 제18조
