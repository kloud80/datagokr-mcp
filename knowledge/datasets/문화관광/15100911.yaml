description_portal: 본 데이터는 미추홀구 관내에서 운영 중인 체육교습업소 현황을 수록한 자료입니다. 각 시설의 상호명, 도로명주소 및 지번주소, 전화번호, 위도와 경도 정보로 구성되어 있으며, 구 내 체육 교습시설의 위치 및 분포를 파악할 수 있습니다. 체육교습업은 체육시설을 이용하는 자로부터 직접 이용료를 받고 있는 9개 종목에 대하여 13세 미만 어린이를 대상으로 30일 이상 교습행위를 제공하는 업을 말합니다. 9개의 대상 종목은 농구, 롤러스케이트, 배드민턴, 빙상, 수영, 야구, 줄넘기, 축구가 있습니다. 이 데이터는 행정기관이 지역 내 체육교습시설의 분포를 분석하고, 시설관리 및 체육진흥 정책 수립에 참고하기 위한 기초자료로 활용됩니다. 또한 주민이 원하는 종목별 체육교습시설을 손쉽게 찾을 수 있도록 지원하여, 지역사회 내 생활체육 활성화와 건강한 여가문화 조성에 기여합니다.
