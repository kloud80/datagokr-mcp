summary_user: 제주 일과리 해안도로 구간의 무장애 여행 코스를 지점 단위로 담은 파일로, 순서·위도·경도와 함께 지점 구분, 설명, 상세정보, 전체코스·추천코스 여부를 행마다 기록한다. 휠체어 이용자나 교통약자 가족이 '일과리 해안도로에서 어느 지점까지 안전하게 이동하고 어디서 쉴 수 있나'를 확인하거나, 지자체·사업자가 열린관광지·무장애 관광 콘텐츠를 기획할 때 쓴다. 전역 조인 키는 없어 TourAPI 관광지 등과는 지점 이름이나 위도·경도 좌표로 맞춰 이어 써야 한다.
description_portal: '제주특별자치도 내 제주특별자치도_일과리해안도로_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 일과리 해안도로 구간을 대상으로 한 무장애 여행 코스 정보를 제공한다. 해안도로 인근의 접근 가능 지점, 이동 동선, 휴게 공간, 편의시설 현황 등을 포함하여 교통약자와 휠체어 이용자의 안전하고 원활한 이동을 지원하기 위해 구축된 자료이다. 현장 기반의 경사도·노면 상태·주차 및 화장실 접근성 등 세부 요소가 반영되어 있으며, 관광약자 맞춤형 콘텐츠 개발, 열린관광지 조성, 관련 정책 수립 등 공공 및 민간 영역에서의 활용을 목적으로 한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
