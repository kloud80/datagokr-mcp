summary_user: 국립중앙도서관 자료의 서지·주제·저자를 RISS, 국회도서관, 미국의회도서관, 프랑스국립도서관, 독일국립도서관, 위키데이터 등 외부 기관의 같은 대상과 이어 주는 링크드 데이터 연결 정보를 건별로 담는다(연결 유형, 연결 기관, 식별자, URI). 연구자·사서·데이터 개발자가 "이 저자나 주제어가 국외 도서관이나 위키데이터에서는 어떤 식별자로 등록돼 있나" 같은 질문에 답할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 이름 매핑이나 반환된 URI·기관 식별자로만 이어 쓴다.
limits: 다른 공공데이터와 바로 붙일 공통 키가 없어 ISBN·도서관코드 기반의 도서관 데이터와는 직접 결합되지 않는다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
