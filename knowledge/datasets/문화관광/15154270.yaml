description_portal: 인터링킹 정보 제공 서비스는 국립중앙도서관의 방대한 데이터들을 링크드 데이터(Linked Data) 기술을 기반으로 상호 유기적으로 연결하여 지식의 단절을 해소합니다. 이 서비스는 자료의 서지, 주제, 저자와 같은 핵심 요소들이 owl:sameAs, skos:closeMatch, dcterms:subject 등의 표준화된 시맨틱 웹 온톨로지 속성을 통해 그 관계를 명확히 정의합니다. 특히, 이러한 연결 범위는 국내의 주요 기관인 RISS, 국회도서관을 넘어, 국외의 권위 있는 기관인 미국의회도서관(Library of Congress), 프랑스국립도서관(BnF), 독일국립도서관(DNB)과 같은 주요 도서관 서비스와 위키데이터(Wikidata)를 포함한 전 세계적인 지식 자원까지 포괄적으로 확장됩니다. 결과적으로 이용자들은 하나의 자료에서 출발하여 통합적이고 입체적인 맥락 속에서 필요한 정보를 끊김 없이 탐색할 수 있으며, 이는 도서관 자료의 정보 가치와 데이터 활용도를 획기적으로 향상시키고 지식 연결의 허브 역할을 수행할 것으로 크게 기대되는 핵심적인 정보 서비스입니다.
