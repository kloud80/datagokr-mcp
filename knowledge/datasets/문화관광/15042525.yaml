description_portal: 충청북도 문화유산위원회와 무형유산 위원회 위원과 전문위원 명단입니다. 이 파일의 구성으로는  성명, 전공분야, 주요경력, 위촉일, 해촉일, 담당분과 등이 있습니다. 문화유산위원회는 충청북도 문화유산 보존 및 활용에 관한 조례에 의거 설치된 심의 기구로 문화유산의 지정, 보존, 활용과 관련된 주요 사항을 심의하고 자문하는 기능을 수행합니다.  유형문화유산, 기념물, 문화유산자료, 민속문화유산, 도등록문화유산 등 다양한 문화유산 분야를 포괄적으로 검토하며 문화유산의 정책 설정과 제도 개선을 기여합니다.무형유산위원회는 충청북도 무형유산 보전 및 진흥에 관한 조례에 의거 설치한 심의 기구입니다.
