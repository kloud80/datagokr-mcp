summary_user: 제주특별자치도가 지정·관리하는 도지정 문화재를 한 건씩 담은 목록으로, 종별·지정번호·문화재명·소재지·지정일자를 주소 단위로 기록한다(CSV 약 28KB). 제주 지역 유형문화유산·기념물·민속문화유산이 어디에 있고 언제 지정됐는지 확인하려는 주민·연구자·관광 콘텐츠 기획자가 쓴다. 공통 조인 키는 없어 국가유산청의 종목코드·지정번호 체계나 다른 문화재 목록과는 문화재명·지정번호·소재지 주소를 직접 맞춰 이어 쓴다.
description_portal: '제주특별자치도에서 지정 관리하는 도지정 문화재와 관련한 데이터를 제공합니다.항목: 종별, 지정번호, 문화재명, 소재지, 지정일자 등*「문화유산의 보존 및 활용에 관한 법률」- 유형문화유산: 건조물, 전적(典籍: 글과 그림을 기록하여 묶은 책), 서적(書跡), 고문서, 회화, 조각, 공예품 등 유형의 문화적 소산으로서 역사적ㆍ예술적 또는 학술적 가치가 큰 것과 이에 준하는 고고자료(考古資料)- 기념물: 절터, 옛무덤, 조개무덤, 성터, 궁터, 가마터, 유물포함층 등의 사적지(史蹟地)와 특별히 기념이 될 만한 시설물로서 역사적ㆍ학술적 가치가 큰 것- 민속문화유산: 의식주, 생업, 신앙, 연중행사 등에 관한 풍속이나 관습에 사용되는 의복, 기구, 가옥 등으로서 국민생활의 변화를 이해하는 데 반드시 필요한 것자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1056'
