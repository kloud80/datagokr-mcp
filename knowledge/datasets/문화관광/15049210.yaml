summary_user: 경기도 내 호텔·리조트를 시설 1곳당 1행으로 담은 목록 파일(csv, 약 6KB)로, 시군명·시설유형·시설명·전화번호·주소·홈페이지·객실 수와 위도·경도를 담는다. 관광객이나 행사 기획자가 '특정 시군에 객실 수가 충분한 호텔·리조트가 어디 있는가'를 확인하거나, 분석가가 시군별 숙박 공급 규모를 비교하는 데 쓴다. 전역 조인 키는 없어서 시군명이나 시설명·주소 문자열 매칭, 또는 위도·경도 좌표로 다른 관광·숙박업 인허가 데이터와 이어 붙인다.
description_portal: 본 데이터는 경기관광공사가 제공하는 경기도 호텔 및 리조트 시설 정보 공공데이터로, 지역 내 주요 숙박 인프라 현황을 체계적으로 정리하여 제공한다. 데이터에는 시설명, 전화번호, 주소, 홈페이지, 객실 수 등 핵심 항목이 포함되어 있어 관광객은 여행 계획 단계에서 합리적으로 숙소를 선택할 수 있다. 또한 지자체와 기관은 관광정책 수립, MICE 개최지 선정, 관광 편의 인프라 확충의 기초자료로 활용할 수 있으며, 기업과 연구기관은 관광산업 분석 및 서비스 개선 연구에 참고할 수 있다. 데이터는 정기적으로 갱신되어 최신성을 보장하며, 공공데이터 개방 취지에 맞게 누구나 접근 가능하다. 이를 통해 관광객 만족도 향상, 지역 경제 활성화, 글로벌 경쟁력 강화에 기여하며, 민간에서는 홍보, 마케팅, 플랫폼 개발 등 다양한 영역에서 활용 가치가 크다.
