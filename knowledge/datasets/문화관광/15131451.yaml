summary_user: 서울시설공단 고척체육센터의 강습 프로그램을 강좌 한 건당 한 행으로 담은 파일(csv, 약 90KB)로, 종목·강좌명·단계, 요일별 운영 여부와 입장 시간, 온·오프라인 접수 정원, 성인·청소년·어린이·경로 요금, 락커 사용 여부, 등록 개월 수 등을 담는다. 시민이 "고척체육센터에서 평일 저녁에 다닐 수 있는 수영 강습이 있고 청소년 요금은 얼마인가"를 확인하거나, 개발자·분석가가 강좌 일정 안내와 요금 비교에 쓴다. 실측 조인 키는 사업장코드(gocheok_workplace_cd)뿐이어서 같은 공단의 다른 체육센터 강습·시설 데이터와 사업장 단위로 묶어 쓰고, 지역 코드나 좌표 같은 공간 키는 없다.
description_portal: 서울시설공단이 운영하는 고척체육센터는 시민들의 체계적인 체육활동 참여를 위해 강습 프로그램 운영 정보를 정형데이터 형태로 제공하고 있습니다. 이 데이터는 종목명, 강좌명, 요일별 입장 시간, 요금, 접수 정원 등의 주요 정보를 포함하며, 강좌의 운영 방식과 세부 내용을 구조적으로 제공합니다. 구체적으로는 사업장코드, 강좌타입, 종목명, 강좌명, 단계, 시작시간 및 종료시간, 요일별 운영 여부와 입장 시간, 오프라인 및 온라인 접수 정원, 성인·청소년·어린이·경로 요금, 기타요금, 부가세 여부, 일일 입장 횟수, 락커 사용 여부, 삭제 데이터 여부, 추가 및 수정 날짜, 기본 등록 개월 수, 온라인 사용 여부, 실제 사용 개월 수, 신규 접수 여부 등 다양한 항목으로 구성되어 있습니다. 이러한 데이터는 시민들이 강습 정보를 정확하게 확인하고 신청할 수 있도록 도우며, 공공기관 및 민간 서비스 개발자들이 강좌 운영 분석, 일정 안내 시스템 구축, 요금 체계 비교 등의 목적으로 폭넓게 활용할 수 있도록 설계되어 있습니다.
