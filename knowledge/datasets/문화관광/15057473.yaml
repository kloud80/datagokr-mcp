summary_user: 경기도 31개 시군의 당구장업 사업장을 한 곳씩 담은 인허가 원천 명부로, 사업장명·인허가일자·폐업일자·영업상태·공사립 구분·도로명/지번 주소·WGS84 좌표·건축물 연면적·보험가입 여부 등을 담는다. 창업 예정자나 상권 분석가가 '우리 시군에 영업 중인 당구장이 몇 곳이고 최근 몇 년 새 얼마나 문을 닫았나'를 확인하는 데 쓴다. 전역 조인 키가 없어서 다른 데이터와는 시군 코드(SIGUN_CD)·시군명이나 주소·좌표로 맞춰 붙여야 하고, 같은 기관의 다른 체육시설업 명부와는 같은 시군 코드로 묶어 쓴다.
description_portal: 이 데이터는 경기도 31개 시군의 당구장업에 대한 인허가 및 운영 현황을 종합적으로 제공하는 자료입니다. 주요 항목으로는 사업장명, 시군명, 인허가일자, 영업상태명, 공사립구분명, 소재지 도로명주소 및 좌표정보, 보험가입여부, 건축물동수 및 연면적, 지도자 수, 회원모집 인원 등이 포함되어 있습니다. 이를 통해 당구장 분포 및 업종 현황을 지역별로 분석하거나 당구장 운영 실태를 파악하는 데 활용될 수 있습니다. 또한, 문화체육 관련 산업 동향 분석, 지역 여가시설 정책 수립, 스포츠 인프라 개선 등 다양한 분야에 유용하게 적용될 수 있습니다.
