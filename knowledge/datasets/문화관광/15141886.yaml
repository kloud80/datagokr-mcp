summary_user: 용산구 관내 영화배급업 사업체를 업소 단위로 담은 인허가 원천 목록으로, 인허가·취소 일자, 영업상태와 상세상태, 폐업·휴업 일자, 소재지 지번·도로명 주소, 좌표, 업소명 등을 담는다. 영화 유통 사업자나 분석가가 '용산구에서 현재 영업 중인 영화배급업체는 어디이고 언제 인허가를 받았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울특별시 용산구에서 운영·관리하는 「영화배급업 인허가 정보」는 관내에서 영화배급업을 영위하는 사업체의 인허가 현황과 행정관리 정보를 종합적으로 제공하는 공공데이터입니다. 이 데이터에는 각 사업체의 업종명, 업태명, 업소명과 같은 기본 식별 정보와 함께, 사업장이 위치한 정확한 주소가 포함되어 있어 해당 사업체의 위치와 범위를 명확히 확인할 수 있습니다. 또한 영업활동과 관련된 행정처분 여부와 그 법적 근거가 포함되어 있어, 법령 준수 여부를 판단하고 제도 이해도를 높이는 데 도움을 줍니다. 이러한 정보는 행정기관이 영화배급업 전반을 체계적으로 관리·감독하고 정책 수립에 활용할 수 있도록 지원하며, 업계 종사자와 일반 시민은 이를 통해 사업체 현황을 신속하게 파악하고 거래나 이용 시 참고자료로 삼을 수 있습니다. 나아가 본 정보는 투명하고 건전한 영화 유통 질서 확립, 지역 문화산업의 지속적 성장, 그리고 용산구민 모두가 풍부한 문화 콘텐츠를 접할 수 있는 환경 조성에 크게 기여할 것입니다.
