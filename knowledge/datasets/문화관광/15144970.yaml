description_portal: 거리공연 장소 데이터는 창원 내 창원아트그라운드, 귀산프린지문화공연정, 내서 삼계 근린공연 야외공연장, 상남분수광장, 용호동 분수광장 등 도심 공공장소에서 사전 허가를 받아 진행된 버스킹, 음악회, 거리극 등의 공연 장소 정보를 정리한 자료입니다. 연번, 시군구, 시설명, 위치, 버스킹 가능시간, 관람가능인원, 담당부서, 전화번호 등의 항목을 포함합니다. 이 데이터는 문화관광 활성화, 시민 참여형 예술 행정 기획, 공연 인프라 접근성 분석, 민원 대응 및 축제 연계 정책 수립, 공간 기반 이벤트 지원 전략 등 다양한 목적으로 유용하게 활용될 수 있으며 GIS 공간 시각화와 연계하면 공연 밀집 지점 분석 및 예술 서비스 접근성 평가에 핵심 기초자료로 기능합니다.
