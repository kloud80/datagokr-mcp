summary_user: 광주광역시관광공사가 주관한 전시회를 건별로 담은 CSV 파일(약 17.6KB)로, 전시회명·전시 시작일과 종료일·장소·규모(참여 업체·부스)·전시품목·주최·주관 기관·연락처·웹사이트를 기록한다. 전시 참가를 검토하는 사업자나 지역 MICE 분석가가 '광주에서 어떤 품목의 전시회가 언제, 어느 규모로 열렸는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공연·행사 데이터와는 전시회명이나 주최·주관 기관명을 이름으로 맞춰서만 연결한다.
description_portal: 본 데이터는 광주광역시관광공사에서 관리하는 주관 전시회 개최현황을 수록한 자료이다. 전시회명, 전시 시작 및 종료일, 장소, 규모(참여 업체 및 부스), 전시품목, 주최 및 주관 기관, 연락처, 웹사이트 등의 세부 항목이 포함되어 있다. 과거 기록부터 현재까지의 전시회 정보를 체계적으로 관리하여 전시회 운영 현황과 구성 실태를 파악할 수 있도록 한다. 이를 통해 전시회 기획 및 운영의 효율성을 제고하며, 관련 부서와 이용자에게 신뢰성 있는 정보를 제공한다. 데이터는 정기적으로 갱신되어 최신 상태를 유지한다.
