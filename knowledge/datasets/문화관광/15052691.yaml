summary_user: 역대 전국체육대회의 기록경기 결과를 선수·경기 단위 건별로 담은 파일로, 대회명·종목·종별·세부종목·경기구분·경기일과 선수 성명·소속, 순위·기록이 들어 있다(zip 약 14MB). 분석가나 체육 관계자가 '특정 종목 세부종목에서 역대 전국체전 우승 기록이 어떻게 변해 왔나', '어느 선수·소속이 어떤 순위와 기록을 냈나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 체육 데이터와는 대회명·종목명·선수 성명·소속명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 대한체육회가 주관하고 전국의 시도에서 참가한 역대 전국체육대회에서 수립된 각종  경기 결과 중 기록경기 결과에 대한 상세 정보를 제공합니다.이 데이터는 대회명, 종목, 종별, 세부종목, 경기구분, 경기일 등 경기에 대한 기본 정보를 담고 있습니다. 또한, 해당 기록을 수립한 선수 정보인 성명 및 소속명과 함께 경기 결과인 순위와 기록을 제공합니다. 자료 바로가기 링크를 통해 더 자세한 정보를 얻을 수 있습니다. 이 데이터를 통해 전국체전의 역사적 기록들을 분석하고 선수들의 성과를 체계적으로 파악할 수 있습니다.
