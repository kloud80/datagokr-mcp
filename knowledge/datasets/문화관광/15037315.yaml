description_portal: '- 전라남도 시군의 씨름장(시설명, 소유기관, 관리주체, 면적, 수용인원, 사업비 등)에 관한 데이터를 조회하실 수 있습니다.- "씨름"은 한국의 전통 민속 스포츠로, 샅바를 잡고 상대를 넘어뜨리는 방식의 일대일 격투 경기입니다. 신체 접촉이 중심이지만, 기술과 힘, 균형 감각을 모두 요구하는 전통 무예이자 국민 체육입니다.- 정의: 상대의 샅바를 잡고 힘과 기술로 넘어뜨리는 한국 전통 격투 스포츠- 기원: 삼국시대 이전부터 민속놀이로 전승됨- 특징: 맨손 격투, 샅바 착용, 모래판 위에서 경기- UNESCO 등재: 2018년 남북 공동으로 인류무형문화유산 등재'
