summary_user: 부산광역시 중구 관내 공연장을 한 곳씩 담은 목록으로, 공연장명칭·등록일·도로명 소재지·전화번호·객석수·영업상태·이용가능요일·휴게시설 유무를 기록한다(CSV 603바이트의 소규모 파일). 주민이나 공연 기획자가 '중구에서 지금 영업 중인 공연장 중 객석이 일정 규모 이상인 곳은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연장ID 같은 코드로 바로 잇지 못하며, 공연장명칭이나 도로명 주소를 매칭해 KOPIS 공연장·공연 목록이나 다른 문화시설 데이터와 연결한다.
