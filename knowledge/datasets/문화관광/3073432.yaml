summary_user: 성남시에 등록·운영 중인 여행업체(국내·국외·일반여행업)를 업체 한 곳당 한 행으로 담은 파일로, 구별·업종·상호명·소재지주소·전화번호·데이터기준일자를 싣는다. 시민이나 사업자가 '분당구에 있는 국외여행업체는 어디이고 연락처는 무엇인가'처럼 구·업종별로 업체를 찾을 때 쓰고, 분석가는 구별 여행업 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소를 맞추는 방식으로만 이어 쓰며, 관광사업 등록 원장과 연결하려면 이름·주소 매핑이 필요하다.
description_portal: 성남시 내 운영중인 여행업(국내,국외,일반여행업) 현황 데이터로, 업종,상호명,소재지주소,전화번호 등의 항목으로 구성되어 있습니다. 성남시는 수도권 남부의 핵심 거점도시로서, 교통 접근성이 우수하고 인접 도시와 연계된 관광 수요가 풍부한 지역입니다. 이에 따라 여행업 등록업체도 일정 수준 유지되고 있으며, 주로 국내외 패키지 여행 기획, 항공권·숙박 예약 대행, 기업체 연수·단체 관광 등을 중심으로 운영되고 있습니다.성남시에는 일반여행업, 국외여행업, 국내여행업 유형별로 수십 곳의 업체가 등록되어 있습니다. 대부분은 분당구, 수정구, 중원구 주요 상권에 분포하고 있습니다.
