summary_user: 한국동서발전 본사 시설물을 누가 언제 어떤 목적으로 쓰겠다고 신청했는지를 신청 건별로 담는 API로, 포털 설명상 예약일·예약시간·인원·그룹명·시설물명·이용목적 등이 들어 있다. 지역 주민이나 단체가 한국동서발전 본사 시설이 어느 날짜·시간대에 이미 예약돼 있는지 확인하거나, 연구자가 공공기관 시설 개방·대관 실태를 살필 때 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 시설물명 같은 이름 매칭이나 같은 기관 데이터끼리만 이어 쓴다.
