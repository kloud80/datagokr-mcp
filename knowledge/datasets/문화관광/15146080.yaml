description_portal: '서울시 서울도서관의 연간 도서 보유량 현황 정보* 일회성 데이터로 추가 업데이트 없음* 조사기간 : 2018년 1월 1일 ~ 2023년 12월 31일* 2023년 기준 서울시 202개 공공도서관 중 서울특별시교육청 설립 공공도서관 22개 및 사립 공공도서관 7개를 제외하고, 공공도서관부호를 부여받은 172개관과 서울도서관 총 173개관을 대상으로함이용자 수(명): 도서관을 이용한 총 인원 수를 기록.장서 수(권): 전체 소장 장서 권 수와 보존가치가 있는 자료(귀중·유일·서울·고서) 수량 포함.보존가치 자료: 귀중본, 유일본, 서울 관련 자료, 고서 등 장서의 특수성과 희귀성을 나타냄.대출 건수(건): 해당 기간 동안 발생한 전체 대출 건수를 수록.도서관별 세부 현황: 전체와 개별 도서관(예: 서울도서관)별 장서 구성과 이용 통계 제공.'
