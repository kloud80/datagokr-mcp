description_portal: '1. 사이트 : 인천투어(https://itour.incheon.go.kr/)2. 목록명 : 제목, 발행처, 발행일시, 링크, 구분, 언어구분3. 데이터 설명인천광역시 인천투어 정보시스템의 가이드북 현황은 인천의 관광 정보를 다양한 언어로 제공하는 콘텐츠로, 국내외 관광객의 편의를 높이기 위해 제작되었습니다. 본 공공데이터는 각 가이드북의 제목, 발행처, 발행일시, 다운로드 링크, 언어구분(국문, 영문, 중문 간체·번체, 일문, 러시아어, 베트남어, 태국어 등)을 포함하고 있으며, 인천의 주요 관광지, 테마여행, 문화유산, 맛집, 교통정보 등을 담고 있습니다. 해당 데이터는 관광 콘텐츠 개발, 외국인 관광객 안내, 스마트관광 서비스 구축 등에 활용 가능하며, 공공데이터포털을 통해 누구나 자유롭게 접근하고 활용할 수 있습니다. 지속적인 업데이트를 통해 최신 관광 트렌드를 반영하고 있습니다.'
