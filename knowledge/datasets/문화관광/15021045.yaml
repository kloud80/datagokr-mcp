summary_user: 한국남부발전 영월빛드림본부 주변 영월 지역의 박물관·공원·미술관 등 관광지를 한 행씩 담은 소규모 목록 파일(csv, 약 2KB)로, 위치(도로명 주소)·휴무일·입장료·홈페이지를 담는다. 영월 발전소 견학을 계획하는 단체나 여행자가 '견학 전후로 들를 만한 별마로천문대·탄광문화촌 같은 곳의 입장료와 쉬는 날은?'을 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키(TourAPI contentId·지역코드 등)가 없어, 다른 관광 데이터와는 관광지 이름이나 주소 문자열로만 맞춰 이어 쓴다.
