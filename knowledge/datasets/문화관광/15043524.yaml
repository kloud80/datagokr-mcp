summary_user: 제주 조천읍 선흘리의 녹차 테마 파크 다희연 한 곳에 대한 무장애 여행 정보를 담으며, 실측 컬럼은 아이디·위도·경도·해발고도로 이루어진 지점 단위 좌표 자료다. 휠체어 이용자나 보호자가 다희연의 이동 동선과 고도차를 미리 확인하려 할 때, 또는 지자체·분석가가 열린관광지 접근성 개선 지점을 검토할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 시설 이름이나 좌표(위도·경도)로 맞춰 이어 써야 한다.
description_portal: '"제주특별자치도_무장애여행정보_46.다희연 데이터를 제공합니다.* 다희연은 제주특별자치도 제주시 조천읍 선흘리 일대 약 6만 평 규모의 녹차 테마 파크로, 자연녹차밭, 동굴 구조의 산책 동선, 동굴카페, 족욕장, 녹차밭 전망대 등을 포함한다. 무장애 여행자를 위한 코스로 장애인 주차구역, 휠체어 접근 가능한 출입구 및 동선, 장애인 화장실이 마련되어 있으며, 주 진입로와 실내 관람로는 무단차 또는 경사로로 연결돼 접근성이 확보되어 있다. 다만 일부 구역(고도차가 있는 전망대, 짚라인, 비포장 동굴 구간 등)은 휠체어 이용자에 제약이 있을 수 있음을 참고해야 한다. 이 정보는 무장애 관광지 안내, 접근성 개선, 관광 정책 수립 및 열린관광지 조성을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
