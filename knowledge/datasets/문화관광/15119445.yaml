description_portal: 전국 만 20세 이상 69세 이하 성인 남녀 5,000명을 대상으로 실시된 국민의 언어 의식 조사 결과를 기반으로, 국어에 대한 관심도와 국어 사용 인식, 표준어와 방언, 신조어 및 외래어 사용, 언어 예절, 욕설 및 비속어 사용 빈도, 인터넷 언어, 공공기관 언어 등 언어생활 전반에 대한 국민의 생각과 태도를 종합적으로 분석할 수 있는 데이터입니다. 이를 통해 정책 수립, 교육 자료 개발, 언어문화 연구, 사회 변화 분석 등 다양한 분야에서 국민의 언어 의식 현황을 파악할 수 있으며, 이를 바탕으로 언어 정책 개선과 국어 교육 방향 설정에도 활용할 수 있습니다. 또한 시대별 언어 사용 경향 비교, 세대별 언어 태도 분석, 언어문화 변화 모니터링 등 학술적·실무적 연구에 중요한 기초 자료로 쓰입니다.
