summary_user: 서울시와 유관 기관이 발간해 서울책방에서 다루는 도서를 한 권당 한 행으로 담은 목록으로, 도서ID·분류(카테고리)·도서명·발행기관·판매여부·판매가·간략설명·출판년도·페이지수·표지이미지 경로·판매량을 포함한다. 시민이 서울시 발간 자료 중 지금 살 수 있는 책과 가격을 찾거나, 분석가가 분야별 판매량으로 어떤 정책 간행물이 많이 팔렸는지 볼 때 쓴다. 실측 컬럼에 ISBN 같은 전역 조인 키가 없어 국가서지·도서관 데이터와는 도서명·발행기관 이름 매칭으로만 이어 쓸 수 있다.
description_portal: 서울시 서울책방 도서판매목록 정보는 서울시 및 유관 기관에서 발간한 도서를 체계적으로 관리하고 시민에게 제공하기 위한 기초 데이터입니다. 도서ID를 통해 각 도서를 고유하게 식별할 수 있으며, 카테고리ID와 카테고리명으로 분야별 분류와 주제 파악이 가능합니다. 도서명과 발행기관 정보는 자료의 성격과 발간 주체를 이해하는 데 도움이 되며, 판매여부와 판매가는 실제 구매 가능성 및 비용 정보를 제공합니다. 간략설명, 출판년도, 페이지수는 도서의 내용과 분량, 최신성을 확인할 수 있는 핵심 항목입니다. 도서이미지경로는 시각적 정보를 제공하여 온라인 목록 및 홍보 자료에 활용하기 좋고, 판매량은 수요와 인기도를 보여주는 지표로서 도서 기획과 정책자료 활용도 분석에 유용하게 쓰일 수 있는 데이터입니다.
