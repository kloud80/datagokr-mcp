description_portal: 서울특별시 용산구에 정식으로 신고된 체육시설업 중 당구장업(당구장, 실내당구장)의 현황 정보를 제공하고 있습니다. 이 정보에는 당구장업(당구장)에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구에 정식으로 신고된 다른 업종의 신고체육시설업의 정보 또는 공공체육시설에 대한 정보가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
