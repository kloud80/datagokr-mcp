summary_user: 전국 자치단체가 관리하는 승마장업 인허가 정보를 업소 한 곳당 한 행으로 담은 건별 원천 데이터로, 전체 292건이며 인허가일 기준 1991-07-03부터 2026-09-18까지 걸친다. 승마를 즐길 곳을 찾는 국민이나 체육시설 상권을 보는 분석가가 어느 지역에 승마장이 영업 중이고 지도자 수와 건물 규모가 어떤지 확인하는 데 쓴다. 지번주소·도로명주소(address) 키로 다른 체육시설업이나 상권 데이터와 주소 기준으로 이어 쓰고, 사업자번호 같은 별도 조인 키는 필드에 없다.
description_portal: '생활_승마장업 데이터는 말타기와 같이 승마를 즐길 수 있도록 운영하는 업소 데이터로 인허가일자, 영업상태, 주소, 사업장명, 지도자수, 건축물동수, 건축물연면적 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 승마장업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 스포츠산업과 / 044-203-3156 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
