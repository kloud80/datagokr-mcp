summary_user: 강원특별자치도 내 등록공연장을 한 행에 한 곳씩 담은 파일로, 시군구·시설명·시설구분과 개관일자·공연장등록일, 공연장·무대 면적, 객석수, 구동무대기계 수, 문예회관 여부를 담는다(csv 약 2KB 규모). 강원도 어느 시군에 몇 석 규모의 공연장이 있는지, 문예회관이 아닌 민간 공연장이 어디 있는지 같은 지역 공연 인프라 분포 질문에 쓴다. 전역 조인 키가 없어 KOPIS 공연장ID(mt10id) 같은 코드와는 직접 이어지지 않으므로, 시설명과 시군구 이름을 맞춰 KOPIS 공연장 목록이나 다른 문화시설 데이터와 연결해야 한다.
limits: 공연장 코드가 없어 다른 데이터와의 연결은 시설명·시군구 이름 매칭에 의존하며, 이름 표기 차이로 누락이 생길 수 있다. 명세상 수시 갱신으로 정기 시계열이 아니므로 시점별 변화 추적에는 맞지 않고, 공연 일정·관객 수·매출 정보는 담지 않는다.
