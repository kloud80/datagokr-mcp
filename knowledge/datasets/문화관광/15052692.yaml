summary_user: 역대 전국체육대회의 경기 일정을 경기 한 건 단위로 담은 파일로, 대회명·종목·종별·세부종목·경기구분·경기장·경기일·경기시간과 관련 웹주소를 포함하며 약 16.8MB 분량의 CSV로 내려받는다. 선수·지도자나 분석가가 특정 종목·종별의 과거 전국체전 경기가 언제 어느 경기장에서 어떤 구분(예선·결승 등)으로 열렸는지 확인할 때 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어 대회 결과·경기장 데이터와는 대회명·종목명·경기장명 같은 이름을 맞춰서 이어 써야 한다.
description_portal: 대한체육회가 주관하고 전국의 각 시도가 참가한 역대 전국체육대회의 경기 일정에 대한 상세 정보를 제공합니다.이 데이터는 각 경기의 관련 정보를 확인할 수 있는 웹주소를 포함하며, 각 경기별 대회명, 종목, 종별, 세부종목 등 경기에 대한 핵심 정보를 제공합니다. 또한, 경기가 진행되는 구체적인 정보인 경기 구분, 경기장, 경기일, 그리고 정확한 경기시간 기록을 데이터 내에 포함하고 있습니다. 특정 종목이나 종별의 과거 전국체전 경기 일정을 파악하여 활용하는 등 다양한 목적으로 사용할 수 있습니다.
