description_portal: '한국문화진흥주식회사 뉴서울 컨트리 클럽의 골프장 문화코스현황(홀, 미터, 핸디캡, 파)에 대한 데이터 제공 합니다.스케일과 전략성을 겸비한 걸작 문화코스는 총 연장 6,471m 페어웨이가 넓고 길며, 자연지형과 지세를 살려 스케일이 웅대할 뿐 아니라 각 홀마다 언듀레이션이 다체롭고, 포대그린이 많아 정교한 그린공략이 요구되는 전략적인 코스입니다.TEE-SHOT : 좌우에 울창한 숲이 있는 아늑한 느낌의 홀입니다. 무리하게 왼쪽 벙커 방향으로 공략하기 보다는 우측으로 공략하는 것이 안전하게 공략하는 방법입니다.2ND-SHOT : 좌그린 사용시에는 그린 왼쪽 해저드에 주의하여 공략하는 것이 좋습니다.GREEN : 특별한 경사가 없는 무난한 그린입니다.'
