summary_user: 김해시 관내에 있는 국가유산의 지정·등록 현황을 유산 1건당 1행으로 담은 파일로, 종별·유산명·지정내역(면적·책·구)·소유자·소재지 주소·지정일·관리단체·위도·경도를 포함한다. 김해시의 문화유산 보존·활용 정책을 검토하는 담당자나 분석가가 "김해시에 국가지정·도지정·등록 유산이 각각 어디에 몇 건 있고, 관리 주체는 누구인가"를 확인할 때 쓴다. 국가유산청 코드(종목코드·지정번호)나 전역 조인 키는 없으므로, 다른 데이터와는 유산명 매칭이나 소재지 주소·위도·경도를 통한 공간 결합으로 이어 쓴다.
description_portal: 김해시 국가유산 지정(등록) 현황 자료는 관내에 소재한 국가유산의 목록과 세부 내역을 체계적으로 정리한 데이터로, 유산의 보존 및 활용, 정책 수립을 위한 기초자료로 활용됩니다. 국가유산은 문화유산, 무형유산, 자연유산으로 구분되며, 이와 함께 문화유산자료, 등록문화유산 등도 포함됩니다. 본 자료에는 국가유산의 명칭, 지정 구분(국가지정·도지정·등록문화재), 소유자 정보, 지정 내역(면적, 책, 구 등), 정확한 소재지 주소, 지정일자, 관리 주체(관계 기관 또는 단체), 위도·경도 좌표 등 주요 정보가 포함되어 있습니다.
