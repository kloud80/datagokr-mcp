description_portal: 스포츠강좌이용권 등록시설은 서울올림픽기념국민체육진흥공단의 스포츠바우처 시설정보서비스로 스포츠강좌이용권(구 스포츠바우처) 관련 시설정보를 제공합니다. 관련된 시설의 시도코드, 시군구코드, 주종목코드 등 조회조건으로 스포츠강좌이용권 관련 시설정보를 조회할 수 있습니다. 또한, 관련 시설의 시설명, 대표자명, 사업자등록번호, 대표자전화번호, 시설우편번호, 주소, 주종목명, 시설구분명 등의 정보를 포함하고 있습니다. 이 서비스는 스포츠강좌이용권 사용이 가능한 등록 시설의 정보를 제공하여 수혜자의 시설 선택과 지역별 체육자원 분포 분석에 활용될 수 있습니다.
