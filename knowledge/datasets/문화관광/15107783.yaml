summary_user: 스포츠강좌이용권(구 스포츠바우처)을 쓸 수 있는 등록 체육시설을 시설 한 곳당 한 행으로 담으며, 시설명·대표자·사업자등록번호·전화번호·우편번호·도로명주소·주종목·시설구분을 시도·시군구 코드와 함께 제공하는 전국 범위 데이터다. 이용권 수혜자가 '우리 동네에서 이용권으로 수영 강좌를 들을 수 있는 시설이 어디인가'를 찾거나, 분석가가 지역별·종목별 이용권 등록시설 분포를 비교하는 데 쓴다. 사업자등록번호(brno)를 키로 사업자 상태 조회나 체육시설업 등록 정보와 잇고, 시도·시군구 코드와 주소로 지역 통계와 붙여 쓴다.
limits: 검증 호출에서 수신된 행이 0건이어서 실제 응답 규모와 필드 채움 상태는 확인되지 않았으므로, 시도·시군구·주종목 조회조건을 바꿔 가며 응답을 확인해야 한다. 개발계정은 하루 10,000회로 호출이 제한된다.
