description_portal: 한국언론진흥재단 미디어연구센터에서 정부광고 수수료를 재원으로 제작한 조사연구 자료입니다. 댓글 및 실검폐지에 대한 국민인식을 주제로 진행된 사회적 이슈 관련 일회성 조사로, 온라인 플랫폼의 댓글 시스템과 실시간 검색어 서비스 폐지에 대한 국민들의 인식과 태도를 종합적으로 분석했습니다. 디지털 미디어 환경에서 댓글과 실시간 검색어가 여론 형성과 정보 확산에 미치는 영향, 그리고 이러한 서비스의 폐지가 표현의 자유와 정보 접근권에 미칠 수 있는 영향에 대한 시민 의식을 파악하고자 했습니다. 온라인 공론장의 변화와 관련된 중요한 사회적 쟁점에 대한 기초 자료를 제공합니다. 조사연구에 대한 PDF 파일 형태로 제공되며, 공공누리 공공저작물 자유이용허락 조건에 따라 누구나 자유롭게 활용할 수 있습니다.
