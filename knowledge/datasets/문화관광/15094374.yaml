summary_user: 빅카인즈(BIGKinds)에 수집된 국내 주요 신문·방송의 국회 관련 기사를 기사 한 건씩 담은 메타데이터로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목으로 구성되며 CSV 파일 하나(약 54MB)로 제공된다. 정치학·언론 연구자나 정책 분석가가 "특정 시기 국정감사·예산 심의 보도가 언론사별로 얼마나, 어떤 키워드로 다뤄졌나"처럼 국회 의제의 보도 빈도와 키워드 변화를 살피는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자나 언론사 이름 같은 이름 매칭으로만 연결한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 국회 관련 뉴스 분석 메타정보 자료입니다. 국회는 입법·예산 심의·행정부 견제 등 민주주의의 핵심 기능을 수행하는 기관으로, 언론 보도에서 주요한 정치적 의제로 다뤄집니다. 본 자료는 국내 주요 신문과 방송에서 보도된 국회 관련 기사들을 수집·분석하여, 특정 시기별 주요 키워드와 보도 빈도의 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 입법 활동, 국정 감사, 정당 간 협상, 정치 갈등과 합의 과정, 국회의원의 역할과 책임 등이 언론 담론에서 어떻게 다루어졌는지를 객관적으로 파악할 수 있습니다. 또한 정치학 연구, 정책 분석, 언론 연구 및 시민 교육 현장에서 활용 가능한 기초 자료로, 의회 민주주의의 흐름과 정치적 의제의 진화를 이해하는 데 중요한 참고 자료가 될 수 있습니다.
