description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 어영공원은 제주시 용담해안도로를 따라 조성된 해안 공원 겸 쉼터로, 넓게 펼쳐진 해안 산책로와 벤치, 바닷가 전망, 놀이터 등이 마련되어 있어 휴식과 경관 감상을 함께할 수 있는 공간이다. 장애인 전용 주차구역과 무단차 접근로, 적절한 폭의 보행 통로, 장애인 화장실 및 점자블록 등 무장애 편의시설이 일부 갖춰져 있어 휠체어나 유모차 이용자, 고령자, 교통약자 등도 접근 가능하며, 이동 약자의 편안한 관광 경험을 지원한다. 낮에는 바다와 해안선을 조망하며 산책과 휴식을 즐길 수 있고, 해가 지면 조명과 함께 바다와 하늘이 어우러지는 야경을 감상할 수 있어 관광객, 현지 주민, 가족 단위 방문객 모두에게 적합하다. 이 데이터는 관광 안내, 무장애 관광지 홍보, 접근성 중심 여행 코스 설계, 열린관광지 정책 수립, 지도 및 관광 콘텐츠 제작 등 공공·관광 분야 기초 자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
