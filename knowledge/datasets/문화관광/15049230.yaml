summary_user: 인천광역시 통합전자도서관의 전자자료 대출정책을 콘텐츠 유형(콘텐츠타입)별로 담은 작은 규정표(csv 208바이트)로, 최대 대출 권수·대출 기간·연기 횟수와 기간·최대 예약 건수·사용 여부를 담는다. 전자책 이용자나 도서관 서비스 분석가가 '인천 전자도서관에서 전자책은 몇 권까지, 며칠 동안 빌릴 수 있고 몇 번 연기할 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 도서관코드·ISBN 같은 전역 조인 키가 없어 다른 도서관·대출 데이터와는 콘텐츠 유형 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 인천광역시 통합전자도서관의 대출정책 데이터는 전자자료 서비스 운영을 위해 반드시 필요한 핵심 관리 정보이며, 전자책 이용자들의 대출 관련 규정을 체계적으로 관리하기 위해 마련된 핵심 정보 담고 있습니다. 이 데이터는 이용자가 동시에 대출할 수 있는 최대 권수, 대출 기간은 며칠인지, 대출은 몇권까지 가능하며, 예약 가능 건수, 대출 연기 기간 등의 유의사항이 포함됩니다. 또한 이 데이터는 도서관별 체결한 전자책 공급 계약이나 내부 운영 방침, 조건에 따라 정책이 상이하게 적용될 수 있어, 이용자가 소속되어 있는 도서관에 따라 권한과 대출 서비스 가능 범위가 달라질 수 있습니다. 이러한 대출정책 데이터는 도서관이 전자자료를 효율적으로 배분하고, 이용자가 자신의 권한과 한도를 명확히 이해·인지하여 원활하게 전자자료 서비스를 이용할 수 있도록 지원하는 근거 자료로 활용됩니다.
