description_portal: '1. 목록명 : 인천광역시 전통사찰 현황2. 키워드 : 사찰 전통 현황3. 데이터 설명:  인천광역시의 전통사찰 현황에 대한 데이터를 제공하고 있습니다. 이 데이터에는 소관 군구, 등록번호, 전통사찰 명칭, 전통사찰 소재지, 전통사찰 보존구역 지정 면적, 주지명, 종파, 지정일 등 기본정보를 담고 있습니다. 이 데이터는 지역 문화유산 보존 및 불교문화 연구 등을 위해 제공되며, 사찰의 분포 현황을 파악하거나 정책 수립에 참고할 수 있습니다. 또한 개방된 공공데이터 형태로 제공되어 행정기관, 연구자, 일반 국민이 자유롭게 활용할 수 있으며, 문화유산 보호 및 지역사회 가치 확산에도 기여합니다.이를 통해 전통사찰의 등록 정보를 확인할 수 있으며, 데이터는 연간 업데이트되어 최신 정보를 반영합니다. 해당 데이터는 공공데이터포털에서 무료로 다운로드할 수 있으며, CSV 형식으로 제공됩니다.'
