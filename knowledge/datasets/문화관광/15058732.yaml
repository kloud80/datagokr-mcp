summary_user: 경기도 내 어린이 놀이시설을 시설 한 건씩 담은 목록으로, 시군명·시설번호·놀이시설명·설치장소·설치일자·민간/공공 구분·실내/실외 구분·도로명/지번 주소·우편번호·위경도(WGS84)를 포함한다. 학부모나 정책 분석가가 "우리 시군에 공공 실외 놀이시설이 몇 곳이고 어디에 몰려 있나"를 확인하거나 놀이시설 신규 설치 후보지를 찾는 데 쓴다. 전역 조인 키는 없어서 시군명·시군코드(SIGUN_CD)로 같은 기관의 경기도 데이터와 묶거나, 주소·위경도로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 경기도의 어린이 놀이시설 현황입니다. 놀이시설명, 설치장소, 소재지주소(도로명, 지번), 설치일자, 실내외구분 등의 정보를 제공합니다.이 데이터는 경기도 내 어린이 놀이시설의 설치 현황을 정리한 자료로, 각 놀이시설의 설치 장소, 운영 주체, 실내외 여부, 시설명, 위치(도로명주소·지번주소), 설치일자, 위경도 좌표(WGS84) 등의 정보를 포함합니다. 주요 항목에는 시군명, 시설번호, 놀이시설명, 민간·공공 구분, 실내·실외 구분, 소재지 주소, 설치일자 등이 있으며, 이를 통해 지역별 어린이 놀이환경의 현황을 분석하고, 시설 보완이나 신규 설치에 활용할 수 있습니다. 실외 놀이시설은 주택단지, 도시공원 등에 주로 위치하며, 실내 시설은 어린이집, 복지시설 중심으로 설치됩니다. 본 데이터는 아동 복지 정책, 생활SOC 분석, 놀이공간 안전관리 체계 구축, 육아 인프라 정책 등에 유용하게 활용될 수 있으며, 특히 위경도 좌표를 활용해 GIS 기반의 공간 분석도 가능합니다. 데이터는 지자체 및 관련 공공기관이 관리하는 공식 자료입니다.
