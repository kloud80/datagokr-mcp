description_portal: '제주특별자치도는 잊혀져가는 제주의 주요 민속문화 자원에 대한 가치발굴과 원형보존을 위해 관련 자료를 동영상, 그래픽, 플래쉬애니메이션 등으로 디지털화하여 제공하고 있습니다.*제주의식주: 단령(남성혼례복), 정낭, 어린이용 물옷, 두거리집, 직조, 고소리, 올레, 모자(대패랭이), 갈옷(감물 들이는 모습), 마당, 갈옷만들기, 초가집 전체모습, 우영, 검질매기복장, 통시, 막살이집, 나막신 만들기, 봇뒤창옷, 낭푼밥상, 짚신짜기, 집줄놓기, 베매기, 세거리집, 해녀, 도롱이, 지붕일기, 눌굽, 물레질, 물소중이, 원삼(여성혼례복), 안뒤, 설피(태왈)*파일을 다운로드 하시면 관련 설명 자료가 함께 첨부되어 있습니다. ※ 추가 참고 자료: 제주도청 문화/역사/체육 분야별홈페이지 디지털콘텐츠 https://www.jeju.go.kr/culture/digitalContents/directory.htm'
