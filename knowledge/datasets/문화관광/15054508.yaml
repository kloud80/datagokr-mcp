summary_user: 울산시설공단이 관리하는 문수체육시설의 수영·아쿠아로빅·생활체조실·테니스장·인라인 경기장·스쿼시·궁도장·사격장 등 종목별 이용 요금표를 담은 작은 CSV 파일(약 2.9KB)로, 한 행이 구분(월 강습·월 자유이용권·일일입장·대관 등), 종목, 연령별 이용구분, 이용 시간, 요금 한 건이다. 울산 시민이나 외부 방문객이 "문수체육시설에서 청소년이 수영 월 강습을 받으면 한 달에 얼마인가"처럼 이용 전에 요금을 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·종목명을 맞추거나 같은 기관(울산시설공단) 기준으로만 연결한다.
description_portal: 울산시설공단에서 관리하는 문수체육시설의 수영 종목, 아쿠아로빅 종목, 생활체조실, 테니스장, 인라인 경기장, 스쿼시, 궁도장, 사격장 등 다양한 종목에 대한 이용 요금 정보를 체계적으로 제공하는 공공데이터셋입니다. 울산 시민뿐만 아니라 외부 방문객들도 체육 시설을 이용할 때 필요한 요금 정보를 사전에 확인할 수 있도록 구성되어 있습니다. 또한 구분(월 강습, 월 자유이용권, 일일입장, 대관 등), 종목, 이용 구분(성인, 청소년, 어린이 등), 이용 시간, 이용 요금, 데이터 기준일자 등 다양한 항목이 포함되어 체계적인 이용 안내를 제공합니다.
