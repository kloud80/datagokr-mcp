summary_user: 제주 별빛누리공원 한 곳의 무장애 여행 정보를 담는다. 장애인 주차구역·휠체어 출입로·엘리베이터·장애인 화장실·수유실 같은 편의시설의 위치(위도·경도·해발고도)와 장소 설명, 이미지가 포함된다. 휠체어 이용자나 유아 동반 가족이 "별빛누리공원 안에서 휠체어로 갈 수 있는 곳과 도움이 필요한 곳은 어디인가"를 확인할 때나, 접근성 기반 여행 코스를 짤 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 TourAPI 관광지 정보나 다른 무장애여행 파일과는 시설 이름 또는 좌표로만 맞춰 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 별빛누리공원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 제주별빛누리공원은 천체 탐구와 천문 과학 경험을 제공하는 과학문화 공간으로, 4D 영상관, 천체투영실, 망원경 관측실, 태양계 광장 및 해시계 광장 등을 갖춘 종합 천문 우주 체험 공간입니다. 이 데이터는 장애인 주차구역, 휠체어 접근 가능한 출입로, 엘리베이터, 장애인 화장실, 휠체어 및 유모차 대여, 수유실 등 교통약자와 유아 동반 방문객을 고려한 무장애 편의시설 현황을 포함하고 있습니다. 일부 실내 관람실 — 천체투영실, 관측실 등 — 은 계단 단차나 휠체어 관람석 부재 등으로 인해 ‘도움 필요’ 구간이 있으나, 외부 출입로 및 주요 공용 공간은 대부분 휠체어 접근성이 확보되어 있어 무장애 관광지로 적합합니다. 본 정보는 무장애 관광지 안내, 접근성 기반 여행 기획, 관광 서비스 개선 및 문화정책 수립을 위한 기초 자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
