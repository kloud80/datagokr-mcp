description_portal: 부산광역시 체육시설관리사업소에서 운영하고 있는 수영장 내 사물함 이용 정보입니다.사물함은 수영장을 이용하는 시민들의 편의를 위해 설치된 공공집기비품으로 누구나 이용할수 있습니다.주로 수영장 정기 이용권을 접수 하신 분들 중에서 신청자들 중 추첨을 통해 사물함이 제공됩니다. 수영장 매표관리시스템의 사물함 현황 데이터로 사물함번호, 시작일자, 종료일자 정보를 제공합니다.전체 사물함 1,100개 중 사용중인 사물함의 데이터만 제공합니다. 이는 언제 사물함을 이용하였고 언제 사물함의 이용기간이 만료되었는지 제공되는 정보입니다.공식적인 대회가 개최되는 기간에는 시민에게 개방되지 않습니다.
