description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 신천리벽화마을은 제주 서귀포시 성산읍 신천리에 위치한 벽화마을로, 기존 어촌마을 골목과 담벼락에 다양한 벽화가 더해진 문화예술형 관광지이다. 영화 촬영을 계기로 시작된 벽화 작업은 이후 지역 작가 및 예술가들의 참여로 확대되어, 해녀·제주마·동백꽃·만화 캐릭터 등 다채로운 그림들이 마을 곳곳을 장식하고 있다. 주변에는 식당, 카페, 주차장, 화장실 등 기본 편의시설과 함께 무장애 접근 경로가 마련되어 있어 이동 약자나 고령자, 유모차 동반자도 비교적 편안하게 산책할 수 있다. 이 데이터는 마을 관광 안내, 무장애 관광지 홍보, 접근성 중심 여행 코스 설계, 지도 서비스 구축, 관광 콘텐츠 제작, 열린관광지 정책 수립 등 공공 및 관광 분야에서 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
