summary_user: 국립공원 주변에 있는 문화시설을 시설 한 곳씩 담은 POI 목록으로, 시설명·주소·설명과 등록·수집 일자 등을 전국 범위로 제공한다. 관광객이나 문화관광 기획자가 '특정 국립공원 근처에 들를 만한 문화시설이 어디 있나'를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시설명·주소 같은 이름 매핑이나 같은 기관(한국문화정보원) 데이터의 고유ID(LOCAL_ID)로만 연결한다.
description_portal: 국립공원 주변에 위치한 다양한 문화시설의 위치와 상세 정보를 제공하는 데이터셋입니다. 고유ID, 국립공원명, 시도명, 시군구명, 관광지리명, 주소, 위도·경도 등 주요 컬럼을 포함하고 있어, 문화시설의 위치 파악과 접근성 분석에 유용합니다. 그뿐만 아니라, 관광객, 연구자, 정책 담당자 등이 국립공원 인근 문화시설을 효율적으로 탐색하거나, 관광자원 개발, 문화관광 서비스 기획 등에 활용할 수 있습니다. 이 외에도 정확한 위치 정보와 다양한 시설 데이터를 통해 지역 문화 활성화에 기여할 수 있습니다.
