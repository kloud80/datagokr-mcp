summary_user: 경기도 안에서 관광객이 들를 수 있는 전통시장·아울렛·특산물 판매점·쇼핑거리 같은 쇼핑 장소를 한 곳당 한 행으로 담은 목록으로, 시군명·장소명·전화번호·도로명/지번 주소·우편번호·WGS84 위경도·데이터 기준일자를 포함한다. 관광 안내 담당자나 여행 코스를 짜는 사람이 '이 시군에서 외국인 관광객에게 소개할 시장이나 아울렛이 어디 있나'를 찾는 데 쓴다. 전역 조인 키는 없어서, 다른 경기도 관광 데이터와는 시군명 이름 매칭이나 주소·위경도 기준으로 붙여 쓴다.
description_portal: '이 데이터는 경기도 내 관광객이 방문 가능한 주요 쇼핑 장소에 대한 정보를 포함하며, 위치명, 관할 시군명, 전화번호, 정제된 도로명 및 지번 주소, 우편번호, WGS84 기준 위도 및 경도 정보 등으로 구성됩니다. 전통시장, 아울렛, 특산물 판매점, 쇼핑거리 등 관광과 연계된 쇼핑공간이 포함되어 있으며, 외국인 관광객 대상 쇼핑 가이드 제공, 지역경제 활성화 정책 수립, 관광코스 구성 자료 등으로 활용될 수 있습니다. 또한 지역별 상권 특성과 관광객 소비 패턴 분석에도 활용 가능한 기초 자료입니다.* 관광쇼핑지: 관광객이 기념품, 지역 특산물, 생활용품 등을 구매할 수 있는 장소로, 전통시장, 아울렛, 거리형 상점 등이 포함됩니다.'
