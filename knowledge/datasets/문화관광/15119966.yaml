summary_user: 서울 성동구의 수영장업 업소를 건별로 담은 인허가 원천 데이터로, 업소마다 인허가일자·취소일자, 영업상태와 상세상태, 폐업일자, 소재지 주소·좌표, 사업장명, 보험가입 여부, 건물 규모 등을 담는다. 성동구에서 지금 영업 중인 수영장이 어디이고 최근 문을 닫은 곳은 어디인지 확인하려는 주민이나, 민간 체육시설 개폐업 흐름을 상권 신호로 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 같은 기관의 다른 체육시설업 인허가 데이터와는 자치단체코드(OPNSFTEAMCODE)·관리번호로, 상권·지역 데이터와는 주소·좌표나 사업장명 매핑으로 잇는다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 수영, 물놀이 등 다양한 레크리에이션 활동을 즐길 수 있도록 인공적으로 물을 채워 제공하는 수영장 등의 업소 정보를 체계적으로 제공하기 위해 구축되었습니다. 수영장은 체육활동, 건강증진, 여가 활용, 지역주민 소통의 공간으로 기능하며, 쾌적하고 안전한 환경 조성을 위해 업소별 인허가 이력과 행정관리 현황의 투명한 정보 제공이 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 수영장 업소의 설립, 인허가 내역, 영업 개시 및 폐업, 행정 상태 변동 등 주요 행정 정보가 포함되어 있습니다. 성동구청 등 관할 행정기관에서 정기적으로 현장 점검과 자료 갱신을 실시해 데이터의 신뢰성과 최신성을 확보하고 있습니다. 본 데이터는 수영장 및 레저시설 현황 분석, 체육정책 수립, 안전 및 위생관리, 상권 및 시장 동향 분석, 소비자 정보 제공 등 다양한 분야에서 활용될 수 있습니다. 데이터는 정기적으로 최신화되어 실효성 있는 정보를 제공합니다.
