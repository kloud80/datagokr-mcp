summary_user: 한국관광공사 '대한민국 구석구석' 사이트에 실린 지자체별 축제·행사 콘텐츠를 지역명, 헤더 타이틀, 콘텐츠명, 상세보기 URL 단위로 담은 전국 범위 CSV 파일(약 32KB)이며, 포털 설명상 2023년 8월 기준 시점 자료다. 여행자나 관광 분석가가 '어느 지역에 어떤 축제·행사 콘텐츠가 소개돼 있었나'를 훑어보거나 지역별 콘텐츠 목록을 만들 때 쓴다. 전역 조인 키는 없으며, 지역명 이름 매칭이나 같은 기관의 TourAPI 관광 콘텐츠(contentId·지역코드)와 이름·URL 기준으로 대조해 이어 쓴다.
