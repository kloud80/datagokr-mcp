summary_user: 경기도 안의 향교를 한 곳당 한 행으로 담은 현황 데이터로, 시군명·향교명·문화재 지정사항·향교 연혁·인허가일자·영업상태·부지 면적과 도로명·지번 주소, WGS84 위경도를 담는다. 향토문화 콘텐츠 기획자나 관광 분석가가 '우리 시군에 있는 향교는 어디이고 문화재로 지정돼 있는가'를 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어 시군명·시군코드(SIGUN_CD)나 향교명 같은 이름 매핑, 주소·좌표로 다른 데이터와 잇는다. 국가유산청 유산 목록과 맞출 때도 종목코드·지정번호가 없으므로 문화재 지정사항 문구와 이름으로 대조해야 한다.
description_portal: 이 데이터는 조선시대 지방 교육기관이었던 향교에 대한 경기도 내 현황 정보를 제공합니다. 항목으로는 시군명, 향교명, 사업장명, 문화재지정사항, 향교연혁, 인허가일자, 폐업일자, 영업상태명 등이 포함되어 있으며, 소재지 정보를 도로명주소, 지번주소, 우편번호 및 WGS84 기준 위도·경도로 제공하여 위치 파악이 용이합니다. 또한 소재지 면적(㎡) 정보를 통해 향교 부지 규모도 확인할 수 있습니다. 이 데이터는 문화유산 보호정책, 향토문화 콘텐츠 기획, 관광자원 개발, 교육자료 활용 등에 유용하며, Open API를 통해 다양한 포맷으로 접근이 가능합니다. 상업적 활용과 콘텐츠 변경이 허용되어 민간 활용성이 높습니다.
team:
