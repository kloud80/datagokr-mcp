description_portal: '- 본 데이터는 국민의 알권리 증진을 위해 한국관광공사에서 공개하고 있는 사전정보 목록입니다. 공사에서 어떤 일을 하고 있고, 예산을 어떻게 집행하고 있는지 누구나 쉽게 알 수 있도록 구성하고 있습니다. - 한국관광공사의 사전정보공개목록은 감사 및 윤리, 기획 및 재정, 법무 및 노무, 인사/총무/회계, 정보화, 홍보 및 대외협력, 고유업무로 총 7개 분야로 제공됩니다.- 각 분야별 공개정보에 대하여 공개 시기, 공개 주기, 담당부서, 공표위치 등 상세 정보가 제공됩니다.  - 본 데이터는 기관 운영 모니터링, 정책·연구 자료로 활용될 수 있습니다.'
