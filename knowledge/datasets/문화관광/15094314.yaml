summary_user: 국립무형유산원이 국가무형문화재 전승자(단체)의 기예능을 영상·사진·도서로 기록한 기록화 사업 결과물을 자료 한 건씩 목록으로 담으며, 자료명과 상세 페이지로 가는 URL 등을 제공한다. 무형유산 연구자나 교육·콘텐츠 기획자가 "특정 종목이나 전승자에 대해 어떤 기록 영상·도서가 만들어졌는가"를 찾아보는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아, 다른 무형유산 데이터와는 종목명·자료명 같은 이름 매칭이나 같은 기관 코드로만 이어 쓴다.
description_portal: 입력 파라미터를 이용하여 무형유산 기록화 정보 목록에 대한 데이터로 자료명, 페이지 이동 URL 등의 정보를 조회 할 수 있는 서비스국가유산청 국립무형유산원_무형유산 기록화 정보 목록 조회 서비스는 무형문화유산의 보존과 전승을 위해 국립무형유산원이 수행한 기록화 사업의 결과물을 온라인에서 체계적으로 조회할 수 있는 오픈 API입니다. 이 서비스는 국가무형문화재의 전승자(단체)의 기예능을 영상, 사진, 도서 등 다양한 형태로 상세히 기록하고 이를 기반으로 기록도서를 발간하는 등의 활동을 포함합니다. 이를 통해 무형유산의 전승 과정과 가치를 시청각적으로 기록하여 후대에 전하고 있습니다.
