summary_user: 대전광역시 한밭도서관 3층·4층 열람실별로 이용대상과 좌석 수를 담은 소규모 현황 파일(CSV, 약 300바이트)로, 포털 설명 기준 3층 지혜마당 365석, 4층 열람실 1472석 등이 들어 있다. 이용자가 '한밭도서관에서 일반인이 쓸 수 있는 열람실 좌석이 몇 석인가'를 확인하거나, 운영 담당자가 공간별 좌석 배분을 검토할 때 쓴다. 실측 컬럼(구분, 열람실, 이용대상, 좌석수)에 도서관코드 같은 전역 조인 키가 없어, 다른 도서관 데이터와는 도서관 이름으로 직접 맞춰 이어야 한다.
description_portal: 대전광역시 한밭도서관 열람실 현황 자료는 한밭도서관 내 3층과 4층에 위치한 다양한 열람실 좌석의 배치와 수량에 대한 정보를 제공합니다. 이 자료는 3층 지혜마당 365석, 4층 열람실 1472석 등 각 공간 별 좌석 수, 이용 대상, 열람실 등 구체적으로 파악할 수 있어 도서관 이용자들이 좌석 이용 계획을 세울 때 유용하게 활용될 수 있습니다. 이 자료는 도서관 내 좌석 운영 효율성 제고, 이용자 수요 분석, 공간 활용도 개선, 시설 확충 및 리모델링 계획 수립 등 다양한 행정적·운영적 의사결정에 기초자료로 쓰입니다.
