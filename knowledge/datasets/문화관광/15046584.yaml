description_portal: '○ 통계개요* 통계명 : 지정문화재 보수사업 착수실적 비율* 통계종류 : 서울시 지정문화재의 보수 대상 및 착수 현황을 제공하는 일반ㆍ보고통계* 작성목적 : 보수사업 대상 문화재의 사업 착수 현황을 파악하여 문화재 관리 및보존에 기여할 수 있는 기초자료를 제공하는 것을 목적으로 함* 조사체계 : 해당기관 및 자치구 → 서울특별시 역사문화재과* 공표주기 : 정기(매년, 12월 기준)* 공표범위 : 지역 - 해당기관 및 자치구내용 - 서울시 지정문화재의 보수사업 착수실적 비율 등○ 용어설명* 지정문화재 : 문화재보호법 제2조에서 정하고 있는 국가지정문화재, 시 지정문화재, 문화재자료임* 보수사업 : 보수사업 착수는 토지매입, 설계승인, 공사계약체결 사업을 의미함○ 기타* 보수사업 착수실적 비율=(당해연도 보수착수 사업수÷당해연도 보수사업대상지정문화재 수)×100'
