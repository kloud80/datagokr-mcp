status: active
summary_user: 경주시 관내 국가지정 사적·명승을 한 건씩 담은 원천 목록으로, 이름·주소·위경도·설명과 함께 이미지 파일명·이미지명을 제공한다. 관광 앱·홍보물 제작자가 '경주의 특정 사적이나 명승의 대표 사진과 위치를 지도에 함께 띄우려면 어떤 자료를 쓰나' 같은 질문에 쓴다. 전역 조인 키는 없어 국가유산 지정 목록 등 다른 데이터와는 사적·명승 이름 매칭이나 위경도(CON_LATITUDE·CON_LONGITUDE) 기반 위치 매칭으로 잇는다.
limits: 표준 문화유산 지정번호 같은 공통 키가 없어 다른 기관 데이터와의 연결은 이름·좌표 매칭에 의존하며, 범위는 경주시 한 곳에 한정된다. 호출에는 포털 활용신청(자동승인) 후 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
