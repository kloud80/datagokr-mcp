summary_user: 해남문화예술회관에서 열린 공연·전시·행사에 대해 관객이 남긴 후기를 글 한 건씩(번호·제목·내용·등록일) 담은 원천 파일로, 해남군 한 곳의 소규모 CSV(약 3.5KB)다. 지역 문화시설 담당자나 분석가가 '해남문화예술회관 관객들은 어떤 공연에 어떤 반응을 보였나'를 살펴볼 때 쓴다. 공연ID·공연장ID 같은 전역 조인 키가 없어 KOPIS 공연 목록 등과는 제목·날짜를 사람이 맞춰 보는 방식으로만 이어 쓸 수 있다.
limits: 실측 컬럼에 전역 조인 키가 없어 다른 공연·시설 데이터와 자동으로 연결되지 않고, 이름 매핑이나 같은 기관 기준으로만 연결된다. 수시·이벤트성으로 만들어진 파일이라 정기적으로 갱신된다고 기대하기 어렵고, 범위는 해남군 한 시설로 한정된다.
