description_portal: 전라남도 해남군 해남문화예술회관에서 개최하는 공연 및 전시, 기타 그외 진행되는 행사에 참여하는 관객 등 후기 정보 등록 데이터입니다.해남문화예술회관은2000년 4월에 개관하였으며  다양한 문화의 생산과 공급자로서의 역할을 충실히 하기 위해  해남군청과 붙어 있으며 앞에는 해남광장이 있습니다. 시설은 지하1층에 탁구장, 헬스장 등 생활문화 체육시설이 있으며, 1층은 대공연장, 다목적실, 전시실, 2층은 무용연습실과 문화의집3층은 어린이 자료실, 4층과 5층은 자료실이 위치해 있습니다.
