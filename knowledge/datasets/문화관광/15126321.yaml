description_portal: '- 전라남도 내 18개 시군 21개소 문화예술회관에 대한 현황 자료입니다. - 시설명, 주소, 공립 및 사립 여부에 대해 조회하실 수 있습니다.- 전라남도는 지역 주민과 관광객을 위한 다양한 문화예술회관을 운영하고 있습니다. 이들 문화예술회관은 공연, 전시, 교육 프로그램 등을 통해 지역 문화 발전에 기여하고 있습니다. - 공연 및 전시 일정 확인 : 각 문화예술회관의 공식 웹사이트나 SNS를 통해 최신 공연 및 전시 일정을 확인하실 수 있습니다.- 예매 방법 : 온라인 예매 시스템을 통해 티켓을 구매하실 수 있으며, 일부 회관은 현장 예매도 가능합니다.- 문화예술 교육 프로그램 : 미술, 음악, 무용 등 다양한 분야의 교육 프로그램이 운영되며, 수시로 모집 공고가 게시됩니다.'
