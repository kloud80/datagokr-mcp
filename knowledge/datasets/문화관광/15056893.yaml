summary_user: 경기도 내 비디오물 배급업체를 사업장 단위로 담은 인허가 원장 자료로, 사업장명·인허가일자·영업상태·폐업일자·소재지 주소와 좌표·전화번호 등을 담는다. 영상 콘텐츠 산업 분석가나 사업자가 경기도 시군별로 영업 중인 비디오물 배급업체가 몇 곳이고 언제 문을 열고 닫았는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군 코드(SIGUN_CD)·사업장명·주소 같은 이름·코드 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 내 비디오물배급업체의 현황을 정리한 자료로, 사업장명, 인허가일자, 영업 상태, 폐업 여부, 소재지, 연락처, 우편번호 등 기본 정보를 포함하고 있습니다. 비디오물배급업은 영상 콘텐츠의 제작·유통을 담당하는 문화산업의 한 축으로, 본 자료는 업체별 영업 지속 여부와 설립 변동을 파악하는 데 활용됩니다. 특히 일부 항목에는 시설 안전과 관련된 방음, 조명, 음향, 소방 등 설비 여부가 포함되어 있어 과거 행정 관리의 흔적을 보여줍니다. 이 데이터는 지역 영상물 유통 산업의 분포와 규모, 변화 추이를 분석하는 데 기초 자료로 활용되며, 콘텐츠산업 정책 수립과 문화산업 생태계 연구에도 의미가 있습니다.
