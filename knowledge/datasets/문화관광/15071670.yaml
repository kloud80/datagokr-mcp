summary_user: 국립중앙극장이 판매하는 패키지 공연 상품을 패키지별로 정리한 소규모 파일(csv 약 15KB)로, 패키지명·패키지 등급·등급별 구매 가능 매수를 담는다. 국립중앙극장 공연을 묶음으로 예매하려는 관객이 어떤 패키지에 어떤 등급이 있고 몇 장까지 살 수 있는지 비교하거나, 공연 기획·마케팅 담당자가 패키지 구성을 살펴보는 데 쓴다. 실측 컬럼에 공연ID(KOPIS mt20id) 같은 전역 조인 키가 없어, KOPIS 공연 목록 등 다른 데이터와는 패키지명·공연명을 이름으로 맞춰 이어야 한다.
description_portal: 국립중앙극장에서 제공하는 패키지 공연의 상세 정보를 담고 있으며, 패키지명, 패키지 등급, 등급별 구매 가능 매수 등 주요 정보를 포함하고 있습니다. 공연 관람을 계획하는 분들이 다양한 패키지 옵션을 비교하여 선택할 수 있도록 지원하며, 예매 전략 수립이나 마케팅 분석, 문화행사 참여 기회 확대 등에도 활용할 수 있습니다. 특히 공연별로 제공되는 패키지의 등급과 구매 가능 수량을 확인함으로써, 관람객의 선호도 분석이나 좌석 운영 효율화에도 기여할 수 있습니다. 문화예술 관련 연구, 정책 수립, 공연 기획 등 다양한 분야에서 참고 자료로 활용하기에 적합합니다.
