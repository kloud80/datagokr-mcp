description_portal: '"영업장 및 상품별 판매 비율 "은 (주)강원랜드 식음영업장에서 판매되는 각 상품의 판매비율을 영업연도와 영업장 단위로 집계한 자료입니다. 상품은 대분류, 중분류, 소분류 체계로 구분되며, 상품명과 상품ID를 통해 식별됩니다. 판매비율은 전체 판매량을 기준으로 개별 상품이 차지하는 비중을 백분율로 산출하여 제공하며, 이를 통해 영업장별 상품 구성 현황과 소비 구조를 파악할 수 있습니다. 본 데이터는 상품별 기여도 분석, 판매 추이 모니터링, 메뉴 구성 최적화, 고객 선호도 파악 등 다양한 분석에 활용될 수 있습니다. 또한 영업 관리 효율화, 상품 전략 수립, 고객 맞춤형 서비스 개발, 식음 사업 운영 개선 등 정책적·경영적 의사결정의 근거 자료로 사용할 수 있습니다.'
