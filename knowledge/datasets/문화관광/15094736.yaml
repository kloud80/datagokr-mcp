summary_user: 제주도를 찾은 단기체류 외국인의 유동인구를 매 정각 기준 체류 시간(분÷60)으로 산출해 월별로 합산한 방문인구 집계 통계로, 기준일·국적·시간대·읍면동별 방문인구 수를 담는다. 관광 분석가나 지자체 담당자가 '어느 국적 외국인이 어떤 달·시간대에 제주 어느 읍면동을 많이 찾는가'를 보고 관광 수요 변화나 인프라·교통 계획을 세우는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동 이름(emd_name)이나 국적명 같은 이름 매핑으로만 이어 쓴다.
description_portal: 이 데이터셋은 제주특별자치도 관내를 방문한 단기체류 외국인들의 유동 인구 규모가 연월별로 어떻게 변화했는지를 집계한 통계자료입니다. “유동인구”는 하루 01시부터 24시까지 매 정각 기준으로 해당 시간 동안 머문 시간을 분 단위로 계산해 60분으로 나눈 값을 바탕으로 산출하며, 이 값을 월별로 합산한 “방문인구” 데이터가 제공됩니다. 제공기관은 제주특별자치도이며, 관리 부서는 디지털혁신과이고, 데이터 형식은 CSV로 공개되어 있어 누구나 무료로 다운로드 및 활용 가능합니다. 이 자료는 제주를 찾는 외국인 관광객의 체류 및 방문 흐름 분석, 관광 수요 변화 모니터링, 관광 인프라 및 교통 정책 기획, 관광객 유입 시점 예측, 지역경제 및 서비스 수요 예측 등에 활용될 수 있습니다. 다만 이 데이터는 마지막 수정일 기준 시점까지만 수집된 것으로, 이후의 외국인 방문이나 체류 행태 변화, 코로나19 이후 관광 회복 흐름 등은 반영되어 있지 않을 수 있다는 한계가 있습니다.
