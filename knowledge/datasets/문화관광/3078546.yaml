summary_user: 국립부여박물관이 소장한 유물을 한 점씩 담은 목록으로, 유물명·유물번호·국적/시대·재질·출토지·전시실을 기록한 작은 CSV 파일(약 9KB)이다. 관람객이나 문화유산 교육 담당자가 '백제 시대 금속 유물이 어느 전시실에 있는가'처럼 시대·재질·출토지별로 전시 유물을 찾을 때 쓴다. 다른 데이터와 맞출 공통 조인 키가 없어서, 다른 박물관 유물 목록이나 문화시설 데이터와는 유물명·출토지 같은 이름을 맞추거나 같은 기관 기준으로만 이어 쓴다.
description_portal: 국국립부여박물관에서 소장하고 있는 다양한 유물에 대한 상세 정보를 제공하는 데이터셋입니다. 유물명, 유물번호, 국적 및 시대, 재질, 출토지, 전시실 등 주요 정보를 포함하고 있어, 박물관 연구자나 문화재 관련 종사자뿐만 아니라 일반인도 유물의 특성과 전시 현황을 쉽게 파악할 수 있습니다. 학술 연구, 전시 기획, 문화유산 교육 자료 개발 등 다양한 분야에서 활용이 가능하며, 부여 지역의 역사와 문화적 가치를 이해하는 데에도 큰 도움이 됩니다. 체계적으로 정리된 유물 정보를 통해 문화유산의 보존과 활용에 기여할 수 있습니다.
