summary_user: 한국체육산업개발주식회사 홈페이지 공지사항(올팍소식)을 게시글 단위로 담는 데이터로, 제목·등록일·내용·첨부파일·홈페이지 주소 등을 제공하며 포털 설명 기준 2025년 6월 1,716건입니다. 올림픽공원 이용자나 사업자가 '대관 접수가 언제 시작되는지', '자전거 대여소나 버스킹 공연 안내가 있는지', '서비스 중단 공지가 있는지'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 시설명 등 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국체육산업개발 올팍소식 목록입니다. 올팍소식에 대한 데이터로 등록일, 제목, 내용 , 첨부파일, 홈페이지URL 등 항목을 제공합니다.2025년 6월 기준 1,716건 올팍소식을 제공하고 있습니다.상호존중의 날 운영, 자전거 대여소 안내, 대관 접수 안내, 버스킹 공연 안내, 서비스 중단 안내 등 다양한 정보 제공을 하고 있습니다.한국체육산업개발 홈페이지 > 알림홍보 > 공지사항에 들어오시면 자세한 정보 확인이 가능합니다.https://www.ksponco.or.kr/board.es?mid=a10301000000&bid=0046
