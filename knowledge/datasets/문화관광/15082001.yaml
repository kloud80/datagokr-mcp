description_portal: '1. 개 요1) 데이터 범위 : 2020년 9월~11월(3개월) 해당기간에 발생한 카드 및 이동통신 데이터2) 데이터 형식 : 가명결합 데이터 통계3) 내용 : 개인특성(성별/연령/소득/거주지)에 따른 국내 관광 행태 분석 (*거주지와 근무지를 제외, 최빈 방문지역 상위 10곳)2. 데이터 설명1) 성별 및 연령 : 남/여, 20~90대(5세 단위)2) 추정소득 및 취미 : 신용카드 사용액 및 내역을 바탕으로 소득 및 취미 추정3) 거주지 : 162개 시군 단위4) 이용업종(4) : 문화예술활동, 스포츠활동, 여행, 취미오락5) 사용건 : (단위) 건6) 지출액 : (단위) 원7) 방문건수 : (단위) 건8) 체류시간 : (단위)분*업종별 카드 사용건수, 지출액, 방문건수, 체류시간은 모두 평균값예시)남자가 가장 많이 방문한 지역 1위는 서울이며, 서울에서 사용한 업종별 카드 사용건수와 지출액, 방문건수, 체류시간 등'
