summary_user: 국립중앙극장 공연예술박물관이 소장한 공연예술자료 디지털파일을 콘텐츠 한 건 단위로 담은 목록으로, 관리기관·콘텐츠번호·제목·자료번호·공개구분·등록일자를 담는다(CSV 약 525KB). 연구자나 공연 기록을 찾는 사람이 특정 공연·작품 관련 디지털 자료가 박물관에 있는지, 공개 대상인지 확인하는 데 쓴다. 실측 컬럼에 KOPIS 공연ID 같은 전역 조인 키가 없어, 다른 공연 데이터와는 제목 같은 이름 매칭으로만 잇고, 같은 기관 자료는 자료번호로 연결해 쓴다.
description_portal: 국립중앙극장 공연예술박물관에서 소장하고 있는 공연예술자료의 디지털파일에 대한 콘텐츠정보 데이터베이스입니다.  관리기관, 콘텐츠번호, 콘텐츠의 제목, 자료번호, 공개구분, 등록일자의 정보를 제공합니다.본 공공데이터는 2018년부터 2025년 상반기에 구축된 데이터이며, 연 단위로 신규 등록된 데이터를 업데이트하고 있는 최신 정보입니다.   목록 상의 콘텐츠 정보는 공연예술박물관 누리집인 공연예술 아카이브 플랫폼 "별별스테이지"에도 공개되어 있으니 참고하시기 바랍니다.
