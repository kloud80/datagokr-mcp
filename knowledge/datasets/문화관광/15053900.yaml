description_portal: '0 관광진흥법 제3조(관광사업의 종류) 제1항제3호 관광객이용시설업 : 다음 각 목에서 규정하는 업 가. 관광객을 위하여 음식, 운동, 오락, 휴양, 문화, 예술 또는 레저 등에 적합한 시설을 갖추어 이를 관광객에게 이용하게 하는 업 나. 대통령령으로 정하는 2종 이상의 시설과 관광숙박업의 시설(이하 "관광숙박시설"이라 한다) 등을 함께 갖추어 이를 회원이나 그 밖의 관광객에게 이용하게 하는 업 0 관광진흥법 제4조(등록) 제3조 제1항 제1호 제4호까지 규정에 따른 여행업, 관광숙박업, 관광객 이용시설업 및 국제회의업을 경영하려는 자는 특별자치시장, 특별자치도지사, 시장, 군수, 구청장(자치구의 구청장을 말한다. 이하 같다)에게 등록하여야 한다.'
