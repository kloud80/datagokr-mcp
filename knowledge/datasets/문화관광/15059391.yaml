summary_user: 경기도 시군에 지정된 음식문화개선 특화거리를 거리 한 곳당 한 행으로 담으며, 집계년도, 대상업소수·불참업소수·참여율, 거리연장, 지정·조성년도, 주소와 위경도를 포함한다. 시군별 특화거리 분포와 업소 참여율을 확인해 음식문화 개선 정책 성과를 점검하려는 분석가나, 가까운 음식 특화거리를 찾는 나들이객이 쓴다. 전역 조인 키는 없어 다른 데이터와는 시군명·시군코드(SIGUN_CD) 같은 경기도 기관 코드나 주소·위경도 매핑으로 연결한다.
description_portal: 이 데이터는 음식물 잔반량 저감 및 나트륨 줄이기 운동 등 경기도 내 음식문화 개선을 위한 활동의 일환으로 지정된 음식문화개선 특화거리에 대한 현황을 제공합니다. 거리명칭, 대상업소수, 거리연장(km), 참여율(%), 불참업소수 등 거리별 주요 지표와 함께, 위치정보(지번주소, 도로명주소, 위도, 경도), 시군명, 집계년도, 거리 지정 및 조성년도 등의 항목이 포함되어 있습니다. 이 데이터는 지역별 음식문화 특화거리의 분포 및 정책 추진 현황을 파악하고, 음식문화 개선 정책의 성과분석, 나들이 및 관광지 추천 등 다양한 분야에서 활용될 수 있습니다. 또한 Open API를 통해 다양한 포맷으로 접근 가능하며, 상업적 이용과 콘텐츠 변경이 허용되어 민간 활용도 가능합니다.
