summary_user: 광주 서구 안의 공공 체육시설을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설 명칭·조성연도·체력단련시설 유무·도로명 위치·담당부서와 연락처·관리기관명을 담는다(CSV 약 12KB). 주민이 서구에서 체력단련 기구가 있는 가까운 체육시설과 문의할 담당 부서를 찾거나, 분석가가 조성연도별 시설 확충 흐름을 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설 명칭이나 도로명 주소를 맞춰 이어야 하며, 문체부 전국체육시설 DB나 다른 자치구 체육시설 현황과 함께 볼 때도 이름·주소 매칭에 의존한다.
description_portal: 이 데이터는 광주광역시 서구 내 체육시설에 대한 정보를 담고 있으며, 각 체육시설의 명칭, 조성연도,  시설 내 체력단련시설 유무, 위치(도로명 주소), 담당 부서 및 연락처, 관리기관명 등의 항목으로 구성되어 있습니다. 이를 통해 지역 내 공공 체육시설 현황을 종합적으로 파악할 수 있어 시민의 건강 증진을 위한 생활체육 정책 수립, 체육 인프라 분포 분석, 공공시설 접근성 개선 등에 활용될 수 있습니다. 연도별 시설 조성 현황과 시설 면적, 주소 정보는 체육시설 확충 및 개보수 사업의 기초자료로 유용하며, 담당 부서 정보는 민원 대응 및 운영 현황 파악에 기여할 수 있습니다.
