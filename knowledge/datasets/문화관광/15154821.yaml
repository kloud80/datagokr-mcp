summary_user: 전국 자치단체가 관리하는 국내여행업 인허가 정보를 모은 건별 업소 원천 데이터로, 전체 20,219건에 인허가일자·영업상태·사업장명·주소·좌표 등을 담는다. 여행업 등록 현황을 확인하려는 분석가나 사업자가 특정 지역의 영업 중·폐업 국내여행업체를 찾는 질문에 쓴다. 사업자등록번호(BRNO)와 지번·도로명·영문 주소 필드를 키로 다른 사업자·주소 데이터와 이어 쓰며, 개방자치단체코드(OPN_ATMY_GRP_CD)는 다른 데이터에서 받아 넘겨야 한다.
limits: 필수 파라미터인 기준일자(BASE_DATE)와 개방자치단체코드는 다른 데이터의 코드라 먼저 받아서 넘겨야 하고, 오퍼레이션 중 /history는 최소 파라미터로 응답이 없었다. 날짜 컬럼에 2029-08-12 같은 미래 값이 있어 최신성은 적재일 컬럼으로 판단해야 하며, 검증은 1,000행만 받아 전량 수집에는 페이지 반복 21회 이상이 필요하다.
