summary_user: 제주특별자치도에 있는 장애인도서관을 도서관 한 곳당 한 행으로 담은 목록으로, 도서관명·주소·개관연도·장서 수·열람석·연면적과 데이터기준일자를 담는다(CSV 325바이트의 소규모 파일). 장애인 이용자나 가족이 제주에서 이용할 장애인도서관의 위치와 규모를 확인하거나, 분석가가 지역 장애인 독서 인프라(장서·좌석 규모)를 파악하는 데 쓴다. 공통 조인 키(도서관코드 등)가 없어 다른 도서관 데이터와는 도서관명이나 주소를 기준으로 맞춰 이어 써야 한다.
limits: 도서관코드 같은 전역 조인 키가 없어 도서관정보나루 등 전국 도서관 데이터와 바로 연결되지 않고, 이름·주소 매칭에 의존해야 한다. 범위는 제주특별자치도 한 시도에 한정되며, 대출·이용 실적은 담지 않는다.
