summary_user: 서울 동작구에서 영리를 목적으로 영화를 상영하는 영화관 등 영화상영업 업소의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일자·취소일자, 영업상태, 지번·도로명 주소, 사업장명, 중부원점TM 좌표, 층수·시설면적 같은 건물 정보가 들어 있다. 사업자나 분석가가 동작구에서 지금 영업 중이거나 폐업한 영화관이 어디이고 언제 인허가를 받았는지 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 관리번호(MGTNO)나 개방자치단체코드 같은 같은 기관 코드, 사업장명·주소 매칭으로 잇는다.
description_portal: '서울특별시 동작구 영화상영업 인허가 정보(https://data.seoul.go.kr/dataList/OA-17696/S/1/datasetView.do) 입니다.동작구의 영화관 등 영리를 목적으로 영화를 상영하는 업소정보를 제공합니다.이 데이터는 인허가일자, 영업상태, 주소(지번, 도로명), 사업장명, 좌표(X, Y)등의 정보를 포함합니다.* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다.* 본 데이터는 3일전 자료를 제공합니다.'
