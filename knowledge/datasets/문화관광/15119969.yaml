summary_user: 서울특별시 성동구에 있는 헬스장·피트니스센터 등 체력단련장업 업소를 한 곳씩 담은 인허가 원천 명부입니다. 업소명, 인허가일자·취소일자, 영업상태·상세상태, 폐업일자, 휴업 시작·종료일, 소재지 지번·도로명 주소, 좌표, 시설면적, 지도자 수 등을 담고 있습니다. 상권 분석가가 성동구에서 헬스장 개업·폐업 흐름을 보고 어느 동네에 체력단련장이 몰리거나 줄었는지 파악하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭, 개방자치단체코드(OPNSFTEAMCODE) 같은 기관 코드로만 연결하고, 같은 체육시설업 계열(골프·당구·체육도장 등) 명부나 상권 데이터와 나란히 놓고 쓴다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 헬스장 등 체격관리, 근력, 유연성, 지구력 강화 등 신체 건강 증진을 목표로 운동할 때 필요한 각종 도구와 기구를 제공하는 체력단련장 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 헬스장 및 피트니스센터는 건강생활 실천, 여가선용, 지역사회 복지향상 등 현대인의 삶의 질을 높이는 중요한 공간으로, 업소별 인허가 이력과 영업현황의 투명한 관리가 필수적입니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 헬스장 설립, 인허가 및 폐업, 운영 상태 등 주요 행정정보가 포함되어, 체력단련 업소의 관리와 상권 분석, 정책 수립 등에 실질적으로 활용됩니다. 성동구청 등 관할 행정기관에서 정기적으로 현장 점검과 데이터 갱신을 통해 신뢰성과 최신성을 보장하고 있습니다. 본 데이터는 체력단련장 현황 파악, 체육정책 자료, 업계 동향 분석, 소비자 정보 제공 등 다양한 분야에서 활용되며, 정책입안자, 업계, 연구자, 일반 시민 모두에게 객관적이고 실효성 있는 자료를 제공합니다. 데이터는 주기적으로 최신화됩니다.
