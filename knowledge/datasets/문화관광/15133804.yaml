description_portal: 국립소록도병원 한센병박물관이 보유중인 한센병 및 소록도 역사관련 박물관자료로 생활자료, 행정자료, 의학자료 세 분야에 대한 목록을 제공합니다. 생활자료는 소록도 한센인들이 실제 사용한 생활용품 중 소록도의 특성을 반한 것들입니다. 소록도는 섬 전체가 병원으로 섬 안에서 모든 생활이 이루어졌기 때문에 필요한 용품을 직접 만들어 사용했다는 특징이 있습니다. 행장자료는 병원운영 중 생산된 행정적 자료들로 보존가치가 있는 일부 문서를 영구보존하기 위함이며, 의학자료는 치료에 사용되었던 기구 중 한센병과 관련이 있는 대상을 선별하였습니다.
