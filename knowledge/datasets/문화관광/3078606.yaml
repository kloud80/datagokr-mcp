summary_user: 성남시 관내 체력단련장(헬스장 등)을 업소 한 곳당 한 행으로 담은 명부로, 구·동, 상호명, 도로명주소, 전화번호, 데이터기준일자를 담는다(CSV 약 58KB). 시민이나 분석가가 "분당·수정·중원구 중 어느 동에 헬스장이 몰려 있고 어디가 부족한가"를 확인하거나, 창업자가 입지 주변 경쟁 업소를 파악하는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키가 없으므로 다른 데이터와는 도로명주소나 구·동 이름을 맞춰 붙이고, 상권 데이터나 다른 체육시설업 명부와 같은 축으로 비교한다.
description_portal: 성남시 내 위치한 체력단련장 데이터로, 구별, 동별, 상호명, 소재지도로명주소, 연락처 등의 항목으로 구성되어 있습니다. 성남시 체력단련장 현황 데이터는 관내에 설치·운영 중인 공공 및 민간 체육시설 중 특히 개인 체력 증진을 목적으로 하는 체력단련장의 분포와 운영 실태를 파악할 수 있는 자료입니다. 이 데이터에는 체력단련장의 위치 등을 포함하고 있습니다. 성남시는 분당, 수정, 중원구 등 각 행정구역별 특성에 따라 체력단련장의 입지와 이용 형태가 다르기 때문에, 이 데이터를 통해 지역 맞춤형 체육시설 확충 전략 수립이나 노후 시설 개선, 운영 효율화 방안 도출이 가능합니다. 지자체의 체육정책 수립뿐 아니라 민간 투자 유도, 시민 건강지표 개선, 고령자 체력증진 프로그램 기획 등 다양한 활용 가능성이 있습니다.
