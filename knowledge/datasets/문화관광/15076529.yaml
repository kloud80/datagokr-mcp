description_portal: 2006년 문예연감의 공연예술 관련 정보입니다. 총 22개의 시트로 구성되어 있습니다. 각 시트 항목에는 국악 국공립단체 및 국악관현악단, 국악 실내악단, 국악 교육단체, 국악 단체성악, 국악 타악단체, 국악 무형문화재단체, 국악 기타단체, 국악 개인성악, 국악 개인기악, 국악경연대회, 국악경연대회 수상자, 국악 해외공연, 국악 음반, 국악 학술대회 등과 같은 항목으로 구성되어 있습니다. 국악 국공립단체 및 국악관현악단 항목은 일자, 공연명, 장소, 주최, 내용, 장르, 지역, 연주단체 항목으로 구성되어 있습니다. 따라서 파일에서 2006년 문예연감의 공연예술 관련 정보를 확인할 수 있습니다.
