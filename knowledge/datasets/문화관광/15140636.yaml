description_portal: '은평구의 영화를 제작하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 「영화 및 비디오물의 진흥에 관한 법률」에 따라 영화를 제작하는 업체의 인허가 현황을 담고 있습니다. 데이터에는 각 영화제작업체의 상호명, 소재지 주소, 최초 신고일, 현재 영업 상태(영업중, 폐업 등)와 같이 문화콘텐츠 산업 관리의 핵심적인 정보가 포함되어 있습니다.영화제작업은 한국 문화콘텐츠 산업의 핵심 분야로, 기획부터 촬영, 편집, 후반작업에 이르는 전 과정을 통해 영화 작품을 완성하는 전문적인 사업 영역입니다. 이 업종은 관할 구청에 신고해야 하는 문화산업으로, 일정한 시설과 인력 기준을 갖춰야 합니다.이 데이터는 영화 투자자나 제작 파트너를 찾는 관련 업계 종사자들이 정식으로 신고된 신뢰할 수 있는 제작업체를 확인하고 선택하는 데 도움을 줍니다. 또한, 지자체는 이를 기반으로 지역 내 영화산업 생태계를 파악하고, K-콘텐츠 육성을 위한 지원 정책을 수립하거나 촬영 친화적인 환경을 조성하는 등 문화산업 진흥을 위한 정책을 수립하는 데 기초 자료로 활용합니다'
