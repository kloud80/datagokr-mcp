description_portal: 2025년 9월 5일부터 12일까지 광주에서는 “평화의 울림” 이라는 슬로건 아래 현대세계양궁선수권대회가 개최됩니다. 이번 대회는 광주국제양궁장에서 예선과 본선 경기가 진행되고, 결승전은 5·18민주광장에서 열리며 스포츠와 역사·문화가 함께 어우러지는 특별한 무대를 선보일 예정입니다.민주·인권·평화의 도시 광주에서 열리는 이번 대회에는 전 세계 76개국에서 732명의 선수단이 참가할 예정으로, 단순한 스포츠 경기를 넘어 도전과 화합의 의미를 전 세계에 알리는 장이 될 것입니다.
