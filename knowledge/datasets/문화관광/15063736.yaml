summary_user: 장성군 평생교육센터가 주관하는 공연·교육 강좌·축제 등 행사를 한 건씩 담은 CSV 파일(약 14KB)로, 행사명·장소·종류·시작/종료 일시·관람연령·문의처를 담는다. 장성군 주민이나 방문객이 "이번 달 장성에서 어떤 강좌나 공연이 언제 어디서 열리나"를 확인하거나, 지역 문화 캘린더 서비스를 만드는 데 쓴다. 전역 조인 키나 코드표가 없어 다른 데이터와는 행사명·행사장소 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
limits: 명세상 연간·이벤트 주기로 만들어진 뒤 바뀌지 않는 파일이라 실시간 행사 변경·신청 현황은 알 수 없다. 범위가 장성군 한 곳이고 좌표 등 공간 정보가 없어 지도 표출이나 타 지역 비교에는 별도 주소 매칭이 필요하다. 공연시설 코드(KOPIS 등) 같은 표준 키가 없어 전국 공연·시설 데이터와 자동 연계되지 않는다.
