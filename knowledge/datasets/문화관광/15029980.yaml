summary_user: 하남시 공공도서관별 소장장서·회원수·대출도서 합계와 한국십진분류 주제별(총류·철학·종교·사회과학·자연과학·기술과학·예술·언어·문학·역사) 대출 권수를 도서관 단위로 집계한 작은 CSV 파일(676바이트)이다. 하남시 도서관 운영자나 분석가가 어느 도서관의 대출이 많은지, 어떤 주제 분야 자료를 더 구입·배분해야 하는지 판단할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 도서관정보나루의 도서관코드 등과는 도서관명(구분)을 이름으로 맞춰 연결해야 한다.
description_portal: 하남시 공공도서관 도서대출 현황에 대한 데이터로 도서관명, 소장장서, 회원수, 주제별 도서 대출 권수  등의 항목을 제공합니다. 문학 분야가 전체 대출의 절반 이상을 차지하며, 그 외 사회과학·역사·기술과학·언어 순으로 이용률이 높습니다. 특히 미사도서관과 위례도서관의 대출 규모가 압도적으로 높아 주요 이용 거점임을 알 수 있습니다. 이를 기반으로 도서관 운영방향 및 맞춤형 자료구입계획 수립에 활용할 수 있습니다. 분야별 수요차이를 반영한 장서 배분 및 독서문화 프로그램 기획에도 유용합니다.
