summary_user: 인천관광공사가 운영하는 하버파크 호텔 한 곳의 연회장·객실·부대시설을 시설 단위로 정리한 파일로, 시설명·위치·평수·수용인원·구성·영업시간·문의번호를 담는다. 행사 주최자나 여행객이 이 호텔에서 몇 명 규모의 연회장이나 어떤 객실·부대시설을 쓸 수 있는지 확인할 때 쓴다. 전역 조인 키가 없어 다른 숙박업 인허가·관광 데이터와는 호텔 이름으로만 맞춰 이어 써야 한다.
description_portal: 인천관광공사가 운영하고 있는 하버파크 호텔 관련 시설물 정보를 파일데이터로 제공하고 있습니다.주요 제공정보로는, 시설구분(연회장, 객실, 부대시설), 시설명칭, 시설별 위치, 크기(평수), 수용가능인원, 시설물 구성정보, 영업시간, 문의전화번호, 기타사항 등입니다.인천관광공사는 공사 공공데이터 개방 및 인천관광 활성화를 위하여 주기적으로 데이터를 현행화하여 제공할 예정입니다.하버파크호텔 시설물 데이터 관련 문의는 공사홈페이지 및 공공데이터 통합플랫폼를 통해 해주시기 바랍니다.
