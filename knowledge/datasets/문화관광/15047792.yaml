description_portal: '이 데이터는 한국문화예술위원회의 문화다양성 사업의 일환으로 운영된 이주민 영화제 상영작 목록 정보를 정리한 자료로, 국내외 이주민 및 난민 관련 이슈를 다룬 영화 콘텐츠를 중심으로 구성되어 있습니다. 주요 항목으로는 영화명, 작가명, 홈페이지, 페이스북, 공동작가, 제작년도, 작품내용이 있으며, 영화명은 “나를 가두지 마 : 메이저 마리와 미얀마의 카렌 난민들”과 같이 영화의 주제와 대상을 함축적으로 드러냅니다. 작가명 항목에는 류스 검니트, 주현숙, 톰 헤이맨 등 다양한 국적과 배경의 감독 및 제작자가 포함되어 있으며, 공동작가 항목을 통해 다국적 협업 제작 사례도 확인할 수 있습니다. 제작년도는 2002년부터 2015년까지의 범위를 포함하며, 홈페이지와 페이스북 항목에는 해당 작품 또는 감독의 온라인 정보(URL)가 기재되어 있어 디지털 접근성을 높입니다. 작품내용 항목에는 각 영화의 주제, 인물, 배경 등에 대한 요약 정보가 포함되어 있어, 사회적 메시지와 문화적 맥락에 대한 이해를 돕습니다. 본 데이터는 문화다양성 증진을 위한 콘텐츠 분석, 이주민 서사 연구, 영화제 프로그램 구성 등에 활용할 수 있는 유의미한 자료입니다.'
