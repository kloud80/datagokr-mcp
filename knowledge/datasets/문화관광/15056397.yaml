summary_user: 경상남도 내 유원시설업 업체를 건별로 담은 파일로, 시군명·업체명·소재지·업종과 안전성검사 대상/비대상별 유기기구 수를 담는다(포털 설명상 2022년 11월말 기준). 지역 주민이나 관광 분석가가 경남 어느 시군에 어떤 종류의 유원시설이 몇 곳 있고 유기기구를 얼마나 갖췄는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 시군명이나 업체명·주소 문자열 매칭으로만 다른 관광사업 등록 자료나 행정구역 자료와 이어 쓴다.
limits: 등록번호·사업자번호 같은 공통 키가 없어 다른 데이터와의 정확한 연결이 어렵고 이름·주소 매칭에 의존해야 한다. 범위는 경상남도 한 시도에 한정된다.
