summary_user: 인천광역시 서구에 있는 시도지정 기념물의 지정번호·명칭·수량(기)·소재지·지정일자를 건별로 담은 소규모 목록 파일(csv 829바이트)이다. 서구 주민이나 지역 연구자가 '우리 구에 지정된 기념물은 무엇이고 어디에 있으며 언제 지정됐나'를 확인하는 데 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록 등과는 명칭이나 지정번호를 맞춰 이어 쓰고, 소재지 주소로 지도·행정구역 데이터와 연결한다.
description_portal: 본 공공데이터는 인천광역시 서구 지역에 위치한 기념물의 정보를 제공하고 있습니다. 본 자료는 인천광역시 서구의 기념물의  명칭, 수량, 소재지 등의 항목으로 구성되어 있습니다. 본 데이터를 통해 서구의 역사적, 문화적 가치를 지닌 기념물을 이해하는 데에 도움을 줄 수 있으며, 행정기관의 정책 수립과 문화유산 보호 활동에 필요한 정보를 제공할 수 있을것으로 판단됩니다. 또한 지역 정체성 확립에도 도움을 줄것으로도 판단됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
