summary_user: 인천광역시 사회조사에서 시민이 우선 확충해야 한다고 꼽은 문화시설(공연·전시·도서·지역문화복지 등)과 체육시설(수상운동·체력단련·공원 내 체육·구기·라켓 등) 응답을 군/구·연령·학력 등 응답자 특성별로 나눠 담은 집계 통계로, 3,937바이트 크기의 CSV 파일 하나다. 구청·시 담당자나 분석가가 '우리 구 주민은 수영장과 도서관 중 무엇을 더 원하는가'처럼 지역·계층별 시설 수요를 비교해 시설 확충이나 생활SOC 계획의 근거로 삼을 때 쓴다. 전역 조인 키가 없어 다른 체육시설 현황 데이터와는 특성 항목의 군/구 이름을 맞춰 붙여야 한다.
