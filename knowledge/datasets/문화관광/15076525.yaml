description_portal: AK시각예술의 잡지정보입니다. 각 구성 항목으로는 연번, 연도, 구분, 장르(종), 장르(권), 잡지명, 발행정보, 발행자, 발행일자, 발행형태, 신간/폐간, 비고로 구성되어 있습니다. 연도 항목은 2015부터 2018로 구성되어 있고 장르(권) 항목은 사진, 건축, 서예, 회화/조각/ 건축, 서예, 양악/회화/무용, 양악/건축, 만화 등으로 구성되어 있습니다. 발행형태 항목은 월간, 계간, 격월간, 연간, 반연간, 비정형 등의 항목으로 구성되어 있습니다. 비고 항목은 영화,드라마,인터뷰와 문학/인터뷰/지역소개 포함 등의 항목으로 구성되어 있습니다. 따라서 파일에서 AK시각예술의 잡지 정보를 확인할 수 있습니다.
