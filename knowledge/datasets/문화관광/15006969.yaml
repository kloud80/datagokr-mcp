summary_user: 대전광역시에서 열리는 문화축제를 축제 한 건씩 담은 목록으로, 축제명·개요·주제·기간·장소·주최와 주관 기관·주소·문의전화·홈페이지를 포함하며 전체 13건이다. 시민·관광객이 "올해 대전에서 어떤 축제가 언제, 어디서 열리나"를 확인하거나, 분석가가 대전 축제의 운영 주체와 개최 지역을 정리할 때 쓴다. 조인 키는 축제 주소(festvAddr)와 상세주소뿐이어서 주소를 기준으로 주변 문화시설·관광지 등 위치 데이터와 이어 쓴다.
