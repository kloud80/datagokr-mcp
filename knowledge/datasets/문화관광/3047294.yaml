summary_user: 경기도 하남시에서 스포츠강좌이용권을 쓸 수 있는 가맹시설을 시설 한 곳씩 종목·시설명·전화번호·선정일자·주소와 함께 담은 건별 목록으로, 범위는 하남시 한 곳이며 개별 시설 주소 단위입니다. 하남시 주민이나 보호자가 '우리 동네에서 이용권으로 수영·태권도 같은 종목을 배울 수 있는 시설이 어디인가'를 찾거나, 분석가가 종목별 가맹시설 분포를 볼 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 시설명·주소를 맞춰 보거나 같은 기관(하남시) 자료끼리만 이어 쓴다.
limits: 명세상 주기가 연간 또는 이벤트성으로 표기돼 있어 가맹 해지·신규 선정이 바로 반영되지 않을 수 있으니 기준일자(기준일자)를 확인해야 한다. 공통 코드나 키가 없어 다른 체육시설 데이터와 붙이려면 시설명·주소 문자열 매칭이 필요하다.
