description_portal: 이 데이터는 서울특별시 광진구 관내에서 관광극장유흥업 인허가를 받은 업소 현황을 정리한 공공데이터입니다. 해당 업소는 유흥주점영업 허가를 받은 사업자가 관광객 이용에 적합하도록 **무도시설(춤을 출 수 있는 공간)**을 갖추고, 음식 제공과 함께 노래와 춤을 감상하거나 참여할 수 있는 공간을 운영하는 형태입니다. 각 업소의 명칭, 주소, 업종 구분, 인허가 상태 등의 기본 정보가 포함되어 있으며, 관광과 유흥을 결합한 서비스업소의 분포를 파악할 수 있습니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계를 기반으로 제공되며, 위도·경도(WGS84) 좌표는 포함되지 않아 지도 시스템 연동 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준 자료로 정기적으로 갱신되며, 지역 관광산업 관리, 유흥업소 행정지도, 야간관광 콘텐츠 분석 등에 활용할 수 있습니다.
