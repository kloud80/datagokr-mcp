summary_user: 빅카인즈(BIGKinds)에서 수집한 딥페이크·AI 변조기술 관련 국내 뉴스 기사를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV, 약 36MB)로, 보도 일자·언론사·제목·통합분류 1~3단계·인물·지역·기관 개체명·키워드·특성추출 값이 들어 있다. 언론·커뮤니케이션 연구자나 디지털 정책 분석가가 "딥페이크 성범죄·사기 보도가 언제 몰렸고 어떤 키워드와 기관이 함께 언급됐는가"를 시기별·언론사별로 따지는 데 쓴다. 다른 데이터와 맞출 공통 조인 키는 없어서, 보도 일자로 기간을 맞추거나 언론사명·개체명(기관·지역)을 이름으로 대조해 이어 쓴다.
description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 딥페이크 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 제목, 통합분류(1~3단계), 개체명(인물·지역·기관·기업), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적·정량적 분석이 가능합니다.본 자료는 국내 주요 언론사의 딥페이크 및 AI 기반 변조기술 관련 보도를 대상으로, 어떤 범죄·사회·정책 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 프레임이 어떻게 형성되었는지 등을 파악하는 데 중점을 두고 있습니다. 이러한 분석을 통해 언론이 딥페이크 성범죄·사기·협박 등 디지털 범죄 문제, 피해자 보호 및 수사 대응 체계, 기술의 확산과 위험성, 온라인 플랫폼의 책임성, AI 규제 논의, 사회·윤리적 쟁점 등 다양한 사안을 어떤 관점에서 재현하는지를 확인할 수 있으며, 이러한 보도 경향이 여론 형성, 정책 추진, 기술 규제 환경 변화 등에 어떤 영향을 미쳤는지를 추적하는 데도 유용합니다.아울러 이 자료는 범죄학·디지털 정책 연구자, AI 기술 전문가, 법·제도 관계자, 언론·커뮤니케이션 연구자 등에게 딥페이크 보도의 흐름, 이슈별 프레임 변화, 언론의 기술·범죄·사회 이슈 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
