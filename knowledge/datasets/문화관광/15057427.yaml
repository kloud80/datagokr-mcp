summary_user: 경기도 내 공공 구기체육관을 시설 한 곳당 한 행으로 담아 시군명, 소유·운영기관, 건축구조, 가능종목, 바닥재료, 면적, 관람석·수용인원, 준공연도, 건설사업비, 주소와 WGS84 위경도를 제공한다. 생활체육 이용자나 지자체 분석가가 우리 시군에서 배구·농구 같은 종목을 할 수 있는 실내 구기체육관이 어디에 있고 규모가 어느 정도인지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시군코드(SIGUN_CD)·시군명이나 시설명 매칭, 또는 위경도 기반 공간 결합으로 잇는다.
description_portal: 이 데이터는 경기도 내 공공 구기체육관 시설의 현황을 보여주는 자료로 시설명, 시군명, 건축구조, 관리주체, 준공연도, 소유기관, 가능종목, 바닥재료, 건설사업비, 건축면적 및 연면적, 좌석형태, 수용인원수, 관람석 수, 위치정보(도로명주소, 위도, 경도) 등을 포함하고 있습니다. 주요 항목은 ‘시설명’, ‘건축구조명’, ‘가능종목명’, ‘바닥재료명’, ‘건설사업비(백만원)’, ‘수용인원수(명)’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며, 종목별 이용 가능성 및 공간 활용성 분석, 체육정책 수립, 스포츠 인프라 개선 등 다양한 목적으로 활용될 수 있습니다. 일부 시설은 관리주체나 좌석정보 등의 항목이 누락되어 있어 활용 시 주의가 필요하며, 위치정보는 공간정보 시스템(GIS) 기반 분석에도 적합합니다.
