summary_user: 제주특별자치도에 소재해 운영 중인 국내외여행업체를 업체 한 곳당 한 행으로 상호명·소재지·연락처와 데이터기준일자를 담은 등록 현황 파일(CSV, 약 16KB)이다. 해외여행 상품이나 사증 대행이 필요한 여행자, 또는 관광업계 분석가가 '제주에 등록된 국내외여행업체가 어디에 몇 곳 있고 연락처는 무엇인가'를 확인할 때 쓴다. 등록번호·사업자번호 같은 전역 조인 키가 없어 다른 관광사업 등록 데이터와는 상호명이나 소재지 주소를 맞춰 연결해야 한다.
limits: 실측 컬럼에 등록번호·사업자번호 등 공통 키가 없어 다른 데이터와 정확한 1:1 결합이 어렵고, 상호명·주소 매칭에 의존해야 한다. 범위는 제주특별자치도 한 곳뿐이라 타 시도와 비교하려면 별도 데이터가 필요하다.
