summary_user: 부산광역시 수영구에 있는 게임 관련 업소를 한 곳당 한 행으로 담은 파일로, 상호·우편번호·도로명/지번 주소·시설면적·업종명·게임기 대수를 담는다. PC방이나 오락실을 열려는 사업자가 수영구 안에서 업종별 업소가 어느 동네에 얼마나 몰려 있고 규모가 어떤지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 주소를 지오코딩하거나 업종명·상호로 맞춰 잇고, 다른 구의 같은 현황 파일과는 컬럼을 맞춰 이어 붙인다.
description_portal: 부산광역시_수영구_게임제공업현황은 부산광역시 수영구에 소재한 게임업소(청소년게임제공업,인터넷컴퓨터게임시설제공업,일반게임제공업,복합유통게임제공업) 및 게임제작업및 배급업을 하는 시설의 상호명, 우편번호, 주소(도로명주소, 지번주소), 시설면적, 업종명, 게임기대수(PC, 아케이드게임기 등)을 포함하고있습니다. 해당 업종은 게임산업진흥에관한 법률에 의거합니다. 게임제작및배급업의 경우 게임기대수를 포함하고있지않으니 유의하시기바랍니다.
