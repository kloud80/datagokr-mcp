summary_user: 서울특별시 서대문구에 인허가 등록된 공연장을 사업장 한 곳당 한 행으로 담은 원천 목록으로, 관리번호·인허가일자·영업상태·폐업일자·소재지 지번/도로명 주소·좌표·전화번호·건물 층수·시설면적 등을 포함한다. 서대문구에서 현재 영업 중인 공연장이 어디에 있고 규모가 어느 정도인지 확인하려는 공연 기획자나 대관을 찾는 예술단체, 지역 문화시설 분포를 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 KOPIS 공연장ID(mt10id) 등과 바로 결합되지 않고, 공연장 이름·주소 매칭이나 같은 기관 코드(개방자치단체코드)로만 다른 데이터와 잇는다.
description_portal: 서울특별시 서대문구에 등록된 공연장 정보로 인허가등록번호, 등록일자, 공연장명칭, 공연장소재지, 전화번호, 객석수, 영업상태 등의 정보입니다.서울특별시 서대문구 공연장 정보 데이터는 연극, 음악, 무용 등 다양한 공연이 이루어지는 공연시설에 대한 정보를 담고 있는 자료입니다. 이 데이터는 공연장 현황을 파악하여 지역별 문화 시설 불균형을 해소하는 정책을 수립하는 데 활용될 수 있습니다. 또한, 예술 단체나 시민들이 공연장을 대관할 때 필요한 정보를 제공하거나, 공연 관련 이벤트 기획의 기초 자료로 사용될 수 있습니다
