summary_user: 경기도 내 전통시장과 로컬푸드직매장 등 유통시설을 시설 한 곳당 한 행으로 담은 목록으로, 시군명, 시설구분, 시장명, 전화번호, 지번·도로명 주소, 우편번호, 위경도 좌표를 포함한다. 소비자나 지역경제 분석가가 '우리 시군에 전통시장과 로컬푸드직매장이 어디에 몇 곳 있나'를 확인하거나 지역 간 유통 인프라 분포를 비교하는 데 쓴다. 전역 조인 키는 실측 컬럼에서 확인되지 않아 시군명·시군코드(SIGUN_CD)나 주소·좌표를 기준으로 다른 경기도 데이터와 이름 매핑 또는 공간 결합으로 잇는다.
description_portal: 이 데이터는 경기도 내 전통시장과 로컬푸드직매장 등의 유통시설에 대한 현황 자료로, 시장명, 시설구분, 위치 정보, 전화번호 등이 포함되어 있습니다. 전통시장은 지역 상권의 중심으로 소상공인의 생계 기반이며, 로컬푸드직매장은 지역 농산물의 직거래를 통해 유통단계를 줄이고 소비자와 생산자 간 신뢰를 구축하는 공간입니다. 이 자료는 지역 경제 활성화 정책 수립, 유통망 재정비, 재래시장 현대화 사업 추진, 소비자 접근성 평가 등 다양한 지역경제 및 유통정책 분야에서 활용될 수 있습니다. 특히 전통시장과 직매장의 공간 분포를 통해 지역 간 유통 인프라 균형 여부를 파악하는 데 유용합니다.
