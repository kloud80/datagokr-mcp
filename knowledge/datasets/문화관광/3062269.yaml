summary_user: 국립국악원이 보유한 국악 자료(동영상·음향·이미지 등)를 자료 한 건 단위로 기록 유형, 기록 일자, 자료 유형, 분류, 컬렉션, 제목, 개요, 상세 URL, 공공누리 유형과 함께 담는다. 연구자·교육자가 "특정 악기나 인물, 작품에 관한 국악 영상·음원 자료가 무엇이 있고 어디서 볼 수 있나"를 찾을 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으며, 자료 고유번호(controlId)는 기관 내부 식별자라 KOPIS 공연ID 등과 직접 연결되지 않고 제목·인물명 같은 이름 매칭으로만 이어 쓴다.
limits: KOPIS 공연 목록·공연장·예매 데이터와 이어 줄 공통 키가 없어 공연 실적이나 관객 수요 분석에는 쓰지 못한다. 범위는 전국·비공간 자료라 지역별 분석에 맞지 않는다. 호출에는 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
