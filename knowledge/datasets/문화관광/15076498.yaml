description_portal: 한국문화예술위원회의 2014년부터 2019년까지의 문예진흥기금 공모사업 중 시각예술 분야 "전시" 지원 사업의 일자리창출성과 대한 정보입니다. 각 구성 항목으로는 전시단체명, 사업연도, 고용유형, 고용기간_시간, 고용기간_일, 고용기간_주, 고용기간_월, 고용인원, 고용대상으로 구성되어 있습니다. 사업연도는 2014년도부터 2019년도까지 오름차순으로 나타나 있고 고용대상 항목은 미분류, 청년, 일반으로 구성되어 있습니다. 고용유형 항목은 미분류, 1개월~12개월, 1주~1개월 등으로 구성되어 있습니다. 따라서 파일을 확인해 일자리창출성과를 확인할 수 있습니다.
