description_portal: 오늘의 이슈 Top 10은 한국언론진흥재단에서 운영하는 빅카인즈(BIGKinds) 와 공식 협약을 맺은 100여 개 이상의 주요 언론사로부터 실시간으로 수집 되는 방대한 뉴스 데이터를 기반으로, 당일 가장 큰 사회적 파장을 일으키는 보도자료 이슈를 표시 합니다.매일 오전, 오후 각각 1회 정기 집계를 통해 하루 두 번 업데이트 되며, 당일 언론사의 보도 건수를 AI 기반 빅데이터 분석 기술로 종합 처리하여 가장 빈도가 높고 영향력 있는 10개 이슈를 선별합니다.이 데이터의 핵심 가치는 단순한 뉴스 목록 나열이 아닌, 각 이슈의 사회적 파급력과 국민적 관심도를 과학적으로 정량화하여 객관적이고 신뢰성 있는 순위를 제공한다는 점입니다.이를 통해 언론계, 정부기관, 기업, 학계 등 다양한 분야에서 활용할 수 있습니다.당일 실시간 이슈의 순위는 https://bigkinds.or.kr 에서 확인이 가능합니다.
