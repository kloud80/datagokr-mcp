summary_user: 인천광역시 남동구에 있는 농구장을 시설 한 곳당 한 행으로 담은 현황 파일로, 시설명·소재지 주소·전화번호·데이터 기준일자를 담는다(약 1KB 크기의 CSV). 남동구 주민이 "집 근처에 이용할 만한 농구장이 어디 있고 어디로 문의하나"를 확인하거나, 분석가가 구 안의 농구장 분포를 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재지 주소를 맞추는 방식으로만 이어 쓰고, 지도에 올리려면 주소를 좌표로 바꾸는 작업이 따로 필요하다.
description_portal: 이 데이터는 인천광역시 남동구에 위치한 농구장 현황에 대한 정보를 담고 있으며, 지역 주민들이 쉽게 농구장을 찾아 이용할 수 있도록 돕기 위해 제공됩니다. 데이터 항목에는 각 농구장을 식별하기 위한 연번과 시설명, 구체적인 소재지 주소, 연락 가능한 전화번호, 그리고 데이터 기준일자 등이 포함되어 있습니다. 이를 통해 시민들은 가까운 농구장의 위치와 연락처를 손쉽게 확인할 수 있고, 체육 활성화와 건강 증진을 위한 여가 공간 활용에 도움을 받을 수 있습니다. 또한, 행정기관에서는 지역 체육시설 분포를 분석하고 체육복지 정책을 수립하는 데 활용할 수 있으며, 데이터는 정기적으로 업데이트되어 최신 정보를 반영합니다.
