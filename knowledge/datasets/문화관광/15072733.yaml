status: active
summary_user: 빅카인즈(BIGKinds)에서 '사회적 가치' 관련 뉴스를 모은 기사 단위 메타데이터로, 기사별 URL·보도 일자·언론사·기고자·제목·통합 분류(1~3단계)·사건/사고 분류·인물·위치·기관 개체명·키워드·특성추출 값을 담은 약 23MB 분량의 CSV 파일이다. 언론 연구자나 정책 담당자가 '사회적 가치라는 말이 언제부터 어떤 주제(환경·복지·사회공헌 등)와 어떤 기업·기관과 함께 많이 보도됐는가'를 시기별 보도량과 개체명으로 따져보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 언론사명·기관명·인물명 같은 이름 매칭이나 같은 재단의 다른 빅카인즈 주제별 메타데이터와 같은 컬럼 구조로 나란히 비교하는 방식으로만 이어 쓴다.
limits: 기업·기관을 사업자번호 같은 공통 코드로 식별하는 키가 없어 이름 표기 차이를 직접 정리해야 연결된다. 전국 단위 비공간 데이터라 위치 개체명은 기사 속 지명 텍스트일 뿐 행정구역 코드로 집계되지 않는다.
