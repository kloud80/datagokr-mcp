description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 바탕으로 수집·분석된 사회적 가치 관련 뉴스 메타정보입니다. 기사별로 주소, 보도 일자, 언론사, 기고자, 제목, 통합 분류(1~3단계), 사건/사고 여부, 개체명(인물·지역·기업), 키워드, 특성추출 값, 본문 내용, 원본 주소 등이 포함되어 있습니다. 이 구조 덕분에 사회적 가치라는 키워드가 언론 담론 속에서 어떻게 부상했는지, 어떤 주체(기업·공공기관·시민사회)들이 주로 언급되는지, 어떤 맥락(환경, 복지, 사회공헌, 기업윤리 등)에서 다루어지는지 등을 체계적으로 분석할 수 있습니다.본 자료는 사회적 책임, 공공성, 지속가능성, 사회 혁신 프로젝트, 기업의 사회 역할 등 다양한 하위 개념이 언론 보도에서 어떻게 연결되는지 살피는 데 유용합니다. 또한 시기별 보도 빈도 추이, 주요 사건과의 연계성, 지역별·기업별 차이 등을 분석할 수 있어 정책 입안자, 언론 연구자, 기업 전략가, 시민단체 등에 활용 가치가 높습니다. 이 데이터를 통해 사회적 가치 담론의 변화 흐름을 정량적으로 파악하고, 언론과 사회가 어떤 가치를 강조하며 수용했는지를 연구할 수 있습니다.
