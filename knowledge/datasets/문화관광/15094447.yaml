summary_user: 빅카인즈 뉴스 데이터베이스에서 관광 관련 기사를 골라 기사 한 건마다 일자·언론사·제목·통합 분류·키워드·특성추출어를 담은 기사 단위 메타데이터로, 전국 범위의 비공간 자료이며 약 46MB 크기의 CSV 파일 하나로 받는다. 연구자나 정책 담당자가 '외국인 관광객 유치나 스마트 관광 같은 주제가 언제, 어느 언론사에서 많이 보도됐나'처럼 시기별 보도 경향과 키워드 변화를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서 다른 데이터와는 일자(월·연 단위로 묶어서)나 키워드·지역명을 이름으로 맞춰 관광 통계 등과 나란히 보는 식으로만 이어 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 관광 관련 뉴스 메타정보 자료입니다. 관광은 국가 경제 성장과 지역 균형 발전, 문화 교류 촉진에 중요한 역할을 하며, 특히 국제 관광객 유치와 지역 관광 활성화는 국내외적으로 큰 관심을 받고 있습니다. 본 자료는 주요 신문과 방송 보도에서 관광과 관련된 기사들을 분석해 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 이슈 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 관광 산업 발전 전략, 문화·생태 관광 정책, 관광 인프라 확충, 외국인 관광객 유치, 스마트 관광과 같은 최신 트렌드가 언론 보도에서 어떻게 다뤄졌는지를 객관적으로 파악할 수 있습니다. 또한 학술 연구, 정책 수립, 관광 산업 분석, 지역 개발 전략 등 다양한 분야에서 활용 가능한 기초 자료로, 한국 관광 산업의 발전 방향과 사회적 의미를 이해하는 데 중요한 참고 자료가 됩니다.
