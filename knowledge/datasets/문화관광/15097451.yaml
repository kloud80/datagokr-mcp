summary_user: 경기도 주요 관광지마다 시군명과 관광지명, 함께 둘러볼 인근 연계관광지(최대 3곳)를 한 행씩 담은 지자체 관광지 목록이다. 여행자나 관광 기획자가 "이 관광지에 가면 근처에서 어디를 함께 들르면 좋을까" 같은 동선·추천 코스 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 정보 등과는 시군명·관광지명 이름 매칭으로만 이어 쓴다.
description_portal: 이 데이터는 경기도의 주요 관광지를 중심으로 연계 관광지 정보를 포함한 자료입니다. 주요 항목은 시군명, 관광지명, 연계관광지1, 연계관광지2, 연계관광지3으로 구성되어 있으며, 각 관광지 방문 시 함께 둘러볼 수 있는 인근 명소 정보를 제공함으로써 관광 동선 설계에 도움을 줍니다. 이 데이터는 지역관광 활성화를 위한 추천 관광코스 개발, 문화·자연 관광자원의 통합 분석, 관광 정책 수립 및 지역관광 마케팅 전략 마련 등에 유용하게 활용됩니다. 특히, 연계관광지 정보는 체류형 관광 활성화 및 지역경제 기여를 위한 기반자료로 활용될 수 있습니다.
