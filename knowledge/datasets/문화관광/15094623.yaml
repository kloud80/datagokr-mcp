summary_user: 서울특별시 동작구에 등록된 국외여행업 업소를 한 곳씩 담은 인허가 원장으로, 인허가일·취소일, 영업상태와 폐업일, 소재지 지번·도로명 주소, 전화번호, 사업장명, 중부원점 TM 좌표(X, Y)를 담는다. 동작구에서 지금 영업 중인 해외여행사가 어디인지, 언제 등록했거나 폐업했는지 확인하려는 여행객·사업자·분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어서 다른 자치구 여행업 인허가 데이터나 관광사업 등록 자료와는 사업장명·주소를 맞춰 보거나 같은 기관 코드(OPNSFTEAMCODE)로만 잇는다.
description_portal: '이 데이터는 서울특별시 동작구의 국외를 여행하는 내국인을 대상으로 여행의 일정, 비용산출, 숙박예약, 명소안내 등 여행의 정보를 제공하는 업소정보를 포함하고 있습니다. 좌표안내 : 중부원점 TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 본 데이터는 3일전 자료를 제공합니다.'
