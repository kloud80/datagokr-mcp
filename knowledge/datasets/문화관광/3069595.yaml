summary_user: 한국관광공사가 낸 MICE 산업 통계보고서의 목록을 보고서 한 건당 한 행으로 담은 파일(csv, 약 9KB)로, 각 행에는 제목·내용 요약·첨부파일명·파일 링크가 있고 수치 자체가 아니라 보고서 문서를 가리킨다. 국제회의 국내외 개최 현황(UIA·ICCA 기준)이나 MICE 참가자의 방문 특성을 조사하는 분석가·지자체 담당자가 "어떤 연도 보고서에서 국제회의 도시별 순위를 볼 수 있나" 같은 질문에 해당 보고서를 찾아 내려받는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어 다른 관광 통계와는 보고서 제목이나 연도를 사람이 맞춰 보는 방식으로만 잇는다.
description_portal: 본 데이터는 한국관광공사에서 제공하는 MICE 산업 관련 통계보고서 정보입니다. 국제기구(UIA, ICCA) 기준 국제회의 세계 및 국내 개최 현황을 대륙/국가/도시별, 월별 주제별 등으로 분석한 자료 및 국내 개최 MICE 참가자의 한국 방문 특성, 개최지로서의 수용태세 등 MICE 산업의 전반적인 동향 및 현황을 제공하고 있는 보고서 데이터를 포함하고 있습니다. 최신 정보는 한국관광공사 MICE 정보시스템(https://k-mice.visitkorea.or.kr/)에서 확인하실 수 있습니다.
