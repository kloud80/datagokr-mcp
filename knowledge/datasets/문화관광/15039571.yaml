summary_user: 부산 기장군 정관도서관에서 주말에 여는 어린이 영화상영 일정을 회차별로 담은 작은 파일(CSV 약 1KB)로, 구분·제목·날짜·시간·장소·비고를 담는다. 가족 단위 이용자가 '이번 주말 정관도서관에서 어떤 어린이 영화를 몇 시에 상영하나'를 미리 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연ID나 문화시설 코드와 직접 붙지 않으며, 도서관 이름이나 같은 기관(기장군) 기준으로만 다른 도서관·문화시설 데이터와 이어 쓴다.
description_portal: 부산광역시 기장군 정관도서관 영화공연 정보(장소, 시간 등) 입니다.아이들이 가족, 친구들과 함께 도서관에서 다양한 어린이 영화를 즐길 수 있습니다.본 일정을 통해 주말 어린이 영화상영 날짜와 시간을 미리 확인할 수 있으며, 주말 정기적으로 운영되는 프로그램으로 지속적으로 참여할 수 있습니다.영화관람 전후로 관련 도서 대출이나 도서관 시설을 함께 이용하는 등 문화, 독서 활동을 연계해 활용할 수 있습니다.영화공연 정보는 변경될 수 있으니 자세한 내용은 도서관 홈페이지를 참고하시기 바랍니다.
