summary_user: 전북특별자치도 남원시에 있는 영화상영관을 한 곳당 한 행으로 담은 파일로, 상영관명·도로명 소재지·연락처·대표자 성명·관람정원·등록일자를 담는다(파일 크기 357바이트의 소규모 목록). 남원 주민이나 관광객이 시내에서 영화를 볼 수 있는 곳과 좌석 규모를 확인하거나, 분석가가 지역 문화시설 현황을 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상영관명이나 도로명 주소를 맞춰 붙여야 하며, 공연시설 코드(kopis_id 등) 같은 표준 시설 코드는 들어 있지 않다.
description_portal: 1. 데이터 주요 내용 및 활용 맥락본 데이터는 전북특별자치도 남원시에 위치한 영화상영관의 상세 정보를 포괄적으로 제공합니다. 지역 주민과 관광객들이 영화 관람을 위한 문화시설을 보다 쉽게 찾고 이용할 수 있도록, 각 상영관의 위치, 연락처, 수용 규모 등 핵심 정보를 체계적으로 정리했습니다. 이를 통해 지역 문화생활 활성화, 관광 정보 제공, 문화정책 수립을 위한 기초자료로 활용할 수 있습니다.2. 데이터 항목명등록일자, 상영관명, 연락처, 상영관소재지(도로명), 성명, 관람정원3. 기대효과이 데이터는 지역 문화시설에 대한 접근성을 높여 시민들의 문화생활 질을 향상시키고, 관광객들에게 유용한 정보를 제공함으로써 지역 경제 활성화에도 긍정적인 영향을 미칠 것으로 기대됩니다.
