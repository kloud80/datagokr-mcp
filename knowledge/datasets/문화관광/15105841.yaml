description_portal: '- 전라남도 소관 도립도서관 자료실별(어린이 자료실, 장애인 자료실, 일반 자료실, 문학 자료실, 디지털자료실, 보존서고, 이동도서관)별  장서  현황 등을 조회할 수 있습니다.- 전라남도 도립도서관은 도민의 독서 환경 개선과 정보 접근성 향상을 위해 도서관 정책을 수립하고, 도서관 운영을 지원하는 행정기관입니다.- 전자책 대출: 회원 가입 후 전자책을 대출하여 모바일 기기에서 읽을 수 있습니다.- 온라인 자료 검색: 도서관 소장 자료를 온라인으로 검색하고, 대출 및 예약 서비스를 이용할 수 있습니다.- 문화 프로그램 안내: 도서관에서 진행하는 다양한 문화 프로그램과 강좌 정보를 확인하고 신청할 수 있습니다.'
