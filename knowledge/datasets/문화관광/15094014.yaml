summary_user: 빅카인즈(BIGKinds) 뉴스데이터베이스에서 평화 관련 기사를 모은 기사 건별 메타정보 파일로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목을 담는다(CSV 약 24MB). 언론·국제관계 연구자나 정책 분석가가 한반도 평화 프로세스나 남북 협력 보도가 시기별·언론사별로 어떻게 달라졌는지 키워드 빈도로 살피는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자·언론사명 같은 이름 매칭으로만 잇는다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 평화 관련 뉴스 메타정보 자료입니다. 평화는 국제 사회와 한반도 정세에서 중요한 가치로, 전쟁과 갈등의 예방, 분쟁 해결, 외교 협력, 군축, 인권 보장 등과 밀접한 관련이 있습니다. 본 자료는 국내 주요 신문과 방송 보도에서 평화와 관련된 기사들을 분석하여 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 인식 변화를 확인할 수 있도록 구성되었습니다. 이를 통해 한반도 평화 프로세스, 남북 및 국제 협력, 평화 협정 체결 논의, 국제 사회의 분쟁 조정, 인권과 평화의 연계성 등 다양한 이슈가 언론 담론에서 어떻게 다뤄졌는지를 객관적으로 파악할 수 있습니다. 또한 학술 연구, 국제 관계 분석, 정책 수립, 언론 연구, 교육 현장에서 활용 가능한 기초 자료로, 평화 구축의 과제와 가능성을 이해하는 데 중요한 참고 자료가 됩니다.
