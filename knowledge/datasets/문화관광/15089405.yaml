description_portal: 전국에 분포한 아동 서점에 대한 시설 단위 상세정보를 담고 있습니다. 대분류는 "아동서점", 중분류는 "아동서적"으로 통일되어 있으며, 각 시설별로 시설명, 지번주소, 도로명주소, 법정동코드, 행정동코드, 도로명코드, 위도·경도 등 위치 식별을 위한 공간정보 항목이 표준화된 형식으로 함께 수록되어 있습니다.시도별 분포를 살펴보면 경기도가 200개소로 가장 많고, 서울특별시 126개소, 경상남도 55개소, 대구광역시 46개소, 경상북도 43개소, 부산광역시 39개소 순으로 나타나며, 그 외 전북특별자치도, 인천광역시, 대전광역시, 광주광역시, 충청권 및 강원·제주·세종 지역까지 전국적으로 고르게 포함되어 있습니다. 이처럼 정밀한 위치정보와 행정구역 코드 체계를 갖춘 본 데이터는 지리정보시스템(GIS)과의 연계 분석이나 행정동·법정동 단위의 집계 작업에 용이하게 활용될 수 있습니다. 또한 아동 친화적 독서 환경 조성을 위한 지자체 정책 수립, 문화소외지역 인프라 격차 진단, 민간 서점 사업자의 입지 분석 및 상권 연계 마케팅 전략 수립 등 공공·민간 양측의 다양한 목적에 기초자료로도 활용될 수 있습니다.향후 타 문화시설 데이터와 결합하면 지역별 문화 향유 격차 진단, 아동 문화정책 수립 등에 기초자료로도 활용될 수 있습니다
