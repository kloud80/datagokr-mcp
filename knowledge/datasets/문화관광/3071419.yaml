summary_user: 구미시 관내에 신고된 민간 체육시설을 시설 한 곳당 한 행으로 담은 명부 파일(csv, 약 72KB)로, 업종·상호·지번 및 도로명 주소·실내 여부를 담는다. 구미시에서 헬스장·당구장·체육도장 같은 업종별 민간 체육시설이 어느 동네에 몰려 있는지 알고 싶은 시민·창업자·정책 분석가가 쓴다. 전역 조인 키는 없어 주소를 지오코딩하거나 상호·업종 이름으로 상권·인허가(LOCALDATA) 자료와 맞춰 이어 쓴다.
description_portal: 이 데이터는 경상북도 구미시 관내에 신고된 민간 체육시설의 현황을 수록한 자료로, 지역 내 다양한 체육시설에 대한 기본 정보를 체계적으로 확인할 수 있도록 구성되어 있습니다. 제공되는 항목에는 체육시설의 상호명, 지번주소, 도로명주소, 업종 분류 등이 포함되어 있으며, 이를 통해 구미시 내 민간 체육시설의 유형별 분포 및 입지 특성을 파악할 수 있습니다. 해당 자료는 생활체육 인프라 조사, 건강증진 관련 정책 수립, 체육시설 수급 불균형 해소 방안 마련, 민간 스포츠 산업 현황 분석 등 다양한 목적에 활용될 수 있습니다. 또한, 시민들의 체육활동 접근성 향상 및 관련 편의시설 확충을 위한 기초 자료로서의 가치도 높습니다.
