summary_user: 공공저작물 통합게시판에 올라온 보도자료를 게시글 단위로 담은 CSV 파일(약 18만 바이트)로, 게시판명·데이터명·본문·조회수·공지/공개 여부·게시 시작일과 종료일, 저작물분류코드와 기관코드명을 포함한다. 공공저작물 정책을 살피는 연구자나 담당자가 '어느 기관이 공공저작물 관련 보도자료를 언제, 얼마나 냈고 조회수는 어땠나'를 확인하는 데 쓴다. 다른 데이터셋과 공통으로 맞물리는 조인 키는 실측에서 확인되지 않았으며, 기관코드·기관코드명이나 저작물분류코드를 이름·코드 매핑으로 맞춰 같은 기관의 공공저작물 데이터와 이어 쓴다.
limits: 전역 조인 키가 없어 다른 데이터와 정확한 키 결합은 어렵고 기관 코드나 이름 대조에 의존해야 한다. 범위는 전국 단위의 비공간 데이터라 지역별 분석에는 쓸 수 없다.
