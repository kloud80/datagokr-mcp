summary_user: 광주광역시 문화예술관광행사 장소를 시설 1곳당 1행으로 정리한 파일 데이터로, 주소·위도·경도·운영시간·휴무일과 영어·중국어·일본어 오디오 가이드 및 시설 안내책자 제공 여부를 담는다(CSV 약 266KB). 외국인 관광객이나 관광 안내·여행 서비스 사업자가 '광주에서 영어 오디오 가이드나 외국어 안내책자를 갖춘 문화시설이 어디이고 언제 여는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 문화시설·공연 데이터와는 시설명·주소 매칭이나 위도·경도 기반 위치 결합으로 이어 쓴다.
