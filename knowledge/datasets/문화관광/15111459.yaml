summary_user: 광주광역시 문화예술관광행사가 열리는 장소를 시설 1곳당 1행으로 담은 기본시설 목록으로, 시설명·지번/도로명 주소·위도·경도·전화번호·홈페이지·SNS 주소·휴무일·운영시간을 담는다(CSV 파일 약 146KB). 시민이나 관광객이 '광주에서 이번 주 쉬는 날 없이 문을 여는 문화시설은 어디이고 몇 시까지 운영하나'를 확인하거나, 분석가가 문화행사 장소의 지역별 분포를 지도로 그리는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·주소 문자열 매칭이나 위도·경도 기반 공간 결합으로만 이어 쓴다.
limits: 공연시설 코드 같은 공통 식별자가 없어 다른 문화시설 데이터와 정확히 연결되지 않으며, 이름·주소 매칭 결과는 따로 검증해야 한다. 명세상 갱신은 수시·이벤트성이라 정기 갱신을 전제로 쓰면 안 되고, 휴무일·운영시간은 입력 날짜(데이터 입력 날짜) 기준 정보로 본다.
