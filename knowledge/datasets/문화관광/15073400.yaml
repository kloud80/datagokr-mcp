description_portal: 1) 한국교육개발원의 「교육통계연보」 자료를 가공하여 작성하였으며, "창작인력"을 "특성화고 및 고등교육기관의 저작·저작인접물 관련 전공학과 졸업자"로 재정의2) 저작물별 관련 전공학과 분류는 ‘부록1.저작(인접)물 종류별 전공학과 분류‘ 참고3) 교육과정 중 "전문대학 과정"은 전문대학, 기능대학, 전공대학, 원격 및 사이버대학, 기술대학, 각종학교, 사내대학의 전문학사 과정을 포함하며, "대학과정"은 대학, 산업대학, 교육대학, 방송통신대학, 원격 및 사이버대학, 기술대학, 각종학교, 사내대학의 학사 과정을 포함4) 2010년 6월 초중등교육법 시행령 개정으로 고교구분이 일반계고/전문계고에서 일반고/자율고/특성화고/특수목적고로 변경됨에 따라 2010년까지는 전문계고 졸업자, 2011년부터는 특성화고와 특수목적고 졸업자를 대상으로 집계5) 관련 전공학과 졸업자 비중(%) = (교육과정별 저작(인접)물 관련 전공학과 졸업자수 ÷ 교육과정별 총 졸업자수) × 100
