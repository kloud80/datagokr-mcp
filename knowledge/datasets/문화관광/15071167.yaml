summary_user: 경상북도 시도지정 문화유산 가운데 상위 등급으로 승격된 건을 한 행씩 담은 목록 파일(CSV, 약 11KB)로, 종별·지정번호·문화재명·수량·소유자·소재지·승격일자를 개별 주소 단위로 기록한다. 연구자나 지역 문화행정 담당자가 '경북에서 어떤 유산이 언제 승격됐고 지금 어디에 있는가'를 확인하거나 승격 시기별 흐름을 살펴보는 데 쓴다. 전역 조인 키는 없으므로 국가유산청 지정 유산 목록 등과는 종별·지정번호·문화재명 같은 이름·번호를 맞춰서 연결하고, 소재지 주소로 지역 단위 집계와 잇는다.
description_portal: 경상북도 지정문화유산 승격 정보는 지역에서 보존 가치가 높다고 평가된 건축물과 생활유산이 상위 등급으로 격상된 내용을 정리한 자료입니다. 이 자료에는 종별 지정번호 명칭 수량 소유자 위치 등이 함께 포함되어 있어 특정 유산이 어떤 기준과 과정에 따라 승격되었는지를 이해하는 데 도움이 됩니다. 또한 승격 시점을 통해 문화유산 관리와 평가 체계의 변화를 살펴볼 수 있으며 지역의 역사적 자원 분포와 정책 흐름을 파악하는 기초 자료로 활용될 수 있습니다. 문화적 가치가 확인된 대상들이 어떤 지역에 존재하며 어떤 방식으로 관리되고 있는지를 확인할 수 있어 보존 전략을 마련할 때 참고할 수 있는 정보를 제공합니다.자료관련 문의는 054-880-3177로 하시기 바랍니다.
