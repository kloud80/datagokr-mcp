summary_user: 정읍시에 소재한 전통사찰을 사찰 한 곳당 한 행으로 담은 목록 파일로, 사찰명·소속종단·도로명/지번 주소·건물과 토지 면적·연혁 및 유래·등록일과 등록번호를 담는다(포털 설명상 2024년 1월 기준). 정읍 지역 사찰을 답사하거나 연구하는 사람이 "정읍에 등록된 전통사찰은 어디이고 어느 종단 소속이며 언제 등록됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 사찰명이나 소재지 주소를 맞춰 붙이거나 같은 정읍시 자료끼리 연결한다.
description_portal: '전북특별자치도 정읍시_전통사찰 현황2024.1월 기준 정읍시에 소재한 전통사찰 현황중 사찰명, 소속종단, 소재지도로명주소, 소재지지번주소, 건물현황, 건물면적, 토지현황필지, 토지면적, 연혁및유래, 등록일, 등록번호의 정보를 제공합니다.[데이터 안내]- 사찰명 : 전통사찰 명칭- 소속종단 : 조계종, 태고종 중 1- 소재지주소 : 전통사찰이 위치한 주소(도로명주소, 지번주소)- 건물현황 : 건물면적, 토지면적 등- 연혁 및 유래 : 전통사찰의 연혁 및 유래에 대한 설명기타 궁금한 사항은 전통사찰 담당부서인 정읍시청 동학유산과로 문의하시기 바랍니다.'
