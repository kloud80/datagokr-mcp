summary_user: 울산광역시 장애인체육관에서 운영하는 생활체육 프로그램을 프로그램 단위로 정리한 파일 데이터로, 구분·프로그램명·대상·정원·교육요일·교육시간·교육내용을 담는다. 장애인 본인이나 가족이 울산 장애인체육관에서 어떤 요일·시간에 누구를 대상으로 하는 강좌가 열리는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 체육시설·프로그램 데이터와는 프로그램명·시설명 같은 이름 매핑이나 같은 기관 자료끼리만 연결한다.
description_portal: 본 데이터는 관내 장애인 체육관의 운영 프로그램 현황 정보이다. 프로그램별 명칭, 운영 시간, 대상 장애 유형, 참여 인원, 지도자 정보 등의 세부 내용을 포함한다. 장애인 체육관은 장애인의 건강 증진과 재활을 위한 맞춤형 운동 프로그램을 제공하는 시설이다. 해당 자료는 장애인 체육 정책 수립, 프로그램 개발, 체육 복지 서비스 확대에 활용된다. 장애 유형별 특성을 고려한 전문 프로그램 운영을 통해 장애인의 신체 기능 향상 및 사회 참여 기회를 확대한다. 시민들이 장애인 가족을 위한 적합한 체육 프로그램을 찾고 참여 방법을 확인하는 데 유용하다. 또한 장애인 생활 체육 활성화 및 재활 지원에 기여한다. 본 정보는 정기적으로 갱신되어 최신 현황을 반영한다.
