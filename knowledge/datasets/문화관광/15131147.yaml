description_portal: 경상남도 남해군의 주요관광지에 대한 통계현황 데이터 입니다. 남해군에서 운영하고 있는 주요 관광지(20곳)과 그에 해당하는 주소, 이용금액구분(유료/무료 구분),  그리고 2020년 부터  현재 2024년까지 연도별  누적 관광객 수에 대한 자료를 제공하고 있습니다.남해각, 설리스카이워크는 2021년부터 운영, 2020년에 미존재로 관광객 수가 없습니다. 참고하시기 바랍니다. 그리고 관광지에 따라 미운영 기간을 반영한 통계 자료이며 시설에 설치된 계수기로 추출된 데이터임을 참고하시어 활용하시기 바랍니다.
