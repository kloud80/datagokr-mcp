summary_user: 인천광역시 연수구 안에 있는 출판사·인쇄소를 사업체 한 곳당 한 줄로 담은 개별 목록으로, 사업체 명칭과 도로명 소재지가 들어 있다(CSV 약 68KB). 창업 예정자나 지역 분석가가 연수구 어느 동네에 출판·인쇄 업체가 몰려 있는지 확인하거나 거래할 인쇄소를 찾을 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 도로명 주소를 지오코딩하거나 사업체명으로 맞춰 이어야 하며, 같은 연수구가 낸 다른 업종 현황과 주소 기준으로 겹쳐 보는 방식이 현실적이다.
limits: 사업자등록번호나 출판사 신고번호 같은 식별 키가 실측 컬럼에 없어 전국 출판사 신고 원장 등과 정확히 연결할 수 없다. 범위는 연수구 한 곳뿐이므로 인천시 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다.
