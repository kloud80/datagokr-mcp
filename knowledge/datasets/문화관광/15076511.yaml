summary_user: AK공연예술(한국문화예술위원회 공연예술 아카이브)이 정리한 연극 등 공연예술 시상 정보를 상 1건·수상자(작) 단위로 담은 CSV 파일(약 155KB)로, 연도·시상명·회차·시상 기간·주최·지역·장소·세부장르가 함께 들어 있다. 연구자나 기획자가 특정 연극상의 역대 수상작과 수상 단체를 찾거나, 주최 기관별 시상 이력을 정리할 때 쓴다. 실측 컬럼에는 KOPIS 공연ID 같은 전역 조인 키가 없어서, 다른 공연 데이터와는 수상작명·단체명·장소명을 문자열로 맞춰 연결해야 한다.
description_portal: AK공연예술의 상정보입니다. 각 구성 항목으로는 연번, 연도, 시상명, 회차, 시작일, 종료일, 수상자/수상작, 단체구분, 주최, 지역, 장소, 참가대상, 세부장르, 비고로 구성되어 있습니다. 연도 항목은 2007, 2008, 2015, 2017, 2018로 구성되어 있습니다. 시작일은 날짜 형식으로 2007-01-06과 같은 형식으로 구성되어 있습니다. 주최 항목에는 (사)한국연극배우협회, 한국연극평론가협회, 월간한국연극, 대한민국, 국제아동청소년연극협회 등으로 구성되어 있습니다. 따라서 파일에서 AK공연예술의 상 정보를 확인할 수 있습니다.
