summary_user: 제주관광공사가 운영하는 온라인 면세점에서 상품 아이디별로 연결된 검색 키워드를 한 행씩 담은 매핑 파일입니다(포털 설명 기준 15,346건, CSV 약 1.2MB, 활용신청 없이 내려받음). 면세점 상품 검색 개선이나 추천 기능을 만드는 사업자·분석가가 '어떤 상품에 어떤 검색어가 붙어 있고, 자주 쓰이는 키워드는 무엇인가'를 볼 때 씁니다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상품아이디를 같은 기관의 상품 데이터와 맞추거나 키워드 문자열로 매칭하는 방식으로만 이어 씁니다.
description_portal: 이 데이터는 고객들이 온라인 면세점 상품을 검색할 때 사용되는 키워드 정보를 담고 있습니다. 상품 아이디별로 연관된 다양한 키워드를 포함하며, 총 15,346건의 데이터로 구성되어 있습니다.이 데이터를 개방하면 소비자 검색 편의성을 극대화하고, 온라인 면세점의 마케팅 효율을 높이는 효과를 기대할 수 있습니다. 기업들은 이 정보를 활용해 검색엔진 최적화(SEO)를 강화하고, 고객의 검색 패턴을 분석하여 맞춤형 상품 추천 서비스를 개발할 수 있습니다. 이는 궁극적으로 소비자 경험을 개선하고 매출 증대에 기여하며, 데이터 기반의 새로운 비즈니스 모델 창출을 촉진하여 면세점 시장의 경쟁력을 강화할 것입니다.
