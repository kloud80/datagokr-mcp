description_portal: 대전광역시 한밭도서관에서  2025년  전시실을  운영하고 그  실적에 대한 보고 내용(전시명, 전시내용, 기간, 관람인원 등)입니다. 운영회수는 총 6회  전시일은  107일, 관람인원은 15,350명, 일일평균은 143명입니다.2025년에는  나태주, 신선미 작가 전 , 대전 웹툰작가 특별전, 생태관련 전시, 전국 청소년 세금작품 입상작 전시회, 시확산 시민운동 순회전시, 아마추어 작가 그림책 및 원화 전시 등 지역주민에게 수준 높은 문화예술 향유 기회 를 제공하고 독서문화를 확산하며 시민들간에 소통할 수 있는 전시를 운영하고자 하였다. 지역 작가 작품 및 유관기관과의 협력을 통해 지역 문화예술 진흥에 기여하고자 하였으며 작가들간의 콜라보레이션을 통한 협업 전시 및 함께 그리는 그림, 전시 감상 공유, 컬러링 등 참여형  및  체험형 전시로 구성하여 관람자 만족도 증대 및 시민이 공감할 수 있는 복합문화공간으로서의 역할을 제고하였다.
