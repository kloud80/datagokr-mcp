description_portal: 영상물등급위원회는「영화 및 비디오물의 진흥에 관한 법률」제71조에 따라 ‘영상물의 공공성과 윤리성을 확보하고 청소년을 보호’하기 위해 설립되었으며동법 제72조의 영상물등의 등급분류 및 내용정보, 청소년 유해성 확인 심의 등의 직무를 수행하는 문화체육관광부 산하 공공기관입니다.해당 데이터는 영상물등급위원회에서 등급분류한 비디오물 등급분류 건수 통계 데이터로 연간 월별 비디오물 등급분류 처리 건수 통계와 비디오물 분류별(극영화, 뮤직비디오, 애니메이션 등) 등급분류 처리 건수 통계 데이터입니다.
