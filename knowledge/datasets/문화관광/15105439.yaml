summary_user: 영상물등급위원회가 등급분류한 비디오물의 처리 건수를 월별과 분류별(극영화·뮤직비디오·애니메이션 등)로 집계한 전국 단위 통계 파일(xlsx)이다. 비디오물 시장 동향을 보는 분석가나 콘텐츠 사업자가 '연도·월별로 비디오물 등급분류 건수가 어떻게 변했고 어떤 분류가 많은가'를 확인하는 데 쓴다. 실측 컬럼에서 공통 조인 키를 찾지 못했으므로 다른 데이터와는 연도·월이나 분류명으로 맞춰 붙이거나, 같은 기관의 영화·광고물 등급분류 통계와 나란히 비교하는 방식으로 쓴다.
limits: 건별 등급분류 내역이 아닌 집계 건수라 개별 작품의 등급·내용정보는 알 수 없다. 파일의 첫 행이 표 제목이고 나머지 열 이름이 비어 있어(Unnamed) 읽을 때 머리글 행을 직접 지정해야 한다. 지역 구분 없이 전국 단위만 담는다.
