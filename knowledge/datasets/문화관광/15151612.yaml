summary_user: 경기데이터 분석포털이 추천 관광코스를 구성할 때 쓴 관광지를 코스 안 순서 단위로 담은 자료로, 한 행에 추천코스ID·코스순번·관광지점번호·이동시간·선호관광지코드·추천관광지순위·관광권역코드가 들어간다. 관광 분석가나 지자체 담당자가 "어느 관광지가 여러 추천코스에 자주 들어가고 몇 번째 순서에 놓이는가" 같은 코스 구성·연결 구조 질문에 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, TourAPI 관광지 정보나 다른 관광 데이터와는 관광지점번호·관광권역코드를 같은 기관(경기도) 코드나 이름 매핑으로 맞춰 이어야 한다.
description_portal: 이 데이터는 경기데이터 분석포털에서 다양한 추천 관광코스를 구성할 때 사용된 관광지와 해당 관광지 간의 순서, 선호도 및 추천 정보를 포함한 자료입니다. 각 추천코스는 고유 식별자인 추천코스ID로 구분되며, 해당 코스 내에서 관광지의 순서(코스순번), 관광지점번호, 이동시간, 선호관광지코드, 추천관광지순위, 관광권역코드 등의 항목으로 구성됩니다. 이 데이터를 통해 관광객 선호도를 반영한 관광 코스 구성, 지역별 관광지 추천 우선순위 설정, 관광권역별 코스 패턴 분석 등에 활용할 수 있습니다. 또한 관광지점번호와 추천코스ID 간의 관계를 통해 특정 관광지의 상대적 중요도나 연결 구조를 파악할 수 있습니다.
