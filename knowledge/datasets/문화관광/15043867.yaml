summary_user: 한국저작권위원회가 운영한 온라인 저작권 교육을 교육방법(비실시간 동영상 강의·실시간 화상 수업 등)별로 나눠 교육인원과 교육횟수를 연도별로 집계한 전국 단위 통계표로, 2009~2015년 합산치와 2016~2024년 연도별 값이 열로 펼쳐진 237바이트짜리 소규모 CSV 파일이다. 저작권 교육 담당자나 정책 분석가가 "코로나 이후 실시간 화상 수업과 동영상 강의 중 어느 방식의 수강 인원이 더 늘었나" 같은 질문을 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와 코드로 이을 수 없고, 같은 기관의 오프라인 교육 통계 등과 교육방법·연도 이름을 맞춰 나란히 비교하는 방식으로만 연결한다.
description_portal: 한국저작권위원회에서 국민의 평생교육을 촉진하고 인적자원 개발 및 관리를 위해 학습계좌 제도를 도입하고 운영하도록 노력해야 합니다. 학습계좌는 개인의 학습경험을 종합적으로 관리하는 시스템을 의미하는데 평생교육법 시행령 제23조 기반으로 비실시간 동영상 강의와 실시간 화상 수업으로 나눌 수 있습니다. 비실시간 동영상 강의는 주로 학습 콘텐츠를 제공하고 실시간 화상 수업은 쌍방향 소통을 통해 수업을 진행됩니다. 이러한 수업방식인 저작권 교육의 방법(온라인)에 따른 교육 인원과 교육 횟수 연도별 통계 현황 및 데이터입니다.
