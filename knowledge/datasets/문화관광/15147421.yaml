summary_user: 강북구 안의 수영장업 업소를 한 곳씩 담은 인허가 명부로, 인허가일·취소일, 영업상태(영업·폐업)와 상세상태, 폐업일, 사업장명, 지번·도로명 주소, 중부원점TM 좌표(X·Y), 시설 규모(건물 동수·면적), 지도자 수 같은 항목을 가진다. 강북구에서 지금 영업 중인 수영장이 어디이고 언제 문을 열거나 닫았는지 알고 싶은 주민이나, 민간 체육시설 개폐업을 상권 흐름의 신호로 보려는 분석가가 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매칭이나 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드로만 잇는다.
description_portal: '서울특별시 강북구 수영장업 인허가 정보 데이터는 강북구의 수영장 등 수영 같은 레크레이션을 즐기기 위해 인공적으로 물을 채워 제공하는 업소정보입니다* 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.* 본 데이터는 영업중인 곳과 폐업중인 곳을 모두 포함하고 있습니다해당자료는 서울특별시 열린데이터 광장(https://data.seoul.go.kr/)으로 연결되며 데이터는 자료변경시 비정기적으로 자동갱신됩니다.'
