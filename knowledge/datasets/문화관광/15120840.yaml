summary_user: 부산광역시 동래구 관내 게임제공업 영업소를 한 곳씩 담은 목록으로, 업종명·상호명·도로명/지번 소재지·우편번호·제공게임물 구분·게임기 수·시설면적을 담는다(약 13KB 크기의 CSV 파일). 동래구에서 게임장(청소년게임제공업·일반게임제공업 등)을 차리려는 사업자나 주민·분석가가 "우리 동네에 게임장이 어디에 몇 곳 있고 규모는 어떤가"를 확인하는 데 쓴다. 전역 조인 키나 코드표는 없어서 다른 데이터와는 주소(도로명·지번)나 상호명을 맞춰 붙이거나, 같은 동래구가 낸 다른 업소 현황과 나란히 놓고 쓴다.
description_portal: 부산광역시 동래구 관내 게임제공업 현황에 대한 데이터로 상호명, 소재지(도로명주소, 지번주소), 시설 면적 등의 항목을 제공합니다. )  “게임제공업”이란, 공중이 게임물을 이용할 수 있도록 이를 제공하는 영업을 말함(게임산업법 제2조 제6호 본문). 그러나 카지노업, 사행행위, 인터넷컴퓨터게임시설제공업 등 게임산업법 제2조 제6호 각 목의 어느 하나에 해당하는 경우는 제외됨(게임산업법 제2조 제6호 단서). “게임제공업”에서 제외되는 경우(게임산업법 제2조 제6호 가목 ~ 바목) 「관광진흥법」에 의한 카지노업을 하는 경우 「사행행위 등 규제 및 처벌특례법」에 의한 사행기구를 갖추어 사행행위를 하는 경우 게임산업법 제2조 제4호 내지 제8호에 규정한 영업 외의 영업을 하면서 고객의 유치 또는 광고 등을 목적으로 해당 영업소의 고    객이 게임물을 이용할 수 있도록 하는 경우로서 대통령령이 정하는 종류 및 방법 등에 의하여 게임물을 제공하는 경우 인터넷컴퓨터게임시설제공업의 경우 사행성게임물에 해당되어 등급분류 거부결정을 받은 게임물을 제공하는 경우 「관광진흥법」 제3조의 규정에 의한 관광사업의 규율대상이 되는 것으로서 동법에 따른 유기시설 또는 유기기구를 이용에 제공      하는 경우(다만, 안전성 관리 필요성이 크지 아니한 유기시설 또는 유기기구로서 문화체육관광부장관이 정하여 고시하는 것은    제외)이 중 게임산업법 제2조 제6호 다목에 따라 게임제공업에서 제외되기 위해서는,  ① 전체이용가 게임물만을 제공할 것 ② 1개의 영업소당 문화체육관광부장관이 정하여 고시하는 수 이하의 게임물을 설치할 것 ③ 게임물을 당해 영업소 건물 내에 설치할 것 이라는 요건을 모두 충족하여 게임물을 제공하여야 함(시행령 제2조 제1항).  이 중 ②항의 문화체육관광부고시 제2016-8호 「게임제공업소 등이 아닌 영업소의 게임물 설치 대수」는 아래와 같이 게임물 설치 대수 기준 및 준수사항을 정하고 있음.
