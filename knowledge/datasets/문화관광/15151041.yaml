description_portal: 국립박물관문화재단 박물관상품 판매정보 누적 데이터로, 구분(숫자형), 상품명(문자형), 판매가(숫자형) 항목을 포함하고 있습니다.뮷즈(MU:DS)란 국립박물관이 소장한 문화유산을 모티브로 많은 사람들이 일상에서 가깝게 느끼고 사용할 수 있도록 만든 국립박물관문화재단의 박물관 상품 브랜드로 박물관 문화유산의 고유한 가치에 오늘날의 쓰임새를 더해 유물을 소장하는 즐거움을 제공하고 박물관에서의 좋았던 순간을 일상에서 두고두고 이어가고 싶은 마음을 채웁니다.본 데이터는 다년간의 박물관상품의 판매 흐름을 반영한 자료로 데이터를 통해 판매 지속 추이를 한번에 확인할 수 있습니다.해당 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 문의해주시기 바랍니다.
