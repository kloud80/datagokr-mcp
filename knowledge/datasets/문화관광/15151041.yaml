summary_user: 국립박물관문화재단의 박물관 상품 브랜드 뮷즈(MU:DS) 상품을 상품명과 판매가 단위로 여러 해에 걸쳐 쌓은 누적 목록으로, 전국 단위·비공간 자료이며 약 1.2MB 분량의 CSV 파일로 제공된다. 박물관 굿즈를 찾는 국민이나 문화상품 분석가가 "국립박물관 상품은 어떤 품목이 어느 가격대로 판매돼 왔나"를 확인하는 데 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 다른 박물관·유물 데이터와는 상품명 같은 이름 매칭으로만 느슨하게 이어 쓴다.
