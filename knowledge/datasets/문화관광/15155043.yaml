summary_user: 전국 자치단체가 관리하는 비디오물소극장업 인허가 정보를 업소 한 곳당 한 건으로 모아, 사업장명·인허가일자·영업상태·휴폐업일자·도로명/지번주소·좌표와 시설면적·비상구·소방시설 같은 시설 정보를 담는다. 문화 분야 사업자나 분석가가 "우리 지역에 지금 영업 중인 비디오물소극장이 어디에 몇 곳 있고 언제 허가됐는가"를 확인하는 데 쓴다. 전역 조인 키는 없어 개방자치단체코드(OPN_ATMY_GRP_CD)나 주소·좌표로 지역 단위 데이터와 맞춰 이어 쓰고, 다른 인허가 업종 데이터와는 같은 기관 코드 체계로만 연결한다.
limits: 조회 때 기준일자와 개방자치단체코드가 필수인데 이 코드는 다른 데이터에서 먼저 받아 넘겨야 하고, 이력(/history) 오퍼레이션은 최소 파라미터로 호출했을 때 응답이 없었다. 좌표는 보정계수가 없는 Bessel 중부원점TM(EPSG:5174)이라 지도에 올리려면 좌표 변환이 필요하다.
