summary_user: 경기도 주요관광지 방문객 실태조사(국가승인통계)의 조사지점을 한 행씩 담은 목록으로, 지점마다 관광지명·조사위치·출입구 수·계수방법(계수기·입장권 등)과 정제된 도로명·지번 주소, 우편번호, 위경도를 담는다. 분석가나 관광 담당자가 "이 관광지의 방문객 수는 어느 출입구에서 어떤 방식으로 세었나"를 확인해 입장객 통계의 측정 기준을 해석하는 데 쓴다. 관광지점코드·시군구코드 같은 전역 조인 키가 없으므로, 관광지 입장객 통계와는 관광지명으로, 다른 공간 데이터와는 주소나 위경도로 맞춰 잇는다.
description_portal: 경기도 주요관광지 방문객 실태조사(국가승인통계 제210015호)와 관련되어 주요 관광지에서의 방문객 실태를 파악하기 위해 수집된 조사 지점 목록을 제공합니다.각 조사지점은 관광지명, 조사위치, 출입구 수, 계수방법 등의 항목을 포함하고 있습니다.계수방법은 방문객을 측정하는 방식으로 계수기나 입장권 등을 활용하며, 출입구 수는 해당 지점에서 출입이 가능한 개별 경로의 수를 나타냅니다.이 데이터는 관광지별 유동 인구 분석, 방문객 동선 파악, 관광 인프라 개선 및 정책 수립 등에 활용될 수 있습니다.
