summary_user: 서울 금천구에 인허가된 체력단련장업(헬스장 등) 사업장을 한 곳당 한 행으로 담은 건별 명부로, 인허가·취소·폐업 일자, 영업상태, 사업장명, 지번·도로명 주소, 좌표, 지도자 수, 회원 모집 인원, 보험 가입 여부, 건축물 동수·면적 등을 포함한다. 창업자나 상권 분석가가 '금천구에서 최근 문을 열거나 닫은 헬스장이 어디이고 몇 곳인가'를 확인하는 데 쓰며, 헬스장 개폐업은 상권 신호로도 읽힌다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매핑이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하고, 좌표(X·Y)는 지도 위 상권 데이터와 겹쳐 보는 데 쓴다.
description_portal: 체력단련장업 인허가 정보는 인허가일자, 영업상태, 사업장명, 주소, 전화번호뿐만 아니라 지도자 수, 회원 모집 인원, 보험 가입 여부 등 다양한 세부 항목을 포함한 데이터입니다. 또한 위치 좌표, 업종 구분, 건축물 정보 등이 함께 제공되어 공간적 분석에도 활용할 수 있습니다. 이 데이터를 통해 지역 내 체력단련장의 분포와 운영 현황을 종합적으로 파악할 수 있으며, 신규 창업 입지 선정, 시설 관리, 정책 수립, 안전 관리 체계 강화 등에 기초 자료로 쓰일 수 있습니다. 더 나아가 지역사회 체육 인프라 분석, 생활체육 활성화, 행정 업무 지원, 학술 연구 등 여러 분야에서 유용하게 활용될 수 있는 중요한 공공 데이터입니다.
