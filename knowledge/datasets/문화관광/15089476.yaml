summary_user: 인천광역시 서구(서해구)에 등록된 무도학원업 업소를 한 곳당 한 줄로 담은 명부로, 상호·지번 및 도로명 주소·전화번호·기준일자가 들어 있다(CSV 572바이트로 소수 업소 규모). 주민이 "우리 동네 근처에 등록된 무도학원이 어디 있고 연락처는 무엇인가"를 찾거나, 분석가가 구 단위 민간 체육시설 분포를 파악할 때 쓴다. 실측 컬럼에 인허가번호 같은 전역 조인 키가 없어, 다른 체육시설업·상권 데이터와는 주소나 상호를 맞춰 붙이거나 같은 기관 자료끼리 연결한다.
description_portal: 본 공공데이터는 인천광역시 서구에 등록된 무도학원업 현황을 제공하고 있습니다. 본 데이터는 인천광역시 서구 내 무도학원업의 상호, 시설주소(지번), 시설주소(도로명), 전화번호 항목을 제공하고 있습니다. 본 공공데이터를 통하여 지역 주민들은 인근 무도학원을 손쉽게 찾을 수 있어 지역 주민들의 건강 증진 기회에 기여하는데 도움이 될것으로 판단이 됩니다. 또한 생활체육 진흥정책 수립 등 체육 분야의 정책의 기초자료로 활용할 수 있을것으로 판단이 됩니다. 본 데이터는 연마다 정기적인 갱신을 통해 최신정보를 반영합니다.
