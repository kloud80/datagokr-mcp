summary_user: 빅카인즈(BIGKinds)에 수록된 국내 신문·방송의 미세먼지 관련 기사를 기사 한 건당 한 행으로 담은 CSV 파일(약 24만 바이트)로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목을 포함한다. 연구자나 정책 분석가가 "미세먼지 보도가 어느 시기에 몰렸고, 원인·정책·건강 중 어떤 주제의 키워드가 많이 나왔나"를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어서, 대기질 측정자료 같은 다른 데이터와는 일자나 키워드 같은 이름 값을 직접 맞춰야만 연결된다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 미세먼지 관련 뉴스 메타정보 자료입니다. 미세먼지는 대기오염의 대표적 원인으로, 호흡기와 심혈관계 질환 등 국민 건강에 심각한 영향을 미치며, 사회·경제적 비용을 증가시키는 주요 환경 문제로 꼽힙니다. 본 자료는 국내 주요 신문과 방송 보도에서 미세먼지와 관련된 기사들을 분석해 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 인식 변화를 파악할 수 있도록 구성되었습니다. 이를 통해 미세먼지 발생 원인, 정부의 환경 정책, 국제 협력 방안, 건강 관리 대책, 기후 변화와의 연관성 등 다양한 이슈가 언론 보도에서 어떻게 다뤄졌는지를 객관적으로 확인할 수 있습니다. 또한 학술 연구, 정책 분석, 환경 교육, 언론 연구에 활용 가능한 기초 자료로, 대기 환경 개선과 지속 가능한 발전을 위한 사회적 합의를 이끌어내는 데 기여할 수 있습니다.
