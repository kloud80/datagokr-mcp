summary_user: 제주 이호테우해변과 내도동 알작지 일대의 음식점·카페·편의점·숙박시설·관광지 등 주변시설을 시설 한 곳당 한 행으로 담고, 유형(구분)·명칭·거리·주소·전화번호·휠체어 진입 가능 여부·장애인 화장실 여부를 함께 적는다. 휠체어 이용자나 노약자·영유아 동반 가족이 이호테우해변 근처에서 휠체어로 들어갈 수 있고 장애인 화장실이 있는 식당·숙소를 찾을 때, 또는 무장애 관광 안내 자료를 만들 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 목록 등 다른 데이터와는 시설 명칭·주소를 맞춰 보는 방식으로만 연결한다.
description_portal: '"제주특별자치도 내 이호테우해변과내도동알작지_무장애주변관광지 데이터를 제공합니다.* 제주특별자치도 이호테우해변 및 내도동 알작지 일대에서 장애인·노약자·영유아 동반 가족 등 관광약자의 이용 가능성이 높은 무장애 여행 주변시설 정보를 체계적으로 정리한 통계자료입니다. 본 자료에는 음식점, 카페 및 편의점, 숙박시설, 관광지 등 다양한 유형의 시설에 대해 명칭, 거리, 주소, 전화번호, 휠체어 진입 가능 여부 및 장애인 화장실 제공 여부 등이 포함되어 있어 접근성에 제약이 있는 이용자들의 방문 여건을 객관적으로 파악할 수 있습니다. 또한 이 정보는 무장애 관광 접근성 평가, 관광서비스 개선, 지역 관광정책 수립 및 관광약자 대상 안내 자료 제작 등에 유용한 기초자료로 활용될 수 있습니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
