summary_user: 서울올림픽기념국민체육진흥공단이 관리하는 레저스포츠 시설의 종목, 시설명, 홈페이지, 전화번호, 시도·시군구, 도로명주소를 시설 단위로 담은 조회 API이다. 가까운 레저스포츠 시설이 어디에 있고 어떻게 연락하는지 찾는 국민이나, 지역별 스포츠 인프라를 살피는 분석가가 쓴다. 도로명주소(faci_road_addr)와 상세주소(faci_road_daddr)가 주소 조인 키여서, 주소 기준으로 다른 체육시설·상권 데이터와 이어 쓴다.
description_portal: 레저스포츠 시설은 서울올림픽기념국민체육진흥공단에서 관리하는 레저스포츠 시설들의 위치, 홈페이지, 전화번호 등 정보를 확인 할 수 있습니다. 레저스포츠 시설 안에서 진행되는 시설종목명, 시설명, 시설의 홈페이지와 전화번호, 시도, 시군구명, 시설의 도로명주소 및 상세주소, 지번 기본주소 등을 포함합니다. 시설종목명과 시설명, 시도, 시군구명으로 조회할 수 있습니다. 요약하면 국민체육진흥공단에서 관리하는 레저스포츠 시설들의 상세 정보 조회를 제공하는 서비스입니다. 이 서비스는 전국 레저스포츠 시설의 위치 및 연락처 정보를 제공하여 이용자의 시설 접근성 향상과 지역별 스포츠 인프라 분석에 활용될 수 있습니다.
