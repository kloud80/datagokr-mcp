summary_user: 인천광역시 연수구 안에 있는 국가·시도 지정 문화유산을 한 건씩 담은 목록 파일(CSV 약 5KB)로, 지정 주체, 유형 구분, 명칭, 소재지, 소유자(관리자)와 연락처, 지정일자를 담는다. 주민이나 연구자가 '연수구에 어떤 지정 문화유산이 어디에 있고 누가 관리하며 언제 지정됐나'를 확인하는 데 쓴다. 국가유산청 종목코드·지정번호 같은 전역 조인 키가 없어서, 국가유산청 API나 다른 데이터와는 명칭·소재지 주소를 맞춰 보는 방식으로 이어 써야 한다.
limits: 국가유산 표준 식별자(종목코드·지정번호)와 소재지 필지번호(PNU)가 없어 국가유산청 자료와 기계적으로 결합하기 어렵다. 범위는 연수구 한 곳에 그친다. 관람·행사 정보와 관리 이력은 담지 않는다.
