    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: festivalNm
        required: false
        desc: 축제 명칭
      - name: festivalMonth
        required: false
        desc: 축제 날짜
      - name: startPage
        required: false
        desc: 시작 페이지
      - name: pageSize
        required: false
        desc: 페이지 크기
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getFestivalImgList
    name: 남도여행길잡이 축제 이미지 목록
