      - name: startPage
        required: true
        example: '1'
        desc: 시작 페이지
      - name: pageSize
        required: true
        example: '10'
        desc: 페이지 크기
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
