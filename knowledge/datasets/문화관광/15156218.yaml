description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 프로야구 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 제목, 통합분류(1~3단계), 개체명(인물·지역·기업·팀명), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적·정량적 분석이 가능합니다.본 자료는 국내 주요 언론사의 프로야구(KBO 리그) 관련 보도를 대상으로, 어떤 팀·선수·경기 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 보도 프레임이 어떻게 형성되었는지 등을 파악하는 데 중점을 두고 있습니다. 이러한 분석을 통해 언론이 정규시즌·포스트시즌 흐름, 선수 성적 및 부상, 트레이드·FA·신인 드래프트, 감독 교체 및 팀 전략 변화, 경기력 논쟁, 스타 선수 중심의 스토리텔링 등 다양한 이슈를 어떤 관점에서 재현하는지 확인할 수 있으며, 이러한 보도 경향이 팬 여론, 팀 마케팅 전략, 리그 운영 방향 등에 어떤 영향을 미쳤는지를 추적하는 데도 유용합니다.또한 이 자료는 스포츠 분야 연구자, 구단 전략 담당자, 스포츠 마케팅 관계자, 언론·커뮤니케이션 연구자 등에게 프로야구 보도의 흐름, 이슈별 프레임 변화, 언론의 스포츠 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
