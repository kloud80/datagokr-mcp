summary_user: "대구광역시가 추천하는 관광코스를 주제·일정별로 분류해, 코스번호 순으로 들르는 관광지마다 주소·전화번호·홈페이지·개방시간·이용 금액·설명을 담은 파일(CSV, 약 55KB)이며 행 단위는 코스 안의 개별 방문지입니다. 대구 여행을 준비하는 관광객이나 여행 앱 개발자가 '1박 2일 일정으로 어떤 순서로 어디를 돌면 되나'를 확인할 때 쓴다. 표준 관광지 ID나 지역코드 같은 전역 조인 키가 없어, 다른 관광 데이터(예: TourAPI 관광지 정보)와는 관광지 이름이나 주소를 맞춰 연결해야 합니다."
description_portal: 추천 관광 코스 정보는 대구를 여행하는 관광객들에게 보다 체계적이고 편리한 여행 계획을 돕는 중요한 자료입니다. 이 데이터는 관광코스를 주제별로 분류하여, 각 코스의 일정, 주요 관광지, 여행 동선 등을 구체적으로 안내합니다. 각 코스에는 관광지의 위치, 주소, 개방 시간, 전화번호 등 기본적인 정보뿐만 아니라 코스를 효율적으로 연결할 수 있는 정보를 포함하고 있어, 관광객이 대구를 방문할 때 참고할 수 있는 유용한 자료입니다. 또한, 각 코스에 대한 상세한 설명을 참고하여 여행 계획이 가능하며, 관광객들이 미리 준비하고 여행할 수 있도록 돕습니다.
