summary_user: "국립민속박물관 한국민속대백과사전의 표제어별 사진·음원 멀티미디어 자료를 건별로 담으며, 각 자료에 그룹명, 표제 식별번호(tit_idx), 사전 구분, 이미지 경로(대·소), 요약 등이 붙는다. 교사·전시 기획자·콘텐츠 제작자가 '특정 민속 표제어(예: 세시풍속 항목)에 어떤 사진과 소리 자료가 있는가'를 찾아 교육·전시 자료로 쓸 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 표제어 이름이나 같은 기관(국립민속박물관)의 표제 식별번호로만 이어 쓴다."
description_portal: 한국민속대백과사전의 표제어와 관련된 사진 및 음원 자료를 체계적으로 제공하는 데이터입니다. 표제어별로 사진 목록과 해당 사진의 상세 정보, 음원 목록 등 다양한 멀티미디어 자료를 포함하고 있으며, 각 자료에는 그룹명, 표제아이디, 사진명, 사전구분, 사진경로, 순번 등 주요 정보가 함께 제공됩니다. 이를 통해 한국의 민속과 전통문화를 시각적·청각적으로 이해할 수 있으며, 학술 연구, 전시 기획, 문화 콘텐츠 개발, 교육 자료 제작 등 다양한 분야에서 참고 자료로 활용할 수 있습니다. 또한 사진과 음원을 결합하여 전통문화의 생생한 현장을 전달할 수 있어, 대중의 문화 향유와 전통문화 보존·확산에도 기여합니다.
