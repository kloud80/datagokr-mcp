summary_user: 경상북도 김천시 관내 문화재를 한 건씩 담은 목록 파일로, 지정 구분(국보·보물·사적·천연기념물·도지정 등), 지정번호, 명칭, 수량, 도로명·지번 주소, 유래 설명을 담는다. 시민·연구자·관광업계가 '김천시에 어떤 지정 문화재가 어디에 있고 어떤 내력을 지녔나'를 확인하거나 지역 문화관광 콘텐츠를 만들 때 쓴다. 전역 조인 키는 없어 국가유산청 자료와는 명칭·지정번호를 맞춰 대조해야 하고, 위치 연계는 주소를 지오코딩해 붙인다.
description_portal: 본 데이터는 경상북도 김천시 관내의 문화재에 대한 지역의 역사문화적 가치를 보존하고 알리기 위해  현황을 체계적으로 수록한 공공데이터입니다.. 수록된 문화재는 국보, 보물, 사적, 천연기념물, 국가무형문화재, 국가민속문화재, 도지정문화재 등 다양한 지정유형으로 구분되어 있으며, 각 문화재의 고유 지정번호와 명칭, 총 수량, 문화재가 소재한 도로명주소 및 지번주소가 포함됩니다. 또한 각 문화재의 유래와 전승 배경, 역사적 의미 등에 대한 간단한 설명이 포함되어 있어 시민은 물론 연구자, 관광업계, 교육기관 등에서 문화유산 정책 수립, 학술연구, 문화 관광 콘텐츠 개발 등 다양한 목적으로 활용할 수 있습니다. 본 데이터는 김천시의 문화자원 분포와 유형을 한눈에 파악할 수 있도록 구성되었으며, 향후 문화재 보존관리 및 활용정책 수립의 기초자료로도 활용 가능합니다
