summary_user: 경기문화재단 지지씨플랫폼에 등록된 경기도 내 전시·공연·교육·행사 프로그램을 한 건씩 담으며, 기관명·제목·분류·시작일과 종료일·시간·비용·연락처·주최기관·홈페이지 주소가 들어 있습니다. 시민이나 관광·문화 서비스 사업자가 "이번 주말 경기도에서 무료로 볼 수 있는 전시나 공연이 있나"를 찾을 때 쓰며, 지역 문화 프로그램 분포를 분석하는 데도 씁니다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 데이터와는 기관명(inst_nm)·주최기관명 같은 이름 매칭이나 행사 기간 날짜로만 이어 씁니다.
description_portal: 「경기도 문화 행사 현황」 데이터는 경기문화재단이 운영하는 지지씨플랫폼(GGC Platform)에 등록된 경기도 내 문화 프로그램 정보를 종합적으로 제공합니다. 주요 항목은 기관명, 제목, 분류, URL, 이미지URL, 시작일자, 종료일자, 시간, 비용, 전화번호, 주최기관명, 홈페이지URL, 작성일자로 구성되어 있으며, 전시·공연·교육·행사 등 다양한 형태의 문화 활동이 포함됩니다. 본 데이터는 전시관·박물관·미술관·공연장 등에서 개최되는 프로그램과 관련된 정보를 담고 있어, 시민의 문화 향유 기회 확대, 관광·문화산업 활성화, 지역문화 네트워크 연구, 정책 기초자료 활용에 유용합니다.
