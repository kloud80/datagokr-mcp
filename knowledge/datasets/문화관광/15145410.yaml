description_portal: 이 데이터는 우리 시의 야영(캠핑)장 현황을 담고 있습니다. 주요 항목에는 야영장구분, 인허가일자, 영업상태명, 상호명, 행정동명, 소재지도로명주소, 소재지지번주소, 위도, 경도, 대표전화번호, 시설면적, 관리기관명, 데이터기준일자가 있습니다. 야영장구분에는 일반야영장, 자동차야영장 등 유형이 구분되어 있습니다. 인허가일자는 해당 시설의 허가 또는 신고일자를 나타내고, 영업상태명에는 영업 중, 휴업, 폐업 여부가 있습니다. 상호명은 시설의 공식 명칭이며, 행정동명과 주소 정보는 위치 파악을 위해 제공됩니다. 위도와 경도는 지도 기반 위치 확인이 가능합니다. 대표전화번호는 이용 문의를 위한 연락처가 있으며, 시설면적은 해당 캠핑장의 규모를 나타냅니다.
