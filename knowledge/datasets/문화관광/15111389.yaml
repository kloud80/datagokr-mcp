summary_user: 전국 문화여가 시설을 한 곳씩 담은 건별 데이터로, 시설명·분류(카테고리1~3)·주소·위도·경도와 함께 반려동물 동반 가능 여부, 입장 가능 동물 크기, 제한사항, 추가 요금, 운영시간·휴무일·주차 정보를 담는다(CSV 약 30MB). 반려인이 '우리 동네에서 중형견과 함께 들어갈 수 있는 실내 문화시설이 어디인가'를 찾거나, 분석가가 지역별 반려동물 동반 가능 시설 분포를 볼 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 시도·시군구·법정읍면동 명칭, 도로명·지번주소, 위도·경도를 맞춰 이어 쓴다.
description_portal: 본 데이터는 문화여가 시설의 반려동물 전용 정보 및 반려동물 동반 가능 여부 등 상세 정보를 포함하고 있습니다.각 시설의 운영 정책은 시간이 지나며 변경될 수 있으므로, 데이터 내 ‘최종작성일’ 컬럼을 기준으로 정보를 확인해주시기 바랍니다.* 해당 데이터는 2022년에 최초 구축되었으며, 이후 2025년 3월 일부 시설정보가 보완되었습니다.* 사람에 의해 직접 입력, 구축, 검수된 데이터로, 일부 항목에 오류(휴먼에러)가 존재할 수 있습니다.오류가 발견될 경우, 신고해주시면 확인 후 수정 및 재업로드하겠습니다.
