description_portal: '- 데이터 기간: 2022. 1 ~ 2026. 5- 제공 데이터 : 공연명, 공연시작일, 공연종료일, 공연일, 거래일, 공간명, 좌석명, 홈페이지링크- 데이터 내용: 예술의전당은 장애인 관람객을 위해 다양한 편의시설과 서비스를 제공하고 있습니다. 장애인석은 이러한 관람 편의를 위해 마련된 특별한 좌석으로, 공연 관람 시 장애인 관객의 이동성과 접근성을 고려하여 설계되었습니다. 예술의전당 장애인석 예매 내역 데이터를 통해  공연일 기준 며칠 전에 예매가 이루어졌는지 분석하여, 장애인 관객의 예매 패턴을 파악할 수 있습니다. 또한 장애인 문화접근권 증진을 위한 분석 자료로 활용될 수 있습니다.'
