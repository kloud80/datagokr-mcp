description_portal: ‘한국학중앙연구원_장서각 소장 의궤 수록 반차도 복식 목록’ 데이터는 조선시대 국가 의례를 시각적으로 기록한 의궤 반차도에 등장하는 인물들이 착용한 복식 정보를 정리한 자료입니다. 이 데이터는 복식ID, 복식명(한글), 복식명(한자), 등록일, 수정일 항목으로 구성되어 있으며, 조선시대 문무백관과 의식 참여자들이 착용한 의복의 명칭을 한글과 한자로 병기하여 제공합니다.이 자료를 통해 조선시대 예복, 관복, 군복, 평복 등 다양한 복식의 종류와 명칭을 확인할 수 있으며, 복식의 시각자료(반차도)와 텍스트 정보(복식명)를 연계하여 해석하는 데 유용합니다.의복의 체계, 사회적 위계, 직책별 복식 특징 등을 분석할 수 있어, 한국 복식사 연구, 전통문화 콘텐츠 개발, 디지털 인문학 분석 등 다양한 분야에서 활용될 수 있는 메타데이터입니다.
