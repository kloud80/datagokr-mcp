summary_user: 국가유산청이 제공하는 국가무형유산 현황을 종목 한 건 단위로 담고, 지정일자·지정번호·유산명·시대·분류·소재지·좌표(XCRD, YCRD) 같은 항목이 있으며 범위는 전국입니다. 특정 지역에 어떤 국가무형유산이 언제 지정됐는지, 분류별로 몇 종목인지 확인하려는 연구자나 문화관광 기획자가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 유산명·지정번호 같은 이름·코드 매핑으로만 잇는다.
description_portal: 행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국가유산청에서 제공하고 있는 국가무형유산 현황 정보입니다.
