summary_user: 경상북도가 지정한 관광지를 한 곳당 한 행으로 정리한 파일(CSV, 약 2.7KB)로, 구분·관광지명·위치·면적·지정일·사업기간·공공/민자 재원 규모를 담는다. 정책 담당자나 연구자가 '도내 지정 관광지는 어디이고, 언제 지정돼 공공과 민간 재원이 각각 얼마나 들어갔나'를 확인하는 데 쓴다. 전역 조인 키가 없으므로 TourAPI 관광지 정보 등 다른 데이터와는 관광지명이나 위치 문구를 맞춰서만 연결한다.
description_portal: 경상북도 관광지 현황 자료는 「관광진흥법」 제2조에 따른 관광지의 개념과 지정 기준을 바탕으로, 도내에 조성된 관광자원의 관리 현황을 정리한 자료입니다. 관광지란 자연적 또는 문화적 관광자원을 갖추고 관광객을 위한 기본적인 편의시설을 설치하는 지역을 의미하며, 이러한 요건을 충족하고 관광 및 휴식에 적합하다고 판단되는 지역을 시·도지사가 관광지로 지정하게 됩니다. 본 자료는 이러한 기준에 따라 지정된 관광지의 구분, 명칭, 위치, 면적, 지정일, 사업기간, 재원 구성 등 기본 정보를 연도별로 정리하여 제공하는 현황 자료입니다. 또한 관광지, 관광단지, 관광특구와 관련된 자료는 관광산업 및 관련 산업의 계획 수립과 정책 연구를 위한 기초 자료로 활용될 수 있도록 관리되고 있으며, 본 자료 역시 관광자원 개발 현황 파악과 행정 업무 참고를 위한 기초 자료로 활용하기 위한 목적으로 제공됩니다. 자료 관련 문의는 054-880-3184로 하시기 바랍니다.
