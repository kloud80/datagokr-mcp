description_portal: "이 데이터는 한국 전통문화유산에 나타나는 다양한 문양의 형태, 유래, 상징적 의미를 체계적으로 정리한 전통문양 상징사전입니다.문양 이름과 유산명은 한국공예·디자인문화진흥원이 운영하는 전통문화포털(https://www.kculture.or.kr/)의 전통문양 데이터를 기반으로 하였으며, 각 문양별 상세 링크가 제공됩니다.이 데이터는 국가유산진흥원에서 <초거대AI 확산 생태계 조성사업>을 통해 생성한 산출물로, 전통문화포털의 전통문양 데이터를 기반으로 하였으며 문양의 구체적 설명 및 상징 의미는 국가유산진흥원에서 추가하였습니다.수록 문양은 인물문, 동물문, 식물문, 문자문 등 유형별로 분류되어 있으며, 각 항목은 유물명, 문양 설명, 상징 의미, 재질, 출처 링크 등을 포함합니다.이 데이터는 전통문화 해석, 디자인 활용, 교육 콘텐츠 개발 등 다양한 분야에서 활용이 가능합니다.※ 본 데이터는 한국문화정보원의 '문화포털' 전통문양 데이터를 원천으로 하여, 전통문화포털(한국공예·디자인문화진흥원)의 전통문양 데이터를 참조하여 생성하였습니다.- 문화포털: https://www.culture.go.kr/- 전통문화포털: https://www.kculture.or.kr/"
