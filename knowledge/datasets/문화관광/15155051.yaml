summary_user: 전국 지자체가 관리하는 썰매장업 인허가 정보를 업소 단위로 취합한 데이터로, 전체 524건에 인허가일자·영업상태·사업장명·소재지 주소·좌표 등을 담고 기간은 1988-12-10부터 2026-09-23까지다. 겨울철 눈썰매장이 지금 영업 중인지, 어느 지역에 있는지 찾는 국민이나 민간 체육시설 개폐업 흐름을 보려는 분석가가 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 주소 키로 삼아 상권·지도 등 다른 주소 기반 데이터와 이어 쓴다.
description_portal: '생활_썰매장업 데이터는 눈 위에서 썰매나 그 비슷한 기구를 이용하여 눈썰매 놀이를 할 수 있도록 시설을 갖춘 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준으로, 전국 지방자치단체에서 관리하는 썰매장업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 스포츠산업과 / 044-203-3156 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
