summary_user: 울산 동구 대왕암공원 캠핑장 예약 시스템에서 실제로 결제된 건을 한 줄씩 담은 건별 원천 파일로, 결제시간·결제수단·상품명·결제금액으로 구성된다. 캠핑장 운영 담당자나 분석가가 "어느 달·분기에 어떤 상품이 얼마나 팔렸고 결제수단은 무엇이 많은가" 같은 수익·이용 추이를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상품명(사이트 이름) 매핑이나 같은 기관(울산 동구) 기준으로만 이어 붙인다.
description_portal: 본 데이터는 울산광역시 동구에서 운영하는 대왕암공원 캠핑장의 예약 시스템을 통해 발생한 실제 결제 내역 정보를 수록한 자료이다. 결제시간, 결제수단, 상품명, 결제금액  등 핵심 항목으로 구성되며, 예약 완료 이후 실제 결제가 이루어진 사례를 기반으로 한다. 본 데이터는 캠핑장 운영 수익 분석, 결제 수단별 이용 통계, 월별·분기별 수익 추이 분석 등 다양한 행정 업무에 활용 가능하다. 또한, 이용 시기와 유형별 데이터를 통해 수요 예측, 자원 배분, 요금 정책 개선 등 운영 효율화를 지원하며, 마케팅 전략 수립에도 기초 자료로 활용할 수 있다. 체계적으로 수집된 결제 기록은 공공시설 운영의 투명성과 재정 건전성 확보에 기여한다.
