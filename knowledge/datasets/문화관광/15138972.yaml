description_portal: 국가유산청 무형유산국 조사연구기록과에서 운영하는 무형유산 <책마루>입니다.2024년도 신규도서 데이터를 공유하오니 활용하여주시기 바랍니다.이와 관련하여, 자세한 내용은 책마루 홈페이지(https://library.nihc.go.kr/) 또는 유선전화(063-280-1578)을 이용하여 주시기 바랍니다.감사합니다.국가유산청_무형유산 책마루 신규도서 목록은 무형문화유산의 보존·전승을 위한 전문 지식과 교육 콘텐츠를 담은 최신 간행물들을 선정·소개한 디지털 도서 목록으로, 전통공연예술, 민속·제례·기술 문화 등 다양한 무형유산 분야를 아우릅니다. 이 목록은 각 도서의 제목, 저자, 출판사, 출간일, 서지정보, 핵심 주제 및 요약, 대상 독자층(연구자, 교육자, 일반 대중 등)을 명시하여, 연구와 교육 목적에 적합한 도서를 쉽게 찾아 활용할 수 있도록 구성되어 있습니다. 특히 신간 도서들은 무형유산 관련 이론적 접근, 현장 발굴 사례, 기록 및 디지털화 기법, 교육·체험 프로그램 설계 등 실무적·학술적 내용을 균형 있게 담고 있어, 무형유산 연구자, 전승교육사, 교사, 문화기획자, 일반 독자 등 다양한 이용자를 위한 실질적 자료로서 중요한 기능을 합니다. 또한 온라인 플랫폼인 '책마루'와 연계되어 도서 검색, 예약, 열람, 관련 연구 자료 접근이 용이하며, 무형문화유산의 학습 및 전승 역량 강화에 기여하는 핵심 디지털 정보 인프라로 활용될 수 있습니다.
