summary_user: 한전원자력연료(주)가 사내에서 보유·관리하는 도서를 한 권(등록번호)당 한 행으로 담은 목록 파일로, 서명·저자·발행처·발행연도·기타 유의사항을 담는다(CSV 약 1.3MB). 원자력 연료·기술 분야 전문 도서를 찾는 연구자나 공공기관 사내 도서관 장서 구성을 비교하려는 분석가가 '이 기관이 어떤 주제·연도의 도서를 갖추고 있는가'를 확인하는 데 쓴다. ISBN이나 도서관코드 같은 전역 조인 키가 없어 다른 도서관·국가서지 데이터와는 서명·저자·발행처 이름을 맞춰서만 이어 쓴다.
