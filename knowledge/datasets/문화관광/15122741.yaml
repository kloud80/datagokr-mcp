summary_user: 수원월드컵경기장에서 열린 축구 경기를 경기 한 건 단위로 기록한 원천 자료로, 경기일자·요일·시작시간·장소·리그 구분·경기명(수원삼성 대 상대팀)·결과·관람객수·예매방법·경기 전후 셔틀버스 노선과 시간을 담는다. 경기장 운영자나 분석가가 "어떤 리그·요일·시간대 경기에 관중이 많이 드는가"를 보거나, 교통 담당자가 경기 전후 셔틀버스 운영 계획을 세울 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 경기일자나 팀명 같은 이름 매핑으로만 연결한다.
description_portal: 이 데이터는 경기도 수원월드컵경기장에서 진행된 축구 경기의 운영 현황을 기록한 자료로, 경기일자, 요일, 경기 시작시간, 리그명, 경기명, 결과, 관람객수, 예매방법, 셔틀버스 운행 여부 등의 항목으로 구성되어 있습니다. 특히 경기명은 홈팀인 수원삼성과 상대팀 간의 경기 매치를 나타내며, 관람객수는 경기당 입장한 관중 수를 명시하고 있어 관중 동향 분석이 가능합니다. 예매방법은 인터파크 예매사이트 및 전화번호를 통해 사전 예약 가능하며, 셔틀버스는 일부 경기에서 미운행으로 표시됩니다. 또한 티켓의 현장 구매는 경기 시작 2시간 전부터 경기장 매표소에서 가능하며, 주차장은 경기 시작 3시간 전부터 3,000원을 선불로 납부 후 이용할 수 있습니다. 이 자료는 경기장 운영 분석, 관람객 통계 분석, 교통운영계획 수립, 이벤트 기획 등 다양한 분야에서 활용할 수 있습니다.
