summary_user: 울산시설공단이 운영하는 울산시립어린이테마파크(대왕별아이누리) 안의 놀이기구를 기구 한 개씩 담은 소규모 파일(csv 약 1.4KB)로, 기구 위치·기구명·개수·이용 가능 인원·운영 시작(허가)일·검사 번호·기준일자를 담는다. 아이와 방문하려는 시민이 어떤 놀이기구가 있고 한 번에 몇 명이 탈 수 있는지 확인하거나, 분석가가 공공 어린이 놀이시설의 안전검사 이력을 살필 때 쓴다. 실측 조인 키는 시설명(uicf_facility_nm) 하나뿐이어서 같은 시설명을 쓰는 다른 시설 데이터와만 이어 쓸 수 있고, 행정구역 코드나 좌표는 없다.
description_portal: 울산시설공단은 어린이를 위한 안전하고 즐거운 놀이 공간을 제공하기 위해 운영 중인 대왕별아이누리 시설 내 놀이시설에 대한 현황 정보를 체계적으로 관리하고 있으며, 관련 데이터를 시민들에게 제공합니다. 이 데이터는 놀이기구가 설치된 정확한 놀이기구 위치, 각 놀이시설의 명칭을 나타내는 놀이기구명, 놀이시설의 개수, 한 번에 이용할 수 있는 이용 가능 인원수, 놀이시설이 정식으로 운영을 시작한 운영 시작(허가) 일, 안전성과 관련된 검사 번호, 시설의 최신 상태를 반영하는 기준일자, 그리고 해당 놀이시설이 속한 시설명 등 다양한 항목으로 구성되어 있습니다.
