summary_user: 전라남도 시군별 관광지를 한 곳씩 담은 건별 목록으로, 관광명·소개·3단계 분류·주소·위경도·연락처·주차·요금·이미지 파일 URL을 시도 범위에서 개별 지점 단위로 제공한다. 여행자나 여행 앱 개발자가 '특정 시군에 어떤 관광지가 있고 주차·요금은 어떤가'를 확인하거나 지도에 관광지를 표시할 때 쓴다. 전역 조인 키는 없어 관광지명·주소 매칭이나 위경도 기반 공간 결합으로 TourAPI 관광지·축제·숙박 데이터와 이어 쓰며, 고유 코드(tourInfoId)는 이 기관 데이터 안에서만 통한다.
description_portal: '- 입력 파라미터를 이용하여 전라남도 시군별 관광 정보를 조회할 수 있는 서비스로 관광명, 관광지 소개, 주소 등의 항목을 제공합니다.- 전라남도(전남)는 자연경관, 역사, 문화, 미식 등 다양한 매력을 지닌 여행지로, 여름철에도 시원하고 다채로운 여행을 즐길 수 있습니다.- 교통: 전남 지역은 대중교통이 제한적일 수 있으므로, 렌터카를 이용하시는 것을 추천합니다.- 숙박 예약: 여름철에는 관광객이 많아 숙박 시설이 빠르게 마감될 수 있으므로, 미리 예약하시는 것이 좋습니다.- 체험 예약: 일부 체험 프로그램은 사전 예약이 필요할 수 있으므로, 방문 전에 확인하시기 바랍니다.- 전남은 자연과 문화, 미식을 동시에 즐길 수 있는 매력적인 여행지입니다.'
team:
  dept: 정책기획관실
services:
  - op: /getTourInfoList
    name: 남도여행길잡이 시군별 관광 정보 목록
    endpoint: https://apis.data.go.kr/6460000/jnTourInfo/getTourInfoList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: startPage
        required: false
        desc: 시작 페이지
      - name: pageSize
        required: false
        desc: 페이지 크기
      - name: tourArea
        required: false
        desc: 시군별 지역 검색
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getTourImgList
    name: 남도여행길잡이 시군별 관광 정보 이미지 목록
    endpoint: https://apis.data.go.kr/6460000/jnTourInfo/getTourImgList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: startPage
        required: false
        example: '1'
        desc: 시작 페이지 (default:1)
      - name: pageSize
        required: false
        example: '10'
        desc: 페이지 크기 (default:10)
      - name: tourInfoId
        required: true
        example: '0000007976'
        desc: 고유 코드 (시군별 관광 정보 목록의 tourInfoId)
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
