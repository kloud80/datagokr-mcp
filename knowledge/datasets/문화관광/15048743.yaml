summary_user: 인천광역시 공동주택 단지 안에 있는 체육시설을 시설(POI) 한 건씩 담은 파일로, 정식 명칭·화면 표기 명칭, 군구, 법정동·행정동 코드와 이름, X·Y 좌표, 출처를 담는다. 시민이 이사 갈 아파트 단지에 운동시설이 있는지 미리 확인하거나, 분석가가 군구·동별로 공동주택 체육시설 분포를 비교하는 데 쓴다. 실측상 전역 조인 키는 없어서, 법정동·행정동 코드나 군구명으로 동 단위 인구·주택 통계와 맞추거나 좌표로 공원 체육시설 등 다른 위치 데이터와 겹쳐 보는 방식으로 이어 쓴다.
description_portal: 시민공모 당선작 아이디어로 시민들의 건강 증진을 위한 공원 내 체육시설, 경기장, 산책로 및 등산로, 공공주택 내 체육시설의 정보 입니다.이 자료는 지자체가 공동주택 내 주민 공동 시설의 설치 및 운영 현황을 파악하여 관리 실태를 점검하고, 주민 편의 시설 확충 정책을 수립하는 데 활용됩니다. 또한, 시민들에게는 특정 공동주택의 부대시설 현황을 미리 파악할 수 있도록 정보를 제공하여 주거 선택 및 삶의 질 비교에 참고 자료로 사용될 수 있습니다.인천시 공동주택 주거 환경 개선 및 주민 복리 증진을 위한 핵심 정보입니다.
