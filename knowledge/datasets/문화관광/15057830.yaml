summary_user: 경기도 내 인터넷 컴퓨터게임 시설제공업(PC방) 사업장별 인허가 현황을 건별로 담으며, 사업장명·인허가일자·영업상태·폐업일자, 지번·도로명 주소와 위경도 좌표, 시설면적·층수·총 게임기 수·제공 게임물명 등을 포함한다. 지역 주민이나 분석가가 "우리 시군에 영업 중인 PC방은 어디에 몇 곳이고 게임기는 몇 대인가" 같은 질문에 답하거나 청소년 보호·안전 점검 대상 파악에 쓴다. 전역 조인 키는 없어 시군코드(SIGUN_CD)·시군명으로 같은 경기도 데이터와 묶거나, 주소·위경도 좌표로 다른 공간 데이터와 위치 기준으로 겹쳐 쓴다.
description_portal: 이 데이터는 경기도 내 인터넷 컴퓨터게임 시설제공업체의 인허가 현황을 정리한 자료로, 일반적으로 PC방으로 불리는 업종의 행정 정보를 담고 있습니다. 주요 항목은 사업장명, 인허가일자 및 취소일자, 영업상태, 폐업일자, 소재지 주소 및 전화번호, 우편번호, 위도·경도 좌표, 건물 용도와 층수, 시설면적, 통로너비, 조명·음향·방음·소방 등 안전설비 여부, 총 게임기 수, 제공 게임물명, 문화체육업종명, 업태구분명 등이 포함됩니다. 이를 통해 지역별 PC방 분포, 시설 현황, 영업상태, 안전 기준 준수 여부를 분석할 수 있으며, 청소년 보호정책, 문화산업 연구, 공공안전 점검 및 지도 자료로 활용 가능합니다. Open API를 통해 XML·JSON 형태로 제공되며, 시군명과 시군코드 조건 검색으로 특정 지역 데이터를 확인할 수 있습니다.
