summary_user: 공단이 운영하는 광산·거창·제천·정선·영광 에콜리안 골프장의 입장일자별 입장인원을 골프장(사업장)별로 담고, 9홀 미만(hole9_cnt)과 10홀 이상(hole10_cnt) 이용 인원을 나눠 제공한다. 공공 골프장 운영 분석가나 이용자가 "특정 에콜리안 골프장에 요일·계절별로 몇 명이 입장하는가"를 확인해 수요 추이나 혼잡 시기를 파악하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 골프장 이름(site_nm)이나 같은 기관 코드로 맞춰 이어야 하며, 체육시설업 등록 명부 등과 연결할 때도 이름 매핑이 필요하다.
description_portal: 에콜리안 골프장 입장인원은 서울올림픽기념국민체육진흥공단에서 운영중인 광산, 거창, 제천, 정선, 영광 에콜리안 골프장의 홀별 입장인원 현황 데이터입니다. 운영 중인 골프장명과 입장일자를 조회조건으로 해당 골프장에 입장한 인원을 조회할 수 있습니다.사업장별 골프장이름, 홀별 인원수(9홀 미만,10홀 이상), 입장일자, 입장한 인원의 수 등의 데이터 정보를 확인 할 수 있습니다. 요약하면 국민체육진흥공단에서 운영중인 사업장별 골프장의 입장인원을 파악할 수 있습니다. 이 서비스는 사업장별 골프장 이용 현황을 분석하여 시설 운영 효율성 평가, 수요 예측, 마케팅 전략 수립 등에 활용될 수 있습니다.
