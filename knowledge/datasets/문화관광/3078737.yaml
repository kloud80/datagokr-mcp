summary_user: 부산광역시 사상구 관내에 등록된 관광숙박업소(호텔업 등)를 업소 한 곳당 한 행으로 담은 파일이며, 등록일자·업종·숙박업분류·상호·도로명 소재지·전화번호·영업상태를 포함한다(csv 434바이트의 소규모 파일). 사상구에 영업 중인 관광호텔이 어디에 있고 언제 등록됐는지 확인하려는 여행객이나, 지역 숙박 공급을 살피는 상권·관광 정책 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·도로명 주소를 맞추거나 같은 사상구·부산시의 숙박업·관광사업 현황과 이름 기준으로 연결해 쓴다.
limits: 등록번호·사업자번호 같은 공통 키가 없어 다른 기관 데이터와 정확히 매칭하기 어렵고, 주소 문자열 대조에 의존해야 한다. 범위가 사상구 한 곳뿐이라 부산 전체나 다른 시군구 비교에는 다른 구 파일을 함께 모아야 한다.
