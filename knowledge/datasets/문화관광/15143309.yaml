summary_user: 전라남도 지역 전시관을 한 곳씩 담은 시설 단위 목록으로, 전시관 명칭·주소·전화번호·경도/위도 좌표와 이용요금 여부·주차장·주차요금·홈페이지·간략개요·이미지 파일 URL을 함께 제공한다. 전남을 여행하는 사람이 '이 근처에 주차가 되고 무료로 들어갈 수 있는 전시관이 어디 있나'를 찾거나, 분석가가 전남 내 전시·문화시설의 지역 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어 문화기반시설총람 시설코드나 KOPIS 식별자와 바로 이어지지 않으며, 전시관명·주소 매칭이나 좌표(경도·위도) 기반 공간 결합, 같은 기관의 남도여행길잡이 다른 정보와 기관 내부 코드(지역코드)로 연결해 쓴다.
description_portal: '- 입력 파라미터를 이용하여 전라남도 전시관 정보를 조회할 수 있는 서비스로 전시관의 이미지, 주소, 연락처, 주차 등의 항목을 제공합니다.- 전라남도(전남)는 자연경관, 역사, 문화, 미식 등 다양한 매력을 지닌 여행지로, 여름철에도 시원하고 다채로운 여행을 즐길 수 있습니다. - 교통: 전남 지역은 대중교통이 제한적일 수 있으므로, 렌터카를 이용하시는 것을 추천합니다. - 숙박 예약: 여름철에는 관광객이 많아 숙박 시설이 빠르게 마감될 수 있으므로, 미리 예약하시는 것이 좋습니다. - 체험 예약: 일부 체험 프로그램은 사전 예약이 필요할 수 있으므로, 방문 전에 확인하시기 바랍니다. - 전남은 자연과 문화, 미식을 동시에 즐길 수 있는 매력적인 여행지입니다.'
team:
  dept: 정책기획관실
services:
