        desc: 시작 페이지
      - name: pageSize
        required: false
        desc: 페이지 크기
      - name: exhibitionNm
        required: false
        desc: 전시관 명칭 검색
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
  - op: /getExhibitionImgList
    name: 남도여행길잡이 전시관 이미지 목록
    endpoint: https://apis.data.go.kr/6460000/jnExhibitionInfo/getExhibitionImgList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: startPage
        required: false
        example: '1'
        desc: 시작 페이지
      - name: pageSize
        required: false
        example: '10'
        desc: 페이지 크기
      - name: exhibitionId
        required: true
        example: '0000000312'
        desc: 고유 코드 (전시관 목록의 exhibitionId)
    approval: auto
    traffic:
      dev: 1000
    format:
      - xml
    error_style: http200_body_code
    verified_ok: true
