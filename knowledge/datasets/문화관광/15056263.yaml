summary_user: 제주특별자치도에 등록된 국가유산수리업(옛 문화재수리업) 업체를 업체 한 곳당 한 행으로 담은 목록 파일로, 세부구분·상호·데이터기준일자를 담는다(CSV 약 1.5KB의 소규모 파일). 제주 지역에서 문화유산 보수·복원 공사를 맡길 수리업체를 찾거나, 도내 등록 수리업체가 업종별로 몇 곳인지 확인하려는 발주 담당자·사업자가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상호명이나 업종 구분 이름으로만 맞춰 이어 쓸 수 있고, 국가유산 지정 목록의 종목코드·지정번호나 소재지 PNU와는 직접 연결되지 않는다.
description_portal: '제주특별자치도에 등록된 국가유산수리업(문화재수리업) 데이터를 제공합니다.항목: 구분, 상호명, 연락처 등*국가의 유산인 문화재를 원형으로 보존하고 계승하기 위하여 관리함*원형보존에 따른 고도의 지식과 기술이 요구되므로 그에 따른 기술이 필요함*지정문화유산 및 천연기념물과 주위 시설물 조경 등에 대하여 보수ㆍ복원ㆍ정비 및 손상 방지와 관련된 조치를 수행함자세한 사항은 제주도청 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/open/open/iopenboard.htm?category=1495'
