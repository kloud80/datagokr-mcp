summary_user: 경기도가 운영하는 경기공유텃밭의 텃밭별 분양 정보를 담은 데이터로, 텃밭명·주소·지역코드와 함께 모집구좌, 개인·단체 분양면적, 분양요금, 요금유형(무료·유료·미정), 선별방법, 신청기간 등을 한 행에 기록하며 범위는 경기도(시도 단위)다. 도시민이 "우리 동네 근처에 무료로 분양하는 텃밭이 있고 신청은 언제까지인가"를 확인하거나, 지자체·분석가가 시군별 분양 구좌와 요금 수준을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키가 확인되지 않아 다른 데이터와는 지역코드(region_cd)나 주소·기관명 같은 이름·코드 매핑으로만 이어 쓴다.
description_portal: 경기도에서 운영하는 경기공유텃밭 분양 정보를 제공하는 데이터입니다. 이 데이터는 고유번호, 상위기관, 지역코드, 텃밭명, 주소, 모집구좌, 분양면적, 분양요금, 요금유형, 선별방법, 사용기간, 결과발표일, 신청기간 등의 항목으로 구성되어 있습니다. 경기공유텃밭은 도시민이 직접 농업을 체험하고 공동체 기반의 생활문화를 확산하기 위해 운영되며, 데이터에는 각 텃밭의 위치와 분양 조건이 기록되어 있습니다. 특히 요금유형은 무료(F), 유료(P), 미정(U)로 구분되어 분양비용 여부를 확인할 수 있습니다. 이를 통해 시민들은 자신에게 적합한 텃밭을 선택할 수 있고, 지자체는 분양 수요를 효율적으로 관리할 수 있습니다.
