summary_user: 서울특별시 마포구에서 인허가를 받은 비디오물제작업체를 업소 한 곳당 한 행으로 담은 인허가 원천 목록이며, 상호명, 인허가·취소·폐업 일자, 영업상태, 지번·도로명 주소, 좌표, 시설면적 등이 들어 있다. 마포구에서 지금 영업 중인 등록 비디오물제작업체가 어디인지, 특정 업체가 정식 등록됐는지와 언제 폐업했는지를 확인하려는 시민·유통사·분석가가 쓴다. 전역 조인 키는 없어서 다른 데이터와는 상호명·주소를 맞추거나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 마포구에서 인허가를 받은 비디오물제작업체에 대한 정보입니다. 이 데이터에는 사업체의 행정 구역 정보(예: 시도명, 시군구명, 행정동명), 도로명 주소, 상호명, 대표자 이름, 인허가(등록) 일자, 등록 번호, 업소 상태(영업, 폐업, 휴업 등), 업종 유형, 관리 기관 정보가 포함되어 있습니다. 비디오물제작업은 영상 콘텐츠(예: 영화, 다큐멘터리, 교육자료 등)를 제작하여 유통, 배급, 상영, 판매 등의 목적으로 활용할 수 있도록 정식 인허가를 받은 사업체를 의미합니다. 해당 데이터는 시민, 제작자, 유통사, 감독기관 등이 합법적이고 등록된 영상물 제작업체를 확인하고, 저작권 보호 및 콘텐츠 유통의 투명성을 확보하는 데 활용됩니다.'
