summary_user: BIGKinds 뉴스 데이터베이스의 사회면 기사에서 월별로 가장 많이 나온 명사를 순위·키워드·빈도수로 정리한 집계 파일로, 포털 설명상 104개 신문·방송사 기사를 대상으로 하며 전국·비공간 범위를 다룬다. 연구자나 기자가 '특정 시기 사회 뉴스에서 어떤 키워드가 두드러졌나'를 확인하거나 사회 의제의 흐름을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 키워드 문자열을 직접 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 공공데이터입니다. 104개 주요 신문과 방송사에서 제공한 기사 텍스트를 대상으로 사회면 보도를 분석하여, 월별로 가장 많이 등장한 명사 200개를 추출하고 순위와 빈도를 함께 제공합니다. 이를 통해 특정 시기 사회 뉴스에서 어떤 이슈와 키워드가 두드러졌는지 파악할 수 있으며, 언론 보도의 경향 분석, 사회 의제 탐색, 연구 및 교육 자료로 활용할 수 있습니다. 특히 빅데이터 분석 기법을 활용한 언론 메타데이터 자료라는 점에서, 정책 연구자, 학계, 저널리스트뿐 아니라 일반 이용자에게도 의미 있는 참고 자료가 될 수 있습니다.
