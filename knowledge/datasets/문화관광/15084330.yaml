summary_user: 2002년 한일 공동 개최 제17회 FIFA 월드컵의 유치부터 사후 평가까지를 다룬 국가기록원 소장 기록물 214건을 건별로 정리한 목록으로, 기록물 구분·기록물명·생산년도·생산기관·원문보기 경로를 담는다. 체육행정이나 스포츠 기록물을 연구하는 사람이 '2002 월드컵 준비 과정에서 어느 기관이 언제 어떤 문서를 만들었나'를 찾고 원문으로 바로 가는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 생산기관 이름이나 생산년도를 맞춰 붙이는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 2002년 한일 공동 개최로 열린 제17회 FIFA 월드컵과 관련된 다양한 기록물을 주제별로 정리한 콘텐츠 데이터베이스입니다. 월드컵 유치, 준비, 개최, 사후 평가까지의 전 과정을 담은 문서기록물, 간행물, 시청각기록물, 행정박물 등 총 214건의 기록을 선별하여 수록하였으며, 국민에게 긍정의 상징으로 남은 월드컵의 역사적 의미와 행정적 과정이 고스란히 담겨 있습니다. 체육행정 및 스포츠 기록물 연구, 콘텐츠 기획, 기록교육 등의 목적으로 활용될 수 있는 1회성 파일 데이터입니다.
