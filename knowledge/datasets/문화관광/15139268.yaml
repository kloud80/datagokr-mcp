summary_user: 강화자연사박물관 상설전시 가운데 스마트 박물관 안내 앱으로 상호작용하는 전시 표본을 표본 한 점당 한 행으로 담고, 연번·표본명·설명 문구로 구성된 작은 CSV 파일(약 21KB)이다. 박물관 안내 콘텐츠를 만들거나 전시 표본 해설 문구를 교육·관광 자료로 다시 쓰려는 사람이 "강화자연사박물관에 어떤 표본이 전시되어 있고 어떻게 설명되나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키나 시설코드가 없어 다른 데이터와는 박물관 이름이나 강화군 기관 단위로만 맞춰 이어 쓸 수 있다.
description_portal: '강화자연사박물관 전시 중 앱(APP)으로 상호작용을 할 수 있는 전시 표본 정보이며 연번, 표본명, 설명문구 정보가 포함되어 있습니다.해당 데이터는 예방적품질관리 차원에서 공공데이터포털에 개방되었습니다.앱 구축 당시에 발생하여 1회성으로 개방하는 데이터이므로 정기적 갱신이나 현행화를 진행하지 않습니다.관련 앱: 스마트 박물관 안내 앱자연사박물관 상설전시 주요 전시표본에 대한 AR 기술을 도입한 안내 서비스를 제공합니다. 위치 기반의 70점의 전시표본 안내와 게임형 서비스를 국문/영/중/일어 4개국어로 무료 다운로드하거나 현장에서 디바이스를 무료로 사용할 수 있습니다.○ 제공부서 : 국가유산과'
