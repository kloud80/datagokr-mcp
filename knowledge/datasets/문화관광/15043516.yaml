summary_user: 제주데이터허브가 제공하는 제주시 한림읍 말 테마공원 더마파크 한 곳의 무장애여행 정보로, 위도·경도·해발고도 같은 위치값과 장소 설명·이미지를 담는다. 휠체어 이용자나 교통약자 가족이 '더마파크를 휠체어로 돌아볼 수 있나, 위치가 어디인가'를 확인하거나, 무장애 관광 지도·안내 서비스에 지점을 올리는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 TourAPI 관광지 등 다른 데이터와는 장소명 매핑이나 위도·경도 근접 비교로만 연결한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 더마파크 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 더마파크는 제주 제주시 한림읍에 위치한 세계 최초 말 전문 테마공원으로, 승마 체험, 기마공연, 카트 체험, 동물 체험 등 다양한 관광 콘텐츠를 제공한다. 이 데이터셋은 해당 장소의 위치정보, 명칭, 설명, 이미지 등을 포함하며, 장애인 전용 주차구역, 장애인 화장실, 경사로, 휠체어 접근로, 장애인 관람석 등 무장애 관광지로서의 접근성 정보를 담고 있어 교통약자나 휠체어 이용자도 이용 가능하다. 관광 안내, 지도 서비스, 무장애 관광지 홍보, 열린관광지 조성, 관광 정책 수립, 접근성 기반 관광 인프라 개발 등 공공 및 관광 분야에서 기초자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
