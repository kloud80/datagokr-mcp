summary_user: 경기도 포천시 안의 게임제공업소를 업소 한 곳씩 담은 파일로, 상호·도로명 및 지번 소재지·업종명(일반게임, 청소년게임)을 담는다. 주민이나 사업자가 포천시에 있는 청소년게임장·일반게임장이 어디에 있고 몇 곳인지 확인할 때 쓴다. 공통 조인 키가 없어 다른 데이터와는 상호명이나 주소를 맞춰 붙이거나, 주소를 지오코딩해 지도·상권 자료와 겹쳐 쓴다.
limits: 실측 컬럼에 업소 고유번호 같은 전역 조인 키가 없어 인허가 원천 데이터 등과 정확히 일대일로 연결하기 어렵다. 범위가 포천시 한 곳에 한정돼 다른 시군과 비교하려면 각 시군 파일을 따로 모아야 한다.
