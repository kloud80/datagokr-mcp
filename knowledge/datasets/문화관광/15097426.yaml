summary_user: 제주 중문단지축구장과 대포연대 인근의 음식점·카페·편의점·숙박시설·관광지 등 주변 시설을 시설 한 곳당 한 행으로 담고, 명칭·거리(km)·주소·전화번호·휠체어 진입 여부·장애인 화장실 제공 여부를 함께 적은 목록이다. 휠체어 이용자나 노약자·영유아 동반 가족이 '대포연대 근처에서 휠체어로 들어갈 수 있고 장애인 화장실이 있는 식당이나 숙소가 어디인가'를 확인하거나, 무장애 관광 지도를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 시설 명칭·주소를 맞춰 보는 방식으로만 이어 쓸 수 있다.
description_portal: '제주특별자치도 내 중문단지축구장과대포연대_무장애주변관광지 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도 중문단지축구장과 대포연대 인근에서 장애인, 노약자, 영유아 동반 가족 등을 위한 무장애 여행이 가능한 주변 관광시설 정보를 체계적으로 정리한 통계자료입니다. 본 자료에는 음식점, 카페 및 편의점, 숙박시설, 관광지 등 다양한 유형의 지역 시설들의 명칭, 거리, 주소, 전화번호, 휠체어 진입 가능 여부 및 장애인화장실 제공 여부 등이 포함되어 있어 접근이 제약된 여행자의 방문 여건을 객관적으로 확인할 수 있습니다. 또한 이 정보를 통해 무장애 관광 지도 제작, 관광서비스 접근성 개선, 관광정책 수립 및 평가 등에 활용할 수 있는 기초자료로 제공됩니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
