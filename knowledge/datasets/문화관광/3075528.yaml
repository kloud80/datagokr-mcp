summary_user: 남원시에 등록(신고)된 PC방·오락실 등 게임제공업소를 업소 한 곳당 한 행으로 담은 건별 목록으로, 등록일자·상호·도로명 소재지·대표자 성명·시설면적·업종명·게임기 수를 담는다(파일 약 2KB 규모). 남원시에서 어느 동네에 어떤 업종의 게임업소가 얼마나 큰 규모로 영업 중인지 확인하려는 주민·창업 예정자·지역 정책 담당자가 쓴다. 전역 조인 키가 없어 다른 데이터와는 도로명 주소나 상호 문자열 매칭, 또는 같은 시군구 단위로만 이어 쓴다.
description_portal: 1. 데이터 주요 내용 및 목적본 데이터는 전북특별자치도 남원시에 등록된 게임제공업소들의 상세 현황을 종합적으로 담고 있습니다. 피시방과 오락실 등 게임을 제공하는 다양한 영업장의 기본 정보, 시설 규모, 보유 게임기 수량 등을 포함하여 지역 게임산업의 전반적인 상황을 심층적으로 파악할 수 있도록 구성되었습니다. 이 데이터는 게임물관리위원회의 엄격한 관리 기준에 따라 합법적으로 등록된 업소들의 정보를 제공하며, 청소년 보호 및 건전한 게임문화 조성을 위한 행정관리의 핵심 자료로 활용됩니다. 더불어 가상현실, 증강현실 등 첨단 기술을 활용한 게임업소의 분포 현황을 확인함으로써 지역 게임산업 정책 수립을 위한 중요한 기초 자료로 기능합니다.2. 데이터 항목명- 등록(신고)일자- 상호- 영업소재지(도로명)- 성명- 시설면적- 단위- 업종명- 게임기수3. 기대 효과이 데이터를 통해 게임제공업소에 대한 투명하고 체계적인 관리가 가능해지며, 청소년 보호구역 설정 및 건전한 게임문화 조성을 위한 실효성 있는 정책 수립에 실질적으로 기여할 수 있습니다. 또한 지역 게임산업의 심층적인 현황 분석을 바탕으로 targeted 정책 개발과 업계의 자율규제 강화에도 meaningful한 도움을 제공할 수 있습니다.
