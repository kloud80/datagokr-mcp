summary_user: 부산관광포털 비짓부산의 미식투어로 추천된 부산 식당·카페 등 음식 업소를 업소 한 곳 단위로 담으며, 이름·주소·구군·좌표·전화·홈페이지·대표메뉴·이용 요일과 시간·상세 소개를 포함한다. 부산을 찾는 관광객이나 여행 앱 개발자가 '해운대구에서 대표메뉴와 영업시간이 확인되는 추천 맛집은 어디인가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 구군명(GUGUN_NM)·업소명 매핑이나 위경도 좌표 근접 매칭으로만 잇는다.
description_portal: 부산관광포털 비짓부산 내 추천여행 중 미식투어에 대한 정보를 제공하는 서비스 입니다.부산의 식당, 카페 등 음식관련 업소 중 맛과 가격 등 추천할 수 있는 업소의 정보를 제공 하고 있으며미식투어 업소정보 와 그에 따른 상세정보로 구성된 데이터 입니다.미식투어의 이름, 주소, 홈페이지, 전화번호, 좌표, 상세정보를 제공하고 있으며주변관광지, 여행사진, 리뷰도 함께  제공합니다.다국적 관광객을 위해 한국어, 영어, 일어, 중간체, 중번체 5개국어로 서비스 합니다.더 상세한 정보는 부산관광포털 비짓부산에서 확인 하실 수 있습니다.
