description_portal: 작은도서관 추천도서 목록 데이터는 작은도서관과 공공도서관 등에서 선정한 추천도서·북큐레이션 도서 등을 모아 정리한 목록으로, 관련 기관의 추천도서 정보를 통합한 데이터입니다. 작은도서관 홈페이지는 전국 작은도서관 정보와 추천도서·프로그램 정보를 통합 제공하는 온라인 플랫폼으로, 이용자와 작은도서관을 연결하는 창구 역할을 합니다다. 이 데이터는 작은도서관 포털 및 관련 기관에서 제공하는 추천도서 정보를 한 번에 활용할 수 있도록 각 도서에 대해 제목, 부제목, 지은이, 출판사, 출판년도의 기본 서지 정보를 표준화된 형식으로 제공하며, 이를 바탕으로 작은도서관 및 공공도서관의 장서 개발과 신규 도서 선정, 연령별·주제별 독서프로그램 기획, 이용자 대상 추천도서 서비스 고도화에 활용할 수 있습니다.
