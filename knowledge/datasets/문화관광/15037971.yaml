summary_user: 인천 계양구 관내 게임 관련 업소를 업소 한 곳당 한 행으로 담은 목록 파일(CSV, 약 17KB)로, 상호·도로명/지번 소재지·업종명·게임기 수·데이터기준일을 담는다. 구민이나 청소년 보호·유해환경 담당자가 '계양구 어느 동네에 PC방·게임장이 몰려 있고 게임기는 몇 대씩인가'를 확인하는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 소재지 주소를 주소 정제·좌표 변환한 뒤 맞추거나 상호명으로 대조해 이어 쓴다.
description_portal: 이 데이터파일은 인천광역시 계양구 관내에서 운영 중인 게임 관련업소의 현황을 정리한 자료입니다. 주요 항목으로는 업소의 고유 식별번호인 연번, 업소의 공식 명칭인 상호명, 도로명 주소와 지번 주소로 구분된 영업소의 소재지, 업소의 일반 전화번호, 업종의 세부 유형을 나타내는 업종명, 그리고 업소 내 설치된 게임기기의 수를 의미하는 게임기수가 포함되어 있습니다. 다만, 개인정보 보호를 위해 핸드폰 번호는 공개되지 않습니다. 본 자료는 계양구 내 게임 관련 산업의 분포 및 현황을 파악하고, 청소년 보호 및 유해환경 관리, 산업 지원 정책 수립 등의 목적으로 활용될 수 있는 기초 데이터를 제공합니다. 또한 지역 내 게임시설을 찾는 이용자에게도 유용한 정보로 제공됩니다.
