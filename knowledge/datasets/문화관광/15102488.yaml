summary_user: 인천 부평구 공원 안에 조성된 운동경기장을 시설(공원)별로 한 행씩 담은 소규모 현황 파일(csv 약 3KB)로, 시설명·소재지 주소와 축구장·농구장·족구장 등 경기장 규모를 담는다. 부평구 주민이 집 근처 공원에 족구장이나 농구장이 있는지 찾거나, 구 담당자·분석가가 동네별 공원 체육시설 분포와 확충 대상을 검토할 때 쓴다. 전역 조인 키가 없어 다른 체육시설·공원 데이터와는 시설명이나 소재지 주소를 맞춰 연결해야 한다.
