description_portal: 한국관광공사 관광통계를 기반으로 전국 기준 연령별 외국인 방문객 현황을 제공하는 자료이다. 방문객의 거주 대륙별(아시아주, 미주, 구주, 대양주, 아프리카 등) 및 연령대별(0~9세, 10~19세, 20~29세, 30~39세 등) 방문객 수를 연도별로 집계하여 제공한다. 이를 통해 방한 외국인의 연령 구조와 지역별·대륙별 방문 특성을 파악할 수 있으며, 관광정책 수립, 관광상품 개발, 외국인 관광객 유치 전략 수립, 관광산업 동향 분석, 연령별 소비행태 연구 및 국제관광 시장 분석을 위한 기초자료로 활용할 수 있다. 또한 특정 국가권역 및 연령층의 관광 수요 변화를 시계열로 분석하는 데 유용한 통계자료이다.
