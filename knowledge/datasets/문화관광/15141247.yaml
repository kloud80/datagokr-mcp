summary_user: 서울 금천구의 체육도장업 사업장을 한 곳씩 담은 인허가 명부로, 인허가·취소·폐업 일자, 영업상태, 사업장명, 지번·도로명 주소, 좌표, 지도자 수, 회원 모집 인원, 보험 가입 여부 등을 담는다. 창업 예정자나 상권 분석가가 '금천구 안 태권도·합기도 도장이 어디에 몰려 있고 최근 얼마나 문을 열고 닫았나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 관리번호(MGTNO)·사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 체육시설업·상권 명부와 같은 축에서 비교하는 용도에 맞다.
description_portal: 체육도장업 인허가 정보는 인허가일자, 영업상태, 사업장명, 주소, 전화번호 등 기본 항목은 물론 지도자 수, 회원 모집 인원, 보험 가입 여부와 같은 세부 항목까지 포함된 데이터입니다. 또한 위치 좌표, 업종 구분, 건축물 정보 등이 함께 제공되어 공간 분석에도 활용할 수 있습니다. 이 데이터를 통해 지역 내 체육도장업의 분포와 운영 현황을 체계적으로 파악할 수 있으며, 신규 창업을 위한 입지 선정, 정책 수립, 안전관리 체계 강화 등 다양한 행정적·연구적 목적으로 활용이 가능합니다. 더 나아가 체육 인프라 분석, 생활체육 활성화, 지역사회 건강 증진, 체육 정책 연구 등에도 중요한 기초 자료가 되며, 공공기관과 연구자, 시민 모두에게 유용하게 쓰일 수 있는 공공 데이터입니다.
