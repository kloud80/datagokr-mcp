summary_user: 경기도 화성시에 있는 국가·도 지정문화재를 한 건씩 담은 목록 파일로, 구분·국가유산명·지정번호·위치·소유자·지정일을 문화재별 한 행으로 정리한다(csv 약 11KB). 화성시 안에 어떤 지정문화재가 어디에 있고 언제 지정됐는지 확인하려는 주민·연구자·관광 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 자료와는 국가유산명·지정번호를 이름·번호 매핑으로 맞춰 이어 쓴다.
description_portal: 데이터는 경기도 화성시에 소재한 지정문화재의 현황을 체계적으로 정리한 자료이다. 항목에는 문화재의 구분, 국가유산명, 지정번호, 소재지 위치, 소유자 정보, 문화재 지정일 등이 포함된다. 국가 또는 지방자치단체가 법령에 따라 지정한 유형문화재, 기념물, 사적 등 다양한 문화유산의 정보를 제공하며, 각 항목은 문화재별로 세분화되어 있다. 본 자료는 문화유산의 보존·관리 및 행정업무 수행을 위한 기초자료로 활용 가능하며, 학술연구, 정책 수립, 관광자원 분석 등의 목적으로도 활용될 수 있다. 1회성 데이터로 현행화 필요시 요청이 필요하다.
