description_portal: 경상남도 함양군 관내 소재 공공체육시설 현황 및 2023년도 이용현황 자료로 연번, 체육시설명, 소재지도로명주소, 소재지지번주소, 2023년1월 ~ 2023년12월이용건수, 기관연락처, 데이터기준일자로 구성되어 있습니다.국민의 체육활동 참여 현황을 투명하게 공개하여 정책 수립과 시설 운영 개선에 활용하는 데 목적을 두고 있으며 이를 통해 지자체는 이용 패턴을 분석해 효율적인 시설 배치와 예산 집행을 추진할 수 있으며, 군민은 가까운 체육시설을 손쉽게 파악해 생활체육 참여 기회를 확대할 수 있다. 또한 연구기관과 기업은 데이터를 기반으로 건강 증진 프로그램 개발, 스포츠 산업 활성화 등에 활용할 수 있어 국민 건강 증진과 지역사회 활력 제고에 기여할 수 있습니다.
