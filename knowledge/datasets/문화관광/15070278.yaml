summary_user: 경기도 군포시 관내 도서관이 운영하는 독서문화프로그램·인문학 강좌 등 문화행사를 행사 한 건씩 담은 파일 데이터로, 행사명·시작/종료일자·접수 기간·대상·장소·비용·강사·정원을 기록한다. 군포 시민이나 학부모가 "이번 달 우리 동네 도서관에서 아이가 참여할 수 있는 무료 독서 프로그램이 있나, 접수는 언제까지인가"를 확인하거나, 분석가가 도서관별 행사 운영 현황을 파악하는 데 쓴다. 도서관코드나 행사 식별자 같은 전역 조인 키가 없어서, 다른 데이터와는 장소(도서관 이름) 문자열을 도서관 목록 데이터의 도서관명에 맞춰 매핑하는 방식으로만 이어 쓴다.
description_portal: 경기도 군포시 관내 도서관에서 운영하는 문화행사 정보를 포함하고 있으며, 독서 진흥과 시민의 문화 향유를 목적으로 기획된 다양한 독서문화프로그램과 인문학 중심의 도서관 행사와 독서문화진흥 행사를 담고 있습니다. 주요 항목으로는 행사명, 시작일자, 종료일자, 접수 시작·종료일시, 대상 연령, 행사 장소, 참가 비용, 강사 정보, 정원 등을 포함합니다. 본 데이터는 독서문화 확산과 평생학습 지원을 위한 프로그램 운영 현황을 파악하고, 지역 주민에게 독서문화활동 참여 기회를 제공하기 위한 기초 자료로 활용될 수 있습니다.
