description_portal: '이 데이터는 시민의 민원서류 발급 편의를 높이기 위해 지역 내에 설치된 무인민원발급기의 운영 현황을 정리한 자료입니다. 설치 장소명, 도로명 주소 및 지번 주소, 서류별 발급 가능 여부(예: 주민등록 등·초본, 가족관계등록부, 등기부등본), 운영 시간 등의 항목으로 구성되어 있습니다. 행정복지센터, 도서관, 금융기관, 마트 등 생활 거점 중심으로 설치되어 있으며, 대부분 오전 7시부터 저녁 10시까지 운영됩니다. 본 자료는 생활행정 접근성 분석, 행정 무인화 확대 전략, 취약지역 우선 설치계획 수립 등 시민 중심의 스마트 민원행정 정책 수립에 활용하실 수 있습니다.'
