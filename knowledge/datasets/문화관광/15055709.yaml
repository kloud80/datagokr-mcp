description_portal: 이 데이터는 2006년부터 2014년까지 전북특별자치도 내 공공 체육시설의 수를 연도별로 집계한 통계 자료입니다. 매년 도내에 있는 체육시설의 총 개소수와 함께, 육상경기장, 축구장, 테니스장, 체육관, 수영장, 국궁장 등 20여 종이 넘는 세부 시설 유형별로 나누어 그 수를 상세히 보여줍니다. 이 자료를 통해 지역의 생활 체육 인프라가 시간이 지남에 따라 어떻게 확충되고 변화했는지 명확하게 파악할 수 있습니다. 이는 지역 주민의 건강 증진과 여가 활동 지원을 위한 체육 정책을 수립하고, 시설의 균형 있는 공급을 계획하는 데 중요한 기초 데이터가 됩니다.
