summary_user: 전북특별자치도 내 공공 체육시설 수를 연도별로 집계한 통계로, 2006~2014년 각 해의 총 개소수와 육상경기장·축구장·테니스장·체육관·수영장·국궁장 등 20여 개 시설 유형별 개수를 담은 작은 CSV 파일(885 bytes)이다. 지역 체육 정책 분석가나 연구자가 '2000년대 후반 이후 전북의 체육관·수영장 같은 생활체육 인프라가 몇 곳에서 몇 곳으로 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 시도나 전국 체육시설 통계와는 연도(구분)와 시설 유형 이름을 맞춰 비교하는 방식으로만 이어 쓴다.
limits: 시도 단위 집계표라 개별 시설의 위치·이름이나 시군별 분포는 알 수 없고, 예약·대관 정보도 없다. 조인 키가 없어 다른 데이터와는 이름·연도 매핑으로만 연결된다. 포털 설명상 2014년까지만 담고 있어 이후 변화는 이 파일로 볼 수 없다.
