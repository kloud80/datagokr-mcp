description_portal: 공공미술 보유현황 데이터는 지역 내 설치된 공공미술 작품의 보유 및 전시 현황을 체계적으로 정리한 자료입니다. 데이터에는 **작품명과 보유 장소(강변공원 핑크뮬리 조성단지, 친환경생태공원, 사명대사공원, 오봉저수지, 부항댐 짚와이어 인근 등)**의 정보가 포함되어 있습니다. 이를 통해 시민은 생활권 내에서 감상할 수 있는 공공예술 자산의 위치와 현황을 쉽게 확인할 수 있으며, 관광객은 문화·여가 활동과 연계된 방문 계획을 세울 수 있습니다. 행정기관은 해당 데이터를 기반으로 공공미술 관리, 유지·보수 계획 수립, 문화관광 정책 연계를 효율적으로 추진할 수 있습니다. 또한 연구자와 예술 관련 단체는 이 데이터를 활용해 지역별 공공미술 분포 분석, 문화 자원 활용 전략, 예술 정책 연구 등에 응용할 수 있습니다. 궁극적으로 이 데이터는 시민 문화 향유권 확대, 지역 문화 브랜드 강화, 도시 경관 가치 제고에 기여하는 중요한 공공데이터입니다.
