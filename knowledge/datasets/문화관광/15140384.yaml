description_portal: 본데이터는 연천군시설관리공단이 관리하는 어린이놀이시설과 물놀이형 놀이시설의 현황을 정리한 자료이다. 시설명, 소재지, 우편정보와 함께 설치된 놀이기구 구성내역을 포함하여 보호자와 주민이 시설의 기본상태를 이해할 수 있도록 구성하였다. 또한 설치검사, 정기시설검사 등 안전검사 관련 정보를 포함하여 이용 전 안전확인에 활용할 수 있다. 어린이 놀이시설은 안전사고예방이 핵심이므로 본데이터는 시설관리현황을 투명하게 공개하고 안전관리수준을 제고하는 목적이 있다. 아울러 시설정비 계획수립과 안전점검관리와 민원대응의 근거자료로 활용가능하며 지역아동친화 환경조성정책에도 기초정보로 사용될 수 있다.
