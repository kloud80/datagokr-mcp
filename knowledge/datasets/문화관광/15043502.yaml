summary_user: 제주 여미지식물원 안의 무장애여행 지점별 위치(위도·경도·해발고도)와 장소 설명·이미지 정보를 지점 단위로 담은 원천 목록이다. 휠체어 이용자나 노약자 동반 여행자가 식물원 안 어느 지점이 접근 가능한지, 동선을 어떻게 잡을지 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 장소 이름 매핑이나 좌표 근접으로만 연결한다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 여미지식물원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 여미지식물원은 다양한 식물 전시구역과 온실, 산책로로 구성되어 있으며, 장애인·노약자 등 교통약자를 위한 무장애 접근 환경을 제공한다. 주요 시설별 위치 정보, 이동 동선, 편의시설 배치, 주차 및 진입 접근성 등을 포함하여 이용자의 이동 편의를 높이기 위한 세부 정보를 제공한다. 본 데이터는 공공기관 기준에 따라 수집된 지점별 시설 정보, 편의시설 현황, 보조기기 이용 가능 여부 등으로 구성되어 있으며 무장애 관광지 접근성을 객관적으로 확인할 수 있는 자료로 활용된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
