summary_user: 대한민국예술원이 보유한 사진 자료를 한 건씩 담은 원천 목록으로, 작품명·작가·등록일·주제분류·키워드·내용 설명·관련 장소와 시기·인물·권리 정보·썸네일 주소 등을 담는다. 예술 연구자나 전시·교육 자료를 만드는 사람이 '특정 예술원 회원이나 행사와 관련된 사진이 어떤 것이 있고 저작권 조건은 어떤가'를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작가명·인물명 같은 이름 매칭이나 같은 기관(한국문화정보원 api.kcisa.kr) 제공 데이터끼리만 이어 쓴다.
description_portal: 대한민국예술원에서 제공하는 사진갤러리 데이터는 작품명, 작품분류, 작가명, 등록일, 소속, 주제분류, 키워드, 크기, 재생시간, 내용, 관련장소, 시간적 범위, 인물, 언어, 썸네일 이미지, 권리, 저작권, 위치정보, 기여자 등 다양한 정보를 포함하고 있습니다. 예술 작품의 상세 정보와 관련 자료를 한눈에 파악할 수 있어 예술 연구, 전시 기획, 교육 자료 제작 등 다양한 분야에서 활용이 가능합니다. 사진과 관련된 메타데이터를 체계적으로 제공하여 예술계 종사자뿐만 아니라 일반 국민도 예술 자원을 쉽게 접근하고 활용할 수 있도록 지원합니다.
