description_portal: 울산광역시 북구 관광지 방문자수 현황입니다.포함된 정보는 구분(관광지위치), 측정연도, 측정월, 방문자 수, 비고(특이사항), 데이터기준일자 입니다. 현재 울산 북구 관광지로는 강동산하해변, 강동사랑길 2구간, 편백산림욕장, 박상진호수공원, 달천철장이 있습니다. 관광지 주변으로 상권활성화를 위한 정책에 활용할 수 있으며, 관련 업종에 종사하거나 종사할 계획이 있으신 분들께도 활용가치가 있는 자료입니다.*계수기 위치중 산하해변입구(몽돌쉼터앞)가 26년 5월부터 강동해안공원으로 명칭이 변경되었습니다. 추가적으로 궁금한 사항은 관광진흥과(관광지 담당), 미디어정보과(공공데이터 담당)에게 문의 바랍니다.
