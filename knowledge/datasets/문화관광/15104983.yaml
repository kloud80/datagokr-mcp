summary_user: 한국정책방송원이 제공하는 사회·문화 분야 정책뉴스를 기사 단위로 담으며, 제목·작성자·등록일·주제 분류와 키워드·본문 설명·저작권 정보 같은 메타데이터를 전국 범위의 비공간 정보로 제공한다. 개발자나 분석가가 정부의 사회·문화 정책이 언제 어떤 주제로 보도됐는지 모으거나 키워드별로 정책 소식을 정리하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 주제 키워드나 등록일(regDate) 같은 이름·날짜 매칭으로만 이어 쓴다.
