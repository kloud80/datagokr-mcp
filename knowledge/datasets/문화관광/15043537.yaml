summary_user: 제주 조천읍 선흘리의 테마공원 '선녀와나무꾼' 한 곳에 대한 무장애여행 정보로, 지점별 위도·경도·해발고도와 장소 설명·이미지 정보를 담는다. 휠체어 이용자나 교통약자 동반 여행자가 이곳의 장애인 주차장, 무턱 출입구, 장애인 화장실 같은 접근 시설 위치를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 TourAPI 관광지 정보 등과는 장소 이름이나 좌표로 맞춰 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 선녀와나무꾼 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다.* 이 데이터셋은 제주 조천읍 선흘리에 위치한 ‘선녀와나무꾼’ 테마공원에 대한 무장애 여행 정보를 제공한다. 이곳은 과거 50~80년대 골목, 학교, 영화관, 달동네, 장터 등 옛 시절의 생활상을 실내에 재현한 복합 테마공원으로, 교통약자 및 휠체어 이용자를 위해 장애인 전용 주차장, 무턱 출입구, 평탄한 내부 동선, 장애인 화장실, 휠체어 및 유모차 대여 시설 등이 갖춰져 있다. 실내 중심의 전시·체험 공간이 많아 날씨에 구애받지 않고 관람 가능하며, 연령대와 상관없이 옛 기억을 공유하거나 새 경험을 쌓을 수 있는 열린 관광지로서, 무장애 관광 인프라 구축과 관광 서비스 접근성 향상, 정책 설계의 기초자료가 된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
