summary_user: 빅카인즈 뉴스 데이터베이스에서 어린이 관련 기사를 골라 기사 한 건마다 일자·언론사·제목·통합 분류·키워드·특성추출어를 담은 기사 단위 메타정보 파일로, 전국 범위 비공간 자료이며 CSV 한 개(약 27MB)로 받는다. 연구자나 아동 정책 담당자가 '아동 학대·보육·통학 안전 같은 어린이 쟁점이 시기별로 언론에서 얼마나, 어떤 말로 보도됐나'를 키워드 빈도와 보도 추이로 살필 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자나 키워드·언론사 이름을 맞춰 붙여야 하며, 같은 재단의 다른 주제 뉴스 메타데이터와는 같은 컬럼 구조를 기준으로 나란히 비교한다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 어린이 관련 뉴스 메타정보 자료입니다. 어린이는 사회의 미래 자원으로, 복지·교육·안전·건강 등 다양한 영역에서 정책적 보호와 지원이 필요합니다. 본 자료는 국내 주요 신문과 방송 보도에서 어린이와 관련된 기사들을 분석하여 주요 키워드와 빈도를 도출하고, 시기별 보도 경향과 사회적 쟁점의 변화를 살펴볼 수 있도록 구성되었습니다. 이를 통해 아동 학대 방지, 보육 및 교육 정책, 교통·생활 안전, 건강 관리, 권리 보장과 같은 주제가 언론에서 어떻게 다루어졌는지를 객관적으로 확인할 수 있습니다. 또한 학술 연구, 아동 정책 수립, 교육 및 언론 연구 현장에서 활용 가능한 기초 자료로서, 어린이의 권익 증진과 안전한 성장 환경 조성을 위한 사회적 합의 형성에 기여할 수 있습니다.
