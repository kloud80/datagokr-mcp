description_portal: '서울특별시 중구의 공연을 주된 목적으로 설치하여 운영하는 업소 정보를 제공합니다. 각 등록업체에 부여된 관리번호, 현재의 운영 상태(등록, 폐업 등), 상세 소재지, 좌석수 정보, 시설기준 준수 여부, 그리고 안전관리 관련 현황 등의 주요 항목들로 구성되어 있습니다. 이 자료는 문화예술 분야의 예술활동을 계획하는 기획자 및 예술가에게는 중구 지역의 예술공간 분포 및 시설기준 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 안전관리 기준을 충족하며 문화예술 예술활동이 이루어지는 문화시설의 위치와 좌석수 등의 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
