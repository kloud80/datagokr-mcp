summary_user: 서울올림픽기념국민체육진흥공단이 2020년부터 선정한 올해의 우수 스포츠기업을 기업 한 곳당 한 행으로 담은 파일로, 선정연도·기업명·대표자·대표번호·주소·홈페이지·주요사업을 기록하고 범위는 전국이다. 스포츠산업 분석가나 사업자가 '최근 몇 년간 우수 스포츠기업으로 뽑힌 곳은 어디이고 주로 어떤 사업을 하는가'를 확인하거나 협력 업체 후보를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 기업명이나 주소로 직접 맞춰 연결해야 한다.
limits: 사업자등록번호 같은 공통 키가 없어 기업 재무·지원사업 데이터와 정확히 매칭하기 어렵다. 이 데이터셋은 스포츠 산업 영역이라 체육 분야 핵심 범위(시설·생활체육·전문체육)에서 제외된 보조 등급으로 분류되어 있다.
