description_portal: 본 데이터는 국립공원공단이 국민 건강 증진을 위해 운영 중인 ‘건강나누리캠프’ 참여 프로그램에 대한 정보를 CSV 형식으로 제공하는 자료입니다. 경주, 계룡산, 한려해상, 내장산, 덕유산 등 총 11개 국립공원에서 시행되는 프로그램을 포함하고 있으며, 각 프로그램의 운영 지역, 대상 인원, 참여 조건, 주요 활동 내용, 운영 시기, 접수 방식 등의 항목으로 구성되어 있습니다. 본 데이터는 건강과 자연을 연계한 치유·체험 프로그램으로 활용도가 높아 공공기관의 건강증진 정책 기획, 복지 관련 프로그램 설계, 시민 대상 안내 자료 제작 등에 유용하게 활용될 수 있습니다. 데이터는 표준화된 항목으로 구성되어 있어 분석 및 재활용이 용이합니다.
