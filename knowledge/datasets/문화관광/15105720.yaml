description_portal: 본 데이터는 한국관광공사에서 제공하는 한국관광통계로 한국어 및 영어로 제공됩니다. 2023년 7월 기준으로 작성되었으며 방한 외국인 월별 전체국가통계 및 주요국가통계, 통계월보(성별, 목적별, 연령별, 교통수단별, 승무원), 국민 해외여행 월별 통계 자료가 포함되어 시계열성을 가진 관광통계 비교분석이 가능합니다. 방한 외국인 통계의 경우, 출발국별 또는 대륙별로 수치를 확인할 수 있어 보다 세부적인 관광 동향 분석 및 예측에 활용할 수 있습니다. 최신 수치는 한국관광 데이터랩(https://datalab.visitkorea.or.kr/)에서 추가로 확인할 수 있습니다.
