summary_user: 부천시 한국만화박물관의 2025년 분기별 입장객 현황을 이용대상별로 총계·내국인·외국인으로 나눠 담은 집계 파일(197바이트 CSV)이다. 박물관 방문 수요가 분기마다 어떻게 달라지는지, 외국인 관람객 비중이 얼마인지 보려는 관광·문화 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지나 다른 관광 통계와는 시설명·지역명을 손으로 맞춰서만 이어 쓴다.
description_portal: 경기도 부천시내에 소재한  한국만화박물관의 입장객 정보로 2025년도 분기별 입장객 현황자료 데이터를 공개합니다.(내국인 및 외국인 별로 구분)한국만화박물관은 10~18시까지 운영되며 매주 월요일 및 1월 1일, 설날 및 추석 연휴에 휴관하며 관람료는 부천시민 19세 이하는 무료 입장, 20세 이상은 2,500원이며 그 외 관외 시민 대상으로는 5,000원이고4인 가족권 및 3인 가족권도 별도로 관람료가 구성되어 있습니다. 추가 문의사항은 한국만화박물관 인포데스크(032-310-3090~1)에 문의부탁드립니다.
