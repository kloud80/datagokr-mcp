description_portal: '예술의전당 아카데미 강좌 현황 - 관련 데이터 : 아카데미명, 학기명, 강좌명, 시작일, 종료일, 시작시간, 종료시간, 등록일- 데이터 기간 : 2009.11~2026.5- 데이터 설명: 예술의전당 예술강좌는 예술에 대한 대중의 이해와 향유를 넓히기 위해 기획된 교육 프로그램으로, 음악, 미술, 서예, 인문 등 다채로운 분야를 아우르며 기초 입문부터 전문 심화 과정까지 체계적으로 구성되어 있습니다. 수강신청 및 강좌상세 내용은 예술의전당 홈페이지의 아카데이 페이지(https://www.sac.or.kr/site/main/academy/academy_main)에서 확인이 가능합니다.예술의전당_아카데미 강좌 데이터를 통해 예술의전당이 지금까지 운영해온 예술강좌 이력을 확인하실 수 있습니다.'
