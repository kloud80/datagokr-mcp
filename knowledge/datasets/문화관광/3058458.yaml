summary_user: 예술의전당 아카데미가 2009년 11월부터 2026년 5월까지 운영한 예술강좌를 강좌 한 건씩 담은 파일로, 아카데미명·학기명·강좌명과 강좌 시작·종료 일자 및 시간, 등록일을 담는다. 문화예술 교육 분석가나 수강 희망자가 예술의전당이 학기별로 어떤 분야의 강좌를 언제, 얼마나 열어 왔는지 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 공연·문화시설 데이터와는 강좌명·아카데미명 같은 이름을 맞추거나 같은 기관 기준으로만 연결한다.
