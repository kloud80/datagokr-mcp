summary_user: 한국저작권위원회가 정리한 2012년 상반기 저작권 창작 분야 전국 집계 통계로, 저작권 등록(저작물·저작인접물 종류별, 신청인 유형·신청 방법별), 분야별 창작 인력, 창작 환경 조사, 공연 실적, 건축물 미술작품 건수를 표 형태 파일(zip)로 담는다. 연구자나 정책 분석가가 '2012년 상반기 어떤 저작물 종류의 등록이 많았고 창작 인력은 분야별로 어떻게 분포했나'를 확인할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 저작물 종류·장르 이름을 맞추는 방식으로만 이어 쓴다.
limits: 2012년 상반기 한 시점의 전국 단위 집계라 지역별 비교나 건별 등록 내역 조회에는 쓰지 못한다. 파일 첫 행 외 열 이름이 비어 있어(Unnamed) 표 구조를 직접 읽어 해석해야 하며, 공식 코드 기반 조인은 불가하다.
