description_portal: '평택시 한 책 도서선정 현황 데이터는 평택시 대표 홈페이지 DB 데이터로서 시민이 함께 읽을 대표도서를 선정하고, 독서토론·작가초청·연계 프로그램 등 다양한 독서문화 활동의 운영 실태를 체계적으로 파악하기 위해 수집된 자료입니다. 해당 데이터를 공공데이터로 개방함으로써 시민은 선정도서 등의 정보를 보다 쉽게 확인할 수 있으며, 민간·연구기관은 독서문화 참여 패턴 분석, 세대별 독서 선호 파악, 독서 관련 서비스 개발 등 다양한 분야에서 활용할 수 있습니다. 공개되는 데이터에는 선정된 도서의 도서선정번호, 도서제목, 프로그램 번호 등의 항목이 포함되어 있어 지역 독서공동체의 활성화 정도를 객관적으로 이해할 수 있습니다. 이러한 정보는 독서문화 확산, 공공도서관 프로그램 고도화, 독서친화적 도시 조성을 위한 정책 설계에도 중요한 기반 자료가 됩니다.이 데이터는 실제와 다소 차이가 발생할 수 있으며, 본 데이터는 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시청 안중도서관(031-8024-8337)※ 홈페이지 URL : https://www.ptlib.go.kr/onebook/quizList.do'
