summary_user: 전국 국가민속문화유산별 현장 안내판 문안을 한 행씩 담은 파일(약 13.7KB CSV)로, 종목·관리번호, 유산명, 소재지와 함께 한국어·영어·중국어·일본어 안내문, 폐기·공개·최종본 여부, 제출·설치일자를 담는다. 지자체 담당자나 콘텐츠 제작자가 특정 민속문화유산 안내판에 어떤 다국어 설명이 쓰였는지 확인하고 안내판·전시·온라인 해설 문안을 만들 때 쓴다. 실측 컬럼에 전역 조인 키는 없으며, 종목 및 관리번호나 유산명을 국가유산청 지정 목록·상세 API의 종목코드·지정번호와 이름·코드로 맞춰 연결한다.
description_portal: 국가유산청_국가민속문화유산 안내문안목록 데이터는 전국에 지정된 국가민속문화유산을 국민과 방문객에게 알기 쉽게 소개하기 위해 제작된 안내문 초안과 관련 자료를 체계적으로 정리한 것이다. 해당 데이터에는 각 민속문화유산의 명칭, 위치 ,한국어, 중국어, 영어, 일본어  등이 포함되어 있으며, 이를 설명하는 안내문 문안이 함께 수록되어 있어 현장에서 활용 가능한 홍보 및 교육 자료로 쓰인다. 특히 민속문화유산이 지닌 생활 문화적 맥락과 전승 가치, 지역성과 관련된 내용을 쉽게 풀어 제공함으로써 국민이 문화유산을 보다 친근하게 이해할 수 있도록 돕는다. 또한 연구자와 행정기관이 안내문 내용을 검토·활용하여 현장 안내판, 전시 자료, 온라인 콘텐츠 제작 등 다양한 활용 방안을 마련할 수 있다. 본 데이터는 국가민속문화유산의 보존과 함께 국민적 공감대 형성과 문화 향유권 확대에 기여하는 중요한 기반 자료이다.
