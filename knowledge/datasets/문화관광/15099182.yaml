description_portal: 본 데이터는 경상북도 예천군에서 추진한 공공미술 프로젝트의 현황을 수록한 공공데이터이다. 공공미술은 주민의 문화 향유 기회를 확대하고 지역의 정체성을 반영하는 예술 활동으로, 공공장소에 설치되는 조형물, 벽화, 예술작품 등을 포함한다. 본 자료에는 연번, 사업유형, 세부유형, 주관처, 작품명, 재료, 규격, 설치장소, 관리기간 등의 정보가 포함되어 있으며, 이를 통해 지역별 예술 활동 분포와 주민 참여 형태를 확인할 수 있다. 해당 데이터는 문화 정책 수립, 지역 예술인 발굴, 도시 경관 개선, 문화재생 사업 등의 기초자료로 활용되며, 주민 소통과 문화 가치 확산에 기여한다. 데이터는 예천군의 문화행정 기준에 따라 관리된다.
