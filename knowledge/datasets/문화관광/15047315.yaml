description_portal: 이 데이터는 서울시 용산여성인력개발센터가 개설하는 교육강좌 개설 및 접수가능 상태의 목록을 담고 있습니다. 강좌명, 교육내용, 수강대상, 신청가능 여부 등이 포함되어 있어, 여성 대상 역량강화·취업지원 프로그램이 어떤 형태로 운영되고 있는지 확인할 수 있게 설계되어 있습니다. 접수가 마감된 강좌는 제외되어 실제 신청 가능한 강좌 위주로 제공되므로, 수강 기회 탐색이나 교육기획 분석에 바로 활용할 수 있습니다. 또한 이 데이터를 활용하여 자치구 내 여성교육 기회 분포, 대상별 강좌 유형 분석, 교육 공급 대비 수요 격차 파악과 같은 정책 및 운영분석이 가능합니다.용산여성인력개발센터에서 실시하는 교육강좌 정보입니다. 교육신청은 http://yongsan.seoulwomen.or.kr 에서 직접 하셔야 합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://yongsan.seoulwomen.or.kr 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
