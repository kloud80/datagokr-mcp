summary_user: 광양시 관내 숙박업소를 업소 한 곳당 한 행으로 정리한 파일로, 업종(일반·생활 숙박업), 업소명, 도로명 주소, 전화, 객실수와 한실·양실 수를 담는다(CSV 약 20KB). 광양에 출장이나 여행을 가는 사람이 어느 지역에 몇 실 규모의 숙소가 있는지 찾거나, 분석가가 광양시 숙박 수용능력과 업종 구성을 파악하는 데 쓴다. 전역 조인 키는 없으므로, 공중위생 숙박업 인허가 원천(LOCALDATA) 등 다른 데이터와는 업소명·도로명 주소를 맞춰 이어 쓴다.
description_portal: '본 자료는 전라남도 광양시 관내 숙박업소의 현황 정보를 체계적으로 정리한 공공데이터로, 시민과 관광객, 기업 및 행정기관이 자유롭게 활용할 수 있도록 전 국민에게 무료로 제공됩니다.광양시는 산업단지와 관광지가 혼재한 도시로 숙박 수요가 지속적으로 발생하고 있으며, 본 데이터는 해당 지역의 숙박 인프라 분포, 객실 수용능력, 업종 다양성 등을 파악하는 데 핵심적인 기초자료로 활용됩니다.제공 항목에는 업종구분(예: 숙박업(일반), 숙박업(생활)), 업소명, 도로명 주소, 연락처, 객실수, 한실수, 양실수가 포함되어 있으며, 사용자는 이를 통해 원하는 숙박 유형의 위치 및 규모를 확인하고 직접 연락하거나 예약에 활용할 수 있습니다. 또한, 지방자치단체는 해당 데이터를 기반으로 숙박시설의 위생·안전관리, 관광 정책 수립, 숙박시설 분포 분석, 지역경제 활성화 전략 마련 등 다양한 행정업무에 활용하고 있습니다.'
