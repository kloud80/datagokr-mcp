description_portal: '대구광역시 북구 관내 문화체험학습장 현황(기관명, 프로그램안내, 전화번호, 주소, 홈페이지 등) 정보를 제공합니다.- 칠곡향교 : 칠곡향교 대성전과 명륜당(시문화유산자료)을 품은 칠곡향교는 유교아카데미 강좌 운영, 선비체험 등 전통문화에 대한 지식 습득과 체험활동이 가능함.- 구암서원 : 구암서원 숭현사(시문화유산자료)를 품은 구암서원은 매년 1만명 이상 찾는 우리나라 최고의 선비체험 프로그램을 운영중에 있으며 2025년 5월부터 매주 금요일 8시에 전통 건축물에 현대적인 기술을 적용하여 미디어아트인 "미디어파사드"공연을 하고 있으며, 구암서원 초현당에 앉으면 신천을 따라 탁 트인 북구의 도시적인 풍경이 아주 멋진 곳임.- 대고장 : 대고장 기능보유자인 김종문 선생은 대구시 무형유산으로 등록되어 있으며 "대고(大鼓)란 큰 북으로 한국 악기 중 가장 역사가 오래된 악기임.'
