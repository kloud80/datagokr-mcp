summary_user: 한국관광 데이터랩의 국민 해외관광객 수를 기준연월별로 성별·연령대·출국 공항/항구(인천공항·김포공항·김해공항·부산항구 등)로 나눠 담은 전국 단위 월별 집계 파일이며, 재외국민 출국자(교포)는 제외한다. 여행업계 분석가나 정책 담당자가 '20~30대 남성의 해외여행 출국이 어느 공항에서 어느 달에 늘었나' 같은 출국 수요 추이를 확인하는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어서, 다른 관광 통계와는 기준연월이나 공항·항구 이름을 맞춰 연결해야 한다.
description_portal: '- 본 데이터는 한국관광공사에서 운영하는 한국관광 데이터랩(datalab.visitkorea.or.kr)에서 제공하는 한국관광통계의 월별 국민 해외관광객 추이 데이터입니다.- 해당 자료에는 국민 해외관광객의 성별, 연령, 교통수단에 따른 국민 해외관광객 수 월별 추이 데이터를 포함하고 있습니다.- 국민 해외관광객에는 전체 국민 출국자 중 세계관광기구(UN Tourism) 거주지 분류 권고안에 근거하여 재외국민 출국자(교포)는 제외하고 있습니다.- 승무원은 별도의 출국절차를 밟아 출국하여 남녀 및 연령을 구분하여 기록하고 있지 않습니다.'
