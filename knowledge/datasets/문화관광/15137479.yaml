description_portal: 성북구립도서관 사람책도서관 목록 데이터는 성북문화재단에서 운영하는 ‘사람책(Human Library)’ 콘텐츠의 방송 정보와 출연진, 키워드 등을 포함한 데이터셋입니다. 사람책도서관은 특정 분야의 경험·전문성을 가진 ‘사람’을 책으로 삼아 이야기를 나누는 참여형 문화 프로그램으로, 이 데이터는 그 방송 기록을 체계적으로 정리하고 있습니다.데이터에는 방송 회차, 방송 일시, 팟캐스트 제목, 출연진 정보, 방송 장소, 웹페이지 주소, 방송 키워드 등이 포함되어 있어, 사람책 프로그램의 운영 현황을 파악하거나 지역사회 활동 사례 분석, 문화 프로그램 기획 연구 등 다양한 목적에 활용될 수 있습니다.
