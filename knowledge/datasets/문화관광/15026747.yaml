summary_user: 충청북도에 있는 향교 18곳의 이름, 소재지와 위도·경도, 문화유산 종목, 유형문화유산 지정등록일, 운영현황을 향교 한 곳당 한 행으로 담은 소규모 파일(csv, 약 2KB)이다. 도내 향교 위치를 지도에 표시하거나, 어느 향교가 언제 문화유산으로 지정됐고 지금 어떻게 운영되는지 확인하려는 지역 연구자·관광 기획자가 쓴다. 공통 조인 키(문화유산 종목코드·지정번호, 필지 고유번호 등)는 없어서, 국가유산청 지정유산 목록과는 향교명이나 소재지 주소로 맞추거나 위도·경도로 공간 결합해 이어 쓴다.
description_portal: 향교는 고려와 조선의 지방  공교육기관을 말하며, 유교교육과 선현의 위패를 모시고 제사를 지내는 역할을 수행하였으며 지방민의 교육과 교화를 담당하던 지방의 국립학교입니다.조선시대에는 나라로부터 토지와 노비, 서적 등을 지급받아 운영되었으나, 갑오개혁(1894)이후에 교육기능은 없어지고 제사기능만이 남아 옛모습을 지키고있습니다.이번 제공 자료는충청북도에 위치한 18게 향교(지방교육기관)의 현황입니다. 향교명, 소재지(위도, 경도), 종목, 유형문화유산 지정등록일, 운영현황을 제공합니다.
