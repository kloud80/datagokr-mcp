summary_user: 제주관광공사 비짓제주(VISIT JEJU)에서 이용자가 여행일정을 만들 때 수기로 입력한 장소를 한 건씩 담은 원천 목록으로, 장소명·도로명/지번주소·위도·경도·등록·수정일시를 담으며 포털 설명 기준 6,002건이다. 관광 서비스 개발자나 분석가가 '여행자들이 공식 관광지 목록 밖에서 직접 등록한 제주 장소는 어디인가'를 지도에 찍어 보는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 장소명 매칭이나 주소·좌표 근접 비교로만 이어 쓴다.
limits: TourAPI의 contentId 같은 공통 키가 없어 다른 관광 데이터와 바로 결합할 수 없고 이름·주소·좌표 매칭이 필요하다. 이용자가 수기 입력한 장소라 공식 관광지 원장으로 쓰기 어렵고, 세부 부문 안에서는 보조 등급(판정 보류)으로 분류돼 있다.
