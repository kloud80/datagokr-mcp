description_portal: 이 데이터는 서울시 여성인력개발원에서 실시하는 교육강좌의 개설 정보를 제공하고 있습니다. 각 강좌의 명칭, 신청가능 여부, 교육내용, 운영기관 및 접수조건 등이 포함되어 있으며, 수강 대상자가 어떤 강좌를 언제 신청할 수 있는지 한눈에 파악할 수 있도록 설계되어 있습니다. 또한 접수마감된 강좌 정보는 출력되지 않아 실시간 교육 가능성에 가까운 최신 정보를 담고 있습니다. 이 정보를 활용하면 여성능력개발 프로그램의 운영 현황을 분석하고, 대상별 교육 격차를 파악하거나 지역별 강좌 분포 및 참여경로를 설계하는 데 유용합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://wrd.seoulwomen.or.kr 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
