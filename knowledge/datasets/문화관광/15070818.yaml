summary_user: 부산광역시 해운대구 관내 문화체육시설을 시설 한 곳당 한 건으로 담으며, 시설명·전화번호·주소·관리기관·면적·위도·경도가 들어 있다. 해운대구 주민이나 생활체육 이용자가 '집 근처에 어떤 공공 체육시설이 있고 누가 관리하며 연락처는 무엇인가'를 찾는 데 쓴다. 전역 조인 키는 없어서, 주소나 좌표(위도·경도)로 위치를 맞추거나 시설명을 매핑해 문체부 전국체육시설 자료 등 다른 체육시설 데이터와 잇는다.
limits: 해운대구 한 개 시군구만 다루므로 부산 전체나 전국 비교에는 다른 기관 자료가 따로 필요하다. 예약·대관 정보는 이 데이터에 없으며 광역 단위 서비스에서만 다룬다. 공통 코드가 없어 다른 데이터와 연결할 때는 이름이나 주소를 맞추는 수작업이 따른다.
