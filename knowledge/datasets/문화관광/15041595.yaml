summary_user: 광화문 대중문화예술 공연장 CKL스테이지의 좌석을 층·좌석이름·좌석번호·상태·사용 여부·수정일자 단위로 담은 건별 좌석 관리 파일(csv, 약 536KB)이다. 공연장 운영자나 예약 시스템 개발자가 "이 공연장 몇 층에 어떤 좌석이 있고 현재 사용 가능한 좌석은 몇 석인가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 공연·시설 데이터와는 공연장 이름 매핑이나 같은 기관(한국콘텐츠진흥원) 기준으로만 연결한다.
description_portal: 한국콘텐츠진흥원이 운영하는 광화문에 위치한 대중문화예술 공연 전용 공연장 CKL스테이지의 좌석정보에 대한 데이터입니다. 이 데이터는 좌석 현황 정보 및 확장 정보를 포함하고 있습니다.  이를 통해 공연 관람에 필요한 좌석의 현황을 파악할 수 있습니다. 이 데이터는 공연장 좌석 관리 및 외부 공연 예약 시스템을 효율적으로 운영하는 데 유용할 수 있으며, 관객의 편의를 증진시키는 데 도움을 줄 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 현황_좌석일련번호(숫자형), 현황_좌석사용플래그(문자형), 현황_수정일자(문자형), 사용자_일련번호(숫자형), 사용자_등록일(문자형), 사용자_수정일(문자형), 사용자_사용플래그(문자형), 좌석정보_일련번호(숫자형), 좌석정보_층(숫자형), 좌석정보_이름(문자형), 좌석정보_좌석번호(숫자형), 좌석정보_상태플래그(문자형), 좌석정보_정렬번호(숫자형), 확장_일련번호(숫자형), 확장_수정일(문자형), 일련번호(숫자형), 등록일자(문자형), 수정일자(문자형)로 구성되어 있습니다.
