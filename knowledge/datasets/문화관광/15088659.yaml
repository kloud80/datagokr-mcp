summary_user: 부산도서관이 제공하는 부산광역시 산하 도서관과 교육청 도서관의 신착 도서를 책 한 권(소장 자료) 단위로 담은 건별 목록으로, 표제·저자·발행자·발행년도·ISBN·가격·최초배가일자·도서관명·자료실·표지이미지 주소가 들어 있다. 부산 시민이 '우리 동네 도서관에 이번 달 새로 들어온 책이 무엇인지'를 찾아보거나, 분석가가 도서관별 신착 도서의 분야·발행년도 분포를 살피는 데 쓴다. 전역 조인 키는 없고, ISBN(isbn)으로 국가서지·도서관정보나루의 도서 정보와 맞추거나 도서관명(lib_name)을 이름으로 매핑해 도서관 목록과 잇는다.
description_portal: 부산광역시 부산도서관의 도서 신착 자료 정보(표제 사항, 발행자, 최초 배가 일자, 저자명, 입수년도, 발행년도, 권호명, 가격, 등록일자, 면장수, ISBN, 도서관명, 표지이미지 URL,  자료실명, 서지종류 등)를 제공하는  API 서비스입니다. 도서 신착 자료의 대상은 부산광역시 산하 도서관 및  교육청 도서관 도서를 포함합니다. 해당 자료는 XML, JSON, CSV, XLSX, TXT 파일로 다운로드 가능합니다. 누구든지 다운로드 가능하며 비용은 무료입니다.문의사항은 부산도서관으로 관리팀(051-310-5422)으로 연락주시기입니다.
team:
  dept: 인공지능소프트웨어과
services:
  - op: /getNewBookList
    name: 부산광역시_도서신착자료
    endpoint: https://apis.data.go.kr/6260000/NewBookListService/getNewBookList
    method: GET
    security:
      scheme: apiKey
      in: query
      name: serviceKey
      issuer: data.go.kr
    params:
      - name: numOfRows
        required: true
        example: '10'
        desc: 한 페이지 결과 수
      - name: pageNo
        required: true
        example: '1'
        desc: 페이지 번호
      - name: resultType
        required: false
        example: xml
        desc: JSON방식으로 호출 시 파라미터 resultType=json 입력
      - name: title_info
        required: false
        example: 내 마음 탐구생활
        desc: 표제사항
      - name: shelf_date
        required: false
        example: 2023/03/09
        desc: 최초배가일자
      - name: author
        required: false
        example: 꼬마곰
        desc: 저자명
      - name: lib_name
        required: false
        example: 남구도서관
        desc: 도서관명
    paging:
      page: pageNo
      size: numOfRows
      max_size: 1000
    approval: auto
    traffic:
      dev: 10000
    format:
      - json
    error_style: http200_body_code
    verified_ok: true
