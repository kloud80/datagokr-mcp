summary_user: 전국 작은도서관을 도서관별·평가년도별로 한 행씩 담은 통계 파일로, 행정구역·시군구 단위 위치와 장서수·사서수·방문자수·자료구입비(원) 같은 운영 현황을 담는다. 지자체 담당자나 분석가가 "우리 시군구 작은도서관은 장서와 자료구입비가 다른 지역보다 적은가"처럼 지역별 규모와 이용 수준을 비교하는 데 쓴다. 실측 컬럼에 도서관코드 같은 전역 조인 키가 없어서, 다른 도서관 데이터(도서관정보나루 등)와는 도서관명과 시군구 이름을 맞춰 연결해야 한다.
description_portal: 전국의 작은도서관에 대한 다양한 통계 정보를 종합적으로 제공하는 데이터셋입니다. 도서관의 평가년도, 도서관구분, 도서관명, 행정구역, 시군구 등 기본 정보와 함께 장서수, 사서수, 방문자수, 도서예산 및 자료 구입비 등 운영 현황을 상세히 담고 있습니다. 이를 통해 지역별 작은도서관의 규모와 자원, 이용 현황을 파악할 수 있으며, 도서관 정책 수립, 지역 문화 활성화, 예산 배분, 연구 및 분석 등 다양한 분야에서 활용이 가능합니다. 작은도서관의 발전 방향을 모색하거나 지역사회 문화 인프라 현황을 진단하는 데 유용하게 쓰일 수 있습니다.
