summary_user: 충청북도 11개 시군에 있는 수영장을 시설 한 곳당 한 행으로 담은 현황 파일로, 도로명·지번 주소, 전체 면적과 수영조 면적, 경기장 규격, 준공년도, 관리기관, 전화번호를 담는다. 도민이나 생활체육 이용자가 '우리 동네 가까운 공공 수영장은 어디이고 어느 기관이 관리하나'를 찾거나, 분석가가 시군별 수영장 분포와 노후도(준공년도)를 살피는 데 쓴다. 전역 조인 키는 없어 다른 체육시설·인구 데이터와는 주소(시군명)나 시설명을 매칭해서 이어 써야 한다.
description_portal: 충청북도(청주시, 충주시, 제천시, 보은군, 옥천군, 영동군, 증평군, 진천군, 괴산군, 음성군, 단양군) 내에 소재하고 있는 수영장 시설에 대한 현황 정보입니다. (시설명, 소재지, 소재지도로명주소, 소재지지번주소, 면적, 수영조면적, 경기장규격, 준공년도, 관리기관, 전화번호 등의 컬럼 정보를 제공합니다.) 수영조 면적과 경기장 규격은 빈값일 있을 수 있습니다. 해당 데이터에서 제공하는 수영장에 대한 정보는 수영장의 관리주체가 각 시청 및 군청 또는 공공기관 산하 공단, 체육회, 학교법인, 사회복지개발회 등입니다.
