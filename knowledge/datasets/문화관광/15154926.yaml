summary_user: 전국 자치단체가 관리하는 게임물배급업 인허가 정보를 업소 한 곳당 한 건으로 담은 원천 데이터로, 사업장명·인허가일자·영업상태·폐업·휴업일자·소재지 주소와 좌표를 포함한다. 게임 유통 사업을 준비하는 사업자나 분석가가 "우리 지역에 영업 중인 게임물배급업체가 몇 곳이고 언제 등록됐나"를 확인하는 데 쓴다. 전역 조인 키는 없어 사업장명·주소 매칭이나 개방자치단체코드(OPN_ATMY_GRP_CD)로 같은 기관의 다른 인허가 업종 데이터와 이어 쓴다.
description_portal: '문화_게임물배급업 데이터는 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 게임물배급업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 1인 기업의 증가로 영업장과 주거지 주소가 동일한 경우 개인정보 노출 우려가 있어, 해당 업종의 소재지 주소는 동·호수 등 상세 주소를 비식별 조치하여 제공 - 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 게임콘텐츠산업과 / 044-203-3275 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
