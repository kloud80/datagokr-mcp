summary_user: 국립한글박물관이 소장한 자료를 한 건씩 자료명·다른 이름, 발행기관·제작자, 시대(temporal), 재질, 크기, 상태, 권리, 등록일, 상세 페이지 주소 등으로 담은 소장품 목록 데이터이며 범위는 전국·비공간이다. 한글 관련 전시를 기획하거나 연구하는 사람이 '특정 시대에 간행된 한글 문헌 가운데 박물관이 가진 것과 그 보존 상태는 어떤가'를 확인하는 데 쓴다. 실측 컬럼에서 다른 데이터와 공통으로 쓰는 조인 키는 찾지 못해, 다른 박물관 소장자료와는 자료명·제작자 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 국립한글박물관이 보유한 다양한 소장자료의 상세 정보를 체계적으로 제공하여 한글과 관련된 문화유산의 연구 및 교육, 전시 기획 등에 활용할 수 있도록 지원합니다. 주요 정보로는 자원의 명칭, 발행기관, 주된 책임 개체, 지식정보자원 위치, 시간적 범위, 물리적 상태, 자원의 크기, 등록일 등이 포함되어 있습니다. 이를 통해 한글의 역사와 발전 과정을 심층적으로 탐구하거나, 문화콘텐츠 개발 및 학술 연구 자료로 활용하는 데 유용합니다. 또한, 소장자료의 상태와 권리 정보까지 확인할 수 있어 문화재 관리 및 보존 업무에도 도움이 됩니다.
