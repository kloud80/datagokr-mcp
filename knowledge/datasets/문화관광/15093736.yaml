summary_user: 빅카인즈(BIGKinds)에서 수집한 언론 관련 보도를 기사 한 건당 한 행으로 담은 CSV 파일(약 37MB)이며, 일자·언론사·제목·통합 분류·키워드·특성추출 정보를 포함한다. 연구자나 언론 현업 분석가가 '언론 자유·가짜 뉴스·언론중재 같은 주제가 시기별로 어느 언론사에서 얼마나 보도됐는가'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 언론사명이나 일자, 키워드를 기준으로 맞춰 이어 써야 한다.
limits: 실측 컬럼에서 공통 조인 키를 찾지 못했으므로 언론사 등록번호 원장 등과 바로 결합되지 않고, 이름 매핑에 의존해야 한다. 범위는 전국이고 지역 단위로 나눌 수 있는 공간 정보는 없다.
