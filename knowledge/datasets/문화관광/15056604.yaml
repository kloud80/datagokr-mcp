summary_user: 경기도 내 공공 테니스장을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군명·시설명·소유기관·관리주체·준공연도·바닥재·면적·코트 면수·관람석·건설사업비·주소와 위경도를 포함한다. 생활체육 이용자가 우리 시군의 공공 테니스장 위치와 코트 바닥재를 확인하거나, 분석가가 시군별 테니스 인프라 규모와 노후도를 비교하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없어서, 시군명·시설명 같은 이름이나 도로명·지번주소, 위경도(refine_wgs84_lat·logt)를 맞춰 다른 체육시설 현황이나 지도 데이터와 이어 쓴다.
description_portal: 이 데이터는 경기도 내 공공 테니스장의 현황을 기록한 자료로, 시군명, 시설명, 소유기관, 관리주체, 준공연도, 테니스 코트 바닥재(클레이, 인조잔디 등), 면적 및 부지면적, 건설사업비, 관람석 정보, 위치정보(도로명 및 지번주소, 위도·경도) 등을 포함하고 있습니다. 주요 항목으로는 ‘바닥재료명’, ‘면적(㎡)’, ‘건설사업비(백만원)’, ‘소재지도로명주소’, ‘WGS84위도’, ‘WGS84경도’ 등이 있으며, 체육시설 활용 실태 분석, 지역별 스포츠 인프라 비교, 공공테니스장 리모델링 계획 수립 등에 활용 가능합니다. 일부 시설은 고양시테니스협회 등 외부 기관에 위탁 운영되고 있으며, ‘비고사항’에는 시설의 위치 및 활용 정보가 간단히 기재되어 있습니다. 일부 항목은 누락값이 존재하므로 자료 해석 시 유의가 필요합니다.
