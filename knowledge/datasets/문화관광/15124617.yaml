summary_user: 전북특별자치도 내 관광지를 한 곳당 한 행으로 담고, 관광지명·주소·위도·경도 4개 항목을 포함하는 시도 단위 위치 목록 파일이다(포털 설명상 238개소). 관광 앱 개발자나 분석가가 '전북 관광지를 지도에 찍고 시군별 분포와 밀도를 비교하려면 어디에 있나' 같은 질문에 쓴다. 전역 조인 키가 없어서 다른 데이터와는 관광지명이나 주소 문자열을 매칭하거나 좌표 기반 공간 결합으로 이어 쓴다. TourAPI 관광지 원장(contentId)과도 이 방식으로 대조한다.
description_portal: 본 데이터는 전북특별자치도 내 주요 관광지의 명칭, 주소, 그리고 위치좌표(위도 및 경도) 정보를 포함한 위치 기반 관광 자원 데이터로, 총 238개 관광지에 대한 정보를 담고 있습니다. 각 관광지는 전주시, 군산시, 익산시, 남원시, 정읍시 등 전북 도내 주요 도시 및 군에 분포하고 있으며, 관광지명, 주소(도로명 또는 지번 주소), 위도(latitude), 경도(longitude) 4개 항목으로 구성되어 있습니다. 이 데이터는 관광지의 정확한 위치를 파악하거나, 지도 시각화, 관광 동선 최적화, 내·외국인 대상 관광 정보 서비스 개발, 위치 기반 분석(LBS, GIS) 및 공간 통계 분석 등에 활용할 수 있습니다. 특히 위도/경도 정보는 스마트폰 앱, 내비게이션, 공공정보 포털, AR(증강현실) 기반 관광 서비스 개발 등에서 핵심적인 역할을 합니다. 따라서 행정구역별 관광 인프라 현황을 파악하고, 지역 간 관광 자원의 밀도, 접근성, 유형 등을 비교 분석하여 관광 정책 수립, 맞춤형 홍보 전략, 관광객 유입 촉진을 위한 경로 분석 등에도 활용될 수 있습니다. 또한 타 산업(숙박, 교통, 음식점, 편의시설 등)과 연계하여 관광 클러스터 구축이나 지역 경제 활성화 전략 마련에도 기초자료로 쓰일 수 있습니다.
