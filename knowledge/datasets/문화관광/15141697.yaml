summary_user: 서울특별시 용산구에 신고된 체력단련장업(헬스장 등)의 인허가 현황을 사업장 한 곳당 한 행으로 담으며, 인허가일·폐업일, 영업상태, 상호명, 지번·도로명 주소, 좌표, 시설 면적 같은 항목이 들어 있다. 용산구에서 헬스장이 어디에 몇 곳 영업 중인지, 최근 문을 열거나 닫은 곳이 어디인지 확인하는 데 쓰며, 헬스장 개폐업을 상권 변화 신호로 보는 분석에도 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 주소·상호명 매핑이나 같은 기관의 관리 코드(OPNSFTEAMCODE)로만 연결한다.
description_portal: 서울특별시 용산구에 정식으로 신고된 체육시설업 중 체력단련장업(헬스장 등)의 현황 정보를 제공하고 있습니다. 이 정보에는 용산구 내 위치한 체력단련장업(헬스장 등)에 대한 세부사항이 포함되며, 각 시설의 상호명, 소재지 주소 등의 기본 정보가 제공됩니다. 해당 정보에 대한 문의사항이 있으시거나, 해당시설을 제외한 용산구에 정식으로 신고된 다른 업종의 신고체육시설업의 정보 또는 공공체육시설에 대한 정보가 필요한 경우 관련 부서에 문의해주십시오. 해당 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.
