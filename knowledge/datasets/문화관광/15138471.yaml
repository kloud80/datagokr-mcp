summary_user: 군산시 스탬프투어 프로그램의 코스별로 포함된 관광지를 한 행씩 담은 파일(csv, 약 33KB)로, 관광지명·주소·위도·경도·간략소개·등록일자를 개별 지점 단위로 담는다. 군산을 찾는 여행자나 관광 앱·지도 서비스 개발자가 '스탬프투어 각 코스에 어떤 관광지가 어디에 있는가'를 확인하고 동선을 짜는 데 쓴다. 전역 조인 키는 없어서 TourAPI 관광지 정보나 다른 관광 데이터와는 관광지명·주소를 맞추거나 위도·경도 좌표로 공간 매칭해 이어 쓴다.
limits: TourAPI의 콘텐츠ID나 행정코드 같은 공통 키가 없어 다른 데이터와 붙이려면 이름·주소 매핑에 의존해야 한다. 범위는 군산시 한 곳에 한정되며, 방문객 수나 스탬프 참여 실적은 담지 않는다.
