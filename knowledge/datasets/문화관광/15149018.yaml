description_portal: 한국언론진흥재단에서 정부광고 수수료를 재원으로 제작한 재단 누리집에 공개되어 있는 언론산업통계 목록명 자료입니다. 국내 언론 산업 전반의 현황과 동향을 체계적으로 수집하고 분석한 종합적인 통계 데이터로, 신문, 방송, 온라인 미디어 등 다양한 언론 매체의 경영 실태와 시장 구조를 정량적으로 파악할 수 있습니다.매체별 매출 규모, 광고 수입, 구독자 현황, 종사자 수, 콘텐츠 제작비 등 언론 산업의 핵심 지표들을 포괄적으로 담고 있으며, 연도별 변화 추이를 통해 산업의 성장과 변화 패턴을 분석할 수 있습니다. 또한 디지털 전환에 따른 미디어 생태계 변화, 플랫폼 사업자와의 관계, 신규 수익 모델 개발 현황 등 언론 산업이 직면한 주요 이슈들에 대한 데이터도 포함되어 있습니다. 언론사 경영진, 정책 입안자, 미디어 연구자들이 산업 전반을 이해하고 정책 수립 및 경영 전략 수립에 활용할 수 있는 핵심 기초 자료입니다.각각 조사의 상세한 데이터는 재단 누리집 또는 공공데이터 포털에서 대상 조사명으로 검색하면 바로가기 링크로 확인하실 수 있습니다.
