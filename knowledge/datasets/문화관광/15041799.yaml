summary_user: 전라남도 농업박물관(영암군 삼호읍)이 소장한 도서자료를 한 권씩 기록한 건별 목록으로, 소장경위·도서명·발행연도·저자 및 발행처·소장년월일을 담고 활용신청 없이 CSV 파일(약 65KB)로 받는다. 농업사·농경문화 연구자나 박물관 이용자가 이 박물관에 어떤 농업 관련 도서가 언제 어떤 경위로 들어왔는지 확인하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어, 다른 도서 데이터와는 도서명·저자 이름을 맞춰 보는 방식으로만 연결된다.
