summary_user: 전라남도 먹거리(음식점) 정보를 업소 한 곳당 한 행으로 담는 건별 API로, 상호명·주소·문의전화·주차시설·홈페이지·설명·위경도·지역명과 이미지 파일 URL을 제공한다. 전남 여행을 계획하는 사람이나 여행 앱 개발자가 "특정 시군에서 들를 만한 맛집과 그 위치·주차 여부"를 찾는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI contentId 등과 바로 이어지지 않으며, 지역명(foodZoneNm)·상호명·주소 매칭이나 위경도 좌표 근접으로만 다른 관광·숙박 데이터와 연결한다.
description_portal: '- 입력 파라미터를 이용하여 전라남도 먹거리 정보를 조회할 수 있는 서비스로 먹거리 장소, 먹거리 상호명, 먹거리 설명 등의 항목을 제공합니다.- 전라남도(전남)는 자연경관, 역사, 문화, 미식 등 다양한 매력을 지닌 여행지로, 여름철에도 시원하고 다채로운 여행을 즐길 수 있습니다.- 교통: 전남 지역은 대중교통이 제한적일 수 있으므로, 렌터카를 이용하시는 것을 추천합니다.- 숙박 예약: 여름철에는 관광객이 많아 숙박 시설이 빠르게 마감될 수 있으므로, 미리 예약하시는 것이 좋습니다.- 체험 예약: 일부 체험 프로그램은 사전 예약이 필요할 수 있으므로, 방문 전에 확인하시기 바랍니다.- 전남은 자연과 문화, 미식을 동시에 즐길 수 있는 매력적인 여행지입니다.'
