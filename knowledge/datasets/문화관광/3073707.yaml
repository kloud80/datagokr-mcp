summary_user: 성남시 관내 전통사찰을 사찰 한 곳당 한 행으로 담은 파일(452바이트 CSV)로, 사찰명·소재지·종단·창설년도·전화번호를 포함한다. 성남에 어떤 전통사찰이 어느 주소에 있고 어느 종단 소속인지, 언제 창건됐는지 확인하려는 시민·답사객·지역 문화유산 조사자가 쓴다. 전역 조인 키가 없어 다른 문화유산·관광 데이터와는 사찰명이나 소재지 주소를 맞춰 이어 써야 한다.
description_portal: 성남시는 수도권 도시화 지역임에도 불구하고 역사적 가치와 문화유산을 간직한 전통사찰들이 다수 분포하고 있습니다. 대표적인 사찰로는 봉국사, 망경암사, 약사사 등이 있으며, 이들은 대부분 조선시대 이전 창설 기록과 더불어 전통건축, 석조문화재, 불화 등 문화재적 요소를 보유하고 있는 것이 특징입니다.성남시에는 문화재 보호법에 따라 등록된 전통사찰이 여러 곳 있습니다.전통사찰은 도심 속에서 전통과 현대가 공존하는 공간으로, 지역 정체성과 문화다양성 보존에 기여하는 역할도 수행하고 있습니다.
