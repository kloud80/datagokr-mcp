summary_user: 2007~2018년 국내 문학 행사를 행사 한 건씩 담은 파일로, 연도·행사명·회차·시작일·종료일·주최·장소·행사내용을 기록한다. 연구자나 문화정책 분석가가 "특정 문학제·백일장이 몇 회째 어디서 누구 주최로 열렸나", "연도별 문학 행사가 어떻게 변해 왔나"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 행사명·주최·장소 같은 이름을 맞추는 방식으로만 이어 쓴다.
limits: 2007~2018년 행사만 담은 생성 후 불변 성격의 파일이라 최근 행사 정보는 이 데이터로 얻지 못한다. 공연·시설 표준 코드 같은 전역 키가 없어 다른 문화 데이터와 연결하려면 이름 매칭이 필요하다. 장소는 텍스트로만 있어 좌표 등 공간 분석에 바로 쓰기 어렵다.
