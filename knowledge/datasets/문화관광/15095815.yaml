summary_user: 홍대걷고싶은거리 일대를 격자로 나눠 격자별 위치 범위(left·top·right·bottom)와 연령·시간대·주말 구분 유동인구 분석값을 담은 집계 파일로, 2021 공공데이터 뉴딜 사업 결과물이며 SHP 공간데이터는 EPSG:3857 좌표계를 쓴다. 상권 분석가나 관광정책 담당자가 홍대걷고싶은거리에서 14세 이하·65세 이상·주말 방문 인구가 어느 격자에 몰리는지 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 격자 좌표를 공간 중첩하거나 같은 마포구 유동인구 파일과 격자 id로 맞춰 이어 쓴다.
