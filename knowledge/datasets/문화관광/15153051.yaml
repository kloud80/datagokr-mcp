summary_user: 국가유산청이 제공하는 등록문화유산 정보를 재난안전데이터 공유플랫폼을 거쳐 전국 범위로 담으며, 유산별로 명칭·지정번호·지정일자·시대·분류·소재지·좌표(XCRD·YCRD) 같은 항목을 둔다. 지역 안전·재난 분석가나 문화유산 관심자가 '특정 지역에 어떤 등록문화유산이 언제 등록돼 어디에 있는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 국가유산청 자체 API 등과는 지정번호·명칭·소재지 문자열 매칭으로 잇고, 좌표로 다른 공간 데이터와 겹쳐 볼 수 있다.
description_portal: "\"행정안전부에서는 「재난 및 안전관리 기본법」에 따라 데이터 기반 재난 및 안전관리체제 확립 및 재난안전데이터 수집·연계·분석·활용·공유·공개를 위하여 재난안전데이터통합관리시스템인 '재난안전데이터 공유플랫폼' 구축·운영하여 안전분야 공공데이터를 제공하고 있습니다.- 재난안전데이터 공유플랫폼(https://www.safetydata.go.kr)과 공공데이터포털에서 연계하여 제공하고 있습니다.- 해당 데이터는 국가유산청에서 제공하고 있는 등록문화유산 관련 정보입니다.\""
