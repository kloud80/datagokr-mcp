description_portal: 본 자료는 의왕시 도서관에서 진행하는 영화상영 프로그램의 운영 현황을 관리하기 위해 구축된 데이터로, 도서관 문화서비스 제공 내역과 이용자 대상 프로그램 운영 일정을 확인할 수 있는 정보입니다. 항목은 번호, 제목, 상영일자, 시작시간, 상영시간분, 장소, 사이트구분으로 구성되어 있으며, 상영되는 영화의 제목과 날짜 및 시간 정보를 통해 이용자는 프로그램 참여 일정을 확인할 수 있습니다. 장소 항목을 통해 프로그램이 운영되는 도서관 또는 상영 공간을 확인할 수 있고, 사이트구분 항목은 도서관 분관별 운영 여부를 나타냅니다. 해당 데이터는 영화상영 프로그램의 운영 일정을 체계적으로 관리하고 도서관별 문화행사 분석, 홍보자료 제작, 이용자 서비스 개선 등에 활용할 수 있는 기초자료입니다.(코로나19 이후 중단되었습니다.)
