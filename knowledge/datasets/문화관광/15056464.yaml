summary_user: 광주광역시에 등록 신고된 출판사를 한 곳당 한 행으로 담은 건별 현황 파일로, 상호·등록구분·영업구분·주소(구 단위)를 담는다. 출판 관련 사업자나 분석가가 '광주 어느 구에 영업 중인 출판사가 몇 곳 있는가'를 확인하거나 지역 출판사 목록을 뽑는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소 같은 이름 매칭으로만 연결하고, 실시간 조회는 포털 설명에 안내된 문화체육관광부 출판사/인쇄사 검색 시스템과 함께 쓴다.
