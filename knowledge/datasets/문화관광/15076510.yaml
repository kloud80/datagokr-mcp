summary_user: 한국문화예술위원회 아카이브(AK공연예술)가 정리한 공연·학술행사 정보를 행사·공연 회차 단위로 담은 파일로, 2007·2008·2015·2017·2018년 행사의 행사명, 공연명, 기간, 참여인력·단체, 주최, 지역·장소, 장르, 참가작품을 담는다. 연구자나 기록 담당자가 '특정 연도에 어떤 단체가 어느 지역에서 어떤 장르의 공연행사를 열었는가'를 확인할 때 쓴다. 실측 컬럼에 공연ID 같은 전역 조인 키가 없어 KOPIS 공연 목록 등과는 공연명·단체명·장소명을 이름으로 맞춰 붙여야 한다.
description_portal: AK공연예술의 학술행사 정보입니다. 각 구성 항목으로는 연번, 연도, 행사명, 공연명, 회차, 시작일, 종료일, 참여인력, 단체, 주최, 지역, 장소, 행사내용, 장르1, 장르2, 참여작품, 비고로 구성되어 있습니다. 연번 항목은 2007년이 1번부터 256번까지, 2008년이 다시 1번부터 1167까지, 2015년이 1부터  68까지, 2017년이 1부터 227까지, 2018년이 1부터 284까지로 구성되어 있습니다. 연도 항목은 2007, 2008, 2015, 2017, 2018로 구성되어 있습니다. 따라서 파일에서 AK공연예술의 학술행사 정보를 확인할 수 있습니다.
