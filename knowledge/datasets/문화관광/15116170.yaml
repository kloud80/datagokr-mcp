summary_user: 서울 중구의 골프연습장업 인허가 업소를 한 업소씩 담은 명부로, 관리번호(MGTNO)·인허가일·영업상태(영업·폐업 등)·폐업일·소재지 지번/도로명 주소·사업장명·중부원점TM 좌표 등을 담는다. 골프연습장 창업을 준비하는 예비 사업자나 상권 분석가가 '중구에 영업 중인 스크린·실내 골프연습장이 어디에 몇 곳 있고 최근 폐업이 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주소·사업장명 매핑이나 같은 기관(개방자치단체) 코드로만 연결하며, 헬스장·당구장 등 다른 체육시설업 인허가 명부와 같은 축으로 묶어 상권 신호로 본다.
description_portal: '서울특별시 중구의 골프를 연습하기 위해 실내 또는 실외에 시설을 갖추어 제공하는 업소 정보입니다. 데이터는 각 골프연습장업체에 부여된 관리번호, 현재의 영업 상태(등록, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 골프연습장업 창업을 희망하는 예비 사업자에게는 중구 지역의 시장 분석 및 실내 스크린 골프 타석 시설 업체 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
