summary_user: 국민체력100 체력인증센터에서 측정한 결과를 측정 건별로 담으며, 측정자의 성별·나이·연령대, 측정연월, 인증 등급(상장구분)과 신장·체중·체지방률·혈압·악력·왕복오래달리기 등 체력 측정 항목, 운동처방 내용을 전국 단위로 제공한다. 분석가나 체육 프로그램 기획자가 '우리나라 60대 여성의 악력과 심폐지구력은 연령대별로 어떻게 분포하는가', '어떤 측정 결과에 어떤 운동처방이 주어지는가'를 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연령대·성별·측정연월 같은 공통 구분값이나 같은 기관(국민체육진흥공단) 자료 기준으로만 맞춰 쓴다.
description_portal: 국민체력100 체력인증센터 측정결과는 국민체육진흥공단에서 운영하는 국민체력100 체력인증센터의 사업관련 자료 및 국민체력 측정 결과 정보입니다. 나이구분, 연령, 상장구분, 국민체력100 체력인증센터의 체력 측정 항목들, 측정연월 등의 정보를 제공합니다. 체력 측정 항목들에는 신장, 체중(kg), 체지방률(%), 허리둘레(cm), 혈압, 악력, 윗몸말아올리기(회), 반복점프(회) 등이 있고 사용자는 측정결과와 측정 결과에 맞는 운동처방을 조회할 수 있습니다. 이 서비스는 연령별·항목별 체력 측정 데이터를 기반으로 개인 맞춤형 운동처방과 체력 향상 프로그램 개발에 활용될 수 있습니다.
