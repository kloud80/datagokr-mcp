summary_user: 제주특별자치도 '추억애거리와 도두등대' 무장애 여행 코스 한 곳에 대해 개요·위치·코스 경로·주차장·화장실 같은 접근성 정보를 구분·유형·추천여부·비고 항목으로 정리한 코스 단위 안내 자료다. 휠체어 이용자나 유모차 동반 여행자가 이 코스를 걸을 수 있는지, 주차와 화장실은 어디에 있는지를 미리 확인할 때 쓰고, 무장애 관광지 지도화나 관광 안내 앱 정보 보강에도 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 같은 다른 데이터와는 코스명·장소명으로 직접 맞춰 연결해야 한다.
description_portal: '제주특별자치도 내 추억애거리와도두등대_무장애여행관광정보 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 제주특별자치도의 무장애 관광 정보를 제공하는 “추억애거리와 도두등대” 코스에 대한 개요, 위치, 코스 경로, 주차장 및 화장실 편의시설 등 관광자 접근성을 중심으로 정리된 정보이다. 이 자료에는 코스 구성, 추천 동선, 휴무일, 관람료 등의 필수 정보가 포함되어 있으며, 각 포인트별 사진 자료도 제공되어 이용자가 현장 상황을 사전에 확인할 수 있다.* 활용 분야 : 무장애 관광지 지도화 및 접근성 개선 사업, 관광지 안내 서비스 및 웹/앱 정보 제공 개선 등'
