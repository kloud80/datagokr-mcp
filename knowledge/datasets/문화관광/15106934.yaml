description_portal: '데이터 기간: 2023. 1.~2026. 5.관련 데이터:  대관명, 사용일자, 장비명, 사용수량, 단가데이터 내용: 예술의전당 대관별 무대 장비 사용내역은, 각 대관 행사(공연, 전시 등)에서 사용된 무대 장비의 종류, 수량, 사용일자 및 요금 정보를 확인할 수 있는 데이터입니다.대관사(기획사)는 공연·행사 기획 시 필요한 장비를 대관과 함께 한 번에 신청하고 대여할 수 있습니다. 예술의전당은 무대, 조명, 음향 등 다양한 장비를 보유하고 있어 대관 목적에 맞춰 효율적으로 지원합니다.해당 데이터를 통해 특정 무대 장비가 어떤 시기에 많이 사용되는지 공연/전시 별로  확인이 가능합니다. 대관신청 및 무대장비 대여는 예술의전당 대관자파트너센터(https://center.sac.or.kr/)에서 하실 수 있습니다.'
