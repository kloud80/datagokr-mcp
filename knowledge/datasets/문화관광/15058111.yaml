summary_user: 경기도 내 비디오물시청제공업체(DVD방·영상시청실 등)를 업소 한 곳당 한 행으로 담은 현황 자료로, 영업 중인 곳뿐 아니라 폐업·직권말소 업체까지 인허가일·영업상태·폐업일과 함께 기록하고 소방·비상계단·조명 조도·시설면적·층수 같은 시설 항목과 주소·좌표를 담는다. 지자체 담당자나 분석가가 "우리 시군에서 최근 몇 년 사이 DVD방이 얼마나 폐업했고, 남은 업소의 소방시설·비상계단은 갖춰져 있는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 같은 기관 코드, 업소명·주소 매칭으로 경기도의 다른 업종 현황과 잇고, WGS84 좌표로 지도 위에 겹쳐 본다.
description_portal: 이 데이터는 경기도 내 비디오물시청제공업체(DVD방, 영상시청실 등)의 운영 현황을 정리한 자료입니다. 해당 업종은 소규모 공간에서 영상물을 상영하는 여가·문화업으로, 운영 중인 시설뿐 아니라 폐업 및 직권말소된 업체도 함께 기록되어 있어 산업의 변화 추이를 확인할 수 있습니다. 또한 자료에는 조명, 환기, 소방 등 시설 안전과 관련된 세부 항목이 포함되어 있어, 청소년 보호와 안전관리 차원에서도 의미가 있습니다. 이 데이터는 지역 여가문화 공간의 변동 추세 분석, 안전관리 실태 파악, 청소년 문화공간 정책 수립 등에 기초자료로 활용될 수 있습니다.
