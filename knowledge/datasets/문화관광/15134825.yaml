description_portal: 이 데이터는 위생관리 기준을 충족하고 생활방역 수칙을 준수하는 식당을 지정·운영하기 위해 마련된 안심식당 현황 자료입니다. 식당 이름, 분류, 소재지 주소, 지도 링크, 전화번호 등의 항목으로 구성되어 있으며, 공공기관에서 위생 점검 및 생활방역 이행 여부를 확인한 뒤 지정된 업소들이 수록되어 있습니다. 지도 URL은 네이버 지도와 연동되어 있어 위치 확인 및 길찾기 서비스와도 활용할 수 있으며, 주소 정보는 도로명 기준으로 정제되어 있습니다. 본 자료는 시민들에게 위생적으로 안심하고 외식할 수 있는 장소를 제공함과 동시에, 지역 내 건강한 외식문화 조성과 감염병 확산 방지를 위한 정책 기반으로 활용하실 수 있습니다. 외식산업의 공공신뢰도 향상과 관련 정책 홍보에도 효과적으로 사용할 수 있습니다.
