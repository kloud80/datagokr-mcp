summary_user: 세종특별자치시에서 열리는 축제를 한 건씩 담은 API로, 축제명·개최 장소·시작일과 종료일·내용·주관·주최·후원 기관·전화번호·홈페이지와 함께 도로명·지번 주소와 위도·경도 좌표를 제공한다. 세종시 주민이나 방문객이 '이번 주말이나 이번 계절에 세종에서 어떤 축제가 어디서 열리나'를 확인하거나, 지역 행사 일정 서비스를 만드는 개발자가 세종 축제 목록을 받아오는 데 쓴다. 전역 조인 키는 없어서 다른 데이터와는 축제명·주소 같은 이름 매칭이나 좌표 기반 위치 결합으로 잇는다. TourAPI 행사 정보와 겹치는 건을 걸러낸 뒤 보완용으로 쓴다.
limits: 범위가 세종특별자치시 한 곳이라 다른 시도 축제는 없고, 기관 공통 코드나 표준 키가 없어 다른 데이터와 정확히 결합하기 어렵다. 이벤트성으로 생성된 뒤 바뀌지 않는 성격의 데이터라 수시로 갱신되는 실시간 일정으로 여기면 안 된다. 개발계정은 하루 5,000회 호출로 제한된다.
