summary_user: 김해통합도서관홈페이지 데이터베이스에서 개방 가능한 테이블과 컬럼의 이름(한글·영문)을 운영부서·정보시스템명·데이터베이스명과 함께 컬럼 단위로 나열한 메타데이터 목록이며, 도서 소장이나 대출 같은 실제 업무 데이터는 담지 않는다. 분석가나 개발자가 '김해시 도서관 홈페이지 DB에 어떤 테이블과 컬럼이 있고 어떤 데이터를 추가 개방 요청할 수 있는가'를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 테이블명·컬럼명 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
limits: 테이블·컬럼 목록일 뿐 실제 레코드 값은 없어 도서관 이용·소장 현황 분석에는 쓰지 못한다. 도서관코드·ISBN 같은 공통 키가 없어 도서관정보나루 등 다른 도서관 데이터와 직접 조인할 수 없다.
