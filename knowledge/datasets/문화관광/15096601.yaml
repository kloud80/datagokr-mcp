summary_user: 아르코예술기록원이 소장한 전시도록의 메타데이터를 주어·술어·목적어 세 칸의 RDF 트리플 형식으로 담은 파일이며, 전시명·작가·장소·주제·발행연도 같은 정보가 트리플 한 줄씩 기록된다. 연구자나 아카이브 담당자가 '특정 작가가 참여한 전시도록은 어떤 것이 있고 언제 어디서 발행됐나'를 찾거나 시각예술 전시 이력을 분석하는 데 쓴다. 실측 컬럼에는 다른 데이터셋과 맞출 전역 조인 키가 없다. 다른 데이터와는 작가명·전시명 같은 이름을 매핑하거나 같은 기관(한국문화예술위원회) 자료끼리만 연결할 수 있다.
description_portal: 이 데이터는 한국문화예술위원회 아르코예술기록원이 소장하고 있는 전시도록 자료의 메타데이터로, 온톨로지 기반의 트리플(Triple) 구조로 구성되어 있으며, 각 항목은 주어(Subject), 술어(Predicate), 목적어(Object)로 이루어진 SPO 형식을 따릅니다. 주어와 술어는 모두 URL 링크 형식으로 제공되어 해당 자원과 속성에 대한 고유 식별자 역할을 하며, 메타데이터 간의 상호 연결성과 의미론적 해석을 가능하게 합니다. 이 구조는 RDF(Resource Description Framework) 기반의 시맨틱 웹 기술을 활용한 것으로, 전시명, 작가, 장소, 주제, 발행연도 등 전시도록과 관련된 다양한 정보가 구조화되어 저장됩니다. 본 메타데이터는 전시 예술 아카이빙, 디지털 컬렉션 구축, 학술 연구, 데이터 기반 전시 분석 등에 활용될 수 있으며, 시각예술 분야의 지식 네트워크를 형성하고, 데이터 간 연계성을 높이는 데 유용한 자료로 평가됩니다.
