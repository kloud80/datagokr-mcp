summary_user: 국립무형유산원이 무형유산을 기록하려고 촬영한 사진 자료를 건별 목록으로 담으며, 포털 설명상 자료명과 상세 페이지 이동 URL 등을 돌려주고 범위는 전국·비공간이다. 연구자나 교육 콘텐츠 제작자가 "특정 무형유산 종목의 기록 사진이 어떤 것이 있고 어디서 볼 수 있나"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 무형유산 데이터와는 자료명·종목명 같은 이름 매핑이나 같은 기관(국립무형유산원) 데이터끼리만 이어 쓴다.
limits: 공통 코드로 연결할 키가 없어 종목·보유자 데이터와 정확히 결합하기 어렵고 이름 매칭에 기대야 한다. 개발계정은 하루 500회 호출로 제한된다.
