summary_user: 부산광역시 중구 관내 문화유산 매매업소를 업소 한 곳당 한 행으로 담은 등록 현황 파일로, 허가번호·상호·소재지·허가일·상태·연락처를 담는다(csv 약 1.4KB의 소규모 목록). 중구에서 고미술품·골동품 같은 문화유산을 사고팔 수 있는 허가 업소가 어디에 있고 현재 영업 상태인지 확인하려는 시민·사업자, 지역 문화유산 거래업 분포를 보려는 연구자가 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호명이나 소재지 주소를 맞춰 잇거나 다른 시군구의 같은 이름 데이터와 나란히 붙여 쓴다.
limits: 범위가 부산 중구 한 곳뿐이라 부산 전체나 전국 현황은 다른 기관 파일을 모아야 한다. 국가유산 종목코드·지정번호나 필지번호(PNU) 같은 공통 키가 없어 국가유산청 유산 목록과 바로 연결되지 않으며, 거래 내역이나 취급 품목은 담지 않는다.
