description_portal: 부산광역시 중구 관내 문화유산 매매업 등록 현황 데이터입니다. 해당 자료에는 허가번호, 상호, 소재지, 허가일, 연락처 등 기본 정보가 포함되어 있으며, 관내 문화유산 매매업소의 등록·운영 현황을 한눈에 파악할 수 있도록 구성되어 있습니다.이 데이터는 국민, 연구자, 기업, 유관기관 등이 지역 내 문화유산 거래 현황과 분포를 확인하거나 정책 수립, 연구·분석, 관련 사업 기획 등 다양한 분야에서 활용할 수 있습니다.중구청은 공공데이터포털을 통해 연 1회 이상 최신 현황을 제공하며, 본 자료는 2025년 기준으로 공개된 파일입니다.
