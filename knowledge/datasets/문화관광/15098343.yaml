summary_user: 세종특별자치시 안의 걷기·탐방 길을 한 건씩 담은 목록으로, 길 이름과 소개, 총 길이, 소요시간, 시작·종료 지점의 이름과 주소, 경로 설명, 관리기관과 연락처, 기준일자를 담는다. 세종에서 산책하거나 걸을 만한 길이 어디서 시작해 얼마나 걸리는지 찾는 시민·여행자, 지역 걷기 코스 안내를 만드는 앱 개발자가 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없어서, TourAPI 관광 콘텐츠나 다른 관광지 목록과는 길 이름이나 시작·종료 지점 주소로 맞춰 이어 써야 한다.
limits: 전역 조인 키가 없어 다른 데이터와는 이름·주소 매칭으로만 연결된다. 범위는 세종특별자치시 한 곳이고, 위치는 좌표가 아니라 시작·종료 지점 주소로 주어진다. 포털 활용신청 후 serviceKey로 호출하며 개발계정은 하루 5,000회로 제한된다.
