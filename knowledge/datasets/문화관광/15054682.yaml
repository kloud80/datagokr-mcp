description_portal: '한국문화예술위원회가 발간한 정책 보고서 내용입니다. 제목은 2015 문화예술나눔 통계조사 최종보고서입니다. 2015년 11월 10일을 기준으로 발간되었습니다. 목차 내용으로는 1. 연구의 배경과 목적, 2. 연구 범위, 3. 연구 내용, 4. 연구방법 및 절차, 5. 일반기업 조사결과, 6. 메세나 회원사 조사결과, 7. 표적집단 인터뷰(FGI : Focused Group Interview), 8. 요약 및 함의 항목으로 구성되어 있습니다. 마지막 항목인 요약 및 함의는 1) 요약, 2) 함의로 구성되어 있으며, 정책적 시사점도 함께 제시됩니다. 전반적으로 실태를 파악합니다.'
