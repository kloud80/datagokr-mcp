description_portal: 부산시 해수욕장은 해수욕장법 제6조에 따라 지정고시된 구역으로, 부산광역시는 2026년 현재  8개 해수욕장(송도, 해운대, 송정, 광안리, 다대포-동서, 일광, 임랑)이 있습니다.해수욕장 정보 관련으로는  해수욕장의 위치(해당 구군) 및 규모(제곱미터), 방문객 현황(천명), 개장일 및 폐장일 , 개장기간 등의 항목을 제공합니다.해수욕장별 방문객 현황의 인원집계 방식은 표본조사(송도 다대포, 일광. 임랑) 및 빅데이터 방식(해운대,송정, 광안리)을 이용하고 있음을 참고해 주시기 바랍니다.데이터는 1년에 한번 현행화 됩니다.
