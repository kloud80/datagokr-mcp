description_portal: '‘한국학중앙연구원_고문서 형식 분류 정보’ 데이터는 한국학중앙연구원이 보유한 고문서를 형식별로 체계적으로 분류한 정보를 제공하는 자료입니다. 이 데이터는 각 고문서 형식에 대한 고유 번호, 형식명(예: 혼서, 녹표, 시도기, 반차도 등), 그리고 각 형식에 대한 간략한 설명으로 구성되어 있습니다. 이를 통해 고문서의 형태적·기능적 특성을 이해하고, 다양한 고문서 유형에 대한 체계적인 분류 기준을 확인할 수 있습니다. 연구자나 관련 분야 종사자들이 고문서를 연구·분석하는 데 활용할 수 있는 기초 자료이며, 고문서의 학술적 가치와 문화재적 중요성을 이해하는 데 도움을 줍니다.'
