summary_user: 국민체육진흥기금이 지원한 사업의 실적·예산·내역사업·수행기관·일일교부계획·단체별 연간지원 정보를 사업연도, 대상기관명, 세부사업명, 상세내역사업명, 보조사업명과 금액 단위로 담는 전국 범위의 API다. 분석가나 체육단체 관계자가 특정 연도에 어느 단체·기관이 어떤 세부사업으로 기금을 얼마나 지원받았는지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 데이터와는 기관명(org_nm)·사업명 같은 이름 매핑이나 같은 기관의 코드로만 이어 쓴다.
description_portal: 국민체육진흥기금 지원은 서울올림픽기념국민체육진흥공단에서 관리하는 국민체육진흥기금에서 지원하는 지원사업내역에 대한 정보로 연간 지원되는 금액의 정보 등의 데이터를 제공합니다. 기금지원실적정보, 기금지원예산정보, 기금내역사업정보, 기금사업수행기관정보, 일일교부계획정보, 단체별연간지원정보를 조회할 수 있습니다. 사업이 진행되는 연도, 대상기관명, 세부사업명, 상세내역사업명, 보조사업명 등의 데이터를 확인할 수 있습니다. 이 서비스는 국민체육진흥기금의 연도별 사업 지원 내역을 확인하여 예산 집행의 투명성 확보와 체육정책 수립의 기초 자료로 활용될 수 있습니다.
