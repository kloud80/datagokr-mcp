summary_user: 공공누리에서 우수저작물로 지정된 공공저작물 가운데 이미지 자료를 저작물 1건당 1행으로 담은 목록 파일(CSV, 약 2.7MB)이다. 저작물명·본문 설명·분류·형태·키워드·저작물 URL·썸네일 경로·조회수가 들어 있어, 교육·미디어 제작자가 '출처 표시만 하고 쓸 수 있는 특정 주제의 공공 이미지가 있는가'를 찾는 데 쓴다. 다른 데이터셋과 이을 전역 조인 키는 없으며, 저작물코드나 분류·형태 코드, 저작물 URL을 통해 같은 기관(공공누리·공유마당)의 다른 저작물 목록과 맞춰 보는 정도로만 연결된다.
description_portal: 공공누리시스템에서 제공하는 우수저작물 중 이미지 목록의 저작물코드, 저작물명, 본문내용, 적용일, 분류코드, 분류명, 형태명, 형태코드, 저작물URL, 썸네일파일경로, 공개여부, 조회수, 키워드명, 게시판코드, 게시판명 등 다양한 정보를 포함하고 있습니다. 이 데이터는 공공저작물 중 우수한 이미지 자료를 체계적으로 관리하고, 사용자가 손쉽게 접근하여 활용할 수 있도록 지원합니다. 문화예술, 교육, 연구, 미디어 제작 등 다양한 분야에서 이미지 자료의 검색, 분석, 콘텐츠 개발에 활용할 수 있으며, 저작물의 분류와 형태 정보를 통해 목적에 맞는 이미지를 효율적으로 찾는 데 도움이 됩니다. 또한, 썸네일과 URL 제공으로 시각적 확인과 직접 활용이 용이하여 공공저작물의 접근성과 활용도를 높일 수 있습니다.
