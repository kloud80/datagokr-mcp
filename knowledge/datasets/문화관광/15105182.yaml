summary_user: 경기도 내 체험 프로그램을 운영하는 관광지를 기관·프로그램 단위로 한 줄씩 담은 목록 파일로, 시군명·권역, 운영 기관명, 프로그램명, 지번주소, 홈페이지, 문의전화, 이용시간, 휴관일, 위도·경도를 포함한다(csv 약 9KB의 소규모 자료). 관광객이나 지자체 관광 담당자가 '우리 시군 근처에서 주말에 운영하는 체험 프로그램은 어디이고 언제 쉬는가'를 확인하거나 체험형 관광지 분포를 지도로 볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시군명 이름 매핑, 주소·위도·경도 기반 공간 결합으로 이어 써야 한다.
description_portal: 이 데이터는 경기관광공사가 제공하는 경기도 내 체험형 관광지 정보입니다. 2018년 추진된 경기관광 체험 프로그램 품질 인증제도를 기반으로 구축된 자료로, 체험 프로그램을 운영하는 관광지에 대한 다양한 정보를 포함하고 있습니다. 주요 항목에는 시군명, 권역구분, 운영 기관명, 프로그램명, 주소, 홈페이지, 문의처, 운영시간, 휴관일, 위도/경도 등이 있으며, 관광객과 정책 담당자가 효율적으로 활용할 수 있습니다. 체험형 관광 활성화, 지역 관광 콘텐츠 개발, 공공서비스 개선 등에 활용 가능한 데이터로, 관광정보의 품질 향상과 접근성 제고를 목적으로 합니다.
