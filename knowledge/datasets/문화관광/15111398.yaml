summary_user: 전국의 세계 각국 음식점을 업소 한 곳당 한 행으로 담은 파일로, 시설명·분류(카테고리1~3)·주소와 위도·경도·전화번호·평일/주말 운영시간, 주차·유아의자·휠체어·반려동물 동반·채식·할랄·글루텐프리 제공 여부를 담는다. 여행자나 외식 이용자가 "우리 동네에 할랄이나 채식 메뉴를 내는 외국 음식점이 어디 있나" 같은 질문을 하거나, 분석가가 지역별 세계 음식점 분포와 편의시설 수준을 비교할 때 쓴다. 전역 조인 키는 없어서 시도·시군구·법정동 명칭이나 도로명주소·좌표로 행정구역 자료나 지도 자료와 이름·위치 기준으로 맞춰 쓴다.
description_portal: 전국에 위치한 세계 각국 음식점에 대한 상세 정보를 제공하여 다양한 식문화를 경험하고자 하는 이용자에게 유용한 자료입니다. 시설명, 위치 정보, 도로명주소, 전화번호 등 기본 정보뿐만 아니라, 평일 및 주말 운영시간, 무료주차 및 발렛주차 가능 여부, 유아의자 대여, 휠체어 보유, 애완동물 동반입장, 채식메뉴, 할랄음식, 글루텐프리 음식 제공 여부 등 다양한 편의시설 정보를 포함하고 있습니다. 음식점 선택 시 접근성, 편의성, 특수식 제공 여부 등 다양한 조건을 비교 분석할 수 있어, 여행, 외식, 식문화 연구 등 여러 분야에서 활용할 수 있습니다.
