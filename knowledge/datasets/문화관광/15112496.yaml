summary_user: 전주시에 등록된 종합체육시설업(수영·골프·체육단련 등 여러 체육시설을 한 곳에 모은 업소)을 사업장 한 곳당 한 행으로 담은 명부로, 업종·사업장명·인허가일자·전화번호·도로명/지번주소·위도·경도를 담는다. 주민이나 상권 분석가가 '전주시 안에 수영장과 헬스장을 함께 갖춘 종합체육시설이 어디에 있고 언제 인허가를 받았나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 주소나 좌표, 사업장명을 기준으로 다른 체육시설업 명부나 상권 데이터와 맞춰 쓴다.
