summary_user: 거제시 관내 국가유산 52건을 건별로 담은 파일 데이터로, 종목·유산명·주소·좌표·분류코드·지정일자·설명·이미지를 포함한다. 거제시 안에 어떤 지정 유산이 어디에 있는지 찾아 지도 안내나 관광 동선을 짜려는 사업자·분석가가 쓴다. 주소와 위도·경도를 키로 다른 지도·위치 데이터와 잇고, 국가유산청 API의 종목코드·지정번호나 소재지 PNU 기준 자료와도 맞춰 볼 수 있다.
description_portal: 거제시 국가유산 현황 데이터는 종목·국가유산명 정보를 통해 지역 문화유산의 체계적인 관리와 보존 정책 수립에 활용될 수 있으며 주소·위도·경도는 지도 기반 국가유산 안내 서비스 및 관광 동선 설계에 도움이 되고 분류코드는 유형별·시대별 문화유산 분석을 가능하게 해 연구 자료로 활용될 수 있으며 지정일자는 보존 가치 평가와 연도별 관리 계획 수립에 기여하며 설명·이미지 데이터는 시민 교육, 관광 홍보 콘텐츠 제작, 문화유산 스토리텔링 서비스 개발에 활용될 수 있고 훼손·관리 필요 유산 파악을 통해 유지보수 우선순위를 정하는 데 도움이 되며 민간에서는 문화유산 기반 관광 앱, AR·VR 콘텐츠, 위치 기반 문화 체험 서비스 등 다양한 문화기술 개발에 활용될 수 있습니다.
