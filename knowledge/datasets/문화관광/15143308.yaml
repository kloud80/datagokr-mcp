summary_user: 전라남도 지역에 전해 오는 설화를 애니메이션 콘텐츠로 정리한 목록으로, 설화 한 편마다 고유 번호·제목·내용·등록일·조회수를 담은 건별 원천 데이터입니다. 지역 이야기를 소개하는 관광 안내 앱이나 교육 자료를 만드는 사업자가 '전남에는 어떤 설화가 있고 어떤 내용인가'를 찾아볼 때 씁니다. 전역 조인 키는 없어 TourAPI 관광지 등 다른 데이터와는 설화 제목에 나오는 지명·인물 이름을 직접 맞춰 이어 써야 합니다.
limits: 관광지 코드·지역코드 같은 공통 키가 없어 다른 관광 데이터와 자동으로 연결되지 않습니다. 이 데이터는 관광 부문에서 보조 등급이고 판정이 보류(defer)된 상태입니다. 영상·이미지류 콘텐츠는 관광 부문 핵심 범위에서 빠지므로 대표 관광 원장으로 쓰지 않습니다.
