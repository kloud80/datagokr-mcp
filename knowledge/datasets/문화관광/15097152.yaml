summary_user: 제주 중문관광단지 내 퍼시픽마리나요트공원 한 곳의 무장애 여행코스를 지점 단위로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·주요 포인트와 전체코스·추천코스 해당 여부가 들어 있다. 휠체어 이용자나 영유아 동반 가족이 "주차장에서 화장실을 거쳐 추천코스를 어떤 순서로 돌면 되나"를 미리 확인하거나, 무장애 관광 콘텐츠를 만드는 사업자가 코스 지도를 그리는 데 쓴다. 전역 조인 키는 없어 TourAPI 관광지 정보 등과는 장소명 매칭이나 위도·경도 좌표로만 이어 쓴다.
description_portal: '"제주특별자치도 내 퍼시픽마리나요트공원_무장애여행코스 데이터를 제공합니다.* 제주특별자치도 중문관광단지 내 퍼시픽 마리나 요트공원은 장애인·노약자·영유아 동반 가족 등 관광약자의 무장애 여행을 고려하여 설계된 코스를 갖춘 관광지입니다. 본 자료에는 해당 장소의 위치, 주차장과 화장실의 접근성, 추천 코스 및 주요 포인트 등이 포함되어 있어 이동이나 시설 이용에 제약이 있는 이용자도 사전에 방문 계획을 수립할 수 있습니다. 또한 이 정보는 무장애 관광 콘텐츠 제작, 관광서비스 접근성 개선, 정책수립 및 평가 등에 활용될 수 있는 기초자료로 제공됩니다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
