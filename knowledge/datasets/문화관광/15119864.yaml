summary_user: 경기도 내 종목별 체육회·연맹 단체마다 한 행씩, 종목명과 도로명·지번 주소, 우편번호, 전화·팩스 번호, WGS84 위도·경도를 담은 연락처 목록이다. 경기도 체육 행정 담당자나 선수·지도자가 "특정 종목 체육회에 어디로 연락하고 찾아가야 하나"를 확인할 때 쓰고, 좌표로 종목 단체 위치를 지도에 올릴 때도 쓴다. 실측 컬럼에 전역 조인 키나 코드표가 없어, 다른 체육 데이터와는 종목명(item_nm)이나 주소를 이름으로 맞추거나 좌표로 공간 결합해 잇는다.
description_portal: 이 데이터는 경기도 내 각 체육 종목별 체육회 또는 연맹 단체의 소재지 및 연락처 정보를 정리한 자료로, 스포츠 행정 및 종목별 조직 분포를 파악할 수 있도록 구성되어 있습니다. 주요 항목으로는 종목명, 도로명주소, 지번주소, 우편번호, 전화번호, 팩스번호, WGS84 기준의 위도 및 경도가 포함되어 있으며, 종목으로는 e스포츠, 검도, 골프, 궁도, 농구, 게이트볼 등 전통 및 현대 체육 종목이 다양하게 포함되어 있습니다. 대부분의 협회는 경기도체육회관에 위치하고 있으며, 공간상세 주소와 좌표정보는 GIS 기반 체육 인프라 지도 제작이나 체육회 방문 접근성 분석 등에 활용할 수 있습니다. 이 자료는 체육회 간 업무 협력, 종목별 체육회 지원 정책 수립, 체육시설 배분, 지역별 스포츠 활동 분석, 생활체육 활성화 전략 마련 등 다양한 분야에서 응용이 가능합니다.
