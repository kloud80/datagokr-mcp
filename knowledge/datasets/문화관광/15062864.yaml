summary_user: 한국도자재단이 주관한 도자 전시를 전시 한 건 단위로 담으며, 전시명·시작일·종료일·장소(경기생활도자미술관·경기도자미술관·경기도자박물관 등)·전시규모·참여작가를 기록한다. 도자·공예 분야 기획자나 문화관광 정보 제공자가 '최근 어떤 도자 기획전·특별전·비엔날레가 어디서 언제 열렸고 누가 참여했나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 전시·문화시설 데이터와는 장소명이나 전시명으로 직접 맞춰 이어야 한다.
description_portal: 이 데이터는 한국도자재단이 주관한 도자 전시의 정보를 담고 있으며, 전시명, 전시시작일자, 전시종료일자, 장소, 전시규모, 참여작가명, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 전시명은 기획전, 특별전, 도자비엔날레 등 다양한 전시의 주제와 성격을 나타내며, 장소는 경기생활도자미술관, 경기도자미술관, 경기도자박물관 등에서 개최된 위치를 명시합니다. 전시규모는 전시 작품 수와 도편자료, 체험 콘텐츠 등으로 표현되며, 참여작가명 항목을 통해 개별 전시의 예술가 구성도 확인 가능합니다. 해당 데이터는 도자문화 확산, 공예 관련 교육 프로그램 기획, 문화관광 정보 제공, 지역 예술활동 분석 등에 활용될 수 있습니다.
