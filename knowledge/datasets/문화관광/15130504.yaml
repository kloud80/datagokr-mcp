description_portal: '- 전라남도립도서관의 각 시설별(간행물실, 다문화자료실, 일반자료실 등) 주간, 주말 운영 시간과 휴관일에 대한 정보를 조회하실 수 있습니다.- 전라남도립도서관은 전라남도청이 직접 운영하는 공공도서관으로, 도민들의 독서와 정보 접근을 지원하는 중심 기관입니다. 도서관은 도서 대출, 열람, 문화 프로그램, 전시 등 다양한 서비스를 제공하며, 도민들의 지식 향상과 문화 생활 증진에 기여하고 있습니다.- 도서 대출 및 열람: 일반도서, 아동도서, 전자책 등 다양한 자료를 대출하고 열람할 수 있습니다.- 문화 프로그램: 독서 토론, 작가와의 만남, 문화 강좌 등 다양한 프로그램이 정기적으로 운영됩니다.- 전자 자료실: 전자책, 오디오북, 학술 자료 등 디지털 자료를 온라인으로 이용할 수 있습니다.- 전시 및 행사: 도서관 내외부에서 다양한 전시와 행사가 개최되어 문화 체험의 기회를 제공합니다.'
