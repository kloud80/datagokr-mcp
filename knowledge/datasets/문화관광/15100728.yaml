summary_user: 인천광역시 미추홀구에 등록된 당구장 업소를 한 곳씩 적은 시군구 단위 명부로, 상호명·도로명/지번주소·전화번호·위도·경도를 담고 전체 138건이다. 주민이나 분석가가 구 안에 당구장이 어느 동네에 몰려 있는지, 특정 업소의 위치와 연락처가 무엇인지 확인하는 데 쓴다. 도로명·지번주소(address)와 위도·경도(coord)로 지도나 상권 데이터와 이어 쓰며, 인허가번호나 사업자번호 같은 키는 이 파일 필드에 없다.
description_portal: 본 데이터는 미추홀구 관내에 등록된 당구장업소 현황을 정리한 자료입니다. 각 업소의 상호명, 도로명주소 및 지번주소, 전화번호, 그리고 위도·경도 좌표 정보가 포함되어 있으며, 지역 내 당구장 분포를 체계적으로 파악할 수 있도록 구성되어 있습니다. 해당 데이터는 등록된 체육시설 중 실내 스포츠업으로 분류되는 당구장을 중심으로 수집되었으며, 주민의 여가활동 및 생활체육 참여 현황을 이해하는 데 활용할 수 있습니다. 본 자료는 지도 기반 위치 분석이나 상권별 업소 밀집도 파악 등 행정적·연구적 활용이 가능하며, 당구장업 관리 및 체육시설 정책 수립의 기초자료로도 의미가 있습니다. 또한 업소별 연락처 정보가 포함되어 있어 이용자가 시설 이용 전 문의 및 예약을 진행하기 용이합니다.
