summary_user: 서울특별시 중랑구의 DVD방·영화방 등 비디오물감상실업 업소를 한 건씩 담은 인허가 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM(EPSG:5174) 좌표와 시청실 수·층수·비상구 같은 시설 항목을 포함한다. 중랑구에서 지금 영업 중인 비디오물감상실이 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하려는 주민·사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 주소·사업장명 매칭이나 같은 기관의 코드(개방자치단체코드 OPNSFTEAMCODE)로만 연결한다.
description_portal: '서울특별시 중랑구의 DVD방, 영화방 등 다수의 시청실과 시청기자재를 갖추어 비디오물의 시청을 제공하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
