summary_user: 서울 종로구 내 전통사찰을 사찰 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일·취소일, 영업상태, 사찰명·주소·좌표, 승려 수·신도 수, 창건일·연혁, 지정해제 여부와 사유를 담는다. 구청 담당자나 연구자가 '종로구에 지정된 전통사찰은 어디이며, 지정이 해제되거나 상태가 바뀐 곳은 어디인가'를 확인할 때 쓴다. 전역 조인 키는 없어 다른 데이터와는 사찰명·주소 매칭이나 같은 지방자치단체코드(OPNSFTEAMCODE)·관리번호 기준으로만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 전통사찰의 인허가 및 관리 현황을 체계적으로 제공하는 자료입니다. 지방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드, 영업상태명 등 세부 항목으로 구성되어 있으며, 종교시설 운영과 문화유산 보존을 위한 행정허가 절차를 투명하게 관리할 수 있도록 지원합니다. 해당 자료는 사찰관리 실태를 파악하고, 영업상태 변동을 신속히 확인할 수 있어 인허가변동 내역의 추적과 행정 대응에 활용됩니다. 또한 전통사찰의 법적 지위와 운영 현황을 명확히 파악함으로써 지역자원의 보호와 보존정책 수립에 필요한 기초자료를 제공합니다. 종로구청은 본 데이터를 주기적으로 점검·갱신하며, 문화유산 관리의 효율성을 높이고 관련 정책결정의 객관성을 확보하는 데 활용하고 있습니다.
