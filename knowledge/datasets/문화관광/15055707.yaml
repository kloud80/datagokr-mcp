summary_user: 전북특별자치도 도내 승마장을 한 곳당 한 행으로 정리한 파일로, 승마장명·시군·주소·개설년도·신고구분(체육시설업 또는 농어촌형승마시설)·총면적·보유 마필 수·마방 수를 담는다. 말산업이나 지역 체험관광 정책 담당자가 "도내 어느 시군에 어떤 규모의 승마장이 있고, 체육시설업과 농어촌형 중 어느 유형으로 운영되는가"를 비교할 때 쓴다. 전역 조인 키나 코드가 없어 다른 데이터와는 시군 이름이나 주소, 승마장명으로 맞춰 이어야 하며, 체육시설업 인허가 명부(LOCALDATA) 같은 민간 체육시설 자료와 대조하는 용도로 쓴다.
description_portal: 전라북특별자치도 승마장 현황 데이터는 도내 각 시군별 승마시설의 운영 정보를 종합적으로 정리한 자료입니다. 주요 항목에는 승마장명, 주소, 개설년도, 신고구분(체육시설업 또는 농어촌형승마시설), 총면적(㎡), 보유 마필 수, 마방 수 등이 포함되어 있습니다.해당 데이터는 전주시부터 부안군까지 총 25개 승마장의 운영 규모와 유형을 비교할 수 있으며, 말산업 활성화, 지역 관광 및 체험형 여가활동 정책 수립 등에 유용하게 활용될 수 있습니다. 예를 들어, ‘장수승마장’은 16만㎡ 이상의 대규모 면적과 244칸의 마방을 갖춘 최대 규모 시설이며, ‘한국경마축산고’나 ‘전북말산업복합센터’와 같이 말 관련 교육·산업 목적의 시설도 포함되어 있습니다.승마장 운영 형태가 체육시설업과 농어촌형으로 구분되어 있어 정책적 분류와 지원 방안 수립에도 도움이 됩니다.
