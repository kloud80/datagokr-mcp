summary_user: 서울 종로구 관내에 설치된 실외운동기구를 설치 장소(시설지명)별로 위치·위도·경도와 시설물 현황·종류 수와 함께 담은 시설 목록 파일(CSV, 약 4.6KB)이다. 주민이 집 근처 공원이나 산책로에 어떤 야외운동기구가 있는지 찾거나, 구 담당 부서가 기구 분포를 보고 점검·추가 설치 위치를 정할 때 쓴다. 전역 조인 키는 없어서 다른 데이터와는 주소 문자열이나 위도·경도 좌표를 기준으로 공원·체육시설 목록 등과 맞춰 이어 쓴다.
description_portal: 본 데이터는 서울특별시 종로구 관내 실외운동기구의 설치 및 운영 현황을 체계적으로 제공하는 자료입니다. 시설지명, 주소, 위도, 경도 등 위치정보와 함께 기구의 시설물현황, 시설물 종류 등 세부 항목을 포함하고 있습니다. 자료는 주민의 생활체육 참여를 확대하고, 체력관리와 건강증진을 지원하기 위해 구축되었습니다. 또한 운동시설의 분포와 현황을 한눈에 파악할 수 있어, 효율적인 유지관리와 추가 설치계획 수립에 활용할 수 있습니다. 공공기관 및 생활체육 담당 부서에서는 본 데이터를 기반으로 야외시설의 안전 점검과 시설개선 우선순위 설정이 가능하며, 주민 편의성을 높이는 정책 추진에도 기여합니다. 종로구청은 실외운동기구의 최신 상태를 정기적으로 갱신·관리하며, 누구나 접근할 수 있는 공공데이터로 제공하고 있습니다.
