summary_user: 여수시 관광문화홈페이지에 등록된 음식메뉴를 메뉴 한 건씩 담은 파일로, 메뉴명·영문명·메뉴 설명과 한상·1인분 가격, 무게와 그램당 가격, 음식 분류(대·중·소)와 키워드를 포함한다. 여수를 찾는 관광객이나 여행 콘텐츠 제작자가 '여수 향토음식은 무엇이고 1인분에 얼마인가'를 확인하거나 지역 먹거리 안내를 만드는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 음식 콘텐츠 등 다른 데이터와는 메뉴명 같은 이름 매핑이나 같은 기관 자료로만 이어 쓴다.
limits: 표준 조인 키(TourAPI contentId·지역코드 등)가 없어 다른 관광 데이터와 자동으로 연결되지 않으며 이름 대조가 필요하다. 범위는 여수시 한 곳에 한정된다.
