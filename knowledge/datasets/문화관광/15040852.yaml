summary_user: 여수시 관광문화홈페이지에 등록된 숙박시설의 객실을 객실 유형 단위로 담은 건별 목록으로, 객실종류·선호도·기준인원과 최대인원·규모·추가비용, 그리고 성수기·극성수기·비수기의 주중·주말 요금을 담는다(CSV 약 54KB). 여수 여행자나 관광 안내 담당자가 '4인 가족이 묵을 수 있는 객실의 비수기 주말 요금은 얼마인가' 같은 숙소 비교·선택 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 숙박업 인허가나 관광 통계와는 숙소 이름 매핑이나 같은 기관(여수시) 기준으로만 이어 쓴다.
description_portal: 전라남도 여수시 관광문화홈페이지에 등록된 객실 관련 자료로, 객실 유형, 선호도, 기준인원 등 숙박시설 이용에 필요한 주요 항목을 포함하고 있습니다. 해당 데이터는 숙소별 객실 구성과 수용 규모를 파악하고, 관광객 숙박 선택 지원, 객실 정보 안내, 예약 참고자료 제공, 관광 편의 정보 관리 등에 활용할 수 있도록 구성되어 있습니다. 또한 이용 조건과 객실 특성을 비교·확인하여 숙박 정보 제공의 정확성과 활용성을 높이는 데 참고할 수 있습니다. 아울러 객실별 수용 가능 인원과 선호 특성을 함께 확인할 수 있어 여행 형태에 맞는 숙소 선택을 지원하고, 숙박시설 운영 현황 파악과 관광 서비스 품질 관리에도 활용할 수 있습니다.
