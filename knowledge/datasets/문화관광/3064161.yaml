description_portal: '경기도 평택시에 소재한 문화재의 현황을 체계적으로 정리한 자료입니다. 항목에는 문화재의 구분, 문화재명, 소재지, 지정번호, 지정년월일, 관리인 및 관리단체 등이 포함됩니다. 국가 또는 지방자치단체가 법령에 따라 지정한 유형문화재, 기념물, 사적 등 다양한 문화유산의 정보를 제공하며, 각 항목은 문화재별로 세분화되어 있습니다. 본 자료는 문화유산의 보존·관리 및 행정업무 수행을 위한 기초자료로 활용 가능하며, 학술연구, 정책 수립, 관광자원 분석 등의 목적으로도 활용될 수 있습니다. 1회성 데이터로 현행화 필요시 요청이 필요합니다.※ 문의 : 평택시 문화유산관광과(031-8024-3248)'
