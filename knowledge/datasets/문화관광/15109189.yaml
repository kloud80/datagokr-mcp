description_portal: 서울특별시 용산구의 관광지 표준데이터에 대한 상세 정보 목록입니다. 서울 한양도성(서울성곽), 후암동 조선은행 사택지, 서울 해병대사령부 초대교회, 일제 경성호국신사 계단(108계단), 찬바람재, 옛 남영동 대공분실(민주인권기념관), 옛 용산공설시장(현 남영아케이드), 전쟁기념관, 당고개 순교성지, 옛 풍국제과 공장, 용산신학교, 서울 원효로 예수성심당, 구 용산 수위관측소, 심원정 왜명강화지처비, 청암동 부군당, 산천동 부군당, 3.1운동 용산인쇄소 노동자 만세시위지, 이봉창 의사 집터, 백범김구기념관, 이봉창 의사 역사울림관, 남이장군 사당, 서울 구 용산철도병원 본관(현 용산역사박물관), 왜고개 순교성지, 천주교 순교성지 새남터 성당, 김유신 장군 사당, 노들섬 등 용산구의 대표 관광지에 대한 정보를 제공하고 있습니다. 유적지, 종교성지, 문화주택, 기념관, 전시관, 공원등의 정보와 관광지의 위치 및 운영시간 등의 정보를 제공하고 있습니다. 기타시설정보, 운영요일, 평일/토요일/공휴일별 운영 시작 및 종료시간, 요금 정보, 키워드 등을 제공합니다.
