summary_user: 한국영상자료원이 정리한 국내외 영화제의 회차별 수상 내역을 수상 건별로 담은 파일(CSV 약 38.7MB)로, 영화제명·개최년도·회차·수상부문·작품명·수상자·감독·제작국가와 애니메이션·독립영화·다큐멘터리 여부를 함께 싣는다. 연구자나 영화 관련 분석가가 '특정 감독이나 작품이 어느 영화제에서 몇 번, 어떤 부문으로 상을 받았나' 같은 질문에 쓴다. 영화작품코드와 수상자인명코드는 한국영상자료원 내부 코드라서 같은 기관의 영화·인물 데이터와 연결할 때 쓰고, 다른 기관 데이터와 공통으로 맞출 전역 조인 키는 없다.
description_portal: '본 데이터는 한국영상자료원이 수집 및 정리한 국내외 영화제의 회차별 수상정보를 기반으로 하며, 2025년 6월까지 구축된 정보를 포함하고 있습니다. 주요 영화제의 수상 내역을 체계적으로 정리한 자료로, 공공데이터로 개방하여 연구 및 다양한 활용을 지원하고자 합니다.데이터는 다음과 같은 항목들로 구성되어 있습니다:수상부문, 작품명, 대표작품명, 영화작품코드, 수상자수상곡, 인명코드부여수상자, 수상자인명코드, 수상작감독, 제작국가, 제작년도, 기타, 영화제명, 영화제영문명, 영화제개최년도, 영화제회차, 영화제개최시작일, 영화제개최종료일, 개최장소, 개최월, 분류, 개최국, 상세내용, 애니메이션여부, 독립영화여부, 다큐멘터리여부해당 데이터는 한국영상자료원이 보유한 정보에 기반하여 구축되었으며, 문화예술 분야의 공공성과 활용도를 높이기 위해 지속적으로 보완·갱신될 예정입니다. - 데이터기준일 : 2026년 6월 30일'
