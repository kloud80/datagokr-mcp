summary_user: 인천광역시 남동구에 소재한 국내여행업체를 업체 한 곳당 한 행으로 담은 파일로, 업종·상호·도로명 소재지·전화번호·데이터 기준일이 들어 있으며 CSV 파일 크기가 1,817바이트에 불과한 소규모 목록이다. 남동구 안에서 국내 여행상품을 다루는 업체가 어디에 있고 연락처가 무엇인지 확인하려는 주민이나, 구 단위 여행업 분포를 살피는 분석가가 쓴다. 등록번호·사업자번호 같은 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 전역 조인 키가 없어 관광사업 등록 원장이나 다른 지자체 여행업 데이터와 정확히 연결하기 어렵고, 상호·주소 매칭에 기대야 한다. 범위는 남동구 한 곳의 개별 업체에 한정된다.
