description_portal: 정책브리핑 정책뉴스 API는 대한민국 정부의 주요 정책 동향과 관련 뉴스를 신속하게 제공하여 국민이 정책 정보를 쉽게 확인할 수 있도록 지원합니다. 카드뉴스, 인포그래픽, 사실 확인 등 다양한 형식의 콘텐츠를 포함하고 있으며, 기사 제목, 부제목, 기사 내용, 승인일 등 상세한 정보를 제공합니다. 정책 결정 과정과 결과를 투명하게 전달함으로써 국민의 알 권리를 보장하고, 정책에 대한 이해와 참여를 높이는 데 활용할 수 있습니다. 언론, 연구기관, 일반 국민 등 다양한 이용자가 정책 자료를 신뢰성 있게 활용할 수 있도록 설계되었습니다.
