description_portal: 부천시 공공도서관의 오디오북 대출 이력을 정리한 데이터셋입니다. 2019년부터 2021년까지 3년간 대출된 오디오북을 대상으로 자료명(도서명), 대출일시, 반납일시, 이용도서관, 회원구분, 자료유형, 대출채널(모바일·웹) 등 기본 속성을 제공합니다. 기간 필터링과 월별·분기별 집계가 가능하며, 인기 작품 순위, 계절성, 요일·시간대 이용 패턴, 연령대별 청취 성향을 분석할 수 있습니다. CSV와 XLSX 등 표준 형식으로 제공되어 시각화, 대시보드 구축, 서비스 개선 및 콘텐츠 구매 계획 수립의 근거자료로 활용됩니다
