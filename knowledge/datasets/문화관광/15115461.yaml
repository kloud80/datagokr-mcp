summary_user: 서울특별시 중랑구에서 비디오물제작업(영화 등 비디오물 제작·복제) 인허가를 받은 업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·사업장명·좌표 등을 포함한다. 영상 제작사를 찾는 사업자나 지역 콘텐츠 산업을 보는 분석가가 '중랑구에서 지금 영업 중인 비디오물 제작업체는 어디이고 언제 인허가를 받았나' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중랑구의 영화제작과 같은 비디오물을 제작하거나 복제하는 업소정보입니다. 영업상태명, 전화번호, 주소, 사업장명 등의 정보를 포함합니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
