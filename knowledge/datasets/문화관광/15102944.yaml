summary_user: 경상남도에 등록된 여행사를 업체 한 곳당 한 행으로 담은 파일로, 시군명·업종분류(종합·국내외·국내)·업체명·소재지를 담는다. 여행객이나 사업자가 '우리 시군에 등록된 국내외여행업체는 어디인가'를 확인하거나, 분석가가 시군별 여행업 분포를 세는 데 쓴다. 전역 조인 키가 없어 다른 관광사업 등록 데이터나 사업자 정보와는 업체명·소재지 주소 문자열 매칭이나 시군명 기준으로만 이어 쓴다.
limits: 등록번호나 사업자번호 같은 공통 키가 실측 컬럼에 없어 다른 데이터와 정확히 연결하기 어렵고, 이름·주소 매칭에는 오류가 생길 수 있다. 범위는 경상남도 한 곳뿐이라 전국 비교에는 다른 시도 자료가 따로 필요하다.
