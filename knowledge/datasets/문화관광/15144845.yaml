description_portal: '이 데이터는 도서관에서 소장하고 있는 책의 상세 정보를 담고 있습니다. 고유식별번호를 통해 각 도서를 유일하게 구분할 수 있으며, 대표책 여부 및 책 부록 여부로 도서 구성 상태를 확인할 수 있습니다. 매체구분명과 이용대상명은 해당 자료가 어떤 형태(예: 인쇄도서, 전자책 등)이며 누구를 위한 것인지(예: 아동, 일반 등)를 알려줍니다. 권일련번호는 도서의 권차를 나타내며, 저작자는 저자명을 제공합니다. 발행년도와 크기, 딸림자료 항목은 도서의 기본적인 물리적 특성을 설명하고, 별치기호, 분류기호, 도서기호, 권책기호는 도서 분류 및 위치 정보를 포함합니다. 마지막으로 자료실명은 해당 도서가 소장된 도서관 내의 위치를 나타냅니다. 이 데이터는 도서 검색, 분류, 이용자 맞춤형 서비스 제공 등 다양한 공공 및 민간 서비스 개발에 유용하게 활용될 수 있습니다.※본 데이터의 "서지키"와 [경기도 과천시_도서관 색인정보]의 "고유식별번호"를 매핑할 경우 도서명을 조회할 수 있습니다.'
