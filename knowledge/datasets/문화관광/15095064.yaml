summary_user: 인천국제공항 여객터미널에 입점한 매장·편의시설을 시설 한 건 단위로 담은 원천 목록으로, 시설명·대/중/소 분류·취급품목과 브랜드·위치·터미널과 층·입출국 구분·서비스 시간·전화번호를 다국어로 제공한다. 공항 이용객이나 여행 앱 개발자가 '제2터미널 출국장 면세구역에 이 브랜드 매장이 있고 몇 시까지 여는가' 같은 질문에 답할 때 쓴다. 실측 컬럼에 다른 데이터와 잇는 전역 조인 키는 없어, 터미널 구분(terminalid)이나 시설명·브랜드명을 이름 매칭하거나 같은 기관(인천국제공항공사)의 다른 데이터와 터미널 코드로만 연결한다.
description_portal: 인천국제공항공사에서제공하는 여객 터미널 시설 정보 현황에 대한 데이터입니다. 인천국제공항에 입점한 매장 및 시설 데이터를 다국어로 제공하며 언어,지역,시설명,입/출국으로 구분하여 시설번호, 입/출국 구분,취급품목,시설명,위치,시설 대/중/소 분류, 서비스 시간, 지역 구분,터미널 구분, 층 구분,취급품목브랜드 등을 제공합니다. 조회일을 기준으로 데이터를 조회하실 수 있습니다. 개발 계정 일 1000 트래픽, 운영 계정 신청 시 일 1000000 트래픽을 제공합니다. 데이터 포맷은 JSON과 XML을 모두 제공합니다.
