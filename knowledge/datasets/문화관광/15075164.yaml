description_portal: 이 데이터는 토끼섬 과 하도포구 에 대해 위도·경도, 장소명칭, 상세위치정보, 무장애 관광 편의시설 정보를 포함한 구조화된 공공데이터로, 장애인·고령자·유아 동반자 등 누구나 이용 가능한 열린 관광지를 지향합니다. 토끼섬은 우리나라에서 유일하게 문주란 이 자생하는 섬으로, 하도리 해안 인근 해안누리길과 연계되어 자연경관과 바다 조망을 안전하고 편리하게 즐길 수 있는 관광 자원이며, 하도포구는 포구 특유의 해양경관과 어촌 풍경이 어우러지는 공간입니다. 이 데이터는 무장애 여행 경로 설계, 관광 안내자료 제작, 관광 정책 수립, 관광자원 관리 등에 활용 가능하며, CSV 형식으로 무료 제공됩니다.
