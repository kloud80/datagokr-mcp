summary_user: 국립박물관문화재단의 박물관 상품 브랜드 뮷즈(MU:DS) 상품의 분기별 인기 순위를 담은 집계 파일로, 순위별로 1~4분기 각각의 상품 구분과 상품명을 나란히 담는다(약 5.8KB 규모의 CSV). 박물관 굿즈를 고르거나 기획하는 사람이 '분기마다 어떤 뮷즈 상품이 인기 상위였고 순위가 어떻게 바뀌었나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 상품명이나 기관 단위로만 느슨하게 이어 볼 수 있다.
description_portal: 국립박물관문화재단 박물관상품의 분기별 인기관심도 정보로, 순위, 상품명 등의 항목을 포함하고 있습니다.뮷즈(MU:DS)란 국립박물관이 소장한 문화유산을 모티브로 많은 사람들이 일상에서 가깝게 느끼고 사용할 수 있도록 만든 국립박물관문화재단의 박물관 상품 브랜드로 박물관 문화유산의 고유한 가치에 오늘날의 쓰임새를 더해 유물을 소장하는 즐거움을 제공하고 박물관에서의 좋았던 순간을 일상에서 두고두고 이어가고 싶은 마음을 채웁니다.데이터를 통해 분기별 인기상품 추이를 한번에 확인할 수 있습니다.해당 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 문의해주시기 바랍니다.
