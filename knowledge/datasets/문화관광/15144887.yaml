description_portal: '대구광역시 달서구의 달서맛나 지정음식점 현황 데이터로 모범음식점, 안심음식점, 나트륨줄이기 음식점으로 구분되어 있습니다.해당 데이터는 구분, 업체명, 주소, 전화, 업태, 주요음식의 항목으로 구성되어 있으며, 1년마다 주기에 따라 업데이트 합니다.-모범음식점: 모범업소 지정 및 운영관리 규정에 의거 식품위생법(시설기준, 영업자 등의 준수사항, 모범업소 지정기준 등) 및 좋은식단 이행기준을 준수하고 위생관리상태와 서비스수준 등이 우수한 일반음식점 -나트륨줄이기음식점: 10%이상 나트륨을 저감하여 1인분량 나트륨이 1,300mg미만인 메뉴 또는 30%이상 나트륨을 저감한 메뉴를 전체메뉴의 20%이상 운영하는 음식점-안심음식점: 코로나19의 장기화로 어려움을 겪는 외식업계의 경영난을 해소하고 지역민과 관광객이 믿고 이용할 수 있도록 지정기준을 준수한 업체달서맛나 홈페이지: https://food.dalseo.daegu.kr/ 에서 확인가능합니다.'
