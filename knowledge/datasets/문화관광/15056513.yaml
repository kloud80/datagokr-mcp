summary_user: 한국체육산업개발이 운영하는 올림픽공원 스포츠센터의 공지사항을 게시물 한 건 단위로 담는 원천 데이터로, 제목·등록일·본문 설명·작성자 등을 제공하며 포털 설명상 2025년 기준 792건이다. 올림픽공원 스포츠센터 이용자나 지역 주민이 회원모집 일정, 휴관 안내, 각종 이벤트 공지를 확인하거나 모아 볼 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 제목·키워드 같은 이름 매칭이나 같은 기관의 다른 데이터로만 이어 쓴다.
description_portal: 국체육산업개발의 올림픽공원 스포츠센터정보(공지)를 외부 개발자 및 사용자가 이를 활용 할 수 있도록 전달하는 API 서비스입니다. 올림픽공원 스포츠센터정보(공지) 목록정보와 상세정보 등 다양한 정보를 제공합니다.스포츠센터 커뮤티니 공지사항에서도 정보를 제공하고 있습니다.https://www.ksponco.or.kr/sports/board.es?mid=a60301000000&bid=00052025년 기준 792건 데이터를 제공중에 있으며,회원모집 안내, 폐전지 수거 캠페인, 회원등록 ESG이벤트, 휴관안내, SNS 이벤트, 청렴캠페인, SNS 팔로우 이벤트 등 정보제공하고 있습니다.
