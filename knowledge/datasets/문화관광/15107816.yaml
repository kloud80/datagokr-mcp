summary_user: 광명스피돔 등에서 열린 경륜 경주의 결과를 경주 한 건 단위로 담으며, 경주일자·경륜장·회차·경주번호와 1~3위 입상 선수, 단승·연승·쌍승·복승·삼복승 등 승식별 배당값을 함께 기록한다. 경륜 팬이나 분석가가 특정 날짜 경주의 입상 순위와 쌍승식 배당을 확인하거나, 회차별 입상 패턴으로 예측 모델을 만들 때 쓴다. 전역 조인 키는 없어서, 같은 공단의 다른 경륜 데이터와는 경주일자·경륜장명·경주번호 조합이나 이름 매칭으로만 잇는다.
description_portal: 경륜-경주결과 데이터는 국민체육진흥공단이 광명스피돔에서 시행하는 경륜 경주의 결과 정보를 체계적으로 제공하는 공공데이터입니다. 경주가 열린 날짜, 경륜장, 회차 및 경주번호 등 기본 정보와 함께, 각 경주별로 1~3위에 입상한 선수의 번호와 이름을 확인할 수 있습니다. 또한 단승, 복승, 쌍승, 삼복승, 연승, 쌍복승, 삼쌍승 등 다양한 승식에 따른 배당률과 그에 따른 매출액도 함께 포함되어 있어, 경주 결과에 대한 전반적인 데이터를 통합적으로 파악할 수 있습니다. 이 데이터는 경륜 팬과 연구자들이 경주 결과를 분석하거나 예측 모델에 활용할 수 있는 기반 자료로 활용되며, 경륜 산업의 투명성과 신뢰성을 높이는 데 기여합니다.
