summary_user: 전국 캠핑장 4,203곳을 캠핑장 한 곳당 한 행으로 담은 파일 데이터로, 캠핑장명과 시도·시군구, 주소를 싣는다. 지역별 캠핑장 분포를 파악하거나 가려는 지역에 캠핑장이 어디 있는지 찾는 국민·분석가·서비스 개발자가 쓴다. 조인 키는 주소(address)뿐이어서 주소 기반 지오코딩이나 지도 서비스, 다른 관광 데이터와 주소를 기준으로 맞춰 이어 쓴다.
description_portal: 전국 캠핑장 이름, 주소, 시도, 시군구 정보를 포함한 데이터는 공공데이터로 제공되어 각 캠핑장의 위치와 기본 현황을 쉽게 파악할 수 있습니다. 캠핑장 관련 정보를 포함하고 있으며, 특화캠핑, 테마별캠핑, 장소별 캠핑 시 활용 가능합니다. 각 지역별 캠핑장 분포와 운영 현황 분석, 캠핑장 추천 및 예약 서비스, 관광 인프라 연구 등 다양한 서비스 개발과 정책 수립에 활용 가능합니다. 또한 지도 기반 서비스와 연계하여 사용자맞춤형 캠핑장 안내, 주변 관광지 및 먹거리 정보 등에도 활용 가능합니다. 실제 영업여부는 캠핑장 확인이 필요합니다. 참고자료로 활용 바랍니다.
