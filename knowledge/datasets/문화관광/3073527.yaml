summary_user: 남양주시에 신고된 체육시설업(체육도장·당구장·스크린골프장·수영장·승마장 등)을 업소 한 곳당 한 행으로 담은 파일로, 업종·상호·지번 및 도로명 주소를 담는다. 남양주에서 어느 동네에 당구장이나 체육도장이 몰려 있는지 알아보려는 주민·창업 예정자, 민간 체육시설 분포를 상권 흐름과 견주려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·주소를 맞추거나 주소를 지오코딩해 상권·인구 데이터와 지역 단위로 묶어 쓴다.
