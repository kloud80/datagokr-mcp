summary_user: 인천 미추홀구 안에서 운영 중인 체력단련장(헬스클럽·피트니스센터 등)을 시설 한 곳당 한 행으로 담은 명부로, 상호명·구분·도로명/지번주소·전화번호·위도·경도를 포함하며 약 14KB 분량의 CSV 파일이다. 구민이 집 근처 헬스장을 찾거나, 분석가·사업자가 "미추홀구 어느 동네에 체력단련장이 몰려 있고 어디가 비어 있나"를 따지는 데 쓴다. 인허가번호·사업자번호 같은 전역 조인 키는 없어서 다른 데이터와는 주소·좌표(위도·경도)나 상호명으로 맞춰 붙여야 하며, 상권·인구 데이터와 함께 지도 위에 겹쳐 쓰는 방식이 현실적이다.
limits: 범위가 미추홀구 한 곳뿐이라 다른 시군구와의 비교에는 따로 자료를 모아야 한다. 전역 조인 키가 없어 LOCALDATA 체육시설업 인허가 자료나 상권 데이터와 정확히 연결되지 않고, 상호명·주소 매칭에 기대야 한다. 개업·폐업 일자 필드가 없어 시점별 개폐업 추이는 이 파일만으로 보지 못한다.
