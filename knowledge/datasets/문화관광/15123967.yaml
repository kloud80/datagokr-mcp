summary_user: 경기도 양평군 안의 서원(운계서원·수곡서원)을 한 곳당 한 행으로 담은 파일로, 서원 명칭·관련 단체·도로명/지번 주소·위도·경도·데이터기준일을 담는다. 양평군의 서원이 어디에 있는지 지도에 표시하거나 지역 역사 자원 탐방 경로를 짜려는 주민·관광 분석가가 쓴다. 전역 조인 키나 국가유산 종목코드·지정번호가 없어 국가유산청 유산 목록과는 서원 이름이나 주소로 맞춰 이어야 하고, 위도·경도로 다른 위치 데이터와 공간 결합한다.
limits: 파일이 473바이트로 서원 두 곳만 담은 양평군 한정 목록이며 국가·시도 지정 여부나 지정번호 같은 유산 지정 정보는 없다. 다른 유산 데이터와 잇는 공통 코드가 없어 이름·주소 매칭에 의존해야 한다.
