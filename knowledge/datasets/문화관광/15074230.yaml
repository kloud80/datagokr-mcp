summary_user: 서산시가 운영하는 '서산여행' 앱에 실린 주요 관광명소를 명소 한 곳당 한 행으로 담은 목록으로, 명칭·주소·좌표(위치(GPS))·해설·데이터 기준일자가 들어 있다(CSV 약 41KB). 서산 여행을 계획하는 관광객이나 지역 관광 서비스를 만드는 사업자가 '서산에서 가볼 만한 명소는 어디이고 어떤 곳인가'를 확인하고 지도에 표시하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 명소 이름이나 주소·좌표를 맞춰 대조하는 방식으로만 이어 쓴다.
description_portal: 이 데이터는 서산시청에서 운영하는 ‘서산여행’ 앱에 수록된 주요 관광지 정보를 정리한 공공자료이다. 항목은 관광명소명, 주소, 위치, 해설, 데이터기준일로 구성되며, 서산시를 찾는 관광객에게 명소 정보를 제공하고자 한다. 관광명소명은 관광지의 정식 명칭을, 주소는 행정구역 기준 위치를 나타낸다. 위치 항목은 지도 기반 좌표를 포함하며, 해설은 관광지의 특징과 역사 등을 설명한다. 데이터기준일은 정보의 최신성을 나타내는 기준이다. 본 자료는 여행 계획 수립, 관광 홍보 콘텐츠 제작, 지역 관광자원 활용, 위치기반 서비스 제공 등 다양한 분야에서 활용된다. 또한 행정기관의 관광 정책 수립 및 민간 서비스와의 연계에도 활용 가능한 기반 자료이다.
