summary_user: 동대문구 이문체육문화센터가 2018년 2월 기준으로 운영한 체육·문화 프로그램을 프로그램 한 건씩 분야, 프로그램명, 시간, 요일, 대상, 수강료, 정원으로 담은 CSV 파일(약 13KB)이다. 동대문구 주민이 이문체육문화센터에서 어떤 요일·시간대에 어떤 수강료로 들을 수 있는 강좌가 있었는지 확인하거나, 분석가가 구립 체육시설의 프로그램 구성과 수강료 수준을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·프로그램명 같은 이름 매칭이나 같은 기관(동대문구시설관리공단)의 다른 시설 현황 파일과 묶어 쓰는 방식으로만 연결한다.
limits: 2018년 2월 한 시점의 프로그램 현황이며 생성 후 바뀌지 않는 파일이라 현재 개설 강좌나 수강료로 보면 안 된다. 명세상 범위가 전국으로 표시돼 있지만 실제 내용은 이문체육문화센터 한 곳의 프로그램이고, 좌표 같은 공간 정보도 없다.
