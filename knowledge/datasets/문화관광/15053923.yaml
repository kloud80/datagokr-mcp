summary_user: 울산시설공단이 운영하는 종합운동장의 시설·세부시설별 이용요금을 사용기준 시간과 구분별로 평일·주말공휴일 요금(원), 시 주최 행사 및 장애인 감면율(%), 유의사항과 함께 담은 소규모 요금표 파일(CSV 795바이트)이다. 울산 시민이나 행사 주최자가 '주말에 종합운동장 보조경기장을 몇 시간 빌리면 얼마이고 장애인 감면은 몇 %인가' 같은 대관 비용 질문에 쓴다. 전역 조인 키가 없어 다른 체육시설 현황·예약 데이터와는 시설명을 맞추거나 같은 기관(울산시설공단) 데이터끼리만 이어 쓴다.
description_portal: 울산시설공단은 시민들이 종합운동장을 보다 편리하고 효율적으로 이용할 수 있도록 다양한 시설의 이용 요금 정보를 체계적으로 제공하고 있습니다. 이 데이터는 시설명, 세부시설, 관리기관 전화번호, 사용기준(시간), 구분, 평일 이용 요금(원), 주말 공휴일 이용 요금(원), 시 주최 행사 감면 사항(퍼센트), 장애인 감면 사항(퍼센트), 유의사항, 데이터기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 시민들은 각 시설의 사용 조건과 요금 기준을 명확히 파악할 수 있으며, 행사 목적, 이용 시간대, 사용자 유형에 따른 감면율을 사전에 확인할 수 있어 이용 계획을 세우는 데 큰 도움이 됩니다.
