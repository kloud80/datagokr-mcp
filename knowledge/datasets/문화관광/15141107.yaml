summary_user: 서울특별시 은평구에 등록된 게임물배급업체의 인허가 현황을 업소 한 곳당 한 행으로 담으며, 상호명·지번/도로명 주소·인허가일·폐업일·영업상태·중부원점TM 좌표(X, Y)가 들어 있다. 은평구에서 지금 영업 중인 게임 배급·유통업체가 어디에 몇 곳 있는지, 언제 등록하고 언제 폐업했는지를 확인하려는 지자체 담당자나 게임 산업 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 자치구의 같은 업종 인허가 데이터와는 개방자치단체코드(OPNSFTEAMCODE)·관리번호 같은 같은 기관 코드나 주소·상호명 매칭으로 연결한다.
description_portal: '은평구의 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 업소정보* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.해당 데이터는 서울특별시 은평구 내에서 제작되거나 수입된 게임물을 유통시키거나, PC방 등 게임 제공업소에 공급하는 게임물배급업체들의 인허가 현황을 담고 있습니다 . 데이터에는 각 업체의 상호명, 소재지 주소, 최초 등록일, 현재 영업 상태(영업중, 폐업 등)와 같은 게임 산업 유통망 관리의 핵심 정보가 포함되어 있습니다 .이 데이터는 게임 제작사와 소비자를 연결하는 중간 다리 역할을 하는 게임 산업의 유통 구조를 파악하는 데 중요합니다. 특히, PC, 모바일, 콘솔 등 다양한 플랫폼으로 게임이 유통되는 현재, 이 데이터는 지역 내 게임 퍼블리셔나 유통사의 분포와 규모를 보여줍니다 . 또한, 「게임산업진흥에 관한 법률」에 따라 등급분류를 받지 않은 불법 게임물의 유통을 막고, 건전한 게임 산업 생태계를 조성하기 위해 지자체가 관련 업체를 관리·감독하는 데 필수적인 기초 자료로 활용됩니다 .'
