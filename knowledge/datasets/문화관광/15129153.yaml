summary_user: 경상북도 영천시 관내에서 공중위생관리법에 따라 허가받은 일반·생활 숙박업소를 업소 한 곳당 한 행으로 담은 현황 파일(약 7KB CSV)로, 업종명·업소명·도로명 주소·전화번호·데이터 기준일자를 담는다. 영천시를 찾는 여행객이나 숙박 시장을 조사하는 분석가가 '영천시에 어떤 숙박업소가 어디에 있고 연락처는 무엇인가'를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어서, 다른 데이터와는 업소명·도로명 주소를 맞추거나 공중위생법 인허가 공통 원천(LOCALDATA) 숙박업 자료와 이름·주소로 대조하는 방식으로만 이어 쓴다.
description_portal: 해당 데이터는 경상북도 영천시 내 숙박업 허가 현황을 상세하게 기록한 자료입니다. 공중위생관리법에 의거하여 영업 허가를 받은 생활 숙박업과 일반 숙박업과 관련된 데이터로 포함하고 있으며 관광진흥법에 의거한 관광 숙박업은 해당되지 않습니다.영천시 관내에서 운영 중인 숙박업소들의 업종명, 업소명, 영업장 주소, 전화번호, 데이터 기준일자 등의 정보를 포함하고 있으며, 허가를 받은 숙박업소들의 최신 현황을 파악하는 데 유용하게 활용될 수 있습니다. 본 데이터는 영천시 내 숙박업소의 위치와 연락처, 허가 일자 등을 체계적으로 정리하여 제공함으로써, 관련 기관의 정책 수립과 지역 관광 활성화, 민원처리, 통계 분석 등에 기초 자료로 활용될 수 있습니다. 해당 데이터와 관련하여 궁금하신 사항이 있으실 경우 영천시 보건위생과로 연락주시기 바랍니다.
