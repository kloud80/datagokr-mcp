description_portal: 1. 전국 문화기반시설 총람은 전국의 문화기반시설에 대한 각종 정보를 제공함으로써 이용자들의 문화향수기회를 확대하고 궁극적으로 국민들의 문화기본권을 신장시키고자 2003년부터 발간하고 있습니다.2. 총람에 수록된 문화기반시설별 운영현황은 문화기반시설을 직접 운영하고 있는 지방자치단체, 법인, 개인 등으로부터 제출받은 자료를 기초로 작성되었습니다.3. 문화기반시설 중 도서관, 박물관, 미술관, 생활문화센터, 문예회관, 지방문화원, 문화의 집 등의 기초정보를 제공하고 있으며, 수록된 통계의 기준시점은 2025. 1. 1. 입니다.
