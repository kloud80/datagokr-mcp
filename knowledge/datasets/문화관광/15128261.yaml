summary_user: 경기도 가평군 관내 체육시설업을 업체 한 곳당 한 행으로 담은 건별 명부로, 업종·업체명·도로명주소·위도·경도·시설면적·운영형태·실내외 구분 등을 담는다(CSV 약 15KB). 가평군에서 골프장·헬스장·당구장 같은 체육시설업이 어디에 얼마나 분포하는지, 민간 체육시설이 늘고 줄어드는 상권 흐름을 보려는 분석가·사업자가 쓴다. 전역 조인 키가 없어 도로명주소·좌표나 시군구명으로 상권·인허가 데이터와 공간·이름 매칭해 이어 쓴다.
description_portal: 해당 데이터는 경기도 가평군 관내에서 운영 중인 체육시설업 현황을 정리한 자료로, 지역 주민의 건강 증진과 여가 활동 지원을 위한 체육 인프라 분포를 파악하는 데 활용됩니다. 데이터 항목에는 시도명, 시군구명, 업종명, 시설명, 도로명주소, 우편번호, 전화번호, 위도, 경도 등의 일반 정보와 더불어, 시설유형명, 시설면적, 운영형태코드(공공 또는 민간 운영 여부), 실내외 구분명, 국가체육시설 여부, 자율점검 대상 여부, 시설구분명, 데이터 기준일자 등이 포함되어 있습니다. 본 자료는 「체육시설의 설치·이용에 관한 법률」에 따라 체육시설의 등록 및 관리 기준에 기반하여 수집되며, 공공체육서비스 확대, 민간 체육산업 육성, 지역 체육정책 수립 등을 위한 기초 데이터로 활용될 수 있습니다.
