summary_user: 국립해양유산연구소가 수중 발굴·조사·연구 과정에서 만든 영상의 목록을 영상 한 편 단위로 담으며, 전체 건수는 8건이다. 해양유산 수중 발굴 현장이 어떻게 진행되는지 영상으로 보고 싶은 연구자·교사·일반 국민이 교육·홍보 자료를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 영상 이름(smvideoNm)이나 같은 기관의 발굴 정보와 이름으로 맞춰 잇는 방식으로만 연결한다.
description_portal: 이 서비스는 국가유산청 국립해양유산연구소에서 수행한 수중 발굴 및 조사·연구 과정에서 생산된 다양한 영상 자료를 제공합니다. 사용자는 제공된 검색 파라미터를 활용하여 특정 발굴 조사 항목이나 시기, 지역 등을 기준으로 원하는 영상을 목록 형태로 조회할 수 있으며, 각 영상에 대한 상세 정보와 함께 영상 URL도 확인할 수 있습니다. 이를 통해 연구자뿐만 아니라 일반 국민도 해양유산 조사 과정을 보다 쉽게 접하고 이해할 수 있으며, 학술적 활용은 물론 홍보 및 교육 자료로도 유용하게 활용될 수 있습니다.
