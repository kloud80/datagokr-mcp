summary_user: 대구광역시에 소재한 민간 체육시설업소를 업소 한 곳당 한 행으로 담은 명부 파일로, 업종·업소명·소재지를 담는다(csv 약 66KB). 헬스장·당구장·골프연습장 같은 체육시설업이 대구 어느 지역에 몰려 있는지 알아보려는 창업 예정자나 지역 체육 인프라를 분석하는 사람이 쓴다. 전역 조인 키가 없어 다른 데이터와는 소재지 주소나 업소명을 맞춰 붙여 쓰고, 상권·인허가 데이터와 같은 축으로 비교하는 데 쓴다.
description_portal: 대구광역시에 소재한 체육시설업 현황에 대한 자료로 체육시설업종, 체육시설업소명, 소재지 등의 데이터를 제공합니다. 체육시설의 설치 및 이용에 관한 법률에 따라 체육시설업은 등록체육시설업과 신고체육시설업으로 구분되며, 체육시설업의 운영형태와 규모에 따라 구분됩니다. 해당 데이터는 민간체육시설업의 활성화를 위한 정책 수립의 기초자료로 활용되며, 국민의 체육활동 성향과 여가활동의 방향을 예측하는 데에도 유용합니다. 또한 지역별 체육시설업 현황을 파악하여 지역 균형 발전과 체육 인프라 확충에 기여할 수 있습니다.
