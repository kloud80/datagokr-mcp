summary_user: 대구광역시 북구가 정한 관광코스를 코스 한 건당 한 행으로 담은 작은 목록 파일(csv, 1161 bytes)로, 코스명·이동경로·거리(km)·소요시간을 담는다. 북구를 찾는 여행객이나 지역 관광 안내를 만드는 사람이 "북구에서 2시간 안에 걸을 수 있는 역사 탐방 코스는 무엇인가" 같은 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어서, TourAPI 관광지 정보 등 다른 데이터와는 코스 경로에 나오는 장소 이름을 직접 맞춰야 이어 쓸 수 있다.
description_portal: '대구광역시 북구 관광코스에 대한 데이터로 관광코스명, 코스별 이동경로, 소요시간, 거리 등의 항목을 제공합니다.1. 데이트코스 : 3.3km, 54분, "사랑"이 싹트는 북구여행2. 금호강바람코스 : 13km, 1시간 30분, "금호강"의 아름다운 경치와 문화여행3. 북구역사속으로 : 11.1km, 1시간 45분, "오랜 역사"속의 유적지를 찾아서4. 시장여행길 : 14km, 1시간 20분, 사람 냄새와 인정이 넘쳐나는 북구의 전통시장들5. 근대산업거리 : 6.8km, 자동차 30분, 근대산업거리 탐방여행6. 동화천역사탐방로 : 6.91km, 1시간 45분, 도심 속 동화천따라 역사탐방여행7.경제신화 도보길 : 4km, 3시간, 대구 근대산업역사의 길을 걷다8. 칠곡도호부 옛길 : 2.5km, 2시간,  옛 칠곡도호부의 흔적을 이은 도보여행'
