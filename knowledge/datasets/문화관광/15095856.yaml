summary_user: 국악방송이 매년 여는 국악 창작곡 경연 「21세기 한국음악 프로젝트」의 역대 수상 내역을 수상곡 한 건씩 담은 CSV 파일(약 7KB)로, 연도·참가 단체명·곡명·수상 구분·공연자 수를 담는다. 국악 연구자나 공연·방송 기획자가 "어느 해에 어떤 단체가 어떤 창작곡으로 무슨 상을 받았고, 연도별로 편성 규모가 어떻게 달라졌나"를 확인하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연ID 같은 외부 키로는 바로 붙지 않고, 단체명·곡명을 이름으로 맞춰 공연 목록 등과 연결해야 한다.
description_portal: 본 공공데이터는 국악방송에서 매년 주최하는 국악 창작곡 경연 행사인 「21세기 한국음악 프로젝트」의 운영 결과를 바탕으로, 연도별 수상 내역을 체계적으로 정리·제공하는 자료입니다. 본 데이터에는 각 연도별 행사에 참여한 참가 단체 또는 개인, 출품된 국악 창작곡의 명칭, 수상 구분 등 주요 수상 관련 정보가 포함되어 있어, 해당 연도의 수상자 및 수상곡 현황을 종합적으로 확인할 수 있습니다. 또한 이를 통해 연도별 참가 주체와 작품 구성, 수상 경향을 한눈에 파악할 수 있도록 구성되어 있습니다. 본 공공데이터를 활용하면 「21세기 한국음악 프로젝트」의 역대 수상 이력과 축적된 성과를 체계적으로 살펴볼 수 있으며, 이를 바탕으로 국악 창작곡의 시대별 흐름과 변화, 창작 주체의 다양성, 작품 경향 및 발전 양상 등을 연도별로 비교·분석할 수 있습니다. 아울러 본 데이터는 국악 창작 분야에 대한 학술 연구와 통계 분석은 물론, 국악 정책 수립 및 평가, 문화예술 콘텐츠 기획, 방송·공연·교육 자료 개발 등 다양한 공공·민간 영역에서 폭넓게 활용될 수 있는 기초 자료로서의 가치를 지니고 있습니다.
