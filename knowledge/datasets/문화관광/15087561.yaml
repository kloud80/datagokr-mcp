summary_user: 서귀포시 공영관광지의 시설명, 이용 가능 시작·종료 시간, 휴무일, 특이사항, 주소, 전화번호, 위도·경도를 시설 한 곳당 한 행으로 담은 작은 CSV 파일(약 2.4KB)이다. 관광객이나 여행 안내 서비스가 '서귀포 공영관광지 중 오늘 몇 시까지 열고 휴무일은 언제인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 목록 등 다른 데이터와는 시설명이나 주소·좌표를 맞춰 이어 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘공영관광지 통합예약 이용정보’ 데이터는 서귀포시 공영관광지의 통합 예약 시스템을 통해 확인 가능한 입장료, 주차료, 할인 정보 및 기본 위치 정보를 포함한 공공자료입니다.데이터 항목은 시설명, 사용료 구분, 일반요금, 주차요금 여부, 할인 여부, 소재지 주소, 문의전화, 예약 가능 여부 등으로 구성되어 있으며이를 통해 주민 및 관광객에게 정확한 요금 정보를 안내할 수 있고, 관광지 요금 체계 분석, 접근성 기반 요금 정책 개선, 통합예약 시스템 운영 실태 분석 등에 활용될 수 있습니다.특히 지역 공공관광지의 요금 체계 투명성 확보, 관광객 예산 안내, 할인 적용 현황 추적, 예약편의성 평가, 관광정책 수립 및 요금 전략 마련을 위한 기초자료로 매우 유용한 데이터입니다.
