description_portal: '○ 통계개요* 통계명 : 주요 관광지점 입장객(자치구별)* 통계종류 : 서울시 주요 관광지점 입장객 현황을 제공하는 일반·보고통계(승인번호 제11305호)* 작성목적 : 주요 관광지점 입장객 통계의 생산및배포를 통해 관광객 수요 추정 및관광시설 공급 판단의 기초자료로 활용* 조사체계 : 기초지자체(관광지점등록 및 통계입력)→광역지자체→문화체육관광부* 작성방법 : 관광지식정보시스템을 이용한 집계* 공표주기 : 정기(매년)* 공표범위 : 지역 - 서울시 및 자치구내용 - 자치구별내의 주요관광지점의 입장객 수○ 용어설명* 입장객 : 관광지 및 관광시설의 물리적 공간 안으로 이동하는 모든 사람을 말함○ 기 타* 개별관광지에 대한 입장객집계자료로서 지방자치단체 또는 특정지역의 관광객총량과 상이하므로 자료 활용 시 해당 관광지 방문객 수요로만 활용할 수 있음* 관광지별로 방문객 및 이용객을 집계함에 따라 조사대상기간 중 한명의 방문객 및이용객이 여러 관광지에 중복 집계될 수 있음'
