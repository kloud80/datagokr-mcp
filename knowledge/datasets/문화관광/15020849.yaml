description_portal: 이 데이터는 문화예술후원매개단체 및 문화예술후원우수기관 인증제도의 2018년도 인증 현황에 대한 내용입니다. 각 구성 항목으로는 인증연도, 인증구분, 등록번호, 단체 및 기관명, 조직형태로 구성되어 있으며, 데이터의 개수는 총 5개(행)로 구성되어 있습니다. 인증연도는 모두 2018년으로 동일하고, 인증 구분은 전부 문화예술후원우수기관으로 표기되어 있습니다. 등록번호는 제31호부터 제35호까지 연번으로 지정되어 있으며, 조직형태는 중소기업, 대기업, 공공기관 등 다양한 유형으로 구성되어 있습니다. 따라서 파일에서 해당 연도의 인증 현황을 기관별로 비교하거나 유형별 분석도 가능합니다.
