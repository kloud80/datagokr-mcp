summary_user: 서울특별시 성동구 안의 전통사찰을 한 곳씩 담은 인허가 원천 목록으로, 인허가·취소일자, 영업상태와 상세상태, 소재지 지번·도로명 주소와 좌표, 승려 수·신도 수, 창건일과 연혁, 지정해제 여부와 사유가 들어 있다. 성동구 주민이나 연구자가 "구 안에 운영 중인 전통사찰이 어디에 있고 언제 지정되거나 해제됐는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사찰명·주소 같은 이름 매핑이나 같은 기관 코드(개방자치단체코드)로만 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 불교 신앙의 대상으로서 형상을 봉안하고, 승려가 수행하며 신도의 교화 및 신행 활동이 이루어질 수 있도록 마련된 불교 종교시설의 정보를 체계적으로 제공하기 위해 구축되었습니다. 불교사찰 및 교화시설 등은 종교적 역할 외에도 지역사회 문화와 전통 유지, 신앙생활 지원, 사회복지 등 다양한 기능을 수행하고 있어 그 현황 관리가 중요합니다. 데이터 항목에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등이 포함되어, 각 시설의 인허가 내역, 설립 및 폐지, 단계별 운영 현황 등 핵심 행정 정보를 명확하게 파악할 수 있습니다. 성동구청 등 관할 행정기관에서 정기적으로 현황 점검과 자료 갱신을 통해 데이터의 신뢰성과 정확성을 확보하고 있습니다. 이 데이터는 종교시설 분포 및 관리, 문화정책 수립, 지역사회 연구, 신도 및 방문객 안내, 시설 보존 및 행정 지원 등 폭넓게 활용될 수 있습니다. 객관적이고 실효성 있는 정보제공을 위해 데이터는 지속적으로 최신화됩니다.
