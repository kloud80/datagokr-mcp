summary_user: 실감데이터공동활용플랫폼에 등록된 실감형 전시용 디지털 에셋 파일의 메타정보를 에셋 한 건당 한 행으로 담은 CSV 파일(약 745KB)이다. 행마다 제목·제작자·분류·시대·주제·재질·파일형식·권한·출처·조회수·등록·수정일시가 들어 있다. 실감형 콘텐츠를 만드는 개발자나 창작자가 '특정 시대·주제의 3D·영상 에셋 중 권한상 활용 가능한 것이 무엇인가'를 찾을 때 쓴다. 메타아이디(immersive_asset_meta_id)가 실측 조인 키라서 같은 플랫폼의 에셋 파일이나 다른 실감 데이터와 이을 때 이 값을 기준으로 삼는다.
description_portal: 한국문화정보원이 운영하는 실감데이터공동활용플랫폼은 다양한 디지털 자원을 체계적으로 관리하고 공유할 수 있도록 지원하는 플랫폼입니다. 이 플랫폼에서 제공하는 에셋 메타 데이터는 각종 에셋 파일에 대한 상세한 메타정보를 포함하고 있으며, 파일의 형식, 용도, 제작 배경, 저작권, 활용 가능 범위 등 구체적인 정보를 제공합니다. 이러한 메타정보는 연구자, 개발자, 창작자들이 데이터를 보다 쉽게 검색하고 선택할 수 있게 도와주며, 나아가 실감형 콘텐츠 제작 및 다양한 산업 분야에서의 응용 가능성을 높여줍니다. 또한 표준화된 구조로 제공되기 때문에 타 시스템과 연계 및 확장이 용이하여 효율적인 데이터 활용 기반을 마련합니다.
