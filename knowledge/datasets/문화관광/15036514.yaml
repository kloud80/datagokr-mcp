summary_user: 광진구 관내 일반게임제공업소(성인용 아케이드 게임장 등)를 업소 한 곳당 한 행으로 담은 파일로, 상호·도로명 소재지·대표자 성명·제공 게임물·등록일자·위도·경도를 포함하며 파일 크기는 932바이트로 매우 작다. 주민이나 분석가가 '우리 동네 근처에 등록된 일반게임제공업소가 어디에 있고 언제 등록됐는가'를 확인하거나 구 단위 업소 분포를 지도에 표시하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소·좌표로 공간 결합하거나 상호 이름 매칭으로만 연결한다.
