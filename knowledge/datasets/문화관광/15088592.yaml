summary_user: 공공누리시스템에서 제공하는 우수 공공저작물(E-Book·동영상·기록물 등)을 저작물 한 건씩 담은 목록으로, 저작물명·본문내용·적용일·분류·형태·링크주소·썸네일·조회수·키워드·게시판명을 포함하며 약 3MB 분량의 CSV 파일로 받는다. 교사나 콘텐츠 제작자가 "수업 자료나 영상 제작에 자유롭게 쓸 수 있는 공공기관 동영상·전자책이 무엇이 있나"를 찾을 때, 분류·형태별로 걸러 링크로 원문에 접근하는 데 쓴다. 다른 데이터와 공통으로 쓰는 조인 키는 없고, 저작물 분류코드·형태코드·게시판코드는 이 목록 안에서 묶어 보는 데만 쓰며, 외부 데이터와는 저작물명·키워드 같은 이름 매칭으로만 이을 수 있다.
description_portal: 공공누리시스템을 통해 제공되는 우수저작물의 목록으로, E-Book, 동영상, 기록물 등 다양한 형태의 공공저작물 정보를 포함하고 있습니다. 저작물명, 본문내용, 적용일, 분류코드, 분류명, 형태명, 형태코드, 링크주소, 썸네일 경로, 공개여부, 조회수, 키워드, 게시판명 등 세부 항목이 제공되어 저작물의 활용도와 접근성을 높였습니다. 연구자, 교육자, 일반 국민이 공공저작물을 손쉽게 검색·활용할 수 있으며, 저작물의 유형별 분류와 상세 정보를 통해 문화콘텐츠 개발, 학술연구, 교육자료 활용 등 다양한 목적으로 활용할 수 있습니다.
