summary_user: 경륜·경정 온라인 발매시스템 스피드온의 회원가입 현황을 가입일자별로 집계한 데이터로, 일별 가입수와 탈퇴를 뺀 순회원수, 성별(남·여)과 연령대(20~30대·40대·50대·60대 이상) 구성을 담고 범위는 전국·비공간이다. 분석가가 특정 홍보 시점이나 제도 변화 전후로 스피드온 신규 가입이 늘었는지, 어떤 성별·연령층이 주로 가입했는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 가입일자(reg_ymd) 기준 날짜 매칭이나 같은 기관 자료와의 수동 연계로만 이어 쓴다.
description_portal: 서울올림픽기념국민체육진흥공단이 운영 중인 경륜·경정 전용 온라인 발매시스템인 '스피드온(Speed-On)'을 통해 수집된 일별 누적 회원가입 수를 기록한 정보입니다. 스피드온은 경륜 및 경정 경기의 경주관련 발매서비스를 이용자들이 손쉽게 비대면을 접근할 수 있도록 개발된 시스템으로, 사용자 중심의 서비스 환경을 구축하고자 하는 목적에서 출발하였습니다. 본 자료는 하루 단위로 신규 가입자 수를 집계한 데이터로서, 플랫폼의 이용자 증가 추세를 가늠할 수 있으며, 특정 시점의 홍보 효과나 제도 변화 등에 따른 가입자 반응 분석에도 활용될 수 있습니다.
