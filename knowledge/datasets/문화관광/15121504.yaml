summary_user: 대한민국예술원이 발간한 예술사, 예술인 구술총서, 예술지 같은 기타 간행물을 한 건씩 담은 목록으로, 간행물마다 제목, 발행기관, 발행일, 내용 설명, 주제 분류, 권리 정보, 썸네일 등 참조 링크를 함께 싣는다. 예술 연구자나 학생이 '예술원이 어떤 주제의 구술총서를 언제 냈는지'를 찾아보거나 학술·교육 자료 목록을 만들 때 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로, 다른 데이터와는 제목·발행기관 이름을 맞대거나 같은 기관 데이터끼리 묶어서 이어 쓴다.
description_portal: 대한민국예술원에서 발간한 다양한 기타 간행물의 정보를 체계적으로 제공하는 데이터셋입니다. 발행기관, 자원의 명칭, 발행일, 내용, 썸네일 이미지 등 주요 정보를 포함하고 있어 예술 관련 연구자, 학생, 일반인들이 예술원 간행물의 현황과 내용을 쉽게 파악할 수 있습니다. 예술사, 예술인 구술총서, 예술지 등 다양한 간행물의 주제와 발행 정보를 확인할 수 있으며, 문화예술 정책 연구, 학술 자료 수집, 예술사 교육 자료로도 활용이 가능합니다. 간행물별 주제 분류와 권리 정보도 함께 제공하여, 예술 자료의 체계적 관리와 활용에 도움을 줍니다.
