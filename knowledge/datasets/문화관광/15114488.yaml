summary_user: 대구광역시 서구 관내 무도학원을 업소 한 곳당 한 행으로 담은 명부 파일로, 업소명·도로명주소·지번주소·위경도·전화번호·시설규모(㎡)를 수록하며 파일 크기는 약 1KB로 소규모다. 주민이나 분석가가 서구 안에 무도학원이 어디에 몇 곳 있고 규모가 어느 정도인지 확인하거나 지도에 표시할 때 쓴다. 전역 조인 키는 없어 다른 체육시설업 명부나 상권 데이터와는 주소·위경도나 업소명으로 맞춰 이어 쓴다.
description_portal: 대구광역시 서구의 무도학원업 상세정보(업소명, 도로명주소, 지번주소, 위도, 경도, 전화번호)에 관한 데이터입니다.본 데이터는 대구광역시 서구 관내 무도학원에 대한 상세정보를 수록한 자료이다. 데이터에는 각 무도학원의 업소명, 도로명주소, 지번주소, 위도 및 경도 좌표, 전화번호, 시설규모 등의 항목이 포함되어 있다. 시설규모는 제곱미터(㎡) 단위로 표기되며, 일부 항목은 입력 누락이 있을 수 있다. 주소는 최신 도로명주소 기준으로 제공되며, 공간정보와 연계 활용이 가능하도록 위경도 좌표가 함께 수록되어 있다. 본 데이터는 학원 관련 정책 수립, 체육시설 분포 분석, 공공안전 및 도시계획 등 다양한 분야에서 기초자료로 활용될 수 있다.
