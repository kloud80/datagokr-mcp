summary_user: 경기도 내 육상경기장을 포함한 공공 운동장을 시설 한 곳당 한 행으로 담고, 시설명·시군·소유기관·운영조직, 부지·건축·연면적, 트랙 재질과 레인 수, 경기장 규격, 관람석 수와 좌석 형태, 준공연도, 주소와 위경도를 포함한다. 생활체육 이용자가 우리 시군에서 트랙을 갖춘 운동장이 어디에 있는지 찾거나, 행정 담당자가 시군별 운동장 분포와 노후 시설(준공연도)을 파악해 보수 계획을 세울 때 쓴다. 전역 조인 키는 확인되지 않아 시군명·시군코드(SIGUN_CD) 같은 이름·코드 매핑이나 주소·위경도 좌표로 다른 체육시설·인구 자료와 이어 쓴다.
description_portal: 이 데이터는 전국 공공체육시설 중 육상경기장을 포함한 운동장의 운영 현황을 제공하며, 각 체육시설의 명칭, 소재지, 소유기관 및 관리주체, 준공연도, 면적 정보, 좌석 형태, 위치 좌표 등의 정보를 포함하고 있습니다. 항목에는 시설명, 시군명, 소유기관명, 운영조직명, 부지면적, 건축면적, 연면적, 좌석형태명, 도로명주소, 위도와 경도 등이 있으며, 이를 통해 체육시설의 규모, 지역 분포, 접근성 등을 종합적으로 파악할 수 있습니다. 데이터는 지역별 체육자원 분포를 분석하거나,신규 시설 개발 및 기존 시설 보수 계획 수립, 공공체육시설 이용 정책 개선 등의 행정적 의사결정 지원에 활용될 수 있습니다.
