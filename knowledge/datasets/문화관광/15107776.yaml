summary_user: 스포츠토토·프로토 발매 대상 운동경기를 경기 1건 단위로 담으며, 경기일자·시각, 홈·원정팀명, 리그명, 경기장명, 종목명, 대상 상품명(토토/프로토), 경기 종료 여부 값을 전국 범위로 제공한다. 분석가가 특정 기간·종목에 어떤 리그와 팀 경기가 투표권 발매 대상이었는지 확인하거나 리그별 발매 대상 경기 분포를 집계할 때 쓴다. 전역 조인 키는 없고 팀명·리그명·경기장명 같은 한글 이름이나 경기일자를 기준으로 다른 경기·대회 데이터와 이름 매핑으로만 잇는다.
description_portal: 체육진흥투표권(스포츠toto,프로토)발매대상 경기는 서울올림픽기념국민체육진흥공단에서 국민체육진흥기금조성을 위해 운영하는 체육진흥투표권(스포츠toto,프로토) 발매 대상 운동경기 결과정보를 경기일자, 경기종목 등의 조건을 이용하여 조회할 수 있는 서비스입니다. 경기결과 변경가능성 등으로 인해 경기종료일 14일 이후의 데이터를 제공합니다. 경기일자, 경기시각, 홈팀명, 원정팀명, 리그명, 경기장명, 종목명, 토토프로토명 등과 같은 정보를 포함하고 있습니다. 이 서비스는 스포츠토토 및 프로토 발매를 위한 경기 정보 제공을 통해 기금 조성과 스포츠 베팅 운영의 투명성과 효율성을 지원할 수 있습니다.
