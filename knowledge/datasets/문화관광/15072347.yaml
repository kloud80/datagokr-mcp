summary_user: 전국 국립도서관을 도서관 단위로 평가년도별 장서수·사서수·방문자수·도서예산 등 운영 현황을 담은 통계 파일이다. 도서관 정책 담당자나 연구자가 '국립도서관별 장서와 사서 인력, 방문자 규모가 어떻게 다른가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 도서관명·도서관코드 매핑으로만 연결하며, 도서관코드는 도서관정보나루 체계의 키로 쓰일 여지가 있다.
description_portal: 전국 국립도서관의 운영 현황과 자원 분포를 종합적으로 파악할 수 있는 통계 자료입니다. 평가년도, 도서관구분, 도서관코드, 도서관명, 행정구역, 시군구, 장서수, 사서수, 방문자수, 도서예산 등 다양한 항목을 포함하고 있어 도서관 정책 수립, 연구, 지역별 도서관 서비스 개선 등에 활용할 수 있습니다. 이용자들은 도서관별 자원 현황과 이용 실태를 비교 분석하거나, 도서관 운영의 효율성 제고 및 예산 배분의 근거 자료로 활용할 수 있습니다. 또한, 도서관 관련 산업 및 학계에서도 기초 자료로 활용하기에 적합합니다.
