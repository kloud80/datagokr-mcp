summary_user: 전남도립미술관에 등록된 교육프로그램을 프로그램 한 건 단위로 담으며, 목록 조회에서는 제목·대상·시간·정원·장소·진행상태를, 상세 조회에서는 신청일정·운영일정·상세 내용·유의사항·예약 URL까지 제공한다. 미술관 교육에 참여하려는 가족이나 시민이 "지금 신청할 수 있는 어린이 대상 프로그램이 있고, 정원과 예약 링크는 무엇인가"를 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 미술관 이름이나 같은 기관 코드로만 연결하며, 상세 조회는 목록에서 받은 프로그램 고유번호(artEduId)로 이어 호출한다.
limits: 상세 조회의 필수 파라미터인 프로그램 고유번호(artEduId)는 목록 조회 등 다른 응답에서 먼저 받아 넘겨야 한다. 문화시설 총람 시설코드나 좌표 같은 공통 키가 없어 지역 문화시설 분포 분석과 바로 결합하기 어렵다. 개발계정 호출 한도는 하루 1,000회이다.
