description_portal: '- 입력 파라미터(분류코드, 제목)을 이용한 전라남도 도립미술관 에 등록되어있는 교육프로그램 목록을 조회하는 서비스로 진행상태, 제목, 대상, 첨부파일 정보, 장소, 정원, 신청URL 등의 정보를 제공합니다.- 전남도립미술관은 광양읍 옛 광양역 자리에 2021년 3월 개관한 공립미술관으로, 지하 1층·지상 3층 규모에 전시실, 카페, 도서실, 어린이 아틀리에 등 다양한 교육 공간을 갖추고 있습니다.- 주요 특징 & 시설- 현대적 설계: 투명 유리 외벽과 높은 층고로 모던하고 쾌적한 전시 공간 구성- 접근성: 대중교통으로는 다소 불편할 수 있어 자가용 이용 권장- 편의시설: 카페, 휴게실, 도서실 뿐 아니라 어린이와 가족 대상 아틀리에 운영- 전남도립미술관은 지역 예술과 국제작가를 연결하며, 현대미술 전시와 교육 체험을 통해 지역 문화 허브로 성장 중입니다. 공간 자체가 예술적이어서 사진 찍기도 좋고, 가족 단위 방문에도 알찬 경험을 제공합니다.'
