summary_user: 경기도 공공체육시설 가운데 조정·카누장을 시설 한 곳당 한 행으로 담은 현황 자료로, 시군·시설명·소유기관·관리주체, 부지·건축·수면 면적, 조정·카누 레인 수, 관람석·수용인원, 수원 종류, 준공연도, 건설사업비, 주소와 위경도를 포함한다. 수상스포츠 지도자나 지역 체육 분석가가 '경기도에서 대회를 치를 만한 레인 수와 관람석을 갖춘 조정장이 어디 있는가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군 코드(SIGUN_CD)·시군명으로 같은 경기도 체육시설 현황 자료와 묶거나, 위경도·정제 주소로 다른 위치 데이터와 공간적으로 맞춰 쓴다.
description_portal: 경기도 공공체육시설 중 조정, 카누장 체육시설 현황입니다. 시설명, 관리주체명, 수원종류명 등의 정보를 제공합니다.이 데이터는 경기도 내 공공체육시설 중 조정 및 카누 경기를 위한 경기장의 운영 및 시설 정보를 포함하고 있으며, 시설명, 위치, 소유기관, 관리주체, 부지 및 수면 면적, 좌석 형태, 레인 수, 수용인원, 준공연도, 건설비용 등 총 15개 항목으로 구성되어 있습니다. 주요 항목에는 부지면적(㎡), 건축면적(㎡), 연면적(㎡), 수면적(㎡), 조정레인수, 카누레인수, 좌석형태명, 건설사업비 등이 포함되며, 이는 수상 스포츠 기반 인프라 분석, 지역별 체육자원 배분, 국제·전국 대회 유치 조건 파악 등의 목적으로 활용됩니다. 해당 시설들은 저수지, 한강수 등 다양한 수원 기반으로 구성되어 있으며, 일부 시설은 다목적 이용(미니축구장, 경정장 포함)이 가능한 복합형 체육시설로 운영되고 있습니다.
