description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 걸매예술마을은 제주 서귀포시 서문로38번길 인근 절벽 위에 위치한 예술마을로 2007년 공공미술 프로젝트를 통해 조성되었으며 마을 골목과 언덕길 곳곳에 벽화와 조형물이 설치되어 있어 산책과 감상이 가능하고, 공영주차장과 무장애 코스를 포함한 무장애 여행 정보가 제공되어 휠체어 사용자, 유모차 동반자, 교통약자도 예술마을과 인근 숲길 및 전망대에 비교적 무리 없이 접근할 수 있어 관광, 문화 체험, 무장애 관광 활성화 자료로 활용되기에 적합한 열린 관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
