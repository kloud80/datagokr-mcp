summary_user: 경기도 안양시에 있는 전통사찰을 한 곳당 한 행으로 담은 파일로, 사찰명·소재지 주소·소속 종단(조계종·태고종 등)·전화번호·데이터기준일을 담는다(파일 크기 403바이트의 소규모 목록). 시민이나 답사·관광 기획자가 '안양시에 어떤 전통사찰이 있고 어느 종단 소속이며 어디로 연락하나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사찰명이나 소재지 주소를 매칭해 잇거나 같은 기관(안양시) 자료끼리만 연결한다.
description_portal: '안양시  전통사찰(순번, 사찰명, 소재지, 종단명(조계종, 태고종등), 전화번호, 데이터기준일)안양시의 전통사찰 정보는 지역 내 문화유산 보호와 불교문화 이해를 돕기 위해 제공되는 공공데이터입니다. 이 데이터는 다음과 같은 항목으로 구성되어 있어요:- 순번: 데이터 내 사찰의 고유 식별 번호- 사찰명: 예를 들어 안양사, 삼막사, 염불사 등- 소재지: 도로명 주소 또는 지번 주소 형식- 종단명: 조계종, 태고종 등 사찰이 소속된 불교 종단- 전화번호: 사찰에 직접 연락 가능한 번호- 데이터 기준일: 공표되는 데이터 기준일에 따름'
