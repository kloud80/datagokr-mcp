description_portal: 한국남동발전에서 운영중인 동호회 현황 입니다.동호회명, 사업소, 활동분야, 개설일, 활동여부의 컬럼으로 포함되어 있습니다.사업소의 경우 전사의 데이터를 포함하고 있습니다.활동분야는 동호회에서 주로 다루는 주제나 관심사를 뜻하며 스포츠, 문화 예술 등 다양한 영역을 포함 합니다.동호회의 개설일과 현재 활동중인 동호회의 현황을 한눈에 파악 가능합니다.사내 구성원들의 주요 관심사와 부서별 취미 생활 분포도를 파악할 수 있으며 이르 기반으로 더욱 효과적인 조직 활성화 정책 수립에 기여 가능합니다. 또한 임직원 간 소통과 화합을 촉진하는 데에도 긍정적인 영향을 미칠 것으로 기대되며 나아가 기업의 사회적 책임(CSR) 측면에서도 모범적인 사례 , 자료로 활용 가능합니다.
