summary_user: 광주 남구 관내에 있는 「2024 광주 맛집」 선정 음식점을 한 곳씩 상호명·도로명주소·전화번호로 담은 개별 업소 목록이며, 파일 크기는 502바이트로 소규모입니다. 광주 남구를 찾는 여행객이나 관광 안내 지도·맛집 추천 서비스 운영자가 "남구에서 광주시가 선정한 맛집은 어디이고 연락처는 무엇인가"를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 음식점 정보나 다른 구의 맛집 목록과는 상호명·도로명주소(소재지도로명주소)를 맞춰 이어 쓴다.
description_portal: 광주광역시 신활력추진본부 관광도시과에서 추진한 「2024 광주 맛집」에 선정된 광주 남구 관내에 위치한 맛집 정보를 제공합니다. 해당 데이터는 광주광역시 신활력추진본부 관광도시과(☎062-613-3633)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다.※ 광주광역시에서 선정하는 맛집은 지역을 대표할 수 있는 향토 음식점과 모범 음식점으로, 맛과 위생, 서비스, 전통성 등을 종합적으로 평가해 지정됩니다. 이 제도는 광주의 음식 문화를 널리 알리고, 방문객에게 믿을 수 있는 외식 정보를 제공하기 위해 운영됩니다. 선정된 맛집은 광주 대표 관광 콘텐츠로 활용되며, 여행객은 안전하고 수준 높은 음식을 즐길 수 있습니다. 지자체는 이를 통해 지역 상권을 활성화하고, 관광 자원으로 연계해 도시 이미지를 높일 수 있습니다. 민간에서는 관광 안내 지도 제작, 맛집 추천 플랫폼, 외식 산업 분석 자료로 응용할 수 있으며, 학계와 연구기관에서는 지역 음식문화 연구와 정책 평가 자료로 활용할 수 있을 것으로 보입니다.
