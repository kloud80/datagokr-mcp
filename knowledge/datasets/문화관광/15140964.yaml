summary_user: 서울특별시 마포구에서 인허가를 받은 영화관·영화감상실 등 영화상영업소를 업소 한 곳당 한 행으로 담은 인허가 원천 목록으로, 인허가일자·영업상태·폐업일자·사업장명·지번/도로명 주소·좌표 등을 포함한다. 시민이 "마포구에서 지금 영업 중인 합법 영화상영업소는 어디인가"를 확인하거나, 분석가가 지역 내 상영시설의 개업·폐업 추이를 살피는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관 코드(개방자치단체코드)로만 연결한다.
description_portal: 서울특별시 마포구에서 인허가를 받은 영화관 또는 영화를 감상할 수 있는 실 등 영리를 목적으로 영화를 상영하는 업소에 대한 정보입니다. 이 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 문화체육업종명 등의 세부 정보가 포함되어 있습니다. 이 데이터를 통해 시민은 합법적으로 등록된 상영시설을 이용할 수 있으며, 감독기관은 지역 내 영화문화 시설을 효율적으로 관리할 수 있습니다.
