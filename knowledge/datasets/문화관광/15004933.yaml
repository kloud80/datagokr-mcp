summary_user: 대구광역시립동부도서관에서 한 분기 동안 대출횟수가 많았던 인기도서를 순위별로 담은 목록으로, 책 한 권(등록번호)마다 서명·저자·발행자·청구기호·대출횟수가 한 행에 들어 있으며 활용신청 없이 받는 CSV 파일(약 22KB)이다. 동부도서관 이용자가 요즘 많이 빌리는 책을 찾거나, 도서관 담당자·분석가가 '이번 분기 대출이 몰린 분야와 저자는 무엇인가'를 보고 장서 확충과 신간 선정에 참고하는 데 쓴다. 실측 컬럼에 ISBN이나 도서관코드 같은 전역 조인 키가 없어 다른 도서관 인기도서·대출 데이터와는 서명·저자 문자열을 맞춰 연결해야 한다.
limits: ISBN·도서관코드가 없어 도서관정보나루 등 국가서지·대출 데이터와 키로 바로 붙이지 못하고, 서명·저자 이름 매칭에 의존한다. 동부도서관 한 곳의 대출 순위라서 대구 전체나 다른 도서관의 이용 경향을 대표하지 않는다.
