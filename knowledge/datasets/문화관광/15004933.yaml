description_portal: '대구광역시립동부도서관 인기도서목록입니다. 동부도서관에서 해당 분기에 도서대출횟수가 많았던 인기도서로 구성된 데이터입니다.데이터는 다음과 같은 컬럼을 포함하고 있습니다. 서명, 저자, 발행자, 등록번호, 청구기호, 대출횟수목록형식으로 해당 자료의 서지사항을 제공하고 있어 이용자 선호도, 도서관별 대출 빈도 파악 등 장서관리 및 서비스 개선에 활용될 수 있으며,향후 신간 도서 선정 및 자료확충계획 수립에 유용한 기초 자료로 사용될 수 있습니다.담당부서: 대구광역시립동부도서관 자료봉사과'
