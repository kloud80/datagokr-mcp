summary_user: 충청북도 나드리(관광) 홈페이지가 관리하는 도내 음식점·숙박시설·캠핑장·카페 등 관광자원을 업소 한 곳당 한 행으로 담은 목록 파일로, 시군·주소와 위도·경도 좌표, 연락처, 운영시간, 소개문을 담고 음식점은 메뉴, 숙박시설은 객실·입퇴실 시간·조식·픽업·주차·부대시설 정보를 함께 담는다. 충북 여행을 계획하는 사람이 '청주 근처에서 조식을 주고 주차가 되는 숙소는 어디인가' 같은 질문을 확인하거나, 분석가가 시군별 관광업소 분포를 지도로 볼 때 쓴다. 전역 조인 키는 없어서 TourAPI 관광정보나 숙박업·야영장 등록 데이터와는 업소명·주소를 맞추거나 좌표로 근접 매칭해 이어 쓴다.
description_portal: 이 자료는 충북 나드리(관광) 홈페이지에서 관리하는 충청북도 내 관광자원 통합 목록으로, 음식점·숙박시설·캠핑장·카페 등 다양한 관광 관련 업소의 기본 정보를 한 번에 제공하고 있습니다. 관광자원명, 자원 구분, 시군·읍면동 주소, 위도·경도 좌표, 연락처, 운영시간과 함께 상세 소개문을 수록하여 위치 안내뿐 아니라 업소의 특징과 주변 관광지 정보까지 파악할 수 있습니다.음식점은 대표메뉴와 세부 메뉴 정보를, 숙박시설은 객실 정보·입퇴실 시간·조식 제공 여부·픽업 서비스·주차 및 부대시설 현황 등을 구조화해 두어 이용자가 편리하게 비교·선택할 수 있도록 구성했습니다. 일부 항목에는 애견동반 가능 여부 등 접근성 정보를 포함하여 가족·반려동물 동반 여행 계획 시 참고하도록 하고 있습니다. 전체 데이터는 도내 관광지 안내, 관광콘텐츠 발굴, 통계 기반 관광정책 수립과 홍보 자료 작성에도 활용할 수 있습니다.
