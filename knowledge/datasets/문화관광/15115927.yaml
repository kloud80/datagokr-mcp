summary_user: 서울 강서구 안에서 인형뽑기방·오락실 등 전체이용가 게임물을 두는 청소년게임제공업 사업장을 한 곳씩 담은 인허가 목록이다. 사업장명, 인허가일자, 영업상태, 폐업일자, 지번·도로명 주소, 좌표, 시설면적·층수 같은 시설 항목이 함께 들어 있다. 주민이나 상권 분석가가 '강서구에서 지금 영업 중인 인형뽑기방·오락실이 어디에 몇 곳 있는가'를 확인할 때 쓴다. 실측 컬럼에는 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관의 관리번호(MGTNO)로만 연결할 수 있다.
description_portal: 서울특별시 강서구 청소년게임제공업 인허가 정보는 인형뽑기, 아케이드 게임기 등 전체이용가 게임물을 설치하고 제공하는 사업장에 대한 인허가 현황을 담고 있습니다. 해당 데이터는 인허가일자, 영업상태, 사업장명, 주소 등의 항목으로 구성되어 있으며, 강서구 내 청소년 대상의 건전한 여가문화 공간 운영을 위한 기초 행정자료로 활용됩니다. 청소년게임제공업은 오락실, 키즈카페, 인형뽑기방 등에서 운영되는 게임 시설로, 이용 연령이 제한되지 않는 게임기기를 설치해 다양한 연령층의 고객이 접근 가능하도록 구성됩니다. 본 데이터는 청소년 보호를 위한 영업장 관리, 관련 법령 준수 여부 점검, 건전한 게임문화 조성, 지역 상권 분석, 문화 기반시설 분포 조사, 청소년 정책 수립 등에 활용될 수 있습니다.
