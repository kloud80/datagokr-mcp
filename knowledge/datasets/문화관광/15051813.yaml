summary_user: 서울시 내 문화시설(공연장·전시공간 등)을 시설 한 곳당 한 행으로 담은 목록으로, 시설명·주소·자치구·좌표와 함께 관람시간·관람료·휴관일·개관일자·객석수 같은 운영 정보, 지하철·버스정거장·버스 노선 등 대중교통 정보를 담는다. 시민이나 관광객이 '우리 구 근처에서 무료로 갈 수 있고 지하철로 닿는 공연장·전시공간은 어디인가'를 찾을 때, 분석가가 자치구별 문화시설 분포를 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명·주소 매칭이나 자치구(GNGU) 단위 집계, 좌표(X_COORD·Y_COORD) 기반 공간 결합으로만 이어 쓴다.
description_portal: 서울시 문화공간 정보 데이터는 서울 전역의 주요 문화시설 현황을 한눈에 파악할 수 있도록 구성된 공공 데이터입니다. 문화시설명과 주소, 자치구 정보로 위치를 쉽게 확인할 수 있으며, 관람시간, 관람료, 휴관일, 개관일자 등 기본 운영 정보를 함께 제공합니다. 또한 객석수와 시설소개, 기타사항을 통해 시설 규모와 특징을 파악할 수 있어 공연장·전시공간 선택에 유용합니다. 지하철, 버스정거장, 버스 노선 등 대중교통 정보도 포함되어 시민과 관광객이 문화시설을 편리하게 방문할 수 있도록 지원하는 실용적인 데이터입니다.
