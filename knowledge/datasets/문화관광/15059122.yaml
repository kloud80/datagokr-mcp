summary_user: 올림픽공원 내 올림픽수영장·스포츠센터와 일산·분당 스포츠센터의 월별 월회원 이용객수를 담은 집계 데이터로, 포털 설명상 2013년 1월부터 2015년까지 기간에 148건이다. 공공 스포츠센터 운영을 분석하는 사람이 센터별·월별 월회원 수요가 어떻게 달랐는지 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 센터 이름을 맞추거나 같은 기관 데이터끼리만 연결한다.
description_portal: 올림픽공원 내에 위치한 스포츠센터 및 분당/일산 스포츠센터의 종목별 운영 현황 제공하고 있으며,스포츠센터별, 종목별, 일일입장, 월회원 이용현황 등 정보제공하고 있습니다.https://www.ksponco.or.kr/webzine/whitebook/2024/index.html#page=992025년 6월기준 148건의 데이터를 제공하고 있으며2013년 1월부터 2015년까지의  올림픽수영장, 스포츠센터, 일산스포츠센터, 분당스포츠센터의 월별 월회원 이용객수 정보를 제공하고 있습니다.
