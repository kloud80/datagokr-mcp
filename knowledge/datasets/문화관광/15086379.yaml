summary_user: 빅카인즈(BIGKinds) 뉴스 데이터베이스에서 모은 부동산 관련 기사를 기사 한 건당 한 행으로 담은 메타정보 파일(csv, 약 69MB)로, 일자·언론사·제목·통합분류·키워드·특성추출 등이 들어 있고 범위는 전국·비공간이다. 연구자나 정책 분석가가 "전세사기나 대출 규제 발표 전후로 어떤 언론사가 어떤 키워드로 부동산을 보도했나"처럼 시기별 보도 의제와 여론 흐름을 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 일자나 키워드·지역명 같은 이름 매칭으로만 이을 수 있다.
