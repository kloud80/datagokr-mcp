summary_user: 울산광역시 중구 문화의전당에서 열리는 공연·전시 행사를 한 건씩 담은 원천 목록으로, 행사명·기간과 시각·관람요금·객석수·입장연령·예매정보와 공연장 주소·위도·경도를 담는다(CSV 약 3KB의 소규모 파일). 울산 중구 주민이나 방문객이 '이번 달 문화의전당에서 어떤 공연을 하고 관람료와 입장 가능 연령은 얼마인가'를 확인하거나, 지역 문화행사 현황을 정리하는 분석가가 쓴다. 전역 조인 키가 없어 KOPIS 공연ID와 바로 연결되지 않으므로, 다른 공연 데이터와는 행사명·장소 이름 매칭이나 주소·좌표 기반 위치 결합으로 이어 쓴다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 전국 공연 목록이나 예매·매출 데이터와 정확히 조인하려면 이름 매칭이 필요하다. 범위는 중구 문화의전당 한 시설에 한정되며, 명세상 연간 단위로 갱신되는 파일이라 수시로 바뀌는 공연 일정의 최신 여부는 데이터기준일자로 확인해야 한다.
