summary_user: 대구광역시 달성군 안의 유원시설을 시설 한 곳당 한 행으로 담은 파일로, 명칭·도로명주소·위도·경도와 홈페이지·전화번호·평일/주말 운영시간·휴무일·주차장 정보를 담는다. 달성군 주민이나 방문객이 '주말에 문을 여는 근처 유원시설이 어디이고 주차가 되는가'를 확인하거나, 분석가가 군 내 유원시설 분포를 지도로 보는 데 쓴다. 전역 조인 키나 등록번호·사업자번호가 없어 다른 데이터와는 시설명이나 주소 매칭, 또는 위도·경도 좌표로만 이어 쓴다.
description_portal: 유원시설의 기본 현황 정보를 정리한 자료로, 시설 명칭, 위치, 시설 유형 등 유원시설 관리에 필요한 주요 정보를 포함하고 있다. 본 자료는 유원시설의 분포 현황과 관리 대상 시설의 운영 실태를 종합적으로 파악하기 위한 기초자료로 활용된다.또한 유원시설 현황에 대한 체계적인 관리를 통해 여가·관광 시설 이용 여건과 안전 관리 실태를 분석하고, 관광 활성화 및 문화·여가 정책 수립을 위한 행정적 의사결정을 지원한다. 본 자료는 유원시설에 대한 행정 관리, 안전 점검, 지도·점검 및 민원 대응 업무 수행과 함께 관련 통계 산출 및 문화관광 행정 업무 수행을 위한 참고 자료로 활용된다.아울러 이용자의 안전 확보와 쾌적한 여가 환경 조성을 위한 관리 체계를 강화하고, 건전한 여가·관광 문화 정착과 지역 관광 자원 관리 정책 추진을 위한 기초자료로 활용되며, 지속적인 문화·관광 행정 업무 수행을 지원하는 행정자료로 활용된다.
