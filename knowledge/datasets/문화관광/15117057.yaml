summary_user: 경기문화재단 지지씨플랫폼에 등록된 경기도 내 문화 행사를 행사 한 건씩 담으며, 기관명·제목·분류(전시 등)·시작일과 종료일·행사 시간·참가 비용·주최기관·전화번호·홈페이지와 이미지 주소를 제공한다. 이번 주말 경기도에서 열리는 무료 전시가 어디인지 찾는 시민이나, 시군·기관별 전시·공연 개최 현황을 보려는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 공연·문화시설 데이터와는 기관명(INST_NM)이나 행사 제목을 이름으로 맞춰 연결해야 한다.
description_portal: 경기문화재단이 운영하는 지지씨플랫폼 내 등록된 경기도 내 문화 행사 정보입니다. 문화 행사의 기관명, 제목, 분류명, 홈페이지, 시작일, 종료일 등을 제공합니다.이 데이터는 경기도에서 개최되는 문화행사의 현황을 수록한 자료로, 각 행사별로 기관명, 행사 제목, 행사 분류(전시 등), 행사 기간(시작일자 및 종료일자), 행사 시간, 비용, 주최기관, 행사 관련 홈페이지 및 상세 URL, 전화번호 등의 항목으로 구성되어 있습니다. 주요 항목에는 ‘제목’, ‘시작일자’, ‘종료일자’, ‘비용’, ‘분류’, ‘전화번호’, ‘URL’, ‘홈페이지URL’ 등이 포함되어 있으며, 경기도 내 문화행사 일정 안내, 전시 및 공연 분석, 지역 문화기관 운영현황 파악, 관광 및 문화정책 수립 등에 활용될 수 있습니다. 일부 항목은 상시 전시나 무료입장 등의 특성을 명시하고 있으며, 이미지 URL도 포함되어 있어 시각적 홍보 자료 제작에도 활용 가능합니다. 날짜와 시간 정보는 방문 계획 수립 및 일정 시각화 분석에도 유리합니다.
