description_portal: 국립국어원은 국어/한국어, 수어, 점자와 관련된 다양한 연구를 수행하고 대표 누리집을 통해 그 결과를 공개하고 있습니다.국립국어원에서 펴낸 연구보고서 및 기타 자료 목록을 한눈에 확인할 수 있는 데이터입니다. 1985년부터 작성된 각종 보고서 및 자료 목록을 나열하였으며, 서명, 펴낸 곳, 참여자, 펴낸 때 등 기본 정보를 확인할 수 있습니다. 또한 정보 활용 시 도움이 될 수 있도록 각 보고서/자료의 저작권 유형 및 관련 설명을 포함하여 제공합니다. 해당 자료는 국립국어원 대표 누리집 > 자료 > 연구/조사 자료에서 검색 및 다운로드가 가능합니다.
