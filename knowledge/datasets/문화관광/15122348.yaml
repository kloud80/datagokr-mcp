summary_user: 광주광역시 남구에 등록된 외국인관광도시민박업소를 업소 한 곳당 한 행으로 담은 원천 목록으로, 상호명·도로명/지번 주소·위도·경도와 데이터기준일자를 담는다(파일 약 1.7KB 규모의 소량 CSV). 외국인 관광객이나 여행 플랫폼·분석가가 '남구 안에서 외국인이 묵을 수 있는 도시민박은 어디에 있나'를 찾거나 지도에 표시하는 데 쓴다. 전역 조인 키나 등록번호·사업자번호 같은 코드 필드가 없어, 다른 데이터와는 주소나 좌표, 상호명으로 매칭해 이어 쓴다.
description_portal: 광주광역시 남구 외국인관광도시민박업 현황 및 정보(업소명, 소재지, 위도, 경도 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 문화관광과(☎062-607-2323)에서 제공합니다. 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 외국인관광도시민박업소란 도시 지역의 주민이 거주하고 있는 주택을 이용하여 외국인 관광객에게 한국의 가정 문화를 체험 할 수 있도록 숙식 등의 서비스를 제공하는 업소를 말합니다. 사업자는 관련 법령에 따라 지자체에 등록해야 하며, 위생·안전 기준을 준수해야 합니다. 이 업종은 외국인 관광객이 지역 주민과 직접 교류하며 현지 문화를 깊이 이해하도록 돕고, 지역경제 활성화와 국제 문화 교류 증진에 기여합니다.
