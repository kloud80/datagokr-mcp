description_portal: '서울특별시 중랑구의 관광호텔과 같은 숙박시설 및 음식, 운동, 오락 등 적합한 시설 등을 함께 갖추어 제공하는 업소정보입니다.「관광진흥법」 제3조 제1항 제2호에 따라, 관광숙박업은 외국인 및 내국인 관광객에게 숙박시설을 제공하기 위한 사업입니다.호텔업, 가족호텔업, 호스텔업, 휴양콘도미니엄업, 한옥체험업 등으로 세분화되며, 각각의 업종별로 시설기준과 운영 요건이 정해져 있습니다.* 데이터명 : 서울특별시 중랑구 관광숙박업 인허가 정보* 데이터종류 : 서울시 업종별 관광사업체 등록현황을 자치구별로 제공하는 데이터*관련태그 : 관광객이용시설업 ,  관광숙박업 ,  관광편의시설업 ,  국제회의업 ,  여행업 ,  유원시설업 ,  카지노업 ,  투어 ,  관광 ,  사업체 ,  호텔업 ,  휴양업 ,  유람선업 ,  공연장업'
