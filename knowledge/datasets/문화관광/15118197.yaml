summary_user: 서울 성동구 안에서 영리 목적으로 영화를 상영하는 영화관 등 업소를 업소별 한 건씩 담은 인허가 원천 데이터로, 인허가일자·취소일자·영업상태·폐업일자·소재지 주소·좌표·시설면적·층수 등이 들어 있다. 성동구에 지금 영업 중인 영화관이 어디이고 언제 인허가·폐업했는지 알고 싶은 시민이나, 지역 영화관 분포와 개폐업 추이를 보려는 분석가가 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못했으므로 다른 데이터와는 업소명·주소 같은 이름 매핑이나 같은 기관의 개방자치단체코드로만 연결한다.
description_portal: 본 데이터는 서울특별시 성동구 내에서 영화관 등 영리를 목적으로 영화를 상영하는 업소의 정보를 체계적으로 제공하기 위해 구축되었습니다. 영화관 및 상영관은 지역 문화예술 접근성과 시민의 여가생활 증진에 중요한 시설로, 안정적 운영과 투명한 인허가 관리가 필요합니다. 데이터에는 개방자치단체코드, 관리번호, 인허가일자, 인허가취소일자, 영업상태코드 등 각 영화관의 설립·변경·폐업 및 영업상태 등 주요 행정정보가 포함되어, 해당 업소의 영업 인허가 이력과 운영 현황을 명확하게 파악할 수 있습니다. 성동구청 등 관할 행정기관이 정기적으로 현장점검 및 자료 갱신을 실시함으로써 데이터의 신뢰성과 최신성을 확보하고 있습니다. 본 데이터는 영화관 분포 현황 분석, 상영업 정책 수립, 지역 문화시설 네트워크 연구, 상권 및 시장 동향 파악, 소비자 정보 제공 등 다양한 목적으로 활용할 수 있습니다. 영화산업 종사자, 정책입안자, 연구자, 시민 모두에게 객관적이고 실효적인 자료를 제공하며, 데이터는 항상 최신 정보로 주기적으로 갱신됩니다.
