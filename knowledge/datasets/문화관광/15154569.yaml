description_portal: '세종특별자치시시설관리공단은 시민이 체육시설 강습 프로그램 변경 이력을 명확히 확인할 수 있도록 강습수정이력 데이터를 공공데이터로 제공하고 있습니다.이 데이터는 공단이 운영하는 체육시설(보람수영장, 조치원복합커뮤니티센터 등)에서 강습수정이력과 관련된 이력을 체계적으로 관리하기 위해 구축되었습니다.■ 데이터 컬럼 구성센터명 - 강습이 진행된 체육시설명    예: 보람수영장, 조치원복합커뮤니티센터 등대관연기일자 - 강습 연기 또는 변경이 접수된 날짜변경전강습반명 - 변경 전 수강 중이던 강습반의 명칭변경전결제금액 - 변경 전 강습반 결제 금액변경강습반명 - 변경 후 등록된 강습반의 명칭변경후금액 - 변경 후 결제 금액■ 데이터 제공 목적강습수정이력 데이터는 다음과 같은 목적을 위해 제공됩니다. - 강습 프로그램 변경 내역의 투명한 관리 및 공개 - 회원별 강습 연기·변경·환불 등 행정처리 이력 관리 강화 - 체육시설 이용자의 서비스 선택권 보장 및 민원 대응 품질 향상 - 시설별 강습 프로그램 운영 효율성 및 정산 관리 고도화 - 체육행정의 공정성·투명성 확보 및 시민 신뢰도 제고세종특별자치시시설관리공단은 시민이 신뢰할 수 있는 체육시설 서비스를 제공하기 위해, 강습 관련 데이터의 정확성과 공개 범위를 지속적으로 확대해 나가겠습니다.'
