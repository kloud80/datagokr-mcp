summary_user: 서울특별시 양천구 관내 종합체육시설업(수영·골프·체육단련 등을 한 곳에 모은 업소)의 인허가 정보를 업소 건별로 담는 시군구 단위 명부로, 업소명·관리번호·인허가일자·영업상태·폐업일자·주소·좌표 등을 포함한다. 주민이 생활권 안에서 영업 중인 종합체육시설을 찾거나, 분석가·창업 준비자가 양천구에서 종합체육시설의 개업·폐업 흐름을 상권 신호로 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(개방자치단체코드, OPNSFTEAMCODE)로만 이어 쓰며, 좌표(X, Y)와 주소로 상권·인구 데이터와 위치 기준으로 겹쳐 볼 수 있다.
description_portal: 서울특별시 양천구가 제공하는 본 데이터는 관내에서 종합체육시설업을 운영하기 위해 취득해야 하는 인허가 정보를 체계적으로 정리한 공공자료이다. 해당 데이터는 업소명, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태 등을 포함하여 민원 처리 과정의 투명성을 높이고 행정 정보에 대한 접근성을 향상시키는 것을 목적으로 한다. 또한 시설의 안전기준 충족 여부, 운영 규모, 이용 환경 등 관련 사항을 확인할 수 있어 체육시설 건립 계획 수립, 지역 체육 인프라 분석, 민간 사업자의 창업 준비와 같은 다양한 분야에서 활용 가능하다. 주민은 이를 통해 생활권 내 체육시설의 운영 현황을 쉽게 파악할 수 있으며, 행정기관은 정책 수립 및 시설 관리 업무의 효율성을 제고하는 데 참고자료로 사용할 수 있다. 본 데이터는 지역사회 건강 증진과 건전한 체육 활동 기반 마련을 지원하기 위한 핵심 정보로서 중요한 역할을 한다.* 종합체육시설업 - 수영, 골프, 체육단련 등과 같은 체육시설을 한 곳에 모아놓은 업소 정보
