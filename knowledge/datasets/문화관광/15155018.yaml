summary_user: 전국 자치단체가 관리하는 등록체육시설업(골프장·스키장 등) 업소를 건별로 담은 인허가 원천 데이터로, 사업장명·인허가일·영업상태·주소·좌표를 싣는다. 다만 API 전체 건수는 5건이고 검증 때 5행을 받았다. 분석가나 사업자가 지역의 민간 체육시설 개폐업 동향을 볼 때 쓰며, 지번주소(LOTNO_ADDR)·도로명주소(ROAD_NM_ADDR)를 키로 상권 데이터 같은 주소 기반 데이터와 이어 쓴다.
description_portal: '생활_등록체육시설업 데이터는 골프장, 스키장, 자동차 경주장과 같은 체육시설을 설치 및 경영하는 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 등록체육시설업 인허가 정보를 일괄 취합하여 전국 데이터로 제공 - 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 스포츠산업과 / 044-203-3150 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
