summary_user: 마포구 망원시장 일대를 격자로 나눠 격자별 유동인구를 연령대·시간대(14세 이하, 20~50대 21시대, 65세 이상, 20~60대 9~18시, 주말 등)로 집계한 관광인구 분석 결과 파일로, 격자 경계 좌표(left·top·right·bottom)를 함께 담은 공간데이터(SHP, EPSG:3857)다. 상권 분석가나 상인회가 망원시장 주변 어느 구역에 어떤 연령층이 언제 많이 다니는지를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 격자 id로는 다른 데이터와 바로 붙지 않으며, 좌표를 이용해 공간 중첩하거나 같은 마포구 유동인구 분석 파일과 이름 기준으로 맞춰 쓴다.
