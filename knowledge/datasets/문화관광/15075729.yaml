description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지 주변 "관광지명, 주변시설종류, 명칭, 주소, 연락처" 등 정보 입니다."* 남태해안로는 제주 서귀포시 남원읍에서 표선면 토산리까지 이어지는 약 12 km 해안 도로 구간으로, 바닷가 절벽과 현무암 해안, 탁 트인 바다 풍경을 따라 이어지는 해안도로이며 돌담과 낮은 난간으로 바다 조망이 가능해 휠체어나 유모차 이용자도 비교적 무난하게 해안 산책과 드라이브를 즐길 수 있는 무장애 환경이 일부 확보된 열린 관광지로서, 잔디밭 쉼터와 벤치, 해변 경관, 인근 식당‧카페 등 주변 관광지와 연계된 휴식 및 관광 코스 설계, 무장애 관광 안내, 콘텐츠 제작, 정책 기초 자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
