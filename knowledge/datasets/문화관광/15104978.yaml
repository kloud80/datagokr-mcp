summary_user: 국립어린이청소년도서관 전시실의 전시 자원을 건별로 담으며, 자원 명칭(title)·전시 내용·전시 기간·공간·언어·저작권·기여자·주제 분류와 키워드를 항목으로 가진다. 전시 기획자나 도서관 이용자가 "이 도서관 전시실에서 어떤 주제의 전시가 언제 열렸나"를 확인하거나, 연구자가 어린이·청소년 대상 전시 주제의 흐름을 살피는 데 쓴다. 실측 컬럼에 도서관코드·ISBN 같은 전역 조인 키가 없어서, 다른 도서관·전시 데이터와는 전시명·키워드 같은 이름 매핑이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 국립어린이청소년도서관에서 운영하는 전시실에 대한 상세 정보를 제공하는 데이터셋입니다. 전시실의 자원 명칭, 전시 내용, 전시 기간, 공간, 언어, 저작권, 기여자 등 다양한 항목이 포함되어 있어 전시실의 운영 현황과 전시 자원의 특성을 한눈에 파악할 수 있습니다. 문화, 예술, 교육 분야의 연구자나 정책 담당자, 전시 기획자, 도서관 이용자 등에게 유용하며, 전시실 정보 분석, 문화행사 기획, 도서관 서비스 개선 등 다양한 목적으로 활용할 수 있습니다. 또한, 전시실별 주제 분류와 핵심 키워드 정보도 함께 제공되어 문화 콘텐츠 개발에 참고 자료로 활용하기에 적합합니다.
