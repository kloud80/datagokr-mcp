description_portal: '의정부시에서 운영중인 의정부TV 홈페이지(https://www.iubs.tv/index.do)내 등록된 동영상들의 업로드 일자 기준 조회 데이터 입니다.의정부시에서 운영중인 의정부TV홈페이지(https://www.iubs.tv/index.do)에서 제공하는 라이브영상 조회 관련 자료입니다의정부TV는 의정부시청에서 운영하는 공식 인터넷 방송국으로, 시민들에게 시정 소식과 지역 정보를 영상으로 제공하는 플랫폼입니다. 의정부TV는 의정부시청의 방송홍보팀에서 운영하며, 영상 콘텐츠 기획 및 제작, 시 유튜브 운영 등을 담당합니다 .주요 콘텐츠로는 의정부 News: 의정부시의 주요 정책, 행사, 공지사항 등을 다루는 시정 뉴스입니다. 의정부 포커스: 지역 사회의 다양한 이슈와 현장을 심층 취재하여 소개하는 프로그램입니다. 열린 마당: 시민들의 의견을 공유하고 참여할 수 있는 공간으로, 지역 행사나 인터뷰 등을 포함합니다. 또한, 의정부TV는 유튜브 채널인 의정부LIVE를 통해 다양한 영상 콘텐츠를 제공하고 있습니다.의정부TV는 별도의 회원가입 없이 누구나 자유롭게 시청할 수 있습니다. 모바일 기기에서도 최적화된 환경으로 이용이 가능하여, 언제 어디서나 편리하게 의정부시의 다양한 소식을 접할 수 있습니다.의정부TV는 시민과의 소통을 강화하고, 지역 사회의 다양한 이야기를 공유하는 중요한 창구로 활용되고 있습니다.'
