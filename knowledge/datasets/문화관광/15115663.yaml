summary_user: 서울특별시 중랑구 당구장업의 인허가 정보를 업소 한 곳당 한 행으로 담으며, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 포함한다. 동네에 영업 중인 당구장이 어디에 있는지, 최근 어떤 당구장이 문을 열고 닫았는지 확인하려는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 체육시설업·상권 데이터와는 사업장명·주소 같은 이름 매칭이나 같은 기관(지자체) 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: '서울특별시 중랑구의 당구를 하는데 필요한 시설을 갖추어 놓은 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
