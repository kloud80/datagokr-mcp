description_portal: 이 자료는 중부여성발전센터에서 개설하는 교육강좌의 개설 및 접수 가능 정보를 담은 목록입니다. 강좌명, 교육내용, 수강대상, 접수상태, 운영기간, 기관명 등이 포함되어 있어, 여성 역량 강화 프로그램이 어떤 형태로 제공되는지 한눈에 파악할 수 있도록 구성돼 있습니다. 접수마감된 강좌는 제외돼 있어 실제 신청 가능한 강좌 위주로 제공되며, 이를 통해 여성 대상 교육기회의 공급 상태, 지역별 프로그램 분포, 대상 유형별 강좌 특성 분석 등이 가능합니다. 또한 데이터는 교육프로그램 기획, 수요-공급 간격 파악, 참여율 제고 전략 수립 등 다양한 교육정책 및 운영관리 관점에서 활용될 수 있습니다.중부여성발전센터에서 실시하는 교육강좌 정보입니다. 교육신청은 http://jungbu.seoulwomen.or.kr 에서 직접 하셔야 합니다. ※ 접수마감 된 강좌 정보는 출력되지 않으며, 제공되는 데이터는 http://jungbu.seoulwomen.or.kr 와 데이터 연계 시간차이로 접수마감 여부가 차이가 날수 있으니 양해 바랍니다.
