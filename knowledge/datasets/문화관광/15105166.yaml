summary_user: 국악 관련 아카이브 자원을 자원 한 건 단위로 담으며, 명칭·주된 책임자·등록일·소속 DB·주제 분류·주제어·크기나 재생시간·내용·관련 장소·시간적 범위·언어·저작권 정보를 포함한다. 연구자나 교육자가 '특정 국악 장르나 인물과 관련된 음원·영상·문헌 자료가 어떤 DB에 있고 저작권 조건은 어떤가'를 찾을 때 쓴다. 전역 조인 키가 없어 KOPIS 공연ID 같은 공연 데이터와 바로 붙지 않고, 자원명·인물명·주제어 같은 이름 매핑으로만 다른 데이터와 잇는다.
description_portal: 국악 관련 다양한 자료와 정보를 체계적으로 아카이브하여 제공하는 데이터셋으로, 자원의 명칭, 주된 책임자, 등록일, 소속 DB, 주제 분류, 핵심 주제어, 자원의 크기나 재생시간, 내용, 관련 장소, 시간적 범위, 언어, 저작권 등 폭넓은 정보를 포함하고 있습니다. 연구자, 교육자, 문화예술 종사자 등 다양한 이용자가 국악 자료를 검색, 분석, 교육 자료로 활용하거나 문화유산 보존 및 전승 연구에 참고할 수 있습니다. 또한, 디지털 아카이브 구축, 국악 콘텐츠 개발, 문화정책 수립 등에도 유용하게 활용될 수 있습니다.
