summary_user: 김해시가 설치·관리하는 야외운동기구를 설치 장소(시설명) 단위로 담은 파일로, 장소마다 주소·위도·경도·행정동, 기구 종류별 현황과 수량, 담당부서가 들어 있다. 김해시 주민이 집 근처 어느 공원이나 쉼터에 어떤 운동기구가 몇 개 있는지 찾거나, 분석가가 행정동별 생활체육 기구 분포와 접근성 격차를 볼 때 쓴다. 전국 공통 조인 키는 없으므로 행정동코드·행정동명으로 동 단위 인구·통계와 맞추거나 위도·경도로 다른 공간 데이터와 겹쳐 쓴다.
description_portal: 경상남도 김해시에서 설치하여 관리하는 야외운동기구 현황에 관한 데이터로, 야외운동기구의 시설명, 소재지(주소), 기구현황(종류, 수량), 담당부서의 항목을 제공하고 있습니다.해당 데이터의 데이터 기준일자는 2026년 6월 30일로, 연간 주기로 관리하고 있습니다.* 운동기구 파손 등 기타 사유로 실제와 차이가 있을 수 있습니다.* 해당 데이터는 공간정보(GIS) 및 다른 공공데이터와 연계하여 생활체육 인프라 분석, 시설 접근성 평가, 지역별 서비스 격차 분석, 정책 수립 지원, AI 기반 데이터 분석 및 서비스 개발 등에 활용할 수 있습니다.
