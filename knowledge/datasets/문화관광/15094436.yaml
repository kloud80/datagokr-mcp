summary_user: 빅카인즈(BIGKinds)에서 일본 관련 신문·방송 기사를 골라 기사 한 건마다 일자, 언론사, 제목, 통합 분류, 키워드, 특성추출 단어를 담은 건별 메타데이터로, 전국 단위·비공간 자료이며 CSV 파일 하나(약 62MB)로 받는다. 연구자나 정책 분석가가 '한일 외교·역사·경제 현안에 대한 국내 언론 보도가 시기별로 어떻게 늘고 줄었고 어떤 키워드가 함께 등장했나'를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자·언론사명·키워드 같은 이름 매칭으로만 잇고, 같은 재단의 다른 국가별 뉴스 메타데이터와 같은 컬럼 구조로 나란히 비교하는 식으로 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 구축된 일본 관련 뉴스 분석 메타정보 자료입니다. 일본은 한국과 지리적으로 인접하며 정치·경제·문화적으로 긴밀한 관계를 맺고 있어 언론 보도에서 꾸준히 주목받는 국가입니다. 본 자료는 주요 신문과 방송 보도에서 일본과 관련된 기사들을 수집해 주요 키워드와 등장 빈도를 추출하고, 시기별 보도 경향과 주요 이슈의 변화를 분석할 수 있도록 구성되었습니다. 이를 통해 한일 외교 현안, 역사·영토 문제, 경제 협력과 갈등, 문화 교류 및 사회적 인식의 변화를 종합적으로 살펴볼 수 있습니다. 또한 학술 연구, 국제 관계 분석, 언론 담론 연구, 정책 수립 등 다양한 분야에서 활용 가능한 기초 자료를 제공하며, 특히 동아시아 정세를 이해하고 미래지향적 한일 관계를 모색하는 데 의미 있는 참고 자료가 될 수 있습니다.
