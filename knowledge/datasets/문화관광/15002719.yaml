summary_user: 강동구도시관리공단이 운영하는 체육시설 정보를 담은 4474바이트 분량의 작은 CSV 파일이며, 실제 첫 열 제목은 '수영장 수질검사 측정결과(2013~2014)'여서 시설 목록보다는 수영장 수질 측정 기록에 가까운 내용으로 보인다. 강동구 공공 수영장을 이용하려는 주민이나 생활체육 시설을 살피는 분석가가 '이 수영장의 과거 수질검사 결과가 어땠나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 시설 이름을 맞추거나 같은 기관 자료끼리만 이어 쓴다.
