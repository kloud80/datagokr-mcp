summary_user: 전국 지자체가 관리하는 스키장 인허가 정보를 업소 단위로 담은 데이터로, 사업장명·인허가일자·영업상태·주소·좌표를 제공하며 전체 23건(1981-04-07~2026-07-23)이다. 분석가나 지자체 담당자가 전국 스키장 업소의 영업·폐업 현황과 위치를 확인하는 질문에 쓴다. 지번주소(LOTNO_ADDR)와 도로명주소(ROAD_NM_ADDR)를 주소 키로 삼아 다른 주소 기반 데이터와 이어 쓰고, 같은 체육시설업 명부의 다른 업종과도 같은 축에서 견줄 수 있다.
description_portal: '생활_스키장 데이터는 스키를 타기 위해 조성된 슬로프 외 숙박시설, 휴식공간, 식당 및 오락시설 등으로 구성된 업소정보 데이터로 인허가일자, 영업상태, 사업장명, 소재지주소 등의 데이터를 제공합니다.- 공공데이터의 제공 표준을 기준으로, 전국 지방자치단체에서 관리하는 스키장 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의 - 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 스포츠산업과 / 044-203-3156 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
