description_portal: 문체부 산하 기타공공기관인 한국체육산업개발의 정원 현황 관련 정보입니다.주요 컬럼으로는 기준일자, 부서명, 임원 정원 수 및 직군,직급별 정원 수 등이 포함되어 있으며, 기관 내 인력 배치 및 운용 현황을 정확히 파악할 수 있도록 구성되어 있습니다.2014년 부터 현재까지 기준일자로 구성되어 있습니다.이 데이터는 공공기관의 조직 운영 투명성 제고와 효율적인 인력관리, 정책 수립 및 분석을 지원하기 위해 개방됩니다.데이터는 매년 갱신되며, 최신 인력 현황을 반영합니다.본 데이터를 활용함에 있어 실제 현원과의 차이나 일시적 변동이 있을 수 있으니 참고 바랍니다.국민과 타 기관이 공공기관의 인력 구조와 정원 계획을 이해하고, 행정의 투명성을 확인하는 데 중요한 자료로 활용될 수 있습니다.메타데이터 중장기 개방 계획에 따라 개방을 준비하여, 2025년도 7월에 개방하였습니다.
