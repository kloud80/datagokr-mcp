summary_user: 대구광역시 수성구 관내 인쇄업체를 업체 한 곳당 한 행으로 담은 명단 파일(CSV, 약 5.6KB)로, 업종·사업체명·소재지 주소·전화번호·영업상태를 담는다. 수성구에서 인쇄소를 찾는 주민이나 지역 인쇄업 분포와 영업 중인 업체 수를 확인하려는 분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 업체명이나 소재지 주소를 이름·주소 매칭으로 연결하거나 같은 기관(수성구) 자료끼리 맞춰 쓴다.
limits: 사업자번호·인허가번호 같은 고유 식별자가 실측 컬럼에 없어 다른 원장과 정확히 조인하기 어렵다. 범위는 수성구 한 곳에 한정되며, 실측 필드에는 등록일자가 없어 포털 설명과 달리 개업·폐업 추이 분석에는 바로 쓰기 어렵다.
