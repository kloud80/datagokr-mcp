summary_user: 한국영상자료원이 소장한 영화·방송·영상예술 분야 도서를 한 권씩 담은 건별 목록으로, 도서명(title)·저자·주제 분류와 키워드·분량·설명·언어·권리 정보 등이 들어 있다. 영상 분야 연구자나 교육자가 특정 감독이나 장르를 다룬 참고 도서가 자료원에 있는지 찾을 때 쓴다. 실측 컬럼에서 ISBN이나 도서관코드 같은 전역 조인 키는 확인되지 않아, 다른 도서관·서지 데이터와는 도서명·저자 이름을 맞추는 방식으로만 연결한다.
description_portal: 한국영상자료원이 소장한 도서에 대한 상세 정보를 제공하는 데이터셋입니다. 도서명, 저자, 출판사, 발행연도 등 기본 정보를 포함하여 영화, 방송, 영상예술 분야의 연구와 교육, 문화콘텐츠 개발에 활용할 수 있습니다. 본 자료는 영상 관련 학술 연구자와 교육자뿐만 아니라 자료를 체계적으로 관리하려는 기관에도 유용하며, 문화산업 종사자들이 기획이나 참고자료로 활용하기 적합합니다. 공공데이터를 통해 문화예술 분야의 지식 확산과 정보 접근성을 높이고, 새로운 콘텐츠 개발, 정책 수립, 문화산업 연구 등 다양한 목적에 기초 자료로 제공됩니다.
