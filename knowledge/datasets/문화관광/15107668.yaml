status: active
summary_user: 한국스포츠정책과학원 홈페이지에 등록된 단체 견학 기록을 견학 건별로 담는 API로, 참여 그룹명·참여일자·참여대상·참여인원수를 제공한다. 과학원 견학을 계획하는 학교·단체나 방문 운영 현황을 보려는 분석가가 "어떤 대상 그룹이 언제 몇 명 규모로 견학했는가"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 그룹명 같은 이름 매핑이나 같은 기관(국민체육진흥공단) 데이터 기준으로만 이어 쓴다.
limits: 공통 코드나 기관 식별자가 없어 다른 체육 데이터와 키로 바로 결합할 수 없다. 전국 범위의 비공간 데이터라 지역별 분석에는 쓰기 어렵고, 체육 분야 안에서는 보조 등급으로 분류된 데이터다.
