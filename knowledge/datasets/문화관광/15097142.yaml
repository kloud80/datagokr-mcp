summary_user: 서귀포시 이중섭거리를 중심으로 짠 무장애 여행코스를 지점 단위로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명과 전체코스·추천코스 여부를 담는다. 휠체어 이용자나 교통약자 동반 여행자가 "이중섭거리에서 휠체어로 다닐 만한 동선과 들를 곳이 어디인가"를 확인하거나, 열린관광지 정책 담당자가 코스 구성을 검토할 때 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 장소 이름 매칭이나 위도·경도 좌표 근접으로만 이어 쓴다.
description_portal: '"제주특별자치도 내 제주특별자치도_이중섭거리_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 서귀포시에 위치한 이중섭거리를 중심으로 구축된 무장애 여행 코스 정보를 제공한다. 교통약자 및 휠체어 이용자가 이동하기 적합한 동선, 접근 가능한 문화·예술 공간, 휴식 및 편의시설 현황 등을 포함하여 관광 접근성을 높이기 위해 수집된 자료이다. 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 현장 기반 요소가 반영되어 있으며, 무장애 관광환경 조성, 열린관광지 개발, 관련 정책수립 및 관광 서비스 개선 등 다양한 영역에서 활용할 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
