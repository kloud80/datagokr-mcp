summary_user: 서울특별시 광진구에서 인쇄업 인허가를 받은 인쇄사를 업소 한 곳당 한 행으로 담은 건별 인허가 원장으로, 업소명·소재지 주소·인허가일자·폐업일자·영업상태와 중부원점TM 좌표(X, Y)가 들어 있다. 광진구 안에서 지금 영업 중인 인쇄소가 어디에 몇 곳 있는지, 언제 문을 열고 닫았는지 확인하려는 사업자나 지역 산업 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업소명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 이 데이터는 서울특별시 광진구 내에서 인쇄업 인허가를 받아 운영 중인 인쇄사 및 관련 업소에 대한 현황 정보를 제공합니다. 해당 업소는 상업용 인쇄, 홍보물 제작, 서류 출력, 출판물 생산 등 다양한 인쇄 서비스를 전문적으로 제공하는 사업체로 구성되어 있으며, 업소명, 소재지, 업종유형, 인허가일자 등의 정보가 포함됩니다. 본 데이터는 지역 내 인쇄산업 분포를 파악하고, 인쇄 관련 인프라 분석, 사업자 현황 파악, 행정용 자료 제공 등에 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84) 좌표는 포함되어 있지 않으므로 지도 연동 시 좌표 변환이 필요합니다. 데이터는 3일 전 기준의 최신 자료로 정기적으로 갱신되며, 소상공인 정책, 산업 구조 조사, 지역 경제 분석 등 다양한 분야에서 활용할 수 있는 기초 데이터입니다.
