summary_user: 성남시 안에 있는 국가지정·시지정 문화재를 한 건씩 담은 목록 파일로, 건마다 지정 구분, 명칭, 소유자(보유자), 관리단체, 지번·도로명 소재지를 적는다. 시민이나 해설·탐방 프로그램 담당자가 '성남시에 있는 보물·사적은 무엇이고 어디에 있으며 누가 관리하나'를 확인할 때 쓴다. 전역 조인 키가 없어 국가유산청 데이터와는 명칭으로 맞추거나, 소재지 주소를 주소·좌표 체계와 매칭해 이어 쓴다.
limits: 국가유산청 종목코드·지정번호 같은 공통 코드가 실측 컬럼에 없어 다른 유산 데이터와 바로 결합되지 않고, 이름 매핑에 의존해야 한다. 범위는 성남시 한 곳뿐이므로 다른 시군구나 전국 현황은 국가유산청 자체 API 등 별도 데이터로 확인해야 한다.
