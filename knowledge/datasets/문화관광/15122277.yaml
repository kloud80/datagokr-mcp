summary_user: 광주 남구에 있는 출판사를 한 곳당 한 행으로 담은 파일 데이터로, 사업체명·도로명 또는 지번 소재지·전화번호·데이터기준일자를 담는다(시군구 범위, 주소 단위 개별 업체). 지역 출판 산업 분포를 보려는 분석가나 남구에서 협력할 출판사를 찾는 도서관·학교·저자가 '남구에 어떤 출판사가 어디에 있나'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 사업체명 매칭이나 주소를 지오코딩해 행정구역·좌표 기준으로만 이어 쓴다.
description_portal: 광주광역시 남구에 소재하는 출판사 운영 현황 및 정보(상호명, 주소, 전화번호 등)를 제공합니다. 해당 데이터는 광주광역시 남구청 문화관광과(☎062-607-2314)에서 제공합니다. 전화번호에 개인정보가 포함되어 있는 경우 공란 처리하였으며, 도로명 주소가 없는 경우 소재지(지번) 정보를 제공하였으니 데이터 이용 시 참고하시기 바라며, 공공데이터는 기준 시점에 따라 변동이 있을 수 있으므로 자세한 정보는 소관 부서에 문의하여 주시기 바랍니다. ※ 출판사는 책, 잡지, 간행물 등 다양한 출판물을 기획·편집·제작하여 독자에게 제공하는 전문 업체입니다. 해당 데이터는 지역 내 출판 산업 분포를 파악하고, 문화산업 정책 수립, 독서문화 활성화 사업, 도서관·학교와의 연계 프로그램 운영 등 공공 분야에서 활용될 수 있으며, 민간에서는 도서 유통 경로 분석, 신간 도서 기획, 저자와 출판사 매칭, 독립 출판 지원 등에도 응용할 수 있습니다.
