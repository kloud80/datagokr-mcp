description_portal: '한국영상자료원이 소장 중인 음반 자료와 음반 자료에 포함된 수록곡에 대한 상세정보 데이터입니다.해당 데이터는 총 4개의 csv 파일로 구성되며 모든 파일에 공통적으로 존재하는 "음반등록번호" 필드에 의해 조합이 가능합니다.파일 구성1. 음반상세정보2. 음반관련영화3. 음반크레딧4. 수록곡상세정보음반관련영화 파일은 아래 URL을 통해 확인 가능한 영화정보DB API와 "영화작품코드" 필드를 기준으로 조합이 가능합니다.- 영화정보DB API URL : https://www.data.go.kr/data/3035985/openapi.do한국영상자료원은 CD, SP, SP를 포함해 음반 실물자료 총 7,704개에 대한 데이터를 개방하고자 하며 수록곡 기준으로는 총 115,689건에 해당합니다.데이터 기술은 실물자료의 표지, 커버 등에 쓰여진 문자를 그대로 입력하는 것을 원칙으로 합니다.'
