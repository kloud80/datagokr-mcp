description_portal: '이 데이터는 의왕시 도서관에서 운영하는 키즈룸의 어린이 프로그램 상영 정보를 담고 있습니다. 상영 프로그램의 제목, 상영일, 시작 및 종료 시간으로 구성되어 있습니다. 특히 아이들의 눈높이에 맞춘 영상 콘텐츠나 교육적인 프로그램을 통해 도서관이 단순한 책 읽기 공간을 넘어 어린이 문화 체험 공간으로 활용되고 있습니다. 시민들은 이 데이터를 활용해 자녀와 함께 방문 계획을 세우고, 지역 내 안전하고 유익한 여가 공간을 보다 편리하게 이용할 수 있습니다. 어린이의 창의력과 정서 발달을 위한 공공서비스로서 의미 있는 정보를 담고 있는 자료입니다. (참고사항: 코로나19 이후 도서관 키즈룸 프로그램은 견학 프로그램과 통합하여 운영하고 있습니다. )'
