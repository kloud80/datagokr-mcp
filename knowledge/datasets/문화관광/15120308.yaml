summary_user: 국립박물관문화재단 박물관 상품 브랜드 뮷즈(MU:DS)의 정기 공모에서 선정된 상품을 연번·업체명·상품명 단위로 나열한 전국 범위 목록 파일로, 3KB 남짓(csv 3003바이트)의 작은 원천 목록입니다. 박물관 상품 공모에 지원하려는 사업자나 문화상품 분석가가 어떤 업체의 어떤 상품이 뮷즈 공모에 선정됐는지 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 업체명·상품명 같은 이름 매칭으로만 연결한다.
description_portal: 국립박물관문화재단 뮷즈 정기 공모(박물관상품 공모) 선정 목록에 대한 데이터로 연번, 업체명, 상품명 정보를 포함하고 있습니다.뮷즈(MU:DS)란 국립박물관이 소장한 문화유산을 모티브로 많은 사람들이 일상에서 가깝게 느끼고 사용할 수 있도록 만든 국립박물관문화재단의 박물관 상품 브랜드로 박물관 문화유산의 고유한 가치에 오늘날의 쓰임새를 더해 유물을 소장하는 즐거움을 제공하고 박물관에서의 좋았던 순간을 일상에서 두고두고 이어가고 싶은 마음을 채웁니다.해당 데이터파일의 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 해주시기 바랍니다.
