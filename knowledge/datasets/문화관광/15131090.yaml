summary_user: 부산광역시 북구에서 열리는 공연·전시를 행사 한 건씩 담은 파일로, 행사명·구분·시작/종료 일자와 시각·행사장소·주소·관람료·기획사를 기록하며 파일 크기는 607바이트로 매우 작다. 북구 주민이나 방문객이 '이번 기간 북구에서 어떤 공연·전시가 언제 어디서 열리고 관람료는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키나 KOPIS 공연ID가 없어 다른 데이터와는 행사명·행사장소 이름이나 주소를 맞춰 붙이는 방식으로만 이어 쓴다.
limits: KOPIS 공연ID·공연장ID 같은 공통 키가 없어 KOPIS 공연 목록이나 예매·매출 데이터와 자동으로 연결되지 않는다. 명세상 반기 또는 이벤트 단위로 만들어진 뒤 바뀌지 않는 파일이므로 수록된 행사가 현재 일정이라고 단정하면 안 된다. 범위는 북구 한 개 시군구에 한정된다.
