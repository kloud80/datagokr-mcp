description_portal: 이 데이터는 한국문화예술위원회가 수집한 문학 분야의 한국문학 외국어 번역 도서 정보를 정리한 자료로, 1999년부터 2006년까지의 번역 출판 현황을 체계적으로 보여줍니다. 주요 항목은 연번, 연도, 서명(번역), 서명(원제), 저자, 역자, 번역어, 출판국, 출판사, 장르, 출처로 구성되어 있으며, 한국문학의 세계화 경향과 번역어 다양성, 국가별 출판 경향 등을 파악하는 데 유용한 정보입니다. 번역어 항목에는 영어, 독어, 스페인어, 말레이어, 불어, 폴란드어, 러시아어, 포르투갈어, 체코어 등 다양한 언어가 포함되어 있으며, 장르 항목은 소설, 시, 희곡 등으로 구성되어 있어 번역 대상 문학 유형의 분포를 분석할 수 있습니다. 출처 항목에는 대산문화재단 등 번역 사업을 후원한 기관명이 기재되어 있으며, 이는 문학 교류 정책 및 국제 협력 구조를 분석하는 데 중요한 단서를 제공합니다. 해외 독자와의 소통 확대에 기여합니다.
