description_portal: 광주관광 오매광주 홈페이지의 주요 관광명소 486건의 데이터 정보를 2025년 9월 22일 기준으로 제공합니다.구분은 예술문화, 역사전통, 자연, 거리, 공원, 체험·스포츠, 숙박, 맛집, 쇼핑, 코스관광 등 개 분야로 10개  대분류하고 각 10분야의 세세분야로 소분류하여 되어있으며 세부 분야별 관광지 목록은  한글과 영문으로 병기해 국내  관광객은 물론 외국인 방문객도 쉽게 이해하고 활용할 수 있도록 구성했습니다. 관광명소 데이터는 광주광역시의 분야별 대표 명소 목록으로  관광자원 검색, 안내자료 제작, 홍보 콘텐츠 개발, 관광관련 프로그램 개발  등 다양한 분야에서 실질적인 데이터의 활용 가치를 가지고 있음
