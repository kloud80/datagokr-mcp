summary_user: 서울시립미술관이 소장한 작품을 한 점씩 담은 목록으로, 부문(prdct_cl_nm)·수집연도·국문/영문 작품명·규격·제작년도·재료와 기법·작가명·대표 이미지와 썸네일 이미지 주소를 담는다. 시민이나 연구자가 특정 작가의 작품을 미술관이 소장하는지, 어느 해에 어떤 부문의 작품을 많이 수집했는지 확인하는 데 쓰고, 온라인 전시나 디지털 아카이브 화면을 만드는 데도 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름 매핑으로만 이을 수 있고, 문화시설 코드나 좌표 같은 시설 단위 키도 담지 않는다.
description_portal: 서울시립미술관 소장품 정보는 미술관이 수집·소장하고 있는 작품들의 기본 특성을 정리한 데이터입니다. 부문과 수집연도는 작품이 어떤 범주에 속하며 언제 수집되었는지를 보여주어 소장품의 구성과 연대별 특징을 파악하는 데 도움을 줍니다. 작품명과 작품규격, 제작년도는 각 작품을 식별하고 크기와 제작 시기를 확인할 수 있는 핵심 정보입니다. 재료·기법은 작품이 어떤 재료와 표현 방식을 통해 만들어졌는지 설명해 주어 예술적, 기술적 특징을 이해하는 데 중요한 단서가 됩니다. 작가명은 작품의 창작 주체를 나타내며, 메인이미지와 썸네일이미지는 온라인 전시, 디지털 아카이브, 홍보 자료 등에 활용되어 시민들이 소장품을 시각적으로 접하고 감상 경험을 확장하는 데 활용될 수 있는 시각 정보입니다.
