description_portal: '본 데이터는 국가유산진흥원이 운영하는 전통문화 공연장의 시설 현황 정보를 제공합니다. 주요 시설로는 민속극장 풍류, 한국문화의집(KOUS), 한국의집 민속극장이 있으며, 각 공연장별로 공식 명칭, 소재지(도로명 주소 기준), 공연장 면적(㎡), 객석 수, 담당 부서, 대관문의 연락처 등의 항목으로 구성되어 있습니다.■ 항목별 설명ㆍ 시설명: 공연장의 공식 명칭ㆍ 주소: 도로명 주소 기준의 위치 정보ㆍ 면적(㎡): 공연장 내부 사용 가능 면적(제곱미터 단위)ㆍ 객석 수: 고정 설치된 좌석 수ㆍ 담당부서: 공연장 운영을 담당하는 국가유산진흥원 내 부서명ㆍ 공연장 문의 연락처: 문의 가능한 전화번호이 데이터는 문화유산 기반 공연장의 물리적 인프라 현황을 파악하는 데 유용하며, 전통공연 관련 행사를 기획하거나 지역문화 활성화를 위한 기반 분석, 공공문화시설에 대한 접근성 연구 등 다양한 용도로 활용될 수 있습니다. 또한 공연장별 공간 규모 및 수용 능력 분석, 대관 가능성 판단, 전통문화 행사 수요 예측, 정책기획 및 예산 편성, 민간 공연 기획사의 공간 조사 및 벤치마킹 등에도 활용 가능합니다.예를 들어, 공연기획자는 특정 지역의 공연장 위치와 규모, 객석 수를 사전에 파악하여 행사의 적정 장소를 선정할 수 있고, 행정기관은 각 공연장의 운영 책임 부서 및 연락처 정보를 토대로 시설 관리 및 협업을 추진할 수 있습니다.데이터는 연 1회 이상 정기적으로 갱신되며, 대관 문의 및 세부 운영 규정은 국가유산진흥원 누리집을 통해 확인할 수 있습니다.■ 민속극장 풍류, 한국문화의집 KOUS: www.kh.or.kr/cms/content/view/280■ 한국의집 민속극장: www.kh.or.kr/cms/content/view/556※ 본 데이터는 공공기관의 전통공연 인프라 운영 실태를 정량적으로 분석할 수 있는 기초 자료로서, 공연예술계, 연구기관, 행정기관 등 다양한 분야에서 활용 가능합니다.'
