summary_user: 역대 전국체육대회 토너먼트 경기를 한 경기 한 행으로 담은 건별 원천 파일로, 경기일·대회구분·종목·종별·세부종목·경기구분과 맞붙은 두 시도의 승패·득점, 결과 사유를 기록한다(CSV 약 66MB). 체육 분석가나 시도 체육회 담당자가 "특정 종목에서 우리 시도가 역대 전국체전 토너먼트에서 어느 시도와 붙어 몇 번 이겼나" 같은 상대 전적·라운드별 성적을 따질 때 쓴다. 전역 조인 키는 없어 다른 전국체전 결과 데이터와는 시도명·종목명·대회구분 같은 이름 값을 맞춰 연결해야 한다.
description_portal: 대한체육회가 주관하는 전국시도가 참가한 역대 전국체육대회 토너먼트 경기의 상세한 결과의 대한 상세 정보를 제공합니다.이 데이터는 아이디, 경기일, 대회구분, 종목, 종별, 세부종목, 경기구분 등 기본적인 경기 정보를 제공합니다. 특히, 토너먼트 경기의 특성상 대결한 두 팀에 대한 정보인 시도1과 시도2, 그리고 각각의 승패(시도1승패, 시도2승패)와 득점(시도1득점, 시도2득점)을 기록하고 있습니다. 경기의 특이사항이나 결과에 영향을 준 사유도 비고란에 포함될 수 있습니다. 또한, "자료바로가기"를 통해 해당 경기의 더 자세한 정보에 접근할 수 있습니다.
