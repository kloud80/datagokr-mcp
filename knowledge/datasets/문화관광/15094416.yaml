summary_user: 서울특별시 서초구에서 인터넷컴퓨터게임시설제공업과 다른 영업을 같은 장소에서 함께 하는 복합유통게임제공업소를 업소별 한 행으로 담은 인허가 원천 데이터로, 관리번호·인허가일자·영업상태·폐업일자·소재지 주소·중부원점TM 좌표·시설 면적과 층수 등을 포함한다. 서초구에서 복합유통게임제공업 창업을 준비하는 예비 사업자가 현재 영업 중인 업소가 어디에 몇 곳 있고 최근 얼마나 폐업했는지 확인하는 데 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙일 전역 조인 키가 없어, 다른 자치구의 같은 업종 인허가 데이터와는 업소명·주소나 같은 기관 코드(OPNSFTEAMCODE)를 맞춰 이어 쓴다.
description_portal: '서울특별시 서초구의 인터넷컴퓨터게임시설제공업 또는 다른 영업을 동일 장소에서 함께 영업하는 업소 정보를 제공합니다. 각 등록업소에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 여가서비스 관련 문화시설 창업을 희망하는 예비 사업자에게는 서초구 지역의 시장 분석 및 등록업소 분포 현황을 파악할 수 있는 중요한 기초 정보를 제공합니다. 나아가, 시민들에게는 운영기준 및 청소년보호 규정을 준수하며 건전한 여가서비스를 제공하는 문화시설의 소재지를 확인할 수 있도록 투명한 정보를 제공합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
