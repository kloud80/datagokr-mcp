description_portal: 시민공모 당선작 아이디어로 시민들의 건강 증진을 위한 공원 내 체육시설, 경기장, 산책로 및 등산로, 공공주택 내 체육시설의 정보 입니다.이 자료는 시민들이 가까운 공원에서 이용 가능한 체육시설의 정보를 쉽게 파악하여 생활 속 운동을 즐길 수 있도록 지원합니다. 행정적으로는 공원 체육시설의 분포 및 이용 현황을 분석하여 지역별 운동 환경 격차 해소 및 노후 시설 개선 등 공원 관리 및 도시 계획 수립의 기초 자료로 활용됩니다.시민 건강 증진 및 공원 이용 편의 향상을 위한 핵심 정보입니다. 참고하시길 바랍니다.
