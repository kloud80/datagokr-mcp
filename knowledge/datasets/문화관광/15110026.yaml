description_portal: 충청북도 청주시에서 2년마다 개최되는 청주공예비엔날레(Cheongju Craft Biennale)에서 1회부터 12회까지의 행사 데이터를 제공합니다.본 공공데이터는 공예비엔날레의 회차, 행사의 주제, 행사 기간, 전시 구분, 작가의 이름(국문 및 영문), 작품명(국문 및 영문)을 포함하고 있으며, 이름은 일부가 마스킹되어 있으므로 데이터 활용 시 참고하시기 바랍니다.청주공예비엔날레는 도자, 목칠, 섬유, 금속 등 공예의 모든 분야를 망라한 국제 종합 예술 행사로 1999년부터 개최되고 있습니다.
