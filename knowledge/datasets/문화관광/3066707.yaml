summary_user: 경상남도 진주시 관내에서 운영 중인 숙박업소(호텔·여관·모텔 등)를 업소 한 곳당 한 줄로 담은 CSV 파일(약 30KB)로, 업종명·업소명·도로명 주소·영업장 면적·객실수를 담는다. 진주 지역의 숙박 공급 규모를 파악하려는 분석가나 사업자가 '진주시에 객실 수가 많은 숙박업소는 어디에 몰려 있나' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 업소명·도로명 주소를 맞추는 방식으로만 잇고, 공중위생법 신고 기반 인허가 원천(LOCALDATA 숙박업)과 대조하는 데 쓴다.
description_portal: '경상남도 진주시_숙박정보경상남도 진주시 관내 운영중인 숙박업소에 관한 정보입니다.(제공정보 - 호텔, 여관, 모텔 등 숙박업소에 대한 업소명, 소재지, 면적, 객실수)* 공중위생업소의 신규, 변경, 지위승계, 폐업 현황은 진주시청 홈페이지에서 열람 가능합니다.(매달 초 업데이트)- 정보소재 : 진주시청 홈페이지 공중위생 민원안내 검색 또는 진주시청 홈페이지-진주소개-실과안내-문화관광국-위생과-공중위생 민원안내  * https://www.jinju.go.kr/00135/01112/05123.web'
