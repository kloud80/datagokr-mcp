summary_user: 경륜 경주별 출주표를 출전 선수 한 명 단위로 담는 API로, 경주일자·경주장·경주번호·출발시각·거리와 선수의 이름·나이·등급·기어배수·훈련지, 최근 3회차 경주의 일자별 순위, 승률·연대율·평균 득점·200m 기록·전법별 우승 횟수 등을 담는다. 경륜 팬이나 언론·분석가가 특정 경주에 나서는 선수들의 최근 성적 흐름과 전법 성향을 비교해 경주 전개를 가늠하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 경륜 데이터와는 경주일자·경주장명·경주번호·선수명을 맞춰 연결해야 한다.
description_portal: '"서울올림픽기념 국민체육진흥공단에서 제공하는 경륜 출주표 정보에 대한 Open API는 경주에 출전하는 선수들의 최근 3회전 성적, 시행처(경주장), 경주일자 등 주요 정보를 조회할 수 있는 공공데이터 서비스입니다. 이 API는 경기 분석 및 예측, 팬 서비스 확대, 언론·미디어 보도자료, 데이터 기반 스포츠 콘텐츠 제작 등에 활용되며, 각 선수의 출전 이력과 성적 흐름을 기반으로 경주의 흐름을 예측하는 데 도움을 줍니다. 사용자는 조건에 맞춰 경주별 출주표를 체계적으로 조회할 수 있어, 경륜 정보를 보다 손쉽고 정확하게 접근할 수 있습니다. 본 API는 경륜 팬과 산업 관계자 모두에게 실용적인 데이터 접근을 제공합니다.'
