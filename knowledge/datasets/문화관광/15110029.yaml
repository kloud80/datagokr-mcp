summary_user: 청주공예비엔날레 1회부터 12회까지 전시된 작품을 작품 한 점당 한 행으로 담은 건별 목록으로, 회차·전시 구분·작가명과 작품명(국영문)·제작연도·크기(가로·세로·높이)·재료·기법·사진 파일명을 포함한다. 연구자나 큐레이터가 '역대 비엔날레에서 도자·섬유 등 어떤 재료와 기법의 작품이 회차별로 얼마나 전시됐는가', '특정 작가가 몇 회차에 어떤 작품을 냈는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 작가명·작품명 같은 이름 매칭이나 같은 청주시 기관 데이터로만 이어 쓸 수 있다.
limits: 공식 코드나 식별자 없이 이름으로만 연결되므로 작가명 표기 차이에 따라 매칭이 어긋날 수 있다. 행사 단위로 만들어진 뒤 바뀌지 않는 수시 갱신 데이터라 12회 이후 회차는 들어 있지 않을 수 있다.
