description_portal: 충청북도 청주시에서 2년마다 개최되는 청주공예비엔날레(Cheongju Craft Biennale)에서 1회부터 12회까지 전시한 작품에 대한 세부 정보를 제공합니다.본 데이터에는 전시작품의 회차, 전시 구분, 심사결과, 작가명(국문 및 영문), 작품명(국문 및 영문), 제작연도, 작품크기(가로, 세로, 높이), 재료(국영문, 해당하는 경우), 기법(국영문, 해당하는 경우), 사진 파일명 등의 내용이 포함되어 있습니다.청주공예비엔날레는 도자, 목칠, 섬유, 금속 등 공예의 모든 분야를 망라한 국제 종합 예술 행사로 1999년부터 개최되고 있습니다.
