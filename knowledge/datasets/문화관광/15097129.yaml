summary_user: 제주특별자치도 수원리 일대 해안 탐방로의 무장애 여행 코스를 지점 단위로 담은 원천 데이터로, 순서·위도·경도와 구분·설명·포인트·상세정보, 전체코스·추천코스 여부를 함께 담는다. 휠체어 이용자나 교통약자 동반 여행자가 "수원리 해안길에서 휠체어로 다닐 수 있는 동선과 쉬어 갈 지점은 어디인가"를 확인하거나, 열린관광지·관광 인프라 개선 담당자가 현장 접근성을 점검하는 데 쓴다. 실측 컬럼에 TourAPI contentId 같은 전역 조인 키가 없어서, 다른 관광 데이터와는 지점 이름 매핑이나 위경도 근접 비교로만 잇는다.
description_portal: '"제주특별자치도 내 제주특별자치도_수원리해안탐방로_무장애여행코스 데이터를 제공합니다.*본 데이터셋은 제주특별자치도 수원리 일대의 해안 탐방로를 중심으로 구축된 무장애 여행 코스 정보를 제공한다. 해당 탐방로는 해안 경관을 따라 이동하는 산책형 코스로, 교통약자와 휠체어 이용자의 이동 편의를 높이기 위해 접근 가능한 동선, 전망 지점, 휴게시설 및 편의시설 정보를 포함하고 있다. 현장 조사 기반의 노면 상태, 경사도, 보행환경, 주차 및 화장실 접근성 등 요소가 반영되어 있으며, 자연친화적 무장애 관광환경 조성, 열린관광지 개발, 정책 수립 및 관광 서비스 품질 향상을 위한 기초자료로 활용될 수 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
