summary_user: 경기도 광주시 도서관에서 운영하는 무료 영화 상영 프로그램의 일정을 상영 건별로 담은 파일 데이터로, 영화 제목·장르·관람 등급 분류·상영 시작 날짜와 시간·상영 장소(도서관)를 포함한다. 광주시 시민이 이번 달 어느 도서관에서 언제 어떤 영화를 무료로 볼 수 있는지 확인하거나, 분석가가 도서관 문화 프로그램의 장르·장소별 운영 현황을 살펴보는 데 쓴다. 실측 컬럼에 도서관코드 같은 전역 조인 키가 없어서, 다른 도서관 데이터와는 장소(도서관 이름)를 이름으로 맞춰야만 이어 쓸 수 있다.
description_portal: 본 데이터는 경기도 광주시 소재 도서관에서 시민들을 대상으로 운영하는 무료 영화 상영 프로그램의 일정 정보를 제공합니다. 상영 영화의 제목과 장르를 통해 영화의 종류를 파악할 수 있으며, 분류 정보는 관람 연령 및 영화의 특성을 나타냅니다. 시작날짜와 시작시간은 상영 일정을 명확히 하여 시민들이 관람 계획을 수립할 수 있도록 지원하며, 장소 정보는 상영이 이루어지는 도서관을 안내합니다. 본 데이터는 지역 주민에게 문화생활 기회를 제공하고 여가 활동을 지원하는 공공 서비스 정보로서, 시민의 문화 접근성을 높이고 삶의 질 향상에 기여합니다.
