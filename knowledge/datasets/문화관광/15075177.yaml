description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다"* 남태해안로는 제주 서귀포시 남원읍에서 표선면 토산리까지 이어지는 해안도로 구간으로, 드넓은 바다와 해안 절벽, 현무암 해안, 바다 조망이 가능한 풍경을 따라 포장된 도로와 일부 보행로가 연결되어 있으며 무장애 정보에는 주차장, 평탄 도로, 안내 표지 등이 포함되어 휠체어나 유모차 이용자, 고령자, 교통약자 등도 해안 드라이브 및 산책을 포함한 여행 코스를 비교적 편안하게 즐길 수 있는 열린 관광지로 제공된다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
