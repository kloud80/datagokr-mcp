description_portal: '서울특별시 서대문구 관내 위치한 일반유원시설업 현황(사업장명, 주소, 전화번호, 좌표 등)에 대한 데이터를 제공합니다.서대문구 일반유원시설업 현황은 테마파크 등 안전성 검사대상의 놀이기구를 한 종류 이상 설치하여 운영하는 업소정보 입니다.서대문구 일반유원시설업 현황 데이터의 주요항목은 사업장명, 주소, 영업상태, 좌표, 인허가일자 등이 포함되어있습니다.이 데이터는 CSV 형태로 제공되며 다운로드 가능합니다.  좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보'
