description_portal: 그랜드코리아레저(주) 직원들이 전자도서관을 통해 전자책 또는 오디오북을 대출한 내역입니다. 본 데이터는 이용자, 책이름, 작가이름, 도서 출간일, 도서 대출일, 도서 반납일, 도서 출판사, ISBN, 데이터 조회 일자 등이 포함되어 있습니다. 이를 통해 월별, 연간 도서 대출 통계, 이용자별 선호장르, 장기 미반납 도서 추이 등을 분석할 수 있습니다. 도서관 운영자나 정책 담당자는 해당 데이터를 활용해 이용자 맞춤형 서비스 개선, 전자 자원 확대, 대출 기간 조정 등 전략 수립과 업무 효율화를 도모할 수 있습니다. 제공하고 있는 데이터의 기준년도는  2021-2022(6월)입니다.
