summary_user: 서울 송파구 안의 체육시설을 시설 한 곳당 한 행으로 담은 파일로, 업종·상호·도로명 주소·전화번호를 담는다. 송파구 주민이나 생활체육 이용자가 "집 근처에 어떤 체육시설이 있고 연락처는 무엇인가"를 찾을 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 도로명 주소를 맞춰 잇거나 같은 기관(송파구) 자료끼리만 연결한다.
limits: 범위가 송파구 한 곳에 그치고, 실측 컬럼에 표준 시설 코드 같은 공통 키가 없어 문체부 전국체육시설 자료 등과 정확히 붙이려면 이름·주소 매칭이 필요하다. 예약·대관 정보는 담지 않으며 예약은 광역 단위 서비스에서 따로 찾아야 한다.
