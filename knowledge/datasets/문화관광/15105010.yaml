summary_user: 국립중앙극장·국립현대미술관·한국콘텐츠진흥원·수원문화재단·인천문화재단 등 5개 기관의 교육·체험 프로그램을 프로그램 한 건씩 담은 원천 목록으로, 제목·요약·요금(charge)·기간·장소·언어·저작권 같은 속성이 함께 들어 있다. 시민이나 서비스 개발자가 '이번 달 국립 기관이나 지역 문화재단에서 열리는 유료·무료 문화예술 교육 프로그램은 무엇인가' 같은 질문에 답할 때 쓴다. 실측 컬럼에는 전국 단위로 통하는 조인 키가 없어서, 다른 데이터와는 기관명(publisher)·장소명(venue) 같은 이름을 맞추거나 같은 기관 데이터끼리만 연결할 수 있다.
description_portal: 문화체육관광부 산하 국립중앙극장, 국립현대미술관, 한국콘텐츠진흥원, 수원문화재단, 인천문화재단 등 5개 기관에서 제공하는 다양한 교육 정보를 통합하여 제공합니다. 예술, 문학, 음악, 종교, 교통 등 여러 분야의 교육 체험과 프로그램 정보를 포함하고 있으며, 자원의 요약, 요금, 저작권, 발행일, 언어, 기간, 장소 등 다양한 속성 정보를 함께 제공합니다. 이 데이터는 교육 프로그램 기획, 문화예술 체험 정보 제공, 정책 연구, 문화자원 활용 등 다양한 분야에서 활용할 수 있습니다. 기관별 교육 현황 파악이나 문화예술 관련 서비스 개발에도 유용하게 활용될 수 있습니다.
