summary_user: 충청북도 내 조정·카누·요트 경기장을 시설 한 곳당 한 행으로 정리한 현황 파일로, 시설명·소재 시군·경기장 규격·준공연도를 담으며 파일 크기는 165바이트에 불과한 소규모 목록이다. 수상스포츠 동호인이나 체험객이 '충북에서 카누나 조정을 할 수 있는 경기장이 어느 시군에 있고 언제 지어졌나'를 확인할 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명이나 소재 시군 이름을 맞춰 연결해야 한다.
description_portal: 충청북도는 도내 수상스포츠와 주민 여가활동 지원을 위해 조정, 카누, 요트 경기장 정보를 공공데이터로 제공하고 있습니다. 이 데이터에는 충주시의 탄금호국제조정경기장과 충주요트장, 영동군의 영동카누카약체험장, 진천군의 충북카누경기장 등 주요 시설의 위치, 부지 면적, 경기장 규격, 준공연도, 관리기관 및 연락처가 포함되어 있습니다. 이를 통해 체육인, 연구자, 일반 이용자 모두가 경기장 현황을 쉽게 확인할 수 있으며, 지역 내 수상스포츠 시설 활용과 체험 활동에 유용하게 활용할 수 있습니다.
