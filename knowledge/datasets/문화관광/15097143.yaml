summary_user: 제주 이호테우해변과 내도동 알작지 일대 무장애 여행 코스를 지점 단위로 담은 파일로, 각 지점의 순서·위도·경도·구분·설명·상세정보와 전체코스·추천코스 여부를 담는다. 휠체어 이용자나 교통약자, 무장애 여행 서비스 개발자가 '이호테우해변에서 알작지까지 휠체어로 갈 수 있는 동선과 쉬어 갈 지점은 어디인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 위도·경도나 지점 이름 매칭으로만 연결하며, TourAPI 관광지 정보와 이을 때도 이름·좌표 대조가 필요하다.
description_portal: '"제주특별자치도 내 제주특별자치도_이호테우해변과내도동알작지_무장애여행코스 데이터를 제공합니다.* 본 데이터셋은 제주특별자치도 이호테우해변과 내도동 알작지 일대를 중심으로 구성된 무장애 여행 코스 정보를 제공한다. 해당 지역의 이동 동선, 접근 가능한 해안 전망 지점, 휴게시설, 편의시설 이용 가능 여부 등을 포함해 교통약자와 휠체어 이용자의 이동 편의를 높이기 위해 수집·정비된 자료이다. 노면 상태, 경사도, 주차 및 화장실 접근성 등 현장 기반 요소를 반영하여 관광약자 친화형 관광환경 조성, 무장애 여행 서비스 개발, 공공정책 수립 등 다양한 활용을 지원한다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
