summary_user: 전북특별자치도 시군별로 열린 농촌 축제를 축제 한 건당 한 행으로 담고, 축제명·개최 기간·장소와 총 예산 및 국비·시군비·자부담 금액(백만원 단위)을 기록한 연도별 현황 파일(CSV 약 5KB)입니다. 지자체 담당자나 지역축제 기획자가 '전북 어느 시군의 농촌 축제에 국비와 시군비가 얼마씩 들어갔고, 언제 어디서 열렸나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군 이름으로 시군구 코드에 매핑하거나 축제명으로 TourAPI 행사 정보 등과 맞춰 이어 써야 한다.
description_portal: 본 데이터는 전북특별자치도 내 각 시군에서 개최된 농촌 축제의 연도별 현황을 기록한 자료입니다. 축제명, 개최 기간, 장소와 더불어 총 예산 및 국비, 시군비, 자부담금액(백만원 단위) 정보가 포함되어 있어 축제 운영의 재정 규모와 지원 현황을 파악할 수 있습니다. 이를 통해 지역별, 연도별 축제의 개최 규모와 지원 체계 변화를 분석할 수 있으며, 지역 관광 활성화 및 농촌 경제 발전에 미치는 영향을 평가하는 기초자료로 활용됩니다. 또한, 축제 기간과 장소 정보를 기반으로 관광객 유입 예측, 축제 일정 조정, 지역 특산물 홍보 전략 수립 등 실무적 활용이 가능합니다. 지방자치단체는 이 데이터를 활용해 예산 효율성 평가, 축제별 지원 정책 개선 및 신규 축제 발굴을 위한 기초자료로 활용할 수 있으며, 연구기관 및 문화관광 기획자는 지역 축제의 발전 방향과 경제적 효과를 분석하는 데 참고할 수 있습니다. 본 데이터는 농촌 지역 문화 활성화 및 지역경제 지원 정책 수립에 필수적인 자료입니다.
