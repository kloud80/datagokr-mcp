summary_user: 성남시에 등록된 관광숙박업(관광호텔) 업소를 한 곳씩 담은 파일로, 업종·상호·등록일자·지번 및 도로명 소재지·객실수·등급·전화번호를 개별 주소 단위로 담는다. 출장이나 의료관광으로 성남(판교·분당 등)을 찾는 사람이나 숙박업 분석가가 "성남시에 등급 있는 관광호텔이 어디에 몇 곳 있고 객실 규모는 어떤가"를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소를 매칭하거나 같은 기관(성남시) 자료끼리만 연결한다.
description_portal: 성남시는 서울과 인접한 도시로서 비즈니스·의료·교육 수요가 높은 지역이며, 이에 따라 관광숙박업도 점진적으로 성장하고 있다.  비즈니스호텔, 레지던스형 숙소, 소형 관광호텔 등 다양한 유형이 존재한다. 대형 관광호텔은 상대적으로 적지만, 의료관광과 IT비즈니스 수요에 대응해 외국인 이용률이 높은 숙박시설도 일부 운영되고 있다. 특히 분당의 판교지역은 기업 출장 수요가 많아 장기투숙에 적합한 레지던스형 호텔의 입점이 늘고 있습니다. 숙박업소의 시설 수준은 전반적으로 중상 이상입니다. 성남시는 관광객 유치 및 지역경제 활성화를 위해 숙박업 등록·안전점검 관리를하고 있습니다.
