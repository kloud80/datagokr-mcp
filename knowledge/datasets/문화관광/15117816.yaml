description_portal: 본 데이터는 광주광역시 서구에 위치한 종교시설의 현황을 정리한 자료로, 교회, 성당, 사찰 등 종교 유형별 시설의 명칭, 주소, 종교 구분 등의 정보를 포함하고 있습니다. 코로나19 시기 일시조사된 자료로, 당시 집단 감염 예방 및 방역 대응을 위한 행정적 목적에 따라 수집된 것이 특징입니다.시설명과 함께 제공되는 도로명 주소는 공간정보 시스템과 연계해 활용 가능하며, 종교 구분 항목은 기독교, 불교, 천주교 등으로 분류되어 있어 시설 유형별 통계 분석, 방역 정책 기초자료, 종교 관련 인구 분포 연구 등에 유용하게 활용됩니다. 총 393건의 레코드로 구성되어 있으며, 매년 갱신되고 무료로 제공됩니다.
