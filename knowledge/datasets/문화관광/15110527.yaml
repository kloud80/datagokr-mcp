summary_user: 대구광역시 동구 안의 공공체육시설을 시설 한 곳씩 담는 API로, 등록번호·시설 구분·시설명·주소·체육시설 종류·면적과 야외운동기구·부대시설 지점 정보를 담는다. 동구 주민이 집 근처 공원 운동기구나 체육시설이 어디에 있고 어떤 시설로 이루어졌는지 확인하거나, 구청·분석가가 동 단위 체육시설 분포를 점검하는 데 쓴다. 전역 조인 키는 없으므로 다른 체육시설 데이터와는 시설명이나 주소(ADRES)를 맞춰 붙여야 한다.
description_portal: 공공체육시설 현황 조회서비스 API는 지역 내 공공체육시설의 정보와 시설 구성을 체계적으로 제공하는 데이터 서비스입니다. 이 API는 시설 명을 기준으로 등록번호, 시설 구분, 시설 명, 주소, 공공 체육시설 종류, 면적, 야외 운동 기구 지점, 부대 시설 지점 등 주요 정보를 조회할 수 있어, 이용자는 시설 위치와 구성, 접근성을 쉽게 확인할 수 있습니다. 행정기관은 시설 관리, 체육 정책 수립, 시설 개선 및 확충 계획 수립에 활용할 수 있으며, 연구자나 개발자는 데이터를 활용해 체육 시설 지도, 운동 안내 앱, 지역 체육 프로그램 분석 등 다양한 응용 서비스를 구축할 수 있습니다. 공공체육시설 정보 공개는 시민의 건강 증진, 체육 활동 접근성 향상, 효율적인 시설 관리 및 정책 지원에 기여합니다.
