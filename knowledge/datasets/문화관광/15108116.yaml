summary_user: 충청남도 서천군에서 운영 중인 음식점을 한 곳씩 담은 건별 목록으로, 상호명·맛집 분류·대표음식·연락처·좌석수와 방 개수·주차 가능 여부·도로명/지번 주소·좌표를 담는다. 서천 여행객이나 단체 모임을 준비하는 사람이 '주차가 되고 방이 있는 서천의 해산물 음식점은 어디인가' 같은 질문에 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 위경도 좌표(lat, lot) 기준 위치 근접으로만 이어 쓰며, TourAPI 음식 콘텐츠와도 이름·주소로 대조해야 한다.
description_portal: 서천군 내 운영 중인 음식점 상호명, 맛집 분류, 대표음식, 연락처, 수용 가능한 좌석수와 방개수, 주차가능 여부, 우편정보, 도로명 주소, 지번 주소에 대한 정보를 나타냅니다.
