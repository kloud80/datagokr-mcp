summary_user: 안양시가 지정한 주요 문화관광지(안양1경~안양9경 중심)를 한 곳당 한 행으로 담은 소규모 목록 파일(CSV 587바이트)로, 구분(자연경관·역사유적·문화시설 등), 문화관광지명, 소재지 주소, 이용방법(이용요금)을 담는다. 안양을 찾는 방문객이나 지역 여행 콘텐츠를 만드는 사업자가 '안양에서 가볼 만한 명소가 어디이고 요금은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 정보 등 다른 데이터와는 관광지명이나 주소를 맞춰 이어 써야 한다.
description_portal: '안양시 문화관광지(구분, 문화관광지명, 소재지, 이용방법(이용요금) 등)에 대한 현황 데이터입니다. 안양시의 문화관광지 현황은 안양시가 지정한 주요 관광 명소들의 정보를 정리한 데이터로, 시민과 방문객에게 지역의 문화유산과 관광지를 소개하고 활용할 수 있도록 제공됩니다.- 구분: 자연경관, 역사유적, 문화시설 등- 문화관광지명: 예) 안양예술공원, 삼막사, 병목안시민공원 등- 소재지: 도로명주소 또는 지번주소- 이용방법: 이용요금, 개방시간, 주차 가능 여부 등이 데이터는 안양1경부터 안양9경까지의 대표 관광지를 중심으로 구성되어 있으며, 관광객이 쉽게 접근하고 활용할 수 있도록 정리되어 있습니다.'
