summary_user: 서울특별시 중구의 헬스장 등 체력단련장업 인허가 대장을 업소 한 곳당 한 행으로 담으며, 관리번호·인허가일·영업 상태(영업·폐업 등)·폐업일·소재지 주소·사업장명·좌표·시설 면적·지도자 수 등을 포함한다. 중구에서 체력단련장 창업을 검토하는 예비 사업자가 '어느 동네에 헬스장이 몰려 있고 최근 몇 곳이 문을 닫았나'를 확인하거나, 분석가가 헬스장 개폐업을 상권 변화 신호로 볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 같은 기관(자치단체) 코드(OPNSFTEAMCODE)로만 이어 쓰며, 다른 체육시설업·상권 데이터와는 주소 기준으로 맞춘다.
description_portal: '서울특별시 중구의 헬스장과 같은 체격관리 및 근력, 유연성, 지구력 강화 등을 목표로 운동을 할 때 필요한 도구와 기구를 제공하는 업소 정보입니다. 데이터는 각 체력단련장업체에 부여된 관리번호, 현재의 영업 상태(신고, 폐업 등), 상세 소재지 등의 주요 항목들로 구성되어 있습니다. 이 자료는 체력단련장업 창업을 희망하는 예비 영업자에게는 중구 지역의 시장 분석 정보를 제공하며, 일반 시민 및 이용시설 고객에게는 체력단련장업의 위치 및 이용금액 정보를 투명하게 확인할 수 있도록 지원합니다.* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
