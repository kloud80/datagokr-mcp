summary_user: 전북특별자치도 도립미술관이 소장한 작품을 한 점씩 기록한 목록 파일로, 한국화·회화·판화·조각 등 부문별로 작가명, 생몰연도, 작품 제목(명제), 제작연도, 규격, 소장일자, 기법 및 재료를 담는다. 미술사 연구자나 큐레이터가 "도립미술관이 특정 작가의 작품을 몇 점, 언제 수집했나"를 확인하거나 전시·교육 자료를 기획할 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해 다른 데이터와는 작가명 같은 이름 매칭으로만 연결하며, 문화기반시설 시설코드나 좌표는 들어 있지 않다.
description_portal: 본 데이터는 전북특별자치도 도립미술관의 소장품 목록을 상세히 담고 있는 자료입니다. 한국화, 회화, 판화, 조각 등 부문별로 작품을 분류하고, 각 작품의 작가명, 제목, 제작 연도, 규격, 소장 일자, 그리고 사용된 재료와 기법까지 구체적으로 명시하고 있습니다. 이 자료는 미술관이 소장한 예술 자산의 현황을 체계적으로 보여주는 중요한 아카이브입니다. 미술사 연구자, 큐레이터, 학생 등 전문가들이 특정 작가나 시대의 작품을 연구하고, 미술사적 흐름을 분석하는 데 있어 필수적인 기초 정보를 제공하며, 전시 기획 및 교육 자료로도 높은 활용 가치를 지닙니다.
