summary_user: 한국고문헌종합목록시스템에 참여하는 공공도서관(경주시립도서관, 남산도서관, 부산광역시시민도서관 등)이 소장한 고문헌의 서지데이터를 자료 한 건당 한 행으로 담은 파일로, 포털 설명 기준 7,600여 건이며 행마다 레코드키, MARC 서지(마크), 소장 도서관 부호·도서관명이 들어 있다. 연구자나 사서가 특정 고서·고문헌이 어느 공공도서관에 소장되어 있는지, 지역 공공도서관별 고문헌 소장 규모가 어떤지 확인하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 찾지 못해, 다른 도서관 데이터와는 도서관부호나 도서관명을 매핑해 연결해야 한다.
limits: 전역 조인 키가 없어 도서관정보나루 등 다른 데이터와 붙이려면 도서관명·부호를 직접 맞춰야 한다. 범위는 전국이지만 위치 정보가 없는 비공간 데이터이며, 서지 상세 내용은 MARC 형식(마크)에 담겨 있어 파싱이 필요하다.
