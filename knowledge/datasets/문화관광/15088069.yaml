summary_user: 인천광역시 연수구 안에 있는 사찰을 한 곳당 한 행으로 정리한 목록 파일로, 구분·종교단체명·주소·연락처를 담으며 범위는 연수구 한 개 시군구이고 파일 크기는 약 1.4KB입니다. 연수구 주민이나 방문객이 '집 근처에 있는 절이 어디이고 연락처는 무엇인가'를 확인하거나, 지역 종교시설 분포를 살펴볼 때 쓴다. 공통 조인 키(유산 종목코드·지정번호, 필지 PNU 등)가 없어 다른 데이터와는 주소를 지오코딩하거나 사찰명을 이름으로 매칭해 이어 쓴다.
description_portal: 이 데이터는 인천광역시 연수구 내에 위치한 사찰들의 현황을 체계적으로 정리한 자료로, 사찰명, 전화번호, 주소의 항목으로 구성되어 있습니다. 지역 내 불교 시설의 분포와 규모를 파악하는 데 유용하며, 불교 신도 및 방문객들이 원하는 사찰을 쉽게 찾을 수 있도록 돕습니다. 또한 지역사회 종교 문화 연구, 관광 안내, 복지 서비스 연계 등 다양한 목적에 활용 가능하며, 행정기관이나 관련 단체가 지역 종교 인프라를 관리하고 지원하는 데 중요한 기초 자료로 활용될 수 있습니다.
