summary_user: 충청남도 전자도서관이 소장한 자료를 한 건씩 등록번호·서명·저작자·발행자·발행년으로 정리한 2024년 8월 기준 목록 파일(CSV 약 3MB)이다. 도민이나 분석가가 "충남 전자도서관에 어떤 책이 있고, 어느 출판사·발행연도 자료가 많은가"를 확인하거나 소장 현황을 집계하는 데 쓴다. ISBN이나 도서관코드 같은 공통 조인 키가 없어서 다른 도서관·국가서지 데이터와는 서명·저자명을 맞춰 보는 방식으로만 잇는다.
