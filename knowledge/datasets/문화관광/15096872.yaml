summary_user: 제주를 방문한 내국인 관광객이 여행 전과 여행 후에 가진 제주 이미지를 기준 연도·여행전후 구분·거주지별로 묶어 응답자 수와 매우나쁨~매우좋음·해당없음 응답 비율(%)로 담은 설문 집계표다. 관광 정책 담당자나 연구자가 '여행 전 기대와 다녀온 뒤 체감한 제주 이미지가 거주지역별로 얼마나 달라졌는가'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 관광지점코드·시군구코드로 다른 관광 통계와 직접 잇지 못하고, 기준 연도나 거주지 이름을 맞춰 같은 기관의 방문관광객 실태 조사 표와 나란히 보는 정도로 연결한다.
description_portal: 이 데이터셋은 2018년부터 2019년까지 제주를 방문한 내국인 관광객을 대상으로, 여행 전과 여행 후 각각 제주에 대해 가지고 있던 이미지(관광지/환경/서비스/가격 등 전반적 인식)를 평가한 결과를 정리한 공공 통계자료이다. 설문 항목은 관광객이 여행 전에 기대했던 이미지와 여행 후 체감한 현실을 비교할 수 있도록 구성되어 있으며, 각 항목에 대한 점수 변화로 제주 관광의 실제 체감 만족도 변동, 기대 대비 현실 괴리, 재방문 의사 및 추천 의향 등에 대한 전반적 인식을 파악할 수 있다. 이 자료는 관광 정책을 기획하거나 서비스 개선을 위한 기초 근거로 활용되며, 지역 관광지 관리, 가격 정책, 관광객 유입 전략, 관광 만족도 제고 방안 설계 등에 유용한 실무 자료이다. 또한 민간 관광업체나 연구기관에서도 제주 관광 경험자의 인식 변화를 분석해 관광 트렌드, 관광지 개선 여지, 관광객 유형 분석 등에 참고 가능한 신뢰성 있는 데이터베이스 역할을 한다.
