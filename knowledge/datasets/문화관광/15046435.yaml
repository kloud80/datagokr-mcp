description_portal: '○ 통계개요* 통계명 : (전국기준)교통수단별 내국인출국* 통계종류 : 내국인출국현황을 파악, 분석하는 가공·일반통계* 작성목적 : 관광수지 및 관광목적의 외래객입국과 내국인출국현황을 파악,분석하여 관광정책수립의 기초자료로 활용* 조사체계 : 법무부 → 한국관광공사* 공표주기 : 정기(매년)* 공표범위 : 지역 - 전국내용 - 공항, 항구등 교통수단별 내국인출국 현황○ 용어설명* 국민해외관광객 : 세계관광기구(UNWTO) 권고안에 따라 거주지 기준으로 작성하여법무부 자료 중 국민 출국자에서 재외국민 출국자를 제외하고 선원ㆍ승무원을 포함함※ 법무부의 ‘출국자’는 외국인 출국자와 국민 출국자이며, ‘국민 출국자’는 국적이한국인인자로 선원·승무원은 별도로 발표하고 있음'
