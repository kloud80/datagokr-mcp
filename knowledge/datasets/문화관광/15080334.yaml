summary_user: 서울 관악구 안 마을마당·공원·쉼터 등 실외운동기구가 설치된 시설별로 명칭, 위치, 설치된 기구 종류(공중걷기·허리돌리기 등), 기구 총수, 담당부서를 담은 시설 단위 현황 파일(CSV 약 18KB)이다. 주민이 '집 근처 공원에 어떤 야외운동기구가 몇 개 있나'를 찾거나, 구청·분석가가 생활권 운동시설 배치와 관리 부서를 점검하는 데 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 시설명·위치 문자열로 맞추거나 같은 관악구 자료끼리만 이어 쓴다.
description_portal: 본 데이터는 서울특별시 관악구 내 실외운동기구가 설치된 시설의 현황을 정리한 자료로, 시설명, 위치, 설치된 운동기구 종류, 운동기구 수, 담당부서, 데이터기준일자를 포함하고 있습니다.시설 유형은 마을마당, 공원, 쉼터 등 다양한 생활권 공간으로 구성되어 있으며, 각 시설마다 설치된 운동기구의 종류와 수량이 상이하게 기록되어 있습니다. 운동기구 항목에는 공중걷기, 허리돌리기, 노젓기, 윗몸일으키기 등 여러 종류가 포함되어 있어, 시설별 설치 구성 현황을 확인할 수 있는 기초 자료로 활용될 수 있습니다.또한 데이터에는 각 시설별 담당부서 정보가 함께 제공되어 있어, 시설 단위의 관리 주체를 확인하는 데 참고가 가능합니다. 다만, 데이터는 운동기구의 운영 상태, 유지보수 이력, 안전점검 현황 등 추가적인 관리 정보는 포함하고 있지 않으며, 제공 항목에 한정된 현황 정보를 제시하고 있습니다.본 데이터는 관악구 내 실외운동기구 설치 실태를 파악하는 데 필요한 기본 정보를 제공하는 자료입니다.
