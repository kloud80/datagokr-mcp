summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU)에서 콘텐츠 접근 정보를 바탕으로 일정 기간마다 선정한 인기 태그 목록을 언어·태그 단어·정렬순서·등록일시·기존순위 단위로 담은 소규모 파일(CSV 약 3KB, 포털 기준 88건)이다. 제주 관광 마케팅 담당자나 분석가가 "요즘 비짓제주 이용자들이 어떤 키워드에 관심을 두는가"를 확인하거나 검색·추천 키워드를 고르는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 콘텐츠 등 다른 데이터와는 태그 단어를 이름으로 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 인기태그 내역입니다.- 해당 데이터는 비짓제주 내부 시스템에서 콘텐츠접근정보를 바탕으로 일정기간에 한 번씩 인기태그를 선정하여 생성합니다.- 개방데이터 항목은 일련번호, 언어, 태그명, 정렬순서, 등록일시이며 전체 데이터 수는 88건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 이용자 관심사 및 콘텐츠 태그 트렌드 분석, 인기 태그 발굴, 맞춤형 콘텐츠 추천 서비스 개발, 마케팅 및 홍보 전략 수립, 플랫폼 내 검색 및 탐색 기능 개선, 관광객 만족도 및 이용 편의성 향상 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
