description_portal: 서울시 한양도성 학술자료 및 도성사진 정보 데이터는 한양도성과 관련된 연구 글, 기록 자료, 사진 콘텐츠를 통합 관리하기 위한 게시판 기반 정보입니다. 게시판글 일련번호와 메뉴 일련번호는 각각 개별 글과 게시판 메뉴를 구분하는 기본 식별자이며, 글 제목과 글 내용은 학술자료, 해설 글, 안내문, 사진 설명 등의 핵심 정보를 담는 항목입니다. 정렬순서는 게시글의 노출 순서를 결정하는 데 활용되며, 조회수와 추천수 좋아요 값은 이용자 반응과 관심도를 파악하는 지표로 활용됩니다. 게시글 공개 시작시간과 종료시간은 특정 기간에만 노출되는 공지나 전시·행사 관련 안내를 관리하는 데 유용하며, 최초등록일과 최종등록일을 통해 자료의 생성 및 업데이트 이력을 확인할 수 있습니다. 첨부파일 일련번호, 모바일 파일 이름, 모바일 파일 URL은 사진, 보고서, 안내자료 등 각종 파일을 웹과 모바일 환경에서 연계해 제공하기 위한 정보입니다. 게시판 사진 구분, 공지사항 이미지, 사진등록 일자, 사진 이미지 좌표 값은 도성 사진 자료를 체계적으로 분류·표시하는 데 사용되며, 토론방 모니터링 구분과 댓글여부 등은 온라인 소통과 의견 수렴 기능을 관리하기 위한 항목입니다. 이 데이터는 한양도성 관련 학술연구, 기록 보존, 시민 참여형 콘텐츠 운영 등 다양한 활용을 지원하는 기반 자료입니다.
