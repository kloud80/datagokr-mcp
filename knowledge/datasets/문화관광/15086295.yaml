summary_user: 인천광역시 중구(현 영종구) 관내 공연장을 한 곳당 한 행으로 담은 파일로, 공연장 명칭과 지번·도로명 소재지, 데이터기준일을 담으며 포털 설명상 13개 공연장이 등록되어 있다. 주민이나 공연기획자가 '영종·중구 일대에 공연을 올리거나 관람할 수 있는 공연장이 어디에 있나'를 확인할 때 쓴다. 전역 조인 키가 없어 KOPIS 공연장ID(mt10id) 같은 외부 코드와는 공연장 이름이나 주소를 맞춰 연결해야 한다.
description_portal: 인천광역시 중구 관내에 위치한 공연장 현황에 대한 데이터 입니다.인천광역시 중구에는 총 13개의 공연장이 등록되어 있습니다.[데이터 설명]파일명 인천광역시_중구_공연장 현황파일내용 공연장명칭, 공연장소재지, 전화번호 등[공연장 설명]공연장(公演場)은 공연의 상연을 목적으로 지은 건물을 말한다. 전면의 무대를 잘 볼 수 있게 2~5층의 객석이 넓게 펼쳐진 형태로 지어진다. 단관인 공연장도 있지만, 한 건물 안에 여러 홀을 쑤셔넣는 경우 전통적으로는 크기에 따라서 대극장, 소극장, 체임버홀 따위의 별명을 붙이기도 한다.
