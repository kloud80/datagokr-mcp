summary_user: 제주관광정보플랫폼 비짓제주에서 이용자가 홈페이지로 보낸 콘텐츠 정보 수정 요청을 요청 건별로 담은 파일로, 요청아이디·콘텐츠아이디·제목·주소·도로명주소·변경사항을 포함하며 포털 설명 기준 전체 1,686건이다. 관광 콘텐츠 운영자나 분석가가 '이용자들이 어떤 관광지·장소 정보의 어떤 부분(주소, 소개 등)이 틀렸다고 지적하는가'를 파악해 정보 갱신 우선순위를 정하는 데 쓴다. 전역 조인 키는 없으며, 비짓제주 내부의 콘텐츠아이디나 제목·주소를 이름 매칭해 비짓제주 콘텐츠 목록 등 같은 기관 데이터와 잇는 정도로만 연결한다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 콘텐츠수정요청 내역입니다.- 해당 데이터는 이용자가 비짓제주 홈페이지를 통해 콘텐츠 정보 수정 요청을 했을 때 데이터베이스에 저장하여 생성합니다.- 개방데이터 항목은 요청아이디, 콘텐츠아이디, 제목, 주소, 도로명주소, 소개, 변경사항이며 전체 데이터 수는 1,686건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 콘텐츠 정보의 최신성 및 정확성 유지, 이용자 의견 반영을 통한 서비스 품질 향상, 관광지 정보 업데이트 및 관리 효율화, 이용자 참여 활성화, 관광객 만족도 증대 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
