description_portal: '대전컨벤션센터(Daejeon Convention Center, DCC) 인근의 외국어 메뉴판으로 된 음식점 리스트 입니다.주로 대전시 도룡동 대전컨벤션센터 1전시장, 대전컨벤션센터2전시장 근방의 음식점 중, 외국어 메뉴판을 제공하는 음식점의 구역, 상호명, 주소, 연락처, 영업시간, 음식점 분류 정보를 담고 있으며,MICE 사업 및 국제회의주최시 참여하는 외국인을 위한 음식점 정보로 사용될 수 있습니다.주요칼럼- 연번: 외국어 메뉴판 제공 음식점을 분류하기 위한 연번 정보입니다. -구역: 외국어 메뉴판 제공 음식점이 위치한 구역입니다. - 주소: 외국어 메뉴판 제공 음식점의 실제 주소 정보입니다. - 연락처: 외국어 메뉴판 제공 음식점의 전화번호 정보입니다. - 영업시간: 외국어 메뉴판 제공 음식점의 운영시간 정보입니다. - 분류: 외국어 메뉴판 제공 음식점의 음식 분류 정보입니다.'
