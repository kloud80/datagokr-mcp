summary_user: 제주 월령리선인장마을 무장애여행 코스의 지점별 위치(위도·경도·해발고도)와 장소 설명·이미지 정보를 담는 건별 원천 자료로, 제주데이터허브에서 제공한다. 휠체어나 유모차를 동반한 여행자, 관광 안내·지도 서비스 개발자가 '월령리 손바닥선인장 군락지를 무장애로 어떻게 둘러볼 수 있나'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 장소명 매칭이나 위경도 좌표 근접으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 월령리선인장마을 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다."* 제주의 월령리선인장마을은 해안 바위틈과 마을 돌무더기에 자생하는 ‘손바닥선인장’ 군락지를 중심으로 한 무장애 관광지 정보를 담고 있다. 이곳은 멕시코 원산 선인장이 쿠로시오 난류를 타고 유입되어 자생한 국내 유일의 야생 군락지로, 문화재청 지정 천연기념물 제429호이다. 데크 산책로와 시멘트 포장길을 따라 이동이 가능하며, 휠체어나 유모차를 동반한 방문자도 무난하게 이용할 수 있는 코스로 안내된다. 관광 안내, 지도 서비스, 무장애 관광지 조성, 정책 기초 자료, 관광 콘텐츠 제작 등 다양한 공공 및 관광 분야에서 활용 가능한 기초자료로서 의미가 있다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
