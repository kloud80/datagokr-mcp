summary_user: 전국 해수욕장별로 시도·시군구·해수욕장명과 2015년부터 2025년까지의 연도별 이용객 수를 한 행에 담은 집계 파일(CSV)이다. 지자체 관광 담당자나 분석가가 "우리 시군구 해수욕장 이용객이 코로나 전후로 어떻게 달라졌나" 같은 연도별·지역별 추이 비교에 쓴다. 해수욕장코드나 시군구코드 같은 공통 조인 키가 없어, 다른 관광 통계나 지역 데이터와는 시도·시군구 이름이나 해수욕장명을 맞춰 연결해야 한다.
description_portal: 이 데이터는 해양수산부에서 각 지자체 자료를 기반으로 해수욕장 이용객 현황을 정리하고 제공하기 위해 수집한 데이터입니다.  본 데이터의 주요 내용은 해수욕장의 명칭, 위치한 시군구 정보와 해당 해수욕장의 2015년~2025년까지의 연도별 이용고객 수 정보로 구성되어 있습니다.  본 데이터는 운영기관 및 지자체에서 해수욕장별 이용객 수 분석, 연도별 지역별 해수욕장 이용추이 비교, 지역별 관광산업 정책 수립, 여름철 인구 이동 현황 연구, 해수욕장 운영 및 인프라 개선 등 활동을 위한 기초 자료로 활용될 수 있습니다.
