summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU) 플랫폼에서 운영자가 콘텐츠별로 등록한 이벤트 내역을 건별로 담으며, 포털 설명 기준 전체 16건의 소규모 CSV 파일(약 2.7KB)이다. 제주 여행을 계획하는 관광객이나 관광 서비스 사업자가 '지금 비짓제주에서 진행 중인 콘텐츠 이벤트는 무엇이고 언제까지 하는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 관광 데이터와는 관련콘텐츠명 같은 이름 매칭으로만 이어 쓸 수 있고, 링크주소로 비짓제주 원문 페이지를 따라간다.
description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 콘텐츠이벤트 내역입니다.- 해당 데이터는 운영자가 비짓제주 관리자사이트에서 콘텐츠별 이벤트 등록 시 생성합니다.- 개방데이터 항목은 이벤트아이디, 관련콘텐츠명, 이벤트내용, 이벤트시작일, 이벤트종료일이며 전체 데이터 수는 16건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 콘텐츠별 이벤트 정보의 체계적 관리 및 제공, 이용자 참여 및 관심 유도, 이벤트 기반 관광지 홍보 및 마케팅 효과 증대, 관광객 방문 증진, 콘텐츠 활성화 및 플랫폼 이용률 향상 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
