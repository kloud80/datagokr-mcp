description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다. "* 제주해녀박물관은 제주 제주시 구좌읍 해녀박물관길 26에 위치하며, 기원전부터 전승되어 온 제주 해녀 문화의 역사와 생업, 공동체 생활, 어로 방식, 민속 의례 등을 실제 해녀의 집과 생활 도구, 물옷과 잠수 장비, 어업 도구 등을 포함한 실물 전시와 영상 자료로 전시하여 제주 해녀의 삶과 정신을 체계적으로 소개하는 박물관이며, 주출입구 단차 제거, 장애인 전용 주차구역, 휠체어 및 유모차 대여, 승강기, 장애인 화장실 등 무장애 편의시설이 제공되어 교통약자나 고령자, 유아 동반 가족 등 누구나 편리하게 관람할 수 있는 열린관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
