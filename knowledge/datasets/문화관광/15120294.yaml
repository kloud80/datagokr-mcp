summary_user: 국립생태원이 청각장애인을 위해 제작한 생태 동화 수어영상도서를 한 편씩 담은 목록으로, 콘텐츠명·제작연도·발행기관·해시태그·공공누리유형을 담는 CSV 파일(약 37KB)이다. 청각장애 아동의 교사나 학부모가 수업·가정 학습에 쓸 생태 주제 수어 동화를 찾고, 어떤 공공누리 조건으로 쓸 수 있는지 확인하는 데 쓴다. 실측 컬럼에 도서관코드·ISBN 같은 전역 조인 키가 없어, 다른 도서 데이터와는 콘텐츠명이나 해시태그를 이름으로 맞춰 이어 써야 한다.
description_portal: 본 데이터는 국립생태원에서 청각장애인을 위한 정보 접근성 확대와 포용적 교육 환경 조성을 목적으로 제작한 수어영상도서 목록입니다. ‘이솝우화’를 비롯한 다양한 생태 관련 동화를 수어 영상 형식으로 제작하여, 청각장애 아동과 학부모, 교사 등 누구나 손쉽게 활용할 수 있도록 구성되어 있습니다. 해당 목록은 수록된 모든 도서의 제목, 수어 적용 여부, 영상 제작 시기 등을 포함하며, 국립생태원이 추진하는 장애인 대상 디지털 콘텐츠 보급 정책의 일환으로 개발되었습니다. 특히 이 자료는 단순한 도서 목록을 넘어, 포용적 문화예술 콘텐츠 제작의 성과를 기록하고 보급 현황을 확인할 수 있는 기반 자료로 활용될 수 있습니다. 수어 기반 콘텐츠에 대한 사회적 수요가 증가하는 가운데, 본 목록은 향후 다양한 기관과 협력하여 수어교육 콘텐츠 확장 및 생태문화 접근성 확대에도 기여할 수 있을 것입니다.
