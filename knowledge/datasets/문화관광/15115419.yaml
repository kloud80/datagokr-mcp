summary_user: 서울특별시 중랑구에서 게임물을 수입하거나 저작권을 관리하며 게임제공업자 등에 공급하는 게임물배급업 업소를 인허가 건별로 담으며, 인허가일자·영업상태·폐업일자·주소·사업장명·중부원점TM 좌표 등을 포함한다. 중랑구에서 영업 중이거나 폐업한 게임물배급업체가 어디에 있는지, 언제 인허가를 받았는지 확인하려는 사업자·분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로, 다른 자치구의 같은 업종 인허가 데이터와는 같은 컬럼 구조나 사업장명·주소를 맞춰 이어 쓴다.
description_portal: '서울특별시 중랑구의 게임물을 수입하거나 그 저작권을 소유 및 관리하면서 게임제공업을 하는 자 등에게 게임물을 공급하는 업소정보입니다. 제공하는 정보 중 주요 항목으로는 관리번호, 인허가일자, 영업상태명, 영업상태 코드, 폐업의 경우는 폐업일자, 전화번호, 지번주소, 도로명주소, 우편번호, 사업장명, 좌표정보 등이 있습니다. * 좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않습니다. 자세한 정보는 서울시 열린데이터광장 링크를 클릭하여 데이터를 다운받아 확인하여 주시기 바랍니다. 감사합니다.'
