summary_user: 전북특별자치도가 유치한 국내외 전지훈련 선수단을 구분(국내·해외 등)과 종목별로 팀 수, 인원, 연인원, 훈련 장소, 지역경제 창출효과로 정리한 집계표이며, 파일 크기가 415바이트에 불과한 소규모 자료다. 지자체 스포츠마케팅 담당자나 분석가가 "어떤 종목의 전지훈련 유치가 전북 지역경제에 얼마만큼 기여했는가"를 따질 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 종목명·장소명을 이름으로 맞추거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 이 데이터는 전북특별자치도가 국내외 전지훈련 선수단을 유치한 현황과 그에 따른 경제적 파급 효과를 종합적으로 분석한 자료입니다. 각 유치 건별로 훈련 종목, 훈련 장소, 참여 팀 수와 같은 기본 정보는 물론, 선수단 유치를 통해 발생한 지역 경제 창출 효과를 구체적인 수치로 제공합니다. 또한, 유치 현황을 국내팀과 해외팀으로 구분하여 전북특별자치도의 스포츠 마케팅이 미치는 범위를 파악할 수 있도록 구성되어 있습니다. 이 자료는 스포츠 관광 활성화 정책의 성과를 측정하고, 훈련 시설 인프라 개선 계획을 수립하며, 스포츠가 지역 경제에 미치는 기여도를 평가하는 데 핵심적인 기초 데이터로 활용됩니다.
