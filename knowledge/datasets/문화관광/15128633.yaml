description_portal: '장충체육관은 서울특별시 중구에 위치한 주요 실내 체육시설로, 스포츠 경기뿐만 아니라 다양한 문화행사 및 시민 여가활동을 위한 복합공간으로 활용되고 있습니다. 서울시설공단은 체육관의 운영 효율성 제고 및 재정 자립 기반 강화를 목적으로, 장충체육관 내에 입점한 수익시설에 대한 운영 현황을 체계적으로 관리하고 있으며, 이를 정량화하여 공개 가능한 데이터로 구성하였습니다.본 데이터는 장충체육관 내부에 입점한 편의시설에 대한 정보를 포함하고 있으며, 다음과 같은 세부 항목으로 구성되어 있습니다:(1) 시설명: 음식점, 편의점, 커피전문점, 사무실 등 유형별 공간 명칭(2) 업체명: 입점하여 공간을 운영 중인 사업자명(3) 대부면적(㎡): 업체별로 임대된 면적 규모(4) 매장구성: 하와이안포케 음식점, CU편의점, 커피전문점 등 실내용도(5) 연간대부료(백만원): 계약된 연간 임대료(6) 대부시작일 및 종료일: 계약 시작일과 종료일(7) 대부기간: 연 단위 기준의 계약 기간이 데이터는 다음과 같은 목적으로 활용될 수 있습니다:▪ 서울시 및 유관 행정기관은 수익시설의 운영현황을 바탕으로 적정 임대료 정책 수립, 재계약 기준 검토, 민간 사업자 유치 전략 수립 등에 활용 가능▪ 연구기관 및 학계는 도심 내 공공시설 수익모델, 시설별 수익성 비교, 면적 대비 효율성 등의 분석 연구에 기초자료로 활용▪ 민간 사업자는 향후 공공시설 내 입점을 고려할 경우, 유사 시설 운영 사례를 참고해 사업계획 수립에 적용▪ 시민과 방문객에게는 장충체육관 이용 편의를 높이는 참고 정보 제공※ 해당 데이터는 임대 현황 중심의 시설정보로 구성되어 있으며, 개인 정보는 포함되어 있지 않습니다.'
