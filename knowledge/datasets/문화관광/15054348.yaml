summary_user: 전북특별자치도 정읍시에 있는 게임제공업소(PC방, 일반·청소년게임제공업, 복합유통게임제공업, 게임물제작업 등)를 업소 한 곳당 한 행으로 담은 파일이며, 업종·상호·도로명/지번 주소·관리부서·데이터기준일자를 제공한다. 창업자가 정읍시 안에서 특정 동네의 PC방·게임장 밀집 정도를 살피거나, 청소년 보호·치안 담당자가 관내 게임제공업소 위치를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 주소 문자열이나 상호 이름 매칭으로만 이어 쓸 수 있다.
description_portal: '전북특별자치도 정읍시 소재의 게임제공업 현황중 업종, 상호, 소재지도로명주소, 소재지지번주소, 관리부서의 정보를 제공합니다.-업종 : 인터넷컴퓨터게임시설제공업, 복합유통게임제공업, 게임물제작업, 일반게임제공업, 청소년게임제공업게임제공업(PC방 등) 현황 공개는 청소년 보호 정책 강화, 지역 치안 관리, 에너지·환경 정책 수립에 도움이 됩니다. 또한 상권 분석 자료로 활용되어 창업자들에게 유용한 데이터를 제공하고 지역 경제 활성화에 기여할 것으로 예상됩니다.기타 궁금한 사항은 담당부서인 정읍시 문화예술과로 문의하시기 바랍니다.'
