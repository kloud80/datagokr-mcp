summary_user: 빅카인즈(BIGKinds) 뉴스데이터베이스에서 모은 노인 관련 기사를 기사 한 건당 한 행으로 담은 파일(CSV 약 27MB)로, 일자·언론사·제목·통합 분류·키워드·특성추출 항목이 들어 있다. 연구자나 정책 분석가가 노인 빈곤·고독사·돌봄 같은 현안이 시기별로 어느 언론사에서 얼마나, 어떤 키워드로 보도됐는지 살펴볼 때 쓴다. 전역 조인 키가 없어 다른 데이터와는 일자나 언론사 이름, 키워드 문자열을 맞춰서만 이어 쓸 수 있다.
