summary_user: 인천 서구 공원에 설치된 물놀이장을 시설 한 곳당 한 행으로 담은 파일(csv, 496바이트)로, 공원명·주소·면적(제곱미터)·종류를 기록한다. 주민이나 구 담당자가 '우리 동네 가까운 공원 중 여름철 물놀이장이 있는 곳은 어디이고 규모는 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없으므로 다른 체육시설·공원 데이터와는 공원명이나 주소를 문자열로 맞춰 연결해야 한다.
description_portal: 본 공공데이터는 인천광역시 서구 지역 내 공원에 설치된 물놀이장 현황을 수록한 자료입니다. 본 자료는 공원명, 주소, 면적, 종류 등 항목으로 구성이 되어 있습니다. 본 데이터를 통해 여름철 주민 대상 휴식,놀이공간 제공 현황을 파악할 수 있으며, 시설 분포, 접근성, 운영 효율성 분석 등에도 활용이 가능할것으로 판단이 됩니다. 또한 공공 물놀이 시설 정책 수립, 도심 내 여가 공간 조성 등에 필요한 기초자료로도 쓰일 수 있을것으로 기대됩니다. 본 공공데이터는 매년마다 정기적인 갱신을 통하여 최신정보를 반영하고 있습니다.
