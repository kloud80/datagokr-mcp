description_portal: '본 데이터는 전북특별자치도 내 14개 시군의 투어패스 여행 콘텐츠 정보를 수록하고 있으며,  패스 유형은 크게 카드형과 모바일형으로 구분되며, 상품 구성은 1일권, 2일권, 무주반디여행권 등으로 다양하게 제공됩니다. 주요 콘텐츠 유형은 대부분 관광형으로, 관광지 입장, 체험, 대여, 사진 촬영 등으로 구성되어 있습니다. 전주시를 중심으로 데이터가 집중되어 있으며, 무주군, 순창군, 고창군, 부안군 등 비도심 지역도 지역 특색을 반영한 콘텐츠(예: 무주반디랜드, 순창 발효소스토굴, 고창읍성, 부안 채석강 등)를 포함하고 있어, 지역 간 콘텐츠 분포 및 관광 활성화 전략 분석에 적합합니다. 또한, 모바일 기반 관광 시스템 확산에 따라 모바일형 패스의 비중이 높은 점도 특징이며, 각 군별 고유 콘텐츠 개발 현황, 디지털 관광전환 정도 등을 파악하는 데에도 유용합니다. 해당 데이터는 정책 수립, 지역 마케팅, 여행 트렌드 분석 등 여러 분야에서 활용 가능성이 높습니다.'
