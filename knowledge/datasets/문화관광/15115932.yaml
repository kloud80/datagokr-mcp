summary_user: 서울 강서구의 관광극장유흥업 사업장 인허가 내역을 사업장 단위 건별로 담으며, 인허가·취소·폐업 일자, 영업상태, 사업장명, 지번·도로명 주소, 좌표, 무대면적·객석 수 같은 시설 정보를 포함한다. 강서구에서 현재 영업 중인 관광극장유흥업소가 어디에 있고 언제 인허가를 받았는지 확인하려는 상권 분석가나 안전관리 담당자가 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아, 다른 데이터와는 주소·사업장명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 이어 쓴다.
description_portal: 서울특별시 강서구 관광극장유흥업 인허가 정보는 관광객을 대상으로 운영되는 유흥업소 중 무도시설을 포함한 극장형 유흥업체에 대한 인허가 현황을 담고 있습니다. 이 데이터는 관광객 유치를 위한 문화·오락 공간으로 활용되는 장소들에 대해 인허가일자, 영업상태, 사업장명, 주소 등의 정보를 제공합니다. 관광극장유흥업은 일반 유흥주점과 달리 공연, 춤, 음악 등의 문화 요소가 결합된 형태로, 지역 관광산업과 접목되어 경제적 파급효과가 기대되는 업종입니다. 해당 정보는 관광 진흥을 위한 정책 수립, 유흥업소 안전관리, 상권 분석, 민원 대응 등 다양한 행정·산업적 활용에 기반이 됩니다.
