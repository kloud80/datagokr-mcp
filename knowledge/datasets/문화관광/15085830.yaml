description_portal: 텍스타일콤플렉스(DTC)는 대구 섬유산업의 중심지로서, 다양한 행사와 비즈니스 활동을 지원하기 위해 연중 대관 가능한 시설들을 운영하고 있다. 이들 대관시설은 회의, 전시, 세미나, 교육, 공연 등 목적에 따라 유연하게 사용할 수 있도록 구성되어 있으며, 지역 산업 활성화와 시민 참여 확대를 위한 공간으로 활용되고 있다.주요 대관 공간으로는 회의실, 세미나실, 다목적홀, 전시공간 등이 있으며, 각 공간은 수용 인원과 면적에 따라 다양한 유형으로 나뉘어 있어 사용자의 필요에 따라 선택이 가능하다. 회의실과 세미나실은 기업 설명회, 연구 발표, 교육 프로그램 등에 적합하며, 기본적으로 프로젝터, 스크린 등 시청각 장비가 함께 제공된다. 다목적홀과 전시공간은 소규모 전시회, 패션쇼, 리셉션 등 문화·산업 행사를 위한 공간으로 활용되고 있으며, 음향 및 조명 장비도 대여할 수 있다.대관은 연중 상시 가능하며, 공공기관 시설인 만큼 기본 공간 사용료는 무료로 제공되는 경우가 많다. 다만, 프로젝터, 음향장비 등 일부 보조 장비 사용 시에는 별도의 사용료가 부과된다. 대관 신청은 사전 예약제로 운영되며, 대구시 홈페이지 또는 관련 기관을 통해 신청할 수 있다.텍스타일콤플렉스의 대관시설은 단순한 공간 제공을 넘어, 지역 섬유산업과 문화의 융합을 촉진하고, 기업 및 시민이 함께 참여하는 산업 플랫폼으로서 기능하고 있다. 이러한 운영 방식은 행사 운영의 효율성과 전문성을 높이고, 공공자원의 개방적 활용이라는 측면에서도 긍정적인 역할을 하고 있다
