summary_user: 전국 공공도서관을 한 행으로 하여 평가년도별 도서관구분·소재 행정구역과 시군구, 인쇄 장서수, 사서수, 대출자수, 대출권수, 자료구입비(천원)를 담은 도서관 단위 통계 파일이다. 정책 담당자나 연구자가 '우리 시군구 공공도서관은 사서 한 명당 대출권수나 자료구입비가 다른 지역보다 적은가'처럼 지역 간 운영·이용 수준을 비교하는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않아 다른 데이터와는 도서관명·시군구 이름 매칭으로 잇는다. 도서관코드(도서관코드) 컬럼이 있으므로 같은 체계를 쓰는 도서관정보나루 계열 자료와는 코드 대응을 확인한 뒤 연결한다.
limits: 전역 조인 키가 없어 행정구역 코드나 다른 기관 데이터와 바로 붙지 않고, 이름·코드 매핑을 따로 만들어야 한다. 범위는 전국이며 행정단위는 시군구까지라 읍면동 단위 분석에는 쓰지 못한다. 포털 설명에 '학교도서관'이라는 문구가 섞여 있으나, 필드와 제목상 대상은 공공도서관으로 보고 해석한다.
