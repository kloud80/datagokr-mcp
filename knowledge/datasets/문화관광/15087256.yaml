summary_user: 경상남도 거제시에 등록된 관광유람선업 업체를 한 곳씩 담은 목록 파일로, 등록일자·업종·상호명·도로명/지번주소·위도·경도·연락처·기준일자를 담는다(CSV 약 1.2KB 규모). 관광객이나 여행 서비스 사업자가 거제에서 유람선을 탈 수 있는 업체가 어디에 있고 연락처가 무엇인지 확인하는 데 쓴다. 전역 조인 키는 없으므로 주소나 위도·경도 좌표로 지도·다른 관광지 데이터와 공간적으로 겹쳐 보거나, 상호명으로 TourAPI 등 관광 콘텐츠와 이름 매칭해 이어 쓴다.
description_portal: 이 데이터는 경상남도 거제시 내 관광유람선업 현황을 제공하는 공공데이터로, 등록일자, 업종, 상호명, 주소, 위도, 경도, 연락처, 기준일자 등의 정보를 포함하고 있습니다. 이를 통해 유람선 업체의 위치와 기본 정보를 한눈에 파악할 수 있으며, 관광객의 편의 증진과 지역 관광 활성화에 기여할 수 있습니다. 또한 해당 데이터를 활용하여 관련 정책 수립이나 관광자원 분석에도 활용할 수 있습니다. 공공기관, 연구자, 기업, 일반 시민 누구나 자유롭게 사용할 수 있도록 제공됩니다. 정기적으로 갱신되어 정확하고 신뢰할 수 있는 정보를 제공합니다.
