summary_user: 경기도 의왕시 안의 공공체육시설과 동네체육시설을 시설 한 곳당 한 행으로 정리한 시군구 단위 현황 파일로, 구분·시설명·위치·주요시설·부지면적·연면적·개관 시기를 담는다. 의왕시 주민이 집 근처에서 어떤 종목을 할 수 있는 체육시설이 어디 있는지 찾거나, 분석가가 시설별 면적 규모를 비교하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 시설명·위치 같은 이름 매칭이나 같은 기관(의왕시) 기준으로만 이어 쓴다.
description_portal: 이 데이터는 의왕시 내에 조성된 공공체육시설 및 주민들이 이용할 수 있는 동네체육시설의 현황을 정리한 자료입니다. 시설별로 시군명, 구분, 명칭, 위치, 주요시설, 부지면적, 연면적, 개관 시기 등의 정보를 포함하고 있어 체육 인프라의 분포와 규모를 한눈에 파악할 수 있습니다. 이를 통해 시민들은 가까운 운동시설을 쉽게 찾을 수 있고, 행정기관은 체육시설의 활용도 분석 및 향후 설치계획 수립에 참고할 수 있습니다. 주요시설 항목은 해당 시설이 제공하는 운동 종목이나 공간의 특성을 나타내며, 부지 및 연면적 정보는 공간 규모를 비교 분석하는 데 유용합니다. 지역 주민의 건강 증진과 생활체육 활성화를 위한 기반 자료로 활용할 수 있는 공공 데이터입니다
