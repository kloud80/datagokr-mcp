summary_user: 부산광역시 북구 관내에서 운영하는 생활체육교실을 강좌 한 건씩 담은 파일로, 강의분야·강좌명·요일·운영시간·장소·모집인원·운영대상·문의 전화를 포함한다(CSV 약 5KB 규모). 북구 주민이 '집 근처에서 평일 저녁에 참여할 수 있는 어르신 대상 체육교실이 있는지'를 찾거나, 구 단위 생활체육 프로그램 구성을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 장소명·강의분야 같은 이름 매칭으로만 연결하며, 다른 지자체의 생활체육 프로그램 데이터와는 같은 항목끼리 나란히 비교하는 방식으로 쓴다.
