summary_user: 경상남도관광재단이 경남 소재 식당 한 곳당 한 행으로 식당명·지역명·어워드 정보와 RTI지수·수용태세지수·인기도, 트립어드바이저·씨트립·네이버 평점을 담은 CSV 파일(약 3.2MB)이다. 경남 여행객이나 관광 분석가가 '외국인 평점과 수용태세가 좋은 경남 식당은 어디인가'를 찾을 때, 또는 지역별 음식점 품질 수준을 비교할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 음식 콘텐츠나 다른 음식점 데이터와는 식당명·지역명을 이름으로 맞춰 이어 써야 하고, 식당(ID)는 이 기관 안에서만 통하는 식별자로 보인다.
limits: TourAPI contentId나 행정코드 같은 공통 키가 없어 다른 데이터와 붙일 때 이름 매칭 오류가 생길 수 있다. 수집 범위는 전국·비공간으로 표시되지만 내용은 경남 식당 중심이고 좌표가 없어 지도 분석에 바로 쓰기 어렵다.
