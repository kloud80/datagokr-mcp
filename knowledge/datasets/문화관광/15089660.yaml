summary_user: 인천광역시 서구(서해구) 안에 있는 농구장을 시설 한 곳당 한 행으로 담은 소규모 파일(csv 약 2KB)로, 체육시설명·유형·주소·데이터기준일자를 개별 주소 단위로 제공한다. 서구 주민이나 생활체육 동호인이 '우리 동네 가까운 공공 농구장이 어디 있나'를 찾을 때, 또는 분석가가 구 단위 생활체육 시설 분포를 볼 때 쓴다. 전역 조인 키가 없어 다른 체육시설 데이터와는 주소나 시설명을 맞춰 붙이거나 같은 기관(서구)이 낸 다른 체육시설 파일과 나란히 놓고 쓴다.
