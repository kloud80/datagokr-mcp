summary_user: 경기도 31개 시군의 박물관·미술관을 시설 한 곳당 한 행으로 담은 인허가·운영 현황으로, 시설명, 유형·종류, 인허가·개관·폐관 일자와 사유, 설립운영주체, 영업상태, 도로명·지번 주소와 WGS84 좌표가 들어 있다. 문화정책 담당자나 분석가가 '우리 시군에 운영 중인 사립 미술관은 몇 곳이고 어디에 몰려 있나' 같은 지역별 문화 인프라 분포를 따질 때 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못해, 다른 데이터와는 시군 코드(SIGUN_CD), 시설명, 주소 매칭이나 좌표 기반 공간 결합으로 이어 써야 한다.
description_portal: 박물관·미술관 현황은 경기도 관할 31개 시군 내 박물관 및 미술관에 대한 인허가 현황과 운영 정보를 포함한 데이터로, 행정안전부에서 개방한 API를 통해 제공됩니다. 이 데이터는 각 시설의 명칭(BIZPLC_NM), 유형(MUSEUM_ARTGLRY_TYPE_NM), 종류(MUSEUM_ARTGLRY_KIND_NM), 인허가일자(LICENSG_DE), 폐관일자(CLOSNG_DE), 개관일자(OPENHL_DE), 설립운영주체(FOUND_OPERT_MAINBD_DIV_NM) 등의 정보와 함께, 도로명·지번 주소(REFINE_ROADNM_ADDR, REFINE_LOTNO_ADDR), 우편번호(REFINE_ZIP_CD), 그리고 WGS84 좌표(REFINE_WGS84_LAT, REFINE_WGS84_LOGT) 등 정밀 위치 정보도 포함하고 있습니다. 문화예술 향유 기회 확대와 관련된 정책 수립, 지역별 문화 인프라 현황 분석, 관광정보 시스템 구축 등에 활용이 가능하며, 시설별 폐관사유(CLOSNG_RESN), 자본금(CAPTL_AMT), 법인명(COPRTN_NM) 등 다양한 행정적‧재정적 정보도 함께 제공됩니다.
