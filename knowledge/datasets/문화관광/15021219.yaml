summary_user: 그랜드코리아레저(주)가 운영하는 외국인 전용 카지노 세븐럭카지노 3개 영업점(강남코엑스점, 서울드래곤시티점, 부산롯데점)의 입장객 수를 월·영업장·방문고객 구분(VIP, 단체 관광객, 일반 고객)별로 집계하고, 일본·중국·대만 등 국적별 열로 나눠 담은 파일(csv)이다. 관광 분석가나 지자체 관광 담당자가 '최근 몇 년 사이 세븐럭카지노를 찾은 중국·일본 손님이 영업점별로 어떻게 달라졌나' 같은 국적별 외래 방문 추이를 살피는 데 쓴다. 실측 컬럼에 관광지점코드·시군구코드 같은 전역 조인 키가 없어, 다른 관광 통계와는 년월과 영업장 이름(서울·부산 소재지)을 수작업으로 맞춰 이어 써야 한다.
limits: 영업장 3곳의 집계 수치만 담아 개별 방문객 정보나 카지노 매출은 알 수 없고, 표준 지역·관광지점 코드가 없어 자동 조인이 되지 않는다. 카지노 데이터는 관광 부문 핵심 범위에서 배제된 보조 등급으로 분류돼 있다.
