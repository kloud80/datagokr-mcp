summary_user: 제주돌문화공원 안의 무장애여행 지점별 위도·경도·해발고도와 장소 설명·이미지 정보를 담은 지점 단위 원천 데이터로, 제주데이터허브(jejudatahub.net)에서 제공한다. 휠체어 이용자·교통약자 가족이나 관광 서비스 개발자가 "돌문화공원 안에서 휠체어로 다닐 수 있는 동선과 화장실·주차장 같은 편의시설은 어디에 있나"를 확인하는 데 쓴다. 실측 컬럼에 TourAPI contentId 같은 전역 조인 키가 없어, 다른 관광 데이터와는 장소 이름 매칭이나 좌표(위도·경도) 기반 공간 결합으로만 이어 쓴다.
description_portal: '제주특별자치도 제주데이터허브(https://www.jejudatahub.net/)에서 제공하는 돌문화공원 무장애여행 관련 위도경도, 장소설명, 이미지 정보입니다.* 제주돌문화공원은 제주만의 독특한 ‘돌문화’와 자연을 체험할 수 있는 역사·문화 복합 공원이다. 화산암과 제주 고유 지질유물을 전시한 박물관과 전시관, 전통 초가 민가 재현, 돌하르방 등 민속 조형물, 숲길 산책로와 곶자왈 자연환경이 더해져 있다. 무장애 여행 정보를 담은 이 데이터셋은 공원 내 경로, 접근 가능한 동선, 편의시설(주차장, 화장실 등), 지점별 설명 등을 포함해 휠체어 이용자 및 교통약자도 공원을 안전하고 편리하게 이용할 수 있도록 구성되었다. 문화유산 이해와 자연 체험을 모두 만족시키는 열린관광지로서, 관광 접근성 확대, 무장애 관광 환경 구축, 정책 수립 및 관광 서비스 개선 등의 기초자료로 활용 가능하다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
