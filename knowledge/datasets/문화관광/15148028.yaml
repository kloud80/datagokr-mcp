summary_user: 서울 구로구의 당구장업 인허가 사업장을 한 곳씩 담은 건별 명부로, 인허가일자·영업상태(영업·폐업·휴업 등)·사업장명·지번/도로명 주소·좌표, 건축물 동수·면적, 법인명 등을 기록한다. 구로구에서 지금 영업 중인 당구장이 어디에 있고 최근 문을 닫은 곳은 어디인지, 특정 업소가 정식 인허가를 받았는지 확인하려는 시민이나 동네 상권 변화를 보는 분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 사업장명·주소 매칭이나 좌표(X, Y)를 이용한 공간 결합, 같은 기관 코드(OPNSFTEAMCODE)로 이어 쓰며, 같은 체육시설업 계열의 헬스장·골프연습장 명부나 상권 데이터와 함께 본다.
description_portal: 본 데이터는 서울시 구로구에서 관리하는 당구장업 인허가 현황을 제공하는 공공자료이다. 자료에는 인허가일자, 영업상태, 사업장명, 주소, 좌표정보 등이 포함되며, 당구장업 시설의 면적, 건축물 연면적, 업태구분, 법인명 등 주요 속성이 기록된다. 또한 개설, 폐업, 휴업, 재개업과 같은 변동사항을 확인할 수 있어 시설 운영 현황 파악에 활용된다. 행정기관은 이를 통해 지역 내 당구장업을 관리하며, 시민은 합법적 운영 여부를 확인할 수 있다. 데이터는 정기적으로 갱신되어 최신 행정정보를 반영하므로 정책 수립, 연구 분석, 민원 처리 등에 활용된다. 좌표정보는 지도 서비스 및 공간 분석에 연계 가능하여 행정 투명성과 정보 접근성을 높이는 기반 자료로 기능한다.
