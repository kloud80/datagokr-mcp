summary_user: "경주시 관내 숙박시설을 호텔·리조트·콘도·게스트하우스·민박 등 테마유형별로 나눠 숙소명·주소·전화번호·홈페이지를 숙소 한 곳당 한 행으로 담은 CSV 파일(약 16KB)이다. 여행객이나 관광 서비스 개발자가 '경주에서 한옥·게스트하우스 같은 특정 유형 숙소는 어디에 있고 연락처는 무엇인가'를 찾는 데 쓴다. 전역 조인 키가 없어 다른 숙박 데이터(예: 공중위생 숙박업 인허가 자료)와는 숙소명·주소를 맞춰 이어 써야 한다."
description_portal: 본 데이터는 경상북도 경주시 관내에서 운영 중인 숙박시설에 대한 정보를 테마 유형별로 분류하여 제공하는 공공데이터 파일이다. 호텔, 리조트, 콘도, 게스트하우스, 민박 등 다양한 유형의 숙소가 포함되어 있으며, 각 숙소의 명칭, 테마유형, 소재지 주소, 연락처, 홈페이지 링크 등의 상세 정보가 수록되어 있다. 이 데이터는 여행객의 숙소 선택에 도움을 주며, 경주시 관광자원 분석, 관광정책 수립 등 다양한 방면에서 활용될 수 있다. 정기적으로 최신 정보로 갱신되며, 파일 형식은 CSV로 제공되어 다양한 시스템에서 접근 및 분석이 가능하다. 데이터는 경상북도 경주시에서 관리하며, 위치기반 관광 서비스 구축에도 유용하게 활용될 수 있다.
