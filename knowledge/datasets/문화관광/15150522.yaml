summary_user: 제주관광공사가 운영하는 제주 지정면세점에서 취급하는 브랜드를 브랜드 단위로 한 줄씩 담은 목록으로, 브랜드코드·브랜드명·기업분류 세 항목만 있고 포털 설명상 1,001건이다. 면세점 입점 브랜드 현황을 보려는 관광객이나, 기업 유형별 브랜드 구성을 분석하려는 분석가가 "제주 지정면세점에 어떤 브랜드가 들어와 있나"를 확인하는 데 쓴다. 브랜드코드(jto_dfs_brand_cd)가 유일한 조인 키라서 같은 코드를 쓰는 제주관광공사 면세점 상품·매출 데이터와만 이을 수 있고, 지역코드나 TourAPI 콘텐츠 ID는 없다.
description_portal: 제주관광공사에서 운영하는 지정면세점 취급 브랜드 목록 데이터입니다.해당 데이터는 면세점관리시스템에서 관리자가 등록하여 생성합니다.개방데이터 항목은 브랜드코드, 브랜드명, 기업분류이며 전체 데이터 수는 1,001건(데이터 기준일 기준)입니다.해당 데이터를 통해 제주 지정면세점에서 판매되는 다양한 브랜드 현황 파악, 상품·브랜드 관리 및 분류 체계화, 기업 유형별 분석, 입점 브랜드 확대 및 상품 차별화 전략 수립, 국내외 관광객 대상 마케팅 효과 증대, 면세 쇼핑 만족도 향상 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.
