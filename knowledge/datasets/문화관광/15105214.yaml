summary_user: 국립한글박물관에서 열린 전시를 건별로 담으며, 전시 제목(title)·보조 서술·자원 위치(url)·책임 개체·등록일 등을 제공한다. 박물관 관람을 계획하는 시민이나 한글 관련 전시 이력을 조사하는 연구자가 "국립한글박물관에서 어떤 주제의 전시가 언제 열렸나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 전시명·기관명 같은 이름 매칭이나 같은 기관 코드로만 연결한다.
description_portal: 국립한글박물관에서 개최되는 다양한 전시의 제목, 내용, 전시장소, 기간 등 전시 관련 정보를 체계적으로 제공하여 전시 관람 계획을 세우거나 문화 연구에 활용할 수 있도록 지원합니다. 발행기관, 소속 DB, 책임 개체, 자원 위치, 자원 명칭, 보조 서술, 등록일 등 주요 정보를 포함하고 있어 전시 현황 파악과 더불어 한글과 관련된 문화유산의 보존 및 확산에도 기여합니다. 연구자, 학생, 일반 시민 등 다양한 이용자가 전시 정보를 손쉽게 확인하고, 문화 체험 및 교육 자료로 활용하는 데 유용하게 사용할 수 있습니다.
