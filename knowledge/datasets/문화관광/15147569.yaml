summary_user: 서울 동작구에서 영화를 배급하는 업소의 인허가 정보를 업소 한 곳당 한 행씩 담으며, 인허가일자·취소일자, 영업상태와 상세상태, 폐업일자, 사업장명, 지번·도로명 주소, 중부원점TM(EPSG:5174) 좌표가 들어 있다. 동작구에 지금 영업 중인 영화배급업체가 어디에 몇 곳 있는지, 언제 인허가를 받았거나 폐업했는지 확인하려는 사업자나 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 데이터와는 사업장명·주소 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결한다.
