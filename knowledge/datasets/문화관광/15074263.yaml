summary_user: 춘천시 스탬프투어 대상 명소를 장소 한 곳당 한 행으로 담은 지자체 관광지 목록 파일(csv, 약 6KB)로, 테마·주소·스탬프하우스 위치·관광지 설명·하절기/동절기 개방시간·휴관일을 포함한다. 춘천 스탬프투어 참여자나 관광객이 '이 명소는 겨울에 몇 시까지 열고 무슨 요일에 쉬며, 스탬프는 어디서 찍나'를 확인해 일정을 짜는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지 등 다른 데이터와는 장소명이나 도로명·지번주소를 매칭해서만 이어 쓸 수 있다.
description_portal: 2022년 공공데이터 개선 계획에 따라 기존에 개방되었던 스탬프투어 명소 관련 자료에 관광지 설명과 휴관일 정보를 추가하여 더욱 풍부하고 유익한 관광 정보를 제공하는 자료입니다. 이 자료는 강원도 춘천시의 주요 관광지를 대상으로 하며, 시도명, 시군구명, 테마명, 장소명, 도로명주소, 지번주소, 스탬프하우스 위치, 관광지 설명, 하절기 개방 시작 및 종료 시간, 동절기 개방 시작 및 종료 시간, 정기 휴관일, 데이터 기준일자 등의 항목으로 구성되어 있습니다. 이를 통해 관광객은 각 장소의 개방 시간 및 운영 정보를 쉽게 확인하고, 효율적인 여행 일정을 계획할 수 있습니다. 또한 스탬프투어 참여자에게는 위치 기반의 명소 정보를 제공함으로써, 지역 관광 활성화와 공공데이터 활용도 제고에도 기여할 수 있습니다.
