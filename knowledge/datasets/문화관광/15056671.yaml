summary_user: 경기도 내 요트 관련 공공체육시설을 집계년도별로 한 행씩 담은 시설 현황 자료이며, 시군·시설명, 소유·운영·관리 기관, 부지·건축·연면적, 코스 길이와 개소수, 해수면적, 준공연도, 건설사업비(백만원), 주소·좌표를 담는다. 지자체 체육 담당자나 분석가가 '경기도 어느 시군에 공공 요트시설이 있고, 언제 얼마를 들여 지었으며 누가 운영하나'를 확인하는 데 쓴다. 전역 조인 키는 없어서 시군코드(SIGUN_CD)·시군명으로 같은 경기도 데이터와 맞추거나, 주소·위경도로 다른 시설·상권 자료와 이어 쓴다.
description_portal: 경기도 공공체육시설 현황(요트)입니다. 시설명, 운영조직명, 연락처, 부지면적, 준공연도 등의 정보를 제공합니다.이 데이터는 요트 관련 공공체육시설에 대한 연도별 현황을 정리한 자료입니다. 주요 항목으로는 집계년도, 시군명, 시설명 등 기본 정보 외에 소유기관명, 운영조직명, 관리주체명 등의 기관 관련 항목이 포함되어 있습니다. 부지면적, 건축면적, 연면적은 각 시설의 규모를 나타내며, 코스1길이와 코스1개소수는 요트 코스의 물리적 특성과 수량을 보여줍니다. 또한 준공연도와 건설사업비(백만원) 항목을 통해 시설 건설 시기와 투자비용을 파악할 수 있습니다. 이 데이터는 지방자치단체의 체육시설 관리 및 개발 전략 수립, 요트 관련 여가 인프라 조사, 공공시설 투자 분석 등에 활용될 수 있습니다.
