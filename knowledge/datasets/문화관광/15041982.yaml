summary_user: 제주관광공사가 운영하는 비짓제주(VISIT JEJU)에 등록된 관광지별 콘텐츠명, 평일·주말 운영시간, 휴식시간, 난이도, 장애인 주차구역·엘리베이터·화장실·영유아 돌봄시설 등 무장애 관광 정보를 관광지 한 곳당 한 행으로 담은 CSV 파일이다(포털 설명상 1,772건). 여행객이나 여행 서비스 개발자가 "이 제주 관광지는 주말 몇 시에 문을 닫고, 휠체어 이용자가 쓸 화장실·엘리베이터가 있는가"를 확인하거나 무장애 여행 일정을 짤 때 쓴다. 관광지 코드나 좌표 같은 전역 조인 키가 없어 TourAPI 관광 콘텐츠 등 다른 데이터와는 콘텐츠명(관광지 이름)을 맞춰 연결해야 한다.
limits: 실측 컬럼에 조인 키가 없어 다른 관광 데이터와 이름 매칭으로만 이어 붙일 수 있고, 이름 표기가 다르면 연결이 어긋날 수 있다. 위치·주소 정보가 없어 지도 표시나 지역별 집계에는 바로 쓰지 못한다. 메타데이터상 범위는 전국·비공간으로 표기돼 있으나, 포털 설명에 따르면 실제 내용은 비짓제주에 등록된 제주 관광지다.
