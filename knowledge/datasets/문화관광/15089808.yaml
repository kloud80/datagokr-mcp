summary_user: 청주시 시립도서관별 열람실 좌석예약 운영 기준을 코너(좌석 구역) 단위로 담은 소규모 파일(csv 약 3.4KB)로, 평일·주말 운영시간, 휴관일, 1회·1일 제한시간, 하루 예약 횟수, 시간 연장 규칙, 나이 제한 등 이용 정책이 들어 있다. 시민이 '주말에 어느 청주 도서관 열람실이 몇 시까지 열고 한 번에 몇 시간까지 쓸 수 있나'를 확인하거나, 분석가가 도서관별 좌석 운영 정책을 비교하는 데 쓴다. 전역 조인 키가 없어 다른 도서관 데이터와는 도서관명으로 이름 매칭해 연결해야 하며, 도서관정보나루의 도서관코드와도 직접 이어지지 않는다.
limits: 실시간 잔여 좌석이나 개별 예약 건이 아니라 코너별 운영 기준만 담고 있어 혼잡도·이용률 분석에는 쓸 수 없다. 도서관코드 같은 공통 키가 없어 다른 도서관 데이터와 연결하려면 도서관명 매칭이 필요하다.
