summary_user: 경상북도 도립교향악단이 도내 시군에서 여는 공연을 건별로 담은 일정 표로, 시군명·일자·장소·행사내용·목적 5개 항목으로 구성된 시군구 단위 파일(csv)이다. 지역 주민이나 문화정책 담당자가 '우리 시군에 도립교향악단 공연이 언제, 어디서, 어떤 목적으로 열리나'를 확인하거나 시군별 공연 분포를 비교하는 데 쓴다. 전역 조인 키가 없어 KOPIS 공연ID나 공연장ID와 바로 연결되지 않으며, 시군명·장소 이름을 맞춰 다른 공연·문화시설 데이터와 이어 쓴다.
limits: 공연ID·공연장ID·행정코드 같은 공통 키가 없어 다른 데이터와는 시군명·장소명 텍스트 매칭으로만 연결된다. 명세상 월간·이벤트 주기로 표기되어 있고 공연 일정에 따라 내용이 바뀔 수 있어, 최신 일정은 실제 파일 시점을 확인해야 한다.
