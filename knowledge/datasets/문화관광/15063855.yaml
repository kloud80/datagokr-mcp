description_portal: 전통예술상세 정보 서비스는 부산에서 공연하는 전통예술의 공연 정보를 개방합니다. 개방되는 데이터에는 공연명, 관람 연령, 가격, 원작, 출연진, 제작진, 평점, 관련 링크 등 다양한 항목을 종합적으로 제공하여 이용자가 원하는 공연 정보를 쉽고 빠르게 확인할 수 있습니다. 이 서비스를 통해 공연별 특성과 차이점을 비교하고, 연령대나 관심 분야에 맞는 공연을 선택할 수 있으며, 예매 및 관람 계획 수립에도 유용하게 활용할 수 있습니다. 또 다양한 분야의 공연이 있는데 가야금, 해금 등 기악 공연과 판소리 등의 소리 공연, 무용공연 정보가 포함되어 있습니다. 부산시립국악관현악단의 특별, 정기 연주회, 수요공감 , 토요 신명 무대 등 부산국립국악원에서 공연하는 정보들도 제공하고 있습니다.
