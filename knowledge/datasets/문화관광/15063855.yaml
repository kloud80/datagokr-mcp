summary_user: 부산에서 열리는 전통예술 공연(가야금·해금 등 기악, 판소리, 무용, 부산시립국악관현악단·부산국립국악원 공연 등)을 공연 한 건 단위로 담으며, 공연명·기간·공연시간·관람 연령·가격·출연진·제작진·평점·공연장명 등을 제공한다. 부산 시민이나 관광객이 '이번 달 부산에서 볼 수 있는 국악·전통무용 공연은 무엇이고 관람료와 연령 제한은 어떤가'를 확인하거나, 분석가가 지역 전통예술 공연 편성을 살펴보는 데 쓴다. 실측 컬럼에서 전역 조인 키는 확인되지 않았고 KOPIS 공연ID·공연장ID와의 직접 연결도 확인되지 않아, 공연명·공연장명(place_nm) 같은 이름 매핑이나 부산시 자체 공연장 식별자(place_id)로만 다른 공연·문화시설 데이터와 이어 쓴다.
limits: 전역 조인 키가 없어 KOPIS 공연 목록·예매/매출 데이터와 바로 결합할 수 없고 이름 매칭이 필요하다. 이벤트성으로 생성된 뒤 바뀌지 않는 주기로 분류돼 있어 최신 공연 반영 여부는 호출해 확인해야 한다. 호출은 serviceKey가 필요하며 개발계정은 일 10,000회로 제한된다.
