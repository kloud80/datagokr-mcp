summary_user: 부산광역시 남구 관내 공연장을 한 곳당 한 행으로 담은 목록 파일로, 공연장 이름·도로명 소재지·전화번호·객석수를 담는다(포털 설명상 19개소, 시군구 범위의 개별 주소 단위). 남구에서 공연을 열 장소를 찾는 기획자나 동네 소극장·대형 공연장 분포를 살피는 주민·분석가가 "남구에 몇 석 규모의 공연장이 어디에 있나"를 확인하는 데 쓴다. 공통 조인 키가 없어 KOPIS 공연장ID 같은 외부 키와 바로 붙지 않고, 공연장 이름이나 도로명 주소를 맞춰 KOPIS 공연장 목록이나 다른 문화시설 데이터와 이어 써야 한다.
description_portal: '- 부산광역시 남구 관내에 소재한 공연장 현황 자료입니다.-공연장 업체명, 소재지, 전화번호에 대한 데이터를 제공합니다.- 부산 남구에는 19개의 공연장이 있습니다. 대형 뮤지컬을 공연하는 공연장부터 클래식 및 대형 공연이 가능한 복합 공연장, 배우들의 숨소리까지 생생히 들을 수 있는 소극장에 폭발하는 젊음의 열기로 늘 가득한 음악 밴드가 공연할 수 있는  공연장까지! 다양한 취향의 관객들을 모두 만족시킬 수 있는 공연장이 항시 대기하고 있는 부산 남구에 방문해 다양한 문화를 누려보시기 바랍니다.'
