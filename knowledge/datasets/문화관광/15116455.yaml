description_portal: 한국디자인진흥원은 국내 디자인전문기업 가운데 디자인 개발 역량과 매출액, 분야별 전문성, 경영 전략 등을 종합적으로 평가해 2008년부터 매년 우수디자인전문기업을 선정, 발표하고 있습니다. 산업디자인진흥법 제9조의 산업디자인전문회사로 신고된 디자인전문기업 중 신청 요건을 모두 충족하는 기업을 선도와 유망 우수디자인전문기업으로 선정하고 있으며, 본 데이터는 해당 기업들의 목록 데이터입니다. 산업디자인전문회사(산업디자인에 관한 개발ㆍ조사ㆍ분석ㆍ자문 등을 전문으로 하는 회사)로 신고 및 등록된 회사 중 2018년부터 2022년까지 산업디자인전문회사 중 우수기업으로 선정된 기업의 목록으로, 기업명, 유효연도, 주소, 전문분야, 업종 등의 항목을 제공합니다.
