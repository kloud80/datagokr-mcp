summary_user: 국가유산청이 제공하는 사적(국가지정유산)의 목록을 유산별 한 건씩 담으며, 지정일자·유산명·시대·분류·지정번호·소재지와 X·Y 좌표를 포함하고 범위는 전국이다. 특정 지역에 어떤 사적이 있는지, 언제 지정됐는지를 확인하거나 사적 위치를 지도에 표시하려는 국민·연구자·분석가가 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 유산명·지정번호(DSGN_NO)를 이름·코드로 맞춰 연결하며, 같은 정보를 담은 국가유산청 자체 API(종목코드+지정번호 체계)와 대조해 쓴다.
