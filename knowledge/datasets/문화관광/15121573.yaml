description_portal: 본 데이터는 경기도 광주시립도서관 홈페이지 게시판의 카테고리 분류 정보를 제공합니다. 각 게시판의 게시물을 중앙도서관, 오포도서관, 곤지암도서관, 지역별 작은도서관 등 시설별로 구분하여 관리하는 카테고리 정보를 담고 있습니다. 게시판카테고리번호는 각 카테고리를 식별하는 고유 번호이며, 게시판번호는 상위 게시판과의 연결 관계를 나타냅니다. 카테고리명은 분류 기준을 표시하고, 등록날짜와 수정날짜는 카테고리 생성 및 변경 이력을 기록합니다. 본 데이터는 게시판 콘텐츠 분류, 도서관별 정보 제공, 게시물 검색 편의 향상, 홈페이지 구조 관리 등에 활용됩니다.
