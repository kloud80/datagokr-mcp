summary_user: 국립박물관문화재단의 박물관 상품 브랜드 뮷즈(MU:DS) 상품을 한 행에 한 품목씩 담은 목록 파일로, 상품명·소분류·재질·사이즈(mm)·비고를 기록하며 전국 단위의 비공간 데이터다(csv 약 14KB). 박물관 상품을 기획하거나 판매·소개하는 사업자, 문화유산 굿즈를 조사하는 분석가가 '어떤 종류와 재질의 박물관 상품이 나와 있는가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상품명이나 분류 이름을 맞춰 보거나 같은 기관 자료끼리만 이어 쓴다.
description_portal: 국립박물관문화재단 박물관상품의 기본정보로 연번(숫자형), 상품명(문자형), 소분류(문자형), 재질(문자형), 사이즈(문자형) 등의 항목을 포함하고 있습니다.뮷즈(MU:DS)란 국립박물관이 소장한 문화유산을 모티브로 많은 사람들이 일상에서 가깝게 느끼고 사용할 수 있도록 만든 국립박물관문화재단의 박물관 상품 브랜드로 박물관 문화유산의 고유한 가치에 오늘날의 쓰임새를 더해 유물을 소장하는 즐거움을 제공하고 박물관에서의 좋았던 순간을 일상에서 두고두고 이어가고 싶은 마음을 채웁니다.해당 데이터파일의 데이터에 대한 추가 문의사항은 국립박물관문화재단 전략기획팀(02-2077-2906)으로 해주시기 바랍니다.
