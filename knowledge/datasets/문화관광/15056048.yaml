summary_user: 서귀포시 관내 호텔업체를 업체 한 곳당 한 행으로 담은 파일로, 구분·상호명·소재지·객실수·연락처·위도·경도를 포함하며 범위는 서귀포시 한 개 시군구다. 관광정책 담당자나 분석가가 서귀포시 안에서 호텔 객실이 어느 지역에 몰려 있고 어디가 부족한지 파악하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명·주소 매칭이나 위경도 기반 공간 결합으로 잇고, 숙박업 인허가 공통 원천(LOCALDATA 공중위생 신고)과는 이름·주소로 대조한다.
description_portal: 이 자료는 서귀포시 관내 호텔업체들의 실태를 파악할 수 있게 해주며, 상호명·주소·객실수·연락처·위치 좌표 등이 포함되어 있어 공간적 분포와 호텔 규모 비교가 가능합니다. 관광정책 입안 시 호텔 수요와 공급 간 균형을 분석하고, 특정 지역의 숙박 밀집도 및 숙박 인프라 부족 구역을 식별하는 데 유용합니다. 또한 관광객 안내 앱이나 여행 정보 서비스, 숙박업소 간 경쟁력 비교 및 숙박 요금 책정, 접근성 개선 계획 수립 등에 기초 자료로 활용될 수 있습니다. 이 자료는 지역 경제 활성화, 관광산업 육성, 숙박 서비스 품질 제고 등에 중요한 정책 기초가 됩니다.
