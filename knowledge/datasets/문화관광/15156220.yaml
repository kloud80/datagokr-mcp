description_portal: 이 자료는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 GTX(수도권광역급행철도) 관련 뉴스 메타정보 자료입니다. 포함 항목으로는 기사 주소, 보도 일자, 언론사, 제목, 통합분류(1~3단계), 개체명(인물·지역·기관·사업명), 키워드, 특성추출 값, 본문 내용 등이 있으며, 이를 통해 개별 기사에 대한 구조적·정량적 분석이 가능합니다.본 자료는 국내 주요 언론사의 GTX A·B·C 노선 및 추가 노선 관련 보도를 대상으로, 어떤 지역과 노선 이슈가 어느 시기에 집중 보도되었는지, 주요 키워드와 보도 프레임이 어떻게 형성되었는지 등을 파악하는 데 중점을 두고 있습니다. 이러한 분석을 통해 언론이 사업 추진 일정, 예비타당성 조사, 노선 확정 및 변경 논의, 정거장 입지 갈등, 부동산 시장 영향, 지역 간 형평성 문제, 공사 난항 및 안전 이슈, 정부·지자체의 교통정책 방향 등 다양한 사안을 어떤 관점에서 재현하는지 확인할 수 있습니다. 또한 이러한 보도 경향이 대중 여론, 지역 개발 담론, 주택시장 기대 심리, 정부 정책 논의에 어떤 영향을 미쳤는지를 추적하는 데도 유용합니다.아울러 이 자료는 도시·교통 연구자, 국토·교통 정책 전문가, 지자체 및 국토교통부 관계자, 언론·커뮤니케이션 연구자 등에게 GTX 관련 보도의 흐름, 이슈별 프레임 변화, 언론의 교통·도시 정책 재현 방식을 이해하는 데 기초 자료로 활용될 수 있습니다.
