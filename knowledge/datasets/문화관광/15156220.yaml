summary_user: 빅카인즈(BIGKinds)에서 모은 GTX(수도권광역급행철도) 관련 뉴스를 기사 한 건당 한 행으로 담은 메타데이터 파일(CSV, 약 65MB)로, 보도 일자·언론사·제목·통합분류(1~3단계)·인물·지역·기관 개체명·키워드·특성추출 값을 담는다. 도시·교통·언론 연구자가 'GTX 노선별로 어느 지역 이슈가 언제 집중 보도되었고 어떤 키워드로 다뤄졌나'를 분석하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, 다른 데이터와는 일자나 지역·기관 개체명 같은 이름 매칭으로만 이어 쓴다.
limits: 기사 식별 코드나 행정구역 코드 같은 공통 키가 없어 다른 공공데이터와 정확히 연결하기 어렵고, 지역은 개체명 텍스트로만 들어 있어 공간 분석에는 별도 매핑이 필요하다. 갱신 주기와 수록 기간은 확인되지 않았다.
