summary_user: 경기도 데이터분석시스템이 만든 경기도 내 추천 관광 코스 목록으로, 코스마다 관광권역 코드, 추천코스 ID와 이름, 경로 모양(위치 정보)을 한 행씩 담는다. 여행 상품 기획자나 지역 관광 분석가가 '경기도 어느 권역에 어떤 관광지를 잇는 추천 코스가 있는가'를 확인하거나 연계 여행 프로그램을 구성할 때 쓴다. 실측 컬럼에 전국 단위 조인 키가 없어 TourAPI 관광지 정보 등과는 코스명 속 관광지 이름을 맞추거나 경기도 관광권역 코드로만 연결한다.
description_portal: 이 데이터는 경기도 내 주요 관광지를 중심으로 구성된 추천 코스 정보를 제공하며, 관광객의 여행 경로 정보를 분석하기 위해 경기도 데이터분석시스템에서 생성한 데이터입니다. 주요 항목으로는 관광권역코드, 추천코스 ID, 추천코스명, 모양이 포함되어 있으며, 모양컬럼의 값은 길이 문제로 시트탭에서는 제공하지 않습니다. 모양 컬럼의 값은 파일 탭의 데이터를 확인해주시기 바랍니다. 해당 데이터는 문화관광 콘텐츠 기획, 관광지 간 연계상품 개발, 지역 맞춤형 여행 프로그램 구성 등에 활용될 수 있습니다. 특히, 추천코스명은 실제 관광지 명칭을 기반으로 하며, 지역 내 관광 거점 식별에 유용한 정보를 제공합니다.
