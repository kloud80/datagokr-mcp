summary_user: 제주 동문시장 한 곳의 무장애여행 정보를 장소 단위로 담은 작은 CSV 파일(약 5KB)로, 위도·경도, 장소 명칭과 상세정보, 무장애 관광정보, 추천코스 여부를 담는다. 휠체어 이용자나 유모차 동반 가족이 동문시장 안에서 장애인 화장실·전용 주차구역 같은 편의시설이 어디 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 TourAPI 관광지나 다른 제주 무장애여행 파일과는 장소 명칭을 맞추거나 위도·경도로 위치를 대조해 이어 쓴다.
description_portal: '제주특별자치도에서 제공하는 무장애여행 관련 관광지별 "위도, 경도, 장소명칭, 장소상세정보, 무장애관광정보"입니다."* 제주 동문시장은 제주 제주시 관덕로14길 20에 위치한, 제주의 대표 전통 재래시장으로 해산물·과일·채소·건어물·기념품·의류 등 다양한 품목을 취급하며 제주의 지역 특산물과 먹거리, 기념품을 한자리에서 만날 수 있는 복합 시장이고 공용주차장, 장애인 전용 주차구역, 휠체어 대여, 장애인 화장실, 무장애 코스 지도가 제공되는 무장애 관광지로 지정되어 있어 교통약자, 고령자, 유모차 동반 가족 등도 비교적 편하게 이용 가능하며 여행 마지막 날 쇼핑, 식사, 기념품 구매 등에 적합한 열린관광지이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등"'
