summary_user: 인천광역시 부평구에 등록된 국내 여행업체를 업체 한 곳당 한 행으로 담은 소규모 파일(약 2.4KB CSV)로, 상호와 지번·도로명 소재지 주소만 들어 있다. 부평구에서 국내여행 상품을 기획·판매하는 업체가 어디에 몇 곳 있는지 확인하거나 동별 입지 분포를 보려는 주민·사업자·분석가가 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호명이나 주소를 맞춰 붙여야 하며, 주소를 지오코딩해 지도나 다른 관광사업 등록 자료와 겹쳐 본다.
description_portal: '국내 여행업체의 상호, 소재지 지번주소, 소재지 도로명 주소 등을 수록한 데이터.국내 관광 상품 기획·판매·알선 등 여행 서비스 제공 현황을 파악하고, 지역 관광산업 분석, 여행업 관리, 주민 여가활동 지원 및 관광 정책 수립 등에 활용 가능하다.활용 목적 및 특징– 국내 여행업 등록 현황 및 업종별 분포 분석– 지번·도로명 주소 기반 입지 특성 및 접근성 평가– 국내여행 서비스 제공 업체 관리 및 관광산업 정책 자료 활용– 주민 여가활동 지원 및 지역 관광산업 활성화 근거 제공주요 항목 설명● 상호: 여행업체의 명칭● 소재지 지번주소: 업체의 지번 주소● 소재지 도로명주소: 업체의 도로명 주소'
