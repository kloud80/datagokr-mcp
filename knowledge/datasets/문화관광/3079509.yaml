summary_user: 안양시 관내 영화상영관을 한 곳당 한 행으로 담은 등록 현황 원천 목록으로, 상호·등록일·소재지·층수·연면적·상영관 수·대표자·전화번호를 담는다(파일 크기 494바이트의 소규모 CSV). 시민이나 문화정책 분석가가 "안양시에 영화관이 어디에 몇 곳 있고 각각 상영관이 몇 개인가"를 확인하는 데 쓴다. 전역 조인 키나 코드표가 없어, 다른 데이터와는 상호명이나 소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
description_portal: '안양시 관내 영화상영관 등록 현황(관내 영화상영관 상호, 관내 영화상영관 등록일, 관내 영화상영관 소재지, 관내 영화상영관 규모, 관내 영화상영관 대표자, 관내 영화상영관 전화번호)주요 항목 설명 상영관 상호명 - 영화관의 공식 명칭 (예: CGV 안양, 롯데시네마 인덕원 등)  등록일- 해당 상영관이 등록된 날짜 소재지 -도로명주소 또는 지번주소 형식의 위치 정보 상영관 규모- 스크린 수, 좌석 수 등 상영관의 물리적 규모  대표자명- 사업자 또는 운영 책임자 이름  전화번호 - 상영관 대표 연락처 데이터 정보입니다.'
