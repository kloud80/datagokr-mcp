summary_user: 서울 강남구 일원라온영어도서관이 보유한 영어도서를 한 권(등록번호)당 한 행으로 담은 소장 목록 파일로, 청구기호·도서명·저자명·발행자명을 포함하며 포털 안내상 기준일은 2023년 2월 15일이다. 주민·학부모가 "이 도서관에 특정 영어 원서나 저자의 책이 있는가"를 확인하거나, 분석가가 영어도서관의 소장 구성(출판사·저자 분포)을 살펴보는 데 쓴다. ISBN이나 도서관코드 같은 전역 조인 키가 없어 다른 서지·대출 데이터와는 도서명·저자명 문자열 매칭으로만 이어 쓸 수 있다.
description_portal: 서울특별시 강남구 일원라온영어도서관 보유 영어도서 목록 입니다. 해당 목록에는 각각의 도서별로 등록번호, 청구기호, 도서명, 저자명, 그리고 발행자명 등과 같은 주요 정보들이 포함되어 있습니다 본 목록의 데이터 기준일이 2023년 2월 15일로 안내되어 있으니, 해당 날짜 기준의 정보임을 감안하여 자료를 활용해 주시면 감사하겠습니다.추가적으로 문의하실 내용이나 더 구체적인 정보가 필요하신 경우에는 기타 자세한 사항은 서울특별시 강남구 문화도시과(02-3423-5954)로 주시면 자세히 안내해 드리도록 하겠습니다.
