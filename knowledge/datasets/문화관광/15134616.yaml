description_portal: 고령화 사회 진입과 교육 소외 계층에 대한 사회적 관심이 높아지는 가운데, 읽기·쓰기 등 기초 문해력 향상을 위한 성인문해교육의 중요성이 날로 커지고 있습니다. 충청남도 보령시는 평생학습센터에서 운영 중인 성인문해교육의 운영 현황 데이터를 제공합니다. 본 데이터는 강의계획서, 강의, 마을 3개의 CSV 파일로 구성되어 있으며, 압축파일 형태로 제공됩니다. 지자체 및 평생교육 관련 기관은 본 데이터를 통해 성인문해교육 프로그램의 운영 현황과 마을별 교육 참여 실태를 파악하고, 교육 소외 지역 발굴 및 문해교육 확대 계획 수립에 활용할 수 있습니다. 또한 평생교육 연구기관에서는 강의계획서 및 강의 데이터를 바탕으로 성인문해교육 프로그램의 질적 개선 방안 및 교육과정 표준화 연구에 기여할 수 있으며, 복지 분야에서는 마을별 문해교육 참여 현황을 활용하여 취약계층 교육 지원 정책 수립에 본 데이터를 활용할 수 있습니다.
