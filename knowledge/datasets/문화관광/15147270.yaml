summary_user: 서울 동대문구의 골프연습장업 인허가 정보를 업소 한 곳당 한 행으로 담으며, 상호명·도로명/지번 주소·인허가일과 취소일·영업상태(영업/폐업)·폐업일·좌표·지도자 수·건물 면적 등을 포함한다. 동대문구에서 지금 영업 중인 골프연습장이 어디에 있는지, 최근 몇 곳이 새로 문 열거나 폐업했는지를 확인하는 주민·창업자·상권 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 다른 자치구의 같은 업종 인허가 데이터나 헬스·당구 등 다른 체육시설업 데이터와는 관리번호(MGTNO)·주소·상호명 같은 이름·코드 매핑으로 이어 쓴다.
description_portal: '▶ 동대문구 골프연습장업 정보를 제공합니다.(상호명, 도로명주소, 지번주소, 영업여부 등)▶ 골프연습장업은 「체육시설의 설치·이용에 관한 법률」에서 규정한 체육시설업의 한 종류로, 골프를 목적으로 타석과 연습 시설을 설치·운영하여 일반인에게 연습·교습 기회를 제공하는 업을 말합니다.▶ 주요 내용- 운영 목적 : 골프 스윙·퍼팅 등 기술 연습, 생활체육 활성화, 여가 활용- 시설 요건 : 타석, 장비, 안전시설 등 체계적인 시설 관리- 교육 기능 : 전문 지도자를 통한 개인·단체 레슨 가능- 사회적 기능 : 주민 건강 증진, 생활체육 저변 확대, 체육 문화 활성화▶ 체력단련장업은 신고체육시설업에 해당하므로, 사업자는 관할 구청에 체육시설업 신고를 해야 합니다.▶ 사업자가 제출해야 할 서류에는 체육시설업 신고서, 임대차계약서, 지도자 자격증, 시설 평면도 등이 있습니다.'
