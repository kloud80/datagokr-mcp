summary_user: 인천광역시 남동구에 있는 출판사와 인쇄소를 사업체 한 곳당 한 행으로 담은 목록 파일로, 업종 구분·사업체 명칭·소재지 주소·전화번호를 담는다. 남동구에서 인쇄를 맡기거나 거래할 출판·인쇄 업체를 찾는 사업자, 또는 구 안의 출판·인쇄업 분포를 보려는 분석가가 쓴다. 사업자번호나 행정 코드 같은 전역 조인 키가 없어서, 다른 데이터와는 사업체 명칭이나 주소 문자열을 맞추는 방식으로만 이어 쓴다.
limits: 수록 범위는 남동구 한 곳의 개별 사업체로 한정되므로 인천 전체나 다른 시군구와 비교하려면 별도 자료가 필요하다. 공통 식별 키가 없어서 출판사 신고 원장이나 사업자 정보와 정확히 대조하기 어렵고, 명칭·주소 매칭에는 오차가 생길 수 있다.
