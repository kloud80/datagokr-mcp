summary_user: 한국콘텐츠진흥원이 운영하는 광화문 CKL기업지원센터의 예약 가능 시설을 시설 한 건씩 담은 목록으로, 층·시설명·정렬순서·노출 및 사용 여부·예약가능시간을 담는다(약 2KB 크기의 CSV 파일). 콘텐츠 창업자나 기업이 "광화문 기업지원센터 몇 층에 어떤 회의실·스튜디오가 있고 몇 시간 예약할 수 있나"를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 시설명이나 같은 기관(한국콘텐츠진흥원) 기준으로만 이어 쓸 수 있다.
description_portal: '한국콘텐츠진흥원이 운영하는 광화문 CKL기업지원센터의 시설 예약정보에 관한 내용을 나타내고 있는 데이터 정보를 제공하고 있습니다. 이 데이터는 기업지원센터의 예약 가능 시설에 대한 상세한 정보를 제공하며, 이용자들이 원하는 시간대에 필요한 시설을 예약하는 데에 도움을 줄 수 있습니다. 또한, 이 데이터는 해당 센터의 이용 활성화 및 관리에 필요한 기초 자료로 활용될 수 있습니다. 데이터는 다음과 같은 구조로 이루어져 있습니다. 예약층(숫자형): 예약이 가능한 층수, 예약시설명(문자형): 예약할 수 있는 시설의 이름, 정렬번호(숫자형): 시설의 정렬 순서, 노출여부(문자형): 예약 시스템에서의 노출 유무, 사용여부(문자형): 해당 시설이 사용 가능한지 여부, 예약가능시간(숫자형): 예약할 수 있는 시간의 범위를 나타냅니다. 이러한 정보는 기업이나 개인이 콘텐츠 제작에 필요한 시설을 확보하는데 도움이 될 수 있습니다.'
