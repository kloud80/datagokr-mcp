description_portal: 이 데이터는 북촌마을해안길 의 위치(위도·경도), 경로 정보, 보행 환경, 무장애 접근성, 주변 편의시설 현황 등 관광 및 이동 약자 친화 정보를 구조화한 공공데이터입니다. 북촌마을해안길은 제주시 조천읍 북촌리에 위치하며, 약 1.34 km의 해안 마을길을 따라 해동포구에서 북촌포구까지 이어지는 코스로, 대부분 평탄하거나 완경사로 이루어져 있어 휠체어·유모차 사용자 및 고령자도 비교적 수월하게 바다 경관과 마을 풍경을 감상할 수 있도록 설계되어 있습니다. 이 코스는 마을의 어촌 풍경, 역사문화 요소, 바다 조망이 함께 어우러지는 열린 관광 공간으로, 무장애 여행 계획, 관광 안내 자료 제작, 관광자원 관리, 지역 관광 정책 수립 등에 유용한 기초 자료가 됩니다. 데이터는 CSV 형식으로 무료 제공됩니다.
