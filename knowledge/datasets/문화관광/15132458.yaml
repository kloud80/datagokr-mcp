description_portal: '‘한국학중앙연구원_동양연표’ 데이터는 동아시아 역사 시기를 연도별로 비교·정리한 연표형 자료로, 서기년과 단기년을 기준으로 한국과 중국의 국가명, 군주명, 재위년, 연호 등의 정보를 제공합니다.이 데이터는 한국의 국명(예: 고려, 조선), 왕명, 재위기간, 그리고 같은 시기의 중국 왕조의 국명, 황제명, 연호, 재위년 정보를 포함하고 있어, 한중 양국의 통치자와 정치 연대를 연도별로 비교할 수 있습니다.이를 통해 동아시아 각국의 역사적 사건을 시간의 흐름에 따라 비교·분석할 수 있으며, 역사 연구자뿐만 아니라 교육자, 번역자, 일반 학습자들이 시대 구분과 연대 일치 여부를 명확히 이해하는 데 매우 유용한 자료로 활용될 수 있습니다.특히 한국 고문서를 이해할 때 자주 등장하는 중국 연호의 대응 연대를 파악할 수 있어, 문헌 해석과 주석 작업에도 폭넓게 활용됩니다.'
