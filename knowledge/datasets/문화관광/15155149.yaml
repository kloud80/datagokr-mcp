summary_user: 전국 지자체가 관리하는 일반야영장업 인허가 정보를 업소별 건 단위로 담으며, 전체 4,921건에 인허가일자·영업상태·사업장명·주소·좌표 등을 포함한다. 야영장 업소의 현재 영업·폐업 여부와 위치를 확인하려는 국민이나 지역별 야영장 분포를 보려는 분석가가 쓴다. 지번주소·도로명주소 등 주소(address) 키로 다른 주소 기반 데이터와 이어 쓰고, 개방자치단체코드(OPN_ATMY_GRP_CD)와 기준일자는 다른 데이터에서 받아 호출 파라미터로 넘긴다.
description_portal: '문화_일반야영장업 데이터는 야영에 적합한 시설 및 설비 등을 갖추고 야영편의를 제공하는 업소정보 인허가일자(허가일), 영업상태(영업/정상), 사업장명(업소명), 소재지주소(주소) 등의 데이터를 제공합니다.- 공공데이터 제공 표준 기준, 전국 자치단체에서 관리하는 일반야영장업 인허가 정보를 일괄 취합하여 전국 데이터로 제공- 자료는 동일한 서식과 용어로 정리하여 인허가 현황을 일관되게 안내- 해당 데이터에 대한 추가적인 자료 요청시 지자체 및 소관기관 담당자에게 문의- 해당 데이터 법령 소관기관 및 문의처 : 문화체육관광부 관광산업진흥과 / 044-203-2830, 2832 * 좌표계 : 보정계수 안들어간 Bessel 중부원점TM(EPSG:5174)'
team:
  dept: 지역디지털협력과
