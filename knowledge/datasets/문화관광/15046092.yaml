description_portal: '제주도 내 내국인, 중국인 관광업종 결제 데이터 (카드이용금액, 카드이용건수, 카드이용자수 등) 정보 제공자료출처: 제주특별자치도 FIT 증가에 따른 제주 관광객 소비패턴 변화 분석 보고서 (2016년도)* 본 보고서는 ’14. 9월 ~ ’16. 8월까지 약 2년 간 BC카드(내국인) 및 유니온페이카드(중국인) 매츨데이터를 기반으로 작성한 자료임내국인과 중국인 카드 결제 대이터 등 객관적인 자료를 활용하여 관광 및 지역 경제 관련한 스마트한 정책의 수립과 실행을 지원하기 위하여 수행된 과업으로 제주 관광객의 전반적인 소비와 지역별 소비 분석, 개별 관광객 증가 대응 총 3가지 과업으로 구성되어 있다. 본 자료를 통해서 제주도를 찾은 관광객의 패턴 및 성향 분석을 통해 수요자 중심의 맞춤형 관광정책 개발을 지원하고, 민간데이터 기반한 객관적이고 과학적인 분석으로 현안문제 해결 지원을 기대할 수 있다.'
