status: active
summary_user: 제주도 안의 관광업종 카드 결제를 지역(시·도심 여부·읍면동), 관광업종, 회원 유형·성별·연령대·거주지별로 묶어 2014년 9월~2015년 8월과 2015년 9월~2016년 8월 두 기간의 이용금액·건수·이용자수를 담은 집계 자료이다. 2016년 개별관광(FIT) 소비패턴 분석 보고서에서 나온 자료로, 분석가가 'FIT가 늘어난 1년 사이 어느 지역·업종에서 어떤 관광객층의 카드 소비가 늘거나 줄었나'를 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 읍면동 이름이나 업종명을 직접 맞춰야만 이어 쓸 수 있다.
limits: 전역 조인 키가 없어 행정코드나 사업자번호로 관광사업 등록 원장 등과 바로 연결되지 않는다. 보고서 기반의 두 기간 비교 집계라 월별 추이나 개별 결제 단위 분석은 할 수 없다. 내부 검토에서 보조 등급·판정 보류(defer)로 분류된 자료이다.
