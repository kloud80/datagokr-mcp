summary_user: 부산광역시 기장군에 관광진흥법에 따라 등록된 여행업체를 업체 한 곳당 한 행으로 담은 등록 현황 파일로, 업종(국내·국내외·종합여행업), 상호, 소재지, 연락처를 제공한다. 관광객이나 주민이 기장군에서 이용하려는 여행사가 정식 등록 업체인지 확인하거나, 분석가가 읍면별 여행업 분포를 살펴볼 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 관광사업 등록 데이터와는 상호명·소재지 주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 등록번호나 사업자번호 같은 공통 키가 없어 다른 데이터와 정확히 1:1로 연결하기 어렵다. 범위는 기장군 한 곳에 한정되며, 소재지는 주소 수준이라 좌표가 필요하면 별도 변환이 필요하다.
