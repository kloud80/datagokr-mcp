description_portal: '한국문화진흥주식회사 뉴서울 컨트리 클럽의 골프장 예술코스현황(홀, 미터, 핸디캡, 파)에 대한 데이터 제공 합니다.우아한 풍광과 섬세함을 갖춘 예술코스는 총 연장 6,221m 파72의 아기자기한 예술코스는 섬세한 기량이 요구되는 가운데 골프의 묘미를 만끽할 수 있도록 설계되어 있습니다.완만한 슬로프와 우아한 풍광으로 안정감속에서 플레이를 만끽할 수 있으며 챔피언 티를 쓰면 난이도가 높은 코스입니다.TEE-SHOT : 내리막 지형의 우측 도그렉 홀로써 오른쪽 OB를 피해 안전하게 페어웨이 중앙이나 중앙보다 약간 왼쪽으로 공략하는 것이 중요합니다.으로 공략하기 보다는 우측으로 공략하는 것이 안전하게 공략하는 방법입니다.2ND-SHOT : 세컨샷 위치에서부터는 홀 왼쪽이 특히 넓어지므로 우그린 사용시에도 중앙보다 좌측으로 공략하는 것이 유리합니다.3ND-SHOT : 그린 좌우에 벙커에 주의하여 핀을 바로보고 공략하여도 무방합니다.GREEN : 뒤쪽으로 완만한 오르막의 무난한 그린입니다.'
