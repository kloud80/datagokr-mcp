description_portal: 서울시 종로구 관광데이터 정보(한국어)는 종로구 내 주요 관광지, 문화시설, 명소, 편의시설 등에 대한 위치와 상세 설명을 제공하는 관광 정보 데이터입니다. 이 데이터는 키, 분류, 명칭, 주소, 행정 시·구·동, 전화번호, 홈페이지주소, HTML사용여부, 상세내용, X좌표, Y좌표로 구성되어 있습니다. 키는 각 관광지 정보를 식별하기 위한 고유번호입니다. 분류는 관광지 유형이나 시설 성격을 구분하는 항목으로, 예를 들어 문화유산, 박물관, 공원, 체험시설 등의 분류가 될 수 있습니다. 명칭은 관광지 또는 시설의 한국어 이름을 의미하며, 주소와 함께 실제 방문을 위한 기본 정보를 제공합니다. 행정 시, 행정 구, 행정 동 항목은 해당 관광지가 속한 행정구역을 단계별로 나타내어 공간분석 및 행정업무에 활용될 수 있습니다. 전화번호는 문의, 예약, 이용 안내 등을 위한 연락처 정보입니다. 홈페이지주소는 보다 자세한 소개, 이용시간, 예약 방법 등을 확인할 수 있는 웹페이지 링크를 의미합니다. HTML사용여부는 콘텐츠가 웹에서 HTML 형식으로 제공되는지 여부를 나타내는 기술적 항목입니다. 상세내용은 관광지의 특징, 역사, 이용 정보, 주요 볼거리 등을 설명하는 핵심 텍스트 정보입니다. X좌표와 Y좌표는 WGS84 좌표계 기준의 위도·경도 값으로, 지도 서비스나 내비게이션, 관광앱에서 위치를 정확히 표출하는 데 활용될 수 있는 공간정보입니다.
