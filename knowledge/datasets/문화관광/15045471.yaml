description_portal: '제주특별자치도 민속자연사박물관에서 소장하고 있는 자연사자료(동물) 데이터를 제공합니다.항목: 분류, 속명, 종명, 수량, 수집방법, 현위치 등*민속자연사박물관은 자연을 존중하고 사람의 숨결을 간직한 제주의 대표 박물관입니다. 자연사전시실: 크게 지질관, 육상생태관으로 구분하여 제주도의 지질자료와 동식물 표본자료 등을 전시하고 있습니다.육상생태관은 제주의 다양한 지형 속 분포하고 있는 식생자원을 소개하는 곳입니다. 곶자왈, 해안습지대, 상록수림대, 낙엽수림대, 침엽수림대, 관목림대(백록담 일대) 속 주요 동식물의 생태적 습성과 서식환경을 현장감 있게 전시하고 있습니다. 이외에 버섯, 곤충(수서곤충), 야생동물과 공존을 주제로 각종 표본자료를 소개하고 있습니다.자세한 사항은 제주특별자치도 민속자연사박물관 홈페이지에서 확인하시기 바랍니다.https://www.jeju.go.kr/museum/relicinfo/antiquities.htm'
