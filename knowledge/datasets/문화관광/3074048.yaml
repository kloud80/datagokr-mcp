summary_user: 한국지역난방공사 디지털도서관이 보유한 도서를 한 권(등록번호)씩 담은 목록 파일로, 자료명·저자명·발행처·발행년도·청구기호가 들어 있으며 CSV 약 35만 바이트 규모다. 도서관 담당자나 분석가가 '이 기관 도서관은 어떤 분야·연도의 책을 많이 갖고 있고 어디가 부족한가'처럼 장서 구성을 평가하거나 신규 도입 도서를 정할 때 쓴다. ISBN이나 도서관코드 같은 전역 조인 키가 없어 다른 도서관 목록·서지 데이터와는 자료명·저자명 문자열 매칭으로만 이어 붙일 수 있다.
