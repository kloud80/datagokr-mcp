summary_user: 서귀포시가 직접 관리하는 관광지 6곳(천지연폭포, 정방폭포, 중문대포 주상절리대, 천제연폭포, 산방산·용머리, 감귤박물관)의 관람객 수를 기준연월별로 집계한 통계 파일이며, 시설별 값이 열로 나뉘어 있습니다. 관광 분석가나 지역 기획자가 '서귀포 직영 관광지 중 어느 곳의 방문객이 어느 달에 가장 많은가' 같은 월별 추이·시설 간 비교 질문에 쓴다. 실측 컬럼에 전역 조인 키가 없어 TourAPI 관광지 목록 등 다른 데이터와는 관광지 이름을 맞춰 붙이거나 기준연월로 다른 월별 관광 통계와 나란히 놓는 방식으로만 이어 쓴다.
description_portal: 제주특별자치도 서귀포시에서 제공하는 ‘직영관광지 관람객현황’ 데이터는 서귀포시가 직접 관리하는 주요 관광지(천지연폭포, 정방폭포, 주상절리대, 천제연폭포, 산방산, 감귤박물관)의  월별 관람객 수를 집계한 공공 통계 자료입니다.각 시설 별 월별 방문객 수는 시간대별·연도별 흐름을 분석할 수 있는 기반이 되어 관광 수요 추이 분석, 사용자 유형별 방문 패턴 파악, 인기 관광지 순위 비교 등에 활용될 수 있습니다.이 자료는 행정기관, 관광 관련 연구자, 지역 개발 기획자 등이 관광객 동향 예측, 인프라 투자 우선순위 설정, 문화관광 정책 수립 기준 정보로 활용하기에 적합합니다.
