summary_user: 고양도시관리공사가 운영하는 고양체육관, 고양어울림누리, 고양백석체육센터 등 체육문화시설의 대관 정보를 시설별 한 행으로 담은 약 9.6KB 크기의 CSV 파일입니다. 제목은 강좌(강습) 정보이지만, 실제 컬럼은 대관 시설명, 시설 세부사항, 수용인원, 대관료 여부와 세부사항, 대관가능일, 신청방법, 담당 부서명입니다. 고양시 시민이나 단체가 '몇 명이 들어가는 시설을 언제, 얼마에, 어떻게 빌릴 수 있나'를 확인하는 데 쓰며, 전역 조인 키가 없어 다른 데이터와는 시설명이나 같은 기관 기준으로만 이어 쓸 수 있습니다.
description_portal: 고양도시관리공사 체육문화시설의  대관 시설명, 시설 세부사항, 수용인원, 대관료 여부 및 세부사항, 대관가능일, 대관 신청방법 및 세부사항, 관리부서 명에 대한 현황. 고양도시관리공사에서 운영하는 고양체육관, 고양어울림누리, 고양백석체육센터, 고양문화의집, 고양국민체육센터 등 주요시설의 정보를 제공하고 있습니다. 공공시설로써 일반시민들이 자유롭게 이용할 수 있으며 유무료 운영시설의 정보를 제공하고 있습니다. 시민들의 시설을 편리하게 이용하기 위한 정보를 개방공개함으로써 알권리충족 및 유익한 자료의 제공을 목적으로 합니다.
