summary_user: 서울시 관할 관광숙박업(호텔·호스텔·한옥체험업 등) 사업장별 인허가 정보를 건별로 담으며, 인허가·취소 일자, 영업상태, 지번·도로명 주소, 좌표, 층수·객실 수 같은 업소 속성이 함께 들어 있다. 분석가나 정책 담당자가 '자치구별로 현재 영업 중인 관광숙박업소와 객실 공급은 어느 정도인가' 같은 질문에 쓴다. 실측 컬럼에는 다른 데이터와 바로 붙일 공통 조인 키가 없어서, 관리번호(MGTNO)·개방자치단체코드 같은 같은 기관 체계의 코드나 사업장명·주소 매칭으로 상권·관광 수요 데이터와 연결한다.
description_portal: 'ㅇ 데이터 개요: 「서울시 관광숙박업 인허가 정보」는 서울시 관할 내 관광객 대상 숙박시설의 인허가 행정 정보를 통합한 자료입니다. 허가, 신고, 변경, 취소 등 행정 처리 단계와 업소의 기본 속성을 함께 제공하여 시설 분포와 행정 상태를 종합적으로 파악할 수 있습니다.ㅇ 범위 및 대상: 호텔, 호스텔, 한옥체험업, 생활형숙박업 등 다양한 유형의 관광숙박업을 포함하며, 자치구 전역의 사업장을 포괄합니다.ㅇ 주요 항목: 사업장명, 업종유형, 소재지 주소, 인허가 구분과 상태, 담당 기관, 행정구역 구분, 위치 정보, 영업 상태, 변경 사유 등 분석과 행정 활용에 필요한 기본 필드를 갖추고 있습니다.ㅇ 활용 목적: 숙박 공급 현황 파악, 관광정책 수립의 기초자료, 안전·위생 점검 우선순위 설정, 대형 행사 대비 수용력 분석, 민원 대응 및 불법 영업 모니터링 등 행정과 정책 전반에 활용할 수 있습니다.ㅇ 데이터 품질: 주소 표준화, 시설명 표기 통일, 중복 레코드 정리, 휴·폐업 이력 반영 등 정제 기준을 적용할수록 신뢰성과 재현성이 높아집니다.ㅇ 유의사항: 개인정보는 비식별 처리 원칙을 따르며, 위치 정보는 주소 정합도와 좌표 변환 과정에 따른 오차 가능성이 있어 현장 확인과 병행하시는 것이 바람직합니다.ㅇ 연계 활용: 관광지 이용 현황, 교통 접근성, 숙박 수요 지표, 지역 상권 데이터와 연계하면 체류 패턴 분석과 지역별 맞춤형 정책 설계가 정교해집니다.'
