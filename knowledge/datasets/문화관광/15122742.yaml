summary_user: 수원월드컵경기장 한 곳의 전기·가스·수도 사용량을 연도(yr)와 월 구분(div_nm)별로 집계한 시계열 데이터다. 경기장 운영 담당자나 공공시설 에너지 분석가가 '수원월드컵경기장의 여름철 전기 사용이 해마다 늘었는가, 절감 정책 뒤 가스·수도 사용이 줄었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 연도·월이나 시설명을 맞춰 붙이거나 같은 경기도 기관 데이터끼리만 연결한다.
description_portal: 이 데이터는 경기도 수원월드컵경기장의 에너지 사용량 현황을 담고 있으며, 연도와 월별 구분을 기준으로 전기 사용 비용(원/kWh), 가스 사용량(m³/일), 수도 사용량(m³/일) 등의 정보를 제공합니다. 이를 통해 경기장 운영 과정에서 소모되는 주요 에너지 자원을 체계적으로 관리할 수 있으며, 연도별·월별 변화 추이를 비교하여 에너지 효율성을 분석하거나 절감 정책의 효과를 평가하는 데 활용할 수 있습니다. 특히 전기, 가스, 수도의 사용량이 함께 기록되어 있어 시설 운영에서 발생하는 에너지 소비 구조를 종합적으로 파악할 수 있으며, 이를 기반으로 친환경 운영 방안 및 에너지 절약 전략 수립에도 기초자료로 활용할 수 있습니다.
