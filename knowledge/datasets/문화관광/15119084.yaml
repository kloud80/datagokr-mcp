description_portal: 경기도 수원시 공공한옥의 이용자수 현황으로 해당연도, 해당분기, 공공한옥명, 방문자수, 체험자수 등에 대한 데이터를 포함합니다. 수원시에는 화홍사랑채, 식생활체험관, 예절교육관, 한옥기술전시관, 화서사랑채 등이 있으며, 도로명주소 및 지번주소, 위도 경도 데이터가 있습니다. 또한 공공한옥의 방문자 및 체험자 수가 분기별로 등록되어 있습니다. 각 공공한옥 시설 방문자를 참고하시어 시설의 개선 또는 프로그램의 다양성을 계획하는데 활용할 수 있습니다.  한옥건물로 전통 미관이 유지된 곳이고 방문객이 직접 체험할 수 있는 다양한 프로그램이 있습니다.
