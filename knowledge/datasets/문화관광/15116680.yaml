summary_user: 구로구의 외국인관광도시민박업소 인허가 내역을 업소 한 곳당 한 행으로 담는 건별 원천 데이터로, 인허가일·취소일, 영업상태와 폐업일, 지번·도로명 주소, 좌표, 객실 수(STROOMCNT), 건물 층수 등을 포함하며 범위는 구로구 한 개 시군구다. 구청 관광·주거 담당자나 연구자가 '구로구에서 지금 영업 중인 외국인 대상 도시민박은 어느 동네에 몇 곳이고 객실은 몇 개인가'를 파악하거나 단기 임대 관리 대상을 추리는 데 쓴다. 다른 데이터와 공통으로 맞출 조인 키는 실측에서 확인되지 않아, 주소·업소명 매칭이나 같은 기관 코드(OPNSFTEAMCODE)로만 연결하고 좌표(X, Y)는 지도 위 위치 중첩에 쓴다.
description_portal: 외국인관광도시민박업 인허가 정보는 구로구에서 외국인 관광객을 대상으로 주거지(주택·다세대 등)를 활용해 숙박을 제공하는 도시민박업소의 인허가 내역을 관리하는 데이터이다. 인허가일자, 영업상태명, 관리번호, 소재지주소, 객실수 등 정보를 통해, 외국인 친화 숙박 인프라가 어느 지역에 얼마나 분포하는지 파악할 수 있다. 이 업종은 지역 주민의 주거공간과 관광 수요가 직접 만나는 지점이므로, 생활권 관광정책, 골목상권 활성화, 지역 이미지·브랜딩 정책과 밀접하게 연관된다. 또한 주민·관광객 간 갈등 예방, 안전·소방·위생 관리, 단기 임대 규제 설계에도 중요한 기초자료로 활용된다.
