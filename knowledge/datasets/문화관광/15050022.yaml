description_portal: 이 데이터는 전북특별자치도 음식문화플라자에서 제공하는 향토 대표 음식, 전주비빔밥에 대한 상세 정보입니다. 고슬고슬한 밥 위에 쇠고기, 형형색색의 나물, 황포묵 등 다채로운 재료를 얹고 고추장과 참기름으로 맛을 낸 대한민국 대표 음식의 특징을 자세히 소개합니다. 궁중음식에서 유래했다는 설부터 동학농민혁명 당시의 야전 음식이었다는 설까지, 비빔밥에 얽힌 흥미로운 음식 이야기와 함께 김년임 솜씨보유자의 정보, 1인분 기준 599kcal라는 구체적인 열량, 그리고 상세한 재료 목록까지 포함하고 있어 음식에 대한 깊이 있는 정보를 제공합니다.
