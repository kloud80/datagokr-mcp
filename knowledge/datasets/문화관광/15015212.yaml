summary_user: 올림픽공원 시설에서 열린 행사의 대관 정보를 행사 건별로 담으며, 행사명·행사기간·장소를 제공하고 포털 설명상 2013년부터 2025년 기준 717건을 수록한다. 공연 기획사나 관람객이 '올림픽공원 어느 공연장에서 언제 어떤 콘서트·뮤지컬·페스티벌이 열렸는가'를 확인하거나, 분석가가 시설별 대관 이력과 행사 유형을 살펴보는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 행사명·장소 이름 매핑이나 같은 기관(한국체육산업개발) 데이터로만 이어 쓴다.
description_portal: 올림픽공원 시설 대관 정보 제공행사명, 행사기간, 장소에 대한 정보 제공2025년기준 717건 정보를 제공하고 있으며, 2013년부터 정보입니다.지선 단독콘서트, 놀이뮤지컬, 청춘페스티벌, 정동원 전국투어 콘서트. 서울 재즈 페스티벌, 민트 라이프, 이승윤 콘서트, 헬로카봇 뮤지컬 등 다양한 대관정보를 제공중에 있습니다.https://www.ksponco.or.kr/olympicpark/eventInfo/eventInfoList?mid=a20301010100
