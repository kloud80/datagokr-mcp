description_portal: '본 데이터는 서울특별시 중구 관내에서 음반·음악·영상물제작업에 대한 인허가 정보를 포함하는 자료입니다. 수록 항목으로는 사업자명, 소재지, 대표자, 업종구분, 인허가일자, 허가상태, 담당부서 등이 있으며, 콘텐츠 제작 관련 사업체의 법적 운영 현황을 파악하는 데 활용됩니다. 해당 정보는 「음반·비디오물 및 게임물에 관한 법률」에 의거하여 관련 기관의 허가 절차를 거친 업체를 대상으로 하며, 문화콘텐츠 산업 지원 및 정책 수립의 기초자료로 제공됩니다. 일반 시민은 물론, 산업 관계자 및 투자자는 등록업체의 현황을 확인함으로써 사업 파악과 협업 기반을 마련할 수 있습니다. 또한 창작자 및 콘텐츠 기획자는 지역 기반 제작업 인프라 분석 및 이용에 본 데이터를 참조할 수 있습니다* 좌표안내 : 중부원점TM(EPSG:2097) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는 제공하고 있지 않음* 본 데이터는 3일전 자료를 제공합니다.'
