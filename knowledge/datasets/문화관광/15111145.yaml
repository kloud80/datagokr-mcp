summary_user: 한국언론진흥재단 뉴스 빅데이터(빅카인즈)에서 뽑은 MZ세대 관련 기사를 기사 한 건당 한 행으로 담은 메타데이터 파일(csv, 약 33MB)로, 일자·언론사·제목·통합분류·키워드·가중치순 특성어 등이 들어 있다. 연구자나 마케터가 'MZ세대 소비·노동·세대갈등 보도가 언제, 어느 언론사에서, 어떤 키워드로 늘었나'를 살펴보는 데 쓴다. 실측 컬럼에 다른 데이터와 맞물리는 공통 조인 키는 없어서, 일자나 언론사명, 키워드 같은 이름 기준으로만 다른 빅카인즈 주제별 뉴스 메타데이터와 함께 쓴다.
description_portal: 이 데이터는 한국언론진흥재단이 운영하는 뉴스데이터베이스 BIGKinds를 기반으로 수집·분석된 MZ세대 관련 뉴스 메타정보 자료입니다. MZ세대는 1980년대 초~2000년대 초반 출생한 밀레니얼 세대와 Z세대를 통칭하며, 디지털 환경에 익숙하고 개인의 가치·경험을 중시하는 특징을 가지고 있습니다. 본 자료에는 기사별 주소, 일자, 언론사, 기고자, 제목, 통합분류(1~3단계), 사건/사고, 개체명(인물·지역·기업), 키워드, 특성추출, 본문, 원본주소 등이 포함되어 있어 MZ세대와 관련된 다양한 담론을 심층적으로 분석할 수 있습니다. 이를 통해 MZ세대의 소비 성향, 정치적 참여, 노동시장 태도, 문화적 영향력, 세대 갈등 및 사회적 담론이 언론 보도 속에서 어떻게 다뤄졌는지를 객관적으로 확인할 수 있습니다. 또한 학술 연구, 정책 수립, 마케팅 전략, 언론 분석, 교육 현장에서 활용 가능한 기초 자료로, 변화하는 사회 구조와 미래 세대를 이해하는 데 중요한 참고 자료가 됩니다.
