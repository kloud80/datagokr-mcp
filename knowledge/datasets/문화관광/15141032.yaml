summary_user: 서울특별시 마포구에 등록된 관광공연장업 업소를 한 건씩 담은 인허가 원천 목록으로, 인허가일자·영업상태·폐업일자·주소·좌표와 무대면적·객석 수 같은 시설 정보를 포함한다. 마포구에서 지금 영업 중인 관광공연장이 어디에 있고 규모가 어느 정도인지 확인하려는 주민·사업자·문화관광 분석가가 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 KOPIS 공연장ID와는 직접 연결되지 않고, 사업장명·주소로 매칭하거나 같은 기관의 코드(개방자치단체코드)로만 다른 인허가 데이터와 이어 쓴다.
description_portal: 서울특별시 마포구에 등록된 관광공연장업 인허가 정보에 대한 설명입니다. 이 데이터에는 각 관광공연장의 개방자치단체코드, 관리번호, 인허가일자, 영업상태코드, 영업상태명, 상세영업상태코드, 상세영업상태명, 폐업일자, 전화번호, 소재지우편번호, 지번주소 및 도로명주소, 도로명우편번호, 사업장명, 최종수정일자, 데이터갱신일자, X좌표 및 Y좌표, 그리고 이 업소를 관리하는 부서나 기관의 정보도 함께 제공됩니다. 이 데이터를 통해 주민들과 행정기관은 관내 관광공연장의 위치와 운영 현황을 쉽게 파악하고, 문화 관광 정책 수립 및 지원을 효율적으로 수행할 수 있습니다.
