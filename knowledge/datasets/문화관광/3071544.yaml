summary_user: 대구광역시 달서구에 있는 음식점을 업소 한 곳당 한 행으로 담은 파일로, 업종명·업소명·도로명·지번 주소·전화·식단·행정동명과 위도·경도 좌표를 포함한다. 달서구에서 행정동별로 한식·중식 등 어떤 업종의 음식점이 얼마나 모여 있는지 보려는 창업자나 상권 분석가가 쓴다. 전역 조인 키는 없어서, 다른 데이터와는 주소·행정동명 같은 이름 매핑이나 좌표로 이어 쓴다.
description_portal: 대구광역시 달서구에 위치한 음식점 현황에 대해 정리한 자료를 파일데이터로 공공데이터포털을 통해 제공합니다.아래 컬럼을 참고하시면 됩니다.위도, 경도, 번호, 구분, 업종명, 업소명, 소재지(도로명), 소재지(지번), 소재지전화, 식단, 행정동명, 주관부서, 기준일자 등으로 구성되어있으며 1년마다 주기에 따라 최신 정보를 반영하여 제공합니다.일반음식점, 기타요식점, 한식, 축산물, 중식 등의 업종를 확인 가능하며 식품위생 관리, 지역 상권 분석, 자영업 정책 수립, 외식업 트렌드 분석, 시민 편의 서비스  등 다양한 면으로 활용될 수 있습니다.
