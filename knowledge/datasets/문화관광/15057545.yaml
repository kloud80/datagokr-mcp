summary_user: 경기도 공공체육시설 가운데 양궁장을 시설 한 곳당 한 행으로 담은 현황 데이터로, 집계연도·시군·시설명과 함께 소유·관리·운영 주체, 준공연도, 건설사업비, 부지·건축·연면적, 주사대 수·면적·바닥재, 관람석·수용인원, 주소와 위경도를 포함한다. 생활체육 이용자나 지자체·체육 분석가가 '우리 시군에 양궁장이 있는지, 규모와 관람석은 어느 정도인지'를 확인하거나 시군별 양궁 인프라를 비교할 때 쓴다. 전역 조인 키는 없어서 시군 코드(SIGUN_CD)나 시군명으로 같은 기관의 다른 체육시설 현황과 연결하고, 주소와 위경도 필드는 지도 위 시설 위치 결합에 쓴다.
description_portal: 경기도 공공체육시설중 양궁장 시설 현황입니다. 시설명, 수용인원수, 건축면적, 주사대면적 등의 정보를 제공합니다.이 데이터는 전국 공공체육시설 중 양궁장에 대한 시설 현황을 제공하며, 각 시설의 기본 정보 및 관리체계, 운영조직, 시설 구성, 건설 및 면적 정보 등을 포함하고 있습니다. 주요 항목으로는 집계년도, 시군명, 시설명, 소유기관명, 준공연도, 관리주체명, 운영조직명, 주사대바닥재료명, 주사대면적, 주사대수, 사대수, 관람석수, 전광판수, 조명타워수, 건설사업비, 연면적, 부지면적, 건축면적 등이 있으며, 위치 정보로는 소재지지번주소, 소재지도로명주소, 위도(WGS84), 경도(WGS84)가 포함됩니다. 이 데이터를 통해 각 지방자치단체가 보유한 양궁장의 규모와 상태를 비교·분석할 수 있으며, 지역 간 체육 인프라 분포를 파악하거나 향후 시설 확충 및 개선 계획 수립에 활용될 수 있습니다. 또한, 체육 관련 연구, 시설 운영 계획 수립, 대국민 정보 제공 등 다양한 목적의 정책 자료로도 사용이 가능합니다.
