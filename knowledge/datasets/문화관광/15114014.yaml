description_portal: 국민 건강증진과 삶의 질 향상에 대한 사회적 관심 확산, 고령화 사회 진입에 따른 시민 건강관리 필요성 증대, 생활체육 참여를 통한 지역공동체 활성화 요구에 따라 보령시는 시민들의 다양한 체육활동 참여 기회 확대와 건강한 여가문화 조성을 위해 체계적인 생활체육프로그램을 운영하고 있습니다. 이를 통해 시민들의 신체적 건강 증진과 정신적 웰빙 향상, 지역사회 유대감 강화에 기여하고자 합니다. 보령시에서 운영하는 각종 생활체육 교실의 운영현황, 참여방법, 시설정보 등을 포함한 종합적인 프로그램 정보를 제공하고 있습니다.개방 데이터는 보령시 관내 생활체육프로그램 3개 교실, 13개 종목의 상세정보로 교실명, 종목, 장소, 운영기간, 요일, 운영시작시간, 운영종료시간, 1회 참여인원, 연 인원, 운영자, 연락처 등 총 11개 항목 13건의 정보를 제공합니다.시민들은 관심 종목과 편리한 시간대의 체육프로그램 선택과 참여신청에 활용하고, 체육지도자는 프로그램 기획과 운영방안 벤치마킹에 활용하며, 보건의료기관은 지역사회 건강증진 정책 수립과 예방의학 프로그램 연계에 활용할 수 있습니다. 또한 연구기관은 생활체육 참여 실태 분석과 체육정책 효과성 연구에 기여할 수 있습니다.
