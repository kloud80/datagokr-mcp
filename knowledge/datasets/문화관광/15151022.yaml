description_portal: '한국영상자료원이 보유 및 보존 중인 사진 필름 자료에 대한 상세 정보 데이터입니다.사진 필름은 네거티브 필름, 슬라이드 필름 두 유형으로 구분되며 각각 여러 규격으로 존재합니다.이 데이터는 자료구분, 세부구분, 자료번호, 제목, 제작년도, 제작자, 색채, 내용상세구분, 매체, 소장처, 관련영화인및코드 컬럼으로 구성되어있습니다.이 중 세부구분, 색채, 내용상세구분 등의 컬럼은 코드로 존재하는 값을 텍스트로 변환한 것으로 각각 아래와 같은 입력값을 지닙니다.- 세부구분 : 기타, 사건, 영화, 영화제, 인물, 장소, 행사- 색채 : 컬러, 흑백, 혼합, 미상, 단색- 내용상세구분 : 장면사진, 현장사진, 포스터, 기타- 매체  · 구분 : 네가, 슬라이드  · 규격 : 120, 4x5, 35mm, 규격외관련영화인및코드 컬럼은 영화인명과 영화인코드의 조합으로 이루어져있습니다 (형식 : 성명(코드)).- 영화인코드를 통해 동명이인 구분이 가능합니다.사진 필름 내에 다수의 인물이 포함되어있을 경우 쉼표(,)를 구분자로 사용했습니다.'
