summary_user: 서울 강동구 공원·하천변·산책로 등에 설치된 실외운동기구를 설치장소별로 담은 파일로, 장소명·도로명주소·위도·경도와 기구 종류·수량·관리횟수·고장 기구 수량·관리부서를 담는다. 주민이 '우리 동네 공원에 어떤 운동기구가 있고 고장 난 것은 없는지'를 확인하거나, 구청 담당자가 설치 밀집도와 고장 현황을 보고 유지관리 계획을 세우는 데 쓴다. 전역 조인 키는 없으므로 위도·경도나 도로명주소를 기준으로 다른 공원·체육시설 위치 데이터와 공간·주소 매칭해 이어 쓴다.
description_portal: 서울특별시 강동구 관내 공원, 하천변, 산책로 등에 설치된 무료 실외운동기구 현황을 제공하는 공공데이터입니다. 본 데이터는 주민들이 내 주변 체육시설의 접근성과 활용성을 쉽게 파악할 수 있도록 실외운동기구설치주소, 설치장소(공원명 등), 설치기구종류, 관리횟수, 담당부서 등의 항목으로 구성되어 있습니다.실외운동기구는 남녀노소 누구나 일상생활 속에서 가볍게 체력을 단련하고 건강을 증진할 수 있는 가장 친숙한 생활체육 인프라입니다.이러한 데이터를 통해 주민들은 내 주변에 어떤 운동기구가 있는지 확인하여 일상 속 체육 활동에 쉽게 참여할 수 있으며, 관리주기 및 담당 부서 정보를 통해 시설이 얼마나 안전하고 꾸준하게 관리되고 있는지 확인할 수 있습니다.행정기관은 지역별 실외운동기구 설치 밀집도와 노후도를 분석하여 추가 설치 및 체계적인 유지관리 계획을 수립하는 데 활용할 수 있습니다.
