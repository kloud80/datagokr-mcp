description_portal: 본 데이터는 충청북도 청주시에 위치하고 있는 체육시설에 대한 공공데이터입니다. 본 데이터는 연번, 시설유형, 시설구분, 시설명, 읍면동, 주소지, 관리면적(제곱미터), 데이터 기준일 항목을 포함하여 제공하고 있으므로, 청주시 공공체육시설의 현황의 파악에 용이합니다.시설유형 항목에서는 체육시설과 관련된 경기명(스포츠)을 제공하며, 시설구분 항목에서는 생활체육, 직장체육 및 전문체육 등으로 구분하여 체육시설 활용 대상 데이터를 제공하므로, 공공체육시설을 활용하고자 하시는 분들은 해당 내용을 참고하시기 바랍니다.
