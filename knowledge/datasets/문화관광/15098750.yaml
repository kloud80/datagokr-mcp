summary_user: 충청북도 청주시 안의 공공 체육시설을 시설 한 곳당 한 행으로 담은 파일로, 경기 종목(시설유형), 생활·직장·전문체육 구분, 시설명, 읍면동, 주소, 관리면적(제곱미터)을 담는다. 청주시민이나 생활체육 동호인이 '우리 동네 읍면동에 테니스장이나 수영장 같은 공공 체육시설이 어디 있고 규모가 얼마인가'를 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 읍면동 이름이나 시설명·주소를 문자열로 맞춰 잇거나 같은 청주시 데이터끼리 연결한다.
limits: 시설 코드 같은 공통 키가 없어 문체부 전국체육시설 데이터 등과 정확히 맞추려면 이름·주소 매칭이 필요하다. 시설 현황만 담고 예약·대관 정보는 없으며, 범위는 청주시 한 곳이다.
