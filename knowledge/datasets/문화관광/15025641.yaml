summary_user: 부산광역시 금정구 관내에 등록된 인터넷컴퓨터게임시설제공업(PC방) 업체를 업소 한 곳당 한 행으로 담은 파일로, 상호·우편번호·도로명 소재지·업종명이 들어 있다. 주민이나 창업 예정자가 금정구 안에 PC방이 어디에 몇 곳 있는지, 특정 동네에 경쟁 업소가 있는지 확인하는 데 쓴다. 전역 조인 키는 없어 다른 데이터와는 상호나 도로명 주소를 맞춰 연결하거나 같은 금정구 자료끼리 묶어 쓴다.
description_portal: 게임산업의 기반을 조성하고 게임물의 이용에 관한 사항을 정하여 게임산업의 진흥 및 국민의 건전한 게임문화를 확립함으로써 국민경제의 발전과 국민의 문화적 삶의 질 향상에 이바지함을 목적으로 게임산업진흥에 관한 법률이 제정되었습니다. 게임산업진흥에 관한 법률 제26조(게임제공업 등의 허가 등) 제2항의 규정에 따라 인터넷컴퓨터게임시설제공업을 영위하고자 하는 자는 문화체육관광부령으로 정하는 시설을 갖추어 관한 시군구에 등록하여야 합니다. 또한 등록된 업체는 게임산업진흥에 관한 법률 제28조(게임물 관련사업자의 준수사항) 각 호의 사항을 지키며 영업행위를 하여야 합니다. 게임제공업의 영업질서 확립을 위해 게임산업진흥에 관한 법률 제35조(허가취소 등)에 따른 행정처분 및 제36조(과징금 부과)에 따른 과징금이 부과될 수 있습니다. 해당 정보는 부산광역시 금정구 관내에 소재하는 인터넷 컴퓨터 게임시설 제공업을 하는 업체에 대한 정보로, 인터넷컴퓨터 게임시설제공업을 하는 업체의 상호명, 소재지 등의 정보가 있습니다.
