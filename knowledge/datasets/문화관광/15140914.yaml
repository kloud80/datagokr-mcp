description_portal: 이 데이터는 서울특별시 광진구 관내에서 비디오물제작업 인허가를 받아 운영 중인 업소에 대한 현황 정보를 제공합니다. 비디오물제작업은 영화, 다큐멘터리, 애니메이션, 홍보영상 등 다양한 비디오물을 기획·촬영·편집하거나 복제하여 제작하는 사업체를 포함합니다. 데이터에는 업소명, 소재지, 업종 구분, 인허가일자 등의 항목이 포함되어 있으며, 지역 내 영상 콘텐츠 산업 분포, 미디어 제작 기반 현황 분석, 문화산업 지원 정책 수립 등에 유용하게 활용됩니다. 위치 정보는 중부원점TM(EPSG:2097) 좌표계 기준으로 제공되며, 위도·경도(WGS84)는 포함되어 있지 않아 GIS 연동 시 좌표 변환이 필요합니다. 본 데이터는 3일 전 기준의 최신 자료로 정기적으로 갱신되며, 콘텐츠 제작 관련 행정관리, 창작산업 육성, 업종 분포 모니터링 등에 활용할 수 있는 기초 정보입니다.
