summary_user: 경상북도 청송군 관내에 있는 국가지정유산·도지정유산·향토유산을 유산 한 건당 한 행으로 담은 목록 파일로, 구분·유형, 지정번호, 지정일자, 유산명, 소재지 주소, 소유자를 담는다. 청송 지역을 답사하거나 연구하는 사람이 청송에 어떤 보물·천연기념물·도지정 유산이 어디에 있고 언제 지정됐는지 확인하는 데 쓴다. 실측 컬럼에는 전역 조인 키가 없어서, 국가유산청 자료와는 유산명이나 유형·지정번호를 대조해 연결하고 위치는 소재지 주소를 기준으로 붙인다.
description_portal: 청송군 관내 소재한 국가지정유산(보물, 명승, 천연기념물, 국가민속문화유산, 국가등록문화유산)과 도지정유산(유형문화유산, 무형유산, 민속문화유산, 자연유산, 문화유산자료), 지역의 향토유산 등에 대한 기본적인 정보를 제공하고 이를 통해 국가유산이 우리 삶의 뿌리이자 창의성의 원천이며 인류 모두의 자산임을 인식하고, 국가유산의 가치를 온전하게 지키고 향유하며 창조적으로 계승.발전시켜나감으로써 삶을 풍요롭게 하고 미래 세대에 더욱 가치있게 전해 주는 것으로 전해 주기 위함.* 국가유산의 정의1. “국가유산”이란 인위적이거나 자연적으로 형성된 국가적ㆍ민족적 또는 세계적 유산으로서 역사적ㆍ예술적ㆍ학술적 또는 경관적 가치가 큰 문화유산ㆍ자연유산ㆍ무형유산.2. “문화유산”이란 우리 역사와 전통의 산물로서 문화의 고유성, 겨레의 정체성 및 국민생활의 변화를 나타내는 유형의 문화적 유산.3. “자연유산”이란 동물ㆍ식물ㆍ지형ㆍ지질 등의 자연물 또는 자연환경과의 상호작용으로 조성된 문화적 유산.4. “무형유산”이란 여러 세대에 걸쳐 전승되어, 공동체ㆍ집단과 역사 ㆍ환경의 상호작용으로 끊임없이 재창조된 무형의 문화적 유산.
