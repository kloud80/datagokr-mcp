summary_user: 문화체육관광부 실감형 콘텐츠 인재양성 사업의 교육 프로그램 정보를 담은 1,352바이트짜리 작은 CSV 파일로, 실측 열은 사업명과 2021·2022년 실감콘텐츠 인력양성, 2021·2022년 인공지능 활용 인재양성 네 개 사업으로 구성되어 있다. 예비 창작자나 정책 담당자가 '문체부 실감콘텐츠·AI 인재양성 교육은 어느 기관이 언제 어떤 내용으로 운영했나'를 확인할 때 쓴다. 실측 열에서 전역 조인 키를 찾지 못해 다른 데이터와는 사업명이나 기관명을 직접 맞춰서만 연결할 수 있다.
description_portal: 문화체육관광부가 추진하는 실감형 콘텐츠산업 육성 및 인재양성 사업의 교육 프로그램 정보를 종합적으로 제공합니다. 사업명, 담당부처, 운영교육기관, 교육제목, 교육내용, 교육일정, 모집기간, 모집인원, 교육장소, 관련 URL 등 다양한 항목을 포함하고 있어 실감형 콘텐츠 분야에 관심 있는 예비 창작자와 교육기관, 정책 담당자들이 교육 기회 탐색 및 사업 현황 파악에 활용할 수 있습니다. 또한, 실감형 콘텐츠 산업의 인재 발굴과 역량 강화, 관련 산업 발전을 위한 정책 수립, 교육 프로그램 기획 등 다양한 목적으로 활용이 가능합니다.
