description_portal: '- 제주관광공사에서 운영하는 제주관광정보플랫폼 비짓제주의 검색어트랜드 키워드 내역입니다.- 해당 데이터는 운영자가 관리자 사이트를 통해 네이버 검색어 트랜드에 활용할 키워드를 추가/수정/삭제를 하면 반영하여 생성합니다.- 개방데이터 항목은 각 어권별 검색 키워드 및 하위주제어, 등록일시 등이며 전체 데이터 수는 5건(데이터 기준일 기준)입니다.- 해당 데이터를 통해 비짓제주 플랫폼 내 검색어 트랜드 키워드 관리 현황 파악, 네이버 검색어 트랜드 기반 관광객 관심사 분석, 맞춤형 관광정보 및 마케팅 전략 수립, 플랫폼 내 검색 및 추천 서비스 개선, 관광 콘텐츠 기획 및 운영 효율성 향상 등 다양한 분야에 활용할 수 있을 것으로 기대됩니다.'
