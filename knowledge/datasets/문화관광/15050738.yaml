summary_user: KTV 국민방송에서 방영된 정책·공공 프로그램의 방송 목록을 회차(콘텐츠) 단위 건별로 담은 CSV 파일(약 47MB)로, 제목·프로그램명·카테고리·방송일시·재생시간·조회수·영상 링크를 포함한다. 공공 미디어 연구자나 정책 홍보 담당자가 '특정 정책 주제를 다룬 KTV 프로그램이 언제 몇 회 방송됐고 조회수는 어땠는가'를 확인하는 데 쓴다. 다른 데이터와 공통으로 쓰는 전역 조인 키는 없으며, 파일 안에서 프로그램아이디·카테고리아이디로 묶어 집계하거나 프로그램명 같은 이름 매칭으로만 외부 자료와 연결한다.
description_portal: KTV 국민방송에서 방영된 정책공공 프로그램의 방송 목록을 체계적으로 정리한 데이터셋입니다. 콘텐츠아이디, 제목, 프로그램명, 카테고리, 전체영상여부, 섬네일주소, 링크주소, 조회수, 프로그램회차, 방송일, 방송시간, 재생시간, 등록일 등 다양한 정보를 포함하고 있어 정책 관련 공공 프로그램의 방송 이력과 세부 내용을 쉽게 파악할 수 있습니다. 정책 홍보, 공공 미디어 연구, 방송 트렌드 분석, 프로그램 아카이브 구축 등 다양한 목적으로 활용할 수 있으며, 정책 커뮤니케이션 및 공공정보 제공에 관심 있는 분들에게 유익한 자료입니다.
