summary_user: 경기도 내 관광지·관광단지·관광특구를 한 행씩 담은 지정 현황 목록으로, 시군명·관광지 구분·관광지명·지정일·조성계획 최초 승인일·지정 면적·조성계획 면적·운영 주체·주소·위경도를 담는다. 여행자나 지역 분석가가 '우리 시군에 지정된 관광단지는 어디이고 언제 지정됐으며 면적은 얼마인가'를 확인하는 데 쓴다. 전역 조인 키는 없어 시군명이나 관광지명을 다른 자료와 이름으로 맞추고, 정제 주소와 WGS84 위경도(refine_wgs84_lat)로 지도·공간 자료와 위치를 겹쳐 쓴다.
description_portal: '경기도 내 관광지, 관광단지, 관광특구 현황입니다. 관광지구분명, 관광지명, 위치 등의 정보를 제공합니다.-관광지: 자연적 또는 문화적 관광자원을 갖추고 관광객을 위한 기본적인 편의시설을 설치하는 지역-관광단지: 관광객의 다양한 관광 및 휴양을 위하여 각종 관광시설을 종합적으로 개발하는 관광 거점지역-관광특구: 외국인 관광객의 유치 촉진 등을 위하여 관광 활동과 관련된 관계 법령의 적용이 배제되거나 완화되고, 관광 활동과 관련된 서비스,안내체계 및 홍보 등 관광여건을 집중적으로 조성할 필요가 있는 지역'
