summary_user: 경기아트센터 한 기관의 녹색제품 구매 실적을 연도별 한 행으로 담은 집계 자료로, 전체 구매액·녹색제품 구매액·녹색제품 구매 비율(%)을 담는다. 공공기관 친환경 구매 실적을 점검하는 분석가나 도민이 '경기아트센터의 녹색제품 구매 비율이 해마다 늘었는가'를 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 기관의 녹색제품 구매 현황과는 연도(yr)와 기관명을 맞춰 나란히 비교하는 방식으로만 이어 쓴다.
description_portal: '이 데이터는 경기아트센터의 연도별 녹색제품 구매 현황을 정리한 자료로, 기관의 친환경 소비 실천과 지속가능한 경영 방침을 수치로 보여줍니다. 각 연도별로 전체 구매액, 녹색제품 구매액, 그리고 녹색제품이 차지하는 구매 비율(%)이 제공되어 있으며, 이를 통해 특정 연도의 친환경 제품 구매 성과와 추세를 비교할 수 있습니다.※ 녹색제품 : 녹색제품이란 기후위기 대응을 위한 탄소중립ㆍ녹색성장 기본법에 의거하여 제66조에 따른 에너지 · 자원의 투입과 온실가스 및 오염물질의 발생을 최소화하는 제품입니다.'
