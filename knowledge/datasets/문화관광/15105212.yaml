summary_user: 국립한글박물관이 소장한 문헌자료를 한 건씩 담고, 자료명·발행기관·식별번호·크기·시대·물리적 상태·내용 해제(description)를 함께 제공하며 범위는 전국·비공간이다. 한글 연구자나 교육자가 특정 시대의 한글 문헌이 박물관에 어떤 상태로 소장되어 있고 무슨 내용을 담는지 확인할 때 쓴다. 실측 컬럼에 다른 데이터와 공통으로 쓰는 조인 키가 없어, 다른 소장품·아카이브 데이터와는 자료명이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 국립한글박물관에서 소장하고 있는 다양한 문헌자료와 그에 대한 해제 정보를 체계적으로 제공하는 데이터셋입니다. 발행기관, 자원의 명칭, 식별 정보, 크기, 시대, 물리적 상태, 내용 등 주요 컬럼을 통해 각 문헌의 상세한 정보를 확인할 수 있습니다. 연구자, 교육자, 문화 관련 종사자 등은 이 자료를 활용하여 한글과 관련된 역사적 자료를 분석하거나 교육 자료로 활용할 수 있으며, 문화유산의 보존 및 전승에도 기여할 수 있습니다. 또한, 디지털 아카이브 구축이나 문화콘텐츠 개발 등 다양한 분야에서 참고 자료로 활용하기에 적합합니다.
