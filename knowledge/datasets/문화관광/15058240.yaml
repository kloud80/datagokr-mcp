summary_user: 한국체육산업개발주식회사가 올림픽공원을 대상으로 촬영·게시한 사진 정보를 사진 한 건 단위로 담으며, 제목·작성자·등록일·설명·저작권 같은 메타데이터를 제공한다. 공원 행사나 기관 활동(봉사활동, 업무협약, 공원 캠페인 등) 사진 자료를 찾는 기자·연구자·콘텐츠 제작자가 '올림픽공원 관련 공식 사진에 어떤 것이 있고 이용 조건은 어떤가'를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 체육시설 데이터와는 제목·키워드 같은 이름 매칭이나 같은 기관 기준으로만 연결한다.
description_portal: 올림픽공원을 대상으로 촬영한 사진정보 제공wpahr, 사진명,  홈페이지URL 등 정보제공하고 있습니다.한국체육산업개발 홈페이지에 들어오시면 다양한 정보를 확인가능합니다.https://www.ksponco.or.kr/gallery.es?mid=a10303000000&bid=00382025년 6월 기준 159건의 데이터를 제공하고 있으며,농촌일촌돕기 봉사활동, 업무협약 체결, 공원 캠페인 시행, 적극행정 우수사례 경진대회 부서 시상식 등 사진 정보를 제공하고 있습니다.
