summary_user: 인천광역시 미추홀구에 등록된 골프연습장업소를 업소 한 곳당 한 행으로 담은 파일 명부로, 상호명·구분·도로명주소·지번주소·전화번호·위도·경도가 들어 있다. 주민이나 창업자가 '미추홀구 안에서 우리 동네 가까이에 있는 골프연습장은 어디이고 어느 상권에 몰려 있나'를 지도로 확인하거나, 분석가가 체육시설 접근성을 볼 때 쓴다. 전역 조인 키가 없으므로 다른 데이터와는 도로명·지번 주소나 위도·경도 좌표를 기준으로 상권·인구 데이터와 공간 매칭하거나, 상호명으로 체육시설업 인허가 명부(LOCALDATA)와 대조해 이어 쓴다.
limits: 인허가번호나 사업자번호 같은 공통 식별 키가 실측 컬럼에 없어 다른 데이터와는 상호명·주소 매칭으로만 연결되고, 범위는 미추홀구 한 곳에 한정된다. 개업·폐업 일자 컬럼이 없어 이 파일만으로는 개폐업 추이를 볼 수 없다.
