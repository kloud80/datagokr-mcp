summary_user: 문화체육관광부 정책기자마당의 기사·자료를 건별로 담으며, 각 건에 제목, 등록일, 주제분류, 핵심주제어, 내용, 관련장소, 시간적 범위, 언어 같은 메타데이터가 붙는다(범위 전국, 비공간). 연구자나 기자가 '최근 생활체육·문화정책 관련 정책기자 기사가 어떤 주제어로 얼마나 올라왔나'처럼 정책 동향을 등록일과 주제어로 훑는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 데이터와는 주제어·관련장소 같은 이름 매칭이나 같은 기관 자료로만 연결하며, 자료 식별자(uci)도 공통 키로 확인되지 않았다.
description_portal: 문화체육관광부의 정책기자마당은 문화정책포털과 연계하여 다양한 문화정책 관련 정보를 한눈에 확인할 수 있도록 구성되어 있습니다. 자원의 명칭, 등록일, 기관별 주제분류, 핵심주제어, 내용, 관련장소, 시간적 범위, 언어 등 주요 정보를 포함하고 있어 정책 연구, 문화행사 기획, 언론 보도, 학술 분석 등 다양한 분야에서 활용이 가능합니다. 정책기자마당을 통해 최신 문화정책 동향과 관련 자료를 신속하게 파악할 수 있으며, 정책 담당자, 연구자, 일반 국민 모두에게 신뢰할 수 있는 정보를 제공합니다. 문화정책의 투명성과 접근성을 높여 국민의 문화적 참여와 이해 증진에 기여합니다.
