summary_user: 경주시가 운영 현황을 관리하는 한옥형 호텔을 숙소 한 곳당 한 건으로 담은 목록으로, 숙소명·주소·홈페이지·연락처가 들어 있고 범위는 경주시 한 곳입니다. 경주 여행객이나 숙박 플랫폼·관광 앱 개발자가 "경주에서 묵을 수 있는 한옥 호텔은 어디이고 연락처는 무엇인가"를 확인할 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 숙박업 인허가 자료나 관광 콘텐츠와는 숙소명·주소를 맞춰 보는 방식으로만 이어 쓴다.
limits: 공통 식별 코드가 없어 공중위생 숙박업 신고 자료 등과 정확히 일대일로 묶을 수 없고, 이름·주소 매칭에 의존해야 한다. 범위가 경주시뿐이라 다른 시군구 한옥 숙소와 비교하려면 별도 자료가 필요하다.
