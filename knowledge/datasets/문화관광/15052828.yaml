summary_user: 충청북도 단양군에 있는 도지정문화유산을 한 건씩 담은 목록 파일로, 지정번호·명칭·소재지·지정일·분야·종류·동산/부동산 구분·보호구역면적·소유자·관리자를 함께 담는다(csv 약 8KB 규모). 단양군의 도지정 유형문화유산·기념물 등이 어디에 있고 누가 관리하는지 확인하려는 연구자·주민·관광 사업자가 쓴다. 전역 조인 키가 없어 국가유산청 유산 목록 등과는 명칭·지정번호·소재지 주소를 맞춰 이어 써야 한다.
description_portal: 충청북도 단양군 도지정문화유산보유현황 데이터로 연번, 지정번호, 명칭, 보호구역면적, 수량, 소유자, 관리자, 소재지, 지정일, 분야, 종류, 동산/부동산, 데이터기준일자 등 항목으로 구성되어 있으며, 학계 또는 연구기관에서는 이 자료를 활용하여 단양군 도지정문화유산보유 현황 파악, 분석 및 연구자료로 매우 유용하게 활용될 수 있습니다. 데이터기준일자는 2025년 9월 9일입니다. 담당부서는 단양군 행정복지국 문화예술과이며 문의주시면 최신의 충청북도 단양군  도지정문화유산보유 현황을 열람하실 수 있게 도와드립니다.
