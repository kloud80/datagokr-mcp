description_portal: 무안군 관내에서 개최된 주요 축제의 연도별 방문 현황을 제공하는 파일데이터입니다. 축제명, 개최년도, 방문자수(전체, 일평균), 시작일, 종료일, 방문자 1인당 평균지출액, 프로그램 개수 등 기본 속성을 포함하여 축제별 규모와 운영 특성을 한눈에 파악할 수 있습니다. 자료는 축제 성과 모니터링, 관광 및 문화정책 수립, 연구·분석, 대시보드 시각화 등에 활용 가능하며, 축제 간, 연도 간 비교에 적합하도록 표준화된 형식으로 제공됩니다. 공간범위는 무안군 전역이며, 시간범위는 최초 수록연도부터 최신연도까지입니다. 일부 값은 현장 상황에 따라 변동될 수 있습니다.
