summary_user: 작은도서관 정보누리 시스템에 가입한 전국 작은도서관들이 소장한 자료(단행본·연속간행물)를 소장 건별로 담은 파일로, 도서관명·제목·저자·발행자·발행년·페이지·가격·ISBN·분류기호를 담는다. 주민이나 독서 프로그램 담당자가 '우리 동네 작은도서관 중 어디에 이 책이 있나'를 찾거나, 분석가가 작은도서관별 장서 구성(분류별·발행년별)을 비교하는 데 쓴다. 실측 컬럼에 전역 조인 키는 없어서 도서관명을 이름 매칭해 도서관 목록과 잇고, 책고유번호(ISBN)로 국가서지·도서관정보나루의 도서 정보와 맞춰 쓴다.
description_portal: '작은도서관 정보누리는 작은도서관의 정보화 운영 환경을 위해 국립중앙도서관이 개발 보급하여 운영 중인 도서정보시스템입니다. 해당 목록은 작은도서관 정보누리 시스템에 가입한 참여 도서관들이 소장 중인 자료(단행, 연속) 정보를 제공하며, 작은도서관 홈페이지의 자료 검색 서비스를 통해서도 확인하실 수 있습니다. 이 데이터는 작은도서관명, 소장자료의 제목, 저자, 발행자, 발행연도, 총 페이지 수, 국제표준도서번호(International Standard Book Number : ISBN) 등의 정보로 구성되어 있습니다.'
