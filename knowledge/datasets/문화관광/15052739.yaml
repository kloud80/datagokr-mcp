description_portal: 본 데이터는 **한국영상자료원이 보유·관리하고 있는 디지털 시네마 파일(Digital Cinema File)**의 최신 목록 정보를 수록한 자료로, 2026년 8월 7일 기준의 현황을 반영하고 있습니다. 디지털 시네마 파일은 필름 영화를 디지털화한 보존본 또는 디지털로 직접 제작·입수된 영상 파일을 포함하며, 자료원의 핵심적인 디지털 아카이브 자산 중 하나입니다.데이터에는 **자료구분, 세부구분, 자료번호, 제목(영화명), 영화제작년도, 감독, 제작사, 제작국가, 파일 종류/매체, 해상도, 상영시간(분), 관람기준** 등 주요 서지 및 기술적 메타데이터 항목이 포함되어 있습니다. 이를 통해 각 작품의 기본적인 식별 정보는 물론, 디지털 파일의 보존 포맷 및 기술적 특성까지 확인할 수 있습니다.
