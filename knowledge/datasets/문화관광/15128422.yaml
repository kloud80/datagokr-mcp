summary_user: 광주 남구의 신고 체육시설업(수영장·체육도장·골프연습장·체력단련장·당구장 등)을 업소 한 건씩 업종·상호·도로명주소·전화번호로 담은 CSV 파일이다. 남구에서 헬스장이나 체육도장을 열려는 사업자나 상권 분석가가 동네별 같은 업종 업소가 얼마나 몰려 있는지 확인하는 데 쓴다. 전역 조인 키가 없어 다른 데이터와는 상호·도로명주소를 맞춰 붙이거나 주소를 좌표로 바꿔 상권·인허가 데이터와 겹쳐 본다.
description_portal: '영리를 목적으로 체육시설을 설치 · 경영하거나 체육시설을 이용한 교습행위를 제공하는 업으로서, 수영장업, 체육도장업, 골프연습장업, 체력단련장업 등의 신고 체육시설 현황및 정보를 제공합니다. 해당 데이터는 광주광역시 남구청 교육체육과(☎062-607-2442)에서 제공합니다. 대표 전화번호가 없거나, 개인정보가 포함되어 있는 경우, 연락처를 공란 표기하였으니 참고 부탁드립니다. ※ 체육시설업의 분류는 다음과 같습니다. 등록 체육시설업 : 관할 시·도지사에게 등록해야 함  예시) 골프장업, 스키장업, 자동차경주장업 등 신고 체육시설업 : 관할 시장·군수·구청장에게 신고해야 함  예시) 요트장업, 수영장업, 체육도장업, 골프연습장업, 체력단련장업, 당구장업, 무도학원업, 인공암벽장업 등'
