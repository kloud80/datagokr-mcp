summary_user: 문화역서울284(구 서울역사)에서 열린 전시·공연·행사·공간투어 프로그램을 건별로 담은 파일 데이터로, 프로그램마다 제목·소개내용·시작일·종료일·장소를 담는다. 시민이나 문화 분야 분석가가 '문화역서울284에서 그동안 어떤 전시와 행사가 언제 열렸는가'를 확인하거나 프로그램 이력을 정리하는 데 쓴다. 전역 조인 키가 없어 다른 공연·전시 데이터와는 프로그램 제목·기간 같은 이름 매칭이나 같은 기관 기준으로만 이어 쓴다.
description_portal: 한국공예디자인문화진흥원에서 운영하는 문화역서울284 누리집 프로그램 정보입니다. 문화역서울284에서 진행하는 전시, 공연, 행사, 공간투어 정보를 포함하며  제목, 소개내용, 프로그램시작일, 프로그램종료일, 장소 데이터 항목을 제공합니다. 문화역서울284는 한국 근·현대사의 주요 무대이자 교통과 교류의 관문이었던 구 서울역사의 원형을 복원하여 2011년 복합문화공간으로 개관했습니다. 문화·예술의 창작과 교류가 이루어지는 플랫폼으로서 전시, 공연, 워크숍 등 다채로운 프로그램을 진행하고 있습니다. 문화역서울284 누리집(www.seoul284.org)을 통해 프로그램  상세정보를 조회할 수 있습니다.
