description_portal: 국립국악원에서 서비스하는 국악 디지털 음원 데이터는 대중음악에서 국악의 활용을 촉진하고자 다양한 국악 음원을 디지털 형태로 제공합니다. 이 데이터는 국악의 전통적 가치와 현대적 활용 가능성을 높이며, 음악가, 연구자, 교육자 등 다양한 이용자가 국악 음원을 손쉽게 검색하고 활용할 수 있도록 지원합니다. 국악 음원의 API 서비스로 제공되어 다양한 플랫폼이나 애플리케이션에서 국악 음원을 연동하거나 새로운 콘텐츠를 개발하는 데 활용할 수 있습니다. 전통음악의 보존과 확산, 창작활동 지원 등 다양한 목적에 적합합니다.
