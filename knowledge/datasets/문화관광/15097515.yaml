summary_user: 국립국악원이 제공하는 국악 디지털 음원을 악구 단위로 담은 데이터로, 악곡명·악구명(한글·영어), 장르·악기 코드, 장단·박자·템포, 전통조·서양음악조, 연주자·가창자, 가사, 음원 파일 경로를 건별로 제공한다. 작곡가·음악 제작자나 교육자가 '특정 악기·장단·템포에 맞는 국악 악구 음원을 찾아 곡 제작이나 수업에 쓸 수 있는가' 같은 질문에 쓴다. 실측 컬럼에서 전역 조인 키를 찾지 못했으므로 KOPIS 공연ID 등과 직접 연결되지 않고, 악곡명·장르·악기 같은 이름이나 코드 매핑으로만 다른 국악·공연 데이터와 이어 쓴다.
limits: 공연 목록·공연장·예매 정보가 아니라 음원 자료이므로 공연 수요나 관객 분석에는 쓰지 못하고, 지역 필드가 있으나 공간 단위 분석용이 아닌 전국·비공간 데이터다. 한 번 만들어진 뒤 바뀌지 않는 이벤트형 자료로 분류돼 정기 갱신을 기대하기 어렵다. 호출에는 포털 활용신청(자동승인) 후 serviceKey가 필요하고 개발계정은 하루 10,000회로 제한된다.
