description_portal: '2015~2016년도 시점의 제주특별자치도 성연령별 제주도민 지번(PNU)단위 유동인구 현황입니다.유동인구란 일정 시간 동안 해당 지역을 방문하거나 이동한 사람들의 수를 말합니다. * PNU : 지번코드 (총19자리, 10자리-동리단위법정코드 + 1자리-일반/산 지번구분 + 4자리-본번 + 4자리-부번)* 데이터 구분자 : ""|""* 특이사항1 : 유동인구 추정과정에서 비율을 사용하여 유동인구 수가 소수점으로 표현됨* 특이사항2 : 유동인구는 단위지역에서 이동이 있는 개념으로 인구수와 달리 중복 카운트가 발생함※ 파일 다운로드 시 데이터에 대한 설명 txt 파일이 포함되어 있습니다.'
