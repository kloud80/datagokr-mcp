summary_user: "여성사전시관이 소장한 유물을 한 점씩 담은 건별 목록으로, 소장품번호·소장품명·별칭·시대·내용 설명과 썸네일·사진 이미지 주소를 제공한다. 교사나 콘텐츠 제작자가 '조선시대 여성 생활을 보여주는 유물 사진과 설명을 수업 자료에 쓰고 싶다'처럼 시대별 여성사 유물을 찾아 교육·전시·디지털 아카이브 자료를 만드는 데 쓴다. 실측 컬럼에서 다른 데이터와 맞물리는 전역 조인 키(예: 문화시설 코드)를 찾지 못해, 다른 박물관 소장품 데이터와는 소장품명·시대명 같은 이름 매핑으로만 이어 쓸 수 있다."
description_portal: 여성사전시관 소장품 정보 서비스를 제공하는 오픈API입니다. 해당 개방 데이터를 통해 소장품번호, 소장품명, 소장품별칭명, 시대명, 소장품 내용, 썸네일 URL 주소, 사진URL주소 등의 내용을 확인할 수 있습니다. 유물 전시 기획, 교육자료 제작, 디지털 아카이브 구축 등에 폭넓게 활용될 수 있습니다. 소장품명, 시대명, 사진 URL 등 상세 정보가 포함되어 있어 시각 자료 기반의 역사교육 및 문화콘텐츠 구성에 효과적입니다. 또한 썸네일과 사진 이미지 제공을 통해 전시 콘텐츠의 시각적 품질을 높일 수 있으며, 온라인 박물관 또는 콘텐츠 제작에도 적극 활용될 수 있습니다.
