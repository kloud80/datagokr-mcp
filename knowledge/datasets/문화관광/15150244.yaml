summary_user: 전시회 한 건마다 전시회명, 유형코드, 시작·종료일자, 설명, 주관 기관 아이디, 공개여부·조회수와 등록·수정 이력을 담은 건별 목록 파일로, 범위는 전국이며 위치 정보는 없다(csv 약 7KB). 전시 안내 서비스나 문화관광 플랫폼을 만드는 사업자, 연구자가 '어떤 유형의 전시가 언제부터 언제까지 열리고 어느 기관이 주관하나'를 확인하는 데 쓴다. 전시회아이디(culture_exhibition_id)가 실측 조인 키이고 기관아이디로 주관 기관을 식별하지만, 공연 kopis_id나 문화시설 코드와 바로 이어지는 키는 이 파일에 없다.
description_portal: 전시회정보 데이터는 전시회의 기본 현황과 운영 정보를 체계적으로 제공하는 자료입니다. 전시회명, 유형, 개최 기간, 설명, 주관 기관 등의 항목으로 구성되어 있어 전시의 기본적인 내용을 한눈에 파악할 수 있습니다. 기관은 이 데이터를 활용하여 전시 운영과 홍보를 효율적으로 관리할 수 있으며, 연구자는 전시 동향과 문화적 흐름을 분석하는 기초 자료로 활용할 수 있습니다. 또한 민간 분야에서는 이를 기반으로 전시 안내 서비스, 문화관광 플랫폼, 홍보 콘텐츠 등 다양한 활용이 가능하여, 공공성과 민간 활용도를 동시에 높일 수 있습니다. 데이터 개방을 통해 접근성과 투명성을 강화하고, 새로운 문화 서비스 창출과 산업 발전에 기여할 수 있습니다.
