summary_user: 제주 상가리퐁낭마을길 한 코스의 무장애 관광 안내 자료로, 구분·유형·추천여부·비고 항목으로 주차장·화장실 같은 지점별 편의시설과 접근성 정보를 담는다. 휠체어 이용자나 고령자, 동반 가족이 '상가리퐁낭마을길에 접근 가능한 주차장과 화장실이 있는지'를 여행 전에 확인하는 데 쓴다. 실측 컬럼에 전역 조인 키가 없어, TourAPI 관광지 정보 같은 다른 데이터와는 코스명이나 같은 기관 자료 기준의 이름 매칭으로만 잇는다.
description_portal: '제주특별자치도 내 상가리퐁낭마을길 데이터를 제공합니다.항목: 구분, 유형, 추천여부, 비고 등* 「제주특별자치도_상가리퐁낭마을길_무장애여행관광정보」로, 제주특별자치도 디지털혁신과에서 제공하는 무장애(Barrier-free) 관광 안내자료이다. 상가리퐁낭마을길에 대한 코스의 개요, 주소 및 위치, 주차장 및 화장실 등 편의시설 현황, 운영정보(휴무일, 관람료 등), 그리고 각 포인트(주차장, 화장실 등)의 사진 이미지 자료 등을 포함하고 있다. 특히 교통약자, 장애인, 고령자 등이 사전에 시설의 접근성 및 경로의 상태를 확인하여 보다 안전하고 쾌적한 여행 계획을 세울 수 있도록 설계된 자료이다.* 활용 분야 : 관광 정책 수립 지원, 관광 인프라 개선, 관광 서비스 개발 등'
