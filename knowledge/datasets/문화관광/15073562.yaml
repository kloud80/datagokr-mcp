description_portal: 전북특별자치도 무주군 설천면 무설로 1482에 위치한 태권도원 객실의 종류, 입실가능 인원, 객실 수, 객실 면적 등의 정보를 제공합니다. 태권도 모국의 자부심으로 세워진 태권도원은 올림픽 단일종목으로는 최초로 경기, 체험, 수련, 교육, 연구, 교류 등 태권도에 관련된 모든 것이 가능한 세계 유일의 태권도 전문공간입니다. 또한, 전 세계인이 태권도를 통해 한국을 느끼고 한국의 얼에 감동받을 수 있는 우리 시대의 살아있는 세계문화유산입니다. 세계 태권도인들의 순례와 수련의 새로운 성지 태권도원은 태권도 모국의 자부심에 걸맞은 최대 규모를 자랑하며 새로운 태권도 체험 수련 공간 및 문화교류의 허브로서 태권도 세계화의 중추적 역할을 할 것입니다.
