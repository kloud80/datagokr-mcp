description_portal: 수원시립미술관에서 개최한 전시와 관련된 데이터로 전시명, 전시기간, 전시장소, 전시 이미지(URL)등을 제공하는 데이터입니다. 수원은 수원시립미술관 행궁 본관과 수원시립만석전시관, 수원시립아트스페이스광교, 수원시립북수원전시관이 있습니다. 미술관 연간 전시 정보를 기반으로 연도별/장르별 전시 주제, 작가, 참여 미술관 데이터를 통해 대중의 관심 변화를 분석하고 지역의 정체성, 도시재생과 연계된 문화 공간 분석에 기초 데이터로 활용 할 수 있습니다. 또한 전시흐름, 작가활동, 미술관 네트워크 등을 시각화하여 콘텐츠로 제작도 가능합니다.
