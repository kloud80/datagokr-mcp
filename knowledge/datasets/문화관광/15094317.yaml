summary_user: 국립무형유산원이 펴낸 무형유산 학술보고서를 자료 한 건씩 목록으로 담으며, 자료명과 등록일자로 보이는 값(nihcFdRsDt), 국가유산 디지털 서비스의 해당 자료 페이지로 가는 URL을 준다. 연구자나 교육·전시 기획자가 "특정 무형유산 종목이나 전승·보존 주제를 다룬 국립무형유산원 학술보고서가 있는지, 원문은 어디서 보는지"를 찾을 때 쓴다. 실측 컬럼에 전역 조인 키가 없어 다른 무형유산 데이터(보유자·종목 정보 등)와는 자료명 속 종목 이름을 맞추는 방식으로만 이어 쓸 수 있다.
limits: 보고서 본문이나 초록은 담지 않으며, 내용은 URL로 연결된 원문 페이지에서 따로 확인해야 한다. 조인 키가 없어 종목·보유자 데이터와 정확히 연결되지 않고 이름 매칭에 의존한다. 개발계정 호출은 하루 500회로 제한된다.
