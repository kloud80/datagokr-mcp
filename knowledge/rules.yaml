# 변환 규칙 목록 (KNOWLEDGE-SPEC §9-2). Edge on.transform이 id로 참조한다. 구현은 pds/rules/, 테스트는 tests/test_rules.py.
- id: R-02
  name: 시군구코드 = 법정동코드 앞 5자리
  function: pds.rules.sgg_from_bjd
  keys: [bjd_cd, sgg_cd]
- id: R-07
  name: PNU 조립 — 법정동코드(10) + 대장구분(1 토지·2 임야) + 본번(4) + 부번(4)
  function: pds.rules.pnu_from_parts
  keys: [bjd_cd, pnu]
  note: 실거래(RTMS)는 sggCd+umdCd·landCd·bonbun·bubun을 준다 (R-07-rtms). 2026-09-30 부동산원 단지 식별정보의 필지고유번호와 대조해 검증
- id: R-07-rtms
  name: R-07을 실거래 행에 적용
  function: pds.rules.pnu_from_rtms
  keys: [rtms_apt_seq, pnu]
- id: R-11
  name: 도로명주소 비교 키 — 도로명+건물번호 (시도 표기 개편 무시)
  function: pds.rules.road_key
  keys: [address]
  note: 전남광주통합특별시·강원/전북특별자치도처럼 시도 명칭이 기관마다 달라 시도는 쓰지 않는다
- id: R-12
  name: 좌표(WGS84) → PNU — 브이월드 연속지적도 점 포함 필지
  function: pds.rules.coord_to_pnu
  keys: [coord, pnu]
  note: 외부 호출(브이월드 key). 좌표만 있는 데이터를 필지 축(PNU)에 붙이는 공간 조인
- id: R-13
  name: 주소 → 좌표 — 브이월드 지오코더(도로명 → 지번 순)
  function: pds.rules.address_to_coord
  keys: [address, coord]
  note: 이어서 R-12로 PNU. 주소 표기 품질에 따라 실패율이 있다 (join 프로브로 실측)
- id: R-14
  name: 행정구역 이름 → 코드 (법정동 코드표 이름 매칭)
  function: pds.rules.admin_name_to_code
  keys: [admin_area_code, sgg_cd, bjd_cd]
  note: '중구·동구처럼 여러 시도에 있는 이름은 시도 이름(parent)이 있어야 한다. 모호하면 None'


# ── 느슨한 조인 (정렬 조인, 2026-10-06) — 키가 정확히 같지 않아도 공통 단위로 내린 뒤 집계해서 잇는다.
#    데이터마다 grain(공간·시간·분류 단위)을 실측으로 기록하고, 전략 플래너가 고른 데이터 사이에서 공통 단위를 계산한다.
#    정확한 키 조인(joinable)보다 신뢰도가 낮다 — 결과는 "시군구 × 월" 같은 집계 단위의 비교·상관이지 행 단위 결합이 아니다.
- id: R-20
  name: PNU → 법정동 — 필지고유번호 앞 10자리
  function: pds.rules.admin_rollup
  keys: [pnu, bjd_cd]
- id: R-21
  name: 행정구역 상위 단위 — 법정동(10) → 읍면동(8) → 시군구(5) → 시도(2) 앞자리
  function: pds.rules.admin_rollup
  keys: [bjd_cd, sgg_cd, admin_area_code]
  note: 행정동 코드는 법정동과 체계가 달라 시군구(5) 이상에서만 맞춘다
- id: R-22
  name: 시점 정렬 — 날짜·시각을 일·월·분기·연으로 내림
  function: pds.rules.time_floor
  keys: []
  note: 두 데이터의 시간 단위 중 거친 쪽으로. 기간 범위가 겹치는지는 셀 통계(min~max)로 확인
- id: R-23
  name: 분류 계층 — 업종(KSIC)·품목(HS) 코드 앞자리로 상위 분류
  function: pds.rules.category_prefix
  keys: []
  note: 같은 분류 체계일 때만. 산업 비교(업종별 집계)용
