# 조달청 공공조달 API 패밀리 — 원본 그래프 (표준: ../README.md, 스키마: ../_schema.json)
# status: documented = 조달청 OpenAPI 참고자료(docx)·포털 Swagger에 명시 / inferred = 필드명·샘플로 추론 (Phase 2 실호출로 확인 필요)
family: pps-procurement
title: 조달청 공공조달 API 패밀리 (나라장터·누리장터·쇼핑몰)
version: 1
updated: 2026-09-28
summary: >
  공공기관이 물품·용역·공사·외자를 사는 전 과정(발주계획 → 조달요청 → 사전규격 → 입찰공고 → 개찰·낙찰 → 계약 → 쇼핑몰 납품요구)을
  조달청이 단계별 API 18종으로 나눠 제공한다. 단계 사이는 차세대 나라장터 통합번호(R+연도+단계코드+순번)로 이어지며,
  계약과정통합공개서비스가 번호 하나로 전 과정을 이어주는 허브다. 업체·수요기관·물품분류·업종은 별도 마스터 API가 있다.
sources:
  - "doc: 조달청_OpenAPI참고자료_*.docx 18종 (포털 각 API 상세 '참고문서', 파싱본 data/ref/families/pps-procurement/reference_docs.json)"
  - "swagger: 포털 openapi.do 내장 Swagger (data/ref/families/pps-procurement/swagger_ops.json)"
  - "web: https://www.pps.go.kr/kor/content.do?key=00179 (조달청 업무처리절차)"
  - "web: https://www.pps.go.kr/kor/content.do?key=00726 (총액계약·중앙조달)"
scope:
  included: 조달청 REST API 18종 (정부조달·일반행정·국가통계·정부자원관리 영역에 흩어져 있음)
  excluded: >
    정부조달 영역의 조달청 외 기관 데이터(대전광역시·발전사·공사 등 41건)는 구름 검토(2026-09-28)로 제외 — 개별 기관 계약현황 파일이라
    나라장터 원천을 대체하지 못함. 조달청 파일데이터 143건(대부분 기관 사이트 링크)은 이 패밀리의 API로 대체 가능하므로 범위 밖.

conventions:
  base_url: "http://apis.data.go.kr/1230000/{group}/{Service}/{operation}  (group: ad=입찰, as=낙찰, ao=기타 대부분, at=쇼핑몰·통계)"
  business_division:
    Thng: 물품
    Servc: 용역 (조달요청은 TechServc 기술용역 / GnrlServc 일반용역으로 더 나뉨)
    Cnstwk: 공사
    Frgcpt: 외자
    Etc: 기타
  operation_suffix:
    PPSSrch: 나라장터 화면 검색조건과 같은 필터(기관·품명·지역·업종·금액 등)로 조회. 필터 없는 기본 오퍼레이션보다 무겁다
    ChgHstry: 변경이력
    DltHstry: 삭제이력 (계약) — 증분 적재 시 삭제 반영용
    Detail: 세부(품목 단위) 조회
    BsisAmount: 기초금액
    PreparPcDetail: 복수예비가격 상세
  inqry_div: "대부분 필수. 1=날짜범위, 2 이상=번호 조회. 값의 의미가 API·오퍼레이션마다 다르다 (operations.md의 각 오퍼레이션 설명을 볼 것)"
  datetime: "조회 파라미터 YYYYMMDDHHMM (일부 YYYYMMDD). 응답은 'YYYY-MM-DD HH:MM' 문자열"
  query_range_limit:
    default: 1개월
    개방표준.입찰공고일시: 1개월
    개방표준.개찰일시: 1일
    개방표준.계약체결일자: 1주 (부하로 1개월→1주 축소 운영 중)
    물품목록.변경일시: 12개월 (일부 1개월)
    쇼핑몰.등록일시: 1년 / 등록일자 12~36개월 / 납품요구접수일자 1개월
  paging: "pageNo, numOfRows. 응답 body.totalCount"
  format: "기본 XML, type=json이면 JSON"
  nested_list_fields:
    syntax: "[필드1^필드2^...],[...]  — 대괄호 묶음을 쉼표로 나열, 항목 안은 ^ 구분"
    fields:
      corpList: "계약 업체목록 [순번^업체구분^공동도급방식구분^업체명^대표자명^국적명^지분율^채권자명^담당자성명^사업자등록번호]"
      dminsttList: "계약 수요기관목록 [순번^수요기관코드^수요기관명^소관구분^담당부서명^담당자성명^담당자전화번호]"
      bidwinrInfoList: "계약과정통합 낙찰자정보 [순번^낙찰업체명^낙찰업체사업자번호^대표자명^낙찰금액^낙찰률^참가업체수^개찰일시]"
      cntrctInfoList: "계약과정통합 계약정보 [순번^계약번호^계약명^계약기관명^계약수요기관명^계약체결방법명^계약금액^계약일자]"
      indstrytyMfrcFldList: "입찰공고 면허제한 주력분야 [그룹순번^주력업종명1^주력업종명2^...]"
      bidNtceNoList: "발주계획·사전규격의 관련 입찰공고번호 — 쉼표 구분 문자열 (대괄호 없음)"

pitfalls:
  - "업무구분(물품·용역·공사·외자)이 맞지 않는 오퍼레이션을 부르면 결과가 비어 온다. 공고의 업무구분부터 확인"
  - "번호 체계가 2025-01-06 차세대 나라장터 개통으로 바뀌었다: 이전 11자리 숫자(YYYYMM+순번5) → 이후 13자리 R+YY+단계코드2+순번8. 두 체계가 섞여 있다"
  - "공고차수(bidNtceOrd)는 정정·재공고마다 증가. 같은 공고번호에 여러 차수가 있으므로 최신 차수만 쓸지 전부 쓸지 먼저 정한다"
  - "업체·수요기관 목록이 ^ 구분 중첩 문자열로 온다 → 파싱 후 행으로 풀어야 사업자번호·기관코드 조인이 된다"
  - "수요기관코드는 행정표준기관코드(7자리)가 기본이나 없으면 조달청 자체코드(Z로 시작)"
  - "조회기간 제한(대개 1개월, 개찰일시 1일)을 넘기면 오류 — 장기 적재는 기간을 쪼개 반복"
  - "발주계획·사전규격이 없는 입찰도 많다 (소액·수의계약 등 법령상 생략). 체인이 끊겨도 정상"

entities:
  - {id: order_plan,      name: 발주계획,        stage: 1, keys: [order_plan_no],   note: "수요기관이 연간 조달 계획을 분기별로 게시. 사전규격·입찰공고의 선행 단계"}
  - {id: procurement_req, name: 조달요청,        stage: 2, keys: [prcrmnt_req_no],  note: "수요기관이 조달청에 계약을 맡기는 요청(중앙조달). 자체조달 기관은 이 단계가 없다"}
  - {id: pre_spec,        name: 사전규격,        stage: 3, keys: [bf_spec_rgst_no], note: "입찰 전에 규격서 초안을 공개하고 업체 의견을 받는 단계"}
  - {id: bid_notice,      name: 입찰공고,        stage: 4, keys: [bid_ntce_no],     note: "최종 규격·입찰조건 공고. 기초금액·면허제한·참가가능지역 등 부속정보 포함"}
  - {id: bid_result,      name: 개찰·낙찰,       stage: 5, keys: [bid_ntce_no],     note: "개찰결과(참가업체·순위·예비가격)와 최종낙찰자. 재입찰·유찰 포함"}
  - {id: contract,        name: 계약,            stage: 6, keys: [unty_cntrct_no],  note: "낙찰 후 체결된 계약. 변경·삭제 이력 별도"}
  - {id: shop_product,    name: 쇼핑몰 계약품목,  stage: null, keys: [prdct_idnt_no, shopng_cntrct_no], note: "단가계약(다수공급자·일반단가·제3자단가)으로 쇼핑몰에 등록된 상품"}
  - {id: delivery_req,    name: 납품요구,        stage: 7, keys: [dlvr_req_no],     note: "수요기관이 쇼핑몰 단가계약 상품을 주문한 건"}
  - {id: company,         name: 조달업체,        stage: null, keys: [bizno],        note: "나라장터 등록 업체. 업종·공급물품·부정당제재"}
  - {id: institution,     name: 수요·공고·계약기관, stage: null, keys: [instt_cd],   note: "공공기관. 역할에 따라 수요기관/공고기관/발주기관/계약기관으로 필드명이 달라짐"}
  - {id: product_class,   name: 물품분류,        stage: null, keys: [prdct_clsfc_no, dtil_prdct_clsfc_no, prdct_idnt_no], note: "UNSPSC 기반 4단계 8자리 + 세부품명 10자리 + 물품식별번호"}
  - {id: industry,        name: 업종·근거법규,    stage: null, keys: [indstryty_cd], note: "입찰 참가자격(면허제한)의 기준"}

keys:
  - id: order_plan_no
    name: 발주계획통합번호
    format: {nextgen: "^R\\d{2}DD\\d{8}$", legacy: "업무구분(1)-업무유형(3)-발주년도(4)-기관코드(7)-순번(6)"}
    companion: "orderPlanNo = 통합번호 + 발주차수(2). 계약과정통합 조회는 orderPlanNo 파라미터"
    aliases:
      - {dataset: "15129462", field: orderPlanUntyNo, io: both, status: documented}
      - {dataset: "15129394", field: orderPlanUntyNo, io: out, status: documented}
      - {dataset: "15129459", field: orderPlanUntyNo, io: out, status: documented}
      - {dataset: "15129459", field: orderPlanNo, io: both, transform: "orderPlanUntyNo + 차수(2)", status: documented}
  - id: prcrmnt_req_no
    name: 조달요청번호
    format: {nextgen: "^R\\d{2}DC\\d{8}$", legacy: "영숫자 8~9자리 (예 16GA0289, 209700700)"}
    aliases:
      - {dataset: "15129468", field: prcrmntReqNo, io: both, status: documented}
      - {dataset: "15129459", field: prcrmntReqNo, io: both, status: documented}
      - {dataset: "15129394", field: prcrmntReqNo, io: in, status: documented}
      - {dataset: "15129397", field: prcrmntReqNo, io: in, status: documented}
      - {dataset: "15129394", field: refNo, io: out, transform: "조달청 공고면 참조번호에 조달요청번호가 들어오는 경우가 있음(샘플 R25DC…)", status: inferred}
      - {dataset: "15129427", field: reqNo, io: both, transform: "계약의 '요청번호'. 중앙조달이면 조달요청번호로 추정, 자체조달은 기관 문서번호(예 운영지원과-5980)", status: inferred}
  - id: bf_spec_rgst_no
    name: 사전규격등록번호
    format: {nextgen: "^R\\d{2}BD\\d{8}$", legacy: "숫자 6자리 내외"}
    aliases:
      - {dataset: "15129437", field: bfSpecRgstNo, io: both, status: documented}
      - {dataset: "15129394", field: bfSpecRgstNo, io: out, status: documented}
      - {dataset: "15129459", field: bfSpecRgstNo, io: both, status: documented}
  - id: bid_ntce_no
    name: 입찰공고번호
    format: {nextgen: "^R\\d{2}BK\\d{8}$", legacy: "^\\d{11}$ (YYYYMM+순번5)", other_systems: "자체 전자조달시스템은 기관별 형식"}
    companion: "bid_ntce_ord 입찰공고차수(3자리 '000'). 정정·재공고마다 증가"
    aliases:
      - {dataset: "15129394", field: bidNtceNo, io: both, status: documented}
      - {dataset: "15129397", field: bidNtceNo, io: both, status: documented}
      - {dataset: "15129459", field: bidNtceNo, io: both, status: documented}
      - {dataset: "15058815", field: bidNtceNo, io: out, status: documented}
      - {dataset: "15129462", field: bidNtceNoList, io: out, transform: "쉼표 구분 목록 → 행으로 분해", status: documented}
      - {dataset: "15129437", field: bidNtceNoList, io: out, transform: "쉼표 구분 목록 → 행으로 분해", status: documented}
      - {dataset: "15129427", field: ntceNo, io: both, transform: "입찰공고번호(11)+차수(2) (구체계 문서 기준. 차세대 번호에서의 결합 형식은 미확인)", status: inferred}
      - {dataset: "15129456", field: bidNtceNo, io: both, transform: "누리장터(민간) 공고번호 — 나라장터 공고와는 다른 모집단", status: documented}
      - {dataset: "15129458", field: bidNtceNo, io: both, status: documented}
      - {dataset: "15129469", field: ntceNo, io: in, status: documented}
    pitfalls:
      - "untyNtceNo(통합공고번호, R25BM…)는 여러 공고를 묶은 번호로 bidNtceNo와 다르다"
      - "refNo(참조번호): 조달청 공고면 자체시스템 공고번호, 자체시스템 공고면 나라장터 공고번호 — 방향이 반대"
  - id: unty_cntrct_no
    name: 통합계약번호
    format: {nextgen: "^R\\d{2}TA\\d{8}$", legacy: "^\\d{13}$"}
    companion: "dcsnCntrctNo 확정계약번호(계약번호+수정차수), cntrctRefNo 계약참조번호 — 검색 파라미터로도 쓰임"
    aliases:
      - {dataset: "15129427", field: untyCntrctNo, io: both, status: documented}
      - {dataset: "15129469", field: untyCntrctNo, io: both, status: documented}
      - {dataset: "15058815", field: cntrctNo, io: out, transform: "개방표준의 계약번호 샘플이 R25TA… 형식 → 통합계약번호로 추정", status: inferred}
      - {dataset: "15129459", field: cntrctInfoList, io: out, transform: "중첩 목록의 2번째 값(계약번호)", status: inferred}
  - id: dlvr_req_no
    name: 납품요구번호
    format: {nextgen: "^R\\d{2}TB\\d{8}$"}
    aliases:
      - {dataset: "15129471", field: dlvrReqNo, io: both, status: documented}
  - id: shopng_cntrct_no
    name: 쇼핑(단가)계약번호
    format: {nextgen: "^R\\d{2}TA\\d{8}\\d{2}$ (13자리+차수2)", legacy: "9자리+차수2"}
    aliases:
      - {dataset: "15129471", field: shopngCntrctNo, io: both, status: documented}
      - {dataset: "15129471", field: cntrctNo, io: both, transform: "납품요구 응답의 계약번호 = 단가계약번호로 추정", status: inferred}
    pitfalls: ["유일 키는 쇼핑계약번호 + 쇼핑계약순번 (문서 명시)"]
  - id: bizno
    global_key: bizno
    name: 사업자등록번호
    format: {any: "^\\d{10}$"}
    aliases:
      - {dataset: "15129466", field: bizno, io: both, status: documented}
      - {dataset: "15129397", field: bidwinnrBizno, io: out, status: documented}
      - {dataset: "15129397", field: prcbdrBizno, io: out, status: documented}
      - {dataset: "15129397", field: bizno, io: in, status: documented}
      - {dataset: "15129458", field: prcbdrBizno, io: out, status: documented}
      - {dataset: "15058815", field: fnlSucsfCorpBizrno, io: out, status: documented}
      - {dataset: "15129427", field: corpList, io: out, transform: "중첩 목록 마지막 값", status: documented}
      - {dataset: "15129459", field: bidwinrInfoList, io: out, transform: "중첩 목록 3번째 값", status: documented}
      - {dataset: "15129471", field: corpBizno, io: out, status: documented}
      - {dataset: "15129471", field: bizno, io: in, status: documented}
      - {dataset: "15129412", field: corpUntyNo, io: both, transform: "업체통합번호. 샘플이 사업자번호와 같은 10자리 → 동일로 추정", status: inferred}
    pitfalls: ["하이픈 없는 10자리. 외국업체·공동수급은 형식이 다를 수 있음"]
  - id: instt_cd
    global_key: instt_cd
    name: 기관코드 (수요·공고·발주·계약기관)
    format: {mois: "^\\d{7}$ 행정표준기관코드", pps: "^Z\\d{6}$ 조달청 부여(행정표준코드 없는 기관)"}
