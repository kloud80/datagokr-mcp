  parent: 국토관리/국토
  name: 미분류 (재구성 후 잔여)
  decided_at: 2026-09-29
  decided_by: 구름
  note: BRM 지역및도시에서 재구성 후 남은 잔여. 해당 분야 검토 때 다시 본다
  sectors: [국토관리 - 지역및도시]
