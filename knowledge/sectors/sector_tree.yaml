# 부문 위의 계층 (domain). 부문(sector)은 BRM 정책영역에서 출발하지만, 법 체계에 따라 상위 묶음을 둔다.
# 전략 응답에서 "이 데이터가 법 체계의 어느 층인가"(계획 → 규제 → 개발사업 → 정보 원장)를 설명하는 뼈대.
# 규칙: id = <정책분야>/<slug>. parent가 없으면 정책분야(field) 바로 아래. sectors는 이 domain에 직접 속한 부문.
# related: 다른 분야에 있지만 같은 법 층에 속하는 부문 (예: 농업생산기반은 농축수산에 있지만 개발사업 층).
# 컴파일: domain 노드, sector --in_domain--> domain, domain --domain_of--> domain|field, domain --related_sector--> sector
- id: 국토관리/국토
  name: 국토 (국토기본법 체계)
  law: 국토기본법 — 국토종합계획을 정점으로 국토계획법·개별 개발사업법·국토정보 법령이 이어지는 체계
  decided_at: 2026-09-29
  decided_by: 구름
  note: >
    국토관리를 국토기본법 계층으로 재구성 (구름 2026-09-29). 계획(국토·도시계획) → 규제(토지이용규제) → 시설(도시계획시설·공원녹지) →
    개발사업(도시개발·정비, 산업단지, 지역발전) 순으로 공간이 정해지고, 그 결과가 국토 정보 원장(공간정보·토지·지적·건축물)에 남는다.
    주택은 부동산 시장 영역으로 완전히 분리하고, 수자원은 국토 기반시설로 둔다
- id: 국토관리/계획·규제
  parent: 국토관리/국토
  name: 국토·도시 계획과 토지이용규제 (국토계획법)
  law: 국토의 계획 및 이용에 관한 법률 — 도시·군기본계획 §18~§23, 도시·군관리계획 §24~§35, 용도지역·지구·구역 §36~§42, 도시·군계획시설 §43~§48, 지구단위계획 §49~§55, 개발행위허가 §56~§65
  decided_at: 2026-09-29
  decided_by: 구름
  note: 계획이 규제(용도지역·지구·구역)와 시설(도시계획시설)을 결정하고, 지구단위계획·개발행위허가가 필지 단위로 내려온다. 산지 구분(산지관리법)은 개별법 규제 레이어
  sectors: [국토관리 - 국토·도시계획, 국토관리 - 토지이용규제, 국토관리 - 도시계획시설·공원녹지]
  related: [농축수산 - 임업·산촌]
- id: 국토관리/개발사업
  parent: 국토관리/국토
  name: 개발사업 (개별 개발사업법)
  law: 도시개발법·도시정비법·택지개발촉진법·공공주택특별법(지구)·도시재생법·산업입지법·국가균형발전특별법·지역특구법·농어촌정비법(농업생산기반)
  decided_at: 2026-09-29
  decided_by: 구름
  note: 구역 지정 → 계획 → 보상 → 조성 → 준공의 단계를 가진 사업 원장들. 단계 자체가 시의성(가격·개발 가능성의 선행 지표). 농지·농업생산기반 정비는 농축수산에 있지만 같은 층
  sectors: [국토관리 - 도시개발·정비, 국토관리 - 산업단지, 국토관리 - 지역발전]
  related: [농축수산 - 농업·농촌]
- id: 국토관리/국토정보
  parent: 국토관리/국토
  name: 국토 정보 원장 (공간정보·지적·건축물)
  law: 국가공간정보기본법·공간정보관리법(측량·지적)·부동산공시법(공시지가)·건축법(건축물대장·인허가)
  decided_at: 2026-09-29
  decided_by: 구름
  note: 필지(PNU) → 건물(건축물대장) → 호(동·호)로 이어지는 원장 층. 다른 모든 국토 데이터가 이 키에 붙는다
  sectors: [국토관리 - 공간정보, 국토관리 - 토지·지적, 국토관리 - 건축물]
- id: 국토관리/주택
  parent: 국토관리/국토
  name: 주택·부동산 시장
  law: 부동산거래신고법(실거래)·부동산공시법(주택가격)·주택법(공급·청약)·공동주택관리법·주택임대차보호법·공공주택특별법
  decided_at: 2026-09-29
  decided_by: 구름
  note: 국토관리에서 완전히 분리한 시장 영역 (구름 2026-09-29). 건축물(동·호)과 토지(PNU) 원장 위에서 거래·가격·공급·관리가 일어난다
  sectors: [국토관리 - 주택]
- id: 국토관리/기반시설
  parent: 국토관리/국토
  name: 국토 기반시설·자원 (물)
  law: 하천법·댐건설관리법·수도법·하수도법·수자원법
  decided_at: 2026-09-29
  decided_by: 구름
  note: 물관리 일원화 이후 환경부 소관이지만 국토 공간(하천구역·댐)과 기반시설(상하수도)을 이룬다
  sectors: [국토관리 - 수자원]
