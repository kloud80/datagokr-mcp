    depth: front
    novelty: high
    cycle: realtime
    value_source: 물때·파고는 낚시·레저 안전 필수, 고수온·적조 특보는 양식 피해 직결. KHOA(바다누리) 자체 키, 관측소코드
    match:
      title_regex: 조석|조류|조위|수온|염분|해수면|파고|파랑|해양 ?관측|관측소|부이|예보|특보|적조|고수온|저수온|해양 ?기상|물때|해류|정선해양|해양 ?기후|실시간|해상풍|해수유동
