  doc: knowledge/sectors/국토관리/국토·도시계획.md
  note: '국토계획법의 계획 층: 국토종합계획 → 광역·도시·군기본계획 → 도시·군관리계획 결정(고시·결정조서) → 지구단위계획 → 개발행위허가. 국토부 API는 지구단위계획·개발행위허가·국토계획구역 정도이고 관리계획 결정은 지자체 UPIS 파일이 대부분 (커버 편차 큼)'
