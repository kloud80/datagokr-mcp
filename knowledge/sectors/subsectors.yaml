    novelty: high
    cycle: annual
    value_source: 도수치료·MRI 가격 차이, 요양기관기호 × 비급여코드
    match:
      title_regex: 비급여
  - slug: medical-institutions
    name: 요양기관 원장 (병원·의원·약국 기본정보·진료과·병상·장비·인력·진료시간·개폐업)
    depth: front
    novelty: medium
    cross_cutting: true
    value_source: 보건의료 최다 트래픽, 전국 의료기관 전수. 심평원 API 6~8개가 ykiho 하나로 묶이는 체인
