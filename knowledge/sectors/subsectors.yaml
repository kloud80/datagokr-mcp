- sector: 교육 - 고등교육
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/교육/고등교육.md
  note: >
    개별화되고 확보 가능한 데이터 대부분을 살린다(수요가 많다). 학교코드 PK의 연 단위 공시가 중심이고, 대학은 배후 수요(학생 수·기숙사·유학생)의
    원천이라 대학가 주거·상권 분석과 직결. 학교코드가 대학알리미·KEDI·나이스 세 체계라 매핑이 선결 과제
  subsectors:
    - slug: admissions
      name: 입시
      depth: front
      novelty: high
      value_source: 전형·모집인원·경쟁률·입시 결과는 매년 바뀌고 대학별로 흩어짐 — 한 곳 비교 가치
      match: {title_regex: '입시|입학|전형|신입생 모집|모집정보'}
    - slug: international-students
      name: 유학생
      depth: front
      novelty: medium
      value_source: 대학별 외국인 유학생·정부초청장학생 — 대학가 특정 주거 수요
      match: {agency_name: 교육부 국립국제교육원}
    - slug: scholarship-loans
      name: 장학·학자금
      depth: front
      novelty: medium
      match: {title_regex: '장학|학자금|대출|등록금 납부|근로|학비감면|이자면제|분할상환|연합생활관'}
    - slug: higher-ed-funding
      name: 재정지원·융자·폐교
      depth: front
      novelty: low
      match: {title_regex: '재정지원|사학진흥기금|융자|행복기숙사|폐교'}
    - slug: lecture-curriculum
      name: 강의·교육과정
      depth: back
      novelty: low
      match: {title_regex: 'KOCW|강의|교육과정|커리큘럼|교과목'}
    - slug: academic-info
      name: 학술정보 (RISS 등)
      depth: back
      novelty: low
      match: {title_regex: 'RISS|학술|논문'}
    - slug: university-disclosure
      name: 대학 공시·현황 (대학알리미·대학재정)
      depth: front
      novelty: medium
      value_source: 학교 위치·학생·교원·기숙사·등록금·재정 — 재학생 수 − 기숙사 수용 = 원룸 수요, 충원율 하락 = 대학가 상권 쇠퇴 신호
      match_any:
        - {agency_name: [한국대학교육협의회, 한국사학진흥재단, 교육부, 한국교육개발원, 한국전문대학교육협의회, 한국장학재단, 한국교육학술정보원]}
        - {list_type: STD}
        - {title_regex: '대학'}
  default: {slug: other, name: 기타, depth: back}

- sector: 교육 - 교육일반
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/교육/교육일반.md
  note: >
    대상은 학교 기본정보·학구도/통학·학원/교습소·교육시설/환경 네 가지. 교원·학생 통계와 교육 행정·재정은 학교 기본정보 소속으로 연계 가능한 것만.
    부동산 관점에서 학구·학원·학교 신설이 주택 수요를 가장 직접 설명한다
  subsectors:
    - slug: school-districts
      name: 학구도·통학구역·학군
      depth: front
      novelty: medium
      value_source: '이 아파트는 어느 학교 배정인가 — 주택 선택 1순위. 학구 경계가 가격 차이. 연 1회 조정. 폴리곤인지 주소 범위 텍스트인지 Phase 2 확인'
      match: {title_regex: '학구|통학구역|학군|학교군'}
    - slug: private-academies
      name: 학원·교습소
      depth: front
      novelty: medium
      value_source: 학원가 밀집도 = 학원 상권이자 주택 수요 신호. 교육청별 파일·API가 섞여 제목 패턴으로 군집
      match: {title_regex: '(?<!대)학원|교습소|개인과외'}
    - slug: school-facilities-env
      name: 교육시설·환경 (신설·통폐합·보호구역)
      depth: front
      novelty: medium
      value_source: 신설 예정 학교 = 신도시 수요, 통폐합·폐교 = 구도심 쇠퇴, 교육환경보호구역 = 개발 규제
      match: {title_regex: '교육환경보호|보호구역|신설학교|신설예정|개교예정|통폐합|학교시설|시설물정보|폐교'}
    - slug: school-registry
      name: 학교 기본정보 (+연계 가능한 통계·재정)
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 표준 학교코드 마스터 — 고등교육의 세 학교코드 체계를 묶는 기준. 교원·학생·학급 통계, 교육청·학교 재정은 학교/기관 키로 붙는 것만
      match: {title_regex: '.'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 교육 - 평생·직업교육
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/교육/평생·직업교육.md
