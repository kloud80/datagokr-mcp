    depth: front
    novelty: medium
    cross_cutting: true
    value_source: 지역에 연계 가능한 통계만 (구름)
    match:
      title_regex: .
  default:
    slug: excluded-rest
    name: 제외 대상
    depth: back

- sector: 사회복지 - 공적연금
  decided_at: '2026-09-29'
  decided_by: 구름
  doc: knowledge/sectors/사회복지/공적연금.md
  note: 개인 단위 원장은 개인정보라 전부 제한. 국민연금 사업장(기업 축 원장)·가입/급여 통계(원본이 있는 통계라 지역에 연결)·기금 운용(경제로 연결)·직역연금 통계·퇴직연금만 (구름 2026-09-29). 퇴직연금은 금융위 퇴직연금기본정보 API·산업은행 원리금보장상품 금리 API·근로복지공단 가입/사업장 운용/수익률·고용부 도입 현황·SGIS 통계까지 — 금감원 통합연금포털 사업자별 수익률·수수료 공시는 포털 밖(자체)
  subsectors:
  - slug: retirement-pension
    name: 퇴직연금 (퇴직연금 기본정보·상품 금리·가입/도입 현황·사업장 운용·수익률·IRP·연금저축)
    depth: front
    novelty: medium
    value_source: 사업자별 수익률·수수료는 IRP·DC 선택 근거. 포털에는 금융위·산업은행 API와 근로복지공단·고용부 파일
    match:
      title_regex: ^(?!.*(공무원연금|사립학교|사학연금|군인연금)).*(퇴직연금|퇴직급여|IRP|개인형퇴직|연금저축|확정급여|확정기여)
  - slug: pension-fund
    name: 연금 기금 운용 (국민연금·사학·군인연금 기금 운용 현황·성과·국내외 투자·위탁운용사·거래증권사)
    depth: front
    novelty: medium
    cross_cutting: true
    value_source: '경제로 연결 (구름): 국내 주식 보유·위탁운용사·거래증권사는 종목코드·금융회사로 재정금융 주식·금융 데이터와 조인'
    match:
      title_regex: 투자|운용|위탁운용|증권사|주식|채권|대체투자|의결권|기금
  - slug: occupational-pension-stats
    name: 직역연금 통계 (공무원·사학·군인연금 가입·재직·퇴직·수급·재해보상)
    depth: front
    novelty: low
    value_source: 직역연금 4공단은 통계만 내고 API가 거의 없음 — 파일 도시에 1개로 묶음, 지역별 수급자 표는 지역에 연결
    match:
      title_regex: 공무원연금|사립학교교직원|사학연금|군인연금|별정우체국
  - slug: pension-workplaces
    name: 국민연금 사업장 (가입 사업장 내역·탈퇴 사업장)
    depth: front
    novelty: high
    cross_cutting: true
    cycle: monthly
    value_source: '사업장별 가입자 수·월 납부액 = 기업 규모·급여 수준을 추정하는 거의 유일한 공개 원장 (구름: 사업장 단위라 필수). 사업자번호로 기업 축(국세청·공정위·R&D·조달) 전체와 연결'
    match:
      title_regex: 사업장
  - slug: pension-statistics
    name: 국민연금 가입·급여 통계 (가입현황·수급현황·지역가입자·급여 실적)
    depth: front
    novelty: medium
    cycle: monthly
    cross_cutting: true
    value_source: 통계지만 원본(가입·수급 원장)에서 나온 시군구 × 월 격자 — 지역에 연결 (구름)
    match:
      title_regex: .
  default:
    slug: excluded-rest
    name: 제외 대상
    depth: back
