  - slug: fishery-licenses
    name: 어업 허가·면허·어장·어선 등록
    depth: front
    novelty: medium
    value_source: 면허·허가번호·어장코드·어선번호 원장, 어업인 사업자번호로 기업 축. 해운·항만 선박 등록과 어선에서만 겹침
    match:
      title_regex: 어업 ?허가|어업 ?면허|면허어업|허가어업|어업권|양식장|어장|어선|양식업|어업 ?현황|마을어업|정치망|어업 ?종류
