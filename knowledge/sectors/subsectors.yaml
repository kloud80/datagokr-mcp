# 세부 부문: BRM 정책영역 하나에 행정 프로세스가 여럿 섞인 경우 정책영역 아래로 나눈다.
# 원칙: 행정 프로세스 1개 = 근거법 1개+ = 개별 코드 1종. 정책영역 하나가 곧 부문이면(정부조달·공정거래) 세부 없이 둔다.
# 규칙은 위에서부터, 첫 번째로 맞는 세부 부문이 이긴다. default는 아무것도 안 맞을 때.
# depth: front = 심층(도시에) 대상 / back = 뒤로. cycle: event = 선거처럼 이벤트 때만 생성·확정 후 불변 (freshness 예외)
- sector: 공공행정 - 국정운영
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/공공행정/국정운영.md
  subsectors:
    - slug: election
      name: 선거
      novelty: high
      depth: front
      cycle: event
      last_event: 2026-06-03      # 제9회 전국동시지방선거
      match: {agency_name: 중앙선거관리위원회}
    - slug: presidential-records
      name: 대통령 기록
      novelty: low
      depth: back
      match: {agency_name: 행정안전부 대통령기록관}
    - slug: gazette-notice
      name: 관보·고시공고
      novelty: high
      depth: back
      match: {title_regex: "관보|입법예고|고시공고"}
    - slug: local-council
      name: 지방의회
      novelty: medium
      depth: back
      match: {title_regex: "의회|의안|의원|5분발언|군정질문|회기"}
    - slug: participation
      name: 국민참여·제안
      novelty: medium
      depth: back
      match: {agency_name: 국민권익위원회}
    - slug: research-docs
      name: 정책연구·세미나 자료
      novelty: low
      depth: back
      match_any:
        - {agency_name: 국토연구원}
        - {agency_name: 경제인문사회연구회}
    - slug: policy-pledge
      name: 정책·공약·국정성과
      novelty: low
      depth: back
      match: {title_regex: "공약|정책|구정현황|국회지적|만족|국정과제"}
  default: {slug: misc, name: 기타(성격 불명·오분류), depth: back}

- sector: 공공행정 - 정부자원관리
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/공공행정/정부자원관리.md
  note: >
    정부가 가진 자원(조직·인력·재산·물품·정보)을 관리하는 내부 업무. 국민 대상 서비스는 적지만 전체 시스템의 조인 키 원장(행정표준코드)과
    PNU 체인(국유·공유재산)이 있어 다른 목적의 수요에서 연계 가능성이 높다 → 목록 전체를 보관하고 세부 부문을 촘촘히 나눈다.
  subsectors:
    - slug: reference-codes
      name: 행정표준코드·정부조직
      novelty: low
      depth: front
      cross_cutting: true
      match_any:
        - {title_regex: "행정표준코드"}
        - {title_regex: "정부조직|공공기관현황|공공기관 현황|공공기관 시설정보"}
    - slug: portal-meta
      name: 공공데이터포털 메타 (시스템 자체 문서)
      novelty: low
      depth: system
      match_any:
        - {id: ["15062804", "15121937", "15156444"]}
        - {title_regex: "공공데이터 (목록|파일|활용|제공기관|미제공)|개방 공공데이터"}
    - slug: state-property
      name: 국유·공유재산
      novelty: high
      depth: front
      match_any:
        - {agency_name: 한국자산관리공사}
        - {title_regex: "공유재산|국유|국공유|시유재산|구유|일반재산|폐교재산|공유지|자산관리 현황|고정자산|공공건축물"}
    - slug: civil-service
      name: 공무원·인사
      novelty: low
      depth: hold
      match_any:
        - {agency_name: 인사혁신처}
        - {title_regex: "채용|장차관|인재DB|인재 ?데이터베이스"}
    - slug: it-resources
      name: 정보자원
      novelty: low
      depth: back
      match: {title_regex: "정보자원|정보시스템|EA|소프트웨어|SW|전산|OA|PC|데이터센터|웹사이트|홈페이지|그룹웨어|SMS|게시판|네트워크|본인확인"}
    - slug: open-facilities
      name: 공공자원 개방·대관 (공유누리)
      novelty: medium
      depth: hold
      match: {title_regex: "공공개방자원|공유서비스|공유누리|개방자원|개방시설|시설개방|시설대관|대관|회의실|공구대여|나눔장터|공공시설 이용요금"}
    - slug: records-facilities
      name: 기록·청사·차량
      novelty: low
      depth: back
      match: {title_regex: "기록물|기록원|청사|공용차량|관용차량|차량 현황|차량정보|차량현황|운영시설|시설현황|현수막|게시대|게시시설|벽보"}
  default: {slug: misfiled, name: 오분류(타 부문 성격), depth: back}

- sector: 공공행정 - 공정거래
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/공공행정/공정거래.md
  note: 공정위의 등록·지정·공시 4개 체인. 근거법·개별 코드가 체인마다 달라 세부 부문으로 나누고, 모두 사업자등록번호로 묶인다.
  subsectors:
    - slug: business-group
      name: 기업집단
      novelty: medium
      depth: front
      match: {title_regex: "기업집단포털"}
    - slug: franchise
      name: 가맹사업
      novelty: medium
      depth: front
      match: {title_regex: "가맹|페어데이터"}
    - slug: special-sales
      name: 전자상거래·특수판매
      novelty: high
      depth: front
      match: {title_regex: "통신판매|다단계|방문판매|후원방문|전화권유"}
    - slug: prepaid-installment
      name: 상조(선불식 할부거래)
      novelty: medium
      depth: front
      match: {title_regex: "선불식할부|할부거래"}
  default: {slug: excluded-rest, name: 제외 대상(4개 체인 밖), depth: back}

- sector: 공공행정 - 법제
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/공공행정/법제.md
  note: >
    국회(open.assembly.go.kr)·법제처(open.law.go.kr) 외부 API가 거의 전부. 가치 기준은 "LLM이 이미 아는가" — 법령 본문·규칙은 이미
    학습·공개돼 부가가치가 낮고, 어제 발의된 의안·지난주 선고된 판례·오늘 표결처럼 빨리 올라오는 세부 원장이 가치 (구름 2026-09-28).
  subsectors:
    - slug: api-catalog
      name: 국회 OPEN API 카탈로그 (시스템 자체 문서)
      depth: system
      novelty: low
      match: {id: ["15125891"]}
    - slug: docs-guides
      name: 조약·영문·생활법령·용어·해설서
      depth: back
      novelty: low
      match: {title_regex: '^\(영문\)|편람|매뉴얼|길잡이|길라잡이|사례집|백서|해설|입안심사 기준|정비기준|교재|지침|주석서|법제한류|법제실무|경제 투자 법령|번역|중문|영문|조약|생활법령|백문백답|용어|세계법제|국가코드|해석 연구보고서|한글변환|헌법과|청소년법제관|법제업무'}
    - slug: bill
      name: 의안·입법 (국회 의안 + 정부입법)
      depth: front
      novelty: high
      value_source: 시의성 — 발의·심사·처리가 당일 단위로 바뀜. 모델이 모름
      match: {title_regex: '의안|법률안|입법예고|입법계획|입법현황|정부입법|행정예고|계류|처리안건|제안설명서|제안이유|개정대상|서면질의답변|예결산|입법예고관련'}
    - slug: case-law
      name: 사법 판단 (판례·헌재·법령해석·행정심판·결정문)
      depth: front
      novelty: high
      value_source: 시의성 + 희소성 — 판례·결정례·해석례는 등록 시점 이후만 가치
      match: {title_regex: '판례|헌재결정|법령해석|행정심판|재결례|결정문|의견제시사례'}
    - slug: assembly-activity
      name: 의정 활동 (의원·표결·회의·청원·감사)
      depth: front
      novelty: high
      value_source: 시의성 — 표결·회의 즉시. 의안과 결합해 "누가 무엇을"
      match: {agency_name: 국회 국회사무처, title_regex: '의원|표결|회의록|일정|청원|청문회|국정감사|국정조사|위원회|교섭단체|회기|의정활동|의사중계|정치일정|정당|시정조치|시정 및 처리|연구단체|퇴직 공직자|회의별|회의록별|영상|시청각'}
    - slug: local-ordinance
      name: 자치법규·행정규칙
      depth: front
      novelty: medium
      value_source: 지자체 단위 희소성 — 모델이 잘 모르고, 도시에 "행정 처리 흐름"의 근거
      match: {title_regex: '자치법규|행정규칙|학칙|우수조례|조례'}
    - slug: statute
      name: 법령 원장 (연결·변경 감지용 마스터)
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 내용이 아니라 연결과 변경 감지 — 모든 도시에의 법적 근거를 법령ID로 묶고, 시행일·개정 이력으로 무엇이 바뀌었나를 잡는다
      match_any:
        - {title_regex: '법령|조문|시행일|신구법|3단 비교|위임|체계도|연혁|변경이력|별표|서식|공포|관보|약칭|편장절관|한눈보기|지식베이스|규제관련|삭제 데이터'}
        - {agency_name: 법제처}
    - slug: legislative-research
      name: 입법·정책 연구 간행물
      depth: back
      novelty: low
      match: {agency_name: [국회 국회사무처, 국회 국회도서관, 국회 국회입법조사처]}
  default: {slug: misc, name: 기타(타 기관), depth: back}

- sector: 공공행정 - 정부조달
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/공공행정/정부조달.md
  novelty: high
  note: 세부 부문 없음(행정 프로세스 하나). 오늘 올라온 공고·낙찰·계약은 모델이 모름 → 시의성 높음
  subsectors: []

- sector: 공공행정 - 지방행정·재정지원
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/공공행정/지방행정·재정지원.md
  note: >
    대상은 지방재정 공시·국고/지방보조금·주민등록 셋. 나머지는 목록(지방공기업·출자출연 명부와 경영공시, 전국 표준데이터 목록)만 남기고 제거.
    PK가 자치단체코드·행정동코드라 행정표준코드(reference-codes)와 바로 붙는다.
  subsectors:
    - slug: subsidy
      name: 국고·지방보조금
      depth: front
      novelty: high
      value_source: 보조사업 단위 원장 — "내가 받을 수 있는 보조금". 모델이 모르는 원장, 사업자번호로 국세청·공정거래·상권과 연결
      match_any:
        - {agency_name: 기획예산처}
        - {title_regex: '지방보조금_|지방보조금통합관리시스템'}
    - slug: population-registry
      name: 주민등록 인구·세대
      depth: front
      novelty: medium
      granularity_floor: 1.0
      value_source: 행정동·법정동·통반 × 월 시계열. 집계지만 공간 결합의 기본 축 (구름 "집계여도 주요 데이터")
      match: {agency_name: 행정안전부, title_regex: '주민등록|읍면동 하부행정기관|외국인 주민'}
    - slug: local-finance
      name: 지방재정 공시 (지방재정365)
      depth: front
      novelty: medium
      value_source: 지표(재정자립도 등)는 모델이 알지만 세출 세부사업 단위 원장("우리 구가 어디에 얼마 썼나")은 모름
      match: {agency_name: 행정안전부, title_regex: '지방재정|지방세|교부세|재정자립|재정자주|통합재정|시가표준액|순세계잉여금'}
    - slug: local-public-institutions
      name: 지방공기업·출자출연기관 (목록·경영공시)
      depth: back
      novelty: low
      match_any:
        - {agency_name: 행정안전부 한국지역정보개발원}
        - {title_regex: '지방공기업|공기업|출자출연|지방공공기관'}
    - slug: national-standard-lists
      name: 전국 표준데이터 목록
      depth: back
      novelty: low
      match: {list_type: STD}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 공공행정 - 국민권익·인권
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/공공행정/국민권익·인권.md
  note: 민원 분석 하나만 대상. 민원빅데이터 분석정보 API는 연도별로 따로 등록된 같은 스키마(2022~2025) — 한 도시에로 묶고 연도는 series(continues)로
  subsectors:
    - slug: civil-complaints
      name: 민원 분석 (민원빅데이터)
      depth: front
      novelty: high
      value_source: 지역(행정구역) × 기관 × 키워드 × 월 민원 신호 — 지역 이슈의 가장 빠른 신호, 모델이 모름. 행정구역코드로 인구·실거래·상가와 결합
      match: {agency_name: 국민권익위원회, title_regex: '민원빅데이터'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 과학기술 - 우정
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/과학기술/우정.md
  note: 우편번호·배달·주소만 대상. 행안부 도로명주소(주소검색 API·주소DB)는 행정표준코드와 같은 조인 키 원장 성격이라 cross-cutting 마스터로
  subsectors:
    - slug: address-master
      name: 도로명주소 마스터 (주소검색 API·주소DB)
      depth: front
      novelty: medium
      cross_cutting: true
      value_source: 주소 문자열 → 도로명코드·건물관리번호·법정동코드·좌표 정규화. 모든 주소 컬럼 데이터의 조인 입구 (정부자원관리 gap address-master 해소)
      match: {agency_name: 행정안전부, title_regex: '주소|도로명|기초구역|지도제공'}
    - slug: postal-delivery
