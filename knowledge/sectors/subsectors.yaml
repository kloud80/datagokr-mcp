- sector: 보건의료 - 건강보험
  decided_at: '2026-09-29'
  decided_by: 구름
  doc: knowledge/sectors/보건의료/건강보험.md
  note: 건보공단·심평원이 몸통. 요양기관·비급여·급여 기준/코드·진료/처방 통계·보험 자격·장기요양기관만 (구름 2026-09-29). 요양기관 원장과 급여 코드 마스터가 보건의료 분야 전체의 기준 두 축. 심평원 ykiho는 암호화 키라 LOCALDATA 인허가·응급 hpid와는 주소·명칭 매핑만 가능 — 의료기관 3코드 매핑이 선결 과제
  subsectors:
  - slug: long-term-care
    name: 장기요양기관 (시설·재가 기관 검색·상세·등급 인정)
