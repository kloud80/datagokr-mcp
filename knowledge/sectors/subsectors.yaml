    depth: front
    novelty: medium
    match:
      title_regex: 지구단위|획지
  - slug: management-plan
    name: 도시·군관리계획 결정·고시 (UPIS 결정조서·고시·입안·도시계획위원회)
    depth: front
    novelty: high
    cycle: event
    value_source: 관리계획 결정 고시 = 개발 가능성의 선행 지표. 국정홍보에서 뺀 고시·공고 중 도시계획 결정만 여기서 다룬다
    match:
      title_regex: 관리계획|결정|고시|입안|위원회|UPIS|도시계획정보
