  doc: knowledge/sectors/법률/법무및검찰.md
  note: 개인정보·수사 정보라 개방이 구조적으로 제한된 분야, 출입국 관리가 중심 (구름 2026-09-29). 출입국·체류, 변호사·법무사, 범죄·수사 통계만. 체류 외국인(시군구 × 체류자격 × 월)과 범죄 통계(시군구 × 죄명 × 월)는 집계지만 시군구 격자 원장으로 보고 지역 정보에 연결한다 (주민등록 인구와 같은 축). 범죄 통계는 대검(검찰 접수·처리 기준)과 경찰청(발생 기준, 재난안전)이 다른 값
