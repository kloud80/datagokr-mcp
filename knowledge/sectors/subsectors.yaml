- sector: 과학기술 - 과학기술연구
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/과학기술/과학기술.md
  note: 과학기술진흥·연구를 하나로. 대상은 국가R&D·지식재산·학술문헌 + 연구개발특구·과기정통부 기관 목록. 사업자번호가 다른 부문(조달·공정거래·보조금)과의 연결 고리
  subsectors:
    - slug: intellectual-property
      name: 지식재산 (특허·상표·디자인, KIPRIS)
      depth: front
      novelty: high
      value_source: 출원·공개·등록이 공개 즉시 — 경쟁사 출원 동향, 기술 탐색. 출원인 법인·사업자로 기업 데이터와 연결
      match: {agency_name: [지식재산처, 한국특허전략개발원]}
    - slug: national-rnd
      name: 국가R&D 과제·성과 (NTIS)
      depth: front
      novelty: medium
      value_source: 과제·참여기관·성과 원장 — 사업자번호 기준 기업 R&D 프로필. 갱신은 연차 보고 시점에 몰림(annual-batch)
      match: {title_regex: '국가R&D|국가연구개발|NTIS|과학기술표준분류|연구개발 RND|R&D'}
    - slug: rnd-special-zone
      name: 연구개발특구
      depth: front
      novelty: medium
      value_source: 특구 입주기관·연구소기업·사업화 공개기술·협약과제 — 특구 단위 기업·기술 원장
      match: {agency_name: (재)연구개발특구진흥재단}
    - slug: scientific-literature
      name: 학술문헌 (KCI·ScienceON)
      depth: front
      novelty: low
      value_source: 모델이 대부분 아는 영역 — 최신 국내 논문·인용·연구자 정보만 가치
      match: {title_regex: 'KCI|ScienceON|AIDA'}
    - slug: msit-org-lists
      name: 과기정통부 기관·사업자 목록
      depth: back
      novelty: low
      match: {agency_name: 과학기술정보통신부}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

