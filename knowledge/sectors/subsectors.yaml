  doc: knowledge/sectors/교육/유아및초·중등교육.md
  note: >
    국민 접점이 교육 분야에서 가장 넓은 영역. 개별 기관·학생·학교 단위 데이터는 대부분 살리고 표준 학교코드(나이스 SD_SCHUL_CODE + 교육청코드 복합키)
    중심으로 정리. 지역별 통계는 배제. 유치원코드(알리미)·어린이집 코드와의 매핑이 선결 과제
  subsectors:
    - slug: school-daily
      name: 나이스 일상 정보 (급식·학사일정·시간표·학급)
      depth: front
      novelty: high
      cycle: daily
      value_source: 급식 식단(알레르기 포함)·학사일정은 매일·매주 갱신 — 학부모 수요 최상위, 모델은 모름
      match: {title_regex: '나이스|NEIS|급식|식단|학사일정|시간표|학급정보|학급 정보'}
