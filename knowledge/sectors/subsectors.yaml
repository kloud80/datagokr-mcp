- sector: 농축수산 - 해양수산·어촌
  decided_at: '2026-09-29'
  decided_by: 구름
  doc: knowledge/sectors/농축수산/해양수산·어촌.md
  note: 해운·항만이 배와 항구라면 여기는 바다와 물고기. 해양공간 영역·어업 허가/면허·수산물 유통·해양 관측/예보만 우선 (구름 2026-09-29). 농업·농촌과 평행 구조(어장↔농지, 수산물 가격↔농산물 가격). 어선 등록(어선법)은 여기가 대표, 상선(선박법)은 해운·항만
  subsectors:
  - slug: marine-spatial
    name: 해양공간 영역 (해양용도구역·해양/수산자원 보호구역·연안·EEZ·공유수면·특정도서)
    depth: front
    novelty: medium
    cross_cutting: true
    value_source: 해양공간계획 용도구역 = 해상풍력 등 입지 규제, 토지이용규제의 해양 대응물
