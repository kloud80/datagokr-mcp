  note: 기초생활보장 통계·장애인 등록/급여 통계·장애인 시설/서비스·편의/이동권·사회복지시설 + 지역 연계 통계 (구름 2026-09-29). 개인정보 제한이 가장 강한 영역 — 통계는 시군구 이하 세분화 불가. 사회복지시설 통합 현황이 노인·아동·장애인·노숙인 시설 공통 마스터
  subsectors:
  - slug: accessibility
    name: 장애인 편의·이동권 (편의시설·장애인 화장실/주차·특별교통수단·저상버스·BF 인증)
    depth: front
    novelty: medium
    cross_cutting: true
    value_source: 건물 단위 원장(건물관리번호·PNU) — 일상 접근성 수요
    match:
      title_regex: 편의시설|경사로|장애인 ?(화장실|주차|콜|택시)|특별교통|저상버스|교통약자|무장애|BF|배리어|이동지원|휠체어|장애물 ?없는|전동보장구|주차구역|하모니콜|보행상 장애
  - slug: disability-registry
    name: 장애인 등록·급여 통계 (유형·정도·시군구, 장애인연금·수당·활동지원)
    depth: front
    novelty: medium
    cycle: monthly
    match:
      title_regex: 장애인 ?(등록|현황|수|인구|연금)|등록 ?장애인|장애수당|장애인연금|장애 ?(유형|정도)|활동지원 ?(이용|급여)
  - slug: disability-services
    name: 장애인 시설·서비스 (장애인복지시설·활동지원기관·발달장애인센터·보조기기·일자리)
    depth: front
    novelty: medium
    match:
      title_regex: 장애인 ?(복지|시설|복지관|보호|재활|거주|주간|직업|일자리|체육)|활동지원기관|발달장애|보조기기|점자|수어
  - slug: basic-livelihood
    name: 기초생활보장 통계 (수급자·가구·급여별, 차상위·긴급복지, 기준 중위소득)
    depth: front
    novelty: medium
    cycle: monthly
    value_source: 시군구 × 급여 × 월 격자 원장, 지역 정책·시설 배치의 기초
    match:
      title_regex: 기초생활|수급자|수급 ?가구|생계급여|의료급여|주거급여|교육급여|차상위|긴급복지|중위소득
  - slug: welfare-facilities-master
    name: 사회복지시설 (통합 현황·사회복지관·사회복지법인·노숙인 시설·지역자활센터·시설 평가)
    depth: front
    novelty: medium
    cross_cutting: true
    value_source: 사회복지시설코드 — 노인·아동·장애인·노숙인 시설 전체의 공통 마스터
    match:
      title_regex: 사회복지시설|사회복지관|복지관|사회복지법인|노숙|쪽방|지역자활센터|자활센터|시설 ?평가
  - slug: regional-statistics
