      depth: front
      novelty: medium
      value_source: 유치원 위치·원아 수 = 젊은 가구의 공간 분포 — 주거 수요 선행 지표. 어린이집(사회복지)과 짝
      match: {title_regex: '유치원|처음학교로|유아'}
    - slug: after-school-care
      name: 돌봄·늘봄·방과후
      depth: front
      novelty: medium
      match: {title_regex: '돌봄|늘봄|방과후'}
    - slug: high-school-admissions
      name: 고입·전형·배정
      depth: front
      novelty: high
      cycle: event
      match: {title_regex: '고입|입학|전형|배정|모집'}
    - slug: special-education
      name: 특수·대안·다문화
      depth: front
      novelty: low
      match: {title_regex: '특수|대안|다문화|외국인학교'}
    - slug: school-disclosure
      name: 학교알리미 공시·학교 단위 원장
      depth: front
      novelty: medium
      value_source: 학교별 학생·학급·교원·전출입·시설·예결산 — 학구 단위 인구 이동의 가장 빠른 신호 (교육일반 학구도와 결합)
      match: {title_regex: '.'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 교통물류 - 철도
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/교통물류/철도.md
  note: >
    대부분 살린다. 역세권(역 좌표·출입구)·신설 노선 계획·승하차 인원은 주거·상가 가치의 세 축. 역 코드가 기관마다 달라(코레일·도시철도 6곳·서울시·교통카드
    정류장ID·국가철도공단 GIS) 통합(transit_node_cd)이 이 영역의 핵심 과제
  subsectors:
    - slug: rail-plans
      name: 철도 건설 계획 (국가철도망·광역철도·GTX)
      depth: front
      novelty: high
      cycle: event
      value_source: 계획 단계 변경·개통 예정은 가격 선행 신호. 계획 단계 역은 행정동 수준 위치만(좌표 없음)
      match: {title_regex: '국가철도망|구축계획|건설|GTX|광역철도|개통|철도사업|철도건설'}
    - slug: metro-ridership
      name: 승하차·혼잡·통행
      depth: front
      novelty: medium
      value_source: 역별 시간대별 승하차 = 유동인구의 가장 정직한 대체 지표, 교통카드 OD = 상권 배후지
      match: {title_regex: '승하차|하차|혼잡|이용인원|이용객|환승인원|수송|OD|통행|이동유형|발권'}
    - slug: rail-realtime
      name: 실시간 도착·시간표·운임 (조회 도구)
      depth: front
      novelty: high
      value_source: 분석용이 아니라 서비스용 조회 — 전략 응답에서 access.mode realtime-query로 표시
      match: {title_regex: '실시간|도착|시간표|시각표|운행정보|운임|요금|첫차|막차|좌석|열차 ?정보|TAGO|진위'}
    - slug: rail-network
      name: 철도망·역·출입구·시설
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 역 좌표·출입구·환승 — 역세권 판정의 기준. transit_node_cd 매핑 마스터
      match: {title_regex: '역|노선|출입구|좌표|환승|선로|GIS|승강장|주소데이터|엘리베이터|에스컬레이터|편의시설|주차'}
    - slug: rail-safety
      name: 철도 안전·사고
      depth: back
      novelty: low
      match: {title_regex: '사고|안전|운행장애|점검|내진|소화기'}
    - slug: rail-freight
      name: 철도 물류·화물
      depth: back
      novelty: low
      match: {title_regex: '화물|물류|컨테이너|CY'}
  default: {slug: rail-other, name: 철도 기타 (운영·안내·유실물 등), depth: back}

- sector: 교통물류 - 항공·공항
  decided_at: 2026-09-28
  decided_by: 구름
  doc: knowledge/sectors/교통물류/항공·공항.md
  note: >
    운항정보·항공통계·항공운송사업·항공기 등록·드론·공항코드까지만. 공항코드(IATA/ICAO)가 운항·통계·노선을 잇는 키이고,
    공항 운영기관이 둘(한국공항공사 14개 공항 / 인천국제공항공사)로 나뉘어 같은 운항 정보가 두 체계로 나온다
  subsectors:
    - slug: drone
      name: 드론·초경량비행장치 (신고·비행승인·조종자격·비행금지/제한구역)
      depth: front
      novelty: high
      value_source: 신고 기체·비행승인·조종자격 = 드론 산업 규모와 분포, 비행금지/제한구역은 드론 서비스 입지의 제약 조건
      match: {title_regex: '드론|초경량|무인비행|무인멀티콥터|비행금지구역|비행제한구역'}
    - slug: aircraft-registry
      name: 항공기 등록·도입·말소
      depth: front
      novelty: medium
      value_source: 업체별·정치장별 등록 현황 = 항공사·운송사업자 보유 기단, 등록원부(항공기등록관리정보)가 원장
      match: {title_regex: '항공기 ?등록|항공기 등록|말소|도입|항공기 보유|정치장'}
    - slug: airport-codes
      name: 공항·항공사 코드 (IATA/ICAO 마스터)
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 운항·통계·노선 데이터를 잇는 조인 키 마스터 (세계공항·세계항공사 코드, 국내 공항 위치)
      match: {title_regex: '코드|세계공항_정보|공항정보$|_공항 위치정보|_비행장$'}
    - slug: flight-operations
      name: 운항정보 (실시간 출도착·정기운항 스케줄·결항·지연)
      depth: front
      novelty: high
      cycle: realtime
      value_source: 편 단위 실시간 운항·결항·지연 — 모델이 절대 모르는 오늘의 사실. 공항공사·인천공항 두 체계
      match: {title_regex: '운항|스케줄|출도착|항공편|결항|지연|ACDM|주기장|기종 및 등록'}
    - slug: air-transport-business
      name: 항공운송사업 (항공사·취항·사업자)
      depth: front
      novelty: medium
      match: {title_regex: '세계항공사_정보|취항|항공통계_항공사|사업자|사업체|기관및업체'}
    - slug: aviation-statistics
      name: 항공통계 (공항·노선·항공사별 여객·화물·운항 실적)
      depth: front
      novelty: medium
      cycle: monthly
      value_source: 공항·노선별 여객 실적 = 지역 관광·출장 수요, 화물 실적 = 수출입 물류 신호
      match: {title_regex: '.'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 교통물류 - 물류등기타
  decided_at: 2026-09-29
  decided_by: 구름
  doc: knowledge/sectors/교통물류/물류등기타.md
  note: >
    물류시설·화물운송·생활물류·주차장만 남긴 영역. BRM의 '기타' 모음이라 도로 성격(버스·자동차·충전·자전거·교통안전)은 도로로 옮겼다.
    네 영역 모두 등록·허가 원장이 중심이고 사업자번호로 기업 데이터와 이어진다. 원장은 국토부 전국 API 하나 + 지자체 파일 다수 구조라
    지자체 파일은 전국 원장의 부분집합(instance)으로 접어 본다
  subsectors:
    - slug: parking
      name: 주차장 (공영·민영·거주자우선·부설 개방, 실시간 주차 가능)
      depth: front
      novelty: medium
      value_source: >
        전국주차장정보표준데이터(주차장관리번호·좌표·요금·면수)가 원장이고, 실시간 주차 가능 대수는 지자체·공단별 비표준 API.
        두 층(표준 원장 / 지자체 실시간)을 도시에에서 따로 적어야 한다
      match: {title_regex: '주차'}
    - slug: logistics-facilities
      name: 물류시설 (물류창고업 등록·물류단지·물류터미널·물류센터)
      depth: front
      novelty: medium
      value_source: 물류창고업 등록 원장(소재지·면적·보관 종류 상온·냉장·위험물) = 지역 물류 인프라 입지, 사업자번호로 기업과 연결
      match: {title_regex: '물류창고|창고업|물류단지|물류터미널|물류센터|물류부지|물류시설'}
    - slug: parcel-delivery
      name: 생활물류 (택배·EMS·우편물 종적·무인택배함)
      depth: front
      novelty: high
      cycle: realtime
      value_source: 우정사업본부 택배·EMS 신청/행방·국내우편물 종적 = 송장 단위 조회 도구, 무인택배함은 위치 원장
      match: {title_regex: '택배|소화물|배달대행|EMS|우편물|등기통상'}
    - slug: freight-carriers
      name: 화물운송업 (운송·주선·가맹·이사·용달·국제물류주선, 화물통관)
      depth: front
      novelty: medium
      value_source: 화물자동차 운송·주선사업 허가 원장 = "허가받은 운송사·주선사인가", 전국화물자동차운송사업자표준데이터가 기준
      match: {title_regex: '.'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 교통물류 - 도로
  decided_at: 2026-09-29
  decided_by: 구름
  doc: knowledge/sectors/교통물류/도로.md
  note: >
    교통물류에서 가장 크고 기관이 가장 흩어진 영역(국토부·도로공사·국토관리청·지자체·도로교통공단·경찰청·ITS). 유지관리와 유료도로 통행료만 빼고
    대부분 살린다 (구름 2026-09-29). 물류등기타에서 옮겨온 대중교통·자동차·충전·자전거·교통안전도 여기서 세부 부문으로 나눈다.
    핵심 과제는 표준노드링크(link_id·node_id)에 모든 데이터를 붙이는 것 — 도로공사는 콘존ID, 지자체 ITS는 자체 링크 체계라 매핑표가 필요
  subsectors:
    - slug: bus-transit
      name: 버스·대중교통·택시 (노선·정류장·도착·승하차·교통카드)
      depth: front
      novelty: high
      value_source: 정류장·노선 원장 + 실시간 도착(TAGO·지자체 BIS) — 대중 수요 최대. 대중교통 검토 때 더 나눈다
      match: {title_regex: '버스|BUS|BIS|BMS|정류장|정류소|대중교통|TAGO|교통카드|환승|택시|여객터미널|터미널 ?정보|터미널 ?현황|_터미널$|여객운수|여객자동차|기후동행|승용차요일제|나눔카|노선정보|노선마스터|승강장|재차인원|혼잡도|정산사업자|이용자유형|교통수단|수단/목적|최빈교통|평균통행거리|노선별|광역 교통|지하철|도시철도'}
    - slug: bike-pm
      name: 자전거·개인형 이동장치 (공공자전거 대여소·자전거도로·킥보드 주차구역)
      depth: front
      novelty: medium
      value_source: 공공자전거 대여소·실시간 잔여(지자체별 비표준), 자전거도로 노선 GIS
      match: {title_regex: '자전거|킥보드|개인형|이동장치|따릉|누비자|타랑께|페달로|어울링|타슈'}
    - slug: ev-fuel
      name: 충전소·주유소·세차장·휴게소 (차량 서비스 시설)
      depth: front
      novelty: medium
      match: {title_regex: '충전|전기차|전기자동차|수소|주유소|요소수|세차장|휴게소|졸음쉼터'}
    - slug: vehicles
      name: 자동차 등록·검사·정비·렌터카·운전면허
      depth: front
      novelty: medium
      value_source: 자동차 등록·검사(교통안전공단 자동차검사관리시스템)·정비업·렌터카 원장, 차량등록번호·사업자번호
      match: {title_regex: '자동차|차량|이륜차|건설기계|정비업|렌터카|폐차|운전면허|면허'}
    - slug: road-network
      name: 도로망·표준노드링크 (노드·링크·도로명·노선번호·도로중심선·도로대장)
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 표준노드링크(link_id·node_id)는 교통 데이터 전체의 공간 기준 — 국토부 ITS 센터가 SHP로 주기 배포(파일인 마스터)
      match: {title_regex: '노드|링크|도로명|노선번호|도로중심선|도로망|도로현황|도로 현황|도로대장|도로구간|연결구간|도로 ?정보|도보 네트워크|군도|국도|지방도|노선구간|도로\(현황\)|관리영역|고가교|지하도로'}
    - slug: traffic-realtime
      name: 실시간 소통 (링크 속도·통행시간·돌발상황·CCTV·VMS)
      depth: front
      novelty: high
      cycle: realtime
      value_source: 링크별 실시간 속도·돌발 = 오늘의 사실, 이력을 쌓으면 상습 정체 분석 원장 (realtime-query + 이력 적재)
      match: {title_regex: '실시간|소통|돌발|통행시간|VMS|가변전광|CCTV|UTIS|ITS|속도|교통정보|RSE|ARTR|V2X|주의운전|교통예측|패턴정보|서비스수준|교통 ?흐름|지정체|교통지수|교통 ?이슈|교통시설정보|DTG|위험 ?구간|도로_위험'}
    - slug: traffic-volume
      name: 교통량 (상시·수시 조사 지점, 고속도로 영업소 입출구, TCS)
      depth: front
      novelty: medium
      value_source: 조사지점·영업소 단위 교통량 = 상권·입지 분석의 표준 입력
      match: {title_regex: '교통량|통행량|교통조사|교통 조사|TCS|영업소|교통존|기종점|OD|통행실태|교통영향평가'}
    - slug: road-regulations
      name: 규제·단속 (단속카메라·제한속도·보호구역·주정차 금지·신호·횡단보도)
      depth: front
      novelty: medium
      value_source: 무인교통단속카메라·어린이보호구역은 제공표준(전국 통일 형식), 내비 기본 데이터
      match: {title_regex: '단속|제한속도|보호구역|옐로카펫|주정차|신호|횡단보도|과속|무인|교차로|노면|차선|방향표시|잔여시간|일방통행|보행자|전용차로|적색표면|우회전|울타리|무단횡단|장애물'}
    - slug: traffic-accidents
      name: 교통사고 (사고 다발지역·지역별 사고)
      depth: front
      novelty: medium
      value_source: 도로교통공단(TAAS) 다발지역 공간 원장이 대표, 재난안전의 지자체 사고 통계와 겹침
      match: {title_regex: '사고'}
    - slug: road-facilities
      name: 도로 시설물 (터널·교량·지하차도·IC·JC·표지·가로등·방호·육교)
      depth: front
      novelty: low
      value_source: 터널·교량·지하차도는 제공표준 — 지자체 파일 수백 건이 표준 하나로 접힌다
      match: {title_regex: '터널|교량|지하차도|지하보도|톨게이트|IC|JC|나들목|분기점|표지|가로등|보안등|육교|옹벽|방음|낙석|중앙분리대|방호|미끄럼방지|교차시설|시설물|도로시설|반사경|과속방지턱|볼라드'}
    - slug: road-construction
      name: 도로 건설·계획·점용 (사업 단계·개통 예정·점용/굴착 허가·용지 보상)
      depth: front
      novelty: high
      cycle: event
      value_source: 도로 개통 계획 = 지역 접근성 변화의 선행 지표, 점용·굴착 허가는 공사 이벤트
      match: {title_regex: '건설|공사|점용|굴착|계획|개통|확포장|확장|설계|용지|보상|취득실적|국유재산|도로사용허가|기성|공정|품질검사|사후평가|교통개선사업|덧씌우기'}
    - slug: traffic-safety
      name: 교통안전 (안전지수·교통문화·안전시설·교육)
      depth: front
      novelty: low
      match: {title_regex: '안전|교통문화'}
  default: {slug: road-other, name: 도로 기타, depth: back}

- sector: 교통물류 - 해운·항만
  decided_at: 2026-09-29
  decided_by: 구름
  doc: knowledge/sectors/교통물류/해운·항만.md
  note: >
    해수부 단일 소관이라 기관 분산이 적고(해수부·항만공사 4곳·해양교통안전공단·해경), 항공처럼 국제 표준 코드(IMO·MMSI·UN/LOCODE)가 있다.
    선박 등록·항만 시설·입출항·해상 여객·항만 물류 다섯 축만 남김 (구름 2026-09-29). 항공과 구조가 닮아(등록·운항·통계·시설) 상위 그룹 후보
  subsectors:
    - slug: coastal-passenger
      name: 해상 여객 (연안여객선 항로·선사·운임·스케줄·실시간 운항 여부·여객터미널)
      depth: front
      novelty: high
      cycle: realtime
      value_source: 도서 주민·여행객의 결항 여부가 최대 대중 수요. 해양교통안전공단(가보고싶은섬) 운항상태·운항예보가 대표, 지자체·항만공사 것은 instance
      match: {title_regex: '여객|카페리|결항|운항상태|운항예보|기항지|운항 ?스케줄|운항노선|권역 정보|크루즈|선착장|면허항로|운항항로'}
    - slug: vessel-registry
      name: 선박 등록 원장 (선박원부·국제선박 등록·제원·검사·어선)
      depth: front
      novelty: medium
      value_source: 선박원부(선명·톤수·선종·선적항·소유자) = 선박은 등기 자산, IMO·MMSI·선박등록번호가 키
      match: {title_regex: '선박 ?등록|선박원부|제원|선박 ?정보|선박정보|선박 ?검사|선박검사|어선정보|선박마스터|선박국가코드|계선선박|IMO|MMSI|등록선박|국제선박|무단이탈'}
    - slug: vessel-movements
      name: 입출항·운항 (Port-MIS 입출항·선박 위치·항로·관제·도선·예선)
      depth: front
      novelty: high
      cycle: realtime
      value_source: Port-MIS 입출항 신고와 AIS 위치는 선박 추적의 원천. 항만공사 4곳 API는 Port-MIS 아래 instance
      match: {title_regex: '입출항|입항|출항|AIS|V-Pass|위치정보|항로|통항|통행량|도선|예선|예도선|운항정보|선박운항|관제|정박|접안|선석 이용|실시간 교통정보'}
    - slug: port-cargo
      name: 항만 물류 (화물·컨테이너 반출입·물동량·하역·해운 운송사업)
      depth: front
      novelty: medium
      cycle: monthly
      value_source: 항만별 월간 물동량 = 해운 시황 지표, 반출입은 화물 건 단위
      match: {title_regex: '물동량|화물|컨테이너|하역|해운업|선사|항만운송|수출입|환적|TEU|반출입|위험물|운송비용|화물료|운임|수송|혼잡도|항만운영 통계|기항 현황|해운항만물류'}
    - slug: port-facilities
      name: 항만 시설 원장 (항만 목록·부두·선석·하역능력·배후단지·마리나·항만코드)
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 항만코드(UN/LOCODE·해수부 내부 코드 병존, 매핑표 필요)가 입출항·물류를 잇는 키
      match: {title_regex: '항만시설|부두|선석|안벽|크레인|항만정보|항만 ?현황|항만현황|배후단지|마리나|항구|무역항|연안항|하역능력|항만코드|코드 정보|터미널 정보|임대|갑문 정보|시설사용|방파제|코드정보|시설 운영'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 국토관리 - 산업단지
  decided_at: 2026-09-29
  decided_by: 구름
  doc: knowledge/sectors/국토관리/산업단지.md
  note: >
    단지 → 입주기업·공장의 층 구조. 산업단지·입주기업·공장 등록·지식산업센터·산단 통계만 남김 (구름 2026-09-29, 용지·분양·개발은 배제).
    국가산단은 산단공(팩토리온) API가 있고 지방산단은 지자체 파일뿐이라 깊이 차이가 크다. 공장 등록 원장은 사업자번호(기업 축)와 PNU(토지 축)를
    동시에 잇는 몇 안 되는 원장이고, 산단 통계는 산업단지코드로 단지 원장에 붙인다
  subsectors:
    - slug: knowledge-industry-center
      name: 지식산업센터 (승인·준공·위치·입주)
      depth: front
      novelty: medium
      value_source: 산단 안팎의 도시형 공장 집적 건물, 시군구 파일 다수 — 건물관리번호로 건축물대장과 연결
      match: {title_regex: '지식산업센터'}
    - slug: complex-stats
      name: 산단 통계 (생산·수출·고용·가동률·공장등록 통계·산업동향)
      depth: front
      novelty: medium
      cycle: monthly
      value_source: 산단공 산업동향조사(월)·공장등록현황통계 = 지역 제조업 경기 지표. 산업단지코드·시도로 단지 원장에 연결 (구름 "산단 통계까지 연결")
      match: {title_regex: '^(?!.*팩토리온).*(통계|생산실적|생산현황|동향|고용|가동|수출|규모별|업종별)'}
    - slug: factory-registry
      name: 공장 등록 (팩토리온 공장등록·필지·생산정보, 시군구 공장등록 현황)
      depth: front
      novelty: medium
      value_source: 공장등록 원부 = 국내 제조업 전수 명부에 가까움. 사업자번호·KSIC·PNU가 모두 있어 기업·토지·상권과 연결. 팩토리온(산단공) API가 대표
      match: {title_regex: '^(?!.*산업단지및공장정보표준).*(팩토리온|공장|제조업체|제조업)'}
    - slug: complex-tenants
      name: 입주기업 (산단·농공단지·테크노밸리 입주업체)
      depth: front
      novelty: medium
      value_source: 단지별 입주기업 명단(업체명·업종·고용) = 구직·영업 수요, 사업자번호로 공장 등록과 겹쳐 검증
      match: {title_regex: '입주|입지업체|업체 명단|기업정보|기업 등록'}
    - slug: industrial-complex
      name: 산업단지 현황 (전국 산업단지 표준·단지 정보·경계·위치 도면)
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 전국산업단지및공장정보표준데이터·국토부 산업단지 일반현황·경계도면 = 산업단지코드 원장
      match: {title_regex: '.'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 국토관리 - 수자원
  decided_at: 2026-09-29
  decided_by: 구름
  doc: knowledge/sectors/국토관리/수자원.md
  note: >
    물관리 일원화 이후 실제 소관은 기후에너지환경부·K-water·홍수통제소 4곳·농어촌공사·지자체. BRM 국토관리-수자원 + 환경기상-상하수도·수질의
    상하수도·하천·홍수를 합쳐 여섯 영역(수문 관측·홍수 예보/경보·댐/저수지·하천 시설/공간·상수도·하수)만 남김 (구름 2026-09-29).
    관측(실시간 시계열)과 시설·구역(공간 원장)으로 갈리고, 도시에에 관측 주기·결측률·지연이 필수 항목
  subsectors:
    - slug: flood-warning
      name: 홍수 예보·경보 (특보·예보 지점·댐 방류 예고·도시 침수 예보)
      depth: front
      novelty: high
      cycle: event
      value_source: 장마·태풍철 트래픽 폭증 재난 정보. 홍수통제소 4곳 + 환경부, 방송·앱이 그대로 쓰는 시의성 최상 원장
      match: {title_regex: '홍수|특보|예보|경보|방류 ?예고|침수 ?예보'}
    - slug: dam-reservoir
      name: 댐·저수지 (댐 제원·운영·수위·방류, 농업용 저수지 저수율)
      depth: front
      novelty: high
      cycle: daily
      value_source: 댐 운영(K-water)·농업용 저수지 저수율(농어촌공사) = 가뭄·홍수철 필수, 댐코드·저수지코드
      match: {title_regex: '댐|저수지|저수율|저수량|다기능보|하굿둑|보 운영'}
    - slug: hydro-observation
      name: 수문 관측 (수위·유량·강수 관측소, 10분·시·일 자료)
      depth: front
      novelty: high
      cycle: realtime
      value_source: 관측소코드(WAMIS 표준) 기준 실시간 시계열 — 이 영역의 몸통. 홍수통제소 4곳 API는 instance, WAMIS가 전국 통합(자체 키)
      match: {title_regex: '수위|유량|강수|강우|우량|수문조사|수문관측|관측|WAMIS|방류|유입량|조사시설|측정망제원'}
    - slug: river-registry
      name: 하천 시설·공간 (하천 목록·구역·제방·수문·배수펌프장·유역·점용)
      depth: front
      novelty: low
      cross_cutting: true
      value_source: 하천코드(WAMIS)·유역 권역 = 공간 규제 원장(하천구역 안팎은 건축 규제), 국가공간정보포털과 중복
      match: {title_regex: '하천|제방|배수문|수문|소하천|친수|점용|배수펌프|펌프장|유수지|유역|권역|수자원관리도'}
    - slug: water-supply
      name: 상수도 (정수장·취수장·급수구역·수돗물 수질검사·요금·스마트 검침)
      depth: front
      novelty: medium
      cycle: monthly
      value_source: 정수장별 월 수질검사 = 시민 상시 수요, 정수장코드·지자체 상수도사업본부 다수
      match: {title_regex: '상수|정수장|정수시설|취수장|급수|수돗물|배수지|수도|스마트워터|원격검침|계량기|저수조|물공급|누수|요금|가압장|취수량|유수율|양수장'}
    - slug: sewerage
      name: 하수도 (하수처리장·처리구역·방류수·분뇨·정화조)
      depth: front
      novelty: low
      value_source: 하수처리장·처리구역 원장과 방류수 수질(TMS), 지자체·환경공단
      match: {title_regex: '하수|오수|분뇨|처리장|처리시설|정화조|방류수|재이용|TMS|환경기초시설'}
  default: {slug: excluded-rest, name: 제외 대상, depth: back}

- sector: 국토관리 - 국토·도시계획
