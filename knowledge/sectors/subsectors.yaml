    match:
      title_regex: 관광사업|여행업|관광숙박|유원시설|관광편의|호텔 ?등급|관광종사원|관광사업체|관광 ?기업|관광 ?산업|야영장|외국인관광|관광식당|관광업|캠핑장|오토캠핑
