    name: 회수·판매중지·행정처분·부적합·방사능/잔류농약 검사 결과·식중독
    depth: front
    novelty: high
    cycle: event
    value_source: 회수·판매중지는 실시간 소비자 안전, 행정처분은 업소 건별 이력
    match:
      title_regex: 안전성검사|회수|판매중지|행정처분|부적합|위해|방사능|잔류농약|검사 ?결과|이물|식중독|위반
  - slug: imported-food
    name: 수입식품 (수입신고·해외제조업소·수입업체)
    depth: front
    novelty: medium
    match:
      title_regex: 수입식품|수입신고|해외제조|수입업|수입 ?(판매|수산물|축산물|농산물)
  - slug: public-hygiene-businesses
    name: 공중위생업소 (목욕장·이미용·세탁·위생관리용역·위생용품, LOCALDATA)
    depth: front
    novelty: medium
    cross_cutting: true
    match:
      title_regex: 공중위생|목욕장|미용|이용업|세탁|위생관리용역|위생용품|숙박업
  - slug: food-business-licenses
    name: 식품 인허가 업소 (일반/휴게음식점·제과점·집단급식소·제조가공·즉석판매·판매·운반·축산물·건강기능식품 판매)
    depth: front
    novelty: medium
    cross_cutting: true
    value_source: 전국 음식점·식품업소 전수에 가까운 원장 — 상권 분석의 기본, 인허가번호·사업자번호·좌표
    match:
      title_regex: 인허가|업소|음식점|제과점|집단급식소|제조가공|즉석판매|식품판매|소분|운반업|유흥|단란|위탁급식|식육|축산물 ?(가공|판매|운반|포장|보관)|식용얼음|자동판매기|건강기능식품 ?(판매|유통|일반)|영업|카페|폐업|식품접객|급식소|제조업|유통전문|판매업|레스토랑
  - slug: food-product-db
    name: 식품 제품·품목 DB (품목제조보고·바코드·영양성분·원재료·첨가물·기준규격·건강기능식품 품목·레시피)
    depth: front
    novelty: low
    cross_cutting: true
    value_source: 품목제조보고번호·바코드로 제품 단위 조인
    match:
      title_regex: .
  default: *id002
