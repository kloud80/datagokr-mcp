sector_map:
- id: env-eia-to-general
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 환경영향평가 정보(대기질·악취·온실가스·수질 등 항목별)가 환경기상 여러 영역에 흩어져 있어 환경일반 eia로 모음 (Claude가 구름 기준(핵심·개별 객체·실시간 유지, 통계·부수·불규칙 배제, 잘못 등록은 이관) 적용)
  match:
    sector:
    - 환경기상 - 대기
    - 환경기상 - 상하수도·수질
    - 환경기상 - 자연
    - 환경기상 - 폐기물
    - 환경기상 - 해양환경
    - 환경기상 - 환경일반
    title_regex: 환경영향평가|전략환경영향|소규모 ?환경영향|해역이용 ?영향평가|사전환경성|해양환경 ?영향평가|해역이용협의
  set_sector: 환경기상 - 환경일반
- id: env-flood-to-water
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 환경기상에 등록된 홍수통제소·K-water 수문(수위·유량·강우·홍수예보·방류) 데이터 → 국토관리-수자원 (물관리 일원화, 수자원에서 확정)
  match_any:
  - sector:
    - 환경기상 - 환경일반
    - 환경기상 - 대기
    - 환경기상 - 자연
    agency_regex: 홍수통제소
  - sector:
    - 환경기상 - 환경일반
    - 환경기상 - 대기
    - 환경기상 - 자연
    agency_name: 한국수자원공사
  - sector:
    - 환경기상 - 환경일반
    - 환경기상 - 자연
    - 환경기상 - 대기
    title_regex: (_.*(하천|강우량|강우통계|수위|홍수|방류정보|수문)|^[^_]*(하천|강우량|강우통계|수위|홍수|방류정보|수문)[^_]*$)
  set_sector: 국토관리 - 수자원
- id: env-water-supply-to-water
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 상하수도·수질 잔여분의 스마트워터미터·원격검침·저수조·상하수도설비·하수처리장 방류수·상하수도 요금 → 수자원(상수도·하수)
  match:
    sector:
    - 환경기상 - 상하수도·수질
    - 환경기상 - 환경일반
    - 환경기상 - 폐기물
    title_regex: (_.*(스마트워터|원격검침|저수조|상하수도설비|수도|하수처리|방류수|분뇨|정화조|오수|상하수도요금|하수슬러지|공공폐수)|^[^_]*(스마트워터|원격검침|저수조|상하수도설비|수도|하수처리|방류수|분뇨|정화조|오수|상하수도요금|하수슬러지|공공폐수)[^_]*$)
  set_sector: 국토관리 - 수자원
- id: env-ev-to-road
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 환경기상에 등록된 전기차 충전소·전기차 등록 현황 → 교통물류-도로 ev-fuel (충전·주유 시설은 도로에서 확정)
  match:
    sector:
    - 환경기상 - 환경일반
    - 환경기상 - 대기
    title_regex: _.*(전기차|전기자동차).*(충전|등록|보급)|충전소|충전기|충전정보|전기차 ?(현황|등록)
  set_sector: 교통물류 - 도로
- id: env-urban-green-to-parks
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 가로수·도시숲·녹지·화단·광장·공원 점용 등 도시 녹지 → 국토관리-도시계획시설·공원녹지
  match:
    sector:
    - 환경기상 - 환경일반
    - 환경기상 - 자연
    title_regex: 가로수|도시숲|띠녹지|녹지점용|화단|화분대|수벽|교통섬|광장 현황|둘레길
  set_sector: 국토관리 - 도시계획시설·공원녹지
- id: env-forest-to-forestry
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 수목원·산림박물관·산림입지도·산 정보 → 임업·산촌 (산림 복지·자원에서 확정)
  match:
    sector:
    - 환경기상 - 환경일반
    - 환경기상 - 자연
    title_regex: 수목원|산림박물관|산림입지도|100대산|산정보
  set_sector: 농축수산 - 임업·산촌
- id: env-marine-to-fishery
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 해양환경·환경일반에 등록된 국립해양조사원 조위·해양관측, 인공어초·수산자원 보호구역·토산어종 → 해양수산·어촌 (해양 관측·해양공간은 해양수산에서 확정)
  match_any:
  - sector:
    - 환경기상 - 해양환경
    - 환경기상 - 환경일반
    agency_name: 해양수산부 국립해양조사원
  - sector:
    - 환경기상 - 환경일반
    - 환경기상 - 해양환경
    title_regex: 인공어초|수산자원 ?보호구역|토산어종
  set_sector: 농축수산 - 해양수산·어촌
- id: env-energy-to-industry
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 태양광발전 설치·생산, 지역난방 에너지 사용량 → 산업고용-에너지및자원개발
  match:
    sector:
    - 환경기상 - 환경일반
    - 환경기상 - 대기
    title_regex: 태양광|에너지사용량|에너지 ?사용
  set_sector: 산업고용 - 에너지및자원개발
- id: env-animal-to-agri
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 동물보호센터·유기동물(농식품부 동물보호법) → 농업·농촌 (농업 범위 밖이면 그쪽에서 배제됨). 야생동물 구조센터는 자연에 남긴다
  match:
    sector:
    - 환경기상 - 환경일반
    - 환경기상 - 자연
    title_regex: 동물보호센터|유기동물|반려동물
  set_sector: 농축수산 - 농업·농촌
- id: env-general-redistribute
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 환경일반·폐기물에 섞인 지하수·약수터·수질·폐수·비점오염 → 상하수도·수질, 보호종·야생생물 → 자연, 배출시설 → 환경일반, 기상관측(AWS)·예보 → 대기
  match:
    sector:
    - 환경기상 - 환경일반
    - 환경기상 - 폐기물
    title_regex: (_.*(지하수|약수터|관정|수질|비점오염|폐수|수질오염원|인공습지)|^[^_]*(지하수|약수터|관정|수질|비점오염|폐수|수질오염원|인공습지)[^_]*$)
  set_sector: 환경기상 - 상하수도·수질
- id: env-weather-to-air
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 자연·환경일반의 AWS 관측·주간예보·기상센서 → 대기(기상)
  match:
    sector:
    - 환경기상 - 자연
    - 환경기상 - 환경일반
    title_regex: (_.*(AWS|기상관측|주간예보|기상센서|GTS|실내공기질|다중이용시설|대기정보|대기질)|^[^_]*(AWS|기상관측|주간예보|기상센서|GTS|실내공기질|다중이용시설|대기정보|대기질)[^_]*$)
  set_sector: 환경기상 - 대기
- id: env-species-to-nature
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 환경일반의 보호종·야생생물·야생동물 구조센터 → 자연 생물종
  match:
    sector:
    - 환경기상 - 환경일반
    title_regex: (_.*(보호종|야생생물|야생동물|멸종위기|생물종)|^[^_]*(보호종|야생생물|야생동물|멸종위기|생물종)[^_]*$)
  set_sector: 환경기상 - 자연
- id: env-waste-sources-to-general
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 폐기물에 섞인 환경오염 배출시설 → 환경일반 오염원
  match:
    sector:
    - 환경기상 - 폐기물
    title_regex: (_.*(환경오염 ?배출시설|대기배출|배출업소)|^[^_]*(환경오염 ?배출시설|대기배출|배출업소)[^_]*$)
  set_sector: 환경기상 - 환경일반
- id: env-collection-to-waste
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 환경일반의 종량제봉투 판매소·의류/분리수거함·폐의약품 수거함·쓰레기통·소각장 반입 → 폐기물 (수거 지점은 폐기물에서 본다)
  match:
    sector:
    - 환경기상 - 환경일반
    title_regex: 대형폐기물|종량제|판매소|수거함|분리수거|쓰레기통|폐의약품|PP마대|소각장|계근|반입|음식물
  set_sector: 환경기상 - 폐기물
- id: env-gather-general-admin
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정에 흩어진 환경 인허가(대기·폐수·소음진동 배출시설, 폐기물 처리업)·대기질/기상 실시간 → 환경기상 (좁은 표현만)
  match_any:
  - sector: 공공행정 - 일반행정
    title_regex: 대기배출시설|폐수배출시설|소음진동배출시설|배출시설 ?설치|환경오염물질배출
  set_sector: 환경기상 - 환경일반
- id: env-gather-general-admin-waste
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 폐기물 처리업·수집운반·건설폐기물·대형폐기물 → 폐기물
  match:
    sector: 공공행정 - 일반행정
    title_regex: 폐기물 ?(처리업|수집운반)|건설폐기물|대형폐기물
  set_sector: 환경기상 - 폐기물
