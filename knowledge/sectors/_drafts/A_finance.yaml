    sector:
    - 재정금융 - 재정·금융
    - 공공행정 - 일반행정
    - 공공행정 - 국가통계
    agency_name: 국세청
    title_regex: 사업자|휴폐업|국세|세수|환급|공매|체납
  set_sector: 재정금융 - 세제
- id: finance-local-finance-to-local-admin
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 재정금융(재정·금융·기획재정·세제)에 등록된 행안부 지방재정365 → 지방행정·재정지원 local-finance (지방재정 공시는 거기서 확정) — Claude가 구름의 기준(개별 객체 원장·실시간은 살리고, 통계·부수·불규칙은 우선 배제, 오분류는 이관)을 적용해 정함
