keys:
- id: stock_cd
  name: 증권 종목코드 (ISIN 12자리·단축코드 6자리)
  format: ^KR[0-9A-Z]{10}$ / ^\d{6}$
  scope: global
  note: 증권 시세·발행·권리·대차·공시를 잇는 키 (2026-09-29, 재정금융 — Claude가 구름 기준 적용). 법인등록번호로 기업 원장, 연기금 보유 내역(공적연금 pension-fund)과 조인
- id: hs_cd
  name: HS 품목분류코드 (관세청 HSK 10자리)
  format: HS 6자리 / HSK 10자리
  scope: global
  note: 수출입 실적의 품목 키 (2026-09-29, 무역). 농산물 품목코드(agri_item_cd)·어종코드(fish_species_cd)와 농정원·해수부 HSK 매핑목록으로 연결
