sector_map:
- id: finance-institutions-to-finance
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 재정·금융에 섞인 금융위·금감원·예보·예탁결제원·산은·기은·수출입은행·서민금융 데이터 → 재정금융-금융. 재정금융을 금융(자본시장·금융회사·금융상품)과 재정·금융(국가 예산·국유재산/공매·지역사랑상품권)으로 역할 분리 — Claude가 구름의 기준(개별 객체 원장·실시간은 살리고, 통계·부수·불규칙은 우선 배제, 오분류는 이관)을 적용해 정함
  match:
    sector: 재정금융 - 재정·금융
    agency_regex: 금융위원회|금융감독원|예금보험공사|한국예탁결제원|한국수출입은행|한국산업은행|중소기업은행|서민금융진흥원|한국거래소|금융투자협회
    title_regex: ^(?!.*(공매|국유재산|지역사랑|지역화폐)).*
  set_sector: 재정금융 - 금융
- id: finance-nts-to-tax
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 재정·금융·일반행정에 등록된 국세청 데이터(사업자등록 상태조회·국세 공매 등) → 세제 — Claude가 구름의 기준(개별 객체 원장·실시간은 살리고, 통계·부수·불규칙은 우선 배제, 오분류는 이관)을 적용해 정함
