  format: 상가업소번호 (MA0101... 형식)
  scope: global
  note: 상가업소 단위 원장의 키 — 상호·업종(표준산업분류·상권업종분류)·좌표·PNU/건물관리번호 보유. 상권 분석의 공간 기준 (Claude 2026-09-29, 산업고용)
- id: fuel_station_id
  name: 주유소 ID (오피넷 UNI_ID) / 충전소 ID (환경부·한전)
  format: 오피넷 주유소코드 / 충전소ID+충전기ID
  scope: global
  note: 유가·충전 상태 실시간 조회의 키. 도로 ev-fuel(물류등기타에서 옮겨온 파일)과 같은 시설
- id: power_plant_id
  name: 발전소·발전기 식별 (전기사업허가번호·발전기ID)
  format: 전기사업 허가번호 / 전력거래소 발전기 코드
  scope: global
  note: 태양광 발전사업 허가 표준·발전설비·발전기별 발전량을 잇는다. 허가 표준은 주소로 PNU 연결
- id: job_code
  name: 직업·직무 분류 (한국고용직업분류 KECO·NCS 코드)
