review_log: "\n## 산업고용 (2026-09-29, 구름의 기준을 Claude가 적용)\n\n기준: 객체 단위 원장·실시간은 살리고, 통계·보고서·부수·불규칙·기관 운영은 우선 배제. 잘못 등록된 데이터는 제외하지 않고 원래 부문으로 옮김.\n\n- **산업·중소기업일반**: 상가·상권(소상공인 상가업소 API — 상권 분석 기준 원장, 전통시장·대규모점포 포함)·지원사업 공고(K-Startup·중소벤처24)·기업 확인/인증(벤처·이노비즈·창업기업·공공구매\
  \ 인증서)·지역 기업 현황·업종 인허가(LOCALDATA)만 (`sme-deferred`, `sme-non-core`).\n  통신판매·방문판매·다단계는 공정위 API가 전국 원장이라 배제(ftc-non-core와 같은 판단). 내일채움공제·정책자금·재무제표 조사·홈쇼핑 매출·착한가격업소·물가 배제.\n  **대규모점포**: 물류등기타에서 재검토 후보였던 전국대규모및준대규모점포표준데이터는 여기 commercial-stores로 살아 있음.\n\
  - **에너지및자원개발**: 전력 수급·시장(실시간·일별)·발전소/신재생 원장(태양광 발전사업 허가 표준, 활용 37,617)·주유소/유가/충전소(오피넷 실시간)·에너지 사용량(한전 청구 원장 기반 지역×월)·효율등급 제품·광업/토석채취 허가·에너지 업종 인허가·발전소 배출 측정 (`energy-deferred`, `energy-non-core`).\n  가스공사 규격표준 73건·지역난방 플랜트관리/전자계약·연도별/국가별/전망 통계·경영·해외사업\
  \ 배제.\n- **고용노동**: 채용 공고(워크넷·공공기관·장애인 구인 실시간)·직업훈련 과정·직업/직무 사전(KECO·NCS 코드 마스터)·정부지원 일자리사업·산업재해(중대재해 일별·재해사례·산재 판례/판정)·노동조합(표준데이터 활용 25,609)·고용 서비스 기관/강소기업·지역 고용동향(시도×월) (`labor-deferred`, `labor-non-core`).\n  직업정보 동영상·안전보건 미디어·가이드·통계·기관 자체 채용이력·해외취업\
  \ 부수 통계 배제.\n- **산업기술지원**: 제품안전·인증·기술이전/기술은행·소부장 전문/으뜸기업·건설업체(키스콘)만 (`industry-tech-non-core`).\n- **산업진흥·고도화**: 보고서·동향·공모전 위주라 대부분 배제 (`industry-promo-non-core`). 전력거래소 파일 → 에너지.\n- **원자력기술**: 원전 가동·사고고장·안전성능, 환경방사선(실시간)·부지 감시, 방사성폐기물, 방사성동위원소 이용기관\
  \ (`nuclear-deferred`, `nuclear-non-core`). 에너지의 원자력환경공단 데이터를 여기로 모음.\n- **통상**: 무역특화지수(TSI·RCA)·FTA 공지·영상이 대부분이라 전체 배제 (`trade-all`). 수출입·통관·FTA → 무역및투자유치, 업종 인허가·상점 → 산업·중소기업일반.\n- **이관 (배제하지 않고 원래 부문으로)**: 식품 인허가·안심식당 → 식품건강, 공장·제조업체·테크노밸리·지식산업센터·산업입지도\
  \ → 산업단지, 신용보증기금·기술보증기금·파산금융 매물 → 재정금융-산업금융, 수출입/FTA → 무역및투자유치, 다문화·건강가정·성폭력 상담 → 보육·가족, 노숙인·자활센터 → 취약계층, 3D 지도 → 공간정보, 스마트팜 혁신밸리 → 농업, 제주 관광객 카드 → 관광.\n- **병합 때 확인 필요**: 산업단지 keep 정규식에 `산업입지|단지경계|단지유치업종|단지시설용지|스마트공장`이 없어 국토부 산업입지 레이어가 옮겨간 뒤 배제될 수 있음.\n\
  - **전역 키**: `store_id`(상가업소번호), `fuel_station_id`, `power_plant_id`, `job_code`(KECO·NCS). 키 발급처 `opinet.co.kr`, `work24.go.kr`.\n- **맥락(context)**: 새로 local-commerce(동네 상권), energy-grid-realtime(오늘의 에너지), plant-environment(발전·원전 주변 환경), job-search(일자리\
  \ 찾기), regulated-land-use-extraction(광업·채석과 토지 규제). enterprise-axis·localdata-licenses·regional-indicators·what-can-i-build에 멤버 추가.\n"
