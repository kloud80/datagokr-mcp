sector_map:
- id: general-admin-to-qualification
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 한국산업인력공단 국가자격 종목·자격정보 → 평생·직업교육 국가자격 (시험 일정·채용성 공지는 제외 대상)
  match:
    sector: 공공행정 - 일반행정
    title_regex: 국가자격|국가기술자격|국가전문자격|자격정보|자격 ?종목
  set_sector: 교육 - 평생·직업교육
- id: general-admin-to-sgis
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 SGIS·LX맵 → 국가통계 SGIS / 공간정보
  match:
    sector: 공공행정 - 일반행정
    title_regex: SGIS|통계지리
  set_sector: 공공행정 - 국가통계
- id: general-admin-to-geo2
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 LX맵서비스 등 국토정보공사 지도 → 공간정보
  match:
    sector: 공공행정 - 일반행정
    agency_name: 한국국토정보공사
  set_sector: 국토관리 - 공간정보
- id: general-admin-to-lodging
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 지자체 숙박정보·관광 → 관광
  match:
    sector: 공공행정 - 일반행정
    title_regex: 숙박|관광안내소|문화관광
  set_sector: 문화관광 - 관광
- id: general-admin-redistribute
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: '일반행정은 BRM 공공행정의 잔여 모음(10,088건)이라 다른 부문의 개체 단위 데이터가 섞여 있다. 배제하지 않고 원래 부문으로 옮긴다 (Claude, 구름 기준 적용): 의회·의안 → 국정운영, 도서관·서지 → 문화예술, 승강기·시설물 안전·급경사지·재난경보·대피·민방위·무더위쉼터·이재민·방범 CCTV·자율방범·안심귀가·치안센터·경찰서·소방서 → 재난안전-안전관리, AED → 보건의료 응급, 도로굴착 → 도로, 공원 → 도시계획시설·공원녹지,
    따릉이 → 도로, 도로명주소 → 우정 주소, 국가지명 → 공간정보, 토지수용 재결 → 도시개발·정비'
  match_any:
  - sector: 공공행정 - 일반행정
    title_regex: 의회|의안|의원
  set_sector: 공공행정 - 국정운영
- id: general-admin-to-library
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 도서관·서지·대출 도서 → 문화예술
  match:
    sector: 공공행정 - 일반행정
    title_regex: 도서관|서지|대출도서|도서신착|도서인기
  set_sector: 문화관광 - 문화예술
- id: general-admin-to-safety
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 승강기·시설물 안전·급경사지·재난·대피·민방위·쉼터·방범·치안·소방 시설 원장 → 재난안전-안전관리
  match:
    sector: 공공행정 - 일반행정
    title_regex: ^(?!.*(통계연보|교육|채용)).*(승강기|시설물|급경사지|재난|대피|민방위|무더위|쉼터|이재민|방범|자율방범|안심귀가|여성안심|치안센터|경찰서|지구대|소방서|위험물|특정관리대상|다중이용)
  set_sector: 재난안전 - 안전관리
- id: general-admin-to-emergency
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 자동심장충격기(AED) → 보건의료 응급의료
  match:
    sector: 공공행정 - 일반행정
    title_regex: 자동심장충격기|AED|구급
  set_sector: 보건의료 - 보건의료
- id: general-admin-to-road
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 도로굴착·굴착예정지·따릉이·교통사고·자동차 등록 → 도로
  match:
    sector: 공공행정 - 일반행정
    title_regex: 굴착|따릉이|교통사고|자동차 ?등록|전기자동차
  set_sector: 교통물류 - 도로
- id: general-admin-to-parks
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 공원 정보 → 도시계획시설·공원녹지
  match:
    sector: 공공행정 - 일반행정
    title_regex: 공원
  set_sector: 국토관리 - 도시계획시설·공원녹지
- id: general-admin-to-address
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 국토부 도로명주소 도로·건물·검색 → 우정 도로명주소 마스터
  match:
    sector: 공공행정 - 일반행정
    title_regex: 도로명주소|주소조회|단계별주소
  set_sector: 과학기술 - 우정
- id: general-admin-to-geo
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 국가지명·지적기준점·지목 현황 → 공간정보/토지·지적
  match:
    sector: 공공행정 - 일반행정
    title_regex: 국가지명|지명
  set_sector: 국토관리 - 공간정보
- id: general-admin-to-cadastre
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 지적기준점·지목 현황 → 토지·지적
  match:
    sector: 공공행정 - 일반행정
    title_regex: 지적기준점|지목
  set_sector: 국토관리 - 토지·지적
- id: general-admin-to-expropriation
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정의 중앙토지수용위원회 재결 → 도시개발·정비 보상
  match:
    sector: 공공행정 - 일반행정
    title_regex: 토지수용
  set_sector: 국토관리 - 도시개발·정비
- id: general-to-population
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 일반행정·국가통계의 주민등록 인구·세대(시군구·읍면동 × 월) → 지방행정 주민등록 인구 (지역 지표의 분모, regional-indicators). 유동인구·생활인구·실시간 인구는 여기서 옮기지 않는다
  match:
    sector:
    - 공공행정 - 일반행정
    - 공공행정 - 국가통계
    title_regex: ^(?!.*(유동인구|생활인구|실시간)).*(주민등록|인구 ?(현황|동태|이동|통계)|읍면동별 인구|연령별 인구|연도별 인구|리별 인구|세대원수별 세대수|추계인구)
  set_sector: 공공행정 - 지방행정·재정지원
- id: stats-realestate-to-housing
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 국가통계의 한국부동산원 부동산거래현황·임대동향·가격동향 (시군구 × 월 격자) → 주택 (주택 규칙이 가격 동향·지수만 남긴다)
  match:
    sector: 공공행정 - 국가통계
    agency_name: 한국부동산원
  set_sector: 국토관리 - 주택
exclusions:
- id: general-admin-deferred
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: '일반행정은 기관 운영 자료가 대부분 — 홈페이지·게시판·공지·보도자료·채용/시험·성과관리·설문·정보공개·기록물·조직/정원·예산/계약·민원서식·영상/사진·교육·위원회·통계연보·결정례/상담사례·계획·행사·입찰·현수막/광고물·단속/과태료는 먼저 배제 (Claude, 구름 기준: 부수적·불규칙·기관 내부 자료)'
  match:
    sector: 공공행정 - 일반행정
    title_regex: 홈페이지|누리집|게시판|공지|새소식|소식|뉴스|보도자료|채용|시험|합격|성과관리|BSC|설문|만족도|사전정보|정보공개|개인정보|정보목록|기록물|그룹웨어|조직도|부서|정원|직원|공무원|예산|계약|대금|업무추진|민원서식|메뉴|검색어|영상|사진|매뉴얼|교육|위원회|통계연보|연보|발간|전문자료|합성데이터|이행강제금|과태료|단속|평가|결정례|상담사례|사례|중장기계획|도정|시정|구정|행사|일정|입찰|낙찰|용역|보유 ?현황|공용차량|관용차량|식수인원|현수막|광고물|불법
- id: general-admin-non-core
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: '일반행정은 개체 단위 원장만 남긴다: 생활 행정시설(관공서·주민센터·무인민원발급기·공공시설 개방·공중화장실·와이파이·수거함·금연구역·행정사·공유재산·공공기관 정보), 서울 실시간 도시데이터, 상권·유동인구·지역 인허가·지역화폐·착한가격업소. 나머지 배제'
  match:
    sector: 공공행정 - 일반행정
  keep:
    title_regex: 관공서|행정기관|시군구청|주민센터|행정복지센터|무인민원|공공시설|통합예약|예약포털|공중화장실|개방화장실|화장실|와이파이|의류수거함|폐형광등|수거함|종량제|금연구역|흡연구역|지하도상가|행정사|결혼중개|온천|공유재산|공공기관 ?(정보|사업정보)|행정동|행정구역|통리|새마을회관|마을회관|경로|정류|실시간 (도시|인구)|도시데이터|상권|유동인구|생활인구|점포|착한가격|지역화폐|모범음식점|생존율|폐업율|영업상태|업종별 인허가|인허가|집객시설|전통시장|물가
- id: national-stats-index
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: 국가통계의 물가지수·지수류 집계는 통계라 배제 (시장별 물가 정보는 남김)
  match:
    sector: 공공행정 - 국가통계
    title_regex: 지수
- id: national-stats-deferred
  decided_at: '2026-09-29'
  decided_by: 구름
  reason: '국가통계는 통계 모음이라 구름 기준상 대부분 배제. 지역 격자로 다른 데이터에 붙는 것만 남긴다: SGIS 통계지리(집계구·통계주제도 — 지역 통계의 공간 틀), 읍면동 유동인구, 전통시장·대형마트 물가, 체류자격별 외국인. 통계연보·KOSIS·MDIS·정원·보건복지현황 시리즈 등은 배제'
  match:
    sector: 공공행정 - 국가통계
  keep:
    title_regex: SGIS|통계지리|집계구|통계주제도|분석지도|유동인구|전통시장|대형마트|물가 ?정보|체류자격|외국인 ?(인구|수)
subsectors:
- sector: 공공행정 - 일반행정
  decided_at: '2026-09-29'
  decided_by: 구름
  doc: knowledge/sectors/공공행정/일반행정.md
  note: 'BRM 공공행정의 잔여 모음. Claude가 구름 기준(개체 단위·실시간은 활용, 부수적·불규칙·통계는 배제)으로 정리 (2026-09-29): 다른 부문의 개체 데이터는 원래 부문으로 옮기고, 생활 행정시설·실시간 도시데이터·상권만 남김'
  subsectors:
  - slug: realtime-city
    name: 실시간 도시데이터 (서울 실시간 도시·인구 데이터)
    depth: front
    novelty: high
    cycle: realtime
    value_source: 주요 장소별 실시간 혼잡·인구 — 모델이 절대 모르는 지금의 사실
    match:
      title_regex: 실시간 (도시|인구)|도시데이터
  - slug: commercial-area
    name: 상권·유동인구·지역 인허가 (상권 변화·점포 이력·유동/생활인구·착한가격·지역화폐·모범음식점)
    depth: front
    novelty: high
    cross_cutting: true
    value_source: 상권 분석 원료 — 행정동·상권 × 월 격자, 점포·업소 원장. LOCALDATA 인허가와 shared_source
    match:
      title_regex: 상권|유동인구|생활인구|점포|착한가격|지역화폐|모범음식점|생존율|폐업율|영업상태|업종별 인허가|인허가|집객시설|전통시장|물가
  - slug: civic-facilities
    name: 생활 행정시설 (관공서·주민센터·무인민원발급기·공공시설 개방/예약·공중화장실·와이파이·수거함·금연구역·행정사·공유재산·공공기관)
    depth: front
    novelty: medium
    cross_cutting: true
    value_source: 좌표 있는 생활 시설 원장 — 공공시설 개방·무인민원은 표준데이터
    match:
      title_regex: .
  default:
    slug: excluded-rest
    name: 제외 대상
    depth: back
- sector: 공공행정 - 국가통계
  decided_at: '2026-09-29'
  decided_by: 구름
  doc: knowledge/sectors/공공행정/국가통계.md
  note: 통계 모음 — 구름 기준상 대부분 배제하고 지역 격자로 다른 데이터에 붙는 것만 남김 (Claude, 2026-09-29)
  subsectors:
  - slug: sgis-grid
    name: SGIS 통계지리 (집계구·통계주제도·분석지도)
    depth: front
    novelty: low
    cross_cutting: true
    value_source: 지역 통계를 공간에 붙이는 틀 — 집계구·행정구역 경계와 격자 지표
    match:
      title_regex: SGIS|통계지리|집계구|통계주제도|분석지도
  - slug: regional-grid
    name: 지역 격자 (읍면동 유동인구·체류 외국인·시장 물가)
    depth: front
    novelty: medium
    cross_cutting: true
    match:
      title_regex: .
  default:
    slug: excluded-rest
    name: 제외 대상
    depth: back
contexts:
- id: commercial-district
