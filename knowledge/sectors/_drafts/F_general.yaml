review_log: "\n## 공공행정 - 일반행정 · 국가통계 (2026-09-29, Claude — 구름 기준 적용)\n\n- **기준**: 구름이 정한 원칙(분야 핵심·개체 단위·실시간은 활용, 통계·부수적·불규칙은 우선 배제, 잘못 등록된 것은 옮김)을 Claude가 적용.\n- **일반행정 (10,088건)**: 대부분 기관 운영 자료라 먼저 배제(`general-admin-deferred`). 개체 단위 데이터는 원래 부문으로 옮김 —\
  \ 의회·의안 → 국정운영, 도서관 → 문화예술, 승강기·시설물 안전·대피·방범·치안·소방 → 재난안전, AED → 응급의료, 도로굴착·따릉이·교통사고 → 도로, 공원 → 공원녹지, 도로명주소 → 우정, 지명 → 공간정보, 지적기준점 → 토지·지적, 토지수용 재결 → 도시개발·정비, 주민등록 인구 → 지방행정.\n  남긴 것: 실시간 도시데이터(서울), 상권·유동인구·지역 인허가, 생활 행정시설(관공서·주민센터·무인민원·공공시설 개방·화장실·와이파이·수거함\
  \ 등).\n- **국가통계 (1,168건)**: 통계 모음이라 SGIS 통계지리(집계구·주제도)와 읍면동 유동인구·체류 외국인·시장 물가만 남김. 부동산원 거래·임대 동향 → 주택, 주민등록 인구 → 지방행정.\n- **맥락 추가**: `commercial-district`(상권), `realtime-now`(실시간 데이터 묶음), regional-indicators에 SGIS·유동인구 추가.\n- 추가 이관: 국가자격 종목·자격정보 → 평생·직업교육,\
  \ SGIS → 국가통계, 국토정보공사 LX맵 → 공간정보, 지자체 숙박·관광 → 관광. 물가지수는 통계로 배제.\n"
