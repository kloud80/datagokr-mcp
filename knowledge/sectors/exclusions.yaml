    - {agency_name: (재)연구개발특구진흥재단}
    - {agency_name: 과학기술정보통신부, title_regex: '거버넌스 및 전담조직|기관 ?목록|전담조직|전문연구사업자'}
    - {agency_name: 지식재산처, title_regex: 'KIPRIS|특허|상표|디자인|등록원부|분쟁정보|권리자|지식재산정보|지식재산센터'}
    - {agency_name: 한국연구재단, title_regex: 'KCI'}
    - {agency_name: 한국과학기술정보연구원, title_regex: 'ScienceON|AIDA|국가R&D'}

