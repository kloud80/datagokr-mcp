  decided_by: 구름
  reason: >
    과학기술은 국가R&D·(R&D 사업공고)·지식재산·학술문헌만 대상, 나머지 패스 — 출연연 개별 자료, 과학관·교육, 우주환경·천문,
    에너지 자원지도, AI 학습데이터, 연구장비, 한국전통지식 등 (구름 2026-09-28). 기상청 데이터는 제외가 아니라 환경기상으로 이관
