    - {agency_name: 행정안전부, title_regex: '주민등록 (인구|세대|성별|평균연령|출생|사망)|주민등록인구|주민등록 인구|주민등록기준|주민등록 세대|읍면동 하부행정기관|외국인 주민|주민등록업무 행정기관'}
