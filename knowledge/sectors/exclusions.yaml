  decided_by: 구름
  reason: >
    원래 과학기술진흥(BRM)에 있던 데이터는 연구개발특구와 과기정통부 기관 목록 외에는 우선 배제. 단, 앞서 과학기술 대상으로 정한
    지식재산(KIPRIS)·학술문헌(KCI·ScienceON) API는 진흥에 등록돼 있어도 유지 (구름 2026-09-28)
