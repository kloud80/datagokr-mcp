# 프로젝트 대상에서 제외하는 규칙. 빌드(python -m pds build) 때 적용된다.
# 제외된 데이터는 순위 계산·리포트에서 빠지고, DB(pds_dataset_class.excluded_by)에는 표시만 남는다.
# match: 모든 조건을 만족하면 제외 대상. keep: 그중 하나라도 맞으면 살린다.
- id: gov-procurement-non-pps
  decided_at: 2026-09-28
  decided_by: 구름
  reason: 정부조달은 나라장터(조달청)가 원천. 다른 기관 데이터는 자기 기관 계약현황·입찰결과 파일이라 조달청 API로 대체되거나 범위가 좁다 (_review_log.md)
  match:
    sector: 공공행정 - 정부조달
  keep:
    agency_name: [조달청]

- id: ftc-non-core
  decided_at: 2026-09-28
  decided_by: 구름
  reason: >
    공정거래 부문은 공정위의 4개 등록·지정 체인(가맹사업, 특수판매[통신판매·다단계·방문·후원방문·전화권유], 기업집단, 상조[선불식할부])만 대상.
    이 밖의 공정위 데이터(리콜·피해주의보·비교정보, 1372 상담통계, 소비자 민원학습데이터, 하도급 실태조사, 결정문, 기업결합 통계)와
    공정거래 영역에 등록된 다른 기관 데이터(지자체 물가·착한가격업소·통신판매업 파일, 공기업 계량·경영 자료 등)는 제외.
    지자체 통신판매업·정보공개서 파일은 공정위 API가 전국 원장이라 대체됨 (_review_log.md)
  match_any:
    - {sector: 공공행정 - 공정거래}
    - {agency_name: 공정거래위원회}
  keep:
    agency_name: 공정거래위원회
    title_regex: "가맹|페어데이터|기업집단포털|통신판매|다단계|방문판매|후원방문|전화권유|선불식할부|할부거래"

