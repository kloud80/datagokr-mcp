    - {agency_name: 행정안전부 한국지역정보개발원, title_regex: '지방공기업|출자출연|경영|부채|임금|연봉|인원|예산결산|사업보고서|노동조합|유연근무|신규채용|복수노조|주요소송|사건/사고|이사회|정관|타당성|시도코드'}
    - {list_type: STD}

- id: rights-non-complaints
  decided_at: 2026-09-28
  decided_by: 구름
  reason: >
    국민권익·인권은 민원 분석(국민권익위원회 민원빅데이터 분석정보)만 살리고 나머지는 우선 제외 — 청렴·부패신고·고충민원 통계, 인권 자료,
    정보공개 처리현황, 개인정보위 결정문·안내서, 지자체·공기업 잡다한 파일 (구름 2026-09-28). 재검토 여지 있음
