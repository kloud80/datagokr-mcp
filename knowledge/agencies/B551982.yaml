gaps:
  - 클린아이 공시 대상 기관을 코드가 아닌 기관명(ENT_NAME)으로만 식별하며 기관 목록 원장이 개방되지 않아 연도 간·데이터 간 결합이 불안정함
  - 노동조합·이사회의사록·정관·소송·사건사고·사업보고서·타당성검토 API는 응답 열이 resultCode·resultMsg뿐으로 실제 내용 구조 확인 불가
  - 실시간 통합데이터는 현재 상태만 제공하고 이력(시계열) 데이터가 없음
  - 공영 물품보관함 데이터는 보관함 고유 식별자 열이 확인되지 않음
  - 발간자료·연구보고서 FILE은 열 정보가 없는 비정형 문서로 키 연결 불가
  - 정보화마을 운영현황은 마을코드 없이 마을명·시군구로만 식별되며 갱신 여부 불명
  - 초정밀버스 정류장ID가 국토부 표준 정류장ID·TAGO 노드ID와 동일 체계인지 확인 불가
