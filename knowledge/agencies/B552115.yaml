gaps:
  - 발전기 원장(15150482·15096189)이 미검증·열 미공개라 발전기별 경제급전·상태추정·제약발전·휴전계획을 개체 단위로 잇기 어려움
  - 발전기코드는 15064711에만 있고 15099767은 발전기명만 있어 코드↔명칭 매핑표가 비개방
  - 회원사 고유코드가 없고 회사명 문자열로만 연결되며, 사업자번호는 경남 태양광 회원사(15118330)에만 존재
  - 연료원 코드표(fuelTpCd·fuelPwr1~10 의미)가 별도 개방되지 않아 API 간 연료원 정합이 어려움
  - 송전·변전·배전 설비는 연도·지역 집계 통계뿐이고 개별 설비(선로·변전소) 원장이 없음
  - 시군·지자체별 거래량 파일(나주·평창·광주·대전 등)이 단발성 제공으로 갱신 여부 불명확
  - 목록 대다수(약 200건)가 미검증이고 열 정보가 없어 SMP 시간별·전력수급 파일 등의 구조 확인 불가
