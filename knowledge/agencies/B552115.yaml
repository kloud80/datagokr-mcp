note: 한국전력거래소 데이터는 계통운영(EMS 수급·예측), 전력시장 운영·정산(거래량·SMP·정산단가), 지역별 계량, 발전설비, REC·DR 시장, EPSIS 통계, 경영행정으로 나뉜다. 대부분이 거래일·시간·지역·연료원 기준의 시계열 집계로, 개체 단위 키는 발전기(power_plant_id)와 회원사명 정도뿐이며 그마저 원장이 미검증이다. 따라서 시간·연료원·지역 차원으로는 결합이 쉽지만 발전기·사업자 단위 분석은 원장 개방이 선행되어야 한다.
