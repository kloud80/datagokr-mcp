note: 한국중부발전 데이터는 발전운영·환경(TMS)·연료·정비·구매조달·사업개발·인사·경영공시 시스템으로 나뉘며, 발전소·호기가 발전실적·배출량·연료소비·정비를 잇는 사실상 유일한 공통 축이다. 검증된 핵심은 일자별 대기오염물질·석탄재활용·태양광·풍력 API 등 환경·신재생 계열에 집중돼 있고, 설비 원장(15140031)과 입찰·계약 원장은 미검증 상태다. 외부 연계 키는 사업자번호·특허번호·국가코드 정도로 제한적이다.
