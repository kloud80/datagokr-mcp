gaps:
  - 발전소·호기에 표준 코드가 없어 발전소명·호기명 문자열로만 결합해야 하며 데이터마다 표기(발전기명·본부명·사업소·pptnm)가 다름
  - 전력거래소 발전기ID·전기사업허가번호(power_plant_id)가 없어 외부 전력시장 데이터와 직접 연결 불가
  - 입찰공고(공고번호)와 계약정보(15003748 일련번호)·입찰별 참여업체 수 사이에 공통 키가 없어 공고→낙찰→계약 추적 불가
  - 채용·연료정보지·입찰계획·건설현황·REC·정비관리 등 다수 API가 파일번호·파일명만 제공하는 첨부파일 목록형이라 구조화된 원장이 아님
  - 협력기업 외 계약·구매 데이터에 거래처 사업자등록번호가 없어 업체 단위 분석 곤란
  - 경영우수사례·지속가능경영보고서·민원처리 절차 등 다수가 열 정보 없는 문서형이며 임직원·출입·계량 데이터는 합성데이터임
