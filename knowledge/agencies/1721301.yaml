note: 우정사업본부 데이터는 우편번호·주소 DB, 국내 우편물류, 국제우편, 우체국 조직, 우체국금융·쇼핑·알뜰폰, 인재개발원 등 11개 업무 시스템으로 나뉜다. 기관 고유 핵심 키는 우편번호(zip)와 우체국 구분코드로, 소포 물류이동·쇼핑 주문이 이를 통해 우체국 정보·우편번호 DB와 이어진다. 다만 다수 데이터가 요금표·연도별 통계이며 전국 원장 상당수가 미검증·열 미기재 상태다.
