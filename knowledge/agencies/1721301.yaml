gaps:
  - 전국 우편번호 원장(15000302)은 열 정보가 없고 열이 확인된 우편번호 파일은 수원시(15104404) 지역판뿐
  - 등기번호 종적 조회는 건별 조회 API로만 제공되어 우편물 단위 전수 원장이 개방되지 않음
  - 우편집중국 코드 원장이 없어 집중국 간 운송 데이터(15064669·15101060)는 집중국 명칭으로만 연결 가능
  - 연도별 통계(15119xxx 등) 상당수가 열 정보 미기재로 구조 파악·결합이 어려움
  - 우체국쇼핑 판매자·제로페이 가맹점에 사업자등록번호 열이 없어 타 기관 사업자 데이터와 결합 불가
  - 우체통 위치는 서울, 택배물량 상세는 중랑구만 개방되어 전국 비교 불가
  - 우체국위치(3043719)·학사행정·교육플랫폼 데이터는 열 정보가 없어 키 확인 불가
