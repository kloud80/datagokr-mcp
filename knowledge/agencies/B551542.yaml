gaps:
  - 다수 시설 데이터(편의시설현황·엘리베이터 정보·물품보관함·역사 건축현황·월별 권종별 승하차)가 역번호 없이 역명만 있어 역 원장과 이름 매칭에 의존
  - 신호·통신·전기·역무자동·승강장안전문·주요장치 설비 현황은 열 정보가 없어 설비 단위 식별자·구조 확인 불가
  - 계약 관리 정보 API는 열이 미확인이고 입찰공고번호·사업자번호 등 조달 연계 키가 보이지 않음
  - 승강기 고유번호는 대체경로 데이터 1건에만 있고 엘리베이터 정보·승강기 설치현황에는 없음
  - 열차혼잡도는 1호선만 제공되어 전 호선 혼잡 분석 불가
  - 사고발생 내역은 2010~2020년 연도별 집계로 개별 사고 단위 정보와 최신 갱신이 없음
  - 공기질·소음 측정은 '구분'·'구간' 문자열만 있어 역번호 기준 결합이 어려움
  - 부산 역번호와 국가 표준 철도역 코드·교통 노드 코드 간 매핑 데이터가 없음
