note: 부산교통공사 데이터는 역번호(역코드·scode)를 축으로 한 역 원장(역명정보·역사 정보 API)을 중심에 두고, 시각표·운행정보(열차번호), 승하차 통계, 편의·장애인 시설, 설비 현황이 역 단위로 붙는 구조다. 다만 상당수 파일이 역명만 보유하거나 열 정보가 비어 있어 키 기반 결합은 일부 데이터에 한정되며, 외부 연계 키는 승강기 고유번호와 특허 출원·등록번호 정도에 그친다.
