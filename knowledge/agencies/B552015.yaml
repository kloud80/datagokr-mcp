note: 국민연금공단 데이터는 자격(가입·사업장)·징수·급여·심사의 연금 본업 시스템과 기금운용, 기초연금·장애인활동지원 위탁업무, 노후준비서비스로 나뉜다. 개체 단위 원장은 사업장 가입·탈퇴 내역(사업자번호·사업장 식별번호)과 기금 보유종목 정도이며, 나머지는 대부분 지사·지역·연령별 집계 통계다. 지사코드가 내부 실적 데이터를 묶는 유일한 공통 키지만 지사 원장에는 코드가 빠져 있다.
