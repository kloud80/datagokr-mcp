gaps:
  - 가입 사업장 원장의 사업자등록번호가 일부 마스킹되어 타 기관 사업자 데이터와 정확한 1:1 결합이 어렵다
  - 개인 가입자·수급자 단위 원장은 비개방이며 모두 지역·연령·소득구간별 집계만 제공된다
  - 급여 계열(15052xxx, 3040xxx 등) 다수 데이터의 열 정보가 비어 있어 구조 확인·검증이 안 된다
  - 기금 투자종목(국내외 주식·채권, 대량보유)에 종목코드·ISIN이 없어 종목명 문자열로만 증권 데이터와 연결해야 한다
  - 지사·상담센터 목록에 지사코드가 없어 지사코드를 쓰는 실적 데이터와 코드 기반 결합이 불가하다
  - 노후긴급자금 대부·노후준비서비스·장애심사 데이터는 개별 건 식별자가 없는 집계라 이력 추적이 불가하다
  - 징수 데이터에 사업장 식별자가 없어 사업장별 체납·수납 현황은 알 수 없다
