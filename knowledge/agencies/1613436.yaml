note: 국토지리정보원 데이터는 측지 기준(기준점·지오이드), 항공사진·영상 성과, 도엽 단위 수치지도, 국토조사·통계지도, 지도집·지명, 공간정보공동활용 시스템으로 나뉜다. 내부 연결은 사업지구코드·도엽번호·코스/사진번호·측량지구코드 같은 성과관리 키로 이뤄지며, 외부 연계는 유역코드·기관코드 정도에 그친다. 핵심 원장 상당수가 열 정보 없는 공간파일이라 검증된 원장은 측량조서와 수치지도 지도정보 2건뿐이다.
