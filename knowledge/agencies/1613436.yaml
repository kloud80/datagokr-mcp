gaps:
  - 대부분의 핵심 성과(국가기준점·수치지도·정사영상·DEM·연속지적 등)가 열 정보 없는 공간파일로만 제공되어 속성 수준 결합 검증이 어려움
  - 국가기준점 점번호가 표 형태로 공개되지 않아 기준점 단위 식별·조회 키가 없음
  - 연속지적정보(15135218)에 PNU 열이 노출되지 않아 필지 단위로 타 기관 데이터와 연결 확인 불가
  - 도엽코드 원장(15062161)이 열 없이 제공되어 도엽번호 체계 기준표 확인이 어려움
  - 상시관측소 RINEX ID·위성기준점 그룹ID는 단일 데이터에만 있어 관측소 원장과의 연결 불가
  - 국가관심지점(POI)·지명조사철에 지명ID 등 고유 식별자가 공개되지 않아 지명 단위 연계 불가
  - 구 위성영상 데이터는 과거 위성 성과로 갱신이 중단된 것으로 보임
  - 북한 공간정보는 표준 행정구역코드 없이 명칭·오브젝트아이디만 제공
