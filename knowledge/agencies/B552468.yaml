note: 한국산업안전보건공단 데이터는 산업재해 연도별 집계통계와 안전보건미디어 파일이 대부분이며, 개체 단위 원장은 안전인증·검사(사업장관리번호·사업장개시번호·사업자번호·인증번호)와 MSDS(CAS번호), KOSHA GUIDE(지침번호) 정도에 한정된다. 외부 연결은 근로복지공단의 산재보험 사업장관리번호·업종체계와 사업자번호가 핵심이며, 재해·건강·작업환경 분야는 사업장 단위 원장이 비개방이라 집계 수준 분석에 머문다.
