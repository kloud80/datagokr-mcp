gaps:
  - 사업장 단위 재해 원장(재해조사·사업장별 재해발생)은 비개방이며 마이크로데이터는 열 정보가 없어 키 연결 불가
  - 산업재해 연도별 통계 파일이 2021년에서 멈춰 최신 연도 확인이 어려움
  - 사업장관리번호 전수 원장이 없어 사업장 단위로 인증·검사·위험성평가·재해를 묶을 수 없음
  - 위험성평가 인정·KOSHA MS 인증 사업장 목록에 사업자번호·사업장관리번호가 없어 명칭 매칭만 가능
  - 인증서 진위확인 API들은 응답에 인증번호가 없어 인증 원장과 직접 연결 불가
  - 작업환경측정·특수건강진단은 집계 통계만 개방되고 사업장·측정기관 단위 원자료가 없음
  - 미디어자료·실태조사 원시자료 등 다수 파일이 열 메타가 비어 있어 구조 파악 불가
