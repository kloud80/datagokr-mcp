note: 보건복지부 데이터의 대부분은 보건복지통계연보 성격의 시도·연도 집계이며, 같은 표가 FILE과 API로 중복 개방되어 있다. 개체 단위 원장은 e하늘 장사정보, 응급안전안심, 자활정보, 사회복지시설정보, 소관법인 명단 등에 흩어져 있다. 고유 키는 소관법인 허가번호, 장례지도사 교육기관 신고번호, 사업자등록번호 정도에 그치고 시설코드·요양기관기호가 빠져 있어 기관 간 조인은 대부분 주소·명칭에 의존한다.
