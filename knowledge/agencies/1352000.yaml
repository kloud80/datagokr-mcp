gaps:
  - 복지시설 명단(장애인복지관·아동복지시설·산후조리원 등)에 사회복지시설 코드(welfare_facility_cd)가 없어 시설명·주소 매칭에 의존한다.
  - 난임시술·진료정보교류 의료기관 명단에 요양기관기호(ykiho)가 없어 심평원 병원정보와 바로 조인할 수 없다.
  - 응급안전안심서비스 운영기관정보 API는 열이 페이지 메타뿐이어서 운영기관 식별자를 확인할 수 없다.
  - 자활정보시스템 원장(참여자·기관·기업·매출)의 열 정보가 비어 있어 키 구조를 검증할 수 없다.
  - 코로나19 API 계열은 갱신이 중단되어 현행 정보로 쓸 수 없다.
  - 통계 대부분이 시도·연도 집계여서 개별 기관·개인 단위 분석이 어렵다.
  - 장사시설(장례식장·화장시설 등)에 시설 고유 ID가 없어 FILE판과 API판의 대조를 시설명으로 해야 한다.
  - 실태조사·사업안내·장애인식개선 데이터는 열 정보가 없는 문서형이어서 구조화된 활용이 어렵다.
