gaps:
  - 가입자·연금수급자·퇴직자 개인 단위 원장이 비개방이라 직종·지역·연령별 집계 통계로만 분석 가능함
  - 연금취급기관번호(pnsInstNo)가 다른 데이터에 없어 기관별 가입자·징수 실적을 연결할 수 없음
  - 재해보상 접수관리정보(15152802)와 대부·급여·징수·연금고객 테이블(15135626~15135714)은 열 정보가 없어 테이블 정의서 수준에 그침
  - 임대주택 단지에 코드가 없어 단지명 문자열 매칭에 의존하며, K-apt 단지코드 등 외부 키와도 연결할 수 없음
  - 재해보상심의회·재난부조금 등 다수 통계가 1983~2000년 연도 열 구조로 되어 있어 최근 갱신 여부를 확인하기 어려움
  - 표준요양기관코드(15123836)에 기관코드 열이 없어 요양기관기호(ykiho)와 연결할 수 없음
  - 지역 정보가 시도명 문자열 위주이고 시군구 수준은 일부 데이터(15106707, 15151214)에만 있음
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 공무원연금공단 데이터는 대부분 가입자·퇴직자·연금수급자·재해보상·대부·회계에 대한 연도별 집계 통계로, 개인·건 단위 원장은 개방되지 않았다. 개체 단위 원장으로는 연금취급기관정보(API), 징수의무자 정보, 임대주택 단지 주소내역 정도가 있다. 종합재해보상 시스템의 코드 테이블만 내부 키(기안문 화면번호·접수번호)로 서로 이어지며, 외부 기관과는 징수의무자 사업자·법인등록번호로만 연결된다.
