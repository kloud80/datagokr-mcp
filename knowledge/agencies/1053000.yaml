gaps:
  - 국가결산·재무제표·국가채권 데이터 대부분이 열 정보 미확인(미검증)이며 회계·소관 단위 집계라 예산사업 단위 분석은 불가
  - 국유부동산 개별 정보(15087888)의 열이 확인되지 않아 필지(pnu) 단위 연계 여부 불명, 공개 데이터는 대부분 집계표
  - 국고채 데이터에 종목코드(ISIN) 열이 확인되지 않아 거래소 시세·종목 데이터와 키 연계 불가
  - 알리오 파일형 데이터(지정현황·일반현황·재무·채용 등)는 기관명 문자열만 있어 instCd 기반 결합이 어려움
  - 조세조약·FTA·KSP 등은 국가명 문자열만 있고 국가코드(country_cd)가 없음
  - OECD 재산과세·조세지출 등은 연도를 열로 펼친 와이드 형식이라 시계열 결합에 전처리 필요
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 재정경제부 데이터는 국가결산·국유재산·국채시장·거시지표·세제 등 대부분 집계·보고서형 파일로, 개체 단위 원장은 알리오 공공기관 정보 API(15125287)와 시설·사업 API 정도에 한정된다. 기관 간 연결 키는 알리오 기관코드(instCd)와 행정표준기관코드(pbadmsStdInstCd)가 사실상 유일하며, 국고채·국유재산은 종목·필지 키가 개방되지 않아 외부 결합이 어렵다.
