gaps:
  - 역코드-역명 대응 원장(역 마스터)이 개방되지 않아 코드형 API와 역명 열 파일을 정확히 매칭하기 어려움
  - 대부분 파일이 역명·열차번호·연도를 열로 펼친 가로형 집계표라 키 기반 결합이 어렵고 역 신설(서대구 등)·명칭 변경(신경주→경주, 지제→평택지제)으로 열 구성이 파일마다 다름
  - 개별 발권·좌석 단위 원시 거래 데이터는 비개방이며 승차권 일련번호는 진위확인 단건 조회로만 접근 가능
  - 열차운임 및 시간표, 정시운행률, 철도사고통계 등 운영 핵심 자료가 미검증이며 열 정보가 없어 구조 파악 불가
  - 운임표는 출발·도착역 이름만 있어 코드 기반 OD 실적(15108353)과 직접 연계 어려움
  - 차량(편성) 단위 원장이 없어 AED 보유현황의 편성번호를 다른 데이터와 연결할 수 없음
