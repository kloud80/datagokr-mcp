note: (주)에스알 데이터는 여객영업·발매 실적과 열차운영 실적이 중심이며, 대부분 역·열차·월 단위로 집계된 가로형 통계 파일입니다. 키 기반 결합은 역코드(DPT/ARVL/SELLNG_STN_CD), 열차번호(TRN_NO), 노선(ROUTE_NO/NM)을 쓰는 API 몇 건에서만 가능하고, 역 마스터와 운임·시간표 원장이 미개방·미검증 상태여서 연계의 기준축이 약합니다.
