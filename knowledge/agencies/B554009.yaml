gaps:
  - 정책자금 개별 대출 원장이 비개방이고, 지원업체는 내부 업체번호뿐이라 사업자번호 기반 외부 연계가 불가하다.
  - 내일채움공제 가입 원장(가입기업·근로자)이 비개방이고, 청약번호 거래 데이터에 기업 식별자가 없다.
  - 고비즈코리아 업체정보에 사업자번호가 없어 다른 기관 기업 데이터와 결합하기 어렵다.
  - 연수원 수강·수료 데이터에 기업·개인 식별키가 없어 교육 성과와 기업을 추적할 수 없다.
  - 창업사관학교·규제자유특구·수출지원 참여기업 다수가 기업명 문자열만 제공해 정확한 매칭이 어렵다.
  - 동영상·공고문·사례집과 비즈패스파인더 통계 등 열 정보가 비어 있는 FILE이 많고, API 10종은 열 명세가 없다.
  - 비즈패스파인더 통계는 타 기관 통계를 재가공한 것이라 원천 갱신 여부를 확인할 수 없다.
