note: 중진공 데이터는 정책자금 융자, 내일채움공제, 연수원, 고비즈코리아, 수출·창업·인력·구조혁신 지원사업 시스템에서 나오며, 대부분 지원실적 집계 통계다. 기업 단위 연결키는 일부 지정·참여기업 명부의 사업자번호와 정책자금 내부 업체번호뿐이고, 고비즈코리아만 업체·상품·주문번호로 정규화된 테이블 구조를 개방한다. 핵심 원장 상당수가 미검증 상태이며 지원기업 식별이 비식별·기업명 위주라 기관 간 결합성이 낮다.
