note: 한국에너지공단 데이터는 효율기자재·수송·건물 인증 등 제품·건물 인증 원장, 신재생에너지센터 업무, 에너지사용량 신고 기반 통계, 검사대상기기·집단에너지 안전관리로 나뉜다. 기관 고유 인증번호는 대체로 파일·API 한 쌍 안에서만 공유되며, 시스템 간 연결은 사업자번호·업종코드 정도로 제한적이다. 에너지사용·신재생 보급 데이터는 대부분 지역·부문 집계 통계로 공개되어 사업장·설비 단위 원장은 비개방이다.
