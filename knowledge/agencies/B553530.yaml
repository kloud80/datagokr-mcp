gaps:
  - 에너지다소비사업자 신고 원장이 비개방이고 시도·부문별 집계만 공개되어 사업장 단위 분석 불가
  - RPS 설치확인·신재생 보급은 지역·에너지원 집계뿐이며 개별 발전설비 원장과 발전소 식별자가 없음
  - 소비효율등급·자동차 연비·타이어 등급 데이터는 공통 식별번호 없이 모델명·업체명 문자열로만 연결
  - 검사대상기기 설치·검사 데이터에 기기 고유번호가 없어 설치현황과 검사실적을 개체 단위로 잇기 어려움
  - 전기차 급속충전기는 지역별 집계뿐이고 충전기 ID가 없어 타 기관 충전기 원장과 결합 불가
  - 건축물 에너지효율등급·ZEB 인증에 건축물대장 관리번호가 없어 주소 매칭에 의존
  - 에너지사용량·신재생·진단·집단에너지 통계 파일 다수가 열 정보 없이 제공되어 구조 확인 불가
  - ESCO 파일(등록증번호)과 API(민원신청번호)의 식별자가 달라 업체명·사업자번호로만 대조 가능
