gaps:
  - 국가해양생태계종합조사·연안습지·플랑크톤 등 생태조사 자료가 열 정보 없는 보고서형 파일로만 개방되어 정점·종 단위 분석이 어려움
  - 해양쓰레기 모니터링은 지역·연도 집계 통계 위주이며 조사정점 원장과 정점 키가 없음
  - 해양환경측정망과 자동측정망 정점코드 체계가 달라 서로 연결되지 않고, 공간정보(15136739)는 정점코드 대신 자체 일련번호·측정소명만 제공
  - 자동측정망 관측 API(15059977·15059978·15059981)가 후보·미검증 상태라 실시간 관측 원장 신뢰성 확인이 필요
  - 유조선 방제증서는 호출부호만 있어 IMO번호 등 국제 선박 식별자와의 결합이 제한적
  - 해양보호구역·정화사업 공간정보에 해양수산부 보호구역관리번호 등 공식 식별자가 없음
  - 환경보전해역·수질평가지수 등이 해역별 파일로 쪼개져 있고 갱신 주기가 불명확
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 해양환경공단 데이터는 국가해양환경측정망과 해양수질자동측정망의 정점·관측 자료가 검증·핵심의 대부분을 차지하며 정점코드(stnpntCode)로 정점 원장과 관측이 이어진다. 해양쓰레기·정화·방제 영역은 지사 단위 실적 통계와 공간정보 중심이고 개체 키는 방제증서의 호출부호, 공단 선박번호 정도에 그친다. 생태조사·교육·기술자료는 비정형 보고서 파일이 많아 키 기반 연계가 거의 불가능하다.
