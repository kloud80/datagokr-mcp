note: 조달청 데이터는 나라장터 전자조달(발주계획 → 사전규격 → 조달요청 → 입찰공고 → 낙찰 → 계약)을 축으로 쇼핑몰·벤처나라·혁신장터·디지털서비스몰·비축·누리장터가 갈라져 나온 구조입니다. 거래 흐름은 입찰공고번호·조달요청번호·통합계약번호·납품요구번호로, 상품은 목록정보시스템의 물품분류번호·물품식별번호로, 기관과 업체는 수요기관코드와 사업자번호로 이어집니다. 개방 목록의 절반 이상은 공공조달통계시스템의 집계 파일이며, 업체 원장과 제재 정보는 검증되지 않아 업체 단위 분석에 한계가 있습니다.
