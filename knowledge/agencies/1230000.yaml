gaps:
  - 조달업체 등록 원장(15053474)과 면허업종(15053476)이 미검증 FILE이고 열 정보가 없어, 업체 단위 전수 마스터를 확인할 수 없음
  - 계약정보 API(15129427)의 노출 열에 계약업체 사업자번호가 없어, 업체별 계약 실적은 낙찰정보(15129397)를 거쳐야만 연결됨
  - 대금종결 내역(15131015, 15131096)은 업체명·대표자명만 있고 사업자번호가 없어 업체 단위 집계가 어려움
  - 혁신제품 지정정보(15154028)에 업체 식별자와 물품분류번호가 없어 혁신장터 시제품·상품과 직접 연결되지 않음
  - 부정당제재 내역(15137996)이 미검증이고 열 정보가 없어 제재업체와 낙찰자를 대조하기 어려움
  - 공사원가 자원코드·세부공종코드와 조달 물품분류번호 사이의 매핑이 일부(순수자원분류)에만 있음
  - 통계 80여 건은 집계 파일뿐이며 개체 키가 없어 원장과 재조인할 수 없음
  - FILE형 내역 다수(입찰공고·발주계획·우수제품 등)가 열 정보 없이 미검증 상태여서 API와의 정합성을 확인할 수 없음
