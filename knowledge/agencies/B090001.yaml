gaps:
  - 142건 대부분이 열 정보가 없는 보고서 부속 파일이어서 기계적으로 결합하거나 조회하기 어렵습니다.
  - 보고서별 데이터 파일에 발간번호 같은 식별자 열이 없어 해당 발간물 원장(15091316)과 연결할 수 없습니다.
  - 보고서에 쓰인 원천 통계(KOSIS 통계표ID·지표ID 등)를 가리키는 키가 없어 원자료로 거슬러 올라갈 수 없습니다.
  - 예비타당성조사·민간투자사업(PIMAC) 사업 단위 원장은 개방되어 있지 않습니다.
  - KDI 경제정책 시계열 데이터베이스의 시계열 원장은 개방 목록에 없어 경제동향(3083751) 등 집계 파일로만 확인할 수 있습니다.
  - 의견·만족도 조사는 일회성 응답 자료여서 연속적인 비교가 어렵습니다.
  - 연구주제 대·소분류(15049688·15049687)가 개별 보고서 데이터에 열로 붙어 있지 않아 주제별 탐색이 어렵습니다.
