note: 한국개발연구원 데이터는 연구보고서와 정책자료에 수록된 표·그림을 보고서 단위 파일로 개방한 것이 대부분으로, 개체 단위 원장이나 식별자 체계는 거의 없습니다. 원장 성격을 띠는 것은 KDI 발간물 목록, 정기간행물 기사·논문 목록(발간번호 보유), VOD 목록 정도입니다. 다른 기관과 키로 이어지는 관계는 확인되지 않습니다.
