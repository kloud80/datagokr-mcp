note: 인천교통공사 데이터는 도시철도 역사·노선 기준정보(역번호·노선번호)를 중심으로 역무자동화 수송실적, 열차 시각표, 역사 시설·환경·임대 데이터가 역 단위로 붙는 구조다. 그러나 실제 키(역번호)는 역사정보와 시간대별 이용인원 두 곳에만 있고 대부분 데이터는 역명·호선 문자열로만 이어지며, 승강기번호·노선번호 정도가 추가 식별자로 쓰인다. 버스·터미널·주차·교통약자 사업은 키 없는 월별 집계 위주라 다른 데이터와 연계성이 낮다.
