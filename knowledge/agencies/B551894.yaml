gaps:
  - 역번호는 역사정보와 시간대별 이용인원에만 있고, 나머지 대부분(일별 승하차·설비·공기질·임대 등)은 역명 문자열로만 연결되어 표기 차이(역 명, 역사명, 구분(역사명))로 결합이 불안정함
  - 시각표가 역명을 열로 펼친 와이드 형식이고 2호선은 열차번호 대신 순번만 있어 열차 단위 추적·실적 연계가 어려움
  - 교통카드 기반 역간 OD(출발-도착) 데이터가 개방되지 않아 통행 경로 분석 불가
  - 주차장 요금정보에 주차장관리번호가 없어 전국주차장정보표준데이터와 키 결합 불가
  - 임대점포·편의시설 계약현황에 계약번호·사업자등록번호가 없어 임차업체 식별·외부 연계 불가
  - 공기질·소음·전기사용량은 연간·월간 스냅숏 위주이며 측정지점번호가 공사 내부 번호라 다른 기관 측정망과 연계 불가
  - 버스(준공영제·BRT·GRT) 실적에 노선ID가 없어 TAGO·교통카드 노선과 결합 어려움
  - 월미바다열차 이용실적은 연·월 합계뿐이며 역별 실적 없음
