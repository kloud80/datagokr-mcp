gaps:
  - 환경정보공개시스템의 사업장·업체 ID와 사업자번호가 비식별화되어 사업장 단위로 타 기관(대기·폐수 배출시설) 데이터와 연결 불가
  - 환경신기술 인검증 데이터에 기술보유자 사업자번호가 없어 기업 단위 연결이 어려움
  - 환경R&D 성과 데이터에 과제번호가 없어 과제명 문자열로만 묶임
  - 환경정책자금 융자 상세실적에 기업 식별자가 없어 지원기업 추적 불가
  - 석면·가습기살균제 피해구제는 통계만 개방되고 개인·사건 원장은 비개방
  - 환경책임보험 대상시설·업체 사업장 정보 등 다수 원장 파일의 열 정보가 없어 배출시설번호 연계 여부 확인 불가
  - 녹색건축 인증 라이센스에 건축물대장·필지 키가 없어 건축물 단위 연결 불가
  - 해외진출·정책보고서 등 상당수 데이터가 문서형(PDF·영상)으로 구조화되지 않음
