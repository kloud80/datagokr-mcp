note: 한국환경산업기술원 데이터는 환경표지·녹색제품, 환경성적표지, 환경신기술, 환경정보공개, 녹색금융, 생활화학제품, 피해구제 등 인증·지원 업무 시스템별로 나뉘며, 가장 구조화된 축은 환경표지 인증번호·사업자번호·조달 물품식별번호로 묶이는 녹색제품 계열이다. 환경정보공개·정책자금·R&D 계열은 식별자가 비식별화되었거나 없어 내부·외부 연결이 약하고, 다수 데이터가 통계·문서형 보조자료다.
