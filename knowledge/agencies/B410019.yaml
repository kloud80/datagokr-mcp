gaps:
  - LPG충전소·도시가스충전소·수소충전소·LPG판매소에 공사 부여 시설고유번호가 없어 시설 간·사고 데이터와 조인은 주소·좌표에 의존
  - 가스사고 신고 데이터에 사고 대상 시설·업소 식별자가 없어 시설별 사고 이력 분석이 어려움
  - 수소충전소에 환경부·한전 충전소 ID(fuel_station_id)가 없어 무공해차 충전소 데이터와 직접 연결 불가
  - 가스업소 허가·검사 대상 전수 원장(고압가스·LPG 사업자 인허가)은 비개방이고 대부분 시설 데이터는 연도별 집계 통계
  - 가스사고 통계 DB·가스통계 DB·KGS Code·제품인증 현황 등 다수 파일이 열 정보가 없어 구조 확인 불가
  - 가스용품 인증·제조업소 데이터에 사업자등록번호가 없어 타 기관 사업자 데이터와 연결 불가
  - KGS Code 개정 내역은 코드번호 없이 코드명만 있어 기준 목록과 명칭 매칭 필요
