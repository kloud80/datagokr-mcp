note: 한국가스안전공사 데이터는 사고 관리, 가스시설 안전관리, 가스용품·용기 검사·인증, KGS Code 기술기준, 교육, 연구개발 시스템으로 나뉘며 대부분이 연도·지역별 집계 FILE이다. 공사 고유 키는 사고번호, KGS Code 코드번호, 해외제조공장 등록번호, 자산관리번호 정도이고, 외부 연결은 특허 출원·등록번호와 CAS번호가 주된 통로다. 충전소·판매소 등 시설 원장은 고유 ID 없이 주소·좌표로만 식별되어 기관 간 결합은 지역 키에 의존한다.
