note: 교육부 데이터는 초중등의 NEIS·학교알리미, 고등교육의 대학알리미·교육통계서비스, 그리고 커리어넷·교과서·학교안전·재정 등 산하 포털로 나뉩니다. 학교 단위 원장은 NEIS 학교기본정보(neis_school_cd)와 대학 좌표정보(대학 학교코드)가 사실상의 기준입니다. 정보공시·통계 파일 다수는 학교명만 있거나 집계형이고 열 정보가 미검증이어서, 키 기반 결합 범위는 NEIS API군과 일부 검증 파일로 제한됩니다.
