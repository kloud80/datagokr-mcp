gaps:
  - 초중등 학교코드 체계가 NEIS 행정표준코드와 학교알리미 정보공시 학교코드로 이원화되어 있으나 상호 매핑표가 개방되어 있지 않습니다.
  - 유초중등 주소록(15052733)과 학교별 학생수·교원수(15100779)에 학교코드가 없거나 미검증이라 학교 단위 결합이 학교명에 의존합니다.
  - 유치원 데이터는 유치원명만 있고 유치원 고유코드가 없어, 어린이집(childcare_center_cd)이나 타 기관 데이터와 키로 연결할 수 없습니다.
  - 대학 학과·교원양성기관·입학정원 등은 대학명만 제공하여 대학 학교코드(15138981)와의 결합이 문자열 매칭에 의존합니다.
  - 학생건강검사 원자료는 익명 학교 ID만 있어 개별 학교·지역 단위 분석과 학교 정보 결합이 불가합니다.
  - 나이스 초등학교 시간표(15122331)의 열 정보가 학교기본정보와 동일하게 등록되어 있어 실제 시간표 열 구조를 확인할 수 없습니다.
  - 특수교육·보육·돌봄·컴퓨터보유 등은 시도·연도 집계만 있어 기관 단위 원장이 없습니다.
  - 교과서 데이터는 6차 교육과정 등 과거판이 섞여 있습니다. 컨텐츠번호가 한 데이터셋에만 있어 최신 교과서 원장 결합이 어렵습니다.
  - 목록 166건 중 다수(약 140건)가 열 정보가 없는 미검증 파일이라 실제 키 보유 여부를 확인할 수 없습니다.
