gaps:
  - 전기사용 고객번호 단위 원장(계약·검침)은 개방되지 않고 계약종별·지역 집계만 제공된다
  - 전주전산화번호는 지역판 14건 중 경기북부(15069500)만 열 정보가 있고, 나머지는 열 구조를 확인할 수 없다
  - 송전선로·변전소·발전기 개체 원장과 식별자(power_plant_id 등)가 없어 송변전·발전 통계를 설비 단위로 연결할 수 없다
  - 계약·구매 데이터에 사업자등록번호(bizno)가 없어 계약상대자를 외부 기업 데이터와 연결하기 어렵다
  - 사업소 원장(15136756)에 사업소코드 열이 없어 사업소코드를 쓰는 데이터와 직접 조인할 수 없다
  - 목록의 상당수 FILE 데이터와 API 13건은 열 정보가 비어 있어 구조 검증이 불가하다
  - 전력연구원 홈페이지(13년~14년, 2016.12) 등 일부 데이터는 갱신이 중단된 일회성 자료다
