note: 한국전력공사 데이터는 전기차충전서비스운영시스템의 충전소·충전기 원장이 유일하게 검증된 개체 단위 핵심 원장이다. 충전소 ID·충전기 ID로 설비·용량·충전량이 이어지고, 환경공단 연계 코드로 외부와 연결된다. 영업·배전·송변전·PPA 데이터는 대부분 본부·시도·법정동 단위 집계 통계이고, 수요관리 승인번호·전주전산화번호·사업소코드 같은 한전 고유 키는 일부 데이터에만 있으며 미검증 상태다.
