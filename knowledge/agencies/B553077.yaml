note: 소상공인시장진흥공단 데이터의 중심은 상가업소번호(store_id)와 상권업종분류로 구성된 상가(상권)정보 원장이며, 업종 추출본·업소 통계·소상공인365 상권분석이 여기서 파생된다. 두 번째 축은 시장코드 기반의 전통시장·상점가 현황이지만 실태조사·온누리상품권·지원사업 데이터는 시장명으로만 이어진다. 나들가게·손실보상·지정사업·교육시스템 등 사업별 데이터는 서로 공통 키가 거의 없고 사업자번호가 일부에만 있어 외부 연계가 제한적이다.
