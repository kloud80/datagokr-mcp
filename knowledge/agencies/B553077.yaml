gaps:
  - 상가(상권)정보에 사업자등록번호가 없어 국세청·국민연금·신용정보 등 사업자 단위 데이터와 직접 연결 불가.
  - 온누리상품권 가맹점·시장 실태조사·시장경영지원사업에 시장코드가 없어 전통시장 원장과 시장명·주소 문자열로만 매칭해야 함.
  - 나들가게 데이터 간 공통 키 부재(관리번호는 GPS매장정보에만, 현황은 점포명·주소만, 폐업 조회는 사업자번호만).
  - 우수프랜차이즈·백년가게·협동조합 목록에 브랜드관리번호·사업자번호가 없어 공정위 가맹사업 정보 등과 연결 불가.
  - 전통시장 세부(일반현황·시설·편의·홍보시설·매출), 온누리 가맹점 다수, 소상공인365 상권분석 등 다수 데이터가 열 정보 없음·미검증 상태.
  - 정책자금 대출 원장은 비개방이며 포항시 집계 등 일부 지역·집계만 제공.
  - 시도별 업소 통계는 합성데이터로 실제 업소 단위 분석에 부적합.
  - 교육시스템 공통 마스터(15100665)의 열 정보가 없어 마스터코드(FK) 해석 불가.
