  - SGIS 아파트(15144301 아파트코드)·학교(15144296 학교명) 자료가 K-apt 단지코드·학교코드를 쓰는지 확인 불가, 명칭 매칭에 의존
  - KOSIS 목록·통계표 파일 다수가 열 정보가 없어 키 구조 확인 불가(미검증 비중 매우 높음)
  - 2019년 국제인구이동통계, 코로나19 타임캡슐, 마스크 가격 등 일회성·갱신 중단 자료 존재
  - 원격탐사 경지코드 원장(15086654)·통계지역코드(15086660)는 열 정보가 없어 코드 정의 검증 어려움
  - 온라인 수집 가격 품목코드가 소비자물가 품목체계와 같은지 명시 없음
