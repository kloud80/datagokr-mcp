note: 국가데이터처 데이터는 KOSIS(통계표·작성기관)·통계정책관리(승인번호)·MDIS(조사·조사영역)라는 통계 메타 축과, SGIS 통계지리 집계 축으로 나뉜다. 메타 계열은 승인번호·기관코드·통계표ID로 서로 이어지지만, SGIS·조사결과는 행정구역·격자 단위 집계라 지역 키 외 개체 키가 거의 없다. 대부분 미검증 상태이고, 열 정보 없는 파일과 운영성(게시판·로그) 데이터가 많아 실질 핵심 원장은 소수다.
