note: 법제처 데이터는 국가법령정보센터의 법령·행정규칙·자치법규·판례·해석례·조약 DB가 중심이며, 각 영역이 고유ID(법령ID·행정규칙ID·자치법규ID)와 버전별 일련번호(MST)를 이중으로 부여한다. 법령ID·법령일련번호가 별표서식·자치법규 연계·약칭·관보정정을 잇는 허브 키이고, 소관부처·해석기관코드는 행정표준기관코드로 타 기관과 연결된다. 목록 API는 대체로 검증됐으나 본문 API와 정부입법지원센터·간행물 자료는 미검증·비구조 상태가 많다.
