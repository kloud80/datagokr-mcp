gaps:
  - 법령·행정규칙·자치법규·판례·해석례 본문 조회 API 대부분이 미검증이라 조문 단위 내용 활용 범위 확인 불가
  - 법령 연혁 목록(15059149)은 열이 HTML 링크로만 파싱되어 연혁 키 확인 불가
  - 법률공포현황·정부입법 통계·규제관련정보 FILE은 법령ID 없이 법령명만 있어 원장과 정확한 조인 어려움
  - 위원회 결정문·특별행정심판 재결례는 기관별 독립 일련번호·사건번호 체계로 상호 연결 키 없음
  - 규제·해석·판례를 사업자·법인 등 개체와 잇는 키(bizno 등)가 없어 규제 대상 기업 분석 불가
  - 간행물·백서·사례집은 PDF 문서로 구조화된 열이 없음
  - 세계법제정보센터 일부 데이터(오늘의 법령, 부가정보)는 열 미확인이며 갱신 여부 불명
  - 입법예고·입법계획 API가 미검증이고 FILE 입법예고(15123431)에는 법령ID가 없어 입법 단계와 공포 법령 연결 곤란
