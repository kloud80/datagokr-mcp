gaps:
  - 문화 빅데이터 POI(서점·연극장·배리어프리·캠핑 등)에 시설 고유코드가 없어 데이터 간·타 기관(KOPIS·문화기반시설총람) 연결은 시설명·주소·좌표에 의존
  - 전국문화기반시설총람 조회서비스에 시설코드 열이 드러나지 않아 문화포털 문화시설과 키 연결 불가
  - 전통문양·문화디자인·추천공공저작물 FILE 다수가 열 정보가 비어 있어 구조 확인 불가(링크형 이미지 묶음으로 추정)
  - 공공저작물 파일·썸네일 테이블(15133902·15133904)에 저작물코드가 없어 저작물과 파일을 연결할 수 없음
  - 전국 관광지 주변 전기차충전소·시티투어 맛집 API는 열 정보가 없어 충전기 ID 등 외부 키 연결 여부 미확인
  - 중고서점 데이터는 샘플판만 FILE로 검증되어 전수 여부와 갱신 주기가 불명확
  - 문화비 소득공제는 분야별 추정치·FAQ만 개방되어 실제 등록 사업자 목록은 확인 불가
