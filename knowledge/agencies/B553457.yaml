note: 한국문화정보원 데이터는 문화포털, 공공누리 공공저작물, 전통문양·문화디자인 DB, 문화 빅데이터 플랫폼 POI, 실감형 전시플랫폼, 문화기반시설총람, 디지털문화자원 통합서비스로 나뉜다. 시스템 내부에서는 저작물코드·문화예술공간 일련번호·메타아이디 등으로 일부 이어지지만, POI 계열은 고유 키 없이 주소·좌표 중심이어서 기관 간 연결은 지역 키에 의존한다. 106건 중 다수가 열 정보 없는 이미지·링크형 파일이고 검증된 원장은 소수다.
