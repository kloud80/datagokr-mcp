gaps:
  - 다국어·무장애·반려동물·의료관광 API는 수집 열이 code,name,rnum뿐이라 contentId 기반 상세 결합을 검증할 수 없음
  - 데이터랩 관광지코드(tAtsCd·hubTatsCd)와 TourAPI contentId 간 매핑 테이블이 없어 빅데이터 지표를 관광지 상세정보와 직접 잇기 어려움
  - 야영장 등록현황(15037499)에는 등록번호·사업자번호가 없어 고캠핑 contentId와 이름·주소로만 대조 가능
  - 유원시설업체·유기기구 검사현황에 허가번호 등 고유키가 없어 업체명·영업소명 문자열로만 연결됨
  - 사후면세점 목록에 지정번호·사업자번호가 없어 국세청 사후면세 판매장 정보와 키 연계 불가
  - 관광통계는 연·월 집계만 개방되고 원천 출입국 개별 기록(법무부)은 비개방
  - 대한민국구석구석 콘텐츠아이디와 TourAPI contentId가 별도 체계여서 기사-관광지 연결이 불명확
  - 관광안내소·관광사진·한국관광100선 등 다수 FILE 데이터의 열 정보가 미수집 상태
  - 해외시장 조사 일부는 합성데이터로 실제 개별 응답이 아님
  - 관광사진 API의 콘텐츠 아이디는 갤러리 자체 ID로 TourAPI contentId와 연계 여부 확인 불가
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 한국관광공사 데이터는 contentId 기반 TourAPI 관광정보 DB를 중심으로, 고캠핑·두루누비·오디 등 테마 서비스, 데이터랩 빅데이터 지표, 출입국 기반 관광통계 집계로 나뉜다. 기관 내부 공통 키는 TourAPI contentId와 데이터랩 관광지코드 정도이며 서로 매핑되지 않는다. 외부 연계는 고캠핑의 관광사업 등록번호·사업자번호에 한정되고, 유원시설·사후면세점·야영장 등록현황 등은 고유키 없이 명칭·주소로만 연결된다.
