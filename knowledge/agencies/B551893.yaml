note: 한국남동발전 데이터의 중심은 발전실적 API(orgNo+hoki)와 환경감시 API로, 두 영역이 같은 발전소·호기 키로 결합됩니다. 시간대별 발전실적은 별도의 ippt+hogi 체계를 쓰고, 연료·전력거래·폐기물·계약 데이터는 대부분 명칭 기반 FILE이라 키 결합력이 약합니다. 나머지는 경영공시·홍보·인사(합성) 성격의 보조 데이터입니다.
