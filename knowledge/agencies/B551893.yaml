gaps:
  - 발전소·호기 코드 원장(코드-명칭-용량-위치)이 별도로 개방되지 않아 orgNo와 ippt 체계 간 매핑을 알 수 없습니다.
  - 전기사업허가번호·KPX 발전기ID 같은 외부 표준 발전기 식별자가 없어 전력거래소·한전 데이터와 키로 결합하기 어렵습니다.
  - 계약 데이터에 입찰공고번호·계약번호가 없어 나라장터 등 조달 데이터와 연결할 수 없습니다.
  - 다수 FILE 데이터(계약심의·1천만원 이상 계약·사회공헌·감사 등)는 열 정보가 비어 있어 구조 파악이 불가합니다.
  - 인사 데이터는 합성데이터여서 실제 개체 단위 분석에 활용할 수 없습니다.
  - 폐기물 데이터에 올바로 인계번호나 처리업체 사업자번호가 없어 환경부 폐기물 데이터와 결합하기 어렵습니다.
