note: 한국교육학술정보원 데이터는 초중등 영역(나이스·학교알리미·지방교육재정알리미·유치원알리미)과 고등·학술 영역(RISS·대학도서관 통계·KOCW·커리큘럼)으로 나뉜다. 학교 결합의 축은 나이스 교육청코드+행정표준 학교코드이나 학교알리미·재정알리미는 별도 코드 또는 비식별ID를 써서 시스템 간 연결이 약하다. 원장 다수가 미검증 상태여서 열 구조 확인이 우선 과제다.
