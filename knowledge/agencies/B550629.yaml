gaps:
  - 학교알리미·지방교육재정알리미·유치원 공시 데이터 다수가 열 정보 없음(미검증)으로 공시항목 구조 확인 불가
  - 학교알리미 공시공통내역·공시기본정보에 학교코드 열이 없어 학교 단위 결합 불가
  - 지방교육재정 학교별 결산은 층화추출 비식별ID라 실제 학교코드와 연결 불가
  - 폐교·개교예정학교 목록은 학교명·주소만 있고 학교코드 없음
  - KOCW 강의·대학 커리큘럼은 대학명 문자열만 있고 고등교육기관 학교코드(univ_school_cd) 없음
  - 대학도서관 통계 일부(이용·인적자원 등)는 대학/도서관 키가 없어 기관별 연결 불가
  - RISS 논문·해외학술지 API 열 미공개로 논문 식별자 확인 불가
  - 학원교습소는 학원지정번호만 있고 사업자번호 등 외부 결합키 없음
