gaps:
  - 행복e음 수급자·급여 데이터는 집계 통계만 개방되어 개인·가구 단위 원장이 없고, 대부분 열 정보가 비어 있어 구조 검증이 어렵습니다.
  - 어린이집 API·파일(15101155, 15083298, 15126878 등)의 열 정보가 공개되지 않아, 어린이집코드 연결을 1건 외에는 확인할 수 없습니다.
  - 사회복지시설·어린이집·사회서비스 제공기관 데이터에 사업자등록번호나 타 기관 공통키가 없어, 기관 간 연계는 이름·주소 매칭에 의존해야 합니다.
  - 산모신생아·발달장애인 제공기관 목록(15142429, 15127872)과 지역보건기관(15139704)에 기관 식별코드가 없어, 제공기관 API나 다른 데이터와 키로 연결할 수 없습니다.
  - 발달재활 제공기관 목록(15116948)은 2022년 자료만 있어 갱신 여부가 불확실합니다.
  - 디지털의료지원시스템의 약품정보(15090584)에 약품코드가 없어 식약처·심평원 약품 원장과 연결할 수 없습니다.
  - 장애인편의시설(15092317)의 시설ID와 사회복지시설 fcltCd의 대응 관계가 명시되어 있지 않습니다.
