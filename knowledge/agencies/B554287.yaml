note: 한국사회보장정보원 데이터의 절반 이상은 행복e음 기반 복지급여 월별 집계 통계로, 개체 원장 없이 시도·유형별 수치만 제공됩니다. 개체 단위 원장은 사회복지시설(fcltCd), 어린이집(어린이집코드), 복지서비스(서비스ID), 사회서비스 제공기관(제공기관 아이디) 등 시스템별 자체 코드로 관리됩니다. 다만 사업자번호 같은 범용키가 거의 없어 외부 기관과의 연계는 제한적입니다.
