gaps:
  - 실시간 API(발전·방사선·온배수·수문 등)는 목록상 열이 items 래퍼뿐이라 호기·관측지점 코드 구조를 확인할 수 없음
  - 호기명이 '고리2호기'·'고리2발'·'1호기' 등으로 표기가 달라 데이터 간 정확한 조인을 위해 정규화 필요
  - 계약·유자격공급자 데이터에 사업자등록번호가 없어 업체 단위 연계(조달청·국세청 등) 불가
