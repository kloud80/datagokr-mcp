note: 한국연구재단 데이터는 KCI 학술지인용색인(학술지·기관·논문ID), R&D 과제 관리(과제번호), BK21 사업관리(사업단ID·기관코드) 세 축이 핵심이며, 그 외 산학협력 실태조사·간행물·대중확산 데이터는 대부분 집계·문서형이다. KCI는 SERE_ID·INSI_ID·ARTIID로 내부 연결이 잘 되어 있으나 FILE 원장에 내부 ID가 빠져 ISSN에 의존하며, 과제와 성과 간 연결은 과제번호 체계 확인이 필요하다.
