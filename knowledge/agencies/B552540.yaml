  - 이알앤디 과제정보(3049029)에 과제번호가 없어 보고서·성과와 연결 어려움
  - 연구자번호 원장(연구자 정보)은 비개방
  - 대학산학협력 실태조사가 대학구분별 집계만 제공되어 개별 대학 단위 분석 불가
  - BK21 기관코드가 대학알리미 학교코드 등 표준 학교코드와 대응되는지 불명
  - 외국교육기관 정보공시 FILE은 학교 식별자 열이 일부만 공개되어 학교별 결합이 제한적
  - 학술대회ID 원장이 없어 학술대회 운영·심사 데이터 연결 제한
