gaps:
  - LOCALDATA 연계 인허가 표준데이터 약 60종이 모두 미검증이고 사업자등록번호가 없어 다른 기관 사업체 데이터와 직접 결합하기 어렵다
  - 지자체 시설 표준데이터 대부분이 시설 고유ID 없이 명칭·주소·좌표로만 식별되어 시점 간 동일 시설 추적이 어렵다
  - 대학 관련 표준데이터는 학교코드 없이 학교명으로만 연결되어 대학알리미·교육통계와 정확한 결합이 어렵다
  - 도서관 표준데이터에 도서관코드가 없고 도서관도서 표준데이터에는 소장 도서관 식별 열이 없어 장서-도서관 연계가 불가능하다
  - 입찰·계약·낙찰 표준데이터가 모두 미검증이고 낙찰업체 사업자번호 열이 노출되지 않는다
  - 건축인허가 표준데이터는 건축물대장 원장(세움터) 자체가 개방 목록에 없어 인허가-대장 대조가 어렵다
  - 포털 목록조회·검색·중앙개선형 API는 미검증이며 응답 열 일부만 확인되어 목록키 단위 메타 원장 확인이 어렵다
  - 사회복지시설 표준데이터는 8개 열만 제공되어 주소·좌표·정원 등 속성이 부족하다
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 공공데이터활용지원센터는 포털 운영 메타데이터와 함께 전국 지자체·기관이 공통 양식으로 제출한 약 300종의 표준데이터를 통합 개방하며, 원천은 LOCALDATA 인허가, 학구도·NEIS, 국토부 공간정보, 조달, 식품영양DB 및 각 지자체 시설관리 업무로 나뉜다. 기관 공통 연결고리는 제공기관코드(instt_cd)이고, 개체 단위 키는 인허가 관리번호·PNU·건축인허가 관리번호·입찰공고번호·학교/학구ID·식품코드 등 원천 시스템 키를 그대로 사용한다. 대다수 생활시설 표준데이터는 고유키 없이 주소·좌표에 의존한다.
