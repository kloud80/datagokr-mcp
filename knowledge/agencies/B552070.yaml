gaps:
  - 발전소·호기에 표준 코드(발전기ID)가 없고 명칭 문자열(발전소명·사업소·발전기명·pltNm 등)이 데이터마다 달라 정확한 조인이 어렵다
  - 15107452·15107462·15119641·15144541 등 API는 페이징 열만 확인돼 실제 항목 구조를 검증할 수 없다
  - 계약번호는 15065323에만 있어 발주계획(15029419)·계약문서(15064452)·신재생 발주(15117997)와 계약 단위로 연결 불가
  - 협력사·계약업체에 사업자등록번호가 없어 외부 기업정보와 결합 불가
  - 정비적격기업·유자격 품목 심사 결과에 기업 식별자가 없음
  - 32건 가량이 열 없는 보고서·영상·규정 문서로 데이터 분석에 쓸 수 없다
  - 15127606(2023년 단발)·15087279 등 연도 열이 고정된 스냅샷형 자료는 갱신 연속성이 불확실
  - 풍력터빈 식별번호(15151015)·지진번호(15124827) 등은 원장 없이 단일 데이터에만 존재
