note: 한국동서발전 데이터는 발전운영(호기별 실적)·신재생 SCADA·환경감시·연료·폐기물의 운영계 데이터와 계약·경영·총무계 데이터로 나뉜다. 운영계 데이터는 '발전소명+호기'라는 명칭 기반 키로 서로 이어지지만 표준 코드가 없어 명칭 정규화가 필요하다. 핵심 원장 중 설비현황·연료사용·계약현황·SPC·출자 등 다수가 미검증이고, 외부 기관과 이어지는 식별자는 사업자번호·CAS번호·유자격 품목번호 정도로 제한적이다.
