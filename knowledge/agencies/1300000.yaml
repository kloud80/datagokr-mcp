note: 병무청 데이터는 모집병 선발, 병역판정검사, 입영, 사회복무요원, 대체복무 지정업체, 병적관리 시스템으로 나뉩니다. 대부분은 지방청·연도별 집계 FILE이고, 개체 단위 원장은 모집병 군사특기(gsteukgiCd)와 사회복무 복무기관(bmgigwanCd) API, 지정업체 정보가 중심입니다. 외부 기관과 이어지는 키는 지정업체 사업자번호 정도이며, 판정검사 Kdata는 비식별 샘플이라 다른 데이터와 연결되지 않습니다.
