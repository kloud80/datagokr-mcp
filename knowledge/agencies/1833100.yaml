gaps:
  - 지정유산 원장(15034324 API)과 공간정보(3070426)의 열이 확인되지 않아 종목코드·지정번호 구조 검증 불가
  - 발굴허가대장·지표조사 신청현황·발굴보고서 제출목록 사이에 공통 키가 없어 유적명·주소 문자열로만 연결 가능
  - 도난문화재 목록·궁능 수목·세계유산 정보 등에 지정번호(heritage_cd)가 없어 지정유산 원장과 직접 결합 불가
  - 국가유산수리업자 등록번호는 사업자등록번호(bizno)를 포함하지 않아 타 기관 사업자 데이터와 연결 불가
  - 300건 가까운 3D 실측·도면 파일은 열 메타데이터가 없어 개별 데이터를 기계적으로 식별하기 어려움
  - 활용사업 지원 현황·세계유산 관람객 등 통계가 2016~2020년에서 갱신이 멈춤
  - 동물치료 현황통계에 치료소 식별코드가 없어 동물치료소 현황과 기관명 문자열로만 연결
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 국가유산청 데이터는 지정유산 원장(전국 지정문화재 현황 API·공간정보)을 기준으로, 매장유산 발굴·지표조사 행정, 수리업 등록, 궁능 관리, 동물치료, 무형유산 공방 등 업무별 대장이 흩어져 있습니다. 목록의 대부분은 궁궐·종묘·사직단 3D 실측모델링과 도면 파일이며, 국가유산 3D 원형 정보자원 목록이 이들의 색인 역할을 합니다. 데이터 사이를 잇는 키는 사실상 종목·지정번호(heritage_cd) 하나뿐이고, 업무 대장 대부분은 자체 관리번호만 있어 서로 연결되지 않습니다.
