gaps:
  - 범죄통계는 모두 집계표로 사건 단위 원장이 없어 개별 사건 추적·재집계 불가
  - 경찰관서에 고유 관서코드가 개방되지 않아 경찰서별 통계를 명칭 문자열로만 결합해야 함
  - 교통사고 원장(TAAS)과 운전면허 원장은 개인정보로 비개방, 면허·사고 데이터는 연도별 집계만 제공
  - 보호구역 원장에 대상시설명만 있고 학교코드·어린이집코드가 없어 교육부·어린이집 데이터와 키 결합 불가
  - 교통소통·돌발·CCTV·신호·실종경보 등 다수 API의 열 구조가 확인되지 않음
  - 연도가 열로 고정된 파일(2016~2020 등)이 많아 갱신 중단 여부와 시계열 일관성 확인이 어려움
  - 유실물 보관기관ID의 기관 원장이 별도로 개방되지 않음
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 경찰청 데이터는 범죄·사이버범죄·운전면허·교통사고·치안만족도 등 집계 통계 FILE이 대부분이고, 개체 단위 원장은 경찰관서 주소, 보호구역, 유실물(LOST112), 교차로(UTIS), 실종·아동안전 API 정도에 그친다. 기관 고유 키는 유실물 관리ID, 보호구역관리번호, 교차로번호이며, 그 밖의 통계는 관서명·범죄분류 명칭으로만 느슨하게 연결된다.
