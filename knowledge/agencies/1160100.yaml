gaps:
  - 금융통계(FISIS) fncoCd의 금융회사 마스터 목록이 별도 개방되지 않음
  - DART 공시 원문·rcptNo 원장은 금융감독원 소관으로 이 기관 목록에 없음
  - 개인사업자 정보는 비식별 집계라 사업자번호 등 개체 키가 없음
  - 크라우드펀딩정보·서민금융상품·보험상품 데이터에 crno 등 회사 식별키가 없어 기업정보와 결합 어려움
  - 보도자료·의결정보·인허가 공고 등 FILE 데이터는 열 정보가 없어 구조화 활용 불가
  - 모기지론 통계·종합통계·보험통계 일부 API가 미검증 상태로 응답 구조가 불확실
  - 공매·국가자산 물건은 기관 내 다른 시스템과 공유하는 식별키가 없음
