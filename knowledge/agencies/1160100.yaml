note: 금융위원회 데이터는 예탁결제원·거래소·주택금융공사·예금보험공사·캠코·금감원·금융협회 등 산하·유관기관 시스템을 금융위 명의로 개방한 집합체다. 법인등록번호(crno)가 기업정보·증권발행·금융통계·예보 데이터를 잇는 중심 키이고, ISIN(isinCd)·단축코드가 예탁원 발행 원장과 KRX 시세를 연결한다. 금융통계·보험·개인사업자 데이터는 집계 위주로 개체 단위 결합은 제한적이다.
