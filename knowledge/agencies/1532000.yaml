  - 해경서·파출소 표준 코드 마스터가 없어 관서명 문자열 매칭에 의존
  - 수상레저금지구역 개별 파일·낚시어선 분석·영상 등 다수 데이터의 열 구조가 확인되지 않음(공간파일·미디어)
  - 낚시어선업 신고·유선/도선 면허 등 사업자 원장에 사업자번호 등 공통키가 없음
  - 조난사고 API는 2021년판 등 연도 단위로 분절되어 최신 갱신 여부 불명
