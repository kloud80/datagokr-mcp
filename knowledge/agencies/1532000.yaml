note: 해양경찰청 데이터는 해상조난사고·해양오염사고·연안사고 상세 원장과 파출소·출장소·인명구조함 위치 원장을 축으로, 대부분은 연도·관서별 집계 통계와 지역별로 쪼갠 분석·공간·영상 파일로 구성된다. 기관 고유 코드는 파출소 API의 조직ID·기관코드 정도이며, 시스템 간 연결은 주로 해양경찰서·파출소 명칭에 의존한다. 선박 식별자가 없어 타 기관(해수부 선박·항만) 데이터와의 개체 단위 결합은 어렵다.
