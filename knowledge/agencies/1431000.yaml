gaps:
  - KIPRISPlus 대량 파일·REST API 대부분이 열 정보 없이 미검증 상태라 출원번호 등 키 존재를 확인할 수 없음
  - 출원인코드↔사업자번호·법인번호 매핑은 등록원부 API(15124946)에만 있어 미등록 출원 건의 기업 연계가 어려움
  - 특허기술거래(15158849·15158850)에 출원·등록번호 열이 없어 서지 원장과 키로 연결 불가
  - 상표 NICE 상품분류·유사군 코드 원장이 열 단위로 개방되지 않음(15013728 일부만)
  - 주요국 등록디자인 자료집·연구보고서·심사기준은 문서형으로 구조화 데이터 아님
  - 지식재산 통계연보·교육통계 등은 집계 문서로 개체 단위 분석 불가
  - 해외 공보는 국가별 문헌번호 체계가 달라 패밀리(15053794) 외 공통 키가 불명확
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 지식재산처 데이터는 KIPRIS·KIPRISPlus 출원 서지·공보·심사이력과 등록원부가 중심이며, 출원번호·등록번호·출원인코드로 서로 이어진다. 그 외 해외 공보, IPC/CPC·디자인 분류체계, 한국전통지식포털(약재·처방·병증 코드), 표준특허·기술거래·미생물기탁 등이 별도 시스템으로 존재하고, 다수는 문서형 보고서와 AI 학습데이터다. 370건 중 열 정보가 확인된 것은 소수라 핵심 원장 대부분이 미검증이다.
