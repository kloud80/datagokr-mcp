gaps:
  - 개인 단위 가입자·수급자·대여 원장은 개인정보 때문에 개방되지 않는다. 공개 데이터가 대부분 학교급×성별×연령 피벗 집계표여서 개체 단위 분석이 불가능하다.
  - 연금법 적용기관 현황(15081296)에 기관번호가 없다. 기관번호는 임의적용 현황(15112995)에만 있고, 나이스 학교코드·대학알리미 학교코드와 잇는 키가 없어 기관명 문자열로만 매칭할 수 있다.
  - 국내주식 투자정보(15045826)에는 유가증권명만 있고 종목코드(ISIN)가 없어 증권 데이터와 키로 연결할 수 없다.
  - 위탁운용사·제휴업체·구매 계약업체에 사업자등록번호가 없어 다른 기관 데이터와 연계할 수 없다.
  - 통계연보·금융자산 투자현황·시간가중수익률·재정추계 등 다수 파일(15065194, 15065008, 15064963, 15081280 등)은 열 정보가 비어 있어 구조를 확인할 수 없다.
  - 지역별 통계(15119216, 15119221, 15131722 등)는 지역명 문자열 기준이어서 표준 행정코드로 정합하려면 별도 변환이 필요하다.
  - 국민연금·공무원연금과의 공적연금 연계·재직기간 합산 데이터는 건수 집계만 있어 기관 간 키 연계가 불가능하다.
