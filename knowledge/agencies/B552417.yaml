note: 한국기술교육대학교 데이터는 온라인평생교육원 LMS(STEP), 일학습병행 OKLMS, 학사행정, 능력개발교육원·산학협력단·일학습병행대학 홈페이지, 직업능력심사평가원, 공용장비센터의 원천 테이블을 대량으로 개방한 구조입니다. 교과목코드·학과코드·NCS/KECO 분류코드가 학사·OKLMS·원격훈련심사 데이터를 묶는 주된 연결고리입니다. 외부 기관과는 사업자등록번호, NCS, HRD 훈련과정번호로만 이어지며, 거의 모든 데이터가 미검증 상태입니다.
