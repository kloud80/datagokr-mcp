gaps:
  - 훈련기관 인증평가결과(15106977)와 훈련기관 위치정보(15154214)에 훈련기관 고유코드가 없어 훈련기관명 문자열로만 연결해야 합니다.
  - 국가직업훈련사업 실태조사 DB(15040106·15040110·15040111)에 사업코드가 없어 연도 간·부처 간 사업 추적이 어렵습니다.
  - 구매계약내역(15140341)에 계약번호·물품분류번호가 없어 조달청 나라장터 계약과 연계할 수 없습니다.
  - 학습자·학생 단위 식별자가 비식별 인덱스(사용자 인덱스·회원고유번호)뿐이고 원장이 비개방이라 개인 단위 학습이력 분석이 어렵습니다.
  - 온라인평생교육원 과정·과목 아이디의 전수 원장이 명확하지 않습니다. 과정 마스터(아이디·과정명)가 개방되어 있지 않습니다.
  - OKLMS 다수 테이블의 열 목록이 일부만 공개(잘림)되어 교과·분반·학기 결합 구조를 완전히 확인하기 어렵습니다.
  - 대학 자체 학교코드(고등교육기관 학교코드 univ_school_cd)가 없어 대학알리미 등 외부 대학통계와 기관 단위로 직접 연결할 수 없습니다.
  - 입시현황(3074241)이 연도별 가로형 표로 되어 있어 시계열 갱신·결합이 불편합니다.
  - 홈페이지 CMS 테이블(메뉴·팝업·배너·템플릿 등)이 다수를 차지하며 분석 가치가 낮습니다.
