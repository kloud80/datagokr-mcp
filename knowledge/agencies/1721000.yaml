gaps:
  - 국가연구개발사업 과제·성과 원장(NTIS 과제번호 단위)이 개방되지 않아 과제·연구자·기관 단위 분석이 불가
  - 과학기술·이공계인력·여성과학기술인력 통계가 대부분 집계표나 보고서 파일이고 개체 키가 없음
  - 정보통신공사업 시공능력평가 자료에 공사업 등록번호나 사업자번호 열이 확인되지 않아 업체 연계가 어려움
  - 기간통신사업자는 법인등록번호, 알뜰폰은 사업자등록번호로 키가 서로 달라 통신사업자 전수 통합 목록 구성이 어려움
  - 기술무역·용도별 연구개발비 등 일부 통계가 2017~2018년에서 갱신이 멈춤
  - 연구시설장비 API(3040771)의 열 정보가 없어 장비 고유번호 등 키 확인이 불가
  - 통신서비스 통계(가입자·트래픽)가 사업자 식별키 없이 제공되어 사업자 원장과 결합 불가
