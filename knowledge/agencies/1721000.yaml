note: 과학기술정보통신부 데이터는 대부분 KISTEP 등 전문기관이 만든 통계표·보고서·정책문서 파일이며, 개체 단위 원장은 기간통신사업자·알뜰폰 사업자·전문연구사업자 목록, 클라우드 보안인증 현황 정도로 제한적입니다. 이들 원장은 사업자등록번호(bizno)와 법인등록번호(corp_rgst_no)로 국세청·법원 등 외부 기관 데이터와 이어질 수 있습니다. 핵심인 국가 R&D 과제 원장은 비개방이라 연구 분야는 집계 통계 수준에 머뭅니다.
