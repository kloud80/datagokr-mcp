note: 중소벤처기업부 데이터는 벤처확인, 이노비즈, 공공구매종합정보망 등 기업 인증·확인 원장과 기업마당·누리집 지원사업 공고, 창업보육 현황으로 크게 나뉜다. 공공구매 인증과 이노비즈·해외인증 데이터는 사업자등록번호(bizno)로 서로 및 국세청·조달청과 이어지지만, 벤처기업명단·창업 계열은 사업자번호가 없어 명칭 기반 결합에 의존한다. 나머지는 부서별 현황·게시판성 보조 데이터가 다수다.
