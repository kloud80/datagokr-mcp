  - 벤처기업확인서·이노비즈확인서 API는 열 정보가 없고 미검증이라 키 구조를 확인할 수 없음
  - 창업보육센터 입주기업·로컬크리에이터·신기술창업전문회사에 사업자번호가 없어 기업 단위 추적 불가
  - 지원사업 공고만 개방되고 실제 수혜기업(선정·지원 실적) 원장은 비개방
  - 기술개발과제정보에 수행기업 식별자가 없어 R&D 수혜기업과 인증기업 연결 불가
  - 실태조사·통계 링크·기술로드맵·해외조달입찰 등 다수 파일이 열 정보 없는 링크·보고서형으로 구조적 활용 어려움
  - 메인비즈·소상공인·중소기업 확인서 등 중기부 핵심 기업확인 원장은 이 목록에 없음
