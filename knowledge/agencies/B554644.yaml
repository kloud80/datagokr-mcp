  - 광물 가격예측·지수는 결과값만 제공되고 원시 시세 시계열·산출근거가 없으며 일부는 합성데이터
  - 연탄쿠폰·석탄산업 지원금은 집계만 있어 수급자·지원기업 단위 분석 불가
  - 광물정보·교육·출제기준 등 다수 파일은 열 구조가 없는 문서·영상형으로 기계적 활용 어려움
