note: 한국광해광업공단 데이터는 폐광산·광해방지(광해 업무), 국내 탐사·시추 보고서, 해외자원·광물시장 지표, 석탄·연탄 수급·지원 통계의 네 축으로 구성되며 대부분 집계형 파일이다. 개체 단위 원장은 전국 폐광산 위치·폐광일자와 시추·조사보고서 목록 정도이고, 공통 고유코드 없이 광산명·광업지적·광종명으로 느슨하게 연결된다.
