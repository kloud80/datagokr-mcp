gaps:
  - 267건 중 약 200건은 열 정보가 없어 식별자·연결키를 확인할 수 없다.
  - 농업경영체 등록 원장은 비개방(농관원 소관)이다. 경영체 코드가 실제 등록번호인지도 불명확하다.
  - 농사로 작목코드(15137334)·콘텐츠번호의 전수 원장이 없고, 농산물 표준품목코드와의 매핑표도 없다.
  - 병해충 조사지점·예측 기상정보에 지점코드가 없다. 지점명·좌표로만 연결돼 기상청 관측소와 키 연계가 어렵다.
  - 농약 제조·수입·판매업체에 사업자번호가 없고, 농약 등록번호도 열에 노출되지 않아 등록정보와 업체를 연결할 수 없다.
  - 식품성분표(15137360 식품_일련_번호)와 한식재료(15137344 품목번호)의 품목 체계 일치 여부를 알 수 없다.
  - 스마트팜 농가코드·과학영농 센터코드는 단일 데이터에만 있고 원장이 없다.
  - 홍보·발간물 목록은 게시판 덤프 형태라 고유 식별자가 없다. 일부 HRD·경영 게시판은 내부 운영용이라 분석 가치가 낮다.
  - 농식품 소비 품목코드는 자체 체계로, 표준품목코드와 대응 정보가 없다.
