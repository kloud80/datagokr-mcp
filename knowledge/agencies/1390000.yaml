note: 농촌진흥청 데이터는 농사로 포털 콘텐츠 API가 다수를 차지한다. 여기에 병해충(NCPMS)·농업경영(소득분석·경영개선)·농약·식품성분·용어사전 등 전문 시스템별 코드표·원장이 흩어져 있다. 대부분 열 정보가 비어 있고, 기관 밖과 연결되는 키는 농업경영체 코드와 표준품목코드 정도로 약하다. 시스템 내부도 작목코드·통합코드·콘텐츠번호 같은 자체 코드로만 이어진다.
