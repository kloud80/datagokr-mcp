note: 국립해양조사원 데이터는 국가해양관측망 실측, 조석·조류 예보, 수치모델·생활해양예보 등 관측·예보 계열과 해도·해안선·해상구역 GIS 등 공간정보 계열로 나뉜다. 기관 고유키는 관측소 코드(ocean_obs_cd)와 해도번호(chart_no)가 중심이지만, 실측 API 다수가 관측소명·좌표만 제공하여 실제 연결은 대부분 위치 기반에 의존한다.
