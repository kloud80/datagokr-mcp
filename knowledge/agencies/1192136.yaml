gaps:
  - 실측 조회 API(15142506~15142519 등)에 관측소 코드 열이 없고 관측소명(obsvtrNm)·좌표만 있어 관측소 원장과 코드 기반 조인이 어렵다.
  - 최신 관측·조석성과 API(15155508~15156026) 열이 lot·lat만 확인되어 관측소 식별 열 확인이 필요하다.
  - 해양 GIS 레이어 다수가 열 정보가 비어 있거나 Unnamed로만 확인되어 객체 식별자·속성 파악이 불가하다.
  - 일간 관측 파일은 일부 관측소만 개방되어 있고 갱신 여부가 불분명해 전수 시계열은 API에 의존해야 한다.
  - 생활해양예보지수 조회 API는 장소명·좌표로만 지점을 표시해 지점 목록(15145389) 코드와 직접 연결되지 않는다.
  - 항만코드·선박식별번호·기상청 관측지점번호 같은 타 기관 공통키가 없어 해수부 항만·선박 데이터나 기상청 관측과 키 기반 연계가 어렵다.
  - 해양지명·해안선 데이터에 고유 객체 ID 열이 없어 이력 추적·타 데이터 연결이 어렵다.
