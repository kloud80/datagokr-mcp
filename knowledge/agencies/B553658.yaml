gaps:
  - 모든 데이터가 연도·분야 단위 집계 통계입니다. 세부사업·단위사업 코드나 사업별 원장(dBrain 예산·집행 원장)은 개방되지 않아 사업 단위 분석이 불가능합니다.
  - 국고보조금 보조사업자·수혜기관 단위 데이터와 사업자등록번호 같은 식별자가 없습니다. 따라서 다른 기관(국세청·지자체 등) 데이터와 키로 연결할 수 없습니다.
  - '회계·기금, 분야, 소관 부처가 코드 없이 명칭으로만 표기됩니다. 연도마다 표기도 달라(예: 국가균형발전특별회계↔지역균형발전특별회계, 문화재청↔국가유산청) 시계열 결합 시 명칭 매핑이 필요합니다.'
  - '재정통계 BRIEF와 일부 주요 재정통계 파일(예: 15064986, 15065184, 15065998, 15160380 등) 다수는 열 정보가 비어 있어 구조를 확인할 수 없습니다.'
  - 재정통계 BRIEF는 발간 시점의 일회성 스냅샷이 많아 지속 갱신 여부가 불확실합니다.
  - 같은 지표가 주요 재정통계·BRIEF·부록에 중복되고, 연도 열 이름(연도·연간·년도·기준년)과 단위(조원·억원)가 제각각입니다.
