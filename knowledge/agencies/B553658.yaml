note: 한국재정정보원 개방 데이터는 dBrain 예산·결산 원장을 연도별로 집계한 '주요 재정통계'와 그 요약판 '재정통계 BRIEF'가 대부분입니다. 여기에 회계·기금 운용 구조와 국고보조금(e나라도움) 예산현황이 소수 더해집니다. 개체 단위 원장이나 고유 식별코드는 개방되지 않으며, 유일하게 회계·기금명이 데이터 사이를 잇는 약한 명칭 키 역할을 합니다.
