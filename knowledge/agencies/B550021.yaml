gaps:
  - 166건 모두 열 정보가 비어 있어 고유번호·접수번호 등 키 열 이름을 확인·검증할 수 없음
  - 거의 모든 항목이 FILE판과 API판으로 중복 개방되어 있음. FILE판은 갱신 시점·범위 확인이 필요함
  - FISIS 금융회사 목록(금융회사코드 원장)이 개방되지 않아 은행경영통계를 DART 기업이나 개별 금융회사와 키로 연결하기 어려움
  - 공시 의무가 없는 비상장·비외감 기업은 원천적으로 포함되지 않음
  - 임원·주요주주·대량보유자 등 개인 보고자의 고유 식별자가 없어 인물 단위로 연결·추적하기 어려움
  - 검사·제재 내역, 민원·분쟁조정, 인허가 금융회사 현황 등 감독업무 원장은 개방 목록에 없음
  - RBC·자산건전성 해설서는 문서 자료이고, IT인력현황은 집계표라서 개체 단위 분석이 불가능함
