note: 금융감독원 개방 데이터의 98%(162건)는 DART 전자공시시스템에서 나온다. DART 고유번호(corp_code)로 회사를, 접수번호(rcept_no)로 공시서류를 식별하며, 고유번호·기업개황·공시검색이 기준 원장이고 나머지 보고서별 주요정보는 이를 참조하는 구조이다. FISIS 은행경영통계와 감독 해설서는 별도 계열이며 DART와 이어지는 공통 키가 없고, 전 목록이 열 정보 미제공·미검증 상태이다.
