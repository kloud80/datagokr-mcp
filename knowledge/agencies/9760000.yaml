note: 중앙선거관리위원회 데이터는 선거ID·선거종류코드를 축으로 하는 선거정보 OpenAPI(코드 정보가 기준 원장)와, 키 없이 지역 명칭으로만 구성된 개표결과·투표율 분석·의식조사 파일군으로 이원화되어 있다. 핵심 원장은 코드 정보(선거 목록)와 후보자·당선인·투표소 정보, 그리고 투표구 단위 개표결과 파일이며, 파일과 API 간에는 공통 식별자가 없어 선거일·지역명 매칭이 필요하다.
