gaps:
  - 개표결과 파일에 선거ID·투표구코드·행정동코드가 없어 API 데이터나 행정구역과의 결합은 시도·구시군·읍면동 명칭 매칭에 의존
  - 후보자ID(huboid)는 후보자 통합검색에만 노출되어 후보자·당선인·공약·개표결과를 후보자 단위로 정확히 잇기 어려움(성명+선거구명 조합 필요)
  - 정당 고유코드가 없어 정당명 문자열로만 정당별 집계·연결 가능
  - 투표율 분석 다수(15100196, 15116184 등)와 제21대 대선 의식조사(15150182)가 미검증·열 정보 없음
  - 투표율 분석은 보고서형 엑셀(Unnamed 열)이라 기계 판독·시계열 통합이 어려움
  - 유권자 의식조사는 문항 코드(Q1, SQ1 등)만 있고 코드북이 목록에 없어 해석 곤란
  - 재보궐선거 개표결과(15082974)는 열 구조가 깨져 있어 활용 어려움
