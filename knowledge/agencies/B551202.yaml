gaps:
  - 보훈병원·위탁병원에 요양기관기호(ykiho)가 없어 심평원 병원정보와 직접 결합하기 어렵다(사업자번호·명칭 매칭에 의존).
  - 3075427 위탁병원 현황에 기관코드가 없어 위탁병원 정보(15129051)·계약·해지 이력과 키로 바로 잇기 어렵다.
  - 환자·입소자 단위 원장은 비개방이다. 환자번호도 일부 데이터에만 있어 진료 이력 추적이 불가능하다.
  - 6개 병원 지역판의 열 이름·구성이 제각각이고(상병코드/상명코드/코드 등), 일부는 열 정보 자체가 없다(15066432, 15088558, 15089748 등).
  - 보훈병원 현황(15088536)의 기관코드는 체계가 불분명해 외부 키로 쓰기 어렵다.
  - 의료장비 현황에 장비 식별번호나 UDI가 없어 식약처 의료기기 데이터와 연결되지 않는다.
  - 코로나19·재활·응급 통계는 특정 연도 단발성 집계로, 갱신이 중단된 것으로 보인다.
  - 국가유공자 대상자 원장은 국가보훈부 소관으로 이 기관 데이터에는 없다.
analyzed_by: claude-opus-5-5
