note: 한국보훈복지의료공단 데이터는 6개 보훈병원 EMR에서 나온 병원별 지역판 통계·코드표가 대부분이며, 서울요양병원·보훈요양원·휴양원·ERP·기록관리 시스템의 운영 통계가 뒤를 잇는다. 유일한 검증 핵심 원장은 위탁병원 현황(3075427)으로 사업자번호를 매개로 하고, 그 밖에는 KCD 상병코드·EDI 수가코드가 기관 내외 연결의 주된 키다. 개체 단위 원장과 표준 의료기관 식별자가 부족해 외부 결합성은 낮다.
