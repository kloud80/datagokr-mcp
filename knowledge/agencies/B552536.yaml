note: 한국산업기술진흥원 데이터는 KIAT 통합사업관리의 R&D 성과(NTIS 연계), 국가기술은행 기술정보 API, 녹색인증·소재부품 신뢰성인증이라는 세 축으로 구성된다. 성과 데이터는 접수번호와 NTIS 순번으로 서로, 그리고 KISTEP NTIS와 이어진다. 반면 과제번호와 기업 사업자번호가 대부분 빠져 있어 과제·기업 단위로 데이터를 결합하기는 어렵다.
