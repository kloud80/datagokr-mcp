note: 산업통상부 데이터는 대부분 산업·무역·에너지·표준 분야의 연도별 집계 통계입니다. 개체 단위 원장은 광업권 행정처분, 주유소 등록, 이러닝 사업자, 무역구제 조사·관세 부과, 내국거래 API 정도로 제한적입니다. 기관 고유 키는 무역구제 조사원장아이디, 광업지적, 소재부품장비코드가 있으나 해당 원장은 모두 비개방입니다. 외부와는 주로 HS 물품코드·사업자번호를 통한 내국거래 API로 연결됩니다.
