note: 한국장애인고용공단 데이터는 의무고용·부담금·장려금, 표준사업장, 취업지원, 근로지원인, 사업주 고용지원, 직업능력평가·훈련, 연구·조사의 업무 시스템으로 나뉜다. 사업체 단위로 실제 연결 가능한 키는 사업자등록번호뿐이며, 표준사업장 원장·근로지원비용·고용컨설팅·근로지원인 수행기관에만 들어 있다. 고용의무·부담금 쪽은 집계 위주이고 개인 데이터는 비식별이어서, 개체 단위로 데이터를 잇기에는 한계가 크다.
