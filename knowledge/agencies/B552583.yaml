gaps:
  - 의무고용 적용 사업체별 고용현황·부담금 신고 원장이 비개방이다. 지역·업종·규모별 집계만 있어 사업체 단위 분석이 어렵다.
  - 구인정보(3072637·15117692)에 사업자등록번호가 없어 표준사업장·지원 데이터와는 사업장명으로만 연결할 수 있다.
  - 구직자·취업·취업성공패키지·평가도구 데이터는 비식별 연번뿐이다. 개인 단위로 구직→훈련→취업 경로를 추적할 수 없다.
  - 명단공표(15014779)·연계고용사업장(15067959)에 사업자번호가 없어 외부 사업자 데이터와 결합하기 어렵다.
  - 구인정보의 모집직종이 명칭으로만 제공되어 고용직무분류 코드(15157071)와 코드로 연결되지 않는다.
  - 실태조사·패널조사·직업정보 콘텐츠 다수는 열 정보가 없는 파일(원문·보고서)이라 구조화된 분석이 어렵다.
  - 지역별 업종별 장려금 현황은 2010~2011년, 기능경기 연도별 직종 현황은 1992~2009년에 그쳐 갱신이 중단된 것으로 보인다.
