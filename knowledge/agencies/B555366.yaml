note: 서울주택도시공사 데이터는 공공임대주택 단지 현황(15099541)을 중심으로 공급계획·임대조건·자치구별 집계가 둘러싸고, 도시개발(마곡·세운·문정·공공재개발)과 계약·재무·경영지원 데이터가 별도로 개방되어 있다. 기관 고유 코드 체계가 거의 노출되지 않아 단지명·자치구 같은 명칭·지역 단위로만 결합이 가능하며, 다수가 집계·계획 성격의 FILE 데이터이고 절반 이상이 미검증 상태다.
