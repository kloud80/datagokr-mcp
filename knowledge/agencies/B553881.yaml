note: 한국교통안전공단 데이터는 자동차검사·튜닝·리콜 등 자동차 안전관리, 운행기록·운수종사자 등 사업용 운수 관리, 철도·궤도·항공·드론 안전, 주차·대중교통 정보의 여러 업무시스템에서 나오며 상당수가 집계통계다. 시스템 내부는 검사소코드·접수일련번호·노선/노드ID·주차장 관리번호·개인특정코드 등 고유키로 묶이고, 외부와는 사업자번호·차대번호·차량번호·표준링크ID·경찰청사고번호로 이어진다. 다만 차량·운수종사자 단위 원장은 대부분 비개방이라 개체 단위 결합은 제한적이다.
