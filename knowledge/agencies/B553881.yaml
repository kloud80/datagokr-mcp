gaps:
  - 자동차검사관리시스템 데이터 다수가 샘플·코드표이며 차량 단위 검사이력 원장은 비개방, 다수 미검증 셋은 열 정보도 없음
  - 자동차종합정보 API는 응답 열이 dtaCo(건수)뿐이라 차량·사업자 단위 연결 키를 확인할 수 없음
  - 운수종사자·운수회사 원장이 비개방이고 통계만 제공되어 개별 운수회사 안전성 분석 불가
  - 드론 기체 신고·조종자 자격 원장은 비개방, 사용사업체(군집드론)만 개체 단위
  - 철도사고 데이터에 사고번호가 없어 사고·준사고·사상자 데이터 간 건 단위 연결 불가
  - 기계식주차장 설치현황에 관리번호가 없어 검사·운행중지·과태료·보험 데이터와 연결 불가
  - 대중교통 최다이용 정류장·교통카드 통계에 정류장ID가 없어 BIS 정류장 원장과 연결 어려움
  - 교육영상·홈페이지 게시판 등 미검증 셋은 열이 비어 구조 파악 불가, 일부(대전 택시 통계 등)는 갱신 중단 추정
