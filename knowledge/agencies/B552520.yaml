note: 한국남부발전 데이터는 발전실적·급전속보·환경측정 API(검증·핵심)를 중심으로 하고, 나머지 대다수는 사업소별 태양광 실적 파일과 경영공시성 정적 파일로 구성된다. 사업소·호기(플랜트·호기)가 발전량·연료·환경 데이터를 잇는 사실상의 유일한 공통 키이나 코드 원장이 없어 명칭 기반 결합에 의존한다. 구매·출자·R&D 영역은 고유번호 체계가 공개 열에 거의 드러나지 않아 기관 내외 연계성이 낮다.
