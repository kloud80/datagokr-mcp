  - 사이트별 태양광 발전실적 파일 다수가 시간 열만 있고 일자·발전소 열이 없어(15043395, 15109994, 15124860 등) 단독 활용·결합이 어려움
  - AI 학습용 데이터(15090177, 15153671, 15156952, 15156953)와 탄소포인트 자료는 열 정보가 없음
  - 입찰공고(15125329)·용역입찰(15109978)·계약체결(15095366) 사이에 공통 공고·계약번호가 없어 입찰-계약 추적 불가
  - 출자회사·SPC 데이터에 법인등록번호·사업자번호가 없어 타 기관(공시·국세) 데이터와 연결 불가
  - 급전속보·SMP·전력수급은 전력거래소 원천 재가공으로 거래소 발전기 ID와의 매핑이 없음
  - 다수 경영공시성 파일이 연도 열 형태의 정적 집계로 갱신 주기가 불명확
