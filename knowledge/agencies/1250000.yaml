note: 통일부 데이터는 북한정보포털(동향·인물·지식), 북한자료센터, 남북회담, 남북교류협력(교역·왕래·허가법인), 개성공단, 이산가족, 북한이탈주민, 통일교육원 등 업무별 시스템으로 나뉘며, 대부분이 집계 통계나 문서·콘텐츠형 파일이다. 개체 단위 원장은 북한 인물·동향·합의서 API와 허가법인, 자료센터 소장자료 정도이고 기관 고유 키는 허가번호·청구기호 수준에 그쳐 시스템 간·타기관 간 키 연계가 매우 약하다.
