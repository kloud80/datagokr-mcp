gaps:
  - 대부분(약 100건)의 FILE 데이터가 열 정보 없이 미검증 상태라 실제 키 존재 여부 확인 불가
  - 북한 인물(15079264)·인명록에 인물 고유ID가 없어 동향·공개활동 데이터와 인물을 키로 연결할 수 없음
  - 허가법인(15106616)에 사업자번호·법인등록번호가 없어 국세청·법원 등기 등 외부 법인 원장과 연결 불가
  - 남북교역 품목코드(15060583)의 코드체계(HS/MTI)가 명시되지 않아 관세청 무역통계와 직접 대응 불확실
  - 개성공단 데이터는 2016년 가동중단 이후 갱신이 사실상 중단된 이력 통계이며 입주기업 개체 식별자가 없음
  - 이산가족·북한이탈주민은 개인정보 보호로 개체 원장이 비개방이고 집계 통계만 제공
  - 남북회담·합의서·회담문서 사이에 회담ID 같은 공통 키가 없어 회담 단위 통합 조회가 어려움
  - DMZ 인근 POI는 자체 식별자 없이 이름·주소·좌표·법정동코드만 있어 원천 인허가 원장과의 중복·연계 판별이 어려움
