gaps:
  - 검사·점검 건별 내역에 설비 고유번호·고객번호·사업자등록번호가 없습니다. 같은 설비의 이력 추적과 타 기관 연계는 상호·주소 문자열 매칭에 의존해야 합니다.
  - 민원신청번호는 자가용안전진단과 ESS 사용전검사에만 있고, 그 원장(검사신청 전수 목록)은 개방되어 있지 않습니다.
  - 일반용 사용전점검 건별 내역은 경상북도판(15103227)만 공개되어 전국 단위 원장이 없습니다.
  - 발변전소 개선조치 데이터 10건은 열 정보가 없고 집계 통계뿐이어서, 개별 발전소(전기사업허가·발전기 ID) 단위로 연결할 수 없습니다.
  - 전기화재·감전사고는 연도·지역별 집계만 있고 개별 사고 원장이 비개방이라 소방청 화재자료와 건 단위로 대조할 수 없습니다.
  - 전기안전정보공개 API(15146770)와 다중이용시설 점검 API(15159822)는 열 정보가 확인되지 않아 키 구조를 검증할 수 없습니다.
  - 다수의 통계 파일은 연도별 단발성 집계로 보여 갱신 여부를 확인하기 어렵습니다.
