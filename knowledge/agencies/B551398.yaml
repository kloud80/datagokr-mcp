note: 한국전기안전공사 데이터는 전기설비 검사·점검 업무시스템이 중심입니다. 사용전검사(태양광·ESS·연료전지), 특별안전점검, 안전등급 이력, 자가용발전 등록이 개체 단위 원장 역할을 하지만, 설비 고유키 없이 상호·주소·지역 문자열로만 식별됩니다. 기관 내부에서 공통으로 쓰이는 키는 사업소코드(사업소명) 정도이고, 나머지 상당수는 전기재해·점검 실적의 집계 통계와 홍보 영상 콘텐츠입니다.
