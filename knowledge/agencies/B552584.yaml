gaps:
  - 에어코리아 최종확정 측정자료(15122830)와 저공해차 목록(15084603)은 열 정보가 비어 있는 미검증 상태여서 측정값·차종 원장 활용이 불확실함
  - 대기오염정보 API(15073861)는 informCode·dataTime만 노출되어 측정소별 실시간 측정값을 측정소 키로 결합하기 어려움
  - 폐기물 배출사업장 데이터(15048021·15126438·15068827)에 사업자번호가 없어 처리업체·행정처분과는 업체명으로만 연결 가능함
  - TMS 굴뚝코드(stack_code)와 사업장 사업자번호·인허가번호의 매핑이 개방되지 않음
  - 공공하수처리시설 관련 데이터에 시설코드가 없어 처리장명 문자열로만 결합 가능함
  - 환경소음·도로·철도 소음측정망에 지점코드가 없어 지점명으로만 연결 가능함
  - 폐자원에너지(SRF)와 폐기물부담금은 사업장·부과 건 단위 원장 없이 집계 통계만 개방됨
  - 합성데이터(라돈·재비산먼지·생태독성·충전량·배경농도)는 실측 원장이 아니라 분석 신뢰성에 한계가 있음
  - 열 미기재 데이터(15065041·15127528·15124263·15137591 등)가 많아 구조 파악이 불가능함
