note: 한국환경공단 데이터는 에어코리아·TMS·실내공기질·소음 등 측정망 계열과 올바로·EPR·EcoAS·순환자원 등 폐기물·자원순환 계열, 저공해차·충전 인프라 계열로 나뉜다. 기관 간·시스템 간 공통 결합 키는 사업자등록번호(bizno)이며, 측정소명·충전기 ID·CAS 번호가 시스템 내부 기준키 역할을 한다. 다만 배출사업장·하수처리장·소음지점 데이터는 고유코드 없이 명칭 위주이고, 미검증·열 미기재 파일이 많아 결합성은 제한적이다.
