note: 한국국제협력단 데이터는 사업번호·시행계획번호로 관리되는 ODA 사업관리 원장(사업개요서·진행사업목록·IATI)과 통계사업번호 기반 실적통계가 중심이며, 해외봉사단·안전관리 데이터는 ISO 2자리 국가코드로 국가코드표와 이어진다. 조달·계약 데이터는 계약번호 체계는 있으나 사업번호·사업자번호가 없어 고립되어 있고, 나머지는 경영공시·홍보성 목록 데이터다.
