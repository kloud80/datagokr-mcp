gaps:
  - 원조조달 계약목록·발주계획에 사업번호가 없어 계약과 ODA 사업을 직접 연결할 수 없음
  - 계약업체·수의계약 상대방에 사업자등록번호가 없어 조달청·국세청 등 외부 기업정보와 결합 불가
  - 국가·지역·분야별 실적통계와 다수 FILE 목록은 국가명 텍스트만 있고 ISO 국가코드가 없어 이름 매칭에 의존
  - 해외봉사단 현장사업·파견현황에 사업번호·파견기관코드가 없어 봉사단 활동과 국별사업 연계가 어려움
  - 15158380·15158394·15158399 API는 열이 ITEMS로만 노출되어 실제 키 필드 확인 불가
  - 15051099·15099255·15111006·15120020·15120039·15120042·15151566은 열 정보가 없어 구조 파악 불가
  - 봉사단원·연수생 등 개인 단위 원장과 사업별 집행(지출) 원장은 비개방
