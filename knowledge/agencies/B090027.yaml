gaps:
  - 교육통계 학교 개황·학교별 학과별 데이터셋 대부분에 열 정보가 공개되어 있지 않아, 학교코드(school_cd·univ_school_cd)의 존재 여부를 확인할 수 없다.
  - 졸업 후 상황(15042211)에는 단과대학명·학과명만 있고 학교명·학교코드가 없어 대학알리미나 교육부 학교 정보와 키로 연결할 수 없다.
  - 평생교육기관리스트와 영재교육기관현황에는 기관 고유코드 없이 기관명·주소만 있어, 기관 단위 결합은 이름이나 주소 매칭에 의존해야 한다.
  - 기본연구 조사자료는 2017~2019년분만 개방되어 있고 이후 갱신이 확인되지 않는다. 또 대부분 보고서 단위여서 응답 원자료의 구조는 알 수 없다.
  - 위프로젝트 현황은 2021년 4월 기준 단일 시점의 재편집 표로, 시계열 분석이 어렵다.
  - 교육통계 다수가 학교급·연도별 집계 파일로 분할되어 있어, 학교 단위 전수 원장을 하나로 재구성하기 어렵다.
