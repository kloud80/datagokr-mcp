note: 한국교육개발원 데이터는 교육통계조사(KESS)에서 나온 학교급별 개황·교원·학생 통계가 중심이고, 여기에 졸업자 취업통계, 평생교육·영재교육 기관 목록, 기본연구 보고서 묶음이 더해진 구조다. 열 정보가 대부분 비어 있고 공개된 열에도 학교코드 같은 고유 식별자가 없어, 기관 내외 데이터를 같은 키로 잇는 관계는 확인되지 않는다. 핵심 원장은 학교 개황과 학교별 학과별 데이터셋인데 대부분 미검증 상태다.
