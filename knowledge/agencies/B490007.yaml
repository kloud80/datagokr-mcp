gaps:
  - 수험자·자격취득자 개인 단위 원장은 비개방이며 응시·취득은 종목·연도·지역 집계 통계로만 제공됨
  - 직무분야별 자격통계(3072665~3072671), 취득자현황(15088896), CBT 통계(15081999) 등 다수가 종목코드 없이 종목명만 있어 종목 원장과 정확한 결합이 어려움
  - 해외취업 모집공고·해외기업 정보는 기업명(entNm)만 있고 기업 식별번호가 없어 공고-기업 연결 불가
  - 외국인고용(EPS) 구직·채용 데이터에 사업장 식별자(사업장관리번호·bizno)가 없고 다수 FILE은 열 정보가 비어 있음
  - 원격훈련모니터링 데이터는 운영 로그·코드성 자료가 대부분이며 HRD-Net 훈련과정ID와 연결되는 키가 없음
  - 기능경기대회 데이터는 연도·지역별 집계 위주로 대회·선수·입상자 식별자가 없음
  - 일학습병행 개발보고서·NCS 과거 데이터 등 다수 FILE 데이터는 열 구조가 공개되지 않아 활용 불가
