note: 한국산업인력공단 데이터는 Q-net 자격정보시스템(종목코드 jmcd 중심)과 NCS 시스템(능력단위코드·NCS 분류코드)이 양대 기준 원장이며, 과정평가형·일학습병행 시스템이 종목코드·능력단위코드·편성기준버전코드로 두 축을 잇는다. 월드잡(해외취업), EPS(외국인고용), 마이스터넷(기능경기·숙련기술), 원격훈련모니터링, 직업방송 등은 각자 독립된 업무 시스템으로 공통 키가 거의 없다. 전체 383건 중 다수가 집계 통계·운영 로그이고 개체 단위 원장은 소수이며 상당수가 미검증 상태다.
