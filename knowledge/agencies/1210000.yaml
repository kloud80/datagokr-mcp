gaps:
  - 사업자등록 전수 원장은 비개방이며 15081808은 번호 입력 시 상태만 돌려주는 조회형 API라 전수 목록 확보 불가
  - 통계 데이터 대부분이 열 정보가 없는 FILE로 업종코드·세무서코드 등 키 결합 여부를 확인할 수 없음
  - 기준·단순경비율 등 국세청 업종코드 체계가 안내 파일로만 제공되어 표준 업종코드 원장으로 쓰기 어려움
  - 주류 제조·판매 면허 개별 면허장 목록이 비개방이라 집계만 가능
  - 체납·양도·상속 등 납세자 단위 데이터는 개인정보로 비개방되어 지역·규모별 집계로만 분석 가능
  - 2013~2016년 단발성 통계·2020년 안내 자료 등 갱신이 중단된 자료가 다수
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 국세청 데이터는 사업자등록 상태조회 API(bizno)와 상업용건물·오피스텔 기준시가 고시(상가건물번호·법정동코드) 두 원장이 개체 단위 핵심이며, 나머지 대부분은 세목·체납·주류·불복 등 집계 통계와 세법 안내·영상 콘텐츠이다. 다른 기관과는 사업자등록번호로, 기준시가는 법정동코드+번지 기반 필지로 연결된다. 통계 파일 대부분은 열 정보가 없어 키 기반 결합이 제한적이다.
