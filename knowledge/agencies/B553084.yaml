gaps:
  - 자연환경조사·정밀조사 FILE과 API 대부분에 열 정보가 없어 조사지점ID·종코드 같은 결합 키를 확인할 수 없다.
  - 분류군 출현자료에 표준 종코드(국가생물종목록 코드)가 드러나 있지 않아, 종 단위 결합은 국명·학명 문자열 매칭에 의존해야 한다.
  - 전국자연환경조사는 차수(2~5차) 단위의 단속 자료여서 연속 시계열 분석이 어렵다.
  - 로드킬 신고 현황에는 도로명·종명만 있고 좌표나 지점ID가 없어 생태통로 위치와 연결하기 어렵다.
  - 생태자연도 API의 평가 등급은 공간자료로만 식별되며, 도엽이나 격자 같은 고유 식별자가 열에 없다.
  - 연구과제 기본정보와 성과 데이터 사이의 과제번호 열을 확인할 수 없어 과제-성과 연결이 불확실하다.
  - 수어영상동화 80여 건은 개별 영상 콘텐츠여서 구조화된 데이터로 활용하기 어렵다.
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 국립생태원 데이터는 EcoBank를 중심으로 한 전국자연환경조사·정밀조사의 분류군별 공간자료와, 이를 평가해 만든 생태자연도가 핵심이다. 외래생물·LMO, 로드킬·생태통로, 습지 같은 주제별 시스템이 그 주위에 있다. 다만 목록 대부분에 열 정보가 없고 종·지점에 고유코드가 드러나지 않아, 데이터 사이 결합은 종명·습지명 문자열과 공간 중첩에 주로 의존한다.
