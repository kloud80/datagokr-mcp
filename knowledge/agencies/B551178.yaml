gaps:
  - 항공사코드 원장(코드표)이 개방되지 않고 운송실적 통계는 항공사·공항을 명칭 문자열로만 기록해 코드 기반 조인이 어려움
  - 항공기 등록번호(aplRegNo)는 실시간 API 한 곳에만 있고 기체 원장이 없어 기체 단위 이력 분석 불가
  - 실시간 운항·주차·주기장 API는 현재 시점만 제공하여 과거 이력 축적본이 없음
  - 입점업체·임대계약에 사업자등록번호가 없어 외부 사업자 정보와 연결 불가
  - 기내반입금지·실내공기질·차량유입·입점업체가 공항별 개별 데이터로 쪼개져 있어 통합 시 수작업 필요
  - 교통약자 시설 위치, AED 위치, 도면 이미지, 저시정경보 등은 열 정보가 공개되지 않아 구조 파악 불가
  - 인천국제공항은 관할 외라 전국 항공 수송을 이 기관 데이터만으로 완결할 수 없음
  - 시설·소방·계류장 등 시설 제원은 연 단위 스냅샷 파일로 갱신 시점이 불명확
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 한국공항공사 데이터는 운항정보시스템(FIS)의 편 단위 스케줄·실시간 운항 데이터와 이를 집계한 항공운송실적 통계가 중심이며, IATA/ICAO 공항코드와 운항편명·fid가 운항 계열을 잇는 핵심 키다. 그 밖에 시설·소음·상업시설·주차·보안검색·환경 데이터가 공항 단위로 흩어져 있으나 대부분 공항 명칭으로만 묶이고 미검증 상태이며, 항공사·기체 원장은 개방되지 않았다.
