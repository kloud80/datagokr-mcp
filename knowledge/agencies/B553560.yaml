note: 울산시설공단 데이터는 체육시설, 울산대공원·공원녹지, 하늘공원 장사시설, 공영주차장, 시설물·안전, 경영공시의 6개 업무 영역에서 나온 FILE 데이터로 구성된다. 공식 식별코드 없이 시설명·주차장명 문자열이 사실상의 연결 키이며, 시설물현황(15055509)이 시설 기준 목록 역할을 하나 미검증 상태다. 개체 단위 원장보다 이용요금·실적·현황 집계가 대부분이어서 외부 기관 데이터와의 키 기반 결합은 제한적이다.
