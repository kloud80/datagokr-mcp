note: 한국농어촌공사 데이터는 농업기반시설 표준코드(저수지 등)를 중심으로 시설제원·안전점검·인허가·수질·수위정보가 연결되는 농업용수 축과, 농지은행·농지전용·부담금 등 지역 단위 통계 위주의 농지 축, 농촌관광·지역개발 마을 정보 축으로 구성된다. 시설 계열은 표준코드로 비교적 잘 묶이지만 방류량·저수율 시계열 상당수는 시설명만 있어 결합이 약하고, 농지·마을 계열은 개체 키 없이 집계나 명칭 기반으로 개방되어 있다.
