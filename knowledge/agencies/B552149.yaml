  - 전국 저수지 일별 저수율(15113475)·특정저수지 수위 데이터는 시설명만 있고 표준코드가 없어 시설제원 원장과 정확히 연결하기 어려움
  - 하구둑·방조제·호 일일방류량 데이터가 시설별 개별 파일로 분산되어 있고 시설코드 열이 없음
  - 방조제 시설제원(15044341)에 표준코드 열이 없어 다른 시설 데이터와 키 결합 불가
  - 지하수 등고선·관리지역·관정현황 등 GIS 데이터와 농업생산기반정비통계연보·환지정보·담양호·장성호 방류량 등은 열 정보가 없어 구조 확인 불가
  - 농지은행(농지연금·임대수탁·매입비축) 데이터는 지역·연도 집계 통계뿐이고 계약·필지 단위 원장은 비개방
  - 농촌체험휴양마을·으뜸촌·체험프로그램·현장포럼 마을이 고유코드 없이 마을명으로만 연결됨
  - 종전부동산 사업지구와 공고관리가 사업지구명 문자열로만 연결됨
  - 수위 관측소 정보(15117317)는 하천코드만 있고 관측소 고유코드가 없음
