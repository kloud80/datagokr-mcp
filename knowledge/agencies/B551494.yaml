note: 한국가스기술공사 데이터는 수소충전소 운영, 자체 전자입찰, 플랜트 엔지니어링·정비, 배관 굴착안전관리, 연구관리, 홈페이지 CMS, 안전·환경 및 경영공시 시스템으로 나뉘며 대부분 연도·지사별 집계 파일이다. 개체 단위 원장으로는 수소충전소(검증·핵심 3건), 입찰공고, 프로젝트, 지식재산권, 부서정보 정도이며 고유 코드는 입찰공고코드·프로젝트코드·부서코드 등 내부 코드에 그친다. 외부 기관과 공유하는 표준 키는 지재권 등록번호 외에 거의 없어 타 기관 데이터와의 결합은 명칭·주소 매칭에 의존한다.
