gaps:
  - 수소충전소에 고유 코드가 없어 환경부·한국환경공단 충전소 정보나 다른 기관 충전소 ID와 명칭·주소로만 매칭 가능
  - 지역별 수소충전소 운영현황이 충전소마다 별도 파일로 쪼개져 있어 전체 시계열 통합이 번거로움
  - 입찰공고코드는 자체 시스템 코드로 나라장터 입찰공고번호와 연결되지 않으며 계약 결과 원장(계약번호·낙찰자 사업자번호)은 비개방
  - 협력업체정보에 사업자등록번호가 없어 외부 기업 데이터와 연결 불가
  - 굴착공사 관리 데이터는 지사·연도별 집계 위주이고 개별 굴착공사 원장(EOCS)은 미신고 건만 공개
  - 지식재산권·연구보고서·지침서·영상 등 다수 파일이 열 정보가 없는 문서·미디어 형태여서 구조화 분석이 어려움
  - 배관 구간·공급관리소 등 설비 단위 식별자가 없어 정비·검사 실적을 설비별로 추적할 수 없음
