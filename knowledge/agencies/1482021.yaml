gaps:
  - 사업장 단위 배출시설 원장(env_facility_no)·사업자번호가 어떤 데이터에도 없어 통합허가·특정수질유해물질·비산배출 사업장을 타 기관 인허가와 연결 불가
  - 전국오염원조사 통계 FILE 다수(15071102 등)와 15149345·15149349가 열 정보 없이 개방되어 구조 확인 불가
  - 수질측정망 지점(ptNo)·생물측정망 지점·조류경보 지점(SWMN_CODE)의 지점 원장이 별도 개방되지 않음
  - 금속성분 실시간(15016368)의 stationcode가 일반대기측정망 측정소코드와 같은 체계인지 확인 불가
  - 환경영향평가 API 다수가 ExceptionText만 응답해 실제 항목 확인 불가, FILE(1514288x)과 3순위 FILE(1515708x)이 중복
  - 골프장 농약사용량(spotStdCode)과 잔류량(골프장번호) 간 공통 키 없음
  - 대기환경연보·월보, 가습기살균제 건강모니터링 등은 보고서형 비정형 자료로 기계적 분석 불가
  - 수질오염총량 지류총량·개발관리지역 자료가 열 없이 개방되어 단위유역 키 활용 불가
analyzed_by: claude-opus-5-5
analyzed_at: 2026-10-05
note: 국립환경과학원 데이터는 대기측정망(측정소코드), 물환경·오염원조사(환경기초시설코드), 환경영향평가(사업코드), 자동차 환경인증(배출가스 인증번호) 4개 축이 중심이며 각 축 안에서는 고유 코드로 잘 연결된다. 반면 배출 사업장 단위 식별자가 없어 사업장·시설 수준의 타 기관 연계는 주소에 의존해야 하고, 다수 FILE은 보고서·통계형이거나 열 정보 없이 미검증 상태다.
