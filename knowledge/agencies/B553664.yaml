gaps:
  - 승강기 원장에는 안전인증번호가 없고 모델명 문자열만 있어, 설치 승강기와 인증 모델·제조공장을 키로 연결하기 어렵다.
  - 유지관리업체·제조업체·인증업체가 업체명으로만 표기되고 사업자등록번호(bizno)가 없어 타 기관 사업자 데이터와 연계할 수 없다.
  - 승강기 사고 현황(15138390)에는 승강기 식별자가 없어 원장이나 검사 이력과 결합할 수 없다.
  - 승강기 검사 결과(15112639)는 내부 '검사결과이력조회코드'만 제공하고 승강기고유번호가 없어 승강기별 결합이 어렵다.
  - 건물관리번호1·2가 건축물대장 PK(bldg_register_pk)나 도로명 건물관리번호와 같은 체계인지 불명확해 국토교통부 건축물 데이터와 키로 연계하기 어렵다.
  - 승강기관리번호와 고유번호가 병행 사용되며, 대응표는 변경 현황(15138072)에만 있다.
  - 보유현황·설치추이·사고/고장통계 등 일부 파일(15123449, 15123450, 15123453, 15123456 등)은 열 정보가 비어 있어 구조를 확인할 수 없다.
  - 교육센터·홈페이지·ERP 데이터는 집계·로그 위주이고 개체 키가 없어, 교육 이수와 승강기 안전관리자를 연결할 수 없다.
  - 검사 접수번호·인증 신청 순번은 원장(전수 목록) 데이터가 개방되지 않았거나 열이 공개되지 않았다(15151291, 15155202).
