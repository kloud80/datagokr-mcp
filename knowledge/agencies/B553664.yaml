note: 한국승강기안전공단 데이터는 승강기안전종합정보망의 승강기 원장(승강기고유번호·관리번호·건물관리번호)을 축으로 한다. 이 원장을 중심으로 검사업무(콤비스마트)와 사고·고장, 자체점검 데이터가 연결되는 구조이다. 이와 별도로 승강기안전기술원의 안전인증 시스템이 안전인증번호·접수번호·인증품목조합코드로 자체 체계를 이루지만, 설치 승강기 원장과는 공통 키가 없다. 상당수 데이터는 교육·홈페이지·ERP·수수료 등 내부 운영 테이블이며 사업자번호 같은 범용 키가 없어 외부 연계성은 낮다.
