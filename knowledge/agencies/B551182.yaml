gaps:
  - 요양기호가 암호화되어 있어 국립중앙의료원 hpid나 LOCALDATA 인허가번호와 직접 연결할 키가 없습니다. 기관명·주소 매칭에 의존해야 합니다.
  - 요양기관 폐업 현황(15051056), 감염병 치료시설(15085951), 분만가능 기관(15160285), 전문병원(15051054)에는 요양기호 열이 없어 원장과 정확히 조인하기 어렵습니다.
  - 병원정보서비스(15001698)와 비급여진료비(15001700)는 공개된 열 목록이 잘려 있거나 비어 있어 키·항목을 확인할 수 없습니다.
  - 보건의료빅데이터개방시스템 통계 대부분이 미검증이고 열 정보가 없어 구조를 확인할 수 없습니다.
  - 진료 자료는 집계·표본으로만 제공되어 개별 환자나 명세서 단위 분석은 원격분석 신청 없이는 불가능합니다.
  - 치료재료(3074384)의 코드 열이 다른 데이터에 없어 치료재료 청구통계와 연결 키가 불명확합니다.
  - 약효분류번호의 코드 원장이 별도로 개방되지 않았습니다.
