note: 건강보험심사평가원 데이터는 세 축으로 구성됩니다. 암호화 요양기호(ykiho)로 묶이는 요양기관 현황·평가 정보, 약가마스터·상병마스터·수가기준 같은 심사 기준 코드 원장, 그리고 이 코드로 해석되는 대량의 진료비 집계 통계입니다. 의약품은 품목기준코드로 식약처와 이어지고, 상병·행위·약품 코드가 통계와 기준정보를 연결하는 공통 키입니다. 다만 요양기관 키가 암호화되어 있어 외부 기관 의료기관 데이터와의 연결은 제한적입니다.
