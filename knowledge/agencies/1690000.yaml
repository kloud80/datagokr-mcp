gaps:
  - 조달·방산업체 데이터에 사업자등록번호가 없어 업체명으로만 식별되며 타 기관 기업정보와 결합이 어려움
  - 입찰참여업체정보(15050921)는 업체명·대표자뿐이라 어떤 입찰에 참여했는지 연결 키가 없음
  - 국외조달 계약정보·국내 계약정보에 입찰공고번호·판단번호가 없어 계약과 입찰공고를 직접 잇기 어려움
  - 국방규격공개(15089081)·ITAR·보도자료·설문조사는 열 정보가 없고 국방표준종합서비스 API는 응답 봉투 열만 공개되어 구조 확인 불가
  - 연구개발·사업분석·계약집행 데이터는 연도별 집계뿐이라 사업(무기체계) 단위 분석 불가
  - 방산업체 지정현황과 원가관리체계 인증업체 간 공통 업체 식별자가 없음
