note: 방위사업청 데이터의 중심은 국방전자조달시스템(D2B)으로, 판단번호(조달계획)→입찰공고번호→계약번호 흐름으로 국내·국외·시설공사 조달이 이어지고 GW API가 같은 키를 제공한다. 군수품 품목은 재고번호·군급분류·규격번호로 국방표준·목록화 원장과 연결되나 해당 원장 다수가 미검증이다. 업체 측은 사업자번호가 없어 업체명 기반 결합에 의존하며, 나머지는 연도별 통계와 행정 운영 자료다.
