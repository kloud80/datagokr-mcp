gaps:
  - 실태조사 데이터는 대부분 열 정보가 없는 샘플 파일이며, 원자료(마이크로데이터) 전수는 개방되지 않음
  - 산업백서는 2020년판 위주라 최신 연도로의 갱신이 확인되지 않음
  - 입주기업·해외기업·셀러콘텐츠·기획업 등록기업 등 기업 데이터 대부분에 사업자번호가 없어, 기관 간 기업 단위 연결이 어려움(기능성게임 게임사정보만 예외)
  - 대중문화예술기획업 종사경력증명의 관리번호가 등록번호와 연결되는지 불명확함
  - 지원사업공고·금융지원정보·정기간행물 API 3건은 열 구성이 공개되지 않아 키 확인이 불가함
  - 게임자격검정 데이터에 종목코드가 없고 시험종목 명칭만 있어, 큐넷 국가자격 종목코드와 직접 연결할 수 없음
  - 에듀코카 과정체계도·교육운영정보는 과정코드 없이 과정명으로만 연결됨
