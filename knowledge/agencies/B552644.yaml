note: 한국콘텐츠진흥원 데이터는 콘텐츠수출마케팅플랫폼, 산업통계·백서·실태조사, 그리고 CKL기업지원센터·에듀코카·게임자격검정 등 소규모 운영 시스템으로 나뉜다. 법정 등록 원장인 대중문화예술기획업 등록기업 현황과 콘텐츠산업분류–표준산업분류 연계표만 검증된 핵심이다. 나머지는 대부분 미검증 파일이며, 고유 식별자가 부족해 데이터 간 연결은 주로 명칭 기반이다.
