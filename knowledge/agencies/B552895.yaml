note: 농림수산식품교육문화정보원 데이터는 유통정보(경락·조사가격)와 이를 표준화하는 표준코드 체계가 중심이며, 표준 품목·시장·법인코드가 유통가격과 농업ON 포털을 잇는 핵심 키다. 팜맵은 PNU로 병해충·기상·토양검정을 필지 단위로 결합해 국토부·농진청과 연계된다. 나머지 6차산업·도시농업·농촌마을·지식콘텐츠는 포털별 내부 일련번호만 있어 외부 결합성이 낮고, 거의 모든 데이터가 미검증·열 미공개 상태다.
