note: 한국철도공사 데이터는 차세대예약발매(여객)와 철도운영정보 KROIS(공통기준·화물) 두 운영 시스템의 코드 원장을 축으로, 그 위에 대량의 수송통계·시설현황 FILE과 카드사 결합 빅데이터 분석물이 얹힌 구조다. 핵심 연결키는 역코드(STN_CD/stn_cd)이며, 열차번호·노선코드·화차차량번호가 보조 키로 쓰인다. 다만 통계 파일 상당수는 역명 문자열만 갖고 있고, 미검증·열 미공개 데이터가 절반 이상이어서 시스템 간 정밀 결합에는 제약이 크다.
