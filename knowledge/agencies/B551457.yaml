gaps:
  - 다수 FILE 통계(역별 승하차·운행거리·시설현황)가 역코드 없이 역명 문자열만 있어 표기 차이로 조인 오류가 생긴다.
  - 역코드 체계가 예약발매 STN_CD, 운영정보 역코드, 전철역 번호(15110022)로 나뉘어 있고, 전철역 번호의 매핑표는 개방되지 않았다.
  - 개별 차량(차량번호) 원장이 비개방이다. 공통기준_차량 데이터(15153836)에 차량번호가 없어 FRACAS·편성정보와 차량을 연결할 수 없다.
  - 화차·컨테이너·예약번호의 원장(화물 수탁 15153561, 예약 양식 15153842)이 미검증이거나 열이 공개되지 않아 화물 건 단위 추적이 어렵다.
  - 연도별 품목별 수송실적·노선별 시설현황 다수가 미검증이고 열 정보가 없어 시계열 갱신 여부를 확인할 수 없다.
  - 빅데이터 이용객 분석 자료는 일회성 집계라 갱신이 중단됐고, 다수가 열 정보 없는 보고서다.
  - 임대자산·임대관리 FILE(15048397·15048398)에 역코드·자산번호가 없어 임대매장 API와 연결하기 어렵다.
  - 입찰공고만 있고 계약·낙찰 결과는 개방되지 않았다.
  - 실시간 열차 위치·지연 정보가 없다. 열차운행정보는 계획 시각만 제공한다.
