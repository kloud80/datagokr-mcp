id: early-childhood-care
name: 영유아 돌봄 (0~7세)
dimension: life_context
question: 우리 아이 어디에 맡길까 — 어린이집·유치원·돌봄
note: 어린이집(복지부, 영유아보육법)과 유치원(교육부, 유아교육법)은 부처·코드가 다르지만 부모에게는 같은 선택지. 초등돌봄(교육청)·다함께돌봄(복지부)까지 0~12세 돌봄이 4개 체계로 나뉜다. 영유아·아동 시설 매핑표(어린이집코드·유치원코드·사회복지시설코드)가 선결 과제
