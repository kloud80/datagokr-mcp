id: corporate-health
name: 회사 상태 조기 신호 (휴폐업·고용·공시)
dimension: life_context
question: 이 회사 지금 괜찮나 — 거래처·법인이 망할지, 휴업·폐업했는지 재무제표보다 먼저 알 수 있는 신호 (실시간 상태 추정)
note: >-
  재무제표는 1년에 한 번 늦게 공개된다. 더 빨리 움직이는 신호는 국세청 사업자 상태(계속·휴업·폐업, 실시간 조회)와
  국민연금 사업장 가입자 수·신규·상실(매월, 고용 증감)이다. 공시·기업기본정보가 법인등록번호·사업자번호로 붙는다.
