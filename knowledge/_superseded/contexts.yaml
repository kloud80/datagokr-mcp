# 맥락 연결 (context) — 부처가 달라 BRM 부문은 다르지만 국민 입장에서는 같은 맥락인 데이터를 잇는다 (구름 2026-09-29).
# "어린이집(복지부)과 유치원(교육부)은 다른 카테고리지만 부모에게는 같은 질문" 같은 연결을 차원별로 정리해 관계망에 반영한다.
#
# dimension (연결 차원) — 무엇이 같은가:
#   life_context       국민의 생애·상황 맥락이 같다 (같은 질문에 함께 답해야 한다)
#   spatial_regulation 같은 필지·공간에 겹쳐 걸리는 규제 레이어 (PNU·폴리곤으로 겹친다)
#   admin_area         같은 행정구역 단위(시군구·시도 × 월/연) 지표라 지역으로 나란히 놓인다
#   shared_key         같은 식별 키로 조인된다 (key에 keys.yaml id)
#   shared_source      같은 원천 시스템에서 나온다 (공통 원장 하나를 부문별로 잘라 쓴다)
#   same_concept       같은 개념을 다른 기관이 다른 기준·값으로 낸다 (대표 선정·기준 차이 서술 필요)
#   economic           돈·거래·자본 흐름으로 이어진다 (수출입 사슬·연기금·소상공인 매출 등)
#
# members: {sector, subsector} — subsector를 생략하면 부문 전체. role은 선택(맥락 안에서 맡는 역할).
# 컴파일: context 노드 1개 + member --in_context--> context (props: dimension, role, key). note는 벡터화 문서.
- id: early-childhood-care
  name: 영유아 돌봄 (0~7세)
  dimension: life_context
  question: 우리 아이 어디에 맡길까 — 어린이집·유치원·돌봄
  note: '어린이집(복지부, 영유아보육법)과 유치원(교육부, 유아교육법)은 부처·코드가 다르지만 부모에게는 같은 선택지. 초등돌봄(교육청)·다함께돌봄(복지부)까지 0~12세 돌봄이 4개 체계로 나뉜다. 영유아·아동 시설 매핑표(어린이집코드·유치원코드·사회복지시설코드)가 선결 과제

    '
  members:
  - sector: 사회복지 - 보육·가족및여성
    subsector: childcare-centers
    role: 어린이집
  - sector: 교육 - 유아및초·중등교육
    subsector: kindergarten
    role: 유치원
  - sector: 교육 - 유아및초·중등교육
    subsector: after-school-care
    role: 초등돌봄
  - sector: 사회복지 - 보육·가족및여성
    subsector: child-family-facilities
    role: 지역아동센터·다함께돌봄
