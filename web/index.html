<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공데이터 전략 도우미</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e4e3de;--acc:#1f5eff;--acc2:#e8eeff;--ok:#12805c;--warn:#b25e00;--bad:#b3261e;--code:#f2f1ec}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1c1c1a;--ink:#ecebe6;--mute:#9b9a94;--line:#2e2d2a;--acc:#7aa2ff;--acc2:#1f2740;--ok:#4cc38a;--warn:#e0a24a;--bad:#ff8a80;--code:#23231f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:700}header .stats{color:var(--mute);font-size:12.5px}
main{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,1.25fr);height:calc(100% - 49px)}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#plan{border-left:none;border-top:1px solid var(--line)}}
#chat{display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow:auto;padding:18px 20px}
.msg{margin:0 0 14px;max-width:92%}.msg.user{margin-left:auto;background:var(--acc2);padding:9px 13px;border-radius:12px 12px 2px 12px}
.msg.assistant{background:var(--panel);border:1px solid var(--line);padding:11px 14px;border-radius:12px 12px 12px 2px}
.msg.assistant p{margin:.35em 0}.msg ul{margin:.3em 0;padding-left:1.2em}.msg code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px}
.meta{color:var(--mute);font-size:12px;margin-top:6px}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}.examples button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.examples button:hover{border-color:var(--acc)}
form{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--panel)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);height:48px}
form button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}form button:disabled{opacity:.5}
#plan{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 20px;min-height:0}
#plan h2{font-size:15px;margin:0 0 4px}.goal{color:var(--mute);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 12px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--mute);padding:7px 10px;cursor:pointer;border-bottom:2px solid transparent;font:inherit;font-size:13.5px}
.tabs button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card .t{font-weight:600}.role{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;margin-right:6px;background:var(--acc2);color:var(--acc)}
.role.context{background:var(--code);color:var(--mute)}.small{font-size:12.5px;color:var(--mute)}
.ev{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--mute)}
.rate{font-weight:600}.rate.hi{color:var(--ok)}.rate.mid{color:var(--warn)}.rate.none{color:var(--mute)}
pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.45}
a{color:var(--acc)}a.ds{cursor:pointer;text-decoration:underline dotted}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.pill{font-size:11.5px;border:1px solid var(--line);border-radius:9px;padding:0 7px;margin-left:4px;color:var(--mute)}
dialog{width:min(900px,92vw);max-height:86vh;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0}
dialog .head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
dialog .body{padding:4px 18px 18px;overflow:auto;max-height:calc(86vh - 52px)}
dialog table{border-collapse:collapse;font-size:12.5px}dialog td,dialog th{border:1px solid var(--line);padding:3px 6px;vertical-align:top}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><h1>공공데이터 전략 도우미</h1><span class="stats" id="stats"></span></header>
<main>
<section id="chat">
  <div id="log">
    <div class="msg assistant"><p>하고 싶은 일을 말씀해 주세요. data.go.kr에서 <b>어떤 데이터를</b>, <b>왜</b>, <b>어떻게 이어서</b> 쓰면 되는지 실제 검증 결과를 근거로 안내하고 실행 코드까지 만들어 드립니다.</p>
      <div class="examples" id="examples"></div></div>
  </div>
  <form id="f"><textarea id="q" placeholder="예) 성수동 상권 변화를 월 단위로 추적하고 싶어" autofocus></textarea><button id="send">보내기</button></form>
</section>
<section id="plan"><div class="empty">전략이 만들어지면 여기에 데이터·조인·파이프라인·코드가 나타납니다.</div></section>
</main>
<dialog id="dlg"><div class="head"><b id="dlgT"></b><button onclick="dlg.close()">닫기</button></div><div class="body" id="dlgB"></div></dialog>
<script>
const EX=["성수동 상권 변화를 월 단위로 추적하고 싶어","이 아파트 실거래가와 공시지가를 비교하고 싶어","가맹본부가 믿을 만한지 확인하려면?","지금 가까운 응급실과 병상 현황","우리 아이 어린이집·유치원 고르기","나라장터 입찰공고부터 계약까지 따라가기"];
const log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send'),planEl=document.getElementById('plan');
let history=[],lastPlan=null,tab='data';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(t){ // 아주 작은 markdown: 굵게·코드·목록·문단·링크 — 목록키(8자리 숫자)는 상세 링크
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\b(1\d{7}|3\d{6})\b/g,'<a class="ds" data-id="$1">$1</a>');
  const out=[];let list=false;
  for(const line of h.split('\n')){const m=line.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/);
    if(m){if(!list){out.push('<ul>');list=true}out.push('<li>'+m[1]+'</li>')}
    else{if(list){out.push('</ul>');list=false}if(line.trim())out.push('<p>'+line.replace(/^#+\s*/,'')+'</p>')}}
  if(list)out.push('</ul>');return out.join('');
}
function add(role,html,meta){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html+(meta?`<div class="meta">${meta}</div>`:'');log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
document.getElementById('examples').innerHTML=EX.map(e=>`<button type="button">${esc(e)}</button>`).join('');
document.getElementById('examples').onclick=e=>{if(e.target.tagName==='BUTTON'){q.value=e.target.textContent;ask()}};
document.getElementById('f').onsubmit=e=>{e.preventDefault();ask()};
q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask()}};
log.onclick=planEl.onclick=e=>{const a=e.target.closest('a.ds');if(a)openDs(a.dataset.id)};
async function ask(){
  const text=q.value.trim();if(!text)return;q.value='';send.disabled=true;
  add('user',esc(text));history.push({role:'user',content:text});
  const wait=add('assistant','<span class="spinner"></span>데이터를 찾고 조인 경로를 계산하는 중…');
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const j=await r.json();if(!r.ok)throw new Error(j.detail||r.status);
    wait.remove();add('assistant',md(j.reply),`${j.elapsed_s}s · 도구 ${j.trace.map(t=>t.tool).join(', ')||'없음'}`);
    history.push({role:'assistant',content:j.reply});if(j.plans&&j.plans.length){lastPlan=j.plans[j.plans.length-1];renderPlan()}
  }catch(err){wait.innerHTML='오류: '+esc(err.message)}finally{send.disabled=false;q.focus()}
}
function rate(j){if(j.match_rate==null)return '<span class="rate none">실측 보류</span>';const p=Math.round(j.match_rate*100);return `<span class="rate ${p>=80?'hi':'mid'}">실측 ${p}%</span>`}
function renderPlan(){
  const p=lastPlan;if(!p)return;
  const T={data:`데이터 ${p.datasets.length}`,joins:`조인 ${p.joins.length}`,pipe:'파이프라인',code:'코드',more:`후보·단서 ${p.candidates.length+p.unverified_leads.length}`};
  let body='';
  if(tab==='data')body=p.datasets.map(d=>`<div class="card"><div><span class="role ${d.role==='context'?'context':''}">${d.role}</span><span class="t">${esc(d.title)}</span> <a class="ds small" data-id="${d.id}">${d.id}</a></div>
    <div>${esc(d.why)}</div><div class="small">${esc(d.agency)} · ${d.access.channel==='external'?'외부 사이트 키 '+esc(d.access.issuer):'포털 활용신청 '+esc(d.access.approval||'')}${d.access.daily_limit?' · 일 '+d.access.daily_limit.toLocaleString()+'회':''}</div>
    <div class="ev">근거 ${d.evidence.join(', ')}${d.caveats.length?' · 주의 '+d.caveats.join(', '):''}</div></div>`).join('')||'<div class="empty">검증 데이터 없음</div>';
  if(tab==='joins')body=p.joins.map(j=>`<div class="card"><div class="t">${j.edge} · ${j.rel}</div><div><a class="ds" data-id="${j.left}">${j.left}</a> ⋈ <a class="ds" data-id="${j.right}">${j.right}</a>${j.hub?` <span class="pill">허브 ${esc(j.hub)}</span>`:''}</div>
    <div class="small">${esc((j.on.left||[]).join('+'))} = ${esc((j.on.right||[]).join('+'))}${j.on.transform?' · 규칙 '+j.on.transform:''}${j.via_mapping?' · 매핑 '+esc(j.via_mapping):''} · ${esc(j.relationship||'')} · ${rate(j)}</div></div>`).join('')
    +(p.gaps.length?`<div class="card"><div class="t">공백·경로 없음</div><ul>${p.gaps.map(g=>'<li>'+esc(g)+'</li>').join('')}</ul></div>`:'')||'<div class="empty">조인 없음</div>';
  if(tab==='pipe')body='<ol>'+p.pipeline.map(s=>`<li>${s.do==='fetch'?'받기 <a class="ds" data-id="'+s.dataset+'">'+s.dataset+'</a>':'조인 '+s.edge+' — '+esc(s.note||'')}</li>`).join('')+'</ol>'
    +(p.schedule?`<div class="small">갱신: ${esc(p.schedule.reason)}</div>`:'<div class="small">갱신 주기: 실측 관찰(7일 재호출) 전 — 근거 없음</div>');
  if(tab==='code')body=`<button onclick="navigator.clipboard.writeText(lastPlan.code)">복사</button><pre>${esc(p.code)}</pre>`;
  if(tab==='more')body='<h3 style="font-size:14px">선정됐지만 미검증 (candidate)</h3>'+(p.candidates.map(c=>`<div class="card"><span class="t">${esc(c.title)}</span> <a class="ds small" data-id="${c.id}">${c.id}</a><div class="small">${esc(c.status||'')} ${c.blocked_by?'· '+esc(c.blocked_by):''}</div></div>`).join('')||'<div class="small">없음</div>')
    +'<h3 style="font-size:14px">단서 — 포털 목록에서 비슷한 것 (catalog, 직접 확인 필요)</h3>'+(p.unverified_leads.map(l=>`<div class="card"><a href="${esc(l.portal_url)}" target="_blank">${esc(l.title)}</a> <span class="small">${esc(l.agency)} · 유사도 ${l.similarity}</span><div class="small">${esc(l.why_maybe)}</div></div>`).join('')||'<div class="small">없음</div>');
  planEl.innerHTML=`<h2>전략</h2><div class="goal">${esc(p.goal)} · ${p.context?'맥락 '+esc(p.context)+' · ':''}신뢰도 ${p.confidence} · 지식 ${esc(p.knowledge_version)}</div>
    <div>${esc(p.summary)}</div><div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';renderPlan()">${v}</button>`).join('')}</div>${body}`;
}
async function openDs(id){
  const dlg=document.getElementById('dlg');document.getElementById('dlgT').textContent=id;document.getElementById('dlgB').innerHTML='<span class="spinner"></span>불러오는 중';dlg.showModal();
  const r=await fetch('/api/datasets/'+id);if(!r.ok){document.getElementById('dlgB').textContent='지식 체계에 없는 데이터입니다 (포털 목록만).';return}
  const j=await r.json();document.getElementById('dlgT').textContent=j.dataset.title;
  document.getElementById('dlgB').innerHTML=j.dossier_md?mdTable(j.dossier_md):'<pre>'+esc(JSON.stringify(j.dataset,null,1))+'</pre>';
}
function mdTable(t){ // 설명서: 표·제목·목록만 간단히
  const lines=t.split('\n'),out=[];let tbl=[];
  const flush=()=>{if(tbl.length){out.push('<table>'+tbl.filter(r=>!/^\|[-| ]+\|$/.test(r)).map((r,i)=>'<tr>'+r.slice(1,-1).split('|').map(c=>(i?'<td>':'<th>')+esc(c.trim())+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>');tbl=[]}};
  for(const l of lines){if(l.startsWith('|')){tbl.push(l);continue}flush();
    if(/^#{1,3} /.test(l))out.push(`<h${l.match(/^#+/)[0].length+1}>${esc(l.replace(/^#+ /,''))}</h${l.match(/^#+/)[0].length+1}>`);
    else if(l.startsWith('- '))out.push('<div>• '+esc(l.slice(2))+'</div>');else if(l.trim()&&!l.startsWith('>'))out.push('<p>'+esc(l)+'</p>')}
  flush();return out.join('');
}
fetch('/api/stats').then(r=>r.json()).then(s=>{document.getElementById('stats').textContent=`검증 ${s.datasets.verified||0} · 후보 ${s.datasets.candidate||0} · 포털 목록 ${s.catalog.toLocaleString()} · 실측 조인 ${s.measured_edges} · 코드표 ${s.code_lists}`});
</script>
</body>
</html>
