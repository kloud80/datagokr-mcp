[project]
name = "datagokr-mcp"
version = "0.1.0"
description = "지식 기반 공공데이터 전략 시스템"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "pyyaml>=6",
    "anthropic>=1.8",
    "playwright>=1.45",
    "jsonschema>=4.20",
    "pydantic>=2.8",
    "ruamel.yaml>=0.18",
    "networkx>=3.3",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
semantic = ["fastembed>=0.7"]  # 의미 검색 (multilingual-e5, 처음 쓸 때 모델 2.2GB 내려받음) — 없으면 BM25만

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pds*"]
